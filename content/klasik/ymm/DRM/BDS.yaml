  soru: '**Olay:** Yıldız Orman Ürünleri A.Ş., bağımsız denetime tabi, payları borsada işlem görmeyen bir şirkettir. 31.12.2025
    tarihli finansal tablolar hakkındaki denetçi raporu 20.03.2026 tarihlidir; raporda karşılaştırmalı 2024 finansal tablolarına
    da atıf yapılmıştır. Üst yönetimden sorumlu olanların tamamı işletme yönetiminde icrai görev üstlenmemektedir. Mevzuat,
    denetçinin hileye ilişkin bildirimlerde bulunmasını yasaklamamaktadır.


    Aşağıdaki hususlar ortaya çıkmıştır:


    1. Yönetim, yazılı beyan mektubunu 31.12.2025 tarihli düzenlemiş ve yalnızca 2025 dönemi finansal tablolarını kapsayacak
    şekilde imzalamıştır.

    2. Yönetim, hileye ilişkin yazılı beyan vermek istememekte; “işletmeyi etkileyen hiçbir hile bilgisi” konusunda yazılı
    beyan vermeyi reddetmektedir.

    3. Denetçi, iç kontrolde önemli görevleri bulunan muhasebe şefinin hasılat kayıtlarında sahte alacak kaydı yaptığını tespit
    etmiştir; muhasebe şefi dışında hileye karışan kimse yoktur.

    4. Finansal tablolar 10.04.2026’da yayımlanmış; denetçi 05.05.2026’da, denetçi raporu tarihinde bilseydi raporunu değiştirmesine
    yol açabilecek bir durumdan haberdar olmuştur. Mevzuat veya finansal raporlama çerçevesi, yönetimin finansal tablolarda
    yapabileceği değişikliği bu duruma sınırlayan bir hüküm içermemektedir.


    **İstenenler:**


    (a) Birinci maddedeki beyan mektubunun tarihi ve kapsadığı dönemler BDS 580 bakımından uygun mudur? Gerekçesiyle açıklayınız.
    (4 puan)


    (b) BDS 240 uyarınca yönetimden (ve uygun hâllerde üst yönetimden sorumlu olanlardan) hileye ilişkin hangi konularda yazılı
    beyan alınması gerektiğini belirtiniz; yönetimin talep edilen yazılı beyanlardan bir veya daha fazlasını sunmaması hâlinde
    BDS 580 uyarınca denetçinin yapması gerekenleri açıklayınız. (6 puan)


    (c) Üçüncü maddedeki hile bakımından BDS 240 uyarınca denetçinin bildirim yükümlülüklerini (kime, ne zaman) ve hilenin
    yetkili bir kuruma rapor edilmesi konusundaki yükümlülüğünü açıklayınız. (5 puan)


    (d) Dördüncü madde bakımından BDS 560 uyarınca denetçinin yapması gerekenleri; yönetimin finansal tablolarda değişiklik
    yapması ve yapmaması hâllerini ayrı ayrı belirterek açıklayınız. (5 puan)

    '
  cozum: '**(a) Beyan mektubunun tarihi ve kapsamı (4 puan)**


    - BDS 580 par. 14: Yazılı beyanların tarihi, finansal tablolara ilişkin denetçi raporu tarihinden **sonra olamaz; ancak
    bu tarihe mümkün olan en yakın tarih** olmalıdır. Mektubun 31.12.2025 tarihli olması bu şartı sağlamaz; tarih 20.03.2026’ya
    mümkün olan en yakın tarih olmalıdır.

    - Yazılı beyanlar, denetçi raporunda atıf yapılan **tüm finansal tabloları ve dönemleri** kapsar; raporda 2024 karşılaştırmalı
    tabloları da yer aldığından beyanlar yalnızca 2025 ile sınırlı olamaz.


    **(b) Hileye ilişkin beyanlar ve sunulmaması (6 puan)**


    - BDS 240 par. 40: Denetçi yönetimden ve uygun hâllerde üst yönetimden sorumlu olanlardan şunlara dair yazılı beyan alır:
    (1) hilenin önlenmesine ve tespit edilmesine yönelik iç kontrolün tasarlanması, uygulanması ve işleyişinin sürdürülmesine
    ilişkin **sorumluluklarını kabul ettiklerine**; (2) finansal tabloların hile kaynaklı önemli yanlışlık içerebileceği riskine
    ilişkin yönetim değerlendirmesinin **sonuçlarını açıkladıklarına**; (3) işletmeyi etkileyen ve yönetimin, iç kontrolde
    önemli görevleri bulunan çalışanların veya finansal tablolarda önemli etki oluşturan bir hile yapabilecek konumdaki diğer
    kişilerin dâhil olduğu **gerçekleşmiş veya şüphelenilen hileler hakkında bilgilerini açıkladıklarına**; (4) çalışanlar,
    eski çalışanlar, analistler, düzenleyici kurumlar veya başkaları tarafından bildirilen **hile iddiaları veya şüpheleri**
    hakkında bildiklerini açıkladıklarına.

    - BDS 580 par. 19: Yönetim talep edilen yazılı beyanlardan birini veya daha fazlasını sunmazsa denetçi (1) konuyu yönetimle
    **müzakere eder**; (2) yönetimin **dürüstlüğünü yeniden değerlendirir** ve bunun beyanların (sözlü veya yazılı) ve genel
    olarak denetim kanıtlarının güvenilirliği üzerindeki etkisini değerlendirir; (3) par. 20’yi dikkate alarak BDS 705 uyarınca
    bu durumun görüşe olan muhtemel etkisinin belirlenmesi dâhil **uygun adımları atar**.


    **(c) Hilenin bildirimi (5 puan)**


    - BDS 240 par. 41: Hileyi tespit eden denetçi, mevzuatla yasaklanmadığı sürece konuyu **yönetimin uygun kademesindeki
    kişilere zamanında bildirir**.

    - Par. 42: Üst yönetimden sorumlu olanların tamamı icrai görev üstlenmediğinden ve hileye iç kontrolde önemli görevleri
    bulunan bir çalışan (muhasebe şefi) dâhil olduğundan denetçi bu konuyu **üst yönetimden sorumlu olanlara zamanında bildirir**.
    (Yönetimin dâhil olduğu bir hileden şüphelenme söz konusu olmadığından, denetim prosedürlerinin müzakeresine ilişkin zorunluluk
    bu olayda gündeme gelmez.)

    - Par. 44: Denetçi, mevzuat veya etik hükümlerin hileyi **yetkili bir kuruma rapor etmesini zorunlu kılıp kılmadığına**
    ve içinde bulunulan şartlarda rapor edilmesinin uygun olup olmadığı konusunda sorumluluk yükleyip yüklemediğine **karar
    verir**.


    **(d) Finansal tabloların yayımlanmasından sonra haberdar olma (5 puan)**


    - BDS 560 par. 14: Yayımdan sonra denetçinin finansal tablolarla ilgili denetim prosedürü uygulama yükümlülüğü bulunmaz;
    ancak raporunu değiştirmeye yol açabilecek bir durumdan haberdar olursa konuyu yönetimle (ve uygun hâllerde üst yönetimden
    sorumlu olanlarla) **müzakere eder**, finansal tablolarda **değişiklik gerekip gerekmediğine karar verir** ve gerekliyse
    yönetimin bunu nasıl ele almayı planladığını sorgular.

    - **Yönetim değişiklik yaparsa** (par. 15-16): Denetçi gerekli prosedürleri uygular; daha önce yayımlanmış tabloların
    ve raporun ulaştığı kişilerin değişiklikten haberdar edildiğinden emin olmak üzere yönetimin aldığı tedbirleri gözden
    geçirir; 6 ve 7. paragraflardaki prosedürleri yeni rapor tarihine kadar genişletir; değiştirilmiş tablolara ilişkin **yeni
    bir denetçi raporu** sunar ve bu rapora değiştirilmiş finansal tabloların onaylandığı tarihten önceki bir tarih vermez;
    yeni raporda Dikkat Çekilen Hususlar veya Diğer Hususlar paragrafı yer alır ve değişikliğin nedenini açıklayan dipnota
    ve önceki rapora atıfta bulunur.

    - **Yönetim değişiklik yapmaz ve ilgili kişileri haberdar etmezse** (par. 17): Denetçi, gelecekte denetçi raporuna güvenilmesini
    engellemeye yönelik uygun adımları atacağını yönetime ve (üst yönetimden sorumlu olanların tamamı icrai görev üstlenmediğinden)
    üst yönetimden sorumlu olanlara bildirir; bu bildirime rağmen gerekli adımlar atılmazsa denetçi, rapora güvenilmesini
    engellemeye yönelik **uygun adımları atar**.

    '
