- id: YMM-DRM-BDS-K006
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 570 işletmenin sürekliliği
  - BDS 200 genel ilkeler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Marmara Denizcilik A.Ş., 6102 sayılı TTK uyarınca bağımsız denetime tabi, payları borsada işlem görmeyen
    bir şirkettir. 31.12.2025 tarihli finansal tabloları, gerçeğe uygun sunum çerçevesi niteliğindeki TFRS’ye uygun olarak
    ve işletmenin sürekliliği esasına göre hazırlanmıştır. Üst yönetimden sorumlu olanlar arasında icrai görev üstlenmeyen
    yönetim kurulu üyeleri de bulunmaktadır.


    Bağımsız denetçi, denetim sırasında aşağıdaki bilgileri elde etmiştir:


    | Kalem | Tutar (milyon TL) |

    |---|---|

    | Dönen varlıklar | 310 |

    | Kısa vadeli yükümlülükler | 520 |

    | Bu yükümlülüklerin içinde 30.06.2026’da vadesi dolacak ana banka kredisi | 480 |


    Banka, krediyi yenileyeceğine ilişkin bir taahhütte bulunmamıştır. Yönetimin planı, bir gemisini satarak krediyi kısmen
    kapatmak ve kalan tutar için yeniden yapılandırma görüşmesi yürütmektir. Denetçi, ilave denetim prosedürleri uygulamış
    ve sürekliliğe ilişkin ciddi şüphe oluşturabilecek bu olay ve şartlarla ilgili olarak önemli bir belirsizliğin mevcut
    olduğu sonucuna varmıştır. Yönetimin işletmenin sürekliliği esasını kullanmasını ise uygun bulmuştur.


    **İstenenler:**


    (a) Finansal tablo dipnotlarında önemli belirsizliğe ilişkin yeterli açıklamanın yapıldığını varsayarak; BDS 570 uyarınca
    denetçinin açıklamalarla ilgili belirlemesi gereken iki hususu, vereceği görüş türünü ve denetçi raporunda yer vereceği
    bölümü (başlığı ve iki amacıyla birlikte) açıklayınız. (7 puan)


    (b) Dipnotlarda önemli belirsizliğe ilişkin yeterli açıklamanın yapılmadığını varsayarak; denetçinin vereceği görüşü ve
    raporunun hangi bölümünde neyi belirteceğini açıklayınız. (5 puan)


    (c) Bağımsız denetçinin, yönetimin sürekliliği esasını kullanmasının uygun olmadığı sonucuna vardığını (finansal tabloların
    ise yine bu esasa göre hazırlanmış olduğunu) varsayarak vereceği görüşü belirtiniz. Ayrıca bu işletmede denetçinin, ciddi
    şüphe oluşturabileceğini belirlediği olay veya şartlar hakkında üst yönetimden sorumlu olanlarla kuracağı iletişimin kapsamını
    açıklayınız. (6 puan)


    (d) Denetçi, (c) şıkkında belirtilen iletişimi hiç kurmamış, ancak raporunda “denetim, BDS’lere uygun olarak yürütülmüştür”
    ifadesini kullanmak istemektedir; iletişimi kurmamayı gerektiren istisnai bir durum yoktur. BDS 200’e göre bu ifadenin
    kullanılıp kullanılamayacağını, denetçinin bir BDS hükmünden hangi koşulda sapabileceğini ve ilgili BDS’de belirtilen
    bir amaca ulaşamaması hâlinde ne yapması gerektiğini açıklayınız. (7 puan)

    '
  cozum: '**(a) Yeterli açıklama yapılmışsa (7 puan)**


    - BDS 570 par. 19: Denetçi finansal tablolarda (1) ciddi şüphe oluşturabilecek temel olay veya şartlar ile yönetimin bunları
    ele almaya ilişkin planlarının **yeterince açıklanıp açıklanmadığını** ve (2) önemli belirsizliğin mevcut olduğunun; dolayısıyla
    işletmenin olağan iş akışı içinde varlıklarından fayda sağlamasının ve yükümlülüklerini yerine getirmesinin mümkün olmayabileceğinin
    **açık bir şekilde açıklanıp açıklanmadığını** belirler.

    - Par. 22: Yönetimin sürekliliği esasını kullanması uygun, önemli belirsizlik mevcut ve yeterli açıklama yapılmışsa denetçi
    **olumlu görüş** verir.

    - Denetçi raporunda **“İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik”** başlığı altında ayrı bir bölüm yer alır.
    Amaçları: (i) 19. paragrafta belirtilen hususları açıklayan finansal tablo dipnotlarına dikkat çekmek, (ii) sürekliliğe
    ilişkin ciddi şüphe oluşturabilecek olay veya şartlarla ilgili önemli bir belirsizliğin mevcut olduğunu ve bu hususun
    denetçi görüşünü değiştirmediğini belirtmek.


    **(b) Yeterli açıklama yapılmamışsa (5 puan)**


    - Par. 23: Denetçi BDS 705 uyarınca **sınırlı olumlu görüş (şartlı görüş) veya olumsuz görüşten uygun olanı** verir (açıklama
    eksikliğinin önemi ve yaygınlığına göre).

    - Raporun **Sınırlı Olumlu (veya Olumsuz) Görüşün Dayanağı** bölümünde, sürekliliğe ilişkin ciddi şüphe oluşturabilecek
    önemli bir belirsizliğin mevcut olduğunu ve bu hususun finansal tablolarda yeterince açıklanmadığını belirtir.


    **(c) Sürekliliği esasının uygun olmaması ve üst yönetimle iletişim (6 puan)**


    - Par. 21: Finansal tablolar sürekliliği esasına göre hazırlanmış, ancak yönetimin bu esası kullanması denetçinin yargısına
    göre uygun değilse denetçi **olumsuz görüş** verir.

    - Par. 25: Üst yönetimden sorumlu olanların tamamı icrai görev üstlenmediğinden denetçi, ciddi şüphe oluşturabileceğini
    belirlediği olay veya şartlar hakkında **üst yönetimden sorumlu olanlarla iletişim kurar**. İletişim şunları içerir: (1)
    olay veya şartların önemli bir belirsizlik oluşturup oluşturmadığı, (2) yönetimin sürekliliği esasını kullanmasının uygun
    olup olmadığı, (3) ilgili finansal tablo açıklamalarının yeterliliği, (4) varsa denetçi raporu üzerindeki etkiler.


    **(d) BDS 200 çerçevesinde uyum (7 puan)**


    - BDS 570 par. 25 şartı (üst yönetimden sorumlu olanların tamamının icrai görev üstlenmemesi) mevcuttur; hüküm bu denetimle
    ilgilidir ve BDS 200 par. 22’deki iki istisna (BDS’nin tamamının ilgisiz olması; şarta bağlı hükmün şartının bulunmaması)
    uygulanamaz. Denetçi, denetimle ilgili tüm BDS’lerin hükümlerine uymadığı sürece raporunda denetimin BDS’lere uygun yürütüldüğünü
    **belirtemez** (par. 20).

    - Sapma (par. 23): Yalnızca istisnai durumlarda ve ancak (i) hüküm uygulanacak özel bir prosedürle ilgiliyse ve (ii) bu
    prosedür, denetimin yürütüldüğü şartlarda hükmün amacına ulaşılması konusunda yetersizse beklenir; bu durumda denetçi
    hükmün amacına ulaşmak için **alternatif denetim prosedürleri** uygular.

    - Par. 24: İlgili BDS’de belirtilen bir amaca ulaşılamazsa denetçi bunun genel amaçlarına ulaşmasını engelleyip engellemediğini
    ve olumlu dışında görüş vermeyi veya (mevzuata göre mümkünse) denetimden çekilmeyi gerektirip gerektirmediğini değerlendirir;
    durum BDS 230 uyarınca belgelendirilmesi gereken önemli bir durumdur.

    '
  puanlama:
  - olcut: (a) Par. 19 uyarınca açıklamalarla ilgili iki hususun (temel olay/şartlar ve planların yeterince açıklanması; önemli
      belirsizliğin ve varlıklardan fayda sağlama/yükümlülükleri yerine getirmenin mümkün olmayabileceğinin açık açıklanması)
