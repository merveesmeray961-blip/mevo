    - Yönetimin gelecekteki adımlara ilişkin planlarını değerlendirir: planların iyileşme ihtimali olup olmadığı ve içinde
    bulunulan şartlarda uygulanabilir olup olmadığı (ör. ortak avansı için yazılı taahhüt bulunmaması planın uygulanabilirliğini
    zayıflatır).

    - Nakit akış tahmini yönetimin planlarının değerlendirilmesinde önemli bir unsur olduğundan, tahminin hazırlanması için
    üretilen temel verilerin güvenilirliğini değerlendirir ve tahminin temelini oluşturan varsayımlar (ortak avansı, tahsilat
    ve ödeme varsayımları) için yeterli dayanak olup olmadığına karar verir.

    - Yönetimin değerlendirme yaptığı tarihten itibaren herhangi bir ilave bilgi veya durumun ortaya çıkıp çıkmadığını (ör.
    bankanın krediyi geri isteme yazısı) değerlendirir.

    - Yönetimden ve uygun hâllerde üst yönetimden sorumlu olanlardan, gelecekte atacakları adımlara ilişkin planlar ve bu
    planların uygulanabilirliği konusunda yazılı beyan talep eder.

    - Not: Yönetim ön değerlendirmesinde olay veya şart belirlememiş olsa da denetçi denetim boyunca bu tür kanıtlara karşı
    dikkatlidir (par. 11) ve yönetimin değerlendirmesinin, denetçinin haberdar olduğu ilgili tüm bilgileri içerip içermediğini
    mütalaa eder (par. 14).


    **(c) BDS 240 (6 puan)**


    - Denetçi, diğer risk değerlendirme prosedürlerinden ve ilgili çalışmalardan elde edilen bilgilerin bir veya daha fazla
    hile riski faktörünün varlığına işaret edip etmediğini değerlendirir (par. 25); kovenant ihlali baskısı bir hile riski
    faktörü olabilir. Hile riski faktörleri hilenin varlığına ilişkin kesin bir gösterge değildir, ancak hile kaynaklı önemli
    yanlışlık risklerine işaret edebilir.

    - Genel işler kapsamında denetçi, başta subjektif ölçümler ve karmaşık işlemlerle ilgili olanlar olmak üzere muhasebe
    politikaları seçiminin ve uygulamasının, yönetimin kazanç yönetimi yapma çabasından kaynaklanan hileli finansal raporlamanın
    bir göstergesi olup olmadığını değerlendirir (par. 30); işe ilişkin gerekçesi bulunmayan stok değerleme yöntemi değişikliği
    bu bakımdan dikkate alınır.

    - Yönetimin sorgulanması sırasında alınan cevaplar tutarsızsa denetçi bu tutarsızlıkları araştırır (par. 15); ayrıca gerçekleşmiş,
    şüphelenilen veya iddia edilen hile bilgisi için yönetimi sorgular (par. 19).

    '
