- id: YMM-DRM-BDS-K007
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 200 genel ilkeler
  - BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Olay:** Bağımsız denetçi, Anadolu Kimya A.Ş.’nin 31.12.2025 tarihli finansal tablolarının denetimini yürütmektedir.
    Şirketin satışları yılın son çeyreğinde yoğunlaşmaktadır. Denetçi, hasılatın dönemsellik (kesim) beyanına ilişkin riski,
    hile kaynaklı olabileceği gerekçesiyle ciddi risk olarak değerlendirmiştir. Satış kayıtları yalnızca elektronik ortamda
    tutulmaktadır.


    Denetçi, 01.01–30.09.2025 ara dönemi için aşağıdaki çalışmaları yapmıştır:


    | Çalışma | Sonuç |

    |---|---|

    | Satış faturaları ile sevkiyat belgelerinin eşleştirilmesine ilişkin kontrol testi (40 örnek) | 3 sapma |

    | Hasılat detay testi (25 fatura) | 2 faturada sevkiyat tarihi 30.09.2025’ten sonradır; toplam 540.000 TL hasılat erken
    kaydedilmiştir |


    Denetçi başlangıçta kontrollerin etkin işlediği beklentisiyle kalan dönem için yalnızca ek kontrol testleri planlamıştır.
    Ara dönemde saptanan yanlışlıklar denetçinin beklemediği yanlışlıklardır.


    **İstenenler:**


    (a) Hasılatın dönemsellik beyanına ilişkin risk bakımından, BDS 315 uyarınca denetçinin hangi kararları vermesi gerektiğini;
    BDS 330 uyarınca bu ciddi riske karşı nasıl bir maddi doğrulama prosedürü uygulaması gerektiğini ve yalnızca maddi doğrulama
    prosedürleri uygulayacaksa bunların kapsamını açıklayınız. (6 puan)


    (b) Ara dönemde beklemediği yanlışlıkların saptanması üzerine denetçinin yapması gereken değerlendirmeyi ve ara dönem
    sonuçlarını kalan döneme genişletebilmesi için başvurabileceği iki yolu açıklayınız. (6 puan)


    (c) Kontrol testlerindeki sapmalar karşısında BDS 315 uyarınca risk değerlendirmesinin ne olacağını; BDS 330 uyarınca
    denetçinin denetimi tamamlamadan önce yapması gereken değerlendirmeyi ve elde edilen kanıtları ele alış biçimini açıklayınız.
    (4 puan)


    (d) Denetçi, zorunlu kılınan tüm prosedürleri uygulamasına rağmen yeterli ve uygun denetim kanıtı elde edilip edilmediği
    konusunda tereddüt yaşamaktadır. BDS 200 ve BDS 330 uyarınca denetçinin bu tereddüdü nasıl ele alacağını ve yeterli kanıt
    elde edilemezse ne yapacağını açıklayınız. (4 puan)

    '
  cozum: '**(a) Ciddi risk ve maddi doğrulama (6 puan)**


    - BDS 315 par. 32: Denetçi, “önemli yanlışlık” riski olarak değerlendirilen riskin **ciddi risk olup olmadığına karar
    verir**; par. 33: yönetim beyanı düzeyindeki risklerden herhangi biri için **maddi doğrulama prosedürlerinin tek başına
    yeterli ve uygun kanıt sağlayamamasının söz konusu olup olmadığına** karar verir (kayıtlar yalnızca elektronik ortamda
    tutulduğundan bu değerlendirme gündeme gelir).

    - BDS 330 par. 21: Ciddi risk için **özellikle o riske karşılık veren** bir maddi doğrulama prosedürü uygulanır. Ciddi
    riske karşı **yalnızca** maddi doğrulama prosedürleri uygulanacaksa bu prosedürler **detay testlerini de içerir** (yalnızca
    analitik prosedürle yetinilemez).


    **(b) Ara dönemde beklenmeyen yanlışlık (6 puan)**


    - BDS 330 par. 23: Denetçi, ilgili risk değerlendirmesinin ve ara dönemden sonra kalan dönemi kapsayan maddi doğrulama
    prosedürlerinin planlanan niteliğinin, zamanlamasının ve kapsamının **değiştirilmesinin gerekip gerekmediğini değerlendirir**.
    Sapma ve erken kayıtlar (540.000 TL) bu değerlendirmeyi gerektirir.

    - Par. 22: Ara dönem sonuçlarının dönem sonuna genişletilmesi için makul dayanak, kalan dönem için (1) **kontrol testleriyle
    birlikte maddi doğrulama prosedürleri** uygulamak veya (2) yeterli olduğuna karar verirse **sadece ilave maddi doğrulama
    prosedürleri** uygulamak suretiyle sağlanır. Soruda sapma ve yanlışlık bulunduğundan ikinci yolun yeterli olup olmadığı
    dikkatle değerlendirilmelidir.


    **(c) Risk değerlendirmesi ve kanıtların değerlendirilmesi (4 puan)**


    - BDS 315 par. 37: Risk değerlendirmesinin dayandığı kanıtlarla (kontrollerin etkin işlediği beklentisi) tutarsız yeni
    bilgi edinildiğinden denetçi belirlemeyi/değerlendirmeyi **revize eder**.

    - BDS 330 par. 25: Denetimi tamamlamadan önce, uygulanan prosedürlere ve elde edilen kanıtlara dayanarak yönetim beyanı
    düzeyindeki **risk değerlendirmelerinin uygunluğunun devam edip etmediğini** değerlendirir. Par. 26: yönetim beyanlarını
    doğrulayıp çelişmesine bakmaksızın **ilgili tüm kanıtları** mütalaa eder.


    **(d) BDS 200 ve yeterli kanıt (4 puan)**


    - BDS 200 par. 21: Denetçi, BDS’lerin zorunlu kıldıklarına ek olarak başka bir prosedürün gerekip gerekmediğine karar
    vermek ve yeterli ve uygun kanıt elde edilip edilmediğini değerlendirmek için ilgili BDS’lerdeki **amaçları**, BDS’ler
    arasındaki karşılıklı ilişkileri de dikkate alarak **kullanır**.

    - BDS 330 par. 27: Yeterli ve uygun kanıt elde edemezse **daha fazla kanıt elde etmeye çalışır**; yine elde edemezse **sınırlı
    olumlu görüş verir veya görüş vermekten kaçınır**.

    '
  puanlama:
  - olcut: (a) Ciddi risk olup olmadığına ve maddi doğrulamanın tek başına yeterli kanıt sağlayıp sağlamayacağına karar verileceğinin
      belirtilmesi (BDS 315 par. 32-33)
    puan: 3
  - olcut: (a) Ciddi riske özellikle o riske karşılık veren maddi doğrulama prosedürü ve yalnızca maddi doğrulama ise detay
      testi şartı (BDS 330 par. 21)
    puan: 3
  - olcut: (b) Beklenmeyen yanlışlık hâlinde risk değerlendirmesi ile kalan dönem prosedürlerinin niteliğinin, zamanlamasının
      ve kapsamının değiştirilmesi gerekip gerekmediğinin değerlendirilmesi (par. 23)
    puan: 3
  - olcut: '(b) Genişletme için iki yol: kontrol testleriyle birlikte maddi doğrulama veya yeterliyse yalnızca ilave maddi
      doğrulama (par. 22)'
    puan: 3
  - olcut: (c) Tutarsız yeni bilgi nedeniyle risk değerlendirmesinin revize edilmesi (BDS 315 par. 37)
    puan: 2
  - olcut: (c) Denetimi tamamlamadan önce risk değerlendirmelerinin uygunluğunun yeniden değerlendirilmesi ve tüm kanıtların
      mütalaası (BDS 330 par. 25-26)
    puan: 2
  - olcut: (d) Ek prosedür ve kanıt yeterliliği kararında BDS amaçlarının kullanılması (BDS 200 par. 21)
    puan: 2
  - olcut: (d) Daha fazla kanıt aranması; elde edilemezse sınırlı olumlu görüş veya görüş vermekten kaçınma (BDS 330 par.
      27)
    puan: 2
  kaynaklar:
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: par. 32, 33, 37
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 21, 22, 23, 25, 26, 27
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: par. 21
