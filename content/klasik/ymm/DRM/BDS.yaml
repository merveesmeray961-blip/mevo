  soru: '**Olay:** Bağımsız denetçi Mert Aydoğan, Orion Gıda Dağıtım A.Ş.’nin 31.12.2025 tarihli finansal tablolarını denetlemektedir.
    Finansal tablolarda yer alan 11.900.000 TL tutarındaki stoklar finansal tablolar açısından önemlidir. İşletme fiziki stok
    sayımını 20.12.2025 tarihinde yapmış, denetçi sayıma katılmıştır. Sayım sonuçlarına göre 20.12.2025 itibarıyla stok tutarı
    12.400.000 TL’dir. 21.12.2025 – 31.12.2025 arasında 3.100.000 TL tutarında mal alınmış ve satışların maliyeti 4.250.000
    TL olarak kaydedilmiştir. Bu dönemde stok hareketini etkileyen başka bir işlem bulunmadığı varsayılacaktır. Denetçi bu
    verileri işletmenin ERP stok raporundan almıştır.


    Denetim sırasında şu hususlar belirlenmiştir: Depo müdürü, sayım sonrasında depodan fire veya hasar çıkışı olmadığını
    ilk görüşmede, “bir miktar hasarlı malın imha edildiğini” ise ikinci görüşmede söylemiştir. Ayrıca bir imha tutanağındaki
    tarih ve imza, aynı tutanak serisindeki diğer belgelerden farklı görünmektedir. Yönetimin yıl sonu kâr hedefini karşılamak
    için yoğun bir baskı altında olduğu da tespit edilmiştir. Denetçi, stoklara ve satışların maliyetine ilişkin hile kaynaklı
    önemli yanlışlık riski bulunduğuna karar vermiştir ve satışların maliyetine ilişkin kontrollere güvenmek istemektedir.


    **İstenenler:**


    (a) Fiziki sayımın finansal tablo tarihinden farklı bir tarihte yapılmasının BDS 501 uyarınca denetçiye yüklediği ek yükümlülüğü
    belirtiniz; verilere dayanarak 31.12.2025 için beklenen stok tutarını ve kayıtlı tutardan farkı hesaplayınız. (6 puan)


    (b) Denetçinin fiziki stok sayımına katılımı sırasında BDS 501 uyarınca gerçekleştirmesi gereken işlemleri ve ERP stok
    raporu gibi işletme tarafından oluşturulan bir bilgiyi kanıt olarak kullanırken BDS 500 uyarınca yapması gerekenleri açıklayınız.
    (6 puan)


    (c) Depo müdürünün tutarsız cevapları ile imha tutanağındaki tarih ve imza farklılığı karşısında BDS 240’a göre denetçinin
    yaklaşımını açıklayınız; yönetimin kâr hedefi baskısının BDS 240 bakımından niteliğini belirtiniz. (7 puan)


    (d) Denetçinin belirlediği hile kaynaklı riskin ciddi risk olarak ele alınmasının sonuçlarını, işletme kontrolleri ve
    güvenilmek istenen kontrollerin testi bakımından BDS 240 ve BDS 330’a göre açıklayınız. (6 puan)

    '
  cozum: '**(a) Farklı tarihte sayım ve hesap (6 puan)**


    BDS 501 par. 5’e göre fiziki sayımın finansal tablo tarihinden farklı bir tarihte yapılması durumunda denetçi, sayım tarihi
    ile finansal tablo tarihi arasında stoklarda meydana gelen değişikliklerin uygun olarak kaydedilip kaydedilmediğine ilişkin
    kanıt elde etmek için, par. 4 uyarınca zorunlu prosedürlere ek olarak denetim prosedürleri uygular.


    - Beklenen stok = 12.400.000 + 3.100.000 − 4.250.000 = **11.250.000 TL**

    - Kayıtlı stok 11.900.000 TL olduğundan fark = 11.900.000 − 11.250.000 = **650.000 TL** (kayıtlı tutar beklenenden fazladır).

    - Fark, stoklarda yanlışlık bulunabileceğine işaret eder; nedeni (kayıt dışı çıkışlar, imha, kesim hataları vb.) belgelerle
    araştırılır.


    **(b) Sayıma katılım ve işletme kaynaklı bilgi (6 puan)**


    - BDS 501 par. 4: Mümkün olan hâllerde sayıma katılarak (i) yönetimin sayım sonuçlarının kayıt ve kontrol edilmesine yönelik
    talimat ve prosedürlerini değerlendirir, (ii) yönetimin sayıma ilişkin prosedürlerinin uygulanmasını gözlemler, (iii)
    stokları tetkik eder, (iv) test sayımları yapar; ayrıca işletmenin nihai stok kayıtlarının sayım sonuçlarını doğru yansıtıp
    yansıtmadığına karar vermek için kayıtlara ilişkin denetim prosedürlerini uygular.

    - BDS 500 par. 9: İşletme tarafından oluşturulan bir bilgiyi (ERP stok raporu) kullanırken denetçi, bilginin yeterince
    güvenilir olup olmadığını değerlendirir; bunun için gerekli ölçüde bilginin doğruluğuna ve tamlığına ilişkin kanıt elde
    eder ve bilginin denetçinin amaçları açısından yeterince açık ve ayrıntılı olup olmadığını değerlendirir.


    **(c) Hile (7 puan)**


    - BDS 240 par. 15: Yönetimin sorgulanması sırasında alınan cevaplar tutarsızsa denetçi bu tutarsızlıkları araştırır; depo
    müdürünün birbiriyle çelişen cevapları araştırılır.

    - Par. 14: Denetçi, aksini düşünmesini gerektiren bir gerekçe olmadığı sürece belgeleri gerçek kabul edebilir; ancak imha
    tutanağındaki tarih ve imza farklılığı belgenin gerçek olmayabileceği veya tahrif edilmiş olabileceği inancına yol açıyorsa
    araştırmalarını derinleştirir.

    - Par. 19: Denetçi, gerçekleşmiş, şüphelenilen veya iddia edilen hile hakkında bilgi olup olmadığını belirlemek için yönetimi
    ve uygun hâllerde işletmedeki diğer kişileri sorgular.

    - Par. 25: Yönetimin yıl sonu kâr hedefi için yoğun baskı altında olması bir **hile riski faktörü** olabilir; hilenin
    varlığına ilişkin kesin bir gösterge değildir, ancak hile kaynaklı önemli yanlışlık risklerine işaret edebilir.


    **(d) Ciddi risk (6 puan)**


    - BDS 240 par. 28: Hile kaynaklı önemli yanlışlık riski olarak değerlendirilen riskler **ciddi risk** olarak ele alınır;
    henüz yapılmadıysa bu riskleri ele alan işletme kontrolleri belirlenir, tasarımları değerlendirilir ve uygulanıp uygulanmadıkları
    belirlenir.

    - BDS 330 par. 15: Denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik güvenmek istediği kontrolleri **cari dönemde**
    test eder; önceki denetimlerden elde edilen kanıtlara dayanılamaz.

    - BDS 240 par. 30: Prosedürlerin seçimine öngörülemezlik unsuru da dâhil edilir.

    '
