  soru: '**Olay:** Bağımsız denetçi Deniz Arslan, Karya Tekstil A.Ş.’nin 31.12.2025 tarihli finansal tablolarının denetimini
    yürütmektedir. Denetçi, hasılat hesabında yönetim beyanı düzeyinde “önemli yanlışlık” riskini yüksek değerlendirmiştir.


    Şirketin 2024 yılı hasılatı 48.000.000 TL, 2025 yılı kayıtlı hasılatı 68.500.000 TL’dir. Fiziki sevkiyat kayıtlarına göre
    2025 yılında satış miktarı 2024’e göre %10 artmış, fiyat listelerine göre ortalama birim satış fiyatı 2024’e göre %20
    artmıştır. Bu iki veri denetçi tarafından güvenilir bulunmuştur ve hasılattaki değişimi başka bir etkenin açıklamadığı
    varsayılacaktır. Denetçi, analitik maddi doğrulama prosedürü için beklenen hasılatı bu iki veriye dayanarak geliştirmiş
    ve ilave araştırma yapılmaksızın kabul edilebilir fark tutarını 1.500.000 TL olarak belirlemiştir.


    Denetçi ayrıca şirketin en büyük müşterisi Ada Konfeksiyon Ltd. Şti.’ye ait 9.200.000 TL tutarındaki ticari alacak için
    teyit mektubu göndermek istemiş; yönetim, “müşteri ilişkisinin ticari hassasiyeti nedeniyle” mektup gönderilmesine izin
    vermemiştir.


    **İstenenler:**


    (a) Denetçinin risk değerlendirme prosedürleri olarak uygulayacağı prosedür türlerini BDS 315’e göre sayınız ve bu prosedürlerin
    tasarımına ilişkin “taraflı olmama” ilkesini açıklayınız. (6 puan)


    (b) Beklenen hasılatı hesaplayınız; kayıtlı hasılat ile beklenen hasılat arasındaki farkı bulunuz ve farkın kabul edilebilir
    farkı aşıp aşmadığını belirtiniz. BDS 520’ye göre denetçinin beklentisini geliştirirken yapması gerekenleri açıklayınız.
    (8 puan)


    (c) Yönetimin teyit mektubu gönderilmesine izin vermemesi karşısında BDS 505’e göre denetçinin yapması gerekenleri ve
    yönetimin gerekçesini makul bulmaması hâlinde izleyeceği yolu açıklayınız. (8 puan)

    '
  cozum: '**(a) Risk değerlendirme prosedürleri (6 puan)**


    BDS 315 par. 14’e göre risk değerlendirme prosedürleri şunları içerir: (i) yönetimin ve varsa iç denetim fonksiyonundaki
    kişiler dâhil işletme içindeki diğer uygun kişilerin **sorgulanması**, (ii) **analitik prosedürler**, (iii) **gözlem ve
    tetkik**. Par. 13’e göre bu prosedürler, doğrulayıcı olabilecek kanıtları elde etme veya çelişkili olabilecek kanıtları
    hariç tutma eğiliminde olmayacak şekilde (taraflı olmayan biçimde) tasarlanır ve uygulanır.


    **(b) Analitik maddi doğrulama prosedürü (8 puan)**


    - Beklenen hasılat = 48.000.000 × 1,10 × 1,20 = **63.360.000 TL**

    - Fark = 68.500.000 − 63.360.000 = **5.140.000 TL**

    - Kabul edilebilir fark 1.500.000 TL olduğundan fark bu tutarı **3.640.000 TL aşmaktadır**; fark kabul edilebilir sınırı
    aşmıştır ve araştırılması gerekir (BDS 520 par. 7: yönetimin sorgulanması, yanıtlara ilişkin uygun kanıt elde edilmesi
    ve gerekli diğer prosedürlerin uygulanması).

    - BDS 520 par. 5’e göre denetçi; (i) analitik prosedürlerin ilgili yönetim beyanları için uygunluğuna, değerlendirilmiş
    önemli yanlışlık risklerini dikkate alarak karar verir, (ii) beklentinin dayanağı olan verilerin güvenilirliğini bilgilerin
    kaynağı, karşılaştırılabilirliği, niteliği ve hazırlanma süreci üzerindeki kontrolleri dikkate alarak değerlendirir, (iii)
    beklentisinin önemli bir yanlışlığı belirlemek için yeterince kesin olup olmadığını değerlendirir ve (iv) araştırma gerektirmeyen
    kabul edilebilir farkı belirler.


    **(c) Dış teyit – yönetimin izin vermemesi (8 puan)**


    BDS 505 par. 8’e göre denetçi: (i) izin vermeme kararıyla ilgili olarak yönetimin gerekçelerini sorgular ve bu gerekçelerin
    geçerliliği ve uygunluğu konusunda kanıt elde etmeye çalışır; (ii) izin vermemenin, hile riski dâhil ilgili önemli yanlışlık
    risklerine ilişkin değerlendirmesi ve diğer prosedürlerin niteliği, zamanlaması ve kapsamı üzerindeki etkilerini değerlendirir;
    (iii) ihtiyaca uygun ve güvenilir kanıt elde etmek için tasarlanan alternatif prosedürleri uygular (örneğin sonraki tahsilatların
    ve sevk belgelerinin incelenmesi).


    Par. 9’a göre yönetimin izin vermeme kararı makul bulunmazsa veya alternatif prosedürlerle ihtiyaca uygun ve güvenilir
    kanıt elde edilemezse denetçi, BDS 260 uyarınca üst yönetimden sorumlu olanlarla iletişim kurar ve BDS 705 uyarınca bu
    hususun denetime ve denetçi görüşüne etkilerine karar verir.

    '
