- id: YMM-DRM-BDS-K002
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 200 genel ilkeler
  - BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Bağımsız denetçi Pınar Tuna, Yıldız Otomotiv Yan Sanayi A.Ş.’nin 31.12.2025 tarihli finansal tablolarının
    denetimini yürütmektedir. Denetim ekibi şirketi altı yıldır denetlemektedir ve şirketin finansal tablolarında muhasebe
    tahminleri bulunmaktadır. Planlama toplantısında denetim ortağı şu görüşleri dile getirmiştir:


    1. “Yönetim altı yıldır bizi hiç yanıltmadı; bu yıl mesleki şüphecilik düzeyimizi düşürerek denetimi daha hızlı planlayalım.”

    2. “Muhasebe tahminlerine ilişkin BDS 540’ın uygulama ve diğer açıklayıcı hükümler bölümünü ekibe okutmamıza gerek yok;
    yalnızca numaralı ana hükümler bağlayıcıdır.”


    Toplantıya ekibin iki yeni üyesi katılamamıştır. Denetçi, geçen yıl satış sürecinde uyguladığı prosedürlerden ve işletmeye
    ilişkin önceki deneyiminden elde ettiği bilgileri bu yıl da kullanmak istemektedir.


    Denetçi, satış ve stok süreçlerindeki bazı kontrollere güvenmeyi planlamaktadır. Güvenilmek istenen kontrollere ilişkin
    bilgiler şöyledir:


    | No | Kontrol | Son test edilen denetim | Önceki denetimden beri önemli değişiklik | Kontrolün ele aldığı risk ciddi
    risk mi? |

    |---|---|---|---|---|

    | 1 | Satış siparişlerinin onayı | 2024 | Yok | Hayır |

    | 2 | Stok girişlerinin kaydı | 2022 | Yok | Hayır |

    | 3 | Dönem sonu yevmiye kayıtlarının onayı | 2023 | Yok | Hayır |

    | 4 | Fiyat listesi güncellemesi (ERP) | 2024 | Var (ERP sürümü değişmiştir) | Hayır |

    | 5 | Hasılatın finansal tablolara alınması | 2024 | Yok | Evet |


    Denetim yılı 2025’tir. Genel BT kontrollerinin etkin olduğu, kontrollerin manuel veya otomatik oluşuna ve personel değişikliklerine
    ilişkin başka bir olumsuz hususun bulunmadığı ve denetçinin mümkün olduğu ölçüde önceki denetim kanıtlarına dayanmak istediği
    varsayılacaktır. Ayrıca tabloda yer almayan tahsilat kontrollerinin işleyiş etkinliği 30.09.2025 tarihinde sona eren ara
    dönemde test edilmiş ve etkin bulunmuştur.


    **İstenenler:**


    (a) Denetim ortağının 1 ve 2 numaralı görüşlerini BDS 200 ve BDS 240 hükümleri çerçevesinde değerlendiriniz. (6 puan)


    (b) BDS 315 çerçevesinde risk değerlendirme prosedürlerinin neleri içerdiğini, denetçinin önceki deneyiminden ve önceki
    denetimlerde uyguladığı prosedürlerden elde ettiği bilgileri kullanırken ne yapması gerektiğini ve toplantıya katılamayan
    ekip üyelerine hangi konuların bildirileceğine kimin karar vereceğini belirtiniz. (6 puan)


    (c) BDS 330 çerçevesinde yukarıdaki beş kontrolden hangilerinin 2025 denetiminde cari dönemde test edilmesi gerektiğini,
    hangilerinde önceki denetim kanıtlarına dayanılabileceğini gerekçesiyle gösteriniz; önceki kanıtlara dayanılacak kontroller
    için denetçinin yapması gereken işlemi ve “bazı kontrollerin her denetimde test edilmesi” kuralını açıklayınız. (8 puan)


    (d) Tahsilat kontrollerine ilişkin ara dönem kanıtının yıl sonuna kadar kullanılabilmesi için BDS 330 uyarınca denetçinin
    yapması gerekenleri; güvenilen bir kontrolde sapma tespit edilmesi hâlinde yapılacakları ve maddi doğrulama prosedürlerinde
    hiçbir yanlışlık bulunmamasının kontrol etkinliği bakımından ne ifade ettiğini açıklayınız. (5 puan)

    '
  cozum: '**(a) BDS 200 ve BDS 240 değerlendirmesi (6 puan)**


    - **1 numaralı görüş yanlıştır.** BDS 200 par. 15’e göre denetçi, finansal tabloların önemli ölçüde yanlışlık içermesine
    sebep olan şartların bulunabileceğini kabul ederek denetimi mesleki şüphecilik içinde planlar ve yürütür. BDS 240 par.
    13’e göre denetçi, yönetimin ve üst yönetimden sorumlu olanların doğruluk ve dürüstlükleri hakkındaki geçmiş tecrübesine
    bakmaksızın, hile kaynaklı önemli bir yanlışlık olabileceği ihtimalinin bilinciyle denetim boyunca mesleki şüpheciliğini
    sürdürür. Altı yıllık sorunsuz geçmiş şüphecilik düzeyinin düşürülmesini haklı kılmaz.

    - **2 numaralı görüş yanlıştır.** BDS 200 par. 18’e göre yürürlükteki bir BDS’nin ele aldığı şartlar (burada muhasebe
    tahminleri) mevcutsa BDS 540 yürütülen denetimle ilgili kabul edilir ve denetçi ilgili tüm BDS’lere uyar. Par. 19’a göre
    denetçinin BDS’nin amaçlarını anlaması ve hükümlerini uygun biçimde yerine getirebilmesi için açıklayıcı hükümler ve uygulama
    bölümü dâhil BDS’nin tamamına vâkıf olması gerekir.


    **(b) BDS 315 (6 puan)**


    - Risk değerlendirme prosedürleri (par. 14): (i) yönetimin ve varsa iç denetim fonksiyonundaki kişiler dâhil işletme içindeki
    diğer uygun kişilerin **sorgulanması**, (ii) **analitik prosedürler**, (iii) **gözlem ve tetkik**. Bu prosedürler taraflı
    olmayan biçimde tasarlanır ve uygulanır (par. 13).

    - Önceki deneyim ve önceki denetimlerde uygulanan prosedürlerden elde edilen bilgiler kullanılacaksa denetçi, bu bilgilerin
    denetim kanıtı olarak cari denetim için **hâlen ihtiyaca uygun ve güvenilir olup olmadığını değerlendirir** (par. 16).

    - Müzakereye katılmayan ekip üyelerine hangi konuların bildirileceğine **sorumlu denetçi** karar verir (par. 18).


    **(c) BDS 330 – önceki denetim kanıtlarının kullanımı (8 puan)**


    Kural: Denetim kanıtlarının ihtiyaca uygunluğunun devamını etkileyen değişiklik varsa kontrol cari denetimde test edilir
    (par. 14); değişiklik yoksa kontrol en az her üç denetimden birinde test edilir (par. 14); ciddi riske yönelik güvenilmek
    istenen kontrol cari dönemde test edilir (par. 15).


    | No | Değerlendirme | Sonuç |

    |---|---|---|

    | 1 | Değişiklik yok, ciddi risk değil; 2023-2025 denetimleri içinde 2024’te test edilmiş | Önceki kanıta dayanılabilir
    |

    | 2 | Değişiklik yok, ciddi risk değil; son test 2022 olduğundan 2023-2025 denetimlerinin hiçbirinde test yapılmamış |
    **Cari dönemde test edilir** |

    | 3 | Değişiklik yok, ciddi risk değil; 2023-2025 denetimleri içinde 2023’te test edilmiş | Önceki kanıta dayanılabilir
    (2026’da test gerekecektir) |

    | 4 | ERP sürümü değişmiştir; önemli değişiklik var | **Cari dönemde test edilir** |

    | 5 | Ciddi riske yönelik güvenilmek isteniyor | **Cari dönemde test edilir** |


    Cari dönemde test edilecek kontroller 2, 4 ve 5’tir (3 kontrol); önceki kanıta dayanılabilecek kontroller 1 ve 3’tür (2
    kontrol). Önceki kanıta dayanılacak kontrollerde denetçi, bir önceki denetimden itibaren önemli değişiklik olup olmadığına
    ilişkin kanıtı, kontrollere ilişkin anlayışını doğrulamak amacıyla sorgulamayla birlikte gözlem veya tetkik yaparak elde
    eder. Ayrıca denetçi, sonraki iki denetim döneminde güvenilen kontrollerin hiç test edilmemesi ihtimalini ortadan kaldırmak
    için bazı kontrolleri her denetimde test eder (par. 14).


