- id: YMM-DRM-BDS-K008
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  - BDS 500 serisi denetim kanıtı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Doğu Elektronik A.Ş.’nin 31.12.2025 tarihli finansal tablolarının bağımsız denetiminde denetçi, yıl sonuna
    doğru satış baskısı bulunduğundan ticari alacakların varlığı beyanına ilişkin riski ciddi risk olarak değerlendirmiştir.
    Ticari alacakların toplam bakiyesi 60 milyon TL’dir. Denetçi, bakiyeleri toplam 48 milyon TL olan 12 müşteriye olumlu
    dış teyit talepleri göndermiştir (talepleri doğrudan kendisi göndermiş, yanıtlar doğrudan kendisine ulaşmıştır). Sonuçlar
    şöyledir:


    | Müşteri grubu | Müşteri sayısı | Bakiye (milyon TL) |

    |---|---|---|

    | Yanıt verenler | 9 | 36 |

    | Yanıt vermeyenler | 3 | 12 |

    | Teyit talebi gönderilenler (toplam) | 12 | 48 |


    Yanıt verenlerden ikisinin yanıtında kayıtlarla fark vardır: birinde fark, malın müşteri nezdinde yolda olması nedeniyle
    teslim tarihi farkından; diğerinde şirketin iade edilen malı alacaktan düşmemesinden kaynaklanmaktadır. Yanıt vermeyen
    üç müşteriden biri olan Delta Dış Ticaret Ltd. Şti., yönetim tarafından denetçiye ilişkili taraf olarak bildirilmemiştir;
    ancak denetçi, şirketin ortağının işletmenin yönetim kurulu başkanının eşi olduğunu ve işletmenin bu şirketle olağan iş
    akışı dışında kalan bir satış sözleşmesi yaptığını fark etmiştir. Geçerli finansal raporlama çerçevesinde ilişkili taraf
    hükümleri bulunmaktadır.


    **İstenenler:**


    (a) BDS 315 ve BDS 330 uyarınca denetçinin ciddi risk karşısındaki yükümlülüklerini (ciddi risk kararı, özel maddi doğrulama
    prosedürü, yalnızca maddi doğrulama uygulanacaksa içeriği, dış teyit prosedürlerinin kullanımının mütalaası) açıklayınız.
    Ayrıca teyit talebi gönderilen bakiyelerin toplam bakiye içindeki payını, yanıt veren müşterilerin bakiyelerinin toplam
    bakiye içindeki payını ve yanıt vermeyenlerin bakiyelerinin teyit talebi gönderilen bakiyeler içindeki payını hesaplayınız.
    (5 puan)


    (b) BDS 505 uyarınca denetçinin; yanıt vermeyen üç müşteri, yanıt verenler arasındaki iki istisna ve teyit sonuçlarının
    genel değerlendirilmesi bakımından yapacaklarını açıklayınız. Denetçinin yeterli ve uygun kanıt için olumlu teyit yanıtının
    gerekli olduğuna karar vermiş olması hâlinde, yanıt alınamamasının sonucunu da belirtiniz. (8 puan)


    (c) Delta Dış Ticaret Ltd. Şti. bakımından BDS 550 uyarınca denetçinin yapması gerekenleri açıklayınız. (7 puan)


    (d) Denetçi, tüm prosedürlere rağmen yanıt vermeyen müşterilerin bakiyeleri ve ilişkili taraf satışı hakkında yeterli
    ve uygun denetim kanıtı elde edemezse BDS 330 uyarınca ne yapacağını; açıklanmamış ilişkili taraf bilgisinin risk değerlendirmesine
    etkisini BDS 315 ve BDS 330 uyarınca açıklayınız. (5 puan)

    '
  cozum: '**(a) Ciddi risk yükümlülükleri ve hesap (5 puan)**


    - BDS 315 par. 32: Denetçi, “önemli yanlışlık” riski olarak değerlendirilen riskin **ciddi risk olup olmadığına karar
    verir** (burada ciddi risk olarak değerlendirilmiştir).

    - BDS 330 par. 21: Ciddi risk için **özellikle o riske karşılık veren** bir maddi doğrulama prosedürü uygulanır; yalnızca
    maddi doğrulama prosedürleri uygulanacaksa bunlar **detay testlerini de içerir**. Par. 19: Denetçi, **dış teyit prosedürlerinin**
    maddi doğrulama prosedürü olarak kullanılıp kullanılmayacağını **mütalaa eder**.

    - Hesaplar: Teyit talebi gönderilen bakiyelerin payı 48 / 60 = **%80**; yanıt verenlerin bakiyelerinin toplam bakiyeye
    oranı 36 / 60 = **%60**; yanıt vermeyenlerin (12 milyon TL) teyit talebi gönderilenler (48 milyon TL) içindeki payı 12
    / 48 = **%25**.


    **(b) BDS 505 – sonuçların ele alınması (8 puan)**


    - Par. 12: Teyit mektubuna **yanıt verilmeyen her bir durumda** (3 müşteri, 12 milyon TL) denetçi, ihtiyaca uygun ve güvenilir
    kanıt elde etmek için **alternatif denetim prosedürleri** uygular.

    - Par. 13: Denetçi yeterli ve uygun kanıt için olumlu teyit yanıtının **gerekli** olduğuna karar vermişse alternatif prosedürler
    ihtiyaç duyulan kanıtı **sağlayamaz**; teyit alınamazsa denetçi BDS 705 uyarınca bu durumun denetim ve görüşü üzerindeki
    etkilerine karar verir.

    - Par. 14: İki istisna (teslim tarihi farkı; iade edilen malın düşülmemesi) **yanlışlık göstergesi olup olmadıklarına
    karar vermek amacıyla araştırılır**; iade kaynaklı fark alacağın şişmesine yol açtığından yanlışlık niteliğindedir, teslim
    tarihi farkı ise hasılat kesimi bakımından değerlendirilir.

    - Par. 16: Denetçi dış teyit sonuçlarının ihtiyaca uygun ve güvenilir kanıt sağlayıp sağlamadığını veya **ilave kanıt
    gerekip gerekmediğini** değerlendirir.


    **(c) BDS 550 – açıklanmamış ilişkili taraf (7 puan)**


    - Par. 21: Yönetim tarafından belirlenmemiş/açıklanmamış ilişkinin varlığına işaret eden bilgi bulunduğundan denetçi,
    **arka plandaki şartların bu ilişki ve işlemlerin varlığını teyit edip etmediğine karar verir**.

    - Par. 22: Açıklanmamış ilişkili taraf belirlenirse denetçi (1) ilgili bilgileri **derhâl denetim ekibine iletir**; (2)
    çerçevede ilişkili taraf hükümleri bulunduğundan **yönetimden yeni belirlenen ilişkili taraflarla gerçekleştirilmiş tüm
    işlemleri belirlemesini talep eder** ve kontrollerin bunları belirlemekte/açıklamakta başarısız olma sebeplerini sorgular;
    (3) uygun maddi doğrulama prosedürleri uygular; (4) açıklanmamış ilişkili taraf bulunma riskini tekrar ele alır ve gerekirse
    ilave prosedür uygular; (5) açıklama yapılmamasının **kasıtlı** olduğunu düşünürse hile kaynaklı “önemli yanlışlık” riski
    göstergesi olarak denetime etkilerini değerlendirir.

    - Par. 23: Olağan iş akışı dışındaki önemli ilişkili taraf işleminde denetçi varsa **sözleşme veya anlaşmaları tetkik
    eder**; ticari gerekçenin hileli raporlama/varlıkların kötüye kullanımını gizleme amacına işaret edip etmediğini, şartların
    yönetimin açıklamalarıyla tutarlılığını ve doğru muhasebeleştirme ile açıklamayı değerlendirir; işlemlere doğru yetki
    ve onay verildiğine ilişkin kanıt elde eder.


    **(d) Yetersiz kanıt ve risk değerlendirmesinin revizyonu (5 puan)**


    - BDS 330 par. 27: Denetçi **daha fazla kanıt elde etmeye çalışır**; yeterli ve uygun kanıt elde edemezse **sınırlı olumlu
    görüş verir veya görüş vermekten kaçınır**.

    - BDS 315 par. 37: Risk değerlendirmesinin dayandığı kanıtlarla tutarsız yeni bilgi (açıklanmamış ilişkili taraf, istisnalar)
    edinildiğinden belirleme/değerlendirme **revize edilir**; BDS 330 par. 25 uyarınca denetimi tamamlamadan önce yönetim
    beyanı düzeyindeki risk değerlendirmelerinin uygunluğu yeniden değerlendirilir.

    '
  puanlama:
  - olcut: (a) Ciddi risk kararı (BDS 315 par. 32) ve ciddi riske özellikle karşılık veren maddi doğrulama prosedürü; yalnızca
