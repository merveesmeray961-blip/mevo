  dogrulama:
    python: 'onemlilik = 48000000 * 5 // 100

      po = onemlilik * 75 // 100

      bariz = onemlilik * 5 // 100

      biriken = 1900000 + 400000  # 95.000 bariz onemsiz, karla ilgisiz

      sonuc = {"onemlilik": onemlilik, "performans_onemliligi": po, "bariz_onemsiz": bariz, "biriken_yanlislik": biriken}

      '
