    yürütmektedir. İşletmenin ana banka kredisi sözleşmesi, cari oranın 31.12.2025 tarihinde en az 1,00 olmasını şart koşmaktadır;
    finansal tablolardaki cari oran 0,92’dir. Yönetim, yıl sonu cari oranını yükseltmek amacıyla stok değerleme yöntemini
    değiştirmek istemekte, ancak bu değişiklik için işe ilişkin bir gerekçe sunamamaktadır.


