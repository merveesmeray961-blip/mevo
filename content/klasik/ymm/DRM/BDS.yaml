  soru: '**Olay:** Bağımsız denetçi, Yıldız Mobilya A.Ş.’nin 31.12.2025 tarihli finansal tablolarını denetlemektedir. Finansal
    tablolar gerçeğe uygun sunum çerçevesine göre hazırlanmıştır. İşletme 2025 yılında faaliyet zararı vermiş ve işletme faaliyetlerinden
    negatif nakit akışı yaşamıştır. Yönetim, işletmenin sürekliliğine ilişkin herhangi bir değerlendirme yapmamıştır; denetçinin
    talebi üzerine nakit akış tahmini hazırlamanın “maliyetli ve zaman alıcı” olduğunu belirterek önce bu talebi geri çevirmiştir.
    Daha sonra yönetim, aşağıdaki 2026 yılı çeyreklik nakit akış tahminini sunmuştur.


    | 2026 | 1. Çeyrek | 2. Çeyrek | 3. Çeyrek | 4. Çeyrek |

    |---|---|---|---|---|

    | Net nakit akışı (kredi geri ödemesi hariç, bin TL) | −3.000 | −4.500 | +1.500 | +2.500 |

    | Banka kredisi anapara geri ödemesi (bin TL) | 0 | 6.000 | 0 | 0 |


    Dönem başı (01.01.2026) nakit bakiyesi 5.000 bin TL’dir. Yönetimin tek planı, 2. çeyrekte 7.000 bin TL tutarında bir gayrimenkulü
    satmaktır; satışa ilişkin henüz bağlayıcı bir sözleşme veya alıcı bulunmamaktadır.


    Üst yönetimden sorumlu olanların tamamı işletme yönetiminde icrai nitelikte görev üstlenmemektedir.


    **İstenenler:**


    (a) BDS 200’e göre makul güvencenin ne anlama geldiğini, denetçinin bu denetimde mesleki şüpheciliği ve mesleki muhakemesini
    nasıl kullanması gerektiğini açıklayınız; yönetimin nakit akış tahmini hazırlamanın maliyetli ve zaman alıcı olduğuna
    ilişkin gerekçesinin denetçi açısından geçerli olup olmadığını belirtiniz. (6 puan)


    (b) Yönetimin sürekliliğe ilişkin değerlendirme yapmamış olması karşısında BDS 570’e göre denetçinin yapması gerekenleri
    ve yönetimin değerlendirmesinin kapsaması gereken en az süreyi açıklayınız. (6 puan)


    (c) Çeyrek sonu nakit bakiyelerini (i) gayrimenkul satışı olmadan, (ii) satış 2. çeyrekte gerçekleşirse hesaplayınız;
    sonucu BDS 570 par. 16 kapsamındaki planların değerlendirilmesi açısından yorumlayınız. (7 puan)


    (d) Denetçinin, ciddi şüphe oluşturabileceğini belirlediği olay veya şartlar hakkında üst yönetimden sorumlu olanlarla
    kuracağı iletişimin kapsayacağı hususları belirtiniz. (3 puan)'
  cozum: '**(a) BDS 200 (6 puan)**


    - Makul güvence yüksek bir güvence seviyesidir; denetçi denetim riskini kabul edilebilir düşük bir seviyeye indirecek
    yeterli ve uygun denetim kanıtı elde ettiğinde makul güvence sağlamış olur. Kanıtların çoğu kesin olmaktan çok ikna edici
    olduğundan makul güvence **mutlak bir güvence düzeyi değildir** (par. 5).

    - Denetçi finansal tabloların önemli ölçüde yanlışlık içermesine sebep olan şartların bulunabileceğini kabul ederek denetimi
    **mesleki şüphecilik** içinde planlar ve yürütür (par. 15). Burada faaliyet zararı, negatif nakit akışı, yönetimin değerlendirme
    yapmaması ve sunulan tahminin dayanağı belirsiz planı, ilâve denetim prosedürleri gerektirebilecek ve güvenilirlik şüphesi
    uyandıran durumlardır (A21). Denetçi ayrıca denetimin planlanması ve yürütülmesinde **mesleki muhakemesini** kullanır
    (par. 16).

    - Alternatifi bulunmayan bir denetim prosedürünün zorluğu, süresi veya maliyeti kendi başına denetçinin o prosedürü ihmal
    etmesi veya ikna edicilikten uzak kanıtlarla yetinmesi için **geçerli bir sebep oluşturmaz** (A53). Dolayısıyla yönetimin
    gerekçesi denetçi açısından geçerli değildir.


    **(b) BDS 570 (6 puan)**


    - Denetçi, risk değerlendirme prosedürleri sırasında yönetimin ön değerlendirme yapıp yapmadığını belirler; değerlendirme
    yapılmamışsa sürekliliği esasının amaçlanan kullanımını yönetimle müzakere eder ve ciddi şüphe oluşturabilecek olay veya
    şartların mevcut olup olmadığını yönetimi sorgulayarak öğrenir (par. 10).

    - Olay veya şartlar belirlendiğinde denetçi, yönetimden değerlendirmenin yapılmasını talep eder; yönetimin gelecekteki
    planlarını, planların durumu iyileştirme ihtimalini ve uygulanabilirliğini değerlendirir; nakit akış tahmini varsa tahmine
    ilişkin analizi yapar (par. 16).

    - Yönetimin değerlendirmesi, finansal tabloların tarihinden itibaren **en az on iki aylık** dönemi kapsamalıdır (par.
    13); yönetimin değerlendirdiği dönemden sonrası için denetçi yalnızca yönetimi sorgular (par. 15, A15).


    **(c) Nakit akış analizi (7 puan)**


    (i) Satış olmadan (bin TL):

    - 1. Çeyrek sonu: 5.000 − 3.000 = **2.000**

    - 2. Çeyrek sonu: 2.000 − 4.500 − 6.000 = **−8.500**

    - 3. Çeyrek sonu: −8.500 + 1.500 = **−7.000**

    - 4. Çeyrek sonu: −7.000 + 2.500 = **−4.500**


    (ii) Satış 2. çeyrekte gerçekleşirse (+7.000):

    - 2. Çeyrek sonu: −8.500 + 7.000 = **−1.500**; 3. Çeyrek sonu: −1.500 + 1.500 = **0**; 4. Çeyrek sonu: 0 + 2.500 = **2.500**.


    Yorum: Satış gerçekleşse bile 2. çeyrek sonunda 1.500 bin TL nakit açığı oluşur; plan yalnızca 3. çeyrekten itibaren dengeyi
    sağlar ve bağlayıcı sözleşme/alıcı bulunmadığından uygulanabilirliği kanıtlanmamıştır. Denetçi planın durumu iyileştirme
    ihtimalini ve uygulanabilirliğini (par. 16) değerlendirmeli; ciddi şüphe devam ediyorsa önemli belirsizlik bulunup bulunmadığına
    karar vermelidir (par. 18).


    **(d) Üst yönetimden sorumlu olanlarla iletişim (3 puan)**


    - Üst yönetimden sorumlu olanların tamamı icrai nitelikte görev üstlenmediğinden denetçi, **ciddi şüphe oluşturabileceğini
    belirlediği olay veya şartlar hakkında üst yönetimden sorumlu olanlarla iletişim kurar** (BDS 570 par. 25).

    - İletişim şu hususları içerir: olay veya şartların **önemli bir belirsizlik oluşturup oluşturmadığı**; finansal tabloların
    hazırlanmasında yönetim tarafından **sürekliliği esasının kullanılmasının uygun olup olmadığı**; konuyla ilgili finansal
    tablo açıklamalarının **yeterliliği**; varsa söz konusu olay veya şartların **denetçi raporu üzerindeki etkileri**.

    '
