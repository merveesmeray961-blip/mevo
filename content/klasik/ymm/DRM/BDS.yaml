  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  - BDS 240 hile
  - BDS 500 serisi denetim kanıtı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Kuzey Makine A.Ş.** borsada işlem görmeyen, 6102 sayılı TTK uyarınca bağımsız denetime tabi bir şirkettir. 2025
    yılı denetimine ilişkin bilgiler şöyledir:


    | Bilgi | Tutar / Açıklama |

    |---|---|

    | Sürdürülen faaliyetlerden vergi öncesi kâr | 48.000.000 TL |

    | Hasılat | 600.000.000 TL |

    | Denetim firmasının politikası | Önemlilik = vergi öncesi kârın %5''i; performans önemliliği = önemliliğin %75''i; bariz
    biçimde önemsiz eşiği = önemliliğin %5''i |


    Planlama ve denetim sırasında şu hususlar belirlenmiştir:


    1. Hasılatın önemli bir kısmı, Aralık ayının son haftasında bayilere yapılan ve bayilere 60 gün içinde **iade hakkı**
    tanınan satışlardan oluşmaktadır. Satış direktörünün primi, yıllık hasılat hedefinin tutturulmasına bağlıdır.

    2. En büyük müşteri Delta Ltd.den olan **36.000.000 TL** alacak için yönetim, "müşteriyle ticari uyuşmazlık bulunduğu"
    gerekçesiyle denetçinin teyit mektubu göndermesine **izin vermemiştir**.

    3. Denetim sonunda tespit edilen ve yönetimce düzeltilmeyen yanlışlıklar: (i) dönem sonu kesim hatası nedeniyle hasılatın
    1.900.000 TL fazla kaydedilmesi, (ii) 95.000 TL tutarında bir giderin yanlış gider hesabında sınıflandırılması (kâra etkisi
    yok), (iii) amortisman giderinin 400.000 TL eksik hesaplanması.


    **İstenenler:**


    **(a)** Önemlilik, performans önemliliği ve bariz biçimde önemsiz eşiğini hesaplayınız; 3 numaralı yanlışlıkları bu eşikler
    ve BDS 450 çerçevesinde değerlendiriniz. **(6 puan)**


    **(b)** 1 numaralı bilgi karşısında hasılata ilişkin hile riski varsayımını ve denetçinin risk değerlendirmesi ile yanıtlarını
    BDS 240 ve BDS 330 çerçevesinde açıklayınız. **(7 puan)**


    **(c)** 2 numaralı durumda denetçinin BDS 505''e göre izleyeceği adımları sıralayınız; alternatif prosedürlerle de yeterli
    kanıt elde edilemezse sonuç ne olur? **(7 puan)**


    **(d)** Olumsuz teyit taleplerinin tek başına maddi doğrulama prosedürü olarak kullanılabilmesinin şartlarını belirtiniz
    ve Delta Ltd. alacağı için bu yolun uygun olup olmadığını tartışınız. **(5 puan)**

    '
  cozum: '**(a) Eşikler ve yanlışlıkların değerlendirilmesi**


    | Eşik | Hesap | Tutar |

    |---|---|---|

    | Önemlilik | 48.000.000 × %5 | 2.400.000 TL |

    | Performans önemliliği | 2.400.000 × %75 | 1.800.000 TL |

    | Bariz biçimde önemsiz eşiği | 2.400.000 × %5 | 120.000 TL |


    - (ii) 95.000 TL''lik sınıflandırma hatası 120.000 TL''nin altında kaldığından bariz biçimde önemsizdir; BDS 450 par.
    5 uyarınca biriktirilen yanlışlıklara alınmaz (üstelik kâra etkisi yoktur).

    - (i) ve (iii) biriktirilir. Her ikisi de kârı fazla gösterir: 1.900.000 + 400.000 = **2.300.000 TL**.

    - 2.300.000 TL önemliliğin (2.400.000 TL) altındadır, ancak performans önemliliğini aşmakta ve önemliliğin yaklaşık %96''sına
    ulaşmaktadır. BDS 450 par. 6 uyarınca biriken yanlışlıklar önemliliğe yaklaştığından denetçi genel denetim stratejisinin
    ve denetim planının revize edilmesinin gerekip gerekmediğine karar verir; tespit edilmemiş yanlışlıklarla birlikte toplamın
    önemliliği aşma riski yüksektir.

    - Kesim hatası, hasılatta hile riskinin bulunduğu bir alanda ortaya çıktığından nitel olarak da değerlendirilir; hile
    göstergesi olup olmadığına bakılır (BDS 240 par. 36). Denetçi yönetimden yanlışlıkların düzeltilmesini talep eder.


    **(b) Hasılat ve hile riski**


    - BDS 240 par. 27: Denetçi, hasılatın finansal tablolara alınmasında hile riskinin bulunduğu varsayımıyla hangi hasılat
    türlerinin bu riske yol açtığını değerlendirir. Yıl sonuna yığılan, iade hakkı tanınan bayi satışları ve hasılata bağlı
    prim sistemi (baskı/teşvik unsuru) karşısında varsayımı çürütmek için bir neden yoktur; risk özellikle **gerçekleşme ve
    dönemsellik (kesim)** yönetim beyanlarında yoğunlaşır.

    - Par. 28: Hile kaynaklı önemli yanlışlık riski **ciddi risk** olarak ele alınır; denetçi bu riske yönelik kontrolleri
    belirler, tasarımlarını ve uygulanıp uygulanmadıklarını değerlendirir.

    - BDS 330 par. 15: Bu kontrollere güvenilecekse kontroller **cari dönemde** test edilir; önceki yıl kanıtı kullanılamaz.

    - BDS 330 par. 21: Ciddi riske yalnız maddi doğrulama prosedürleriyle karşılık verilecekse bu prosedürler **detay testlerini**
    içerir. Örnekler: yıl sonuna yakın satışlarda sevk belgeleri ve teslim tutanaklarıyla kesim testi, yıl sonundan sonraki
    iadeler ve alacak dekontlarının incelenmesi, bayi sözleşmelerindeki iade şartlarının incelenmesi, bayilerden satış şartlarını
    da içeren teyit alınması.

    - Ayrıca yönetimin kontrolleri ihlal etme riskine yönelik prosedürler (yevmiye kayıtlarının ve dönem sonu düzeltmelerinin
    test edilmesi, tahminlerde taraflılığın gözden geçirilmesi) her durumda uygulanır.


    **(c) Teyit izninin verilmemesi (BDS 505 par. 8-9)**


    1. Yönetimin izin vermeme gerekçesini sorgular, gerekçenin geçerliliği ve uygunluğu hakkında kanıt elde etmeye çalışır
    (ör. uyuşmazlığa ilişkin yazışmalar, dava/ihtarname).

    2. İzin verilmemesinin, hile riski dâhil önemli yanlışlık riskleri ile diğer prosedürlerin niteliği, zamanlaması ve kapsamı
    üzerindeki etkisini değerlendirir.

    3. Alternatif denetim prosedürleri uygular: yıl sonundan sonraki tahsilatlar, faturalar, sevk belgeleri, sözleşmeler,
    müşteriyle yazışmalar.

    4. Par. 9: Gerekçe makul bulunmazsa **veya** alternatif prosedürlerle ihtiyaca uygun ve güvenilir kanıt elde edilemezse
    denetçi, BDS 260 uyarınca **üst yönetimden sorumlu olanlarla iletişim kurar** ve BDS 705 uyarınca durumun denetime ve
    görüşe etkisine karar verir.

    5. 36.000.000 TL''lik bakiye önemliliğin (2.400.000 TL) çok üzerindedir; kanıt elde edilemezse kapsam sınırlaması doğar.
    Olası etkiler önemli ancak yaygın değilse **sınırlı olumlu görüş**, önemli ve yaygın olabilecekse **görüş vermekten kaçınma**
    söz konusu olur (BDS 705 par. 7 ve 9).


    **(d) Olumsuz teyit (BDS 505 par. 15)**


    Dört şartın **tümü** bulunmalıdır: (1) önemli yanlışlık riskinin düşük değerlendirilmesi ve ilgili kontrollerin işleyiş
    etkinliğine ilişkin yeterli ve uygun kanıt elde edilmesi, (2) anakitlenin çok sayıda küçük ve aynı türden kalemden oluşması,
    (3) beklenen istisna oranının düşük olması, (4) talepleri alanların bunları göz ardı etmesine yol açacak durumlardan denetçinin
    haberdar olmaması.


    Delta Ltd. alacağı tek, büyük ve uyuşmazlık içeren bir bakiyedir; hasılatta ciddi risk bulunmaktadır ve istisna (mutabakatsızlık)
    beklentisi yüksektir. Şartların hiçbiri sağlanmadığından olumsuz teyit bu alacak için uygun değildir; ancak yönetimin
    izni olsaydı olumlu teyit kullanılmalıydı.

    '
  puanlama:
  - olcut: Önemlilik, performans önemliliği ve bariz önemsiz eşiğinin doğru hesaplanması (her biri 1 puan)
    puan: 3
  - olcut: Bariz önemsiz yanlışlığın ayrılması, 2.300.000 TL birikimin bulunması ve önemliliğe yaklaşma nedeniyle plan revizyonu
      ile nitel değerlendirmenin belirtilmesi
    puan: 3
  - olcut: Hasılat hile varsayımının açıklanması ve somut olayda çürütülemeyeceğinin gerekçelendirilmesi
    puan: 2
  - olcut: Hile riskinin ciddi risk olarak ele alınması; kontrollere güvenilecekse cari dönemde test, yalnız maddi doğrulamada
      detay testi gerekliliği
    puan: 3
  - olcut: Uygun detay testi örnekleri ve yönetimin kontrol ihlali prosedürlerine değinilmesi
    puan: 2
  - olcut: BDS 505 par. 8'deki üç adımın (sorgulama, etkilerin değerlendirilmesi, alternatif prosedürler) doğru sıralanması
    puan: 4
  - olcut: 'Par. 9: üst yönetimden sorumlu olanlarla iletişim ve BDS 705''e göre görüş etkisinin (sınırlı olumlu / görüş vermekten
      kaçınma) açıklanması'
    puan: 3
  - olcut: Olumsuz teyidin dört şartının tam sayılması
    puan: 3
  - olcut: Delta Ltd. alacağı için olumsuz teyidin uygun olmadığının gerekçelendirilmesi
    puan: 2
  kaynaklar:
  - mevzuat: BDS 320 Denetimin Planlanması ve Yürütülmesinde Önemlilik
    madde: par. 10-11
  - mevzuat: BDS 450 Denetim Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: par. 5-6
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 27-28, 36
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 15, 21
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 8, 9, 15
