- id: YMM-DRM-BDS-K010
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 240 hile
  - BDS 570 işletmenin sürekliliği
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Bağımsız denetçi, Ege Plastik A.Ş.’nin 31.12.2025 tarihli finansal tablolarını denetlemektedir. Finansal
    tablolar gerçeğe uygun sunum çerçevesine göre hazırlanmıştır. Denetçinin belirlediği önemlilik tutarı 2.000.000 TL’dir.
    Denetim sırasında aşağıdaki bilgiler elde edilmiştir.


    | Kalem | Tutar (TL) |

    |---|---|

    | Dönen varlıklar | 46.000.000 |

    | Kısa vadeli yükümlülükler | 80.000.000 |

    | Kısa vadeli yükümlülükler içindeki banka kredisi (vadesi 31.03.2026) | 35.000.000 |

    | Net dönem zararı | 14.000.000 |

    | İşletme faaliyetlerinden net nakit çıkışı | 9.000.000 |

    | Yıllık hasılat | 210.000.000 |

    | Ticari alacaklar | 40.000.000 |


    Banka, kredinin vadesinde yenileneceğine ilişkin yazılı bir taahhütte bulunmamıştır. Yönetim, işletmenin sürekliliğine
    ilişkin değerlendirmesini yalnızca 30.06.2026 tarihine kadarki dönemi kapsayan bir nakit akış tahminine dayandırmıştır
    ve bu tahmin kredinin yenileneceğini varsaymaktadır.


    Dönem sonuna yakın son üç işgünü içinde, üst düzey bir yönetici tarafından onaylanan ve destekleyici belge eklenmemiş
    iki yevmiye kaydıyla toplam 7.500.000 TL hasılat kaydedilmiştir. Ocak 2026 başında, bu satışlara ilişkin malların 6.000.000
    TL’lik kısmının iade edildiği belirlenmiştir. Ayrıca yönetim, şüpheli alacak karşılık oranını önceki yıldaki %6’dan %3’e
    düşürmüştür; bu değişiklik için dayanak sunulamamıştır.


    **İstenenler:**


    (a) Cari oranı ve net işletme sermayesini hesaplayınız; BDS 570’e göre işletmenin sürekliliğine ilişkin ciddi şüphe oluşturabilecek
    en az üç olay veya şartı belirtiniz; yönetimin değerlendirme dönemi bakımından denetçinin ne talep etmesi gerektiğini
    ve hangi tarihe kadarki dönemi kapsaması gerektiğini, denetçinin uygulayacağı ilâve denetim prosedürlerini açıklayınız.
    (8 puan)


    (b) Denetçinin, yönetimin işletmenin sürekliliği esasını kullanmasını uygun bulduğunu ancak önemli bir belirsizliğin mevcut
    olduğu sonucuna vardığını ve belirsizliğin finansal tablolarda yeterince açıklandığını varsayınız. Denetçi raporundaki
    görüş türünü ve ayrıca eklenecek bölümü açıklayınız; açıklamanın yeterli yapılmaması ve yönetimin değerlendirmeyi genişletmeyi
    reddetmesi durumlarında sonucun nasıl değişeceğini belirtiniz. (6 puan)


    (c) BDS 240’a göre kontrollerin yönetim tarafından ihlal edilmesi riskini, hasılata ilişkin hile varsayımını ve muhasebe
    tahminlerindeki olası taraflılığı değerlendiriniz; denetçinin uygulayacağı prosedürleri belirtiniz; iade edilen hasılat
    kaydının önemlilik tutarına katını ve hasılata oranını, karşılık oranı değişikliğinin tutarını, toplam belirlenmiş yanlışlığı
    ve düzeltme sonrası net zararı hesaplayınız (vergi etkisi ve iade edilen satışların maliyeti dikkate alınmayacaktır).
    (8 puan)


    (d) Denetçinin yukarıdaki yanlışlıkların hile göstergesi olduğunu ve hileye üst düzey yöneticilerin dâhil olduğunu düşündüğü
    durumda, denetçinin yapacağı yeniden değerlendirmeleri ve hile konusunda verebileceği hükmün sınırını açıklayınız. (3
    puan)'
  cozum: '**(a) İşletmenin sürekliliği değerlendirmesi (8 puan)**


    - Cari oran = 46.000.000 / 80.000.000 = **0,575**; net işletme sermayesi = 46.000.000 − 80.000.000 = **−34.000.000 TL**
    (negatif; kısa vadeli net yükümlülük pozisyonu).

    - BDS 570 A3’teki örneklere göre ciddi şüphe oluşturabilecek olay ve şartlar: kısa vadeli net yükümlülük pozisyonu, vadesi
    gelen borcun yenileneceğine dair gerçekçi olmayan beklenti (yazılı taahhüt yok), işletme faaliyetleriyle ilgili negatif
    nakit akışı, önemli tutarlı faaliyet zararı (14.000.000 TL net zarar).

    - Yönetimin değerlendirmesi finansal tablo tarihinden itibaren on iki aydan kısa bir süreyi (31.12.2025’ten 30.06.2026’ya,
    yani 6 ay) kapsadığından denetçi, yönetimden değerlendirmeyi finansal tablo tarihinden itibaren en az on iki aylık dönemi,
    yani **31.12.2026** tarihine kadarki dönemi kapsayacak şekilde genişletmesini talep eder (par. 13). Denetçi ayrıca yönetimin
    değerlendirdiği dönemden sonrası için sahip olduğu bilgiler hakkında yönetimi sorgular (par. 15).

    - İlâve denetim prosedürleri (par. 16): yönetimin gelecekteki planlarının, bu planların durumu iyileştirme ihtimalinin
    ve planların uygulanabilirliğinin değerlendirilmesi (kredi yenileme görüşmeleri, banka yazışmaları); nakit akış tahmini
    hazırlanmışsa tahmine ilişkin analizin ve tahminin dayandığı varsayımların değerlendirilmesi ve tahminin geçmiş tutarlılığının
    incelenmesi.


    **(b) Denetçi raporu (6 puan)**


    - Yönetimin işletmenin sürekliliği esasını kullanması uygun, ancak önemli bir belirsizlik mevcut ve finansal tablolarda
    yeterli açıklama yapılmışsa denetçi **olumlu görüş** verir ve raporunda **“İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik”**
    başlığı altında ayrı bir bölüme yer verir (par. 22).

    - Bu bölüm, belirsizliği açıklayan finansal tablo dipnotlarına dikkat çeker ve önemli belirsizliğin mevcut olduğunu, bu
    hususun denetçi görüşünü değiştirmediğini belirtir (par. 22).

    - Önemli belirsizliğe ilişkin yeterli açıklama yapılmamışsa denetçi BDS 705’e göre sınırlı olumlu görüş veya olumsuz görüşten
    uygun olanı verir ve Sınırlı Olumlu (Olumsuz) Görüşün Dayanağı bölümünde önemli belirsizliğin bulunduğunu, bunun finansal
    tablolarda yeterince açıklanmadığını belirtir (par. 23).

    - Yönetim, talep edilmesine rağmen değerlendirmeyi genişletmeye isteksizse denetçi bunun rapora etkilerini mütalaa eder
    (par. 24); yeterli ve uygun kanıt elde edilemeyebileceğinden sınırlı olumlu görüş verebilir veya görüş vermekten kaçınabilir
    (A35).


    **(c) BDS 240 değerlendirmesi (8 puan)**


    - Yönetimin kontrolleri ihlal etme riski tüm işletmelerde mevcuttur; ihlalin nasıl yapılacağı öngörülemediğinden hile
    kaynaklı önemli yanlışlık riski ve **ciddi risktir** (par. 32). Hasılatın finansal tablolara alınmasında hile riski bulunduğu
    varsayılır (par. 27); burada hasılat kaydı üst düzey yönetici onaylı, belgesiz ve dönem sonuna yakındır.

    - Denetçinin prosedürleri (par. 33): yevmiye kayıtları ve diğer düzeltmelerin uygunluğunun testi (finansal raporlama sürecindeki
    kişilerin sorgulanması, dönem sonunda yapılan kayıtların seçilmesi, dönem boyunca yapılan kayıtların testinin gerekip
    gerekmediğinin mütalaası); muhasebe tahminlerinin (karşılık oranı) taraflılık açısından gözden geçirilmesi.

    - Kayıt tutarı / önemlilik = 7.500.000 / 2.000.000 = **3,75 kat**. İade edilen ve böylece yanlışlık olduğu belirlenen
    hasılat 6.000.000 TL; önemliliğin **3 katı**, hasılatın 6.000.000 / 210.000.000 = **%2,9**’udur (%2,857).

    - Karşılık değişikliği: 40.000.000 × (%6 − %3) = **1.200.000 TL** daha az gider; yönetim lehine tek yönlü taraflılık göstergesidir.

    - Toplam belirlenmiş yanlışlık = 6.000.000 + 1.200.000 = **7.200.000 TL**. Düzeltme sonrası net zarar = 14.000.000 + 7.200.000
    = **21.200.000 TL** (vergi etkisi ve iade edilen satışların maliyeti dikkate alınmamıştır).


    **(d) Hile göstergesi (3 puan)**


    - Yanlışlığın hile göstergesi olması hâlinde gerçekleşmiş bir hilenin münferit olma ihtimalinin düşük olduğu kabul edilir
    ve etkileri, başta yönetimin beyan ve açıklamalarının güvenilirliği olmak üzere denetimin tüm aşamalarında değerlendirilir
    (par. 36).

    - Hileye yönetimin, özellikle üst düzey yöneticilerin dâhil olduğuna inanmayı gerektirecek gerekçe varsa denetçi, hile
    kaynaklı önemli yanlışlık risklerine ilişkin değerlendirmesini ve risklere karşılık veren prosedürlerinin niteliğine,
    zamanlamasına ve kapsamına etkisini yeniden değerlendirir; daha önce elde edilen kanıtların güvenilirliğini yeniden değerlendirir
    (par. 37).

    - Denetçi hilenin varlığından şüphelenebilir veya ender durumlarda tespit edebilir; ancak hilenin gerçekten olup olmadığına
    dair yasal bir hüküm veremez (par. 3).'
