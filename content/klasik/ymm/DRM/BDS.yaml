    - Ara dönemde kanıt elde edilmişse denetçi, ara dönemden sonra bu kontrollerde meydana gelen önemli değişiklikler hakkında
    kanıt toplar ve ara dönemden sonra kalan dönem için toplanması gereken ilave kanıtları belirler (par. 12).

    - Güvenilen kontrollerde sapma tespit edilirse denetçi, sapmaları ve muhtemel sonuçlarını anlamak üzere özel sorgulamalar
    yapar; uygulanan testlerin güven için uygun dayanak oluşturup oluşturmadığına, ilave kontrol testlerinin gerekip gerekmediğine
    veya maddi doğrulama prosedürleriyle riske karşılık vermenin gerekip gerekmediğine karar verir (par. 17).

    - Maddi doğrulama prosedürlerinde yanlışlık tespit edilmemiş olması, test edilen yönetim beyanlarına ilişkin kontrollerin
    etkin olduğuna dair kanıt sağlamaz; tespit edilen yanlışlıklar ise kontrollerin etkin işlemediğine işaret edebilir (par.
    16).

    '
