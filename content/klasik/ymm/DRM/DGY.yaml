  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - Mesleki şirketin şubesi ve şube sorumlusu ortak
  - İrtibat bürosu yasağı ve bireysel büro-şirket ilişkisi
  - İşyeri açılış, kapanış ve adres değişikliği bildirim süreleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Güven Mali Müşavirlik A.Ş., yalnızca serbest muhasebeci mali müşavirlerin ortak olduğu ve İzmir Serbest
    Muhasebeci Mali Müşavirler Odası''na kayıtlı bir mesleki şirkettir. Şirketin merkezi İzmir''in Alsancak ilçesindedir.
    Şirket, 2023 yılında Bornova''da bir irtibat bürosu açmıştır; bu büro 5 Kasım 2026 itibarıyla hâlâ faaliyettedir. Şirket
    yönetimi, 2 Kasım 2026''da İstanbul''da bir şube açmıştır ve ayrıca İzmir''in Karşıyaka ilçesinde ikinci bir şube açmayı
    planlamaktadır. İstanbul şubesinden sorumlu olacak ortağın belirlenmesi için ortaklara ilişkin bilgiler şöyledir:


    | Ortak | Çalışanlar listesine kayıtlı olduğu oda | Şirketi temsil ve ilzama yetkisi | İkametgâhı |

    |---|---|---|---|

    | Nuri | İzmir | Var | İzmir |

    | Pelin | İstanbul | Var | İstanbul |

    | Rıza | İstanbul | Yok | İstanbul |

    | Sema | İstanbul | Var | Kocaeli |


    Ortak Nuri, Bornova''da kendi adına bireysel büro faaliyetini sürdürmekte ve aynı zamanda Güven Mali Müşavirlik A.Ş.''nin
    Alsancak''taki merkezinde şirket adına mesleki faaliyette bulunmaktadır. Nuri, bireysel bürosunu 12 Ağustos 2026''da şirket
    merkezinin bulunduğu adrese taşımıştır. İrtibat bürosu ise 6 Kasım 2026''da kapatılacaktır.


    **İstenenler:**


    (a) İstanbul şubesinden sorumlu olarak hangi ortağın görevlendirilebileceğini, diğer ortakların neden görevlendirilemeyeceğini
    gerekçesiyle belirtiniz. (7 puan)


    (b) Şirketin Karşıyaka''da ikinci bir şube açıp açamayacağını ve Bornova irtibat bürosunun hukuki durumunu (kapatılması
    gereken tarih dâhil) açıklayınız. (6 puan)


    (c) Nuri''nin Bornova''daki bireysel büro faaliyeti sürerken şirketin Alsancak''taki merkezinde mesleki faaliyette bulunmasının
    Yönetmelik karşısındaki durumunu; bireysel bürosunu şirketin adresine taşımasının sonucunu açıklayınız. (5 puan)


    (d) Aşağıdaki bildirimler için Odaya yapılması gereken bildirimin son gününü bulunuz: (i) Nuri''nin adres değişikliği,
    (ii) irtibat bürosunun kapanışı, (iii) İstanbul şubesi işyerinin açılışı. (7 puan)

    '
  cozum: '**(a) Şube sorumlusu ortak (7 puan)**


    Bir şirket başka bir ilde şube açabilir; ancak şube, o ildeki ilgili meslek odasının çalışanlar listesine kayıtlı ve şirketi
    temsil ve ilzama yetkili bir ortağın görevlendirilmesi hâlinde mümkündür; şubeden sorumlu ortağın şubenin bulunduğu ilde
    ikamet etmesi de zorunludur (Çalışma Usul Yön. md. 14). Bu nedenle:


    | Ortak | Değerlendirme | Sonuç |

    |---|---|---|

    | Nuri | İstanbul Odası çalışanlar listesine kayıtlı değil (İzmir); ikameti İstanbul''da değil | Görevlendirilemez |

    | **Pelin** | İstanbul Odası listesinde, temsil ve ilzama yetkili, İstanbul''da ikamet ediyor | **Görevlendirilebilir**
    |

    | Rıza | İstanbul listesinde ve İstanbul''da ikamet ediyor; ancak şirketi temsil ve ilzama yetkisi yok | Görevlendirilemez
    |

    | Sema | İstanbul listesinde ve temsil yetkisi var; ancak ikametgâhı Kocaeli | Görevlendirilemez |


    **(b) Karşıyaka şubesi ve irtibat bürosu (6 puan)**


    Mesleki şirket, kayıtlı olduğu odanın bulunduğu ilin sınırları içinde şube açamaz (md. 14); şirketin merkezi ve kaydı
    İzmir''de olduğundan Karşıyaka''da ikinci şube **açılamaz**. Meslek mensupları ve kurdukları ortaklık büroları ve şirketler
    hiçbir şekilde irtibat bürosu açamaz (md. 14). Geçici Madde 7''ye göre 24/2/2025 tarihli değişiklikten önce açılan irtibat
    büroları, değişikliğin yayımından itibaren 6 ay içinde kapatılır; bu süre **24/8/2025**''te dolmuştur. Bornova irtibat
    bürosu 5 Kasım 2026''da hâlâ faaliyette olduğundan Yönetmeliğe aykırıdır ve derhal kapatılmalıdır.


    **(c) Bireysel büro ve şirket (5 puan)**


    Bireysel büro faaliyeti sürdüren meslek mensubu, farklı bir adreste mesleki şirket kurarak veya kurulu şirkete ortak olarak
    bu şirkette de mesleki faaliyette bulunamaz; aynı adreste ise bu mümkündür (md. 30). Nuri''nin Bornova''daki bireysel
    bürosu şirket merkezinden farklı adreste olduğu dönemde Alsancak''ta şirket adına faaliyette bulunması **Yönetmeliğe aykırıdır**.
    Bireysel bürosunu 12/8/2026''da şirketin adresine taşımasıyla aynı adreste faaliyet koşulu sağlandığından bu tarihten
    sonra şirkette mesleki faaliyette bulunması **mümkündür**.


    **(d) Bildirim son günleri (7 puan)**


    - Adres değişikliği: 12/8/2026 + 30 gün = **11/9/2026** (md. 14: işyerini değiştiren, otuz gün içinde yeni adresini odasına
    bildirir).

    - İrtibat bürosunun kapanışı: işyeri açılış ve kapanışları en geç otuz gün içinde Odaya bildirilir (md. 14); 6/11/2026
    + 30 gün = **6/12/2026**.

    - İstanbul şubesinin işyeri açılışı: 2/11/2026 + 30 gün = **2/12/2026**.

    '
