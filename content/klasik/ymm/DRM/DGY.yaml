    muhasebeci mali müşavir Deniz Tokgöz, Kuzey Gıda A.Ş.''ye bağlı olarak hizmet akdiyle çalışmaktadır; Kuzey Gıda A.Ş.''nin
    doğrudan hissedarı Kuzey Holding A.Ş.''dir.


