- id: YMM-DRM-DGY-K002
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - '5549 sayılı Kanun: kimlik tespiti, muhafaza ve ibraz, yaptırımlar'
  - Suç teşkil eden hallerin duyurulması ve meslek sırrı (3568 md. 43)
  zorluk: 3
  puan: 24
  sure_dk: 35
  soru: '**Olay:** Güneş Emlak A.Ş., konut ve işyeri alım satımına aracılık eden bir şirkettir; 5549 sayılı Kanun bakımından
    "yükümlü" kabul edilecektir. Şirketin 2026 hesap dönemi tam tasdik çalışmasını yürüten yeminli mali müşavir Hakan Doruk,
    Ekim 2026''da yaptığı incelemede aşağıdaki bulguları tespit etmiştir:


    | No | Bulgu |

    |---|---|

    | 1 | Bir satış aracılığında alıcının kimliği, işlem yapılmadan önce tespit edilmemiş; işlem tamamlandıktan sonra kimlik
    fotokopisi alınmıştır. |

    | 2 | Alıcı Ferhat Aksu, işlemi kendi adına yapmış; oysa gerçekte kardeşi hesabına hareket etmiş ve kimin hesabına hareket
    ettiğini şirkete yazılı olarak bildirmemiştir. |

    | 3 | Şirketin yetkilisi, malvarlığının yasa dışı yollardan elde edildiğine dair şüphe doğuran bir işlemi Başkanlığa bildirmemiştir.
    |

    | 4 | Bakanlıkça belirlenen tutarı aşan bir işlem, devamlı bilgi verme kapsamında Başkanlığa bildirilmemiştir. |

    | 5 | Kimlik tespitine ilişkin belgeler, son işlem tarihi 02.06.2019 olan müşteriler için 2025 yılında imha edilmiştir.
    |

    | 6 | Bakanlığın risk temelli yaklaşımla belirlediği eğitim, iç denetim, kontrol ve risk yönetim sistemlerine ilişkin
    tedbirler alınmamıştır. |


    Şirketin muhafaza ettiği kayıtlara ilişkin tarihler şöyledir: bir belgenin düzenlendiği tarih 14.11.2025; yevmiye defterinin
    son kayıt tarihi 31.12.2025; kimlik tespitine ilişkin belgelerin ait olduğu son işlem tarihi 06.03.2026.


    Başkanlık, 1 numaralı bulgudaki yükümlülük ihlalinin 21.10.2018 tarihinde, 4 numaralı bulgudaki ihlalin ise 03.12.2018
    tarihinde işlendiğini belirleyerek her ikisi için de idari para cezası verme kararını 28.10.2026 tarihinde almıştır. Ceza
    tutarları sorulmamaktadır.


    **İstenenler:**


    (a) 1, 2, 3, 4, 5 ve 6 numaralı bulguların her biri için ihlal edilen hükmü (madde numarasıyla) ve doğan yaptırımın idari
    mi, adli mi, yoksa ihtara bağlı bir süreç mi olduğunu belirtiniz. (8 puan)


    (b) Yeminli mali müşavir Hakan Doruk''un 3568 sayılı Kanun''un 43 üncü maddesi çerçevesinde, suç teşkil eden bulgular
    bakımından yapması gerekeni ve bu yükümlülüğün meslek sırrı yasağıyla ilişkisini açıklayınız; suç teşkil eden bulguları
    belirtiniz. (6 puan)


    (c) Belge, defter ve kimlik tespiti belgeleri bakımından muhafaza süresinin başlangıç tarihlerini, süresini, sona ereceği
    yılları ve en geç sona erecek grubu belirtiniz. (5 puan)


    (d) Başkanlığın 28.10.2026 tarihli idari para cezası kararlarından hangisinin hukuka uygun verilebileceğini gerekçesiyle
    gösteriniz; verilen idari para cezalarına karşı başvurulabilecek yolu belirtiniz. (5 puan)

    '
  cozum: '**(a) Bulguların hukuki değerlendirmesi (8 puan)**


    | No | İhlal edilen hüküm | Yaptırım |

    |---|---|---|

    | 1 | md. 3/1: Kimlik tespiti, işlem yapılmadan önce yapılmak zorundadır. | **İdari:** md. 13/1 – 3 ve 6 ncı madde yükümlülüklerini
    ihlal eden yükümlüye idari para cezası. |

    | 2 | md. 15: Kendi adına ama başkası hesabına hareket eden kimse, kimin hesabına hareket ettiğini işlemden önce yazılı
    bildirmelidir. İhlal eden **alıcı Ferhat Aksu''dur**, şirket değildir. | **Adli:** altı aydan bir yıla kadar hapis veya
    beşbin güne kadar adli para cezası (md. 15). |

    | 3 | md. 4/1: Şüpheli işlem bildirimi zorunludur. | **İdari:** md. 13/1 – 4 üncü maddenin birinci fıkrasındaki yükümlülüğü
    ihlal eden yükümlüye idari para cezası. |

    | 4 | md. 6/1: Bakanlıkça belirlenen tutarı aşan işlemlerin Başkanlığa bildirilmesi (devamlı bilgi verme). | **İdari:**
    md. 13/1 (3 ve 6 ncı madde yükümlülükleri). |

    | 5 | md. 8/1: Kimlik tespiti belgeleri son işlem tarihinden itibaren sekiz yıl muhafaza edilir; son işlem 02.06.2019
    olduğundan süre 2027''ye kadar sürer, 2025''te imha erkendir. | **Adli:** md. 14/1 – 7 ve 8 inci maddelerdeki yükümlülükleri
    ihlal eden kimse bir yıldan üç yıla kadar hapis ve beşbin güne kadar adli para cezası. |

    | 6 | md. 5/1: Bakanlığın belirlediği eğitim, iç denetim, kontrol ve risk yönetim sistemi tedbirleri. | **İhtara bağlı
    süreç:** md. 13/2 – önce yazılı ihtar ve otuz günden az olmamak üzere süre; süre sonunda eksiklik giderilmezse idari para
    cezası ve sonraki aşamalar uygulanır. |


    **(b) 3568 sayılı Kanun md. 43 (6 puan)**


    - Meslek mensupları ve yanlarında çalışanlar, işleri dolayısıyla öğrendikleri bilgi ve sırları ifşa edemezler (md. 43/1);
    ancak **suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir** (md. 43/2). Bu zorunluluk sır saklama yasağının
    istisnasıdır; duyuru ifşa sayılmaz. Adli veya idari her türlü inceleme veya soruşturma ile tanıklık da yasağın dışındadır
    (md. 43/3-4).

    - Suç teşkil eden bulgular: **2 numaralı** bulgu (md. 15 – alıcının fiili) ve **5 numaralı** bulgu (md. 8 ihlali, md.
    14). 1, 3, 4 ve 6 numaralı bulgular idari yaptırıma bağlı yükümlülük ihlalleridir; suç teşkil etmedikleri için md. 43/2
    anlamında duyuru zorunluluğu doğurmaz.

    - Hakan Doruk, 2 ve 5 numaralı bulguları yetkili mercilere duyurmak zorundadır; bu duyuru nedeniyle sır saklama yükümlülüğünü
    ihlal etmiş sayılmaz.


    **(c) Muhafaza süreleri (5 puan)**


    Md. 8/1: belgeler **düzenleme tarihinden**, defter ve kayıtlar **son kayıt tarihinden**, kimlik tespitine ilişkin belgeler
    **son işlem tarihinden** itibaren **sekiz yıl** süreyle muhafaza edilir.


    | Grup | Başlangıç | Süre | Sona erdiği yıl |

    |---|---|---|---|

    | Belgeler | 14.11.2025 | 8 yıl | 2033 |

    | Defter ve kayıtlar | 31.12.2025 | 8 yıl | 2033 |

    | Kimlik tespiti belgeleri | 06.03.2026 | 8 yıl | 2034 |


    En geç sona erecek grup **kimlik tespitine ilişkin belgelerdir** (2034).


    **(d) İdari para cezasında zamanaşımı ve yargı yolu (5 puan)**


    Md. 13/6: Yükümlülüğün ihlal edildiği tarihten itibaren **sekiz yıl geçtikten sonra** idari para cezası verilemez.


    - 1 numaralı bulgu: ihlal 21.10.2018; sekiz yıl 21.10.2026''da dolmuştur; karar 28.10.2026 tarihlidir → sekiz yıl geçmiştir,
    **ceza verilemez**.

    - 4 numaralı bulgu: ihlal 03.12.2018; sekiz yıl 03.12.2026''da dolacaktır; karar 28.10.2026 tarihlidir → süre geçmemiştir,
    **ceza verilebilir**.

    - Bu Kanun uyarınca verilen idari para cezası kararlarına karşı **idari yargı yoluna başvurulabilir** (md. 13/7).

    '
