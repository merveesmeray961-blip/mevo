  - Tehdit önlemleri ve etik çatışmanın çözümü
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bağımsız çalışan yeminli mali müşavir Esin Aras''ın ortaklık bürosu, 2026 yılında aşağıdaki durumlarla
    karşılaşmıştır:


    | No | Durum |

    |---|---|

    | 1 | Büronun toplam gelirinin yaklaşık %45''i tek bir müşteriden (Karaçay Tekstil A.Ş.) elde edilmektedir. |

    | 2 | Karaçay Tekstil A.Ş.''nin denetimine atanan ekip üyesi Murat, üç ay önce bu müşterinin çalışanıdır. |

    | 3 | Esin Aras, borsaya kote olan başka bir finansal tablo denetimi müşterisinin kurucu hisse senedini satın almıştır.
    |

    | 4 | Ekip üyesi Ceren, müşteri işletmenin bir yöneticisiyle birinci derece ailevi ilişkiye sahiptir. |

    | 5 | Karaçay Tekstil A.Ş. yönetimi, denetim bulgularını rapora almaması hâlinde sözleşmenin sona erdirileceğini ve işin
    başka bir meslek mensubuna verileceğini bildirmiştir. |

    | 6 | Esin Aras, bir müşterisiyle ortak bir finansal çıkarı paylaşmaktadır. |


    Büronun çalışma kâğıtlarını hazırlayan Hasan; (i) müşteriden öğrendiği ve kamuya açıklanmamış bir ihracat sözleşmesini
    kendi yatırım kararında kullanmış, (ii) bir hesabı teknik ve mesleki standartlara aykırı biçimde, özen göstermeden denetlemiş,
    (iii) önemli bir hata içerdiğini fark ettiği bir bilgiyi hazırladığı çalışmaya yine de dâhil etmiştir.


    Esin Aras, Karaçay Tekstil A.Ş. yönetiminin yukarıdaki baskısıyla ilgili olarak bulgunun raporda yer alması konusunda
    anlaşmazlığa düşmüştür. Esin Aras ayrıca, iki hafta önce yanlışlıkla başka bir müşterisine gönderdiği e-postada Karaçay
    Tekstil A.Ş.''ye ilişkin bilgiye yer verdiğini fark etmiştir.


    **İstenenler:**


    (a) 1 ila 6 numaralı durumların her biri için, Yönetmelikteki tehdit türünü belirtiniz. (6 puan)


    (b) Hasan''ın (i), (ii) ve (iii) ile gösterilen davranışlarının hangi temel etik ilkeyle ilgili olduğunu belirtiniz ve
    beş temel etik ilkeyi sayınız. (4 puan)


    (c) Aşağıdaki önlemleri "mevzuat ile oluşturulabilecek önlemler", "iş çevresinden sağlanacak önlemler" veya "müşterinin
    sistem ve süreçlerindeki önlemler" olarak sınıflandırınız; tek başına yeterli olup olmayacağını belirtiniz (6 puan):

    1. Sürekli meslekî gelişim gereksinimleri

    2. Firmanın tek bir müşteriden elde edilen geliri izleyen ve bağımlılığı yöneten politika ve süreçleri

    3. Meslekî veya düzenleyici izleme ve disiplin prosedürleri

    4. Başka bir meslek mensubunun yapılan işi gözden geçirmesi

    5. Meslek mensubu tarafından üretilen raporun yasal yetkili üçüncü bir kurum tarafından dış kontrolden geçirilmesi

    6. Müşterinin yönetim kararlarını alacak personelinin deneyimli ve işinin ehli, kıdemli çalışanlar olması


    (d) 5 numaralı durumdaki anlaşmazlığın çözümü için Esin Aras''ın izleyeceği adımları sırasıyla yazınız; tehditlere karşı
    önlem alınamaması hâlinde bağımsız çalışan meslek mensubunun yapması gerekeni ve e-posta hatasının nasıl ele alınacağını
    açıklayınız. (6 puan)

    '
  cozum: '**(a) Tehdit türleri (6 puan)**


    Yönetmelik Ek, Birinci Kısım md. 3''te beş tehdit türü sayılmıştır; bağımsız çalışan meslek mensubu için örnekler İkinci
    Kısım md. 21-25''te yer alır.


    | No | Durum | Tehdit türü | Dayanak |

    |---|---|---|---|

    | 1 | Tek müşteriden alınacak toplam ücrete aşırı bağlılık | **Kişisel çıkar** | md. 21(b) |

    | 2 | Ekip üyesinin daha önceden o müşterinin çalışanı olması | **Yeniden değerlendirme** | md. 22(ç) |

    | 3 | Borsaya kote denetim müşterisinin kurucu hisse senedini almak | **Taraf tutma** | md. 23(a) |

    | 4 | Ekip üyesinin müşteri yöneticisiyle birinci derece ailevi ilişkisi | **Yakınlık** | md. 24(a) |

    | 5 | Azledilme veya işin başkasına verilmesi tehdidi | **Yıldırma** | md. 25(a) |

    | 6 | Müşteriyle ortak finansal çıkar paylaşmak | **Kişisel çıkar** | md. 21(a) |


    **(b) Temel etik ilkeler (4 puan)**


    - (i) Bilginin kendi çıkarı için kullanılması → **Gizlilik**.

    - (ii) Teknik ve mesleki standartlara uygunsuzluk ve özensizlik → **Meslekî yeterlilik ve özen**.

    - (iii) Önemli hata içeren bilginin dikkate alınması → **Dürüstlük** (md. 7: bu tür bilgi veya bununla hazırlanmış rapor
    dikkate alınmamalıdır).

    - Beş temel ilke: **dürüstlük, tarafsızlık, meslekî yeterlilik ve özen, gizlilik, meslekî davranış** (md. 1).


    **(c) Önlemler (6 puan)**


    | No | Önlem | Grup |

    |---|---|---|

    | 1 | Sürekli meslekî gelişim gereksinimleri | Mevzuat ile oluşturulabilecek önlem (md. 4/a-2) |

    | 2 | Tek müşteriden elde edilen gelirin izlenmesi | İş çevresinden sağlanacak önlem – firma çapında (md. 29/g) |

    | 3 | İzleme ve disiplin prosedürleri | Mevzuat ile oluşturulabilecek önlem (md. 4/a-5) |

    | 4 | Başka bir meslek mensubunun işi gözden geçirmesi | İş çevresinden sağlanacak önlem – sözleşmeye özgü (md. 30/a)
    |

    | 5 | Raporun yasal yetkili üçüncü kurumca dış kontrolü | Mevzuat ile oluşturulabilecek önlem (md. 4/a-6) |

    | 6 | Müşterinin kıdemli ve ehil karar alıcı personeli | Müşterinin sistem ve süreçlerindeki önlem (md. 32/a) |


    Müşterinin aldığı önlemlere sözleşmenin özelliğine bağlı olarak güvenilebilir; **ancak tehditlerin kabul edilebilir düzeye
    indirilmesinde yalnızca bu önlemlere güvenilemez** (md. 31). Dolayısıyla 6 numaralı önlem tek başına yeterli değildir.


    **(d) Çözüm adımları, önlem alınamaması ve istemeden ihlal (6 puan)**


    - Md. 5 uyarınca Esin Aras sırasıyla: (1) ilgili verileri, etik sorunları ve ilkeleri, yerleşik iç süreçleri ve alternatif
    hareket biçimlerini dikkate alarak temel etik ilkelere uygun hareket biçimini belirler; (2) çözülemezse firma içindeki
    diğer uygun kişilerden yardım ister; (3) konu müşteri işletmeyle ilgili bir etik çatışma olduğundan işletmenin yönetiminden
    sorumlu organlarla (yönetim kurulu veya denetim komitesi gibi) görüşür; (4) çözülemezse bağlı olduğu meslek odasından
    meslekî öneri alabilir; (5) çatışma hâlâ çözümlenemezse çatışmayı yaratan konu ile ilgisini sürdürmeyi reddedebilir, sözleşme
    ekibinden veya görevden çekilebilir ya da sözleşmeyle ilişkisini tümüyle kesebilir.

    - Önemsiz olmayan tehdit için uygun önlemler alınamıyorsa **bağımsız çalışan meslek mensubu belirli bir hizmetin ifasını
    azaltmalı veya sona erdirmelidir**; bağımlı çalışan meslek mensubu ise işveren işletmedeki görevinden istifa eder (md.
    2/3).

    - E-posta hatası etik ilkelerden birinin (gizlilik) **istemeden ihlali**dir; tespit edildiğinde **kısa sürede düzeltilmeli
    ve gerekli önlemler alınmalıdır** (md. 2/4).

    '
