  kazanimlar:
  - Tarifedeki en az ücret kontrolü ve yabancı paralı sözleşmeler
  - Ücretin başka yerdeki meslek mensubuyla paylaşılması
  - Giderlerin, avansın ve ücretin ödenmesi
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** İstanbul''da faaliyet gösteren yeminli mali müşavir Şahin Karataş''ın 2026 yılı sözleşmelerine ilişkin
    bilgiler şöyledir. Vakada, ilgili hizmet türü için tarifedeki en az ücret 100.000 TL ve tarifenin, hizmetin başka bir
    meslek mensubu aracılığıyla yapılması hâlinde bu meslek mensubuna bırakılacak oran olarak belirlediği oran %40 alınacaktır
    (her ikisi 2026 yılı değerleridir).


    1. **Müller Textil GmbH** (Almanya merkezli yabancı firma) ile Almanca ve Euro cinsinden sözleşme yapılmış, yıllık ücret
    2.500 EUR olarak belirlenmiştir. **Nordic Foods AS** (yabancı firma) ile yapılan benzer sözleşmede yıllık ücret 2.000
    EUR''dur. İki sözleşmenin yapıldığı andaki kur 1 EUR = 45 TL''dir ve her iki sözleşme de tarifedeki 100.000 TL''lik en
    az ücretin geçerli olduğu hizmet türüne ilişkindir.

    2. **Batı Gıda A.Ş.** ile 150.000 TL ücretli bir sözleşme yapılmıştır. Şirketin Mersin''deki şubesine ilişkin işleri,
    Şahin Karataş Mersin''de faaliyet gösteren başka bir meslek mensubuna yaptıracaktır. Taraflar arasında iki alternatif
    paylaşım değerlendirilmektedir: (A) Mersin''deki meslek mensubuna 50.000 TL, (B) Mersin''deki meslek mensubuna 70.000
    TL. Şahin Karataş ayrıca Batı Gıda''dan Mersin işi için 20.000 TL ek ödeme talep etmeyi düşünmektedir.

    3. **Ege Metal A.Ş.** adına işlem yapılırken Şahin Karataş 12.000 TL harç ve 3.500 TL seyahat gideri ödemiştir. Ege Metal,
    bu tutarları "ücretle birlikte yıl sonunda ödeyeceğini" söylemiş; Şahin Karataş''ın işe başlamadan önce istediği 10.000
    TL avansı da vermemiştir. Ege Metal ile ücretin iş yapıldıkça taksit taksit ödenmesi de görüşülmektedir.


    **İstenenler:**


    (a) Müller Textil ve Nordic Foods sözleşmelerinin tarifedeki en az ücret bakımından uygun olup olmadığını hesaplayarak
    gösteriniz. (6 puan)


    (b) Mersin''deki meslek mensubuna bırakılması gereken en az tutarı bulunuz; A ve B alternatiflerinin geçerliliğini, ek
    ödeme talebini ve iki meslek mensubunun sorumluluğunu değerlendiriniz. (7 puan)


    (c) Ege Metal''in giderler ve avans bakımından yükümlülüklerini belirtiniz. (5 puan)


    (d) Ücretin ödenme zamanına ilişkin kuralı ve Ege Metal ile görüşülen taksit düzenlemesinin mümkün olup olmadığını açıklayınız;
    yabancı paralı sözleşmelerde kur bakımından hangi tarihin esas alındığını belirtiniz. (4 puan)

    '
  cozum: '**(a) Yabancı firma sözleşmeleri (6 puan)**


    Yabancı firmalarla sözleşmelerin yabancı dilde ve yabancı paralı yapılması mümkündür; bu takdirde **sözleşmenin yapıldığı
    andaki döviz kuruna** göre tarifedeki en az ücret kontrolü yapılır (Ücret Yön. md. 13/3).


    | Sözleşme | Hesap | TL karşılığı | Tarife en az ücret | Sonuç |

    |---|---|---|---|---|

    | Müller Textil | 2.500 × 45 | 112.500 | 100.000 | **Uygun** |

    | Nordic Foods | 2.000 × 45 | 90.000 | 100.000 | **Uygun değil** (10.000 TL eksik) |


    Tarifedeki asgari miktarın altında ücretle çalışmak yasaktır ve disiplin cezasını gerektirir (md. 11).


    **(b) Mersin işi (7 puan)**


    Meslek mensubu, işyeri merkezi dışındaki işleri anlaştığı o yerdeki diğer meslek mensuplarına yaptırabilir; iş sahibinden
    sözleşmeyle belirlenmiş ücrete ek ödeme talep edilmez (md. 18/1). Ücretin paylaşılması tarifedeki esaslara göre yapılır;
    bu esaslara aykırı sözleşmeyle diğer yerdeki meslek mensubunun ücreti **azaltılamaz, ancak arttırılabilir** (md. 18/2).
    Tarifede başka meslek mensubuna bırakılacak ücret oranı %40 olduğundan en az tutar 150.000 × %40 = **60.000 TL**''dir.


    - Alternatif A (50.000 TL < 60.000 TL): **geçersiz**; ücret tarife esaslarının altına indirilemez.

    - Alternatif B (70.000 TL > 60.000 TL): **geçerli**; arttırmak mümkündür. Şahin Karataş''ın payı 80.000 TL olur.

    - 20.000 TL ek ödeme talebi md. 18/1''e aykırıdır; iş sahibinden ek ödeme istenmez.

    - Meslek mensupları işin o kesiminden müşterek ve müteselsil sorumludur (md. 18).


    **(c) Giderler ve avans (5 puan)**


    Meslek mensubunun işi yaparken ödemesi gerekli, iş sahibine ait bütün vergi, resim, harç ve giderler iş sahibinin sorumluluğundadır;
    bu giderler talep hâlinde **derhal** ödenir ve meslek mensubunca istenirse **avans verilmesi zorunludur**; işle ilgili
    seyahat giderleri de iş sahibince ödenir (md. 20). Bu nedenle 12.000 TL harç ve 3.500 TL seyahat gideri (toplam 15.500
    TL) talep hâlinde derhal ödenmelidir; avans talebinin reddi Yönetmeliğe aykırıdır.


    **(d) Ödeme zamanı (4 puan)**


    Ücretin peşin ödenmesi esastır; ancak sözleşmeye ücretin iş yapıldıkça taksit taksit ödeneceğine dair hüküm konulabilir
    (md. 21). Dolayısıyla Ege Metal ile taksit düzenlemesi **mümkündür**. Yabancı paralı sözleşmelerde esas alınan kur, **sözleşmenin
    yapıldığı andaki** kurdur (md. 13/3).

    '
