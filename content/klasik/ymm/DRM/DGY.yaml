    ve açık adresleri, yapılacak işin kapsamı (aylık muhasebe hizmeti), aylık ücret tutarı ve sözleşme tarihi.


    **İstenenler:**


    (a) Yukarıdaki beş işten hangilerinde sözleşme yapılmasının zorunlu olduğunu belirtiniz. (5 puan)


    (b) Sözleşmelerde bulunması gereken asgari bilgileri sayınız ve taslakta eksik olan hususları belirleyiniz. (6 puan)


    (c) Furkan Ersoy''un Z Plastik A.Ş.''ye ve Merve Demir''in Mor Tarım Ltd. Şti.''ne 12 Ekim 2026 tarihi itibarıyla Neşe
    Işık''ın rızası olmaksızın hizmet verip veremeyeceğini, ilgili sürelerin başlangıç ve bitiş tarihlerini göstererek açıklayınız.
    (6 puan)


    (d) İş teklifini kabul etmek istemeyen meslek mensubunun yapabileceklerini, iş sahibinin iki meslek mensubunca reddedilmesi
    hâlinde izlenecek yolu ve sözleşme bilgilerine ilişkin bildirim yükümlülüğünü açıklayınız. (5 puan)

    '
  cozum: '**(a) Sözleşmenin zorunlu olduğu işler (5 puan)**


    Çalışma Usul Yön. md. 24 uyarınca defter tutmak (1), süreklilik arz eden müşavirlik hizmeti (3), inceleme, tahlil ve denetim
    yapmak ve bunlarla ilgili rapor düzenlemek (4) ile yeminli mali müşavirlerin tasdik işlemleri (5) için sözleşme zorunludur.
    Tek seferlik dilekçe hazırlama (2) için taraflar sözleşme **yapabilirler** ancak zorunlu değildir.


    **(b) Asgari sözleşme içeriği (6 puan)**


    Md. 25''e göre sözleşmede en az şunlar yer alır: (i) tarafların açık adresleri, **vergi daireleri ve vergi daireleri sicil
    numaraları**; (ii) yapılacak işlerin amacı, kapsamı; (iii) tarafların karşılıklı sorumluluk ve yükümlülükleri; (iv) ücret
    tutarı ve **ödeme şekli**; (v) sözleşme **yeri**, tarihi ve **süresi**.


    Taslakta bulunanlar: adresler (ancak vergi daireleri ve sicil numaraları yok), işin kapsamı (amaç belirtilmemiş), ücret
    tutarı (ödeme şekli yok) ve tarih. **Eksikler:** vergi daireleri ve sicil numaraları, işin amacı, karşılıklı sorumluluk
    ve yükümlülükler, ücretin ödeme şekli, sözleşme yeri ve süresi.


    **(c) İki yıllık kısıtlama (6 puan)**


