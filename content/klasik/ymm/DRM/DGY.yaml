- id: YMM-DRM-DGY-K006
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - Ücret, şarta bağlı ücret ve asgari ücret sınırı (Etik İlkeler md. 40-42)
  - Hediye, müşteri varlıklarının muhafazası ve meslekî hizmetlerin pazarlanması (md. 45-47)
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bağımsız çalışan yeminli mali müşavir Tuncay Özer, 2026 yılında aşağıdaki durumlarla karşılaşmıştır:


    | No | Durum |

    |---|---|

    | 1 | Pınar Un Ltd. Şti. ile yapılan hizmet sözleşmesinde Tuncay Özer, "meslektaşlarımdan daha düşük ücret almak etik
    dışı değildir" diyerek, Birlik tarafından belirlenmiş ve ilan edilmiş asgari ücret düzeyinin altında bir ücret talep etmiştir.
    |

    | 2 | Bir güvence sağlama sözleşmesinde, ücretin bir bölümü raporun müşteri açısından olumlu çıkması şartına bağlanmıştır.
    |

    | 3 | Deniz Yapı A.Ş. yönetimi, Tuncay Özer''in eşine iki kişilik beş günlük bir tatil paketi hediye etmeyi teklif etmiştir.
    Aynı şirket ayrıca yılbaşında Tuncay Özer''e küçük bir masa takvimi göndermiştir. |

    | 4 | Müşteri Karya İnşaat A.Ş., 250.000 TL nakdi "bir süre elinizde dursun" diyerek Tuncay Özer''e emanet olarak bırakmak
    istemiştir. |

    | 5 | Tuncay Özer internet sitesinde "Türkiye''nin en iyi YMM''siyim, rakiplerim sahte hesap çıkarır, en deneyimli ekip
    bende" ifadelerine yer vermiştir. |


    **İstenenler:**


    (a) 1 numaralı durumda Tuncay Özer''in gerekçesini ve talep ettiği ücreti Yönetmelik hükümleri bakımından değerlendiriniz;
    2 numaralı durumun doğurduğu tehdidi ve bu tehdidin ele alınmasında alınabilecek önlemleri belirtiniz. (7 puan)


    (b) 3 numaralı durumda teklif edilen tatil paketi ile takvimin kabul edilip edilemeyeceğini, hediyenin doğurabileceği
    tehditleri ve kabulün hangi koşulda mümkün olmadığını açıklayınız. (6 puan)


    (c) 4 numaralı durumda Tuncay Özer''in yapması gerekeni ve dayanağını belirtiniz. (4 puan)


    (d) 5 numaralı durumu Yönetmeliğin meslekî hizmetlerin pazarlanmasına ilişkin hükümleri bakımından değerlendiriniz. (5
    puan)

    '
  cozum: '**(a) Ücret (7 puan)**


    - **1 numaralı durum:** Md. 40/1''e göre bir meslek mensubunun diğerine göre daha düşük ücret talep etmesi **kendi içinde
    etik olmayan bir davranış değildir**. Ancak meslek mensupları ücret düzeyini belirlemede serbest olmakla birlikte bu ücret,
    **Birlik tarafından belirlenmiş ve ilan edilmiş asgari ücret düzeyinin altında olamaz**. Tuncay Özer''in "düşük ücret
    etik dışı değil" gerekçesi genel olarak doğrudur ancak asgari ücretin altında ücret talebi **uygun değildir**; ayrıca
    çok düşük ücret, hizmetin teknik ve meslekî standartlara göre yapılmasını güçleştirecekse meslekî yeterlilik ve özen ilkesine
    yönelik kişisel çıkar tehdidi doğurur. (Bu tehdit için alınabilecek önlemler: ücretin hangi temele göre belirlendiği hakkında
    müşterinin bilgilendirilmesi; göreve uygun süre ve kalifiye personel tahsisi – md. 41.)

    - **2 numaralı durum:** Şarta bağlı ücret, temel etik ilkelere yönelik tehditlere, örneğin **tarafsızlık ilkesine yönelik
    kişisel çıkar tehdidine** neden olabilir (md. 42/1). Tehditler değerlendirilmeli, önemli olanlar için önlem alınmalıdır.
    Önlemler (md. 42/2): (a) müşteriyle ücret esaslarını gösteren ön anlaşma yapılması; (b) sunulan işin ve ücretlendirme
    esaslarının hedeflenen kullanıcılara açıklanması; (c) kalite kontrol politika ve süreçleri; (ç) hizmetin tarafsız üçüncü
    bir grup tarafından incelenmesi.


    **(b) Hediye (6 puan)**


    - Müşteri tarafından bağımsız çalışan meslek mensubuna **veya bir yakın aile üyesine** hediye teklif edilebilir; bu tür
    hediye temel etik ilkelere yönelik tehditlere yol açabilir (md. 46/1). Müşteriden hediye kabul edilmesi objektiflik ilkesine
    yönelik **kişisel çıkar tehdidi**, tekliflerin kamu tarafından bilinmesi durumunda tarafsızlık ilkesine yönelik **yıldırma
    tehdidi** oluşturur (md. 46/1). Hediyenin müşteriden alınması ayrıca yakınlık tehdidi örneğidir (md. 24/ç: değeri önemsiz
    olanlar hariç hediye veya ayrıcalıklı hizmet alınması).

    - Önem düzeyi hediyenin özelliğine, değerine ve teklifin arkasındaki amaca bağlıdır (md. 46/2). Teklifi bilen ve gerekli
    tüm bilgilere sahip üçüncü bir grup tarafından **önemsiz** kabul ediliyorsa (küçük masa takvimi gibi), bu durumda teklifin
    karar alıcıyı etkileme niyetiyle yapılmadığı, iş hayatına özgü normal bir hareket olduğu ve tehdit oluşturmadığı sonucuna
    varılabilir → **takvim kabul edilebilir**.

    - İki kişilik beş günlük tatil paketi önemli bir tehdit yaratır; **önlem alınmasına rağmen tehdit yok edilemiyor veya
    kabul edilebilir bir düzeye indirilemiyorsa hediye teklifi kabul edilmemelidir** (md. 46/3). Böyle bir değerdeki hediyede
    tehdit önlemlerle giderilemeyeceğinden teklif reddedilmelidir.


    **(c) Müşteri varlıkları (4 puan)**


    Yasal olarak izin verilmediği sürece bağımsız çalışan meslek mensubu, müşterisine ait para veya diğer varlıkları **emanet
    olarak alamaz** (md. 47/1). Müşteri paralarının emanet alınmasını yasaklayan 26/10/1996 tarih ve 22535 sayılı Resmî Gazete''de
    yayımlanan **Mecburi Meslek Kararı**na uymak zorundadır (md. 47/3). Müşteri varlıklarının muhafazası meslekî davranış
    ve objektiflik ilkelerine yönelik kişisel çıkar tehdidi oluşturur (md. 47/2). Tuncay Özer 250.000 TL''yi emanet almayı
    **reddetmelidir**.


    **(d) Pazarlama (5 puan)**


    Md. 45/1: Meslek mensubu meslekî hizmetlerin pazarlamasında mesleğin itibarını zedelememeli; doğru ve dürüst olmalı, (a)
    sunduğu hizmetler, sahip olduğu özellikler ve iş tecrübesiyle ilgili **abartılı iddialarda bulunmamalı** veya (b) diğer
    meslek mensuplarının hizmetleri ile ilgili **asılsız karşılaştırmalar ve küçültücü atıflar yapmamalıdır**. "Türkiye''nin
    en iyisiyim" ifadesi abartılı iddia, "rakiplerim sahte hesap çıkarır" ifadesi asılsız karşılaştırma ve küçültücü atıftır;
    her ikisi de hükme aykırıdır. Ayrıca bağımsız meslek mensupları tanıtım konusunda Haksız Rekabet ve Reklam Yasağı Hakkında
    Yönetmelik hükümlerine uyar (md. 45/2).

    '
