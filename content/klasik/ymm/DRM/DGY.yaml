  soru: '**Olay:** Serbest muhasebeci mali müşavir Furkan Ersoy, 15 Nisan 2025 tarihine kadar SMMM Neşe Işık''ın bürosunda
    bağımlı olarak çalışmış, 2 Mayıs 2025''te kendi bürosunu açmıştır. Furkan Ersoy''un arkadaşı SMMM Merve Demir ise stajını
