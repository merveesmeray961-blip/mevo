- id: YMM-DRM-DGY-K001
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - 5549 sayılı Kanun şüpheli işlem bildirimi
  - 5510 sayılı Kanun kapsamındaki sorumluluklar
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: "YMM (F), tam tasdik sözleşmesi bulunan (G) A.Ş.'nin kayıtlarında, gerçek bir ticari ilişkisi tespit edilemeyen\n\
    yurt dışındaki bir şirketten yüksek tutarlı ve sık aralıklı nakit girişleri görmüştür. Aynı dönemde (F),\nşirketin üstlendiği\
    \ ihaleli bir inşaat işi için 5510 sayılı Kanun md. 59 kapsamında işyeri kayıtlarını inceleyerek\nrapor düzenleyecektir.\n\
    \n(a) (F)'nin 5549 sayılı Kanun kapsamındaki yükümlülüklerini sırasıyla açıklayınız. (8 puan)\n(b) (F) bildirimi yaptıktan\
    \ sonra durumu şirket yöneticilerine açıklarsa sonucu ne olur? (4 puan)\n(c) İşyeri kayıtlarının incelenmesine ilişkin\
    \ raporun gerçeğe aykırı olması hâlinde (F)'nin sorumluluğunu\n    açıklayınız. (8 puan)\n"
  cozum: '**(a)** (F), işlem yapanın ve hesabına işlem yapılanın kimliğini tespit eder (md. 3). Malvarlığının yasa dışı yoldan

    elde edildiğine veya yasa dışı amaçla kullanıldığına dair şüphe bulunduğundan işlemi **MASAK Başkanlığına** bildirir

    (md. 4/1); teşebbüs aşamasındaki işlemler de kapsamdadır. İstenen bilgi ve belgeleri verir (md. 7) ve belgeleri

    **sekiz yıl** saklar (md. 8). Bildirim, md. 10 gereği hukuki ve cezai sorumluluk doğurmaz; sır saklama

    yükümlülüğünün ihlali sayılmaz.


    **(b)** Bildirimin yapıldığı, denetim elemanları ve mahkemeler dışında, işleme taraf olanlar dahil kimseye

    açıklanamaz (md. 4/2). Açıklama hâlinde **bir yıldan üç yıla kadar hapis ve beş bin güne kadar adli para cezası**

    uygulanır (md. 14).


    **(c)** Rapordaki işçilik tutarı, Kurumun denetim yetkisi saklı kalmak üzere esas alınabilir. Gerçeğe aykırı rapor

    düzenleyen YMM, Kurumun uğradığı zarardan **işverenle birlikte müştereken ve müteselsilen** sorumludur; Kurum

    usullerine aykırı davranıp zarar veren meslek mensubunun raporları dikkate alınmaz ve **sonraki raporları da işleme

    konulmaz** (5510 md. 59).

    '
