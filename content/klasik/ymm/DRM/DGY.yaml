- id: YMM-DRM-DGY-K005
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - 'Gizlilik ilkesi: ilişki sonrası gizlilik, açıklama hâlleri ve karar kriterleri (Etik İlkeler md. 12-15)'
  - Sır saklama (3568 md. 43) ve meslekî atamalarda değişiklik (Etik İlkeler md. 35)
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bağımsız çalışan yeminli mali müşavir Rıza Aksoy, Bakırçay Gıda A.Ş.''nin denetimini 31.12.2025 tarihinde
    sona eren sözleşme ile yürütmüştür; sözleşme ilişkisi bu tarihte bitmiştir. Rıza Aksoy''un yanında stajyer Selin çalışmaktadır.
    2026 yılında aşağıdaki olaylar yaşanmıştır:


    | No | Olay |

    |---|---|

    | 1 | Rıza Aksoy, Mart 2026''da bir meslek odası toplantısında konuşmacı olarak, Bakırçay Gıda A.Ş.''nin gizli üretim
    maliyetlerini ve müşteri listesini, şirketin izni olmadan örnek olarak anlatmıştır. |

    | 2 | Stajyer Selin, Bakırçay Gıda A.Ş. dosyasında gördüğü gizli bilgileri bir arkadaşına anlatmıştır; Rıza Aksoy bu konuda
    hiçbir tedbir almamıştır. |

    | 3 | Bakırçay Gıda A.Ş. ile ücret uyuşmazlığı çıkmış, Rıza Aksoy açılan davada kendi meslekî çıkarlarını korumak için
    gerekli bilgileri mahkemeye sunmuştur. |

    | 4 | Bakırçay Gıda A.Ş., yazılı izin vererek Rıza Aksoy''dan bazı bilgilerin bir bankaya açıklanmasını istemiştir. |

    | 5 | Meslek odası, kalite raporuna veri sağlanması için Rıza Aksoy''dan bilgi istemiş, Rıza Aksoy da bu veriyi odaya
    sunmuştur. |

    | 6 | Rıza Aksoy, Bakırçay Gıda A.Ş.''ye ait henüz kamuya açıklanmamış bir satın alma bilgisini, kendi hisse alım kararında
    kullanmıştır. |


    Bakırçay Gıda A.Ş. 2026 yılı sonunda yeni bir bağımsız çalışan yeminli mali müşavir olan Sinem Koç''a bir iş teklif etmiştir.
    Sinem Koç, işi kabul etmeden önce Rıza Aksoy ile görüşmek istemektedir.


    **İstenenler:**


    (a) 1, 2 ve 6 numaralı olaylarda gizlilik ilkesinin ihlal edilip edilmediğini, ilişkinin sona ermiş olmasının etkisini
    ve stajyerin davranışı bakımından 3568 sayılı Kanun md. 43 ile Yönetmelik hükümlerini değerlendiriniz. (7 puan)


    (b) 3 ve 5 numaralı olaylarda açıklamanın etik ilkelere uygun olup olmadığını değerlendiriniz. (5 puan)


    (c) 4 numaralı olaydaki açıklamaya karar verecek Rıza Aksoy''un dikkate alması gereken hususları sayınız. (5 puan)


    (d) Sinem Koç''un işi kabul etmeden önce Rıza Aksoy ile görüşmesinin dayanağını, kapsamının neye bağlı olduğunu, alınabilecek
    önlemi ve önlemlere rağmen tehditler ortadan kaldırılamazsa yapması gerekeni açıklayınız. (5 puan)

    '
  cozum: '**(a) Gizlilik ilkesinin ihlali (7 puan)**


    - **1 numaralı olay – ihlal vardır.** Md. 13/1: Meslek mensubunun gizlilik sorumluluğu müşteri ile ilişkisi sona erdiği
    zaman bile devam eder; sözleşmenin 31.12.2025''te bitmesi sırrı açıklama hakkı vermez. Md. 12(a)''ya göre yasal veya meslekî
    açıklama zorunluluğu ya da yetkisi olmadıkça bilgi müşteri veya işveren dışındaki kişilere açıklanamaz. Ayrıca 3568 sayılı
    Kanun md. 43/1 uyarınca meslek mensupları işleri dolayısıyla öğrendikleri bilgi ve sırları ifşa edemezler.

    - **2 numaralı olay – ihlal vardır.** 3568 sayılı Kanun md. 43/1 yasağı meslek mensuplarının **yanlarında çalışanları**
    da kapsar; Selin''in açıklaması yasağa aykırıdır. Md. 13/2 uyarınca meslek mensubu, kendi kontrolü altında çalışan elemanların
    gizlilik ilkesinin gereklerine saygı göstermelerini sağlamakla yükümlüdür; Rıza Aksoy bu sorumluluğu yerine getirmemiştir.

    - **6 numaralı olay – ihlal vardır.** Md. 12(b): Meslekî ilişkisi sonucu elde edilen gizli bilgi kişisel çıkar uğruna
    veya üçüncü kişilerin yararına kullanılamaz.


    **(b) Açıklamanın uygunluğu (5 puan)**


    - **3 numaralı olay – uygundur.** Md. 14(c)(3): Kanunun yasaklanmadığı hâllerde, yasal bir süreçte meslek mensubunun meslekî
    çıkarlarını korumak amacıyla açıklama yapması mümkündür. Açıklama bu amaçla ve gerekli ölçüde olmalıdır.

    - **5 numaralı olay – uygundur.** Md. 14(c)(1): Bir meslek odasının veya meslek örgütünün kalite raporuna veri sağlamak,
    kanunun yasaklanmadığı hâllerde meslekî bir görev ya da hak kapsamında açıklama yapılmasına örnektir.


    **(c) Md. 15 – açıklama kararında dikkate alınacak hususlar (5 puan)**


    1. Bilginin müşterinin onayı dâhilinde açıklanması durumunda ilgili tüm tarafların (üçüncü kişi ve gruplar dâhil) çıkarlarının
    zarar görüp görmeyeceği,

    2. Açıklanacak bilgilerin tamamının uygun ve doğrulanmış olup olmadığı (tamamlanmamış veya doğrulanmamış bilgi varsa açıklamanın
    kapsamı hakkında meslekî yargı kullanılmalıdır),

    3. Bilginin kime ve hangi yöntemle verileceği (bilginin verileceği kişi veya grubun doğru olduğu konusunda tatmin olunması).


    **(d) Meslekî atamalardaki değişiklik (5 puan)**


    - Başka bir meslek mensubunun yerine geçmesi istenen meslek mensubu, sözleşmeyi kabul etmemesini gerektiren tehditler
    olup olmadığını belirlemelidir; bunun için **mevcut meslek mensubuyla doğrudan iletişim kurulur** (md. 35/1-2).

    - Mevcut meslek mensubu gizlilik ilkesine uymakla yükümlüdür (md. 35/3); bu nedenle görüşmenin kapsamı **müşterinin izin
    vermesine** ya da bu tür bir iletişime izin veren yasal veya etik gerekliliklere bağlıdır.

    - Önlem olarak Sinem Koç, karar vermeden önce mevcut meslek mensubundan bilmesi gereken gerçeklerle ilgili bilgi isteyebilir
    (md. 35/4-b) ve müşterinin işleri hakkında tümüyle ve özgürce konuşabilir (md. 35/4-a).

    - Önlemlere rağmen tehditler ortadan kaldırılamıyor veya kabul edilebilir düzeye indirilemiyorsa, mevcut verilerden tatmin
    olmadıkça **sözleşmenin kabulünden kaçınmalıdır** (md. 35/5).

    '
