    1. **Selim Arıkan:** Serbest muhasebeci mali müşavirlik ruhsatını 15 Eylül 2025''te almış ve aynı gün çalışanlar listesine
    kaydolmuştur.

    2. **Aylin Doğan:** Ruhsatlı bir serbest muhasebeci mali müşavirdir; çalışanlar listesine kayıtlı değildir ve 2022''den
    beri bir bankada, 3568 sayılı Kanunun 2 nci maddesinde belirtilen işlerle ilgisi bulunmayan bir görevde hizmet akdiyle
    çalışmaktadır.

    3. **Cem Bulut:** Çalışanlar listesine kayıtlı değildir; bir sanayi işletmesinde hizmet akdiyle çalışmakta ve bu işletmede
    Kanunun 2 nci maddesinde belirtilen işleri yapmaktadır.

    4. **Zeynep Aksoy:** İzmir Odası''na kayıtlı yeminli mali müşavirdir; 12 Ağustos 2026''da Ankara Odası bölgesine nakil
    olmuştur. 2026 yılına ilişkin kredi durumu şöyledir: SÜRGEM eğitimlerinden 11 doğrulanabilir kredi; Kamu Gözetimi, Muhasebe
    ve Denetim Standartları Kurumundan zorunlu eğitim kapsamında temel mesleki konulardan kazanıldığı kabul edilen 6 kredi;
    aynı Kurumdan destekleyici konulardan kazanıldığı kabul edilen 4 kredi; Odanın düzenlediği ve Yönetmelikte sayılan programlar
    kapsamındaki iki seminere dinleyici olarak katılım; ayrıca SÜRGEM''e akredite olmayan özel bir eğitim şirketinin düzenlediği
    ve kendisinin 4 kredi saydığı bir vergi planlaması kursuna katılım.


    **İstenenler:**


    (a) Selim Arıkan''ın eğitim yükümlülüğünün başlangıç tarihini; Aylin Doğan ve Cem Bulut''un Yönetmelik kapsamında olup
    olmadıklarını ve kapsamda olmayanın yükümlülükten nasıl muaf tutulacağını açıklayınız. (7 puan)


    (b) Zeynep Aksoy''un Odalar arası nakli hâlinde eğitim sicil dosyasına ne olacağını; eğitim sertifikasında kredilerin
    kim tarafından belirtileceğini ve yıl bazında kim tarafından vize edileceğini belirtiniz. (5 puan)


    (c) Zeynep Aksoy''un 2026 yılı için sayılabilecek doğrulanabilir ve diğer faaliyet kredilerini ayrı ayrı bulunuz; özel
    kursun neden sayılamayacağını açıklayınız; toplam kredinin yılda en az 30 kredi şartı karşısındaki durumunu gösteriniz.
    (10 puan)

    '
  cozum: '**(a) Kapsam ve başlangıç (7 puan)**


    - **Selim Arıkan:** Yükümlülük, meslek ruhsatının edinildiği yılı takip eden yılın ilk gününden başlar (md. 9/1). Ruhsat
    2025''te alındığından yükümlülük **1 Ocak 2026**''da başlar.

    - **Aylin Doğan:** Md. 2/1 kapsamı çalışanlar listesine kayıtlı olanlar, meslek mensubu yanında ya da mesleki şirketlerde
    çalışanlar ile işletmelerde hizmet akdiyle çalışıp Kanunun 2 nci maddesinde belirtilen işleri yapanlar olarak belirler.
    Aylin Doğan bunların **dışındadır**; md. 2/2 uyarınca kapsam dışındakiler sürekli mesleki geliştirme eğitiminden muaftır
    (diledikleri takdirde eğitimlere katılabilirler). Md. 24/1''e göre kapsama girmeyenler **SÜRGEM''e bildirmek suretiyle**
    muaf tutulur.

    - **Cem Bulut:** İşletmede hizmet akdiyle çalışıp Kanunun 2 nci maddesindeki işleri yaptığından md. 2/1 kapsamındadır;
    çalışanlar listesine kayıtlı olmaması bunu değiştirmez.


    **(b) Nakil, sicil ve sertifika (5 puan)**


    Odalar arası nakil hâlinde eğitim sicil dosyası **elektronik ortamda yeni Odaya aktarılır** (md. 14/1). Eğitim sertifikasında
    eğitimin kredisi her yıl için ayrı ayrı **SÜRGEM** tarafından belirtilir ve ilgili yıl **Oda** tarafından vize edilir
    (md. 15/3).


    **(c) 2026 kredileri (10 puan)**


    | Kalem | Değerlendirme | Kredi |

    |---|---|---|

    | SÜRGEM eğitimleri | Doğrulanabilir | 11 |

    | KGK zorunlu eğitimi — temel mesleki konular | Aynı sayıda **doğrulanabilir** kredi (md. 12/1) | 6 |

    | KGK zorunlu eğitimi — destekleyici konular | Aynı sayıda **diğer faaliyet** kredisi (md. 13/1-ğ) | 4 |

    | Oda semineri (2 katılım × 3) | Diğer faaliyet (md. 13/1-b) | 6 |

    | Akredite olmayan özel kurs | Sayılamaz: kurs, seminer vb. faaliyetlerin SÜRGEM''e akredite kurum ya da kuruluşlarca
    yürütülmüş olması gerekir (md. 20) | 0 |


    Doğrulanabilir toplam 11 + 6 = **17** (yıllık en az 15 koşulu sağlanır). Diğer faaliyet toplamı 4 + 6 = **10**. Toplam
    17 + 10 = **27** kredidir; yılda en az 30 kredi şartı (md. 11/1) karşısında **3 kredi eksiktir**.

    '
