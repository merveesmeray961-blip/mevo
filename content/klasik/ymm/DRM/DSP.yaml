- id: YMM-DRM-DSP-K021
  sinav: ymm
  ders: DRM
  konu: DSP
  kazanimlar:
  - 'Disiplin soruşturması: ihbar, şikâyet ve istem; inceleme ve soruşturma süreleri'
  - Kovuşturmaya yer olmadığına ilişkin karara itiraz ve yeniden inceleme
  - Oda ve Birlik kurulu üyeleri hakkında soruşturma
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Çınaraltı Yeminli Mali Müşavirler Odası yönetim kurulu, 2026 yılının ilk aylarında aşağıdaki başvuru ve
    istemleri almıştır. Hiçbir dosyada ivedi durum bulunmamakta; sürelerin işleyişini etkileyecek başka bir husus (mali tatil,
    ceza davası vb.) yer almamaktadır.


    | No | Başvuru veya istem | Ayrıntılar |

    |---|---|---|

    | 1 | Sözlü şikâyet | Mavi Lojistik A.Ş. yetkilisi, 14 Ocak 2026''da TÜRMOB Yönetim Kurulu''na başvurarak YMM Sevil Okur''un
    sözleşme hükümlerine aykırı davrandığını ileri sürmüştür. Şikâyetçinin kimliği, adresi, şikâyet konusu, maddi olaylar
    ve şikâyet günü; Birlik yönetim kurulu başkanı ile şikâyetçinin imzaladığı tutanakta gösterilmiştir. Birlik dosyayı gerekli
    görerek odaya göndermiş, dosya odaya 9 Şubat 2026''da ulaşmıştır. |

    | 2 | Yazılı ihbar | 20 Ocak 2026''da odaya posta ile ulaşan bir mektupta YMM Kerem Tuna''nın reklam yasağına aykırı davrandığı
    ileri sürülmüştür. Mektupta gönderenin kimliği, adresi ve imzası bulunmamaktadır. |

    | 3 | Birlik kurulu istemi | TÜRMOB Yönetim Kurulu, 5 Mart 2026 tarihli bir kurul kararıyla YMM Okan Genç hakkında disiplin
    soruşturması yapılmasını istemiştir. |

    | 4 | Bakanlık istemi | Hazine ve Maliye Bakanlığı, 16 Şubat 2026''da YMM Hale Dağ hakkındaki iddiaları içeren bir inceleme
    raporunu göndererek soruşturma yapılmasını istemiştir. |


    **Ek bilgiler:**


    - 1 numaralı dosyada soruşturmayla görevlendirilen yönetim kurulu üyesi, YMM Sevil Okur''a 2 Mart 2026''da tebliğ edilen
    bilgi isteme yazısında bilgi vermesi için 10 gün süre tanımıştır. Sevil Okur bu sürede hiçbir yanıt vermemiştir.

    - 4 numaralı dosyada oda yönetim kurulu, soruşturma sonunda 22 Nisan 2026''da disiplin kovuşturması açılmasına yer olmadığına
    karar vermiş ve kararı Bakanlığa 27 Nisan 2026''da bildirmiştir. Bakanlık, kararı yerinde bulmamaktadır.

    - Oda yönetim kurulu başkanı YMM Barış Alp hakkında bir oda üyesi, görevi dolayısıyla kanun ve yönetmeliklere aykırı davrandığı
    iddiasıyla şikâyet dilekçesi vermiştir. Aynı üye, yönetim kurulunun aidat politikasının yanlış olduğunu ileri süren ikinci
    bir şikâyet dilekçesi daha vermiştir. Başka bir üye de oda disiplin kurulu başkanı hakkında, kurulun verdiği bir ceza
    kararı nedeniyle şikâyette bulunmuştur.


    **İstenenler:**


    (a) 1, 2, 3 ve 4 numaralı başvuru ve istemlerin her birinin disiplin soruşturması bakımından durumunu (işleme konulup
    konulmayacağını ve dayanağını) açıklayınız; Birlik''in 1 numaralı dosyayı odaya göndermesinin süresinde olup olmadığını
    gösteriniz. (6 puan)


    (b) 1 numaralı dosyada oda yönetim kurulunun inceleme yükümlülüğünün son gününü ve soruşturmanın en geç sonuçlandırılacağı
    tarihi hesaplayınız; bilgi isteme yazısındaki 10 günlük sürenin yeterli olup olmadığını ve Sevil Okur''un yanıt vermemesinin
    sonucunu açıklayınız. (6 puan)


    (c) 4 numaralı dosyada Bakanlığın karara karşı başvurabileceği mercii ile son başvuru tarihini belirtiniz; Birlik merciinin
    inceleme sonunda yapabileceği işlemi ve aynı eylem için oda kurullarının yeniden inceleme yapabilmesinin koşulunu açıklayınız.
    (5 puan)


    (d) Barış Alp ve oda disiplin kurulu başkanı hakkındaki şikâyetlerin Yönetmelik hükümlerine göre nasıl ele alınacağını
    gerekçesiyle açıklayınız. (5 puan)

    '
  cozum: '**(a) Başvuruların durumu (6 puan)**


    | No | Durum | Dayanak |

    |---|---|---|

    | 1 | Sözlü şikâyet geçerlidir; şikâyetçinin kimliği, adresi, konu, maddi olaylar ve gün, kurul başkanı veya üyesi ile
    şikâyetçinin imzaladığı tutanakta gösterildiği için işleme konulur (md. 17). Soruşturma "ilgilinin ihbar veya şikâyeti"
    üzerine yapılır (md. 15/2-a). | md. 15, 17 |

    | 2 | Kimliği, adresi ve imzası bulunmayan ihbar işleme konulmaz. Ancak oda yönetim kurulu gerek gördüğü durumlarda ihbar
    konusu hakkında kendiliğinden soruşturma yapabilir. | md. 17 |

    | 3 | Birlik kurullarından birinin istemidir (md. 15/2-c); istem bir kurul kararına dayandığı için soruşturma yapılır.
    | md. 15 |

    | 4 | Bakanlığın istemidir (md. 15/2-d); istem meslek mensubu hakkındaki iddiaları içeren rapora dayandığı için soruşturma
    yapılır. | md. 15 |


    Birlik kurullarına yapılan sözlü veya yazılı ihbar ve şikâyetler, gerekli görülürse 30 gün içinde ilgili odaya gönderilir
    (md. 17). 14 Ocak 2026 + 30 gün = **13 Şubat 2026**. Dosya 9 Şubat 2026''da odaya ulaştığından gönderme süresi içindedir.


    **(b) 1 numaralı dosyada süreler (6 puan)**


    - Oda yönetim kurulu, ihbar, şikâyet veya istem konusunun bildirilmesinden itibaren en geç iki ay içinde konuyu incelemek
    zorundadır (md. 18). Dosya 9 Şubat 2026''da ulaştığına göre son gün **9 Nisan 2026**''dir.

    - Yönetim kurulu soruşturmayı ihbar, şikâyet veya istek tarihinden itibaren en geç altı ay içinde sonuçlandırır (md. 19).
    Şikâyet tarihi 14 Ocak 2026 olduğundan son tarih **14 Temmuz 2026**''dır.

    - Bilgi almak için meslek mensubuna verilecek süre 15 günden az olamaz (md. 19). 10 günlük süre yetersizdir; bu nedenle
    Sevil Okur''un sessiz kalması, dosya üzerinden inceleme ile yetinmeyi haklı kılmaz. En az 15 gün süre tanıyan yeni bir
    bilgi isteme yazısı gönderilmelidir. Bu geçerli süre de bilgi verilmeden geçerse dosya üzerinden yapılan inceleme ile
    yetinilebilir.


    **(c) 4 numaralı dosyada itiraz (5 puan)**


    - Kovuşturmaya yer olmadığına ilişkin kararlara karşı bildirim tarihinden itibaren 30 gün içinde şikâyetçi, ihbarcı veya
    istemde bulunan Birlik Disiplin Kurulu''na itiraz edebilir (md. 21). Bakanlık istemde bulunan olduğundan itiraz edebilir.
    27 Nisan 2026 + 30 gün = **27 Mayıs 2026**.

    - Birlik Disiplin Kurulu dosya üzerinde inceleme yapar; konuyu incelemeye değer görürse oda yönetim kurulunun kararını
    kaldırır ve disiplin kovuşturması açılması için dosyayı oda disiplin kuruluna gönderir; bazı hâllerde soruşturmanın derinleştirilip
    yeniden oda yönetim kurulunca karar verilmesini isteyebilir. Bu kararlar kesindir.

    - Kovuşturma açılmasına yer olmadığına ilişkin karara konu eylemler için ilgili disiplin kurulunca yeniden inceleme yapılabilmesi
    için yeni kanıtların elde edilmesi gerekir (md. 31).


    **(d) Oda ve Birlik kurulu üyeleri hakkında şikâyet (5 puan)**


    - Barış Alp''in görevi ile ilgili şikâyet dilekçesi, oda genel kuruluna sunulmasının gerekip gerekmediği yönünden önce
    **Birlik Yönetim Kurulu**nca incelenir. Dilekçenin genel kurula sunulması gerektiği yönünde karar verilirse dilekçe genel
    kurula sunulur; genel kurul disiplin soruşturmasına karar verirse **oda disiplin kurulu** gerekli inceleme ve araştırmaları
    yaparak kararını verir. Birlik Yönetim Kurulu''nun aksi yöndeki (sunulmaması yönündeki) kararları kesindir (md. 16).

