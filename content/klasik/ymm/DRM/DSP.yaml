    Birlik Disiplin Kurulu''na itiraz etmiştir. Birlik Disiplin Kurulu itirazı incelemiş ve reddetmiştir. Daha sonra şikâyetçi
    aynı eylemle ilgili yeni delil elde etmeden yeniden başvurmuştur.


    **İstenenler:**


    (a) "Disiplin kovuşturmasına yer olmadığı" kararının ilgililere en geç hangi tarihe kadar yazılı olarak bildirilmesi gerektiğini
