    (c) Birlik Disiplin Kurulu itirazı yerinde bulursa veya reddederse sonuçların neler olduğunu açıklayınız. (6 puan)


    (d) Yeni delil elde edilmeden yapılan yeniden başvuru hakkında ne yapılacağını; oda yönetim kurulunun "disiplin kovuşturması
    açılması" kararının niteliğini belirtiniz. (6 puan)

