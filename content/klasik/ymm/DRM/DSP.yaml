  soru: '**Olay:** YMM Fatma Aydın hakkında odasının disiplin kurulunca verilen cezalar ve sonraki fiiller şöyledir:


    | Tarih | Gelişme |

    |---|---|

    | 12/3/2022 | Fatma Hanım''a işverenine bağımlı çalışması nedeniyle geçici olarak mesleki faaliyetten alıkoyma cezası
    verilmiş, ceza kesinleşip kendisine bildirilmiştir. |

    | 20/5/2024 | Aynı nitelikte yeni bir fiil nedeniyle ikinci kez geçici alıkoyma cezası verilmiş, ceza kesinleşip kendisine
    bildirilmiştir. |

    | 2/2/2026 | Fatma Hanım yine aynı cezayı gerektiren bir fiil işlemiştir. |


    Ayrıca başka bir olayda, aynı odadan YMM Orhan Sever''in mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme
    kararıyla kesinleşmiştir. Üçüncü bir olayda YMM Sevil, ruhsatnamesini bir başkasına bedelli kullandırmıştır.


    **İstenenler:**


    (a) Fatma Hanım''ın 2/2/2026''daki fiili için beş yıllık dönem hesabını yapınız; uygulanacak cezayı belirtiniz. (9 puan)


    (b) Orhan Sever ve Sevil için uygulanacak cezaları ve dayanaklarını belirtiniz. (6 puan)


    (c) Yeminli sıfatını kaldırma cezasının hangi hâlde verildiğini ve cezanın içeriğini açıklayınız. (5 puan)


    (d) Meslekten çıkarma cezasının tanımını yazınız. (4 puan)

    '
  cozum: '**(a)** İlk ceza 12/3/2022''de, ikinci ceza 20/5/2024''te verilmiştir; iki ceza da beş yıllık dönem içindedir (12/3/2022
    - 12/3/2027). Her iki ceza kesinleşip bildirilmiştir (Yön. md. 11). 2/2/2026''daki fiil bu cezayı gerektiren fiildir;
    bu nedenle **meslekten çıkarma** cezası uygulanır (3568 md. 48; Yön. md. 9/a).


    **(b)** Orhan Sever: mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararı ile kesinleştiğinden **meslekten
    çıkarma** (3568 md. 48; Yön. md. 9/c). Sevil: meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz kullandırdığı
    tespit edildiğinden **meslekten çıkarma** (3568 md. 48 ek fıkra; Yön. md. 9/d).


    **(c)** Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca **ilk defa tespit edilip rapora bağlanan**
    YMM''ye geçici olarak mesleki faaliyetten alıkoyma cezası verilir; bu husus **tekerrür edip mahkeme kararıyla kesinleşirse**
    **yeminli sıfatını kaldırma** cezası verilir. Bu cezanın içeriği, yeminli sıfatının kaldırılması ve **mührün geri alınmasıdır**
    (Yön. md. 4/d).


    **(d)** Meslekten çıkarma, meslek mensubunun **ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir**.


    Püf noktaları: (1) Meslekten çıkarma tekerrürü için iki cezanın da kesinleşip bildirilmiş olması aranır. (2) Yeminli sıfatını
    kaldırma için mahkeme kararı şarttır.

    '
