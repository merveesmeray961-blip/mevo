    | 4 | md. 6/ğ |

    | 5 | md. 6/d |

    | 6 | md. 8/d |

    | 7 | md. 8/c |

    | 8 | md. 7/b (ücret tarifesindeki düzenlemeler saklı kalmak kaydıyla) |


    **(b)** 1 numaralı davranış: Disiplin Yönetmeliği md. 6/g (asgari ücret tarifesinin altında iş kabulü) uyarınca **kınama**.
    6 numaralı: md. 6/b (sahip olunmayan unvanın kullanılması) **kınama**. 7 numaralı: md. 6/v (diğer meslek mensubu hakkında
    asılsız ihbar veya şikâyet) **kınama**.


