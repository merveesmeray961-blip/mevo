    alinti: Meslek mensuplarınca, reklam yasağına uyulmaması,
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 6
    alinti: Meslek mensuplarınca, sahip olunmayan unvanların kullanılması,
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 6
    alinti: Çalışanlar listesine kaydolmadan unvan kullanarak, mesleki faaliyette bulunulması,
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 6
