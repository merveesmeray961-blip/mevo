    soruşturmanın derinleştirilip yeniden karar verilmesini isteyebilir); bu kararlar kesindir. Birlik Disiplin Kurulu şikâyetçinin
    itirazını **reddederse**, şikâyetçi red kararına karşı **idari yargı merciine** başvurabilir.


    **(d)** Kovuşturmaya yer olmadığına ilişkin karara konu eylemlerden dolayı yeniden inceleme için **yeni kanıtların elde
