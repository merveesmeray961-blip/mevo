    **(b)** Olay 1: 15/3/2021 + 5 yıl = 15/3/2026; şikâyet 10/3/2026''da kayıtlara girdiğinden süre dolmadan zamanaşımı durmuştur:
    soruşturma **yapılabilir**. Olay 2: 15/3/2020 + 5 yıl = 15/3/2025; şikâyet süre dolduktan sonra girdiğinden soruşturma
    **yapılamaz**.


    **(c)** Eylem aynı zamanda suç teşkil ediyor ve bu suç için kanun daha uzun zamanaşımı süresi öngörmüşse, **bu daha uzun
    zamanaşımı süresi uygulanır**: 8 yıl.


    **(d)** Olay 4: Meslek mensubunun meslekten ayrılması ve odadan kaydının silinmesi, mesleği ifa sırasındaki eylem ve davranışlarından
