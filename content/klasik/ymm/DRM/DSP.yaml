  soru: '**Olay:** Bir yeminli mali müşavirler odasının disiplin kurulu önüne aşağıdaki eylemler gelmiştir:


    | No | Eylem |

    |---|---|

    | 1 | Birlikçe yayımlanan genelge hükümlerine aykırı olarak meslek disiplinini bozucu harekette bulunulması |

    | 2 | Mevzuata aykırı tabela kullanılması |

    | 3 | En az iki kez yazı ile istenmesine rağmen oda aidat borcunun haklı gerekçe olmaksızın ödenmemesi |

    | 4 | Reklam yasağına uyulmaması |

    | 5 | Sahip olunmayan unvanın kullanılması |

    | 6 | Çalışanlar listesine kaydolmadan unvan kullanarak mesleki faaliyette bulunulması |

    | 7 | Yeminli mali müşavirin kendi defterleri hariç defter tutması |

    | 8 | Üç yıllık dönemde üçüncü kez uyarma cezasını gerektiren bir eylemin yinelenmesi |


    **İstenenler:**


    (a) Her eylem için Disiplin Yönetmeliği''ne göre uygulanacak cezayı (uyarma veya kınama) belirtiniz. (12 puan)


    (b) 8 numaralı eylemde kınama cezası verilebilmesi için hangi şartın gerçekleşmesi gerektiğini açıklayınız. (5 puan)


    (c) Uyarma ve kınama cezalarının tanımını yazınız. (4 puan)

    '
  cozum: '**(a)**


    | No | Ceza | Dayanak |

    |---|---|---|

    | 1 | Uyarma | md. 5/b |

    | 2 | Uyarma | md. 5/e |

    | 3 | Uyarma | md. 5/h |

    | 4 | Kınama | md. 6/f |

    | 5 | Kınama | md. 6/b |

    | 6 | Kınama | md. 6/i |

    | 7 | Kınama | md. 6/j |

    | 8 | Kınama | md. 6/a |


    **(b)** Üç yıllık dönemde üçüncü kez uyarma gerektiren eylemin yinelenmesi hâlinde kınama verilebilmesi için **ilk iki
    cezanın kesinleşip ilgiliye bildirilmesi** ve buna rağmen belirtilen süre içinde aynı cezayı gerektiren yeni bir disiplin
    suçunun işlenmesi gerekir (md. 11).


    **(c)** **Uyarma**, meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir.
    **Kınama**, meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir (3568 md. 48).


    Püf noktaları: (1) Tabela ve aidat eylemleri uyarma düzeyindedir; reklam ve unvan eylemleri kınama düzeyindedir. (2) Tekerrürde
    ilk iki cezanın kesinleşmesi ve bildirilmesi aranır.

    '
  puanlama:
  - olcut: (a) Sekiz eylem için doğru ceza ve dayanak
    puan: 12
  - olcut: (b) İlk iki cezanın kesinleşip bildirilmesi şartı
    puan: 5
  - olcut: (c) Uyarma ve kınama tanımları
    puan: 4
