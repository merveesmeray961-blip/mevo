    Olay 5: Meslek mensubunun ölümü hâlinde soruşturma açılmaz, açılmış olan soruşturma veya kovuşturma **sonlandırılır**.


    Püf noktaları: (1) Şikâyetin oda kayıtlarına girmesi zamanaşımını durdurur, kesmez. (2) Meslekten ayrılmak soruşturmayı
    engellemez; ölüm sonlandırır.

