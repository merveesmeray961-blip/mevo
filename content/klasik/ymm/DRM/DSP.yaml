  sinav: ymm
  ders: DRM
  konu: DSP
  kazanimlar:
  - Bildirim (tebligat) hükümleri
  - Tedbir niteliğinde geçici mesleki faaliyetten alıkoyma
  - Yeniden inceleme ve disiplin kurulu üyelerinin reddi
  - Disiplin cezalarının uygulanması ve duyurulması
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Yeminli mali müşavir Levent Karaca, Bozkır Yeminli Mali Müşavirler Odası''na kayıtlıdır. 2026 yılında kendisi
    hakkında aşağıdaki gelişmeler yaşanmıştır:


    1. Aynı yıl içinde Levent Karaca hakkında altı ayrı disiplin soruşturması açılmıştır. Levent Karaca''nın odaya bildirdiği
    adres doğrudur ve tebligat bu adreste alınabilmektedir; odaya kayıtlı elektronik posta adresi bildirmemiştir. Oda, yedinci
    soruşturmada savunma isteme yazısını 4 Mayıs 2026''da e-Birlik yazılımı üzerinden göndermiştir.

    2. Levent Karaca''nın bir müşterisinin tasdik raporlarını kasten gerçeğe aykırı düzenlediği iddiası hem ceza soruşturmasına
    hem de disiplin soruşturmasına konu olmuştur. Cumhuriyet savcılığı, ceza soruşturması sırasında 3 Mart 2026''da Levent
    Karaca''nın geçici olarak mesleki faaliyetten alıkonulmasını (tedbir) talep etmiştir.

    3. Oda yönetim kurulu, 2025 yılında Levent Karaca''nın başka bir eylemi hakkında kovuşturma açılmasına yer olmadığına
    karar vermişti. Şikâyetçi, hiçbir yeni kanıt sunmadan aynı eylem için aynı iddiayı yeniden ileri sürmüştür. Bir başka
    dosyada, oda disiplin kurulu üyesi YMM Hasan Kurt''un Ceza Muhakemesi Kanunu''nda yazılı bir sebeple reddi istenmiştir.

    4. Oda disiplin kurulu, kovuşturma sonunda Levent Karaca''ya 6 Nisan 2026''da (Pazartesi) geçici olarak mesleki faaliyetten
    alıkoyma cezası vermiştir.


    **İstenenler:**


    (a) Levent Karaca''nın doğru adreste tebligat alabilmesine karşın 1 numaralı olayda bildirimin hangi usulle yapılacağını
    nedenini belirterek açıklayınız; bu usulün aşamalarını, sürelerini ve bildirimin yapılmış sayılacağı anı gösteriniz; bu
    usulün sonraki dosyalara etkisini belirtiniz. (7 puan)


    (b) 2 numaralı olayda savcılığın talebiyle tedbir uygulanıp uygulanamayacağını, kararı kimin vereceğini, kovuşturma aşamasında
    tedbirin hangi koşullarla uygulanabileceğini, tedbir kararlarına karşı başvuru yolunu ve tedbir uygulanan dosyaların nasıl
    ele alınacağını açıklayınız. (7 puan)


    (c) 3 numaralı olayda şikâyetin yeniden incelenip incelenemeyeceğini açıklayınız; Hasan Kurt''un reddi isteminin kim tarafından
    nasıl inceleneceğini, yerine kimin katılacağını ve kurulun toplanamaması hâlinde izlenecek yolu belirtiniz. (5 puan)


    (d) 4 numaralı olaydaki karar bakımından oda disiplin kurulu kararının onaylı örneğinin Birlik Disiplin Kurulu Başkanlığı''na
    gönderilmesi için son günü hesaplayınız; cezanın hangi kurum ve kuruluşlara duyurulacağını ve nerede ilan edileceğini
    açıklayınız. (6 puan)

    '
  cozum: '**(a) Bildirim usulü (7 puan)**


    - Bir meslek mensubu hakkında aynı yıl içerisinde açılmış **beşten fazla** disiplin soruşturması varsa o meslek mensubuna
    Yönetmelik uyarınca yapılacak **tüm tebligatlar**, adresi geçerli olsa bile, ikinci fıkradaki (e-Birlik) usule göre yapılır
    (md. 34). Levent Karaca hakkında altı soruşturma bulunduğundan (6 > 5) adresin doğru olması sonucu değiştirmez; 4 Mayıs
    2026''daki e-Birlik bildirimi bu usule uygundur.

    - Aşamalar: (1) Oda, ilgiliye e-Birlik yazılımı aracılığıyla bildirim gönderir ve varsa sistemde kayıtlı cep telefonuna
    eş zamanlı kısa mesajla tebligat gönderildiğini bildirir; (2) bu işlemden sonraki **7 gün içinde** odanın ilan tahtasına,
    e-Birlik sisteminden bildirim gönderildiğine dair duyuru asılır ve **5 iş günü** ilan edilir; (3) ilgili, ilanın askıdan
    indirilmesinden itibaren **5 gün içinde** bildirimi almak için odaya başvurmazsa bildirim yapılmış sayılır.

    - Daha önce bu usule göre tebligat yapılan meslek mensubuna, odaya yeni adres bildirimi yapıncaya kadar farklı dosyalarda
    olsa dahi tüm tebligatlar aynı usulle yapılmaya devam olunur.


    **(b) Tedbir (7 puan)**


    | Konu | Açıklama |

    |---|---|

    | Ceza soruşturması sırasında tedbir | Cumhuriyet savcılığının talebi üzerine **oda disiplin kurulu kararıyla** tedbir
    niteliğinde geçici olarak mesleki faaliyetten alıkoyma uygulanabilir. Tasdik yetkisinin kasten gerçeğe aykırı kullanılması
    geçici alıkoyma gerektirecek nitelikte bir eylemdir (md. 7/g). |

    | Kovuşturma aşamasında tedbir | Geçici alıkoyma veya meslekten çıkarma cezasını gerektirecek nitelikte bir eylemden dolayı
    soruşturma veya kovuşturma yapılan meslek mensubu; oda yönetim kurulunun isteği ve bu isteğin disiplin kurulunca uygun
    görülmesi **veya** disiplin kurulunun gerekli gördüğü hâllerde, son karar verilene kadar tedbir olarak alıkonulabilir.
    |

    | Başvuru yolu | Tedbir kararları kesindir (Birlik Disiplin Kurulu''na itiraz yoktur); ilgililer bu kararlara karşı idari
    yargı mercilerine başvurabilir. |

    | Dosyaların ele alınışı | Tedbir uygulanan dosyalar yönetim ve disiplin kurullarınca **öncelikle** incelenip karara bağlanır.
    |


    **(c) Yeniden inceleme ve ret (5 puan)**


    - Kovuşturma açılmasına yer olmadığına ilişkin kararın konusu eylemler için ilgili disiplin kurulunca yeniden inceleme
    yapılabilmesi için **yeni kanıtların elde edilmesi** gerekir (md. 31). Şikâyetçi yeni kanıt sunmadığından yeniden inceleme
    yapılamaz.

    - Disiplin kurulu üyeleri Ceza Muhakemesi Kanunu''nda yazılı sebeplerle reddedilebilir veya duruşmadan çekilebilir; yerlerine
    yedek üyeler katılır. Red istemi, **reddi istenen üyenin dışındaki üyelerin toplanmasıyla** incelenir. Red veya çekilme
    nedeniyle disiplin kurulu toplanamazsa yetkili disiplin kurulunu **Birlik** belirler (md. 32).


    **(d) Ceza kararının duyurulması (6 puan)**


    - Oda disiplin kurulu kararlarının birer onaylı örneği, karar tarihinden itibaren 30 gün içinde Birlik Disiplin Kurulu
    Başkanlığı''na gönderilir (md. 12). 6 Nisan 2026 + 30 gün = **6 Mayıs 2026** (Çarşamba).

    - Uyarma ve kınama dışındaki cezalar Hazine ve Maliye Bakanlığı ile diğer ilgili kurum ve kuruluşlara duyurulur; bu kurumlar
    gerekli önlemleri alır. Geçici olarak mesleki faaliyetten alıkoyma cezası ayrıca **Resmî Gazete''de ilan** olunur (md.
    12).

    '
