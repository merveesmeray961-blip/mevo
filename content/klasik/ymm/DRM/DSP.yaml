  soru: '**Olay:** YMM Barış Ünal, 20/2/2026''da A Odası''ndan B Odası''na nakil olmuştur. Bir müşterisi 3/3/2026''da Barış
    Bey hakkındaki şikâyetini (olay 2025''te yaşanmıştır) yazılı dilekçeyle odaya iletmiştir. Başka bir kişi, adresi ve imzası
    bulunmayan bir dilekçeyle şikâyette bulunmuştur. Üçüncü bir şikâyet ise TÜRMOB Yönetim Kurulu''na yapılmıştır. İlgili
    oda yönetim kurulu soruşturmayı yürütmek üzere kendi üyelerinden birini görevlendirmiştir. Soruşturmacı, Barış Bey''den
    bilgi isteyen yazıda 15 gün süre vermiştir; süre dolmasına rağmen Barış Bey cevap vermemiştir.


    **İstenenler:**


    (a) Soruşturma yapma yetkisinin hangi odaya ait olduğunu gerekçesiyle belirtiniz. (4 puan)


    (b) İhbar ve şikâyetin biçimlerini; imzasız dilekçenin ve TÜRMOB''a yapılan şikâyetin akıbetini açıklayınız. (7 puan)


    (c) Barış Bey''in bilgi vermemesi hâlinde soruşturmanın nasıl yürütüleceğini belirtiniz. (4 puan)


    (d) Şikâyetin bildirilmesinden itibaren ilk incelemenin hangi süre içinde yapılacağını; soruşturmanın en geç hangi tarihe
    kadar sonuçlandırılması gerektiğini hesaplayınız (şikâyet tarihi 3/3/2026). (7 puan)

    '
  cozum: '**(a)** Soruşturmanın dayandığı ihbar veya şikâyetin sabit olduğu (veya eylemin haber alındığı) tarihte meslek mensubu
    hangi odanın çalışanlar listesinde veya meslek kütüğünde kayıtlı ise disiplin soruşturmasına karar verme ve soruşturmayı
    yürütme yetkisi o odaya aittir. Şikâyet 3/3/2026''da, Barış Bey 20/2/2026''da B Odası''na nakil olduktan sonra geldiğinden
    yetkili oda **B Odası**''dır.


    **(b)** İhbar veya şikâyet **sözlü veya yazılı** olmak üzere iki türlü yapılır. Kimliği, adresi ve imzası bulunmayan ihbar
    ve şikâyetler **işleme konulmaz**; bu nedenle ikinci dilekçe işleme konulmaz. Birlik kurullarına yapılan sözlü veya yazılı
    ihbar ve şikâyetler, gerekli görülürse **30 gün** içinde ilgili odaya gönderilir.


    **(c)** Bilgi almak için verilen süre (en az 15 gün) dolmasına rağmen meslek mensubu bilgi vermezse **dosya üzerinden
    yapılan inceleme ile yetinilir**.


    **(d)** Oda yönetim kurulu, ivedi durumlar hariç, ihbar, şikâyet veya istem konusunun bildirilmesinden itibaren en geç
    **iki ay** içinde konuyu incelemek zorundadır (3/3/2026 + 2 ay = 3/5/2026). Yönetim kurulu soruşturmayı ihbar, şikâyet
    veya istek tarihinden itibaren en geç **altı ay** içinde sonuçlandırır: 3/3/2026 + 6 ay = **3/9/2026**.


    Püf noktaları: (1) Yetkili oda, dosyanın değil kaydın bulunduğu odadır. (2) İlk inceleme süresi iki ay, soruşturma süresi
    altı aydır; karıştırmayın.

    '
