    (L) A.Ş.''nin işini reddetmişlerdir.


    **İstenenler:**


    (a) Bülent Bey''in iş teklifini kabul etmeden önce izleyeceği yolu ve mevcut sözleşmesi bulunan müşteriye hizmet verip
    veremeyeceğini açıklayınız. (6 puan)


    (b) İş teklifini reddeden meslek mensubunun yükümlülüğünü ve iki meslek mensubunun reddi hâlinde iş sahibinin ne yapacağını
    belirtiniz. (4 puan)


    (c) Caner ve Derya''nın eski büroların müşterilerine rızasız hizmet verememe sürelerinin bitiş tarihlerini hesaplayınız.
    (8 puan)


    (d) Bu kurala aykırı davranışın Disiplin Yönetmeliği''ndeki karşılığını belirtiniz. (4 puan)

    '
