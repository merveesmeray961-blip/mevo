  soru: '**Olay:** YMM Tülin Yılmaz hakkında, mükellefle birlikte vergi ziyaına sebebiyet verdiği iddiasıyla ceza davası açılmıştır.
    Aynı eylem nedeniyle odasında disiplin soruşturması da yürütülmektedir. Oda disiplin kurulu, meslekten çıkarma cezasını
    gerektirebilecek nitelikte bir eylem iddiası bulunduğundan Tülin Hanım''ın son karar verilene kadar faaliyetten alıkonulmasını
    gündeme almıştır.


    **İstenenler:**


    (a) Başlamış ceza kovuşturmasının disiplin işlemleri üzerindeki etkisini belirtiniz. (5 puan)


    (b) Tedbir olarak geçici faaliyetten alıkoyma kararının hangi koşullarda verilebileceğini (yönetim kurulu isteği, disiplin
    kurulunun takdiri, ceza soruşturması hâli) açıklayınız. (8 puan)


    (c) Tedbir kararına karşı hangi yola başvurulabileceğini ve tedbir uygulanan dosyaların nasıl ele alınacağını belirtiniz.
    (5 puan)


    (d) Disiplin kovuşturmasının ceza davası nedeniyle bekletilmesi hâlinde disiplin kurulunun karar verme süresine etkisini
    belirtiniz. (4 puan)

    '
  cozum: '**(a)** Meslek mensubu hakkında başlamış olan ceza kovuşturması, disiplin işlem ve kararlarının uygulanmasına **engel
    oluşturmaz** (Yön. md. 30). Kanun md. 48''e göre takibat ve hüküm tesisi de disiplin soruşturması yapılmasına ve disiplin
    cezası uygulanmasına engel değildir.


    **(b)** Fiili, ceza davasına konu olsun veya olmasın "geçici olarak mesleki faaliyetten alıkoyma" veya "meslekten çıkarma"
    cezasını gerektirecek nitelikte bir eylemden dolayı soruşturma veya kovuşturma yapılan meslek mensubu, **ilgili oda yönetim
    kurulunun isteği ve bu isteğin disiplin kurulunca uygun görülmesi** veya **disiplin kurulunun gerekli gördüğü hâllerde**,
    son karar verilene kadar tedbir niteliğinde geçici olarak mesleki faaliyetten alıkonulabilir. **Ceza soruşturması** sırasında
    da Cumhuriyet savcılığının talebi veya oda yönetim kurulunun savcılıktan isteyeceği bilgi üzerine oda disiplin kurulu
    kararıyla bu tedbir uygulanabilir.


    **(c)** Disiplin kurullarının tedbir niteliğindeki kararları **kesindir**; ilgililer bu kararlara karşı **idari yargı
    mercilerine** başvurabilir. Tedbir uygulanan dosyalar yönetim ve disiplin kurullarınca **öncelikle incelenip karara bağlanır**.


    **(d)** Disiplin kovuşturması ceza davası nedeniyle bekletiliyorsa disiplin kurulunun karar verme süresi, ceza davasının
    sonucu kurula **ulaşana kadar durur**.


    Püf noktaları: (1) Tedbir, ilk ve geçici bir önlemdir; ceza değildir. (2) Tedbir kararı kesin olsa da yargı yolu açıktır.

    '
