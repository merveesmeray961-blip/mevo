    ortak olamaz (3568 md. 2/B). |

    | 2 | Uygun | İnceleme, tahlil, denetim yapmak ve rapor düzenlemek YMM''nin çalışma konusudur (Çalışma Usul Y. md. 19/b).
    |

    | 3 | Aykırı | Meslek mensupları yalnız mesleki faaliyetlerini yapabilmek için gerekli olan yardımcı elemanları çalıştırabilir
    (md. 22). |

    | 4 | Aykırı | Meslek mensupları işlerini yaptığı gerçek ve tüzel kişiler için düzenli dosya tutmak zorundadır (md. 28).
    |

