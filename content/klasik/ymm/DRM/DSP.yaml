- id: YMM-DRM-DSP-K012
  sinav: ymm
  ders: DRM
  konu: DSP
  kazanimlar:
  - haksız rekabet ve reklam yasağı
  - disiplin kurulları ve disiplin yönetmeliği
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bir yeminli mali müşavirler odası ve TÜRMOB, haksız rekabetle mücadele kurulları oluşturmaktadır. Oda kurul
    üyeliği için aday gösterilen meslek mensuplarından Ayla''nın kıdemi 4 yıl, Berk''inki 2 yıl 6 aydır. TÜRMOB kurulu için
    aday gösterilen meslek mensuplarından Ceren''in kıdemi 5 yıl 1 ay, Deniz''inki 4 yıl 11 aydır. Odanın üye sayısı binden
    fazladır. Oda kurulu, bir meslek mensubundan istenen defter ve belgeler ibraz edilmeyince ne yapılacağını görüşmektedir.


    **İstenenler:**


    (a) Oda ve Birlik haksız rekabetle mücadele kurullarının en az üye sayısını ve kıdem şartlarını belirtiniz; Ayla, Berk,
    Ceren ve Deniz''in uygunluğunu değerlendiriniz. (9 puan)


    (b) Üye sayısı binden fazla olan odalarda kurul üye sayısını kimin belirleyeceğini ve kurul üyelerinin görev süresini
    belirtiniz. (4 puan)


    (c) Oda kurulunun görev ve yetkilerini (denetim-soruşturma yetkisinin kaynağı, aykırılık tespitinde yapacağı işlem, belge
    ibraz edilmemesi hâli) açıklayınız. (9 puan)

    '
  cozum: '**(a)** Oda kurulu: biri başkan olmak üzere **en az üç üye**; üyeler en az **üç yıl** kıdemli meslek mensupları
    arasından oda yönetim kurulu tarafından görevlendirilir. Birlik kurulu: biri başkan olmak üzere **en az beş üye**; üyeler
    en az **beş yıl** kıdemli meslek mensupları arasından Birlik Yönetim Kurulu tarafından görevlendirilir.


    | Aday | Sonuç |

    |---|---|

    | Ayla (oda, 4 yıl) | Uygun (>= 3 yıl) |

    | Berk (oda, 2 yıl 6 ay) | Uygun değil (< 3 yıl) |

    | Ceren (Birlik, 5 yıl 1 ay) | Uygun (>= 5 yıl) |

    | Deniz (Birlik, 4 yıl 11 ay) | Uygun değil (< 5 yıl) |


    **(b)** Üye sayısı binden fazla olan odalarda kurul üye sayısını **oda yönetim kurulu** belirler. Kurul üyelerinin görev
    süresi, oda yönetim kurulunun görev süresi kadardır (Birlik kurulunda Birlik Yönetim Kurulu görev süresi kadar); görev
    süresi biten üye yeniden görevlendirilebilir.


    **(c)** Oda kurulu, **oda yönetim kurulu tarafından görevlendirilmek kaydıyla** meslek mensuplarının haksız rekabet ve
    reklam ilkelerine ilişkin meslek kurallarını ihlal edip etmediği konusunda denetim ve soruşturma yapar. Aykırılık tespit
    ettiğinde sorumlular için **uygun görülen yaptırım önerisi ile birlikte** durumu oda yönetim kuruluna sunar (yaptırımı
    kurul kendisi vermez). Kurulca talep edilen defter, evrak, dosya, kayıt ve belgeler ibraz veya teslim edilmezse gerektiğinde
    **mahkemeye başvurulmasını** ve belgelerin ibraz veya tesliminin sağlanmasını oda yönetim kuruluna **teklif eder**.


    Püf noktaları: (1) Oda kurulunda 3 yıl, Birlik kurulunda 5 yıl kıdem aranır. (2) Kurul yaptırım vermez; öneri sunar.

    '
  puanlama:
  - olcut: (a) Üye sayıları, kıdem şartları ve dört adayın değerlendirilmesi
    puan: 9
  - olcut: (b) Üye sayısını belirleyen organ ve görev süresi
    puan: 4
  - olcut: (c) Oda kurulunun görev ve yetkileri
    puan: 9
  kaynaklar:
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 25
    alinti: Kurul, biri Başkan olmak üzere en az üç üyeden oluşur. Üye sayısı binden fazla olan odalarda kurul üye sayısı
      oda yönetim kurulu tarafından belirlenir.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 25
    alinti: kıdemli meslek mensupları arasından oda yönetim kurulu tarafından görevlendirilir.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 27
    alinti: Kurul üyelerinin görev süresi oda yönetim kurulunun görev süresi kadardır.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 28
    alinti: Kurul, biri başkan olmak üzere en az beş üyeden oluşur.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 28
    alinti: Kurul üyeleri, en az beş yıl kıdemli meslek mensupları arasından Birlik Yönetim Kurulu tarafından görevlendirilir.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 26
    alinti: Oda yönetim kurulu tarafından görevlendirilmek kaydıyla, meslek mensuplarının haksız rekabete ve reklam ilkelerine
      ilişkin meslek kurallarını ihlâl edip etmedikleri konusunda denetim ve soruşturma yapmak.
  - mevzuat: Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 26
    alinti: Meslek mensuplarının haksız rekabet veya reklam ilke ve kurallarına aykırılık teşkil eden davranış ve uygulamalarının
      tespiti halinde, bundan sorumlu olanlar için uygun görülen yaptırım önerisi ile birlikte durumu ilgili oda yönetim kuruluna
      sunmak.
