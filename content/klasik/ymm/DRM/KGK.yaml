  soru: '**Olay:** Gamma Bağımsız Denetim A.Ş. (Gamma), kamu yararını ilgilendiren kuruluş (KAYİK) niteliğindeki Omega Sigorta
    A.Ş. ile KAYİK olmayan Zeta Tekstil A.Ş.''nin (Zeta) bağımsız denetimlerini yürütmektedir. Gamma''nın ilk denetim sözleşmesi
    2014 yılında imzalanmıştır. Kurumca Gamma nezdinde yapılan son kalite güvence sistemi incelemesine ilişkin Kurul kararı
    20.06.2025 tarihlidir.


    1. Denetçi Hakan Bey, Zeta''nın 2017–2019 hesap dönemlerinde Alfa Denetim A.Ş.''nin, 2020–2023 hesap dönemlerinde ise
    Gamma''nın denetim ekibinde görev almıştır. Alfa ile Gamma aynı denetim ağında değildir. Hakan Bey 2024 ve 2025 hesap
    dönemlerinde Zeta''nın denetiminde yer almamıştır. Gamma, Hakan Bey''i Zeta''nın 2026 hesap dönemi denetiminde sorumlu
    denetçi olarak görevlendirmek istemektedir. Hakan Bey''in sorumlu denetçilik için aranan tecrübe şartlarını sağladığı
    bilinmektedir.

    2. Gamma ile aynı denetim ağında bulunan Gamma Danışmanlık Ltd. Şti., 2026 yılında Zeta''ya kurumsal kaynak planlaması
    (ERP) kurulum danışmanlığı vermiştir. Aynı yıl Gamma''nın YMM ortağı, Zeta''nın 2025 yılı kurumlar vergisi beyannamesini
    3568 sayılı Kanun çerçevesinde tasdik etmiştir.

    3. Zeta, 2025 hesap dönemine ait denetim ücretini geçerli bir neden göstermeksizin ödememiştir.


    Sürelerin hesap dönemi (takvim yılı) esasına göre hesaplanacağını varsayınız. Yalnız 660 sayılı KHK ve Bağımsız Denetim
    Yönetmeliği (BDY) hükümlerini dikkate alınız.


    **İstenenler:**


    (a) Hakan Bey''in Zeta''nın 2026 hesap dönemi denetiminde görev alıp alamayacağını değerlendiriniz. Görev alamıyorsa en
    erken hangi hesap döneminde görev alabileceğini gerekçesiyle belirtiniz. (6 puan)


    (b) 2. ve 3. maddelerdeki durumları bağımsızlık açısından değerlendiriniz; Gamma''nın bu durumda yapması gerekenleri açıklayınız.
    (8 puan)


    (c) 2. maddedeki aykırılık için BDY''de öngörülen idari yaptırımı ve azami süresini, bu yaptırımın idari para cezasıyla
    ilişkisini ve yaptırım kararına karşı başvuru yolunu açıklayınız. (6 puan)


    (d) Gamma nezdinde yapılacak bir sonraki planlı kalite güvence sistemi incelemesinin en geç hangi tarihe kadar yapılması
    gerektiğini gerekçesiyle belirtiniz. (5 puan)

    '
  cozum: '**(a) Rotasyon (6 puan)**


    BDY md. 26/1-ç''ye göre denetim kuruluşları ve denetçiler, **son on yılda yedi yıl** denetim çalışmasını yürüttükleri
    aynı işletmenin denetimlerini **üç yıl geçmedikçe** üstlenemez. md. 26/2''ye göre çalışılan denetim kuruluşuna bakılmaksızın
    denetçinin aynı işletmenin denetiminde geçirdiği süreler **birlikte** dikkate alınır.


    - Alfa: 2017–2019 = 3 yıl; Gamma: 2020–2023 = 4 yıl → toplam **7 yıl** (son on yıl içinde).

    - Üç yıllık bekleme süresi: 2024, 2025 ve 2026 hesap dönemleri. 2026 itibarıyla yalnız iki dönem geçmiştir.

    - Sonuç: Hakan Bey 2026 hesap dönemi denetiminde **görev alamaz**; en erken **2027** hesap döneminde görev alabilir. Bu
    sınırlamaya aykırılık, md. 41/1-e uyarınca faaliyet izninin askıya alınmasını gerektirir.


    **(b) Bağımsızlık değerlendirmesi (8 puan)**


    - **ERP danışmanlığı:** BDY md. 22/5''e göre denetim kuruluşu denetlenen işletmeye 3568 sayılı Kanun çerçevesinde **tasdik,
    vergi danışmanlığı ve vergi denetimi dışında** danışmanlık veya başka hizmet veremez; bunu **denetim ağındakiler aracılığıyla
    da yapamaz**. Ağ şirketinin ERP danışmanlığı bu yasağa aykırıdır.

    - **YMM ortağın tasdiki:** Gerçek kişi ortakların hizmetleri de md. 22/5 kapsamında değerlendirilir. Ancak 3568 sayılı
    Kanun çerçevesindeki tasdik açıkça istisnadır; **aykırılık yoktur**.

    - **Ödenmeyen ücret:** md. 22/3-b''ye göre geçmiş yıllara ilişkin denetim ücretinin geçerli bir neden olmaksızın ödenmemesi
    bağımsızlığı **zedeleyen** durumlardandır.

    - **Gamma''nın yapması gerekenler:** Tehditler, alınan önlemler ve değerlendirmeler **yazılı olarak kayda alınır ve saklanır**
    (md. 22/4). Önlemler tehditleri bertaraf etmeye yetmezse bağımsızlığın zedelendiği ve ortadan kalktığı kabul edilir; durum
    **Kuruma bildirilir ve denetim sözleşmesi sonlandırılır** (md. 22/4). Bağımsızlığı zedeleyecek denetimler üstlenilemez
    (md. 26/1-b). Sözleşme feshedilirse fesih ve gerekçeleri **10 gün içinde** Kuruma yazılı bildirilir. Çalışma notları yerine
    geçecek denetçiye teslim edilir (md. 29/4-5).


    **(c) Yaptırım (6 puan)**


    - md. 22/5''e aykırı hizmet verilmesi, md. 41/1-d uyarınca **faaliyet izninin askıya alınması** yaptırımını gerektirir.
    Süre fiilin ağırlığına göre **iki yılı geçmemek üzere** Kurul kararıyla belirlenir. Askıya alma süresince yeni sözleşme
    yapılamaz ve denetimlerde görev alınamaz (md. 43/8). Kurul gerekçe göstererek daha hafif yaptırım uygulayabilir (md. 43/3).

    - İdari yaptırıma karar verilmiş olması, KHK md. 26/3 uyarınca bağımsız denetim kuruluşlarına **10.000–50.000 TL** arası
    **idari para cezası** verilmesine **engel değildir** (KHK md. 25/5; BDY md. 39/2).

    - Yaptırımdan önce **en az 10 gün** savunma süresi verilir (md. 43/2). Kurul kararları **kesindir, Kurula itiraz edilemez**;
    idari yaptırım kararlarına karşı **yetkili idare mahkemesinde dava** açılabilir ve dava öncelikli işlerdendir (KHK md.
    30; BDY md. 43/4).


    **(d) Kalite güvence incelemesi (5 puan)**


    KHK md. 25/1 ve BDY md. 38/3''e göre KAYİK''leri denetleyen kuruluşlarda inceleme **asgari üç yılda bir** yapılır. Gamma
    Omega Sigorta''yı (KAYİK) denetlediğinden üç yıllık süre uygulanır. İzleyen incelemelerde süre, önceki incelemeye ilişkin
    Kurul kararını (20.06.2025) **takip eden takvim yılından** (01.01.2026) itibaren yeniden başlar. 2026, 2027 ve 2028 yılları
    dikkate alındığında bir sonraki planlı inceleme **en geç 31.12.2028** tarihine kadar yapılmalıdır. Kurumun ihbar, şikâyet
    ve bildirim üzerine her zaman inceleme yapma yetkisi saklıdır.

    '
