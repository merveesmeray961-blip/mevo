- id: YMM-DRM-KGK-K002
  sinav: ymm
  ders: DRM
  konu: KGK
  kazanimlar:
  - 660 sayılı KHK
  - bağımsız denetim yönetmeliği
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurulu (Kurul) ile Kurumun gözetimindeki bağımsız denetim
    kuruluşlarına ilişkin aşağıdaki olaylar yaşanmıştır.


    **I. Kurul toplantıları:** Dokuz üyeden oluşan Kurulun bir toplantısına 7 üye katılmış; bir karar tasarısı 4 üyenin kabul,
    3 üyenin ret oyuyla sonuçlanmıştır (çekimser oy kullanılmamıştır). Karar, sonraki toplantıda yeniden gündeme getirilmiş;
    bu toplantıya 6 üye katılmış, Başkanın da kabul yönünde oy kullandığı 3 üye kabul, 3 üye ret oyu vermiştir. Ayrıca Kurul
    üyesi Ece, geçerli mazereti olmaksızın 2026 takvim yılında toplam üç toplantıya katılmamıştır.


    **II. Kurul üyelerinin yasakları:**

    - Kurul üyesi Mert, 1 Mart 2026''da atanmıştır. Eşinin sahibi olduğu, Kurumun düzenlemek ve denetlemekle sorumlu olduğu
    bir kuruluşa ait sermaye piyasası araçlarını 20 Nisan 2026''da satmıştır (Hazine borçlanma araçları değildir).

    - Kurul üyesi Kemal, bir üniversitede bilimsel nitelikli dersler vermekte ve ayrıca kendi serbest muhasebeci mali müşavirlik
    bürosunu işletmektedir.

    - Eski Kurul üyesi Nur, görevinden 31 Aralık 2025''te ayrılmış; 15 Haziran 2027''de Kurumun denetlemekle görevli olduğu
    sektörde faaliyet gösteren özel bir bağımsız denetim kuruluşunda yönetim kurulu üyesi olmuştur.


    **III. Delta Bağımsız Denetim A.Ş. hakkında Kurum incelemesi:** İnceleme sonucunda şu hususlar tespit edilmiştir: (1)
    Mesleki sorumluluk sigortası yaptırılmamıştır. (2) Denetçilerden, bağımsızlık, tarafsızlık ve sır saklamaya ilişkin yazılı
    taahhüt yılda en az bir kez alınmamıştır. (3) Kuruluşun hizmetlerini tanıtan ücretli bir radyo reklamı yayımlatılmıştır.
    (4) Denetlenen Y A.Ş.''ye 3568 sayılı Kanun çerçevesinde tasdik, vergi danışmanlığı ve vergi denetimi dışında kurumsal
    yönetim danışmanlığı hizmeti verilmiştir. Kurul, hiçbir tespit bakımından daha hafif bir yaptırım uygulanmasını gerektiren
    bir durum görmemiştir.


    **IV. Şeffaflık raporu:** Hesap dönemi takvim yılı olan X Denetim A.Ş., 2025 takvim yılında kamu yararını ilgilendiren
    kuruluş (KAYİK) denetimi yapmış, yıllık şeffaflık raporunu 20 Mayıs 2026''da Kuruma bildirmiş ve internet sitesinde yayımlamıştır.
    Y Denetim A.Ş., KAYİK denetimine ilişkin listelerde yer almakla birlikte 2025 takvim yılında KAYİK denetimi yapmamıştır.


    **İstenenler:**


    (a) I numaralı olayda ilk ve ikinci toplantılarda karar alınıp alınmadığını, toplantı ve karar nisaplarına dayanarak belirtiniz;
    Ece''nin durumunu ve bu durumun nasıl tespit edileceğini, boşalan üyeliğin nasıl doldurulacağını açıklayınız. (6 puan)


    (b) II numaralı olayda Mert, Kemal ve Nur''un durumlarını Kurum Başkan ve üyelerine ilişkin yasaklar bakımından değerlendiriniz;
    Mert''in satış için geçen süreyi gün olarak gösteriniz. (6 puan)


    (c) III numaralı olayda (1)-(4) numaralı tespitlerin her biri için Bağımsız Denetim Yönetmeliği''ne göre uygulanacak yaptırımı
    (varsa azami süresiyle) belirtiniz; bu yaptırımlara karar verilmiş olmasının ayrıca idari para cezasına engel olup olmadığını
    ve askıya alma kararı verilenlerin bu süre içindeki durumunu açıklayınız. (7 puan)


    (d) X Denetim A.Ş. için şeffaflık raporunun bildirim süresinin son gününü, gecikmenin yaptırımını, raporu imzalayacak
    kişiyi ve raporun kamunun erişimine açık tutulacağı süreyi; Y Denetim A.Ş.''nin bu konudaki yükümlülüğünü belirtiniz.
    (6 puan)

    '
  cozum: '**(a) Kurul toplantı ve karar nisabı (6 puan)**


    KHK md. 8/3''e göre Kurul **en az altı üyenin hazır bulunmasıyla toplanır** ve **en az beş üyenin aynı yöndeki oyuyla
    karar alır**; oylamalarda **çekimser oy kullanılamaz**.


    - **İlk toplantı:** 7 üye hazır olduğundan toplantı nisabı vardır; ancak kabul oyu 4''tür, gereken 5 oya **1 oy eksiktir.**
    Karar **alınamaz.**

    - **İkinci toplantı:** 6 üye hazır olduğundan toplantı nisabı sağlanmıştır. Kararın nisabı sağlanamadığı durumlarda **bir
    sonraki toplantıda oylarda eşitlik olması halinde Başkanın bulunduğu tarafın oyu üstün sayılır.** 3-3 eşitlik olduğundan
    ve Başkan kabul yönünde oy kullandığından karar **kabul yönünde alınır.**

    - **Ece:** md. 8/5''e göre geçerli mazereti olmaksızın bir takvim yılında toplam **üç toplantıya** katılmayan üye **üyelikten
    çekilmiş sayılır**; bu durum **Kurul kararı ile tespit edilir.** Boşalan üyelik için md. 5/1''e göre **bir ay içinde**
    md. 4''teki esaslara göre atama yapılır; atanan kişi yerine atandığının süresini tamamlar.


    **(b) Yasaklar (6 puan)**


    - **Mert:** md. 6/2''ye göre Kurul üyeleri, eşlerinin sahibi bulunduğu Kurumun düzenlemek ve denetlemekle sorumlu olduğu
    kuruluşların sermaye piyasası araçlarını **otuz gün içinde satarak elden çıkarmak** zorundadır. 1 Mart - 20 Nisan arası
    **50 gün** geçmiştir; bu süre otuz günlük süreyi aşmaktadır. Atanmalarından itibaren otuz gün içinde bu fıkraya uygun
    hareket etmeyen üye **üyelikten çekilmiş sayılır;** bu durum **Kurul kararıyla tespit edilir ve Bakana bildirilir.**

    - **Kemal:** md. 6/1''e göre **bilimsel amaçlı ders ve konferans gibi etkinlikler hariç** olmak üzere Kurul üyeleri serbest
    meslek faaliyetinde bulunamaz. Ders vermesi serbesttir; **serbest muhasebeci mali müşavirlik bürosu işletmesi yasağa aykırıdır.**
    md. 5/2''ye göre durumu 6. maddeye aykırı olduğu anlaşılanların görevi **Cumhurbaşkanınca sona erdirilir.**

    - **Nur:** md. 6/3''e göre Kurul üyeleri görevlerinden ayrılmalarını izleyen **iki yıl içinde** Kurumun denetlemekle ve
    düzenlemekle görevli olduğu sektör ve alandaki özel kuruluşlarda görev alamaz. Yasak **31 Aralık 2027**''ye kadar sürmektedir;
    Nur''un 15 Haziran 2027''deki görevi **yasağa aykırıdır.**


    **(c) Bağımsız Denetim Yönetmeliği yaptırımları (7 puan)**


    | Tespit | Madde | Yaptırım |

    |---|---|---|

    | (1) Mesleki sorumluluk sigortasının yaptırılmaması | md. 33; md. 40/1-e | **Uyarı** |

    | (2) Yazılı taahhüdün alınmaması | md. 21/2; md. 39/A-1-b | **İkaz** |

    | (3) Reklam yasağına aykırılık | md. 23; md. 40/A-1-b | **Faaliyetin kısıtlanması** (iki yılı geçmemek üzere Kurul kararıyla
    belirlenen süre) |

    | (4) 22. maddenin beşinci fıkrasına aykırı hizmet verilmesi | md. 22/5; md. 41/1-d | **Faaliyet izninin askıya alınması**
    (iki yılı geçmemek üzere Kurul kararıyla belirlenen süre) |


    - md. 39/2''ye göre idari yaptırımlara karar verilmiş olması, ayrıca **idari para cezasına karar verilmesine engel teşkil
    etmez.**

    - md. 43/8''e göre faaliyet izni **askıya alınanlar bu süre içinde yeni sözleşme yapamaz ve denetimlerde görev alamaz.**

    - Kurul, fiilin ağırlığını dikkate alarak gerekçesini belirtmek suretiyle daha hafif bir yaptırım uygulamaya yetkilidir
    (md. 43/3).


    **(d) Şeffaflık raporu (6 puan)**


    - md. 36/1: Bir takvim yılında KAYİK denetimi yapmış denetim kuruluşları, ilgili takvim yılını müteakip **dördüncü ayın
    sonuna kadar** raporu Kuruma bildirir ve internet sitelerinde yayımlar. 2025 yılı için süre **30 Nisan 2026**''da dolmuştur;
    20 Mayıs 2026''daki bildirim **gecikmelidir.**

    - md. 40/1-g: Şeffaflık raporunun hazırlanmaması, zamanında Kuruma bildirilmemesi veya yayımlanmaması halinde **uyarı**
    yaptırımı uygulanır.

    - md. 36/2: Rapor, denetim kuruluşunun **yönetim organı başkanı tarafından imzalanır.**

    - md. 36/5: Şeffaflık raporu ve güncellenmesi halinde orijinal hali ile güncellenmiş halleri ayrı ayrı **beş yıl süreyle**
    kamunun erişimine açık tutulur.

    - md. 36/4: KAYİK denetimi listelerinde yer almakla birlikte bir takvim yılı içinde KAYİK denetimi yapmayan **Y Denetim
