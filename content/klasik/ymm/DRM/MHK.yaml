    (c) İşyeri değişikliğini bildirme süresini, bildirim için son tarihi ve açılış/kapanışlarda bildirim süresini belirtiniz.
    (5 puan)


    (d) Büro Tescil Belgesi alınmamasının Disiplin Yönetmeliği''ndeki karşılığını belirtiniz. (4 puan)

