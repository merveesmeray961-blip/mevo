    bir faaliyet (sosyal tesis işletmeciliği) başlatmıştır. Hazine ve Maliye Bakanlığı durumu tespit ederek harekete geçmiştir.
    Olayın ilerleyen aşamalarında valilik, bir toplantı sırasında kamu düzenini bozacak olaylar çıkması üzerine odayı 10/6/2026
    Çarşamba günü saat 09.00''da faaliyetten men etmiştir.


    **İstenenler:**


    (a) Odaların faaliyet sınırını ve amaç dışı faaliyetin tespiti hâlinde organların görevlerine son verilmesi için kimin
    istemi üzerine hangi yargı yerinde, hangi usulle karar verileceğini ve davanın sonuçlanma süresini belirtiniz. (7 puan)


    (b) Görevlerine son verilen organlar için mahkeme kararında ayrıca ne öngörülür; yeni organların seçim süresi ile yeni
    seçilenlerin görev süresini açıklayınız. (7 puan)


    (c) Valinin faaliyetten men kararının hâkim onayına en geç ne zaman sunulması gerekir? Karar 11/6/2026 saat 08.00''de
    sunulmuş olsaydı hâkimin kararını en geç ne zaman açıklaması gerekirdi ve açıklamazsa sonuç ne olurdu? (6 puan)


    (d) Bu hükümlerin oda genel kurulu bakımından uygulanıp uygulanmadığını belirtiniz. (4 puan)

    '
  cozum: '**(a)** Odalar kuruluş amaçları dışında faaliyette bulunamaz. Amaçları dışında faaliyet gösteren odaların sorumlu
    organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, **Maliye Bakanlığının veya bulundukları
    yer Cumhuriyet Başsavcılığının istemi** üzerine **asliye hukuk mahkemesince basit usule göre** yargılama yapılarak karar
    verilir; dava en geç **üç ay** içinde sonuçlandırılır.


    **(b)** Mahkeme organların görevine son verirse kararda ayrıca, yeni organları seçecek organları toplamak üzere oda yönetim
    kurulu için oda genel kurulu üyeleri arasından **beş kişi** görevlendirilir. Seçim, bu beş kişi tarafından **bir ay**
    içinde sonuçlandırılır. Yeni seçilen organlar **eski organların görev sürelerini tamamlar**.


    **(c)** Faaliyetten men kararı **yirmidört saat** içinde görevli hâkimin onayına sunulur: en geç **11/6/2026 saat 09.00**.
