    sözleşme yapmış; aynı müşteriden 2025 yılı ücretini tahsil edemediği hâlde 2026''da da işi sürdürmüştür. Odası bu durumu
    tespit etmiştir. Yeni tarife dönemine ilişkin bilgiler de aşağıdadır: Oda yönetim kurulu 2027 tarifesine ilişkin teklifini
    hazırlamaktadır.


