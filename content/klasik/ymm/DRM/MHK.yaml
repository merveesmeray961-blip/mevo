    Odası''na kaydolmuştur. Gülay Hanım evinin bir odasını büro olarak kullanmakta, ayrıca başka bir ilçede ikinci bir büro
    açmayı ve bir "irtibat bürosu" kurmayı düşünmektedir. Büro Tescil Belgesini hiç almamıştır. 20/6/2026''da işyerini başka
    bir adrese taşımıştır.


    **İstenenler:**


    (a) Büro edinme zorunluluğunu ve büronun sahip olması gereken niteliklerle (bağımsızlık, ev kullanımı, sayı, irtibat bürosu)
    ilgili kuralları Gülay Hanım''ın durumuna uygulayınız. (8 puan)


