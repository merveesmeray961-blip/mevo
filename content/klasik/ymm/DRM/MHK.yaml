    (b) Berk Gıda A.Ş.''nin kredilere ilişkin tasdik işlemi için ödeyeceği ücreti, indirimin koşulunu, oranını ve üst sınırını
    göstererek hesaplayınız. (6 puan)


    (c) Kıvanç Ltd. Şti. ile yapılan sözleşmedeki ücretin geçerli olup olmadığını, hizmetin hangi yılın tarifesine göre değerlendirileceğini
    ve en az kaç TL ücret alınabileceğini belirtiniz; tarifedeki asgari ücretin altında iş kabulünün 3568 sayılı Kanun ve
    Disiplin Yönetmeliği bakımından sonucunu açıklayınız. (7 puan)


    (d) Umut Yardım Derneği için alınabilecek en düşük ücreti, dayanağını belirterek hesaplayınız. (6 puan)

    '
  cozum: '**(a) Kıst uygulaması (6 puan)**


    Tarife Not 11''e göre münhasıran yıl içinde işe başlayan mükelleflerde Gelir ve Kurumlar Vergisi Beyannamesi tasdik hizmeti
    ücreti, **ay kesirleri tam sayılarak** kıst uygulanır. Özsu Ltd. Şti. 18 Eylül''de başladığından Eylül ayı (kesir) tam
    ay sayılır; Eylül-Aralık = **4 ay**.


    | İşlem | Tutar |

    |---|---|

    | Tam yıl ücreti | 360.000 TL |

    | Kıst ücret: 360.000 x 4 / 12 | **120.000 TL** |


    **(b) Kredi tasdiki indirimi (6 puan)**


    Not 12-C''ye göre YMM ile **sürekli denetim ve tasdik sözleşmesi bulunan** mükelleflerin kredilere ilişkin tasdik işlemlerinde
    **%50 indirim** uygulanır; ancak uygulanan indirim tutarı **yıllık sürekli denetim ve tasdik ücretinin %25''ini** geçemez.
    Berk Gıda A.Ş.''nin sözleşmesi bulunduğundan koşul sağlanmıştır.


    | Kalem | Tutar |

    |---|---|

    | %50 indirim: 120.000 x 50 / 100 | 60.000 TL |

    | Üst sınır: 200.000 x 25 / 100 | 50.000 TL |

    | Uygulanacak indirim (küçük olan) | 50.000 TL |

    | **Ödenecek ücret: 120.000 - 50.000** | **70.000 TL** |


    **(c) Önceden yapılan sözleşme ve tarife altı ücret (7 puan)**


    - Not 8''e göre 01/01/2026 tarihinden önce, 2026 yılında yapılacak hizmetler için düzenlenen sözleşmelerdeki ücret de
    2026 tarifesinde tespit edilen ücretlerden **düşük olamaz**; Not 6''ya göre asgari ücret uygulamasında **hizmetin yapıldığı
    yılın tarifesi** esastır. Sözleşmenin 2025''te imzalanmış olması 2025 tarifesinin uygulanmasını gerektirmez. Her yıl için
    ayrı sözleşme düzenlenir (Not 8).

    - Alınabilecek en az ücret **190.000 TL**''dir; sözleşmedeki 150.000 TL, tarifenin **40.000 TL** altındadır ve bu haliyle
    uygulanamaz (ücret 190.000 TL''ye çıkarılmalıdır).

    - Kanun md. 46/2''ye göre tarifedeki asgari miktar altında ücret karşılığında iş kabulü **yasaktır**; aksine hareket **disiplin
    cezasını gerektirir**. Disiplin Yönetmeliği md. 6/g''ye göre asgari ücret tarifesinde yer alan ücretlerin altında iş kabul
    edilmesi **kınama** cezası gerektirir. Elif Arslan hakkında önceki ceza yoktur ve takdir hakkı kullanılmadığından ceza
    kınamadır.


    **(d) Gayrifaal kurumda alt sınır (6 puan)**


    Tarife Not 12''ye göre indirim uygulanması suretiyle bulunan ücretler, aksi belirtilmedikçe tarifedeki maktu ücretlerden,
    **gayrifaal kurumlarda ise asgari maktu ücretin %50''sinden** az olamaz.


    - Alt sınır: 60.000 x 50 / 100 = **30.000 TL**.

    - İndirimle bulunan ücret (20.000 TL) alt sınırın altında kaldığından alınabilecek en düşük ücret **30.000 TL**''dir.

    '
