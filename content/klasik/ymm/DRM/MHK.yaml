    Bey''in akrabalık bağları şöyledir: boşandığı eşi, dayısı, amcasının oğlu, kayınpederi, yeğeni (kardeşinin çocuğu, SMMM)
    ve kuzeni (SMMM).


    | No | İş |

    |---|---|

    | 1 | Boşandığı eşinin yönetim kurulu başkanı olduğu A.Ş. |

    | 2 | Dayısının ortak ve müdür olduğu Ltd. Şti. |

    | 3 | Amcasının oğlunun ortak ve müdür olduğu Ltd. Şti. |

    | 4 | Kayınpederinin ortak ve müdür olduğu Ltd. Şti. |

    | 5 | Yeğeni SMMM''nin baktığı bir işletme |

    | 6 | Kuzeni SMMM''nin baktığı bir işletme |


    **İstenenler:**


    (a) 1-4 numaralı işlere Gökhan Bey''in bakıp bakamayacağını derece hesabıyla belirtiniz. (8 puan)


    (b) 5 ve 6 numaralı işletmelerin tasdikinin mümkün olup olmadığını belirtiniz. (5 puan)


    (c) Gökhan Bey''in aynı yasak işlere baktığı tespit edilirse Disiplin Yönetmeliği''ne göre uygulanacak cezayı yazınız.
    (4 puan)


    (d) Gökhan Bey''in 2026''da mesleğinden ayrıldığını, tebligatın 10/3/2026''da yapıldığını varsayarak mührünü Birliğe iade
    süresini ve (vefat hâlinde) mirasçıların iade süresini tarihleriyle belirtiniz. (5 puan)

    '
  cozum: '**(a)** Yeminli mali müşavirler; eşi (boşanmış dahi olsa), usul ve füruundan biri ve **3 üncü dereceye kadar (bu
    derece dahil) kan ve sıhrî hısımlarının** veya bunların ortak oldukları firmaların işlerine bakamaz.


    | No | Akrabalık | Derece | Sonuç |

    |---|---|---|---|

    | 1 | Boşanmış eş | Boşanmış dahi olsa yasak kapsamında | Bakamaz |

    | 2 | Dayı | 3. derece kan hısımı | Bakamaz |

    | 3 | Amcanın oğlu | 4. derece kan hısımı | Bakabilir |

    | 4 | Kayınpeder | 1. derece sıhrî hısım | Bakamaz |


    **(b)** Yukarıdaki yakınlıktaki akrabaları olan serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemez. Yeğen
    kardeşin çocuğu olduğundan **3. derece** kan hısımıdır: işletmeyi **tasdik edemez**. Kuzen **4. derece** olduğundan işletmeyi
    **tasdik edebilir**.


    **(c)** Disiplin Yönetmeliği md. 6/c: yeminli mali müşavirlerce bu yakınlıktaki kişilerin veya firmaların işlerine bakılması
    ya da bu yakınlıktaki SMMM''lerin baktığı işlerin tasdik edilmesi **kınama** cezasını gerektirir.


    **(d)** Meslekten ayrılanlar mühürlerini, ayrılma veya yapılacak tebligat tarihinden itibaren **on gün** içinde Birliğe
    iade eder: 10/3/2026 + 10 gün = **20/3/2026**. Vefat hâlinde aynı yükümlülük yasal mirasçıları tarafından yerine getirilir;
    iade süresi tebligat tarihinden itibaren **bir aydır**: 10/3/2026 + 1 ay = **10/4/2026**.


