  soru: '**Olay:** Güneyova Yeminli Mali Müşavirler Odası, 2026 yılı için üye mali yükümlülüklerini belirlemektedir. Bu vakada
    memur maaşı taban aylığı katsayısı 10 TL olarak alınacaktır. Genel kurul maktu yıllık aidatı, yönetmeliğin izin verdiği
    üst sınır üzerinden belirlemiştir. 2026 yılında odaya aşağıdaki kişiler kaydolmuştur:


    | Üye | Durum |

    |---|---|

    | Aylin | Serbest çalışan yeminli mali müşavirdir. |

    | Barış | Kamu kurumunda çalışmaktadır. |

    | Cansu | Mesleği fiilen icra etmemektedir. |


    Ayrıca oda, 2026 yılında üyelere sağlanan bir tahkim işinden 60.000 TL ücret elde edilmesine aracılık etmiştir.


    **İstenenler:**


    (a) Odaya giriş (kayıt) ücretini ve genel kurulun belirleyebileceği maktu yıllık aidatın alt ve üst sınırını hesaplayınız.
    (6 puan)


    (b) Aylin, Barış ve Cansu''nun ilk yıl ödeyecekleri giriş ücreti ile yıllık aidat toplamlarını ayrı ayrı hesaplayınız.
    (7 puan)


    (c) Tahkim işinden odaya kalacak payı hesaplayınız. (3 puan)


    (d) Birliğin gelirlerinin neler olduğunu belirtiniz. (4 puan)

    '
  cozum: '**(a)** Kayıt ücreti = katsayı x 300 = 10 x 300 = **3.000 TL**. Maktu yıllık aidat katsayının en az 200, en fazla
    400 katı ile bulunur: alt sınır 2.000 TL, üst sınır **4.000 TL**.


    **(b)** Genel kurul üst sınırı (4.000 TL) belirlediğinden:


    | Üye | Giriş ücreti | Yıllık aidat | Toplam |

    |---|---|---|---|

    | Aylin | 3.000 | 4.000 | 7.000 |

    | Barış (kamu çalışanı, %50 indirim) | 1.500 | 2.000 | 3.500 |

    | Cansu (mesleği icra etmeyen, %50 indirim) | 1.500 | 2.000 | 3.500 |


    **(c)** Oda aracılığıyla sağlanan tahkim ve bilirkişilik ücretlerinin %4''ü odanın gelirdir: 60.000 x %4 = **2.400 TL**.


    **(d)** Birliğin gelirleri; birliğe dahil odaların gelirlerinden alınacak paylar, birliğe ait mal varlığından sağlanan
    gelirler, ruhsatname ücretleri ve genel hükümler çerçevesinde elde edilen bağış ve yardımlardır.


    Püf noktaları: (1) Yüzde elli indirim hem giriş ücretini hem aidatı kapsar. (2) Tahkim payı üyenin değil, ücretin yüzde
    dördüdür.

    '
