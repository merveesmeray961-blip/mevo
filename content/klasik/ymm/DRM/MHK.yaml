    | YMM (Aras) | %35 |

    | SMMM (Bora + Ceyda) | %65 |


    SMMM''lerin payı %65 olduğundan şirket **SMMM odasına** kaydedilir ve unvanında **serbest muhasebeci mali müşavir** unvanı
    kullanılır. Şirket **tasdik hizmeti veremez** ve **defter tutma işlerini yapamaz**; ortaklar da kendi bürolarında veya
    ortağı oldukları başka mesleki şirketler aracılığıyla şirketin müşterilerine defter tutma ve tasdik hizmeti veremez.


    **(b)** Ortaklar, şirketin tescilini takip eden **30 gün** içinde ortaklık durumlarını kayıtlı oldukları odaya bildirir.


    **(c)** Ortaklık bürosu ancak **aynı unvana sahip** meslek mensupları arasında kurulabilir; Dilek ve Emre ikisi de YMM
    olduğundan kurabilir. Bu büro veya şirketlerde meslek mensuplarının sürdürdükleri faaliyetler **ticari faaliyet sayılmaz**.


    **(d)** Varislere intikal eden hisselerin **en geç bir yıl** içinde tasfiye edilmesi gerekir. Bu süre içinde mirasçılar
    **meslek mensubu sayılmaz** ve **mesleki faaliyette bulunamaz**.


    Püf noktaları: (1) Odaya kayıt çoğunluk ile, unvan "yarıdan fazla" ile belirlenir; bu vakada ikisi aynı sonucu verir.
    (2) Karma şirkette tasdik hizmeti tamamen kapalıdır.

