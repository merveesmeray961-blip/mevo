  soru: '**Olay:** TÜRMOB Genel Kurulu 12 Eylül 2026 Cumartesi günü toplanacaktır. Birlik genel kurulunun temsilci tam sayısı
    180''dir. Toplantıya 150 temsilci katılmıştır. Toplantıda gündem dışı iki konu ileri sürülmüştür: birinci konu 80 temsilcinin
    imzasıyla, ikinci konu ise 28 temsilcinin imzasıyla teklif edilmiştir.


    **İstenenler:**


    (a) Toplantının ilanının en geç hangi tarihte ve nasıl yapılması gerektiğini belirtiniz. (5 puan)


    (b) Genel kurulun toplanabilmesi için gereken en az temsilci sayısını bulunuz. (3 puan)


    (c) Gündem dışı iki konunun gündeme alınıp alınmayacağını hesaplayarak belirtiniz. (8 puan)


    (d) Toplantıya katılan 150 temsilciyle bir kararın alınabilmesi için gereken en az oy sayısını ve olağanüstü toplantıyı
    kimlerin çağırabileceğini belirtiniz. (6 puan)

    '
  cozum: '**(a)** Toplantının yeri, günü, saati ve gündemi ile ikinci toplantıya ilişkin bilgiler ilk toplantı tarihinden
    **en az yirmi gün önce**, **tirajı yüzbinin üzerinde olan bir gazetede** ilan edilir ve toplantı tarihine kadar yayımda
    kalacak şekilde **Birlik resmî internet sitesinde** duyurulur. 12 Eylül 2026 - 20 gün = en geç **23 Ağustos 2026**.


    **(b)** Genel Kurul temsilcilerin tam sayısının salt çoğunluğu ile toplanır: 180 / 2 = 90, salt çoğunluk **91 temsilcidir**.
    150 temsilci bu sayıyı aştığından toplantı yapılabilir.


    **(c)** Birlik Genel Kurulu temsilcilerinin **beşte ikisinin** imzası ile teklif edilen konular gündeme ilave edilir:
    180 x 2 / 5 = **72**. Birinci konu 80 imza ile 72''yi aştığından **gündeme alınır**. Toplantıda hazır bulunan temsilcilerin
    **beşte birinin** imzası ile yeni madde ilavesi teklif edilebilir: 150 / 5 = **30**. İkinci konu 28 imza ile 30''un altında
    kaldığından **teklif edilemez**.


    **(d)** Kararlar hazır bulunanların salt çoğunluğu ile verilir: 150 / 2 = 75, bu nedenle en az **76 oy**. Olağanüstü toplantıya
    Birlik Yönetim Kurulu Başkanı, Yönetim veya Denetleme Kurulunun gerekli gördüğü hâllerde çağırabilir; ayrıca mevcut temsilcilerin
    beşte birinin yazılı talebi ile çağrılması mecburidir.


    Püf noktaları: (1) Beşte ikilik oran tam sayı üzerinden, beşte birlik oran hazır bulunanlar üzerinden hesaplanır. (2)
    İlanda gazete tirajı şartı Birlik genel kurulu için aranır.

    '
