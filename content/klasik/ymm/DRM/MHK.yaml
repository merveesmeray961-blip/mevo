- id: YMM-DRM-MHK-K002
  sinav: ymm
  ders: DRM
  konu: MHK
  kazanimlar:
  - 3568 sayılı Kanun YMM şartları ve yasaklar
  - YMM odaları ve TÜRMOB
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Yeminli mali müşavir Kerem Aydın, Kuzeyova YMM Odasına kayıtlıdır. 2026 yılında aşağıdaki faaliyetlerde
    bulunmaktadır:


    1. Bir limited şirkete bağlı olarak, hizmet akdiyle ücretli çalışmakta ve bu çalışmayı Kanun''un 2. maddesinde yazılı
    işlerin yürütülmesi amacıyla yapmaktadır.

    2. Kendi adına bir kırtasiye mağazası işletmektedir.

    3. Bir müşterisinin yevmiye defterini bizzat tutmaktadır.

    4. Bürosunda, meslekten çıkarma cezası kesinleşmiş ve mesleği yapması yasaklanmış eski bir meslek mensubunu mesleki işlerle
    ilgili olarak çalıştırmaktadır.


    Yeminli mali müşavirler odalarının Birlik (TÜRMOB) Genel Kurulunda temsili ile Birlik organlarına ilişkin bilgiler şunlardır:


    | Oda | Kayıtlı üye sayısı |

    |---|---|

    | Doğuyaka YMM Odası | 1.190 |

    | Kuzeyova YMM Odası | 520 |

    | Batıyaka YMM Odası | 330 |


    Birlik Yönetim Kurulu seçimleri üç yılda bir yapılmaktadır. Meslektaşı Vedat Sarı, 2019 ve 2022 seçimlerinde üst üste
    iki kez Birlik Yönetim Kurulu başkanlığına seçilmiş; 2025 seçiminde aday olmamış, 2028 ve 2031 seçimlerinde Yönetim Kurulu
    üyeliği için aday olmayı düşünmektedir. Nuray Ak ise 4 yıldır yeminli mali müşavir olarak fiilen mesleki faaliyette bulunmakta,
    kayıtlı olduğu odada 4 yıldır üye olup Birlik Genel Kurulu üyesidir. Birlik Yönetim Kurulu seçimlerine ilişkin diğer şartların
    sağlandığı varsayılacaktır.


    Ayrıca Gökçeli ili merkezinde faaliyet gösteren yeminli mali müşavir sayısı 230''dur ve bu yerde YMM odası kurulmamıştır.
    Ayazlı ilçesinde (büyükşehir belediyesi sınırları dışında) 250 yeminli mali müşavir bulunmakta olup bunların 120''si oda
    kurulması için yazılı başvuruda bulunmuştur. Büyükşehir belediyesi sınırları içindeki Denizlik ilçesinde ise 400 yeminli
    mali müşavir bulunmaktadır.


    **İstenenler:**


    (a) Kerem Aydın''ın 1–4 numaralı faaliyetlerinin her birinin Kanun''a göre yasak kapsamında olup olmadığını, madde dayanağıyla
    belirtiniz. (8 puan)


    (b) Yukarıdaki üç odanın Birlik Genel Kuruluna seçeceği asıl temsilci sayısını (yedek temsilciler hariç) odalar itibarıyla
    ve toplam olarak hesaplayınız; uyguladığınız kuralı belirtiniz. (6 puan)


    (c) Birlik Yönetim Kurulunun bileşimini (üye sayısı, yeminli mali müşavir şartı) açıklayınız; Vedat Sarı''nın aday olması
    halinde 2028 ve 2031 seçimlerinde Yönetim Kurulu üyeliğine, Nuray Ak''ın ise Yönetim Kurulu üyeliğine ve Yönetim Kurulu
    başkanlığına seçilebilip seçilemeyeceğini gerekçesiyle değerlendiriniz. (6 puan)


    (d) Gökçeli ili merkezi, Ayazlı ilçesi ve Denizlik ilçesinde YMM odası kurulup kurulamayacağını değerlendiriniz; odanın
    tüzelkişilik kazanma usulünü belirtiniz. (5 puan)

    '
  cozum: '**(a) Yasaklar (8 puan)**


    | Faaliyet | Yasak mı? | Dayanak |

    |---|---|---|

    | 1. Hizmet akdiyle bağımlı çalışma | Evet | Kanun md. 45/1: Yeminli mali müşavirler bu unvan ve tasdik yetkisiyle, 2.
    maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi
    ile çalışamazlar. |

    | 2. Kırtasiye mağazası işletmek | Evet | Kanun md. 45/1: Ticari faaliyette bulunamazlar. |

    | 3. Müşterinin yevmiye defterini tutmak | Evet | Kanun md. 2/B son fıkra: Yeminli mali müşavirler muhasebe ile ilgili
    defter tutamaz, muhasebe bürosu açamaz ve muhasebe bürolarına ortak olamaz. |

    | 4. Mesleği yasaklanmış kişiyi çalıştırmak | Evet | Kanun md. 13: Meslek mensupları, mesleği yapmaları yasaklananları
    çalıştıramayacakları gibi, bunlarla meslekleri ile ilgili işbirliği de yapamazlar. |


    **(b) Birlik Genel Kurulu temsilcileri (6 puan)**


    Kanun md. 32''ye göre her oda, üye sayısına bağlı olmaksızın seçeceği 3 temsilciye ilave olarak üyelerinin yetmişbeşte
    biri oranında temsilci seçer; bu oranın yarısından az olan kesirler nazara alınmaz, fazla olanlar tüme tamamlanır.


    | Oda | Üye / 75 | Kesir | Ek temsilci | Toplam asıl temsilci |

    |---|---|---|---|---|

    | Doğuyaka | 1.190 / 75 = 15 tam, kalan 65 | 65/75 = 0,87 > 0,5, tüme tamamlanır | 16 | 3 + 16 = 19 |

    | Kuzeyova | 520 / 75 = 6 tam, kalan 70 | 70/75 = 0,93 > 0,5, tüme tamamlanır | 7 | 3 + 7 = 10 |

    | Batıyaka | 330 / 75 = 4 tam, kalan 30 | 30/75 = 0,40 < 0,5, nazara alınmaz | 4 | 3 + 4 = 7 |


    **Toplam asıl temsilci: 36.**


    **(c) Birlik Yönetim Kurulu (6 puan)**


    - Kanun md. 35: Birlik Yönetim Kurulu, üç yıl için seçilen 9 asıl ve 9 yedek üyeden oluşur; üyelerden **5**''inin yeminli
    mali müşavir olması zorunludur. Üyeler kayıtlı olduğu meslek odasında en az üç yıl kıdemli, fiilen mesleki faaliyette
    bulunan Birlik Genel Kurulu üyeleri arasından seçilir.

    - Yönetim Kurulu Başkanı en az beş yıl süreyle yeminli mali müşavirlik yapmış olanlar arasından seçilir. Nuray Ak 4 yıllık
    YMM olduğundan üyeliğe seçilebilir (üç yıl kıdem şartı sağlanır) ancak **başkanlığa seçilemez** (5 yıl şartı sağlanmaz).

    - Üst üste iki seçim döneminde iki defa Birlik Yönetim Kurulu başkanlığına seçilenler, aradan iki seçim dönemi geçmedikçe
    Yönetim Kurulu üyeliğine seçilemez. Vedat Sarı 2019 ve 2022''de başkan seçilmiştir. **2028** seçiminde aradan yalnızca
    bir seçim dönemi (2025–2028) geçtiğinden **seçilemez**; **2031** seçiminde iki seçim dönemi (2025–2028 ve 2028–2031) geçmiş
    olacağından **seçilebilir**.


    **(d) Oda kuruluşu (5 puan)**


    Kanun md. 15: Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve 250 meslek mensubu
    bulunan ilçelerde (büyükşehir belediyesi sınırları içindeki ilçeler hariç) oda kurulur; ilçelerde oda kurulabilmesi için
    o ilçedeki en az 100 meslek mensubunun yazılı başvurusu da aranır.


    - Gökçeli ili merkezi: 230 < 250 olduğundan oda **kurulamaz**; yeterli sayıda meslek mensubu bulunmayan ve oda kurulamayan
    yerlerin en yakın odaya bağlanmasına veya bölge odaları kurulmasına Birlikçe karar verilir.

    - Ayazlı ilçesi: 250 meslek mensubu vardır, büyükşehir sınırları dışındadır ve 120 ≥ 100 kişi yazılı başvuruda bulunmuştur;
    oda **kurulabilir**.

    - Denizlik ilçesi: büyükşehir belediyesi sınırları içindeki ilçeler kapsam dışı olduğundan 400 meslek mensubu olsa da
    ilçede oda **kurulamaz**.

    - Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar.


    (Püf noktaları: Temsilci hesabında kesirler yarıya göre yuvarlanır; Başkanlık için 5 yıl, üyelik için 3 yıl kıdem aranır;
    ilçe odası için hem 250 kişi hem 100 kişilik başvuru aranır ve büyükşehir ilçeleri hariç tutulur.)

    '
  puanlama:
  - olcut: (a) 1. ve 2. faaliyetlerin md. 45/1 uyarınca (hizmet akdiyle çalışma ve ticari faaliyet) yasak olduğunun belirtilmesi
