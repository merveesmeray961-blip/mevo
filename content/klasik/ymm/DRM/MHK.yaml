    \ yönetim ve denetleme kurulu başkan ve üyeleri hakkında **görevleri ile ilgili** yapılacak şikâyetler:\n\n1. Şikâyet\
    \ dilekçesinin Oda Genel Kuruluna sunulmasının gerekip gerekmediği yönünden **Birlik Yönetim Kurulunca incelenir.**\n\
    2. Birlik Yönetim Kurulunun, şikâyet dilekçesinin **Oda Genel Kuruluna sunulmasının gerektiği yönündeki kararı** üzerine\
    \ dilekçe Genel Kurula sunulur. Birlik Yönetim Kurulunun **aksi yöndeki kararları kesindir.**\n3. **Oda Genel Kurulu**\
    \ disiplin soruşturmasına karar verir (Kanun md. 19/g; Yön. md. 22/c).\n4. Genel Kurulun disiplin soruşturması kararı\
    \ halinde **Oda Disiplin Kurulu**, Kanun ve Yönetmelik hükümlerine göre gerekli inceleme ve araştırmaları yaparak **kararını\
    \ verir.**\n\n**(b) Başvuruların akıbeti (6 puan)**\n\n- **1 numaralı başvuru:** İhbar veya şikâyette bulunanın kimliği,\
    \ adresi ve imzası bulunmayan ihbar ve şikâyetler **işleme konulmaz** (Yön. md. 17).\n- **2 numaralı başvuru:** Yönetim\
    \ kurulu başkan ve üyelerinin **yönetsel tercihlerinin ve yönetim politikalarının eleştirisi niteliğinde** olan şikâyet\
    \ dilekçeleri **işleme konulmaz** (Yön. md. 16/4).\n- **3 numaralı başvuru:** Birlik ve Oda disiplin kurulu başkan ve\
    \ üyeleri, **verdikleri kararlar dolayısıyla** disiplin soruşturmasına **tabi tutulamazlar** (Yön. md. 16/3); başvuru\
    \ sonuçsuz kalır.\n\n**(c) Oda Disiplin Kurulu ve karar nisabı (6 puan)**\n\n- Kanun md. 25/1: Oda Disiplin Kurulu, üye\
    \ sayısı 50'ye kadar olan odalarda üç, **50'den fazla olan odalarda beş** üyeden oluşur; **5 üyeli kurul için 3 yedek**\
    \ üye seçilir. Ankara Odası 180 üyeli olduğundan **5 asıl + 3 yedek** üye vardır.\n- md. 25/2: Üyeler kayıtlı oldukları\
    \ odada **en az üç yıl kıdemli** (üye sayısı yüzden az olan odalarda bu süre aranmaz; 180 üyeli odada aranır), fiilen\
    \ mesleki faaliyette bulunan meslek mensupları arasından **üç yıl için** seçilir; süresi dolan üye yeniden seçilebilir.\n\
    - md. 25/4: Kurul **en az üç kişinin hazır bulunmasıyla toplanır; kararlar üye tam sayısının salt çoğunluğu ile verilir.**\
    \ Tam sayı 5 olduğundan karar için **en az 3 oy** gerekir (5 / 2 + 1 = 3).\n  - 3 üye hazır, **2 oy**: toplantı nisabı\
    \ vardır ancak karar için gerekli 3 oy sağlanmadığından (**1 oy eksik**) **karar alınamaz.**\n  - 5 üye hazır, **3 oy**:\
    \ gerekli çoğunluk sağlandığından (**0 oy fazla**, tam 3 oy) **karar alınır.**\n\n**(d) Birlik Yönetim Kurulu üyesi ve\
    \ ceza (6 puan)**\n\n- Yön. md. 16/2: Birlik yönetim ve denetleme kurullarının başkan ve üyeleri hakkında görevleri nedeniyle\
    \ yapılacak soruşturma, **Birlik Genel Kurulunun kararı üzerine Birlik Disiplin Kurulunca** yürütülerek karara bağlanır\
    \ (Yön. md. 22/c).\n- Yön. md. 6/o: Oda ve birlik kurulları başkan ve üyelerinin görevleri dolayısıyla **kanun ve yönetmeliklere\
    \ aykırı davrandıklarının tespit edilmesi** **kınama** cezasını gerektirir. Orhan Kaya'ya ilk defa ve takdir hakkı kullanılmadan\
    \ **kınama** cezası verilir.\n"
