    | Cem | Yetki sonrası kamu hizmeti süresi serbest muhasebeci mali müşavirlikte geçmiş sayılır: 6 + 2 = 8 yıl < 10 | Süreyi
    tamamlamadığından ruhsat alamaz |


    Vergi inceleme yetkisi ve yeterlilik sınavı olanların da ruhsat alabilmeleri için 10 yıllık süreyi tamamlamaları şarttır
    (md. 9 son fıkra).


    **(c)** Kasten işlenen suçtan 1 yıl veya daha fazla hapis cezası alanlar ile sayılan suçlardan (sahtecilik dahil) mahkûm
    olanlar, TCK md. 53''teki süreler geçmiş olsa bile meslek mensubu olamaz. Pınar: 8 ay, sayılan suçlardan değil, 1 yıldan
    az: **engel yok**. Rıza: kasten, 1 yıl 3 ay (1 yıldan fazla): **engel var**. Selma: sayılan suçlardan biri olan sahtecilik:
    **engel var** (ceza süresi önemsizdir).


    **(d)** Yeminli mali müşavirliğe kabul edilenler, görevlerine fiilen başlamadan önce **Asliye Ticaret Mahkemesinde** kanundaki
    yeminle yemin ederler (md. 11).


    Püf noktaları: (1) Kamu hizmeti süresi, vergi inceleme yetkisinin alındığı tarihten itibaren sayılır. (2) Listedeki suçlarda
    ceza süresi aranmaz.

    '
