    Odanın yönetim kurulu başkanı, 2026 yılı içinde yurt dışında yapılacak uluslararası bir muhasebe kongresine odayı temsilen
    katılmak istemektedir. Bakanlığın bir oda organı hakkındaki onay kararını oda yönetim kurulu yerine getirmemiş ve önceki
    karardaki gibi yeniden karar vermiştir.


    **İstenenler:**


    (a) Bakanlığın oda ve birlik organları üzerindeki denetim yetkisinin kapsamını belirtiniz. (4 puan)


    (b) Odanın 2025 yılı sonu itibarıyla mevcut üyelerine ilişkin bilgileri hangi tarihe kadar bildirmesi, 2025 yılı faaliyet
    raporu ile mali tablolarını hangi tarihe kadar ve ne kadar süreyle internet sitesinde yayımlaması gerektiğini yazınız.
    (8 puan)


    (c) Başkanın kongreye katılabilmesi için gereken işlemi belirtiniz. (4 puan)


    (d) Oda yönetim kurulunun bakanlık kararına ilişkin davranışının sonucunu açıklayınız. (5 puan)

    '
  cozum: '**(a)** Maliye Bakanlığı, oda ve birlik organlarının görevlerini **kanun hükümlerine uygun olarak yapıp yapmadıklarını**
    ve **mali işlemlerini**, hazırlayacağı yönetmelikte belirlenecek esaslara göre denetlemeye yetkilidir (md. 41/1).


    **(b)** Odalar her yıl sonu itibarıyla mevcut üyelerine ilişkin, Maliye Bakanlığınca talep edilecek bilgileri **Ocak ayı
    sonuna kadar** bildirmekle yükümlüdür: 2025 sonu bilgileri için **31 Ocak 2026**. Odalar ve Birlik her yılın faaliyet
    raporlarını ve mali tablolarını **izleyen yılın Ocak ayı sonuna kadar** internet sitelerinde **yıl sonuna kadar kalmak
    üzere** yayımlar: 2025 raporu ve tabloları en geç **31 Ocak 2026**''da yayımlanır ve **31 Aralık 2026**''ya kadar yayında
    kalır.


    **(c)** Odaları veya birliği temsil etmek üzere milletlerarası toplantı ve kongrelere katılmak **Maliye Bakanlığının iznine
    tabidir**; başkan izin almadan odayı temsilen katılamaz.


    **(d)** Bakanlığın onay mercii olarak verdiği kararları oda organları aynen yerine getirmekle yükümlüdür. Kararı yerine
    getirmeyen veya eski kararda direnme niteliğinde yeni karar veren oda organları hakkında, amaç dışı faaliyet gösteren
    organlara uygulanan hükümler uygulanır: Maliye Bakanlığı veya Cumhuriyet Başsavcılığının istemi üzerine **asliye hukuk
    mahkemesince** basit usulle yargılama yapılarak organların **görevine son verilebilir**.


    Püf noktaları: (1) Yayım süresi "Ocak sonuna kadar yayımlama" ile "yıl sonuna kadar yayında kalma" olarak iki ayrı süredir.
