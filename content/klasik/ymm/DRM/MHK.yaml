- id: YMM-DRM-MHK-K001
  sinav: ymm
  ders: DRM
  konu: MHK
  kazanimlar:
  - 3568 sayılı Kanun YMM şartları ve yasaklar
  - disiplin cezaları
  - YMM odaları ve TÜRMOB
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** YMM Nazlı Hanım, (T) Ltd. Şti.''nin 2025 yılı Ocak, Şubat ve Mart dönemlerine ilişkin toplam 1.200.000
    TL tutarındaki KDV iade talebine dayanak tasdik raporunu düzenlemiştir. Raporda tasdikin kapsamı bu üç dönemle sınırlı
    olarak açıkça belirtilmiştir.


    Hazine ve Maliye Bakanlığınca yapılan incelemede şu hususlar tespit edilmiştir:


    | Tespit | Dönem | Ziyaa uğratılan vergi (TL) | Kesilen vergi ziyaı cezası (TL) |

    |---|---|---|---|

    | Sahte belgeye dayanan haksız iade | Ocak–Mart 2025 (tasdik kapsamında) | 300.000 | 300.000 |

    | Haksız indirim | Nisan 2025 (Nazlı Hanım tasdik etmemiştir) | 80.000 | 80.000 |


    Bakanlık, Nazlı Hanım''ın tasdik yetkisini gerçeğe aykırı kullandığını ilk kez tespit ederek rapora bağlamıştır. Nazlı
    Hanım hakkında daha önce bu nitelikte bir tespit yoktur. Gecikme faizi dikkate alınmayacaktır.


    **İstenenler:**


    (a) Nazlı Hanım''ın mükellefle birlikte sorumlu tutulacağı tutarı hesaplayınız; sorumluluğun niteliğini ve sınırını 3568
    sayılı Kanun''a dayanarak açıklayınız. (7 puan)


    (b) Nazlı Hanım hakkında sorumluluk raporu yazılmadan önce izlenmesi gereken savunma usulünü ve süresinde savunma yapılmamasının
    sonucunu açıklayınız. (4 puan)


    (c) Nazlı Hanım''a bu tespit nedeniyle verilecek disiplin cezasını ve bu cezanın içeriğini belirtiniz. Aynı durumun ileride
    tekerrür edip mahkeme kararıyla kesinleşmesi ile mükellefle birlikte kasten vergi ziyaına sebebiyet verdiğinin mahkeme
    kararıyla kesinleşmesi hallerinde uygulanacak cezaları belirtiniz. (8 puan)


    (d) Oda disiplin kurulunun kararına karşı başvuru yolunu ve süresini, kararın kesinleşmesini ve ceza kesinleştikten sonra
    Nazlı Hanım''ın elindeki işler bakımından yükümlülüğünü açıklayınız. (6 puan)

    '
  cozum: '**(a) Müteselsil sorumluluk (7 puan)**


    3568 sayılı Kanun md. 12/4''e göre YMM''ler yaptıkları tasdikin doğruluğundan sorumludur. Tasdik doğru değilse, **tasdikin
    kapsamı ile sınırlı olmak üzere**, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte **müştereken
    ve müteselsilen** sorumlu olurlar. YMM tasdikin kapsamını raporunda açıkça belirtir.


    | Kalem | Tasdik kapsamında mı? | Sorumluluk (TL) |

    |---|---|---|

    | Ocak–Mart 2025 ziyaa uğratılan vergi | Evet | 300.000 |

    | Ocak–Mart 2025 vergi ziyaı cezası | Evet | 300.000 |

    | Nisan 2025 vergi + ceza (160.000) | Hayır (rapor kapsamı dışında) | 0 |

    | **Toplam** | | **600.000** |


    Vergi idaresi 600.000 TL''nin tamamını mükelleften ya da Nazlı Hanım''dan isteyebilir (müteselsil sorumluluk). Nisan dönemi
    tasdik kapsamı dışında olduğundan bu döneme ilişkin 160.000 TL''den sorumlu değildir. Mükellefin iadesinin toplam tutarı
    (1.200.000 TL) değil, yalnız gerçeğe aykırı tasdikten doğan ziya ve ceza esas alınır.


    **(b) Savunma usulü (4 puan)**


    md. 12/5''e (6552 s. Kanun ile eklenen fıkra) göre YMM''lerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları
    ayrı ayrı, müstakil bir raporla tespit edilir. Sorumluluk raporu yazılabilmesi için YMM''nin **yazılı savunması istenir**.
    Savunma isteme yazısının tebliğinden itibaren **otuz gün** içinde savunma yapılmazsa YMM **savunma hakkından vazgeçmiş
    sayılır**.


    **(c) Disiplin cezası (8 puan)**


    - Tasdik yetkisini gerçeğe aykırı kullandığı Bakanlıkça **ilk defa** tespit edilip rapora bağlanan YMM''ye **geçici olarak
    mesleki faaliyetten alıkoyma** cezası verilir (md. 48).

    - İçeriği: mesleki sıfatı saklı kalmak şartıyla **altı aydan az, bir yıldan çok olmamak üzere** mesleki faaliyetten alıkoymadır
    (md. 48/c).

    - Disiplin kurulu bir derece ağır veya bir derece hafif ceza verebilir (md. 48; Disiplin Yön. md. 11).

    - Bu durum **tekerrür eder ve mahkeme kararıyla kesinleşirse** → **yeminli sıfatını kaldırma** (md. 48). Yeminli sıfat
    kaldırılır ve mühür geri alınır (Disiplin Yön. md. 4/d, md. 8).

    - Mükellefle birlikte **kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşirse** → **meslekten çıkarma**
    (md. 48; Disiplin Yön. md. 9/c). Ruhsatname geri alınır, meslek bir daha icra edilemez.


    (Not: Disiplin kovuşturması ceza kovuşturmasından bağımsızdır. md. 48''e göre takibat ve hüküm tesisi disiplin soruşturmasına
    engel değildir. md. 12/4''e aykırılık ayrıca md. 49 uyarınca altı aydan bir yıla kadar hapis ve adli para cezasını gerektirebilir.)


    **(d) İtiraz, kesinleşme ve işlerin tasfiyesi (6 puan)**


    - Oda disiplin kurulu kararına karşı **tebliğ (bildirim) tarihinden itibaren 30 gün içinde**, ilgili oda aracılığıyla
    veya doğrudan **Birlik Disiplin Kuruluna** itiraz edilebilir (Kanun md. 25; Disiplin Yön. md. 28).

    - Süresinde itiraz edilmeyen kararlar itiraz süresinin geçmesiyle kendiliğinden kesinleşir. Birlik Disiplin Kurulunun
    **itirazın reddine** ilişkin kararları **Hazine ve Maliye Bakanlığının onayı (tasdiki)** ile kesinleşir (Kanun md. 38;
    Yön. md. 29). Bu kararlara karşı idari yargı yolu açıktır.

    - Alıkoyma cezası Bakanlık ve ilgili kurumlara duyurulur ve **Resmî Gazete''de ilan edilir**. Ceza kesinleştikten sonra
    Nazlı Hanım **yeni iş kabul edemez ve mühür kullanamaz**. Elindeki işleri **kesinleşme tarihinden itibaren 60 gün içinde**
    bağlı olduğu odaya teslim eder; oda işleri iş sahiplerine ya da onların isteği üzerine görevlendireceği meslek mensubuna
    verir (Disiplin Yön. md. 12).

    '
  puanlama:
  - olcut: (a) Sorumluluğun tasdik kapsamıyla sınırlı müşterek ve müteselsil sorumluluk olduğunun md. 12/4'e dayanarak açıklanması
    puan: 3
  - olcut: (a) Sorumlu tutarın 600.000 TL olarak hesaplanması ve Nisan dönemi (160.000 TL) ile iade toplamının dışlanması
    puan: 4
  - olcut: (b) Müstakil rapor, yazılı savunma istenmesi, 30 günlük süre ve sürede savunma yapılmazsa savunma hakkından vazgeçilmiş
      sayılması
    puan: 4
  - olcut: (c) İlk tespit için geçici olarak mesleki faaliyetten alıkoyma ve süresinin (6 ay–1 yıl, mesleki sıfat saklı) belirtilmesi
    puan: 4
  - olcut: (c) Tekerrür + mahkeme kararıyla kesinleşme halinde yeminli sıfatını kaldırma; kasten vergi ziyaında meslekten
      çıkarma
    puan: 4
  - olcut: (d) 30 gün içinde Birlik Disiplin Kuruluna itiraz; itiraz edilmezse kesinleşme; red kararlarının Bakanlık onayıyla
      kesinleşmesi ve idari yargı yolu
    puan: 3
  - olcut: (d) Resmî Gazete ilanı, iş kabul etme/mühür kullanma yasağı ve işlerin 60 gün içinde odaya teslimi
    puan: 3
  kaynaklar:
