    **(b)** Başvurulan oda yönetim kurulu, nakil talebinin odaya varış tarihinden itibaren **1 ay** içinde karar vermezse
    nakil talebi **kabul edilmiş sayılır**: 2/3/2026 + 1 ay = **2/4/2026**''de talep kabul edilmiş sayılır.


    **(c)** Kayıt günü Birliğe ve önceden kayıtlı olduğu odaya bildirilir. Eski oda, bu bildiri üzerine meslek mensubunun
    adını kayıtlardan siler ve dosyasını naklettiği odaya gönderir. Varsa devam eden **disiplin soruşturması eski odaca sürdürülür**;
    sonuçlar ayrıca nakil gittiği odaya bildirilir.


    **(d)** Meslek mensubu, ret kararının kendisine tebliğinden itibaren **onbeş gün** içinde **Birliğe itiraz** edebilir:
    18/3/2026 + 15 gün = en geç **2/4/2026**. Birlik itirazı **onbeş gün** içinde karara bağlar; Birliğin kararı **nihaidir**.


    Püf noktaları: (1) Sessiz kalma kabul anlamına gelir. (2) Nakilde devam eden disiplin soruşturması eski odada kalır.

    '
