    (3 puan)

    '
  cozum: '**(a)** Sözleşme zorunlu olanlar: defter tutmak; süreklilik arz eden müşavirlik hizmeti; inceleme, tahlil ve denetim
    yapmak ve bunlarla ilgili rapor düzenlemek; yeminli mali müşavirlerin tasdik işlemleri.


    | İş | Sözleşme zorunlu mu? |

    |---|---|

    | Aylık defter tutma | Evet |

    | Bir defalık yazılı görüş | Hayır (isteğe bağlı) |

    | Sürekli müşavirlik | Evet |

    | İnceleme ve denetim raporu | Evet |

