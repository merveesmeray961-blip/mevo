    başka meslek mensubunun nakil talebini reddetmiş ve ret kararı ilgiliye 18/3/2026''da tebliğ edilmiştir. Hakan Bey hakkında
    eski odasında devam eden bir disiplin soruşturması bulunmaktadır.


