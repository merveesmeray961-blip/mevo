    Hanım''ın üstlenebileceği işler ve ilişkinin seyri şöyledir: (M) A.Ş.''nin aylık defterlerinin tutulması; bir defalık
    bir konuda yazılı görüş verilmesi; sürekli müşavirlik hizmeti; bir inceleme ve denetim raporu düzenlenmesi; yıllık tasdik.
    İlişki sonlandırılırken sözleşme 10/3/2026''da fesih edilmiş, defter ve belgelerin devir teslim tutanağıyla verilmesi
