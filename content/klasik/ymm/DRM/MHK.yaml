    dolayısıyla kanun ve yönetmeliklere aykırı davrandığı tespit edilmiştir. Orhan Kaya hakkında daha önce kesinleşmiş bir
    disiplin cezası yoktur ve disiplin kurulu takdir hakkını kullanmayacaktır. Ayrıca Türkiye Serbest Muhasebeci Mali Müşavirler
    ve Yeminli Mali Müşavirler Odaları Birliği (Birlik) Yönetim Kurulu üyesi Murat Aydın hakkında da görevi nedeniyle şikâyet
    yapılmıştır.


    **İstenenler:**


    (a) Taner''in şikâyeti üzerine Orhan Kaya ve Pınar Çelik hakkında disiplin soruşturması bakımından izlenecek yolu (şikâyeti
    ilk inceleyecek organı, sonraki aşamaları ve disiplin kararını verecek organı) açıklayınız. (7 puan)


