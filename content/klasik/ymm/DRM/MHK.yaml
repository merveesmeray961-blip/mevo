    seçer.


    **(b)** Adaylar; hukuk, iktisat, maliye, işletme, muhasebe, bankacılık veya idarî bilimler dallarının birinden lisans/lisansüstü
    mezunu olmalı ve bu konularda en az on beş yıl çalışmış (veya öğretim üyeliği/görevliliği yapmış) olmalıdır.


    | Aday | Sonuç | Gerekçe |

    |---|---|---|

    | A | Gösterilebilir | Maliye mezunu, 16 yıl >= 15 yıl |

    | B | Gösterilemez | Hukuk mezunu fakat 14 yıl < 15 yıl |

    | C | Gösterilemez | Mühendislik, sayılan dallar dışında; süre yeterli olsa da mezuniyet şartı yok |


    **(c)** Sınav sonuçlarının yargı mercilerine intikal etmesi ve bilirkişi incelemesine gerek görülmesi hâlinde, sınav komisyonunda
    görev almamış olmaları kaydıyla **üç kişilik** heyet: biri **Maliye Bakanlığı merkezi vergi denetim elemanı**, biri **alanında
    uzman meslek mensubu**, biri **dava edilen sınav konusunda ihtisas sahibi öğretim üyesi**.


    **(d)** Sınav komisyonunun çalışma usulleri, sınav konuları ve sınava ilişkin diğer usul ve esaslar **Birlikçe çıkarılacak
    yönetmelikle** belirlenir. Maliye Bakanlığı da sınavın adil, tarafsız ve mevzuata uygun yapılması için gerekli tedbirleri
    almaya yetkilidir.


    Püf noktaları: (1) Komisyon üyelerinin çoğunluğu Maliye Bakanlığından gelir. (2) Bilirkişi heyetinde sınav komisyonunda
