    bürosu kurmak istemektedir. Ortaklardan Dilek 2026 yılında vefat etmiş ve mirasçısı Fuat şirket hissesini devralmıştır.


    **İstenenler:**


    (a) Aras, Bora ve Ceyda''nın kuracağı şirketin hangi odaya kaydedileceğini, unvanında hangi meslek grubunun unvanının
    kullanılacağını ve şirketin tasdik ve defter tutma hizmeti verip veremeyeceğini gerekçeleriyle belirtiniz. (9 puan)


    (b) Ortakların şirket tescilinden sonra yapmaları gereken bildirimi ve süresini yazınız. (3 puan)


    (c) Ortaklık bürosunun kimler arasında kurulabileceğini ve Dilek ile Emre''nin ortaklık bürosunda yapılacak işlerin ticari
    faaliyet sayılıp sayılmayacağını belirtiniz. (5 puan)


    (d) Fuat''ın hisseyi ne kadar sürede tasfiye etmesi gerektiğini ve bu sürede mesleki durumunu açıklayınız. (6 puan)

    '
  cozum: '**(a)** Yeminli mali müşavirler ve serbest muhasebeci mali müşavirlerin birlikte kurduğu şirketlerde tasdik hizmeti
    verilemez ve 3568 sayılı Kanun md. 2/A-(a)''da yazılı işler (defter tutma gibi) yapılamaz. Bu şirketler, ortaklık hisselerinin
    **çoğunluğuna sahip meslek grubunun odasına** kaydedilir; unvanda ise **ortaklık hisselerinin yarısından fazlasına** sahip
    meslek grubunun unvanı kullanılır.


    | Meslek grubu | Pay |

