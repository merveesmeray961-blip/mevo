    | 1 | YMM Işık, mesleki faaliyette bulunmayacağını odaya yazılı olarak bildirmiştir. |

    | 2 | YMM Jale, çalışma bürosunu oda bölgesi dışına nakletmiştir. |

    | 3 | Mesleki bir şirketin tasfiyesine 1/3/2022''de karar verilmiş, tasfiye işlemleri 1/3/2026 itibarıyla tamamlanmamıştır.
    |

    | 4 | YMM Kaan hakkında meslekten çıkarma cezası kesinleşmiştir. |


    Odanın yönetim kurulu, Işık hakkında 10/6/2026''da çalışanlar listesinden silme kararı almış ve karar aynı gün tebliğ
    edilmiştir.


    **İstenenler:**


    (a) Her olayda çalışanlar listesinden silmeyi gerektirip gerektirmediğini belirtiniz. (8 puan)


    (b) Işık''ın karara karşı başvuru yolunu, son başvuru tarihini ve Birliğin karar süresini belirtiniz. (6 puan)


    (c) Silme kararı kesinleşinceye kadar meslek mensubunun mesleki faaliyete devam edip edemeyeceğini; kamu yararı gerektirdiğinde
    hangi organın hangi yaptırımı uygulayabileceğini açıklayınız. (4 puan)


    (d) Silinmeyi gerektiren hâlin sona ermesi durumunda meslek mensubunun listeye nasıl yeniden yazılacağını belirtiniz.
    (4 puan)

    '
  cozum: '**(a)**


    | No | Silme gerekir mi? | Dayanak |

    |---|---|---|

    | 1 | Evet | Faaliyette bulunmayacağını yazılı bildirme (md. 35/a) |

    | 2 | Evet | Çalışma bürosunu oda bölgesi dışına nakletme (md. 35/b) |

    | 3 | Evet (şirketler bölümünden) | Tasfiyesine karar verilen şirketin tasfiyesinin üç yılda tamamlanmaması: 1/3/2022
    - 1/3/2025 (md. 35 ek fıkra) |

    | 4 | Evet | Kanuna göre meslekten çıkarmayı gerektiren cezalara çarptırılma (md. 35/c) |


    **(b)** Silme kararı gerekçeli olmak zorundadır. Işık, kararın tebliği tarihinden itibaren **on beş gün** içinde **Birliğe**
    itiraz edebilir: 10/6/2026 + 15 gün = **25/6/2026**. Birlik itirazı **on beş gün** içinde **nihai** olarak karara bağlar.


    **(c)** Meslek mensubu silme kararı **kesinleşinceye kadar mesleğini yapma hakkına** sahiptir; karar kesinleştikten sonra
    mesleki faaliyette bulunamaz. Ancak oda **disiplin kurulu**, kamu yararı bakımından gerekli gördüğü hâllerde, yönetim
    kurulunun silme kararı üzerine meslek mensubunun **geçici olarak mesleki faaliyette bulunmasını yasaklayabilir**.


    **(d)** Silinmeyi gerektiren hâllerin sona erdiğini ispat eden meslek mensubu, ilgili belgelerle başvurursa oda yönetim
    kurulu kararıyla **listeye yeniden yazılır**; karar başvuru sahibine yazılı olarak tebliğ edilir.


