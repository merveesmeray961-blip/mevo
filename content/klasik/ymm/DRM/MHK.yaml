  soru: '**Olay:** Çınarlı Yeminli Mali Müşavirler Odası''nın 2026 yılı bütçesi 6.000.000 TL''dir. Oda yönetim kurulu 2027
    yılı bütçesini hazırlamaktadır. Oda sekreterliği görevi bir süredir boştur. Oda genel kurulu, yönetim kurulunun önerisi
    üzerine oda sekreterinin kendiliğinden yapabileceği harcama miktarını 50.000 TL olarak belirlemiştir.


    **İstenenler:**


    (a) Odanın bütçesinin hangi ay içinde, kim tarafından hazırlanıp kime sunulacağını ve kabul edilen bütçenin hangi tarihten
    itibaren yürürlüğe konulacağını belirtiniz. (5 puan)


    (b) 2027 bütçesi zorunlu nedenlerle 1 Ocak 2027''de yürürlüğe konulamazsa mali işlerin nasıl yürütüleceğini açıklayınız;
    üç aylık geçici bütçe için kullanılabilecek tutarı hesaplayınız. (6 puan)


    (c) Oda bütçesinden yapılacak bir harcamada hangi imzalar aranır? Sekreterlik boş olduğundan mevcut durumda imzayı kimlerin
    atacağını belirtiniz. (6 puan)


    (d) Sekreterin kendiliğinden yapabileceği harcama için ne şart aranır? 45.000 TL''lik bir harcamanın hangi yöntemle yapılacağını
    açıklayınız. (5 puan)

    '
  cozum: '**(a)** Bütçe, **Nisan ayı içinde Yönetim Kurulunca** mevzuata uygun olarak hazırlanır ve gerekçesiyle birlikte
    **Genel Kurula** sunulur. Genel Kurulca kabul edilen bütçe, **izleyen yılın Ocak ayının birinci gününden** itibaren yürürlüğe
    konulur ve uygulanır.


    **(b)** Bütçe zorunlu nedenlerle 1 Ocak''ta yürürlüğe konulamazsa odanın mali işleri **bir evvelki yıl bütçesinin 1/12''si
