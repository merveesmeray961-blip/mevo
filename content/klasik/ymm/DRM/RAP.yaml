  sure_dk: 35
  soru: '**Olay:** Çınar Gıda A.Ş. borsada işlem görmemekte, ancak 6102 sayılı Türk Ticaret Kanunu uyarınca bağımsız denetime
    tabidir. Şirketin 31.12.2025 tarihli finansal tabloları gerçeğe uygun sunum çerçevesi olan TMS’ye göre hazırlanmıştır.
    Finansal tabloların hazırlanmasından sorumlu olanlar ile finansal raporlama sürecinin gözetiminden sorumlu olanlar aynı
    kişilerdir. Bağımsız denetçi olumlu görüş vermeye karar vermiştir; işletmenin sürekliliğine ilişkin önemli bir belirsizlik
    yoktur ve diğer bilgiler için ayrı bir raporlama yapılmaktadır. Şirket aynı hesap dönemi için YMM Mert Kaya ile; yıllık
    kurumlar vergisi beyannamesi ve ekli mali tablolar, Kurumlar Vergisi Kanununun 24 üncü maddesi uyarınca verilen muhtasar
    beyannameler ile geçici vergi bildirimlerinin sürekli denetimi gerektiren tasdiki için de tasdik sözleşmesi yapmıştır.
    Bu işlemlerin tasdikine ilişkin Bakanlıkça tebliğ çıkartılmıştır.


    **İstenenler:**


    (a) Bağımsız denetçi raporunun (BDS 700 Ek, Örnek 1 çerçevesinde) bölüm başlıklarını ve sırasını yazınız; borsada işlem
    görmeyen bu şirketin raporunda Kilit Denetim Konuları bölümünün ve sorumlu denetçinin adının yer alıp almayacağını dayanak
    hükümle belirtiniz; sorumluluklar bölümünün başlığını yazınız. (9 puan)


    (b) Denetçinin finansal tabloların denetimine ilişkin sorumluluklarının açıklamasının raporda nerede yer alacağını ve
    Görüş bölümünün BDS 700 par. 24’e göre içermesi gereken unsurları belirtiniz. (5 puan)


    (c) YMM Mert Kaya’nın tasdik edeceği konuların Tasdik Yönetmeliği’nin 7. maddesinde hangi vergi başlığı altında ve hangi
    bentlerde sayıldığını belirtiniz; bu konularla ilgili tasdik işlemi yapabilmesinin koşulunu ve tasdik raporlarının md.
    19’a göre nasıl çeşitlendirileceğini yazınız. (5 puan)


    (d) YMM’nin düzenleyeceği tasdik raporlarına ilişkin md. 19’daki biçimsel zorunlulukları (sayfaların paraflanması, mühür
    ve imza, rapor sayısındaki sıra ve rumuz), sürekli denetlemeyi gerektiren tasdik raporunda ayrıca belirtilmesi gereken
    hususları ve YMM’nin ortaya koymakla yükümlü olduğu kanaati yazınız. (6 puan)

    '
  cozum: '**(a) Bağımsız denetçi raporunun yapısı (9 puan)**


    BDS 700 par. 20T’ye göre rapor yazılı ve **Ek’teki biçime uygun** düzenlenir. Örnek 1 (TTK’ya göre uyarlanmış) çerçevesinde
    sıra:


    1. **“Bağımsız Denetçi Raporu”** başlığı (par. 21) ve **muhatap** (ör. “… Şirketi Genel Kuruluna”; par. 22);

    2. **A) Finansal Tabloların Bağımsız Denetimi**: 1) **Görüş**; 2) **Görüşün Dayanağı**; 3) **Kilit Denetim Konuları**;
    4) **Yönetimin Finansal Tablolara İlişkin Sorumlulukları**; 5) **Bağımsız Denetçinin Finansal Tabloların Bağımsız Denetimine
    İlişkin Sorumlulukları**;

    3. **B) Mevzuattan Kaynaklanan Diğer Yükümlülükler** (diğer raporlama sorumlulukları ayrı bölüm olduğundan A bölümünden
    sonra yer alır; par. 43, 45);

    4. “Bu bağımsız denetimi yürütüp sonuçlandıran sorumlu denetçi … ’dır” ifadesi, rapor tarihi, imza (mühür dâhil) ve denetçinin
    adresi (par. 46T, 47-49).


    - **Kilit Denetim Konuları bölümü yer alır:** BDS 700 par. 30T’ye göre 6102 sayılı TTK uyarınca yapılan bağımsız denetimlerde
    denetçi, denetime tabi **tüm şirketlerin** (borsada işlem görmeyenler dâhil) finansal tablolarının denetiminde kilit denetim
    konularını BDS 701’e uygun olarak bildirir.

    - **Sorumlu denetçinin adı yer alır:** Par. 46T’ye göre tüm bağımsız denetim raporlarında sorumlu denetçinin adının yer
    alması zorunludur (kişisel güvenliğe yönelik önemli ve etkin tehdit hâlinde ancak Kurumdan izin alınarak açıklanmayabilir).

    - Hazırlayanlar ile gözetimden sorumlular aynı kişiler olduğundan, 4) numaralı bölümün başlığı **“Yönetimin Finansal Tablolara
    İlişkin Sorumlulukları”** olur ve gözetim sorumluluklarına atıf yapılmaz (Ek Örnek 1, dipnot 2).


    **(b) Sorumlulukların yeri ve Görüş bölümü (5 puan)**


    - Par. 41T: Denetçinin finansal tabloların denetimine ilişkin sorumluluklarına yönelik 39-40 ıncı paragraflarda zorunlu
    kılınan açıklama **denetçi raporu metninde** bildirilir (rapor ekinde veya yetkili kurumun internet sitesinde değil).

    - Par. 24: Görüş bölümünde (i) finansal tabloları denetlenmiş olan **işletme belirtilir**, (ii) finansal tabloların **denetlenmiş
    olduğu ifade edilir**, (iii) finansal tabloları oluşturan **her bir tablonun başlığı** belirtilir, (iv) önemli muhasebe
    politikalarının özeti dâhil **dipnotlara atıfta bulunulur**, (v) her bir finansal tablonun **tarihi veya dönemi** açıkça
    belirtilir.


    **(c) Tasdik konusu ve koşul (5 puan)**


    - Md. 7/**B) Kurumlar Vergisi yönünden**: (a) yıllık kurumlar vergisi beyannameleri ve bunlara ekli mali tablolar ve bildirimler;
    (b) Kurumlar Vergisi Kanununun 24 üncü maddesi uyarınca verilen muhtasar beyannameler; (d) geçici vergi bildirimleri.
    (Md. 7/B-c, KVK md. 22 özel beyannameleri bu olayda yoktur.)

    - Koşul: Md. 7 sonundaki fıkraya göre konu ve belgelerin tasdikine ilişkin olarak **Bakanlıkça tebliğ çıkartılmadıkça**
    yeminli mali müşavirler tasdik işlemi yapamazlar; olayda tebliğ çıkartılmıştır. Tasdik işleminde aranacak asgari bilgi
    ve şekil şartları da bu tebliğlerle belirlenir.

    - Md. 19 (ilk fıkra): Tasdik raporları md. 7 ile tasdik kapsamına alınan **konular itibarıyla çeşitlendirilir**.


    **(d) Tasdik raporu biçimi ve içeriği (6 puan)**


    - **Rapor sayısı:** Meslek sicil numarası ile birlikte biri genel, diğeri özel iki sayı verilir; sıra **önce meslek sicil
    numarası, sonra genel sayı, daha sonra özel sayı**; sayının başına **“YMM”** rumuzu konur.

    - **Paraf ve mühür:** Raporların **her sayfası paraf edilir, mühürlenir; son sayfası imzalanır ve mühürlenir.**

    - **Sürekli denetlemeyi gerektiren tasdik raporlarında:** mali tablo ve raporlar üzerinde doğrudan veya dolaylı etkisi
    olan veya olması muhtemel **her türlü mevzuat aykırılıkları** ve mali tabloların **genel kabul görmüş muhasebe ilkelerine
    uygun hazırlanıp hazırlanmadığı** belirtilir.

    - **Kanaat:** YMM, bir bütün olarak ele alınan mali tabloların **gerçeğe uygunluğu ve doğruluğu** hakkında edindiği kanaatini;
    tespit olunan beyanların ilgili mevzuat hükümleri ve mali tablolarla **uyumlu olup olmadığı** yolundaki görüşünü ortaya
    koymakla yükümlüdür.

    '
