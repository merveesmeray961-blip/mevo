- id: YMM-DRM-RAP-K002
  sinav: ymm
  ders: DRM
  konu: RAP
  kazanimlar:
  - BDS 700 olumlu görüş
  - BDS 705 olumlu dışı görüş
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Bağımsız denetçi, Doğu Metal A.Ş.’nin 31.12.2025 tarihli finansal tablolarının denetimini tamamlamıştır.
    Finansal tablolar, geçerli finansal raporlama çerçevesi olan Türkiye Muhasebe Standartlarına uygun olarak gerçeğe uygun
    sunum çerçevesinde hazırlanmıştır. Denetçinin belirlediği önemlilik tutarı 2.400.000 TL’dir. Yönetimin hazırladığı finansal
    tablolarda net dönem kârı 12.000.000 TL, toplam özkaynaklar 70.000.000 TL ve toplam varlıklar 180.000.000 TL’dir.


    | No | Tespit |

    |---|---|

    | 1 | 2026 yılında yapılacak sevkiyatlara ilişkin 18.000.000 TL tutarındaki satışlar 2025 hasılatına ve ticari alacaklara
    kaydedilmiştir. Yönetim düzeltme yapmayı reddetmiştir. |

    | 2 | 9.000.000 TL tutarındaki bakım ve onarım gideri maddi duran varlıklara aktifleştirilmiştir; bu tutar giderleştirilmesi
    gereken harcamadır. Yönetim düzeltme yapmayı reddetmiştir. |

    | 3 | Kayıtlı değeri 4.500.000 TL olan bir iştirakin finansal tablolarına yönetimin engellemesi nedeniyle erişilememiş;
    alternatif prosedürlerle yeterli ve uygun denetim kanıtı elde edilememiştir. |


    Denetçi, 1 ve 2 numaralı tespitlerin toplu etkilerinin yalnızca belirli kalemlerle sınırlı olmadığı, finansal tabloların
    önemli bir bölümünü etkilediği ve sonucu kârdan zarara çevirdiği için yaygın olduğu değerlendirmesine ulaşmıştır. 3 numaralı
    tespitin muhtemel etkisinin ise önemli olabileceği ancak yaygın olmayabileceği sonucuna varmıştır.


    **İstenenler:**


    (a) 1 ve 2 numaralı tespitlerin toplam tutarını, önemliliğin kaç katı olduğunu, net dönem kârına, özkaynaklara ve toplam
    varlıklara oranını ve düzeltme sonrası net dönem sonucunu (vergi etkisini ve 1 numaralı tespitteki satışların maliyetini
    dikkate almadan) hesaplayınız; BDS 705’e göre denetçinin vereceği görüş türünü gerekçesiyle belirtiniz. (9 puan)


    (b) Verilecek görüş türüne göre Görüş bölümünün başlığını ve görüş cümlesinin içeriğini, Görüşün Dayanağı bölümünün başlığını
    ve bu bölümde tutarlara ilişkin yapılacak açıklamayı, BDS 700’ün 28(ç) paragrafındaki açıklamada yapılacak değişikliği
    belirtiniz. (5 puan)


    (c) 3 numaralı tespitin toplam varlıklara oranını ve önemliliğin kaç katı olduğunu hesaplayınız; bu tespit için ayrı bir
    sınırlı olumlu görüş verilip verilemeyeceğini ve tespitin raporda nasıl ele alınacağını açıklayınız. (6 puan)


    (d) BDS 700’e göre denetçi raporunun ilk bölümünün adını ve bu bölümde yer alması gereken unsurları belirtiniz. (5 puan)'
  cozum: '**(a) Görüş türü (9 puan)**


    - Toplam yanlışlık = 18.000.000 + 9.000.000 = **27.000.000 TL**; önemliliğin 27.000.000 / 2.400.000 = **11,25 katı**.

    - Net dönem kârına oranı: 27.000.000 / 12.000.000 = **%225**; özkaynaklara oranı: 27.000.000 / 70.000.000 = **%38,6**;
    toplam varlıklara oranı: 27.000.000 / 180.000.000 = **%15**.

    - Düzeltme sonrası net dönem sonucu = 12.000.000 − 27.000.000 = **−15.000.000 TL** (net zarar; vergi ve satılan mal maliyeti
    etkisi dikkate alınmamıştır); kâr zarara dönüşür.

    - BDS 705 par. 5’e göre etkiler finansal tabloların belirli unsurları, hesapları veya kalemleriyle sınırlı değilse veya
    sınırlı olsalar da finansal tabloların önemli bir bölümünü temsil ediyorsa yaygındır. Burada hasılat, ticari alacaklar,
    maddi duran varlıklar ve net dönem sonucu birlikte etkilenmekte, etki önemliliğin 11 katından fazla olup sonucu tersine
    çevirmektedir. Yeterli ve uygun denetim kanıtı elde etmiş olan denetçi, yanlışlıkların tek başına veya toplu olarak önemli
    ve yaygın olduğu sonucuna vardığından **olumsuz görüş** verir (par. 8). Sınırlı olumlu görüş durumun ciddiyetini iletmekte
    yetersiz kalır.


    **(b) Rapor (5 puan)**


    - Görüş bölümünün başlığı **“Olumsuz Görüş”** olur (par. 16). Denetçi, Olumsuz Görüşün Dayanağı bölümünde belirtilen hususların
    öneminden dolayı ilişikteki finansal tabloların TMS’ye uygun olarak **gerçeğe uygun bir biçimde sunmadığını** (veya doğru
    ve gerçeğe uygun bir görünüm sağlamadığını) belirtir (par. 18).

    - Görüşün Dayanağı bölümünün başlığı **“Olumsuz Görüşün Dayanağı”** olarak değiştirilir ve bölüme olumsuz görüşe sebep
    olan hususlara ilişkin açıklama eklenir (par. 20).

    - Belirli tutarlarla ilgili önemli yanlışlık bulunduğundan mümkün olduğu ölçüde yanlışlığın finansal etkilerinin açıklaması
    ve **tutarı** (hasılat/alacaklarda 18.000.000 TL, maddi duran varlıklarda 9.000.000 TL; toplam 27.000.000 TL) bu bölümde
    verilir (par. 21).

    - BDS 700 par. 28(ç)’deki, elde edilen denetim kanıtlarının görüşe dayanak oluşturacak yeterlilik ve uygunlukta olup olmadığını
    belirten açıklama “olumsuz” ifadesini içerecek şekilde değiştirilir (par. 25).


    **(c) 3 numaralı tespit (6 puan)**


    - 4.500.000 / 180.000.000 = **%2,5**; 4.500.000 / 2.400.000 = **1,9 kat** (1,875). Önemlilik tutarını aşmakta, ancak tek
    başına yaygın değildir.

    - Denetçi, bir bütün olarak finansal tablolara ilişkin olumsuz görüş verdiğinden aynı raporda aynı çerçeve bakımından
    belirli bir kalem (iştirak) hakkında olumlu veya sınırlı olumlu görüşe yer veremez; bu, olumsuz görüşle çelişir (par.
    15).

    - Denetçi olumsuz görüş vermiş olsa dahi olumlu görüş dışında görüş verilmesini gerektirecek diğer hususların (iştirak
    konusu) sebeplerini ve etkilerini Görüşün Dayanağı bölümünde açıklar (par. 27); yeterli ve uygun kanıt elde edilememesinin
    sebepleri bu bölümde belirtilir (par. 24). Başka bir konunun olumsuz görüşe sebep olması bu açıklamayı gereksiz kılmaz
    (A24).


    **(d) BDS 700 – Görüş bölümü (5 puan)**


    - Denetçi raporunun ilk bölümü “Görüş” başlığı altında denetçi görüşünü içerir (par. 23); olumlu görüş dışında görüşte
    başlık BDS 705 par. 16 gereği “Olumsuz Görüş” olarak değiştirilir.

    - Bölümde: (1) finansal tabloları denetlenmiş olan işletme belirtilir, (2) finansal tabloların denetlenmiş olduğu ifade
    edilir, (3) finansal tabloları oluşturan her bir tablonun başlığı belirtilir, (4) önemli muhasebe politikalarının özeti
    dâhil dipnotlara atıfta bulunulur, (5) her bir finansal tablonun tarihi veya dönemi açıkça belirtilir (par. 24).'
