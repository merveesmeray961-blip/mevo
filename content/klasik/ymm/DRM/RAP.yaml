  soru: '**Olay:** Borsada işlem gören Toros Kimya A.Ş.’nin 2025 yılı finansal tablolarını denetleyen denetçi, üst yönetimden
    sorumlu olanlara bildirdiği konular arasından aşağıdakileri değerlendirmiştir. Denetçi, 1 ve 2 numaralı konuların cari
    dönem denetiminde en çok önem arz ettiğine; 3 ve 4 numaralı konularda ise azami düzeyde dikkat gerekmediğine karar vermiştir.


    | No | Konu | Bilgi |

    |---|---|---|

    | 1 | Ticari alacaklara ilişkin beklenen kredi zararı karşılığı | Yüksek derecede tahmin belirsizliği içerir; ciddi risk
    olarak belirlenmiştir. Değerleme uzmanından faydalanılmış, denetim ekibi dışındaki kişilerle istişare yapılmış ve üst
    yönetimden sorumlu olanlarla yoğun etkileşim kurulmuştur. |

    | 2 | Dönem içinde ilişkili tarafla yapılan, olağan iş akışı dışındaki önemli işlem | Finansal tablolar üzerinde önemli
    etkisi vardır; muhasebeleştirilmesine ilişkin karmaşık yargılar gerektirmiş ve denetçinin genel denetim stratejisini etkilemiştir.
    |

    | 3 | Hasılat kesim işlemleri | Önceki dönem denetçi raporunda kilit denetim konusu olarak bildirilmiştir; bu dönemde
    ciddi risk belirlenmemiş, kontroller etkin işlemiştir. |

    | 4 | Yönetimin kontrolleri ihlal riski | BDS 240 gereği ciddi risk olarak ele alınmıştır; niteliği gereği standart prosedürlerle
    karşılanmıştır. |


    Şirket ayrıca, YMM Ayşe Demir’den aşağıdaki işlemler için tasdik raporu düzenlemesini istemiştir. Hazine ve Maliye Bakanlığı,
    bu işlemlerden (iv) numaralısına ilişkin tasdik uygulaması için henüz tebliğ çıkartmamıştır; diğerleri için tebliğ çıkartılmıştır:


    (i) KDV yönünden iade hakkı doğuran işlemler ve belgeler; (ii) 6183 sayılı Kanunun 105 inci maddesi gereğince verilen
    terkin beyanlarının incelenmesi; (iii) eğitim, spor ve sağlık yatırımlarından elde edilen kazanç istisnası; (iv) KDV’ye
    ilişkin olup Bakanlıkça gerek görülecek diğer işlem ve belgeler.


    YMM Ayşe Demir, bu tasdik çalışmaları için 2026 yılında çalışma kâğıtları düzenlemiştir. Bu çalışma kâğıtlarından biri,
    2030 yılında hukuki ihtilafa konu olmuş ve ihtilaf 2033 yılında sonuçlanmıştır.


    **İstenenler:**


    (a) Kilit denetim konularının belirlenme sürecini (BDS 701 par. 9-10) açıklayarak 1–4 numaralı konulardan hangilerinin
    kilit denetim konusu olduğunu, 3 ve 4 numaralı konular için gerekçeleriyle birlikte belirtiniz. (8 puan)


    (b) 1 numaralı kilit denetim konusunun raporda açıklanmasında bulunması gereken iki unsuru ve denetimde konunun nasıl
    ele alındığının açıklanmasında denetçinin neleri belirtebileceğini yazınız; açıklamada sonuca işaret edilirse hangi izlenimden
    kaçınılması gerektiğini belirtiniz. (5 puan)


    (c) (i)–(iv) numaralı işlemlerin Tasdik Yönetmeliği’nin 7. maddesindeki hangi başlıklar altında sayıldığını belirtiniz;
    (iv) numaralı işlem için YMM Ayşe Demir tasdik işlemi yapabilir mi, gerekçesini yazınız. (5 puan)


    (d) Tasdik Yönetmeliği’ne göre çalışma kâğıtlarında en az bulunması gereken başlık unsurlarını yazınız; mülkiyetin kime
    ait olduğunu, 2026 yılında düzenlenen çalışma kâğıtlarının hangi yıldan itibaren kaç yıl saklanacağını ve ihtilafa konu
    olan dosyanın saklama süresinin ne zaman sona ereceğini belirtiniz. (4 puan)

    '
  cozum: '**(a) Kilit denetim konularının belirlenmesi (8 puan)**


    BDS 701 par. 9: Denetçi, **üst yönetimden sorumlu olanlara bildirilen konular arasından**, denetimin yürütülmesi sırasında
    **azami düzeyde dikkat** etmesini gerektiren konuları belirler; bunu yaparken (a) “önemli yanlışlık” riski daha yüksek
    değerlendirilen veya ciddi riskli alanları, (b) yüksek tahmin belirsizliğine maruz kalan muhasebe tahminleri dâhil yönetimin
    önemli yargılarını içeren alanlara ilişkin önemli denetçi yargılarını, (c) dönem içinde gerçekleşen önemli olay veya işlemlerin
    denetime etkilerini göz önünde bulundurur. Par. 10: Bu konulardan **cari dönem denetiminde en çok önem arz edenler kilit
    denetim konularını** oluşturur.


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | **Kilit denetim konusu** | Par. 9(a) (ciddi risk) ve 9(b) (yüksek tahmin belirsizliği içeren muhasebe tahmini);
    uzman ve ekip dışı istişare ile üst yönetimle yoğun etkileşim konunun en çok önem arz ettiğinin göstergesidir (A23-A24,
    A27, A29). |

    | 2 | **Kilit denetim konusu** | Par. 9(c): olağan iş akışı dışındaki, ilişkili tarafla yapılan önemli işlem; genel denetim
    stratejisini etkilemiştir (A25). |

    | 3 | **Kilit denetim konusu değil** | Önceki dönem denetçi raporundaki kilit denetim konularının güncellenmesi zorunlu
    değildir; belirleme cari döneme ait finansal tabloların denetimine ilişkindir (A11). Bu dönemde azami dikkat gerekmemiştir.
    |

    | 4 | **Kilit denetim konusu değil** | Yönetimin kontrolleri ihlal riski BDS 240 gereği ciddi risk sayılır; ancak niteliklerine
    bağlı olarak azami dikkat gerektirmeyebilir ve 10 uncu paragraf uyarınca kilit denetim konusu olarak değerlendirilmeyebilir
    (A21; ayrıca A17: ölçütlere uymak kendiliğinden kilit denetim konusu yapmaz). |


    **(b) 1 numaralı kilit denetim konusunun açıklanması (5 puan)**


    - Açıklama (par. 13) (i) konunun **denetimde en çok önem arz eden konu olarak değerlendirilmesinin sebebini** ve (ii)
    **denetimde konunun nasıl ele alındığını** içerir (varsa finansal tablolardaki ilgili açıklamaya atıf yapılır).

    - Konunun nasıl ele alındığında denetçi (A46) şunları açıklayabilir: denetçinin yaklaşımının veya verdiği karşılığın “önemli
    yanlışlık” riskiyle ya da kilit denetim konusuyla en çok ilgili yönlerini; uygulanan prosedürlere ilişkin kısa bir değerlendirmeyi;
    prosedürlerin sonuçlarına işaret edilmesini; konuyla ilgili kilit gözlemleri (veya bunların bileşimini).

    - Sonuca işaret edilirse açıklama, denetçinin **münferit kilit denetim konusu hakkında ayrı bir görüş bildirmiş olduğu
    izlenimi yaratmamalı** ve bir bütün olarak finansal tablolara ilişkin görüşü hakkında soru işareti oluşturmamalıdır (A51).


    **(c) Tasdik Yönetmeliği md. 7 sınıflaması (5 puan)**


    | İşlem | Md. 7 başlığı |

    |---|---|

    | (i) İade hakkı doğuran işlem ve belgeler | C) Katma Değer Vergisi yönünden — bent (b) |

    | (ii) 6183 s. Kanun md. 105 uyarınca verilen terkin beyanlarının incelenmesi ve tasdiki | E) Amme Alacaklarının Tahsil
    Usulü Hakkında Kanun yönünden — bent (b) |

    | (iii) Eğitim, spor ve sağlık yatırımlarından elde edilen kazanç istisnası | G) Mali mevzuatta yer alan teşvik, indirim,
    istisna ve muafiyetler yönünden — bent (e) |

    | (iv) Bakanlıkça gerek görülecek KDV’ye ilişkin diğer işlem ve belgeler | C) Katma Değer Vergisi yönünden — bent (c)
    |


    (iv) için **tasdik işlemi yapamaz**: Md. 7’ye göre sayılan konu ve belgelerin tasdikine ilişkin olarak Bakanlıkça tebliğ
    çıkartılmadıkça yeminli mali müşavirler bu konu ve belgelerle ilgili tasdik işlemi yapamazlar. Konunun md. 7’de sayılmış
    olması tek başına yetki vermez. Tasdik raporları md. 19 uyarınca md. 7 ile kapsama alınan konular itibarıyla çeşitlendirilir.


    **(d) Çalışma kâğıtları (4 puan)** (Md. 17)


    - Her çalışma kâğıdında bir **başlık** bulunur; başlık **denetlenen müşteriyi, denetlemenin yapıldığı dönemi, çalışma
    kâğıdının konusunu, hazırlayan yeminli mali müşavirin ad ve paraflarını ve hazırlama tarihini** içerir.

    - Çalışma kâğıtlarının **mülkiyeti yeminli mali müşavire aittir**.

    - Çalışma kâğıtları, dosya içinde, **düzenlenmelerini izleyen yıldan itibaren 10 yıl süreyle** saklanır ve yetkili mercilere
    istenildiğinde ibraz edilir: 2026’da düzenlenenler için süre **2027’de başlar ve 2036 yılı sonunda biter**.

    - Bu süre içinde **hukuki ihtilafa konu olan dosyalar ihtilafın sonuçlanmasına kadar** saklanır: 2036 yılı sonu ihtilafın
    sonuçlandığı 2033’ten sonra olduğundan, ihtilafa konu dosya için de saklama süresi **2036 yılı sonunda** sona erer.

    '
