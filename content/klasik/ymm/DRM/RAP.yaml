- id: YMM-DRM-RAP-K008
  sinav: ymm
  ders: DRM
  konu: RAP
  kazanimlar:
  - BDS 705 olumlu dışı görüş
  - BDS 706 dikkat çekme ve diğer hususlar
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Olay:** Bağımsız denetçi, borsada işlem görmeyen Mavi Gıda A.Ş.’nin 31.12.2025 tarihli finansal tablolarını denetlemiştir.
    Finansal tablolar gerçeğe uygun sunum çerçevesine göre hazırlanmıştır; BDS 701 uygulanmamaktadır. Denetçinin belirlediği
    önemlilik tutarı 3.000.000 TL’dir. Toplam varlıklar 150.000.000 TL, dönem net kârı (düzeltme öncesi) 14.500.000 TL, maddi
    duran varlıkların net defter değeri 61.000.000 TL’dir. Vergi etkileri dikkate alınmayacaktır.


    | No | Tespit |

    |---|---|

    | 1 | Denetim sözleşmesi kabul edildikten sonra yönetim, yurt dışındaki depoda bulunan 4.200.000 TL tutarındaki stokun
    sayımının gözlenmesine izin vermemiş, denetçinin sınırlamayı kaldırma talebini reddetmiştir. Alternatif prosedürlerle
    yeterli ve uygun denetim kanıtı elde edilememiştir. |

    | 2 | Bir makine grubu için 6.000.000 TL eksik amortisman gideri ayrılmıştır; yönetim düzeltme yapmayı reddetmiştir. |

    | 3 | Bilanço tarihinden sonra, denetçi raporu tarihinden önce meydana gelen sel baskını üretim tesisinin faaliyetini
    bir süre aksatmıştır; işletmenin sürekliliği varsayımına ilişkin önemli bir belirsizlik bulunmamaktadır. Olay finansal
    tablo dipnotlarında geçerli çerçeveye uygun biçimde açıklanmıştır; denetçi, olayın kullanıcıların finansal tabloları anlaması
    açısından temel teşkil ettiğini düşünmektedir. |

    | 4 | Denetçi, denetimin planlanan kapsamına ve önemliliğin uygulanmasına ilişkin bilgilerin finansal tablolarda yer almadığını,
    ancak kullanıcıların denetimi anlamaları açısından raporda bildirilmesinin gerekli olduğunu değerlendirmiştir. Mevzuat
    bu bildirimi yasaklamamaktadır. |


    Denetçi, 1 numaralı tespitin muhtemel etkilerinin önemli olabileceği ancak yaygın olmayabileceği, 2 numaralı tespitin
    etkisinin ise önemli ancak yaygın olmadığı ve iki tespitin toplu etkisinin de yaygın olmadığı sonucuna varmıştır.


    **İstenenler:**


    (a) 1 numaralı tespit için verilecek görüş türünü gerekçesiyle belirtiniz; sınırlama karşısında denetçinin izleyeceği
    adımları ve görüşte kullanılacak ifadeyi açıklayınız; stokun toplam varlıklara oranını hesaplayınız. (8 puan)


    (b) 2 numaralı tespit için görüş türünü ve Görüşün Dayanağı bölümünde yer verilecek hususları belirtiniz; yanlışlık düzeltilmiş
    olsaydı dönem net kârı ile maddi duran varlıkların net defter değerinin ne olacağını ve 1 ile 2 numaralı tespitlerin toplam
    tutarının toplam varlıklara oranını hesaplayınız. (7 puan)


    (c) 3 ve 4 numaralı tespitler için denetçi raporuna hangi paragrafların ekleneceğini, ekleme koşullarını ve paragrafların
    içeriğine ilişkin kuralları açıklayınız. (6 puan)


    (d) 3 numaralı tespitteki olayın finansal tablolarda hiç açıklanmamış olduğunu varsayınız. Bu durumda Dikkat Çekilen Hususlar
    paragrafının yeterli olup olmadığını ve denetçinin ne yapması gerektiğini açıklayınız. (3 puan)'
  cozum: '**(a) Tespit 1 (8 puan)**


    - **Görüş türü: sınırlı olumlu görüş.** Denetçi sözleşmeyi kabul ettikten sonra yönetim kapsamı sınırlamış ve yeterli
    ve uygun denetim kanıtı elde edilememiştir. Tespit edilmemiş yanlışlıkların muhtemel etkisi önemli olabilir (4.200.000
    TL > 3.000.000 TL önemlilik) ancak yaygın olmayabilir; bu durumda BDS 705 par. 7 ve par. 13(a) uyarınca sınırlı olumlu
    görüş verilir. Etki belirli bir kalemle (stok) sınırlıdır ve toplam varlıkların %2,8’ini oluşturur; par. 5’teki yaygınlık
    ölçütleri (belirli kalemlerle sınırlı olmama, finansal tabloların önemli bir bölümünü temsil etme, açıklamalarda temel
    teşkil etme) sağlanmamaktadır.

    - **Adımlar:** Denetçi önce yönetimden sınırlamayı kaldırmasını talep eder (par. 11). Yönetim reddettiği için (üst yönetimden
    sorumlu olanların tamamı icrai görev üstlenmiyorsa) konuyu üst yönetimden sorumlu olanlara iletir ve alternatif prosedürlerle
    yeterli ve uygun denetim kanıtı elde etmenin mümkün olup olmadığına karar verir (par. 12). Kanıt elde edilemediğinden
    ve etki yaygın olmadığından sonuç sınırlı olumlu görüştür (par. 13(a)).

    - **İfade ve rapor:** Görüşte “… hususunun muhtemel etkileri hariç olmak üzere…” ifadesi kullanılır (par. 17); bölüm başlığı
    “Sınırlı Olumlu Görüşün Dayanağı” olarak değiştirilir ve bu bölümde kanıt elde edilememesinin sebepleri açıklanır (par.
    20, 24).

    - Stok oranı: 4.200.000 / 150.000.000 = **%2,8**.


    **(b) Tespit 2 (7 puan)**


    - **Görüş türü: sınırlı olumlu görüş.** Yeterli ve uygun denetim kanıtı elde edilmiş, yanlışlık önemli (6.000.000 TL >
    3.000.000 TL) ancak yaygın değildir (par. 7, birinci madde). Görüşte “… hususunun etkileri hariç olmak üzere” ifadesi
    kullanılır (par. 17).

    - Belirli bir tutara ilişkin yanlışlık olduğundan denetçi, yanlışlığın finansal etkilerinin açıklamasına ve **tutarına
    (6.000.000 TL)** Görüşün Dayanağı bölümünde yer verir; ölçüm mümkün değilse bu durumu belirtir (par. 21).

    - Düzeltilmiş dönem net kârı: 14.500.000 − 6.000.000 = **8.500.000 TL**. Düzeltilmiş maddi duran varlık net defter değeri:
    61.000.000 − 6.000.000 = **55.000.000 TL**.

    - Toplu tutar: 4.200.000 + 6.000.000 = **10.200.000 TL**; toplam varlıklara oranı 10.200.000 / 150.000.000 = **%6,8**.
    Etkiler belirli kalemlerle sınırlı olduğundan sonuç değişmez, tek bir sınırlı olumlu görüş verilir.


    **(c) Tespit 3 ve 4 (6 puan)**


    - **Tespit 3 – Dikkat Çekilen Hususlar paragrafı:** Husus finansal tablolarda sunulmuş/açıklanmış olmalı, kullanıcıların
    finansal tabloları anlaması açısından temel teşkil etmeli, BDS 705 uyarınca olumlu görüş dışında bir görüşü gerektirmemeli
    ve BDS 701 uygulanan durumlarda kilit denetim konusu olarak belirlenmemiş olmalıdır (BDS 706 par. 8). Burada BDS 701 uygulanmadığından
    son şart sorun çıkarmaz. Paragraf “Dikkat Çekilen Hususlar” ifadesini içeren başlık altında ayrı bölüm olarak yer alır,
    hususa ve açıklamanın finansal tablolardaki yerine (dipnota) atıfta bulunur, yalnızca finansal tablolardaki bilgilere
    dayanır ve dikkat çekilen hususun denetçi görüşünü değiştirmediğini belirtir (par. 9). Bilanço tarihinden sonraki önemli
    olay, standardın verdiği örnektir (A5).

    - **Tespit 4 – Diğer Hususlar paragrafı:** Husus finansal tablolarda sunulan/açıklananlar dışında olmalı, kullanıcıların
    denetimi, denetçinin sorumluluklarını veya raporu anlamasıyla ilgili bulunmalı, mevzuatla yasaklanmamış olmalı ve kilit
    denetim konusu olarak belirlenmemiş olmalıdır (par. 10; denetimin planlanan kapsamı ve önemliliğin uygulanması A9’da örnek
    verilir). “Diğer Hususlar” veya uygun başka bir başlık altında ayrı bölüm oluşturulur (par. 11).

    - Her iki paragraf bakımından, paragraf eklemeyi düşünen denetçi bu düşüncesini ve önerilen metni üst yönetimden sorumlu
    olanlara bildirir (par. 12).


    **(d) Açıklanmamış olay (3 puan)**


    - Dikkat Çekilen Hususlar paragrafı yalnızca finansal tablolarda sunulan veya açıklanan hususlar için eklenebilir; geçerli
    çerçevenin gerektirdiği açıklamaların yerine geçmez (par. 8, par. 9(b), A7(b)).

    - Açıklanması zorunlu bilginin açıklanmaması önemli yanlışlıktır; denetçi durumu üst yönetimden sorumlu olanlarla müzakere
    eder, Görüşün Dayanağı bölümünde ihmal edilen bilgilerin niteliğini tanımlar ve mevzuatla yasaklanmadığı, mümkün olduğu
    ve yeterli kanıt bulunduğu sürece bu bilgilere yer verir; görüş BDS 705’e göre belirlenir (par. 23).'
