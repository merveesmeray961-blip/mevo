  - olcut: (a) Toplam yanlışlık 27.000.000 TL ve önemliliğin 11,25 katı
    puan: 2
  - olcut: '(a) Oranlar: net kârın %225’i, özkaynakların %38,6’sı, toplam varlıkların %15’i'
