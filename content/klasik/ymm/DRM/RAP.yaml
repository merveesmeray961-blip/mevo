  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 7, 9, 11-13, 15, 24-29T
  - mevzuat: BDS 501 Denetim Kanıtları - Seçilmiş Kalemlere İlişkin Özel Hususlar
    madde: par. 7
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 22
  - mevzuat: BDS 706 Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. 8-9
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 5T, 12, 13, 15
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 23, 28, 30T, 45, 46T, 49
