  - BDS 706 dikkat çekme ve diğer hususlar
  - BDS 701 kilit denetim konuları
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Olay:** Borsada işlem gören Marmara Enerji A.Ş.’nin 31.12.2025 tarihli finansal tabloları gerçeğe uygun sunum çerçevesi
    olan TMS’ye göre hazırlanmıştır. Bağımsız denetçi olumlu görüş vermeye karar vermiş; BDS 705 uyarınca olumlu görüş dışında
    görüş gerektiren bir husus ile BDS 570 kapsamında önemli bir belirsizlik tespit etmemiştir. Denetçi, üst yönetimden sorumlu
    olanlara bildirdiği konular arasından aşağıdakileri değerlendirmektedir:


    | No | Konu | Denetçinin değerlendirmesi |

    |---|---|---|

    | 1 | Yetkili bir kamu kurumunun işletmenin bir iştiraki hakkında yürüttüğü kara para aklama soruşturması. | Denetçi,
    konunun cari dönem denetiminde en çok önem arz eden konulardan biri olduğuna karar vermiştir. Mevzuat, soruşturmayı etkileyebilecek
    her türlü bildirimi özellikle yasaklamaktadır. |

    | 2 | Uzun vadeli bir enerji alım sözleşmesinin gerçeğe uygun değer ölçümü (yüksek tahmin belirsizliği; değerleme uzmanından
    faydalanılmıştır). | Denetçi, konunun cari dönem denetiminde en çok önem arz eden konulardan biri olduğuna karar vermiştir.
    Yönetim, konunun raporda bildirilmesinin işletmenin ticari görüşmelerine ve rekabetçi konumuna zarar vereceğini ileri
    sürmektedir; işletme konuyu kamuya açıklamamıştır. Denetçi, bildirimin doğuracağı olumsuz sonuçların kamu yararını aşmayacağını
    değerlendirmektedir. |

    | 3 | İşletme aynı hesap dönemi için TMS’nin dışında başka bir genel amaçlı çerçeveye uygun olarak ikinci bir finansal
    tablo seti daha hazırlamış, denetçi de bu tablolara ilişkin ayrı bir rapor düzenlemiştir. | Konu finansal tablolarda sunulmamıştır;
    denetçi, kullanıcıların denetçi raporunu anlamaları açısından konunun bildirilmesini gerekli görmektedir. Mevzuat bildirimi
    yasaklamamaktadır; konu kilit denetim konusu olarak belirlenmemiştir. |

    | 4 | Mevzuat, denetçi raporunda denetçinin finansal tabloların denetimiyle ilgili sorumluluklarına ilişkin ilâve açıklama
    sağlayan iki hususun belirtilmesini zorunlu kılmaktadır. | Bu hususlar finansal tablolarda sunulan veya açıklananlar dışındadır
    ve kilit denetim konusu olarak belirlenmemiştir. |


    **İstenenler:**


    (a) 1–4 numaralı konuların her biri için, denetçi raporunda nasıl ele alınacağını (kilit denetim konusu olarak bildirilir
    mi, Diğer Hususlar paragrafında mı yer alır, yoksa hiç bildirilmez mi) kısa gerekçesiyle belirtiniz. (8 puan)


    (b) Denetçinin, 2 numaralı konunun cari dönem denetiminde en çok önem arz edenler arasında olmadığına karar verdiğini
    ve başka kilit denetim konusu bulunmadığını varsayınız. 1 numaralı konu raporda bildirilmediğine göre, Kilit Denetim Konuları
    başlığı altında ne yapılacağını, bu kararın üst yönetimden sorumlu olanlara ve çalışma kâğıtlarına yansımasını belirtiniz.
    (6 puan)


    (c) 3 ve 4 numaralı konular için Diğer Hususlar paragrafının raporda nasıl düzenleneceğini (bölüm başlığı, birden çok
    konu bulunması hâlinde yapılabilecek düzenleme, paragrafın içeriğine ilişkin kurallar) açıklayınız; 4 numaralı konunun,
    BDS 700’deki “Mevzuattan Kaynaklanan Diğer Yükümlülükler” bölümünde ele alınan diğer raporlama sorumluluklarından farkını
    belirtiniz. (6 puan)


    (d) Denetçinin Diğer Hususlar paragrafı eklemeyi düşünmesi ve kilit denetim konuları bakımından üst yönetimden sorumlu
    olanlarla kurması gereken iletişimi açıklayınız. (4 puan)

    '
  cozum: '**(a) Konuların raporda ele alınışı (8 puan)**


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | **Bildirilmez** | Mevzuatın konunun kamuya açıklanmasına izin vermemesi hâlinde konu kilit denetim konusu olduğu
    hâlde raporda bildirilmez (BDS 701 par. 14(a); A52: yetkili kurumca yürütülen kara para aklama soruşturmasını etkileyebilecek
    bildirim mevzuatla özellikle yasaklanabilir). Bu konu Diğer Hususlar paragrafı ile de bildirilemez; çünkü Diğer Hususlar
    paragrafı için bildirimin mevzuatla yasaklanmamış olması şarttır (BDS 706 par. 10(a)). |

    | 2 | **Kilit Denetim Konuları bölümünde bildirilir** | Bildirimin doğuracağı olumsuz sonuçların kamu yararını aşacağı
    beklenmediğinden ve işletme konuyu kamuya açıklamamış olduğundan par. 14(b) istisnası uygulanmaz; bu istisna oldukça istisnai
    bir durumdur (A53). Yönetimin olumsuz sonuçlara ilişkin görüşleri denetçiye yardımcı olur, ancak bu görüşlere rağmen konunun
    bildirilip bildirilmeyeceğini denetçi belirler (A54). |

    | 3 | **Diğer Hususlar paragrafı** | Konu finansal tablolarda sunulan veya açıklananlar dışındadır, denetçi raporunun
    anlaşılmasıyla ilgilidir, mevzuatla yasaklanmamıştır ve kilit denetim konusu olarak belirlenmemiştir (BDS 706 par. 10).
    İkinci bir finansal tablo setine ve bu setle ilgili rapora atıf yapan Diğer Hususlar paragrafı bu duruma örnektir (A13).
    |

    | 4 | **Diğer Hususlar paragrafı** | Mevzuat denetçinin sorumluluklarına ilişkin ilâve açıklama sağlayan hususların belirtilmesini
    zorunlu tutuyor olabilir (A11); bu hususlar finansal tablolar dışındadır, yasaklanmamıştır ve kilit denetim konusu değildir
    (par. 10). |


    **(b) Bildirilecek kilit denetim konusu bulunmadığı durum (6 puan)**


    - 1 numaralı konunun par. 14 uyarınca bildirilmemesi ve başka kilit denetim konusunun bulunmaması durumu, BDS 701 par.
    16’nın uygulandığı üç durumdan biridir (A57). Denetçi **“Kilit Denetim Konuları” başlığı altında bu durumun etkisine yönelik
    bir açıklamaya** yer verir (par. 16); örnek açıklama, tarafımızca raporumuzda bildirilecek bir kilit denetim konusunun
    olmadığına karar verildiği yönündedir (A58).

    - Denetçi **bildirilecek kilit denetim konusu bulunmadığına ilişkin kararını üst yönetimden sorumlu olanlara bildirir**
    (par. 17(b)); bu müzakereler denetçinin kararını yeniden değerlendirmesini sağlayabilir (A63). Borsada işlem gören işletmelerde
    denetçinin hiç kilit denetim konusu belirleyememesi çok istisnai bir durumdur (A59).

    - Denetçi çalışma kâğıtlarına **kilit denetim konusu olarak belirlenen bir konunun bildirilmemesine ilişkin kararının
    gerekçesini** ve bildirilecek kilit denetim konusu bulunmadığına ilişkin kararının gerekçesini yazar (par. 18).


    **(c) Diğer Hususlar paragrafının düzenlenmesi (6 puan)**


    - Denetçi, **“Diğer Hususlar” ya da uygun başka bir başlık altında ayrı bir bölüm** oluşturarak paragrafı raporunda yer
    verir (BDS 706 par. 11). Kullanıcıların denetçi raporunu veya sorumluluklarını anlamalarıyla ilgili çok sayıda konu bulunuyorsa,
    her bir konu için **ayrı bir alt başlık** kullanmak faydalı olabilir (A11).

    - Paragrafın içeriği, **ilgili hususun finansal tablolarda sunulmasının ve açıklanmasının zorunlu kılınmadığını açık biçimde
    yansıtır**; mevzuatın veya mesleki standartların (örneğin sır saklama) açıklanmasını yasakladığı bilgileri ve **yönetim
    tarafından sunulması gereken bilgileri içermez** (A15). 3 numaralı konuda paragraf, ikinci bir finansal tablo setinin
    hazırlandığına ve buna ilişkin rapor düzenlendiğine atıf yapar (A13).

    - Diğer Hususlar paragrafında, denetçinin BDS’ler kapsamındaki sorumluluğuna ek **diğer raporlama sorumlulukları** (BDS
    700’deki “Diğer Raporlama Sorumlulukları” bölümü) veya ilâve prosedür uygulanması ve rapor edilmesi talebi **ele alınmaz**
    (A12). 4 numaralı konu, denetçinin sorumluluklarını anlamaya yönelik ilâve açıklama olup bu tür bir ek yükümlülük (ayrı
    prosedür ve rapor) değildir.


    **(d) Üst yönetimden sorumlu olanlarla iletişim (4 puan)**


    - Denetçi, raporuna Diğer Hususlar paragrafı eklemeyi düşünüyorsa **bu düşüncesini ve paragraf için önerilen metni** üst
    yönetimden sorumlu olanlara bildirir (BDS 706 par. 12).

    - Denetçi **kilit denetim konusu olarak belirlediği hususları (2 numaralı konu)** üst yönetimden sorumlu olanlara bildirir
    (BDS 701 par. 17(a)); bu iletişim kilit denetim konusu olarak belirlenen ancak raporda bildirilmeyecek konuları (1 numaralı
    konu) da kapsar (A62).

    '
