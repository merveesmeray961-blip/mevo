- id: YMM-DRM-RAP-K003
  sinav: ymm
  ders: DRM
  konu: RAP
  kazanimlar:
  - BDS 705 olumlu dışı görüş
  - BDS 706 dikkat çekme ve diğer hususlar
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bağımsız denetçi, 6102 sayılı Türk Ticaret Kanunu uyarınca denetime tabi Kuzey Gıda A.Ş.’nin 31.12.2025
    tarihli finansal tablolarını denetlemektedir. Finansal tablolar gerçeğe uygun sunum çerçevesine göre hazırlanmıştır. Denetçinin
    belirlediği önemlilik tutarı 3.000.000 TL, toplam varlıklar 90.000.000 TL’dir. Denetim sözleşmesi kabul edildikten sonra
    yönetim, aşağıdaki üç konuda denetimin kapsamını sınırlamıştır.


    | No | Sınırlama | Etkilenen tutar (TL) |

    |---|---|---|

    | 1 | Yurt dışındaki depoda bulunan stokun sayımına izin verilmemiştir. | 3.600.000 |

    | 2 | Devam eden bir davaya ilişkin hukuk müşavirinin yazılı teyidi alınamamıştır; olası yükümlülük tutarı. | 5.000.000
    |

    | 3 | Ortaklık payı bulunan bir iştirakin finansal tablolarına erişim sağlanmamıştır; iştirakin kayıtlı değeri. | 2.800.000
    |


    Denetçi sınırlamanın kaldırılmasını talep etmiş, yönetim bu talebi reddetmiştir. Üst yönetimden sorumlu olanların tamamı
    işletme yönetiminde icrai görev üstlenmemektedir. Alternatif prosedürlerle yeterli ve uygun denetim kanıtı elde edilememiştir.
    Denetim büyük ölçüde tamamlanmıştır ve mevzuat nedeniyle denetimden çekilmek mümkün değildir. Denetçi, belirsizliklerin
    muhtemel etkileşimi ve finansal tablolar üzerindeki muhtemel kümülatif etkileri sebebiyle finansal tablolara ilişkin görüş
    oluşturmanın mümkün olmadığı sonucuna varmıştır.


    **İstenenler:**


    (a) Üç sınırlamanın toplam tutarını, önemliliğin kaç katı olduğunu ve toplam varlıklara oranını hesaplayınız; her bir
    sınırlamayı tek başına önemlilik tutarıyla karşılaştırınız; denetçinin sınırlama karşısında izlemesi gereken adımları
    ve görüş vermekten kaçınma sonucunun dayanağını BDS 705’e göre açıklayınız. (7 puan)


    (b) Görüş vermekten kaçınma durumunda denetçi raporunun Görüş bölümünde, Görüşün Dayanağı bölümünde ve denetçinin sorumluluklarının
    açıklandığı bölümde yapılacak değişiklikleri; kilit denetim konuları ve yönetim kurulunun yıllık faaliyet raporu bakımından
    raporlamayı açıklayınız. (7 puan)


    (c) Denetimin büyük ölçüde tamamlanmış olduğunu ve mevzuatın denetçinin denetime devam etmesini gerektirdiğini (denetimden
    çekilmenin mümkün olmadığını) göz önünde bulundurarak denetçinin bu durumda nasıl hareket edebileceğini; denetimden çekilmemesinin
    nedenini açıklamak üzere raporuna hangi paragrafı ekleyebileceğini, bu paragrafın başlığını ve eklenebilmesinin şartlarını
    belirtiniz. (8 puan)'
  cozum: '**(a) Sınırlamaların değerlendirilmesi (7 puan)**


    - Toplam tutar = 3.600.000 + 5.000.000 + 2.800.000 = **11.400.000 TL**; önemliliğin 11.400.000 / 3.000.000 = **3,8 katı**;
    toplam varlıkların 11.400.000 / 90.000.000 = **%12,7**’si.

    - Tek başına: 1 numaralı 3.600.000 / 3.000.000 = 1,2 kat; 2 numaralı 5.000.000 / 3.000.000 = 1,7 kat (1,67); 3 numaralı
    2.800.000 / 3.000.000 = 0,93 kat. Yani konuların ikisi tek başına önemlilik tutarını aşarken biri aşmamaktadır; ancak
    üçü birlikte önemliliğin 3,8 katıdır.

    - Denetçinin izleyeceği adımlar: denetim sözleşmesi kabul edildikten sonra yönetimin kapsamı sınırladığını fark eden denetçi
    önce yönetimden sınırlamayı kaldırmasını talep eder (par. 11). Yönetim reddettiğinde, üst yönetimden sorumlu olanların
    tamamı icrai görev üstlenmediği için konuyu üst yönetimden sorumlu olanlara iletir ve alternatif prosedürlerle yeterli
    ve uygun kanıt elde etmenin mümkün olup olmadığına karar verir (par. 12). Kanıt elde edilememiştir.

    - Birden fazla belirsizlik içeren istisnai durumda, belirsizliklerin her birine ilişkin yeterli ve uygun kanıt elde edilmiş
    olmasına bağlı kalmaksızın muhtemel etkileşimleri ve kümülatif etkileri sebebiyle görüş oluşturmak mümkün değilse denetçi
    **görüş vermekten kaçınır** (par. 10). Etkilerin önemli ve yaygın olabileceği ve sınırlı olumlu görüşün yetersiz kalacağı
    durumda, denetimden çekilmek mümkün veya uygulanabilir olmadığından denetçi finansal tablolara ilişkin görüş vermekten
    kaçınır (par. 13).


    **(b) Rapor (7 puan)**


    - Görüş bölümünün başlığı **“Görüş Vermekten Kaçınma”** olur (par. 16); denetçi ilişikteki finansal tablolara ilişkin
    **görüş bildirmediğini (vermediğini)** belirtir ve finansal tabloların denetlenmiş olduğunu belirten açıklamayı, finansal
    tabloları denetlemek üzere görevlendirilmiş olduğunu ifade edecek şekilde değiştirir (par. 19).

    - Görüşün Dayanağı bölümünün başlığı **“Görüş Vermekten Kaçınmanın Dayanağı”** olarak değiştirilir ve bölüme görüş verilmemesine
    sebep olan hususlara ilişkin açıklama eklenir (par. 20); yeterli ve uygun denetim kanıtı elde edilememesinin sebepleri
    açıklanır (par. 24). BDS 700’ün 28(b) ve 28(ç) paragraflarındaki unsurlara (sorumluluk bölümüne atıf; kanıtın yeterliliğine
    ilişkin açıklama) yer verilmez (par. 26).

    - Denetçinin sorumluluklarının açıklandığı bölüm yalnızca üç unsuru içerecek şekilde değiştirilir: denetimin BDS’lere
    uygun yürütülmesi ve raporun düzenlenmesine ilişkin sorumluluk, kanıt elde edilememesi ve bağımsızlık/etik açıklaması
    (par. 28).

    - Görüş vermekten kaçınıldığından, mevzuatla aksi öngörülmedikçe Kilit Denetim Konuları ve Diğer Bilgiler bölümlerine
    yer verilmez (par. 29). TTK uyarınca yapılan denetimde Kilit Denetim Konuları bölümüne yer verilmez ve yönetim kurulunun
    yıllık faaliyet raporuna ilişkin de görüş vermekten kaçınılır (par. 29T).


    **(c) Çekilmenin mümkün olmadığı durumda raporlama (8 puan)**


    - Denetimin büyük ölçüde tamamlandığı durumlarda denetçi, denetimden çekilmeden önce mümkün olduğu ölçüde **denetimi tamamlamaya,
    görüş vermekten kaçınmaya ve Görüşün Dayanağı bölümünde kapsam sınırlamasını açıklamaya** karar verebilir (BDS 705 A13).
    Mevzuatın denetçinin denetime devam etmesini gerektirdiği özel durumlarda **denetimden çekilmek mümkün olmayabilir** ve
    bu durumda denetçi **raporuna Diğer Hususlar paragrafı eklemenin gerekli olduğuna karar verebilir** (A14).

    - Yönetimin getirdiği sınırlama sebebiyle yeterli ve uygun kanıt elde edilememesinin muhtemel etkisinin yaygın olmasına
    rağmen denetimden çekilme imkânı bulunmayan ender durumlarda denetçi, **denetimden çekilmemesinin neden mümkün olmadığını
    açıklamak üzere** raporuna **Diğer Hususlar paragrafı** ekleyebilir (BDS 706 A10).

    - Paragraf, **“Diğer Hususlar” ya da uygun başka bir başlık altında ayrı bir bölüm** olarak raporda yer alır (BDS 706
    par. 11); finansal tablolarda sunulan veya açıklananlar dışındaki bu hususun raporda bildirilmesi, **mevzuatla yasaklanmamış
    olması** ve (BDS 701 uygulanıyorsa) kilit denetim konusu olarak belirlenmemiş olması şartıyla mümkündür (par. 10). Görüş
    vermekten kaçınıldığında Kilit Denetim Konuları bölümüne yer verilmediğinden ikinci şart kendiliğinden sağlanır (BDS 705
    par. 29).

    '
