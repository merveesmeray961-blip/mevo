- id: YMM-DRM-RAP-K001
  sinav: ymm
  ders: DRM
  konu: RAP
  kazanimlar:
  - BDS 705 olumlu dışı görüş
  - BDS 706 dikkat çekme ve diğer hususlar
  - BDS 701 kilit denetim konuları
  - BDS 700 olumlu görüş
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Pınar Gıda A.Ş.**, payları borsada işlem görmeyen ve 6102 sayılı TTK uyarınca bağımsız denetime tabi bir şirkettir.
    2025 yılı denetimine ilişkin bilgiler şöyledir:


    - Denetçinin belirlediği önemlilik: **3.000.000 TL**.

    - Denetçi şirkete Mart 2026''da seçildiği için **31.12.2025 tarihli stok sayımına katılamamıştır**. Stoklar 18.000.000
    TL''dir. Sayım listeleri saklanmadığından alternatif denetim prosedürleriyle stokların mevcudiyeti ve durumu hakkında
    yeterli ve uygun kanıt elde edilememiştir. Denetçi, olası etkilerin önemli olabileceği ancak yaygın olmayacağı kanaatindedir.

    - Yönetimin düzeltmeyi reddettiği yanlışlıklar: şüpheli ticari alacaklar karşılığı **2.200.000 TL** eksik, kıdem tazminatı
    karşılığı **1.300.000 TL** eksik ayrılmıştır. Denetçi bu yanlışlıkların finansal tablolar üzerinde yaygın etkisi olmadığı
    kanaatindedir.

    - Şirket bir banka kredisinin finansal sözleşme şartlarını (covenant) ihlal etmiştir; bu durum işletmenin sürekliliğine
    ilişkin **önemli bir belirsizlik** oluşturmakta olup Dipnot 2''de yeterince açıklanmıştır.

    - Karmaşık bayi prim ve iskonto sistemi nedeniyle **hasılatın muhasebeleştirilmesi**, denetimde en çok önem arz eden konu
    olarak belirlenmiştir.

    - Bilanço tarihinden sonra bir depoda çıkan **yangın** Dipnot 28''de uygun şekilde açıklanmıştır. Denetçi bu hususu kullanıcıların
    finansal tabloları anlaması açısından temel öneme sahip görmekte, ancak kilit denetim konusu olarak belirlememiştir.


    **İstenenler:**


    **(a)** Denetçinin vermesi gereken görüş türünü belirleyiniz. Kararınızı, yanlışlıkların önemlilikle karşılaştırmasını
    ve stok sorununu birlikte değerlendirerek gerekçelendiriniz. **(7 puan)**


    **(b)** Denetçi raporunda yer alması gereken bölümleri, her birinin içeriğini ve BDS 700''e göre sıralamada kesin olan
    kuralları açıklayınız. **(8 puan)**


    **(c)** Kilit Denetim Konuları bölümünün bu şirket için zorunlu olup olmadığını ve bu bölümde hangi konuların nasıl yer
    alacağını açıklayınız. **(5 puan)**


    **(d)** Stok sorununun, yönetimin sayım belgelerine erişimi engellemesinden kaynaklandığını ve olası etkilerinin önemli
    ve **yaygın** olabileceğini varsayınız (denetimden çekilme mümkün değildir). Bu durumda görüş türü ve rapor içeriği nasıl
    değişir? **(5 puan)**

    '
  cozum: '**(a) Görüş türü: Sınırlı olumlu görüş**


    - Düzeltilmemiş yanlışlıklar: 2.200.000 + 1.300.000 = **3.500.000 TL**. Bu tutar önemliliği (3.000.000 TL) 500.000 TL
    aştığından yanlışlıklar toplu olarak **önemlidir**; denetçiye göre yaygın değildir. BDS 705 par. 7(a): yeterli kanıt elde
    edilmiş, yanlışlıklar önemli ama yaygın değil → sınırlı olumlu görüş.

    - Stoklar (18.000.000 TL) önemlidir; sayıma katılım mümkün olmamış ve alternatif prosedürler sonuç vermemiştir (BDS 501
    par. 7). Olası etkiler önemli ama yaygın değil → BDS 705 par. 7(b) uyarınca sınırlı olumlu görüş.

    - İki durum birlikte de yaygınlık yaratmadığından (denetçi kanaati) sonuç **sınırlı olumlu görüştür**. Her iki gerekçe
    de Sınırlı Olumlu Görüşün Dayanağı bölümünde açıklanır; kanıt eksikliği için sebebe de yer verilir (par. 24).


    **(b) Raporun bölümleri**


    | Bölüm | İçerik |

    |---|---|

    | Sınırlı Olumlu Görüş | Raporun **ilk** bölümüdür (BDS 700 par. 23); “… hususların olası etkileri hariç olmak üzere …”
    ifadesiyle görüş |

    | Sınırlı Olumlu Görüşün Dayanağı | Görüş bölümünün **hemen ardından** gelir (BDS 700 par. 28): karşılık yanlışlıkları
    (3.500.000 TL, etkileri) ve stok sayımına katılamama, alternatif prosedürlerin sonuçsuz kalması; BDS''lere uygun denetim,
    bağımsızlık, kanıtların sınırlı olumlu görüşe dayanak oluşturduğu açıklaması (BDS 705 par. 25) |

    | İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik | Dipnot 2''ye atıf, önemli belirsizliğin varlığı ve görüşü değiştirmediği
    (BDS 570 par. 22) |

    | Dikkat Çekilen Hususlar | Yangına ve Dipnot 28''e atıf; görüşün bu husus nedeniyle değiştirilmediği (BDS 706 par. 8-9)
    |

    | Kilit Denetim Konuları | Bkz. (c) |

    | Yönetimin ve üst yönetimden sorumlu olanların sorumlulukları; denetçinin sorumlulukları | BDS 700 par. 33-40 |

    | Mevzuattan kaynaklanan diğer yükümlülükler | TTK kapsamındaki raporlama, “Finansal Tabloların Bağımsız Denetimi” bölümünden
    sonra (BDS 700 par. 45) |

    | Sorumlu denetçinin adı, imza, adres, tarih | Par. 46T: sorumlu denetçinin adı tüm raporlarda zorunlu; rapor tarihi,
    yetkililerin tabloların sorumluluğunu üstlendiğine ilişkin kanıt dâhil yeterli kanıtın elde edildiği tarihten önce olamaz
    (par. 49) |


    Sırada kesin olan kurallar: Görüş bölümü ilk sırada, Görüşün Dayanağı hemen ardındadır. Önemli belirsizlik, DÇH ve KDK
    bölümlerinin yeri bunların ardından denetçinin muhakemesiyle belirlenir.


    **(c) Kilit Denetim Konuları**


    - BDS 700 par. 30T / BDS 701 par. 5T: TTK uyarınca denetime tabi **tüm şirketlerde** kilit denetim konuları bildirilir.
    Payların borsada işlem görmemesi bu sonucu değiştirmez → bölüm **zorunludur**.

    - **Hasılat**: Kilit denetim konusu olarak, belirlenme sebebi ve denetimde nasıl ele alındığı ile ilgili dipnota atıf
    yapılarak açıklanır (BDS 701 par. 13).

    - **Önemli belirsizlik** ve **sınırlı olumlu görüşe yol açan konular** nitelikleri itibarıyla KDK''dır; ancak KDK bölümünde
    açıklanmaz, yalnızca ilgili bölümlere atıf yapılır (BDS 701 par. 12 ve 15).

    - **Yangın**, KDK olarak belirlenmediği için DÇH paragrafında yer alır; KDK bölümünde yer almaz.


    **(d) Yaygın kapsam sınırlaması durumu**


    - Yönetim kaynaklı sınırlamada denetçi önce sınırlamanın kaldırılmasını talep eder, reddedilirse üst yönetimden sorumlu
    olanlara iletir ve alternatif prosedürleri değerlendirir (BDS 705 par. 11-12). Kanıt elde edilemiyor, olası etkiler önemli
    ve yaygın olabiliyor ve çekilme mümkün değilse denetçi **görüş vermekten kaçınır** (par. 9, 13(b)(ii)).

    - TTK denetiminde **Kilit Denetim Konuları bölümüne yer verilmez**; denetçi **yönetim kurulu yıllık faaliyet raporuna
    ilişkin görüşten de kaçınır** (par. 29T).

    - Karşılık yanlışlıklarının sebep ve etkileri yine **Görüş Vermekten Kaçınmanın Dayanağı** bölümünde açıklanır (par. 27).

    - Tek bir kaleme (ör. alacaklar) ilişkin ayrıca olumlu görüş verilemez (par. 15). Kanıtların yeterli ve uygun olduğuna
    ilişkin açıklama ile denetçinin sorumlulukları bölümüne atıf yer almaz; sorumluluklar bölümü par. 28''e göre daraltılır
    (par. 26).

    '
