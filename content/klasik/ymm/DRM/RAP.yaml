- id: YMM-DRM-RAP-K007
  sinav: ymm
  ders: DRM
  konu: RAP
  kazanimlar:
  - BDS 700 olumlu görüş
  - BDS 705 olumlu dışı görüş
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Borsada işlem görmeyen Akın Elektronik A.Ş.’nin 31.12.2025 tarihli finansal tabloları gerçeğe uygun sunum
    çerçevesi olan TMS’ye göre hazırlanmıştır. Denetçi yeterli ve uygun denetim kanıtı elde etmiş ve finansal tabloların bir
    bütün olarak önemliliğini 1.500.000 TL olarak belirlemiştir. Net dönem kârı 9.000.000 TL’dir. Denetim sonunda yönetimin
    düzeltmeyi reddettiği aşağıdaki hususlar kalmıştır:


    | No | Husus |

    |---|---|

    | 1 | Kullanılmamış izin karşılığı 1.800.000 TL eksik ayrılmıştır. |

    | 2 | Finansal tablo dipnotlarındaki ilişkili taraf açıklamalarında, ilişkili tarafın niteliğine ilişkin sayısal olmayan
    bir açıklama yanlış sunulmuştur. |

    | 3 | Dönem sonunda mevcut bir taahhüde ilişkin, geçerli finansal raporlama çerçevesinin zorunlu kıldığı açıklama dipnotlarda
    hiç yapılmamıştır; denetçi, açıklanmayan bilgiye ilişkin yeterli ve uygun denetim kanıtı elde etmiştir ve mevzuat bu bilginin
    raporda belirtilmesini yasaklamamaktadır. |


    Denetçi, bu üç hususun etkilerinin finansal tablolar için önemli olduğu, ancak yaygın olmadığı sonucuna varmıştır. Vergi
    etkileri dikkate alınmayacaktır.


    **İstenenler:**


    (a) 1 numaralı yanlışlığın önemliliğin kaç katı olduğunu ve düzeltilseydi net dönem kârının ne olacağını hesaplayınız;
    denetçinin vereceği görüş türünü BDS 705’e göre gerekçesiyle belirtiniz. (4 puan)


    (b) 1, 2 ve 3 numaralı hususların her biri için denetçinin Görüşün Dayanağı bölümünde yapacağı açıklamayı belirtiniz.
    (6 puan)


    (c) Bu durumda denetçi raporunun Görüş bölümünün başlığını, ilk bölüm olarak yerini ve bu bölümde belirtilmesi gereken
    unsurları; raporun başlığını, muhatabını, imzasını ve adresini ilgili BDS 700 paragraflarına göre yazınız. (7 puan)


    (d) Denetçinin olumlu görüş dışında görüş vermeyi düşündüğünde üst yönetimden sorumlu olanlarla kuracağı iletişimi ve
    3 numaralı husus bakımından ayrıca yapması gerekeni belirtiniz. (5 puan)

    '
  cozum: '**(a) Görüş türü (4 puan)**


    1 numaralı yanlışlık 1.800.000 TL ve önemlilik 1.500.000 TL olduğundan yanlışlık önemliliğin **1,2 katıdır** (önemliliği
    300.000 TL aşar). Düzeltilseydi net dönem kârı 9.000.000 − 1.800.000 = **7.200.000 TL** olurdu (vergi etkisi dikkate alınmaksızın).


    Yeterli ve uygun kanıt elde edilmiş, finansal tablolar önemli yanlışlık içermekte, ancak etkiler **yaygın değildir**.
    BDS 705 par. 7(a) ve A1 uyarınca bu durumda **sınırlı olumlu görüş** verilir.


    **(b) Görüşün Dayanağı bölümündeki açıklamalar (6 puan)**


    - **1 numara (sayısal yanlışlık):** Mümkünse yanlışlığın **finansal etkilerinin açıklaması ve tutarı** (1.800.000 TL eksik
    karşılık) Görüşün Dayanağı bölümünde verilir; finansal etkilerin ölçümü mümkün değilse durum bu bölümde belirtilir (BDS
    705 par. 21).

    - **2 numara (sayısal olmayan açıklama):** Bölüme, söz konusu açıklamalardaki yanlışlıkla ilgili **bir izahat** eklenir
    (par. 22).

    - **3 numara (açıklanmayan zorunlu bilgi):** Denetçi açıklama yapılmamasını **üst yönetimden sorumlu olanlarla müzakere
    eder**, ihmal edilen bilgilerin **niteliğini tanımlar** ve mevzuatla yasaklanmadığı, mümkün olduğu ve yeterli ve uygun
    kanıt elde ettiği için **ihmal edilen açıklamaları da bölümde verir** (par. 23).


    **(c) Raporun yapısı (7 puan)**


    - Raporun başlığı açıkça **“Bağımsız Denetçi Raporu”** olur (BDS 700 par. 21); rapor, sözleşmede ya da mevzuatta belirtilen
    **muhataba hitaben** düzenlenir (par. 22).

    - **İlk bölüm “Görüş” başlığı altında** denetçi görüşünü içerir (par. 23); sınırlı olumlu görüşte bölümün başlığı **“Sınırlı
    Olumlu Görüş”**, Görüşün Dayanağı bölümünün başlığı ise **“Sınırlı Olumlu Görüşün Dayanağı”** olur (BDS 705 par. 16, 20).

    - Görüş bölümünde (par. 24) **işletme belirtilir, finansal tabloların denetlenmiş olduğu ifade edilir, her bir tablonun
    başlığı belirtilir, önemli muhasebe politikalarının özeti dâhil dipnotlara atıfta bulunulur ve her bir tablonun tarihi
    veya dönemi açıkça belirtilir.**

    - Denetçi **raporunu imzalar** (par. 47) ve raporda **denetçinin adresi** yer alır (par. 48).


    **(d) Üst yönetimden sorumlu olanlarla iletişim (5 puan)**


    - Denetçi, olumlu görüş dışında bir görüş vermeyi düşündüğünde **kendisini bu görüşü vermeye sevk eden durumları ve görüş
    metnini üst yönetimden sorumlu olanlara bildirir** (BDS 705 par. 30). Bu iletişim, üst yönetimden sorumlu olanların ilâve
    bilgi verme ve açıklamada bulunma fırsatına sahip olmasına ve hususların niteliği konusunda fikir birliğine varılmasına
    imkân sağlar (A27).

    - 3 numaralı husus bakımından denetçi, **açıklama yapılmamasına ilişkin durumu üst yönetimden sorumlu olanlarla müzakere
    eder** (par. 23).

    '
