  soru: '**Olay:** Kuzey Dış Ticaret Sermaye Şirketi A.Ş.’nin yıllık mali tablolarının tasdiki zorunludur. Şirketin hesap
    dönemi takvim yılıdır ve yıllık kurumlar vergisi beyannamesi ile ekli mali tabloların her yıl Nisan ayında beyan edileceği
    kabul edilecektir. Şirket, 2026 hesap dönemi için sürekli denetimi kapsayan tam tasdik amacıyla YMM Ayşe Er ile sözleşme
    yapmıştır. Aşağıdaki olaylar yaşanmıştır:


    | No | Olay |

    |---|---|

    | 1 | Şirket, sözleşmeyi 14 Ekim 2026 tarihinde yazılı gerekçe göstererek feshetmiştir. Ayşe Er, feshi 2 Kasım 2026 tarihinde
    Bakanlığa bildirmiştir. Şirket, yeni YMM Mehmet Öz ile 20 Aralık 2026 tarihinde sözleşme yapmıştır. Ayşe Er, ücret alacağını
    gerekçe göstererek çalışma notlarını ve bilgilerini Mehmet Öz’e devretmemektedir. |

    | 2 | Şirket, Mehmet Öz ile yapılan sözleşmeyi 12 Şubat 2027 tarihinde yazılı gerekçe göstererek feshetmek istemektedir.
    |

    | 3 | Mehmet Öz tasdik raporunu düzenlemiş ve kapsamını raporunda açıkça belirtmiştir. Sonradan, tasdik kapsamındaki gider
    belgelerinin gerçeği yansıtmadığı ve 900.000 TL vergi ile 900.000 TL vergi ziyaı cezasının doğduğu tespit edilmiştir.
    Tasdik kapsamı dışında kalan bir konuda ayrıca 200.000 TL vergi ve 200.000 TL ceza doğmuştur. Mehmet Öz, Ankara’daki şubenin
    kayıtlarının incelenmesi ve bilgi toplama işini Ankara’da bulunan YMM Fulya Kaya’ya yaptırmıştır; kapsamdaki vergi ve
    ceza tutarlarının 300.000 TL’lik vergi ile 300.000 TL’lik cezası bu kısmi incelemeden doğmuştur. |

    | 4 | Mehmet Öz sorumluluk sigortası yaptırmamıştır ve incelemeler sırasında ortaya çıkan bir zarar nedeniyle sorumluluğun
    şirkete yüklenebileceğini ileri sürmektedir. |


    **İstenenler:**


    (a) 1 numaralı olayı fesih, Bakanlığa bildirim, yeni YMM ile sözleşme yapma ve çalışma notlarının devri bakımından Tasdik
    Yönetmeliği’ne göre değerlendiriniz; gün hesabı yapınız. (9 puan)


    (b) 2 numaralı olayda feshin mümkün olup olmadığını açıklayınız. (4 puan)


    (c) 3 numaralı olayda mükellefle birlikte sorumlu olunacak tutarı Mehmet Öz bakımından, kısmi inceleme sorumluluğunu ise
    Fulya Kaya bakımından hesaplayarak sorumluluğun niteliğini açıklayınız. (8 puan)


    (d) 4 numaralı olaydaki durumu değerlendiriniz. (4 puan)'
  cozum: '**(a) Fesih, bildirim ve devir (9 puan)**


    - **Fesih:** Md. 10’a göre tasdik sözleşmesi yazılı gerekçe göstermek şartıyla taraflarca her zaman feshedilebilir. Gerekçe
    gösterildiği ve fesih Ekim’de yapıldığı (yıllık beyanname ayı Nisan’dan önceki üç ay olan Ocak–Mart dışında kaldığı) için
    fesih geçerlidir.

    - **Bakanlığa bildirim:** Feshedilen sözleşmeler fesih tarihinden itibaren en geç **15 gün** içinde Bakanlığa bildirilir.
    Süre 14 + 15 = **29 Ekim 2026’da** dolar. Bildirim 14 Ekim’den 2 Kasım’a kadar (31 − 14) + 2 = **19 gün** sonra yapılmış;
    **4 gün gecikilmiştir**.

    - **Yeni YMM:** Yıllık mali tablolarının tasdiki zorunlu işletmeler, sözleşmenin feshi halinde **bir ay içinde** diğer
    bir YMM ile sözleşme yapmak zorundadır. Süre 14 Kasım 2026’da dolar; 20 Aralık’taki sözleşme fesihten (31 − 14) + 30 +
    20 = **67 gün** sonradır ve **süre aşılmıştır**.

    - **Devir:** Fesih halinde YMM çalışma notlarını ve gerekli tüm bilgileri yerine geçecek YMM’ye devretmek **zorundadır**;
    Yönetmelik devri ücret alacağına bağlamamıştır, Ayşe Er’in tutumu yerinde değildir.


    **(b) Üç aylık fesih yasağı (4 puan)**


    Md. 10’a göre sürekli denetimlerde yıllık beyannamelerin ve buna ekli mali tabloların beyan edileceği aydan önceki üç
    ay içinde tasdik sözleşmesi feshedilemez. Beyan ayı Nisan olduğundan Ocak, Şubat ve Mart 2027 aylarında fesih yapılamaz.
    12 Şubat 2027 bu dönemde kaldığından, yazılı gerekçe gösterilse bile **fesih mümkün değildir**.


    **(c) Sorumluluk (8 puan)**


    - Md. 20’ye göre tasdik raporu düzenleyen YMM **tasdik kapsamı ile sınırlı olmak üzere** tasdikin doğruluğundan sorumludur;
    konu ve belgelerin gerçeği yansıtmaması halinde ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte
    **müştereken ve müteselsilen** sorumludur ve bu sorumluluğun yerine getirilmesinde Borçlar Kanunu’nun “Tam Teselsül” hükümleri
    uygulanır. Kapsam dışındaki 200.000 + 200.000 = **400.000 TL** için sorumluluk doğmaz.

    - Tasdik kapsamındaki tutar: 900.000 + 900.000 = **1.800.000 TL**.

    - Başka ildeki inceleme ve bilgi toplama işi o ildeki YMM’ye yaptırılmışsa, bu kısmi incelemeden doğan sorumluluk incelemeyi
    yapan YMM’ye aittir. Fulya Kaya: 300.000 + 300.000 = **600.000 TL**.

    - Mehmet Öz (mükellefle müteselsil): 1.800.000 − 600.000 = **1.200.000 TL**.


    **(d) Sigorta ve hukuki sorumluluk (4 puan)**


    - YMM’ler tasdikten doğan sorumluluklarını yerine getirebilmek için doğabilecek zararların tazmini amacıyla sorumluluk
    sigortası yaptırabilirler; **sigorta yaptırmak zorunlu değildir**, yaptırmamış olması bir yaptırım doğurmaz.

    - Tasdik amacıyla yapılacak inceleme ve denetlemelerde doğacak zararların hukuki sorumluluğu **YMM’ye** aittir; sorumluluğun
    şirkete yüklenebileceği savı yerinde değildir.'
