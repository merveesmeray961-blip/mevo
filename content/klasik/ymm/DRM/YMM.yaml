    **İstenenler:**


    (a) 1, 2 ve 3 numaralı tespitlerin her biri bakımından Gülden Hanım''ın izlemesi gereken yolu Tasdik Yönetmeliği md. 16
    ile Çalışma Usul ve Esasları Yönetmeliği md. 57 çerçevesinde açıklayınız; hata ve hilelerin önlenmesi veya ortaya çıkarılmasındaki
    temel sorumluluğun kime ait olduğunu belirtiniz. (8 puan)


