- id: YMM-DRM-YMM-K001
  sinav: ymm
  ders: DRM
  konu: YMM
  kazanimlar:
  - tasdik sözleşmesi ve bildirim
  - KDV iade tasdiki
  - tasdik raporlarının süresi ve ibrazı
  - YMM'nin sorumluluğu (VUK md.227)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Ege Seramik A.Ş.**, hesap dönemi takvim yılı olan ve mali tablolarının tasdiki mevzuat gereği zorunlu tutulmayan
    bir şirkettir. 2026 yılına ilişkin bilgiler şöyledir:


    1. Şirket, 2026 yılı kurumlar vergisi beyannamesi ve ekli mali tablolarının tasdiki (tam tasdik) için YMM Can Er ile **22.01.2026**
    tarihinde tasdik sözleşmesi imzalamıştır. YMM Can Er sözleşme örneğini **12.02.2026** tarihinde Bakanlığa göndermiştir.

    2. Şirket, YMM KDV İadesi Tasdik Raporuyla talep edeceği **8.000.000 TL** nakden KDV iadesini, rapor henüz düzenlenmeden
    genel esaslara göre teminat göstererek **06.04.2026** tarihinde almıştır (artırımlı teminat uygulanmamıştır).

    3. Şirket, yararlanılması YMM tasdik raporu ibrazı şartına bağlanan bir istisnadan **50.000.000 TL** tutarında yararlanmak
    istemektedir. Rapor, VUK mükerrer 227. maddedeki sürede ibraz edilmemiş; mükellefe tebliğ edilen mühletin 25. gününde
    ibraz edilmiştir.

    4. Sonradan yapılan vergi incelemesinde, YMM Can Er''in tasdik kapsamında incelediği ve tasdik raporunda kabul ettiği
    bir gider kaleminin gerçeği yansıtmadığı anlaşılmış; ziyaa uğratılan vergi ve kesilecek cezalar belirlenmiştir.


    (VUK md. 353/11 için 2026 yılı alt sınırı 400.000 TL, üst sınırı 4.000.000 TL''dir.)


    **İstenenler:**


    **(a)** Tam tasdik sözleşmesinin düzenlenme tarihini ve sözleşme örneğinin Bakanlığa gönderilme tarihini Tasdik Yönetmeliği
    md. 10 açısından değerlendiriniz. Sözleşmenin sürekli denetimi kapsadığını ve beyannamenin Nisan 2027''de verileceğini
    varsayarak sözleşmenin hangi dönemde feshedilemeyeceğini belirtiniz. **(6 puan)**


    **(b)** 2 numaralı iade için YMM raporunun hangi tarihe kadar ibraz edilmesi gerektiğini, süre aşılırsa ne olacağını ve
    şirketin ek süre imkânını KDV Genel Uygulama Tebliği''ne göre açıklayınız. **(6 puan)**


    **(c)** 3 numaralı durumda şirketin istisnadan yararlanıp yararlanamayacağını ve kesilecek özel usulsüzlük cezasını hesaplayarak
    açıklayınız. **(6 puan)**


    **(d)** 4 numaralı durumda YMM Can Er''in sorumluluğunun niteliğini, kapsamını ve sorumluluğun tespit usulünü 3568 sayılı
    Kanun md. 12 ve Tasdik Yönetmeliği md. 20 çerçevesinde açıklayınız. **(7 puan)**

    '
  cozum: '**(a) Sözleşme ve bildirim**


    - Tasdik Yönetmeliği md. 10 son fıkra: 7/A-a ve 7/B-a kapsamındaki (yıllık beyanname ve ekli mali tablolar) tasdik sözleşmeleri
    ilgili vergilendirme döneminin **ilk ayı içinde** düzenlenir. 22.01.2026 tarihli sözleşme Ocak 2026 içinde olduğundan
    **süresindedir**.

    - Md. 10/1: Sözleşme örneği, sözleşme tarihinden itibaren **15 gün** içinde YMM tarafından Bakanlığa gönderilir. Süre
    23.01.2026''da başlar, **06.02.2026**''da sona erer. 12.02.2026''daki gönderim **süresinden sonradır**; yükümlülük YMM''ye
    aittir.

    - Md. 10: Sürekli denetimlerde beyannamenin verileceği aydan önceki üç ay içinde sözleşme feshedilemez. Beyan ayı Nisan
    2027 olduğundan **Ocak, Şubat ve Mart 2027** aylarında fesih yapılamaz. Diğer zamanlarda yazılı gerekçeyle fesih mümkündür
    ve fesih 15 gün içinde Bakanlığa bildirilir.


    **(b) KDV iadesi ve teminat (KDV GUT IV/A-4.1)**


    - Teminat karşılığı iade alan mükellef, iadenin yapıldığı tarihten itibaren **altı ay** içinde YMM raporunu ibraz etmelidir:
    06.04.2026 + 6 ay = **06.10.2026**.

    - Bu süre içinde rapor verilmez ve ek süre talep edilmezse (veya ek süre talebi uygun bulunmazsa) teminat karşılığı yapılan
    iade **incelemeye sevk edilir** ve teminat **vergi inceleme raporu sonucuna göre** çözülür.

    - Süre içinde rapor ibraz edemeyecek mükellef mazeretiyle başvurursa, mazeret haklı bulunduğunda vergi dairesince VUK
    md. 17 uyarınca **altı ay ek süre** verilebilir (en geç 06.04.2027). Ek sürede de rapor verilmezse iade incelemeye sevk
    edilir.

    - Rapor ibraz edildiğinde teminat iade edilir.


    **(c) Tasdik raporunun geç ibrazı**


    - VUK mükerrer 227/3: Tasdik raporunun zamanında ibrazı şarttır; zamanında ibraz edilmezse mükellefe tebliğ edilmek şartıyla
    **60 günlük mühlet** verilir, bu sürede de ibraz edilmezse haktan yararlanılamaz. Rapor mühletin 25. gününde ibraz edildiğinden
    şirket **istisnadan yararlanır**.

    - VUK md. 353/11: Rapor mükerrer 227/3''ün birinci cümlesindeki sürede (zamanında) ibraz edilmediğinden ceza **yine kesilir**:
    50.000.000 × %5 = **2.500.000 TL**. Bu tutar 400.000 TL alt sınır ile 4.000.000 TL üst sınır arasında olduğundan kesilecek
    özel usulsüzlük cezası **2.500.000 TL**''dir.


    **(d) YMM''nin sorumluluğu**


    - 3568 s.K. md. 12: YMM''ler yaptıkları tasdikin doğruluğundan sorumludur. Tasdikin doğru olmaması hâlinde **tasdikin
    kapsamı ile sınırlı olmak üzere**, ziyaa uğratılan vergilerden ve kesilecek cezalardan **mükellefle birlikte müştereken
    ve müteselsilen** sorumlu olurlar. YMM tasdikin kapsamını raporda açıkça belirtir.

    - Tasdik Yönetmeliği md. 20: Sorumluluğun yerine getirilmesinde Borçlar Kanununun **“Tam Teselsül”** hükümleri uygulanır;
    idare, alacağın tamamını mükelleften veya YMM''den isteyebilir. Başka ildeki inceleme başka bir YMM''ye yaptırılmışsa
    o kısmi incelemeden doğan sorumluluk o YMM''ye aittir (olayda böyle bir durum yoktur). YMM sorumluluk sigortası yaptırabilir
    (zorunlu değildir).

    - VUK mükerrer 227: Tasdik raporundaki bilgilerin defter kayıtlarına ve dayanağı belgelere uygun olmamasından doğan vergi
    ziyaında, meslek mensubu salınacak **vergi, ceza ve gecikme faizlerinden** mükellefle birlikte müştereken ve müteselsilen
    sorumlu tutulur.

    - Tespit usulü (md. 12, 6552 s.K. ile eklenen fıkra): **Mali sorumluluk ve disiplin sorumluluğu ayrı ayrı müstakil raporlarla**
    tespit edilir. Sorumluluk raporu yazılabilmesi için YMM''nin **yazılı savunması** istenir; savunma isteme yazısının tebliğinden
    itibaren **30 gün** içinde savunma yapılmazsa savunma hakkından vazgeçilmiş sayılır.

    '
