    | No | Tespit |

    |---|---|

    | 1 | Toplam 180.000 TL tutarındaki üç gider faturasının dönemsellik ilkesine aykırı biçimde 2027 yılı kayıtlarına alındığı
    görülmüştür. Gülden Hanım hatayı düzeltme önerisiyle birlikte yönetime bildirmiş, yönetim kayıtları düzeltmiştir. |

    | 2 | Stok hesabında 410.000 TL tutarında sayım farkının kayıtlara yansıtılmadığı görülmüştür. Düzeltme önerisi yönetime
    bildirilmiş; yönetim kaydı düzeltmeyi reddetmiştir. |

    | 3 | Muhasebe müdürünün, gerçekte alınmamış bir danışmanlık hizmeti için 275.000 TL tutarında fatura düzenlettirip gider
    yazdığı anlaşılmıştır. Bu eylem suç teşkil etmektedir; yönetim düzeltme önerisini kabul etmemiştir. |


