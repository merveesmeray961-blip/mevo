    yapmıştır. Aşağıdaki olaylar yaşanmıştır:


    | No | Olay |

    |---|---|

    | 1 | Şirket, sözleşmeyi 14 Ekim 2026 tarihinde yazılı gerekçe göstererek feshetmiştir. Ayşe Er, feshi 2 Kasım 2026 tarihinde
    Bakanlığa bildirmiştir. Şirket, yeni YMM Mehmet Öz ile 20 Aralık 2026 tarihinde sözleşme yapmıştır. Ayşe Er, ücret alacağını
