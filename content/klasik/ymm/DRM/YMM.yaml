- id: YMM-DRM-YMM-K002
  sinav: ymm
  ders: DRM
  konu: YMM
  kazanimlar:
  - tam tasdik
  - KDV iade tasdiki
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Hesap dönemi takvim yılı olan Ada Tekstil A.Ş., 2026 hesap dönemi mali tablolarının sürekli denetimi kapsayan
    tam tasdiki ile ihracata dayalı KDV iadesinin tasdiki için YMM Deniz Acar ile sözleşme yapmıştır. Şirket yönetimi iade
    tasdikini, “iade talebimizin çabuk sonuçlandırılması ve hak ve yararlarımızın korunması” için istediğini belirtmiştir.
    Deniz Acar’ın çalışmasına ilişkin bilgiler aşağıdadır.


    **Planlama çalışması**


    | No | Yapılan işlem |

    |---|---|

    | P1 | İşletmenin organizasyonu, iç kontrol sistemi, üretim süreci ve sektörü hakkında gerekli araştırmaları yapmıştır.
    |

    | P2 | Mali tabloları ve önceki döneme ait çalışma kağıtlarını gözden geçirmiş; önceki tasdik raporlarını ve vergi inceleme
    raporlarını temin etmemiştir. |

    | P3 | İşletmenin muhasebe politikasını incelemiş; ancak yayınlanan muhasebe standart ve ilkelerine uygunluğunu araştırmamıştır.
    |

    | P4 | Tasdik çalışması sırasında bilgi alınabilecek işletme personelini belirlememiştir. |

    | P5 | Yazılı tasdik çalışma planını hazırlamıştır. |


    **Kanıt toplama çalışması**


    | No | Yapılan işlem |

    |---|---|

    | E1 | 31.12.2026 tarihinde stok sayımına katılarak mevcut stokları fiilen saymış ve sayım sonucunu kayıtlı stokla karşılaştırmıştır.
    Kayıtlı stok 12.000.000 TL, sayımla bulunan stok 11.400.000 TL’dir. |

    | E2 | İhracat KDV iadesine konu beş alış faturasının muhasebe kayıtlarına dayandırılıp dayandırılmadığını, faturaların
    gerçeği yansıtıp yansıtmadığını ve ilgili mevzuata uygunluğunu araştırmıştır. |

    | E3 | Yıl içinde kesilen ihracat faturalarını incelemiş ve faturası kesildiği hâlde mali tablolara yansıtılmamış bir
    işlem bulunup bulunmadığını araştırmıştır. |

    | E4 | Fabrikadaki bir makinenin gerçekten şirkete ait olup olmadığını sözleşme ve ruhsat kayıtlarıyla incelemiştir. |


    **İstenenler:**


    (a) P1–P5’in her birinin Tasdik Yönetmeliği’nin planlamaya ilişkin maddesinin hangi bendine karşılık geldiğini belirterek
    yeterli olup olmadığını değerlendiriniz. (6 puan)


    (b) E1–E4’ün her birinin kanıt toplamada amaçlanan hususlardan (a, b, c) hangisine yönelik olduğunu belirtiniz; kanıt
    miktarının yeterli olup olmadığının belirlenmesinde göz önünde bulundurulacak ölçütleri yazınız. (7 puan)


    (c) E1 ve E2’de uygulanan denetim tekniklerini adlandırarak tanımlayınız; E1’deki sayım farkını ve bu farkın kayıtlı stoka
    oranını hesaplayınız; farkın nedeni konusunda açıklık bulunmaması halinde başvurulacak tekniği belirtiniz. (7 puan)


    (d) Tasdikin amaçlarını sayınız; şirket yönetiminin iade tasdikini isteme gerekçesinin hangi amaçla örtüştüğünü ve KDV
    iadesine ilişkin işlem ve belgelerin Tasdik Yönetmeliği’ndeki yerini açıklayınız. (5 puan)'
  cozum: '**(a) Planlama (md. 13) (6 puan)**


    Planlama, tasdikin mahiyeti, kapsamı ve zamanlaması dikkate alınarak, çalışmanın doğru yönlendirilmesi, sistemli yürütülmesi
    ve nihai amaca ulaştırılması için yapılır.


    | No | Karşılık gelen bent | Değerlendirme |

    |---|---|---|

    | P1 | md. 13/a (işletme, iç kontrol, üretim süreci, sektör araştırması) | Yeterli |

    | P2 | md. 13/b (mali tablolar, önceki çalışma kağıtları ve tasdik raporları, vergi inceleme raporları) | **Eksik:** önceki
    tasdik raporları ve vergi inceleme raporları da gözden geçirilmelidir |

    | P3 | md. 13/c (muhasebe politikası ve standartlara uygunluk) | **Eksik:** yayınlanan muhasebe standart ve ilkelerine
    uygunluk araştırılmalıdır |

    | P4 | md. 13/d (bilgi alınacak personelin belirlenmesi ve koordinasyon) | **Eksik:** personel belirlenmeli ve aralarında
    koordinasyon sağlanmalıdır |

    | P5 | md. 13/e (yazılı tasdik çalışma planı) | Yeterli |


    **(b) Kanıt toplama (md. 14) (7 puan)**


    Yeminli mali müşavir tasdik konusu ve kapsamıyla ilgili yeterli miktarda güvenilir kanıt toplamak zorundadır. Kanıt toplamanın
    amacı, tasdik konusu ve kapsamıyla sınırlı olmak kaydıyla, fiili durum ve belgeleri esas alarak (a) tüm varlık, kaynak,
    gelir ve giderlerin gerçek olup olmadığını ve bunlara ilişkin işlemlerin doğru kaydedilip kaydedilmediğini, (b) mali tablolara
    yansıtılması gereken bütün işlem ve hesapların bu tablolarda gerçek şekliyle yer alıp almadığını, (c) varlıklara ilişkin
    hakların ve borçlara ilişkin yükümlülüklerin işletmeye ait olup olmadığını araştırmaktır.


    - E1: **(a)** – stokların (varlığın) gerçek olup olmadığı.

    - E2: **(a)** – giderlerin/işlemlerin gerçek olup olmadığı ve doğru kaydedilip kaydedilmediği.

    - E3: **(b)** – yansıtılması gereken işlemin mali tablolarda yer alıp almadığı.

    - E4: **(c)** – varlığa ilişkin hakkın işletmeye ait olup olmadığı.

    - Yeterlilik ölçütleri: kanıtın nitelik ve nicelik açısından önemi, hatalı veya hileli olma riski ve güvenirliği.


    **(c) Denetim teknikleri (md. 15) (7 puan)**


    - E1 – **Sayım ve envanter incelemesi (md. 15/a):** işletme kayıtlarında gösterilen mevcut ve borçların ilgili mevzuat
    hükümlerinde öngörülen belgelerle doğrulanması, fiili ve kaydi envanterlerin yapılması işlemidir.

    - E2 – **Belge incelemesi (md. 15/b):** muhasebe kayıtlarının belgelere dayandırıldığının doğrulanması; ibraz edilen belgelerin
    gerçeği yansıtıp yansıtmadığının ve ilgili mevzuata uygunluğunun araştırılmasıdır.

    - Sayım farkı: 12.000.000 − 11.400.000 = **600.000 TL**; oran: 600.000 / 12.000.000 = **%5**.

    - Fark nedeninin açık olmaması halinde **bilgi toplama (md. 15/c)** tekniği uygulanır: ilgililerden bilgi alınır ve alınan
    bilgiler tutanakla tespit edilir.


    **(d) Tasdikin amacı ve iade tasdiki (5 puan)**


    - Md. 5’e göre tasdikin amaçları: (a) mali tabloların yanıltıcı olmayacak biçimde eksiksiz ve gerçeğe uygun düzenlenmesini
    sağlayarak kamunun istifadesine sunmak; (b) ilgili mevzuat yönünden olan taleplerin karşılanmasında çabukluğu sağlayarak
    hak ve yararları korumak; (c) vergi idaresi ve mükellef ilişkilerinde güveni hâkim kılmaktır.

    - Yönetimin gerekçesi (iade talebinin çabuk sonuçlandırılması, hak ve yararların korunması) **md. 5/b** ile örtüşür.

    - Md. 7/C-b’ye göre iade hakkı doğuran işlem ve belgeler, katma değer vergisi yönünden tasdiki yapılabilecek konular arasında
    sayılmıştır.'
