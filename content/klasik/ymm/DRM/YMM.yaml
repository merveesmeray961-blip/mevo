  soru: '**Olay:** Hesap dönemi takvim yılı olan Orhun Metal Sanayi A.Ş., 2026 hesap dönemi mali tablolarının sürekli denetimi
    kapsayan tam tasdiki için yeminli mali müşavir (YMM) Pelin Karaca ile 12 Ocak 2026''da yazılı sözleşme yapmıştır. Pelin
    Hanım''ın bağlı olduğu oda Kayseri''dedir; şirketin merkezi de Kayseri''dedir. Tasdik raporunun 15 Nisan 2027''de düzenlenmesi
    planlanmaktadır. Pelin Hanım''ın tasdik çalışması sırasında yaptığı işler şunlardır:


    | No | Yapılan iş |

    |---|---|

    | 1 | 14 Temmuz 2026''da şirket yönetimine önceden haber vermeden kasa sayımı ve stok tespiti yapmıştır. |

    | 2 | Satış faturalarının toplamını satış defteri ve KDV beyannamesindeki matrahla karşılaştırmış, yevmiye toplamlarının
    defter-i kebire aktarımını kontrol etmiştir. |

    | 3 | Dört büyük müşteriden alacak bakiyelerini, bu müşterilerin kendi defter ve belgeleri nezdinde araştırarak doğrulamıştır.
    |

    | 4 | Stok devir hızındaki belirgin düşüşe ilişkin olarak şirketin ilgililerinden açıklama almış ve bu açıklamayı tutanağa
    bağlamıştır. |

    | 5 | Aylık brüt kâr marjının trendini önceki yıl verileri ve sektör ortalamasıyla karşılaştırarak sapmaları değerlendirmiştir.
    |

    | 6 | Gider kayıtlarının fatura ve banka dekontlarına dayandırıldığını kontrol etmiştir. |


    Şirket yönetimi, 1 numaralı işlem sırasında "sayımın önceden bildirilmesi gerektiğini" söyleyerek itiraz etmiştir. Alacak
    doğrulaması için müşterilerden ikisinin defter ve belgeleri Konya''dadır. Ağustos 2026''da şirketin muhasebe binasındaki
    yangın nedeniyle şirketin işyerinde inceleme yapılması imkânsız hâle gelmiş; Pelin Hanım, 17–21 Ağustos 2026 arasında
    incelemeyi kendi bürosunda sürdürmüştür.


    **İstenenler:**


    (a) Tasdik Yönetmeliği md. 15''te sayılan denetim tekniklerinden hangisinin 1–6 numaralı işlerin her birine karşılık geldiğini
    belirtiniz. (6 puan)


    (b) Yönetimin 1 numaralı işleme itirazını değerlendiriniz; yıl sonu envanter çalışmalarına ilişkin yetkiyi belirtiniz.
    (5 puan)


    (c) Konya''daki karşıt incelemenin nasıl yürütülebileceğini ve ücretinin hangi esasa göre ödeneceğini açıklayınız; md.
    15''teki tekniklerin sürekli denetimde hangi tarihler arasında hangi aralıklarla uygulanacağını belirtiniz. (5 puan)


    (d) İncelemenin yeri bakımından genel kuralı, Ağustos 2026''daki uygulamanın uygunluğunu ve bu durumda defter ve belgelerin
    YMM''ye hangi şekilde teslim edileceğini açıklayınız; sürekli denetimlerde inceleme yeri bakımından geçerli esası belirtiniz.
    (8 puan)

    '
  cozum: '**(a) Denetim teknikleri (6 puan)** (Tasdik Yön. md. 15)


    | No | Yapılan iş | Teknik |

    |---|---|---|

    | 1 | Kasa sayımı ve stok tespiti | **Sayım ve envanter incelemesi** (a) |

    | 2 | Toplamların defter ve beyanname ile karşılaştırılması, toptan aktarmaların kontrolü | **Karşılaştırma ve puantaj**
    (e) |

    | 3 | Müşteri bakiyelerinin üçüncü şahıslar nezdindeki defter ve belgelerde araştırılması | **Doğrulama** (d) |

    | 4 | İlgililerden açıklama alınması ve tutanağa bağlanması | **Bilgi toplama** (c) |

    | 5 | Kâr marjı trendinin önceki yıl ve sektör ortalamasıyla karşılaştırılması | **Analitik inceleme** (f) |

    | 6 | Gider kayıtlarının belgelere dayandırıldığının kontrolü | **Belge incelemesi** (b) |


    **(b) Haber vermeden sayım (5 puan)**


    Sürekli denetlemeyi kapsayan tasdik hizmetini veren YMM, belirli aralıklarla **haber vermeksizin kasa sayım ve stok tespiti
    yapabilir**, ayrıca **yıl sonu envanter çalışmalarını denetleyebilir** (md. 8/2). Yönetimin itirazı yerinde değildir;
    Pelin Hanım önceden bildirim yapmak zorunda değildir.


    **(c) Karşıt inceleme ve tekniklerin uygulanma zamanı (5 puan)**


    YMM''ler tasdik konularıyla ilgili olarak **karşıt incelemeler** yapabilir; başka oda çevrelerindeki karşıt incelemeler,
    **ücreti Ücret Yönetmeliğindeki usul ve esaslar çerçevesinde ödenmek kaydıyla**, o odaya mensup YMM''lere yaptırılabilir.
    Konya''daki inceleme, Konya''daki odaya mensup bir YMM''ye yaptırılabilir (md. 8/2). Bu teknikler sürekli denetimlerde,
    hesapların niteliği ve hacmi ile tekniklerin özellikleri gözetilerek **YMM''nin belirleyeceği aralıklarla**, **tasdik
    sözleşmesi tarihinden (12.01.2026) tasdik raporu tarihine (15.04.2027) kadar** uygulanır (md. 15/son).


    **(d) İnceleme yeri (8 puan)**


    Tasdik konusu inceleme ve denetleme **ilgilinin iş yerinde** yapılır; iş yerinde yapılmasının **imkânsız olduğu hâllerde**
    inceleme YMM''nin bürosunda yürütülür; bu takdirde ilgili gerekli defter ve belgelerini YMM''ye **bir tutanakla teslim
    eder** (md. 11). Yangın nedeniyle iş yerinde incelemenin imkânsız olması imkânsızlık hâlidir; Pelin Hanım''ın incelemeyi
    bürosunda sürdürmesi uygundur, ancak defter ve belgelerin tutanakla teslimi gerekir. **Sürekli denetlemelerde inceleme
    ve denetlemenin ilgilinin işyerinde yapılması esastır** (md. 11/2); iş yerinde incelemenin imkânsız olduğu hâllerde ise
    büro incelemesi söz konusudur.

    '
