  soru: '**Olay:** Kuzey Dış Ticaret A.Ş., 12.03.2026 tarihinde faaliyete başlamıştır. Şirket, 2026 yılı için YMM Burcu Kalkan
    ile sürekli denetim ve tasdik sözleşmesi yapmıştır. Tarifenin ilgili kalemlerine göre hesaplanan tutarlar şöyledir (tutarlar
    KDV dahildir; başka bir indirim veya ilave söz konusu değildir):


    | Kalem | Tutar (TL) |

    |---|---|

    | Kurumlar vergisi beyannamesi tasdiki için tam bir yıl esasına göre hesaplanan tarife ücreti | 108.000 |

    | Yıllık sürekli denetim ve tasdik ücreti | 240.000 |

    | Kredilere ilişkin tasdik işlemi için hesaplanan nispi ücret | 200.000 |

    | KDV iadesinin tasdiki için tek bir beyanname dönemi esas alınarak hesaplanan tarife ücreti | 15.000 |


    Ocak, Şubat ve Mart 2026 dönemlerine ilişkin KDV iade talepleri aynı sözleşmede ve aynı raporda yer almaktadır.


    **İstenenler:**


    (a) Şirketin faaliyete başlamasından dolayı kurumlar vergisi beyannamesi tasdik ücretini 2026 yılı Asgari Ücret Tarifesi
    notlarına göre hesaplayınız. (6 puan)


    (b) Kredilere ilişkin tasdik işlemi için ödenecek ücreti hesaplayınız; uygulanan indirimin sınırını açıklayınız. (7 puan)


    (c) KDV iade tasdiki için dönem esasını açıklayarak ücreti hesaplayınız. (5 puan)


    (d) Taraflar tarifedeki ücretin altında bir ücret kararlaştırabilir mi, tarifeye ilişkin ücretler KDV bakımından nasıl
    değerlendirilir ve hangi yılın tarifesi esas alınır? Açıklayınız. (5 puan)'
  cozum: '**(a) Kıst ücret (6 puan)**


    Tarife Notu 11’e göre münhasıran yıl içinde işe başlayan mükelleflerde gelir ve kurumlar vergisi beyannamesi tasdik hizmeti
    tarifedeki ücret **ay kesirleri tam sayılarak kıst** uygulanır. Mart ayı kesirli olsa da tam ay sayılır: Mart–Aralık =
    10 ay.


    Ücret = 108.000 × 10 / 12 = **90.000 TL**


    **(b) Kredi tasdiki (7 puan)**


    Tarife Notu 12-C’ye göre YMM ile sürekli denetim ve tasdik sözleşmesi bulunan mükelleflerin kredilere ilişkin tasdik işlemlerinde
    **%50 indirim** uygulanır; uygulanan indirim tutarı yıllık sürekli denetim ve tasdik ücretinin **%25’ini geçemez.**


    - %50 indirim = 200.000 × 50 / 100 = 100.000 TL

    - Sınır = 240.000 × 25 / 100 = 60.000 TL

    - Uygulanacak indirim = en az (100.000; 60.000) = **60.000 TL**

    - Ödenecek ücret = 200.000 – 60.000 = **140.000 TL**


    **(c) KDV iade dönemleri (5 puan)**


