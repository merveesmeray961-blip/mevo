    (a) 1 numaralı olayı fesih, Bakanlığa bildirim, yeni YMM ile sözleşme yapma ve çalışma notlarının devri bakımından Tasdik
    Yönetmeliği’ne göre değerlendiriniz; gün hesabı yapınız. (9 puan)


