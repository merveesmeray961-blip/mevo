  sure_dk: 25
  soru: '**Bora Lojistik A.Ş.** 2026 yılında aşağıdaki eşyaların gümrük işlemlerini takip etmektedir. Hiçbir eşya adli veya
    idari bir takibata konu değildir. Müsteşarlık, kanuni sürelerden farklı bir süre belirlememiştir.


    | No | Durum |

    |---|---|

    | 1 | Denizyolu ile gelen eşya için özet beyan 1/9/2026''da verilmiştir. 10/11/2026''ya (70 gün) kadar eşyaya gümrükçe
    onaylanmış bir işlem veya kullanım tayini için gerekli işlemlere başlanmamıştır. |

    | 2 | Karayolu ile gelen eşya için özet beyan 2/9/2026''da verilmiştir. 20/9/2026''ya (18 gün) kadar işlem başlatılmamıştır.
    |

    | 3 | Aynı karayolu eşyası için 30/9/2026''ya (28 gün) kadar da işlem başlatılmamıştır. |

    | 4 | Yolcu beraberinde getirilip yolcu eşyasına mahsus gümrük ambarına konulan eşya, 4 ay boyunca ambarda bekletilmiş
    ve işleme tabi tutulmamıştır. |

    | 5 | Antrepoda bulunan eşya için gümrükçe onaylanmış bir işlem veya kullanım tayin edilmesine ilişkin beyanname 1/10/2026''da
    tescil edilmiş; 10/11/2026''da (40 gün sonra) işlemler bitirilememiştir. |

    | 6 | Serbest dolaşıma giriş beyannamesi tescil edilmiş; beyan sahibi, süreler içinde beyan edilen rejime tabi tutulması
    için verilmesi gereken belgeleri vermemiştir. |


    **İstenenler:**


    (a) 1, 2 ve 3 numaralı durumlarda sürenin aşılıp aşılmadığını belirtiniz. (6 puan)


    (b) 4 ve 5 numaralı durumlarda sürelerin aşılıp aşılmadığını ve sonucu belirtiniz. (6 puan)


    (c) 6 numaralı durumda gümrük idaresinin izleyeceği işlemi açıklayınız. (4 puan)


    (d) Müsteşarlığın bu süreleri değiştirme yetkisinin sınırını belirtiniz. (4 puan)

    '
  cozum: '**(a) Özet beyan kapsamı eşya (md. 46/2)**


    Özet beyan kapsamındaki eşyaya gümrükçe onaylanmış işlem veya kullanım belirlenerek buna ilişkin işlemlerin, denizyolu
    ile gelen eşya için özet beyan verildiği tarihten itibaren **kırkbeş gün**, diğer yolla gelen eşya için **yirmi gün**
    içinde tamamlanması gerekir.


    - Durum 1: Denizyolu, 70 gün > 45 gün: **süre aşılmıştır**.

    - Durum 2: Karayolu, 18 gün < 20 gün: süre **aşılmamıştır**.

    - Durum 3: Karayolu, 28 gün > 20 gün: **süre aşılmıştır**.


    **(b) Yolcu eşyası ve antrepo**


    - Durum 4: Yolcu eşyasına mahsus gümrük ambarında kalabileceği süre üç aydır (md. 48/2); 4 ay > 3 ay, **süre aşılmıştır**.

    - Durum 5: Antrepodaki eşya için beyanname tescilinden itibaren gümrük işlemleri otuz gün içinde bitirilmelidir (md. 70/2);
    40 gün > 30 gün, **süre aşılmıştır**.


    Süresi içinde işlem tayini için gerekli işlemlere başlanmamış eşya, herhangi bir adli veya idari takibata konu olmaması
    hâlinde 177 ila 180. madde hükümlerine göre **tasfiye edilir** (md. 50/1). Antrepodaki eşyada süre içinde işlemler bitirilemezse
    md. 70/1 hükümleri uygulanır ve eşya 177-180. madde hükümlerine göre tasfiye edilir (md. 70/2; md. 177).


    **(c) Durum 6**


