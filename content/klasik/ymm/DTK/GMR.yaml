    kıymeti 200.000 TL; ambalaj tarifede kıymet üzerinden vergiye tabidir. |


    **İstenenler:**


    (a) A, B ve C kalemleri için vergiye esas ağırlığı ve vergi tutarlarını hesaplayınız. (6 puan)


    (b) D kalemi için vergiye esas ağırlıkları ve toplam vergiyi hesaplayınız. (6 puan)


    (c) E kaleminde ambalajın nasıl beyan edileceğini belirtiniz; ambalajın gümrük vergisi oranı %8, içindeki eşyanın oranı
    %10 ise ve ambalajın oranı %15, eşyanın oranı %10 ise ambalajın vergisini ayrı ayrı hesaplayınız. (8 puan)

