    eşyanın bu statüsünü gösteren belgedir. A.TR ile Türkiye''ye gümrüksüz giriş mümkündür.


    Ancak A.TR tercihli menşe belgesi değildir; eşyanın AB veya Türkiye menşeli olduğunu değil, AB''deki serbest dolaşım statüsünü
    belgeler.


    **(b) Vietnam menşeli kumaşın değerlendirilmesi**


    1. Menşe: Eşyanın Almanya''dan sevk edilmesi menşe kazandırmaz; menşe üretim yerine göre belirlenir (md. 20).

    2. Tercihli tarife: Türkiye''nin Vietnam ile yürürlükte bir STA''sı bulunmamaktadır; tercihli tarife uygulanamaz.

    3. Sonuç: Vietnam menşeli kumaş A.TR belgesi taşısa dahi normal gümrük vergisine tabidir; serbest dolaşım statüsü tek
    başına gümrüksüz girişe yetmez.

    '
