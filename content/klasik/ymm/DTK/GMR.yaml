  soru: "Gümrük müşaviri **Alfa Gümrük Müşavirliği Ltd. Şti.** (Türkiye'de yerleşik) 2026 yılında aşağıdaki işlemleri yürütmüştür:\n\
    \n1. **Beta A.Ş.** adına ve hesabına, doğrudan temsil yoluyla ve temsil yetki belgesini ibraz ederek serbest dolaşıma\
    \ giriş\n   beyannamesi vermiştir.\n2. Kendi adına ancak **Gama Ltd.** hesabına, dolaylı temsil yoluyla ve yetki belgesini\
    \ ibraz ederek serbest dolaşıma giriş\n   beyannamesi vermiştir. Gama'nın verdiği faturadaki kıymet gerçeğin altındadır.\
    \ Alfa'nın bunu bilmediği ve mesleği icabı\n   ve mutat olarak bilmesinin de gerekmediği tespit edilmiştir. Faturayı Alfa'ya\
    \ veren Gama'nın satın alma müdürü kıymetin\n   yanlış olduğunu bilmektedir. Eşyanın CIF kıymeti 600.000 TL'dir; bu eşya\
    \ için ödenmesi gereken gümrük vergisi 60.000 TL ve\n   ilave gümrük vergisi 30.000 TL olup, bu sorunun amaçları bakımından\
    \ gümrük vergileri yalnız bu iki vergiden oluşmaktadır.\n3. **Delta A.Ş.** adına hareket ettiğini beyan ederek, ancak\
    \ geçerli bir temsil yetki belgesi bulunmaksızın beyanname vermiştir.\n4. Yurt dışında yerleşik **Epsilon GmbH**, Türkiye'ye\
    \ düzenli ithalatı için Türkiye'de yerleşik olmayan bir Alman firmasını\n   temsilci tayin etmek istemektedir; işlemler\
    \ transit taşımacılık veya arızi beyan niteliğinde değildir.\n5. **Theta A.Ş.**, gümrüğe sunulmuş ve serbest dolaşımda\
    \ olmayan eşyası için şu seçenekleri değerlendirmektedir:\n   (i) antrepo rejimine tabi tutmak, (ii) serbest bölgeye koymak,\
    \ (iii) yeniden ihraç etmek, (iv) gümrüğe terk etmek,\n   (v) imha ettirmek.\n\n2026 yılı için md. 241/1'deki usulsüzlük\
    \ cezası 1.494,00 TL'dir.\n\n**İstenenler:**\n\n(a) (1) ve (2) numaralı beyannamelerde temsil türlerini, beyan sahibini\
    \ ve gümrük yükümlülüğünden sorumlu olan kişileri;\nAlfa'nın, Gama'nın ve Gama'nın satın alma müdürünün sorumluluğunu\
    \ açıklayınız. (9 puan)\n\n(b) (3) numaralı işlemin hukuki sonucunu ve verilecek cezayı; (4) numaralı talebin kabul edilip\
    \ edilemeyeceğini açıklayınız.\n(6 puan)\n\n(c) (2) numaralı beyanname kapsamındaki eşyanın gümrüklenmiş değerini hesaplayınız.\
    \ Eşyanın ithalinin genel düzenleyici idari\nişlemle yasaklanmış olduğu tespit edilseydi uygulanacak para cezasını; aykırılık\
    \ idarenin tespitinden önce beyan sahibince\nbildirilseydi cezanın tutarını hesaplayınız. (5 puan)\n\n(d) (5) numaralı\
    \ seçeneklerden hangilerinin \"eşyanın gümrükçe onaylanmış bir işlem veya kullanıma tabi tutulması\",\nhangisinin \"gümrük\
    \ rejimi\" olduğunu belirtiniz; Kanunda sayılan gümrük rejimlerini sayınız. (5 puan)\n"
  cozum: "**(a) Temsil ve yükümlüler**\n\n- Temsil doğrudan veya dolaylı olabilir: doğrudan temsilde temsilci **başkasının\
    \ adına ve hesabına**, dolaylı temsilde **kendi\n  adına ancak başkasının hesabına** hareket eder; temsilci bunu beyan\
    \ etmek ve yetki belgesini ibraz etmek zorundadır\n  (md. 5/3). Beyan sahibi, kendi adına beyanda bulunan veya adına beyanda\
    \ bulunulan kişidir (md. 3/17).\n- **(1):** Doğrudan temsil; beyan sahibi **Beta**dır. İthalatta yükümlü beyan sahibidir\
    \ (md. 181/2) → Beta yükümlüdür; Alfa\n  yükümlü değildir.\n- **(2):** Dolaylı temsil; Alfa kendi adına beyanda bulunduğundan\
