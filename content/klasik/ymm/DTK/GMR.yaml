- id: YMM-DTK-GMR-K001
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - gümrük vergisi ve gümrük kıymeti
  - gümrük borcu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(P) A.Ş., ilişkisiz bir yabancı satıcıdan bir üretim hattı satın almış ve 10.03.2026 tarihinde serbest dolaşıma giriş
    beyannamesini tescil ettirmiştir. İşleme ilişkin veriler aşağıdadır (tüm giderler faturada fiyattan ayrı gösterilmiştir):


    | Kalem | Tutar |

    |---|---|

    | Mal bedeli (satıcı ülkede yüklemeye kadar; navlun ve sigorta hariç) | 120.000 USD |

    | Mersin Limanı''na kadar navlun | 8.000 USD |

    | Mersin Limanı''na kadar sigorta | 2.000 USD |

    | Alıcının üstlendiği, satıcının aracısına ödenen satış komisyonu | 3.000 USD |

    | İthalatçının yurt dışındaki satın alma temsilcisine ödenen komisyon | 1.500 USD |

    | Satış koşulu olarak satıcıya ödenecek, fiyata dahil olmayan lisans ücreti (royalti) | 6.000 USD |

    | Hattın Türkiye''de çoğaltılması hakkı için yapılan ödeme | 4.000 USD |

    | Yazılı finansman anlaşmasına dayanan, piyasa oranını aşmayan vade faizi | 2.000 USD |

    | Mersin Limanı''ndan fabrikaya nakliye | 2.500 USD |


    Diğer bilgiler: TCMB döviz satış kuru tescil tarihinde 1 USD = 40 TL, ödeme tarihinde 1 USD = 41 TL''dir. Gümrük vergisi
    oranı %8''dir; başka ithalat vergisi, resim veya harç yoktur. Beyannamenin tescilinden önce yapılan, gümrük kıymetine
    dahil olmayan ve hiçbir aşamada KDV''ye tabi tutulmamış 20.000 TL diğer gider vardır. KDV oranı %20''dir.


    **İstenenler:**


    (a) 4458 sayılı Gümrük Kanunu''na göre gümrük kıymetini TL olarak hesaplayınız; kıymete dahil edilen ve edilmeyen her
    kalemin dayanağını belirtiniz. (9 puan)


    (b) Ödenecek gümrük vergisini, ithalde KDV matrahını ve KDV''yi hesaplayınız. (7 puan)


    (c) Şirketin royalti ödemesini beyan etmediğinin 2027 yılında yapılan sonradan kontrolde anlaşıldığını varsayınız. Noksan
    gümrük vergisini hesaplayınız; idarenin bu farkı en geç hangi tarihe kadar tebliğ etmesi gerektiğini, uygulanacak faizin
    hangi dönem için ve hangi oranda hesaplanacağını ve tebliğden sonraki ödeme süresini açıklayınız. (9 puan)

    '
  cozum: '**(a) Gümrük kıymeti**


    | Kalem | USD | Dayanak |

    |---|---|---|

    | Mal bedeli | 120.000 | md. 24/1 (fiilen ödenen fiyat) |

    | Navlun (giriş limanına kadar) | 8.000 | md. 27/1-(e) |

    | Sigorta (giriş limanına kadar) | 2.000 | md. 27/1-(e) |

    | Satış komisyonu (alıcı üstlenmiş) | 3.000 | md. 27/1-(a)-(i) |

    | Royalti (satış koşulu) | 6.000 | md. 27/1-(c) |

    | **Toplam** | **139.000** | |


    Dahil edilmeyenler: satın alma komisyonu (md. 27/4, 28/e); Türkiye''de çoğaltma hakkı ödemesi (md. 27/5-a, 28/d); yazılı
    finansman anlaşmasına dayalı faiz (md. 28/c); giriş limanından sonraki nakliye (md. 28/a).


    Kur: Gümrük yükümlülüğü beyannamenin tescil tarihinde başlar (md. 181/1); bu tarihteki TCMB döviz satış kuru kullanılır
    (md. 30). Ödeme tarihindeki kur kullanılmaz.


    Gümrük kıymeti = 139.000 × 40 = **5.560.000 TL**


    **(b) Gümrük vergisi ve KDV**


    - Gümrük vergisi = 5.560.000 × %8 = **444.800 TL**

    - KDV matrahı (KDVK md. 21): gümrük kıymeti 5.560.000 + ithalat sırasında ödenen vergi 444.800 + tescile kadar yapılan
    ve vergilendirilmeyen gider 20.000 = **6.024.800 TL**

    - KDV = 6.024.800 × %20 = **1.204.960 TL**


    **(c) Sonradan kontrol**


    - Noksan gümrük kıymeti = 6.000 × 40 = 240.000 TL (kur yine tescil tarihindeki kurdur); noksan gümrük vergisi = 240.000
    × %8 = **19.200 TL**. (Noksan KDV hakkında KDVK md. 48 uyarınca Gümrük Kanunu esaslarına göre işlem yapılır.)

    - Tebliğ süresi: Noksan alınan vergilerin tebliği, gümrük yükümlülüğünün doğduğu tarihten (10.03.2026) itibaren üç yıl
    içinde, yani en geç **10.03.2029**''a kadar yapılmalıdır (md. 197/2). Olayla ilgili dava açılması zamanaşımını durdurur.

    - Faiz: Hatalı beyan sonucu noksan alınan vergiye, yükümlülüğün başladığı tarih (10.03.2026) ile vergilerin kesinleştiği
    tarih arasındaki süre için 6183 sayılı Kanun''un 51. maddesine göre belirlenen gecikme zammı oranında faiz uygulanır;
    kesinleşmeden önce ödenirse faiz ödeme tarihine kadar hesaplanır (md. 193/3).

    - Ödeme süresi: Tebliğden itibaren 15 gün; süre bitmeden yazılı istem ve teminat ile 30 gün daha uzatılabilir, uzatılan
    süre için 6183 sayılı Kanun md. 48''e göre tecil faizi alınır (md. 198/1). Gümrük idaresine itiraz ödeme süresini keser;
    süre karar tebliğinden itibaren yeniden başlar (md. 198/2).

    '
  puanlama:
  - olcut: (a) Dahil edilen beş kalemin doğru belirlenmesi ve dayanakları
    puan: 4
  - olcut: (a) Dahil edilmeyen dört kalemin doğru ayrılması ve dayanakları
