- id: YMM-DTK-GMR-K018
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - kararlar bilgi ve süreler
  - lehe kararın iptali
  - gümrük cezaları
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: '**Yıldız Boya Sanayi A.Ş.**, gümrük mevzuatının uygulanmasına ilişkin bir karar verilmesi için ilgili gümrük idaresine
    yazılı başvuruda bulunmuştur. Gelişmeler şöyledir:


    | Tarih | Gelişme |

    |---|---|

    | 3/2/2026 | Başvuru gümrük idaresine ulaşmıştır. |

    | 19/2/2026 | İdare, inceleme için ek süreye ihtiyaç duyduğunu, gerekçeleriyle birlikte şirkete yazıyla bildirmiştir.
    |

    | 20/3/2026 | Şirket lehine olan karar tebliğ edilmiştir. |

    | 15/9/2026 | İdare, karara esas belgenin yanlış bilgi içerdiğini, şirketin bu yanlışlığı bildiğini ve doğru bilgiyle
    karar verilmesinin mümkün olmayacağını tespit etmiştir. |


    **İstenenler:**


    (a) İdarenin 30 günlük karar süresini aşmasının hukuka uygun olup olmadığını açıklayınız. (5 puan)


    (b) 15/9/2026''daki tespit karşısında idarenin lehe kararı iptal edip edemeyeceğini, aranan şartları göstererek değerlendiriniz.
    (6 puan)


    (c) Şirketin yanlışlığı bilmediği ve bilmesinin de gerekmediği, ancak karara esas teşkil eden bir koşulun gerçekleşmediği
    tespit edilmiş olsaydı hangi hüküm uygulanırdı ve iptalin yürürlük tarihi ne olurdu? (5 puan)


    (d) Karardan önce idarenin şirkete yazıyla yanlış izahat vermiş olması, sonradan çıkan bir idari para cezasına nasıl etki
    ederdi? (4 puan)

    '
  cozum: '**(a) Karar süresi**


    Gümrük idareleri başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde karar verir (md. 6/2). Bu süreye uyulamıyorsa
    süre aşılabilir; ancak idare, sürenin dolmasından önce başvuru sahibine süre aşımını haklı kılan gerekçeleri ve karar
    için gerekli gördüğü ek süreyi bildirmek zorundadır. İdare 19/2/2026''da yani 30 günlük sürenin dolmasından önce yazıyla
    bildirim yaptığından süre aşımı hukuka uygundur.


    **(b) Lehe kararın iptali (md. 7/1)**


    Lehe karar ancak şu üç hâlin bir arada bulunması durumunda iptal edilir: (1) kararın yanlış veya eksik bilgiye dayanılarak
    verilmesi, (2) başvuru sahibinin bu yanlışlığı veya eksikliği bilmesi ya da bilmesi gerekmesi, (3) kararın doğru veya
    tam bilgiyle verilmesinin mümkün olmayacağının tespiti. Vakada üç şart da sağlandığından idare kararı **iptal edebilir
    (iptal edilir)**. İptal kararı muhatabına tebliğ edilir (md. 7/3).


    **(c) Şartların bir arada bulunmaması**


    Şirketin yanlışlığı bilmemesi ve bilmesinin gerekmemesi nedeniyle md. 7/1 şartları bir arada gerçekleşmez; fakat karara
    esas teşkil eden koşulun gerçekleşmemiş veya gerçekleşemez olması hâlinde karar md. 7/2-a uyarınca **değiştirilebilir
    veya iptal edilebilir**. Md. 7/2''ye göre verilen değiştirme/iptal kararı **tebliğ tarihinden itibaren** yürürlüğe girer;
    md. 7/1''e göre iptal ise iptal kararının verildiği tarihten itibaren yürürlüğe girer (md. 7/4).


    **(d) Yanlış izahat**


    Gümrük idaresi tarafından yükümlüye yazı ile yanlış izahat verilmiş olması hâlinde 10. Kısımdaki hükümlere göre idari
    para cezası ve faiz uygulanmaz (md. 231/5).


    Püf noktaları: (1) Md. 7/1''de üç şart "bir arada" aranır, md. 7/2''de ise tek bir koşulun gerçekleşmemesi yeter ve idarenin
    takdiri vardır. (2) İptal kararının yürürlüğü 1. fıkra için karar tarihi, 2. fıkra için tebliğ tarihidir.

    '
