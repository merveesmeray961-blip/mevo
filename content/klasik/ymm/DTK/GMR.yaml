- id: YMM-DTK-GMR-K026
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - gümrük cezaları
  - gümrük vergisi ve beyan farkları
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: '**Doğan Metal Sanayi A.Ş.**''nin 2026 yılında tescil edilen dört beyannamesi için gümrük idaresi teslimden sonra
    kontrol sonucunda aşağıdaki tespitleri yapmıştır:


    | Beyanname | Tespit |

    |---|---|

    | B1 | Serbest dolaşıma giriş. Tarife pozisyonu yanlış beyan edilmiştir. Beyana göre hesaplanan ithalat vergisi 200.000
    TL, doğru pozisyona göre alınması gereken 230.000 TL''dir. |

    | B2 | Serbest dolaşıma giriş. Ağırlık eksik beyan edilmiştir. Beyana göre hesaplanan vergi 600.000 TL, muayene sonucuna
    göre alınması gereken vergi 618.000 TL''dir. |

    | B3 | Dahilde işleme rejimi. Tarife pozisyonu yanlış beyan edilmiş; beyana göre hesaplanan vergi 300.000 TL, doğru vergi
    340.000 TL''dir. |

    | B4 | Serbest dolaşıma giriş. İthalatçı, genel yönetim kapsamındaki bir kamu idaresidir (B4 başka bir ithalatçıya ait
    olup şirketle ilgisi yoktur; yalnızca sonucu değerlendiriniz). Tarife pozisyonu yanlış beyan edilmiş, fark %5''i aşmaktadır.
    |


    **İstenenler:**


    (a) B1 için ithalat vergisi farkını ve ayrıca uygulanacak idari para cezasını hesaplayınız. (5 puan)


    (b) B2 için ceza uygulanıp uygulanmayacağını gerekçesiyle belirtiniz; vergi farkı ne olacaktır? (4 puan)


    (c) B3 için ceza tutarını hesaplayınız; ayrıca B1''deki aykırılık idare tespit etmeden önce şirket tarafından bildirilmiş
    olsaydı cezanın tutarını bulunuz. (6 puan)


    (d) B4''te md. 234''teki cezaların uygulanıp uygulanmayacağını belirtiniz; hangi madde hükmüne göre işlem yapılır? (5
    puan)

    '
  cozum: '**(a) B1**


    Vergi farkı = 230.000 - 200.000 = 30.000 TL. Fark beyana göre hesaplanan vergiye oranla 30.000 / 200.000 = %15 olup %5''i
    aştığından, ithalat vergilerinden ayrı olarak farkın üç katı para cezası alınır (md. 234/1-a): 30.000 x 3 = **90.000 TL**.
    Vergi farkı (30.000 TL) ayrıca tahsil edilir.


    **(b) B2**


    Vergi farkı = 618.000 - 600.000 = 18.000 TL; oran = 18.000 / 600.000 = %3. Fark %5''i aşmadığından md. 234/1-a''daki ceza
    koşulu gerçekleşmez; **ceza uygulanmaz**, yalnızca 18.000 TL vergi farkı tahsil edilir.


    **(c) B3 ve kendiliğinden bildirim**


    - B3: Dahilde işleme rejiminde aynı farklılığın tespiti hâlinde vergi farkının yarısı tutarında idari para cezası verilir
    (md. 234/2). Fark = 340.000 - 300.000 = 40.000 TL; ceza = 40.000 / 2 = **20.000 TL**.

    - B1 kendiliğinden bildirilseydi, idare tespitinden önce bildirim hâlinde cezalar yüzde on nisbetinde uygulanır (md. 234/3):
    90.000 x %10 = **9.000 TL**.


    **(d) B4**


    Genel yönetim kapsamındaki kamu idareleri için md. 234''teki cezalara ilişkin hükümler uygulanmaz; bu hâllerde md. 241''in
    birinci fıkra hükmüne göre (usulsüzlük cezası) işlem yapılır (md. 234/4).


    Püf noktaları: (1) %5 eşiği aşılmadıkça üç kat ceza yoktur. (2) Rejime göre ceza değişir: serbest dolaşımda üç kat, ekonomik
    etkili rejimlerde yarısı. (3) Kendiliğinden bildirimde ceza %10''a iner.

    '
  puanlama:
  - olcut: (a) Vergi farkı, %5 eşiğinin aşıldığının gösterilmesi ve üç kat ceza
    puan: 5
  - olcut: (b) %3 oran nedeniyle ceza uygulanmaması ve vergi farkının tahsili
    puan: 4
  - olcut: (c) B3 için yarısı oranında ceza hesabı (md. 234/2)
    puan: 3
  - olcut: (c) Kendiliğinden bildirimde %10 ceza hesabı (md. 234/3)
    puan: 3
  - olcut: (d) Kamu idareleri için cezaların uygulanmaması ve md. 241/1'e göre işlem
    puan: 5
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 234/1-a
    alinti: a) 15 inci maddede belirtilen Gümrük Tarifesini oluşturan unsurlarda veya vergilendirmeye esas olan sayı, baş,
      ağırlık gibi ölçülerinde aykırılık görüldüğü ve beyana göre hesaplanan ithalat vergileri ile muayene sonuçlarına göre
      alınması gereken ithalat vergileri arasındaki fark %5’i aştığı takdirde, ithalat vergilerinden ayrı olarak bu farkın
      üç katı para cezası alınır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 234/2
    alinti: Dahilde işleme rejimi, gümrük kontrolü altında işleme rejimi ve tam muafiyet suretiyle geçici ithalat rejimi hükümlerine
      tabi eşyaya ilişkin olarak yapılan beyan ile muayene ve denetleme veya teslimden sonra kontrol sonucunda; birinci fıkrada
      belirtilen farklılıkların tespiti durumunda vergi farkının yarısı tutarında idari para cezası verilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 234/3
    alinti: Yukarıda belirtilen aykırılıkların gümrük idaresince tespit edilmesinden önce beyan sahibince bildirilmesi durumunda
      söz konusu cezalar yüzde on nisbetinde uygulanır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 234/4
    alinti: 4. Genel yönetim kapsamındaki kamu idareleri için yukarıda belirtilen cezalara ilişkin hükümler uygulanmaz. Bu
      gibi hallerde, 241 inci maddenin birinci fıkra hükmüne göre işlem yapılır.
