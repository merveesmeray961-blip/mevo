  soru: 'Bir ihracatçı, Türkiye menşeli elektronik ürünlerini EUR.1 dolaşım sertifikasıyla ihraç etmektedir. İthalatçı ülkedeki
    gümrük idaresi menşe doğrulama prosedürü başlatmıştır.


    **İstenenler:**


    (a) EUR.1 dolaşım sertifikasının işlevini ve düzenlenmesi için gereken koşulları açıklayınız. (10 puan)


    (b) Menşe doğrulama prosedürünün nasıl işlediğini ve ihracatçının hatalı menşe beyanında bulunmasının hukuki sonuçlarını
    açıklayınız. (15 puan)

    '
  cozum: '**(a) EUR.1 belgesi**


    EUR.1, Türkiye''nin taraf olduğu STA''lar kapsamındaki ticarette tercihli menşei belgeleyen resmi belgedir.


    Düzenleme koşulları:

    - Eşya ilgili STA''nın menşe protokolü kurallarını (tamamen elde etme veya yeterli işlem) karşılamalıdır.

    - İhracatçı, gümrük idaresine menşe belgelerini sunarak sertifika talep eder.

    - Gümrük idaresi inceleyerek onaylar (imzalar ve mühürler).

    - İhracat beyannamesine eklenerek ibraz edilir.


    **(b) Doğrulama prosedürü ve hukuki sonuçlar**


    Prosedür:

    1. İthalatçı ülke gümrük idaresi doğrulama talebi gönderir.

    2. Türk gümrük idaresi ilgili STA''da belirlenen süre içinde (genellikle 6 ay) yanıt verir.

    3. Yanıt gelmezse veya doğrulanamadıysa tercihli tarife reddedilir.


    Hatalı beyanın sonuçları:

    - İthalatçı ülkede: tarife farkı, gecikme faizi ve ceza uygulanır.

    - Türkiye''de: md. 234 uyarınca idari para cezası; kasıt ispatlanırsa cezai sorumluluk da doğabilir.

    - EUR.1 iptal edilebilir; onaylı ihracatçı statüsü askıya alınabilir.

    '
  puanlama:
  - olcut: (a) EUR.1'in tercihli menşe belgesi olduğunun ve STA kapsamındaki işlevinin açıklanması
    puan: 4
  - olcut: (a) Düzenleme koşullarının (menşe protokolü uyumu, gümrük idaresi onayı) sayılması
    puan: 6
  - olcut: (b) Doğrulama prosedürünün adımlarının (talep, süre, ret) açıklanması
    puan: 7
  - olcut: (b) Her iki ülkedeki yaptırımların belirtilmesi
    puan: 5
  - olcut: (b) EUR.1 iptali ve onaylı ihracatçı riski
    puan: 3
