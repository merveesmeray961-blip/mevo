    200.000 + 6.000 + 3.000 + 9.000 + 12.000 = 230.000 USD. Kıymet Türk Lirası olarak beyan edilir; yabancı para, yükümlülüğün
    başladığı tarihteki TCMB döviz satış kuruyla çevrilir (md. 30): 230.000 x 42 = **9.660.000 TL**.


    **(c) İdare tespiti hâlinde**


    Eksik beyan edilen royalti = 12.000 x 42 = 504.000 TL; vergi farkı = 504.000 x %10 = **50.400 TL**. Beyan edilen kıymet
    md. 23-31 uyarınca belirlenen kıymete göre noksan olduğundan, vergi farkının üç katı idari para cezası verilir (md. 234/1-b):
    50.400 x 3 = **151.200 TL**. Vergi farkı ayrıca tahsil edilir.


    **(d) Kendiliğinden bildirim ve maddi hesap hatası**


    - İdare tespit etmeden önce beyan sahibince bildirilirse ceza %10 oranında uygulanır (md. 234/3): 151.200 x %10 = **15.120
    TL**.

    - Noksanlık maddi hesap hatasından doğmuşsa ceza vergi farkının yarısıdır (md. 234/1-c): 50.400 / 2 = **25.200 TL**.


    Püf noktaları: (1) Satın alma komisyonu kıymete girmez, satış komisyonu girer; ikisini karıştırmayın. (2) Giriş kapısına
    kadar yapılan nakliye girer, girişten sonrası girmez. (3) Cezanın "üç kat" olduğunu, kendiliğinden bildirimde ise bunun
    %10''a indiğini unutmayın.

    '
