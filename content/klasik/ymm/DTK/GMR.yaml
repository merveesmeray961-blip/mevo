    alınıp alınamayacağını incelemektedir:


    | No | Durum |

    |---|---|

    | 1 | Sözleşme, alıcının eşyayı yalnızca Türkiye içinde ve komşu ülkelerde yeniden satabileceğini düzenlemektedir (coğrafi
    sınırlama); bu sınırlama eşyanın kıymetini önemli ölçüde etkilememektedir. |

    | 2 | Satış, alıcının satıcıdan ayrıca belirli miktarda başka mal satın alması koşuluna bağlıdır ve bu koşulun eşyanın
    kıymetine etkisi hesaplanamamaktadır. |

    | 3 | Alıcının eşyayı yeniden satmasından elde ettiği hasılanın bir bölümü doğrudan satıcıya intikal etmektedir; bu bölüm
    fiilen ödenen fiyata dahil değildir. |

    | 4 | Alıcı ve satıcı ilişkilidir; ancak satışa ilişkin koşullar incelenmiş ve ilişkinin fiyatı etkilemediği belirlenmiştir.
    |


    Ayrıca, idare 24 ve 25. madde hükümlerine göre kıymeti belirleyememiş, bir başka dosyada kıymeti md. 26''ya göre belirlemek
    zorunda kalmıştır. İdare aşağıdaki yöntemlerin kullanılıp kullanılamayacağını araştırmaktadır: (I) Türkiye''de üretilen
