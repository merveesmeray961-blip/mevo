  soru: '**Tuna Otomotiv Yan Sanayi A.Ş.** ile ilgili işlemler aşağıdadır:


    **İşlem 1.** Bir parti eşya için serbest dolaşıma giriş beyannamesi 5/3/2026''da tescil edilmiştir. Eşyanın gümrük kıymeti
    1.000.000 TL''dir. Tescil tarihinde yürürlükte olan ithalat vergisi oranı %10''dur. 20/3/2026''da yapılan düzenlemeyle
    oran %6''ya indirilmiştir (tarımsal mali yük söz konusu değildir). Gümrük vergileri henüz ödenmemiş ve teminata bağlanmamıştır.
    Şirket lehe oranın uygulanmasını talep etmiştir.


    **İşlem 2.** İşlem 1''deki durumda, gümrük işlemlerinin tamamlanamama nedeninin şirketin zorunlu belgeyi ibraz etmemesi
    olduğu varsayılsaydı (alternatif senaryo) sonuç ne olurdu?


    **İşlem 3.** Serbest dolaşımda bulunan bir makine 4/8/2024''te Türkiye''den ihraç edilmiş, ayniyeti değişmeden 12/9/2026''da
    yeniden serbest dolaşıma giriş için beyan edilmiştir. Şirket ithalat vergilerinden muafiyet talep etmektedir.


    **İşlem 4.** Başka bir makine 20/1/2023''te ihraç edilmiş ve 15/1/2027''de geri getirilmiştir; ancak makinenin ayniyeti
    değişmiştir.


    **İstenenler:**


    (a) İşlem 1''de gümrük vergilerinin hangi oran üzerinden hesaplanacağını ve vergi tutarını gerekçesiyle belirtiniz. (5
    puan)


    (b) İşlem 2''deki varsayımın işlem 1''deki talebe etkisini açıklayınız ve bu hâlde vergi tutarını hesaplayınız. (5 puan)


    (c) İşlem 3''te muafiyet koşullarını ve sonucu açıklayınız. (5 puan)


    (d) İşlem 4''te muafiyetin uygulanıp uygulanmayacağını, süre ve ayniyet yönlerinden değerlendiriniz. (5 puan)

    '
  cozum: '**(a) Lehe oran (md. 15/1, md. 75/1)**


    Gümrük vergileri, gümrük yükümlülüğünün başladığı tarihte (beyannamenin tescil tarihi, md. 181/1) yürürlükte olan tarifeye
    göre hesaplanır (md. 15/1). Ancak beyan sahibi, tarımsal mali yükler dışında kalan ithalat vergilerinin oranlarının beyannamenin
    tescil tarihinden sonra, fakat eşyaya ilişkin gümrük vergilerinin ödenmesinden veya teminata bağlanmasından önce indirilmesi
    hâlinde lehine olan oranın uygulanmasını isteyebilir (md. 75/1). Bu koşullar vakada sağlandığından oran **%6**; vergi
    = 1.000.000 x %6 = **60.000 TL** (talep edilmezse %10 -> 100.000 TL).


    **(b) Beyan sahibinden kaynaklanan nedenler (md. 75/2)**


    Beyan sahibinden kaynaklanan nedenlerle gümrük işlemlerinin tamamlanamaması hâlinde md. 75/1 uygulanmaz. Bu durumda tescil
    tarihindeki oran geçerlidir: 1.000.000 x %10 = **100.000 TL**.


    **(c) Geri gelen eşya (md. 168/1, md. 169)**


    Serbest dolaşımdaki eşya ihraç edildikten sonra üç yıl içinde yeniden serbest dolaşıma girerse ve beyan sahibinin talebi
    üzerine ithalat vergilerinden muaf tutulur (md. 168/1). Muafiyet, eşyanın ihracı sırasındaki ayniyeti değişmeden yeniden
    ithali hâlinde tanınır (md. 169). İhraç 4/8/2024; üç yıl 4/8/2027''de dolar; 12/9/2026''daki giriş süre içindedir ve ayniyet
    korunmuştur: **muafiyet uygulanır**.


    **(d) Süre ve ayniyet**


    İşlem 4''te ihraç 20/1/2023; üç yıllık süre 20/1/2026''da dolmuştur ve 15/1/2027''deki giriş süre dışındadır (beklenmeyen
    hal veya mücbir sebep yoksa süre uzatılamaz). Ayrıca ayniyet değişmiştir (md. 169). Her iki koşul da sağlanmadığından
    **muafiyet uygulanmaz**; makine normal ithalat vergilerine tabidir.


    Püf noktaları: (1) Lehe oran için vergi ödenmemiş veya teminata bağlanmamış olmalıdır; gecikme sizin kusurunuzdansa hak
    kaybolur. (2) Geri gelen eşyada üç yıl ve ayniyet birlikte aranır; üç yıllık süre mücbir sebeple uzatılabilir.

    '
