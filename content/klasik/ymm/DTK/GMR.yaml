    adet pompa ithal etmiş; 10/3/2026''da tescil edilen beyannamede satış bedeli adet başına 30 USD (toplam 30.000 USD) olarak
    beyan edilmiştir. Gümrük idaresi, alıcı ile satıcı arasındaki ilişkinin fiyatı etkilediği kanısına varmıştır. Ek bilgiler:


    - Aynı veya yakın tarihte Türkiye''ye ihraç amacıyla satılmış **aynı** eşya bulunmamaktadır.

    - Aynı dönemde, birbiriyle ilişkisi olmayan taraflar arasında Türkiye''ye ihraç amacıyla satılan **benzer** eşyanın satış
    bedeli adet başına 48 USD''dir; ticari düzey, miktar ve md. 27 unsurları bakımından düzeltme gerektiren bir fark yoktur.

    - Türkiye''ye gümrük yükümlülüğünün başladığı tarihte TCMB döviz satış kuru 1 USD = 42 TL''dir.

    - Beyan sahibi, satış bedelinin aynı dönemdeki emsal kıymetlerden birine çok yakın olduğunu ispat edememiştir.


    **İstenenler:**


    (a) Alıcı ile satıcı arasındaki ilişkinin satış bedelinin reddi bakımından anlamını ve idarenin izleyeceği usulü açıklayınız.
