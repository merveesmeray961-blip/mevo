    | 2 | Gürcistan | Ülkede kayıtlı ve bandırasını taşıyan araçlarca, herhangi bir ülkenin kara suları dışındaki denizlerden
    çıkartılan av ürünleri tümüyle o ülkede elde edilmiş sayılır (md. 18/2-f). |

