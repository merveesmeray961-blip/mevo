    \ itiraz **süresindedir**; idareye 08.05.2026'da ulaşması sonucu değiştirmez.\n- İtiraz **otuz gün** içinde karara bağlanarak\
    \ tebliğ edilir (md. 242/2); reddi hâlinde idari yargıya başvurulabilir\n  (md. 242/4).\n"
