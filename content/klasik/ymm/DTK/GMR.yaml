  - olcut: (a) Otuz gün kuralı ve sürenin dolmasından önce gerekçeli bildirimle aşılabilmesi
    puan: 5
  - olcut: (b) Md. 7/1 üç şartın bir arada aranması ve vakaya uygulanması
    puan: 6
  - olcut: (c) Md. 7/2-a değiştirme/iptal ve md. 7/4 yürürlük tarihi ayrımı
    puan: 5
  - olcut: (d) Yazılı yanlış izahat hâlinde ceza ve faiz uygulanmaması (md. 231/5)
    puan: 4
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 6/2
    alinti: Gümrük idareleri, söz konusu talebe ilişkin başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde
