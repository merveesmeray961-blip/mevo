    + 1.200 = 11.200 kg; vergi = 11.200 x 5 = **56.000 TL**.

    - B: Net ağırlık veya sadece ağırlık denildiğinde eşyanın kendi ağırlığı esas alınır (md. 32/1-b): 10.000 kg; vergi =
