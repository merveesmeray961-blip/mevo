  soru: '**Beta Medikal Ltd. Şti.**, Berlin''deki Gamma GmbH''den tıbbi cihaz ithal etmektedir. İthalat işlemlerini, Türkiye''de
    yerleşik **Delta Gümrük Müşavirliği Ltd. Şti.** dolaylı temsil yoluyla (Delta kendi adına, Beta''nın hesabına) yürütmüştür.
    Olaya ilişkin bilgiler aşağıdadır:


    - Gamma GmbH, faturayı gerçek değerinden düşük düzenleyerek Beta''ya göndermiştir. Beta ve Gamma bu durumu bilmektedir.

    - Delta, fatura değerinin düşük olduğunu bilmemektedir ve mesleği icabı ve mutat olarak bilmesini gerektirecek bir durum
    da yoktur.

    - Delta''nın yanında çalışan müşavir yardımcısı (Y) beyanname ekinde yanlış bir belge numarası yazmış; bu hata nedeniyle
    idare tarafından 12.000 TL''lik bir ceza kesilmiştir.

    - Delta''nın bir stajyeri (S) gümrük idaresinde kendi başına iş takibi yapmaya çalışmıştır.

    - Kanunen alınması gereken gümrük vergisi tutarı, düşük fatura nedeniyle 600.000 TL eksik tahsil edilmiştir.


    **İstenenler:**


    (a) Eksik tahsil edilen gümrük vergisinden sorumlu olan kişileri, Delta''nın durumunu da belirterek gerekçesiyle açıklayınız.
    (7 puan)


    (b) Birden çok kişinin sorumlu olması hâlinde sorumluluğun niteliğini belirtiniz. (3 puan)


    (c) Y''nin hatasından doğan 12.000 TL''lik cezanın mali sorumlusunu belirtiniz. (4 puan)


    (d) S''nin gümrük idaresinde iş takibi yapıp yapamayacağını açıklayınız; ayrıca temsilci olarak hareket eden kişinin kimde
    bulunması gereken nitelik bakımından yerleşiklik koşulunu belirtiniz. (6 puan)

    '
  cozum: '**(a) Sorumlular**


    İthalatta yükümlü beyan sahibidir; dolaylı temsilde hesabına beyan verilen kişi (Beta) de yükümlüdür. Dolaylı temsilcinin
    (Delta) yükümlülüğü, beyanda kullanılan verilerin yanlış olduğunu bildiği veya mesleği icabı ve mutat olarak bilmesi gerektiği
    durumlarla sınırlıdır (md. 181/2). Delta bilmemekte ve bilmesi gerekmemektedir; bu nedenle Delta sorumlu değildir. Ayrıca,
    beyanda kullanılan verilerin vergilerin eksik tahsiline sebep olması hâlinde bu verileri veren ve yanlış olduğunu bilen
    veya bilmesi gereken kişiler de vergilerden sorumludur (md. 181/3): bu hükme göre Gamma GmbH de sorumludur. Sonuç: Beta
    ve Gamma sorumlu, Delta sorumlu değil.


    **(b) Sorumluluğun niteliği**


    Aynı gümrük vergilerinin ödenmesinden birden çok yükümlü sorumlu ise müştereken ve müteselsilen sorumludurlar (md. 192).


    **(c) Y''nin hatası**


    Gümrük müşavir yardımcılarının ve stajyerlerin fiil ve hareketlerinden doğacak mali sorumluluk, yanında çalıştıkları gümrük
    müşavirine aittir (md. 226/4). 12.000 TL''lik cezadan Delta sorumludur.


    **(d) Stajyer ve temsilcinin yerleşikliği**


    Stajyerler gümrük idarelerinde iş takibi yapamaz (md. 226/3); S iş takibi yapamaz. Temsilci, transit taşımacılık yapan
    veya arızi olarak beyanda bulunan kişiler hariç olmak üzere, Türkiye Gümrük Bölgesinde yerleşik bulunan kişilerdir (md.
    5); Delta yerleşik olduğundan bu koşulu sağlamaktadır.


    Püf noktaları: (1) Dolaylı temsilcinin sorumluluğu "bilme/bilmesi gerekme" ile sınırlı, hesabına beyan verilen kişinin
    sorumluluğu ise doğrudandır. (2) Veriyi veren ve yanlışlığı bilen kişi de sorumludur, yurt dışında olması bunu değiştirmez.
    (3) Yardımcı ve stajyer fiillerinin mali sorumluluğu müşavirdedir.

    '
