  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 6/2
    alinti: Ancak, gümrük idareleri tarafından bu süreye uyulması mümkün değilse; belirtilen süre aşılabilir. Bu durumda,
      söz konusu idareler, yukarıda belirlenen sürenin dolmasından önce başvuru sahibine süre aşımını haklı kılan gerekçeler
      ile talep hakkında karar vermek için gerekli gördükleri ek süreyi de belirterek bilgi verirler.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/1-2
    alinti: Gümrük idaresinin ilgilinin lehine olan kararları aşağıdaki hallerin bir arada bulunması durumunda iptal edilir.
      a) Kararın yanlış veya eksik bilgilere dayanılarak verilmesi halinde, b) Başvuru sahibinin bu yanlışlık veya eksikliği
      bilmesi veya bilmesi gerektiği hallerde, c) Kararın doğru veya tam bilgilere dayanılarak verilmesinin mümkün olmamasının
      tespiti halinde.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/2-4
    alinti: a) Karara esas teşkil eden bir veya birden fazla koşulun gerçekleşmemiş veya gerçekleşemez olması, b) Lehine olan
      bir kararda öngörülen bir yükümlülüğe ilgilinin uymaması halinde.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/4
    alinti: 4. 1 inci fıkra hükümlerine göre kararın iptal işlemi iptal kararının verildiği tarihten, 2 nci fıkra hükümlerine
      göre verilen iptal veya değiştirme kararı tebliğ tarihinden itibaren yürürlüğe girer.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 231/5
    alinti: Gümrük idaresi tarafından yükümlüye yazı ile yanlış izahat verilmiş olması hâlinde bu Kısım hükümlerine göre idari
      para cezası ve faiz uygulanmaz.
