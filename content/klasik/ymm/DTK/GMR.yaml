    \ **3.000.000 TL**; gümrük vergisi: 3.000.000 × %10 = **300.000 TL**.\n\n**(d) Fark ve ceza**\n\n- Beyana göre vergi:\
    \ 2.250.000 × %10 = 225.000 TL; vergi farkı: 300.000 − 225.000 = **75.000 TL**.\n- Kıymeti md. 23–31'e göre belirlenen\
