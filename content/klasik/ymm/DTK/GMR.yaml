    edilenden farklı olduğu görülmüştür. Şirket, kısmi muayene sonuçlarının partinin kalanı için geçerli olmadığını düşünmektedir.


    **Beyanname 2.** İki kalemli beyannamede, kalem 1''de beyan edilen 5 ton yerine 6 ton, kalem 2''de beyan edilen 4 ton
    yerine 3 ton mal bulunmuştur. Her ikisi de ton başına 1.000 TL vergiye tabidir. Şirket, kalem 1''deki fazlalığın kalem
    2''deki eksiklikle karşılanmasını istemektedir.


    **Beyanname 3.** Eşyanın muayene edileceği yere taşınması ve elleçlenmesi ile tahlil için laboratuvara gönderilmesi sırasında
    masraflar doğmuştur. Tahlilden arta kalan numuneler, tahlil sonuçlarının şirkete bildirilmesinden 6 hafta sonra hâlâ alınmamıştır.


