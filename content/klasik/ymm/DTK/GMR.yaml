      veya buralardaki eşyanın değiştirilmesi ya da yapılan sayımlarda kayıtlara göre eşyanın bir kısmının noksan olduğunun
      anlaşılması hallerinde, bu eşyanın gümrük vergilerinin yanı sıra gümrüklenmiş değerinin iki katı idari para cezası verilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 236/2
    alinti: 2. Gümrük antrepolarında veya gümrük idaresince eşya konulmasına izin verilen yerlerde yapılan sayımlarda kayıtlara
