  soru: '**Orman Kâğıt A.Ş.**''nin kâğıt hamuru ithalatına ilişkin serbest dolaşıma giriş beyannamesi 18/3/2023''te tescil
    edilmiş ve eşya aynı gün teslim edilmiştir. Gümrük idaresi, teslimden sonra yaptığı kontrolde (md. 73) beyan edilen kıymetin
    noksan olduğunu tespit etmiş; 150.000 TL ilave gümrük vergisi ve ilgili idari para cezasını içeren kararı şirkete 21/4/2026''da
    tebliğ etmiştir. Bu fiille ilgili olarak herhangi bir ceza davası veya vergi davası açılmamıştır.


    **İstenenler:**


    (a) Şirketin bu beyannameye ilişkin belge ve bilgileri hangi tarihe kadar saklaması gerektiğini, sürenin başlangıcını
    göstererek belirtiniz. (5 puan)


    (b) Gümrük yükümlülüğünün başladığı tarihi ve ilave vergi tebliğinin süresinde yapılıp yapılmadığını gerekçesiyle değerlendiriniz.
    (7 puan)


    (c) İdari para cezasının tebliği bakımından sonucu açıklayınız. (5 puan)


    (d) Aynı noksanlık, ceza davası açılmasını gerektiren bir fiilden (ör. sahte fatura) kaynaklansaydı ve ceza davası açılmış
    olsaydı, zamanaşımı bakımından hangi hüküm uygulanırdı? (5 puan)

    '
  cozum: '**(a) Belge saklama**


    İlgili kişiler gümrük işlemlerine ilişkin belge ve bilgileri beş yıl saklamak zorundadır (md. 13). Serbest dolaşıma girmek
    üzere beyan edilen eşya için süre, belgelerin tescil edildiği yılın sonundan itibaren işlemeye başlar. Tescil yılı 2023
    olduğundan süre 31/12/2023''te başlar; şirket belgeleri **31/12/2028**''e kadar saklamalıdır.


    **(b) Tebliğ süresi**


    İthalatta gümrük yükümlülüğü serbest dolaşıma giriş beyannamesinin tescil tarihinde başlar (md. 181/1): **18/3/2023**.
    Denetim sonucu noksan alındığı belirlenen vergilerin tebliği, yükümlülüğün doğduğu tarihten itibaren üç yıl içinde yapılmalıdır
    (md. 197/2); süre 18/3/2026''da dolmuştur. Tebliğ 21/4/2026''da yapıldığından süresinde değildir. Zamanaşımını durduran
    bir dava da açılmadığından 150.000 TL ilave vergi **zamanaşımına uğramıştır**, tahsil edilemez.


    **(c) Ceza**


    Gümrük vergileri alacağına bağlı idari para cezalarının zamanaşımı, ilgili gümrük vergilerinin zamanaşımına tabidir (md.
    231/2). Vergi zamanaşımına uğradığından ceza da kesilemez/tahsil edilemez.


    **(d) Ceza davası açılması**


    Gümrük vergisi alacağı ceza uygulamasını gerektiren bir fiile ilişkin ve zamanaşımı daha uzun bulunan bu fiil nedeniyle
    ceza davası açılmışsa, alacak Türk Ceza Kanunundaki dava ve ceza zamanaşımı süreleri içinde kovuşturulup tahsil edilir
    (md. 197/4). İdari yaptırım kararları da bu hâlde TCK''daki süreler içinde uygulanır (md. 231/1). Üç yıllık süre bu durumda
    belirleyici olmaz.


    Püf noktaları: (1) Üç yıllık süre tescil tarihinden (gümrük yükümlülüğünün başladığı gün) işler; belge saklama süresi
    ise tescil yılının sonundan başlar. (2) Ceza, vergiyle birlikte aynı akıbete tabidir. (3) Zamanaşımını yalnızca dava durdurur
    ya da ceza davası TCK süresine götürür.

    '
