  soru: 'Tekstil Ltd., AB üyesi Almanya''dan kumaş ithal etmektedir. Firma A.TR belgesiyle getirdiği kumaşın gümrük vergisinden
    muaf olduğunu düşünmektedir. Kumaşın bir kısmı ise Vietnam''da üretilmiş, Almanya''dan sevk edilmiştir.


