    puan: 4
  - olcut: (c) İdari yargı yoluna başvuru (md. 242/4)
    puan: 2
  - olcut: (d) Tahlile itiraz süresi, makamı ve ikinci tahlilin kesinliği (md. 243)
    puan: 5
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 198/1
    alinti: yükümlüye tebliğ edildiği tarihten itibaren onbeş gün içinde ödenmesi zorunludur. Ödeme süresinin bitmesinden
      önce ilgilinin yazılı istemde bulunması ve teminat alınması şartıyla ödeme süresi otuz gün daha uzatılabilir. Süre uzatımı
      beyanname kapsamı eşyanın her bir kalemi için ayrı ayrı da yapılabilir. Uzatılan süre için 6183 sayılı Amme Alacaklarının
      Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre tecil faizi alınır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 198/2
    alinti: 2. Tebliğ edilen gümrük vergilerine karşı 242 nci madde çerçevesinde gümrük idareleri nezdinde itiraz edilmesi
      ödeme süresini keser. Ödeme süresi idarenin ya da yargı mercii kararının tebliğ edildiği tarihten itibaren yeniden başlar.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 242/1
    alinti: 1. Yükümlüler kendilerine tebliğ edilen gümrük vergileri, cezalar ve idari kararlara karşı tebliğ tarihinden itibaren
      onbeş gün içinde bir üst makama, üst makam yoksa aynı makama verecekleri bir dilekçe ile itiraz edebilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 242/2-4
    alinti: 2. İdareye intikal eden itirazlar otuz gün içinde karara bağlanarak ilgili kişiye tebliğ edilir. 3. İtiraz dilekçelerinin
      süresi içinde yanlış makama verilmesi halinde, itiraz süresinde yapılmış sayılır ve idarece yetkili makama ulaştırılır.
      4. İtirazın reddi kararlarına karşı işlemin yapıldığı yerdeki idari yargı mercilerine başvurulabilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 243/1-3
    alinti: 1. İlgili kişilere 197 nci maddeye göre tebliğ edilen gümrük vergilerinin hesaplanmasında esas alınan kimyevi
      tahlil sonuçlarına karşı tebliğden itibaren onbeş gün içinde gümrük ve muhafaza başmüdürlüğüne yazılı olarak itiraz
      edilebilir. 2. İtiraz üzerine, birinci tahlilin yapıldığı gümrük laboratuarında görevli olan ve ilk tahlili yapan kimyager
      dışındaki iki kimyager tarafından ikinci tahlil yapılır.
