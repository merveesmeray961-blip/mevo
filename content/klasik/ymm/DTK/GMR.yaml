- id: YMM-DTK-GMR-K012
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - gümrük beyanı ve yükümlülükler
  - gümrük borcu
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Ege Tekstil A.Ş.**'nin 08.05.2024'te tescil edilen serbest dolaşıma giriş beyannamesi, farklı tarife pozisyonlarındaki\
    \ üç\nkalemden oluşmaktadır. Satış birimi kilogramdır; başka ithalat vergisi yoktur.\n\n| Kalem | Eşya | Beyan edilen\
    \ miktar/kıymet | Birim kıymet | Gümrük vergisi |\n|---|---|---|---|---|\n| 1 | Kumaş | 10.000 kg | 200 TL/kg | %8 |\n\
    | 2 | İplik | 5.000 kg | 150 TL/kg | %5 |\n| 3 | Makine parçası | 1 adet, 12.000 TL | – | %2 |\n\nOlaylar:\n- Tescilden\
    \ sonra, ancak muayene bildiriminden önce Ege, kalem 3'ün faturasındaki tutarın yazım hatası nedeniyle 21.000 TL\n  olması\
    \ gerektiğini belgeleyerek beyannamenin düzeltilmesini istemiştir.\n- Muayene edileceği kendisine bildirildikten sonra\
    \ Ege, kalem 1'in ağırlığının düzeltilmesini istemiştir.\n- Muayenede kalem 1 için 10.400 kg, kalem 2 için 4.800 kg tespit\
    \ edilmiştir. Ege, kalem 2'deki eksikliğin kalem 1'deki fazlalığa\n  mahsup edilmesini talep etmiştir. Vergiler tahakkuk\
    \ ettirilip ödenmiş ve eşya teslim edilmiştir. Ege aykırılıkları idareden\n  önce bildirmemiştir.\n- Ege'nin aynı gün\
    \ tescil edilen ikinci beyannamesinde, antrepoya konulmak istenen eşya yanlışlıkla serbest dolaşıma giriş\n  rejimine\
    \ beyan edilmiştir; Ege muayene bildiriminden sonra beyannamenin iptalini istemiştir.\n- Eylül 2026'da idare, md. 73 kapsamında\
    \ teslimden sonra kontrol başlatmış ve 2024 beyannamesine ilişkin ticari belgeleri\n  yazılı olarak istemiştir. Ege belgeleri\
    \ saklamadığını bildirerek ibraz edememiştir.\n\n2026 yılı için md. 241/1'deki usulsüzlük cezası 1.494,00 TL'dir.\n\n\
    **İstenenler:**\n\n(a) Gümrük beyanını tanımlayınız; beyan şekillerini ve beyannamenin tescilinin hukuki sonuçlarını açıklayınız.\
    \ (5 puan)\n\n(b) Kalem 3 ve kalem 1'e ilişkin düzeltme taleplerini ve ikinci beyannamenin iptal talebini değerlendiriniz.\
    \ (6 puan)\n\n(c) Üç kalem için tahakkuk ettirilecek gümrük vergisini hesaplayınız; mahsup talebini ve kalem 1 için verilecek\
    \ para cezasını\naçıklayınız. (8 puan)\n\n(d) Belge saklama süresini belirleyiniz; teslimden sonra kontrolün kapsamını\
    \ ve Ege'ye verilecek cezayı açıklayınız. (6 puan)\n"
  cozum: "**(a) Gümrük beyanı**\n\n- Gümrük beyanı, belirlenen usul ve esaslar çerçevesinde eşyanın bir gümrük rejimine tabi\
    \ tutulması talebidir (md. 3/16).\n- Beyan; yazılı olarak, bilgisayar veri işleme tekniğiyle, sözlü olarak ya da eşya\
    \ sahibinin eşyayı bir rejime tabi tutma\n  isteğini ifade eden herhangi bir tasarrufla yapılabilir (md. 59/1).\n- Aksine\
    \ hüküm yoksa rejim hükümlerinin uygulanmasında esas tarih beyannamenin **tescil tarihidir** (md. 61/2). Tescil edilmiş\n\
    \  beyanname, eşyanın vergi ve para cezalarından dolayı **taahhüt niteliğinde** beyan sahibini bağlar ve tahakkuka esas\n\
    \  tutulur (md. 61/3).\n\n**(b) Düzeltme ve iptal**\n\n- Başka bir eşyanın beyanı sonucunu doğurmamak kaydıyla beyan sahibinin\
    \ talebiyle beyannamedeki bilgilerin düzeltilmesine izin\n  verilir; ancak (a) muayene edileceğinin bildirilmesinden,\
    \ (b) bilgilerin yanlış olduğunun tespitinden, (c) md. 73 saklı\n  kalmak üzere eşyanın tesliminden sonra düzeltme yapılamaz\
    \ (md. 63).\n- **Kalem 3:** Talep muayene bildiriminden önce yapılmış ve başka eşyanın beyanı sonucunu doğurmamaktadır\
    \ → düzeltme\n  **kabul edilir**, kıymet 21.000 TL olur.\n- **Kalem 1:** Talep muayene bildiriminden sonra yapıldığından\
    \ **reddedilir**.\n- **İkinci beyanname:** Eşyanın yanlışlıkla beyanname konusu rejime tabi tutulduğu kanıtlanırsa idare\
    \ beyannameyi iptal ederek\n  yeni rejim beyanına (antrepo) izin verebilir; ancak muayene bildirilmiş olduğundan **muayene\
    \ sonucu alınmadan iptal talebi\n  kabul edilmez** (md. 64/1). Teslimden sonra yönetmelikteki hâller dışında iptal yapılamaz\
    \ (md. 64/4); iptal cezai hükümlerin\n  uygulanmasına engel değildir (md. 64/5).\n\n**(c) Vergi, mahsup, ceza**\n\n- Muayene\
    \ yapıldığında rejim hükümlerinin uygulanmasında muayene sonuçları esas alınır (md. 65/2).\n  - Kalem 1: 10.400 × 200\
    \ × %8 = **166.400 TL** (beyana göre 160.000 TL; fark 6.400 TL)\n  - Kalem 2: 4.800 × 150 × %5 = **36.000 TL** (beyana\
    \ göre 37.500 TL)\n  - Kalem 3: 21.000 × %2 = **420 TL**\n  - Toplam: **202.820 TL**\n- Birden çok kalemi kapsayan beyannamede\
    \ her kaleme ilişkin bilgiler ayrı beyan sayılır; bir kalemin eksiği diğerinin\n  fazlasına **mahsup edilemez** (md. 67/2).\
    \ Mahsup talebi reddedilir.\n- Kalem 1'de satış birimine (kg) göre miktar farkı 400/10.000 = **%4**'tür, %5'i geçmemektedir.\
    \ Bu nedenle md. 234/1-a'daki\n  üç kat ceza değil, md. 234/1-c uyarınca vergi farkının **yarısı** uygulanır: 6.400 /\
    \ 2 = **3.200 TL**. Ceza md. 241/1'deki\n  tutardan az olamaz (md. 234/6); usulsüzlük cezası tutarı her yıl artırıldığından\
    \ 2024 tutarı 2026'daki 1.494 TL'nin\n  altındadır ve 3.200 TL bu sınırı aşmaktadır. Kalem 2 vergi kaybı doğurmadığından\
    \ ceza gerektirmez; kalem 3 süresinde\n  düzeltildiğinden aykırılık yoktur.\n\n**(d) Belge saklama ve sonradan kontrol**\n\
    \n- Kişiler gümrük işlemlerine ilişkin belgeleri **beş yıl** saklamak zorundadır; serbest dolaşıma giriş beyanlarında\
    \ süre,\n  beyannamenin tescil edildiği yılın **sonundan** itibaren işler (md. 13): 31.12.2024'ten itibaren → **31.12.2029**'a\
    \ kadar.\n- İdare, eşyanın tesliminden sonra beyannamedeki bilgilerin doğruluğunu saptamak için ithal işlemlerine ve sonraki\
    \ ticari\n  işlemlere ait belge ve verileri, beyan sahibine veya ticari yönden ilgili diğer kişilere ait yerlerde kontrol\
    \ edebilir;\n  yanlış veya eksik bilgiye dayanıldığı saptanırsa ceza hükümleri saklı kalmak üzere beyanı düzeltir (md.\
    \ 73/1, 73/3). İlgili\n  kişiler istenen belge ve bilgiyi vermekle yükümlüdür (md. 11).\n- Md. 11 uyarınca yazılı istenen\
    \ ve md. 13'e göre beş yıl saklanması gereken belgelerin kontrol sırasında ibraz edilmemesi,\n  usulsüzlük cezasının **sekiz\
    \ katını** gerektirir (md. 241/6-d): 1.494 × 8 = **11.952 TL** (fiil 2026'da işlendiğinden 2026\n  tutarı esas alınır).\n"
