    (c) Gümrük kıymetini hangi yöntemle ve hangi sıra ile belirleyeceğinizi göstererek Türk Lirası olarak hesaplayınız. (7
    puan)


    (d) Beyan sahibi md. 25/2''nin (c) ve (d) bentlerinin uygulama sırasının değiştirilmesini yazılı olarak talep etseydi
    bu talep vakadaki sonucu değiştirir miydi? (4 puan)

    '
  cozum: '**(a) İlişkinin etkisi (md. 24/2-a)**


    Alıcı ile satıcı arasında ilişki bulunması, satış bedelinin reddi için tek başına yeterli neden değildir. Satışa ilişkin
    koşullar incelenir; ilişkinin fiyatı etkilemediği belirlenirse satış bedeli kabul edilir. İdare, elde ettiği bilgilere
