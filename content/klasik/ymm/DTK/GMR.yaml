    \ belirtilerek Gümrük\n  Vergileri Tahakkukunu İzleme Defterine kaydedilir (md. 195/1-b).\n- İkinci parti (20.07.2026,\
    \ altı aylık süre dolduktan sonra): vergi, yükümlülüğün başladığı (tescil) tarihteki tarifeye göre\n  hesaplanır (md.\
    \ 15/1, 181/1-a, 193/1): 1.500.000 × %8 = **120.000 TL**.\n- Toplam gümrük vergisi: **160.000 TL**.\n\n**(b) Lehe kararın\
    \ iptali**\n\n- Kararın yanlış bilgiye dayanması, başvuru sahibinin bunu bilmesi ve doğru bilgiyle kararın verilememesi\
    \ hâllerinin\n  **bir arada** bulunması nedeniyle karar **iptal edilir** (md. 7/1); hüküm emredicidir, idare bağlı yetki\
    \ kullanır.\n- İptal muhatabına tebliğ edilir (md. 7/3); ancak 1. fıkraya göre iptal, **iptal kararının verildiği tarihten\
    \ (05.06.2026)**\n  itibaren yürürlüğe girer, tebliğ tarihi (09.06.2026) esas alınmaz (md. 7/4).\n- Gümrük idaresince\
    \ verilen kararlara dayanak belge ve bilgilerin ilgili kişilerce yanlış verilmesi, usulsüzlük cezasının\n  iki katını\
    \ gerektirir (md. 241/3-a): 1.494 × 2 = **2.988 TL**.\n- Lehe kararda öngörülen bir yükümlülüğe uyulmaması hâlinde karar\
    \ **değiştirilir veya iptal edilebilir** (md. 7/2-b; takdirî);\n  bu iptal veya değiştirme **tebliğ tarihinden** itibaren\
    \ yürürlüğe girer (md. 7/4). Yasal çıkarların gerektirdiği\n  istisnai hâllerde yürürlük tarihi yönetmelikteki koşullarla\
    \ ertelenebilir.\n\n**(c) Karar talebi ve itiraz**\n\n- Karar talebi yazılı yapılır, gerekli bilgi ve belgeler ibraz edilir;\
    \ idare başvurunun kendisine ulaştığı tarihten itibaren\n  **otuz gün** içinde karar alır (md. 6/1-2): 02.03.2026 + 30\
    \ gün = **01.04.2026** (Çarşamba).\n- Süreye uyulamıyorsa süre dolmadan gerekçe ve ek süre başvuru sahibine bildirilir\
    \ (md. 6/2). İdare 25.03.2026'da, süre\n  dolmadan bildirim yaptığından usule uygun davranmıştır.\n- Ret kararı yazılı,\
    \ **gerekçeli** ve Onikinci Kısımda düzenlenen **itiraz yolu belirtilerek** alınır ve tebliğ edilir\n  (md. 6/2, 6/3);\
    \ kararlar derhal uygulanır (md. 6/4).\n- İtiraz, tebliğ tarihinden itibaren **on beş gün** içinde üst makama (yoksa aynı\
    \ makama) dilekçeyle yapılır (md. 242/1):\n  20.04.2026 + 15 gün = **05.05.2026** (Salı).\n- Taahhütlü postayla yapılan\
