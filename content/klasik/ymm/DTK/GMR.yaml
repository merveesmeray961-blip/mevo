    ve Türkiye''de mevcut veriler esas alınarak belirleme, (III) eşyanın ihraç ülkesindeki iç piyasa fiyatı, (IV) asgari gümrük
    kıymeti, (V) Türkiye''den başka bir ülkeye ihraç edilen eşyanın fiyatı.


    **İstenenler:**


    (a) 1-4 numaralı durumlarda satış bedelinin gümrük kıymetine esas alınıp alınamayacağını (veya nasıl alınacağını) madde
    atfıyla belirtiniz. (10 puan)


    (b) Md. 26 kapsamında I-V numaralı yöntemlerden hangilerinin esas alınabileceğini belirtiniz. (6 puan)


    (c) Md. 26''ya hangi hâllerde başvurulabilir? (4 puan)

    '
  cozum: '**(a) Satış bedelinin esas alınabilme koşulları (md. 24/1)**


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | Esas alınabilir | Alıcının elden çıkarmasında kısıtlama olmamalıdır; ancak eşyanın tekrar satılabileceği coğrafi
    bölgeyi sınırlayan ve kıymeti önemli ölçüde etkilemeyen kısıtlamalar istisnadır (md. 24/1-a). |

    | 2 | Esas alınamaz | Satış veya fiyat, kıymeti tespit edilemez bir koşul veya edim konusu olmamalıdır (md. 24/1-b). |

    | 3 | Esas alınabilir, ancak hasılanın satıcıya intikal eden bölümü md. 27''ye göre fiyata ilave edilir | Tekrar satış
    hasılasının bir bölümünün satıcıya intikalinde fiyata md. 27''ye göre ilave yapılabilmelidir (md. 24/1-c; md. 27/1-d).
    |

    | 4 | Esas alınabilir | İlişki tek başına red nedeni değildir; koşullar incelenip ilişkinin fiyatı etkilemediği belirlenirse
    satış bedeli kabul edilir (md. 24/1-d ve 24/2-a). |


    **(b) Md. 26/2''ye göre esas alınmayacak yöntemler**


    Md. 26/2 uyarınca şunlar esas alınmaz: Türkiye''de üretilen eşyanın Türkiye içindeki satış fiyatı (I), eşyanın ihraç ülkesindeki
    iç piyasa fiyatı (III), asgari gümrük kıymetleri (IV), Türkiye''den başka bir ülkeye ihraç edilen eşyanın fiyatı (V).
    Bunun yanında iki alternatif kıymetten yükseğini kabul eden sistem, aynı veya benzer eşyanın 25/2-d''ye göre hesaplanmış
    kıymeti dışındaki maliyet bedeli ve keyfi veya fiktif kıymetler de esas alınmaz. Esas alınabilecek yöntem **II** numaralıdır
    (md. 26/1).


    **(c) Md. 26''nın uygulanma koşulu**


    Md. 24 ve 25 hükümlerine göre belirlenemeyen ithal eşyasının gümrük kıymeti, md. 26/1 uyarınca GATT VII. Madde Anlaşması
    ile bu bölüm hükümlerinin prensip ve genel hükümlerine uygun yöntemlerle ve Türkiye''de mevcut veriler esas alınarak belirlenir.


    Püf noktaları: (1) Coğrafi sınırlama kıymeti önemli ölçüde etkilemiyorsa serbesttir. (2) Md. 26''da "esas alınmayacaklar"
    listesi sınav için ezberlenmelidir.

    '
