      matrah = kiymet + gv + 20000

      kdv = matrah * 20 // 100

      noksan_gv = 6000 * 40 * 8 // 100

      sonuc = {"gumruk_kiymeti": kiymet, "gumruk_vergisi": gv, "kdv_matrahi": matrah, "kdv": kdv, "noksan_gv": noksan_gv}

      '
