- id: YMM-DTK-GMR-K024
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - gümrük cezaları ve uzlaşma
  - itiraz ve idari yargı yolu
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Marmara Elektronik Ltd. Şti.** nezdinde yapılan teslimden sonra kontrol sonucunda düzenlenen ek tahakkuk ve ceza
    kararı 11/5/2026''da şirkete tebliğ edilmiştir. Karar; beyan ile idare tespiti arasındaki farktan doğan gümrük vergisi
    alacağını ve idari para cezasını içermektedir. Şirket itiraz etmemiş ve dava açmamıştır. Gelişmeler:


    - Şirket, tebliğin üzerinden 12 gün geçtikten sonra uzlaşma talebinde bulunmuştur. Uzlaşma gün sayısı hesabında takvim
    günleri esas alınacaktır; itiraz veya dava açma süresinin tebliğden itibaren 15 gün olduğunu varsayınız.

    - Uzlaşma sağlanamamıştır.

    - Aynı şirketin farklı bir beyannamesine ilişkin farkın, 5607 sayılı Kanunda yer alan kaçakçılık suçlarıyla ilişkili olduğu
    da tespit edilmiştir.

    - Üçüncü bir dosyada uzlaşma sağlanmış; uzlaşılan vergi için gümrük yükümlülüğü 3/3/2026''da başlamış, uzlaşma tutanağı
    14/9/2026''da imzalanmıştır; tutanak imzalandığı gün tebliğ edilmiştir.


    **İstenenler:**


    (a) Uzlaşmanın kapsamına neler girer? Uzlaşma talebi hangi süre içinde yapılır? (5 puan)


    (b) Şirketin uzlaşma talebinin itiraz veya dava açma süresine etkisini ve uzlaşma sağlanamayınca kalan sürenin ne olacağını
    hesaplayarak açıklayınız. (6 puan)


    (c) Kaçakçılıkla ilişkili beyannamede uzlaşma mümkün müdür? Uzlaşmanın vaki olmaması hâlinde yeniden uzlaşma talebi yapılabilir
    mi? (5 puan)


    (d) Üçüncü dosyada uzlaşılan tutarın ödeme süresini, gecikme faizinin hangi süre için hesaplanacağını ve uzlaşılan cezada
    peşin ödeme indirimi uygulanıp uygulanmayacağını belirtiniz. Uzlaşma tutanağına karşı dava açılabilir mi? (8 puan)

    '
  cozum: '**(a) Kapsam ve süre (md. 244/1)**


    Uzlaşmaya şunlar girer: (1) beyan ile idare tespiti sonucu belirlenen farklılıklara ilişkin tebliğ edilen gümrük vergileri
    alacakları, (2) idare tespit etmeden önce beyan sahibince bildirilen farklılıklara ilişkin tebliğ edilen gümrük vergileri
    alacakları, (3) idare tarafından düzenlenen idari para cezaları. Talep, henüz itiraz başvurusu yapılmamış veya itiraz
    edilmiş ancak sonuçlandırılmamış vergi ve cezalar için tebliğ tarihinden itibaren onbeş gün içinde yapılır.


    **(b) Süreye etkisi**


    Uzlaşma talebi hâlinde itiraz veya dava açma süresi durur; uzlaşma olmazsa süre kaldığı yerden işlemeye devam eder, ancak
    sürenin bitimine beş günden az kalmışsa süre beş güne tamamlanır. Talep tebliğin 12. gününde yapıldığından süreden 3 gün
    kalmıştır (15 - 12 = 3). Kalan süre 5 günden az olduğundan **5 güne tamamlanır**; şirket uzlaşmanın olmaması hâlinde 5
    gün içinde itiraz veya dava yoluna gidebilir.


    **(c) Kaçakçılık ve yeniden talep**


    Gümrük vergileri ve cezalarına ilişkin fiilin 5607 sayılı Kanundaki kaçakçılık suçlarıyla ilişkili olması hâlinde md.
    244 hükmü uygulanmaz (md. 244/2); uzlaşma mümkün değildir. Uzlaşmanın vaki olmaması veya temin edilememesi hâlinde yeniden
    uzlaşma talebinde bulunulamaz (md. 244/1).


    **(d) Ödeme, faiz, indirim, dava**


    Uzlaşılan gümrük vergileri ve cezalar, uzlaşma tutanağının tebliğinden itibaren bir ay içinde ödenir (md. 244/5). Yükümlülüğün
    başladığı tarihten (3/3/2026) uzlaşma tutanağının imzalandığı tarihe (14/9/2026) kadar geçen süre için 6183 sayılı Kanuna
    göre belirlenen gecikme zammı oranında gecikme faizi uygulanır. Uzlaşılan cezalarda 5326 sayılı Kabahatler Kanunu md.
    17 uyarınca ayrıca peşin ödeme indiriminden yararlanılamaz (md. 244/6). Vergi yükümlüsü veya ceza muhatabı, üzerinde uzlaşılan
    ve tutanakla tespit olunan hususlar hakkında dava açamaz ve hiçbir mercie şikâyette bulunamaz (md. 244/4).


    Püf noktaları: (1) Uzlaşma talebi tebliğden itibaren 15 gündür ve talep itiraz/dava süresini durdurur. (2) Kalan süre
    5 günden azsa 5 güne tamamlanır. (3) Kaçakçılık suçuyla ilişkili fiillerde uzlaşma yoktur.

    '
