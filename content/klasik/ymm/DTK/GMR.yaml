- id: YMM-DTK-GMR-K023
  sinav: ymm
  ders: DTK
  konu: GMR
  kazanimlar:
  - gümrük vergilerinin ödenmesi ve itiraz
  - itiraz ve idari yargı yolu
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Akdeniz Seramik A.Ş.**''ne, teslimden sonra yapılan kontrol sonucunda noksan alındığı belirlenen 420.000 TL gümrük
    vergisini içeren tahakkuk 6/4/2026''da tebliğ edilmiştir. Vergi, eşyanın kimyevi tahlil sonuçlarına göre hesaplanmıştır.
    Şirket aşağıdaki işlemleri yapmıştır:


    | Tarih | İşlem |

    |---|---|

    | 16/4/2026 | Şirket, tebliğ edilen vergiye karşı gümrük idaresi nezdinde itiraz dilekçesi vermiştir (tebliğden 10 gün
    sonra). Dilekçe yanlışlıkla yetkisiz bir birime verilmiş, bu birim dilekçeyi yetkili makama ulaştırmıştır. |

    | 11/5/2026 | İdare itirazı reddetmiş ve ret kararını şirkete aynı gün tebliğ etmiştir (itirazın alınmasından 25 gün sonra).
    |


    Şirket, vergi tutarının kendisine ait kısmını ödeyebileceğini düşünmektedir.


    **İstenenler:**


    (a) Noksan vergi için normal ödeme süresini ve bu sürenin uzatılması şartlarını belirtiniz. (5 puan)


    (b) İtirazın süresinde yapılıp yapılmadığını, dilekçenin yanlış birime verilmesinin etkisini ve idarenin karar süresine
    uyup uymadığını değerlendiriniz. (6 puan)


    (c) İtirazın ödeme süresine etkisini, ret kararından sonra ödeme süresinin ne zaman yeniden başlayacağını ve şirketin
    başvurabileceği yolu belirtiniz. (6 puan)


    (d) Vergi, kimyevi tahlil sonuçlarına göre hesaplanmış olsaydı tahlile itiraz süresi ve usulü ile ikinci tahlilin niteliğini
    açıklayınız. (5 puan)

    '
  cozum: '**(a) Ödeme süresi**


    Kontrol sonucunda noksan alındığı belirlenen vergilerin, yükümlüye tebliğ edildiği tarihten itibaren onbeş gün içinde
    ödenmesi zorunludur. Süre bitmeden ilgilinin yazılı istemde bulunması ve teminat alınması şartıyla ödeme süresi otuz gün
    daha uzatılabilir; uzatılan süre için 6183 sayılı Kanun md. 48''e göre tecil faizi alınır (md. 198/1). Yükümlü, vergiyi
    süre bitimini beklemeden de ödeyebilir (md. 198/3).


    **(b) İtirazın süresi, yanlış birim, karar süresi**


    Yükümlüler tebliğ edilen vergilere karşı tebliğ tarihinden itibaren onbeş gün içinde bir üst makama, üst makam yoksa aynı
    makama dilekçe ile itiraz edebilir (md. 242/1). Şirket tebliğden 10 gün sonra itiraz ettiği için süresindedir. Dilekçenin
    süresi içinde yanlış makama verilmesi hâlinde itiraz süresinde yapılmış sayılır ve idarece yetkili makama ulaştırılır
    (md. 242/3). İdareye intikal eden itirazlar otuz gün içinde karara bağlanıp tebliğ edilir (md. 242/2); idare 25 günde
    karar verdiğinden süreye uymuştur.


    **(c) İtirazın ödeme süresine etkisi ve dava yolu**


    Tebliğ edilen gümrük vergilerine karşı md. 242 çerçevesinde gümrük idareleri nezdinde itiraz edilmesi ödeme süresini keser;
    ödeme süresi, idarenin kararının tebliğ edildiği tarihten itibaren yeniden başlar (md. 198/2). Ret kararı 11/5/2026''da
    tebliğ edildiğinden onbeş günlük ödeme süresi bu tarihten itibaren yeniden işlemeye başlar. İtirazın reddi kararlarına
    karşı işlemin yapıldığı yerdeki idari yargı mercilerine başvurulabilir (md. 242/4).


    **(d) Kimyevi tahlile itiraz**


    Vergilerin hesabında esas alınan kimyevi tahlil sonuçlarına karşı tebliğden itibaren onbeş gün içinde gümrük ve muhafaza
    başmüdürlüğüne yazılı itiraz edilebilir (md. 243/1). İtiraz üzerine ikinci tahlil, ilk tahlili yapan kimyager dışındaki
    iki kimyager tarafından yapılır (md. 243/2). İkinci tahlil sonucu eşyanın teknik özellikleri ve nitelikleri yönünden kesindir
    (md. 243/3).


    Püf noktaları: (1) İtiraz süresi ve ilk ödeme süresi aynı onbeş gündür, ancak itiraz ödeme süresini keser. (2) Ödeme süresi
    kesildikten sonra "kaldığı yerden" değil, kararın tebliğinden itibaren yeniden (onbeş gün) başlar. (3) Tahlile itiraz
    başmüdürlüğe yapılır ve ikinci tahlil teknik özellikler bakımından kesindir.

    '
  puanlama:
  - olcut: (a) Onbeş günlük ödeme süresi ve otuz günlük uzatma şartları (yazılı istem, teminat, tecil faizi)
