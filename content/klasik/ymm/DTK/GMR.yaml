  - olcut: (b) KDV matrahının KDVK md. 21 unsurlarıyla 6.024.800 TL bulunması
    puan: 3
  - olcut: (b) KDV'nin 1.204.960 TL hesaplanması
    puan: 2
  - olcut: (c) Noksan gümrük vergisinin 19.200 TL hesaplanması
    puan: 2
  - olcut: (c) Üç yıllık tebliğ süresi ve 10.03.2029 son tarihi
    puan: 3
  - olcut: (c) Faiz dönemi (başlangıç–kesinleşme) ve gecikme zammı oranı
    puan: 2
  - olcut: (c) 15 günlük ödeme süresi, 30 günlük uzatma ve tecil faizi; itirazın etkisi
