  soru: "**Zirve Tarım A.Ş.** 1.000 ton dökme arpa ithal etmiştir. Eşya 02.02.2026'da boşaltılarak (G) Lojistik A.Ş.'nin işlettiği\n\
    geçici depolama yerine konulmuştur. Gümrük kıymeti ton başına 10.000 TL'dir. Gümrük vergisi oranı 14.02.2026'ya kadar\n\
    %20 iken Cumhurbaşkanı Kararıyla 15.02.2026'dan geçerli olarak %25'e yükseltilmiştir (oranlar varsayımsaldır; başka ithalat\n\
    vergisi yoktur ve KDV dikkate alınmayacaktır).\n\n1. 06.02.2026 gecesi depo çalışanı (K), Zirve'nin kamyon şoförü (Ş)\
    \ ile birlikte 20 ton arpayı gümrük idaresinin izni\n   olmadan depodan çıkararak Zirve'nin fabrikasına götürmüştür. Zirve'nin\
    \ satın alma müdürü durumu bilmekte olup arpa\n   fabrikada yeme işlenmiştir.\n2. Depolama süresince 5 ton arpa nem kaybı\
    \ nedeniyle eksilmiştir. Kaybın tümüyle eşyanın doğal niteliğinden kaynaklandığı\n   ve Zirve'nin ihmali veya hilesinin\
    \ bulunmadığı gümrük idaresine kanıtlanmıştır.\n3. Kalan 975 ton için serbest dolaşıma giriş beyannamesi 20.02.2026'da\
    \ tescil edilmiş, kıymet ton başına 10.000 TL beyan\n   edilmiş, vergiler ödenmiş ve eşya teslim alınmıştır. Teslimden\
    \ sonraki kontrolde gümrük kıymetinin ton başına 10.400 TL\n   olması gerektiği belirlenmiştir. Noksanlık maddi hesap\
    \ hatasından kaynaklanmamaktadır ve Zirve aykırılığı idarenin\n   tespitinden önce bildirmemiştir. Ek tahakkuk ve ceza\
    \ kararı 05.10.2026'da tebliğ edilmiş, itiraz veya uzlaşma\n   başvurusunda bulunulmamıştır.\n\n6183 sayılı Kanun md.\
    \ 51'e göre gecikme zammı oranı aylık %3,7'dir. Faiz tam ay üzerinden hesaplanacaktır. Cumartesi ve\nPazar resmî tatil\
    \ olup gün hesabında süreyi başlatan gün sayılmayacaktır.\n\n**İstenenler:**\n\n(a) Olay 1'de gümrük yükümlülüğünün dayanağını,\
    \ başladığı tarihi, uygulanacak oranı ve gümrük vergisini belirleyiniz;\nvergiden sorumlu kişileri ve sorumluluğun niteliğini\
    \ açıklayınız. (9 puan)\n\n(b) Olay 2'deki 5 ton için gümrük yükümlülüğü doğup doğmadığını açıklayınız; kaybın nedeni\
    \ kanıtlanamasaydı sonucun ne\nolacağını belirtiniz. (5 puan)\n\n(c) Olay 3'te 975 ton için beyana göre ödenen gümrük\
    \ vergisini, noksan vergiyi, para cezasını, md. 193/3'e göre faizin\nhesaplanacağı dönemi ve tutarını hesaplayınız; ödeme\
