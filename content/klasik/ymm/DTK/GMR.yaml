    alinti: Gümrük idareleri, beyan sahibinin talebi üzerine ve eşyanın yanlışlıkla beyanname konusu gümrük rejimine tabi
      tutulmasına veya beyan edildiği rejime tabi tutulmasının özel nedenlerle artık mümkün olmadığına ilişkin kanıtlayıcı
      belgeleri ibraz etmesi halinde, tescil edilmiş bir beyannameyi iptal ederek, gerektiğinde yeni bir rejim beyanında bulunulmasına
