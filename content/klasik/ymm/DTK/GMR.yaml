  soru: '**Ege Dış Ticaret Ltd. Şti.** nezdinde 2026 yılında yapılan kontroller sonucunda aşağıdaki tespitler yapılmıştır
    (gümrüklenmiş değerler ve vergiler ayrıca belirtilmedikçe fark gümrük vergisi dikkate alınmayacaktır):


    | No | İşlem | Tespit | Gümrüklenmiş değer |

    |---|---|---|---|

    | 1 | İthalat | Eşyanın ithali genel düzenleyici idari işlemle yasaklanmıştır; buna rağmen serbest dolaşıma giriş beyanında
    bulunulmuştur. | 800.000 TL |

    | 2 | İthalat | Eşyanın ithali lisans ve uygunluk belgesine bağlıdır; eşya belgeye tabi değilmiş gibi beyan edilmiştir.
    | 500.000 TL |

    | 3 | İhracat | Eşyanın ihracı genel düzenleyici idari işlemle yasaklanmıştır. | 300.000 TL |

    | 4 | İhracat | Eşyanın ihracı bir kuruluşun vereceği izin belgesine bağlıdır; eşya belgeye tabi değilmiş gibi beyan edilmiştir.
    | 400.000 TL |

    | 5 | Yolcu | Bir yolcunun beyanına aykırı olarak bavulunda çıkan, kişisel ve hediyelik eşya kapsamı dışındaki eşyaya
    ait gümrük vergisi 20.000 TL''dir. | -- |


    **İstenenler:**


    (a) 1 ve 2 numaralı işlemlerde uygulanacak idari para cezalarını hesaplayınız. (6 puan)


    (b) 3 ve 4 numaralı işlemlerde uygulanacak idari para cezalarını hesaplayınız. (6 puan)


    (c) 2 numaralı işlemde, Bakanlıkça belirlenen süre içinde belgenin alındığı veya ilgili kurumun denetiminin olumlu sonuçlandığı
    bildirilirse hangi hükme göre ceza verileceğini belirtiniz. (4 puan)


    (d) 5 numaralı işlemde yolcudan alınacak gümrük vergisi tutarını ve ödenmemesi hâlinde eşyanın akıbetini açıklayınız.
    (4 puan)

    '
  cozum: '**(a) İthalat**


    - İşlem 1: İthali genel düzenleyici idari işlemle yasaklanmış eşyada, varsa fark gümrük vergilerinin alınmasının yanı
    sıra gümrüklenmiş değerinin **dört katı** idari para cezası verilir (md. 235/1-a): 800.000 x 4 = **3.200.000 TL**.

    - İşlem 2: Lisans, izin, uygunluk belgesine bağlı eşyanın belgeye tabi değilmiş gibi beyanında gümrüklenmiş değerin **iki
    katı** idari para cezası verilir (md. 235/1-c): 500.000 x 2 = **1.000.000 TL**.


    **(b) İhracat**


    - İşlem 3: İhracı yasaklanmış eşyada gümrüklenmiş değerinin **iki katı** (md. 235/2-a): 300.000 x 2 = **600.000 TL**.

    - İşlem 4: Belgeye bağlı eşyanın belgeye tabi değilmiş gibi beyanında gümrüklenmiş değerinin **onda biri** (md. 235/2-b):
    400.000 / 10 = **40.000 TL**.


    **(c) Belgenin sonradan alınması**


    Bakanlıkça belirlenecek süre içinde ithalatın uygun bulunduğuna ilişkin belge veya bilginin düzenlenmesi ya da ilgili
    kurumun denetiminin olumlu sonuçlanması hâlinde, md. 235/1-c''deki iki kat ceza yerine **md. 241''in birinci fıkrası**
    uyarınca idari para cezası (usulsüzlük cezası) verilir (md. 235/1-e).


    **(d) Yolcu**


    Beyana aykırı eşyanın gümrük vergileri **iki kat** olarak alınır: 20.000 x 2 = **40.000 TL**; eşya sahibine teslim edilir.
    Gümrük vergileri ödenmediği takdirde eşya gümrüğe terk edilmiş sayılır (md. 235/3).


