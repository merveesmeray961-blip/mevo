  soru: '**Doğu Gıda İthalat Ltd. Şti.**''nin 2026 yılı içinde tescil edilen serbest dolaşıma giriş beyannameleriyle ilgili
    altı farklı talebi gümrük idaresine ulaşmıştır:


    | No | Talep ve durum |

    |---|---|

    | 1 | Beyannamede yer alan brüt ağırlık bilgisinin düzeltilmesi istenmiştir. Muayene yapılacağı şirkete bildirilmemiştir;
    düzeltme başka bir eşyanın beyanı sonucunu doğurmamaktadır. |

    | 2 | Beyannamedeki fatura tarihinin düzeltilmesi istenmiştir. Gümrük idaresi şirkete eşyanın muayene edileceğini daha
    önce bildirmiştir. |

    | 3 | Eşya teslim edildikten sonra, beyannamedeki bir bilginin düzeltilmesi istenmiştir. İdare yönetmelikteki usule göre
    düzeltmeyi uygun bulmaktadır. |

    | 4 | Eşyanın yanlışlıkla bu rejime tabi tutulduğu belgelenerek beyannamenin iptali istenmiştir. Muayene yapılacağı bildirilmiş,
    ancak muayene sonucu henüz alınmamıştır. |

    | 5 | Beyannamenin tescilinden sonra eşyanın bir kısmı nem alarak bozulmuş; şirket bu nedenle ithalat vergilerinde indirim
    istemiştir. |

    | 6 | Eşya teslim edildikten sonra beyannamenin iptali istenmiştir; yönetmelikte bu durum için öngörülmüş bir hâl yoktur.
    |


    **İstenenler:**


    (a) Her bir talebin kabul edilip edilemeyeceğini kısa gerekçe ve madde atfıyla belirtiniz. (12 puan)


    (b) Beyannamenin tescil tarihinin, ithalatta gümrük yükümlülüğü ve vergi tahakkuku bakımından önemini açıklayınız. (4
    puan)


    (c) Beyannamenin iptalinin cezai hükümlerin uygulanmasına etkisini belirtiniz. (4 puan)

    '
  cozum: '**(a) Taleplerin değerlendirilmesi**


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | Kabul edilir | Başka bir eşyanın beyanı sonucunu doğurmamak kaydıyla beyandaki bilgilerin düzeltilmesine, muayene
    bildirilmeden önce izin verilir (md. 63). |

    | 2 | Reddedilir | Beyan sahibine eşyanın muayene edileceği bildirildikten sonra düzeltmeye izin verilmez (md. 63-a).
    |

    | 3 | Kabul edilebilir | Teslimden sonra düzeltme md. 63-c uyarınca yapılmaz; ancak md. 73/2 saklıdır, idare kendi yetkisiyle
    veya beyan sahibinin talebiyle yönetmelikteki usule göre eşyanın tesliminden sonra da düzeltme yapabilir. |

    | 4 | Reddedilir | Muayene yapılacağı bildirilmişse, muayenenin sonucu alınmadan iptal talebi kabul edilmez (md. 64/1).
    |

    | 5 | Reddedilir | Tescilden sonra eşyanın niteliklerindeki değişiklik veya bozulma nedeniyle ithalat vergilerinde indirim
    yapılmaz (md. 64/3); yalnızca ilk madde olarak kullanılabilecek eşya için ilk madde beyanına izin verilmesi gibi istisnalar
    vardır. |

    | 6 | Reddedilir | Yönetmelikle belirlenen haller dışında eşyanın tesliminden sonra beyannameler iptal edilemez (md. 64/4).
    |


    **(b) Tescil tarihinin önemi**


    İthalatta gümrük yükümlülüğü, serbest dolaşıma giriş beyannamesinin tescil tarihinde başlar (md. 181/1). Tescil edilmiş
    beyanname, eşyanın vergileri ve para cezalarından dolayı beyan sahibini taahhüt niteliğinde bağlar ve gümrük vergilerinin
    tahakkukuna esas tutulur (md. 61/3). Beyannameler, eşyanın gümrüğe sunulmuş olması hâlinde tescil edilir (md. 61/1).


    **(c) İptalin cezaya etkisi**


    Beyannamenin iptali, yürürlükteki cezai hükümlerin uygulanmasına engel oluşturmaz (md. 64/5).


    Püf noktaları: (1) Muayene bildirimi ve teslim, düzeltme ve iptal taleplerinde dönüm noktalarıdır. (2) Teslimden sonra
    düzeltme md. 63''te yasaktır, fakat md. 73/2 ile idare yönetmelikteki usule göre düzeltme yapabilir; bu ikisini birlikte
    okuyun. (3) Bozulma nedeniyle vergi indirimi yoktur.

    '
