    süresi içinde cevap verme hakkı saklıdır.


    **(b) Emsal kıymetler (md. 24/2-b)**


    Beyan sahibi, satış bedelinin aynı veya yakın tarihte gerçekleşen şu emsal kıymetlerden birine çok yakın olduğunu ispatlarsa
    satış bedeli kabul edilir: (1) Türkiye''ye ihraç amacıyla satılan aynı veya benzer eşyanın ilişkisiz satıcı ve alıcılar
    arasındaki satış bedeli, (2) aynı veya benzer eşyanın 25/2-c bendine göre belirlenen gümrük kıymeti, (3) aynı veya benzer
    eşyanın 25/2-d bendine göre belirlenen gümrük kıymeti. İspat yapılamadığından satış bedeli kabul edilemez.


    **(c) Alternatif yöntem (md. 25)**


    Md. 24''e göre belirlenemeyen kıymet, md. 25/2''nin (a), (b), (c), (d) bentleri sıra halinde uygulanarak belirlenir; bir
    üst bentle belirlenebildiği sürece alt bent uygulanamaz (md. 25/1). Sıra: (a) aynı eşyanın satış bedeli -> yok; (b) benzer
    eşyanın satış bedeli -> **vardır**; dolayısıyla (b) uygulanır.


    Kıymet = 1.000 x 48 = 48.000 USD; TL karşılığı (md. 30) = 48.000 x 42 = **2.016.000 TL**.


    **(d) Sıra değişikliği talebi**


