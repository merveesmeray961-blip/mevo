    (c) Gümrük kıymetinde hangi kur esas alınır? Yasal dayanağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Gümrük kıymeti**


    | Kalem | USD | Dahil mi? | Dayanak |

    |---|---|---|---|

    | Mal bedeli (FOB) | 200.000 | Evet | md. 24/1 |

    | Navlun (giriş limanına kadar) | 10.000 | Evet | md. 27/1-(e) |

    | Sigorta (giriş limanına kadar) | 3.000 | Evet | md. 27/1-(e) |

    | Satış komisyonu | 5.000 | Evet | md. 27/1-(a)-(i) |

    | Satın alma komisyonu | 2.000 | Hayır | md. 28/e |

    | Royalti (satış koşuluna bağlı) | 8.000 | Evet | md. 27/1-(c) |

    | Giriş sonrası nakliye | 4.000 | Hayır | md. 28/a |

    | **Toplam** | **226.000** | | |


