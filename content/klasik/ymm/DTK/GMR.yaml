    1.200 kg; birim vergi 5 TL/kg |

    | B | Tarifede **net** ağırlığa atıfta bulunulmaktadır. | Eşyanın kendi ağırlığı 10.000 kg, ambalaj 1.200 kg; birim vergi
    5 TL/kg |

