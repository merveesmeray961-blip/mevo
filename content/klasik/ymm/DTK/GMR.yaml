    eşyanın bu statüsünü gösteren belgedir. A.TR ile Türkiye''ye gümrüksüz giriş mümkündür.


    Ancak A.TR tercihli menşe belgesi değildir; eşyanın AB veya Türkiye menşeli olduğunu değil, AB''deki serbest dolaşım statüsünü
    belgeler.


    **(b) Vietnam menşeli kumaşın değerlendirilmesi**


