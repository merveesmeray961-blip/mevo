  soru: '**Kuzey Antrepo ve Depolama A.Ş.** bir genel antrepo işletmektedir. 2026 yılında antrepoda ve işletmeye bağlı gümrüksüz
    satış mağazasında yapılan denetimlerde aşağıdaki tespitler yapılmıştır (teminat alınmış olsa bile):


    | No | Tespit |

    |---|---|

    | 1 | Gümrük işlemleri bitirilip idarenin izni alınmadan antrepodan bir parti eşya çıkarılmıştır. Eşyanın gümrüklenmiş
    değeri 900.000 TL, gümrük vergileri toplamı 270.000 TL''dir. |

    | 2 | Antrepoda yapılan sayımda kayıtlara göre fazla eşya çıkmıştır. Fazla çıkan eşyaya ait ithalat vergisi tutarı 60.000
    TL''dir. |

    | 3 | Gümrüksüz satış mağazasında hak sahibi olan bir yolcuya limit üstü satış yapılmıştır. Limit üstü eşyaya ait ithalat
    vergileri 15.000 TL''dir. |

    | 4 | Antrepo beyannamesinde beyan edilen eşyadan belirgin şekilde farklı cinste eşya çıkmıştır (tahlile gerek olmaksızın
    tespit edilmiştir). Beyan edilen eşyanın gümrük vergileri toplamı 50.000 TL, farklı çıkan eşyanın gümrük vergileri toplamı
    80.000 TL''dir. |


    **İstenenler:**


    (a) 1 numaralı tespitte ödenecek gümrük vergisi ve idari para cezasını hesaplayınız. (5 puan)


    (b) 2 numaralı tespitte uygulanacak işlemi ve ceza tutarını belirtiniz. (5 puan)


    (c) 3 numaralı tespitte vergi ve ceza toplamını hesaplayınız. (5 puan)


    (d) 4 numaralı tespitte idari para cezasını hesaplayınız; farklı çıkan eşyanın ithalinin lisansa tabi olması ve gümrüklenmiş
    değerinin 500.000 TL olması hâlinde cezanın nasıl değişeceğini açıklayınız. (5 puan)

    '
  cozum: '**(a) İzinsiz çıkarma (md. 236/1)**


    Gümrük işlemleri bitirilmeden veya idarenin izni alınmadan antrepodan eşya çıkarılması hâlinde, teminat alınmış olsa bile,
    eşyanın gümrük vergilerinin yanı sıra gümrüklenmiş değerinin iki katı idari para cezası verilir. Vergi = **270.000 TL**;
    ceza = 900.000 x 2 = **1.800.000 TL**; toplam 2.070.000 TL.


    **(b) Fazla çıkan eşya (md. 236/2)**


    Fazla çıkan eşya 177-180. madde hükümlerine göre tasfiyeye tabi tutulur; ayrıca fazla çıkan eşyaya ait ithalat veya ihracat
    vergileri tutarı kadar para cezası alınır: **60.000 TL**.


    **(c) Gümrüksüz satış limit üstü (md. 236/4)**


    Hak sahibi olmakla birlikte limit üstü satış yapılması hâlinde limit üstü eşyaya ait ithalat vergilerinin yanı sıra bu
    vergilerin üç katı para cezası verilir: vergi 15.000 TL; ceza 15.000 x 3 = 45.000 TL; toplam **60.000 TL**.


    **(d) Farklı cins eşya (md. 236/5)**


    Farklı çıkan eşyanın gümrük vergileri toplamı (80.000 TL) beyan edilenin vergileri toplamından (50.000 TL) fazla olduğundan,
    farklı çıkan eşyaya ilişkin gümrük vergilerinin iki katı idari para cezası verilir (md. 236/5-a): 80.000 x 2 = **160.000
    TL**. Farklı çıkan eşyanın ithali lisansa, şarta, izne, kısıntıya veya uygunluk belgesine tabi ise ceza farklı çıkan eşyanın
    gümrüklenmiş değerinin iki katıdır (md. 236/5-b): 500.000 x 2 = **1.000.000 TL**.


    Püf noktaları: (1) İzinsiz çıkarmada ceza gümrüklenmiş değerin iki katı, fazla çıkan eşyada vergi kadar, limit üstü satışta
    vergilerin üç katıdır. (2) Farklı cinste eşyada vergi toplamlarını karşılaştırın; lisans/izne tabi ise değer esaslı cezaya
    geçilir.

    '
