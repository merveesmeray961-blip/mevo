    Ticaret politikası önlemlerine tabi eşyanın gümrük kıymetinin yükümlünün kendi beyanı ile artırılması sonucunda ödenen
    vergilerin geri verilmesine veya kaldırılmasına ilişkin talepler kabul edilmez (md. 211/1).


    **(d) Olay 4 ve hatalı geri verme**


    Geri verme kararının tebliğinden itibaren dört ay içinde karar uygulanmazsa, ilgilinin talebi üzerine tebliğ tarihinden
    ödemenin yapıldığı tarihe kadar geçen süre için geri verilecek tutar üzerinden aynı dönemde kanuni faiz oranında hesaplanan
    faiz ödenir (md. 216/2). Dört ay 10/10/2026''da dolduğundan faiz hakkı doğmuştur; faiz 10/6/2026''dan ödeme tarihine kadar
    hesaplanır. Gümrük vergilerinin hatalı olarak kaldırılması veya geri verilmesi hâlinde başlangıçta tahakkuk eden vergiler
    ile ödenmiş faizler yeniden tahsil edilir; tahsil edilmeyen miktarlar tebliğ tarihinden itibaren onbeş gün içinde ödenir,
    ödenmezse 6183 sayılı Kanun hükümlerine göre işlem yapılır (md. 217).


