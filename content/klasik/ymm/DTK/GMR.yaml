  soru: "**Doruk Soğutma A.Ş.** (Türkiye'de yerleşik ithalatçı) ile ilgili bilgiler aşağıdadır. Cumartesi ve Pazar günleri\n\
    resmî tatil kabul edilecek; gün olarak belirlenen sürelerde süreyi başlatan gün hesaba katılmayacaktır.\n\n1. Şirket,\
    \ ithal ettiği endüstriyel soğutucu için 12.05.2021 tarihinde bağlayıcı tarife bilgisi (BTB) almıştır. BTB'ye\n   göre\
    \ eşya, gümrük vergisi oranı %2 olan tarife pozisyonunda sınıflandırılmaktadır.\n2. Şirket 20.12.2025 tarihinde, BTB'ye\
    \ dayanarak yabancı satıcıyla iki partilik bağlayıcı bir alım sözleşmesi imzalamıştır.\n3. 15.01.2026 tarihli Resmî Gazete'de\
    \ yayımlanan Türk Gümrük Tarife Cetveli değişikliğiyle eşya, gümrük vergisi oranı %8\n   olan başka bir pozisyona alınmış;\
    \ BTB bu değişikliğe uymaz hâle gelmiştir.\n4. Birinci partinin serbest dolaşıma giriş beyannamesi 10.07.2026'da (gümrük\
    \ kıymeti 2.000.000 TL), ikinci partininki\n   20.07.2026'da (gümrük kıymeti 1.500.000 TL) tescil edilmiştir. Eşya için\
    \ ithalat, ihracat veya ön izin belgesi\n   aranmamaktadır; başka ithalat vergisi yoktur.\n5. Şirkete 01.03.2026'da gümrük\
    \ idaresince lehine bir izin kararı verilmiştir. Daha sonra kararın şirketin sunduğu yanlış\n   bilgiye dayandığı, şirketin\
    \ bu yanlışlığı bildiği ve doğru bilgiyle kararın verilemeyeceği anlaşılmıştır. İdare\n   05.06.2026'da iptal kararı almış,\
    \ karar şirkete 09.06.2026'da tebliğ edilmiştir.\n6. Şirket başka bir konuda 02.03.2026 (Pazartesi) günü idareye elden\
    \ yazılı karar talebinde bulunmuştur. İdare\n   25.03.2026'da süre aşımını haklı kılan gerekçeleri ve ihtiyaç duyduğu\
    \ ek süreyi şirkete yazıyla bildirmiştir. Talebi\n   reddeden karar 20.04.2026'da tebliğ edilmiştir. Şirket itiraz dilekçesini\
    \ 05.05.2026'da taahhütlü postaya vermiş;\n   dilekçe idareye 08.05.2026'da ulaşmıştır.\n\n2026 yılı için 4458 sayılı\
    \ Gümrük Kanunu md. 241/1'deki usulsüzlük cezası tutarı 1.494,00 TL'dir.\n\n**İstenenler:**\n\n(a) BTB'nin geçerlilik\
    \ süresini, geçerliliğini kaybettiği tarihi ve bağlayıcı sözleşme nedeniyle kullanılabileceği son\ngünü belirleyiniz;\
    \ iki parti için ödenecek gümrük vergisini hesaplayınız. (9 puan)\n\n(b) (5) numaralı lehe kararın iptalinin hukuki niteliğini\
    \ (bağlı yetki mi, takdir mi), iptalin yürürlük tarihini ve\nşirkete uygulanacak usulsüzlük cezasını açıklayınız; karar,\
    \ şirketin karardaki bir yükümlülüğe uymaması nedeniyle\nkaldırılsaydı sonucun nasıl değişeceğini belirtiniz. (8 puan)\n\
    \n(c) (6) numaralı talepte idarenin karar verme süresini ve bu konudaki usule uyup uymadığını, ret kararının taşıması\n\
    gereken unsurları, itirazın süresinde yapılıp yapılmadığını ve itirazın hangi sürede karara bağlanacağını açıklayınız.\n\
    (8 puan)\n"
  cozum: "**(a) Bağlayıcı tarife bilgisi**\n\n- BTB veriliş tarihinden itibaren **altı yıl** geçerlidir (md. 9/4); kural olarak\
    \ 12.05.2027'ye kadar geçerli olurdu.\n- Türk Gümrük Tarife Cetvelinde değişiklik yapılması ve bilginin bu değişikliğe\
    \ uymaması hâlinde BTB geçerliliğini kaybeder;\n  kaybetme tarihi değişikliğin Resmî Gazete'de yayımı tarihidir: **15.01.2026**\
    \ (md. 9/5-a ve son paragraf).\n- Hak sahibi, bilgi geçerliliğini kaybetmeden önce (20.12.2025) bağlayıcı alım sözleşmesi\
    \ yaptığından BTB'yi yayım\n  tarihinden itibaren **altı ay** kullanabilir (md. 9/7). Ay olarak belirlenen süre başladığı\
    \ güne tekabül eden günün mesai\n  bitiminde sona erer (md. 14/2): **15.07.2026** (Çarşamba). İthalat/ön izin belgesi\
    \ bulunmadığından belge süresi kuralı\n  uygulanmaz. Bu kullanım ithalat vergilerinin belirlenmesi amacıyla mümkündür\
    \ (md. 9/8-a).\n- Birinci parti (10.07.2026, süre içinde): 2.000.000 × %2 = **40.000 TL**. Kanunen alınması gereken vergi\
