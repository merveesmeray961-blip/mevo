    puan)


    (b) Beyanname 2''de şirketin talebinin kabul edilip edilemeyeceğini ve her kalem için vergi farkını hesaplayınız. (7 puan)


    (c) Beyanname 3''te masrafların kime ait olduğunu ve arta kalan numunelerin akıbetini açıklayınız. (5 puan)


    (d) Beyan sahibinin muayene ve numune alma sırasında hazır bulunma hakkını ve idarenin bunu zorunlu tutma yetkisini belirtiniz.
    (3 puan)

    '
  cozum: '**(a) Kısmi muayene (md. 67/1)**


    Bir beyanname kapsamı eşyanın tek kalemden oluşması ve kısmen muayene edilmesi hâlinde, muayene sonuçları beyanname kapsamı
    eşyanın tümüne uygulanır. Beyan sahibi, kısmi muayene sonuçlarının eşyanın kalan kısmı için geçerli olmadığı düşüncesindeyse
    eşyanın tamamının muayenesini talep edebilir. Şirket bu talebi yapabilir; talep edilirse tamamı muayene edilir.


    **(b) Kalemler (md. 67/2)**


    Bir beyannamenin iki veya daha fazla kalemi kapsaması hâlinde her kaleme ilişkin bilgiler ayrı bir beyan sayılır; bir
    kalemin eksik veya fazlası diğer kalemin fazla veya eksiğine mahsup edilemez. Talep **kabul edilemez**.


    - Kalem 1: fazla 1 ton -> vergi farkı 1 x 1.000 = **1.000 TL** (beyan edilenden fazla eşya).

    - Kalem 2: 1 ton eksik; eksiklik kalem 1''deki fazlalıkla mahsup edilemez, kalem 1''in farkı ayrıca değerlendirilir.


    **(c) Masraflar ve numuneler (md. 66)**


    Eşyanın muayene edileceği ve numunelerin alınacağı yerlere taşınması, gerekli elleçleme, numunelerin ambalajlanması ve
    gönderilmesine ilişkin giderler beyan sahibi tarafından karşılanır (md. 66/2). Gümrük laboratuvarlarında yapılacak veya
    hariçte yaptırılacak tahlil veya inceleme masrafı da beyan sahibine aittir (md. 66/4). Tahlilden arta kalan numuneler,
    tahlil sonuçlarının ilgilisine bildirilmesinden sonra bir ay içinde alınmadığı takdirde gümrüğe terk edilmiş sayılır (md.
    66/5); 6 hafta bir ayı aştığından numuneler **gümrüğe terk edilmiş sayılır**.


    **(d) Hazır bulunma (md. 66/3)**


    Beyan sahibi muayene ve numune alınması sırasında hazır bulunabilir; gümrük idareleri, uygun gördükleri takdirde, işlemi
    kolaylaştırmak için gerekli yardımı sağlamak üzere beyan sahibinin muayenede veya numune alımında hazır bulunmasını veya
    temsil edilmesini zorunlu tutabilir.


    Püf noktaları: (1) Tek kalem kısmi muayene tümüne uygulanır; birden çok kalemde mahsup yoktur. (2) Masraflar beyan sahibine
    aittir. (3) Numune için bir aylık süre tahlil sonucunun bildirilmesinden başlar.

