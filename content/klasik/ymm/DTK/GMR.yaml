    Düzenleme koşulları:

    - Eşya ilgili STA''nın menşe protokolü kurallarını (tamamen elde etme veya yeterli işlem) karşılamalıdır.

    - İhracatçı, gümrük idaresine menşe belgelerini sunarak sertifika talep eder.

    - Gümrük idaresi inceleyerek onaylar (imzalar ve mühürler).

    - İhracat beyannamesine eklenerek ibraz edilir.


    **(b) Doğrulama prosedürü ve hukuki sonuçlar**


    Prosedür:

    1. İthalatçı ülke gümrük idaresi doğrulama talebi gönderir.

    2. Türk gümrük idaresi ilgili STA''da belirlenen süre içinde (genellikle 6 ay) yanıt verir.

    3. Yanıt gelmezse veya doğrulanamadıysa tercihli tarife reddedilir.


    Hatalı beyanın sonuçları:

    - İthalatçı ülkede: tarife farkı, gecikme faizi ve ceza uygulanır.

    - Türkiye''de: md. 234 uyarınca idari para cezası; kasıt ispatlanırsa cezai sorumluluk da doğabilir.

    - EUR.1 iptal edilebilir; onaylı ihracatçı statüsü askıya alınabilir.

    '
