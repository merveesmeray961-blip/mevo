- id: YMM-DTK-IHI-K001
  sinav: ymm
  ders: DTK
  konu: IHI
  kazanimlar:
  - ihracat türleri ve teslim şekilleri
  - ithalat işlemleri
  - teslim şekilleri (Incoterms) ve ödeme yöntemleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Türkiye''de yerleşik ihracatçı (S) A.Ş. ile ilgili 2026 yılı işlemleri şöyledir:


    1. İmalatçı (M) Ltd. Şti., 15.01.2026 tarihinde (S) A.Ş.''ye ihraç edilmek şartıyla 2.000.000 TL bedelli mal teslim etmiş,
    faturada %20 oranında KDV hesaplamış ancak tahsil etmemiştir.

    2. (S) A.Ş., bu malların bir kısmını serbest bölgede faaliyet gösteren bir alıcıya satmış ve mallar serbest bölgeye ulaşmıştır;
    kalan kısmı yetkili gümrük antreposu işleticisine tevdi ederek yetkili gümrük antreposuna koymuştur.

    3. (S) A.Ş.''nin 2024 yılında ihracat istisnasından yararlanarak ihraç ettiği bir makine, ayniyeti değişmeden ve yurt
    dışında işlem görmeden 2026 yılında geri gelmiştir. İhracat hariçte işleme rejimi kapsamında yapılmamıştır.

    4. Şirketin son üç mali yıldaki döviz gelirleri toplamı 12 milyon USD, Temmuz 2026''daki kredi bakiyesi 10 milyon USD''dir.
    Şirket, Karar''ın 17/A maddesinin üçüncü fıkrasındaki istisnai hallere girmeyen bir döviz kredisini yurt içindeki bir
    bankadan kullanmak istemektedir.


    **İstenenler:**


    (a) (1) numaralı teslimde KDV''nin nasıl beyan edilip tecil olunacağını, terkin için ihracatın hangi süre içinde yapılması
    gerektiğini, ek süre imkânını ve ihracatın süresinde yapılmaması halinde verginin nasıl tahsil edileceğini 3065 sayılı
    KDV Kanunu''na göre açıklayınız; tecil edilecek KDV tutarını hesaplayınız. (7 puan)


    (b) (2) numaralı teslimlerin ihracat teslimi sayılıp sayılmayacağını KDV Kanunu md. 12''deki şartlar çerçevesinde değerlendiriniz.
    (5 puan)


    (c) (3) numaralı geri gelen makinenin ithalat vergileri ve ithalde KDV bakımından durumunu, muafiyet ve istisnanın şartlarıyla
    birlikte açıklayınız. (6 puan)


    (d) 32 Sayılı Karar''a göre şirketin ihracat bedellerini kullanma serbestisini belirtiniz; (4) numaralı durumda kullanabileceği
    azami döviz kredisini hesaplayınız ve kredi bakiyesi 16 milyon USD olsaydı sonucun nasıl değişeceğini açıklayınız. (7
    puan)

    '
  cozum: '**(a) İhraç kaydıyla teslim (KDVK md. 11/1-c)**


    - Tecil edilecek KDV = 2.000.000 × %20 = **400.000 TL**.

    - Bu KDV ihracatçı (S) tarafından ödenmez. İmalatçı (M) vergiyi tahsil etmez ancak ilgili dönem beyannamesinde beyan eder;
    vergi dairesince tarh ve tahakkuk ettirilerek tecil olunur.

    - Mallar, ihracatçıya teslim tarihini takip eden ay başından (01.02.2026) itibaren **3 ay** içinde ihraç edilirse tecil
    edilen vergi terkin olunur.

    - Mücbir sebep veya beklenmedik durumlarda, üç aylık sürenin dolduğu tarihten itibaren **15 gün** içinde başvuran ihracatçıya
    **3 aya kadar** ek süre verilebilir.

    - İhracat şartlara uygun gerçekleşmezse tecil olunan vergi, tahakkuk tarihinden itibaren 6183 sayılı Kanun md. 51''e göre
    gecikme zammıyla tahsil edilir. Mallar VUK''ta belirtilen mücbir sebepler nedeniyle ihraç edilemezse vergi, tecil tarihinden
    itibaren md. 48''e göre tecil faiziyle tahsil edilir.


    **(b) İhracat teslimi şartları (KDVK md. 12/1)**


    - Şart (a): Teslim yurt dışındaki müşteriye, serbest bölgedeki alıcıya, gümrüksüz satış mağazalarına veya yetkili gümrük
    antreposu işleticisine yapılmalı ya da mallar yetkili antrepo işleticisine tevdi edilmelidir.

    - Şart (b): Mal gümrük bölgesinden çıkarak dış ülkeye veya serbest bölgeye ulaşmalı ya da gümrüksüz satış mağazalarına
    veya yetkili gümrük antreposuna konulmalıdır.

    - Serbest bölgedeki alıcıya yapılan ve malın serbest bölgeye ulaştığı teslim **ihracat teslimidir**. Yetkili gümrük antreposu
    işleticisine tevdi edilip yetkili antrepoya konulan mallar da **ihracat teslimi** sayılır. Yetkili antrepo esaslarına
    uyulmazsa ziyaa uğratılan vergi, ceza ve gecikme faizinden antrepo işleticisi de müteselsilen sorumludur.


    **(c) Geri gelen eşya**


    - Gümrük Kanunu md. 168/1: serbest dolaşımdaki eşya ihraç edildikten sonra **üç yıl** içinde yeniden serbest dolaşıma
    girerse, **beyan sahibinin talebi üzerine** ithalat vergilerinden muaf tutulur (süre beklenmeyen hal veya mücbir sebeple
    uzatılabilir).

    - Md. 169: muafiyet için eşyanın ihracı sırasındaki **ayniyetinin değişmemiş** olması gerekir. Md. 168/2''ye göre hariçte
    işleme rejimiyle ihraç edilen veya ihracı bir dış ticaret önlemine konu olan eşyaya muafiyet tanınmaz; olayda bu engeller
    yoktur.

    - KDVK md. 16/1-(b): geri gelen eşyanın ithali KDV''den istisnadır. Ancak ihracat istisnasından yararlanılarak ihraç edilen
    eşyanın bu istisnadan faydalanabilmesi için **ihracat istisnasından faydalanılan miktarın gümrük idaresine ödenmesi veya
    bu miktar kadar teminat gösterilmesi** şarttır. Eşya yurt dışında işlem görseydi kazandığı değer farkı istisnaya dahil
    olmazdı (md. 16/2).


    **(d) Kambiyo**


    - 32 Sayılı Karar md. 8/1: ihracat bedellerinin tasarrufu **serbesttir**; Bakanlık ihtiyaç halinde bedellerin yurda getirilmesine
    ilişkin düzenleme yapmaya yetkilidir.

    - Kredi bakiyesi 10 milyon USD < 15 milyon USD olduğundan md. 17/A-4-(a) uygulanır: yeni kredi + mevcut bakiye ≤ son üç
    mali yılın döviz gelirleri. Yeni kredi ≤ 12 − 10 = **2 milyon USD**. Krediyi kullandıran banka bu sınıra uygunluğu kontrol
    eder (md. 17/A-4-b).

    - Bakiye 16 milyon USD olsaydı: kullanım tarihinde kredi bakiyesi 15 milyon USD veya üzerinde olanlar için döviz geliri
    şartı aranmaz (md. 17/A-3-b) ve 4. fıkradaki gelir sınırlaması yalnız 15 milyon USD altındaki bakiyeler için öngörüldüğünden,
    **bu sınırlama uygulanmaz**.

    '
