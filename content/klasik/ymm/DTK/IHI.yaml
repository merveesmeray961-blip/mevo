- id: YMM-DTK-IHI-K002
  sinav: ymm
  ders: DTK
  konu: IHI
  kazanimlar:
  - teslim şekilleri (Incoterms) ve ödeme yöntemleri
  - akreditif
  - ithalat işlemleri
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "Bursa'daki **Vadi Mobilya A.Ş.**, İtalya'daki ilişkisiz bir satıcıdan mobilya ithal edecektir. Satıcı aynı mal için\
    \ üç teklif\nvermiştir:\n\n| Teklif | Fiyat |\n|---|---|\n| EXW Milano (satıcının deposunda teslim) | 100.000 EUR |\n\
    | FOB Cenova | 102.300 EUR |\n| CIF İzmir | 106.500 EUR |\n\n- EXW teklifi seçilirse alıcının ödeyeceği giderler: Milano–Cenova\
    \ kara taşıması 2.000 EUR; Cenova limanında yükleme ve elleçleme\n  300 EUR; Cenova–İzmir navlunu 3.700 EUR; İzmir'e kadar\
    \ sigorta 500 EUR.\n- FOB teklifinde Cenova–İzmir navlunu ve sigortası (toplam 4.200 EUR) alıcıya aittir.\n- Her üç teklifte\
    \ de İzmir Limanından Bursa'daki fabrikaya taşıma (1.200 EUR) alıcıya aittir, ayrı faturalandırılır ve\n  tescilden sonra\
    \ yapılacaktır.\n- Eşya AB menşeli olup A.TR dolaşım belgesiyle gümrük vergisinden muaftır; başka ithalat vergisi yoktur.\
    \ Tescil tarihinde\n  TCMB döviz satış kuru 1 EUR = 46,00 TL, KDV oranı %20'dir; tescilden önce vergilendirilmemiş başka\
    \ gider yoktur.\n\nVadi CIF teklifini seçmiş ve Türkiye'deki (A) Bank'a gayrikabili rücu akreditif açtırmıştır. Akreditif\
    \ İtalya'daki (B) Banca\naracılığıyla satıcıya bildirilmiş, (B) Banca akreditife teyidini eklemiştir. Akreditifte son\
    \ yükleme tarihi 20.03.2026'dır;\nsatıcının ibraz ettiği konşimentoda yükleme tarihi 24.03.2026'dır.\n\nAyrıca Vadi, İngiltere'deki\
    \ bir alıcıya 05.03.2026'da fiilen ihraç ettiği mobilyaların bedelini, belgelerin 210 gün vadeli\npoliçenin kabulü karşılığında\
    \ teslim edildiği **kabul kredili vesaik mukabili** ödeme şekliyle tahsil edecektir. Sürelerde\nişlemin yapıldığı gün\
    \ sayılmayacaktır.\n\n**İstenenler:**\n\n(a) Üç teslim şeklinde masrafların ve hasar riskinin satıcıdan alıcıya geçtiği\
    \ noktaları açıklayınız; her teklif için gümrük\nkıymetini dayanaklarıyla hesaplayınız. (9 puan)\n\n(b) Gümrük yükümlülüğünün\
    \ başlama tarihini ve kur esasını belirtiniz; ithalde KDV matrahını ve KDV'yi hesaplayınız. (5 puan)\n\n(c) Akreditifin\
    \ taraflarını ve işleyişini açıklayınız; konşimentodaki yükleme tarihinin sonucunu değerlendiriniz; akreditifli\nödemeyi\
    \ vesaik mukabili ödemeden ayıran temel farkı belirtiniz. (6 puan)\n\n(d) Mevzuata göre ihracat bedellerinin yurda getirilebileceği\
    \ ödeme şekillerini sayınız; İngiltere'ye yapılan ihracatın\nbedelinin yurda getirilmesi gereken son günü belirleyiniz;\
    \ vade 150 gün olsaydı sonucun ne olacağını açıklayınız. (5 puan)\n"
  cozum: "**(a) Teslim şekilleri ve gümrük kıymeti**\n\nIncoterms, Milletlerarası Ticaret Odasınca yayımlanan ve masraf ile\
    \ hasar riskinin geçiş noktasını belirleyen teslim kurallarıdır\n(genel bilgi):\n\n| Kural | Satıcının üstlendiği | Riskin\
    \ geçişi |\n|---|---|---|\n| EXW | Malı kendi tesisinde alıcının emrine hazır etmek; yükleme, taşıma, ihracat işlemleri\
    \ alıcıya aittir | Mal satıcının tesisinde alıcının emrine hazır edildiğinde |\n| FOB | Malı yükleme limanında gemiye\
    \ yüklemek (ihracat işlemleri dahil) | Mal yükleme limanında gemiye yüklendiğinde |\n| CIF | FOB'a ek olarak varış limanına\
    \ kadar navlun ve sigortayı ödemek | Mal yükleme limanında gemiye yüklendiğinde (masraf ile risk noktaları farklıdır)\
    \ |\n\nGümrük kıymeti satış bedelidir (GK md. 24/1); Türkiye'deki **giriş liman veya yerine kadar** yapılan nakliye ve\
    \ sigorta giderleri\nile bu nakliyeyle ilgili yükleme ve elleçleme giderleri fiyata eklenir (md. 27/1-e); giriş yerine\
    \ varıştan sonraki nakliye\nayırt edilebiliyorsa eklenmez (md. 28/a):\n\n| Teklif | Hesap | Kıymet |\n|---|---|---|\n\
    | EXW | 100.000 + 2.000 + 300 + 3.700 + 500 | 106.500 EUR |\n| FOB | 102.300 + 4.200 | 106.500 EUR |\n| CIF | 106.500\
    \ (navlun ve sigorta fiyata dahil) | 106.500 EUR |\n\nİzmir–Bursa taşıması (1.200 EUR) üç teklifte de **eklenmez**. Gümrük\
    \ kıymeti her teklifte **106.500 EUR** = 106.500 × 46,00 =\n**4.899.000 TL**'dir. Ödemenin akreditifle yapılması fiilen\
    \ ödenen fiyatın parçası sayılmasını engellemez (md. 24/3-a).\n\n**(b) Yükümlülük, kur ve KDV**\n\n- Serbest dolaşıma\
    \ giriş beyannamesinin **tescil tarihinde** gümrük yükümlülüğü başlar (md. 181/1-a); yabancı para, yükümlülüğün\n  başladığı\
    \ tarihteki **TCMB döviz satış kuruyla** Türk lirasına çevrilir (md. 30). Vergiyi doğuran olay gümrük vergisine tabi\n\
    \  olmayan işlemlerde beyannamenin tescilidir (KDVK md. 10/ı).\n- Mal gümrük vergisinden muaf olduğundan KDV matrahında\
    \ sigorta ve navlun dahil **CIF değer** esas alınır (KDVK md. 21/a):\n  **4.899.000 TL**. İthalat sırasında ödenen vergi\
    \ ve tescile kadar vergilendirilmemiş gider yoktur; tescilden sonra yapılan ve\n  ayrıca faturalandırılan yurt içi taşıma\
    \ matraha girmez (md. 21/c).\n- KDV: 4.899.000 × %20 = **979.800 TL**.\n\n**(c) Akreditif**\n\n- Taraflar: **amir** (akreditifi\
    \ açtıran ithalatçı Vadi), **amir/açan banka** ((A) Bank), **lehtar** (ihracatçı İtalyan satıcı),\n  akreditifi lehtara\
    \ bildiren **ihbar bankası** ve ödeme taahhüdüne katılan **teyit bankası** ((B) Banca).\n- İşleyiş: ithalatçı akreditif\
    \ açtırır → akreditif ihbar bankası aracılığıyla lehtara bildirilir → lehtar malı yükler ve akreditifte\n  istenen belgeleri\
    \ bankaya ibraz eder → banka belgeleri inceler, şartlara uygunsa ödeme yapar veya vadeli ödemeyi kabul eder.\n  Bankalar\
    \ **malı değil belgeleri** inceler; teyitli akreditifte amir bankanın taahhüdüne ek olarak teyit bankasının ödeme taahhüdü\n\
    \  de vardır.\n- Konşimentodaki yükleme tarihi (24.03.2026) akreditifteki son yükleme tarihinden (20.03.2026) sonradır;\
    \ belgeler akreditif\n  şartlarına **uymadığından** bankaların ödeme yükümlülüğü **doğmaz** (amir uyumsuzluğu kabul etmedikçe\
    \ ödeme yapılmaz).\n- Vesaik mukabili ödemede bankalar yalnız belgelerin teslimine **aracılık eder**, **ödeme taahhüdü\
    \ vermez**; akreditifte ise\n  bankanın **ödeme taahhüdü** vardır.\n\n**(d) İhracat bedelleri**\n\n- İhracat bedelleri\
    \ şu ödeme şekillerinden biriyle yurda getirilebilir: akreditifli, vesaik mukabili, mal mukabili, kabul kredili\n  akreditifli,\
    \ kabul kredili vesaik mukabili, kabul kredili mal mukabili ve peşin ödeme (Tebliğ 2018-32/48 md. 3/2).\n- Sözleşmede\
    \ fiili ihraç tarihinden itibaren **180 günden fazla vade** öngörüldüğünden bedel **vade bitiminden itibaren 90 gün**\n\
    \  içinde getirilmelidir (md. 5/5): vade 05.03.2026 + 210 gün = 01.10.2026; son gün 01.10.2026 + 90 gün = **30.12.2026**.\n\
    - Vade 150 gün olsaydı genel kural uygulanır; bedel fiili ihraç tarihinden itibaren **180 gün** içinde getirilmelidir\
    \ (md. 3/1):\n  **01.09.2026**.\n"
