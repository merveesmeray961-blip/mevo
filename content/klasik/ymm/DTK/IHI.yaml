  soru: '(A) Makine A.Ş. (gerçek usulde KDV mükellefi) Mart 2026 vergilendirme dönemine ilişkin aşağıdaki işlemleri yapmıştır
    (tutarlar KDV hariçtir; genel KDV oranı %20''dir; istisna dışında kalan işlemler genel orana tabidir):


    | No | İşlem | Tutar (TL) |

    |---|---|---|

    | 1 | Hollanda''da yerleşik müşteriye makine satışı. Mal Mart ayında gümrük bölgesinden çıkıp Hollanda''ya ulaşmıştır.
    Malın ambalajlanması, ihracattan önce müşterinin Türkiye''deki mümessili olan ve müşteri adına hareket eden bir firma
    tarafından yapılmıştır. | 1.000.000 |

    | 2 | Bir serbest bölgede faaliyet gösteren müşteri için yapılan ve hizmetten serbest bölgede faydalanılan fason imalat
    hizmeti. | 200.000 |

    | 3 | Almanya''da yerleşik bir firmaya, firmanın Türkiye''deki fabrikasının üretim hattında kullanılmak üzere verilen
    mühendislik danışmanlığı hizmeti. | 300.000 |

    | 4 | Türkiye''de yerleşik bir firmaya makine satışı. | 500.000 |

    | 5 | 4458 sayılı Gümrük Kanununun 95 inci maddesinin (1) numaralı fıkrasına göre faaliyette bulunan bir gümrüksüz satış
    mağazasında satılmak üzere mağazanın deposuna yapılan mal teslimi; mallar depoya konulmuştur. | 120.000 |

    | 6 | Gürcistan''daki bir müşteriye verilen ve hizmetten Gürcistan''da faydalanılan bakım hizmeti. | 150.000 |


    Mart 2026 döneminde kanunen indirimi kabul edilen ve faturalarda gösterilen yüklenilen KDV toplamı 420.000 TL''dir; önceki
    dönemlerden devreden KDV yoktur.


    **İstenenler:**


    (a) Her işlem için KDV istisnasının uygulanıp uygulanmayacağını, dayanağı olan şartları 3065 sayılı Kanunun ilgili hükümleriyle
    belirtiniz. (12 puan)


    (b) Mart 2026 dönemi için hesaplanan KDV''yi, indirilecek KDV''yi ve indirilemeyen KDV tutarını bulunuz; bu tutarın iadesinin
    hangi hükme dayandığını belirtiniz. (6 puan)


    (c) (b)''de bulduğunuz indirilemeyen KDV''nin iadesi için talebin en geç hangi tarihe kadar yapılması gerektiğini gerekçesiyle
    belirtiniz. (7 puan)

    '
  cozum: '**(a) İşlemlerin değerlendirilmesi**


    | No | İstisna? | Gerekçe |

    |---|---|---|

    | 1 | **Evet**, ihracat teslimi | Teslim yurt dışındaki müşteriye yapılmış ve mal gümrük bölgesinden çıkarak dış ülkeye
    vasıl olmuştur (md. 12/1-a ve b). Malın ihraç edilmeden önce yurt dışındaki alıcı adına hareket eden yurt içindeki firma
    tarafından işlenmesi (ambalajlanması) durumu değiştirmez (md. 12/1-b). İstisna: md. 11/1-a. |

    | 2 | **Evet** | Serbest bölgelerdeki müşteriler için yapılan fason hizmetler istisnadır (md. 11/1-a). Hizmet serbest
    bölgede faaliyet gösteren müşteri için yapılmış ve hizmetten serbest bölgelerde faydalanılmıştır (md. 12/3-a, b). |

    | 3 | **Hayır**, KDV''ye tabi | Hizmet yurt dışındaki müşteri için yapılmış olsa da (md. 12/2-a) hizmetten Türkiye''de
    faydalanıldığı için md. 12/2-b şartı sağlanmamıştır. |

    | 4 | **Hayır**, KDV''ye tabi | Yurt içi teslimdir. |

    | 5 | **Evet**, ihracat teslimi | Gümrüksüz satış mağazalarında satılmak üzere bu mağazalara veya depolarına yapılan teslim
    ihracat teslimi sayılır; mal mağazaya veya deposuna konulmuştur (md. 12/1-a ve b). |

    | 6 | **Evet** | Hizmet yurt dışındaki müşteri için yapılmış ve hizmetten yurt dışında faydalanılmıştır (md. 12/2-a, b;
    md. 11/1-a). |


    İstisna kapsamındaki işlemler: 1.000.000 + 200.000 + 120.000 + 150.000 = 1.470.000 TL. Vergiye tabi işlemler: 300.000
    + 500.000 = 800.000 TL.


    **(b) Dönem KDV hesabı**


    - Hesaplanan KDV = 800.000 × %20 = **160.000 TL**

    - İndirilecek KDV = **420.000 TL** (md. 32/1: md. 11 kapsamındaki istisna işlemlerle ilgili faturalardaki KDV, mükellefin
    vergiye tabi işlemleri üzerinden hesaplanacak KDV''den indirilir)

    - İndirilemeyen KDV = 420.000 − 160.000 = **260.000 TL**


    Hesaplanan verginin indirilecek vergiden az olması hâlinde indirilemeyen KDV, md. 32/1 uyarınca belirlenecek esaslara
    göre iade olunur.


    **(c) İade talep süresi**


    İndirilemeyen KDV, işlemin gerçekleştiği dönemi izleyen ikinci takvim yılının sonuna kadar talep edilmesi şartıyla iade
    olunur (md. 32/1). İşlemler Mart 2026''da gerçekleşmiştir; izleyen birinci takvim yılı 2027, ikinci takvim yılı 2028''dir.
    Talep en geç **31.12.2028**''e kadar yapılmalıdır.

    '
