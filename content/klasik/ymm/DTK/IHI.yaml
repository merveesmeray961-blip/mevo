    - Süresi içinde kapatılmayan hesaplar bankalarca 5 iş günü içinde vergi dairesine ihbar edilir (md. 8/3): 04, 05, 06,
    07, 10 Ağustos → son gün **10.08.2026**.

    - Vergi dairesi, ihbarı müteakip 10 iş günü içinde 90 gün süreli ihtarname gönderir (md. 8/4): 11, 12, 13, 14, 17, 18,
    19, 20, 21, 24 Ağustos → son gün **24.08.2026**.

    - 21.08.2026''da ulaşan ihtarnamedeki 90 günlük süre: 21.08.2026 + 90 gün = **19.11.2026**.

    - Bu süre içinde hesapların kapatılması (bedelin getirilmesi veya terkin) ya da md. 9''daki mücbir sebep hâllerinin veya
    haklı durumun belgelenmesi gerekir (md. 8/4). Banka terkini de bu ihtarname süresi içinde yapılır (md. 10/3).


    **(c) GB-4: konkordato**


