  kazanimlar:
  - konsinye ihracat esasları ve süreleri
  - kayda bağlı ihracat
  - alıcısı tarafından kabul edilmeyen mallar ve Birlik onay kodu
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '(K) Ahşap Mamulleri Ltd. Şti. (Türkiye''de yerleşik ihracatçı), 2026 yılında aşağıdaki ihracat işlemlerini yürütmüştür.
    Aksi belirtilmedikçe "gün" takvim günüdür ve sürelerde başlangıç günü hesaba katılmaz.


    | No | İşlem |

    |---|---|

    | 1 | Mobilya partisi (Parti A) için konsinye ihracat başvurusu İhracatçı Birlikleri Genel Sekreterliğince 02.03.2026''da
    onaylanmış, gümrük beyannamesi 30.03.2026''da gümrük idaresine sunulmuş ve mal 31.03.2026''da ihraç edilmiştir. Parti
    A''nın kesin satışı 15.02.2027''de yapılmıştır. İhracatçı Birlikleri Genel Sekreterliğine kesin satışın bildirilmesi 11.06.2027''de
    gerçekleşmiştir. |

    | 2 | Parti B için onaylı konsinye gümrük beyannamesiyle mal 16.04.2026''da ihraç edilmiştir; kesin satış yapılamamış,
    firma haklı ve zorunlu nedenlerle süre uzatımı talep etmiştir. |

    | 3 | Parti C, posta ve hızlı kargo yoluyla basitleştirilmiş gümrük beyannamesiyle 05.05.2026''da konsinye olarak gönderilmiştir;
    kesin satış yapılamamış, firma süre uzatımı talep etmiştir. |

    | 4 | Kayda bağlı ihracata konu bir mal için gümrük beyannamesi İhracatçı Birlikleri Genel Sekreterliğince 10.06.2026''da
    kayda alınmış; beyanname gümrük idaresine 13.07.2026''da sunulmuştur (kayıt meşruhatı düşülmüş bir miktar kısıtlaması
    yoktur ve Bakanlıkça farklı bir süre belirlenmemiştir). |

    | 5 | Alıcısı Parti D''yi kabul etmemiştir. Firma, (i) aynı malı aynı bedel ve şartlarla geri getirip yeniden ihraç etmek,
    (ii) başka bir alıcıya daha düşük bedelle satmak istemekte; ayrıca (iii) bozulabilir nitelikteki Parti E''yi kabul etmeyen
    alıcıdan dönen malın yurt dışındayken satışını planlamaktadır. |


    **İstenenler:**


    (a) Parti A için gümrük beyannamesinin gümrük idaresine sunulması gereken son günü, kesin satışın İhracatçı Birlikleri
    Genel Sekreterliğine ve aracı bankaya bildirilmesi gereken son günü ve kesin satışın yapılması gereken son günü belirtiniz;
    firmanın bildirim ve satış yönünden durumunu, İhracatçı Birlikleri Genel Sekreterliğinin kesin satış bildiriminden sonraki
    yükümlülüğü ve son tarihi ile birlikte değerlendiriniz. (8 puan)


    (b) Parti B ve Parti C için kesin satışın yapılabileceği en geç tarihi ve süre uzatımının mümkün olup olmadığını açıklayınız;
    Parti B kesin satış yapılamazsa ne yapılması gerektiğini belirtiniz. (6 puan)


    (c) Kayda bağlı ihracat işlemindeki sürenin aşılıp aşılmadığını değerlendiriniz; gümrük idaresinin otomasyona geçmiş olması
    hâlinde Birlik Onay Kodunun doğrulanmaması durumunda ne olacağını belirtiniz. (4 puan)


    (d) Parti D ve E için istenen işlemlerin hangi makamlarca ve hangi belgelere göre sonuçlandırılacağını açıklayınız. (6
    puan)

    '
  cozum: '**(a) Parti A**


    - Onaylı konsinye gümrük beyannamesinin otuz gün içinde gümrük idarelerine sunulması gerekir (md. 9/2): 02.03.2026 + 30
    gün = **01.04.2026**. Beyanname 30.03.2026''da sunulduğundan süre içindedir.

    - Kesin satıştan sonraki yüz yirmi gün içinde durumun, kesin satış faturası veya örneği ve gerekli diğer belgelerle birlikte
    hem izni veren İhracatçı Birlikleri Genel Sekreterliğine hem aracı bankaya bildirilmesi gerekir (md. 9/3): 15.02.2027
    + 120 gün = **15.06.2027**. Bildirim 11.06.2027''de yapıldığından süre içindedir.

    - Konsinye olarak gönderilen malın ihraç tarihinden itibaren bir yıl içinde kesin satışının yapılması gerekir (md. 9/5):
    31.03.2026 + 1 yıl = **31.03.2027**. Kesin satış 15.02.2027''de yapıldığından süre içindedir.

    - Genel Sekreterlik, kesin satışın kendisine bildirilmesinden itibaren beş gün içinde bilgileri aracı bankaya ve konsinye
    ihracata ilişkin gümrük beyannamesinin tescil edildiği gümrük idaresine bildirir (md. 9/4): 11.06.2027 + 5 gün = **16.06.2027**.


    **(b) Parti B ve C**


