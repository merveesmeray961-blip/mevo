  soru: "2026 yılında yaşanan aşağıdaki olayları kambiyo mevzuatı yönünden değerlendirmeniz istenmektedir (iş günleri Pazartesi–Cuma;\n\
    ziynet eşyalarında ticari amaç yoktur):\n\n1. Türkiye'de yerleşik Bay (A), yurt dışına çıkarken üzerinde 250.000 TL ile\
    \ 12.000 EUR efektif taşımakta olup gümrük idaresine\n   nakit beyan formu vermemiştir.\n2. Bayan (B), Türkiye'ye girişte\
    \ beyan ettiği kendisine ait 20.000 USD değerindeki ziynet eşyasını çıkışta yanında götürmektedir.\n   Bayan (C), Türkiye'de\
    \ satın aldığı ve faturasıyla tevsik ettiği 18.000 USD değerindeki ziynet eşyasını çıkarmak istemektedir.\n   Bay (D)\
    \ ise girişte beyan etmediği ve Türkiye'de satın alındığını tevsik edemediği 16.000 USD değerindeki ziynet eşyasını\n\
    \   çıkarmak istemektedir.\n3. **(E) Kuyum A.Ş.** (kıymetli madenler aracı kuruluşu değildir) yurt dışından 10 kg standart\
    \ dışı işlenmemiş altını **akreditifli\n   ödeme** şekliyle ithal etmek istemektedir. Şirket, dahilde işleme izni alması\
    \ hâlinde durumun değişip değişmeyeceğini de\n   sormaktadır.\n4. **(F) Kıymetli Madenler Aracı Kuruluşu A.Ş.**, 14.04.2026\
    \ (Salı) tarihinde gümrük beyannamesiyle (dahilde işleme kapsamı\n   dışında) standart işlenmemiş altın ithal etmiştir.\n\
    5. (F), kuyum işletmesi olmayan ve vergi levhasında kıymetli maden ticareti yazmayan yerleşik gerçek kişi (G)'ye standart\
    \ dışı\n   işlenmemiş altın satmak istemektedir. Gerçek kişi (H), bir yetkili müesseseden Darphane üretimi çeyrek altın\
    \ almak;\n   gerçek kişi (I) ise bir kuyumcudan pırlanta taşlı altın yüzük almak istemektedir.\n6. Yerleşik yatırımcı\
    \ (J), New York borsasında işlem gören hisse senetlerini Sermaye Piyasası Kurulunca yetkilendirilmiş bir aracı\n   kurum\
    \ vasıtasıyla satın almak ve alış bedelini yurt dışına transfer etmek istemektedir.\n\n**İstenenler:**\n\n(a) 1 ve 2 numaralı\
    \ olayları değerlendiriniz; 1 numaralı olayda gümrük idaresince yapılacak işlemleri açıklayınız. (9 puan)\n\n(b) 3 ve\
    \ 4 numaralı olayları değerlendiriniz; 4 numaralı olayda yükümlülüğün yerine getirilmesi gereken son günü belirleyiniz\
    \ ve\nithalat dahilde işleme kapsamında yapılsaydı ne değişeceğini açıklayınız. (9 puan)\n\n(c) 5 ve 6 numaralı olayları\
    \ değerlendiriniz. (7 puan)\n"
  cozum: "**(a) Türk parası, döviz ve ziynet eşyası**\n\n- Türk parasının yurttan ihracı serbesttir; ancak **185.000 TL'yi\
    \ aşan** Türk parasının yurt dışına çıkarılması Bakanlıkça\n  belirlenen esaslara bağlıdır (Karar md. 3/a, 3/d). Döviz\
    \ ihracı serbesttir; **10.000 Avro veya eşitini aşan** efektifin\n  çıkarılması Bakanlık esaslarına bağlıdır (md. 4/a,\
    \ 4/f).\n- Bu esaslara göre yolcu beraberi 185.000 TL'yi aşan Türk parası ve 10.000 Avro veya eşitini aşan döviz çıkışlarında\
    \ Ticaret\n  Bakanlığınca yayımlanan **nakit beyan formuyla** beyanda bulunulur (Tebliğ 2008-32/34 md. 3/5, 4/2). Bay\
    \ (A)'nın her iki tutarı\n  da sınırı aşmaktadır.\n- Beyanda bulunulmadığının tespiti hâlinde söz konusu değerler gümrük\
    \ idaresince **muhafaza altına alınır**, durum şüpheli kabul\n  edilerek **Mali Suçları Araştırma Kurulu Başkanlığına**\
    \ bildirilir; ayrıca 1567 sayılı Kanun md. 3/1 uyarınca işlem yapılabilmesi\n  için **Cumhuriyet savcılığına** bildirimde\
    \ bulunulur (Tebliğ md. 3/6, 4/3).\n- Yolcular, beraberlerindeki kendilerine ait, değeri **15.000 USD'yi aşmayan** ve\
    \ ticari amaç taşımayan ziynet eşyasını serbestçe\n  getirip götürebilir; daha fazla değerdeki ziynetin çıkarılması **girişte\
    \ beyan edilmiş olmasına** veya **Türkiye'de satın\n  alındığının tevsikine** bağlıdır (Karar md. 7/5).\n  - (B): girişte\
    \ beyan edilmiş → çıkarabilir.\n  - (C): Türkiye'de alındığı tevsik edilmiş → çıkarabilir.\n  - (D): 16.000 USD sınırı\
    \ aşar, iki şartı da sağlamaz → **serbestçe çıkaramaz**.\n\n**(b) İşlenmemiş kıymetli maden ithali**\n\n- Standart ve\
    \ standart dışı işlenmemiş kıymetli madenlerin ithali, Merkez Bankası saklı kalmak üzere **yalnız kıymetli madenler\n\
    \  aracı kuruluşlarınca** yapılır (Karar md. 7/2-b) → (E) dahilde işleme dışında ithalat **yapamaz**.\n- Dahilde İşleme\
    \ Rejimi Kararı kapsamında **standart dışı** işlenmemiş kıymetli maden ithali **serbesttir** (Karar md. 7/2-ç)\n  → (E)\
    \ dahilde işleme izniyle bu 10 kg standart dışı altını kendisi ithal edebilir. Standart işlenmemiş altın söz konusu\n\
    \  olsaydı dahilde işleme kapsamında da ithalat yalnız kıymetli madenler aracı kuruluşlarınca yapılabilirdi (md. 7/2-c).\n\
    - İşlenmemiş kıymetli madenler yalnız **peşin, mal mukabili ve bedelsiz** ödeme şekilleriyle ithal edilebilir (Tebliğ\
    \ md. 6/6) →\n  **akreditifli ödeme mümkün değildir**.\n- (F): Aracı kuruluşlar ithal ettikleri standart ve standart dışı\
    \ işlenmemiş kıymetli madenleri **üç iş günü** içinde **Borsa\n  İstanbul A.Ş.'ye teslim** etmek zorundadır (md. 7/2-b):\
    \ 15, 16, 17 Nisan → son gün **17.04.2026 (Cuma)**. İthal edilen\n  işlenmemiş madenlerin yurt içindeki ilk satışı Borsa\
    \ İstanbul'da yapılır (md. 7/6).\n- İthalat dahilde işleme kapsamında yapılsaydı Borsa'ya **teslim şartı aranmaz**; ancak\
    \ üç iş günü içinde Borsa'ya **yazılı bilgi**\n  verilmesi zorunludur (md. 7/2-d).\n\n**(c) Yurt içi alım satım ve menkul\
    \ kıymet**\n\n- (G): Ticaret Bakanlığınca yetkilendirilmiş kuyum işletmeleri dışındaki yerleşik gerçek kişilere **standart\
    \ dışı işlenmemiş\n  kıymetli maden satılamaz** (md. 7/4-c) → satış yapılamaz.\n- (H): Yerleşik kişilerin Darphane üretimi\
    \ basılı kıymetli madenleri **yetkili müesseselerden** almaları serbesttir (md. 7/4-f);\n  B grubu yetkili müesseseler\
    \ de Darphane üretimi ziynet ve sikke altın alım satımı yapabilir (Tebliğ 2018-32/45 md. 4/1-ç).\n- (I): Basılı ve çekili\
    \ kıymetli madenler dışındaki işlenmiş kıymetli madenler, taşlar ve eşyaların yurt içinde alım satımı\n  **serbesttir**\
    \ (md. 7/4-g).\n- (J): Menkul kıymetlerin yurda giriş ve çıkışı serbesttir (md. 15/1). Yerleşik kişilerin bankalar ve\
    \ sermaye piyasası mevzuatına\n  göre yetkili aracı kurumlar vasıtasıyla yurt dışı piyasalarda işlem gören menkul kıymetleri\
    \ satın almaları ve alış bedellerini\n  **bankalar aracılığıyla** yurt dışına transfer ettirmeleri serbesttir (md. 15/4-ii;\
    \ Tebliğ 2008-32/34 md. 9/1).\n"
