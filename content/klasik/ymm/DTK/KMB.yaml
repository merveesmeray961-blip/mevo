- id: YMM-DTK-KMB-K004
  sinav: ymm
  ders: DTK
  konu: KMB
  kazanimlar:
  - sermaye hareketleri ve krediler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Aşağıdaki kişilerin tamamı Türkiye'de yerleşiktir (F7 hariç):\n\n- **F1 – Ankara İnşaat A.Ş.:** Son üç mali yılda\
    \ döviz geliri yoktur. Uluslararası ilana çıkılan yurt içi bir ihaleyi kazanmıştır;\n  bu işle ilgili olarak yurt içindeki\
    \ bir bankadan 8 milyon USD döviz kredisi kullanmak istemektedir.\n- **F2 – Bursa Tekstil A.Ş.:** Döviz geliri yoktur.\
    \ Bir bankanın Türkiye'deki şubesinde bulunan 2 milyon USD döviz mevduatını\n  teminat göstererek (i) yurt içindeki bu\
    \ bankadan 2 milyon USD, alternatif olarak (ii) yurt dışındaki bir bankadan 2 milyon USD\n  döviz kredisi kullanmak istemektedir.\
    \ Şirket Karar md. 17/3'te sayılan başka bir istisna kapsamında değildir.\n- **F3 – Bay (H):** Gerçek kişidir; konut almak\
    \ için yurt içindeki bir bankadan EUR kredisi kullanmak istemektedir.\n- **F4 – İzmir Gıda A.Ş.:** Döviz gelirleri 2023'te\
    \ 1,8; 2024'te 2,2; 2025'te 2,0 milyon USD'dir. Kullanım tarihinde döviz kredisi\n  bakiyesi 4,5 milyon USD'dir. Md. 17/3'teki\
    \ istisnalara girmeyen 3 milyon USD tutarında bir krediyi yurt dışındaki bir bankadan\n  kullanmak istemektedir.\n- **F5\
    \ – Konya Makine A.Ş.:** Almanya'da şirket kurmak için 500.000 EUR nakdi sermayeyi bankası aracılığıyla transfer edecektir.\n\
    \  Ayrıca kurulacak şirketin bir Alman bankasından kullanacağı krediye, Alman bankasını muhatap kefalet verecektir.\n\
    - **F6 – Kayseri Mobilya A.Ş.:** Yurt içindeki bir bankadan dövize endeksli Türk lirası kredisi kullanmak istemektedir.\n\
    - **F7 – (P) GmbH:** Yurt dışında yerleşik yabancı yatırımcıdır; Türkiye'deki bağlı ortaklığından elde ettiği net kâr\
    \ payını\n  Almanya'ya transfer etmek istemektedir.\n\n**İstenenler:**\n\n(a) F1, F2, F3 ve F6'nın taleplerini 32 sayılı\
    \ Karar md. 17 ve 17/A çerçevesinde değerlendiriniz. (8 puan)\n\n(b) F4'ün yurt dışından kullanabileceği azami döviz kredisini\
    \ hesaplayınız; kredi bakiyesi kullanım tarihinde 16 milyon USD\nolsaydı sonucun nasıl değişeceğini, sınıra uygunluğu\
    \ kimin kontrol edeceğini ve bankaların yurt dışı şubelerince\nkullandırılan kredilerde aşımın sonradan anlaşılmasının\
    \ sonucunu açıklayınız. (7 puan)\n\n(c) F5'in sermaye ihracını ve kefaletini, ilgili bildirim yükümlülükleriyle birlikte;\
    \ F7'nin transfer talebini değerlendiriniz.\n(10 puan)\n"
  cozum: "**(a) Döviz kredisi talepleri**\n\n- **F1:** Döviz geliri olmayanlar yurt içinden döviz kredisi temin edemez; ancak\
    \ **uluslararası ilana çıkılan yurt içi ihaleyi\n  kazananların** bu faaliyetlerle ilgili kredilerinde döviz geliri şartı\
    \ aranmaz (md. 17/A-3-ç). 8 milyon USD kullanabilir.\n- **F2 (i):** Bankaların Türkiye'deki şubelerinde **teminat olarak\
    \ bulundurulan döviz** tutarını geçmemek üzere döviz geliri\n  şartı aranmaz (md. 17/A-3-d) → yurt içinden **2 milyon\
    \ USD kullanabilir**.\n- **F2 (ii):** Yurt dışından kredide istisnalar md. 17/3'te sayılır ve döviz teminatı istisnası\
    \ **yoktur**; döviz geliri olmayan\n  F2 yurt dışından döviz kredisi **temin edemez** (md. 17/3).\n- **F3:** Türkiye'de\
    \ yerleşik **gerçek kişilerce** yurt içinden döviz kredisi kullanılamaz (md. 17/A-6).\n- **F6:** Türkiye'de yerleşik kişilere\
    \ **dövize endeksli kredi** kullandırılamaz (md. 17/A-7).\n\n**(b) F4: sınır**\n\n- Döviz geliri olan ve kullanım tarihinde\
    \ kredi bakiyesi **15 milyon USD'nin altında** olanların kullanmak istediği kredi ile mevcut\n  bakiye toplamı **son üç\
    \ mali yılın döviz gelirleri toplamını** aşamaz (md. 17/4-a).\n  - Son üç yıl döviz geliri: 1,8 + 2,2 + 2,0 = 6,0 milyon\
    \ USD\n  - Kullanılabilecek azami tutar: 6,0 − 4,5 = **1,5 milyon USD** (3 milyon USD talebinin 1,5 milyon USD'si sınırı\
    \ aşar)\n- Bakiye **16 milyon USD** olsaydı kullanım tarihinde bakiyesi 15 milyon USD veya üzerinde olanlarda döviz geliri\
    \ şartı aranmaz\n  (md. 17/3-b); 3. fıkra kapsamındaki kredilerde 4. fıkra uygulanmaz (md. 17/5) → **3 milyon USD'nin\
    \ tamamı** kullanılabilir.\n- Temin edilen kredilerin bankalar aracılığıyla kullanılması zorunludur (md. 17/2); **aracılık\
    \ yapan bankalar** sınıra uygunluğu\n  kontrol eder (md. 17/4-b). Bankaların yurt dışı şubelerince (off-shore dahil, serbest\
    \ bölge şubeleri hariç) kullandırılan kredi\n  bakiyesinin son üç yılın döviz gelirini aştığı sonradan anlaşılırsa aşıma\
    \ neden olan kısım **geri çağrılır veya Türk lirası\n  krediye dönüştürülür** (md. 17/4-c).\n\n**(c) Sermaye ihracı, kefalet,\
    \ kâr transferi**\n\n- Yerleşik kişilerin yurt dışında şirket kurmak için **nakdi sermayeyi bankalar aracılığıyla** ihraç\
    \ etmeleri serbesttir (md. 13/1).\n  **Bankalar** (ayni sermayede gümrük idareleri) sermaye ihraç eden yerleşik kişileri\
    \ her bir işlem tarihinden itibaren **30 gün**\n  içinde Hazine ve Maliye Bakanlığına ve Ticaret Bakanlığına bildirir\
    \ (md. 13/3).\n- Şirket, ilk nakdi sermaye ihracını müteakip **üç ay** içinde Ticaret Bakanlığı internet adresindeki bilgi\
    \ formunu doldurarak\n  Hazine ve Maliye Bakanlığına ve Ticaret Bakanlığına gönderir; her takvim yılını müteakip üç ay\
    \ içinde formu güncelleyerek\n  Ticaret Bakanlığına gönderir; yurt dışındaki şirketin tasfiyesi veya devri hâlinde de\
    \ üç ay içinde bilgi verir (Tebliğ\n  2008-32/34 md. 10).\n- Yerleşik kişilerin, Türkiye'de ve dışarıda yerleşik kişiler\
    \ lehine **dışarıda yerleşik kişileri muhatap** garanti ve kefalet\n  vermeleri serbesttir (md. 18/1). Bankalar dışındaki\
    \ yerleşik kişiler, dışarıda yerleşik kişilere hitaben verdikleri garanti ve\n  kefaletleri **düzenleme tarihinden itibaren\
    \ 30 gün** içinde Bakanlığa bildirir (md. 18/5).\n- **F7:** Yabancı yatırımcıların Türkiye'deki faaliyetlerinden doğan\
    \ **net kâr ve temettüleri** bankalar aracılığıyla yurt dışına\n  **serbestçe** transfer edilebilir (md. 12/2).\n"
