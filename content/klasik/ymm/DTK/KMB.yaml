- id: YMM-DTK-KMB-K001
  sinav: ymm
  ders: DTK
  konu: KMB
  kazanimlar:
  - ihracat bedellerinin yurda getirilmesi
  - 32 sayılı Karar genel esaslar
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Zümrüt Dış Ticaret A.Ş.** (Türkiye''de yerleşik) 2026 yılında aşağıdaki ihracatları gerçekleştirmiştir:


    | No | İşlem | Bilgi |

    |---|---|---|

    | 1 | Mal mukabili ödemeli ihracat | Fiili ihraç 15.01.2026; bedel 200.000 USD; bedel 10.08.2026''da aracı bankaya gelmiştir
    |

    | 2 | Konsinye ihracat | Fiili ihraç 01.02.2026; kesin satış 22.04.2026 |

    | 3 | Uluslararası fuarda bedelli satılmak üzere gönderilen mal | Gönderim 10.04.2026; fuar 05.05.2026–09.05.2026; mallar
    fuarda satılmıştır |

    | 4 | Kabul kredili vesaik mukabili ödemeli ihracat | Fiili ihraç 01.03.2026; satış sözleşmesinde bedel için 240 gün vade
    öngörülmüştür |

    | 5 | Yurt dışında üstlenilen inşaat işi için müteahhit firma sıfatıyla yapılan ihracat | Fiili ihraç 10.02.2026 |

    | 6 | Geçici ihracat | Sergilenmek üzere geçici ihraç edilen makine, verilen süre (30.06.2026) dolmadan 16.06.2026''da
    yurt dışında satılmıştır |

    | 7 | Peşin döviz | Yurt dışındaki alıcıdan 05.01.2026''da peşin döviz alınmıştır (dahilde işleme izin belgesi veya vergi,
    resim, harç istisnası belgesi kapsamında değildir) |


    Şirketin ayrıca aşağıdaki açık ihracat hesapları bulunmaktadır (tutarlar her bir gümrük beyannamesi itibarıyladır):


    | Hesap | Beyanname tutarı | Noksanlık | Açıklama |

    |---|---|---|---|

    | T1 | 80.000 USD | 6.000 USD | Varış yerinde tespit edilen kalite farkı |

    | T2 | 400.000 USD | 35.000 USD | Sigorta bedelinden kaynaklanan noksanlık dahil |

    | T3 | 1.500.000 USD | 140.000 USD | Malların bir kısmının hasara uğradığı sigorta şirketinden alınan belgeyle tevsik
    edilmiştir |

    | T4 | 3.000.000 USD | 250.000 USD | İthalatçı firmanın iflası yetkili merci belgesiyle tevsik edilmiştir |


    Sürelerde işlemin yapıldığı gün sayılmayacaktır (32 sayılı Karar md. 22). İş günleri Pazartesi–Cuma''dır. Kabahatin

    işlendiği tarihte TCMB döviz satış kuru 1 USD = 42,00 TL kabul edilecektir.


    **İstenenler:**


    (a) 2–6 numaralı ihracatlarda bedelin yurda getirilmesi gereken son günü, 7 numaralı işlemde ise ihracatın yapılması gereken

    son günü dayanaklarıyla belirleyiniz. (10 puan)


    (b) 1 numaralı ihracatta bedelin getirilme süresini; bedelin geç gelmesi nedeniyle aracı banka ve vergi dairesince yapılacak

    işlemleri ve sürelerini; mücbir sebep ve haklı durumlarda ek süre imkânını açıklayınız. Bedel hiç getirilmeseydi 1567
    sayılı

    Kanuna göre verilecek idari para cezasını hesaplayınız; bedel ceza kararı kesinleşmeden getirilseydi cezanın üst sınırını

    belirtiniz. (9 puan)


    (c) T1–T4 hesaplarının terkin edilerek kapatılması için yetkili mercii belirleyiniz. (6 puan)

    '
  cozum: "**(a) Özelliği olan ihracatta süreler (Tebliğ 2018-32/48)**\n\n| No | Kural | Son gün |\n|---|---|---|\n| 2 | Konsinye\
    \ ihracatta bedel **kesin satışı müteakip 180 gün** içinde getirilir (md. 5/2) | 22.04.2026 + 180 = **19.10.2026** |\n\
    | 3 | Fuar ve sergilere bedelli satılmak üzere gönderilen malda **fuarın bitimini müteakip 180 gün** (md. 5/2) | 09.05.2026\
    \ + 180 = **05.11.2026** |\n| 4 | Sözleşmede fiili ihraçtan itibaren 180 günden fazla vade varsa **vade bitiminden itibaren\
    \ 90 gün** (md. 5/5) | Vade 01.03.2026 + 240 = 27.10.2026; + 90 = **25.01.2027** |\n| 5 | Yurt dışı müteahhit ihracatında\
    \ **365 gün** (md. 5/1) | 10.02.2026 + 365 = **10.02.2027** |\n| 6 | Geçici ihraç edilen malın verilen süre içinde satılması\
    \ hâlinde **kesin satış tarihinden itibaren 90 gün** (md. 5/3) | 16.06.2026 + 90 = **14.09.2026** |\n| 7 | Peşin döviz\
    \ karşılığında ihracat **24 ay** içinde yapılır (md. 4/1) | **05.01.2028** |\n\n7 numaralı işlemde süresinde ihracat yapılmaz\
    \ veya peşin döviz tek seferde iade edilmezse peşin döviz **prefinansman\nhükümlerine** tabi olur (md. 4/2).\n\n**(b)\
    \ 1 numaralı ihracat**\n\n- İhracat bedelleri ithalatçının ödemesini müteakip doğrudan ve gecikmeksizin aracı bankaya\
    \ getirilir; süre **fiili ihraç\n  tarihinden itibaren 180 günü** geçemez (md. 3/1): 15.01.2026 + 180 = **14.07.2026**.\
    \ Karar, ihracat bedellerinin tasarrufunu\n  serbest bırakmış, getirilmesine ilişkin düzenleme yetkisini Bakanlığa vermiştir\
    \ (32 sayılı Karar md. 8/1).\n- Bedelin süresinde getirilmesinden ve hesabın kapatılmasından **ihracatçı** sorumludur;\
    \ aracı banka bedelin getirilmesini\n  izler (md. 6/1, 6/3).\n- Süresinde kapatılmayan hesap aracı bankaca **5 iş günü**\
    \ içinde ilgili vergi dairesine yazılı olarak ihbar edilir (md. 8/3):\n  15, 16, 17, 20, 21 Temmuz → en geç **21.07.2026**.\
    \ Vergi dairesi ihbarı müteakip **10 iş günü** içinde hesabın kapatılması için\n  **90 gün süreli ihtarname** gönderir;\
    \ bu süre içinde hesap kapatılmalı veya mücbir sebep ya da haklı durum belgelenmelidir\n  (md. 8/4). Bedel 10.08.2026'da\
    \ geldiğinden hesap bu süreç içinde kapatılır ve banka **İhracat Bedeli Kabul Belgesi**\n  düzenler (md. 8/1-2).\n- Mücbir\
    \ sebeplerde sebep devam ettikçe **altışar aylık** ek süre verilir (md. 8/5); haklı durumlarda **altı aya kadar** ek süre\n\
    \  üçer aylık devreler hâlinde vergi dairesince, altı aydan sonrası Bakanlıkça verilir (md. 8/6); 24 aylık ek sürenin\
    \ sonunda\n  talepler Bakanlıkça sonuçlandırılır (md. 8/7).\n- Bedel hiç getirilmeseydi, alacağını kararlardaki süre içinde\
    \ yurda getirmeyene yurda getirmekle yükümlü olduğu kıymetlerin\n  rayiç bedelinin **%5'i** kadar idari para cezası verilir\
    \ (1567 sayılı Kanun md. 3): 200.000 × 42,00 = 8.400.000 TL;\n  8.400.000 × %5 = **420.000 TL**. Yabancı paranın değeri\
    \ fiil tarihindeki TCMB döviz satış kuruyla hesaplanır.\n- Ceza kararı kesinleşinceye kadar alacağını getirene md. 3'ün\
    \ birinci fıkrasına göre ceza verilir; ancak bu ceza yurda\n  getirilmesi gereken paranın **%2,5'inden** (8.400.000 ×\
    \ %2,5 = **210.000 TL**) fazla olamaz. Karar mercii Cumhuriyet\n  savcısıdır; cezaya gecikme faizi uygulanır ve beş yıl\
    \ içinde tekerrürde ceza iki kat uygulanır (1567 sayılı Kanun md. 3).\n\n**(c) Terkin (md. 10)**\n\n- **T1:** 30.000 USD'ye\
    \ kadar noksanlığı olan hesaplar, ödeme şekline ve beyanname tutarına oranına bakılmaksızın **doğrudan\n  bankalarca**\
    \ terkin edilir (md. 10/1-a).\n- **T2:** Noksanlık 30.000 USD'den yüksek, 100.000 USD'yi aşmıyor ve beyanname bedelinin\
    \ %10'una kadar (35.000 / 400.000 =\n  %8,75; sigorta kaynaklı noksanlık dahil) → **doğrudan bankalarca** (md. 10/1-b).\n\
    - **T3:** Noksanlık 200.000 USD'yi aşmıyor, beyanname bedelinin %10'una kadar (140.000 / 1.500.000 = %9,33) ve mücbir\
    \ sebep\n  (malların hasara uğraması, sigorta şirketi belgesi) var → **vergi dairesince** (md. 10/1-c, 9/1-d).\n- **T4:**\
    \ Noksanlık 200.000 USD'yi aşıyor → talep mücbir sebep ve haklı durumlar göz önünde tutularak **Hazine ve Maliye\n  Bakanlığınca**\
    \ sonuçlandırılır (md. 10/2; ithalatçının iflası md. 9/1-a'da mücbir sebeptir).\n"
