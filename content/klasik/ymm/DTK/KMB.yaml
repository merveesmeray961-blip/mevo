  cozum: '**(a) Nakit beyan formu**


    - Yolcu beraberi **185.000 TL''yi aşan** Türk parası çıkışlarında beyan zorunludur (32/34 md. 3/5). Eşik değer dâhil değildir:
    A (185.000 TL) beyan etmez; B (185.100 TL), F ve G beyan eder.

    - Yolcu beraberi **10.000 Avro veya eşitini aşan** döviz çıkışlarında beyan zorunludur (md. 4/2). Eşik değer dâhildir:
    C (tam 10.000 Avro) beyan eder; D (9.900 Avro) etmez. E''nin 11.000 USD''si 10.000 Avro''ya (1,10 paritesiyle) eşittir;
    beyan zorunludur. H''nin 50.000 USD''si eşiğin çok üzerindedir.

    - **Beyan zorunlu olanlar: B, C, E, F, G, H.** Beyan zorunlu olmayanlar: A ve D.


    **(b) Merkez Bankasına aylık bildirim**


    - Türk parası için eşik "50.000 ABD Doları karşılığını **aşan**" çıkışlardır (md. 3/7): 50.000 × 40 = 2.000.000 TL. F
    (2.000.000 TL) eşiğe eşittir, bildirim kapsamı dışındadır; G (2.000.040 TL) aşar → bildirim.

    - Efektif için eşik "50.000 ABD Doları **veya eşitini aşan**" çıkışlardır (md. 4/4): H''nin 50.000 USD''si eşiğe eşit
    olduğundan bildirim kapsamındadır; E (11.000 USD) kapsam dışıdır.

    - **Bildirimi gerektirenler: G ve H.**


    **(c) Beyan yapılmaması veya yanlış beyan**


    E (beyansız) ve H (30.000 USD yazan, gerçekte 50.000 USD taşıyan) için: değerler gümrük idaresince **muhafaza altına alınır**,
    durum **şüpheli kabul edilerek Mali Suçları Araştırma Kurulu Başkanlığına bildirilir**; ayrıca 1567 sayılı Kanun md. 3/1
    uyarınca işlem yapılabilmesi için **Cumhuriyet Savcılıklarına bildirimde bulunulur** (md. 4/3).


    **(d) Bankanın bildirimi**


    Bankalar, ithalat, ihracat ve görünmeyen işlemler dışındaki yurt dışı transferlerden eşik değeri aşanları transfer tarihinden
    itibaren **30 gün içinde** bildirir (32 md. 3/c ve 4/e; Tebliğ md. 3/8). Süre hesabında işlem günü sayılmaz; son gün resmî
    tatile (burada Cumartesi, 02.05.2026) rastladığından süre izleyen ilk iş gününün (04.05.2026, Pazartesi) çalışma saati
    sonunda biter (32 md. 22).


    | Transfer | Değerlendirme |

    |---|---|

    | 1 – 60.000 USD (döviz tevdiat hesabından) | 50.000 USD''yi aşıyor → bildirim; en geç **04.05.2026** |

    | 2 – 2.100.000 TL = 52.500 USD | 50.000 USD karşılığını aşıyor → bildirim; en geç **04.05.2026** |

    | 3 – 1.900.000 TL = 47.500 USD | Eşiği aşmıyor → bildirim yok |

    | 4 – 80.000 USD ithalat bedeli | İthalat işlemi bildirim kapsamı dışında → bildirim yok |

    '
