- id: YMM-DTK-KMB-K002
  sinav: ymm
  ders: DTK
  konu: KMB
  kazanimlar:
  - yetkili müesseseler ve kıymetli maden kuruluşları
  - 32 sayılı Karar genel esaslar
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Kapalıçarşı Sınırlı Yetkili Müessese A.Ş.** B grubu yetkili müessesedir. Yönetim 2026 yılı için aşağıdaki işlemleri\n\
    planlamaktadır:\n\ni. 1 kilogramlık 24 ayar bar şeklinde standart işlenmemiş altının fiziki alım satımı\nii. 500 gramlık\
    \ 24 ayar bar şeklinde standart işlenmemiş altının fiziki alım satımı\niii. Müşterilere kredi kartıyla döviz satışı\n\
    iv. Müşterilerin efektiflerini, kısa süreliğine de olsa, kasada emanet olarak saklama\nv. Banka kartları aracılığıyla\
    \ yabancı para alım satımı\nvi. Ödeme kuruluşlarının temsilcisi olarak faaliyet gösterme\nvii. Merkez Bankasınca belirlenen\
    \ esaslar çerçevesinde dövizi natık çek satın alma\nviii. Aynı iş günü içinde transfer emri verilmesi şartıyla, müşterisiyle\
    \ bankacılık aracılığıyla yapılan transferler yoluyla\n      yabancı para satma\nix. Darphane üretimi çeyrek altını altı\
    \ taksitle satma\n\nŞirket ileride **A grubu** yetkili müessese olmak istemektedir.\n\nYeni kurulacak **Yeni Kambiyo A.Ş.**'nin\
    \ B grubu yetkili müessese kuruluş izni başvurusundaki bilgiler:\n- Ana sözleşmedeki ticaret unvanı \"Yeni Kambiyo Döviz\
    \ Ticaret A.Ş.\"dir.\n- Ödenmiş sermaye 4.000.000 TL'dir; payların bir kısmı hamiline yazılı olarak, bir kısmı ayni sermaye\
    \ karşılığında\n  çıkarılacaktır.\n- Türkiye'de yerleşik kurucu ortak (R) (%15 pay), başvurudan üç yıl önce 4. maddeye\
    \ aykırı faaliyeti nedeniyle faaliyet izni\n  iptal edilen bir yetkili müessesede yönetim kurulu üyesiydi.\n- Türkiye'de\
    \ yerleşik kurucu ortak (S) (%20 pay), %30 payla ortağı olduğu bir şirketin vergi dairesine vadesi geçmiş borcu\n  bulunmaktadır.\n\
    - Şirket, döviz işlemlerinin yanında mücevher imalatı ve satışı da yapmayı planlamaktadır.\n\nAyrıca **(Ö) Kuyumculuk\
    \ Ltd. Şti.**, Hazine ve Maliye Bakanlığından izin almaksızın döviz alım satımı yapmakta ve\ntabelasında \"Döviz\" ibaresi\
    \ kullanmaktadır.\n\n**İstenenler:**\n\n(a) i–ix arasındaki işlemlerin B grubu yetkili müessesece yapılıp yapılamayacağını\
    \ dayanaklarıyla değerlendiriniz; A grubuna\ngeçiş için sağlanması gereken başlıca şartları belirtiniz. (12 puan)\n\n\
    (b) Yeni Kambiyo A.Ş.'nin başvurusunu kuruluş şartları yönünden değerlendiriniz. (8 puan)\n\n(c) (Ö) Kuyumculuk'un durumunu\
    \ ve yaptırımını açıklayınız; 32 sayılı Karar md. 6'ya göre efektif alım satımı yapabilecek\nkuruluşları belirtiniz. (5\
    \ puan)\n"
  cozum: "**(a) Faaliyet konuları (Tebliğ 2018-32/45 md. 4)**\n\n| İşlem | Sonuç | Dayanak |\n|---|---|---|\n| i. 1 kg bar\
    \ altın | **Yapamaz**; 1 kg ve üstü külçe/bar altın alım satımı yalnız A grubunun faaliyetidir | md. 4/2-b, 4/3 |\n| ii.\
    \ 500 g bar altın | **Yapabilir**; 1 kg altındaki 24 ayar ve üstü bar altın | md. 4/1-d |\n| iii. Kredi kartıyla satış\
    \ | **Yapamaz**; yetkili müesseseler kredi kartıyla işlem yapamaz | md. 4/4 |\n| iv. Emanet saklama | **Yapamaz**; yabancı\
    \ para dahil hiçbir değeri emanet olarak kabul edemez, kısa süreli de olsa saklayamaz | md. 4/5 |\n| v. Banka kartıyla\
    \ döviz işlemi | **Yapamaz**; A grubuna özgüdür | md. 4/2-e |\n| vi. Ödeme kuruluşu temsilciliği | **Yapamaz**; A grubuna\
    \ özgüdür | md. 4/2-ç |\n| vii. Dövizi natık çek alımı | **Yapabilir** | md. 4/1-c |\n| viii. Aynı gün transferle yabancı\
    \ para satışı | **Yapabilir** | md. 4/1-e |\n| ix. Çeyrek altının taksitle satışı | Darphane üretimi basılı altın alım\
    \ satımı serbest (md. 4/1-ç) ancak işlemler hiçbir şekilde **taksitlendirilemez** → taksitli satış yapılamaz | md. 4/4\
    \ |\n\nB grubu, md. 4/1'de sayılanlar dışında faaliyette bulunamaz (md. 4/3).\n\nA grubuna geçiş için başlıca şartlar\
    \ (md. 5, 6): Bakanlık izni; ana sözleşmedeki unvanda **\"Yetkili Müessese\"** ibaresi;\nödenmiş sermayenin **10 milyon\
    \ TL**'den az olmaması; A grubu için iç kontrol görevlilerinin de md. 6/1-d'deki şartları taşıması.\n\n**(b) Yeni Kambiyo\
    \ A.Ş. (md. 6)**\n\n- **Unvan:** B grubu için unvanda \"Sınırlı Yetkili Müessese\" ibaresi bulunmalıdır (md. 6/1-b) →\
    \ **eksik**.\n- **Sermaye:** B grubunda ödenmiş sermaye **5 milyon TL**'den az olamaz (md. 6/1-ç) → 4 milyon TL **yetersiz**.\n\
    - **Paylar:** Hisse senetlerinin **nama yazılı** ve **nakit karşılığı** çıkarılması şarttır (md. 6/1-e) → hamiline ve\
    \ ayni\n  sermaye karşılığı paylar **aykırı**.\n- **(R):** Türkiye'de yerleşik her kurucu ortağın, başvuru tarihi itibarıyla\
    \ **son beş yıl** içinde md. 4'e aykırı faaliyeti\n  nedeniyle izni iptal edilen yetkili müessesede yönetim kurulu üyesi\
    \ olmaması gerekir (md. 6/1-d-3) → **engel**.\n- **(S):** Kurucuların kendileri ile yüzde on veya daha fazla ortaklık\
    \ payı bulunan şirketlerinin 6183 sayılı Kanun kapsamında\n  **vadesi geçmiş vergi borcu** bulunmamalıdır (md. 6/1-d-4)\
    \ → %30 ortaklık nedeniyle **engel**.\n- **Faaliyet:** Şirket **münhasıran** yetkili müessese faaliyet konuları ile iştigal\
    \ etmek üzere kurulmalıdır (md. 6/1-c);\n  mücevher imalatı ve satışı **aykırıdır**. Ana sözleşme mevzuata uygun olmalıdır\
    \ (md. 6/1-f).\n- Bu eksiklikler giderilmeden kuruluş izni verilmez; kuruluş izni alınırsa 90 gün içinde faaliyet izni\
    \ için başvurulmalıdır\n  (md. 9/1).\n\n**(c) Yetkisiz faaliyet ve efektif işlemleri**\n\n- Faaliyet izni bulunmayanlar\
    \ yetkili müessese faaliyetinde bulunamaz; tabela ve ilanlarında dövize ilişkin işlem yaptıkları\n  izlenimini yaratacak\
    \ kelime ve işaret kullanamaz (Tebliğ md. 5/2) → \"Döviz\" ibaresi de aykırıdır.\n- İzin veya yetki belgesi alınması zorunlu\
    \ konularda belgesiz faaliyette bulunanlara 1567 sayılı Kanun md. 3'te öngörülen\n  aralıkta **idari para cezası** verilir\
    \ ve iş yerindeki **tüm faaliyetler bir ay süreyle durdurulur**; iş yerinin yalnız bu\n  faaliyet için açıldığı anlaşılırsa\
    \ faaliyetler **sürekli** durdurulur ve ceza **üst sınırdan** uygulanır; kesinleşmeden sonraki\n  beş yıl içinde tekerrürde\
    \ ceza üst sınırdan uygulanır. Durdurma Bakanlığın talebiyle valiliklerce yapılır.\n- Karar kapsamındaki dövize ilişkin\
    \ işlemler **Merkez Bankası, bankalar** ve Bakanlıkça uygun görülen kuruluşlarca yapılır\n  (md. 6/1). **PTT, yetkili\
    \ müesseseler** ve Borsa İstanbul piyasalarında **kıymetli maden aracı kuruluşları** efektif alım satımı\n  yapabilir\
    \ (md. 6/3). **Aracı kurumlar** yalnız sermaye piyasası faaliyetleriyle sınırlı olarak hesap sahibi müşterileriyle döviz\n\
    \  alım satımı yapabilir (md. 6/4).\n"
  puanlama:
