      \ * 146097 + doe - 719468\ndef cfd(z):\n    z = z + 719468\n    era = z // 146097\n    doe = z - era * 146097\n    yoe\
      \ = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n    y = yoe + era * 400\n    doy = doe - (365 * yoe +\
      \ yoe // 4 - yoe // 100)\n    mp = (5 * doy + 2) // 153\n    d = doy - (153 * mp + 2) // 5 + 1\n    m = mp + (3 if mp\
      \ < 10 else -9)\n    return (y + (1 if m <= 2 else 0), m, d)\ndef hg(z):\n    return (z + 3) % 7\ndef is_gun(y, m, d,\
      \ n):\n    return cfd(dfc(y, m, d) + n)\ndef ay_ekle(y, m, d, k):\n    t = m - 1 + k\n    yy = y + t // 12\n    mm =\
      \ t % 12 + 1\n    gun = [31, 29 if (yy % 4 == 0 and (yy % 100 != 0 or yy % 400 == 0)) else 28, 31, 30, 31, 30, 31, 31,\
      \ 30, 31, 30, 31][mm - 1]\n    return (yy, mm, min(d, gun))\ndef tatil_sonrasi(t):\n    z = dfc(t[0], t[1], t[2])\n\
      \    while hg(z) >= 5:\n        z = z + 1\n    return cfd(z)\n\ndef fmt(t):\n    return \"%02d.%02d.%04d\" % (t[2],\
      \ t[1], t[0])\nmuteahhit = is_gun(2026, 3, 10, 365)\nkonsinye_ham = is_gun(2026, 4, 20, 180)\nkonsinye = tatil_sonrasi(konsinye_ham)\n\
