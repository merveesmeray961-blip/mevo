  soru: '(Ü) Dış Ticaret A.Ş. (Türkiye''de yerleşik, ihracatçı) ve çalışanı Bay (V) hakkında 2026 yılında tespit edilen aşağıdaki
    fiillere 1567 sayılı Kanun md. 3 uyarınca idari para cezası uygulanacaktır. Fiillerin ayrıca 5607 sayılı Kanun''a göre
    suç veya kabahat oluşturmadığı kabul edilecektir. Yabancı para tutarlarının TL karşılığı, fiilin işlendiği tarihteki TCMB
    döviz satış kuruyla hesaplanacaktır.


    | No | Olay | Bilgi |

    |---|---|---|

    | 1 | (Ü) A.Ş., ihracat işleminden doğan 100.000 USD tutarındaki alacağını kanuni süre içinde yurda getirmemiştir. | Kabahat
    tarihi 10.03.2026; kur 1 USD = 42 TL |

    | 2 | (Ü) A.Ş., döviz kaçırmak kastıyla muvazaalı bir ihracat işlemi yapmış, 60.000 USD kaçırılmıştır. | Fiil tarihi 05.05.2026;
    kur 1 USD = 43 TL. Aynı kabahate ilişkin ve (Ü) A.Ş. hakkında verilen idari yaptırım kararı 20.01.2022''de kesinleşmiştir.
    |

    | 3 | Bay (V), (Ü) A.Ş.''nin yararına olarak, 1 inci maddede yazılı kıymetlerden olan altın eşyayı izinsiz biçimde yurda
    sokmuştur. | Eşyanın rayiç bedeli 800.000 TL |

    | 4 | (Y) Döviz Ltd. Şti., Hazine ve Maliye Bakanlığından faaliyet izni almadan ticari amaçla döviz alım satımı yapmıştır.
    Şirketin iş yeri, ilan ve reklamlarından yalnızca bu faaliyet için açıldığı anlaşılmaktadır. | Aynı fiile ilişkin idari
    yaptırım kararı 14.02.2023''te kesinleşmiştir. |


    Gecikme zammı oranı, hesap kolaylığı için aylık %4 kabul edilecektir.


    **İstenenler:**


    (a) 1 numaralı olayda, ceza kararı kesinleşinceye kadar alacağın hiç getirilmemesi hâlinde verilecek idari para cezasını;
    alacağın karar kesinleşinceye kadar yurda getirilmesi hâlinde verilebilecek en yüksek cezayı bulunuz. Bu en yüksek ceza
    25.08.2026''da tahsil edilirse, ayrıca ödenecek gecikme faizini ve toplam tutarı hesaplayınız. (8 puan)


    (b) 2 numaralı olayda (Ü) A.Ş.''ye verilecek idari para cezasını hesaplayınız. Fiil ilk kez işlenmiş ve teşebbüs aşamasında
    kalmış olsaydı ceza ne olurdu? (6 puan)


    (c) 3 numaralı olayda Bay (V) hakkında uygulanacak idari para cezasının alt ve üst sınırını belirtiniz. Cumhuriyet savcısının
    cezayı alt sınırdan belirlemesi hâlinde (Ü) A.Ş.''ye de ceza verilip verilmeyeceğini, verilecekse tutarını ve toplam cezayı;
    fiilin teşebbüs aşamasında kalması hâlinde aynı alt sınır esasıyla toplam cezayı bulunuz. (6 puan)


    (d) 4 numaralı olayda (Y) Ltd. Şti.''ne verilecek idari para cezasını ve iş yeri bakımından uygulanacak yaptırımı gerekçesiyle
    açıklayınız. (5 puan)

    '
  cozum: '**(a) Olay 1 – Yurda getirmeme**


    - Rayiç bedel = 100.000 × 42 = 4.200.000 TL (yabancı para tutarında fiilin işlendiği tarihteki TCMB döviz satış kuru esas
    alınır).

    - Alacak karar kesinleşinceye kadar hiç getirilmezse ceza rayiç bedelin %5''idir: 4.200.000 × %5 = **210.000 TL**.

    - Karar kesinleşinceye kadar alacak yurda getirilirse yine aynı hükme göre ceza verilir; ancak verilecek ceza yurda getirilmesi
    gereken paranın %2,5''unu aşamaz: 4.200.000 × %2,5 = **105.000 TL**.

    - Gecikme faizi: kabahat tarihi (10.03.2026) ile tahsil tarihi (25.08.2026) arasında 5 tam ay vardır (10.03 – 10.08);
    ay kesirleri (15 gün) dikkate alınmaz. Faiz = 105.000 × %4 × 5 = **21.000 TL**.

    - Toplam tahsilat = 105.000 + 21.000 = **126.000 TL**.


    **(b) Olay 2 – Muvazaalı işlem**


    - Muvazaa hâlinde ceza, kaçırılan kıymetin rayiç bedeli kadardır: 60.000 × 43 = 2.580.000 TL.

    - Aynı kabahate ilişkin idari yaptırım kararının kesinleştiği tarihi (20.01.2022) izleyen beş yıl içinde (en geç 20.01.2027)
    yeni fiil işlendiği için tekerrür vardır; ceza iki kat uygulanır: 2.580.000 × 2 = **5.160.000 TL**.

    - Fiil ilk kez işlenmiş ve teşebbüste kalmış olsaydı: tekerrür uygulanmaz, ceza yarıya iner: 2.580.000 ÷ 2 = **1.290.000
    TL**.


    **(c) Olay 3 – İzinsiz yurda sokma ve tüzel kişi**


    - Fiil 5607 sayılı Kanun''a göre suç/kabahat oluşturmadığından ceza rayiç bedelin yarısından iki katına kadardır: alt
    sınır 800.000 ÷ 2 = **400.000 TL**; üst sınır 800.000 × 2 = **1.600.000 TL**.

    - Kabahat tüzel kişinin yararına işlendiği için tüzel kişiye de aynı miktarda ceza verilir: (Ü) A.Ş.''ye 400.000 TL; toplam
    = 400.000 + 400.000 = **800.000 TL**.

    - Teşebbüs hâlinde ceza yarıya iner: Bay (V) 200.000 TL, (Ü) A.Ş. 200.000 TL; toplam = **400.000 TL**.

    - Cezaya karar vermeye Cumhuriyet savcısı yetkilidir.


    **(d) Olay 4 – Yetkisiz faaliyet**


    - Faaliyet izni zorunlu olan konuda izinsiz faaliyette bulunana 50.000 TL – 250.000 TL idari para cezası verilir. İlk
    kararın kesinleşmesini izleyen beş yıl (14.02.2028''e kadar) içinde tekerrür olduğundan ceza **üst sınırdan, yani 250.000
    TL** uygulanır. Bu fıkrada tekerrür için "iki kat" hükmü (md. 3/9) dikkate alınmaz; dolayısıyla 500.000 TL verilemez.

    - İş yerinin yalnızca izne tabi faaliyet için açıldığı anlaşıldığından iş yerindeki tüm faaliyetler **sürekli olarak durdurulur**
    (olağan durumda bir ay süreyle durdurulurdu). Durdurma, Bakanlığın talebi üzerine valiliklerce yerine getirilir.

    '
