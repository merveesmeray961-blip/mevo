  sinav: ymm
  ders: DTK
  konu: KMB
  kazanimlar:
  - yetkili müessese kuruluş izni, faaliyet izni ve şube açma şartları
  - yetkili müessesede asgari sermaye, bloke tutar ve teminat mektubu
  - hisse devri izni ve bildirim süreleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(Z) Yetkili Müessese A.Ş., 3 numaralı faaliyet bölgesinde merkez açmak üzere kurulan A grubu bir yetkili müessesedir.
    Cumartesi ve Pazar günleri resmî tatildir; başka resmî tatil dikkate alınmayacaktır.


    - Şirkete Bakanlıkça **05.01.2026 (Pazartesi)** tarihinde kuruluş izni verilmiştir.

    - Faaliyet izni **12.05.2026 (Salı)** tarihinde verilmiştir.

    - Şirket, faaliyet izninden sonra 2. faaliyet bölgesinde, 3. faaliyet bölgesinde ve 4. faaliyet bölgesinde birer şube
    açmak istemektedir.

    - Şirket ortaklarından Bay (O), payını **20.11.2026 (Cuma)** tarihinde devretmiştir; devir ve izin işlemleri yapılmıştır.


    **İstenenler:**


    (a) Faaliyet izni başvurusunun yapılacağı son günü belirtiniz; bu süre içinde başvuru yapılmazsa doğacak sonucu yazınız.
    (4 puan)


    (b) Faaliyet izni başvurusu aşamasında şirketin sahip olması gereken asgari ödenmiş sermayeyi, bloke edilmesi veya teminat
    mektubu ile karşılanması gereken tutarı ve bu tutarın nasıl izleneceğini; faaliyet izninden sonra yapılması gereken yoklama
    tutanağı bildiriminin son gününü açıklayınız. (6 puan)


    (c) Şirketin açmak istediği şubelerden hangileri için izin başvurusunda bulunabileceğini gerekçesiyle belirleyiniz; izin
    verilebilecek şubeler açıldığında şirketin toplam ödenmiş sermayesini, toplam bloke tutarını ve bu tutarların hangi hesapta
    izleneceğini hesaplayınız. B grubu bir yetkili müessesenin aynı talepte bulunup bulunamayacağını belirtiniz. (8 puan)


    (d) Bay (O)''nun hisse devrine ilişkin belgelerin Bakanlığa gönderilmesi gereken son günü bulunuz; hisse devri izninin
    verilmeyeceği hâlleri ve devralanın devirden önce yapması gereken işlemi belirtiniz. (7 puan)

    '
  cozum: 'Kaynak: Tebliğ 2018-32/45 md. 6, 9, 11, 12, 14, 18; 32 sayılı Karar md. 22.


    **(a) Faaliyet izni başvurusu**


    - Kurucular, kuruluş izni tarihinden itibaren **90 gün** içinde kuruluş işlemlerini tamamlayıp faaliyet izni için başvurur
    (md. 9/1).

    - 05.01.2026 + 90 gün = 05.04.2026 (Pazar); resmî tatile rastladığından süre izleyen ilk iş günü olan **06.04.2026 (Pazartesi)**
    çalışma saati sonunda biter.

    - Bu sürede başvuru yapılmazsa **kuruluş izni iptal edilmiş sayılır**; Bakanlık zorunlu hâllerin tevsiki hâlinde süreyi
    en fazla 90 güne kadar uzatabilir.


    **(b) Sermaye, bloke tutar ve yoklama tutanağı**


    - A grubu yetkili müessesenin ödenmiş sermayesi **10 milyon TL**''den az olamaz (md. 6/1-ç).

    - Başvuruya, bu sermayenin **onda biri = 1.000.000 TL**''nin kamu sermayeli bankalardan birine yatırıldığını gösteren
    belge veya aynı tutarda teminat mektubu eklenir (md. 9/2-ç).

    - Yatırılan tutar mevduat bankalarında mevduat hesabında, katılım bankalarında katılım fonu hesabında **bloke** olarak
    izlenir; teminat mektupları Bakanlıkta muhafaza edilir (md. 14/1).

    - Faaliyete başlandığına dair vergi dairesinden alınacak yoklama tutanağı faaliyet izin tarihinden itibaren **90 gün**
    içinde gönderilir (md. 9/4): 12.05.2026 + 90 gün = **10.08.2026 (Pazartesi)**.


    **(c) Şubeler**


    - A grubu yetkili müessesenin şube açması Bakanlığın iznine tabidir (md. 11/1). Merkezi **3 numaralı** bölgede olan A
    grubu müessese yalnızca **3 ve 4 numaralı** bölgelerde şube açabilir (md. 11/3-c). Bu nedenle **2 numaralı bölgedeki şube
    için başvuru yapılamaz**; 3. ve 4. bölgedeki iki şube için başvurulabilir.

    - Her şube için ödenmiş sermayeye **3 milyon TL** ilave edilir (md. 12/2-a): 10.000.000 + 2 × 3.000.000 = **16.000.000
    TL**.

    - Her şube için ilave sermayenin onda biri bloke edilir/teminat mektubu alınır (md. 12/2-b): şube başına 300.000 TL; toplam
    bloke = 1.000.000 + 2 × 300.000 = **1.600.000 TL**.

    - Merkez ve şubeler adına yatırılan tutarlar **tek bir hesapta** izlenmek zorundadır (md. 14/4).

    - **B grubu** yetkili müesseseler şube açmak için başvuruda bulunamaz ve yeni şube açamaz (md. 11/2).


    **(d) Hisse devri**


    - Hisse devrine ilişkin noter onaylı yönetim kurulu kararı ile Ticaret Sicili Gazetesi örneği (veya pay defteri sayfalarının
    noter onaylı örneği) hisse devir tarihinden itibaren **30 gün** içinde gönderilir (md. 18/3): 20.11.2026 + 30 gün = 20.12.2026
    (Pazar) → **21.12.2026 (Pazartesi)**.

    - Yetkili müessese hakkında kambiyo mevzuatı ve ilgili mevzuat kapsamında **devam eden bir inceleme** varsa inceleme sonuçlanana
    kadar, **haciz, icra takibi veya ihtiyati tedbir** söz konusuysa bunlar kaldırılana kadar hisse devri izni verilmez (md.
    18/4-5).

    - Hisseleri devralanlar, devirden önce şirketin tüm mal varlığı ile her türlü arşivini, defterlerini, muhasebe kayıtlarını
    ve belgelerini devralmak üzere devredenle **protokol** yapmak zorundadır (md. 18/6).

    '
