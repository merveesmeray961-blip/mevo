  konu: KMB
  kazanimlar:
  - döviz cinsinden sözleşme yasağı ve istisnaları
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Anadolu Yedek Parça A.Ş.** (Türkiye'de yerleşik) 2026 yılında aşağıdaki sözleşmeleri yapmıştır. Aksi belirtilmedikçe\
    \ karşı\ntaraflar Türkiye'de yerleşik kişilerdir. YMM olarak tam tasdik çalışmasında bu sözleşmeleri kambiyo mevzuatı\
    \ yönünden\nincelemeniz istenmektedir.\n\n1. İstanbul'daki depo için (B) Gayrimenkul A.Ş. ile EUR cinsinden kira sözleşmesi.\n\
    2. Türkiye Cumhuriyeti vatandaşlığı bulunmayan, Türkiye'de yerleşik Alman vatandaşı genel müdürle USD cinsinden iş sözleşmesi.\n\
    3. Türk vatandaşı bir mühendisle, Irak'taki şantiyede ifa edilecek USD cinsinden iş sözleşmesi.\n4. Bir lojistik firmasıyla,\
    \ Türkiye'de başlayıp Almanya'da sonlanan karayolu taşıma hizmeti için EUR cinsinden sözleşme.\n5. Bir danışmanlık firmasıyla,\
    \ şirketin ihracat faaliyetleri kapsamında yurt dışı pazar araştırması hizmeti için USD cinsinden\n   sözleşme.\n6. Bir\
    \ bayiye yedek parça satışı için USD cinsinden satış sözleşmesi.\n7. Bir filo şirketinden binek otomobil kiralanması için\
    \ EUR cinsinden kira sözleşmesi.\n8. Bir distribütörden yurt dışında üretilmiş kurumsal kaynak planlama (ERP) yazılımı\
    \ lisansı için USD cinsinden lisans\n   sözleşmesi.\n9. Bir müteahhitle, ithal çelik konstrüksiyon içeren fabrika binası\
    \ yapımı için dövize endeksli eser sözleşmesi (sözleşme döviz\n   cinsinden maliyet içermektedir).\n10. Şirketin Almanya'daki\
    \ %100 bağlı ortaklığıyla, bu ortaklığa Almanya'da ifa edilecek danışmanlık hizmeti için EUR cinsinden\n    hizmet sözleşmesi.\n\
    \n**İstenenler:**\n\n(a) Her bir sözleşmede bedelin döviz cinsinden veya dövize endeksli kararlaştırılıp kararlaştırılamayacağını\
    \ 32 sayılı Karar\nmd. 4/g ve Tebliğ 2008-32/34 md. 8 çerçevesinde dayanağıyla belirleyiniz. (20 puan)\n\n(b) Yasağın\
    \ kapsamını ve aykırılığın yaptırımını açıklayınız; aykırı sözleşmelerde bedelin nasıl belirlenmesi gerektiğini\nbelirtiniz.\
    \ (5 puan)\n"
  cozum: "**(a) Sözleşmelerin değerlendirilmesi**\n\nTürkiye'de yerleşik kişiler, Bakanlıkça belirlenen hâller dışında kendi\
    \ aralarındaki menkul ve gayrimenkul alım satım, taşıt ve\nfinansal kiralama dahil her türlü kiralama, iş, hizmet ve eser\
    \ sözleşmelerinde bedeli ve diğer ödeme yükümlülüklerini döviz\ncinsinden veya dövize endeksli kararlaştıramaz (Karar\
    \ md. 4/g). İstisnalar Tebliğ md. 8'dedir.\n\n| No | Sonuç | Dayanak |\n|---|---|---|\n| 1 | **Yasak.** Yerleşikler arası,\
    \ konusu yurt içindeki gayrimenkul olan çatılı iş yeri kirası | md. 8/2 |\n| 2 | **Serbest.** T.C. vatandaşlığı bulunmayan\
    \ yerleşik kişinin taraf olduğu iş sözleşmesi | md. 8/14 |\n| 3 | **Serbest.** Yurt dışında ifa edilecek iş sözleşmesi\
    \ | md. 8/6 |\n| 4 | **Serbest.** Türkiye'de başlayıp yurt dışında sonlanan hizmet sözleşmesi | md. 8/7-ç |\n| 5 | **Serbest.**\
    \ İhracat kapsamında yapılan hizmet sözleşmesi | md. 8/7-b |\n| 6 | **Serbest.** Taşıt satışı dışındaki menkul satış sözleşmesi\
    \ | md. 8/9 |\n| 7 | **Yasak.** Taşıt kiralama, menkul kiralama istisnasının dışındadır | md. 8/10 |\n| 8 | **Serbest.**\
    \ Yurt dışında üretilen yazılıma ilişkin lisans sözleşmesi | md. 8/11 |\n| 9 | **Serbest.** Döviz cinsinden maliyet içeren\
    \ eser sözleşmesi | md. 8/8 |\n| 10 | **Serbest.** Yurt dışındaki %50 ve üzeri pay sahipliği bulunan şirketler md. 4/g\
    \ bakımından yerleşik sayılır; ancak sözleşme **yurt dışında ifa edildiğinden** bu kural uygulanmaz; taraflardan biri\
    \ yerleşik sayılmadığından yasak kapsamı dışındadır | md. 8/24 |\n\n**(b) Kapsam, yaptırım, bedel**\n\n- Yasak yalnız\
    \ **yerleşik kişilerin kendi aralarındaki** sözleşmeleri kapsar; döviz cinsinden bedelin yanında **dövize endeksli**\n\
    \  belirleme de yasaktır. Uluslararası piyasalarda fiyatı döviz cinsinden belirlenen kıymetli madenlere veya emtiaya\n\
    \  endekslenen sözleşmeler de dövize endeksli sayılır (taşımacılıkta akaryakıt endekslemesi hariç) (Tebliğ md. 8/23).\
    \ Yasak\n  sözleşmeler kapsamında düzenlenen kıymetli evraktaki bedeller de döviz cinsinden belirlenemez (md. 8/22).\n\
    - Aykırılık, Cumhurbaşkanının 1567 sayılı Kanuna dayanan düzenleyici işlemlerindeki yükümlülüğe aykırılıktır; Kanun md.\
    \ 3/1'deki\n  aralıkta **idari para cezası** verilir; kabahat bir tüzel kişinin yararına işlenmişse tüzel kişiye de aynı\
    \ miktarda ceza\n  verilir; karar mercii **Cumhuriyet savcısıdır** (1567 sayılı Kanun md. 3; Karar md. 1).\n- 1 ve 7 numaralı\
    \ sözleşmelerde bedel **Türk parası** olarak kararlaştırılmalıdır. Karar'ın Geçici 8. maddesi yürürlüğe girmeden\n  önce\
    \ yapılmış yasak kapsamındaki sözleşmelerde bedeller taraflarca Türk parası olarak yeniden belirlenir; mutabakat\n  sağlanamazsa\
    \ 02.01.2018 kuru ve TÜFE değişimiyle belirlenir (md. 8/28-29).\n"
