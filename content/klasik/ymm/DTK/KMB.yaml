  soru: 'Türkiye''de yerleşik (Ö) Yazılım A.Ş. ile ilgili olaylar aşağıdadır. Cumartesi ve Pazar günleri resmî tatil kabul
    edilecek, başka resmî tatil dikkate alınmayacaktır.


    | Tarih | Olay |

    |---|---|

    | 30.11.2025 | Almanya''da kurulacak %100 iştiraki (Ö) GmbH için ilk nakdi sermaye, bir banka aracılığıyla yurt dışına
    gönderilmiştir. |

    | 20.01.2026 | (Ö) GmbH''ye ek nakdi sermaye bir banka aracılığıyla gönderilmiş; aynı gün bir üretim makinesi ayni sermaye
    olarak gümrük beyannamesiyle ihraç edilmiştir. |

    | 15.05.2026 | (Ö) GmbH''nin tasfiye süreci sona ermiştir. |

    | 2026 | (Ö) A.Ş., Dubai''de bir irtibat bürosu açmış; büronun kuruluş masrafları ile faaliyet giderlerini ve ayrıca büro
    personeli için Dubai''de satın aldığı konutun bedelini banka kanalıyla göndermiştir. |


    **İstenenler:**


    (a) 30.11.2025 ve 20.01.2026 tarihli sermaye ihraçlarında nakdi ve ayni sermayenin hangi yolla ihraç edilebileceğini,
    bankaların ve gümrük idarelerinin bildirim yükümlülüğünün kime ve en geç hangi tarihe kadar yerine getirilmesi gerektiğini
    gösteriniz. (8 puan)


    (b) (Ö) A.Ş.''nin Tebliğ (2008-32/34) md. 10 uyarınca yapması gereken; (i) ilk sermaye ihracına ilişkin bilgi formunun,
    (ii) 2025 takvim yılı için bilgi formunun güncellenmesinin ve (iii) tasfiye bilgisinin verilmesinin son günlerini, hangi
    makamlara verileceğini ve süre hesabında uygulanan kuralları açıklayınız. (11 puan)


    (c) Dubai''deki irtibat bürosu masraflarının ve konut bedelinin banka aracılığıyla yurt dışına transferinin kambiyo mevzuatı
    yönünden durumunu açıklayınız. (5 puan)

    '
  cozum: '**(a) Sermaye ihracı usulü ve bankaların bildirimi**


    - Türkiye''de yerleşik kişilerin yurt dışında ortaklığa katılmak veya şirket kurmak amacıyla **nakdi sermayeyi bankalar
    aracılığıyla, ayni sermayeyi ise gümrük mevzuatı çerçevesinde** ihraç etmeleri serbesttir (32 sayılı Karar md. 13/1).
    Dolayısıyla 30.11.2025 ve 20.01.2026 tarihli nakdi transferler bankadan, makine ise gümrük beyannamesiyle yapılmıştır.

    - Bankalar ve gümrük idareleri, yurt dışında yatırım veya ticari faaliyette bulunmak üzere sermaye ihraç eden Türkiye''de
    yerleşik kişileri **her bir işlem tarihinden itibaren 30 gün içinde Hazine ve Maliye Bakanlığına ve Ticaret Bakanlığına**
    bildirir (md. 13/3). İşlem günü hesaba katılmaz (md. 22).


    | İşlem | İşlem tarihi | Bildirimin son günü |

    |---|---|---|

    | Banka – ilk nakdi sermaye | 30.11.2025 | 30.12.2025 (Salı) |

    | Banka – ek nakdi sermaye | 20.01.2026 | 19.02.2026 (Perşembe) |

    | Gümrük idaresi – ayni sermaye | 20.01.2026 | 19.02.2026 (Perşembe) |


    **(b) Şirketin bilgi verme süreleri (Tebliğ 2008-32/34 md. 10 ve md. 15)**


    Ay olarak belirlenen sürelerde işlem günü hesaba katılmaz; süre, izleyen ayda işlem tarihine tekabül eden günün mesai
    saati sonunda biter; o ayda böyle bir gün yoksa ayın son günüdür. Süre sonu resmî tatile rastlarsa izleyen ilk iş gününün
    çalışma saati sonunda biter (md. 15).


    | Yükümlülük | Gönderilecek makam | Hesap | Son gün |

    |---|---|---|---|

    | (i) İlk sermaye ihracından sonra 3 ay içinde bilgi formu | Hazine ve Maliye Bakanlığı ve Ticaret Bakanlığı | 30.11.2025
    + 3 ay → Şubat''ta 30. gün yok, ayın son günü 28.02.2026 (Cumartesi) → izleyen iş günü | **02.03.2026 (Pazartesi)** |

    | (ii) 2025 takvim yılını izleyen 3 ay içinde formun güncellenmesi | Yalnız Ticaret Bakanlığı | 31.12.2025 + 3 ay → 31.03.2026
    (Salı, iş günü) | **31.03.2026** |

    | (iii) Tasfiye sürecinin sona ermesinden sonra 3 ay içinde bilgi | Hazine ve Maliye Bakanlığı ve Ticaret Bakanlığı |
    15.05.2026 + 3 ay → 15.08.2026 (Cumartesi) → izleyen iş günü | **17.08.2026 (Pazartesi)** |


    20.01.2026''daki ek sermaye ihracı yeni bir "ilk ihraç" bilgi formu doğurmaz; yıllık güncellemede yer alır.


    **(c) İrtibat bürosu ve gayrimenkul**


    - Yurt dışında irtibat bürosu, temsilcilik ve benzerlerinin kurulması ile bunların kuruluş masrafları ve faaliyet giderlerinin
    bankalarca transferi serbesttir (md. 13/2).

    - Türkiye''de yerleşik kişilerce yurt dışında gayrimenkul satın alınması amacıyla bankalar vasıtasıyla döviz ve Türk parası
    transferi serbesttir (md. 16/2). Bu nedenle her iki transfer için ayrıca izin aranmaz; transferin bankalar aracılığıyla
    yapılması şarttır.

    '
