    **İstenenler:**


    (a) Hangi yolcuların gümrük idaresine nakit beyan formuyla beyanda bulunması gerekir? Sınır değerlerin "aşan" ve "veya
    eşitini aşan" ifadelerindeki farkı göz önüne alarak gerekçelendiriniz. (8 puan)


    (b) Gümrük idarelerinin çıkış bilgilerini aylık olarak Merkez Bankasına bildirmesini gerektiren yolcuları belirleyiniz.
