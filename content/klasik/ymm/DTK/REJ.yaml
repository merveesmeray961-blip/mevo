    (d) Devrin aynı ay içinde iki kısmi muafiyetli kişi arasında yapılması hâlinde o ayın vergisini kimin ödeyeceğini belirtiniz.
    (5 puan)

    '
  cozum: '**(a) Ayniyet tespiti (md. 129/2)**


    İthal eşyası ile ilgili ayniyet tespitinin mümkün olmadığı hallerde geçici ithalat rejiminin kullanılmasına izin verilmez.
    Ancak eşyanın veya yapılacak işin niteliği itibariyle ayniyet tespiti ile ilgili önlemlerin alınmamasının rejimin kötüye
    kullanılmasına sebep olmayacağı hallerde gümrük idareleri, **vergilerin tümünü teminata bağlamak suretiyle** rejimin kullanılmasına
    izin verebilir. Vakada bu istisna koşulları sağlandığından izin verilebilir.


    **(b) Teminat ve bildirim (md. 81)**


    Eşyanın bir şartlı muafiyet düzenlemesine tabi tutulması, söz konusu eşya için tahakkuk edebilecek her türlü gümrük vergilerine
    karşılık teminat verilmesi şartına bağlıdır (md. 81/2). İzin hak sahibi, iznin verilmesinden sonra ortaya çıkan ve iznin
    devamını veya içeriğini etkileyebilecek her türlü gelişmeyi ilgili mercilere bildirmek zorundadır (md. 81/1). Alfa fabrika
    yer değişikliğini bildirmeyerek bu yükümlülüğü yerine getirmemiştir; bu, rejim şartlarının ihlalidir (md. 82''ye göre
    şartlar altında sona ermemiş rejimde ceza hükümleri uygulanır).


    **(c) Devirden sonra kalan süre (md. 133/3)**


    Hak ve yükümlülüklerin md. 83 uyarınca devri hâlinde yeni hak sahibi, rejime ilişkin kalan süreyi kullanabilir. Azami
    süre 24 ay; Alfa 7 ay kullanmıştır (devir ayı Eylül 2026 olduğundan 3/2/2026 - Eylül 2026 arası 7 ay). Beta''nın kullanabileceği
    süre = 24 - 7 = **17 ay**''dır.


    **(d) Aynı ay içinde devir (md. 133/4)**


    Devir işlemi aynı ay içinde, rejimi kısmi muafiyetle kullanmasına izin verilmiş iki kişi arasında gerçekleştirilirse,
    **ilk hak sahibi (Alfa)** söz konusu ayın tamamı için tahakkuk eden ithalat vergileri tutarını ödemekle yükümlüdür.


