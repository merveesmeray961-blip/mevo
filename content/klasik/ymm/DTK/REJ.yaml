    \ vergileri **teminata bağlanarak** geçici ithal edilir; ürün\n  ihraç edilince teminat iade edilir (md. 108/1).\n- **Geri\
    \ ödeme sistemi:** Eşya vergileri ödenerek serbest dolaşıma girer; işlem görmüş ürün ihraç edilince tahsil edilen\n  ithalat\
    \ vergileri **geri verilir** (md. 108/2). Deniz şartlı muafiyet sistemini kullanmaktadır.\n- Verimlilik oranı, belirli\
    \ miktar ithal eşyasından elde edilen ürün miktarıdır (md. 108/8, 112): 50.000 / 1,25 = **40.000\n  gömlek** ihraç edilmelidir.\n\
    - Süre izin tarihinden işlemeye başlar ve bitimin rastladığı ayın son günü sona erer (md. 111/2): 01.02.2027 → 28.02.2027;\n\
