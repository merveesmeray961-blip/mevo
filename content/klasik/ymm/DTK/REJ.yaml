    - Kalıp setlerinin ayniyetini tespit etmek mümkün değildir (parçalar seri hâlinde olup numaralanamamaktadır). Ancak işin
    niteliği itibariyle ayniyet tespiti ile ilgili önlemlerin alınmamasının rejimin kötüye kullanılmasına yol açmayacağı değerlendirilmiştir.

