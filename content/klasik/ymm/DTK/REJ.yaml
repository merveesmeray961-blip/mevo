    açıklayınız. (5 puan)


    (c) 4 numaralı işlemde yapılması gerekenleri açıklayınız. (4 puan)


    (d) 5 numaralı işlemde gümrük vergisi aranıp aranmayacağını; 6 numaralı işlemde eşyanın muayene edilip edilmeyeceğini
    belirtiniz. (5 puan)

    '
  cozum: '**(a) Teminat (md. 85)**


    - Transit eşyası için tahakkuk edebilecek gümrük vergilerinin ödenmesini sağlamak üzere teminat verilmesi zorunludur;
    ancak havayoluyla, boru hattıyla, demiryoluyla ve denizyoluyla yapılan taşımalar için yönetmelikle belirlenen haller dışında
    teminat aranmaz (md. 85/1). İşlem 1''de **teminat aranmaz**.

    - Kapsamlı teminat izni (birden fazla transit işlemi için) yalnızca Türkiye Gümrük Bölgesinde yerleşik, transit rejimini
    düzenli kullanan veya yükümlülüklerini yerine getirebileceği belirlenen ve gümrük veya vergi mevzuatını yönetmelikte belirlenen
    surette ihlal etmemiş kişilere verilir (md. 85/2-3). Şirket geçen yıl ihlal yaptığından üçüncü şartı sağlamamaktadır;
    izin **verilemez**, bireysel teminat verilir.


    **(b) Asıl sorumlu ve taşıyıcı (md. 86)**


    Asıl sorumlu, eşyayı öngörülen süre içinde ve gümrük idaresinin ayniyet tespiti amacıyla aldığı önlemlere uyarak varış
    gümrük idaresine sağlam ve noksansız sunmakla yükümlüdür (md. 86/1). Transit rejimine göre taşındığını bilerek eşyayı
    kabul eden taşıyıcı (T) de aynı yükümlülüğe sahiptir (md. 86/2). Eşyanın varış idaresine sunulmaması hâlinde 183 veya
    184. madde kapsamında gümrük yükümlülüğü doğarsa asıl sorumlu (şirket), transit rejimine tabi eşya ile ilgili olarak gümrük
    idaresine karşı **mali olarak sorumludur** (md. 86/3).


    **(c) Arızalı taşıt (md. 92/1)**


    Beklenmeyen hal veya mücbir sebeple taşıtın yoluna devam edememesi gecikmeksizin en yakın gümrük idaresine bildirilir.
    Eşyanın başka bir taşıta aktarılması gümrük idarelerinin gözetiminde yapılır ve bir tutanakla belgelendirilir.


    **(d) Telef ve muayene**


    - İşlem 5: Türkiye Gümrük Bölgesi içindeki transit eşyanın beklenmeyen hal veya mücbir sebeple telef veya kaybının kanıtlanması
    hâlinde **gümrük vergileri aranmaz** (md. 92/2).

    - İşlem 6: Şüphe veya ihbar durumları hariç olmak üzere transit eşya, varış idaresine kadar **muayene edilmeksizin** ve
    gerektiğinde mühür altına alınarak veya memur eşliğinde sevk edilir (md. 88/1).


    Püf noktaları: (1) Hava, boru hattı, demiryolu ve denizyolunda teminat kural olarak aranmaz; karayolunda aranır. (2) Kapsamlı
    teminat izni üç şartın birlikte sağlanmasına bağlıdır. (3) Telef kanıtlanmalıdır.

    '
