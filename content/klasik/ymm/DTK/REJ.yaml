  soru: '**Anadolu Tarım Makineleri A.Ş.** (Türkiye''de yerleşik) 2026 yılında aşağıdaki hariçte işleme işlemlerini planlamaktadır:


    | No | Durum |

    |---|---|

    | 1 | İhracı hâlinde ihracat vergi iadesi doğuracak serbest dolaşımdaki eşyanın hariçte işleme rejimiyle geçici ihracı.
    |

    | 2 | Tamir amacıyla geçici ihraç edilen bir motor, imalat hatası nedeniyle garanti kapsamında bedelsiz tamir edilmiş
    ve Türkiye''ye geri getirilmiştir. İlk serbest dolaşıma girişi sırasında motorun kusurlu olduğu dikkate alınmamış, bu
    nedenle herhangi bir işlem (indirim, iade vb.) yapılmamıştır. |

    | 3 | Tamir amacıyla geçici ihraç edilen bir pompa bedel karşılığında tamir ettirilmiştir. Tamir masrafı 150.000 TL''dir;
    izin hak sahibi bunun dışında başka bir ödeme yapmamıştır. İşlem görmüş ürünün serbest dolaşıma giriş beyannamesinin tescil
    tarihinde bu ürüne uygulanacak vergi oranı %10''dur. |

    | 4 | Hariçte işleme izni, Türkiye''de yerleşik olmayan bir yabancı firma tarafından talep edilmiştir. |

    | 5 | Hariçte işleme rejiminin bir şartına uyulmamıştır; ancak bunun rejimin doğru işleyişine önemli bir etkisi olmadığı
    tespit edilmiştir. |


    **İstenenler:**


    (a) 1 ve 4 numaralı durumlarda hariçte işleme rejiminin/izninin uygulanıp uygulanamayacağını madde atfıyla belirtiniz.
    (6 puan)


    (b) 2 numaralı durumda ithalat vergisi bakımından sonucu açıklayınız. (4 puan)


    (c) 3 numaralı durumda ödenecek ithalat vergisini hesaplayınız. (6 puan)


    (d) 5 numaralı durumda muafiyetin uygulanıp uygulanmayacağını açıklayınız; serbest dolaşımdaki eşyanın geçici ihracında
    ihracat vergisi ve ticaret politikası önlemleri bakımından hükmü belirtiniz. (6 puan)

    '
  cozum: '**(a) Uygulanamayan haller ve izin koşulları**


    - Durum 1: Hariçte işleme rejimi, ihracı ihracat vergi iadesini gerektiren veya ihracı nedeniyle tarım politikası çerçevesinde
    vergi idaresi dışında bir mali avantaj sağlanan serbest dolaşımdaki eşyaya **uygulanmaz** (md. 136-c).

    - Durum 4: Hariçte işleme izni Türkiye Gümrük Bölgesinde yerleşik kişilere verilir (md. 138-a). Yerleşik olmayan firmaya
    izin **verilmez**.


    **(b) Kusurlu motor (md. 142)**


    Tamir amacıyla geçici ihraç edilen eşya, tamiratın garanti nedeniyle sözleşmeye bağlı olarak veya kanuni bir yükümlülüğe
    dayanarak ya da imalat hatası nedeniyle bedelsiz yapıldığının kanıtlanması hâlinde serbest dolaşıma ithalat vergilerinden
    tam muaf olarak girer. Ancak eşyanın serbest dolaşıma ilk girişi sırasında kusurlu olduğunun dikkate alınarak işlem yapılmış
    olması hâlinde bu hüküm uygulanmaz. Vakada ilk girişte kusur dikkate alınmadığından motor **tam muaf** olarak girer.


    **(c) Bedelli tamir (md. 143)**


    Bedel karşılığı yapılan tamirde ithalat vergileri, gümrük kıymeti olarak tamir masraflarına eşit bir tutar dikkate alınarak,
    işlem görmüş ürünlerin serbest dolaşıma giriş beyannamesinin tescil edildiği tarihteki vergi oranı üzerinden belirlenir.
    Kıymet = 150.000 TL; vergi = 150.000 x %10 = **15.000 TL**. İzin hak sahibinin tamir masrafı dışında başka ödeme yapmaması
    ve ödemenin faaliyeti yapan kişi ile ilişkiden etkilenmemesi gerekir; vakada bu koşul sağlanmıştır.


    **(d) Şartlara uyulmaması ve geçici ihracat**


    Hariçte işleme rejimine ilişkin şartlardan birine uyulmadığı takdirde muafiyet uygulanmaz; ancak bu durumun rejimin doğru
    işleyişine önemli bir etkisinin olmadığı tespit edilirse tam veya kısmi muafiyet uygulaması yapılır (md. 140/2). Vakada
    önemli etki yoktur: **muafiyet uygulanır**. Serbest dolaşımdaki eşyanın geçici ihracı hâlinde, eşyaya Türkiye Gümrük Bölgesi
    dışına çıkışı için öngörülen ihracat vergileri, ticaret politikası önlemleri ve diğer işlemler uygulanır (md. 135/2).


    Püf noktaları: (1) Garanti kapsamında bedelsiz tamirde vergisiz giriş, ilk girişte kusur işlendiyse yok. (2) Bedelli tamirde
    matrah yalnızca tamir masrafıdır. (3) Küçük ihlaller muafiyeti ortadan kaldırmaz.

    '
