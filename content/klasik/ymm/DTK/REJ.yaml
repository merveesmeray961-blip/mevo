  soru: '**Bursa Dokuma San. A.Ş.** (Türkiye''de yerleşik), 17/3/2026 tarihinde 12 ay süreli bir dahilde işleme izni almış
    ve aynı gün serbest dolaşımda bulunmayan eşya için dahilde işleme rejimi beyannamesini tescil ettirmiştir. İthal ham maddenin
    gümrük kıymeti 2.000.000 TL, tescil tarihindeki ithalat vergisi oranı %5''tir.


    Şirket, bu ham maddenin tamamını işlem görmüş ürün içinde yer almayacak biçimde iç piyasaya satmıştır; bu durum 10/5/2026''da
    tespit edilmiş ve gümrük yükümlülüğü doğmuştur. O tarihte ithalat vergisi oranı %12''dir.


    **İstenenler:**


    (a) Dahilde işleme izninin verilebilmesi için aranan koşulları belirtiniz. (4 puan)


    (b) Rejim süresinin hangi tarihte sona ereceğini md. 111''e göre belirleyiniz. (4 puan)


    (c) Gümrük yükümlülüğü doğduğunda hangi oran üzerinden vergi hesaplanacağını belirtiniz ve vergi tutarını bulunuz. (6
    puan)


    (d) Bu rejim ihlalinde (i) eşyanın gümrük gözetiminden mevzuata aykırı olarak çıkarıldığı tespit edilirse, (ii) çıkarılmamış
    olduğu tespit edilirse ve gecikme zammı oranında hesaplanan faiz 30.000 TL ise idari para cezasını hesaplayınız; (ii)
    hâlinde idare tebligat yapmış ve şirket 60 gün içinde eşyayı gümrükçe onaylanmış başka bir işlem veya kullanıma tabi tutmamışsa
    ek cezayı da belirtiniz. (10 puan)

    '
  cozum: '**(a) İzin koşulları (md. 110/2)**


    Dahilde işleme izni sadece: (1) Türkiye Gümrük Bölgesinde yerleşik kişilere, (2) ithal eşyasının işlem görmüş ürünler
    içerisinde mevcudiyetinin (veya eşdeğer eşya koşullarına uyulduğunun) tespit edilebildiği hallerde, (3) Türkiye''deki
    üreticilerin temel ekonomik çıkarlarının olumsuz etkilenmemesi şartıyla, rejimin işlem görmüş ürünlerin ihracı veya yeniden
    ihracı için en iyi imkanların yaratılmasına yardımcı olduğu hallerde verilir.


    **(b) Süre (md. 111/2)**


    Süre, serbest dolaşımda bulunmayan eşya için iznin alındığı tarihten itibaren işlemeye başlar ve bitimin rastladığı ayın
    son günü sona erer. 17/3/2026 + 12 ay = 17/3/2027; bu tarih Mart ayına rastladığından süre **31/3/2027**''de sona erer.


    **(c) Vergi oranı ve tutar (md. 114/1)**


    Dahilde işleme rejimi kapsamında gümrük yükümlülüğü doğduğunda gümrük vergileri, ithal eşyasının dahilde işleme rejimine
    ilişkin beyannamenin **tescil tarihindeki** vergi oranı ve diğer vergilendirme unsurları gözönünde bulundurularak hesaplanır.
    Oran %5''tir (yükümlülüğün doğduğu tarihteki %12 değil): 2.000.000 x %5 = **100.000 TL**.


    **(d) Cezalar (md. 238)**


    - (i) Rejim hükümlerinin ihlalinde eşyanın gümrüklenmiş değerinin iki katı idari para cezası verilir (md. 238/1-a): 2.000.000
    x 2 = **4.000.000 TL**.

    - (ii) Rejim hükümleri ihlal edilmekle birlikte eşyanın gümrük gözetiminden mevzuata aykırı olarak çıkarılmamış olduğu
    tespit edilirse, ihlal hâlinde ithal eşyasının gümrük vergileri ile tescil tarihinden tespit tarihine kadar geçen süre
    için gecikme zammı oranında faizin toplamı kadar idari para cezası verilir (md. 238/1-c): 100.000 + 30.000 = **130.000
    TL**. Tebligat tarihinden itibaren 60 gün içinde eşya gümrükçe onaylanmış başka bir işlem veya kullanıma tabi tutulmazsa
    ayrıca gümrük vergileri tutarında idari para cezası verilir (md. 238/2): **100.000 TL** (toplam 230.000 TL).


    Püf noktaları: (1) Dahilde işleme rejiminde vergi, rejim beyannamesinin tescil tarihindeki oranla hesaplanır. (2) Süre,
    bitiminin rastladığı ayın son günüdür. (3) Gözetimden çıkarılma tespit edilirse değerin iki katı; çıkarılmamışsa vergi
    + faiz kadar ceza uygulanır.

    '
