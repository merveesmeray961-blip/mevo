    İhracat rejimi, serbest dolaşımda bulunan eşyanın ihraç amacıyla Türkiye Gümrük Bölgesi dışına çıkışına ilişkin hükümlerin
    uygulandığı rejimdir; ihraç edilecek eşya ihracata ilişkin gümrük beyannamesi ile yetkili gümrük idaresine beyan edilir
    (md. 150/1-2). İhraç eşyası, beyannamenin tescili sırasında bulunduğu durum ve niteliği gümrük kontrolünden çıktığı sırada
    da aynen muhafaza etmesi ve bu hâliyle Türkiye Gümrük Bölgesini terk etmesi koşuluyla fiilen ihraç edilmiş sayılır; bu
    durumda ihraç eşyası üzerindeki **gümrük kontrolü sona erer** (md. 151).


    **(b) Usulsüzlük cezaları (md. 241)**


    Temel ceza 1.494 TL''dir (md. 241/1). Md. 241/3 ve 241/4''e göre:


    | No | Dayanak | Kat | Ceza |

    |---|---|---|---|

    | 1 | md. 241/3-j (beyana göre miktar veya cinste %10''dan fazla fark) | 2 | 2 x 1.494 = **2.988 TL** |

    | 2 | Fark %8; %10''u aşmadığından ceza yok | -- | **0 TL** |

    | 3 | md. 241/3-ı (geçici çıkarılan eşyanın süre aşıldıktan sonra geri getirilmesi) | 2 | **2.988 TL** |

