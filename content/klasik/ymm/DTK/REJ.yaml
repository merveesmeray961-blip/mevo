    \ sayımda fazla eşya çıksaydı ne yapılacağını belirtiniz. (10 puan)\n"
  cozum: "**(a) Antrepo ve sorumluluk**\n\n- Herkes tarafından kullanılabilen antrepo **genel antrepodur** (md. 94/1-a). Antrepo\
    \ işleticisi, işletme izni verilen kişidir;\n  kullanıcı, antrepo rejimi beyanında bulunan kişidir (md. 93/2).\n- İşletici;\
    \ eşyanın gümrük gözetimi altında bulunmasını sağlamaktan, muhafaza yükümlülüklerinden ve izindeki özel şartlardan\n \
    \ sorumludur (md. 96). İzinde bu yükümlülüklerin münhasıran kullanıcıya ait olduğu belirtilmediğinden (md. 97/1) sorumluluk\n\
    \  **Boğaziçi**'ndedir; kullanıcı (Kuzey) eşyanın rejime tabi tutulmasından doğan yükümlülüklerinden her hâlükârda sorumludur\n\
