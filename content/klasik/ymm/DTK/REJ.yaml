    beyanda bulunulduğu tarihteki vergi oranı ve diğer vergilendirme unsurlarına göre tespit edilir (md. 134/1) = 600.000
    TL; bundan md. 133''e göre ödenen vergi düşülür (md. 134/2). 12 ay için ödenen vergi = 12 x 18.000 = 216.000 TL; kalan
    = 600.000 - 216.000 = **384.000 TL**.


    **(d) Kısmi muafiyet ve azami süre**


    Kısmi muafiyet suretiyle geçici ithalattan, mülkiyeti Türkiye Gümrük Bölgesi dışında yerleşik bir kişiye ait olan ve tam
    muafiyet hükümlerine tabi olmayan veya tam muafiyetin koşullarını taşımayan eşya yararlanabilir (md. 132/1). Eşyanın geçici
    ithalat rejimi altında kalma süresi, özel süreler saklı kalmak üzere, azami yirmidört aydır; istisnai hallerde ve ilgilinin
    talebi üzerine uzatılabilir (md. 130/2-3).


    Püf noktaları: (1) Aylık oran %3''tür ve ay kesri tam ay sayılır. (2) Toplam vergi, eşyanın serbest dolaşıma girseydi
    ödeyeceği vergiyi geçemez. (3) Yükümlülük doğunca ödenen aylık vergiler mahsup edilir.

    '
