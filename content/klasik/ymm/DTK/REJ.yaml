  soru: '(R) İnşaat A.Ş., bir altyapı projesinde kullanmak üzere, mülkiyeti yurt dışında yerleşik (Q) GmbH''ye ait serbest
    dolaşımda olmayan bir iş makinesini Türkiye''ye getirmiştir. Makine, Kapıkule Gümrük Müdürlüğünden karayoluyla transit
    rejimi kapsamında İstanbul''daki bir iç gümrük idaresine taşınmış; burada 05.01.2026 tarihinde tescil edilen beyanname
    ile kısmi muafiyet suretiyle geçici ithalat rejimine tabi tutulmuştur. Makine, tam muafiyetli geçici ithalat koşullarını
    taşımamaktadır.


    Makinenin 05.01.2026 tarihinde serbest dolaşıma girmesi halinde alınacak ithalat vergileri toplamı (gümrük vergisi ve
    diğer ithalat vergileri, o tarihteki oran ve unsurlarla) 400.000 TL''dir. Faiz hesaplanmayacaktır.


    **İstenenler:**


    (a) Makine Türkiye''de 7 ay 10 gün kullanıldıktan sonra yeniden ihraç edilmiştir. Geçici ithalat rejimi kapsamında ödenecek
    ithalat vergilerini hesaplayınız; gümrük yükümlülüğünün hangi tarihte başladığını ve tutarın üst sınırını belirtiniz.
    (6 puan)


    (b) Şirketin, 7 ay 10 günlük kullanımın sonunda makineyi yeniden ihraç etmek yerine satın alıp serbest dolaşıma sokmak
    istediğini varsayınız. Bu aşamada ödenmesi gereken ithalat vergisi tutarını, hangi tarihteki vergilendirme unsurlarının
    esas alınacağını gerekçesiyle belirterek hesaplayınız. (6 puan)


    (c) Kapıkule''den iç gümrüğe yapılan transit taşımada teminat verilmesinin zorunlu olup olmadığını, asıl sorumlunun yükümlülüklerini,
    rejimin ne zaman sona erip ne zaman ibra edileceğini ve eşyanın yolda mücbir sebeple telef olmasının vergiler bakımından
    sonucunu açıklayınız. (8 puan)

    '
  cozum: '**(a) Kısmi muafiyetli geçici ithalat**


    - Mülkiyeti Türkiye Gümrük Bölgesi dışında yerleşik bir kişiye ait olup tam muafiyet koşullarını taşımayan eşya kısmi
    muafiyetle rejimden yararlanabilir (md. 132/1).

    - Gümrük yükümlülüğü, kısmi muafiyetle geçici ithal beyannamesinin tescil tarihinde, **05.01.2026**''da başlar (md. 181/1-b).

    - Her ay için alınacak vergi, beyannamenin tescil tarihinde serbest dolaşıma girseydi alınacak vergilerin %3''üdür; bir
    aydan az süreler tam ay sayılır (md. 133/1). 7 ay 10 gün → **8 ay**.

    - Ödenecek vergi = 400.000 × %3 × 8 = **96.000 TL**.

    - Üst sınır: faizler hariç, rejime tabi tutulduğu tarihte serbest dolaşıma girseydi alınacak vergiler (400.000 TL) aşılamaz
    (md. 133/2); 96.000 TL sınırın altındadır.


    **(b) Rejim sonunda serbest dolaşıma giriş**


    - Kısmi muafiyetle geçici ithal edilen eşya için yükümlülük doğduğunda vergiler, geçici ithalat beyanının yapıldığı tarihteki
    (05.01.2026) vergi oranı ve unsurlara göre hesaplanır (md. 134/1, birinci cümle); tam muafiyetteki gibi md. 193 tarihi
    esas alınmaz.

    - Kısmi muafiyet hükümleri dışında bir nedenle doğan yükümlülükte, md. 133''e göre ödenen tutar düşülür (md. 134/2).

    - Ödenecek = 400.000 − 96.000 = **304.000 TL**.


    **(c) Transit rejimi**


    - Teminat: Transit eşyası için teminat zorunludur; hava, boru hattı, demiryolu ve denizyolu taşımalarında yönetmelikteki
    haller dışında aranmaz (md. 85/1). Taşıma karayoluyla yapıldığından **teminat zorunludur**; bireysel teminat ya da izin
    varsa kapsamlı teminat verilebilir (md. 85/2).

    - Asıl sorumlu (transit rejiminde rejim hak sahibi, md. 3/20-b), eşyayı öngörülen sürede, ayniyet önlemlerine uyarak varış
    gümrük idaresine sağlam ve noksansız sunmak ve rejim hükümlerine uymakla yükümlüdür (md. 86/1); md. 183-184 kapsamında
    yükümlülük doğarsa idareye karşı mali olarak sorumludur (md. 86/3). Eşyanın transit rejimiyle taşındığını bilerek kabul
    eden taşıyıcı da sunma yükümlülüğü altındadır (md. 86/2).

    - Eşya, şüphe veya ihbar dışında varış idaresine kadar muayene edilmeksizin, gerekirse mühürle veya memur eşliğinde sevk
    edilir (md. 88/1).

    - Rejim, eşya ve belgeler varış gümrük idaresine sunulduğunda **sona erer**; hareket ve varış idarelerindeki bilgilerin
    karşılaştırılmasıyla usulüne uygun sonlandırıldığı belirlenince **ibra edilir** (md. 84/4).

    - Transit halindeki eşyanın beklenmeyen hal veya mücbir sebeple telef veya kaybı kanıtlanırsa gümrük vergileri aranmaz
    (md. 92/2).

    '
