    Gümrük kontrolü altında işleme rejimi, serbest dolaşıma girmemiş eşyanın Türkiye Gümrük Bölgesinde ithalat vergilerine
    veya ticaret politikası önlemlerine tabi tutulmaksızın niteliğini veya durumunu değiştiren işlemlere tabi tutulması ve
    bu işlemlerden elde edilen ürünlerin gümrük vergileri üzerinden serbest dolaşıma girmesine ilişkin hükümlerin uygulandığı
    rejimdir. Elde edilen ürünlere işlenmiş ürün denir.


    **(b) İzin koşulları (md. 124/2)**


    İzin sadece Türkiye Gümrük Bölgesinde yerleşik kişilere ve şu hallerde verilir: (a) işlenmiş ürünler içinde ithal eşyasının
    teşhisinin mümkün olması, (b) eşyanın işlenmesinden sonra rejime tabi tutulduğu sıradaki niteliğine dönüştürülmesinin
    ekonomik olarak mümkün olmaması, (c) rejimin uygulanmasının menşe ve miktar kısıtlaması kurallarının etkilerini saptırmaması,
