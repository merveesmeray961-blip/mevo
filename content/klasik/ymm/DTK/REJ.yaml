    \ Kuzey rejimden doğan\n  yükümlülükleri bakımından da sorumludur (md. 97/2, 105/2, 106/3).\n- Sayımda **fazla** eşya\
    \ çıksaydı fazlalık kayıtlara alınır; geçerli nedenden ileri geldiğine kanaat getirilmezse eşya tasfiye\n  edilir (md.\
