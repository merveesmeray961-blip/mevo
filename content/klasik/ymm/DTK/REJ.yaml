    \ engeli yoktur → **%4**.\n- Gümrük yükümlülüğü doğduğunda antrepo ve muhafaza masrafları fiyattan ayrı gösterilmişse\
    \ kıymete **dahil edilmez**\n  (md. 104/1). Gümrük kıymeti: 600 × 200 × 43,00 = **5.160.000 TL**.\n- Gümrük vergisi: 5.160.000\
    \ × %4 = **206.400 TL** (tescildeki oranla 516.000 TL olurdu).\n- Antrepodaki eşya için gümrükçe onaylanmış işlem veya\
    \ kullanım tayinine ilişkin beyanname verildiğinde işlemler tescil\n  tarihinden itibaren **otuz gün** içinde bitirilmelidir\
    \ (md. 70/2): 15.01.2026 + 30 gün = 14.02.2026 (Cumartesi) → süre ilk\n  iş günü **16.02.2026** mesai bitiminde sona erer\
    \ (md. 14/1).\n- Bitirilemezse md. 70/1 uygulanır: eşya muayene edilir, durum tutanağa bağlanır ve eşya md. 177–180'e\
    \ göre **tasfiye\n  edilir** (md. 177/1-f).\n\n**(c) Sayım noksanı**\n\n- İşleticiler yıl sonunda antrepo mevcutlarına\
    \ ilişkin listeyi verir ve eşya sayılır (md. 105/1). Sayımda noksan çıkan eşyanın\n  gümrük vergileri duruma göre işletici\
    \ veya kullanıcıdan tahsil edilir (md. 105/2).\n- **5 adet:** İşletici ve kullanıcının kusur ve hatalarından ileri gelmediği\
    \ kanıtlanan çalınmalar için gümrük vergileri\n  **aranmaz** (md. 106/2); eşya sigortalı olmadığından sigorta ettirenden\
    \ alma kuralı da uygulanmaz.\n- **15 adet:** Kabul edilebilir noksanlık değildir; vergi ve cezaları işletici veya kullanıcıya\
    \ tazmin ettirilir (md. 106/3).\n  Yükümlülüğün başladığı tarih kesin tespit edilemediğinden sayım tarihindeki unsurlar\
