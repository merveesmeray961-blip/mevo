- id: YMM-DTK-REJ-K016
  sinav: ymm
  ders: DTK
  konu: REJ
  kazanimlar:
  - serbest dolaşıma giriş rejimi
  - nihai kullanım
  - serbest dolaşım statüsü
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Doğu Anadolu İthalat A.Ş.** serbest dolaşıma giriş rejimiyle ilgili aşağıdaki durumlarla karşılaşmıştır:


    | No | Durum |

    |---|---|

    | 1 | Şirket, vergileri ödemeden ve ithalat için öngörülen diğer işlemleri tamamlamadan eşyanın serbest dolaşıma girmesini
    talep etmektedir. |

    | 2 | Tek taşıma belgesi kapsamında üç ayrı tarife pozisyonuna giren eşya gelmiştir: A (kıymeti 400.000 TL, vergi oranı
    %5), B (300.000 TL, %10), C (300.000 TL, %20). Her bir eşya için ayrı işlem yapılması ek iş yükü ve masraf doğuracaktır.
    Şirket, en yüksek vergi oranına tabi eşyanın tarife pozisyonuna göre vergilendirme talep etmiştir. |

    | 3 | Önceden nihai kullanım nedeniyle indirimli oranla serbest dolaşıma girmiş bir eşya, gümrük idaresinin izniyle yeniden
    ihraç edilmiştir. |

    | 4 | Serbest dolaşımdaki başka bir eşyanın serbest dolaşıma giriş beyannamesi iptal edilmiştir. |

    | 5 | Üçüncü bir eşya kusurlu çıktığı için md. 213''e göre vergileri geri verilmiştir. |


    **İstenenler:**


    (a) 1 numaralı durumda talebin sonucunu açıklayınız. (3 puan)


    (b) 2 numaralı durumda talep kabul edilirse ödenecek vergiyi, talep edilmeseydi ödenecek vergiyle karşılaştırarak hesaplayınız.
    (7 puan)


    (c) 3 numaralı durumda gümrük yükümlülüğünün doğup doğmadığını açıklayınız; nihai kullanım nedeniyle indirimli oranla
    girmiş eşyanın gözetiminin hangi hâllerde sona erdiğini yazınız. (5 puan)


    (d) 4 ve 5 numaralı durumlarda eşyanın serbest dolaşım statüsüne ne olacağını belirtiniz. (5 puan)

    '
  cozum: '**(a) Şartlar (md. 74)**


    Türkiye Gümrük Bölgesine gelen eşyanın serbest dolaşıma girişi; ticaret politikası önlemlerinin uygulanması, eşyanın ithali
    için öngörülen diğer işlemlerin tamamlanması ve kanunen ödenmesi gereken vergilerin tahsili ile mümkündür. Bu nedenle
    talep **kabul edilemez**.


    **(b) Tek taşıma belgesinde farklı pozisyonlar (md. 76)**


    Normal uygulama (her eşya kendi pozisyonuna göre): A: 400.000 x %5 = 20.000; B: 300.000 x %10 = 30.000; C: 300.000 x %20
    = 60.000; toplam = **110.000 TL**.


    Taşıma belgesi içeriği eşyanın değişik tarife pozisyonlarına girdiği hallerde, her bir eşya için kendi pozisyonuna göre
    işlem yapılmasının ek bir iş yükü ve masrafa sebep olması hâlinde, beyan sahibinin talebi üzerine gümrük idareleri eşyanın
    tamamına en yüksek ithalat vergi oranına tabi eşyanın pozisyonuna göre vergi uygulayabilir. Bu yönteme göre: (400.000
    + 300.000 + 300.000) x %20 = **200.000 TL**. Talep kabul edilirse 90.000 TL fazla vergi ödenir; talebin şirket lehine
    olmadığı görülür.


    **(c) Nihai kullanım (md. 77, md. 186/2)**


    Nihai kullanım nedeniyle indirimli veya sıfır oranla serbest dolaşıma girmiş eşyanın gümrük gözetimi, nihai kullanım olarak
    kabul edilen üretim veya kullanım faaliyetiyle sona erer; ayrıca indirimli veya sıfır vergi uygulamasına ilişkin koşulların
    sona erdiği, eşyanın ihraç veya imha edildiği, belirlenmiş amaçlar dışında kullanılması nedeniyle tahsili gereken vergilerin
    ödendiği hallerde de gözetim sona erer (md. 77/1). Nihai kullanımı nedeniyle indirimli veya sıfır oranla serbest dolaşıma
    giren eşyanın gümrük idarelerinin izni ile ihraç veya yeniden ihraç edilmesi hâlinde ithalat nedeniyle gümrük yükümlülüğü
    **doğmuş sayılmaz** (md. 186/2).


    **(d) Statü kaybı (md. 78)**


    Serbest dolaşımdaki eşya, serbest dolaşıma giriş beyannamesinin iptal edilmesi (a) ve md. 213 uyarınca eşyanın kusurlu
    veya sözleşme hükümlerine uygun olmaması nedeniyle gümrük vergilerinin geri verilmesi veya kaldırılması (c) hâllerinde
    bu statüsünü **kaybeder**. Hem 4 hem 5 numaralı durumda eşya serbest dolaşım statüsünü kaybetmiştir.


    Püf noktaları: (1) Md. 76 yöntemi beyan sahibinin talebine ve idarenin uygun görmesine bağlıdır ve her zaman lehe olmaz.
    (2) İzinli ihracat nihai kullanım eşyasında borç doğurmaz.

    '
