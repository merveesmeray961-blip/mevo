    neden: kitap düzeyi hakem kabulü
- id: YMM-DTK-REJ-K002
  sinav: ymm
  ders: DTK
  konu: REJ
  kazanimlar:
  - dahilde ve hariçte işleme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Türkiye'de yerleşik **Yıldız Tekstil A.Ş.**, gerekli hariçte işleme izinlerini alarak 2026 yılında aşağıdaki işlemleri\n\
    yapmıştır (KDV dikkate alınmayacak; Cumartesi ve Pazar resmî tatil kabul edilecektir):\n\n1. Türkiye'de üretilmiş ve serbest\
    \ dolaşımda bulunan ham kumaşı boyatmak üzere Mısır'a geçici olarak ihraç etmiştir\n   (hariçte işleme beyannamesinin\
    \ tescili 05.01.2026). Boyalı kumaş 20.03.2026'da tescil edilen beyannameyle serbest dolaşıma\n   sokulmuştur. İşlem görmüş\
    \ ürünün (boyalı kumaş) gümrük kıymeti 3.000.000 TL, ithalde uygulanacak gümrük vergisi oranı %8'dir.\n   Geçici ihracat\
    \ eşyasının, hariçte işleme beyannamesinin tescili tarihindeki miktar ve niteliği itibarıyla kıymeti\n   2.100.000 TL'dir;\
    \ bu eşya en son işlem gördüğü Mısır'dan aynı tarihte ithal edilseydi %5 gümrük vergisi uygulanacaktı.\n2. Dokuma makinesinin\
    \ arızalı kontrol modülünü, satış sözleşmesindeki garanti hükmü gereği Almanya'daki üreticisine bedelsiz\n   tamire göndermiş;\
    \ modül tamir edilip geri gelmiştir. Makinenin ilk serbest dolaşıma girişinde kusurlu olduğu dikkate alınarak\n   işlem\
    \ yapılmamıştır.\n3. Başka bir makinenin motorunu İtalya'da bedel karşılığı tamir ettirmiştir. Tamir masrafı 15.000 EUR'dur;\
    \ Yıldız tamirciye\n   başka bir ödeme yapmamış, aralarında ilişki yoktur. Yeniden ithalin tescil tarihinde kur 1 EUR\
    \ = 46,00 TL, tamir edilmiş\n   motora uygulanacak gümrük vergisi oranı %3'tür.\n4. Arızalı bir pompa için standart değişim\
    \ sistemini kullanmıştır. Aynı tarife pozisyonunda, aynı ticari nitelik ve teknik\n   özelliklere sahip, kullanılmış durumdaki\
    \ ikame pompa teminat verilerek önceden ithal edilmiş; serbest dolaşıma giriş\n   beyannamesi 10.03.2026'da tescil edilmiştir.\
    \ Arızalı pompanın geçici ihracat beyannamesi 11.05.2026'da tescil edilmiş ve pompa\n   aynı gün yurt dışına çıkmıştır.\n\
    5. Yıldız, ithalinde nihai kullanımı nedeniyle tam muafiyetle serbest dolaşıma giren ve bu muafiyetin koşullarını taşımaya\n\
    \   devam eden bir ölçüm cihazını da hariçte işleme rejimi kapsamında yurt dışında kalibre ettirmek istemektedir.\n\n\
    **İstenenler:**\n\n(a) Hariçte işleme rejimini tanımlayınız, iznin verilme şartlarını açıklayınız ve (5) numaralı talebi\
    \ değerlendiriniz.\n(6 puan)\n\n(b) (1) numaralı işlemde ödenecek ithalat vergisini hesaplayınız; hesaplamada esas alınacak\
    \ tarih ve unsurları belirtiniz.\n(7 puan)\n\n(c) (2) ve (3) numaralı işlemlerde ithalat vergilerini belirleyiniz. (6\
    \ puan)\n\n(d) (4) numaralı işlemde standart değişim sisteminin şartlarını, arızalı pompanın ihracı için sürenin son gününü\
    \ ve ihracın\nsüresinde olup olmadığını, ikame ürüne ilişkin teminatı ve vergilendirmede esas alınacak tarihi açıklayınız.\
    \ (6 puan)\n"
  cozum: "**(a) Rejim ve izin**\n\n- Hariçte işleme rejimi, serbest dolaşımdaki eşyanın hariçte işleme faaliyetlerine tabi\
    \ tutulmak üzere Türkiye Gümrük\n  Bölgesinden geçici olarak ihracı ve elde edilen ürünlerin ithalat vergilerinden **tam\
    \ veya kısmi muafiyetle** yeniden serbest\n  dolaşıma girişine ilişkin rejimdir (md. 135/1). Geçici ihraçta ihracata ilişkin\
    \ vergi, önlem ve işlemler uygulanır\n  (md. 135/2).\n- İzin, talep üzerine işleme faaliyetini **yaptıracak kişiye** verilir\
    \ (md. 137/1); izin ancak (a) Türkiye Gümrük Bölgesinde\n  **yerleşik** kişilere, (b) işlem görmüş ürünlerin geçici ihracat\
    \ eşyasından elde edildiğinin **tespiti mümkün** olan\n  hâllerde, (c) Türkiye'deki üreticilerin temel ekonomik çıkarlarına\
    \ **ciddi zarar vermeyecek** durumlarda verilir (md. 138).\n- (5): Rejim, ihracından önce **nihai kullanımları nedeniyle\
    \ tam muafiyetle** serbest dolaşıma giren ve muafiyet koşullarını\n  taşımaya devam eden eşyaya **uygulanmaz** (md. 136/b);\
    \ istisnalar yönetmelikle belirlenir. Talep kural olarak kabul edilmez.\n\n**(b) Fark yöntemi**\n\n- Ödenecek ithalat\
    \ vergisi, işlem görmüş ürünlerin ithalat vergilerinden, geçici ihracat eşyası en son işlem gördüğü ülkeden\n  **aynı\
    \ tarihte** ithal edilseydi uygulanacak ithalat vergileri **indirilerek** hesaplanır (md. 141/1).\n- İndirilecek tutarda\
    \ geçici ihracat eşyasının **hariçte işleme beyannamesinin tescili tarihindeki miktar ve niteliği** ile\n  işlem görmüş\
    \ ürünlerin **yeniden serbest dolaşıma girişine ilişkin beyannamenin tescili tarihindeki** diğer vergilendirme\n  unsurları\
    \ dikkate alınır (md. 141/2).\n  - İşlem görmüş ürünün vergisi: 3.000.000 × %8 = 240.000 TL\n  - İndirilecek tutar: 2.100.000\
    \ × %5 = 105.000 TL\n  - Ödenecek: 240.000 − 105.000 = **135.000 TL**\n- Muafiyet, işlem görmüş ürünün serbest dolaşıma\
    \ giriş beyanının izin hak sahibi (veya onayıyla yerleşik başka bir kişi)\n  adına ya da hesabına yapılması ve izin koşullarına\
    \ uyulması hâlinde tanınır (md. 140/1).\n\n**(c) Tamir**\n\n- (2): Tamirin garanti nedeniyle sözleşmeye bağlı olarak **bedelsiz**\
    \ yapıldığı kanıtlandığından ve ilk girişte kusur dikkate\n  alınarak işlem yapılmadığından modül serbest dolaşıma ithalat\
    \ vergilerinden **tam muaf** girer; vergi **0 TL** (md. 142).\n- (3): Bedelli tamirde ithalat vergileri, gümrük kıymeti\
    \ olarak **tamir masraflarına eşit tutar** dikkate alınarak, işlem görmüş\n  ürünün serbest dolaşıma giriş beyannamesinin\
    \ tescil tarihindeki oran ve unsurlarla belirlenir; izin hak sahibinin başka ödeme\n  yapmamış olması ve ödemenin ilişkiden\
    \ etkilenmemesi gerekir (md. 143). Kıymet: 15.000 × 46,00 = 690.000 TL; vergi:\n  690.000 × %3 = **20.700 TL**.\n\n**(d)\
    \ Standart değişim**\n\n- Standart değişim sisteminde ikame ürün olarak adlandırılan ithal eşyası işlem görmüş ürün yerine\
    \ geçer; serbest dolaşımdaki\n  eşyanın tamirinde izin verilir (md. 144/1-2). İkame ürünün geçici ihracat eşyasıyla **aynı\
    \ tarife pozisyonuna** girmesi,\n  **aynı ticari nitelikte** ve **aynı teknik özelliklere** sahip olması; geçici ihracat\
    \ eşyası kullanılmışsa ikamenin de\n  **kullanılmış** olması gerekir (garanti, kanuni yükümlülük veya imalat hatasıyla\
    \ bedelsiz verilmesi hâlinde yeni olabilir)\n  (md. 145).\n- İthalatın önceden yapılmasına, ithalat vergilerini karşılayan\
    \ **teminat** verilmesi hâlinde izin verilir (md. 144/4).\n- İthalat önceden yapıldığında geçici ihracat eşyası, ikame\
    \ ürünün serbest dolaşıma giriş beyannamesinin tescilinden itibaren\n  **iki ay** içinde ihraç edilmelidir (md. 146).\
    \ Süre 10.05.2026'da biter; bu gün Pazar olduğundan süre ilk iş günü olan\n  **11.05.2026** mesai bitiminde sona erer\
    \ (md. 14/1-2). İhraç **süresindedir**. İstisnai hâllerde süre dolmadan talep üzerine\n  makul ölçüde uzatılabilir.\n\
    - md. 141 uygulanırken indirilecek tutar, **geçici ihracat beyannamesinin tescili tarihindeki** vergi oranı ve unsurlara\
    \ göre\n  belirlenir (md. 147). Standart değişim işlemleri md. 137/2 ve md. 138/b'ye tabi değildir (md. 148).\n"
