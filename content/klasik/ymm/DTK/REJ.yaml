    \ olumsuz etkilenmediği hâllerde\n  verilir (md. 124).\n- İzin süresi azami iki yıldır; süre izin belgesinin tarihinden\
    \ başlar, izin süresinin bittiği **ayın son günü** sona erer\n  (GY md. 372/1): 05.03.2026 + 6 ay = 05.09.2026 → **30.09.2026**.\
    \ Rejime girişte vergiler teminata bağlanır (GY md. 373/5).\n\n**(b) İşlenmiş ürün**\n\n- Kıymet, ilgilinin tercihine\
