    \ 106/1).\n- Gümrük idaresi işleticiden md. 96'daki sorumluluklarla ilgili **teminat** ister; fuar ve sergi eşyası, ithalat\
    \ vergilerinden\n  muaf eşya ve ihraç edilmek üzere konulan eşya için teminat aranmaz. Teminat alınmış olsa bile gümrük\
