- id: YMM-DTK-REJ-K012
  sinav: ymm
  ders: DTK
  konu: REJ
  kazanimlar:
  - geçici ithalat rejimi
  - kısmi muafiyet
  - gümrük vergisinin hesaplanması
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: '**Pasifik Mühendislik A.Ş.**, mülkiyeti Singapur''da yerleşik bir firmaya ait bir üretim hattı makinesini 2/3/2026
    tarihinde kısmi muafiyet suretiyle geçici ithalat rejimine tabi tutmuştur (geçici ithalat beyannamesi aynı gün tescil
    edilmiştir). Makine tescil tarihinde serbest dolaşıma girmiş olsaydı alınacak ithalat vergileri toplamı 600.000 TL olacaktı.
    Vergi oranı ve diğer vergilendirme unsurları rejim süresince değişmemiştir. Makine 20/8/2026''da yeniden ihraç edilmiştir.


    **İstenenler:**


    (a) Şirketin kullanım süresi boyunca ödemesi gereken toplam ithalat vergisini hesaplayınız. Aylık vergi oranını ve bir
    aydan az sürelerin nasıl değerlendirildiğini belirtiniz. (6 puan)


    (b) Makinenin (istisnai olarak uzatılan süreyle) 36 ay boyunca bu rejimde kalmış olması hâlinde ödenecek toplam vergiyi
    bulunuz. (5 puan)


    (c) Makine bir başka senaryoda 12 ay kısmi muafiyetle kullanıldıktan sonra rejim şartlarına uyulmaması nedeniyle gümrük
    yükümlülüğü doğmuşsa, ödenecek ithalat vergisini hesaplayınız (12 ay için md. 133''e göre vergi ödenmiştir). (5 puan)


    (d) Kısmi muafiyet suretiyle geçici ithalat rejiminden kimlerin eşyasının yararlanabileceğini ve tam muafiyetli rejimde
    eşyanın rejim altında kalabileceği azami süreyi belirtiniz. (4 puan)

    '
  cozum: '**(a) Aylık vergi**


    Kısmi muafiyet suretiyle geçici ithalat rejimine tabi eşyadan her ay için alınacak ithalat vergileri, geçici ithalat beyannamesinin
    tescil tarihinde eşyanın serbest dolaşıma girmiş olması hâlinde alınacak vergiler tutarının %3''üdür (md. 133/1). Aylık
    vergi = 600.000 x %3 = 18.000 TL. Vergiler eşyanın rejimden yararlandığı her ay için alınır ve bir aydan daha az süreler
    tam ay olarak değerlendirilir: 2/3/2026 - 20/8/2026 arası 5 tam ay ve ay kesri vardır, kesir tam ay sayılır: 6 ay. Toplam
    = 6 x 18.000 = **108.000 TL**.


    **(b) Üst sınır**


    36 ay x 18.000 = 648.000 TL olur; ancak alınacak ithalat vergileri tutarı, faizler hariç olmak üzere, eşyanın rejime tabi
    tutulduğu tarihte serbest dolaşıma girmesi hâlinde alınacak vergileri aşamaz (md. 133/2). Toplam **600.000 TL**''dir.


