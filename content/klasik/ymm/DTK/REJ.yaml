  soru: "**Deniz Konfeksiyon A.Ş.** (Türkiye'de yerleşik) 01.02.2026 tarihli dahilde işleme izniyle **şartlı muafiyet sistemi**\n\
    kapsamında gömlek üretimi için kumaş ithal etmektedir. İzinde ihracat süresi 12 ay, verimlilik oranı 1,25 metre kumaştan\n\
    1 gömlek olarak belirlenmiştir.\n\n- 10.02.2026'da tescil edilen dahilde işleme beyannamesiyle 50.000 metre kumaş ithal\
    \ edilmiştir. CIF bedel 500.000 USD, kur\n  1 USD = 42,00 TL, gümrük vergisi oranı %8'dir. Vergiler banka teminat mektubuyla\
    \ teminata bağlanmıştır.\n- Üretilen gömleklerden 36.000 adedi ihracat beyannamesiyle beyan edilmiş; gömlekler beyannamenin\
    \ tescili sırasındaki durum ve\n  nitelikleriyle Türkiye Gümrük Bölgesini terk etmiştir.\n- 4.000 adet gömlek ise iç piyasada\
    \ satılmıştır. Şirket bu gömleklere isabet eden vergileri 10.10.2026'da ödeyecektir.\n- Şirket, ileride ithal edeceği\
    \ kumaşla aynı özellik ve nitelikteki yerli kumaştan ürettiği gömlekleri ithalattan önce ihraç\n  etmeyi düşünmektedir.\n\
    \nKDV dikkate alınmayacaktır. 6183 sayılı Kanun md. 51'e göre gecikme zammı oranı aylık %3,7'dir; hesap tam ay üzerinden\n\
