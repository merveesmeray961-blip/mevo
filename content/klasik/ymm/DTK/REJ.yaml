    - **Eşdeğer eşya:** İthal eşyasının yerine kullanılan serbest dolaşımdaki eşyadır (md. 108/7). İşlem görmüş ürünlerin\
    \ eşdeğer\n  eşyadan elde edilmesine ve **ithal eşyası serbest dolaşıma girmeden önce ihraç edilmesine** izin verilebilir;\
    \ eşdeğer eşya\n  ithal eşyasıyla aynı özellik ve nitelikte olmalıdır; bu durumda ithal eşyası eşdeğer, eşdeğer eşya ithal\
    \ eşyası sayılır\n  (md. 109). Şirketin düşüncesi izin kapsamında mümkündür.\n\n**(b) İhracat ve iç piyasa satışı**\n\n\
