    | 5 | md. 241/4-a (geçerli temsil yetkisi olmadan iş takibi) | 4 | **5.976 TL** |


    **(c) Toplam**


    2.988 + 0 + 2.988 + 5.976 + 5.976 = **17.928 TL**.


    **(d) Güncelleme**


    Md. 241/1''deki miktar, her yıl bir önceki yıla ilişkin olarak 213 sayılı VUK uyarınca belirlenen yeniden değerleme oranında
    artırılır; bu hesaplamada 1.000.000 TL''ye kadar olan tutarlar dikkate alınmaz (md. 241/2).


