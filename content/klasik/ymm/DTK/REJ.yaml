- id: YMM-DTK-REJ-K007
  sinav: ymm
  ders: DTK
  konu: REJ
  kazanimlar:
  - gümrük antrepo rejimi
  - antrepo işleticisinin sorumluluğu
  - sayım farkları
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Liman Genel Antrepoları A.Ş.** genel antrepo işletmektedir. Yıl sonunda antrepo mevcut listesi gümrük idaresine
    verilmiş ve idare sayım yapmıştır. Sayım sonucu şöyledir (eşyanın ton başına gümrük vergisi 50.000 TL, ton başına gümrüklenmiş
    değeri 300.000 TL''dir):


    | Fark | Açıklama |

    |---|---|

    | 1 ton noksan | Eşyanın niteliğinden kaynaklanan fire; fire, gümrük idaresince kabul edilmiştir. |

    | 1 ton noksan | Hırsızlık; işleticinin kusur ve hatasından ileri gelmediği gümrük idaresine kanıtlanmıştır. |

    | 1 ton noksan | Hiçbir açıklaması yapılamamıştır. |

    | 2 ton fazla | Fazlalığın geçerli nedenlerden ileri geldiğine idarece kanaat getirilmemiştir. |


    **İstenenler:**


    (a) Antrepo işleticisinin kanunen sorumlu olduğu hususları sayınız. (4 puan)


    (b) Birinci ve ikinci noksanlıklar için gümrük vergisi aranıp aranmayacağını gerekçesiyle belirtiniz. (5 puan)


    (c) Üçüncü noksanlık için aranacak vergi ve ayrıca verilecek idari para cezasını hesaplayınız; tutarın işleticiye tazmin
    ettirilip ettirilmeyeceğini belirtiniz. (8 puan)


    (d) Fazla çıkan eşyanın akıbetini açıklayınız; fazlalık nedeniyle ayrıca para cezası uygulanacak mıdır, hesaplayınız.
    (5 puan)

    '
  cozum: '**(a) İşleticinin sorumlulukları (md. 96)**


    Antrepo işleticisi: (1) gümrük antreposunda bulunduğu süre içinde eşyanın gümrük gözetimi altında bulunmasını sağlamaktan,
    (2) gümrük antrepo rejimi kapsamında eşyanın muhafaza edilmesiyle ilgili yükümlülükleri yerine getirmekten, (3) izinde
    belirtilen özel şartlara uymaktan sorumludur. Ayrıca antrepo kayıtlarını tutmak ve eşyayı konulduğu tarihte kayıtlara
    geçirmek zorundadır (md. 99).


    **(b) Fire ve hırsızlık (md. 106/2)**


    Eşyanın niteliğinden kaynaklanan kayıplar ve fireler ile işletici ve kullanıcıların kusur ve hatalarından ileri gelmediği
    gümrük idaresine kanıtlanan telef, kayıp ve çalınmalar için gümrük vergileri aranmaz. İlk iki noksanlık bu kapsama girer:
    **vergi aranmaz**.


    **(c) Açıklanamayan noksan**


    Md. 106/2''deki nedenler dışında kalan noksanlıklar kabul edilmez; bunların vergi ve cezaları toplamından oluşan tutar
    yerine göre işletici veya kullanıcıya tazmin ettirilir (md. 106/3). Sayımlarda kayıtlara göre eşyanın bir kısmının noksan
    olduğunun anlaşılması hâlinde, bu eşyanın gümrük vergilerinin yanı sıra gümrüklenmiş değerinin iki katı idari para cezası
    verilir (md. 236/1). Vergi = **50.000 TL**; ceza = 300.000 x 2 = **600.000 TL**; toplam 650.000 TL işleticiye tazmin ettirilir.


    **(d) Fazla çıkan eşya**


