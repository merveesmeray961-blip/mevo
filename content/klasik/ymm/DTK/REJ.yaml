- id: YMM-DTK-REJ-K003
  sinav: ymm
  ders: DTK
  konu: REJ
  kazanimlar:
  - antrepo
  - serbest dolaşıma giriş
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Boğaziçi Lojistik A.Ş.** bir genel antrepo işletmektedir. İşletme izninde, md. 96'nın (a) ve (b) bentlerindeki\n\
    yükümlülüklerin münhasıran kullanıcıya ait olduğuna ilişkin bir kayıt yoktur. **Kuzey Elektronik A.Ş.** 01.10.2025'te\n\
    1.000 adet monitörü (CIF 200 USD/adet) bu antrepoda antrepo rejimine tabi tutmuştur.\n\n1. 31.12.2025 yıl sonu sayımında\
    \ kayıtlarda 1.000 adet görünen monitörlerden 980 adet bulunmuştur. Eksik 20 adedin 5'inin\n   hırsızlık sonucu çalındığı\
    \ ve işletici ile kullanıcının kusur veya hatasından ileri gelmediği gümrük idaresine kanıtlanmıştır;\n   kalan 15 adet\
    \ için hiçbir açıklama yapılamamıştır. Eşya gümrüklenmiş kıymeti üzerinden sigortalı değildir. Sayım tarihinde\n   gümrük\
    \ vergisi oranı %10, KDV oranı %20, kur 1 USD = 43,00 TL'dir.\n2. 15.01.2026'da 600 adet monitör için serbest dolaşıma\
    \ giriş beyannamesi tescil edilmiştir. Tescil tarihinde gümrük vergisi\n   oranı %10'dur; 20.01.2026'da yürürlüğe giren\
    \ Cumhurbaşkanı Kararıyla oran %4'e indirilmiştir. Bu tarihte vergiler henüz\n   ödenmemiş ve teminata bağlanmamıştır;\
    \ işlemlerin tamamlanamaması Kuzey'den kaynaklanmamaktadır. Faturada CIF bedelden ayrı\n   olarak adet başına 8 USD antrepo\
    \ ve muhafaza masrafı gösterilmiştir. Kur 1 USD = 43,00 TL'dir.\n\nBu soruda \"gümrük vergileri\" gümrük vergisi ile ithalde\
    \ alınan KDV'yi kapsar; gümrüklenmiş değer CIF kıymeti ile bu vergilerin\ntoplamıdır. Cumartesi ve Pazar resmî tatil olup\
    \ gün hesabında süreyi başlatan gün sayılmaz.\n\n**İstenenler:**\n\n(a) Antreponun türünü, işletici ile kullanıcının sorumluluklarını,\
    \ teminat yükümlülüğünü ve eşyanın antrepoda kalış süresini\naçıklayınız. (6 puan)\n\n(b) Olay 2'de uygulanacak gümrük\
    \ vergisi oranını, gümrük kıymetini ve gümrük vergisini hesaplayınız; beyannameye ilişkin\nişlemlerin hangi tarihe kadar\
    \ bitirilmesi gerektiğini ve bitirilmemesinin sonucunu belirtiniz. (9 puan)\n\n(c) Olay 1'de çalınan 5 adet ile açıklanamayan\
