    | No | İşlem |

    |---|---|

    | 1 | Havayoluyla yapılan bir transit taşıma için teminat gerekip gerekmediği sorulmaktadır (yönetmelikle belirlenen haller
    dışındadır). |

    | 2 | Karayoluyla yapılan transit taşıma için şirket, birden fazla işlemi kapsayan kapsamlı teminat izni talep etmektedir.
    Şirket Türkiye''de yerleşiktir, rejimi düzenli kullanmaktadır; ancak geçen yıl yönetmelikte belirlenen surette gümrük
    mevzuatını ihlal etmiştir. |

    | 3 | Şirketin sevk ettiği bir transit eşyayı, rejime göre taşındığını bilerek alt taşıyıcı (T) kabul etmiştir. Eşya varış
    gümrük idaresine sunulmamıştır. |

    | 4 | Transit eşya taşıyan bir tır seyir halindeyken beklenmeyen bir arıza nedeniyle yoluna devam edememiştir. |

    | 5 | Başka bir sevkiyatta, Türkiye Gümrük Bölgesi içindeki transit halindeki eşya mücbir sebeple tamamen yanmıştır; bu
    durum kanıtlanmıştır. |

    | 6 | Transit eşya, herhangi bir şüphe veya ihbar bulunmadığı bir durumda sevk edilecektir. |


    **İstenenler:**


    (a) 1 numaralı işlemde teminat zorunluluğunu, 2 numaralı işlemde kapsamlı teminat iznine ilişkin şartları değerlendiriniz.
