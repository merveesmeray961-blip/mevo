    \ tescili sırasındaki durum ve\n  nitelikleriyle Türkiye Gümrük Bölgesini terk etmiştir.\n- 4.000 adet gömlek ise iç piyasada\
    \ satılmıştır. Şirket bu gömleklere isabet eden vergileri 10.10.2026'da ödeyecektir.\n- Şirket, ileride ithal edeceği\
    \ kumaşla aynı özellik ve nitelikteki yerli kumaştan ürettiği gömlekleri ithalattan önce ihraç\n  etmeyi düşünmektedir.\n\
    \nKDV dikkate alınmayacaktır. 6183 sayılı Kanun md. 51'e göre gecikme zammı oranı aylık %3,7'dir; hesap tam ay üzerinden\n\
