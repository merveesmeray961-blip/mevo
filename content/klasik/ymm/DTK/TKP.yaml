    puan: 4
  - olcut: (c) (3) için üç yıl ve ayniyet şartıyla gümrük vergisi muafiyeti (md. 168, 169)
    puan: 2
  - olcut: (c) (3) için KDV istisnasında 300.000 TL'nin ödenmesi veya teminat (KDVK md. 16/1-b)
