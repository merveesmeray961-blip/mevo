    \ ve dokuz ay** olabilir.\n- Soruşturma özel durumlar dışında **bir yılda** sonuçlandırılır, gerektiğinde **altı ay**\
    \ uzatılabilir (Yönetmelik md. 30).\n- Kesin önlem yürürlüğe girdiği tarihten (veya en son gözden geçirme soruşturmasının\
    \ sonuçlandığı tarihten) itibaren **beş yıl**\n  sonra kalkar; yerli üreticiler sürenin bitiminden **en geç üç ay önce**\
    \ nihai gözden geçirme talep edebilir ve soruşturma\n  sürerken önlem yürürlükte kalır (md. 35).\n\n**(d) (İ) İthalat\
