    gözden geçirme yapılmadığı, (ii) Veri 1''deki gözden geçirme sonuçlandığı varsayımlarında bulunuz. (7 puan)


    (b) P1 ve P2 için kesin vergi tutarını hesaplayınız; teminatla kesin vergi arasındaki farkın akıbetini belirtiniz. (7
    puan)


