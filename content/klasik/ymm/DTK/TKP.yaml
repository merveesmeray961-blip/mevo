    \ az olmaması** gerekir.\n  - 32 / (32 + 18) = **%64** > %50\n  - 32 / 100 = **%32** ≥ %25\n- Her iki koşul sağlandığından\
    \ şikâyet üretim dalı adına yapılmış sayılır. Genel Müdürlük incelemeyi **azami 45 gün** içinde\n  tamamlayarak soruşturma\
    \ açılıp açılmaması konusunda Kurula teklifte bulunur (md. 20).\n\n**(b) Damping marjı ve ihmal edilebilirlik**\n\n- Damping,\
    \ ihraç fiyatının benzer malın normal değerinin altında olmasıdır; **damping marjı** normal değerin ihraç fiyatını\n \
    \ aştığı miktardır (3577 sayılı Kanun md. 2/a, 2/g).\n- **X:** Piyasa ekonomisi uygulamayan ülkeden ithalatta normal değer,\
    \ piyasa ekonomisi uygulanan üçüncü bir ülkenin iç piyasasında\n  benzer mal için ödenen fiyat esas alınarak hesaplanabilir\
    \ (Yönetmelik md. 7/a) → **12,00 USD/m²**. Marj: 12,00 − 9,00 =\n  **3,00 USD/m²**; ihraç fiyatına oranı 3,00 / 9,00 =\
    \ **%33,33** > %2. Payı %18 > %3. İhmal edilemez.\n- **Y:** Marj: 10,00 − 9,85 = 0,15 USD/m²; ihraç fiyatına oranı 0,15\
    \ / 9,85 = **%1,52** < %2 → **ihmal edilebilir** (md. 28/A-a);\n  ithalat payı %9 olsa da önlem alınmaz, Y için soruşturma\
    \ kapatılır (md. 29).\n- **W, V, U:** Her birinin payı %3'ün altındadır ve toplamları %2 + %2,5 + %1,5 = **%6**, %7'yi\
    \ geçmemektedir → ithalat miktarı\n  **ihmal edilebilir**; marjları %2'nin üzerinde olsa da önlem alınmaz (md. 28/A-b,\
    \ 29).\n\n**(c) Önlemler ve süreler**\n\n- Kesin önlem olarak damping marjı kadar **veya zararı ortadan kaldıracak daha\
    \ az** miktarda dampinge karşı vergi alınır (3577\n  md. 7, 13) → X için **2,00 USD/m²** (3,00 USD değil). Önlem ithalatı\
    \ engellemez; mükellef ithalatçıdır (md. 8, 13).\n- Geçici önlem teminat şeklindedir ve soruşturmanın açılmasından itibaren\
    \ **60 gün** içinde uygulanmaz (md. 12): 60 günlük süre\n  03.04.2026'da dolar; geçici önlem en erken **04.04.2026**'dan\
