- id: YMM-DTK-TKP-K001
  sinav: ymm
  ders: DTK
  konu: TKP
  kazanimlar:
  - tasfiyelik eşya
  - kaçakçılık ve 5607 sayılı Kanun
  - ithalatta haksız rekabetin önlenmesi (damping ve sübvansiyon)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay 1 — Tasfiye.** (T) Tekstil A.Ş.''nin geçici depolama yerindeki eşyası için Gümrük Kanunu md. 50''de verilen
    süre içinde gümrükçe onaylanmış bir işlem veya kullanım tayini için işlem başlatılmamıştır. Eşya tasfiye idaresine intikal
    ettirilmiş ve ihale yoluyla 900.000 TL''ye satılmıştır. Satış bedelinden karşılanacak kalemler şunlardır:


    | Kalem | Tutar (TL) |

    |---|---|

    | Hizmet karşılığı alacaklar ve yapılmış masraflar (ambarlama) | 100.000 |

    | Gümrük vergileri | 500.000 |

    | Satış için yapılmış masraflar | 50.000 |

    | Para cezaları | 400.000 |


    **Olay 2 — Kaçakçılık.** Bay (D), aldatıcı belgelerle gümrük vergilerini ödemeden ülkeye eşya sokmuş (5607 md. 3/2), suç
    konusu eşyanın gümrüklenmiş değeri 250.000 TL olarak tespit edilmiştir. Bay (D) mükerrir değildir; suç örgüt faaliyeti
    çerçevesinde işlenmemiştir. Bay (D) kovuşturma evresinde, hüküm verilmeden önce Hazineye ödeme yapmak istemektedir.


    **Olay 3 — Damping.** (İ) İthalat A.Ş., damping soruşturması süresince geçici önlem kapsamında 600.000 TL teminat vererek
    bir parti mal ithal etmiştir. Soruşturma, dampingli ithalatın maddi zarara neden olduğu belirlenerek sonuçlanmış; bu partiye
    ilişkin kesinleşen dampinge karşı vergi 450.000 TL olmuştur.


    **İstenenler:**


    (a) Olay 1''deki eşyanın tasfiyelik hâle gelme sebebini belirtiniz ve satış bedelinin Gümrük Kanunu md. 180''e göre dağıtımını
    tablo hâlinde gösteriniz; eşya sahibine emanete alınacak tutar var mıdır? (10 puan)


    (b) Olay 2''de Bay (D)''nin etkin pişmanlıktan yararlanabilmesi için ödemesi gereken tutarı ve cezada yapılacak indirimi
    gerekçesiyle belirtiniz. Ödeme soruşturma evresinde yapılsaydı sonuç ne olurdu? (7 puan)


    (c) Olay 3''te teminat ile kesin vergi arasındaki farkın nasıl işlem göreceğini 3577 sayılı Kanun md. 14''e göre açıklayınız;
    kesin vergi 750.000 TL olsaydı sonuç ne olurdu? (8 puan)

    '
  cozum: '**(a) Tasfiye ve satış bedelinin dağıtımı**

    - Md. 50''ye göre verilen süre içinde işlem başlatılmayan eşya md. 177/1-b uyarınca tasfiyelik hâle gelir ve md. 178''e
    göre (burada ihale yoluyla satış) tasfiye edilir.

    - Md. 180/1''e göre (b) bendindeki eşyanın satış bedelinden sırasıyla hizmet karşılığı alacaklar ve masraflar, gümrük
    vergileri, satış masrafları ve para cezaları ayrılır:


    | Sıra | Kalem | İstenen | Ayrılan | Kalan bedel |

    |---|---|---|---|---|

    | 1 | Hizmet alacakları ve masraflar | 100.000 | 100.000 | 800.000 |

    | 2 | Gümrük vergileri | 500.000 | 500.000 | 300.000 |

    | 3 | Satış masrafları | 50.000 | 50.000 | 250.000 |

    | 4 | Para cezaları | 400.000 | **250.000** | 0 |


    - Para cezalarının 150.000 TL''lik kısmı satış bedelinden karşılanamaz. Artan para olmadığından eşya sahibi adına emanete
    alınacak tutar **yoktur** (artan olsaydı emanete alınır, bir yıl içinde alınmazsa döner sermaye işletmesine irat kaydedilirdi).


    **(b) Etkin pişmanlık**

    - Md. 3/7 dışındaki suçlarda gümrüklenmiş değerin iki katı Hazineye ödenir: 2 × 250.000 = **500.000 TL** (md. 5/2).

    - Kovuşturma evresinde hüküm verilinceye kadar ödenirse ceza **üçte bir** oranında indirilir (md. 5/2-b).

    - Ödeme soruşturma evresi sona erinceye kadar yapılsaydı ceza **yarı** oranında indirilirdi (md. 5/2-a). Hüküm mükerrirlere
    ve örgüt faaliyeti çerçevesinde işlenen suçlara uygulanmaz (md. 5/3); Bay (D) bu kapsamda değildir.


    **(c) Teminat ve kesin vergi**

    - Kesinleşen vergi (450.000 TL) teminattan (600.000 TL) düşük olduğundan aradaki **150.000 TL geri ödenir**; 450.000 TL
    kesinleşir (md. 14/1).

    - Kesin vergi 750.000 TL olsaydı kesinleşen vergi teminattan yüksek olduğundan **fark (150.000 TL) tahsil edilmezdi**;
    teminat olarak alınan 600.000 TL kesinleşirdi.

    - Zarar türü maddi zarar olduğundan teminatın tahsili için Kurulun ayrıca "geçici önlem nedeniyle maddi zarar oluşmadığı"
    belirlemesi aranmaz (md. 13; bu belirleme maddi zarar tehdidi veya üretim dalının kurulmasının gecikmesi hâllerinde gerekir).

    '
  puanlama:
  - olcut: Tasfiyelik hâlin md. 177/1-b ile açıklanması
    puan: 2
  - olcut: Md. 180'deki dağıtım sırasının doğru verilmesi
    puan: 3
  - olcut: Para cezalarına 250.000 TL ayrılması ve tablonun doğru kurulması
    puan: 3
  - olcut: Emanete alınacak tutarın bulunmadığının gerekçeli tespiti
    puan: 2
  - olcut: Ödenecek tutarın 500.000 TL (iki kat) olarak bulunması
    puan: 3
  - olcut: Kovuşturma evresinde üçte bir, soruşturma evresinde yarı indirim
    puan: 4
  - olcut: 450.000 TL kesin vergide 150.000 TL'nin iadesi
    puan: 4
  - olcut: 750.000 TL hâlinde farkın tahsil edilmeyeceği ve md. 13'teki maddi zarar ayrımı
    puan: 4
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 177, 178, 180
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 3, 5
  - mevzuat: 3577 sayılı İthalatta Haksız Rekabetin Önlenmesi Hakkında Kanun
    madde: md. 13, 14
  gecerlilik:
    baslangic: '2020-04-15'
    bitis: null
  dogrulama:
