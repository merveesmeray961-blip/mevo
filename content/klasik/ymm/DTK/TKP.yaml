    \ maliyet fiyatından az olamaz (diğer ürünlerde bu fiyatın %60'ından) (md. 16/A-3):\n  30.000 × 18 = **540.000 TL** asgari\
    \ bedel. Bedel il özel idaresinin veya yatırım izleme ve koordinasyon başkanlığının\n  **bütçesine** gelir kaydedilir.\
    \ Rafineri süreçlerine zarar verecekse lisanslı tesislerde bertaraf edilir.\n- Teknik düzenlemelere **uygun** olsaydı\
