    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-DTK-TKP-K002
  sinav: ymm
  ders: DTK
  konu: TKP
  kazanimlar:
  - gümrük kanunu muafiyetleri
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "2026 yılında yaşanan aşağıdaki olayları 4458 sayılı Gümrük Kanunu ve 3065 sayılı KDV Kanunu yönünden değerlendiriniz.\
    \ ÖTV yönü\ndikkate alınmayacak; Cumhurbaşkanı Kararıyla belirlenen ayrıntılı şartların sağlandığı varsayılacaktır.\n\n\
    1. Bay (A), on yıldır yaşadığı Almanya'dan yerleşim yerini Türkiye'ye nakletmiştir. Beraberinde kullanılmış ev eşyasını\
    \ ve\n   2023 yılında, 1 yaşındayken satın alıp kullandığı 2022 model otomobilini getirmiştir.\n2. Bayan (B), yolcu beraberinde\
    \ değeri 380 Avro olan hediyelik eşya getirmiştir. Bay (C) ise yolcu beraberinde getirdiği,\n   kişisel ve hediyelik eşya\
    \ kapsamı dışında kalan iki cep telefonunu beyan etmeden çıkmak isterken yakalanmıştır; bu eşyanın\n   gümrük vergileri\
    \ toplamı 9.000 TL olarak hesaplanmıştır.\n3. (E) Makine A.Ş., 20.06.2023'te KDV ihracat istisnası uygulayarak ihraç ettiği\
    \ makineyi alıcının iadesi üzerine 10.04.2026'da\n   geri getirmiş ve serbest dolaşıma sokmak istemektedir. Makine yurt\
    \ dışında işlem görmemiş, ayniyeti değişmemiştir; ihracı bir\n   dış ticaret önlemine konu olmamıştır. İhracat bedeli\
    \ 1.500.000 TL olup istisna nedeniyle hesaplanmayan KDV 300.000 TL'dir.\n4. (F) A.Ş., hariçte işleme rejimi kapsamında\
    \ yurt dışına gönderip işleme tabi tutturduğu kalıpları geri getirmiş ve \"geri gelen\n   eşya\" muafiyeti talep etmiştir.\n\
    5. (G) Ltd., 15.03.2022'de ihraç ettiği bir jeneratörü 20.05.2026'da aynı hâliyle geri getirmiştir; süre uzatımını gerektiren\n\
    \   beklenmeyen hâl veya mücbir sebep yoktur.\n6. Cumhurbaşkanınca belirlenen kuruluşlar arasında yer alan bir üniversite,\
    \ ticari amaç gütmeden bilimsel araştırmada kullanmak\n   üzere elektron mikroskobu ithal etmiştir.\n\n**İstenenler:**\n\
    \n(a) Bay (A)'nın getirdiği eşyanın gümrük vergileri ve ithalde KDV bakımından durumunu açıklayınız. (7 puan)\n\n(b) Bayan\
    \ (B) ve Bay (C)'nin durumunu değerlendiriniz; Bay (C)'den alınacak tutarı ve ödememesinin sonucunu belirtiniz. (6 puan)\n\
    \n(c) 3, 4 ve 5 numaralı olayları geri gelen eşya hükümleri yönünden değerlendiriniz; 3 numaralı olayda KDV istisnasından\n\
    yararlanma şartını tutarıyla belirtiniz. (8 puan)\n\n(d) 6 numaralı olayda gümrük vergisi ve KDV durumunu açıklayınız;\
    \ Cumhurbaşkanının muafiyetler konusundaki yetkilerini\nbelirtiniz. (4 puan)\n"
  cozum: "**(a) Yerleşim yeri nakli**\n\n- Yerleşim yerini Türkiye Gümrük Bölgesine nakleden gerçek kişilere ait, **alındığı\
    \ tarihte üç yaşından büyük olmayan**\n  kullanılmış özel nakil vasıtaları gümrük vergilerinden muaftır (md. 167/5-a).\
    \ Otomobil satın alındığında 1 yaşında olduğundan\n  **muaftır**.\n- Aynı kişilere ait her türlü **kullanılmış ev eşyası**\
    \ muaftır (md. 167/5-b).\n- İthalde KDV: Gümrük Kanunu md. 167/1 kapsamında gümrük vergisinden muaf eşyanın ithali KDV'den\
    \ istisnadır; ancak **(5)\n  numaralı bendin (a) alt bendi** (nakil vasıtaları) bu istisnanın **dışında** bırakılmıştır\
    \ (KDVK md. 16/1-b). Otomobil gümrük\n  vergisinden muaf olmakla birlikte **ithalde KDV'ye tabidir**; ev eşyası (5/b)\
    \ ise KDV'den de istisnadır.\n\n**(b) Yolcular**\n\n- Gerçek kişilerce serbest dolaşıma sokulan, değeri **430 Avro'yu\
    \ geçmeyen yolcu beraberindeki hediyelik eşya** muaftır\n  (md. 167/6-a); bu bent KDVK md. 16/1-b'deki istisna dışı bentler\
    \ arasında olmadığından ithalde KDV istisnası da uygulanır.\n  Bayan (B)'nin 380 Avro'luk eşyası muaftır.\n- Yolcuların\
    \ kişisel ve hediyelik eşya kapsamı dışında olup **beyanlarına aykırı** olarak eşyaları arasında çıkan eşyanın\n  **gümrük\
    \ vergileri iki kat** alınır ve eşya sahibine teslim edilir (md. 235/3): 9.000 × 2 = **18.000 TL**.\n- Vergiler ödenmezse\
    \ eşya **gümrüğe terk edilmiş sayılır** (md. 235/3) ve tasfiyelik hâle gelir (md. 177/1-ı).\n\n**(c) Geri gelen eşya**\n\
    \n- **(3):** Serbest dolaşımdaki eşya ihraç edildikten sonra **üç yıl** içinde yeniden serbest dolaşıma girerse beyan\
    \ sahibinin\n  talebi üzerine ithalat vergilerinden **muaf** tutulur (md. 168/1); muafiyet ihraç sırasındaki **ayniyeti\
    \ değişmeden** yeniden\n  ithal hâlinde tanınır (md. 169). Süre 20.06.2026'da dolar; 10.04.2026 ithali süresindedir →\
    \ gümrük vergileri **muaf**.\n- KDV: Geri gelen eşyaya ilişkin hükümler kapsamında muaf olan eşyanın ithali KDV'den istisnadır;\
    \ ancak KDV ihracat istisnasından\n  yararlanılarak ihraç edilip geri gelen eşyada istisnadan faydalanabilmek için **ihracat\
    \ istisnasından faydalanılan miktarın**\n  gümrük idaresine **ödenmesi veya bu miktar kadar teminat gösterilmesi** şarttır\
    \ (KDVK md. 16/1-b): **300.000 TL**.\n- **(4):** Aynen ihraç edildiği durumda olması hâli hariç, **hariçte işleme rejimi**\
    \ çerçevesinde ihraç edilen eşyaya geri gelen\n  eşya muafiyeti **tanınmaz** (md. 168/2-a). İşlem görmüş kalıplar hariçte\
    \ işleme hükümlerine (fark yöntemi, md. 141) göre\n  vergilendirilir.\n- **(5):** Üç yıllık süre 15.03.2025'te dolmuştur;\
    \ süre ancak beklenmeyen hâl veya mücbir sebeplerle uzatılabilir (md. 168/1).\n  Muafiyet **uygulanmaz**; ithalat vergileri\
    \ alınır.\n\n**(d) Bilimsel amaçlı eşya**\n\n- Cumhurbaşkanınca belirlenecek kişi, kurum ve kuruluşlarca ticari gaye güdülmeden\
    \ ve amacı doğrultusunda kullanılmak üzere\n  ithal edilen **bilimsel alet ve cihazlar** gümrük vergilerinden muaftır\
    \ (md. 167/7-a).\n- KDVK md. 16/1-b, md. 167/1'in **(7) numaralı bendini** istisna dışında bıraktığından bu madde kapsamında\
    \ **ithalde KDV\n  istisnası uygulanmaz**; KDV alınır.\n- Cumhurbaşkanı, (3)–(12) numaralı bentlerdeki eşyayı geliş süreleri\
    \ dahil tanımlamaya, cins, nevi ve miktarlarını belirlemeye,\n  muafiyet tutarlarını **sıfıra kadar indirmeye veya iki\
    \ katına kadar çıkarmaya**, muafiyeti farklı eşya itibarıyla birlikte veya\n  ayrı uygulamaya ve ticari mahiyette olmayan\
    \ eşyaya tek ve maktu tarife uygulamaya yetkilidir (md. 167 son fıkra).\n"
  puanlama:
  - olcut: (a) Otomobilin md. 167/5-a kapsamında üç yaş şartıyla muaf olması
