    \ 9).\n- KDV matrahı: 19.800.000 + 1.782.000 + 4.400.000 = 25.982.000 TL; KDV: **5.196.400 TL** (KDVK md. 21/b).\n- 7846\
    \ sayılı Cumhurbaşkanı Kararı uyarınca dampinge karşı vergi ve bu tutar nedeniyle KDV matrahına giren vergiler dolayısıyla\n\
    \  ödenen KDV **indirilemez** (KDV Genel Uygulama Tebliği indirim bölümü 2.6):\n  - İndirilemeyen KDV: 4.400.000 × %20\
    \ = **880.000 TL**\n  - İndirilebilir KDV: (19.800.000 + 1.782.000) × %20 = **4.316.400 TL**\n- İthalat bedeli 46 Sıra\
