    önlem kararında damping marjı %24, yerli üretim dalındaki zararı gidermeye yeterli oran %15 olarak belirlenmiş ve vergi
    %15 oranında konulmuştur. Gümrük vergisi oranı %5''tir; KDV oranı %20''dir. Sürelerde başlangıç günü hesaba katılmayacaktır.


    **Veri 1 – Gözden geçirme:** Zirve Metal 20/3/2023''te, ardından 5/6/2023''te önlemin ara gözden geçirilmesi için Genel
    Müdürlüğe delilleriyle başvurmuştur. Ayrı bir senaryoda önlemin damping ve zarar yönünden birlikte kapsayan en son gözden
    geçirme soruşturması 20/10/2024''te sonuçlanmıştır.


    **Veri 2 – Vergi tahsili:** Soruşturma sırasında geçici önlem olarak teminat alınan iki ithalat partisi, kesin önlemle
    bağlantılı olarak sonuçlandırılmıştır:


    | Parti | CIF değeri (TL) | Geçici önlem teminat oranı |

    |---|---|---|

    | P1 | 20.000.000 | %20 |

    | P2 | 20.000.000 | %10 |


    Kesin önlemin yürürlüğe girmesinden sonra aynı nitelikte P3 partisi (CIF 20.000.000 TL) hiçbir teminat alınmaksızın ithal
    edilmiş ve gümrük vergisi ile dampinge karşı vergi ödenmiştir; tescilden önce yapılan ve vergilendirilmemiş bir gider
    yoktur.


    **Veri 3 – İade:** Şirket, tahsil edilen dampinge karşı verginin gerçek damping marjından yüksek olduğu gerekçesiyle iade
    talep edecektir. Verginin tahsil tarihi 10/6/2026''dır; şirket yeterli delillerle 15/9/2026''da başvurmuş, Kurul kararını
    20/10/2027''de vermiştir.


