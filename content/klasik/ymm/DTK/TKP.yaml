- id: YMM-DTK-TKP-K003
  sinav: ymm
  ders: DTK
  konu: TKP
  kazanimlar:
  - ithalatta haksız rekabetin önlenmesi (damping ve sübvansiyon)
  - gözetim ve korunma önlemleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Şimşek Seramik A.Ş.** ve diğer bazı yerli üreticiler, X, Y, W, V ve U ülkeleri menşeli seramik karo ithalatının\
    \ dampingli\nolduğunu ve zarara yol açtığını ileri sürerek Ticaret Bakanlığına şikâyette bulunmuştur. Veriler:\n\n- Türkiye'deki\
    \ toplam benzer mal üretimi yılda 100 milyon m²'dir. Şikâyeti destekleyen üreticilerin üretimi 32 milyon m²,\n  şikâyete\
    \ açıkça karşı çıkan üreticilerinki 18 milyon m²'dir; diğer üreticiler görüş bildirmemiştir.\n- X ülkesi piyasa ekonomisi\
    \ uygulamamaktadır. Piyasa ekonomisi uygulayan üçüncü bir ülke olan Z'nin iç piyasasında benzer malın\n  fiyatı 12,00\
    \ USD/m²'dir. X'ten Türkiye'ye ihraç fiyatı 9,00 USD/m²'dir.\n- Y ülkesinde benzer malın normal değeri 10,00 USD/m², Türkiye'ye\
    \ ihraç fiyatı 9,85 USD/m²'dir.\n- Benzer mal ithalatı içindeki paylar: X %18, Y %9, W %2, V %2,5, U %1,5. W, V ve U için\
    \ tespit edilen damping marjları ihraç\n  fiyatının %2'sinin üzerindedir.\n- Tüm fiyatlar aynı ticari aşamada ve karşılaştırılabilir\
    \ düzeydedir.\n- Soruşturma 02.02.2026'da açılmıştır. Soruşturmada X menşeli ithalatın maddi zarara yol açtığı ve zararın\
    \ m² başına\n  2,00 USD dampinge karşı vergiyle giderilebileceği belirlenmiştir.\n\nAyrıca **(İ) İthalat A.Ş.** Mart 2026'da,\
    \ önceki bir soruşturma sonucunda m² başına 2,00 USD **dampinge karşı vergi** uygulanan\nX menşeli 50.000 m² seramik karo\
    \ ithal etmiştir: CIF 9,00 USD/m², kur 1 USD = 44,00 TL, gümrük vergisi %9, KDV %20; başka\nvergi yoktur. Şirketin ithalat\
    \ bedeli 46 Sıra No.lu SMMM ve YMM Kanunu Genel Tebliğindeki tutarı aşmaktadır; tam tasdik\nsözleşmesi yoktur.\n\n**İstenenler:**\n\
    \n(a) Şikâyetin üretim dalı tarafından veya adına yapılmış sayılıp sayılmayacağını hesaplayarak belirleyiniz; inceleme\
    \ süresini\nbelirtiniz. (5 puan)\n\n(b) X ve Y için normal değeri, damping marjını ve ihmal edilebilirlik durumunu; W,\
    \ V ve U için ithalat payları yönünden durumu\nbelirleyiniz. (9 puan)\n\n(c) X için uygulanacak kesin önlemin miktarını;\
    \ geçici önlemin en erken uygulanabileceği tarihi ve süresini; soruşturma ve kesin\nönlem sürelerini açıklayınız. (5 puan)\n\
