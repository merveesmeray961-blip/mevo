- id: YMM-DTK-TKP-K009
  sinav: ymm
  ders: DTK
  konu: TKP
  kazanimlar:
  - geri gelen eşya muafiyeti (md. 168–170)
  - özel amaçlı kullanım nedeniyle indirimli oran ve vergi hesabı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Sarp Tarım Makineleri A.Ş.** (Türkiye''de yerleşik) 2026 yılında, daha önce ihraç ettiği eşyaların geri getirilmesine
    ilişkin aşağıdaki işlemleri yapmıştır. Hiçbir işlemde mücbir sebep veya beklenmeyen hal bulunmamaktadır; Cumhurbaşkanınca
    md. 169 veya md. 168/2 için belirlenmiş bir istisna hal ve şart yoktur. Süreler hesaplanırken başlangıç günü hesaba katılmayacaktır.


    | No | Durum |

    |---|---|

    | 1 | Serbest dolaşımdaki bir hasat makinesi 12/12/2023''te Türkiye Gümrük Bölgesinden ihraç edilmiştir. Makine, ihracı
    sırasındaki ayniyeti değişmeden 28/10/2026''da serbest dolaşıma giriş beyanıyla getirilmiştir; şirket muafiyet talep etmektedir.
    |

    | 2 | Serbest dolaşımdaki bir su pompası 20/5/2023''te ihraç edilmiş; ayniyeti değişmeden 18/6/2026''da serbest dolaşıma
    giriş beyanıyla getirilmiş, muafiyet talep edilmektedir. |

    | 3 | Bir pulluk takımı tarım amacıyla kullanılmak üzere ilk girişinde indirimli oranla serbest dolaşıma girmiş ve 120.000
    TL ithalat vergisi alınmıştır. Takım ihraç edilmiş ve üç yıl dolmadan geri getirilmiştir. Bu kez tarım dışı bir amaçla
    kullanılmak üzere ithal edilecektir; bu amaç için hesaplanan ithalat vergileri tutarı 300.000 TL''dir. |

    | 4 | Bir sulama ekipmanı ilk girişinde 120.000 TL ithalat vergisi alınarak serbest dolaşıma girmiş, ihraç edilmiştir.
    Geri gelişinde ithal amacı farklıdır ve bu amaç için hesaplanan ithalat vergileri tutarı 80.000 TL''dir. |

    | 5 | Serbest dolaşımdaki kumaşlar hariçte işleme rejimi çerçevesinde dikim için ihraç edilmiş, ihracat sırasında aynen
    ihraç sayılacak bir durum yoktur; kumaşlar ayniyeti değişmeden geri getirilmiştir. |

    | 6 | İhracı bir dış ticaret önlemine (ihracı kayda bağlı kota uygulamasına) konu olan eşya ihraç edilmiş, ayniyeti değişmeden
    geri getirilmiştir. |

    | 7 | Dahilde işleme rejimi kapsamında işlem gören ürünler 10/3/2026''da ihraç edilmiş, aynen 15/9/2026''da geri gelmiş
    ve serbest dolaşıma sokulmak istenmiştir. |


    **İstenenler:**


    (a) 1, 2, 5 ve 6 numaralı işlemlerde geri gelen eşya için ithalat vergilerinden muafiyetin tanınıp tanınmayacağını gerekçesiyle
    belirtiniz; 1 ve 2 numaralı işlemlerde son geri gelme tarihlerini gösteriniz. (10 puan)


    (b) 3 ve 4 numaralı işlemlerde ödenecek ithalat vergisi tutarını md. 168/1 uyarınca hesaplayınız; 4 numaralı işlemde iade
    yapılıp yapılmayacağını açıklayınız. (8 puan)


    (c) 7 numaralı işlemde ürünlerin serbest dolaşıma giriş tarihinin hangi tarih sayılacağını ve ithalat vergilerinin hangi
    hükümlere göre belirleneceğini; muafiyetin tanınması için ayniyetin değişmemesi gerektiğini ve buna istisnayı kimin belirleyeceğini
    açıklayınız. (7 puan)

    '
  cozum: '**(a) Muafiyet (GK md. 168/1, 168/2, 169)**


    Serbest dolaşımdaki eşya, ihraç edildikten sonra **üç yıl içinde** yeniden serbest dolaşıma girerse ve beyan sahibi talep
    ederse ithalat vergilerinden muaf tutulur; muafiyet, geri gelen eşyanın ihracı sırasındaki **ayniyeti değişmeden** yeniden
    ithali halinde tanınır (md. 169).


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | **Muaf** | 12/12/2023 + 3 yıl = 12/12/2026; geliş 28/10/2026 süre içindedir |

    | 2 | **Muaf değil** | 20/5/2023 + 3 yıl = 20/5/2026; geliş 18/6/2026 süreyi aşmıştır (mücbir sebep yok) |

    | 5 | **Muaf değil** | Md. 168/2-(a): aynen ihraç hali hariç, hariçte işleme rejimi çerçevesinde ihraç edilen eşyaya muafiyet
    tanınmaz |

    | 6 | **Muaf değil** | Md. 168/2-(b): ihracı dış ticaret önlemine konu olan eşyaya muafiyet tanınmaz (istisna hal ve şartlar
    Cumhurbaşkanınca belirlenir; burada belirlenmemiştir) |


    **(b) Özel amaçlı kullanım (md. 168/1, ikinci paragraf)**


    İthal amacı aynı değilse, uygulanacak ithalat vergileri tutarı serbest dolaşıma ilk girişte alınmış tutar kadar indirilir;
    ilk girişte alınan tutar, yeniden girişte alınacak tutardan fazlaysa **hiçbir iade yapılmaz**.


    - İşlem 3: 300.000 − 120.000 = **180.000 TL** ödenir. (Aynı amaç olsaydı indirimli veya sıfır oran uygulanırdı.)

    - İşlem 4: 80.000 − 120.000 < 0 → ödenecek tutar **0 TL**; aradaki 40.000 TL için **iade yapılmaz**.


    **(c) Dahilde işleme sonrası geri gelen ürünler (md. 170)**


    Md. 168 ve 169 hükümleri, dahilde işleme rejiminin uygulanmasından sonra ihraç edilen ve geri gelen işlem görmüş ürünlere
    de uygulanır. Bu hallerde eşyanın yeniden ihraç tarihi (10/3/2026) serbest dolaşıma giriş tarihi sayılır ve kanunen alınması
    gereken ithalat vergileri tutarı dahilde işleme rejimi hükümlerine göre belirlenir. Muafiyet, ayniyetin değişmemesi koşuluna
    bağlıdır; bu koşula istisna getirilmesine ilişkin hal ve şartları Cumhurbaşkanı belirler (md. 169).

    '
