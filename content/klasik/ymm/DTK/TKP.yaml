      600000 - 450000, ''tahsil_edilmeyen_fark'': 750000 - 600000}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S4
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
