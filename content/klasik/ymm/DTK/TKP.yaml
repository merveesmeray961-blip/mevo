  - olcut: (a) Kullanılmış ev eşyasının muafiyeti (md. 167/5-b)
    puan: 1
  - olcut: (a) Otomobilin KDVK md. 16/1-b'deki (5)(a) istisnası nedeniyle KDV'ye tabi, ev eşyasının istisna olması
