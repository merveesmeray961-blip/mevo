- id: YMM-DTK-VRG-K001
  sinav: ymm
  ders: DTK
  konu: VRG
  kazanimlar:
  - ithalde KDV ve ÖTV
  - gümrük cezaları ve uzlaşma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Kara Makine A.Ş.** (özel hukuk tüzel kişisi, gerçek usulde KDV mükellefi), **15 Nisan 2026** tarihinde tescil edilen
    serbest dolaşıma giriş beyannamesiyle bir tekstil makinesi ithal etmiştir. Beyannameye ilişkin bilgiler:


    | Kalem | Tutar (TL) |

    |---|---|

    | Beyan edilen gümrük kıymeti (CIF) | 800.000 |

    | Gümrük vergisi oranı | %5 |

    | İthalat sırasında ödenen diğer harç ve paylar (kıymet düzeltmesinden etkilenmez) | 4.000 |

    | Tescilden önce ödenen ve KDV hesaplanmamış geçici depolama (ardiye) gideri | 16.000 |

    | Tescilden sonra ödenen yurt içi nakliye (ayrıca KDV hesaplanarak faturalandırılmıştır) | 10.000 |


    KDV oranı %20''dir. Eşya ÖTV''ye tabi değildir.


    Teslimden sonra kontrol sonucunda gümrük idaresi, Gümrük Kanunu md. 23–31 hükümleri çerçevesinde makinenin kıymetinin
    **1.000.000 TL** olması gerektiğini belirlemiştir. Noksanlık maddi hesap hatasından kaynaklanmamaktadır; şirket aykırılığı
    idarenin tespitinden önce bildirmemiştir. Ek tahakkuk ve ceza kararı şirkete **1 Eylül 2026** tarihinde tebliğ edilmiştir.


    Şirket itiraz başvurusunda bulunmadan **13 Eylül 2026** tarihinde uzlaşma talep etmiştir. **15 Ekim 2026** tarihinde imzalanan
    uzlaşma tutanağında vergi farkları olduğu gibi kabul edilmiş, idari para cezası ise **78.000 TL**''ye indirilmiştir. Gecikme
    faizi hesabında, ilgili dönem için 6183 sayılı Kanun md. 51''e göre belirlenen gecikme zammı oranının **aylık %3** olduğu
    ve sürenin tam ay olarak hesaplanacağı varsayılacaktır.


    **İstenenler:**


    (a) Beyana göre ithalde ödenen KDV''yi, matraha giren ve girmeyen kalemleri gerekçeleriyle göstererek hesaplayınız. **(6
    puan)**


    (b) Kontrol sonucunda tahakkuk ettirilecek gümrük vergisi ve KDV farklarını ve Gümrük Kanunu md. 234 uyarınca verilecek
    para cezasını hesaplayınız. Uygulanan bendi ve %5 eşiğinin bu olayda rolünü açıklayınız. **(8 puan)**


    (c) Uzlaşma ile ilgili olarak: (i) uzlaşma talebinin süresinde olup olmadığını ve kapsamını; (ii) uzlaşma sonucunda ödenecek
    toplam tutarı (gecikme faizi dahil), ödeme süresini, peşin ödeme indirimi ve dava açma imkânını; (iii) uzlaşma vaki olmasaydı
    şirketin itiraz için kalan süresinin ne olacağını açıklayınız. **(11 puan)**

    '
  cozum: '**(a) Beyana göre ithalde KDV (KDVK md. 21)**


    | Unsur | Dayanak | Tutar (TL) |

    |---|---|---|

    | Gümrük kıymeti | md. 21/a | 800.000 |

    | Gümrük vergisi (800.000 × %5) | md. 21/b | 40.000 |

    | Diğer harç ve paylar | md. 21/b | 4.000 |

    | Tescilden önce yapılan, vergilendirilmemiş ardiye | md. 21/c | 16.000 |

    | **KDV matrahı** | | **860.000** |


    KDV = 860.000 × %20 = **172.000 TL**.


    Tescilden sonra yapılan ve ayrıca KDV''ye tabi tutulan yurt içi nakliye (10.000 TL) matraha **girmez**. Md. 21/c yalnız
    tescil tarihine kadar yapılan ve vergilendirilmeyen gider ve ödemeleri kapsar.


    **(b) Vergi farkları ve ceza**


    - Kıymet farkı: 1.000.000 − 800.000 = 200.000 TL

    - Gümrük vergisi farkı: 200.000 × %5 = **10.000 TL**

    - Düzeltilmiş KDV matrahı: 1.000.000 + 50.000 + 4.000 + 16.000 = 1.070.000 TL → KDV 214.000 TL

    - KDV farkı: 214.000 − 172.000 = **42.000 TL** (kısa yol: (200.000 + 10.000) × %20)

    - Toplam vergi farkı: 10.000 + 42.000 = **52.000 TL**


    Aykırılık, kıymeti üzerinden ithalat vergilerine tabi eşyanın kıymetinin noksan beyanıdır. Bu nedenle **md. 234/1-b**
    uygulanır: vergi farkının **üç katı** para cezası. %5 eşiği md. 234/1-a''da tarife unsurları ile sayı, baş ve ağırlık
    gibi ölçülerdeki aykırılıklara özgüdür; (b) bendinde eşik yoktur. Noksanlık maddi hesap hatasından doğmadığı için (c)
    bendindeki "yarısı" kuralı da uygulanmaz. KDV farkına da KDVK md. 51 uyarınca Gümrük Kanunu''ndaki gümrük vergisi esaslarına
    göre ceza uygulanır.


    Ceza = 3 × 52.000 = **156.000 TL** (gümrük vergisi farkı için 30.000 + KDV farkı için 126.000). Aykırılık şirketçe tespitten
    önce bildirilmediğinden md. 234/3''teki yüzde on uygulaması söz konusu değildir.


    **(c) Uzlaşma (Gümrük K. md. 244)**


    (i) *Süre ve kapsam:* Uzlaşma talebi, henüz itiraz edilmemiş alacaklar için tebliğden itibaren 15 gün içinde yapılır.
    Tebliğ 1 Eylül''dedir; süre 16 Eylül 2026''da dolar. 13 Eylül''deki talep **süresindedir**. Beyan ile idarenin tespiti
    arasındaki farka ilişkin gümrük vergileri alacakları (244/1-a) ve idari para cezaları (244/1-c) uzlaşmanın kapsamındadır.
    Fiil kaçakçılık suçlarıyla ilişkili olmadığından 244/2''deki engel yoktur.


    (ii) *Ödenecek tutar:*

    - Vergi farkları: 52.000 TL

    - Uzlaşılan ceza: 78.000 TL

    - Gecikme faizi yalnız **uzlaşılan vergiler** için, gümrük yükümlülüğünün başladığı tarihten (beyanname tescili, 15.04.2026,
    md. 181) uzlaşma tutanağının imza tarihine (15.10.2026) kadar hesaplanır: 52.000 × %3 × 6 = **9.360 TL**. Cezaya gecikme
    faizi uygulanmaz.

    - **Toplam: 52.000 + 78.000 + 9.360 = 139.360 TL**


    Uzlaşılan vergiler ve cezalar, uzlaşma tutanağının tebliğinden itibaren **bir ay içinde** ödenir (244/5). Uzlaşılan cezada
    Kabahatler Kanunu md. 17''deki **peşin ödeme indiriminden yararlanılamaz** (244/6). Tutanak kesindir; şirket uzlaşılan
    hususlar için **dava açamaz** ve hiçbir mercie şikâyette bulunamaz (244/4).


    (iii) *Uzlaşma vaki olmasaydı:* Uzlaşma talebi itiraz süresini durdurur. Md. 242/1''deki 15 günlük itiraz süresinin 12
    günü geçmiş, 3 günü kalmıştır. Uzlaşma vaki olmazsa süre kaldığı yerden işler; ancak bitimine beş günden az kaldığından
    **süre beş güne tamamlanır**. Şirket, uzlaşmanın vaki olmadığının tebliğinden itibaren **5 gün** içinde itiraz edebilir.
    Aynı alacak için **yeniden uzlaşma talep edilemez**.

    '
  puanlama:
  - olcut: (a) KDV matrahının unsurlarının doğru belirlenmesi (CIF, GV, harç, tescil öncesi vergilendirilmemiş ardiye)
    puan: 4
  - olcut: (a) Tescil sonrası nakliyenin matraha girmediğinin gerekçesi ve 172.000 TL KDV sonucu
    puan: 2
  - olcut: (b) GV farkı (10.000) ve KDV farkının GV farkı dahil matrahla hesaplanması (42.000)
    puan: 3
  - olcut: (b) md. 234/1-b'nin seçilmesi; %5 eşiğinin ve 1-c'nin bu olaya uygulanmadığının açıklanması; KDVK md. 51 bağlantısı
    puan: 3
  - olcut: (b) Ceza tutarı 156.000 TL
    puan: 2
  - olcut: (c-i) Talebin süresinde olduğu (16 Eylül'e kadar) ve kapsamın (vergi farkları + idari para cezası) belirlenmesi
    puan: 2
  - olcut: (c-ii) Gecikme faizinin yalnız vergiler üzerinden, tescil-imza arası için hesaplanması (9.360) ve toplam 139.360
      TL
    puan: 4
  - olcut: (c-ii) Bir aylık ödeme süresi, peşin ödeme indirimi yasağı ve dava açılamayacağı
    puan: 2
  - olcut: (c-iii) Sürenin durması, kalan 3 günün 5 güne tamamlanması ve yeniden uzlaşma yasağı
    puan: 3
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21, md. 51
  - mevzuat: 4458 sayılı Gümrük Kanunu
