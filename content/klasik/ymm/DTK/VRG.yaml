- id: YMM-DTK-VRG-K002
  sinav: ymm
  ders: DTK
  konu: VRG
  kazanimlar:
  - ihracat istisnası ve iadesi
  - serbest bölgeler
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Örnek Makine A.Ş.**'nin Ocak 2026 dönemine ait işlemleri aşağıdadır (tutarlar KDV hariç, TL):\n\n| İşlem | Bedel\
    \ | Bilgi |\n|---|---|---|\n| Yurt dışındaki müşteriye makine ihracatı | 3.000.000 | Fiili ihraç 20.01.2026; mal Türkiye\
    \ Gümrük Bölgesinden çıkarak alıcı ülkeye varmıştır |\n| Serbest bölgedeki alıcıya makine teslimi | 1.000.000 | Mal 25.01.2026'da\
    \ serbest bölgeye vasıl olmuştur |\n| Serbest bölgedeki müşteri için fason üretim hizmeti | 200.000 | Hizmetten serbest\
    \ bölgede faydalanılmaktadır |\n| Yurt dışındaki müşteri için mühendislik hizmeti | 300.000 | Müşterinin kanuni ve iş\
    \ merkezi yurt dışındadır; hizmetten yurt dışında faydalanılmaktadır |\n| Yurt içi satış | 800.000 | KDV %20 |\n\n- Dönemde\
    \ yüklenilen KDV toplamı 600.000 TL'dir; bunun 420.000 TL'si istisna kapsamındaki işlemlerin bünyesine giren KDV'dir\n\
    \  (hesabın doğru olduğu kabul edilecektir). Önceki dönemden devreden KDV yoktur.\n- Şirket iadeyi YMM KDV İadesi Tasdik\
    \ Raporuyla talep edecek; iade tutarının 100.000 TL'sini SGK prim borcuna mahsuben, kalanını\n  nakden alacaktır.\n- Genel\
    \ KDV oranı %20'dir.\n\n**İstenenler:**\n\n(a) Her bir işlemin KDV istisnası kapsamında olup olmadığını şartlarıyla değerlendiriniz.\
    \ (8 puan)\n\n(b) Hesaplanan KDV'yi, indirim yoluyla giderilemeyen KDV'yi, iade edilebilecek KDV'yi (azami iade sınırı\
    \ kontrolüyle) ve\nsonraki döneme devreden KDV'yi hesaplayınız. (8 puan)\n\n(c) Dönem sonu KDV mahsup kaydını ve iadenin\
    \ mahsuben ve nakden alınmasına ilişkin kaydı Tekdüzen Hesap Planına göre yapınız.\n(5 puan)\n\n(d) İade talebinin ve\
    \ YMM KDV İadesi Tasdik Raporunun en geç hangi tarihlere kadar yapılması/ibraz edilmesi gerektiğini\nbelirtiniz. (4 puan)\n"
  cozum: "**(a) İstisna değerlendirmesi**\n\n- İhracat teslimleri, yurt dışındaki müşteriler için yapılan hizmetler ve serbest\
    \ bölgelerdeki müşteriler için yapılan fason\n  hizmetler KDV'den müstesnadır (KDVK md. 11/1-a).\n- **Makine ihracatı:**\
    \ Teslim yurt dışındaki müşteriye yapılmış ve mal gümrük bölgesinden çıkarak dış ülkeye varmıştır\n  (md. 12/1-a, b) →\
    \ **istisna**.\n- **Serbest bölgedeki alıcıya teslim:** Teslim serbest bölgedeki alıcıya yapılmış ve mal serbest bölgeye\
    \ **vasıl** olmuştur\n  (md. 12/1-a, b) → **ihracat teslimi, istisna**.\n- **Fason hizmet:** Serbest bölgedeki müşteri\
    \ için yapılmış ve hizmetten **serbest bölgede faydalanılmaktadır** (md. 12/3)\n  → **istisna**.\n- **Mühendislik hizmeti:**\
    \ Müşteri, kanuni ve iş merkezi yurt dışında olan yurt dışındaki müşteridir; hizmet onun için yapılmış\n  ve hizmetten\
    \ **yurt dışında faydalanılmaktadır** (md. 12/2) → **hizmet ihracı, istisna**.\n- **Yurt içi satış:** Vergiye tabidir.\n\
    \n**(b) İade hesabı**\n\n- Hesaplanan KDV: 800.000 × %20 = **160.000 TL**.\n- İstisna işlemlere ilişkin yüklenilen KDV\
    \ önce hesaplanan vergiden indirilir; indirilemeyen kısım iade edilir (KDVK md. 32).\n  İndirim yoluyla giderilemeyen\
    \ KDV: 600.000 − 160.000 = **440.000 TL**.\n- İade hakkı doğuran işlemlerin bünyesine giren KDV (420.000 TL), indirim\
    \ yoluyla giderilemeyen KDV'den (440.000 TL) fazla\n  olmadığından iade edilebilecek KDV **420.000 TL**'dir (KDV GUT,\
    \ iade bölümü A3/1.1).\n- Azami iade edilebilir vergi, iade hakkı doğuran işlem bedelinin genel KDV oranıyla çarpımını\
    \ kural olarak aşamaz: istisna işlem\n  bedeli 3.000.000 + 1.000.000 + 200.000 + 300.000 = 4.500.000 TL; 4.500.000 × %20\
    \ = 900.000 TL (Tebliğ metnindeki %18 ibaresi\n  de esas alınsa 810.000 TL). 420.000 TL sınırın altındadır.\n- Sonraki\
    \ döneme devreden KDV: 440.000 − 420.000 = **20.000 TL** (iade edilecek tutar devreden KDV'den çıkarılır).\n\n**(c) Yevmiye\
    \ kayıtları**\n\n31.01.2026 – KDV mahsubu:\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 391 Hesaplanan KDV | 160.000\
    \ | |\n| 136 Diğer Çeşitli Alacaklar (iade edilecek KDV) | 420.000 | |\n| 190 Devreden KDV | 20.000 | |\n| 191 İndirilecek\
    \ KDV | | 600.000 |\n\nİadenin yerine getirilmesi:\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 361 Ödenecek Sosyal\
    \ Güvenlik Kesintileri (mahsup) | 100.000 | |\n| 102 Bankalar (nakden iade) | 320.000 | |\n| 136 Diğer Çeşitli Alacaklar\
    \ | | 420.000 |\n\nKDV iadesinin vergi ve sosyal sigorta prim borçlarına mahsup suretiyle yapılabileceği KDVK md. 32'de\
    \ öngörülmüştür.\n\n**(d) Süreler**\n\n- İndirilemeyen KDV, işlemin gerçekleştiği dönemi izleyen **ikinci takvim yılının\
    \ sonuna kadar** talep edilmelidir (KDVK md. 32):\n  Ocak 2026 → **31.12.2028**.\n- YMM KDV İadesi Tasdik Raporuyla talep\
    \ edilen iadelerde rapor, bu sürenin sonundan itibaren **altı ay** içinde ibraz edilmelidir:\n  **30.06.2029**. Süresinde\
    \ ibraz edilmezse iade talebi incelemeye sevk edilir (KDV GUT, istisna edilmiş işlemlerde indirim\n  bölümü 3).\n"
