  soru: "Mersin Serbest Bölgesinde faaliyet ruhsatıyla çalışan **(E) Elektro Ltd. Şti.** ile ilgili 2026 yılı olayları aşağıdadır:\n\
    \n1. Çin'den doğrudan bölgeye gelen 1.000 adet klima 10.03.2026 saat 14.00'te (E)'ye ait depoya konulmuş; envanter kayıtlarına\n\
    \   13.03.2026'da geçirilmiştir.\n2. Klimaların 600 adedi Türkiye'de otel işleten **(T) Turizm A.Ş.**'ye satılmış; (T),\
    \ klimaları otelinde kullanmak üzere\n   15.04.2026'da tescil edilen serbest dolaşıma giriş beyannamesiyle ithal etmiştir.\
    \ Satış bedeli adet başına 400 USD olup bölgeden\n   çıkışa kadar tüm giderleri içermektedir; bölgedeki depolama ve muhafaza\
    \ masrafları faturada ayrıca adet başına 5 USD olarak\n   gösterilmiştir. Tescil tarihinde kur 1 USD = 44,00 TL; gümrük\
    \ vergisi %4; klima (IV) sayılı listede yer almakta olup ÖTV oranı\n   %10'dur (varsayımsal); KDV %20'dir. Tescilden önce\
