  dogrulama:
    python: 'kdv_beyan = (800000 + 800000 * 5 // 100 + 4000 + 16000) * 20 // 100

      gv_fark = 200000 * 5 // 100

      kdv_dogru = (1000000 + 1000000 * 5 // 100 + 4000 + 16000) * 20 // 100

      kdv_fark = kdv_dogru - kdv_beyan

      vergi_fark = gv_fark + kdv_fark

      ceza = 3 * vergi_fark

      faiz = vergi_fark * 3 * 6 // 100

      toplam = vergi_fark + 78000 + faiz

      sonuc = {''kdv_beyan'': kdv_beyan, ''gv_fark'': gv_fark, ''kdv_fark'': kdv_fark, ''ceza'': ceza, ''gecikme_faizi'':
      faiz, ''uzlasma_toplam'': toplam}'
