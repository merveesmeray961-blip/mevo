  cozum: '**(a) İhracat teslimi şartları (md. 12/1)**


    Teslimin ihracat teslimi sayılması için (a) teslim yurt dışındaki bir müşteriye, serbest bölgedeki alıcıya, gümrüksüz
    satış mağazalarına/depolarına ya da yetkili gümrük antreposu işleticisine yapılmalı (veya mallar yetkili antrepo işleticisine
    tevdi edilmeli) ve (b) mal gümrük bölgesinden çıkarak dış ülkeye veya serbest bölgeye vasıl olmalı ya da gümrüksüz satış
    mağazalarına/depolarına veya yetkili antrepoya konulmalıdır.


    | No | Değerlendirme | İhracat teslimi? |

    |---|---|---|

    | 1 | Yurt dışı müşteri + mal dış ülkeye vasıl olmuş | **Evet** |

    | 2 | Md. 95/1''e göre faaliyette bulunan gümrüksüz satış mağazasının deposuna teslim ve depoya konulma | **Evet** |

    | 3 | Yetkili gümrük antreposu işleticisine tevdi | **Evet** (esaslara uyulması kaydıyla) |

    | 4 | Teslim yurt dışındaki müşteriye yapılmış; malın ihraçtan önce yurt dışındaki alıcı adına hareket eden yurt içindeki
    firma tarafından işlenmesi durumu değiştirmez | **Evet** |

    | 5 | Teslim yurt içindeki firmaya yapılmıştır; yurt dışındaki müşteri/serbest bölge/mağaza/antrepo alıcısına teslim şartı
    yok. (İhraç kaydıyla teslim, md. 11/1-c kapsamında ayrı bir istisnadır ve burada ihraç kaydı konulmamıştır) | **Hayır**
    – KDV''ye tabi |


    **(b) Hesaplama**


    - İhracat teslimi sayılan bedel = 1.000.000 + 600.000 + 900.000 + 700.000 = **3.200.000 TL**

    - Hesaplanan KDV = 500.000 × %20 = **100.000 TL**


    **(c) Antrepo işleticisinin sorumluluğu**


    - Ziyaa uğratılan KDV = 300.000 × %20 = **60.000 TL**.

    - Yetkili gümrük antrepolarının işleyişine ilişkin esaslara uyulmaması hâlinde ziyaa uğratılan vergi, buna ilişkin olarak
    kesilecek ceza ve hesaplanacak gecikme faizinin ödenmesinden KDV iadesi alanla birlikte **antrepo işleticisi de müteselsilen
    sorumludur** (md. 12/1). Dolayısıyla (Y) A.Ş. (iadeyi alan) ve (U) Antrepo A.Ş. müteselsil sorumludur.

    - Gümrük Kanunu md. 96: Antrepo işleticisi (a) eşyanın antrepoda bulunduğu süre içinde gümrük gözetimi altında bulunmasını
    sağlamaktan, (b) gümrük antrepo rejimi kapsamında eşyanın muhafaza edilmesiyle ilgili yükümlülükleri yerine getirmekten,
    (c) izinde belirtilen özel şartlara uymaktan sorumludur. Gümrüksüz satış mağazaları ve depolarının açılması ve işletilmesine
    izin verme yetkisi gümrük idaresine (Müsteşarlık) aittir (md. 95/1).

