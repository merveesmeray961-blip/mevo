    Bakanlığı tarafından belirlenen ayrıntılı usul, asgari tutar ve sınır kapısı şartlarının tamamen sağlandığı kabul edilecektir.


    **Olay 1.** Türkiye''de ikamet etmeyen Alman uyruklu Bay (X), Antalya''da üç ayrı satıcıdan aşağıdaki malları satın almış,
    satıcılar KDV''yi fiyata dahil ederek tahsil etmiştir:


    | Mal | KDV dahil bedel (TL) | KDV oranı |

    |---|---|---|

    | Deri mont | 24.000 | %20 |

    | Kuru meyve | 5.500 | %10 |

    | Cep telefonu | 7.200 | %20 |


    Bay (X) Türkiye''den çıkarken deri mont ve cep telefonuna ilişkin fatura/belgeleri gümrükten malların çıkışı sırasında
    ibraz etmiş; kuru meyveyi Türkiye''de tüketmiş ve belgesini ibraz etmemiştir.


    **Olay 2.** Türkiye''de ikametgâhı, işyeri, kanuni ve iş merkezi bulunmayan, Kazakistan''da yerleşik (K) Lojistik, 2026''da
    Türkiye''de katıldığı bir fuar nedeniyle satın aldığı mal ve hizmetlere 90.000 TL, taşımacılık faaliyetine ilişkin olarak
    satın aldığı mal ve hizmetlere 45.000 TL KDV ödemiştir. Aynı şekilde Türkiye''de yerleşik olmayan (V) Lojistik''in (merkezi,
    Türkiye ile KDV iadesinde karşılıklılık bulunmayan bir ülkededir) fuar nedeniyle ödediği KDV 30.000 TL''dir. Kazakistan–Türkiye
    arasında karşılıklılık bulunmaktadır.


    **Olay 3.** (K) Lojistik, ihracat rejimi kapsamında yurt dışına çıkarılacak eşyayı taşıyan bir çekicinin yakıt deposuna
    Cumhurbaşkanınca belirlenen sınır kapısında yurt dışına çıkışta 650 litre motorin doldurtmuştur. Aracın standart yakıt
    deposu miktarı 400 litredir; motorinin KDV hariç birim fiyatı 40 TL''dir.


    **İstenenler:**


    (a) Olay 1''de Bay (X)''e iade edilecek KDV''yi hesaplayınız; kuru meyve için iade yapılmamasının gerekçesini belirtiniz.
    (6 puan)


    (b) Olay 2''de (K) Lojistik ve (V) Lojistik''e iade edilecek KDV tutarlarını gerekçesiyle belirleyiniz. (5 puan)


    (c) Transit ve Türkiye ile yabancı ülkeler arasındaki taşımacılık işlerine tanınan KDV istisnasının koşullarını; ikametgâhı
    Türkiye''de bulunmayan bir taşıyıcının motorlu kara taşıtıyla yaptığı bu taşımada vergiyi doğuran olayı, matrahın kim
    tarafından belirleneceğini ve verginin ne zaman ödeneceğini açıklayınız. (7 puan)


    (d) Olay 3''te istisna kapsamındaki motorin tutarını ve vergiye tabi kısım için hesaplanacak KDV''yi bulunuz. (7 puan)

    '
  cozum: '**(a) Tax free iadesi**


    Türkiye''de ikamet etmeyen yolcuların satın alarak Türkiye dışına götürdükleri malların teslimi anında KDV tahsil edilir;
    ancak gümrükten malın çıkışı anında fatura veya belgenin ibrazında tahsil edilen KDV iade olunur (md. 11/1-b).


    | Mal | KDV (KDV dahil bedel × oran / (100 + oran)) | Fatura ibrazı | İade |

    |---|---|---|---|

    | Deri mont | 24.000 × 20 / 120 = 4.000 | Var | 4.000 |

    | Kuru meyve | 5.500 × 10 / 110 = 500 | Yok | 0 |

    | Cep telefonu | 7.200 × 20 / 120 = 1.200 | Var | 1.200 |


    İade = 4.000 + 1.200 = **5.200 TL**. Kuru meyve için iade yapılmaz: iade, malın gümrükten çıkışı anında fatura veya belgenin
    ibrazına bağlıdır; mal yurt dışına götürülmemiştir.


    **(b) Taşımacı ve fuar katılımcısı**


    Türkiye''de ikametgâhı, işyeri, kanuni ve iş merkezi bulunmayanların taşımacılık faaliyetlerine ilişkin olarak satın alacakları
    mal ve hizmetler ile fuar, panayır ve sergilere katılımları dolayısıyla satın alacakları mal ve hizmetler nedeniyle ödedikleri
    KDV **karşılıklı olmak kaydıyla** iade edilir (md. 11/1, ek fıkra).


    - (K) Lojistik: karşılıklılık var; 90.000 + 45.000 = **135.000 TL** iade edilir.

    - (V) Lojistik: karşılıklılık yok; fuar KDV''si olan 30.000 TL **iade edilmez**.


    **(c) Taşımacılık istisnası**


    - Transit ve Türkiye ile yabancı ülkeler arasındaki taşımacılık işlerinde **Cumhurbaşkanı tarafından belirlenecek** taşıma
    işleri KDV''den müstesnadır; ikametgâhı, kanuni merkezi ve iş merkezi Türkiye''de bulunmayan mükelleflere bu istisna ilgili
    ülkeler itibarıyla **karşılıklı olmak şartıyla** tanınır (md. 14/1-2).

    - Vergiyi doğuran olay: İkametgâhı, işyeri, kanuni merkezi ve iş merkezi Türkiye''de bulunmayanlar tarafından yapılan
    Türkiye–yabancı ülke taşımacılığı ile transit taşımacılıkta **gümrük bölgesine girilmesi veya gümrük bölgesinden çıkılması**
    (md. 10/j).

    - Matrah: Şahıs ve ton başına kilometre itibarıyla yurt içi emsalleri göz önüne alınarak matrah tespitine **Maliye ve
    Gümrük Bakanlığı yetkilidir** (md. 22).

    - Ödeme: Yurt dışında yerleşik olanlarca motorlu kara taşıtlarıyla yapılan taşımacılık ve transit taşımacılığa ait KDV,
    bu işlemlere ait **özel beyannamelerin verilme süresi içinde** ödenir (md. 46/3).


    **(d) Motorin teslimi**


    Yurt dışına çıkışta yapılan motorin teslimi, araçların standart yakıt deposu miktarlarını aşmamak kaydıyla vergiden istisnadır
    (md. 14/3).


    - İstisna kapsamındaki tutar = 400 lt × 40 = **16.000 TL**

    - Standart depoyu aşan 250 lt (650 − 400) × 40 = 10.000 TL vergiye tabidir

    - KDV = 10.000 × %20 = **2.000 TL**

    '
