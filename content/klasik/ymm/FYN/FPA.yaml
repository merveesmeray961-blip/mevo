    **(c)** Yeni pay sayısı = 10.000.000 × 1,20 = **12.000.000**; teorik fiyat = 12 × 10.000.000 / 12.000.000 = **10 TL**;
    yatırımcının payı = 5.000 × 1,20 = **6.000 adet**; servet = 6.000 × 10 = **60.000 TL**.


    **(d)** İşlem öncesi servet = 5.000 × 12 = **60.000 TL**. İki seçenekte de servet değişmemiştir; fark, servetin nakit
    mi yoksa daha fazla pay mı olarak elde tutulduğundadır (nakit çıkışı yalnızca birinci seçenekte vardır). Halka açık ortaklıkta
