  soru: '**Olay:** Ay Kozmetik Ltd. Şti. üç ürün grubuyla çalışmaktadır. 2025 yılı satış karması ve katkı payı oranları aşağıdadır;
    sabit giderler 210.000 TL''dir.


    | Ürün | Satış (TL) | Katkı payı oranı |

    |---|---|---|

    | A | 600.000 | %40 |

    | B | 300.000 | %30 |

    | C | 100.000 | %20 |


    **İstenenler:**


    (a) Ağırlıklı ortalama katkı payı oranını, başabaş satış hasılatını ve güvenlik marjını (%) hesaplayınız. (6 puan)


    (b) 140.000 TL faaliyet kârı hedefi için gereken satış hasılatını bulunuz. (4 puan)


    (c) Toplam satış 1.000.000 TL kalmak üzere karma A: 200.000, B: 400.000, C: 400.000 TL olursa yeni başabaş hasılatını
    ve güvenlik marjını bulunuz; karmadaki değişimi yorumlayınız. (6 puan)


    (d) Mevcut karmada faaliyet kaldıraç derecesini bulunuz; satışlar %10 artarsa faaliyet kârının ne olacağını gösteriniz.
    (5 puan)

    '
  cozum: '**(a)** Toplam satış = 1.000.000 TL; toplam katkı = 240.000 + 90.000 + 20.000 = 350.000 TL; ağırlıklı katkı oranı
    = 350.000 / 1.000.000 = **%35**. Başabaş hasılatı = 210.000 / 0,35 = **600.000 TL**. Güvenlik marjı = (1.000.000 − 600.000)
    / 1.000.000 = **%40**.


    **(b)** Hedef hasılat = (210.000 + 140.000) / 0,35 = **1.000.000 TL**.


    **(c)** Katkı = 200.000 × 0,40 + 400.000 × 0,30 + 400.000 × 0,20 = 280.000 TL; oran = **%28**. Başabaş = 210.000 / 0,28
    = **750.000 TL**; güvenlik marjı = (1.000.000 − 750.000) / 1.000.000 = **%25**.

    Düşük katkı oranlı C grubunun payı arttığından ağırlıklı oran düşmüş, başabaş noktası yükselmiş, güvenlik marjı daralmıştır.


    **(d)** Faaliyet kârı = 350.000 − 210.000 = 140.000 TL; DOL = 350.000 / 140.000 = **2,50**. Satışlar %10 artarsa faaliyet
    kârı %25 artar: 140.000 × (1 + 0,25) = **175.000 TL**.


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
    çözümde analiz edilen tablolar bu esasa göre hazırlanmış kabul edilmiştir.

    '
