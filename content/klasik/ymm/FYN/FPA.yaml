    **(a)** FVÖK başabaşı = 1.500.000 / 100 = **15.000 adet**; FVK başabaşı = (1.500.000 + 300.000) / 100 = **18.000 adet**.


    **(b)** FVÖK = 5 × 300.000 = 1.500.000 TL. Q = (1.500.000 + 1.500.000) / 100 = **30.000 adet**; hasılat = 30.000 × 250
    = **7.500.000 TL**.


    **(c)** FVK = 600.000 / (1 − 0,25) = **800.000 TL**. Q = (1.500.000 + 300.000 + 800.000) / 100 = **26.000 adet**.


    **(d)** Güvenlik marjı = (28.000 − 18.000) / 28.000 = **%35,7143**.


    **Mevzuat dayanağı:** TMS 23 paragraf 5 uyarınca borçlanma maliyetleri, borçlanmalarla ilgili katlanılan faiz ve diğer
    giderlerdir.

    '
