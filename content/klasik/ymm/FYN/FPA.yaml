  soru: '**Olay:** Marmara Mobilya A.Ş.''nin 31/12/2025 tarihli bilançosunda (bin TL) ödenmiş sermaye 4.000, kanuni yedek
    akçeler 1.000, geçmiş yıllar ve dönem zararları toplamı 2.700 bulunmaktadır. Toplam varlıklar 12.000, net işletme sermayesi
    -600, FVÖK -300''dir. Altman''ın borsada işlem görmeyen / hizmet işletmeleri için Z'''' modeli: Z'''' = 6,56·X1 + 3,26·X2
    + 6,72·X3 + 1,05·X4 (X1 = NİS / toplam varlık; X2 = dağıtılmamış kârlar (zararlar) / toplam varlık; X3 = FVÖK / toplam
    varlık; X4 = özkaynak defter değeri / toplam borç). Z'''' < 1,1 sıkıntı, 1,1–2,6 gri, > 2,6 güvenli bölgedir.


    **İstenenler:**


    (a) Özkaynak ve toplam borcu bularak Z'''' skorunu hesaplayınız ve bölgesini belirtiniz. (7 puan)


    (b) Sermaye ile kanuni yedek akçeler toplamının kaçta kaçının zarar sebebiyle karşılıksız kaldığını bularak yarı ve üçte
    iki eşiklerini karşılaştırınız. (7 puan)


    (c) TTK md. 376/1 gereği yönetim kurulunun yapması gereken işlemi belirtiniz. (4 puan)


    (d) Yarı eşiğini aşan zarar tutarını bulunuz ve finansal tabloların hazırlanma esası açısından yorumlayınız. (4 puan)

    '
  cozum: '**(a)** Özkaynak = 4.000 + 1.000 − 2.700 = **2.300 bin TL**; toplam borç = 12.000 − 2.300 = **9.700 bin TL**.

    X1 = -600 / 12.000 = -0,050; X2 = -2.700 / 12.000 = -0,225; X3 = -300 / 12.000 = -0,025; X4 = 2.300 / 9.700 = 0,237.

    Z'''' = 6,56 × (-0,050) + 3,26 × (-0,225) + 6,72 × (-0,025) + 1,05 × 0,237 = **-0,98** < 1,1 → **sıkıntı (iflas riski)
    bölgesi**.


    **(b)** Sermaye + kanuni yedek akçeler = 5.000 bin TL. Zarar oranı = 2.700 / 5.000 = **%54**. Yarısı = 2.500 bin TL (aşılmıştır);
    üçte ikisi = 3.333,33 bin TL (aşılmamıştır). Dolayısıyla yalnızca birinci fıkradaki (yarı) eşik gerçekleşmiştir; ikinci
    fıkradaki üçte iki eşiği ve doğrudan sona erme söz konusu değildir.


