    puan: 1
  - olcut: (a) Stoklara bağımlılık denkleminin kurulup stok (1.200.000) ve alacağın (975.000) bulunması
    puan: 3
  - olcut: (a) Denk bilanço tablosu
    puan: 1
  - olcut: (b) SMM ve brüt kâr
    puan: 2
  - olcut: (b) Net kârdan vergi öncesi kâra geçiş ve vergi
    puan: 2
  - olcut: (b) Faiz karşılama oranından faiz (200.000) ve FVÖK'ün (1.000.000) bulunması
    puan: 2
  - olcut: (b) Faaliyet giderleri ve gelir tablosunun tamamlanması
    puan: 1
  - olcut: (c) Altı oranın doğru hesaplanması
    puan: 4
  - olcut: (c) Likidite yorumu (asit-test zayıflığı, stoklara bağımlılık)
    puan: 2
  - olcut: (c) Faaliyet etkinliği, finansal yapı ve kârlılık yorumu
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Oran analizi ve oranlardan finansal tablo türetme
    madde: '-'
