    **(b)** Brüt kâr marjı: 2024 = **%30**, 2025 = **%25**. Faaliyet gideri / satış: 2024 = **%14**, 2025 = **%12,50**. FVÖK
    marjı: 2024 = **%16**, 2025 = **%12,50**.


