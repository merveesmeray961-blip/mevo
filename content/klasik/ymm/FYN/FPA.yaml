- id: YMM-FYN-FPA-K009
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - kâr payı politikası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kaya Lojistik A.Ş.''nin 2025 yılı net kârı 5.000.000 TL''dir. Dolaşımda nominal değeri 1 TL olan 1.000.000 adet pay
    vardır; pay borsa fiyatı 48 TL''dir. Özkaynak kalemleri: ödenmiş sermaye 1.000.000 TL, olağanüstü yedekler 6.000.000 TL,
    2025 net dönem kârı 5.000.000 TL.


    Şirketin 2026 yılı için değerlendirdiği yatırım projeleri (birbirinden bağımsız, bölünemez):


    | Proje | Yatırım tutarı (TL) | Beklenen getiri |

    |---|---|---|

    | A | 1.800.000 | %35 |

    | B | 1.200.000 | %30 |

    | C | 900.000 | %25 |

    | D | 700.000 | %18 |


    Ortakların aynı risk düzeyindeki yatırımlardan elde edebileceği alternatif getiri %25''tir. Projeler yalnız 2025 kârının
    dağıtılmayan kısmıyla finanse edilecektir. Vergi, yasal yedek ayırma zorunluluğu ve işlem maliyetleri dikkate alınmayacak;
    pay fiyatının fiyat/kazanç (F/K) oranı sabit kalacaktır.


    **İstenenler:**


    (a) Artık kâr payı yaklaşımına göre hangi projelerin iç kaynakla finanse edileceğini gerekçesiyle belirtiniz; getirisi
    alternatif getiriye eşit olan proje için eldeki kuş kuramına göre kararı açıklayınız. Dağıtılacak toplam kâr payını, pay
    başına kâr payını ve dağıtım oranını hesaplayınız. (9 puan)


    (b) (a)''da bulunan tutar nakit kâr payı yerine borsa fiyatından hisse geri alımıyla dağıtılacaktır. Geri alım fiyatını,
    geri alınacak pay sayısını, geri alım sonrası hisse başına kârı ve pay fiyatını hesaplayınız; 1.000 paya sahip ve paylarını
    geri alıma sunmayan bir ortağın iki yöntemdeki servetini karşılaştırınız. (6 puan)


    (c) (a) ve (b)''den bağımsız olarak, kâr dağıtımından önce olağanüstü yedeklerden %20 oranında bedelsiz sermaye artırımı
    yapıldığını varsayınız. Artırım sonrası özkaynak kalemlerini, pay sayısını, payın teorik fiyatını ve 1.000 paylı ortağın
    servetini hesaplayınız. (6 puan)


    (d) Kâr payı politikasının firma değerine etkisi konusunda Modigliani-Miller ilgisizlik görüşünü, eldeki kuş kuramını
    ve vergi farkı görüşünü karşılaştırınız. (4 puan)

    '
  cozum: '**(a) Artık kâr payı (proje sıralaması)**


    Getirisi ortakların alternatif getirisini (%25) **aşan** projeler kârın alıkonulmasını haklı kılar: A (%35) ve B (%30)
    → iç kaynak ihtiyacı 1.800.000 + 1.200.000 = **3.000.000 TL**.

    C''nin getirisi alternatif getiriye **eşittir**; ortak parayı kendisi aynı getiriyle değerlendirebilir. Eldeki kuş kuramına
    göre yatırımcı belirsiz gelecekteki sermaye kazancı yerine bugünkü kesin kâr payını tercih ettiğinden C için kâr **dağıtılır**.
    D (%18) alternatif getirinin altında olduğundan reddedilir.


    - Dağıtılacak kâr payı = 5.000.000 − 3.000.000 = **2.000.000 TL**

    - Pay başına kâr payı = 2.000.000 / 1.000.000 = **2 TL**

    - Dağıtım oranı = 2.000.000 / 5.000.000 = **%40**


    **(b) Hisse geri alımı**


    - HBK = 5.000.000 / 1.000.000 = 5 TL; F/K = 48 / 5 = 9,6

    - Kâr payı ödenecek olsaydı ortak payı (48 TL) ve 2 TL kâr payını alırdı; geri alım fiyatı = 48 + 2 = **50 TL**

    - Geri alınan pay = 2.000.000 / 50 = **40.000 adet**; kalan pay 960.000 adet

    - Yeni HBK = 5.000.000 / 960.000 = **5,2083 TL**; fiyat = 9,6 × 5,2083 = **50 TL**

    - 1.000 paylı ortak: nakit kâr payında 1.000 × 48 + 1.000 × 2 = 50.000 TL; geri alımda 1.000 × 50 = 50.000 TL. Servet
    aynıdır; fark yalnız vergi ve ortağın nakit tercihinden doğar.


    **(c) %20 bedelsiz sermaye artırımı**


    | Kalem | Önce (TL) | Sonra (TL) |

    |---|---|---|

    | Ödenmiş sermaye | 1.000.000 | 1.200.000 |

    | Olağanüstü yedekler | 6.000.000 | 5.800.000 |

    | Net dönem kârı | 5.000.000 | 5.000.000 |

    | **Toplam özkaynak** | **12.000.000** | **12.000.000** |


    - Pay sayısı = 1.000.000 × 1,2 = **1.200.000 adet**; teorik fiyat = 48 / 1,2 = **40 TL**

    - Ortağın serveti: önce 1.000 × 48 = 48.000 TL; sonra 1.200 × 40 = **48.000 TL**. Bedelsiz artırım özkaynak toplamını
    ve ortağın servetini değiştirmez; yalnız özkaynak kalemleri arasında aktarım yapar ve pay fiyatını düşürür.


    **(d) Kuramlar**


    - **MM ilgisizlik:** Vergi ve işlem maliyetinin olmadığı kusursuz piyasada firma değeri yatırım kararlarıyla belirlenir;
    kâr payı politikası değeri etkilemez. Ortak, istediği nakdi pay satarak ya da kâr payını yeniden yatırarak kendisi yaratabilir
    (b ve c şıkkındaki servet eşitliği bu görüşle uyumludur).

    - **Eldeki kuş (Gordon, Lintner):** Kâr payı sermaye kazancından daha az risklidir; yüksek dağıtım özkaynak maliyetini
    düşürür, değeri artırır. C projesinde dağıtım kararının gerekçesi budur.

    - **Vergi farkı:** Kâr payı sermaye kazancından daha ağır ya da daha erken vergileniyorsa yatırımcı düşük dağıtımı tercih
    eder; bu durumda düşük dağıtım değeri artırır.

    '
  puanlama:
  - olcut: (a) A ve B'nin alternatif getiriyle karşılaştırılarak seçilmesi, D'nin reddi
    puan: 3
  - olcut: (a) C için eldeki kuş kuramıyla dağıtım kararı
    puan: 2
  - olcut: (a) Kâr payı 2.000.000, pay başına 2 TL, dağıtım oranı %40
    puan: 4
  - olcut: (b) Geri alım fiyatı 50 TL ve 40.000 pay
    puan: 3
  - olcut: (b) Yeni HBK 5,2083 ve fiyat 50 TL; servet eşitliği
    puan: 3
  - olcut: (c) Özkaynak kalemleri (toplam 12.000.000 değişmez)
    puan: 3
  - olcut: (c) Pay sayısı, teorik fiyat 40 TL ve servet 48.000 TL
    puan: 3
  - olcut: (d) Üç görüşün doğru karşılaştırılması
    puan: 4
  kaynaklar:
  - mevzuat: Genel bilgi — Kâr payı politikası
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "nk, N, P = 5000000, 1000000, 48\nprojeler = [(1800000, 0.35), (1200000, 0.30), (900000, 0.25), (700000, 0.18)]\n\
      alikoy = sum(i for i, r in projeler if r > 0.25)\nkp = nk - alikoy\ndps = kp / N\nfk = P / (nk / N)\ngeri_fiyat = P\
      \ + dps\nadet = kp / geri_fiyat\nhbk_yeni = nk / (N - adet)\nsonuc = {\"alikoy\": alikoy, \"kar_payi\": kp, \"dps\"\
      : dps, \"dagitim\": kp / nk, \"geri_fiyat\": geri_fiyat,\n         \"adet\": adet, \"hbk_yeni\": round(hbk_yeni, 4),\
      \ \"fiyat_yeni\": round(fk * hbk_yeni, 4),\n         \"bedelsiz_pay\": N * 1.2, \"teorik_fiyat\": P / 1.2, \"servet\"\
      : 1200 * P / 1.2}\n"
