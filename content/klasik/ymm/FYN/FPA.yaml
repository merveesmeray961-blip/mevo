- id: YMM-FYN-FPA-K012
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - proforma tablolar ve dış finansman ihtiyacı
  - içsel ve sürdürülebilir büyüme oranı
  zorluk: 2
  puan: 23
  sure_dk: 30
  soru: '**Olay:** Deniz Gıda A.Ş. 2025 yılında 2.000.000 TL satış yapmıştır. 2026 yılında satışların %20 artması beklenmektedir.
    Aktiflerin tamamı ile KVB kalemleri satışlarla orantılı olarak değişmekte, uzun vadeli borçlar ve özkaynaklar ise değişmemektedir
    (ek finansman hariç). Net kâr marjı %6, kâr dağıtım oranı (net kârın dağıtılan kısmı) %50''dir; 2025 net kârı da aynı
    marjla gerçekleşmiştir.


    | 31/12/2025 | TL | | TL |

    |---|---|---|---|

    | Dönen varlıklar | 800.000 | Kısa vadeli yabancı kaynaklar | 300.000 |

    | Duran varlıklar | 1.200.000 | Uzun vadeli yabancı kaynaklar | 500.000 |

    | | | Özkaynaklar | 1.200.000 |

    | **Toplam** | **2.000.000** | **Toplam** | **2.000.000** |


    **İstenenler:**


    (a) 2026 yılı için proforma satış, net kâr ve dağıtılmayıp bırakılacak kâr tutarını bulunuz. (5 puan)


    (b) Dış finansman ihtiyacını (EFN) hesaplayınız. (7 puan)


    (c) 2025 verilerine göre içsel büyüme oranını ve sürdürülebilir büyüme oranını hesaplayınız. (6 puan)


    (d) EFN''nin tamamı uzun vadeli borçla karşılanırsa 2026 sonunda toplam borç / özkaynak oranını bulunuz. (5 puan)

    '
  cozum: '**(a)** Proforma satış = 2.000.000 × 1,20 = **2.400.000 TL**; net kâr = 2.400.000 × %6 = **144.000 TL**; dağıtılmayan
    kâr = 144.000 × (1 − %50) = **72.000 TL**.


    **(b)** Toplam varlık artışı = 2.000.000 × 0,20 = 400.000 TL; KVB''deki kendiliğinden artış = 300.000 × 0,20 = 60.000
    TL.

    EFN = 400.000 − 60.000 − 72.000 = **268.000 TL**.


    **(c)** 2025 net kârı = 120.000 TL; ROA = 120.000 / 2.000.000 = %6; ROE = 120.000 / 1.200.000 = %10; tutma oranı b = %50.

    İçsel büyüme = ROA × b / (1 − ROA × b) = 0,03 / 0,97 = **%3,0928**.

    Sürdürülebilir büyüme = ROE × b / (1 − ROE × b) = 0,05 / 0,95 = **%5,2632**.


    **(d)** Özkaynak = 1.200.000 + 72.000 = **1.272.000 TL**. Toplam borç = KVB 360.000 + UVB 500.000 + EFN 268.000 = **1.128.000
    TL**. Borç / özkaynak = **0,89**.


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
    çözümde analiz edilen tablolar bu esasa göre hazırlanmış kabul edilmiştir.

    '
  puanlama:
  - olcut: (a) proforma satış, net kâr ve dağıtılmayan kâr
    puan: 5
  - olcut: (b) ihtiyaç duyulan fon artışı ve EFN
    puan: 7
  - olcut: (c) içsel ve sürdürülebilir büyüme oranları
    puan: 6
  - olcut: (d) proforma toplam borç ve özkaynak ile borç/özkaynak oranı
    puan: 5
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 25
    alinti: Yönetimin işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyeti bulunmadığı ya da bunları
      yapmak dışında gerçekçi bir alternatifi olduğu sürece işletme, finansal tablolarını işletmenin sürekliliği esasına göre
      hazırlar.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 's0=2_000_000; g=0.20; dv=800_000; duv=1_200_000; kvb=300_000; uvb=500_000; oz=1_200_000; nm=0.06; pay=0.5

      s1 = s0*(1+g)

      ta0 = dv+duv

      ta1 = ta0*(1+g)

      kvb1 = kvb*(1+g)

      ni1 = s1*nm

      re1 = ni1*(1-pay)

      efn = (ta1-ta0) - (kvb1-kvb) - re1

      ni0 = s0*nm

      roa = ni0/ta0

      roe = ni0/oz

      b = 1-pay

      gi = roa*b/(1-roa*b)

      gs = roe*b/(1-roe*b)

      dva = ta1-ta0

      dkv = kvb1-kvb

      roab = roa*b

      roab1 = 1-roa*b

      roeb = roe*b

      roeb1 = 1-roe*b

      oz1 = oz+re1

      borc1 = kvb1+uvb+efn

      de = borc1/oz1

      sonuc = {''a'': (s1, ni1, re1), ''b'': efn, ''c'': (gi, gs), ''d'': (borc1, oz1, de)}

      '
