    = 840.000 + 1.000.000 + 2.660.000 = **4.500.000 TL**. EFN = 4.300.000 − 4.500.000 = **-200.000 TL** (negatif: **fazla
    fon**, borç ödenebilir).


    **(b)** Azami satış = 5.000.000 / 0,80 = **6.250.000 TL** → büyüme = **%25**.


    **(c)** Satış = 7.500.000 TL. Kapasite 6.250.000 TL''de dolduğundan duran varlık = 2.500.000 × 7.500.000 / 6.250.000 =
    **3.000.000 TL**. Dönen varlık = 2.250.000 TL; toplam varlık = **5.250.000 TL**. KVB = 1.050.000; net kâr = 600.000; dağıtılmayan
    = 450.000; özkaynak = 2.750.000 TL. EFN = 5.250.000 − (1.050.000 + 1.000.000 + 2.750.000) = **450.000 TL**.


    **(d)** Toplam borç = 1.050.000 + 1.000.000 + 450.000 = 2.500.000 TL; borç / özkaynak = 2.500.000 / 2.750.000 = **0,9090909091**.


