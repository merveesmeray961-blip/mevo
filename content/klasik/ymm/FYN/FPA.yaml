  cozum: 'Birim katkı payları: X 40, Y 60, Z 200 TL. Bir "paket" = 5 X + 3 Y + 2 Z.


    - Paket katkı payı = 5 × 40 + 3 × 60 + 2 × 200 = 200 + 180 + 400 = **780 TL**

