    ve kullanımlar) hazırlayarak NİS artışıyla mutabakatını gösteriniz. (7 puan)


    (c) Her iki yıl için cari oranı, asit-test oranını ve NİS / dönen varlıklar oranını; 2025 için özkaynak kârlılığını (dönem
    sonu özkaynakla) hesaplayınız. Fon akım tablosu ve oranlara dayanarak şirketin finansman politikasının vade uyumu yönünden
