    neden: kitap düzeyi hakem kabulü
- id: YMM-FYN-FPA-K002
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - oranlardan finansal tablo türetme
  - oran analizi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kuzey Makine A.Ş.''nin 31.12.2025 tarihli bilançosu ile 2025 yılı gelir tablosuna ulaşılamamaktadır. Kredi başvurusu
    için hazırlanan analiz raporundan yalnız aşağıdaki bilgiler elde edilmiştir.


    | Bilgi | Değer |

    |---|---|

    | Net satışlar | 12.000.000 TL |

    | Brüt kâr marjı | %30 |

    | Aktif devir hızı (net satışlar / toplam aktif) | 2 |

    | Özkaynak devir hızı (net satışlar / özkaynak) | 4 |

    | Kısa vadeli yabancı kaynaklar (KVYK) / toplam aktif | 0,25 |

    | Duran varlıklar / devamlı sermaye (özkaynak + UVYK) | 0,75 |

    | Nakit oranı | 0,30 |

    | Stoklara bağımlılık oranı | 0,0625 |

    | Özkaynak kârlılığı (net kâr / özkaynak) | %20 |

    | Faiz karşılama oranı (FVÖK / faiz gideri) | 5 |

    | Kurumlar vergisi oranı | %25 |


    Varsayımlar: Yıl 360 gün alınacaktır. Dönen varlıklar yalnız hazır değerler, ticari alacaklar ve stoklardan oluşur; menkul
    kıymet yoktur. Oranlarda dönem sonu tutarları kullanılır. Gelir tablosunda faaliyet dışı kalem olarak yalnız faiz gideri
    vardır. Stoklara bağımlılık oranı = [KVYK − (hazır değerler + menkul kıymetler + kısa vadeli alacaklar)] / stoklar.


    Sektör ortalamaları: cari oran 1,8; asit-test oranı 1,1; alacak tahsil süresi 45 gün; stok devir hızı (SMM / stok) 6;
    toplam yabancı kaynak / toplam aktif %45; aktif kârlılığı (net kâr / aktif) %8.


    **İstenenler:**


    (a) Şirketin özet bilançosunu (hazır değerler, ticari alacaklar, stoklar, duran varlıklar, KVYK, UVYK, özkaynak) türetiniz;
    her kalemin hangi orandan bulunduğunu gösteriniz. (10 puan)


    (b) Özet gelir tablosunu (net satışlar, SMM, brüt kâr, faaliyet giderleri, FVÖK, faiz gideri, vergi öncesi kâr, vergi,
    net kâr) türetiniz. (7 puan)


    (c) Cari oran, asit-test oranı, alacak tahsil süresi, stok devir hızı, borç oranı ve aktif kârlılığını hesaplayınız; sonuçları
    sektör ortalamalarıyla karşılaştırarak şirketi likidite, faaliyet etkinliği, finansal yapı ve kârlılık yönünden yorumlayınız.
    (8 puan)

    '
  cozum: "**(a) Bilançonun türetilmesi** (toplamdan parçaya)\n\n1. Toplam aktif = Net satışlar / Aktif devir hızı = 12.000.000\
    \ / 2 = **6.000.000 TL**\n2. Özkaynak = 12.000.000 / 4 = **3.000.000 TL**\n3. KVYK = 0,25 × 6.000.000 = **1.500.000 TL**;\
    \ UVYK = 6.000.000 − 3.000.000 − 1.500.000 = **1.500.000 TL**\n4. Devamlı sermaye = 3.000.000 + 1.500.000 = 4.500.000\
    \ TL; duran varlıklar = 0,75 × 4.500.000 = **3.375.000 TL**; dönen varlıklar = 6.000.000 − 3.375.000 = **2.625.000 TL**\n\
    5. Nakit oranı = Hazır değerler / KVYK → hazır değerler = 0,30 × 1.500.000 = **450.000 TL**\n6. Hazır değerler + alacaklar\
    \ = X dersek stok = 2.625.000 − X olur. Stoklara bağımlılık: (1.500.000 − X) / (2.625.000 − X) = 0,0625 → 1.500.000 −\
    \ X = 164.062,5 − 0,0625X → 0,9375X = 1.335.937,5 → X = 1.425.000 TL\n   - Stoklar = 2.625.000 − 1.425.000 = **1.200.000\
    \ TL**\n   - Ticari alacaklar = 1.425.000 − 450.000 = **975.000 TL**\n\n| Aktif | TL | Pasif | TL |\n|---|---|---|---|\n\
    | Hazır değerler | 450.000 | KVYK | 1.500.000 |\n| Ticari alacaklar | 975.000 | UVYK | 1.500.000 |\n| Stoklar | 1.200.000\
    \ | Özkaynak | 3.000.000 |\n| Dönen varlıklar | 2.625.000 | | |\n| Duran varlıklar | 3.375.000 | | |\n| **Toplam** | **6.000.000**\
    \ | **Toplam** | **6.000.000** |\n\n**(b) Gelir tablosunun türetilmesi**\n\n1. SMM = 12.000.000 × (1 − 0,30) = 8.400.000\
    \ TL; brüt kâr = 3.600.000 TL\n2. Net kâr = 0,20 × 3.000.000 = 600.000 TL; vergi öncesi kâr = 600.000 / (1 − 0,25) = 800.000\
    \ TL; vergi = 200.000 TL\n3. FVÖK − Faiz = 800.000 ve FVÖK = 5 × Faiz → 4 × Faiz = 800.000 → Faiz = 200.000 TL; FVÖK =\
    \ 1.000.000 TL\n4. Faaliyet giderleri = Brüt kâr − FVÖK = 3.600.000 − 1.000.000 = 2.600.000 TL\n\n| Kalem | TL |\n|---|---|\n\
    | Net satışlar | 12.000.000 |\n| SMM | (8.400.000) |\n| Brüt kâr | 3.600.000 |\n| Faaliyet giderleri | (2.600.000) |\n\
    | FVÖK | 1.000.000 |\n| Faiz gideri | (200.000) |\n| Vergi öncesi kâr | 800.000 |\n| Vergi (%25) | (200.000) |\n| Net\
    \ kâr | 600.000 |\n\n**(c) Oranlar ve yorum**\n\n| Oran | Hesap | Şirket | Sektör |\n|---|---|---|---|\n| Cari oran |\
    \ 2.625.000 / 1.500.000 | 1,75 | 1,8 |\n| Asit-test oranı | (2.625.000 − 1.200.000) / 1.500.000 | 0,95 | 1,1 |\n| Alacak\
    \ tahsil süresi | 975.000 / (12.000.000 / 360) | 29,25 gün | 45 gün |\n| Stok devir hızı | 8.400.000 / 1.200.000 | 7 |\
    \ 6 |\n| Borç oranı | 3.000.000 / 6.000.000 | %50 | %45 |\n| Aktif kârlılığı | 600.000 / 6.000.000 | %10 | %8 |\n\n- **Likidite:**\
    \ Cari oran sektöre yakın, asit-test oranı ise belirgin biçimde düşüktür; stoklar hariç dönen varlıklar KVYK'yı karşılamamaktadır\
    \ (0,95 < 1). Stoklara bağımlılık oranının pozitif olması (0,0625) KVYK'nın bir bölümünün ancak stok satışıyla ödenebileceğini\
    \ gösterir.\n- **Faaliyet etkinliği:** Tahsil süresi sektörün çok altında (29,25 gün), stok devir hızı üstündedir; alacak\
    \ ve stok yönetimi etkindir. Düşük asit-test oranı alacak tutarının küçüklüğünden kaynaklanır, kötü yönetimden değil.\n\
    - **Finansal yapı:** Borç oranı %50 ile sektörün üstündedir; faiz karşılama oranı 5 makul bir güvenlik sağlar. Özkaynak\
    \ çarpanı 2'dir.\n- **Kârlılık:** Aktif kârlılığı %10 ile sektörden yüksektir; özkaynak kârlılığı (%20 = %10 × 2) olumlu\
    \ finansal kaldıraçla büyümüştür. Kredi açısından risk, kârlılıktan çok kısa vadeli likiditededir.\n"
  puanlama:
  - olcut: (a) Toplam aktif, özkaynak, KVYK ve UVYK'nın doğru oranlardan bulunması
    puan: 3
  - olcut: (a) Devamlı sermaye üzerinden duran ve dönen varlıkların bulunması
    puan: 2
