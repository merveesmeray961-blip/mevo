    12 TL, dağıtılabilir net dönem kârı 5.000.000 TL''dir. Yönetim iki seçeneği değerlendirmektedir: (1) pay başına 0,30 TL
    nakit kâr payı dağıtılması; (2) %20 oranında bedelsiz sermaye artırımı (kâr payı dağıtılmaz). İşlemlerin piyasa değerini
    mekanik olarak ayarladığı, vergi ve işlem maliyetinin bulunmadığı varsayılacaktır. Bir yatırımcının elinde 5.000 adet
    pay vardır.


    **İstenenler:**


    (a) Seçenek (1) için toplam nakit kâr payını, kâr dağıtım oranını ve kâr payı verimini hesaplayınız. (6 puan)


    (b) Seçenek (1) uygulandığında kâr payı sonrası teorik pay fiyatını ve yatırımcının toplam servetini bulunuz. (5 puan)


    (c) Seçenek (2) uygulandığında yeni pay sayısını, teorik pay fiyatını, yatırımcının pay adedini ve servetini bulunuz.
    (6 puan)


    (d) İşlem öncesi yatırımcı servetini hesaplayarak iki seçeneğin yatırımcı servetine etkisini karşılaştırınız; kâr payının
    pay sahiplerine nasıl dağıtılacağını belirtiniz. (4 puan)

    '
  cozum: '**(a)** Toplam kâr payı = 10.000.000 × 0,30 = **3.000.000 TL**; dağıtım oranı = 3.000.000 / 5.000.000 = **%60**;
    kâr payı verimi = 0,30 / 12 = **%2,5**.


    **(b)** Teorik fiyat = 12 − 0,30 = **11,70 TL**. Yatırımcı: 5.000 × 11,70 + 5.000 × 0,30 (= 1.500 TL nakit) = **60.000
