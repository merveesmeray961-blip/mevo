- id: YMM-FYN-FPA-K001
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - oran analizi ve DuPont
  - kaldıraç dereceleri (faaliyet; finansal; birleşik)
  - kâr payı politikası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Toros Sanayi A.Ş.''nin son yıla ait özet verileri aşağıdadır (tutarlar TL):


    | Gelir tablosu | Tutar |

    |---|---|

    | Satışlar | 5.000.000 |

    | Değişken giderler | (3.000.000) |

    | Sabit faaliyet giderleri (amortisman dahil) | (1.000.000) |

    | Faiz ve vergi öncesi kâr (FVÖK) | 1.000.000 |

    | Faiz gideri | (200.000) |

    | Vergi öncesi kâr | 800.000 |

    | Vergi (%20) | (160.000) |

    | Net kâr | 640.000 |


    Toplam aktifler 4.000.000 TL, özkaynaklar 1.600.000 TL, dolaşımdaki pay sayısı 320.000''dir. Şirketin imtiyazlı payı yoktur.


    **İstenenler:**


    (a) Özkaynak kârlılığını DuPont yaklaşımıyla (net kâr marjı, aktif devir hızı, özkaynak çarpanı) ayrıştırarak hesaplayınız.
    (6 puan)


    (b) Faaliyet, finansal ve birleşik kaldıraç derecelerini hesaplayınız. Gelecek yıl satışların %20 düşeceği tahmin edilmektedir;
    maliyet yapısı ve faiz gideri değişmezse FVÖK''ü ve pay başına kazancı (PBK) kaldıraç derecelerini kullanarak bulunuz
    ve doğrudan hesapla kontrol ediniz. (8 puan)


    (c) Şirket artık kâr payı politikası izlemektedir. Gelecek yılın yatırım bütçesi 1.000.000 TL''dir ve şirket mevcut özkaynak
    çarpanını hedef sermaye yapısı olarak korumak istemektedir. Bu yılın kârından dağıtılacak toplam kâr payını, pay başına
    kâr payını ve dağıtım oranını hesaplayınız. (5 puan)


    (d) Faaliyet başabaş satış tutarını ve PBK''nın sıfır olduğu satış tutarını hesaplayınız; iki tutar arasındaki farkın
    nedenini kaldıraç kavramıyla açıklayınız. (6 puan)

    '
  cozum: '**(a) DuPont ayrıştırması**


    Net kâr marjı = 640.000 / 5.000.000 = **%12,8**


    Aktif devir hızı = 5.000.000 / 4.000.000 = **1,25**


    Özkaynak çarpanı = 4.000.000 / 1.600.000 = **2,5**


    Özkaynak kârlılığı = 0,128 × 1,25 × 2,5 = **%40** (kontrol: 640.000 / 1.600.000 = %40; aktif kârlılığı %16)


    **(b) Kaldıraç dereceleri**


    Katkı payı = 5.000.000 − 3.000.000 = 2.000.000 TL


    FKD = 2.000.000 / 1.000.000 = **2**


    FinKD = 1.000.000 / (1.000.000 − 200.000) = **1,25**


    BKD = 2 × 1,25 = **2,5**


    Satışlar %20 düşerse: FVÖK %20 × 2 = %40 düşer → 1.000.000 × 0,60 = **600.000 TL**; PBK %20 × 2,5 = %50 düşer. Mevcut
    PBK = 640.000 / 320.000 = 2 TL → yeni PBK = **1 TL**.


    Doğrudan kontrol: Satışlar 4.000.000; değişken giderler 2.400.000; FVÖK = 4.000.000 − 2.400.000 − 1.000.000 = 600.000;
    VÖK = 400.000; net kâr = 320.000; PBK = 320.000 / 320.000 = 1 TL. ✔


    **(c) Artık kâr payı**


    Özkaynak çarpanı 2,5 → özkaynak / aktif = 1 / 2,5 = %40 (hedef yapı: %40 özkaynak, %60 borç).


    Yatırımın özkaynakla karşılanacak kısmı = 1.000.000 × %40 = 400.000 TL


    Dağıtılacak kâr payı = 640.000 − 400.000 = **240.000 TL**


    Pay başına kâr payı = 240.000 / 320.000 = **0,75 TL**; dağıtım oranı = 240.000 / 640.000 = **%37,5**


    **(d) Başabaş noktaları**


    Katkı payı oranı = 2.000.000 / 5.000.000 = %40


    Faaliyet başabaşı (FVÖK = 0) = 1.000.000 / 0,40 = **2.500.000 TL**


    PBK = 0 için FVÖK faiz giderini karşılamalıdır: (1.000.000 + 200.000) / 0,40 = **3.000.000 TL**


    Fark (500.000 TL), sabit finansman gideri olan faizden kaynaklanır. Faaliyet kaldıracı sabit faaliyet giderlerinden, finansal
    kaldıraç sabit finansman giderinden doğar; faiz gideri, PBK''yı sıfırlayan satış düzeyini yukarı çeker. Mevcut satışların
    faaliyet başabaşından %50 yukarıda olması (güvenlik payı %50) FKD = 1 / 0,50 = 2 sonucuyla tutarlıdır.

    '
  puanlama:
  - olcut: (a) Net kâr marjı %12,8, aktif devir hızı 1,25, özkaynak çarpanı 2,5
    puan: 4
  - olcut: (a) Özkaynak kârlılığı %40
    puan: 2
  - olcut: (b) FKD 2, FinKD 1,25, BKD 2,5
    puan: 3
  - olcut: (b) Kaldıraçla FVÖK 600.000 TL ve PBK 1 TL
    puan: 3
  - olcut: (b) Doğrudan hesapla kontrol
    puan: 2
  - olcut: (c) Hedef özkaynak oranı %40 ve alıkonulacak kâr 400.000 TL
    puan: 2
  - olcut: (c) Kâr payı 240.000 TL, pay başına 0,75 TL, dağıtım oranı %37,5
    puan: 3
  - olcut: (d) Faaliyet başabaşı 2.500.000 TL ve PBK sıfır noktası 3.000.000 TL
    puan: 4
  - olcut: (d) Farkın faiz (finansal kaldıraç) ile açıklanması
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — finansal analiz, kaldıraç ve kâr payı politikası
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 's = 5000000.0

      dg = 3000000.0

      sg = 1000000.0

      faiz = 200000.0

      t = 0.20

      aktif = 4000000.0

      ozk = 1600000.0

      pay = 320000.0

      fvok = s - dg - sg

      nk = (fvok - faiz) * (1 - t)

      marj = nk / s

      devir = s / aktif

      carpan = aktif / ozk

      roe = marj * devir * carpan

      fkd = (s - dg) / fvok

      finkd = fvok / (fvok - faiz)

      bkd = fkd * finkd

      s2 = s * 0.8

      fvok2 = s2 - dg / s * s2 - sg

      pbk1 = nk / pay

      pbk2 = (fvok2 - faiz) * (1 - t) / pay

      ozk_ihtiyac = 1000000.0 / carpan

      kp = nk - ozk_ihtiyac

      kpo = (s - dg) / s

      sonuc = {"marj": round(marj, 4), "devir": devir, "carpan": carpan, "roe": round(roe, 4), "fkd": fkd, "finkd": finkd,
      "bkd": bkd, "fvok2": fvok2, "pbk1": pbk1, "pbk2": round(pbk2, 4), "kar_payi": kp, "pay_basina_kp": kp / pay, "dagitim":
      kp / nk, "basabas": sg / kpo, "pbk0_satis": (sg + faiz) / kpo}

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-FYN-FPA-K002
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - oranlardan finansal tablo türetme
  - oran analizi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kuzey Makine A.Ş.''nin 31.12.2025 tarihli bilançosu ile 2025 yılı gelir tablosuna ulaşılamamaktadır. Kredi başvurusu
    için hazırlanan analiz raporundan yalnız aşağıdaki bilgiler elde edilmiştir.


    | Bilgi | Değer |

    |---|---|

    | Net satışlar | 12.000.000 TL |

    | Brüt kâr marjı | %30 |

    | Aktif devir hızı (net satışlar / toplam aktif) | 2 |

    | Özkaynak devir hızı (net satışlar / özkaynak) | 4 |

    | Kısa vadeli yabancı kaynaklar (KVYK) / toplam aktif | 0,25 |

    | Duran varlıklar / devamlı sermaye (özkaynak + UVYK) | 0,75 |

    | Nakit oranı | 0,30 |

    | Stoklara bağımlılık oranı | 0,0625 |

    | Özkaynak kârlılığı (net kâr / özkaynak) | %20 |

    | Faiz karşılama oranı (FVÖK / faiz gideri) | 5 |

    | Kurumlar vergisi oranı | %25 |


    Varsayımlar: Yıl 360 gün alınacaktır. Dönen varlıklar yalnız hazır değerler, ticari alacaklar ve stoklardan oluşur; menkul
    kıymet yoktur. Oranlarda dönem sonu tutarları kullanılır. Gelir tablosunda faaliyet dışı kalem olarak yalnız faiz gideri
    vardır. Stoklara bağımlılık oranı = [KVYK − (hazır değerler + menkul kıymetler + kısa vadeli alacaklar)] / stoklar.


    Sektör ortalamaları: cari oran 1,8; asit-test oranı 1,1; alacak tahsil süresi 45 gün; stok devir hızı (SMM / stok) 6;
    toplam yabancı kaynak / toplam aktif %45; aktif kârlılığı (net kâr / aktif) %8.


    **İstenenler:**


    (a) Şirketin özet bilançosunu (hazır değerler, ticari alacaklar, stoklar, duran varlıklar, KVYK, UVYK, özkaynak) türetiniz;
    her kalemin hangi orandan bulunduğunu gösteriniz. (10 puan)


    (b) Özet gelir tablosunu (net satışlar, SMM, brüt kâr, faaliyet giderleri, FVÖK, faiz gideri, vergi öncesi kâr, vergi,
    net kâr) türetiniz. (7 puan)


    (c) Cari oran, asit-test oranı, alacak tahsil süresi, stok devir hızı, borç oranı ve aktif kârlılığını hesaplayınız; sonuçları
    sektör ortalamalarıyla karşılaştırarak şirketi likidite, faaliyet etkinliği, finansal yapı ve kârlılık yönünden yorumlayınız.
    (8 puan)

    '
  cozum: "**(a) Bilançonun türetilmesi** (toplamdan parçaya)\n\n1. Toplam aktif = Net satışlar / Aktif devir hızı = 12.000.000\
    \ / 2 = **6.000.000 TL**\n2. Özkaynak = 12.000.000 / 4 = **3.000.000 TL**\n3. KVYK = 0,25 × 6.000.000 = **1.500.000 TL**;\
    \ UVYK = 6.000.000 − 3.000.000 − 1.500.000 = **1.500.000 TL**\n4. Devamlı sermaye = 3.000.000 + 1.500.000 = 4.500.000\
    \ TL; duran varlıklar = 0,75 × 4.500.000 = **3.375.000 TL**; dönen varlıklar = 6.000.000 − 3.375.000 = **2.625.000 TL**\n\
    5. Nakit oranı = Hazır değerler / KVYK → hazır değerler = 0,30 × 1.500.000 = **450.000 TL**\n6. Hazır değerler + alacaklar\
    \ = X dersek stok = 2.625.000 − X olur. Stoklara bağımlılık: (1.500.000 − X) / (2.625.000 − X) = 0,0625 → 1.500.000 −\
    \ X = 164.062,5 − 0,0625X → 0,9375X = 1.335.937,5 → X = 1.425.000 TL\n   - Stoklar = 2.625.000 − 1.425.000 = **1.200.000\
    \ TL**\n   - Ticari alacaklar = 1.425.000 − 450.000 = **975.000 TL**\n\n| Aktif | TL | Pasif | TL |\n|---|---|---|---|\n\
    | Hazır değerler | 450.000 | KVYK | 1.500.000 |\n| Ticari alacaklar | 975.000 | UVYK | 1.500.000 |\n| Stoklar | 1.200.000\
    \ | Özkaynak | 3.000.000 |\n| Dönen varlıklar | 2.625.000 | | |\n| Duran varlıklar | 3.375.000 | | |\n| **Toplam** | **6.000.000**\
    \ | **Toplam** | **6.000.000** |\n\n**(b) Gelir tablosunun türetilmesi**\n\n1. SMM = 12.000.000 × (1 − 0,30) = 8.400.000\
    \ TL; brüt kâr = 3.600.000 TL\n2. Net kâr = 0,20 × 3.000.000 = 600.000 TL; vergi öncesi kâr = 600.000 / (1 − 0,25) = 800.000\
    \ TL; vergi = 200.000 TL\n3. FVÖK − Faiz = 800.000 ve FVÖK = 5 × Faiz → 4 × Faiz = 800.000 → Faiz = 200.000 TL; FVÖK =\
    \ 1.000.000 TL\n4. Faaliyet giderleri = Brüt kâr − FVÖK = 3.600.000 − 1.000.000 = 2.600.000 TL\n\n| Kalem | TL |\n|---|---|\n\
    | Net satışlar | 12.000.000 |\n| SMM | (8.400.000) |\n| Brüt kâr | 3.600.000 |\n| Faaliyet giderleri | (2.600.000) |\n\
    | FVÖK | 1.000.000 |\n| Faiz gideri | (200.000) |\n| Vergi öncesi kâr | 800.000 |\n| Vergi (%25) | (200.000) |\n| Net\
    \ kâr | 600.000 |\n\n**(c) Oranlar ve yorum**\n\n| Oran | Hesap | Şirket | Sektör |\n|---|---|---|---|\n| Cari oran |\
    \ 2.625.000 / 1.500.000 | 1,75 | 1,8 |\n| Asit-test oranı | (2.625.000 − 1.200.000) / 1.500.000 | 0,95 | 1,1 |\n| Alacak\
    \ tahsil süresi | 975.000 / (12.000.000 / 360) | 29,25 gün | 45 gün |\n| Stok devir hızı | 8.400.000 / 1.200.000 | 7 |\
    \ 6 |\n| Borç oranı | 3.000.000 / 6.000.000 | %50 | %45 |\n| Aktif kârlılığı | 600.000 / 6.000.000 | %10 | %8 |\n\n- **Likidite:**\
    \ Cari oran sektöre yakın, asit-test oranı ise belirgin biçimde düşüktür; stoklar hariç dönen varlıklar KVYK'yı karşılamamaktadır\
    \ (0,95 < 1). Stoklara bağımlılık oranının pozitif olması (0,0625) KVYK'nın bir bölümünün ancak stok satışıyla ödenebileceğini\
    \ gösterir.\n- **Faaliyet etkinliği:** Tahsil süresi sektörün çok altında (29,25 gün), stok devir hızı üstündedir; alacak\
    \ ve stok yönetimi etkindir. Düşük asit-test oranı alacak tutarının küçüklüğünden kaynaklanır, kötü yönetimden değil.\n\
    - **Finansal yapı:** Borç oranı %50 ile sektörün üstündedir; faiz karşılama oranı 5 makul bir güvenlik sağlar. Özkaynak\
    \ çarpanı 2'dir.\n- **Kârlılık:** Aktif kârlılığı %10 ile sektörden yüksektir; özkaynak kârlılığı (%20 = %10 × 2) olumlu\
    \ finansal kaldıraçla büyümüştür. Kredi açısından risk, kârlılıktan çok kısa vadeli likiditededir.\n"
  puanlama:
  - olcut: (a) Toplam aktif, özkaynak, KVYK ve UVYK'nın doğru oranlardan bulunması
    puan: 3
  - olcut: (a) Devamlı sermaye üzerinden duran ve dönen varlıkların bulunması
    puan: 2
  - olcut: (a) Nakit oranından hazır değerlerin bulunması
    puan: 1
  - olcut: (a) Stoklara bağımlılık denkleminin kurulup stok (1.200.000) ve alacağın (975.000) bulunması
    puan: 3
  - olcut: (a) Denk bilanço tablosu
    puan: 1
  - olcut: (b) SMM ve brüt kâr
    puan: 2
  - olcut: (b) Net kârdan vergi öncesi kâra geçiş ve vergi
    puan: 2
  - olcut: (b) Faiz karşılama oranından faiz (200.000) ve FVÖK'ün (1.000.000) bulunması
    puan: 2
  - olcut: (b) Faaliyet giderleri ve gelir tablosunun tamamlanması
    puan: 1
  - olcut: (c) Altı oranın doğru hesaplanması
    puan: 4
  - olcut: (c) Likidite yorumu (asit-test zayıflığı, stoklara bağımlılık)
    puan: 2
  - olcut: (c) Faaliyet etkinliği, finansal yapı ve kârlılık yorumu
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Oran analizi ve oranlardan finansal tablo türetme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "S = 12000000\naktif = S / 2\nozk = S / 4\nkvyk = 0.25 * aktif\nuvyk = aktif - ozk - kvyk\ndv = 0.75 * (ozk +\
      \ uvyk)\ndonen = aktif - dv\nhd = 0.30 * kvyk\nX = (kvyk - 0.0625 * donen) / (1 - 0.0625)\nstok = donen - X\nalacak\
      \ = X - hd\nsmm = S * 0.70\nnk = 0.20 * ozk\nvok = nk / 0.75\nfaiz = vok / 4\nfvok = 5 * faiz\nfg = S - smm - fvok\n\
      sonuc = {\"aktif\": aktif, \"ozk\": ozk, \"kvyk\": kvyk, \"uvyk\": uvyk, \"dv\": dv, \"donen\": donen, \"hd\": hd,\n\
      \         \"stok\": round(stok, 2), \"alacak\": round(alacak, 2), \"smm\": smm, \"faiz\": faiz, \"fvok\": fvok, \"fg\"\
      : fg,\n         \"net_kar\": nk, \"cari\": donen / kvyk, \"asit\": round((donen - stok) / kvyk, 4),\n         \"tahsil_gun\"\
      : round(alacak / (S / 360), 2), \"stok_devir\": round(smm / stok, 4),\n         \"borc_orani\": (kvyk + uvyk) / aktif,\
      \ \"roa\": nk / aktif}\n"
