- id: YMM-FYN-FPA-K029
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - başabaş analizi (faiz dahil ve çok ürünlü)
  - kaldıraç dereceleri (faaliyet finansal birleşik)
  zorluk: 3
  puan: 22
  sure_dk: 35
  soru: '**Olay:** Arda Makine A.Ş. tek ürün üretmektedir (birim fiyat 200 TL; yıllık satış 40.000 adet). Mevcut yapıda birim
    değişken maliyet 120 TL, yıllık sabit gider 2.000.000 TL''dir. Yönetim, otomasyon yatırımı ile birim değişken maliyeti
    100 TL''ye düşürmeyi, buna karşılık yıllık sabit giderleri 2.600.000 TL''ye çıkarmayı değerlendirmektedir. Faiz ve vergi
    dikkate alınmayacaktır.


    **İstenenler:**


    (a) Mevcut ve otomasyonlu yapı için başabaş satış adedini bulunuz. (4 puan)


    (b) Her iki yapı için 40.000 adet satışta FVÖK, faaliyet kaldıraç derecesi ve güvenlik marjını (%) hesaplayınız. (7 puan)


    (c) İki yapının FVÖK''ünün eşit olacağı satış adedini (ilgisizlik noktası) bulunuz. (5 puan)


    (d) Talep %20 artarsa ve %35 azalırsa iki yapının FVÖK''ünü karşılaştırarak yatırım kararını yorumlayınız. (6 puan)

    '
  cozum: 'Birim katkı: mevcut = 200 − 120 = 80 TL; otomasyonlu = 200 − 100 = 100 TL.


    **(a)** Mevcut = 2.000.000 / 80 = **25.000 adet**; otomasyonlu = 2.600.000 / 100 = **26.000 adet**.


    **(b)** Mevcut: FVÖK = 40.000 × 80 − 2.000.000 = **1.200.000 TL**; DOL = 40.000 × 80 / 1.200.000 = **2,67**; güvenlik
    marjı = (40.000 − 25.000) / 40.000 = **%37,50**.

    Otomasyonlu: FVÖK = 40.000 × 100 − 2.600.000 = **1.400.000 TL**; DOL = **2,86**; güvenlik marjı = (40.000 − 26.000) /
    40.000 = **%35**.


    **(c)** 80 × Q − 2.000.000 = 100 × Q − 2.600.000 → Q = (2.600.000 − 2.000.000) / (100 − 80) = **30.000 adet**.


    **(d)** Talep +%20 (48.000 adet): mevcut FVÖK = 1.840.000 TL; otomasyonlu = 2.200.000 TL → otomasyon üstün. Talep −%35
    (26.000 adet): mevcut = 80.000 TL; otomasyonlu = 0 TL → mevcut yapı üstün (başabaş altı). Yani otomasyon, talep ilgisizlik
    noktasının (30.000 adet) üzerinde kaldıkça kazandırır; ancak DOL ve başabaş noktasını yükselttiği için talep riskini artırır.


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
    çözümde analiz edilen tablolar bu esasa göre hazırlanmış kabul edilmiştir.

    '
  puanlama:
  - olcut: (a) iki yapı için başabaş adedi
    puan: 4
  - olcut: (b) FVÖK, DOL ve güvenlik marjı
    puan: 7
  - olcut: (c) ilgisizlik adedi
    puan: 5
  - olcut: (d) iki talep senaryosunda FVÖK ve karar
    puan: 6
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 25
    alinti: Yönetimin işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyeti bulunmadığı ya da bunları
      yapmak dışında gerçekçi bir alternatifi olduğu sürece işletme, finansal tablolarını işletmenin sürekliliği esasına göre
      hazırlar.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'p=200; q=40_000

      v1, f1 = 120, 2_000_000

      v2, f2 = 100, 2_600_000

      k1, k2 = p-v1, p-v2

      be1, be2 = f1/k1, f2/k2

      ebit1 = q*k1-f1

      ebit2 = q*k2-f2

      dol1, dol2 = q*k1/ebit1, q*k2/ebit2

      gm1, gm2 = (q-be1)/q, (q-be2)/q

      q_ind = (f2-f1)/(k2-k1)

      qa = q*1.20

      qb = q*0.65

      ea1, ea2 = qa*k1-f1, qa*k2-f2

      eb1, eb2 = qb*k1-f1, qb*k2-f2

      sonuc = {''a'': (be1, be2), ''b'': (dol1, dol2, gm1, gm2), ''c'': q_ind, ''d'': (ea1, ea2, eb1, eb2)}

      '
