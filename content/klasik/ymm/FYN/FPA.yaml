    | Toplam varlıklar | 2.500.000 | 3.000.000 |

    | Özkaynaklar | 1.250.000 | 1.200.000 |


    **İstenenler:**


    (a) 2025 için net kâr marjı, aktif devir hızı ve özkaynak çarpanıyla üç faktörlü Dupont ayrıştırmasını yapınız ve ROE''yi
    bulunuz. (5 puan)


    (b) Beş faktörlü Dupont (vergi yükü × faiz yükü × FVÖK marjı × aktif devir hızı × özkaynak çarpanı) ile her iki yılın
    ROE''sini bulunuz. (7 puan)


    (c) ROE''nin değişmemesine rağmen hangi bileşenlerin hangi yönde değiştiğini gösteriniz ve yorumlayınız. (5 puan)


    (d) Diğer bileşenler 2025 düzeyinde sabit kalmak üzere 2026''da ROE''nin %36''ya çıkması için gereken FVÖK marjını bulunuz.
    (5 puan)

    '
  cozum: '**(a)** 2025 net kâr = (600.000 − 120.000) × 0,75 = 360.000 TL. Net kâr marjı = 360.000 / 6.000.000 = %6; aktif
    devir hızı = 6.000.000 / 3.000.000 = 2; özkaynak çarpanı = 3.000.000 / 1.200.000 = 2,50. ROE = %6 × 2 × 2,50 = **%30**.


    **(b)**


    | Faktör | 2024 | 2025 |

    |---|---|---|

    | Vergi yükü (NK / FVK) | 0,75 | 0,75 |

    | Faiz yükü (FVK / FVÖK) | 0,83 | 0,80 |

    | FVÖK marjı | %12 | %10 |

    | Aktif devir hızı | 2 | 2 |

    | Özkaynak çarpanı | 2 | 2,50 |

    | **ROE** | **%30** | **%30** |


    **(c)** ROE iki yılda da %30''dir. Ancak FVÖK marjı %12''den %10''e düşmüş (karlılık zayıflamış), faiz yükü artmış; buna
    karşılık özkaynak çarpanı 2''ten 2,50''e yükselmiştir. Yani ROE, operasyonel verimlilik yerine daha fazla borçlanmayla
    (finansal kaldıraçla) korunmuştur; bu, finansal riski artırır.


    **(d)** Gerekli marj = 0,36 / (0,75 × 0,80 × 2 × 2,50) = **%12**.


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
