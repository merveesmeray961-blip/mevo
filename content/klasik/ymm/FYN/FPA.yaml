    Z = 1,2 × 0,15 + 1,4 × 0,20 + 3,3 × 0,15 + 0,6 × 1,20 + 1,0 × 1,15 = **2,825** → 1,81 ile 2,99 arasında olduğundan **gri
    bölge**.


    **(b)** B: X1 = 0,10; X2 = 0,05; X3 = 0,05; X4 = 0,50; X5 = 1,00. Z = 0,12 + 0,07 + 0,165 + 0,30 + 1,00 = **1,655** →
    1,81''in altında olduğundan **iflas (sıkıntı) bölgesi**.


    **(c)** Cari oran = 4.000 / 2.500 = **1,60**; net işletme sermayesi = 4.000 − 2.500 = **1.500 bin TL**.


    **(d)** X3 dışındaki terimlerin toplamı = 1,2 × 0,15 + 1,4 × 0,20 + 0,6 × 1,20 + 1,15 = 2,33. 3,3 × X3 = 2,99 − 2,33 =
    0,66; X3 = 0,20; FVÖK = 0,20 × 10.000 = **2.000 bin TL** (mevcut 1.500 bin TL''nin üzerinde).


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
