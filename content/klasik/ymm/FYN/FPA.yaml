    bitis: null
  dogrulama:
    python: "S = 12000000\naktif = S / 2\nozk = S / 4\nkvyk = 0.25 * aktif\nuvyk = aktif - ozk - kvyk\ndv = 0.75 * (ozk +\
      \ uvyk)\ndonen = aktif - dv\nhd = 0.30 * kvyk\nX = (kvyk - 0.0625 * donen) / (1 - 0.0625)\nstok = donen - X\nalacak\
      \ = X - hd\nsmm = S * 0.70\nnk = 0.20 * ozk\nvok = nk / 0.75\nfaiz = vok / 4\nfvok = 5 * faiz\nfg = S - smm - fvok\n\
      sonuc = {\"aktif\": aktif, \"ozk\": ozk, \"kvyk\": kvyk, \"uvyk\": uvyk, \"dv\": dv, \"donen\": donen, \"hd\": hd,\n\
      \         \"stok\": round(stok, 2), \"alacak\": round(alacak, 2), \"smm\": smm, \"faiz\": faiz, \"fvok\": fvok, \"fg\"\
      : fg,\n         \"net_kar\": nk, \"cari\": donen / kvyk, \"asit\": round((donen - stok) / kvyk, 4),\n         \"tahsil_gun\"\
      : round(alacak / (S / 360), 2), \"stok_devir\": round(smm / stok, 4),\n         \"borc_orani\": (kvyk + uvyk) / aktif,\
      \ \"roa\": nk / aktif}\n"
