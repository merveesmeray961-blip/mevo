    | Kısa vadeli yabancı kaynaklar (KVYK) | 5.000.000 TL |

    | Uzun vadeli yabancı kaynaklar | 6.000.000 TL |

    | Özkaynak (defter değeri): ödenmiş sermaye 6.000.000 TL, dağıtılmamış kârlar 3.000.000 TL | 9.000.000 TL |

    | Net satışlar | 24.000.000 TL |

    | Faiz gideri | 800.000 TL |

    | Faiz karşılama oranı (FVÖK / faiz gideri) | 2,5 |

    | Dolaşımdaki pay sayısı / borsa fiyatı | 2.000.000 adet / 4,40 TL |


    Altman Z skoru (halka açık imalat işletmeleri): Z = 1,2 X1 + 1,4 X2 + 3,3 X3 + 0,6 X4 + 1,0 X5; X1 = net işletme sermayesi
    / toplam aktif, X2 = dağıtılmamış kârlar / toplam aktif, X3 = FVÖK / toplam aktif, X4 = özkaynağın piyasa değeri / toplam
    borç, X5 = net satışlar / toplam aktif. Bölgeler: Z < 1,81 yüksek iflas riski; 1,81 ≤ Z ≤ 2,99 gri bölge; Z > 2,99 güvenli
    bölge.


    **İstenenler:**


    (a) Dönen varlıkları, net işletme sermayesini ve FVÖK''ü bulunuz; X1–X5 oranlarını ve Z skorunu hesaplayarak şirketin
    hangi bölgede olduğunu belirtiniz. (10 puan)


    (b) Şirket, borsa fiyatından 3.000.000 TL tutarında yeni pay ihraç edecek (ihraçtan sonra pay fiyatı değişmeyecek) ve
    elde edilen tutarın tamamıyla kısa vadeli banka borcunu kapatacaktır. FVÖK ve satışlar değişmeyecektir. Yeni cari oranı
    ve Z skorunu hesaplayınız; bölge değişip değişmediğini belirtiniz. (7 puan)


    (c) (b) şıkkındaki yapı korunurken, diğer bileşenler sabitken Z skorunun güvenli bölge alt sınırı olan 2,99''a ulaşması
    için yıllık net satışların en az ne olması gerektiğini bulunuz. (4 puan)


    (d) Altman Z modelinin sınırlılıklarını; X4 bileşeninin halka açık olmayan bir şirket için nasıl uyarlandığını da belirterek
    açıklayınız. (4 puan)

    '
  cozum: '**(a) Mevcut durum**


    - Dönen varlıklar = 1,4 × 5.000.000 = 7.000.000 TL; NİS = 7.000.000 − 5.000.000 = 2.000.000 TL

    - FVÖK = 2,5 × 800.000 = 2.000.000 TL

    - Toplam borç = 5.000.000 + 6.000.000 = 11.000.000 TL; özkaynak piyasa değeri = 2.000.000 × 4,40 = 8.800.000 TL


    | Oran | Hesap | Değer | Katsayı × değer |

    |---|---|---|---|

    | X1 | 2.000.000 / 20.000.000 | 0,10 | 0,120 |

    | X2 | 3.000.000 / 20.000.000 | 0,15 | 0,210 |

    | X3 | 2.000.000 / 20.000.000 | 0,10 | 0,330 |

    | X4 | 8.800.000 / 11.000.000 | 0,80 | 0,480 |

    | X5 | 24.000.000 / 20.000.000 | 1,20 | 1,200 |

    | **Z** | | | **2,340** |


    1,81 ≤ 2,34 ≤ 2,99 → şirket **gri bölgededir**; iflas riski belirsizdir, yakından izlenmelidir.


    **(b) Pay ihracı ve borç kapatma**


    Nakit girişi ve borç ödemesi aynı tutarda olduğundan toplam aktif 20.000.000 TL''de kalır.

    - KVYK = 2.000.000 TL; dönen varlıklar 7.000.000 TL; yeni cari oran = 7.000.000 / 2.000.000 = **3,5**

    - X1 = 5.000.000 / 20.000.000 = 0,25 → 1,2 × 0,25 = 0,300

    - X2 ve X3 değişmez: 0,210 ve 0,330

    - X4 = (8.800.000 + 3.000.000) / 8.000.000 = 1,475 → 0,6 × 1,475 = 0,885

    - X5 = 1,200

    - **Z = 0,300 + 0,210 + 0,330 + 0,885 + 1,200 = 2,925**


    Z artmıştır ancak 2,99''un altında kaldığından şirket **hâlâ gri bölgededir**.


    **(c) Gerekli satış (ters çözüm)**


    Gerekli artış = 2,99 − 2,925 = 0,065; X5''in katsayısı 1 olduğundan ΔX5 = 0,065 → ΔSatış = 0,065 × 20.000.000 = 1.300.000
    TL.

    Gerekli net satışlar = 24.000.000 + 1.300.000 = **25.300.000 TL** (aktif devir hızı 1,265).


    **(d) Sınırlılıklar**


    - Katsayılar belirli bir dönemin ve ülkenin (ABD imalat işletmeleri) verisinden istatistiksel olarak türetilmiştir; farklı
    ülke, sektör ve enflasyon koşullarında doğrudan uygulanması yanıltıcı olabilir.

    - Muhasebe verisine dayanır; muhasebe politikaları, yeniden değerleme ve enflasyon etkisi oranları bozar. Nakit akışları
    ve bilanço dışı yükümlülükler dikkate alınmaz.

    - Gri bölge geniştir; model kesin sonuç değil uyarı işlevi görür ve diğer analizlerle birlikte kullanılmalıdır.

    - Halka açık olmayan şirket için revize modelde (Z'') X4''te özkaynağın piyasa değeri yerine **defter değeri** kullanılır
    ve katsayılar ile sınır değerler buna göre yeniden belirlenmiştir; imalat dışı şirketler için ayrıca X5''in çıkarıldığı
    (Z'''') model kullanılır.

    '
