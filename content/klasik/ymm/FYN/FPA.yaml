- id: YMM-FYN-FPA-K030
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - proforma tablolar ve dış finansman ihtiyacı
  - içsel ve sürdürülebilir büyüme oranı
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Karadeniz Tekstil A.Ş.''nin 2025 satışları 2.000.000 TL, toplam varlıkları 1.200.000 TL''dir (tamamı satışla
    orantılı). Satışla kendiliğinden artan borçlar 120.000 TL''dir; uzun vadeli borç ve özkaynak dışında kalan finansman kaynağı
    yoktur. Net kâr marjı %8, kâr dağıtım oranı %25''tir (geçmiş yıl zararı ve kanuni yedek akçe etkisi dikkate alınmayacaktır).
    Net kâr, yeni yıl satışları üzerinden hesaplanır.


    **İstenenler:**


    (a) Satış büyümesinin %10, %20 ve %30 olması hâllerinde dış finansman ihtiyacını (EFN) hesaplayınız. (7 puan)


    (b) EFN''nin sıfır olduğu büyüme oranını (dış finansman gerektirmeyen en yüksek büyüme) bulunuz. (6 puan)


    (c) Kâr dağıtım oranı %50''ye çıkarılırsa EFN = 0 büyüme oranını ve %20 büyümedeki EFN''yi bulunuz. (6 puan)


    (d) Sonuçlara göre kâr dağıtım politikası ile büyüme ve dış finansman arasındaki ilişkiyi yorumlayınız. (3 puan)

    '
  cozum: 'EFN = (varlık − kendiliğinden borç) × g − net kâr marjı × S0 × (1 + g) × (1 − dağıtım oranı).


    **(a)** g = %10: EFN = **-24.000 TL**; g = %20: EFN = **72.000 TL**; g = %30: EFN = **168.000 TL**. (Negatif değer fazla
    fon anlamına gelir.)


    **(b)** EFN = 0 için g = 120.000 / (1.080.000 − 120.000) = **%12,50**.


    **(c)** Net kâr × tutma oranı artık 0,08 × 2.000.000 × 0,50 = 80.000 olur. g = 80.000 / (1.080.000 − 80.000) = **%8**.
    %20 büyümede EFN = **120.000 TL**.


