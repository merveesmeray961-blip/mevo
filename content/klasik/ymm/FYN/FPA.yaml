      \ 24000000 / A)\nsatis_gerekli = 24000000 + (2.99 - z2) * A\nsonuc = {\"donen\": donen, \"nis\": nis, \"fvok\": fvok,\
      \ \"z1\": round(z1, 4), \"cari_yeni\": donen / 2000000,\n         \"z2\": round(z2, 4), \"satis_gerekli\": round(satis_gerekli,\
