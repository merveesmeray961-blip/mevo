    (b) Bütçe satış düzeyinde FVÖK''ü, güvenlik marjını (oran olarak) ve faaliyet kaldıracı derecesini hesaplayınız; faaliyet
    kaldıracı ile güvenlik marjı arasındaki ilişkiyi gösteriniz. (5 puan)


    (c) Pazarlama bölümü bir kampanya önermektedir: Z''nin fiyatı 350 TL''ye indirilecek, sabit faaliyet giderleri 500.000
    TL artacak; toplam satış miktarı 100.000 adette kalırken karma 4 : 2 : 4 (X : Y : Z) olacaktır. Kampanyanın FVÖK''e etkisini
    ve yeni başabaş noktasını (ürün bazında miktar ve toplam tutar) hesaplayarak kampanyanın kabul edilip edilmeyeceğine karar
    veriniz. (7 puan)


    (d) Kampanya uygulanmazsa (mevcut fiyat, karma ve sabit giderlerle) 3.285.000 TL vergi sonrası net kâr elde etmek için
    gerekli ürün bazında satış miktarlarını ve toplam satış tutarını hesaplayınız. (5 puan)

    '
  cozum: 'Birim katkı payları: X 40, Y 60, Z 200 TL. Bir "paket" = 5 X + 3 Y + 2 Z.


    - Paket katkı payı = 5 × 40 + 3 × 60 + 2 × 200 = 200 + 180 + 400 = **780 TL**

    - Paket satış tutarı = 5 × 100 + 3 × 200 + 2 × 400 = **1.900 TL**


    **(a) Başabaş noktası**


    Başabaş paket sayısı = 3.900.000 / 780 = 5.000 paket → **X 25.000, Y 15.000, Z 10.000 adet**; tutar = 5.000 × 1.900 =
    **9.500.000 TL**.

    Doğrulama: ağırlıklı KPO = 780 / 1.900 = 0,410526; 3.900.000 / 0,410526 = 9.500.000 TL.


    **(b) Bütçe düzeyi** (10.000 paket)


    - Satış = 19.000.000 TL; KP = 7.800.000 TL; FVÖK = 7.800.000 − 3.900.000 = **3.900.000 TL**

    - Güvenlik marjı = (19.000.000 − 9.500.000) / 19.000.000 = **%50**

    - FAKD = KP / FVÖK = 7.800.000 / 3.900.000 = **2** = 1 / güvenlik marjı (1 / 0,50). Satış başabaşa yaklaştıkça güvenlik
    marjı küçülür, faaliyet kaldıracı büyür.


    **(c) Kampanya**


    Yeni Z katkı payı = 350 − 200 = 150 TL. Miktarlar: X 40.000, Y 20.000, Z 40.000.


    | Ürün | Miktar | Birim KP | KP (TL) | Satış (TL) |

    |---|---|---|---|---|

    | X | 40.000 | 40 | 1.600.000 | 4.000.000 |

    | Y | 20.000 | 60 | 1.200.000 | 4.000.000 |

    | Z | 40.000 | 150 | 6.000.000 | 14.000.000 |

    | Toplam | 100.000 | | 8.800.000 | 22.000.000 |


    - Yeni FVÖK = 8.800.000 − 4.400.000 = **4.400.000 TL**; mevcut 3.900.000 TL''ye göre **+500.000 TL** → kampanya **kabul
    edilir**.

    - Yeni paket (4 X + 2 Y + 4 Z) KP = 160 + 120 + 600 = 880 TL; paket satışı = 400 + 400 + 1.400 = 2.200 TL

    - Başabaş = 4.400.000 / 880 = 5.000 paket → **X 20.000, Y 10.000, Z 20.000 adet**; tutar **11.000.000 TL** (güvenlik marjı
    yine %50)


    Başabaş tutarının yükselmesi tek başına ret nedeni değildir; karma yüksek katkı paylı Z''ye kaydığı için toplam katkı
    payı sabit gider artışından fazla artmaktadır.


    **(d) Hedef kâr**


    Vergi öncesi kâr = 3.285.000 / 0,75 = 4.380.000 TL; gerekli KP = 3.900.000 + 300.000 + 4.380.000 = 8.580.000 TL.

    Paket sayısı = 8.580.000 / 780 = 11.000 → **X 55.000, Y 33.000, Z 22.000 adet**; toplam satış = 11.000 × 1.900 = **20.900.000
    TL**.

    '
