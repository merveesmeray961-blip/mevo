- id: YMM-FYN-FPA-K003
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - proforma tablolar ve dış finansman ihtiyacı
  - içsel ve sürdürülebilir büyüme oranı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Marmara Ambalaj A.Ş.''nin 2025 yılı net satışları 20.000.000 TL, net kârı 1.200.000 TL''dir; kârın %50''si dağıtılmıştır.
    31.12.2025 tarihli bilanço (kâr dağıtımı sonrası) aşağıdadır (TL):


    | Aktif | Tutar | Pasif | Tutar |

    |---|---|---|---|

    | Hazır değerler | 1.000.000 | Ticari borçlar | 2.000.000 |

    | Ticari alacaklar | 2.500.000 | Ödenecek giderler ve vergiler | 1.000.000 |

    | Stoklar | 3.500.000 | Kısa vadeli banka kredileri | 1.500.000 |

    | Maddi duran varlıklar (net) | 5.000.000 | Uzun vadeli banka kredileri | 1.500.000 |

    | | | Ödenmiş sermaye | 4.000.000 |

    | | | Geçmiş yıllar kârları | 2.000.000 |

    | **Toplam** | **12.000.000** | **Toplam** | **12.000.000** |


    Şirket 2026 yılında satışlarının %25 artarak 25.000.000 TL olmasını planlamaktadır. Varsayımlar:

    - Maddi duran varlıklar tam kapasiteyle kullanılmaktadır; tüm aktif kalemleri satışlarla orantılı artacaktır.

    - Ticari borçlar ile ödenecek giderler ve vergiler satışlarla orantılı (kendiliğinden) artacaktır; banka kredileri ve
    ödenmiş sermaye ancak yönetim kararıyla değişir.

    - Net kâr marjı (%6) ve kâr dağıtım oranı (%50) 2026 yılında da aynı kalacaktır.

    - Büyüme oranlarında ROA ve ROE, 2025 net kârının 2025 sonu aktif ve özkaynak tutarlarına oranıdır.


    **İstenenler:**


    (a) Dış finansman ihtiyacını (DFİ) satış yüzdesi formülüyle hesaplayınız; 2026 proforma bilançosunu (finansman kararı
    öncesi) düzenleyerek aynı tutarı tablodan da gösteriniz. (9 puan)


    (b) Kredi sözleşmesindeki kısıta göre toplam yabancı kaynakların toplam aktife oranı %50''yi aşamaz. Finansman açığı önce
    uzun vadeli banka kredisiyle bu sınıra kadar, kalanı nakdi sermaye artırımıyla karşılanacaktır. Kaynak dağılımını ve son
    proforma pasifi gösteriniz. (5 puan)


    (c) Şirketin içsel büyüme oranını ve sürdürülebilir büyüme oranını hesaplayınız; her iki oranın hangi finansman varsayımına
    dayandığını açıklayınız. (6 puan)


    (d) Net kâr marjı ve borç/özkaynak oranı değişmeden, yeni pay ihraç etmeden %25 büyümenin sürdürülebilmesi için kâr dağıtım
    oranının ne olması gerektiğini ters çözümle bulunuz; bu dağıtım oranıyla 2026''daki DFİ''yi ve borç/özkaynak oranını hesaplayarak
    sonucu doğrulayınız. (5 puan)

    '
  cozum: '**(a) Dış finansman ihtiyacı**


    Satışa bağlı aktif / S0 = 12.000.000 / 20.000.000 = 0,60; kendiliğinden artan borç / S0 = 3.000.000 / 20.000.000 = 0,15;
    ΔS = 5.000.000 TL; m = %6; d = %50.


    DFİ = (A / S0) × ΔS − (L / S0) × ΔS − m × S1 × (1 − d)

    = 0,60 × 5.000.000 − 0,15 × 5.000.000 − 0,06 × 25.000.000 × 0,50

    = 3.000.000 − 750.000 − 750.000 = **1.500.000 TL**


    Proforma bilanço (31.12.2026, finansman kararı öncesi):


    | Aktif | TL | Pasif | TL |

    |---|---|---|---|

    | Hazır değerler | 1.250.000 | Ticari borçlar | 2.500.000 |

    | Ticari alacaklar | 3.125.000 | Ödenecek giderler ve vergiler | 1.250.000 |

    | Stoklar | 4.375.000 | KV banka kredileri | 1.500.000 |

    | Maddi duran varlıklar | 6.250.000 | UV banka kredileri | 1.500.000 |

    | | | Ödenmiş sermaye | 4.000.000 |

    | | | Geçmiş yıllar kârları (2.000.000 + 750.000) | 2.750.000 |

    | **Toplam** | **15.000.000** | **Toplam** | **13.500.000** |


    Açık = 15.000.000 − 13.500.000 = **1.500.000 TL** (formülle aynı). Dağıtılmayan kâr = 25.000.000 × 0,06 × 0,50 = 750.000
    TL.


    **(b) Kaynak dağılımı**


    - Azami yabancı kaynak = 0,50 × 15.000.000 = 7.500.000 TL

    - Mevcut proforma yabancı kaynak = 2.500.000 + 1.250.000 + 1.500.000 + 1.500.000 = 6.750.000 TL

    - Ek UV kredi = 7.500.000 − 6.750.000 = **750.000 TL**; nakdi sermaye artırımı = 1.500.000 − 750.000 = **750.000 TL**


    Son proforma pasif: ticari borçlar 2.500.000; ödenecek giderler ve vergiler 1.250.000; KV krediler 1.500.000; UV krediler
    2.250.000; ödenmiş sermaye 4.750.000; geçmiş yıllar kârları 2.750.000; toplam 15.000.000 TL (yabancı kaynak oranı tam
    %50).


    **(c) Büyüme oranları** (b = 1 − d = 0,50)


    - ROA = 1.200.000 / 12.000.000 = %10; ROE = 1.200.000 / 6.000.000 = %20

    - İçsel büyüme = ROA × b / (1 − ROA × b) = 0,05 / 0,95 = **%5,26**. Hiç dış kaynak (kendiliğinden artan borçlar dışında
    yeni kredi ve pay) kullanılmadan, yalnız dağıtılmayan kârla ulaşılabilecek en yüksek büyümedir.

    - Sürdürülebilir büyüme = ROE × b / (1 − ROE × b) = 0,10 / 0,90 = **%11,11**. Yeni pay ihraç edilmeden, borç/özkaynak
    oranı sabit tutularak (dağıtılmayan kârla birlikte orantılı yeni borç alınarak) ulaşılabilecek en yüksek büyümedir.

    - Planlanan %25 büyüme her iki oranı da aştığı için (b)''deki gibi ek borç ve yeni pay gerekir.


    **(d) Ters çözüm**


    g* = ROE × b / (1 − ROE × b) = 0,25 → ROE × b = 0,25 / 1,25 = 0,20 → b = 0,20 / 0,20 = 1 → **dağıtım oranı d = %0** (kârın
    tamamı alıkonulmalıdır).


    Doğrulama (d = 0): dağıtılmayan kâr = 0,06 × 25.000.000 = 1.500.000 TL; DFİ = 3.000.000 − 750.000 − 1.500.000 = **750.000
    TL**. Açık tamamen borçla kapatılırsa yabancı kaynak = 6.750.000 + 750.000 = 7.500.000 TL; özkaynak = 6.000.000 + 1.500.000
    = 7.500.000 TL; borç/özkaynak = **1** (2025''teki 6.000.000 / 6.000.000 = 1 ile aynı). Yeni pay gerekmeden ve kaldıraç
    değişmeden %25 büyüme finanse edilmiş olur.

    '
