    **(c)** Borç oranı: 2024 = **%50**; 2025 = **%60**. Faiz karşılama (FVÖK / faiz): 2024 = **4**; 2025 = **2**.


    **(d)** Net kâr 2024 = (800 − 200) × 0,75 = 450; 2025 = (720 − 360) × 0,75 = 270. 2025: net kâr marjı = **%3**; ROA =
    270 / 5.000 = **%5,40**; özkaynak = 2.000 → ROE = **%13,50**. 2024 değerleri: marj %5,625, ROA %11,25, ROE %22,50. Satışlar
