  soru: '**Olay:** Çınar Gıda A.Ş.''nin 2025 yılı bilgileri aşağıdadır (TL). Tüm satışlar ve alımlar vadelidir; satışların
    maliyeti ve işletme giderleri nakit çıkışı gerektirir (amortisman satışların maliyetine dahil değildir). Ödenen vergi
    ve faiz, vergi gideri ve faiz giderine eşittir; faiz ödemeleri esas faaliyetlerden sınıflanmaktadır.


    | Kalem | Tutar |

    |---|---|

    | Net satışlar | 5.000.000 |

    | Satışların maliyeti | 3.000.000 |

    | Faaliyet giderleri (nakit) | 700.000 |

    | Amortisman gideri | 150.000 |

    | Faiz gideri | 100.000 |

    | Vergi gideri | 150.000 |

    | Ticari alacaklardaki artış | 100.000 |

    | Stoklardaki artış | 50.000 |

    | Ticari borçlardaki azalış | 50.000 |

    | Kısa vadeli yabancı kaynaklar (dönem sonu) | 1.000.000 |


    **İstenenler:**


    (a) Müşterilerden yapılan nakit tahsilatı ile tedarikçilere yapılan alım ödemesini bulunuz. (6 puan)


    (b) Doğrudan yöntemle faaliyetlerden nakit akışını hesaplayınız ve dolaylı yöntem sonucuyla doğrulayınız. (7 puan)


    (c) Faaliyetlerden nakit akışının KVB''yi ve satışları karşılama oranlarını hesaplayınız. (5 puan)


    (d) Nakit esaslı faiz karşılama oranını ((faaliyet nakit akışı + faiz + vergi) / faiz) bulunuz. (4 puan)

    '
  cozum: '**(a)** Tahsilat = satışlar − alacak artışı = 5.000.000 − 100.000 = **4.900.000 TL**. Alım ödemesi = satışların
    maliyeti + stok artışı + ticari borç azalışı = 3.000.000 + 50.000 + 50.000 = **3.100.000 TL**.


    **(b)** Doğrudan yöntem: tahsilat 4.900.000 − alım ödemesi 3.100.000 − faaliyet giderleri 700.000 − faiz 100.000 − vergi
    150.000 = **850.000 TL**.

    Dolaylı yöntem: net kâr (1.050.000 − 150.000 = 900.000) + amortisman 150.000 − alacak artışı 100.000 − stok artışı 50.000
    − ticari borç azalışı 50.000 = **850.000 TL**. İki yöntem aynı sonucu verir.


    **(c)** KVB''yi karşılama = 850.000 / 1.000.000 = **0,85**; satışlara oranı = 850.000 / 5.000.000 = **%17**.


    **(d)** (850.000 + 100.000 + 150.000) / 100.000 = **11** kat.


