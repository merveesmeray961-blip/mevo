  soru: '**Olay:** Mavi Cam A.Ş. 2025 yılında 80.000 adet ürünü birim fiyat 100 TL, birim değişken maliyet 60 TL ile satmıştır.
    Sabit giderler 1.200.000 TL, faiz giderleri 400.000 TL, kurumlar vergisi oranı %25 ve dolaşımdaki pay sayısı 400.000 adettir.


    **İstenenler:**


    (a) Faaliyet, finansal ve birleşik kaldıraç derecelerini hesaplayınız. (6 puan)


    (b) Satış adedi %10 artarsa pay başına kazancı (PBK) doğrudan hesaplayarak bulunuz ve artışı birleşik kaldıraç derecesiyle
    doğrulayınız. (6 puan)


    (c) Faiz giderlerini karşılayan (FVK = 0) başabaş satış adedini bulunuz. (4 puan)


    (d) Şirket 400.000 TL faizli borcun bir kısmını kapatıp faiz giderini 300.000 TL''ye indirmek için pay sayısını 500.000
    adede çıkarırsa (satışlar sabit) yeni PBK''yi ve finansal kaldıraç derecesini bulunuz. (6 puan)

    '
  cozum: 'Katkı payı = 80.000 × (100 − 60) = 3.200.000 TL; FVÖK = 3.200.000 − 1.200.000 = 2.000.000 TL; FVK = 2.000.000 −
    400.000 = 1.600.000 TL; net kâr = 1.600.000 × 0,75 = 1.200.000 TL; PBK = 1.200.000 / 400.000 = 3 TL.


    **(a)** DOL = 3.200.000 / 2.000.000 = **1,60**; DFL = 2.000.000 / 1.600.000 = **1,25**; DCL = 1,60 × 1,25 = **2**.


    **(b)** Yeni adet = 88.000; FVÖK = 88.000 × 40 − 1.200.000 = 2.320.000 TL; net kâr = (2.320.000 − 400.000) × 0,75 = 1.440.000
    TL; PBK = **3,60 TL**. Artış = 3,60 / 3 − 1 = **%20** = %10 × DCL (2) ile uyumludur.


    **(c)** Q = (1.200.000 + 400.000) / 40 = **40.000 adet**.


    **(d)** Net kâr = (2.000.000 − 300.000) × 0,75 = 1.275.000 TL; PBK = 1.275.000 / 500.000 = **2,55 TL**; DFL = 2.000.000
    / (2.000.000 − 300.000) = **1,18**. Borcun azaltılması finansal riski düşürmüş, ancak pay sayısı arttığından PBK 3 TL''den
    2,55 TL''ye düşmüştür. (Not: Borç ortaklardan veya ortaklarla ilişkili kişilerden sağlanmışsa, hesap dönemi içinde özkaynağın
    üç katını aşan kısmı örtülü sermaye sayılır.)


    **Mevzuat dayanağı:** KVK md. 12/1 uyarınca ortaklardan veya ortaklarla ilişkili kişilerden temin edilen borçların, hesap
    dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı örtülü sermaye sayılır.

    '
