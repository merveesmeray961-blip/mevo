    1,5''tir. Şirket net kârının %50''sini kâr payı olarak dağıtmaktadır. Yönetim, dış kaynaktan pay ihracı yapmadan ve sermaye
    yapısını (borç/özkaynak oranını) koruyarak satışları %25 büyütmeyi planlamaktadır. (Bu soruda kanuni yedek akçe ayırma
    etkisi dikkate alınmayacak, ROE dönem sonu özkaynak üzerinden hesaplanacaktır.)


    **İstenenler:**


    (a) Mevcut ROE''yi ve sürdürülebilir büyüme oranını hesaplayınız. (5 puan)


    (b) Kâr payı hiç dağıtılmasa (tutma oranı %100) ulaşılabilecek en yüksek sürdürülebilir büyüme oranı nedir? (5 puan)


    (c) %25 büyümeyi yakalamak için, kâr dağıtım oranı %50 sabitken gereken ROE''yi; ROE sabitken gereken kâr dağıtım oranını
    belirleyiniz ve hedefin mümkün olup olmadığını yorumlayınız. (7 puan)


    (d) Aktif devir hızı ve özkaynak çarpanı 2,0 olursa (c) şıkkındaki ROE için gereken net kâr marjını bulunuz. (5 puan)

    '
