- id: YMM-FYN-FPA-K001
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - oran analizi ve DuPont
  - kaldıraç dereceleri (faaliyet; finansal; birleşik)
  - kâr payı politikası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Toros Sanayi A.Ş.''nin son yıla ait özet verileri aşağıdadır (tutarlar TL):


    | Gelir tablosu | Tutar |

    |---|---|

    | Satışlar | 5.000.000 |

    | Değişken giderler | (3.000.000) |

    | Sabit faaliyet giderleri (amortisman dahil) | (1.000.000) |

    | Faiz ve vergi öncesi kâr (FVÖK) | 1.000.000 |

    | Faiz gideri | (200.000) |

    | Vergi öncesi kâr | 800.000 |

    | Vergi (%20) | (160.000) |

    | Net kâr | 640.000 |


    Toplam aktifler 4.000.000 TL, özkaynaklar 1.600.000 TL, dolaşımdaki pay sayısı 320.000''dir. Şirketin imtiyazlı payı yoktur.


    **İstenenler:**


    (a) Özkaynak kârlılığını DuPont yaklaşımıyla (net kâr marjı, aktif devir hızı, özkaynak çarpanı) ayrıştırarak hesaplayınız.
    (6 puan)


    (b) Faaliyet, finansal ve birleşik kaldıraç derecelerini hesaplayınız. Gelecek yıl satışların %20 düşeceği tahmin edilmektedir;
    maliyet yapısı ve faiz gideri değişmezse FVÖK''ü ve pay başına kazancı (PBK) kaldıraç derecelerini kullanarak bulunuz
    ve doğrudan hesapla kontrol ediniz. (8 puan)


    (c) Şirket artık kâr payı politikası izlemektedir. Gelecek yılın yatırım bütçesi 1.000.000 TL''dir ve şirket mevcut özkaynak
    çarpanını hedef sermaye yapısı olarak korumak istemektedir. Bu yılın kârından dağıtılacak toplam kâr payını, pay başına
    kâr payını ve dağıtım oranını hesaplayınız. (5 puan)


    (d) Faaliyet başabaş satış tutarını ve PBK''nın sıfır olduğu satış tutarını hesaplayınız; iki tutar arasındaki farkın
    nedenini kaldıraç kavramıyla açıklayınız. (6 puan)

    '
  cozum: '**(a) DuPont ayrıştırması**


    Net kâr marjı = 640.000 / 5.000.000 = **%12,8**


    Aktif devir hızı = 5.000.000 / 4.000.000 = **1,25**


    Özkaynak çarpanı = 4.000.000 / 1.600.000 = **2,5**


    Özkaynak kârlılığı = 0,128 × 1,25 × 2,5 = **%40** (kontrol: 640.000 / 1.600.000 = %40; aktif kârlılığı %16)


    **(b) Kaldıraç dereceleri**


    Katkı payı = 5.000.000 − 3.000.000 = 2.000.000 TL


    FKD = 2.000.000 / 1.000.000 = **2**


    FinKD = 1.000.000 / (1.000.000 − 200.000) = **1,25**


    BKD = 2 × 1,25 = **2,5**


    Satışlar %20 düşerse: FVÖK %20 × 2 = %40 düşer → 1.000.000 × 0,60 = **600.000 TL**; PBK %20 × 2,5 = %50 düşer. Mevcut
    PBK = 640.000 / 320.000 = 2 TL → yeni PBK = **1 TL**.


    Doğrudan kontrol: Satışlar 4.000.000; değişken giderler 2.400.000; FVÖK = 4.000.000 − 2.400.000 − 1.000.000 = 600.000;
    VÖK = 400.000; net kâr = 320.000; PBK = 320.000 / 320.000 = 1 TL. ✔


    **(c) Artık kâr payı**


    Özkaynak çarpanı 2,5 → özkaynak / aktif = 1 / 2,5 = %40 (hedef yapı: %40 özkaynak, %60 borç).


    Yatırımın özkaynakla karşılanacak kısmı = 1.000.000 × %40 = 400.000 TL


    Dağıtılacak kâr payı = 640.000 − 400.000 = **240.000 TL**


    Pay başına kâr payı = 240.000 / 320.000 = **0,75 TL**; dağıtım oranı = 240.000 / 640.000 = **%37,5**


    **(d) Başabaş noktaları**


    Katkı payı oranı = 2.000.000 / 5.000.000 = %40


    Faaliyet başabaşı (FVÖK = 0) = 1.000.000 / 0,40 = **2.500.000 TL**


    PBK = 0 için FVÖK faiz giderini karşılamalıdır: (1.000.000 + 200.000) / 0,40 = **3.000.000 TL**


    Fark (500.000 TL), sabit finansman gideri olan faizden kaynaklanır. Faaliyet kaldıracı sabit faaliyet giderlerinden, finansal
    kaldıraç sabit finansman giderinden doğar; faiz gideri, PBK''yı sıfırlayan satış düzeyini yukarı çeker. Mevcut satışların
    faaliyet başabaşından %50 yukarıda olması (güvenlik payı %50) FKD = 1 / 0,50 = 2 sonucuyla tutarlıdır.

    '
  puanlama:
  - olcut: (a) Net kâr marjı %12,8, aktif devir hızı 1,25, özkaynak çarpanı 2,5
    puan: 4
  - olcut: (a) Özkaynak kârlılığı %40
    puan: 2
  - olcut: (b) FKD 2, FinKD 1,25, BKD 2,5
    puan: 3
  - olcut: (b) Kaldıraçla FVÖK 600.000 TL ve PBK 1 TL
    puan: 3
  - olcut: (b) Doğrudan hesapla kontrol
    puan: 2
  - olcut: (c) Hedef özkaynak oranı %40 ve alıkonulacak kâr 400.000 TL
    puan: 2
  - olcut: (c) Kâr payı 240.000 TL, pay başına 0,75 TL, dağıtım oranı %37,5
    puan: 3
  - olcut: (d) Faaliyet başabaşı 2.500.000 TL ve PBK sıfır noktası 3.000.000 TL
    puan: 4
  - olcut: (d) Farkın faiz (finansal kaldıraç) ile açıklanması
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — finansal analiz, kaldıraç ve kâr payı politikası
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 's = 5000000.0

      dg = 3000000.0

      sg = 1000000.0

      faiz = 200000.0

      t = 0.20

      aktif = 4000000.0

      ozk = 1600000.0

      pay = 320000.0

      fvok = s - dg - sg

      nk = (fvok - faiz) * (1 - t)

      marj = nk / s

      devir = s / aktif

      carpan = aktif / ozk

      roe = marj * devir * carpan

      fkd = (s - dg) / fvok

      finkd = fvok / (fvok - faiz)

      bkd = fkd * finkd

      s2 = s * 0.8

      fvok2 = s2 - dg / s * s2 - sg

      pbk1 = nk / pay

      pbk2 = (fvok2 - faiz) * (1 - t) / pay

      ozk_ihtiyac = 1000000.0 / carpan

      kp = nk - ozk_ihtiyac

      kpo = (s - dg) / s

      sonuc = {"marj": round(marj, 4), "devir": devir, "carpan": carpan, "roe": round(roe, 4), "fkd": fkd, "finkd": finkd,
      "bkd": bkd, "fvok2": fvok2, "pbk1": pbk1, "pbk2": round(pbk2, 4), "kar_payi": kp, "pay_basina_kp": kp / pay, "dagitim":
      kp / nk, "basabas": sg / kpo, "pbk0_satis": (sg + faiz) / kpo}

      '
