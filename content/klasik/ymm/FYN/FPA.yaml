    puan: 7
  - olcut: (c) net nakit değişimi ve dönem sonu bakiye
    puan: 3
  - olcut: (d) faaliyet nakit akışı / yatırım oranı ve yorum
    puan: 4
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 6
    alinti: 'Yatırım faaliyetleri: Uzun vadeli varlıklar ile nakit benzeri olarak nitelendirilmeyen diğer yatırımların edinilmesi
      ve elden çıkarılması faaliyetleridir.'
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 6
    alinti: 'Finansman faaliyetleri: İşletmenin ödenmiş sermayesinin ve borçlanmalarının büyüklüğünde ve birleşiminde değişikliğe
      neden olan faaliyetlerdir.'
