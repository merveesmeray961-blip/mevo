    | Kısa vadeli yabancı kaynaklardaki artış | 40.000 |


    **İstenenler:**


    (a) Faaliyetlerden sağlanan fonu (net işletme sermayesi esaslı) hesaplayınız. (5 puan)


    (b) Fon kaynakları, fon kullanımları ve net işletme sermayesindeki artışı gösteren fon akım tablosunu düzenleyiniz. (7
    puan)


    (c) Net işletme sermayesi artışını dönen varlık ve KVB değişimleriyle doğrulayınız; faaliyetlerden nakit akışını bulunuz.
    (6 puan)


    (d) Nakit akışı yaklaşımıyla toplam net nakit değişiminin, verilen nakit artışıyla uyumlu olduğunu gösteriniz. (4 puan)

    '
  cozum: '**(a)** Faaliyetlerden fon = 240.000 + 60.000 − 10.000 = **290.000 TL** (satış kârı yatırım faaliyetiyle ilgili
    olduğundan çıkarılır).


    **(b)**


    | Fon kaynakları | TL | Fon kullanımları | TL |

    |---|---|---|---|

    | Faaliyetlerden fon | 290.000 | Duran varlık alımı | 220.000 |

    | Duran varlık satışı | 40.000 | Kâr payı ödemesi | 80.000 |

    | Uzun vadeli borç | 150.000 | Borç anapara ödemesi | 50.000 |

    | Sermaye artırımı | 100.000 | | |

    | **Toplam** | **580.000** | **Toplam** | **350.000** |


    Net işletme sermayesi artışı = 580.000 − 350.000 = **230.000 TL**.


    **(c)** Dönen varlık artışı = 40.000 + 120.000 + 110.000 = 270.000 TL; KVB artışı = 40.000 TL; NİS artışı = 270.000 −
    40.000 = **230.000 TL** (tablo ile uyumlu). Faaliyetlerden nakit akışı = 290.000 − 120.000 − 110.000 + 40.000 = **100.000
    TL**.


    **(d)** Yatırım: −220.000 + 40.000; finansman: 150.000 + 100.000 − 80.000 − 50.000. Net nakit değişimi = 100.000 + (−220.000
    + 40.000) + (150.000 + 100.000 − 80.000 − 50.000) = **40.000 TL**; verilen nakit artışı (40.000 TL) ile aynıdır.


