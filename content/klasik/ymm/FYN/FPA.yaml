    sunar**.


    **(d)** Yarı eşiğini aşan zarar = 2.700 − 2.500 = **200 bin TL**. Z'''' skoru ve özkaynak kaybı süreklilik varsayımını
    zayıflatır; yönetim sürekliliğini sürdürebilme gücünü değerlendirmek ve ciddi şüphe doğuran belirsizlikleri açıklamak
    durumundadır; tasfiye niyeti veya gerçekçi alternatif yoksa tablolar süreklilik esasına göre hazırlanmaya devam eder.


