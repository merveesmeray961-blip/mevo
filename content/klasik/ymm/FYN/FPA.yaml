    zarar sebebiyle karşılıksız kaldığı anlaşılırsa yönetim kurulu genel kurulu hemen toplantıya çağırır ve iyileştirici önlemleri
    sunar. TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar; çözümde
