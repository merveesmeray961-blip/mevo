      kmA, kmB, kmC = 0.40, 0.30, 0.20

      sabit = 210_000; hedef = 140_000

      top = satA+satB+satC

      kat = satA*kmA + satB*kmB + satC*kmC

      wkm = kat/top

      bep = sabit/wkm

      gm = (top-bep)/top

      hedef_sat = (sabit+hedef)/wkm

      sA2, sB2, sC2 = 200_000, 400_000, 400_000

      kat2 = sA2*kmA + sB2*kmB + sC2*kmC

      wkm2 = kat2/(sA2+sB2+sC2)

