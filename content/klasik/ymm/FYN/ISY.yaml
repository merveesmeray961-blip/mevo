    **İstenenler:**


    (a) Tahsilat süresindeki ortalama azalmayı (gün), serbest kalan fon tutarını, yıllık getiriyi ve sistemin net faydasını
    hesaplayınız. Sistemin kabul edilebilir en yüksek yıllık maliyetini ve başabaş için gerekli en az gün azalmasını bulunuz.
    (9 puan)


    (b) Her iki fiyat için ekonomik sipariş miktarını (EOQ) hesaplayınız; geçerli sipariş miktarlarını belirleyiniz ve toplam
    yıllık maliyeti (alış + sipariş + taşıma) karşılaştırarak en uygun sipariş miktarını bulunuz. (12 puan)


    (c) Seçilen politikaya göre yeniden sipariş noktasını hesaplayınız. (4 puan)

    '
  cozum: '**(a) Kilit kutusu**


    Günlük ortalama tahsilat = 720.000.000 / 360 = 2.000.000 TL.


    Mevcut ağırlıklı ortalama süre = %60 × 6 + %40 × 4 = **5,2 gün**; sistemle 2 gün → azalma = **3,2 gün**.


    Serbest kalan fon = 2.000.000 × 3,2 = **6.400.000 TL**; yıllık getiri = 6.400.000 × %40 = **2.560.000 TL**.


    Net fayda = 2.560.000 − 1.800.000 = **760.000 TL** → sistem kurulmalıdır.


    Kabul edilebilir en yüksek yıllık maliyet = 2.560.000 TL. Başabaş için gerekli gün azalması = 1.800.000 / (2.000.000 ×
    %40) = **2,25 gün**.


    **(b) Toplu alım iskontolu EOQ**


    Taşıma maliyeti: 50 TL fiyatta birim başına 10 TL, 48 TL fiyatta 9,6 TL.


    EOQ (50 TL) = √(2 × 45.000 × 250 / 10) = **1.500 adet** → 3.000 adedin altında olduğundan 50 TL fiyatla geçerlidir.


    EOQ (48 TL) = √(2 × 45.000 × 250 / 9,6) = 1.530,93 adet → 3.000 adedin altında kaldığından 48 TL fiyat bu miktarda geçerli
    değildir; iskonto için en az **3.000 adet** sipariş verilmelidir.


    | Alternatif | Alış maliyeti | Sipariş maliyeti | Taşıma maliyeti | Toplam |

    |---|---|---|---|---|

    | Q = 1.500, fiyat 50 | 2.250.000 | 7.500 | 7.500 | **2.265.000** |

    | Q = 3.000, fiyat 48 | 2.160.000 | 3.750 | 14.400 | **2.178.150** |


    Toplu alım iskontosunun sağladığı yıllık tasarruf = 2.265.000 − 2.178.150 = **86.850 TL** → en uygun sipariş miktarı **3.000
    adet**''tir.


    **(c) Yeniden sipariş noktası**


    Günlük tüketim = 45.000 / 360 = 125 adet. ROP = 125 × 12 + 300 = **1.800 adet**.

    '
