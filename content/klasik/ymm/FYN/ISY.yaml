- id: YMM-FYN-ISY-K002
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - nakit yönetimi (Baumol ve Miller-Orr)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir holding, nakit yönetimini iki şirketinde farklı modellerle yürütmektedir.


    **Ana şirket (Baumol modeli):** Yıl içinde düzenli olarak harcanan yıllık nakit ihtiyacı 18.000.000 TL''dir. İhtiyaç,
    menkul kıymet satışıyla karşılanmaktadır; her satış işleminin sabit maliyeti 1.000 TL, menkul kıymetlerin yıllık getirisi
    %40''tır.


    **Bağlı şirket (Miller-Orr modeli):** Nakit akışları rastgele dalgalanmaktadır. Yönetimin belirlediği asgari nakit (alt
    sınır) 200.000 TL; menkul kıymet alım veya satımının işlem başına maliyeti 1.000 TL; günlük net nakit akışlarının standart
    sapması 12.000 TL; günlük faiz oranı %0,05''tir.


    Miller-Orr modelinde: aralık = 3 × (3Fσ² / 4i)^(1/3); dönüş noktası Z = L + aralık / 3; üst sınır H = L + aralık; ortalama
    nakit = (4Z − L) / 3. Not: 216 × 10^12 sayısının küp kökü 60.000''dir.


    **İstenenler:**


    (a) Ana şirket için optimal nakit çekim tutarını, yıllık işlem sayısını, ortalama nakit bakiyesini, yıllık işlem maliyetini,
    fırsat maliyetini ve toplam maliyeti hesaplayınız. (7 puan)


    (b) Gelecek yıl işlem maliyeti ve faiz oranı değişmeden ana şirketin optimal çekim tutarının 450.000 TL olacağı hesaplanmıştır.
    Gelecek yılın yıllık nakit ihtiyacını ve bu yıla göre artış oranını ters çözümle bulunuz; nakit ihtiyacı ile optimal çekim
    tutarı arasındaki ilişkiyi açıklayınız. (5 puan)


    (c) Bağlı şirket için aralığı, dönüş noktasını, üst sınırı ve ortalama nakit bakiyesini hesaplayınız. Nakit bakiyesi üst
    sınıra ulaştığında ve alt sınıra düştüğünde yapılacak işlemleri tutarlarıyla belirtiniz. (9 puan)


    (d) Bağlı şirketin günlük nakit akışı varyansı 8 katına çıkarsa (diğer veriler aynı) yeni dönüş noktasını, üst sınırı
    ve ortalama nakit bakiyesini bulunuz. (4 puan)

    '
  cozum: '**(a) Baumol modeli** (T = 18.000.000; F = 1.000; i = 0,40)


    - C* = √(2TF / i) = √(2 × 18.000.000 × 1.000 / 0,40) = √90.000.000.000 = **300.000 TL**

    - Yıllık işlem sayısı = T / C* = 18.000.000 / 300.000 = **60**

    - Ortalama nakit = C* / 2 = **150.000 TL**

    - İşlem maliyeti = 60 × 1.000 = **60.000 TL**; fırsat maliyeti = 150.000 × 0,40 = **60.000 TL**

    - Toplam maliyet = **120.000 TL** (optimumda iki maliyet eşittir)


    **(b) Ters çözüm**


    C*² = 2TF / i → T = C*² × i / (2F) = 450.000² × 0,40 / 2.000 = 202.500.000.000 × 0,40 / 2.000 = **40.500.000 TL**

    Artış = 40.500.000 / 18.000.000 − 1 = **%125** (2,25 kat).

    Optimal çekim tutarı nakit ihtiyacının kareköküyle orantılıdır: ihtiyaç 2,25 katına çıkınca C* yalnız √2,25 = 1,5 katına
    çıkmıştır (300.000 → 450.000). Nakit yönetiminde ölçek ekonomisi vardır.


    **(c) Miller-Orr modeli** (L = 200.000; F = 1.000; σ² = 144.000.000; i = 0,0005)


    - 3Fσ² / 4i = 3 × 1.000 × 144.000.000 / (4 × 0,0005) = 432.000.000.000 / 0,002 = 216 × 10^12 → küp kök **60.000**

    - Aralık = 3 × 60.000 = **180.000 TL**

    - Z = 200.000 + 180.000 / 3 = **260.000 TL**

    - H = 200.000 + 180.000 = **380.000 TL** (= 3Z − 2L)

    - Ortalama nakit = (4 × 260.000 − 200.000) / 3 = **280.000 TL**


    İşlemler: Nakit 380.000 TL''ye ulaşınca H − Z = **120.000 TL menkul kıymet alınır**, bakiye 260.000 TL''ye iner. Nakit
    200.000 TL''ye düşünce Z − L = **60.000 TL menkul kıymet satılır**, bakiye 260.000 TL''ye çıkar. Aralıkta iken işlem yapılmaz.


    **(d) Varyansın 8 katına çıkması**


    Aralık varyansın küp köküyle orantılıdır: ∛8 = 2 → yeni aralık = 360.000 TL.

    - Z = 200.000 + 120.000 = **320.000 TL**; H = 200.000 + 360.000 = **560.000 TL**

    - Ortalama nakit = (4 × 320.000 − 200.000) / 3 = **360.000 TL**

    Belirsizlik arttıkça işletme daha geniş bir bant ve daha yüksek ortalama nakit tutar.

    '
  puanlama:
  - olcut: (a) Formül ve C* = 300.000 TL
    puan: 3
  - olcut: (a) İşlem sayısı, ortalama nakit, işlem ve fırsat maliyetleri, toplam 120.000
    puan: 4
  - olcut: (b) T = 40.500.000 TL ve %125 artış
    puan: 3
  - olcut: (b) Karekök ilişkisinin açıklanması
    puan: 2
  - olcut: (c) Aralık 180.000 TL
    puan: 3
  - olcut: (c) Z = 260.000, H = 380.000, ortalama 280.000
    puan: 4
  - olcut: (c) Üst ve alt sınırda yapılacak işlemler ve tutarları
    puan: 2
  - olcut: (d) Yeni aralık ile Z, H ve ortalama nakit
    puan: 4
  kaynaklar:
  - mevzuat: Genel bilgi — Nakit yönetimi (Baumol ve Miller-Orr)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "T, F, i = 18000000, 1000, 0.40\nC = (2 * T * F / i) ** 0.5\nT2 = 450000 ** 2 * i / (2 * F)\nL, s2, gi = 200000,\
      \ 12000 ** 2, 0.0005\naralik = 3 * round((3 * F * s2 / (4 * gi)) ** (1 / 3), 6)\nZ = L + aralik / 3\nH = L + aralik\n\
      ort = (4 * Z - L) / 3\naralik8 = 3 * round((3 * F * 8 * s2 / (4 * gi)) ** (1 / 3), 6)\nZ8 = L + aralik8 / 3\nsonuc =\
      \ {\"C\": round(C, 2), \"islem\": T / C, \"toplam_maliyet\": round(T / C * F + C / 2 * i, 2),\n         \"T2\": T2,\
      \ \"artis\": round(T2 / T - 1, 4), \"aralik\": round(aralik, 2), \"Z\": round(Z, 2),\n         \"H\": round(H, 2), \"\
      ortalama\": round(ort, 2), \"Z8\": round(Z8, 2), \"H8\": round(L + aralik8, 2),\n         \"ortalama8\": round((4 *\
      \ Z8 - L) / 3, 2)}\n"
