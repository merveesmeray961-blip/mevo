  soru: '**Olay:** Çağrı Elektronik A.Ş. bir hammaddeyi yıllık 40.000 adet kullanmaktadır (talep yıl boyunca düzenlidir; 1
    yıl = 360 gün). Sipariş başına maliyet 200 TL, birim başına yıllık stok taşıma maliyeti 4 TL''dir. Tedarik süresi 9 gün,
    emniyet stoku 300 adettir.


    **İstenenler:**


    (a) Ekonomik sipariş miktarını (EOQ), yıllık sipariş sayısını ve EOQ''daki yıllık toplam stok maliyetini (sipariş + taşıma)
