    **Öneri:** Müşterilere "2/10, net 60" koşulunun sunulması. Tahminler: satışlar %10 artacak; satış tutarının %40''ını oluşturan
    müşteriler iskontodan yararlanıp 10. gün, diğerleri 60. gün ödeyecek; şüpheli alacaklar toplam satışların %1,5''ine inecek;
    tahsilat giderleri yıllık 50.000 TL azalacak; yıllık nakit faaliyet giderleri satışlarla orantılı artacak. Kapasite yeterlidir;
    sabit giderler, stok ve borç süreleri değişmeyecektir. Alacaklara bağlanan fonun vergi öncesi yıllık maliyeti %30''dur
    ve alacak yatırımı değişken maliyet esasıyla ölçülür. Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) Önerinin yıllık vergi öncesi ve vergi sonrası net etkisini; ek katkı payı, iskonto maliyeti, alacak yatırımındaki
    değişimin fon maliyeti etkisi, şüpheli alacak ve tahsilat gideri değişimi kalemlerini ayrı ayrı göstererek hesaplayınız
    ve önerinin kabul edilip edilmeyeceğine karar veriniz. (12 puan)


    (b) Mevcut durumda ve öneri uygulandığında nakit dönüşüm süresini ve finanse edilmesi gereken işletme sermayesi tutarını
    (günlük nakit faaliyet gideri × nakit dönüşüm süresi) hesaplayınız. (6 puan)


    (c) İşletme, öneri uygulandıktan sonra bir yıl süreyle 3.000.000 TL kullanılabilir fona ihtiyaç duyacaktır. Banka A, faizi
    kredi başında peşin kesilen %30 faizli ve kredi tutarının %10''u kadar telafi edici (bloke) bakiye şartlı kredi; Banka
    B, faizi vade sonunda ödenen %45 basit faizli, bakiye şartsız kredi teklif etmektedir. Banka A''dan alınması gereken kredi
    tutarını, iki kredinin efektif yıllık maliyetini hesaplayarak seçimi yapınız. (7 puan)

    '
  cozum: '**(a) Kredi politikası analizi**


    Yeni satış = 36.000.000 × 1,10 = 39.600.000 TL; ΔS = 3.600.000 TL.

    Yeni ortalama tahsil süresi = 0,40 × 10 + 0,60 × 60 = **40 gün**.


    | Kalem | Hesap | Etki (TL) |

    |---|---|---|

    | Ek katkı payı | 3.600.000 × (1 − 0,75) | +900.000 |

    | İskonto maliyeti | 39.600.000 × 0,40 × 0,02 | −316.800 |

    | Alacak yatırımı (mevcut) | 36.000.000 × 60 / 360 = 6.000.000 × 0,75 = 4.500.000 | |

    | Alacak yatırımı (öneri) | 39.600.000 × 40 / 360 = 4.400.000 × 0,75 = 3.300.000 | |

    | Serbest kalan fonun maliyet tasarrufu | (4.500.000 − 3.300.000) × 0,30 | +360.000 |

    | Şüpheli alacak değişimi | 36.000.000 × %2 = 720.000 → 39.600.000 × %1,5 = 594.000 | +126.000 |

    | Tahsilat gideri tasarrufu | | +50.000 |

    | **Vergi öncesi net etki** | | **+1.119.200** |

    | Vergi (%25) | | (279.800) |

    | **Vergi sonrası net etki** | | **+839.400** |


    Net etki pozitif olduğundan öneri **kabul edilir**. İskonto, maliyetine rağmen tahsil süresini kısaltarak alacağa bağlanan
    fonu azaltmakta; satış artışı ve şüpheli alacak azalışıyla birlikte kâr artmaktadır.


    **(b) Nakit dönüşüm süresi ve işletme sermayesi gereksinimi**


    | | Mevcut | Öneri |

    |---|---|---|

    | Stokta kalma süresi | 45 | 45 |

    | + Alacak tahsil süresi | 60 | 40 |

    | − Borç ödeme süresi | 30 | 30 |

    | **Nakit dönüşüm süresi** | **75 gün** | **55 gün** |

    | Günlük nakit faaliyet gideri | 27.000.000 / 360 = 75.000 | 29.700.000 / 360 = 82.500 |

    | **Finanse edilecek işletme sermayesi** | 75.000 × 75 = **5.625.000** | 82.500 × 55 = **4.537.500** |


    Satışlar artmasına rağmen finansman gereksinimi 1.087.500 TL azalmaktadır.


    **(c) Kısa vadeli banka kredisi**


    - Banka A: kullanılabilir fon = K × (1 − 0,30 − 0,10) = 0,60K = 3.000.000 → **K = 5.000.000 TL**; peşin faiz 1.500.000
    TL; bloke bakiye 500.000 TL. Efektif maliyet = 1.500.000 / 3.000.000 = **%50**.

    - Banka B: kredi 3.000.000 TL; faiz 3.000.000 × 0,45 = 1.350.000 TL; efektif maliyet = **%45**.


    Nominal faizi daha düşük görünse de peşin faiz ve bloke bakiye nedeniyle A''nın efektif maliyeti daha yüksektir; **Banka
    B seçilir**.

    '
