- id: YMM-FYN-ISY-K001
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - nakit dönüşüm süresi
  - alacak yönetimi ve kredi politikası
  - nakit ve stok yönetimi (EOQ)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ege Endüstri A.Ş.''nin işletme sermayesine ilişkin bilgiler aşağıdadır. Yıl 360 gün kabul edilecektir; vergi dikkate
    alınmayacaktır.


    | Kalem | Mevcut durum |

    |---|---|

    | Yıllık satışlar (tamamı kredili) | 3.600.000 TL |

    | Değişken maliyetler / satışlar | %60 |

    | Ortalama alacak tahsil süresi | 30 gün |

    | Şüpheli alacaklar / satışlar | %1 |

    | Stokta kalma süresi (SMM üzerinden) | 45 gün |

    | Ticari borç ödeme süresi (SMM üzerinden) | 30 gün |


    **Kredi politikası önerisi:** Satış vadesinin 30 günden 60 güne uzatılması. Bu durumda satışların %20 artacağı, ortalama
    tahsil süresinin 60 güne çıkacağı ve şüpheli alacakların toplam satışların %2''sine yükseleceği tahmin edilmektedir. Kapasite
    yeterlidir; sabit giderler, değişken maliyet oranı, stok ve borç süreleri değişmeyecektir. Alacaklara bağlanan fonun yıllık
    maliyeti %20''dir ve alacak yatırımı **değişken maliyet** esasıyla ölçülmektedir.


    **Hammadde stoku:** Yıllık ihtiyaç 7.200 birim (yıl boyunca düzenli), sipariş başına maliyet 400 TL, birim başına yıllık
    bulundurma maliyeti 16 TL. Siparişin teslim süresi 5 gündür ve işletme 100 birim güvenlik stoku tutmaktadır.


    **İstenenler:**


    (a) Mevcut durumda nakit dönüşüm süresini ve ortalama ticari alacak tutarını hesaplayınız; öneri uygulanırsa nakit dönüşüm
    süresinin kaç gün olacağını belirtiniz. (6 puan)


    (b) Kredi politikası önerisinin işletmeye yıllık net etkisini (katkı payı artışı, alacak yatırımının maliyeti, şüpheli
    alacak artışı) hesaplayarak önerinin kabul edilip edilmeyeceğini gerekçesiyle belirtiniz. (12 puan)


    (c) Ekonomik sipariş miktarını, yıllık sipariş sayısını, yıllık toplam sipariş ve bulundurma maliyetini ve yeniden sipariş
    noktasını hesaplayınız. Sipariş miktarı 900 birim olsaydı toplam maliyetin ne kadar değişeceğini gösteriniz. (7 puan)

    '
  cozum: '**(a) Nakit dönüşüm süresi**


    NDS = Stokta kalma süresi + Alacak tahsil süresi − Borç ödeme süresi = 45 + 30 − 30 = **45 gün**


    Ortalama ticari alacak = 3.600.000 / 360 × 30 = **300.000 TL**


    Öneri uygulanırsa: NDS = 45 + 60 − 30 = **75 gün** (30 gün uzar).


    **(b) Kredi politikası değerlendirmesi**


    | Kalem | Mevcut | Öneri | Fark |

    |---|---|---|---|

    | Satışlar | 3.600.000 | 4.320.000 | +720.000 |

    | Katkı payı (%40) | 1.440.000 | 1.728.000 | **+288.000** |

    | Ortalama alacak (satış değeri) | 3.600.000/360 × 30 = 300.000 | 4.320.000/360 × 60 = 720.000 | |

    | Alacak yatırımı (× %60) | 180.000 | 432.000 | +252.000 |

    | Alacak yatırımının maliyeti (× %20) | 36.000 | 86.400 | **−50.400** |

    | Şüpheli alacaklar | 36.000 (%1) | 86.400 (%2) | **−50.400** |


    Net etki = 288.000 − 50.400 − 50.400 = **+187.200 TL**


    Net etki pozitif olduğundan öneri **kabul edilmelidir**. Not: Alacak yatırımı değişken maliyet esasıyla ölçülür; çünkü
    işletmenin alacaklara bağladığı gerçek fon, satılan malın değişken maliyetidir (kâr marjı fon çıkışı gerektirmez). Satış
    değeri esas alınsaydı alacak maliyeti artışı (720.000 − 300.000) × %20 = 84.000 TL bulunurdu ve net etki 153.600 TL olurdu;
    karar değişmez.


    **(c) Stok yönetimi**


    EOQ = √(2 × D × S / H) = √(2 × 7.200 × 400 / 16) = √360.000 = **600 birim**


    Yıllık sipariş sayısı = 7.200 / 600 = **12**


    Sipariş maliyeti = 12 × 400 = 4.800 TL; bulundurma maliyeti = 600/2 × 16 = 4.800 TL; toplam = **9.600 TL** (EOQ''da iki
    maliyet eşittir).


    Günlük kullanım = 7.200 / 360 = 20 birim; yeniden sipariş noktası = 20 × 5 + 100 = **200 birim**


    Sipariş miktarı 900 birim olsaydı: sipariş maliyeti = 8 × 400 = 3.200 TL; bulundurma = 450 × 16 = 7.200 TL; toplam = 10.400
    TL. Toplam maliyet **800 TL artar**. (Güvenlik stokunun bulundurma maliyeti, 100 × 16 = 1.600 TL, her iki seçenekte aynı
    olduğundan karşılaştırmayı etkilemez.)

    '
  puanlama:
  - olcut: (a) Mevcut NDS 45 gün ve ortalama alacak 300.000 TL
    puan: 4
  - olcut: (a) Öneri sonrası NDS 75 gün
    puan: 2
  - olcut: (b) Katkı payı artışı 288.000 TL
    puan: 3
  - olcut: (b) Alacak yatırımının değişken maliyetle ölçülmesi ve maliyet artışı 50.400 TL
    puan: 4
  - olcut: (b) Şüpheli alacak artışı 50.400 TL
    puan: 2
  - olcut: (b) Net etki 187.200 TL ve kabul kararı gerekçesi
    puan: 3
  - olcut: (c) EOQ 600 birim, 12 sipariş, toplam maliyet 9.600 TL
    puan: 4
  - olcut: (c) Yeniden sipariş noktası 200 birim
    puan: 1
  - olcut: (c) 900 birimlik siparişte 800 TL maliyet artışı
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — işletme sermayesi yönetimi (NDS, kredi politikası, EOQ)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'satis = 3600000.0

      dm = 0.60

      nds = 45 + 30 - 30

      nds_yeni = 45 + 60 - 30

      alacak = satis / 360 * 30

      satis2 = satis * 1.20

      katki = (satis2 - satis) * (1 - dm)

      alacak2 = satis2 / 360 * 60

      yatirim_artis = (alacak2 - alacak) * dm

      alacak_maliyet = yatirim_artis * 0.20

      supheli_artis = satis2 * 0.02 - satis * 0.01

      net = katki - alacak_maliyet - supheli_artis

      D = 7200

      S = 400

      H = 16

      eoq = (2 * D * S / H) ** 0.5

      siparis_sayisi = D / eoq

      toplam = siparis_sayisi * S + eoq / 2 * H

      rop = D / 360 * 5 + 100

      toplam900 = D / 900 * S + 900 / 2 * H

      sonuc = {"nds": nds, "nds_yeni": nds_yeni, "ortalama_alacak": alacak, "katki_artis": katki, "alacak_maliyet_artis":
      alacak_maliyet, "supheli_artis": supheli_artis, "net_etki": net, "eoq": eoq, "siparis_sayisi": siparis_sayisi, "toplam_maliyet":
      toplam, "yeniden_siparis": rop, "fark_900": toplam900 - toplam}

      '
