- id: YMM-FYN-ISY-K006
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - nakit yönetimi (Baumol ve Miller-Orr)
  zorluk: 3
  puan: 22
  sure_dk: 35
  soru: '**Olay:** Ada Perakende A.Ş.''nin yıllık nakit ihtiyacı 900.000 TL olup nakit ihtiyacı yıl boyunca düzenli ve sabit
    hızda gerçekleşmektedir. Her menkul kıymet satışının sabit maliyeti 200 TL, menkul kıymetlerin yıllık getirisi %10''dur.
    Şirket ayrıca günlük nakit akışlarının dalgalandığı bir dönemde Miller-Orr modelini uygulayacaktır: günlük net nakit akışlarının
    varyansı 40.000 TL² (standart sapma 200 TL), işlem maliyeti 80 TL, günlük fırsat maliyeti %0,03, alt sınır (L) 1.000 TL''dir.


    **İstenenler:**


    (a) Baumol modeline göre optimal nakit çevirme tutarını (C*) ve yıllık işlem sayısını bulunuz. (5 puan)


    (b) Ortalama nakit bakiyesini, işlem maliyetini, fırsat maliyetini ve toplam maliyeti hesaplayınız. (5 puan)


    (c) Miller-Orr modeline göre dönüş noktasını (Z), üst sınırı (U) ve ortalama nakit bakiyesini bulunuz. (7 puan)


    (d) Nakit bakiyesi 8.000 TL''ye çıkarsa Miller-Orr modeline göre alınacak işlemi ve tutarını belirtiniz. (5 puan)

    '
  cozum: '**(a)** C* = √(2 × T × F / i) = √(2 × 900.000 × 200 / 0,10) = √3.600.000.000 = **60.000 TL**; işlem sayısı = 900.000
    / 60.000 = **15**.


    **(b)** Ortalama bakiye = 60.000 / 2 = **30.000 TL**; işlem maliyeti = 15 × 200 = **3.000 TL**; fırsat maliyeti = 30.000
    × 0,10 = **3.000 TL**; toplam = **6.000 TL** (iki maliyet birbirine eşit).


    **(c)** Z − L = [3 × b × σ² / (4 × i)]^(1/3) = [3 × 80 × 40.000 / (4 × 0,0003)]^(1/3) = (8.000.000.000)^(1/3) = **2.000**
    → Z = 1.000 + 2.000 = **3.000 TL**. U = 3Z − 2L = **7.000 TL**. Ortalama bakiye = (4Z − L) / 3 = **3.666,67 TL**.


    **(d)** Bakiye (8.000 TL) üst sınırı (7.000 TL) aştığından menkul kıymet alınır ve bakiye Z düzeyine indirilir: 8.000
    − 3.000 = **5.000 TL** tutarında menkul kıymet satın alınır.


    **Mevzuat dayanağı:** TMS 7 paragraf 7 uyarınca nakit benzerleri, kısa vadeli nakit taahhütlerinin yerine getirilmesi
    amacıyla elde tutulur.

    '
  puanlama:
  - olcut: (a) Baumol C* ve işlem sayısı
    puan: 5
  - olcut: (b) Baumol maliyet bileşenleri
    puan: 5
  - olcut: (c) Z, U ve ortalama bakiye
    puan: 7
  - olcut: (d) üst sınır aşımında yapılacak işlem
    puan: 5
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 7
    alinti: Nakit benzerleri, yatırım veya diğer amaçlardan ziyade, kısa vadeli nakit taahhütlerinin yerine getirilmesi amacıyla
      elde tutulur.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'T=900_000; F=200; i=0.10

      kare = 2*T*F/i

      q = kare**0.5

      n = T/q

      ort = q/2

      isl = n*F

      tut = ort*i

      top = isl+tut

      b=80; sigma2=40_000; gi=0.0003; L=1_000

      z_fark = (3*b*sigma2/(4*gi))**(1/3)

      Z = L+z_fark

      U = 3*Z-2*L

      ort_nakit = (4*Z-L)/3

      mevcut = 8_000

      satilacak = mevcut-Z

      sonuc = {''a'': (q, n), ''b'': (ort, isl, tut, top), ''c'': (Z, U, ort_nakit), ''d'': satilacak}

      '
