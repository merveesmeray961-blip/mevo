- id: YMM-FYN-ISY-K003
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - stok yönetimi (EOQ ve sipariş noktası)
  - kısa vadeli finansman ve nakit iskontosu maliyeti
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Pamir Gıda A.Ş.''nin ana hammaddesine ilişkin bilgiler:


    - Yıllık ihtiyaç 36.000 kg''dır; tüketim yılın 360 günü boyunca düzenlidir.

    - Sipariş başına maliyet 500 TL''dir.

    - Liste fiyatı kg başına 100 TL''dir; yıllık bulundurma maliyeti, ödenen birim alış fiyatının %25''idir.

    - Tedarikçi miktar indirimi uygulamaktadır: 3.000–5.999 kg arası siparişlerde %2, 6.000 kg ve üzeri siparişlerde %2,5
    indirim.

    - Tedarik (teslim) süresi 6 gündür; işletme 400 kg güvenlik stoku tutmaktadır. Güvenlik stokunun bulundurma maliyeti sipariş
    miktarı kararına dahil edilmeyecektir.

    - Tedarikçinin ödeme koşulu "3/10, net 40"tır (fatura bedeli 10 gün içinde ödenirse %3 nakit iskontosu, aksi hâlde 40.
    gün ödenir). İşletme bankadan yıllık %40 basit faizle kısa vadeli kredi kullanabilmektedir. Faktör: (100 / 97)^12 = 1,4412.


    **İstenenler:**


    (a) İndirimsiz durumda ekonomik sipariş miktarını (EOQ), yıllık sipariş sayısını, yıllık sipariş ve bulundurma maliyetlerini
    ve alış bedeli dahil yıllık toplam maliyeti hesaplayınız. (6 puan)


    (b) Miktar indirimi seçeneklerini alış bedeli dahil yıllık toplam maliyet üzerinden karşılaştırarak optimal sipariş miktarını
    belirleyiniz. (9 puan)


    (c) (b)''de belirlenen sipariş miktarı için yeniden sipariş noktasını, en yüksek stok düzeyini ve bir sipariş teslim alındıktan
    kaç gün sonra yeni siparişin verileceğini hesaplayınız. (4 puan)


    (d) Nakit iskontosundan vazgeçmenin yaklaşık ve bileşik yıllık maliyetini hesaplayınız. İşletmenin bankadan kredi kullanarak
    iskontodan yararlanıp yararlanmaması gerektiğine karar veriniz. (6 puan)

    '
  cozum: '**(a) EOQ** (D = 36.000; S = 500; H = 0,25 × 100 = 25 TL)


    - EOQ = √(2DS / H) = √(2 × 36.000 × 500 / 25) = √1.440.000 = **1.200 kg**

    - Sipariş sayısı = 36.000 / 1.200 = **30**

    - Sipariş maliyeti = 30 × 500 = **15.000 TL**; bulundurma maliyeti = (1.200 / 2) × 25 = **15.000 TL**

    - Alış bedeli = 36.000 × 100 = 3.600.000 TL; toplam = **3.630.000 TL**


    **(b) Miktar indirimi**


    Her fiyat düzeyinde H yeniden hesaplanır. %2 indirimde H = 0,25 × 98 = 24,50 TL; bu fiyatta EOQ = √(36.000.000 / 24,50)
    ≈ 1.212 kg < 3.000 olduğundan indirimden yararlanmak için en düşük uygun miktar 3.000 kg alınır. %2,5 indirimde H = 0,25
    × 97,50 = 24,375 TL; EOQ ≈ 1.215 kg < 6.000 → 6.000 kg alınır.


    | Sipariş miktarı | Birim fiyat | Sipariş maliyeti | Bulundurma maliyeti | Alış bedeli | Toplam |

    |---|---|---|---|---|---|

    | 1.200 | 100,00 | 15.000 | 15.000 | 3.600.000 | 3.630.000 |

    | 3.000 | 98,00 | 12 × 500 = 6.000 | 1.500 × 24,50 = 36.750 | 3.528.000 | **3.570.750** |

    | 6.000 | 97,50 | 6 × 500 = 3.000 | 3.000 × 24,375 = 73.125 | 3.510.000 | 3.586.125 |


    Optimal sipariş miktarı **3.000 kg**''dır. 6.000 kg''da ek fiyat indirimi (18.000 TL) ve sipariş maliyeti azalışı (3.000
    TL) toplamı, bulundurma maliyetindeki artışı (36.375 TL) karşılamamaktadır.


    **(c) Sipariş noktası** (Q = 3.000 kg; günlük kullanım 36.000 / 360 = 100 kg)


    - Yeniden sipariş noktası = 100 × 6 + 400 = **1.000 kg**

    - En yüksek stok = 3.000 + 400 = **3.400 kg** (sipariş, stok güvenlik stokuna inerken teslim alınır)

    - Teslimden sonra stok (3.400 − 1.000) / 100 = **24 gün** sonra 1.000 kg''a iner; yeni sipariş o gün verilir ve 6 gün
    sonra (30. gün) stok 400 kg iken teslim alınır. Sipariş aralığı 30 gün = 360 / 12.


    **(d) Nakit iskontosu**


    İskontodan vazgeçen işletme 30 gün (40 − 10) ek kredi için fatura bedelinin %3''ünü öder; ödediği her 97 TL için 3 TL
    maliyet doğar.

    - Yaklaşık maliyet = 3 / 97 × 360 / 30 = **%37,11**

    - Bileşik maliyet = (1 + 3/97)^(360/30) − 1 = 1,4412 − 1 = **%44,12**

    - Banka kredisinin 30 günlük maliyeti = 40 × 30 / 360 = %3,33; iskontodan vazgeçmenin 30 günlük maliyeti = 3 / 97 = %3,09.
    Aynı esasla yıllık: %40 > %37,11.


    Banka kredisi daha pahalıdır; işletme **kredi kullanmamalı, iskontodan vazgeçerek 40. gün ödemelidir.** (Banka faizi %37,11''in
    altında olsaydı krediyle 10. gün ödeyip iskontoyu almak avantajlı olurdu.)

    '
  puanlama:
  - olcut: (a) EOQ 1.200 kg ve 30 sipariş
    puan: 3
  - olcut: (a) Sipariş ve bulundurma maliyetleri ile toplam 3.630.000 TL
    puan: 3
