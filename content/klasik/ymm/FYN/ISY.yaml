    orantılı olarak ele alınacaktır). Şirketin kısa vadeli finansman maliyeti yıllık %30''dur.


    **İstenenler:**


    (a) Stokta kalma süresini, alacak tahsil süresini ve borç ödeme süresini hesaplayınız. (6 puan)


    (b) Nakit dönüşüm süresini ve net işletme sermayesine bağlanan finansman tutarını (stok + alacak − borç) bulunuz. (6 puan)


    (c) Alacak tahsil süresi 35 güne indirilirse yeni alacak bakiyesini, serbest kalan fonu ve yıllık finansman tasarrufunu
    bulunuz. (5 puan)


    (d) Bunun yerine tedarikçilerle borç ödeme süresi 45 güne uzatılırsa (alacak süresi 50 gün kalmak üzere) yeni borç bakiyesini,
    ek finansman kaynağını ve yeni nakit dönüşüm süresini bulunuz. (5 puan)

    '
  cozum: '**(a)** Stokta kalma = 900.000 / 5.400.000 × 360 = **60 gün**; alacak tahsil = 1.000.000 / 7.200.000 × 360 = **50
    gün**; borç ödeme = 450.000 / 5.400.000 × 360 = **30 gün**.


    **(b)** Nakit dönüşüm süresi = 60 + 50 − 30 = **80 gün**. Bağlı fon = 900.000 + 1.000.000 − 450.000 = **1.450.000 TL**.


    **(c)** Yeni alacak = 7.200.000 × 35 / 360 = **700.000 TL**; serbest kalan fon = 1.000.000 − 700.000 = **300.000 TL**;
    yıllık tasarruf = 300.000 × %30 = **90.000 TL**.


    **(d)** Yeni borç = 5.400.000 × 45 / 360 = **675.000 TL**; ek kaynak = 675.000 − 450.000 = **225.000 TL**; yeni nakit
    dönüşüm süresi = 60 + 50 − 45 = **50 gün**.


    **Mevzuat dayanağı:** TMS 2 paragraf 9 uyarınca stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden
    ölçülür.

    '
