  soru: '**Olay:** Marmaris Gıda A.Ş.''nin 2025 yılına ilişkin verileri aşağıdadır (1 yıl = 360 gün; stok ve alacak tutarları
    ortalama bakiyedir; satışların tamamı vadelidir): Net satışlar 7.200.000 TL, satışların maliyeti 5.400.000 TL, ortalama
