- id: YMM-FYN-ISY-K008
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - ticari kredide iskonto kaçırmanın maliyeti
  - iskontolu ve blokajlı banka kredisinin etkin maliyeti
  - faktoring maliyeti ve kaynakların karşılaştırılması
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Baran Boya Sanayi A.Ş.''nin finans müdürü, kısa vadeli finansman ihtiyacını karşılayacak kaynakları karşılaştırmaktadır.
    Tüm maliyetler yıllık basit olarak hesaplanacak, 1 yıl 360 gün alınacak, vergi dikkate alınmayacaktır.


    **1. Ticari kredi:** Tedarikçi "4/10, net 70" koşuluyla satış yapmaktadır (fatura 10 gün içinde ödenirse faturanın %4''ü
    kadar iskonto yapılır; aksi hâlde fatura bedeli 70. günde ödenir). Fatura bedeli 2.400.000 TL''dir.


    **2. İskontolu (peşin faizli) banka kredisi:** 2.000.000 TL nominal tutarlı 1 yıl vadeli kredinin yıllık %36 faizi kredi
    kullandırılırken peşin kesilmektedir.


    **3. Blokajlı banka kredisi:** 5.000.000 TL tutarındaki 1 yıl vadeli kredinin yıllık faizi %40''dir ve faiz vade sonunda
    ödenir. Banka, kredi tutarının %20''ini kredi süresince bloke mevduat olarak tutmayı şart koşmaktadır; blokaj tutarına
    yıllık %10 faiz ödenmektedir.


    **4. Faktoring:** 3.000.000 TL tutarındaki 60 gün vadeli alacak faktoring şirketine devredilmektedir. Faktoring şirketi
    alacağın %80''ini peşin avans olarak ödemekte; avans üzerinden yıllık %48 basit faiz ile alacak tutarı üzerinden %1 komisyon
    almaktadır. Faiz ve komisyon 60 gün sonunda tahsilattan mahsup edilir.


    **İstenenler:**


    (a) Ticari kredide iskontoyu kullanmamanın yıllık maliyetini bulunuz. Şirket iskontoyu kullanmak için 3. maddedeki banka
    kredisini çekebilecekse (etkin maliyeti (c) bendinde bulunacaktır), iskontoyu kullanmalı mıdır? (7 puan)


    (b) İskontolu krediden gerçekte alınacak tutarı ve etkin yıllık faiz oranını hesaplayınız. (5 puan)


    (c) Blokajlı kredinin etkin yıllık maliyetini (blokajdan elde edilen faiz dahil) ve blokaj faizi sıfır olsaydı bulunacak
    maliyeti hesaplayınız. (6 puan)


    (d) Faktoringin 60 günlük ve yıllık basit maliyetini hesaplayınız; dört kaynağı etkin maliyete göre sıralayınız. (7 puan)

    '
  cozum: '**(a) Ticari kredi**


    İskonto tutarı = 2.400.000 × %4 = 96.000 TL; 10. günde ödenecek tutar = 2.304.000 TL. İskontoyu kullanmayan işletme, 2.304.000
    TL''yi 60 gün (10. gün ile 70. gün arası) daha uzun süre kullanır ve bunun karşılığında 96.000 TL öder.


    Dönemsel maliyet = iskonto / (fatura − iskonto) = 96.000 / 2.304.000 = 1/24; yıllık maliyet = (1/24) × 360 / 60 = **%25**.


    Karar: Ticari kredinin yıllık maliyeti (%25), banka kredisinin etkin maliyetinden (%47,5, bkz. (c)) düşüktür. İskontoyu
    kullanmak için banka kredisi çekmek, %47,5 öderken %25''lik bir getiri elde etmek demektir; dolayısıyla iskonto **kullanılmamalı**,
    ödeme 70. güne bırakılmalıdır (ödemeyi ertelemek daha ucuz bir finansmandır).


    **(b) İskontolu kredi**


    Peşin kesilen faiz = 2.000.000 × %36 = 720.000 TL; ele geçen tutar = 2.000.000 − 720.000 = **1.280.000 TL**.


    Etkin faiz = 720.000 / 1.280.000 = **%56,25**.


    **(c) Blokajlı kredi**


    Bloke tutar = 5.000.000 × %20 = 1.000.000 TL; kullanılabilir tutar = 5.000.000 − 1.000.000 = 4.000.000 TL. Faiz = 5.000.000
    × %40 = 2.000.000 TL; blokajdan faiz geliri = 1.000.000 × %10 = 100.000 TL.


    Etkin maliyet = (2.000.000 − 100.000) / 4.000.000 = **%47,50**.


    Blokaj faizi sıfır olsaydı: 2.000.000 / 4.000.000 = **%50**.


    **(d) Faktoring ve sıralama**


    Avans = 3.000.000 × %80 = 2.400.000 TL. 60 günlük faiz = 2.400.000 × %48 × 60 / 360 = 192.000 TL; komisyon = 3.000.000
    × %1 = 30.000 TL.


    60 günlük maliyet = (192.000 + 30.000) / 2.400.000 = %9,25; yıllık basit maliyet = %9,25 × 360 / 60 = **%55,5**.


    Sıralama (ucuzdan pahalıya): ticari kredi (%25) < blokajlı kredi (%47,5) < faktoring (%55,5) < iskontolu kredi (%56,25).

    '
