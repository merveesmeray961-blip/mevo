  soru: '**Olay:** Mersin Narenciye A.Ş. bir yıl sonra tahsil edeceği 500.000 USD tutarında ihracat alacağına sahiptir. Spot
    kur 40 TL/USD, bir yıllık TL faizi %30, USD faizi %4''tür. Bir yıl sonra spot kurun üç farklı düzeyde (55; 45; 50 TL/USD)
    gerçekleşebileceği düşünülmektedir. Banka, faiz paritesine uygun 1 yıllık vadeli kur (forward) önermektedir.


    **İstenenler:**


    (a) Faiz paritesine göre 1 yıllık vadeli kuru ve vadeli satışla sabitlenen TL tutarını bulunuz. (6 puan)


    (b) Korunmasız durumda üç kur senaryosunda TL tahsilatını hesaplayınız. (5 puan)


    (c) Vadeli satış yapılmış olsaydı her senaryoda korunmasız duruma göre fırsat kazancı/kaybını (vadeli – spot) bulunuz.
    (6 puan)


    (d) Alacağın bugünkü spot kurla TL karşılığını ve kur riskinin (işlem riski) kaynağını açıklayınız; kur farkının muhasebeleştirilme
    dönemini belirtiniz. (5 puan)

    '
  cozum: '**(a)** Vadeli kur = 40 × (1 + 0,30) / (1 + 0,04) = **50 TL/USD**. Vadeli satışla sabitlenen tutar = 500.000 × 50
    = **25.000.000 TL**.


    **(b)** Spot 55: 500.000 × 55 = **27.500.000 TL**; spot 45: **22.500.000 TL**; spot 50: **25.000.000 TL**.


    **(c)** Fark = vadeli satışla sabitlenen tutar − korunmasız tahsilat: spot 55 iken **-2.500.000 TL** (fırsat kaybı); spot
    45 iken **2.500.000 TL** (koruma kazancı); spot 50 iken **0 TL**. Vadeli satış, tahsilatı 25.000.000 TL''de sabitleyerek
    belirsizliği ortadan kaldırır.


    **(d)** Bugünkü spot karşılık = 500.000 × 40 = **20.000.000 TL**. Alacak, tahsil edilene kadar kurun değişmesi riskine
    açıktır (işlem riski). Parasal kalem olan alacağın farklı kurdan çevrilmesinden doğan kur farkı, oluştuğu dönemde kâr
    veya zararda muhasebeleştirilir.


    **Mevzuat dayanağı:** TMS 21 paragraf 28 uyarınca parasal kalemlerin farklı kurlardan çevrilmesinden kaynaklanan kur farkları,
    oluştukları dönemde kâr veya zararda muhasebeleştirilir. SPKn md. 3/1-u uyarınca değeri bir menkul kıymet fiyatına, döviz
    fiyatına, faiz oranına veya kredi riski transferi sağlayan ölçüm değerlerine bağlı olan araçlar türev araç kapsamındadır.

    '
