    pozisyonu).


    **(b)** Portföy kaybı = 50.000.000 × 1,20 × %10 = **6.000.000 TL**. Vadeli kazanç = 600 × (10.000 × %10 = 1.000 puan)
    × 10 = **6.000.000 TL**. Net = **0 TL** (tam korunmuş).


    **(c)** Yarım koruma: 300 sözleşme → kazanç 300 × 1.000 × 10 = 3.000.000 TL; net kayıp = 6.000.000 − 3.000.000 = **3.000.000
    TL**.


    **(d)** Portföy kazancı = 50.000.000 × 1,20 × %10 = **6.000.000 TL**; vadeli zarar = **6.000.000 TL**; net = **0 TL**.
    Korumanın maliyeti, yükseliş potansiyelinden vazgeçmektir; vadeli satış hem zararı hem kazancı sabitler.


