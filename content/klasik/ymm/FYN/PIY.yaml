  soru: '**Olay:** Güney Bankası, ortalama brüt getirisi %28 olan 100.000.000 TL tutarındaki kredi portföyünü bir menkul kıymetleştirme
    yapısına devretmiştir. Yapıdan ihraç edilen menkul kıymetler üç dilimden oluşmaktadır: Kıdemli (senior) dilim 70.000.000
    TL (faiz %22), ara (mezzanine) dilim 20.000.000 TL (faiz %30) ve ilk zarar (equity) dilimi 10.000.000 TL (bankada kalmıştır).
    Portföy gelirinden önce kıdemli, sonra ara dilim faizleri ödenir; kalan tutar ilk zarar dilimine kalır. Anapara zararları
    ise önce ilk zarar dilimine, sonra ara dilime, en sonunda kıdemli dilime yazılır. Portföyde kayıp yoksa yıllık gelirler
    yukarıdaki gibi gerçekleşir.


    **İstenenler:**


    (a) Yıllık portföy gelirini, kıdemli ve ara dilimlere ödenecek faizi ve ilk zarar dilimine kalan tutarı hesaplayınız.
    (6 puan)


    (b) İlk zarar diliminin getirisini ve kıdemli+ara dilimlerin ağırlıklı faiz maliyetini bulunuz. (5 puan)


    (c) Portföyde 5, 15 ve 35 milyon TL anapara zararı oluşursa her dilime yazılacak zararı gösteriniz. (8 puan)


    (d) Bu yapının ihraç edilen araçlarının hangi nitelikte sermaye piyasası aracı olduğunu belirtiniz ve ilk zarar diliminin
    bankada tutulmasının amacını yorumlayınız. (3 puan)

    '
  cozum: '**(a)** Portföy geliri = 100.000.000 × %28 = **28.000.000 TL**; kıdemli faiz = 70.000.000 × %22 = **15.400.000 TL**;
    ara faiz = 20.000.000 × %30 = **6.000.000 TL**; ilk zarar dilimine kalan = 28.000.000 − 15.400.000 − 6.000.000 = **6.600.000
    TL**.


    **(b)** İlk zarar getirisi = 6.600.000 / 10.000.000 = **%66**. Kıdemli + ara dilimlerin ağırlıklı maliyeti = (15.400.000
    + 6.000.000) / (70.000.000 + 20.000.000) = **%23,78**.


    **(c)**


    | Zarar | İlk zarar dilimi | Ara dilim | Kıdemli dilim |

    |---|---|---|---|

    | 5.000.000 | 5.000.000 | 0 | 0 |

    | 15.000.000 | 10.000.000 | 5.000.000 | 0 |

    | 35.000.000 | 10.000.000 | 20.000.000 | 5.000.000 |


    **(d)** İhraç edilen araçlar, portföydeki varlıklar karşılık gösterilerek ihraç edilen ipoteğe/varlığa dayalı menkul kıymet
    niteliğindeki sermaye piyasası araçlarıdır. İlk zarar diliminin bankada kalması, bankayı zararın ilk bölümünü üstlenmeye
    zorlayarak kredi kalitesinin korunması yönünde teşvik sağlar (aksi hâlde kredi riskini tamamen aktararak özen göstermeme
    riski doğar) ve diğer yatırımcılara güven verir.


    **Mevzuat dayanağı:** SPKn uyarınca ipoteğe ve varlığa dayalı menkul kıymetler, ilgili fonların veya ipotek finansmanı
    kuruluşlarının portföyündeki varlıklar karşılık gösterilerek ihraç edilen sermaye piyasası araçlarıdır.

    '
  puanlama:
  - olcut: (a) gelir, dilim faizleri ve artan tutar
    puan: 6
  - olcut: (b) equity getirisi ve ağırlıklı maliyet
    puan: 5
  - olcut: (c) üç zarar senaryosunda dilim zararları
    puan: 8
  - olcut: (d) araç niteliği ve ilk zarar diliminin işlevi
    puan: 3
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 58/1
    alinti: İpoteğe ve varlığa dayalı menkul kıymetler, ilgili fonların veya ipotek finansmanı kuruluşlarının portföyündeki
      varlıklar karşılık gösterilerek ihraç edilen sermaye piyasası araçlarıdır.
