    karşı endeks vadeli işlem sözleşmeleriyle korumak istemektedir. Endeks vadeli sözleşmesi 10.000 puan seviyesindedir ve
    çarpanı 10 TL''dir (sözleşme değeri 100.000 TL). Portföyün getirisinin yalnızca piyasa hareketine bağlı olduğu (sistematik
    risk) varsayılacaktır.


    **İstenenler:**


    (a) Portföyü tamamen korumak için satılması gereken sözleşme sayısını bulunuz. (5 puan)


    (b) Endeks %10 düşerse portföy kaybını, vadeli pozisyon kazancını ve net sonucu hesaplayınız. (6 puan)


    (c) Yönetici yalnızca yarısı kadar sözleşme satarsa aynı düşüşte net kaybı bulunuz. (5 puan)


    (d) Endeks %10 artarsa tam korumalı portföyün kazancını, vadeli pozisyon zararını ve net sonucu hesaplayarak korumanın
    maliyetini yorumlayınız. (6 puan)

    '
