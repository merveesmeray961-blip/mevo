    yönelik iki çözüm önerisini belirtiniz. (5 puan)


    (d) Aşağıdaki araçları önce para piyasası / sermaye piyasası, sonra alacak (borçlanma) / ortaklık / karma araç olarak
    sınıflandırınız: hazine bonosu, finansman bonosu, kira sertifikası (3 yıl vadeli), pay senedi, paya dönüştürülebilir tahvil,
