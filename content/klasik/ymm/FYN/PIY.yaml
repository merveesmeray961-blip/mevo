- id: YMM-FYN-PIY-K001
  sinav: ymm
  ders: FYN
  konu: PIY
  kazanimlar:
  - vadeli işlem ve opsiyon
  - kur riski ve korunma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'İhracatçı (K) AŞ, 6 ay sonra yurt dışındaki müşterisinden 500.000 USD tahsil edecektir. Şirket kur riskinden korunmak
    için aşağıdaki seçenekleri değerlendirmektedir. Piyasa verileri:


    | Veri | Değer |

    |---|---|

    | Spot USD/TL kuru | 40,80 |

    | TL yıllık basit faiz oranı (borç alma ve borç verme) | %36 |

    | USD yıllık basit faiz oranı (borç alma ve borç verme) | %4 |

    | 6 ay vadeli USD satım opsiyonu kullanım fiyatı | 47,00 TL |

    | Satım opsiyonu primi (USD başına, peşin; zaman değeri ihmal) | 0,40 TL |


    Faiz paritesinin geçerli olduğu varsayılacaktır.


    **İstenenler**


    (a) 6 ay vadeli USD/TL forward kurunu hesaplayınız ve forward satışla kilitlenen TL tahsilat tutarını bulunuz. (6 puan)


    (b) Satım opsiyonu alınması durumunda, vadede spot kurun 45,00 ve 49,00 olması senaryolarında opsiyonun kullanılıp kullanılmayacağını
    belirtiniz ve primi düştükten sonraki net TL tahsilatı hesaplayınız. (8 puan)


    (c) Opsiyonla korunmanın forwardla korunmaya eşit net tahsilat sağladığı vade spot kurunu bulunuz ve iki yöntemi kısaca
    karşılaştırınız. (5 puan)


    (d) Para piyasası korunmasının adımlarını açıklayarak vadede elde edilecek TL tutarını hesaplayınız. (6 puan)

    '
  cozum: '**(a)** Faiz paritesi: F = S × (1 + i_TL × t) / (1 + i_USD × t) = 40,80 × (1 + 0,36 × 0,5) / (1 + 0,04 × 0,5) =
    40,80 × 1,18 / 1,02 = **47,20 TL**.


    Forward satışla kilitlenen tahsilat = 500.000 × 47,20 = **23.600.000 TL** (vadedeki spot kurdan bağımsızdır).


    **(b)** Toplam prim = 500.000 × 0,40 = 200.000 TL.


    | Vadede spot | Karar | Satış kuru | Brüt TL | Net TL (prim sonrası) |

    |---|---|---|---|---|

    | 45,00 | Opsiyon kullanılır (47,00 > 45,00) | 47,00 | 23.500.000 | **23.300.000** |

    | 49,00 | Opsiyon kullanılmaz; spotta satılır | 49,00 | 24.500.000 | **24.300.000** |


    **(c)** Kur 47,00''nin üstündeyken opsiyon kullanılmaz; net tahsilat = 500.000 × (S − 0,40). Forwarda eşitlik: S − 0,40
    = 47,20 → **S = 47,60 TL**.


    Vade spot kuru 47,60''ın altındaysa forward, üstündeyse opsiyon daha yüksek tahsilat sağlar. Opsiyon, 46,60 TL/USD (47,00
    − 0,40) net tabanı korurken kurun yükselmesinden yararlanma imkânını bırakmaz; bunun bedeli primdir. Forward ise kazancı
    da kaybı da 47,20 kurunda sabitler.


    **(d)** Para piyasası korunması:


    1. Vadedeki 500.000 USD''nin bugünkü değeri kadar USD borçlanılır: 500.000 / 1,02 = 490.196,08 USD.

    2. Bu tutar spot kurdan TL''ye çevrilir: 490.196,08 × 40,80 = 20.000.000 TL.

    3. TL 6 ay %36 faizle değerlendirilir: 20.000.000 × 1,18 = **23.600.000 TL**.

    4. Vadede müşteriden tahsil edilen 500.000 USD ile USD borcu (anapara ve faiz) kapatılır.


    Sonuç forward ile aynıdır; faiz paritesi geçerli olduğundan iki yöntem eşdeğerdir.

    '
  puanlama:
  - olcut: Forward kurunu faiz paritesiyle 47,20 TL bulma
    puan: 4
  - olcut: Forwardla kilitlenen tahsilatı 23.600.000 TL bulma
    puan: 2
  - olcut: Toplam primi 200.000 TL bulma
    puan: 1
  - olcut: 45,00 senaryosunda kullanım kararı ve 23.300.000 TL net tahsilat
    puan: 3
  - olcut: 49,00 senaryosunda kullanmama kararı ve 24.300.000 TL net tahsilat
    puan: 4
  - olcut: Eşitlik kurunu 47,60 TL bulma
    puan: 3
  - olcut: Opsiyon ve forwardın risk-getiri karşılaştırması
    puan: 2
  - olcut: USD borçlanma tutarını ve TL karşılığını (20.000.000 TL) bulma
    puan: 3
  - olcut: Vadedeki TL tutarını 23.600.000 TL bulma ve forwardla eşdeğerliği belirtme
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — Vadeli işlem, forward ve opsiyon sözleşmeleri
    madde: '-'
  - mevzuat: Genel bilgi — Kur riski ve korunma yöntemleri
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'f = round(40.80 * (1 + 0.36 * 0.5) / (1 + 0.04 * 0.5), 2)

      forward_tl = 500000 * f

      prim = 500000 * 0.40

      s1 = 500000 * max(47.00, 45.00) - prim

      s2 = 500000 * max(47.00, 49.00) - prim

      esit = f + 0.40

      tl_bugun = round(500000 / 1.02 * 40.80)

      ppk = tl_bugun * 1.18

      sonuc = {''forward_kur'': f, ''forward_tahsilat'': forward_tl, ''senaryo_45'': s1, ''senaryo_49'': s2, ''esitlik_kuru'':
      round(esit, 2), ''tl_kredi'': tl_bugun, ''para_piyasasi_tutar'': ppk}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, klasik 5
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-FYN-PIY-K002
  sinav: ymm
  ders: FYN
  konu: PIY
  kazanimlar:
  - swap ve kredi temerrüt swabı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(X) A.Ş. ve (Y) A.Ş. 3 yıl vadeli, 50.000.000 TL tutarında kredi kullanmak istemektedir. Faizler yıllık olarak yıl
    sonunda ödenecektir. Bankaların iki şirkete teklif ettiği borçlanma maliyetleri:


    | Şirket | Sabit faiz | Değişken faiz |

    |---|---|---|

    | (X) A.Ş. | %32 | TLREF + %1 |

    | (Y) A.Ş. | %36 | TLREF + %2,5 |


    (X) A.Ş. değişken faizli, (Y) A.Ş. sabit faizli borç taşımak istemektedir. Bir aracı banka iki şirketle ayrı ayrı faiz
    swapı yapmayı önermektedir. Koşullar: aracı banka yıllık 0,5 puan kazanç alacak, kalan kazanç iki şirket arasında eşit
    paylaşılacak; swapların değişken bacağı her iki şirket için düz TLREF olacaktır. Anapara el değiştirmeyecektir.


    **İstenenler:**


    (a) Hangi şirketin hangi piyasada karşılaştırmalı üstünlüğe sahip olduğunu gerekçesiyle belirtiniz; swapla elde edilebilecek
    toplam kazancı (puan olarak) hesaplayınız. (7 puan)


    (b) Şirketlerin swap sonrası net borçlanma maliyetlerini bulunuz. Swap yapısını (her şirketin hangi piyasadan borçlandığı,
    bankaya ödediği ve bankadan aldığı oranlar) gösteriniz ve aracı bankanın yıllık kazancını TL olarak hesaplayınız. (7 puan)


    (c) Birinci yıl sonunda TLREF %30 olarak gerçekleşmiştir. Her şirketin kredisine ödediği faizi, swap kapsamında bankayla
    yaptığı net ödemeyi ve toplam net faiz maliyetini TL olarak hesaplayınız. (5 puan)


    (d) Bir yatırım fonu (Y) A.Ş.''nin 20.000.000 TL nominal değerli tahvillerini taşımakta olup bu tutar için 400 baz puanlık
    kredi temerrüt swabı (CDS) almıştır. Fonun ödeyeceği yıllık primi ve (Y) A.Ş.''nin temerrüde düşmesi hâlinde geri kazanım
    oranı %40 iken koruma satıcısının yapacağı ödemeyi hesaplayınız. CDS priminin kredi derecelendirme notundan farkını açıklayınız.
    (6 puan)

    '
  cozum: '**(a) Karşılaştırmalı üstünlük**


    - Sabit faiz farkı: 36 − 32 = 4 puan; değişken faiz farkı: (TLREF + 2,5) − (TLREF + 1) = 1,5 puan.

    - (X) her iki piyasada da ucuzdur (mutlak üstünlük), ancak üstünlüğü sabit piyasada daha büyüktür → (X)''in karşılaştırmalı
    üstünlüğü **sabit faizde**; (Y)''nin dezavantajı değişkende daha küçüktür → (Y)''nin karşılaştırmalı üstünlüğü **değişken
    faizde**.

    - Toplam kazanç = 4 − 1,5 = **2,5 puan**. (Kontrol: swapsız toplam maliyet (X) TLREF + 1 + (Y) 36 = TLREF + 37; swaplı
    (X) 32 + (Y) TLREF + 2,5 = TLREF + 34,5; fark 2,5.)


    **(b) Net maliyetler ve yapı**


    Bankanın payı 0,5; şirketlere kalan 2,0 puan → her biri 1 puan kazanır.

    - (X) net maliyet = (TLREF + 1) − 1 = **TLREF**

    - (Y) net maliyet = 36 − 1 = **%35**


    | | Borçlandığı piyasa | Bankaya öder | Bankadan alır | Net |

    |---|---|---|---|---|

    | (X) | Sabit %32 | TLREF | %32,00 | 32 + TLREF − 32 = TLREF |

    | (Y) | TLREF + %2,5 | %32,50 | TLREF | TLREF + 2,5 + 32,5 − TLREF = %35 |


    Banka: (X)''ten TLREF + (Y)''den %32,50 alır; (X)''e %32,00 + (Y)''ye TLREF öder → kazanç 0,5 puan = 50.000.000 × %0,5
    = **250.000 TL/yıl**.


    **(c) TLREF %30 iken birinci yıl ödemeleri**


    | | Kredi faizi | Bankaya | Bankadan | Swap net | Toplam net maliyet |

    |---|---|---|---|---|---|

    | (X) | 50 mn × %32 = 16.000.000 | 15.000.000 | 16.000.000 | +1.000.000 alır | 15.000.000 (= %30 = TLREF) |

    | (Y) | 50 mn × %32,5 = 16.250.000 | 16.250.000 | 15.000.000 | −1.250.000 öder | 17.500.000 (= %35) |


    Banka net 1.250.000 − 1.000.000 = 250.000 TL kazanır.


    **(d) Kredi temerrüt swabı**


    - Yıllık prim = 20.000.000 × 400 / 10.000 = **800.000 TL**

    - Temerrüt hâlinde ödeme = 20.000.000 × (1 − 0,40) = **12.000.000 TL** (tahvil fona kalırsa geri kazanılan %40''ın üstündeki
    zarar karşılanır)

    - Fark: Derecelendirme notu, derecelendirme kuruluşunun belirli aralıklarla güncellenen görüşüdür ve seyrek değişir. CDS
    primi ise kredi riskinin piyasada sürekli işlem gören fiyatıdır; temerrüt olasılığına ilişkin beklentileri anlık yansıtır
    ve ülke ya da şirket riskinin öncü göstergesi olarak kullanılır. CDS koruma alıcısının karşı taraf riski taşıdığı bir
    türev sözleşmedir; not ise bir değerlendirmedir, koruma sağlamaz.

    '
  puanlama:
  - olcut: (a) Faiz farklarının (4 ve 1,5 puan) hesaplanması
    puan: 2
  - olcut: (a) Karşılaştırmalı üstünlüklerin doğru tespiti
    puan: 3
  - olcut: (a) Toplam kazanç 2,5 puan
    puan: 2
  - olcut: '(b) Net maliyetler: (X) TLREF, (Y) %35'
    puan: 2
  - olcut: (b) Swap yapısı (%32,00 ve %32,50 sabit oranlar)
    puan: 3
  - olcut: (b) Banka kazancı 250.000 TL
    puan: 2
  - olcut: (c) Şirketlerin swap net ödemeleri ve toplam maliyetleri
    puan: 4
  - olcut: (c) Banka net kazancı kontrolü
    puan: 1
  - olcut: (d) Yıllık prim 800.000 TL
    puan: 2
  - olcut: (d) Temerrüt ödemesi 12.000.000 TL
    puan: 2
  - olcut: (d) Derecelendirme notuyla fark
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Faiz swapı ve kredi temerrüt swabı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "N = 50000000\nkazanc = (36 - 32) - (2.5 - 1)\npay = (kazanc - 0.5) / 2\nx_net_marj = 1 - pay\ny_net = 36 - pay\n\
      x_banka_sabit = 32 - x_net_marj\ny_banka_sabit = y_net - 2.5\ntl = 0.30\nx_swap = N * x_banka_sabit / 100 - N * tl\n\
      y_swap = N * tl - N * y_banka_sabit / 100\nsonuc = {\"kazanc\": kazanc, \"x_net_marj\": x_net_marj, \"y_net\": y_net,\
      \ \"x_banka_sabit\": x_banka_sabit,\n         \"y_banka_sabit\": y_banka_sabit, \"banka_kazanc\": N * 0.005, \"x_swap_net\"\
      : round(x_swap, 2),\n         \"y_swap_net\": round(y_swap, 2), \"x_toplam\": round(N * 0.32 - x_swap, 2),\n       \
      \  \"y_toplam\": round(N * 0.325 - y_swap, 2), \"cds_prim\": 20000000 * 400 / 10000,\n         \"cds_odeme\": 20000000\
      \ * (1 - 0.40)}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_FYN
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-21'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_K_FYN.yaml, klasik 14
  - tarih: '2026-10-21'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-FYN-PIY-K003
  sinav: ymm
  ders: FYN
  konu: PIY
  kazanimlar:
  - vadeli işlem ve opsiyon
  - kur riski ve korunma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'İthalatçı Doğu Medikal A.Ş. 3 ay sonra yurt dışındaki tedarikçisine 200.000 EUR ödeyecektir. Bankanın bugünkü kotasyonları
    (alış – satış):


    | Parite | Alış | Satış |

    |---|---|---|

    | EUR/USD | 1,1500 | 1,1520 |

    | USD/TL | 41,00 | 41,10 |


    Banka EUR/TL kotasyonu vermemekte, çapraz kurla işlem yapmaktadır. Şirket kur riskine karşı aşağıdaki araçları değerlendirmektedir:


    - **Alım (call) opsiyonu:** 3 ay vadeli, Avrupa tipi, 200.000 EUR için; kullanım fiyatı 49,00 TL; prim EUR başına 0,60
    TL, peşin ödenir (primin zaman değeri ihmal edilecektir). Opsiyon kullanılmazsa EUR vadede bankanın EUR/TL satış kurundan
    alınacaktır.

    - **VİOP EUR/TL vadeli işlem sözleşmesi:** Sözleşme büyüklüğü 1.000 EUR; 48,20 TL''den 200 sözleşme uzun pozisyon; başlangıç
    teminatı sözleşme başına 3.000 TL, sürdürme teminatı sözleşme başına 2.250 TL. Teminat sürdürme seviyesinin altına düşerse
    başlangıç teminatı seviyesine tamamlanır.


    **İstenenler:**


    (a) EUR/TL çapraz alış ve satış kurunu hesaplayınız; borç bugün ödenseydi kaç TL gerekeceğini bulunuz. (6 puan)


    (b) Vade tarihinde EUR/TL satış kurunun 47,50 TL ve 51,00 TL olması senaryolarında opsiyonun kullanılıp kullanılmayacağını
    belirterek primi de içeren toplam TL ödemesini ve etkin kuru hesaplayınız. Opsiyonla korunmanın korunmasız duruma göre
    avantaj sağlamaya başladığı vade kurunu bulunuz. (8 puan)


    (c) Vadeli işlem pozisyonu açıldıktan sonraki üç günün uzlaşma fiyatları sırasıyla 48,00; 47,40 ve 48,50 TL''dir. Her
    gün sonundaki teminat hesabı bakiyesini, teminat tamamlama çağrısı olup olmadığını ve yatırılacak tutarı, üç günlük toplam
    kâr/zararı hesaplayınız. (7 puan)


    (d) Alım opsiyonu primini etkileyen faktörleri ve etkilerinin yönünü açıklayınız. (4 puan)

    '
  cozum: '**(a) Çapraz kur**


    Ortak para USD her iki kotasyonda da farklı taraftadır; alışlar kendi aralarında, satışlar kendi aralarında çarpılır.

    - EUR/TL alış = 1,1500 × 41,00 = **47,1500**

    - EUR/TL satış = 1,1520 × 41,10 = **47,3472**


    Şirket bankadan EUR alacağı için satış kuru uygulanır: 200.000 × 47,3472 = **9.469.440 TL**.


    **(b) Alım opsiyonu** (toplam prim = 200.000 × 0,60 = 120.000 TL)


    | Senaryo | Karar | EUR maliyeti | Prim | Toplam | Etkin kur |

    |---|---|---|---|---|---|

    | 47,50 | Kullanılmaz (piyasa < 49,00) | 9.500.000 | 120.000 | **9.620.000** | 48,10 |

    | 51,00 | Kullanılır (piyasa > 49,00) | 9.800.000 | 120.000 | **9.920.000** | 49,60 |


    Opsiyonla etkin kur = min(S, 49,00) + 0,60; korunmasız kur = S. S ≤ 49,00 iken opsiyon her zaman 0,60 TL daha pahalıdır;
    S > 49,00 iken opsiyon, 49,60 < S olduğunda avantajlıdır. Avantaj **49,60 TL''nin üstündeki** vade kurlarında başlar (kullanım
    fiyatı + prim). Opsiyon azami maliyeti 49,60 TL ile sınırlar, kur düşerse düşüşten yararlanma imkânını korur.


    **(c) Vadeli işlem teminat hesabı** (200 sözleşme × 1.000 EUR = 200.000 EUR; başlangıç teminatı 600.000 TL; sürdürme teminatı
    450.000 TL)


    | Gün | Uzlaşma fiyatı | Günlük K/Z | Bakiye | Açıklama |

    |---|---|---|---|---|

    | 0 | 48,20 | – | 600.000 | Başlangıç teminatı |

    | 1 | 48,00 | (0,20) × 200.000 = −40.000 | 560.000 | Sürdürmenin üstünde |

    | 2 | 47,40 | (0,60) × 200.000 = −120.000 | 440.000 | 450.000''in altında → çağrı; **160.000 TL** yatırılır → 600.000
    |

    | 3 | 48,50 | 1,10 × 200.000 = +220.000 | 820.000 | |


    Toplam K/Z = −40.000 − 120.000 + 220.000 = **+60.000 TL** = (48,50 − 48,20) × 200.000. Kontrol: yatırılan 760.000 TL,
    bakiye 820.000 TL. Uzun pozisyondaki kazanç, EUR''nun pahalanmasıyla artan ithalat maliyetini dengeler; günlük uzlaşma
    nedeniyle kur geçici olarak düşse bile nakit (teminat tamamlama) ihtiyacı doğar.


    **(d) Alım opsiyonu primini etkileyen faktörler**


    - Dayanak varlık (spot kur) fiyatı artarsa prim **artar**; kullanım fiyatı yükselirse prim **azalır**.

    - Volatilite arttıkça prim **artar** (her iki opsiyon türünde).

    - Vadeye kalan süre uzadıkça prim (Amerikan tipinde kesin olarak) **artar**.

    - Risksiz faiz oranı (yerli para faizi) arttıkça alım primi **artar**; dayanak varlığın getirisi (döviz faizi, hissede
    beklenen temettü) arttıkça alım primi **azalır**.

    '
  puanlama:
  - olcut: (a) Çapraz alış 47,15 ve satış 47,3472
    puan: 4
  - olcut: (a) Satış kurunun uygulanması ve 9.469.440 TL
    puan: 2
  - olcut: (b) Her senaryoda kullanım kararı
    puan: 2
  - olcut: (b) Toplam ödemeler ve etkin kurlar
    puan: 4
  - olcut: (b) Avantaj eşiği 49,60 TL
    puan: 2
  - olcut: (c) Günlük K/Z ve bakiyeler
    puan: 3
  - olcut: (c) 2. gün teminat çağrısı ve 160.000 TL
    puan: 2
  - olcut: (c) Toplam kâr 60.000 TL
    puan: 2
  - olcut: (d) Faktörler ve yönleri
    puan: 4
  kaynaklar:
  - mevzuat: Genel bilgi — Kur riski, çapraz kur ve korunma yöntemleri
    madde: '-'
  - mevzuat: Genel bilgi — Vadeli işlem, forward ve opsiyon sözleşmeleri
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "alis = 1.15 * 41.00\nsatis = 1.152 * 41.10\nprim = 200000 * 0.60\ns1 = 200000 * min(47.50, 49.00) + prim\ns2\
      \ = 200000 * min(51.00, 49.00) + prim\nbakiye = 600000\nonceki = 48.20\ncagri = 0\nfor f in (48.00, 47.40, 48.50):\n\
      \    bakiye += (f - onceki) * 200000\n    onceki = f\n    if bakiye < 450000:\n        cagri += 600000 - bakiye\n  \
