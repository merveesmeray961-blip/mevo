  soru: '**Olay:** A şirketi değişken faizli, B şirketi sabit faizli borçlanmak istemektedir. Piyasada borçlanma maliyetleri
    (yıllık) şöyledir: A: sabit %20, değişken TLREF + %1; B: sabit %24, değişken TLREF + %2,5. Her iki şirket 10.000.000 TL
    ana para üzerinden faiz swapı yapacaktır (A sabit faizle borçlanıp swap ile değişken faize; B değişken faizle borçlanıp
    swap ile sabit faize geçecektir). Swap kazancı iki taraf arasında eşit paylaşılacaktır.


    **İstenenler:**


    (a) Sabit ve değişken piyasalardaki faiz farklarını bulunuz; swapın toplam kazancını (kalite farkı) hesaplayınız. (6 puan)


    (b) Eşit paylaşım için B''nin A''ya ödeyeceği sabit oranı bulunuz (A, B''ye TLREF öder). (6 puan)


    (c) Swap sonrası B''nin net sabit maliyetini ve A''nın yıllık TL tasarrufunu hesaplayınız. (5 puan)


    (d) B''nin borç verenine karşı yıllık %1,5 primle CDS (kredi temerrüt swapı) alması hâlinde yıllık prim tutarını ve temerrütte
    %40 kurtarma oranıyla koruma satıcısının ödeyeceği tutarı bulunuz. (5 puan)

    '
