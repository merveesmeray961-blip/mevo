    puan: 8
  - olcut: (c) net kâr, teminat getirisi ve kaldıraç
    puan: 5
  - olcut: (d) teorik vadeli fiyat ve arbitraj
    puan: 5
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-u
    alinti: 'Türev araçlar: Aşağıda sayılan veya Kurulca bu kapsamda olduğu belirlenen diğer türev araçları: 1) Menkul kıymetleri
      satın alma veya satma veya birbirleri ile değiştirme hakkı veren türev araçları,'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'carpan=10; endeks=10_000

      deger = carpan*endeks

      ilk = deger*0.10

      idame = ilk*0.75

      f1, f2, f3, f4 = 9_900, 9_700, 9_900, 10_200

      k1 = (f1-endeks)*carpan

      k2 = (f2-f1)*carpan

      k3 = (f3-f2)*carpan

      k4 = (f4-f3)*carpan

      b1 = ilk+k1

      b2 = b1+k2

      tamamlama = ilk-b2 if b2 < idame else 0

      b2_son = b2+tamamlama

      b3 = b2_son+k3

      b4 = b3+k4

      net_kar = (f4-endeks)*carpan

      kaldirac = deger/ilk

      getiri_teminat = net_kar/ilk

      spot=10_000; r=0.24; d=0.04; vade=0.25

      teorik = spot*(1+(r-d)*vade)

      piyasa = 10_700

      arbitraj = (piyasa-teorik)*carpan

      sonuc = {''a'': (deger, ilk, idame), ''b'': (b1, b2, tamamlama, b3, b4), ''c'': (net_kar, getiri_teminat), ''d'': (teorik,
      arbitraj)}

      '
