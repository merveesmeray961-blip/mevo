  soru: '**Olay:** Tezcan Makine A.Ş.''nin yatırılan sermayesi 10.000.000 TL, ağırlıklı ortalama sermaye maliyeti (WACC) %20''dir.
    FVÖK 3.200.000 TL, faiz gideri 600.000 TL ve kurumlar vergisi oranı %25''tir. Yönetimin ek primi FVÖK artışına göre hesaplanmaktadır.
    Genel müdür, 2.000.000 TL''lik yeni bir projenin yıllık 300.000 TL vergi sonrası faaliyet kârı (NOPAT) sağlayacağını ve
    projenin tamamen borçla finanse edilebileceğini belirtmektedir.


    **İstenenler:**


    (a) Mevcut durumda NOPAT''ı, sermaye ücretini ve ekonomik katma değeri (ekonomik kâr, EVA) hesaplayınız. (6 puan)


    (b) Muhasebe net kârını bulunuz ve ekonomik kâr ile muhasebe kârı arasındaki farkın nedenini açıklayınız. (5 puan)


    (c) Yeni projenin getirisini (ROIC), proje EVA''sını ve projeden sonraki toplam EVA''yı hesaplayarak pay sahibi açısından
    kararı belirtiniz. (6 puan)


    (d) Primin FVÖK''e bağlanması durumunda yönetimin projeyi neden isteyeceğini; bu durumun hangi temel finans sorununu (acenta
    sorunu) gösterdiğini ve çözüm yollarını açıklayınız. (4 puan)

    '
  cozum: '**(a)** NOPAT = 3.200.000 × (1 − 0,25) = **2.400.000 TL**; sermaye ücreti = 10.000.000 × %20 = **2.000.000 TL**;
    EVA = 2.400.000 − 2.000.000 = **400.000 TL**.


    **(b)** Muhasebe net kârı = (3.200.000 − 600.000) × 0,75 = **1.950.000 TL**. Muhasebe kârı yalnızca borç faizini gider
    yazar; özkaynağın fırsat maliyeti kâr hesabında yer almaz. Ekonomik kâr ise toplam sermayenin (borç + özkaynak) maliyetini
    düşer.


    **(c)** Proje ROIC = 300.000 / 2.000.000 = **%15** < WACC (%20). Proje EVA = 300.000 − 2.000.000 × 0,20 = **-100.000 TL**;
    proje sonrası toplam EVA = 400.000 + (-100.000) = **300.000 TL**. Proje ekonomik değer yok ettiğinden pay sahibi açısından
    **reddedilmelidir**.


    **(d)** Proje FVÖK''ü yaklaşık 300.000 / 0,75 = 400.000 TL artırarak yönetimin primini yükseltir (yeni FVÖK ≈ 3.600.000
    TL), ancak sermaye maliyetini karşılamaz. Yönetici kendi çıkarı ile pay sahibinin çıkarı çatıştığı için acenta sorunu
    ortaya çıkar. Çözüm: primi EVA/özkaynak değerine bağlamak, hisse bazlı ödüller ve izleme/denetim mekanizmaları. Yönetim
    kurulu üyeleri ve yönetimle görevli kişiler görevlerini tedbirli bir yöneticinin özeniyle yerine getirmek ve şirketin
    menfaatlerini dürüstlük kurallarına uyarak gözetmekle yükümlüdür.


