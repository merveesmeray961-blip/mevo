- id: YMM-FYN-PIY-K016
  sinav: ymm
  ders: FYN
  konu: PIY
  kazanimlar:
  - kapalı faiz paritesi ve vadeli kur
  - kur arbitrajı
  - vadeli faiz sözleşmesi (FRA) ile faiz riskinden korunma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir bankanın hazine masasında çalışan analist aşağıdaki piyasa verilerini incelemektedir (alış-satış farkı ve işlem
    maliyetleri yok sayılacak, faizler basit ve yıllıktır):


    | Veri | Değer |

    |---|---|

    | Spot kur (USD/TL) | 40 |

    | 1 yıllık TL faiz oranı | %26 |

    | 1 yıllık USD faiz oranı | %5 |

    | Piyasada kote edilen 1 yıllık vadeli kur | 49 |


    Aynı bankanın müşterisi Ege Tekstil A.Ş., 6 ay sonra başlayacak 6 aylık (180 gün; 1 yıl = 360 gün) dönem için 10.000.000
    TL kredi kullanacaktır ve kredi faizi dönem sonunda ödenecektir. Şirket, faiz riskinden korunmak için %30 oranlı FRA (6×12)
    sözleşmesinin alıcısı olmuştur.


    **İstenenler:**


    (a) Kapalı faiz paritesine göre 1 yıllık teorik vadeli kuru hesaplayınız. (4 puan)


    (b) Kote edilen vadeli kuru dikkate alarak bir arbitraj stratejisi kurunuz: 40.000.000 TL borçlanarak (TL borç faizi yukarıdaki
    oran) vade sonundaki TL ve USD pozisyonlarını gösterip arbitraj kazancını TL olarak hesaplayınız. (9 puan)


    (c) FRA''nın uzlaşma gününde (6. ay sonu) 6 aylık referans faiz oranı yıllık %50 olarak gerçekleşmiştir. FRA uzlaşma tutarını
    (vadeli faiz uzlaşmasında tutar, dönem başında iskonto edilerek ödenir) ve kimin kimden alacağını hesaplayınız; şirketin
    kredisi için etkin faiz oranını (yıllık, basit) bulunuz. (8 puan)


    (d) Arbitraj fırsatı sürerse piyasada spot ve vadeli kurun hangi yönde değişmesi beklenir? Kısaca açıklayınız. (4 puan)

    '
  cozum: '**(a) Teorik vadeli kur**


    F = S × (1 + TL faizi) / (1 + USD faizi) = 40 × (1 + %26) / (1 + %5) = **48 TL/USD**.


    **(b) Arbitraj**


    Kote edilen vadeli kur (49) teorik değerden (48) yüksektir; yani vadeli USD pahalıdır → vadeli USD **satılır**, spot USD
    alınır.


    | Adım | Bugün | 1 yıl sonra |

    |---|---|---|

    | 1. TL borçlan | +40.000.000 TL | −50.400.000 TL (anapara + %26 faiz) |

    | 2. Spot kurdan USD al (40) | −40.000.000 TL → +1.000.000 USD | — |

    | 3. USD''yi %5 ile mevduata yatır | — | +1.050.000 USD |

    | 4. Vadeli kurdan (49) 1 yıl sonrası için USD sat | — | −1.050.000 USD → +51.450.000 TL |


    Net sonuç: Bugün net nakit akımı sıfır; vadede 51.450.000 − 50.400.000 = **1.050.000 TL** kesin kazanç. Kontrol: (49 −
    48) × 1.050.000 USD = 1.050.000 TL.


    **(c) FRA**


    Dönem t = 180 / 360 = 0,5 yıl. Referans oran (%50) FRA oranından (%30) yüksek olduğundan FRA alıcısı (borçlanan Ege Tekstil)
    kazanç elde eder; satıcı banka öder.


    Uzlaşma = 10.000.000 × (%50 − %30) × 0,5 / (1 + %50 × 0,5) = 1.000.000 / 1,25 = **800.000 TL** (dönem başında, banka şirkete
    öder).


    Şirket bu tutarı kredi vadesine kadar referans oranla değerlendirirse vade sonunda 800.000 × 1,25 = 1.000.000 TL elde
    eder.


    Kredi faizi = 10.000.000 × %50 × 0,5 = 2.500.000 TL; net faiz = 2.500.000 − 1.000.000 = 1.500.000 TL → etkin faiz = 1.500.000
    / 10.000.000 / 0,5 = **%30** (= FRA oranı; şirket faiz riskinden tamamen korunmuştur).


    **(d) Fiyat baskısı**


    Arbitrajcılar vadeli USD satacakları ve spot USD alacakları için vadeli kur düşer, spot kur yükselir; kote vadeli kur,
    teorik değer olan 48 TL''ye yaklaşır ve fırsat ortadan kalkar. Ayrıca TL borçlanma talebi ile USD mevduat arzı faiz oranlarını
    da yaklaştırır.

    '
