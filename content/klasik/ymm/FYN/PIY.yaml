    | Opsiyon | Kullanım fiyatı (TL) | Prim (TL) |

    |---|---|---|

    | Satım (put) | 90 | 4 |

    | Alım (call) | 120 | 4 |


    Vade tarihinde payın piyasa fiyatı için beş olası değer öngörülmektedir: 70, 90, 100, 120 ve 150 TL.


    **İstenenler:**


    (a) **Tünel (collar) stratejisi** için (payı tut, 90 TL kullanım fiyatlı put al, 120 TL kullanım fiyatlı call yaz) net
    prim giderini ve beş fiyat için pay başına vade değerini (opsiyon sonuçları ve net prim dahil) tablo hâlinde hesaplayınız.
    (7 puan)


    (b) Tünelin pay başına en düşük ve en yüksek vade değerini bulunuz; hiçbir koruma yapılmaması durumundaki değerle karşılaştırarak
    yönetici için üstlenilen fedakârlığı açıklayınız. (6 puan)


    (c) Yalnızca put alarak (**koruyucu put**) elde edilen pay başına vade değerini beş fiyat için hesaplayınız; en düşük
    değeri ve başabaş fiyatını (payı bugünkü değerinde tutan fiyat) bulunuz. (6 puan)


    (d) Yalnızca call yazarak (**kapalı call**) elde edilen pay başına vade değerini beş fiyat için hesaplayınız ve bu stratejinin,
    fiyat düşüşüne karşı koruma sağlamadığını gösteriniz. Üç stratejiyi (hiçbiri, tünel, koruyucu put) toplam portföy düzeyinde
    (en kötü sonuç için) karşılaştırınız. (6 puan)

    '
  cozum: '**(a) Tünel stratejisi**


    Net prim gideri = ödenen put primi − alınan call primi = 4 − 4 = **0 TL** (sıfır maliyetli tünel).


    Vade değeri (pay başına) = Pay fiyatı + max(90 − S; 0) − max(S − 120; 0) − net prim


    | Vade fiyatı (S) | Put getirisi | Yazılan call''un zararı | Tünel vade değeri |

    |---|---|---|---|

    | 70 | 20 | 0 | 90 |

    | 90 | 0 | 0 | 90 |

    | 100 | 0 | 0 | 100 |

    | 120 | 0 | 0 | 120 |

    | 150 | 0 | 30 | 120 |


    **(b) Sınırlar**


    Tünelde pay başına değer her koşulda 90 TL ile 120 TL arasında kalır: en düşük **90 TL** (toplam 9.000.000 TL; bugünkü
    100 TL''ye göre değer kaybı en çok %10), en yüksek **120 TL**. Korumasız portföyde en düşük değer 70 TL''dir (toplam 7.000.000
    TL), üst sınır yoktur. Yönetici, fiyat düşüşünde 90 TL''nin altındaki kaybı sigortalayarak karşılığında fiyatın 120 TL''nin
    üzerindeki yükselişinden vazgeçmiştir; bu fedakârlık, put priminin call primiyle karşılanmasını sağlar.


    **(c) Koruyucu put**


    Vade değeri = S + max(90 − S; 0) − 4


    | S | 70 | 90 | 100 | 120 | 150 |

    |---|---|---|---|---|---|

    | Değer | 86 | 86 | 96 | 116 | 146 |


    En düşük değer = 90 − 4 = **86 TL** (toplam 8.600.000 TL). Başabaş fiyatı: S − 4 = 100 → **104 TL**; fiyat bu düzeyin
    altındaysa strateji, payı bugünkü değerinde tutmaya göre zarar ettirir (put''un primi yüzünden).


    **(d) Kapalı call ve karşılaştırma**


    Vade değeri = S − max(S − 120; 0) + 4


    | S | 70 | 90 | 100 | 120 | 150 |

    |---|---|---|---|---|---|

    | Değer | 74 | 94 | 104 | 124 | 124 |


    Fiyat 70 TL''ye düştüğünde değer yalnız 4 TL''lik primle desteklenir (74 TL); kapalı call fiyat düşüşünü yalnızca prim
    kadar yastıklar, gerçek bir koruma sağlamaz.


    En kötü sonuç (toplam, TL): korumasız 7.000.000; kapalı call 7.400.000; koruyucu put 8.600.000; tünel 9.000.000. Koruyucu
    put ve tünel en kötü sonucu 90 TL civarında sabitler; tünel, daha az maliyetli olduğu için yükseliş potansiyelini 120
    TL ile sınırlar.

    '
