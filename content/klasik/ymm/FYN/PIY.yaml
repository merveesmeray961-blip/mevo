    **(b)** Vadeli kur = 52 × (1 + 0,12) / (1 + 0,04) = **56 TL/EUR**. Sabitlenen tutar = 100.000 × 56 = **5.600.000 TL**.


    **(c)** 1) 6 ay sonra tahsil edilecek net 100.000 EUR''nun bugünkü karşılığı kadar EUR borçlanılır: 100.000 / 1,04 = **96.153,85
    EUR**. 2) Bu tutar spot kurdan TL''ye çevrilir: 96.153,85 × 52 = **5.000.000 TL**. 3) TL, 6 ay %12 ile değerlendirilir:
