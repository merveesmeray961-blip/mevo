  soru: '**Olay:** Bir payın spot fiyatı 100 TL''dir. Bu paya yazılı, 1 yıl vadeli, kullanım (kullanma) fiyatı 100 TL olan
    Avrupa tipi alım opsiyonunun (call) primi 28 TL''dir. Risksiz faiz oranı yıllık %25''tir; paya vade içinde kâr payı ödenmeyecektir.


    **İstenenler:**


    (a) Alım opsiyonu alıcısının vade sonunda pay fiyatı 70, 100 ve 130 TL olduğundaki net kâr/zararını (prim dahil) hesaplayınız.
    (5 puan)


    (b) Alım–satım paritesini kullanarak aynı kullanım fiyatlı satım opsiyonunun (put) teorik primini bulunuz. (6 puan)


    (c) Satım opsiyonu alıcısının vade sonunda pay fiyatı 70, 100 ve 130 TL olduğundaki net kâr/zararını hesaplayınız. (5
    puan)


    (d) Her iki opsiyonun başabaş fiyatını bulunuz; pay + satım opsiyonu (korumalı pozisyon) için vade sonunda pay 70 ve 130
    TL iken toplam değeri (prim düşülmüş) hesaplayıp ilişkiyi yorumlayınız. (6 puan)

    '
  cozum: '**(a)** Net sonuç = max(S − K; 0) − prim: S = 70 → **-28 TL**; S = 100 → **-28 TL**; S = 130 → 30 − 28 = **2 TL**.


    **(b)** Parite: C + K / (1 + r) = P + S → P = C − S + K / (1 + r) = 28 − 100 + 100 / 1,25 = 28 − 100 + 80 = **8 TL**.


    **(c)** Net sonuç = max(K − S; 0) − prim: S = 70 → 30 − 8 = **22 TL**; S = 100 → **-8 TL**; S = 130 → **-8 TL**.


    **(d)** Call başabaşı = K + prim = **128 TL**; put başabaşı = K − prim = **92 TL**. Korumalı pozisyonda (pay + put): S
    = 70 → 70 + 30 − 8 = **92 TL**; S = 130 → 130 + 0 − 8 = **122 TL**. Satım opsiyonu, pay fiyatı düştüğünde alt sınır (100
    − prim) sağlar; yukarı yönlü kazancı prim kadar azaltır.


    **Mevzuat dayanağı:** SPKn md. 3/1-u uyarınca menkul kıymetleri satın alma veya satma hakkı veren araçlar türev araç sayılır.

    '
