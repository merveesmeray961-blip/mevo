    (c) Aynı net alacağı para piyasası yöntemiyle korumak için gereken işlemleri sıralayıp tutarları hesaplayınız (EUR borçlanılır,
    spotta TL''ye çevrilir, TL mevduata yatırılır). (9 puan)


    (d) Korunmasız bırakılırsa 6 ay sonra kur 60 ve 50 TL/EUR olursa net alacağın TL karşılığını bulunuz ve (b) ile karşılaştırınız.
    (5 puan)

    '
  cozum: '**(a)** Net pozisyon = 300.000 − 200.000 = **100.000 EUR net alacak (uzun pozisyon)**; kur düşerse zarar eder. Alacak
