- id: YMM-FYN-PIY-K004
  sinav: ymm
  ders: FYN
  konu: PIY
  kazanimlar:
  - menkul kıymetleştirme
  - finansal yönetimin temel kavramları (acenta sorunu ekonomik kâr)
  - para ve sermaye piyasası araçları
  zorluk: 2
  puan: 25
  sure_dk: 25
  soru: '**I. Menkul kıymetleştirme:** Anka Bankası, 1.000.000.000 TL tutarındaki konut kredisi alacak havuzunu bir varlık
    finansman fonuna devretmiştir. Fon, havuza dayalı olarak üç dilimde menkul kıymet ihraç etmiştir: kıdemli dilim 800.000.000
    TL, ara dilim 150.000.000 TL, alt (ilk zarar) dilim 50.000.000 TL. Alt dilimi banka elinde tutmaktadır. Havuzdaki kredi
    zararları önce alt dilime, sonra ara dilime, en son kıdemli dilime yansıtılmaktadır.


    **II. Ekonomik kâr:** Bir sanayi şirketinin 2025 yılı verileri: faiz ve vergi öncesi kâr (FVÖK) 30.000.000 TL, faiz gideri
    10.000.000 TL, kurumlar vergisi oranı %25, net kâr 15.000.000 TL; yatırılan sermaye (faizli borç + özkaynak) 150.000.000
    TL; ağırlıklı ortalama sermaye maliyeti (AOSM) %18. Genel müdürün yıllık primi net kârın %2''si olarak belirlenmiştir.


    **İstenenler:**


    (a) Menkul kıymetleştirmenin işleyişini ve kaynak kuruluşa sağladığı faydaları açıklayınız. Havuzda (i) 30.000.000 TL
    ve (ii) 120.000.000 TL kredi zararı oluşması durumunda zararın dilimlere dağılımını ve her dilimin kalan tutarını hesaplayınız.
    (8 puan)


    (b) Şirketin ekonomik katma değerini (EVA) hesaplayınız; muhasebe kârı ile ekonomik kâr arasındaki farkı bu sonuç üzerinden
    açıklayınız. (7 puan)


    (c) Prim sisteminin doğurabileceği acenta (vekâlet) sorununu açıklayınız; acenta maliyetlerinin türlerini ve sorunu azaltmaya
    yönelik iki çözüm önerisini belirtiniz. (5 puan)


    (d) Aşağıdaki araçları önce para piyasası / sermaye piyasası, sonra alacak (borçlanma) / ortaklık / karma araç olarak
    sınıflandırınız: hazine bonosu, finansman bonosu, kira sertifikası (3 yıl vadeli), pay senedi, paya dönüştürülebilir tahvil,
    varant, (I)''deki varlığa dayalı menkul kıymetler. (5 puan)

    '
  cozum: '**(a) Menkul kıymetleştirme**


    İşleyiş: Kaynak kuruluş (banka) nakit akışı yaratan alacaklarını bir havuzda toplayıp özel amaçlı yapıya (varlık finansman
    fonu) devreder; fon bu havuzun tahsilatlarına dayalı olarak farklı risk dilimlerinde varlığa dayalı menkul kıymet (konut
    kredilerinde ipoteğe dayalı yapılar) ihraç eder ve yatırımcılara havuz tahsilatlarından öncelik sırasına göre ödeme yapar.
    Faydaları: bankaya likidite ve yeni kredi kapasitesi, kredi riskinin (alt dilim dışında) transferi, sermaye yeterliliği
    üzerinde rahatlama, düşük maliyetli fon; yatırımcılara farklı risk-getiri seçenekleri.


    | Dilim | Tutar | (i) Zarar 30 mn | Kalan | (ii) Zarar 120 mn | Kalan |

    |---|---|---|---|---|---|

    | Alt (ilk zarar) | 50.000.000 | 30.000.000 | 20.000.000 | 50.000.000 | 0 |

    | Ara | 150.000.000 | 0 | 150.000.000 | 70.000.000 | 80.000.000 |

    | Kıdemli | 800.000.000 | 0 | 800.000.000 | 0 | 800.000.000 |


    Alt dilimin bankada kalması bankanın havuz kalitesini gözetme güdüsünü korur (ilk zarar bankaya yansır).


    **(b) EVA**


    - Vergi sonrası faaliyet kârı = FVÖK × (1 − t) = 30.000.000 × 0,75 = 22.500.000 TL

    - Sermaye maliyeti tutarı = AOSM × yatırılan sermaye = 0,18 × 150.000.000 = 27.000.000 TL

    - **EVA = 22.500.000 − 27.000.000 = −4.500.000 TL**


    Muhasebe kârı yalnız borcun maliyetini (faiz) gider olarak düşer; özkaynağın fırsat maliyetini dikkate almaz. Şirket 15.000.000
    TL net kâr gösterdiği hâlde, yatırılan sermayenin tamamının (özkaynak dahil) beklenen getirisini karşılayamamakta ve yılda
    4.500.000 TL **değer yok etmektedir**. Ekonomik kâr pozitif olmadıkça ortakların serveti artmaz.


    **(c) Acenta sorunu**


    Prim net kâra bağlı olduğundan yönetici, sermaye maliyetinin altında getiri sağlayan ama muhasebe kârını artıran yatırımlara
    (ör. özkaynakla finanse edilen düşük getirili projeler), kısa vadeli kâr artışına ve riskli kararlara yönelebilir; yöneticinin
    (vekil) çıkarı ile ortakların (asil) değer maksimizasyonu amacı ayrışır. Acenta maliyetleri: **izleme maliyetleri** (denetim,
    raporlama, yönetim kurulu gözetimi), **bağlama (taahhüt) maliyetleri** (yöneticinin kendini sınırlayan sözleşme hükümleri)
    ve **kalıntı kayıp** (önlemlere rağmen kaybedilen değer). Çözüm önerileri: primin EVA''ya ya da çok yıllı pay performansına
    bağlanması, pay opsiyonu veya ertelenmiş pay ödülü, bağımsız yönetim kurulu üyeleri ve etkin iç denetim.


    **(d) Sınıflama**


    | Araç | Piyasa | Tür |

    |---|---|---|

    | Hazine bonosu | Para piyasası | Alacak |

    | Finansman bonosu | Para piyasası | Alacak |

    | Kira sertifikası (3 yıl) | Sermaye piyasası | Alacak (borçlanma aracı niteliğinde, faizsiz finansman) |

    | Pay senedi | Sermaye piyasası | Ortaklık |

    | Paya dönüştürülebilir tahvil | Sermaye piyasası | Karma |

    | Varant | Sermaye piyasası | Karma (türev niteliğinde hak) |

    | Varlığa dayalı menkul kıymet (konut kredisi havuzu) | Sermaye piyasası | Alacak |

    '
