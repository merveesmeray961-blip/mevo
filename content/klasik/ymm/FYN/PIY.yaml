  soru: '**Olay:** Bir yatırımcı, çarpanı 10 TL olan endeks vadeli işlem sözleşmesinden 1 adet uzun pozisyon açmıştır (endeks
    10.000 puan iken). Başlangıç teminatı sözleşme değerinin %10''udur; idame teminatı başlangıç teminatının %75''idir. Günlük
    uzlaşma (gün sonu) fiyatları sırasıyla 9.900; 9.700; 9.900 ve 10.200 puandır. İdame teminatının altına düşülürse teminat
    başlangıç düzeyine tamamlanır. Spot endeks 10.000 puan, yıllık faiz %24, yıllık temettü verimi %4, vade 3 aydır.


    **İstenenler:**


    (a) Sözleşme değerini, başlangıç teminatını ve idame teminatını bulunuz. (4 puan)


    (b) Dört günlük teminat hesabı hareketlerini gösteriniz; teminat tamamlama çağrısı olup olmadığını ve tutarını belirleyiniz.
    (8 puan)


    (c) Pozisyonun 4. gün sonu toplam net kârını ve başlangıç teminatına göre getirisini hesaplayınız; kaldıraç etkisini yorumlayınız.
    (5 puan)


    (d) Taşıma maliyeti modeliyle teorik vadeli endeks fiyatını bulunuz; piyasada 10.700 puan işlem görüyorsa arbitraj kazancını
    (sözleşme başına) hesaplayınız. (5 puan)

    '
  cozum: '**(a)** Sözleşme değeri = 10 × 10.000 = **100.000 TL**; başlangıç teminatı = **10.000 TL**; idame teminatı = **7.500
    TL**.


    **(b)** Gün 1: (9.900 − 10.000) × 10 = -1.000 → bakiye **9.000** (idame üstünde). Gün 2: (9.700 − 9.900) × 10 = -2.000
    → bakiye **7.000** < 7.500: teminat tamamlama çağrısı; çağrı tutarı = 10.000 − 7.000 = **3.000 TL** → bakiye 10.000. Gün
    3: (9.900 − 9.700) × 10 = 2.000 → bakiye **12.000**. Gün 4: (10.200 − 9.900) × 10 = 3.000 → bakiye **15.000**.


    **(c)** Net kâr = (10.200 − 10.000) × 10 = **2.000 TL**; başlangıç teminatına göre getiri = 2.000 / 10.000 = **%20**.
    Endeks yalnızca %2 yükselmiştir; kaldıraç (sözleşme değeri / teminat = 10) kâr ve zararı teminata göre büyütür.


    **(d)** Teorik fiyat = 10.000 × [1 + (0,24 − 0,04) × 0,25] = **10.500 puan**. Piyasa 10.700 ise vadeli sözleşme pahalıdır:
    spotu alıp vadeli satarak sözleşme başına (10.700 − 10.500) × 10 = **2.000 TL** arbitraj kazancı elde edilir.


    **Mevzuat dayanağı:** SPKn md. 3/1-u uyarınca menkul kıymetleri satın alma veya satma hakkı veren araçlar türev araç sayılır.

