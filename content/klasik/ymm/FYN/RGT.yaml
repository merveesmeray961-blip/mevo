- id: YMM-FYN-RGT-K001
  sinav: ymm
  ders: FYN
  konu: RGT
  kazanimlar:
  - beklenen getiri ve varyans
  - portföy çeşitlendirmesi
  - sistematik ve sistematik olmayan risk
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir yatırım danışmanı, müşterisi için A ve B paylarını incelemektedir. Ekonominin önümüzdeki yıl için üç olası durumu
    ve payların bu durumlardaki getirileri aşağıdadır:


    | Durum | Olasılık | A getirisi | B getirisi |

    |---|---|---|---|

    | Canlanma | 0,3 | %40 | %4 |

    | Durgunluk | 0,5 | %0 | %14 |

    | Kriz | 0,2 | −%10 | %4 |


    Piyasa portföyünün standart sapması %16, A payının betası 1,0''dır.


    **İstenenler:**


    (a) A ve B paylarının beklenen getirilerini ve standart sapmalarını hesaplayınız. (6 puan)


    (b) A ile B arasındaki kovaryansı ve korelasyon katsayısını hesaplayınız; sonucu yorumlayınız. (6 puan)


    (c) Fonların %20''si A''ya, %80''i B''ye yatırılırsa portföyün beklenen getirisini ve standart sapmasını hesaplayınız.
    Portföyün riskinin B payının tek başına riskiyle karşılaştırmasını yaparak sonucu açıklayınız. (6 puan)


    (d) Tek endeks modelinden yararlanarak A payının toplam varyansını sistematik ve sistematik olmayan kısımlara ayırınız;
    iyi çeşitlendirilmiş bir portföy tutan yatırımcı açısından A''nın riskinin hangi kısmının fiyatlanacağını açıklayınız.
    A''nın piyasa ile korelasyon katsayısını bulunuz. (7 puan)

    '
  cozum: '**(a) Beklenen getiri ve standart sapma**


    E(A) = 0,3 × 40 + 0,5 × 0 + 0,2 × (−10) = 12 + 0 − 2 = **%10**


    Sapmalar: 30, −10, −20 → Var(A) = 0,3 × 900 + 0,5 × 100 + 0,2 × 400 = 270 + 50 + 80 = 400 → **σA = %20**


    E(B) = 0,3 × 4 + 0,5 × 14 + 0,2 × 4 = 1,2 + 7 + 0,8 = **%9**


    Sapmalar: −5, 5, −5 → Var(B) = 0,3 × 25 + 0,5 × 25 + 0,2 × 25 = 25 → **σB = %5**


    **(b) Kovaryans ve korelasyon**


    Kov(A,B) = 0,3 × 30 × (−5) + 0,5 × (−10) × 5 + 0,2 × (−20) × (−5) = −45 − 25 + 20 = **−50**


    ρ = −50 / (20 × 5) = **−0,5**


    Yorum: Getiriler ters yönlü hareket etme eğilimindedir (A''nın iyi olduğu canlanmada B düşük, durgunlukta tersi). Korelasyon
    −1 olmadığından risk tamamen yok edilemez; ancak çeşitlendirmenin faydası yüksektir.


    **(c) %20 A – %80 B portföyü**


    E(Rp) = 0,2 × 10 + 0,8 × 9 = 2 + 7,2 = **%9,2**


    Var(Rp) = 0,2² × 400 + 0,8² × 25 + 2 × 0,2 × 0,8 × (−50) = 16 + 16 − 16 = 16 → **σp = %4**


    Portföyün standart sapması (%4), B''nin tek başına standart sapmasından (%5) düşüktür; üstelik beklenen getiri %9''dan
    %9,2''ye yükselmiştir. Tek başına çok riskli olan A''nın (σ = %20) eklenmesi, negatif korelasyon sayesinde portföy riskini
    azaltmıştır. Bir varlığın portföye katkısı kendi varyansına değil, diğer varlıklarla kovaryansına bağlıdır.


    **(d) Risk ayrıştırması**


    Sistematik varyans = β² × σm² = 1,0² × 16² = **256**


    Toplam varyans = 400 → Sistematik olmayan varyans = 400 − 256 = **144** (σε = %12)


    Toplam varyansın %64''ü sistematik, %36''sı sistematik olmayan risktir.


    İyi çeşitlendirilmiş portföy tutan yatırımcı için sistematik olmayan risk (144) çeşitlendirmeyle giderilir; piyasa yalnız
    sistematik riski (beta) fiyatlar. Bu nedenle A''nın gerekli getirisi toplam riskine (%20) değil betasına (1,0) göre belirlenir.


    ρ(A,m) = β × σm / σA = 1,0 × 16 / 20 = **0,8** (kontrol: ρ² = 0,64 = sistematik pay)

    '
  puanlama:
  - olcut: (a) E(A) = %10 ve σA = %20
    puan: 3
  - olcut: (a) E(B) = %9 ve σB = %5
    puan: 3
  - olcut: (b) Kovaryans −50
    puan: 3
  - olcut: (b) Korelasyon −0,5 ve yorum
    puan: 3
  - olcut: (c) Portföy beklenen getirisi %9,2
    puan: 1
  - olcut: (c) Portföy standart sapması %4
    puan: 3
  - olcut: (c) B ile karşılaştırma ve negatif korelasyonun etkisinin açıklanması
    puan: 2
  - olcut: (d) Sistematik varyans 256, sistematik olmayan varyans 144
    puan: 3
  - olcut: (d) Yalnız sistematik riskin fiyatlandığının açıklanması
    puan: 2
  - olcut: (d) Piyasa ile korelasyon 0,8
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — risk, getiri ve portföy teorisi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "p = [0.3, 0.5, 0.2]\na = [40.0, 0.0, -10.0]\nb = [4.0, 14.0, 4.0]\nea = 0.0\neb = 0.0\nfor i in range(3):\n \
      \   ea += p[i] * a[i]\n    eb += p[i] * b[i]\nva = 0.0\nvb = 0.0\nkov = 0.0\nfor i in range(3):\n    va += p[i] * (a[i]\
      \ - ea) ** 2\n    vb += p[i] * (b[i] - eb) ** 2\n    kov += p[i] * (a[i] - ea) * (b[i] - eb)\nsa = va ** 0.5\nsb = vb\
      \ ** 0.5\nrho = kov / (sa * sb)\nw = 0.2\nep = w * ea + (1 - w) * eb\nvp = w ** 2 * va + (1 - w) ** 2 * vb + 2 * w *\
      \ (1 - w) * kov\nsis = 1.0 ** 2 * 16.0 ** 2\nsonuc = {\"EA\": round(ea, 4), \"sA\": round(sa, 4), \"EB\": round(eb,\
      \ 4), \"sB\": round(sb, 4), \"kov\": round(kov, 4), \"rho\": round(rho, 4), \"Ep\": round(ep, 4), \"sp\": round(vp **\
      \ 0.5, 4), \"sistematik\": sis, \"sistematik_olmayan\": round(va - sis, 4), \"rho_Am\": round(1.0 * 16.0 / sa, 4)}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
