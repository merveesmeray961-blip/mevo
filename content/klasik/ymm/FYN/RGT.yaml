        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, klasik 2
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
