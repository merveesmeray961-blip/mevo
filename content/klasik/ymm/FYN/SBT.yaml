    puan: 5
  - olcut: (c) NBD ve (b) ile eşitlik
    puan: 3
  - olcut: (d) Hatalı NBD ve fark
    puan: 4
  - olcut: (d) Yönün ve nedenin açıklanması
    puan: 2
