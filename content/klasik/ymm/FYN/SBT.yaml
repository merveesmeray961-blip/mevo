- id: YMM-FYN-SBT-K010
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - çok dönemli proje değerlemesinde bitiş (terminal) değeri
  - sürekli büyüme varsayımı
  - bitiş değerine duyarlılık
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bozkır Lojistik A.Ş., 17.500.000 TL tutarında yeni bir aktarma merkezi yatırımını değerlendirmektedir. Projenin serbest
    nakit akımları ilk 5 yıl için açık olarak tahmin edilmiştir (TL, yıl sonları):


    | Yıl | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|

    | Serbest nakit akımı | 3.000.000 | 3.500.000 | 4.000.000 | 4.500.000 | 5.000.000 |


    5. yıldan sonra serbest nakit akımlarının yıllık %5 oranında süresiz büyüyeceği varsayılmaktadır (6. yıl akımı = 5. yıl
    akımı × (1 + g)). İskonto oranı %25''dir.


    **İstenenler:**


    (a) Açık tahmin dönemindeki (1–5. yıl) nakit akımlarının bugünkü değerini hesaplayınız. (5 puan)


    (b) 5. yıl sonundaki bitiş (terminal) değerini sürekli büyüme (Gordon) formülüyle hesaplayınız ve bugünkü değerine çeviriniz.
    (6 puan)


    (c) Projenin NBD''sini hesaplayınız; bitiş değerinin toplam değer içindeki payını bulunuz ve kararı belirtiniz. (7 puan)


    (d) Büyüme oranı sıfır (%0) olsaydı NBD ne olurdu? Bitiş değeri hiç hesaba katılmasaydı NBD ne olurdu? Sonuçlardan hareketle
    bitiş değerine ilişkin varsayımın önemini yorumlayınız. (7 puan)

    '
  cozum: '**(a) Açık dönem**


    | Yıl | Nakit akımı | İskonto çarpanı | Bugünkü değer |

    |---|---|---|---|

    | 1 | 3.000.000 | 1 / 1,25 | 2.400.000 |

    | 2 | 3.500.000 | 1 / 1,25² | 2.240.000 |

    | 3 | 4.000.000 | 1 / 1,25³ | 2.048.000 |

    | 4 | 4.500.000 | 1 / 1,25⁴ | 1.843.200 |

    | 5 | 5.000.000 | 1 / 1,25⁵ | 1.638.400 |

    | **Toplam** | | | **10.169.600** |


    **(b) Bitiş değeri**


    TV₅ = FCF₅ × (1 + g) / (k − g) = 5.000.000 × 1,05 / (0,25 − 0,05) = 5.250.000 / 0,20 = **26.250.000 TL**.


    Bugünkü değeri = 26.250.000 / 1,25⁵ = **8.601.600 TL**.


    **(c) NBD ve karar**


    Projenin toplam değeri = 10.169.600 + 8.601.600 = 18.771.200 TL → NBD = 18.771.200 − 17.500.000 = **1.271.200 TL** > 0
    → proje kabul edilir.


    Bitiş değerinin payı = 8.601.600 / 18.771.200 = **%45,8**: toplam değerin yaklaşık yarısı 5. yıldan sonraki sonsuz akımlara
    dayanmaktadır.


    **(d) Duyarlılık**


    - g = %0 ise TV₅ = 5.000.000 / 0,25 = 20.000.000 TL, bugünkü değeri 6.553.600 TL; NBD = 10.169.600 + 6.553.600 − 17.500.000
    = **-776.800 TL** (negatif → proje reddedilir).

    - Bitiş değeri hiç hesaba katılmazsa NBD = 10.169.600 − 17.500.000 = **-7.330.400 TL**.


    Büyüme oranının %5''ten %0''a inmesi karar sonucunu tersine çevirmiştir. Bitiş değeri toplam değerin yaklaşık yarısını
    oluşturduğundan, uzun dönem büyüme ve iskonto oranı varsayımları projenin kabul edilebilirliğini belirler; bu nedenle
    duyarlılık analizi yapılmalı, büyüme oranı sürdürülebilir düzeyde (uzun dönem nominal ekonomik büyümeyi aşmayacak biçimde)
    seçilmelidir.

    '
  puanlama:
  - olcut: (a) Yıllık bugünkü değerler ve toplamı
    puan: 5
  - olcut: (b) Gordon formülüyle TV
    puan: 3
  - olcut: (b) TV'nin bugünkü değeri
    puan: 3
  - olcut: (c) NBD ve karar
    puan: 4
  - olcut: (c) TV'nin payı
    puan: 3
  - olcut: (d) g = 0 durumunda NBD
    puan: 3
