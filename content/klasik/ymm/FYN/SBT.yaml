- id: YMM-FYN-SBT-K002
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - yıllık eşdeğer ve makine yenileme kararı
  - yatırım projelerinde nakit akışı tahmini
  - net bugünkü değer
  - iç verim oranı ve düzeltilmiş iç verim oranı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Ömer Plastik A.Ş. bir enjeksiyon makinesini yenilemeyi değerlendirmektedir.


    **Eski makine:** 4 yıl önce 800.000 TL''ye alınmıştır; 8 yıllık faydalı ömürle normal (eşit tutarlı) amortismana tabidir,
    bugünkü defter değeri 400.000 TL''dir. Bugün 300.000 TL''ye satılabilir. Kullanılmaya devam edilirse 4 yıl sonra hurda
    değeri sıfır olacaktır. Geçen yıl eski makineye 60.000 TL revizyon yaptırılmış ve gider yazılmıştır.


    **Yeni makine:** Alış bedeli 1.000.000 TL, nakliye ve kurulum 200.000 TL''dir. Vergi açısından 4 yılda normal amortismana
    tabidir; vergi bakımından hurda değeri sıfırdır. Yıllık nakit faaliyet giderlerinde 400.000 TL tasarruf sağlayacak, satışları
    değiştirmeyecektir. Başlangıçta 50.000 TL ek net işletme sermayesi (yedek parça stoku) gerektirecek, bu tutar 4. yıl sonunda
    geri kazanılacaktır. Makinenin 4. yıl sonunda 150.000 TL''ye satılması beklenmektedir. Yeni makine %35 faizli banka kredisiyle
    finanse edilecektir.


    Kurumlar vergisi oranı %20''dir; şirketin diğer faaliyetleri kârlıdır ve satış zararları diğer kazançlardan indirilebilir.
    Sermaye maliyeti %25''tir; başlangıç akışları dışındaki tüm akışlar yıl sonlarında gerçekleşir.


    Faktörler (%25): (1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512; (1,25)^−4 = 0,4096; 4 yıllık anüite faktörü =
    2,3616.


    **İstenenler:**


    (a) Yenileme kararının başlangıç (t = 0) artımsal nakit akışını hesaplayınız; geçen yılki revizyon giderinin ve kredi
    faizinin hesaplamadaki yerini gerekçesiyle açıklayınız. (7 puan)


    (b) 1–4. yılların artımsal faaliyet nakit akışını ve 4. yıl sonundaki son yıl (faaliyet dışı) nakit akışlarını hesaplayarak
    artımsal nakit akışı tablosunu düzenleyiniz. (8 puan)


    (c) Yenileme kararının net bugünkü değerini hesaplayınız; kararı veriniz ve iç verim oranının %25''ten büyük mü küçük
    mü olduğunu gerekçesiyle belirtiniz. (5 puan)


    (d) Diğer veriler değişmezken yenilemenin kabul edilebilmesi için eski makinenin bugünkü satış değerinin en az ne olması
    gerektiğini ters çözümle bulunuz. (5 puan)

    '
  cozum: "**(a) Başlangıç nakit akışı**\n\n| Kalem | TL |\n|---|---|\n| Yeni makine (alış + nakliye ve kurulum) | (1.200.000)\
    \ |\n| Eski makinenin satış bedeli | 300.000 |\n| Satış zararının vergi tasarrufu: (400.000 − 300.000) × 0,20 | 20.000\
    \ |\n| Net işletme sermayesi artışı | (50.000) |\n| **t = 0 artımsal nakit akışı** | **(930.000)** |\n\n- Revizyon gideri\
    \ (60.000 TL) **batık maliyettir**; karardan bağımsız olarak geçmişte yapılmıştır, artımsal akışa girmez.\n- Kredi faizi\
    \ nakit akışına yazılmaz; finansman maliyeti iskonto oranında (sermaye maliyeti) yer alır. Faizi ayrıca düşmek finansman\
    \ maliyetini iki kez saymak olur.\n\n**(b) Artımsal akışlar**\n\n- Amortisman: yeni 1.200.000 / 4 = 300.000 TL; eski 100.000\
    \ TL; artımsal amortisman 200.000 TL\n- Yıllık faaliyet nakit akışı = Tasarruf × (1 − t) + ΔAmortisman × t = 400.000 ×\
    \ 0,80 + 200.000 × 0,20 = 320.000 + 40.000 = **360.000 TL**\n  (Kontrol: vergi matrahı artışı 400.000 − 200.000 = 200.000;\
    \ ek vergi 40.000; 400.000 − 40.000 = 360.000.)\n- 4. yıl son akışları: yeni makinenin satışı 150.000; defter değeri sıfır\
    \ olduğundan tamamı kazanç, vergi 30.000 → net **120.000 TL**; eski makine kullanılsaydı hurda değeri sıfır olacağından\
    \ kaybedilen akış yoktur; NİS geri kazanımı **50.000 TL**; toplam **170.000 TL**\n\n| Yıl | 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|---|\n\
    | Başlangıç | (930.000) | | | | |\n| Faaliyet | | 360.000 | 360.000 | 360.000 | 360.000 |\n| Son yıl | | | | | 170.000\
    \ |\n| **Net** | **(930.000)** | **360.000** | **360.000** | **360.000** | **530.000** |\n\n**(c) NBD ve karar**\n\n-\
    \ BD(faaliyet) = 360.000 × 2,3616 = 850.176 TL; BD(son yıl) = 170.000 × 0,4096 = 69.632 TL; toplam 919.808 TL\n- **NBD\
    \ = 919.808 − 930.000 = −10.192 TL** < 0 → yenileme **reddedilir**.\n- NBD %25'te negatif olduğundan İVO **%25'ten küçüktür**\
    \ (NBD iskonto oranı düştükçe artar; sıfır olduğu oran %25'in altındadır).\n\n**(d) Ters çözüm** (eski makinenin satış\
    \ değeri S)\n\nBaşlangıç akışı = −1.200.000 + S + (400.000 − S) × 0,20 − 50.000 = −1.170.000 + 0,80S\nNBD = 919.808 −\
    \ 1.170.000 + 0,80S ≥ 0 → 0,80S ≥ 250.192 → **S ≥ 312.740 TL**\n\nSatış değerindeki 1 TL'lik artış, satış zararını da\
    \ 1 TL azalttığından vergi sonrası yalnız 0,80 TL nakit sağlar; eşik bu nedenle 312.740 TL'dir.\n"
  puanlama:
