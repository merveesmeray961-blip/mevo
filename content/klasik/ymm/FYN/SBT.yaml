    Yalnızca sürdürme: 1. yıl sonu beklenen değer = %40 × (3.000.000 + 400.000) + %40 × (2.500.000 + 400.000) + %20 × (500.000
    + 400.000) = 2.700.000 TL → bugünkü değer 2.160.000 TL → NBD = **160.000 TL**.


    Opsiyonların toplam değeri = 560.000 − 160.000 = **400.000 TL** (genişleme opsiyonu başarılı sonuçta, terk opsiyonu başarısız
    sonuçta devreye girer). Statik NBD''ye bakılırsa proje zaten kabul edilebilir; esneklik değeri karar kalitesini artırır.


    **(d) Genişleme maliyeti 8.000.000 TL**


    Başarılı sonuçta genişleme değeri 10.000.000 − 8.000.000 = 2.000.000 TL < sürdürme 3.000.000 TL → **genişleme artık tercih
    edilmez**; karar "Sürdür" olur ve değer 3.000.000 TL''dir. Orta ve başarısız sonuçlarda karar değişmez.


    Yeni beklenen 1. yıl sonu değeri = 2.800.000 TL → NBD = **240.000 TL**; opsiyon değeri = 240.000 − 160.000 = **80.000
