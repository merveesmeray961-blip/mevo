  dogrulama:
    python: 'yat = 17500000

      c = [3000000, 3500000, 4000000, 4500000, 5000000]

      c1, c2, c3, c4, c5 = c

      g = 0.05

      k = 0.25

      g2 = 0.0

      pv = [c[i] / (1 + k) ** (i + 1) for i in range(5)]

      pv_acik = sum(pv)

      tv = c5 * (1 + g) / (k - g)

      pv_tv = tv / (1 + k) ** 5

      toplam = pv_acik + pv_tv

      nbd = toplam - yat

      pay = pv_tv / toplam

      tv0 = c5 * (1 + g2) / (k - g2)

      pv_tv0 = tv0 / (1 + k) ** 5

      nbd0 = pv_acik + pv_tv0 - yat

      nbd_tvsiz = pv_acik - yat

      sonuc = {"pv_acik": pv_acik, "tv": tv, "pv_tv": pv_tv, "toplam": toplam, "nbd": nbd, "pay": pay, "nbd0": nbd0, "nbd_tvsiz":
      nbd_tvsiz}

      '
