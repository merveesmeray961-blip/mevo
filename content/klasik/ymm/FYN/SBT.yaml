  soru: 'Ege Lojistik A.Ş., 1.000.000 TL tutarında bir depo yatırımını değerlendirmektedir. Projeden 2 yıl boyunca yıl sonlarında
    nakit girişi sağlanacaktır; her yılın nakit girişi aşağıdaki iki durumdan biri olacaktır (olasılıklar eşit):


    | Yıl | Kötü durum (%50) | İyi durum (%50) |

    |---|---|---|

    | 1 | 500.000 | 1.100.000 |

    | 2 | 600.000 | 1.200.000 |


    Risksiz faiz oranı %20, işletmenin bu tür riskli projeler için kullandığı risk ayarlı iskonto oranı %25''dir.


    **İstenenler:**


    (a) Her yılın beklenen nakit akımını, standart sapmasını ve değişim katsayısını hesaplayınız. (5 puan)


    (b) Risk ayarlı iskonto oranı yöntemiyle projenin NBD''sini bulunuz. (5 puan)


    (c) Belirlilik eşdeğeri yöntemi, risk ayarlı oran yöntemiyle aynı sonucu verecek biçimde uygulanırsa her yıl için belirlilik
    eşdeğeri katsayısını (α) bulunuz; belirlilik eşdeğeri nakit akımlarını risksiz faizle iskonto ederek NBD''nin aynı olduğunu
    gösteriniz. (8 puan)


    (d) İki yılın nakit akımları birbirinden bağımsız ise dört durumun (kötü-kötü, kötü-iyi, iyi-kötü, iyi-iyi) NBD''sini
    (risk ayarlı oranla) ve NBD''nin negatif olma olasılığını hesaplayınız. Akımlar tam pozitif ilişkili (aynı yönde hareket
    ediyor) olsaydı bu olasılık ne olurdu? (7 puan)

    '
  cozum: '**(a) Beklenen değer ve risk**


    | Yıl | Beklenen akım | Standart sapma | Değişim katsayısı |

    |---|---|---|---|

    | 1 | (500.000 + 1.100.000) / 2 = 800.000 | (1.100.000 − 500.000) / 2 = 300.000 | 300.000 / 800.000 = 0,375 |

    | 2 | (600.000 + 1.200.000) / 2 = 900.000 | (1.200.000 − 600.000) / 2 = 300.000 | 300.000 / 900.000 = 0,333 |


    (İki durumlu, eşit olasılıklı dağılımda standart sapma, iki değer arasındaki farkın yarısıdır.)


    **(b) Risk ayarlı oranla NBD**


    PV = 800.000 / 1,25 + 900.000 / 1,25² = 640.000 + 576.000 = 1.216.000 TL → NBD = **216.000 TL**.


    **(c) Belirlilik eşdeğeri**


    Risk ayarlı oranla aynı sonucu veren katsayı: αₜ = [(1 + rf) / (1 + ra)]ᵗ


    α₁ = 1,20 / 1,25 = **0,96**; α₂ = 0,96² = **0,9216**


    Belirlilik eşdeğeri akımları: CE₁ = 0,96 × 800.000 = 768.000 TL; CE₂ = 0,9216 × 900.000 = 829.440 TL.


    PV = 768.000 / 1,20 + 829.440 / 1,20² = 640.000 + 576.000 = 1.216.000 TL → NBD = **216.000 TL** (b) ile aynıdır. Katsayılar
    zamanla küçülür: risk ne kadar uzak döneme yayılırsa belirsizlik o kadar fazla cezalandırılır.


    **(d) Dağılım**


    | Durum | NBD | Olasılık (bağımsız) |

    |---|---|---|

    | Kötü–Kötü | -216.000 | %25 |

    | Kötü–İyi | 168.000 | %25 |

    | İyi–Kötü | 264.000 | %25 |

    | İyi–İyi | 648.000 | %25 |


    Beklenen NBD = 216.000 TL ((b) ile aynı). NBD < 0 olan tek durum Kötü–Kötü olduğundan olasılık = **%25**.


    Akımlar tam pozitif ilişkili olsaydı yalnız Kötü–Kötü ve İyi–İyi durumları oluşurdu; Kötü–Kötü olasılığı **%50** olurdu.
    Bağımsızlık (ya da negatif ilişki) riski azaltır, pozitif ilişki artırır.

    '
  puanlama:
  - olcut: (a) Beklenen değerler
