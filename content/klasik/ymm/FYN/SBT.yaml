    puan: 3
  - olcut: (c) Belirlilik eşdeğerleri ve NBD'nin aynı olduğunun gösterilmesi
    puan: 5
  - olcut: (d) Dört durumun NBD'si
    puan: 4
  - olcut: (d) Negatif NBD olasılığı (bağımsız ve pozitif ilişkili)
