  cozum: 'Birim katkı payı = 100 − 60 = 40 TL; yıllık amortisman = 1.440.000 / 2 = 720.000 TL; 2 yıllık anüite çarpanı (%25)
    = 0,8 + 0,64 = 1,44.


    Yıllık işletme nakit akımı: OCF = (Q × 40 − 400.000 − 720.000) × (1 − %20) + 720.000.


    **(a) Başabaş noktaları**


    - **Nakit başabaş:** Q × 40 − 400.000 = 0 → **Q = 10.000 adet** (nakit gelir = değişken maliyet + sabit nakit gider).

    - **Muhasebe başabaş:** Q × 40 = 400.000 + 720.000 → **Q = 28.000 adet** (vergi öncesi kâr = 0).

    - **Finansal başabaş (NBD = 0):** Gerekli OCF = 1.440.000 / 1,44 = 1.000.000 TL. (1.000.000 − 720.000) / 0,8 = 350.000
    TL vergi öncesi kâr gerekir → Q × 40 = 350.000 + 400.000 + 720.000 → **Q = 36.750 adet**.


    **(b) Temel durum**


    OCF = (45.000 × 40 − 400.000 − 720.000) × 0,8 + 720.000 = (680.000) × 0,8 + 720.000 = **1.264.000 TL**.


    NBD = 1.264.000 × 1,44 − 1.440.000 = **380.160 TL**.


    Güvenlik marjı = (45.000 − 36.750) / 45.000 = **%18,3** (satışlar bu orandan fazla düşmedikçe proje NBD > 0 kalır).


    **(c) Fiyat senaryoları**


    | Senaryo | Fiyat | OCF | NBD | Olasılık |

    |---|---|---|---|---|

    | Kötümser | 90 | 904.000 | -138.240 | %25 |

    | Temel | 100 | 1.264.000 | 380.160 | %50 |

    | İyimser | 110 | 1.624.000 | 898.560 | %25 |


    Beklenen NBD = %25 × (-138.240) + %50 × 380.160 + %25 × 898.560 = **380.160 TL**. Proje, fiyat %10 düştüğünde NBD''si
    negatife döndüğü için fiyata karşı çok duyarlıdır.


    **(d) Sıralamanın nedeni**


    Nakit başabaş yalnızca nakit giderleri karşılar; muhasebe başabaş buna amortismanı (yatırımın geri kazanılan kısmını)
    ekler; finansal başabaş ise ayrıca paranın zaman değerini, yani yatırıma ilişkin %25 getiri talebini ve vergiyi karşılar.
    Her aşamada karşılanması gereken tutar arttığı için başabaş miktarı da artar.

