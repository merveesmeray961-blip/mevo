    (b) Karar ağacına göre pilot yatırımın beklenen NBD''sini hesaplayınız. (6 puan)


    (c) Genişleme ve terk seçenekleri olmadan (pilot yalnızca sürdürülürse) NBD''yi bulunuz ve opsiyonların toplam değerini
    hesaplayınız. (6 puan)


    (d) Genişleme yatırımı 8.000.000 TL''ye çıkarsa karar ve NBD nasıl değişir? Opsiyon değerini yeniden hesaplayınız. (5
    puan)

    '
