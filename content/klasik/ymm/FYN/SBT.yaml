- id: YMM-FYN-SBT-K011
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - artımsal (ilgili) nakit akımlarının belirlenmesi
  - batık maliyet, fırsat maliyeti ve kanibalizasyon
  - işletme sermayesi ve NBD hesabı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bora Oto Yedek Parça A.Ş., yeni bir ürün hattı için 1.500.000 TL bedelli makine alıp 3 yıl kullanacaktır (normal
    amortisman; 3 yılda eşit; bitiş değeri yoktur). Kurumlar vergisi oranı %20, iskonto oranı %25''dir. Proje ile ilgili bilgiler:


    1. Proje için geçen yıl yaptırılan fizibilite etüdüne 150.000 TL ödenmiştir (ödeme yapılmış, geri alınamaz).

    2. Proje, şirketin atıl durumdaki deposunda yürütülecektir. Depo projeye verilmezse yıllık 120.000 TL (vergi öncesi) kiraya
    verilebilecektir.

    3. Yeni ürün, şirketin mevcut bir ürününün satışlarını azaltacak ve bu ürünün vergi öncesi katkısını yıllık 200.000 TL
    düşürecektir.

    4. Yeni ürünün yıllık satış geliri 2.000.000 TL, nakit işletme giderleri 700.000 TL''dir.

    5. Projenin başlangıcında net işletme sermayesi 300.000 TL artacak, proje sonunda bu tutar geri dönecektir.

    6. Merkez yönetim giderlerinden projeye yıllık 100.000 TL pay verilmiştir; bu giderler proje olsa da olmasa da aynı tutarda
    gerçekleşecektir.

    7. Proje, 1.000.000 TL''lik makine kredisiyle finanse edilecek ve yıllık 250.000 TL faiz ödenecektir.


    Nakit akımları yıl sonlarında oluşur; şirketin yeterli vergi öncesi kârı vardır (zarar olursa vergi tasarrufu sağlanır).


    **İstenenler:**


    (a) Yukarıdaki yedi kalemi "ilgili/artımsal nakit akımı" ve "ilgisiz" olarak sınıflandırınız; her biri için kısa gerekçe
    veriniz. (8 puan)


    (b) Projenin 1–3. yıllardaki yıllık işletme nakit akımını (amortisman vergi kalkanı dahil) hesaplayınız. (6 puan)


    (c) Başlangıç yatırımını, 3. yıl sonu nakit akımını ve projenin NBD''sini bulunuz. (6 puan)


    (d) Bir analist 1. kalemi (batık maliyeti) ve 6. kalemi (paylaşılan gider) nakit akımına katmış, 2. ve 3. kalemleri ise
    atlamıştır. Bu analistin bulacağı NBD''yi hesaplayınız ve hatanın nedenini açıklayınız. (5 puan)

    '
  cozum: '**(a) Sınıflandırma**


    | Kalem | Sınıf | Gerekçe |

    |---|---|---|

    | 1. Fizibilite ödemesi | İlgisiz | Batık maliyet: proje kabul edilsin ya da edilmesin değişmez |

    | 2. Depo kira geliri | **İlgili** | Fırsat maliyeti: proje kabul edilirse vazgeçilen yıllık 120.000 TL (vergi öncesi)
    |

    | 3. Mevcut ürün satış kaybı | **İlgili** | Kanibalizasyon: proje yüzünden azalan katkı, artımsal bir giderdir |

    | 4. Satış geliri ve nakit giderler | **İlgili** | Projeden doğan artımsal gelir ve gider |

    | 5. İşletme sermayesi | **İlgili** | Başlangıç yatırımının parçası; sonda geri döner |

    | 6. Paylaştırılan merkez gideri | İlgisiz | Proje olsa da olmasa da aynı tutarda gerçekleşir; artımsal değildir |

    | 7. Faiz | İlgisiz (akıma dâhil edilmez) | Finansman maliyeti iskonto oranında yer alır; akıma katılırsa çift sayım olur
    |


    **(b) Yıllık işletme nakit akımı**


    Vergi öncesi artımsal kâr (amortisman hariç) = 2.000.000 − 700.000 − 200.000 − 120.000 = 980.000 TL.


    Amortisman = 1.500.000 / 3 = 500.000 TL (vergi kalkanı = 500.000 × %20 = 100.000 TL).


    OCF = 980.000 × (1 − 0,20) + 100.000 = 784.000 + 100.000 = **884.000 TL**.


    **(c) NBD**


    Başlangıç yatırımı (t = 0) = 1.500.000 + 300.000 = **1.800.000 TL**. 3. yıl sonu akımı = 884.000 + 300.000 = **1.184.000
    TL**.


    NBD = −1.800.000 + 884.000 × 1,952 + 300.000 × 0,512 = −1.800.000 + 1.725.568 + 153.600 = **79.168 TL** → proje kabul
    edilir.


    **(d) Hatalı analiz**


    Hatalı OCF = (2.000.000 − 700.000 − 100.000) × 0,8 + 100.000 = 1.060.000 TL (kanibalizasyon ve fırsat maliyeti dışarıda;
    ilgisiz paylaşım içeride).


    Hatalı NBD = −(1.800.000 + 150.000) + 1.060.000 × 1,952 + 153.600 = **272.720 TL**; doğru değerden 193.552 TL **fazla**.


    Hata: Fırsat maliyeti ve kanibalizasyon gerçek nakit kayıplarıdır, atlanmamalıdır; batık maliyet ve paylaşılan sabit gider
    artımsal değildir, dahil edilmemelidir. İki hata kısmen birbirini götürse de sonuç doğru değildir ve karar yanlış yönlendirilebilir.

    '
  puanlama:
  - olcut: (a) Yedi kalemin doğru sınıflandırılması
    puan: 5
  - olcut: (a) Gerekçeler (batık, fırsat maliyeti, kanibalizasyon, çift sayım)
    puan: 3
  - olcut: (b) Vergi öncesi artımsal kâr ve amortisman kalkanı
    puan: 3
  - olcut: (b) Yıllık OCF
    puan: 3
  - olcut: (c) Başlangıç yatırımı ve son yıl akımı
    puan: 2
  - olcut: (c) NBD
    puan: 4
  - olcut: (d) Hatalı NBD
    puan: 3
  - olcut: (d) Hatanın nedeni
    puan: 2
