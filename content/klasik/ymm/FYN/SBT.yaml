- id: YMM-FYN-SBT-K001
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - yatırım projelerinde nakit akışı tahmini
  - net bugünkü değer
  - karlılık endeksi
  - geri ödeme süresi
  - iç verim oranı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Deniz A.Ş. yeni bir ürün hattı kurmayı değerlendirmektedir. Proje verileri:


    - Makine bedeli (nakliye ve kurulum dahil): 600.000 TL. Vergi açısından 3 yılda normal (eşit tutarlı) amortismana tabidir;
    vergi bakımından hurda değeri sıfırdır.

    - Proje 3 yıl sürecektir. 3. yıl sonunda makinenin 187.500 TL''ye satılması beklenmektedir.

    - Proje başında 100.000 TL net işletme sermayesi gerekmektedir; proje sonunda tamamen geri kazanılacaktır.

    - Her yıl nakit satış tahsilatı 700.000 TL, nakit faaliyet gideri 350.000 TL''dir.

    - Geçen yıl proje için 30.000 TL fizibilite etüdü ücreti ödenmiştir.

    - Kurumlar vergisi oranı %20''dir; şirketin diğer faaliyetleri kârlıdır.

    - Sermaye maliyeti %25''tir; tüm nakit akışları (başlangıç yatırımı hariç) yıl sonlarında gerçekleşir.


    İskonto faktörleri: (1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512


    **İstenenler:**


    (a) Projenin başlangıç (t = 0) nakit çıkışını hesaplayınız; fizibilite etüdü ücretinin bu hesaptaki yerini gerekçesiyle
    açıklayınız. (4 puan)


    (b) Yıllık faaliyet nakit akışını ve 3. yıl sonundaki faaliyet dışı (son yıl) nakit akışlarını hesaplayarak projenin yıllık
    net nakit akışı tablosunu oluşturunuz. (8 puan)


    (c) Projenin net bugünkü değerini (NBD) ve karlılık endeksini (KE) hesaplayınız. (7 puan)


    (d) Projenin iskontolu geri ödeme süresini hesaplayınız (nakit girişleri yıl içine düzenli dağılmaktadır). Projenin iç
    verim oranının %25''ten büyük mü küçük mü olduğunu ek hesap yapmadan gerekçesiyle belirtiniz ve yatırım kararını veriniz.
    (6 puan)

    '
  cozum: '**(a) Başlangıç nakit çıkışı**


    | Kalem | Tutar (TL) |

    |---|---|

    | Makine (kurulum dahil) | 600.000 |

    | Net işletme sermayesi | 100.000 |

    | **Toplam t = 0 çıkışı** | **700.000** |


    Fizibilite etüdü ücreti (30.000 TL) geçmişte ödenmiş ve proje kabul edilse de edilmese de geri alınamayacak bir **batık
    maliyettir**; artımsal nakit akışı olmadığından hesaba katılmaz.


    **(b) Nakit akışları**


    Amortisman = 600.000 / 3 = 200.000 TL/yıl


    Faaliyet nakit akışı = (700.000 − 350.000 − 200.000) × (1 − 0,20) + 200.000 = 120.000 + 200.000 = **320.000 TL**

    (eşdeğer: 350.000 × 0,80 + 200.000 × 0,20 = 280.000 + 40.000)


    3. yıl sonu faaliyet dışı akışlar:

    - Makine satışı: defter değeri 0; satış kazancı 187.500; vergi 37.500 → vergi sonrası **150.000 TL**

    - İşletme sermayesi geri kazanımı: **100.000 TL**


    | Yıl | 0 | 1 | 2 | 3 |

    |---|---|---|---|---|

    | Net nakit akışı (TL) | −700.000 | 320.000 | 320.000 | 570.000 |


    **(c) NBD ve KE**


    | Yıl | Akış | Faktör | Bugünkü değer |

    |---|---|---|---|

    | 1 | 320.000 | 0,80 | 256.000 |

    | 2 | 320.000 | 0,64 | 204.800 |

    | 3 | 570.000 | 0,512 | 291.840 |

    | Toplam girişler | | | 752.640 |


    NBD = 752.640 − 700.000 = **52.640 TL**


    KE = 752.640 / 700.000 ≈ **1,075**


    **(d) İskontolu geri ödeme süresi ve İVO**


    Kümülatif bugünkü değer: 1. yıl 256.000; 2. yıl 460.800; 3. yıl 752.640.

    2. yıl sonunda karşılanmayan tutar = 700.000 − 460.800 = 239.200 TL

    İskontolu GÖS = 2 + 239.200 / 291.840 ≈ **2,82 yıl** (proje ömrü içinde geri ödenir).


    İVO: Nakit akışları olağandır (tek işaret değişimi) ve %25 iskonto oranında NBD pozitiftir. NBD iskonto oranı yükseldikçe
    azaldığından NBD''yi sıfırlayan oran %25''ten **büyüktür** (İVO > %25).


    Karar: NBD > 0, KE > 1, İVO > sermaye maliyeti ve iskontolu GÖS proje ömründen kısa olduğundan proje **kabul edilmelidir**.

    '
  puanlama:
  - olcut: (a) Başlangıç çıkışının 700.000 TL (makine + işletme sermayesi) bulunması
    puan: 2
  - olcut: (a) Fizibilite ücretinin batık maliyet olarak dışlanması ve gerekçesi
    puan: 2
  - olcut: (b) Amortisman ve yıllık faaliyet nakit akışının 320.000 TL bulunması
    puan: 3
  - olcut: (b) Makine satışının vergi sonrası tutarının 150.000 TL bulunması
    puan: 3
  - olcut: (b) İşletme sermayesi geri kazanımının eklenmesi ve nakit akışı tablosunun (3. yıl 570.000 TL) kurulması
    puan: 2
  - olcut: (c) Nakit girişlerinin bugünkü değerinin 752.640 TL ve NBD'nin 52.640 TL bulunması
    puan: 5
  - olcut: (c) KE'nin yaklaşık 1,075 bulunması
    puan: 2
  - olcut: (d) İskontolu geri ödeme süresinin yaklaşık 2,82 yıl bulunması
    puan: 3
  - olcut: (d) NBD > 0 olduğundan İVO > %25 sonucunun gerekçelendirilmesi ve kabul kararı
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — sermaye bütçelemesi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'amort = 600000/3

      fna = (700000-350000-amort)*0.8 + amort

      hurda = 187500*0.8

      akis = [fna, fna, fna + hurda + 100000]

      pv = [a/1.25**(i+1) for i, a in enumerate(akis)]

      nbd = sum(pv) - 700000

      ke = sum(pv)/700000

      gos = 2 + (700000 - pv[0] - pv[1])/pv[2]

      sonuc = {''baslangic'': 700000, ''fna'': fna, ''yil3'': akis[2], ''nbd'': round(nbd,2), ''ke'': round(ke,4), ''iskontolu_gos'':
      round(gos,2)}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
