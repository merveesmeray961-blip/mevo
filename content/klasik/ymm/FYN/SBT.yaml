    | Genişlerse (1. yıl sonunda 6.000.000 TL ek yatırımla) nakit girişlerinin 1. yıl sonundaki bugünkü değeri | Terk edilirse
    1. yıl sonunda elde edilecek net tutar |

    |---|---|---|---|---|

    | Başarılı | %40 | 3.000.000 | 10.000.000 | 1.000.000 |

    | Orta | %40 | 2.500.000 | 5.000.000 | 1.000.000 |

    | Başarısız | %20 | 500.000 | 1.000.000 | 1.000.000 |


    Genişleme ve terk kararları 1. yıl sonunda, sonuç belli olduktan sonra verilecektir; seçilen seçenekler dışında başka
    nakit akımı yoktur.


