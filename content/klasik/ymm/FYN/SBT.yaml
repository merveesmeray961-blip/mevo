- id: YMM-FYN-SBT-K004
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - enflasyonun sermaye bütçelemesine etkisi
  - reel ve nominal nakit akımlarının tutarlı iskontosu
  - amortisman vergi kalkanının nominal niteliği
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Aras Mobilya A.Ş., üç yıl ekonomik ömürlü yeni bir üretim hattı yatırımını değerlendirmektedir. Veriler:


    | Veri | Değer |

    |---|---|

    | Yatırım tutarı (t = 0) | 4.050.000 TL |

    | Amortisman | Normal yöntem, 3 yılda eşit; bitiş (hurda) değeri yok |

    | Vergi oranı | %20 |

    | Yıllık vergi sonrası işletme nakit akımı (amortisman vergi kalkanı hariç), **bugünkü satın alma gücüyle** ve her yıl
    aynı reel tutarda | 2.500.000 TL |

    | Beklenen yıllık enflasyon | %20 |

    | Yatırımcının **nominal** getiri talebi | %50 |


    İşletme nakit akımları yıl sonlarında oluşmaktadır; amortisman vergi kalkanı tarihsel maliyet üzerinden hesaplandığından
    enflasyonla artmaz (nominal sabittir).


    **İstenenler:**


    (a) Fisher denklemiyle reel iskonto oranını hesaplayınız. (3 puan)


    (b) Nominal nakit akımlarını yıl yıl bulup nominal oranla iskonto ederek projenin net bugünkü değerini (NBD) hesaplayınız.
    (8 puan)


    (c) Aynı NBD''yi reel yaklaşımla (tüm akımları bugünkü satın alma gücüne çevirerek reel oranla iskonto ederek) hesaplayınız
    ve (b) ile eşitliğini gösteriniz. (8 puan)


    (d) Bir analist amortisman vergi kalkanını da her yıl enflasyonla artan reel bir akım gibi ele alırsa NBD''yi ne kadar
    farklı bulur? Hatanın yönünü ve nedenini açıklayınız. (6 puan)

    '
  cozum: '**(a) Reel oran**


    (1 + %50) = (1 + reel) × (1 + %20) → reel = 1,50 / 1,20 − 1 = **%25**.


    **(b) Nominal yaklaşım**


    Yıllık amortisman = 4.050.000 / 3 = 1.350.000 TL; amortisman vergi kalkanı = 1.350.000 × %20 = 270.000 TL (nominal, her
    yıl aynı).


    İşletme nakit akımı enflasyonla artar: 2.500.000 × 1,20ᵗ.


    | Yıl | Nominal işletme akımı | Vergi kalkanı | Toplam nominal akım | İskonto çarpanı (1,5ᵗ) | Bugünkü değer |

    |---|---|---|---|---|---|

    | 1 | 3.000.000 | 270.000 | 3.270.000 | 1 / 1,5 | 2.180.000 |

    | 2 | 3.600.000 | 270.000 | 3.870.000 | 1 / 2,25 | 1.720.000 |

    | 3 | 4.320.000 | 270.000 | 4.590.000 | 1 / 3,375 | 1.360.000 |

    | **Toplam** | | | | | **5.260.000** |


    NBD = 5.260.000 − 4.050.000 = **1.210.000 TL** → proje kabul edilir. (İşletme akımlarının bugünkü değeri 4.880.000 TL,
    vergi kalkanlarının bugünkü değeri 380.000 TL.)


    **(c) Reel yaklaşım**


    İşletme akımları zaten reeldir: 2.500.000 × anüite çarpanı (reel %25, 3 yıl) = 2.500.000 × 1,952 = 4.880.000 TL.


    Vergi kalkanı nominal sabit olduğundan reel değeri her yıl enflasyonla küçülür: 225.000, 187.500, 156.250 TL; reel oranla
    iskonto edilince bugünkü değer = 380.000 TL.


    NBD (reel) = 4.880.000 + 380.000 − 4.050.000 = **1.210.000 TL** = (b) ile aynıdır. Nominal akımları nominal oranla, reel
    akımları reel oranla iskonto etmek aynı sonucu verir.


    **(d) Hatalı yaklaşım**


    Kalkan her yıl 270.000 TL reel akım gibi alınırsa bugünkü değeri 270.000 × 1,952 = 527.040 TL olur (doğru değer 380.000
    TL). Hatalı NBD = **1.357.040 TL**; NBD 147.040 TL **fazla** bulunur.


    Neden: Tarihsel maliyetle hesaplanan amortisman kalkanı nominal olarak sabit olduğundan enflasyon döneminde reel değer
    kaybeder; kalkanı enflasyonla artan bir akım saymak değerini olduğundan büyük gösterir.

    '
