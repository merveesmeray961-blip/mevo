  dogrulama:
    python: 'yat = 4050000

      vo = 0.20

      reel_akim = 2500000

      enf = 0.20

      nf = 0.50

      reel = (1 + nf) / (1 + enf) - 1

      amort = yat / 3

      kalkan = amort * vo

      op = [reel_akim * (1 + enf) ** t for t in (1, 2, 3)]

      nom = [op[i] + kalkan for i in range(3)]

      pv_op = [op[i] / (1 + nf) ** (i + 1) for i in range(3)]

      pv_kalkan = [kalkan / (1 + nf) ** (i + 1) for i in range(3)]

      toplam_pv = sum(pv_op) + sum(pv_kalkan)

      nbd = toplam_pv - yat

      reel_kalkan = [kalkan / (1 + enf) ** (i + 1) for i in range(3)]

      af = (1 - (1 + reel) ** -3) / reel

      pv_reel_op = reel_akim * af

      pv_reel_kalkan = sum(reel_kalkan[i] / (1 + reel) ** (i + 1) for i in range(3))

      nbd_reel = pv_reel_op + pv_reel_kalkan - yat

      hata_pv_kalkan = kalkan * af

      nbd_hata = pv_reel_op + hata_pv_kalkan - yat

      fark = nbd_hata - nbd

      sonuc = {"reel": reel, "kalkan": kalkan, "nbd": nbd, "nbd_reel": nbd_reel, "nbd_hata": nbd_hata, "fark": fark, "pv_kalkan":
      sum(pv_kalkan), "pv_op": sum(pv_op)}

      '
