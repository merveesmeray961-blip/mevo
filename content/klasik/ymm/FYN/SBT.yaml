  dogrulama:
    python: "t = 0.20\nf = [0.8, 0.64, 0.512, 0.4096]\nan = sum(f)\nbas = -1200000 + 300000 + (400000 - 300000) * t - 50000\n\
      yil = 400000 * (1 - t) + (300000 - 100000) * t\nson = 150000 * (1 - t) + 50000\nbd = yil * an + son * f[3]\nnbd = bd\
      \ + bas\nS_esik = (1200000 + 50000 - 400000 * t - bd) / (1 - t)\nsonuc = {\"baslangic\": bas, \"yillik\": yil, \"son_yil\"\
      : son, \"bd\": round(bd, 2), \"nbd\": round(nbd, 2),\n         \"S_esik\": round(S_esik, 2)}\n"
