  soru: 'Kule Plastik A.Ş., iki yıl ömürlü bir enjeksiyon hattı yatırımını değerlendirmektedir. Veriler:


    | Veri | Değer |

    |---|---|

    | Yatırım tutarı | 1.440.000 TL (2 yılda eşit amortisman, bitiş değeri yok) |

    | Birim satış fiyatı | 100 TL |

    | Birim değişken maliyet | 60 TL |

    | Yıllık sabit nakit giderler (amortisman hariç) | 400.000 TL |

    | Kurumlar vergisi oranı | %20 |

    | İskonto oranı | %25 |

    | Beklenen yıllık satış (temel durum) | 45.000 adet |


    İşletme sermayesi değişimi yoktur; nakit akımları yıl sonlarında oluşur. Vergi öncesi zarar oluşursa şirketin diğer faaliyetlerinden
    yeterli kârı bulunduğundan zarar kadar vergi tasarrufu sağlanacağı varsayılacaktır.


    **İstenenler:**


    (a) Üç başabaş noktasını bulunuz: **nakit başabaş** (nakit satış gelirinin değişken maliyet ve sabit nakit giderleri karşıladığı
    satış; vergi ve amortisman dikkate alınmaz), **muhasebe başabaş** (amortisman dahil vergi öncesi kârın sıfır olduğu satış)
    ve **finansal başabaş** (NBD''nin sıfır olduğu satış). (9 puan)


    (b) Temel durumda yıllık işletme nakit akımını, NBD''yi ve finansal başabaşa göre güvenlik marjını (%) hesaplayınız. (5
    puan)


    (c) Satış fiyatı 90 TL (kötümser), 100 TL (temel) veya 110 TL (iyimser) olabilir; olasılıklar sırasıyla %25, %50 ve %25''dir.
    Diğer veriler sabitken her senaryonun NBD''sini ve beklenen NBD''yi hesaplayınız. (7 puan)


    (d) Üç başabaş noktasının neden bu sırada (nakit < muhasebe < finansal) olduğunu açıklayınız. (4 puan)

