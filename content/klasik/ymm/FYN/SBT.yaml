- id: YMM-FYN-SBT-K003
  sinav: ymm
  ders: FYN
  konu: SBT
  kazanimlar:
  - net bugünkü değer
  - iç verim oranı ve düzeltilmiş iç verim oranı
  - karlılık endeksi
  - yıllık eşdeğer ve makine yenileme kararı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Ardıç Enerji A.Ş. aynı ihtiyacı karşılayan, birbirini dışlayan iki projeden birini seçecektir. Projeler ömürleri
    sonunda aynı koşullarla yenilenebilmektedir.


    | Proje | İlk yatırım (t = 0) | Yıllık net nakit girişi (yıl sonu) | Ömür |

    |---|---|---|---|

    | A | 1.000.000 TL | 500.000 TL | 3 yıl |

    | B | 1.600.000 TL | 500.000 TL | 6 yıl |


    Sermaye maliyeti %20''dir. Faktörler:


    | n | (1,20)^−n | (1,25)^−n | (1,20)^n |

    |---|---|---|---|

    | 1 | 0,833333 | 0,800000 | 1,200000 |

    | 2 | 0,694444 | 0,640000 | 1,440000 |

    | 3 | 0,578704 | 0,512000 | 1,728000 |

    | 4 | 0,482253 | 0,409600 | 2,073600 |

    | 5 | 0,401878 | 0,327680 | 2,488320 |

    | 6 | 0,334898 | 0,262144 | 2,985984 |


    Anüite (bugünkü değer) faktörleri: %20''de 3 yıl 2,106481, 6 yıl 3,325510; %25''te 3 yıl 1,952000, 6 yıl 2,951424. %20''de
    6 yıllık anüite gelecek değer faktörü 9,929920. Gerekirse: 1,82^(1/3) = 1,2209; 3,1031^(1/6) = 1,2077.


    **İstenenler:**


    (a) Her iki projenin net bugünkü değerini (NBD) ve karlılık endeksini (KE) hesaplayınız. (6 puan)


    (b) Her iki projenin iç verim oranını %20 ve %25 oranları arasında doğrusal enterpolasyonla hesaplayınız. (6 puan)


    (c) Ara nakit akışlarının sermaye maliyetiyle yeniden yatırıldığı varsayımıyla her iki projenin düzeltilmiş iç verim oranını
    (MIRR) hesaplayınız. (5 puan)


    (d) (a)–(c)''deki ölçütlerin sıralamasını karşılaştırınız. Ömür farkını gidermek için yıllık eşdeğer net hasıla yöntemini
    ve ikame zinciri yöntemini uygulayarak hangi projenin seçileceğine gerekçesiyle karar veriniz. (8 puan)

    '
  cozum: '**(a) NBD ve KE**


    - NBD_A = 500.000 × 2,106481 − 1.000.000 = 1.053.240,74 − 1.000.000 = **53.240,74 TL**

    - NBD_B = 500.000 × 3,325510 − 1.600.000 = 1.662.755,06 − 1.600.000 = **62.755,06 TL**

    - KE_A = 1.053.240,74 / 1.000.000 = **1,0532**; KE_B = 1.662.755,06 / 1.600.000 = **1,0392**


    Her iki proje tek başına kabul edilebilir (NBD > 0, KE > 1).


    **(b) İVO (enterpolasyon)**


    - %25''te NBD_A = 500.000 × 1,952 − 1.000.000 = −24.000 TL; NBD_B = 500.000 × 2,951424 − 1.600.000 = −124.288 TL

    - İVO ≈ r1 + (r2 − r1) × NBD1 / (NBD1 − NBD2)

    - İVO_A ≈ 20 + 5 × 53.240,74 / 77.240,74 = **%23,45**

    - İVO_B ≈ 20 + 5 × 62.755,06 / 187.043,06 = **%21,68**


    **(c) MIRR**


    - A: girişlerin 3. yıl sonu değeri = 500.000 × (1,44 + 1,20 + 1) = 1.820.000 TL; MIRR_A = (1.820.000 / 1.000.000)^(1/3)
    − 1 = 1,2209 − 1 = **%22,09**

    - B: girişlerin 6. yıl sonu değeri = 500.000 × 9,929920 = 4.964.960 TL; MIRR_B = (4.964.960 / 1.600.000)^(1/6) − 1 = 3,1031^(1/6)
    − 1 = **%20,77**


    Her iki MIRR de sermaye maliyeti ile İVO arasındadır; MIRR yeniden yatırım varsayımı açısından İVO''dan gerçekçidir.


    **(d) Ömür farkının giderilmesi**


    Yıllık eşdeğer net hasıla = NBD / anüite faktörü (r, n):

    - A: 53.240,74 / 2,106481 = **25.274,73 TL/yıl**

    - B: 62.755,06 / 3,325510 = **18.870,81 TL/yıl**


    İkame zinciri (ortak ömür 6 yıl; A bir kez yenilenir):

    - NBD_A(6 yıl) = 53.240,74 + 53.240,74 × (1,20)^−3 = 53.240,74 + 53.240,74 × 0,578704 = **84.051,35 TL** > NBD_B = 62.755,06
    TL


    | Ölçüt | A | B | Üstün |

    |---|---|---|---|

    | NBD (tek ömür) | 53.240,74 | 62.755,06 | B |

    | KE | 1,0532 | 1,0392 | A |

    | İVO | %23,45 | %21,68 | A |

    | MIRR | %22,09 | %20,77 | A |

    | Yıllık eşdeğer | 25.274,73 | 18.870,81 | A |

    | İkame zinciri NBD | 84.051,35 | 62.755,06 | A |


    Karar: Projeler birbirini dışlar ve yenilenebilir olduğundan farklı ömürlerdeki NBD''ler doğrudan karşılaştırılamaz. Ortak
    ömre getirildiğinde (yıllık eşdeğer ve ikame zinciri aynı sıralamayı verir) **A projesi seçilir**. B''nin tek ömür NBD
    üstünlüğü yalnız daha uzun süre değer üretmesinden kaynaklanmaktadır.

    '
  puanlama:
  - olcut: (a) NBD_A 53.240,74 ve NBD_B 62.755,06
    puan: 4
  - olcut: (a) KE 1,0532 ve 1,0392
    puan: 2
