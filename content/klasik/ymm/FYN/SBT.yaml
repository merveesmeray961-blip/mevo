  - eşdeğer yıllık anüite (EYA) yöntemi
  - tek seferlik proje ile zincirleme yenileme farkı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Altın Seramik A.Ş., 1.000.000 TL bedelli bir fırın satın almayı düşünmektedir. Fırının vergi sonrası yıllık işletme
    nakit akımları ile işletmeden ayrılırsa elde edilecek vergi sonrası net elden çıkarma (terk) değerleri aşağıdadır (TL;
    yıl sonları). Fırın en çok 3 yıl kullanılabilir. İskonto oranı %25''dir.


    | Yıl | İşletme nakit akımı | Yıl sonunda terk edilirse net elden çıkarma değeri |

    |---|---|---|

    | 1 | 600.000 | 700.000 |

    | 2 | 500.000 | 500.000 |

    | 3 | 400.000 | 300.000 |


    **İstenenler:**


    (a) Fırının 1, 2 ve 3. yıl sonunda terk edilmesi hâllerinde NBD''leri hesaplayınız. Fırın yenilenmeyecekse (tek seferlik
    proje) en uygun ömür nedir? (8 puan)


    (b) Her ömür için eşdeğer yıllık anüiteyi (EYA = NBD / anüite çarpanı) hesaplayınız. (6 puan)


    (c) Fırın aynı koşullarda süresiz olarak yenilenecekse en uygun ömrü belirleyiniz; (a) ile farkın nedenini açıklayınız.
    (6 puan)


    (d) Fırının 2. yıl sonunda terk edilmesi hâlinde 3. yılın marjinal getirisini hesaplayınız. Ardından zincirleme yenileme
    durumunda, 2. yıl sonundaki değerler üzerinden "fırını terk edip yenisini almak" ile "bir yıl daha kullanıp 3. yıl sonunda
    yenisini almak" seçeneklerini karşılaştırarak (yeni fırınlar 2 yıllık ömürle süresiz yenilenecektir) (c)''deki sonucu
    doğrulayınız. (5 puan)

    '
  cozum: 'İskonto çarpanları (%25): 1. yıl 0,8; 2. yıl 0,64; 3. yıl 0,512. Anüite çarpanları: 1 yıl 0,8; 2 yıl 1,44; 3 yıl
    1,952.


    **(a) NBD**


    | Ömür | Hesap | NBD |

    |---|---|---|

    | 1 yıl | (600.000 + 700.000) × 0,8 − 1.000.000 | **40.000** |

    | 2 yıl | 600.000 × 0,8 + (500.000 + 500.000) × 0,64 − 1.000.000 | **120.000** |

    | 3 yıl | 600.000 × 0,8 + 500.000 × 0,64 + (400.000 + 300.000) × 0,512 − 1.000.000 | **158.400** |


    Tek seferlik proje için NBD''si en yüksek ömür **3 yıl**dır (158.400 TL).


    **(b) Eşdeğer yıllık anüite**


    EYA₁ = 40.000 / 0,8 = **50.000**; EYA₂ = 120.000 / 1,44 = **83.333,33**; EYA₃ = 158.400 / 1,952 = **81.147,54** TL.


    **(c) Zincirleme yenileme**


    Fırın aynı koşullarda süresiz yenilenecekse farklı ömürler yıllık eşdeğer getiriyle karşılaştırılmalıdır; EYA''sı en yüksek
    ömür **2 yıl**dır (EYA₂ = 83.333,33 TL). Tek seferlik projede 3 yıl en iyi iken zincirde 2 yıl daha iyidir; çünkü 3. yılın
    katkısı, 2. yıl sonunda terk edip yeni bir fırına geçilmesiyle elde edilecek yıllık getirinin altında kalır. NBD''ler
    farklı sürelerde oluştuğundan doğrudan karşılaştırılamaz.


    **(d) Marjinal analiz**


    Marjinal getiri: 2. yıl sonunda terk etmek 500.000 TL getirir; bir yıl daha kullanmak 3. yılda 400.000 + 300.000 = 700.000
    TL getirir → 700.000 / 500.000 − 1 = **%40**. Bu oran %25''lik iskonto oranından yüksektir; tek seferlik projede 3. yıl
    da kullanılır (NBD en yüksek ömür 3 yıl).


    Zincirleme yenileme: 2 yıllık ömürle süresiz yenilenen yeni fırınlar zincirinin 2. yıl sonundaki NBD''si = EYA₂ / k =
    83.333,33 / 0,25 = 333.333,33 TL.


    - Terk edip yenisini almak (2. yıl sonu değeri): 500.000 + 333.333,33 = **833.333,33 TL**.

    - Bir yıl daha kullanıp 3. yıl sonunda yenisini almak (2. yıl sonu değeri): (700.000 + 333.333,33) / 1,25 = **826.666,67
    TL**.


    Fark = 6.666,67 TL **terk etmek** lehinedir; marjinal getiri %40 olsa da yeni fırınlar zincirinin bir yıl geciktirilmesinin
    maliyeti bunu aşar. Sonuç (c) ile uyumludur: zincirde en uygun ömür 2 yıldır.

    '
