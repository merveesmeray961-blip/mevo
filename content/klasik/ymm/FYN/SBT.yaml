  dogrulama:
    python: 'mak = 1500000

      vo = 0.20

      k = 0.25

      fiz = 150000

      kira = 120000

      kani = 200000

      gelir = 2000000

      gider = 700000

      nis = 300000

      paylasim = 100000

      faiz_kredi = 1000000

      faiz = 250000

      amort = mak / 3

      af = 1 / (1 + k) + 1 / (1 + k) ** 2 + 1 / (1 + k) ** 3

      vergi_oncesi = gelir - gider - kani - kira

      ocf = vergi_oncesi * (1 - vo) + amort * vo

      ilk = mak + nis

      son = ocf + nis

      pv_ocf = ocf * af

      pv_nis = nis / (1 + k) ** 3

      nbd = -ilk + pv_ocf + pv_nis

      # hatali analist

      vo_h = (gelir - gider - paylasim) * (1 - vo) + amort * vo

      nbd_h = -(ilk + fiz) + vo_h * af + pv_nis

      fark = nbd_h - nbd

      sonuc = {"ocf": ocf, "ilk": ilk, "son": son, "nbd": nbd, "vo_h": vo_h, "nbd_h": nbd_h, "fark": fark, "pv_ocf": pv_ocf,
      "pv_nis": pv_nis}

      '
