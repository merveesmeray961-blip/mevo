- id: YMM-FYN-SMR-K004
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - Modigliani-Miller (vergili) ve firma değeri
  - kaldıraçlı özkaynak maliyeti ve WACC
  - APV yöntemi ve borçla pay geri alımı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Güneş Kâğıt A.Ş. borçsuzdur ve kalıcı (süresiz) yıllık FVÖK''ü 4.000.000 TL''dir. Kurumlar vergisi oranı %25, borçsuz
    firmanın özkaynak maliyeti %20''dir. Kâr tamamen dağıtılmakta ve nakit akımları sabit kalmaktadır. Şirketin 1.000.000
    adet payı vardır. Yönetim, kalıcı 4.000.000 TL borç alıp (yıllık faiz %10, borç sürekli yenilenecek) bu tutarla pay geri
    alımı yapmayı düşünmektedir. Modigliani-Miller (vergili) varsayımları geçerlidir.


    **İstenenler:**


    (a) Borçsuz firmanın değerini (V_U) ve pay fiyatını hesaplayınız. (4 puan)


    (b) Borçlanma sonrası firma değerini, özkaynak değerini, kaldıraçlı özkaynak maliyetini ve WACC''yi hesaplayınız; WACC
    ile firma değerini kontrol ediniz. (8 puan)


    (c) Aynı değeri APV yöntemiyle (borçsuz değer + faiz vergi kalkanının bugünkü değeri) bulunuz. (5 puan)


    (d) Borçlanma duyurulduğunda pay fiyatının yeni değere göre ne olacağını, geri alınacak pay sayısını ve ortakların kazancını
    bulunuz. (8 puan)

    '
  cozum: '**(a)** NOPAT = 4.000.000 × (1 − %25) = 3.000.000 TL. V_U = 3.000.000 / %20 = **15.000.000 TL**; pay fiyatı = 15.000.000
    / 1.000.000 = **15 TL**.


    **(b)** V_L = V_U + t × D = 15.000.000 + %25 × 4.000.000 = **16.000.000 TL**. Özkaynak değeri E = 16.000.000 − 4.000.000
    = **12.000.000 TL**.


    r_E = r₀ + (r₀ − r_D)(1 − t)(D/E) = %20 + (%20 − %10) × 0,75 × (4.000.000 / 12.000.000) = **%22,50**.


    WACC = (E/V) r_E + (D/V) r_D (1 − t) = %75 × %22,50 + %25 × %10 × 0,75 = **%18,75**. Kontrol: 3.000.000 / 0,1875 = 16.000.000
    TL = V_L ✔.


    **(c)** Borç kalıcı olduğundan faiz vergi kalkanının bugünkü değeri = t × D = 1.000.000 TL. APV = 15.000.000 + 1.000.000
    = **16.000.000 TL** (V_L ile aynı).


    **(d)** Duyarlı piyasa duyurudan sonra firma değerini 16.000.000 TL olarak fiyatlar: pay fiyatı = 16.000.000 / 1.000.000
    = **16 TL**. 4.000.000 TL ile geri alınacak pay = 4.000.000 / 16 = **250.000 adet**; kalan pay = 750.000. Geri alım sonrası
    özkaynak 12.000.000 TL / 750.000 = 16 TL (fiyat değişmez).


    Ortakların toplam kazancı = 16.000.000 − 15.000.000 = **1.000.000 TL** (= vergi kalkanı); pay başına 1 TL (fiyat 15 →
    16). Kazancın tamamı mevcut ortaklara aittir; borç alacaklılarına kâr dağılmaz.

    '
  puanlama:
  - olcut: (a) V_U ve pay fiyatı
    puan: 4
  - olcut: (b) V_L ve E
    puan: 3
  - olcut: (b) r_E
    puan: 2
  - olcut: (b) WACC ve kontrol
    puan: 3
  - olcut: (c) APV
    puan: 5
  - olcut: (d) Duyuru sonrası fiyat ve geri alınan pay
    puan: 5
  - olcut: (d) Ortak kazancı
    puan: 3
