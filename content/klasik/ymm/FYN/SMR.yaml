  dogrulama:
    python: "t = 0.20\nnom = 1000\nkup = 0.20\nfiyat_t = 928\nip_nom = 100\nipd = 0.24\nipf = 0.04\noran = 20\npay_f = 40\n\
      ct_f = 1000\nre = 0.30\nw_t, w_i, w_e = 0.30, 0.10, 0.60\nk = kup * nom\n# YTM: ikili arama\nlo, hi = 0.0, 1.0\nfor\
      \ _ in range(100):\n    mid = (lo + hi) / 2\n    pv = k / (1 + mid) + (k + nom) / (1 + mid) ** 2\n    if pv > fiyat_t:\n\
      \        lo = mid\n    else:\n        hi = mid\nkd = round((lo + hi) / 2, 6)\nkd_s = kd * (1 - t)\nip_net = ip_nom *\
      \ (1 - ipf)\nip_m = ipd * ip_nom / ip_net\ntaban = k / (1 + kd) + (k + nom) / (1 + kd) ** 2\ndonusum_degeri = oran *\
      \ pay_f\ndonusum_fiyati = nom / oran\nprim_tl = ct_f - donusum_degeri\nprim_oran = ct_f / donusum_degeri - 1\nfiyat_primi\
      \ = donusum_fiyati / pay_f - 1\nopsiyon = ct_f - taban\nwacc = w_t * kd_s + w_i * ip_m + w_e * re\nsonuc = {\"kd\":\
      \ kd, \"kd_s\": kd_s, \"ip_m\": ip_m, \"taban\": taban, \"donusum_degeri\": donusum_degeri, \"donusum_fiyati\": donusum_fiyati,\
      \ \"prim_tl\": prim_tl, \"prim_oran\": prim_oran, \"fiyat_primi\": fiyat_primi, \"opsiyon\": opsiyon, \"wacc\": wacc}\n"
