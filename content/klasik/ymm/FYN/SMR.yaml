- id: YMM-FYN-SMR-K003
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - ağırlıklı ortalama sermaye maliyeti
  - CAPM ve beta
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Poyraz Kimya A.Ş.''nin sermaye yapısına ve piyasa koşullarına ilişkin veriler:


    | Kaynak | Veri |

    |---|---|

    | Adi pay | 1.000.000 adet, borsa fiyatı 18 TL; son dağıtılan pay başına kâr payı (D0) 2,40 TL; kâr paylarının süresiz
    olarak yıllık %20 büyümesi beklenmektedir |

    | İmtiyazlı pay | 30.000 adet, borsa fiyatı 100 TL; yıllık sabit kâr payı pay başına 24 TL |

    | Tahviller | Piyasa değeri 9.000.000 TL; vadeye kadar getirisi %24 (yeni borçlanma maliyeti de aynıdır) |


    Piyasa verileri: risksiz getiri %24; piyasa portföyünün beklenen getirisi %32; adi pay getirisi ile piyasa getirisi arasındaki
    kovaryans 0,0375; piyasa getirisinin varyansı 0,025. Kurumlar vergisi oranı %25''tir. Şirket mevcut piyasa değeri ağırlıklarını
    hedef sermaye yapısı olarak korumaktadır.


    Bu yıl yatırımlar için kullanılabilecek dağıtılmamış kâr 3.600.000 TL''dir; bu tutar aşılırsa yeni adi pay ihraç edilecek
    ve ihraç maliyeti pay fiyatının %10''u olacaktır. Borç ve imtiyazlı pay maliyetleri yatırım tutarından etkilenmeyecektir.
    Değerlendirilen bağımsız ve bölünemez projeler (aynı risk sınıfında):


    | Proje | Yatırım tutarı | İç verim oranı |

    |---|---|---|

    | X | 3.000.000 TL | %32 |

    | Y | 3.000.000 TL | %31 |

    | Z | 2.000.000 TL | %30 |


    **İstenenler:**


    (a) Payın betasını hesaplayınız; özkaynak maliyetini CAPM ile bulunuz ve Gordon modeliyle doğrulayınız. (6 puan)


    (b) Piyasa değeri ağırlıklarını, imtiyazlı pay maliyetini, vergi sonrası borç maliyetini ve ağırlıklı ortalama sermaye
    maliyetini (AOSM) hesaplayınız. (6 puan)


    (c) Yeni pay ihracının maliyetini, marjinal sermaye maliyeti eğrisindeki kırılma noktasını ve kırılma noktasından sonraki
    AOSM''yi hesaplayınız. (7 puan)


    (d) Marjinal sermaye maliyetini yatırım fırsatlarıyla karşılaştırarak kabul edilecek projeleri ve optimal sermaye bütçesini
    belirleyiniz; bu bütçenin finansman dağılımını (borç, imtiyazlı pay, dağıtılmamış kâr) gösteriniz. (6 puan)

    '
  cozum: '**(a) Beta ve özkaynak maliyeti**


    - β = Kov(ri, rm) / Var(rm) = 0,0375 / 0,025 = **1,5**

    - CAPM: ke = rf + β × (rm − rf) = 24 + 1,5 × (32 − 24) = **%36**

    - Gordon: D1 = 2,40 × 1,20 = 2,88 TL; ke = D1 / P0 + g = 2,88 / 18 + 0,20 = 0,16 + 0,20 = **%36** (iki yöntem aynı sonucu
    verir)


    **(b) Ağırlıklar ve AOSM**


    | Kaynak | Piyasa değeri | Ağırlık | Maliyet | Ağırlıklı |

    |---|---|---|---|---|

    | Adi pay | 1.000.000 × 18 = 18.000.000 | 0,60 | %36 | %21,60 |

    | İmtiyazlı pay | 30.000 × 100 = 3.000.000 | 0,10 | 24 / 100 = %24 | %2,40 |

    | Borç | 9.000.000 | 0,30 | 24 × (1 − 0,25) = %18 | %5,40 |

    | Toplam | 30.000.000 | 1,00 | | **AOSM = %29,40** |


    İmtiyazlı kâr payı vergi matrahından indirilemediği için kp''ye vergi düzeltmesi yapılmaz; borç maliyeti vergi sonrası
    alınır.


    **(c) Yeni pay maliyeti ve kırılma noktası**


    - Yeni pay maliyeti: ke'' = D1 / [P0 × (1 − f)] + g = 2,88 / (18 × 0,90) + 0,20 = 2,88 / 16,20 + 0,20 = 0,1778 + 0,20
    = **%37,78**

    - Kırılma noktası = Dağıtılmamış kâr / özkaynak ağırlığı = 3.600.000 / 0,60 = **6.000.000 TL**

