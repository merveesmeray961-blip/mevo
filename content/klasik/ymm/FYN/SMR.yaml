      r0 = 0.15

      t = 0.20

      sk = 0.20

      o0, o1, o2, o3 = 0.0, 0.02, 0.08, 0.45

      D = [0, 10000000, 20000000, 30000000]

      o = [o0, o1, o2, o3]

      kalkan = [t * d for d in D]

      kayip = vu * sk

      bek = [x * kayip for x in o]

      vl = [vu + kalkan[i] - bek[i] for i in range(4)]

      en_iyi = vl.index(max(vl))

      d_kalkan = kalkan[3] - kalkan[2]

      d_bek = bek[3] - bek[2]

      net = d_kalkan - d_bek

      nopat = vu * r0

      w = [nopat / v for v in vl]

      en_dusuk_w = w.index(min(w))

      sonuc = {"vl0": vl[0], "vl1": vl[1], "vl2": vl[2], "vl3": vl[3], "d_kalkan": d_kalkan, "d_bek": d_bek, "net": net, "w0":
      w[0], "w1": w[1], "w2": w[2], "w3": w[3], "optimal": D[en_iyi]}

      '
