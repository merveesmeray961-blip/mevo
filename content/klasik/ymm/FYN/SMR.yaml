- id: YMM-FYN-SMR-K001
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - ağırlıklı ortalama sermaye maliyeti
  - CAPM ve beta
  - finansal kaldıraç
  - optimal sermaye yapısı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ege A.Ş.''ye ilişkin bilgiler şöyledir:


    - Dolaşımdaki pay sayısı 200.000 adet, pay fiyatı 15 TL.

    - Tek borç kalemi 2.000.000 TL tutarındaki banka kredisidir; yıllık faiz oranı %20''dir ve kredinin piyasa değeri defter
    değerine eşittir.

    - Payın betası 1,38; risksiz getiri %15; piyasa portföyünün beklenen getirisi %25.

    - Kurumlar vergisi oranı %20; imtiyazlı pay yoktur.

    - Son yıl gelir tablosu: satışlar 10.000.000 TL, değişken giderler 6.000.000 TL, sabit faaliyet giderleri 2.000.000 TL;
    faiz gideri yukarıdaki kredinin faizidir.


    Beta düzeltmelerinde βL = βU × [1 + (1 − t) × B/Ö] eşitliği kullanılacaktır.


    **İstenenler:**


    (a) Piyasa değeri ağırlıklarını, CAPM ile özkaynak maliyetini ve vergi sonrası borç maliyetini hesaplayınız. (6 puan)


    (b) Şirketin AOSM''sini hesaplayınız. (4 puan)


    (c) Faaliyet, finansal ve birleşik kaldıraç derecelerini ve mevcut hisse başına kârı (HBK) hesaplayınız. Satışların %10
    artması durumunda yeni HBK''yı kaldıraç derecesini kullanarak bulunuz. (8 puan)


    (d) Yönetim, pay geri alımı yaparak borç oranını (piyasa değeriyle) %60''a çıkarmayı düşünmektedir. Bu yapıda borcun vergi
    öncesi maliyeti %25''e yükselecektir. Kaldıraçsız betayı ve yeni yapıdaki kaldıraçlı betayı hesaplayarak yeni AOSM''yi
    bulunuz; faaliyet nakit akışlarının değişmediği varsayımıyla bu değişikliğin firma değerini artırıp artırmayacağını değerlendiriniz.
    (7 puan)

    '
  cozum: '**(a) Ağırlıklar ve bileşen maliyetleri**


    Özkaynak PD = 200.000 × 15 = 3.000.000 TL; borç = 2.000.000 TL; toplam 5.000.000 TL.

    Ağırlıklar: özkaynak **%60**, borç **%40**; B/Ö = 2/3.


    ke = rf + β × (Rm − rf) = 15 + 1,38 × (25 − 15) = **%28,8**


    kd(1 − t) = 20 × 0,80 = **%16**


    **(b) AOSM**


    AOSM = 0,60 × 28,8 + 0,40 × 16 = 17,28 + 6,40 = **%23,68**


    **(c) Kaldıraç dereceleri ve HBK**


    | Kalem | TL |

    |---|---|

    | Satışlar | 10.000.000 |

    | Değişken giderler | (6.000.000) |

    | Katkı payı | 4.000.000 |

    | Sabit faaliyet giderleri | (2.000.000) |

    | FVÖK | 2.000.000 |

    | Faiz (2.000.000 × %20) | (400.000) |

    | Vergi öncesi kâr | 1.600.000 |

    | Vergi (%20) | (320.000) |

    | Net kâr | 1.280.000 |


    HBK = 1.280.000 / 200.000 = **6,40 TL**


    FKD (faaliyet) = Katkı payı / FVÖK = 4.000.000 / 2.000.000 = **2**

    FinKD (finansal) = FVÖK / (FVÖK − Faiz) = 2.000.000 / 1.600.000 = **1,25**

    BKD (birleşik) = 2 × 1,25 = **2,5**


    Satışlar %10 artarsa HBK %10 × 2,5 = %25 artar: yeni HBK = 6,40 × 1,25 = **8,00 TL**

    (Kontrol: katkı payı 4.400.000; FVÖK 2.400.000; VÖK 2.000.000; net kâr 1.600.000; HBK 8,00 TL.)


    **(d) Yeniden kaldıraçlandırma ve karar**


    Kaldıraçsız beta: βU = 1,38 / [1 + 0,8 × (2/3)] = 1,38 / 1,5333 = **0,90**


    Yeni yapı: borç %60, özkaynak %40 → B/Ö = 1,5

    βL = 0,90 × (1 + 0,8 × 1,5) = 0,90 × 2,2 = **1,98**


    ke = 15 + 1,98 × 10 = **%34,8**; kd(1 − t) = 25 × 0,8 = **%20**


    Yeni AOSM = 0,40 × 34,8 + 0,60 × 20 = 13,92 + 12 = **%25,92**


    Değerlendirme: Faaliyet nakit akışları değişmezken AOSM %23,68''den %25,92''ye yükselmektedir; iskonto oranı arttığı için
    firma değeri **düşer**. Borcun ek vergi kalkanı faydası, yükselen borç maliyeti ve finansal risk nedeniyle artan özkaynak
    maliyetiyle aşılmaktadır (dengeleme teorisi). Önerilen yapıya geçilmemelidir.

    '
  puanlama:
  - olcut: (a) Piyasa değeri ağırlıklarının %60 / %40 bulunması
    puan: 2
  - olcut: (a) CAPM ile özkaynak maliyetinin %28,8 bulunması
    puan: 2
  - olcut: (a) Vergi sonrası borç maliyetinin %16 bulunması
    puan: 2
  - olcut: (b) AOSM'nin %23,68 hesaplanması
    puan: 4
  - olcut: (c) Gelir tablosunun kurulması ve HBK'nın 6,40 TL bulunması
    puan: 2
  - olcut: (c) Faaliyet (2) ve finansal (1,25) kaldıraç derecelerinin hesaplanması
    puan: 3
  - olcut: (c) Birleşik kaldıraç (2,5) ve %10 satış artışında yeni HBK'nın 8,00 TL bulunması
    puan: 3
  - olcut: (d) Kaldıraçsız betanın 0,90 ve yeni kaldıraçlı betanın 1,98 bulunması
    puan: 3
  - olcut: (d) Yeni özkaynak maliyeti (%34,8) ve yeni AOSM'nin %25,92 bulunması
    puan: 3
  - olcut: (d) AOSM yükseldiği için firma değerinin düşeceği ve yapı değişikliğinin reddi
    puan: 1
  kaynaklar:
  - mevzuat: Genel bilgi — sermaye maliyeti ve sermaye yapısı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'e = 200000*15

      d = 2000000

      we = e/(e+d)

      wd = d/(e+d)

      ke = 15 + 1.38*10

      kd = 20*0.8

      aosm = we*ke + wd*kd

      fvok = 10000000 - 6000000 - 2000000

      faiz = d*0.20

      hbk = (fvok - faiz)*0.8/200000

      dol = 4000000/fvok

      dfl = fvok/(fvok - faiz)

      dtl = dol*dfl

      yeni_hbk = hbk*(1 + 0.10*dtl)

      bu = 1.38/(1 + 0.8*d/e)

      bl = bu*(1 + 0.8*1.5)

      ke2 = 15 + bl*10

      aosm2 = 0.4*ke2 + 0.6*25*0.8

      sonuc = {''we'': round(we,2), ''ke'': round(ke,2), ''aosm'': round(aosm,2), ''hbk'': round(hbk,2), ''dol'': dol, ''dfl'':
      dfl, ''dtl'': dtl, ''yeni_hbk'': round(yeni_hbk,2), ''beta_u'': round(bu,4), ''beta_l_yeni'': round(bl,4), ''ke_yeni'':
      round(ke2,2), ''aosm_yeni'': round(aosm2,2)}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
