  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fvok = 4000000

      t = 0.25

      r0 = 0.20

      rd = 0.10

      borc = 4000000

      pay = 1000000

      nopat = fvok * (1 - t)

      vu = nopat / r0

      p0 = vu / pay

      vl = vu + t * borc

      e = vl - borc

      re = r0 + (r0 - rd) * (1 - t) * borc / e

      wacc = e / vl * re + borc / vl * rd * (1 - t)

      vl_kontrol = nopat / wacc

      kalkan = t * borc

      apv = vu + kalkan

      p1 = vl / pay

      geri = borc / p1

      kalan = pay - geri

      p_son = e / kalan

      kazanc = vl - vu

      kazanc_pay = kazanc / pay

      sonuc = {"vu": vu, "p0": p0, "vl": vl, "e": e, "re": re, "wacc": wacc, "vl_kontrol": vl_kontrol, "apv": apv, "p1": p1,
      "geri": geri, "kalan": kalan, "p_son": p_son, "kazanc": kazanc}

      '
