      rm = 0.30

      irr = 0.30

      bu1 = b1 / (1 + (1 - t) * de1)

      bu2 = b2 / (1 + (1 - t) * de2)

      bu = (bu1 + bu2) / 2

      bl = bu * (1 + (1 - t) * hde)

      re = rf + bl * (rm - rf)

      w_e = 1 / (1 + hde)

      w_d = hde / (1 + hde)

      kd_s = kd * (1 - t)

