    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-FYN-SMR-K002
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - finansal kaldıraç ve FAVÖK-HBK analizi
  - optimal sermaye yapısı ve sermaye yapısı teorileri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Zirve Gıda A.Ş.''nin dolaşımda 1.000.000 adet payı ve %20 faizli 5.000.000 TL banka kredisi vardır. Şirket 10.000.000
    TL tutarında kapasite artırımı yatırımı yapacaktır; yatırımdan sonra yıllık faiz ve vergi öncesi kârın (FVÖK) 8.000.000
    TL olması beklenmektedir. Kurumlar vergisi oranı %25''tir. Değerlendirilen finansman planları:


    | Plan | Finansman |

    |---|---|

    | A | Pay başına 40 TL''den yeni pay ihracı (ihraç maliyeti yok) |

    | B | %30 faizli 10.000.000 TL tahvil ihracı |

    | C | Yıllık %24 sabit kâr paylı 10.000.000 TL imtiyazlı pay ihracı (imtiyazlı kâr payı vergi matrahından indirilemez)
    |


    Hisse başına kâr (HBK), adi paylara düşen net kârın adi pay sayısına bölümüdür.


    **İstenenler:**


    (a) Her plan için beklenen FVÖK düzeyinde HBK''yi ve finansal kaldıraç derecesini hesaplayınız. (8 puan)


    (b) A–B ve A–C planları arasındaki kayıtsızlık (FAVÖK-HBK eşitlik) noktalarını ve bu noktalardaki HBK''yi hesaplayınız;
    beklenen FVÖK düzeyine göre hangi planın seçileceğini gerekçesiyle belirtiniz. (8 puan)


    (c) Her plan için HBK''yi sıfır yapan FVÖK düzeyini (finansal başabaş noktası) bulunuz ve planların finansal riskini karşılaştırınız.
    (4 puan)


    (d) Kurumlar vergili Modigliani-Miller yaklaşımına göre B planının firma değerine etkisini hesaplayınız. Dengeleme (ödünleşme)
    kuramı ile finansman hiyerarşisi kuramının bu kararla ilgili öngörülerini açıklayınız. (5 puan)

    '
  cozum: '**(a) HBK ve FKD** (mevcut faiz 1.000.000 TL)


    | | A | B | C |

    |---|---|---|---|

    | FVÖK | 8.000.000 | 8.000.000 | 8.000.000 |

    | Faiz | (1.000.000) | (4.000.000) | (1.000.000) |

    | Vergi öncesi kâr | 7.000.000 | 4.000.000 | 7.000.000 |

    | Vergi (%25) | (1.750.000) | (1.000.000) | (1.750.000) |

    | Net kâr | 5.250.000 | 3.000.000 | 5.250.000 |

    | İmtiyazlı kâr payı | – | – | (2.400.000) |

    | Adi paylara kalan | 5.250.000 | 3.000.000 | 2.850.000 |

    | Pay sayısı | 1.250.000 | 1.000.000 | 1.000.000 |

    | **HBK** | **4,20** | **3,00** | **2,85** |


    A''da yeni pay = 10.000.000 / 40 = 250.000 adet.

    - FKD = FVÖK / [FVÖK − Faiz − İmtiyazlı kâr payı / (1 − t)]

    - A: 8.000.000 / 7.000.000 = **1,1429**; B: 8.000.000 / 4.000.000 = **2,00**; C: 8.000.000 / (8.000.000 − 1.000.000 −
    3.200.000) = **2,1053**


    **(b) Kayıtsızlık noktaları**


    - A–B: (FVÖK − 1.000.000) × 0,75 / 1.250.000 = (FVÖK − 4.000.000) × 0,75 / 1.000.000 → FVÖK − 1.000.000 = 1,25 FVÖK −
    5.000.000 → **FVÖK* = 16.000.000 TL**; HBK = 15.000.000 × 0,75 / 1.250.000 = **9,00 TL**

    - A–C: (FVÖK − 1.000.000) × 0,75 / 1.250.000 = [(FVÖK − 1.000.000) × 0,75 − 2.400.000] / 1.000.000 → 0,60 (FVÖK − 1.000.000)
    = 0,75 (FVÖK − 1.000.000) − 2.400.000 → 0,15 (FVÖK − 1.000.000) = 2.400.000 → **FVÖK* = 17.000.000 TL**; HBK = 16.000.000
    × 0,75 / 1.250.000 = **9,60 TL**


    Beklenen FVÖK (8.000.000 TL) her iki kayıtsızlık noktasının altındadır; bu bölgede sabit finansman yükü HBK''yi düşürür.
    En yüksek HBK''yi veren **A planı (pay ihracı) seçilir**. FVÖK 16.000.000 TL''yi aşarsa B, A''dan üstün olur.


    **(c) Finansal başabaş noktaları**


    - A: FVÖK = 1.000.000 TL

    - B: FVÖK = 4.000.000 TL

    - C: FVÖK = 1.000.000 + 2.400.000 / 0,75 = **4.200.000 TL**


    Başabaş noktası yükseldikçe HBK''nin sıfıra düşme olasılığı ve finansal risk artar: risk sıralaması C > B > A. C planı,
    FKD''si ve başabaşı en yüksek olduğu hâlde, imtiyazlı kâr payının vergi kalkanı sağlamaması nedeniyle her FVÖK düzeyinde
    B''den düşük HBK verir (aynı pay sayısı, daha yüksek vergi öncesi yük).


    **(d) Teoriler**


    - **MM (kurumlar vergili):** VL = VU + t × B. B planıyla değer artışı = 0,25 × 10.000.000 = **2.500.000 TL** (faiz vergi
    kalkanının bugünkü değeri). Bu yaklaşım borç arttıkça değerin sürekli arttığını ve en yüksek borcu öngörür.

    - **Dengeleme kuramı:** Vergi kalkanının faydası, borç arttıkça büyüyen finansal sıkıntı ve iflas maliyetleri ile dengelenir;
    optimum borç düzeyi marjinal faydanın marjinal maliyete eşitlendiği noktadır. Beklenen FVÖK''ün kayıtsızlık noktasının
    çok altında ve B planının başabaşının yüksek olması, ek borcun maliyetinin faydasını aşabileceğine işaret eder.

    - **Finansman hiyerarşisi:** Bilgi asimetrisi nedeniyle işletmeler önce iç kaynak, sonra borç, en son yeni pay kullanır;
    yeni pay ihracı piyasaya "pay aşırı değerli" sinyali verebilir. Bu kurama göre iç kaynak yetersizse B planı A''ya tercih
    edilir; HBK analizi ise A''yı öne çıkarmaktadır. Karar, risk tutumu ve kontrol kaygısıyla birlikte verilmelidir.

    '
  puanlama:
  - olcut: (a) Üç planın gelir tablosu ve HBK (4,20; 3,00; 2,85)
    puan: 5
  - olcut: (a) FKD'ler (imtiyazlı kâr payının vergi öncesine çevrilmesi dahil)
    puan: 3
  - olcut: (b) A–B kayıtsızlık 16.000.000 TL ve HBK 9,00
    puan: 3
  - olcut: (b) A–C kayıtsızlık 17.000.000 TL ve HBK 9,60
    puan: 3
  - olcut: (b) Beklenen FVÖK'e göre A kararı
    puan: 2
  - olcut: (c) Finansal başabaş noktaları ve risk sıralaması
    puan: 4
  - olcut: (d) MM vergili değer artışı 2.500.000 TL
    puan: 2
  - olcut: (d) Dengeleme ve finansman hiyerarşisi kuramları
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — Finansal kaldıraç ve FAVÖK-HBK analizi
    madde: '-'
  - mevzuat: Genel bilgi — Optimal sermaye yapısı ve sermaye yapısı teorileri
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "E, t = 8000000, 0.25\nhA = (E - 1e6) * (1 - t) / 1.25e6\nhB = (E - 4e6) * (1 - t) / 1e6\nhC = ((E - 1e6) * (1\
      \ - t) - 2.4e6) / 1e6\nfA = E / (E - 1e6); fB = E / (E - 4e6); fC = E / (E - 1e6 - 2.4e6 / (1 - t))\n# A-B: (x-1e6)/1.25\
      \ = x-4e6\nxAB = (5e6 - 1e6) / 0.25\n# A-C: 0.15 (x-1e6) = 2.4e6\nxAC = 2.4e6 / 0.15 + 1e6\nsonuc = {\"hbkA\": round(hA,\
      \ 4), \"hbkB\": round(hB, 4), \"hbkC\": round(hC, 4), \"fkdA\": round(fA, 4),\n         \"fkdB\": round(fB, 4), \"fkdC\"\
      : round(fC, 4), \"xAB\": xAB, \"hbkAB\": (xAB - 1e6) * 0.75 / 1.25e6,\n         \"xAC\": xAC, \"hbkAC\": (xAC - 1e6)\
      \ * 0.75 / 1.25e6, \"bbC\": 1e6 + 2.4e6 / 0.75, \"mm\": 0.25 * 1e7}\n"
