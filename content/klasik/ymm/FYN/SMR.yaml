- id: YMM-FYN-SMR-K010
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - 'özkaynak maliyeti: CAPM, Gordon ve tahvil getirisi + risk primi'
  - 'sürdürülebilir büyüme: g = b × ÖKK'
  - yeni pay ihracı maliyeti ve WACC
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kıyı Seramik A.Ş. borsada işlem görmektedir. Veriler: pay fiyatı 45 TL; geçen yıl pay başına kazanç (PBK₀) 6 TL,
    kâr payı (D₀) 3 TL; özkaynak kârlılığı (ÖKK) %40 sabit kalacaktır; kâr dağıtım politikası aynıdır. Risksiz faiz %20, piyasa
    risk primi %8, pay betası 1,1''dir. Şirketin benzer riskteki uzun vadeli tahvilinin getirisi %24 ve analistlerin tahvile
    eklediği risk primi %5''dir. Yeni pay ihracında ihraç maliyeti %20''dir. Borç/varlık %40, vergi sonrası borç maliyeti
    %21''dir.


    **İstenenler:**


    (a) Büyüme oranını g = b × ÖKK ile bulunuz; üç yöntemle (Gordon, CAPM, tahvil getirisi + risk primi) özkaynak maliyetini
    hesaplayıp ortalamasını alınız. (9 puan)


    (b) Yeni pay ihracının maliyetini Gordon modeliyle bulunuz. (4 puan)


    (c) Özkaynak maliyeti olarak (a)''daki ortalamayı kullanarak WACC''yi; yeni pay ihraç edilirse (b)''deki maliyetle WACC''yi
    hesaplayınız. (6 puan)


    (d) Ödeme oranı %75''e çıkarılırsa (ÖKK sabit) büyüme oranını, D₁''i ve pay fiyatının 45 TL''de kaldığı varsayımıyla Gordon
    maliyetini hesaplayınız; bu varsayımın neden gerçekçi olmadığını açıklayınız. (6 puan)

    '
  cozum: '**(a)** Ödeme oranı = 3 / 6 = %50; alıkoyma oranı b = %50; **g = %50 × %40 = %20**; D₁ = 3 × 1,20 = 3,6 TL.

    - Gordon: 3,6 / 45 + %20 = **%28**

    - CAPM: %20 + 1,1 × %8 = **%28,8**

    - Tahvil getirisi + risk primi: %24 + %5 = **%29**

    - Ortalama = (%28 + %28,8 + %29) / 3 = **%28,6**


    **(b)** Net ihraç fiyatı = 45 × 0,80 = 36 TL → r_yeni = 3,6 / 36 + %20 = **%30**.


    **(c)** WACC (iç özkaynak) = 0,60 × %28,6 + 0,40 × %20,8 = **%25,48**. WACC (yeni pay) = 0,60 × %30 + 0,40 × %20,8 = **%26,32**.
    İhraç maliyeti marjinal sermaye maliyetini yaklaşık 0,84 puan yükseltir.


    **(d)** b = 0,25 → g = 0,25 × %40 = **%10**; PBK₁ = 6 × 1,10; D₁ = 0,75 × PBK₁ = **4,95 TL**; r = 4,95 / 45 + %10 = **%21**.


    Gordon maliyetinin düşmesi yanıltıcıdır: Yeni politikada büyüme oranı yarıya inmiş, yeniden yatırıma ayrılan kâr azalmıştır.
    Pay fiyatının sabit kalması gerçekçi değildir, çünkü gelecek temettü ve büyüme beklentileri değişince fiyat da değişir;
    Gordon modelinde fiyat ve politika birlikte belirlenir.

    '
