    tercih edilmelidir.


    **(c)** PV = 250.000 × (0,8 + 0,64 + 0,512) = 250.000 × 1,952 = **488.000 TL**. Bu tutar peşin fiyattan düşüktür → ödemeler
    yıl sonlarında yapılırsa **kiralama** tercih edilir. Ödeme zamanlaması karar sonucunu değiştirmiştir.


    **(d)** Dönem başı: 600.000 / 2,44 = **245.901,64 TL**; dönem sonu: 600.000 / 1,952 = **307.377,05 TL**.


