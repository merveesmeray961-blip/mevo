      \ g) - 1\naf = (1 - (1 + reel) ** -n) / reel\nbd_reel = C / (1 + g) * af\nfv = 500000 * (1 + r) ** 3\nyat = (bd - fv)\
      \ / (((1 + r) ** 3 - 1) / r)\nsonuc = {\"bd_emeklilik\": round(bd, 2), \"reel\": round(reel, 4), \"bd_reel\": round(bd_reel,\
