- id: YMM-FYN-ZDP-K001
  sinav: ymm
  ders: FYN
  konu: ZDP
  kazanimlar:
  - tahvil değerlemesi
  - hisse senedi değerlemesi (Gordon modeli)
  - anüite
  - bugünkü ve gelecek değer
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ada A.Ş.''nin finans müdürü, şirketin atıl fonları ve gelecekteki yatırım ihtiyacı için aşağıdaki değerlendirmeleri
    yapmaktadır. Tüm nakit akışları yıl sonlarında gerçekleşmektedir; vergi ve işlem maliyeti yoktur.


    **İskonto faktörleri:**


    | Oran | 1 yıl | 2 yıl | 3 yıl |

    |---|---|---|---|

    | %25 → (1,25)^−n | 0,80 | 0,64 | 0,512 |

    | %25 → (1,25)^n | 1,25 | 1,5625 | 1,953125 |

    | %20 → (1,20)^n | 1,20 | 1,44 | 1,728 |


    1. **Tahvil:** Nominal değeri 1.000 TL, yıllık kupon oranı %20, vadesine 3 yıl kalan bir tahvil; piyasa getirisi %25.

    2. **Pay:** B A.Ş. az önce pay başına 3 TL kâr payı (D0) dağıtmıştır. Kâr payının önümüzdeki iki yıl her yıl %20, sonrasında
    süresiz olarak her yıl %8 büyümesi beklenmektedir. Payın gerekli getiri oranı %20, borsa fiyatı 30 TL''dir.

    3. **Birikim:** Şirket 3 yıl sonra makine yenilemesi için 762.500 TL biriktirmek istemektedir; fon yıllık %25 bileşik
    getiri sağlayacaktır.


    **İstenenler:**


    (a) Tahvilin bugünkü değerini hesaplayınız ve tahvilin primli mi iskontolu mu işlem gördüğünü gerekçesiyle belirtiniz.
    (6 puan)


    (b) Piyasa getirisi bir yıl boyunca %25''te kalırsa, tahvilin bir yıl sonraki (kupon ödendikten hemen sonraki) değerini
    ve tahvili bugün alıp bir yıl sonra satan yatırımcının elde tutma getirisini (%) hesaplayınız; sonucu yorumlayınız. (6
    puan)


    (c) B A.Ş. payının içsel değerini hesaplayınız ve pay için al/alma kararını gerekçesiyle belirtiniz. (7 puan)


    (d) Birikim hedefine ulaşmak için yatırılması gereken eşit tutarları, (i) yatırımlar her yılın sonunda, (ii) yatırımlar
    her yılın başında yapıldığında ayrı ayrı hesaplayınız. (6 puan)

    '
  cozum: '**(a) Tahvilin bugünkü değeri**


    Kupon = 1.000 × %20 = 200 TL. Üç yıllık %25 anüite faktörü = 0,80 + 0,64 + 0,512 = 1,952.


    P0 = 200 × 1,952 + 1.000 × 0,512 = 390,40 + 512 = **902,40 TL**


    Kupon oranı (%20) piyasa getirisinden (%25) düşük olduğundan tahvil nominal değerin altında, yani **iskontolu** işlem
    görür.


    **(b) Bir yıl sonraki değer ve elde tutma getirisi**


    Vadeye 2 yıl kalmıştır; iki yıllık anüite faktörü = 0,80 + 0,64 = 1,44.


    P1 = 200 × 1,44 + 1.000 × 0,64 = 288 + 640 = **928 TL**


    Elde tutma getirisi = (Kupon + P1 − P0) / P0 = (200 + 928 − 902,40) / 902,40 = 225,60 / 902,40 = **%25**


    Yorum: Piyasa getirisi değişmediğinde elde tutma getirisi piyasa getirisine eşittir. İskontolu tahvilin fiyatı vadeye
    yaklaştıkça nominal değere doğru yükselir (902,40 → 928 → 1.000); getirinin 200 TL''si kupondan, 25,60 TL''si fiyat artışından
    gelir.


    **(c) Pay değerlemesi (iki aşamalı büyüme)**


    | Yıl | Kâr payı | Hesap | Bugünkü değer |

    |---|---|---|---|

    | 1 | D1 = 3 × 1,20 = 3,60 | 3,60 / 1,20 | 3,00 |

    | 2 | D2 = 3,60 × 1,20 = 4,32 | 4,32 / 1,44 | 3,00 |

    | 2 (uç değer) | P2 = D3 / (k − g) = (4,32 × 1,08) / (0,20 − 0,08) = 4,6656 / 0,12 = 38,88 | 38,88 / 1,44 | 27,00 |


    İçsel değer P0 = 3 + 3 + 27 = **33 TL**


    İçsel değer (33 TL) borsa fiyatından (30 TL) yüksektir; pay **düşük fiyatlanmıştır**, alınması uygundur. Not: Gordon modeli
    D3 ile 2. yıl sonunun değerini verir; bu nedenle uç değer iki dönem iskontolanır.


    **(d) Birikim için eşit yatırımlar**


    (i) Dönem sonu: Gelecek değer faktörü = 1,5625 + 1,25 + 1 = 3,8125. Yatırım = 762.500 / 3,8125 = **200.000 TL**


    (ii) Dönem başı: Her yatırım bir dönem fazla faiz kazanır; faktör = 3,8125 × 1,25 = 4,765625 (= 1,953125 + 1,5625 + 1,25).
    Yatırım = 762.500 / 4,765625 = **160.000 TL**


    Peşin (dönem başı) yatırımda tutar, dönem sonu tutarın 1 / 1,25''i kadardır: 200.000 / 1,25 = 160.000 TL.

    '
  puanlama:
  - olcut: (a) Kupon tutarı ve anüite faktörüyle tahvil fiyatının 902,40 TL bulunması
    puan: 4
  - olcut: (a) Kupon oranı < piyasa getirisi gerekçesiyle iskontolu olduğunun belirtilmesi
    puan: 2
  - olcut: (b) Bir yıl sonraki fiyatın 928 TL bulunması
    puan: 3
  - olcut: (b) Elde tutma getirisinin %25 hesaplanması ve getiri sabitken piyasa getirisine eşit olduğunun yorumlanması
    puan: 3
  - olcut: (c) D1, D2, D3 ve 2. yıl sonu uç değerinin (38,88 TL) doğru hesaplanması
    puan: 3
  - olcut: (c) İskontolama (uç değerin iki dönem iskontolanması) ve içsel değerin 33 TL bulunması
    puan: 3
  - olcut: (c) İçsel değer > piyasa fiyatı gerekçesiyle alım kararı
    puan: 1
  - olcut: (d)(i) Dönem sonu yatırım tutarının 200.000 TL bulunması
    puan: 3
  - olcut: (d)(ii) Dönem başı yatırım tutarının 160.000 TL bulunması
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — paranın zaman değeri ve değerleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'f25 = [1/1.25**t for t in (1,2,3)]

      p0 = 200*sum(f25) + 1000*f25[2]

      p1 = 200*(f25[0]+f25[1]) + 1000*f25[1]

      hpr = (200 + p1 - p0)/p0

      d1 = 3*1.2

      d2 = d1*1.2

      p2 = d2*1.08/(0.20-0.08)

      pay = d1/1.2 + (d2+p2)/1.44

      fvifa = 1.25**2 + 1.25 + 1

      sonuc = {''tahvil_fiyati'': round(p0,2), ''fiyat_1yil'': round(p1,2), ''hpr'': round(hpr,4), ''uc_deger_p2'': round(p2,2),
      ''pay_degeri'': round(pay,2), ''taksit_donem_sonu'': round(762500/fvifa,2), ''taksit_donem_basi'': round(762500/(fvifa*1.25),2)}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
