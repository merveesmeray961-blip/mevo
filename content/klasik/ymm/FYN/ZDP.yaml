- id: YMM-FYN-ZDP-K003
  sinav: ymm
  ders: FYN
  konu: ZDP
  kazanimlar:
  - iskonto ve senet hesapları
  zorluk: 2
  puan: 25
  sure_dk: 25
  soru: 'Ticaret A.Ş.''nin portföyünde 01.03.2026 tarihi itibarıyla aşağıdaki alacak senetleri bulunmaktadır:


    | Senet | Nominal değer (TL) | Vadeye kalan gün |

    |---|---|---|

    | 1 | 50.000 | 30 |

    | 2 | 100.000 | 60 |

    | 3 | 150.000 | 120 |


    Banka ve borçlu ile yapılan görüşmelerde yıllık **%36** basit faiz oranı kullanılacaktır. Yıl 360 gün kabul edilecek;
    komisyon ve masraf dikkate alınmayacaktır. Tutarlar kuruşa yuvarlanacaktır.


    **İstenenler:**


    (a) Senetler bugün bankaya dış (ticari) iskonto yöntemiyle kırdırılırsa her senet için iskonto tutarını ve şirketin eline
    geçecek toplam tutarı hesaplayınız. (6 puan)


    (b) Senetlerin iç (gerçek) iskonto yöntemine göre peşin değerlerini ve toplam iç iskonto tutarını hesaplayınız; iki yöntem
    arasındaki farkın nedenini açıklayınız. (7 puan)


    (c) Borçlu, üç senedin geri alınarak bugünden itibaren 90 gün vadeli tek bir senet düzenlenmesini istemektedir. İç iskonto
    esasına göre yeni senedin nominal değerini hesaplayınız. (6 puan)


    (d) Borçlu bunun yerine nominal değeri üç senedin toplamına (300.000 TL) eşit tek bir senet vermeyi önermektedir. Dış
    iskonto esasına göre bu senedin vadesini (ortalama vade) hesaplayınız ve sonucu iskonto tutarı üzerinden doğrulayınız.
    (6 puan)

    '
  cozum: '**(a) Dış iskonto:** İ = N × t × n / 36.000


    | Senet | Hesap | İskonto (TL) |

    |---|---|---|

    | 1 | 50.000 × 36 × 30 / 36.000 | 1.500,00 |

    | 2 | 100.000 × 36 × 60 / 36.000 | 6.000,00 |

    | 3 | 150.000 × 36 × 120 / 36.000 | 18.000,00 |

    | Toplam | | **25.500,00** |


    Eline geçen tutar = 300.000 − 25.500 = **274.500,00 TL**


    **(b) İç iskonto:** Peşin değer = N / (1 + t × n / 36.000); İ = N × t × n / (36.000 + t × n)


    | Senet | Peşin değer | İç iskonto |

    |---|---|---|

    | 1 | 50.000 / 1,03 = 48.543,69 | 1.456,31 |

    | 2 | 100.000 / 1,06 = 94.339,62 | 5.660,38 |

    | 3 | 150.000 / 1,12 = 133.928,57 | 16.071,43 |

    | Toplam | **276.811,88** | **23.188,12** |


    Dış iskonto 2.311,88 TL daha büyüktür. Dış iskontoda faiz senedin **nominal değeri** (vade değeri) üzerinden, iç iskontoda
    ise **peşin değer** üzerinden hesaplanır. Nominal değer peşin değerden büyük olduğundan dış iskonto her zaman iç iskontodan
    büyüktür; iç iskonto gerçek faiz maliyetini yansıtır.


    **(c) 90 gün vadeli tek senet**


    Eski senetlerin bugünkü (peşin) değerleri toplamı yeni senedin peşin değerine eşit olmalıdır:

    N_yeni = 276.811,88 × (1 + 36 × 90 / 36.000) = 276.811,88 × 1,09 = **301.724,95 TL**


    **(d) Ortalama vade (dış iskonto)**


    Nominaller toplamı korunduğunda dış iskonto tutarlarının eşitliği: 300.000 × 36 × n / 36.000 = Σ N_i × 36 × n_i / 36.000
    → n = Σ(N_i × n_i) / ΣN_i

    n = (50.000 × 30 + 100.000 × 60 + 150.000 × 120) / 300.000 = (1.500.000 + 6.000.000 + 18.000.000) / 300.000 = **85 gün**


    Doğrulama: 300.000 × 36 × 85 / 36.000 = 25.500 TL = (a)''daki toplam dış iskonto. Yeni senedin vadesi 01.03.2026''dan
    85 gün sonradır.

    '
  puanlama:
  - olcut: (a) Dış iskonto formülü ve senet bazında tutarlar
    puan: 4
  - olcut: (a) Toplam 25.500 ve net 274.500 TL
    puan: 2
  - olcut: (b) İç iskonto formülü ve peşin değerler
    puan: 4
  - olcut: (b) Toplam 276.811,88 / 23.188,12 TL
    puan: 1
  - olcut: (b) Farkın nedeni (nominal ve peşin değer üzerinden faiz)
    puan: 2
  - olcut: (c) Peşin değer eşitliği ilkesi
    puan: 3
  - olcut: (c) Yeni nominal 301.724,95 TL
    puan: 3
  - olcut: (d) Ortalama vade formülü ve 85 gün
    puan: 4
  - olcut: (d) İskonto tutarıyla doğrulama
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — İskonto ve senet hesapları
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "s = [(50000, 30), (100000, 60), (150000, 120)]\ndis = sum(N * 36 * n / 36000 for N, n in s)\npesin = sum(N /\
      \ (1 + 36 * n / 36000) for N, n in s)\nyeni = pesin * (1 + 36 * 90 / 36000)\nvade = sum(N * n for N, n in s) / 300000\n\
      sonuc = {\"dis_iskonto\": dis, \"net\": 300000 - dis, \"pesin\": round(pesin, 2), \"ic_iskonto\": round(300000 - pesin,\
      \ 2),\n         \"yeni_senet\": round(yeni, 2), \"ortalama_vade\": vade, \"kontrol\": 300000 * 36 * vade / 36000}\n"
  durum: kontrolde
  surum: 1
