- id: YMM-FYN-ZDP-K002
  sinav: ymm
  ders: FYN
  konu: ZDP
  kazanimlar:
  - tahvil değerlemesi ve durasyon
  - bugünkü ve gelecek değer
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir emeklilik fonunun portföy yöneticisi faiz riskini ölçmek için iki tahvili incelemektedir:


    - **Tahvil K:** Nominal değeri 1.000 TL, yıllık kupon oranı %30 (kuponlar yıl sonunda ödenir), vadesine tam 3 yıl kalmıştır.

    - **Tahvil S:** Nominal değeri 1.000 TL, sıfır kuponlu, vadesine tam 3 yıl kalmıştır.


    Her iki tahvil için piyasa getirisi (vadeye kadar getiri) bugün %20''dir. İskonto faktörleri:


    | n | (1,20)^−n | (1,21)^−n |

    |---|---|---|

    | 1 | 0,833333 | 0,826446 |

    | 2 | 0,694444 | 0,683013 |

    | 3 | 0,578704 | 0,564474 |


    **İstenenler:**


    (a) Tahvil K''nin bugünkü değerini hesaplayınız; tahvilin primli mi iskontolu mu işlem gördüğünü gerekçesiyle belirtiniz.
    (6 puan)


    (b) Tahvil K''nin Macaulay durasyonunu ve düzeltilmiş durasyonunu hesaplayınız. (8 puan)


    (c) Piyasa getirisi 1 puan artarak %21''e çıkarsa Tahvil K''nin fiyatındaki değişimi düzeltilmiş durasyonla tahmin ediniz;
    %21''deki gerçek fiyatı hesaplayarak tahmin ile gerçek değişim arasındaki farkı konveksite kavramıyla açıklayınız. (6
    puan)


    (d) Tahvil S''nin fiyatını, Macaulay ve düzeltilmiş durasyonunu bulunuz; getiri %21''e çıktığında tahmini ve gerçek fiyat
    değişimini hesaplayınız. İki tahvilden hangisinin faiz değişimine oransal olarak daha duyarlı olduğunu ve nedenini açıklayınız.
    (5 puan)

    '
  cozum: '**(a) Tahvil K''nin değeri**


    P = Σ Kupon / (1 + k)^t + Nominal / (1 + k)^n


    | t | Nakit akışı | Faktör (%20) | BD |

    |---|---|---|---|

    | 1 | 300 | 0,833333 | 250,000 |

    | 2 | 300 | 0,694444 | 208,333 |

    | 3 | 1.300 | 0,578704 | 752,315 |

    | | | **P** | **1.210,648** |


    Kupon oranı (%30) piyasa getirisinden (%20) yüksek olduğundan tahvil nominalin üstünde, **primli** işlem görür (1.210,65
    TL > 1.000 TL).


    **(b) Durasyon**


    | t | BD | t × BD |

    |---|---|---|

    | 1 | 250,000 | 250,000 |

    | 2 | 208,333 | 416,667 |

    | 3 | 752,315 | 2.256,944 |

    | Toplam | 1.210,648 | 2.923,611 |


    - Macaulay durasyonu D = Σ(t × BD_t) / P = 2.923,611 / 1.210,648 = **2,4149 yıl**

    - Düzeltilmiş durasyon DD = D / (1 + k) = 2,4149 / 1,20 = **2,0124**


    **(c) Fiyat duyarlılığı**


    - Tahmini değişim: ΔP ≈ −DD × Δk × P = −2,0124 × 0,01 × 1.210,648 = **−24,36 TL** (tahmini fiyat 1.186,29 TL)

    - Gerçek fiyat (%21): 300 × 0,826446 + 300 × 0,683013 + 1.300 × 0,564474 = 247,934 + 204,904 + 733,816 = **1.186,654 TL**;
    gerçek değişim **−23,99 TL**

    - Fiyat tahminden 0,37 TL daha az düşmüştür. Fiyat-getiri ilişkisi doğrusal değil **dışbükeydir (konveksite)**; durasyon
    bu eğriye teğet doğru ile yaklaşım yapar. Bu nedenle getiri artışında gerçek fiyat düşüşü tahminden küçük, getiri düşüşünde
    gerçek fiyat artışı tahminden büyük olur. Konveksite yatırımcı lehine bir özelliktir; değişim büyüdükçe durasyon tahmininin
    hatası artar.


    **(d) Sıfır kuponlu tahvil**


    - P = 1.000 × 0,578704 = **578,70 TL**; tek nakit akışı vadede olduğundan **D = 3 yıl**; DD = 3 / 1,20 = **2,5**

    - Tahmini değişim = −2,5 × 0,01 × 578,70 = **−14,47 TL** (−%2,5); gerçek fiyat 1.000 × 0,564474 = 564,47 TL → gerçek değişim
    **−14,23 TL** (−%2,46)

    - Tahvil K''de oransal değişim −23,99 / 1.210,65 = −%1,98''dir. Tahvil S daha duyarlıdır: aynı vadede kupon ödemesi olmadığı
    için nakit akışının tamamı en uzak tarihte toplanır, durasyonu vadesine eşittir ve kuponlu tahvilinkinden büyüktür. Kupon
    oranı arttıkça durasyon ve faiz riski azalır.

    '
  puanlama:
  - olcut: (a) Nakit akışlarının BD'leri ve P = 1.210,65 TL
    puan: 4
  - olcut: (a) Primli işlem görme gerekçesi
    puan: 2
  - olcut: (b) t × BD toplamı 2.923,61
    puan: 3
  - olcut: (b) Macaulay durasyonu 2,4149
    puan: 3
  - olcut: (b) Düzeltilmiş durasyon 2,0124
    puan: 2
  - olcut: (c) Tahmini değişim −24,36 TL
    puan: 2
  - olcut: (c) Gerçek fiyat 1.186,65 TL ve değişim −23,99 TL
    puan: 2
  - olcut: (c) Konveksite açıklaması
    puan: 2
  - olcut: (d) Tahvil S fiyatı, D = 3 ve DD = 2,5
    puan: 2
  - olcut: (d) Tahmini (−14,47) ve gerçek (−14,23) değişim
    puan: 2
  - olcut: (d) Duyarlılık karşılaştırması ve kuponun etkisi
    puan: 1
  kaynaklar:
  - mevzuat: Genel bilgi — Tahvil değerlemesi ve durasyon
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "cf = [300, 300, 1300]\nf20 = [1 / 1.2 ** t for t in (1, 2, 3)]\nf21 = [1 / 1.21 ** t for t in (1, 2, 3)]\nbd\
      \ = [c * f for c, f in zip(cf, f20)]\nP = sum(bd)\ntbd = sum((i + 1) * b for i, b in enumerate(bd))\nD = tbd / P\nDD\
      \ = D / 1.2\nP21 = sum(c * f for c, f in zip(cf, f21))\nPS = 1000 * f20[2]\nPS21 = 1000 * f21[2]\nsonuc = {\"P\": round(P,\
      \ 2), \"tbd\": round(tbd, 2), \"D\": round(D, 4), \"DD\": round(DD, 4),\n         \"tahmin\": round(-DD * 0.01 * P,\
      \ 2), \"P21\": round(P21, 2), \"gercek\": round(P21 - P, 2),\n         \"PS\": round(PS, 2), \"DD_S\": 2.5, \"tahmin_S\"\
      : round(-2.5 * 0.01 * PS, 2), \"gercek_S\": round(PS21 - PS, 2)}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_FYN
    kapilar:
