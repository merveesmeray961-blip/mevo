    python: 'eps1=12.0; k=0.20

      roe_a=0.20; b_a=0.60

      g_a = roe_a*b_a

      d1_a = eps1*(1-b_a)

      p_a = d1_a/(k-g_a)

      b_b = 0.40

      g_b = roe_a*b_b

      d1_b = eps1*(1-b_b)

      p_b = d1_b/(k-g_b)

      roe_c = 0.25

      g_c = roe_c*b_a

      p_c = d1_a/(k-g_c)

      g_d = roe_c*b_b

      p_d = d1_b/(k-g_d)

      p_buyumesiz = eps1/k

      pvgo = p_c-p_buyumesiz

      sonuc = {''a'': (g_a, d1_a, p_a), ''b'': (g_b, d1_b, p_b), ''c'': (g_c, p_c, g_d, p_d), ''d'': (p_buyumesiz, pvgo)}

