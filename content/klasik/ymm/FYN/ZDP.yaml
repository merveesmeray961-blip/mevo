  soru: 'Serbest meslek erbabı Bay Emre bugünden 3 yıl sonra emekli olmayı planlamaktadır. Emekliliğinde 10 yıl boyunca, her
    yılın sonunda gelir elde etmek istemektedir: ilk gelir emeklilikten bir yıl sonra (bugünden 4 yıl sonra) 300.000 TL olacak,
    sonraki gelirler enflasyona karşı korunmak için her yıl %10 artacaktır.


    - Bay Emre''nin birikimleri her yıl %21 bileşik getiri sağlayacaktır (emeklilik öncesi ve sonrası aynı).

    - Önümüzdeki yıllarda beklenen yıllık enflasyon oranı %10''dur.

    - Bay Emre''nin bugün 500.000 TL birikimi vardır.

    - Vergi ve işlem maliyeti yoktur.


    Faktörler: (1,10/1,21)^10 = (1,10)^−10 = 0,385543; (1,21)³ = 1,771561; 10 yıllık %10 anüite (bugünkü değer) faktörü =
    6,144567; 3 yıllık %21 anüite (gelecek değer) faktörü = 3,6741.


    **İstenenler:**


    (a) Emeklilik tarihinde (bugünden 3 yıl sonra) hesapta bulunması gereken tutarı büyüyen anüite formülüyle hesaplayınız.
    (8 puan)


    (b) Reel getiri oranını Fisher eşitliğiyle bulunuz. Gelirleri emeklilik tarihindeki satın alma gücüyle ifade ederek (a)''daki
    sonucu reel anüite yaklaşımıyla doğrulayınız. (6 puan)


    (c) Mevcut birikimine ek olarak hedefe ulaşması için önümüzdeki üç yılın her birinin sonunda yatırması gereken eşit tutarı
    hesaplayınız. (6 puan)


    (d) Emeklilik gelirlerinin bugünkü değerini hesaplayınız. Gelirler 10 yıl yerine süresiz olarak her yıl %10 artarak devam
    etseydi emeklilik tarihinde gerekli tutar ne olurdu? (5 puan)

    '
  cozum: '**(a) Büyüyen anüite** (C = 300.000 TL, g = %10, r = %21, n = 10)


    BD = C / (r − g) × [1 − ((1 + g) / (1 + r))^n]

    = 300.000 / 0,11 × (1 − 0,385543)

    = 2.727.272,73 × 0,614457 = **1.675.791,03 TL** (emeklilik tarihi itibarıyla)


    **(b) Reel yaklaşım**


    - Fisher: 1 + reel = 1,21 / 1,10 = 1,10 → **reel getiri %10**

    - k. gelirin nominal tutarı 300.000 × 1,10^(k−1), ödendiği tarih emeklilikten k yıl sonradır. Emeklilik tarihi fiyatlarıyla
    değeri 300.000 × 1,10^(k−1) / 1,10^k = 300.000 / 1,10 = **272.727,27 TL** (her yıl sabit).

    - Reel anüite: 272.727,27 × 6,144567 = **1.675.791,03 TL** → (a) ile aynı. Gelirlerin büyüme hızı enflasyona eşit olduğundan
    gelirler reel olarak sabittir; nominal akış nominal oranla, reel akış reel oranla iskonto edildiğinde aynı sonuç bulunur.


    **(c) Gerekli yıllık yatırım**


    - Mevcut birikimin 3 yıl sonraki değeri = 500.000 × 1,771561 = 885.780,50 TL

    - Eksik tutar = 1.675.791,03 − 885.780,50 = 790.010,53 TL

    - Yıllık yatırım (yıl sonu, normal anüite) = 790.010,53 / 3,6741 = **215.021,51 TL**


    **(d) Bugünkü değer ve süresiz durum**


    - Bugünkü değer = 1.675.791,03 / 1,771561 = **945.940,35 TL** (ertelenmiş büyüyen anüite)

    - Süresiz büyüyen anüite: BD = C / (r − g) = 300.000 / 0,11 = **2.727.272,73 TL** (emeklilik tarihi itibarıyla). r > g
    olduğu için formül tanımlıdır.

    '
