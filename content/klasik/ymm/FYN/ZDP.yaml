  sinav: ymm
  ders: FYN
  konu: ZDP
  kazanimlar:
  - hisse senedi değerlemesi (Gordon modeli) ve göreli değerleme
  zorluk: 2
  puan: 21
  sure_dk: 30
  soru: '**Olay:** Kaya Yazılım A.Ş.''nin gelecek yıl pay başına kazancının (PBK1) 5 TL olması ve kazançlarının önümüzdeki
    yıllarda yıllık %15 büyümesi beklenmektedir. Benzer üç şirketin F/K oranları (gelecek yıl kazancı esaslı) ve beklenen
    yıllık kazanç büyümeleri: Şirket 1: F/K = 12, büyüme %12; Şirket 2: F/K = 20, büyüme %20; Şirket 3: F/K = 16, büyüme %16.
    Kaya Yazılım''ın payı borsada 90 TL''den işlem görmektedir.


    **İstenenler:**


    (a) Benzer şirketlerin PEG oranlarını (F/K / büyüme yüzdesi) ve ortalamasını bulunuz. (5 puan)


    (b) Ortalama PEG ile Kaya Yazılım için adil F/K''yı ve pay değerini bulunuz. (5 puan)


    (c) Borsa fiyatına göre Kaya Yazılım''ın F/K''sını ve PEG oranını hesaplayıp değerlemeyi yorumlayınız. (6 puan)


    (d) Gelecek yıl pay başına 1 TL kâr payı dağıtılacağı varsayımıyla (b) değerinin ima ettiği gerekli getiri oranını ve
    kazanç verimini bulunuz. (5 puan)

    '
  cozum: '**(a)** PEG1 = 12 / 12 = **1**; PEG2 = 20 / 20 = **1**; PEG3 = 16 / 16 = **1**. Ortalama = **1**.


    **(b)** Adil F/K = PEG × büyüme = 1 × 15 = **15**; değer = 15 × 5 = **75 TL**.


    **(c)** Piyasa F/K = 90 / 5 = **18**; PEG = 18 / 15 = **1,20** > 1 → Kaya Yazılım, benzerlerine göre **pahalı** fiyatlanmıştır
    (piyasa değeri 90 TL, göreli değer 75 TL).


    **(d)** Gordon ilişkisi: k = D1 / P0 + g = 1 / 75 + 0,15 = **%16,3333**. Kazanç verimi = 1 / adil F/K = **%6,6667**.


    **Mevzuat dayanağı:** TTK md. 507/1 uyarınca her pay sahibi, dağıtılması kararlaştırılmış net dönem kârına payı oranında
    katılır.

    '
  puanlama:
  - olcut: (a) PEG oranları ve ortalaması
    puan: 5
  - olcut: (b) adil F/K ve pay değeri
    puan: 5
  - olcut: (c) piyasa F/K, PEG ve yorum
