  soru: '**Olay:** Orhan Enerji A.Ş.''nin gelecek yıl pay başına kazancının (PBK1) 12 TL olması beklenmektedir. Şirket kârını
    yeniden yatırım oranı (tutma oranı) b ile işletmede tutmakta ve bu yatırımlardan özkaynak kârlılığı (ROE) elde etmektedir;
    süresiz büyüme oranı g = ROE × b''dir. Yatırımcıların gerekli getirisi %20''dir. Değerleme Gordon modeline göre yapılacaktır
    (D1 = PBK1 × (1 − b)).


    **İstenenler:**


    (a) ROE %20 ve tutma oranı %60 iken büyüme oranını, D1''i ve pay değerini bulunuz. (6 puan)


    (b) Tutma oranı %40''a düşürülürse (ROE %20) pay değeri ne olur? Sonucu yorumlayınız. (5 puan)


    (c) ROE %25 olsaydı tutma oranı %60 ve %40 için pay değerlerini bulunuz. (6 puan)


    (d) ROE %25 ve b = %60 iken büyümesiz değeri (PBK1 / k) ve büyüme fırsatlarının bugünkü değerini (PVGO) hesaplayınız.
    (4 puan)

    '
  cozum: '**(a)** g = 0,20 × 0,60 = **%12**; D1 = 12 × (1 − 0,60) = **4,80 TL**; P0 = 4,80 / (0,20 − 0,12) = **60 TL**.


    **(b)** g = 0,20 × 0,40 = %8; D1 = 12 × 0,60 = 7,20 TL; P0 = 7,20 / (0,20 − 0,08) = **60 TL**. ROE gerekli getiriye eşit
    (ROE = k) olduğunda kâr dağıtım politikası değeri değiştirmez; yeniden yatırım değer yaratmaz.


    **(c)** ROE %25: b = %60 için g = %15, P0 = 4,80 / (0,20 − 0,15) = **96 TL**; b = %40 için g = %10, P0 = 7,20 / (0,20
    − 0,10) = **72 TL**. ROE > k olduğunda kârın tutulması (büyüme) değeri artırır.


    **(d)** Büyümesiz değer = 12 / 0,20 = **60 TL**; PVGO = 96 − 60 = **36 TL**.


    **Mevzuat dayanağı:** TTK md. 507/1 uyarınca her pay sahibi, dağıtılması kararlaştırılmış net dönem kârına payı oranında
    katılır.

    '
  puanlama:
  - olcut: (a) g, D1 ve P0 (ROE=k, b=%60)
    puan: 6
  - olcut: (b) b=%40 değeri ve ROE=k yorumu
    puan: 5
  - olcut: (c) ROE=%25 için iki politika değeri
    puan: 6
  - olcut: (d) büyümesiz değer ve PVGO
