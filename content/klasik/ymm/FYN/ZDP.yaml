    her yıl %5 büyüyeceği beklenmektedir. Yatırımcıların gerekli getiri oranı %20, payın borsa fiyatı 18 TL''dir.


    **İstenenler:**


    (a) Gordon modeline göre payın içsel değerini bulunuz. (6 puan)


    (b) Pay için al/alma kararını veriniz; piyasa fiyatının ima ettiği gerekli getiri oranını hesaplayınız. (6 puan)


    (c) İki yıl sonraki teorik pay değerini ve bugünkü kâr payı verimini (D1 / P0) bulunuz. (5 puan)


    (d) İkinci yıl (D2) kâr payı tutarını bulunuz ve Gordon modelinin temel varsayımlarını belirtiniz. (4 puan)

    '
  cozum: '**(a)** D1 = 3 × 1,05 = 3,15 TL. P0 = D1 / (k − g) = 3,15 / (0,20 − 0,05) = **21 TL**.


    **(b)** İçsel değer (21 TL) piyasa fiyatından (18 TL) 3 TL yüksektir → pay düşük fiyatlanmıştır, **alınmalıdır**. İma
    edilen getiri k = D1 / P + g = 3,15 / 18 + 0,05 = **%22,50**; bu oran gerekli getiriden (%20) yüksektir.


    **(c)** P2 = P0 × 1,05² = **23,1525 TL**; kâr payı verimi = 3,15 / 21 = **%15** (k − g ile aynıdır).


    **(d)** D2 = 3 × 1,05² = **3,3075 TL**. Gordon modeli kâr payının sabit oranda sonsuza dek büyüdüğünü ve k > g olduğunu
    varsayar.


    **Mevzuat dayanağı:** TTK md. 507/1 uyarınca her pay sahibi, dağıtılması kararlaştırılmış net dönem kârına payı oranında
    katılır.

    '
