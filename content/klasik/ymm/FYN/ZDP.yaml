    **İstenenler:**


    (a) Fisher denklemine göre reel faiz oranını bulunuz; basit fark yaklaşımıyla karşılaştırınız. (6 puan)


    (b) Vade sonundaki nominal tutarı ve bu tutarın bugünkü satın alma gücüyle karşılığını bulunuz. (5 puan)


    (c) %10 reel getiri hedefleniyorsa gereken nominal faizi, enflasyon %50''ye çıkarsa %60 nominal faizin reel getirisini
    bulunuz. (7 puan)


    (d) Enflasyon her yıl %40 kalırsa bugünkü fiyatlarla 1.000.000 TL''lik bir harcama için 3 yıl sonra gereken nominal tutarı
    ve bunun için bugün %60 nominal faizle (bileşik) yatırılması gereken tutarı bulunuz. (6 puan)

    '
  cozum: '**(a)** Reel faiz = (1 + 0,60) / (1 + 0,40) − 1 = **%14,2857**. Basit fark yaklaşımı: 60 − 40 = %20. Enflasyon yüksek
    olduğunda basit fark reel faizi olduğundan yüksek gösterir.


    **(b)** Nominal tutar = 1.000.000 × 1,60 = **1.600.000 TL**; bugünkü satın alma gücü = 1.600.000 / 1,40 = **1.142.857,14
    TL** (yatırımın reel getirisi = 1.142.857,14 / 1.000.000 − 1 = %14,2857).


    **(c)** Gereken nominal faiz = 1,10 × 1,40 − 1 = **%54**. Enflasyon %50 iken reel getiri = 1,60 / 1,50 − 1 = **%6,6667**.


    **(d)** Gereken nominal tutar = 1.000.000 × 1,40³ = **2.744.000 TL**. Bugünkü yatırım = 2.744.000 / 1,60³ = **669.921,87
    TL**.


    **Mevzuat dayanağı:** TMS 29 paragraf 2 uyarınca yüksek enflasyonlu bir ekonomide düzeltme yapılmaksızın yerel para biriminde
    raporlama anlamlı ve faydalı değildir; bu nedenle reel getiri nominal getiriden ayrıştırılarak değerlendirilir.

    '
