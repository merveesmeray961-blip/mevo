- id: YMM-FYN-ZDP-K006
  sinav: ymm
  ders: FYN
  konu: ZDP
  kazanimlar:
  - hisse senedi değerlemesi (Gordon modeli) ve göreli değerleme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kayra Yazılım A.Ş. paylarını halka arz etmeye hazırlanmaktadır. Değerleme raporu için derlenen veriler:


    | Veri | Değer |

    |---|---|

    | Pay sayısı | 10.000.000 adet |

    | 2025 hisse başına kâr (HBK) | 5 TL |

    | Az önce dağıtılan pay başına kâr payı (D0) | 2 TL |

    | Özkaynak defter değeri | 80.000.000 TL |

    | 2025 FAVÖK | 100.000.000 TL |

    | Net borç (finansal borçlar − nakit) | 100.000.000 TL |

    | Risksiz getiri | %24 |

    | Pay betası | 1,2 |

    | Piyasa risk primi (rm − rf) | %5 |


    Benzer halka açık şirketlerin ortalama çarpanları: F/K 3; PD/DD 1,5; FD/FAVÖK 2. Faktörler: (1,30)^−1 = 0,769231; (1,30)^−2
    = 0,591716.


    **İstenenler:**


    (a) Özkaynak maliyetini CAPM ile hesaplayınız. Kâr paylarının süresiz olarak her yıl %10 büyüyeceği varsayımıyla payın
    içsel değerini Gordon modeliyle bulunuz. (6 puan)


    (b) Kâr paylarının önümüzdeki iki yıl her yıl %25, sonrasında süresiz olarak %10 büyüyeceği varsayımıyla payın içsel değerini
    hesaplayınız. (7 puan)


    (c) Benzer şirket çarpanlarıyla (F/K, PD/DD ve FD/FAVÖK) pay başına değeri ayrı ayrı hesaplayınız ve üç yöntemin basit
    ortalamasını bulunuz. FD/FAVÖK yönteminde firma değerinden özkaynak değerine geçişi gösteriniz. (8 puan)


    (d) Halka arzdan sonra pay borsada 14 TL''den işlem görürse, D0 = 2 TL ve özkaynak maliyeti (a)''daki gibiyken sabit büyüme
    modelinin ima ettiği büyüme oranını bulunuz ve yorumlayınız. (4 puan)

    '
  cozum: '**(a) CAPM ve Gordon**


    - ke = rf + β × (rm − rf) = 24 + 1,2 × 5 = **%30**

    - D1 = D0 × (1 + g) = 2 × 1,10 = 2,20 TL

    - P0 = D1 / (ke − g) = 2,20 / (0,30 − 0,10) = **11,00 TL**


    **(b) İki aşamalı büyüme**


    | Yıl | Kâr payı | Hesap |

    |---|---|---|

    | 1 | D1 = 2 × 1,25 = 2,50 | BD = 2,50 × 0,769231 = 1,9231 |

    | 2 | D2 = 2,50 × 1,25 = 3,125 | |

    | 3 | D3 = 3,125 × 1,10 = 3,4375 | |


    - 2. yıl sonundaki uç değer: P2 = D3 / (ke − g) = 3,4375 / 0,20 = 17,1875 TL

    - BD(D2 + P2) = (3,125 + 17,1875) × 0,591716 = 20,3125 × 0,591716 = 12,0192

    - **P0 = 1,9231 + 12,0192 = 13,94 TL**


    **(c) Göreli değerleme**


    - F/K: 3 × 5 = **15,00 TL**

    - PD/DD: hisse başı özkaynak = 80.000.000 / 10.000.000 = 8 TL → 1,5 × 8 = **12,00 TL**

    - FD/FAVÖK: firma değeri = 2 × 100.000.000 = 200.000.000 TL; özkaynak değeri = firma değeri − net borç = 200.000.000 −
    100.000.000 = 100.000.000 TL; pay başına **10,00 TL**

    - Basit ortalama = (15 + 12 + 10) / 3 = **12,33 TL**


    FD/FAVÖK çarpanı borç ve özkaynak sahiplerinin toplam değerini verdiği için net borç düşülmeden pay değerine geçilemez.


    **(d) İma edilen büyüme oranı**


    14 = 2 × (1 + g) / (0,30 − g) → 4,2 − 14g = 2 + 2g → 16g = 2,2 → **g = %13,75**


    Yorum: Piyasa, (a)''daki %10 sabit büyüme varsayımından daha yüksek bir sürekli büyüme fiyatlamaktadır. Fiyat ayrıca (b)''deki
    iki aşamalı değerin (13,94 TL) de üzerindedir; yatırımcı bu fiyattan aldığında ancak %13,75''lik süresiz büyüme gerçekleşirse
    %30 getiri elde eder. Büyüme beklentisi gerçekçi değilse pay aşırı değerlenmiştir.

    '
