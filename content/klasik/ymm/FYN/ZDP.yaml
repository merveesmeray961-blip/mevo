    reel maliyetini Fisher eşitliğiyle bulunuz; yaklaşık formülün (nominal − enflasyon) neden yanıltıcı olduğunu belirtiniz.
    (6 puan)


    (d) Banka alternatif olarak, ödemesiz dönemde her dönem sonunda yalnız işleyen faizin ödenmesini, anaparanın ise aynı
