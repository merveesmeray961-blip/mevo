- id: YMM-GUV-ASG-K001
  sinav: ymm
  ders: GUV
  konu: ASG
  kazanimlar:
  - yurt içi asgari kurumlar vergisi
  - uygulama kapsamı ve istisnalar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '2015 yılında kurulan ve hesap dönemi takvim yılı olan (S) AŞ''nin (banka veya finans kuruluşu değildir) 2026 yılına
    ilişkin bilgileri aşağıdadır. Ticari bilanço kârı, tabloda yer alan kazançların tamamını içermektedir.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 18.000.000 |

    | Kanunen kabul edilmeyen giderler | 2.000.000 |

    | Tam mükellef kurumlardan alınan kâr payları (5/1-a) | 3.000.000 |

    | İştirak hissesi satış kazancı (5/1-e şartları sağlanmış; istisna oranı %75) | 4.000.000 |

    | Yurt dışında yapılan inşaat işlerinden elde edilen ve 5/1-(h) kapsamında istisna olan kazanç | 2.000.000 |

    | Bu inşaat kazancı üzerinden ilgili ülkede ödenen vergi | 100.000 |

    | Teknoloji geliştirme bölgesindeki yazılım faaliyetinden elde edilen ve 4691 sayılı Kanun kapsamında istisna olan kazanç
    | 1.000.000 |

    | Beyannamede indirilecek geçmiş yıl zararı | 5.000.000 |

    | 5746 sayılı Kanun kapsamındaki Ar-Ge indirimi | 1.000.000 |

    | KVK 10/1-(ı) kapsamındaki nakdi sermaye artışı faiz indirimi | 500.000 |

    | 2026 dönemi için ödenen geçici vergiler | 600.000 |

    | 2026 dönemine ilişkin yurt içinde tevkif yoluyla ödenen kurumlar vergisi | 50.000 |


    Kurumlar vergisi matrahının 1.000.000 TL''si münhasıran ihracattan elde edilen ve KVK 32/7 uyarınca 5 puan indirimli orana
    tabi kazançtır; kalan matraha %25 oran uygulanır. Yurt içi asgari kurumlar vergisi oranı %10''dur. Şirketin yatırım teşvik
    belgesi ve vergi indirimi (GVK mük. 121) hakkı yoktur.


    **İstenenler:**


    (a) KVK 32. madde hükümlerine göre kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (7 puan)


    (b) Yurt içi asgari kurumlar vergisi matrahını; kurum kazancından düşülebilen ve düşülemeyen kalemleri gerekçeleriyle
    belirterek hesaplayınız. (8 puan)


    (c) Ödenmesi gereken yurt içi asgari kurumlar vergisini belirleyiniz ve şirketin 2026 yılı hesaplanan kurumlar vergisini
    tespit ediniz. (5 puan)


    (d) Mahsuplardan sonra ödenecek kurumlar vergisini bulunuz; asgari vergi uygulamasının geçici vergi dönemlerine etkisini
    ve yurt dışında ödenen 100.000 TL''nin mahsup edilip edilemeyeceğini açıklayınız. (5 puan)

    '
  cozum: '**(a) Genel hesap**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 18.000.000 |

    | + KKEG | 2.000.000 |

    | = Kurum kazancı (indirim ve istisnalar öncesi) | 20.000.000 |

    | − 5/1-(a) iştirak kazancı | 3.000.000 |

    | − 5/1-(e) satış kazancı istisnası (4.000.000 × %75) | 3.000.000 |

    | − 5/1-(h) yurt dışı inşaat kazancı | 2.000.000 |

    | − 4691 sayılı Kanun kazanç istisnası | 1.000.000 |

    | − Geçmiş yıl zararı | 5.000.000 |

    | − Ar-Ge indirimi | 1.000.000 |

    | − Nakdi sermaye artışı faiz indirimi | 500.000 |

    | = Kurumlar vergisi matrahı | **4.500.000** |


    Vergi: 1.000.000 × %20 = 200.000; 3.500.000 × %25 = 875.000; hesaplanan kurumlar vergisi **1.075.000 TL**. İhracat indirimi
    nedeniyle alınmayan vergi: 1.000.000 × %5 = 50.000 TL.


    **(b) Asgari vergi matrahı (KVK 32/C)**


    İndirim ve istisnalar düşülmeden önceki kurum kazancı = ticari bilanço kârı + KKEG = 20.000.000 TL (32/C-6).


    Düşülebilenler:

    - 5/1-(a) iştirak kazancı (32/C-2-a): 3.000.000

    - 4691 sayılı Kanun kazanç istisnası ve Ar-Ge indirimi (32/C-2-ç): 1.000.000 + 1.000.000

    - 5/1-(h) kazancı: Tebliğe göre %10 vergi yükü taşımayan yurt dışı kaynaklı istisna kazançta yalnız vergiye isabet eden
    kısım düşülür. Vergi yükü 100.000 / 2.000.000 = %5; düşülecek kısım 100.000 / 0,10 = 1.000.000; kalan 1.000.000 TL matrahta
    kalır.


    Düşülemeyenler: 5/1-(e) satış kazancı istisnası (32/C-2''de sayılmamıştır), geçmiş yıl zararı (Tebliğ), 10/1-(ı) nakdi
    sermaye artışı faiz indirimi (32/C-2-b yalnız g, h, i ve j bentlerini saymıştır).


    Asgari vergi matrahı = 20.000.000 − 3.000.000 − 1.000.000 − 1.000.000 − 1.000.000 = **14.000.000 TL**.


    **(c) Asgari vergi ve karşılaştırma**


    - Asgari vergi = 14.000.000 × %10 = 1.400.000 TL.

    - 32/C-3 uyarınca 32/7 ihracat indirimi nedeniyle alınmayan vergi (50.000 TL) indirilir: 1.400.000 − 50.000 = **1.350.000
    TL**.

    - 1.350.000 > 1.075.000 olduğundan aradaki 275.000 TL kadar asgari vergi hesaplanır; hesaplanan kurumlar vergisi **1.350.000
    TL**''dir.


    **(d) Ödenecek vergi ve diğer hususlar**


    - Tebliğe göre hesaplanan asgari vergiden döneme ilişkin tevkif yoluyla ödenen kurumlar vergisi ve ödenen geçici vergiler
    mahsup edilebilir: 1.350.000 − 600.000 − 50.000 = **700.000 TL** ödenecek kurumlar vergisi.

    - 32/C-4 uyarınca asgari vergi hükmü geçici vergi dönemlerinde de uygulanır; her geçici vergi döneminde genel hesapla
    asgari hesap karşılaştırılır.

    - 100.000 TL, kurumlar vergisinden istisna edilen 5/1-(h) kazancı üzerinden ödendiğinden md. 33 kapsamında Türkiye''de
    hesaplanan vergiden mahsup edilemez; bu vergi yalnız asgari matrahta düşülecek kısmın hesabında kullanılmıştır.


    Dayanak: KVK md. 5/1, 32/1, 32/7, 32/C-1 ila 6, 33; 1 Seri No.lu KV Genel Tebliği bölüm 32.5.4–32.5.6 ve 33.3.'
  puanlama:
  - olcut: Kurum kazancının 20.000.000 TL bulunması
    puan: 1
  - olcut: İstisnaların (5/1-e'de %75 dahil) doğru tutarlarla indirilmesi
    puan: 2
  - olcut: Zarar ve indirimler sonrası matrahın 4.500.000 TL bulunması
    puan: 2
  - olcut: İhracat ve genel oran ayrımıyla vergi 1.075.000 TL'nin hesaplanması
    puan: 2
  - olcut: 5/1-(a), 4691 istisnası ve Ar-Ge indiriminin düşülebileceğinin gerekçelendirilmesi
    puan: 3
  - olcut: 5/1-(e), geçmiş yıl zararı ve 10/1-(ı) indiriminin düşülemeyeceğinin gerekçelendirilmesi
    puan: 2
  - olcut: 5/1-(h) kazancında vergi yükü %5 → 1.000.000 TL düşülüp 1.000.000 TL'nin matrahta kalmasının hesaplanması
    puan: 2
  - olcut: Asgari vergi matrahının 14.000.000 TL bulunması
    puan: 1
  - olcut: Asgari verginin 1.400.000 TL bulunması
    puan: 1
  - olcut: İhracat indirimi nedeniyle alınmayan 50.000 TL'nin indirilmesi
    puan: 2
  - olcut: Karşılaştırma ile hesaplanan kurumlar vergisinin 1.350.000 TL belirlenmesi
    puan: 2
  - olcut: Geçici vergi ve tevkifat mahsubuyla ödenecek verginin 700.000 TL bulunması
    puan: 2
  - olcut: Asgari verginin geçici vergi dönemlerinde de uygulandığının belirtilmesi
    puan: 2
  - olcut: İstisna kazanç üzerinden yurt dışında ödenen verginin mahsup edilemeyeceğinin açıklanması
    puan: 1
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(a), (e), (h); 32/1, 32/7; 32/C; 33
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.4, 32.5.5, 32.5.6, 33.3
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
  dogrulama:
    python: "kk = 18000000 + 2000000\nist = 3000000 + 4000000*75//100 + 2000000 + 1000000\nmatrah = kk - ist - 5000000 - 1000000\
      \ - 500000\nkv = 1000000*20//100 + (matrah - 1000000)*25//100\nh_dusulen = round(100000 / 0.10)\nasg_matrah = kk - 3000000\
      \ - 1000000 - 1000000 - h_dusulen\nasg = asg_matrah*10//100 - 1000000*5//100\nhes = max(kv, asg)\nsonuc = {'kurum_kazanci':\
      \ kk, 'matrah': matrah, 'kv': kv, 'asgari_matrah': asg_matrah,\n         'asgari_vergi': asg, 'hesaplanan_kv': hes,\
      \ 'odenecek': hes - 600000 - 50000}"
  durum: kontrolde
