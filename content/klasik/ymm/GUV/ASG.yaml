  soru: '**Olay:** Nova Group (nihai ana işletmesi yurt dışında bulunan çok uluslu işletme grubu), Türkiye''de iki bağlı işletmeye
    (Nova Türkiye Üretim A.Ş. ve Nova Türkiye Satış A.Ş.) sahiptir. Grubun nihai ana işletmesinin konsolide hasılatı (milyon
    avro): 2022: 700; 2023: 760; 2024: 790; 2025: 720. Grup 2026 hesap dönemi (takvim yılı) için değerlendirilecektir.


    Türkiye''ye ilişkin 2026 verileri (TL):


    | Kalem | Tutar |

    |---|---|

    | Türkiye''deki bağlı işletmelerin net ülkesel bazlı kazanç toplamı | 100.000.000 |

    | — bunun Nova Türkiye Üretim A.Ş.''ye ait işletme bazlı kazancı | 60.000.000 |

    | — bunun Nova Türkiye Satış A.Ş.''ye ait işletme bazlı kazancı | 40.000.000 |

    | Türkiye''deki bağlı işletmelerin düzeltilmiş kapsanan vergileri toplamı | 10.000.000 |

    | Türkiye''deki bağlı işletmelerin çalışanlarının yıllık toplam brüt ücretleri | 40.000.000 |

    | Türkiye''deki bağlı işletmelerin maddi duran varlıklarının net defter değeri | 160.000.000 |


    Ek bilgiler: 1 milyon avro = 40.000.000 TL kabul edilecektir. Türkiye''ye ilişkin ülkesel bazlı hasılat: 2024: 300.000.000
    TL; 2025: 360.000.000 TL; 2026: 480.000.000 TL. Ülkesel bazlı kazanç: 2024: 20.000.000 TL; 2025: 30.000.000 TL; 2026:
    100.000.000 TL. Gruba muaf işletme niteliği taşıyan bir bağlı işletme yoktur.


    **İstenenler:**


    (a) Grubun 2026 hesap dönemi için yerel ve küresel asgari tamamlayıcı kurumlar vergisi kapsamına girip girmediğini gerekçesiyle
    belirtiniz. (4 puan)


    (b) Türkiye''nin ülkesel bazlı vergi yükünü (etkin vergi oranını) ve asgari tamamlayıcı vergi oranını bulunuz. (5 puan)


    (c) Asgari tamamlayıcı kurumlar vergisi matrahını ve verginin tutarını hesaplayınız; bağlı işletmelere payını belirtiniz.
    (7 puan)


    (d) Ülkesel hasılat ve kazanç ortalamalarına göre verginin sıfır kabul edilebileceği alt sınır istisnasından yararlanılıp
    yararlanılamayacağını açıklayınız; ayrıca verginin beyan ve ödeme zamanını belirtiniz. (6 puan)

    '
  cozum: '**(a) Kapsam (Ek madde 1)**


    Nihai ana işletmenin konsolide hasılatı, gelirin raporlandığı hesap döneminden (2026) önceki dört hesap döneminin (2022–2025)
    en az ikisinde 750 milyon avroyu geçmelidir. 2023 (760) ve 2024 (790) olmak üzere iki dönemde eşik aşıldığından grubun
    bağlı işletmeleri vergiye tabidir.


    **(b) Vergi yükü ve oran (Ek madde 5/11 ve Ek madde 6)**


    - Ülkesel bazlı vergi yükü = 10.000.000 / 100.000.000 = **%10**

    - Asgari kurumlar vergisi oranı %15 (Ek 6/1)

    - Asgari tamamlayıcı vergi oranı = 15% − 10% = **%5** (Ek 6/2)


    **(c) Matrah ve vergi (Ek madde 6/3 ve 6/4)**


    Matrah = net ülkesel kazanç − (brüt ücretlerin %5''i + maddi duran varlık net defter değerinin %5''i)

    = 100.000.000 − (2.000.000 + 8.000.000) = **90.000.000 TL**


    Vergi = 90.000.000 × %5 = **4.500.000 TL**.


    Bağlı işletmelere pay (Ek 6/5): işletme bazlı kazancın ülkesel kazanca oranı kadar

    - Üretim A.Ş.: 60/100 × 4.500.000 = 2.700.000 TL

    - Satış A.Ş.: 40/100 × 4.500.000 = 1.800.000 TL


    **(d) Alt sınır ve beyan**


    Ek 6/8: ortalama (rapor yılı + önceki iki yıl) ülkesel hasılat 10 milyon avro (400.000.000 TL) ve ortalama ülkesel kazanç
    1 milyon avro (40.000.000 TL)''dan **her ikisi** de az ise vergi sıfır kabul edilebilir.

    - Ortalama hasılat = (300 + 360 + 480) / 3 = 380.000.000 TL < 400.000.000 TL (sağlanıyor)

    - Ortalama kazanç = (20 + 30 + 100) / 3 = 50.000.000 TL > 40.000.000 TL (sağlanmıyor)


    Kazanç şartı sağlanmadığından sıfır kabul edilemez.


    Yerel asgari tamamlayıcı vergi (Ek 10/3), hesap döneminin kapandığı ayı (Aralık 2026) izleyen on ikinci ayın (Aralık 2027)
    birinci gününden son gününe kadar, yani **1–31 Aralık 2027** arasında beyan edilir ve ödenir.


    Püf noktaları: (1) Kapsam testinde "önceki dört hesap döneminin en az ikisi" aranır. (2) Alt sınır testi iki ölçütün birlikte
    sağlanmasını ister. (3) Matrah, kazançtan ücret ve maddi duran varlık bazlı %5''lik düşüşle bulunur.

    '
