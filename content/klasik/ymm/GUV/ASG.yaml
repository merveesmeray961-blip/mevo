- id: YMM-GUV-ASG-K003
  sinav: ymm
  ders: GUV
  konu: ASG
  kazanimlar:
  - yurt içi asgari kurumlar vergisi
  - indirimli oran uygulaması nedeniyle alınmayan verginin düşülmesi
  - asgari verginin mahsup mekanizması
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: '**Olay:** Mercan Dış Ticaret A.Ş. 2022 yılında faaliyete başlamıştır (ihracat yapan, indirimli oranı uygulamayı seçmiş
    bir kurumdur). 2026 verileri:


    | Kalem | Tutar (TL) |

    |---|---|

    | İndirim ve istisnalar düşülmeden önceki kurum kazancı (ticari kâr + KKEG) | 60.000.000 |

    | Geçmiş yıl zararı (md. 9 uyarınca indirilebilir) | 45.000.000 |

    | Kurum kazancından geçmiş yıl zararı indirildikten sonra kalan matrah (başka indirim/istisna yoktur) | 15.000.000 |

    | Bu matrahın içinde yer alan, münhasıran ihracattan elde edilen kazanç | 12.000.000 |

    | Bu matrahın içinde yer alan diğer kazanç | 3.000.000 |


    KV oranı %25''tir; ihracat kazancına kurumlar vergisi oranı 5 puan indirimli uygulanır (KVK md. 32/7). Bu matrahta başka
    bir indirimli oran yoktur.


    **İstenenler:**


    (a) Normal hesaplamaya göre kurumlar vergisini bulunuz. (5 puan)


    (b) Yurt içi asgari kurumlar vergisini hesaplayınız (indirimli oran nedeniyle alınmayan verginin etkisi dahil). (8 puan)


    (c) Ödenecek kurumlar vergisini ve asgari verginin vergi yüküne ek etkisini hesaplayınız. (4 puan)


    (d) Asgari kurumlar vergisi bu sorudaki gibi geçici vergi dönemlerinde de uygulanır mı? (3 puan)

    '
  cozum: '**(a) Normal hesap**


    - İhracat kazancı: 12.000.000 × (%25 − 5 puan = %20) = 2.400.000 TL

    - Diğer kazanç: 3.000.000 × %25 = 750.000 TL

    - Toplam KV = **3.150.000 TL**


    **(b) Yurt içi asgari KV**


    Md. 32/C/1: hesaplanan KV, indirim ve istisnalar düşülmeden önceki kurum kazancının %10''undan az olamaz = 60.000.000
    × %10 = 6.000.000 TL. Md. 32/C/3: 32. maddenin 6, 7 ve 8. fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan
    vergi bu tutardan indirilir:

    - İhracat indirimi nedeniyle alınmayan vergi = 12.000.000 × %5 = 600.000 TL

    - Ödenmesi gereken asgari KV = 6.000.000 − 600.000 = **5.400.000 TL**


    **(c)** Hesaplanan KV (3.150.000 TL) asgari KV''den (5.400.000 TL) az olduğundan ödenecek KV **5.400.000 TL**''dir; ek
    yük = 5.400.000 − 3.150.000 = **2.250.000 TL**.


    **(d)** Evet. Md. 32/C/4: bu madde hükmü geçici vergi dönemleri için de uygulanır.


    Püf noktaları: (1) Geçmiş yıl zararı asgari vergi matrahını azaltmaz. (2) İndirimli oran nedeniyle alınmayan vergi, asgari
    vergiden düşülür (ihracat indirimi dahil). (3) Asgari vergi, hesaplanan KV''den büyükse ödenecek tutar asgari vergidir.

    '
  puanlama:
  - olcut: (a) İhracat kazancına %20, diğerine %25 ve 3.150.000 TL
