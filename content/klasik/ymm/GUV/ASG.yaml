- id: YMM-GUV-ASG-K002
  sinav: ymm
  ders: GUV
  konu: ASG
  kazanimlar:
  - yurt içi asgari kurumlar vergisi
  - asgari verginin hesabında düşülecek istisna ve indirimler
  - ilk faaliyet dönemi muafiyeti
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: '**Olay:** Ata Kimya A.Ş. 2022 yılında faaliyete başlamıştır. 2026 hesap dönemi verileri aşağıdadır:


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 40.000.000 |

    | Kanunen kabul edilmeyen giderler | 2.000.000 |

    | Kâr hesabına dahil, KVK md. 5/1-a kapsamındaki iştirak kâr payı | 15.000.000 |

    | Kâr hesabına dahil, iştirak hissesi satış kazancı (md. 5/1-e istisnası %50 uygulanacak) | 6.000.000 |

    | 5746 sayılı Kanun kapsamında Ar-Ge indirimi (md. 10 dışı, kurum kazancından indirilecek) | 4.000.000 |

    | KVK md. 10/1-c kapsamında kamu idaresine makbuzlu bağış (sınırın altındadır) | 800.000 |

    | Geçmiş yıl zararı (md. 9 kapsamında indirilebilir) | 12.000.000 |


    İndirimli kurumlar vergisi veya başka teşvik uygulaması yoktur. KV oranı %25''tir.


    **İstenenler:**


    (a) Yurt içi asgari kurumlar vergisinin hesabında esas alınacak kurum kazancını bulunuz. (6 puan)


    (b) Normal kurumlar vergisi hesabına göre matrahı ve hesaplanan kurumlar vergisini bulunuz. (5 puan)


    (c) 2026 yılında ödenmesi gereken kurumlar vergisini ve asgari verginin etkisini (fark tutarını) belirtiniz. (5 puan)


    (d) Şirket 2025 yılında ilk defa faaliyete başlamış olsaydı 2026 için sonucun ne olacağını açıklayınız. (4 puan)

    '
  cozum: '**(a) Asgari vergi matrahı (KVK md. 32/C)**


    "İndirim ve istisnalar düşülmeden önceki kurum kazancı" = ticari bilanço kârı + KKEG = 40.000.000 + 2.000.000 = 42.000.000
    TL (md. 32/C/6).


    Md. 32/C/2''ye göre bu tutardan yalnızca sayılan istisna ve indirimler düşülür:


    | Kalem | Düşülür mü? | Tutar |

    |---|---|---|

    | İştirak kâr payı (md. 5/1-a) | Evet | 15.000.000 |

    | İştirak hissesi satış istisnası (md. 5/1-e) | Hayır (sayılan bentler arasında yok) | 0 |

    | Ar-Ge ve tasarım indirimi (5746) | Evet | 4.000.000 |

    | Bağış indirimi (md. 10/1-c) | Hayır | 0 |

    | Geçmiş yıl zararı | Hayır | 0 |


    Asgari vergi matrahı = 42.000.000 − 15.000.000 − 4.000.000 = **23.000.000 TL**; yurt içi asgari KV = 23.000.000 × %10
    = **2.300.000 TL**.


    **(b) Normal hesap**


    | Kalem | Tutar |

    |---|---|

    | Kurum kazancı | 42.000.000 |

    | − İştirak kâr payı | (15.000.000) |

    | − Satış istisnası (6.000.000 × %50) | (3.000.000) |

    | − Ar-Ge indirimi | (4.000.000) |

    | − Bağış | (800.000) |

    | − Geçmiş yıl zararı | (12.000.000) |

    | **Matrah** | **7.200.000** |


    KV = 7.200.000 × %25 = **1.800.000 TL**.


    **(c)** Hesaplanan KV (1.800.000 TL), asgari KV''den (2.300.000 TL) az olduğundan ödenecek KV **2.300.000 TL**''dir; asgari
    verginin etkisi 2.300.000 − 1.800.000 = **500.000 TL**. Asgari vergi geçici vergi dönemlerinde de uygulanır.


    **(d)** Md. 32/C/5: ilk defa faaliyete başlayan kurumlar hakkında faaliyete başlanılan hesap döneminden itibaren üç hesap
    dönemi (2025, 2026, 2027) boyunca bu madde uygulanmaz. Bu durumda 2026 için ödenecek vergi **1.800.000 TL** olur.


    Püf noktaları: (1) Satış istisnası (5/1-e), bağış ve geçmiş yıl zararı asgari vergi matrahından düşülmez. (2) "İndirim
    ve istisnalar düşülmeden önceki kurum kazancı" ticari kâr + KKEG''dir. (3) İlk üç hesap dönemi (faaliyete başlanılan dönem
    dahil) muaftır.

    '
  puanlama:
  - olcut: (a) 42.000.000 TL, düşülecek/düşülmeyecek kalemler ve 2.300.000 TL asgari vergi
    puan: 6
  - olcut: (b) Normal matrah 7.200.000 TL ve KV 1.800.000 TL
    puan: 5
  - olcut: (c) Ödenecek 2.300.000 TL ve 500.000 TL fark
    puan: 5
  - olcut: (d) Üç hesap dönemi muafiyeti ve 1.800.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/1
    alinti: 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden
      önceki kurum kazancının %10’undan az olamaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-a
    alinti: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları taşınmazlardan elde
      edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-ç
    alinti: ç) 4691 sayılı Kanun kapsamındaki kazanç istisnası ile kurumlar vergisi matrahından indirim konusu yapılabilen
      Ar-Ge ve tasarım indirimleri.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/4
    alinti: Bu madde hükmü geçici vergi dönemleri için de uygulanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/5
    alinti: İlk defa faaliyete başlayan kurumlar hakkında faaliyete başlanılan hesap döneminden itibaren üç hesap dönemi boyunca
      bu madde hükümleri uygulanmaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/6
    alinti: Bu maddede yer alan indirim ve istisnalar düşülmeden önceki kurum kazancı ibaresi, hesap dönemi sonundaki ticari
      bilanço kârına kanunen kabul edilmeyen giderlerin eklenmesiyle bulunan tutarı ifade eder.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kazanc = 40000000 + 2000000

      asgari_matrah = kazanc - 15000000 - 4000000

      asgari = asgari_matrah * 0.10

      matrah = kazanc - 15000000 - 6000000 * 0.5 - 4000000 - 800000 - 12000000

      kv = matrah * 0.25

      odenecek = max(kv, asgari)

      sonuc = {"a": [kazanc, asgari_matrah, asgari], "b": [matrah, kv], "c": [odenecek, odenecek - kv], "d": kv}

      '
