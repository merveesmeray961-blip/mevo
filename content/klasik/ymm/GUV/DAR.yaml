    vergi yükü %20 olup (A) A.Ş.''nin 900.000 TL tutarındaki kâr payı süresinde Türkiye''ye transfer edilmiştir. KVK md. 5/1-(b)
    istisnası bu kâr payına uygulanmıştır; kâr payına isabet eden ve yurt dışında ödenen vergi 150.000 TL''dir.


