    Püf noktaları: (1) Kontrol oranında yıl içindeki en yüksek oran esastır (Kıbrıs örneği); ama pasif gelir ve vergi yükü
    şartları da birlikte aranır. (2) Üç şart "birlikte" gerçekleşmelidir. (3) Vergilenmiş kazancın sonradan dağıtımında yalnız
    vergilenmemiş kısım vergiye tabidir.

