    python: "kontrol = 0.45 + 0.10 + 0.15\npasif = 15000000/50000000\nyuk = 1600000/20000000\na_ek = 20000000*0.40\nb_ek =\
      \ 20000000*0.10\na_mahsup = min(1600000*0.40, a_ek*0.25)\nb_mahsup = min(1600000*0.10, b_ek*0.25)\nsonuc = {\"kontrol\"\
      : kontrol, \"pasif\": pasif, \"vergi_yuku\": yuk, \"a_ek\": a_ek, \"a_kv\": a_ek*0.25,\n         \"a_mahsup\": a_mahsup,\
      \ \"a_net\": a_ek*0.25 - a_mahsup, \"b_ek\": b_ek, \"b_net\": b_ek*0.25 - b_mahsup,\n         \"patent_kesinti\": 3000000*0.20,\
      \ \"kar_payi_kesinti\": 2000000*0.05}\n"
