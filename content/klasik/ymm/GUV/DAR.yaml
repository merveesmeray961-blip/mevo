  cozum: '**(a) Gürcistan iş yeri (KVK md. 33/1, 33/4)**


    Yurt dışı kazançlar üzerinden mahsup edilebilecek vergi, bu kazançlara md. 32''deki kurumlar vergisi oranı (%25) uygulanarak
    bulunacak tutardan fazla olamaz.


    - Mahsup sınırı: 2.000.000 × %25 = **500.000 TL**.

    - Yurt dışında ödenen vergi 600.000 TL olduğundan mahsup edilecek tutar **500.000 TL**''dir.

    - Aşan **100.000 TL** mahsup edilemez. Md. 33/4''teki üç dönemlik taşıma hakkı yalnızca sınır dahilindeki, ilgili yılda
    indirilemeyen vergiler içindir; sınırı aşan tutar cari yılda olduğu gibi sonraki yıllarda da mahsup edilemez.


    **(b) (V) Ltd. kâr payı (KVK md. 33/3)**


