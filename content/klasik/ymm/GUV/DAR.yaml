    python: "kk = 10000000 + 400000 + 300000\nmatrah = kk - 1000000\nkv = matrah * 25 // 100\nlimit = kk - kv\naktarim = min(6000000,\
      \ limit) * 15 // 100\nmarka_brut = round(1700000 / 0.85)\nsonuc = {'kurum_kazanci': kk, 'matrah': matrah, 'kv': kv,\
      \ 'aktarim_limit': limit,\n         'aktarim_kesinti': aktarim, 'marka_brut': marka_brut, 'marka_kesinti': marka_brut\
      \ * 15 // 100,\n         'danismanlik_kesinti': 500000 * 20 // 100}"
