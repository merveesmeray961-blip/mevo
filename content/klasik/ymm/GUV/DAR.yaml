- id: YMM-GUV-DAR-K001
  sinav: ymm
  ders: GUV
  konu: DAR
  kazanimlar:
  - dar mükellef kurumların vergilendirilmesi
  - KVK md.30 tevkifat
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kanuni ve iş merkezi Almanya''da bulunan (T) GmbH, Türkiye''deki şubesi (iş yeri) aracılığıyla ticari faaliyette
    bulunmaktadır. Şubenin hesap dönemi takvim yılı, kurumlar vergisi oranı %25''tir. Şubenin 2026 yılı ticari bilanço kârı
    **10.000.000 TL**''dir. Bu kârın tespitinde gider ve gelir olarak dikkate alınan kalemlerden bazıları şunlardır:


    | Kalem | Tutar (TL) |

    |---|---|

    | Ana merkezin şube hesabına yaptığı mal alımları için ana merkeze ödenen komisyon (gider) | 400.000 |

    | Ana merkez genel yönetim giderlerinden, Türkiye''deki kazancın elde edilmesi ve idamesiyle ilgili olup emsallere uygun
    dağıtım anahtarıyla ayrılan pay (gider) | 600.000 |

    | Ana merkezin geçmiş yıl zararlarına katılım payı (gider) | 300.000 |

    | Şubeyi denetlemek üzere Almanya''dan gelen yetkililerin seyahat giderleri (gider) | 100.000 |

    | Şube faaliyeti kapsamında tam mükellef (P) AŞ''den alınan kâr payı (gelir) | 1.000.000 |


    Diğer bilgiler:


    1. Şube, 2026 kârından 2027 yılında ana merkeze 6.000.000 TL aktarmıştır.

    2. Tam mükellef (A) AŞ, Türkiye''de iş yeri ve daimi temsilcisi bulunmayan (R) Ltd.''den (İngiltere) bir markayı satın
    almıştır. (R) Ltd.''ye net 1.700.000 TL ödenmesi kararlaştırılmış ve kesilmesi gereken vergiyi (A) AŞ üstlenmiştir.

    3. (T) GmbH''nin Almanya''daki merkezi, Türkiye''deki şubeden bağımsız olarak tam mükellef (K) AŞ''ye mühendislik danışmanlığı
    vermiş ve (K) AŞ 500.000 TL bedeli tahakkuk ettirmiştir. Hizmetin şubenin faaliyetiyle bağlantısı yoktur.

    4. Kesinti oranları: ana merkeze aktarılan tutar ve gayrimaddi hak bedelleri için %15, serbest meslek kazançları için
    %20. Çifte vergilendirmeyi önleme anlaşması hükümleri dikkate alınmayacaktır; yurt içi asgari kurumlar vergisinin sonuca
    etkisi olmadığı kabul edilecektir.


    **İstenenler:**


    (a) KVK md. 22 hükümlerini açıklayarak şubenin kurum kazancını, kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini
    bulunuz. (9 puan)


    (b) Ana merkeze aktarım nedeniyle yapılacak vergi kesintisini; kesinti matrahının üst sınırını, kesintiyi kimin yapacağını
    ve nasıl beyan edileceğini belirterek hesaplayınız. (6 puan)


    (c) (A) AŞ''nin marka bedeli nedeniyle yapması gereken kesintiyi hesaplayınız. (5 puan)


    (d) (K) AŞ''nin danışmanlık bedeli üzerinden kesinti yapıp yapmayacağını ve tutarını; (T) GmbH''nin bu kazanç için Türkiye''de
    beyanname vermesinin zorunlu olup olmadığını açıklayınız. (5 puan)

    '
  cozum: '**(a) Şube kazancı (KVK md. 22)**


    Dar mükellefin iş yeri vasıtasıyla elde ettiği kazanç, aksi belirtilmedikçe tam mükellefler için geçerli hükümlere göre
    tespit edilir (md. 22/1). Md. 22/3 ayrıca şu indirimleri kabul etmez: (a) bu kurumlar hesabına yapılan alım-satımlar için
    ana merkeze verilen faiz, komisyon ve benzerleri; (b) ana merkezin genel yönetim giderlerine veya zararlarına katılmak
    üzere ayrılan paylar. Ancak Türkiye''deki kazançla ilgili olup emsallere uygun dağıtım anahtarına göre ayrılan paylar
    ile denetim için gönderilen yetkililerin seyahat giderleri indirilebilir.


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 10.000.000 |

    | + Ana merkeze ödenen komisyon (md. 22/3-a) | 400.000 |

    | + Ana merkez zararlarına katılım payı (md. 22/3-b) | 300.000 |

    | = Kurum kazancı (indirim ve istisnalar öncesi) | **10.700.000** |

    | − İştirak kazançları istisnası (md. 5/1-a; alan kurumun dar mükellef olması engel değildir) | 1.000.000 |

    | = Kurumlar vergisi matrahı | **9.700.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.425.000** |


    Emsallere uygun dağıtım anahtarıyla ayrılan 600.000 TL ve denetim seyahat gideri 100.000 TL indirilebilir; kâra ilave
    edilmez.


    **(b) Ana merkeze aktarım kesintisi (md. 30/6)**


    - Kesinti, indirim ve istisnalar düşülmeden önceki kurum kazancından hesaplanan kurumlar vergisi düşüldükten sonra kalan
    kısımdan ana merkeze aktarılan tutar üzerinden yapılır. Üst sınır: 10.700.000 − 2.425.000 = **8.275.000 TL**.

    - Aktarılan 6.000.000 TL bu sınırın altındadır → kesinti = 6.000.000 × %15 = **900.000 TL**.

    - Kesinti kurum bünyesinde, yani şube tarafından yapılır ve md. 31 uyarınca muhtasar beyanname ile bildirilir. Aktarılmayan
    kâr için kesinti yapılmaz.


    **(c) Marka bedeli (md. 30/2, 30/11)**


    - Marka gibi gayrimaddi hakların satışı, devir ve temliki karşılığı ödenen bedeller, ticari kazanca dahil olup olmadığına
    bakılmaksızın kesintiye tabidir.

    - Vergi ödemeyi yapan tarafından üstlenildiğinden matrah brütleştirilir: 1.700.000 / 0,85 = **2.000.000 TL**; kesinti
    = 2.000.000 × %15 = **300.000 TL**. (A) AŞ bu tutarı muhtasar beyannameyle bildirir.


    **(d) Şubeyle bağlantısız danışmanlık**


    - Tebliğe göre dar mükellefin Türkiye''de iş yeri bulunsa da bu iş yerinde yürüttüğü faaliyetle bağlantılı olmayan serbest
    meslek kazançları üzerinden md. 30/1-(b) uyarınca kesinti yapılır: 500.000 × %20 = **100.000 TL** (gayrisafi tutar üzerinden;
    ödeme veya tahakkuk aşamasında).

    - Md. 30/9 uyarınca ticari ve zirai kazançlar hariç, kesinti yoluyla vergilenen kazanç ve iratlar için beyanname verilmesi
    **ihtiyaridir**; (T) GmbH''nin bu kazanç için beyan zorunluluğu yoktur ve kazancı şube beyannamesine dahil etmesi de zorunlu
    değildir.


    Dayanak: KVK md. 5/1-(a), 22/1, 22/3, 30/1-(b), 30/2, 30/6, 30/9, 30/11, 31; 1 Seri No.lu KV Genel Tebliği bölüm 5.1,
    22.3, 30.3, 30.4.9.'
  puanlama:
  - olcut: Md. 22/3 kapsamında komisyon ve zarara katılım payının KKEG sayılması
    puan: 3
  - olcut: Dağıtım anahtarlı genel gider payı ve denetim seyahat giderinin indirilebileceğinin gerekçelendirilmesi
    puan: 2
  - olcut: Kurum kazancının 10.700.000 TL bulunması
    puan: 1
  - olcut: Kâr payına iştirak kazançları istisnasının dar mükellef için de uygulanması ve matrahın 9.700.000 TL bulunması
    puan: 2
  - olcut: Hesaplanan kurumlar vergisinin 2.425.000 TL bulunması
    puan: 1
  - olcut: Aktarım kesintisi üst sınırının 8.275.000 TL olarak hesaplanması
    puan: 2
  - olcut: Kesintinin 900.000 TL bulunması
    puan: 2
  - olcut: Kesintinin kurum bünyesinde yapılıp muhtasar beyanname ile bildirileceğinin belirtilmesi
    puan: 2
  - olcut: Marka bedelinin md. 30/2 kapsamında olduğunun belirtilmesi
    puan: 1
  - olcut: Brütleştirme ile matrahın 2.000.000 TL bulunması
    puan: 3
  - olcut: Kesintinin 300.000 TL bulunması
    puan: 1
  - olcut: Şubeyle bağlantısız serbest meslek kazancında kesinti yapılacağının gerekçelendirilmesi
    puan: 2
  - olcut: Kesintinin 100.000 TL bulunması
    puan: 1
  - olcut: Md. 30/9 uyarınca beyanın ihtiyari olduğunun açıklanması
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(a), 22, 30/1-(b), 30/2, 30/6, 30/9, 30/11, 31
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.1, 22.3, 30.3, 30.4.9
