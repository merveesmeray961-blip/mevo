    puan: 2
  - olcut: Bay A'nın payının md. 7 ile vergilendirilmemesi ve 2027 dağıtımında md. 7/5
    puan: 3
  - olcut: Anlaşmaların saklı olduğu ve iç mevzuat oranını sınırladığı; mukimlik belgesi şartı
    puan: 2
  - olcut: Aracı şirket nedeniyle anlaşma oranının reddi ve 600.000 TL kesinti
    puan: 4
  - olcut: (E) GmbH için %5 anlaşma oranı ve 100.000 TL kesinti; beyan zamanı
    puan: 3
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b, 7, 30, 31, 33, 35/3
