    ve vergiye tabi tutarı bulunuz. (6 puan)

    '
  cozum: '**(a) Değerlendirme**


    Md. 7/1: tam mükellef kurumun doğrudan veya dolaylı olarak sermayenin, kâr payının veya oy hakkının en az %50''sine sahip
    olması (kontrol oranı olarak hesap dönemi içinde herhangi bir tarihte sahip olunan en yüksek oran dikkate alınır) ve birlikte
    şu şartlar aranır: (a) pasif gelirler ≥ %25, (b) vergi yükü %10''dan az, (c) hasılatın 100.000 YTL karşılığını geçmesi.


    | İştirak | Kontrol | Pasif gelir ≥ %25 | Vergi yükü < %10 | Hasılat | Sonuç |

