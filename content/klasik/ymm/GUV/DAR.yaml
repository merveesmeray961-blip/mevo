    ve eleman istihdamı suretiyle yürütülen ticarî faaliyet dışındaki gelirlerdir. Dönem sonunda Malta Ltd. ve BAE Ltd. hesap
    dönemleri takvim yılıdır. Türkiye''deki kurum kazancı (kontrol edilen yabancı kurum kazançları hariç) 10.000.000 TL''dir
    ve istisna/indirim yoktur. KV oranı %25''tir.


    **İstenenler:**


    (a) Her bir iştirak bakımından kontrol edilen yabancı kurum (KVK md. 7) şartlarının sağlanıp sağlanmadığını gerekçesiyle
