  soru: '**Olay:** Tam mükellef Boğaz Holding A.Ş.''nin 2026 hesap dönemi itibarıyla yurt dışı iştirakleri aşağıdadır:


    | İştirak | Sermaye payı | Pasif gelirlerin gayrisafi hasılata oranı | Toplam vergi yükü | Gayrisafi hasılat | Hesap dönemi
    kârı (TL) |

    |---|---|---|---|---|---|

    | Malta Ltd. | %60 | %30 | %5 | 100.000 YTL karşılığı yabancı parayı geçmektedir | 4.000.000 |

    | Kıbrıs Ltd. | Yıl boyunca %45; yılın bir gününde %52''ye çıkmıştır | %12 | %6 | Sınırı geçmektedir | 1.500.000 |

    | Hollanda B.V. | %80 | %20 | %4 | Sınırı geçmektedir | 3.000.000 |

    | BAE Ltd. | %70 | %40 | %0 | Sınırı geçmektedir | 1.000.000 |


    Pasif gelirler faiz, kâr payı, kira, lisans ücreti, menkul kıymet satış geliri gibi, faaliyet ile orantılı sermaye, organizasyon
    ve eleman istihdamı suretiyle yürütülen ticarî faaliyet dışındaki gelirlerdir. Dönem sonunda Malta Ltd. ve BAE Ltd. hesap
    dönemleri takvim yılıdır. Türkiye''deki kurum kazancı (kontrol edilen yabancı kurum kazançları hariç) 10.000.000 TL''dir
    ve istisna/indirim yoktur. KV oranı %25''tir.


    **İstenenler:**


    (a) Her bir iştirak bakımından kontrol edilen yabancı kurum (KVK md. 7) şartlarının sağlanıp sağlanmadığını gerekçesiyle
    belirtiniz. (10 puan)


    (b) Türkiye''de kurumlar vergisi matrahına dahil edilecek tutarı ve 2026 kurumlar vergisini hesaplayınız. (6 puan)


    (c) 2027 yılında Malta Ltd.''nin 3.000.000 TL kâr payı dağıtması hâlinde, bu kâr payının vergilendirilmesini açıklayınız
    ve vergiye tabi tutarı bulunuz. (6 puan)

    '
  cozum: '**(a) Değerlendirme**


    Md. 7/1: tam mükellef kurumun doğrudan veya dolaylı olarak sermayenin, kâr payının veya oy hakkının en az %50''sine sahip
    olması (kontrol oranı olarak hesap dönemi içinde herhangi bir tarihte sahip olunan en yüksek oran dikkate alınır) ve birlikte
    şu şartlar aranır: (a) pasif gelirler ≥ %25, (b) vergi yükü %10''dan az, (c) hasılatın 100.000 YTL karşılığını geçmesi.


    | İştirak | Kontrol | Pasif gelir ≥ %25 | Vergi yükü < %10 | Hasılat | Sonuç |

    |---|---|---|---|---|---|

    | Malta | %60 evet | %30 evet | %5 evet | Evet | KYK |

    | Kıbrıs | En yüksek oran %52 → evet | %12 hayır | %6 evet | Evet | KYK değil (pasif gelir şartı yok) |

    | Hollanda | %80 evet | %20 hayır | %4 evet | Evet | KYK değil |

    | BAE | %70 evet | %40 evet | %0 evet | Evet | KYK |


    **(b) Matrah**


    İştirakin kârı, hisseleri oranında tam mükellef kurumun matrahına dahil edilir (dağıtılsın veya dağıtılmasın).

    - Malta: 4.000.000 × %60 = 2.400.000 TL

    - BAE: 1.000.000 × %70 = 700.000 TL

    - Dahil edilecek toplam = **3.100.000 TL**


    Kurum kazancı = 10.000.000 + 3.100.000 = 13.100.000 TL; KV = 13.100.000 × %25 = **3.275.000 TL** (KYK''dan kaynaklanan
    artış 775.000 TL).


