- id: YMM-GUV-DAR-K002
  sinav: ymm
  ders: GUV
  konu: DAR
  kazanimlar:
  - kontrol edilen yabancı kurum
  - çifte vergilendirmeyi önleme anlaşmaları
  - KVK md.30 tevkifat
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Bölüm A – Kontrol edilen yabancı kurum.** Kanuni ve iş merkezi (Q) ülkesinde bulunan (Q) Ltd.''nin hesap dönemi
    takvim yılıdır. 2026 yılında (Q) Ltd.''nin sermayesindeki paylar:


    | Ortak | Niteliği | Pay |

    |---|---|---|

    | (A) A.Ş. | Tam mükellef kurum | 1/1–30/9/2026: %45; 1/10/2026''dan itibaren (%5''ini üçüncü kişiye satmıştır): %40 |

    | (B) A.Ş. | Tam mükellef kurum; sermayesinin %100''ü (A) A.Ş.''ye aittir | %10 (tüm yıl) |

    | Bay A | Tam mükellef gerçek kişi | %15 (tüm yıl) |

    | Diğerleri | Yabancı kişiler | Kalan |


    (Q) Ltd.''nin 2026 yılı bilgileri (TL karşılıkları): toplam gayrisafi hasılat 50.000.000 TL, bunun 15.000.000 TL''si faiz,
    kira ve lisans gelirlerinden oluşmaktadır (bu gelirler faaliyetle orantılı sermaye, organizasyon ve eleman istihdamıyla
    yürütülen bir ticari faaliyetten elde edilmemiştir); vergi öncesi ticari bilanço kârı 20.000.000 TL; (Q) ülkesinde ödenen
    kurumlar vergisi 1.600.000 TL (md. 33/6''ya uygun belge vardır). 2026''da kâr dağıtılmamıştır. 2027 yılında (Q) Ltd. 2026
    kârından (A) A.Ş.''ye 4.000.000 TL kâr payı dağıtmıştır.


    **Bölüm B – Dar mükelleflere ödemeler.** (A) A.Ş. 2026''da:


    1. Türkiye''de iş yeri ve daimi temsilcisi bulunmayan (D) B.V.''ye (Hollanda) bir patentin devri karşılığında **brüt 3.000.000
    TL** ödemiştir. Türkiye–Hollanda anlaşmasında bu ödemeler için kaynak ülke vergisi %10 ile sınırlıdır. (D) B.V. Hollanda
    mukimlik belgesi ibraz etmiştir; ancak inceleme, (D) B.V.''nin personeli ve faaliyeti olmadığını, tahsil ettiği bedeli
    aynen ve hemen Bermuda''daki ana şirketine aktarmakla yükümlü olduğunu ortaya koymuştur. Bermuda ile anlaşma yoktur ve
    md. 30/7 kapsamında ilan edilmiş bir ülke söz konusu değildir.

    2. %30 ortağı olan ve Türkiye''de iş yeri bulunmayan (E) GmbH''ye (Almanya) **brüt 2.000.000 TL** kâr payı dağıtmıştır.
    (E) GmbH mukimlik belgesi ibraz etmiştir ve kâr payının gerçek faydalanıcısıdır. Türkiye–Almanya anlaşmasında sermayenin
    en az %10''una sahip şirketlere ödenen kâr paylarında kaynak ülke vergisi %5 ile sınırlıdır.


    İç mevzuattaki kesinti oranları: gayrimaddi hak bedelleri %20 (2009/14593 sayılı BKK); dar mükellef kuruma dağıtılan kâr
    payı %15 (9286 sayılı CBK). Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) (Q) Ltd.''nin KVK md. 7 kapsamında kontrol edilen yabancı kurum sayılıp sayılmadığını şartları tek tek inceleyerek
    açıklayınız. (8 puan)


    (b) (A) A.Ş. ve (B) A.Ş.''nin 2026 kurumlar vergisi matrahına eklenecek tutarları, hesaplanan vergiyi ve yurt dışında
    ödenen vergiden mahsup edilecek tutarı hesaplayınız; Bay A''nın durumunu ve 2027''deki kâr dağıtımının vergilendirilmesini
    açıklayınız. (8 puan)


    (c) Bölüm B''deki ödemelerde yapılacak kesintileri, anlaşma ile iç mevzuat ilişkisi ve gerçek faydalanıcı kavramı çerçevesinde
    hesaplayınız. (9 puan)

    '
  cozum: '**(a) KYK şartları (md. 7/1)**


    1. *Kontrol (en az %50):* Tam mükellef gerçek kişi ve kurumların doğrudan veya dolaylı, ayrı ayrı ya da birlikte sahip
    olduğu pay dikkate alınır; kontrol oranında dönem içinde herhangi bir tarihte sahip olunan **en yüksek oran** esas alınır
    (md. 7/3). (A) %45 (en yüksek) + (B) %10 ((A)''nın %100 bağlı ortaklığı aracılığıyla dolaylı) + Bay A %15 = **%70 ≥ %50**;
    şart sağlanır.

    2. *Pasif gelir (en az %25):* 15.000.000 / 50.000.000 = **%30 ≥ %25**; sağlanır.

    3. *Vergi yükü (%10''dan az):* Md. 5/1-b tanımına göre: 1.600.000 / (18.400.000 + 1.600.000) = **%8 < %10**; sağlanır.

    4. *Hasılat:* 50.000.000 TL, 100.000 YTL karşılığını aşar; sağlanır.


    Şartlar birlikte gerçekleştiğinden (Q) Ltd. **kontrol edilen yabancı kurumdur**; kazancı dağıtılsın veya dağıtılmasın
    Türkiye''de vergilendirilir.


    **(b) Matraha ekleme ve mahsup**


    Kâr, iştirakin hesap döneminin kapandığı ayı içeren dönem itibarıyla tam mükellef kurumların matrahına **hisseleri oranında**
    eklenir (md. 7/4); Tebliğ bölüm 7.3''e göre bu oran hesap döneminin kapandığı tarihteki orandır; eklenen tutar vergi öncesi
    kazançtır.


    | Kurum | Pay (31/12/2026) | Eklenecek (TL) | KV %25 (TL) | Md. 33/2 mahsup (TL) | Net (TL) |

    |---|---|---|---|---|---|

    | (A) A.Ş. | %40 | 8.000.000 | 2.000.000 | 1.600.000 × %40 = 640.000 | 1.360.000 |

    | (B) A.Ş. | %10 | 2.000.000 | 500.000 | 1.600.000 × %10 = 160.000 | 340.000 |


    Mahsup tutarları md. 33/4 sınırını (eklenen tutar × %25) aşmamaktadır.


    - Bay A: Kontrol oranının tespitinde payı dikkate alınır; ancak md. 7 yalnız tam mükellef **kurumların** matrahına ekleme
    öngördüğünden Bay A''nın %15''lik payı bu madde uyarınca vergilendirilmez.

    - 2027 dağıtımı: Md. 7/5''e göre daha önce Türkiye''de vergilenmiş kazancın sonradan dağıtılmasında kâr payının yalnız
    **vergilenmemiş kısmı** vergilendirilir. (A)''ya dağıtılan 4.000.000 TL, (A) nezdinde 2026''da vergilenmiş 8.000.000 TL''lik
    kazançtan karşılandığından yeniden vergilendirilmez.


    **(c) Dar mükelleflere kesinti**


    Uluslararası anlaşma hükümleri saklıdır (KVK md. 35/3); anlaşma vergi yaratmaz, iç mevzuattaki oranı sınırlar. İndirimli
    anlaşma oranı mukimlik belgesi ve **gerçek faydalanıcılık** şartıyla uygulanır. Geliri kendi faaliyeti ve tasarruf yetkisi
    olmaksızın aynen üçüncü ülkeye aktaran aracı şirket gerçek faydalanıcı değildir.


    | Ödeme | Değerlendirme | Kesinti (TL) |

    |---|---|---|

    | Patent devri (D) B.V. | Gayrimaddi hak devri bedeli KVK md. 30/2 kapsamındadır; iç mevzuat oranı %20. (D) B.V. aracı
    (conduit) şirket olup gerçek faydalanıcı değildir; Hollanda anlaşmasının %10 sınırı uygulanmaz; gerçek faydalanıcının
    ülkesi Bermuda ile anlaşma yoktur. 3.000.000 × %20 | 600.000 |

    | Kâr payı (E) GmbH | KVK md. 30/3; iç mevzuat %15. Mukimlik belgesi var, gerçek faydalanıcıdır, %30 pay ≥ %10: anlaşmadaki
    %5 sınırı uygulanır. 2.000.000 × %5 | 100.000 |

    | **Toplam** | | **700.000** |


    Kesintiler ödemenin yapıldığı ayı izleyen ay muhtasar beyanname ile beyan edilip ödenir (md. 31). Anlaşma uygulanmasaydı
    (E) GmbH''ye kesinti 300.000 TL, (D) B.V. için anlaşma kabul edilseydi 300.000 TL olurdu.

    '
  puanlama:
  - olcut: Kontrol oranında dolaylı pay, gerçek kişi payı ve dönem içi en yüksek oranın dikkate alınması (%70)
