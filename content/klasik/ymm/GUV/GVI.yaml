    kitabın yayınevinden **900.000 TL** telif hasılatı elde etmiş, yayınevi %17 tevkifat yapmıştır. Kanuni ve iş merkezi İngiltere''de
    bulunan (Q) Ltd.''nin (limited şirket niteliğinde) ödenmiş sermayesinin %25''ine sahiptir; 2026''da tahsil ettiği **600.000
    TL** karşılığı kâr payının tamamını Mart 2027 başında Türkiye''ye transfer etmiştir (İngiltere''de vergi kesilmemiştir).


