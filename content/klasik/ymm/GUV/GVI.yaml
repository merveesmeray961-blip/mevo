- id: YMM-GUV-GVI-K001
  sinav: ymm
  ders: GUV
  konu: GVI
  kazanimlar:
  - muafiyet ve istisnalar
  - gelirin toplanması ve indirimler
  - vergi tarifesi
  - beyan ve ödeme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Serbest avukat Deniz Hanım''ın 2026 yılına ilişkin bilgileri aşağıdadır:


    | Kalem | Tutar (TL) |

    |---|---|

    | Serbest meslek kazancı (safi) | 1.100.000 |

    | Müvekkil şirketlerin serbest meslek ödemeleri üzerinden yaptığı tevkifat | 180.000 |

    | 2026 yılı dönemleri için tahakkuk ettirilip ödenen geçici vergi | 60.000 |

    | Konut olarak kiraya verdiği daireden 2026 yılında tahsil edilen kira (götürü gider usulü seçilmiştir) | 240.000 |

    | Kendi adına, merkezi Türkiye''de bulunan şirkete ödenen hayat sigortası primi | 40.000 |

    | Kendisi ve küçük çocuğu için Türkiye''de yapılan, belgeli eğitim ve sağlık harcamaları | 150.000 |

    | Türkiye Kızılay Derneğine makbuz karşılığı nakdi bağış | 20.000 |


    Ek bilgiler: 2026 yılı mesken kira geliri istisnası 58.000 TL''dir. Hayat sigortası primi için asgari ücretin yıllık tutarı
    sınırı aşılmamaktadır. Deniz Hanım''ın geçmiş yıl zararı yoktur ve mükerrer 121. maddedeki vergi indiriminden yararlanmamaktadır.


    2026 yılı gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için
    28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si
    için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40.


    **İstenenler:**


    (a) Kira gelirinin mesken istisnasından yararlanıp yararlanamayacağını gerekçesiyle açıklayınız ve beyan edilecek gelir
    toplamını bulunuz. (6 puan)


    (b) Gelirden yapılabilecek indirimleri sınırlarıyla birlikte hesaplayarak gelir vergisi matrahını bulunuz. (8 puan)


    (c) Hesaplanan gelir vergisini bulunuz. (5 puan)


    (d) Mahsupları yaparak ödenecek gelir vergisini bulunuz; beyannamenin verilme süresini ve verginin ödeme zamanlarını tutarlarıyla
    belirtiniz. (6 puan)

    '
  cozum: '**(a) Mesken istisnası ve beyan edilen gelir**


    GVK md.21/2''ye göre mesleki kazancını yıllık beyanname ile bildirmek zorunda olanlar mesken kira istisnasından yararlanamaz.
    Deniz Hanım serbest meslek kazancı nedeniyle beyanname vermek zorunda olduğundan istisna uygulanmaz.


    - GMSİ safi: 240.000 − (240.000 × %15) = 204.000 TL (md.74, götürü gider)

    - Beyan edilen gelir: 1.100.000 + 204.000 = **1.304.000 TL**


    **(b) İndirimler (md.89) ve matrah**


    | İndirim | Hesap | İndirilebilir |

    |---|---|---|

    | Hayat sigortası primi | 40.000 × %50 = 20.000; sınır 1.304.000 × %15 = 195.600 | 20.000 |

    | Eğitim ve sağlık harcamaları | Sınır 1.304.000 × %10 = 130.400 < 150.000 | 130.400 |

    | Kızılay nakdi bağışı | Tamamı (md.89/1-11) | 20.000 |

    | **Toplam** | | **170.400** |


    Matrah: 1.304.000 − 170.400 = **1.133.600 TL**


    **(c) Hesaplanan gelir vergisi**


    232.500 + (1.133.600 − 1.000.000) × %35 = 232.500 + 46.760 = **279.260 TL**


    **(d) Mahsup, ödeme ve süreler**


    - Mahsup edilecek tevkifat (md.121): 180.000 TL

    - Mahsup edilecek geçici vergi (mük. md.120): 60.000 TL

    - Ödenecek gelir vergisi: 279.260 − 240.000 = **39.260 TL**

    - Beyanname: 1–25 Mart 2027 (md.92)

    - Ödeme: Mart 2027''de 19.630 TL ve Temmuz 2027''de 19.630 TL olmak üzere iki eşit taksit (md.117)

    '
  puanlama:
  - olcut: (a) Mesleki kazanç nedeniyle beyan zorunluluğu olduğundan mesken istisnasının uygulanmayacağının gerekçelendirilmesi
    puan: 3
  - olcut: (a) Götürü gider ile GMSİ safi tutarı ve beyan edilen gelir (1.304.000 TL)
    puan: 3
  - olcut: (b) Hayat sigortası priminin %50'si ve %15 sınır kontrolü (20.000 TL)
    puan: 2
  - olcut: (b) Eğitim-sağlık harcamasının %10 ile sınırlanması (130.400 TL)
    puan: 3
  - olcut: (b) Kızılay bağışının tamamının indirilmesi ve matrah (1.133.600 TL)
    puan: 3
  - olcut: (c) Tarifenin doğru diliminin uygulanması ve 279.260 TL
    puan: 5
  - olcut: (d) Tevkifat ve geçici verginin mahsubu, ödenecek 39.260 TL
    puan: 3
  - olcut: (d) Beyan süresi (1–25 Mart 2027) ve iki eşit taksit (Mart/Temmuz, 19.630 TL)
    puan: 3
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 21, 74, 89
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 92, 103, 117, 121, mük. md. 120
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332)'
    madde: md. 3/2-b, 3/3
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'gmsi = 240000 * 0.85

      gelir = 1100000 + gmsi

      hayat = min(40000 * 0.5, gelir * 0.15)

      egitim = min(150000, gelir * 0.10)

      kizilay = 20000

      ind = hayat + egitim + kizilay

      m = gelir - ind

      vergi = 232500 + (m - 1000000) * 0.35

      ode = vergi - 180000 - 60000

      sonuc = {"beyan_edilen_gelir": gelir, "indirimler": ind, "matrah": m, "hesaplanan_gv": round(vergi, 2), "odenecek":
      round(ode, 2), "taksit": round(ode / 2, 2)}'
  durum: taslak
  surum: 1
  uretim:
