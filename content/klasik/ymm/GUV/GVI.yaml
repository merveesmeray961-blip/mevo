  soru: 'Tam mükellef (U) A.Ş.''nin Mart 2026''da yaptığı ödemeler aşağıdadır. KDV dikkate alınmayacaktır.


    1. Şirketin davalarını takip eden serbest avukat Elif Hanım ile Mart ayı için **net 80.000 TL** ücret kararlaştırılmış,
    kesilecek vergiyi şirket üstlenmiştir.

    2. Genel müdürlük binası olarak kullanılan işyerinin sahibi Kemal Bey''e (gerçek kişi) Mart ayı **brüt 150.000 TL** kira
    ödenmiştir.

    3. Depo olarak kiralanan binanın sahibi tam mükellef (D) A.Ş.''ye Mart ayı **200.000 TL** kira ödenmiştir.

    4. Mart 2026''daki genel kurul kararıyla 2025 yılı kârından (570 Geçmiş Yıllar Kârları hesabından) toplam **3.500.000
    TL** brüt kâr payı dağıtılmasına karar verilmiş ve aynı ay ödenmiştir: tam mükellef gerçek kişi ortak Umut Bey''e 1.000.000
    TL; tam mükellef (H) Holding A.Ş.''ye 2.000.000 TL; Türkiye''de iş yeri ve daimi temsilcisi bulunmayan (X) GmbH''ye (Almanya)
    500.000 TL. (X) GmbH mukimlik belgesi ibraz etmemiştir; çifte vergilendirmeyi önleme anlaşması dikkate alınmayacaktır.

    5. Şirketin yeni fabrika binasının inşaatını üstlenen ve işi birden fazla takvim yılına yaygın olan (İ) İnşaat Ltd. Şti.''ye
    **2.000.000 TL** hakediş ödenmiştir (inşaat demiryolu veya gemi inşaatı değildir).

    6. Şirketin yayımladığı bir kitabın yazarı olan Prof. Ahmet Bey''e (GVK md. 18 kapsamında) **brüt 50.000 TL** telif ücreti
    ödenmiştir.


    Uygulanacak oranlar (2009/14592 ve 2009/14593 sayılı BKK''lar; 9286 ve 9707 sayılı CBK''lar): serbest meslek ödemeleri
    %20; md. 18 kapsamındaki ödemeler %17; gayrimenkul kirası %20; tam mükellef gerçek kişilere ve dar mükellef kurumlara
    dağıtılan kâr payı %15; yıllara yaygın inşaat hakedişi %5.


    **İstenenler:**


    (a) Her ödeme için vergi kesintisi yapılıp yapılmayacağını, dayanağını ve kesinti tutarını belirtiniz; toplam kesinti
    tutarını bulunuz. (12 puan)


    (b) 1, 4 ve 5 numaralı ödemelerin yevmiye kayıtlarını Tekdüzen Hesap Planına göre yapınız (4 numarada kâr dağıtım kararı
    ve ödeme kayıtları). (8 puan)


    (c) Kesintilerin beyan ve ödeme süresini; Elif Hanım ve Umut Bey açısından kesilen vergilerin akıbetini açıklayınız. (5
    puan)

    '
  cozum: '**(a) Kesintiler**


    | No | Değerlendirme | Kesinti (TL) |

    |---|---|---|

    | 1 | Serbest meslek ödemesi (GVK md. 94/2-b). Vergiyi ödeyen üstlendiğinden matrah net ödeme ile verginin toplamıdır
    (md. 96): brüt = 80.000 / 0,80 = 100.000 TL; %20 | 20.000 |

    | 2 | Gerçek kişiye gayrimenkul kirası (md. 94/5); %20 | 30.000 |

    | 3 | Tam mükellef kuruma ödenen kira için GVK md. 94 ve KVK md. 15''te kesinti öngörülmemiştir | 0 |

    | 4a | Tam mükellef gerçek kişiye kâr payı (md. 94/6-b-i; 9286 sayılı CBK ile %15) | 150.000 |

    | 4b | Tam mükellef kuruma dağıtılan kâr payı kesintiye tabi değildir (md. 94/6-b-i ve KVK md. 15/2 kapsamı dışında);
    (H) nezdinde md. 5/1-a istisnasıdır | 0 |

    | 4c | Dar mükellef kuruma kâr payı (KVK md. 30/3; 9286 sayılı CBK ile %15) | 75.000 |

    | 5 | Yıllara yaygın inşaat hakedişi (KVK md. 15/1-a; 9707 sayılı CBK ile %5) | 100.000 |

    | 6 | Md. 18 istisnası md. 94 kesintisini kaldırmaz (md. 18/4); md. 94/2-a uyarınca %17 | 8.500 |

    | | **Toplam** | **383.500** |


    **(b) Kayıtlar**


    *1. Avukat ödemesi:*


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 100.000 | |

    | 360 Ödenecek Vergi ve Fonlar | | 20.000 |

    | 102 Bankalar | | 80.000 |


    *4. Kâr dağıtım kararı ve ödeme:*


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 570 Geçmiş Yıllar Kârları | 3.500.000 | |

    | 331 Ortaklara Borçlar | | 3.500.000 |

    | 331 Ortaklara Borçlar | 3.500.000 | |

    | 360 Ödenecek Vergi ve Fonlar | | 225.000 |

    | 102 Bankalar | | 3.275.000 |


    *5. İnşaat hakedişi:*


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 258 Yapılmakta Olan Yatırımlar | 2.000.000 | |

    | 360 Ödenecek Vergi ve Fonlar | | 100.000 |

    | 102 Bankalar | | 1.900.000 |


    **(c) Beyan, ödeme ve mahsup**


    - Mart 2026''da yapılan kesintiler, Nisan 2026''da muhtasar ve prim hizmet beyannamesiyle beyan edilir ve ödenir: beyan
    ve ödeme ayın 26''sı akşamına kadardır (GVK md. 98, 98/A, 119); son gün resmî tatile rastlarsa izleyen ilk iş günü sonuna
    uzar.

    - Elif Hanım: Brüt 100.000 TL''yi serbest meslek hasılatına dahil eder; kesilen 20.000 TL önce geçici vergisinden, sonra
    yıllık beyannamede hesaplanan gelir vergisinden mahsup edilir (mükerrer md. 120, md. 121).

    - Umut Bey: Kâr payının yarısı istisnadır (md. 22/3); vergiye tabi 500.000 TL, başka geliri bulunmasa da ikinci dilim
    tutarını (400.000 TL) aştığından beyan edilir (md. 86/1-c). İstisna kısım dahil brütten kesilen 150.000 TL''nin **tamamı**
    yıllık beyannamede mahsup edilir (md. 22/3); mahsup sonrası fazla kalırsa iade edilir.

    '
