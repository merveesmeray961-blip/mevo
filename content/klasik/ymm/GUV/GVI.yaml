- id: YMM-GUV-GVI-K003
  sinav: ymm
  ders: GUV
  konu: GVI
  kazanimlar:
  - geçici vergi ve mahsup
  - gelirin toplanması ve indirimler
  - vergi tarifesi
  - beyan ve ödeme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bilanço esasına tabi tacir Fatma Hanım''ın 2026 yılı bilgileri aşağıdadır. Fatma Hanım''ın işletmesine kayıtlı bir
    dükkânı bir anonim şirkete kiralıdır; kiracı her çeyrekte brüt 250.000 TL kira ödemekte ve %20 tevkifat yapmaktadır. Kira
    gelirleri aşağıdaki kazançlara dahildir.


    | Geçici vergi dönemi | Kümülatif ticari kazanç (TL) | Dönemde kesilen kira stopajı (TL) |

    |---|---|---|

    | Ocak–Mart | 500.000 | 50.000 |

    | Ocak–Haziran | 1.200.000 | 50.000 |

    | Ocak–Eylül | 2.000.000 | 50.000 |

    | Ocak–Aralık | 2.400.000 | 50.000 |


    Yıllık beyan için ek bilgiler: 2026 yılı ticari kazancı 2.400.000 TL''dir. Fatma Hanım''ın başka geliri ve geçmiş yıl
    zararı yoktur. Merkezi Türkiye''de bulunan sigorta şirketine kendi adına 60.000 TL hayat sigortası primi ödemiştir (asgari
    ücretin yıllık tutarı sınırı aşılmamaktadır). Kendisi ve küçük çocuğu için Türkiye''de yapılan, belgeli eğitim ve sağlık
    harcamaları 150.000 TL''dir. Belediyeye makbuz karşılığı 200.000 TL nakdi bağış yapmıştır (kalkınmada öncelikli yöre değildir).
    Geçici vergi beyannamelerinde GVK md. 89 indirimleri dikkate alınmamıştır.


    2026 tarifesi (ücret dışı): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000
    TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35; 5.300.000
    TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40.


    **İstenenler:**


    (a) Kira gelirinin niteliğini belirtiniz; dört dönem için ödenecek geçici vergiyi kümülatif yöntemle hesaplayınız ve beyan
    ile ödeme sürelerini belirtiniz. (9 puan)


    (b) Yıllık beyannamede indirilecek tutarları sınırlarıyla belirleyerek gelir vergisi matrahını bulunuz. (8 puan)


    (c) Hesaplanan gelir vergisini, mahsupları ve ödenecek vergiyi; ödeme taksitlerini ve sürelerini bulunuz. (8 puan)

    '
  cozum: '**(a) Nitelik ve geçici vergi**


    Gayrimenkul ticari işletmeye dahil olduğundan kira geliri GMSİ değil **ticari kazançtır** (GVK md. 70 son fıkra). Kiracının
    yaptığı tevkifat (md. 94/5) geçici vergiden mahsup edilir (mükerrer md. 120).


    Geçici vergi oranı tarifenin ilk dilim oranıdır (%15); hesap kümülatif yapılır, kümülatif kesintiler ve önceki dönemlerde
    tahakkuk eden geçici vergiler düşülür:


    | Dönem | Hesaplanan (kümülatif × %15) | Kümülatif stopaj | Önceki dönemler | Ödenecek |

    |---|---|---|---|---|

    | 1 | 75.000 | 50.000 | 0 | 25.000 |

    | 2 | 180.000 | 100.000 | 25.000 | 55.000 |

    | 3 | 300.000 | 150.000 | 80.000 | 70.000 |

    | 4 | 360.000 | 200.000 | 150.000 | 10.000 |

    | **Toplam** | | | | **160.000** |


    Beyan: dönemi izleyen ikinci ayın 14''ü akşamına kadar (Mayıs, Ağustos, Kasım 2026, Şubat 2027); ödeme: aynı ayın 17''si
    akşamına kadar (son gün tatile rastlarsa izleyen iş günü).


    **(b) Yıllık matrah (md. 89)**


    Beyan edilen gelir: 2.400.000 TL.


    | İndirim | Hesap | İndirilecek (TL) |

    |---|---|---|

    | Hayat sigortası primi | Primin %50''si = 30.000; sınır gelirin %15''i (360.000) ve asgari ücretin yıllık tutarı | 30.000
    |

    | Eğitim ve sağlık | 150.000; sınır gelirin %10''u (240.000) | 150.000 |

    | Belediyeye bağış | 200.000; sınır gelirin %5''i (120.000) | 120.000 |

    | **Toplam** | | **300.000** |


    Gelir vergisi matrahı = 2.400.000 − 300.000 = **2.100.000 TL**.


    **(c) Vergi ve mahsup**


    | Kalem | TL |

    |---|---|

    | Hesaplanan vergi: 232.500 + (2.100.000 − 1.000.000) × %35 | 617.500 |

    | Tevkif edilen vergiler (md. 121) | (200.000) |

    | Ödenen geçici vergiler (mükerrer md. 120) | (160.000) |

    | **Ödenecek gelir vergisi** | **257.500** |


    Yıllık beyanname 2027 Mart ayının 1–25''i arasında verilir (md. 92). Vergi iki eşit taksitte ödenir: Mart 2027''de 128.750
    TL, Temmuz 2027''de 128.750 TL (md. 117). Geçici vergi yıllık vergiyi aşsaydı fark diğer vergi borçlarına mahsup edilip
    kalanı yıl sonuna kadar yazılı talep hâlinde iade edilirdi.

    '
  puanlama:
  - olcut: Kira gelirinin ticari kazanç sayılması ve stopajın geçici vergiden mahsubu
    puan: 2
