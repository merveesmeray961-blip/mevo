    internet üzerinden satmaktadır. Esnaf Vergi Muafiyeti Belgesi almış, bankada ticari hesap açmış, hasılatın tamamını bu
    hesap aracılığıyla tahsil etmiştir. İşçi çalıştırmamaktadır. 2026 hasılatı **1.700.000 TL**''dir. Ayrıca sahibi olduğu
    daireyi konut olarak kiraya vermiş, 2026''da **200.000 TL** kira tahsil etmiştir (götürü gider usulünü seçmiştir). Başka
    geliri yoktur.


    **2. Ozan Bey:** Serbest mimardır. 2026 yılı serbest meslek kazancı **4.000.000 TL**''dir. Bunun **3.000.000 TL**''si
    Türkiye''de yerleşmiş olmayan ve iş yeri, kanuni ve iş merkezi yurt dışında bulunan müşterilere Türkiye''deki ofisinden
    verilen ve münhasıran yurt dışında yararlanılan mimari proje hizmetlerinden elde edilmiştir; faturalar yurt dışındaki
    müşteriler adına düzenlenmiş, bu kazancın tamamı Şubat 2027''de Türkiye''ye transfer edilmiştir. Kalan 1.000.000 TL yurt
    içindeki gerçek kişi müşterilerden elde edilmiştir (tevkifat yapılmamıştır). Ozan Bey ayrıca daireyi konut olarak kiraya
    vermiş, **300.000 TL** kira tahsil etmiştir (götürü gider usulü). 2026 dönemleri için ödediği geçici vergi **100.000 TL**''dir.


