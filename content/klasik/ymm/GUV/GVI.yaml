- id: YMM-GUV-GVI-K004
  sinav: ymm
  ders: GUV
  konu: GVI
  kazanimlar:
  - muafiyet ve istisnalar
  - gelirin toplanması ve indirimler
  - vergi tarifesi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Aşağıdaki üç tam mükellef gerçek kişinin 2026 yılı durumları verilmiştir.


    **1. Zeynep Hanım:** Ayrı bir iş yeri açmadan ve seri üretim yapabilen makine kullanmadan evinde ürettiği el yapımı sabunları
    internet üzerinden satmaktadır. Esnaf Vergi Muafiyeti Belgesi almış, bankada ticari hesap açmış, hasılatın tamamını bu
    hesap aracılığıyla tahsil etmiştir. İşçi çalıştırmamaktadır. 2026 hasılatı **1.700.000 TL**''dir. Ayrıca sahibi olduğu
    daireyi konut olarak kiraya vermiş, 2026''da **200.000 TL** kira tahsil etmiştir (götürü gider usulünü seçmiştir). Başka
    geliri yoktur.


    **2. Ozan Bey:** Serbest mimardır. 2026 yılı serbest meslek kazancı **4.000.000 TL**''dir. Bunun **3.000.000 TL**''si
    Türkiye''de yerleşmiş olmayan ve iş yeri, kanuni ve iş merkezi yurt dışında bulunan müşterilere Türkiye''deki ofisinden
    verilen ve münhasıran yurt dışında yararlanılan mimari proje hizmetlerinden elde edilmiştir; faturalar yurt dışındaki
    müşteriler adına düzenlenmiş, bu kazancın tamamı Şubat 2027''de Türkiye''ye transfer edilmiştir. Kalan 1.000.000 TL yurt
    içindeki gerçek kişi müşterilerden elde edilmiştir (tevkifat yapılmamıştır). Ozan Bey ayrıca daireyi konut olarak kiraya
    vermiş, **300.000 TL** kira tahsil etmiştir (götürü gider usulü). 2026 dönemleri için ödediği geçici vergi **100.000 TL**''dir.


    **3. Prof. Ali Bey:** Tek işverenden aldığı ve tevkif suretiyle vergilendirilen **2.000.000 TL** ücreti vardır. Yazdığı
    kitabın yayınevinden **900.000 TL** telif hasılatı elde etmiş, yayınevi %17 tevkifat yapmıştır. Kanuni ve iş merkezi İngiltere''de
    bulunan (Q) Ltd.''nin (limited şirket niteliğinde) ödenmiş sermayesinin %25''ine sahiptir; 2026''da tahsil ettiği **600.000
    TL** karşılığı kâr payının tamamını Mart 2027 başında Türkiye''ye transfer etmiştir (İngiltere''de vergi kesilmemiştir).


    Ek bilgiler (2026): internetten satışta esnaf muaflığı hasılat sınırı 1.900.000 TL; mesken kira istisnası 58.000 TL; md.
    21''deki gayrisafi toplam sınırı 1.500.000 TL; tarifenin dördüncü gelir dilimi tutarı 5.300.000 TL. 11257 sayılı CBK ile
    md. 22/4''teki sahiplik oranı %20, md. 89/13''teki indirim oranı %100 olarak belirlenmiştir. Tarife (ücret dışı): 190.000
    TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500
    TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35.


    **İstenenler:**


    (a) Muafiyet ile istisna arasındaki farkı belirterek Zeynep Hanım''ın satış hasılatının ve kira gelirinin vergilendirilmesini
    açıklayınız; beyan edilecek geliri ve vergiyi hesaplayınız. (8 puan)


    (b) Ozan Bey''in mesken istisnasından ve md. 89/13 indiriminden yararlanıp yararlanamayacağını açıklayınız; matrahını,
    vergisini ve ödenecek vergiyi hesaplayınız. (9 puan)


    (c) Prof. Ali Bey''in gelirlerinin beyan durumunu açıklayınız; beyan edilecek geliri ve vergiyi hesaplayınız. (8 puan)

    '
  cozum: '**(a) Muafiyet – istisna; Zeynep Hanım**


    **Muafiyet** kişiye bağlıdır: şartları taşıyan kişi o faaliyeti için mükellefiyet dışında kalır (GVK md. 9). **İstisna**
    gelire bağlıdır: mükellefiyet devam eder, yalnız belirli gelir vergiden kurtulur (ör. md. 21).


    - Satış hasılatı: Md. 9/10 şartları (evde üretim, ayrı iş yeri ve seri üretim makinesi yok, muafiyet belgesi, ticari hesap,
    tahsilatın tamamı bu hesaptan) sağlanmış; hasılat 1.900.000 TL''yi aşmamıştır. Zeynep Hanım bu faaliyeti için **esnaf
    muaflığından** yararlanır. Banka, hesaba aktarılan tutarlar üzerinden (işçi çalıştırılmadığından) %4 = 68.000 TL tevkifat
    yapar; bu hasılat üzerinden ayrıca md. 94 tevkifatı yapılmaz ve hasılat beyan edilmez.

    - Kira: Ticari, zirai veya mesleki kazancını yıllık beyanname ile bildirmek zorunda değildir; gayrisafi gelir toplamı
    (200.000 TL) 1.500.000 TL''nin altındadır; mesken istisnası uygulanır (md. 21). Vergiye tabi hasılat 200.000 − 58.000
    = 142.000 TL; götürü gider %15 = 21.300 TL (istisna sonrası hasılata uygulanır, md. 74); safi irat **120.700 TL**.

    - Vergi: 120.700 × %15 = **18.105 TL**.


    **(b) Ozan Bey**


    - Mesken istisnası: Md. 21/2''ye göre mesleki kazancını yıllık beyanname ile bildirmek zorunda olanlar istisnadan **yararlanamaz**.
    Kira hasılatının tamamı vergiye tabidir: 300.000 − %15 = 255.000 TL.

    - Md. 89/13: Türkiye''de yerleşmiş olmayan kişilere Türkiye''de verilip münhasıran yurt dışında yararlanılan mimarlık
    hizmetinden elde edilen kazanç; fatura yurt dışı müşteri adına; kazancın tamamı beyanname verilmesi gereken tarihe (25/3/2027)
    kadar transfer edilmiştir. Kanundaki %80 oranı 11257 sayılı CBK ile 2026 için **%100**''dür: indirim 3.000.000 TL.


    | Kalem | TL |

    |---|---|

    | Serbest meslek kazancı | 4.000.000 |

    | GMSİ (konut) | 255.000 |

    | Beyan edilen gelir | 4.255.000 |

    | Md. 89/13 indirimi | (3.000.000) |

    | **Matrah** | **1.255.000** |

    | Vergi: 232.500 + 255.000 × %35 | 321.750 |

    | Geçici vergi mahsubu | (100.000) |

    | **Ödenecek** | **221.750** |


    **(c) Prof. Ali Bey**


    - Ücret: Tek işverenden, tevkif edilmiş ve 5.300.000 TL''yi aşmadığından **beyan edilmez** (md. 86/1-b); başka gelir için
    beyanname verilse de beyana dahil edilmez.

    - Telif: Müelliflerin eserlerinden elde ettikleri hasılat md. 18 ile istisnadır; bu kazançlar toplamı dördüncü dilim tutarını
    aşmadığından istisna uygulanır ve **beyan edilmez**. İstisna md. 94 tevkifatını kaldırmaz; kesilen 900.000 × %17 = 153.000
    TL nihai vergidir, mahsup veya iade konusu olmaz.

    - (Q) Ltd. kâr payı: Yurt dışı limited şirketten alınan kâr payının yarısı, en az %20 sahiplik (11257 sayılı CBK) ve beyanname
    tarihine kadar Türkiye''ye transfer şartıyla istisnadır (md. 22/4). Vergiye tabi kısım 300.000 TL; tevkifata tabi tutulmadığından
    md. 86/1-c ve 86/1-d sınırlarına bakılmaksızın **beyan edilir**.

    - Vergi: 28.500 + (300.000 − 190.000) × %20 = **50.500 TL**.

    '
