  - olcut: (a) Götürü gider ile GMSİ safi tutarı ve beyan edilen gelir (1.304.000 TL)
    puan: 3
  - olcut: (b) Hayat sigortası priminin %50'si ve %15 sınır kontrolü (20.000 TL)
