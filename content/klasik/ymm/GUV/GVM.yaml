  soru: 'Türkiye''de yerleşik Kaan Bey''in ticari, zirai veya mesleki kazancı ve ücret geliri yoktur. 2026 yılına ilişkin
    bilgiler:


    1. **Konut (A):** Mart 2024''te 4.000.000 TL''ye satın aldığı daireyi konut olarak kiraya vermiştir. 2026 yılında tahsil
    ettiği kira: Ocak–Kasım 2026 kiraları 440.000 TL ile Ocak 2026''da tahsil edilen Aralık 2025 kirası 38.000 TL. Aralık
    2026 kirası (40.000 TL) Ocak 2027''de tahsil edilmiştir. Bu daire için 2026''da ödediği giderler: emlak vergisi 4.000
    TL, konut sigortası 3.000 TL, onarım 25.000 TL, daireyi almak için kullandığı konut kredisinin faizi 120.000 TL. VUK''a
    göre ayrılabilecek amortisman 80.000 TL''dir. Kaan Bey konut olarak kiraya verdiği başka gayrimenkul bulunmadığını beyan
    etmektedir.

    2. **Dükkân (B):** Sahibi olduğu dükkânı, arkadaşının işletmesinde kullanması için 2026 yılı boyunca bedelsiz bırakmıştır.
    Dükkânın takdir veya tespit edilmiş kirası yoktur; VUK''a göre vergi değeri 1.600.000 TL''dir. Dükkân için ödediği emlak
    vergisi 6.000 TL''dir.

    3. **(X) A.Ş.** (tam mükellef) hisselerinden 2026''da dağıtılan brüt kâr payı **1.200.000 TL**; şirket %15 tevkifat yapmıştır.

    4. **(Y) GmbH** (kanuni ve iş merkezi Almanya''da, limited şirket niteliğinde) ödenmiş sermayesinin %25''ine sahiptir.
    Ekim 2026''da Almanya''daki banka hesabına ödenen kâr payının Türk lirası karşılığı **800.000 TL**''dir; tutarın tamamı
    10/2/2027''de Türkiye''ye transfer edilmiştir. Almanya''da kâr payından vergi kesilmemiştir.


    Ek bilgiler: Kaan Bey gayrimenkulleri için gerçek gider usulünü seçmiştir. 2026 mesken kira istisnası 58.000 TL; md. 21''deki
    gayrisafi toplam sınırı (tarifenin üçüncü diliminde ücret gelirleri için yer alan tutar) 1.500.000 TL''dir. 2026 tarifesi
