    (Aynı işyeri büyükşehir sınırları içinde olsaydı 99.000 TL''lik sınır geçerli olacaktı.)


    **(d) Ferit Doğan**


    Ferit Doğan şartları sağlamaktadır: kira 90.000 ≤ 99.000, alım 1.050.000 ≤ 1.200.000, satış 1.800.000 ≤ 1.900.000.


    Basit usulde ticari kazanç; hasılat ile giderler ve satılan malların alış bedelleri arasındaki müspet farktır ve bu fark,
    alış, gider ve hasılata ilişkin belgelerde yazılı tutarlara göre hesaplanır (md. 46/2).


