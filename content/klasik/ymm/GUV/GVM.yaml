    Aralık 2026** olup 2024, 2025 ve 2026''ya ait tüm hasılat ve giderler **2026 yılının** geliri olarak beyan edilir. (B)
    işi 2027''de biteceğinden kazancı 2027 yılında kati olarak tespit edilir; 2026''da hakediş, harcama ve tevkifat (B) işinin
    ayrı defterinde izlenir, 2026 beyannamesine kazanç olarak girmez.


    **(b) Müşterek genel giderlerin dağıtımı (md. 43/1)**


    Yıl içinde birden fazla inşaat işinin birlikte yapılması hâlinde her yıla ait müşterek genel giderler, bu işlere ait harcamaların
