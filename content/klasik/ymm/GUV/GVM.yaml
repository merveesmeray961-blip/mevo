  dogrulama:
    python: 'gercek = 6000 + 4000 + 30000 + 40000

      goturu = 600000 * 0.15

      gmsi = 600000 - max(gercek, goturu)

      da = 1100000 - 400000 * 2 - 20000

      da_vergiye_tabi = max(da - 150000, 0)

      tahliye = 420000 - 20000

      arizi = max(tahliye - 350000, 0) + 100000

      sonuc = {"gmsi_safi": gmsi, "deger_artisi": da_vergiye_tabi, "arizi": arizi, "toplam": gmsi + da_vergiye_tabi + arizi}'
