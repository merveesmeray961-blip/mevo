    | Konutlardan 2026''da tahsil edilen kira (hasılat) | 400.000 |

    | Emlak vergisi (kiraya veren tarafından ödenen) | 14.000 |

    | Konut sigortası primi | 6.000 |

    | Onarım gideri | 40.000 |

    | Vergi Usul Kanunu''na göre ayrılan amortisman | 60.000 |

    | Ücret geliri (brüt, 2026) | 900.000 |


    Ek bilgiler: Gerçek gider usulü uygulanacak, kiralanan konutlar için iktisap faizi yoktur. Mesken kira istisnası tutarı
    2026 yılı için 58.000 TL, tarifenin üçüncü diliminde ücret gelirleri için yer alan tutar 1.500.000 TL''dir.


    **İstenenler:**


    (a) Hande Hanım''ın 2026 yılı mesken kira istisnasından yararlanıp yararlanamayacağını gerekçesiyle belirtiniz. (4 puan)


    (b) İstisna uygulandığında gerçek gider usulüne göre beyan edilecek gayrimenkul sermaye iradı safi tutarını hesaplayınız.
    (6 puan)


    (c) Ücret geliri 1.200.000 TL olsaydı istisna yönünden sonucun ne olacağını açıklayınız. (4 puan)


    (d) (c) şıkkındaki varsayımda gerçek gider ve götürü gider usulüne göre safi iratları hesaplayınız; hangi usulün seçilmesinin
    mükellef lehine olduğunu ve götürü gider usulünü seçenlerin bağlılık süresini belirtiniz. (6 puan)

    '
  cozum: '**(a) İstisna şartı**


    GVK md. 21 uyarınca mesken kira hasılatının 58.000 TL''si gelir vergisinden müstesnadır. Ancak ücret, menkul ve gayrimenkul
    sermaye iradı ile diğer kazanç ve iratların gayri safi tutarları toplamı tarifenin üçüncü diliminde ücret gelirleri için
    yer alan tutarı (1.500.000 TL) aşarsa istisnadan yararlanılamaz.


    | Kalem | Tutar |

    |---|---|

    | Ücret (brüt) | 900.000 |

    | Kira (brüt) | 400.000 |

    | Toplam | 1.300.000 |


    1.300.000 TL, 1.500.000 TL''yi aşmadığından istisnadan yararlanılır. Kira hasılatının 400.000 TL''si beyan edilmelidir;
    eksik beyan hâlinde istisna kaybedilir.


    **(b) Safi irat (gerçek gider)**


    Md. 74''e göre istisna edilen hasılata isabet eden giderler indirilemez; giderler hasılatın istisnasız kalan kısmı oranında
    indirilir.


    - Toplam gider = 14.000 + 6.000 + 40.000 + 60.000 = 120.000 TL

    - İstisna sonrası hasılat = 400.000 − 58.000 = 342.000 TL

    - İndirilecek gider = 120.000 × 342.000 / 400.000 = 102.600 TL

    - Safi irat = 342.000 − 102.600 = **239.400 TL**


    **(c) Ücret 1.200.000 TL ise**


    Brüt toplam 1.200.000 + 400.000 = 1.600.000 TL olur ve 1.500.000 TL''yi aştığından istisnadan hiç yararlanılamaz. Kira
    hasılatının tamamı (400.000 TL) vergiye tabidir.


    **(d) Usul karşılaştırması**


    | Usul | Hesap | Safi irat |

    |---|---|---|

    | Gerçek gider | 400.000 − 120.000 | 280.000 |

    | Götürü gider | 400.000 × %85 | 340.000 |


    Gerçek gider usulü daha düşük safi irat verdiğinden mükellef lehinedir (280.000 TL). Götürü gider usulünü kabul edenler
    iki yıl geçmedikçe bu usulden dönemezler.


