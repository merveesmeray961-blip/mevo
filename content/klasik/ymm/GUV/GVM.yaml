    olup sayıları **2**''dir; ikiden fazla olmadığından gerçek usul şartı doğmaz (12 yaşındaki traktör sayılmaz). Büyükbaş
    hayvan sayısı da (60) ölçünün (150) altındadır. | **Tevkifat yoluyla** |

    | Bereket Tarım Kollektif Şirketi | Kollektif şirketler zirai faaliyetle iştigal etseler dahi çiftçi sayılmazlar (md.
    52). Dolayısıyla çiftçilere ilişkin tevkifat/gerçek usul ayrımı şirket bakımından uygulanmaz. | **Çiftçi sayılmaz** |


    **(b) Tevkifat tutarları**


    - *Berna Işık:* Ortaklığın satışı tescil edilmeden yapıldığından diğer zirai mahsuller için %4 uygulanır. Berna Hanım''ın
    payına düşen hasılat 1.600.000 × %50 = 800.000 TL; tevkifat 800.000 × %4 = **32.000 TL** (ortaklığın tamamında 64.000
    TL).

    - *Hakan Sezer:* Hububat (tescilli) 400.000 × %2 = 8.000 TL; süt (hayvan mahsulü, tescilsiz) 500.000 × %2 = 10.000 TL;
    toplam **18.000 TL**.


    Kazançları gerçek usulde vergilendirilmeyen çiftçiler bu kazançları için beyanname vermezler (md. 53/1); dolayısıyla Berna
    Işık ve Hakan Sezer zirai kazançları için beyanname vermezler, tevkifat nihai vergidir.


    **(c) Kollektif şirket ortakları**


    Zirai faaliyetle iştigal eden kollektif şirketlerin ortaklarının şirket kârından aldıkları paylar **şahsi ticari kazanç**
    hükmündedir (md. 52). Metin Kaya ve Nuri Bayrak''ın payları ticari kazanç olarak vergilendirilir.


    **(d) Gerçek usule geçiş**


    Kazançları gerçek usulde vergilendirilmeyen çiftçiler, yazılı olarak vergi dairesinden istemde bulunmaları hâlinde izleyen
    vergilendirme dönemi başından itibaren gerçek usule geçebilirler (md. 53). Hakan Sezer''in 10 Kasım 2026 tarihli başvurusu
    **1 Ocak 2027** tarihinden itibaren geçerli olur.

