- id: YMM-GUV-GVM-K020
  sinav: ymm
  ders: GUV
  konu: GVM
  kazanimlar:
  - tam mükellefiyet ve yurt dışı gelirlerin elde edilmiş sayılması
  - yabancı memlekette ödenen vergilerin indirimi (çifte vergilendirmenin önlenmesi)
