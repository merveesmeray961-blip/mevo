  cozum: '**(a) Konut (A)**


    *Gayrisafi hasılat:* GMSİ''de tahsil esası geçerlidir. 2026''da tahsil edilen 440.000 + 38.000 = **478.000 TL** 2026 hasılatıdır;
    Aralık 2026 kirası 2027''de tahsil edildiğinden 2027 hasılatıdır.


    *Mesken istisnası:* GVK md. 21/2''ye göre ücret, menkul sermaye iradı, gayrimenkul sermaye iradı ve diğer kazanç ve iratlarının
    **gayrisafi** tutarları toplamı 1.500.000 TL''yi aşanlar istisnadan yararlanamaz.


    - Kâr paylarının brüt tutarları ile: 478.000 + 80.000 + 1.200.000 + 800.000 = 2.558.000 TL.

    - Kâr paylarının istisna sonrası yarıları alınsa bile: 478.000 + 80.000 + 600.000 + 400.000 = 1.558.000 TL.


    Her iki yaklaşımda da toplam 1.500.000 TL''yi aştığından **istisna uygulanmaz**; hasılatın tamamı vergiye tabidir.


    *Giderler (md. 74):*


    | Gider | İndirilecek (TL) | Gerekçe |

    |---|---|---|

    | Emlak vergisi | 4.000 | md. 74/5 |

    | Sigorta | 3.000 | md. 74/3 |

    | Onarım | 25.000 | md. 74/7 |

    | Konut kredisi faizi | 0 | 7566 sayılı Kanunla md. 74/4: "Konutlar hariç olmak üzere" borç faizleri indirilir; konut
    faizi indirilemez |

    | Amortisman | 80.000 | md. 74/6 |

    | İktisap bedelinin %5''i | 200.000 | Konut olarak kiraya verilen bir adet gayrimenkulde iktisap yılından (2024) itibaren
    beş yıl; 4.000.000 × %5; yalnız bu konutun hasılatına uygulanır (md. 74/4) |

    | **Toplam** | **312.000** | |


    Safi irat = 478.000 − 312.000 = **166.000 TL**.


    **(b) Dükkân (B)**


    Bedelsiz olarak başkasının intifaına bırakılan malın emsal kira bedeli kira sayılır (md. 73). Takdir edilmiş kira olmadığından
    emsal kira, vergi değerinin %5''idir: 1.600.000 × %5 = 80.000 TL. Md. 73''teki istisnalar (boş gayrimenkulün muhafazası,
    usul-füru-kardeşe konut tahsisi vb.) arkadaşın işletmesine bırakılan dükkâna uygulanmaz. Gerçek gider: emlak vergisi 6.000
    TL. Safi irat = **74.000 TL**.


    **(c) Kâr payları ve beyan**


    - (X) A.Ş.: Tam mükellef kurumdan alınan kâr payının yarısı istisnadır (md. 22/3); vergiye tabi 600.000 TL. Tevkifat istisna
