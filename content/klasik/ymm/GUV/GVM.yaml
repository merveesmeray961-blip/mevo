  soru: 'Burcu Dalkıran Türk vatandaşı olup ikametgâhı İzmir''dedir ve 2026 yılının tamamında Türkiye''de oturmuştur. Başka
    geliri ve indirimi yoktur. 2026 yılına ilişkin bilgileri aşağıdadır:


    1. Türkiye''de bilanço esasına göre tespit edilen ticari kazancı 800.000 TL''dir.

    2. Almanya''da sahibi olduğu dairenin kira geliri nedeniyle 2026 yılında doğan safi gayrimenkul sermaye iradı (TL karşılığı)
    300.000 TL''dir. Bu tutarın 200.000 TL''si Aralık 2026''da Türkiye''deki banka hesabına aktarılmış; kalan 100.000 TL ise
    yalnızca Burcu Hanım''ın tercihi nedeniyle Almanya''daki banka hesabında bırakılmış ve Şubat 2027''de Türkiye''ye aktarılmıştır.

    3. Almanya''da bu kira gelirleri üzerinden ödenen Alman gelir vergisi (Einkommensteuer) toplam 90.000 TL''dir; bunun 60.000
    TL''si Türkiye''ye aktarılan 200.000 TL''lik gelire, 30.000 TL''si kalan 100.000 TL''lik gelire isabet etmektedir. Ödemeler,
    Alman vergi dairesinden alınan ve Türk konsolosluğunca tasdik ettirilen belgelerle tevsik edilmiştir. Ayrıca Almanya''da
    daire için 12.000 TL emlak vergisi (Grundsteuer) ödenmiş olup bu tutar safi iradın hesabında gider olarak dikkate alınmıştır;
    Burcu Hanım bu emlak vergisini de yabancı vergi indirimi olarak talep etmektedir.


    2026 yılı gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için
    28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si
    için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40.


    **İstenenler:**


    (a) Burcu Dalkıran''ın gelir vergisi bakımından mükellefiyet türünü belirtiniz; Almanya''daki kira gelirinin hangi tutarının
    2026 yılı gelirine dahil edileceğini gerekçesiyle açıklayınız. (6 puan)


    (b) 2026 yılı beyannamesindeki toplam gelir ile Türkiye''de hesaplanan gelir vergisini bulunuz. (4 puan)


    (c) Yabancı memlekette ödenen vergilerin Türkiye''de tarh edilen vergiden indirilebilecek tutarını gerekçeleriyle hesaplayarak
    ödenecek gelir vergisini bulunuz; emlak vergisi talebini değerlendiriniz. (10 puan)


    (d) Şubat 2027''de aktarılan 100.000 TL''lik gelir ve buna isabet eden 30.000 TL Alman vergisinin vergisel sonuçlarını,
    2026 yılında indirilemeyen yabancı vergi farkının akıbetini belirtiniz. (5 puan)

    '
  cozum: '**(a) Mükellefiyet ve gelirin elde edildiği yıl**


    İkametgâhı Türkiye''de bulunan kişi Türkiye''de yerleşmiş sayılır (GVK md. 4/1) ve Türkiye içinde ve dışında elde ettiği
    kazanç ve iratların tamamı üzerinden vergilendirilir; yani **tam mükelleftir** (md. 3/1).


    Yabancı memleketlerde elde edilen kazanç ve iratlar, mükellefin bunları Türkiye''de hesaplarına intikal ettirdiği yılda
    elde edilmiş sayılır. Aktarılmamanın mükellefin iradesi dışındaki sebeplerden kaynaklandığı da söylenemediğinden (md.
    85, 2. numaralı hâl uygulanmaz) yalnızca 2026''da aktarılan **200.000 TL** 2026 gelirine dahil edilir; kalan 100.000 TL,
    2027 yılında aktarıldığı için 2027 yılının geliridir.


    **(b) Gelir toplamı ve vergi**


    | Kalem | TL |

    |---|---|

    | Türkiye''de ticari kazanç | 800.000 |

    | Almanya''dan 2026''da intikal eden kira iradı | 200.000 |

    | **Gelir toplamı** | **1.000.000** |


    Gelir vergisi: 70.500 + (1.000.000 − 400.000) × %27 = **232.500 TL**.


    **(c) Yabancı vergi indirimi (md. 123)**


    Yabancı memlekette ödenen benzeri vergiler, Türkiye''de tarh edilen verginin yabancı memlekette elde edilen gelire isabet
    eden kısmından indirilir. Bu kısım, yabancı kaynaklı gelirin toplam gelire oranı üzerinden hesaplanır; indirilecek vergi
    bu kısımdan fazlaysa aradaki fark nazara alınmaz. Yabancı vergiler hangi yılın gelirine ithal edilmişse o yıla ait vergiden
    indirilir.


    - Yabancı gelirin oranı: 200.000 / 1.000.000 = %20.

    - Türkiye''de tarh edilen verginin yabancı gelire isabet eden kısmı (indirim sınırı): 232.500 × %20 = **46.500 TL**.

    - 2026 gelirine ithal edilen kazanca isabet eden Alman gelir vergisi: **60.000 TL** (30.000 TL''lik kısım 2027 gelirine
    ait olduğundan dikkate alınmaz).

    - İndirilecek vergi: min(60.000; 46.500) = **46.500 TL**. Aradaki 60.000 − 46.500 = **13.500 TL** nazara alınmaz.

    - Emlak vergisi (Grundsteuer) "gelir üzerinden alınan şahsi bir vergi" olmadığından indirim konusu yapılamaz (md. 123/4-1);
    zaten safi irat hesabında gider olarak dikkate alınmıştır.


    Ödenecek gelir vergisi: 232.500 − 46.500 = **186.000 TL**.


    (Vergilerin yetkili makamlardan alınan ve Türk konsolosluğunca tasdik edilen belgelerle tevsik edilmesi şartı (md. 123/4-2)
    sağlanmıştır.)


    **(d) 2027 ve indirilemeyen fark**


    Şubat 2027''de aktarılan 100.000 TL, 2027 yılı gelirine ithal edilir; buna isabet eden 30.000 TL Alman vergisi de o gelire
    ait vergiden, yine yabancı gelire isabet eden kısımla sınırlı olmak üzere, 2027 yılında indirilir. 2026''da indirilemeyen
    13.500 TL''lik fark nazara alınmaz; sonraki yıllara devredilmez ve geri istenemez.

    '
