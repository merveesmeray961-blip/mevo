  sure_dk: 30
  soru: 'Türkiye''de yerleşik olan Kerem Yılmaz''ın ticari, zirai veya mesleki faaliyeti ve ücret geliri bulunmamaktadır.
    Kerem Bey''in 2026 yılına ilişkin işlemleri aşağıdadır:


    1. İstanbul''daki dükkânını bir anonim şirkete kiralamıştır. 2026 yılında tahsil ettiği brüt kira 600.000 TL, kiracı şirketin
    bu ödemeler üzerinden yaptığı tevkifat 120.000 TL''dir. Dükkânla ilgili olarak Kerem Bey''in ödediği emlak vergisi 6.000
    TL, yangın sigortası primi 4.000 TL ve onarım gideri 30.000 TL''dir; Vergi Usul Kanunu''na göre ayrılabilecek amortisman
    40.000 TL''dir. Kerem Bey önceki yıllarda gerçek gider usulünü uygulamıştır.

    2. Ankara''daki dairesini kız kardeşinin bedelsiz ikametine tahsis etmiştir; kız kardeşine tahsis edilmiş başka konutu
    yoktur.

    3. 2019 yılında 400.000 TL''ye edindiği (X) Limited Şirketi ortaklık payını Kasım 2026''da 1.100.000 TL''ye satmış, satış
    nedeniyle kendisinde kalan 20.000 TL noter gideri ödemiştir. Payın edinildiği aydan satıldığı aya kadar (satış ayı hariç)
    endeks artış oranı %100''dür.

    4. Kişisel eşyalarını sakladığı ve 2018''den beri kiracısı olduğu bir depoyu mal sahibinin talebi üzerine tahliye etmiş
    ve 420.000 TL tazminat almıştır. Tahliye nedeniyle yaptığı ve belgelendirdiği nakliye gideri 20.000 TL''dir.

    5. Aynı caddede kafe açmak üzere hazırlık yapmış, ancak henüz faaliyete geçmeden, bu kafeyi hiç açmaması karşılığında
    komşu kafe işletmecisinden 100.000 TL almıştır.


    2026 yılı için değer artışı kazançlarına ilişkin istisna tutarı 150.000 TL, arızi kazançlara ilişkin istisna tutarı 350.000
    TL''dir.


    **İstenenler:**


    (a) Yukarıdaki beş işlemin her birinin gelir unsurları bakımından niteliğini belirleyiniz ve vergilendirilip vergilendirilmeyeceğini
    gerekçesiyle açıklayınız. (6 puan)


    (b) Dükkân kira gelirine ilişkin beyan edilecek safi iradı, gider usulü seçimini gerekçelendirerek hesaplayınız; kiracının
    yaptığı tevkifatın nasıl dikkate alınacağını belirtiniz. (6 puan)


    (c) Ortaklık payı satışından doğan vergiye tabi değer artışı kazancını hesaplayınız. (6 puan)


    (d) Vergiye tabi arızi kazanç tutarını hesaplayınız. (7 puan)

    '
  cozum: '**(a) Niteleme**


    | İşlem | Niteliği | Sonuç |

    |---|---|---|

    | 1. Dükkân kirası | Gayrimenkul sermaye iradı (GVK md.70/1) | Yıllık beyannameyle beyan edilir; tevkifat mahsup edilir.
    |

    | 2. Kardeşe bedelsiz konut | Emsal kira esası (md.73) | Konutun kardeşin ikametine tahsisi md.73/2-2 uyarınca emsal kira
    bedeli esası dışındadır; vergilendirme yoktur. |

    | 3. Ltd. ortaklık payı satışı | Değer artışı kazancı (mük. md.80/1-4) | Ortaklık haklarının elden çıkarılmasında elde
    tutma süresi aranmaz; kazanç vergiye tabidir. Pay menkul kıymet olmadığından mük. md.80/3''teki istisnadan yararlanır.
    |

    | 4. Tahliye tazminatı | Arızi kazanç (md.82/1-3) | Arızi kazanç istisnasından (350.000 TL) yararlanır. |

    | 5. Faaliyete hiç girişmeme bedeli | Arızi kazanç (md.82/1-2) | Henüz başlamamış faaliyete hiç girişilmemesi karşılığı
    elde edilen kazanç istisna dışındadır; tamamı vergilendirilir. |


    **(b) Dükkân kirası (GMSİ)**


    - Gerçek gider: 6.000 + 4.000 + 30.000 + 40.000 = 80.000 TL (md.74/5, 3, 7, 6)

    - Götürü gider: 600.000 × %15 = 90.000 TL (md.74; hak kiralaması olmadığından seçilebilir)

    - Götürü gider daha avantajlıdır. Gerçek giderden götürü gidere geçiş kısıtlanmamıştır; götürü gideri seçen iki yıl geçmedikçe
    bu usulden dönemez.

    - Safi irat: 600.000 − 90.000 = **510.000 TL**

    - Kiracının yaptığı 120.000 TL tevkifat, yıllık beyanname üzerinden hesaplanan gelir vergisinden mahsup edilir (md.121).


    **(c) Ortaklık payı satışı**


    - Endeks artışı %10''un üzerinde olduğundan maliyet endekslenir: 400.000 × 2 = 800.000 TL (mük. md.81)

    - Kazanç: 1.100.000 − 800.000 − 20.000 = 280.000 TL

    - İstisna: 150.000 TL → Vergiye tabi değer artışı kazancı: **130.000 TL**


    **(d) Arızi kazançlar**


    - Tahliye tazminatı: 420.000 − 20.000 (tevsik edilen gider) = 400.000 TL; istisna 350.000 TL → vergiye tabi 50.000 TL

    - Faaliyete hiç girişmeme karşılığı: 100.000 TL (istisna uygulanmaz, gider yok)

    - Vergiye tabi arızi kazanç: 50.000 + 100.000 = **150.000 TL**


    (Bilgi için: beyannameye girecek kazanç ve iratlar toplamı 510.000 + 130.000 + 150.000 = 790.000 TL''dir.)

    '
