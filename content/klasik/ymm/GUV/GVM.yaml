    Basit usule tabi olmak için GVK md. 47 ve 48''deki şartların topluca bulunması gerekir (md. 46/1). Adi ortaklıkta çalışanlardan
    aynı zamanda şahsi bir işle de uğraşanlar bakımından md. 47/2 ve md. 48 ölçülerine, şahsi işe ait tutarlara ortaklıktan
