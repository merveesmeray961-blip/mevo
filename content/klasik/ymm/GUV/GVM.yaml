- id: YMM-GUV-GVM-K002
  sinav: ymm
  ders: GUV
  konu: GVM
  kazanimlar:
  - ortaklıkların vergilendirilmesi
  - ticari ve zirai kazanç
  - gayrimenkul ve menkul sermaye iradı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(AB) Kollektif Şirketi bilanço esasına göre defter tutmaktadır. Ortakları ve kâr paylaşım oranları: Ahmet Bey %60,
    Burak Bey %40. Şirketin 2026 yılı ticari bilanço kârı **3.000.000 TL**''dir. Bu kârın tespitinde gider yazılan kalemler
    arasında şunlar vardır (tutarlar brüttür; şirket aşağıdaki ücret ödemelerinden gelir vergisi tevkifatı yapmamıştır):


    | No | Kalem | Tutar (TL) |

    |---|---|---|

    | 1 | Ahmet Bey''e ödenen müdürlük ücreti | 480.000 |

    | 2 | Muhasebe biriminde çalışan, Burak Bey''in eşine ödenen ücret | 300.000 |

    | 3 | Satış elemanı olarak çalışan, Burak Bey''in 24 yaşındaki evli oğluna ödenen ücret | 240.000 |

    | 4 | Yaz döneminde depoda çalışan, Ahmet Bey''in 16 yaşındaki oğluna ödenen ücret | 60.000 |

    | 5 | Ahmet Bey''in şirketteki cari hesap alacağı için yürütülen faiz | 150.000 |

    | 6 | Gecikmeli verilen KDV beyannamesi için ödenen vergi cezası | 20.000 |

    | 7 | Ahmet Bey''in oturduğu konutun şirket kasasından ödenen kirası | 120.000 |

    | 8 | Burak Bey''e ait dükkânın depo olarak kiralanması karşılığı ödenen brüt kira (emsal bedele uygundur; şirket %20
    tevkifat yapmıştır) | 360.000 |


    Ek bilgiler: Ortakların 2026 yılında başka gelirleri yoktur. Burak Bey dükkân kirası için götürü gider usulünü seçmiştir.
    Geçici vergi mahsubu dikkate alınmayacaktır. 2026 gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15;
    400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27;
    5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500
    TL, fazlası %40.


    **İstenenler:**


    (a) Sekiz kalemin her birinin şirket kazancının tespitinde gider olarak kabul edilip edilmeyeceğini GVK md. 41 çerçevesinde
    gerekçesiyle açıklayınız. (10 puan)


    (b) Şirketin 2026 yılı ticari kazancını ve ortakların kazanç paylarını hesaplayınız; payların gelir unsuru olarak niteliğini
    belirtiniz. (5 puan)


    (c) Her iki ortağın 2026 yılı beyan edeceği geliri, hesaplanan ve ödenecek gelir vergisini bulunuz. (10 puan)

    '
  cozum: '**(a) Kalemlerin değerlendirilmesi**


    GVK md. 41''in son fıkrasına göre kollektif şirket ortakları **teşebbüs sahibi** sayılır. Md. 41/1-1 ila 4 kapsamındaki
    ödemeler gider yazılamaz.


    | No | Değerlendirme | Kâra ilave (TL) |

    |---|---|---|

    | 1 | Teşebbüs sahibine ödenen ücret (md. 41/1-2) gider yazılamaz | 480.000 |

    | 2 | Teşebbüs sahibinin eşine ödenen ücret (md. 41/1-2) gider yazılamaz | 300.000 |

    | 3 | Md. 41/1-2 yalnız **küçük** çocukları kapsar; reşit oğula hizmet karşılığı ödenen ücret gider yazılır | 0 |

    | 4 | Küçük çocuğa ödenen ücret (md. 41/1-2) gider yazılamaz | 60.000 |

    | 5 | Teşebbüs sahibinin cari hesap alacağına yürütülen faiz (md. 41/1-4) gider yazılamaz | 150.000 |

    | 6 | Vergi cezası (md. 41/1-6) gider yazılamaz | 20.000 |

    | 7 | Teşebbüs sahibinin işletmeden çektiği değer (md. 41/1-1) gider yazılamaz | 120.000 |

    | 8 | Ortağa ödenen kira md. 41/1-1 ila 4 arasında sayılmamıştır; emsale uygun olduğundan md. 41/1-5 kapsamında fark da
    yoktur; gider yazılır | 0 |

    | | **Toplam ilave** | **1.130.000** |


    **(b) Ticari kazanç ve paylar**


    Ticari kazanç = 3.000.000 + 1.130.000 = **4.130.000 TL**.


    - Ahmet Bey: 4.130.000 × %60 = **2.478.000 TL**

    - Burak Bey: 4.130.000 × %40 = **1.652.000 TL**


    Kollektif şirket ortaklarının şirket kârından aldıkları paylar **şahsi ticari kazanç** hükmündedir (GVK md. 37); kollektif
    şirket kurumlar vergisi mükellefi değildir ve ortaklar ticari faaliyetten kazanç elde etmeseler de yıllık beyanname verir
    (md. 85). Ahmet Bey''e ödenen 480.000 TL ücret ayrıca ücret olarak beyan edilmez; tutar kâra eklenerek paylaşılmıştır.


    **(c) Beyan ve vergi**


    *Ahmet Bey:* Beyan edilen gelir 2.478.000 TL. Vergi = 232.500 + (2.478.000 − 1.000.000) × %35 = 232.500 + 517.300 = **749.800
    TL**. Mahsup edilecek vergi yoktur; ödenecek **749.800 TL**.


    *Burak Bey:*


    | Kalem | Hesap | Tutar (TL) |

    |---|---|---|

    | Ticari kazanç payı | | 1.652.000 |

    | GMSİ (işyeri kirası) | 360.000 − %15 götürü gider (54.000) | 306.000 |

    | Beyan edilen gelir | | 1.958.000 |

    | Hesaplanan vergi | 232.500 + 958.000 × %35 | 567.800 |

    | Kira stopajı mahsubu (md. 121) | 360.000 × %20 | (72.000) |

    | Ödenecek vergi | | **495.800** |


    Dükkân Burak Bey''in kişisel mülküdür, ortaklığa sermaye olarak konulmamıştır; kira geliri GMSİ''dir (md. 70). Tevkif
    edilmiş olsa da ticari kazanç nedeniyle beyanname verildiğinden ve vergiye tabi gelir toplamı ikinci dilim tutarını (400.000
    TL) aştığından brüt tutarıyla beyana dahil edilir (md. 86/1-c); kesilen vergi mahsup edilir. Beyanname 2027 Mart ayının
    1–25''i arasında verilir, vergi Mart ve Temmuz''da iki eşit taksitte ödenir (md. 92, 117).

    '
  puanlama:
  - olcut: 'Kalem 1, 2 ve 4: teşebbüs sahibine, eşine ve küçük çocuğa ücretin md. 41/1-2 ile gider yazılamayacağı'
