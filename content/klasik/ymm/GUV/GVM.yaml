  soru: 'Aşağıdaki kişilerin 2026 yılı durumları verilmiştir.


    **1. Erol Bey** (Türk vatandaşı, ikametgâhı İzmir): Tek işverenden aldığı ve tevkif suretiyle vergilendirilen 2.000.000
    TL ücreti vardır. Almanya''daki ofisini (işyeri) bir Alman şirketine kiralamıştır; 2026''da Almanya''daki banka hesabına
    tahsil edilen kiranın TL karşılığı **900.000 TL**''dir. Bu kira için Almanya''da şahsi gelir vergisi niteliğinde **135.000
    TL** karşılığı vergi ödemiş; ödemeyi gösteren ve Türk konsolosluğunca tasdik edilen belgeyi almıştır. Kira geliri için
    götürü gider usulünü seçmiştir.


    **2. Can Bey** (Erol Bey''in oğlu, Türk vatandaşı): 2019''dan beri ikametgâhı Londra''dadır; 2026''da Türkiye''de toplam
    dört ay kalmıştır. 2026''daki gelirleri:

    - Londra''daki işvereninden aldığı ücret.

    - İstanbul''daki dükkânını bir anonim şirkete kiralamıştır; şirket brüt kira üzerinden %20 tevkifat yapmıştır.

    - Londra''dan uzaktan bir Türk limited şirketine danışmanlık (mütad meslek olarak yaptığı serbest meslek faaliyeti) vermiş,
    bedel şirketçe Türkiye''den ödenmiş ve %20 tevkifat yapılmıştır.

    - Türkiye''deki bir bankada açtığı vadeli mevduat hesabından faiz elde etmiş, banka tevkifat yapmıştır.

    - Mart 2023''te 1.000.000 TL''ye satın aldığı Ankara''daki arsayı 10/7/2026''da 2.800.000 TL''ye bir gerçek kişiye satmış,
    satıcı payı tapu harcı olarak 42.000 TL ödemiştir. İktisap ayından satış ayına kadar (satış ayı hariç) Yİ-ÜFE artış oranı
    %80''dir.


    **3. Mr. Smith** (İngiliz vatandaşı): Tam mükellef (T) A.Ş.''nin fabrika kurulum projesinde uzman olarak belli ve geçici
    bir görevle 2026''da sekiz ay Türkiye''de kalmıştır. Ücreti (T) A.Ş. tarafından ödenmiş ve tevkifat yapılmıştır.


    Ek bilgiler: 2026 değer artışı kazancı istisnası 150.000 TL. 2026 tarifesi (ücret dışı): 190.000 TL''ye kadar %15; 400.000
    TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000
    TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35. Çifte vergilendirmeyi önleme anlaşmaları dikkate alınmayacaktır.


    **İstenenler:**


    (a) Erol Bey, Can Bey ve Mr. Smith''in mükellefiyet türünü gerekçesiyle belirtiniz. (6 puan)


    (b) Can Bey''in her bir gelirinin Türkiye''de vergilendirilip vergilendirilmeyeceğini (Türkiye''de elde edilme şartı)
    ve beyan şeklini açıklayınız. (9 puan)


    (c) Can Bey''in arsa satışına ilişkin beyannamenin türünü, süresini ve yerini belirtiniz; vergiyi hesaplayınız. (5 puan)


    (d) Erol Bey''in Almanya kira geliri için beyan edilecek safi iradı, hesaplanan vergiyi ve yurt dışında ödenen verginin
    mahsubunu hesaplayınız. (5 puan)

    '
  cozum: '**(a) Mükellefiyet**


    - **Erol Bey:** İkametgâhı Türkiye''dedir; Türkiye''de yerleşmiş sayılır (GVK md. 4/1). **Tam mükellef**tir, Türkiye içinde
    ve dışında elde ettiği bütün kazanç ve iratlar üzerinden vergilendirilir (md. 3).

    - **Can Bey:** İkametgâhı Türkiye''de değildir ve bir takvim yılında Türkiye''de devamlı altı aydan fazla oturmamıştır
    (md. 4). Vatandaşlık mükellefiyeti belirlemez; resmi bir daire veya Türkiye merkezli teşebbüs adına yurt dışında bulunmadığından
    md. 3/2 de uygulanmaz. **Dar mükellef**tir; yalnız Türkiye''de elde ettiği kazanç ve iratlar vergilendirilir (md. 6).

    - **Mr. Smith:** Altı aydan fazla kalsa da belli ve geçici görev için gelen uzmanlar Türkiye''de yerleşmiş sayılmaz (md.
    5/1). **Dar mükellef**tir. Ücreti hizmetin Türkiye''de ifası nedeniyle Türkiye''de elde edilmiştir (md. 7/3-a); tamamı
    tevkif suretiyle vergilendirildiğinden beyan edilmez (md. 86/2).


    **(b) Can Bey''in gelirleri**


    | Gelir | Türkiye''de elde edilme | Beyan |

    |---|---|---|

    | Londra''daki ücret | Hizmet Türkiye''de ifa edilmemiş ve değerlendirilmemiştir (md. 7/3) | Türkiye''de vergilendirilmez
    |

    | Dükkân kirası | Gayrimenkul Türkiye''dedir (md. 7/5) | Tamamı tevkif yoluyla vergilendirilmiştir; beyan edilmez (md.
    86/2) |

    | Danışmanlık | Faaliyet yurt dışında icra edilse de ödeme Türkiye''de yapıldığından Türkiye''de değerlendirilmiştir (md.
    7/4 ve son fıkra) | Tevkif edilmiştir; beyan edilmez (md. 86/2) |

    | Mevduat faizi | Sermaye Türkiye''de yatırılmıştır (md. 7/6) | Tevkif edilmiştir; beyan edilmez |

    | Arsa satış kazancı | İş/muamele Türkiye''de ifa edilmiştir, gayrimenkul Türkiye''dedir (md. 7/7) | İktisaptan itibaren
    beş yıl içinde satılan gayrimenkulden değer artışı kazancıdır (mükerrer md. 80/6); vergisi kesilmemiştir; **münferit beyanname**
    (md. 101) |


    **(c) Arsa satışı**


    - Endekslenmiş maliyet: 1.000.000 × 1,80 = 1.800.000 TL (artış %10''un üzerinde).

    - Safi kazanç: 2.800.000 − 1.800.000 − 42.000 = 958.000 TL.

    - İstisna (mükerrer md. 80/3): 150.000 TL; vergiye tabi kazanç 808.000 TL.

    - Vergi: 70.500 + (808.000 − 400.000) × %27 = 70.500 + 110.160 = **180.660 TL**.

    - Beyanname: Dar mükellef yıllık beyanname vermeye mecbur olmadığından kazancı **münferit beyanname** ile, gayrimenkulün
    bulunduğu yerin (Ankara) vergi dairesine, kazancın elde edildiği 10/7/2026''dan itibaren **15 gün** içinde bildirir (md.
    101). Vergi beyanname verme süresi içinde ödenir.


    **(d) Erol Bey''in yurt dışı kira geliri**


    - Ücreti tek işverenden ve tevkif yoluyla vergilendirilmiş olup 5.300.000 TL''yi aşmadığından beyana dahil edilmez (md.
    86/1-b).

    - Almanya''daki işyeri kirası tam mükellef için GMSİ''dir; tahsil edildiği 2026''da elde edilmiştir. Safi irat: 900.000
    − %15 götürü gider (135.000) = **765.000 TL**.

    - Hesaplanan vergi: 70.500 + (765.000 − 400.000) × %27 = **169.050 TL**.

    - Mahsup (md. 123): Yurt dışında ödenen şahsi gelir vergisi niteliğindeki vergi, konsolosluk tasdikli belgeyle tevsik
    edilmiştir. Türk vergisinin yurt dışı kazanca isabet eden kısmı, beyanda yalnız bu gelir bulunduğundan 169.050 TL''dir;
    135.000 TL bu sınırın altında olduğundan tamamı indirilir.

    - Ödenecek vergi: 169.050 − 135.000 = **34.050 TL**.

    '
