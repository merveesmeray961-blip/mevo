    yılı beyannamesinin verilme süresini belirtiniz. (5 puan)

    '
  cozum: '**(a) Kazancın doğduğu yıl ve bitim tarihi**


    Birden fazla takvim yılına sirayet eden inşaat ve onarma işlerinde kâr veya zarar işin bittiği yıl kati olarak tespit
    edilir ve tamamı o yılın geliri sayılarak o yıl beyannamesinde gösterilir (GVK md. 42/1). Geçici ve kesin kabul usulüne
