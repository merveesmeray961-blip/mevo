  soru: 'Türkiye''de yerleşik iki gerçek kişinin 2026 yılına ilişkin gelirleri aşağıdadır. Kişilerin ticari, zirai veya mesleki
    kazancı yoktur; gelir vergisinden indirilecek başka bir harcama ve indirimleri bulunmamaktadır.


    **1. Sevgi Karaca**


    | Gelir | Tutar (TL) | Tevkifat durumu |

    |---|---|---|

    | Tek işverenden elde ettiği ücret (gerçek safi tutar) | 1.100.000 | Gelir vergisi tevkif edilmiştir |

    | Tam mükellef (K) A.Ş.''den elde ettiği kâr payı (brüt) | 1.000.000 | %15 tevkifat yapılmıştır |

    | Bankadan elde ettiği mevduat faizi (brüt) | 200.000 | %15 tevkifat yapılmıştır |

    | Devlet tahvili faizi | 120.000 | %0 tevkifat uygulanmıştır |

    | Gerçek kişi borçludan tahsil ettiği alacak faizi | 40.000 | Tevkifat yapılmamıştır |


    Sevgi Hanım Devlet tahvilleri için 6.000 TL saklama (muhafaza) ücreti ödemiş; ayrıca (K) A.Ş.''nin genel kuruluna katılmak
    için 8.000 TL yol ve konaklama gideri yapmıştır.


    **2. Tarık Güneş**


    | Gelir | Tutar (TL) |

    |---|---|

    | 1. işverenden ücret (gerçek safi tutar) | 1.700.000 |

    | 2. işverenden ücret (gerçek safi tutar) | 450.000 |


    Her iki ücret de tevkif suretiyle vergilendirilmiş olup 2026 yılında toplam 560.000 TL gelir vergisi tevkif edilmiştir.
    Tarık Bey''in başka geliri yoktur.


    **Veriler:** 2009/14592 sayılı Bakanlar Kurulu Kararı''na göre tam mükellef kurumlarca tam mükellef gerçek kişilere dağıtılan
    kâr paylarında ve mevduat faizlerinde tevkifat oranı %15, Devlet tahvili faizlerinde %0''dır. 2026 tarifesinde ikinci
    gelir diliminin üst sınırı 400.000 TL, dördüncü gelir diliminin üst sınırı 5.300.000 TL''dir.


    2026 yılı gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için
    28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si
    için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40. Ücret gelirlerine
    uygulanacak tarifede ise 400.000 TL''nin üzerindeki kısım 1.500.000 TL''ye kadar %27 oranına tabidir; 1.500.000 TL için
    vergi 367.500 TL''dir ve bu tutarın üzerindeki kısım 5.300.000 TL''ye kadar %35 oranında vergilendirilir.


    **İstenenler:**


    (a) Sevgi Karaca''nın yıllık gelir vergisi beyannamesi verip vermeyeceğini, hangi gelirlerinin beyannameye dahil edileceğini
    GVK md. 86 hükümlerine göre gerekçesiyle belirtiniz. (7 puan)


    (b) Sevgi Karaca''nın beyannamesine dahil edilecek menkul sermaye iradı toplamını, hesaplanan gelir vergisini, mahsup
    edilecek tevkifatı ve ödenecek (veya iade edilecek) vergiyi bulunuz. (11 puan)


    (c) Tarık Güneş''in yıllık beyanname verme yükümlülüğünü gerekçesiyle belirtiniz; beyanname verecekse hesaplanan gelir
    vergisini ve ödenecek (iade edilecek) vergiyi bulunuz. (7 puan)

    '
  cozum: '**(a) Sevgi Karaca''nın beyan yükümlülüğü (GVK md. 86/1)**


    | Gelir | Değerlendirme |

    |---|---|

    | Ücret 1.100.000 TL | Tek işverenden alınmış, tevkifatla vergilendirilmiş ve tutar dördüncü gelir diliminin üst sınırını
    (5.300.000 TL) aşmadığı için beyan dışıdır (md. 86/1-b); beyanname verilse bile dahil edilmez. |

    | Kâr payı, mevduat faizi, Devlet tahvili faizi | Tevkifata tabi menkul sermaye iratları ancak vergiye tabi gelir toplamı
    (ücret hariç) ikinci gelir diliminin üst sınırı olan 400.000 TL''yi aşmıyorsa beyan dışı kalır (md. 86/1-c). Vergiye tabi
    gelir toplamı 854.000 TL olup 400.000 TL''yi aştığından bu iratlar beyannameye dahil edilir. |

    | Alacak faizi 40.000 TL | Tevkifata ve istisnaya konu olmayan menkul sermaye iratlarının toplamı 22.000 TL''yi aştığı
    için (40.000 > 22.000) beyan dışı değildir (md. 86/1-d). |


    Sonuç: Sevgi Karaca yıllık beyanname verir; beyannameye kâr payı, mevduat faizi, Devlet tahvili faizi ve alacak faizi
    dahil edilir, ücret dahil edilmez.


    **(b) Hesaplama**


    Kâr payının yarısı gelir vergisinden müstesnadır (md. 22/3): 1.000.000 × %50 = 500.000 TL istisna; vergiye tabi kısım
    500.000 TL.


    Safi irat hesabında depo etme/muhafaza (saklama) ücretleri indirilir (md. 78/1); şirket toplantılarına katılma gibi sermayenin
    idaresi için yapılan giderler indirilmez (md. 78/2). Dolayısıyla 6.000 TL saklama ücreti Devlet tahvili faizinden indirilir,
    8.000 TL genel kurul gideri indirilmez.


    | Kalem | TL |

    |---|---|

    | Kâr payı (1.000.000 − 500.000 istisna) | 500.000 |

    | Mevduat faizi | 200.000 |

    | Devlet tahvili faizi (120.000 − 6.000) | 114.000 |

    | Alacak faizi | 40.000 |

    | **Menkul sermaye iradı / vergiye tabi gelir** | **854.000** |


    Gelir vergisi: 70.500 + (854.000 − 400.000) × %27 = 70.500 + 122.580 = **193.080 TL**.


    Mahsup edilecek tevkifat (md. 121 ve md. 22/3): kâr payı 1.000.000 × %15 = 150.000 (tamamı, istisna edilen kısım dahil);
    mevduat faizi 200.000 × %15 = 30.000; Devlet tahvili %0. Toplam **180.000 TL**.


    Ödenecek gelir vergisi: 193.080 − 180.000 = **13.080 TL**.


    **(c) Tarık Güneş**


    Birden fazla işverenden ücret alanlarda, birinciden sonraki işverenlerden alınan ücretlerin toplamı ikinci gelir diliminin
    üst sınırını (400.000 TL) ve birinci işverenden alınanla birlikte toplam ücret dördüncü dilimin üst sınırını (5.300.000
    TL) aşmıyorsa tamamı tevkifatla vergilendirilmiş ücretler beyan dışıdır (md. 86/1-b). Tarık Bey''in 2. işverenden aldığı
    ücret 450.000 TL olup 400.000 TL''yi aştığından beyanname vermek zorundadır ve her iki işverenden alınan ücretin tamamı
    (1.700.000 + 450.000 = 2.150.000 TL) beyannameye dahil edilir.


    Ücret tarifesine göre vergi: 367.500 + (2.150.000 − 1.500.000) × %35 = 367.500 + 227.500 = **595.000 TL**.


    Mahsup edilecek tevkif edilmiş vergi 560.000 TL olduğundan ödenecek vergi: 595.000 − 560.000 = **35.000 TL**.

    '
