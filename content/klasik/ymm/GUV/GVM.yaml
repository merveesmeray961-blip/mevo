  dogrulama:
    python: "def gv(m):\n    if m <= 190000: return m*0.15\n    if m <= 400000: return 28500+(m-190000)*0.20\n    if m <=\
      \ 1000000: return 70500+(m-400000)*0.27\n    if m <= 5300000: return 232500+(m-1000000)*0.35\n    return 1737500+(m-5300000)*0.40\n\
      ilave = 480000+300000+60000+150000+20000+120000\ntk = 3000000+ilave\na = tk*0.60; b = tk*0.40\ngmsi = 360000*0.85\n\
