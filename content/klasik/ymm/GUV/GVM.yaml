    - *Fethi Arslan:* Gayrimenkul alım satımı ile uğraşanlar basit usulden faydalanamaz (md. 51/7). Hadler aşılmasa da kazancı
    baştan gerçek usulde tespit edilir.

    - *Gülşen Uçar:* İşyeri mülkiyeti iş sahibine ait ise emsal kira bedeli esas alınır; büyükşehir dışında sınır 60.000 TL''dir
    (md. 47/2). Emsal kira 75.000 TL olduğundan şart yoktur. Yeniden işe başlayanlarda 2 ve 3 numaralı bentler işe başlama
