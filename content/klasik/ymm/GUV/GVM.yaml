  soru: 'Türkiye''de yerleşik Selin Hanım''ın 2026 yılındaki gelirleri aşağıdadır. Selin Hanım''ın ticari, zirai veya mesleki
    kazancı, sermaye iradı ve diğer kazancı yoktur.


    1. **(A) A.Ş.**''de tam zamanlı uzman olarak çalışmaktadır. Yıllık ücretinin vergiye tabi (SGK primleri ve asgari ücret
    istisnası düşülmüş) tutarı, yemek bedeli hariç **2.378.000 TL**''dir. İş yerinde yemek verilmemekte; şirket çalışılan
    220 gün için günlük **400 TL** yemek bedelini yemek kartına yüklemektedir. Şirket yemek bedelinin vergiye tabi kısmı dahil
    toplam ücreti üzerinden **682.500 TL** gelir vergisi kesmiştir.

    2. **(B) Ltd. Şti.**''nde haftada iki gün, şirketin iş yerinde ve şirket müdürünün talimatlarıyla, belirli çalışma saatlerinde
    analist olarak çalışmaktadır. Vergiye tabi ücreti **520.000 TL**, kesilen gelir vergisi **102.900 TL**''dir.

    3. **(C) A.Ş.**''nin yönetim kurulu üyesidir. Yönetim kurulu toplantılarına katılım için aldığı huzur hakkının vergiye
    tabi tutarı **300.000 TL**, kesilen gelir vergisi **50.500 TL**''dir.


    Ek bilgiler: Bu soruda beyan sınırlarının kontrolünde de yukarıdaki vergiye tabi ücret tutarları esas alınacaktır. 2026
    yılı için yemek bedeli istisnası günlük 300 TL''dir. 2026 gelir vergisi tarifesinin ücret gelirlerine uygulanan dilimleri:
    190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.500.000 TL''nin 400.000 TL''si
    için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.500.000 TL''si için 367.500 TL, fazlası %35; 5.300.000 TL''den fazlasının
    5.300.000 TL''si için 1.697.500 TL, fazlası %40. Tarifenin ikinci gelir dilimi tutarı 400.000 TL, dördüncü gelir dilimi
    tutarı 5.300.000 TL''dir.


    **İstenenler:**


    (a) Üç ödemenin her birinin gelir unsuru olarak niteliğini gerekçesiyle belirtiniz; (A) A.Ş.''den alınan vergiye tabi
    ücreti yemek bedeli istisnasını dikkate alarak hesaplayınız. (7 puan)


    (b) Selin Hanım''ın ücret gelirleri için yıllık beyanname vermek zorunda olup olmadığını GVK md. 86''ya göre gerekçesiyle
    açıklayınız. (8 puan)


    (c) Beyanname verilmesi gerekiyorsa beyan edilecek ücret toplamını, hesaplanan gelir vergisini, mahsup edilecek vergileri
    ve ödenecek (veya iade edilecek) vergiyi hesaplayınız; beyan ve ödeme sürelerini belirtiniz. (10 puan)

    '
