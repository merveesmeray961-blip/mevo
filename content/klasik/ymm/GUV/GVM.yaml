  - olcut: 'Kalem 8: ortağa emsale uygun kiranın gider yazılabileceği'
    puan: 2
  - olcut: Ticari kazancın 4.130.000 TL ve ortak paylarının 2.478.000 / 1.652.000 TL bulunması
    puan: 3
  - olcut: Payların şahsi ticari kazanç niteliği (md. 37) ve ortağa ödenen ücretin ayrıca beyan edilmemesi
    puan: 2
  - olcut: Ahmet Bey'in vergisinin 749.800 TL hesaplanması
    puan: 3
  - olcut: Burak Bey'in GMSİ'sinin brüt üzerinden 306.000 TL bulunması ve beyana dahil edilme gerekçesi
    puan: 3
  - olcut: Burak Bey'in vergisinin 567.800 TL, stopaj mahsubu sonrası 495.800 TL bulunması; beyan ve ödeme süreleri
    puan: 4
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 37, 41, 70, 74, 85, 86, 103, 121
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332)'
