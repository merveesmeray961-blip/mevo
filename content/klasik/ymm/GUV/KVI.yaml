- id: YMM-GUV-KVI-K001
  sinav: ymm
  ders: GUV
  konu: KVI
  kazanimlar:
  - iştirak kazançları istisnası
  - yurt dışı iştirak ve şube kazançları
  - taşınmaz ve iştirak hissesi satış istisnası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Hesap dönemi takvim yılı olan ve imalat sektöründe faaliyet gösteren (Y) AŞ''nin (banka veya finans kuruluşu değildir;
    kurumlar vergisi oranı %25) 2026 yılına ilişkin bilgileri aşağıdadır. Ticari bilanço kârı, tabloda yer alan gelirlerin
    tamamını içermektedir.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 20.000.000 |

    | Kanunen kabul edilmeyen giderler | 1.000.000 |

    | Tam mükellef (B) AŞ''den alınan kâr payı | 1.200.000 |

    | Yurt dışı iştirak (C) GmbH''den alınan kâr payı (yurt dışında kesinti yapılmamıştır) | 2.000.000 |

    | (Z) ülkesindeki şubenin kazancı | 1.000.000 |

    | (D) AŞ iştirak hisselerinin satış kazancı | 4.000.000 |


    Ek bilgiler:


    1. (Y) AŞ, imalatçı (C) GmbH''nin ödenmiş sermayesinin %40''ına 2021 yılından beri sahiptir. Kâr payına kaynak kazançların
    (C)''nin bulunduğu ülkedeki vergi yükü %18''dir. Kâr payının 1.500.000 TL''si 15/4/2027''de Türkiye''ye transfer edilmiş,
    kalan 500.000 TL transfer edilmemiştir.

    2. (Z) ülkesindeki şubenin esas faaliyeti finansman, sigorta veya menkul kıymet yatırımı değildir. Şube kazancı %20 vergi
    yükü taşımakta olup tamamı 10/3/2027''de Türkiye''ye transfer edilmiştir.

    3. (D) AŞ hisseleri 2022 yılından beri aktifte (mali duran varlıklarda) kayıtlıdır. Hisseler 15/9/2026''da 5.000.000 TL''ye
    vadeli olarak satılmıştır (kayıtlı değeri 1.000.000 TL). Tahsilat planı: 2026''da 2.000.000 TL, 2027''de 2.000.000 TL,
    2029''da 1.000.000 TL. Şirket menkul kıymet ticaretiyle uğraşmamaktadır.

    4. Yurt içi asgari kurumlar vergisi ve yurt dışında ödenen vergilerin mahsubu bu soruda dikkate alınmayacaktır. Cumhurbaşkanı
    kararıyla değiştirilmiş bir istisna oranı yoktur.


    **İstenenler:**


    (a) (B) AŞ''den, (C) GmbH''den alınan kâr payları ile (Z) ülkesindeki şube kazancının istisna durumunu gerekçeleriyle
    belirleyip istisna tutarlarını hesaplayınız. (7 puan)


    (b) (D) AŞ hisselerinin satışında tahsil şartını dikkate alarak 2026 yılında uygulanabilecek istisna tutarını ve özel
    fon hesabına alınması gereken tutarı hesaplayınız; şirketin bu satış için 3.000.000 TL istisna uygulaması hâlinde doğacak
    sonucu açıklayınız. (8 puan)


    (c) 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (5 puan)


    (d) Özel fon hesabının hangi tarihe kadar tutulacağını; bu süre içinde fon tutarının sermayeye eklenmesi, başka bir hesaba
    aktarılması veya şirketin tasfiyeye girmesi hâllerinin sonuçlarını açıklayınız. (5 puan)

    '
  cozum: '**(a) Kâr payları ve şube kazancı**


    - (B) AŞ kâr payı: KVK 5/1-(a) kapsamındadır. Tam mükellef kurumdan alınan kâr paylarında iştirak oranı ve süre şartı
    aranmaz → **1.200.000 TL istisna**.

    - (C) GmbH kâr payı: KVK 5/1-(b) şartları: limited şirket niteliği ve kanuni/iş merkezinin yurt dışında olması ✓; ödenmiş
    sermayenin en az %10''u (%40) ✓; kesintisiz en az bir yıl (2021''den beri) ✓; en az %15 vergi yükü (%18) ✓; elde edildiği
    döneme ait kurumlar vergisi beyannamesinin verilmesi gereken tarihe kadar transfer. 2026 dönemi beyannamesi 1–25 Nisan
    2027 arasında verilir (KVK md. 25/5); son tarih 25/4/2027. 15/4/2027''de getirilen 1.500.000 TL istisnadır; transfer edilmeyen
    500.000 TL sonradan getirilse de istisnadan yararlanamaz ve kurum kazancında kalır → **1.500.000 TL istisna**.

    - Şube kazancı: KVK 5/1-(g): en az %15 vergi yükü (%20) ✓; beyanname verilmesi gereken tarihe kadar transfer (10/3/2027)
    ✓; esas faaliyet finansman/sigorta/menkul kıymet olmadığından %15 yeterlidir → **1.000.000 TL istisna**.


    **(b) İştirak hissesi satışı (KVK 5/1-e)**


    - Hisseler iki tam yıldan fazla aktifte ✓; şirket menkul kıymet ticaretiyle uğraşmıyor ✓.

    - Satış kazancı = 5.000.000 − 1.000.000 = 4.000.000 TL; kazancın satış bedeline oranı = 4.000.000 / 5.000.000 = %80.

    - Satış bedelinin, satışın yapıldığı yılı izleyen ikinci takvim yılının sonuna (31/12/2028) kadar tahsil edilmesi şarttır.
    2029''da tahsil edilecek 1.000.000 TL bu süre dışındadır.

    - Süresinde tahsil edilecek bedel 4.000.000 TL → isabet eden kazanç 4.000.000 × %80 = 3.200.000 TL → istisna 3.200.000
    × %75 = **2.400.000 TL**. Fon hesabına alınacak tutar da **2.400.000 TL**''dir (yalnız istisnadan yararlanan kısım fona
    alınır).

    - Şirket 3.000.000 TL (4.000.000 × %75) istisna uygularsa, süresinde tahsil edilmeyen 1.000.000 TL''ye isabet eden 1.000.000
    × %80 × %75 = 600.000 TL istisna nedeniyle zamanında tahakkuk ettirilmeyen vergi (600.000 × %25 = 150.000 TL) ziyaa uğramış
    sayılır; vergi aslı, vergi ziyaı cezası ve gecikme faiziyle birlikte 2026 dönemi için aranır. Satış döneminde 2.400.000
    TL istisna uygulanırsa vergi ziyaı doğmaz.


    **(c) Matrah ve vergi**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 20.000.000 |

    | + KKEG | 1.000.000 |

    | = Kurum kazancı | 21.000.000 |

    | − 5/1-(a) iştirak kazancı | 1.200.000 |

    | − 5/1-(b) yurt dışı iştirak kazancı | 1.500.000 |

    | − 5/1-(g) yurt dışı şube kazancı | 1.000.000 |

    | − 5/1-(e) iştirak hissesi satış kazancı | 2.400.000 |

    | = Kurumlar vergisi matrahı | **14.900.000** |

    | Hesaplanan kurumlar vergisi (%25) | **3.725.000** |


    **(d) Özel fon hesabı**


    - İstisna tutarı, satışın yapıldığı yılı izleyen beşinci yılın sonuna, yani **31/12/2031**''e kadar pasifte özel fon hesabında
    tutulur. Fona alma işlemi, satışın yapıldığı yılı izleyen hesap döneminin başından itibaren 2026 beyannamesinin verildiği
    tarihe kadar yapılmalıdır.

    - Fon tutarının **sermayeye eklenmesi** istisnayı bozmaz.

    - Bu süre içinde sermayeye ilave dışında başka bir hesaba nakledilmesi, işletmeden çekilmesi veya işletmenin tasfiyeye
    girmesi (KVK''ya göre yapılan devir ve bölünmeler hariç) hâlinde, ilgili kısım için istisna nedeniyle zamanında tahakkuk
    ettirilmeyen vergiler ziyaa uğramış sayılır; vergi ziyaı cezası ve gecikme faiziyle tahsil edilir. Fon hesabının devir
    ve tam bölünmede devralan kuruma aynen aktarılması işletmeden çekiş sayılmaz.


    Dayanak: KVK md. 5/1-(a), (b), (e), (g); md. 25/5; 1 Seri No.lu KV Genel Tebliği bölüm 5.1, 5.2.1.6, 5.6.2.3.2, 5.6.2.3.3.'
  puanlama:
  - olcut: (B) AŞ kâr payının şartsız istisna olduğunun belirtilmesi
