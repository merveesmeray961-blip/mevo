  soru: '**Olay:** Tam mükellef Kuzey Holding A.Ş. (menkul kıymet ticaretiyle uğraşmamaktadır), Almanya''da kurulu Nord GmbH''deki
    %40''lık iştirak payını (aktifte 3 yıldır kesintisiz bulunmaktadır) 2026''da satmış ve 5.000.000 TL kazanç elde etmiştir.
    Satış bedeli 2026''da tahsil edilmiştir.


    Holding''in aktif yapısına ilişkin iki farklı senaryo incelenecektir:


    | Senaryo | Nakit varlıklar dışındaki aktif toplamı | Bu aktiflerin içinde, her birine en az %10 oranında iştirakten oluşan
    yurt dışı anonim/limited iştirak hisseleri | Süre |

    |---|---|---|---|

    | I | 100.000.000 TL | 80.000.000 TL | Bu oran aralıksız en az 1 yıldır sağlanmaktadır |

    | II | 100.000.000 TL | 70.000.000 TL | Bu oran aralıksız en az 1 yıldır sağlanmaktadır |


    Holding''in 2026 yılında başka satış veya yurt içi/yurt dışı iştirak kazancı yoktur; ticari bilanço kârı yalnızca bu satış
    kazancı (5.000.000 TL) ile esas faaliyetinden elde ettiği 1.000.000 TL kârdan oluşmaktadır. Kanunen kabul edilmeyen gider
    yoktur. İştirak hisseleri satış kazancı istisna oranı, 9160 sayılı Cumhurbaşkanı Kararı ile %50 olarak belirlenmiştir.
    KV oranı %25''tir.


    **İstenenler:**


    (a) KVK md. 5/1-c istisnasının şartlarını ve Senaryo I''deki sonucu açıklayınız. (6 puan)


    (b) Senaryo I''de kurum kazancını ve kurumlar vergisini hesaplayınız. (5 puan)


    (c) Senaryo II''de hangi hükmün uygulanacağını belirtiniz ve kurum kazancı ile kurumlar vergisini hesaplayınız. (7 puan)


    (d) İki senaryo arasındaki vergi farkını bulunuz. (3 puan)

    '
  cozum: '**(a) Md. 5/1-c şartları**


    1. Kazancın elde edildiği tarih itibarıyla aralıksız en az bir yıl süreyle, nakit varlıklar dışında kalan aktif toplamının
    en az %75''inin, kanunî veya iş merkezi Türkiye''de bulunmayan anonim/limited şirketlerin her birinin sermayesine en az
    %10 oranında iştirakten oluşması,

    2. Tam mükellef anonim şirket olunması,

    3. Satılan yurt dışı iştirak hisselerinin en az iki tam yıl süreyle aktifte yer alması.


    Senaryo I: 80.000.000 / 100.000.000 = %80 ≥ %75; süre 3 yıl ≥ 2 yıl. Şartlar sağlandığından satış kazancı **tamamen**
    istisnadır.


    **(b) Senaryo I**


    | Kalem | Tutar |

    |---|---|

    | Esas faaliyet kârı | 1.000.000 |

    | Satış kazancı | 5.000.000 (tamamı istisna) |

    | **Kurum kazancı** | **1.000.000** |


    KV = 1.000.000 × %25 = **250.000 TL**.


    **(c) Senaryo II**


    70.000.000 / 100.000.000 = %70 < %75 olduğundan md. 5/1-c uygulanmaz. Hisseler en az iki tam yıldır aktifte olduğundan
    md. 5/1-e (iştirak hisseleri satış istisnası) uygulanır; oran 9160 sayılı Karar ile %50''dir.


    | Kalem | Tutar |

    |---|---|

    | Esas faaliyet kârı | 1.000.000 |

    | Satış kazancı | 5.000.000 |

    | − İstisna (%50) | (2.500.000) |

    | **Kurum kazancı** | **3.500.000** |


    KV = 3.500.000 × %25 = **875.000 TL**.


    **(d)** Fark = 875.000 − 250.000 = **625.000 TL**.


    Püf noktaları: (1) Holding yapısı testi aktifin nakit hariç %75''ini arar; %70 yetmez. (2) c bendi sağlanmasa da e bendi
    (iki tam yıl şartıyla) çalışabilir; ancak oran %50''dir. (3) İstisnadan yararlanan kısım e bendinde beş yıl pasifte fon
    hesabında izlenir.

    '
