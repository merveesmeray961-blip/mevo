  - olcut: (C) GmbH için 5/1-(b) şartlarının sayılıp sağlandığının gösterilmesi
    puan: 2
  - olcut: Transfer süresinin 25/4/2027 olarak belirlenip 1.500.000 TL istisna / 500.000 TL istisna dışı ayrımının yapılması
    puan: 2
  - olcut: Şube kazancının 5/1-(g) kapsamında 1.000.000 TL istisna olduğunun gerekçelendirilmesi
    puan: 2
