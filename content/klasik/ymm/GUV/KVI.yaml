  cozum: '**(a) Gemi işletmeciliği istisnası**


    Zamana ve yüke bağlı geminin tamamını veya bir kısmını taşıtana tahsis ederek yapılan time-charter işletmeciliği gemi
    işletmeciliği faaliyeti sayılır. Faaliyet esaslı bir istisnada aynı istisna konusundaki tüm faaliyetler bir hesap döneminde
    birlikte değerlendirilir; bu nedenle "Kızıl" gemisinin zararı, "Mavi" gemisinin kazancından mahsup edilerek istisna kazanç
    bulunur. Taşımacılık alacaklarına ilişkin kur farkı geliri de bu faaliyete bağlı olduğundan istisna kapsamındadır.


    | Kalem | İstisna kapsamında mı? | Tutar (TL) |

    |---|---|---|

    | "Mavi" taşımacılık | Evet | 9.000.000 |

    | "Kızıl" time-charter | Evet (aynı faaliyet bütününde mahsup) | (1.500.000) |

    | Taşımacılık alacaklarına ilişkin kur farkı | Evet | 400.000 |

    | Mevduat faizi | Hayır (faaliyetle ilgisiz) | — |

    | "Yeşil" yüzer restoran | Hayır (otel/restoran işletmeciliği gemi işletmeciliği değildir) | — |

    | "Sarı" doğrudan kiralama | Hayır (zamana veya yüke bağlı olmayan kira gemi işletmeciliği değildir) | — |


    Gemi işletmeciliği istisna kazancı: 9.000.000 − 1.500.000 + 400.000 = **7.900.000 TL**.


    **(b) KVK md. 5/B istisnası**


    İstisna oranı %50''dir.


    - Lisans kirası: 4.000.000 × %50 = **2.000.000 TL**.

    - Üretim sürecinde kullanma: Ürün satışı kazancının buluşa atfedilen kısmı, buluşla ilgili maliyetlerin toplam maliyet
    içindeki payına göre ayrıştırılır: 3.000.000 × (2.000.000 / 20.000.000) = 300.000 TL; istisna: 300.000 × %50 = **150.000
    TL**.


    Toplam 5/B istisnası: 2.000.000 + 150.000 = **2.150.000 TL**.


    **(c) Matrah ve vergi**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı (= kurum kazancı) | 21.000.000 |

    | − Gemi işletmeciliği istisnası | 7.900.000 |

    | − 5/B istisnası | 2.150.000 |

    | (Toplam istisna: 7.900.000 + 2.150.000) | (10.050.000) |

    | = **Kurumlar vergisi matrahı** | **10.950.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.737.500** |


    **(d) 4691 sayılı Kanun ve Ar-Ge indirimi**


    Mükellefler hem 4691 sayılı Kanun hem de 5/B şartlarını sağlasalar dahi aynı buluştan elde ettikleri kazançlara bu istisnalardan
    yalnızca biri uygulanabilir; 5/B istisnasından yararlanan, aynı kazanç için 4691 sayılı Kanun kapsamındaki istisnadan
    ayrıca yararlanamaz. Ar-Ge harcamalarının Ar-Ge indirimine konu edilmiş olması ise 5/B istisnasından yararlanmaya engel
    değildir.

    '
