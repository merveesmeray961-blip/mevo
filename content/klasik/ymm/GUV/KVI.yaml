  soru: 'Tam mükellef (E) A.Ş.''nin hesap dönemi takvim yılıdır; bankacılık veya finans kuruluşu değildir. Şirketin defterlerine
    göre 2026 yılı ticari bilanço kârı (kurumlar vergisi karşılığı ayrılmadan önce) **20.000.000 TL**''dir. YMM incelemesinde
    şu hususlar tespit edilmiştir:


    1. Şirket Mayıs 2026''da sermayesini 10.000.000 TL artırmış; itibari değeri 10.000.000 TL olan yeni payları nakden 16.000.000
    TL''ye ihraç etmiştir. Muhasebe birimi tahsilatı şöyle kaydetmiştir: 102 Bankalar borç 16.000.000; 500 Sermaye alacak
    10.000.000; 649 Diğer Olağan Gelir ve Kârlar alacak 6.000.000.

    2. Tam mükellef (F) A.Ş.''den 800.000 TL kâr payı alınmış ve gelir yazılmıştır.

    3. Bir hisse senedi yoğun yatırım fonunun (KVK md. 5/1-d kapsamında kazancı istisna olan fon) katılma paylarının fona
    iadesinden 300.000 TL kazanç elde edilmiştir.

    4. Tam mükellef bir girişim sermayesi yatırım fonunun katılma paylarının fona iadesinden 400.000 TL kazanç elde edilmiştir.

    5. Kazancı md. 5/1-d kapsamında istisna olan ve taşınmaz kazançlarının yarısından fazlasını süresinde dağıtan (G) Gayrimenkul
    Yatırım Ortaklığı A.Ş.''nin hisselerinden 250.000 TL kâr payı alınmıştır.

    6. Taşınmaz kazançlarının en az %50''sini süresinde dağıtmadığı için md. 5/1-d istisnasından yararlanamayan (H) Gayrimenkul
    Yatırım Ortaklığı A.Ş.''nin hisselerinden 150.000 TL kâr payı alınmıştır.

    7. (F) A.Ş. hisselerinin satın alınması için kullanılan kredinin 2026 yılı faizi 500.000 TL gider yazılmıştır.


    Yukarıdakiler dışında kanunen kabul edilmeyen gider 100.000 TL''dir. Şirketin geçmiş yıl zararı ve md. 10 indirimi yoktur.
    Kurumlar vergisi oranı %25''tir; yurt içi asgari kurumlar vergisi oranı %10 olup şirket ilk defa faaliyete başlamış bir
    kurum değildir.


    **İstenenler:**


    (a) Emisyon primine ilişkin hatalı kaydı değerlendiriniz, gerekli düzeltme kaydını Tekdüzen Hesap Planına göre yapınız
    ve emisyon priminin kurumlar vergisi karşısındaki durumunu dayanağıyla açıklayınız. (7 puan)


    (b) 2–7 numaralı kalemlerin her birinin iştirak kazançları istisnası (md. 5/1-a) ve md. 5/3 karşısındaki durumunu gerekçesiyle
    belirtiniz. (10 puan)


    (c) Düzeltilmiş ticari bilanço kârını, kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; yurt içi asgari
    kurumlar vergisi karşılaştırmasını yapınız. (8 puan)

    '
  cozum: '**(a) Emisyon primi**


    Payların itibari değeri aşan bedelle ihracından doğan 6.000.000 TL emisyon primidir; bir gelir değil, öz kaynak unsurudur
    ve **520 Hisse Senetleri İhraç Primleri** hesabında izlenir. Ayrıca KVK md. 5/1-ç uyarınca anonim şirketlerin kuruluşta
    veya sermaye artırımında çıkardıkları payların bedelinin itibari değeri aşan kısmı kurumlar vergisinden istisnadır; ticari
    kâra karışmış olsa bile beyannamede vergilendirilmez.


    Düzeltme kaydı (kapanıştan önce):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 649 Diğer Olağan Gelir ve Kârlar | 6.000.000 | |

    | 520 Hisse Senetleri İhraç Primleri | | 6.000.000 |


    Düzeltme sonrası ticari bilanço kârı = 20.000.000 − 6.000.000 = **14.000.000 TL**. (Düzeltme yapılmayıp tutarın beyannamede
    md. 5/1-ç istisnası olarak düşülmesi de aynı matraha götürür.)


    **(b) Diğer kalemler**


    | No | Değerlendirme | İstisna (TL) |

    |---|---|---|

    | 2 | Tam mükellef kurumdan kâr payı; oran ve süre şartı aranmaksızın md. 5/1-a-1 istisnası | 800.000 |

