    |---|---|---|

    | 1 Mart 2023 | 100.000 | 10 |

    | 10 Mart 2025 | 20.000 | 30 |


    (T) A.Ş., bu hisselerden **110.000 adedini 1 Ekim 2026''da adet başına 50 TL''den** (toplam 5.500.000 TL) satmıştır. Satış
    bedelinin tahsilatı sözleşmeye göre şöyledir: 3.300.000 TL 2026 yılında, 1.100.000 TL 2027 yılında, 1.100.000 TL ise 15
    Ocak 2029''da tahsil edilecektir. Aynı kurumun hisse senedi niteliğindeki diğer iştirak payı yoktur. (T) A.Ş.''nin 2026
    ticari bilanço kârı **12.000.000 TL**''dir ve bu kâr satıştan doğan kazancın tamamını içermektedir; başka düzeltme kalemi
    yoktur. KVK md. 5/1-(e) bendi uyarınca uygulanacak istisna oranı 9160 sayılı Cumhurbaşkanı Kararı ile %50 olarak belirlenmiştir.


    **İstenenler:**


    (a) Satılan hisselerin hangi alım partilerinden çıktığını belirleyiniz; toplam satış kazancını ve istisna kapsamına girebilecek
    kazancı gerekçesiyle hesaplayınız. (7 puan)


    (b) Satış bedelinin tahsilat takvimini de dikkate alarak 2026 yılında uygulanabilecek istisna tutarını, kurumlar vergisi
    matrahını ve hesaplanan kurumlar vergisini bulunuz. (8 puan)


    (c) İstisnadan yararlanan kazancın hangi hesapta ve ne zamana kadar tutulması gerektiğini belirtiniz. (T) A.Ş.''nin 2029
    yılında bu hesaptan 500.000 TL''yi ortaklarına kâr payı olarak dağıtması hâlinde doğacak vergisel sonucu hesaplayınız.
    (5 puan)


    (d) (T) A.Ş.''nin tahsilat takvimini dikkate almayıp 2026 beyannamesinde 2.000.000 TL istisna uygulaması durumunda doğacak
    sonucu açıklayınız ve vergi aslını hesaplayınız. (5 puan)

    '
  cozum: '**(a) Satış kazancı**


    Aynı kuruma ait değişik tarihlerde edinilen iştirak hisselerinin iki tam yıl aktifte kalma şartının sağlanıp sağlanmadığı,
    ilk giren ilk çıkar (FİFO) yöntemiyle belirlenir. Satılan 110.000 adet, önce 1 Mart 2023 tarihli 100.000 adetten, kalan
    10.000 adet ise 10 Mart 2025 tarihli partiden çıkar.


    | Parti | Adet | Satış kazancı (TL) | İki tam yıl şartı |

    |---|---|---|---|

    | 1 Mart 2023 | 100.000 | 100.000 × (50 − 10) = 4.000.000 | Sağlandı (3 yıldan fazla) |

    | 10 Mart 2025 | 10.000 | 10.000 × (50 − 30) = 200.000 | Sağlanmadı (1 yıl 6 ay) |

    | **Toplam** | 110.000 | **4.200.000** | |


    İstisna kapsamına giren kazanç **4.000.000 TL**''dir; 200.000 TL tamamen vergilendirilir.


    **(b) Tahsilatın etkisi, matrah ve vergi**


    İstisna oranı %50 olduğundan tahsilat sorunu olmasaydı istisna 4.000.000 × %50 = 2.000.000 TL olurdu. Satış bedelinin,
    satışın yapıldığı yılı izleyen ikinci takvim yılının sonuna (31 Aralık 2028) kadar tahsil edilmesi şarttır. 15 Ocak 2029''da
    tahsil edilecek 1.100.000 TL, toplam bedelin %20''sidir (1.100.000 / 5.500.000); buna isabet eden istisna kazanç kısmı
    için istisnadan yararlanılamaz.


    - Tahsil edilecek oran: (3.300.000 + 1.100.000) / 5.500.000 = %80

    - İstisna: 2.000.000 × %80 = **1.600.000 TL** (tahsil edilemeyen kısma isabet eden 400.000 TL için istisna uygulanamaz)


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | − İstisna kazanç | 1.600.000 |

    | = **Kurumlar vergisi matrahı** | **10.400.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.600.000** |


    **(c) Fon hesabı**


    İstisnadan yararlanan kısım (1.600.000 TL), satışın yapıldığı yılı izleyen beşinci yılın sonuna kadar, yani **31 Aralık
    2031**''e kadar pasifte özel bir fon hesabında tutulur (yalnızca istisnadan yararlanan kısmın fona alınması yeterlidir;
    kazancın tamamının alınması gerekmez). Fon hesabından 2029''da ortaklara dağıtılan 500.000 TL, süre dolmadan işletmeden
    çekilmiş sayılır; bu tutar için uygulanan istisna nedeniyle zamanında tahakkuk ettirilmeyen vergi ziyaa uğramış sayılır:
    500.000 × %25 = **125.000 TL** (vergi ziyaı cezası ve gecikme faiziyle birlikte tahsil edilir).


    **(d) Tahsilat dikkate alınmadan 2.000.000 TL istisna uygulanması**


    Tahsil edilmeyecek 1.100.000 TL''ye isabet eden 400.000 TL fazla istisna nedeniyle zamanında tahakkuk ettirilmeyen vergi
    ziyaa uğramış sayılır: 400.000 × %25 = **100.000 TL** vergi aslı; buna vergi ziyaı cezası ve gecikme faizi eklenir. İstisna
    tutarı baştan doğru (1.600.000 TL) belirlenseydi ziyaa uğrayan vergi doğmazdı.

    '
