    | Diğer faaliyetler | 2.500.000 kazanç |


    Patent, Türkiye''de gerçekleştirilen Ar-Ge faaliyetleri sonucunda ortaya çıkan buluşa ilişkin olup Türk Patent ve Marka
    Kurumu tarafından incelemeli sistemle (P) A.Ş. adına verilmiştir; lisans kirası bu patent nedeniyle elde edilmiştir. Ürün
