  - olcut: (a) Finansman gider kısıtlamasının aşan kısım oranıyla hesaplanması (40.000 TL)
    puan: 3
  - olcut: (a) KKEG toplamı (720.000 TL)
    puan: 1
  - olcut: (b) Kâr payının iştirak kazancı istisnası kapsamında indirilmesi
    puan: 2
  - olcut: (b) 2020 zararının süresi dolduğundan indirilememesi
    puan: 2
  - olcut: (b) 2021 zararının 2026'da indirilebilmesi
    puan: 2
  - olcut: (c) Bağış sınırının esas kazancının tebliğe göre tespiti (5.000.000 TL)
    puan: 3
  - olcut: (c) İndirilecek bağış (250.000 TL) ve aşan kısmın devredilemeyeceği
    puan: 2
  - olcut: (d) Matrahın doğru sırayla hesaplanması (5.470.000 TL)
    puan: 3
  - olcut: (d) Hesaplanan (1.367.500 TL) ve ödenecek (367.500 TL) kurumlar vergisi
    puan: 2
  - olcut: (d) Beyan (1–25 Nisan 2027) ve ödeme (30 Nisan 2027) süreleri
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a, 6, 9, 10/1-c, 11, 14, 21, 32
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 10.3.2.1, 11.13
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'fin = 1200000 * (15000000 - 10000000) / 15000000 * 0.10

      kkeg = 80000 + 200000 * 0.5 + 500000 + fin

      istirak = 800000

      zarar = 200000

      bagis_esas = 6000000 - (istirak + zarar)

      bagis = min(500000, bagis_esas * 0.05)

      matrah = 6000000 + kkeg - istirak - zarar - bagis

      kv = matrah * 0.25

      sonuc = {"finansman_kkeg": fin, "kkeg": kkeg, "bagis_indirimi": bagis, "matrah": matrah, "kv": kv, "odenecek": kv -
      1000000}'
