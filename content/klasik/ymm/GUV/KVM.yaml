- id: YMM-GUV-KVM-K001
  sinav: ymm
  ders: GUV
  konu: KVM
  kazanimlar:
  - kurum kazancının tespiti
  - kanunen kabul edilmeyen giderler (KVK md.11)
  - zarar mahsubu
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Hesap dönemi takvim yılı olan, ticaret ve hizmet alanında faaliyet gösteren (ABC) AŞ''nin 2026 yılına ilişkin bilgileri
    aşağıdadır. Şirket bankacılık veya finans sektöründe değildir, ihracat ya da sanayi üretimi nedeniyle indirimli kurumlar
    vergisi oranından yararlanmamaktadır; yurt içi asgari kurumlar vergisi hesabı dikkate alınmayacaktır.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı (kurumlar vergisi karşılığı ayrılmadan önce) | 6.000.000 |

    | Gider yazılan vergi cezaları ve vergi ziyaı cezası | 80.000 |

    | Gider yazılan alkollü içki ilan ve reklam giderleri | 200.000 |

    | Kamu yararına çalışan bir derneğe makbuz karşılığı yapılan ve gider yazılan nakdi bağış | 500.000 |

    | Gider yazılan finansman giderleri (tamamı kredilerin kullanım süresine bağlı faiz; maliyete eklenen yok) | 1.200.000
    |

    | 31/12/2026 tarihli bilançoda öz kaynaklar | 10.000.000 |

    | 31/12/2026 tarihli bilançoda yabancı kaynaklar | 15.000.000 |

    | Tam mükellef (Y) AŞ''den alınan ve gelir yazılan kâr payı | 800.000 |

    | 2020 yılı beyannamesinde yer alan, mahsup edilmemiş zarar | 150.000 |

    | 2021 yılı beyannamesinde yer alan, mahsup edilmemiş zarar | 200.000 |

    | 2026 yılı dönemleri için tahakkuk ettirilip ödenen geçici vergi | 1.000.000 |


    Finansman gider kısıtlaması oranı %10; alkollü içki reklam giderlerine ilişkin oran kanuni orandır; kurumlar vergisi oranı
    %25''tir. Bağış indiriminde esas alınacak kurum kazancı, 1 Seri No.lu Kurumlar Vergisi Genel Tebliği''nde belirtilen şekilde
    tespit edilecektir.


    **İstenenler:**


    (a) Kanunen kabul edilmeyen giderlerin toplamını, finansman gider kısıtlaması hesabını göstererek bulunuz. (7 puan)


    (b) Kâr payı ve geçmiş yıl zararları bakımından kurum kazancından yapılacak indirimleri gerekçeleriyle belirleyiniz. (6
    puan)


    (c) Kurum kazancından indirilebilecek bağış tutarını hesaplayınız. (5 puan)


    (d) Kurumlar vergisi matrahını, hesaplanan ve ödenecek kurumlar vergisini bulunuz; beyannamenin verilme ve verginin ödenme
    sürelerini belirtiniz. (7 puan)

    '
  cozum: '**(a) Kanunen kabul edilmeyen giderler (KVK md.11)**


    | Kalem | Dayanak | KKEG (TL) |

    |---|---|---|

    | Vergi cezaları | md.11/1-d | 80.000 |

    | Alkollü içki reklam giderinin %50''si | md.11/1-ı | 100.000 |

    | Gider yazılan bağış (kâra eklenir, md.10 ile ayrıca indirilir) | md.10/1-c | 500.000 |

    | Finansman gider kısıtlaması | md.11/1-i | 40.000 |

    | **Toplam** | | **720.000** |


    Finansman gider kısıtlaması: Yabancı kaynaklar (15.000.000) öz kaynakları (10.000.000) 5.000.000 TL aşmaktadır. Aşan kısma
    isabet eden gider = 1.200.000 × (5.000.000 / 15.000.000) = 400.000 TL; KKEG = 400.000 × %10 = 40.000 TL.


    **(b) İştirak kazancı ve zarar mahsubu**


    - (Y) AŞ''den alınan 800.000 TL kâr payı, tam mükellef bir kurumun sermayesine katılımdan elde edildiğinden md.5/1-a kapsamında
    istisnadır.

    - 2020 zararı: beş yıllık süre 2021–2025 yıllarında dolmuştur; 2026''da indirilemez.

    - 2021 zararı: 2022–2026 döneminin son yılı olan 2026''da indirilebilir: 200.000 TL (md.9/1-a; beyannamede ayrı gösterilmek
    şartıyla).


    **(c) Bağış indirimi (md.10/1-c)**


    Tebliğe göre esas alınacak kurum kazancı = Ticari bilanço kârı − (iştirak kazançları istisnası + geçmiş yıl zararları)
    = 6.000.000 − (800.000 + 200.000) = 5.000.000 TL.

    Sınır: 5.000.000 × %5 = 250.000 TL. Bağışın 250.000 TL''si indirilir; aşan 250.000 TL sonraki yıla devredilemez.


    **(d) Matrah ve vergi**


    | Hesap | TL |

    |---|---|

    | Ticari bilanço kârı | 6.000.000 |

    | + KKEG | 720.000 |

    | − İştirak kazancı istisnası | (800.000) |

    | − Geçmiş yıl zararı (2021) | (200.000) |

    | − Bağış indirimi | (250.000) |

    | **Kurumlar vergisi matrahı** | **5.470.000** |

    | Hesaplanan kurumlar vergisi (%25) | 1.367.500 |

    | − Mahsup edilecek geçici vergi | (1.000.000) |

    | **Ödenecek kurumlar vergisi** | **367.500** |


    Beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın 1–25''i arasında, yani 1–25 Nisan 2027 tarihleri arasında
    verilir (md.14/3); vergi beyannamenin verildiği ayın sonuna kadar, yani 30 Nisan 2027''ye kadar ödenir (md.21/1).

    '
  puanlama:
  - olcut: (a) Vergi cezası ve alkol reklam giderinin %50'sinin KKEG olarak belirlenmesi
    puan: 2
  - olcut: (a) Gider yazılan bağışın kâra eklenmesi
    puan: 1
  - olcut: (a) Finansman gider kısıtlamasının aşan kısım oranıyla hesaplanması (40.000 TL)
    puan: 3
  - olcut: (a) KKEG toplamı (720.000 TL)
    puan: 1
  - olcut: (b) Kâr payının iştirak kazancı istisnası kapsamında indirilmesi
    puan: 2
  - olcut: (b) 2020 zararının süresi dolduğundan indirilememesi
    puan: 2
  - olcut: (b) 2021 zararının 2026'da indirilebilmesi
    puan: 2
  - olcut: (c) Bağış sınırının esas kazancının tebliğe göre tespiti (5.000.000 TL)
    puan: 3
  - olcut: (c) İndirilecek bağış (250.000 TL) ve aşan kısmın devredilemeyeceği
    puan: 2
  - olcut: (d) Matrahın doğru sırayla hesaplanması (5.470.000 TL)
    puan: 3
  - olcut: (d) Hesaplanan (1.367.500 TL) ve ödenecek (367.500 TL) kurumlar vergisi
    puan: 2
  - olcut: (d) Beyan (1–25 Nisan 2027) ve ödeme (30 Nisan 2027) süreleri
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a, 6, 9, 10/1-c, 11, 14, 21, 32
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 10.3.2.1, 11.13
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'fin = 1200000 * (15000000 - 10000000) / 15000000 * 0.10

      kkeg = 80000 + 200000 * 0.5 + 500000 + fin

      istirak = 800000

      zarar = 200000

      bagis_esas = 6000000 - (istirak + zarar)

      bagis = min(500000, bagis_esas * 0.05)

      matrah = 6000000 + kkeg - istirak - zarar - bagis

      kv = matrah * 0.25

      sonuc = {"finansman_kkeg": fin, "kkeg": kkeg, "bagis_indirimi": bagis, "matrah": matrah, "kv": kv, "odenecek": kv -
      1000000}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_GUV-1.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
