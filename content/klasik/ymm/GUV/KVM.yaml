- id: YMM-GUV-KVM-K004
  sinav: ymm
  ders: GUV
  konu: KVM
  kazanimlar:
  - kurumlar vergisi mükellefleri
  - kurum kazancının tespiti
  zorluk: 2
  puan: 25
  sure_dk: 25
  soru: 'Aşağıdaki kuruluşların 2026 yılı durumları verilmiştir. Hesap dönemleri takvim yılıdır; tutarlar kanunen kabul edilmeyen
    giderler eklenmiş ve istisnalar düşülmüş net kazançlardır (aksi belirtilmedikçe).


    1. **(Z) Sesli Komandit Şirketi** (sermayesi paylara bölünmüş komandit şirket): Komandite ortak Bay Z''nin kârdan payı
    %30, komanditer ortakların payı %70''tir. Komandite ortağın kâr payı gider yazılmadan önceki kurum kazancı 4.000.000 TL''dir.

    2. **(AB) İş Ortaklığı:** (A) A.Ş. (%60) ve (B) A.Ş. (%40), bir köprü işini işverene karşı birlikte ve tamamından müteselsilen
    sorumlu olarak üstlenmek için yazılı sözleşmeyle ortaklık kurmuş ve kurumlar vergisi mükellefiyeti tesis edilmesini talep
    etmiştir. 2026 kazancı 3.000.000 TL''dir; vergi sonrası kazancın tamamı 2027''de ortaklara dağıtılacaktır.

    3. **(AB) Tünel Konsorsiyumu:** Aynı iki şirket bir tünel işini, yüklenim sözleşmesinde her birinin yapacağı bölüm ayrı
    ayrı belirlenerek üstlenmiştir. (A)''nın bölümünden 800.000 TL kâr, (B)''nin bölümünden 300.000 TL zarar doğmuştur.

    4. **(D) Derneği''ne ait kafeterya:** Dernek binasında devamlı olarak işletilen, ayrı tüzel kişiliği ve ayrılmış sermayesi
    olmayan kafeteryanın kazancı 400.000 TL''dir. Dernek kamu yararına çalışan dernektir.

    5. **(F) Finansal Kiralama A.Ş.:** 6361 sayılı Kanun kapsamında faaliyet gösteren şirketin kurumlar vergisi matrahı 8.000.000
    TL''dir.

    6. **(Y) Holding Ltd.:** Kuruluş sözleşmesindeki merkezi Malta''dadır; yönetim kurulu toplantıları ve tüm yönetim kararları
    İstanbul''daki ofiste alınmaktadır.

    7. **(M) Belediyesi:** Belediye sınırları içinde otobüs işletmesi ile ilçede bir otel işletmektedir (her ikisi de devamlı
    ve ayrı tüzel kişiliği yoktur). Otel kazancı 600.000 TL''dir.


