  soru: 'Ticaret ve hizmet sektöründe faaliyet gösteren tam mükellef (AB) AŞ''nin 2026 yılına ait aşağıdaki bilgileri verilmiştir:


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı (KV karşılığı ayrılmadan önce) | 3.000.000 |

    | Hesaplanan kurumlar vergisi karşılığı (gider yazılan) | 600.000 |

    | Öz sermaye faizi (gider yazılan) | 150.000 |

    | Sözleşmede ceza şartı olarak konulan tazminat (gider yazılan) | 80.000 |

    | Alkol ürünü reklam gideri (gider yazılan, toplam) | 200.000 |

    | Transfer fiyatlandırması yoluyla örtülü dağıtılan kazanç | 100.000 |

    | Kurumlar vergisinden istisna iştirak kazancı (md. 5/1-a) | 250.000 |


    Şirketin başka gelir unsuru ve indirimi yoktur.


    (a) Her bir gider/kazanç kaleminin KKEG olup olmadığını ilgili madde dayanağıyla açıklayınız. (8 puan)

    (b) 2026 yılı kurumlar vergisi matrahını hesaplayınız. (12 puan)

    '
  cozum: "(a) Kalemlerin KKEG Değerlendirmesi:\n\n1. Hesaplanan KV karşılığı (600.000 TL): KVK md. 11/1-d — KKEG (hesaplanan\
    \ KV ve para cezaları gider yazılamaz).\n2. Öz sermaye faizi (150.000 TL): KVK md. 11/1-a — KKEG.\n3. Sözleşme ceza şartı\
    \ tazminatı (80.000 TL): KVK md. 11/1-g — KKEG değil; gider yazılabilir (ceza şartı tazminatları hariç tutulmuştur).\n\
    4. Alkol reklam gideri toplamı (200.000 TL): KVK md. 11/1-ı — %50'si (100.000 TL) KKEG; kalan %50'si (100.000 TL) indirilebilir.\n\
    5. Transfer fiyatlandırması örtülü kazanç (100.000 TL): KVK md. 11/1-c — KKEG.\n6. İstisna iştirak kazancı (250.000 TL):\
    \ KVK md. 5/1-a — İstisna; matrahtan düşülür.\n\n(b) Kurumlar Vergisi Matrahı:\n\nTicari bilanço kârı:               \
    \                3.000.000 TL\n(+) KKEG:\n   KV karşılığı (md.11/1-d):           600.000\n   Öz sermaye faizi (md.11/1-a):\
    \       150.000\n   Alkol reklam %50 (md.11/1-ı):       100.000\n   Örtülü kazanç (md.11/1-c):          100.000   950.000\
    \ TL\n(-) İstisna (md.5/1-a):                           250.000 TL\n\nKV Matrahı = 3.000.000 + 950.000 − 250.000 = 3.700.000\
    \ TL\n"
  puanlama:
  - olcut: Her kalemin KKEG durumunu ve sözleşme ceza şartı tazminatının KKEG olmadığını ilgili maddeyle açıklar (her doğru
      kalem 1 puan × 8)
    puan: 8
  - olcut: KKEG toplamını 950.000 TL olarak doğru bulur ve istisnayı 250.000 TL olarak düşer
    puan: 4
  - olcut: 3.700.000 TL matrahı adımları göstererek doğru hesaplar
    puan: 8
  kaynaklar:
