  sure_dk: 35
  soru: 'Tam mükellef (Ay) Tekstil A.Ş.''nin tasfiyeye girmesine ilişkin genel kurul kararı 12/3/2025 tarihinde ticaret sicilinde
    tescil edilmiş, tasfiye kararı ise 15/9/2026 tarihinde tescil edilerek tasfiye sona ermiştir. Şirketin hesap dönemi takvim
    yılıdır; tasfiyenin tüm dönemlerinde kurumlar vergisi oranı %25 olarak uygulanacaktır. Tasfiye süresince 5/1 istisnası
    dışında istisna, indirim, zarar mahsubu ve kanunen kabul edilmeyen gider konusu başka kalem bulunmamaktadır.


    **I. tasfiye dönemine ilişkin bilgiler:**


    | Kalem | Tutar (TL) |

    |---|---|

    | Tasfiye dönemi başındaki bilançoda görülen öz sermaye | 6.000.000 |

    | Ortakların dönem içinde mevcut sermayeye ilave olarak yaptıkları ödemeler | 500.000 |

    | Dönem içinde elde edilen ve KVK md. 5/1-(a) uyarınca vergiden istisna edilen iştirak kazancı | 300.000 |

    | Ortaklara dönem içinde avans olarak yapılan ödemeler | 700.000 |

    | 31/12/2025 tarihli bilançoda görülen öz sermaye (yukarıdaki kalemler yansıtılmıştır) | 7.700.000 |


    **II. (son) tasfiye dönemine ilişkin bilgiler:**


    - Varlıklar paraya çevrilmiş, borçlar ödenmiş ve ortaklara hisseleri karşılığında 6.100.000 TL nakit dağıtılmıştır.

    - Ayrıca bir taşınmaz ortaklara aynen dağıtılmıştır; taşınmazın defterlerdeki değeri 800.000 TL, dağıtım günündeki emsal
    bedeli 1.500.000 TL''dir.

    - Dağıtımlardan sonra bilançoda öz sermaye kalmamıştır.


    **İstenenler:**


    (a) Şirketin tasfiye dönemlerini belirtiniz; her tasfiye dönemi için kurumlar vergisi (tasfiye) beyannamesinin verilme
    süresini gösteriniz. (6 puan)


    (b) I. tasfiye dönemi için tasfiye kârını ve bu dönemde hesaplanan kurumlar vergisini bulunuz. (7 puan)


    (c) II. tasfiye dönemi sonucunu bulunuz; taşınmazın dağıtımında hangi değerin esas alınacağını gerekçesiyle açıklayınız
    ve defter değeri esas alınırsa ortaya çıkacak hatalı sonucu da gösteriniz. (6 puan)


    (d) Tasfiyenin nihai sonucuna göre düzeltme yapılıp yapılmayacağını açıklayarak iade edilecek vergiyi hesaplayınız; tasfiyede
    tarh zamanaşımının hangi tarihte başlayacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Tasfiye dönemleri ve beyanname süreleri (KVK md. 17/1, 17/2)**


    Tasfiye, genel kurul kararının tescil edildiği tarihte başlar ve tasfiye kararının tescil edildiği tarihte sona erer.
    Başlangıç tarihinden aynı takvim yılı sonuna kadar olan dönem ile sonraki her takvim yılı ve tasfiyenin bittiği dönem
    bağımsız birer tasfiye dönemidir.


    | Dönem | Tarih aralığı | Beyanname süresi |

    |---|---|---|

    | I. tasfiye dönemi | 12/3/2025 – 31/12/2025 | Dönemin kapandığı ayı izleyen dördüncü ayın 1''i ile 25''i akşamı arası:
    1–25 Nisan 2026 |

    | II. (son) tasfiye dönemi | 1/1/2026 – 15/9/2026 | Tasfiyenin sonuçlandığı tarihten itibaren 30 gün içinde: 15/10/2026''ya
    kadar |


    **(b) I. tasfiye dönemi (md. 17/4, 17/5)**


    Tasfiye kârı = dönem sonu servet değeri − dönem başı servet değeri. Ortaklara yapılan avans ödemeleri dönem sonundaki
    servet değerine; ortakların sermayeye ilave ödemeleri ile tasfiye esnasında elde edilen istisna kazançlar dönem başındaki
    servet değerine eklenir.


    | Kalem | TL |

    |---|---|

    | Dönem sonu öz sermaye | 7.700.000 |

    | + Ortaklara avans ödemeleri | 700.000 |

    | = Düzeltilmiş dönem sonu servet değeri | **8.400.000** |

    | Dönem başı öz sermaye | 6.000.000 |

    | + Ortakların ilave sermaye ödemeleri | 500.000 |

    | + İstisna edilmiş iştirak kazancı | 300.000 |

    | = Düzeltilmiş dönem başı servet değeri | **6.800.000** |

    | **Tasfiye kârı** | **1.600.000** |


    Hesaplanan kurumlar vergisi: 1.600.000 × %25 = **400.000 TL**.


    **(c) II. tasfiye dönemi (md. 17/4-b, 17/5)**


    Önceki dönemin son bilançosunda görülen servet değeri, izleyen dönemin başındaki servet değeridir: **7.700.000 TL**. Ortaklara
    hisseleri karşılığında dağıtılan iktisadî kıymetlerin değeri, KVK md. 13''e göre ve dağıtımın yapıldığı gün itibarıyla
    (emsal bedelle) belirlenir. Dağıtım sonrası öz sermaye sıfır olduğundan dönem sonu servet değeri, ortaklara dağıtılan
    değerlerin toplamıdır:


    - Dönem sonu servet değeri: 6.100.000 + 1.500.000 = **7.600.000 TL**

    - Tasfiye sonucu: 7.600.000 − 7.700.000 = **100.000 TL zarar** (vergi doğmaz).


    Taşınmaz defter değeriyle (800.000 TL) dağıtılmış sayılsaydı dönem sonu servet değeri 6.900.000 TL olacak ve hatalı sonuç
    **800.000 TL zarar** çıkacaktı.


    **(d) Nihai sonuç ve düzeltme (md. 17/1-c, 17/1-ç; Tebliğ 17.1.1, 17.1.2)**


    Son tasfiye döneminin zararla sonuçlanması hâlinde tasfiye sonucu önceki tasfiye dönemlerine doğru düzeltilir ve fazla
    ödenen vergi iade edilir. Nihai sonuç: 1.600.000 − 100.000 = **1.500.000 TL kâr**; nihai vergi 1.500.000 × %25 = **375.000
    TL**. I. dönemde ödenen 400.000 TL ile karşılaştırıldığında iade edilecek vergi: 400.000 − 375.000 = **25.000 TL**.


    Tasfiye bir yıldan fazla sürdüğü (12/3/2025 – 15/9/2026) için tarh zamanaşımı, tasfiyenin sona erdiği dönemi (2026) izleyen
    yıldan, yani **1/1/2027** tarihinden itibaren başlar.


    Dayanak: KVK md. 13, 17/1, 17/2, 17/4, 17/5; 1 Seri No.lu KV Genel Tebliği bölüm 17.1, 17.1.1, 17.1.2, 17.3, 17.4, 17.5.'
