    ticari bilanço kârından düşülür (Tebliğ 32.1.2.9.1):


    Indirimli oran uygulanacak matrah = 9.000.000 × (8.000.000 − 4.000.000) / (16.000.000 − 4.000.000) = 9.000.000 × 1/3 =
