  soru: '(M) A.Ş.''nin 2026 hesap dönemine ilişkin bilgiler şöyledir:

    - Ticari bilanço kârı: 12.000.000 TL (içinde tam mükellef iştirakten 2.000.000 TL kâr payı vardır)

    - Gider yazılan belediyeye bağış: 800.000 TL

    - Gider yazılan amatör spor kulübüne sponsorluk (3289 sayılı Kanun kapsamında): 300.000 TL

    - 20/4/2026''da tescil edilen ve aynı ay ortakların kendi kaynaklarıyla nakden ödenen sermaye artışı: 5.000.000 TL

    - TCMB''nin ilgili faiz oranı: %42; geçmiş yıl zararı yoktur.


    (a) Kurum kazancını hesaplayınız. (5 puan)

    (b) Sponsorluk, bağış ve nakdi sermaye artışı indirimlerini sırasıyla hesaplayınız. (9 puan)

    (c) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini (%25) bulunuz. (6 puan)

    '
  cozum: "**(a)** Bağış ve sponsorluk gider yazıldığından KKEG olarak eklenir; iştirak kazancı istisnası düşülür:\n12.000.000\
    \ + 800.000 + 300.000 − 2.000.000 = **11.100.000 TL**.\n\n**(b)** İndirimler md. 10'daki sırayla yapılır:\n- Sponsorluk\
    \ (md. 10/1-b): amatör spor dalında tamamı = **300.000 TL**.\n- Bağış (md. 10/1-c): sınır, ticari bilanço kârından iştirak\
    \ kazancı düşülerek bulunan tutarın %5'idir:\n  (12.000.000 − 2.000.000) × %5 = 500.000 TL. Bağış 800.000 TL olduğundan\
    \ **500.000 TL** indirilir; aşan 300.000 TL\n  indirilemez ve devretmez.\n- Nakdi sermaye artışı (md. 10/1-ı): Nisan–Aralık\
    \ 9 ay (ödeme ayı tam sayılır):\n  5.000.000 × %42 × 9/12 = 1.575.000 TL; indirim %50'si = **787.500 TL**. Kullanılamayan\
    \ kısım olursa devreder.\n\n**(c)** Matrah: 11.100.000 − 300.000 − 500.000 − 787.500 = **9.512.500 TL**.\nKurumlar vergisi:\
    \ 9.512.500 × %25 = **2.378.125 TL**.\n"
