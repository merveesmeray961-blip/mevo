  dogrulama:
    python: "katki = 40000000*0.40\noran = 0.25*(1 - 0.60)\nkv_yatirim = 20000000*oran\nkv_diger = (6000000 - 2000000)*0.25\n\
      kv = kv_yatirim + kv_diger\nkullanilan = 20000000*(0.25 - oran)\nterkin = min(40000000*0.40*0.10, (katki - kullanilan)/2)\n\
      kalan = katki - kullanilan - 2*terkin\nsonuc = {\"katki\": katki, \"indirimli_oran\": oran, \"kv\": kv, \"kullanilan\"\
      : kullanilan, \"terkin\": terkin,\n         \"kalan\": kalan, \"kalan_2027\": kalan*1.25, \"asgari\": 26000000*0.10}\n"
