  cozum: '**(a) Halka arz indirimi (md. 32/6)**


    Payları Borsa İstanbul Pay Piyasasında ilk defa işlem görmek üzere en az %20 oranında halka arz edilen kurumların kurum
    kazançlarına, ilk defa halka arz edildiği hesap döneminden başlamak üzere beş hesap dönemi (2025–2029) KV oranı 2 puan
    indirimli uygulanır. 2026 bu süre içindedir; uygulanacak oran %25 − 2 = **%23**.


    **(b) Oranlar ve vergi**


