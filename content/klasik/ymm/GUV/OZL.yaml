    | (R) Bankası (ortakla ilişkili banka, nükleer yatırım) | 1.200.000.000 | %25 (geçici md. 20; md. 12/2''deki %50 yerine)
    | 300.000.000 |

    | (K) Bankası | 400.000.000 | Dikkate alınmaz | 0 |

    | **Toplam** | | | **500.000.000** |


    (K) Bankası kredisi, ortağın gayrinakdî teminatı karşılığında üçüncü kişiden yapılan borçlanma olduğundan örtülü sermaye
