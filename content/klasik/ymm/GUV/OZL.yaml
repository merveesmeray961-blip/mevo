  soru: '(N) Enerji A.Ş. tam mükellef bir sermaye şirketidir (hesap dönemi takvim yılı). Şirket, nükleer enerji santralinde
    elektrik enerjisi üretimi faaliyetinde bulunmak için önlisans/lisans almış olup nükleer enerji santrali yatırımını yürütmektedir.
    1/1/2026 tarihli VUK''a göre düzenlenen bilançosunda mevcutlar ve alacaklar toplamı 460.000.000 TL, borçlar toplamı 360.000.000
