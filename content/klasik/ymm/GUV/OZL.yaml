    | KKEG | 300.000 |

    | İndirim ve istisnalar düşülmeden önceki kurum kazancı | 20.000.000 |

    | 4691 sayılı Kanun istisnası | (8.000.000) |

    | 3218 sayılı Kanun istisnası | (4.500.000) |

    | **Matrah** | **7.500.000** |

    | Hesaplanan kurumlar vergisi (%25) | **1.875.000** |


