    | Bay (B) | 50/500 × 200.000.000 | **20.000.000** |

    | (R) Bankası | 300/500 × 200.000.000 | **120.000.000** |

    | Toplam | | 200.000.000 |


    **(c) Faiz reddi ve vergi kesintisi**


    | Borç veren | 3 aylık faiz (TL) | Örtülü sermaye oranı | Kabul edilmeyen faiz (TL) |

    |---|---|---|---|

    | (A) Holding | 150.000.000 × %40 × 3/12 = 15.000.000 | 60/150 = %40 | **6.000.000** |

    | Bay (B) | 50.000.000 × %34 × 3/12 = 4.250.000 | 20/50 = %40 | **1.700.000** |

    | **Toplam KKEG** | | | **7.700.000** |


    Örtülü sermaye üzerinden ödenen faiz, örtülü sermaye şartlarının gerçekleştiği hesap döneminin son günü itibarıyla borç
