- id: YMM-GUV-OZL-K002
  sinav: ymm
  ders: GUV
  konu: OZL
  kazanimlar:
  - indirimli kurumlar vergisi (KVK md.32/A)
  - KVK md.10 indirimleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'İmalat sektöründe faaliyet gösteren tam mükellef (Y) Sanayi A.Ş. (finans veya sigorta kuruluşu değildir; iş ortaklığı
    ve taahhüt işi söz konusu değildir; hesap dönemi takvim yılı; ilk faaliyet yılı 2012) Ekim 2025''te Sanayi ve Teknoloji
    Bakanlığından yatırım teşvik belgesi almıştır. Belgeye ilişkin bilgiler:


    - Fiilen gerçekleştirilen yatırım harcaması: **40.000.000 TL**; yatırıma katkı oranı: **%40**.

    - Yatırım Ocak 2026''da tamamlanmış ve 1/1/2026 itibarıyla tamamen işletilmeye başlanmıştır. Yatırımdan elde edilen kazanç
    ayrı hesaplarda izlenebilmektedir.


    2026 yılı bilgileri:


    - Ticari bilanço kârı **26.000.000 TL**; KKEG, istisna ve geçmiş yıl zararı yoktur.

    - Bu kârın **20.000.000 TL**''si teşvik belgeli yatırımdan, **6.000.000 TL**''si diğer faaliyetlerden elde edilmiştir.

    - Diğer faaliyet kazancının **2.000.000 TL**''si, Türkiye''de yerleşmiş olmayan ve iş yeri, kanuni ve iş merkezi yurt
    dışında bulunan müşterilere Türkiye''de verilen ve münhasıran yurt dışında yararlanılan mühendislik hizmetlerinden elde
    edilmiştir; faturalar yurt dışı müşteriler adına düzenlenmiş, kazancın tamamı Mart 2027''de Türkiye''ye transfer edilmiştir.

    - Şirket md. 32/A/8 uyarınca diğer vergi borçlarından terkin imkânını azami tutarda kullanmak istemektedir.

    - 2026 yılı için VUK''a göre belirlenen yeniden değerleme oranını %25 kabul ediniz.


    Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur.


    **İstenenler:**


    (a) Belgenin tarihine göre uygulanacak indirimli kurumlar vergisi oranını ve süresini açıklayınız; 2026 yılı kurumlar
    vergisi matrahını, md. 10/1-ğ indirimini dikkate alarak hesaplanan kurumlar vergisini ve 2026''da kullanılan yatırıma
    katkı tutarını hesaplayınız. (10 puan)


    (b) Md. 32/A/8 kapsamında diğer vergi borçlarından terkin edilebilecek azami tutarı, vazgeçilmiş sayılacak katkı tutarını
    ve talep süresini belirleyiniz. (7 puan)


    (c) 2026 sonunda kalan yatırıma katkı tutarını ve bunun 2027''de dikkate alınacak tutarını hesaplayınız; yurt içi asgari
    kurumlar vergisi karşılaştırmasını yapınız. (8 puan)

    '
  cozum: '**(a) İndirimli oran ve vergi**


    Belge 7555 sayılı Kanun değişikliğinden (24/7/2025) sonra alındığından md. 32/A''nın yeni hükmü uygulanır: kurumlar vergisi
    oranı, yatırımın kısmen veya tamamen işletilmesine başlanılan dönemden itibaren yatırıma katkı tutarına ulaşıncaya kadar,
    ilk dönem dahil **en fazla on hesap dönemi** (2026–2035) **%60 indirimli** uygulanır. İndirimli oran = %25 × (1 − 0,60)
    = **%10**. Kazanç bulunmasına rağmen yararlanılmayan katkı tutarları sonraki dönemlerde dikkate alınmaz.


    - Yatırıma katkı tutarı: 40.000.000 × %40 = 16.000.000 TL.

    - Md. 10/1-ğ indirimi: Şartlar (yurt dışı müşteri, Türkiye''de verilip münhasıran yurt dışında yararlanılan mühendislik
    hizmeti, fatura yurt dışı müşteri adına, tamamının beyanname tarihine kadar transferi) sağlanmıştır; oran 11257 sayılı
    CBK ile **%100**: 2.000.000 TL.


    | Kalem | Matrah (TL) | Oran | Vergi (TL) |

    |---|---|---|---|

    | Yatırım kazancı | 20.000.000 | %10 | 2.000.000 |

    | Diğer kazanç: 6.000.000 − 2.000.000 (md. 10/1-ğ) | 4.000.000 | %25 | 1.000.000 |

    | **Toplam** | **24.000.000** | | **3.000.000** |


    Kullanılan yatırıma katkı tutarı = 20.000.000 × (%25 − %10) = **3.000.000 TL**.


    **(b) Diğer vergilerden terkin (md. 32/A/8)**


    - Belge bazında fiilen yapılan harcamaya katkı oranı uygulanarak bulunan tutarın %10''u: 40.000.000 × %40 × %10 = **1.600.000
    TL** (toplam sınır).

    - Hak edilen katkıdan indirimli KV ile kullanılan düşüldükten sonra kalanın yarısı: (16.000.000 − 3.000.000) / 2 = 6.500.000
    TL; sınırı aşılmaz.

    - Azami terkin: **1.600.000 TL**; ÖTV ve KDV hariç tahakkuk etmiş diğer vergi borçlarından.

    - Kullanılan tutarın bir katı (1.600.000 TL) yatırıma katkı tutarından **vazgeçilmiş** sayılır; bu tutarlar için indirimli
    oran uygulanmaz.

    - Talep: kurumlar vergisi beyannamesinin verilmesi gereken ayı (Nisan 2027) izleyen ikinci ayın sonuna, yani **30/6/2027**''ye
    kadar.


    **(c) Kalan katkı ve asgari vergi**


    - Kalan katkı = 16.000.000 − 3.000.000 (indirimli KV) − 1.600.000 (terkin) − 1.600.000 (vazgeçilen) = **9.800.000 TL**.

    - Yatırımın tamamlandığı dönemi izleyen yıllarda kalan tutar yeniden değerleme oranında artırılır (md. 32/A/2): 2027''de
    9.800.000 × 1,25 = **12.250.000 TL**.

    - Asgari KV (md. 32/C): İndirim ve istisnalar düşülmeden önceki kurum kazancı 26.000.000 TL; md. 10/1-ğ md. 32/C/2''de
    sayılmadığından düşülmez. Belge md. 32/C''nin yürürlüğünden (2/8/2024) sonra alındığından md. 32/C/3''teki katkı indirimi
    de uygulanmaz. Asgari vergi = 26.000.000 × %10 = **2.600.000 TL**. Md. 32 ve 32/A''ya göre hesaplanan 3.000.000 TL bundan
    az olmadığından ek vergi doğmaz.

    '
  puanlama:
  - olcut: 24/7/2025 sonrası belge için %60 indirim, en fazla on dönem ve kullanılmayan katkının devretmemesi
    puan: 3
  - olcut: İndirimli oranın %10 ve katkı tutarının 16.000.000 TL bulunması
    puan: 1
  - olcut: Md. 10/1-ğ şartları ve %100 oranla 2.000.000 TL indirim
    puan: 2
  - olcut: Hesaplanan KV'nin 3.000.000 TL ve kullanılan katkının 3.000.000 TL bulunması
    puan: 4
  - olcut: Terkin sınırlarının (%10 ve kalanın yarısı) uygulanarak 1.600.000 TL bulunması
    puan: 3
  - olcut: Bir katı tutarın vazgeçilmiş sayılması ve ÖTV/KDV dışı borçlardan terkin
    puan: 2
  - olcut: Talep süresinin 30/6/2027 olması
    puan: 2
  - olcut: Kalan katkının 9.800.000 TL ve 2027 tutarının 12.250.000 TL bulunması
    puan: 4
  - olcut: Asgari KV'nin 2.600.000 TL bulunması (10/1-ğ ve katkı düşülmeden) ve karşılaştırma
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-ğ, 32, 32/A, 32/C
  - mevzuat: 11257 sayılı Cumhurbaşkanı Kararı
    madde: md. 2/2
