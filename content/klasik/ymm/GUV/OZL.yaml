    (1.000.000 TL vergilenir).

    - Stopaj teşviki: Teşvikten yararlanacak destek personeli sayısı Ar-Ge ve tasarım personeli sayısının %10''unu aşamaz;
    %20 oranı yalnız toplam personeli on beşe kadar olan firmalar için uygulanır. Toplam personel 24 olduğundan sınır 20 ×
    %10 = **2 destek personeli**dir; diğer 2 destek personelinin ücretleri teşvikten yararlanamaz.


    **(b) Serbest bölge (3218 sayılı Kanun geçici md. 3)**


    AB''ye tam üyelik yılının sonuna kadar, serbest bölgelerde üretim faaliyetinde bulunan mükelleflerin bu bölgelerde imal
