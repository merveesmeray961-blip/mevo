    uygun olarak kredi vermektedir | 1.200.000.000 | 1/10/2026 | – |

    | (K) Bankası A.Ş. | Şirketle ortaklık veya ilişkisi olmayan banka; (A) Holding''in verdiği gayrinakdî teminat karşılığında
    kullandırılmıştır | 400.000.000 | 1/10/2026 | – |


    Faiz giderleri ilgili döneme ait olarak gider yazılmıştır. (R) Bankası kredisinin faiz giderine ilişkin düzeltme bu vakada
