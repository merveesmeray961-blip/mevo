    |---|---|---|

    | 1 – Yurt dışına yazılım hizmeti | Evet | Yazılım sayılan hizmet; yurt dışında yararlanma, fatura ve transfer şartları
    sağlanmış |

    | 2 – Yurt dışına yönetim danışmanlığı | Hayır | Danışmanlık, aracılık ve asistanlık gibi hizmetler kapsamda değerlendirilemez
    (Tebliğ 10.5.2.2) |

    | 3 – Mal ihracı | Hayır | Hizmet değil; (ğ) kapsamı dışında |

    | 4 – Yurt içi faaliyetler | Hayır | Müşteriler Türkiye''de yerleşik |


    (ğ) indirimi = 4.000.000 × %100 = **4.000.000 TL** (2026 için oran %100).


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 16.000.000 |

    | + KKEG | 1.000.000 |

    | = Kurum kazancı | **17.000.000** |

    | − İştirak kazancı istisnası | 1.000.000 |

    | − Geçmiş yıl zararı | 3.000.000 |

    | − (ğ) indirimi | 4.000.000 |

    | = Kurumlar vergisi matrahı | **9.000.000** |


    **(b) 5 puan indirimli oran (md. 32/7)**


    Hizmet ihracı, yurt dışındaki müşteri için yapılan ve yurt dışında faydalanılan hizmetleri kapsar (Tebliğ 32.1.2.5). İhracat
