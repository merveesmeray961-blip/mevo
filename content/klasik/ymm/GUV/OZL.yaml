    gerekir. Toplam satış bedeli 60.000.000 TL''nin yalnız 30.000.000 TL''si (%50) yurt dışına ihraç edilmiştir; serbest bölgelere
    yapılan satışlar da eklenseydi oran %75 olurdu. Şart sağlanmadığından personel ücretlerine ilişkin gelir vergisi terkin
    edilemez.


    **(c) Matrah ve vergiler**


