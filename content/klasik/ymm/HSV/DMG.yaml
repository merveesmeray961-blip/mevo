- id: YMM-HSV-DMG-K002
  sinav: ymm
  ders: HSV
  konu: DMG
  kazanimlar:
  - damga vergisinin konusu ve kağıt kavramı
  - nispi ve maktu vergi
  - istisnalar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(L) Makine A.Ş.**''nin 2026 yılında taraf olduğu kâğıtlar aşağıdadır. Damga vergisinin tamamı (L) tarafından üstlenilmiştir.
    Hiçbir kâğıtta damga vergisinin azami tutarı aşılmamaktadır.


    2026 yılında uygulanan oran ve tutarlar (488 sayılı Kanuna ekli (1) sayılı tablo): belli parayı içeren mukavelenameler,
    taahhütnameler ile kefalet, teminat ve rehin senetleri binde 9,48; kira mukavelenameleri binde 1,89; maaş, ücret ve benzeri
    ödemelere ait makbuzlar binde 7,59; KDV ve muhtasar beyannameleri (her biri) 791,00 TL.


    | No | Kâğıt |

    |---|---|

    | 1 | Almanya''da (L) ile (X) GmbH arasında imzalanan 500.000 avro bedelli makine alım sözleşmesi. Sözleşme, makinenin
    ithalinde Türkiye''de gümrük idaresine ibraz edilmiştir. Bu soruda Bakanlıkça ilan edilen kur 1 avro = 50 TL kabul edilecektir.
    |

    | 2 | Aynı sözleşmenin altında, satış akdine taraf olmayan (L) ortağı Bay (Y)''nin 100.000 avroya kadar kefaleti yer almaktadır.
    |

    | 3 | Aynı sözleşmede, teslimde gecikme halinde (X)''in ödeyeceği 50.000 avro cezai şart öngörülmüştür. |

    | 4 | (B) Bankası ile imzalanan 10.000.000 TL tutarlı kredi sözleşmesi. |

    | 5 | Yeni bir işçiyle İş Kanununa göre imzalanan belirsiz süreli iş sözleşmesi. |

    | 6 | Sermaye artırımına ilişkin genel kurul kararı ve tescil için düzenlenen kâğıtlar. |

    | 7 | Üretimde kullanılacak bir CNC tezgâhının (sabit istihsal aracı) 3 yıllık kira sözleşmesi; aylık kira 100.000 TL.
    |

    | 8 | Satış ofisi için 2 yıllık işyeri kira sözleşmesi; aylık kira 80.000 TL; 3 nüsha düzenlenmiş ve her nüsha taraflarca
    imzalanmıştır. |

    | 9 | Tedarikçi (T) Ltd.''ye gönderilen, 1.000.000 TL bedelli hammadde alımına ilişkin imzalı teklif mektubu ve (T)''nin
    imzalı kabul mektubu. Ayrıca sözleşme yapılmamıştır. |

    | 10 | Bir işçinin aylık brüt ücreti 60.000 TL olan ücret bordrosu. Ücretlerin GVK md. 23/18 kapsamındaki istisnadan yararlandığı
    ve bu soruda aylık brüt asgari ücretin 30.000 TL olduğu kabul edilecektir. |

    | 11 | Ekim 2026 dönemine ait KDV beyannamesi ve muhtasar ve prim hizmet beyannamesi. |


    **İstenenler**


    (a) 1, 2 ve 3 numaralı kâğıtları kâğıt kavramı, yurt dışında düzenlenen kâğıtlar, birden fazla akit ve müeyyide niteliğindeki
    taahhütler yönünden değerlendiriniz; vergiyi hesaplayınız. **(8 puan)**


    (b) 4, 5, 6 ve 7 numaralı kâğıtların damga vergisi karşısındaki durumunu dayanaklarıyla açıklayınız. **(7 puan)**


    (c) 8, 9, 10 ve 11 numaralı kâğıtların vergisini hesaplayınız; nüsha ve şümul kurallarını açıklayınız. **(6 puan)**


    (d) Toplam damga vergisini bulunuz; mükellefiyet ve sorumluluk kurallarını belirtiniz ve tahakkukun yevmiye kaydını yapınız
    (bu soruda tüm damga vergisi 770 Genel Yönetim Giderleri hesabına yazılacaktır). **(4 puan)**

    '
  cozum: "**(a) 1, 2 ve 3 numaralı kâğıtlar**\n\n- **Kâğıt kavramı:** Yazılıp imzalanarak veya imza yerine geçen işaret konularak\
    \ düzenlenen ve bir hususu ispat veya belli etmek için ibraz edilebilecek belgeler kâğıttır (DVK md. 1).\n- **Yurt dışında\
    \ düzenlenen kâğıt:** Yabancı memlekette düzenlenen kâğıtlar Türkiye'de resmî dairelere ibraz edildiğinde, devir veya\
    \ ciro işlemi yapıldığında ya da hükümlerinden faydalanıldığında vergiye tabi olur (md. 1). Sözleşme gümrük idaresine\
    \ ibraz edildiğinden vergiye tabidir. Yabancı para, Bakanlıkça ilan edilen kurla Türk parasına çevrilir (md. 12).\n  -\
    \ 500.000 × 50 = 25.000.000 TL; 25.000.000 × binde 9,48 = **237.000 TL**.\n- **Kefalet:** Bir kâğıttaki birbirine bağlı\
    \ akitlerde en yüksek vergiyi gerektiren akit üzerinden vergi alınır. Ancak asıl işlemin akitlerinden başka bir şahsın\
    \ eklenen akit ve işlemi ayrıca vergiye tabidir (md. 6/2–3). Bay (Y) satış akdinin tarafı olmadığından kefalet ayrıca\
    \ vergilenir:\n  - 100.000 × 50 = 5.000.000 TL; 5.000.000 × binde 9,48 = **47.400 TL**.\n- **Cezai şart:** Sözleşmenin\
    \ müeyyidesi niteliğindeki taahhütlerden, başlı başına bir sözleşmeye konu olmadıkça damga vergisi alınmaz (md. 6/4).\
    \ **Vergi yoktur**.\n\n**(b) 4, 5, 6 ve 7 numaralı kâğıtlar ((2) sayılı tablo, md. 9)**\n\n| No | Durum | Dayanak |\n\
    |---|---|---|\n| 4 | İstisna | Bankalarca kullandırılacak kredilere, teminatlarına ve geri ödenmelerine ilişkin kâğıtlar\
    \ ((2) sayılı tablo IV-23; kredilerin kullanımları hariç). |\n| 5 | İstisna | Toplu İş Sözleşmesi, Grev ve Lokavt Kanununa\
    \ göre düzenlenen münferit ve kolektif iş sözleşmeleri ile İş Kanunu gereğince işverenin işçiye verdiği taahhütnameler\
    \ ((2) sayılı tablo III-1). |\n| 6 | İstisna | Anonim şirketlerin kuruluşuna, pay devirlerine, sermaye artırımlarına ve\
    \ süre uzatımlarına ilişkin kâğıtlar ((2) sayılı tablo IV-16). |\n| 7 | İstisna | Sabit istihsal araçlarına ait kira mukavelenameleri\
    \ ((2) sayılı tablo IV-8). |\n\n**(c) 8, 9, 10 ve 11 numaralı kâğıtlar**\n\n- **8 – İşyeri kira sözleşmesi:** Matrah,\
    \ sözleşme süresine göre kira bedelidir: 80.000 × 24 = 1.920.000 TL × binde 1,89 = **3.628,80 TL**. Nispi vergiye tabi\
    \ kâğıtların yalnız bir nüshası vergilenir (md. 5). İmza sayısının çokluğu verginin tekerrürünü gerektirmez (md. 7).\n\
    - **9 – Teklif ve kabul mektupları:** Vergiye tabi kâğıtların yerine geçen mektup ve şerhler de vergiye tabidir (md. 2,\
    \ şümul). Mektuplar belli parayı içeren mukavelename yerine geçtiğinden: 1.000.000 × binde 9,48 = **9.480 TL**.\n- **10\
    \ – Ücret bordrosu:** GVK md. 23/18 kapsamındaki ücretlerde istisna aylık brüt asgari ücrete isabet eden kısım için uygulanır\
    \ ((2) sayılı tablo IV-34). Vergiye tabi kısım 60.000 − 30.000 = 30.000 TL; 30.000 × binde 7,59 = **227,70 TL**.\n- **11\
    \ – Beyannameler:** Maktu vergiye tabidir; vergi kâğıdın mahiyetine göre belirlenir (md. 10): 2 × 791,00 = **1.582,00\
    \ TL**.\n\n**(d) Toplam, mükellef ve kayıt**\n\nToplam damga vergisi: 237.000 + 47.400 + 3.628,80 + 9.480 + 227,70 + 1.582\
    \ = **299.318,50 TL**.\n\n- Mükellef kâğıtları imza edenlerdir (md. 3). Birden fazla kişinin imzaladığı kâğıtta imza edenler\
    \ müteselsil sorumludur. Vergisi ödenmemiş kâğıdı resmî daireye ibraz eden, mükellefe rücu hakkı saklı kalmak üzere vergi\
    \ ve cezadan sorumludur (md. 24).\n- Makbuz karşılığı ödemede beyan esasına tabi olanlar kâğıtları ertesi ayın 20'nci\
    \ günü akşamına kadar beyan eder ve 26'ncı günü akşamına kadar öder (md. 22).\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n\
    | 770 Genel Yönetim Giderleri | 299.318,50 | |\n| 360 Ödenecek Vergi ve Fonlar | | 299.318,50 |\n"
