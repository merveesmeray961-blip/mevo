    numaralı sözleşmede hesaplanan harç sınırlar arasında kaldığından aynen alınır; 2 numaralı sözleşmede hesaplanan 1.808.000
    TL üst sınırı aştığı için **661.283,60 TL** alınır.


    **(b) Kira sözleşmesi**


    Kiralarda harca esas değer, mukaveledeki süreye göre kira karşılığının toplamıdır (md. 43/1): 90.000 × 24 = 2.160.000
    TL. Harç: 2.160.000 × binde 1,13 = 2.440,80 TL (beher imza); iki imza için **4.881,60 TL**. Birden fazla nüsha olarak
    düzenlenen muayyen bedeli ihtiva eden kâğıtlarda nispi harca tabi işlemlerden yalnız bir nüsha için harç tahsil edilir
    (md. 38/1); bu nedenle 3 nüshanın ikisi için ayrıca harç alınmaz.


