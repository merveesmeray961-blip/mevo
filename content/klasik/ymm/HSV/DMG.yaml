    | 3 | (V), bir arsa için (R) ile gayrimenkul satış vaadi sözleşmesi yapmış ve sözleşmeyi tapu siciline şerh ettirmiştir.
    Sözleşmede yazılı bedel 3.000.000 TL; arsanın emlak vergisi değeri 5.000.000 TL''dir. |

    | 4 | (V), kiraladığı bir depo için 5 yıl süreli, aylık 100.000 TL kiralı sözleşmesini tapu siciline şerh ettirmiştir.
    |

    | 5 | (V), 10.000.000 TL tutarlı bir ticari kredinin teminatı olarak kendisine ait taşınmaz üzerinde banka lehine ipotek
    tesis etmiştir. |

    | 6 | (V), kendi arsası üzerinde inşa ettiği binanın 4 bağımsız bölümünü adına tescil ettirmiştir. |


    **İstenenler**


    (a) 1 ve 2 numaralı işlemlerde tapu harcının matrahını, harcı ve harç mükelleflerini belirtiniz. **(8 puan)**


    (b) 3 numaralı işlemde harç matrahını belirleyiniz ve harcı hesaplayınız; matrahın sınırlarını açıklayınız. **(5 puan)**


    (c) 4 ve 5 numaralı işlemlerin harcını hesaplayınız; 5 numaralı işlemde harç mükellefini belirtiniz. **(5 puan)**


    (d) 6 numaralı işlemin harcını hesaplayınız; tüm işlemlerin toplam tapu harcını bulunuz. **(4 puan)**

    '
  cozum: '**(a) Devir ve iktisap harçları**


    | İşlem | Matrah | Harç / taraf (TL) | Toplam (TL) |

    |---|---|---|---|

    | 1 | Emlak vergisi değeri 8.000.000 (beyan edilen bedel bundan az) | 8.000.000 × binde 20 = 160.000 | 320.000 |

    | 2 | Kat irtifaklı: devir ve iktisap bedelinin tamamı 5.500.000 | 5.500.000 × binde 20 = 110.000 | 220.000 |


    Gayrimenkul devir ve iktisaplarında harç, emlak vergisi değerinden az olmamak üzere beyan edilen devir ve iktisap bedeli
    üzerinden hesaplanır; kat irtifaklı gayrimenkul devir ve iktisaplarında ise devir ve iktisap bedelinin tamamı esas alınır
    (md. 63). Tarife I-20/a gereği harç **devir eden ve devir alan için ayrı ayrı** alınır; mükellefler satıcı ile alıcıdır
    (alıcı olarak iktisap eden (V) dahil).


    **(b) Satış vaadi şerhi**


    Şerhte matrah, sözleşmede yazılı bedeldir; ancak bu bedel emlak vergisi değerinden az, emlak vergisi değerinin iki katından
    çok olamaz ((4) sayılı tarife I-12). Sözleşme bedeli 3.000.000 TL, emlak vergisi değerinden (5.000.000 TL) az olduğundan
    matrah **5.000.000 TL**''dir. (Üst sınır 10.000.000 TL''dir.) Harç: 5.000.000 × binde 6,83 = **34.150 TL**.


    **(c) Kira şerhi ve ipotek**


    - Kira şerhi (I-10): mukavele müddetine göre kira toplamı: 100.000 × 60 = 6.000.000 TL; 6.000.000 × binde 6,83 = **40.980
    TL**.

