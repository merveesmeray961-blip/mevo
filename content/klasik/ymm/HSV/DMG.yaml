    **(d) Bina tescili ve toplam**


    Bina tescili (I-13/a): her bir bağımsız bölüm için 4.752,40 TL; 4 × 4.752,40 = **19.009,60 TL**.


    Toplam = 320.000 + 220.000 + 34.150 + 40.980 + 22.750 + 19.009,60 = **656.889,60 TL**. Muhtelif işlemler aynı zamanda
    yapılsa bile her işlem ayrı ayrı harca tabidir (md. 64/2).

    '
