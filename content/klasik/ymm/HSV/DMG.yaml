  dogrulama:
    python: 'kira = round(75000 * 24 * 1.89 / 1000, 2)

      protokol = round((3800000 - 3000000) * 9.48 / 1000, 2)

      kredi = 0

      mali_tablo = round(616.30 + 294.20, 2)

      hizmet = round(4000000 * 9.48 / 1000, 2)

      toplam_dv = round(kira + protokol + kredi + mali_tablo + hizmet, 2)

      matrah = max(12000000, 9500000)

      harc_taraf = matrah * 20 / 1000

      sonuc = {''kira'': kira, ''protokol'': protokol, ''mali_tablo'': mali_tablo, ''hizmet'': hizmet, ''toplam_dv'': toplam_dv,
      ''harc_her_taraf'': harc_taraf, ''harc_toplam'': harc_taraf * 2}'
