  soru: '**(X) Lojistik A.Ş.**, Damga Vergisi Kanunu md. 22/1-(a) kapsamında, düzenlediği kâğıtların vergisini aylık beyanname
    ile beyan eden mükelleflerdendir. Şirketin 2026 yılındaki bazı işlemleri aşağıdadır (KDV hiçbir işlemde dikkate alınmayacaktır;
    damga vergisinin azami tutarının aşılmadığı kabul edilecektir):


    | No | Tarih | İşlem |

    |---|---|---|

    | 1 | 1 Mart | (Y) A.Ş.’ye ait depo için 2 yıl süreli kira sözleşmesi imzalanmıştır. Aylık kira 75.000 TL’dir; sözleşme
    iki nüsha düzenlenmiştir. |

    | 2 | 15 Nisan | 2025 yılında (Z) Ltd. Şti. ile imzalanan 3.000.000 TL bedelli taşıma hizmeti sözleşmesine ek protokol
    yapılmış; bedel 3.800.000 TL’ye çıkarılmış, süre ve diğer hükümler değişmemiştir. |

    | 3 | 2 Mayıs | (B) Bankası ile 5.000.000 TL tutarında kredi sözleşmesi imzalanmıştır. |

    | 4 | 20 Mayıs | 2025 yılı bilançosu ve gelir tablosu kredi değerlendirmesi için (B) Bankasına ibraz edilmiştir. |

    | 5 | 5 Haziran | (M) A.Ş. ile 4.000.000 TL bedelli lojistik hizmet sözleşmesi üç nüsha imzalanmıştır; sözleşmede gecikme
    hâlinde 400.000 TL cezai şart öngörülmüştür. |

    | 6 | 10 Haziran | (T) İnşaat A.Ş.’den bir depo binası tapuda satın alınmıştır. Beyan edilen satış bedeli 12.000.000 TL,
    binanın emlak vergisi değeri 9.500.000 TL’dir. Tapuda resmî satış senedi düzenlenmiştir. |


    2026 yılında uygulanan oran ve tutarlar: kira mukavelenameleri binde 1,89; diğer mukavelenameler binde 9,48; bankalara
    ibraz edilen bilançolar 616,30 TL, gelir tabloları 294,20 TL; tapu harcı (ivaz karşılığı devir) binde 20.


    **İstenenler:**


    (a) 1–5 numaralı işlemlerin her biri için damga vergisini gerekçesiyle hesaplayınız ve şirketin ödeyeceği toplam damga
    vergisini bulunuz. **(12 puan)**


    (b) 6 numaralı işlem için tapu harcının matrahını, kimlerden ve ne tutarda alınacağını belirleyiniz; tapuda düzenlenen
    resmî satış senedinin damga vergisi karşısındaki durumunu açıklayınız. **(8 puan)**


    (c) 1 numaralı kira sözleşmesinin damga vergisinin hiç ödenmediği anlaşılırsa, vergi ve cezadan kimlerin, hangi esasla
    sorumlu tutulacağını açıklayınız. **(5 puan)**

    '
  cozum: '**(a) Damga vergisi**


    | No | Kâğıt | Matrah / esas | Oran / tutar | Damga vergisi (TL) |

    |---|---|---|---|---|

    | 1 | Kira sözleşmesi | 75.000 × 24 ay = 1.800.000 TL (süreye göre kira bedeli; tek nüsha) | binde 1,89 | 3.402,00 |

    | 2 | Ek protokol (bedel artışı) | Artan miktar: 800.000 TL | binde 9,48 | 7.584,00 |

    | 3 | Banka kredi sözleşmesi | (2) sayılı tablo IV/23 istisnası | — | 0,00 |

    | 4 | Bilanço + gelir tablosu (bankaya ibraz) | Maktu | 616,30 + 294,20 | 910,50 |

    | 5 | Hizmet sözleşmesi | 4.000.000 TL (cezai şart hariç; tek nüsha) | binde 9,48 | 37.920,00 |

    | | **Toplam** | | | **49.816,50** |


    Gerekçeler:

    - (1) Kira mukavelenamelerinde vergi, mukavele süresine göre kira bedeli üzerinden alınır ((1) sayılı tablo I/A-2). Nispi
    vergiye tabi kâğıtların yalnız bir nüshası vergilendirilir (DVK md. 5).

    - (2) Belli parayı ihtiva eden mukavelenamelerin değiştirilmesi hâlinde yalnız artan miktar aynı nispette vergiye tabidir
    (DVK md. 14/2): 3.800.000 − 3.000.000 = 800.000 TL.

    - (3) Bankalarca kullandırılacak kredilere ilişkin kâğıtlar (kredilerin kullanımları hariç) (2) sayılı tablo IV/23 uyarınca
    istisnadır.

    - (4) Resmî dairelere ve bankalara ibraz edilen bilanço ve gelir tabloları maktu vergiye tabidir ((1) sayılı tablo III/2-b).

    - (5) Cezai şart sözleşmenin müeyyidesi niteliğinde olup başlı başına bir sözleşmeye konu olmadığından vergilendirilmez
    (DVK md. 6/4); nispi vergide üç nüshadan yalnız biri vergilendirilir.


    **(b) Tapu harcı ve resmî senet**


    - Matrah: Tapu harcı, emlak vergisi değerinden az olmamak üzere beyan edilen devir bedeli üzerinden hesaplanır (Harçlar
    K. md. 63/2; (4) sayılı tarife I/20-a). Beyan edilen 12.000.000 TL, emlak vergisi değerinden (9.500.000 TL) yüksek olduğundan
    matrah 12.000.000 TL’dir.

    - Harç devir eden ve devir alan için ayrı ayrı alınır: (T) İnşaat A.Ş. (devreden) 12.000.000 × binde 20 = 240.000 TL;
    (X) Lojistik A.Ş. (devralan) 240.000 TL; toplam 480.000 TL.

    - Gayrimenkullerin ferağ ve intikal zabıtları (2) sayılı tablo IV/7 uyarınca damga vergisinden istisnadır; tapuda düzenlenen
    resmî satış senedi için damga vergisi alınmaz.


    **(c) Sorumluluk**


    - Birden fazla kişi tarafından imzalanan kâğıtlarda vergi ve cezanın tamamından imza edenler, yani (X) Lojistik A.Ş. ile
    (Y) A.Ş., müteselsilen sorumludur (DVK md. 24/2).

    - (X) Lojistik A.Ş., md. 22/1-(a) kapsamında olduğundan taraf olduğu işlemlere ilişkin kâğıtların vergisinin beyan ve
    ödenmesinden sorumludur; vergi, ceza ve ferileri bu şirketten alınır, şirketin vergi için diğer işlem tarafı (Y) A.Ş.’ye
    rücu hakkı vardır (DVK md. 24/3).

    - Ayrıca kâğıdı bir yere ibraz edenler de mükelleflere rücu hakkı saklı kalmak üzere vergi ve cezadan sorumludur (DVK
    md. 24/1).

    '
