  - olcut: Operatör değişikliklerini düşerek maktu ÖİV 210.000 TL ve toplam 1.410.000 TL
    puan: 3
  - olcut: ÖİV beyan süresi (15 Eylül 2026)
    puan: 1
  - olcut: 770'e kaydedilen ÖİV'nin KKEG olarak matraha eklenmesi
    puan: 3
  - olcut: Konsolide grup hasılatına göre muafiyetin bulunmadığı ve iş yerinin olmamasının etkisizliği
    puan: 3
  - olcut: DHV 1.500.000 TL
    puan: 2
  - olcut: Beyan süresi 30 Eylül 2026 ve DHV'nin gider yazılabilmesi
    puan: 3
