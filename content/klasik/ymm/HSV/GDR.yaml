  soru: 'Mart 2026 dönemine ilişkin bilgiler aşağıdadır. Bu soruda BSMV oranı, kambiyo dışındaki banka ve banker muameleleri
    ile sigorta muameleleri için **%5** kabul edilecektir.


    **(R) Bankası A.Ş.** (merkezi Türkiye''de):


    | No | Muamele | Bankanın lehine alınan tutar |

    |---|---|---|

    | 1 | Ticari kredilerden faiz | 10.000.000 TL |

    | 2 | Sanayi sicil belgeli (S) Sanayi A.Ş.''ye, münhasıran imalat sanayiinde kullanılacak makine ve teçhizatın finansmanı
    için kullandırılan krediden faiz | 2.000.000 TL |

    | 3 | Aynı şirkete kullandırılan işletme kredisinden faiz | 1.000.000 TL |

    | 4 | Bankanın kendi şubeleri arasındaki muamelelerden tahakkuk eden faiz | 300.000 TL |

    | 5 | Müşteriler adına ekspertiz firmalarına yaptırılıp aynen ödenen ekspertiz ücretleri | 400.000 TL |

    | 6 | Kambiyo mevzuatı uyarınca TCMB''ye yapılan zorunlu döviz devirleri | 50.000.000 TL |


    **(T) Sigorta A.Ş.:**


    | Sigorta türü | Poliçelerdeki prim |

    |---|---|

    | Kasko (acentelere ödenen komisyon 600.000 TL) | 6.000.000 TL |

    | Hayat sigortası | 3.000.000 TL |

    | İhracata ait nakliyat sigortası | 500.000 TL |

    | Biçilmemiş tarım ürünleri için zirai sigorta | 200.000 TL |


    **Diğer:**

    - (G) Kuyumculuk Ltd. münhasıran altın alım satımıyla uğraşmaktadır.

    - (H) Finans Ltd., 90 sayılı KHK''ye göre ikraz işleriyle uğraşmaktadır; Mart''ta borç verdiği paralardan 400.000 TL faiz
    almıştır.

    - (N) Noterliği, Mart''ta düzenlediği beş vekâletnamede noter kâğıdı yerine adi kâğıt kullanmıştır. 2026 yılında vekâletname
    değerli kâğıt bedeli 298,00 TL''dir.


    **İstenenler**


    (a) (R) Bankasının Mart 2026 BSMV matrahını ve vergisini muamele bazında gerekçesiyle belirleyiniz. **(8 puan)**


    (b) (T) Sigortanın BSMV matrahını ve vergisini bulunuz; verginin mükellefini, beyan yerini ve süresini belirtiniz. **(7
    puan)**


    (c) (G) ve (H)''nin BSMV karşısındaki durumunu "banker" kavramıyla açıklayınız; varsa vergiyi hesaplayınız. **(5 puan)**


    (d) (N) Noterliğinin durumunu Değerli Kâğıtlar Kanununa göre değerlendiriniz; tahsil edilecek bedeli ve kesilecek cezayı
    hesaplayınız. **(5 puan)**

    '
  cozum: '**(a) (R) Bankası**


    Banka ve sigorta şirketlerinin, finansal kiralama işlemleri hariç, yaptıkları bütün muameleler dolayısıyla kendi lehlerine
    nakden veya hesaben aldıkları paralar BSMV''ye tabidir (6802 sayılı Kanun md. 28).


    | No | Durum | Matrah | BSMV |

    |---|---|---|---|

    | 1 | Tabi | 10.000.000 | 500.000 |

    | 2 | İstisna: sanayi sicil belgeli işletmenin münhasıran imalatta kullanacağı makine ve teçhizat finansmanı kredisi (md.
    29/z) | — | — |

    | 3 | Tabi: işletme kredisi md. 29/z kapsamında değildir | 1.000.000 | 50.000 |

    | 4 | İstisna: merkezi Türkiye''de bulunan bankanın şubeleri arasındaki muameleler (md. 29/a) | — | — |

    | 5 | İstisna: müşteri adına başkalarına yaptırılıp aynen ödenen hizmet bedelleri (md. 29/d) | — | — |

    | 6 | İstisna: TCMB''ye zorunlu döviz ve efektif devirleri (md. 29/o) | — | — |

    | Toplam | | **11.000.000** | **550.000** |


    Matrahtan gider ve vergi adı altında indirim yapılamaz; BSMV kendi matrahına dahil edilmez (md. 31). BSMV kapsamındaki
    işlemler KDV''den istisnadır (KDVK md. 17/4-e).


    **(b) (T) Sigorta**


    - Sigorta işlemlerinde matrah poliçedeki prim tutarıdır. Aracılara ödenen komisyonlar indirilemez (md. 31): kasko matrahı
    **6.000.000 TL**.

    - Hayat sigortası ve ihracata ait nakliyat sigortası (md. 29/i) ile zirai sigortalar (md. 29/k) istisnadır.

    - BSMV: 6.000.000 × %5 = **300.000 TL**.

    - Mükellef sigorta şirketidir. Aracılar vasıtasıyla yapılan sigortada da mükellef sigorta şirketidir (md. 30).

    - Bir aylık muameleler ertesi ayın 15''inci günü akşamına kadar (**15 Nisan 2026**) şirket merkezinin bağlı olduğu vergi
    dairesine beyan edilip aynı sürede ödenir (md. 47–48).


    **(c) Banker kavramı**


    Kendi veya başkası hesabına menkul kıymet alıp satmayı veya buna aracılığı meslek haline getirenler, faiz vermek üzere
    devamlı para toplayanlar, 90 sayılı KHK''ye göre ikraz işleriyle uğraşanlar ve bu muamelelerden birini esas iştigal konusu
    yapanlar banker sayılır (md. 28/2–3).


    - **(G):** Münhasıran altın alım satımıyla uğraşmak banker sayılmayı gerektirmez; **BSMV mükellefi değildir**.

    - **(H):** İkraz işleriyle uğraştığından **banker sayılır**. Lehine aldığı faiz BSMV''ye tabidir: 400.000 × %5 = **20.000
    TL**.


    **(d) (N) Noterliği**


    Değerli kâğıtların ilgili işlemlerde kullanılması zorunludur (210 sayılı Kanun md. 2). Noter kâğıtları yerine adi kâğıt
    kullanılırsa bu evraka ait değerli kâğıt bedeli noterce tahsil edilir. Bu yükümlülüğe uymayan noterden tahsil edilecek
    bedelin üç katı tutarında ceza alınır (md. 5).


    - Tahsil edilecek bedel: 5 × 298,00 = **1.490,00 TL**.

    - Ceza: 1.490,00 × 3 = **4.470,00 TL**.

    '
