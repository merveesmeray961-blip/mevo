- id: YMM-HSV-GDR-K001
  sinav: ymm
  ders: HSV
  konu: GDR
  kazanimlar:
  - banka ve sigorta muameleleri vergisi
  - özel iletişim vergisi
  - dijital hizmet vergisi
  - değerli kağıtlar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ağustos 2026 dönemine ilişkin bilgiler aşağıdadır (tutarlar KDV hariçtir; KDV oranı %20''dir):


    **(R) Bankası A.Ş.** (merkezi Türkiye''de):

    - Müşterilerden 90.000.000 TL karşılığı döviz satın almış, müşterilere 60.000.000 TL karşılığı döviz satmıştır. Kambiyo
    muamelelerinde Kanun''daki oran uygulanacaktır.

    - Özel sektör müşterilerine 2.000 adet çek yaprağı satmıştır (2026 yılı değerli kâğıt bedeli yaprak başına 95 TL).


    **(M) Mobil A.Ş.** (yetkilendirilmiş mobil işletmeci):

    - Mobil haberleşme hizmetlerinin KDV matrahı 12.000.000 TL''dir (ÖİV oranı %10).

    - 400 yeni mobil telefon aboneliği tesis etmiştir; bunların 100''ü operatör değiştirerek gelen abonelerdir (2026 maktu
    ÖİV 700 TL).

    - Şirket, Temmuz 2026 dönemine ait olup Ağustos''ta ödediği ÖİV''yi 770 Genel Yönetim Giderleri hesabına kaydetmiştir.


    **(P) Platform Inc.** (Türkiye''de iş yeri yok; 2025 hesap döneminde konsolide grubunun Türkiye hasılatı 900 milyon TL,
    dünya hasılatı 5 milyar avrodur):

    - Türkiye''deki kullanıcılara dijital içerik satışından 30.000.000 TL hasılat elde etmiştir (2026 DHV oranı %5).


    **İstenenler:**


    (a) (R) Bankası''nın Ağustos 2026 kambiyo muameleleri için BSMV''yi hesaplayınız; çek yaprakları için mal sandığına ödenecek
    değerli kâğıt bedelini ve son ödeme gününü belirtiniz; bu bedelin BSMV matrahına girip girmeyeceğini gerekçesiyle açıklayınız.
    (8 puan)


    (b) (M) Mobil A.Ş.''nin Ağustos 2026 ÖİV''sini (oransal ve maktu) hesaplayınız, beyan süresini belirtiniz ve 770 hesabına
    kaydedilen ÖİV''nin kurumlar vergisi bakımından durumunu açıklayınız. (9 puan)


    (c) (P) Platform Inc.''nin mükellefiyetini değerlendirerek Ağustos 2026 DHV''sini hesaplayınız; beyan süresini ve verginin
    kurumlar vergisi karşısındaki durumunu belirtiniz. (8 puan)

    '
  cozum: '**(a) BSMV ve değerli kâğıt bedeli**

    - Kambiyo alım satımında matrah kambiyo satış tutarıdır (6802 md. 31/2): 60.000.000 TL. Oran binde ikidir (md. 33/1).

    - BSMV = 60.000.000 × 2/1000 = **120.000 TL**; ertesi ayın 15''i akşamına (15 Eylül 2026) kadar muamelenin yapıldığı yer
    vergi dairesine beyan edilip ödenir (md. 47, 48).

    - Değerli kâğıt bedeli = 2.000 × 95 = **190.000 TL**; her ayın yedinci günü akşamına kadar, yani **7 Eylül 2026**''ya
    kadar mal sandığına ödenir (210 sayılı Kanun md. 3).

    - Bu bedel bankanın kendi lehine kalan bir para değildir, mal sandığına aktarılır; md. 28''deki "kendi lehine alınan para"
    ölçütünü karşılamadığından BSMV matrahına girmez. (Bankanın çek için ayrıca aldığı ücret olsaydı o ücret vergiye tabi
    olurdu.)


    **(b) ÖİV**

    - Oransal ÖİV = 12.000.000 × %10 = **1.200.000 TL** (matrah KDV matrahını oluşturan unsurlardır; ÖİV KDV matrahına girmez).

    - Maktu ÖİV: operatör değişiklikleri hariç tutulur → 400 − 100 = 300 × 700 = **210.000 TL**.

    - Toplam ÖİV = **1.410.000 TL**; izleyen ayın 15''i akşamına (15 Eylül 2026) kadar beyan edilip ödenir (md. 39).

    - ÖİV, gelir ve kurumlar vergisi uygulamasında gider kaydedilemez ve hiçbir vergiden mahsup edilemez (md. 39). 770 hesabına
    kaydedilen tutar kurumlar vergisi beyannamesinde **kanunen kabul edilmeyen gider** olarak matraha eklenir.


    **(c) DHV**

    - Mükellefiyet: muafiyet hadleri önceki hesap dönemine ve konsolide grubun toplam hasılatına göre uygulanır (7194 md.
    4/1). Grup hasılatı 20 milyon TL ve 750 milyon avroyu aştığından muafiyet yoktur. Türkiye''de iş yerinin bulunmaması mükellefiyeti
    etkilemez (md. 3/1).

    - DHV = 30.000.000 × %5 = **1.500.000 TL** (matrahtan gider, maliyet indirilmez; md. 5).

    - Beyanname izleyen ayın sonuna kadar, yani **30 Eylül 2026**''ya kadar verilir ve aynı sürede ödenir (md. 6/3, 6/6).

    - Ödenen DHV, gelir ve kurumlar vergisine esas safi kazancın tespitinde **gider olarak indirilebilir** (md. 6/7); bu yönüyle
    gider yazılamayan ÖİV''den ayrılır.

    '
  puanlama:
  - olcut: Kambiyo BSMV matrahının satış tutarı olduğunu belirtip 120.000 TL'yi bulmak
    puan: 3
  - olcut: Değerli kâğıt bedeli 190.000 TL ve 7 Eylül 2026 son ödeme günü
    puan: 3
  - olcut: Değerli kâğıt bedelinin banka lehine kalmadığı için BSMV matrahına girmediği gerekçesi
    puan: 2
  - olcut: Oransal ÖİV 1.200.000 TL
    puan: 2
  - olcut: Operatör değişikliklerini düşerek maktu ÖİV 210.000 TL ve toplam 1.410.000 TL
    puan: 3
  - olcut: ÖİV beyan süresi (15 Eylül 2026)
    puan: 1
  - olcut: 770'e kaydedilen ÖİV'nin KKEG olarak matraha eklenmesi
    puan: 3
  - olcut: Konsolide grup hasılatına göre muafiyetin bulunmadığı ve iş yerinin olmamasının etkisizliği
    puan: 3
  - olcut: DHV 1.500.000 TL
    puan: 2
  - olcut: Beyan süresi 30 Eylül 2026 ve DHV'nin gider yazılabilmesi
    puan: 3
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 28, 31, 33, 39, 47, 48
  - mevzuat: 210 sayılı Değerli Kağıtlar Kanunu
    madde: md. 3 ve tablo
  - mevzuat: 7194 sayılı Dijital Hizmet Vergisi Kanunu
    madde: md. 3, 4, 5, 6
