  soru: '**I. Konaklama vergisi.** **(O) Otel A.Ş.** KDV mükellefidir. Temmuz 2026''da elde ettiği hasılat aşağıdadır (tutarlar
    KDV hariçtir). Bu soruda konaklama vergisi oranı, 6802 sayılı Kanun md. 34''teki kanuni oran olan **%2** kabul edilecektir.


    | No | Hizmet | Tutar |

    |---|---|---|

    | 1 | Oda geceleme bedelleri (havuz ve spa kullanımı paket fiyata dahil) | 5.000.000 TL |

    | 2 | Konaklayanlara geceleme hizmetiyle birlikte paket olarak satılan yarım pansiyon yeme-içme | 1.500.000 TL |

    | 3 | Otelde konaklamayan dışarıdan gelen müşterilere restoran satışları | 800.000 TL |

    | 4 | Yurt dışındaki tur operatörü aracılığıyla gelen yabancı turistlere geceleme | 2.000.000 TL |

    | 5 | Karşılıklılık şartı bulunan (X) Devleti büyükelçiliğinin diplomatik haklara sahip mensuplarına geceleme | 200.000
    TL |

    | 6 | Toplantı salonunun konaklama yapmayan bir şirkete günlük kiralanması | 300.000 TL |


    **II. Dijital hizmet vergisi.** Türkiye''de iş yeri bulunmayan **(P) Inc.**, Türkiye''deki kullanıcılara dijital içerik
    satmaktadır; konsolide bir grubun üyesi değildir. 2025 hesap döneminde Türkiye''de bu hizmetlerden elde ettiği hasılat
    15 milyon TL, dünya genelindeki hasılatı 900 milyon avrodur. 2026''da kümülatif hasılatı:


    | Tarih | Türkiye hasılatı (kümülatif) | Dünya hasılatı (kümülatif) |

    |---|---|---|

    | 31 Mart 2026 | 12 milyon TL | 600 milyon avro |

    | 30 Haziran 2026 | 25 milyon TL | 900 milyon avro |


    (P)''nin Ekim 2026''da Türkiye''de sunduğu hizmetlerden elde ettiği hasılat 6.000.000 TL''dir. 2026 yılı DHV oranı, 10767
    sayılı Cumhurbaşkanı Kararıyla %5''tir.


    **İstenenler**


    (a) Otelin her hasılat kaleminin konaklama vergisi karşısındaki durumunu gerekçesiyle belirleyiniz. **(8 puan)**


    (b) Temmuz 2026 konaklama vergisi matrahını ve vergisini hesaplayınız. Verginin beyan ve ödeme süresini, vergi dairesini,
    faturada gösterilmesini ve KDV matrahıyla ilişkisini açıklayınız. **(6 puan)**


    (c) (P)''nin 2026 başındaki muafiyet durumunu ve DHV mükellefiyetinin hangi vergilendirme döneminden başlayacağını gerekçesiyle
    açıklayınız. **(6 puan)**


    (d) (P)''nin Ekim 2026 DHV''sini hesaplayınız; beyan ve ödeme süresini, verginin faturada gösterilip gösterilmeyeceğini
    ve gelir/kurumlar vergisi karşısındaki durumunu belirtiniz. Muafiyetin yeniden başlama koşulunu açıklayınız. **(5 puan)**

    '
  cozum: "**(a) Konaklama vergisinin kapsamı (6802 sayılı Kanun md. 34)**\n\nKonaklama tesislerinde verilen geceleme hizmeti\
    \ ile bu hizmetle birlikte satılarak tesis bünyesinde sunulan yeme, içme, aktivite, eğlence, havuz, spor, termal alan\
    \ kullanımı gibi diğer hizmetler vergiye tabidir.\n\n| No | Durum | Gerekçe |\n|---|---|---|\n| 1 | Tabi | Geceleme hizmeti;\
    \ pakete dahil havuz ve spa kullanımı geceleme ile birlikte sunulan hizmettir. |\n| 2 | Tabi | Geceleme ile birlikte satılan\
    \ yeme-içme hizmetidir. |\n| 3 | Tabi değil | Geceleme hizmetiyle birlikte satılmamıştır. |\n| 4 | Tabi | Konaklama vergisinde\
    \ ihracat istisnası yoktur; hizmet Türkiye'deki tesiste sunulmaktadır. |\n| 5 | İstisna | Karşılıklı olmak kaydıyla yabancı\
    \ devletlerin diplomatik temsilcilikleri ve diplomatik haklara sahip mensuplarına verilen hizmetler istisnadır. |\n| 6\
    \ | Tabi değil | Geceleme hizmeti değildir ve geceleme ile birlikte satılmamıştır. |\n\n**(b) Temmuz 2026 vergisi**\n\n\
    - Matrah, hizmet karşılığında alınan veya borçlanılan bedelin KDV hariç tutarıdır: 5.000.000 + 1.500.000 + 2.000.000 =\
    \ **8.500.000 TL**.\n- Vergi: 8.500.000 × %2 = **170.000 TL**.\n- Vergilendirme dönemi aylıktır. Vergi, izleyen ayın 26'ncı\
    \ günü akşamına kadar (**26 Ağustos 2026**) KDV yönünden bağlı olunan vergi dairesine beyan edilip aynı sürede ödenir.\
    \ KDV mükellefi olmayanlar tesisin bulunduğu yer vergi dairesine beyan eder.\n- Vergi, fatura ve benzeri belgelerde ayrıca\
    \ gösterilir. Bu vergiden herhangi bir ad altında indirim yapılamaz ve vergi **KDV matrahına dahil edilmez**.\n\n**(c)\
    \ DHV muafiyeti ve mükellefiyetin başlaması (7194 sayılı Kanun md. 4)**\n\n- Önceki hesap döneminde Türkiye hasılatı 20\
    \ milyon TL'den **veya** dünya hasılatı 750 milyon avrodan az olanlar muaftır. (P)'nin 2025 Türkiye hasılatı 15 milyon\
    \ TL olduğundan, dünya hasılatı 750 milyon avroyu aşsa da 2026 başında **muaftır**.\n- İlgili hesap dönemi içinde hadlerin\
    \ **her ikisi** aşılırsa muafiyet sona erer. Aşımın tespitinde hesap döneminin üçer aylık dönemlerinin sonu itibarıyla\
    \ kümülatif hasılat dikkate alınır.\n  - 31 Mart: Türkiye hasılatı 12 milyon TL ve dünya hasılatı 600 milyon avro; iki\
    \ had de aşılmamıştır.\n  - 30 Haziran: 25 milyon TL > 20 milyon TL ve 900 milyon avro > 750 milyon avro; iki had birlikte\
    \ aşılmıştır.\n- Mükellefiyet, haddin aşıldığı vergilendirme dönemini (Haziran 2026) takip eden **dördüncü vergilendirme\
    \ döneminden** itibaren başlar: Temmuz, Ağustos, Eylül, **Ekim 2026**.\n\n**(d) Ekim 2026 DHV**\n\n- Matrah hasılattır;\
    \ gider, maliyet ve vergi indirilmez (md. 5). DHV: 6.000.000 × %5 = **300.000 TL**.\n- Vergilendirme dönemi aylıktır.\
    \ Beyanname izleyen ayın sonuna kadar (**30 Kasım 2026**) verilir ve vergi aynı sürede ödenir (md. 6). Türkiye'de iş yeri\
    \ bulunmaması mükellefiyeti etkilemez; Bakanlık işleme taraf olanları ve ödemeye aracılık edenleri verginin ödenmesinden\
    \ sorumlu tutabilir.\n- DHV faturada gösterilmez. Ödenen vergi gelir ve kurumlar vergisi matrahının tespitinde **gider\
    \ olarak indirilebilir** (md. 6/7).\n- Arka arkaya iki hesap dönemi boyunca hadlerden herhangi birinin altında kalanların\
    \ muafiyeti izleyen hesap döneminden itibaren yeniden başlar (md. 4/3).\n"
