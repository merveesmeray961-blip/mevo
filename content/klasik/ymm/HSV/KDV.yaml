  soru: 'İzmir''deki bir arsa yarı yarıya iki kişiye aittir:

    - **(D) Tekstil A.Ş.:** Arsa payı işletmesinin aktifinde kayıtlıdır; arsa payının defter değeri 2.000.000 TL''dir.

    - **Bay (A):** Arsa payı kişisel mülküdür. KDV mükellefiyeti yoktur ve arsa alım satımını mutat ve sürekli bir faaliyet
    olarak yapmamaktadır.


    Arsa sahipleri, müteahhit **(B) İnşaat A.Ş.** ile arsa payı karşılığı inşaat sözleşmesi imzalamıştır. Sözleşmeye göre
    (D)''ye 4, Bay (A)''ya 4 işyeri bırakılacaktır. İnşaat tamamlanmış ve işyerleri **15 Haziran 2026**''da arsa sahiplerine
    teslim edilmiştir.


    - (B)''nin VUK md. 267/2''deki ikinci sıra maliyet bedeli esasına göre, arsa payı hariç ve genel idare giderleri ile genel
    giderlerden düşen pay dahil olmak üzere her bir işyerinin maliyeti 1.500.000 TL''dir.

    - İşyerleri %20 oranında KDV''ye tabidir.

    - (D), aldığı işyerlerini kendi faaliyetinde kullanacaktır.


    **İstenenler**


    (a) Arsa sahiplerinin müteahhide yaptığı arsa payı teslimlerinin KDV karşısındaki durumunu açıklayınız. (D)''nin teslimi
    için matrahı ve KDV''yi hesaplayınız. Bay (A) arsa alım satımını mutat ve sürekli yapsaydı sonucun ne olacağını belirtiniz.
    **(7 puan)**


    (b) (B)''nin arsa sahiplerine yaptığı işyeri teslimlerinin matrahını ve KDV''sini arsa sahibi bazında hesaplayınız; maliyet
    bedeline yapılan ilavenin farkını açıklayınız. **(8 puan)**


    (c) Her iki teslim için vergiyi doğuran olayın tarihini ve beyan dönemini belirtiniz. **(4 puan)**


    (d) (D)''nin bu trampaya ilişkin yevmiye kaydını yapınız. **(6 puan)**

    '
  cozum: 'Arsa karşılığı inşaatta iki ayrı teslim vardır: arsa sahibinin müteahhide arsa payı teslimi ve müteahhidin arsa
    sahibine konut veya işyeri teslimi (KDVGUT I/B-8).


    **(a) Arsa payı teslimleri (KDVGUT I/B-8.1)**


    - Arsanın bir iktisadi işletmeye dahil olması veya arsa sahibinin arsa alım satımını mutat ve sürekli faaliyet olarak
    sürdürmesi halinde arsa payı teslimi KDV''ye tabidir. Arızi teslimde vergi uygulanmaz.

    - **(D):** Arsa payı iktisadi işletmeye dahildir; teslim vergiye tabidir. Matrah, karşılığında alınan işyerlerinin müteahhit
    tarafından maliyet bedeline %5 eklenerek bulunan bedelidir (GUT örneği): 4 × 1.500.000 × 1,05 = **6.300.000 TL**. KDV:
    6.300.000 × %20 = **1.260.000 TL**.

    - **Bay (A):** Arızi nitelikte, ticari faaliyet dışındaki arsa payı teslimi KDV''nin konusuna girmez (KDVK md. 1/1); **KDV
    hesaplanmaz**.

    - Bay (A) arsa alım satımını mutat ve sürekli yapsaydı teslimi vergiye tabi olurdu. Matrah, kendisine bırakılan işyerlerinin
    perakende ilaveli bedeli olurdu: 6.600.000 TL; KDV 1.320.000 TL.


    **(b) Müteahhidin işyeri teslimleri (KDVK md. 27/6; KDVGUT I/B-8.2)**


    Müteahhidin arsa sahibine bıraktığı konut veya işyerinin matrahı, VUK md. 267/2''deki ikinci sıra maliyet bedeli esasına
    göre bulunur. Maliyete toptan satışlarda %5, perakende satışlarda %10 eklenir. Genel idare giderleri ve genel giderlerden
    düşen pay maliyete dahildir (md. 27/4). Arsa sahibine kalan bölümlerin arsa payı devredilmediğinden maliyette arsa payı
    dikkate alınmaz.


    | Arsa sahibi | Maliyet | İlave | Matrah | KDV (%20) |

    |---|---|---|---|---|

    | (D) A.Ş. (tacir; toptan) | 6.000.000 | %5 | 6.300.000 | 1.260.000 |

    | Bay (A) (nihai tüketici; perakende) | 6.000.000 | %10 | 6.600.000 | 1.320.000 |

    | **Toplam** | | | **12.900.000** | **2.580.000** |


    **(c) Vergiyi doğuran olay ve beyan**


    - Mal tesliminde vergiyi doğuran olay malın teslimidir (KDVK md. 10/a). Müteahhidin işyeri teslimleri bağımsız bölümlerin
    arsa sahiplerine teslim edildiği **15 Haziran 2026**''da gerçekleşir.

    - (D)''nin arsa payı teslimine ilişkin KDV de bağımsız bölümlerin arsa sahibine teslim edildiği tarihte hesaplanır (KDVGUT
    I/B-8, Örnek 1).

    - Her iki taraf KDV''yi **Haziran 2026** dönemi beyannamesiyle beyan eder.


    **(d) (D)''nin yevmiye kaydı**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 252 Binalar | 6.300.000 | |

    | 191 İndirilecek KDV (müteahhidin faturası) | 1.260.000 | |

    | 250 Arazi ve Arsalar | | 2.000.000 |

    | 391 Hesaplanan KDV (arsa payı teslimi) | | 1.260.000 |

    | 679 Diğer Olağandışı Gelir ve Kârlar | | 4.300.000 |


    İşyerleri, karşılığında verilen arsa payının teslim bedeli olan 6.300.000 TL ile aktifleştirilir. Defter değeri 2.000.000
    TL olan arsa payının elden çıkarılmasından 4.300.000 TL kâr doğar.

    '
