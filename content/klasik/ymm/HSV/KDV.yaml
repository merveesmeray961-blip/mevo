      mart_makine_matrah\": mart_makine,\n    \"mart_makine_kdv\": mart_makine*20//100,\n    \"nisan_kur_farki_matrah\": kur_farki,\n\
      \    \"nisan_kur_farki_kdv\": kur_farki*20//100,\n    \"personel_hediye_kdv\": hediye*20//100,\n    \"kasa_depozito_kdv\"\
      : 3000*20//100,\n    \"sorumlu_kdv\": 5000*45*20//100,\n    \"mart_hesaplanan_kdv\": mart_makine*20//100 + hediye*20//100\
      \ + 3000*20//100,\n}\n"
