  sinav: ymm
  ders: HSV
  konu: KDV
  kazanimlar:
  - vergiyi doğuran olay
  - matrah ve oranlar
  - verginin konusu ve Türkiye'de yapılma
  - mükellef ve sorumlu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(M) Makine A.Ş.** gerçek usulde KDV mükellefidir ve aylık dönemler hâlinde beyanname vermektedir. Şirketin 2026
    yılı Mart ve Nisan aylarına ilişkin bazı işlemleri aşağıdadır. Tüm işlemler %20 oranında KDV’ye tabidir; işlemlerden hiçbiri
    istisna kapsamında değildir.


    1. Yurt içindeki (P) A.Ş.’ye bedeli 10.000 USD (KDV hariç) olan bir makine satılmıştır. Makine henüz teslim edilmeden
    **3 Mart**’ta bedelin 4.000 USD’lik kısmı için fatura düzenlenmiştir (kur: 40,00 TL). Makine **20 Mart**’ta teslim edilmiş
    ve kalan 6.000 USD için aynı gün fatura düzenlenmiştir (kur: 41,00 TL). Faturalardaki KDV, fatura tarihlerinde Türk lirası
    olarak tahsil edilmiştir. 10.000 USD’lik bedelin tamamı **20 Nisan**’da tahsil edilmiştir (kur: 42,00 TL).

    2. Bayram nedeniyle 30 personelin her birine şirketin ürettiği birer elektrikli süpürge hediye edilmiştir. Bir süpürgenin
    emsal bedeli (KDV hariç) 2.000 TL’dir. Ayrıca Mart ayında personele işyerindeki yemekhanede bedelsiz yemek verilmiş; yemek
    hizmeti alımına ilişkin faturalarda 50.000 TL + 10.000 TL KDV gösterilmiştir.

    3. Ürünlerin sevkiyatında kullanılan ve geri verilmesi mutat olan metal kasalar için Mart ayında müşterilerden toplam
    8.000 TL depozito alınmıştır. Önceki bir dönemde bir müşteriye gönderilen ve karşılığında 3.000 TL depozito alınan kasaların
    geri dönmeyeceği Mart ayında kesinleşmiştir.

    4. Türkiye’de ikametgâhı, işyeri, kanuni merkezi ve iş merkezi bulunmayan Alman (G) GmbH, şirketin fabrikasındaki üretim
    hattının verimliliğine ilişkin danışmanlık hizmetini Almanya’dan uzaktan vermiş ve Mart ayında tamamlamıştır. Hizmet bedeli
    5.000 avrodur; hizmetin tamamlandığı gün kur 45,00 TL’dir.


    **İstenenler**


    (a) 1 numaralı işlemde vergiyi doğuran olay(lar)ı belirleyerek Mart dönemine ait KDV matrahını hesaplayınız; Nisan ayındaki
    tahsilat nedeniyle yapılması gereken işlemi (belge, matrah ve KDV) açıklayınız. **(8 puan)**


    (b) 2 ve 3 numaralı işlemlerin KDV karşısındaki durumunu açıklayınız ve bu işlemler nedeniyle Mart döneminde hesaplanacak
    KDV’yi bulunuz. **(7 puan)**


    (c) 4 numaralı işlemin Türkiye’de yapılmış sayılıp sayılmadığını, verginin kim tarafından ve hangi beyannameyle beyan
    edileceğini, tutarını ve şirketin bu vergiyi hangi dönemde indirebileceğini açıklayınız. **(6 puan)**


    (d) Şirketin Mart dönemi 1 No.lu KDV Beyannamesinde yer alacak hesaplanan KDV toplamını bulunuz. **(4 puan)**

    '
  cozum: "**(a) Döviz cinsinden satış, avans faturası ve kur farkı**\n\n- KDVK md. 10/b: Malın tesliminden önce fatura düzenlenirse\
    \ vergiyi doğuran olay, faturada gösterilen miktarla sınırlı olarak fatura tarihinde doğar. 4.000 USD için vergiyi doğuran\
    \ olay **3 Mart**’tır.\n- Kalan 6.000 USD için vergiyi doğuran olay malın teslimi, yani **20 Mart**’tır (md. 10/a).\n\
    - KDVK md. 26: Döviz, vergiyi doğuran olayın meydana geldiği andaki kur üzerinden Türk lirasına çevrilir.\n\n| Kısım |\
    \ Vergiyi doğuran olay | Kur | Matrah (TL) |\n|---|---|---|---|\n| 4.000 USD | 3 Mart (fatura) | 40,00 | 160.000 |\n|\
    \ 6.000 USD | 20 Mart (teslim) | 41,00 | 246.000 |\n| **Mart toplamı** | | | **406.000** |\n\nHesaplanan KDV: 406.000\
    \ × %20 = **81.200 TL**.\n\n- Nisan: Bedel, vergiyi doğuran olaydan sonra tahsil edildiği için satıcı lehine kur farkı\
    \ doğmuştur; kur farkı md. 24/c gereği matraha dahildir. Tebliğe göre yalnız mal bedeline isabet eden kur farkı dikkate\
    \ alınır; KDV zaten TL olarak tahsil edildiğinden KDV’ye ait kur farkı yoktur.\n  - 4.000 USD × (42 − 40) = 8.000 TL\n\
    \  - 6.000 USD × (42 − 41) = 6.000 TL\n  - Kur farkı matrahı **14.000 TL**; KDV 14.000 × %20 = **2.800 TL**.\n- (M) A.Ş.\
    \ Nisan ayında (P) A.Ş. adına **kur farkı faturası** düzenler; teslimin yapıldığı tarihteki oran (%20) uygulanır ve vergi\
    \ Nisan dönemi beyannamesinde beyan edilir.\n\n**(b) Personele verilen mallar, yemek ve depozitolar**\n\n- Süpürgeler:\
    \ Vergiye tabi malların personele hediye adıyla verilmesi md. 3/a gereği teslim sayılır. Bedel bulunmadığından matrah\
    \ emsal bedeldir (md. 27/1): 30 × 2.000 = 60.000 TL; KDV **12.000 TL**.\n- Yemek: Tebliğe göre personele işyerinde veya\
    \ müştemilatında yemek verilmesi vergiye tabi tutulmaz. Yemek hizmeti alımına ait **10.000 TL KDV** genel hükümlere göre\
    \ indirilebilir.\n- 8.000 TL depozito: Geri verilmesi mutat kaplara ait depozito teminat niteliğindedir ve matraha dahil\
    \ edilmez (md. 2/4; Tebliğ III/A-5.1).\n- 3.000 TL depozito: Kasaların geri dönmeyeceği kesinleştiği için depozito teminat\
    \ niteliğini kaybeder ve satış bedelinin parçası olur. Kesinleştiği Mart döneminde 3.000 × %20 = **600 TL** KDV hesaplanır.\n\
    - 2 ve 3 numaralı işlemler nedeniyle Mart’ta hesaplanan KDV: 12.000 + 600 = **12.600 TL**.\n\n**(c) Yurt dışından alınan\
    \ danışmanlık hizmeti**\n\n- Hizmet yurt dışında yapılmış, ancak hizmetten Türkiye’deki fabrikada faydalanılmıştır. Bu\
    \ nedenle md. 6/b gereği işlem Türkiye’de yapılmış sayılır ve KDV’ye tabidir.\n- Hizmeti verenin Türkiye’de ikametgâhı,\
    \ işyeri, kanuni merkezi ve iş merkezi yoktur. Bu nedenle md. 9/1 ve Tebliğ gereği KDV’nin tamamını hizmetten faydalanan\
    \ (M) A.Ş. **sorumlu sıfatıyla 2 No.lu KDV Beyannamesi** ile beyan eder. Bu hizmet KDV mükellefi olmayan gerçek kişiye\
    \ sunulmadığından elektronik hizmet sunucularına özel mükellefiyet uygulanmaz.\n- Matrah 5.000 × 45 = 225.000 TL; KDV\
    \ **45.000 TL**. Hizmet Mart’ta tamamlandığından Mart dönemine ait 2 No.lu beyannameyle beyan edilir.\n- İndirim (md.\
    \ 29/1; Tebliğ III/C-1.1): Sorumlu sıfatıyla beyan edilip ödenen KDV, ödendiği döneme ait 1 No.lu beyannamede indirilir.\
    \ 2 No.lu beyanname Mart dönemi 1 No.lu beyannamesinden önce verilir ve vergi süresinde ödenirse 45.000 TL Mart dönemi\
    \ 1 No.lu beyannamesinde indirilebilir.\n\n**(d) Mart dönemi hesaplanan KDV (1 No.lu beyanname)**\n\n81.200 (makine) +\
    \ 12.000 (personele hediye) + 600 (kesinleşen depozito) = **93.800 TL**\n\nSorumlu sıfatıyla beyan edilen 45.000 TL bu\
    \ toplama girmez; 2 No.lu beyannamede yer alır.\n"
