  cozum: '**(a) İzale-i şüyu satışı (KDVK md. 1/3-d, 8/1, 23/d; KDVGUT I/B-6)**


    - Cebri icra, izale-i şüyu ve tasfiye dahil müzayede mahallerinde yapılan her türlü satış KDV''ye tabidir. Malikin KDV
    mükellefi olmaması sonucu değiştirmez.

    - Mükellef satışı gerçekleştiren (S) İcra Dairesidir. Vergiyi doğuran olay satışın yapıldığı **8 Eylül 2026**''dır.

    - Matrah kesin satış bedelidir. İzale-i şüyuda alıcı hissedarlardan biriyse, kendi hissesi için mülkiyet devri olmadığından
    hissesi matrahtan indirilir: 10.000.000 × (1 − 0,30) = **7.000.000 TL**. KDV: 7.000.000 × %20 = **1.400.000 TL**.

    - KDV, en geç bedelin tahsil edildiği günü izleyen günün mesai saati bitimine kadar (**10 Eylül 2026**) **5 No.lu KDV
    beyannamesiyle** beyan edilip ödenir. Bu süre içinde ödenmezse teslim gerçekleştirilmez. Aylık satışlar ertesi ayın sonuna
    kadar bildirimle ayrıca vergi dairesine bildirilir.


    **(b) Altın ziynet (KDVK md. 23/e; KDVGUT III/A-4.2.1)**


    Altından mamul ziynet eşyası tesliminde matrah, satış bedelinden mamulün bünyesindeki külçe altının has bedeli düşülerek
    bulunur. Has bedel, ayar dikkate alınarak Borsa İstanbul''daki son resmî işgünü kapanış fiyatıyla hesaplanır. Külçe altın
    teslimi ise md. 17/4-g ile istisnadır.


    1. Has altın: 300 × 0,916 = 274,8 gram.

    2. Has bedeli: 274,8 × 3.500 = 961.800 TL.

    3. Matrah: 1.200.000 − 961.800 = **238.200 TL**; KDV: **47.640 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 100 Kasa | 1.247.640 | |

    | 600 Yurt İçi Satışlar | | 1.200.000 |

    | 391 Hesaplanan KDV | | 47.640 |


    **(c) İkinci el taşınmaz (KDVK md. 23/f; KDVGUT III/A-4.9)**


    Yetki belgeli taşınmaz ticareti yapanların, KDV mükellefi olmayanlardan alıp vasfında esaslı değişiklik yapmadan sattıkları
    taşınmazlarda matrah, satış bedelinden alış bedeli düşülerek bulunur. KDV hesaplanarak alınan taşınmazlarda özel matrah
    uygulanmaz. Basit tadil, bakım ve onarım esaslı değişiklik sayılmaz.


    | Taşınmaz | Özel matrah | Matrah | KDV | Gerekçe |

    |---|---|---|---|---|

    | T1 | Var | 4.000.000 − 3.000.000 = 1.000.000 | 200.000 | Mükellef olmayandan alındı; boya ve tesisat yenilemesi esaslı
    değişiklik değil. |

    | T2 | Yok | 3.800.000 | 760.000 | KDV ödenerek alındı. |

    | T3 | Yok | 4.500.000 | 900.000 | Güçlendirme ve kat ilavesi vasıfta esaslı değişikliktir. |


    Alış sonrası işlemlere ait KDV''ler (T1''de 20.000 TL, T3''te 300.000 TL) ile T2''nin alış KDV''si (600.000 TL) genel
    hükümlere göre indirilebilir (md. 29). Toplam hesaplanan KDV 1.860.000 TL''dir.


    **(d) Yurt dışı tur (KDVK md. 6/b, 14; KDVGUT I/B-9)**


    - Yurt dışında verilen konaklama, yeme-içme ve rehberlik hizmetlerinden yolcular yurt dışında yararlanır. Bu hizmetler
    Türkiye''de yapılmış sayılmaz ve VUK''a uygun belgelendirilmek şartıyla KDV dışında kalır.

    - Faturada ayrıca gösterilen yurt dışına yolcu taşıma bedeli md. 14 uyarınca istisnadır.

    - Tur organizasyonuna ilişkin Türkiye''de verilen hizmetler KDV''ye tabidir.

    - Matrah: 5.000.000 − 2.400.000 − 1.000.000 = **1.600.000 TL**; KDV: **320.000 TL**. Bu uygulama için faturada yurt dışı
    masraflar ile taşıma bedelinin ayrı ayrı gösterilmesi gerekir.

