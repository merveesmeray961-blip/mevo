  soru: 'Aşağıdaki olaylar 2026 yılına aittir. Bu soruda tüm vergiye tabi işlemler için KDV oranı **%20** kabul edilecektir.


    **1. İzale-i şüyu.** Kardeşler Bay (F) (%40), Bay (G) (%30) ve Bayan (H) (%30), miras kalan bir işyerinin paylı malikleridir;
    hiçbiri KDV mükellefi değildir. Ortaklığın giderilmesi kararının infazı için satışı yürüten (S) İcra Dairesi işyerini
