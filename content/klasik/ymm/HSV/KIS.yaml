    - (İ), Nisan''da aldığı mobilyaların imalatçı bedeli 700.000 TL olan kısmını 20 Haziran 2026''da 1.050.000 TL bedelle
    ihraç etmiştir. İmalatçı bedeli 300.000 TL olan kısım, yurt dışındaki alıcının siparişi iptal etmesi nedeniyle ihraç edilememiştir.
    (İ), ek süre için 20 Ağustos 2026''da defterdarlığa başvurmuştur.

    - (M), terkin edilemeyen vergiyi gecikme zammıyla birlikte Ağustos 2026''da ödemiş ve (İ)''ye rücu etmiştir; (İ) bu KDV''yi
    28 Ağustos 2026''da (M)''ye ödemiştir.

    - (İ)''nin 20 Haziran''daki ihracatı için yüklendiği genel gider ve ATİK KDV''sinden bu ihracata isabet eden pay 85.000
