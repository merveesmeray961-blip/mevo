  soru: '**(İ) İhracat A.Ş.** ürettiği malları hem ihraç etmekte hem yurt içinde satmaktadır. Ekim 2026 dönemine ait bilgiler
    aşağıdadır (KDV %20; önceki dönemden devreden KDV yoktur):


    | Kalem | Tutar |

    |---|---|

    | Gümrük beyannamesi Ekim''de kapanan mal ihracatı | 4.000.000 TL |

    | Yurt içi satışlar | 1.000.000 TL + 200.000 TL KDV |

    | İhraç edilen ürünlerin bünyesine doğrudan giren hammadde ve malzeme KDV''si | 650.000 TL |

    | Yurt içinde satılan ürünlerin doğrudan girdilerinin KDV''si | 100.000 TL |

    | Genel imal ve genel idare giderleri KDV''si | 75.000 TL |

    | Yalnız yurt içi perakende satış mağazasının kira KDV''si | 10.000 TL |

    | Ekim''de aktife alınıp aynı ay ihracat ve yurt içi üretimde kullanılmaya başlanan makinenin KDV''si | 300.000 TL |


    Ek bilgiler:

    - Makine, iade hakkı doğuran ve doğurmayan işlemlerde ilk kez Ekim''de kullanılmıştır. Bu soruda makineye ilişkin KDV''nin
    tamamının indirim yoluyla giderilemediği kabul edilecektir.

    - Şirket iade alacağının 200.000 TL''sinin SGK prim borcuna mahsubunu, kalanının nakden ödenmesini istemektedir. Nakden
    iade, YMM KDV İadesi Tasdik Raporuyla talep edilecektir.


    **İstenenler**


    (a) Genel gider payının dağıtım oranını, doğrudan girdiler ve genel giderler nedeniyle iade hesabına alınacak KDV''yi
    bulunuz. **(6 puan)**


    (b) Azami iade edilebilir KDV''yi hesaplayınız, ATİK''ten iade hesabına verilecek payı bulunuz ve verilemeyen ATİK payının
    sonraki dönemlerdeki durumunu açıklayınız. **(7 puan)**


    (c) İade edilebilecek KDV''yi ve sonraki döneme devreden KDV''yi bulunuz; beyanname sonucunun yevmiye kaydını yapınız.
    **(6 puan)**


    (d) Mahsuben ve nakden iadenin hangi koşullarla yerine getirileceğini açıklayınız. Artırımlı teminat uygulamasında verilecek
    teminat tutarını, iadenin yapılma süresini ve YMM raporunun ibraz süresini belirtiniz. **(6 puan)**

    '
  cozum: '**(a) Doğrudan girdiler ve genel giderler (KDVGUT IV/A3-1.2)**


    İade tutarı hesaplanırken önce işlemin bünyesine doğrudan giren harcamalar, sonra genel giderlerden pay, en son ATİK''ten
    pay dikkate alınır.


    1. Dağıtım oranı: 4.000.000 / (4.000.000 + 1.000.000) = **0,80**.

    2. Doğrudan girdiler: **650.000 TL**. Yurt içi ürünlerin girdileri ve yalnız yurt içi mağazasına ait kira KDV''si, iade
    hakkı doğuran işlemle ilgili olmadığından iade hesabına dahil edilmez.

    3. Genel gider payı: 75.000 × 0,80 = **60.000 TL**.

    4. Ara toplam: 650.000 + 60.000 = **710.000 TL**.


    **(b) Azami iade ve ATİK payı (KDVGUT IV/A3-1.1, 1.3)**


    1. Azami iade edilebilir KDV, iade hakkı doğuran işlem bedelinin genel oranla çarpımıdır. Tebliğde eski %18 oranı yazılıdır;
    2026''da genel oran %20''dir: 4.000.000 × %20 = **800.000 TL**.

    2. ATİK''ten verilebilecek azami pay: Makine ilk kez bu dönemde kullanıldığından kümülatif oran dönem oranına eşittir:
    300.000 × 0,80 = 240.000 TL.

    3. Ara toplam ile azami iade arasındaki fark: 800.000 − 710.000 = 90.000 TL. ATİK payı bu farkı aşamaz; iade hesabına
    **90.000 TL** pay verilir.

    4. Verilemeyen 150.000 TL ATİK payı, sonraki dönemlerde oranlama yapılmadan doğrudan iade hesabına dahil edilemez. Sonraki
    dönemlerde makinenin kullanıldığı tüm işlemler üzerinden kümülatif oranlama yeniden yapılır ve önceki dönemlerde verilen
    paylar düşülerek kalan tutar kadar pay verilebilir.


    **(c) İade edilebilecek ve devreden KDV**


    1. Yüklenilen KDV: 650.000 + 60.000 + 90.000 = **800.000 TL**.

    2. Toplam indirim KDV: 650.000 + 100.000 + 75.000 + 10.000 + 300.000 = 1.135.000 TL. Yüklenilen KDV aradaki dönemlerin
    devreden KDV''leriyle değil, talep dönemindeki toplam indirim KDV ile karşılaştırılır. 800.000 TL bu tutarın içindedir.

    3. İndirimle giderilemeyen KDV: 1.135.000 − 200.000 = 935.000 TL ≥ 800.000 TL. İade edilebilecek KDV = **800.000 TL**.

    4. Devreden KDV: 1.135.000 − 200.000 − 800.000 = **135.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 391 Hesaplanan KDV | 200.000 | |

    | 136 Diğer Çeşitli Alacaklar (KDV iade alacağı) | 800.000 | |

    | 190 Devreden KDV | 135.000 | |

    | 191 İndirilecek KDV | | 1.135.000 |


    **(d) İade usulü (KDVGUT II/A-1.1.4, IV/A3-4, IV/A3-5.6)**


    - **Mahsuben (200.000 TL):** Mal ihracından doğan mahsuben iade taleplerinde rapor ve teminat aranmaz; belgelerin tamamlanmasıyla
    SGK prim borcuna mahsup edilir.

    - **Nakden (600.000 TL):** 50.000 TL''yi aşmayan kısım rapor ve teminat aranmadan ödenir. Aşan **550.000 TL**, vergi inceleme
    raporu veya YMM KDV İadesi Tasdik Raporuyla yerine getirilir. Teminat verilirse iade yapılır, teminat rapora göre çözülür;
    YMM raporu altı ay içinde verilmezse teminat inceleme raporuna göre çözülür, haklı mazerette altı ay ek süre verilebilir.

    - **Artırımlı teminat:** YMM raporuyla talep edilen ve sınırı aşan 550.000 TL için talep edilen tutarın %120''si, yani
    **660.000 TL** banka teminat mektubu veya sigorta şirketi kefalet senedi verilirse iade **beş iş günü** içinde yapılır.
    YMM raporu iadenin yapıldığı tarihten itibaren **altı ay** içinde verilmezse talep ivedilikle incelemeye sevk edilir.

    '
