  soru: '**Güneş Koleji A.Ş.**, 5580 sayılı Kanun''a tabi bir özel okul işletmektedir. 2026-2027 eğitim yılında kapasitesi
    400 öğrenci olan okulda 36 öğrenciye tamamen bedelsiz eğitim verilmekte, diğer öğrencilere ücretli eğitim verilmektedir.
    Ekim 2026 dönemine ilişkin bilgiler:


    - Ücretli eğitim hizmetleri: 1.800.000 TL + %10 KDV

    - Okulun ortak giderlerine (elektrik, bakım) ait yüklenilen KDV: 100.000 TL

    - Bedelsiz öğrencilere sağlanan yemek hizmeti alımına ait yüklenilen KDV: 12.000 TL

    - Okul kantininin kiralanmasından kira geliri: 60.000 TL + %20 KDV (kantin kiralaması KDV''ye tabidir)


    **İstenenler:**


    (a) Bedelsiz verilen eğitim hizmetinin istisna kapsamında olup olmadığını kapasite sınırı yönünden değerlendiriniz. (6
    puan)


    (b) Bu istisna kapsamındaki işlemlerle ilgili alış KDV''lerinin md. 30/a karşısındaki durumunu açıklayınız. (7 puan)


    (c) Dönem hesaplanan KDV''yi hesaplayınız. (3 puan)


    (d) İndirilecek KDV toplamını ve ödenecek KDV''yi bulunuz. (5 puan)


    (e) Kapasite 400 öğrenci iken bedelsiz öğrenci sayısı 50 olsaydı sonuç ne olurdu? İlkesel olarak açıklayınız. (4 puan)

    '
  cozum: '**(a)** KDVK md. 17/2-b: özel okullarca bedelsiz verilen eğitim hizmetlerinde ilgili dönemdeki kapasitenin %10''unu
    geçmemek üzere bedelsiz eğitim istisnadır. Kapasite 400 → %10 = 40 öğrenci; 36 öğrenci sınır içinde olduğundan istisna
    uygulanır.


    **(b)** Md. 30/a istisnalı işlemlerle ilgili alış KDV''sini indirimden dışlar; ancak 17/2-b, c, d bentleri uyarınca istisna
    edilen işlemler bu dışlamanın hariç tutulmuştur. Bu nedenle bedelsiz eğitimle ilgili yüklenilen KDV (yemek ve ortak giderler)
    indirilebilir.


    **(c)** Hesaplanan KDV = 1.800.000 × %10 + 60.000 × %20 = 180.000 + 12.000 = **192.000 TL**.


    **(d)** İndirilecek KDV = 100.000 + 12.000 = **112.000 TL**. Ödenecek KDV = 192.000 − 112.000 = **80.000 TL**.


