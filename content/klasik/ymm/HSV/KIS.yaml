    raporu aranmadan yerine getirilir. 50.000 TL ve üzerindeki talepler vergi inceleme raporu sonucuna göre veya YMM raporuyla
    yerine getirilir. 50.000 TL''yi aşan kısım (50.200 TL) için teminat verilirse teminat rapora göre çözülür.

    - **İşgücü temini tevkifatından nakden iade:** Bu iade münhasıran teminat ve/veya vergi inceleme raporuyla yerine getirilir.
    YMM raporu ancak süresinde düzenlenmiş tam tasdik sözleşmesi varsa kullanılabilir; şirkette bu sözleşme yoktur.

    - Mahsuben iade de mümkündür; tevkifattan doğan alacak KDVGUT (IV/A3-2.1.1)''de sayılan borçlara mahsup edilebilir.


