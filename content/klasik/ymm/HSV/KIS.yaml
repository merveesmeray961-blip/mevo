  soru: '**(D) Tekstil A.Ş.** gerçek usulde KDV mükellefidir. Mayıs 2026 dönemine ait bilgiler aşağıdadır (genel KDV oranı
    %20; önceki dönemden devreden KDV yoktur):


    | İşlem | Tutar (KDV hariç) | KDV |

    |---|---|---|

    | Yurt içi satışlar | 1.000.000 TL | %20 |

    | Gümrük beyannameli mal ihracatı (alıcı yurt dışında; mallar 15 Mayıs’ta gümrük bölgesinden çıkıp alıcı ülkeye ulaşmıştır)
    | 3.000.000 TL | — |

    | Hammadde ve malzeme alımları | 2.500.000 TL | 500.000 TL |

    | Genel imal ve genel idare giderleri | 200.000 TL | 40.000 TL |

    | Satış müdürünün kullanımına verilen binek otomobili (şirketin faaliyeti araç kiralama veya işletme değildir) | 1.500.000
    TL | 300.000 TL |

    | Ortaklardan birinin özel konutu için şirket adına alınan mobilya | 100.000 TL | 20.000 TL |


    Ek bilgiler:

    - Hammadde ve malzeme alımlarına ait KDV’nin 360.000 TL’si ihraç edilen ürünlerin bünyesine doğrudan girmektedir.

    - Genel giderlere ait KDV’den ihracata isabet eden pay 30.000 TL’dir.

    - Şirket, ihracat nedeniyle doğan iade hakkını kullanmak istemektedir.


    **İstenenler**


    (a) Mayıs dönemi indirilecek KDV toplamını hesaplayınız; indirime konu edilemeyen kalemleri dayanaklarıyla açıklayınız.
    **(7 puan)**


    (b) İhracat nedeniyle iadesi talep edilebilecek KDV’yi; yüklenilen KDV’yi, azami iade edilebilir tutarı ve indirimle giderilemeyen
    KDV’yi karşılaştırarak hesaplayınız. **(10 puan)**


    (c) Mayıs dönemi beyannamesinin sonucunu (ödenecek KDV veya sonraki döneme devreden KDV) bulunuz. **(4 puan)**


    (d) Teslimin ihracat teslimi sayılmasının KDVK md. 12/1’deki şartlarını belirtiniz; iade talebinin en geç hangi tarihe
    kadar yapılması gerektiğini açıklayınız. **(4 puan)**

    '
  cozum: "**(a) İndirilecek KDV**\n\n- Hammadde ve malzeme: 500.000 TL. Faaliyetle ilgilidir; vergiye tabi işlemler ve ihracatla\
    \ ilişkilidir. Md. 32’ye göre ihracat gibi istisnalı işlemlerle ilgili KDV de indirilebilir.\n- Genel giderler: 40.000\
    \ TL.\n- **Binek otomobili (300.000 TL): indirilemez.** KDVK md. 30/b’ye göre, faaliyeti binek otomobili kiralama veya\
    \ işletme olanların bu amaçla kullandıkları hariç, işletmelere ait binek otomobillerinin alış belgelerindeki KDV indirilemez.\n\
    - **Ortağın özel konutu için mobilya (20.000 TL): indirilemez.** İşletmeyle ilgisi yoktur ve kazancın tespitinde kanunen\
    \ kabul edilmeyen giderdir; md. 30/d gereği KDV’si indirilemez.\n\nİndirilecek KDV = 500.000 + 40.000 = **540.000 TL**\n\
    \n**(b) İade hesabı**\n\n| Adım | Tutar (TL) |\n|---|---|\n| Hesaplanan KDV (1.000.000 × %20) | 200.000 |\n| İndirimle\
    \ giderilemeyen KDV (540.000 − 200.000) | 340.000 |\n| İhracat nedeniyle yüklenilen KDV (360.000 doğrudan + 30.000 genel\
    \ gider payı) | 390.000 |\n| Azami iade edilebilir KDV (3.000.000 × %20) | 600.000 |\n| **İade edilebilecek KDV = en düşük\
    \ tutar** | **340.000** |\n\nGerekçe: Tebliğe göre iade hakkı doğuran işlem için yüklenilen KDV önce indirim konusu yapılır.\
    \ İndirimle giderilemeyen tutar varsa bu tutar iade edilir. Dönemlik iade, ihracat bedelinin genel oranla çarpımıyla bulunan\
    \ azami tutarı da aşamaz. Yüklenilen 390.000 TL azami tutarın altındadır; ancak indirimle giderilemeyen KDV 340.000 TL\
    \ olduğundan iade 340.000 TL ile sınırlıdır. Yüklenilen KDV’nin kalan 50.000 TL’si yurt içi satışların vergisinden indirilerek\
    \ zaten giderilmiştir.\n\n**(c) Beyanname sonucu**\n\n- Hesaplanan KDV 200.000 TL, indirilecek KDV 540.000 TL’dir.\n-\
    \ İadesi talep edilen 340.000 TL indirilecek ve devreden KDV içinden çıkarılır; sonraki döneme devretmez.\n- Ödenecek\
    \ KDV: **0**. Sonraki döneme devreden KDV: 540.000 − 200.000 − 340.000 = **0**.\n\n**(d) İhracat teslimi şartları ve iade\
    \ süresi**\n\n- KDVK md. 12/1’e göre:\n  - teslim yurt dışındaki bir müşteriye (veya serbest bölgedeki alıcıya, gümrüksüz\
    \ satış mağazasına ya da yetkili antrepo işleticisine) yapılmalıdır;\n  - mal Türkiye Cumhuriyeti gümrük bölgesinden çıkarak\
    \ bir dış ülkeye (veya serbest bölgeye) varmalıdır.\n  Olayda iki şart da gerçekleşmiştir.\n- KDVK md. 32/1’e göre iade,\
    \ işlemin gerçekleştiği dönemi izleyen ikinci takvim yılının sonuna kadar talep edilmelidir. İhracat 2026’da yapıldığından\
    \ son tarih **31 Aralık 2028**’dir.\n"
  puanlama:
  - olcut: İndirilecek KDV’nin 540.000 TL bulunması (hammadde ve genel giderler; istisnalı işlemle ilgili KDV’nin de indirilebilmesi)
    puan: 3
  - olcut: Binek otomobili KDV’sinin md. 30/b gereği indirilememesi
    puan: 2
  - olcut: Ortağın özel harcamasına ait KDV’nin md. 30/d (kanunen kabul edilmeyen gider) gereği indirilememesi
    puan: 2
  - olcut: İhracat nedeniyle yüklenilen KDV’nin 390.000 TL bulunması
    puan: 3
  - olcut: Azami iade edilebilir tutarın 600.000 TL bulunması
    puan: 2
  - olcut: İndirimle giderilemeyen KDV’nin 340.000 TL bulunması ve önce indirim ilkesinin açıklanması
    puan: 3
  - olcut: İadenin en düşük tutar olan 340.000 TL olarak belirlenmesi
    puan: 2
  - olcut: Ödenecek ve devreden KDV’nin sıfır olduğunun gerekçesiyle gösterilmesi
    puan: 4
  - olcut: Md. 12/1’deki iki ihracat teslimi şartının belirtilmesi
    puan: 2
  - olcut: İade talebi için son tarihin 31 Aralık 2028 olarak belirlenmesi
    puan: 2
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-a, 12/1, 29/1, 30/b, 30/d, 32/1
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-1.1, IV/A3-1.2
  gecerlilik:
