    VUK md. 18 uyarınca en geç 17 Ağustos 2026) istenmelidir. 20 Ağustos''taki başvuru süresinden sonra yapıldığı için değerlendirmeye
    alınmaz. Alıcının siparişi iptal etmesi beklenmedik durumdur; süresinde başvurulsaydı en çok üç ay ek süre verilebilirdi
