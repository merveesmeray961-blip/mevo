    tecil edildiği tarihten itibaren 6183 sayılı Kanun md. 48''e göre **tecil faizi** ile tahsil edilirdi.

    6. **(İ)''nin indirimi:** Rücuen ödenen KDV, ihracat süresinin bittiği günü (31 Temmuz) takip eden günün dahil olduğu
    dönemde, yani en erken **Ağustos 2026** döneminde indirilebilir. Nihai olarak bu dönemi kapsayan takvim yılını takip eden
    **2027** yılı sonuna kadar indirilebilir (KDVK md. 29/3; KDVGUT II/A-8.7). Mallar sonradan ihraç edilirse bu KDV ihracat
    iadesi hesabına da dahil edilebilir.


    **(d) (İ)''nin iade hakkı**


    İhraç kaydıyla mal alan ihracatçı ödemediği KDV''nin iadesini talep edemez. Genel gider ve ATİK nedeniyle talep edebileceği
