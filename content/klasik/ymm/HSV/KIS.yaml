  cozum: '**(a) Tevkifat (KDVGUT I/C-2.1.3)**


    Kısmi tevkifatta KDV''nin belirlenen kısmını alıcı sorumlu sıfatıyla 2 No.lu beyannameyle, kalanını satıcı 1 No.lu beyannameyle
    beyan eder. KDV dahil bedel VUK md. 232''deki sınırı (12.000 TL) aşmıyorsa tevkifat yapılmaz. KDV mükellefi olmayan ve
    belirlenmiş alıcı sayılmayanlar tevkifat yapmaz.


    | No | KDV | Tevkifat | Alıcının tevkif ettiği | Satıcının beyan ettiği |

    |---|---|---|---|---|

