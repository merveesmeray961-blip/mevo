      : indirilecek,\n    \"hesaplanan_kdv\": hesaplanan,\n    \"indirimle_giderilemeyen\": giderilemeyen,\n    \"yuklenilen_kdv\"\
      : yuklenilen,\n    \"azami_iade\": azami,\n    \"iade\": iade,\n    \"odenecek\": max(hesaplanan - indirilecek, 0),\n\
      \    \"devreden\": indirilecek - hesaplanan - iade,\n}\n"
