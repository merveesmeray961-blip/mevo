  soru: '**Doğa Ticaret A.Ş.** 2023 yılında müşterisi (K) Ltd. Şti.''ne 1.000.000 TL + %20 KDV ile mal satmış, KDV''yi beyan
    etmiş ve ödemiştir. Alacak, VUK md. 322''deki şartların gerçekleşmesi üzerine 2026 yılı Mayıs ayında değersiz alacak olarak
    zarar yazılmıştır (alacak KDV dahil 1.200.000 TL''dir). Şirket başka bir alacak için (VUK md. 323''e göre) 2025 yılında
    240.000 TL şüpheli alacak karşılığı ayırmış ve bu işlemin KDV tutarı 40.000 TL''dir; şirket 2025 kurumlar vergisi matrahında
    karşılığı gider olarak dikkate almıştır. Bu alacak 2026''da zarara dönüşmemiştir. Mayıs 2026 dönemi hesaplanan KDV''si
    500.000 TL, diğer indirilecek KDV 200.000 TL''dir.


    **İstenenler:**


    (a) Değersiz hale gelen 1.200.000 TL''lik alacağa ilişkin KDV''nin hangi dönemde indirim konusu yapılabileceğini ve tutarını
    belirtiniz. (7 puan)


    (b) Mayıs 2026 dönemi KDV beyanının sonucunu bulunuz. (6 puan)


    (c) VUK md. 323''e göre karşılık ayrılan alacağın KDV''sinin (40.000 TL) indirim konusu yapılabilme şartını belirtiniz;
    2026 Mayıs''ta yapılıp yapılamayacağını açıklayınız. (12 puan)

    '
  cozum: '**(a)** Md. 29/4: VUK md. 322''ye göre değersiz hale gelen alacaklara ilişkin hesaplanan ve beyan edilen KDV, alacağın
    zarar yazıldığı vergilendirme döneminde indirim konusu yapılabilir. Mayıs 2026''da indirilecek KDV = 1.200.000 − 1.000.000
    = **200.000 TL**.


    **(b)** İndirilecek toplam = 200.000 (alacak) + 200.000 (diğer) = 400.000 TL. Ödenecek KDV = 500.000 − 400.000 = **100.000
    TL**.


    **(c)** VUK md. 323''e göre karşılık ayrılmak suretiyle gelir veya kurumlar vergisi matrahının tespitinde gider olarak
    dikkate alınan KDV''nin bu fıkra kapsamında indirim konusu yapılabilmesi için gelir veya kurumlar vergisi matrahının tespitinde
    **gelir olarak dikkate alınması şarttır**. Bu alacak zarara dönüşmediği ve karşılık gelir yazılmadığı için 40.000 TL Mayıs
    2026''da indirilemez.


    Püf noktaları: Değersiz alacak KDV''si zarar yazıldığı dönemde; karşılıktaki KDV ise karşılığın gelir yazılmasına bağlı
