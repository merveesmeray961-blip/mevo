- id: YMM-HSV-KIS-K026
  sinav: ymm
  ders: HSV
  konu: KIS
  kazanimlar:
  - tevkifat
  - sorumlu sıfatıyla beyan
  - indirim (md. 29/1-ç)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Anka İnşaat Ltd. Şti.** (gerçek usulde KDV mükellefi), Ekim 2026''da kısmi tevkifata tabi bir hizmet satın almıştır
    (bu vakada tevkifat oranı 5/10, genel oran %20 kabul edilecektir): hizmet bedeli 600.000 TL (KDV hariç); faturada KDV
    %20 olarak hesaplanmış, tevkif edilen KDV ayrıca gösterilmiştir. Ekim dönemi diğer bilgiler:


    | Kalem | Tutar |

    |---|---|

    | Yurt içi satışlar (KDV hariç) | 3.000.000 TL; KDV %20 |

    | Diğer alışlara ait indirilebilir KDV | 250.000 TL |


    Şirket Ekim döneminde tevkif ettiği KDV''yi sorumlu sıfatıyla beyan etmiştir.


    **İstenenler:**


    (a) Tevkif edilen KDV tutarını ve satıcıya ödenecek KDV''yi bulunuz. (6 puan)


    (b) Alıcının tevkif ettiği KDV''yi hangi beyannameyle ve hangi dönemde beyan edeceğini belirtiniz. (6 puan)


    (c) Sorumlu sıfatıyla beyan edilen KDV''nin 1 No.lu KDV beyannamesinde indirim konusu yapılıp yapılamayacağını md. 29/1-ç''ye
    göre belirtiniz. (7 puan)


    (d) 1 No.lu KDV beyannamesine göre Ekim dönemi ödenecek KDV''yi hesaplayınız (indirilecek KDV''ye sorumlu sıfatıyla beyan
    edilen vergi dahil edilecektir). (6 puan)

    '
  cozum: '**(a)** KDV = 600.000 × %20 = 120.000 TL; tevkifat = 120.000 × 5/10 = **60.000 TL**. Satıcıya ödenecek KDV = **60.000
    TL**.


    **(b)** Gerçek usulde KDV mükellefleri tevkif ettikleri KDV''yi **2 No.lu KDV beyannamesi** (1015B) ile, sorumlu sıfatıyla
    beyan eder ve öder (kısmi tevkifatta satıcı kendi payını 1 No.lu beyannamede aynı dönemde beyan eder).


    **(c)** Md. 29/1-ç: vergi kesintisi yapmakla sorumlu tutulanlar tarafından sorumlu sıfatıyla beyan edilerek ödenen KDV,
    indirim konusu yapılabilir. Dolayısıyla alıcı, **sorumlu sıfatıyla beyan edip ödediği** 60.000 TL''yi ayrıca indirimi;
    satıcıdan faturada ayrıca gösterilen 60.000 TL ile birlikte toplam 120.000 TL''yi indirebilir.


    **(d)** Hesaplanan KDV = 3.000.000 × %20 = 600.000 TL. İndirilecek = 250.000 + 60.000 (satıcıya ödenen) + 60.000 (sorumlu
    sıfatıyla beyan edilen) = 370.000 TL. Ödenecek KDV = **230.000 TL**.


    Püf noktaları: Tevkif edilen KDV''nin indirimi için önce sorumlu sıfatıyla beyan ve ödeme gerekir.

    '
