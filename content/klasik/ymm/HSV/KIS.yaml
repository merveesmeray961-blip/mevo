    5. Aynı yangında faydalı ömrü 5 yıl olan minibüs zayi olmuştur. Minibüs 1 Mart 2023''te 500.000 TL + 100.000 TL KDV''ye
    alınmış, KDV o dönemde indirilmiştir. Birikmiş amortismanı 300.000 TL''dir; sigorta tazminatı yoktur.

    6. 2025''te KDV dahil 120.000 TL''ye (KDV 20.000 TL beyan edilmiş) satış yapılan müşteriden olan alacak, Kasım 2026''da
