  dogrulama:
    python: 'hes = 300000*0.20 + 200000*0.20

      ind = 300000

      yuk = 190000 + 40000

      azami = 2500000*0.20

      iade = min(yuk, ind - hes, azami)

      dev = ind - hes - iade

      mahsup = 80000

      mahsup_raporsuz = min(mahsup, 50000)

      mahsup_raporlu = mahsup - mahsup_raporsuz

      nakit = iade - mahsup

      teminat = nakit*1.20

      sonuc = {"hesaplanan": hes, "iade": iade, "devreden": dev, "mahsup_raporlu": mahsup_raporlu, "nakit": nakit, "artirimli_teminat":
      teminat}

      '
