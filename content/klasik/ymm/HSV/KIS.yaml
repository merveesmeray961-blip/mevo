  cozum: 'Tecil edilecek vergi, ihraç kaydıyla teslimler nedeniyle hesaplanan vergiden fazla olamaz. Ödenmesi gereken KDV
    bu tutardan azsa, ödenmesi gereken KDV tecil edilir. Tecil edilemeyen kısım ihracat gerçekleşince imalatçıya iade edilir
    (KDVGUT II/A-8.5).


    **(a) Nisan 2026**


    | Kalem | Tutar (TL) |

    |---|---|

    | Hesaplanan KDV [(600.000 + 1.000.000) × %20] | 320.000 |

    | İndirilecek KDV | 90.000 |

    | Ödenmesi gereken KDV | 230.000 |

    | Tecil edilebilir KDV (1.000.000 × %20) | 200.000 |

    | Tecil edilecek KDV = min(230.000; 200.000) | 200.000 |

    | Ödenecek KDV (230.000 − 200.000) | 30.000 |


    Tecil edilebilir KDV''nin tamamı tecil edildiğinden ihracat gerçekleşince iade edilecek tutar yoktur.


    **(b) Mayıs 2026**


    | Kalem | Tutar (TL) |

    |---|---|

    | Hesaplanan KDV [(200.000 + 500.000) × %20] | 140.000 |

    | İndirilecek KDV | 120.000 |

    | Ödenmesi gereken KDV | 20.000 |

    | Tecil edilebilir KDV (500.000 × %20) | 100.000 |

    | Tecil edilecek KDV = min(20.000; 100.000) | 20.000 |

    | Ödenecek KDV | 0 |

    | İhracat gerçekleşince iade edilecek KDV (100.000 − 20.000) | 80.000 |


    (K) malları 25 Temmuz 2026''da, süresi içinde (1 Haziran – 31 Ağustos 2026) ihraç ettiğinden 20.000 TL terkin edilir.
    80.000 TL imalatçı (M)''ye ihracatın gerçekleşmesinden sonra iade edilir. İhracatçı ödemediği KDV''yi iade olarak isteyemez.


    **(c) Nisan teslimi: ihracatın kısmen gerçekleşmemesi**


    1. Süre, teslim tarihini (10 Nisan) takip eden aybaşından (1 Mayıs) itibaren üç aydır; son gün **31 Temmuz 2026**''dır
