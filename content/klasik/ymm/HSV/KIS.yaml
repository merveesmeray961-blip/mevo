  soru: '**(H) Mühendislik A.Ş.** gerçek usulde KDV mükellefidir. Şirketin Mart 2026''da tamamlayıp faturasını düzenlediği
    hizmetler aşağıdadır. Vergiye tabi işlemlerde KDV oranı %20''dir; önceki dönemden devreden KDV ve dönemde ATİK alımı yoktur.


    | No | Hizmet | Bedel (TL, KDV hariç) | İşleme ait yüklenilen KDV (TL) |

    |---|---|---|---|

    | 1 | Almanya''da yerleşik (G) GmbH için Almanya''da kurulacak fabrikanın proje çizimi. Fatura (G) adına düzenlenmiş,
    bedel 25 Mart''ta döviz olarak Türkiye''ye gelmiştir. | 2.000.000 | 190.000 |

    | 2 | Hollanda''da yerleşik (N) B.V.''nin Türkiye''den ithal ettiği maden cevherinin kalite kontrolü, ihraç limanına taşınmasının
    organizasyonu ve gemiye yüklenmesinin gözetimi. Fatura (N) adına düzenlenmiş, bedel 28 Mart''ta döviz olarak gelmiştir.
    | 500.000 | 40.000 |

    | 3 | Japonya''da yerleşik (J) Co.''nun mallarına Türkiye''de müşteri bulma karşılığı komisyon. Fatura (J) adına düzenlenmiş,
    bedel döviz olarak gelmiştir. | 300.000 | — |

    | 4 | Özbekistan''da yerleşik (U) firmasına, Özbekistan''daki inşaatta kullanılmak üzere, yurt dışında bulunan iş makinelerinin
    kiraya verilmesi. | 400.000 | — |

    | 5 | Türkiye''deki bir serbest bölgede faaliyet gösteren (S) Ltd.''ye verilen yönetim danışmanlığı. Hizmet tamamen şirketin
    İstanbul''daki ofisinde ifa edilmiş, rapor elektronik ortamda gönderilmiştir. | 200.000 | — |


    Ek bilgiler:

    - Mart 2026 döneminde indirim konusu yapılabilecek KDV toplamı 300.000 TL''dir (tablodaki 190.000 TL ve 40.000 TL dahil).

    - Tablodaki yüklenilen KDV tutarları, doğrudan girdiler ile genel giderlerden verilen paylar dahil olmak üzere KDVGUT
    (IV/A3) bölümüne uygun hesaplanmıştır.

    - Şirket, iade alacağının 80.000 TL''sinin vergi borçlarına mahsubunu, kalanının nakden ödenmesini istemektedir. Şirketin
    süresinde düzenlenmiş tam tasdik sözleşmesi vardır; nakden iade için YMM KDV İadesi Tasdik Raporu ile başvuracaktır.


    **İstenenler**


    (a) Beş işlemin KDV karşısındaki durumunu (vergiye tabi, hizmet ihracı istisnası, KDV''nin konusu dışında) gerekçesiyle
    belirleyiniz. **(10 puan)**


    (b) Mart 2026 beyannamesindeki hesaplanan KDV''yi, iade edilebilecek KDV''yi ve sonraki döneme devreden KDV''yi bulunuz.
    İstisnanın beyannamede nasıl gösterileceğini ve 2 numaralı işlemin bedeli Türkiye''ye gelmemiş olsaydı iadenin nasıl etkileneceğini
    açıklayınız. **(7 puan)**


    (c) Mahsuben ve nakden iade taleplerinin hangi rapor ve teminat koşullarıyla yerine getirileceğini açıklayınız. Şirket
    nakden iade için artırımlı teminat uygulamasından yararlanmak isterse vereceği teminat tutarını, iadenin yapılma süresini
    ve YMM raporunun ibraz süresini belirtiniz. **(5 puan)**


    (d) Beyanname sonucunun, mahsubun ve nakit iadenin yevmiye kayıtlarını yapınız. **(3 puan)**

    '
  cozum: '**(a) İşlemlerin KDV karşısındaki durumu**


    Hizmet ihracı istisnası için (KDVK md. 11/1-a, 12/2) hizmetin yurt dışındaki müşteri için yapılması ve hizmetten yurt
    dışında faydalanılması gerekir. Faydalanma, hizmetin müşterinin yurt dışındaki iş ve faaliyetleriyle ilgili olması, Türkiye''deki
    faaliyetiyle ilgisinin bulunmaması demektir (KDVGUT II/A-2.1).


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | Hizmet ihracı, istisna | Müşteri yurt dışında; proje yurt dışındaki fabrikada kullanılacak, faydalanma yurt dışında.
    |

    | 2 | Hizmet ihracı, istisna | Yabancı firmanın Türkiye''den ithal ettiği (Türkiye''nin ihraç ettiği) mallarla ilgili
    hizmetlerden yurt dışında faydalanılır. |

    | 3 | Vergiye tabi; KDV 300.000 × %20 = 60.000 TL | Yabancı firmanın mallarına Türkiye''de müşteri bulunmasından Türkiye''de
    faydalanılır. Faturanın yabancı firma adına düzenlenmesi ve bedelin döviz gelmesi sonucu değiştirmez. |

    | 4 | KDV''nin konusu dışında | Hizmet Türkiye''de yapılmamakta ve Türkiye''de faydalanılmamaktadır (KDVK md. 6/b). Konu
    dışı işlem istisna sayılmaz; beyannameye istisna olarak yazılmaz. |

    | 5 | Vergiye tabi; KDV 200.000 × %20 = 40.000 TL | Türkiye''den serbest bölgelere verilen hizmetler hizmet ihracı sayılmaz
    (KDVGUT II/A-2.1). Hizmet serbest bölgede verilmediğinden md. 17/4-ı istisnası da uygulanmaz. |


    **(b) Mart 2026 beyannamesi**


    1. Hesaplanan KDV: 60.000 + 40.000 = **100.000 TL**.

    2. İade hakkı doğuran işlem bedeli: 2.000.000 + 500.000 = 2.500.000 TL. Azami iade edilebilir KDV: 2.500.000 × %20 = 500.000
    TL.

    3. Yüklenilen KDV: 190.000 + 40.000 = 230.000 TL. Bu tutar azami tutarın altında ve dönemin toplam indirim KDV''si (300.000
    TL) içindedir.

    4. Yüklenilen KDV önce indirim yoluyla giderilir; iade, indirimle giderilemeyen tutarla sınırlıdır (KDVGUT IV/A3-1.1):
    300.000 − 100.000 = 200.000 TL. İade edilebilecek KDV = min(230.000; 200.000) = **200.000 TL**.

    5. Sonraki döneme devreden KDV: 300.000 − 100.000 − 200.000 = **0 TL**.


    İstisna, hizmetin ifa edildiği Mart 2026 dönemi 1 No.lu beyannamesinin "Tam İstisna Kapsamına Giren İşlemler" tablosunda
    **302** kodlu satırla beyan edilir. "Teslim ve Hizmet Tutarı" sütununa 2.500.000 TL, "Yüklenilen KDV" sütununa 230.000
    TL yazılır. 4 numaralı konu dışı işlem bu tabloya girmez.


    İstisnanın beyanı için bedelin Türkiye''ye gelmesi şart değildir. Ancak iade, hizmet bedeli döviz olarak Türkiye''ye gelmeden
    yerine getirilmez (KDVGUT II/A-2.2). 2 numaralı işlemin bedeli gelmeseydi istisna yine Mart''ta beyan edilir, ama bu işleme
    ait iade bedel Türkiye''ye gelip tevsik edilene kadar yapılmazdı.


    **(c) İade usulü (KDVGUT II/A-2.3, IV/A3-4, IV/A3-5.6)**


    - **Mahsuben iade (80.000 TL):** Hizmet ihracında 50.000 TL''yi aşmayan mahsup rapor ve teminat aranmadan yapılır. Aşan
    **30.000 TL**, vergi inceleme raporu veya YMM KDV İadesi Tasdik Raporuna göre yerine getirilir. Teminat verilirse iade
    yapılır; teminat rapor sonucuna göre çözülür.

    - **Nakden iade (120.000 TL):** Hizmet ihracında nakden iade miktara bakılmaksızın vergi inceleme raporu veya YMM raporuyla
    yerine getirilir. Teminat verilirse iade yapılır, teminat rapora göre çözülür.

    - **Artırımlı teminat:** Talep tutarının %120''si, yani 120.000 × 1,20 = **144.000 TL** banka teminat mektubu veya sigorta
    şirketi kefalet senedi verilirse iade **beş iş günü** içinde yapılır. YMM raporu iadenin yapıldığı tarihten itibaren **altı
    ay** içinde verilmezse talep ivedilikle incelemeye sevk edilir.

    - Aranan belgeler: standart iade talep dilekçesi, hizmet faturaları veya listesi, bedelin Türkiye''ye geldiğini gösteren
    ödeme belgesi, indirilecek KDV listesi, yüklenilen KDV listesi ve iadesi talep edilen KDV hesaplama tablosu.


    **(d) Yevmiye kayıtları**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 391 Hesaplanan KDV | 100.000 | |

    | 136 Diğer Çeşitli Alacaklar (KDV iade alacağı) | 200.000 | |

    | 191 İndirilecek KDV | | 300.000 |

    | 360 Ödenecek Vergi ve Fonlar (mahsup edilen borç) | 80.000 | |

    | 136 Diğer Çeşitli Alacaklar | | 80.000 |

    | 102 Bankalar (nakit iade) | 120.000 | |

    | 136 Diğer Çeşitli Alacaklar | | 120.000 |

    '
