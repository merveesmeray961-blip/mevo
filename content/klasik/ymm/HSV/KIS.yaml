  cozum: '**(a) Tevkifat (KDVGUT I/C-2.1.3)**


    Kısmi tevkifatta KDV''nin belirlenen kısmını alıcı sorumlu sıfatıyla 2 No.lu beyannameyle, kalanını satıcı 1 No.lu beyannameyle
    beyan eder. KDV dahil bedel VUK md. 232''deki sınırı (12.000 TL) aşmıyorsa tevkifat yapılmaz. KDV mükellefi olmayan ve
    belirlenmiş alıcı sayılmayanlar tevkifat yapmaz.


    | No | KDV | Tevkifat | Alıcının tevkif ettiği | Satıcının beyan ettiği |

    |---|---|---|---|---|

    | 1 | 100.000 | 9/10 (işgücü temini; KDV mükellefi alıcı) | 90.000 | 10.000 |

    | 2 | 400.000 | 4/10 (belirlenmiş alıcıya yapım işi) | 160.000 | 240.000 |

    | 3 | 600.000 | Yok: KDV dahil bedel 3.600.000 TL, 5 milyon TL''nin altında | 0 | 600.000 |

    | 4 | 1.800 | Yok: KDV dahil bedel 10.800 TL, 12.000 TL''yi aşmıyor | 0 | 1.800 |

    | 5 | 40.000 | 2/10 (karayoluyla yük taşımacılığı) | 8.000 | 32.000 |

    | 6 | 16.000 | Yok: alıcı KDV mükellefi değil ve belirlenmiş alıcı değil | 0 | 16.000 |

    | Toplam | | | **258.000** | **899.800** |


    **(b) (S)''nin Haziran 2026 beyannamesi**


    1. Hesaplanan KDV (satıcının beyan ettiği): **899.800 TL**.

    2. İndirimler hesaplanandan fazladır: 1.000.000 − 899.800 = 100.200 TL.

    3. İade hakkı doğuran tevkif edilmiş KDV 258.000 TL''dir. İade, tevkif edilen KDV''yi aşamaz ve indirimle giderilemeyen
    tutarla sınırlıdır. İade edilebilecek KDV = min(258.000; 100.200) = **100.200 TL**.

    4. Sonraki döneme devreden KDV: 1.000.000 − 899.800 − 100.200 = **0 TL**.


    **(c) İade usulü (KDVGUT I/C-2.1.5)**


    - Satıcı tevkifat uygulanmayan kısmı 1 No.lu beyannameyle beyan etmiş olmalıdır. Alıcı 2 No.lu beyannameyi vermiş ve tahakkuk
    eden KDV''yi ödemiş olmalıdır. Genel bütçe kapsamındaki idarelere yapılan işlemlerde hakedişin harcama yetkilisince onaylanması
    yeterlidir; beyan ve ödeme aranmaz.

    - İade edilmesi gereken KDV (100.200 TL), tevkifattan doğan iade beyanları toplamından (258.000 TL) küçük olduğundan iade,
    mükellefin işlem türü bazındaki tercihine göre sonuçlandırılır.

    - **Yapım işi tevkifatından nakden iade:** 50.000 TL''yi aşmayan nakden iade talepleri teminat, inceleme raporu ve YMM
    raporu aranmadan yerine getirilir. 50.000 TL ve üzerindeki talepler vergi inceleme raporu sonucuna göre veya YMM raporuyla
    yerine getirilir. 50.000 TL''yi aşan kısım (50.200 TL) için teminat verilirse teminat rapora göre çözülür.

    - **İşgücü temini tevkifatından nakden iade:** Bu iade münhasıran teminat ve/veya vergi inceleme raporuyla yerine getirilir.
    YMM raporu ancak süresinde düzenlenmiş tam tasdik sözleşmesi varsa kullanılabilir; şirkette bu sözleşme yoktur.

    - Mahsuben iade de mümkündür; tevkifattan doğan alacak KDVGUT (IV/A3-2.1.1)''de sayılan borçlara mahsup edilebilir.


    **(d) (A) A.Ş.**


    (A), tevkif ettiği 90.000 TL''yi Haziran 2026 dönemine ait 2 No.lu KDV beyannamesiyle sorumlu sıfatıyla beyan edip öder.
