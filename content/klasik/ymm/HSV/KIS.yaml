    puan: 2
  - olcut: İhracat nedeniyle yüklenilen KDV’nin 390.000 TL bulunması
    puan: 3
  - olcut: Azami iade edilebilir tutarın 600.000 TL bulunması
    puan: 2
  - olcut: İndirimle giderilemeyen KDV’nin 340.000 TL bulunması ve önce indirim ilkesinin açıklanması
    puan: 3
  - olcut: İadenin en düşük tutar olan 340.000 TL olarak belirlenmesi
    puan: 2
  - olcut: Ödenecek ve devreden KDV’nin sıfır olduğunun gerekçesiyle gösterilmesi
    puan: 4
  - olcut: Md. 12/1’deki iki ihracat teslimi şartının belirtilmesi
    puan: 2
  - olcut: İade talebi için son tarihin 31 Aralık 2028 olarak belirlenmesi
    puan: 2
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-a, 12/1, 29/1, 30/b, 30/d, 32/1
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-1.1, IV/A3-1.2
