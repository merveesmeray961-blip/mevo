      kdv_parfum = (600000 + parfum_otv)*0.20

      ind_alt = min(girdi, 60000)

      sonuc = {"indirim": ind1, "maliyet": maliyet, "hesaplanan": hes, "odenecek": odenecek, "kdv_krem": kdv_krem, "kdv_parfum":
      kdv_parfum, "indirim_varsayim": ind_alt}

