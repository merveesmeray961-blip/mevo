- id: YMM-HSV-OTV-K003
  sinav: ymm
  ders: HSV
  konu: OTV
  kazanimlar:
  - (II) sayılı listede ilk iktisap ve istisnalar
  - vergiyi doğuran olay ve matrah
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Aşağıdaki olaylarda (II) sayılı listedeki 87.03 G.T.İ.P. numaralı binek otomobilleri söz konusudur. Bu soruda 2026
    yılındaki kayıt ve tescil tarihlerinde geçerli ÖTV oranı **%70** kabul edilecek, ÖTVK md. 12/1''deki asgari tutarların
    altında kalınmadığı varsayılacaktır.


    1. Engellilik oranı %90 olan Bay (E), 10 Mart 2021''de ÖTVK md. 7/1-2 kapsamında ÖTV''den istisna olarak bir otomobil
    satın almıştır; ilk iktisaptaki ÖTV matrahı 600.000 TL''dir. Bay (E) 5 Şubat 2024''te vefat etmiştir. Mirasçıları engelli
    olmayan eşi (F) ile oğlu (G)''dir. Terekede otomobilin yanında değeri otomobille mütenasip konut ve mevduat da vardır;
    tümü VİV beyannamesine dahil edilmiştir. (F), otomobil üzerindeki mülkiyet hakkından noter onaylı belgeyle ivazsız olarak
    (G) lehine feragat etmiş ve otomobil 20 Nisan 2024''te (G) adına tescil edilmiştir.

    2. (G), otomobili 15 Şubat 2026''da engelli olmayan Bay (H)''ye satmıştır.

    3. Engellilik oranı %90 olan Bayan (K), 2023''te aynı istisnayla aldığı ve ilk iktisap matrahı 1.200.000 TL olan otomobilini
    10 Haziran 2026''da Bay (L)''ye satmıştır. Engellilik oranı %90 olan (L), 2019''da md. 7/1-2 istisnasından yararlanarak
    taşıt almıştır.

    4. Ortopedik engellilik oranı %50 olan ve bu nedenle sürücü belgesi alamayan Bay (M), 15 Haziran 2026''da yerli katkı
    oranı %40''ın üzerinde olan, hesaplanması gereken ÖTV ve diğer vergiler dahil bedeli 3.100.000 TL olan bir otomobil almak
    istemektedir.


    **İstenenler**


    (a) Otomobilin (G)''ye intikalinde ÖTV aranıp aranmayacağını gerekçesiyle açıklayınız. **(6 puan)**


    (b) 15 Şubat 2026 satışında ÖTV doğup doğmadığını, doğuyorsa mükellefi, beyan şeklini, matrahı ve vergiyi belirleyiniz.
    Satış 15 Nisan 2026''da yapılsaydı sonucun nasıl değişeceğini açıklayınız. **(8 puan)**


    (c) 3 numaralı satışı değerlendiriniz ve varsa ÖTV''yi hesaplayınız. (K)''nin yeniden istisnadan ne zaman yararlanabileceğini
    belirtiniz. **(6 puan)**


    (d) Bay (M)''nin istisnadan yararlanıp yararlanamayacağını açıklayınız. **(5 puan)**

    '
  cozum: '**(a) (G)''ye intikal**


    ÖTVK md. 15/2-a''ya göre istisnayla ilk iktisabı yapılan taşıtların veraset yoluyla intikalinde ÖTV aranmaz. Terekede
    taşıt dışında mütenasip değerde ve VİV beyannamesine dahil edilmiş başka mal ve haklar bulunduğundan, diğer mirasçının
    noter onaylı ivazsız feragatiyle taşıtın tek mirasçıya intikali de "veraset yoluyla intikal" sayılır (ÖTV (II) Sayılı
