- id: YMM-HSV-OTV-K006
  sinav: ymm
  ders: HSV
  konu: OTV
  kazanimlar:
  - ÖTV listeleri
  - vergiyi doğuran olay ve matrah
  - ÖTV'nin KDV matrahına etkisi
  - ihracat istisnası ve iade
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Sigara imalatçısı **(T) Tütün A.Ş.**, Haziran 2026''da perakende satışı bulunmayan pazarlama şirketi **(P) Pazarlama
    A.Ş.**''ye aşağıdaki teslimleri yapmıştır (her paket 20 adet sigaradır):


    | Marka | Paket | Perakende satış fiyatı (paket) | (T)''nin satış bedeli (ÖTV ve KDV hariç, paket) |

    |---|---|---|---|

    | K | 10.000 | 120 TL | 15 TL |

    | L | 20.000 | 90 TL | 12 TL |


    **(B) İçecek A.Ş.** ise Haziran 2026''da 50.000 kutu kolalı gazozu, ÖTV ve KDV hariç kutu başına 10 TL''ye teslim etmiştir.


    Bu soruda aşağıdaki oran ve tutarlar kabul edilecektir:

    - Sigara: nispi vergi oranı %50; asgari maktu vergi tutarı sigara başına 2,50 TL; maktu vergi tutarı paket başına 6,00
    TL.

    - Kolalı gazoz: nispi vergi oranı %25; hesaplanan nispi vergi asgari maktu tutarın üzerindedir.

    - KDV oranı tüm işlemler için %20''dir. KDV, ÖTV tebliğindeki fatura örneğinde olduğu gibi satış bedeline hesaplanan ÖTV
    eklenerek bulunacaktır.


    Ek bilgi: (P), (T)''den aldığı K markalı sigaraların 1.000 paketini Temmuz''da aynen ihraç etmiştir. (C) Ltd. ise (P)''den
    satın aldığı 500 paketi ihraç etmiştir.


    **İstenenler**


    (a) K ve L markaları için paket başına ve toplam ÖTV''yi hesaplayınız; sigarada matrahı ve asgari maktu vergi kuralını
    açıklayınız. **(8 puan)**


    (b) K markası teslimine ait faturadaki KDV matrahını, KDV''yi ve genel toplamı bulunuz; (T)''nin bu satışa ilişkin yevmiye
    kaydını yapınız. L markası için KDV''yi hesaplayınız. **(7 puan)**


    (c) (B)''nin ÖTV''sini ve KDV''sini hesaplayınız. (T) ve (B)''nin Haziran ÖTV''sini hangi süreyle beyan edeceğini belirtiniz.
    **(5 puan)**


    (d) (P) ve (C)''nin ihracatta ÖTV iadesi talep edip edemeyeceğini açıklayınız. (T) sigara teslimlerinde ÖTV''yi KDV matrahına
    eklemeseydi ne kadar eksik KDV beyan etmiş olurdu? **(5 puan)**

    '
  cozum: '**(a) Sigarada ÖTV (ÖTVK md. 11/4, 11/5; ÖTV (III) Sayılı Liste Uygulama Tebliği III/B-2.1)**


    (III) sayılı listenin (B) cetvelinde matrah, perakende satış fiyatıdır. Nispi vergi, paketteki sigara adedine göre hesaplanan
    asgari maktu vergiden az olamaz; ikisinden yüksek olana paket başına maktu vergi eklenir.


    | | K | L |

    |---|---|---|

    | Nispi vergi (PSF × %50) | 60,00 | 45,00 |

    | Asgari maktu vergi (20 × 2,50) | 50,00 | 50,00 |

    | Dikkate alınan | 60,00 (nispi yüksek) | 50,00 (asgari yüksek) |

    | Maktu vergi | 6,00 | 6,00 |

    | Paket başına ÖTV | **66,00** | **56,00** |

    | Toplam ÖTV | 10.000 × 66 = **660.000** | 20.000 × 56 = **1.120.000** |


    Toplam sigara ÖTV''si: **1.780.000 TL**.


    **(b) Fatura ve kayıt (K markası)**


    | Kalem | Tutar (TL) |

    |---|---|

    | Satış bedeli (10.000 × 15) | 150.000 |

    | ÖTV matrahı (10.000 × 120) | 1.200.000 |

    | Hesaplanan ÖTV | 660.000 |

    | KDV matrahı (150.000 + 660.000) | 810.000 |

    | KDV (%20) | 162.000 |

    | Genel toplam | 972.000 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 120 Alıcılar | 972.000 | |

    | 600 Yurt İçi Satışlar | | 150.000 |

    | 360 Ödenecek Vergi ve Fonlar (ÖTV) | | 660.000 |

    | 391 Hesaplanan KDV | | 162.000 |


    L markası: KDV matrahı 240.000 + 1.120.000 = 1.360.000 TL; KDV **272.000 TL**.


    **(c) Kolalı gazoz ve beyan süresi**


    - (III) sayılı listenin (A) cetvelinde matrah, ÖTV hariç KDV matrahıdır (md. 11/3): 50.000 × 10 = 500.000 TL. ÖTV 500.000
    × %25 = **125.000 TL**.

    - KDV matrahı 500.000 + 125.000 = 625.000 TL; KDV **125.000 TL**.

    - (III) sayılı listedeki mallarda vergilendirme dönemi aylıktır. Haziran dönemi ÖTV''si izleyen ayın 15''inci günü akşamına
    kadar beyan edilip ödenir (md. 14). 15 Temmuz 2026 resmî tatil olduğundan süre VUK md. 18 uyarınca izleyen ilk iş günü
    olan **16 Temmuz 2026** akşamı sona erer. ÖTV faturada ayrıca gösterilir (md. 15/1).


    **(d) İhracatta iade ve eksik KDV**


    - **(P):** ÖTV mükellefi (T)''den ÖTV''li aldığı malı aynen ihraç ettiğinden, faturada gösterilen ve beyan edilen ÖTV
    iade edilir (md. 5/3): 1.000 × 66 = **66.000 TL**.

    - **(C):** ÖTV uygulanan safhadan sonraki satıcıdan, yani (P)''den alınan malda fiyata dahil ÖTV iade edilmez.

    - **Eksik KDV:** ÖTV KDV matrahına dahildir (KDVK md. 24/b). Eklenmeseydi eksik KDV (660.000 + 1.120.000) × %20 = **356.000
    TL** olurdu.

    '
