    puan: 3
  - olcut: Toplam bedelin 2.244.000 TL bulunması
    puan: 1
  - olcut: Kamyonet ÖTV matrahının iskonto düşülüp taşıma eklenerek 790.000 TL bulunması ve md. 12/1 alt sınırının kontrolü
    puan: 3
  - olcut: ÖTV’nin 31.600 TL, KDV’nin 164.320 TL bulunması
    puan: 3
  - olcut: 'Md. 15/2-b’nin uygulanması: beş yıllık süre, ilk iktisap matrahı, yeni oran ve önceki verginin mahsubu'
    puan: 3
  - olcut: Dönüşüm ÖTV’sinin 442.400 TL bulunması ve Bay (T)’den tescil tarihinde alınması
    puan: 3
  - olcut: Mükellefin bayi olduğu ile beyan yeri ve zamanı ve aynı gün ödeme (md. 4/1-b, 14/2)
    puan: 3
  - olcut: Tescil görevlilerinin belge arama zorunluluğu ve müteselsil sorumluluğu (md. 13/3)
    puan: 2
