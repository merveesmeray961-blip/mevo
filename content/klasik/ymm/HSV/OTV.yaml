  soru: '**(K) Kozmetik A.Ş.** kozmetik ürünleri imal etmektedir. Bu soruda (IV) sayılı listedeki parfüm ve tuvalet suları
    (3303.00) ile cilt bakımı müstahzarları (33.04) için ÖTV oranı **%20**, KDV oranı **%20** kabul edilecektir.


    Şirket Ekim 2026''da ÖTV mükellefi (A) Esans A.Ş.''den, (IV) sayılı listede yer alan dökme parfümü 400.000 TL + 80.000
    TL ÖTV + KDV karşılığında satın almıştır. Dökme parfüm Ekim''de tamamen kullanılmıştır:


    | Kullanım | Pay | Üretilen ürün ve teslimi (Ekim 2026) |

    |---|---|---|

    | 1 | %60 | Parfümlü vücut kremi (33.04); yurt içinde 900.000 TL''ye (ÖTV ve KDV hariç) satıldı |

    | 2 | %25 | Kolonya (3303.00.90.00.11); yurt içinde 250.000 TL''ye satıldı |

    | 3 | %15 | Parfümlü vücut kremi (33.04); yurt dışındaki müşteriye 200.000 TL''ye ihraç edildi |


    Şirket ayrıca ÖTV''siz hammaddelerden ürettiği parfümü (3303) yurt içinde 600.000 TL''ye (ÖTV ve KDV hariç) satmıştır.


    **İstenenler**


    (a) Her kullanımda dökme parfüm için ödenen ÖTV''nin indirim konusu yapılıp yapılamayacağını gerekçesiyle açıklayınız;
    indirilecek tutarı ve maliyete atılacak tutarı bulunuz. **(10 puan)**


    (b) (K)''nin Ekim 2026 hesaplanan ÖTV''sini, ÖTV indirimini ve ödenecek ÖTV''yi bulunuz; beyan ve ödeme süresini belirtiniz.
    **(5 puan)**


    (c) Yurt içinde satılan vücut kremi ile parfümün KDV matrahını ve KDV''sini hesaplayınız; vücut kremi satışının yevmiye
    kaydını yapınız. **(6 puan)**


    (d) Kolonyanın ÖTV karşısındaki durumunu G.T.İ.P. esasıyla açıklayınız. Dökme parfümün tamamı yurt içinde satılan vücut
    kremine girseydi ve kremin hesaplanan ÖTV''si 60.000 TL olsaydı indirim ne olurdu? **(4 puan)**

    '
  cozum: '**(a) ÖTVK md. 9''a göre indirim**


    ÖTV''ye tabi bir mal, yer aldığı listedeki başka bir malın imalinde kullanılırsa ödenen vergi, imal edilen malın tesliminde
    hesaplanan ÖTV''den indirilir. İndirim, ödenen ÖTV''yi ve üretilen malın hesaplanan ÖTV''sini aşamaz; indirilemeyen kısım
    iade edilmez, maliyet veya gider unsurudur. İmal edilen mal istisna kapsamında teslim edilirse girdiye ait ÖTV indirilemez
    (ÖTV (IV) Sayılı Liste Uygulama Tebliği II/D).


    | Kullanım | Girdi ÖTV''si | İndirim | Maliyet | Gerekçe |

    |---|---|---|---|---|

    | 1 | 80.000 × %60 = 48.000 | **48.000** | — | Krem (33.04) aynı (IV) sayılı listededir; kremin ÖTV''si 180.000 TL olduğundan
    sınır aşılmaz. |

    | 2 | 80.000 × %25 = 20.000 | — | **20.000** | Kolonya listede değildir; ÖTV''ye tabi olmayan malın imalinde kullanılmıştır.
    |

    | 3 | 80.000 × %15 = 12.000 | — | **12.000** | Krem ihracat istisnası kapsamında teslim edilmiştir. |

    | Toplam | 80.000 | 48.000 | 32.000 | |


    **(b) Ekim 2026 ÖTV beyannamesi**


    1. Hesaplanan ÖTV: vücut kremi 900.000 × %20 = 180.000 TL; parfüm 600.000 × %20 = 120.000 TL; toplam **300.000 TL**. İhraç
    edilen krem istisnadır (md. 5/1); kolonya vergi dışıdır.

    2. ÖTV indirimi: **48.000 TL**.

    3. Ödenecek ÖTV: 300.000 − 48.000 = **252.000 TL**.

    4. (IV) sayılı listede dönem aylıktır; beyan ve ödeme **15 Kasım 2026** akşamına kadar yapılır (md. 14). Tatil gününe
    rastlarsa izleyen ilk iş günü sona erer.


    **(c) KDV**


    - Vücut kremi: KDV matrahı 900.000 + 180.000 = 1.080.000 TL; KDV **216.000 TL**.

    - Parfüm: KDV matrahı 600.000 + 120.000 = 720.000 TL; KDV **144.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 120 Alıcılar | 1.296.000 | |

    | 600 Yurt İçi Satışlar | | 900.000 |

    | 360 Ödenecek Vergi ve Fonlar (ÖTV) | | 180.000 |

    | 391 Hesaplanan KDV | | 216.000 |


    **(d) Kolonya ve indirim sınırı**


    Malın listeye girip girmediği G.T.İ.P. numarasına göre belirlenir. (IV) sayılı listenin 3303.00 pozisyonu parfüm ve tuvalet
    sularını kapsar; 3303.00.90.00.11 G.T.İ.P. numaralı kolonyalar listeden hariç tutulmuştur. Bu nedenle kolonya teslimi
    ÖTV''ye tabi değildir ve imalinde kullanılan girdinin ÖTV''si indirilemez.


    Varsayımda indirim, üretilen malın hesaplanan ÖTV''sini aşamaz: indirim = min(80.000; 60.000) = **60.000 TL**. Kalan 20.000
    TL iade edilmez, maliyet unsurudur.

    '
