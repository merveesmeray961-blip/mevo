    | Maktu vergi | 6,00 | 6,00 |

    | Paket başına ÖTV | **66,00** | **56,00** |

    | Toplam ÖTV | 10.000 × 66 = **660.000** | 20.000 × 56 = **1.120.000** |


    Toplam sigara ÖTV''si: **1.780.000 TL**.


