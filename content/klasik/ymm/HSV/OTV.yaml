  dogrulama:
    python: "a_matrah = max(1150000, 1200000, 1200000)\na_otv = a_matrah * 60 // 100\na_kdv_matrah = 1150000 + a_otv\na_kdv\
      \ = a_kdv_matrah * 20 // 100\nc_matrah = max(800000 - 20000 + 10000, 700000, 650000)\nc_otv = c_matrah * 4 // 100\n\
      c_kdv = (c_matrah + c_otv) * 20 // 100\ndonusum = c_matrah * 60 // 100 - c_otv\nsonuc = {\n    \"a_otv_matrah\": a_matrah,\n\
      \    \"a_otv\": a_otv,\n    \"a_kdv_matrah\": a_kdv_matrah,\n    \"a_kdv\": a_kdv,\n    \"a_toplam\": 1150000 + a_otv\
      \ + a_kdv,\n    \"c_otv_matrah\": c_matrah,\n    \"c_otv\": c_otv,\n    \"c_kdv\": c_kdv,\n    \"donusum_otv\": donusum,\n\
      }\n"
