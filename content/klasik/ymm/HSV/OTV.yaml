  soru: '**(O) Otomotiv A.Ş.**, resmî şekilde düzenlenmiş sözleşmesi bulunan yetkili bayi olarak (II) sayılı listedeki kayıt
    ve tescile tabi araçların satışını yapmaktadır. Bu soruda aşağıdaki oranlar kabul edilecektir: 87.03 G.T.İ.P. numaralı
    otomobiller için ÖTV %60, 87.04 G.T.İ.P. numaralı kamyonetler için ÖTV %4, KDV %20. Hesaplanan ÖTV tutarları asgari maktu
    vergi tutarlarının üzerindedir.


    1. **Otomobil (A):** Bayinin imalatçıdan alış bedeli ve imalatçının satış bedeli 1.200.000 TL’dir (KDV hariç). Teslimden
    önce bayiye herhangi bir indirim yapılmamıştır. Bayi aracı 10 Ekim 2026’da kampanya kapsamında Bay (M)’ye ÖTV ve KDV hariç
    1.150.000 TL’ye satmıştır.

    2. **Kamyonet (C):** Bayinin alış bedeli 700.000 TL, imalatçının satış bedeli 650.000 TL’dir. Bayi aracı 20 Ekim 2026’da
    Bay (T)’ye satmıştır. Faturada satış bedeli 800.000 TL, ticari teamüllere uygun iskonto 20.000 TL ve bayinin aracı Bay
    (T)’nin gösterdiği adrese teslimi için taşıma bedeli 10.000 TL olarak gösterilmiştir.

    3. Bay (T), Mart 2027’de kamyoneti 87.03 G.T.İ.P. numaralı binek otomobile dönüştürmüş ve değişiklik kendi adına kayıt
    ve tescil edilmiştir. Tescil tarihinde dönüştürülen araç için geçerli ÖTV oranı %60’tır.


    **İstenenler**


    (a) Otomobil (A) için ÖTV matrahını ve ÖTV’yi, KDV matrahını ve KDV’yi hesaplayınız; Bay (M)’nin ödeyeceği toplam bedeli
    bulunuz. **(8 puan)**


    (b) Kamyonet (C) için ÖTV matrahını, ÖTV’yi ve KDV’yi hesaplayınız. **(6 puan)**


    (c) 3 numaralı dönüşüm nedeniyle ÖTV doğup doğmadığını açıklayınız; doğuyorsa tutarını, kimden ve hangi tarihte alınacağını
    belirtiniz. **(6 puan)**


    (d) Otomobil (A) ve kamyonet (C) satışlarına ait ÖTV’nin mükellefini, beyan yerini ve zamanını, ödeme zamanını açıklayınız.
    Kayıt ve tescil işlemini yapan görevlilerin bu verginin ödenmesi bakımından yükümlülüğünü belirtiniz. **(5 puan)**

    '
  cozum: '**(a) Otomobil (A)**


    - ÖTVK md. 12/1: (II) sayılı listedeki mallardan alınacak vergi, mükellefin alış bedeli ile her hâlükârda imalatçının
    satış bedeli üzerinden hesaplanan vergiden az olamaz.

    - Satış bedeli (1.150.000) alış bedelinin (1.200.000) altındadır ve teslimden önce indirim yapılmamıştır. Bu nedenle ÖTV
    matrahı **1.200.000 TL**’dir.

    - ÖTV = 1.200.000 × %60 = **720.000 TL**.

    - KDV matrahı: Bedel ile birlikte ÖTV de matraha girer (KDVK md. 20, 24/b): 1.150.000 + 720.000 = **1.870.000 TL**. KDV
    = **374.000 TL**.

    - Bay (M)’nin ödeyeceği toplam bedel: 1.150.000 + 720.000 + 374.000 = **2.244.000 TL**.


    **(b) Kamyonet (C)**


    - ÖTVK md. 11/3: Matrah, ÖTV hariç KDV matrahını oluşturan unsurlardan oluşur. Taşıma gideri dahil edilir (KDVK 24/a);
    ticari teamüle uygun iskonto düşülür (KDVK 25/a).

    - ÖTV matrahı: 800.000 − 20.000 + 10.000 = **790.000 TL**. Bu tutar alış bedelinden (700.000) ve imalatçı satış bedelinden
    (650.000) yüksek olduğundan md. 12/1 alt sınırı sonucu değiştirmez.

    - ÖTV = 790.000 × %4 = **31.600 TL**.

    - KDV matrahı: 790.000 + 31.600 = 821.600 TL. KDV = **164.320 TL**.


    **(c) Dönüşüm**


    - ÖTVK md. 15/2-b: (II) sayılı listedeki kayıt ve tescile tabi mallar ilk iktisaptan itibaren beş yıl içinde 87.03 pozisyonundaki
    mallara dönüştürülürse vergi alınır. Matrah ilk iktisaptaki matrahtır; daha önce ödenen vergi mahsup edilir; dönüştürülen
    mal için geçerli oran uygulanır. Vergi, adına kayıt ve tescil işlemi yapılandan, değişikliğin kayıt ve tescil tarihinde
    alınır.

    - Dönüşüm ilk iktisaptan (Ekim 2026) yaklaşık 5 ay sonra yapıldığı için beş yıllık süre içindedir.

    - ÖTV = 790.000 × %60 − 31.600 = 474.000 − 31.600 = **442.400 TL**. Vergi **Bay (T)**’den, değişikliğin **kayıt ve tescil
    tarihinde** alınır.


    **(d) Mükellef, beyan ve ödeme**


    - Mükellef: Kayıt ve tescile tabi (II) sayılı liste mallarında motorlu araç ticareti yapanlardır (md. 4/1-b). Olayda mükellef
    (O) Otomotiv A.Ş.’dir.

    - Beyan ve ödeme: Beyanname, ilk iktisaba ilişkin işlemler tamamlanmadan önce işlemlerin yapıldığı yer vergi dairesine
    verilir; vergi aynı gün ödenir (md. 14/2). Aylık beyan süresi bu mallar için uygulanmaz.

    - Tescil görevlileri: Md. 13/3’e göre kayıt ve tescile yetkili memurlar, işlemden önce ÖTV’nin ödendiğini gösteren belgeleri
    aramak zorundadır. Bu yükümlülüğe uymadan işlem yapanlar, ziyaa uğratılan vergi, vergi cezası ve gecikme faizinden mükellefle
    birlikte müteselsilen sorumludur; ödedikleri tutarlar için mükellefe rücu edebilirler.

    '
