    | 600 Yurt İçi Satışlar | | 150.000 |

    | 360 Ödenecek Vergi ve Fonlar (ÖTV) | | 660.000 |

    | 391 Hesaplanan KDV | | 162.000 |


    L markası: KDV matrahı 240.000 + 1.120.000 = 1.360.000 TL; KDV **272.000 TL**.


    **(c) Kolalı gazoz ve beyan süresi**


    - (III) sayılı listenin (A) cetvelinde matrah, ÖTV hariç KDV matrahıdır (md. 11/3): 50.000 × 10 = 500.000 TL. ÖTV 500.000
    × %25 = **125.000 TL**.

    - KDV matrahı 500.000 + 125.000 = 625.000 TL; KDV **125.000 TL**.

    - (III) sayılı listedeki mallarda vergilendirme dönemi aylıktır. Haziran dönemi ÖTV''si izleyen ayın 15''inci günü akşamına
