    (III) sayılı listenin (B) cetvelinde matrah, perakende satış fiyatıdır. Nispi vergi, paketteki sigara adedine göre hesaplanan
    asgari maktu vergiden az olamaz; ikisinden yüksek olana paket başına maktu vergi eklenir.


