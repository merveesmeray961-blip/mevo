- id: YMM-HSV-OTV-K002
  sinav: ymm
  ders: HSV
  konu: OTV
  kazanimlar:
  - (I) sayılı listede iade
  - vergiyi doğuran olay ve matrah
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Sanayi sicil belgesine sahip **(B) Boya Sanayi A.Ş.**, ÖTV mükellefi **(A) Petrol A.Ş.**''den 20 Ocak 2026''da (I)
    sayılı listenin (B) cetvelinde yer alan 10.000 kg white spirit (solvent) satın almıştır. (A)''nın faturasında ÖTV ayrıca
    gösterilmiş ve beyan edilerek ödenmiştir. Bu soruda aşağıdaki veriler kabul edilecektir:


    - Faturadaki ÖTV: 5,00 TL/kg (toplam 50.000 TL).

    - 2012/3792 sayılı Kararname eki Kararın 1 inci maddesinde white spirit için belirlenen oran: %0,75.


    White spirit''in kullanımı:


    | Kullanım | Miktar | Açıklama |

    |---|---|---|

    | Şubat 2026 | 4.000 kg | (I) sayılı listeye dahil olmayan boya imalatında girdi olarak kullanıldı |

    | Şubat 2026 | 500 kg | Üretim makinelerinin temizliğinde kullanıldı; ürünün bünyesine girmedi |

    | Ocak 2027 | 3.000 kg | Boya imalatında girdi olarak kullanıldı |

    | Mart 2027 | 2.500 kg | Boya imalatında girdi olarak kullanıldı |


    **İstenenler**


    (a) Her kullanım için ÖTV iadesi talep edilip edilemeyeceğini gerekçesiyle açıklayınız ve iade tutarlarını hesaplayınız.
    **(10 puan)**


    (b) İadenin hangi vergi dairesinden ve hangi süreler içinde talep edilebileceğini, Şubat 2026 ve Ocak 2027 kullanımları
    için ayrı ayrı belirtiniz. **(6 puan)**


    (c) Şubat 2026 kullanımına ilişkin iade alacağının yevmiye kaydını yapınız. Solventin ÖTV dahil alış bedeli 150 İlk Madde
    ve Malzeme hesabına alınmış, Şubat''ta 710 Direkt İlk Madde ve Malzeme Giderleri hesabına aktarılmıştır. **(4 puan)**


    (d) (A)''nın bu teslim için ÖTV''yi hangi dönemde ve ne zamana kadar beyan edip ödeyeceğini belirtiniz. (B) solventi boya
    imalatı yerine akaryakıt olarak satsaydı ÖTVK md. 13/2''ye göre sonucun ne olacağını açıklayınız. **(5 puan)**

    '
  cozum: '**(a) İade hakkı ve tutarlar**


    (I) sayılı listenin (B) cetvelindeki mallar sanayi sicil belgeli imalatçılarca listeye dahil olmayan malların imalinde
    kullanılırsa, ödenen ÖTV ile Kararname oranına göre hesaplanan ÖTV arasındaki fark iade edilir. Mal, satın alma tarihini
    takip eden aybaşından itibaren **12 ay** içinde imalatta kullanılmalıdır (ÖTV (I) Sayılı Liste Uygulama Tebliği, 1.1.2–1.1.4).
    Bünyeye girmeyen yardımcı madde ve sarf malzemesi olarak kullanılan malların ÖTV''si iade edilmez.


    Süre: Alış 20 Ocak 2026 → başlangıç 1 Şubat 2026 → 12 ayın sonu 31 Ocak 2027.


    Kilogram başına iade: 5,00 − (5,00 × %0,75) = 5,00 − 0,0375 = 4,9625 TL.


    | Kullanım | İade | Gerekçe |

    |---|---|---|

    | Şubat 2026, 4.000 kg | 4.000 × 4,9625 = **19.850,00 TL** | 12 ay içinde, listeye dahil olmayan malın bünyesine giriyor.
    |

    | Şubat 2026, 500 kg | Yok | Temizlik amaçlı; ürünün bünyesine girmiyor. 2.500 TL ÖTV maliyet unsurudur. |

    | Ocak 2027, 3.000 kg | 3.000 × 4,9625 = **14.887,50 TL** | 12''nci ay içinde kullanılmıştır, süre içindedir. |

    | Mart 2027, 2.500 kg | Yok | 12 aylık süre (31 Ocak 2027) geçtikten sonra kullanılmıştır. |


    Toplam iade: 19.850,00 + 14.887,50 = **34.737,50 TL**.


    **(b) İade talebinin yeri ve süresi**


    İade, (B)''nin KDV yönünden bağlı bulunduğu vergi dairesinden istenir. Talepler kullanımı takip eden aybaşından itibaren,
    en az birer aylık dönemler itibarıyla o dönemdeki kullanımlar için yapılır.


    - **Şubat 2026 kullanımı:** 1 Mart 2026''dan 12 aylık sürenin sonu olan **31 Ocak 2027**''ye kadar talep edilebilir.

    - **Ocak 2027 kullanımı:** 12''nci ay içindeki kullanım olduğundan talep, bu ayı takip eden ayın sonuna kadar, yani 1
    Şubat – **28 Şubat 2027** arasında yapılabilir. Bu süreler geçtikten sonra iade talep edilemez.

    - Sürelerin son günü resmî tatile rastlarsa (31 Ocak 2027 ve 28 Şubat 2027 pazar günüdür) süre VUK md. 18 uyarınca izleyen
    ilk iş günü sona erer.


    **(c) Yevmiye kaydı (Şubat 2026)**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 136 Diğer Çeşitli Alacaklar (ÖTV iade alacağı) | 19.850,00 | |

    | 710 Direkt İlk Madde ve Malzeme Giderleri | | 19.850,00 |


    İade alacağı, ilk madde maliyetine dahil edilen ÖTV''nin iadesi olduğundan maliyetten düşülür. Maliyet hesapları kapatıldıktan
    sonra kesinleşen iadeler 649 Diğer Olağan Gelir ve Kârlar hesabına alınabilir.


    **(d) (A)''nın beyanı ve vergi ziyaı**


    (I) sayılı listede vergilendirme dönemi ayın 1–15''i ve 16''sından ay sonuna kadar olan dönemlerdir. Beyan ve ödeme dönemi
    izleyen 10''uncu gün yapılır (ÖTVK md. 14). 20 Ocak teslimi 16–31 Ocak dönemine girer; vergi **10 Şubat 2026**''ya kadar
    beyan edilip ödenir.


    ÖTVK md. 13/2''ye göre (I) sayılı listedeki malı teslim alan kişi, malı daha yüksek vergili bir mal olarak kullanır veya
    satarsa, ziyaa uğratılan vergi ilgili malı teslim alan adına tarh edilir ve VUK md. 344''e göre vergi ziyaı cezası kesilir.
    (B) solventi akaryakıt olarak satsaydı, akaryakıt ile solvent arasındaki vergi farkı (B) adına tarh edilir ve ceza kesilirdi.
    Bu durumda iade hakkı da olmazdı. Kayıt dışı satış ayrıca VUK md. 359 kaçakçılık yönünden değerlendirilir.

    '
