    olan **16 Temmuz 2026** akşamı sona erer. ÖTV faturada ayrıca gösterilir (md. 15/1).


    **(d) İhracatta iade ve eksik KDV**


    - **(P):** ÖTV mükellefi (T)''den ÖTV''li aldığı malı aynen ihraç ettiğinden, faturada gösterilen ve beyan edilen ÖTV
