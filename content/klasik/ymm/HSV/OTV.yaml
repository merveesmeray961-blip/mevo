- id: YMM-HSV-OTV-K007
  sinav: ymm
  ders: HSV
  konu: OTV
  kazanimlar:
  - ÖTV listeleri
  - vergiyi doğuran olay ve matrah
  - ÖTV'nin KDV matrahına etkisi
  zorluk: 3
  puan: 25
