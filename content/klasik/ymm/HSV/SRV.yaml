- id: YMM-HSV-SRV-K002
  sinav: ymm
  ders: HSV
  konu: SRV
  kazanimlar:
  - veraset ve intikal vergisi
  - borç ve masrafların indirimi
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: 'İstanbul''da ikamet eden **Bay (A)**''nın ailesine ilişkin 2026 yılı olayları aşağıdadır. 57 Seri No.lu VİV Genel
    Tebliği ile 2026 yılında uygulanan tutarlar kullanılacaktır: ivazsız intikaller ile yarışma, çekiliş ve şans oyunu ikramiyelerinde
    istisna 66.935 TL. İvazsız intikal tarifesi: ilk 3.000.000 TL %10, sonraki 7.000.000 TL %15, sonraki 15.000.000 TL %20,
    sonraki 30.000.000 TL %25, 55.000.000 TL''yi aşan kısım %30.


    1. Bay (A), 10 Mart 2026''da oğlu (C)''ye bir konutu bağışlamış, konut aynı gün tapuda (C) adına tescil edilmiştir. Konutun
    emlak vergisi değeri 4.000.000 TL, piyasa değeri 9.000.000 TL''dir. Konut üzerinde 1.000.000 TL''lik banka kredisi ipoteği
    vardır; bağış sözleşmesine göre borcu (C) üstlenmiştir.

    2. Bay (A), aynı gün yeğeni (D)''ye banka hesabından 4.000.000 TL havale ederek bağışta bulunmuştur.

    3. (C), 25 Nisan 2026''da yapılan bir şans oyunu çekilişinde 5.000.000 TL ikramiye kazanmıştır.

    4. Bay (A)''nın kızı (E), trafik kazasında yaralanması nedeniyle mahkeme kararıyla 500.000 TL manevi tazminat almıştır.

    5. (D)''ye düğününde örf ve adete göre 150.000 TL değerinde altın takılmıştır.


    **İstenenler**


    (a) (C)''nin bağış nedeniyle VİV matrahını ve vergisini hesaplayınız; konutun değerlemesini ve borcun indirimini dayanağıyla
    açıklayınız. **(8 puan)**


    (b) (D)''nin VİV matrahını ve vergisini hesaplayınız. **(5 puan)**


    (c) Şans oyunu ikramiyesinde verginin matrahını, tutarını, kim tarafından ve hangi sürede beyan edilip ödeneceğini belirtiniz.
    **(6 puan)**


    (d) 4 ve 5 numaralı intikallerin VİV karşısındaki durumunu açıklayınız. (C) ve (D)''nin beyanname verme süresini, verginin
    tarh yerini ve ödeme zamanını belirtiniz. **(6 puan)**

    '
  cozum: '**(a) (C)''nin bağış yoluyla iktisabı**


    - Gayrimenkuller emlak vergisi değeriyle değerlenir (VİVK md. 10/b). Değer **4.000.000 TL**''dir; piyasa değeri dikkate
    alınmaz.

    - Diğer suretle iktisaplarda intikal eden malın aynına ait borçlar indirilir. Bağışlayan borcu kendi üzerine almışsa indirilmez
    (md. 12/b). Borcu (C) üstlendiğinden 1.000.000 TL indirilir.

    - İvazsız intikal istisnası: 66.935 TL (md. 4/d).

    - Matrah: 4.000.000 − 1.000.000 − 66.935 = **2.933.065 TL**.

    - Babadan oğula ivazsız intikalde ivazsız tarifenin yarısı uygulanır (md. 16/2): ilk dilim oranı %5.

    - Vergi: 2.933.065 × %5 = **146.653,25 TL**.


    **(b) (D)''nin bağış yoluyla iktisabı**


    Yeğen ana, baba, eş veya çocuk olmadığından tam ivazsız tarife uygulanır.


    - Matrah: 4.000.000 − 66.935 = **3.933.065 TL**.

    - Vergi: 3.000.000 × %10 = 300.000 TL; 933.065 × %15 = 139.959,75 TL; toplam **439.959,75 TL**.


    **(c) Şans oyunu ikramiyesi**


    - İkramiyenin 66.935 TL''si istisnadır (md. 4/e). Matrah: 5.000.000 − 66.935 = **4.933.065 TL**.

    - Şans oyunu ikramiyelerinde oran %20''dir (md. 16): vergi **986.613 TL**.

    - Vergi, şans oyununu düzenleyen tarafından ikramiyeden kesilerek çekilişin yapıldığı günü takip eden ayın 20''nci günü
    akşamına kadar (**20 Mayıs 2026**) beyan edilir (md. 9/3). Kesilen vergi beyanname verme süresi içinde ödenir (md. 19).


    **(d) Diğer intikaller ve usul**


    - **Manevi tazminat:** VİVK md. 2''ye göre maddi ve manevi tazminatlar ivazsız intikal sayılmaz; **VİV doğmaz**.

    - **Düğün takısı:** Örf ve adete göre verilmesi mutat hediyeler, gayrimenkuller hariç, istisnadır (md. 4/c); **vergi doğmaz**.

    - **Beyanname süresi:** Diğer suretle intikallerde malların hukuken iktisap edildiği tarihi takip eden **bir ay** içinde
    verilir (md. 9/2): 10 Nisan 2026''ya kadar.

    - **Tarh yeri:** İvazsız intikalde vergi, tasarruf edenin, yani Bay (A)''nın ikametgâhının bulunduğu yer vergi dairesince
    tarh edilir.

    - **Ödeme:** Vergi tahakkukundan itibaren **üç yılda**, her yıl Mayıs ve Kasım aylarında iki eşit taksitte, toplam altı
    taksitte ödenir (md. 19).

    '
  puanlama:
  - olcut: Konutun emlak vergisi değeriyle değerlenmesi (md. 10/b)
