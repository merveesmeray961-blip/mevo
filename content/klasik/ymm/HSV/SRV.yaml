    | Almanya''daki bankada bulunan mevduat (Bakanlıkça tespit edilen kurla TL karşılığı) | 1.500.000 |

    | Murisin ticari taşıtı (rayiç bedel) | 1.000.000 |

    | Murisin ihticaca salih belgeye dayanan banka kredi borcu | 400.000 |

    | Cenazenin techiz ve tedfini için yapılan masraflar | 50.000 |

    | Almanya''daki mevduat nedeniyle Almanya''da alınan ve belgelenen miras vergisi | 90.000 |


    Borç ve masrafların tamamı beyannamede gösterilmiş olup, belirli bir mala bağlı olmadıkları için vergiye tabi mallardan
    tenzil edilecektir.


    **İstenenler**


    (a) Vergiye tabi iktisapları ve istisnaları belirleyiniz; borç ve masrafları tenzil ederek VİV matrahını bulunuz. **(8
    puan)**


    (b) Ödenecek veraset ve intikal vergisini hesaplayınız. **(7 puan)**


    (c) Verginin ödeme zamanını ve taksit tutarını belirtiniz. **(4 puan)**


    (d) Beyanname verme süresinin son gününü bulunuz; mirasçı Almanya''da yaşıyor olsaydı süre ne olurdu? Bayan (Z) mesken
    taşınmazı vergi ödenmeden satmak isterse hangi kural uygulanır? **(6 puan)**

    '
  cozum: '**(a) Matrah**


    - Türkiye vatandaşına ait mallar yurt dışında bulunsa da VİV''e tabidir (md. 1); Almanya''daki mevduat vergiye tabidir.

    - Veraset yoluyla intikal eden ev eşyası ve zat eşyası (md. 4/a) ile 2863 sayılı Kanun kapsamındaki tescilli taşınmaz
    kültür varlıklarının veraset yoluyla iktisabı (md. 4/m) istisnadır.

    - Gayrimenkuller emlak vergisine esas değerle, menkul mallar rayiç bedelle değerlenir (md. 10).

    - Yabancı memleketteki mallara ait borç ve bu mallar dolayısıyla yabancı memlekette alınan veraset vergileri tevsik edilmek
    şartıyla tenzil edilir; ancak bunlar beyannamedeki bu mallar değerini geçemez (md. 12/c, ç): 90.000 TL < 1.500.000 TL
    olduğundan tamamı tenzil edilir.


    | Kalem | Tutar (TL) |

    |---|---|

    | Mesken | 6.000.000 |

    | Almanya''daki mevduat | 1.500.000 |

    | Ticari taşıt | 1.000.000 |

    | **Vergiye tabi iktisaplar** | **8.500.000** |

    | Kredi borcu (md. 12/a) | (400.000) |

    | Cenaze masrafı (md. 12/d) | (50.000) |

    | Almanya''da ödenen miras vergisi (md. 12/c) | (90.000) |

    | Borç ve masraf toplamı | (540.000) |

    | Borç tenzili sonrası değer | 7.960.000 |

    | Füruğa isabeden miras hissesi istisnası (md. 4/b) | (2.907.136) |

    | **Vergi matrahı** | **5.052.864** |


    (Kültür varlığı ve ev eşyası istisna olduğundan değer toplamına alınmamıştır.)


    **(b) Vergi (veraset yoluyla tarife)**


    | Dilim | Matrah (TL) | Oran | Vergi (TL) |

    |---|---|---|---|

    | İlk 3.000.000 | 3.000.000 | %1 | 30.000,00 |

    | Sonra gelen 7.000.000''ın ilk kısmı | 2.052.864 | %3 | 61.585,92 |

    | **Toplam** | 5.052.864 | | **91.585,92** |


    Yarı oran uygulaması yalnız ana, baba, eş ve çocuklar arasındaki ivazsız (sağlar arası) intikallere ilişkindir; veraset
    yoluyla intikalde uygulanmaz (md. 16).


    **(c) Ödeme**


    Vergi, tahakkukundan itibaren 3 yılda, her yıl Mayıs ve Kasım aylarında iki eşit taksitle ödenir (md. 19): toplam 6 taksit
    (Kasım 2026, Mayıs 2027, Kasım 2027, Mayıs 2028, Kasım 2028, Mayıs 2029). Taksit tutarı 91.585,92 / 6 = **15.264,32 TL**.


    **(d) Süre ve tapu işlemi**


    - Ölüm Türkiye''de olmuş ve mükellef Türkiye''de bulunduğundan süre ölüm tarihini izleyen **4 ay**dır: son gün **18 Haziran
    2026** (md. 9/1-a). Beyanname 10 Haziran 2026''da verildiğinden süresindedir.

    - Mükellef yabancı bir memlekette olsaydı süre **6 ay**; son gün 18 Ağustos 2026 olurdu.

