  - olcut: Miras paylarına göre hisseler ve her mirasçıya 2.907.136 TL istisna uygulanması
    puan: 3
  - olcut: Eşin vergisi (10.928,64 TL)
    puan: 1
  - olcut: Çocukların vergisinde dilimli hesap (her biri 32.785,92 TL) ve toplam 76.500,48 TL
    puan: 3
  - olcut: Beyanname süresi (dört ay; 12 Haziran 2026) ve 15 günlük ek süre
    puan: 2
  - olcut: 'Ödeme: üç yılda Mayıs-Kasım aylarında altı eşit taksit'
