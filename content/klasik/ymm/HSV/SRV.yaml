  soru: 'Türkiye Cumhuriyeti vatandaşı **Bay (Y)**, 18 Şubat 2026''da İstanbul''da (ikametgâhında) vefat etmiştir. Eşi daha
    önce vefat etmiş olup tek mirasçısı Türkiye''de yaşayan kızı Bayan (Z)''dir; vasiyetname yoktur. Mirasçı mirası kabul
    etmiş ve beyannameyi 10 Haziran 2026''da vermiştir; vergi 20 Haziran 2026''da tarh ve tahakkuk ettirilmiştir.


    Bu soruda 57 Seri No.lu VİV Genel Tebliği ile 2026 yılında uygulanan tutarlar kullanılacaktır: füruğ ve eşten her birine
    isabet eden miras hissesi için istisna 2.907.136 TL; veraset yoluyla intikallerde tarife: ilk 3.000.000 TL için %1, sonra
    gelen 7.000.000 TL için %3, sonra gelen 15.000.000 TL için %5.


    Terekenin (değerleri VİV md. 10''a göre bulunmuştur) ve borçların durumu:


    | Kalem | Değer (TL) |

