  - olcut: Çocukların vergisinde dilimli hesap (her biri 32.785,92 TL) ve toplam 76.500,48 TL
    puan: 3
  - olcut: Beyanname süresi (dört ay; 12 Haziran 2026) ve 15 günlük ek süre
    puan: 2
  - olcut: 'Ödeme: üç yılda Mayıs-Kasım aylarında altı eşit taksit'
    puan: 2
  - olcut: Bankanın %5 tevkifatı ve bir hafta içinde yatırma yükümlülüğü
    puan: 2
  - olcut: Tescilin vergi tahakkuku beklenmeden yapılması
    puan: 1
  - olcut: Vergi tamamen ödenmeden devir ve ferağ yasağı
    puan: 2
  - olcut: Teminat gösterilerek devre izin verilebilmesi
    puan: 2
  - olcut: İlişik kesme belgesi olmadan işlem yapan tapu memurunun müteselsil sorumluluğu
    puan: 2
  kaynaklar:
