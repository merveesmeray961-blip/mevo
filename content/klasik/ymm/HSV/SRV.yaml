  cozum: '**(a) Konu ve muafiyet**


    Bina vergi değeri 17.711.000 TL''nin üzerinde olan mesken nitelikli taşınmazlar DKV''ye tabidir (md. 42). Paylı mülkiyette
    matrahın hesabında taşınmazın toplam değeri esas alınır; paydaşlar hisseleri oranında mükelleftir (md. 44, 45).


    - K1, K2 ve K3 vergiye tabidir. K4 (12.000.000 TL) sınırın altında kaldığından konu dışıdır.

    - Birden fazla meskeni olanlarda, DKV konusuna giren **en düşük değerli** tek mesken muaftır (md. 46/b). Bay (W) için
    konu giren konutlar K1 (20.000.000), K2 (30.000.000) ve K3 (40.000.000)''tür. En düşük değerli olan **K1 muaftır**. K4
    konu dışında olduğu için muafiyet hesabında dikkate alınmaz.

    - (S)''nin Türkiye''de tek meskeni K3''teki hissesidir. Tek meskene hisseyle sahip olanlara muafiyet hisseleri için de
    uygulanır; **(S) muaftır**.


    **(b) 2026 DKV hesabı (md. 44)**


    - **K2 (30.000.000 TL):** İkinci dilimdedir. 26.568 + (30.000.000 − 26.567.000) × binde 6 = 26.568 + 20.598 = **47.166
    TL**.

    - **K3 (toplam 40.000.000 TL):** Üçüncü dilimdedir. 79.716 + (40.000.000 − 35.425.000) × binde 10 = 79.716 + 45.750 =
    125.466 TL. Bay (W)''nin payı (%50): **62.733 TL**. (S)''nin payı muafiyet nedeniyle alınmaz.

    - Bay (W)''nin 2026 DKV''si: 47.166 + 62.733 = **109.899 TL**. (S)''nin 2026 DKV''si: **0**.


    **(c) Beyan, ödeme ve satış**


    - Değerleri önceki yıllarda sınırı aşan konutlar için 2026 yılı beyannamesi, mesken nitelikli taşınmazın bulunduğu yerdeki
    yetkili vergi dairesine **20 Şubat 2026** sonuna kadar verilir. Paylı mülkiyette beyanname münferiden verilir. Vergi yetkili
    vergi dairesince yıllık tarh ve tahakkuk ettirilir; Şubat ve Ağustos aylarının sonuna kadar iki eşit taksitte ödenir (md.
    47).

    - K2''nin satışı yıl içinde mükellefiyeti sona erdiren haller (yanma, yıkılma, tamamen kullanılmaz hale gelme, muaflık
    şartlarını kazanma) arasında değildir (md. 45). Mükellef değişikliği takip eden yıldan itibaren hüküm doğurur. Bay (W),
    K2 için 2026 DKV''sinin tamamını (47.166 TL) öder; alıcının mükellefiyeti 2027''den başlar.


