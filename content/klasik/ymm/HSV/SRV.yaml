    etmiş ve takip edilmekte olan bir alacak ve borcunu beyannamede açıkça göstermiştir. Bu alacak/borçla ilgili hesaplanan
    ve tahakkuk ettirilerek tecil edilen VİV tutarı 500.000 TL''dir. Dava 8 yıl sürmüş, ancak Zeynep Hanım her altı ayda bir
    icra ve dava durumunu bildirmiştir. Sonuçta karar muris aleyhine kesinleşmiş, tecil edilen verginin tahsili gerekmiştir.


    Ek bilgiler: Bu vakada tahsil sırasında gecikme zammı aylık %3,5 olup, md. 13''e göre yüzde elli noksanıyla uygulanacak
    ve tecil tarihinden itibaren geçen 96 ay üzerinden basit olarak hesaplanacaktır.


