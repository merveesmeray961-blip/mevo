- id: YMM-HSV-SRV-K001
  sinav: ymm
  ders: HSV
  konu: SRV
  kazanimlar:
  - veraset ve intikal vergisi
  - emlak vergisi matrah ve oranları
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'İzmir’de yaşayan **Bay (R)**, 12 Şubat 2026’da İzmir’de vefat etmiştir. Kanuni mirasçıları, Türkiye’de yaşayan eşi
    Bayan (S) ile iki çocuğu (C1) ve (C2)’dir; vasiyetname yoktur. Mirasçılar mirası kabul etmiştir. Terekeye ilişkin bilgiler
    aşağıdadır:


    | Kalem | Değer bilgisi |

    |---|---|

    | Konut (bina) | Emlak vergisi değeri 9.000.000 TL; piyasa değeri 14.000.000 TL |

    | Arsa | Emlak vergisi değeri 2.000.000 TL |

    | Banka mevduatı | 5.500.000 TL |

    | Otomobil | Rayiç bedeli 1.200.000 TL |

    | Ev eşyası | 400.000 TL |

    | Murisin bankaya olan kredi borcu (belgeli) | 1.500.000 TL |

    | Cenazenin techiz ve tedfini için yapılan masraflar | 200.000 TL |


    2026 yılında uygulanacak tutarlar: füruğ ve eşten her birine isabet eden miras hissesi istisnası 2.907.136 TL. Veraset
    yoluyla intikallerde tarife: ilk 3.000.000 TL için %1, sonra gelen 7.000.000 TL için %3, sonra gelen 15.000.000 TL için
    %5, sonra gelen 30.000.000 TL için %7, 55.000.000 TL’yi aşan kısım için %10. Yasal miras payları: eş 1/4, çocukların her
    biri 3/8. Mirasçılar, Gelir Vergisi Kanunu’nun mükerrer 20/D maddesindeki istisnadan yararlanmamaktadır.


    **İstenenler:**


    (a) Her mirasçı için veraset ve intikal vergisi matrahını ve vergisini hesaplayınız; değerleme ve indirimlerin dayanağını
    belirtiniz. **(12 puan)**


    (b) Mirasçıların beyanname verme süresinin son gününü, verginin ödeme zamanını ve mirasçılardan (C1)’in kendi payına düşen
    mevduatı tasdikname ibraz etmeden bankadan çekmek istemesi hâlinde bankanın yapacağı işlemi açıklayınız. **(6 puan)**


    (c) Konut mirasçılar adına tapuya tescil edildikten sonra, veraset ve intikal vergisi henüz ödenmemişken mirasçılar konutu
    Eylül 2026’da satmak istemektedir. Satışın yapılıp yapılamayacağını, yapılabilmesi için gereken koşulu ve aksi hâlde tapu
    memurunun durumunu açıklayınız. **(7 puan)**

    '
  cozum: '**(a) Matrah ve vergi**


    Değerleme (VİVK md. 10): Gayrimenkuller emlak vergisine esas değerle (konut 9.000.000 TL, arsa 2.000.000 TL), menkul mallar
    rayiç bedelle (otomobil 1.200.000 TL) değerlenir. Piyasa değeri (14.000.000 TL) dikkate alınmaz.


    İstisna (md. 4/a): Veraset yoluyla intikal eden ev eşyası istisnadır; 400.000 TL terekeye dahil edilmez.


    İndirimler (md. 12): Murisin belgeye dayanan borcu (1.500.000 TL) ve cenaze masrafları (200.000 TL) indirilir.


    | | TL |

    |---|---|

    | Konut | 9.000.000 |

    | Arsa | 2.000.000 |

    | Mevduat | 5.500.000 |

    | Otomobil | 1.200.000 |

    | Toplam (ev eşyası hariç) | 17.700.000 |

    | Kredi borcu | (1.500.000) |

    | Cenaze masrafları | (200.000) |

    | **Net tereke** | **16.000.000** |


    | Mirasçı | Pay | Hisse (TL) | İstisna (md. 4/b) | Matrah (TL) | Vergi (TL) |

    |---|---|---|---|---|---|

    | Bayan (S) | 1/4 | 4.000.000 | 2.907.136 | 1.092.864 | 1.092.864 × %1 = 10.928,64 |

    | (C1) | 3/8 | 6.000.000 | 2.907.136 | 3.092.864 | 3.000.000 × %1 + 92.864 × %3 = 30.000 + 2.785,92 = 32.785,92 |

    | (C2) | 3/8 | 6.000.000 | 2.907.136 | 3.092.864 | 32.785,92 |

    | **Toplam** | | | | | **76.500,48** |


    Füruğ bulunduğundan eşe de füruğ için öngörülen istisna (2.907.136 TL) uygulanır; füruğ bulunmaması hâlindeki yüksek tutar
    (eş için) uygulanmaz.


    **(b) Beyan, ödeme ve banka işlemi**


    - Ölüm Türkiye’de gerçekleşmiş ve mirasçılar Türkiye’de bulunduğundan beyanname ölüm tarihini takip eden dört ay içinde,
    en geç **12 Haziran 2026**’da verilir (md. 9/1-a). Beyanname her mükellef için ayrı ayrı veya müştereken verilebilir (md.
    8). Ayrıca VUK md. 342’ye göre süre sonundan itibaren 15 gün içinde verilen beyanname nedeniyle vergi ziyaı olmamış sayılır.

    - Vergi tahakkukundan itibaren üç yılda, her yıl Mayıs ve Kasım aylarında olmak üzere iki eşit taksitte (toplam altı taksit)
    ödenir (md. 19/1).

    - Banka, tasdikname ibraz etmeyen (C1)’in istihkakından veraset yoluyla intikal olduğu için **%5** oranında vergi karşılığı
    tevkifat yapıp bakiyeyi öder; tevkif ettiği tutarı en geç bir hafta içinde yatırır ve vergi dairesine yazıyla bildirir
    (md. 17).


    **(c) Gayrimenkulün satışı**


    - Miras yoluyla intikal eden gayrimenkullerin tescili, vergi tahakkuku beklenmeksizin yapılır; sonuç tescilden itibaren
    en geç 15 gün içinde vergi dairesine bildirilir (md. 19/2).

    - Ancak intikal eden gayrimenkule isabet eden veraset ve intikal vergisi tamamen ödenmedikçe devir ve ferağı yapılamaz
    ve üzerinde ayni hak tesis edilemez. Bu nedenle konuta isabet eden vergi ödenmeden satış yapılamaz.

    - Mirasçılar tahakkuk eden vergiye karşılık 6183 sayılı Kanun md. 10’da sayılan cinsten teminat gösterirse (o maddenin
    5 numaralı bendinde yazılı menkul mallar hariç) gayrimenkulün devir ve ferağına izin verilebilir (md. 19/3).

    - Tapu memurları vergi dairesince verilmiş ilişik kesme belgesi olmaksızın devir ve ferağ işlemi yapamaz; yaparlarsa verginin
    ödenmesinden mükelleflerle birlikte müteselsilen sorumlu olurlar.

    '
  puanlama:
  - olcut: Gayrimenkullerin emlak vergisi değeriyle, otomobilin rayiç bedelle değerlenmesi
