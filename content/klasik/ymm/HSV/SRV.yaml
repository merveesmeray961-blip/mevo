    2026 yılı tutarları (57 Seri No.lu VİV Genel Tebliği): füruğ bulunmaması halinde eşe isabet eden miras hissesinin 5.817.845
    TL''si istisnadır. Veraset tarifesi: ilk 3.000.000 TL %1, sonraki 7.000.000 TL %3, sonraki 15.000.000 TL %5, sonraki 30.000.000
