  soru: '**Ali Bey**, 3 Mart 2026''da oğlu **Kerem**''e otomobil (değeri 4.000.000 TL) hibe etmiştir. Aynı gün **Selim** (yakın
    akrabası olmayan bir arkadaşı) bir başka otomobil için Ali Bey''den eşit değerde (4.000.000 TL) hibe almıştır. Hibeler
    karşılıksızdır. 2026 yılı için VİV md. 4/d''deki ivazsız intikallerde istisna tutarı 66.935 TL''dir. Ivazsız intikal tarifesi
    (2026 tutarları): ilk 3.000.000 TL için %10, sonra gelen 7.000.000 TL için %15.


    **İstenenler:**


    (a) Kerem ve Selim''in ödeyeceği vergiyi ayrı ayrı hesaplayınız. (12 puan)


    (b) İki mükellefin beyanname verme süresini ve son tarihi belirtiniz. (5 puan)


    (c) Hibe edilen mala ilişkin borçların tenzili için md. 12/b şartını belirtiniz (hibe eden borcu üstlenmişse). (4 puan)


    (d) Vergi hangi dairece tarh edilir? (md. 6) (4 puan)

