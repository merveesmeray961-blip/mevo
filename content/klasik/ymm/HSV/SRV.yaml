    icra dairesi veya mahkemenin vereceği kati karar veya hüküm neticesine intizaren tecil olunur; tecil hiçbir zaman **on
    seneden fazla** devam edemez. Mükellefler her altı ayda bir icra ve dava vaziyetlerini bir dilekçe ile vergi dairesine
    bildirmeye mecburdur.


    **(b)** Bildirim yapılmadığı takdirde tecil olunan vergiler derhal tahsil edilir.


