    | K1 | 8.000 | Ocak 4.000, Temmuz 4.000 | Yıl boyu kayıtlı |

    | **Toplam** | **80.000** | | |


    **(b) Gider kabul edilmeyen MTV ve kayıt**


    (I), (I/A) ve (IV) sayılı tarifelerdeki taşıtlardan (ticari maksatla kullanılan uçak ve helikopterler ile kiralama işletmelerinin
    kiraya verdikleri taşıtlar hariç) alınan vergi, ceza ve gecikme zamları gelir ve kurumlar vergisi matrahında gider kabul
    edilmez (md. 14). (II) sayılı tarifedeki kamyonetin MTV''si gider yazılabilir.


    Kanunen kabul edilmeyen gider: 24.000 + 30.000 + 18.000 = **72.000 TL**. Gider yazılabilir tutar: 8.000 TL.


    Ocak 2026 ödemesi (B1, B3 ve K1 Ocak taksitleri: 12.000 + 9.000 + 4.000):


