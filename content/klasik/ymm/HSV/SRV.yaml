    göre eşin miras payı 1/4, çocukların payı 3/8''er olacaktır. Terekenin bilgileri (değerler VİV md. 10''a göre belirlenmiştir):


    | Kalem | Tutar |

    |---|---|

    | Konut (Türkiye) | 24.000.000 TL |

    | Otomobil | 2.000.000 TL |

    | Banka mevduatı | 5.000.000 TL |

    | Murisin ihticaca salih vesaika dayanan borçları | 1.000.000 TL |

    | Murisin vergi borçları | 400.000 TL |

    | Cenazenin techiz ve tedfini için yapılan masraflar | 100.000 TL |


    Ek bilgiler: Borçlar ve masraflar terekeden düşüldükten sonra net değer mirasçılara payları oranında dağıtılacaktır. 2026
    yılı için VİV md. 4/b''deki füruğ ve eşten her birine isabet eden miras hissesi istisnası 2.907.136 TL''dir. Veraset yoluyla
    intikal tarifesi 2026 yılı için kanun metnindeki parantez içi tutarlara göre uygulanacaktır (ilk 3.000.000 TL için %1,
    sonra gelen 7.000.000 TL için %3, sonra gelen 15.000.000 TL için %5).


    **İstenenler:**


    (a) Net tereke değerini ve her mirasçının net miras hissesini hesaplayınız; tenzil edilen borç ve masraf unsurlarının
    dayanağını belirtiniz. (8 puan)


    (b) Her mirasçı için istisna sonrası matrahı bulunuz. (5 puan)


    (c) Her mirasçının ödeyeceği veraset ve intikal vergisini hesaplayınız. (8 puan)


    (d) Mirasçıların vergiyi kaç taksitte ve hangi aylarda ödeyeceğini belirtiniz (md. 19). (4 puan)

    '
  cozum: '**(a)** Brüt tereke = 24.000.000 + 2.000.000 + 5.000.000 = 31.000.000 TL. Md. 12/a: murisin ihticaca salih vesaika
    müstenit borçları ile vergi borçları ve md. 12/d: cenazenin techiz ve tedfini masrafları beyannamede gösterilmek şartıyla
    tenzil edilir: 1.000.000 + 400.000 + 100.000 = 1.500.000 TL. Net tereke = **29.500.000 TL**. Eş (1/4) = 7.375.000 TL;
    B ve C (3/8) = 11.062.500 TL''er.


