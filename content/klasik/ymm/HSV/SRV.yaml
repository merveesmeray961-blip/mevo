    Esas faaliyet konusu bina inşası olanların işletmelerine kayıtlı, henüz ilk satışa, devir ve temlike konu edilmemiş yeni
    konutlar muaftır. Bu konutların kiraya verilmesi veya sair surette kullanılması halinde muafiyet uygulanmaz (md. 46/ç).


    - Boş bekleyen konut (25.000.000 TL) **muaftır**.

    - Kiraya verilen konutta muafiyet Mart 2026''da sukut etmiştir. Mükellefiyet muafiyetin sukut ettiği tarihi takip eden
    yıldan, yani **2027**''den itibaren başlar (md. 45/c). 2026 için DKV doğmaz. 2027 vergisi, 2027 tutarları ve vergi değeri
    esas alınarak hesaplanır; beyanname 20 Şubat 2027''ye kadar verilir.

