  - olcut: 66.935 TL istisna ve matrah 2.933.065 TL
    puan: 2
  - olcut: Yarı oranlı tarife ve vergi 146.653,25 TL
    puan: 2
  - olcut: (D) için matrah 3.933.065 TL
    puan: 2
  - olcut: (D) için iki dilimli hesap ve vergi 439.959,75 TL
    puan: 3
  - olcut: İkramiye matrahı 4.933.065 TL ve %20 oranla 986.613 TL
    puan: 3
  - olcut: Düzenleyenin kesip izleyen ayın 20'sine kadar (20 Mayıs 2026) beyan ve ödemesi
    puan: 3
  - olcut: Manevi tazminatın ivazsız intikal sayılmaması; düğün takısı istisnası
    puan: 3
  - olcut: Bir aylık beyan süresi, tarh yeri ve üç yıl altı taksit
    puan: 3
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 2, 4/c, 4/d, 4/e, 9, 10/b, 12/b, 16, 19
  - mevzuat: 'Veraset ve İntikal Vergisi Kanunu Genel Tebliği (Seri No: 57)'
    madde: 2026 tutarları
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "def ivazsiz(m, yari=False):\n    dilim = [(3000000, 0.10), (7000000, 0.15), (15000000, 0.20), (30000000, 0.25),\
      \ (float(\"inf\"), 0.30)]\n    v = 0; kalan = m\n    for t, o in dilim:\n        k = min(kalan, t)\n        v += k*(o/2\
      \ if yari else o)\n        kalan -= k\n        if kalan <= 0: break\n    return v\nmC = 4000000 - 1000000 - 66935\n\
      vC = ivazsiz(mC, yari=True)\nmD = 4000000 - 66935\nvD = ivazsiz(mD)\nmS = 5000000 - 66935\nvS = mS*0.20\nsonuc = {\"\
      matrah_C\": mC, \"vergi_C\": round(vC, 2), \"matrah_D\": mD, \"vergi_D\": round(vD, 2), \"matrah_sans\": mS, \"vergi_sans\"\
      : round(vS, 2)}\n"
