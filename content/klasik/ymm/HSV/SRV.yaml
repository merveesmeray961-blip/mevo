    | 102 Bankalar | | 25.000 |


    Binek otomobillere ait 21.000 TL beyannamede kanunen kabul edilmeyen gider olarak matraha eklenir.


    **(c) VİV teminatı (VİVK md. 17)**


    - Bankalar, tasdikname ibraz etmeyen hak sahiplerinin istihkakından veraset yoluyla intikallerde **%5** vergi karşılığı
    tevkifat yaparak kalanını ödeyebilir: 1.000.000 × %5 = **50.000 TL** kesilir, **950.000 TL** ödenir.

    - Tevkif edilen para en geç **bir hafta** içinde bankanın bulunduğu yerin mal sandığına yatırılır ve durum bağlı olunan
