  dogrulama:
    python: "tereke = 9000000 + 2000000 + 5500000 + 1200000\nnet = tereke - 1500000 - 200000\nistisna = 2907136\ndef vergi(m):\n\
      \    dil = [(3000000, 0.01), (7000000, 0.03), (15000000, 0.05), (30000000, 0.07), (10**12, 0.10)]\n    v = 0\n    for\
      \ t, o in dil:\n        p = min(m, t)\n        v += p * o\n        m -= p\n        if m <= 0:\n            break\n \
      \   return round(v, 2)\nes_matrah = net / 4 - istisna\ncocuk_matrah = net * 3 / 8 - istisna\nsonuc = {'net_tereke':\
      \ net, 'es_matrah': es_matrah, 'es_vergi': vergi(es_matrah), 'cocuk_matrah': cocuk_matrah, 'cocuk_vergi': vergi(cocuk_matrah),\
      \ 'toplam': round(vergi(es_matrah) + 2 * vergi(cocuk_matrah), 2)}"
