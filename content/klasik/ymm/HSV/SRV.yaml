    | Taşıt | Tarife | Bilgi | Yıllık MTV |

    |---|---|---|---|

    | B1 binek otomobil | (I) | 2024''ten beri şirket adına kayıtlı | 24.000 TL |

    | B2 binek otomobil | (I) | 15 Mart 2026''da şirket adına ilk kez tescil edildi | 30.000 TL |

    | B3 binek otomobil | (I) | 2023''ten beri kayıtlı; 20 Temmuz 2026''da Bay (Y)''ye satıldı ve onun adına tescil edildi
    | 18.000 TL |

    | K1 kamyonet | (II) | 2025''ten beri kayıtlı | 8.000 TL |


    Ayrıca şirketin ortağı Bay (Q)''nun engellilik oranı %90''dır ve adına kayıtlı bir binek otomobili vardır.


    **II. VİV teminatı.** Bay (R) vefat etmiş; (R)''nin (B) Bankasındaki 2.000.000 TL mevduatının yarısı kızı Bayan (F)''ye
    düşmektedir. (F), vergi dairesinden VİV''nin ödendiğine dair tasdikname almadan 1.000.000 TL''lik payını çekmek istemektedir.


    **İstenenler**


    (a) B1, B2, B3 ve K1 için 2026 yılında (Z)''nin ödeyeceği MTV''yi, taksit tutarlarını ve ödeme zamanlarını mükellefiyetin
    başlaması ve sona ermesi hükümleriyle açıklayınız. **(10 puan)**


    (b) (Z)''nin 2026 MTV''sinden kurumlar vergisi matrahında gider kabul edilmeyecek tutarı bulunuz; Ocak 2026 ödemesinin
    yevmiye kaydını yapınız. **(6 puan)**


    (c) (B) Bankasının yapacağı işlemi, kesilen tutarın yatırılma süresini ve bankanın bu yükümlülüğü yerine getirmemesinin
    sonuçlarını hesaplayarak açıklayınız. **(6 puan)**


    (d) Bay (Q)''nun taşıtının MTV karşısındaki durumunu açıklayınız. Bu istisnaya benzer bir istisnanın başka bir kanunla
    getirilmesi halinde uygulanıp uygulanamayacağını belirtiniz. **(3 puan)**

