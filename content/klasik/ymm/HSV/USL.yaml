  soru: '(R) Petrol A.Ş., 4760 sayılı Özel Tüketim Vergisi Kanunu''na ekli (I) sayılı listedeki malları ve (III) sayılı listedeki
    malları teslim etmektedir; ÖTV yönünden bağlı olduğu vergi dairesi (X) Vergi Dairesi''dir. Kasım 2026 dönemine ilişkin
    bilgiler aşağıdadır. Soruda hafta sonu ve resmî tatiller dikkate alınmayacaktır.


    | No | İşlem |

    |---|---|

    | 1 | (I) sayılı listedeki malların 1-15 Kasım 2026 teslimlerine ait ÖTV: 6.000.000 TL; 16-30 Kasım 2026 teslimlerine
    ait ÖTV: 5.400.000 TL |

    | 2 | (III) sayılı listedeki malların Kasım 2026 teslimlerine ait ÖTV: 3.200.000 TL |

    | 3 | (II) sayılı listede yer alan, kayıt ve tescile tabi bir otomobilin Bay (K) tarafından ilk iktisabı; kayıt ve tescil
    işlemleri 18 Kasım 2026''da tamamlanacak ve ÖTV 900.000 TL''dir |

    | 4 | (III) sayılı listedeki mallara ilişkin beyanname 14 Aralık 2026''da postaya verilmiş, (X) Vergi Dairesi''ne 18 Aralık
    2026''da ulaşmıştır |

    | 5 | (I) sayılı liste mallarının teslimi ayrıca (R) ve (S) A.Ş.''nin kurduğu adi ortaklık tarafından da yapılmış; vergi
    tarhiyatına ortaklardan (R) muhatap tutulmuştur |


    **İstenenler**


    (a) 1 numaralı işlem için vergilendirme dönemlerini, beyanname verme ve ödeme tarihlerini ve toplam vergiyi bulunuz. **(6
    puan)**


    (b) 2 numaralı işlem için vergilendirme dönemini, beyanname verme ve ödeme tarihini belirleyiniz. **(4 puan)**


    (c) 3 numaralı işlem için beyannamenin verileceği yeri, zamanı ve verginin ödeme zamanını açıklayınız. **(4 puan)**


    (d) 4 numaralı işlemde verginin en geç hangi tarihe kadar tarh edileceğini bulunuz. **(3 puan)**


    (e) 5 numaralı işlemde tarhiyatın muhatabını ve diğer ortağın durumunu açıklayınız. **(5 puan)**

    '
  cozum: '**(a) (I) sayılı liste**


    Vergilendirme dönemi, her ayın ilk onbeş günlük birinci ve kalan günlerinden oluşan ikinci dönemdir. Beyanname vergilendirme
    dönemini izleyen onuncu günü akşamına kadar verilir; vergi beyanname verme süresi içinde ödenir (md. 14/1).


    | Dönem | Beyan ve ödeme son günü | ÖTV (TL) |

    |---|---|---|

    | 1-15 Kasım 2026 | 25 Kasım 2026 | 6.000.000 |

    | 16-30 Kasım 2026 | 10 Aralık 2026 | 5.400.000 |

    | Toplam | | **11.400.000** |


    **(b) (III) sayılı liste**


    (III) sayılı listedeki mallarda vergilendirme dönemi faaliyette bulunulan takvim yılının birer aylık dönemleridir. Kasım
    2026 dönemi için beyanname ve ödeme son günü, izleyen ayın onbeşinci günü akşamı olan **15 Aralık 2026**''dır (md. 14/1).


    **(c) (II) sayılı liste, kayıt ve tescile tabi mal**


    Beyanname, ilk iktisapla ilgili işlemlerin tamamlanmasından **önce**, bu işlemlerin yapıldığı yer vergi dairesine verilir
    ve vergi **aynı günde** ödenir (md. 14/2). Dolayısıyla 18 Kasım 2026''dan önce beyan ve ödeme yapılmalıdır; 900.000 TL
    aynı gün ödenir.


    **(d) Tarh zamanı**


    Vergi beyannamenin verildiği günde tarh edilir; beyanname posta ile gönderilmişse vergiyi tarh edecek daireye geldiği
    tarihi takip eden yedi gün içinde tarh edilir (md. 14/1). Beyanname 18 Aralık 2026''da ulaştığından tarh en geç **25 Aralık
    2026**''ya kadar yapılır.


    **(e) Adi ortaklık**


    Adi ortaklıklarda verginin ödenmesinden ortakların tamamı müteselsilen sorumlu olmak üzere ortaklardan herhangi birisi
    tarhiyata muhatap tutulur (md. 14/1). Tarhiyat (R) adına yapılabilir; (S) de verginin ödenmesinden (R) ile müteselsilen
    sorumludur.

    '
