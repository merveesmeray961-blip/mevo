    | 2 | Türkiye''de ikametgâhı, iş yeri, kanuni ve iş merkezi bulunmayan (B) Platform Inc.''in Temmuz 2026''da Türkiye''de
    elde ettiği hasılat 20.000.000 TL''dir; Hazine ve Maliye Bakanlığı, işleme aracılık eden (E) Bankası''nı verginin ödenmesinden
    sorumlu tutmuştur. |

    | 3 | (C) Ltd. ve (D) Ltd., dijital hizmet sunan bir adi ortaklık kurmuştur; tarhiyat (C) adına yapılmıştır. |

