- id: YMM-HSV-USL-K001
  sinav: ymm
  ders: HSV
  konu: USL
  kazanimlar:
  - sahte belge ve KDV'ye etkisi
  - sorumluluk uygulamaları
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(V) Makine A.Ş.** aylık dönemler hâlinde KDV beyannamesi vermekte olup 2026 yılı için süresinde düzenlenmiş tam
    tasdik sözleşmesi bulunmaktadır. Şirket mükellefiyet tesis ettirmiş olup faaliyetini vergi dairesinin bilgisi dâhilinde
    yürütmektedir. Şirket nezdinde 2026 yılında yapılan incelemede aşağıdaki tespitler yapılmıştır (KDV oranı %20; şirket
    ilgili dönemlerde ödenecek KDV beyan etmiş olup indirimlerin reddi doğrudan vergi ziyaına yol açmaktadır):


    | No | Dönem | Tespit |

    |---|---|---|

    | 1 | Haziran 2026 | (S) Ltd. Şti. tarafından düzenlenen 500.000 TL + 100.000 TL KDV tutarlı faturalara konu hiçbir mal
    alımı gerçekleşmemiştir; KDV indirim konusu yapılmıştır. Şirketin Haziran 2026’daki toplam alımları (KDV hariç) 4.000.000
    TL’dir. |

    | 2 | Temmuz 2026 | (M) A.Ş.’den gerçekte 200 birim mal alınmış, ancak fatura 300 birim üzerinden 900.000 TL + 180.000
    TL KDV olarak düzenlenmiş ve faturadaki KDV’nin tamamı indirilmiştir. Birim fiyat faturada gösterildiği gibi 3.000 TL’dir.
    |

    | 3 | Eylül 2026 | Fiilî envanterde alış belgesi bulunmayan ve tespit tarihindeki emsal bedeli 250.000 TL olan emtia bulunmuş;
    şirket kendisine verilen süre içinde alış belgesi ibraz edememiştir. Malları satanlar hakkında tarhiyat yapılmamıştır.
    |


    **İstenenler:**


    (a) 1 ve 2 numaralı tespitlerdeki belgelerin Vergi Usul Kanunu’na göre niteliğini belirleyiniz ve bu belgeleri kullananlar
    için öngörülen hapis cezası sınırlarını yazınız. **(6 puan)**


    (b) Üç tespit için ayrı ayrı ziyaa uğratılan (veya re’sen tarh edilecek) KDV’yi ve kesilecek vergi ziyaı cezasını hesaplayınız;
    toplamları bulunuz. **(11 puan)**


    (c) Vergi inceleme raporu düzenlenmeden önce, 1 numaralı tespite ilişkin sahte belge kullanma tespiti şirkete bildirilmiş
    ve şirketin Ağustos 2026 dönemine ait ihracat kaynaklı KDV iade talebi sonuçlanmamıştır. KDV Genel Uygulama Tebliği’ne
    göre; tam tasdik sözleşmesine bağlı %5 kolaylığının uygulanıp uygulanmayacağını, şirketin iade talebinin genel usule göre
    sonuçlandırılması için seçeneklerini ve gerekiyorsa teminat tutarını açıklayınız. **(8 puan)**

    '
  cozum: '**(a) Belgelerin niteliği (VUK md. 359)**


    - **1 numaralı tespit:** Gerçek bir muamele olmadığı hâlde varmış gibi düzenlenen belge **sahte belgedir** (md. 359/b).
    Sahte belgeyi kullananlar **üç yıldan sekiz yıla kadar** hapis cezası ile cezalandırılır.

    - **2 numaralı tespit:** Gerçek bir alıma dayanmakla birlikte işlemi miktar itibarıyla gerçeğe aykırı yansıtan belge **muhteviyatı
    itibarıyla yanıltıcı belgedir** (md. 359/a). Bu belgeleri kullananlar **on sekiz aydan beş yıla kadar** hapis cezası ile
    cezalandırılır.


    **(b) Vergi ve vergi ziyaı cezası**


    | No | Ziyaa uğratılan / tarh edilecek KDV (TL) | Ceza esası | Vergi ziyaı cezası (TL) |

    |---|---|---|---|

    | 1 | 100.000 (indirimin tamamı reddedilir) | md. 359 fiili → üç kat (md. 344/2) | 300.000 |

    | 2 | 180.000 − (200 × 3.000 × %20 = 120.000) = 60.000 | md. 359 fiili → üç kat (md. 344/2) | 180.000 |

    | 3 | 250.000 × %20 = 50.000 (emsal bedel üzerinden re’sen; KDVK md. 9/2) | bir kat (md. 344/1) | 50.000 |

    | **Toplam** | **210.000** | | **530.000** |


    - 2 numaralı tespitte yalnız gerçeğe aykırı kısma (100 birim) isabet eden KDV ziyaa uğramıştır; gerçek alım olan 200 birimin
    KDV’si indirilebilir.

    - 3 numaralı tespitte, belgesiz mal bulunduran mükellefe tespit tarihinden itibaren 10 gün süre verilir; belge ibraz edilemediğinden
    KDV emsal bedel üzerinden re’sen tarh edilir ve vergi ziyaı cezası uygulanır. Belgesiz mal bulundurma md. 359’daki fiillerden
    olmadığından ceza bir kattır. Satıcılar hakkında inceleme raporuna dayalı tarhiyat yapılmış olsaydı vergi ve ceza alıcıdan
    ayrıca aranmayacaktı.

    - Kaçakçılık suçları için hapis cezası uygulanması vergi ziyaı cezasının ayrıca kesilmesine engel değildir (md. 359/son).


    **(c) İade talebi**


    - Tam tasdik sözleşmesi bulunan mükelleflerde sahte belgelerdeki alım tutarı aynı dönemdeki toplam alımların %5’ini geçmiyorsa
    sahte belge kullanma tespiti gerekçesiyle işlem yapılmaz. Oran: 500.000 / 4.000.000 = **%12,5 > %5**; kolaylık uygulanmaz.

    - Şirkete 15 günlük süre verilir. Bu sürede işlemin gerçekliğini (ödeme, taşıma vb. delillerle) ispat ederse iade talebi
    genel usule göre sonuçlandırılır.

    - İspat edemezse; söz konusu belgelerdeki KDV’yi (100.000 TL) indirim ve iade hesabından çıkarması **veya** bu kısma sahte
    belge kullanma tespitinde öngörülen **üç kat teminat** göstermesi hâlinde geri kalan iade talebi genel usule göre sonuçlandırılır:
    100.000 × 3 = **300.000 TL**.

    - Hiçbiri yapılmazsa iade talebi vergi inceleme raporu sonucuna göre yerine getirilir.

    '
  puanlama:
  - olcut: 1 numaralı belgenin sahte belge olarak nitelendirilmesi ve 3-8 yıl hapis
    puan: 3
  - olcut: 2 numaralı belgenin muhteviyatı itibarıyla yanıltıcı belge olarak nitelendirilmesi ve 18 ay-5 yıl hapis
    puan: 3
  - olcut: 1 numaralı tespitte 100.000 TL KDV ve üç kat ceza (300.000 TL)
    puan: 3
  - olcut: 2 numaralı tespitte yalnız gerçeğe aykırı kısmın KDV’si (60.000 TL) ve üç kat ceza (180.000 TL)
    puan: 4
  - olcut: 3 numaralı tespitte emsal bedel üzerinden 50.000 TL KDV ve bir kat ceza
    puan: 3
  - olcut: Toplamlar (210.000 TL KDV; 530.000 TL ceza) ve hapis cezasının vergi ziyaı cezasına engel olmadığının belirtilmesi
    puan: 1
  - olcut: '%5 eşiğinin hesaplanması (%12,5) ve kolaylığın uygulanmayacağının belirtilmesi'
    puan: 3
  - olcut: 15 günlük süre ve ispat imkânı
    puan: 1
  - olcut: İndirimden çıkarma veya üç kat teminat seçeneği; 300.000 TL
    puan: 3
  - olcut: Aksi hâlde iadenin vergi inceleme raporuna göre sonuçlanacağı
    puan: 1
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 341, 344, 359
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 9/2
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.5, IV/A2-4.1, IV/A2-7.2
  gecerlilik:
    baslangic: '2024-10-31'
    bitis: null
  dogrulama:
    python: 'k1 = 100000

      k2 = 180000 - 200 * 3000 * 0.20

      k3 = 250000 * 0.20

      c1 = k1 * 3

      c2 = k2 * 3

      c3 = k3 * 1

      oran = 500000 / 4000000

      teminat = 0 if oran <= 0.05 else k1 * 3

      sonuc = {''kdv_1'': k1, ''kdv_2'': k2, ''kdv_3'': k3, ''kdv_toplam'': k1 + k2 + k3, ''ceza_1'': c1, ''ceza_2'': c2,
      ''ceza_3'': c3, ''ceza_toplam'': c1 + c2 + c3, ''oran'': oran, ''teminat'': teminat}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi HSV-2
    kapilar:
      G2:
        sonuc: gecti
