    - Bakanlık, vergi alacağının emniyet altına alınması amacıyla işleme aracılık edenleri sorumlu tutabilir (md. 3/2). Bu
    durumda beyan, vergi kesintisi yapmakla sorumlu tutulan (E) Bankası tarafından yapılır (md. 6/2).

    - Beyan ve ödeme: Temmuz 2026 dönemini takip eden ayın sonuna kadar, yani **31 Ağustos 2026** (md. 6/3, 6/6).

