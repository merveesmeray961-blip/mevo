  dogrulama:
    python: 'k1 = 100000

      k2 = 180000 - 200 * 3000 * 0.20

      k3 = 250000 * 0.20

      c1 = k1 * 3

      c2 = k2 * 3

      c3 = k3 * 1

      oran = 500000 / 4000000

      teminat = 0 if oran <= 0.05 else k1 * 3

      sonuc = {''kdv_1'': k1, ''kdv_2'': k2, ''kdv_3'': k3, ''kdv_toplam'': k1 + k2 + k3, ''ceza_1'': c1, ''ceza_2'': c2,
      ''ceza_3'': c3, ''ceza_toplam'': c1 + c2 + c3, ''oran'': oran, ''teminat'': teminat}'
