- id: YMM-IFM-BDB-K001
  sinav: ymm
  ders: IFM
  konu: BDB
  kazanimlar:
  - birleşme ve devir kayıtları (devralan ve devrolunan)
  - kayıtlı değer ve rayiç değer ayrımı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Birbiriyle ilişkili olmayan Atlas AŞ (devralan) ile Bora AŞ (devrolunan), 1.7.2026 tarihinde ticaret siciline tescil edilen
    devralma yoluyla birleşmeyle birleşmiştir. Birleşme TFRS 3 kapsamında bir işletme birleşmesidir; edinen işletme Atlas
    AŞ''dir. Birleşme KVK md. 19 ve 20''deki devir şartlarına uygun olarak gerçekleştirilmiştir. Kurumlar vergisi oranı %25''tir.


    - Atlas AŞ''nin sermayesi 10.000.000 TL''dir (1 TL itibari değerli paylar); payın gerçek değeri (ve 1.7.2026''daki gerçeğe
    uygun değeri) 8 TL''dir.

    - Bora AŞ''nin sermayesi 4.000.000 TL''dir (1 TL itibari değerli paylar); değerleme raporuna göre Bora AŞ''nin özkaynaklarının
    gerçek değeri 12.000.000 TL''dir.


    Bora AŞ''nin 1.7.2026 tarihli bilanço değerleri (kayıtlı değerler) ve gerçeğe uygun değerleri (TL):


    | Kalem | Kayıtlı değer | Gerçeğe uygun değer |

    |---|---|---|

    | 102 Bankalar | 1.000.000 | 1.000.000 |

    | 120 Alıcılar | 2.000.000 | 2.000.000 |

    | 153 Ticari Mallar | 3.000.000 | 3.400.000 |

    | 250 Arazi ve Arsalar | 2.000.000 | 4.000.000 |

    | 252 Binalar (maliyet 5.000.000 − birikmiş amortisman 2.000.000) | 3.000.000 | 3.600.000 |

    | Bora AŞ''nin kayıtlarında yer almayan, ayrı tanımlanabilir müşteri ilişkileri | – | 400.000 |

    | 320 Satıcılar | (2.500.000) | (2.500.000) |

    | 300 Banka Kredileri | (1.500.000) | (1.500.000) |


    Vergi mevzuatı bakımından Bora AŞ''nin varlık ve borçlarının vergiye esas değerleri kayıtlı değerlerine eşittir; şerefiyenin
    vergiye esas değeri sıfırdır.


    **İstenenler**


    (a) TTK md. 140 ve 142 çerçevesinde değişim oranını, Bora AŞ ortaklarına verilecek pay adedini ve Atlas AŞ''nin yapacağı
    sermaye artırımını hesaplayınız. (5 puan)


    (b) Atlas AŞ''nin TFRS''ye göre hazırlanan finansal tablolarında transfer edilen bedeli, ertelenmiş vergiyi, tanımlanabilir
    net varlıkları ve şerefiyeyi hesaplayınız. (10 puan)


    (c) (b)''deki ölçümlere göre Atlas AŞ''nin 1.7.2026 tarihli birleşme kaydını yapınız. (6 puan)


    (d) Birleşmenin vergi mevzuatı açısından sonuçlarını açıklayınız ve bu sonuçların (b)''deki ertelenmiş vergi hesabıyla
    ilişkisini belirtiniz. (4 puan)

    '
  cozum: '**(a) Değişim oranı ve sermaye artırımı (TTK md. 140/1, 142/1; Tebliğ 19.3.1)**


    - Bora AŞ pay başına gerçek değer = 12.000.000 / 4.000.000 = 3 TL; Atlas AŞ pay başına gerçek değer = 8 TL

    - Değişim oranı = 3 / 8 = **0,375** (1 Bora payı karşılığında 0,375 Atlas payı; 8 Bora payına 3 Atlas payı)

    - Verilecek pay = 4.000.000 × 0,375 = **1.500.000 adet**

    - Sermaye artırımı = 1.500.000 × 1 TL = **1.500.000 TL**


    Varlıkların kayıtlı değerle devralınması, kayıtlı öz sermaye (7.000.000 TL) kadar pay verilmesini gerektirmez; değişim
    oranı gerçek değerler üzerinden belirlenir.


    **(b) TFRS 3 ölçümleri (par. 18, 24, 32, 37; TMS 12 par. 15(a), 19, 66)**


    Transfer edilen bedel = ihraç edilen payların gerçeğe uygun değeri = 1.500.000 × 8 = **12.000.000 TL**


    Gerçeğe uygun değer farkları (vergiye esas değer kayıtlı değerde kaldığından vergiye tabi geçici fark):


    | Kalem | Fark |

    |---|---|

    | Ticari mallar | 400.000 |

    | Arazi | 2.000.000 |

    | Bina | 600.000 |

    | Müşteri ilişkileri | 400.000 |

    | **Toplam** | **3.400.000** |


    Ertelenmiş vergi yükümlülüğü = 3.400.000 × %25 = **850.000 TL**


    Tanımlanabilir net varlıklar = kayıtlı net varlıklar 7.000.000 + farklar 3.400.000 − ertelenmiş vergi 850.000 = **9.550.000
    TL**


    (Kayıtlı net varlıklar: 1.000.000 + 2.000.000 + 3.000.000 + 2.000.000 + 3.000.000 − 2.500.000 − 1.500.000 = 7.000.000)


    Şerefiye = 12.000.000 − 9.550.000 = **2.450.000 TL**. Şerefiyenin vergiye esas değeri sıfır olsa da ilk muhasebeleştirilmesinden
    doğan fark için ertelenmiş vergi yükümlülüğü ayrılmaz (TMS 12 par. 15(a), 66).


    **(c) 1.7.2026 birleşme kaydı (Atlas AŞ, TFRS)**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar | 1.000.000 | |

    | 120 Alıcılar | 2.000.000 | |

    | 153 Ticari Mallar | 3.400.000 | |

    | 250 Arazi ve Arsalar | 4.000.000 | |

    | 252 Binalar | 3.600.000 | |

    | 267 Diğer Maddi Olmayan Duran Varlıklar (müşteri ilişkileri) | 400.000 | |

    | 261 Şerefiye | 2.450.000 | |

    | 320 Satıcılar | | 2.500.000 |

    | 300 Banka Kredileri | | 1.500.000 |

    | Ertelenmiş Vergi Yükümlülüğü | | 850.000 |

    | 500 Sermaye | | 1.500.000 |

    | 520 Hisse Senedi İhraç Primleri | | 10.500.000 |

    | **Toplam** | **16.850.000** | **16.850.000** |


    Binalar, edinen işletme açısından yeni maliyet olan gerçeğe uygun değeriyle (birikmiş amortisman olmaksızın) alınır. İhraç
    primi = 12.000.000 − 1.500.000 = 10.500.000 TL.


    **(d) Vergi mevzuatı açısından sonuçlar (KVK md. 19/1-b, 20/1; Tebliğ 19.3.2)**


    - Devir şartları sağlandığından Bora AŞ''nin bilanço değerleri bir bütün hâlinde ve **aynen** (kayıtlı değerle; binanın
    5.000.000 TL maliyeti ve 2.000.000 TL birikmiş amortismanı ayrı ayrı) Atlas AŞ''nin yasal kayıtlarına geçirilir; yasal
    kayıtlarda gerçeğe uygun değer farkları, müşteri ilişkileri ve şerefiye yer almaz.

    - Bora AŞ''nin yalnız devir tarihine kadarki kazancı vergilendirilir; **birleşmeden doğan kâr hesaplanmaz ve vergilendirilmez**
    (md. 20/1).

    - Devir ilk iktisap sayılmaz; Atlas AŞ, devralınan amortismana tabi kıymetlere bakiye değerleri üzerinden kalan sürelerle
    amortisman ayırmaya devam eder.

    - Bu nedenle TFRS''deki ölçümle (gerçeğe uygun değer) vergiye esas değer (kayıtlı değer) arasında 3.400.000 TL vergiye
    tabi geçici fark doğar; (b)''deki 850.000 TL ertelenmiş vergi yükümlülüğü bu farkın sonucudur ve şerefiyeyi artırır. Şerefiyenin
    kendisi için ise istisna gereği ertelenmiş vergi yoktur.

    '
  puanlama:
  - olcut: (a) Değişim oranının gerçek değerlerden 0,375 bulunması
    puan: 3
  - olcut: (a) 1.500.000 pay ve 1.500.000 TL sermaye artırımının bulunması
    puan: 2
  - olcut: (b) Transfer edilen bedelin payların gerçeğe uygun değeriyle 12.000.000 TL ölçülmesi
    puan: 2
  - olcut: (b) Gerçeğe uygun değer farklarının (müşteri ilişkileri dahil 3.400.000) ve ertelenmiş vergi yükümlülüğünün (850.000)
      bulunması
    puan: 4
  - olcut: (b) Tanımlanabilir net varlıkların 9.550.000 TL ve şerefiyenin 2.450.000 TL bulunması; şerefiye için ertelenmiş
      vergi ayrılmadığının belirtilmesi
    puan: 4
  - olcut: (c) Varlık ve borçların GUD ile, şerefiye ve ertelenmiş vergi yükümlülüğüyle kaydı
    puan: 3
  - olcut: (c) 500 Sermaye (1.500.000) ve 520 Hisse Senedi İhraç Primleri (10.500.000) ayrımı ve kaydın dengesi
    puan: 3
  - olcut: (d) Yasal kayıtlarda kayıtlı değerle aynen devralma ve birleşme kârının vergilendirilmemesi
    puan: 2
  - olcut: (d) Amortismanın kalan süreyle devamı ve geçici farklarla ertelenmiş vergi ilişkisinin kurulması
    puan: 2
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 18, 24, 32, 37
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 15(a), 19, 66
    alinti: Ancak 15(a) paragrafı uyarınca, bir işletme şerefiyenin ilk muhasebeleştirilmesinden kaynaklanan ertelenmiş vergi
      borcunu muhasebeleştirmez.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 19/1-b, 20/1
    alinti: Münfesih kurumun devir tarihindeki bilânço değerlerinin, birleşilen kurum tarafından bir bütün halinde devralınması
      ve aynen bilânçosuna geçirilmesi.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 140/1, 142/1
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 19.3.1, 19.3.2
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
  dogrulama:
    python: "oran = (12000000 / 4000000) / 8\nyeni_pay = 4000000 * oran\nbedel = yeni_pay * 8\nkayitli = 1000000 + 2000000\
      \ + 3000000 + 2000000 + 3000000 - 2500000 - 1500000\nfark = 400000 + 2000000 + 600000 + 400000\nevy = fark * 0.25\n\
      net = kayitli + fark - evy\nserefiye = bedel - net\nborc = 1000000 + 2000000 + 3400000 + 4000000 + 3600000 + 400000\
      \ + serefiye\nalacak = 2500000 + 1500000 + evy + yeni_pay + (bedel - yeni_pay)\nassert abs(borc - alacak) < 1\nsonuc\
      \ = {'degisim_orani': oran, 'yeni_pay': yeni_pay, 'bedel': bedel, 'kayitli_net': kayitli,\n         'gud_farki': fark,\
      \ 'evy': evy, 'net_varlik': net, 'serefiye': serefiye,\n         'ihrac_primi': bedel - yeni_pay, 'kayit_toplami': borc}"
