- id: YMM-IFM-BDB-K002
  sinav: ymm
  ders: IFM
  konu: BDB
  kazanimlar:
  - devralma yoluyla birleşmede TFRS 3 edinme yöntemi
  - koşullu bedel ve satın alıma ilişkin maliyetler
  - pazarlıklı satın alma kazancı
  - ertelenmiş vergi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Birbiriyle ilişkili olmayan Güçlü AŞ (devralan) ile Zayıf AŞ (devrolunan), devralma yoluyla birleşme sözleşmesi imzalamış;
    birleşme 1.9.2026 tarihinde ticaret siciline tescil edilmiştir. Birleşme TFRS 3 kapsamında bir işletme birleşmesi olup
    edinen işletme Güçlü AŞ''dir. Kurumlar vergisi oranı %25''tir; birleşme KVK md. 19 ve 20''deki devir şartlarına uygundur
    ve devrolunan şirketin varlık ve borçları vergi mevzuatında kayıtlı değerleriyle devralınmıştır (vergiye esas değerler
    kayıtlı değerlere eşittir).


    **Birleşme sözleşmesinin bedel hükümleri**


    - Zayıf AŞ ortaklarına 400.000 adet Güçlü AŞ payı (1 TL itibari değerli; 1.9.2026''daki gerçeğe uygun değeri pay başına
    10 TL) verilecek ve ayrıca 500.000 TL nakit ödenecektir.

    - Zayıf AŞ''nin 2027 yılı net satışları 20.000.000 TL''yi aşarsa Güçlü AŞ eski ortaklara 2028 yılında ek 600.000 TL nakit
    ödeyecektir. Bu yükümlülük bir finansal borçtur; 1.9.2026''daki gerçeğe uygun değeri 300.000 TL''dir.

    - Güçlü AŞ, birleşme için danışmanlık ve değerleme hizmetlerine 150.000 TL (nakden) ödemiştir.


    **Zayıf AŞ''nin 1.9.2026 tarihli varlık ve borçları (TL)**


    | Kalem | Kayıtlı değer | Gerçeğe uygun değer |

    |---|---|---|

    | 102 Bankalar | 600.000 | 600.000 |

    | 120 Alıcılar | 1.400.000 | 1.400.000 |

    | 153 Ticari Mallar | 1.800.000 | 2.000.000 |

    | 252 Binalar ve makineler (net) | 4.000.000 | 5.400.000 |

    | 320 Satıcılar | (1.200.000) | (1.200.000) |

    | 300 Banka Kredileri | (800.000) | (800.000) |


    Edinen işletme, tanımlanabilir varlık ve borçların belirlenmesini ve ölçümlerini yeniden gözden geçirmiş, ek bir varlık
    veya borç saptamamıştır. Pazarlıklı satın almadan doğan kazanç için ertelenmiş vergi hesaplanmayacaktır.


    **İstenenler**


    (a) TFRS 3''e göre transfer edilen bedeli hesaplayınız; danışmanlık ve değerleme ücretlerinin nasıl muhasebeleştirileceğini
    gerekçesiyle belirtiniz. (5 puan)


    (b) Birleşme tarihindeki ertelenmiş vergi yükümlülüğünü, tanımlanabilir net varlıkları ve pazarlıklı satın almadan doğan
    kazancı hesaplayınız; kazancın finansal tablolara alınmasından önce yapılması gereken işlemi açıklayınız. (8 puan)


    (c) Güçlü AŞ''nin 1.9.2026 tarihli birleşme kaydını (sermaye artırımı ve ihraç primi dahil) yapınız; danışmanlık ücreti
    kaydını ayrıca gösteriniz. (7 puan)


    (d) 2027 satış hedefine ulaşılma olasılığının artması nedeniyle koşullu bedel yükümlülüğünün gerçeğe uygun değeri 31.12.2026''da
    450.000 TL''ye yükselmiştir. Bu değişikliğin nasıl muhasebeleştirileceğini kayıtla gösteriniz ve şerefiye/kazanç tutarına
    etkisini belirtiniz. (5 puan)

    '
  cozum: '**(a) Transfer edilen bedel ve satın alıma ilişkin maliyetler (TFRS 3 par. 37, 39, 53)**


    Transfer edilen bedel; ihraç edilen payların, nakdin ve koşullu bedelin birleşme tarihindeki gerçeğe uygun değerlerinin
    toplamıdır:


    | Unsur | TL |

    |---|---|

    | Çıkarılan paylar: 400.000 × 10 | 4.000.000 |

    | Nakit | 500.000 |

    | Koşullu bedel (gerçeğe uygun değer) | 300.000 |

    | **Transfer edilen bedel** | **4.800.000** |


    Koşullu bedel anlaşmasından doğan borç, transfer edilen bedelin parçasıdır (par. 39); sözleşmedeki 600.000 TL değil, gerçeğe
    uygun değer olan 300.000 TL esas alınır. Danışmanlık ve değerleme ücretleri (150.000 TL) satın alıma ilişkin maliyettir;
    transfer edilen bedele **eklenmez**, hizmetin alındığı dönemde **gider** yazılır (par. 53).


    **(b) Ertelenmiş vergi, net varlıklar ve pazarlıklı satın alma kazancı (TFRS 3 par. 32, 34, 36; TMS 12)**


    | Kalem | Gerçeğe uygun değer farkı |

    |---|---|

    | Ticari mallar (2.000.000 − 1.800.000) | 200.000 |

    | Binalar ve makineler (5.400.000 − 4.000.000) | 1.400.000 |

    | **Vergiye tabi geçici fark** | **1.600.000** |


    Ertelenmiş vergi yükümlülüğü = 1.600.000 × %25 = **400.000 TL**.


    Tanımlanabilir net varlıklar (gerçeğe uygun değer) = 600.000 + 1.400.000 + 2.000.000 + 5.400.000 − 1.200.000 − 800.000
    = 7.400.000 TL; ertelenmiş vergi düşüldükten sonra **7.000.000 TL**.


    Fazla tutar = 7.000.000 − 4.800.000 = **2.200.000 TL**. Transfer edilen bedel net varlıkların altında kaldığından şerefiye
    yoktur; işlem pazarlıklı satın almadır. Edinen işletme kazancı kâr veya zarara yazmadan önce, edinilen varlıkları ve üstlenilen
    borçları, transfer edilen bedeli ve (varsa) kontrol gücü olmayan payların ölçümünü yeniden gözden geçirir (par. 36). Gözden
    geçirmeden sonra da kalan 2.200.000 TL kazanç birleşme tarihinde **kâr veya zararda** muhasebeleştirilir (par. 34).


    **(c) Kayıtlar**


    Sermaye artırımı = 400.000 × 1 = 400.000 TL; ihraç primi = 4.000.000 − 400.000 = 3.600.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar | 600.000 | |

    | 120 Alıcılar | 1.400.000 | |

    | 153 Ticari Mallar | 2.000.000 | |

    | 252 Binalar ve makineler | 5.400.000 | |

    | 320 Satıcılar | | 1.200.000 |

    | 300 Banka Kredileri | | 800.000 |

    | Ertelenmiş vergi yükümlülüğü | | 400.000 |

    | 500 Sermaye | | 400.000 |

    | 520 Hisse Senetleri İhraç Primleri | | 3.600.000 |

    | 102 Bankalar (nakit ödeme) | | 500.000 |

    | 409 Diğer Mali Borçlar (koşullu bedel) | | 300.000 |

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar (pazarlıklı satın alma kazancı) | | 2.200.000 |

    | **Toplam** | **9.400.000** | **9.400.000** |


    Danışmanlık ücreti: 632 Genel Yönetim Giderleri 150.000 / 102 Bankalar 150.000.


    **(d) Koşullu bedelin sonradan ölçümü (TFRS 3 par. 58)**


    Hedefe ulaşılma olasılığının artması birleşme tarihinden sonraki bir olaydan kaynaklanır; ölçme dönemi düzeltmesi değildir.
    Finansal borç niteliğindeki koşullu bedel gerçeğe uygun değeriyle yeniden ölçülür ve değişim **kâr veya zararda** gösterilir:
    450.000 − 300.000 = 150.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 661 Uzun Vadeli Borçlanma Giderleri (gerçeğe uygun değer değişimi) | 150.000 | |

    | 409 Diğer Mali Borçlar | | 150.000 |


    Birleşme tarihinde belirlenen transfer edilen bedel ve dolayısıyla pazarlıklı satın alma kazancı (2.200.000 TL) **değişmez**;
    150.000 TL şerefiyeyi/kazancı etkilemez.

    '
