    (a) VUK geçici md. 37 karşısında Zümrüt AŞ''nin 2026 yılında enflasyon düzeltmesi yapmasının dayanağını açıklayınız. (4
    puan)


    (b) Yukarıdaki kalemleri parasal / parasal olmayan olarak sınıflandırınız. (5 puan)


    (c) Parasal olmayan kalemler için kullanılacak katsayıları ve düzeltme farklarını hesaplayıp yevmiye kayıtlarını yapınız.
    (10 puan)


    (d) 698 Enflasyon Düzeltme Hesabının kalanını bulup kapanış kaydını yapınız; 502 hesabındaki tutarın ileride ortaklara
    dağıtılması halinde vergisel sonucunu belirtiniz. (6 puan)

    '
  cozum: '**(a) Dayanak**


    VUK geçici md. 37/1, 2025–2027 hesap dönemlerinde şartlar oluşsa bile mali tabloların enflasyon düzeltmesine tabi tutulmamasını
