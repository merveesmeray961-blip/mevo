    puan: 3
  - olcut: (b) Düzeltme öncesi tabloların ayrıca sunulmasının uygun olmaması (7)
    puan: 2
  - olcut: (c) Net parasal pozisyon kazancı 600.000 (27)
    puan: 3
  - olcut: (c) Endekslenmiş kredi düzeltmesi 250.000 ve netleştirme (28), net 350.000
    puan: 3
  - olcut: (c) Vergi öncesi kâr 1.882.850
    puan: 2
  - olcut: (d) Nakit akış tablosu kalemlerinin düzeltilmesi (33)
    puan: 2
  - olcut: (d) Yüksek enflasyon döneminin sona ermesi (38)
    puan: 3
