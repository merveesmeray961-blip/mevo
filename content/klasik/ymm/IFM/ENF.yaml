  dogrulama:
    python: "e25, e26 = 242, 363\nq = [264, 275, 300, 330]\nk = [round(e26/x, 4) for x in q]\nsat = sum(a*b for a, b in zip([1000000,1200000,1500000,1800000],\
      \ k))\nsmm = sum(a*b for a, b in zip([600000,720000,900000,1080000], k))\ngid = sum(a*b for a, b in zip([150000,170000,180000,200000],\
      \ k))\nfin = sum(a*b for a, b in zip([60000]*4, k))\nkat = e26/e25\nnmp = 1200000*(kat-1)\nendeks = 500000*kat - 500000\n\
      net = nmp - endeks\nfaal = sat - smm - gid - fin\nsonuc = {'sat': round(sat), 'smm': round(smm), 'gid': round(gid),\
      \ 'fin': round(fin), 'karsilastirma_sat': round(4000000*kat),\n         'karsilastirma_kar': round(800000*kat), 'nmp':\
      \ round(nmp), 'endeks_duzeltmesi': round(endeks), 'net': round(net),\n         'faaliyet': round(faal), 'vergi_oncesi':\
      \ round(faal+net)}\n"
