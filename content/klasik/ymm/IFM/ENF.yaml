  soru: '**Veriler**


    Güneyli Makine AŞ, TFRS''ye göre finansal tablo hazırlayan ve geçerli para birimi yüksek enflasyonlu bir ekonominin para
    birimi olan bir işletmedir; finansal tablolarını TMS 29''a göre 31.12.2026 tarihli cari ölçüm birimiyle (tarihi maliyet
    esasıyla) düzenlemektedir. Genel fiyat endeksi (TÜFE, soru için varsayılan değerler): Aralık 2025: 200; Temmuz 2026: 240;
    Ekim 2026: 250; Aralık 2026: 300. Kurumlar vergisi oranı %25''tir.


    31.12.2026 tarihli düzeltme öncesi kalemler (TL):


    | Kalem | Tutar | Açıklama |

    |---|---|---|

    | Kasa ve bankalar | 500.000 | |

    | Ticari alacaklar | 1.200.000 | Türk lirası cinsinden, endekse bağlı değil |

    | Ticari mallar | 1.000.000 | 1.7.2026''da alınmış; bedeli faiz yükü oluşturmayan bir anlaşma çerçevesinde 1.10.2026''da
    ödenmiştir (faiz tutarının tespiti pratik değildir). Net gerçekleşebilir değeri 1.150.000 TL''dir. |

    | Arsa | 2.000.000 | 31.12.2025 tarihli finansal tablolarda gösterilen düzeltilmiş tutar (31.12.2025 cari ölçüm birimi);
    vergiye esas değeri 800.000 |

    | Makine | 1.600.000 | 1.7.2026''da peşin alınmış; 2026 birikmiş amortismanı (nominal) 80.000; vergiye esas net değeri
    1.520.000 |

    | Ticari borçlar | 900.000 | Türk lirası cinsinden |

    | Banka kredisi | 800.000 | Türk lirası cinsinden, endekse bağlı değil |

    | Ödenmiş sermaye | 2.000.000 | 31.12.2025 tarihli finansal tablolarda gösterilen düzeltilmiş tutar (31.12.2025 cari ölçüm
    birimi) |

    | Sermaye artırımı | 500.000 | 1.7.2026''da nakden yapılmış |

    | Geçmiş yıl kârları | 600.000 | 31.12.2025 tarihli finansal tablolarda gösterilen düzeltilmiş tutar (31.12.2025 cari
    ölçüm birimi) |


    Ticari malların vergiye esas değeri 1.000.000 TL''dir. 31.12.2025 finansal tablolarında arsa için, düzeltilmiş defter
    değeri (2.000.000) ile vergiye esas değeri (800.000) arasındaki farka isabet eden, 31.12.2025 cari ölçüm biriminden 300.000
    TL tutarında ertelenmiş vergi yükümlülüğü ayrılmıştı. Mükerrer 298 kapsamındaki enflasyon düzeltmesi yapılmamakta olup
    vergiye esas değerler endekslenmemektedir. Dönem net kârı, finansal durum tablosunun denkliğinden bulunacaktır (net parasal
    pozisyon kazanç/kaybı dahil).


    **İstenenler**


    (a) Kalemleri parasal / parasal olmayan olarak sınıflandırınız ve 31.12.2026 cari ölçüm birimiyle ifade edilen ticari
    mallar, arsa ve makine (net) tutarlarını hesaplayınız. (9 puan)


    (b) Özkaynak kalemlerini (ödenmiş sermaye, sermaye artırımı, geçmiş yıl kârları) 31.12.2026 cari ölçüm birimine göre düzeltiniz
    ve düzeltilmiş dönem net kârını bilanço denkliğinden bulunuz. (6 puan)


    (c) Düzeltme sonrası ertelenmiş vergi yükümlülüğünü ve 2026''da kâr veya zarara yansıyan ertelenmiş vergi giderini hesaplayınız.
    (6 puan)


    (d) TMS 29''a göre finansal tablolarda yapılması gereken açıklamaları belirtiniz. (4 puan)

    '
  cozum: '**(a) Sınıflandırma ve düzeltme**


    Parasal kalemler elde tutulan para ile para olarak alınacak veya ödenecek kalemlerdir; raporlama dönemi sonundaki cari
    ölçüm birimiyle ifade edildiklerinden düzeltilmezler (12). Diğer tüm aktif ve pasifler parasal olmayan kalemlerdir ve
    düzeltilir (14). **Parasal:** kasa ve bankalar, ticari alacaklar, ticari borçlar, banka kredisi. **Parasal olmayan:**
    ticari mallar, arsa, makine, ödenmiş sermaye, sermaye artırımı, geçmiş yıl kârları.


    | Kalem | Hesap | Düzeltilmiş tutar |

    |---|---|---|

    | Ticari mallar (faiz yükü yok; ödeme tarihinden, 22) | 1.000.000 × 300 / 250 = 1.200.000 → net gerçekleşebilir değere
    (1.150.000) indirilir (19) | **1.150.000** |

    | Arsa | 2.000.000 × 300 / 200 | **3.000.000** |

    | Makine – maliyet | 1.600.000 × 300 / 240 | 2.000.000 |

    | Makine – birikmiş amortisman | 80.000 × 300 / 240 | (100.000) |

    | **Makine – net** | | **1.900.000** |


    Faiz yükü oluşturmayan ertelenmiş ödemede mallar iktisap tarihi (Temmuz 2026) yerine ödeme tarihinden (Ekim 2026) düzeltilir
    (22); bu nedenle 1.000.000 × 300 / 240 = 1.250.000 hesabı yanlıştır. Düzeltilmiş tutar net gerçekleşebilir değerini aşarsa
    stok net gerçekleşebilir değere indirilir (19).


    **(b) Özkaynaklar (25)**


    | Kalem | Hesap | Düzeltilmiş tutar |

    |---|---|---|

    | Ödenmiş sermaye | 2.000.000 × 300 / 200 | 3.000.000 |

    | Sermaye artırımı (1.7.2026) | 500.000 × 300 / 240 | 625.000 |

    | Geçmiş yıl kârları | 600.000 × 300 / 200 | 900.000 |

    | Dönem net kârı (denklikten) | | 842.500 |

    | **Toplam özkaynak** | | **5.367.500** |


    Düzeltilmiş varlıklar: 500.000 + 1.200.000 + 1.150.000 + 3.000.000 + 1.900.000 = 7.750.000. Yükümlülükler: 900.000 + 800.000
    + 682.500 (c) = 2.382.500. Özkaynak = 7.750.000 − 2.382.500 = 5.367.500; dönem net kârı = 5.367.500 − (3.000.000 + 625.000
    + 900.000) = **842.500 TL** (net parasal pozisyon kazanç/kaybı bu tutara dahildir; 9).


    **(c) Ertelenmiş vergi (TMS 29.32)**


    Düzeltme, defter değerleri ile vergiye esas değerler arasında farklara neden olabilir; bu farklar TMS 12''ye göre muhasebeleştirilir
    (32).


    | Kalem | Defter değeri | Vergiye esas değer | Geçici fark |

    |---|---|---|---|

    | Arsa | 3.000.000 | 800.000 | 2.200.000 |

    | Makine | 1.900.000 | 1.520.000 | 380.000 |

    | Ticari mallar | 1.150.000 | 1.000.000 | 150.000 |

    | **Toplam** | | | **2.730.000** |


    Ertelenmiş vergi yükümlülüğü = 2.730.000 × %25 = **682.500 TL**. Açılıştaki yükümlülük 31.12.2026 cari ölçüm birimiyle
    300.000 × 300 / 200 = 450.000 TL''dir; 2026 ertelenmiş vergi gideri = 682.500 − 450.000 = **232.500 TL**.


    **(d) Açıklamalar (39)**


    (a) Finansal tabloların ve önceki dönem karşılaştırmalı rakamlarının genel satın alma gücündeki değişimlere göre düzeltildiği
    ve sonuç olarak raporlama dönemi sonundaki cari ölçüm birimiyle ifade edildiği; (b) finansal tabloların tarihi maliyet
    ya da cari maliyet yaklaşımından hangisine göre hazırlandığı; (c) raporlama dönemi sonunda geçerli fiyat endeksi ve niteliği
    ile cari ve önceki dönemlerde endeksteki hareketler.

    '
