- id: YMM-IFM-ENF-K002
  sinav: ymm
  ders: IFM
  konu: ENF
  kazanimlar:
  - TMS 29 yüksek enflasyonlu ekonomide finansal raporlama
  - parasal ve parasal olmayan kalemler
  - net parasal pozisyon kazanç ve kaybı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Yaprak Kâğıt AŞ** TFRS finansal tablolarını TMS 29''a göre hazırlamaktadır. 1.1.2026 tarihli finansal durum tablosu

    (1.1.2026 satın alma gücüyle ifade edilmiş):


    | Varlıklar | TL | Kaynaklar | TL |

    |---|---|---|---|

    | Nakit | 1.000.000 | Ticari borçlar | 2.500.000 |

    | Ticari alacaklar | 2.000.000 | Özkaynaklar | 8.000.000 |

    | Stoklar | 1.500.000 | | |

    | Maddi duran varlıklar (net) | 6.000.000 | | |

    | **Toplam** | **10.500.000** | **Toplam** | **10.500.000** |


    2026 yılında: tüm stoklar satılmış, satışlar 10.000.000 TL ve giderler (amortisman ve satılan malın maliyeti hariç)

    7.000.000 TL olarak yıl içinde düzenli biçimde ve nakden gerçekleşmiştir. Maddi duran varlıklar 10 yılda doğrusal

    amortismana tabidir (yıllık 600.000 TL). Alacak ve borç tutarları değişmemiştir. Genel fiyat endeksi: 1.1.2026 = 2.000,

    yıl ortalaması = 2.500, 31.12.2026 = 2.600.


    VUK kayıtlarında 1.1.2026 değerleri TFRS ile aynıdır; VUK''a göre 2026''da enflasyon düzeltmesi yapılmayacaktır.

    Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) Parasal ve parasal olmayan kalemleri ayırarak düzeltme ilkelerini açıklayınız. (5 puan)


    (b) Net parasal pozisyon kazanç veya kaybını hesaplayınız. (6 puan)


    (c) Düzeltilmiş 2026 kâr veya zarar tablosunu (vergi öncesi) ve 31.12.2026 düzeltilmiş finansal durum tablosunu

    hazırlayarak tutarlılığını kanıtlayınız; tarihî maliyetli kâr ile karşılaştırınız. (9 puan)


    (d) VUK geçici md. 37 hükmünü açıklayarak bu durumun 31.12.2026 ertelenmiş vergisine etkisini ve vergi sonrası TFRS

    sonucunu hesaplayınız. (5 puan)

    '
  cozum: "**(a) İlkeler**\n\nFinansal tablolar raporlama dönemi sonundaki ölçüm birimiyle ifade edilir (TMS 29.8). Parasal\
    \ kalemler (nakit,\nalacak, borç) zaten cari ölçüm birimiyle ifade edildiğinden **düzeltilmez** (TMS 29.12); parasal olmayan\
    \ kalemler\n(stok, MDV, özkaynak) edinme veya katkı tarihinden itibaren genel fiyat endeksindeki değişimle düzeltilir\n\
    (TMS 29.14–15, 29.24). Gelir tablosu kalemleri ilk kaydedildikleri tarihten itibaren düzeltilir (TMS 29.26). Net\nparasal\
    \ pozisyondan doğan kazanç veya kayıp kâr veya zarara alınır (TMS 29.9).\n\nKatsayılar: açılış kalemleri 2.600 / 2.000\
    \ = **1,30**; yıl içi düzenli işlemler 2.600 / 2.500 = **1,04**.\n\n**(b) Net parasal pozisyon**\n\n- Açılış net parasal\
    \ varlık = 1.000.000 + 2.000.000 − 2.500.000 = 500.000 TL → kayıp 500.000 × 0,30 = **150.000 TL**.\n- Yıl içi net parasal\
    \ artış (satış − gider) = 3.000.000 TL → kayıp 3.000.000 × 0,04 = **120.000 TL**.\n- **Net parasal pozisyon kaybı = 270.000\
    \ TL** (net parasal varlık tutulduğu için kayıp).\n\n**(c) Düzeltilmiş tablolar**\n\n| Kâr veya zarar (vergi öncesi) |\
    \ Tarihî | Düzeltilmiş |\n|---|---|---|\n| Satışlar (× 1,04) | 10.000.000 | 10.400.000 |\n| Satılan malın maliyeti (×\
    \ 1,30) | (1.500.000) | (1.950.000) |\n| Giderler (× 1,04) | (7.000.000) | (7.280.000) |\n| Amortisman (× 1,30) | (600.000)\
    \ | (780.000) |\n| Net parasal pozisyon kaybı | – | (270.000) |\n| **Dönem kârı** | **900.000** | **120.000** |\n\n| 31.12.2026\
    \ | TL | | TL |\n|---|---|---|---|\n| Nakit (1.000.000 + 10.000.000 − 7.000.000) | 4.000.000 | Ticari borçlar | 2.500.000\
    \ |\n| Ticari alacaklar | 2.000.000 | Özkaynak (8.000.000 × 1,30) | 10.400.000 |\n| MDV (6.000.000 × 1,30 − 780.000) |\
    \ 7.020.000 | Dönem kârı | 120.000 |\n| **Toplam** | **13.020.000** | **Toplam** | **13.020.000** |\n\nTablolar denktir.\
    \ Tarihî maliyetli 900.000 TL kârın 780.000 TL'si, sermayenin satın alma gücünün korunması için\ngereken tutardır; tarihî\
    \ kâr performansı olduğundan yüksek göstermektedir.\n\n**(d) Vergi etkisi**\n\nVUK geçici md. 37 uyarınca 2025 ile 2026\
    \ ve 2027 hesap dönemlerinde mükerrer 298. madde şartları oluşsa bile mali\ntablolar **enflasyon düzeltmesine tabi tutulmaz**.\
    \ TMS 29 ise TFRS raporlamasında uygulanmaya devam eder; bu nedenle\nparasal olmayan kalemlerde yeni geçici farklar doğar.\n\
    \n- MDV: TFRS 7.020.000 TL, vergiye esas değer 6.000.000 − 600.000 = 5.400.000 TL → vergiye tabi fark 1.620.000 TL;\n\
    \  **EVY 405.000 TL** (açılışta fark yoktu; tamamı 2026 ertelenmiş vergi gideri).\n- Cari vergi = VUK kârı 900.000 × %25\
    \ = **225.000 TL**.\n- Vergi sonrası TFRS sonucu = 120.000 − 225.000 − 405.000 = **(510.000) TL zarar**.\n"
  puanlama:
  - olcut: (a) Parasal/parasal olmayan ayrımı ve düzeltme ilkeleri
    puan: 3
  - olcut: (a) 1,30 ve 1,04 katsayıları
    puan: 2
  - olcut: (b) Açılış (150.000) ve yıl içi (120.000) kayıp; toplam 270.000 TL
    puan: 6
  - olcut: (c) Düzeltilmiş kâr 120.000 TL
    puan: 4
  - olcut: (c) Finansal durum tablosu 13.020.000 TL ve denklik
    puan: 3
  - olcut: (c) Tarihî kârla karşılaştırma
    puan: 2
  - olcut: (d) VUK geçici md. 37 ve TMS 29'un devamı
    puan: 2
  - olcut: (d) EVY 405.000, cari vergi 225.000 ve (510.000) TL sonuç
    puan: 3
  kaynaklar:
  - mevzuat: TMS 29 Yüksek Enflasyonlu Ekonomilerde Finansal Raporlama
    madde: par. 8, 9, 12, 14, 15, 24, 26
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: geçici md. 37
    alinti: düzeltmesine ilişkin şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 15
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: '2027-12-31'
  dogrulama:
    python: "k1, k2 = 2600 / 2000, 2600 / 2500\nnpp = 500000 * (k1 - 1) + 3000000 * (k2 - 1)\nkar = 10000000 * k2 - 1500000\
      \ * k1 - 7000000 * k2 - 600000 * k1 - npp\nmdv = 6000000 * k1 - 600000 * k1\nevy = (mdv - 5400000) * 0.25\nsonuc = {\"\
      npp1\": 500000 * (k1 - 1), \"npp2\": 3000000 * (k2 - 1), \"npp\": round(npp), \"kar\": round(kar),\n         \"tarihi\"\
      : 900000, \"mdv\": round(mdv), \"toplam\": round(4000000 + 2000000 + mdv),\n         \"oz\": 8000000 * k1, \"evy\":\
      \ round(evy), \"cari\": 225000, \"net\": round(kar - 225000 - evy)}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_IFM
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-24'
      G5:
        sonuc: gecti
        tarih: '2026-10-24'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-24'
    kim: uretici
    ne: harici teslim t_K_IFM.yaml, klasik 17
  - tarih: '2026-10-24'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-ENF-K003
  sinav: ymm
  ders: IFM
  konu: ENF
  kazanimlar:
  - mükerrer 298/A-1 enflasyon düzeltmesi şartları
  - geçici 37 ile enflasyon düzeltmesinin askıya alınması
  - pasif enflasyon fark hesaplarının kullanımı
  - mükerrer 298/Ç yeniden değerleme kapsamı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Yamaç Elektronik AŞ; tam mükellef, sermaye şirketi, hesap dönemi takvim yılı olan, kazancını bilanço esasına göre tespit
    eden bir kurumlar vergisi mükellefidir (münhasıran altın veya gümüş işlemleriyle uğraşmamaktadır; kayıtlarını Türk para
    birimi dışında bir para birimiyle tutmamaktadır). Kurumlar vergisi oranı %25 alınacaktır.


    Yİ-ÜFE endeksi (soru için varsayılan değerler): Aralık 2023: 2.000; Aralık 2025: 3.600; Aralık 2026: 4.300.


    Şirketin 31.12.2024 tarihli bilançosu mükerrer 298 kapsamında enflasyon düzeltmesine tabi tutulmuştur. Bu düzeltme sonucu
    bilançonun pasifinde 6.000.000 TL tutarında "Sermaye Düzeltmesi Olumlu Farkları" ve geçmiş yıl zararlarında 2.500.000
    TL bakiye bulunmaktadır. Şirket 2026 yılında bu fark hesabı ile şu işlemleri yapmıştır: (1) 2.500.000 TL''yi geçmiş yıl
    zararlarına mahsup etmiş, (2) 1.500.000 TL''yi sermayeye eklemiş, (3) 800.000 TL''yi "olağanüstü yedekler" hesabına nakletmiştir.


    Şirketin 31.12.2026 tarihli bilançosunda amortismana tabi iktisadi kıymetleri şunlardır (yasal kayıtlardaki maliyet bedelleri,
    TL):


    | Kıymet | Maliyet | Not |

    |---|---|---|

    | Makine M1 | 1.200.000 | 2022''de aktife girmiş |

    | Makine M2 | 800.000 | 3.3.2026''da aktife girmiş |

    | Arsa | 2.000.000 | 2021''de alınmış |

    | Taşıt | 900.000 | 2023''te aktife girmiş; maliyetine 2024''te eklenen 100.000 TL kur farkı dahildir |

    | Bina | 3.000.000 | 2019''da aktife girmiş |


    **İstenenler**


    (a) 31.12.2026 için mükerrer 298/A-1''deki iki şartın (son üç hesap dönemi ve içinde bulunulan hesap dönemi) gerçekleşip
    gerçekleşmediğini hesaplayarak belirleyiniz. (8 puan)


    (b) Geçici 37. madde karşısında şirketin 2026 yılında (geçici vergi dönemleri dahil) enflasyon düzeltmesi yapıp yapmayacağını,
    bu uygulamanın süresine ilişkin yetkiyi ve mükerrer 298/Ç bakımından sonucunu açıklayınız. (5 puan)


    (c) Pasif enflasyon fark hesabına ilişkin 2026 işlemlerinin vergisel sonucunu belirtiniz; vergiye tabi tutulacak tutarı
    ve kurumlar vergisini hesaplayınız ve fark hesabında kalan bakiyeyi bulunuz. (7 puan)


    (d) Mükerrer 298/Ç kapsamında yeniden değerlemeye konu edilebilecek kıymetleri, her kıymetin kapsama girip girmediğini
    gerekçelendirerek belirleyiniz ve kapsama girecek kıymetlerin yasal kayıtlardaki maliyet bedelleri toplamını bulunuz (yeniden
    değerleme oranı ve tutarı hesabı istenmemektedir). (5 puan)

    '
  cozum: '**(a) A-1 şartları (VUK mük. 298/A-1; Tebliğ 555 md. 32)**


    Fiyat endeksindeki artış, içinde bulunulan dönem dahil son üç hesap döneminde %100''den ve içinde bulunulan hesap döneminde
    %10''dan fazla ise bilanço esasına göre defter tutan mükellefler mali tablolarını enflasyon düzeltmesine tabi tutar; iki
    şart birlikte aranır.


    - Son üç hesap dönemi (2024, 2025, 2026): 4.300 / 2.000 − 1 = **%115** > %100 → şart gerçekleşmiştir.

    - İçinde bulunulan hesap dönemi (2026): 4.300 / 3.600 − 1 = **%19,44** > %10 → şart gerçekleşmiştir.


    Her iki şart birlikte gerçekleştiğinden, başka bir hüküm olmasaydı 31.12.2026 bilançosu enflasyon düzeltmesine tabi tutulacaktı.


    **(b) Geçici 37. madde**


    Geçici 37 uyarınca 2025 hesap dönemi ile geçici vergi dönemleri de dahil olmak üzere 2026 ve 2027 hesap dönemlerinde,
    mükerrer 298 kapsamındaki şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine tabi tutulmaz.
    Dolayısıyla şirket, (a)''daki şartlar gerçekleşse de 2026''da **geçici vergi dönemleri dahil enflasyon düzeltmesi yapmaz**.
    Cumhurbaşkanı bu dönemleri geçici vergi dönemleri de dahil olmak üzere **üç hesap dönemine kadar** uzatmaya yetkilidir.
    Şirket mükerrer 298/A-9 kapsamında olmadığından hüküm ona uygulanır (A-9 kapsamındaki mükellefler için geçici 37''nin
    1. ve 2. fıkraları geçerli değildir). Enflasyon düzeltmesi yapılmayacağı belirtilen dönemler, (Ç) fıkrası bakımından **düzeltme
    şartlarının gerçekleşmediği dönem** sayıldığından şirket, amortismana tabi iktisadi kıymetlerini (Ç) fıkrası çerçevesinde
    yeniden değerleyebilir.


    **(c) Pasif fark hesabı (A-5)**


    Pasif kalemlere ait enflasyon fark hesapları başka bir hesaba nakledildiğinde veya işletmeden çekildiğinde, işlemin yapıldığı
    dönemde (dönem kazancıyla ilişkilendirilmeksizin) vergiye tabidir. Öz sermaye kalemlerine ait farklar ise geçmiş yıl zararlarına
    mahsup edilebilir veya kurumlar vergisi mükelleflerince sermayeye ilave edilebilir; bu işlemler kâr dağıtımı sayılmaz.


    | İşlem | Tutar | Sonuç |

    |---|---|---|

    | Geçmiş yıl zararlarına mahsup | 2.500.000 | Vergi yok |

    | Sermayeye ilave | 1.500.000 | Vergi yok, kâr dağıtımı değil |

    | Olağanüstü yedeklere nakil | 800.000 | **Vergiye tabi** (nakil dönemi 2026) |


    Vergiye tabi tutar 800.000 TL; kurumlar vergisi = 800.000 × %25 = **200.000 TL**. Kalan bakiye = 6.000.000 − 2.500.000
    − 1.500.000 − 800.000 = **1.200.000 TL**.


    **(d) (Ç) kapsamı**


    - **M1 (2022):** kapsama girer; amortismana tabi, 2026 öncesi aktife girmiştir.

    - **M2 (3.3.2026):** Hesap dönemi içinde aktife giren kıymet için aktife girdiği hesap döneminde yeniden değerleme yapılmaz
    (Ç-9); kapsam dışı.

    - **Arsa:** (Ç) fıkrası amortismana tabi iktisadi kıymetlere ilişkindir; arsa amortismana tabi değildir, kapsam dışı.

    - **Taşıt (2023):** Kapsama girer; ancak maliyetine aktifleştirildiği hesap dönemi (2023) dışında eklenen kur farkı (100.000)
    ve kredi faizleri yeniden değerleme kapsamına girmez (Ç-1). Kapsama giren maliyet 900.000 − 100.000 = 800.000.

    - **Bina:** Kapsama girer (2019''da aktife girmiş, amortismana tabi).


    Kapsama girecek maliyet toplamı = 1.200.000 + 800.000 + 3.000.000 = **5.000.000 TL**.

    '
