    bitis: null
  dogrulama:
    python: "arsa = 3000000 * 3000/2000 - 3000000\nistirak = 1200000 * 3000/2400 - 1200000\navans = 600000 * 3000/2500 - 600000\n\
      sermaye = (2000000 + 1000000) * 3000/2000 - 3000000\naktif = arsa + istirak + avans\nsonuc = {'arsa_fark': arsa, 'istirak_fark':\
      \ istirak, 'avans_fark': avans, 'sermaye_fark': sermaye,\n         'aktif_toplam': aktif, 'kalan_648': aktif - sermaye,\
      \ 'arsa_duzeltilmis': 4500000, 'avans_duzeltilmis': 720000}"
  durum: kontrolde
  surum: 1
  uretim:
