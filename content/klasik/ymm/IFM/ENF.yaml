    tablosu düzeltilmeyecektir. Varsayımsal ÜFE değerleri:


    | Ay | Endeks |

    |---|---|

    | Aralık 2025 | 2.000 |

    | Haziran 2026 | 2.400 |

    | Eylül 2026 | 2.500 |

    | Aralık 2026 | 3.000 |


