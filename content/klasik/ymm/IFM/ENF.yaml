- id: YMM-IFM-ENF-K001
  sinav: ymm
  ders: IFM
  konu: ENF
  kazanimlar:
  - VUK mükerrer 298 parasal ve parasal olmayan kalemler
  - düzeltme katsayıları
  - enflasyon düzeltmesi farkları hesabı (698)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Münhasıran sürekli olarak işlenmiş altın imali ve alım-satımı ile iştigal eden Zümrüt AŞ, 31.12.2026 tarihli bilançosunu
    VUK mükerrer 298''e göre enflasyon düzeltmesine tabi tutacaktır. Şirket toplulaştırılmış yöntem kullanmamaktadır; gelir
    tablosu düzeltilmeyecektir. Varsayımsal ÜFE değerleri:


    | Ay | Endeks |

    |---|---|

    | Aralık 2025 | 2.000 |

    | Haziran 2026 | 2.400 |

    | Eylül 2026 | 2.500 |

    | Aralık 2026 | 3.000 |


    31.12.2026 tarihli düzeltme öncesi seçilmiş bakiyeler (TL):


    | Hesap | Tutar | Açıklama |

    |---|---|---|

    | 100 Kasa | 500.000 | |

    | 102 Bankalar | 1.500.000 | |

    | 120 Alıcılar | 2.000.000 | |

    | 159 Verilen Sipariş Avansları | 600.000 | Eylül 2026''da ödenmiş, yıl sonunda mahsup edilmemiştir |

    | 242 İştirakler | 1.200.000 | Haziran 2026''da satın alınmış ve bedeli ödenmiştir |

    | 250 Arazi ve Arsalar | 3.000.000 | 31.12.2025 itibarıyla düzeltilmiş değer |

    | 320 Satıcılar | 1.800.000 | |

    | 400 Banka Kredileri | 2.000.000 | |

    | 500 Sermaye | 2.000.000 | |

    | 502 Sermaye Düzeltmesi Olumlu Farkları | 1.000.000 | 31.12.2025 itibarıyla (500 + 502 = düzeltilmiş sermaye) |


    2026 yılında sermaye hareketi olmamıştır.


    **İstenenler**


    (a) VUK geçici md. 37 karşısında Zümrüt AŞ''nin 2026 yılında enflasyon düzeltmesi yapmasının dayanağını açıklayınız. (4
    puan)


    (b) Yukarıdaki kalemleri parasal / parasal olmayan olarak sınıflandırınız. (5 puan)


    (c) Parasal olmayan kalemler için kullanılacak katsayıları ve düzeltme farklarını hesaplayıp yevmiye kayıtlarını yapınız.
    (10 puan)


    (d) 698 Enflasyon Düzeltme Hesabının kalanını bulup kapanış kaydını yapınız; 502 hesabındaki tutarın ileride ortaklara
    dağıtılması halinde vergisel sonucunu belirtiniz. (6 puan)

    '
  cozum: '**(a) Dayanak**


    VUK geçici md. 37/1, 2025–2027 hesap dönemlerinde şartlar oluşsa bile mali tabloların enflasyon düzeltmesine tabi tutulmamasını
    öngörür. Ancak geçici md. 37''nin dördüncü fıkrasına göre birinci ve ikinci fıkra hükümleri mükerrer 298/A-9 kapsamındaki
    mükellefler için geçerli değildir. A-9''a göre münhasıran sürekli olarak işlenmiş altın, gümüş alım-satımı ve imali ile
    iştigal edenler A-1''deki endeks şartlarına bakılmaksızın düzeltme yapar. Zümrüt AŞ bu kapsamda olduğundan 31.12.2026
    bilançosunu düzeltir.


    **(b) Sınıflandırma (mükerrer 298/A-2-a, b)**


    - Parasal: 100 Kasa, 102 Bankalar, 120 Alıcılar, 320 Satıcılar, 400 Banka Kredileri — düzeltilmez.

    - Parasal olmayan: 159 Verilen Sipariş Avansları (parasal olmayan avans), 242 İştirakler, 250 Arazi ve Arsalar, 500 Sermaye
    (502 ile birlikte düzeltilmiş sermaye) — düzeltilir.


    **(c) Katsayılar ve farklar**


    | Kalem | Esas tarih (A-3) | Katsayı | Düzeltilmiş değer | Fark |

    |---|---|---|---|---|

    | 250 Arazi ve Arsalar | Önceki dönem sonu değeri taşınır | 3.000 / 2.000 = 1,50 (taşıma) | 4.500.000 | 1.500.000 |

    | 242 İştirakler | Satın alma tarihi (Haziran 2026) | 3.000 / 2.400 = 1,25 | 1.500.000 | 300.000 |

    | 159 Verilen Sipariş Avansları | Ödeme tarihi (Eylül 2026) | 3.000 / 2.500 = 1,20 | 720.000 | 120.000 |

    | Sermaye (500 + 502) | Önceki dönem sonu değeri taşınır | 1,50 (taşıma) | 3.000.000 × 1,50 = 4.500.000 | 1.500.000 |


    Aktif farkları toplamı: 1.500.000 + 300.000 + 120.000 = 1.920.000 TL


    Yevmiye kayıtları (farklar ilgili hesapların enflasyon farkı tali hesaplarına):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 250 Arazi ve Arsalar (enflasyon farkı) | 1.500.000 | |

    | 242 İştirakler (enflasyon farkı) | 300.000 | |

    | 159 Verilen Sipariş Avansları (enflasyon farkı) | 120.000 | |

    | 698 Enflasyon Düzeltme Hesabı | | 1.920.000 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 698 Enflasyon Düzeltme Hesabı | 1.500.000 | |

    | 502 Sermaye Düzeltmesi Olumlu Farkları | | 1.500.000 |


    (Parasal olmayan aktif artışları 698''in alacağına, parasal olmayan pasif artışları borcuna yazılır — A-2-m ve THP 698
    açıklaması. Ödenmiş sermayedeki artış 500''e değil 502''ye alacak yazılır.)


    **(d) 698''in kapanışı ve vergisel sonuç**


    698 kalanı: 1.920.000 (alacak) − 1.500.000 (borç) = 420.000 TL alacak kalanı.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 698 Enflasyon Düzeltme Hesabı | 420.000 | |

    | 648 Enflasyon Düzeltmesi Kârları | | 420.000 |


    502 hesabındaki tutar sermayeye ilave edilir veya düzeltme sonucu oluşan geçmiş yıl zararlarına mahsup edilirse kâr dağıtımı
    sayılmaz; ortaklara dağıtılırsa (işletmeden çekilirse) dağıtıldığı dönemin kazancıyla ilişkilendirilmeksizin o dönemde
    vergiye tabi tutulur (mükerrer 298/A-5).

    '
  puanlama:
  - olcut: (a) Geçici md. 37/1 askıya alma ve 37/4 ile A-9 istisnasının birlikte açıklanması
    puan: 4
  - olcut: (b) Parasal kalemlerin doğru sınıflandırılması
    puan: 2
  - olcut: (b) Avans, iştirak, arsa ve sermayenin parasal olmayan sayılması
    puan: 3
  - olcut: (c) Taşıma ve düzeltme katsayılarının (1,50; 1,25; 1,20) doğru esas tarihlerle bulunması
    puan: 4
  - olcut: (c) Farkların (1.500.000; 300.000; 120.000; 1.500.000) hesaplanması
    puan: 3
  - olcut: (c) Aktif farkları ve 502 kayıtlarının doğru yönle yapılması
    puan: 3
  - olcut: (d) 698 kalanının (420.000 alacak) bulunması ve 648'e kapanış kaydı
    puan: 4
  - olcut: (d) 502'nin dağıtımında A-5 hükmünün ve istisnalarının belirtilmesi
    puan: 2
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-2, A-3, A-5, A-9; geçici md. 37
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) – Tekdüzen Hesap Planı Açıklamaları'
    madde: 502, 648, 698 hesap açıklamaları
  gecerlilik:
    baslangic: '2025-12-25'
    bitis: null
  dogrulama:
    python: "arsa = 3000000 * 3000/2000 - 3000000\nistirak = 1200000 * 3000/2400 - 1200000\navans = 600000 * 3000/2500 - 600000\n\
      sermaye = (2000000 + 1000000) * 3000/2000 - 3000000\naktif = arsa + istirak + avans\nsonuc = {'arsa_fark': arsa, 'istirak_fark':\
      \ istirak, 'avans_fark': avans, 'sermaye_fark': sermaye,\n         'aktif_toplam': aktif, 'kalan_648': aktif - sermaye,\
      \ 'arsa_duzeltilmis': 4500000, 'avans_duzeltilmis': 720000}"
