- id: YMM-IFM-ENF-K005
  sinav: ymm
  ders: IFM
  konu: ENF
  kazanimlar:
  - 'TMS 29: kapsamlı gelir tablosunun düzeltilmesi'
  - net parasal pozisyon kazanç/kaybı ve endekse bağlı kalemler
  - karşılaştırmalı rakamlar, nakit akış tablosu ve yüksek enflasyon döneminin sona ermesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Pamuk Tekstil AŞ, TFRS''ye göre finansal tablo hazırlayan ve TMS 29''u uygulayan bir işletmedir. 2026 yılı finansal tabloları
    31.12.2026 cari ölçüm birimiyle düzenlenecektir. Genel fiyat endeksi (TÜFE, soru için varsayılan değerler): Aralık 2025:
    242; 2026 çeyrek ortalamaları: I. çeyrek 264, II. çeyrek 275, III. çeyrek 300, IV. çeyrek 330; Aralık 2026: 363. Gelir
    tablosu kalemleri ilgili çeyreğin ortalama endeksine göre düzeltilecektir. Vergi etkileri dikkate alınmayacaktır.


    2026 yılı çeyreklik gelir tablosu kalemleri (nominal, TL):


    | Kalem | I. Çeyrek | II. Çeyrek | III. Çeyrek | IV. Çeyrek |

    |---|---|---|---|---|

    | Satış gelirleri | 1.000.000 | 1.200.000 | 1.500.000 | 1.800.000 |

    | Satışların maliyeti | 600.000 | 720.000 | 900.000 | 1.080.000 |

    | Faaliyet giderleri | 150.000 | 170.000 | 180.000 | 200.000 |

    | Finansman gideri | 60.000 | 60.000 | 60.000 | 60.000 |


    Diğer bilgiler:


    - 2025 yılı finansal tablolarında (31.12.2025 cari ölçüm biriminde) satış gelirleri 4.000.000 TL ve net dönem kârı 800.000
    TL olarak raporlanmıştı.

    - Dönem içi ağırlıklı ortalama net parasal yükümlülük (endekse bağlı kalemler hariç) 1.200.000 TL''dir.

    - Şirketin 1.1.2026''da kullandığı 500.000 TL tutarındaki kredi sözleşme gereği TÜFE''ye endekslidir; sözleşme şartları
    çerçevesinde yıl sonu borç tutarı düzeltilmiştir. (Yıl içinde anapara ödemesi yoktur; sözleşmesel endeksleme dışındaki
    faiz, finansman giderine dahildir.)


    **İstenenler**


    (a) 2026 gelir tablosu kalemlerinin (satış gelirleri, satışların maliyeti, faaliyet giderleri, finansman gideri) 31.12.2026
    cari ölçüm birimiyle toplamlarını bulunuz. (7 puan)


    (b) 2025 karşılaştırmalı satış gelirleri ve net dönem kârının 2026 finansal tablolarında hangi tutarlarla sunulacağını
    bulunuz; düzeltme öncesi tabloların ayrıca sunulmasının uygun olup olmadığını belirtiniz. (5 puan)


    (c) Net parasal pozisyon kazancını/kaybını genel fiyat endeksindeki değişimi kullanarak tahmin ediniz, endekse bağlı kredi
    için sözleşme gereği yapılan düzeltmenin bu tutarla ilişkisini ve sunumunu açıklayınız; net parasal pozisyon kazancı/kaybı
    dahil vergi öncesi dönem kârını bulunuz. (8 puan)


    (d) Nakit akış tablosunun düzenlenmesine ve yüksek enflasyon döneminin sona ermesi durumunda izlenecek yönteme ilişkin
    TMS 29 hükümlerini belirtiniz. (5 puan)

    '
  cozum: '**(a) Düzeltilmiş gelir tablosu kalemleri (TMS 29.26)**


    Tüm gelir ve gider kalemleri ilk kaydedildikleri tarihten itibaren genel fiyat endeksindeki değişime göre düzeltilir.
    Düzeltme katsayıları (363 / çeyrek ortalaması): I: 1,375; II: 1,32; III: 1,21; IV: 1,10.


    | Kalem | I. Ç | II. Ç | III. Ç | IV. Ç | Toplam |

    |---|---|---|---|---|---|

    | Satışlar | 1.375.000 | 1.584.000 | 1.815.000 | 1.980.000 | **6.754.000** |

    | Satışların maliyeti | 825.000 | 950.400 | 1.089.000 | 1.188.000 | **4.052.400** |

    | Faaliyet giderleri | 206.250 | 224.400 | 217.800 | 220.000 | **868.450** |

    | Finansman gideri | 82.500 | 79.200 | 72.600 | 66.000 | **300.300** |


    **(b) Karşılaştırmalı rakamlar (8, 34, 7)**


    Önceki dönem rakamları da raporlama dönemi sonundaki cari ölçüm birimine çevrilir. Katsayı = 363 / 242 = 1,5. Satış gelirleri
    = 4.000.000 × 1,5 = **6.000.000 TL**; net dönem kârı = 800.000 × 1,5 = **1.200.000 TL**. Standart, düzeltme yapılmamış
    finansal tablolara ek olarak bilgi sunulmasını mümkün kılmaz ve düzeltme öncesi finansal tabloların ayrıca sunulmasını
    uygun görmez (7).


    **(c) Net parasal pozisyon kazancı/kaybı (27, 28, 9)**


    Parasal borçları parasal varlıklarından fazla olan işletme satın alma gücü kazanır; kazanç veya kayıp, dönem içi ağırlıklı
    ortalama net parasal pozisyon farkının genel fiyat endeksindeki değişimle çarpılması yoluyla tahmin edilebilir (27). Yıl
    içi endeks değişimi = 363 / 242 − 1 = %50. Kazanç = 1.200.000 × 0,50 = **600.000 TL**.


    Endekse anlaşmayla bağlı kredi için 13. paragraf gereği yapılan düzeltme (500.000 × 363 / 242 = 750.000; fark **250.000
    TL**) net parasal pozisyon kâr/zararı ile netleştirilir (28). Net tutar = 600.000 − 250.000 = **350.000 TL kazanç**; kâr
    veya zarara dahil edilerek ayrıca gösterilir (9).


    | Kalem | TL |

    |---|---|

    | Satışlar | 6.754.000 |

    | Satışların maliyeti | (4.052.400) |

    | Faaliyet giderleri | (868.450) |

    | Finansman gideri | (300.300) |

    | Faaliyet sonucu | 1.532.850 |

    | Net parasal pozisyon kazancı (net) | 350.000 |

    | **Vergi öncesi dönem kârı** | **1.882.850** |


    **(d) Nakit akış tablosu ve enflasyon döneminin sonu**


    Nakit akış tablosundaki tüm kalemler raporlama dönemi sonundaki cari ölçüm birimine göre ifade edilir (33). Yüksek enflasyon
    dönemi sona erip işletme finansal tablolarını bu Standarda göre hazırlamayı bıraktığında, önceki raporlama döneminin cari
    ölçüm birimiyle ifade edilen dönem sonu tutarları izleyen finansal tablolarda defter değerleri için esas alınır (38).

    '
