- id: YMM-IFM-FAR-K001
  sinav: ymm
  ders: IFM
  konu: FAR
  kazanimlar:
  - TFRS 9 sınıflandırma ve ölçüm
  - etkin faiz yöntemi
  - beklenen kredi zararı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Yıldız AŞ, 1.1.2026 tarihinde Kuzey AŞ''nin ihraç ettiği tahvilleri satın almıştır:


    - Nominal değer: 1.000.000 TL; vade: 31.12.2027 (2 yıl)

    - Kupon: yıllık %6, her yıl 31 Aralık''ta ödenir

    - Ödenen tutar (işlem maliyetleri dahil): 930.578 TL

    - Etkin faiz oranı: %10 (hesaplarda tam TL''ye yuvarlayınız)

    - Sözleşme şartları belirli tarihlerde yalnız anapara ve anapara bakiyesine ilişkin faiz ödemesi doğurmaktadır.

    - 31.12.2026: Kupon tahsil edilmiştir. Kredi riskinde önemli artış yoktur; 12 aylık beklenen kredi zararı 9.000 TL''dir.
    Tahvillerin gerçeğe uygun değeri 950.000 TL''dir.


    **İstenenler**


    (a) Yıldız AŞ, tahvilleri yalnızca sözleşmeye bağlı nakit akışlarını tahsil etmek amacıyla elde tutmaktadır. Tahvillerin
    ölçüm sınıfını ve ilk ölçüm tutarını gerekçesiyle belirtiniz. (4 puan)


    (b) (a)''daki sınıflandırmaya göre 2026 ve 2027 yıllarına ilişkin itfa tablosunu düzenleyiniz ve 2026 yılı faiz geliri,
    kupon tahsilatı ve beklenen kredi zararı kayıtlarını yapınız. (9 puan)


    (c) Tahviller, hem tahsil hem satış amaçlı bir iş modelinde tutulsaydı 31.12.2026 itibarıyla finansal durum tablosundaki
    tutar, kâr veya zarar ve diğer kapsamlı gelir etkileri ne olurdu? (7 puan)


    (d) (a)''daki sınıflandırma altında, tahvillerin 1.1.2027 itibarıyla kredi-değer düşüklüğüne uğradığı ve ömür boyu beklenen
    kredi zararının 300.000 TL olarak ölçüldüğü varsayımıyla 2027 yılı faiz gelirini hesaplayınız. (5 puan)

    '
  cozum: '**(a) Sınıflandırma ve ilk ölçüm**


    İş modeli sözleşmeye bağlı nakit akışlarını tahsil etmektir ve nakit akışları yalnız anapara ve faiz ödemelerinden oluşur;
    iki şart birlikte sağlandığından tahviller **itfa edilmiş maliyetle** ölçülür (TFRS 9 par. 4.1.2). GUD farkı kâr veya
    zarara yansıtılmayan varlıklarda işlem maliyetleri ilk ölçüme eklenir (par. 5.1.1); ilk ölçüm tutarı **930.578 TL**''dir.


    **(b) İtfa tablosu (etkin faiz %10)**


    | Yıl | Dönem başı itfa edilmiş maliyet | Faiz geliri (%10) | Kupon tahsilatı | Dönem sonu itfa edilmiş maliyet |

    |---|---|---|---|---|

    | 2026 | 930.578 | 93.058 | 60.000 | 963.636 |

    | 2027 | 963.636 | 96.364 | 60.000 | 1.000.000 |


    2026 kayıtları (hesap adları TFRS esasına göredir):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | İtfa edilmiş maliyetle ölçülen finansal varlıklar | 93.058 | |

    | 642 Faiz Gelirleri | | 93.058 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar | 60.000 | |

    | İtfa edilmiş maliyetle ölçülen finansal varlıklar | | 60.000 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Değer düşüklüğü zararı (beklenen kredi zararı gideri) | 9.000 | |

    | Beklenen kredi zararı karşılığı (düzenleyici hesap) | | 9.000 |


    31.12.2026 net defter değeri: 963.636 − 9.000 = 954.636 TL. (Kredi riski önemli artmadığından karşılık 12 aylık BKZ ile
    ölçülür — par. 5.5.5; faiz brüt defter değeri üzerinden hesaplanır — par. 5.4.1.)


    **(c) GUD-DKG sınıflandırması olsaydı (par. 4.1.2A, 5.5.2, 5.7.10)**


    - Faiz geliri yine etkin faiz yöntemiyle 93.058 TL (K/Z); itfa edilmiş maliyet 963.636 TL.

    - Beklenen kredi zararı 9.000 TL K/Z''a gider yazılır; karşılığı **DKG**''dir, varlığın defter değerini azaltmaz.

    - Finansal durum tablosunda tutar: gerçeğe uygun değer **950.000 TL**.

    - GUD değişimi: 950.000 − 963.636 = −13.636 TL; DKG net etkisi: −13.636 + 9.000 = **−4.636 TL** (azalış).

    - K/Z toplamı: 93.058 − 9.000 = 84.058 TL (İEM sınıflandırmasıyla aynı).


    **(d) Kredi-değer düşüklüğü sonrası faiz geliri**


    Sonradan kredi-değer düşüklüğüne uğrayan varlıkta faiz, sonraki dönemlerde itfa edilmiş maliyete (brüt defter değeri −
    zarar karşılığı) uygulanır (par. 5.4.1(b)):


    2027 faiz geliri = (963.636 − 300.000) × %10 = 663.636 × %10 = **66.364 TL**


    (Brüt esasla hesaplansaydı 96.364 TL olurdu; fark 30.000 TL''dir.)

    '
  puanlama:
  - olcut: (a) İş modeli ve nakit akışı koşulunun birlikte değerlendirilip İEM sonucuna varılması
    puan: 2
  - olcut: (a) İşlem maliyetlerinin ilk ölçüme dahil edilmesi (930.578)
    puan: 2
  - olcut: (b) İtfa tablosunun doğru düzenlenmesi (93.058; 963.636; 96.364; 1.000.000)
    puan: 4
  - olcut: (b) Faiz geliri ve kupon tahsilatı kayıtları
    puan: 3
  - olcut: (b) 12 aylık BKZ kaydı (9.000)
    puan: 2
  - olcut: (c) Defter değerinin GUD (950.000) olması ve karşılığın defter değerini azaltmaması
    puan: 3
  - olcut: (c) K/Z (faiz 93.058, BKZ 9.000) ve DKG net etkisinin (−4.636) doğru hesaplanması
    puan: 4
  - olcut: (d) Net esasa geçişin gerekçesi ve 66.364 TL faiz geliri
    puan: 5
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 4.1.2, 4.1.2A, 5.1.1, 5.4.1, 5.5.2, 5.5.5, 5.7.10
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
  dogrulama:
    python: "ilk = 930578\nf26 = round(ilk * 0.10)\nim26 = ilk + f26 - 60000\nf27 = round(im26 * 0.10)\nim27 = im26 + f27\
      \ - 60000\ndkg = (950000 - im26) + 9000\nf27_net = round((im26 - 300000) * 0.10)\nsonuc = {'ilk_olcum': ilk, 'faiz_2026':\
      \ f26, 'itfa_2026': im26, 'faiz_2027': f27, 'itfa_2027': im27,\n         'net_defter_2026': im26 - 9000, 'dkg_net':\
      \ dkg, 'kz_toplam': f26 - 9000, 'faiz_2027_net': f27_net}"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 4, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_IFM-1.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-FAR-K002
  sinav: ymm
  ders: IFM
  konu: FAR
  kazanimlar:
  - TFRS 9 sınıflandırma ve ölçüm
  - beklenen kredi zararı
  - riskten korunma muhasebesi temel ilkeleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Zeta Sanayi AŞ**'nin 2026 yılı finansal araç işlemleri:\n\n1. Uzun vadeli stratejik amaçla 1.000.000 TL'ye hisse\
    \ senedi alınmış ve ilk kayıtta gerçeğe uygun değer değişimlerinin\n   diğer kapsamlı gelirde sunulması seçilmiştir. Yıl\
    \ sonu gerçeğe uygun değeri 1.200.000 TL'dir. Hisse 2027'de\n   1.300.000 TL'ye satılacaktır.\n2. 1.1.2026'da nominal\
    \ 2.000.000 TL, yıllık %20 kuponlu devlet tahvili nominal değerden alınmıştır. Tahvil hem\n   sözleşmeye bağlı nakit akışlarını\
    \ tahsil etmek hem de satmak amacıyla yönetilen bir portföyde tutulmaktadır.\n   Kupon yıl sonunda tahsil edilmiştir.\
    \ Yıl sonu gerçeğe uygun değeri 1.950.000 TL, 12 aylık beklenen kredi zararı\n   10.000 TL'dir.\n3. 500.000 TL'ye bir\
    \ şirketin hisseye dönüştürülebilir tahvili alınmıştır; yıl sonu gerçeğe uygun değeri 560.000 TL'dir.\n4. Önemli finansman\
    \ bileşeni içermeyen ticari alacakların yaşlandırması ve karşılık matrisi:\n\n   | Grup | Tutar (TL) | Kayıp oranı |\n\
    \   |---|---|---|\n   | Vadesi gelmemiş | 4.000.000 | %1 |\n   | 1–30 gün gecikmiş | 1.000.000 | %5 |\n   | 31–90 gün\
    \ gecikmiş | 500.000 | %20 |\n   | 90 günden fazla gecikmiş | 200.000 | %60 |\n\n   Dönem başı zarar karşılığı 180.000\
    \ TL'dir.\n5. Mart 2027'de yapılması çok muhtemel bir döviz cinsinden makine alımının kur riskine karşı vadeli döviz alım\n\
    \   sözleşmesi yapılmış ve nakit akış riskinden korunma olarak belgelenmiştir. Yıl sonunda vadeli sözleşmenin gerçeğe\n\
    \   uygun değeri 80.000 TL (varlık), korunan beklenen nakit akışlarının bugünkü değerindeki kümülatif değişim\n   70.000\
    \ TL (aleyhte) olarak ölçülmüştür.\n\n**İstenenler:**\n\n(a) 1–4 numaralı varlıkları TFRS 9'a göre sınıflandırınız (iş\
    \ modeli ve nakit akış özellikleri testine\ndeğinerek). (7 puan)\n\n(b) 1, 2 ve 3 numaralı araçların 2026 kayıtlarını\
    \ yapınız; 1 numaralı hissenin 2027 satışında birikmiş tutarın\nnasıl işleneceğini açıklayınız. (8 puan)\n\n(c) Ticari\
    \ alacaklar için beklenen kredi zararını hesaplayıp kaydediniz. (4 puan)\n\n(d) Riskten korunma işleminin etkin ve etkin\
    \ olmayan kısmını hesaplayıp kaydediniz; makine alındığında fonun nasıl\nişleneceğini belirtiniz; 2026 kâr veya zarar\
    \ ile diğer kapsamlı gelir toplam etkisini bulunuz. (6 puan)\n"
  cozum: "**(a) Sınıflandırma**\n\n| No | Değerlendirme | Sınıf |\n|---|---|---|\n| 1 | Alım-satım amaçlı olmayan özkaynak\
    \ aracı; ilk kayıtta geri dönülemez seçim yapılmış (TFRS 9.4.1.4, 5.7.5) | GUD farkı DKG'ye yansıtılan |\n| 2 | Hem tahsil\
    \ hem satış iş modeli; nakit akışları yalnız anapara ve faiz ödemesi (TFRS 9.4.1.2A) | GUD farkı DKG'ye yansıtılan (borçlanma\
    \ aracı) |\n| 3 | Dönüştürme hakkı nedeniyle nakit akışları yalnız anapara ve faizden oluşmaz; test başarısız (TFRS 9.4.1.4)\
    \ | GUD farkı K/Z'ye yansıtılan |\n| 4 | Tahsil amaçlı iş modeli; yalnız anapara ve faiz (TFRS 9.4.1.2) | İtfa edilmiş\
    \ maliyet |\n\n**(b) Kayıtlar**\n\n1. Hisse: GUD artışı **200.000 TL** DKG'de: hisse senedi hesabı borç / GUD Farkı DKG'ye\
    \ Yansıtılan Finansal Varlıklar\n   Değer Artış Fonu (ilave özkaynak hesabı) alacak 200.000. 2027'deki satışta birikmiş\
    \ tutar (satış dahil\n   toplam 300.000 TL) **kâr veya zarara aktarılmaz**; özkaynak içinde geçmiş yıllar kârlarına aktarılabilir\n\
    \   (TFRS 9.B5.7.1). Alınan kâr payları kâr veya zarara alınır.\n2. Tahvil: Faiz geliri (etkin faiz, nominal değerden\
    \ alındığından %20) = **400.000 TL** (102 borç / 642 alacak).\n   Beklenen kredi zararı **10.000 TL** kâr veya zarara,\
    \ karşılığı DKG'ye kaydedilir; varlığın defter değeri\n   azaltılmaz (TFRS 9.5.5.2). GUD değişimi −50.000 TL.\n\n   |\
    \ Hesap | Borç | Alacak |\n   |---|---|---|\n   | 654 Karşılık Giderleri (BKZ) | 10.000 | |\n   | Değer Artış Fonu (DKG)\
    \ | | 10.000 |\n   | Değer Artış Fonu (DKG) | 50.000 | |\n   | Devlet tahvili (GUD farkı DKG'ye yansıtılan) | | 50.000\
    \ |\n\n   DKG'de net **40.000 TL** azalış oluşur; satışta bu birikmiş tutar kâr veya zarara **aktarılır** (TFRS 9.5.7.10–11).\n\
    3. Dönüştürülebilir tahvil: GUD artışı **60.000 TL** kâr veya zarara (642/649 alacak).\n\n**(c) Ticari alacak BKZ**\n\n\
    Önemli finansman bileşeni içermeyen ticari alacaklarda zarar karşılığı her zaman **ömür boyu** beklenen kredi zararına\n\
    eşit tutarda ölçülür (basitleştirilmiş yaklaşım, TFRS 9.5.5.15); karşılık matrisi kullanılabilir (TFRS 9.B5.5.35).\n\n\
    - Karşılık = 40.000 + 50.000 + 100.000 + 120.000 = **310.000 TL**; artış = 310.000 − 180.000 = **130.000 TL**:\n  654\
    \ borç / 129 Şüpheli Ticari Alacaklar Karşılığı (BKZ alt hesabı) alacak 130.000.\n\n**(d) Nakit akış riskinden korunma**\n\
    \nRiskten korunma fonuna, araçtaki kümülatif kazanç ile korunan kalemdeki kümülatif değişimden **mutlak olarak düşük\n\
    olanı** alınır (TFRS 9.6.5.11-a): min(80.000; 70.000) = **70.000 TL** DKG'de; etkin olmayan **10.000 TL** kâr veya\nzarara\
    \ alınır.\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| Türev Finansal Varlıklar (ilave hesap) | 80.000 | |\n| Nakit\
    \ Akış Riskinden Korunma Fonu (DKG) | | 70.000 |\n| 649 Diğer Olağan Gelir ve Kârlar (etkin olmayan kısım) | | 10.000\
    \ |\n\nMakine alındığında fondaki 70.000 TL fondan çıkarılarak **makinenin ilk maliyetine** dahil edilir; bu işlem diğer\n\
    kapsamlı gelirden aktarım sayılmaz (TFRS 9.6.5.11-d-i).\n\n2026 toplam etkisi: kâr veya zarar = 400.000 − 10.000 + 60.000\
    \ − 130.000 + 10.000 = **330.000 TL**; diğer kapsamlı\ngelir = 200.000 − 40.000 + 70.000 = **230.000 TL**.\n"
  puanlama:
  - olcut: (a) Dört varlığın iş modeli ve SPPI gerekçeli sınıflandırması
    puan: 7
  - olcut: (b) Hissede 200.000 TL DKG ve satışta geri dönüşüm olmaması
    puan: 3
  - olcut: (b) Tahvilde faiz 400.000, BKZ 10.000 ve DKG net 40.000 TL
    puan: 3
  - olcut: (b) Dönüştürülebilir tahvilde 60.000 TL K/Z
    puan: 2
  - olcut: (c) Basitleştirilmiş yaklaşım, 310.000 TL karşılık ve 130.000 TL artış
    puan: 4
  - olcut: (d) Etkin 70.000 / etkin olmayan 10.000 TL ve kayıt
    puan: 3
  - olcut: (d) Makine maliyetine ekleme ve toplam K/Z 330.000 / DKG 230.000 TL
    puan: 3
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 4.1.2, 4.1.2A, 4.1.4, 5.5.2, 5.5.15, 5.7.5, 6.5.11, B5.5.35, B5.7.1
    alinti: Nakit akış değişkenliğinden korunma işlemi 6.4.1 paragrafında yer alan gerekli kıstasları karşıladığı
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "bkz = 4000000 * 0.01 + 1000000 * 0.05 + 500000 * 0.20 + 200000 * 0.60\netkin = min(80000, 70000)\nkz = 2000000\
      \ * 0.20 - 10000 + 60000 - (bkz - 180000) + (80000 - etkin)\ndkg = 200000 - (50000 - 10000) + etkin\nsonuc = {\"h\"\
      : 200000, \"h_top\": 300000, \"faiz\": 2000000 * 0.20, \"bkz_t\": 10000, \"dkg_t\": 40000, \"dt\": 60000,\n        \
      \ \"bkz\": bkz, \"art\": bkz - 180000, \"etkin\": etkin, \"etkisiz\": 80000 - etkin, \"kz\": kz, \"dkg\": dkg}\n"
