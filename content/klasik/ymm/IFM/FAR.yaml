  soru: '**Veriler**


    Yıldız AŞ, 1.1.2026 tarihinde Kuzey AŞ''nin ihraç ettiği tahvilleri satın almıştır:


    - Nominal değer: 1.000.000 TL; vade: 31.12.2027 (2 yıl)

    - Kupon: yıllık %6, her yıl 31 Aralık''ta ödenir

    - Ödenen tutar (işlem maliyetleri dahil): 930.578 TL

    - Etkin faiz oranı: %10 (hesaplarda tam TL''ye yuvarlayınız)

    - Sözleşme şartları belirli tarihlerde yalnız anapara ve anapara bakiyesine ilişkin faiz ödemesi doğurmaktadır.

    - 31.12.2026: Kupon tahsil edilmiştir. Kredi riskinde önemli artış yoktur; 12 aylık beklenen kredi zararı 9.000 TL''dir.
    Tahvillerin gerçeğe uygun değeri 950.000 TL''dir.


    **İstenenler**


    (a) Yıldız AŞ, tahvilleri yalnızca sözleşmeye bağlı nakit akışlarını tahsil etmek amacıyla elde tutmaktadır. Tahvillerin
    ölçüm sınıfını ve ilk ölçüm tutarını gerekçesiyle belirtiniz. (4 puan)


    (b) (a)''daki sınıflandırmaya göre 2026 ve 2027 yıllarına ilişkin itfa tablosunu düzenleyiniz ve 2026 yılı faiz geliri,
    kupon tahsilatı ve beklenen kredi zararı kayıtlarını yapınız. (9 puan)


    (c) Tahviller, hem tahsil hem satış amaçlı bir iş modelinde tutulsaydı 31.12.2026 itibarıyla finansal durum tablosundaki
    tutar, kâr veya zarar ve diğer kapsamlı gelir etkileri ne olurdu? (7 puan)


    (d) (a)''daki sınıflandırma altında, tahvillerin 1.1.2027 itibarıyla kredi-değer düşüklüğüne uğradığı ve ömür boyu beklenen
    kredi zararının 300.000 TL olarak ölçüldüğü varsayımıyla 2027 yılı faiz gelirini hesaplayınız. (5 puan)

    '
  cozum: '**(a) Sınıflandırma ve ilk ölçüm**


    İş modeli sözleşmeye bağlı nakit akışlarını tahsil etmektir ve nakit akışları yalnız anapara ve faiz ödemelerinden oluşur;
    iki şart birlikte sağlandığından tahviller **itfa edilmiş maliyetle** ölçülür (TFRS 9 par. 4.1.2). GUD farkı kâr veya
    zarara yansıtılmayan varlıklarda işlem maliyetleri ilk ölçüme eklenir (par. 5.1.1); ilk ölçüm tutarı **930.578 TL**''dir.


    **(b) İtfa tablosu (etkin faiz %10)**


    | Yıl | Dönem başı itfa edilmiş maliyet | Faiz geliri (%10) | Kupon tahsilatı | Dönem sonu itfa edilmiş maliyet |

    |---|---|---|---|---|

    | 2026 | 930.578 | 93.058 | 60.000 | 963.636 |

    | 2027 | 963.636 | 96.364 | 60.000 | 1.000.000 |


    2026 kayıtları (hesap adları TFRS esasına göredir):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | İtfa edilmiş maliyetle ölçülen finansal varlıklar | 93.058 | |

    | 642 Faiz Gelirleri | | 93.058 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar | 60.000 | |

    | İtfa edilmiş maliyetle ölçülen finansal varlıklar | | 60.000 |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Değer düşüklüğü zararı (beklenen kredi zararı gideri) | 9.000 | |

    | Beklenen kredi zararı karşılığı (düzenleyici hesap) | | 9.000 |


    31.12.2026 net defter değeri: 963.636 − 9.000 = 954.636 TL. (Kredi riski önemli artmadığından karşılık 12 aylık BKZ ile
    ölçülür — par. 5.5.5; faiz brüt defter değeri üzerinden hesaplanır — par. 5.4.1.)


    **(c) GUD-DKG sınıflandırması olsaydı (par. 4.1.2A, 5.5.2, 5.7.10)**


    - Faiz geliri yine etkin faiz yöntemiyle 93.058 TL (K/Z); itfa edilmiş maliyet 963.636 TL.

    - Beklenen kredi zararı 9.000 TL K/Z''a gider yazılır; karşılığı **DKG**''dir, varlığın defter değerini azaltmaz.

    - Finansal durum tablosunda tutar: gerçeğe uygun değer **950.000 TL**.

    - GUD değişimi: 950.000 − 963.636 = −13.636 TL; DKG net etkisi: −13.636 + 9.000 = **−4.636 TL** (azalış).

    - K/Z toplamı: 93.058 − 9.000 = 84.058 TL (İEM sınıflandırmasıyla aynı).


    **(d) Kredi-değer düşüklüğü sonrası faiz geliri**


    Sonradan kredi-değer düşüklüğüne uğrayan varlıkta faiz, sonraki dönemlerde itfa edilmiş maliyete (brüt defter değeri −
    zarar karşılığı) uygulanır (par. 5.4.1(b)):


    2027 faiz geliri = (963.636 − 300.000) × %10 = 663.636 × %10 = **66.364 TL**


    (Brüt esasla hesaplansaydı 96.364 TL olurdu; fark 30.000 TL''dir.)

    '
  puanlama:
  - olcut: (a) İş modeli ve nakit akışı koşulunun birlikte değerlendirilip İEM sonucuna varılması
    puan: 2
  - olcut: (a) İşlem maliyetlerinin ilk ölçüme dahil edilmesi (930.578)
    puan: 2
  - olcut: (b) İtfa tablosunun doğru düzenlenmesi (93.058; 963.636; 96.364; 1.000.000)
    puan: 4
  - olcut: (b) Faiz geliri ve kupon tahsilatı kayıtları
    puan: 3
  - olcut: (b) 12 aylık BKZ kaydı (9.000)
    puan: 2
  - olcut: (c) Defter değerinin GUD (950.000) olması ve karşılığın defter değerini azaltmaması
    puan: 3
  - olcut: (c) K/Z (faiz 93.058, BKZ 9.000) ve DKG net etkisinin (−4.636) doğru hesaplanması
    puan: 4
  - olcut: (d) Net esasa geçişin gerekçesi ve 66.364 TL faiz geliri
    puan: 5
  kaynaklar:
