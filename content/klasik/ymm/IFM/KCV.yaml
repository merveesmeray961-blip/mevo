  soru: '**Veriler**


    Boğaziçi Kablo AŞ takvim yılını hesap dönemi olarak kullanmakta ve TFRS''ye göre finansal tablo hazırlamaktadır. İşletmenin
    normal faaliyet döngüsü açıkça belirlenebilmekte olup 18 aydır. 31.12.2026 tarihli finansal tablolar 12.3.2027''de yayımlanmak
    üzere onaylanmıştır. 31.12.2026 itibarıyla finansal durum tablosuna ilişkin bilgiler aşağıdadır (tutarlar TL):


    | Kalem | Tutar | Açıklama |

    |---|---|---|

    | Vadesiz mevduat | 600.000 | Kullanımı serbesttir |

    | Bloke mevduat | 300.000 | Kredi teminatı olarak 30.6.2028''e kadar bloke edilmiştir; bu tarihe kadar kullanılamaz |

    | Ticari alacaklar (brüt) | 1.500.000 | Bunun 400.000''i Z AŞ''ye aittir; şüpheli alacak değer düşüklüğü karşılığı 180.000''dir
    |

    | Z AŞ''den alınan sipariş avansı | 250.000 | Z AŞ ile yasal mahsup hakkı ve net tahsilat/ödeme niyeti yoktur |

    | Stoklar | 2.000.000 | Bunun 700.000''inin 31.12.2026''dan itibaren 14 ay sonra satılması beklenmektedir |

    | Maddi duran varlıklar (net) | 4.800.000 | |

    | Ticari borçlar | 1.100.000 | Bunun 400.000''inin vadesi 31.3.2028''dir |


    Banka kredileri (hiçbiri normal faaliyet döngüsünde kullanılan işletme sermayesinin parçası değildir ve ticari amaçla
    elde tutulmamaktadır):


    | Kredi | Tutar | Bilgiler |

    |---|---|---|

    | K-1 | 1.800.000 | Vadesi 30.9.2028''dir. Sözleşmedeki cari oran şartı 31.12.2026''da sağlanamamış ve kredi veren talep
    hâlinde ödeme isteme hakkı kazanmıştır. Kredi veren 18.1.2027''de bu ihlal nedeniyle ödeme talep etmeyeceğini yazılı olarak
    bildirmiştir. |

    | K-2 | 1.200.000 | Vadesi 31.5.2027''dir. Raporlama tarihinde vadeyi uzatma hakkı yoktur; ödemeleri 2030''a yayan yeni
    bir finansman sözleşmesi 12.2.2027''de imzalanmıştır. |

    | K-3 | 900.000 | Vadesi 15.3.2029''dur. Sözleşme şartlarına uyulmuştur. Yönetim krediyi 2027 içinde erken kapatmayı planlamış
    ve 28.2.2027''de ödemiştir. |

    | K-4 | 2.400.000 | Dört eşit yıllık taksitle ödenecektir (taksit 600.000; ilk taksit 30.6.2027, son taksit 30.6.2030).
    Sözleşme şartlarına uyulmuştur. |


    Diğer bilgiler:


    - 2026''da defter değeri 520.000 olan bir makine 700.000''ye satılmış, bu satış için 20.000 satış komisyonu ödenmiştir.

    - 2026''da 90.000 garanti karşılığı gideri ayrılmıştır; bu harcamanın 60.000''ini tedarikçi, yapılan sözleşme gereği tazmin
    edecektir ve tazminatın alınması kesine yakındır.

    - 2026''da 45.000 kur farkı kazancı ve 30.000 kur farkı zararı oluşmuştur; her ikisi de önemsizdir.

    - Yönetim, stoklarda izlediği yedek parçaları 2026''da maddi duran varlıklara yeniden sınıflandırmıştır (bu sunum, gözden
    geçirme sonucunda daha uygun bulunmuştur). Yedek parçaların tutarı 1.1.2025''te 350.000, 31.12.2025''te 400.000''dir.
    Yeniden sınıflandırmanın 1.1.2025 tarihli finansal durum tablosu üzerindeki etkisi önemlidir ve karşılaştırmalı tutarların
    yeniden sınıflandırılması mümkündür.


    **İstenenler**


    (a) Yukarıdaki bilgilere göre 31.12.2026 finansal durum tablosunda dönen varlıklar, duran varlıklar, kısa vadeli yükümlülükler
    ve uzun vadeli yükümlülükler toplamlarını hesaplayınız; cari oranı bulunuz. (7 puan)


    (b) K-1, K-2, K-3 ve K-4 kredilerinin sınıflandırmasını gerekçesiyle açıklayınız; raporlama dönemi sonrasındaki gelişmelerin
    TMS 10 bakımından nasıl ele alınacağını belirtiniz. (8 puan)


    (c) Gelir tablosu ve finansal durum tablosunda hangi kalemlerin netleştirilebileceğini veya netleştirilemeyeceğini tutarlarla
    belirtiniz. (5 puan)


    (d) 2026 finansal tablolarıyla birlikte sunulacak tablo sayısını (türleri itibarıyla) ve yeniden sınıflandırmaya ilişkin
    yapılacak açıklamaları belirtiniz. (4 puan)

    '
  cozum: '**(a) Sınıflandırma ve toplamlar (TMS 1 par. 66, 68, 69, 70, 71)**


    | Kalem | Dönen | Duran | Kısa vadeli yük. | Uzun vadeli yük. |

    |---|---|---|---|---|

    | Vadesiz mevduat | 600.000 | | | |

    | Bloke mevduat (30.6.2028''e kadar kullanılamaz; par. 66(d) şartı yok) | | 300.000 | | |

    | Ticari alacaklar (1.500.000 − 180.000; karşılık düşülmesi netleştirme değildir) | 1.320.000 | | | |

    | Stoklar (normal faaliyet döngüsü içinde; 14 ay sonra satılacak 700.000 dâhil) | 2.000.000 | | | |

    | Maddi duran varlıklar | | 4.800.000 | | |

    | Ticari borçlar (normal faaliyet döngüsü içinde; 15 ay sonra vadeli 400.000 dâhil) | | | 1.100.000 | |

    | Z AŞ sipariş avansı | | | 250.000 | |

    | K-1 | | | 1.800.000 | |

    | K-2 | | | 1.200.000 | |

    | K-3 | | | | 900.000 |

    | K-4 (2027 taksiti kısa; kalan 3 taksit uzun) | | | 600.000 | 1.800.000 |

    | **Toplam** | **3.920.000** | **5.100.000** | **4.950.000** | **2.700.000** |


    Cari oran = 3.920.000 / 4.950.000 = **0,79** (net çalışma sermayesi −1.030.000).


    Normal faaliyet döngüsü 18 ay olduğundan stoklar ve ticari alacaklar 12 aydan sonra realize olsa da dönen varlıktır; ticari
    borçlar da aynı döngü kullanıldığından kısa vadelidir (par. 68, 70). 12 aydan uzun sürede geri kazanılacak stok (700.000)
    ve 12 aydan sonra ödenecek ticari borç (400.000) tutarları ayrıca açıklanır (par. 65).


    **(b) Kredilerin sınıflandırması (par. 69, 72, 74, 75A, 76)**


    | Kredi | Sınıf | Gerekçe | TMS 10 / par. 76 |

    |---|---|---|---|

    | K-1 | Kısa vadeli | Şart ihlali raporlama tarihinde vardır; kredi veren sonradan (18.1.2027) ödeme talep etmeyeceğini
    bildirmiş olsa da 31.12.2026''da ödemeyi 12 ay ertelemeye hakkı yoktur (par. 74). Süre tanıma bu tarihten önce olmamıştır
    (par. 75 şartı yok). | Düzeltme gerektirmeyen olay olarak açıklanır (par. 74 ve 76(b)–(c) kapsamındaki olaylara benzer
    nitelikte) |

    | K-2 | Kısa vadeli | Vadesi 12 ay içindedir; raporlama tarihinde uzatma hakkı yoktur. Yeniden finansman raporlama tarihinden
    sonra yapıldığından sınıflandırmayı değiştirmez (par. 72, 73). | Düzeltme gerektirmeyen olay (par. 76(a)) |

    | K-3 | Uzun vadeli | Raporlama sonunda ödemeyi 12 aydan fazla erteleme hakkı vardır; yönetimin erken ödeme niyeti veya
    raporlama sonrası ödeme sınıflandırmayı etkilemez (par. 75A). Ödemenin zamanlaması açıklanabilir. | Düzeltme gerektirmeyen
    olay (par. 76(d)) |

    | K-4 | 600.000 kısa, 1.800.000 uzun | Uzun vadeli kredinin 12 ay içinde ödenecek kısmı kısa vadelidir (par. 71). | –
    |


    TMS 10 uyarınca bu olaylar finansal tabloların tutar ve sınıflandırmasında düzeltme yapılmasını gerektirmez; niteliği
    ve finansal etkisi dipnotta açıklanır.


    **(c) Netleştirme (par. 32, 33, 34, 35)**


    | Kalem | Sonuç | Tutar |

    |---|---|---|

    | Makine satışı | Satış bedelinden defter değeri ve satış giderleri düşülerek net kazanç sunulur (par. 34(a)): 700.000
    − 520.000 − 20.000 | 160.000 net kazanç |

    | Garanti gideri ve tedarikçi tazminatı | Gelir tablosunda net gösterilebilir (par. 34(b)): 90.000 − 60.000 | 30.000 net
    gider |

    | Kur farkı kazanç/zararı | Önemsiz olduğundan netleştirilerek sunulur (par. 35): 45.000 − 30.000 | 15.000 net kazanç
    |

    | Z AŞ alacağı (400.000) ve avansı (250.000) | Yasal mahsup hakkı ve net niyet olmadığından netleştirilemez (par. 32):
    alacak ile avans ayrı gösterilir | 400.000 varlık / 250.000 yükümlülük |

    | Şüpheli alacak karşılığı | Değer düşüklüğü indirilerek alacağın net gösterilmesi netleştirme değildir (par. 33) | 1.320.000
    |


    **(d) Sunulacak tablolar ve açıklamalar (par. 38A, 40A–40D, 41)**


    Yeniden sınıflandırmanın 1.1.2025 finansal durum tablosuna etkisi önemli olduğundan üç finansal durum tablosu sunulur:
    31.12.2026, 31.12.2025 ve 1.1.2025. Diğer tablolar (kâr veya zarar ve diğer kapsamlı gelir, nakit akış, özkaynak değişim)
    en az ikişer dönem için sunulur (2026 ve 2025). 1.1.2025 tablosuna ilişkin dipnot sunulması gerekmez (par. 40C). Yeniden
    sınıflandırma hakkında açıklanır: nitelik (stoklardan maddi duran varlıklara), her kalemin tutarı (1.1.2025''te 350.000;
    31.12.2025''te 400.000) ve gerekçe (daha uygun sunum) (par. 41).

    '
  puanlama:
  - olcut: (a) Bloke mevduat, stok/alacak ve ticari borçlarda normal faaliyet döngüsüne göre doğru sınıflandırma
    puan: 3
  - olcut: (a) Dönen 3.920.000, duran 5.100.000, kısa vadeli 4.950.000 ve uzun vadeli 2.700.000 toplamları
    puan: 3
  - olcut: (a) Cari oranın 0,79 bulunması
    puan: 1
  - olcut: (b) K-1 için ihlal ve raporlama sonrası feragat nedeniyle kısa vadeli sınıflandırma (par. 74)
    puan: 2
  - olcut: (b) K-2 için raporlama sonrası yeniden finansmanın sınıflandırmayı değiştirmemesi (par. 72)
    puan: 2
  - olcut: (b) K-3 için yönetim niyetinin etkisizliği ve uzun vadeli sınıflandırma (par. 75A)
    puan: 2
  - olcut: (b) K-4 için kısa/uzun ayrımı ve düzeltme gerektirmeyen olay açıklamaları (par. 76)
    puan: 2
  - olcut: (c) Makine satış kazancının 160.000 ve garanti giderinin 30.000 net sunulması
    puan: 2
  - olcut: (c) Kur farkının net sunulması (15.000), Z AŞ alacak/avansın netleştirilmemesi ve karşılığın netleştirme olmadığı
    puan: 3
  - olcut: (d) Üçüncü finansal durum tablosu şartı ve tablo sayıları (3 FDT; diğerleri 2 dönem; açılış notları yok)
    puan: 2
  - olcut: '(d) Yeniden sınıflandırma açıklamaları: nitelik, tutarlar (350.000 / 400.000) ve gerekçe'
    puan: 2
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 66(d)
    alinti: Raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü yerine getirmek amacıyla kullanılmasının ya
      da takas edilmesinin sınırlandırılmamış olması koşuluyla, varlığın nakit veya nakit benzeri olması (TMS 7'de tanımlanan
      şekilde).
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 70
    alinti: Ticari borçlar, çalışanlar için yapılan bazı tahakkuklar ve işletme faaliyetleriyle ilgili diğer maliyetler gibi
      bazı kısa vadeli yükümlülükler, işletmenin normal faaliyet döngüsü içinde kullanılan işletme sermayesinin bir parçasıdır.
      İşletme, işletme faaliyetleriyle ilgili bu tür kalemleri, raporlama döneminden sonraki on iki aydan daha uzun sürede
      vadesi dolacak olsa bile, kısa vadeli yükümlülük olarak sınıflandırır.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 72
    alinti: 'Aşağıdaki durumlar söz konusu olsa bile, finansal yükümlülüklerin raporlama döneminden sonraki on iki ay içinde
      vadesinin dolması durumunda işletme, bu yükümlülükleri kısa vadeli yükümlülük olarak sınıflandırır: (a) Başlangıçtaki
      vadenin on iki aydan uzun olması ve (b) Uzun vadeli bir yeniden finansman sözleşmesinin veya uzun vadeli olacak şekilde
      ödemeleri yeniden yapılandıran bir sözleşmenin, raporlama döneminden sonra ve finansal tabloların yayımlanması için
      onaylanmasından önce tamamlanması.'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 74
    alinti: İşletmenin, uzun vadeli bir kredi sözleşmesinin koşullarını raporlama dönemi sonunda veya daha önce ihlal etmesi
      ve bunun sonucunda yükümlülüğün talep halinde ödenmesi gereken bir yükümlülük haline gelmesi durumunda; borç veren,
      raporlama döneminden sonra ve finansal tabloların yayımlanması için onaylanmasından önce bu ihlalin bir sonucu olarak
      ödeme yapılmasını talep etmeyeceğini kabul etse dahi, işletme yükümlülüğü kısa vadeli olarak sınıflandırır.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 75A
    alinti: Bir yükümlülüğün sınıflandırılması işletmenin, yükümlülüğün ödemesini raporlama döneminden en az on iki ay sonraya
      erteleme hakkını kullanma olasılığından etkilenmez.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 76
    alinti: 'Aşağıdaki olayların raporlama dönemi sonu ile finansal tabloların yayımlanması için onaylandığı tarih arasında
      gerçekleşmesi durumunda bu olaylar, TMS 10 Raporlama Döneminden Sonraki Olaylar uyarınca düzeltme gerektirmeyen olaylar
      olarak açıklanır:'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 32
    alinti: İşletme, bir TFRS'de zorunlu kılınmadıkça veya izin verilmedikçe, varlıklar ile yükümlülükleri veya gelirler ile
      giderleri netleştiremez.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 34(a)
    alinti: Yatırımlar ve işletme faaliyetlerinde kullanılan varlıklar da dâhil duran varlıkların elden çıkarılmasında ortaya
      çıkan kazanç ve kayıpları, elden çıkarma sonucu elde edilen tutardan varlığın defter değerini ve ilişkili satış giderlerini
      düşerek sunar
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 40A
    alinti: 'İşletme aşağıdaki durumlarda, 38A paragrafındaki asgari karşılaştırmalı finansal tablolara ilave olarak bir önceki
      dönemin başına ait üçüncü bir finansal durum tablosu sunar: (a) İşletmenin; bir muhasebe politikasını geriye dönük uygulaması,
      finansal tablo kalemlerinde geriye dönük bir düzeltme yapması veya finansal tablo kalemlerini yeniden sınıflandırması
      ve (b) Geriye dönük uygulamanın, geriye dönük düzeltmenin veya yeniden sınıflandırmanın, bir önceki dönemin başındaki
      finansal durum tablosundaki bilgiler üzerinde önemli bir etkiye sahip olması.'
