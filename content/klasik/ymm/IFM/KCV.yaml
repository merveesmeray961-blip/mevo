  soru: 'Doğu Enerji AŞ''nin sermayesinin %55''i Hazine''ye aittir ve Hazine işletme üzerinde kontrol gücüne sahiptir. İşletme
    2026 yılı finansal tablolarında TMS 24''teki devletle ilişkili işletmelere ilişkin kısmi muafiyetten yararlanmak istemektedir.
    2026 yılında gerçekleşen işlemler:


    | Karşı taraf | İşlem | Tutar (TL) |

    |---|---|---|

    | Devlet Madencilik AŞ (Hazine''nin %100 kontrol ettiği şirket) | Elektrik satışı | 48.000.000 |

    | Devlet Demiryolları İşletmesi AŞ (Hazine''nin %100 kontrol ettiği şirket) | Enerji ekipmanı alımı | 15.000.000 |

    | Altı farklı devlet kuruluşu (ayrı ayrı 1.200.000 TL''nin altında) | Elektrik satışı | 4.200.000 (toplam) |

    | Verim Enerji Ltd. (işletmenin %30 pay sahibi olduğu, önemli etkisi bulunan iştiraki; devletle bağlantısı yok) | Hizmet
    alımı | 4.000.000 |


    Yönetim, tek bir işlem tutarı 10.000.000 TL ve üzerindeyse işlemi "ayrı ayrı önemli" saymaktadır. Verim Enerji Ltd. ile
    işlemlerin yıl sonu bakiyeleri: işletmenin borcu 650.000 TL, işletmenin alacağı 300.000 TL (karşılık 45.000 TL). Yönetim
    Verim ile işlemlerin "emsal koşullarda" yapıldığını dipnotta belirtmeyi düşünmekte, ancak bunu destekleyecek doğrulanabilir
    bir veri bulunmamaktadır.


    **İstenenler**


    (a) Dört karşı taraf için ilişkili taraf niteliğini ve muafiyetin hangi taraflar için kullanılabileceğini belirtiniz.
    (7 puan)


    (b) Muafiyetten yararlanılması hâlinde Hazine ve devlet kuruluşlarına ilişkin işlemler için hangi bilgilerin açıklanacağını
    belirtiniz; ayrı ayrı önemli işlemlerin toplamını ve toplu olarak açıklanabilecek işlemlerin toplamını hesaplayınız. (7
    puan)


    (c) Verim Enerji Ltd. için yapılması gereken açıklamaları, açıklanacak net alacak tutarını ve "emsal koşullar" ifadesinin
    kullanılıp kullanılamayacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) İlişkili taraf niteliği**


    - Hazine: işletme üzerinde kontrole sahip devlettir (ana ortaklık düzeyinde ilişkili taraf).

    - Devlet Madencilik AŞ ve Devlet Demiryolları İşletmesi AŞ: aynı devletin hem raporlayan işletme hem de bu işletmeler
    üzerinde kontrole sahip olması nedeniyle ilişkili taraflardır; **devletle ilişkili işletmedir**. Muafiyet kapsamındadırlar
    (par. 25(b)).

    - Altı devlet kuruluşu: devlet veya devletle ilişkili işletme olarak aynı muafiyet kapsamındadır.

    - Verim Enerji Ltd.: iştirak olduğundan ilişkili taraftır (par. 9(b)(ii)); devletle ilişkili olmadığı için muafiyet **kullanılamaz**,
    par. 18 açıklamalarının tamamı yapılır.


    **(b) Muafiyet kapsamında açıklamalar (par. 26)**


    - Devletin adı ve raporlayan işletme ile ilişkisinin niteliği (kontrol).

    - Ayrı ayrı önemli işlemlerin her birinin tutarı ve niteliği: Devlet Madencilik 48.000.000 TL (satış) ve Devlet Demiryolları
    15.000.000 TL (alım); ayrı ayrı önemli işlemler toplamı = 48.000.000 + 15.000.000 = **63.000.000 TL**.

    - Ayrı ayrı önemli olmayan, toplu olarak önemli işlemlerin büyüklüğüne ilişkin niteliksel veya niceliksel gösterge: altı
    devlet kuruluşuna yapılan elektrik satışlarının toplamı = **4.200.000 TL** (benzer nitelikli kalemler toplu açıklanabilir,
    par. 24).


    **(c) Verim Enerji Ltd.**


    - Par. 18-19 gereği iştirakler kategorisi altında ayrıca: işlem tutarı (4.000.000 TL), mevcut bakiyeler (borç 650.000
    TL, alacak 300.000 TL) ve koşulları, teminat/garanti durumu, bakiyelerle ilgili şüpheli alacak karşılığı (45.000 TL) ve
    dönemde giderleştirilen tutar.

    - Net alacak = 300.000 − 45.000 = **255.000 TL**.

    - "Emsal koşullar" ifadesi yalnızca koşullar doğrulanabilir ise kullanılabilir (par. 23); doğrulanabilir veri bulunmadığından
    kullanılamaz.

    '
