- id: YMM-IFM-KCV-K001
  sinav: ymm
  ders: IFM
  konu: KCV
  kazanimlar:
  - TMS 8 muhasebe politikaları tahmin değişiklikleri ve hatalar
  - TMS 10 raporlama döneminden sonraki olaylar ve TMS 24 ilişkili taraflar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(Z) AŞ takvim yılını hesap dönemi olarak kullanmakta ve TFRS''ye göre finansal tablo hazırlamaktadır. 2026 yılı finansal
    tabloları 20 Mart 2027''de yayımlanmak üzere onaylanacaktır. Hata ve düzeltmeler dikkate alınmadan hazırlanan **2026 taslak
    dönem kârı 3.000.000 TL**''dir. Vergi etkileri dikkate alınmayacaktır; kayıtlar Tekdüzen Hesap Planı''na göre yapılacaktır.


    1. 01.01.2025''te 600.000 TL''ye alınan ve idari bölümde kullanılan demirbaşlar, 2025''te yanlışlıkla 770 Genel Yönetim
    Giderleri hesabına yazılmıştır. Demirbaşların yararlı ömrü 5 yıl, kalıntı değeri sıfırdır (doğrusal yöntem). Hata önemlidir;
    2026 taslak kârında bu demirbaşlar için amortisman ayrılmamıştır.

    2. 01.01.2023''te 1.800.000 TL''ye alınan ve idari binada kullanılan jeneratör 10 yıl ömür ve sıfır kalıntı değerle amortismana
    tabi tutulmaktadır. 2026 başında kalan yararlı ömrün 4 yıl, kalıntı değerin 60.000 TL olduğu belirlenmiştir. Taslak kârda
    eski esasa göre 180.000 TL amortisman (770 hesabında) yer almaktadır.

    3. 31.12.2026 itibarıyla mevcut bir mükellefiyete dayanan dava için 400.000 TL karşılık ayrılmıştır. Dava 15 Şubat 2027''de
    550.000 TL ödeme yükümlülüğüyle kesinleşmiştir.

    4. 5 Mart 2027''de depoda çıkan yangında 250.000 TL tutarında stok yanmıştır (sigortasızdır).


    **İstenenler**


    (a) 1 numaralı hatanın TMS 8''e göre düzeltilmesini açıklayınız; 2026 kayıtlarını yapınız. (8 puan)


    (b) 2 numaralı değişikliğin niteliğini belirtiniz; 2026 amortismanını hesaplayıp gerekli düzeltme kaydını yapınız. (6
    puan)


    (c) 3 ve 4 numaralı olayları TMS 10''a göre değerlendiriniz; gerekli kaydı yapınız. (5 puan)


    (d) Düzeltilmiş 2026 dönem kârını hesaplayınız. (6 puan)

    '
  cozum: '**(a)** Demirbaşın gider yazılması önemli bir geçmiş dönem hatasıdır. TMS 8 par. 42''ye göre geriye dönük düzeltilir:
    karşılaştırmalı 2025 tutarları yeniden düzenlenir; hatanın birikmiş etkisi 2026 açılış özkaynağına (geçmiş yıllar kârlarına)
    yansıtılır, 2026 kâr veya zararından geçirilmez.


    - 2025 amortismanı = 600.000 / 5 = 120.000 TL

    - 2025 kârına etkisi = 600.000 − 120.000 = 480.000 TL eksik kâr


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 255 Demirbaşlar | 600.000 | |

    | 257 Birikmiş Amortismanlar | | 120.000 |

    | 570 Geçmiş Yıllar Kârları | | 480.000 |


    2026 amortismanı:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 120.000 | |

    | 257 Birikmiş Amortismanlar | | 120.000 |


    **(b)** Yararlı ömür ve kalıntı değerin revizyonu muhasebe tahmini değişikliğidir; ileriye yönelik uygulanır (TMS 8 par.
    36), geçmiş yıllar düzeltilmez.


    - Birikmiş amortisman (2023-2025) = 3 × 180.000 = 540.000 TL; 2026 başı defter değeri = 1.260.000 TL

    - 2026 amortismanı = (1.260.000 − 60.000) / 4 = 300.000 TL

    - Taslakta 180.000 TL var; ek amortisman = 120.000 TL


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 120.000 | |

    | 257 Birikmiş Amortismanlar | | 120.000 |


    **(c)** 3 numaralı dava dönem sonunda var olan mükellefiyeti teyit eder ve onay tarihinden önce sonuçlanmıştır; düzeltme
    gerektiren olaydır (TMS 10 par. 9(a)). Karşılık 550.000 TL''ye çıkarılır: ek 150.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri | 150.000 | |

    | 379 Diğer Borç ve Gider Karşılıkları | | 150.000 |


    4 numaralı yangın dönem sonrasında ortaya çıkan bir durumdur; düzeltme gerektirmeyen olaydır (TMS 10 par. 10). Kayıt yapılmaz;
    önemli olduğundan niteliği ve tahmini etkisi (250.000 TL) dipnotta açıklanır (TMS 10 par. 21).


    **(d)** Düzeltilmiş 2026 dönem kârı:


    | Kalem | TL |

    |---|---|

    | Taslak kâr | 3.000.000 |

    | Demirbaş amortismanı (a) | (120.000) |

    | Jeneratör ek amortismanı (b) | (120.000) |

    | Dava karşılığı artışı (c) | (150.000) |

    | Düzeltilmiş 2026 kârı | **2.610.000** |


    480.000 TL''lik geçmiş yıl hatası 2026 kârını etkilemez; 570 hesabında açılış özkaynağına alınır. Yangın zararı 2027 dönemine
    aittir.

    '
  puanlama:
  - olcut: Demirbaş gideri hatasının geriye dönük düzeltileceğini ve 2026 kâr veya zararından geçirilmeyeceğini belirtme
    puan: 2
  - olcut: 255 / 257 / 570 düzeltme kaydı (600.000; 120.000; 480.000)
    puan: 4
  - olcut: 2026 demirbaş amortismanı kaydı (770 / 257, 120.000)
    puan: 2
  - olcut: Değişikliğin tahmin değişikliği olduğunu ve ileriye yönelik uygulanacağını belirtme
    puan: 2
  - olcut: 2026 jeneratör amortismanını 300.000 TL bulma
    puan: 2
  - olcut: Ek amortisman kaydı (770 / 257, 120.000)
    puan: 2
  - olcut: Davanın düzeltme gerektiren olay olduğunu belirtip 654 / 379 kaydını 150.000 TL ile yapma
    puan: 3
  - olcut: Yangının düzeltme gerektirmeyen olay olduğunu ve dipnotta açıklanacağını belirtme
    puan: 2
  - olcut: Düzeltilmiş 2026 kârını 2.610.000 TL bulma ve geçmiş yıl hatasını kâra katmama
    puan: 6
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerindeki Değişiklikler ve Hatalar
    madde: par. 36, 42
  - mevzuat: TMS 10 Raporlama Döneminden Sonraki Olaylar
    madde: par. 9, 10, 21
  - mevzuat: Tekdüzen Hesap Planı
    madde: 255, 257, 379, 570, 654, 770
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
  dogrulama:
    python: 'a_amort = 600000 / 5

      gecmis = 600000 - a_amort

      dd = 1800000 - 3 * 180000

      b_amort = (dd - 60000) / 4

      b_ek = b_amort - 180000

      c_ek = 550000 - 400000

      kar = 3000000 - a_amort - b_ek - c_ek

      sonuc = {''gecmis_yillar_duzeltme'': gecmis, ''jenerator_amortismani'': b_amort, ''dava_ek_karsilik'': c_ek, ''duzeltilmis_kar'':
      kar}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 4, seviye 2
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, klasik 1
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-KCV-K002
  sinav: ymm
  ders: IFM
  konu: KCV
  kazanimlar:
  - TMS 1 ve TFRS 18 finansal tabloların sunuluşu
  - finansal raporlamanın amacı ve yararlı finansal bilginin niteliksel özellikleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Omega Gıda AŞ**'nin 31.12.2026 tarihli finansal tabloları 25.2.2027'de yayımlanmak üzere onaylanacaktır. Yönetim\n\
    yükümlülüklerin tamamını uzun vadeli göstermeyi önermektedir. Yükümlülüklere ilişkin bilgiler:\n\n1. Vadesi 2029 olan\
    \ 10.000.000 TL banka kredisinde 30.11.2026'da sözleşmedeki finansal oran şartı ihlal edilmiş,\n   kredi talep hâlinde\
    \ ödenecek duruma gelmiştir. Banka 15.1.2027'de ödeme talep etmeyeceğini yazılı olarak bildirmiştir.\n2. Vadesi 30.6.2027\
    \ olan 6.000.000 TL kredide işletmenin, mevcut kredi sözleşmesi kapsamında raporlama dönemi sonu\n   itibarıyla vadeyi\
    \ koşulsuz olarak 24 ay uzatma hakkı vardır ve bu hakkı kullanmayı düşünmektedir.\n3. Vadesi 2030 olan 5.000.000 TL kredide\
    \ 31.10.2026'da şart ihlali olmuş; banka 20.12.2026'da işletmeye ihlali\n   düzeltmesi için 31.3.2028'e kadar süre tanımış\
    \ ve bu süre içinde ödeme talep edemeyeceğini kabul etmiştir.\n4. 8.000.000 TL ticari borç işletmenin 18 aylık normal\
    \ faaliyet döngüsü içinde ödenecektir; bunun 3.000.000 TL'si\n   raporlama tarihinden 12 aydan sonra ödenecektir.\n5.\
    \ Vadesi 2030 olan 4.000.000 TL tahvilde borç/özkaynak oranı şartı, 31.12.2026 verileri üzerinden 31.3.2027'de\n   kontrol\
    \ edilecektir; işletme 31.12.2026 itibarıyla şartı sağlamaktadır.\n6. Ertelenmiş vergi yükümlülüğü 1.200.000 TL'dir.\n\
    7. Vadesi 28.2.2027 olan 2.000.000 TL kredi için 20.1.2027'de 3 yıl vadeli yeniden finansman sözleşmesi\n   imzalanmıştır.\n\
    \nDönen varlıklar toplamı 24.000.000 TL'dir.\n\n**İstenenler:**\n\n(a) Yükümlülükleri TMS 1'e göre kısa/uzun vadeli olarak\
    \ sınıflandırınız ve gerekçelerini belirtiniz. (11 puan)\n\n(b) Kısa ve uzun vadeli yükümlülük toplamlarını ve cari oranı\
    \ hesaplayınız; yönetimin önerisiyle karşılaştırınız.\n(4 puan)\n\n(c) Yararlı finansal bilginin temel ve destekleyici\
    \ niteliksel özelliklerini sayarak yanlış sınıflandırmanın hangi\nözelliği bozacağını açıklayınız. (5 puan)\n\n(d) 1.1.2027'den\
    \ itibaren uygulanacak TFRS 18'in kâr veya zarar tablosunun sunumunda getirdiği temel değişiklikleri\naçıklayınız. (5\
    \ puan)\n"
  cozum: "**(a) Sınıflandırma**\n\n| No | Tutar (TL) | Sınıf | Gerekçe |\n|---|---|---|---|\n| 1 | 10.000.000 | Kısa | İhlal\
    \ dönem sonundan önce; bankanın feragati raporlama döneminden sonra (TMS 1.74) |\n| 2 | 6.000.000 | Uzun | Dönem sonunda\
    \ mevcut sözleşmeye dayalı en az 12 ay erteleme hakkı (TMS 1.73) |\n| 3 | 5.000.000 | Uzun | Süre dönem sonundan önce\
    \ tanınmış ve 12 aydan uzun (TMS 1.75) |\n| 4 | 8.000.000 | Kısa | Normal faaliyet döngüsünde ödenecek işletme sermayesi\
    \ kalemi; 12 ay sonrası kısım da kısa (TMS 1.70) |\n| 5 | 4.000.000 | Uzun | Şart dönem sonunda sağlanıyor; sonradan kontrol\
    \ edilmesi hakkı etkilemez (TMS 1.72A) |\n| 6 | 1.200.000 | Uzun | Ertelenmiş vergi kısa vadeli gösterilemez (TMS 1.56)\
    \ |\n| 7 | 2.000.000 | Kısa | Yeniden finansman raporlama döneminden sonra (TMS 1.72-b) |\n\nSınıflandırma, yönetimin\
    \ hakkı kullanma niyetinden etkilenmez (TMS 1.75A). 1 ve 7 numaralı kalemlerde dönem sonrası\ngelişmeler, düzeltme gerektirmeyen\
    \ olay olarak dipnotta açıklanır (TMS 1.76, TMS 10).\n\n**(b) Toplamlar ve cari oran**\n\n- Kısa vadeli yükümlülükler\
    \ = 10.000.000 + 8.000.000 + 2.000.000 = **20.000.000 TL**.\n- Uzun vadeli yükümlülükler = 6.000.000 + 5.000.000 + 4.000.000\
    \ + 1.200.000 = **16.200.000 TL**.\n- Cari oran = 24.000.000 / 20.000.000 = **1,20**. Yönetimin önerisinde kısa vadeli\
    \ yükümlülük olmayacağından oran\n  hesaplanamaz hâle gelir ve likidite olduğundan çok güçlü görünür; ticari borçlar ayrıca\
    \ kısa vadeli gösterilse bile\n  oran 24.000.000 / 8.000.000 = 3,00 olurdu.\n\n**(c) Niteliksel özellikler (Kavramsal\
    \ Çerçeve)**\n\n- **Temel:** ihtiyaca uygunluk (önemlilik dahil) ve gerçeğe uygun sunum (eksiksiz, tarafsız, hatasız).\n\
    - **Destekleyici:** karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum ve anlaşılabilirlik.\n\nTalep hâlinde ödenecek\
    \ kredinin uzun vadeli gösterilmesi likidite riskini gizler; bilgi **tarafsız ve hatasız**\nolmadığından **gerçeğe uygun\
    \ sunum** bozulur, kullanıcıların kararlarını etkileyeceği için de önemlidir.\n\n**(d) TFRS 18 (1.1.2027'den itibaren;\
    \ TMS 1'in yerini alır)**\n\n- Gelir ve giderler **işletme, yatırım, finansman, gelir vergileri ve durdurulan faaliyetler**\
    \ kategorilerinde\n  sınıflandırılır.\n- Zorunlu ara toplamlar: **faaliyet kârı veya zararı** ile **finansman ve gelir\
    \ vergileri öncesi kâr veya zarar**.\n- **Yönetim tarafından tanımlanan performans ölçütleri** tek dipnotta açıklanır\
    \ ve en yakın TFRS ara toplamıyla\n  mutabakatı verilir.\n- Bilgilerin toplulaştırılması ve ayrıştırılması için güçlendirilmiş\
    \ ilkeler getirilir; karşılaştırmalı bilgiler\n  yeniden düzenlenerek sunulur.\n"
  puanlama:
  - olcut: '(a) 1 numaralı kredi: kısa (TMS 1.74)'
    puan: 2
  - olcut: '(a) 2 ve 3 numaralı krediler: uzun (TMS 1.73, 1.75)'
    puan: 3
  - olcut: '(a) 4 numaralı ticari borç: kısa (TMS 1.70)'
    puan: 2
  - olcut: '(a) 5 ve 6: uzun (TMS 1.72A, 1.56)'
    puan: 2
  - olcut: '(a) 7: kısa (TMS 1.72)'
    puan: 2
  - olcut: (b) 20.000.000 / 16.200.000 TL ve cari oran 1,20
    puan: 4
  - olcut: (c) Temel ve destekleyici özellikler
    puan: 3
  - olcut: (c) Gerçeğe uygun sunumun bozulması
    puan: 2
  - olcut: (d) TFRS 18 kategorileri, ara toplamlar ve YTPÖ
    puan: 5
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 56, 69, 70, 72, 72A, 73, 74, 75, 75A, 76
    alinti: Mevcut bir kredi sözleşmesi kapsamında, raporlama dönemi sonu itibarıyla, ödemeleri raporlama
  - mevzuat: Finansal Raporlama Kavramsal Çerçevesi
    madde: Bölüm 2
  - mevzuat: TFRS 18 Finansal Tablolarda Sunum ve Açıklamalar
    madde: Genel
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'kisa = 10000000 + 8000000 + 2000000

      uzun = 6000000 + 5000000 + 4000000 + 1200000

      sonuc = {"kisa": kisa, "uzun": uzun, "cari": round(24000000 / kisa, 2), "yon": round(24000000 / 8000000, 2)}

      '
