    3. Stok: Stok Değer Düşüklüğü Gideri (B) 100.000 / Stok Değer Düşüklüğü Karşılığı (A) 100.000 — NGD 350.000 < maliyet
    450.000.


    Toplam kâr azalışı = 120.000 + 240.000 + 100.000 = **460.000 TL**; düzeltilmiş net dönem kârı = 2.000.000 − 460.000 =
    **1.540.000 TL**.


    **(c) Düzeltme gerektirmeyen olaylar**


    - Finansal tablolara alınmış tutarlarda düzeltme yapılmaz (par. 10). Olay önemliyse olayın niteliği ile tahmini finansal
