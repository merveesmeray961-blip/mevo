    - Temettü 28.2.2027''de, yani raporlama döneminden sonra ilan edildiğinden 31.12.2026 bilançosunda yükümlülük yazılmaz;
    çünkü dönem sonu itibarıyla işletmenin bu konuda bir yükümlülüğü yoktur (par. 12-13). Gerekirse dipnotta açıklanır.

