  soru: 'Anadolu Boya AŞ, 31.12.2026 tarihli finansal tablolarını 2025 yılı karşılaştırmalı olacak şekilde hazırlarken (vergi
    etkileri dikkate alınmayacaktır) aşağıdaki iki hatayı tespit etmiştir:


    1. 1.1.2025''te 250.000 TL''ye satın alınan ve aynı gün kullanıma hazır hâle gelen makine, 2025''te tümüyle gider yazılmıştır.
    Makinenin faydalı ömrü 5 yıl, kalıntı değeri sıfırdır ve doğrusal amortisman uygulanacaktır.

    2. 31.12.2024 yıl sonu sayımında 100.000 TL tutarındaki stok sayıma dâhil edilmemiştir; 2025 sayımı doğrudur.


    Raporlanmış bilgiler: 2025 net dönem kârı 1.500.000 TL; 1.1.2025 (31.12.2024) dağıtılmamış kârlar 2.500.000 TL; 31.12.2025
    dağıtılmamış kârlar 4.000.000 TL (2025''te kâr dağıtımı yapılmamıştır).


    **İstenenler**


    (a) Hataların TMS 8''e göre nasıl düzeltileceğini belirtiniz; 2025 düzeltilmiş net kârı, 1.1.2025 düzeltilmiş açılış dağıtılmamış
    kârları ve 31.12.2025 düzeltilmiş dağıtılmamış kârları hesaplayınız. (9 puan)


    (b) 31.12.2025 finansal durum tablosunda makine kalemine ve stoklara ilişkin düzeltme tutarlarını gösteriniz. (4 puan)


    (c) İşletmenin hangi tarihlerde finansal durum tablosu sunması gerektiğini TMS 1''e göre açıklayınız; ayrıca hatanın 2026
    yılı kârına etkisinin ne olacağını ve TMS 8''e göre yapılacak açıklamaları belirtiniz. (7 puan)

    '
  cozum: '**(a) Düzeltme yöntemi ve hesaplar**


    Önemli geçmiş dönem hataları, tespit edildikten sonra yayımlanması onaylanan ilk finansal tablolarda **geriye dönük yeniden
    düzenleme** ile düzeltilir (TMS 8 par. 42). Hata sunulan en erken dönemden önce meydana gelmişse (stok hatası 2024''te)
    açılış bakiyeleri yeniden düzenlenir; hatanın tespit edildiği dönemin (2026) kâr veya zararında değişiklik yapılmaz (par.
    46).


    | Kalem | Tutar | Etki |

    |---|---|---|

    | Makine: amortisman (250.000/5) | 50.000 | 2025 kâr: +200.000 (gider 250.000 iptal, amortisman 50.000) |

    | Stok: 2024 kârı az çıkmış, 2025 kârı fazla çıkmıştır | −100.000 | 2025 kâr: −100.000 |


    - 2025 düzeltilmiş net kâr = 1.500.000 + 200.000 − 100.000 = **1.600.000 TL**

    - 1.1.2025 düzeltilmiş açılış dağıtılmamış kârlar = 2.500.000 + 100.000 = **2.600.000 TL**

    - 31.12.2025 düzeltilmiş dağıtılmamış kârlar = 2.600.000 + 1.600.000 = **4.200.000 TL** (raporlananın 200.000 TL üzerinde)


    **(b) 31.12.2025 finansal durum tablosu**


    - Makine: maliyet 250.000 − birikmiş amortisman 50.000 = **200.000 TL** olarak eklenir.

    - Stoklar: 31.12.2025 sayımı doğru olduğundan 31.12.2025''te düzeltme yoktur; stok düzeltmesi yalnızca 1.1.2025 açılış
    bakiyesinde (+100.000 TL stok ve dağıtılmamış kârlar) ve 2025 kâr tablosunda (SMM) yer alır.


    **(c) Sunum ve açıklama**


    - İşletme geriye dönük düzeltme yaptığı ve bu düzeltmenin önceki dönem başındaki finansal durum tablosunda önemli etkisi
    bulunduğu için cari dönem sonu (31.12.2026), önceki dönem sonu (31.12.2025) ve önceki dönem başı (1.1.2025) olmak üzere
    **üç finansal durum tablosu** sunar (TMS 1 par. 40A-40B). Açılış tablosuyla ilgili dipnotlar sunulmaz (par. 40C).

    - Hata düzeltmesi 2026 kâr veya zararını **değiştirmez** (TMS 8 par. 46); yalnızca makinenin 2026 amortismanı (50.000
    TL) normal şekilde 2026 gideridir.

    - Açıklanacaklar: hatanın niteliği; sunulan her dönem için düzeltilen kalemler ve (uygulanıyorsa) hisse başına kazanç
    etkisi; sunulan en erken dönem başındaki düzeltme tutarı (par. 49).

    '
