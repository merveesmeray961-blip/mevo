  - finansal tablo unsurlarının tanımı ve muhasebeleştirilmesi
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: 'Doğa Lojistik AŞ, 2026 yılı hazırlıkları sırasında 31.12.2025''e kadar kullanılmamış yıllık ücretli izin haklarına
    ilişkin hiçbir yükümlülük kaydetmediğini fark etmiştir. 31.12.2025 itibarıyla personelin kullanılmamış toplam izin süresi
    150 gün, günlük brüt ücret 1.200 TL''dir; işletme, hizmet sözleşmeleri gereği bu hakların ödeneceğini bilmektedir. Önceki
    yıllara ait personel devam kayıtları arızalı arşiv sistemi nedeniyle kaybolmuştur; bu nedenle yükümlülüğün 31.12.2024
    ve 2025 yılı içindeki dağılımı güvenilir şekilde belirlenememekte, yalnızca 31.12.2025 itibarıyla bakiyenin (180.000 TL)
    güvenilir şekilde hesaplanabildiği anlaşılmaktadır. 31.12.2026''da kullanılmamış izin süresi 160 gün, günlük brüt ücret
    1.500 TL''dir; 2026''da izin ücreti ödemesi yapılmamıştır. 1.1.2026 itibarıyla raporlanan dağıtılmamış kârlar 3.000.000
    TL''dir (vergi etkileri dikkate alınmayacaktır).


    **İstenenler**


    (a) İzin yükümlülüğünün kaydedilmemesinin TMS 8 bakımından niteliğini belirtiniz; 2025 karşılaştırmalı bilgilerinin neden
    yeniden düzenlenemediğini ve düzeltmenin hangi tarihten itibaren yapılacağını açıklayınız. (8 puan)


    (b) Düzeltme kaydını (1.1.2026 açılış bakiyesi üzerinden) yapınız ve 1.1.2026 düzeltilmiş dağıtılmamış kârları bulunuz.
    (6 puan)


    (c) 2026 yılı kâr veya zararına yansıyacak izin gideri ile 31.12.2026 izin yükümlülüğünü hesaplayınız; bu durumda yapılması
    gereken açıklamayı belirtiniz. (6 puan)

    '
  cozum: '**(a) Niteliği ve yöntem**


    Finansal tablolarda yükümlülüğün hiç kaydedilmemesi, finansal tablo unsurlarının finansal tablolara alınması ile ilgili
    bir **geçmiş dönem hatasıdır** (TMS 8 par. 41); muhasebe tahmini değişikliği değildir (par. 48). Kural geriye dönük yeniden
    düzenlemedir (par. 42-43). Ancak hatanın sunulan geçmiş döneme (2025) ait **dönemler itibarıyla etkisi belirlenemediği**
    için 2025 karşılaştırmalı tutarları yeniden düzenlenemez; bu durumda varlık, yükümlülük ve özkaynakların geriye dönük
    yeniden düzenlemenin mümkün olduğu en erken döneme ait açılış bakiyeleri (burada 1.1.2026) yeniden düzenlenir (par. 44).
    Böylece 31.12.2025 bakiyesi 1.1.2026 açılışında düzeltilir; 2026 kâr veya zararı değişmez (par. 46).


    **(b) Düzeltme kaydı (1.1.2026 açılış)**


    - Birikimli ücretli izinlerin beklenen maliyeti, birikmiş kullanılmayan haklar dolayısıyla ödenmesi beklenen tutardır
    (TMS 19 par. 16). Yükümlülük = 150 gün × 1.200 TL = **180.000 TL**

    - Geçmiş Yıllar Kârları (Dağıtılmamış Kârlar) (B) 180.000 / Kullanılmayan İzin Yükümlülüğü (Karşılığı) (A) 180.000

    - 1.1.2026 düzeltilmiş dağıtılmamış kârlar = 3.000.000 − 180.000 = **2.820.000 TL**


    **(c) 2026 etkisi**


    - 31.12.2026 yükümlülük = 160 × 1.500 = **240.000 TL**

    - 2026 izin gideri = 240.000 − 180.000 = **60.000 TL** (2026 kâr veya zararına yansır)

    - Açıklama (par. 49): hatanın niteliği; sunulan her dönem için mümkün olduğu ölçüde düzeltme tutarları; sunulan en erken
    dönemin başındaki düzeltme tutarı ve geriye dönük yeniden düzenleme belirli bir geçmiş dönem için mümkün olmadığından
    bu duruma yol açan koşullar ile hatanın hangi tarihten itibaren ve ne şekilde düzeltildiği.

    '
