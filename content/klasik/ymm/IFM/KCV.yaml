    Kavramsal Çerçeve''ye göre gerekçelendiriniz. (5 puan)


    (c) Tarihi maliyet ile cari değer esaslarının sağladığı bilgi arasındaki temel farkı (değer değişimlerinin yansıtılması
    bakımından) açıklayınız. (3 puan)

    '
  cozum: '**(a) Ölçüm esasları**


    | Esas | Hesap | TL |

    |---|---|---|

    | Tarihi maliyet (itfa edilmiş) | Maliyet = 900.000 + 100.000 = 1.000.000; 4/5 kalan | **800.000** |

    | Gerçeğe uygun değer | Çıkış fiyatı; satış komisyonu (işlem maliyeti) yansıtılmaz | **780.000** |

    | Kullanım değeri | 250.000 × 3,1699 | **792.475** |

    | Cari maliyet | (Yeni fiyat 1.050.000 + montaj/nakliye 110.000) × 4/5 (yaşa göre uyarlama) | **928.000** |


    - Tarihi maliyet varlığın edinilmesi sırasında katlanılan maliyetleri, yani ödenen bedel artı işlem maliyetlerini içerir
    (KÇ 6.5).

    - Gerçeğe uygun değer, varlığın elden çıkarılması sırasında katlanılacak işlem maliyetlerini yansıtmaz; bu nedenle 30.000
    TL komisyon düşülmez (KÇ 6.13).

    - Kullanım değeri gelecekteki nakit akışlarının bugünkü değeridir ve işletmeye özgü varsayımları yansıtır (KÇ 6.17, 6.19).

    - Kullanılmış varlığın cari maliyeti, yeni varlığın cari fiyatının mevcut yaş ve duruma göre uyarlanmasıyla tahmin edilebilir
    (KÇ 6.21-6.22).


    **(b) Varlık ve yükümlülük tanımı**


    - Konsinye mallar: Vekil durumundaki işletme, asil tarafından kontrol edilen ekonomik kaynağın himayesine sahipse bu kaynak
    vekilin varlığı değildir (KÇ 4.25). Mallar ihracatçının kontrolündedir; işletmenin varlığı değildir ve bilançoya alınmaz.

    - Ücretsiz bakım: Mükellefiyetler işletmenin teamüle dayalı uygulamalarından, yayımlanmış politikalarından veya beyanlarından
    da doğabilir (KÇ 4.31). İşletme duyurduğu politikadan kaçınamayacağından geçmiş olayın (satış) sonucu doğan, ekonomik
    kaynak devretme yönünde mevcut bir mükellefiyet vardır; yükümlülük tanımı karşılanır (KÇ 4.26-4.27).


