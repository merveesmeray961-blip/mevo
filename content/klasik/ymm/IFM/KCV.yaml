  - TMS 8 muhasebe politikaları tahmin değişiklikleri ve hatalar
  - TMS 1 ve TFRS 18 finansal tabloların sunuluşu
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: 'Selçuk Gıda AŞ, 31.12.2026 tarihli finansal tablolarını 2025 yılını karşılaştırmalı dönem olarak sunarak hazırlamaktadır
    (vergi etkileri dikkate alınmayacaktır). Yönetim 2026 yılında aşağıdaki iki değişikliği yapmıştır.


    **1. Yatırım amaçlı gayrimenkul (arsa)**


    - İşletme, 1.1.2024''te 5.000.000 TL bedelle satın aldığı ve kira geliri elde etmek için tuttuğu arsayı bugüne kadar maliyet
    yöntemiyle izlemiştir.

    - Yönetim, finansal tabloların performansı daha ihtiyaca uygun yansıtacağı gerekçesiyle 2026''da gerçeğe uygun değer yöntemine
    geçmiştir. Güvenilir bağımsız değerleme raporlarına göre arsanın gerçeğe uygun değeri 31.12.2024''te 5.600.000 TL, 31.12.2025''te
    6.200.000 TL''dir.


    **2. Makine**


    - 1.1.2023''te 1.200.000 TL''ye alınan makinenin faydalı ömrü 10 yıl, kalıntı değeri sıfırdır; doğrusal amortisman uygulanmaktadır.

    - 1.1.2026''da yapılan değerlendirmede makinenin toplam faydalı ömrünün 11 yıla uzayacağı (kalan faydalı ömrün 8 yıl olacağı)
    anlaşılmıştır. Kalıntı değer değişmemiştir.


    **İstenenler**


    (a) Her iki değişikliğin TMS 8 bakımından niteliğini ve uygulama yöntemini (geriye dönük / ileriye yönelik) gerekçesiyle
    açıklayınız. (7 puan)


    (b) Arsa için sunulan en erken dönemin açılış bakiyesinde (1.1.2025) yapılacak düzeltmeyi, 2025 yılı kâr veya zararına
    etkiyi ve 31.12.2025 itibarıyla arsanın defter değerini ve dağıtılmamış kârlar üzerindeki birikimli etkiyi bulunuz. (7
    puan)


    (c) Makine için 2026 amortisman giderini ve 31.12.2026 net defter değerini hesaplayınız; amortisman farkı nedeniyle önceki
    dönemlere ilişkin düzeltme yapılıp yapılmayacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Niteliği**


    - Arsada ölçüm yöntemi değişmektedir (maliyet yöntemi → gerçeğe uygun değer yöntemi). Uygulanan ölçüm esasında yapılan
    değişiklik muhasebe tahmini değil, **muhasebe politikası değişikliğidir** (TMS 8 par. 35). TMS 40 par. 31, ihtiyari değişikliğe
    yalnızca daha ihtiyaca uygun ve güvenilir bilgi sağlaması hâlinde izin verir; bu koşul sağlandığından değişiklik yapılabilir.
    Özel geçiş hükmü bulunmayan ihtiyari politika değişikliği **geriye dönük** uygulanır (TMS 8 par. 19(b)); sunulan en erken
    dönemin (1.1.2025) açılış özkaynakları ve karşılaştırmalı tutarlar yeni politika baştan beri uygulanıyormuş gibi düzeltilir
    (par. 22).

    - Makinede faydalı ömür tahmini değişmektedir. Faydalı ömre ilişkin değişiklik **muhasebe tahmini değişikliğidir**; etkisi
    **ileriye yönelik** olarak değişikliğin yapıldığı dönem ve sonrasının kâr veya zararına yansıtılır (par. 36 ve 38). Geçmiş
    dönemler düzeltilmez.


    **(b) Arsa (geriye dönük)**


    | Kalem | Hesap | TL |

    |---|---|---|

    | 1.1.2025 açılış (31.12.2024) düzeltmesi: GUD − maliyet | 5.600.000 − 5.000.000 | 600.000 |

    | 2025 kâr veya zarara etki (GUD artışı, TMS 40 par. 35) | 6.200.000 − 5.600.000 | 600.000 |

    | 31.12.2025 arsa defter değeri | GUD | 6.200.000 |

    | 31.12.2025 dağıtılmamış kârlara birikimli etki | 600.000 + 600.000 | 1.200.000 |


    Karşılaştırmalı 2025 tablolarında arsa 6.200.000 TL''ye, açılış dağıtılmamış kârlar 600.000 TL artırılarak sunulur; 2025
    kârı 600.000 TL yüksek gösterilir.


    **(c) Makine (ileriye yönelik)**


    - 31.12.2025 birikmiş amortisman = 120.000 × 3 = 360.000; net defter değeri = 840.000 TL.

    - Yeni 2026 amortismanı = 840.000 / 8 = **105.000 TL** (eski ömürle 120.000 TL olacaktı). 31.12.2026 net defter değeri
    = 840.000 − 105.000 = **735.000 TL**.

    - Önceki dönemlerde hata yapılmadığı için 2023-2025 amortisman giderleri **düzeltilmez**; fark yalnızca 2026 ve sonraki
    dönemlerin giderine yansır.

    '
