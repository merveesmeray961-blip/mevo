    aşağıdaki gelişmeler yaşanmıştır:


    | No | Tarih | Gelişme |

    |---|---|---|

    | 1 | 4.2.2027 | Bir müşterinin 2026''daki ayıplı mal teslimi nedeniyle açtığı dava kesinleşmiş, işletme 520.000 TL ödemeye
    mahkûm edilmiştir. 31.12.2026''da bu dava için 400.000 TL karşılık ayrılmıştır. |

    | 2 | 18.1.2027 | 2026''daki mali sıkıntıları bilinen Kuzey Ltd. iflas etmiştir. İşletmenin bu müşteriden 300.000 TL alacağı
    vardır; 31.12.2026''da 60.000 TL değer düşüklüğü karşılığı ayrılmış olup alacağın tamamının tahsil edilemeyeceği anlaşılmıştır.
    |

    | 3 | 12.2.2027 | 31.12.2026''da maliyet bedeliyle 450.000 TL taşınan bir stok grubu, bu tarihte 350.000 TL net satış
    bedeliyle (satış giderleri düşülmüş) elden çıkarılmıştır. Stoklar için başka değer düşüklüğü karşılığı ayrılmamıştır.
    |

    | 4 | 22.2.2027 | Depoda çıkan yangında 800.000 TL tutarında stok yok olmuştur; yangın bu tarihte başlamıştır. |

    | 5 | 28.2.2027 | Yönetim kurulu, 2026 kârından 600.000 TL temettü dağıtılmasını kararlaştırmış ve bunu pay sahiplerine
    ilan etmiştir. |

    | 6 | 20.3.2027 | İşletme Euro cinsinden borcunu ödemiş, kur artışı nedeniyle önemli tutarda kur farkı gideri doğmuştur.
    |


    **İstenenler**


    (a) Her bir gelişmeyi "düzeltme gerektiren olay", "düzeltme gerektirmeyen olay" ya da "raporlama döneminden sonraki olay
    değil" olarak sınıflandırınız ve gerekçesini TMS 10''a dayandırarak yazınız. (8 puan)


    (b) Düzeltme gerektiren olaylara ilişkin 2026 yevmiye kayıtlarını yapınız (hesap adlarını açıkça yazınız); düzeltilmiş
    net dönem kârını bulunuz. (8 puan)


    (c) Düzeltme gerektirmeyen olaylar için finansal tablolarda yapılacak işlemi ve açıklanacak bilgileri belirtiniz; 5 numaralı
    temettü için 31.12.2026 bilançosunda yükümlülük yazılıp yazılmayacağını gerekçelendiriniz. (4 puan)

    '
  cozum: '**(a) Sınıflandırma**


    | No | Sınıf | Gerekçe |

    |---|---|---|

    | 1 | Düzeltme gerektiren | Dava, raporlama dönemi sonundaki mevcut yükümlülüğü teyit etmektedir (TMS 10 par. 9(a)); karşılık
    düzeltilir |

    | 2 | Düzeltme gerektiren | Müşterinin iflası, alacağın raporlama dönemi sonunda değer düşüklüğüne uğradığını gösterir
    (par. 9(b)(i)) |

    | 3 | Düzeltme gerektiren | Raporlama döneminden sonraki stok satışı, stokun raporlama dönemi sonundaki net gerçekleşebilir
    değerine kanıt sağlar (par. 9(b)(ii)) |

    | 4 | Düzeltme gerektirmeyen | Yangın raporlama döneminden sonra ortaya çıkan bir durumdur (par. 3(b), par. 10) |

    | 5 | Düzeltme gerektirmeyen (yükümlülük yok) | Raporlama döneminden sonra ilan edilen temettü, dönem sonunda yükümlülük
    olarak tablolara alınmaz (par. 12) |

    | 6 | Raporlama döneminden sonraki olay değildir | Olay 9.3.2027 onay tarihinden sonra gerçekleşmiştir; TMS 10 yalnızca
    onay tarihine kadarki olayları kapsar (par. 7) |


    **(b) Düzeltme kayıtları (31.12.2026)**


    1. Dava: Dava Karşılık Gideri (B) 120.000 / Dava Karşılıkları (A) 120.000 — ek karşılık = 520.000 − 400.000.

    2. Alacak: Değer Düşüklüğü (Karşılık) Gideri (B) 240.000 / Şüpheli Alacaklar Değer Düşüklüğü Karşılığı (A) 240.000 — ek
