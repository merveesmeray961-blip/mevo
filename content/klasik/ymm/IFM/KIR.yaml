- id: YMM-IFM-KIR-K002
  sinav: ymm
  ders: IFM
  konu: KIR
  kazanimlar:
  - TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Lima Perakende AŞ** 1.1.2026'da bir AVM'de mağaza kiralamıştır. Sözleşme bilgileri:\n\n- Kiralama süresi 3 yıl;\
    \ yıllık kira **her yıl sonunda** ödenecektir. 2026 kirası 1.000.000 TL'dir; 2027 ve 2028\n  kiraları, bir önceki yılın\
    \ TÜFE değişimi oranında artırılacaktır.\n- Kiracının alternatif borçlanma faiz oranı yıllık %30'dur. İskonto çarpanları:\
    \ 1 yıl 0,769231; 2 yıl 0,591716;\n  3 yıl 0,455166.\n- Sözleşmenin imzalanması için emlak danışmanına 50.000 TL ödenmiş\
    \ (başlangıçtaki doğrudan maliyet), kiraya veren de\n  mağazayı açması için kiracıya 20.000 TL kiralama teşviki ödemiştir.\n\
    - Kullanım hakkı varlığı doğrusal yöntemle kira süresince amortismana tabi tutulacaktır.\n- VUK kayıtlarında 2026 kirası\
    \ ve danışmanlık ücreti gider, kiralama teşviki gelir yazılmıştır.\n- 2026 yılı TÜFE artışı %40 olarak açıklanmış; 2027\
    \ ve 2028 kiraları 1.1.2027'de 1.400.000 TL'ye yükseltilmiştir.\n- Kurumlar vergisi oranı %25'tir.\n\n**İstenenler:**\n\
    \n(a) Kira yükümlülüğünü ve kullanım hakkı varlığını hesaplayarak ilk kayıt kaydını yapınız. (6 puan)\n\n(b) 2026 yılı\
    \ faiz, ödeme ve amortisman kayıtlarını yapınız; 31.12.2026 kira yükümlülüğünü kısa ve uzun vadeli\nkısımlarına ayırınız.\
    \ (7 puan)\n\n(c) 1.1.2027'deki endeks değişikliğinin muhasebeleştirilmesini hesaplayarak kaydediniz; iskonto oranının\
    \ değişip\ndeğişmeyeceğini açıklayınız. (6 puan)\n\n(d) 2026 yılında TFRS ile VUK gider farkını bulunuz; 31.12.2026 itibarıyla\
    \ ertelenmiş vergi varlığı ve\nyükümlülüğünü hesaplayarak ilk muhasebeleştirme istisnasının neden uygulanmadığını açıklayınız.\
    \ (6 puan)\n"
  cozum: "**(a) İlk ölçüm**\n\nKira yükümlülüğü, ödenmemiş kira ödemelerinin bugünkü değeridir (TFRS 16.26). Endekse bağlı\
    \ ödemeler başlangıçtaki\nendeks düzeyiyle ölçülür (TFRS 16.27-b); gelecekteki TÜFE artışları tahmin edilerek ölçüme katılmaz.\n\
    \n- Kira yükümlülüğü = 1.000.000 × (0,769231 + 0,591716 + 0,455166) = 1.000.000 × 1,816113 = **1.816.113 TL**.\n- Kullanım\
    \ hakkı varlığı = yükümlülük + başlangıçtaki doğrudan maliyet − alınan kiralama teşviki (TFRS 16.24)\n  = 1.816.113 +\
    \ 50.000 − 20.000 = **1.846.113 TL**.\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| Kullanım Hakkı Varlıkları (ilave\
    \ duran varlık hesabı) | 1.846.113 | |\n| 102 Bankalar (alınan teşvik) | 20.000 | |\n| Kiralama Yükümlülükleri (301/401\
    \ ilave alt hesaplar) | | 1.816.113 |\n| 102 Bankalar (danışmanlık ücreti) | | 50.000 |\n\n**(b) 2026 kayıtları**\n\n\
    - Faiz = 1.816.113 × %30 = **544.834 TL**: 780 Finansman Giderleri borç / Kiralama Yükümlülükleri alacak.\n- Ödeme 1.000.000\
    \ TL: Kiralama Yükümlülükleri borç / 102 alacak.\n- Amortisman = 1.846.113 / 3 = **615.371 TL**: ilgili faaliyet gideri\
    \ borç / Birikmiş Amortismanlar (kullanım hakkı)\n  alacak.\n- 31.12.2026 yükümlülük = 1.816.113 + 544.834 − 1.000.000\
    \ = **1.360.947 TL**.\n- Kısa vadeli kısım (2027'de ödenecek anapara) = 1.000.000 − 1.360.947 × %30 = 1.000.000 − 408.284\
    \ = **591.716 TL**;\n  uzun vadeli kısım **769.231 TL**. (Raporlama tarihinde yürürlükte olan ödeme 1.000.000 TL'dir;\
    \ endeks değişikliği\n  nakit akışlarına 2027'de yansıyacaktır.)\n\n**(c) Endeks değişikliği**\n\nEndeks değişikliği nedeniyle\
    \ ödemeler değiştiğinde yükümlülük, revize ödemelerle **değişmemiş iskonto oranı**\nkullanılarak yeniden ölçülür (TFRS\
    \ 16.42-b, 16.43); fark kullanım hakkı varlığına eklenir (TFRS 16.39).\n\n- Yeni yükümlülük = 1.400.000 × (0,769231 +\
    \ 0,591716) = 1.400.000 × 1,360947 = **1.905.326 TL**.\n- Artış = 1.905.326 − 1.360.947 = **544.379 TL**: Kullanım Hakkı\
    \ Varlıkları borç / Kiralama Yükümlülükleri alacak.\n- Kullanım hakkı varlığının yeni defter değeri = 1.846.113 − 615.371\
    \ + 544.379 = 1.775.121 TL; kalan 2 yılda itfa\n  edilir (yıllık yaklaşık 887.561 TL).\n\n**(d) VUK farkı ve ertelenmiş\
    \ vergi**\n\n- TFRS gideri = 615.371 + 544.834 = **1.160.205 TL**; VUK gideri = 1.000.000 + 50.000 − 20.000 = **1.030.000\
    \ TL**;\n  TFRS gideri **130.205 TL** fazladır.\n- Vergiye esas değerler sıfırdır. Kullanım hakkı varlığı (1.230.742 TL)\
    \ vergiye tabi geçici fark → EVY\n  **307.686 TL**; kira yükümlülüğü (1.360.947 TL) indirilebilir geçici fark → EVV **340.237\
    \ TL**. Net EVV\n  **32.551 TL** (130.205 × %25 ile tutarlıdır).\n- İlk muhasebeleştirme istisnası, ilk kayıtta **eşit\
    \ tutarda** vergiye tabi ve indirilebilir geçici fark doğuran\n  işlemlere uygulanmaz (TMS 12.22A, 15-b-iii, 24-c); bu\
    \ nedenle kiralamada ertelenmiş vergi hesaplanır.\n"
