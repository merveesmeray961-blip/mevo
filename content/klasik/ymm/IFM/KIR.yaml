- id: YMM-IFM-KIR-K001
  sinav: ymm
  ders: IFM
  konu: KIR
  kazanimlar:
  - TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  - TFRS 15 beş adımlı model
  - sözleşme varlığı ve yükümlülüğü
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Doruk AŞ''nin 2026 yılına ilişkin iki işlemi aşağıdadır (KDV dikkate alınmayacaktır; tutarları tam TL olarak hesaplayınız).


    **1. Depo kiralaması (kiracı olarak)**


    - Kiralama 1.1.2026''da fiilen başlamıştır; kiralama süresi 5 yıldır. Yıllık kira 625.000 TL olup her yıl 31 Aralık''ta
    ödenecektir.

    - Kiralamadaki zımni faiz oranı kolaylıkla belirlenememektedir; Doruk AŞ''nin alternatif borçlanma faiz oranı %12''dir.
    5 yıllık %12 anüite bugünkü değer faktörü: 3,6048.

    - 1.1.2026''da kiraya veren, Doruk AŞ''ye taşınma desteği olarak 50.000 TL nakit ödemiştir.

    - Doruk AŞ, sözleşme yapılmasaydı katlanmayacağı 37.000 TL emlak komisyonunu 1.1.2026''da banka hesabından ödemiştir.

    - Kiralama sonunda deponun ilk hâline getirilmesi yükümlülüğü için TMS 37''ye göre ölçülen karşılığın bugünkü değeri 160.000
    TL''dir (karşılığın iskonto etkisinin itfası dikkate alınmayacaktır).

    - Deponun mülkiyeti devredilmeyecek, satın alma opsiyonu yoktur; binanın kalan yararlı ömrü 30 yıldır. Kullanım hakkı
    varlığı doğrusal yöntemle amortismana tabi tutulmaktadır.


    **2. Paket satış (satıcı olarak)**


    - 1.10.2026''da bir müşteriyle bir makine ile 12 aylık bakım hizmetinden oluşan paket için 1.080.000 TL''ye sözleşme imzalanmış,
    bedelin tamamı aynı gün banka hesabına tahsil edilmiştir.

    - Makine ve bakım hizmeti ayrı edim yükümlülükleridir. Tek başına satış fiyatları: makine 1.000.000 TL, 12 aylık bakım
    200.000 TL''dir; indirimin belirli bir edime ait olduğuna dair gözlemlenebilir kanıt yoktur.

    - Makine 1.10.2026''da teslim edilmiştir; bakım hizmeti 1.10.2026''dan itibaren 12 ay boyunca eşit olarak sunulacaktır.
    Önemli finansman bileşeni yoktur.


    **İstenenler**


    (a) Kira yükümlülüğünün ve kullanım hakkı varlığının ilk ölçüm tutarlarını hesaplayınız ve 1.1.2026 tarihli yevmiye kaydını
    yapınız. (8 puan)


    (b) Kiralamaya ilişkin 31.12.2026 tarihli kayıtları yapınız; 31.12.2026 itibarıyla kira yükümlülüğü ile kullanım hakkı
    varlığının net defter değerini ve kiralamanın 2026 kâr veya zararına toplam etkisini bulunuz. (7 puan)


    (c) Paket satışta işlem bedelini edim yükümlülüklerine dağıtınız; 2026 yılında finansal tablolara alınacak hasılatı ve
    31.12.2026 tarihli sözleşme yükümlülüğünü hesaplayarak 1.10.2026 ve 31.12.2026 tarihli kayıtları yapınız. (10 puan)

    '
  cozum: '**(a) İlk ölçüm (TFRS 16 par. 23-26)**


    - Kira yükümlülüğü = ödenmemiş kira ödemelerinin bugünkü değeri = 625.000 × 3,6048 = **2.253.000 TL**

    - Kullanım hakkı varlığı (par. 24):


    | Kalem | TL |

    |---|---|

    | Kira yükümlülüğünün ilk ölçümü | 2.253.000 |

    | Alınan kiralama teşviki (−) | (50.000) |

    | Başlangıçtaki doğrudan maliyet (komisyon) | 37.000 |

    | Restorasyon maliyeti (TMS 37 karşılığı) | 160.000 |

    | **Kullanım hakkı varlığı** | **2.400.000** |


    1.1.2026 kaydı (THP''de ayrı kodu olmayan TFRS 16 kalemleri adlarıyla gösterilmiştir):


    - Kullanım Hakkı Varlıkları (B) 2.400.000

    - 102 Bankalar (B) 50.000 (teşvik tahsilatı)

    - Kira Yükümlülükleri (A) 2.253.000

    - 102 Bankalar (A) 37.000 (komisyon ödemesi)

    - 479 Diğer Borç ve Gider Karşılıkları (A) 160.000


    Borç toplamı 2.450.000 = alacak toplamı 2.450.000.


    **(b) 31.12.2026 kayıtları (par. 31-32, 36-38)**


    - Faiz = 2.253.000 × %12 = **270.360 TL** → 780 Finansman Giderleri (B) 270.360 / Kira Yükümlülükleri (A) 270.360

    - Kira ödemesi → Kira Yükümlülükleri (B) 625.000 / 102 Bankalar (A) 625.000

    - Amortisman: mülkiyet devri ve satın alma opsiyonu olmadığından yararlı ömür (30 yıl) ile kiralama süresinden (5 yıl)
    kısa olanı esas alınır: 2.400.000 / 5 = **480.000 TL** → 770 Genel Yönetim Giderleri (B) 480.000 / Kullanım Hakkı Varlıkları
    Birikmiş Amortismanı (A) 480.000


    31.12.2026 bakiyeleri:


    - Kira yükümlülüğü = 2.253.000 + 270.360 − 625.000 = **1.898.360 TL**

    - Kullanım hakkı varlığının net defter değeri = 2.400.000 − 480.000 = **1.920.000 TL**

    - 2026 kâr veya zararına etki = 480.000 + 270.360 = **750.360 TL gider** (625.000 TL''lik kira ödemesi gider değildir;
    yükümlülüğü azaltır).


    **(c) Paket satış (TFRS 15 par. 74-76, 81, 106)**


    Tek başına satış fiyatları toplamı 1.200.000 TL; işlem bedeli 1.080.000 TL olduğundan 120.000 TL''lik indirim nispi tek
    başına satış fiyatlarına göre orantılı dağıtılır (oran 1.080.000 / 1.200.000 = 0,90):


    | Edim yükümlülüğü | Tek başına satış fiyatı | Dağıtılan bedel | 2026 hasılatı |

    |---|---|---|---|

    | Makine (belirli bir anda) | 1.000.000 | 900.000 | 900.000 |

    | Bakım (zamana yayılı) | 200.000 | 180.000 | 180.000 × 3/12 = 45.000 |

    | **Toplam** | 1.200.000 | 1.080.000 | **945.000** |


    31.12.2026 sözleşme yükümlülüğü = 180.000 − 45.000 = **135.000 TL** (bedel tahsil edildiği hâlde henüz sunulmamış 9 aylık
    bakım).


    Kayıtlar (sözleşme yükümlülüğü THP''de 380 Gelecek Aylara Ait Gelirler hesabında izlenmiştir):


    - 1.10.2026: 102 Bankalar (B) 1.080.000 / 600 Yurt İçi Satışlar (A) 900.000, 380 Gelecek Aylara Ait Gelirler (A) 180.000

    - 31.12.2026: 380 Gelecek Aylara Ait Gelirler (B) 45.000 / 600 Yurt İçi Satışlar (A) 45.000


    Not: Makinenin satışına ilişkin maliyet kaydı soruda istenmemiştir.

    '
  puanlama:
  - olcut: (a) Kira yükümlülüğünün 2.253.000 TL bulunması
    puan: 2
  - olcut: (a) Kullanım hakkı varlığının bileşenleriyle 2.400.000 TL bulunması (teşvikin düşülmesi, komisyon ve restorasyonun
      eklenmesi)
    puan: 4
  - olcut: (a) 1.1.2026 kaydının dengeli ve doğru taraflarla yapılması
    puan: 2
  - olcut: (b) Faizin 270.360 TL ve amortismanın kısa süre (5 yıl) esasıyla 480.000 TL bulunması
    puan: 3
  - olcut: (b) Faiz, ödeme ve amortisman kayıtları
    puan: 2
  - olcut: (b) Yıl sonu bakiyeleri (1.898.360; 1.920.000) ve K/Z etkisinin 750.360 TL bulunması
    puan: 2
  - olcut: (c) İndirimin orantılı dağıtımı (900.000 / 180.000)
    puan: 4
  - olcut: (c) 2026 hasılatının 945.000 TL ve sözleşme yükümlülüğünün 135.000 TL bulunması
    puan: 3
  - olcut: (c) 1.10.2026 ve 31.12.2026 kayıtları
    puan: 3
  kaynaklar:
  - mevzuat: TFRS 16 Kiralamalar
    madde: par. 23-26, 31-32, 36-38
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 35, 74-76, 81, 105-106
  gecerlilik:
    baslangic: '2019-01-01'
    bitis: null
  dogrulama:
    python: "yuk0 = round(625000 * 3.6048)\nkhv = yuk0 - 50000 + 37000 + 160000\nfaiz = round(yuk0 * 0.12)\namort = khv /\
      \ min(30, 5)\nyuk1 = yuk0 + faiz - 625000\noran = 1080000 / (1000000 + 200000)\nmakine = 1000000 * oran\nbakim = 200000\
      \ * oran\nhasilat = makine + bakim * 3 / 12\nsonuc = {'kira_yukumlulugu_ilk': yuk0, 'kullanim_hakki': khv, 'faiz': faiz,\
      \ 'amortisman': amort,\n         'kira_yukumlulugu_son': yuk1, 'khv_net': khv - amort, 'kz_etkisi': amort + faiz,\n\
      \         'makine_payi': makine, 'bakim_payi': bakim, 'hasilat_2026': hasilat,\n         'sozlesme_yukumlulugu': bakim\
      \ - bakim * 3 / 12}"
  durum: kontrolde
  surum: 1
