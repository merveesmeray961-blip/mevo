    \ **sözleşme varlığı 4.000.000 TL**\n(TFRS 15.107); koşulsuz tahsil hakkı olan **ticari alacak 3.000.000 TL** (TFRS 15.108).\n\
    \n**(c) 2027**\n\n- Kümülatif maliyet 38.000.000 TL; toplam tahmini maliyet = 38.000.000 + 24.000.000 = **62.000.000 TL**\
    \ (bedeli\n  aşıyor; sözleşmeden toplam **2.000.000 TL zarar** bekleniyor).\n- Tamamlanma oranı = 38 / 62 = %61,29; kümülatif\
