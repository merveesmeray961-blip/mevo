    python: "yuk = round(1000000 * (0.769231 + 0.591716 + 0.455166))\nkhv = yuk + 50000 - 20000\nfaiz = round(yuk * 0.30)\n\
      am = round(khv / 3)\nkap = yuk + faiz - 1000000\nkisa = 1000000 - round(kap * 0.30)\nyeni = round(1400000 * (0.769231\
      \ + 0.591716))\nsonuc = {\"yuk\": yuk, \"khv\": khv, \"faiz\": faiz, \"am\": am, \"kap\": kap, \"kisa\": kisa, \"uzun\"\
      : kap - kisa,\n         \"yeni\": yeni, \"art\": yeni - kap, \"khv2\": khv - am + yeni - kap, \"tfrs\": am + faiz, \"\
      vuk\": 1030000,\n         \"fark\": am + faiz - 1030000, \"evy\": round((khv - am) * 0.25), \"evv\": round(kap * 0.25)}\n"
