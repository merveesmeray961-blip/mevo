  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-KON-K002
  sinav: ymm
  ders: IFM
  konu: KON
  kazanimlar:
  - TFRS 10 kontrol ve konsolide tablolar
  - TFRS 3 satın alma yöntemi ve şerefiye
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Kuzey AŞ, 1.1.2026 tarihinde Güney AŞ''nin paylarının %70''ini 8.400.000 TL nakit karşılığında satın alarak Güney AŞ''nin
    kontrolünü elde etmiştir. Edinim tarihinde Güney AŞ''nin tanımlanabilir varlık ve yükümlülüklerine ilişkin bilgiler aşağıdadır
    (TL):


    | Kalem | Defter değeri | Gerçeğe uygun değer |

    |---|---|---|

    | Ticari alacaklar | 2.000.000 | 2.000.000 |

    | Stoklar | 3.000.000 | 3.500.000 |

    | Maddi duran varlıklar (net) | 5.000.000 | 6.500.000 |

    | Ticari borçlar | (1.500.000) | (1.500.000) |

    | Banka kredileri | (2.000.000) | (2.000.000) |


    Ayrıca Güney AŞ''nin defterlere yansımamış, ayrıca tanımlanabilir bir marka değeri 500.000 TL gerçeğe uygun değerle mevcuttur.
    Kontrol gücü olmayan paylar (KGOP) gerçeğe uygun değer (tam şerefiye) yöntemiyle ölçülmüştür; KGOP''un gerçeğe uygun değeri
    3.200.000 TL''dir. Edinimle ilgili noter ve danışmanlık ücretleri toplamı 150.000 TL''dir. Ertelenmiş vergi etkisi dikkate
    alınmayacaktır.


    **İstenenler**


    (a) Güney AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun değerini hesaplayınız. (5 puan)


    (b) Transfer edilen bedeli ve şerefiyeyi hesaplayınız. (8 puan)


    (c) Edinim maliyetinin (150.000 TL) muhasebesi hakkında kısa bir açıklama yapınız. (3 puan)


    (d) Edinim günü konsolide finansal tablolarda KGOP tutarı ve şerefiyenin nasıl raporlanacağını belirtiniz. (9 puan)

    '
  cozum: '**(a) Tanımlanabilir net varlıkların gerçeğe uygun değeri**


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari alacaklar | 2.000.000 |

    | Stoklar (GUD) | 3.500.000 |

    | Maddi duran varlıklar (GUD) | 6.500.000 |

    | Marka değeri (tanımlanabilir soyut varlık) | 500.000 |

    | Ticari borçlar | (1.500.000) |

    | Banka kredileri | (2.000.000) |

    | **Net tanımlanabilir varlıklar** | **9.000.000** |


    **(b) Transfer edilen bedel ve şerefiye (TFRS 3 par. 32, 19)**


    Transfer edilen bedel = 8.400.000 TL (ödenen nakit)


    Tam şerefiye yöntemi:

    - Transfer edilen bedel: 8.400.000

    - KGOP gerçeğe uygun değeri: 3.200.000

    - Toplam: 11.600.000

    - Tanımlanabilir net varlıklar: 9.000.000

    - **Şerefiye: 11.600.000 − 9.000.000 = 2.600.000 TL**


    **(c) Edinim maliyeti (TFRS 3 par. 53)**


    150.000 TL noter ve danışmanlık ücretleri transfer edilen bedele eklenmez ve şerefiyeye dahil edilmez. Bu tutarlar, hizmetlerin
    alındığı dönemde gider olarak kâr veya zarara yansıtılır.


    **(d) Konsolide tablolarda KGOP ve şerefiye**


    KGOP (tam şerefiye): 3.200.000 TL — konsolide finansal durum tablosunda özkaynaklar içinde, ana ortaklık payından ayrı
    olarak gösterilir.


    Şerefiye 2.600.000 TL — konsolide finansal durum tablosunda maddi olmayan duran varlıklar altında ayrı bir kalem olarak
    raporlanır; itfa edilmez, yıllık değer düşüklüğü testine (TMS 36) tabi tutulur.

    '
  puanlama:
  - olcut: (a) Stoklar, MDV ve marka değerinin gerçeğe uygun değerle dahil edilmesi; tanımlanabilir net varlıkların 9.000.000
      TL bulunması
    puan: 5
  - olcut: (b) Transfer edilen bedel 8.400.000 TL; KGOP gerçeğe uygun değeri 3.200.000 TL ile birlikte toplam 11.600.000 TL
      hesaplanması
    puan: 4
  - olcut: (b) Tanımlanabilir net varlıklardan şerefiyenin 2.600.000 TL olarak bulunması
    puan: 4
  - olcut: (c) 150.000 TL'nin şerefiyeye eklenmeyip dönem gideri yazılacağının ve TFRS 3 par. 53 dayanağının belirtilmesi
    puan: 3
  - olcut: (d) KGOP'un 3.200.000 TL olarak özkaynaklar içinde, ana ortaklık payından ayrı raporlanacağının belirtilmesi
    puan: 5
  - olcut: (d) Şerefiyenin 2.600.000 TL; itfa edilmeyip değer düşüklüğü testine tabi tutulacağının belirtilmesi
    puan: 4
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 18, 19, 32, 53
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: par. 22(b)
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
  dogrulama:
    python: 'net_varlik = 2000000 + 3500000 + 6500000 + 500000 - 1500000 - 2000000

      bedel = 8400000

      kgop = 3200000

      serefiye = (bedel + kgop) - net_varlik

      sonuc = {''net_varlik'': net_varlik, ''serefiye'': serefiye, ''kgop'': kgop}

      '
