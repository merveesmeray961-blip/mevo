- id: YMM-IFM-KON-K004
  sinav: ymm
  ders: IFM
  konu: KON
  kazanimlar:
  - kontrol gücü olmayan paylar
  - grup içi işlemlerin elimine edilmesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Anka AŞ, 1.1.2026 tarihinde Simurg AŞ''nin %75''ini 9.000.000 TL karşılığında satın almıştır. Edinim tarihinde Simurg
    AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 10.000.000 TL''dir. KGOP gerçeğe uygun değer yöntemiyle
    ölçülmüş olup KGOP gerçeğe uygun değeri 2.800.000 TL''dir. Vergi oranı %25''tir.


    2026 yılı boyunca aşağıdaki grup içi işlemler gerçekleşmiştir:


    1. Anka AŞ, Simurg AŞ''ye 1.000.000 TL maliyet bedelli mal 1.400.000 TL''ye satmıştır. Dönem sonu itibarıyla bu malların
    %60''ı Simurg AŞ stoğunda kalmaktadır.

    2. Simurg AŞ, Anka AŞ''ye 120.000 TL faiz ödemiştir.

    3. 2026 yılında Simurg AŞ 500.000 TL net kâr açıklamıştır.


    **İstenenler**


    (a) Edinim tarihinde şerefiyeyi hesaplayınız. (6 puan)


    (b) 2026 yılı konsolidasyonunda stokla ilgili gerçekleşmemiş kâr eliminasyonu ve ertelenmiş vergi etkisini hesaplayınız.
    (9 puan)


    (c) Grup içi faiz işleminin konsolidasyondaki etkisini açıklayınız. (4 puan)


    (d) Konsolide kâr veya zararda KGOP''a atfedilen tutarı hesaplayınız (eliminasyon sonrası). (6 puan)

    '
  cozum: '**(a) Şerefiye (TFRS 3 par. 19, 32)**


    Tam şerefiye yöntemi:

    - Transfer edilen bedel: 9.000.000

    - KGOP gerçeğe uygun değeri: 2.800.000

    - Toplam: 11.800.000

    - Tanımlanabilir net varlıklar: 10.000.000

    - **Şerefiye: 11.800.000 − 10.000.000 = 1.800.000 TL**


    **(b) Gerçekleşmemiş kâr eliminasyonu ve ertelenmiş vergi**


    Grup içi kâr: 1.400.000 − 1.000.000 = 400.000 TL

    Stoktaki gerçekleşmemiş kâr: 400.000 × %60 = 240.000 TL

    Konsolidasyonda stok 240.000 TL azaltılır; hasılat ve maliyet karşılıklı elimine edilir.


    Ertelenmiş vergi varlığı: 240.000 × %25 = 60.000 TL (stok eliminasyonu vergiye tabi geliri azaltacağından)


    Eliminasyon sonrası net etki: 240.000 − 60.000 = 180.000 TL net azalış


    **(c) Faiz eliminasyonu**


    Simurg AŞ''nin Anka AŞ''ye ödediği 120.000 TL, Anka AŞ''nin defterinde faiz geliri, Simurg AŞ''nin defterinde faiz gideri
    olarak yer alır. Konsolidasyonda bu karşılıklı tutar elimine edilir: faiz geliri ve faiz gideri her ikisi de 120.000 TL
    silinir; konsolide kâr ve zararda net etki sıfırdır.


    **(d) KGOP''a atfedilen kâr**


    Simurg AŞ net kârı: 500.000 TL

    Grup içi gerçekleşmemiş kâr (stok) yükü Simurg AŞ kaynaklı değil Anka AŞ kaynaklıdır; bu nedenle 500.000 TL''nin tamamı
