    paylar (KGOP) edinimde orantılı pay yöntemiyle ölçülmüştür. Vergi etkileri ile Alt AŞ''ye ilişkin edinim kaynaklı gerçeğe
    uygun değer farkları dikkate alınmayacaktır. Gruplar arası işlemlerden doğan kâr eliminasyonları satıcı işletmenin dönem
    kârı üzerinden yapılacak ve KGOP payı eliminasyon sonrası kâr üzerinden hesaplanacaktır.


    2026 yılına ilişkin bilgiler (TL):


    - Ana AŞ''nin bireysel net dönem kârı 3.000.000''dir; bu tutar, Alt AŞ''den alınan temettü geliri 400.000''i içermektedir.
    Alt AŞ''nin bireysel net dönem kârı 1.000.000 olup 2026''da toplam 500.000 temettü dağıtılmıştır.

    - Yukarı yönlü stok satışı: Alt AŞ, Ana AŞ''ye 900.000 TL''ye mal satmıştır (Alt AŞ''deki maliyeti 600.000). Bu malların
    üçte biri 31.12.2026''da Ana AŞ''nin stoklarında bulunmaktadır. Ayrıca 31.12.2025 itibarıyla Ana AŞ''nin stoklarında,
    Alt AŞ''den alınmış mallara ilişkin 50.000 TL gerçekleşmemiş kâr bulunuyordu; bu mallar 2026''da üçüncü kişilere satılmıştır.

    - Aşağı yönlü stok satışı: Ana AŞ''nin Alt AŞ''ye sattığı mallardan Alt AŞ''nin 31.12.2026 stoklarında kalanlara ilişkin
    gerçekleşmemiş kâr 40.000''dir (31.12.2025''te yoktu).

    - Yukarı yönlü makine satışı: Alt AŞ, 1.7.2026''da defter değeri 400.000 olan bir makineyi Ana AŞ''ye 600.000''e satmıştır.
    Makinenin kalan faydalı ömrü 5 yıl olup doğrusal amortismana tabidir (kalıntı değer yok).

    - KGOP''un 1.1.2026 tarihli defter değeri 1.600.000''dir.

    - 31.12.2026''da (dönem sonu işlemlerinden sonra) Ana AŞ, Alt AŞ paylarının %10''unu 900.000 TL nakde satmış ve payı %70''e
    inmiştir; Alt AŞ üzerindeki kontrol devam etmektedir. Satılan %10''luk payın konsolide finansal tablolardaki defter değeri
    (Alt AŞ''nin şerefiye dahil konsolide net varlıklarının %10''u) 800.000''dir.


    **İstenenler**


    (a) 2026 yılı gruplar arası işlemlerine ilişkin konsolidasyon eliminasyonlarını (temettü, stok, makine) tutarlarıyla gösteriniz;
