- id: YMM-IFM-KON-K001
  sinav: ymm
  ders: IFM
  konu: KON
  kazanimlar:
  - TFRS 3 satın alma yöntemi ve şerefiye
  - kontrol gücü olmayan paylar
  - grup içi işlemlerin elimine edilmesi
  - TFRS 10 kontrol ve konsolide tablolar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Doğu AŞ, 1.1.2026 tarihinde Batı AŞ''nin paylarının %80''ini 4.000.000 TL nakit karşılığında satın alarak Batı AŞ''nin
    kontrolünü elde etmiştir. Edinim tarihinde Batı AŞ''nin özkaynakları ve gerçeğe uygun değer bilgileri şöyledir:


    | Kalem | Tutar (TL) |

    |---|---|

    | Ödenmiş sermaye (500) | 2.000.000 |

    | Yedekler (540) | 1.500.000 |

    | Arsanın gerçeğe uygun değeri − defter değeri | 500.000 |

    | Binanın gerçeğe uygun değeri − defter değeri (kalan ömür 10 yıl, doğrusal) | 400.000 |


    - Batı AŞ''nin diğer varlık ve borçlarının defter değerleri gerçeğe uygun değerlerine eşittir.

    - Doğu AŞ, kontrol gücü olmayan payları **gerçeğe uygun değerleri** üzerinden ölçmeyi seçmiştir; edinim tarihindeki gerçeğe
    uygun değer 950.000 TL''dir.

    - Batı AŞ''nin 2026 yılı net dönem kârı (kendi tablolarına göre) 600.000 TL''dir; 2026''da kâr dağıtımı yapılmamıştır.

    - Batı AŞ, 2026 yılında maliyeti 200.000 TL olan malları Doğu AŞ''ye 300.000 TL''ye satmıştır. Bu malların %50''si 31.12.2026
    itibarıyla Doğu AŞ''nin stoklarındadır.

    - Vergi etkileri dikkate alınmayacaktır.


    **İstenenler**


    (a) Edinim tarihindeki şerefiyeyi hesaplayınız. (6 puan)


    (b) Edinim tarihindeki konsolidasyon (yatırım–özkaynak eliminasyonu) kaydını yapınız. (7 puan)


    (c) 2026 yılı grup içi satışa ilişkin konsolidasyon düzeltme kaydını yapınız. (4 puan)


    (d) 2026 yılı konsolide kârından kontrol gücü olmayan paylara düşen tutarı ve 31.12.2026 tarihli konsolide finansal durum
    tablosundaki kontrol gücü olmayan payların tutarını hesaplayınız. (8 puan)

    '
  cozum: '**(a) Şerefiye (TFRS 3 par. 32)**


    Tanımlanabilir net varlıkların gerçeğe uygun değeri = 2.000.000 + 1.500.000 + 500.000 + 400.000 = 4.400.000 TL


    Şerefiye = Transfer edilen bedel + Kontrol gücü olmayan paylar − Net varlıklar = 4.000.000 + 950.000 − 4.400.000 = **550.000
    TL**


    (Kontrol gücü olmayan paylar oransal yöntemle ölçülseydi %20 × 4.400.000 = 880.000 TL olur ve şerefiye 480.000 TL çıkardı;
    kökte gerçeğe uygun değer tercihi verildiği için 950.000 TL kullanılır — TFRS 3 par. 19.)


    **(b) Edinim tarihi eliminasyon kaydı (konsolidasyon çalışma kâğıdında)**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 500 Sermaye | 2.000.000 | |

    | 540 Yedekler | 1.500.000 | |

    | Arazi ve Arsalar (GUD farkı) | 500.000 | |

    | Binalar (GUD farkı) | 400.000 | |

    | Şerefiye | 550.000 | |

    | 245 Bağlı Ortaklıklar | | 4.000.000 |

    | Kontrol Gücü Olmayan Paylar | | 950.000 |

    | **Toplam** | **4.950.000** | **4.950.000** |


    Dayanak: TFRS 10 B86(b) — ana ortaklığın yatırımının defter değeri ile bağlı ortaklık özkaynağındaki payı elimine edilir;
    şerefiye TFRS 3''e göre muhasebeleştirilir.


    **(c) Grup içi satışın eliminasyonu (TFRS 10 B86(c))**


    Grup içi satış kârı = 300.000 − 200.000 = 100.000 TL; stokta kalan kısım = 100.000 × %50 = 50.000 TL (tamamen elimine
    edilir).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 600 Yurt İçi Satışlar | 300.000 | |

    | 621 Satılan Ticari Mallar Maliyeti | | 250.000 |

    | 153 Ticari Mallar | | 50.000 |


    (Satışların tamamı ve buna karşılık gelen maliyet elimine edilir; satılan malın maliyetindeki fazlalık 300.000 − 50.000
    = 250.000 TL''dir.)


    **(d) Kontrol gücü olmayan paylar**


    Bina GUD farkının ek amortismanı (B88): 400.000 / 10 = 40.000 TL


    Batı AŞ''nin konsolidasyon için düzeltilmiş kârı = 600.000 − 40.000 − 50.000 = 510.000 TL (satış yukarı yönlüdür; gerçekleşmemiş
    kâr satıcı Batı AŞ''nin kârından düşülür)


    KGOP''a düşen kâr = %20 × 510.000 = **102.000 TL**


    31.12.2026 KGOP = 950.000 + 102.000 = **1.052.000 TL** (kâr dağıtımı yoktur; TFRS 10 par. 22 uyarınca özkaynaklar içinde
    ayrı gösterilir.)

    '
  puanlama:
  - olcut: (a) Net varlıkların GUD'sinin (4.400.000) doğru bulunması
    puan: 3
  - olcut: (a) KGOP'un GUD ile alınarak şerefiyenin 550.000 TL bulunması
    puan: 3
  - olcut: (b) Sermaye, yedekler ve GUD farklarının borçlandırılması
    puan: 3
  - olcut: (b) Şerefiye, 245 Bağlı Ortaklıklar ve KGOP tutarlarının doğru ve dengeli kaydı
    puan: 4
  - olcut: (c) Satış, satılan malın maliyeti ve stok (50.000) eliminasyon kaydı
    puan: 4
  - olcut: (d) Ek amortisman (40.000) ve gerçekleşmemiş kâr (50.000) düzeltmeleriyle 510.000 TL düzeltilmiş kâr
    puan: 4
  - olcut: (d) KGOP kâr payı 102.000 TL ve dönem sonu KGOP 1.052.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 19, 32
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: par. 22, Ek B par. B86, B88
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
  dogrulama:
    python: "net = 2000000 + 1500000 + 500000 + 400000\nserefiye = 4000000 + 950000 - net\ngerceklesmemis = (300000 - 200000)\
      \ * 0.5\nduz_kar = 600000 - 400000/10 - gerceklesmemis\nkgop_kar = round(0.20 * duz_kar)\nsonuc = {'net_varlik': net,\
      \ 'serefiye': serefiye, 'eliminasyon_toplam': 4000000 + 950000,\n         'stok_eliminasyonu': gerceklesmemis, 'smm_eliminasyonu':\
      \ 300000 - gerceklesmemis,\n         'duzeltilmis_kar': duz_kar, 'kgop_kar_payi': kgop_kar, 'kgop_donem_sonu': 950000\
      \ + kgop_kar}"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
