- id: YMM-IFM-KON-K003
  sinav: ymm
  ders: IFM
  konu: KON
  kazanimlar:
  - TFRS 3 satın alma yöntemi ve şerefiye
  - kontrol gücü olmayan paylar
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Veriler**


    Rüzgar AŞ, 1.7.2026 tarihinde Nehir AŞ''nin paylarının %80''ini 6.000.000 TL nakit karşılığında satın almıştır. İşlem
    TFRS 3 kapsamında bir işletme birleşmesidir. Edinim tarihinde Nehir AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun
    değeri 6.500.000 TL''dir. KGOP orantılı pay yöntemiyle ölçülmüştür. Kurumlar vergisi oranı %25 olup ertelenmiş vergi etkisi
    dikkate alınmayacaktır.


    **İstenenler**


    (a) Edinim tarihinde KGOP tutarını hesaplayınız. (5 puan)


    (b) Şerefiyeyi hesaplayınız ve konsolide tablolarda nasıl raporlanacağını açıklayınız. (10 puan)


    (c) Rüzgar AŞ''nin bireysel tablolarında bu yatırım maliyet yöntemiyle izleniyorsa dönem sonu kayıt yapılıp yapılmayacağını
    TFRS ve tek düzen açısından kısaca karşılaştırınız. (5 puan)

    '
  cozum: '**(a) KGOP tutarı (TFRS 3 par. 19)**


    KGOP oranı = %20

    KGOP (orantılı pay yöntemi) = 6.500.000 × %20 = **1.300.000 TL**


    **(b) Şerefiye ve raporlama (TFRS 3 par. 32)**


    Orantılı pay yönteminde:

    - Transfer edilen bedel: 6.000.000

    - KGOP: 1.300.000

    - Toplam: 7.300.000

    - Tanımlanabilir net varlıklar: 6.500.000

    - **Şerefiye: 7.300.000 − 6.500.000 = 800.000 TL**


    Şerefiye konsolide finansal durum tablosunda maddi olmayan duran varlık olarak gösterilir; itfa edilmez, TMS 36 uyarınca
    yıllık değer düşüklüğü testine tabi tutulur.


    **(c) Bireysel tablolarda yatırım muhasebesi**


    TFRS''ye göre bireysel tablolarda bağlı ortaklık yatırımları TMS 27 uyarınca maliyet veya TFRS 9 gerçeğe uygun değer yöntemiyle
    izlenebilir. Maliyet yöntemi seçilirse yalnız temettü geliri kaydedilir; dönem sonu değer düzeltmesi yapılmaz.


    Tek düzen muhasebe sisteminde bağlı ortaklık yatırımı 242 hesabında maliyet bedeli üzerinden izlenir; TFRS''deki özkaynak
    yöntemi zorunluluğu bireysel tablolarda uygulanmaz; temettü alındığında 642 hesabına gelir kaydedilir.

    '
  puanlama:
  - olcut: (a) KGOP oranının %20 olarak belirlenmesi ve orantılı yöntemle 1.300.000 TL bulunması
    puan: 5
  - olcut: (b) Transfer edilen bedel ile KGOP toplamından şerefiyenin 800.000 TL hesaplanması
    puan: 6
  - olcut: (b) Şerefiyenin itfa edilmediği ve değer düşüklüğü testine tabi tutulduğunun belirtilmesi
    puan: 4
  - olcut: (c) Maliyet yönteminde dönem sonu değer düzeltmesi yapılmadığının ve temettü geliri ilkesinin açıklanması
    puan: 5
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 19, 32
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: par. 22(b)
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
  dogrulama:
    python: 'net_varlik = 6500000

      kgop_oran = 0.20

      kgop = net_varlik * kgop_oran

      bedel = 6000000

      serefiye = (bedel + kgop) - net_varlik

      sonuc = {''kgop'': kgop, ''serefiye'': serefiye}

      '
