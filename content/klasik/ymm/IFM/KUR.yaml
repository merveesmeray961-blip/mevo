  soru: '**Veriler**


    Geçerli ve sunum para birimi TL olan Anka AŞ''nin 2026 yılına ilişkin bilgileri:


    1. 1.7.2026''da bir yıl vadeli 100.000 ABD doları banka kredisi kullanmıştır (kur 38,00). Faiz bu soruda dikkate alınmayacaktır.

    2. 1.11.2026''da 50.000 ABD doları tutarında vadeli ihracat yapmıştır (kur 40,00). 15.12.2026''da alacağın 20.000 ABD
    doları tahsil edilmiştir (kur 41,00); kalanı 2027''de tahsil edilecektir.

    3. 31.12.2026 kapanış kuru: 1 ABD doları = 42,00 TL.

    4. Anka AŞ, 1.1.2026''da kurduğu ve %100 sahip olduğu Euro Ltd''nin (geçerli para birimi Avro; yüksek enflasyonlu değil)
    tek ortağıdır. Euro Ltd''nin 1.1.2026 net varlıkları 500.000 Avro (kur 40), 2026 net kârı 80.000 Avro''dur (ortalama kur
    43; kurlar önemli dalgalanmamıştır). Kâr dağıtımı yapılmamıştır. 31.12.2026 Avro kapanış kuru 45''tir.


    **İstenenler**


    (a) Anka AŞ''nin bireysel tablolarında (1) ve (2) numaralı işlemlerden doğan 2026 kur farklarını hesaplayıp ilgili yevmiye
    kayıtlarını (THP hesaplarıyla) yapınız; kur farklarının 2026 kâr veya zararına net etkisini belirtiniz. (10 puan)


    (b) Euro Ltd''nin konsolidasyon amacıyla TL''ye çevrilmesinde kullanılacak kurları belirtip 2026 yabancı para çevrim farkını
    hesaplayınız ve nerede muhasebeleştirileceğini açıklayınız. (9 puan)


    (c) Euro Ltd''nin tamamı 2027''de satılırsa (b)''de bulunan birikmiş çevrim farkının muhasebeleştirilmesini açıklayınız;
    satış yerine kontrolü kaybetmeden %30''unun satılması halinde ne değişeceğini belirtiniz. (6 puan)

    '
  cozum: '**(a) Parasal kalemler (TMS 21 par. 23(a), 28, 29)**


    Kredi ve ihracat alacağı parasal kalemdir; dönem sonunda kapanış kurundan çevrilir, kur farkları K/Z''a yansır.


    | İşlem | Hesap | Tutar (TL) |

    |---|---|---|

    | Kısmi tahsilat | 20.000 × (41,00 − 40,00) | 20.000 gelir |

    | Kalan alacağın değerlemesi | 30.000 × (42,00 − 40,00) | 60.000 gelir |

    | Kredinin değerlemesi | 100.000 × (42,00 − 38,00) | 400.000 gider |


    Yevmiye kayıtları:


    1.7.2026 — 102 Bankalar (B) 3.800.000 / 300 Banka Kredileri (A) 3.800.000


    1.11.2026 — 120 Alıcılar (B) 2.000.000 / 601 Yurt Dışı Satışlar (A) 2.000.000


    15.12.2026 — 102 Bankalar (B) 820.000 / 120 Alıcılar (A) 800.000, 646 Kambiyo Kârları (A) 20.000


    31.12.2026 — 120 Alıcılar (B) 60.000 / 646 Kambiyo Kârları (A) 60.000


    31.12.2026 — 656 Kambiyo Zararları (B) 400.000 / 300 Banka Kredileri (A) 400.000


    Net etki: 20.000 + 60.000 − 400.000 = **−320.000 TL** (net kur farkı gideri).


    **(b) Yabancı işletmenin çevrimi (par. 39-41)**


    - Varlık ve yükümlülükler: kapanış kuru 45 → net varlıklar (500.000 + 80.000) × 45 = 26.100.000 TL

    - Gelir ve giderler: işlem tarihi kurları; kurlar önemli dalgalanmadığından ortalama kur 43 kullanılabilir (par. 40) →
    kâr 80.000 × 43 = 3.440.000 TL

    - Açılış net varlıkları: 500.000 × 40 = 20.000.000 TL


    Çevrim farkı = 26.100.000 − 20.000.000 − 3.440.000 = **2.660.000 TL**


    Sağlama: Açılış net varlıkları 500.000 × (45 − 40) = 2.500.000 + kâr 80.000 × (45 − 43) = 160.000 → 2.660.000 TL.


    Bu fark K/Z''a değil, **diğer kapsamlı gelirde** ayrı bir unsur olarak muhasebeleştirilir ve yabancı işletme elden çıkarılana
    kadar özkaynakta birikir (par. 39(c), 41).


    **(c) Elden çıkarma (par. 48, 48C)**


    Tamamının satışında özkaynakta birikmiş 2.660.000 TL çevrim farkı, elden çıkarma kazanç/kaybı muhasebeleştirilirken **yeniden
    sınıflandırma düzeltmesi** olarak özkaynaktan K/Z''a aktarılır (par. 48).


    Kontrolü kaybetmeden %30''unun satılması halinde ise birikmiş çevrim farkının oransal payı (2.660.000 × %30 = 798.000
    TL) K/Z''a aktarılmaz; söz konusu yurt dışı işletmedeki **kontrol gücü olmayan paylarla yeniden ilişkilendirilir** (par.
    48C). İşlem, TFRS 10 par. 23 uyarınca özkaynak işlemidir.

    '
