  soru: '**Veriler**


    Geçerli ve sunum para birimi TL olan, hesap dönemi takvim yılı olan Vera Ticaret AŞ, yurt dışından mal ithal etmekte ve
    ihracat yapmaktadır. Şirketin 2026 yılına ilişkin yabancı para işlemleri aşağıdadır. Ertelenmiş vergi dikkate alınmayacaktır;
    kur farkları ilgili işlem tarihlerindeki ve kapanıştaki kurlar üzerinden hesaplanacaktır.


    | Tarih | ABD doları (USD/TL) | Avro (EUR/TL) |

    |---|---|---|

    | 31.12.2025 | – | 47,00 |

    | 1.6.2026 | 40,00 | – |

    | 1.9.2026 | 46,00 | – |

    | 1.10.2026 | 45,00 | – |

    | 1.11.2026 | 44,50 | – |

    | 20.12.2026 | 44,20 | – |

    | 31.12.2026 | 44,00 | 51,00 |


    1. **Stoklar:** 1.6.2026''da 50.000 USD bedelle (peşin) A ürünü, 1.9.2026''da 30.000 USD bedelle (peşin) B ürünü ithal
    edilmiş ve yıl sonunda hâlâ satılmamıştır. 31.12.2026 itibarıyla tahmini net gerçekleşebilir değerler: A ürünü için 46.000
    USD, B ürünü için 31.000 USD''dir (net gerçekleşebilir değerler 31.12.2026 kapanış kuruyla çevrilecektir).

    2. **İhracat alacağı:** 1.11.2026''da 80.000 USD vadeli mal satışı yapılmış; bunun 30.000 USD''si 20.12.2026''da tahsil
    edilmiş, 50.000 USD''si yıl sonunda tahsil edilmemiştir.

    3. **Arsa:** Şirket, TMS 16''da yeniden değerleme modelini uyguladığı bir arsayı avro cinsinden değerlemektedir. 31.12.2025''teki
    gerçeğe uygun değeri 200.000 avro olup bu değerle ve 47,00 kurla kayda alınmıştır (önceden yeniden değerleme artışı/azalışı
    yoktur). 31.12.2026''daki gerçeğe uygun değeri 220.000 avrodur.

    4. **Diğer kalemler:** 1.10.2026''da yurt dışı bir makine tedarikçisine siparişe bağlı olarak 20.000 USD avans ödenmiş,
    makine yıl sonuna kadar teslim edilmemiştir. Ayrıca 1.10.2026''da kullanım hakkı varlığıyla birlikte kayda alınan, USD
    cinsinden ve yıl sonunda ödenmemiş kalan 10.000 USD''lik kira yükümlülüğü bulunmaktadır.


    **İstenenler**


    (a) Stokların 31.12.2026 tarihli defter değerlerini TMS 21''e göre belirleyiniz; her iki ürün için değer düşüklüğü kaydını
    gerekiyorsa yapınız ve karşılaştırmanın USD ve TL bazındaki sonuçlarının neden farklı çıkabildiğini açıklayınız. (8 puan)


    (b) İhracat alacağına ilişkin 2026 yılı kur farkını hesaplayınız ve kâr veya zarardaki yerini kayıtla gösteriniz. (5 puan)


    (c) Arsanın 31.12.2026''daki defter değerini, yeniden değerleme artışını ve bunun kur ile değer bileşenlerini hesaplayınız;
    artışın nerede muhasebeleştirileceğini kayıtla gösteriniz. (7 puan)


    (d) 4 numaralı bentteki avans ve kira yükümlülüğünün 31.12.2026''da hangi kurla gösterileceğini, parasal/parasal olmayan
    ayrımına dayanarak açıklayınız ve doğan kur farkını hesaplayınız. (5 puan)

    '
  cozum: '**(a) Stokların değerlemesi (TMS 21 par. 23(b), 25)**


    Stok parasal olmayan kalemdir; tarihi maliyetten ölçüldüğü için maliyet işlem tarihindeki kurla, net gerçekleşebilir değer
    (NGD) ise değerin belirlendiği tarihteki (kapanış) kurla çevrilir ve ikisinden düşük olanı defter değeri olur.


    | Ürün | Maliyet (TL) | NGD (TL) | Defter değeri | Değer düşüklüğü |

    |---|---|---|---|---|

    | A: 50.000 × 40,00 | 2.000.000 | 46.000 × 44,00 = 2.024.000 | 2.000.000 | 0 |

    | B: 30.000 × 46,00 | 1.380.000 | 31.000 × 44,00 = 1.364.000 | 1.364.000 | 16.000 |


    A ürününde NGD (46.000 USD) maliyetin (50.000 USD) altındadır, ancak 40,00 olan işlem kuru kapanış kurundan (44,00) düşük
    olduğundan TL bazında NGD maliyetin üzerindedir; değer düşüklüğü yoktur. B ürününde USD bazında NGD maliyetin üzerindedir,
    fakat maliyet yüksek kurla (46,00) kaydedildiği için TL bazında NGD maliyetin altına düşer ve **16.000 TL** değer düşüklüğü
    doğar. Standart, bu karşılaştırmanın geçerli para biriminde değer düşüklüğü, yabancı para biriminde ise değer düşüklüğü
    olmaması durumunu (veya tersini) doğurabileceğini belirtir (par. 25).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri (stok değer düşüklüğü gideri) | 16.000 | |

    | 158 Stok Değer Düşüklüğü Karşılığı (–) | | 16.000 |


    **(b) İhracat alacağı kur farkı (TMS 21 par. 28)**


    Alacak parasal kalemdir; tahsilde ve kapanışta güncel kurla çevrilir, fark kâr veya zararda gösterilir.


    - Tahsil edilen 30.000 USD: kayıtlı 30.000 × 44,50 = 1.335.000; tahsil 30.000 × 44,20 = 1.326.000; zarar = **9.000 TL**.

    - Kalan 50.000 USD: kayıtlı 50.000 × 44,50 = 2.225.000; kapanış 50.000 × 44,00 = 2.200.000; zarar = **25.000 TL**.

    - Toplam kur farkı zararı = **34.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 656 Kambiyo Zararları | 34.000 | |

    | 120 Alıcılar (9.000 + 25.000) | | 34.000 |


    **(c) Yeniden değerlenmiş arsa (TMS 21 par. 23(c), 30; TMS 16)**


    Gerçeğe uygun değerden ölçülen parasal olmayan kalem, gerçeğe uygun değerin ölçüldüğü tarihteki kurla çevrilir.


    - 31.12.2025 defter değeri = 200.000 × 47,00 = 9.400.000 TL

    - 31.12.2026 defter değeri = 220.000 × 51,00 = **11.220.000 TL**

    - Yeniden değerleme artışı = 11.220.000 − 9.400.000 = **1.820.000 TL**

    - Kur bileşeni = 200.000 × (51,00 − 47,00) = 800.000 TL; değer (avro) bileşeni = 20.000 × 51,00 = 1.020.000 TL; toplam
    1.820.000 TL.


    TMS 16''ya göre yeniden değerleme artışı diğer kapsamlı gelirde gösterilir; parasal olmayan kalemden doğan kazancın kur
    kısmı da aynı yerde muhasebeleştirilir (par. 30). Kur bileşeni kâr veya zarara **yazılmaz**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 250 Arazi ve Arsalar | 1.820.000 | |

    | 522 M.D.V. Yeniden Değerleme Artışları (diğer kapsamlı gelir) | | 1.820.000 |


    **(d) Avans ve kira yükümlülüğü (TMS 21 par. 16, 23)**


    Mal ve hizmetler için önceden ödenen tutarlar (verilen avans) parasal olmayan kalemdir; tarihi maliyetle ölçüldüğünden
    işlem tarihindeki kurla gösterilmeye devam edilir: 20.000 × 45,00 = **900.000 TL**; kur farkı doğmaz (kapanış kuruyla
    yeniden çevrilmez). Kira yükümlülüğü parasal kalemdir; kapanış kuruyla çevrilir: kayıt değeri 10.000 × 45,00 = 450.000
    TL, kapanış değeri 10.000 × 44,00 = 440.000 TL; 10.000 TL **kur farkı kazancı** kâr veya zararda (646 Kambiyo Karları)
    gösterilir.

    '
