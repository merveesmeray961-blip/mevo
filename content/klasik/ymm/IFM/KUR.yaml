- id: YMM-IFM-KUR-K001
  sinav: ymm
  ders: IFM
  konu: KUR
  kazanimlar:
  - parasal kalemlerin değerlemesi
  - yabancı işletmenin çevrimi
  - TMS 21 işlevsel para birimi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Geçerli ve sunum para birimi TL olan Anka AŞ''nin 2026 yılına ilişkin bilgileri:


    1. 1.7.2026''da bir yıl vadeli 100.000 ABD doları banka kredisi kullanmıştır (kur 38,00). Faiz bu soruda dikkate alınmayacaktır.

    2. 1.11.2026''da 50.000 ABD doları tutarında vadeli ihracat yapmıştır (kur 40,00). 15.12.2026''da alacağın 20.000 ABD
    doları tahsil edilmiştir (kur 41,00); kalanı 2027''de tahsil edilecektir.

    3. 31.12.2026 kapanış kuru: 1 ABD doları = 42,00 TL.

    4. Anka AŞ, 1.1.2026''da kurduğu ve %100 sahip olduğu Euro Ltd''nin (geçerli para birimi Avro; yüksek enflasyonlu değil)
    tek ortağıdır. Euro Ltd''nin 1.1.2026 net varlıkları 500.000 Avro (kur 40), 2026 net kârı 80.000 Avro''dur (ortalama kur
    43; kurlar önemli dalgalanmamıştır). Kâr dağıtımı yapılmamıştır. 31.12.2026 Avro kapanış kuru 45''tir.


    **İstenenler**


    (a) Anka AŞ''nin bireysel tablolarında (1) ve (2) numaralı işlemlerden doğan 2026 kur farklarını hesaplayıp ilgili yevmiye
    kayıtlarını (THP hesaplarıyla) yapınız; kur farklarının 2026 kâr veya zararına net etkisini belirtiniz. (10 puan)


    (b) Euro Ltd''nin konsolidasyon amacıyla TL''ye çevrilmesinde kullanılacak kurları belirtip 2026 yabancı para çevrim farkını
    hesaplayınız ve nerede muhasebeleştirileceğini açıklayınız. (9 puan)


    (c) Euro Ltd''nin tamamı 2027''de satılırsa (b)''de bulunan birikmiş çevrim farkının muhasebeleştirilmesini açıklayınız;
    satış yerine kontrolü kaybetmeden %30''unun satılması halinde ne değişeceğini belirtiniz. (6 puan)

    '
  cozum: '**(a) Parasal kalemler (TMS 21 par. 23(a), 28, 29)**


    Kredi ve ihracat alacağı parasal kalemdir; dönem sonunda kapanış kurundan çevrilir, kur farkları K/Z''a yansır.


    | İşlem | Hesap | Tutar (TL) |

    |---|---|---|

    | Kısmi tahsilat | 20.000 × (41,00 − 40,00) | 20.000 gelir |

    | Kalan alacağın değerlemesi | 30.000 × (42,00 − 40,00) | 60.000 gelir |

    | Kredinin değerlemesi | 100.000 × (42,00 − 38,00) | 400.000 gider |


    Yevmiye kayıtları:


    1.7.2026 — 102 Bankalar (B) 3.800.000 / 300 Banka Kredileri (A) 3.800.000


    1.11.2026 — 120 Alıcılar (B) 2.000.000 / 601 Yurt Dışı Satışlar (A) 2.000.000


    15.12.2026 — 102 Bankalar (B) 820.000 / 120 Alıcılar (A) 800.000, 646 Kambiyo Kârları (A) 20.000


    31.12.2026 — 120 Alıcılar (B) 60.000 / 646 Kambiyo Kârları (A) 60.000


    31.12.2026 — 656 Kambiyo Zararları (B) 400.000 / 300 Banka Kredileri (A) 400.000


    Net etki: 20.000 + 60.000 − 400.000 = **−320.000 TL** (net kur farkı gideri).


    **(b) Yabancı işletmenin çevrimi (par. 39-41)**


    - Varlık ve yükümlülükler: kapanış kuru 45 → net varlıklar (500.000 + 80.000) × 45 = 26.100.000 TL

    - Gelir ve giderler: işlem tarihi kurları; kurlar önemli dalgalanmadığından ortalama kur 43 kullanılabilir (par. 40) →
    kâr 80.000 × 43 = 3.440.000 TL

    - Açılış net varlıkları: 500.000 × 40 = 20.000.000 TL


    Çevrim farkı = 26.100.000 − 20.000.000 − 3.440.000 = **2.660.000 TL**


    Sağlama: Açılış net varlıkları 500.000 × (45 − 40) = 2.500.000 + kâr 80.000 × (45 − 43) = 160.000 → 2.660.000 TL.


    Bu fark K/Z''a değil, **diğer kapsamlı gelirde** ayrı bir unsur olarak muhasebeleştirilir ve yabancı işletme elden çıkarılana
    kadar özkaynakta birikir (par. 39(c), 41).


    **(c) Elden çıkarma (par. 48, 48C)**


    Tamamının satışında özkaynakta birikmiş 2.660.000 TL çevrim farkı, elden çıkarma kazanç/kaybı muhasebeleştirilirken **yeniden
    sınıflandırma düzeltmesi** olarak özkaynaktan K/Z''a aktarılır (par. 48).


    Kontrolü kaybetmeden %30''unun satılması halinde ise birikmiş çevrim farkının oransal payı (2.660.000 × %30 = 798.000
    TL) K/Z''a aktarılmaz; söz konusu yurt dışı işletmedeki **kontrol gücü olmayan paylarla yeniden ilişkilendirilir** (par.
    48C). İşlem, TFRS 10 par. 23 uyarınca özkaynak işlemidir.

    '
  puanlama:
  - olcut: (a) Tahsilat ve kalan alacak kur farklarının (20.000; 60.000) doğru hesaplanması
    puan: 3
  - olcut: (a) Kredi kur farkının (400.000) doğru hesaplanması
    puan: 2
  - olcut: (a) 646/656 ile yevmiye kayıtlarının doğru yön ve tutarla yapılması
    puan: 3
  - olcut: (a) Net etkinin (−320.000) ve K/Z'da muhasebeleştirmenin belirtilmesi
    puan: 2
  - olcut: (b) Kapanış ve ortalama kur kullanımının gerekçesiyle belirtilmesi
    puan: 3
  - olcut: (b) Çevrim farkının 2.660.000 TL bulunması
    puan: 4
  - olcut: (b) Farkın DKG'de ayrı unsur olarak muhasebeleştirileceğinin belirtilmesi
    puan: 2
  - olcut: (c) Tamamen satışta yeniden sınıflandırma (par. 48)
    puan: 3
  - olcut: (c) Kontrol kaybı olmayan kısmi satışta KGOP'a yeniden ilişkilendirme (par. 48C)
    puan: 3
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 23, 28, 29, 39, 40, 41, 48, 48C
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
  dogrulama:
    python: "tahsil = 20000 * (41 - 40)\nalacak = 30000 * (42 - 40)\nkredi = 100000 * (42 - 38)\nnet = tahsil + alacak - kredi\n\
      kapanis = (500000 + 80000) * 45\nkar_tl = 80000 * 43\ncevrim = kapanis - 500000 * 40 - kar_tl\nsonuc = {'tahsil_kur_farki':\
      \ tahsil, 'alacak_degerleme': alacak, 'kredi_kur_farki': kredi, 'net_kur': net,\n         'kapanis_net_varlik': kapanis,\
      \ 'kar_tl': kar_tl, 'cevrim_farki': cevrim, 'kgop_payi': cevrim * 0.30}"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_IFM-1.yaml, klasik 4
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-KUR-K002
  sinav: ymm
  ders: IFM
  konu: KUR
  kazanimlar:
  - TMS 21 işlevsel para birimi
  - parasal kalemlerin değerlemesi
  - VUK md.280 değerleme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Marmara Makine AŞ**'nin satış fiyatları ve maliyetleri ağırlıklı olarak Türk lirası cinsinden belirlenmekte, finansmanı\n\
    da büyük ölçüde TL ile sağlanmaktadır. 2026 yılı döviz cinsinden işlemleri (31.12.2026 kurları: USD 42,00 TL;\nEUR 47,00\
    \ TL):\n\n1. 1.11.2026'da yurt dışına 100.000 USD vadeli satış yapılmıştır (kur 40,00).\n2. 15.10.2026'da 2027 Ocak ayında\
    \ teslim alınacak bir makine için tedarikçiye 50.000 EUR avans ödenmiştir (kur 45,00).\n   Makine 15.1.2027'de teslim\
    \ alınmış, bedelin tamamı avansla karşılanmıştır.\n3. 1.12.2026'da 30.000 USD'ye ticari mal alınmış ve peşin ödenmiştir\
    \ (kur 41,00). Malın yıl sonundaki net\n   gerçekleşebilir değeri 28.000 USD'dir.\n4. 1.7.2026'da 200.000 EUR işletme\
    \ sermayesi kredisi kullanılmıştır (kur 44,00).\n5. 1.12.2026'da açılan 20.000 USD vadesiz mevduat hesabı bulunmaktadır\
    \ (kur 41,00).\n\nVerilen kurlar TCMB döviz alış kurlarıdır. Kurumlar vergisi oranı %25'tir.\n\n**İstenenler:**\n\n(a)\
    \ İşletmenin işlevsel para birimini belirleyerek gerekçesini açıklayınız. (4 puan)\n\n(b) Kalemleri parasal / parasal\
    \ olmayan olarak sınıflandırıp 31.12.2026 TFRS değerlerini ve kur farklarını\nhesaplayınız; kur farkı kayıtlarını yapınız.\
    \ (10 puan)\n\n(c) Avans ödenen makinenin 2027'deki maliyetini belirleyiniz. (4 puan)\n\n(d) VUK md. 280 değerlemesiyle\
    \ TFRS'yi karşılaştırınız; 3 numaralı kalemdeki farkın vergisel sonucunu ve ertelenmiş\nvergi etkisini belirtiniz. (7\
    \ puan)\n"
  cozum: '**(a) İşlevsel para birimi**


    İşlevsel para birimi, işletmenin faaliyet gösterdiği temel ekonomik çevrenin para birimidir. Belirlemede öncelikle

    satış fiyatlarını ve maliyetleri etkileyen para birimi, ikincil olarak finansmanın sağlandığı para birimi dikkate

    alınır (TMS 21.9–10). Satışlar, maliyetler ve finansman ağırlıklı olarak TL olduğundan işlevsel para birimi

    **Türk lirasıdır**; döviz işlemleri yabancı para işlemidir.


    **(b) Dönem sonu değerleme (TMS 21.23)**


    Parasal kalemler kapanış kuruyla çevrilir; tarihî maliyetle ölçülen parasal olmayan kalemler işlem tarihindeki kurla

    kalır.


    | Kalem | Nitelik | İlk kayıt | 31.12.2026 | Kur farkı |

    |---|---|---|---|---|

    | 1 USD alacak | Parasal | 4.000.000 | 4.200.000 | 200.000 gelir |

    | 2 EUR avans | Parasal olmayan | 2.250.000 | 2.250.000 | – |

    | 3 Ticari mal | Parasal olmayan | 1.230.000 | 1.176.000 (NGD) | – |

    | 4 EUR kredi | Parasal | 8.800.000 | 9.400.000 | 600.000 gider |

    | 5 USD mevduat | Parasal | 820.000 | 840.000 | 20.000 gelir |


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 120 Alıcılar | 200.000 | |

    | 102 Bankalar | 20.000 | |

    | 646 Kambiyo Kârları | | 220.000 |

    | 656 Kambiyo Zararları | 600.000 | |

    | 300 Banka Kredileri | | 600.000 |


    Net kur farkı etkisi **(380.000) TL**. 3 numaralı malda, net gerçekleşebilir değerin kapanış kuruyla çevrilmiş tutarı

    (28.000 × 42,00 = 1.176.000 TL) maliyetten düşük olduğundan **54.000 TL değer düşüklüğü** ayrılır (TMS 21.25,

    TMS 2.9): 654 borç / 158 alacak.


    **(c) Makine maliyeti**


    Verilen avans geri alınamayan, mal teslimiyle kapanacak parasal olmayan bir kalemdir; **işlem tarihi**, avansın

    ödendiği tarihtir (TFRS Yorum 22). Makine maliyeti 50.000 × 45,00 = **2.250.000 TL**; teslim günü kuru (48,00 vb.)

    dikkate alınmaz.


    **(d) VUK ile karşılaştırma**


    VUK md. 280''e göre yabancı paralar ve döviz cinsinden alacak ve borçlar borsa rayici, bulunmadığında Hazine ve Maliye

    Bakanlığınca belirlenen kurla (uygulamada TCMB döviz alış kuru) değerlenir. Bu nedenle 1, 4 ve 5 numaralı kalemlerde

    TFRS ve VUK sonuçları aynıdır.


    3 numaralı malda piyasa fiyatının düşmesinden doğan değer kaybı VUK md. 278''deki "değeri düşen mallar" kapsamına

    (yangın, deprem, su basması, bozulma vb.) girmediğinden **indirilemez**. TFRS''de gider yazılan 54.000 TL **kanunen kabul

    edilmeyen gider** olur. Mal satıldığında vergiye esas maliyet içinde indirilebileceği için indirilebilir geçici farktır:

    **EVV 13.500 TL** (289 borç / 696 alacak).

    '
  puanlama:
  - olcut: (a) TMS 21.9-10 göstergeleri ve TL işlevsel para birimi
    puan: 4
  - olcut: (b) Parasal/parasal olmayan sınıflaması
    puan: 3
  - olcut: (b) Kur farkları 200.000 / 600.000 / 20.000 TL ve kayıtlar
    puan: 5
  - olcut: (b) Ticari malda 54.000 TL değer düşüklüğü (TMS 21.25)
    puan: 2
  - olcut: (c) Avans tarihindeki kurla 2.250.000 TL maliyet
    puan: 4
  - olcut: (d) VUK md. 280 değerlemesi ve TFRS ile aynılık
    puan: 3
  - olcut: (d) VUK md. 278 kapsamı dışında kalan değer kaybı, KKEG ve EVV 13.500 TL
    puan: 4
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 9, 10, 16, 21, 23, 25
    alinti: Tarihi maliyet cinsinden ölçülen yabancı para birimindeki parasal olmayan kalemler işlem
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 278, 280
    alinti: rayici ile değerlenir. Borsa rayicinin takarrüründe muvazaa olduğu anlaşılırsa bu rayiç yerine
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "a1, a2 = 100000 * 40, 100000 * 42\nk1, k2 = 200000 * 44, 200000 * 47\nm1, m2 = 20000 * 41, 20000 * 42\nstok,\
      \ ngd = 30000 * 41, 28000 * 42\nsonuc = {\"a1\": a1, \"a2\": a2, \"kfa\": a2 - a1, \"avans\": 50000 * 45, \"k1\": k1,\
      \ \"k2\": k2, \"kfk\": k2 - k1,\n         \"m1\": m1, \"m2\": m2, \"kfm\": m2 - m1, \"gelir\": a2 - a1 + m2 - m1, \"\
      net\": a2 - a1 + m2 - m1 - (k2 - k1),\n         \"stok\": stok, \"ngd\": ngd, \"dd\": stok - ngd, \"evv\": (stok - ngd)\
      \ * 0.25}\n"
