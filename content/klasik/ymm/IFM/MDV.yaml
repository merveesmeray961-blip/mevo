  sinav: ymm
  ders: IFM
  konu: MDV
  kazanimlar:
  - ertelenmiş ödemeli maddi olmayan duran varlığın maliyeti ve özellikli varlık ayrımı
  - hasılata dayalı itfa yöntemi
  - sınırsız ömürlü maddi olmayan duran varlıkta değer düşüklüğü ve yararlı ömür değişikliği
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Yıldız Teknoloji AŞ''nin hesap dönemi takvim yılıdır. Şirket, maddi olmayan duran varlıklarını maliyet yöntemiyle izlemekte
    ve doğrusal olmayan bir yöntem öngörülmedikçe doğrusal itfa uygulamaktadır. Ertelenmiş vergi dikkate alınmayacaktır.


    1. **Yazılım lisansı.** Şirket, bir kurumsal yazılım lisansını 1.1.2026''da edinmiş ve aynı gün kullanıma almıştır. Bedel,
    31.12.2027''de tek seferde 12.100.000 TL olarak ödenecektir; peşin fiyat 10.000.000 TL''dir (yıllık %10 bileşik faiz içermektedir).
    Lisansın yararlı ömrü 5 yıl, kalıntı değeri sıfırdır.

    2. **Ücretli geçiş işletme hakkı.** Şirket, 1.1.2026''da bir köprünün işletme hakkını 36.000.000 TL''ye satın almıştır.
    Sözleşmeye göre hak, köprüden toplanan geçiş ücretleri toplamı 120.000.000 TL''ye ulaşıncaya kadar sürmektedir. Geçiş
    hasılatı 2026''da 18.000.000 TL, 2027''de 21.000.000 TL gerçekleşmiştir.

    3. **Marka.** Şirket, bir markayı 1.1.2024''te 6.000.000 TL''ye satın almış ve yararlı ömrünü sınırsız olarak belirlemiştir.
    31.12.2026''da yapılan yıllık değer düşüklüğü testinde markanın satış maliyetleri düşülmüş gerçeğe uygun değeri 5.200.000
    TL, kullanım değeri 5.600.000 TL bulunmuştur. 1.1.2027''de yönetim, markanın artık yalnızca 8 yıl daha yarar sağlayacağı
    sonucuna varmış ve bu tarihte yeniden yapılan testte geri kazanılabilir tutarı 5.200.000 TL olarak belirlemiştir.


    **İstenenler**


    (a) Yazılım lisansının ilk muhasebeleştirme tutarını, 2026 yılı faiz giderini, itfa payını ve 31.12.2026''daki defter
    değerini ve yükümlülük bakiyesini bulunuz; faizin neden TMS 23 uyarınca aktifleştirilmediğini açıklayınız. (6 puan)


    (b) İşletme hakkı için 2026 ve 2027 itfa paylarını hesaplayınız; hasılata dayalı itfa yönteminin genel olarak neden uygun
    sayılmadığını ve bu olayda hangi gerekçeyle kullanılabileceğini açıklayınız. (7 puan)


    (c) Markaya ilişkin 31.12.2026 işlemlerini (itfa, test, zarar) açıklayarak muhasebeleştiriniz. (6 puan)


    (d) 1.1.2027''de yararlı ömür değerlendirmesindeki değişikliğin muhasebeleştirilmesini ve 2027 yılı itfa payını hesaplayınız.
    (6 puan)

    '
  cozum: '**(a) Yazılım lisansı (TMS 38 par. 32, 97; TMS 23 par. 7)**


    - Ödeme normal kredi vadelerinin ötesine ertelendiğinden maliyet, peşin fiyat eşdeğeridir: **10.000.000 TL**. Toplam ödeme
    ile peşin fiyat arasındaki fark (2.100.000 TL) kredi süresi boyunca faiz gideri olarak muhasebeleştirilir (par. 32).

    - 2026 faiz gideri = 10.000.000 x %10 = **1.000.000 TL**; yükümlülük 31.12.2026''da 11.000.000 TL''dir (2027 faizi 1.100.000
    TL''dir).

    - Lisans edinildiği anda kullanıma hazır olduğundan özellikli varlık değildir (TMS 23 par. 7); faiz aktifleştirilmez,
    gider yazılır.

    - İtfa payı = 10.000.000 / 5 = **2.000.000 TL**; 31.12.2026 defter değeri = **8.000.000 TL**.


    | Hesap (1.1.2026) | Borç | Alacak |

    |---|---|---|

    | 260 Haklar | 10.000.000 | |

    | Ödenecek bedel (uzun vadeli borç) | | 10.000.000 |


    **(b) İşletme hakkı (TMS 38 par. 97, 98A-98C)**


    - 2026 itfa payı = 36.000.000 x 18.000.000 / 120.000.000 = **5.400.000 TL**.

    - 2027 itfa payı = 36.000.000 x 21.000.000 / 120.000.000 = **6.300.000 TL**.

    - Varlığın kullanımını içeren bir faaliyetten elde edilen hasılatı esas alan itfa yönteminin uygun olmadığına dair aksi
    ispat edilebilir bir karine vardır; çünkü hasılat satış hacmi, fiyat, enflasyon gibi varlığın ekonomik yararlarının tüketiminden
    bağımsız etkenlerden etkilenir (par. 98A). Karine ancak (i) maddi olmayan duran varlığın hasılatın bir ölçüsü olarak ifade
    edilmesi ya da (ii) hasılat ile yararların kullanımı arasında yüksek ilişki bulunduğunun kanıtlanması hâlinde aksi ispat
    edilebilir.

    - Burada sözleşme, hakkın ücretlerden elde edilen sabit bir toplam hasılata ulaşılıncaya kadar sürmesini öngördüğünden
    baskın, sınırlayıcı etken belirli bir hasılat düzeyine ulaşılmasıdır ve toplam hasılat tutarı sözleşmeyle belirlenmiştir;
    bu durumda elde edilen hasılat itfa için uygun bir esas olabilir (par. 98B, 98C).


    **(c) Marka - 31.12.2026**


    - Yararlı ömrü sınırsız olan maddi olmayan duran varlık itfa edilmez (par. 107); defter değeri geri kazanılabilir tutarıyla
    yıllık olarak ve değer düşüklüğü belirtisi olduğunda karşılaştırılır (par. 108; TMS 36 par. 10(a)).

    - Geri kazanılabilir tutar, satış maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinin büyük olanıdır: max(5.200.000;
    5.600.000) = **5.600.000 TL**.

    - Defter değeri 6.000.000 TL > 5.600.000 TL olduğundan değer düşüklüğü zararı = **400.000 TL**; marka yeniden değerlenmiş
    tutardan izlenmediği için zarar derhal kâr veya zararda muhasebeleştirilir (TMS 36 par. 59, 60, 61). Defter değeri 5.600.000
    TL.


    | Hesap (31.12.2026) | Borç | Alacak |

    |---|---|---|

    | Değer Düşüklüğü Zararı (kâr veya zarar) | 400.000 | |

    | 260 Haklar / Markalar | | 400.000 |


    **(d) 1.1.2027 - yararlı ömrün sınırlıya dönüşmesi (par. 109, 110)**


    - Sınırsız yararlı ömrün sınırlıya değişmesi muhasebe tahmininde değişikliktir (TMS 8) ve ileriye dönük uygulanır (par.
    109).

    - Yararlı ömrün sınırsız değil sınırlı olarak yeniden değerlendirilmesi, değer düşüklüğü belirtisidir; marka geri kazanılabilir
    tutarıyla karşılaştırılır (par. 110). Geri kazanılabilir tutar 5.200.000 TL < defter değeri 5.600.000 TL olduğundan ek
    değer düşüklüğü zararı = **400.000 TL**; defter değeri 5.200.000 TL.

    - 2027 itfa payı = 5.200.000 / 8 = **650.000 TL** (par. 97).

    '
