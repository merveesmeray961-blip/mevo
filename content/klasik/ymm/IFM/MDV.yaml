    python: 'maliyet = 9000000

      yillik = maliyet / 30

      bd24 = maliyet - 5 * yillik

      zarar = bd24 - 6000000

      yeni_yillik = 6000000 / 25

      bd_0326 = 6000000 - yeni_yillik - yeni_yillik * 3 / 12

      olmasaydi = maliyet - yillik * 6.25

      fv = 7600000

      artis = fv - bd_0326

      kz1 = min(artis, olmasaydi - bd_0326, zarar)

      dkg1 = artis - kz1

      fv_son = 7900000 - fv

      konut = (4600000 - 4000000) + (4700000 - 4600000)

      bina3_kz = 6000000 - 5800000

      am3 = 6000000 / 20 * 3 / 12

      toplam_kz = -yeni_yillik * 3 / 12 + kz1 + fv_son + konut + bina3_kz - am3

      sonuc = {''a_bd'': bd_0326, ''a_olmasaydi'': olmasaydi, ''a_kz'': kz1, ''a_dkg'': dkg1, ''a_birikmis'': maliyet - bd_0326,
      ''b_toplam'': konut, ''c_kz'': bina3_kz, ''c_am'': am3, ''d_kz'': toplam_kz, ''d_dkg'': dkg1}

