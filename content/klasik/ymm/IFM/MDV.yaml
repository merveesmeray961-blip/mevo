  soru: "**Veriler**\n\nRüzgâr Enerji AŞ'nin hesap dönemi takvim yılıdır; şirket maddi duran varlıklarını maliyet modeliyle\
    \ izlemekte ve doğrusal amortisman uygulamaktadır. Ertelenmiş vergi ve KDV dikkate alınmayacaktır; kalıntı değerler sıfırdır.\n\
    \n1. **Rüzgâr türbini ve söküm yükümlülüğü.** 1.1.2026'da kullanıma hazır hâle getirilen türbinin satın alma ve kurulum\
    \ maliyeti 10.000.000 TL'dir. Şirket, kiralanan arazi sözleşmesi gereği, türbinin faydalı ömrü olan 5 yılın sonunda (31.12.2030)\
    \ türbini söküp araziyi eski haline getirmek zorundadır. Bu işlemin 31.12.2030'daki tahmini nakit maliyeti **1.610.510\
    \ TL**'dir. Yükümlülüğe özgü riskleri yansıtan vergi öncesi iskonto oranı %10'dur (1,1^5 = 1,61051).\n2. **Forklift takası.**\
    \ 1.7.2026'da şirket, kullanmakta olduğu dizel forklifti (maliyet 3.000.000 TL, birikmiş amortisman 2.200.000 TL, gerçeğe\
    \ uygun değer 1.000.000 TL) ve 300.000 TL nakdi, bir satıcıdan elektrikli yeni bir forkliftle takas etmiştir. Yeni forkliftin\
    \ gerçeğe uygun değeri 1.300.000 TL'dir ve güvenilir biçimde ölçülmektedir. Yeni forklift farklı bir ömre, bakım yapısına\
    \ ve işletme maliyetine sahiptir; elde edilen varlıktan beklenen vergi sonrası nakit akışlarının riski, zamanlaması ve\
    \ tutarı eski varlıktan farklıdır ve bu fark, takas edilen varlıkların gerçeğe uygun değerine göre önemlidir.\n3. **Depo\
    \ binası ve atıl makine.** \n   - Yönetim kurulu 1.9.2026'da depo binasının satılmasına karar vermiş, emlak komisyoncusuyla\
    \ anlaşmış, binayı cari gerçeğe uygun değeriyle uyumlu bir fiyatla pazarlamaya başlamış ve satışın 1.11.2026'dan itibaren\
    \ 8 ay içinde tamamlanmasını beklemektedir. Bina, olduğu gibi derhal satılabilecek durumdadır. 1.11.2026'da binanın maliyeti\
    \ 5.000.000 TL, birikmiş amortismanı 1.000.000 TL'dir (amortisman bu tarihe kadar ayrılmıştır). Binanın 1.11.2026 itibarıyla\
    \ gerçeğe uygun değeri 3.900.000 TL, satış maliyetleri 200.000 TL'dir.\n   - Şirketin iki yıldır kullanmadığı bir makine\
    \ (defter değeri 700.000 TL) için yönetim \"uygun bir alıcı çıkarsa satılabilir\" şeklinde sözlü bir değerlendirme yapmış;\
    \ ancak satış planı onaylanmamış, aktif pazarlama programı başlatılmamış ve makine için fiyat belirlenmemiştir.\n\n**İstenenler**\n\
    \n(a) Türbinin 1.1.2026'daki maliyetini, 31.12.2026'da yükümlülüğün defter değerini, 2026 yılı amortisman ve faiz (iskonto\
    \ çözülmesi) giderlerini hesaplayınız; 1.1.2026 ve 31.12.2026 kayıtlarını yapınız. (8 puan)\n\n(b) Takasın ticari içeriğe\
    \ sahip olup olmadığını değerlendiriniz; yeni forkliftin maliyetini, eski forkliftin elden çıkarılmasından doğan kazanç\
    \ veya zararı hesaplayınız ve kaydı yapınız. Takasın ticari içerikten yoksun olması hâlinde yeni forkliftin maliyetinin\
    \ ne olacağını belirtiniz. (7 puan)\n\n(c) Depo binasının 1.11.2026 itibarıyla satış amaçlı elde tutulan duran varlık\
    \ olarak sınıflandırılıp sınıflandırılmayacağını gerekçelendiriniz; sınıflandırılıyorsa ölçümü, değer düşüklüğü zararını\
    \ ve kaydı belirtiniz. (6 puan)\n\n(d) Atıl makinenin satış amaçlı elde tutulan duran varlık olarak sınıflandırılıp sınıflandırılamayacağını\
    \ ve amortismana ilişkin sonucu gerekçesiyle açıklayınız. (4 puan)\n"
  cozum: '**(a) Söküm yükümlülüğü (TMS 16 par. 16(c); TMS 37 par. 45, 47, 60)**


    Maddi duran varlığın sökülmesine ve alanın eski haline getirilmesine ilişkin tahmini maliyet, varlığın maliyetine dahildir
    (TMS 16 par. 16(c)). Karşılık, paranın zaman değerinin etkisi önemli olduğundan nakit çıkışlarının bugünkü değeridir (TMS
    37 par. 45); iskonto oranı vergi öncesi orandır (par. 47).


    - Söküm yükümlülüğünün bugünkü değeri = 1.610.510 / 1,1^5 = **1.000.000 TL**

    - Türbin maliyeti = 10.000.000 + 1.000.000 = **11.000.000 TL**

    - 2026 amortismanı = 11.000.000 / 5 = **2.200.000 TL**

    - İskonto çözülmesi = 1.000.000 × %10 = **100.000 TL** (borçlanma maliyeti olarak gider; TMS 37 par. 60)

    - 31.12.2026 yükümlülük = 1.000.000 + 100.000 = **1.100.000 TL**


    | 1.1.2026 | Borç | Alacak |

    |---|---|---|

    | 253 Tesis, Makine ve Cihazlar | 11.000.000 | |

    | 102 Bankalar | | 10.000.000 |

    | Söküm ve restorasyon karşılığı (uzun vadeli) | | 1.000.000 |


    | 31.12.2026 | Borç | Alacak |

    |---|---|---|

    | 730/632 Amortisman gideri | 2.200.000 | |

    | 257 Birikmiş Amortismanlar (–) | | 2.200.000 |

    | 661 Uzun Vadeli Borçlanma Giderleri | 100.000 | |

    | Söküm ve restorasyon karşılığı | | 100.000 |


    **(b) Takas (TMS 16 par. 24, 25)**


    Takas işleminin ticari içeriği vardır: elde edilen varlığın nakit akışlarının (risk, zamanlama, tutar) transfer edilen
    varlıktan farklı olması ve bu farkın takas edilen varlıkların gerçeğe uygun değerine göre önemli olması şartı sağlanmıştır
    (par. 25(a),(c)). Bu durumda ve gerçeğe uygun değerler güvenilir ölçülebildiğinden, elde edilen kalem **gerçeğe uygun
    değeri** ile ölçülür (par. 24).


    - Eski forkliftin defter değeri = 3.000.000 − 2.200.000 = 800.000 TL

    - Yeni forkliftin maliyeti = 1.300.000 TL (= 1.000.000 gerçeğe uygun değer + 300.000 nakit)

    - Elden çıkarma kazancı = 1.000.000 − 800.000 = **200.000 TL**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 253 Tesis, Makine ve Cihazlar (yeni forklift) | 1.300.000 | |

    | 257 Birikmiş Amortismanlar (–) | 2.200.000 | |

    | 253 Tesis, Makine ve Cihazlar (eski forklift, maliyet) | | 3.000.000 |

    | 102 Bankalar | | 300.000 |

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar (elden çıkarma kazancı) | | 200.000 |

    | **Toplam** | **3.500.000** | **3.500.000** |


    Takas ticari içerikten yoksun olsaydı, yeni forklift elden çıkarılan varlığın **defter değeri ile** ölçülürdü: 800.000
    + 300.000 = **1.100.000 TL**; kazanç doğmazdı (par. 24).


    **(c) Depo binası (TFRS 5 par. 6–8, 15, 20, 25)**


    Bina, kullanımdan çok satış yoluyla geri kazanılacaktır (par. 6); olduğu gibi derhal satılabilir durumdadır; uygun yönetim
    kademesi plan yapmış, alıcı bulmaya yönelik aktif program başlatmış, cari gerçeğe uygun değerle uyumlu fiyatla pazarlamaktadır
    ve satışın bir yıl içinde tamamlanması beklenmektedir (par. 7, 8). Dolayısıyla **1.11.2026''da satış amaçlı elde tutulan
    duran varlık** olarak sınıflandırılır.


    Ölçüm, defter değeri ile gerçeğe uygun değerden satış maliyetleri düşülmüş tutarın düşüğüdür (par. 15):


    - Defter değeri = 5.000.000 − 1.000.000 = 4.000.000 TL

    - Gerçeğe uygun değer − satış maliyeti = 3.900.000 − 200.000 = 3.700.000 TL

    - Değer düşüklüğü zararı = 4.000.000 − 3.700.000 = **300.000 TL** (kâr veya zarara; par. 20)


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Satış Amaçlı Elde Tutulan Duran Varlıklar | 3.700.000 | |

    | 257 Birikmiş Amortismanlar (–) | 1.000.000 | |

    | 659 Diğer Gider ve Zararlar (değer düşüklüğü zararı) | 300.000 | |

    | 252 Binalar | | 5.000.000 |


    Sınıflandırmadan sonra bina için amortisman ayrılmaz (par. 25).


    **(d) Atıl makine (TFRS 5 par. 7, 8)**


    Makine için uygun bir yönetim kademesince onaylanmış bir satış planı, alıcı bulmaya yönelik aktif bir program ve cari
    gerçeğe uygun değerle uyumlu fiyatla aktif pazarlama bulunmadığından, satış olasılığının yüksek olduğu söylenemez; **satış
    amaçlı elde tutulan olarak sınıflandırılamaz**. Makine maddi duran varlık olarak izlenmeye ve amortismana tabi tutulmaya
    devam eder; atıl olması amortisman ayrılmasını durdurmaz (amortisman varlığın satış amaçlı sınıflandırılması hâlinde bırakılır).

    '
