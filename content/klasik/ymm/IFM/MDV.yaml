- id: YMM-IFM-MDV-K004
  sinav: ymm
  ders: IFM
  konu: MDV
  kazanimlar:
  - TMS 36 varlıklarda değer düşüklüğü
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Anka Seramik AŞ**''nin Bursa fabrikası, varlıklarının nakit girişleri birbirinden bağımsız olarak belirlenemediğinden

    tek bir **nakit yaratan birim** (NYB) olarak izlenmektedir. Bölgede yeni açılan rakip tesisler nedeniyle 31.12.2026''da

    değer düşüklüğü testi yapılmıştır. Birimde şerefiye yoktur. Defter değerleri (maliyet modeli):


    | Varlık | Defter değeri (TL) |

    |---|---|

    | Fabrika binası | 6.000.000 |

    | Makineler | 3.000.000 |

    | Taşıtlar | 1.000.000 |

    | Genel merkez binasından makul esasla dağıtılan pay (şirket varlığı) | 1.000.000 |

    | **Toplam** | **11.000.000** |


    Birimin kullanım değeri 8.800.000 TL, elden çıkarma maliyetleri düşülmüş gerçeğe uygun değeri 8.500.000 TL''dir.

    Taşıtların tek başına elden çıkarma maliyetleri düşülmüş gerçeğe uygun değeri 900.000 TL''dir; diğer varlıkların tek

    başına geri kazanılabilir tutarı belirlenememektedir. Kurumlar vergisi oranı %25''tir; VUK''a göre bu değer kaybı

    indirilemez.


    **İstenenler:**


    (a) Değer düşüklüğü göstergesini ve geri kazanılabilir tutarın belirlenmesini açıklayınız; birim için değer düşüklüğü

    zararını hesaplayınız. (5 puan)


    (b) Zararı varlıklara dağıtınız; taşıtlara ilişkin sınırlamayı uygulayınız ve dağıtım sonrası defter değerlerini

    gösteriniz. (9 puan)


    (c) Değer düşüklüğü ve ertelenmiş vergi kayıtlarını yapınız. (5 puan)


    (d) Değer düşüklüğü zararının iptal koşullarını ve sınırını açıklayınız. 31.12.2027''de taşıtların defter değeri

    720.000 TL, değer düşüklüğü hiç ayrılmasaydı oluşacak defter değeri 800.000 TL ve tek başına geri kazanılabilir tutarı

    900.000 TL ise iptal edilecek tutarı bulunuz. (6 puan)

    '
  cozum: "**(a) Gösterge ve zarar**\n\nPiyasadaki olumsuz gelişme (rakip tesisler) dış kaynaklı bir göstergedir (TMS 36.12).\
    \ Geri kazanılabilir tutar,\nelden çıkarma maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinden **yüksek olanıdır**\
    \ (TMS 36.18):\nmax(8.500.000; 8.800.000) = **8.800.000 TL**. Şirket varlığı makul esasla dağıtılabildiğinden birimin\
    \ defter değerine\ndahil edilir (TMS 36.102).\n\nDeğer düşüklüğü zararı = 11.000.000 − 8.800.000 = **2.200.000 TL** (birim\
    \ defter değerinin %20'si).\n\n**(b) Dağıtım**\n\nŞerefiye olmadığından zarar varlıklara **defter değerleri oranında**\
    \ dağıtılır (TMS 36.104). Ancak hiçbir varlık\nelden çıkarma maliyetleri düşülmüş gerçeğe uygun değeri, kullanım değeri\
    \ ve sıfırdan en yüksek olanın altına\nindirilemez (TMS 36.105). Taşıtlara düşen 200.000 TL onları 800.000 TL'ye indireceğinden\
    \ taşıtlara yalnız\n**100.000 TL** dağıtılır; kalan 100.000 TL diğer varlıklara 6 : 3 : 1 oranında yeniden dağıtılır.\n\
    \n| Varlık | İlk dağıtım (%20) | Yeniden dağıtım | Toplam zarar | Yeni defter değeri |\n|---|---|---|---|---|\n| Fabrika\
    \ binası | 1.200.000 | 60.000 | 1.260.000 | 4.740.000 |\n| Makineler | 600.000 | 30.000 | 630.000 | 2.370.000 |\n| Taşıtlar\
    \ | 200.000 | (100.000) | 100.000 | 900.000 |\n| Şirket varlığı payı | 200.000 | 10.000 | 210.000 | 790.000 |\n| **Toplam**\
    \ | **2.200.000** | – | **2.200.000** | **8.800.000** |\n\n**(c) Kayıtlar**\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n\
    | 654 Karşılık Giderleri (değer düşüklüğü zararı) | 2.200.000 | |\n| 257 Birikmiş Amortismanlar (birikmiş değer düşüklüğü\
    \ alt hesapları) | | 2.200.000 |\n| 289 Ertelenmiş Vergi Varlığı | 550.000 | |\n| 696 Ertelenmiş Vergi Geliri | | 550.000\
    \ |\n\nVUK'ta indirilemeyen zarar, TFRS defter değerini vergiye esas değerin altına indirir; 2.200.000 TL indirilebilir\
    \ geçici\nfark × %25 = **550.000 TL** ertelenmiş vergi varlığı doğar.\n\n**(d) İptal**\n\n- Değer düşüklüğünün azaldığına\
    \ dair gösterge varsa ve geri kazanılabilir tutarın belirlenmesinde kullanılan\n  tahminlerde değişiklik olmuşsa zarar\
    \ iptal edilir (TMS 36.110, 36.114).\n- Artan defter değeri, önceki yıllarda hiç değer düşüklüğü ayrılmasaydı oluşacak\
    \ defter değerini (amortisman\n  düşülmüş) **aşamaz** (TMS 36.117). İptal kâr veya zarara alınır (TMS 36.119); şerefiyede\
    \ iptal yapılmaz (TMS 36.124).\n- Taşıtlar: üst sınır min(900.000; 800.000) = 800.000 TL; iptal tutarı = 800.000 − 720.000\
    \ = **80.000 TL**.\n"
  puanlama:
  - olcut: (a) Gösterge ve geri kazanılabilir tutar (8.800.000 TL)
    puan: 3
  - olcut: (a) Zarar 2.200.000 TL
