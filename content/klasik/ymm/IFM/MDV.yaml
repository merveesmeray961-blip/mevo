- id: YMM-IFM-MDV-K002
  sinav: ymm
  ders: IFM
  konu: MDV
  kazanimlar:
  - TMS 16 maddi duran varlıklar ve amortisman
  - yeniden değerleme modeli
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Deniz Lojistik AŞ** 1.1.2026''da 12.000.000 TL''ye bir yük gemisi satın almış ve aynı gün kullanmaya başlamıştır.

    Teknik ekip geminin maliyetini önemli parçalarına şöyle ayırmıştır:


    | Parça | Maliyet (TL) | Faydalı ömür | Kalıntı değer (TL) |

    |---|---|---|---|

    | Ana makine (motor) | 3.000.000 | 5 yıl | 0 |

    | Gövde ve diğer aksam | 9.000.000 | 20 yıl | 1.000.000 |


    Gemi 1.1.2026''da zorunlu klas bakımından (havuzlama) geçirilmiş, bunun için 500.000 TL ödenmiştir. Bu bakım iki yılda

    bir yapılmaktadır. VUK kayıtlarında gemi için %10 oranıyla normal amortisman ayrılmış (1.200.000 TL), bakım bedeli

    ise gider yazılmıştır. Gemiyle ilgili giderler doğrudan satılan hizmet maliyetine (622) aktarılmaktadır.


    İşletme TFRS''de gemiler sınıfı için **yeniden değerleme modelini** uygulamakta ve yeniden değerlemede birikmiş

    amortismanı brüt defter değerinden mahsup etme (eliminasyon) yöntemini kullanmaktadır. 31.12.2026''da bağımsız

    değerlemeye göre geminin gerçeğe uygun değeri 11.900.000 TL''dir. Kurumlar vergisi oranı %25''tir; vergi mevzuatı

    yeniden değerleme artışını dikkate almamaktadır.


    **İstenenler:**


    (a) Parçalara ayırma (bileşen) yaklaşımını ve klas bakım bedelinin TMS 16 bakımından niteliğini açıklayınız; TFRS''ye

    göre 2026 amortismanını hesaplayınız. (6 puan)


    (b) 2026 yılı için gerekli TFRS düzeltme kayıtlarını yapınız ve dönem kârına etkisini belirtiniz. (5 puan)


    (c) Yeniden değerleme kayıtlarını yapınız; ertelenmiş vergiyi kâr veya zarar ile diğer kapsamlı gelir ayrımıyla

    hesaplayıp kaydediniz. (9 puan)


    (d) Yeniden değerleme artışının sonraki dönemlerde nasıl işleneceğini açıklayınız. Ayrıca, sonraki değerlemede geminin

    değeri 1.000.000 TL azalsaydı (özkaynakta 650.000 TL brüt artış bulunduğu varsayımıyla) azalışın nasıl

    muhasebeleştirileceğini gösteriniz. (5 puan)

    '
  cozum: "**(a) Bileşen yaklaşımı ve amortisman**\n\nToplam maliyete göre önemli bir maliyete sahip her parça ayrı amortismana\
    \ tabi tutulur (TMS 16.43). Faydalı ömrü\nfarklı olan motor ve gövde ayrı ayrı amortismana tabi tutulur. Düzenli büyük\
    \ bakım ve muayenelerin maliyeti,\nmuhasebeleştirme ölçütlerini karşılıyorsa ayrı bir parça olarak varlığın defter değerine\
    \ eklenir ve bir sonraki\nbakıma kadar amortismana tabi tutulur (TMS 16.14).\n\n| Parça | Hesap | 2026 amortismanı (TL)\
    \ |\n|---|---|---|\n| Motor | 3.000.000 / 5 | 600.000 |\n| Gövde | (9.000.000 − 1.000.000) / 20 | 400.000 |\n| Klas bakımı\
    \ | 500.000 / 2 | 250.000 |\n| **Toplam** | | **1.250.000** |\n\n**(b) Düzeltme kayıtları**\n\n| Hesap | Borç | Alacak\
    \ |\n|---|---|---|\n| 254 Taşıtlar (klas bakım parçası) | 500.000 | |\n| 622 Satılan Hizmet Maliyeti | | 500.000 |\n|\
    \ 622 Satılan Hizmet Maliyeti (ek amortisman: 1.250.000 − 1.200.000) | 50.000 | |\n| 257 Birikmiş Amortismanlar | | 50.000\
    \ |\n\nVUK'ta toplam gider 1.200.000 + 500.000 = 1.700.000 TL, TFRS'de 1.250.000 TL olduğundan dönem kârı **450.000 TL\n\
    artar**.\n\n**(c) Yeniden değerleme ve ertelenmiş vergi**\n\nTFRS defter değeri = 12.500.000 − 1.250.000 = 11.250.000\
    \ TL. Artış = 11.900.000 − 11.250.000 = **650.000 TL**;\ndiğer kapsamlı gelirde muhasebeleştirilir ve özkaynakta birikir\
    \ (TMS 16.39). Eliminasyon yönteminde birikmiş\namortisman brüt değerden mahsup edilir (TMS 16.35-b).\n\n| Hesap | Borç\
    \ | Alacak |\n|---|---|---|\n| 257 Birikmiş Amortismanlar | 1.250.000 | |\n| 254 Taşıtlar | | 1.250.000 |\n| 254 Taşıtlar\
    \ | 650.000 | |\n| 522 MDV Yeniden Değerleme Artışları | | 650.000 |\n\nVergiye esas değer (VUK) = 12.000.000 − 1.200.000\
    \ = 10.800.000 TL. Vergiye tabi geçici fark = 11.900.000 −\n10.800.000 = 1.100.000 TL; ertelenmiş vergi yükümlülüğü **275.000\
    \ TL**:\n\n- Kâr veya zarardan doğan kısım: 450.000 × %25 = **112.500 TL**,\n- Yeniden değerlemeden doğan kısım: 650.000\
    \ × %25 = **162.500 TL** (DKG'de, TMS 12.61A).\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 695 Ertelenmiş Vergi Gideri\
    \ | 112.500 | |\n| 522 MDV Yeniden Değerleme Artışları (vergi etkisi) | 162.500 | |\n| 489 Ertelenmiş Vergi Yükümlülüğü\
    \ | | 275.000 |\n\nÖzkaynakta vergi sonrası 487.500 TL yeniden değerleme artışı kalır.\n\n**(d) Sonraki dönemler**\n\n\
    - Yeniden değerleme artışı varlık kullanıldıkça (yeniden değerlenmiş tutar üzerinden ayrılan amortisman ile ilk maliyet\n\
    \  üzerinden ayrılacak amortisman arasındaki fark kadar) veya varlık elden çıkarıldığında **doğrudan geçmiş yıllar\n \
    \ kârlarına** aktarılabilir; bu aktarım **kâr veya zarar tablosundan geçmez** (TMS 16.41).\n- Değer azalışı önce aynı\
    \ varlığa ait yeniden değerleme artışını azaltır, kalanı gider yazılır (TMS 16.40):\n  650.000 TL diğer kapsamlı gelirden\
    \ (522 borç), **350.000 TL** kâr veya zarardan (gider) karşılanır; 254 alacak\n  1.000.000 TL.\n"
  puanlama:
  - olcut: (a) Bileşen yaklaşımı (TMS 16.43) ve klas bakımının aktifleştirilmesi (TMS 16.14)
    puan: 3
  - olcut: (a) 2026 amortismanı 1.250.000 TL
    puan: 3
  - olcut: (b) Bakım aktifleştirme ve 50.000 TL ek amortisman kaydı
    puan: 3
  - olcut: (b) Kâra etki +450.000 TL
    puan: 2
  - olcut: (c) Eliminasyon yöntemiyle 650.000 TL yeniden değerleme kaydı
    puan: 4
  - olcut: (c) EVY 275.000 TL; K/Z 112.500 ve DKG 162.500 ayrımı ve kaydı
    puan: 5
  - olcut: (d) Artışın geçmiş yıllar kârlarına aktarımı (TMS 16.41)
    puan: 2
  - olcut: (d) 1.000.000 TL azalışın 650.000 DKG / 350.000 K/Z dağılımı
    puan: 3
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 14, 35, 39, 40, 41, 43
    alinti: Bir maddi duran varlık kalemine ilişkin özkaynak hesap grubundaki yeniden değerleme değer artışı, ilgili
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 61A
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "am = 3000000 / 5 + (9000000 - 1000000) / 20 + 500000 / 2\netki = 1200000 + 500000 - am\ndd = 12500000 - am\n\
      art = 11900000 - dd\nfark = 11900000 - (12000000 - 1200000)\nsonuc = {\"am\": am, \"ek\": am - 1200000, \"etki\": etki,\
      \ \"dd\": dd, \"art\": art, \"evy\": fark * 0.25,\n         \"kz\": etki * 0.25, \"dkg\": art * 0.25, \"net_art\": art\
      \ * 0.75, \"kz_azalis\": 1000000 - 650000}\n"
