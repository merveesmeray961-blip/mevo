      varlığın veya elden çıkarılan varlığın gerçeğe uygun değerinin güvenilebilir bir şekilde ölçülememesi. İşletme, elden
      çıkarılan varlığı hemen finansal tablo dışı bırakamıyorsa dahi, elde edilen kalem bu şekilde ölçülür. Elde edilen kalemin
      gerçeğe uygun değeri ile ölçülmemesi durumunda, maliyeti elden çıkarılan varlığın defter değeri ile ölçülür.'
