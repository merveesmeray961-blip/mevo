  - olcut: (b) Oransal dağıtım ilkesi (TMS 36.104)
    puan: 2
  - olcut: (b) Taşıtlarda TMS 36.105 sınırı ve 100.000 TL'nin yeniden dağıtımı
    puan: 4
  - olcut: (b) Dağıtım sonrası defter değerleri
    puan: 3
  - olcut: (c) Değer düşüklüğü kaydı
    puan: 2
  - olcut: (c) EVV 550.000 TL ve kaydı
    puan: 3
  - olcut: (d) İptal koşulları ve TMS 36.117 sınırı, şerefiye istisnası
