    (b) 2 numaralı konutların sınıf değişikliğini muhasebeleştiriniz; 2026 yılında kâr veya zarara yansıyacak toplam tutarı
    bulunuz. (5 puan)


    (c) 3 numaralı bina için kullanım değişikliği tarihine kadarki muhasebeleştirmeyi, binanın sahibi tarafından kullanılan
    gayrimenkul olarak ilk kayıt değerini ve 2026 yılı amortismanını hesaplayınız. (5 puan)


    (d) Üç gayrimenkulün 2026 yılı kâr veya zararına toplam etkisini ve diğer kapsamlı gelire yansıyan tutarı bulunuz; 1 numaralı
    binadan doğan özkaynak kalemi ileride bina elden çıkarıldığında nasıl işlem görür, belirtiniz. (5 puan)

    '
  cozum: '**(a) 1 numaralı bina**


    - Kullanım değişikliği, gayrimenkul YAG tanımını karşıladığında ve kullanım değişikliğine ilişkin kanıt bulunduğunda ortaya
    çıkar; kanıt, sahibi tarafından kullanımın sona ermesidir. Yönetimin niyetindeki değişiklik (15.2.2026 kararı) tek başına
    kanıt sağlamaz (par. 57). Bina 31.3.2026''da boşaltılmış ve kiralanmak üzere elde tutulmaktadır; boş bina faaliyet kiralaması
    için elde tutuluyorsa YAG''dır (par. 8(d)). Kira sözleşmesinin sonradan (20.5.2026) imzalanması tarihi değiştirmez. Transfer
    tarihi **31.3.2026**''dır.

    - TMS 16''ya göre defter değeri:


    | Kalem | Tutar (TL) |

    |---|---|

    | Maliyet | 9.000.000 |

    | 2020-2024 amortismanı (5 x 300.000) | (1.500.000) |

    | 31.12.2024 değer düşüklüğü zararı (7.500.000 - 6.000.000) | (1.500.000) |

    | 31.12.2024 defter değeri | 6.000.000 |

    | 2025 amortismanı (6.000.000 / 25) | (240.000) |

    | 2026 ilk üç ay amortismanı (240.000 x 3/12) | (60.000) |

    | **31.3.2026 defter değeri** | **5.700.000** |


    - Değer düşüklüğü ayrılmamış olsaydı: 9.000.000 - 300.000 x 6,25 yıl = **7.125.000 TL**.

    - Gerçeğe uygun değer 7.600.000 TL; fark = 7.600.000 - 5.700.000 = 1.900.000 TL artıştır. Fark, TMS 16''ya göre yapılmış
    bir yeniden değerleme gibi değerlendirilir (par. 62). Artış, daha önceki değer düşüklüğünü tersine çevirdiği ölçüde kâr
    veya zarara yansıtılır; bu tutar, defter değerini değer düşüklüğü hiç ayrılmamış olsaydı ulaşacağı değere (7.125.000)
    getirmek için gereken tutardan (7.125.000 - 5.700.000 = **1.425.000 TL**) fazla olamaz (önceki zarar 1.500.000 TL''dir
    ve sınır olan 1.425.000 TL''nin üzerindedir). Geri kalan **475.000 TL** (1.900.000 - 1.425.000) diğer kapsamlı gelire
    yansıtılır ve yeniden değerleme fazlasını artırır.


    | Hesap (31.3.2026) | Borç | Alacak |

    |---|---|---|

    | Yatırım Amaçlı Gayrimenkuller | 7.600.000 | |

    | 257 Birikmiş Amortismanlar ve değer düşüklüğü | 3.300.000 | |

    | 252 Binalar | | 9.000.000 |

    | Değer düşüklüğü iptali geliri (kâr veya zarar) | | 1.425.000 |

    | 522 Maddi Duran Varlık Yeniden Değerleme Artışları (DKG) | | 475.000 |


    - 31.12.2026''da YAG gerçeğe uygun değer değişimi: 7.900.000 - 7.600.000 = 300.000 TL kazanç kâr veya zarara yansıtılır
    (par. 35); bina amortismana tabi tutulmaz.


    **(b) 2 numaralı konutlar**


    - Stoktan YAG''a transfer, başka bir tarafla faaliyet kiralaması sözleşmesinin başlatılmasıyla olur (par. 57(d)); tarih
    **1.7.2026**''dır. Gerçeğe uygun değer ile önceki defter değeri arasındaki fark kâr veya zarara yansıtılır (par. 63):
    4.600.000 - 4.000.000 = **600.000 TL** gelir.

    - 31.12.2026''da gerçeğe uygun değer değişimi: 4.700.000 - 4.600.000 = 100.000 TL gelir.

    - 2026 toplam kâr veya zarar etkisi = **700.000 TL**.


    **(c) 3 numaralı bina**


    - Sahibi tarafından kullanılmaya başlanması kullanım değişikliğinin kanıtıdır (par. 57(a)); tarih **1.10.2026**''dır.
    Kullanım değişikliği tarihine kadar bina gerçeğe uygun değeriyle ölçülür; 31.12.2025''ten 1.10.2026''ya değişim 6.000.000
    - 5.800.000 = **200.000 TL** kazanç olarak kâr veya zarara yansıtılır (par. 35).

    - Sahibi tarafından kullanılan gayrimenkule transferde sonraki muhasebeleştirmedeki ikame maliyet, kullanım değişikliğinin
    gerçekleştiği tarihteki gerçeğe uygun değerdir (par. 60): **6.000.000 TL**.

    - 2026 amortismanı (1.10.-31.12.): 6.000.000 / 20 x 3/12 = **75.000 TL**.


    **(d) Toplam etki**


    | Kalem | Kâr veya zarar (TL) | DKG (TL) |

    |---|---|---|

    | 1. bina: ilk üç ay amortismanı | (60.000) | |

    | 1. bina: değer düşüklüğü iptali | 1.425.000 | |

    | 1. bina: 31.3.2026 transferinden doğan fazla | | 475.000 |

    | 1. bina: 31.12.2026 gerçeğe uygun değer artışı | 300.000 | |

    | 2. konutlar: transfer farkı + yılsonu değişimi | 700.000 | |

    | 3. bina: 1.10.2026''ya kadarki değer artışı | 200.000 | |

    | 3. bina: üç aylık amortisman | (75.000) | |

    | **Toplam** | **2.490.000** | **475.000** |


    - 1 numaralı binanın elden çıkarılması hâlinde özkaynaktaki yeniden değerleme fazlası dağıtılmamış kârlara (geçmiş yıl
    kârlarına) aktarılabilir; bu aktarım kâr veya zarar aracılığıyla yapılamaz (par. 62(b)(ii)).

    '
