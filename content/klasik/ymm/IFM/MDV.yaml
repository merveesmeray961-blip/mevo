- id: YMM-IFM-MDV-K001
  sinav: ymm
  ders: IFM
  konu: MDV
  kazanimlar:
  - TMS 16 maddi duran varlıklar ve amortisman
  - TMS 36 varlıklarda değer düşüklüğü
  - TMS 40 yatırım amaçlı gayrimenkuller
  - TMS 23 borçlanma maliyetleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '(P) AŞ, yasal defterlerini VUK''a göre tutmakta, yıl sonunda TFRS''ye uygun finansal tablolar için düzeltme kayıtları
    yapmaktadır. 2026 yılına ilişkin bilgiler aşağıdadır. Ertelenmiş vergi dikkate alınmayacaktır; kayıtlar Tekdüzen Hesap
    Planı''na göre yapılacak, THP''de karşılığı olmayan kalemler için ilgili grupta ilave hesap açılabilecektir.


    1. 01.07.2026''da idari bölümde kullanılmak üzere 1.200.000 TL''ye bir jeneratör alınmış ve aynı gün kullanıma hazır hale
    gelmiştir. VUK''ta 5 yıl ömürle tam yıl amortisman (240.000 TL) 770 Genel Yönetim Giderleri hesabına yazılmıştır. TFRS''ye
    göre yararlı ömür 8 yıl, kalıntı değer 240.000 TL''dir (doğrusal yöntem, ay esası).

    2. TFRS defter değeri 700.000 TL olan ambalaj makinesinde değer düşüklüğü belirtisi vardır. Makinenin satış maliyetleri
    düşülmüş gerçeğe uygun değeri 560.000 TL, kullanım değeri 600.000 TL''dir.

    3. 2026 yılı boyunca kesintisiz süren depo binası (özellikli varlık) inşaatı için kullanılan özel kredinin 800.000 TL
    faizi 780 Finansman Giderleri hesabına, kullanılmayan kredi tutarının mevduatta değerlendirilmesinden elde edilen 60.000
    TL faiz 642 Faiz Gelirleri hesabına yazılmıştır.

    4. 02.01.2026''da sermaye kazancı amacıyla 2.000.000 TL''ye alınan arsa 250 Arazi ve Arsalar hesabında izlenmektedir.
    Şirket yatırım amaçlı gayrimenkullerde gerçeğe uygun değer yöntemini seçmiştir; arsanın 31.12.2026 gerçeğe uygun değeri
    2.600.000 TL''dir.


    **İstenenler**


    (a) Jeneratörün TFRS''ye göre 2026 amortismanını hesaplayıp düzeltme kaydını yapınız. (6 puan)


    (b) Ambalaj makinesindeki değer düşüklüğünü hesaplayıp kaydediniz. (5 puan)


    (c) Aktifleştirilecek borçlanma maliyetini hesaplayıp düzeltme kayıtlarını yapınız. (6 puan)


    (d) Arsaya ilişkin sınıflama ve ölçüm kayıtlarını yapınız. (4 puan)


    (e) Düzeltmelerin 2026 dönem kârına net etkisini hesaplayınız. (4 puan)

    '
  cozum: '**(a)** TMS 16 par. 55''e göre amortisman varlık kullanılabilir olduğunda başlar; kalıntı değer düşülür.


    - TFRS amortismanı = (1.200.000 − 240.000) / 8 × 6/12 = 60.000 TL

    - VUK''ta ayrılan 240.000 TL; fazla amortisman = 180.000 TL


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 257 Birikmiş Amortismanlar | 180.000 | |

    | 770 Genel Yönetim Giderleri | | 180.000 |


    **(b)** Geri kazanılabilir tutar, satış maliyetleri düşülmüş GUD (560.000) ile kullanım değerinin (600.000) yüksek olanıdır:
    600.000 TL (TMS 36 par. 18). Değer düşüklüğü = 700.000 − 600.000 = 100.000 TL; kâr veya zarara yazılır (par. 60).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri | 100.000 | |

    | 257 Birikmiş Amortismanlar (değer düşüklüğü alt hesabı) | | 100.000 |


    **(c)** Özellikli varlıkla doğrudan ilişkili borçlanma maliyeti aktifleştirilir (TMS 23 par. 8); özel borçlanmada geçici
    nemalandırma geliri düşülür (par. 12). Aktifleştirilecek tutar = 800.000 − 60.000 = 740.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 258 Yapılmakta Olan Yatırımlar | 800.000 | |

    | 780 Finansman Giderleri | | 800.000 |

    | 642 Faiz Gelirleri | 60.000 | |

    | 258 Yapılmakta Olan Yatırımlar | | 60.000 |


    **(d)** Sermaye kazancı için tutulan arsa yatırım amaçlı gayrimenkuldür (TMS 40 par. 8(a)). GUD yönteminde değişim kâr
    veya zarara yansır (par. 35): 2.600.000 − 2.000.000 = 600.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 25X Yatırım Amaçlı Gayrimenkuller (ilave hesap) | 2.600.000 | |

    | 250 Arazi ve Arsalar | | 2.000.000 |

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar | | 600.000 |


    **(e)** Dönem kârına net etki:


    | Düzeltme | TL |

    |---|---|

    | (a) Fazla amortismanın iptali | +180.000 |

    | (b) Değer düşüklüğü | −100.000 |

    | (c) Faiz giderinin aktifleştirilmesi | +800.000 |

    | (c) Nemalandırma gelirinin maliyetten düşülmesi | −60.000 |

    | (d) YAG GUD kazancı | +600.000 |

    | Net artış | **+1.420.000** |

    '
  puanlama:
  - olcut: TFRS amortismanını kalıntı değer ve kıst esasıyla 60.000 TL bulma
    puan: 3
  - olcut: 257 / 770 düzeltme kaydı (180.000)
    puan: 3
  - olcut: Geri kazanılabilir tutarı yüksek olan ölçütle 600.000 TL belirleme
    puan: 2
  - olcut: 100.000 TL değer düşüklüğü ve 654 / 257 kaydı
    puan: 3
  - olcut: Aktifleştirilecek borçlanma maliyetini 740.000 TL bulma ve dayanağı
    puan: 2
  - olcut: 258 / 780 ve 642 / 258 kayıtları
    puan: 4
  - olcut: Arsayı YAG olarak sınıflama ve GUD kazancını 600.000 TL bulma
    puan: 2
  - olcut: 25X / 250 / 649 kaydı
    puan: 2
  - olcut: Dönem kârına net etkiyi 1.420.000 TL artış olarak hesaplama
    puan: 4
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 55
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 18, 60
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 8, 12
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 8, 35
  - mevzuat: Tekdüzen Hesap Planı
    madde: 250, 257, 258, 642, 649, 654, 770, 780
  gecerlilik:
    baslangic: '2009-01-01'
    bitis: null
  dogrulama:
    python: 'a_tfrs = (1200000 - 240000) / 8 * 6 / 12

      a_fark = 240000 - a_tfrs

      b = 700000 - max(560000, 600000)

      c = 800000 - 60000

      d = 2600000 - 2000000

      net = a_fark - b + c + d

      sonuc = {''tfrs_amortisman'': a_tfrs, ''amortisman_duzeltme'': a_fark, ''deger_dusuklugu'': b, ''aktiflestirme'': c,
      ''gud_kazanci'': d, ''net_etki'': net}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 4, seviye 2
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, klasik 2
  - tarih: '2026-10-19'
