- id: YMM-IFM-MDV-K003
  sinav: ymm
  ders: IFM
  konu: MDV
  kazanimlar:
  - TMS 38 maddi olmayan duran varlıklar ve kuruluş giderleri
  - TMS 36 varlıklarda değer düşüklüğü
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Beta Yazılım AŞ** 2026 yılında yeni bir tıbbi görüntüleme yazılımı projesi yürütmüştür. Proje harcamaları:


    | Dönem / nitelik | Tutar (TL) |

    |---|---|

    | Ocak–Mart: yeni algoritmalar için temel bilimsel araştırma | 800.000 |

    | Nisan: prototip kodlama (geliştirme; teknik uygulanabilirlik henüz kanıtlanmamış) | 300.000 |

    | 1.5.2026–30.9.2026: TMS 38.57 kriterlerinin tamamı karşılandıktan sonraki geliştirme harcamaları | 1.200.000 |

    | Eylül: ürünün tanıtımı için reklam ve personel eğitimi | 400.000 |


    Yazılım 1.10.2026''da kullanıma hazır hâle gelmiş, faydalı ömrü 5 yıl olarak belirlenmiştir (kalıntı değer yok,

    doğrusal yöntem). Proje için 1.6.2026''da bir kamu kurumundan, yazılımın geliştirilmesine ilişkin **600.000 TL hibe**

    alınmıştır; hibenin koşulları yerine getirilmiştir. İşletme varlıklara ilişkin teşvikleri **ertelenmiş gelir**

    yöntemiyle sunmaktadır.


    31.12.2026''da rakip bir firmanın daha gelişmiş bir ürünü piyasaya sürmesi üzerine yazılımın geri kazanılabilir tutarı

    1.050.000 TL olarak belirlenmiştir.


    **İstenenler:**


    (a) Araştırma ve geliştirme aşamalarını ayırt ederek geliştirme maliyetinin aktifleştirilme kriterlerini sayınız.

    (6 puan)


    (b) Harcamaların TFRS''ye göre kayıtlarını yapınız; aktifleştirilecek tutarı ve Nisan ayı harcamasının sonraki dönemde

    aktifleştirilip aktifleştirilemeyeceğini açıklayınız. (6 puan)


    (c) Hibenin kayıtlarını yapınız ve 31.12.2026 itibarıyla finansal durum tablosundaki sunumunu gösteriniz. (5 puan)


    (d) 2026 itfa payını ve değer düşüklüğünü hesaplayıp kaydediniz; projenin 2026 kâr veya zararına toplam etkisini

    bulunuz. (8 puan)

    '
  cozum: "**(a) Araştırma ve geliştirme**\n\nAraştırma aşamasındaki harcamalar **gider** yazılır (TMS 38.54). Geliştirme harcamaları\
    \ ancak işletme şunların\ntamamını kanıtlayabildiğinde aktifleştirilir (TMS 38.57):\n\n1. Varlığın kullanıma veya satışa\
    \ hazır hâle gelmesi için tamamlanmasının teknik olarak uygulanabilir olması,\n2. Varlığı tamamlama ve kullanma veya satma\
    \ niyeti,\n3. Varlığı kullanma veya satma kabiliyeti,\n4. Varlığın muhtemel gelecekteki ekonomik faydayı nasıl sağlayacağı,\n\
    5. Geliştirmeyi tamamlamak için yeterli teknik, finansal ve diğer kaynakların mevcudiyeti,\n6. Geliştirme sürecindeki\
    \ harcamaların güvenilir biçimde ölçülebilmesi.\n\n**(b) Kayıtlar**\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 750\
    \ Araştırma ve Geliştirme Giderleri (800.000 + 300.000) | 1.100.000 | |\n| 263 Araştırma ve Geliştirme Giderleri (geliştirme\
    \ maliyeti) | 1.200.000 | |\n| 760 Pazarlama, Satış ve Dağıtım Giderleri (reklam ve eğitim) | 400.000 | |\n| 102 Bankalar\
    \ | | 2.700.000 |\n\nAktifleştirilen tutar yalnız kriterler karşılandıktan sonraki **1.200.000 TL**'dir (TMS 38.65). Reklam\
    \ ve eğitim\ngiderleri maliyete girmez (TMS 38.67). Nisan ayında gider yazılan 300.000 TL **sonradan varlık maliyetine\n\
    eklenemez** (TMS 38.71).\n\n**(c) Hibe (TMS 20)**\n\nVarlıkla ilgili teşvik ertelenmiş gelir olarak gösterilir ve varlığın\
    \ faydalı ömrü boyunca sistematik biçimde gelire\naktarılır (TMS 20.24, 20.26).\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n\
    | 102 Bankalar | 600.000 | |\n| 480 Gelecek Yıllara Ait Gelirler | | 600.000 |\n| 480 Gelecek Yıllara Ait Gelirler (2026\
