    faizsiz kredi almıştır. Kredi 1.1.2026''da nakden tahsil edilmiş, anapara 31.12.2027''de tek seferde ve nakden geri ödenecektir.
    Aynı gün makine 3.000.000 TL bedelle peşin satın alınmış ve kullanıma hazır hâle gelmiştir. Makinenin faydalı ömrü 10
    yıl olup doğrusal amortismana tabidir, kalıntı değeri yoktur.


    Benzer vadeli, devlet desteği içermeyen kredilerin yıllık piyasa faiz oranı %20''dir (yıllık bileşik; faiz ödemesi vade
    sonundadır). Kredinin faydası, makinenin amortismanıyla karşılanması planlanan maliyetlerle ilişkilidir. Şirket, varlıklara
    ilişkin teşvikler için TMS 20''deki yöntemlerden her ikisini de uygulayabilecek durumdadır. Vergi etkileri dikkate alınmayacaktır.


    **İstenenler**


    (a) Kredinin 1.1.2026''daki ilk defter değerini ve devlet teşvikinin tutarını bulunuz; 1.1.2026 tarihli kayıtları, teşviki
    ertelenmiş gelir olarak sunarak yapınız. (6 puan)


    (b) Kredinin 2026 ve 2027 yıllarındaki faiz giderlerini ve yıl sonu defter değerlerini hesaplayınız. (5 puan)


    (c) Teşviki (i) ertelenmiş gelir olarak ve (ii) makinenin defter değerinden indirerek sunma yöntemlerine göre 2026 yılı
