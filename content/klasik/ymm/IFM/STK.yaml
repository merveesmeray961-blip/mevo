  cozum: '**(a) Maliyet hesaplama yöntemleri (TMS 2 par. 25, 27)**


    *Hareketli ağırlıklı ortalama:*


    | Tarih | Hareket | Adet | Tutar | Bakiye adet | Bakiye tutar | Birim ort. |

    |---|---|---|---|---|---|---|

    | 1.1 | Başlangıç | 1.000 | 8.000.000 | 1.000 | 8.000.000 | 8.000 |

    | 15.3 | Alım | 3.000 | 27.000.000 | 4.000 | 35.000.000 | 8.750 |

    | 10.6 | Satış | (2.500) | (21.875.000) | 1.500 | 13.125.000 | 8.750 |

    | 1.12 | Alım | 1.500 | 15.375.000 | 3.000 | 28.500.000 | 9.500 |

    | 20.12 | Satış | (2.000) | (19.000.000) | 1.000 | 9.500.000 | 9.500 |


    Satışların maliyeti = 21.875.000 + 19.000.000 = **40.875.000 TL**; dönem sonu stok = 1.000 adet × 9.500 = **9.500.000
    TL**.


    *FIFO:* 10.6 satışı: 1.000 × 8.000 + 1.500 × 9.000 = 21.500.000; 20.12 satışı: 1.500 × 9.000 + 500 × 10.250 = 18.625.000.
    Satışların maliyeti = **40.125.000 TL**; dönem sonu stok = 1.000 × 10.250 = **10.250.000 TL**. İki yöntemde de satışların
    maliyeti + dönem sonu stok = 50.375.000 TL (toplam alım maliyeti). Benzer niteliklere sahip tabletlerin tamamı için aynı
    yöntem kullanılır (par. 25).


    **(b) Net gerçekleşebilir değer (par. 9, 29, 31)**


    Birim maliyet 9.500 TL.


    | Bölüm | Adet | NRV (TL/adet) | Maliyet | NRV toplamı | Değer düşüklüğü |

    |---|---|---|---|---|---|

    | Sözleşmeli | 600 | 9.800 − 300 = 9.500 (sözleşme fiyatı esas, par. 31) | 5.700.000 | 5.700.000 | 0 |

    | Sözleşme dışı | 400 | 9.000 − 300 = 8.700 (genel satış fiyatı, par. 31) | 3.800.000 | 3.480.000 | 320.000 |

    | **Toplam** | 1.000 | | 9.500.000 | 9.180.000 | **320.000** |


    Sözleşmeli kısmın NRV''si maliyete eşit olduğundan indirgeme gerekmez; sözleşmede belirtilen miktarın elde tutulan stoktan
    az olması nedeniyle fazla kalan kısmın NRV''si sözleşme fiyatıyla değil genel satış fiyatıyla belirlenir. Stokun defter
    değeri = 9.500.000 − 320.000 = **9.180.000 TL**. Kayıt (31.12.2026):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri (stok değer düşüklüğü gideri) | 320.000 | |

    | 158 Stok Değer Düşüklüğü Karşılığı (−) | | 320.000 |


    **(c) Perakende yöntemi (par. 21, 22)**


    Perakende yöntemi, diğer yöntemlerin uygulanmasının mümkün olmadığı, benzer kâr marjlarına sahip ve hızlı değişen çok
    sayıda kalemden oluşan stoklarda ve sonuçların maliyete yakın olması koşuluyla kullanılabilir. Maliyet = satış değeri
    − brüt kâr marjı = 3.200.000 × (1 − 0,3) = **2.240.000 TL** (kullanılacak marj, gerçek satış fiyatının altında fiyatlandırılmış
    stoklar da dikkate alınarak belirlenir).


    **(d) 31.12.2027 (par. 33, 34)**


    Sözleşme dışı 400 adedin defter değeri 3.480.000 TL (8.700 TL/adet)''dir. Yeni NRV = 10.000 − 300 = 9.700 TL/adet, maliyetin
    (9.500 TL) üstündedir. Defter değeri maliyet ile NRV''nin düşüğü olacağından 400 × 9.500 = 3.800.000 TL''ye yükseltilir;
    iptal edilecek tutar önceki indirgenen tutarla sınırlıdır: **320.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 158 Stok Değer Düşüklüğü Karşılığı (−) | 320.000 | |

    | 644 Konusu Kalmayan Karşılıklar (gider yazılan stok tutarının azalışı) | | 320.000 |


    NRV''nin maliyeti aşan kısmı (80.000 TL) kayda alınmaz.

    '
