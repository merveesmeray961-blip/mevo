- id: YMM-IFM-STK-K001
  sinav: ymm
  ders: IFM
  konu: STK
  kazanimlar:
  - TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  - stok değer düşüklüğü
  - TMS 41 tarımsal faaliyetler
  - TMS 20 devlet teşvikleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Hayvancılık ve süt ürünleri üretimi yapan (R) AŞ yasal kayıtlarını VUK''a göre tutmakta, yıl sonunda TFRS''ye uygun
    finansal tablolar için düzeltme kayıtları yapmaktadır. 2026 yılına ilişkin bilgiler aşağıdadır. Ertelenmiş vergi dikkate
    alınmayacaktır; kayıtlar Tekdüzen Hesap Planı''na göre yapılacak, THP''de karşılığı olmayan kalemler için ilgili grupta
    ilave hesap açılabilecektir.


    1. Şirket 01.10.2026''da ambalaj hammaddesi ithal etmiştir. Hammaddenin peşin fiyatı 2.000.000 TL olup satıcıya 31.12.2026''da
    2.150.000 TL ödenmiştir (vade farkı normal kredi koşullarını yansıtmaktadır). Navlun 120.000 TL, gümrük vergisi 80.000
    TL, gümrükten fabrika deposuna nakliye 30.000 TL''dir. VUK kaydında indirilecek KDV dışındaki tüm tutarlar 150 İlk Madde
    ve Malzeme hesabına yazılmıştır. Hammaddenin tamamı yıl sonunda stoktadır.

    2. Hammadde fiyatlarındaki düşüş nedeniyle bu hammaddenin kullanılacağı mamullerin maliyetinin net gerçekleşebilir değerini
    aşacağı anlaşılmıştır. Hammaddenin 31.12.2026 yenileme maliyeti 2.050.000 TL olup net gerçekleşebilir değerin en iyi ölçüsüdür.

    3. Şirketin sağmal koyun sürüsünün satış maliyetleri düşülmüş gerçeğe uygun değeri 01.01.2026''da 900.000 TL, 31.12.2026''da
    1.150.000 TL''dir. Yıl içinde alım, satım veya ölüm olmamıştır; VUK kayıtlarında sürü maliyet bedeliyle izlenmekte olup
    2026 yılı için amortisman ayrılmamıştır. Önceki yıllara ait TFRS düzeltmeleri açılış bakiyelerine yansıtılmış olup sürü
    01.01.2026 itibarıyla TFRS kayıtlarında 900.000 TL ile yer almaktadır.

    4. 01.01.2026''da 1.200.000 TL''ye alınıp aynı gün kullanıma hazır hale gelen süt işleme makinesi için 300.000 TL devlet
    hibesi tahsil edilmiş ve tamamı 649 Faaliyetle İlgili Diğer Gelir ve Karlar hesabına yazılmıştır. Makinenin yararlı ömrü
    6 yıl, kalıntı değeri sıfırdır. Şirket TFRS''de teşviki ertelenmiş gelir yöntemiyle sunmaktadır; hibe koşullarına uyulacağına
    dair makul güvence vardır.


    **İstenenler**


    (a) Hammaddenin TFRS''ye göre maliyetini hesaplayıp düzeltme kaydını yapınız. (6 puan)


    (b) Hammadde için değer düşüklüğünü hesaplayıp kaydediniz. (5 puan)


    (c) Koyun sürüsüne ilişkin TMS 41 kaydını yapınız. (5 puan)


    (d) Hibeye ilişkin TFRS düzeltme kaydını yapınız. (5 puan)


    (e) Düzeltmelerin 2026 dönem kârına net etkisini hesaplayınız. (4 puan)

    '
  cozum: '**(a)** TMS 2 par. 10-11''e göre maliyet; satın alma fiyatı, ithalat vergileri, nakliye ve stoku mevcut konumuna
    getirme maliyetleridir. Vadeli alımdaki finansman bileşeni finansman dönemi boyunca faiz gideridir (par. 18); finansman
    dönemi (Ekim-Aralık) 2026 içinde tamamlandığından vade farkının tamamı 2026 gideridir.


    - TFRS maliyeti = 2.000.000 + 120.000 + 80.000 + 30.000 = 2.230.000 TL

    - VUK kaydı = 2.150.000 + 120.000 + 80.000 + 30.000 = 2.380.000 TL; fark 150.000 TL


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 780 Finansman Giderleri | 150.000 | |

    | 150 İlk Madde ve Malzeme | | 150.000 |


    **(b)** TMS 2 par. 32''ye göre hammadde fiyatındaki düşüş mamul maliyetinin NGD''yi aşacağını gösterdiğinden hammadde
    NGD''ye indirgenir; yenileme maliyeti en iyi ölçüdür. Değer düşüklüğü = 2.230.000 − 2.050.000 = 180.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri | 180.000 | |

    | 158 Stok Değer Düşüklüğü Karşılığı | | 180.000 |


    **(c)** Canlı varlıklar her dönem sonunda satış maliyetleri düşülmüş GUD ile ölçülür (TMS 41 par. 12); değişim kâr veya
    zarardadır (par. 26). Kazanç = 1.150.000 − 900.000 = 250.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 25X Canlı Varlıklar (ilave hesap) | 250.000 | |

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar | | 250.000 |


    **(d)** TMS 20 par. 12 ve 26''ya göre varlık teşviki ömür boyunca sistematik olarak gelire alınır: yıllık 300.000 / 6
    = 50.000 TL. 2026 geliri 50.000 TL olmalı; 649''daki 250.000 TL fazla gelir ertelenir: 2027''ye ait 50.000 TL kısa vadeli,
    2028-2031''e ait 200.000 TL uzun vadelidir.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar | 250.000 | |

    | 380 Gelecek Aylara Ait Gelirler | | 50.000 |

    | 480 Gelecek Yıllara Ait Gelirler | | 200.000 |


    **(e)** Dönem kârına net etki:


    | Düzeltme | TL |

    |---|---|

    | (a) Vade farkının faiz gideri yazılması | −150.000 |

    | (b) Stok değer düşüklüğü | −180.000 |

    | (c) Canlı varlık GUD kazancı | +250.000 |

    | (d) Hibe gelirinin ertelenmesi | −250.000 |

    | Net etki | **−330.000** |

    '
  puanlama:
  - olcut: TFRS maliyetini 2.230.000 TL bulma ve vade farkının faiz gideri olduğunu belirtme
    puan: 3
  - olcut: 780 / 150 düzeltme kaydı (150.000)
    puan: 3
  - olcut: TMS 2 par. 32'ye göre hammaddenin indirgenmesi ve 180.000 TL'nin hesaplanması
    puan: 3
  - olcut: 654 / 158 kaydı
    puan: 2
  - olcut: Canlı varlığın satış maliyetleri düşülmüş GUD ile ölçülmesi ve 250.000 TL kazanç
    puan: 3
  - olcut: 25X / 649 kaydı
    puan: 2
  - olcut: 2026 hibe gelirini 50.000 TL bulma ve gelir yaklaşımı dayanağı
    puan: 2
  - olcut: 649 / 380 / 480 kaydı (250.000; 50.000; 200.000)
    puan: 3
  - olcut: Net etkiyi 330.000 TL azalış olarak hesaplama
    puan: 4
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 10, 11, 18, 32
  - mevzuat: TMS 41 Tarımsal Faaliyetler
    madde: par. 12, 26
  - mevzuat: TMS 20 Devlet Teşviklerinin Muhasebeleştirilmesi ve Devlet Yardımlarının Açıklanması
    madde: par. 12, 24, 26
  - mevzuat: Tekdüzen Hesap Planı
    madde: 150, 158, 380, 480, 649, 654, 780
  gecerlilik:
    baslangic: '2016-01-01'
    bitis: null
  dogrulama:
    python: 'maliyet = 2000000 + 120000 + 80000 + 30000

      vuk = 2150000 + 120000 + 80000 + 30000

      faiz = vuk - maliyet

      ddus = maliyet - 2050000

      canli = 1150000 - 900000

      tesvik_gelir = 300000 / 6

      erteleme = 300000 - tesvik_gelir

      net = -faiz - ddus + canli - erteleme

      sonuc = {''tfrs_maliyet'': maliyet, ''faiz_gideri'': faiz, ''deger_dusuklugu'': ddus, ''canli_varlik_kazanci'': canli,
      ''ertelenen_gelir'': erteleme, ''net_etki'': net}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, klasik 3
  - tarih: '2026-10-19'
    kim: hakem
    ne: klasik hakem notlarına göre düzeltildi
    neden: yeniden hakeme
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-STK-K002
  sinav: ymm
  ders: IFM
  konu: STK
  kazanimlar:
  - TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  - stok değer düşüklüğü
  - TMS 41 tarımsal faaliyetler
  - TMS 20 devlet teşvikleri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Karadeniz Tarım AŞ** fındık bahçesi işletmekte ve fındık kırarak iç fındık satmaktadır. 2026 bilgileri:\n\n- Fındık\
    \ ağaçlarının (bahçe) maliyeti 20.000.000 TL, faydalı ömrü 25 yıldır (doğrusal, kalıntı değer yok).\n- Ağustos 2026'da\
    \ 100.000 kg kabuklu fındık hasat edilmiştir. Hasat noktasında gerçeğe uygun değer 120 TL/kg, satış\n  maliyetleri 5 TL/kg'dır.\
    \ Dönem başında ağaçlar üzerinde ürün bulunmadığından ürünün değeri hasatta ölçülmüştür.\n  Hasat işçiliği 2.000.000 TL'dir.\n\
    - Hasat edilen fındığın 60.000 kg'ı kırılarak 30.000 kg iç fındık elde edilmiştir (kabuk oranı normaldir). Kırma\n  işleminde\
    \ direkt işçilik 600.000 TL, değişken genel üretim gideri 300.000 TL, sabit genel üretim gideri\n  800.000 TL'dir. Kırma\
    \ tesisinin normal kapasitesi 80.000 kg kabuklu fındıktır.\n- Depoya su basması sonucu 1.000 kg iç fındık kullanılamaz\
    \ hâle gelmiştir (olağan dışı kayıp).\n- 20.000 kg iç fındık 400 TL/kg'dan satılmıştır. Üretim sonrası depolama gideri\
    \ 150.000 TL'dir.\n- 31.12.2026'da iç fındığın net gerçekleşebilir değeri 300 TL/kg, kabuklu fındığın 105 TL/kg'dır.\n\
    - Devletten koşulsuz olarak alan bazlı 300.000 TL fındık gelir desteği hak edilmiştir.\n\n**İstenenler:**\n\n(a) Fındık\
    \ ağaçlarının ve fındığın hangi standarda göre muhasebeleştirileceğini açıklayınız; hasat edilen ürünün\nilk ölçümünü\
    \ yaparak kaydediniz. (6 puan)\n\n(b) İç fındığın birim maliyetini TMS 2'ye göre hesaplayınız; maliyete girmeyen kalemleri\
    \ belirtiniz. (7 puan)\n\n(c) Dönem sonu stok değerlemesini yapınız ve gerekli kayıtları gösteriniz. (6 puan)\n\n(d) Gelir\
    \ desteğinin muhasebeleştirilmesini açıklayınız ve bu faaliyetin 2026 kâr veya zararına toplam etkisini\nhesaplayınız.\
    \ (6 puan)\n"
  cozum: "**(a) Sınıflandırma ve hasat**\n\nFındık ağaçları **taşıyıcı bitki** olduğundan TMS 16 kapsamındadır (TMS 41.1,\
    \ 41.5A); yıllık amortisman\n20.000.000 / 25 = **800.000 TL**. Ağaç üzerinde yetişen ürün canlı varlıktır, hasat edilen\
    \ fındık **tarımsal üründür**\nve hasat noktasında satış maliyetleri düşülmüş gerçeğe uygun değerle ölçülür (TMS 41.13,\
    \ 41.32). Bu tutar TMS 2'ye göre\nstok maliyetidir (TMS 2.20).\n\nİlk ölçüm = 100.000 × (120 − 5) = **11.500.000 TL**;\
    \ kazanç dönem kâr veya zararına alınır (TMS 41.28):\n153/151 Stoklar (kabuklu fındık) borç / 649 Diğer Olağan Gelir ve\
    \ Kârlar (tarımsal ürün kazancı) alacak 11.500.000.\nHasat işçiliği (2.000.000 TL) ve bahçe amortismanı dönem gideridir.\n\
    \n**(b) İç fındık maliyeti**\n\nSabit genel üretim giderleri normal kapasiteye göre dağıtılır (TMS 2.13): 800.000 × 60.000\
    \ / 80.000 = 600.000 TL;\nkapasite altı **200.000 TL** dönem gideridir.\n\n| Maliyet unsuru | TL |\n|---|---|\n| Kabuklu\
    \ fındık (60.000 × 115) | 6.900.000 |\n| Direkt işçilik | 600.000 |\n| Değişken GÜG | 300.000 |\n| Sabit GÜG (dağıtılan)\
    \ | 600.000 |\n| **Toplam** | **8.400.000** |\n| **Birim maliyet (30.000 kg)** | **280 TL/kg** |\n\nMaliyete girmeyenler\
    \ (TMS 2.16): olağan dışı fire (1.000 kg × 280 = **280.000 TL**), üretim sonrası depolama\n(**150.000 TL**) ve kapasite\
    \ altı sabit GÜG.\n\n**(c) Dönem sonu değerleme**\n\nStoklar maliyet ile net gerçekleşebilir değerden düşük olanla ölçülür\
    \ (TMS 2.9).\n\n| Stok | Miktar (kg) | Maliyet | NGD | Değer |\n|---|---|---|---|---|\n| İç fındık | 9.000 | 280 | 300\
    \ | 2.520.000 (maliyet) |\n| Kabuklu fındık | 40.000 | 115 | 105 | 4.200.000 (NGD) |\n\n- İç fındık için değer düşüklüğü\
    \ yoktur. Kabuklu fındıkta değer düşüklüğü = 40.000 × (115 − 105) = **400.000 TL**:\n  654 Karşılık Giderleri borç / 158\
    \ Stok Değer Düşüklüğü Karşılığı alacak (TMS 2.34).\n- Satış: 600 alacak 8.000.000; 620 borç (20.000 × 280) **5.600.000**\
    \ / 152 alacak.\n- Olağan dışı fire: 689 Diğer Olağandışı Gider ve Zararlar borç / 152 alacak 280.000.\n\n**(d) Destek\
    \ ve toplam etki**\n\nKoşulsuz devlet desteği, taşıyıcı bitki TMS 16 kapsamında olduğundan TMS 20'ye göre değerlendirilir;\
    \ gelire ilişkin\nteşvik olarak hak edildiği dönemde **gelir** yazılır (TMS 20.20): 136/127 alacak borç / 649 alacak 300.000.\n\
    \n| Kâr veya zarar kalemi | TL |\n|---|---|\n| Hasat kazancı | 11.500.000 |\n| Hasat işçiliği | (2.000.000) |\n| Bahçe\
    \ amortismanı | (800.000) |\n| Gelir desteği | 300.000 |\n| Kapasite altı sabit GÜG | (200.000) |\n| Olağan dışı fire\
    \ | (280.000) |\n| Depolama | (150.000) |\n| Kabuklu fındık değer düşüklüğü | (400.000) |\n| Satış brüt kârı (8.000.000\
    \ − 5.600.000) | 2.400.000 |\n| **Toplam** | **10.370.000** |\n"
  puanlama:
  - olcut: (a) Taşıyıcı bitki (TMS 16) / tarımsal ürün (TMS 41) ayrımı
    puan: 3
  - olcut: (a) Hasat ölçümü 11.500.000 TL ve kaydı
    puan: 3
  - olcut: (b) Sabit GÜG'nin normal kapasiteye göre dağıtımı
    puan: 3
  - olcut: (b) Birim maliyet 280 TL/kg ve maliyete girmeyen kalemler
    puan: 4
  - olcut: (c) Düşük olanla değerleme ve 400.000 TL değer düşüklüğü
    puan: 4
  - olcut: (c) Satış maliyeti ve fire kayıtları
    puan: 2
  - olcut: (d) Gelir desteğinin TMS 20 ile gelir yazılması
    puan: 2
  - olcut: (d) Toplam K/Z etkisi 10.370.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 9, 13, 16, 20, 34
    alinti: Sabit genel üretim giderleri, üretim tesislerinin normal kapasitesi esas alınarak dönüştürme maliyetlerine
  - mevzuat: TMS 41 Tarımsal Faaliyetler
    madde: par. 1, 5A, 13, 28, 32
    alinti: Bir işletmenin canlı varlıklarından elde edilen tarımsal ürünler, hasat noktasında, gerçeğe uygun
  - mevzuat: TMS 20 Devlet Teşviklerinin Muhasebeleştirilmesi
    madde: par. 20
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "hasat = 100000 * (120 - 5)\nsgug = 800000 * 60000 / 80000\ntop = 60000 * 115 + 600000 + 300000 + sgug\nbirim\
      \ = top / 30000\ndd = 40000 * (115 - 105)\nsmm = 20000 * birim\nkz = hasat - 2000000 - 800000 + 300000 - (800000 - sgug)\
      \ - 1000 * birim - 150000 - dd + 8000000 - smm\nsonuc = {\"am\": 800000, \"hasat\": hasat, \"sgug\": sgug, \"atil\"\
      : 800000 - sgug, \"top\": top, \"birim\": birim,\n         \"fire\": 1000 * birim, \"ic\": 9000 * birim, \"kab\": 40000\
      \ * 105, \"dd\": dd, \"smm\": smm, \"kz\": kz}\n"
