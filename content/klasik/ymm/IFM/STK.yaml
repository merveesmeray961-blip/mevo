  soru: 'Hayvancılık ve süt ürünleri üretimi yapan (R) AŞ yasal kayıtlarını VUK''a göre tutmakta, yıl sonunda TFRS''ye uygun
    finansal tablolar için düzeltme kayıtları yapmaktadır. 2026 yılına ilişkin bilgiler aşağıdadır. Ertelenmiş vergi dikkate
    alınmayacaktır; kayıtlar Tekdüzen Hesap Planı''na göre yapılacak, THP''de karşılığı olmayan kalemler için ilgili grupta
    ilave hesap açılabilecektir.


    1. Şirket 01.10.2026''da ambalaj hammaddesi ithal etmiştir. Hammaddenin peşin fiyatı 2.000.000 TL olup satıcıya 31.12.2026''da
    2.150.000 TL ödenmiştir (vade farkı normal kredi koşullarını yansıtmaktadır). Navlun 120.000 TL, gümrük vergisi 80.000
    TL, gümrükten fabrika deposuna nakliye 30.000 TL''dir. VUK kaydında indirilecek KDV dışındaki tüm tutarlar 150 İlk Madde
    ve Malzeme hesabına yazılmıştır. Hammaddenin tamamı yıl sonunda stoktadır.

    2. Hammadde fiyatlarındaki düşüş nedeniyle bu hammaddenin kullanılacağı mamullerin maliyetinin net gerçekleşebilir değerini
    aşacağı anlaşılmıştır. Hammaddenin 31.12.2026 yenileme maliyeti 2.050.000 TL olup net gerçekleşebilir değerin en iyi ölçüsüdür.

    3. Şirketin sağmal koyun sürüsünün satış maliyetleri düşülmüş gerçeğe uygun değeri 01.01.2026''da 900.000 TL, 31.12.2026''da
    1.150.000 TL''dir. Yıl içinde alım, satım veya ölüm olmamıştır; VUK kayıtlarında sürü maliyet bedeliyle izlenmekte olup
    2026 yılı için amortisman ayrılmamıştır. Önceki yıllara ait TFRS düzeltmeleri açılış bakiyelerine yansıtılmış olup sürü
    01.01.2026 itibarıyla TFRS kayıtlarında 900.000 TL ile yer almaktadır.

    4. 01.01.2026''da 1.200.000 TL''ye alınıp aynı gün kullanıma hazır hale gelen süt işleme makinesi için 300.000 TL devlet
    hibesi tahsil edilmiş ve tamamı 649 Faaliyetle İlgili Diğer Gelir ve Karlar hesabına yazılmıştır. Makinenin yararlı ömrü
    6 yıl, kalıntı değeri sıfırdır. Şirket TFRS''de teşviki ertelenmiş gelir yöntemiyle sunmaktadır; hibe koşullarına uyulacağına
    dair makul güvence vardır.


    **İstenenler**


    (a) Hammaddenin TFRS''ye göre maliyetini hesaplayıp düzeltme kaydını yapınız. (6 puan)


    (b) Hammadde için değer düşüklüğünü hesaplayıp kaydediniz. (5 puan)


    (c) Koyun sürüsüne ilişkin TMS 41 kaydını yapınız. (5 puan)


    (d) Hibeye ilişkin TFRS düzeltme kaydını yapınız. (5 puan)


    (e) Düzeltmelerin 2026 dönem kârına net etkisini hesaplayınız. (4 puan)

    '
  cozum: '**(a)** TMS 2 par. 10-11''e göre maliyet; satın alma fiyatı, ithalat vergileri, nakliye ve stoku mevcut konumuna
    getirme maliyetleridir. Vadeli alımdaki finansman bileşeni finansman dönemi boyunca faiz gideridir (par. 18); finansman
    dönemi (Ekim-Aralık) 2026 içinde tamamlandığından vade farkının tamamı 2026 gideridir.


    - TFRS maliyeti = 2.000.000 + 120.000 + 80.000 + 30.000 = 2.230.000 TL

    - VUK kaydı = 2.150.000 + 120.000 + 80.000 + 30.000 = 2.380.000 TL; fark 150.000 TL


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 780 Finansman Giderleri | 150.000 | |

    | 150 İlk Madde ve Malzeme | | 150.000 |


    **(b)** TMS 2 par. 32''ye göre hammadde fiyatındaki düşüş mamul maliyetinin NGD''yi aşacağını gösterdiğinden hammadde
    NGD''ye indirgenir; yenileme maliyeti en iyi ölçüdür. Değer düşüklüğü = 2.230.000 − 2.050.000 = 180.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 654 Karşılık Giderleri | 180.000 | |

    | 158 Stok Değer Düşüklüğü Karşılığı | | 180.000 |


    **(c)** Canlı varlıklar her dönem sonunda satış maliyetleri düşülmüş GUD ile ölçülür (TMS 41 par. 12); değişim kâr veya
    zarardadır (par. 26). Kazanç = 1.150.000 − 900.000 = 250.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 25X Canlı Varlıklar (ilave hesap) | 250.000 | |

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar | | 250.000 |


    **(d)** TMS 20 par. 12 ve 26''ya göre varlık teşviki ömür boyunca sistematik olarak gelire alınır: yıllık 300.000 / 6
    = 50.000 TL. 2026 geliri 50.000 TL olmalı; 649''daki 250.000 TL fazla gelir ertelenir: 2027''ye ait 50.000 TL kısa vadeli,
    2028-2031''e ait 200.000 TL uzun vadelidir.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 649 Faaliyetle İlgili Diğer Gelir ve Karlar | 250.000 | |

    | 380 Gelecek Aylara Ait Gelirler | | 50.000 |

    | 480 Gelecek Yıllara Ait Gelirler | | 200.000 |


    **(e)** Dönem kârına net etki:


    | Düzeltme | TL |

    |---|---|

    | (a) Vade farkının faiz gideri yazılması | −150.000 |

    | (b) Stok değer düşüklüğü | −180.000 |

    | (c) Canlı varlık GUD kazancı | +250.000 |

    | (d) Hibe gelirinin ertelenmesi | −250.000 |

    | Net etki | **−330.000** |

    '
