- id: YMM-IFM-STK-K006
  sinav: ymm
  ders: IFM
  konu: STK
  kazanimlar:
  - tarımsal faaliyetlere ilişkin devlet teşvikleri (koşullu ve koşulsuz)
  - varlıklara ilişkin devlet teşviklerinin sunumu ve geri ödenmesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Toros Hayvancılık AŞ, küçükbaş hayvan yetiştiriciliği yapmaktadır. Sürüdeki koyunlar gerçeğe uygun değerlerinden satış
    maliyetleri düşülerek ölçülmektedir. Şirket 2026 yılında aşağıdaki devlet desteklerini almıştır:


    1. 15.2.2026''da 400 baş koyun için baş başına 500 TL tutarında, hiçbir koşula bağlanmamış hayvancılık desteği şirket
    lehine kesinleşmiş (alacak haline gelmiş) ve 30.5.2026''da tahsil edilmiştir.

    2. 1.4.2026''da 800.000 TL tutarında destek tahsil edilmiştir. Destek, şirketin aynı bölgede en az 4 yıl boyunca küçükbaş
    hayvancılığa devam etmesi koşuluna bağlıdır; 4 yıldan kısa süre faaliyet gösterilirse desteğin tamamı iade edilecektir.
    Şirketin faaliyete devam etme niyeti ve imkânı vardır.

    3. 1.7.2026''da 2.400.000 TL''ye satın alınan ve aynı gün kullanıma hazır hâle gelen traktör için maliyetinin %20''si
    olan 480.000 TL hibe aynı gün tahsil edilmiştir (koşullar yerine getirilmiştir). Traktör TMS 16''ya göre maliyet modeliyle
    izlenmekte, 8 yıl faydalı ömür boyunca doğrusal amortismana tabi tutulmakta ve kalıntı değeri bulunmamaktadır.

    4. 1.10.2026''da zeytin fidanı (taşıyıcı bitki) alımı için 300.000 TL hibe tahsil edilmiştir.


    TMS 20 kapsamındaki varlık hibelerini şirket, ertelenmiş gelir yöntemiyle sunmayı veya varlığın defter değerinden indirmeyi
    seçebilmektedir. Değer düşüklüğü bulunmamaktadır.


    **İstenenler**


    (a) Dört desteğin her birinin hangi standart (TMS 41 veya TMS 20) kapsamında muhasebeleştirileceğini gerekçesiyle belirtiniz.
    (6 puan)


    (b) 1. ve 2. desteklerin 2026 yılı kâr veya zararına etkisini ve 31.12.2026 finansal tablolarına yansımasını gösteriniz.
    2. destekte koşul, "geçen süreye orantılı olarak desteğin bir kısmının alıkonulmasına izin verecek" biçimde olsaydı 2026
    etkisi ne olurdu? (7 puan)


    (c) Traktör hibesini her iki sunum yöntemine göre 2026 yılı için muhasebeleştiriniz; 31.12.2026''da traktörün ve (varsa)
    ertelenmiş gelirin tutarlarını bulunuz. (6 puan)


    (d) Şirketin koşulları ihlal etmesi üzerine traktör hibesinin tamamı 1.7.2028''de iade edilmiştir. Her iki yöntemde iadenin
    kaydını yapınız ve 2028 kâr veya zararına etkisini bulunuz. (6 puan)

    '
  cozum: '**(a) Standartların belirlenmesi (TMS 41 par. 2(c), 34-38; TMS 20 par. 2(d))**


    | Destek | Standart | Gerekçe |

    |---|---|---|

    | 1. Baş başına destek | TMS 41 par. 34 | GUD − satış maliyeti ile ölçülen canlı varlığa ilişkin **koşulsuz** teşvik;
    alacak haline geldiğinde kâr veya zarara alınır |

    | 2. Koşullu destek | TMS 41 par. 35-36 | Aynı ölçüm yöntemindeki canlı varlığa ilişkin **koşullu** teşvik; yalnız koşullar
    karşılandığında kâr veya zarara alınır |

    | 3. Traktör hibesi | TMS 20 | Traktör canlı varlık değil, TMS 16 varlığıdır |

    | 4. Zeytin fidanı hibesi | TMS 20 | Taşıyıcı bitkiler TMS 16 kapsamındadır; taşıyıcı bitkilerle ilgili teşvikler TMS
    20''ye tabidir (TMS 41 par. 2(c)) |


    **(b) 2026 etkisi**


    1. Teşvik 15.2.2026''da alacak haline geldiğinden 200.000 TL (400 × 500) o tarihte gelir yazılır: Dr Diğer Alacaklar 200.000
    / Cr Tarımsal teşvik geliri 200.000; tahsilde Dr Bankalar / Cr Diğer Alacaklar.

    2. Tahsil edilen 800.000 TL, 4 yıllık süre (31.3.2030) dolmadıkça kâr veya zarara alınmaz: Dr Bankalar 800.000 / Cr Ertelenmiş
    Gelir (koşullu teşvik yükümlülüğü) 800.000. 2026 kâr/zarar etkisi **0**; 31.12.2026''da 800.000 TL ertelenmiş gelir/yükümlülük
    olarak sunulur (par. 36''daki örnekle aynı).


    2026 toplam etki = 200.000 + 0 = **200.000 TL**.


    *Alternatif koşul:* zaman geçtikçe alıkonulabiliyorsa teşvik zaman geçtikçe kâr veya zarara alınır (par. 36): 800.000
    × 9 / (4 × 12) = **150.000 TL**; 2026 toplam etki 350.000 TL, ertelenmiş gelir 650.000 TL olurdu.


    **(c) Traktör hibesi (TMS 20 par. 24-27)**


    | | Ertelenmiş gelir yöntemi | Defter değerinden indirme |

    |---|---|---|

    | 1.7.2026 | Dr Traktör 2.400.000; Cr Bankalar 2.400.000. Dr Bankalar 480.000; Cr Ertelenmiş Gelir 480.000 | Dr Traktör
    1.920.000; Cr Bankalar 1.920.000 (net) |

    | 2026 amortisman (6 ay) | 2.400.000 / 8 × 6/12 = 150.000 | 1.920.000 / 8 × 6/12 = 120.000 |

    | 2026 hibe geliri | 480.000 / 8 × 6/12 = 30.000 | (amortisman azalışı ile yansır) |

    | Net kâr/zarar etkisi | 150.000 − 30.000 = 120.000 gider | 120.000 gider |

    | 31.12.2026 traktör | 2.250.000 | 1.800.000 |

    | 31.12.2026 ertelenmiş gelir | 450.000 (480.000 − 30.000) | 0 |


    Her iki yöntemde net sonuç aynıdır. Nakit akış tablosunda hibe ve satın alma, defter değerinden indirilse bile ayrı kalemler
    olarak gösterilir (par. 28).


    **(d) Hibenin iadesi, 1.7.2028 (TMS 20 par. 32)**


    Varlığa ilişkin teşvik iadesi muhasebe tahmininde değişiklik olarak ele alınır. Teşvik alınmamış olsaydı önceki dönemlerde
    kâr veya zarara yansıyacak birikmiş amortisman tutarı iade anında kâr veya zarara yazılır. İki yıl geçmiştir.


    *Ertelenmiş gelir yöntemi:* ertelenmiş gelir bakiyesi = 480.000 − 60.000 × 2 = 360.000 TL. İade 480.000 TL olduğundan
    bakiye aşılır; aşan kısım (120.000) doğrudan kâr veya zarara yazılır.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Ertelenmiş Gelir | 360.000 | |

    | Hibe iadesi gideri (kâr veya zarar) | 120.000 | |

    | Bankalar | | 480.000 |


    *Defter değerinden indirme yöntemi:* traktörün defter değeri iade tutarı kadar artırılır: Dr Traktör 480.000 / Cr Bankalar
    480.000; teşvik alınmasaydı önceki dönemlerde yazılacak ek amortisman 480.000 / 8 × 2 = 120.000 TL hemen gider yazılır:
    Dr Amortisman gideri 120.000 / Cr Birikmiş amortisman 120.000.


    2028 kâr veya zararına etki: iki yöntemde de **120.000 TL** gider (cari yıl amortisman/ gelir etkileri ayrıca). Traktörün
    defter değeri iade sonrası iki yöntemde de aynıdır (1.440.000 + 480.000 − 120.000 = 1.800.000 TL).

    '
