    - 31.12.2026''da kalan 100 ton buğdayın piyasa fiyatı 9.200 TL/ton, satış maliyeti 300 TL/ton''dur.

    - Şirket ayrıca hasat ettiği buğdayın bir kısmını kendi değirmeninde una dönüştürmeyi planlamaktadır.


    **İstenenler**


    (a) 31.12.2025''te ayakta ürünün finansal durum tablosundaki tutarını belirleyiniz; kesin satış sözleşmesinin ölçüme etkisini
    açıklayınız ve gerekli kaydı yapınız. (5 puan)


    (b) Hasat anında yapılacak muhasebe kaydını gerekçesiyle gösteriniz; 2026 kâr veya zararına yansıyacak kazancı bulunuz.
    (7 puan)


    (c) 2026 yılındaki satışlara ve 31.12.2026''daki stok ölçümüne ilişkin kayıtları yapınız. (6 puan)


    (d) 2026 yılında bu buğday ürününden kâr veya zarara yansıyan net tutarı bulunuz; arazi, ayakta buğday, hasat edilmiş
    buğday ve una dönüştürme faaliyetinin hangi standart kapsamında olduğunu belirtiniz. (7 puan)

    '
  cozum: '**(a) 31.12.2025 (TMS 41 par. 5A(c), 12, 16)**


    Buğday yıllık mahsul olduğundan taşıyıcı bitki değildir (par. 5A(c)); TMS 41 kapsamında canlı varlıktır. Canlı varlık
    ilk muhasebeleştirildiği tarihte gerçeğe uygun değerinden satış maliyetleri düşülerek ölçülür: 1.800.000 − 100.000 = **1.700.000
    TL**. Gerçeğe uygun değer cari piyasa koşullarını yansıtır; gelecekteki satış sözleşmesi nedeniyle düzeltilmez (par. 16).
    Bu nedenle sözleşme fiyatı ile piyasa fiyatı arasındaki fark (200 × (10.800 − 10.000) = 160.000 TL) ölçüme yansıtılmaz;
    sözleşme ekonomik açıdan dezavantajlı olmadığı için TMS 37 karşılığı da gerekmez. İlk muhasebeleştirmedeki kazanç kâr
    veya zarara alınır (par. 26).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Canlı Varlıklar (ayakta buğday) | 1.700.000 | |

    | Canlı varlık ilk muhasebeleştirme kazancı (kâr veya zarar) | | 1.700.000 |


    **(b) Hasat (par. 13, 26, 28, 29; TMS 2 par. 20)**


    Tarımsal ürün hasat noktasında gerçeğe uygun değerinden satış maliyetleri düşülerek ölçülür: 500 × (10.000 − 300) = 500
    × 9.700 = **4.850.000 TL**. Bu değer TMS 2 uygulandığında stokun maliyetidir. Canlı varlığın defter değeri 1.700.000 TL
    olduğundan fark kazançtır: 4.850.000 − 1.700.000 = **3.150.000 TL** (2026 kâr veya zararı).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Stoklar (hasat edilmiş buğday) | 4.850.000 | |

    | Canlı Varlıklar (ayakta buğday) | | 1.700.000 |

    | Canlı varlık değer değişimi ve hasat kazancı (kâr veya zarar) | | 3.150.000 |


    **(c) Satış ve dönem sonu (TMS 2 par. 9, 34)**


    Satış: gelir = 200 × 10.800 + 200 × 10.000 = 4.160.000 TL; satılan malın maliyeti = 400 × 9.700 = 3.880.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Kasa / Bankalar | 4.160.000 | |

    | Hasılat | | 4.160.000 |

    | Satışların Maliyeti | 3.880.000 | |

    | Stoklar (hasat edilmiş buğday) | | 3.880.000 |


    31.12.2026: kalan 100 ton için maliyet 9.700 TL/ton, NRV = 9.200 − 300 = 8.900 TL/ton. Maliyet NRV''den yüksek olduğundan
    değer düşüklüğü = 100 × (9.700 − 8.900) = **80.000 TL**; stok 890.000 TL''ye indirilir.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Karşılık Giderleri (stok değer düşüklüğü) | 80.000 | |

    | Stok Değer Düşüklüğü Karşılığı (−) | | 80.000 |


    **(d) 2026 etkisi ve standartlar**


    | Kalem | Tutar |

    |---|---|

    | Hasat kazancı (canlı varlık değer değişimi dâhil) | 3.150.000 |

    | Satış kârı (4.160.000 − 3.880.000) | 280.000 |

    | Stok değer düşüklüğü | (80.000) |

    | Bakım ve hasat giderleri | (600.000) |

    | **Net etki** | **2.750.000** |


    Standartlar: arazi TMS 16 (TMS 41 par. 2(a)); ayakta buğday (yıllık mahsul, canlı varlık) TMS 41; hasat noktasındaki buğday
    TMS 41 (par. 13), hasattan sonra TMS 2 (par. 3); buğdayın una dönüştürülmesi hasat sonrası işleme olduğundan TMS 41 dışındadır,
    TMS 2 (stoklar) uygulanır (TMS 41 par. 3).

    '
