- id: YMM-IFM-STK-K003
  sinav: ymm
  ders: IFM
  konu: STK
  kazanimlar:
  - stok maliyetinin belirlenmesi (dönüştürme maliyetleri, normal kapasite, ortak ve yan ürünler)
  - stokların net gerçekleşebilir değere indirgenmesi ve indirgemenin iptali
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Marmara Kimya AŞ, aynı üretim sürecinden iki ortak ürün (X ve Y) ile önemsiz bir yan ürün (Z) elde etmektedir. Ürünler
    ayrılma noktasında ayrı olarak belirlenebilir hâle gelmekte, ortak maliyetler başka bir ayrıştırma yapılamadığından ürünlere
    nispi satış değerine göre dağıtılmaktadır. 2026 yılına ilişkin bilgiler şöyledir (TL):


    | Kalem | Tutar |

    |---|---|

    | Direkt ilk madde ve malzeme tüketimi (içinde, normalin üstünde gerçekleşen hammadde firesi 60.000 TL vardır) | 1.800.000
    |

    | Direkt işçilik (içinde, plansız duruş nedeniyle normalin üstünde gerçekleşen işçilik 40.000 TL vardır) | 900.000 |

    | Değişken genel üretim giderleri (üretim miktarıyla orantılı) | 600.000 |

    | Sabit genel üretim giderleri (fiilî tutar) | 1.000.000 |

    | Üretim sürecinde bir sonraki aşamadan önce gerekli olmayan depolama gideri | 50.000 |

    | Genel yönetim giderleri | 300.000 |


    - Tesisin normal kapasitesi yılda 10.000 ton, 2026 fiilî toplam ortak ürün üretimi 9.000 ton (X: 5.000 ton, Y: 4.000 ton)
    olmuştur.

    - Ayrılma noktasındaki satış fiyatları: X 360 TL/ton, Y 450 TL/ton.

    - Yan ürün Z''nin net gerçekleşebilir değeri 100.000 TL''dir; yan ürün stoku henüz satılmamıştır.

    - 31.12.2026''da X''ten 1.000 ton, Y''den 500 ton satılmamış olarak stoktadır. Bu tarihteki piyasa fiyatları ve satış
    maliyetleri: X için 380 TL/ton ve 10 TL/ton; Y için 560 TL/ton ve 20 TL/ton. Stoklar tamamlanmış mamuldür.

    - 30.6.2027''de X stokunun tamamı hâlâ elde bulunmaktadır; bu tarihte piyasa fiyatı 425 TL/ton, satış maliyeti 10 TL/ton''dur.


    **İstenenler**


    (a) 2026 yılında stok maliyetine dâhil edilecek tutarı ortak maliyet havuzu olarak bulunuz; dönem gideri yazılacak kalemleri
    nedenleriyle birlikte belirtiniz. (6 puan)


    (b) Ortak maliyet havuzunu X ve Y ürünlerine dağıtınız, ton başına maliyetleri bulunuz; yan ürünün nasıl dikkate alındığını
    açıklayınız. (6 puan)


    (c) 31.12.2026 itibarıyla stokların finansal durum tablosundaki tutarını belirleyiniz ve gerekli yevmiye kaydını yapınız.
    (7 puan)


    (d) 30.6.2027 tarihinde yapılacak işlemi hesaplayınız ve yevmiye kaydını yapınız. (6 puan)

    '
  cozum: '**(a) Stok maliyetine girecek tutar (TMS 2 par. 10, 12, 13, 16)**


    Sabit genel üretim giderleri normal kapasiteye göre dağıtılır; fiilî üretim düzeyi normal kapasitenin altındaysa ürün
