- id: YMM-IFM-TAB-K006
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - TMS 8 isteğe bağlı muhasebe politikası değişikliğinin geriye dönük uygulanması
  - TMS 8 önemli geçmiş dönem hatasının düzeltilmesi
  - TMS 10 düzeltme gerektiren ve gerektirmeyen olaylar
  - üçüncü finansal durum tablosu
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Doğa Plastik AŞ, hesap dönemi takvim yılı olan, TFRS''ye göre finansal tablo hazırlayan bir işletmedir. 2026 yılı finansal
    tabloları, yönetim kurulunca 25.2.2027''de yayımlanmak üzere onaylanmıştır. Tüm tutarlar önemlidir; ertelenmiş vergi ve
    vergi etkileri dikkate alınmayacaktır. Tablolarda yalnızca bir önceki yıl (2025) karşılaştırmalı olarak sunulmaktadır.


    **A. Muhasebe politikası değişikliği.** Şirket, stok maliyetini 2025 sonuna kadar ilk giren ilk çıkar (FIFO) yöntemiyle
    belirlemiştir. Yönetim, 1.1.2026''dan itibaren isteğe bağlı olarak ağırlıklı ortalama maliyet yöntemine geçmiş ve bu değişikliğin
    güvenilir ve daha ilgili bilgi sağladığına karar vermiştir. Her iki yöntemle belirlenen yıl sonu stok tutarları (TL):


    | Tarih | FIFO | Ağırlıklı ortalama |

    |---|---|---|

    | 31.12.2024 | 2.500.000 | 2.450.000 |

    | 31.12.2025 | 3.000.000 | 2.800.000 |


    Geriye dönük uygulama uygulanabilir durumdadır. Şirketin 2025 yılı için raporladığı net dönem kârı 5.000.000 TL''dir.


    **B. Geçmiş dönem hatası.** Ocak 2027''de yapılan incelemede, 2025 yılına ait olduğu hâlde kaydedilmemiş 300.000 TL tutarında
    kira giderinin 2026 yılında ödendiği ve 2026 yılı giderlerine yazıldığı anlaşılmıştır. Hata önemlidir.


    **C. Raporlama dönemi sonrası olaylar (2027).**


    1. 20.1.2027''de, 31.12.2026 itibarıyla bakiyesi 600.000 TL olan bir müşteri iflas etmiştir; müşterinin mali durumunun
    2026 boyunca bozulduğu bilinmekte, ancak alacak için karşılık ayrılmamıştır. Alacağın hiçbir kısmının tahsil edilemeyeceği
    anlaşılmıştır.

    2. 5.2.2027''de, 2025''te açılan ve 31.12.2026 itibarıyla kaybedilme ihtimali yüksek bulunmasına rağmen karşılık ayrılmamış
    bir dava şirket aleyhine sonuçlanmış; 300.000 TL tazminat kesinleşmiştir.

    3. 10.2.2027''de, şirketin deposunda çıkan yangın nedeniyle 1.000.000 TL tutarında stok yok olmuştur (yangın 31.12.2026''dan
    sonra çıkmıştır).

    4. 15.2.2027''de yönetim kurulu, 2026 kârından 500.000 TL temettü dağıtılmasını genel kurula önermiş ve bu karar kamuya
    duyurulmuştur.


    2026 yılı için yukarıdaki olaylardan ve hatadan önce raporlanan net dönem kârı **4.200.000 TL**''dir (B bendindeki kira
    gideri bu tutarın hesabında 2026 gideri olarak yer almaktadır).


    **İstenenler**


    (a) A bendindeki değişikliğin hangi yöntemle uygulanacağını açıklayınız; 31.12.2024 tarihli özkaynakta (geçmiş yıllar
    kârları) ve 2025 yılı karşılaştırmalı net kârında yapılacak düzeltmeleri hesaplayınız. Üçüncü bir finansal durum tablosunun
    sunulup sunulmayacağını gerekçesiyle belirtiniz. (8 puan)


    (b) B bendindeki hatanın düzeltilme biçimini açıklayınız; 2025 karşılaştırmalı net kârı ile 1.1.2026 tarihli özkaynağa
    (geçmiş yıllar kârları) etkisini ve 2026 yılı net kârına etkisini hesaplayınız. (6 puan)


    (c) C bendindeki dört olayı "düzeltme gerektiren" ve "düzeltme gerektirmeyen" olarak sınıflandırınız; her biri için finansal
    tablolardaki işlemi gerekçesiyle belirtiniz. (7 puan)


    (d) Yukarıdaki (a)–(c) sonuçlarını dikkate alarak 2026 yılının düzeltilmiş net dönem kârını ve 2025 karşılaştırmalı net
    kârını hesaplayınız. (4 puan)

    '
  cozum: '**(a) İsteğe bağlı muhasebe politikası değişikliği (TMS 8 par. 19(b), 22; TMS 1 par. 40A)**


    Özel geçiş hükmü bulunmayan, isteğe bağlı politika değişikliği **geriye dönük** uygulanır (par. 19(b)). Değişiklikten
    etkilenen her özkaynak kaleminin sunulan en erken döneme ait açılış bakiyesi ve karşılaştırmalı tutarlar yeni politika
    baştan beri uygulanıyormuş gibi düzeltilir (par. 22). Sunulan en erken dönem 2025 olduğundan açılış bakiyesi 1.1.2025
    (= 31.12.2024) tarihlidir.


    - 31.12.2024 stok farkı = 2.450.000 − 2.500.000 = (50.000) TL → 1.1.2025 geçmiş yıllar kârları **50.000 TL azalır**.

    - 31.12.2025 stok farkı = 2.800.000 − 3.000.000 = (200.000) TL.

    - 2025 kârına etki = (−200.000) − (−50.000) = **(150.000) TL** (dönem sonu stok düşüşü kârı azaltır, dönem başı stok düşüşü
    kârı artırır).

    - 2025 karşılaştırmalı kâr (politika etkisi) = 5.000.000 − 150.000 = 4.850.000 TL.

    - 31.12.2025 birikimli etki = 50.000 + 150.000 = 200.000 TL (stok azalışına eşit).


    Politika değişikliği önceki dönemin başındaki finansal durum tablosunu önemli ölçüde etkilediği için (geriye dönük uygulama
    + önemli etki) **bir önceki dönemin başına (1.1.2025) ait üçüncü bir finansal durum tablosu** sunulur (TMS 1 par. 40A,
    40B).


    **(b) Geçmiş dönem hatası (TMS 8 par. 42)**


    Önemli geçmiş dönem hatası, hata tespit edildikten sonra yayımlanması için onaylanan ilk finansal tablolarda (2026 tabloları)
    **geriye dönük** olarak düzeltilir; hatanın meydana geldiği dönemin (2025) karşılaştırmalı tutarları yeniden düzenlenir.
    Hata 2025''te doğduğundan sunulan en erken dönem içindedir.


    - 2025 gideri 300.000 TL eksik → 2025 karşılaştırmalı net kâr **300.000 TL azalır**; 31.12.2025''te 300.000 TL kira borcu
    (gider tahakkuku) gösterilir.

    - 1.1.2026 geçmiş yıllar kârları, hata nedeniyle 300.000 TL azalır (A bendi etkisiyle birlikte toplam: 200.000 + 300.000
    = 500.000 TL).

    - 2026''da ödenen ve gider yazılan 300.000 TL aslında 2025 giderinin ödemesidir; 2026 gideri fazla olduğundan 2026 net
    kârı **300.000 TL artar**.


    **(c) Raporlama dönemi sonrası olaylar (TMS 10 par. 8–13)**


    | Olay | Sınıf | İşlem |

    |---|---|---|

    | 1. Müşterinin iflası | Düzeltme gerektiren (par. 9(b)(i)) | İflas, alacağın raporlama dönemi sonunda değer düşüklüğüne
    uğradığını gösterir; 600.000 TL değer düşüklüğü/şüpheli alacak karşılığı 2026''da gider yazılır. |

    | 2. Dava sonucu | Düzeltme gerektiren (par. 9(a)) | Dava, 31.12.2026''da mevcut bir yükümlülüğü teyit eder; 300.000 TL
    karşılık 2026''da ayrılır, yalnızca açıklama yeterli değildir. |

    | 3. Yangın | Düzeltme gerektirmeyen (par. 10) | Olay raporlama döneminden sonra doğmuştur; tutarlar düzeltilmez, önemli
    olduğu için niteliği ve mali etkisi (1.000.000 TL) dipnotta açıklanır. |

    | 4. Temettü önerisi | Düzeltme gerektirmeyen (par. 12, 13) | Raporlama döneminden sonra ilan edilen temettü 31.12.2026''da
    yükümlülük değildir; yükümlülük yazılmaz, 500.000 TL dipnotta açıklanır. |


    **(d) Düzeltilmiş kârlar**


    - 2026 net kârı = 4.200.000 + 300.000 (hata) − 600.000 − 300.000 = **3.600.000 TL**

    - 2025 karşılaştırmalı net kâr = 5.000.000 − 150.000 − 300.000 = **4.550.000 TL**

    '
