    muhasebeleştirilir, yıl sonuna bırakılamaz. Sonraki ara dönemde tahmin değişirse ilk tutar ek zarar yansıtılarak veya
    önceki tutar iptal edilerek o ara dönemde değiştirilir. İptal, daha önce indirgenen tutarla (maliyetle) sınırlıdır. Yönetimin
    düşüncesi bu nedenle **uygun değildir**.


    | Tarih | NRV | Defter değeri (min(maliyet, NRV)) | Dönem etkisi | Yılbaşından kümülatif net gider |

    |---|---|---|---|---|

    | 31.3.2026 | 1.700.000 | 1.700.000 | gider 300.000 | (300.000) |

    | 30.6.2026 | 1.850.000 | 1.850.000 | gelir 150.000 | (150.000) |

    | 30.9.2026 | 2.200.000 | 2.000.000 | gelir 150.000 | 0 |

    | 31.12.2026 | 1.900.000 | 1.900.000 | gider 100.000 | (100.000) |


    30.9.2026''da NRV (2.200.000) maliyeti aştığından iptal, kalan 150.000 TL ile sınırlıdır; defter değeri maliyet olan 2.000.000
    TL olur. Yıl sonu net değer düşüklüğü gideri 100.000 TL''dir.


    **(b) Diğer işlemler (par. 30(b), 32, 37-38, 16A(b), (c))**


    (i) Temettü geliri ortaya çıktığı anda (Q1) muhasebeleştirilir; eşit dağıtılmaz veya ertelenmez (par. 37-38). (ii) Mevsimsel
    hasılat ortaya çıktığı anda finansal tablolara alınır; ertelenmez veya önceden tahmin edilmez; mevsimsellik açıklanır
    (par. 38, 16A(b)). (iii) Yıllık finansal tablolarda aktifleştirilemeyen maliyet ara dönemde de aktifleştirilemez; Q2 gideri
    olarak yansıtılır, kazançları ara dönemlere eşit dağıtma amacıyla ertelenemez (par. 30(b), 32). (iv) Dava tazminatı gideri
    Q3''te yansıtılır; niteliği ve büyüklüğü itibarıyla olağandışı olduğundan niteliği ve tutarı ara dönem notlarında açıklanır
    (par. 16A(c)).


    **(c) İlişkili taraflar (TMS 24 par. 9, 10, 11)**


    | Taraf | Sonuç | Gerekçe |

    |---|---|---|

    | 1. Yıldız Holding | İlişkili | Ana ortaklık, aynı grubun üyesi (par. 9(b)(i)) |

