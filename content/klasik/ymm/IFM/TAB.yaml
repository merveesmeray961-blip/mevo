    - Ana ortaklık paylarına düşen sürdürülen faaliyetler dönem kârı 8.940.000 TL, durdurulan faaliyetler zararı 900.000 TL''dir
    (her ikisi de vergi sonrası).

    - Birikimli, dönüştürülebilir imtiyazlı hisselere ilişkin 2026 dönemi için öngörülen vergi sonrası temettü 300.000 TL''dir
    (ilan edilmemiştir). İmtiyazlı hisseler 100.000 adet adi hisse ile değiştirilebilmektedir.

    - Dönem başından beri geçerli 500.000 adet hisse alım opsiyonu vardır; kullanım fiyatı 8 TL, 2026 ortalama piyasa fiyatı
