- id: YMM-IFM-TAB-K001
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - TMS 7 nakit akış tablosu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ticaret işletmesi (T) AŞ''nin 2026 yılına ilişkin bilgileri aşağıdadır (TL).


    **Kâr veya zarar tablosu**


    | Kalem | TL |

    |---|---|

    | Satışlar (tamamı vadeli) | 9.000.000 |

    | Satışların maliyeti | (5.600.000) |

    | Faaliyet giderleri (300.000 TL amortisman dahil; kalanı nakden ödenmiştir) | (1.500.000) |

    | Maddi duran varlık satış kârı | 100.000 |

    | Faiz gideri (tamamı yıl içinde ödenmiştir) | (250.000) |

    | Vergi gideri | (400.000) |

    | Dönem kârı | 1.350.000 |


    **Bakiyeler**


    | Kalem | 31.12.2025 | 31.12.2026 |

    |---|---|---|

    | Nakit ve nakit benzerleri | 400.000 | ? |

    | Ticari alacaklar | 1.200.000 | 1.500.000 |

    | Stoklar | 1.000.000 | 800.000 |

    | Ticari borçlar (tamamı mal alımından) | 900.000 | 1.050.000 |

    | Ödenecek vergi | 150.000 | 200.000 |


    **Diğer bilgiler:** Defter değeri 250.000 TL olan bir makine 350.000 TL''ye peşin satılmıştır. Yıl içinde 1.600.000 TL''lik
    yeni makine peşin satın alınmış, 1.000.000 TL banka kredisi kullanılmış, 300.000 TL kredi anaparası geri ödenmiş ve ortaklara
    500.000 TL nakit temettü ödenmiştir. Şirket ödenen faizi ve ödenen temettüyü finansman faaliyetlerinde, vergi ödemelerini
    esas faaliyetlerde sınıflandırmaktadır.


    **İstenenler**


    (a) Esas faaliyetlerden kaynaklanan net nakit akışını doğrudan yöntemle hesaplayınız. (10 puan)


    (b) Aynı tutarı dolaylı yöntemle hesaplayarak sağlamasını yapınız. (7 puan)


    (c) Yatırım ve finansman faaliyetlerinden kaynaklanan net nakit akışlarını ve 31.12.2026 nakit ve nakit benzerleri bakiyesini
    bulunuz. (8 puan)

    '
  cozum: '**(a) Doğrudan yöntem (TMS 7 par. 18(a))**


    | Kalem | Hesaplama | TL |

    |---|---|---|

    | Müşterilerden tahsilat | 9.000.000 + 1.200.000 − 1.500.000 | 8.700.000 |

    | Satıcılara ödeme | Alış = 5.600.000 + 800.000 − 1.000.000 = 5.400.000; ödeme = 5.400.000 + 900.000 − 1.050.000 | (5.250.000)
    |

    | Faaliyet giderleri ödemesi | 1.500.000 − 300.000 | (1.200.000) |

    | Vergi ödemesi (par. 35) | 400.000 + 150.000 − 200.000 | (350.000) |

    | **Esas faaliyetlerden net nakit** | | **1.900.000** |


    Faiz finansman faaliyetinde sınıflandığından esas faaliyet bölümüne alınmaz (par. 31, 33).


    **(b) Dolaylı yöntem (par. 18(b), 20)**


    | Kalem | TL |

    |---|---|

    | Dönem kârı | 1.350.000 |

    | + Amortisman | 300.000 |

    | − MDV satış kârı (satış bedeli yatırım faaliyetinde) | (100.000) |

    | + Faiz gideri (finansman faaliyetinde) | 250.000 |

    | − Ticari alacak artışı | (300.000) |

    | + Stok azalışı | 200.000 |

    | + Ticari borç artışı | 150.000 |

    | + Ödenecek vergi artışı | 50.000 |

    | **Esas faaliyetlerden net nakit** | **1.900.000** |


    **(c) Yatırım ve finansman faaliyetleri (par. 16, 17)**


    | Kalem | TL |

    |---|---|

    | Makine satışından tahsilat | 350.000 |

    | Makine alımı | (1.600.000) |

    | **Yatırım faaliyetlerinden net nakit** | **(1.250.000)** |

    | Kredi kullanımı | 1.000.000 |

    | Kredi anapara geri ödemesi | (300.000) |

    | Ödenen faiz | (250.000) |

    | Ödenen temettü | (500.000) |

    | **Finansman faaliyetlerinden net nakit** | **(50.000)** |


    Nakitteki net artış = 1.900.000 − 1.250.000 − 50.000 = 600.000 TL.

    31.12.2026 nakit ve nakit benzerleri = 400.000 + 600.000 = **1.000.000 TL**.

    '
  puanlama:
  - olcut: Müşterilerden tahsilatı 8.700.000 TL bulma
    puan: 2
  - olcut: Alışları ve satıcılara ödemeyi 5.250.000 TL bulma
    puan: 3
  - olcut: Faaliyet giderleri ödemesini amortismanı düşerek 1.200.000 TL bulma
    puan: 1
  - olcut: Vergi ödemesini 350.000 TL bulma ve esas faaliyette gösterme
    puan: 2
  - olcut: Esas faaliyet net nakit akışını 1.900.000 TL bulma ve faizi bu bölüme almama
    puan: 2
  - olcut: Nakit dışı kalemler ve yatırım-finansman kalemleri düzeltmeleri (amortisman, satış kârı, faiz)
    puan: 3
  - olcut: İşletme sermayesi değişimlerinin doğru yönle düzeltilmesi ve 1.900.000 TL sağlaması
    puan: 4
  - olcut: Yatırım faaliyetleri net nakit akışını (1.250.000) TL bulma
    puan: 3
  - olcut: Finansman faaliyetleri net nakit akışını (50.000) TL bulma; faiz ve temettüyü politika gereği bu bölümde gösterme
    puan: 3
  - olcut: Net artışı 600.000 TL ve dönem sonu nakdi 1.000.000 TL bulma
    puan: 2
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 16, 17, 18, 20, 31, 33, 34, 35
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
  dogrulama:
    python: 'tahsilat = 9000000 + 1200000 - 1500000

      alis = 5600000 + 800000 - 1000000

      odeme = alis + 900000 - 1050000

      fg = 1500000 - 300000

      vergi = 400000 + 150000 - 200000

      esas = tahsilat - odeme - fg - vergi

      dolayli = 1350000 + 300000 - 100000 + 250000 - 300000 + 200000 + 150000 + 50000

      yatirim = 350000 - 1600000

      finansman = 1000000 - 300000 - 250000 - 500000

      artis = esas + yatirim + finansman

      sonuc = {''tahsilat'': tahsilat, ''saticilara_odeme'': odeme, ''vergi_odemesi'': vergi, ''esas_faaliyet'': esas, ''dolayli_saglama'':
      dolayli, ''yatirim'': yatirim, ''finansman'': finansman, ''net_artis'': artis, ''donem_sonu_nakit'': 400000 + artis}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, klasik 4
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-TAB-K002
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - TFRS 5 satış amaçlı duran varlıklar ve durdurulan faaliyetler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Atlas Holding AŞ** ayrı bir ana faaliyet kolu olan tekstil bölümünü satmaya karar vermiştir. 1.11.2026''da bölüm

    mevcut hâliyle derhâl satılabilir durumdadır; yönetim aktif bir satış programı başlatmış, makul bir fiyatla ilan

    vermiş ve satışın bir yıl içinde tamamlanması çok muhtemeldir. Bölümün 1.11.2026 itibarıyla (ilgili standartlara göre

    güncellenmiş) defter değerleri:


    | Kalem | TL |

    |---|---|

    | Maddi duran varlıklar | 5.000.000 |

    | Stoklar | 2.000.000 |

    | Ticari alacaklar | 1.000.000 |

    | Ticari borçlar | (1.500.000) |

    | **Net** | **6.500.000** |


    1.11.2026''da bölümün gerçeğe uygun değeri 6.000.000 TL, satış maliyetleri 300.000 TL''dir. 31.12.2026''da elden

    çıkarılacak varlık grubunun satış maliyetleri düşülmüş gerçeğe uygun değeri 5.900.000 TL''ye yükselmiştir (diğer

    kalemlerde değişiklik olmamıştır). Bölümün 2026 yılı faaliyet sonuçları: hasılat 9.000.000 TL, giderler 10.200.000 TL

    (1.11.2026''dan sonra ayrılmamış olması gereken 100.000 TL amortisman bu tutara dahil değildir). Kurumlar vergisi oranı

    %25''tir.


    **İstenenler:**


    (a) Satış amaçlı sınıflandırma ve durdurulan faaliyet tanımı koşullarını açıklayınız. (5 puan)


    (b) 1.11.2026''daki ölçümü yaparak değer düşüklüğü zararını hesaplayınız ve varlıklara dağıtınız. (7 puan)


    (c) 31.12.2026''daki değer artışının muhasebeleştirilmesini ve sınırını açıklayınız; amortisman uygulamasını

    belirtiniz. (5 puan)


    (d) Durdurulan faaliyetin kâr veya zarar tablosundaki sunumunu ve 31.12.2026 finansal durum tablosundaki gösterimini

    yapınız. (8 puan)

    '
  cozum: "**(a) Koşullar**\n\nDuran varlık (veya elden çıkarılacak varlık grubu), defter değerinin sürdürülmekte olan kullanımdan\
    \ ziyade **satış\nişlemiyle** geri kazanılacak olması hâlinde satış amaçlı sınıflandırılır (TFRS 5.6). Bunun için varlığın\
    \ mevcut\nhâliyle derhâl satılabilir olması ve satışın **çok muhtemel** olması gerekir: yönetimin satış planına bağlılığı,\
    \ aktif\nalıcı arayışı, makul fiyatla pazarlama ve satışın sınıflandırmadan itibaren **bir yıl içinde** tamamlanmasının\n\
    beklenmesi (TFRS 5.7–8). Ayrı bir ana faaliyet kolunu temsil eden ve satış amaçlı sınıflandırılan bileşen\n**durdurulan\
    \ faaliyettir** (TFRS 5.32).\n\n**(b) Sınıflandırma anında ölçüm**\n\nGrup, defter değeri ile satış maliyetleri düşülmüş\
    \ gerçeğe uygun değerden **düşük olanla** ölçülür (TFRS 5.15):\nmin(6.500.000; 6.000.000 − 300.000 = 5.700.000) = 5.700.000\
    \ TL; değer düşüklüğü zararı **800.000 TL**.\n\nZarar, TFRS 5'in ölçüm hükümleri kapsamındaki duran varlıklara TMS 36.104'teki\
    \ sırayla dağıtılır (TFRS 5.23); stoklar\nve alacaklar kapsam dışıdır. Maddi duran varlıklar 5.000.000 − 800.000 = **4.200.000\
    \ TL**'ye indirilir.\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 654 Karşılık Giderleri (değer düşüklüğü) | 800.000\
    \ | |\n| 257 Birikmiş Amortismanlar (değer düşüklüğü alt hesabı) | | 800.000 |\n\n**(c) Sonraki ölçüm**\n\nSatış maliyetleri\
    \ düşülmüş gerçeğe uygun değerdeki artış, daha önce muhasebeleştirilen toplam değer düşüklüğü zararını\n**aşmamak** kaydıyla\
    \ kazanç olarak kaydedilir (TFRS 5.21–22). Artış = 5.900.000 − 5.700.000 = **200.000 TL** <\n800.000 TL; tamamı kâr veya\
    \ zarara alınır ve MDV defter değeri 4.400.000 TL olur. Satış amaçlı sınıflandırılan duran\nvarlıklar **amortismana tabi\
    \ tutulmaz** (TFRS 5.25); bu nedenle 100.000 TL amortisman ayrılmaz.\n\n**(d) Sunum**\n\nDurdurulan faaliyetin vergi sonrası\
    \ sonucu kâr veya zarar tablosunda **tek tutar** olarak sunulur, ayrıntısı\ndipnotta verilir (TFRS 5.33-a); karşılaştırmalı\
    \ dönem de yeniden düzenlenir (TFRS 5.34).\n\n| Durdurulan faaliyet analizi | TL |\n|---|---|\n| Hasılat | 9.000.000 |\n\
    | Giderler | (10.200.000) |\n| Değer düşüklüğü zararı (net: 800.000 − 200.000) | (600.000) |\n| Vergi öncesi zarar | (1.800.000)\
    \ |\n| Vergi geliri (%25) | 450.000 |\n| **Durdurulan faaliyetlerden dönem zararı** | **(1.350.000)** |\n\nFinansal durum\
    \ tablosunda satış amaçlı varlıklar ve bunlarla ilişkili yükümlülükler diğerlerinden **ayrı satırlarda**\nve **mahsup\
    \ edilmeden** gösterilir (TFRS 5.38):\n\n- Dönen varlıklar: Satış amaçlı sınıflandırılan varlıklar **7.400.000 TL** (4.400.000\
    \ + 2.000.000 + 1.000.000),\n- Kısa vadeli yükümlülükler: Satış amaçlı varlık grubuna ilişkin yükümlülükler **1.500.000\
    \ TL**\n  (net 5.900.000 TL).\n"
  puanlama:
  - olcut: (a) Satış amaçlı sınıflandırma koşulları (TFRS 5.6-8)
    puan: 3
  - olcut: (a) Durdurulan faaliyet tanımı
    puan: 2
  - olcut: (b) Düşük olanla ölçüm ve 800.000 TL zarar
    puan: 4
  - olcut: (b) Zararın yalnız MDV'ye dağıtılması (TFRS 5.23)
    puan: 3
  - olcut: (c) 200.000 TL kazanç ve sınırı (TFRS 5.21-22)
    puan: 3
  - olcut: (c) Amortisman ayrılmaması (TFRS 5.25)
    puan: 2
  - olcut: (d) Tek tutar sunumu ve (1.350.000) TL dönem zararı
    puan: 5
  - olcut: (d) Varlık 7.400.000 / yükümlülük 1.500.000 TL ayrı ve mahsupsuz gösterim
    puan: 3
  kaynaklar:
  - mevzuat: TFRS 5 Satış Amaçlı Elde Tutulan Duran Varlıklar ve Durdurulan Faaliyetler
    madde: par. 6, 7, 8, 15, 21, 22, 23, 25, 32, 33, 34, 38
    alinti: parçası olan bir duran varlığı amortismana tabi tutmaz (veya itfa etmez).
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "sm = 6000000 - 300000\nz = 6500000 - sm\nart = min(5900000 - sm, z)\nvo = 9000000 - 10200000 - (z - art)\nsonuc\
      \ = {\"sm\": sm, \"z\": z, \"mdv\": 5000000 - z, \"art\": art, \"mdv2\": 5000000 - z + art, \"vo\": vo,\n         \"\
      vg\": -vo * 0.25, \"net\": vo * 0.75, \"varlik\": 5000000 - z + art + 3000000, \"yuk\": 1500000}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_IFM
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-24'
      G5:
        sonuc: gecti
        tarih: '2026-10-24'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-24'
    kim: uretici
    ne: harici teslim t_K_IFM.yaml, klasik 13
  - tarih: '2026-10-24'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-TAB-K003
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - TMS 7 nakit akış tablosu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Nova Enerji AŞ**'nin 2026 yılına ilişkin bilgiler (işletme faaliyetlerinden net nakit akışı dolaylı yöntemle\n\
    **6.200.000 TL** olarak hesaplanmıştır):\n\n1. 4.000.000 TL'lik makine alınmış; bedelin 1.000.000 TL'si yıl sonunda satıcıya\
    \ borç olarak durmaktadır.\n2. Defter değeri 600.000 TL olan bir taşıt 900.000 TL'ye peşin satılmıştır.\n3. Yeni bir depo\
    \ kiralaması nedeniyle 1.500.000 TL kullanım hakkı varlığı ve kira yükümlülüğü kaydedilmiştir. Yıl\n   içinde 700.000\
    \ TL kira ödenmiş, bunun 250.000 TL'si faizdir.\n4. 2.000.000 TL'lik borç senedi, alacaklı ile anlaşılarak işletmenin\
    \ hisselerine dönüştürülmüştür.\n5. 3.000.000 TL bedelli sermaye artırımı nakden tahsil edilmiştir.\n6. 1.200.000 TL kâr\
    \ payı ödenmiştir.\n7. İştiraklerden 400.000 TL kâr payı ve mevduattan 150.000 TL faiz tahsil edilmiştir.\n8. 5.000.000\
    \ TL banka kredisi kullanılmış, 2.500.000 TL kredi anaparası geri ödenmiştir.\n9. Gerçeğe uygun değer değişimi diğer kapsamlı\
    \ gelire yansıtılan 800.000 TL'lik hisse senedi alınmıştır.\n10. Döviz mevduatının kur değişimi nedeniyle TL karşılığı\
    \ 350.000 TL artmıştır.\n\nDönem başı nakit ve nakit benzerleri 2.000.000 TL'dir. İşletme ödenen faizleri finansman, alınan\
    \ faiz ve kâr\npaylarını yatırım faaliyetlerinde sınıflandırma politikası uygulamaktadır.\n\n**İstenenler:**\n\n(a) Yatırım\
    \ faaliyetlerinden nakit akışlarını hesaplayınız. (6 puan)\n\n(b) Finansman faaliyetlerinden nakit akışlarını hesaplayınız.\
    \ (6 puan)\n\n(c) Nakit ve nakit benzerlerindeki değişimi ve dönem sonu tutarını gösteriniz; kur farkının ve 2 numaralı\
    \ işlemdeki\nkazancın tabloda nasıl ele alınacağını açıklayınız. (6 puan)\n\n(d) Nakit çıkışı gerektirmeyen yatırım ve\
    \ finansman işlemlerinin açıklanmasını ve finansman faaliyetlerinden doğan\nyükümlülüklerdeki değişimlerin mutabakatını\
    \ (kira yükümlülüğü için) yapınız. (7 puan)\n"
  cozum: '**(a) Yatırım faaliyetleri**


    | Kalem | TL |

    |---|---|

    | Makine alımı (yalnız ödenen kısım) | (3.000.000) |

    | Taşıt satışı | 900.000 |

    | GUD değişimi DKG''ye yansıtılan hisse alımı | (800.000) |

    | Alınan kâr payları | 400.000 |

    | Alınan faizler | 150.000 |

    | **Yatırım faaliyetlerinden net nakit** | **(2.350.000)** |


    **(b) Finansman faaliyetleri**


    | Kalem | TL |

    |---|---|

    | Bedelli sermaye artırımı | 3.000.000 |

    | Kullanılan krediler | 5.000.000 |

    | Kredi anapara geri ödemeleri | (2.500.000) |

    | Kira yükümlülüğü anapara ödemeleri | (450.000) |

    | Ödenen faiz (kira faizi) | (250.000) |

    | Ödenen kâr payları | (1.200.000) |

    | **Finansman faaliyetlerinden net nakit** | **3.600.000** |


    Faiz ve kâr payları her dönem tutarlı şekilde aynı faaliyet grubunda sınıflandırılmalıdır (TMS 7.31, 7.33–34).


    **(c) Nakit değişimi**


    | Kalem | TL |

    |---|---|

    | İşletme faaliyetleri | 6.200.000 |

    | Yatırım faaliyetleri | (2.350.000) |

    | Finansman faaliyetleri | 3.600.000 |

    | **Net artış (kur etkisi öncesi)** | **7.450.000** |

    | Kur değişiminin nakit ve nakit benzerleri üzerindeki etkisi | 350.000 |

    | Dönem başı nakit | 2.000.000 |

    | **Dönem sonu nakit** | **9.800.000** |


    Gerçekleşmemiş kur farkları nakit akışı değildir; nakit ve nakit benzerlerine ilişkin etkisi açılış ve kapanış

    bakiyelerinin mutabakatı için **ayrı satırda** gösterilir (TMS 7.28). Taşıt satış kazancı (300.000 TL) dolaylı

    yöntemde dönem kârından **düşülür**; satıştan elde edilen 900.000 TL''nin tamamı yatırım faaliyetlerinde yer alır.


    **(d) Nakit dışı işlemler ve mutabakat**


    Nakit veya nakit benzeri kullanılmayan yatırım ve finansman işlemleri tabloya alınmaz, dipnotta açıklanır (TMS 7.43):

    satıcıya borçlu kalınan **1.000.000 TL** makine bedeli, **1.500.000 TL** kullanım hakkı varlığı/kira yükümlülüğü ve

    hisseye dönüştürülen **2.000.000 TL** borç senedi.


    Finansman faaliyetlerinden doğan yükümlülüklerdeki nakit ve nakit dışı değişimler açıklanır (TMS 7.44A–44B):


    | Kira yükümlülüğü | TL |

    |---|---|

    | Dönem başı | 0 |

    | Yeni kiralama (nakit dışı) | 1.500.000 |

    | Faiz tahakkuku (nakit dışı) | 250.000 |

    | Ödemeler (nakit) | (700.000) |

    | **Dönem sonu** | **1.050.000** |

    '
  puanlama:
  - olcut: (a) Makine alımında yalnız ödenen 3.000.000 TL
    puan: 2
