  kazanimlar:
  - VUK kayıtlarından TFRS düzeltme kayıtlarına geçiş
  - TMS 1 ve TFRS 18 finansal tabloların sunuluşu
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: 'Uğur Gıda AŞ, VUK/Tekdüzen Hesap Planı''na göre tutulan 31.12.2026 mizanını TFRS finansal durum tablosuna dönüştürmektedir.
    İşletmenin normal faaliyet döngüsü açıkça belirlenememektedir. Mizandaki ilgili bakiyeler (TL):


    | Hesap | Tutar | Açıklama |

    |---|---|---|

    | Kasa ve bankalar | 400.000 | Kısıtlama yok |

    | 120 Alıcılar | 3.000.000 | İçinde 31.3.2028''de tahsil edilecek 800.000 TL vardır |

    | 131 Ortaklardan alacaklar | 500.000 | Vadesi 30.6.2030 |

    | 153 Ticari mallar / stoklar | 1.600.000 | Normal döngü içinde satılacak |

    | 320 Satıcılar | 2.000.000 | Vade 6 ay |

    | 300 Banka kredileri (kısa vadeli) | 2.500.000 | İçinde vadesi 30.6.2029 olan 700.000 TL''lik kredi yanlışlıkla izlenmektedir;
    işletmenin vadeyi ertelemek gibi bir hakkı yoktur |

    | 400 Banka kredileri (uzun vadeli) | 3.000.000 | İçinde 30.9.2027''de ödenecek 1.200.000 TL anapara taksiti vardır |


    **İstenenler**


    (a) TMS 1''e göre normal faaliyet döngüsü belirlenemediğinde kullanılacak süreyi ve dönen varlık / kısa vadeli yükümlülük
    sınıflandırma ölçütlerini belirtiniz; yukarıdaki yedi kalemi gerekçeleriyle yeniden sınıflandırınız. (9 puan)


    (b) Düzeltme öncesi ve sonrası dönen varlıklar, kısa vadeli ve uzun vadeli yükümlülükler ile duran varlıklara aktarılan
    tutarı hesaplayınız. (6 puan)


    (c) Düzeltme öncesi ve sonrası cari oranı bulunuz; sınıflandırma düzeltmesinin yorumunu yapınız. (5 puan)

    '
  cozum: '**(a) Ölçütler ve sınıflandırma**


    Normal faaliyet döngüsü açıkça belirlenemiyorsa bu döngünün on iki ay olduğu varsayılır (TMS 1 par. 68). Bir varlık normal
    döngüde ya da raporlama döneminden sonraki on iki ay içinde realize edilecekse dönen, bir yükümlülük de on iki ay içinde
    ödenecekse kısa vadelidir (par. 66, 69). Uzun vadeli kredilerin bilanço tarihinden sonraki bir yıl içinde ödenecek anapara
    taksitleri kısa vadeli yükümlülüktür (par. 69(c) ve 71; THP 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri).


    | Kalem | THP kodu esaslı | TFRS sınıfı |

    |---|---|---|

    | Kasa ve bankalar | Dönen | Dönen |

    | Alıcıların 800.000 TL''si | Dönen | **Duran** (12 aydan uzun) |

    | Ortaklardan alacaklar | Dönen | **Duran** (vade 2030) |

    | Stoklar, satıcılar | Dönen / KV | Aynı |

    | 300''deki 700.000 TL kredi | KV | **Uzun vadeli** |

    | 400''deki 1.200.000 TL taksit | UV | **Kısa vadeli** |


    **(b) Tutarlar**


    - Düzeltme öncesi dönen = 5.500.000; kısa vadeli yükümlülük = 4.500.000; uzun vadeli = 3.000.000

    - Düzeltme sonrası dönen = 400.000 + 2.200.000 + 1.600.000 = **4.200.000 TL**; duran varlıklara aktarılan = 800.000 +
    500.000 = **1.300.000 TL**

    - Kısa vadeli = 2.000.000 + 1.800.000 + 1.200.000 = **5.000.000 TL**; uzun vadeli = 1.800.000 + 700.000 = **2.500.000
    TL**


    **(c) Cari oran**


    Önce: 5.500.000 / 4.500.000 = **1,22**; sonra: 4.200.000 / 5.000.000 = **0,84**. TFRS sınıflandırması likidite görünümünü
    bozmaktadır: dönen varlıklar kısa vadeli yükümlülükleri karşılamamaktadır (oran 1''in altı); THP hesap koduna bakarak
    değil bakiyenin gerçek vadesine bakarak sınıflandırma yapılmalıdır.

    '
  puanlama:
  - olcut: (a) 12 ay varsayımı, ölçütler ve yedi kalemin sınıflandırması
    puan: 9
  - olcut: (b) Düzeltme öncesi/sonrası toplamlar
    puan: 6
  - olcut: (c) Cari oran ve yorum
