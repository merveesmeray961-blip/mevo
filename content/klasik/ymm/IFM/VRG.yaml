  soru: 'Nehir Elektronik AŞ, ürünlerine bir yıl garanti vermektedir. 2026 yılında 1.000 adet ürün satmıştır. Geçmiş deneyime
    göre satılan ürünlerin %80''inde hiç arıza çıkmamakta, %15''inde ürün başına 400 TL''lik küçük onarım, %5''inde ürün başına
    3.000 TL''lik büyük onarım gerekmektedir. Garanti yükümlülüğü yasal olarak doğmuş olup işletmenin onarımı yapmaktan kaçınma
    imkânı yoktur; paranın zaman değeri etkisi önemsizdir ve vergi oranı %25''tir (garanti karşılığı ödenene kadar vergiden
    indirilemez).


    - 1.1.2026''da önceki yıllarda satılan ürünlere ilişkin garanti karşılığı 90.000 TL''dir. 2026''da bu ürünler için 55.000
    TL onarım ödemesi yapılmış, 31.12.2026''da kalan yükümlülük için en iyi tahmin 25.000 TL olarak yeniden belirlenmiştir.

    - 2026''da satılan ürünler için yıl içinde 45.000 TL onarım ödemesi yapılmıştır.


    **İstenenler**


    (a) 2026 satışlarına ilişkin garanti karşılığının hangi koşullarla muhasebeleştirileceğini ve ölçüm yöntemini belirtiniz;
    ürün başına ve toplam beklenen maliyeti hesaplayınız. (7 puan)


    (b) Eski satışlara ilişkin karşılığın iptal (gelir) tutarını, 31.12.2026 toplam karşılık bakiyesini ve 2026 kâr veya zararına
    yansıyan net karşılık giderini bulunuz. (7 puan)


    (c) Ertelenmiş vergi varlığını hesaplayınız ve 2026 yevmiye kayıtlarını (hesap adlarıyla) yapınız. (6 puan)

    '
  cozum: '**(a) Koşullar ve ölçüm**


    Karşılık, geçmiş olaydan (satış) kaynaklanan mevcut yükümlülük bulunması, kaynak çıkışının muhtemel olması ve tutarın
    güvenilir tahmin edilebilmesi hâlinde yazılır (TMS 37 par. 14). Çok sayıda benzer kalem söz konusu olduğundan yükümlülük
    sınıf olarak değerlendirilir ve **beklenen değer** yöntemiyle ölçülür.


    Ürün başına beklenen maliyet = 0,15 × 400 + 0,05 × 3.000 = 60 + 150 = **210 TL**; toplam = 1.000 × 210 = **210.000 TL**.


    **(b) Eski karşılık ve bakiye**


    - Eski karşılık gözden geçirilir ve en iyi tahmini yansıtacak şekilde düzeltilir (par. 59): 90.000 − 55.000 = 35.000;
    yeni tahmin 25.000 → iptal gelir = **10.000 TL**.

    - 2026 satışları için bakiye = 210.000 − 45.000 = 165.000 (harcamalar yalnızca ilk ayrılan karşılıkla mahsup edilir, par.
    62).

    - 31.12.2026 toplam karşılık = 25.000 + 165.000 = **190.000 TL**

    - Net karşılık gideri = 210.000 − 10.000 = **200.000 TL**


    **(c) Ertelenmiş vergi ve kayıtlar**


    - İndirilebilir geçici fark = 190.000 (vergiye esas değer 0) → ertelenmiş vergi varlığı = **47.500 TL** (TMS 12 par. 24).

    - Garanti Gider Karşılığı (B) 210.000 / Garanti Karşılığı (A) 210.000

    - Garanti Karşılığı (B) 10.000 / Karşılık İptali (Diğer Gelir) (A) 10.000

    - Garanti Karşılığı (B) 100.000 / Bankalar (A) 100.000 (yıl içi onarım ödemeleri)

    '
