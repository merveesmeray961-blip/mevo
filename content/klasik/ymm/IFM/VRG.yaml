  soru: "**Orion Elektronik AŞ**'nin 31.12.2026 tarihli TFRS finansal tabloları hazırlanırken şu konular incelenmektedir\n\
    (kurumlar vergisi oranı %25; VUK kayıtlarında bu konularla ilgili karşılık ayrılmamıştır):\n\n1. **Garanti:** 2026'da\
    \ 20.000 cihaz bir yıl garantili satılmıştır. Geçmiş deneyime göre cihazların %90'ında arıza\n   çıkmayacağı, %8'inde\
    \ cihaz başına 500 TL'lik küçük onarım, %2'sinde cihaz başına 3.000 TL'lik değişim gerekeceği\n   tahmin edilmektedir.\
    \ 2026'da bu satışlar için 600.000 TL garanti harcaması yapılmış ve VUK'ta gider yazılmıştır.\n   Dönem başında garanti\
    \ karşılığı yoktur.\n2. **Yeniden yapılandırma:** Yönetim kurulu 15.12.2026'da bir üretim hattının kapatılmasına karar\
    \ vermiş; ayrıntılı\n   resmî plan hazırlanmış ve 20.12.2026'da etkilenen çalışanlara ve tedarikçilere duyurulmuştur.\
    \ Tahmini harcamalar:\n   işten çıkarılacak çalışanların kıdem ve ihbar tazminatları 900.000 TL; kalan çalışanların yeniden\
    \ eğitimi\n   200.000 TL; yeni dağıtım ağına yatırım 300.000 TL; kapanışa kadar beklenen faaliyet zararları 400.000 TL.\
    \ Hattaki\n   makinelerin satışından 250.000 TL kazanç beklenmektedir.\n3. **Sahanın eski hâline getirilmesi:** 1.1.2026'da\
