    ile diğer kapsamlı gelir arasındaki dağılımını bulunuz. (7 puan)

    '
  cozum: '**(a) Nitelik ve ölçüm**


    Düzenlemelerde kıdem tazminatı olarak adlandırılan faydalar iş ilişkisinin sona erdirilmesi nedeniyle sağlanan faydalar
    değil, **iş ilişkisi sonrasında sağlanan faydalar** olarak dikkate alınır (TMS 19). Plan işletmeyi yükümlülükten kurtarmadığı
    için tanımlanmış fayda planıdır; yükümlülük öngörülen yükümlülük yöntemiyle (hizmetle orantılı olarak tahakkuk eden fayda
    yöntemi) ölçülür (par. 68) ve iskonto oranı özel sektör tahvillerinden yüksek kaliteli olanların raporlama dönemi sonundaki
    piyasa getirilerine bakılarak belirlenir (par. 83).


    **(b) Yükümlülük ve tutarlar**


    | Kalem | TL |

    |---|---|

    | 1.1.2026 yükümlülük | 2.000.000 |

    | + Cari dönem hizmet maliyeti | 380.000 |

    | + Faiz maliyeti (%20 × 2.000.000) | 400.000 |

    | − Ödenen tazminat | (150.000) |

    | + Aktüeryal kayıp | 270.000 |

    | **31.12.2026 yükümlülük** | **2.900.000** |


    - Kâr veya zarara: hizmet maliyeti 380.000 (personel gideri) + faiz maliyeti 400.000 (finansman gideri) = **780.000 TL**.

    - Diğer kapsamlı gelire: aktüeryal kayıp (yeniden ölçüm) **270.000 TL**; yeniden ölçümler sonraki dönemlerde kâr veya
    zarara yeniden sınıflandırılmaz.


    **(c) Kayıtlar ve ertelenmiş vergi**


    1. Personel Gideri (B) 380.000 / Kıdem Tazminatı Karşılığı (A) 380.000

    2. Finansman Gideri (B) 400.000 / Kıdem Tazminatı Karşılığı (A) 400.000

    3. Kıdem Tazminatı Karşılığı (B) 150.000 / Bankalar (A) 150.000

    4. Diğer Kapsamlı Gelir: Aktüeryal Kayıplar (B) 270.000 / Kıdem Tazminatı Karşılığı (A) 270.000

    5. Ertelenmiş Vergi Varlığı (B) 225.000 / Ertelenmiş Vergi Geliri (A) 157.500 / Diğer Kapsamlı Gelir: Aktüeryal Kayıpların
    Vergi Etkisi (A) 67.500


    İndirilebilir geçici fark yükümlülüğün tamamıdır (vergiye esas değer sıfır): ertelenmiş vergi varlığı 500.000 → 725.000,
    artış 225.000 TL. Bunun 67.500 TL''si (270.000 × %25) diğer kapsamlı gelirde, 157.500 TL''si kâr veya zararda muhasebeleştirilir;
    çünkü kâr veya zarar dışında muhasebeleştirilen kalemlerin vergisi de aynı yerde muhasebeleştirilir (TMS 12 par. 61A).

    '
