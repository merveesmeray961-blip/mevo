  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 53
    alinti: Bir karşılığa ilişkin yükümlülüğün yerine getirilmesi için gerekli harcamaların bir kısmının veya tamamının diğer
      bir taraf tarafından tazmin edilmesi beklendiğinde, ilgili tazminat ancak ve ancak, işletmenin yükümlülüğü yerine getirmesi
      durumunda tazminatın elde edileceğinin kesine yakın olması durumunda muhasebeleştirilir. Söz konusu tazminat, ayrı bir
      varlık gibi işleme tabi tutulur. Tazminata ilişkin olarak muhasebeleştirilen tutar karşılık tutarını geçemez.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 57
    alinti: Bazı durumlarda, işletme üçüncü tarafın ödemeyi yapmaması halinde ihtilaf konusu maliyetlerden sorumlu olmayacaktır.
      Böyle bir durumda, ilgili işletmenin anılan maliyetlere ilişkin herhangi bir sorumluluğu olmaz ve bunlar karşılık tutarına
      dahil edilmez.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 54
    alinti: Herhangi bir karşılık gideri, buna ait tazminata ilişkin muhasebeleştirilen tutar düşüldükten sonra bulunacak
      net tutarıyla gelir tablosunda yer alabilir.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 31
    alinti: İşletme, koşullu varlıklarını finansal tablolarına yansıtmaz.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 34
    alinti: Koşullu varlıklar, ekonomik faydaların işletmeye girişleri olası ise, 89'uncu paragrafta belirtilen şekilde finansal
      tablo dipnotlarında açıklanır.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 45
    alinti: Paranın zaman değerinin etkisinin önemli olduğu durumlarda karşılık tutarı, yükümlülüğün yerine getirilmesi için
      gerekeceği tahmin edilen giderlerin bugünkü değeridir.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 60
    alinti: İskonto etme işleminin kullanıldığı durumlarda, zamanın geçişini yansıtmak amacıyla her bir dönem ilgili karşılığın
      defter değeri artar. Söz konusu artış, borçlanma maliyeti olarak muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 24
    alinti: İndirilebilir bütün geçici farklar için, ileriki dönemlerde bu farkların indirilmesine yetecek kadar vergiye tabi
      gelir oluşacağının muhtemel olması koşuluyla ertelenmiş vergi varlığı muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 74
    alinti: 'Bir işletme ertelenmiş vergi varlığı ile ertelenmiş vergi borcunu ancak ve ancak aşağıdaki durumlarda mahsup
      eder:'
  gecerlilik:
    baslangic: '2006-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'karsilik1 = 3400000 - 400000

      tazminat = 1800000

      net1 = karsilik1 - tazminat

      karsilik2 = round(2662000 / 1.1 ** 3)

      faiz2027 = round(karsilik2 * 0.10)

      dta = (karsilik1 + karsilik2) * 0.25

      dtl = tazminat * 0.25

      net_dt = dta - dtl

      onceki = net1 + karsilik2

      sonuc = {"a_karsilik": karsilik1, "a_tazminat": tazminat, "a_net_gider": net1, "b_karsilik": karsilik2, "b_faiz": faiz2027,
      "c_dta": dta, "c_dtl": dtl, "c_net": net_dt, "d_vergi_oncesi": onceki, "d_net_etki": onceki - net_dt}

      '
