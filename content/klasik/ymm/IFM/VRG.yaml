    \ | – |\n| **Toplam** | | **796.250** | **650.000** | **146.250** | **83.750** | **62.500** |\n\nKıdemde kâr veya zarara\
    \ yansıyan net artış (700.000 − 500.000) × %25 = 50.000 TL; aktüeryal kaybın vergisi DKG'de\nizlenir (TMS 12.61A): 250.000\
