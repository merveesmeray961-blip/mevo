    VUK''a göre tüm gruplar maliyet bedeliyle izlenmektedir; işletme, VUK md. 274''te tanınan emsal bedeli ölçüsünü hiçbir
    grup için kullanmamıştır. Stok değer düşüklüğü karşılığı hiç ayrılmamıştır.


    **İstenenler**


    (a) VUK md. 274 ile TMS 2''nin değerleme ölçütleri arasındaki farkı belirtiniz; A ve B grupları için VUK''a göre emsal
    bedeli uygulanıp uygulanamayacağını satış bedelindeki düşüş yüzdesiyle değerlendiriniz. (6 puan)


    (b) Her grup için net gerçekleşebilir değeri ve TFRS''ye göre ayrılması gereken değer düşüklüğünü hesaplayınız. (8 puan)


