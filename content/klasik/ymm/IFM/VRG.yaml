    alinti: 'Bir işletme dönem vergi varlığı ile dönem vergi borcunu ancak ve ancak aşağıdaki durumlarda mahsup edebilir:
      (a) Yasal olarak, muhasebeleştirilmiş tutarları birbirlerine mahsup etme vardır ve (b) Ya net tutar üzerinden ödeme
      veya tahsilat yapacaktır ya da tahsilatı ve ödemeyi ayrı ayrı ancak aynı anda yapacaktır.'
