  soru: 'Marmara Enerji AŞ, 1.1.2026''da bir güneş enerji santralini kurmuş ve kullanıma hazır hâle getirmiştir. Santralin
    kurulum bedeli nakden ödenmiştir. Faydalı ömrü 5 yıl olan santral için kurulum alanının kira sözleşmesi gereği 31.12.2030''da
    santralin sökülmesi ve alanın eski hâline getirilmesi zorunludur (yasal yükümlülük); söküm maliyeti 31.12.2030''da 1.000.000
    TL olarak tahmin edilmektedir. Riske göre ayarlı vergi öncesi iskonto oranı %10, 5 yıllık bugünkü değer faktörü 0,620921''dır.
    Santralin söküm karşılığı dâhil toplam ilk maliyeti 5.000.000 TL''dir; doğrusal amortisman uygulanacak ve kalıntı değer
    sıfırdır. Söküm tahmini ve iskonto oranı 2026 boyunca değişmemiştir.


    **İstenenler**


    (a) 1.1.2026''da muhasebeleştirilecek söküm karşılığını, nakden ödenen kurulum bedelini hesaplayınız ve ilk kayıt yevmiyesini
    yapınız. (8 puan)


    (b) 2026 amortisman giderini, karşılığın iskonto etkisini (zaman geçişi) ve 31.12.2026 karşılık bakiyesini bulunuz; kayıtları
    yapınız. (8 puan)


    (c) Karşılığın iskonto edilmesinin gerekçesini ve iskonto etkisinin kâr veya zararda nasıl gösterileceğini açıklayınız.
    (4 puan)

    '
  cozum: '**(a) İlk muhasebeleştirme**


    Paranın zaman değerinin etkisi önemli olduğundan karşılık, yükümlülüğün yerine getirilmesi için gerekecek harcamaların
    bugünkü değeridir (TMS 37 par. 45). Söküm yükümlülüğü santralin kurulmasıyla doğan yasal yükümlülüktür ve karşılığın tutarı
    varlığın maliyetine eklenir (TMS 16 par. 16(c)).


    - Söküm karşılığı = 1.000.000 × 0,620921 = **620.921 TL**

    - Nakden ödenen kurulum bedeli = 5.000.000 − 620.921 = **4.379.079 TL**


    Kayıt: Santral (Tesis, Makine ve Cihazlar) (B) 5.000.000 / Bankalar (A) 4.379.079 / Söküm ve Eski Hale Getirme Karşılığı
    (A) 620.921


    **(b) 2026**


    - Amortisman = 5.000.000 / 5 = **1.000.000 TL** → Amortisman Gideri (B) / Birikmiş Amortisman (A)

    - İskonto etkisi = 620.921 × %10 = **62.092 TL** → Finansman Gideri (B) 62.092 / Söküm Karşılığı (A) 62.092

    - 31.12.2026 karşılık bakiyesi = 620.921 + 62.092 = **683.013 TL**


    **(c) Gerekçe**


