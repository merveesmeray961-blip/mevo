    %25''tir; ilgili farkların satış yoluyla geri kazanılacağı varsayılacaktır.


    | Varlık | Yeniden değerleme öncesi defter değeri = vergiye esas değer | Yeniden değerlenmiş tutar |

    |---|---|---|

    | Arsa | 3.000.000 | 4.400.000 |

    | Bina | 2.000.000 | 2.600.000 |


    **İstenenler**


    (a) Yeniden değerleme artışlarının toplamını, bu artıştan doğan ertelenmiş vergi yükümlülüğünü ve özkaynaklarda gösterilecek
    net artışı hesaplayınız. (8 puan)


    (b) 31.12.2026 tarihli yevmiye kaydını (hesap adlarıyla) yapınız. (6 puan)


    (c) Ertelenmiş verginin neden kâr veya zararda değil, diğer kapsamlı gelirde (özkaynakta) muhasebeleştirildiğini ve amortismana
    tabi olmayan arsa için ertelenmiş vergi hesabında nasıl bir ölçüm esası izleneceğini açıklayınız. (6 puan)

    '
  cozum: '**(a) Hesaplar**


    - Arsa artışı = 4.400.000 − 3.000.000 = 1.400.000; bina artışı = 2.600.000 − 2.000.000 = 600.000

    - Toplam yeniden değerleme artışı = **2.000.000 TL** (defter değeri vergi esasını aştığı için vergiye tabi geçici fark)

    - Ertelenmiş vergi yükümlülüğü = 2.000.000 × %25 = **500.000 TL**

    - Özkaynakta (yeniden değerleme artışı fonu) net artış = 2.000.000 − 500.000 = **1.500.000 TL**


    **(b) Kayıt**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Arsalar | 1.400.000 | |

    | Binalar | 600.000 | |

    | Ertelenmiş Vergi Yükümlülüğü | | 500.000 |

    | Diğer Kapsamlı Gelir: Yeniden Değerleme Artışları (özkaynak) | | 1.500.000 |


    **(c) Gerekçe**


    Kâr veya zarar dışında (diğer kapsamlı gelirde veya doğrudan özkaynakta) muhasebeleştirilen kalemlerle ilgili dönem vergisi
    ve ertelenmiş vergi de aynı şekilde kâr veya zarar dışında muhasebeleştirilir (TMS 12 par. 61A); yeniden değerleme artışı
    diğer kapsamlı gelirde yer aldığı için ona bağlı ertelenmiş vergi de oradadır. Yeniden değerlenen amortismana tabi olmayan
    bir varlıkta (arsa) ertelenmiş vergi, varlığın defter değerinin satış yoluyla geri kazanılacağı varsayımının vergisel
