    puan: 4
  - olcut: (b) Kalıcı farklarda EV doğmadığının gerekçesi
    puan: 1
  - olcut: (b) 289/696, 695/489 ve mahsup kayıtları; net 120.000 TL yükümlülük
    puan: 3
  - olcut: (c) Cari vergi 1.165.000 TL
    puan: 1
  - olcut: (c) TFRS vergi öncesi kâr 5.480.000 TL
    puan: 2
  - olcut: (c) Toplam vergi gideri 1.285.000 TL ve net kâr 4.195.000 TL
    puan: 2
  - olcut: (d) Mutabakat
    puan: 3
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 5, 15, 24, 74
    alinti: Bütün vergiye tabi geçici farklar için ertelenmiş vergi yükümlülüğü muhasebeleştirilir.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 69
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 33, 35
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 14, 39
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "evv = (320000 + 250000 + 210000) * 0.25\nevy = (100000 + 1160000) * 0.25\ncari = (5000000 + 60000 - 400000) *\
      \ 0.25\nvok = 5000000 - 320000 + 100000 + 160000 + 1000000 - 250000 - 210000\ntop = cari + evy - evv\nsonuc = {\"evv\"\
      : evv, \"evy\": evy, \"net\": evy - evv, \"mali\": 4660000, \"cari\": cari, \"vok\": vok, \"top\": top,\n         \"\
      net_kar\": vok - top, \"mut\": vok * 0.25, \"etkin\": round(top / vok * 100, 2)}\n"
