  soru: 'Doruk Enerji AŞ''nin fonlanan, emeklilik sonrası tanımlanmış fayda planına ilişkin 2026 verileri aşağıdadır (tüm
    nakit hareketleri 31.12.2026''da gerçekleşmiştir; vergi etkisi dikkate alınmayacaktır). İskonto oranı %18''dir.


    | Kalem | Tutar (TL) |

    |---|---|

    | 1.1.2026 tanımlanmış fayda yükümlülüğü | 5.000.000 |

    | 1.1.2026 plan varlıklarının gerçeğe uygun değeri | 3.800.000 |

    | 2026 cari dönem hizmet maliyeti | 500.000 |

    | 2026''da plandan ödenen faydalar | 400.000 |

    | İşletmenin plana yaptığı katkı | 700.000 |

    | Plan varlıklarının 2026 gerçek getirisi | 600.000 |

    | Varsayım değişikliğinden doğan yükümlülük artışı (aktüeryal kayıp) | 300.000 |


    **İstenenler**


    (a) 31.12.2026 tanımlanmış fayda yükümlülüğünü, plan varlıklarının gerçeğe uygun değerini ve tanımlanmış net fayda borcunu
    hesaplayınız. (8 puan)


    (b) Net faizi ve kâr veya zarara yansıyacak tutarı; diğer kapsamlı gelirde gösterilecek toplam yeniden ölçüm tutarını
    bulunuz. (7 puan)


    (c) Net fayda borcunun yıl içi hareketini (açılış + kâr/zarar + DKG − katkı) kontrol ediniz ve diğer kapsamlı gelir kaleminin
    sonradan kâr veya zarara aktarılıp aktarılmayacağını belirtiniz. (5 puan)

    '
  cozum: '**(a) Bakiyeler**


    - Yükümlülük = 5.000.000 + 500.000 (hizmet) + 900.000 (faiz maliyeti = %18 × açılış) − 400.000 + 300.000 = **6.300.000
    TL**

    - Plan varlıkları = 3.800.000 + 700.000 − 400.000 + 600.000 = **4.700.000 TL**

    - Tanımlanmış net fayda borcu = 6.300.000 − 4.700.000 = **1.600.000 TL** (açılış: 1.200.000 TL)


    **(b) Kâr veya zarar ve DKG**


    - Net faiz = açılış net borç × iskonto oranı = 1.200.000 × %18 = **216.000 TL** (faiz maliyeti 900.000 − plan varlığı
    faiz geliri 684.000); TMS 19 par. 123.

    - Kâr veya zarara yansıyan tutar = hizmet maliyeti 500.000 + net faiz 216.000 = **716.000 TL gider**

    - Plan varlıkları yeniden ölçümü = gerçek getiri 600.000 − faiz geliri 684.000 = -84.000 (kayıp)

    - Toplam yeniden ölçüm (DKG) = −300.000 + (-84.000) = **-384.000 TL** (kayıp)


    **(c) Kontrol**


    Net borç: 1.200.000 + 716.000 (kâr/zarar) + 384.000 (DKG kaybı) − 700.000 (katkı) = **1.600.000 TL** ✓. Yeniden ölçümler
    diğer kapsamlı gelirde muhasebeleştirilir ve sonraki dönemlerde kâr veya zarara yeniden sınıflandırılmaz (TMS 19 par.
    122).

    '
  puanlama:
  - olcut: (a) Yükümlülük, plan varlıkları ve net borç
