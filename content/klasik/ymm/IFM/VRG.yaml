    \ 300.000 = 2.600.000 TL; ertelenmiş vergi varlığı = **650.000 TL**.\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 289\
    \ Ertelenmiş Vergi Varlığı | 650.000 | |\n| 696 Ertelenmiş Vergi Geliri | | 650.000 |\n"
