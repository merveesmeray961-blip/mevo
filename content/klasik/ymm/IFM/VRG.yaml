- id: YMM-IFM-VRG-K016
  sinav: ymm
  ders: IFM
  konu: VRG
  kazanimlar:
  - TMS 37 karşılıklar ve koşullu yükümlülükler
  - TMS 36 varlıklarda değer düşüklüğü
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: 'Güven Mühendislik AŞ, 15.11.2026''da bir kamu kurumuyla sabit fiyatlı bir makine imalatı sözleşmesi imzalamıştır
    (sözleşme bedeli 1.200.000 TL; imalat 2027''de yapılacak, 31.12.2026''ya kadar hiçbir maliyete katlanılmamıştır). Hammadde
    fiyatlarındaki sert artış nedeniyle sözleşmenin yerine getirilmesine ilişkin tahmin edilen maliyetler:


    | Kalem | Tutar (TL) |

    |---|---|

    | Doğrudan hammadde | 800.000 |

    | Doğrudan işçilik | 380.000 |

    | Sözleşmenin yerine getirilmesinde kullanılacak özel makinenin amortisman payı | 120.000 |

    | Genel yönetim giderlerinden sözleşmeye dağıtılan pay (sözleşme olmasa da katlanılacak) | 90.000 |


    Sözleşmenin iptal edilmesi hâlinde işletme kamu kurumuna 250.000 TL cezai şart ödeyecektir. Sözleşmede kullanılacak varlıklarda
    değer düşüklüğü bulunmamaktadır.


    **İstenenler**


    (a) Sözleşmenin TMS 37 anlamında ekonomik açıdan dezavantajlı olup olmadığını belirleyiniz; sözleşmeyi yerine getirme
    maliyetinde hangi kalemlerin dikkate alınacağını gerekçelendiriniz ve maliyeti hesaplayınız. (8 puan)


    (b) 31.12.2026''da ayrılacak karşılık tutarını hesaplayınız ve yevmiye kaydını yapınız. (7 puan)


    (c) Cezai şartın 60.000 TL olması hâlinde karşılığın ne olacağını hesaplayınız; sözleşmeyle ilgili varlıklarda değer düşüklüğü
    bulunsaydı sıranın ne olacağını belirtiniz. (5 puan)

    '
  cozum: '**(a) Dezavantajlı sözleşme**


    Sözleşmeden kaçınılamaz maliyetler, beklenen ekonomik faydaları aştığı için sözleşme dezavantajlıdır; mevcut yükümlülük
    karşılık olarak muhasebeleştirilir ve ölçülür (TMS 37 par. 66). Sözleşmeyi yerine getirme maliyeti, sözleşmeyle doğrudan
    ilgili maliyetlerden oluşur: değişken maliyetler (hammadde, işçilik) ile sözleşmenin yerine getirilmesinde kullanılan
    maddi duran varlığın amortismanından dağıtılan tutar (par. 68A). Sözleşme olmasa da katlanılacak genel yönetim payı doğrudan
    ilgili değildir; hariç tutulur.


    Yerine getirme maliyeti = 800.000 + 380.000 + 120.000 = **1.300.000 TL**; sözleşme geliri 1.200.000 TL.


    **(b) Karşılık**


    Kaçınılamaz maliyet, sözleşmeyi yerine getirmenin net maliyeti (1.300.000 − 1.200.000 = 100.000 TL) ile sözleşmeyi yerine
    getirmemekten doğan ceza (250.000 TL) tutarlarından **düşük olanıdır**: min(100.000; 250.000) = **100.000 TL**.


    Kayıt: Zarar Getiren Sözleşme Karşılık Gideri (B) 100.000 / Zarar Getiren Sözleşme Karşılığı (A) 100.000


