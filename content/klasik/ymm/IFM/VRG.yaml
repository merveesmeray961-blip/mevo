  - TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: 'Ege Makine AŞ, 1.1.2026''da bir müşteriye ürün satmış ve bedeli olarak vadesi 31.12.2027 olan 1.440.000 TL nominal
    değerli senet almıştır (vade 2 yıl; senet faizsizdir). Müşteriye benzer vadeli borçlanma için işletmenin kullanabileceği
    piyasa faizi yıllık %20''dir; satış sözleşmesi önemli bir finansman bileşeni içermektedir. VUK''a göre kayıtlarda satış
    1.440.000 TL hasılat, alacak ise 1.440.000 TL nominal değerle izlenmektedir (reeskont yapılmamıştır). Vergi oranı %25''tir
    (VUK''a göre alacağın vergiye esas değeri nominal tutardır).


    **İstenenler**


    (a) TFRS 15''e göre işlem bedelinin nasıl belirleneceğini ve hasılat ile faiz gelirinin sunumunu açıklayınız; VUK md.
    281 ile farkı belirtiniz. (6 puan)


    (b) 1.1.2026 itibarıyla hasılat tutarını, 2026 faiz gelirini ve 31.12.2026 TFRS defter değerini hesaplayınız. (7 puan)


    (c) 31.12.2026 düzeltme kayıtlarını (hesap adlarıyla) ve ertelenmiş vergi varlığını bulunuz; düzeltmenin 2026 vergi sonrası
    kârına etkisini hesaplayınız. (7 puan)

    '
  cozum: '**(a) Esaslar**


    Ödeme zamanlaması müşteriye ya da işletmeye finansman yararı sağlıyorsa işletme işlem bedelini belirlerken taahhüt edilen
    bedeli paranın zaman değerine göre düzeltir (TFRS 15 par. 60); finansmanın etkisi (faiz geliri) hasılattan ayrı olarak
    kapsamlı gelir tablosunda sunulur (par. 65). Sözleşme süresi bir yılı aştığı için par. 63''teki kolaylaştırıcı uygulama
    kullanılamaz. VUK md. 281''de alacaklar mukayyet değerle değerlenir; vadesi gelmemiş senede bağlı alacakların değerleme
    gününün kıymetine irca edilmesi **ihtiyaridir** ve oran olarak senet faizi ya da resmî iskonto haddi uygulanır; TFRS''de
    ise bu düzeltme zorunludur.


    **(b) Hesaplar**


    - 1.1.2026 hasılat (bugünkü değer) = 1.440.000 / (1,20)² = **1.000.000 TL**

    - 2026 faiz geliri = 1.000.000 × %20 = **200.000 TL**

    - 31.12.2026 TFRS defter değeri = 1.000.000 + 200.000 = **1.200.000 TL** (nominal 1.440.000)


    **(c) Düzeltme**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Yurtiçi Satışlar (hasılat azaltımı) | 440.000 | |

    | Senetli Alacaklar Reeskontu | | 240.000 |

    | Faiz Geliri | | 200.000 |

    | Ertelenmiş Vergi Varlığı | 60.000 | |

    | Ertelenmiş Vergi Geliri | | 60.000 |


    İndirilebilir geçici fark (vergi esası − defter) = 1.440.000 − 1.200.000 = 240.000 → DTA = **60.000 TL**. 2026 vergi öncesi
    etki = −440.000 + 200.000 = -240.000; vergi sonrası etki = -240.000 + 60.000 = **-180.000 TL** (kâr azalır).

    '
