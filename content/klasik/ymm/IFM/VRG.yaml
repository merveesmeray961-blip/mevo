  cozum: "**(a) Garanti karşılığı**\n\nKarşılık için üç koşul birlikte aranır: geçmiş olaydan doğan mevcut (hukuki veya zımni)\
    \ yükümlülük, ekonomik fayda\nçıkışının muhtemel olması ve tutarın güvenilir tahmini (TMS 37.14). Çok sayıda kalemden\
    \ oluşan yükümlülük **beklenen\ndeğerle** ölçülür (TMS 37.39).\n\n- Beklenen garanti maliyeti = 20.000 × (%8 × 500 + %2\
    \ × 3.000) = 20.000 × (40 + 60) = **2.000.000 TL**.\n- VUK'ta gider yazılan 600.000 TL harcama karşılıktan karşılanmış\
