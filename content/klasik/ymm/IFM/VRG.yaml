    alacak için 200.000 TL şüpheli alacak karşılığı ayırmış ve vergi matrahından indirmiştir; başka karşılık yoktur.


    **İstenenler**


    (a) VUK md. 323''teki şüpheli alacak ölçütleri ile TFRS 9''daki beklenen kredi zararı yaklaşımı arasındaki farkı açıklayınız;
    ticari alacaklar için zarar karşılığının hangi tutarda ölçüleceğini belirtiniz. (6 puan)


    (b) Karşılık matrisiyle TFRS''ye göre gerekli zarar karşılığını ve alacakların net TFRS defter değerini hesaplayınız.
    (7 puan)


    (c) Gerekli ek karşılığı, düzeltme kayıtlarını ve ertelenmiş vergi varlığını bulunuz. (7 puan)

    '
  cozum: '**(a) Fark**


    VUK md. 323, belirli şüpheli alacak hâllerini (örn. dava veya icra safhasındaki alacaklar) sayar ve bu alacaklar için
    karşılık ayrılmasına **izin verir**; yani ölçüt gerçekleşmiş şüphedir. TFRS 9''da ise ticari alacaklar için (önemli finansman
    bileşeni içermeyenlerde) zarar karşılığı her zaman **ömür boyu beklenen kredi zararlarına** eşit tutarda ölçülür (TFRS
    9 par. 5.5.15) ve bu hesaplamada karşılık matrisi kolaylaştırılmış uygulama olarak kullanılabilir (B5.5.35); vadesi geçmemiş
    alacaklar için de karşılık ayrılır.


    **(b) Hesap**


    | Dilim | Alacak | Oran | Karşılık |

    |---|---|---|---|

    | Vadesi geçmemiş | 2.000.000 | %1 | 20.000 |

    | 1-30 gün | 800.000 | %3 | 24.000 |

    | 31-90 gün | 600.000 | %10 | 60.000 |

    | 91-180 gün | 400.000 | %20 | 80.000 |

    | >180 gün | 200.000 | %50 | 100.000 |

    | **Toplam** | 4.000.000 | | **284.000** |


    Net TFRS defter değeri = 4.000.000 − 284.000 = **3.716.000 TL**.


    **(c) Düzeltme**


    - Ek karşılık = 284.000 − 200.000 = **84.000 TL**

    - Beklenen Kredi Zararı Gideri (B) 84.000 / Şüpheli Ticari Alacaklar Karşılığı (A) 84.000

    - Vergiye esas değer alacakların brüt tutarından VUK karşılığı düşülmüş tutardır; TFRS defter değeri bundan 84.000 TL
    düşüktür → indirilebilir geçici fark → Ertelenmiş Vergi Varlığı = 84.000 × %25 = **21.000 TL** (Ertelenmiş Vergi Varlığı
    (B) / Ertelenmiş Vergi Geliri (A)).

    '
