  soru: 'Aydın Ambalaj AŞ defterlerini VUK''a göre tutmakta, TFRS finansal tablolarını ise 31.12.2026''da düzeltme kayıtlarıyla
    hazırlamaktadır (vergi oranı %25; TFRS''ye ilk geçiş kapsamında 2025 etkileri açılış dağıtılmamış kârlara yansıtılacaktır,
    2025 ve 2026 yıllarında başka fark yoktur).


    1. **İlk tesis giderleri:** 1.1.2025''te şirketin kuruluşuyla ilgili 500.000 TL tutarında ilk tesis ve taazzuv gideri
    aktifleştirilmiş ve VUK''a göre 5 yılda eşit tutarlarda itfa edilmektedir (2025 ve 2026''da itfa payı ayrılmıştır).

    2. **Makine:** 1.1.2025''te 1.200.000 TL''ye alınan makine VUK''ta yıllık %10 oranla amortismana tabi tutulmuştur. İşletmenin
    teknik değerlendirmesine göre makinenin faydalı ömrü 6 yıl, kalıntı değeri sıfırdır.


    **İstenenler**


    (a) Her iki kalemin TFRS''ye göre nasıl muhasebeleştirileceğini ilgili standart ve VUK hükümlerini belirterek açıklayınız.
