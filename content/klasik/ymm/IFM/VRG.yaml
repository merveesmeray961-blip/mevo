      dönemlerde kar veya zararda yeniden sınıflandırılmaz.
  - mevzuat: TMS 19 Çalışanlara Sağlanan Faydalar
    madde: par. 83
    alinti: 'Aktüeryal varsayımlar: iskonto oranı 83 İş ilişkisi sonrasında sağlanan faydalara ilişkin yükümlülüklerin (fonlananların
      ve fonlanmayanların) iskonto edilmesinde kullanılan oranlar, özel sektör tahvillerinden yüksek kaliteli olanların raporlama
      dönemi sonundaki piyasa getirilerine bakılarak belirlenir.'
  - mevzuat: TMS 19 Çalışanlara Sağlanan Faydalar
    madde: par. 123
    alinti: 21 TMS 19 Tanımlanmış net fayda borcuna (varlığına) ilişkin net faiz 123 İşletme tanımlanmış net fayda borcuna
      (varlığına) ilişkin net faizi, tanımlanmış net fayda borcu (varlığı) ile 83’üncü paragrafta belirtilen iskonto oranının
      çarpımıyla belirler.
