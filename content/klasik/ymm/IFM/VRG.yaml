    \ 37.68) → karşılık **300.000 TL** (659 borç / 379 alacak).\n- **Dava (koşullu varlık):** Fayda girişi muhtemel olsa da\
    \ kesinleşmediğinden **varlık olarak kaydedilmez**; dipnotta\n  açıklanır (TMS 37.31–35).\n\nErtelenmiş vergi: karşılıklar\
