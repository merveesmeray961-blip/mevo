    \ iskonto oranı yıllık %20'dir; (1,20)^−5 = 0,401878.\n4. **Dezavantajlı sözleşme:** 2027'de bir müşteriye birimi 3.000\
    \ TL'den 1.000 birim teslim edilmesi taahhüt\n   edilmiştir. Maliyet artışları nedeniyle sözleşmenin yerine getirilmesinin\
