- id: YMM-IFM-VRG-K001
  sinav: ymm
  ders: IFM
  konu: VRG
  kazanimlar:
  - TMS 37 karşılıklar ve koşullu yükümlülükler
  - TMS 19 kıdem tazminatı karşılığı
  - TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü
  - geçici farklar
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Veriler**


    Ertem AŞ, TFRS''ye göre finansal tablo hazırlamaktadır. Kurumlar vergisi oranı %25''tir ve dönem içinde değişmemiştir.
    31.12.2026 itibarıyla bilgiler şöyledir:


    1. **Dava A:** Bir müşteri, 2026''da teslim edilen hatalı ürünler nedeniyle 1.500.000 TL tazminat davası açmıştır. Avukatlara
    göre davanın kaybedilmesi muhtemeldir; ödenecek tutarın en iyi tahmini 900.000 TL''dir ve ödemenin 2027''de yapılması
    beklenmektedir.

    2. **Dava B:** Bir tedarikçi 400.000 TL''lik bir dava açmıştır. Avukatlara göre davanın kaybedilme olasılığı düşüktür
    ancak uzak değildir.

    3. **Kıdem tazminatı (fonlanmamış tanımlanmış fayda planı):**


    | Kalem | TL |

    |---|---|

    | 1.1.2026 tanımlanmış fayda yükümlülüğü | 1.600.000 |

    | 2026 cari dönem hizmet maliyeti | 200.000 |

    | Dönem başında belirlenen iskonto oranı | %15 |

    | 31.12.2026''da ödenen kıdem tazminatı | 300.000 |

    | 31.12.2026 aktüeryal değerlemeye göre yükümlülük | 1.900.000 |


    4. **Makine:** Defter değeri 1.1.2026''da 1.800.000 TL, 31.12.2026''da 2.000.000 TL (yıl içinde ilave yapılmıştır); vergiye
    esas değeri 1.1.2026''da 1.300.000 TL, 31.12.2026''da 1.400.000 TL''dir.


    **Ek bilgiler:** Dava ve kıdem tazminatı ödemeleri vergi açısından yalnız ödendikleri dönemde indirilebilir. 1.1.2026''da
    dava karşılığı yoktur; açılıştaki tek geçici farklar kıdem tazminatı ve makineden kaynaklanmaktadır. İndirilebilir geçici
    farkların kullanılmasına yetecek vergiye tabi kâr elde edilmesi muhtemeldir; ertelenmiş vergi varlık ve borçlarının mahsup
    koşulları sağlanmaktadır.


    **İstenenler**


    (a) Dava A ve Dava B''nin TMS 37''ye göre finansal tablolarda nasıl gösterileceğini gerekçesiyle açıklayınız; gerekli
    kaydı yapınız. (6 puan)


    (b) Kıdem tazminatına ilişkin 2026 yılında kâr veya zararda ve diğer kapsamlı gelirde muhasebeleştirilecek tutarları hesaplayınız;
    ilgili kayıtları yapınız. (7 puan)


    (c) 1.1.2026 ve 31.12.2026 tarihli net ertelenmiş vergi tutarlarını hesaplayınız; 2026 ertelenmiş vergi değişiminin kâr
    veya zarar ile diğer kapsamlı gelir arasındaki dağılımını gösteriniz ve kaydını yapınız. (12 puan)

    '
  cozum: '**(a) Davalar (TMS 37 par. 14, 27-28, 36)**


    - **Dava A:** Geçmiş olaydan (hatalı teslim) doğan mevcut yükümlülük vardır, kaynak çıkışı muhtemeldir ve tutar güvenilir
    biçimde tahmin edilebilmektedir; par. 14''teki üç koşul sağlandığından en iyi tahmin olan **900.000 TL karşılık** ayrılır.
    Kayıt: 654 Karşılık Giderleri (B) 900.000 / 379 Diğer Borç ve Gider Karşılıkları (A) 900.000 (ödeme 2027''de beklendiğinden
    kısa vadeli).

    - **Dava B:** Kaynak çıkışı muhtemel olmadığından karşılık ayrılmaz; olasılık uzak olmadığından **koşullu yükümlülük olarak
    dipnotlarda açıklanır** (par. 27-28, 86). Kayıt yapılmaz.


    **(b) Kıdem tazminatı (TMS 19 par. 120, 122, 123)**


    | Kalem | TL |

    |---|---|

    | Açılış yükümlülüğü | 1.600.000 |

    | Hizmet maliyeti (K/Z) | 200.000 |

    | Net faiz 1.600.000 × %15 (K/Z) — ödeme yıl sonunda | 240.000 |

    | Ödenen tazminat | (300.000) |

    | Beklenen kapanış | 1.740.000 |

    | Aktüeryal kapanış | 1.900.000 |

    | **Aktüeryal kayıp (DKG)** | **160.000** |


    - Kâr veya zarar: 200.000 + 240.000 = **440.000 TL gider**

    - Diğer kapsamlı gelir: **160.000 TL yeniden ölçüm kaybı**; sonraki dönemlerde kâr veya zarara aktarılmaz (par. 122).


    Kayıtlar:


    - 770 Genel Yönetim Giderleri (B) 200.000; 780 Finansman Giderleri (B) 240.000 / 472 Kıdem Tazminatı Karşılığı (A) 440.000

    - 472 Kıdem Tazminatı Karşılığı (B) 300.000 / 102 Bankalar (A) 300.000

    - Tanımlanmış Fayda Planları Yeniden Ölçüm Kayıpları (DKG – özkaynak) (B) 160.000 / 472 Kıdem Tazminatı Karşılığı (A)
    160.000


    **(c) Ertelenmiş vergi (TMS 12 par. 5, 8, 24, 47, 58, 61A, 74)**


    Borç niteliğindeki karşılıkların vergiye esas değeri, gelecekte indirilecek tutar düşüldüğünden sıfırdır; farkın tamamı
    indirilebilir geçici farktır.


    | Kalem | 1.1.2026 geçici fark | 31.12.2026 geçici fark |

    |---|---|---|

    | Kıdem tazminatı karşılığı (indirilebilir) | 1.600.000 | 1.900.000 |

    | Dava A karşılığı (indirilebilir) | – | 900.000 |

    | Makine (vergiye tabi): 1.800.000 − 1.300.000 / 2.000.000 − 1.400.000 | (500.000) | (600.000) |

    | **Net indirilebilir fark** | **1.100.000** | **2.200.000** |

    | **Net ertelenmiş vergi varlığı (%25)** | **275.000** | **550.000** |


    Dava B için geçici fark yoktur (finansal tablolara alınmış bir borç bulunmamaktadır).


    Dönem içi artış = 550.000 − 275.000 = **275.000 TL ertelenmiş vergi geliri**. Dağılım (par. 58, 61A):


    - Diğer kapsamlı gelir: aktüeryal kayıp 160.000 × %25 = **40.000 TL**

    - Kâr veya zarar: 275.000 − 40.000 = **235.000 TL** (sağlama: kıdemin K/Z kaynaklı artışı 140.000 × %25 = 35.000 + dava
    900.000 × %25 = 225.000 − makine 100.000 × %25 = 25.000 → 235.000)


    Kayıt (THP''de ayrı kodu olmayan kalemler adlarıyla):


    - Ertelenmiş Vergi Varlığı (B) 275.000 / Ertelenmiş Vergi Geliri (K/Z) (A) 235.000; DKG – Yeniden Ölçüm Kayıplarına İlişkin
    Ertelenmiş Vergi (özkaynak) (A) 40.000


    Böylece DKG''deki yeniden ölçüm kaybı vergi sonrası 120.000 TL olarak sunulur.

    '
  puanlama:
  - olcut: (a) Dava A için par. 14 koşullarının gerekçelendirilmesi ve 900.000 TL karşılık kaydı
    puan: 4
  - olcut: (a) Dava B'nin koşullu yükümlülük olarak yalnız dipnotta açıklanması
    puan: 2
  - olcut: (b) Net faizin 240.000 TL ve K/Z tutarının 440.000 TL bulunması
    puan: 3
  - olcut: (b) Aktüeryal kaybın 160.000 TL bulunup DKG'de, yeniden sınıflandırılmaksızın gösterilmesi
    puan: 2
  - olcut: (b) Kıdem tazminatı kayıtları
    puan: 2
  - olcut: (c) Açılış net ertelenmiş vergi varlığının 275.000 TL bulunması
    puan: 3
  - olcut: (c) Kapanış geçici farklarının doğru sınıflandırılması ve 550.000 TL bulunması (Dava B'nin dışarıda tutulması dahil)
    puan: 4
  - olcut: (c) Değişimin K/Z (235.000) ve DKG (40.000) arasında dağıtılması
    puan: 3
  - olcut: (c) Ertelenmiş vergi kaydı
    puan: 2
  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 14, 27-28, 36, 86
  - mevzuat: TMS 19 Çalışanlara Sağlanan Faydalar
    madde: par. 120, 122, 123, 127
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 8, 24, 58, 61A, 74
    alinti: Kar veya zarar dışında muhasebeleştirilmiş kalemlerle ilgili olan dönem vergisi ve ertelenmiş vergi de aynı dönemde
      veya farklı dönemlerde kar veya zarar dışında muhasebeleştirilir.
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
  dogrulama:
    python: "t = 0.25\nkarsilik = 900000\nfaiz = 1600000 * 0.15\nkz_kidem = 200000 + faiz\nbeklenen = 1600000 + 200000 + faiz\
      \ - 300000\naktuer = 1900000 - beklenen\nacilis = (1600000 - (1800000 - 1300000)) * t\nkapanis = (1900000 + karsilik\
      \ - (2000000 - 1400000)) * t\ndegisim = kapanis - acilis\ndkg = aktuer * t\nsonuc = {'dava_karsiligi': karsilik, 'net_faiz':\
      \ faiz, 'kz_kidem': kz_kidem, 'beklenen_kapanis': beklenen,\n         'aktueryal_kayip': aktuer, 'evv_acilis': acilis,\
      \ 'evv_kapanis': kapanis, 'degisim': degisim,\n         'dkg_vergi': dkg, 'kz_vergi_geliri': degisim - dkg}"
  durum: kontrolde
  surum: 1
