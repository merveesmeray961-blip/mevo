- id: YMM-IFM-VRG-K024
  sinav: ymm
  ders: IFM
  konu: VRG
  kazanimlar:
  - karşılık, tazminat varlığı ve koşullu varlık ayrımı (TMS 37)
  - karşılığın bugünkü değere indirilmesi ve zaman geçişi etkisi
  - ertelenmiş vergi varlığı/yükümlülüğü hesabı ve mahsup (TMS 12)
  zorluk: 3
  puan: 25
  sure_dk: 32
  soru: '**Veriler**


    Sakarya Kimya AŞ, yasal kayıtlarını VUK''a göre tutmakta ve TFRS''ye göre finansal tablo hazırlamaktadır. Kurumlar vergisi
    oranı %25''tir; 1.1.2026 itibarıyla ertelenmiş vergi bakiyesi yoktur. Yeterli vergiye tabi kâr elde edilmesi muhtemeldir
    ve ertelenmiş vergi varlıkları ile borçları için mahsup şartları sağlanmaktadır. VUK kayıtlarında aşağıdaki olaylar için
    henüz hiçbir kayıt yapılmamıştır; ilgili giderler ödendiği dönemde vergi matrahından indirilecek, sigorta tazminatı ise
    tahsil edildiği dönemde vergiye tabi gelir olacaktır.


    **Olay 1 – Çevre kirliliği.** 14.9.2026''da tesisten atık su sızıntısı olmuş, işletme kirliliği gidermekle yükümlü kılınmıştır.
    Temizleme maliyeti toplam 3.400.000 TL olup bunun 400.000 TL''sini sızıntıya neden olan taşıyıcı firma X, temizlik firmasına
    doğrudan ödemeyi yazılı olarak taahhüt etmiştir; X ödemezse işletme bu kısımdan sorumlu değildir. Kalan 3.000.000 TL''nin
    2027 içinde ödenmesi beklenmektedir (iskonto etkisi önemsizdir). İşletmenin sigorta poliçesi gereği, işletme maliyeti
    ödediğinde sigortacı 1.800.000 TL''yi işletmeye geri ödeyecektir; sigortacı bunu yazılı olarak kabul etmiştir ve geri
    ödeme kesine yakındır. İşletme ayrıca 500.000 TL ek tazminat talep etmiş, sigortacı reddetmiş, itiraz süreci sürmektedir;
    hukuk müşavirliği tahsilat olasılığını "olası ama kesine yakın değil" olarak değerlendirmektedir.


    **Olay 2 – Müşteri davası.** Bir müşterinin açtığı davada hukuk müşavirliği kaybetme olasılığını yüksek görmektedir. 31.12.2026
    itibarıyla en iyi tahmin, 31.12.2029''da 2.662.000 TL ödenmesidir. Vergi öncesi iskonto oranı %10''dur ve paranın zaman
    değerinin etkisi önemlidir.


    **İstenenler**


    (a) Olay 1 için 31.12.2026''da ayrılacak karşılığı, muhasebeleştirilecek tazminat varlığını ve muhasebeleştirilmeyecek
    kalemleri gerekçesiyle belirleyiniz; yevmiye kaydını ve gelir tablosundaki net gideri bulunuz. (8 puan)


    (b) Olay 2 için 31.12.2026 karşılığını hesaplayınız; 2027 yılında zamanın geçişinden kaynaklanan finansman giderini bulunuz.
    (6 puan)


    (c) 31.12.2026 itibarıyla ertelenmiş vergi varlığını ve yükümlülüğünü hesaplayınız; finansal durum tablosunda nasıl sunulacağını
    belirtiniz. (7 puan)


    (d) 2026 yılı vergi öncesi net gideri, ertelenmiş vergi gelirini ve net dönem etkisini bulunuz. (4 puan)

    '
  cozum: '**(a) Olay 1 (TMS 37 par. 14, 31, 34, 53, 54, 57)**


    | Kalem | Tutar | Gerekçe |

    |---|---|---|

    | Karşılık | 3.000.000 | Geçmiş olaydan (sızıntı) doğan mevcut yükümlülük, kaynak çıkışı muhtemel, tutar güvenilir tahmin
    edilebilir |

    | X''in doğrudan ödeyeceği kısım | 400.000 (karşılığa dahil edilmez) | X ödemezse işletme sorumlu değildir (par. 57) |

    | Sigorta geri ödemesi | 1.800.000 (ayrı varlık) | İşletme yükümlülüğü ödediğinde tahsilat kesine yakındır; karşılık tutarını
    (3.000.000) aşmaz (par. 53) |

    | Ek talep | 500.000 (muhasebeleştirilmez) | Koşullu varlık; kesine yakın olmadığından finansal tablolara alınmaz (par.
    31); tahsilat olası olduğundan dipnotta açıklanır (par. 34) |


    Yevmiye kaydı (31.12.2026):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Çevre temizleme gideri (karşılık gideri) | 3.000.000 | |

    | Dava ve çevre karşılıkları | | 3.000.000 |

    | Sigorta tazminat alacağı (diğer alacaklar) | 1.800.000 | |

    | Tazminat geliri / karşılık giderinden mahsup | | 1.800.000 |


    Gelir tablosunda karşılık gideri tazminat düşülerek net gösterilebilir (par. 54): 3.000.000 − 1.800.000 = **1.200.000
    TL net gider**.


    **(b) Olay 2 (par. 45, 60)**


    Karşılık = 2.662.000 / 1,1³ = **2.000.000 TL**. Kayıt: Dava karşılık gideri 2.000.000 (B) / Dava karşılıkları 2.000.000
    (A).

    2027 finansman gideri = 2.000.000 × %10 = **200.000 TL** (karşılığın defter değeri 2.200.000''e çıkar; artış borçlanma
    maliyetidir, par. 60).


    **(c) Ertelenmiş vergi (TMS 12 par. 24, 74)**


    | Kalem | Defter değeri | Vergiye esas değer | Fark | Ertelenmiş vergi (%25) |

    |---|---|---|---|---|

    | Çevre karşılığı | 3.000.000 | 0 | 3.000.000 indirilebilir | 750.000 varlık |

    | Dava karşılığı | 2.000.000 | 0 | 2.000.000 indirilebilir | 500.000 varlık |

    | Sigorta alacağı | 1.800.000 | 0 | 1.800.000 vergilendirilebilir | 450.000 yükümlülük |


    Brüt varlık 1.250.000, yükümlülük 450.000. Mahsup şartları sağlandığından (par. 74) finansal durum tablosunda **800.000
    TL net ertelenmiş vergi varlığı** sunulur. Kayıt: Ertelenmiş vergi varlığı 1.250.000 (B) / Ertelenmiş vergi yükümlülüğü
    450.000 (A) / Ertelenmiş vergi geliri 800.000 (A).


    **(d) 2026 dönem etkisi**


    | Kalem | Tutar |

    |---|---|

    | Çevre olayı net gider (3.000.000 − 1.800.000) | 1.200.000 |

    | Dava karşılık gideri | 2.000.000 |

    | **Vergi öncesi net gider** | **3.200.000** |

    | Ertelenmiş vergi geliri | (800.000) |

    | **Net dönem etkisi** | **2.400.000** |

    '
