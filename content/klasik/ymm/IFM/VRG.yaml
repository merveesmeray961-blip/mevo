- id: YMM-IFM-VRG-K002
  sinav: ymm
  ders: IFM
  konu: VRG
  kazanimlar:
  - VUK kayıtlarından TFRS düzeltme kayıtlarına geçiş
  - TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü
  - cari ve ertelenmiş vergi gideri
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Gamma AŞ** yasal kayıtlarını VUK'a göre tutmakta, yıl sonunda TFRS'ye uygun finansal tablolar için düzeltme\nkayıtları\
    \ yapmaktadır. 2026 yılı VUK'a göre ticari kârı (kurumlar vergisi öncesi) **5.000.000 TL**'dir. Kurumlar\nvergisi oranı\
    \ %25'tir; 1.1.2026 itibarıyla ertelenmiş vergi bakiyesi yoktur. Tespitler:\n\n1. 1.1.2026'da ödenen 400.000 TL kuruluş\
    \ ve örgütlenme gideri 262 hesapta aktifleştirilmiş, VUK'a göre 5 yılda\n   itfa edilerek 2026 için 80.000 TL itfa payı\
    \ gider yazılmıştır.\n2. 31.3.2027 vadeli, nominali 1.500.000 TL olan borç senedinin 31.12.2026 itibarıyla etkin faiz\
    \ yöntemiyle\n   hesaplanan bugünkü değeri 1.400.000 TL'dir; VUK kayıtlarında reeskont yapılmamıştır.\n3. 1.1.2026'da\
    \ 8.000.000 TL'ye alınan ve kira geliri elde etmek amacıyla tutulan bina VUK'a göre %2 oranıyla\n   amortismana tabi tutulmuş\
    \ (160.000 TL). İşletme TFRS'de yatırım amaçlı gayrimenkuller için gerçeğe uygun değer\n   modelini uygulamaktadır; binanın\
    \ 31.12.2026 gerçeğe uygun değeri 9.000.000 TL'dir.\n4. Avukat görüşüne göre kaybedilmesi muhtemel bir davada 250.000\
    \ TL ödeme yapılması beklenmektedir; VUK kayıtlarında\n   işlem yapılmamıştır.\n5. 2026'da satılan ürünler için garanti\
    \ yükümlülüğünün beklenen değeri 210.000 TL olarak tahmin edilmiş, VUK\n   kayıtlarında karşılık ayrılmamıştır (dönem\
    \ içinde garanti harcaması yapılmamıştır).\n6. 60.000 TL vergi ziyaı cezası 689 hesapta gider yazılmıştır.\n7. Tam mükellef\
    \ bir iştirakten alınan 400.000 TL kâr payı gelir yazılmıştır (KVK md. 5/1-a istisnası).\n\n**İstenenler:**\n\n(a) 1–5\
    \ numaralı kalemler için TFRS düzeltme kayıtlarını yapınız. (9 puan)\n\n(b) Her kalem için geçici fark türünü ve ertelenmiş\
    \ vergi tutarını gösteren tabloyu düzenleyiniz; 6 ve 7 numaralı\nkalemlerin ertelenmiş vergi bakımından durumunu açıklayınız;\
    \ ertelenmiş vergi kayıtlarını ve mahsup kaydını yapınız.\n(8 puan)\n\n(c) 2026 cari kurumlar vergisini, TFRS'ye göre\
    \ vergi öncesi kârı, toplam vergi giderini ve net dönem kârını\nhesaplayınız. (5 puan)\n\n(d) Toplam vergi giderinin muhasebe\
    \ kârına dayalı mutabakatını yapınız. (3 puan)\n"
  cozum: "**(a) TFRS düzeltme kayıtları**\n\n1. **Kuruluş gideri:** TMS 38.69 uyarınca kuruluş ve örgütlenme giderleri varlık\
    \ olarak muhasebeleştirilmez, gider\n   yazılır. VUK'ta gider yazılan 80.000 TL dışındaki 320.000 TL ayrıca gider yazılır.\n\
    \n| Hesap | Borç | Alacak |\n|---|---|---|\n| 770 Genel Yönetim Giderleri | 320.000 | |\n| 268 Birikmiş Amortismanlar\
    \ | 80.000 | |\n| 262 Kuruluş ve Örgütlenme Giderleri | | 400.000 |\n\n2. **Borç senedi:** TFRS 9'a göre borç itfa edilmiş\
    \ maliyetle ölçülür (1.400.000 TL).\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 322 Borç Senetleri Reeskontu (−) |\
    \ 100.000 | |\n| 647 Reeskont Faiz Gelirleri | | 100.000 |\n\n3. **Yatırım amaçlı gayrimenkul:** Gerçeğe uygun değer modelinde\
    \ amortisman ayrılmaz; değer değişimi kâr veya zarara\nalınır (TMS 40.35). Bina yatırım amaçlı gayrimenkul (ilave hesap)\
    \ olarak sınıflanır.\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 257 Birikmiş Amortismanlar | 160.000 | |\n| 770 Genel\
    \ Yönetim Giderleri (amortismanın iptali) | | 160.000 |\n| Yatırım Amaçlı Gayrimenkuller (ilave hesap) | 9.000.000 | |\n\
    | 252 Binalar | | 8.000.000 |\n| 649 Diğer Olağan Gelir ve Kârlar (GUD artışı) | | 1.000.000 |\n\n4. **Dava karşılığı\
    \ (TMS 37.14):** 659 Diğer Olağan Gider ve Zararlar borç / 379 Diğer Borç ve Gider Karşılıkları\n   alacak **250.000**.\n\
    5. **Garanti karşılığı (TMS 37.39):** 760 Pazarlama, Satış ve Dağıtım Giderleri borç / 379 Diğer Borç ve Gider\n   Karşılıkları\
    \ alacak **210.000**.\n\n**(b) Ertelenmiş vergi**\n\n| Kalem | TFRS defter değeri | Vergiye esas değer | Fark | Türü |\
    \ EV (%25) |\n|---|---|---|---|---|---|\n| 1 Kuruluş gideri | 0 | 320.000 | 320.000 | İndirilebilir | 80.000 varlık |\n\
    | 2 Borç senedi | 1.400.000 | 1.500.000 | 100.000 | Vergiye tabi | 25.000 yükümlülük |\n| 3 Bina | 9.000.000 | 7.840.000\
    \ | 1.160.000 | Vergiye tabi | 290.000 yükümlülük |\n| 4 Dava karşılığı | 250.000 | 0 | 250.000 | İndirilebilir | 62.500\
    \ varlık |\n| 5 Garanti karşılığı | 210.000 | 0 | 210.000 | İndirilebilir | 52.500 varlık |\n\n6 ve 7 numaralı kalemler\
    \ **kalıcı farktır**: vergi cezası hiçbir dönemde indirilemez, iştirak kazancı hiçbir dönemde\nvergilenmez. Defter değeri\
    \ ile vergiye esas değer arasında fark doğmadığından **ertelenmiş vergi hesaplanmaz**.\n\n| Hesap | Borç | Alacak |\n\
    |---|---|---|\n| 289 Ertelenmiş Vergi Varlığı | 195.000 | |\n| 696 Ertelenmiş Vergi Geliri | | 195.000 |\n| 695 Ertelenmiş\
    \ Vergi Gideri | 315.000 | |\n| 489 Ertelenmiş Vergi Yükümlülüğü | | 315.000 |\n| 489 Ertelenmiş Vergi Yükümlülüğü (mahsup,\
    \ TMS 12.74) | 195.000 | |\n| 289 Ertelenmiş Vergi Varlığı | | 195.000 |\n\nMahsup sonrası finansal durum tablosunda **120.000\
    \ TL** net ertelenmiş vergi yükümlülüğü gösterilir.\n\n**(c) Vergi ve kâr**\n\n- Mali kâr = 5.000.000 + 60.000 (KKEG)\
    \ − 400.000 (istisna) = 4.660.000 TL; cari vergi = **1.165.000 TL**\n  (691 borç / 370 alacak).\n- TFRS vergi öncesi kâr\
    \ = 5.000.000 − 320.000 + 100.000 + 160.000 + 1.000.000 − 250.000 − 210.000 = **5.480.000 TL**.\n- Toplam vergi gideri\
    \ = 1.165.000 + (315.000 − 195.000) = **1.285.000 TL**.\n- Net dönem kârı = 5.480.000 − 1.285.000 = **4.195.000 TL**.\n\
    \n**(d) Mutabakat**\n\n| Kalem | TL |\n|---|---|\n| Muhasebe kârı × %25 (5.480.000 × %25) | 1.370.000 |\n| + Kanunen kabul\
    \ edilmeyen gider etkisi (60.000 × %25) | 15.000 |\n| − İstisna kazanç etkisi (400.000 × %25) | (100.000) |\n| **Toplam\
    \ vergi gideri** | **1.285.000** |\n\nGeçici farklar mutabakatı bozmaz; etkin vergi oranını yalnız kalıcı farklar değiştirir\
    \ (1.285.000 / 5.480.000 = %23,45).\n"
  puanlama:
  - olcut: (a) Kuruluş giderinin giderleştirilmesi kaydı (320.000 / 80.000 / 400.000)
