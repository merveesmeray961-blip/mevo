    (b) 31.12.2026 tarihli düzeltme kayıtlarını (açılış dağıtılmamış kârlara yansıyan kısım, 2026 kâr veya zarar etkisi ve
    birikmiş farklar ayrı gösterilerek) yapınız. (8 puan)


    (c) 31.12.2026 ve 1.1.2026 ertelenmiş vergi varlığını, 2026 ertelenmiş vergi giderini ve düzeltmelerin 2026 net kârına
    etkisini hesaplayınız. (6 puan)

    '
  cozum: '**(a) TFRS muamelesi**


    - İlk tesis giderleri VUK''ta aktifleştirilerek beş yılda itfa edilir (VUK md. 326). TFRS''de ise kuruluş maliyetleri
    ile faaliyete başlanmasına ilişkin harcamalar maddi olmayan duran varlık olarak aktifleştirilemez, oluştuğunda gider yazılır
    (TMS 38 par. 69); dolayısıyla TFRS''de tamamı 2025''te gider olur.

    - VUK''ta amortisman Maliye Bakanlığınca ilan edilen oranlarla yapılır (VUK md. 315); TFRS''de amortismana tabi tutar
    varlığın yararlı ömrü boyunca sistematik olarak dağıtılır (TMS 16 par. 50). Yararlı ömür işletme beklentisine göre 6 yıldır.


    **(b) Kayıtlar (31.12.2026)**


    Kuruluş giderleri: VUK bakiyesi = 500.000 − 2 × 100.000 = 300.000 TL; 2025 TFRS gideri 500.000, VUK gideri 100.000 → açılış
    etkisi 400.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Geçmiş Yıllar Zararları (açılış etkisi) | 400.000 | |

    | Kuruluş ve Örgütlenme Giderleri (aktif kaydı kaldırma) | | 300.000 |

    | İtfa Gideri (2026 itfa payının iptali) | | 100.000 |


    Makine: yıllık VUK amortismanı 120.000, TFRS amortismanı 200.000; yıllık fark **80.000 TL**, birikmiş fark 160.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Geçmiş Yıllar Zararları (2025 farkı) | 80.000 | |

    | Amortisman Gideri (2026 farkı) | 80.000 | |

    | Birikmiş Amortisman | | 160.000 |


    **(c) Ertelenmiş vergi**


    - Kapanış: indirilebilir fark = vergi esası fazlası = 300.000 (kuruluş) + 160.000 (makine) → DTA = %25 × 460.000 = **115.000
    TL**

    - Açılış (1.1.2026): fark = 400.000 + 80.000 → DTA = **120.000 TL**

    - 2026 ertelenmiş vergi gideri = 120.000 − 115.000 = **5.000 TL**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Ertelenmiş Vergi Varlığı | 115.000 | |

    | Ertelenmiş Vergi Gideri | 5.000 | |

    | Geçmiş Yıllar Kârları (açılış etkisi) | | 120.000 |


    2026 net kâr etkisi = +100.000 (itfa iptali) − 80.000 (ek amortisman) − 5.000 (ertelenmiş vergi gideri) = **15.000 TL**.

    '
