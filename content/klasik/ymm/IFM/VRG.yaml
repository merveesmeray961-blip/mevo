  soru: 'Peker Grup''un konsolide finansal tablolarını hazırlayan ana ortaklık Peker AŞ ile bağlı ortaklıkları Peker Gıda
    AŞ (B) ve Peker Lojistik AŞ (C) 31.12.2026 itibarıyla aşağıdaki ertelenmiş vergi bakiyelerine sahiptir. Her şirket kendi
    vergi beyannamesini vermektedir (grup vergilendirmesi yoktur) ve hepsi aynı vergi idaresine bağlıdır.


    | Şirket | Ertelenmiş vergi varlığı | Ertelenmiş vergi yükümlülüğü |

    |---|---|---|

    | Peker AŞ (A) | 300.000 | 450.000 |

    | Peker Gıda AŞ (B) | 120.000 | 40.000 |

    | Peker Lojistik AŞ (C) | 0 | 200.000 |


    Ayrıca Peker AŞ''nin yıl içinde ödediği geçici vergiden doğan 600.000 TL dönem vergisi varlığı ile 500.000 TL dönem vergisi
    borcu vardır; yasal olarak bunları mahsup etme hakkı bulunmakta ve işletme net olarak ödemeyi/geri almayı düşünmektedir.


    **İstenenler**


    (a) Ertelenmiş vergi varlığı ile yükümlülüğünün hangi şartlarla mahsup edilebileceğini belirtiniz. (6 puan)


    (b) Konsolide finansal durum tablosunda gösterilecek ertelenmiş vergi varlığını ve ertelenmiş vergi yükümlülüğünü hesaplayınız.
    (8 puan)


    (c) A şirketinin dönem vergisi varlığı ve borcunun sunumunu belirtiniz; netleştirilen tutarı bulunuz. (6 puan)

    '
  cozum: '**(a) Şartlar (TMS 12 par. 74)**


    Ertelenmiş vergi varlığı ile borcu ancak ve ancak (i) yasal olarak dönem vergi varlıklarını dönem vergi borçlarına mahsup
    etme hakkı bulunması ve (ii) bunların aynı vergi idaresince konulan vergilerle ilgili olması hâlinde mahsup edilir; ilgili
    vergi mükellefi ya aynı işletme olmalı ya da farklı işletmeler olup gelecek her dönemde vergi borçlarını ve alacaklarını
    net esasa göre yerine getirmeyi ya da tahsilat ve ödemeyi aynı zamanda yapmayı amaçlamalıdır (TMS 12 par. 74).


    **(b) Konsolide sunum**


    | Şirket | Net |

    |---|---|

    | A | 300.000 − 450.000 = -150.000 (net yükümlülük 150.000) |

    | B | 120.000 − 40.000 = 80.000 (net varlık) |

    | C | 0 − 200.000 = -200.000 (net yükümlülük 200.000) |


    Her şirket ayrı vergi mükellefi olduğundan ve grup vergilendirmesi bulunmadığından, farklı şirketlerin bakiyeleri birbirinden
    mahsup edilmez. Konsolide tabloda ertelenmiş vergi varlığı = **80.000 TL** (B), ertelenmiş vergi yükümlülüğü = 150.000
    + 200.000 = **350.000 TL** (A ve C) olarak ayrı ayrı gösterilir.


    **(c) Dönem vergisi**


    Yasal mahsup hakkı ve net ödeme/geri alma niyeti bulunduğundan A şirketinin dönem vergisi varlığı ve borcu mahsup edilir:
    600.000 − 500.000 = **100.000 TL** dönem vergisi varlığı olarak gösterilir (TMS 12 par. 71).

    '
