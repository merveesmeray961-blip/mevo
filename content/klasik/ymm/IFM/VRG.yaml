    \ ayrılmaz (TMS 37.63) | – |\n| Beklenen makine satış kazancı | Ölçümde dikkate alınmaz (TMS 37.51) | – |\n| **Karşılık**\
    \ | | **900.000** |\n\n**(c) Sahanın eski hâline getirilmesi**\n\nRuhsat koşulu hukuki yükümlülüktür; zaman değeri önemli\
    \ olduğundan bugünkü değerle ölçülür (TMS 37.45) ve maliyet\nvarlığın maliyetine eklenir (TMS 16.16-c).\n\n- İlk ölçüm\
