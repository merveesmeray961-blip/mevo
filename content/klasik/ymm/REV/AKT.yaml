    **Bilgiler:**

    - 31.12.2025 itibarıyla teyit gönderilen alacak: PQR Ltd. 240.000 TL. PQR''ın yanıtı: 210.000 TL.

    - Stok hesabında kayıtlı 400 adet ürün (maliyet: 300 TL/adet). Sayım sonucu: 380 adet.


    **(a)** Alacak teyit farkı için YMM''nin izleyeceği adımları açıklayın. **(10 puan)**


    **(b)** Stok noksanını kayıt altına alın ve vergisel etkisini belirtin. **(10 puan)**

    '
  cozum: '**(a) Alacak Teyit Farkı**


    Fark = 240.000 - 210.000 = 30.000 TL


    YMM aşağıdaki olasılıkları araştırır:

    1. PQR''ın teyit tarihinden sonra 30.000 TL ödeme yapmış olup B A.Ş.''de kayda girmemiş olabilir.

    2. B A.Ş. tarafından PQR''a iade veya iskonto verilmiş olabilir.

    3. B A.Ş.''nin kayıt hatası ya da PQR''ın hatalı beyanı söz konusu olabilir.


    Her olasılık belgelerle (ödeme dekontu, iade faturası, muabere) araştırılır. Açıklanamayan fark çalışma kâğıdına bulgu
    olarak işlenir; tasdik etkisi değerlendirilir.


    **(b) Stok Noksanı**


    Noksanlık = (400 - 380) × 300 = 6.000 TL


    | Hesap | Borç (TL) | Alacak (TL) |

    |---|---|---|

    | 197 Sayım ve Tesellüm Noksanları | 6.000 | |

    | 153 Ticari Mallar | | 6.000 |


    Vergisel etki: Fire ve zayi listesi kapsamındaki kayıplar için VUK md. 278 prosedürü uygulanır. Belgelenemeyen stok noksanı
    KKEG sayılabilir; KDV açısından da teslim sayılma riski değerlendirilir.

    '
