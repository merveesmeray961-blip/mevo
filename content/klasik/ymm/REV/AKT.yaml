    Gün esasında amortisman, kıymetin kullanıma hazır olduğu tarihte başlar ve aktifte kaldığı gün kadar ayrılır; gün sayısı
    faydalı ömür × 365 ile bulunur: 10 × 365 = 3.650 gün. Günlük amortisman = 3.650.000 / 3.650 = 1.000 TL. 1.7.2026–31.12.2026
    arası 184 gündür.


    Doğru amortisman = 1.000 × 184 = **184.000 TL**. Fazla ayrılan = 365.000 − 184.000 = **181.000 TL**.


    Düzeltme: 257 Birikmiş Amortismanlar (B) 181.000 / 770 Genel Yönetim Giderleri (A) 181.000. Matrah etkisi **+181.000 TL**.


    **(b) Bütünlük arz eden kıymetler (md. 313)**


    Değeri 12.000 TL''yi aşmayan alet, edavat, mefruşat ve demirbaşlar doğrudan gider yazılabilir; iktisadi ve teknik bakımdan
    bütünlük arz edenlerde bu had topluca dikkate alınır. Sistemin toplam değeri 7.000 + 4.000 + 3.000 = 14.000 TL olup had
    aşıldığından gider yazılamaz; 255 Demirbaşlar''da aktifleştirilmelidir. Amortisman: 14.000 × %25 = 3.500 TL.


    Matrah etkisi = 14.000 − 3.500 = **+10.500 TL**.


    **(c) Ayrılmayan amortisman (md. 320)**


    Her yılın amortismanı ancak o yıla ait değerlemede nazara alınabilir; amortismanın herhangi bir yıl yapılmamasından dolayı
    amortisman süresi uzatılamaz. 2025''e ait 200.000 TL (2.000.000 × %10) 2026''da gider yazılamaz. 2026 için kabul edilecek
    amortisman 200.000 TL; fazla gider yazılan **200.000 TL** düzeltilir: 257 (B) 200.000 / 770 (A) 200.000. Matrah etkisi
    **+200.000 TL**.


    **(d) Süre tercihi (md. 320/4)**


    Mükellefler amortisman süresini, ilan edilen faydalı ömürden kısa olmamak ve iki katını (16 yıl) ile elli yılı aşmamak
    üzere belirleyebilir. 12 yıllık süre (8 ≤ 12 ≤ 16) geçerlidir ve izleyen dönemlerde değiştirilemez. Doğru amortisman =
    2.400.000 / 12 = 200.000 TL; fazla gider = 300.000 − 200.000 = **100.000 TL**. Matrah etkisi **+100.000 TL**.


    **(e) Toplam**


    | Kalem | Matrah etkisi (TL) |

    |---|---|

    | Gün esası düzeltmesi | +181.000 |

    | Bilgisayar sistemi | +10.500 |

    | Ayrılmayan yılın amortismanı | +200.000 |

    | Süre tercihi | +100.000 |

    | **Toplam** | **+491.500** |


    Ek kurumlar vergisi = 491.500 × %25 = **122.875 TL**.

    '
