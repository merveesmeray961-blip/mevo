    1. **Arsa:** Şirket, üzerinde eski bir bina bulunan arsayı 2026''da satın almıştır (arsa bedeli 8.000.000 TL). Aynı yıl
    aşağıdaki giderler yapılmış ve tamamı kâr veya zarar hesaplarında gider yazılmıştır: tapu harcı 320.000 TL, noter ve değer
    tespit giderleri 80.000 TL, satın alınan eski binanın yıkım gideri 600.000 TL, arsanın tesviye gideri 200.000 TL. Arsa
