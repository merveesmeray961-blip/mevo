    incelemesinde YMM aşağıdaki tespitleri yapmıştır. Kurumlar vergisi oranı %25''tir; KDV ve kanunen kabul edilmeyen giderler
    dikkate alınmayacaktır. Başka bir düzeltme yoktur.


    1. **Gün esası:** Şirket, VUK md. 320''deki imkândan yararlanarak 2026''da aktife alınan yeni kıymetler için gün esasına
    göre amortisman ayırmayı tercih etmiştir. Faydalı ömrü 10 yıl olan, 3.650.000 TL bedelli bir makine 1.7.2026''da kullanıma
    hazır hâle gelmiş ancak şirket bu makine için tam yıl esasıyla 365.000 TL amortisman gideri kaydetmiştir.

    2. **Bilgisayar sistemi:** 2026''da alınan sunucu kasası (7.000 TL), monitör (4.000 TL) ve yazıcı (3.000 TL) iktisadi
    ve teknik bakımdan bir bütün oluşturan bilgisayar sistemidir. Her biri ayrı fatura ile alınmış ve toplam 14.000 TL doğrudan
    gider yazılmıştır. Sistemin amortisman oranı %25''tir; 2026 yılı için doğrudan gider yazma sınırı 12.000 TL''dir ve aktifleştirilen
    kıymette amortisman yıl esasıyla ayrılacaktır.

    3. **Ayrılmayan amortisman:** 2024''te 2.000.000 TL''ye alınan bir tesisin (faydalı ömür 10 yıl, normal amortisman) amortismanı
    2025''te zarar nedeniyle ayrılmamış; şirket 2026''da iki yılın amortismanı olarak 400.000 TL gider yazmıştır.

    4. **Süre tercihi:** 1.1.2026''da 2.400.000 TL''ye alınan bir tesis için Hazine ve Maliye Bakanlığınca ilan edilen faydalı
    ömür 8 yıldır. Şirket, envantere aldığı ilk geçici vergi dönemi sonunda amortisman süresini 12 yıl olarak belirlemiş (yıllık
    200.000 TL) ancak yıl sonunda 8 yıllık süreye göre 300.000 TL gider yazmıştır.


    **İstenenler:**


    (a) 1 numaralı tespitte doğru amortisman tutarını gün esasına göre hesaplayınız ve düzeltme tutarını bulunuz. (6 puan)


    (b) 2 numaralı tespiti VUK md. 313 bakımından değerlendirip düzeltme tutarını hesaplayınız. (5 puan)


    (c) 3 numaralı tespiti değerlendirip gerekli düzeltmeyi yapınız; amortisman süresinin uzatılıp uzatılamayacağını belirtiniz.
    (4 puan)


