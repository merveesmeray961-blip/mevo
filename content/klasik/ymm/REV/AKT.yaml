  soru: 'YMM Melek Hanım, A A.Ş.''nin 2025 yılı aktif hesap revizyonunu yapmaktadır.


    **Bilgiler:**


    | Kalem | Tutar (TL) | Açıklama |

    |---|---|---|

    | Stok (153 Ticari Mallar) | 900.000 | 3.000 adet × 300 TL/adet |

    | Makine (253 Tesis, Makine ve Cihazlar) | 500.000 | Aktife 01.01.2023, %10 amortisman, normal yöntem |

    | Birikmiş Amortisman (257) | 150.000 | 3 yıl için kaydedilmiş |


    Dönem sonu sayımda 2.850 adet stok fiziki olarak mevcuttur. Piyasa değeri 280 TL/adetdir.


    **(a)** Stok noksanını hesaplayın; piyasa değeri düşüklüğüne ilişkin VUK değerlendirmesini yapın. **(12 puan)**


    **(b)** Makinenin 3 yıllık toplam amortismanının doğruluğunu hesaplayarak değerlendirin; birikmiş amortisman kaydındaki
    hatayı tespit edin. **(13 puan)**

    '
  cozum: '**(a) Stok Noksanı ve Değer Düşüklüğü**


    Stok noksanı = (3.000 - 2.850) × 300 TL = 45.000 TL


    | Hesap | Borç (TL) | Alacak (TL) |

    |---|---|---|

    | 197 Sayım ve Tesellüm Noksanları | 45.000 | |

    | 153 Ticari Mallar | | 45.000 |


    Piyasa değeri düşüklüğü: 2.850 adet × (300 - 280) = 2.850 × 20 = 57.000 TL fark.

    VUK md. 278 uyarınca değer düşüklüğü için takdir komisyonuna müracaat veya imha prosedürü gerekir; salt piyasa değeri
    düşüklüğüyle değerleme yapılamaz.


    **(b) Amortisman Kontrolü**


    Yıllık amortisman = 500.000 × %10 = 50.000 TL

    3 yıl toplam = 50.000 × 3 = 150.000 TL


    Kayıtlardaki birikmiş amortisman 150.000 TL; hesaplanan 150.000 TL ile mutabıktır. Hata yoktur; kayıt doğrudur.


    (Not: Soru bir hata öngördüğünden, eğer kayıtlarda farklı bir tutar bulunmuş olsaydı şu şekilde düzeltilirdi: eksik amortisman
    ayrılmışsa 730/770 borç / 257 alacak; fazla ayrılmışsa ters kayıt.)

    '
