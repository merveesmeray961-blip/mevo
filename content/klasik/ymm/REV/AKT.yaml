    Gümrük, tapu, noter, değer tespit giderleri gibi iktisapla doğrudan ilgili giderlerle satın alınan binanın yıkılması ve
    arsanın tesviyesinden doğan giderler maliyet bedeline dâhil edilir; gayrimenkulle doğrudan ilgili ve envantere alındığı
    hesap dönemi sonuna kadar alınan hibeler maliyet bedelinden indirilir.


    | Kalem | Tutar (TL) |

    |---|---|

    | Arsa bedeli | 8.000.000 |

    | Tapu harcı | 320.000 |

    | Noter ve değer tespit | 80.000 |

    | Eski bina yıkım | 600.000 |

    | Tesviye | 200.000 |

    | Hibe (−) | (500.000) |

    | **Maliyet bedeli** | **8.700.000** |


    Düzeltme: 250 Arazi ve Arsalar (B) 1.200.000 / 770 Genel Yönetim Giderleri (A) 1.200.000; 649 Faaliyetle İlgili Diğer
    Gelir ve Karlar (B) 500.000 / 250 Arazi ve Arsalar (A) 500.000. Arsa amortismana tabi olmadığından (md. 314) amortisman
    ayrılmaz. Matrah etkisi: +1.200.000 − 500.000 = **+700.000 TL**.


    **(b) Yol ve bina**


    - Boş arazi ve arsalar amortismana tabi değildir; ancak işletmede inşa edilmiş yollar amortismana tabi tutulur (md. 314).
    Yol 251 Yer Altı ve Yer Üstü Düzenleri hesabına alınmalı ve normal amortisman yıl esasıyla ayrılmalıdır: 1.000.000 × %5
    = **50.000 TL** amortisman gideri; matrah etkisi −50.000 TL.

    - Normal bakım ve temizleme giderleri dışında, gayrimenkulün iktisadi kıymetini devamlı olarak artırmak maksadıyla yapılan
    giderler maliyet bedeline eklenir (md. 272). Kat ilavesi 3.000.000 TL aktifleştirilir: amortisman 3.000.000 × %2 = **60.000
    TL**; matrah etkisi +3.000.000 − 60.000 = **+2.940.000 TL**. Çatı yenileme, boya ve badana (400.000 TL) normal bakım niteliğindeki
    gider olarak kalır, düzeltme yapılmaz.

    - Isı yalıtımı ve enerji tasarrufuna yönelik harcamalar (GVK md. 40/7) yapıldığı yılda doğrudan gider yazılabilir; bu
    bir imkândır, zorunluluk değildir. Şirket doğrudan gider yazma imkânını kullanmayıp harcamayı aktifleştirdiğinden bu tutar
    bina maliyetine dâhildir ve amortismana tabidir: 500.000 × %2 = **10.000 TL** amortisman (yıl esası) ayrılmalıdır; matrah
    etkisi −10.000 TL.


    **(c) Özel maliyet (md. 272/3, 327)**


    Kiracının gayrimenkulün değerini artıran giderleri özel maliyet bedeli olarak 264 Özel Maliyetler hesabında izlenir ve
    kira süresine göre eşit yüzdelerle itfa edilir. Kira süresi 5 yıldır: yıllık itfa = 1.500.000 / 5 = **300.000 TL**.


    - 264 Özel Maliyetler (B) 1.500.000 / 770 Genel Yönetim Giderleri (A) 1.500.000

    - 770 (B) 300.000 / 268 Birikmiş Amortismanlar (A) 300.000 (2026 itfa payı)


    Kira süresi dolmadan depo boşaltılırsa itfa edilmemiş giderler boşaltma yılında bir defada gider yazılır. 2026 ve 2027''de
    600.000 TL itfa edilmiştir; 2028''de gider = 1.500.000 − 600.000 = **900.000 TL**.


    Matrah etkisi (2026): +1.500.000 − 300.000 = **+1.200.000 TL**.


    **(d) Toplam etki**


