  konu: AKT
  kazanimlar:
  - değersiz alacaklar ve karşılığı ayrılmış alacağın zarara yazılması (VUK md.322 ve 323)
  - alacak senetlerinin değerleme günü kıymetine irca edilmesi (VUK md.281 ve 285)
  - konkordato veya sulh yoluyla vazgeçilen alacaklar (VUK md.324)
  zorluk: 2
  puan: 21
  sure_dk: 28
  soru: '**Olay:** Bilanço esasına göre defter tutan Güney Gıda Toptan A.Ş.''nin (hesap dönemi takvim yılı) 2026 tam tasdik
    çalışmasında YMM alacak ve borç hesaplarında aşağıdaki tespitleri yapmıştır. Kurumlar vergisi oranı %25''tir; KDV etkileri
    dikkate alınmayacaktır.


    1. **Müşteri P:** Şirketin P Ltd.''den 150.000 TL ticari alacağı bulunmaktadır. Bu alacak 2025''te icra takibi nedeniyle
    128 Şüpheli Ticari Alacaklar hesabına aktarılmış ve 90.000 TL karşılık ayrılıp gider yazılmıştır. 2026''da icra dairesi,
    P Ltd.''nin haczedilebilir hiçbir malı bulunmadığına dair kesin aciz belgesi düzenlemiştir. Şirket 2026''da bu alacak
    için başka bir kayıt yapmamıştır.

    2. **Alacak senetleri:** Şirketin portföyünde 31.12.2026 tarihinde vadesi gelmemiş, faiz oranı açıklanmamış alacak senetleri
    vardır. Şirket bu senetleri değerleme günü kıymetine irca etmeyi düşünmektedir. Şirketin ayrıca vadesi gelmemiş borç senetleri
    de vardır.

    3. **Sulh:** Tedarikçi Z Ltd., konkordato kapsamında yapılan sulh anlaşmasıyla Güney Gıda''dan olan 1.000.000 TL alacağının
    400.000 TL''sinden 2026''da vazgeçmiştir. Şirket, vazgeçilen 400.000 TL''yi 649 Faaliyetle İlgili Diğer Gelir ve Karlar
    hesabına gelir kaydetmiştir.


    **İstenenler:**


    (a) 1 numaralı tespiti VUK md. 322 ve 323 bakımından değerlendiriniz; gerekli kaydı yapınız ve 2026 kârına etkisini bulunuz.
    (7 puan)


    (b) 2 numaralı tespitte irca işleminde hangi faiz oranının kullanılacağını ve vadesi gelmemiş borç senetlerinin durumunu
    açıklayınız. (6 puan)


    (c) 3 numaralı tespiti VUK md. 324 bakımından değerlendiriniz; düzeltme kaydını yapınız, hesabın üç yıllık süreye ilişkin
    sonucunu belirtiniz. (5 puan)


    (d) Düzeltmelerin 2026 kurumlar vergisi matrahına ve vergiye etkisini hesaplayınız. (3 puan)

    '
  cozum: '**(a) Değersiz alacak (VUK md. 322)**


    Kazai bir hükme veya kanaat verici bir vesikaya göre tahsiline artık imkân kalmayan alacaklar değersiz alacaktır. Kesin
    aciz belgesi kanaat verici vesika niteliğindedir; alacak 2026''da değersiz alacak hâline gelmiştir. Değersiz alacaklar
    bu mahiyete girdikleri tarihte tasarruf değerlerini kaybeder ve mukayyet kıymetleriyle zarara geçirilerek yok edilir.


    Alacağın 90.000 TL''lik kısmı için karşılık önceki yıl gider yazıldığından yalnızca kalan 60.000 TL 2026 giderini oluşturur:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 129 Şüpheli Ticari Alacaklar Karşılığı | 90.000 | |

    | 689 Diğer Olağandışı Gider ve Zararlar | 60.000 | |

    | 128 Şüpheli Ticari Alacaklar | | 150.000 |


    2026 kârına etki: **−60.000 TL**.


    **(b) Senetler (VUK md. 281 ve 285)**


    Vadesi gelmemiş senede bağlı alacaklar değerleme gününün kıymetine irca edilebilir. Senette faiz oranı açıklanmışsa bu
    oran, açıklanmamışsa Merkez Bankasının resmî iskonto haddi uygulanır; bu örnekte oran açıklanmadığından **Merkez Bankasının
    resmî iskonto haddi** kullanılır. Alacak senetlerini değerleme gününün kıymetine irca eden mükellefler, borç senetlerini
    de aynı şekilde işleme tabi tutmak zorundadır; dolayısıyla vadesi gelmemiş borç senetleri de irca edilmelidir (reeskont).


    **(c) Sulh (VUK md. 324)**


    Konkordato veya sulh yoluyla alınmasından vazgeçilen alacaklar borçlunun defterlerinde gelir değil, özel bir karşılık
    hesabına alınır. Bu hesabın muhteviyatı, alacaktan vazgeçildiği yılın sonundan başlayarak üç yıl içinde zararla itfa edilmediği
    takdirde kâr hesabına nakledilir. Vazgeçilen tutar 400.000 TL''dir.


