- id: YMM-REV-AKT-K001
  sinav: ymm
  ders: REV
  konu: AKT
  kazanimlar:
  - hazır değerler ve kasa sayımı
  - alacakların teyidi ve karşılıklar
  - stok sayımı ve değerlemesi
  - duran varlık ve amortisman incelemesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Bilanço esasına göre defter tutan Marmara Ticaret A.Ş.''nin (hesap dönemi takvim yılı) 2026 yılı tam tasdik
    çalışmasında YMM, aktif hesapların revizyonunda aşağıdaki tespitleri yapmıştır. Şirket kayıtlarını VUK ve Tekdüzen Hesap
    Planı''na göre tutmaktadır; KDV ve kanunen kabul edilmeyen gider etkileri dikkate alınmayacaktır. Dönem kapanış kayıtları
    henüz yapılmamıştır.


    1. **Kasa:** 31.12.2026 sayımında kasa defteri bakiyesi 64.300 TL, fiilî nakit 61.900 TL''dir. Kasada, aynı gün kasadan
    ödendiği hâlde kaydedilmemiş 1.200 TL''lik satışla ilgili nakliye (kargo) gideri belgesi bulunmuştur. Kalan farkın nedeni
    ve sorumlusu dönem sonuna kadar belirlenememiştir; şirket sayım farkları için kayıt yapmamıştır.

    2. **Şüpheli alacak:** Müşteri M''den olan 180.000 TL''lik ticari alacak için Kasım 2026''da icra takibi başlatılmıştır.
    Alacağın 50.000 TL''si ipotek teminatı ile güvence altındadır. Alacak hâlen 120 Alıcılar hesabında izlenmekte olup karşılık
    ayrılmamıştır. Şirket, VUK md. 323''teki imkândan azami ölçüde yararlanmak istemektedir.

    3. **Karşılık iptali:** 2025 yılında N firmasından olan 40.000 TL''lik şüpheli alacağın tamamı için karşılık ayrılmıştır.
    2026''da bu alacağın 15.000 TL''si tahsil edilmiş ve 102 Bankalar (B) / 128 Şüpheli Ticari Alacaklar (A) kaydı yapılmış;
    başka kayıt yapılmamıştır.

    4. **Stok:** Ticari mal Y''nin maliyet bedeli 300.000 TL, 31.12.2026 itibarıyla satış bedeli (emsal bedeline eşit) 255.000
    TL''dir. Şirket VUK md. 274''teki imkândan yararlanmak istemekte olup stok değer düşüklüğü karşılığı kullanılacaktır.

    5. **Amortisman:** 1.8.2026''da 1.500.000 TL''ye satın alınıp aktifleştirilen binek otomobil (faydalı ömür 5 yıl, normal
    amortisman, gün esası seçilmemiş) için şirket 12 aylık amortisman olarak 770 Genel Yönetim Giderleri (B) / 257 Birikmiş
    Amortismanlar (A) 300.000 TL kaydetmiştir. Şirketin binek otomobil kiralama veya işletme faaliyeti yoktur.


    **İstenenler:**


    (a) Kasa ile ilgili gerekli kayıtları, dönem sonunda nedeni belirlenemeyen noksan dâhil olmak üzere yapınız. (5 puan)


    (b) 2 ve 3 numaralı tespitler için karşılık tutarlarını hesaplayıp yevmiye kayıtlarını yapınız. (7 puan)


    (c) Stok için VUK''a göre değerleme tutarını ve kaydı belirtiniz. (4 puan)


    (d) Binek otomobil için doğru amortisman tutarını hesaplayıp düzeltme kaydını yapınız. (4 puan)


    (e) Yukarıdaki düzeltmelerin 2026 dönem kârına net etkisini tablo hâlinde gösteriniz. (5 puan)

    '
  cozum: '**(a) Kasa**


    - Kaydedilmemiş gider: 760 Pazarlama Satış ve Dağıtım Giderleri (B) 1.200 / 100 Kasa (A) 1.200

    - Bu kayıttan sonra kasa bakiyesi 64.300 − 1.200 = 63.100 TL; fiilî nakit 61.900 TL → nedeni belirlenemeyen noksan **1.200
    TL**.

    - Sayım tarihinde: 197 Sayım ve Tesellüm Noksanları (B) 1.200 / 100 Kasa (A) 1.200

    - Dönem sonunda kesin hesaba aktarılamayan noksan için THP 199 açıklaması gereği: 654 Karşılık Giderleri (B) 1.200 / 199
    Diğer Dönen Varlıklar Karşılığı (A) 1.200

    - Dönem kârına etkisi: −1.200 (gider) − 1.200 (karşılık) = **−2.400 TL**


    **(b) Alacaklar**


    Tespit 2: Alacak icra safhasında ve ticari faaliyetle ilgilidir; VUK md. 323''e göre şüpheli alacaktır. Teminatlı alacaklarda
    karşılık teminattan geri kalan miktara inhisar eder: 180.000 − 50.000 = **130.000 TL**.


    - 128 Şüpheli Ticari Alacaklar (B) 180.000 / 120 Alıcılar (A) 180.000

    - 654 Karşılık Giderleri (B) 130.000 / 129 Şüpheli Ticari Alacaklar Karşılığı (A) 130.000


    Tespit 3: Tahsil edilen 15.000 TL için ayrılmış karşılık konusuz kalmıştır; VUK md. 323''e göre şüpheli alacağın sonradan
    tahsil edilen kısmı tahsil edildiği dönemde kâr-zarar hesabına intikal ettirilir:


    - 129 Şüpheli Ticari Alacaklar Karşılığı (B) 15.000 / 644 Konusu Kalmayan Karşılıklar (A) 15.000


    Dönem kârına etki: −130.000 + 15.000 = −115.000 TL.


    **(c) Stok**


    Satış bedelindeki düşüş: (300.000 − 255.000) / 300.000 = %15 ≥ %10 → VUK md. 274''e göre emsal bedeli uygulanabilir. Değerleme
    tutarı **255.000 TL**; değer düşüklüğü **45.000 TL**.


    - 654 Karşılık Giderleri (B) 45.000 / 158 Stok Değer Düşüklüğü Karşılığı (A) 45.000


    **(d) Amortisman**


    Binek otomobillerde aktife girilen yıl için ay kesri tam ay sayılarak kalan ay süresi kadar amortisman ayrılır (VUK md.
    320/2): Ağustos–Aralık 5 ay.


    - Doğru amortisman: 1.500.000 × %20 × 5/12 = **125.000 TL**

    - Fazla ayrılan: 300.000 − 125.000 = **175.000 TL**

    - Düzeltme: 257 Birikmiş Amortismanlar (B) 175.000 / 770 Genel Yönetim Giderleri (A) 175.000

    - Amortisman ayrılmayan süreye isabet eden bakiye değer itfa süresinin son yılında yok edilir.


    **(e) Dönem kârına net etki**


    | Düzeltme | Etki (TL) |

    |---|---|

    | Kasa: gider + karşılık | −2.400 |

    | Şüpheli alacak karşılığı (M) | −130.000 |

    | Konusu kalmayan karşılık (N) | +15.000 |

    | Stok değer düşüklüğü | −45.000 |

    | Amortisman düzeltmesi | +175.000 |

    | **Net etki** | **+12.600** |


    Düzeltmeler sonucunda 2026 ticari kârı 12.600 TL artar.

    '
