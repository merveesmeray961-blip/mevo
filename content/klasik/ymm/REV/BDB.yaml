    (Y) hisselerinin devri kısmî bölünme sayılmaz; bu devir için genel hükümler uygulanır. (X) hisseleri bakımından devralan
    kurum, bölünme tarihine kadar tahakkuk etmiş ve edecek vergi borçlarından **devraldığı varlıkların emsal bedeli ile sınırlı
    olarak** müteselsilen sorumludur.


    - Bölünen kurumun vergi borcu: 5.000.000 TL

    - Devralınan kapsamdaki varlığın emsal bedeli: 3.600.000 TL

    - Sorumluluk tutarı = en az (5.000.000 ; 3.600.000) = **3.600.000 TL**


    **(c) Tür değişikliği (KVK md. 19/2, md. 20/1)**


    - Birleşme şartları (kanuni veya iş merkezinin Türkiye''de bulunması, bilanço değerlerinin aynen geçirilmesi) sağlanarak
    yapılan **tür değiştirme devir hükmündedir** (md. 19/2).

    - **Devir tarihi**, yetkili kurulun kararının Ticaret Sicilinde tescil edildiği tarih olan **12.3.2026**''dır (md. 20/1-a).

