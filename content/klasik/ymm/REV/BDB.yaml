- id: YMM-REV-BDB-K007
  sinav: ymm
  ders: REV
  konu: BDB
  kazanimlar:
  - kısmi bölünmede devredilebilecek varlıklar ve işletme bütünlüğü
  - dağıtım anahtarı ve ayni sermaye tutarı
  - kısmi bölünmede zarar intikali
  - bölünen kurumun vergi borçlarından devralanın sorumluluğu
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Yıldırım Mobilya A.Ş.** (ortakları tam mükellef gerçek kişilerdir)
    mobilya üretim işletmesini, yetkili kurul kararının 1.9.2026''da tescil edilmesiyle, yeni kurulacak tam mükellef **Yıldırım
    Üretim A.Ş.**''ye kayıtlı değerleri üzerinden ayni sermaye olarak koymayı planlamaktadır. İşlemin KVK md. 19/3-b kapsamında
    kısmi bölünme olarak yapılması istenmektedir. Şirketin işlem öncesi bilançosu özetle şöyledir (TL):


    | AKTİF | Tutar | PASİF | Tutar |

    |---|---|---|---|

    | Kasa ve bankalar | 1.000.000 | Borçlar | 4.000.000 |

    | Alacaklar | 2.000.000 | Sermaye | 5.000.000 |

    | İştirak (Z A.Ş. hisseleri; 1.2.2025''te satın alınmıştır) | 1.500.000 | Yedekler | 2.000.000 |

    | Mobilya üretim işletmesi (bina, makine, hammadde ve yarı mamuller) | 3.000.000 | Geçmiş yıl zararları | (1.000.000)
    |

    | Tekstil üretim işletmesi | 2.500.000 | | |

    | **Toplam** | **10.000.000** | **Toplam** | **10.000.000** |


    Ek bilgiler:

    - Şirket, mobilya işletmesinin makinelerinden 700.000 TL''lik kısmını kendisinde bırakıp işletmenin geri kalanını devretmeyi,
    ayrıca Z A.Ş. hisselerini de devre eklemeyi düşünmektedir.

    - Borçlardan mobilya işletmesiyle doğrudan ilgili olanların tutarı kayıtlardan belirlenememektedir. Şirket, bu işletmeye
    ilişkin borç tutarını işletmenin aktif içindeki payına göre belirleyecek, nakit ve alacaklardan da aynı oranda pay devretmeyi
    tercih etmiştir.

    - Bölünen şirketin bölünme tarihine kadar tahakkuk etmiş ve edecek vergi borçları toplam 5.000.000 TL''dir. Yıldırım Üretim
    A.Ş.''nin devraldığı varlıkların emsal bedeli toplamı 4.400.000 TL''dir.

    - Devralan şirketin hisselerinin tamamı bölünen şirketin ortaklarına doğrudan verilecektir.


    **İstenenler:**


    (a) Makinelerin bir kısmının bırakılması ve Z A.Ş. hisselerinin devre eklenmesi planını KVK md. 19/3-b ve Tebliğ açısından
    değerlendiriniz. (5 puan)


    (b) Dağıtım anahtarını, devredilecek nakit, alacak ve borç tutarlarını, ayni sermaye tutarını ve bölünen şirketin işlem
    sonrası aktif toplamını bulunuz. (7 puan)


    (c) Bölünen şirketin geçmiş yıl zararlarının devralan şirkete geçip geçmeyeceğini gerekçesiyle açıklayınız. (4 puan)


    (d) Bölünen şirketin bölünme tarihine kadar tahakkuk eden vergi borçları bakımından devralan şirketin sorumluluk sınırını
    belirleyiniz. (5 puan)


    (e) Devralan şirketin hisselerinin ortaklara verilmesinin vergisel sonucunu ve bölünen şirkette yapılması gereken işlemi
    belirtiniz. (4 puan)

    '
  cozum: '**(a) Plan değerlendirmesi**


    - Kısmi bölünmede üretim veya hizmet işletmesi devredilecekse, işletme bütünlüğü korunacak şekilde faaliyetin devamı için
    gerekli aktif ve pasif kalemlerin **tümü** devredilmelidir (KVK md. 19/3-b; Tebliğ 19.2.2.1). Mobilya işletmesine ait
    makinelerin 700.000 TL''lik kısmının bırakılması işletme bütünlüğünü bozar; **plan uygun değildir**, işletmenin makine,
    bina, hammadde ve yarı mamul kalemlerinin tamamı (3.000.000 TL) devredilmelidir.

    - İştirak hisselerinin kısmi bölünmeye konu edilebilmesi için bilançoda en az **iki tam yıl** elde tutulmuş olması gerekir.
    Z A.Ş. hisseleri 1.2.2025''te alındığından 1.9.2026 itibarıyla yalnızca 1 yıl 7 ay elde tutulmuştur; **hisseler devre
    eklenemez**.


    **(b) Dağıtım anahtarı ve ayni sermaye**


    Dağıtım anahtarı = işletmenin aktif içindeki payı = 3.000.000 / 10.000.000 = **%30**.


    | Kalem | Bilanço tutarı | Devredilen (%30) |

    |---|---|---|

    | Kasa ve bankalar | 1.000.000 | 300.000 |

    | Alacaklar | 2.000.000 | 600.000 |

    | Borçlar | 4.000.000 | 1.200.000 |

    | Mobilya işletmesi | 3.000.000 | 3.000.000 |


    Ayni sermaye = (3.000.000 + 300.000 + 600.000) − 1.200.000 = **2.700.000 TL** (borç devri ayni sermayeyi devredilen borç
    kadar eksik kılar).


    Bölünen şirketin işlem sonrası aktifi: 10.000.000 − 3.900.000 (devredilen varlıklar) + 2.700.000 (Yıldırım Üretim A.Ş.
    iştirak hisseleri) = **8.800.000 TL**.


    **(c) Zarar intikali**


    Kısmi bölünme için KVK md. 9''da devralan şirkete zarar geçişi öngörülmemiştir (zarar mahsubu yalnızca devir ve tam bölünmede
    vardır). Bu nedenle 1.000.000 TL''lik geçmiş yıl zararı **devredilemez**, bölünen şirkette kalır.


    **(d) Vergi borçlarından sorumluluk**


    Devralan şirket, bölünen şirketin bölünme tarihine kadar tahakkuk etmiş ve edecek vergi borçlarından, devraldığı varlıkların
    emsal bedeli ile sınırlı olarak müteselsilen sorumludur: min(5.000.000; 4.400.000) = **4.400.000 TL**. Kalan 600.000 TL
    yönünden yalnızca bölünen şirket sorumludur; bölünen şirketin kendi sorumluluğu sona ermez.


    **(e) Hisselerin ortaklara verilmesi**


    Kısmi bölünmeden doğan kârlar hesaplanmaz ve vergilendirilmez (KVK md. 20/3). Devralan şirketin hisseleri doğrudan bölünen
    şirketin ortaklarına verilebilir; bu durumda bölünen şirkette **sermaye azaltımına gidilmesi** gerekir (Tebliğ 32.4.7).

    '
