  - olcut: Tam bölünme şartlarının (aktif-pasif devri, infisah, ortak hakları) doğru açıklanması
    puan: 9
  - olcut: Tasfiye kârının (1.500.000 TL) doğru hesaplanması
    puan: 8
  - olcut: Kurumlar vergisi tutarının (%25 × 1.500.000 = 375.000 TL) doğru bulunması
