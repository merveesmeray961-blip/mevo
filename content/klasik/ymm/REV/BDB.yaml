  soru: '**Senaryo:**

    Omega A.Ş. tam bölünme kararı alarak iki yeni şirkete (Alpha ve Beta) dönüşmeye karar vermiştir. Aynı süreçte Gamma Ltd.
    Şti. tasfiye sürecine girmiştir.


    **(a)** Omega A.Ş.''nin tam bölünme işleminin KVK md.19/3 kapsamındaki şartlarını açıklayınız.


    **(b)** Gamma Ltd. Şti.''nin tasfiye kârını şu verilerle hesaplayınız: Tasfiye sonu servet değeri 5.000.000 TL, tasfiye
    başı öz sermaye 3.500.000 TL.


    **(c)** Tasfiye kârının kurumlar vergisi matrahına etkisini açıklayınız.

    '
  cozum: '**(a) Tam Bölünme Şartları (KVK md.19/3):**


    - Tüm aktif ve pasifler mevcut ya da yeni kurulan şirketlere devredilir.

    - Bölünen Omega A.Ş. tasfiyesiz infisah eder.

    - Ortaklar, yeni şirketlere (Alpha ve Beta) hisseleri oranında ortak olur.

    - Her iki yeni şirket de tam mükellef olmalıdır.


    **(b) Tasfiye Kârı Hesabı:**


    Tasfiye kârı = Tasfiye sonu servet − Tasfiye başı servet


    = 5.000.000 − 3.500.000 = **1.500.000 TL**


    **(c) Kurumlar Vergisi Matrahı:**


    1.500.000 TL tasfiye kârı kurumlar vergisi matrahına girer ve %25 kurumlar vergisine tabi tutulur.


    Kurumlar vergisi = 1.500.000 × %25 = **375.000 TL**

    '
