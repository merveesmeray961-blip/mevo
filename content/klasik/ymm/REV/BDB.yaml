      hisseleri ya da sahip oldukları üretim veya hizmet işletmelerinin bir veya birkaçını kayıtlı değerleri üzerinden aynî
      sermaye olarak mevcut veya yeni kurulacak tam mükellef bir sermaye şirketine devretmesi, bu Kanunun uygulanmasında kısmî
