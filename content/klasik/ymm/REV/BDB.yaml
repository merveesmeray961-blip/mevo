    ayın sonuna (Nisan) kadar olan süre içinde yapıldığından **2025 hesap dönemine ilişkin** beyanname. İkisi de münfesih
    kurum ve birleşilen kurum tarafından müştereken imzalanır.

    - Süre: Ticaret Sicili Gazetesinde ilan tarihi olan 24.3.2026''dan itibaren **otuz gün** içindedir: 24.3.2026 + 30 gün
