  - olcut: (a) İşletme bütünlüğü kuralı ve makinelerin bırakılamayacağının gerekçesi
    puan: 2
  - olcut: (a) İştirak hisseleri için iki tam yıl şartı ve hisselerin devredilemeyeceği
    puan: 3
  - olcut: (b) %30 dağıtım anahtarı, nakit/alacak/borç tutarları
    puan: 3
  - olcut: (b) Ayni sermaye (2.700.000 TL) ve işlem sonrası aktif toplamı (8.800.000 TL)
