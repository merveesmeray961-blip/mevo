    Pi A.Ş. ortaklar kurulu kararıyla tasfiyeye girmiştir. Aynı dönemde Sigma Ltd. Şti. ise anonim şirkete dönüşmeye karar
    vermiştir.


    **(a)** Pi A.Ş.''nin tasfiye sürecindeki vergisel yükümlülüklerini açıklayınız.


    **(b)** Sigma Ltd. Şti.''nin anonim şirkete dönüşmesinin KVK md.19 açısından nasıl değerlendirileceğini açıklayınız.

    '
  cozum: '**(a) Pi A.Ş. Tasfiye Süreci:**


    KVK md.17 uyarınca Pi A.Ş.:

    - Tasfiye kararının tescil tarihinden itibaren tasfiye dönemine girer.

    - Her tasfiye yılı için kurumlar vergisi beyannamesi hazırlar; beyanname her tasfiye döneminin sonunu takip eden 4. ayın
    son gününe kadar verilir.

    - Tasfiye kârı = Tasfiye sonu servet − Tasfiye başı servet farkıdır; pozitifse kurumlar vergisine tabidir.

    - Tasfiye tamamlanmadan vergi borçları ödenmeden kapatma sicile tescil edilemez.


    **(b) Sigma Ltd.''nin Nev''i Değişikliği:**


    KVK md.19/1 kapsamında limited şirketin anonim şirkete dönüşmesi nev''i değişikliği sayılır.

    - Tasfiye hükümleri uygulanmaz.

    - Kurumlar vergisi doğmaz.

    - Aktif ve pasifler yeni statüdeki şirkete (anonim şirket) aynen devredilir.

    - Ortakların hisse yapısı korunur.

    '
