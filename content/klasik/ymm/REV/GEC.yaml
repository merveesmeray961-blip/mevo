- id: YMM-REV-GEC-K001
  sinav: ymm
  ders: REV
  konu: GEC
  kazanimlar:
  - varlık barışı
  - yeniden değerleme (VUK mükerrer 298/ç)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Tam mükellef ve bilanço esasına göre defter tutan **Yıldız Tekstil A.Ş.**''nin hesap dönemi takvim yılıdır. Şirketin
    geçici düzenlemelerle ilgili işlemleri şunlardır:


    1. **31/12/2025** itibarıyla VUK mükerrer md. 298/Ç kapsamında, 2021''de aktife alınan dokuma makinesini yeniden değerlemiştir.
    Yasal kayıtlardaki maliyet bedeli 4.000.000 TL, birikmiş amortismanı 1.600.000 TL''dir; maliyete eklenmiş kur farkı veya
    kredi faizi yoktur. 2025 yılı yeniden değerleme oranı %25,49''dur.

    2. **15/9/2026**''da yurt dışındaki 12.000.000 TL''lik mevduatını KVK geçici md. 19 kapsamında bankaya bildirmiş, 20/10/2026''da
    Türkiye''deki hesabına transfer etmiş ve en az iki yıl vadeli hesapta tutacağını taahhüt etmiştir.

    3. **10/10/2026**''da Türkiye''de bulunan ancak kanuni defterlerinde yer almayan 3.000.000 TL değerindeki altını bankaya
    bildirmiş ve aynı gün bankadaki hesabına yatırmıştır; bulundurma taahhüdü vermemiştir.

    4. Banka tarafından tahsil edilen varlık barışı vergilerinin tamamı 770 Genel Yönetim Giderleri hesabına kaydedilmiştir.


    **İstenenler:**


    (a) 2 ve 3 numaralı bildirimler için tahsil edilecek vergileri hesaplayınız; transferin süresinde yapılıp yapılmadığını
    değerlendiriniz. (6 puan)


    (b) 2 ve 3 numaralı bildirimlerin bildirim tarihindeki yevmiye kayıtlarını yapınız ve 4 numaralı kaydın 2026 kurumlar
    vergisi beyannamesine etkisini belirtiniz. (7 puan)


    (c) Makinenin yeniden değerleme sonrası değerlerini, değer artışını ve 31/12/2025 tarihli kaydı gösteriniz. (8 puan)


    (d) (i) 549 hesabındaki fonların Kasım 2028''de işletmeden çekilmesinin, (ii) 522 hesabındaki fonun 2027''de sermayeye
    eklenmesinin ve (iii) aynı fonun 2027''de ortaklara dağıtılmasının vergisel sonucunu belirtiniz; (iii) için kurumlar vergisini
    hesaplayınız (kâr payı stopajı dikkate alınmayacaktır). (4 puan)

    '
  cozum: '**(a) Varlık barışı vergileri** (KVK geçici md. 19/6)


    - Yurt dışı mevduat: iki yıl taahhüt → %3; bildirim 2026''da olduğundan artırım yok: 12.000.000 × %3 = **360.000 TL**.

    - Yurt içi altın: taahhüt yok → %5: 3.000.000 × %5 = **150.000 TL**.

    - Toplam **510.000 TL**; banka, bildirimi izleyen ayın on beşinci günü akşamına kadar vergi sorumlusu sıfatıyla beyan
    edip öder.

    - Transfer: md. 19/2''ye göre iki ay içinde yapılmalıdır; 15/9/2026 + 2 ay = 15/11/2026. 20/10/2026 transferi **süresindedir**.
    Altın, md. 19/3 gereği bildirim tarihinde bankaya yatırılarak tevsik edilmiştir.


    **(b) Kayıtlar ve beyanname etkisi**


    15/9/2026 (bildirim; md. 19/4):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar (yurt dışı hesap) | 12.000.000 | |

    | 549 Özel Fonlar | | 12.000.000 |


    10/10/2026:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar (altın hesabı) | 3.000.000 | |

    | 549 Özel Fonlar | | 3.000.000 |


    Varlıklar dönem kazancının tespitinde dikkate alınmaz. md. 19/7''ye göre ödenen vergi hiçbir suretle gider yazılamaz ve
    başka vergiden mahsup edilemez; 770 hesabına kaydedilen **510.000 TL** 2026 kurumlar vergisi beyannamesinde **kanunen
    kabul edilmeyen gider** olarak kâra eklenir.


    **(c) Yeniden değerleme** (VUK mük. md. 298/Ç)


    | | Önce | Sonra (× 1,2549) |

    |---|---|---|

    | Makine | 4.000.000 | 5.019.600 |

    | Birikmiş amortisman | 1.600.000 | 2.007.840 |

    | Net bilanço aktif değeri | 2.400.000 | 3.011.760 |


    Değer artışı = 3.011.760 − 2.400.000 = **611.760 TL** (298/Ç-4).


    31/12/2025 kaydı:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 253 Tesis, Makine ve Cihazlar | 1.019.600 | |

    | 257 Birikmiş Amortismanlar | | 407.840 |

    | 522 M.D.V. Yeniden Değerleme Artışları | | 611.760 |


    Amortisman 2026''dan itibaren yeniden değerlenmiş tutarlar üzerinden ayrılır (298/Ç-5).


    **(d) Fonların kullanımı**


    (i) 549 fonları bildirim tarihlerinden (15/9/2026 ve 10/10/2026) itibaren iki yıl geçtikten sonra, Kasım 2028''de, vergiye
    tabi kazancın ve dağıtılabilir kazancın tespitinde dikkate alınmaksızın işletmeden çekilebilir; **vergi doğmaz** (md.
    19/4).


    (ii) 522 fonunun sermayeye eklenmesi kâr dağıtımı sayılmaz; değer artışı ortaklarca işletmeye ilave edilmiş kıymet kabul
    edilir, **vergi doğmaz** (298/Ç-6).


    (iii) Fonun ortaklara dağıtılması sermayeye ilave dışında başka hesaba nakil ve işletmeden çekiş olduğundan 611.760 TL,
    dönem kazancıyla ilişkilendirilmeksizin 2027''de kurumlar vergisine tabi tutulur: 611.760 × %25 = **152.940 TL**.

    '
  puanlama:
  - olcut: Yurt dışı mevduat için %3 oranı ve 360.000 TL vergi
    puan: 2
  - olcut: Yurt içi altın için %5 oranı ve 150.000 TL vergi
    puan: 2
  - olcut: İki aylık transfer süresinin hesaplanması ve süresinde olduğunun belirlenmesi
    puan: 2
  - olcut: Her iki bildirim için 102/549 kayıtları
    puan: 4
  - olcut: Gider yazılan 510.000 TL'nin KKEG olarak eklenmesi ve dayanağı
    puan: 3
  - olcut: Yeniden değerleme sonrası maliyet ve amortisman değerleri
    puan: 3
  - olcut: Değer artışının 611.760 TL olarak bulunması
    puan: 2
  - olcut: 253/257/522 kaydının doğru tutarlarla yapılması
    puan: 3
  - olcut: 549 fonlarının iki yıl sonra çekilmesi ve 522 fonunun sermayeye eklenmesinin vergisel sonucu
    puan: 2
  - olcut: 522 fonunun dağıtılması hâlinde 152.940 TL kurumlar vergisi
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 19
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. md. 298/Ç; geçici md. 37
  - mevzuat: 585 Sıra No.lu VUK Genel Tebliği
    madde: 2025 yeniden değerleme oranı
  gecerlilik:
    baslangic: '2026-05-21'
    bitis: null
  dogrulama:
    python: 'v1 = 12000000 * 3 / 100

      v2 = 3000000 * 5 / 100

      oran = 1.2549

      maliyet_sonra = round(4000000 * oran, 2)

      amort_sonra = round(1600000 * oran, 2)

      artis = round(maliyet_sonra - amort_sonra - 2400000, 2)

      sonuc = {''vergi_mevduat'': v1, ''vergi_altin'': v2, ''kkeg'': v1 + v2, ''maliyet_sonra'': maliyet_sonra, ''amortisman_sonra'':
      amort_sonra, ''deger_artisi'': artis, ''kv_dagitim'': round(artis * 25 / 100, 2)}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 4, seviye 3
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S2.yaml, klasik 3
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-GEC-K002
  sinav: ymm
  ders: REV
  konu: GEC
  kazanimlar:
  - varlık barışı
  - yeniden değerleme (VUK mükerrer 298/ç)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Bilanço esasına göre defter tutan tam mükellef **Toros Kimya AŞ**, 7582 sayılı Kanunla KVK'ya eklenen geçici\nmd.\
    \ 19 kapsamında şu bildirimleri yapmıştır:\n\n1. 15.9.2026'da yurt dışındaki banka hesabında bulunan 500.000 USD'yi (bildirim\
    \ tarihindeki değeri 21.000.000 TL)\n   bildirmiş ve 20.10.2026'da Türkiye'deki banka hesabına transfer etmiştir. Herhangi\
    \ bir vadeli hesap taahhüdü\n   verilmemiştir.\n2. 1.10.2026'da kanuni defterlerinde yer almayan 2.000.000 TL değerindeki\
    \ altını bildirmiş, aynı gün bankaya yatırmış\n   ve en az üç yıl vadeli hesapta tutulacağını taahhüt etmiştir.\n3. 10.2.2027'de\
    \ yurt dışındaki 1.000.000 TL değerindeki menkul kıymetleri bildirmiş ve iki ay içinde Türkiye'ye\n   transfer etmiştir\
    \ (taahhüt yok).\n\n**İstenenler:**\n\n(a) Her bildirim için uygulanacak vergi oranını ve tutarını hesaplayınız; verginin\
    \ kim tarafından ve ne zaman beyan\nedileceğini belirtiniz. (8 puan)\n\n(b) Bildirilen varlıkların muhasebeleştirilmesini,\
    \ fon hesabı şartlarını ve ödenen verginin gider ve mahsup durumunu\naçıklayınız. (6 puan)\n\n(c) 2027'de yapılan bir\
    \ vergi incelemesinde 2025 hesap döneminde kayıt dışı satış nedeniyle 1.500.000 TL ve sahte\nbelge kullanımı nedeniyle\
    \ 800.000 TL matrah farkı bulunursa tarhiyat durumunu açıklayınız. (6 puan)\n\n(d) VUK geçici md. 37'nin VUK mükerrer\
    \ md. 298/Ç uygulamasına etkisini açıklayınız. (5 puan)\n"
  cozum: "**(a) Vergi**\n\nBankalar ve aracı kurumlar, bildirilen varlıkların değeri üzerinden kesilen vergiyi bildirimi izleyen\
    \ ayın 15. günü\nakşamına kadar **vergi sorumlusu** sıfatıyla beyan edip öder (KVK geçici md. 19/6).\n\n| No | Değer (TL)\
    \ | Oran ve gerekçe | Vergi (TL) |\n|---|---|---|---|\n| 1 | 21.000.000 | Taahhüt yok: %5 | 1.050.000 |\n| 2 | 2.000.000\
    \ | En az üç yıl vadeli hesap taahhüdü: %2 | 40.000 |\n| 3 | 1.000.000 | 1.1.2027–31.7.2027 arası bildirim: %5 + 0,5 puan\
    \ = %5,5 | 55.000 |\n| **Toplam** | | | **1.145.000** |\n\n**(b) Muhasebe ve fon**\n\nBildirilen varlıklar bildirim tarihi\
    \ itibarıyla kanuni defterlere kaydedilir. Bilanço esasında **pasifte özel fon\nhesabı** (ör. 549 Özel Fonlar) açılır.\
    \ Fon bildirim tarihinden itibaren **iki yıl** geçmedikçe işletmeden çekilemez\nve sermayeye ilave dışında başka amaçla\
    \ kullanılamaz. Tasfiye hâlinde vergilendirilmez. Varlıklar dönem kazancının\ntespitinde dikkate alınmaz. Ödenen vergi\
    \ **gider yazılamaz** ve başka vergiden **mahsup edilemez**. Bildirilen\nvarlıkların elden çıkarılmasından doğan zararlar\
    \ gider veya indirim olarak kabul edilmez (geçici md. 19/4, 19/7).\n\n**(c) İnceleme**\n\nBildirilen varlıklara isabet\
    \ eden tutarlar için inceleme ve tarhiyat yapılmaz. Başka nedenle başlayan incelemede\nbulunan matrah farkının bildirilen\
    \ varlıklar nedeniyle ortaya çıktığı tespit edilirse ve bildirilen tutar matrah\nfarkına eşit veya fazlaysa tarhiyat yapılmaz\
    \ (geçici md. 19/8).\n\n- Kayıt dışı satıştan doğan 1.500.000 TL fark, bildirilen varlıklarla (toplam 24.000.000 TL) ilişkilendirilebiliyorsa\n\
    \  **tarhiyat yapılmaz**.\n- Sahte belge kullanımından doğan 800.000 TL fark, bildirilen varlıklar **dışındaki nedenle**\
    \ ortaya çıktığından\n  mahsup edilmeksizin **tarhiyat yapılır**.\n- Şartlara uyulmazsa (süresinde transfer, taahhüt,\
    \ verginin ödenmesi) koruma hükmünden yararlanılamaz. Zamanında\n  tahakkuk ettirilmeyen vergiler vergi ziyaı cezası uygulanmaksızın\
    \ gecikme faiziyle tahsil edilir (19/9).\n\n**(d) Mükerrer 298/Ç**\n\nVUK geçici md. 37 uyarınca 2025, 2026 ve 2027 hesap\
    \ dönemlerinde enflasyon düzeltmesi şartları oluşsa bile mali\ntablolar enflasyon düzeltmesine tabi tutulmaz. Mükerrer\
    \ 298/Ç uygulaması bakımından bu dönemler **enflasyon\ndüzeltmesi şartlarının gerçekleşmediği dönem** sayılır. Böylece\
    \ bilanço esasına göre defter tutanlar bu dönemlerde\ntaşınmazlarını ve amortismana tabi iktisadi kıymetlerini 298/Ç kapsamında\
    \ **yeniden değerleyebilir**.\n"
  puanlama:
  - olcut: (a) Üç bildirimin oranları (%5, %2, %5,5)
    puan: 5
  - olcut: (a) Toplam 1.145.000 TL ve vergi sorumlusu/süre
    puan: 3
  - olcut: (b) Defter kaydı, özel fon ve iki yıl şartı
    puan: 3
  - olcut: (b) Verginin gider yazılamaması ve mahsup edilememesi
    puan: 3
  - olcut: (c) Varlıklarla ilişkili farkta tarhiyat yapılmaması
    puan: 3
  - olcut: (c) Diğer nedenle doğan farkta tarhiyat ve şart ihlali
    puan: 3
  - olcut: (d) Geçici md. 37 ve 298/Ç ilişkisi
    puan: 5
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 19
    alinti: itibaren 31/7/2027 tarihine kadar (bu tarih dahil) yapılacak bildirimlerde bu oranlara yarım
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: geçici md. 37, mükerrer md. 298/Ç
    alinti: Mükerrer 298 inci maddenin (Ç) fıkrası uygulaması açısından, birinci fıkrada
  gecerlilik:
    baslangic: '2026-06-04'
    bitis: '2027-12-31'
  dogrulama:
    python: 'v1, v2, v3 = 21000000 * 0.05, 2000000 * 0.02, 1000000 * 0.055

      sonuc = {"v1": v1, "v2": v2, "v3": v3, "top": v1 + v2 + v3, "bildirilen": 24000000}

      '
