- id: YMM-REV-GEC-K006
  sinav: ymm
  ders: REV
  konu: GEC
  kazanimlar:
  - taşınmaz satış kazancı istisnasında geçici 16 uyarınca eski hükümler ve yeni oran
  - iştirak hissesi satış kazancı istisnası ve özel fon şartları
  - geçmiş dönemler için geçici maddedeki kurumlar vergisi oranları
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay**


    Hesap dönemi takvim yılı olan, bilanço esasına göre defter tutan ve finans sektöründe faaliyet göstermeyen tam mükellef
    **Demirci Makine A.Ş.**''nin 2026 yılı kurumlar vergisi beyannamesi revizyonunda YMM aşağıdaki tespitleri yapmıştır (tutarlar
    TL''dir; asgari kurumlar vergisi hesabı, ödenmiş geçici vergi, kurumlar vergisi dışındaki vergiler ve gecikme faizi/zam
    dikkate alınmayacaktır):


    1. Şirket, 2021 yılında satın aldığı ve o tarihten beri aktifinde bulunan bir fabrika binasını **12.5.2026** tarihinde
    **9.000.000 TL** bedelle satmış ve bedelin tamamı satış tarihinde tahsil edilmiştir. Binanın VUK''a göre tespit edilen
    net kayıtlı değeri **4.500.000 TL**''dir. Şirket satış kazancını beyannamede istisna olarak göstermemiştir.

    2. Şirket, 2022 yılında edindiği ve aktifinde yer alan iştirak hisselerini **20.8.2026** tarihinde **5.000.000 TL** bedelle
    satmıştır. Hisselerin maliyet bedeli **3.000.000 TL**''dir. Satış bedeli satış tarihinde tahsil edilmiştir. Şirket bu
    kazancı da istisna olarak göstermemiştir.

    3. Ticari bilanço kârı (yukarıdaki satış kazançları dahil) **12.000.000 TL**; kanunen kabul edilmeyen giderler toplamı
    **800.000 TL**''dir. Başka indirim ve istisna yoktur. Kurumlar vergisi oranı %25''tir.

    4. Şirket nezdinde 2026 yılında yapılan vergi incelemesinde, 2021 hesap dönemi için **1.000.000 TL**, 2022 hesap dönemi
    için **2.000.000 TL** tutarında matrah farkı bulunmuştur (hile içermeyen hatalardır; yalnızca kurumlar vergisi hesaplanacaktır).


    **İstenenler**


    (a) 1 ve 2 numaralı tespitlerde istisna uygulanıp uygulanamayacağını, uygulanacak istisna oranlarını (dayanak hükümleriyle)
    ve istisna kazanç tutarlarını hesaplayınız. (9 puan)


    (b) 3 numaralı bilgilerle 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; pasifte açılması
    gereken özel fon hesabının tutarını, ne kadar süre işletmede tutulacağını ve satış bedelinin tahsil süresine ilişkin şartı
    belirtiniz. (7 puan)


    (c) 4 numaralı tespitte 2021 ve 2022 hesap dönemleri için uygulanacak kurumlar vergisi oranlarını (geçici maddeye dayanarak)
    ve her dönem için tarh edilecek vergiyi hesaplayınız. (6 puan)

    '
  cozum: '**(a) Satış kazancı istisnaları (KVK md. 5/1-e, geçici md. 16, CBK 9160)**


    *1. Taşınmaz satışı:* 5/1-e bendinin 7456 sayılı Kanunla değiştirilmeden önceki hükümleri, geçici 16 uyarınca, yürürlük
    tarihinden (15.7.2023) önce kurumların aktifinde yer alan taşınmazlar için uygulanır. Bina 2021''de edinildiğinden aktifte
    iki tam yıldan fazla bulunmuş ve bu hükmün kapsamındadır. Geçici 16 uyarınca eski hükümdeki %50 oranı, yürürlük tarihinden
    sonra yapılacak taşınmaz satış kazançları için **%25** olarak uygulanır. Satış 12.5.2026''da olduğundan oran %25''tir.


    - Satış kazancı = 9.000.000 - 4.500.000 = **4.500.000 TL**

    - İstisna = 4.500.000 x %25 = **1.125.000 TL**


    *2. İştirak hissesi satışı:* İştirak hisseleri en az iki tam yıl aktifte bulunmuştur (2022''de edinilmiş, satış 20.8.2026);
    5/1-e kapsamındadır. 9160 sayılı Cumhurbaşkanı Kararı ile istisna oranı **%50** olarak belirlenmiştir.


    - Satış kazancı = 5.000.000 - 3.000.000 = **2.000.000 TL**

    - İstisna = 2.000.000 x %50 = **1.000.000 TL**


    Toplam istisna = 1.125.000 + 1.000.000 = **2.125.000 TL**


    **(b) Matrah, vergi ve özel fon**


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | (+) Kanunen kabul edilmeyen giderler | 800.000 |

    | (-) Taşınmaz satış kazancı istisnası | (1.125.000) |

    | (-) İştirak hissesi satış kazancı istisnası | (1.000.000) |

    | **Kurumlar vergisi matrahı** | **10.675.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.668.750** |


    - İstisna edilen kazanç (1.125.000 + 1.000.000 = **2.125.000 TL**) satışın yapıldığı yılı izleyen **beşinci yılın sonuna
    kadar (31.12.2031)** pasifte özel bir fon hesabında tutulur; sermayeye ilave dışında başka bir hesaba nakledilemez veya
    işletmeden çekilemez, aksi hâlde istisna nedeniyle zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır.

    - Satış bedelinin satışın yapıldığı yılı izleyen **ikinci takvim yılının sonuna (31.12.2028)** kadar tahsili şarttır;
    bu şart olayda zaten sağlanmıştır (bedel satış tarihinde tahsil edilmiştir).


    **(c) Geçmiş dönem oranları (geçici md. 13)**


    KVK md. 32''deki %20 oranı geçici 13 uyarınca 2021 vergilendirme dönemi için **%25**, 2022 vergilendirme dönemi için **%23**
    olarak uygulanır (finans sektörüne ilişkin istisna şirkete uygulanmaz).


    | Dönem | Matrah farkı | Oran | Tarh edilecek vergi |

    |---|---|---|---|

    | 2021 | 1.000.000 | %25 | **250.000** |

    | 2022 | 2.000.000 | %23 | **460.000** |

    | **Toplam** | | | **710.000** |


    Her iki dönem için tarh zamanaşımı henüz dolmamıştır (2021: 31.12.2026, 2022: 31.12.2027).

    '
