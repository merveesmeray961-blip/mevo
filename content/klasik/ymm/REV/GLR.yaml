  soru: "**(K) Ticaret A.Ş.** ticari mal ithalatı ve toptan satışıyla uğraşmaktadır. Şirket bilanço esasına göre defter tutmakta,\
    \ Tekdüzen Hesap Planı'nın 7/A seçeneğini ve stoklarda sürekli envanter yöntemini uygulamaktadır. Hesap dönemi takvim\
    \ yılıdır. Şirketin YMM'si, 2026 yılı tam tasdik çalışması kapsamında gelir tablosu hesaplarını incelemiş ve aşağıdaki\
    \ hususları tespit etmiştir. Şirketin düzeltmeler öncesi **ticari bilanço kârı 8.000.000 TL**'dir.\n\n1. Şirket, bir ticari\
    \ mal partisinin ithal bedelini 1.3.2026'da kullandığı EUR kredisiyle ödemiştir. Şirkette finansman gider kısıtlaması\
    \ (KVK md. 11/1-i) koşulları oluşmamaktadır. Mallar 1.5.2026'da şirketin stoklarına girmiştir. Bu krediye ait 2026 yılı\
    \ finansman giderleri aşağıdadır. Şirket faizleri **780 Finansman Giderleri**, kur farklarını **656 Kambiyo Zararları**\
    \ hesabına kaydetmiştir. 781 hesabıyla yapılacak yansıtma kayıtları henüz yapılmamıştır. Söz konusu partinin **%60'ı 2026\
    \ yılı içinde satılmış, %40'ı** yıl sonunda stokta kalmıştır. Şirket, kanunun serbest bıraktığı kısımları gider yazmayı\
    \ tercih etmektedir.\n\n| Dönem | Faiz (TL) | Kur farkı (TL) |\n|---|---|---|\n| 1.3.2026 – 30.4.2026 | 100.000 | 150.000\
    \ |\n| 1.5.2026 – 31.12.2026 | 400.000 | 350.000 |\n\n2. Şirket 1.11.2026'da bankaya 6.000.000 TL'yi 3 ay vadeli, yıllık\
    \ %40 basit faizli bir vadeli mevduat hesabına yatırmıştır. Faiz vadede (1.2.2027) anaparayla birlikte ödenecektir. 31.12.2026\
    \ itibarıyla faiz tahakkuku yapılmamıştır. Faiz ay esasına göre hesaplanacak, stopaj dikkate alınmayacaktır.\n\n3. Gider\
    \ hesaplarında şu ödemeler yer almaktadır:\n   - Vergi ziyaı cezası: 80.000 TL\n   - 6183 sayılı Kanuna göre ödenen gecikme\
    \ zammı: 12.000 TL\n   - Şirket aracı için kesilen trafik idari para cezası: 5.000 TL\n   - Bir satış sözleşmesinde ceza\
    \ şartı olarak öngörülen ve teslim gecikmesi nedeniyle müşteriye ödenen tazminat: 40.000 TL\n\nKurumlar vergisi oranı\
    \ %25'tir. Geçmiş yıl zararı, istisna ve indirim bulunmamaktadır. Asgari kurumlar vergisi hükümleri sonucu etkilememektedir.\
    \ KDV dikkate alınmayacaktır.\n\n**İstenenler:**\n\n**(a)** 1 numaralı tespit için VUK md. 262'ye göre ticari malın maliyetine\
    \ eklenmesi zorunlu olan tutarı belirleyiniz. Gerekli düzeltme kayıtlarını yapınız ve düzeltmenin 2026 ticari kârına etkisini\
    \ hesaplayınız. *(8 puan)*\n\n**(b)** 2 numaralı tespit için yapılması gereken tahakkuk tutarını hesaplayınız, kaydını\
    \ yapınız ve dayanağını belirtiniz. *(5 puan)*\n\n**(c)** 3 numaralı tespitteki giderlerden hangilerinin kurum kazancının\
    \ tespitinde kanunen kabul edilmeyen gider olduğunu gerekçesiyle belirleyiniz. *(6 puan)*\n\n**(d)** Düzeltilmiş ticari\
    \ bilanço kârını, kurum kazancını ve hesaplanan kurumlar vergisini bulunuz. *(6 puan)*\n"
  cozum: '**(a) İthal ticari mala ait finansman giderleri**


    VUK md. 262/2-(c) uyarınca, kıymetin finansmanında kullanılan kredilere ait faiz ve kur farklarının **emtiada, emtianın
    stoklara girdiği tarihe kadar olan kısmı** maliyet bedeline dâhil edilir. Sonraki kısımları maliyete eklemekte veya gider
    yazmakta mükellef serbesttir.


    - Maliyete eklenmesi zorunlu tutar (1.3–30.4.2026): faiz 100.000 + kur farkı 150.000 = **250.000 TL**

    - 1.5.2026 sonrası 750.000 TL''lik kısım (400.000 + 350.000) şirketin tercihiyle gider olarak kalabilir.


    Düzeltme kayıtları (31.12.2026):


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 153 Ticari Mallar | 250.000 | |

    | 780 Finansman Giderleri | | 100.000 |

    | 656 Kambiyo Zararları | | 150.000 |


    Partinin %60''ı satıldığından, maliyete eklenen tutarın satılan mala düşen kısmı satılan malın maliyetine aktarılır:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 621 Satılan Ticari Mallar Maliyeti | 150.000 | |

    | 153 Ticari Mallar | | 150.000 |


    Kâra etkisi: Gider hesapları 250.000 TL azalır, SMM 150.000 TL artar → **ticari kâr 100.000 TL artar**. Bu tutar yıl sonu
    stokunda kalan paydır (250.000 × %40).


    **(b) Mevduat faizi tahakkuku**


    VUK md. 281: Mevduat sözleşmesine dayanan alacaklar, değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate
    alınır. Bu, dönemsellik kavramının da gereğidir.


    Tahakkuk: 6.000.000 × %40 × 2/12 = **400.000 TL** (Kasım ve Aralık).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 181 Gelir Tahakkukları | 400.000 | |

    | 642 Faiz Gelirleri | | 400.000 |


    Ticari kâr 400.000 TL artar.


    **(c) Kanunen kabul edilmeyen giderler (KVK md. 11/1)**


    - Vergi ziyaı cezası 80.000 TL → KKEG (md. 11/1-d: vergi cezaları)

    - 6183''e göre gecikme zammı 12.000 TL → KKEG (md. 11/1-d)

    - Trafik idari para cezası 5.000 TL → KKEG (md. 11/1-d: her türlü para cezaları)

    - Ceza şartı olarak ödenen sözleşmesel tazminat 40.000 TL → **indirilebilir**. Md. 11/1-(g) sözleşmelerde ceza şartı olarak
    konulan tazminatları kapsam dışında tutar. İşle ilgili ve sözleşmeye dayanan bu tazminat GVK md. 40/3 kapsamında gider
    yazılabilir.


    KKEG toplamı: 80.000 + 12.000 + 5.000 = **97.000 TL**


    **(d) Kurum kazancı ve kurumlar vergisi**


    | Kalem | TL |

    |---|---|

    | Düzeltmeler öncesi ticari kâr | 8.000.000 |

    | (a) Finansman gideri aktifleştirmesinin net etkisi | +100.000 |

    | (b) Mevduat faizi tahakkuku | +400.000 |

    | **Düzeltilmiş ticari bilanço kârı** | **8.500.000** |

    | (c) KKEG | +97.000 |

    | **Kurum kazancı (matrah)** | **8.597.000** |

    | **Hesaplanan kurumlar vergisi (%25)** | **2.149.250** |

    '
