  soru: "**Demir Döküm AŞ**'nin 2026 revizyonunda kur farkları ve finansman giderleri incelenmektedir:\n\n1. Yurt dışından\
    \ ithal edilen bir makinenin finansmanı için 1.3.2026'da 1.000.000 USD kredi kullanılmıştır (kur\n   38,00). Makine 1.9.2026'da\
    \ aktife alınmıştır (kur 40,00). 31.12.2026 TCMB döviz alış kuru 42,00'dır. Şirket\n   krediye ilişkin 4.000.000 TL kur\
    \ farkının tamamını 656 Kambiyo Zararları hesabına kaydetmiştir. Makinenin\n   faydalı ömrü 10 yıldır (normal amortisman).\n\
    2. Şirketin 31.12.2026 itibarıyla yabancı kaynakları 80.000.000 TL, öz kaynakları 50.000.000 TL'dir. Yatırım\n   maliyetine\
    \ eklenmeyen kredi faizleri 3.000.000 TL'dir (1 numaralı kredinin aktifleşme sonrası kur farkı hariç).\n3. 1.11.2026'da\
    \ yapılan ihracattan doğan 200.000 USD alacak, işlem günü kuru 39,00 ile kaydedilmiş, dönem sonunda\n   değerlenmemiştir.\n\
    \n**İstenenler:**\n\n(a) Yatırım finansmanından doğan kur farkının aktifleşme öncesi ve sonrası vergisel durumunu açıklayınız;\
    \ gerekli\ndüzeltmeyi ve 2026 amortismanına etkisini hesaplayınız. (9 puan)\n\n(b) Finansman gider kısıtlamasını hesaplayınız.\
    \ (7 puan)\n\n(c) Döviz alacağın değerlemesini yapınız. (4 puan)\n\n(d) Düzeltmelerin 2026 matrahına toplam etkisini ve\
    \ ilave kurumlar vergisini bulunuz. (5 puan)\n"
  cozum: "**(a) Yatırım kredisi kur farkı**\n\nYatırım finansmanında kullanılan kredilerin **aktifleşme tarihine kadar** oluşan\
    \ kur farkları ve faizleri iktisadi\nkıymetin **maliyetine** eklenir. Aktifleşmeden sonra oluşanlar doğrudan gider yazılabilir.\
