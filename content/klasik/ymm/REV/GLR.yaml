- id: YMM-REV-GLR-K002
  sinav: ymm
  ders: REV
  konu: GLR
  kazanimlar:
  - binek otomobil gider kısıtlaması
  - hasılatın dönemselliği
  - kanunen kabul edilmeyen giderler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Bilanço esasına göre defter tutan **Kartal Danışmanlık AŞ**'nin (faaliyeti binek otomobil kiralama veya işletme\n\
    değildir) 2026 revizyonunda YMM şu tespitleri yapmıştır:\n\n1. 1.7.2026'da bir binek otomobil satın alınmıştır. ÖTV ve\
    \ KDV hariç bedel 2.000.000 TL, ÖTV 1.600.000 TL,\n   KDV 720.000 TL'dir. Şirket ÖTV ve KDV'yi gider yazmayı tercih etmiş,\
    \ 2.320.000 TL'nin tamamını gider yazmıştır.\n2. Otomobil için %20 oranla 2026'da 200.000 TL (6 aylık kıst) amortisman\
    \ ayrılmıştır.\n3. Şirketin binek otomobillerine ait yakıt, bakım, onarım ve sigorta giderleri 250.000 TL'dir; tamamı\
    \ gider\n   yazılmıştır.\n4. Aralık 2026'da tamamlanıp müşteriye teslim edilen 800.000 TL'lik danışmanlık hizmetinin faturası\
    \ Ocak 2027'de\n   düzenlenmiş ve hasılat 2027'ye kaydedilmiştir.\n5. Kasım 2026'da 2027'de verilecek bir eğitim hizmeti\
    \ için alınan 500.000 TL avans 2026 hasılatı olarak\n   kaydedilmiştir.\n\n**İstenenler:**\n\n(a) Binek otomobile ilişkin\
    \ ÖTV ve KDV, amortisman ve işletme giderleri için 2026'da uygulanacak sınırları ve\nkanunen kabul edilmeyen gider tutarlarını\
    \ hesaplayınız; KDV'nin neden indirilemediğini belirtiniz. (12 puan)\n\n(b) 4 ve 5 numaralı tespitleri dönemsellik ilkesi\
    \ açısından değerlendiriniz; KDV yönünden 4 numaralı tespiti\naçıklayınız. (7 puan)\n\n(c) Tespitlerin 2026 kurumlar vergisi\
    \ matrahına toplam etkisini ve ilave vergiyi hesaplayınız. (6 puan)\n"
  cozum: "**(a) Binek otomobil**\n\n2026 tutarları 332 Seri No'lu GVK Genel Tebliğiyle belirlenmiştir.\n\n- **ÖTV ve KDV:**\
    \ İktisaba ilişkin ÖTV ve KDV toplamının en fazla **1.200.000 TL**'si gider yazılabilir\n  (GVK md. 40/1). KKEG = 2.320.000\
    \ − 1.200.000 = **1.120.000 TL**.\n- **Amortisman:** ÖTV ve KDV hariç **1.380.000 TL**'ye kadarlık kısmı amortismana konu\
    \ edilebilir (GVK md. 40/7).\n  Binek otomobillerde ilk yılda kıst amortisman ayrılır (VUK md. 320). İndirilebilir amortisman\
    \ =\n  1.380.000 × %20 × 6/12 = 138.000 TL; KKEG = 200.000 − 138.000 = **62.000 TL**.\n- **İşletme giderleri:** Binek\
    \ otomobillerin giderlerinin en fazla **%70**'i indirilebilir (GVK md. 40/5).\n  KKEG = 250.000 × %30 = **75.000 TL**.\n\
    - Binek otomobil KDV'si, otomobilin kiralama veya işletme amacıyla kullanılmadığı durumda **indirilemez**\n  (KDVK md.\
    \ 30/b). Bu nedenle maliyet veya gider unsuru olarak dikkate alınmıştır.\n\nBinek otomobil KKEG toplamı = **1.257.000\
    \ TL**.\n\n**(b) Dönemsellik**\n\nHer hesap döneminin kazancı ayrı tespit edilir. Hasılat, mal teslimi veya hizmetin tamamlanmasıyla\
    \ **tahakkuk\nettiği** dönemin geliridir (GVK md. 38; MSUGT tahakkuk ve dönemsellik kavramları).\n\n- 4 numaralı tespit:\
    \ Hizmet 2026'da tamamlandığından 800.000 TL **2026 hasılatıdır**; matraha eklenir. Hizmetin\n  tamamlanmasıyla KDV'yi\
    \ doğuran olay 2026'da gerçekleşmiştir (KDVK md. 10). Fatura VUK md. 231'deki süre içinde\n  düzenlenmediğinden özel usulsüzlük\
    \ cezası (VUK md. 353) gündeme gelir. KDV Aralık 2026 dönemi için beyan\n  edilmelidir.\n- 5 numaralı tespit: Hizmet 2027'de\
    \ verilecek olduğundan alınan tutar **avanstır** (340 Alınan Sipariş Avansları).\n  2026 matrahından **düşülür**, 2027\
    \ hasılatı olur.\n\n**(c) Toplam etki**\n\n| Kalem | TL |\n|---|---|\n| Binek otomobil KKEG | +1.257.000 |\n| 2026'ya\
    \ ait hasılat | +800.000 |\n| 2027'ye ait avans | (500.000) |\n| **Matraha net etki** | **+1.557.000** |\n| İlave kurumlar\
    \ vergisi (%25) | 389.250 |\n"
