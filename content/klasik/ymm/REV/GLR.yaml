  - olcut: (a) Amortisman sınırı 1.380.000, kıst amortisman ve 62.000 TL KKEG
    puan: 4
  - olcut: (a) %70 sınırı ve 75.000 TL KKEG
    puan: 3
  - olcut: (a) KDV'nin indirilememesi (KDVK md. 30/b)
    puan: 2
  - olcut: (b) Hizmetin tamamlandığı dönemde hasılat ve KDV/fatura sonuçları
    puan: 4
  - olcut: (b) Avansın gelecek dönem hasılatı olması
    puan: 3
  - olcut: (c) Net etki 1.557.000 ve ilave vergi 389.250 TL
    puan: 6
