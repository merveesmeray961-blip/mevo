    - Genel bütçeli bir kamu idaresine bağışlanmak üzere yaptırılan okul binasının inşası için yapılan harcamalar: **1.800.000
    TL**


    **2. Diğer giderler** (tamamı gider yazılmıştır):


    - Trafik para cezaları **25.000 TL**, Vergi Usul Kanunu uyarınca ödenen gecikme faizi **40.000 TL**, vergi cezası **60.000
    TL**.

    - Alkollü içkilere ait ilan ve reklam giderleri **400.000 TL**.

    - Şirketin esas faaliyet konusu ile ilgisi olmayan, işletmede kayıtlı bir motorlu deniz taşıtına (yat) ilişkin giderler
    **150.000 TL** ve amortismanı **50.000 TL**.


    Bağış ve yardımlara ilişkin %5 sınırının hesabında esas alınacak "o yıla ait kurum kazancı", ticari bilanço kârına bu
    soruda belirtilen tüm kanunen kabul edilmeyen giderlerin (bağış ve yardımların tamamı dahil) eklenmesiyle bulunacaktır
    (geçmiş yıl zararı, istisna ve başka indirim yoktur).


    **İstenenler**


    (a) 2 numaralı giderlerden kurumlar vergisi matrahının tespitinde kabul edilmeyen tutarları KVK md. 11 uyarınca belirleyiniz.
    (6 puan)


    (b) Bağış ve yardımlardan hangilerinin KVK md. 10 kapsamında indirilebileceğini, aynî bağışın hangi değerle dikkate alınacağını
    ve %5 sınırı uygulanan bağışlar için indirilebilecek tutarı hesaplayınız; %5 sınırını aşan kısım ile kapsam dışı bağışın
    vergisel sonucunu belirtiniz. (9 puan)


    (c) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (7 puan)

    '
  cozum: '**(a) Kabul edilmeyen giderler (KVK md. 11/1)**


    | Kalem | Dayanak | KKEG (TL) |

    |---|---|---|

    | Trafik para cezaları | md. 11/1-d (para cezaları) | 25.000 |

    | VUK gecikme faizi | md. 11/1-d | 40.000 |

    | Vergi cezası | md. 11/1-d | 60.000 |

    | Alkollü içki ilan ve reklam giderleri: 400.000 x %50 | md. 11/1-ı | 200.000 |

    | Yat giderleri ve amortismanı: 150.000 + 50.000 | md. 11/1-f | 200.000 |

    | **Toplam** | | **525.000** |


    **(b) Bağış ve yardımlar (KVK md. 10/1-c, ç, 10/2)**


    *Aynî bağış değeri:* Bağış ve yardımların nakden yapılmaması halinde bağışlanan malın **maliyet bedeli veya kayıtlı değeri**
    esas alınır (md. 10/2). Kayıtlı değer **250.000 TL**''dir; rayiç bedel (330.000 TL) dikkate alınmaz.


    *%5 sınırlı bağışlar (md. 10/1-c):* Makbuz karşılığında kamu idarelerine, belediyelere, kamu yararına çalışan derneklere
    ve bilimsel araştırma ve geliştirme faaliyetinde bulunan kuruluşlara yapılan bağışlar toplamının o yıla ait kurum kazancının
    **%5''ine** kadar olan kısmı indirilir.


    | Kalem | Tutar (TL) |

    |---|---|

    | Belediye | 600.000 |

    | Kamu yararına çalışan dernek | 400.000 |

    | Bilimsel araştırma kuruluşu (kayıtlı değer) | 250.000 |

    | **Sınıra tabi bağışlar toplamı** | **1.250.000** |


    Kurum kazancı = 15.000.000 + 525.000 (KKEG, a şıkkı) + bağış ve yardımların tamamı (600.000 + 400.000 + 250.000 + 150.000
    + 1.800.000 = 3.200.000) = **18.725.000 TL**


    - %5 sınır = 18.725.000 x %5 = **936.250 TL**

    - İndirilebilecek tutar = en az (1.250.000 ; 936.250) = **936.250 TL**

    - Sınırı aşan kısım = 1.250.000 - 936.250 = **313.750 TL**; indirim konusu yapılamaz, kurum kazancından düşülmez.


    *Okul inşası (md. 10/1-ç):* Kamu idarelerine bağışlanan okulun inşası dolayısıyla yapılan harcamalar **tamamı** indirilir:
    **1.800.000 TL** (%5 sınırına tabi değildir).


    *Spor kulübü derneği bağışı:* Kamu yararına çalışan dernek niteliği olmadığından md. 10 kapsamında **indirilemez**; 150.000
    TL kurum kazancına ilave edilir (indirim yok).


    **(c) Matrah ve vergi**


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 15.000.000 |

    | (+) Kabul edilmeyen giderler (a) | 525.000 |

    | (+) Bağış ve yardımların gider yazılan tutarı | 3.200.000 |

    | **Kurum kazancı** | **18.725.000** |

    | (-) Bağış indirimi (%5 sınırlı) | (936.250) |

    | (-) Okul inşası bağışı (tamamı) | (1.800.000) |

    | **Kurumlar vergisi matrahı** | **15.988.750** |

    | Hesaplanan kurumlar vergisi (%25) | **3.997.187,50** |


    Bağış ve yardım indirimleri beyanname üzerinde ayrıca gösterilmek şartıyla yapılır.

    '
