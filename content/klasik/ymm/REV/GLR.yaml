  dogrulama:
    python: 'zorunlu = 100000 + 150000

      kar_etki_a = zorunlu - zorunlu * 0.60

      faiz_tahakkuk = 6000000 * 0.40 * 2 / 12

      kkeg = 80000 + 12000 + 5000

      duz_kar = 8000000 + kar_etki_a + faiz_tahakkuk

      kazanc = duz_kar + kkeg

      sonuc = {"zorunlu_maliyet": zorunlu, "kar_etki_a": kar_etki_a, "faiz_tahakkuk": faiz_tahakkuk, "kkeg": kkeg, "duzeltilmis_ticari_kar":
      duz_kar, "kurum_kazanci": kazanc, "kurumlar_vergisi": kazanc * 0.25}

      '
