  - olcut: (b) Faiz tahakkukunun (400.000 TL) doğru süreyle hesaplanması
    puan: 2
  - olcut: (b) 181 / 642 kaydı
    puan: 2
  - olcut: (b) VUK md. 281 veya dönemsellik dayanağının gösterilmesi
    puan: 1
  - olcut: (c) Vergi cezası, gecikme zammı ve trafik cezasının md. 11/1-(d) uyarınca KKEG sayılması (her biri 1 puan)
    puan: 3
  - olcut: (c) Ceza şartı tazminatının md. 11/1-(g) istisnası nedeniyle indirilebilir olduğunun gerekçesiyle belirtilmesi
    puan: 3
  - olcut: (d) Düzeltilmiş ticari kârın (8.500.000 TL) bulunması
    puan: 2
  - olcut: (d) Kurum kazancının (8.597.000 TL) bulunması
    puan: 2
  - olcut: (d) Kurumlar vergisinin (2.149.250 TL) hesaplanması
    puan: 2
