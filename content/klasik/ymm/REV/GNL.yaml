- id: YMM-REV-GNL-K001
  sinav: ymm
  ders: REV
  konu: GNL
  kazanimlar:
  - karşılaştırma ve teyit
  - çalışma kâğıtları
  - revizyonun amacı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Tam tasdik sözleşmesi bulunan Ege Kıyı Turizm A.Ş.''nin 2026 hesap dönemi revizyonunda YMM, analitik inceleme
    yapmaktadır. Otelin rezervasyon sistemi üzerindeki kontroller test edilmiş ve etkin bulunmuştur. Veriler:


    | Bilgi | 2025 | 2026 |

    |---|---|---|

    | Oda sayısı / açık gün | — | 120 oda / 365 gün |

    | Ortalama doluluk oranı (rezervasyon sistemi) | — | %70 |

    | Ortalama net oda fiyatı (KDV hariç) | — | 2.500 TL |

    | Kayıtlı konaklama hasılatı | — | 74.150.000 TL |

    | Ortalama personel sayısı | — | 85 kişi |

    | Kişi başı aylık ortalama personel maliyeti (bordrodan) | — | 60.000 TL |

    | Kayıtlı personel giderleri | — | 63.000.000 TL |

    | Yiyecek-içecek satışları | 25.000.000 TL | 30.000.000 TL |

    | Yiyecek-içecek satışların maliyeti | 9.500.000 TL | 14.400.000 TL |


    YMM, ek araştırma yapılmaksızın kabul edilebilir farkı konaklama hasılatı için 750.000 TL, personel giderleri için 2.000.000
    TL olarak belirlemiştir. Yiyecek-içecekte menü fiyatları ve tedarik koşullarında önemli bir değişiklik olmadığı yönetimce
    beyan edilmiştir.


    **İstenenler:**


    (a) Konaklama hasılatı için beklenen tutarı ve kayıtlı tutarla farkı hesaplayınız; farkın ek araştırma gerektirip gerektirmediğini
    gerekçesiyle belirtiniz. (7 puan)


    (b) Personel giderleri için beklenen tutarı ve farkı hesaplayıp sonucu değerlendiriniz. (4 puan)


    (c) Yiyecek-içecek brüt satış kârı oranlarını iki yıl için hesaplayınız; 2025 oranı korunsaydı 2026 için beklenecek satışların
    maliyetini ve kayıtlı tutarla farkı bulunuz. Bu sapmayı açıklayabilecek en az üç olası nedeni yazınız. (7 puan)


    (d) Analitik incelemenin YMM Tasdik Yönetmeliği''ndeki tanımını açıklayınız; beklenenden ciddi ölçüde farklı sonuçlar
    karşısında BDS 520 uyarınca yapılacak işlemleri ve bu çalışmanın çalışma kâğıtlarında nasıl belgelendirileceğini yazınız.
    (7 puan)

    '
  cozum: '**(a) Konaklama hasılatı**


    - Satılabilir oda-gece: 120 × 365 = 43.800

    - Beklenen satılan oda-gece: 43.800 × %70 = 30.660

    - Beklenen hasılat: 30.660 × 2.500 = **76.650.000 TL**

    - Fark: 76.650.000 − 74.150.000 = **2.500.000 TL** (kayıtlı hasılat beklenenden düşük)


    Fark, belirlenen kabul edilebilir fark olan 750.000 TL''yi aştığından ek araştırma gerekir. Beklentiyi oluşturan veri
    (rezervasyon sistemi), kontrolleri test edilmiş ve etkin bulunmuş bir kaynaktan geldiği için beklenti yeterince kesindir
    (BDS 520 par. 5/b-c). Düşük kayıtlı hasılat; kayda alınmamış konaklama hasılatı (hasılatın tamlığı), dönemsellik (kesim)
    hatası, kayda yansıtılmış ancak belgesi zayıf iptal ve indirimler veya ücretsiz konaklamalar yönünden incelenmelidir.


    **(b) Personel giderleri**


    - Beklenen: 85 × 60.000 × 12 = **61.200.000 TL**

    - Fark: 63.000.000 − 61.200.000 = **1.800.000 TL** (kayıtlı tutar fazla)


    Fark, kabul edilebilir fark olan 2.000.000 TL''nin altında kaldığından BDS 520 par. 7 kapsamında ek araştırma gerekmez;
    sonuç çalışma kâğıdına yazılır.


    **(c) Yiyecek-içecek brüt satış kârı**


    - 2025 brüt kâr oranı: (25.000.000 − 9.500.000) / 25.000.000 = **%62**

    - 2026 brüt kâr oranı: (30.000.000 − 14.400.000) / 30.000.000 = **%52**

    - 2025 oranıyla beklenen 2026 maliyeti: 30.000.000 × (1 − 0,62) = **11.400.000 TL**

    - Fark: 14.400.000 − 11.400.000 = **3.000.000 TL** (maliyet beklenenden fazla)


    Fiyat ve tedarik koşulları değişmediği hâlde oranın 10 puan düşmesi açıklanmalıdır. Olası nedenler: (1) kayda alınmamış
    yiyecek-içecek satışları (hasılat eksikliği), (2) dönem sonu stok sayımında eksik sayım veya hatalı değerleme nedeniyle
    maliyetin fazla hesaplanması, (3) personel yemekleri, ikramlar veya fire ve kayıpların satışların maliyetine yüklenmesi,
    (4) alışlarda dönemsellik hatası veya işletmeyle ilgisiz alışların maliyete alınması.


    **(d) Analitik inceleme, araştırma ve belgelendirme**


    - Tanım (md. 15/f): İşletme hesap ve işlemlerinde ortaya çıkması gereken normal sonuçlardaki sapmaları tespit etmek amacıyla
    cari yıl hesaplarının randıman, verimlilik, üretim, tüketim, kapasite kullanımı vb. bakımlardan önceki yıl sonuçları,
    kapasite raporları, bütçe verileri veya sektör ortalamasıyla oran ve trend analizi gibi yöntemlerle karşılaştırılması
    ve değerlendirilmesidir.

    - BDS 520 par. 7: Beklenenden ciddi ölçüde farklı sonuçlar; yönetimin sorgulanması ve yönetimin yanıtlarıyla ilgili uygun
    kanıt elde edilmesi ve içinde bulunulan şartlar altında gerekli diğer prosedürlerin uygulanması yoluyla araştırılır. Yönetimin
    açıklaması tek başına yeterli kabul edilmez; örneğin konaklama farkı için rezervasyon kayıtları ile faturalar ve tahsilatlar
    karşılaştırılır.

    - Çalışma kâğıtları (md. 17): Başlıkta müşteri, dönem, konu, hazırlayan YMM''nin ad ve parafı ile tarih bulunur; kâğıt
    kodlanır; beklentinin dayanağı olan veriler ve kaynakları, kabul edilebilir fark, hesaplamalar, yönetimden alınan açıklamalar
    ile elde edilen kanıtlar ve ulaşılan sonuç, kullanılan puantaj işaretlerinin anlamlarıyla birlikte gösterilir.

    '
  puanlama:
  - olcut: (a) Satılabilir ve satılan oda-gece ile beklenen hasılatın (76.650.000 TL) doğru hesaplanması
    puan: 3
  - olcut: (a) Farkın (2.500.000 TL) bulunması, kabul edilebilir farkla karşılaştırılarak araştırma gerektiğinin gerekçelendirilmesi
      ve olası nedenlerin belirtilmesi
    puan: 4
  - olcut: (b) Beklenen personel giderinin (61.200.000 TL) ve farkın (1.800.000 TL) hesaplanması, ek araştırma gerekmediği
      sonucu
    puan: 4
  - olcut: (c) İki yılın brüt kâr oranlarının (%62 ve %52) hesaplanması
    puan: 2
  - olcut: (c) Beklenen maliyetin (11.400.000 TL) ve farkın (3.000.000 TL) bulunması
    puan: 2
  - olcut: (c) En az üç makul olası nedenin yazılması
    puan: 3
  - olcut: (d) Md. 15/f analitik inceleme tanımı
    puan: 2
  - olcut: (d) BDS 520 par. 7'deki iki araştırma adımı ve yönetim açıklamasının kanıtla desteklenmesi
    puan: 3
  - olcut: (d) Md. 17'ye uygun çalışma kâğıdı içeriği
    puan: 2
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
