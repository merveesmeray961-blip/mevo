    alinti: 'Analitik inceleme: İşletme hesap ve işlemlerinde ortaya çıkması gereken normal sonuçlarda, varsa sapmaların tespit
      edilmesi amacıyla, cari yıl hesaplarının aylık veya yıllık olarak randıman, verimlilik, üretim, tüketim, kapasite kullanımı
      vb. bakımlardan; önceki yıl hesap ve işlemleriyle kapasite raporlarındaki sonuçlarla, bütçe verileriyle veya sektör
