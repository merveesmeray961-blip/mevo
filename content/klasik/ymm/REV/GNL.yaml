      vb. bakımlardan; önceki yıl hesap ve işlemleriyle kapasite raporlarındaki sonuçlarla, bütçe verileriyle veya sektör
      ortalamasıyla'
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 7
    alinti: Yönetimin sorgulanması ve yönetimin verdiği yanıtlarla ilgili uygun denetim kanıtlarının elde edilmesi ve İçinde
