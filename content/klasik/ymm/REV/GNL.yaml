    '
  cozum: '**(a) YMM Revizyonunun Amacı ve Bağımsız Denetimden Farkı**


    YMM revizyonu; finansal tabloların doğruluğunu, güvenilirliğini ve vergi mevzuatına uygunluğunu birlikte sağlamayı amaçlar.
    YMM, tasdik işlevi aracılığıyla mesleki sorumluluk üstlenir.


    Bağımsız denetim ise genel amaçlı finansal raporlamanın Türkiye Muhasebe Standartları''na uygunluğunu denetler; vergisel
    uygunluk birincil amaç değildir. YMM revizyonunun ayırt edici özelliği; vergi boyutunu ve tasdik sorumluluğunu birlikte
    taşımasıdır.


    **(b) Her Bulgu İçin Adımlar ve Tasdik Etkisi**


    **Bulgu 1 — 450.000 TL belgesiz gider (689 hesabı):**

    - İşletmeden dayanak belge (fatura, sözleşme veya benzeri) talep edilir.

    - Belge temin edilemezse gider VUK md. 227 uyarınca kabul edilmez; KVK md. 11 kapsamında KKEG olarak değerlendirilir.

    - Tasdik raporu: 450.000 TL eleştiri konusu yapılır; olumlu tasdik verilemez, şartlı tasdik ya da ret değerlendirilir.


    **Bulgu 2 — 120.000 TL dönem dışı gider:**

    - Fatura tarihleri 2025, kayıt tarihleri 2026 olduğundan dönemsellik ilkesi (VUK md. 283) ihlali söz konusudur.

    - Giderler 2025 dönemine alınarak dönem matrahı düzeltilir.

    - Tasdik raporu: 120.000 TL tutarında dönem dışı gider tespiti yapılır.


    **Bulgu 3 — 75.000 TL imzasız fatura:**

    - VUK md. 230 uyarınca imza faturada aranmaz; ancak imzanın gerçekliği veya hizmetin gerçekleştiğine dair ek kanıt (irsaliye,
    teslim belgesi) istenir.

    - Ek kanıt sağlanamazsa 75.000 TL gider reddedilebilir.

    - Tasdik raporu: Ek belge yoksa eleştiri yapılır.

    '
