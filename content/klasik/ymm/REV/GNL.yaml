  soru: 'P A.Ş., perakende gıda sektöründe faaliyet göstermekte olup YMM Kadir Bey 2025 yılı revizyon çalışmasını yürütmektedir.


    Revizyon sırasında şu bilgiler elde edilmiştir:

    - 31.12.2025 itibarıyla 120 Alıcılar hesabı bakiyesi: 1.200.000 TL

    - Gönderilen 15 teyit mektubundan 3 tanesi için yanıt alınamamıştır.

    - Yanıt alınan 12 mektuptan 2 tanesinde beyan edilen tutar kayıtlardaki tutardan farklıdır.


    **(a)** Belge ve kayıt incelemesi ile teyit tekniği arasındaki farkı açıklayınız. **(8 puan)**


    **(b)** Yanıt alınamayan 3 teyit mektubu ve farklı tutar içeren 2 mektup için YMM''nin izlemesi gereken yöntemi açıklayınız.
    **(12 puan)**

    '
  cozum: '**(a) Belge ve Kayıt İncelemesi ile Teyit Tekniği Farkı**


    Belge ve kayıt incelemesi; işletmenin kendi belgeleri (fatura, irsaliye, defter kaydı) üzerinden yapılan içsel doğrulamadır.
    YMM, kayıtların belgelere dayalı olup olmadığını ve belgelerin gerçeği yansıtıp yansıtmadığını araştırır.


    Teyit tekniği ise bakiye veya işlemlerin bağımsız üçüncü taraflardan (banka, borçlu, alacaklı) yazılı olarak doğrulanmasıdır.
    Dışarıdan gelen bağımsız kanıt olması nedeniyle teyit, belge incelemesinden daha güçlü bir kanıt niteliği taşır.


    **(b) Yanıtsız ve Farklı Tutarlı Mektuplar İçin Yöntem**


    **Yanıt alınamayan 3 mektup:**

    - YMM ikinci bir teyit mektubu gönderir.

    - Hâlâ yanıt alınamazsa alternatif prosedürler uygulanır: ilgili alacakların tahsilat kayıtları incelenir, sonraki dönemdeki
    ödemelere bakılır, muhasebe kayıtları ile satış sözleşmeleri karşılaştırılır.


    **Farklı tutar bildiren 2 mektup:**

    - YMM farkların nedenini araştırır: tahsilat kaydı yapılmış ancak mutabakat henüz güncellenmemiş olabilir; iade veya iskonto
    söz konusu olabilir; ya da muhasebe hatası bulunabilir.

    - Her fark belgeye dayalı olarak açıklanmalıdır; açıklanamayan farklar bulgu olarak çalışma kâğıdına işlenir.

    '
