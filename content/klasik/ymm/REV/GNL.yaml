  dogrulama:
    python: "satilan = 120 * 365 * 0.70\nbeklenen_konaklama = satilan * 2500\nbeklenen_personel = 85 * 60000 * 12\nbko_2025\
      \ = (25000000 - 9500000) / 25000000 * 100\nbko_2026 = (30000000 - 14400000) / 30000000 * 100\nbeklenen_smm = 30000000\
      \ * (1 - bko_2025 / 100)\nsonuc = {\"beklenen_konaklama\": beklenen_konaklama,\n         \"konaklama_farki\": beklenen_konaklama\
      \ - 74150000,\n         \"beklenen_personel\": beklenen_personel,\n         \"personel_farki\": 63000000 - beklenen_personel,\n\
      \         \"bko_2025\": bko_2025, \"bko_2026\": bko_2026,\n         \"beklenen_smm\": beklenen_smm,\n         \"smm_farki\"\
      : 14400000 - beklenen_smm}\n"
