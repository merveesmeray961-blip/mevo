  soru: 'Tam mükellef ve hesap dönemi takvim yılı olan **Ege Holding AŞ** (finans ve sigorta sektöründe değildir) ile YMM

    arasında tam tasdik sözleşmesi bulunmaktadır. Şirketin 2026 yılı ticari bilanço kârı **20.000.000 TL**,

    kanunen kabul edilmeyen giderleri **500.000 TL**''dir. Ticari kâra dahil kâr payları:


    | No | Dağıtan şirket | Bilgi | Kâr payı (TL) |

    |---|---|---|---|

    | 1 | X AŞ (tam mükellef) | %15 pay | 2.000.000 |

    | 2 | A GmbH (yurt dışı) | %30 pay, 2021''den beri elde tutuluyor, toplam vergi yükü %29, kâr payı Mart 2027''de Türkiye''ye
    transfer edilmiş | 5.000.000 |

    | 3 | B LLC (yurt dışı, limited şirket niteliğinde) | %60 pay, Mayıs 2026''da edinildi, toplam vergi yükü %9, kâr payı
    Aralık 2026''da Türkiye''ye transfer edilmiş | 4.000.000 |

    | 4 | C SA (yurt dışı) | %5 pay; kaynak ülkede %10 (100.000 TL) vergi kesilmiş, kesinti gider yazılmış ve KKEG''e eklenmiştir
    | 1.000.000 |


    Şirketin geçmiş yıl zararı, kurumlar vergisi matrahından indirilecek başka bir tutarı ve geçici vergi ödemesi yoktur.


    **İstenenler:**


    (a) Her kâr payının istisna durumunu şartlarıyla değerlendirerek istisna tutarlarını belirleyiniz. (11 puan)


    (b) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (5 puan)


    (c) Yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız. (5 puan)


    (d) Yurt dışında ödenen verginin mahsup edilebilecek tutarını ve ödenecek kurumlar vergisini hesaplayınız. (4 puan)

    '
  cozum: "**(a) İstisna değerlendirmesi**\n\n1. **X AŞ:** Tam mükellef kurumun sermayesine katılımdan elde edilen kazanç,\
    \ pay oranı ve elde tutma süresi\n   aranmaksızın **tamamen istisnadır** (KVK md. 5/1-a-1): **2.000.000 TL**.\n2. **A\
    \ GmbH:** KVK md. 5/1-b şartları sağlanmıştır: en az %10 pay (%30), en az bir yıl kesintisiz elde tutma,\n   en az %15\
    \ toplam vergi yükü (%29) ve beyanname verme süresine (30.4.2027) kadar transfer. **Tamamı istisna:\n   5.000.000 TL**.\n\
    3. **B LLC:** Bir yıllık elde tutma ve %15 vergi yükü şartları sağlanmadığından genel istisna uygulanamaz. Ancak\n   KVK\
    \ md. 5/1-b üçüncü paragrafı, diğer şartlar aranmaksızın, belirli pay oranına sahip olunması ve kazancın beyan\n   süresine\
    \ kadar Türkiye'ye transfer edilmesi şartıyla kısmi istisna öngörür. 11257 sayılı Cumhurbaşkanı Kararıyla\n   1.1.2026'dan\
    \ itibaren başlayan dönemler için en az %20 pay sahipliğinde oran **%80**'dir. İstisna =\n   4.000.000 × %80 = **3.200.000\
    \ TL**; 800.000 TL vergiye tabidir.\n4. **C SA:** Pay oranı %10'un altında olduğundan istisna **uygulanmaz**; 1.000.000\
    \ TL'nin tamamı vergiye tabidir.\n\nToplam istisna = 2.000.000 + 5.000.000 + 3.200.000 = **10.200.000 TL**.\n\n**(b) Matrah\
    \ ve vergi**\n\n| Kalem | TL |\n|---|---|\n| Ticari bilanço kârı | 20.000.000 |\n| + KKEG | 500.000 |\n| − İştirak kazançları\
    \ istisnaları | (10.200.000) |\n| **Kurumlar vergisi matrahı** | **10.300.000** |\n| Hesaplanan kurumlar vergisi (%25)\
    \ | 2.575.000 |\n\n**(c) Yurt içi asgari kurumlar vergisi (KVK md. 32/C)**\n\nAsgari vergi, indirim ve istisnalar düşülmeden\
    \ önceki kurum kazancının (ticari kâr + KKEG) %10'undan az olamaz.\nBu tutardan yalnız md. 32/C-2'de sayılan istisnalar\
    \ düşülür. KVK md. 5/1-a istisnası düşülebilir, md. 5/1-b istisnası\ndüşülemez.\n\n- Asgari matrah = 20.500.000 − 2.000.000\
    \ = 18.500.000 TL; asgari vergi = **1.850.000 TL**.\n- Hesaplanan vergi (2.575.000 TL) asgari vergiden yüksek olduğundan\
    \ **2.575.000 TL** esas alınır.\n\n**(d) Yurt dışı vergi mahsubu (KVK md. 33)**\n\nYurt dışında ödenen vergi, o kazanca\
    \ Türkiye'de isabet eden kurumlar vergisini aşmamak üzere mahsup edilir:\nsınır = 1.000.000 × %25 = 250.000 TL; ödenen\
    \ 100.000 TL'nin **tamamı** mahsup edilir.\n\nÖdenecek kurumlar vergisi = 2.575.000 − 100.000 = **2.475.000 TL**. YMM,\
    \ transfer tarihlerini banka kayıtlarıyla,\nvergi yükünü ve pay oranlarını resmî belgelerle (yurt dışı vergi beyannamesi,\
    \ ortaklık kayıtları) tevsik ederek\ntasdik raporuna bağlamalıdır.\n"
  puanlama:
