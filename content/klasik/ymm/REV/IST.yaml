    '
  cozum: "**(a) İstisna değerlendirmesi**\n\nKVK md. 5/1-e uyarınca en az iki tam yıl aktifte yer alan iştirak hisselerinin\
    \ satış kazancının belirli bir kısmı\nistisnadır. 26.11.2024 tarihli ve 9160 sayılı Cumhurbaşkanı Kararıyla oran **%50**'dir.\
    \ 7456 sayılı Kanunla\n15.7.2023'ten itibaren taşınmazlar istisna kapsamından çıkarılmıştır. O tarihten önce aktifte yer\
    \ alan taşınmazlar\niçin KVK geçici md. 16 uyarınca eski hükümler **%25** oranıyla uygulanır.\n\n| No | Kazanç (TL) |\
    \ Değerlendirme | İstisna (TL) |\n|---|---|---|---|\n| 1 | 6.000.000 | İki tam yıldan fazla elde tutulmuş iştirak hissesi;\
    \ %50 | 3.000.000 |\n| 2 | 5.000.000 | 15.7.2023'ten önce aktifte; iki tam yıl şartı sağlanmış; geçici md. 16 ile %25\
    \ | 1.250.000 |\n| 3 | 2.000.000 | 15.7.2023'ten sonra edinilen taşınmaz; istisna yok | – |\n| 4 | 1.500.000 | İki tam\
    \ yıl dolmamış; istisna yok | – |\n| **Toplam** | | | **4.250.000** |\n\n**(b) Matrah**\n\n- Matrah = 18.000.000 + 300.000\
    \ − 4.250.000 = **14.050.000 TL**; hesaplanan vergi = **3.512.500 TL**.\n- Asgari kurumlar vergisi: KVK md. 5/1-e istisnası\
    \ md. 32/C-2'de sayılmadığından asgari matrahtan düşülemez.\n  Asgari vergi = 18.300.000 × %10 = **1.830.000 TL**. Hesaplanan\
