- id: YMM-REV-IST-K001
  sinav: ymm
  ders: REV
  konu: IST
  kazanimlar:
  - iştirak kazançları istisnası
  - yurt dışı iştirak ve şube kazançları istisnası
  - taşınmaz ve iştirak hissesi satış istisnası
  - yurt dışı inşaat onarım montaj kazançları istisnası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Demir Makine A.Ş.** 2008''den beri faaliyettedir; finans sektöründe değildir, menkul kıymet veya taşınmaz ticaretiyle
    uğraşmamaktadır. Hesap dönemi takvim yılıdır. 2026 yılı ticari bilanço kârı **12.000.000 TL**, kanunen kabul edilmeyen
    giderleri **300.000 TL**''dir. Geçmiş yıl zararı ve KVK md. 10 indirimi yoktur. Ticari kâra dahil olan işlemler şunlardır:


    | No | İşlem | Tutar (TL) |

    |---|---|---|

    | 1 | Sermayesinin %4''üne sahip olunan tam mükellef K A.Ş.''den kâr payı | 500.000 |

    | 2 | Romanya''daki R SRL''den (limited şirket, esas faaliyeti üretim, %40 pay, 2021''den beri) kâr payı. R SRL''nin kâr
    payına kaynak dönemde vergi sonrası dağıtılabilir kazancı 1.800.000 TL, ödediği vergi 200.000 TL''dir. Kâr payı Mart 2027''de
    Türkiye''ye transfer edilmiştir. | 1.000.000 |

    | 3 | 2022''de alınan L A.Ş. paylarının Haziran 2026''da satışından kazanç. Satış bedeli 4.000.000 TL; 2.500.000 TL''si
    2026''da, kalanı Mart 2027''de tahsil edilecektir. | 2.400.000 |

    | 4 | 2017''de alınan arsanın satış kazancı (bedel peşin tahsil edildi) | 2.000.000 |

    | 5 | Ocak 2024''te alınan depo binasının satış kazancı (bedel peşin tahsil edildi) | 600.000 |

    | 6 | Irak''ta yapılan inşaat işinden elde edilip Türkiye''de genel sonuç hesaplarına alınan kâr | 900.000 |


    Yurt dışında ödenen vergilerin mahsubu (KVK md. 33) bu soruda dikkate alınmayacaktır. Şirket istisna şartı olan özel fonu
    2026 yılında oluşturacaktır.


    **İstenenler:**


    (a) Her işlemin istisna durumunu dayanağıyla belirleyiniz ve istisna tutarını hesaplayınız. (10 puan)


    (b) 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (6 puan)


    (c) Yurt içi asgari kurumlar vergisi kontrolünü yaparak ödenecek kurumlar vergisini belirleyiniz. (5 puan)


    (d) Özel fona alınması gereken tutarı ve fonun tutulma süresini belirtiniz; fonun tamamının 2028 yılında ortaklara dağıtılması
    hâlinde ziyaa uğramış sayılacak kurumlar vergisini hesaplayınız. (4 puan)

    '
  cozum: '**(a) İstisna durumu**


    1. **Yurt içi iştirak kazancı** (KVK md. 5/1-a): Pay oranı ve süre şartı yoktur. İstisna **500.000 TL**.

    2. **Yurt dışı iştirak kazancı** (md. 5/1-b): Vergi yükü = 200.000 / (1.800.000 + 200.000) = **%10** < %15 olduğundan
    tam istisna şartı sağlanmaz. Ancak pay %40 (≥ %20) ve kâr payı beyanname verilmesi gereken tarihten (25 Nisan 2027) önce
    transfer edildiğinden, md. 5/1-b üçüncü paragraf ve 11257 sayılı CBK uyarınca 2026 için **%80 kısmi istisna** uygulanır:
    1.000.000 × %80 = **800.000 TL**. Kalan 200.000 TL vergilendirilir.

    3. **İştirak hissesi satışı** (md. 5/1-e; 9160 sayılı CBK): Paylar iki tam yıldan fazla aktifte kalmıştır. Bedelin satışı
    izleyen ikinci takvim yılı sonuna (31/12/2028) kadar tahsili yeterli olduğundan 2027 tahsilatı istisnaya engel değildir.
    2.400.000 × %50 = **1.200.000 TL**.

    4. **Arsa satışı** (geçici md. 16): 15/7/2023''ten önce aktifte olduğu için eski hüküm uygulanır, oran %25: 2.000.000
    × %25 = **500.000 TL**.

    5. **Depo binası**: 15/7/2023''ten sonra edinildiğinden taşınmaz satış istisnası yoktur. İstisna **0 TL**; 600.000 TL
    vergilendirilir.

    6. **Yurt dışı inşaat kazancı** (md. 5/1-h): Genel sonuç hesaplarına intikal ettirildiği için istisna; vergi yükü ve transfer
    şartı yoktur. İstisna **900.000 TL**.


    Toplam istisna = 500.000 + 800.000 + 1.200.000 + 500.000 + 900.000 = **3.900.000 TL**.


    **(b) Matrah ve hesaplanan vergi**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | + KKEG | 300.000 |

    | − İstisnalar | 3.900.000 |

    | Kurumlar vergisi matrahı | 8.400.000 |

    | Hesaplanan KV (%25, KVK md. 32) | 2.100.000 |


    **(c) Asgari kurumlar vergisi** (md. 32/C)


    İndirim ve istisnalar öncesi kurum kazancı = 12.000.000 + 300.000 = 12.300.000 TL (md. 32/C-6). md. 32/C-2''ye göre bu
    tutardan yalnız md. 5/1-a kazancı (500.000 TL) düşülür; (b), (e), (h) bentleri ve geçici md. 16 istisnası listede yoktur.
    Asgari matrah = 11.800.000 TL; asgari KV = 11.800.000 × %10 = **1.180.000 TL**. Hesaplanan vergi 2.100.000 TL daha yüksek
    olduğundan ödenecek kurumlar vergisi **2.100.000 TL**''dir.


    **(d) Özel fon**


    Fon tutarı = 1.200.000 (hisse) + 500.000 (arsa) = **1.700.000 TL** (590 Dönem Net Kârı borç / 549 Özel Fonlar alacak).
    Fon, satış yılını izleyen beşinci yılın sonuna, yani **31/12/2031**''e kadar pasifte tutulur. Bu sürede sermayeye ilave
    dışında dağıtılması md. 5/1-e gereği vergi ziyaı sayılır: 1.700.000 × %25 = **425.000 TL** kurumlar vergisi ziyaa uğramış
    sayılır.

    '
  puanlama:
  - olcut: 1, 4, 5 ve 6 numaralı işlemlerin istisna durumu ve tutarları (her biri 1 puan)
    puan: 4
  - olcut: Yurt dışı iştirakte vergi yükünün %10 hesaplanması ve 11257 sayılı CBK ile %80 kısmi istisnanın (800.000 TL) uygulanması
    puan: 3
  - olcut: Hisse satışında süre ve tahsil şartının değerlendirilip %50 istisnanın (1.200.000 TL) hesaplanması
    puan: 3
  - olcut: Toplam istisnanın ve 8.400.000 TL matrahın bulunması
    puan: 4
  - olcut: Hesaplanan kurumlar vergisinin 2.100.000 TL bulunması
    puan: 2
  - olcut: Asgari KV tabanından yalnız md. 5/1-a kazancının düşülmesi ve 1.180.000 TL asgari verginin hesaplanması
    puan: 4
  - olcut: Ödenecek verginin 2.100.000 TL olarak belirlenmesi
    puan: 1
  - olcut: Fon tutarı 1.700.000 TL ve 31/12/2031'e kadar tutulma süresi
    puan: 2
  - olcut: Dağıtım hâlinde 425.000 TL vergi ziyaının hesaplanması
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a, b, e, h; geçici md. 16; md. 32; md. 32/C
  - mevzuat: 11257 sayılı Cumhurbaşkanı Kararı
    madde: md. 2/1
  - mevzuat: 9160 sayılı Cumhurbaşkanı Kararı
    madde: md. 1
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'ticari = 12000000

      kkeg = 300000

      yurt_ici = 500000

      vergi_yuku = 200000 * 100 / (1800000 + 200000)

      yurt_disi = 1000000 * 80 / 100

      hisse = 2400000 * 50 / 100

      arsa = 2000000 * 25 / 100

      insaat = 900000

      istisna = yurt_ici + yurt_disi + hisse + arsa + insaat

      matrah = ticari + kkeg - istisna

      kv = matrah * 25 / 100

      asgari = (ticari + kkeg - yurt_ici) * 10 / 100

      fon = hisse + arsa

      sonuc = {''vergi_yuku'': vergi_yuku, ''istisna'': istisna, ''matrah'': matrah, ''kv'': kv, ''asgari_kv'': asgari, ''odenecek'':
      max(kv, asgari), ''fon'': fon, ''ziya_kv'': fon * 25 / 100}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: güven 4, seviye 3
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S2.yaml, klasik 1
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-IST-K002
