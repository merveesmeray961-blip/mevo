- id: YMM-REV-MTR-K003
  sinav: ymm
  ders: REV
  konu: MTR
  kazanimlar:
  - geçici vergi
  - asgari kurumlar vergisi
  - geçmiş yıl zararları
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Tam mükellef **Mavi Lojistik AŞ**'nin (2012'den beri faaliyette) 2026 yılı kümülatif dönem kârları aşağıdadır\n(KKEG\
    \ dahil; başka istisna ve indirim yoktur):\n\n| Dönem | Kümülatif ticari kâr + KKEG (TL) |\n|---|---|\n| Ocak–Mart | 2.000.000\
    \ |\n| Ocak–Haziran | 9.000.000 |\n| Ocak–Eylül | 11.000.000 |\n| Ocak–Aralık | 12.000.000 |\n\n- Mayıs 2026'da, 2020'den\
    \ beri aktifte bulunan iştirak hisseleri satılmış ve 6.000.000 TL kazanç elde edilmiştir\n  (bedel peşin tahsil edilmiş,\
    \ kazanç Ocak–Haziran dönemi kârına dahildir).\n- Şirketin 2025 yılından devreden ve beyannamede gösterilmiş 4.000.000\
    \ TL mali zararı vardır.\n\n**İstenenler:**\n\n(a) 2026 yılında geçici vergi dönemlerini, beyan ve ödeme sürelerini ve\
    \ oranını belirtiniz. (4 puan)\n\n(b) Her dönem için geçici vergi matrahını, hesaplanan geçici vergiyi, asgari kurumlar\
    \ vergisi karşılaştırmasını ve\nödenecek geçici vergiyi tablo hâlinde hesaplayınız. (13 puan)\n\n(c) Yıllık kurumlar vergisini\
    \ ve geçici vergilerin mahsubunu gösteriniz. (4 puan)\n\n(d) Geçici verginin eksik beyanının sonuçlarını ve mahsup edilemeyen\
    \ geçici verginin iadesini açıklayınız. (4 puan)\n"
  cozum: "**(a) Geçici vergi dönemleri**\n\nKurumlar vergisi mükellefleri cari dönemin kurumlar vergisine mahsup edilmek üzere\
    \ üçer aylık dönem kazançları\nüzerinden, cari dönemin kurumlar vergisi oranında (**%25**) geçici vergi öder (KVK md.\
    \ 32/2, GVK mükerrer md. 120).\n7566 sayılı Kanunla \"ilk dokuz ayı için belirlenen\" ibaresi çıkarılmıştır. 1.1.2025'ten\
    \ itibaren başlayan dönemlerde\n**dört dönemin tamamı**, Ekim–Aralık dahil, geçici vergiye tabidir. Beyan dönemi izleyen\
    \ ikinci ayın 14. günü, ödeme\n17. günü akşamına kadar yapılır. Asgari kurumlar vergisi geçici vergi dönemlerinde de uygulanır\
    \ (KVK md. 32/C-4).\n\n**(b) Dönem hesapları**\n\nİştirak hissesi satış kazancına KVK md. 5/1-e uyarınca 9160 sayılı CBK\
    \ ile **%50** istisna uygulanır: 3.000.000 TL.\nBu istisna ve geçmiş yıl zararı, asgari matrahtan **düşülmez**.\n\n| Dönem\
    \ | Matrah (kâr − istisna − zarar) | Hesaplanan %25 | Asgari %10 | Esas vergi (kümülatif) | Önceki dönemler | Ödenecek\
