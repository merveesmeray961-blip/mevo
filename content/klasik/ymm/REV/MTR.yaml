    TL < 3.750.000 TL olduğundan asgari vergi sonucu etkilemez.


    **(c) Yurt dışı vergi mahsubu (md. 33)**


    Yurt dışında ödenen vergiler, Türkiye''de vergilenen (istisna dışı) kazançlar için mahsup edilir. İstisnadan yararlanan
    Y şubesi vergisi (1.200.000 TL) mahsup edilemez.


    | Şube | Ödenen vergi | Sınır (kazanç × %25) | Mahsup |

    |---|---|---|---|

    | X | 400.000 | 1.000.000 | 400.000 |

    | Z | 400.000 | 500.000 | 400.000 |

    | **Toplam** | | | **800.000** |


    Vergi ödendiği md. 33/6''daki tasdikli belgelerle tevsik edilmedikçe mahsup yapılamaz. Belge tarh sırasında ibraz edilemezse
