    öz sermayesi **1.800.000 TL**, beyannamelerde gösterilen ve mahsup edilmemiş zararları **2.500.000 TL**''dir (tümü son
    beş yıl içindedir). Mor''un son beş yıla ilişkin kurumlar vergisi beyannameleri kanuni süresinde verilmiştir. Delta devralınan
    faaliyete devam etmektedir.


    **İstenenler:**


    (a) 2026 yılında kurum kazancından indirilebilecek geçmiş yıl zararlarını, indirilemeyecek olanları nedenleriyle belirtiniz.
