- id: YMM-REV-MTR-K001
  sinav: ymm
  ders: REV
  konu: MTR
  kazanimlar:
  - ticari bilanço kârından mali kâra geçiş
  - istisnalar ve indirimlerin sırası
  - geçmiş yıl zararları
  - geçici vergi
  - asgari kurumlar vergisi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Hesap dönemi takvim yılı olan, 2008''den beri faaliyette bulunan ve finans sektöründe yer almayan (D) AŞ''nin 2026
    yılına ilişkin bilgileri aşağıdadır. Şirket herhangi bir indirimli kurumlar vergisi oranından yararlanmamaktadır.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı (kurumlar vergisi karşılığı ayrılmadan önce) | 9.000.000 |

    | Kanunen kabul edilmeyen giderler toplamı (ayrıntısı verilmemiştir) | 600.000 |

    | Ticari kâra dahil, tam mükellef (Y) AŞ''den alınan kâr payı | 1.000.000 |

    | Ticari kâra dahil, KVK md. 5/1-b şartlarını taşıyan yurt dışı iştirak kazancı | 1.600.000 |

    | 2020 yılı beyannamesinde yer alan ve hiç mahsup edilmemiş zarar | 300.000 |

    | 2023 yılı beyannamesinde yer alan zarar | 2.000.000 |

    | 2024 yılı beyannamesinde yer alan zarar | 1.000.000 |

    | KVK md. 10/1-(ı) uyarınca hesaplanmış nakdi sermaye artışı indirimi | 400.000 |


    2026 yılı geçici vergileri: 1. dönem 300.000 TL, 2. dönem 300.000 TL, 3. dönem 250.000 TL tahakkuk edip vadesinde ödenmiştir;
    4. dönem için tahakkuk eden 200.000 TL ise yıllık beyannamenin verildiği tarihe kadar ödenmemiştir. Kurumlar vergisi oranı
    %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Zararlar beyannamede yıllar itibarıyla ayrı ayrı gösterilecektir.


    **İstenenler:**


    (a) Kurum kazancından, kurumlar vergisi matrahına ulaşmak için yapılacak istisna, zarar ve indirimleri gerekçeleriyle
    belirleyiniz. (8 puan)


    (b) Kurumlar vergisi matrahını ve %25 oranına göre hesaplanan kurumlar vergisini bulunuz. (4 puan)


    (c) Yurt içi asgari kurumlar vergisi karşılaştırmasını yaparak 2026 yılı için hesaplanan kurumlar vergisini belirleyiniz.
    (6 puan)


    (d) Geçici vergi mahsubunu yaparak beyanname üzerinden ödenecek (veya iadesi gereken) vergiyi bulunuz; beyannamenin verilme
    ve verginin ödenme sürelerini belirtiniz (sürelerin tatil günlerine rastlaması dikkate alınmayacaktır). (7 puan)

    '
  cozum: '**(a) İstisna, zarar ve indirimler**


    Kurum kazancı = Ticari bilanço kârı + KKEG = 9.000.000 + 600.000 = **9.600.000 TL**


    | Kalem | İndirilecek tutar (TL) | Gerekçe |

    |---|---|---|

    | Tam mükellef kurumdan kâr payı | 1.000.000 | KVK md. 5/1-a iştirak kazançları istisnası |

    | Yurt dışı iştirak kazancı | 1.600.000 | KVK md. 5/1-b şartları taşındığından istisna |

    | 2020 zararı | 0 | KVK md. 9/1-a: zararlar beş yıldan fazla nakledilemez; 2020 zararı en geç 2025 kazancından indirilebilirdi,
    2026''da indirilemez |

    | 2023 zararı | 2.000.000 | Beş yıllık süre içinde (2024-2028) |

    | 2024 zararı | 1.000.000 | Beş yıllık süre içinde (2025-2029) |

    | Nakdi sermaye artışı indirimi | 400.000 | KVK md. 10/1-(ı); zararlar düşüldükten sonra kalan kazançtan indirilir |


    İstisnalar sonrası: 9.600.000 - 2.600.000 = 7.000.000 TL; zarar mahsubu sonrası: 7.000.000 - 3.000.000 = 4.000.000 TL;
    md. 10 indirimi sonrası: 4.000.000 - 400.000 = 3.600.000 TL.


    **(b) Matrah ve vergi**


    Kurumlar vergisi matrahı = **3.600.000 TL**; hesaplanan kurumlar vergisi = 3.600.000 x %25 = **900.000 TL**


    **(c) Asgari kurumlar vergisi**


    - İndirim ve istisnalar düşülmeden önceki kurum kazancı (KVK md. 32/C-6) = 9.000.000 + 600.000 = 9.600.000 TL

    - Asgari matrahtan düşülebilen: yalnız 5/1-a iştirak kazancı (md. 32/C-2-a) = 1.000.000 TL

    - Düşülemeyenler: yurt dışı iştirak kazancı (5/1-b, md. 32/C-2''de sayılmaz), geçmiş yıl zararları ve nakdi sermaye artışı
    indirimi

    - Asgari matrah = 9.600.000 - 1.000.000 = 8.600.000 TL; asgari vergi = 8.600.000 x %10 = **860.000 TL**


    Normal hesaplanan vergi (900.000 TL) asgari vergiden (860.000 TL) büyük olduğundan asgari vergi farkı doğmaz; 2026 yılı
    hesaplanan kurumlar vergisi **900.000 TL**''dir.


    **(d) Mahsup, ödeme ve süreler**


    - KVK md. 34/4: Tahakkuk eden geçici verginin yalnız ödenen kısmı mahsup edilir. Ödenen geçici vergi = 300.000 + 300.000
    + 250.000 = 850.000 TL; ödenmemiş 4. dönem geçici vergisi (200.000 TL) mahsup edilmez.

    - Ödenecek kurumlar vergisi = 900.000 - 850.000 = **50.000 TL** (iade söz konusu değildir).

    - Beyan süresi (KVK md. 14/3): hesap döneminin kapandığı ayı izleyen dördüncü ayın 1-25''i → **1-25 Nisan 2027**.

    - Ödeme süresi (KVK md. 21/1): beyannamenin verildiği ayın sonu → **30 Nisan 2027**.

    '
  puanlama:
  - olcut: Kurum kazancını (9.600.000) doğru bulma
    puan: 1
  - olcut: 5/1-a ve 5/1-b istisnalarını gerekçesiyle indirme
    puan: 2
  - olcut: 2020 zararının süre aşımı nedeniyle indirilemeyeceğini belirtme
    puan: 2
  - olcut: 2023-2024 zararlarını (3.000.000) indirme
    puan: 1
  - olcut: Nakdi sermaye artışı indirimini zarar mahsubundan sonra indirme
    puan: 2
  - olcut: Matrah 3.600.000 ve vergi 900.000
    puan: 4
  - olcut: Asgari matrahı (8.600.000) düşülebilen/düşülemeyen kalemleri ayırarak bulma
    puan: 4
  - olcut: Asgari vergi 860.000 ile karşılaştırma ve 900.000 sonucu
    puan: 2
  - olcut: Yalnız ödenen geçici verginin (850.000) mahsubu
    puan: 3
  - olcut: Ödenecek vergi 50.000
    puan: 2
  - olcut: Beyan (1-25 Nisan 2027) ve ödeme (30 Nisan 2027) süreleri
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a, 5/1-b, 9/1-a, 10/1-(ı)
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 14/3, 21/1, 32, 32/C, 34/4
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 23)'
    madde: bölüm 32.5.4-32.5.6
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
  dogrulama:
    python: 'kk = 9000000 + 600000

      matrah = kk - 1000000 - 1600000 - (2000000 + 1000000) - 400000

      kv = matrah * 0.25

      asgari = (kk - 1000000) * 0.10

      hesaplanan = max(kv, asgari)

      odenecek = hesaplanan - (300000 + 300000 + 250000)

      sonuc = {''kurum_kazanci'': kk, ''matrah'': matrah, ''kv'': kv, ''asgari'': asgari, ''hesaplanan'': hesaplanan, ''odenecek'':
      odenecek}'
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: kaldi
        tarih: '2026-10-11'
        not: '(c) asgari vergi kısmı KV Seri No 23 Tebliği Örnek 8 ile çelişiyor: Tebliğ, %10 ve üzeri yurt dışı vergi yükü
          taşıyan yurt dışı kaynaklı istisna kazancı (5/1-b şartı zaten en az %15 vergi yükü arar) asgari vergi matrahından
          düşürür (32.5.6(a) ile iç çelişki var). Doğrusu: asgari matrah 9.600.000-1.000.000-1.600.000 = 7.000.000, asgari
          vergi 700.000 (çözümdeki 8.600.000/860.000 değil). Nihai sonuç (hesaplanan 900.000, ödenecek 50.000) değişmez; ama
          (c)''deki 4+2 puanlık ölçüt ve gerekçe düzeltilmeli, ya da kökte 5/1-b kalemi çıkarılmalı. Diğer tüm hesap/süreler
          (2020 zararı düşer, 850.000 mahsup, 50.000, 1-25 Nisan / 30 Nisan 2027) doğru; puanlama toplamı 25.'
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → geri_cekildi'
    neden: '(c) asgari vergi kısmı KV Seri No 23 Tebliği Örnek 8 ile çelişiyor: Tebliğ, %10 ve üzeri yurt dışı vergi yükü
      taşıyan yurt dışı kaynaklı istisna kazancı (5/1-b şartı zaten en az %15 vergi yükü arar) asgari vergi matrahından düşürür
      (32.5.6(a) ile iç çelişki var). Doğrusu: asgari matrah 9.600.000-1.000.000-1.600.000 = 7.000.000, asgari vergi 700.000
      (çözümdeki 8.600.000/860.000 değil). Nihai sonuç (hesaplanan 900.000, ödenecek 50.000) değişmez; ama (c)''deki 4+2 puanlık
      ölçüt ve gerekçe düzeltilmeli, ya da kökte 5/1-b kalemi çıkarılmalı. Diğer tüm hesap/süreler (2020 zararı düşer, 850.000
      mahsup, 50.000, 1-25 Nisan / 30 Nisan 2027) doğru; puanlama toplamı 25.'
- id: YMM-REV-MTR-K002
  sinav: ymm
  ders: REV
  konu: MTR
  kazanimlar:
  - ticari bilanço kârından mali kâra geçiş
  - istisnalar ve indirimlerin sırası
  - geçmiş yıl zararları
  - asgari kurumlar vergisi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "Tam tasdik kapsamındaki **Doğu Ticaret AŞ**'nin (2010'dan beri faaliyette; finans sektöründe değildir) 2026 yılı\n\
    vergi karşılığı öncesi ticari bilanço kârı **12.000.000 TL**'dir. YMM'nin tespitleri:\n\n1. 689 hesapta gider yazılan\
    \ vergi ziyaı cezası ve gecikme faizi: 150.000 TL.\n2. Şirket binek otomobillerinin (şirketin faaliyeti binek otomobil\
    \ kiralama değildir) yakıt, bakım ve onarım giderleri:\n   400.000 TL (tamamı gider yazılmış).\n3. Kamu yararına çalışma\
    \ statüsü bulunmayan bir derneğe yapılan nakdi bağış: 80.000 TL (gider yazılmış).\n4. Şirketin yabancı kaynakları 50.000.000\
    \ TL, öz kaynakları 30.000.000 TL'dir. Yatırım maliyetine eklenmeyen\n   finansman giderleri 6.250.000 TL'dir.\n5. Tam\
    \ mükellef bir iştirakten alınan kâr payı: 1.500.000 TL (gelir yazılmış).\n6. Beyannamelerde gösterilmiş geçmiş yıl zararları:\
    \ 2020 yılı 500.000 TL, 2023 yılı 1.000.000 TL.\n7. 5746 sayılı Kanun kapsamında hesaplanan Ar-Ge indirimi: 800.000 TL.\n\
    8. Belediyeye makbuz karşılığı yapılan nakdi bağış: 300.000 TL (gider yazılmış).\n9. 2026 için tahakkuk edip ödenen geçici\
    \ vergiler toplamı 1.900.000 TL; mevduat faizlerinden kesilen vergi\n   40.000 TL'dir.\n\n**İstenenler:**\n\n(a) Kanunen\
    \ kabul edilmeyen giderleri hesaplayınız. (7 puan)\n\n(b) Kurumlar vergisi beyanname sırasına göre matrahı ve hesaplanan\
    \ vergiyi bulunuz; 2020 zararının durumunu\naçıklayınız. (10 puan)\n\n(c) Yurt içi asgari kurumlar vergisi karşılaştırmasını\
    \ yapınız. (4 puan)\n\n(d) Ödenecek veya iade edilecek kurumlar vergisini hesaplayınız. (4 puan)\n"
  cozum: '**(a) Kanunen kabul edilmeyen giderler**


    | Kalem | Dayanak | KKEG (TL) |

    |---|---|---|

    | Vergi cezası ve gecikme faizi | KVK md. 11/1-d | 150.000 |

    | Binek otomobil giderlerinin %30''u (400.000 × %30) | GVK md. 40/5 (KVK md. 6 yollamasıyla) | 120.000 |

    | Statüsüz derneğe bağış | KVK md. 10/1-c kapsamı dışı; ticari kazançla ilgisiz | 80.000 |

    | Finansman gider kısıtlaması | KVK md. 11/1-i ve 3490 sayılı CBK (%10) | 250.000 |

    | Belediyeye bağış (beyannamede ayrıca indirilecek) | KVK md. 10/1-c | 300.000 |

    | **Toplam** | | **900.000** |


    Finansman gider kısıtlaması: aşan yabancı kaynak = 50.000.000 − 30.000.000 = 20.000.000 TL; aşan kısma isabet eden

    gider = 6.250.000 × 20.000.000 / 50.000.000 = 2.500.000 TL; %10''u = **250.000 TL**.


    **(b) Matrah**


    | Satır | TL |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | + KKEG | 900.000 |

    | = Toplam | 12.900.000 |

    | − Zarar olsa dahi indirilecek istisna: iştirak kazancı (KVK md. 5/1-a) | (1.500.000) |

    | − Geçmiş yıl zararı (2023) | (1.000.000) |

    | = Kalan | 10.400.000 |

    | − Ar-Ge indirimi (5746 s. K. md. 3) | (800.000) |

    | − Bağış indirimi (sınır 9.600.000 × %5 = 480.000; tamamı) | (300.000) |

    | **Kurumlar vergisi matrahı** | **9.300.000** |

    | Hesaplanan vergi (%25) | 2.325.000 |


    2020 zararı beş yıllık süre içinde (2021–2025) mahsup edilebilirdi. 2026''da süre dolduğundan **indirilemez**

    (KVK md. 9/1-a).


    **(c) Asgari kurumlar vergisi**


    Asgari matrah = ticari kâr + KKEG = 12.900.000 TL. Bundan KVK md. 5/1-a istisnası ve Ar-Ge indirimi düşülür

    (md. 32/C-2-a, ç). Geçmiş yıl zararı ve bağış indirimi düşülmez: 12.900.000 − 1.500.000 − 800.000 =

    **10.600.000 TL**; asgari vergi **1.060.000 TL**. Hesaplanan vergi daha yüksek olduğundan **2.325.000 TL** esas

    alınır.


    **(d) Ödenecek vergi**


    2.325.000 − 1.900.000 (geçici vergi) − 40.000 (kesinti) = **385.000 TL** ödenecek kurumlar vergisi.

    '
  puanlama:
  - olcut: (a) Vergi cezası, binek %30 ve statüsüz bağış KKEG'leri
    puan: 3
  - olcut: (a) Finansman gider kısıtlaması 250.000 TL
    puan: 3
  - olcut: (a) Toplam KKEG 900.000 TL
    puan: 1
  - olcut: (b) Beyanname sırası (istisna, zarar, indirimler)
    puan: 4
  - olcut: (b) Bağış sınırı ve matrah 9.300.000 / vergi 2.325.000 TL
    puan: 4
  - olcut: (b) 2020 zararının süre aşımı
    puan: 2
  - olcut: (c) Asgari matrah 10.600.000 ve vergi 1.060.000 TL
    puan: 4
  - olcut: (d) Ödenecek 385.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a, 9, 10/1-c, 11/1-d, 11/1-i, 32/C
    alinti: a) Beş yıldan fazla nakledilmemek şartıyla geçmiş yılların beyannamelerinde yer alan
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 40/5
  - mevzuat: 5746 sayılı Araştırma, Geliştirme ve Tasarım Faaliyetlerinin Desteklenmesi Hakkında Kanun
    madde: md. 3
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "fgk = 6250000 * (50000000 - 30000000) / 50000000 * 0.10\nkkeg = 150000 + 400000 * 0.30 + 80000 + fgk + 300000\n\
      top = 12000000 + kkeg\nkalan = top - 1500000 - 1000000\nsinir = (kalan - 800000) * 0.05\nmatrah = kalan - 800000 - min(300000,\
      \ sinir)\nkv = matrah * 0.25\nasg = (top - 1500000 - 800000) * 0.10\nsonuc = {\"binek\": 120000, \"fgk_baz\": 2500000,\
      \ \"fgk\": fgk, \"kkeg\": kkeg, \"top\": top, \"kalan\": kalan,\n         \"sinir\": sinir, \"matrah\": matrah, \"kv\"\
      : kv, \"asg_m\": top - 2300000, \"asg\": asg,\n         \"odenecek\": max(kv, asg) - 1900000 - 40000}\n"
