    madde: md. 5/1-a, 5/1-b, 9/1-a, 10/1-(ı)
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 14/3, 21/1, 32, 32/C, 34/4
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 23)'
    madde: bölüm 32.5.4-32.5.6
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
  dogrulama:
    python: 'kk = 9000000 + 600000

      matrah = kk - 1000000 - 1600000 - (2000000 + 1000000) - 400000

      kv = matrah * 0.25

      asgari = (kk - 1000000) * 0.10

      hesaplanan = max(kv, asgari)

      odenecek = hesaplanan - (300000 + 300000 + 250000)

      sonuc = {''kurum_kazanci'': kk, ''matrah'': matrah, ''kv'': kv, ''asgari'': asgari, ''hesaplanan'': hesaplanan, ''odenecek'':
      odenecek}'
