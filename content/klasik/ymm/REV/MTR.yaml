  soru: "Tam mükellef **Ece Tekstil AŞ** (2014'ten beri faaliyette; finans sektöründe değildir) 2026 yılında:\n\n- Ticari\
    \ bilanço kârı **4.000.000 TL**, kanunen kabul edilmeyen giderleri **1.000.000 TL**'dir.\n- Ticari kâra tam mükellef bir\
