    \ TL; 2022: 1.500.000 TL; 2024: 2.000.000 TL.\n- 1.4.2026'da tescil edilen ve aynı gün tamamı nakden ödenen **10.000.000\
    \ TL** sermaye artırımı yapılmıştır.\n  Artırım ortaklardan alınan borçlarla yapılmamıştır. TCMB'nin indirimden yararlanılan\
    \ yıl için en son açıkladığı\n  TL ticari kredilere uygulanan ağırlıklı yıllık ortalama faiz oranı **%48**'dir.\n\n**İstenenler:**\n\
    \n(a) Nakdi sermaye artırımı indirimini hesaplayınız; şartlarını ve kaç dönem yararlanılacağını belirtiniz. (7 puan)\n\
    \n(b) Kurumlar vergisi matrahını, kullanılan ve sonraki yıla devreden zarar ile indirim tutarlarını gösteriniz.\n(8 puan)\n\
    \n(c) Yurt içi asgari kurumlar vergisini hesaplayarak ödenecek vergiyi belirleyiniz. (7 puan)\n\n(d) Şirket 2025'te kurulmuş\
    \ olsaydı asgari vergi bakımından sonucu açıklayınız. (3 puan)\n"
  cozum: "**(a) Nakdi sermaye artırımı indirimi (KVK md. 10/1-ı)**\n\nHesap dönemi içinde ticaret siciline tescil edilen nakdi\
    \ sermaye artışı üzerinden, TCMB'nin açıkladığı ticari kredi\nfaiz oranıyla dönem sonuna kadar hesaplanan tutarın **%50**'si\
    \ indirilir. Ödendiği ay kesri tam ay sayılır:\nNisan–Aralık **9 ay**.\n\n- Hesaplanan tutar = 10.000.000 × %48 × 9/12\
    \ = 3.600.000 TL; indirim = **1.800.000 TL**.\n- İndirimden tescil dönemi ile izleyen **dört dönem** (2026–2030) ayrı\
    \ ayrı yararlanılır. Bu dönemlerde sermaye\n  azaltımı yapılırsa azaltılan tutar dikkate alınmaz.\n- Ortaklardan veya\
    \ ilişkili kişilerden borç alınarak yapılan artırımlar ile öz sermaye kalemlerinin sermayeye\n  eklenmesi hesaplamaya\
    \ katılmaz. Matrah yetersizliği nedeniyle indirilemeyen tutar **sonraki dönemlere devreder**.\n\n**(b) Matrah**\n\n| Satır\
    \ | TL |\n|---|---|\n| Ticari kâr + KKEG | 5.000.000 |\n| − İştirak kazancı istisnası (md. 5/1-a) | (1.000.000) |\n| =\
    \ Kalan | 4.000.000 |\n| − Geçmiş yıl zararları: 2022 (1.500.000) + 2024 (2.000.000) | (3.500.000) |\n| = Kalan | 500.000\
    \ |\n| − Nakdi sermaye artırımı indirimi (kullanılabilen) | (500.000) |\n| **Matrah** | **0** |\n\n2020 zararı beş yıllık\
    \ süre dolduğundan indirilemez. İki zarar tamamen kullanılmış, 2026'dan devreden zarar yoktur.\nNakdi sermaye artırımı\
    \ indiriminin **1.300.000 TL**'si 2027'ye devreder.\n\n**(c) Asgari kurumlar vergisi**\n\nAsgari matrah = 5.000.000 −\
    \ 1.000.000 (yalnız md. 5/1-a istisnası düşülür) = **4.000.000 TL**. Geçmiş yıl\nzararları ve md. 10/1-ı indirimi md.\
    \ 32/C-2'de sayılmadığından düşülemez. Asgari vergi = **400.000 TL**. Hesaplanan\nvergi 0 TL olduğundan **400.000 TL**\
    \ ödenir.\n\n**(d) Yeni kurulan şirket**\n\nİlk defa faaliyete başlayan kurumlarda faaliyete başlanılan dönemden itibaren\
    \ **üç hesap dönemi** (2025–2027)\nasgari kurumlar vergisi uygulanmaz (md. 32/C-5). Bu durumda 2026 için ödenecek kurumlar\
    \ vergisi **0 TL** olurdu.\n"
