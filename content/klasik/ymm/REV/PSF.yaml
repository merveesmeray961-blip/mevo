        tarih: '2026-10-24'
      G5:
        sonuc: gecti
        tarih: '2026-10-24'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-24'
    kim: uretici
    ne: harici teslim t_K_REV.yaml, klasik 18
  - tarih: '2026-10-24'
    kim: hakem
