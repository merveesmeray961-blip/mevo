    Tam mükellef kurumlarca tam mükellef gerçek kişilere ve dar mükellef gerçek kişilere dağıtılan kâr paylarından **%15**
    gelir vergisi tevkifatı yapılır; **kârın sermayeye eklenmesi kâr dağıtımı sayılmaz.**


    | Ortak | Kâr payı | Tevkifat oranı | Tevkifat |

    |---|---|---|---|

    | Bay Ali (tam mükellef gerçek kişi) | 2.000.000 | %15 | **300.000** |

    | Delta Holding A.Ş. (tam mükellef kurum) | 1.200.000 | Tevkifat yok | 0 |

    | Mr. Smith (dar mükellef gerçek kişi) | 800.000 | %15 | **120.000** |

    | **Toplam** | 4.000.000 | | **420.000** |


    - Sermayeye eklenen 500.000 TL dağıtım sayılmadığından **tevkifata tabi değildir.**

    - Tam mükellef kurum ortağa (Delta Holding) yapılan kâr payı ödemesi bu bentteki tevkifat kapsamında sayılmamıştır (kurum
