- id: YMM-REV-PSF-K001
  sinav: ymm
  ders: REV
  konu: PSF
  kazanimlar:
  - örtülü kazanç dağıtımı belirtileri
  - borçların tamlığı ve teyidi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Tam mükellef Anadolu Plastik A.Ş.''nin (hesap dönemi takvim yılı) 2026 yılı kurumlar vergisi beyannamesinin
    tasdiki için çalışan YMM, pasif hesaplar ile ortaklarla ilgili hesaplarda aşağıdaki tespitleri yapmıştır. Şirketin düzeltmeler
    öncesi 2026 ticari bilanço kârı 5.000.000 TL''dir; bu tutar içinde başka indirim, istisna veya kanunen kabul edilmeyen
    gider yoktur. KDV, damga vergisi, stopaj, finansman gider kısıtlaması ve asgari kurumlar vergisi etkileri dikkate alınmayacaktır.
    Faizler ay esasıyla, basit faiz olarak hesaplanacaktır.


    1. Şirketin VUK''a göre tespit edilmiş öz sermayesi 1.1.2026''da 2.000.000 TL''dir.

    2. Şirketin %80 ortağı olan tam mükellef Y Holding A.Ş.''den nakden alınan 7.400.000 TL borç, 1.1.2026–31.12.2026 arasında
    hiç değişmeden işletmede kullanılmıştır. Borç için yıllık %20 faiz ödenmiş ve 1.480.000 TL faiz 780 Finansman Giderleri
    hesabına kaydedilmiştir.

    3. Şirket, %20 ortağı gerçek kişi Bay T''ye 1.4.2026''da 3.000.000 TL faizsiz borç vermiş; tutar 131 Ortaklardan Alacaklar
    hesabında izlenmekte olup yıl sonuna kadar geri ödenmemiştir. Benzer koşullarda ilişkisiz kişilere uygulanan (emsal) faiz
    oranı yıllık %40''tır.

    4. 1.10.2026''da bir bankadan kullanılan 3.000.000 TL kredinin yıllık faiz oranı %48''dir; anapara ve faiz 31.3.2027''de
    ödenecektir. Kredi faizine ilişkin tahakkuk kaydı yapılmamıştır.


    **İstenenler:**


    (a) Örtülü sermaye tutarını ve kurum kazancının tespitinde gider kabul edilmeyecek faiz tutarını hesaplayınız; bu faizin
    şirket ve Y Holding bakımından vergisel niteliğini açıklayınız. (8 puan)


    (b) 3 numaralı tespitin vergisel sonucunu açıklayıp örtülü kazanç tutarını hesaplayınız. (6 puan)


    (c) 4 numaralı tespit için tahakkuk etmesi gereken faizi hesaplayıp yevmiye kaydını yapınız; dayanağını belirtiniz. (5
    puan)


    (d) Düzeltilmiş ticari bilanço kârını, kurum kazancını ve hesaplanan kurumlar vergisini (%25) bulunuz. (6 puan)

    '
  cozum: '**(a) Örtülü sermaye**


    - Sınır: dönem başı öz sermayenin üç katı → 2.000.000 × 3 = 6.000.000 TL (KVK md. 12/1, 12/3-b)

    - Ortaktan borç: 7.400.000 TL → örtülü sermaye: 7.400.000 − 6.000.000 = **1.400.000 TL**

    - Borç yıl boyunca sabit olduğundan örtülü sermayeye isabet eden faiz: 1.480.000 × 1.400.000 / 7.400.000 = **280.000 TL**

    - Bu faiz, kurum kazancının tespitinde indirilemez; kanunen kabul edilmeyen gider olarak beyannamede ilave edilir (KVK
    md. 11/1-b).

    - Örtülü sermaye üzerinden ödenen faiz, şartların gerçekleştiği hesap döneminin son günü (31.12.2026) itibarıyla gerek
    borç alan gerekse borç veren nezdinde **dağıtılmış kâr payı** sayılır (KVK md. 12/7). Y Holding nezdindeki vergilendirme,
    Anadolu Plastik A.Ş. adına tarh edilen vergilerin kesinleşmiş ve ödenmiş olması şartıyla buna göre düzeltilebilir.


    **(b) Örtülü kazanç**


    - Ortağa faizsiz borç para verilmesi, ilişkili kişiyle emsallere aykırı bedelle hizmet işlemidir; ödünç para verilmesi
    KVK md. 13/1 uyarınca her hâlde mal veya hizmet alım-satımı sayılır. Bay T ortak olduğundan ilişkili kişidir.

    - Örtülü kazanç: 3.000.000 × %40 × 9/12 (Nisan–Aralık) = **900.000 TL**

    - Bu tutar transfer fiyatlandırması yoluyla örtülü olarak dağıtılan kazançtır; kurum kazancının tespitinde indirim olarak
    kabul edilmez ve matraha ilave edilir (KVK md. 11/1-c). Hesap döneminin son günü itibarıyla dağıtılmış kâr payı sayılır
    (KVK md. 13/6). Karşı taraf gerçek kişi ortak olduğundan md. 13/7''deki Hazine zararı şartı (yurt içi kurumlar arası işlemler
    için) aranmaz.


    **(c) Faiz tahakkuku**


    - Kredi sözleşmesine dayanan borçlar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır (VUK md.
    285/1).

    - Faiz: 3.000.000 × %48 × 3/12 (Ekim–Aralık) = **360.000 TL**

    - Kayıt: 780 Finansman Giderleri (B) 360.000 / 381 Gider Tahakkukları (A) 360.000 (faizin kredi hesabına eklenmesi yöntemi
    benimsenmişse alacak tarafında 300 Banka Kredileri de kabul edilir.)


    **(d) Matrah**


    | Kalem | TL |

    |---|---|

    | Düzeltmeler öncesi ticari kâr | 5.000.000 |

    | Faiz tahakkuku (c) | −360.000 |

    | **Düzeltilmiş ticari bilanço kârı** | **4.640.000** |

    | KKEG: örtülü sermaye faizi (a) | +280.000 |

    | KKEG: örtülü kazanç (b) | +900.000 |

    | **Kurum kazancı** | **5.820.000** |

    | **Kurumlar vergisi (%25)** | **1.455.000** |

    '
  puanlama:
  - olcut: (a) Üç kat sınırının dönem başı öz sermayeyle bulunması ve örtülü sermayenin (1.400.000 TL) hesaplanması
    puan: 3
  - olcut: (a) Örtülü sermayeye isabet eden faizin (280.000 TL) oranlanarak hesaplanması ve KKEG olarak nitelendirilmesi
    puan: 3
  - olcut: (a) Faizin dönem sonu itibarıyla dağıtılmış kâr payı sayılması ve karşı taraf düzeltmesinin şartı
    puan: 2
  - olcut: (b) Faizsiz borç verilmesinin md. 13 kapsamında ilişkili kişiyle emsale aykırı işlem olarak nitelendirilmesi
    puan: 2
  - olcut: (b) Örtülü kazancın (900.000 TL) 9 ay üzerinden hesaplanması ve matraha ilavesi
    puan: 4
  - olcut: (c) Faiz tutarının (360.000 TL) hesaplanması, VUK md. 285 dayanağı ve yevmiye kaydı
    puan: 5
  - olcut: (d) Düzeltilmiş ticari kârın (4.640.000 TL) bulunması
    puan: 2
  - olcut: (d) Kurum kazancının (5.820.000 TL) ve kurumlar vergisinin (1.455.000 TL) hesaplanması
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/7
    alinti: Örtülü sermaye üzerinden kur farkı hariç, faiz ve benzeri ödemeler veya hesaplanan tutarlar, Gelir ve Kurumlar
      Vergisi kanunlarının uygulanmasında, gerek borç alan gerekse borç veren nezdinde, örtülü sermaye şartlarının gerçekleştiği
      hesap döneminin son günü itibarıyla dağıtılmış kâr payı veya dar mükellefler için ana merkeze aktarılan tutar sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-b, c
    alinti: Örtülü sermaye üzerinden ödenen veya hesaplanan faiz, kur farkları ve benzeri giderler. c) Transfer fiyatlandırması
      yoluyla örtülü olarak dağıtılan kazançlar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/1
    alinti: Alım, satım, imalat ve inşaat işlemleri, kiralama ve kiraya verme işlemleri, ödünç para alınması ve verilmesi,
      ikramiye, ücret ve benzeri ödemeleri gerektiren işlemler her hal ve şartta mal veya hizmet alım ya da satımı olarak
      değerlendirilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 285/1
    alinti: Mevduat veya kredi sözleşmelerine müstenit borçlar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate
      alınır.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
  dogrulama:
    python: "sinir = 2000000 * 3\nortulu_sermaye = 7400000 - sinir\nkkeg_faiz = 1480000 * ortulu_sermaye / 7400000\nortulu_kazanc\
      \ = 3000000 * 0.40 * 9 / 12\nfaiz_tahakkuku = 3000000 * 0.48 * 3 / 12\nduzeltilmis_kar = 5000000 - faiz_tahakkuku\n\
      kurum_kazanci = duzeltilmis_kar + kkeg_faiz + ortulu_kazanc\nsonuc = {\"ortulu_sermaye\": ortulu_sermaye, \"kkeg_faiz\"\
      : kkeg_faiz, \"ortulu_kazanc\": ortulu_kazanc,\n         \"faiz_tahakkuku\": faiz_tahakkuku, \"duzeltilmis_kar\": duzeltilmis_kar,\n\
      \         \"kurum_kazanci\": kurum_kazanci, \"kurumlar_vergisi\": kurum_kazanci * 0.25}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi REV-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_REV-1.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-PSF-K002
  sinav: ymm
  ders: REV
  konu: PSF
  kazanimlar:
  - borçların tamlığı ve teyidi
  - karşılıklar
  - örtülü kazanç dağıtımı belirtileri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Akasya Ticaret AŞ**'nin 2026 pasif hesap revizyonunda YMM şunları tespit etmiştir:\n\n1. TFRS uyumlu raporlama\
    \ amacıyla 2.000.000 TL kıdem tazminatı karşılığı ayrılmış ve gider yazılmıştır. Yıl içinde\n   ödenen 300.000 TL kıdem\
    \ tazminatı karşılık hesabından (472) düşülmüş, gider hesaplarına yansıtılmamıştır.\n2. Satıcı mutabakatlarında, bir satıcıya\
    \ ait 300.000 TL tutarlı alış faturasının mükerrer kaydedildiği ve\n   gider yazıldığı belirlenmiştir.\n3. 340 Alınan\
    \ Sipariş Avansları hesabında izlenen 600.000 TL'nin karşılığı olan mallar Aralık 2026'da müşteriye\n   teslim edilmiş,\
    \ fatura düzenlenmemiştir.\n4. 100.000 EUR tutarındaki satıcı borcu işlem günü kuru 45,00 ile kayıtlı olup dönem sonunda\
    \ değerlenmemiştir\n   (31.12.2026 TCMB döviz alış kuru 47,00).\n5. 331 Ortaklara Borçlar hesabının incelenmesinde, %80\
    \ ortak Bay Çınar'ın oturduğu konutun 240.000 TL kira\n   bedelinin şirketçe ödenip gider yazıldığı görülmüştür.\n\n**İstenenler:**\n\
    \n(a) Kıdem tazminatı karşılığı ile ödenen kıdem tazminatının vergisel durumunu açıklayınız ve matraha etkisini\nhesaplayınız.\
    \ (6 puan)\n\n(b) 2, 3 ve 4 numaralı tespitlerin matraha etkisini ve 3 numaralı tespitin KDV/belge düzeni yönünden sonuçlarını\n\
    açıklayınız (KDV oranı %20). (9 puan)\n\n(c) 5 numaralı tespitin kurumlar vergisi ve kâr payı stopajı yönünden sonuçlarını\
    \ hesaplayınız. (6 puan)\n\n(d) Toplam matrah etkisini ve ilave kurumlar vergisini bulunuz. (4 puan)\n"
  cozum: "**(a) Kıdem tazminatı**\n\nVergi mevzuatında kıdem tazminatı için karşılık ayrılmasına imkân yoktur. Ayrılan karşılık\
    \ **kanunen kabul edilmeyen\ngiderdir**. Kıdem tazminatları ise **fiilen ödendikleri yılda** gider olarak indirilir.\n\
    \n- Karşılık gideri: **+2.000.000 TL** KKEG.\n- Karşılıktan ödenen 300.000 TL gelir tablosuna yansımadığından beyannamede\
    \ **indirim** olarak dikkate alınır:\n  **(300.000) TL**.\n- Net etki **+1.700.000 TL**.\n\n**(b) Diğer pasif tespitleri**\n\
    \n- **Mükerrer fatura:** Gider fazla gösterilmiştir; kayıt düzeltilir: **+300.000 TL**. Mükerrer kaydın KDV indirimine\n\
    \  de konu edildiği anlaşılırsa 60.000 TL KDV indirimi düzeltilir.\n- **Teslim edilen mallar:** Teslimle birlikte satış\
    \ gerçekleşmiş ve KDV'yi doğuran olay doğmuştur (KDVK md. 10/a).\n  600.000 TL Aralık 2026 hasılatıdır: **+600.000 TL**.\
    \ Hesaplanan KDV 120.000 TL Aralık dönemi beyannamesine\n  dahil edilmelidir. Fatura yasal sürede (VUK md. 231) düzenlenmediğinden\
    \ VUK md. 353 uyarınca **özel usulsüzlük\n  cezası** gündeme gelir.\n- **Döviz borç:** VUK md. 280 uyarınca değerleme\
    \ zorunludur: 100.000 × (47,00 − 45,00) = 200.000 TL kur farkı\n  gideri: **(200.000) TL**.\n\n**(c) Ortak lehine ödeme**\n\
    \nOrtağın şahsi kira gideri işletmeyle ilgili değildir; gider yazılan 240.000 TL **KKEG**'dir: **+240.000 TL**.\nOrtağa\
    \ kaynak aktarımı örtülü kazanç dağıtımı niteliğindedir. Tutar ortağa **dağıtılmış kâr payı** sayılarak net tutar\nüzerinden\
    \ brüte tamamlanır: 240.000 / 0,85 = 282.353 TL; stopaj (%15) = **42.353 TL** (GVK md. 94/6-b).\n\n**(d) Toplam**\n\n\
    | Kalem | TL |\n|---|---|\n| Kıdem karşılığı (net) | +1.700.000 |\n| Mükerrer fatura | +300.000 |\n| Faturalanmamış teslim\
    \ | +600.000 |\n| Kur farkı gideri | (200.000) |\n| Ortağın kira gideri | +240.000 |\n| **Net matrah etkisi** | **+2.640.000**\
    \ |\n| İlave kurumlar vergisi (%25) | 660.000 |\n"
  puanlama:
  - olcut: (a) Karşılığın KKEG, ödemenin ödendiği yıl indirimi; net +1.700.000 TL
    puan: 6
  - olcut: (b) Mükerrer faturada +300.000 TL
    puan: 2
  - olcut: (b) Teslimde hasılat +600.000, KDV 120.000 ve özel usulsüzlük
    puan: 4
  - olcut: (b) Kur farkı değerlemesi (200.000) TL
    puan: 3
  - olcut: (c) KKEG 240.000 ve dağıtılmış kâr payı stopajı 42.353 TL
    puan: 6
  - olcut: (d) Net etki 2.640.000 ve vergi 660.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 231, 280, 353
    alinti: Bu madde hükmü yabancı para ile olan senetli veya
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 41, 94/6-b
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "kidem = 2000000 - 300000\nkf = 100000 * (47 - 45)\nbrut = round(240000 / 0.85)\nnet = kidem + 300000 + 600000\
      \ - kf + 240000\nsonuc = {\"kidem\": kidem, \"kdv\": 600000 * 0.20, \"kf\": kf, \"brut\": brut, \"stopaj\": round(brut\
      \ * 0.15),\n         \"net\": net, \"kv\": net * 0.25}\n"
