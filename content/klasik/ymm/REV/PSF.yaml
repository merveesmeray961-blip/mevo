    - Ortaklara net ödenecek tutar = 4.000.000 - 420.000 = 3.580.000 TL; tevkif edilen vergiler muhtasar beyanname ile bildirilir
    ve beyannamenin verildiği ayın yirmialtıncı günü akşamına kadar ödenir (KVK md. 21/4 uyarınca muhtasar beyanname ile bildirilen
    vergiler için).


