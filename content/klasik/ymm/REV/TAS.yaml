- id: YMM-REV-TAS-K002
  sinav: ymm
  ders: REV
  konu: TAS
  kazanimlar:
  - tasdik sözleşmesinin Bakanlığa bildirilmesi ve düzenlenme zamanı
  - tasdiki zorunlu şirketlerde YMM seçimi
  - sürekli denetimde sözleşmenin feshi
  - YMM nin müteselsil sorumluluğu ve çalışma kağıtlarının saklanması
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: '**Olay**


    Payları Borsa İstanbul''da işlem gören, tam mükellef ve hesap dönemi takvim yılı olan **Atlas Plastik A.Ş.**, 2026 hesap
    dönemine ilişkin kurumlar vergisi beyannamesi ve mali tablolarının sürekli denetimli tasdiki için YMM (K) ile çalışmaktadır.
    Gelişmeler şunlardır:


    1. Şirket, YMM (K) ile tasdik sözleşmesini **20.1.2026 (Salı)** tarihinde imzalamıştır. Sözleşmenin bir örneği YMM (K)
    tarafından Hazine ve Maliye Bakanlığına **6.2.2026 (Cuma)** tarihinde gönderilmiştir.

    2. Şirket, mali tablolarının tasdiki zorunlu olduğu hâlde, YMM seçimini Birliğe 2026 hesap döneminin başına kadar bildirmemiştir.

    3. Şirket yönetimi, sözleşmeyi **12.2.2027** tarihinde yazılı gerekçe göstererek feshetmek istemektedir. Yıllık kurumlar
    vergisi beyannamesinin 2027 yılı Nisan ayında verilmesi gerekmektedir.

    4. YMM (K), 2026 yılı kurumlar vergisi beyannamesine ekli mali tabloları ve beyannameyi tasdik etmiştir. Daha sonra yapılan
    vergi incelemesinde, şirketin gerçeği yansıtmayan belgelerle 1.200.000 TL tutarında gider yazdığı ve bu giderin kurum
    kazancından indirildiği anlaşılmıştır. Kurumlar vergisi oranı %25''tir; ceza için sadece VUK md. 344/1 hükmü esas alınacaktır
    (tekerrür, indirim, faiz ve zam dikkate alınmayacaktır).

    5. YMM (K), 2026 hesap dönemine ilişkin çalışma kağıtlarını 2026 yılı içinde düzenlemiştir ve bu çalışma kağıtlarına ilişkin
    bir hukuki ihtilaf yoktur.


    **İstenenler**


    (a) 1 ve 2 numaralı olaylar bakımından Yönetmelik hükümlerini değerlendiriniz: Sözleşmenin Bakanlığa gönderilmesi için
    son günü belirleyiniz ve süre uyulup uyulmadığını açıklayınız; sözleşmenin düzenlenme zamanına ilişkin özel hükmü ve tasdiki
    zorunlu şirketin YMM seçmemesinin sonucunu belirtiniz. (8 puan)


    (b) 3 numaralı olaydaki fesih talebinin Yönetmelik hükümleri karşısındaki durumunu gerekçesiyle açıklayınız; fesih mümkün
    olsaydı tarafların yükümlülüklerini belirtiniz. (5 puan)


    (c) 4 numaralı olay bakımından ziyaa uğratılan vergiyi, vergi ziyaı cezasını ve YMM (K)''nın sorumluluğunun niteliğini
    ve kapsamındaki tutarı hesaplayarak açıklayınız. (6 puan)


    (d) 5 numaralı olaydaki çalışma kağıtlarının hangi tarihe kadar saklanması gerektiğini gerekçesiyle belirtiniz; çalışma
    kağıtlarının mülkiyetinin kime ait olduğunu yazınız. (4 puan)

    '
  cozum: '**(a) Sözleşmenin gönderilmesi ve düzenleme zamanı (Yönetmelik md. 9, 10)**


    - Tasdik sözleşmesine bağlanması ve sözleşme tarihinden itibaren **15 gün içinde** bir örneğinin YMM tarafından Bakanlığa
    gönderilmesi zorunludur (md. 10/1).

    - Sözleşme tarihi 20.1.2026''dır; başladığı gün hesaba katılmadığından 15. gün **4.2.2026 (Çarşamba)**''dir. Örnek 6.2.2026''da,
    yani süre dışında gönderilmiştir; **süreye uyulmamıştır.**

    - Yönetmeliğin 7/A-a ve 7/B-a maddelerinde belirtilen belgelerin (yıllık gelir ve kurumlar vergisi beyannameleri) tasdikine
    ilişkin sözleşmeler **ilgili vergilendirme döneminin ilk ayı içinde** düzenlenir (md. 10, ek fıkra). Sözleşme Ocak 2026
    içinde imzalandığından bu şart sağlanmıştır.

    - Halka arz edilmiş şirketlerin hesap dönemlerine ilişkin mali tablo ve beyannamelerini tasdik ettirmesi zorunludur (md.
    9/2). Zorunlu şirket YMM''sini hesap döneminin başına kadar Birliğe bildirmezse **YMM seçmemiş sayılır** ve seçim Birlik
    tarafından ilgili Odaya yaptırılır, ilgililere bildirilir (md. 9/3-4).


    **(b) Fesih (md. 10)**


    - Sürekli denetimlerde, yıllık beyannamelerin ve buna ekli mali tabloların beyan edileceği aydan önceki **üç ay içinde**
    tasdik sözleşmesi feshedilemez. Beyan ayı Nisan 2027 olduğundan fesih yasağı Ocak, Şubat ve Mart 2027 aylarını kapsar;
    **12.2.2027 tarihli fesih talebi yapılamaz.**

    - Fesih mümkün olsaydı: fesih yazılı gerekçeyle yapılır ve **en geç 15 gün içinde Bakanlığa bildirilir**; yıllık tasdiki
    zorunlu işletme **bir ay içinde** başka bir YMM ile sözleşme yapmak zorundadır; YMM çalışma notlarını ve gerekli tüm bilgileri
    yerine geçecek YMM''ye **devretmek zorundadır.**


    **(c) Sorumluluk (md. 20; VUK md. 344/1)**


    - Ziyaa uğratılan kurumlar vergisi = 1.200.000 × %25 = **300.000 TL**

    - Vergi ziyaı cezası = ziyaa uğratılan verginin bir katı = **300.000 TL** (VUK md. 344/1)

    - Toplam = 300.000 + 300.000 = **600.000 TL**


    İnceledikleri ve tasdik raporu düzenledikleri belgelerin gerçeği yansıtmaması hâlinde YMM, ziyaa uğratılan vergilerden
    ve kesilecek cezalardan VUK ve 3568 sayılı Kanun uyarınca mükellefle birlikte **müştereken ve müteselsilen** sorumludur
    (tam teselsül). Dolayısıyla YMM (K), kapsamdaki 600.000 TL''nin tamamından sorumludur; sorumluluk tasdik kapsamıyla sınırlıdır.


    **(d) Çalışma kağıtları (md. 17)**


    Çalışma kağıtlarının mülkiyeti **YMM''ye** aittir. Dosya içinde, düzenlenmelerini izleyen yıldan itibaren **10 yıl** süreyle
    saklanır. Kağıtlar 2026''da düzenlendiğinden izleyen yıl 2027''dir; 10 yıllık süre 2027''nin başlangıcından itibaren işler
    ve **31.12.2036**''da dolar. Hukuki ihtilaf olmadığından ihtilaf nedeniyle uzatma söz konusu değildir.

    '
