- id: YMM-REV-TAS-K001
  sinav: ymm
  ders: REV
  konu: TAS
  kazanimlar:
  - KDV iade incelemesi
  - tespit ve eleştiri yazılması
  - tam tasdik kontrol listeleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'İhracatçı **(KL) A.Ş.** ile YMM (D) arasında sürekli denetimi kapsayan, süresinde düzenlenmiş bir tam tasdik sözleşmesi
    bulunmaktadır. Şirket, Haziran 2026 dönemindeki mal ihracatından doğan KDV iadesini **nakden** ve **YMM KDV İadesi Tasdik
    Raporu** ile talep etmektedir. Talep, ilgili sınırı aşmaktadır. Dönem verileri şunlardır:


    | Kalem | TL |

    |---|---|

    | İhracat bedeli (tam istisna) | 9.000.000 |

    | Yurt içi satışlar üzerinden hesaplanan KDV | 200.000 |

    | İndirimler toplamı (devreden KDV dâhil) | 1.400.000 |

    | İhracata ilişkin yüklenilen KDV listesi toplamı | 1.100.000 |


    Azami iade edilebilir vergi sınırı aşılmamaktadır. İade için aranan diğer belgeler tamdır.


    YMM (D)''nin çalışması sırasında şu hususlar belirlenmiştir:


    1. Yüklenilen KDV listesinde yer alan ve (F) Ltd. Şti.''den alınan faturalara ait **60.000 TL** KDV nedeniyle, (KL) A.Ş.
    hakkında **"sahte belge kullanma tespiti"** vergi dairesine intikal etmiştir. Vergi dairesi şirkete yazıyla 15 günlük
    süre vermiş, şirket bu sürede belgelerin gerçekliğini ve doğruluğunu ispat edememiştir.

    2. Listedeki bir diğer satıcı (E) Ltd. Şti. hakkında vergi dairesine yalnızca bir **ihbar dilekçesi** verilmiştir. Bu
    satıcı hakkında herhangi bir rapor veya tespit bulunmamaktadır. YMM''nin karşıt incelemesinde bu satıcıdan yapılan alımların
    teslim, nakliye ve banka ödemeleriyle gerçekleştiği görülmüştür.


    **İstenenler:**


    **(a)** Yukarıdaki olumsuzluklar hiç yokmuş gibi, genel esaslara göre Haziran 2026 dönemi için iade edilebilecek KDV tutarını
    hesaplayınız. *(5 puan)*


    **(b)** 1 numaralı tespit karşısında KDV Genel Uygulama Tebliği''ne göre şirketin hangi seçenekleri olduğunu açıklayınız.
    Belgelerdeki KDV''nin indirim ve iade hesabından çıkarılması hâlinde iade edilebilecek tutarı ve teminat yolu seçilirse
    gösterilmesi gereken teminat tutarını hesaplayınız. *(8 puan)*


    **(c)** 1 numaralı tespit "sahte belge kullanma" yerine **"sahte belge düzenleme"** tespiti olsaydı, iade talebinin nasıl
    sonuçlandırılacağını ve teminat oranını belirtiniz. *(5 puan)*


    **(d)** 2 numaralı satıcı bakımından iade talebine ilişkin işlemi belirtiniz. YMM''nin tasdik raporunda bu satıcı ile
    (F) Ltd. Şti.''ne ilişkin tespitleri nasıl yazması gerektiğini, Yönetmelik hükümlerine göre hata ve hile bildirimi ile
    sorumluluğu da dikkate alarak açıklayınız. *(7 puan)*

    '
  cozum: "**(a) Genel esaslara göre iade edilebilecek KDV**\n\nTebliğin (IV/A3-1.1) bölümüne göre iade hakkı doğuran işlemler\
    \ için yüklenilen KDV önce indirim konusu yapılır. İndirimle giderilemeyen tutar varsa iade edilecek KDV olarak dikkate\
    \ alınır. Tam istisnada karşılaştırma, iadenin talep edildiği dönem beyannamesindeki toplam indirim KDV ile yapılır.\n\
    \n- İndirimle giderilemeyen KDV: 1.400.000 − 200.000 = 1.200.000 TL\n- İade edilebilecek KDV: en düşük (yüklenilen KDV\
    \ 1.100.000; giderilemeyen KDV 1.200.000) = **1.100.000 TL**\n\n**(b) Sahte belge kullanma tespiti karşısında seçenekler\
    \ (IV/A2-7.2)**\n\nKullanma tespiti bulunan mükellefin iade talepleri, kendisine yazıyla verilen 15 günlük sürede belgenin\
    \ gerçekliğini ve doğruluğunu ispat etmesi hâlinde genel usul ve esaslara göre yerine getirilir. Şirket ispat edemediğinden\
    \ seçenekleri şunlardır:\n\n1. **Belgelerdeki KDV'yi indirim ve iade hesabından çıkarmak.** Bu durumda geri kalan iade\
    \ talebi genel esaslara göre (YMM raporuyla) sonuçlandırılır.\n   - Yüklenilen KDV: 1.100.000 − 60.000 = 1.040.000 TL\n\
    \   - İndirimler: 1.400.000 − 60.000 = 1.340.000 TL → giderilemeyen KDV: 1.340.000 − 200.000 = 1.140.000 TL\n   - İade\
    \ edilebilecek KDV: en düşük (1.040.000; 1.140.000) = **1.040.000 TL**\n2. **Bu kısma sahte belge kullanma tespitlerinde\
    \ üç kat teminat göstermek:** 60.000 × 3 = **180.000 TL**. Bu durumda da geri kalan iade talebi genel esaslara göre sonuçlandırılır.\n\
    3. **Hiçbirini yapmamak.** Teminat gösterilmez veya bu alışlara isabet eden kısım indirim ve iade talebinden çıkarılmazsa,\
    \ iade talebi **vergi inceleme raporuna göre** sonuçlandırılır.\n\n(Muhteviyatı itibarıyla yanıltıcı belge kullanma tespitinde\
    \ teminat oranı iki kattır.)\n\n**(c) Sahte belge düzenleme tespiti olsaydı (IV/A2-7.1)**\n\nHakkında sahte belge düzenleme\
    \ tespiti bulunan mükellefin iade talepleri **vergi inceleme raporu sonucuna göre** yerine getirilir; YMM raporuyla sonuçlandırılamaz.\
    \ Ancak **dört kat** teminat gösterilirse iade talepleri yerine getirilir. Olumsuz raporun intikal ettiği tarihten önceki\
    \ dönemler için alınanlar dâhil tüm teminatlar vergi inceleme raporu sonucuna göre çözülür. Muhteviyatı itibarıyla yanıltıcı\
    \ belge düzenleme tespitinde oran üç kattır. Mükellef, Tebliğde sayılan şartlardan biri gerçekleşince genel esaslara döner\
    \ (ör. ilgili döneme ilişkin olumlu rapor; tespitin yargı kararıyla iptali; başka olumsuzluk olmaksızın dört yıl geçmesi).\n\
    \n**(d) İhbar edilen satıcı ve raporda tespitlerin yazılması**\n\n- Tebliğin (IV/A2-3.1) bölümüne göre başkaca bir tespit\
    \ bulunmadıkça, bir mükellef hakkında **yalnız ihbar veya şikâyet bulunması yeterli değildir**. (E) Ltd. Şti.'den yapılan\
    \ alımlar nedeniyle (IV/A2) kapsamında özel işlem yapılmaz; bu alımlara ait KDV genel esaslara göre iade hesabında dikkate\
    \ alınır.\n- YMM, (E) Ltd. Şti. için yaptığı belge incelemesini ve karşıt incelemeyi (Yönetmelik md. 8 ve md. 15/b, d)\
    \ çalışma kâğıtlarına bağlamalıdır. Teslim, nakliye ve ödeme kanıtlarını raporda somut olarak göstermelidir.\n- (F) Ltd.\
    \ Şti. ile ilgili tespit ve şirketin seçtiği yol (KDV'nin çıkarılması veya teminat), tutarlarıyla birlikte raporda açıkça\
    \ yer almalıdır. Md. 19'a göre raporlar kolay anlaşılır, kısa cümlelerle ve açık bir üslupla yazılır; açıklamalar tereddüde\
    \ mahal vermeyecek nitelikte olmalıdır. Sürekli denetimde mali tablo ve raporlar üzerinde doğrudan veya dolaylı etkisi\
    \ olan ya da olması muhtemel her türlü mevzuat aykırılığı rapora yazılır.\n- Md. 16'ya göre YMM, tasdik konusunu olumsuz\
    \ etkileyen hata ve hileleri düzeltme önerisiyle işletme yönetimine bildirir. Yönetim düzeltirse tasdik yapılır. Düzeltme\
    \ istendiği hâlde yapılmazsa veya hileli bir durum tespit edilirse durum bir raporla ilgili mercilere bildirilir.\n- Md.\
    \ 20'ye göre YMM, tasdik ettiği konu ve belgelerin gerçeği yansıtmaması hâlinde ziyaa uğratılan vergiden ve kesilecek\
    \ cezalardan mükellefle birlikte müştereken ve müteselsilen sorumludur. Bu nedenle sahte belgedeki KDV'nin iade hesabından\
    \ ayıklanması YMM'nin kendi sorumluluğunun da gereğidir.\n"
  puanlama:
  - olcut: (a) İndirimle giderilemeyen KDV'nin (1.200.000 TL) hesaplanması
    puan: 2
  - olcut: (a) İade tutarının yüklenilen KDV ile karşılaştırılarak 1.100.000 TL bulunması
    puan: 3
  - olcut: (b) 15 günlük ispat süresi ve ispat hâlinde genel esaslara dönülmesi
    puan: 1
  - olcut: (b) KDV'nin çıkarılması seçeneğinde yeniden hesaplama ve 1.040.000 TL'nin bulunması
    puan: 3
  - olcut: (b) Üç kat teminatın (180.000 TL) hesaplanması
    puan: 2
  - olcut: (b) Hiçbir seçenek kullanılmazsa iadenin vergi inceleme raporuna göre sonuçlandırılacağının belirtilmesi
    puan: 2
  - olcut: (c) Düzenleme tespitinde iadenin vergi inceleme raporu sonucuna göre yapılacağı ve dört kat teminat (yanıltıcı
      belgede üç kat)
    puan: 3
  - olcut: (c) Teminatların inceleme raporu sonucuna göre çözülmesi ve genel esaslara dönüş şartlarından en az birinin belirtilmesi
    puan: 2
  - olcut: (d) Yalnız ihbarın (IV/A2) kapsamında işlem için yeterli olmadığının belirtilmesi
    puan: 2
  - olcut: (d) Tespitlerin kanıta bağlanarak açık ve tereddütsüz yazılması (md. 15, 19)
    puan: 2
  - olcut: (d) Hata ve hilelerin yönetime bildirilmesi, düzeltilmezse ilgili mercilere raporla bildirilmesi (md. 16) ve müteselsil
      sorumluluk (md. 20)
    puan: 3
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-1.1
    alinti: İade hakkı doğuran işlemler için yüklenilen KDV, öncelikle indirim konusu yapılır. İndirimle giderilemeyen bir
      miktarın kalması halinde, kalan tutar iade hakkı doğuran işlemin gerçekleştiği dönemde iade edilecek KDV olarak dikkate
      alınabilir.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-7.2
    alinti: Belgenin gerçekliğini ve doğruluğunu ispat etmemekle birlikte, söz konusu belgelerde yer alan KDV tutarlarını
      indirim ve iade hesabından çıkaran veya bu kısma sahte belge kullanma tespitlerinde üç kat, muhteviyatı itibarıyla yanıltıcı
      belge kullanma tespitlerinde iki kat teminat gösteren mükelleflerin geri kalan iade talepleri ilgili bölümlerdeki usul
      ve esaslara göre sonuçlandırılır.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-7.1
    alinti: Haklarında sahte belge veya muhteviyatı itibarıyla yanıltıcı belge düzenlediği konusunda tespit bulunan mükelleflerin
      iade talepleri vergi inceleme raporu sonucuna göre yerine getirilir.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.1
    alinti: Başkaca bir tespit bulunmamak kaydıyla, mükellefler hakkında sadece ihbar veya şikâyet bulunması da yeterli değildir.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 16, 19, 20
    alinti: Raporlar, tespit edilmiş dispozisyona uygun olarak, kolay anlaşılır, kısa cümleler halinde açık bir uslüp ile
      kaleme alınır. Raporlardaki açıklamalar tereddüde mahal vermeyecek nitelikte olur.
  gecerlilik:
    baslangic: '2024-10-31'
    bitis: null
  dogrulama:
    python: 'hesaplanan = 200000

      indirim = 1400000

      yuklenilen = 1100000

      sahte_kdv = 60000

      iade_genel = min(yuklenilen, indirim - hesaplanan)

      iade_cikarma = min(yuklenilen - sahte_kdv, (indirim - sahte_kdv) - hesaplanan)

      sonuc = {"giderilemeyen": indirim - hesaplanan, "iade_genel": iade_genel, "iade_cikarma": iade_cikarma, "teminat_uc_kat":
      sahte_kdv * 3}

      '
