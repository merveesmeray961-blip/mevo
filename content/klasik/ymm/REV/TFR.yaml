    Örtülü oranı = 2.000.000 / 5.000.000 = %40


    Örtülü faiz = 600.000 × %40 = **240.000 TL**


    **(b) Vergisel Nitelik:**


    KVK md.12/7''ye göre 240.000 TL, 31 Aralık 2025 itibarıyla dağıtılmış kâr payı sayılır ve kanunen kabul edilmeyen gider
    olarak vergi matrahına eklenir. Yurt dışı ortağa ödenen bu tutar üzerinden stopaj yükümlülüğü de doğabilir.


    **(c) Yurt Dışı Ortağın Başvurusu:**


    Tarhiyatın kesinleşmesiyle birlikte yurt dışı ana ortak, ülkesiyle Türkiye arasındaki ÇVÖA kapsamında karşılıklı uzlaşma
    prosedürü (MAP) başlatarak fazla vergi yükünün giderilmesini talep edebilir.

