- id: YMM-REV-TFR-K003
  sinav: ymm
  ders: REV
  konu: TFR
  kazanimlar:
  - örtülü kazanç dağıtımı
  - KVK md.12 örtülü sermaye
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Senaryo:**

    Gamma A.Ş.''nin 2025 yılı başı itibarıyla öz sermayesi 500.000 TL''dir. Tek ortağı Delta Ltd. Şti., yıl içinde Gamma A.Ş.''ye
    2.000.000 TL borç vermiştir ve bu borç için yıllık %20 faiz hesaplanmıştır.


    **(a)** Örtülü sermaye tutarını hesaplayınız.


    **(b)** Örtülü sermayeye isabet eden faizi ve bu tutarın KVK açısından nasıl değerlendirileceğini açıklayınız.

    '
  cozum: '**(a) Örtülü Sermaye Hesabı:**


    | Kalem | Tutar |

    |---|---|

    | Öz sermaye | 500.000 TL |

    | İzin verilen borç (3 kat) | 1.500.000 TL |

    | Alınan toplam borç | 2.000.000 TL |

    | Örtülü sermaye (aşan kısım) | **500.000 TL** |


    **(b) Örtülü Sermayeye İsabet Eden Faiz:**


    Toplam faiz = 2.000.000 × %20 = 400.000 TL


    Örtülü sermaye oranı = 500.000 / 2.000.000 = %25


    Örtülü sermayeye isabet eden faiz = 400.000 × %25 = **100.000 TL**


    Bu 100.000 TL KVK md.12/7 uyarınca kanunen kabul edilmeyen gider (KKEG) sayılır ve hesap dönemi sonunda dağıtılmış kâr
    payı olarak değerlendirilir.

    '
  puanlama:
  - olcut: Örtülü sermaye tutarının (500.000 TL) doğru hesaplanması
    puan: 7
  - olcut: Toplam faiz (400.000 TL) ve örtülü sermaye oranının (%25) doğru bulunması
    puan: 6
  - olcut: Örtülü sermayeye isabet eden faizin (100.000 TL) doğru hesaplanması
    puan: 4
  - olcut: KKEG niteliğinin ve kâr payı sayılmasının açıklanması
    puan: 3
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1, 12/7
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
  dogrulama:
    python: 'oz_sermaye = 500_000

      borc = 2_000_000

      faiz_orani = 0.20

      sinir = oz_sermaye * 3

      ortulu_sermaye = borc - sinir if borc > sinir else 0

      toplam_faiz = borc * faiz_orani

      ortulu_oran = ortulu_sermaye / borc

      ortulu_faiz = toplam_faiz * ortulu_oran

      sonuc = {"ortulu_sermaye": ortulu_sermaye, "ortulu_faiz": ortulu_faiz}

      '
