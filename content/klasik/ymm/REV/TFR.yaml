      \ * 0.5\ntoplam_borc = borc_ahmet + borc_banka\nos_ = toplam_borc - sinir\nkkeg_ahmet = faiz_ahmet * (os_ * borc_ahmet\
      \ / toplam_borc) / borc_ahmet\nkkeg_banka = faiz_banka * (os_ * borc_banka / toplam_borc) / borc_banka\nbrut = kkeg_ahmet\
      \ / 0.85\nortulu_kazanc = 2000000 * 1.25 - 2100000\ntoplam_kkeg = kkeg_ahmet + kkeg_banka + ortulu_kazanc\nsonuc = {\"\
      ortulu_sermaye\": round(os_), \"kkeg_faiz\": round(kkeg_ahmet + kkeg_banka),\n         \"ahmet_kesinti\": round(brut\
      \ * 0.15), \"ortulu_kazanc\": round(ortulu_kazanc),\n         \"toplam_kkeg\": round(toplam_kkeg), \"kv_etkisi\": round(toplam_kkeg\
