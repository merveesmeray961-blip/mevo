- id: YMM-REV-TFR-K001
  sinav: ymm
  ders: REV
  konu: TFR
  kazanimlar:
  - KVK md.12 örtülü sermaye
  - örtülü kazanç dağıtımı
  - düzeltme işlemleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Mavi Tekstil A.Ş.**nin VUK''a göre tespit edilen 1.1.2026
    tarihli öz sermayesi **3.000.000 TL**, 31.12.2026 tarihli öz sermayesi 4.200.000 TL''dir. Şirketin 2026 yılı boyunca aynı
    tutarlarda işletmede kullandığı borçlar ve gider yazdığı faizler şöyledir:


    | Borç veren | İlişki | Borç (TL) | 2026 faizi (TL) |

    |---|---|---|---|

    | Ahmet Bey | %55 ortak, tam mükellef gerçek kişi | 6.000.000 | 850.000 |

    | Kuzey Bankası A.Ş. | %20 ortak; ana faaliyet konusuna uygun mevduat bankası | 8.000.000 | 1.600.000 |

    | Güney Bankası A.Ş. | İlişkisiz; kredi Ahmet Bey''in taşınmazına ipotek tesis edilerek kullandırılmış | 2.000.000 | 400.000
    |


    Kur farkı yoktur. Faizlerin tamamı yıl içinde ödenmiştir.


    Ayrıca Mavi Tekstil A.Ş., 2026 yılında Ahmet Bey''in %70 ortağı olduğu tam mükellef **Lacivert Konfeksiyon Ltd. Şti.**ne
    maliyeti 2.000.000 TL olan kumaşları 2.100.000 TL''ye satmıştır. Mavi Tekstil aynı kumaşları karşılaştırılabilir koşullarda
    ilişkisiz müşterilerine maliyet üzerine %25 brüt kâr ekleyerek satmaktadır. İşleme en uygun yöntemin maliyet artı yöntemi
    olduğu ve Hazine zararının doğduğu kabul edilecektir.


    Konular 2027 yılında yapılan incelemede tespit edilmiştir. Kurumlar vergisi oranı %25, kâr dağıtımına bağlı vergi kesintisi
    oranı %15''tir.


    **İstenenler:**


    (a) Örtülü sermaye tutarını, bunun borç verenlere dağılımını ve Mavi Tekstil A.Ş. nezdinde kanunen kabul edilmeyen gider
    sayılacak faiz tutarını gerekçeleriyle hesaplayınız. (9 puan)


    (b) Ahmet Bey ve Kuzey Bankası A.Ş. nezdindeki sonuçları açıklayınız; Ahmet Bey''e isabet eden tutar için yapılması gereken
    vergi kesintisini hesaplayınız. (5 puan)


    (c) Lacivert Ltd. Şti.ye yapılan satış bakımından örtülü kazanç tutarını hesaplayınız; Mavi Tekstil A.Ş. ve Lacivert Ltd.
    Şti. nezdindeki sonuçları ve karşı taraf düzeltmesinin şartını açıklayınız. (8 puan)


    (d) (a) ve (c) şıklarından kaynaklanan toplam kanunen kabul edilmeyen gideri ve Mavi Tekstil A.Ş.nin 2026 kurumlar vergisine
    etkisini bulunuz. (3 puan)

    '
  cozum: "**(a) Örtülü sermaye (KVK md. 12, md. 11/1-b)**\n\n- Karşılaştırma hesap dönemi başındaki öz sermaye ile yapılır\
    \ (md. 12/3-b). Sınır: 3 × 3.000.000 = **9.000.000 TL**. Dönem sonu öz sermayesi (4.200.000) kullanılmaz.\n- Ahmet Bey'in\
    \ borcu tam tutarıyla dikkate alınır: 6.000.000 TL.\n- Kuzey Bankası, ortak sayılan ve ana faaliyet konusuna uygun faaliyet\
    \ gösteren banka olduğundan borcu **%50** oranında dikkate alınır (md. 12/2): 4.000.000 TL. Faizi de aynı oranda dikkate\
    \ alınır: 800.000 TL.\n- Güney Bankası kredisi, ortağın gayrinakdi teminatı (ipotek) karşılığında üçüncü kişiden yapılan\
    \ borçlanmadır; örtülü sermaye sayılmaz (md. 12/6-a).\n- Dikkate alınacak borç = 6.000.000 + 4.000.000 = 10.000.000 TL\
    \ → **Örtülü sermaye = 10.000.000 − 9.000.000 = 1.000.000 TL**\n- Dağılım (borç oranında): Ahmet Bey 1.000.000 × 6/10\
    \ = **600.000 TL**; Kuzey Bankası 1.000.000 × 4/10 = **400.000 TL**.\n- KKEG faiz:\n  - Ahmet Bey: 850.000 × 600.000 /\
    \ 6.000.000 = **85.000 TL**\n  - Kuzey Bankası: 800.000 × 400.000 / 4.000.000 = **80.000 TL**\n  - Toplam **165.000 TL**\
    \ (kontrol: (850.000 + 800.000) × 1.000.000 / 10.000.000 = 165.000)\n\n**(b) Borç verenler nezdinde (md. 12/7)**\n\n-\
    \ Örtülü sermaye üzerinden ödenen faizler, şartların gerçekleştiği hesap döneminin son günü (31.12.2026) itibarıyla gerek\
    \ borç alan gerekse borç veren nezdinde **dağıtılmış kâr payı** sayılır.\n- **Ahmet Bey** (gerçek kişi): 85.000 TL net\
    \ kâr payı kabul edilir ve brüte tamamlanır: 85.000 / 0,85 = 100.000 TL; **vergi kesintisi = 100.000 × %15 = 15.000 TL**\
    \ (Aralık 2026 dönemi için). Dönem kapandıktan sonra incelemeyle faiz reddi yapıldığından kesinti, faizin ödenip ödenmediğine\
    \ bakılmaksızın yapılır.\n- **Kuzey Bankası** (tam mükellef kurum): 80.000 TL faiz geliri kâr payı geliri olarak dikkate\
    \ alınır; şartları varsa iştirak kazançları istisnasından yararlanır, kâr payı kesintisi yapılmaz. Bankanın düzeltme yapabilmesi\
    \ için Mavi Tekstil adına tarh edilen vergilerin **kesinleşmiş ve ödenmiş** olması şarttır (md. 12/7).\n\n**(c) Transfer\
    \ fiyatlandırması (KVK md. 13, md. 11/1-c)**\n\n- Lacivert Ltd. Şti., ortak Ahmet Bey'in %70 ortağı olduğu kurumdur; ortaklık\
    \ kanalıyla ilişki %10'un üzerinde olduğundan **ilişkili kişidir** (md. 13/2).\n- Maliyet artı yöntemiyle emsal fiyat:\
    \ 2.000.000 × 1,25 = 2.500.000 TL (iç emsal).\n- **Örtülü kazanç = 2.500.000 − 2.100.000 = 400.000 TL**. Yurt içi tam\
    \ mükellefler arasındaki işlem olduğundan Hazine zararı şartı aranır; olayda gerçekleştiği kabul edilmiştir (md. 13/7).\n\
    - Mavi Tekstil'de 400.000 TL kanunen kabul edilmeyen gider olarak kazanca eklenir ve hesap döneminin son günü itibarıyla\
    \ dağıtılmış kâr payı sayılır (md. 13/6).\n- Kâr payı bir kuruma (Lacivert) aktarıldığından iştirak kazancı niteliğindedir;\
    \ kâr dağıtımına bağlı vergi kesintisi yapılmaz (Tebliğ 13.3).\n- Lacivert nezdinde alış bedeli emsal bedele (2.500.000\
    \ TL) göre düzeltilir ve aradaki 400.000 TL kâr payı (iştirak kazancı) olarak dikkate alınır; bu düzeltme ancak Mavi Tekstil\
    \ adına tarh edilen vergilerin **kesinleşmesi ve ödenmesi** hâlinde yapılabilir (md. 13/6).\n\n**(d) Toplam etki**\n\n\
    - Toplam KKEG = 165.000 + 400.000 = **565.000 TL**\n- Kurumlar vergisi farkı = 565.000 × %25 = **141.250 TL** (ayrıca\
    \ vergi ziyaı cezası ve gecikme faizi söz konusu olur).\n"
  puanlama:
  - olcut: Dönem başı öz sermayesiyle 9.000.000 TL sınırının bulunması
