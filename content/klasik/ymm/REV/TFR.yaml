  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Ay Elektronik A.Ş.**''nin VUK''a göre tespit edilen 1.1.2026
    tarihli öz sermayesi **500.000 TL**''dir. Şirket 2026 yılında şu borçlanmalara girmiştir:


    | Tarih | Borcun kaynağı | Niteliği | Tutar |

    |---|---|---|---|

    | 1.2.2026 | Bay Kerem | %50 ortak, tam mükellef gerçek kişi | 700.000 TL (30.9.2026''da tamamen ödenmiştir) |

    | 1.5.2026 | Orbit B.V. | %30 ortak, Hollanda''da yerleşik dar mükellef kurum | 20.000 Euro (alındığı tarihteki kur 40
    TL; 31.12.2026''da ödenmemiştir) |

    | 1.6.2026 | Maviova A.Ş. | Ortakla ilişkisi yok; borç, Orbit B.V.''nin verdiği gayrinakdî teminat karşılığında kullanılmıştır
    | 300.000 TL (31.12.2026''da ödenmemiştir) |

    | 1.7.2026 | Sera Bank A.Ş. | Bay Kerem''in %30 ortağı olduğu, ana faaliyeti kapsamında kredi veren banka | 800.000 TL
    (31.12.2026''da ödenmemiştir) |

    | 1.8.2026 | Sera Holding A.Ş. | Bay Kerem''in %80 ortağı olduğu şirket; 2027 yılında teslim edilecek mallar için sipariş
    avansı | 100.000 TL |


    Şirketin 2026 yılında, **örtülü sermaye sayılan dönemde** tahakkuk ettirdiği gider tutarları ise şöyledir: Bay Kerem borcuna
    faiz 63.000 TL; Orbit B.V. borcuna faiz 24.000 TL ve kur farkı gideri 40.000 TL; Sera Bank kredisine faiz 40.000 TL. Avans
    için vade farkı hesaplanmamıştır. Tutarların tamamı gider yazılmıştır. Örtülü sermaye tutarı, geçici vergi dönemlerinden
    bağımsız olarak yılın en yüksek tutarı itibarıyla belirlenecektir.


    **İstenenler:**


    (a) Örtülü sermaye hesabına girmeyen borçlanmaları gerekçeleriyle belirtiniz; hesaba esas borç tutarlarını gösteriniz.
    (5 puan)


    (b) Öz sermayenin üç katı aşıldığı tarihi ve örtülü sermayenin bulunduğu dönemi belirleyiniz; örtülü sermaye tutarını
    ve borç verenlere isabet eden payları hesaplayınız. (7 puan)


    (c) Örtülü sermayeye isabet eden kanunen kabul edilmeyen gider tutarını Tebliğ''deki yönteme göre hesaplayınız. (5 puan)


    (d) Bu tutarın hangi kısmının dağıtılmış kâr payı sayılacağını, borç verenler itibarıyla gösteriniz; Orbit B.V. bakımından
    sonucu açıklayınız. (5 puan)

    '
  cozum: '**(a) Hesaba girmeyen / ayarlanan borçlar**


    - **Maviova A.Ş.** borcu: ortakların sağladığı gayrinakdî teminat karşılığında **üçüncü kişiden** yapılan borçlanmadır;
    KVK md. 12/6-a gereği örtülü sermaye sayılmaz.

    - **Sera Bank** kredisi: ana faaliyetine uygun çalışan ve ortakla ilişkili kişi sayılan bankadan yapıldığından **%50**
    oranında dikkate alınır (md. 12/2): 800.000 × %50 = 400.000 TL.

    - **Orbit B.V.** borcu, **alındığı tarihteki kurla** hesaplanır (Tebliğ 12.1.5): 20.000 × 40 = 800.000 TL.

    - **Sera Holding avansı:** alınan avanslar amacı ne olursa olsun finansman sağladığından borç sayılır ve ortakla ilişkili
    kişiden (Bay Kerem''in %80 ortağı olduğu şirket) alındığı için hesaba girer: 100.000 TL.


    | Borç | Hesaba esas tutar (TL) |

    |---|---|

    | Bay Kerem | 700.000 |

    | Orbit B.V. | 800.000 |

    | Maviova A.Ş. | 0 |

    | Sera Bank | 400.000 |

    | Sera Holding (avans) | 100.000 |

    | **Toplam (30.9.2026''ya kadar)** | **2.000.000** |


    **(b) Zaman çizelgesi**


    Öz sermayenin üç katı = 3 × 500.000 = **1.500.000 TL** (öz sermaye hesap dönemi başı VUK değeridir, md. 12/3-b).


    - 1.2: 700.000 → aşılmadı.

    - 1.5: 700.000 + 800.000 = 1.500.000 → eşit, **aşılmadı** (aşan kısım örtülü sermayedir).

    - 1.7: + 400.000 (Sera Bank %50) = 1.900.000 → **sınır ilk kez aşıldı (1.7.2026)**, aşan 400.000 TL.

    - 1.8: + 100.000 avans = 2.000.000 → aşan **500.000 TL**.

    - 30.9: Bay Kerem borcu ödenince 1.300.000 TL''ye düşer; sınır altına inildiğinden örtülü sermaye **30.9.2026''da sona
    erer**.


    Örtülü sermaye dönemi **1.7.2026 – 30.9.2026**; yılın en yüksek aşan tutarı **2.000.000 − 1.500.000 = 500.000 TL**''dir.
    Dağılım (borç / 2.000.000 × 500.000):


    | Borç veren | Pay (TL) |

    |---|---|

    | Bay Kerem | 175.000 |

    | Orbit B.V. | 200.000 |

    | Sera Bank | 100.000 |

    | Sera Holding | 25.000 |

    | **Toplam** | **500.000** |


    **(c) KKEG**


    Oran = 500.000 / 2.000.000 = %25. Tebliğ''deki örnekte olduğu gibi %50 dikkate alınan bankaya ilişkin gider de yarı yarıya
    alınır: Sera Bank faizi 40.000 / 2 = 20.000 TL.


    Faiz toplamı = 63.000 + 24.000 + 20.000 = 107.000 TL; kur farkı = 40.000 TL.


    KKEG = 25% × (107.000 + 40.000) = **36.750 TL** (md. 11/1-b).


    **(d) Kâr payı sayılan kısım**


    Kur farkı hariç faiz ve benzeri tutarlar 31.12.2026 itibarıyla dağıtılmış kâr payı (dar mükellef için ana merkeze aktarılan
    tutar) sayılır (md. 12/7): 25% × 107.000 = **26.750 TL**. Kur farkına isabet eden 10.000 TL kâr payı sayılmaz.


    | Borç veren | Kâr payı sayılan faiz (TL) |

    |---|---|

    | Bay Kerem | 15.750 |

    | Orbit B.V. | 6.000 |

    | Sera Bank | 5.000 |

    | **Toplam** | **26.750** |


    Orbit B.V. dar mükellef kurum olduğundan 6.000 TL ana merkeze aktarılan tutar sayılır, net kâr payı kabul edilip brüte
    tamamlanarak kâr dağıtımına bağlı vergi kesintisine tabi tutulur. Düzeltme için örtülü sermaye kullanan kurum adına tarh
    edilen vergilerin kesinleşmiş ve ödenmiş olması şarttır; tam mükellef kurumlar nezdindeki düzeltmede kur farkları da kapsanır
    (md. 12/7).

    '
