- id: YMM-REV-TFR-K002
  sinav: ymm
  ders: REV
  konu: TFR
  kazanimlar:
  - KVK md.13 emsallere uygunluk ve yöntemler
  - örtülü kazanç dağıtımı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Senaryo:**

    Alpha A.Ş., yurt dışındaki ana ortağı Beta Ltd.''e (iştiraki %80) 2025 yılında 1.000 adet ürün satmıştır. Aynı ürünlerin
    bağımsız müşterilere satış fiyatı birim başına 200 USD iken Beta Ltd.''e 150 USD''ye satılmıştır. 2025 yılındaki kur:
    1 USD = 30 TL.


    **(a)** Kullanılan transfer fiyatlandırması yöntemini belirtiniz ve emsale aykırı satışın KVK md.13 açısından sonucunu
    açıklayınız.


    **(b)** Örtülü kazanç dağıtımı sayılan tutarı ve bu tutarın kurumlar vergisi matrahına etkisini hesaplayınız.


    **(c)** Tarhiyatın kesinleşmesi halinde Beta Ltd.''in vergisel durumunun ne olacağını açıklayınız.

    '
  cozum: '**(a) Yöntem ve KVK md.13 Değerlendirmesi:**


    Bağımsız müşterilere uygulanan piyasa fiyatı (200 USD) ile ilişkili kişiye uygulanan fiyat (150 USD) doğrudan karşılaştırıldığından
    kullanılan yöntem **Karşılaştırılabilir Fiyat Yöntemi (KFY)**''dir.


    Alpha A.Ş., KVK md.13/1 kapsamında ilişkili kişisi Beta Ltd.''e emsallere uygunluk ilkesine aykırı biçimde düşük fiyat
    uygulamıştır. Bu nedenle aradaki fark transfer fiyatlandırması yoluyla örtülü olarak dağıtılmış kazanç sayılır.


    **(b) Örtülü Kazanç Tutarı ve Matrah Etkisi:**


    | Kalem | Hesaplama | Tutar |

    |---|---|---|

    | Emsal fiyat | 200 USD × 1.000 adet | 200.000 USD |

    | Fiilen uygulanan fiyat | 150 USD × 1.000 adet | 150.000 USD |

    | Fark (örtülü kazanç) | 50 USD × 1.000 adet | 50.000 USD |

    | TL karşılığı (30 TL/USD) | 50.000 × 30 | **1.500.000 TL** |


    Bu 1.500.000 TL Alpha A.Ş.''nin 2025 yılı kurumlar vergisi matrahına eklenir (KKEG olarak değil, hasılata ilave yoluyla).


    **(c) Beta Ltd.''in Vergisel Durumu:**


    KVK md.13/6 uyarınca tarhiyatın kesinleşmesi halinde Beta Ltd. nezdinde karşılıklı düzeltme yapılabilir. Beta Ltd. 1.500.000
    TL tutarındaki fark için fazla ödediği vergiyi iade veya mahsup yoluyla geri alabilir. Bu işlem çifte vergilendirmeyi
    önleme anlaşması kapsamında talep edilir.

    '
  puanlama:
  - olcut: Karşılaştırılabilir Fiyat Yöntemi'nin doğru tespit edilmesi ve KVK md.13/1 atfı
    puan: 5
  - olcut: Örtülü kazanç dağıtımı kavramının açıklanması
    puan: 5
  - olcut: Fark tutarının (50.000 USD / 1.500.000 TL) doğru hesaplanması
    puan: 7
