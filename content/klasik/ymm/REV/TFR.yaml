    - 3 numaralı borç: ortakla ilişkili kişi sayılan ve ana faaliyetine uygun çalışan bankadan yapılan borçlanma **%50 oranında**
    dikkate alınır (KVK md. 12/2): 1.200.000 × %50 = 600.000 TL.


    | Borç | Tutar | Dikkate alınan |

    |---|---|---|

    | 1 Bay Ali | 1.200.000 | 1.200.000 |

    | 2 Nova Holding | 600.000 | 600.000 |

    | 3 Karadeniz Bankası | 1.200.000 | 600.000 |

    | 4 Ege Bankası | 800.000 | 0 |

    | 5 Doğuş Ltd. | 500.000 | 0 |

    | **Toplam** | | **2.400.000** |


    **(b) Örtülü sermaye**


    Öz sermaye = 600.000 TL; üç katı = 1.800.000 TL. Örtülü sermaye = 2.400.000 − 1.800.000 = **600.000 TL** (KVK md. 12/1;
    öz sermaye hesap dönemi başındaki VUK öz sermayesidir, md. 12/3-b).


    | Borç veren | Dikkate alınan borç | Pay (borç / 2.400.000 × 600.000) |

    |---|---|---|

    | Bay Ali | 1.200.000 | 300.000 |

    | Nova Holding | 600.000 | 150.000 |

    | Karadeniz Bankası | 600.000 | 150.000 |

    | **Toplam** | 2.400.000 | **600.000** |


    **(c) KKEG**


    Oran = 600.000 / 2.400.000 = %25. Örtülü sermaye hesabına giren borçların faiz ve kur farkı giderleri: 120.000 + 54.000
    + 18.000 + 96.000 (Karadeniz Bankası faizinin %50''si: 192.000 × %50) = 288.000 TL. KKEG = 288.000 × %25 = **72.000 TL**
    (KVK md. 11/1-b). Kurumlar vergisi etkisi = 72.000 × %25 = **18.000 TL**.


    **(d) Borç verenler nezdindeki sonuç**


    - Örtülü sermaye üzerinden ödenen faiz ve benzeri tutarlar, hem borç alan hem borç veren nezdinde, örtülü sermaye şartlarının
    gerçekleştiği hesap döneminin son günü (31.12.2026) itibarıyla **dağıtılmış kâr payı** (dar mükellefler için ana merkeze
    aktarılan tutar) sayılır (KVK md. 12/7).

    - Faiz kısmı: borç verenlere isabet eden faiz: Bay Ali''ye 120.000 × 300.000 / 1.200.000 = 30.000 TL, Nova Holding''e
    54.000 × 150.000 / 600.000 = 13.500 TL ve Karadeniz Bankası''na 192.000 × 150.000 / 1.200.000 = 24.000 TL olmak üzere
    toplam 67.500 TL kâr payı sayılır. **Kur farkı kısmı (18.000 × %25 = 4.500 TL) kâr payı sayılmaz.**

    - Nova Holding GmbH dar mükellef kurum olduğundan kendisine isabeden faiz (54.000 × %25 = 13.500 TL), net kâr payı kabul
    edilip brüte tamamlanarak kâr dağıtımına bağlı vergi kesintisine tabidir; daha önce faizden yapılan kesinti bu kesintiye
    mahsup edilir.

    - Bay Ali (tam mükellef gerçek kişi) bakımından da aynı kâr payı nitelendirmesi geçerlidir; Karadeniz Bankası (tam mükellef)
    bakımından düzeltme yapılabilmesi için borç alan adına tarh edilen vergilerin kesinleşmiş ve ödenmiş olması şarttır.

    '
