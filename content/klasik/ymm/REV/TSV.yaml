- id: YMM-REV-TSV-K001
  sinav: ymm
  ders: REV
  konu: TSV
  kazanimlar:
  - nakdi sermaye artırımı indirimi
  - ihracat ve hizmet ihracatı indirimi
  - yurt içi asgari kurumlar vergisi ile teşvik ve indirimlerin etkileşimi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '2015''ten beri faaliyette olan, esas sözleşmesindeki faaliyet konusu yazılım hizmetleri olan, hesap dönemi takvim
    yılı olan, finans, bankacılık ve sigortacılık sektörlerinde bulunmayan (Z) Yazılım AŞ''nin 2026 yılına ilişkin bilgileri
    aşağıdadır.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Yurt dışı mukimlere Türkiye''den verilen ve münhasıran yurt dışında yararlanılan yazılım hizmetleri hasılatı | 16.000.000
    |

    | Yurt içindeki müşterilere verilen yazılım hizmetleri hasılatı | 4.000.000 |

    | Yurt dışı hizmetlere doğrudan yüklenilen maliyet ve giderler | 6.000.000 |

    | Yurt içi hizmetlere doğrudan yüklenilen maliyet ve giderler | 2.500.000 |

    | Ayrı hesaplarda izlenemeyen müşterek genel giderler (amortismanlar dahil) | 3.000.000 |

    | Mevduat faiz geliri | 500.000 |

    | Ticari bilanço kârı (yukarıdaki kalemlerden oluşmaktadır) | 9.000.000 |

    | Kanunen kabul edilmeyen giderler | 300.000 |


    Ek bilgiler:


    - Yurt dışı hizmetlere ilişkin faturalar yurt dışındaki müşteriler adına düzenlenmiş; bu hizmetlerden elde edilen kazancın
    tamamı 31/3/2027''ye kadar Türkiye''ye transfer edilmiştir. KVK md. 10/1-(ğ)''deki indirim oranı %80 olarak dikkate alınacaktır.

    - Şirketin sermayesinin nakden 9.000.000 TL artırılmasına ilişkin karar 18/3/2026''da ticaret siciline tescil edilmiştir.
    Taahhüdün 3.000.000 TL''si 2/3/2026''da (tescilden önce), 6.000.000 TL''si 20/9/2026''da ortaklarca şirketin banka hesabına
    yatırılmıştır; ortaklar bu ödemeler için kredi kullanmamış veya borç almamıştır. TCMB''nin 2026 için en son açıkladığı
    TL ticari kredi faiz oranı %40, indirim oranı %50''dir.

    - Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. KVK md. 32/7''deki ihracat kazancına ilişkin
    indirimli oran bu soruda dikkate alınmayacaktır. Geçmiş yıl zararı ve başka bir indirim veya istisna yoktur.


    **İstenenler:**


    (a) KVK md. 10/1-(ğ) kapsamındaki indirime konu kazancı, müşterek genel giderlerin ve faiz gelirinin durumunu açıklayarak
    hesaplayınız; indirim tutarını ve transfer şartının sağlanıp sağlanmadığını belirtiniz. (8 puan)


    (b) Nakdi sermaye artışı indirimini dönem hesabını göstererek hesaplayınız. (6 puan)


    (c) Kurumlar vergisi matrahını ve %25 oranına göre hesaplanan kurumlar vergisini bulunuz. (4 puan)


    (d) Yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız; iki indirimin asgari vergi matrahındaki durumunu gerekçelendirerek
    2026 yılı için hesaplanan kurumlar vergisini belirleyiniz. (7 puan)

    '
  cozum: '**(a) Hizmet ihracatı indirimi (KVK md. 10/1-ğ)**


    - Müşterek genel giderler, ayrı izlenemediğinden cari yıl hasılatı oranında dağıtılır (1 Seri No.lu Tebliğ, 10.5.3.2):
    yurt dışı payı = 16.000.000 / 20.000.000 = %80 → 3.000.000 x %80 = 2.400.000 TL (yurt içi payı 600.000 TL).

    - Mevduat faiz geliri esas faaliyet dışı gelir olduğundan indirim kapsamındaki kazanca dahil edilmez (Tebliğ, 10.5.3.4).

    - İndirime konu kazanç = 16.000.000 - 6.000.000 - 2.400.000 = **7.600.000 TL**

    - Kazancın tamamı beyanname verme süresi sonu olan 25/4/2027''den önce (31/3/2027) Türkiye''ye transfer edildiğinden ve
    faturalar yurt dışındaki müşteriler adına düzenlendiğinden şartlar sağlanmıştır.

    - İndirim = 7.600.000 x %80 = **6.080.000 TL**


    **(b) Nakdi sermaye artışı indirimi (KVK md. 10/1-ı)**


    İndirim = nakdi artış x faiz oranı x indirim oranı x (kalan ay / 12); ödeme ayı kesri tam ay sayılır.


    | Kısım | Sürenin başladığı ay | Ay | Hesap | Tutar (TL) |

    |---|---|---|---|---|

    | 3.000.000 (tescilden önce yatırılan) | Tescil ayı: Mart | 10 | 3.000.000 x %40 x %50 x 10/12 | 500.000 |

    | 6.000.000 (20/9/2026) | Ödeme ayı: Eylül | 4 | 6.000.000 x %40 x %50 x 4/12 | 400.000 |

    | **Toplam** | | | | **900.000** |


    **(c) Matrah ve vergi**


    - Kurum kazancı = 9.000.000 + 300.000 = 9.300.000 TL

    - md. 10''daki indirimler kanundaki sırayla: önce (ğ) bendi 6.080.000 TL, sonra (ı) bendi 900.000 TL; kazanç her ikisi
    için yeterlidir.

    - Matrah = 9.300.000 - 6.080.000 - 900.000 = **2.320.000 TL**

    - Hesaplanan kurumlar vergisi = 2.320.000 x %25 = **580.000 TL**


    **(d) Asgari kurumlar vergisi (KVK md. 32/C)**


    - İndirim ve istisnalar öncesi kurum kazancı = ticari bilanço kârı + KKEG = 9.300.000 TL (md. 32/C-6).

    - md. 32/C-2-b''de yalnız 10/1-(g), (h), (i) ve (j) bentlerindeki indirimler asgari matrahtan düşülebilir. Hizmet ihracatı
    indirimi (ğ) ve nakdi sermaye artışı indirimi (ı) bu sayımda yer almadığından asgari matrahtan düşülemez (Seri No: 23
    Tebliğ, 32.5.6''da da düşülemeyen indirimler arasında sayılmışlardır).

    - Asgari vergi = 9.300.000 x %10 = **930.000 TL**

    - 930.000 > 580.000 olduğundan aradaki 350.000 TL asgari vergi farkı olarak hesaplanır; 2026 yılı hesaplanan kurumlar
    vergisi **930.000 TL**''dir.

    - Yorum: Teşvik niteliğindeki indirimlerin tamamı normal hesapta kullanılmış olsa da asgari vergi, bu indirimlerin vergi
    etkisinin bir bölümünü geri almaktadır.

    '
  puanlama:
  - olcut: Müşterek genel giderlerin hasılat oranıyla dağıtımı (2.400.000)
    puan: 2
  - olcut: Faiz gelirinin indirim kapsamı dışında bırakılması
    puan: 1
  - olcut: İndirime konu kazanç 7.600.000
    puan: 2
  - olcut: Transfer ve fatura şartlarının değerlendirilmesi
    puan: 1
  - olcut: İndirim tutarı 6.080.000
    puan: 2
  - olcut: Tescil öncesi ödemede sürenin tescil ayından başlatılması (10 ay)
    puan: 2
  - olcut: Eylül ödemesinde ay kesrinin tam ay sayılması (4 ay)
    puan: 2
  - olcut: Nakdi sermaye indirimi toplamı 900.000
    puan: 2
  - olcut: Matrah 2.320.000 ve vergi 580.000
    puan: 4
  - olcut: Asgari matrahtan (ğ) ve (ı) indirimlerinin düşülemeyeceğinin gerekçesi
    puan: 3
  - olcut: Asgari vergi 930.000
    puan: 2
  - olcut: Karşılaştırma ve hesaplanan vergi 930.000 (fark 350.000)
    puan: 2
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-(ğ), 10/1-(ı), 32/C
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.2.6, 10.5.3.2, 10.5.3.4, 10.6.1
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 23)'
    madde: bölüm 32.5.4-32.5.6
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
  dogrulama:
    python: 'pay = 16000000 / 20000000

      kazanc_ih = 16000000 - 6000000 - 3000000 * pay

      ind_g = kazanc_ih * 0.80

      r = 0.40 * 0.50

      ind_n = 3000000 * r * 10 / 12 + 6000000 * r * 4 / 12

      kk = 9000000 + 300000

      matrah = kk - ind_g - ind_n

      kv = matrah * 0.25

      asgari = kk * 0.10

      sonuc = {''ihracat_kazanci'': round(kazanc_ih), ''ind_g'': round(ind_g), ''ind_n'': round(ind_n), ''matrah'': round(matrah),
      ''kv'': round(kv), ''asgari'': round(asgari), ''hesaplanan'': round(max(kv, asgari)), ''fark'': round(max(kv, asgari)
      - kv)}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 4, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, klasik 2
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-TSV-K002
  sinav: ymm
  ders: REV
  konu: TSV
  kazanimlar:
  - yatırım teşvik belgesi ve indirimli kurumlar vergisi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Tam mükellef **Kardelen Gıda AŞ** (imalatçı; finans sektöründe değildir) Ekim 2025'te Sanayi ve Teknoloji\nBakanlığından\
    \ bir tevsi yatırımı için **yatırım teşvik belgesi** almıştır. Belge bilgileri ve 2026 verileri:\n\n- Toplam yatırım harcaması\
    \ 40.000.000 TL; belgede yatırıma katkı oranı %30, kurumun diğer faaliyetlerinden elde edilen\n  kazançlara katkı kullandırılmayacağı\
    \ belirtilmiştir.\n- Yatırım 1.1.2026'da tamamen işletmeye alınmış ve 2026'da tamamlanmıştır.\n- Yatırımdan elde edilen\
    \ kazanç ayrı hesaplarda izlenmiş ve 10.000.000 TL olarak tespit edilmiştir. Diğer\n  faaliyetlerden elde edilen kazanç\
    \ 30.000.000 TL'dir. Ticari kâr + KKEG toplamı 40.000.000 TL'dir; başka istisna,\n  indirim veya zarar yoktur.\n\n**İstenenler:**\n\
    \n(a) 7555 sayılı Kanunla değişen KVK md. 32/A'ya göre indirimli kurumlar vergisi uygulamasının kapsamını, oranını ve\n\
    süresini açıklayınız. (6 puan)\n\n(b) Yatırıma katkı tutarını, 2026 için indirimli oranı, hesaplanan kurumlar vergisini\
    \ ve kullanılan katkı tutarını\nbulunuz. (9 puan)\n\n(c) Yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız; 32/A'dan\
    \ doğan vergi avantajının asgari vergiden\ndüşülüp düşülemeyeceğini açıklayınız. (6 puan)\n\n(d) Kalan katkı tutarının\
    \ sonraki dönemlerde nasıl dikkate alınacağını ve kazanç olmasına rağmen yararlanılmayan\nkatkının durumunu açıklayınız.\
    \ (4 puan)\n"
  cozum: "**(a) Kapsam**\n\nFinans ve sigorta kurumları, iş ortaklıkları, taahhüt işleri ve md. 32/A/1'de sayılan diğer yatırımlar\
    \ hariç olmak\nüzere teşvik belgeli yatırımlardan elde edilen kazançlara kurumlar vergisi oranı, yatırımın kısmen veya\
    \ tamamen\nişletilmesine başlanılan dönemden itibaren uygulanır. Uygulama yatırıma katkı tutarına ulaşıncaya kadar, ilk\
    \ dönem\ndahil **en fazla on hesap dönemi** sürer ve oran **%60 indirimli** uygulanır. Tevsi yatırımda kazanç ayrı\nizlenebiliyorsa\
    \ indirimli oran bu kazanca uygulanır (md. 32/A/4).\n\n**(b) Hesaplama**\n\n- Yatırıma katkı tutarı = 40.000.000 × %30\
    \ = **12.000.000 TL**.\n- İndirimli oran = %25 × (1 − %60) = **%10**.\n- Yatırım kazancı vergisi = 10.000.000 × %10 =\
    \ 1.000.000 TL; diğer faaliyet vergisi = 30.000.000 × %25 =\n  7.500.000 TL; hesaplanan kurumlar vergisi = **8.500.000\
    \ TL**.\n- Kullanılan katkı (vazgeçilen vergi) = 10.000.000 × (%25 − %10) = **1.500.000 TL**.\n\n**(c) Asgari vergi**\n\
    \nAsgari vergi = 40.000.000 × %10 = **4.000.000 TL**. Md. 32/C/1'e göre 32 ve 32/A dikkate alınarak hesaplanan vergi\n\
    (8.500.000 TL) daha yüksek olduğundan **8.500.000 TL** ödenir.\n\nMd. 32/C/3 uyarınca asgari vergiden indirilebilecek\
    \ 32/A avantajı, md. 32/C'nin **yürürlüğe girdiği tarihten önce**\nalınmış teşvik belgelerindeki katkı tutarlarıyla sınırlıdır.\
    \ Bu belge Ekim 2025'te alındığından indirimli oran\nnedeniyle alınmayan vergi asgari vergiden **düşülemez**. Asgari vergi\
    \ sınırına ulaşılan yıllarda indirimli orandan\nfiilen yararlanılamaz.\n\n**(d) Kalan katkı**\n\nKalan katkı = 12.000.000\
    \ − 1.500.000 = **10.500.000 TL**. Yatırım 2026'da tamamlandığından kalan tutar izleyen\nyıllarda (2027'den itibaren)\
    \ VUK'a göre belirlenen **yeniden değerleme oranında artırılarak** dikkate alınır\n(md. 32/A/2). 7555 sayılı Kanunla eklenen\
    \ hükme göre kazanç bulunmasına rağmen yararlanılmayan katkı tutarları\n**sonraki dönemlerde dikkate alınmaz**. Şartların\
    \ sağlanmadığının tespiti hâlinde zamanında tahakkuk ettirilmeyen\nvergiler ceza uygulanmaksızın gecikme faiziyle aranır\
    \ (md. 32/A/5).\n"
  puanlama:
  - olcut: (a) Kapsam dışı faaliyetler, %60 indirim ve on dönem sınırı
    puan: 6
  - olcut: (b) Katkı tutarı 12.000.000 ve indirimli oran %10
    puan: 3
  - olcut: (b) Hesaplanan vergi 8.500.000 TL
    puan: 3
  - olcut: (b) Kullanılan katkı 1.500.000 TL
    puan: 3
  - olcut: (c) Asgari vergi 4.000.000 TL ve karşılaştırma
    puan: 3
  - olcut: (c) Yeni belgelerde 32/A avantajının asgari vergiden düşülememesi
    puan: 3
  - olcut: (d) Kalan 10.500.000 TL, endeksleme ve kullanılmayan katkının kaybı
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A, 32/C
    alinti: kullanılabileceği ilk hesap dönemi dahil en fazla on hesap dönemi %60 indirimli olarak
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "katki = 40000000 * 0.30\noran = 0.25 * (1 - 0.60)\nkv = 10000000 * oran + 30000000 * 0.25\nkul = 10000000 * (0.25\
      \ - oran)\nsonuc = {\"katki\": katki, \"oran\": round(oran * 100), \"v1\": 10000000 * oran, \"v2\": 7500000, \"kv\"\
      : kv,\n         \"kul\": kul, \"asg\": 4000000, \"kalan\": katki - kul}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_REV
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-24'
      G5:
        sonuc: gecti
        tarih: '2026-10-24'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-24'
    kim: uretici
    ne: harici teslim t_K_REV.yaml, klasik 13
  - tarih: '2026-10-24'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-TSV-K003
  sinav: ymm
  ders: REV
  konu: TSV
  kazanimlar:
  - Ar-Ge ve tasarım indirimi
  - ihracat ve hizmet ihracatı indirimi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Tam mükellef **Nova Yazılım AŞ** (2016'dan beri faaliyette) Ar-Ge merkezi belgesine sahiptir ve teknoloji geliştirme\n\
    bölgesinde değildir. Ar-Ge merkezi, Cumhurbaşkanınca belirlenen artış indirimi kriterlerini taşımaktadır. 2026\nverileri:\n\
    \n- Ticari bilanço kârı 18.000.000 TL; KKEG 2.000.000 TL.\n- Yurt dışında yerleşik müşterilere verilen ve münhasıran yurt\
    \ dışında yararlanılan yazılım hizmetlerinden elde\n  edilen kazanç 14.000.000 TL. Faturalar yurt dışındaki müşteriler\
    \ adına düzenlenmiş, bedellerin tamamı\n  31.12.2026'ya kadar Türkiye'ye getirilmiştir.\n- Ar-Ge merkezinde yapılan ve\
    \ gider yazılan Ar-Ge harcamaları: 2026'da 2.400.000 TL, 2025'te 2.000.000 TL.\n\n**İstenenler:**\n\n(a) Hizmet ihracatı\
    \ indiriminin şartlarını ve 2026 yılında uygulanacak oranı açıklayarak indirim tutarını\nhesaplayınız. (7 puan)\n\n(b)\
    \ Ar-Ge indirimini hesaplayınız; harcamaların ayrıca gider yazılmasının indirim hakkını etkileyip etkilemediğini\naçıklayınız.\
    \ (6 puan)\n\n(c) Kurumlar vergisi matrahını, hesaplanan vergiyi ve yurt içi asgari kurumlar vergisini hesaplayarak ödenecek\n\
    vergiyi belirleyiniz. (9 puan)\n\n(d) Kazancın yetersiz olduğu bir yılda Ar-Ge indiriminin ve hizmet ihracatı kazancının\
    \ Türkiye'ye\ngetirilmemesinin sonuçlarını açıklayınız. (3 puan)\n"
  cozum: "**(a) Hizmet ihracatı indirimi (KVK md. 10/1-ğ)**\n\nTürkiye'de yerleşmiş olmayan kişilere Türkiye'de verilen ve\
    \ **münhasıran yurt dışında yararlanılan** yazılım vb.\nhizmetlerden elde edilen kazançlar için indirim uygulanır. Kazancın\
    \ beyanname verme süresine kadar **tamamının\nTürkiye'ye transferi** ve **fatura veya benzeri belgenin yurt dışındaki\
    \ müşteri adına düzenlenmesi** şarttır.\nKanuni oran %80'dir. 11257 sayılı Cumhurbaşkanı Kararıyla 1.1.2026'dan itibaren\
    \ başlayan dönemlerde oran\n**%100**'dür. İndirim = 14.000.000 × %100 = **14.000.000 TL**.\n\n**(b) Ar-Ge indirimi (5746\
    \ s. K. md. 3)**\n\n- Ar-Ge merkezinde yapılan Ar-Ge harcamalarının **tamamı** indirilir: 2.400.000 TL.\n- Kriterleri\
    \ taşıyan merkezlerde ayrıca bir önceki yıla göre artışın **%50'sine kadarı** indirilir:\n  (2.400.000 − 2.000.000) ×\
    \ %50 = 200.000 TL.\n- Toplam Ar-Ge indirimi = **2.600.000 TL**.\n\nHarcamalar VUK'a göre aktifleştirilerek amortisman\
    \ yoluyla itfa edilir; iktisadi kıymet oluşmazsa doğrudan gider\nyazılır. Gider yazılmaları ayrıca indirim yapılmasına\
    \ **engel değildir**.\n\n**(c) Matrah ve asgari vergi**\n\n| Satır | TL |\n|---|---|\n| Ticari kâr + KKEG | 20.000.000\
    \ |\n| − Ar-Ge indirimi | (2.600.000) |\n| − Hizmet ihracatı indirimi | (14.000.000) |\n| **Matrah** | **3.400.000** |\n\
    | Hesaplanan vergi (%25) | 850.000 |\n\nAsgari matrahtan Ar-Ge indirimi düşülür (md. 32/C-2-ç). Md. 10/1-ğ indirimi md.\
    \ 32/C-2-b'de sayılmadığından\n**düşülemez**: 20.000.000 − 2.600.000 = 17.400.000 TL; asgari vergi **1.740.000 TL**. Hesaplanan\
    \ vergi daha düşük\nolduğundan **1.740.000 TL** ödenir.\n\n**(d) Yetersiz kazanç ve transfer**\n\n- Kazancın yetersizliği\
    \ nedeniyle indirilemeyen Ar-Ge indirimi sonraki dönemlere **devreder** ve her yıl VUK'a göre\n  belirlenen **yeniden\
    \ değerleme oranında artırılarak** dikkate alınır.\n- Hizmet ihracatı kazancı beyanname süresine kadar Türkiye'ye getirilmezse,\
