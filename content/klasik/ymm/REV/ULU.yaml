    '
  cozum: "**(a) Vergisel durum**\n\nKanuni ve iş merkezi yurt dışında olduğundan şirket **dar mükelleftir** (KVK md. 3/2).\
    \ Şantiye 6 aydan uzun\nsürdüğünden hem iç mevzuata (GVK md. 156) hem anlaşmaya göre **iş yeri** oluşmuştur. İş birden\
