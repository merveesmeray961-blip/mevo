    hangi yılın beyannamesinde göstereceğini belirtiniz. (5 puan)


    (d) Nordic Consult Oy''nin beyanname vermesi hâlinde ödeyeceği veya iade alacağı tutarı hesaplayınız; iade hakkının kullanımına
    ilişkin süreyi belirtiniz. (6 puan)

    '
  cozum: '**(a) Hakediş kesintileri (KVK md. 30/1-a; 9707 sayılı Karar)**


    Üç iş de birden fazla takvim yılına yaygın inşaat veya onarım işidir; bu nedenle KVK md. 30/1-(a) kapsamında hakediş ödemelerinden
    kesinti yapılır. Kesinti, avanslar dahil nakden veya **hesaben** ödeme ya da tahakkuk anında yapılır. Hesaben ödeme, ödeyeni
    hak sahibine karşı borçlu gösteren her türlü kayıt ve işlemdir (md. 30/10); bu nedenle Alpen Hoch AG''ye ait faturanın
    alacak kaydedilmiş, ödenmemiş 2.000.000 TL''lik kısmı da kesintiye konudur.


    | No | İşin türü | Kesinti matrahı (TL) | Oran | Kesinti (TL) |

    |---|---|---|---|---|

    | 1 | Raylı ulaşım sistemi inşaatı | 10.000.000 | %1 | 100.000 |

    | 2 | Gemi onarım işi | 4.000.000 | %1 | 40.000 |

    | 3 | Diğer işler (fabrika binası) | 6.000.000 (4.000.000 nakden + 2.000.000 hesaben) | %5 | 300.000 |

    | | **Toplam hakediş kesintisi** | | | **440.000** |


    3 numaralı ödemenin ödenmeyen 2.000.000 TL''lik kısmı için de kesinti 100.000 TL''dir (2.000.000 × %5); kesinti ödemenin
    fiilen yapılmasını beklemeden hesaben ödeme anında doğar.


    **(b) Diğer kesintiler ve bildirim**


    - 4 numaralı ödeme: serbest meslek kazancı; Türkiye''de icra edilmiştir. Kesinti = 1.000.000 × %20 = **200.000 TL**.

    - 5 numaralı ödeme: gayrimenkul sermaye iradı; kesilmesi gereken verginin ödeyen tarafından üstlenilmesi hâlinde kesinti,
    fiilen ödenen tutar ile ödeyenin yüklendiği verginin toplamı üzerinden hesaplanır (md. 30/11). Brüt tutar B ise B = 1.600.000
    + 0,20 × B → B = 1.600.000 / 0,80 = **2.000.000 TL**; kesinti = 2.000.000 × %20 = **400.000 TL**.


    | Kalem | Kesinti (TL) |

    |---|---|

    | Hakediş (1–3 numaralı ödemeler) | 440.000 |

    | Serbest meslek (4) | 200.000 |

    | Gayrimenkul sermaye iradı (5) | 400.000 |

    | **Toplam** | **1.040.000** |


    Kesintiler, ödeme veya tahakkukun yapıldığı yer itibarıyla bağlı olunan vergi dairesine **muhtasar beyanname** ile bildirilir
    (md. 31). Yapılan kesinti, kesinti yapanın kayıt ve hesaplarında ayrıca gösterilir (md. 30/12).


    **(c) Beyanname zorunluluğu**


    - Ticari ve zirai kazançlar hariç olmak üzere kesinti yoluyla vergilendirilen kazanç ve iratlar için beyanname verilmesi
    **ihtiyaridir** (md. 30/9). Nordic Consult Oy''nin serbest meslek kazancı ve Isar Immo GmbH''nin gayrimenkul sermaye iradı
    için beyanname verilmesi ihtiyaridir.

    - Hakediş ödemeleri üzerinden kesinti yapılan birden fazla takvim yılına yaygın inşaat ve onarım işlerinden elde edilen
    kazançların kurumlar vergisi beyannamesiyle beyanı **zorunludur** (Tebliğ 30.6). Rhein Bau GmbH bakımından beyan zorunludur.

    - Birden fazla takvim yılına sirayet eden inşaat işinde kâr veya zarar işin bittiği yıl kesin olarak belirlenir ve tamamı
    o yılın geliri sayılarak o yılın beyannamesinde gösterilir (GVK md. 42). Rhein Bau GmbH, kazancını işin bittiği yılın
    (2027 yılında bitirirse 2027 yılının) beyannamesinde gösterecek; kesilen hakediş vergilerini o beyannameden mahsup edecektir
    (md. 34/1).


    **(d) Nordic Consult Oy**


    Kesinti yoluyla vergilendirilen serbest meslek kazancı için beyanname verilmesi ihtiyaridir. Beyanname verilirse kazanç,
    GVK''nın serbest meslek kazancının tespitine ilişkin hükümlerine göre belirlenir (md. 22/2).


    | Kalem | Tutar (TL) |

    |---|---|

    | Hasılat | 1.000.000 |

    | Gider | (400.000) |

    | Kurum kazancı | 600.000 |

    | Hesaplanan kurumlar vergisi (%25) | 150.000 |

    | Mahsup edilecek kesinti (4 numaralı ödeme) | (200.000) |

    | **İade edilecek tutar** | **50.000** |


    Mahsup edilecek vergi hesaplanan vergiden fazla olduğundan fark, vergi dairesinin yazısının tebellüğünden itibaren **bir
    yıl içinde** başvurulması hâlinde iade edilir; bir yıl içinde başvurulmazsa alacak düşer (md. 34/5).

    '
