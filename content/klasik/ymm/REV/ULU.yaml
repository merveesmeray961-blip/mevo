    \ beyan eder.\n\n**(c) Beyan**\n\n- İş 2027'de bittiğinden kazanç **2027 hesap dönemi** kurumlar vergisi beyannamesiyle\
    \ beyan edilir. 2026 için\n  yıllara yaygın inşaat kazancı beyan edilmez.\n- Yıllara yaygın inşaat ve onarım işlerinden\
    \ elde edilen kazançlar **geçici vergiye tabi değildir** (GVK\n  mükerrer md. 120).\n- Kurumlar vergisi = 12.000.000 ×\
    \ %25 = **3.000.000 TL**. Yıllar itibarıyla yapılan 5.000.000 TL kesinti işin\n  bittiği yılın beyannamesinde hesaplanan\
