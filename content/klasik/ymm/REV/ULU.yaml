    \ olarak tespit edilir\n(GVK md. 42).\n\n**(b) Hakediş kesintisi (KVK md. 30/1-a)**\n\nYıllara yaygın inşaat işleriyle\
    \ uğraşan dar mükellef kurumlara yapılan hakediş ödemelerinden kesinti yapılır.\n9707 sayılı Cumhurbaşkanı Kararıyla demiryolu,\
