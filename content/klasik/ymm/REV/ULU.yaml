  soru: 'KDV mükellefi **Kartal Enerji A.Ş.** 2026 yılında Türkiye''de iş yeri, daimi temsilcisi ve sabit yeri bulunmayan
    yabancı kurumlarla aşağıdaki işlemleri yapmıştır. Tüm ÇVÖA''lardan yararlanma şartları sağlanmıştır. KDV oranı %20''dir;
    hiçbir işlem KDV''den istisna değildir. 2 No.lu beyannameler süresinde ve ilgili dönemin 1 No.lu beyannamesinden önce
    verilip vergiler süresinde ödenmektedir.


    | No | İşlem | Bilgi |

    |---|---|---|

    | 1 | Almanya mukimi G GmbH''ye Türkiye''deki santralde kullanılan yazılımın kullanım hakkı (gayrimaddi hak) bedeli, Mart
    2026 | Net ödeme 1.800.000 TL; Türkiye''deki vergiyi şirket üstlenmiştir. İç mevzuat oranı %20; ÇVÖA sınırı %10. |

    | 2 | ABD mukimi U Inc.''den, tamamı ABD''de ifa edilen ve Türkiye''deki santralin bakım planlamasında kullanılan danışmanlık
    (serbest meslek) hizmeti, Nisan 2026 | Brüt bedel 500.000 TL. ÇVÖA''ya göre bu kazanç Türkiye''de vergilendirilemez. |

    | 3 | Şirketin %30 ortağı Hollanda mukimi H BV''ye 2025 kârından dağıtım, Mayıs 2026 | Nakden 3.000.000 TL; ayrıca H BV''nin
    payına isabet eden 1.000.000 TL kâr sermayeye eklenmiştir. İç mevzuat oranı %15; ÇVÖA''da en az %25 pay sahipliğinde sınır
    %5. |

    | 4 | Çin''deki C Ltd.''den türbin ithalatı, Haziran 2026 | Bedel 6.000.000 TL; satış sözleşmesi Çin''de imzalanmış, mal
    gümrükte serbest dolaşıma sokulmuştur. |


    **İstenenler:**


    (a) Her işlem için kurumlar vergisi kesintisi yapılıp yapılmayacağını dayanağıyla açıklayınız ve kesinti tutarını hesaplayınız.
    (12 puan)


    (b) Her işlem için sorumlu sıfatıyla KDV''nin doğup doğmadığını, tutarını ve indirim dönemini belirtiniz. (8 puan)


    (c) 1 numaralı işlemin ödeme tarihindeki yevmiye kaydını yapınız. (5 puan)

    '
  cozum: '**(a) Kurumlar vergisi kesintisi**


    1. **Gayrimaddi hak bedeli**: Yazılımın kullanım hakkının verilmesi gayrimaddi hakkın kiralanmasıdır; gayrimenkul sermaye
    iradı niteliğindedir (GVK md. 70/5; KVK md. 30/1-c). İç mevzuat oranı %20, ÇVÖA sınırı %10; KVK md. 35/3 gereği düşük
    oran **%10** uygulanır. Vergi üstlenildiğinden md. 30/11 uyarınca brütleştirme yapılır: brüt = 1.800.000 / 0,90 = **2.000.000
    TL**; kesinti = 2.000.000 × %10 = **200.000 TL**.

    2. **Danışmanlık**: Hizmet ABD''de ifa edilse de Türkiye''deki şirketin hesaplarına intikal ettiğinden GVK md. 7/4 ve
    son fıkra uyarınca iç mevzuata göre Türkiye''de elde edilmiş sayılır. Ancak ÇVÖA Türkiye''ye vergileme hakkı tanımadığından
    kesinti **yapılmaz (0 TL)**.

    3. **Kâr payı** (KVK md. 30/3): Sermayeye eklenen 1.000.000 TL kâr dağıtımı sayılmaz. Nakden dağıtılan 3.000.000 TL''ye
    iç oran %15, ÇVÖA sınırı %5 (pay %30 ≥ %25); düşük oran uygulanır: 3.000.000 × %5 = **150.000 TL**.

    4. **Türbin ithalatı**: C Ltd.''nin Türkiye''de iş yeri ve daimi temsilcisi yoktur; ticari kazanç GVK md. 7/1 ve KVK md.
    3/3-a uyarınca Türkiye''de elde edilmemiştir ve md. 30/1''de kesintiye tabi değildir. Kesinti **0 TL**.


    Toplam kurumlar vergisi kesintisi = 200.000 + 150.000 = **350.000 TL**; ödemelerin yapıldığı aylara ait muhtasar beyannamelerle
    (KVK md. 31) beyan edilir.


    **(b) Sorumlu sıfatıyla KDV**


    1. Yazılım kullanım hakkından Türkiye''de faydalanılmaktadır (KDVK md. 6/b). Matrah, KDVK md. 24/b gereği kesilen vergi
    dahil brüt bedeldir: 2.000.000 × %20 = **400.000 TL**, Mart 2026 dönemi 2 No.lu beyanname ile beyan edilir.

    2. Hizmetten Türkiye''deki santralde faydalanılmıştır; ÇVÖA KDV''yi kapsamaz: 500.000 × %20 = **100.000 TL**, Nisan 2026
    dönemi 2 No.lu beyanname ile beyan edilir.

    3. Kâr payı dağıtımı bir teslim veya hizmet değildir; KDV doğmaz (**0 TL**).

    4. Mal ithalinde KDV gümrük idaresince ithal KDV''si olarak alınır (KDVK md. 1/2); 2 No.lu beyannameye konu olmaz (**0
    TL**).


    Toplam sorumlu KDV = **500.000 TL**. KDV Genel Uygulama Tebliği (III/C-1.1) uyarınca 2 No.lu beyanname aynı dönemin 1
    No.lu beyannamesinden önce verilip vergi süresinde ödendiğinden 400.000 TL Mart 2026, 100.000 TL Nisan 2026 dönemi 1 No.lu
    beyannamesinde indirilir.


    **(c) Yevmiye kaydı (1 numaralı işlem)**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 2.000.000 | |

    | 191 İndirilecek KDV | 400.000 | |

    | 360 Ödenecek Vergi ve Fonlar (KV kesintisi) | | 200.000 |

    | 360 Ödenecek Vergi ve Fonlar (sorumlu KDV) | | 400.000 |

    | 102 Bankalar | | 1.800.000 |

    | Toplam | 2.400.000 | 2.400.000 |

    '
