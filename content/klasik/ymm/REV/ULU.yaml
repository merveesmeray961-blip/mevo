  dogrulama:
    python: 'brut1 = 1800000 * 100 / (100 - min(20, 10))

      kes1 = brut1 * 10 / 100

      kes2 = 0

      kes3 = 3000000 * min(15, 5) / 100

      kes4 = 0

      kdv1 = brut1 * 20 / 100

      kdv2 = 500000 * 20 / 100

      sonuc = {''brut1'': brut1, ''kesinti1'': kes1, ''kesinti3'': kes3, ''toplam_kesinti'': kes1 + kes2 + kes3 + kes4, ''kdv1'':
      kdv1, ''kdv2'': kdv2, ''toplam_kdv'': kdv1 + kdv2}'
