  soru: '**Olay:** Kuzey Makine A.Ş. (tam mükellef) 1/9/2025''te Fransa''daki bir SAS''ın sermayesinin %30''unu satın almıştır.
    SAS, 15/3/2026''da dağıttığı kârdan Kuzey Makine''ye 800.000 TL net kâr payı ödemiştir; bu kâr payının dağıtımına kaynak
    olan kazançlar üzerinden Fransa''da ödenen gelir ve kurumlar vergisi benzeri vergilerin kâr payına isabet eden kısmı 200.000
    TL''dir. Net kâr payı Türkiye''ye gelmiş ve ticari kâra dahil edilmiştir. Şirketin 2026 ticari bilanço kârı 5.000.000
    TL (800.000 TL net kâr payı dahil), kanunen kabul edilmeyen giderleri 100.000 TL''dir. Yurt dışında ödenen vergiler yetkili
    makamlardan alınan onaylı belgelerle tevsik edilmiştir. Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) Kâr payının KVK md. 5/1-(b) istisnasından yararlanıp yararlanamayacağını belirtiniz. (4 puan)


    (b) Kâr payının kazanca ilave edilecek tutarını ve kurumlar vergisi matrahını bulunuz. (6 puan)


    (c) Md. 33/3 kapsamında mahsup edilecek vergiyi ve ödenecek kurumlar vergisini hesaplayınız. (8 puan)


    (d) Kuzey Makine''nin SAS''taki payı %20 olsaydı md. 33/3 mahsubu yapılabilir miydi? (6 puan)

    '
  cozum: '**(a)** Md. 5/1-(b)(2) kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz en az bir yıl elde tutulmasını
    arar. Pay 1/9/2025''te alınmış, kâr payı 15/3/2026''da elde edilmiştir (yaklaşık 6,5 ay); süre dolmadığından **istisna
    yoktur**.


    **(b)** Md. 33/3: kazanca ilave edilen kâr payı, bu kazançlar üzerinden yurt dışında ödenen vergiler dahil edilmek suretiyle
    dikkate alınır. Brüt kâr payı = 800.000 + 200.000 = **1.000.000 TL**. Matrah = 5.000.000 + 200.000 (ilave) + 100.000 =
    **5.300.000 TL**; KV = 5.300.000 x %25 = **1.325.000 TL**.


    **(c)** Tam mükellef kurumun doğrudan veya dolaylı olarak sermayesinin veya oy hakkının %25''ine sahip olduğu yurt dışı
    iştirakten elde ettiği kâr payları üzerinden, iştirakin ülkesinde ödenen vergilerin kâr payına isabet eden kısmı mahsup
    edilebilir (%30 >= %25). Mahsup sınırı: 1.000.000 x %25 = 250.000 TL (md. 33/4). Yurt dışı vergi 200.000 TL bu sınırın
    altında olduğundan mahsup **200.000 TL**; ödenecek KV = 1.325.000 - 200.000 = **1.125.000 TL**.


    **(d)** Pay oranı %20 olursa %25 şartı sağlanmaz; md. 33/3 uyarınca dolaylı mahsup yapılamaz. Mahsup hakkı doğmadığından
    yurt dışında ödenen 200.000 TL vergi kazanca ilave edilmez (brütleştirme yapılmaz): matrah = 5.300.000 - 200.000 = 5.100.000
    TL; ödenecek KV = 5.100.000 x %25 = 1.275.000 TL olur (yurt dışında ödenen vergi mahsup edilemez).


    Püf noktaları: (1) Dolaylı mahsup için en az %25 pay veya oy hakkı gerekir. (2) Kâr payı, yurt dışında ödenen vergi eklenerek
    brütleştirilir. (3) Mahsup, brüt kâr payına %25 uygulanarak bulunan tutarı aşamaz.

    '
