- id: YMM-REV-VIN-K002
  sinav: ymm
  ders: REV
  konu: VIN
  kazanimlar:
  - muhteviyatı itibariyle yanıltıcı belge ve vergi ziyaı cezasının hesabı
  - VUK 359 kapsamındaki fiiller ile hata sonucu eksik beyanın ayrımı
  - defter ve belgelerin ibrazı
  - vergi incelemesinin süresi ve tarh zamanaşımı
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Olay**


    Hesap dönemi takvim yılı olan tam mükellef **Boğaziçi Boya A.Ş.** nezdinde, Vergi Müfettişi tarafından **15.3.2026** tarihinde
    2021 hesap dönemine ilişkin **tam inceleme** başlatılmış ve inceleme konusu ile başlandığı kendisine yazıyla bildirilmiştir.
    İnceleme sırasında şu tespitler yapılmıştır (kurumlar vergisi oranı %25''tir; vergi alacağının ilgili hesap döneminin
    ait olduğu takvim yılında doğduğu varsayılacaktır; tüm tutarlar kurum kazancından indirilmiş ve vergi ziyaına yol açmıştır;
    ceza hesabında yalnızca VUK md. 344 esas alınacak, indirim, tekerrür, faiz ve zam dikkate alınmayacaktır):


    1. Şirket, (S) Ltd. Şti.''nden gerçekten mal almış, ancak 500.000 TL olan gerçek bedel yerine fatura **800.000 TL** olarak
    düzenlenmiş ve şirket bu faturayı kullanmıştır. Fark tutar gider yazılmıştır.

    2. Şirket, 2021 dönemine ait yevmiye defterinde toplam **100.000 TL** tutarındaki bir gider toplamını hesap hatası sonucu
    fazla yazmıştır; fiilin hata dışında bir kasıt unsuru yoktur ve 359. maddede yazılı fiillerden birini oluşturmamaktadır.

    3. Müfettiş, 2021 yılına ait defter ve belgelerin 20.3.2026''da yazıyla istenmesine rağmen şirket yetkilisi belirtilen
    zamanda herhangi bir mazeret göstermeden bu defter ve belgeleri getirmemiştir.

    4. 2020 hesap dönemine ilişkin olarak da inceleme yapılması gündeme gelmiştir.


    **İstenenler**


    (a) 1 numaralı tespit bakımından kullanılan belgenin niteliğini, ziyaa uğratılan vergiyi ve kesilecek vergi ziyaı cezasını
    hesaplayınız; ayrıca fiilin ceza hukuku bakımından yaptırımını belirtiniz. (7 puan)


    (b) 2 numaralı tespit için ziyaa uğratılan vergiyi ve vergi ziyaı cezasını hesaplayınız; 1 numaralı tespitle neden farklı
    ceza uygulandığını açıklayınız. (5 puan)


    (c) 3 numaralı olay bakımından VUK md. 139 hükmünü değerlendiriniz; incelemenin dairede yapılması ile işyerinde tespit
    yapılması arasındaki ilişkiyi belirtiniz. (4 puan)


    (d) Tam incelemenin başlangıç tarihine göre incelemenin bitirilmesinde esas alınan süreyi ve ek süre verilmesi hâlinde
    ulaşılabilecek en uzak tarihi belirleyiniz; 4 numaralı olayda 2020 dönemi için inceleme yapılıp yapılamayacağını tarh
    zamanaşımı açısından değerlendiriniz. (6 puan)

    '
  cozum: "**(a) Muhteviyatı itibariyle yanıltıcı belge (VUK md. 359/a-2, md. 344/1-2)**\n\nGerçek bir muameleye dayanmakla\
    \ birlikte bu muameleyi miktar itibariyle gerçeğe aykırı yansıtan belge, VUK md. 359/a uyarınca **muhteviyatı itibariyle\
    \ yanıltıcı belgedir.** Belgeyi kullanan mükellef 359. maddedeki fiili işlemiş olur.\n\n| Kalem | Hesap | Tutar (TL) |\n\
    |---|---|---|\n| Fatura bedeli | | 800.000 |\n| Gerçek bedel | | 500.000 |\n| Fazla gider (matrah farkı) | 800.000 - 500.000\
    \ | 300.000 |\n| Ziyaa uğratılan kurumlar vergisi | 300.000 x %25 | **75.000** |\n| Vergi ziyaı cezası (3 kat) | 75.000\
    \ x 3 | **225.000** |\n\nVergi ziyaına 359. maddede yazılı fiillerle sebebiyet verildiğinden ceza **üç kat** uygulanır\
    \ (md. 344/2); bu fiillere iştirak edenlere (belgeyi düzenleyen) **bir kat** ceza kesilir. Ayrıca belgeyi kullanan hakkında\
    \ md. 359/a uyarınca **on sekiz aydan beş yıla kadar hapis cezası** öngörülmüştür.\n\n**(b) Hata sonucu eksik beyan (md.\
    \ 344/1)**\n\n- Ziyaa uğratılan vergi = 100.000 x %25 = **25.000 TL**\n- Vergi ziyaı cezası = 25.000 x 1 = **25.000 TL**\
    \ (bir kat)\n\nHesap hatası 359. maddedeki kasıtlı fiillerden biri olmadığından ceza üç kat değil **bir kat** uygulanır;\
    \ 359. madde kapsamında hapis cezası da söz konusu değildir.\n\nToplam ziyaa uğratılan vergi = 75.000 + 25.000 = **100.000\
    \ TL**; toplam ceza = 225.000 + 25.000 = **250.000 TL**.\n\n**(c) Defter ve belgelerin ibrazı (md. 139)**\n\nVergi incelemeleri\
    \ esas itibariyle dairede yapılır; incelemeye tabi olandan lüzumlu defter ve vesikalarını ibraz etmesi **yazılı olarak**\
    \ istenir. İstenilen defter veya vesikaları belli edilen zamanda **mazeretsiz olarak** getirmeyenler bunları **ibraz etmemiş\
    \ sayılırlar.** Haklı mazeret gösterenlere münasip mühlet verilir. Olayda 20.3.2026'da yazıyla istenen defter ve belgeler\
    \ mazeretsiz getirilmediğinden **ibraz edilmemiş sayılır.** İncelemenin dairede yapılması, incelemeye tabi olanın işyerinde\
    \ tespit yapılmasına ve çalışmalarda bulunulmasına mani değildir; mükellefin talebi ve işyerinin müsait olması halinde\
    \ inceleme işyerinde de yapılabilir. Defter ve belgelerin varlığı noter tasdik kayıtlarıyla sabit olduğu halde inceleme\
    \ sırasında ibraz edilmemesi md. 359/a uyarınca **gizleme** sayılır.\n\n**(d) İnceleme süresi ve zamanaşımı (md. 140/6,\
    \ md. 138, md. 114)**\n\n- Tam incelemede inceleme, başlandığı tarihten itibaren **en fazla bir yıl** içinde bitirilmesi\
    \ esastır: 15.3.2026 + 1 yıl = **15.3.2027**.\n- Süre içinde bitirilemezse ek süre talep edilebilir; tam incelemede ek\
    \ süre **altı ayı geçemez.** En uzak tarih: 15.3.2027 + 6 ay = **15.9.2027**.\n- Tarh zamanaşımı (soruda vergi alacağının\
    \ hesap döneminin yılında doğduğu varsayılmıştır): vergi alacağının doğduğu takvim yılını takip eden yılın başından başlayarak\
    \ **beş yıl** içinde tarh ve tebliğ edilmeyen vergiler zamanaşımına uğrar (md. 114). İnceleme, tarh zamanaşımı süresi\
    \ sonuna kadar her zaman yapılabilir (md. 138).\n  - 2021 dönemi: süre 1.1.2022'de başlar ve **31.12.2026**'da dolar;\
    \ 15.3.2026'da başlayan inceleme süre içindedir, ancak tarh ve tebliğin 31.12.2026'ya kadar tamamlanması gerekir.\n  -\
    \ 2020 dönemi: süre 1.1.2021'de başlamış ve **31.12.2025**'te dolmuştur; vergi zamanaşımına uğradığından 2020 dönemi için\
    \ tarhiyat yapılamaz.\n"
