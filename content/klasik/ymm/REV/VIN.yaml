- id: YMM-REV-VIN-K001
  sinav: ymm
  ders: REV
  konu: VIN
  kazanimlar:
  - sahte ve muhteviyatı itibarıyla yanıltıcı belge
  - vergi ziyaı ve usulsüzlük
  - VUK md.134-141 vergi incelemesi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(P) A.Ş.** nezdinde 2026 yılında 2025 hesap dönemine ilişkin tam inceleme yapılmıştır. İnceleme sonucunda aşağıdaki
    tespitler yapılmıştır:


    1. Şirket, (R) Ltd. Şti.''nin düzenlediği toplam 1.500.000 TL + 300.000 TL KDV tutarlı faturaları kayıtlarına almıştır.
    Faturalardaki bedeli satılan ticari mal maliyeti yoluyla gider yazmış, KDV''yi de ilgili dönemlerde indirim konusu yapmıştır.
    (R) Ltd. Şti. hakkında sahte belge düzenleme raporu bulunmaktadır. Yapılan karşıt inceleme, nakliye ve ödeme araştırmalarında,
    faturalarda yazılı malların şirkete hiç teslim edilmediği ve bedelin ödenmediği tespit edilmiştir.


    2. Şirket, (S) A.Ş.''ye 2025 yılında gerçekten yaptığı ve bedelini tam olarak tahsil ettiği 2.000.000 TL''lik (KDV hariç)
    mal satışını, düzenlediği faturada 1.200.000 TL olarak göstermiştir. Aradaki 800.000 TL''yi ve buna ait KDV''yi kayıtlarına
    almamıştır.


    Ek bilgiler:

    - Kurumlar vergisi oranı %25, KDV oranı %20''dir.

    - İlgili KDV dönemlerinin tamamında ödenecek KDV çıkmıştır; devreden KDV yoktur. 2025 yılı kurum kazancı pozitiftir; geçmiş
    yıl zararı, istisna ve asgari kurumlar vergisi etkisi yoktur.

    - Şirket bu fiillere ilişkin pişmanlık ve uzlaşma hükümlerinden yararlanmamıştır. Gecikme faizi ve gecikme zammı hesaplanmayacaktır.


    **İstenenler:**


    **(a)** 1 ve 2 numaralı tespitlerdeki belgeleri VUK md. 359''daki tanımlara göre nitelendiriniz. Şirket yetkilileri bakımından
    fiillerin hangi bentlere girdiğini ve öngörülen hapis cezası aralıklarını belirtiniz. *(6 puan)*


    **(b)** Her bir tespit için ziyaa uğratılan kurumlar vergisi ve KDV tutarlarını hesaplayınız. *(6 puan)*


    **(c)** VUK md. 344''e göre kesilecek vergi ziyaı cezalarını vergi türü itibarıyla ve toplam olarak hesaplayınız. *(6
    puan)*


    **(d)** VUK md. 359''a 2022 yılında eklenen etkin pişmanlık niteliğindeki indirim hükmüne göre şirket yetkililerinin hapis
    cezasında indirimden yararlanabilmeleri için nelerin, hangi evrede ödenmesi gerektiğini ve sağlanacak indirim oranlarını
    açıklayınız. Ödenmesi gereken asgari vergi ziyaı cezası tutarını hesaplayınız. *(7 puan)*

    '
  cozum: '**(a) Belgelerin nitelendirilmesi ve fiiller**


    - **1 numaralı tespit:** Gerçek bir mal teslimi olmadığı hâlde düzenlenmiş belgeler **sahte belgedir** (VUK md. 359/b
    son cümle). Şirket bu belgeleri kayıtlarına alıp indirim ve gider konusu yaptığından fiil "sahte belge kullanma"dır. VUK
    md. 359/b uyarınca **üç yıldan sekiz yıla kadar** hapis cezası öngörülür.

    - **2 numaralı tespit:** Gerçek bir satış vardır, ancak belge işlemi miktar/tutar itibarıyla gerçeğe aykırı yansıtmaktadır.
    Bu belge **muhteviyatı itibarıyla yanıltıcı belgedir** (md. 359/a son cümle). Şirket belgeyi düzenleyen taraftır; fiil
    md. 359/a-2 kapsamındadır ve **on sekiz aydan beş yıla kadar** hapis cezası öngörülür. Ayrıca hasılatın bir kısmının kayıt
    dışı bırakılması md. 359/a-1''deki hesap hilesi niteliği de taşır; ceza aralığı aynıdır.


    **(b) Ziyaa uğratılan vergiler**


    | Tespit | Matrah farkı (TL) | Kurumlar vergisi (%25) | KDV (%20) |

    |---|---|---|---|

    | 1 – Sahte belge (gider ve indirim reddi) | 1.500.000 | 375.000 | 300.000 |

    | 2 – Yanıltıcı belge (eksik hasılat) | 800.000 | 200.000 | 160.000 |

    | **Toplam** | | **575.000** | **460.000** |


    1 numaralı tespitte KDV farkı, indirilen 300.000 TL''lik KDV''nin reddinden doğar. 2 numaralı tespitte KDV farkı, eksik
    gösterilen 800.000 TL üzerinden hesaplanan KDV''dir.


    **(c) Vergi ziyaı cezaları**


    Her iki tespitte de vergi ziyaına VUK md. 359''da yazılı fiillerle sebebiyet verildiğinden ceza **üç kat** uygulanır (md.
    344/2).


    - Kurumlar vergisi: 575.000 × 3 = **1.725.000 TL**

    - KDV: 460.000 × 3 = **1.380.000 TL**

    - **Toplam: 3.105.000 TL**


    **(d) Md. 359''daki indirim hükmü**


    Bu maddedeki fiillerle verginin ziyaa uğratıldığının tespitine bağlı olarak tarh edilen verginin, gecikme faizi ve gecikme
    zammının **tamamı** ile kesilen cezaların **yarısı** ve buna isabet eden gecikme zammı ödenmelidir.


    - Ödeme **soruşturma evresinde** yapılırsa verilecek hapis cezası **yarı oranında** indirilir.

    - Ödeme **kovuşturma evresinde, hüküm verilinceye kadar** yapılırsa ceza **üçte bir oranında** indirilir.

    - Tarh edilen vergi ve vergi aslına bağlı ceza bulunmayan durumlarda verilecek ceza yarı oranında indirilir. Olayda vergi
    aslı bulunduğundan bu fıkra uygulanmaz.


    Ödenmesi gereken asgari vergi ziyaı cezası: 3.105.000 / 2 = **1.552.500 TL** (buna isabet eden gecikme zammıyla birlikte).
    Ayrıca 1.035.000 TL''lik vergi aslının (575.000 + 460.000) tamamı ödenmelidir.

    '
  puanlama:
  - olcut: (a) 1 numaralı belgenin sahte, 2 numaralı belgenin muhteviyatı itibarıyla yanıltıcı olarak gerekçesiyle nitelendirilmesi
