    puan: 3
  - olcut: (c) Üç kat uygulamasının md. 344/2 dayanağıyla gerekçelendirilmesi
    puan: 2
  - olcut: (c) KV (1.725.000), KDV (1.380.000) ve toplam (3.105.000) cezaların hesaplanması
    puan: 4
  - olcut: (d) Ödenmesi gereken unsurların (vergi, gecikme faizi ve zammının tamamı; cezaların yarısı ve gecikme zammı) sayılması
    puan: 3
  - olcut: (d) Soruşturma evresinde yarı, kovuşturma evresinde hüküm verilinceye kadar üçte bir indirim oranlarının belirtilmesi
    puan: 2
  - olcut: (d) Ödenmesi gereken asgari ceza tutarının (1.552.500 TL) hesaplanması
    puan: 2
