  dogrulama:
    python: 'kv1 = 1500000 * 0.25

      kdv1 = 300000

      kv2 = 800000 * 0.25

      kdv2 = 800000 * 0.20

      kv = kv1 + kv2

      kdv = kdv1 + kdv2

      vzc_kv = kv * 3

      vzc_kdv = kdv * 3

      sonuc = {"kv_fark": kv, "kdv_fark": kdv, "vzc_kv": vzc_kv, "vzc_kdv": vzc_kdv, "vzc_toplam": vzc_kv + vzc_kdv, "odenecek_asgari_ceza":
      (vzc_kv + vzc_kdv) / 2, "vergi_asli": kv + kdv}

      '
