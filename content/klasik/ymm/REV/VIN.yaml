      gecikme faizi ve gecikme zammının tamamı ile kesilen cezaların yarısı ve buna isabet eden gecikme zammının; soruşturma
      evresinde ödenmesi halinde verilecek ceza yarı oranında, kovuşturma evresinde hüküm verilinceye kadar ödenmesi halinde
