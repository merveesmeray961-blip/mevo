      aykırı şekilde yansıtan belge ise, muhteviyatı itibariyle yanıltıcı belgedir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359 (7394 ile eklenen fıkra)
    alinti: Bu maddede yazılı fiillerle verginin ziyaa uğratıldığının tespit edilmesine bağlı olarak tarh edilen verginin,
      gecikme faizi ve gecikme zammının tamamı ile kesilen cezaların yarısı ve buna isabet eden gecikme zammının; soruşturma
      evresinde ödenmesi halinde verilecek ceza yarı oranında, kovuşturma evresinde hüküm verilinceye kadar ödenmesi halinde
      ise verilecek ceza üçte bir oranında indirilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/2
    alinti: Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak
      edenlere ise bir kat olarak uygulanır.
