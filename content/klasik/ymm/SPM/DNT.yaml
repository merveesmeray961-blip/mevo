- id: YMM-SPM-DNT-K003
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar:
  - değerleme kuruluşları
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Nehir Gayrimenkul Yatırım Ortaklığı A.Ş.** (Nehir GYO) 2026 yılında aşağıdaki işlemleri yapmayı planlamaktadır.\n\
    Tüm gayrimenkuller Türkiye'dedir.\n\n1. Ekspertiz değeri 50.000.000 TL olan bir ofis binasının ilişkili olmayan bir kişiden\
    \ 52.000.000 TL'ye satın alınması.\n2. Ekspertiz değeri 80.000.000 TL olan bir alışveriş merkezinin 75.000.000 TL'ye satılması.\n\
    3. Rayiç yıllık kira değeri 4.000.000 TL olarak tespit edilen bir deponun yıllık 3.900.000 TL'ye kiraya verilmesi.\n4.\
    \ (X) Değerleme A.Ş., Nehir GYO'nun bir gayrimenkulünün değerlemesini 2024, 2025 ve 2026 yıllarında üst üste\n   yapmıştır;\
    \ yönetim 2027 yılı değerlemesini de (X)'e yaptırmak istemektedir.\n5. Bir değerleme raporunda değerleme çalışması 3 Kasım\
    \ 2026 (Salı) günü tamamlanmış, rapor tarihi 12 Kasım 2026\n   olarak belirlenmiş; rapor Nehir GYO'ya 17 Kasım 2026'da\
    \ teslim edilmiştir.\n6. 2026 yılı değerleme kuruluşu, yönetim kurulu kararıyla 20 Mart 2026'da belirlenmiştir.\n\nBu\
    \ soruda resmî tatil olarak yalnız hafta sonları dikkate alınacaktır.\n\n**İstenenler** (GYO Tebliği III-48.1 ve SPKn\
    \ çerçevesinde):\n\n(a) 1, 2 ve 3 numaralı işlemlerde ekspertiz değeriyle karşılaştırmayı yaparak doğacak yükümlülükleri\
    \ belirleyiniz.\n(9 puan)\n\n(b) 4 numaralı durumu değerlendiriniz; (X)'in aynı gayrimenkul için en erken hangi yıl yeniden\
    \ görevlendirilebileceğini\nbelirtiniz. (5 puan)\n\n(c) 5 ve 6 numaralı durumları sürelere uyum yönünden değerlendiriniz.\
    \ (7 puan)\n\n(d) Gayrimenkul değerleme uzmanlarının ve değerleme kuruluşlarının meslek birliği üyeliği yükümlülüğünü\
    \ ve\ndeğerleme kuruluşlarının sorumluluğunu açıklayınız. (4 puan)\n"
  cozum: "**(a) Ekspertiz değeriyle karşılaştırma (md. 37/1)**\n\nAlımda ekspertiz değerinin **üstünde**, satış ve kiralamada\
    \ ekspertiz değerinin **%95'inden düşük** bir değerin esas\nalınması hâlinde durum **kamuya açıklanır** ve **ilk genel\
    \ kurulda** ortakların bilgisine sunulur. Bu işlemler yasak\ndeğildir.\n\n| No | Karşılaştırma | Sonuç |\n|---|---|---|\n\
    | 1 | Alım bedeli 52.000.000 > ekspertiz 50.000.000 | Ekspertizin üstünde alım → **KAP açıklaması ve genel kurula bilgi**\
    \ |\n| 2 | Alt eşik 80.000.000 × %95 = 76.000.000; satış 75.000.000 (%93,75) | Eşiğin altında → **KAP açıklaması ve genel\
    \ kurula bilgi** |\n| 3 | Alt eşik 4.000.000 × %95 = 3.800.000; kira 3.900.000 (%97,5) | Eşiğin üstünde → ek yükümlülük\
    \ **yok** |\n\n**(b) Rotasyon (md. 35/3)**\n\nAynı varlık için aynı değerleme kuruluşundan üst üste **en fazla üç yıl**\
    \ hizmet alınabilir; aynı kuruluştan yeniden\nhizmet alınabilmesi için **en az iki yıl** geçmesi gerekir. (X) 2024–2026'da\
    \ üç yıl hizmet verdiğinden 2027'de\ngörevlendirilemez; 2027 ve 2028'de ara verildikten sonra en erken **2029** yılında\
    \ yeniden görevlendirilebilir.\n\n**(c) Süreler**\n\n- **Rapor süreleri (md. 34/6):** Değerleme çalışmasının bitiş tarihi\
    \ ile rapor tarihi arası **beş iş gününü** aşamaz;\n  rapor, rapor tarihini takip eden **iki iş günü** içinde ortaklığa\
    \ teslim edilir. 3 Kasım'dan sonraki beşinci iş günü\n  **10 Kasım**'dır; rapor tarihi 12 Kasım (yedinci iş günü) olduğundan\
    \ süre **aşılmıştır**. Rapor tarihi 12 Kasım'ı\n  izleyen ikinci iş günü **16 Kasım**'dır; 17 Kasım'daki teslim de **geç**\
    \ kalmıştır.\n- **Değerleme kuruluşunun belirlenmesi (md. 35/1-2):** Kurulca listeye alınmış ve bağımsız değerleme kuruluşu,\
    \ hesap\n  döneminin bitimini takip eden **bir ay** içinde (31 Ocak 2026'ya kadar) yönetim kurulu kararıyla belirlenmelidir;\n\
    \  20 Mart'taki karar **süre dışındadır**.\n\n**(d) Meslek birliği ve sorumluluk**\n\nGayrimenkul değerleme uzmanlığı\
    \ lisansı sahipleri ile değerleme kuruluşları **Türkiye Değerleme Uzmanları Birliğine**\nüyelik başvurusu yapmak zorundadır;\
    \ lisans sahibi hak kazandığı tarihten itibaren **üç ay** içinde başvurmazsa lisansı\niptal edilir, değerleme kuruluşu\
    \ da nitelik kazandığı andan itibaren üç ay içinde başvurur (SPKn md. 76). Değerleme\nkuruluşları düzenledikleri raporlardaki\
    \ yanlış, yanıltıcı ve eksik bilgiler nedeniyle neden oldukları zararlardan\nsorumludur (md. 63).\n"
