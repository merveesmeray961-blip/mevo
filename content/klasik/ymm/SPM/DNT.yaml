- id: YMM-SPM-DNT-K002
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar:
  - SPK finansal raporlama yükümlülükleri
  - bağımsız denetim kuruluşları
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "Payları borsada işlem gören **Selin Otomotiv A.Ş.** (Selin) konsolide finansal tablo hazırlamakla yükümlüdür;\nhesap\
    \ dönemi takvim yılıdır. 2025 yılı olağan genel kurul toplantısının 20 Mart 2026'da yapılması planlanmaktadır.\n\n1. Yönetim\
    \ kurulu, 2025 yılı finansal tablolarının kabulüne ilişkin ayrı bir karar almadan tabloları bağımsız\n   denetim kuruluşuna\
    \ göndermiştir; tablolar için gerçeğe uygunluk beyanı yalnız muhasebe müdürü tarafından\n   imzalanmıştır.\n2. Selin'in\
    \ %100 bağlı ortaklığı **(S) Yatırım Menkul Değerler A.Ş.**'nin bağımsız denetimini yapan **(E) Bağımsız\n   Denetim A.Ş.**,\
    \ denetim sırasında (S)'nin sermaye yeterliliği yükümlülüğünü sağlayamadığını ve faaliyetin\n   sürekliliğini tehdit eden\
    \ ciddi bir durum bulunduğunu tespit etmiştir. (S)'nin yönetimi, durumun sır saklama\n   yükümlülüğü nedeniyle Kurula\
    \ bildirilmemesini istemektedir.\n3. Selin, 2026 yılı içinde borçlanma aracı ve pay ihracı için ayrı ayrı izahname hazırlayacaktır.\n\
    \n**İstenenler:**\n\n(a) Selin'in 2025 yıllık finansal raporunu ve bağımsız denetim raporunu KAP'ta bildirmesi gereken\
    \ son günü\ngerekçesiyle hesaplayınız; Selin konsolide tablo hazırlamakla yükümlü olmasaydı sonucun ne olacağını belirtiniz.\n\
    (8 puan)\n\n(b) 1 numaralı durumu SPKn md. 14 çerçevesinde değerlendiriniz; tabloların gerçeğe uygunluğundan kimlerin\
    \ sorumlu\nolduğunu açıklayınız. (6 puan)\n\n(c) 2 numaralı durumda (E)'nin yükümlülüğünü ve bildirimin sır saklama yükümlülüğü\
    \ karşısındaki durumunu\naçıklayınız; bağımsız denetim kuruluşlarının sorumluluğunu belirtiniz. (6 puan)\n\n(d) İki izahnamede\
    \ yer alması gereken finansal tabloların dönemlerini belirtiniz. (5 puan)\n"
  cozum: '**(a) Bildirim süresi**


    Araçları borsada işlem gören işletmeler yıllık finansal raporlarını ve bağımsız denetim raporlarını, konsolide tablo

    yükümlülüğü varsa hesap dönemi bitiminden itibaren **70 gün**, yoksa **60 gün** içinde KAP''ta bildirir. Halka açık

    ortaklıklar ayrıca bu raporları **genel kuruldan en az üç hafta önce** bildirir; her hâlde son süre dönem bitimini

    izleyen üçüncü ayın sonudur (Tebliğ II-14.1 md. 10).


    - 70 günlük süre: 31 Aralık 2025''ten itibaren 70. gün **11 Mart 2026**.

    - Genel kuruldan üç hafta önce: 20 Mart 2026 − 21 gün = **27 Şubat 2026**.

    - Daha erken olan tarih bağlayıcıdır → son gün **27 Şubat 2026**.


    Konsolide yükümlülük olmasaydı 60. gün **1 Mart 2026** olurdu; genel kurula göre süre (27 Şubat) yine daha erken

    olduğundan son gün değişmezdi.


    **(b) Yönetim kurulu kararı ve sorumluluk**


    Yönetim kurulu, finansal tablo ve raporların kabulüne ilişkin **ayrı bir karar** almak zorundadır; tabloları hazırlamakla

    görevli yöneticiler ile tabloların hazırlanmasından sorumlu yönetim kurulu üyeleri **gerçeğe uygunluk beyanı** verir

    (SPKn md. 14/2). Ayrı karar alınmaması ve beyanın yalnız muhasebe müdürünce imzalanması **aykırıdır**. Tabloların

    düzenlemelere uygunluğundan, gerçeğe uygunluğundan ve doğruluğundan **ihraççı** ile kusurlarına ve durumun gereklerine

    göre **yönetim kurulu üyeleri** sorumludur.


    **(c) Bağımsız denetçinin bildirimi**


    Yatırım kuruluşunun denetiminde bağımsız denetim kuruluşu; yetkilendirme şartlarının ihlalini, **faaliyetin

    sürekliliğini engelleyebilecek** durumları ve olumsuz görüş ya da görüş bildirmekten kaçınmayı gerektiren her durumu

    Kurula **derhâl bildirir** (SPKn md. 64/1). Bu bildirim **sır saklama yükümlülüğünün ihlali sayılmaz** ve hukuki veya

    cezai sorumluluk doğurmaz (md. 64/2); (S)''nin talebi dikkate alınamaz. Bağımsız denetim kuruluşları, görev kapsamıyla

    sınırlı olarak tabloların mevzuata uygun denetlenmemesinden doğan zararlardan raporu imzalayanlarla birlikte

    sorumludur (md. 63).


    **(d) İzahnamedeki tablolar**


    Ortaklık hakkı veren araçların (pay) izahnamesinde **son üç yıla**, ortaklık hakkı vermeyen araçların (borçlanma aracı)

    izahnamesinde **son iki yıla** ve varsa ara döneme ait bağımsız denetimden ve/veya sınırlı incelemeden geçmiş finansal

    tablolar yer alır (Tebliğ II-5.1 md. 10/1). Denetlenmiş tablolar KAP''ta düzenli yayımlanıyorsa izahnamede tablolara yer

    verilmeyip ilan bilgisi verilebilir (md. 10/2).

    '
  puanlama:
  - olcut: (a) 70/60 gün ve üç hafta kuralı
    puan: 3
  - olcut: (a) 11 Mart ve 27 Şubat tarihleri ile son günün 27 Şubat 2026 olması
    puan: 3
  - olcut: (a) Konsolide olmasaydı 1 Mart ve sonucun değişmemesi
    puan: 2
  - olcut: (b) Ayrı kabul kararı ve gerçeğe uygunluk beyanı yükümlülüğü
    puan: 3
  - olcut: (b) İhraççı ve yönetim kurulu üyelerinin sorumluluğu
    puan: 3
  - olcut: (c) Md. 64 bildirim yükümlülüğü ve sır saklama ihlali sayılmaması
    puan: 4
  - olcut: (c) Bağımsız denetim kuruluşunun sorumluluğu (md. 63)
    puan: 2
  - olcut: (d) Pay için üç yıl, borçlanma aracı için iki yıl
    puan: 5
  kaynaklar:
  - mevzuat: Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği (II-14.1)
    madde: md. 10
    alinti: Konsolide finansal tablo hazırlama yükümlülüğünün bulunmadığı durumlarda, hesap dönemlerinin bitimini izleyen
      60 gün,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 14, 63, 64
    alinti: her türlü durumu Kurula derhâl bildirmekle yükümlüdür.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'import datetime as dt

      d70 = dt.date(2025, 12, 31) + dt.timedelta(70)

      d60 = dt.date(2025, 12, 31) + dt.timedelta(60)

      gk = dt.date(2026, 3, 20) - dt.timedelta(21)

      sonuc = {"d70": d70.day, "d60": d60.day, "gk": gk.day}

      '
