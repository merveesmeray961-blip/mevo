- id: YMM-SPM-DNT-K001
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar:
  - SPK finansal raporlama yükümlülükleri
  - bağımsız denetim kuruluşları
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Payları Borsa İstanbul''da işlem gören **Delta Enerji A.Ş.**''nin (Delta) hesap dönemi takvim yılıdır. Delta konsolide
    finansal tablo düzenlemekle yükümlüdür. 2026 yılına ilişkin bilgiler şöyledir:


    1. Yönetim kurulu 9 üyeden oluşmakta olup 3''ü bağımsız üyedir. Denetimden sorumlu komite iki üyelidir: başkan bağımsız
    üye (B1), diğer üye icrada görevli olmayan ancak bağımsız olmayan bir üyedir (N1). Komite 2026''da Şubat, Haziran ve Kasım
    aylarında olmak üzere üç kez toplanmıştır. Hizmet alınacak bağımsız denetim kuruluşu, komitenin değerlendirmesi alınmaksızın
    genel müdürün önerisiyle doğrudan yönetim kurulunca belirlenmiştir.

    2. Delta, payları borsada işlem gören ve bağlı ortaklığı bulunmayan **Epsilon Enerji A.Ş.**''yi (Epsilon) devralma yoluyla
    birleşmeyi planlamaktadır. Birleşmeyi onaylayacak genel kurulun **14 Ekim 2026**''da yapılması öngörülmektedir. Taraflar
    için mevcut finansal tablolar:


    | Tablo tarihi | Kapsadığı dönem | Denetim durumu |

    |---|---|---|

    | 31.12.2025 | 12 ay (yıllık) | Kurul düzenlemelerine göre bağımsız denetimden geçmiş |

    | 31.03.2026 | 3 ay | Bağımsız denetimden veya sınırlı incelemeden geçmemiş |

    | 30.06.2026 | 6 ay | Bağımsız denetimden veya sınırlı incelemeden geçmemiş |


    3. Epsilon''un birleşmeye esas alınacak tablolarına ilişkin bağımsız denetim raporunda, değişim oranını etkileyen bir
    stok değerleme farkı nedeniyle **şartlı görüş** bildirilmiştir.

    4. Delta''nın 2026 yılı ara dönem finansal tabloları, genel müdürün onayıyla kamuya açıklanmış; tabloların kabulüne ilişkin
    ayrı bir yönetim kurulu kararı alınmamış ve kamuya yapılan bildirimde gerçeğe uygunluk beyanına yer verilmemiştir.


    **İstenenler:**


    (a) Denetimden sorumlu komitenin yapısını ve işleyişini Kurumsal Yönetim İlkeleri (4.5.3, 4.5.4, 4.5.9) çerçevesinde değerlendiriniz.
    (8 puan)


    (b) 14 Ekim 2026 tarihli genel kurul için birleşmeye esas alınabilecek finansal tabloları belirleyiniz; her tablonun uygun
    olup olmadığını gerekçelendiriniz, taraflar için konsolide/solo ayrımını ve denetim şartını açıklayınız. (8 puan)


    (c) Epsilon''un raporundaki şartlı görüşün birleşme sürecine etkisini açıklayınız; raporda olumsuz görüş bildirilmiş olsaydı
    sonucun ne olacağını belirtiniz. (5 puan)


    (d) 4 numaralı bilgiyi 6362 sayılı Kanun''un 14 üncü maddesi bakımından değerlendiriniz. (4 puan)'
  cozum: "**(a) Denetimden sorumlu komite**\n\n- Üye sayısı: Komitelerin en az iki üyeden oluşması gerekir (4.5.3) → iki üye:\
    \ **uygun**.\n- Üyelerin niteliği: Denetimden sorumlu komitenin **tüm üyeleri** bağımsız yönetim kurulu üyesi niteliğinde\
    \ olmalıdır (4.5.3). N1 bağımsız olmadığından **aykırılık** vardır (icrada görevli olmaması yeterli değildir). Başkanın\
    \ bağımsız üye olması uygundur.\n- Genel müdür komitede yer almamaktadır (4.5.4) → uygun.\n- Toplantı sıklığı: En az üç\
    \ ayda bir olmak üzere yılda en az **dört** kez (4.5.9). Üç toplantı ve Şubat–Haziran, Haziran–Kasım arasındaki üç aydan\
    \ uzun aralıklar nedeniyle **aykırılık** vardır.\n- Bağımsız denetim kuruluşunun seçimi: Kuruluş ve alınacak hizmetler\
    \ **komite tarafından belirlenir ve yönetim kurulunun onayına sunulur** (4.5.9). Genel müdürün önerisiyle yönetim kurulunca\
    \ doğrudan belirlenmesi **aykırıdır**; denetim sözleşmesi ve sürecin başlatılması da komitenin gözetiminde yürütülmelidir.\n\
    \n**(b) Birleşmeye esas finansal tablolar (II-23.2 md. 6)**\n\n- Hesap dönemi sonu 31.12.2025 → yıllık tabloların kullanılabileceği\
    \ pencere: 1 Nisan 2026 – 31 Ağustos 2026 (dördüncü ayın başı – sekizinci ayın sonu). Genel kurul 14 Ekim 2026 → pencere\
    \ **dışında**.\n- Bu durumda en az 6 aylık dönemi kapsayan ve tablo tarihi ile genel kurul tarihi arasında 6 aydan fazla\
    \ süre bulunmayan **ara dönem** tabloları esas alınır.\n  - 31.12.2025 yıllık: pencere dışındaki genel kurulda kullanılamaz\
    \ (ayrıca genel kurula 9,5 ay vardır) → **uygun değil**.\n  - 31.03.2026: yalnız 3 aylık dönemi kapsar (ve genel kurula\
    \ 6,5 ay vardır) → **uygun değil**.\n  - 30.06.2026: 6 aylık dönemi kapsar, genel kurula yaklaşık 3,5 ay vardır → **esas\
    \ alınacak tablolar**.\n- Konsolide/solo: Konsolide tablo düzenlemekle yükümlü Delta'nın **konsolide**, bağlı ortaklığı\
    \ olmayan Epsilon'un **solo** tabloları esas alınır (md. 6/2).\n- Denetim şartı: Esas tabloların Kurul düzenlemelerine\
    \ göre hazırlanmış ve **özel bağımsız denetimden** geçirilmiş olması zorunludur; Kurul düzenlemeleri uyarınca bağımsız\
    \ denetimleri yapılmış olsaydı özel bağımsız denetim aranmazdı (md. 6/2). 30.06.2026 tabloları denetimden geçmediğinden\
    \ her iki taraf için özel bağımsız denetim yaptırılmalıdır.\n\n**(c) Şartlı görüşün etkisi (md. 6/3)**\n\n- Değişim oranını\
    \ etkileyen hususlarda şartlı görüş bildirilmişse Epsilon'un finansal tablolarında **gerekli düzeltmeler yapılarak bağımsız\
    \ denetim raporunun yeniden hazırlanması** gerekir; tablolar düzeltilmiş hâliyle işleme esas alınabilir.\n- Olumsuz görüş\
    \ (veya görüş bildirmekten kaçınma) hâlinde bu tablolar birleşme işlemine **esas alınamaz**.\n\n**(d) SPKn md. 14**\n\n\
    - Yönetim kurulunun Kurul düzenlemelerine göre hazırlanan finansal tablo ve raporların **kabulüne dair ayrı bir karar**\
    \ alması zorunludur; genel müdür onayı bunun yerine geçmez → aykırılık.\n- Kamuya yapılan bildirimlerde, tabloları hazırlayan\
    \ ortaklık yöneticileri ile birlikte sorumlu yönetim kurulu üyelerinin **gerçeğe uygunluk ve doğruluk beyanına** yer verilmesi\
    \ zorunludur → aykırılık.\n- Tabloların düzenlemelere uygun hazırlanmasından ve gerçeğe uygunluğundan ihraççı ile kusurlarına\
    \ ve durumun gereklerine göre yönetim kurulu üyeleri sorumludur."
  puanlama:
  - olcut: (a) Tüm üyelerin bağımsız olması şartı ve N1 nedeniyle aykırılık
    puan: 3
  - olcut: (a) Toplantı sıklığı (üç ayda bir, yılda en az dört) ve aykırılık
    puan: 2
  - olcut: (a) Bağımsız denetim kuruluşunun komitece belirlenip yönetim kurulu onayına sunulması gerektiği
    puan: 3
  - olcut: (b) Genel kurulun 4.–8. ay penceresi dışında kaldığının tespiti ve ara dönem kuralının (≥6 ay kapsam, ≤6 ay süre)
      açıklanması
    puan: 3
  - olcut: (b) Üç tablonun tek tek değerlendirilmesi ve 30.06.2026'nın seçilmesi
    puan: 3
  - olcut: (b) Delta konsolide / Epsilon solo ve özel bağımsız denetim şartı
    puan: 2
  - olcut: (c) Şartlı görüşte düzeltme ve raporun yeniden hazırlanması
    puan: 3
  - olcut: (c) Olumsuz görüşte tabloların esas alınamaması
    puan: 2
  - olcut: (d) Ayrı yönetim kurulu kararı ve gerçeğe uygunluk beyanı yükümlülükleri ile sorumluluk
    puan: 4
  kaynaklar:
  - mevzuat: 'Kurumsal Yönetim Tebliği (II-17.1) — Ek: Kurumsal Yönetim İlkeleri'
    madde: İlke 4.5.3, 4.5.4, 4.5.9
  - mevzuat: Birleşme ve Bölünme Tebliği (II-23.2)
    madde: md. 6/1, 6/2, 6/3
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 14/2
  gecerlilik:
    baslangic: '2014-01-03'
    bitis: null
  dogrulama:
    python: "def ay_farki(y1, a1, g1, y2, a2, g2):\n    return (y2 - y1) * 12 + (a2 - a1) + (g2 - g1) / 30\ngk = (2026, 10,\
      \ 14)\npencere_icinde = (2026, 4, 1) <= gk <= (2026, 8, 31)\naday = {'2025-12-31': (12, ay_farki(2025, 12, 31, *gk)),\
      \ '2026-03-31': (3, ay_farki(2026, 3, 31, *gk)), '2026-06-30': (6, ay_farki(2026, 6, 30, *gk))}\nuygun = [t for t, (kapsam,\
      \ fark) in aday.items() if not pencere_icinde and t != '2025-12-31' and kapsam >= 6 and fark <= 6]\nsonuc = {'pencere_icinde':\
      \ pencere_icinde, 'uygun_tablo': uygun, 'komite_toplanti_eksigi': 4 - 3}"
  durum: kontrolde
