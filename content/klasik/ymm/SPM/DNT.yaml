- id: YMM-SPM-DNT-K003
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar:
  - değerleme kuruluşları
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Nehir Gayrimenkul Yatırım Ortaklığı A.Ş.** (Nehir GYO) 2026 yılında aşağıdaki işlemleri yapmayı planlamaktadır.\n\
    Tüm gayrimenkuller Türkiye'dedir.\n\n1. Ekspertiz değeri 50.000.000 TL olan bir ofis binasının ilişkili olmayan bir kişiden\
    \ 52.000.000 TL'ye satın alınması.\n2. Ekspertiz değeri 80.000.000 TL olan bir alışveriş merkezinin 75.000.000 TL'ye satılması.\n\
    3. Rayiç yıllık kira değeri 4.000.000 TL olarak tespit edilen bir deponun yıllık 3.900.000 TL'ye kiraya verilmesi.\n4.\
    \ (X) Değerleme A.Ş., Nehir GYO'nun bir gayrimenkulünün değerlemesini 2024, 2025 ve 2026 yıllarında üst üste\n   yapmıştır;\
    \ yönetim 2027 yılı değerlemesini de (X)'e yaptırmak istemektedir.\n5. Bir değerleme raporunda değerleme çalışması 3 Kasım\
    \ 2026 (Salı) günü tamamlanmış, rapor tarihi 12 Kasım 2026\n   olarak belirlenmiş; rapor Nehir GYO'ya 17 Kasım 2026'da\
    \ teslim edilmiştir.\n6. 2026 yılı değerleme kuruluşu, yönetim kurulu kararıyla 20 Mart 2026'da belirlenmiştir.\n\nBu\
    \ soruda resmî tatil olarak yalnız hafta sonları dikkate alınacaktır.\n\n**İstenenler** (GYO Tebliği III-48.1 ve SPKn\
    \ çerçevesinde):\n\n(a) 1, 2 ve 3 numaralı işlemlerde ekspertiz değeriyle karşılaştırmayı yaparak doğacak yükümlülükleri\
    \ belirleyiniz.\n(9 puan)\n\n(b) 4 numaralı durumu değerlendiriniz; (X)'in aynı gayrimenkul için en erken hangi yıl yeniden\
    \ görevlendirilebileceğini\nbelirtiniz. (5 puan)\n\n(c) 5 ve 6 numaralı durumları sürelere uyum yönünden değerlendiriniz.\
    \ (7 puan)\n\n(d) Gayrimenkul değerleme uzmanlarının ve değerleme kuruluşlarının meslek birliği üyeliği yükümlülüğünü\
    \ ve\ndeğerleme kuruluşlarının sorumluluğunu açıklayınız. (4 puan)\n"
