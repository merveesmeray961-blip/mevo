    | Sermayenin **ve** oy haklarının en az %51''inin sorumlu ortak baş denetçilere ait olması (c) | Sermaye %48, oy hakkı
    %60 | **Sağlanmıyor**: oy hakkı oranı yeterli olsa da sermaye payı %51''in altındadır; iki ölçüt birlikte aranır |

    | Mesleki sorumluluk sigortası tutarının 200.000 TL''den az olmamak üzere önceki faaliyet döneminde elde edilen gelirin
    iki katından az olmaması (e) | Sigorta 5.500.000 TL | **Sağlanmıyor** |


    Sigorta hesabı: önceki faaliyet dönemi geliri 3.400.000 TL; 2 × 3.400.000 = 6.800.000 TL, 200.000 TL''den yüksek olduğundan
    asgari tutar **6.800.000 TL**. Eksik tutar = 6.800.000 − 5.500.000 = **1.300.000 TL**.


    Sonuç: Kuruluş şartlarının kaybedilmesi, Tebliğin 30 uncu maddesi (1)(a) bendi uyarınca bağımsız denetim kuruluşunun sermaye
    piyasasında bağımsız denetim faaliyetinde bulunma yetkisinin **Kurulca iptal edilebilmesi** sebebidir; ayrıca SPKn md.
    62/1 gereği Kurul, standart ve mevzuata aykırılıkları tespit edilen kuruluşları listeden çıkarmaya yetkilidir.


    **(b) Sorumlu ortak baş denetçi rotasyonu (Başlangıç Hükümleri, md. 6/4)**


    - Bir sorumlu ortak başdenetçi, bir müşteri şirketle yapılan sözleşmede her hâlükârda **en çok 5 hesap dönemi** görev
    alabilir. (K) 2022, 2023, 2024 ve 2025 dönemlerinde (4 dönem) görev yaptığından **2026 hesap dönemi 5. dönemdir**; (K)
    2026 raporunu imzalayabilir.

    - 2026 sonunda 5 dönemlik sınır dolduğundan **2027 hesap dönemi** için (K) görev alamaz.

    - (K)''nın aynı müşterinin denetim çalışmalarında yeniden görev alabilmesi için **en az 2 hesap döneminin geçmesi** zorunludur:
    2027 ve 2028 geçtikten sonra ilk uygun dönem **2029 hesap dönemidir**.


    **(c) Altı aylık ara dönem tabloları (Başlangıç Hükümleri, md. 5/2, 5/4)**


    | Müşteri | Kapsam | Dayanak |

    |---|---|---|

    | Kuzeyyıldız Enerji A.Ş. | **Kapsamdadır** | md. 5/2 (ç): sermaye piyasası araçları borsada işlem gören anonim ortaklıklar
    |

    | Ova Menkul Değerler A.Ş. | **Kapsamdadır** | md. 5/2 (a): yatırım kuruluşları (aracı kurum); payların borsada işlem
    görmesi aranmaz |

    | Tepe Girişim Yazılım A.Ş. | **Kapsam dışıdır** | md. 5/4: Gelişen İşletmeler Piyasası Listesinde yer alan işletmelerin
    altı aylık ara dönem tabloları inceleme kapsamında değildir |

    | Vadi Teknoloji A.Ş. | **Kapsam dışıdır** | md. 5/4: Serbest İşlem Platformunda işlem gören işletmeler |

    | Dağlar GYO A.Ş. | **Kapsamdadır** | md. 5/2 (b) (yatırım fonları hariç kolektif yatırım kuruluşu olan yatırım ortaklığı)
    ve (ç) (payları borsada işlem gören anonim ortaklık) |


    Bu kapsam, Kurulun finansal raporlama standartlarına ilişkin düzenlemelerindeki özel hükümler saklı kalmak kaydıyla geçerlidir
    (md. 5/2).


    **(d) Rapor ve bildirim tarihleri (İkinci Kısım, md. 23, 24, 27)**


    | Konu | Hesap | Tarih |

    |---|---|---|

    | Rapor kesinleşme (md. 23/1) | Sorumlu ortak baş denetçi imzaladığında kesinleşir | **27 Şubat 2026 (Cuma)** |

    | Yönetim kurulu başkanlığına teslim (md. 23/2) | En geç izleyen ilk iş günü mesai saati bitimi; Cumartesi-Pazar iş günü
    değildir | **2 Mart 2026 (Pazartesi)** |

    | Borsaya ve Kurula ilan için gönderme (md. 24/1) | Teslim tarihini izleyen en geç ilk iş günü mesai bitimi (teslim 2
    Mart''ta yapıldı) | **3 Mart 2026 (Salı)** |

    | Ortak/bağımsız denetçi değişikliğinin Kurula bildirimi (md. 27/1) | Değişiklik tarihinden (9 Nisan 2026) itibaren en
    geç 6 iş günü: 10, 13, 14, 15, 16, 17 Nisan | **17 Nisan 2026 (Cuma)** |

    | Pusula''nın kendi yıllık finansal tabloları (md. 27/3) | Bilanço tarihini (31.12.2025) izleyen en geç 10 hafta (70 gün)
    | **11 Mart 2026** |

    '
