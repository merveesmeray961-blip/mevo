    Bu üç durum için:


    (a) Her birinin hangi sermaye piyasası kurumu kategorisine girdiğini (veya girmediğini) gerekçesiyle açıklayınız. (12
    puan)


    (b) "Kolektif yatırım kuruluşu" kavramını tanımlayarak Gama GYO''nun bu tanımla ilişkisini ortaya koyunuz. (8 puan)

