  soru: 'Aşağıdaki ifade ve durumları 6362 sayılı Sermaye Piyasası Kanunu''ndaki tanımlar ve kurumsal yapı çerçevesinde değerlendiriniz:


    **Durum A:** Beta Varlık Yönetim A.Ş. ağırlıklı olarak sorunlu alacak portföyleri satın almakta ve bu portföylerden tahsilat
    yapmaktadır. Şirket, Kurul''dan aracı kurum izni almamıştır.


    **Durum B:** Gama Gayrimenkul Yatırım Ortaklığı A.Ş., Borsa İstanbul''da işlem gören payları aracılığıyla yatırımcılardan
    topladığı fonlarla gayrimenkul yatırımları yapmaktadır.


    **Durum C:** Delta Portföy Yönetim A.Ş., Kurul tarafından yetkilendirilmiş olup müşterilere ait portföyleri müşteri adına
    yönetmektedir.


    Bu üç durum için:


    (a) Her birinin hangi sermaye piyasası kurumu kategorisine girdiğini (veya girmediğini) gerekçesiyle açıklayınız. (12
    puan)


    (b) "Kolektif yatırım kuruluşu" kavramını tanımlayarak Gama GYO''nun bu tanımla ilişkisini ortaya koyunuz. (8 puan)

    '
  cozum: '**(a) Kurumsal sınıflandırma:**


    **Beta Varlık Yönetim A.Ş.:** Sorunlu alacak portföyü yönetimi ağırlıklı olarak bankacılık ve varlık yönetimi mevzuatı
    kapsamında ele alınır. Varlık yönetim şirketleri TMSF ve BDDK mevzuatıyla düzenlenmektedir. SPKn md. 35 kapsamında yatırım
    kuruluşu veya kolektif yatırım kuruluşu sayılmaz; Kurul''dan aracı kurum izni almamış olması bu çerçevede sermaye piyasası
    kurumu niteliği taşımadığını gösterir.


    **Gama GYO A.Ş.:** SPKn md. 48 uyarınca gayrimenkul yatırım ortaklıkları kolektif yatırım kuruluşu niteliğindedir ve sermaye
    piyasası kurumu sayılır. Payları borsada işlem gördüğünden halka açık ortaklık statüsündedir.


    **Delta Portföy Yönetim A.Ş.:** Kurul tarafından yetkilendirilmiş portföy yönetim şirketleri yatırım kuruluşu kapsamındadır
    (SPKn md. 37). Müşteri portföylerini yönetmek yatırım hizmeti niteliğindedir.


    **(b) Kolektif yatırım kuruluşu tanımı:**


    6362 sayılı Kanun uyarınca kolektif yatırım kuruluşları; yatırım fonları ve yatırım ortaklıklarından oluşmaktadır. Bu
    kuruluşlar, çok sayıda yatırımcıdan toplanan fonları bir araya getirerek portföy olarak yönetir.


    Gama GYO, yatırım ortaklığı olarak kolektif yatırım kuruluşu niteliğini taşımaktadır. Borsa İstanbul''da işlem gören payları
    aracılığıyla yatırımcılardan fon toplaması ve gayrimenkul portföyü oluşturması bu sınıflandırmayı desteklemektedir.

    '
