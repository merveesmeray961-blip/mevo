    \ kooperatif kontrolü nedeniyle halka açık sayılan **(M)'ye\nuygulanmaz** (md. 16/3 son cümle).\n\n**(b) (N)'nin kapsamdan\
    \ çıkması (Tebliğ II-16.1 md. 5)**\n\nOrtaklık, gündemin ilanından önce Kurula başvurur; gündem Kurul kararının tebellüğünden\
