    \ **(K) A.Ş.**'nin pay sahibi sayısı Haziran 2026'da yapılan sermaye artırımıyla 620'ye ulaşmıştır. (K), kitle\n   fonlaması\
    \ yoluyla para toplamamıştır.\n2. **(L) A.Ş.**, kitle fonlama platformu aracılığıyla yaptığı paya dayalı kitle fonlamasıyla\
    \ 1.100 pay sahibine\n   ulaşmıştır.\n3. **(M) A.Ş.**, pay sahibi en az beş yüz olan bir kooperatifin yönetim kontrolündedir;\
    \ 2025 yılı satış hasılatı\n   60.000.000 TL'dir.\n4. Pay sahibi sayısı nedeniyle halka açık sayılan **(N) A.Ş.**'nin\
    \ 900 pay sahibi bulunmaktadır; şirket paylarının\n   borsada işlem görmesini istemediğinden genel kurul kararıyla Kanun\
    \ kapsamından çıkmak istemektedir. Genel kurula\n   toplam oyların %70'ini temsil eden 610 pay sahibi katılmış ve tamamı\
    \ olumlu oy kullanmıştır.\n5. Halka açık sayılan **(O) A.Ş.**'nin sermayesinin %96'sı 45 pay sahibine aittir.\n\n**İstenenler:**\n\
    \n(a) (K), (L) ve (M)'nin halka açık ortaklık sayılıp sayılmadığını gerekçesiyle belirleyiniz; halka açık sayılanların\n\
    borsaya başvuru yükümlülüğünü ve buna uyulmamasının sonucunu açıklayınız. (10 puan)\n\n(b) (N)'nin genel kurul kararıyla\
    \ Kanun kapsamından çıkma şartlarını, gerekli nisabı hesaplayarak değerlendiriniz;\nayrılma hakkının kimlere, hangi fiyatla\
    \ ve ne süreyle kullandırılacağını açıklayınız. (9 puan)\n\n(c) (O)'nun Kanun kapsamından çıkma yolunu belirtiniz; Kanun\
    \ kapsamından çıkmanın diğer yollarını sayınız. (4 puan)\n\n(d) SPKn'deki \"halka arz\" ve \"halka açık ortaklık\" tanımlarını\
