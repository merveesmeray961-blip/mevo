    python: 'import datetime as dt

      daire = 12

      yeni_max = daire // 2

      mevcut = daire + 5

      kapat_max = mevcut - 12

      a_mat = 260000000 - 20000000

      t_mat = 110000000 - 10000000

      toplam_mat = a_mat + t_mat

      kurul = toplam_mat // 100

      izin = dt.date(2026, 9, 10)

      itiraz_son = izin + dt.timedelta(days=15)

      en_erken = itiraz_son + dt.timedelta(days=1)

      sonuc = {''a_yeni_max'': yeni_max, ''a_toplam_max'': daire + yeni_max, ''a_kapat_max'': kapat_max, ''b_matrah'': toplam_mat,
      ''b_kurul'': kurul, ''b_tubitak'': kurul, ''c_itiraz_son'': itiraz_son.isoformat(), ''c_en_erken'': en_erken.isoformat(),
      ''c_avukat'': 15 * 30000}

      '
