    **30 gün içinde** yeni üye seçmek üzere genel kurulun toplanamaması veya genel kurulda yeter sayıda üye seçilememesi hâlinde,
    genel kurulca yeni üyeler seçilinceye veya Kurulca başka üyeler atanıncaya kadar görev yapmak üzere toplantı yeter sayısını
    sağlayacak **asgari sayıda** üyeyi resen atar. Atanacak üyeler Kurulun kurumsal yönetim ilkelerinde sayılan **bağımsızlık
    kriterlerini** sağlamalıdır (md. 128/1-k).


    **(b)** Toplantı yeter sayısı 5, görevdeki üye 3 olduğundan asgari atama 5 − 3 = **2** üyedir. Geriye kalan boş üyelik
    sayısı 6 − 2 = 4''tür. Kurul bağımsızlık kriterlerini sağlayan, **boş üye sayısının 3 katı** kadar kişiyi ortaklardan
    aday göstermelerini talep eder: 4 × 3 = **12 aday**. Kurul bu talebini ortakların sahip oldukları pay oranlarını dikkate
    alarak belirler.


