    (U1), 3 numaralı araçları satmak istemektedir. Alıcı adayları: (U1)''in eşi; kardeşi; amcası; amcasının oğlu; eşinin annesi;
    eşinin amcası.


    **2.** **(X)**, Kurul Başkanı iken **20 Mayıs 2026**''da görevden ayrılmıştır; 1 Ağustos 2026''da kendisine bir aracı
    kurum ile bir halka açık ortaklık yönetim kurulu üyeliği önermiştir. Kurul meslek personeli uzmanı **(P)** ise **1 Ekim
    2026**''da Kurul görevinden ayrılmıştır. (P)''nin Kurulda görev yaptığı sürede yaptığı incelemeler:


    | Denetlenen | Niteliği | İnceleme tarihi |

    |---|---|---|

    | Ufuk Menkul Değerler A.Ş. | Aracı kurum | 15 Haziran 2025 |

    | Gökova Çimento A.Ş. | Halka açık ortaklık | 15 Eylül 2025 |

    | Meltem Yatırım Menkul Değerler A.Ş. | Aracı kurum | 15 Kasım 2023 |


    **3.** 2025 ve 2026 yılı toplantı katılım kayıtları (hepsi gündemli Kurul Karar Organı toplantısıdır):


    | Üye | Geçerli mazereti olmaksızın katılmadığı toplantı | Hastalık/görev mazeretiyle katılmadığı toplantı |

    |---|---|---|

    | (U2) | 4 | 6 |

    | (U3) | 5 | 0 |

    | (U4) | 2025''te 3, 2026''da 2 | 0 |


    Ayrıca üye **(U5)** 3 Eylül 2026''da vefat etmiş ve üyelik boşalmıştır.


    **4.** Kurul Karar Organının Kasım 2026 toplantısında **Sedir Menkul Değerler A.Ş.**''nin yönetim kurulu başkanı, genel
    müdürü ve iki ortağı hakkında ayrı ayrı idari para cezası verilmesi görüşülecektir. Üyelerin bu kişilerle ilişkileri:
    (U6)''nın kayınvalidesi yönetim kurulu başkanıdır; (U7)''nin amcasının oğlu ortaklardan biridir; (U8)''in eşinin kardeşi
    genel müdürdür; (U9)''un eşinin amcası diğer ortaktır. Toplantıya görüş vermek üzere davet edilen Kurul dışından bir akademisyen
    oylama sırasında salonda bulunmaktadır.


    **İstenenler:**


    (a) 1 numaralı bilgiler bakımından (U1)''in göreve başlama tarihini, sermaye piyasası araçlarını elden çıkarması gereken
    son günü, elden çıkarılması gereken araçları ve 3 numaralı araçların satılabileceği alıcıları belirtiniz; yükümlülüğe
    uyulmamasının sonucunu açıklayınız. (8 puan)


    (b) 2 numaralı bilgiler bakımından (X)''in hangi teklifi hangi tarihe kadar kabul edemeyeceğini ve yaptırımı; (P)''nin
    hangi kuruluşlarda hangi tarihe kadar görev alamayacağını belirtiniz. (6 puan)


    (c) 3 numaralı bilgiler bakımından hangi üyenin üyelikten çekilmiş sayılacağını ve bu durumun nasıl tespit edileceğini
    açıklayınız; (U5)''in boşalan üyeliğine atamanın en geç hangi tarihte yapılması gerektiğini ve atamayı yapacak makamı
    belirtiniz. (5 puan)


    (d) 4 numaralı bilgiler bakımından hangi üyelerin müzakere ve oylamaya katılamayacağını gerekçesiyle belirtiniz; bu durumun
    karar metninde nasıl yer alacağını ve akademisyenin salonda bulunmasının kararın alınmasına etkisini açıklayınız. (6 puan)

