  soru: '6362 sayılı Sermaye Piyasası Kanunu çerçevesinde aşağıdaki kavramları açıklayınız ve verilen örnekler üzerinden değerlendirme
    yapınız:


    **Kavram 1:** "Halka arz" — Zeta A.Ş., paylarını borsada satışa sunmak yerine 200 nitelikli yatırımcıya doğrudan teklif
    yoluyla satmayı planlamaktadır.


    **Kavram 2:** "İhraç" — Eta A.Ş., banka aracılığıyla 50 kurumsal yatırımcıya tahvil satmayı planlamaktadır; halka arz
    öngörülmemektedir.


    **Kavram 3:** "Sermaye piyasası aracı" — Theta A.Ş., müşterilerine dövize dayalı kaldıraçlı işlem imkânı sunmaktadır.


    Bu bilgiler ışığında:


    (a) Her üç kavramı tanımlayınız ve verilen örneklerin bu kavramlarla ilişkisini açıklayınız. (12 puan)


    (b) Zeta ve Eta''nın gerçekleştirmeyi planladığı işlemler için izahname düzenlenip düzenlenmeyeceğini, Kanun''daki muafiyet
    hükümlerini dikkate alarak değerlendiriniz. (8 puan)

    '
  cozum: '**(a) Kavram açıklamaları:**


    **Halka arz:** SPKn md. 3 uyarınca halka arz; sermaye piyasası araçlarının satın alınması için her türlü yoldan yapılan
    genel bir davettir. Zeta A.Ş.''nin 200 nitelikli yatırımcıya doğrudan teklif yapması, bu kişilerin sayısına ve nitelikli
    yatırımcı statüsüne bağlı olarak halka arz sayılıp sayılmayacağı bakımından mevzuattaki muafiyet hükümleri çerçevesinde
    değerlendirilir.


    **İhraç:** SPKn md. 3 uyarınca ihraç; sermaye piyasası araçlarının ihraççılar tarafından halka arz edilerek ya da halka
    arz edilmeksizin satışıdır. Eta A.Ş.''nin 50 kurumsal yatırımcıya tahvil satması halka arz edilmeksizin gerçekleştirilen
    bir ihraçtır; dolayısıyla ihraç kapsamındadır.


    **Sermaye piyasası aracı:** SPKn md. 3 uyarınca menkul kıymetler ve türev araçlar ile Kurulca belirlenen diğer araçlardır.
    Theta A.Ş.''nin sunduğu dövize dayalı kaldıraçlı işlem imkânı türev araç niteliği taşıyabilir; ancak Kurul düzenlemeleri
    çerçevesinde değerlendirilmesi gerekir.


    **(b) İzahname zorunluluğu:**


    **Zeta A.Ş.:** İzahname Tebliği (II-5.1) uyarınca nitelikli yatırımcılara yapılan satışlar belirli sayı sınırını aşmadığı
    takdirde izahname düzenlenmesinden muaf tutulabilir. 200 nitelikli yatırımcıya teklif, mevzuattaki eşiğe bağlı olarak
    muafiyet kapsamına girebilir.


    **Eta A.Ş.:** 50 kurumsal yatırımcıya yönelik özel bir satış söz konusu olduğundan; nitelikli yatırımcı sayısının sınır
    altında kalması ve halka arz olmaksızın gerçekleştirilmesi durumunda izahname yerine ihraç belgesi düzenlenmesi yeterli
    olabilir. Mevzuattaki somut eşiğin dikkate alınması gerekir.

    '
