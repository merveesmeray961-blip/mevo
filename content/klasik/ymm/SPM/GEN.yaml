  soru: "**I. Kurul ücreti.** 2026 yılında aşağıdaki işlemler yapılmıştır. Bu soruda SPKn md. 130/3'teki kanuni oranlar\n\
    uygulanacaktır.\n\n1. (A) A.Ş., nominal değeri 1 TL olan 10.000.000 payı halka arz yoluyla pay başına 12 TL'den satmıştır.\n\
    2. (B) A.Ş., nominal değeri 500.000.000 TL olan iskontolu bonoları 460.000.000 TL'den ihraç etmiştir.\n3. (C) Portföy\
    \ Yönetimi A.Ş.'nin kurucusu olduğu bir yatırım fonunun 30 Eylül 2026 (Çarşamba) itibarıyla net varlık\n   değeri 600.000.000\
    \ TL'dir.\n\n**II. Kurul Karar Organı.** Kurul Karar Organı'nın üç toplantısına ilişkin bilgiler:\n\n| Toplantı | Katılan\
    \ üye | Oylama |\n|---|---|---|\n| T1 | 5 | 3 kabul, 2 ret |\n| T2 | 6 | 4 kabul, 2 ret |\n| T3 | 5 | 4 kabul, 1 çekimser\
    \ |\n\nAyrıca bir üye, geçerli mazereti olmaksızın 2026 yılında toplam beş toplantıya katılmamıştır. Kurulun yeni\natanan\
    \ bir üyesinin, Kurulun denetlediği bir aracı kurumda payı bulunmaktadır.\n\n**İstenenler:**\n\n(a) I. bölümdeki işlemler\
    \ için ödenecek Kurul ücretlerini hesaplayınız; fon ücretinin ödeme süresini ve\nCumhurbaşkanının ücretler üzerindeki\
    \ yetkisini belirtiniz. (10 puan)\n\n(b) Kurul Karar Organı'nın yapısını, toplantı ve karar nisaplarını açıklayarak T1,\
    \ T2 ve T3'te karar alınıp\nalınmadığını belirleyiniz. (8 puan)\n\n(c) Devamsızlık yapan üyenin ve aracı kurumda payı\
    \ bulunan üyenin durumunu değerlendiriniz; üyelerin görevden\nayrıldıktan sonraki yasağını belirtiniz. (4 puan)\n\n(d)\
    \ Kurulun hukuki niteliğini ve Kurul kararlarına karşı yargı yolunu belirtiniz. (3 puan)\n"
  cozum: "**(a) Kurul ücreti (md. 130/3)**\n\nİhraççılar veya halka arz edenler, satışı yapılacak araçların **nominal değerinden\
    \ aşağı olmamak üzere ihraç\ndeğerinin binde üçü** tutarında ücret öder. Yatırım fonlarında oran, üçer aylık dönemlerin\
    \ son iş günündeki **net\nvarlık değerinin yüz binde beşidir**.\n\n| İşlem | Matrah | Hesap | Ücret (TL) |\n|---|---|---|---|\n\
    | (A) pay halka arzı | İhraç değeri 10.000.000 × 12 = 120.000.000 (nominalden yüksek) | 120.000.000 × 3 / 1.000 | **360.000**\
    \ |\n| (B) iskontolu bono | İhraç değeri 460.000.000 nominalden düşük → **nominal 500.000.000** | 500.000.000 × 3 / 1.000\
    \ | **1.500.000** |\n| (C) yatırım fonu | 600.000.000 | 600.000.000 × 5 / 100.000 | **30.000** |\n\nFon ücreti, dönem\
    \ sonunu izleyen **on iş günü** içinde Kurul hesabına yatırılır (30 Eylül'den sonraki onuncu iş günü\n**14 Ekim 2026**).\
    \ Kurul Karar Organı bu oranları aşmamak kaydıyla aracın niteliği, vadesi veya ihraççısına göre farklı\noranlar belirleyebilir;\
    \ **Cumhurbaşkanı** ücretleri kanuni oranların **iki katını** aşmamak üzere artırmaya veya kanuni\noranlarına indirmeye\
    \ yetkilidir.\n\n**(b) Kurul Karar Organı (md. 118, 123)**\n\nKurul Karar Organı biri başkan, biri ikinci başkan **yedi\
    \ üyeden** oluşur. En az **beş üyeyle** toplanır ve en az\n**dört üyenin aynı yöndeki oyuyla** karar alır; **çekimser\
    \ oy kullanılamaz**.\n\n- T1: 5 üye katılmış (toplantı nisabı var) ancak aynı yönde 3 oy → **karar alınamaz**.\n- T2:\
    \ 6 üye, 4 kabul → **karar alınır**.\n- T3: Çekimser oy kullanılamaz; çekimser kalan üyenin oyunu kabul veya ret olarak\
    \ kullanması gerekir. 4 üyenin aynı\n  yöndeki kabul oyu karar nisabını sağladığından **karar alınır**; ancak çekimser\
    \ oy kullanılması usule aykırıdır.\n\n**(c) Üyelik yasakları**\n\nGörev, izin, hastalık gibi geçerli mazereti olmaksızın\
    \ bir takvim yılında toplam **beş toplantıya** katılmayan üye\n**çekilmiş sayılır** (md. 123). Başkan ve üyeler Kurulun\
    \ düzenleyip denetlediği ortaklık ve kuruluşlarda pay sahibi\nolamaz; göreve başlarken sahip oldukları bu kuruluşların\
    \ araçlarını (Hazine borçlanma araçları ve emeklilik fon payları\nhariç) **otuz gün** içinde elden çıkarmak zorundadır\
    \ (md. 121). Görevden ayrılmayı izleyen **iki yıl** içinde yatırım\nkuruluşlarında görev alamazlar.\n\n**(d) Hukuki nitelik\
    \ ve yargı**\n\nKurul, kamu tüzel kişiliğini haiz, **idari ve mali özerkliğe** sahip, merkezi İstanbul'da bulunan bağımsız\
    \ bir\ndüzenleyici ve denetleyici otoritedir; kararları yerindelik denetimine tabi tutulamaz (md. 117). Kurul kararlarına\n\
    karşı açılan davalar **idare mahkemelerinde** görülür ve acele işlerden sayılır (md. 134).\n"
