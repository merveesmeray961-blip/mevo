    kurumu niteliği taşımadığını gösterir.


    **Gama GYO A.Ş.:** SPKn md. 48 uyarınca gayrimenkul yatırım ortaklıkları kolektif yatırım kuruluşu niteliğindedir ve sermaye
    piyasası kurumu sayılır. Payları borsada işlem gördüğünden halka açık ortaklık statüsündedir.


    **Delta Portföy Yönetim A.Ş.:** Kurul tarafından yetkilendirilmiş portföy yönetim şirketleri yatırım kuruluşu kapsamındadır
    (SPKn md. 37). Müşteri portföylerini yönetmek yatırım hizmeti niteliğindedir.


    **(b) Kolektif yatırım kuruluşu tanımı:**


    6362 sayılı Kanun uyarınca kolektif yatırım kuruluşları; yatırım fonları ve yatırım ortaklıklarından oluşmaktadır. Bu
    kuruluşlar, çok sayıda yatırımcıdan toplanan fonları bir araya getirerek portföy olarak yönetir.


    Gama GYO, yatırım ortaklığı olarak kolektif yatırım kuruluşu niteliğini taşımaktadır. Borsa İstanbul''da işlem gören payları
    aracılığıyla yatırımcılardan fon toplaması ve gayrimenkul portföyü oluşturması bu sınıflandırmayı desteklemektedir.

    '
