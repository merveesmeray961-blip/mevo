    **(b) Denetimden kaçınma:**


    Kurul''un bilgi ve belge isteme yetkisi (md. 4) kamusal nitelikte olup herhangi bir kişisel veya kurumsal bağı gerekçe
    göstererek bu yükümlülükten kaçınılamaz. Akrabalık ilişkisi Kanun''un öngördüğü istisnalar arasında yer almaz.


    Genel müdürün tutumu:

    - Kanuna aykırı olarak bilgi ve belge sunmaktan kaçınma oluşturur,

