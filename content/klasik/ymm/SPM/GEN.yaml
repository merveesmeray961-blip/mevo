    \ hakkı kullandırılır. Fiyat, Kurul düzenlemelerine göre hazırlanan ve adil ve makul olduğuna ilişkin tespiti\niçeren\
    \ **değerleme raporuyla** belirlenir. Kullanım süresi genel kurul tarihinden itibaren en çok **altı iş günü**\niçinde\
