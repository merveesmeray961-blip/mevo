  soru: 'Payları borsada işlem gören **Ay Lojistik A.Ş.**''nin yönetim kurulu 9 üyeden oluşmaktadır ve yönetim kurulu toplantı
    yeter sayısı **5**''tir. 2026 yılı başında 6 üyenin üyeliği boşalmış, geriye 3 üye kalmıştır. Boşalan üyeliklerin üyelikleri
    takip eden **30 gün** içinde genel kurul toplanamamış ve yeni üyeler seçilememiştir. Şirket olağan genel kurul toplantısını
    kanuni süresi içinde üst üste iki hesap döneminde yapmamıştır. Kurul, 6362 sayılı Kanunun 128. maddesi çerçevesinde yetkisini
    kullanmayı değerlendirmektedir.


    **İstenenler:**

    (a) Kurulun yönetim kurulu üyesi atayabilmesinin şartlarını ve atanacak üyelerde aranan niteliği belirtiniz. (7 puan)

    (b) Kurulun resen atayacağı asgari üye sayısını bulunuz; geriye kalan boş üyelikler için ortaklardan kaç aday gösterilmesini
    talep edeceğini hesaplayınız. (7 puan)

    (c) Ay Lojistik''te genel kurulun yetkilerini kimin kullanabileceğini gerekçesiyle belirtiniz. (6 puan)

    (d) Kurulun yönetmelik ve tebliğlerinin yürürlüğe giriş şeklini, özel nitelikli kararlarının yayımına ilişkin yetkisini
    belirtiniz. (5 puan)

    '
