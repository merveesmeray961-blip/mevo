  cozum: '**(a) Üyelerin sermaye piyasası araçlarını elden çıkarma yükümlülüğü (md. 119/3, 121/2)**


    - Kurul Başkan ve üyeleri **yemin etmedikçe göreve başlamış sayılmazlar** (md. 119/3). Dolayısıyla (U1) 2 Mart 2026''da
    atanmış olsa da göreve başlama tarihi yemin tarihi olan **16 Mart 2026**''dır.

    - Üyeler göreve başladıkları tarihten itibaren kendilerinin veya eşlerinin ve velayetleri altındaki çocuklarının sahibi
    oldukları sermaye piyasası araçlarından; **Hazine Müsteşarlığı tarafından çıkarılan borçlanmaya ilişkin araçlar ve emeklilik
    fon payları hariç**, Kurulun düzenlemek ve denetlemekle sorumlu olduğu kuruluşların her türlü sermaye piyasası araçlarını
    **otuz gün içinde** satmak suretiyle elden çıkarmak zorundadır (md. 121/2). Son gün: 16 Mart 2026 + 30 gün = **15 Nisan
    2026**.


    | No | Araç | Elden çıkarma |

    |---|---|---|

    | 1 | Hazine borçlanma aracı | Gerekmez (Hazine tarafından çıkarılan borçlanma araçları hariç) |

    | 2 | Emeklilik fonu payı | Gerekmez (emeklilik fon payları hariç) |

    | 3 | Aracı kurum payları ((U1)''e ait) | **Gerekir** |

    | 4 | Yatırım ortaklığı payları (velayet altındaki çocuğa ait) | **Gerekir** (yatırım ortaklığı kolektif yatırım kuruluşudur,
    md. 3/1-m; velayet altındaki çocuklar kapsamdadır) |

    | 5 | Kardeşe ait aracı kurum payları | Gerekmez (kardeş, md. 121/2''de sayılan kişiler arasında değildir) |


    - Satış, **eş, evlatlık, üçüncü dereceye kadar kan ve ikinci dereceye kadar kayın hısımları dışındakilere** yapılabilir.
    Alıcı adayları: eş (yasak); kardeş (ikinci derece kan hısımı, yasak); amca (üçüncü derece kan hısımı, yasak); amcanın
    oğlu (dördüncü derece kan hısımı, **uygun**); eşin annesi (birinci derece kayın hısımı, yasak); eşin amcası (üçüncü derece
    kayın hısımı, **uygun**). Satış yalnız **amcasının oğluna** ve **eşinin amcasına** yapılabilir.

    - Göreve başlama tarihinden itibaren otuz gün içinde bu fıkraya uygun hareket etmeyen üye **üyelikten çekilmiş sayılır**
    (md. 121/2).


    **(b) Görevden ayrılma sonrası yasaklar (md. 121/4, 121/6)**


    - (X): Kurul Başkan ve üyeleri görevden ayrılmalarını izleyen **iki yıl** içinde **yatırım kuruluşlarında** görev alamaz
    (md. 121/4). Aracı kurum yatırım kuruluşudur (md. 3/1-v); bu nedenle aracı kurum yönetim kurulu üyeliği teklifini **20
    Mayıs 2028''e kadar** kabul edemez. Bu fıkraya uymayanlara 2531 sayılı Kamu Görevlerinden Ayrılanların Yapamayacakları
    İşler Hakkında Kanunun 4 üncü maddesinde belirtilen cezalar verilir. Md. 121/4 yalnızca yatırım kuruluşlarını saymaktadır;
    halka açık ortaklık teklifi bu fıkra kapsamında yasaklanmamıştır.

    - (P): Meslek personeli görevden ayrıldıktan sonra **son iki yılda** incelemiş veya denetlemiş oldukları halka açık ortaklıklarda
    ve sermaye piyasası kurumlarında **iki yıl boyunca** görev alamaz (md. 121/6). Ayrılma 1 Ekim 2026 olduğundan "son iki
    yıl" 1 Ekim 2024 – 1 Ekim 2026 aralığıdır. Ufuk Menkul (15.6.2025) ve Gökova Çimento (15.9.2025) bu aralıktadır; **1 Ekim
    2028''e kadar** bu iki kuruluşta görev alamaz. Meltem Yatırım (15.11.2023) aralığın dışında kaldığından bu madde bakımından
    yasak kapsamında değildir.


    **(c) Devamsızlık ve boşalan üyelik (md. 123/2, 120/1, 119/2)**


    - Görev, izin ve hastalık gibi **geçerli mazereti olmaksızın bir takvim yılında toplam beş toplantıya** katılmayan üye
    üyelikten çekilmiş sayılır. (U2): mazeretsiz 4 toplantı (mazeretli 6 toplantı sayılmaz) → çekilmiş sayılmaz. (U3): mazeretsiz
    5 toplantı → **üyelikten çekilmiş sayılır**. (U4): mazeretsiz toplam 5 olsa da bunlar iki ayrı takvim yılına yayıldığından
    (3 + 2) → çekilmiş sayılmaz.

    - (U3)''ün çekilmiş sayıldığı durum **Kurul kararı ile tespit edilir ve ilgili Bakana bildirilir** (md. 123/2).

    - Üyeliğin herhangi bir sebeple boşalması hâlinde boşalan üyeliğe, md. 119''da belirtilen esaslar dâhilinde **en geç iki
    ay içinde** atama yapılır (md. 120/1). (U5)''in vefatı 3 Eylül 2026''dır; atama en geç **3 Kasım 2026**''da yapılmalıdır.
    Kurul Başkanı ve üyeleri **Cumhurbaşkanınca** atanır (md. 119/2).


    **(d) Hısımlık nedeniyle oylamaya katılamama (md. 123/4, 123/5)**


    Kurul Başkan ve üyeleri, kendisi, eşi, evlatlıkları ve **üçüncü derece dâhil kan** ve **ikinci derece dâhil kayın hısımlarıyla**
    ilgili konularda müzakere ve oylamaya katılamazlar.


    | Üye | Yakını | Hısımlık derecesi | Sonuç |

    |---|---|---|---|

    | (U6) | Kayınvalide | 1. derece kayın hısımı | **Katılamaz** |

    | (U7) | Amcasının oğlu | 4. derece kan hısımı | Katılabilir |

    | (U8) | Eşinin kardeşi | 2. derece kayın hısımı | **Katılamaz** |

    | (U9) | Eşinin amcası | 3. derece kayın hısımı | Katılabilir (üçüncü derece, kayın hısımlarda sınırın ötesindedir) |


    - Katılamama durumu **karar metninde ayrıca belirtilir** (md. 123/4).

    - Toplantıya görüş vermek üzere Kurul dışından davet edilen kişiler bulunabilir; ancak **Kurul kararları toplantıya dışarıdan
    katılanların yanında alınamaz** (md. 123/5). Akademisyen oylama sırasında salonda kaldığı sürece karar alınamaz; oylamadan
    önce salondan ayrılmalıdır.

    '
