- id: YMM-SPM-GEN-K001
  sinav: ymm
  ders: SPM
  konu: GEN
  kazanimlar:
  - Kurulun görev ve yetkileri
  - sermaye piyasası kurumları
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: 'Payları borsada işlem gören **Sigma A.Ş.**''ye ilişkin bilgiler şöyledir:


    - Esas sözleşmeye göre yönetim kurulu **9 üyeden** oluşur ve üye tam sayısının çoğunluğu ile toplanır.

    - 2026 yılı içinde **5 yönetim kurulu üyesi istifa etmiş**, üyelikleri boşalmıştır. Kalan 4 üye ile yönetim kurulu toplantı
    yeter sayısı sağlanamamaktadır.

    - Üyeliklerin boşalmasını takip eden **30 gün içinde** yeni üyeleri seçmek üzere genel kurul toplanamamıştır.

    - Şirketin pay sahipliği yapısı: Ali Bey %40, Bera Holding A.Ş. %35, borsada işlem gören kısım %25.


    Sermaye Piyasası Kurulu, 6362 sayılı Sermaye Piyasası Kanunu''nun 128 inci maddesi çerçevesinde harekete geçmeyi değerlendirmektedir.


    **İstenenler:**


    (a) Kurulun yönetim kuruluna resen üye atayabilmesi için Kanunda aranan koşulları açıklayınız ve bu koşulların Sigma A.Ş.''de
    oluşup oluşmadığını belirtiniz. (5 puan)


    (b) Kurulun resen atayacağı **asgari** üye sayısını hesaplayınız ve atanacak üyelerin taşıması gereken niteliği belirtiniz.
    (5 puan)


    (c) Resen atama sonrasında geriye kalan boş üyelikler için Kurulun ortaklardan kaç aday göstermelerini talep edeceğini
    hesaplayınız; bu talebi belirlerken neyi dikkate alacağını açıklayınız. (5 puan)


    (d) Sigma A.Ş. olağan genel kurul toplantısını kanuni süresi içinde üst üste iki hesap dönemi yapmazsa ne sonuç doğabileceğini
    açıklayınız. Ayrıca resen atama kararını alacak Kurul Karar Organının toplantı ve karar yeter sayılarını belirtiniz. (5
    puan)

    '
  cozum: '**(a) Resen atama koşulları (md. 128/1-k)**


    Kurulun resen atama yapabilmesi için:

    1. Halka açık ortaklığın yönetim kurulunda üyelerin tamamının veya bir kısmının **görev süresinin dolması veya üyeliklerin
    boşalması** sebebiyle **yönetim kurulu toplantı yeter sayısının sağlanamaması**,

    2. Yerlerine yeni üye seçmek üzere, görev süresinin bitimini veya üyeliğin boşalmasını takip eden **30 gün içinde genel
    kurulun toplanamaması** ya da genel kurulda yeter sayıda üyenin seçilememesi gerekir.


    Sigma A.Ş.''de 9 üyeli yönetim kurulunun toplantı yeter sayısı üye tam sayısının çoğunluğu, yani **5**''tir. İstifalar
    sonucu 4 üye kalmış, toplantı yeter sayısı sağlanamamıştır; 30 gün içinde genel kurul da toplanamamıştır. **Koşullar oluşmuştur.**


    **(b) Asgari resen atama ve nitelik**


    Kurul, yönetim kurulu **toplantı yeter sayısını sağlayacak asgari sayıda** üye atar: 5 − 4 = **1 üye**.

    Atanacak üye, Kurulun **kurumsal yönetim ilkelerinde sayılan bağımsızlık kriterlerini** sağlamalıdır. Bu üye, genel kurulca
    yeni üyeler seçilinceye veya Kurulca başka üyeler atanıncaya kadar görev yapar.


    **(c) Kalan boş üyelikler için aday sayısı**


    Boş üyelik: 5; resen atanan: 1 → geriye kalan boş üyelik **4**.

    Kurul, bağımsızlık kriterlerini sağlayan, **boş üye sayısının 3 katı** kadar kişiyi ortaklardan aday göstermelerini talep
    eder: 4 × 3 = **12 aday**.

    Kurul bu talebini ortakların halka açık ortaklıkta sahip olduğu **pay oranlarını dikkate alarak** belirler (Ali Bey %40,
    Bera Holding %35, diğer pay sahipleri %25) ve atamayı aynı esaslara uygun olarak yapar.


    **(d) Üst üste iki dönem olağan genel kurul yapılmaması; Kurul Karar Organı yeter sayıları**


    Olağan genel kurul toplantısını kanuni süresi içinde **üst üste iki hesap dönemi** yapmayan ve yönetim kurulu üyeleri
    kısmen veya tamamen Kurulca atanmış halka açık ortaklıklarda **genel kurulun yetkileri YTM (Yatırımcı Tazmin Merkezi)
    tarafından kullanılabilir** (md. 128/1-k).


    Kurul Karar Organı **en az beş üye ile toplanır** ve **en az dört üyenin aynı yöndeki oyuyla** karar alır; üyeler çekimser
    oy kullanamaz (md. 123/3).

    '
  puanlama:
  - olcut: (a) Toplantı yeter sayısının sağlanamaması ve 30 gün içinde genel kurulun toplanamaması koşullarını belirtme (3),
      Sigma A.Ş. için toplantı yeter sayısını 5 bulup koşulların oluştuğunu tespit (2)
    puan: 5
  - olcut: (b) Asgari atamanın 1 üye olduğunu hesaplama (3), bağımsızlık kriterlerini sağlama şartını ve görev süresini belirtme
      (2)
    puan: 5
  - olcut: (c) Kalan boş üyeliği 4 bulma (1), 3 kat kuralıyla 12 aday hesaplama (3), pay oranlarının dikkate alınacağını belirtme
      (1)
    puan: 5
  - olcut: (d) Genel kurul yetkilerinin YTM tarafından kullanılabileceğini belirtme (3), Kurul Karar Organının 5 üye ile toplanıp
      aynı yönde 4 oyla karar aldığını ve çekimser oy yasağını belirtme (2)
    puan: 5
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 128/1-(k)
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 123/3
  gecerlilik:
    baslangic: '2013-08-02'
    bitis: null
  dogrulama:
    python: 'uye = 9; kalan = 4; tys = uye // 2 + 1; resen = tys - kalan; bos = uye - kalan - resen; sonuc = {''toplanti_yeter_sayisi'':
      tys, ''resen_atama'': resen, ''kalan_bos'': bos, ''aday_sayisi'': bos * 3}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi SPM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 4, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_SPM-1.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
