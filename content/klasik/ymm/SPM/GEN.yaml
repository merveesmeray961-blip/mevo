  soru: 'Sermaye Piyasası Kurulu Denetim Birimi, Alfa Yatırım Menkul Değerler A.Ş.''nin (Alfa) 2026 yılı faaliyetlerini incelemiş
    ve aşağıdaki tespitleri yapmıştır:


    **Tespit I:** Alfa, Kurulun paylaşım taleplerini yanıtsız bırakmış ve istenen belgeleri 30 günlük süre içinde sunmamıştır.


    **Tespit II:** Alfa''nın müdürü, aynı zamanda rakip bir aracı kurumda yönetim kurulu üyesi olarak görev yapmakta; bu durum
    Kanun''daki bağdaşmazlık kurallarıyla değil ama anonim ortaklık mevzuatıyla çelişmektedir.


    **Tespit III:** Alfa, yazılı sözleşme imzalamaksızın portföy yönetim hizmeti sunmuş; müşterilere bu hizmet için ayrı bir
    ücret almamıştır.


    **Tespit IV:** Alfa Genel Müdürü, kurul kararına ilişkin bilgileri kamuya duyurulmadan 48 saat önce bir yakınına bildirmiş
    ve bu kişi söz konusu bilgiye dayanarak 500.000 TL değerinde pay satın almıştır.


    Bu tespitler ışığında aşağıdaki soruları yanıtlayınız:


    (a) 6362 sayılı Kanun kapsamında Kurul''un bilgi ve belge isteme yetkisi nedir? Alfa''nın bu yükümlülüğü yerine getirmemesinin
    hukuki sonuçları nelerdir? (8 puan)


    (b) Tespit III bakımından, yazılı sözleşme zorunluluğunun yasal dayanağını ve bu zorunluluğun ihlal edilmesinin olası
    yaptırımlarını açıklayınız. (9 puan)


    (c) Tespit IV''teki durumun 6362 sayılı Kanun çerçevesinde nasıl nitelendirileceğini ve uygulanabilecek yaptırımları belirtiniz.
    (8 puan)

    '
  cozum: '**(a) Bilgi ve belge isteme yetkisi ile hukuki sonuçlar:**


    6362 sayılı Kanun md. 4 uyarınca Kurul; görevini yerine getirebilmek amacıyla her türlü bilgi ve belgeyi, kamu kurum ve
    kuruluşlarından, sermaye piyasası kurumlarından ve diğer tüm ilgili kuruluşlardan talep etme yetkisine sahiptir. Kurul''un
    bu talebi yasal bir yükümlülük doğurur; belirlenen sürede yerine getirilmesi zorunludur.


    Alfa''nın talepleri yanıtsız bırakması SPKn''nın denetim hükümlerine açık aykırılık oluşturur. Kurul bu durumda:

    - İdari para cezası uygulayabilir,

    - Faaliyetleri geçici olarak durdurabilir,

    - Gerekli görürse faaliyet iznini iptal edebilir.


    **(b) Yazılı sözleşme zorunluluğu:**


    III-37.1 sayılı Yatırım Hizmetleri ve Faaliyetleri ile Yardımcı Hizmetlere İlişkin Esaslar Hakkında Tebliğ uyarınca yatırım
    kuruluşları, yatırım hizmetlerini ve yardımcı hizmetleri müşterilerle yazılı sözleşme akdetmek suretiyle sunmak zorundadır.
    Portföy yönetim hizmeti de bu kapsamda yer almaktadır.


    Yazılı sözleşme olmaksızın hizmet sunulması:

    - Tebliğ hükümlerine aykırılık oluşturur,

    - Kurul tarafından idari para cezasına konu edilebilir,

    - Müşteri aleyhine oluşan zararlardan aracı kurumun sorumluluğunu kuvvetlendirir.


    Ücret alınmaması zorunluluğu kaldırmaz; hizmet fiilen sunulmuştur ve yazılı sözleşme şartı yerine getirilmemiştir.


    **(c) Tespit IV''ün nitelendirilmesi:**


    Tespit IV, 6362 sayılı Kanun''un 107 nci maddesi kapsamında **bilgi suistimali** (içerden öğrenenlerin ticareti) suçunu
    oluşturmaktadır. İçeriden öğrenilen bilgi; henüz kamuya duyurulmamış, fiyatı etkileyebilecek nitelikteki bilgidir.


    Genel müdürün bu bilgiyi yakınına bildirmesi ve o kişinin pay alması:

    - SPKn md. 107 kapsamında suç teşkil eder,

    - Hem genel müdür hem de bilgiyi kullanan kişi hakkında hapis cezası ve adli para cezası uygulanabilir,

    - Kurul idari yaptırım da uygulayabilir (idari para cezası, faaliyet yasağı).

    '
  puanlama:
  - olcut: Kurulun bilgi ve belge isteme yetkisinin doğru ve eksiksiz açıklanması
    puan: 4
  - olcut: Yükümlülüğün yerine getirilmemesi halinde uygulanabilecek yaptırımların en az ikisinin doğru belirtilmesi
    puan: 4
  - olcut: Yazılı sözleşme zorunluluğunun yasal dayanağının (tebliğ) doğru gösterilmesi
    puan: 5
  - olcut: İhlal halindeki yaptırımların açıklanması
    puan: 4
  - olcut: Tespit IV'ün bilgi suistimali/içerden öğrenen ticareti olarak doğru nitelendirilmesi
    puan: 4
  - olcut: Uygulanabilecek cezai ve idari yaptırımların belirtilmesi
    puan: 4
  kaynaklar:
  - mevzuat: Sermaye Piyasası Kanunu (6362)
    madde: md. 4, md. 107
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yardımcı Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: İlgili maddeler
