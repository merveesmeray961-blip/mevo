- id: YMM-SPM-GEN-K004
  sinav: ymm
  ders: SPM
  konu: GEN
  kazanimlar:
  - sermaye piyasası kurumları
  - Kurulun görev ve yetkileri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Sermaye Piyasası Kurulu, 2026 yılında Epsilon Yatırım A.Ş. (Epsilon) hakkında kapsamlı bir denetim gerçekleştirmiştir.
    Denetim raporunda aşağıdaki hususlar tespit edilmiştir:


    - Epsilon, müşteri hesaplarındaki nakit varlıkları kendi operasyonel giderlerinde kullanmıştır.

    - Epsilon Genel Müdürü, Kurul üyesiyle akrabalık bağı olduğu gerekçesiyle iki yıl süreyle Kurul denetimine karşı bilgi
    vermekten imtina etmiştir.

    - Epsilon, yatırım danışmanlığı hizmeti sunduğu hâlde Kurul''a bu hizmete ilişkin herhangi bir bildirimde bulunmamıştır.


    Bu tespitler çerçevesinde:


    (a) Epsilon''ın müşteri varlıklarını kullanmasının hangi hukuki ilkeyi ihlal ettiğini ve SPK mevzuatındaki karşılığını
    açıklayınız. (8 puan)


    (b) Genel müdürün denetimden kaçınma davranışının hukuki niteliğini ve Kurul''un bu durumda kullanabileceği yetkileri
    değerlendiriniz. (9 puan)


    (c) Yatırım danışmanlığı hizmetinin bildirim yükümlülüğü bağlamındaki yasal dayanağını ve Epsilon''ın bu yükümlülüğü ihlal
    etmesinin olası sonuçlarını belirtiniz. (8 puan)

    '
  cozum: '**(a) Müşteri varlıklarının kullanılması:**


    SPKn ve III-37.1 sayılı Tebliğ uyarınca yatırım kuruluşları, müşteri varlıklarını kendi varlıklarından ayrı tutmak ve
    bunları kendi hesaplarına kullanmamakla yükümlüdür. Bu "ayrı tutma" ve "müşteri varlığını koruma" ilkeleri yatırımcı korumasının
    temelini oluşturur.


    Epsilon''ın müşteri nakdini operasyonel giderlerinde kullanması:

    - Müşteri varlıklarının korunması ilkesini ihlal eder,

    - SPKn md. 106 kapsamında suç niteliği taşıyabilir (güveni kötüye kullanma),

    - Kurul tarafından faaliyet durdurma ve para cezası yaptırımına konu olabilir.


    **(b) Denetimden kaçınma:**


    Kurul''un bilgi ve belge isteme yetkisi (md. 4) kamusal nitelikte olup herhangi bir kişisel veya kurumsal bağı gerekçe
    göstererek bu yükümlülükten kaçınılamaz. Akrabalık ilişkisi Kanun''un öngördüğü istisnalar arasında yer almaz.


    Genel müdürün tutumu:

    - Kanuna aykırı olarak bilgi ve belge sunmaktan kaçınma oluşturur,

    - Kurul, gerekli bilgilere ulaşmak için ilgili kamu kurumlarına başvurabilir,

    - Söz konusu kişi hakkında idari ve cezai yaptırım uygulanabilir.


    **(c) Yatırım danışmanlığı bildirim yükümlülüğü:**


    SPKn ve III-37.1 sayılı Tebliğ uyarınca yatırım danışmanlığı hizmeti sunmak yetki gerektiren bir yatırım hizmetidir. Yetki
    almaksızın bu hizmeti sunan kuruluşlar yasa dışı faaliyet yürütmektedir.


    Epsilon''ın bildirimsiz danışmanlık sunması:

    - İzinsiz yatırım hizmeti sunma yasağını ihlal eder (SPKn md. 37),

    - Kurul faaliyet durdurma kararı alabilir,

    - Suç teşkil ederse cezai soruşturma başlatılabilir,

    - Verilen danışmanlık hizmeti hukuki geçerliliğini tartışmalı hale getirir.

    '
  puanlama:
  - olcut: Müşteri varlığını koruma ve ayrı tutma ilkesinin doğru açıklanması
    puan: 4
