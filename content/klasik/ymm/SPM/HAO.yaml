    \ → kontrol 2 Nisan 2026'da elde edilmiş ve **teklif zorunluluğu doğmuştur**.\nBirlikte hareket edenlerin payı %33 ve\
    \ %50 eşiklerini de aştığından ayrıca md. 12/1 kapsamında kamuya açıklama\nyapılmalıdır.\n\n- Teklife konu paylar: diğer\
    \ ortakların payları = 100.000.000 × %44 = **44.000.000 pay**.\n- Asgari fiyat: duyurudan önceki altı ayın ortalaması\
    \ (42 TL) ile teklif sahiplerinin son altı ayda ödediği **en\n  yüksek fiyattan** (46 TL) düşük olamaz → **46 TL** (md.\
    \ 15/1).\n- Asgari teklif tutarı = 44.000.000 × 46 = **2.024.000.000 TL**.\n\n**(d) Süreler ve yaptırım**\n\nKontrolün\
    \ elde edilmesini izleyen **6 iş günü** içinde Kurula başvurulur; yükümlülüğün doğduğu tarihten itibaren\n**2 ay** içinde\
    \ fiili teklif başlar; teklif süresi **10–20 iş günüdür** (md. 13). Teklif **koşula bağlanamaz**.\n\nPay alım teklifi\
