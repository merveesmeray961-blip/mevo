  soru: 'Halka açık ortaklık olan **Kuzey Çelik A.Ş.**, 2026 yılında Kurulun iznini alarak kayıtlı sermaye sistemine geçmeyi
    planlamaktadır. Başvuru tarihine en yakın, Kurul düzenlemelerine uygun hazırlanmış ve bağımsız denetimden geçmiş **konsolide**
    finansal tablolara (31.12.2025) ilişkin veriler şöyledir:


    | Kalem | Tutar |

    |---|---|

    | Ödenmiş/çıkarılmış sermaye | 100.000.000 TL |

    | Konsolide toplam özkaynak | 210.000.000 TL |

    | Bunun azınlık paylarına ait kısmı | 50.000.000 TL |


    Şirket, 31.12.2025 tarihinden sonra ve başvurudan önce ödenmiş sermayesini **180.000.000 TL**''ye çıkarmıştır.


    **İstenenler:**

    (a) Kayıtlı sermaye tavanının üst limitini, ödenmiş sermaye artırımı yapılmamış olsaydı ulaşılacak tutarla birlikte hesaplayınız.
    (7 puan)

    (b) Gerçek durumda (ödenmiş sermayenin 180.000.000 TL olması) tavanın üst limitini bulunuz. (5 puan)

    (c) İzin 2026 yılında verilirse tavanın geçerli olacağı süreyi ve bitiş tarihini belirtiniz. (4 puan)

    (d) Süre sonunda tavana ulaşılamamış olsa da yönetim kurulunun sermaye artırımı kararı alabilmesi için gereken işlemi
    belirtiniz. (4 puan)

    (e) Sistemde nakden yapılacak ve iç kaynaktan yapılacak artırımların tavanı aşıp aşamayacağını belirtiniz. (5 puan)

    '
  cozum: '**(a)** Tavan, ödenmiş/çıkarılmış sermaye veya özsermayeden **yüksek olanının beş katını** aşamaz. Konsolide tablolar
    varsa özsermaye olarak **ana ortaklığa ait özsermaye toplamı** esas alınır: 210.000.000 − 50.000.000 = 160.000.000 TL.
    Yüksek olan 160.000.000 TL; üst limit = 5 × 160.000.000 = **800.000.000 TL**.


    **(b)** Finansal tablo tarihinden sonra ödenmiş sermaye artırılmış ve artırım sonrası sermaye (180.000.000 TL), tablolardaki
