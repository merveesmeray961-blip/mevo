  soru: '**Bozkır Tarım Ürünleri A.Ş.**''nin (Bozkır) payları borsada işlem görmemekte, ortaklık hiç halka arz yapmamıştır.
    Sermayesi 10.000.000 paydan oluşur; her pay bir oy verir, imtiyaz yoktur. Pay sahibi sayısı veraset ve pay devirleri sonucunda
    **10.03.2025** tarihinde 512''ye yükselmiş, 2026 Mayıs ayında 480''e düşmüştür. Bozkır paylarını borsada işlem görmesi
    için başvurmamıştır ve Kanun kapsamından çıkmak istemektedir. Kurula başvuru tarihi **15.06.2026** (Pazartesi)''dir. Aşağıdaki
    tarihlerde resmî tatil yoktur; Tebliğlerdeki tutarların 2026''da değişmediği kabul edilecektir.


    **Seçenek A (ortak sayısının 500''ün altında olduğunun tespiti):** Mahkemece atanan bilirkişi 20.05.2026 tarihli raporunda;
    hazır bulunanlar listesi, pay defteri, kâr payı dağıtım kayıtları ve sermaye artırımına katılan pay sahiplerine ilişkin
    belgeleri incelemiş, pay sahibi sayısının 500''ün altında olduğunu sonuç kısmında beyan etmiştir. Pay defteri günceldir;
    incelemede esas alınan hazır bulunanlar listesi **10.06.2025** tarihli genel kurula aittir.


    **Seçenek B (finansal tabloların büyüklüğü):** Kurul düzenlemelerine uygun hazırlanmış ve özel bağımsız denetimden geçmiş
    son iki yıllık veriler (milyon TL):


    | Yıl | Aktif toplamı | Net satış hasılatı | Hasılat dışındaki diğer gelirler toplamı |

    |---|---|---|---|

    | 2024 | 8,0 | 4,2 | 0,8 |

    | 2025 | 11,0 | 4,8 | 1,1 |


    Tescilli sermaye ve kanuni yedek akçeler karşılıksız kalmamıştır.


    **Seçenek C (genel kurul kararı):** Kurulun uygun görüşünün Bozkır''a tebliği **05.08.2026** (Çarşamba) günü tebellüğ
    edilmiştir. Toplantıda pay sahibi tam sayısı 480''dir; olumlu oy kullanan pay sahibi sayısı 310, bunların sahip olduğu
    pay sayısı 7.800.000''dür. Ayrılma hakkı fiyatı için değerleme raporu hazırlanacak olup elde şu tablolar vardır: 30.06.2025
    (6 aylık ara dönem), 30.09.2025 (9 aylık ara dönem), 31.12.2025 (yıllık); hepsi Kurul düzenlemelerine göre hazırlanmış
    ve (ara dönemler için özel) bağımsız denetimden geçmiştir.


    **Diğer gelişmeler:** Bozkır yönetim kurulu 06.08.2026 (Perşembe) tarihinde genel kurul toplantısının tarihini, yerini
    ve gündemini belirlemiştir. Ayrıca Orhun Tarım Holding A.Ş. 10.08.2026 (Pazartesi) tarihinde yaptığı pay alımlarıyla Bozkır''daki
    payını %23''ten %26''ya çıkarmıştır (birlikte hareket eden yoktur).


    **İstenenler**


    (a) Bozkır''ın halka açık ortaklık statüsünü ne zaman kazandığını, borsada işlem görmesi için başvuru süresini ve süre
    içinde işlem yapılmazsa sonucu belirtiniz. (5 puan)


    (b) Seçenek A ve B''nin Kanun kapsamından çıkma şartlarını sağlayıp sağlamadığını değerlendiriniz. (8 puan)


    (c) Seçenek C kapsamında gündem ilanı ve genel kurul için son tarihleri, karar nisabının sağlanıp sağlanmadığını (olumlu
    pay 7.300.000 olsaydı sonucu da), ayrılma hakkını kimlerin ve nasıl kullanacağını, değerleme raporunda esas alınabilecek
    tabloları belirtiniz. (7 puan)


    (d) Yönetim kurulu kararı ve Orhun''un pay alımı bakımından Kurula yapılacak açıklamaların kapsamını, sorumlusunu ve son
    tarihlerini belirtiniz. (5 puan)

    '
  cozum: '## (a) Statü ve süre


    Pay sahibi sayısı beş yüzü aşan anonim ortaklıkların payları halka arz olunmuş sayılır ve ortaklık halka açık ortaklık
    hükümlerine tabi olur (SPKn md. 16/1). Bozkır 10.03.2025''te 512 pay sahibine ulaştığından statüyü **10.03.2025**''te
    kazanmıştır; statünün kazanıldığının öğrenilmesini takiben Kurula başvurması gerekir (II-16.1 md. 4/1). Statü kazanıldıktan
    sonra en geç **iki yıl** içinde, yani **10.03.2027**''ye kadar borsaya başvurulmalıdır (SPKn md. 16/2). Başvuru yapılmaz
    ve md. 5 kapsamında genel kurul kararı alınmazsa Kurul ortaklığın talebini aramaksızın paylarının borsada işlem görmesi
    veya ortaklığın Kanun kapsamından çıkarılması için gerekli kararları alır (SPKn md. 16/2; II-16.1 md. 4/2).


    ## (b) Seçenek A ve B


    **Seçenek A (md. 7):** Pay sahibi sayısının 500''ün altında olduğu mahkemece atanan bilirkişi raporuyla tespit ettirilir.

    - Rapor başvurudan önceki son üç ay içinde (15.03.2026–15.06.2026) hazırlanmalıdır; 20.05.2026 **uygundur** (md. 7/3).

    - Hazır bulunanlar listesi başvuru tarihinden en geç bir yıl önce düzenlenmiş olmalıdır, yani 15.06.2025 veya sonrası;
    liste 10.06.2025 tarihli olduğundan bir yıldan eskidir → şart **sağlanmaz** (md. 7/2). Pay defteri günceldir.

    - Sonuç: Mevcut raporla A seçeneği kullanılamaz; güncel listeye dayanan yeni rapor gerekir.


    **Seçenek B (md. 8):** Başvurudan önceki son iki yıla ait tablolar itibarıyla (a) aktif toplamı 10 milyon TL''den az **veya**
    (b) hasılat ve diğer gelirlerin her ikisi de 5 milyon TL''den az **veya** (c) sermaye ile yedeklerin karşılıksız kalması
    aranır.

    - (a): 2025 aktifi 11 milyon TL → sağlanmaz.

    - (b): 2024: 4,2 ve 0,8; 2025: 4,8 ve 1,1 → her iki yılda iki kalem de 5 milyon TL''den az → **sağlanır**.

    - Seçeneklerden biri yeterlidir; başvurunun Kurulca uygun görülmesi hâlinde Kanun kapsamından çıkarılır. Tablolar özel
    bağımsız denetimden geçtiğinden denetim şartı da tamamdır.


    ## (c) Seçenek C (md. 5)


    - Gündem ilanı Kurul kararının tebellüğünden itibaren **on iş günü**, genel kurul **iki ay** içinde yapılır (md. 5/2).
    05.08.2026 + 10 iş günü (06, 07, 10–14, 17, 18, 19 Ağustos) = **19.08.2026**; genel kurul en geç **05.10.2026** (Pazartesi).

    - Nisap: pay sahibi tam sayısının en az üçte ikisinin olumlu oyu **veya** toplam oyların dörtte üçü (md. 5/5). 480 × 2/3
    = 320; olumlu pay sahibi 310 → ilk koşul sağlanmaz. 7.800.000 / 10.000.000 = %78 ≥ %75 → ikinci koşul sağlanır → **karar
    alınır**. Olumlu pay 7.300.000 (%73) olsaydı ikisi de sağlanmayacağından karar **alınamazdı**.

    - Ayrılma hakkı: olumlu oy kullananlar dışındaki tüm pay sahiplerine, toplantıya katılmayanlar dahil, herhangi bir şart
    aranmaksızın kullandırılır; kullanım süresi genel kurul tarihinden itibaren en çok altı iş günü içinde başlar ve iki yıldan
    az olmaz (md. 5/3-b, 5/5). Fiyat, adil ve makul olduğunu tespit eden değerleme raporuna göre belirlenir.

    - Tablolar: Başvuru tarihinden önceki dokuz aydan eski olmamalıdır → 15.09.2025 ve sonrası (md. 5/4). 30.06.2025 (11,5
    ay önce) **kullanılamaz**; 30.09.2025 ve 31.12.2025 kullanılabilir.


    ## (d) Özel durum açıklamaları (II-15.2)


    - Genel kurul toplantısının tarihinin, yerinin ve gündeminin belirlenmesi özel durumdur (md. 5/1-i); ortaya çıktığı tarihten
    itibaren **beş iş günü** içinde Kurula açıklama ulaştırılır (md. 7/1): 06.08.2026 + 5 iş günü = **13.08.2026**. Açıklamayı
    ortaklık yapar.

    - Bir kişinin sermayedeki payının %25''e ulaşması veya aşması (%23 → %26) özel durumdur (md. 5/1-a); açıklamayı işlemi
    gerçekleştiren **Orhun** yapar (md. 7/2) ve süre 10.08.2026''dan itibaren beş iş günüdür → **17.08.2026**.

    '
