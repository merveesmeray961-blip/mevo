  - olcut: (a) Beş yıllık geçerlilik ve süre sonunda yeni yetki gerekliliği
    puan: 4
  - olcut: (b) Payların satılıp bedelinin ödenmesi şartı ve tavanın bir defa aşılabilmesi (nakdi artırım hariç)
    puan: 4
  - olcut: (c) Nominal (%10) ve bedel sınırlarının hesaplanması
    puan: 4
  - olcut: (c) Planın iki sınırı da aştığı ve azami 8.000.000 TL nominal / 200.000.000 TL
    puan: 4
  - olcut: (d) Kısıtlanmış yedek (296.000.000 TL) ve serbest bırakılması
    puan: 2
  - olcut: (d) Aykırı alımların bir yılda elden çıkarılması ve üç yıllık program süresi
    puan: 3
  kaynaklar:
  - mevzuat: Kayıtlı Sermaye Sistemi Tebliği (II-18.1)
