  puan: 20
  sure_dk: 25
  soru: '**Senaryo:**

    NOP A.Ş. Borsa İstanbul''da işlem gören bir halka açık ortaklık, RST A.Ş. ile kısmi bölünme yoluyla bir iş birimini devretmeyi
    planlamaktadır. Bölünme sürecindeki pazarlık ve karar aşamaları henüz kamuya açıklanmamıştır.


    **(a)** II-23.2 Tebliği kapsamında kısmi bölünme ile tam bölünme arasındaki temel farkı açıklayınız ve kısmi bölünme için
    zorunlu belgeleri sıralayınız. (10 puan)


    **(b)** Bölünme kararının alınma sürecinde henüz kamuya açıklanmamış bilgilerin II-15.1 Tebliği kapsamındaki niteliğini
    ve içsel bilgi yükümlülüklerini açıklayınız. (10 puan)

    '
  cozum: '**(a) Kısmi Bölünme — Tam Bölünme Farkı ve Zorunlu Belgeler:**


    Tam bölünmede: Şirketin tüm varlık ve yükümlülükleri en az iki farklı şirkete devredilir; bölünen şirket infisah eder.

    Kısmi bölünmede: Şirketin belirli bir varlık grubu (iş birimi) başka bir şirkete devredilir; devreden şirket varlığını
    sürdürür.


    Kısmi bölünmede zorunlu belgeler (II-23.2 md. 6):

    1. Bölünme sözleşmesi veya planı

    2. Uzman kuruluş değerleme raporu

    3. Bölünme bilgi belgesi


    Ayrıca genel kurulun onayı zorunludur. Bölünme tescil ve ilan gerektirmektedir.


    **(b) İçsel Bilgi Yükümlülükleri:**


    II-15.1 Tebliği md. 4 uyarınca bölünme kararı henüz kamuya açıklanmamış, şirketin piyasa değerini önemli ölçüde etkileyecek
    nitelikte ise "içsel bilgi" sayılır.


    NOP A.Ş. yükümlülükleri:

    1. İçsel bilgiye erişim listesini güncel tutmak

    2. Bilginin gizli tutulmasını sağlamak

    3. Bilginin sızıntısı durumunda ya da karar kesinleştiğinde derhal KAP üzerinden kamuya açıklamak


    Erteleme talep edilecekse Kurul''a başvurulmalı; erteleme kararı Kurul tarafından verilmeli ve bilgi gizli tutulmalıdır.

    '
  puanlama:
