      ek = min(nom_kalan, bedel_kalan / 25)\nsonuc = {\"tavan\": tavan, \"asim\": 4000000000 - tavan, \"nom_kalan\": nom_kalan,\
      \ \"bedel_kalan\": bedel_kalan,\n         \"plan_bedel\": 10000000 * 25, \"ek\": ek, \"ek_bedel\": ek * 25, \"kisitli\"\
      : 96000000 + ek * 25}\n"
