    HIJ A.Ş. kayıtlı sermaye sisteminde olup kayıtlı sermaye tavanı 400.000.000 TL, çıkarılmış sermayesi 180.000.000 TL''dir.
    2026 yılında yönetim kurulu kayıtlı sermaye tavanını 600.000.000 TL''ye çıkarmak ve aynı dönemde KLM A.Ş. ile tam birleşme
    gerçekleştirmek istemektedir.


    **(a)** II-18.1 Tebliği uyarınca kayıtlı sermaye tavanının 600.000.000 TL''ye yükseltilmesi için hangi onayların alınması
    gerektiğini açıklayınız. (8 puan)


    **(b)** HIJ A.Ş. — KLM A.Ş. tam birleşmesi için II-23.2 Tebliği kapsamında hazırlanması zorunlu belgeler ile genel kurul
    sürecini mevzuat dayanaklarıyla açıklayınız. (12 puan)


    **(c)** Bu birleşme işleminin hem tavan değişikliği hem de birleşme süreçlerinin eş zamanlı yürütülmesi halinde ortaya
    çıkabilecek hukuki riski belirtiniz. (5 puan)

    '
  cozum: '**(a) Kayıtlı Sermaye Tavanı Değişikliği:**


    II-18.1 Tebliği md. 9 uyarınca kayıtlı sermaye tavanının değiştirilmesi için:

    1. Yönetim kurulu teklif kararı

    2. Genel kurul onayı (esas sözleşme değişikliği)

    3. Kurul''un onayı (Kurul''a başvuru ve izin)

    gerekmektedir.


    Tavan artışı, genel kurulun esas sözleşmeyi değiştirmesiyle ancak Kurul izni sonrasında hüküm ifade eder. Yönetim kurulunun
    tek başına tavan değiştirme yetkisi yoktur.


    **(b) Birleşme Belgeleri ve Genel Kurul Süreci:**


    II-23.2 Tebliği md. 6 uyarınca zorunlu belgeler:

    1. Birleşme sözleşmesi (taraflar arasında imzalanan temel belge)

    2. Uzman kuruluş değerleme raporu (her iki ortaklık için ayrı ayrı)

    3. Birleşme bilgi belgesi (pay sahiplerine sunulan açıklayıcı doküman)


    Genel kurul süreci:

    - Her iki ortaklığın genel kurulları birleşme sözleşmesini ayrı ayrı onaylamalıdır.

    - Birleşme bilgi belgesinin genel kurul öncesinde pay sahiplerine sunulması zorunludur.

    - Onay sonrası birleşme Ticaret Siciline tescil edilir ve KAP üzerinden duyurulur.


    **(c) Eş Zamanlı Yürütme Riski:**


    Tavan değişikliği için Kurul onayı henüz alınmamışken birleşme genel kurulunun toplanması halinde, birleşmede öngörülen
    sermaye artışının geçerli bir tavan kapsamında yapılıp yapılmadığı tartışmalı hale gelebilir. Birleşme neticesinde oluşacak
    sermaye tutarı mevcut tavan olan 400.000.000 TL''yi aşacaksa, tavan değişikliği önce tamamlanmadan birleşme kararı geçersizlik
    riski taşır. Bu nedenle önce tavan değişikliği prosedürünün tamamlanması hukuki riski ortadan kaldıracaktır.

    '
