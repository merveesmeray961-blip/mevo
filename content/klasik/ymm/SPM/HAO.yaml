    TL, kanuni yedek akçe sonrası dağıtılabilir kâr 4.500.000 TL''dir. Esas sözleşmede kâr payı oranına özel hüküm bulunmamaktadır.


    **(a)** SPK II-17.1 Tebliği uyarınca UVW A.Ş.''nin yönetim kurulunda en az kaç bağımsız üye bulunması gerektiğini ve bağımsızlık
    kriterlerini açıklayınız. (10 puan)


    **(b)** SPK II-19.1 Tebliği çerçevesinde dağıtılması gereken asgari birinci kâr payını hesaplayınız ve kâr payının ne
    zaman ödenmesi gerektiğini belirtiniz. (10 puan)

    '
  cozum: '**(a) Bağımsız Üye Sayısı ve Kriterleri:**


    II-17.1 Tebliği md. 5 uyarınca bağımsız üye sayısı yönetim kurulu üye tam sayısının üçte birinden az olamaz.


    UVW A.Ş.''de: 9 üye × 1/3 = 3 bağımsız üye (en az)


    Bağımsızlık kriterleri:

    - Şirket, şirketin yönetim kontrolünü elinde bulunduran pay sahipleri veya üst düzey yöneticilerle ilişkili olmama

    - Son 5 yıl içinde şirkette idari veya icrai görev üstlenmemiş olma

    - Son 5 yıl içinde belirli oranın üzerinde pay sahibi olmama

    - Kurul tarafından belirlenen diğer kriterler


