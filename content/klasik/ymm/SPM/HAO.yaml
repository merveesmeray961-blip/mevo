    puan: 8
  - olcut: Birleşme sözleşmesi, değerleme raporu ve bilgi belgesi üç zorunlu belgenin tamamının sayılması
    puan: 6
  - olcut: Her iki ortaklığın genel kurullarının ayrı ayrı onay vereceğinin belirtilmesi
    puan: 6
  - olcut: Eş zamanlı yürütmede tavan yetersizliği riskinin tespiti ve önerinin (önce tavan) doğru açıklanması
    puan: 5
