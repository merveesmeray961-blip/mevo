  soru: "Payları borsada işlem gören **Epsilon Kimya A.Ş.**'nin (Epsilon) sermayesi 100.000.000 paydan oluşmakta olup her\n\
    pay bir oy hakkı vermektedir; imtiyazlı pay yoktur. 2026 yılında yaşanan gelişmeler:\n\n1. 1 Ocak 2026'da **Bay (K)**\
    \ payların %15'ine, birlikte hareket ettiği eşi %3'üne sahiptir.\n2. Bay (K) 5 Şubat 2026'da borsadan 8.000.000 pay daha\
    \ satın almıştır (ortalama fiyat 44 TL; son altı ayda Bay (K)\n   ve eşinin Epsilon paylarına ödediği en yüksek fiyat\
    \ 46 TL'dir).\n3. Epsilon yönetim kurulu, rakip bir şirketle birleşme müzakerelerine başlamış ve müzakerelerin sonuçlanmamış\n\
    \   olması nedeniyle bu içsel bilginin açıklanmasını ertelemeye karar vermiştir. 10 Mart'ta bir ekonomi sitesinde\n  \
    \ müzakerelere ilişkin haber yayımlanmış ve pay fiyatında olağan dışı hareket gözlenmiştir.\n4. 2 Nisan 2026'da Bay (K),\
    \ payların %30'una sahip **(L) A.Ş.** ile yönetim kurulu üyelerinin çoğunluğunun birlikte\n   belirlenmesi ve genel kurulda\
    \ birlikte oy kullanılmasına ilişkin yazılı bir pay sahipleri sözleşmesi imzalamıştır.\n5. 2 Nisan'dan önceki altı aylık\
    \ dönemde borsada oluşan günlük düzeltilmiş ağırlıklı ortalama fiyatların aritmetik\n   ortalaması 42 TL'dir. Bay (K),\
    \ eşi ve (L) A.Ş. son altı ayda başka pay almamıştır.\n\n**İstenenler:**\n\n(a) 5 Şubat'taki alım nedeniyle doğan kamuya\
    \ açıklama yükümlülüğünü, aşılan eşikleri ve yükümlüyü belirtiniz.\n(5 puan)\n\n(b) Birleşme müzakerelerine ilişkin erteleme\
    \ kararını şartlarıyla değerlendiriniz; 10 Mart'taki haber üzerine\nEpsilon'un yükümlülüğünü açıklayınız. (6 puan)\n\n\
    (c) 2 Nisan'daki sözleşmenin pay alım teklifi zorunluluğu yönünden sonucunu; teklife konu pay miktarını, asgari\nteklif\
    \ fiyatını ve asgari teklif tutarını hesaplayınız. (9 puan)\n\n(d) Pay alım teklifine ilişkin süreleri ve teklifin şartlara\
    \ bağlanıp bağlanamayacağını belirtiniz; yükümlülüğe\nuyulmamasının idari yaptırımını açıklayınız. (5 puan)\n"
  cozum: "**(a) Sermaye yapısına ilişkin açıklama**\n\nBay (K) ve birlikte hareket ettiği eşinin payı 5 Şubat'tan önce %18\
    \ (%15 + %3), sonra %26'dır (8.000.000 / 100.000.000 =\n%8 artış). Doğrudan veya dolaylı payın **%20** ve **%25** eşiklerine\
    \ ulaşması veya bunları aşması, Özel Durumlar Tebliği\n(II-15.1) md. 12/1'deki (%5, %10, %15, %20, %25, %33, %50, %67,\
    \ %95) eşiklerden ikisinin aşılması anlamına gelir.\nAçıklama yükümlülüğü, pay edinen **Bay (K) ve birlikte hareket ettiği\
    \ kişilere** aittir; açıklama Kurulun\ndüzenlemelerine uygun olarak KAP'ta yapılır.\n\n**(b) İçsel bilginin ertelenmesi**\n\
    \nİhraççı, sorumluluğu kendisine ait olmak üzere **meşru çıkarlarının** zarar görmemesi için içsel bilginin açıklanmasını\n\
    erteleyebilir; ancak ertelemenin **yatırımcıları yanıltmaması** ve ertelenen bilginin **gizliliğinin sağlanması**\nşarttır\
    \ (md. 6). Erteleme kararı yönetim kurulunca veya yetkilendirilen kişinin yazılı onayıyla alınır; sebepler\nortadan kalkınca\
    \ bilgi, erteleme kararı ve gerekçesiyle açıklanır.\n\nSonuçlanmamış birleşme müzakereleri meşru çıkar oluşturabilir;\
    \ ancak 10 Mart'taki haber ve olağan dışı fiyat\nhareketi **gizliliğin sağlanamadığını** gösterir. Bu durumda erteleme\
    \ şartı ortadan kalkar; Epsilon, Kurul veya\nborsa uyarısını beklemeden haberi doğrulayarak ya da gerçek durumu açıklayarak\
    \ **derhal** kamuya açıklama yapmalıdır\n(md. 6, 9).\n\n**(c) Zorunlu pay alım teklifi**\n\nTek başına veya **birlikte\
    \ hareket edenlerle** oy haklarının **%50'sinden fazlasına** sahip olan kişi yönetim kontrolünü\nelde etmiş sayılır; ortaklar\
