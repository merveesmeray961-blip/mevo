    - Net dönem kârı: 60.000.000 TL

    - Birinci tertip yasal yedek akçe henüz ayrılmamıştır.

    - Esas sözleşmede kâr payının %20''sinin nakit olarak dağıtılması öngörülmektedir.

    - Yönetim kurulu, kâr payı dağıtımını genel kurula önermeyerek tüm kârı ihtiyat akçesine eklemeyi planlamaktadır.


    (a) Kâr dağıtım sürecinde öncelikle yapılması gereken kesintileri ve sırasını belirtiniz. (10 puan)


    (b) Yönetim kurulunun esas sözleşmede belirlenen kâr payı dağıtım zorunluluğunu devre dışı bırakıp bırakamayacağını değerlendiriniz.
    (10 puan)

    '
  cozum: "**(a) Kâr dağıtım sırası:**\n\nII-19.1 sayılı Kâr Payı Tebliği ve SPKn uyarınca halka açık ortaklıklarda kâr dağıtım\
    \ sırası şöyledir:\n\n1. **Geçmiş yıl zararlarının mahsup edilmesi** (varsa)\n2. **Birinci tertip yasal yedek akçenin\
    \ ayrılması:** Net dönem kârının %5'i; ödenmiş sermayenin %20'sine ulaşana kadar ayrılır.\n   - Yedek akçe = 60.000.000\
    \ × %5 = 3.000.000 TL\n3. **Birinci kâr payının ayrılması:** Esas sözleşmede belirlenen asgari kâr payı.\n4. **İkinci\
    \ tertip yasal yedek akçenin ayrılması**\n5. **Kalan kâr:** Genel kurulun kararına göre dağıtılır ya da yedeklere aktarılır.\n\
    \n**(b) Yönetim kurulunun yetkisi:**\n\nII-19.1 Tebliği uyarınca esas sözleşmede kâr payı dağıtım zorunluluğu öngörülmüşse\
    \ yönetim kurulu bu hükmü kendi kararıyla devre dışı bırakamaz. Kâr dağıtımı genel kurulun yetkisindedir; ancak esas sözleşmedeki\
    \ zorunluluk genel kurulu da bağlar.\n\nPsi'nin esas sözleşmesinde %20 nakit kâr payı dağıtım yükümlülüğü bulunduğundan:\n\
    - Bu oran dağıtılabilir kâr üzerinden asgari kâr payı niteliği taşır,\n- Yönetim kurulu genel kurula bu oranın altında\
    \ dağıtım önermesi yapamaz,\n- Kâr payının tamamının ihtiyata aktarılması esas sözleşme ihlali oluşturur,\n- Kurul bu\
    \ ihlali tespit ederse idari yaptırım uygulayabilir.\n"
