    tespit edilmiştir.


    **(a)** RST A.Ş.''nin II-15.1 Tebliği kapsamındaki içsel bilgi yükümlülüklerini açıklayınız. Kamuya açıklama ertelenecekse
    hangi adımların izlenmesi gerektiğini belirtiniz. (10 puan)


