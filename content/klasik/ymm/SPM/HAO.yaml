    **(c)** SPK II-17.1 Tebliği uyarınca kurumsal yönetim komitesinin görevlerini ve üye yapısını açıklayınız. (7 puan)

    '
  cozum: '**(a) İçsel Bilgi Yükümlülükleri ve Erteleme:**


    II-15.1 Tebliği md. 5 uyarınca birleşme anlaşması içsel bilgi niteliği taşımaktadır. RST A.Ş. bu bilgiyi kamuya derhal
    açıklamakla yükümlüdür.


    Erteleme Koşulları (md. 6-7):

    1. Ortaklığın meşru menfaatlerinin zarar göreceği durumlarda erteleme talep edilebilir.

    2. Erteleme talebi Kurul''a yazılı olarak iletilir ve Kurul onayı gerekir.

    3. Bilginin erteleme süresince gizli tutulması zorunludur.

    4. Bilginin kasıtsız veya kasıtlı olarak üçüncü kişilere sızması halinde derhal ve eşit biçimde kamuya açıklama yapılmalıdır.


    **(b) İçsel Bilgiye Erişim Listesi:**


    Amaç: İçsel bilgiye erişen kişileri kayıt altına alarak bilgi suistimalini önlemek ve Kurul''a hesap verebilirliği sağlamak.


    Liste kapsamı:

    - Bilgiye erişen her kişinin adı, soyadı, unvanı

    - Erişim tarihi ve hangi bilgiye erişildiği

    - Kişinin bilginin gizlilik yükümlülüğünü kabul ettiğine dair beyan


    Liste, Kurul talep etmesi halinde ibraz edilmek üzere güncel tutulur (md. 8).


    **(c) Kurumsal Yönetim Komitesi:**


    II-17.1 Tebliği md. 14 uyarınca kurumsal yönetim komitesi:

    Görevler:

    - Pay sahipleriyle ilişkiler faaliyetlerini izlemek

    - Kurumsal yönetim ilkelerine uyumu değerlendirmek ve raporlamak

    - Gerektiğinde aday gösterme ve ücret komitelerinin işlevlerini de yürütmek


