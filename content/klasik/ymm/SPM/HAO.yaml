  soru: "**Gamma Tekstil A.Ş.**'nin (Gamma) payları borsada Yıldız Pazar dışındaki bir pazarda işlem görmektedir.\nKurumsal\
    \ Yönetim Tebliği (II-17.1) uyarınca Üçüncü Grupta yer almaktadır; gayrimenkul veya girişim sermayesi\nyatırım ortaklığı\
    \ değildir. Fiili dolaşımdaki pay oranı %60'tır. Toplam 25.000.000 adet pay ve oy hakkı vardır;\nimtiyazlı pay yoktur.\n\
    \nGamma yönetim kurulu, ana üretim tesisini tüm makine ve teçhizatıyla 360.000.000 TL'ye bir yabancı yatırımcıya\nsatmaya\
    \ karar vermiş ve kararı 10 Mart 2026'da kamuya açıklamıştır. Bilgiler:\n\n- Kamuya açıklanmış son finansal tablolara\
    \ göre varlık toplamı 600.000.000 TL; devredilecek varlıkların kayıtlı\n  değeri 270.000.000 TL'dir.\n- 10 Mart 2026'dan\
    \ önceki altı aylık dönemde oluşan günlük düzeltilmiş ağırlıklı ortalama fiyatların aritmetik\n  ortalaması 18,00 TL,\
    \ son bir aylık dönemdekilerin aritmetik ortalaması 19,50 TL'dir.\n- Son yıllık finansal tablolara göre bu tesisten elde\
    \ edilen gelir 700.000.000 TL, sürdürülen faaliyetler dönem\n  net kârına etki eden tüm gelir kalemlerinin toplamı 1.000.000.000\
    \ TL'dir.\n- Pay sahibi **(X)**, 10 Mart 2026 itibarıyla 50.000 paya sahiptir; 20 Mart'ta 20.000 pay almış, 25 Mart'ta\n\
    \  25.000 pay satmıştır. Genel kurulda olumsuz oy vermiş ve muhalefetini tutanağa geçirtmiştir.\n- Pay sahibi **(Y)**\
    \ genel kurula katılmamış; **(Z)** olumsuz oy vermiş ancak muhalefet şerhi yazdırmamıştır.\n\n**İstenenler** (SPKn ile\
    \ Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği II-23.3 çerçevesinde):\n\n(a) Satışın önemli nitelikteki işlem\
    \ olup olmadığını önemlilik ölçütlerini hesaplayarak belirleyiniz. Fiili\ndolaşım oranı %40 olsaydı sonuç değişir miydi?\
    \ (8 puan)\n\n(b) Genel kurulda işlemin onaylanması için gereken nisapları açıklayınız. Genel kurula 10.000.000 pay katılmış\
    \ ve\n6.500.000 pay olumlu oy vermişse; ayrıca 14.000.000 pay katılmış ve 7.500.000 pay olumlu oy vermişse kararın alınıp\n\
    alınmadığını belirleyiniz. (6 puan)\n\n(c) (X), (Y) ve (Z)'nin ayrılma hakkını değerlendiriniz; ayrılma hakkı kullanım\
    \ fiyatını, (X)'in hakka konu pay\nmiktarını ve alacağı bedeli hesaplayınız. (8 puan)\n\n(d) Ayrılma hakkının kullanım\
    \ sürelerini ve bedelin ödenme şeklini belirtiniz; Gamma'nın payları borsada işlem\ngörmeseydi ayrılma hakkı fiyatının\
    \ nasıl belirleneceğini açıklayınız. (3 puan)\n"
  cozum: "**(a) Önemlilik ölçütü**\n\nMal varlığının devri, ölçütü sağlarsa önemli nitelikteki işlemdir (SPKn md. 23; Tebliğ\
    \ md. 4/1-c). Ortaklık değeri =\n25.000.000 × 18,00 = 450.000.000 TL.\n\n| Ölçüt (md. 6/1) | Hesap | Oran |\n|---|---|---|\n\
    | (a) Kayıtlı değer / varlık toplamı | 270.000.000 / 600.000.000 | %45 |\n| (b) İşlem tutarı / ortaklık değeri | 360.000.000\
    \ / 450.000.000 | **%80** |\n| (c) Varlıktan elde edilen gelir / toplam gelir | 700.000.000 / 1.000.000.000 | **%70**\
    \ |\n\nGamma Birinci ve İkinci Grup dışında, payları borsada işlem gören ve fiili dolaşım oranı %50'nin üzerinde bir\n\
    ortaklık olduğundan eşik **%50**'dir (md. 6/6). (b) ve (c) oranları %50'yi aştığından satış **önemli nitelikteki\nişlemdir**.\n\
    \nFiili dolaşım oranı %40 olsaydı genel eşik **%75** uygulanırdı; (b) oranı (%80) bu eşiği de aştığından sonuç\ndeğişmezdi.\n\
    \n**(b) Genel kurul nisabı**\n\nÖnemli nitelikteki işlemler genel kurulda, esas sözleşmede daha ağır nisap yoksa **toplantı\
    \ nisabı aranmaksızın**\nkatılanların **üçte iki** çoğunluğuyla; toplantıda sermayeyi temsil eden oy haklarının **en az\
    \ yarısı** hazırsa\nkatılanların **çoğunluğuyla** karara bağlanır (SPKn md. 29/6).\n\n- 10.000.000 pay katılmış (%40 <\
    \ %50): üçte iki gerekir; 10.000.000 × 2/3 = 6.666.667 pay. Olumlu oy 6.500.000\n  olduğundan **karar alınamaz**.\n- 14.000.000\
    \ pay katılmış (%56 ≥ %50): katılanların çoğunluğu yeterlidir; 7.500.000 > 7.000.000 olduğundan karar\n  **alınır**.\n\
    \n**(c) Ayrılma hakkı**\n\n- Ayrılma hakkı, genel kurula katılıp olumsuz oy veren ve **muhalefetini tutanağa geçirten**\
    \ pay sahiplerine\n  aittir (SPKn md. 24; Tebliğ md. 11/1). (Y) katılmadığı, (Z) muhalefet şerhi yazdırmadığı için **hak\
    \ sahibi\n  değildir**; (X) hak sahibidir.\n- Hak sahipliği, yönetim kurulu kararının kamuya açıklandığı tarihteki (10\
    \ Mart 2026) paylara göre belirlenir;\n  genel kurula kadar yapılan satışlar **son giren ilk çıkar** esasıyla düşülür\
    \ (md. 11/2). 25 Mart'taki 25.000\n  paylık satış önce 20 Mart'ta alınan 20.000 paydan, kalan 5.000 pay 10 Mart'taki paylardan\
    \ düşülür. Hakka konu\n  pay = 50.000 − 5.000 = **45.000 pay**.\n- Kullanım fiyatı: Yıldız Pazar dışındaki ortaklıklar\
    \ için açıklama tarihinden önceki **son altı aylık** ortalama\n  (bir ay otuz gün) = **18,00 TL** (md. 14/1); son bir\
    \ aylık ortalama (19,50 TL) yalnız Yıldız Pazar için geçerlidir.\n- (X)'in alacağı bedel = 45.000 × 18,00 = **810.000\
    \ TL**.\n\n**(d) Süre, ödeme ve borsa dışı fiyat**\n\nAyrılma hakkının kullandırılması genel kurul tarihinden itibaren\
    \ en geç **altı iş günü** içinde başlar ve **on iş\ngünü** sürer; aracı kurum vasıtasıyla kullandırılır ve bedel en geç\
    \ satışı takip eden iş günü ödenir (md. 12).\nBedel **tam ve nakden** ödenir (md. 14/5). Payları borsada işlem görmeyen\
    \ ortaklıkta fiyat, yönetim kurulu\nkararının kamuya açıklandığı tarihteki değeri esas alan bir **değerleme raporuyla**\
    \ belirlenir (md. 14/2).\n"
