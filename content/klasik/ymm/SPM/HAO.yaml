- id: YMM-SPM-HAO-K018
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - pay alım teklifi
  - pay alım teklifi bilgi formunun ilanı ve sorumluluk
  - teklifin durdurulması veya yasaklanması
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Kuzey Holding A.Ş.**, iki hedef ortaklık için pay alım teklifi yapmaktadır: payları borsada işlem gören **Gri Elektronik
    A.Ş.** ve payları borsada işlem görmeyen **Ada Lojistik A.Ş.** Kurul, her iki bilgi formunu **1 Haziran 2026 Pazartesi**
    günü onaylamıştır. Ada Lojistik için bilgi formunun yayımlandığı gazetede ilk ilan **2 Haziran 2026 Salı** günü yapılmıştır.
    Haziran 2026''da resmî tatil bulunmamaktadır. Teklif sürecinde, onaylanan Gri Elektronik bilgi formunda yer alan bazı
    bilgilerin yanlış olduğu anlaşılmıştır. Kurul, teklifi önce **durdurmuş**, sonra **yasaklamıştır**.


    **İstenenler:**

    (a) Gri Elektronik bilgi formunun nerede ve en geç hangi tarihe kadar ilan edileceğini belirtiniz. (6 puan)

    (b) Ada Lojistik bilgi formunun ilan edileceği yerleri belirtiniz ve gazetenin Kurula en geç hangi tarihe kadar gönderileceğini
    hesaplayınız. (7 puan)

    (c) Bilgi formundaki yanlış bilgiler nedeniyle sorumluluğun kime ait olduğunu belirtiniz. (4 puan)

    (d) Durdurma ve yasaklama hâllerinde teklife cevap verenlerin işlemlerinin akıbetini açıklayınız. (7 puan)

    '
  cozum: '**(a)** Kurulca onaylı bilgi formu, onay tarihinden itibaren **3 iş günü** içinde ilan edilir; hedef ortaklığın
    payları borsada işlem görüyorsa **KAP''ta ve ortaklığın kendi internet sitesinde** yayımlanır (II-26.1 md. 7/3-a). 1 Haziran
    Pazartesi + 3 iş günü: 2, 3, 4 Haziran → son gün **4 Haziran 2026 (Perşembe)**.


    **(b)** Payları borsada işlem görmeyen hedef ortaklıkta bilgi formu, şirket merkezinin bulunduğu yerde yayımlanan veya
    dağıtılan **en az bir gazetede, Kurulun ve varsa ortaklığın internet sitesinde** ilan edilir (md. 7/3-b). Gazete, ilk
    ilan tarihini takip eden **altı iş günü** içinde Kurula gönderilir (md. 7/4): 3, 4, 5, 8, 9, 10 Haziran → en geç **10
    Haziran 2026 (Çarşamba)**.


    **(c)** Bilgi formu onaylandıktan sonra yer alan bilgilerin yanlış, yanıltıcı veya eksik olduğunun ortaya çıkması hâlinde
    sorumluluk **teklifte bulunanlara, yatırım kuruluşuna ve bunlar adına bilgi formunu imzalayanlara** aittir (md. 7/5).


    **(d)** Kurul bu hâllerde teklifi durdurabilir veya yasaklayabilir (md. 8/1). **Durdurma** hâlinde, durdurma kararı kamuya
    duyuruluncaya kadar teklife cevap verenler işlemlerini **iptal etmeli veya geri almalıdır** (md. 8/2). **Yasaklama** hâlinde,
    yasaklama kararı kamuya duyuruluncaya kadar gerçekleştirilen işlemler (teklife cevap verenler aksini bildirmemişse) **geçerlidir**;
    karar kamuya duyurulduktan sonra yasaklanan teklife dayanılarak yapılan işlemler **geçersizdir** (md. 8/3).

    '
  puanlama:
  - olcut: (a) KAP ve internet sitesi; 3 iş günü; 4 Haziran 2026
    puan: 6
  - olcut: (b) Gazete, Kurulun ve ortaklığın internet sitesi
    puan: 3
  - olcut: (b) 6 iş günü sonucu 10 Haziran 2026
    puan: 4
  - olcut: (c) Teklifte bulunanlar, yatırım kuruluşu ve imzalayanlar
    puan: 4
  - olcut: (d) Durdurmada işlemlerin iptali/geri alınması
    puan: 3
  - olcut: (d) Yasaklamada duyuru öncesi geçerlilik, sonrası geçersizlik
    puan: 4
  kaynaklar:
  - mevzuat: II-26.1 Pay Alım Teklifi Tebliği
    madde: md. 7/3
    alinti: (3) Kurulca onaylı bilgi formu Kurulun onay tarihinden itibaren 3 iş günü içerisinde; a) Hedef ortaklığın paylarının
      borsada işlem görmesi durumunda, KAP’ta ve ortaklığın kendi internet sitesinde, b) Hedef ortaklığın paylarının borsada
      işlem görmemesi durumunda, şirket merkezinin bulunduğu mahalli ve/veya ülke çapında yayınlanan ya da dağıtılan en az
      bir gazetede, Kurulun ve varsa ortaklığın kendi internet sitesinde ilan edilir.
  - mevzuat: II-26.1 Pay Alım Teklifi Tebliği
    madde: md. 7/4
    alinti: (4) Bilgi formunun ilan edildiği gazete, ilk ilan tarihini takip eden altı iş günü içinde Kurula gönderilir.
  - mevzuat: II-26.1 Pay Alım Teklifi Tebliği
    madde: md. 7/5
    alinti: Bilgi formu Kurulca onaylandıktan sonra bu formda yer alan bilgilerin yanlış, yanıltıcı veya eksik olduğunun ortaya
      çıkması durumunda sorumluluk, teklifte bulunanlar, yatırım kuruluşu ve bunlar adına bilgi formunu imzalayanlara aittir.
  - mevzuat: II-26.1 Pay Alım Teklifi Tebliği
    madde: md. 8/2
    alinti: (2) Pay alım teklifinin durdurulması halinde, durdurma kararı kamuya duyuruluncaya kadar teklife cevap veren kişilerin
      bu işlemlerini iptal etmeleri ya da geri almaları zorunludur.
  - mevzuat: II-26.1 Pay Alım Teklifi Tebliği
    madde: md. 8/3
    alinti: (3) Pay alım teklifinin Kurul tarafından yasaklandığı durumlarda, yasaklama kararı kamuya duyuruluncaya kadar
      yasaklanan teklife dayanılarak gerçekleştirilen işlemler teklife cevap verenler aksini bildirmemişse geçerlidir. Ancak,
      yasaklama kararı kamuya duyurulduktan sonra yasaklanan teklife dayanılarak gerçekleştirilen işlemler geçersizdir.
