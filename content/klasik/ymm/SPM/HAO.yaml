  soru: '**Senaryo:**

    BCD Holding A.Ş. Borsa İstanbul''da işlem gören halka açık bir ortaklıktır. 2025 yılı bağımsız denetimden geçmiş finansal
    tablolarına göre net dönem kârı 15.000.000 TL, kanuni yedek akçe sonrası dağıtılabilir kâr 13.500.000 TL''dir. Esas sözleşmede
    kâr payı oranına ilişkin özel hüküm bulunmamaktadır.


    Aynı dönemde yönetim kurulu, şirketin toplam aktif büyüklüğünün yüzde otuz beşini oluşturan üretim tesisini üçüncü bir
    kişiye satmayı planlamaktadır. Bu işlem için henüz genel kurul onayı alınmamıştır.


    **(a)** SPK II-19.1 Tebliği''ne göre BCD Holding''in pay sahiplerine dağıtması gereken asgari birinci kâr payı tutarını
    hesaplayınız ve dağıtım kararının hangi organ tarafından alınacağını açıklayınız. (10 puan)


    **(b)** Üretim tesisi satışının II-23.3 sayılı Tebliğ kapsamında önemli nitelikteki işlem sayılıp sayılmadığını ve bu
    işlem için öngörülen zorunlu usul adımlarını mevzuat dayanakları ile açıklayınız. (10 puan)


    **(c)** Genel kurulda olumsuz oy kullanan pay sahiplerinin ayrılma hakkını nasıl ve ne zaman kullanabileceğini açıklayınız.
    (5 puan)

    '
  cozum: '**(a) Asgari Birinci Kâr Payı ve Karar Organı:**


    II-19.1 Tebliği md. 5 uyarınca esas sözleşmede özel oran belirlenmemişse asgari birinci kâr payı, dağıtılabilir kârın
    %20''sidir.


    Asgari birinci kâr payı = 13.500.000 × %20 = 2.700.000 TL


    Karar organı: Kâr payı dağıtım kararı münhasıran genel kurul tarafından alınır. Yönetim kurulunun bu konudaki yetkisi
    tavsiye niteliği taşır; kesin kararı genel kurul verir.


    **(b) Önemli Nitelikteki İşlem Tespiti ve Usul Adımları:**


    II-23.3 Tebliği md. 5 uyarınca bir işlemin "önemli nitelikte" sayılabilmesi için son finansal tablolardaki aktif toplamı,
    hasılat veya piyasa değeri gibi ölçütlere göre belirlenen eşiğin (%30) aşılması gerekmektedir.


    BCD Holding''in üretim tesisi satışı toplam aktiflerin %35''ini oluşturduğundan %30 eşiğini aştığı için önemli nitelikteki
    işlem kategorisine girer.


    Zorunlu usul adımları:

    1. Bağımsız yönetim kurulu üyelerinden yazılı görüş alınması (II-23.3 md. 6)

    2. Uzman kuruluştan bağımsız değerleme raporu hazırlatılması

    3. Genel kurula çağrı ve işleme ilişkin bilgi belgesinin hazırlanması

    4. Genel kurul onayının alınması


    Genel kurul onayı alınmadan işlem gerçekleştirilemez.


    **(c) Ayrılma Hakkının Kullanımı:**


    II-23.3 Tebliği md. 9 uyarınca genel kurulda olumsuz oy kullanan pay sahipleri, genel kurul kararının ticaret siciline
    tescil tarihinden itibaren 1 (bir) ay içinde ayrılma haklarını kullanabilir.


    Ayrılma hakkı kapsamında pay sahipleri, paylarını Kurul tarafından belirlenen esaslar çerçevesinde hesaplanan ayrılma
    hakkı fiyatından ortaklığa satabilir. Ayrılma hakkı kullanımı için olumsuz oy kullanılmış ve bu oy tutanağa geçmiş olmalıdır.

    '
