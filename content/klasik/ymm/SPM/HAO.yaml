  soru: 'Payları borsada işlem görmeyen iki halka açık ortaklığa ilişkin bilgiler aşağıdadır.


    Çam Gıda A.Ş. (Çam): Sermayesinin %96''sı 40 pay sahibine aittir. Ortaklığın son genel kurul toplantısı 20 Mart 2026 tarihinde
    yapılmıştır; Çam, bu toplantıya ait hazır bulunanlar listesine dayanarak 25 Eylül 2026 Cuma günü Kanun kapsamından çıkma
    talebiyle Kurula başvurmayı planlamaktadır.


    Meşe Tekstil A.Ş. (Meşe): Pay sahibi sayısı 640 olup sermayesi 8.000.000 paya ayrılmıştır; her pay bir oy verir. Meşe,
    paylarının borsada işlem görmesini istemediğinden genel kurul kararı ile Kanun kapsamından çıkmak üzere Kurula 15 Mayıs
    2026 tarihinde başvurmuştur. Bu başvuru için ortaklığın elinde 30.06.2025, 30.09.2025 ve 31.12.2025 tarihli, özel bağımsız
    denetimden veya bağımsız denetimden geçmiş finansal tablolar bulunmaktadır. Kurulun kararı Meşe tarafından 8 Haziran 2026
    Pazartesi günü tebellüğ edilmiştir; genel kurul 21 Temmuz 2026 Salı günü toplanmış, 430 pay sahibi toplam 5.400.000 oyla
    çıkma kararına olumlu oy kullanmıştır.


    (Hesaplanacak sürelerde resmî tatil bulunmadığı, hafta sonlarının iş günü olmadığı varsayılacaktır.)


    II-16.1 sayılı Ortaklıkların Kanun Kapsamından Çıkarılması ve Paylarının Borsada İşlem Görmesi Zorunluluğuna İlişkin Esaslar
    Tebliği''ne göre:

    a) Çam''ın planladığı başvuruda 20 Mart 2026 tarihli hazır bulunanlar listesi tek başına yeterli midir? Nedenini açıklayınız.

    b) Meşe''nin genel kurulunda alınan kararın karar yeter sayısını sağlayıp sağlamadığını hesaplayarak gösteriniz.

    c) Meşe''nin genel kurul gündem ilanını en geç hangi tarihte yapması gerekmektedir?

    d) Meşe''nin ayrılma hakkı fiyatını belirleyen değerleme raporunda hangi finansal tablolar esas alınabilir?

    e) Meşe''nin pay sahiplerine tanınacak ayrılma hakkı kullanım süresi en geç hangi tarihte başlar ve en az ne kadar sürer?
    Bu yolla Kanun kapsamından çıkan Meşe, sonradan halka açık ortaklık statüsünü ne zaman geri kazanmış sayılır?'
  cozum: 'a) Hayır. Md. 6/1-a''ya göre sermayesinin %95''inden fazlası en fazla elli pay sahibine ait olan ortaklık (Çam''da
    %96, 40 pay sahibi) ölçütü sağlar; ancak bu durum, başvuru tarihinden önceki son altı ay içinde yapılmış bir genel kurul
    toplantısına ait hazır bulunanlar listesi ile tevsik edilmelidir. 25 Eylül 2026''dan geriye altı ay 25 Mart 2026''dır;
    20 Mart 2026 tarihli toplantı bu dönemin dışında kaldığından liste yeterli değildir. Çam ya yeni bir genel kurul yapıp
    güncel liste sunmalı ya da md. 6/2 uyarınca diğer belgelere dayanıp bilirkişi raporu hazırlatmalıdır.


    b) Md. 5/5''e göre pay sahibi tam sayısının en az üçte ikisinin olumlu oyu veya toplam oyların dörtte üçü ile karar alınır.
    Pay sahibi tam sayısı 640 olduğundan 640 × 2/3 = 426,67, yani en az 427 pay sahibinin olumlu oyu gerekir; 430 pay sahibi
    olumlu oy kullanmıştır, koşul sağlanmıştır. Toplam oyların dörtte üçü 8.000.000 × 3/4 = 6.000.000 oy olup 5.400.000 oy
    bu ölçütü sağlamaz; ancak iki ölçüt ''veya'' ile bağlandığından biri yeterlidir. Karar yeter sayısı sağlanmıştır.


    c) Md. 5/2''ye göre gündem ilanı, Kurul kararının tebellüğünden itibaren on iş günü içinde yapılmalıdır. 8 Haziran 2026
    Pazartesi''den: 9-12 Haziran (4), 15-19 Haziran (9), 22 Haziran (10). Son gün 22 Haziran 2026''dır. (Genel kurul toplantısı
    da ayrıca tebellüğden itibaren iki ay içinde yapılmalıdır; 21 Temmuz 2026 bu süre içindedir.)


    d) Md. 5/4''e göre değerleme raporunda Kurula başvuru tarihinden önceki dokuz aydan daha eski tarihli olmamak kaydıyla
    finansal tablolar esas alınır. 15 Mayıs 2026''dan dokuz ay öncesi 15 Ağustos 2025''tir. 30.06.2025 tarihli tablolar bu
    tarihten eski olduğundan kullanılamaz; 30.09.2025 ve 31.12.2025 tarihli tablolar esas alınabilir.


    e) Md. 5/5''e göre ayrılma hakkı kullanım süresi genel kurul tarihinden itibaren en çok altı iş günü içinde başlar: 21
    Temmuz 2026 Salı''dan sonra 22, 23, 24, 27, 28, 29 Temmuz; en geç 29 Temmuz 2026. Süre iki yıldan az olmayacak şekilde
    belirlenir. Md. 11/3''e göre md. 5 uyarınca Kanun kapsamından çıkan ortaklık, Kurulun ilgili düzenlemeleri çerçevesinde
    paylarını yeniden halka arz etmediği sürece halka açık ortaklık statüsünü geri kazanmış sayılmaz.'
