  soru: 'Payları Borsa İstanbul''da işlem gören **Maviderya Gıda A.Ş.** (Maviderya) banka veya finansal kuruluş değildir;
    hesap dönemi takvim yılıdır. Yönetim kurulu 9 üyeden oluşmakta, 3 üyesi bağımsızdır (Ayten, Burak, Cemal). Aşağıdaki işlemlere
    ilişkin kararlar 12.03.2026 tarihinde alınmıştır.


    **Veriler** (31.12.2025 tarihli, 04.03.2026''da kamuya açıklanan yıllık tablolar)


    | Kalem | Tutar (milyon TL) |

    |---|---|

    | Varlık toplamı | 2.000 |

    | Hasılat | 1.600 |

    | Satışların maliyeti | 1.200 |

    | Toplam öz kaynak | 900 |

    | Vergi öncesi kâr (sürdürülen faaliyetler) | 50 |


    Yönetim kurulu karar tarihinden önceki son altı ayda günlük düzeltilmiş ağırlıklı ortalama fiyatların aritmetik ortalaması
    40 TL, pay sayısı 50.000.000''dur.


    **İlişkili taraflar:** Liman Gayrimenkul A.Ş. (hâkim ortağın %100 iştiraki) ve Bora Lojistik A.Ş. (yönetim kurulu başkanı
    Kaan Soylu''nun %70 ortağı olduğu şirket).


    **İşlemler**


    - **İşlem 1:** Maviderya, Liman''dan merkez ofis olarak kullanacağı bir ofis binasını 160 milyon TL''ye satın alacaktır.

    - **İşlem 2:** Maviderya, Bora Lojistik''e kullanım dışı bir depoyu 140 milyon TL''ye satacaktır. Deponun net defter değeri
    240 milyon TL, depodan 2025''te elde edilen kâr 4 milyon TL''dir.

    - **İşlem 2''nin karar süreci:** Yönetim kurulunda Ayten olumlu, Burak ve Cemal olumsuz oy kullanmış; Kaan Soylu da toplantıya
    katılarak olumlu oy vermiştir. İşlem genel kurula sunulmuş; toplantıda 36.000.000 pay temsil edilmiştir. Bunların 16.000.000
    payı Bora Lojistik, Kaan Soylu ve bunlarla ilişkili kişilere aittir. Diğer ortaklardan 9.000.000 pay olumlu, 11.000.000
    pay olumsuz oy kullanmıştır.

    - **2026 yılı planlanan ilişkili taraf işlemleri:**


    | No | İlişkili taraf | İşlem | 2026''da sayı | Toplam (milyon TL) |

    |---|---|---|---|---|

    | 3 | Mavi Ambalaj A.Ş. | Ambalaj malzemesi alımı | 5 sipariş | 150 |

    | 4 | Mavi Ambalaj A.Ş. | Nakliye hizmeti alımı | 6 sefer | 96 |

    | 5 | Mavi Pazarlama A.Ş. | Ürün satışı | 4 teslimat | 128 |

    | 6 | Mavi Bilişim A.Ş. | Yazılım lisansı alımı | 1 kez | 20 |


    - **Teminatlar:** (i) %100 bağlı ortaklığı Maviderya Ambalaj A.Ş. (tam konsolidasyon kapsamında) lehine 100 milyon TL
    kefalet; (ii) doğrudan %40 ortak olduğu iştiraki Doğu Soğuk Depo A.Ş.''nin 200 milyon TL''lik kredisi için 90 milyon TL
    kefalet; (iii) ilişkisiz ana tedarikçisi Ovakent Tarım Kooperatifi''nin Maviderya''ya hammadde teslimi için kullandığı
    kredi için 30 milyon TL kefalet; (iv) Liman''ın ofis yatırımını finanse eden 50 milyon TL''lik kredisi için ipotek.


    **İstenenler**


    (a) İşlem 1 ve 2 için Tebliğ''deki oranları hesaplayınız; her işlemde doğan yükümlülükleri belirtiniz. (7 puan)


    (b) İşlem 2''nin yönetim kurulu ve genel kurul sürecini değerlendiriniz (kararın alınıp alınmadığını hesabıyla gösteriniz);
    işlemin 6362 sayılı Kanun''un 21 inci maddesi bakımından ortaklığa yüklediği belge yükümlülüğünü ve saklama süresini belirtiniz.
    (6 puan)


    (c) 3, 4, 5 ve 6 numaralı işlemleri yaygın ve süreklilik arz eden işlemlere ilişkin esaslara göre değerlendiriniz. (6
    puan)


    (d) (i)–(iv) numaralı teminatların Tebliğ''e uygunluğunu değerlendiriniz; iştirak lehine verilebilecek azami tutarı hesaplayınız.
    (6 puan)

    '
  cozum: '## (a) İşlem 1 ve 2 (II-17.1 md. 9)


    Şirket değeri = 50.000.000 × 40 TL = 2.000 milyon TL. Toplam öz kaynak bu soruda gereksiz veridir (hasılata dayalı oran
    uygulanabilirdir; md. 9/2-c).


    **İşlem 1 (varlık alımı, md. 9/2-a):**


    | Oran | Hesap | Sonuç |

    |---|---|---|

    | Tutar / varlık toplamı | 160 / 2.000 | %8 |

    | Tutar / hasılat | 160 / 1.600 | %10 |

    | Tutar / şirket değeri | 160 / 2.000 | %8 |


    Oranlar %5''ten fazladır → işlem öncesi Kurulca belirlenen kuruluşa **değerleme** yaptırılır; işlem gayrimenkul olduğundan
    değerleme Kurulun gayrimenkul değerlemesine ilişkin düzenlemelerine göre yapılır (md. 9/4). Hiçbir oran %10''dan **fazla**
    değildir (hasılat oranı tam %10''dur) → bağımsız üye onayı (md. 9/3) **aranmaz**. İşlemden önce esasları belirleyen yönetim
    kurulu kararı alınır (md. 9/1); değerleme raporu özeti KAP''ta duyurulur (md. 9/6).


    **İşlem 2 (varlık satışı, md. 9/2-b):** Net defter değeri satış bedelinden yüksek olduğundan **net defter değeri (240)**
    esas alınır; varlığın devrinde hasılat yerine varlıktan elde edilen kârın vergi öncesi kâra oranı kullanılır.


    | Oran | Hesap | Sonuç |

    |---|---|---|

    | Net defter değeri / varlık toplamı | 240 / 2.000 | %12 |

    | Varlıktan elde edilen kâr / vergi öncesi kâr | 4 / 50 | %8 |

    | Net defter değeri / şirket değeri | 240 / 2.000 | %12 |


    (Satış bedeli 140 esas alınsaydı oranlar %7, %8, %7 olur ve %10 aşılmazdı; bu hesap yanlıştır.) %10''dan fazla bir orana
    ulaşıldığından değerlemeye ek olarak **bağımsız üyelerin çoğunluğunun onayı** aranır (md. 9/3).


    ## (b) İşlem 2''nin süreci


    - İlişkili taraf niteliğindeki üye (Kaan Soylu) görüşmede oy kullanamaz. Bağımsız üyelerden 3''ün 2''si (Burak, Cemal)
    onaylamadığından çoğunluk onayı yoktur → durum yeterli bilgiyle **KAP''ta açıklanır ve işlem genel kurul onayına sunulur**
    (md. 9/3).

    - Genel kurulda işlemin tarafları ve bunlarla ilişkili kişiler oy kullanamaz; toplantı nisabı aranmaz, oy hakkı bulunanların
    basit çoğunluğu ile karar alınır. Oylamada 36.000.000 − 16.000.000 = 20.000.000 pay vardır; olumlu 9.000.000 (%45), olumsuz
    11.000.000 → basit çoğunluk **sağlanamamış**, genel kurul onayı alınamamıştır. (İlişkili oylar sayılsaydı 25/36 = %69,4
    çıkardı; bu yanlıştır.) Esaslara uygun alınmayan kararlar geçerli sayılmaz.

    - SPKn md. 21/3: Ortaklık, ilişkili taraf işlemlerinin emsallerine, piyasa teamüllerine ve basiret ilkelerine uygun şartlarda
    yapıldığını belgelemek ve belgeleri **en az sekiz yıl** saklamak zorundadır. Depo net defter değerinin altında (140 <
    240) satılmakta olup emsallere aykırı fiyat, md. 21/1 kapsamında örtülü kazanç aktarımı riski doğurur.


    ## (c) Yaygın ve süreklilik arz eden işlemler (md. 10)


    Bir hesap döneminde en az iki kez yapılan aynı nitelikteki işlemler yaygın ve süreklilik arz edendir (md. 3/m). Aynı nitelikteki
    işlemler toplu, farklı nitelikteki işlemler ayrı ayrı değerlendirilir (md. 10/2).


    | No | Hesap | Oran | Sonuç |

    |---|---|---|---|

    | 3 | 150 / 1.200 (satışların maliyeti) | %12,5 | %10''u aşar → yönetim kurulu kararına ek **rapor**; rapor veya sonucu
    KAP''ta açıklanır |

    | 4 | 96 / 1.200 | %8 | Farklı nitelik, ayrı değerlendirilir; eşik altı, yalnız yönetim kurulu kararı (md. 10/1). (3 ile
    toplanıp 246/1.200 = %20,5 hesaplamak yanlıştır) |

    | 5 | 128 / 1.600 (hasılat) | %8 | Eşik altı; yönetim kurulu kararı yeterli |

    | 6 | Tek sefer | – | Yaygın ve süreklilik arz eden değil; md. 9 oranı 20 / 2.000 = %1 < %5 → değerleme gerekmez |


    Rapora asgari olarak taraf şirketlere ve ilişkinin niteliğine ilişkin bilgi, sözleşme bilgileri, piyasa koşullarına uygunluk
    kriterleri ve değerlendirme yazılır (md. 10/3). Bağımsız üyelerin çoğunluğu işlemleri onaylamazsa muhalefet gerekçesi
    KAP''ta açıklanır (md. 10/2).


    ## (d) Teminat, rehin, ipotek ve kefalet (md. 12)


    Ortaklık kural olarak yalnız kendi lehine, tam konsolidasyon kapsamındaki ortaklıklar lehine ve olağan ticari faaliyetin
    yürütülmesi amacıyla üçüncü kişiler lehine teminat verebilir (md. 12/1).


    - **(i)** %100 bağlı ortaklık (tam konsolidasyon): **uygun** (md. 12/1-b).

    - **(ii)** İştirak: doğrudan katılım oranında verilebilir (md. 12/2): 200 × %40 = **80 milyon TL** azami; 90 milyon TL,
    **10 milyon TL** aşım nedeniyle aykırıdır.

    - **(iii)** Olağan ticari faaliyet için ilişkisiz üçüncü kişi: **uygun** (md. 12/1-c); ancak yönetim kurulu kararında
    bağımsız üyelerin çoğunluğunun onayı aranır, ilişkili üyeler oy kullanamaz (md. 12/3).

    - **(iv)** Hâkim ortağın iştiraki Liman lehine ipotek: olağan ticari faaliyet amacı yok → **aykırı** (md. 12/1).

    - Verilen teminatlar ve elde edilen gelir/menfaatler olağan genel kurul gündeminde ayrı madde olarak yer alır (md. 12/4).

