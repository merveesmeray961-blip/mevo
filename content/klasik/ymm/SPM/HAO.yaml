- id: YMM-SPM-HAO-K001
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - birleşme ve bölünme
  - önemli nitelikteki işlemler ve ayrılma hakkı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları borsada **Yıldız Pazar dışındaki** bir pazarda işlem gören **Upsilon A.Ş.** ile payları borsada işlem görmeyen
    ve halka açık olmayan **Phi A.Ş.** arasında, Upsilon A.Ş.''nin devralan taraf olduğu bir **devralma yoluyla birleşme**
    planlanmaktadır. İşleme ilişkin bilgiler şöyledir:


    | Bilgi | Tutar / Açıklama |

    |---|---|

    | Upsilon A.Ş. çıkarılmış sermayesi (tamamı oy hakkını haiz, 1 TL = 1 oy) | 60.000.000 TL |

    | Birleşme nedeniyle Upsilon A.Ş.''de yapılacak sermaye artırımı | 36.000.000 TL |

    | Phi A.Ş. ortaklarına tahsis edilecek Upsilon paylarının birleşmeye esas değeri | 180.000.000 TL |

    | Birleşmeye taraf şirket sayısı | 2 |

    | Birleşmeye ilişkin yönetim kurulu kararının KAP''ta açıklandığı tarih (öncesinde açıklama yoktur) | 2 Mart 2026 |

    | Açıklama tarihinden önceki son 1 aylık dönemde günlük düzeltilmiş ağırlıklı ortalama fiyatların aritmetik ortalaması
    | 18 TL |

    | Açıklama tarihinden önceki son 6 aylık dönemde aynı ortalama | 15 TL |

    | Tarafların hesap dönemi | Takvim yılı |

    | Bağımsız denetimden geçmiş mevcut finansal tablolar | 31.12.2025 yıllık; 30.06.2026 ara dönem (6 aylık) |

    | Birleşmenin onaylanacağı genel kurul tarihi | 15 Ekim 2026 (işlem genel kurulca onaylanmıştır) |


    Pay sahibi **T**, 2 Mart 2026''da 4.000 Upsilon payına sahiptir ve genel kurula kadar alım satım yapmamıştır; genel kurulda
    işleme olumsuz oy vermiş ve muhalefetini tutanağa geçirtmiştir. Birleşme kolaylaştırılmış usulde yapılmamaktadır ve Kurulca
    ayrılma hakkı muafiyeti tanınmamıştır.


    **İstenenler** (Birleşme ve Bölünme Tebliği (II-23.2) ve Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    çerçevesinde):


    (a) Birleşmenin Upsilon A.Ş. bakımından önemli nitelikteki işlem sayılıp sayılmadığını gerekçesiyle belirtiniz. Sermaye
    artırımı 27.000.000 TL olsaydı sonuç ne olurdu? (5 puan)


    (b) Taraf sayısı ve payların borsada işlem görme durumu dikkate alındığında, birleşme nedeniyle Upsilon A.Ş.''de yapılabilecek
    sermaye artırımının üst sınırını hesaplayınız ve planlanan artırımın bu sınıra uygunluğunu değerlendiriniz. (4 puan)


    (c) Değişim oranları belirlenirken Phi A.Ş. ortaklarına öngörülebilecek denkleştirme ödemesinin azami tutarını hesaplayınız.
    (4 puan)


    (d) Birleşmeye esas alınacak finansal tabloları gerekçesiyle belirleyiniz ve bu tabloların taşıması gereken denetim koşulunu
    açıklayınız. (5 puan)


    (e) T''nin ayrılma hakkına sahip olup olmadığını, ödenecek bedeli ve ayrılma hakkının kullanım sürecine ilişkin süreleri
    ve ödeme esaslarını açıklayınız. (7 puan)

    '
  cozum: '**(a) Önemli nitelikteki işlem (II-23.3 md. 4/1-a, 5/1-b)**


    Devralma şeklinde birleşmede halka açık ortaklık **devralan taraf** ise, işlem ancak birleşme sonucunda **%50 veya daha
    fazla sermaye artırımı** yapılacaksa önemli nitelikteki işlem sayılır.

    Artırım oranı = 36.000.000 / 60.000.000 = **%60 ≥ %50** → **önemli nitelikteki işlemdir**.

    Artırım 27.000.000 TL olsaydı oran 27.000.000 / 60.000.000 = %45 < %50 olacağından Upsilon A.Ş. bakımından önemli nitelikteki
    işlem **sayılmazdı** (ayrılma hakkı doğmazdı).


    **(b) Sermaye artırımının üst sınırı (II-23.2 md. 12/4-a)**


    Taraf sayısının iki olduğu, payları borsada işlem gören halka açık ortaklık ile payları borsada işlem görmeyen şirketin
    devralma şeklindeki birleşmesinde, borsada işlem gören ortaklığın sermayesinin **%100''den fazla artması** ile sonuçlanacak
    birleşme yapılamaz.

    Üst sınır = 60.000.000 × %100 = **60.000.000 TL**. Planlanan 36.000.000 TL bu sınırın altında olduğundan **uygundur**.


    **(c) Denkleştirme ödemesi (II-23.2 md. 11/2)**


    Denkleştirme ödemesi, devrolunan şirket ortaklarına tahsis olunan payların birleşmeye esas değerlerinin **onda birini**
    aşamaz (TTK md. 140 çerçevesinde).

    Azami denkleştirme = 180.000.000 / 10 = **18.000.000 TL**.


    **(d) Esas alınacak finansal tablolar (II-23.2 md. 6/1-2)**


    Genel kurul, hesap dönemi sonunu (31.12.2025) takip eden **dördüncü ayın başı (1 Nisan 2026) ile sekizinci ayın sonu (31
    Ağustos 2026)** arasında yapılsaydı son yıllık tablolar esas alınırdı. Genel kurul **15 Ekim 2026**''da yapıldığından
    bu aralığın dışındadır; bu durumda **en az 6 aylık faaliyet dönemini kapsayan** ve tablo tarihi ile genel kurul tarihi
    arasında **altı aydan fazla süre bulunmayan** ara dönem tablolar esas alınır.

    30.06.2026 tarihli tablolar 6 aylık dönemi kapsar ve genel kurula 3,5 ay kalmıştır → **30.06.2026 ara dönem finansal tabloları**
    esas alınır; 31.12.2025 yıllık tabloları kullanılamaz.

    Tablolar Kurulun muhasebe standartlarına göre hazırlanmış ve **özel bağımsız denetimden** geçirilmiş olmalıdır; ancak
    Kurul düzenlemeleri uyarınca bağımsız denetimi yapılmışsa özel bağımsız denetim aranmaz. Konsolide tablo düzenlemekle
    yükümlü olanların konsolide, diğerlerinin solo tabloları esas alınır.


    **(e) Ayrılma hakkı (II-23.3 md. 11, 12, 14)**


    - **Hak sahipliği:** Payları borsada işlem gören ortaklıkta yönetim kurulu kararının kamuya açıklandığı tarih (2 Mart
    2026) itibarıyla pay sahibi olan, genel kurula katılıp olumsuz oy veren ve muhalefetini tutanağa geçirten pay sahipleri
    ayrılma hakkına sahiptir. T bu şartları taşır; sonradan satış yapmadığı için **4.000 pay** hakka konudur.

    - **Fiyat:** Yıldız Pazar dışındaki ortaklıklarda açıklama tarihinden önceki **son altı aylık** ortalama esas alınır →
    **15 TL**.

    - **Bedel:** 4.000 × 15 = **60.000 TL**; tam ve nakden ödenir (md. 14/5). T hakkını, bu hakka sahip paylarının **tamamı**
    için kullanmak zorundadır (md. 12/4).

    - **Süreler ve usul:** Ayrılma hakkı **aracı kurum vasıtasıyla** kullandırılır; kullandırılması genel kurul tarihinden
    itibaren **en geç altı iş günü içinde başlar** ve kullanım süresi başlangıçtan itibaren **on iş günüdür** (md. 12/1-2).
    Pay bedelleri ortaklık tarafından **en geç satışı takip eden iş günü** ödenir (md. 12/3).

    '
  puanlama:
  - olcut: (a) Devralan taraf için %50 ölçütünü belirtme (2), %60 hesaplayıp önemli nitelikte olduğunu tespit (2), %45 durumunda
      önemli nitelik taşımayacağını belirtme (1)
    puan: 5
  - olcut: (b) İki taraflı birleşmede %100 sınırını belirtme (2), 60.000.000 TL üst sınırı ve uygunluk tespiti (2)
    puan: 4
  - olcut: (c) Onda bir kuralını belirtme (2), 18.000.000 TL'yi hesaplama (2)
    puan: 4
  - olcut: (d) 4. ay başı-8. ay sonu aralığını belirtip 15 Ekim 2026'nın dışında kaldığını tespit (2), en az 6 aylık ve 6
      aydan eski olmayan ara dönem şartıyla 30.06.2026 tablolarını seçme (2), özel bağımsız denetim koşulu ve istisnası (1)
    puan: 5
  - olcut: (e) Hak sahipliği şartları ve T'nin hakkı (2), altı aylık ortalamanın seçimi ve 60.000 TL bedel (2), payların tamamı
      için kullanım ve tam/nakden ödeme (1), 6 iş günü başlangıç, 10 iş günü kullanım, aracı kurum ve ertesi iş günü ödeme
      (2)
    puan: 7
