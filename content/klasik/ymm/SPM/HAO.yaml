  soru: '**Senaryo:**

    EFG A.Ş. Borsa İstanbul''da işlem gören ve kayıtlı sermaye sistemini benimseyen halka açık bir ortaklıktır. Kayıtlı sermaye
    tavanı 200.000.000 TL, çıkarılmış sermayesi 100.000.000 TL''dir.


    Yönetim kurulu; (i) kayıtlı sermaye tavanı dahilinde 30.000.000 TL sermaye artışı yapmak ve (ii) aktif büyüklüğünün %25''ini
    aşan bir iştirak hissesi satışı gerçekleştirmek istemektedir.


    **(a)** SPK II-18.1 Tebliği uyarınca yönetim kurulunun 30.000.000 TL''lik sermaye artışını gerçekleştirmek için hangi
    adımları izlemesi gerektiğini açıklayınız. (10 puan)


    **(b)** İştirak hissesi satışının II-23.3 Tebliği kapsamında önemli nitelikteki işlem sayılıp sayılmadığını ve olası ayrılma
    hakkı uygulamasını açıklayınız. (10 puan)

    '
  cozum: '**(a) Kayıtlı Sermaye Sisteminde Sermaye Artışı:**


    II-18.1 Tebliği md. 6 uyarınca kayıtlı sermaye sisteminde yönetim kurulu, kayıtlı sermaye tavanı içinde kalmak kaydıyla
    genel kurulun ayrı onayına gerek kalmaksızın sermaye artışı kararı alabilir.


    Adımlar:

    1. Yönetim kurulu; sermaye artış kararını, payların fiyatını ve rüçhan hakkına ilişkin kararı alır.

    2. Kurul''un ilgili tebliğ hükümleri çerçevesinde kayda alma başvurusu yapılır.

    3. Artış kararı KAP üzerinden kamuya açıklanır.

    4. Yeni paylar ihraç edilir.


    30.000.000 TL artış sonrasında çıkarılmış sermaye 130.000.000 TL olacak ve 200.000.000 TL''lik tavan aşılmayacaktır; dolayısıyla
    bu artış yönetim kurulunun yetkisi dahilindedir.


    **(b) İştirak Satışı — Önemli Nitelikteki İşlem Değerlendirmesi:**


    II-23.3 Tebliği md. 5 uyarınca aktif büyüklüğünün %30''unu aşan işlemler önemli nitelikteki işlem sayılmaktadır.


    Söz konusu iştirak satışı aktif büyüklüğünün %25''ini oluşturduğundan %30 eşiğinin altında kalmakta; bu nedenle II-23.3
    Tebliği kapsamında önemli nitelikteki işlem kategorisine girmemektedir. Genel kurul onayı ve ayrılma hakkı yükümlülükleri
    doğmayacaktır.


    Bununla birlikte; işlem özel durum niteliği taşıyorsa II-15.1 Tebliği kapsamında KAP üzerinden açıklanması gerekebilir.

    '
