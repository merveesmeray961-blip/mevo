    **Gelişme 1:** Şirketin genel müdürü Şubat 2026''da görevinden istifa etmiş; bu durum Kamuyu Aydınlatma Platformu''na
    (KAP) üç gün sonra bildirilmiştir.


    **Gelişme 2:** Şirket Mart 2026''da ana pazarındaki kritik bir müşteriyle sözleşme imzalamış; bu gelişme üç ay sonra KAP''a
    bildirilmiştir.


    **Gelişme 3:** Yönetim Kurulu Temmuz 2026''da önemli nitelikteki bir işlem gerçekleştirmiş; ancak bağımsız yönetim kurulu
    üyelerinin görüşü alınmamıştır.


    (a) Gelişme 1 ve 2 bakımından özel durum açıklamasına ilişkin bildirim yükümlülüğünü ve ihlal koşullarını değerlendiriniz.
    (10 puan)


    (b) Gelişme 3''te bağımsız yönetim kurulu üyelerinin görüşünün alınmamasının kurumsal yönetim ilkeleri çerçevesindeki
    sonuçlarını açıklayınız. (15 puan)

    '
  cozum: '**(a) Özel durum açıklaması:**


    II-15.1 sayılı Özel Durumlar Tebliği uyarınca halka açık ortaklıklar, içsel bilgi niteliğindeki özel durumları en kısa
    sürede KAP''a bildirmek zorundadır.


    **Gelişme 1 (Genel Müdür İstifası):** Genel müdürün görevden ayrılması özel durum niteliğindedir. Üç günlük gecikme, Tebliğ''in
    "en kısa sürede" zorunluluğuyla bağdaşmayabilir; ihmal niteliğinde bir ihlal olup idari yaptırıma yol açabilir.


    **Gelişme 2 (Kritik Sözleşme):** Ana pazarda kritik müşteriyle sözleşme imzalanması şirketin faaliyetlerini ve pay fiyatını
    etkileyebilecek içsel bilgi niteliğindedir. Üç aylık gecikme açıkça tebliğ ihlalidir; Kurul idari para cezası uygulayabilir.


    **(b) Önemli nitelikteki işlem ve bağımsız üye görüşü:**


    II-23.3 sayılı Önemli Nitelikteki İşlemler Tebliği ve Kurumsal Yönetim Tebliği (II-17.1) uyarınca önemli nitelikteki işlemlerde
    bağımsız yönetim kurulu üyelerinin görüşünün alınması zorunludur.


    Bağımsız üye görüşünün alınmaması:

    - Tebliğ hükümlerine aykırılık oluşturur,

    - İşlem prosedürel açıdan sakat sayılabilir,

    - Azınlık pay sahipleri işleme itiraz edebilir,

    - Kurul idari yaptırım uygulayabilir,

    - Yönetim kurulu üyeleri hukuki sorumlulukla karşılaşabilir.

    '
