  - olcut: (b) Haberle gizliliğin bozulması ve derhal açıklama yükümlülüğü
    puan: 3
  - olcut: (c) Yazılı sözleşmeyle %56'ya ulaşılması ve teklif zorunluluğu
    puan: 3
  - olcut: (c) 44.000.000 pay ve asgari fiyat 46 TL
    puan: 4
  - olcut: (c) Asgari teklif tutarı 2.024.000.000 TL
    puan: 2
  - olcut: (d) 6 iş günü, 2 ay ve 10–20 iş günü süreleri; koşula bağlanamama
    puan: 3
  - olcut: (d) Md. 103/3 idari para cezası
    puan: 2
