- id: YMM-SPM-HAO-K019
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - önemli nitelikteki işlemler ve önemlilik ölçütü
  - ayrılma hakkı (hak sahipleri, fiyat, süreler)
  - ayrılma hakkının doğmadığı haller ve muafiyet
  - genel kurul nisapları
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları Borsa İstanbul''da Yıldız Pazar dışındaki bir pazarda işlem gören **Çınar Makine Sanayi A.Ş.** (Çınar) konsolide
    finansal tablo hazırlamaktadır. Kurumsal Yönetim Tebliği (II-17.1) uyarınca Üçüncü Grupta yer alan Çınar, gayrimenkul
    veya girişim sermayesi yatırım ortaklığı değildir. Ödenmiş sermayesi 40.000.000 paydan (pay başına nominal 1 TL, her pay
    bir oy hakkı verir) oluşmakta; fiili dolaşımdaki pay oranı %60''tır. Esas sözleşmede önemli nitelikteki işlemlere ilişkin
    daha ağır bir nisap öngörülmemiştir. Aşağıdaki tarihlerde resmî tatil bulunmadığı kabul edilecektir.


    **Veriler**


    - Kamuya açıklanmış son konsolide finansal tablolar 31.12.2025 tarihlidir; aktif toplamı 800 milyon TL''dir.

    - Yönetim kurulu karar tarihinden önceki son altı aylık dönemde günlük düzeltilmiş ağırlıklı ortalama borsa fiyatlarının
    aritmetik ortalaması 30 TL''dir.


    **Olaylar**


    1. 25.11.2025''te Çınar, Gebze''deki üretim kampüsünün bitişiğindeki arsayı (kayıtlı değeri 150 milyon TL) ilişkisiz bir
    alıcıya 180 milyon TL bedelle satmıştır. Arsa ve kampüs birlikte tek bir üretim bütünlüğü oluşturmaktadır.

    2. Yönetim kurulu, 20.04.2026 (Pazartesi) tarihinde kampüsteki üretim tesisinin (kayıtlı değeri 260 milyon TL) ilişkisiz
    bir alıcıya 300 milyon TL bedelle satılmasına karar vermiştir. Karar aynı gün KAP''ta, Borsa pay piyasası işlem saatleri
    içinde açıklanmıştır. Genel müdür ise tesisin satılacağını 14.04.2026 (Salı) günü bir sektör toplantısında basına açıklamıştır.

    3. İşlem, 08.06.2026 (Pazartesi) tarihli genel kurulda görüşülmüştür. Toplantıda 24.000.000 pay temsil edilmiş; 13.000.000
    pay olumlu, 11.000.000 pay olumsuz oy kullanmıştır.

    4. Üç pay sahibinin durumu aşağıdadır. Alım ve satımların tamamı farklı günlerde gerçekleşmiş olup gün sonu bakiyeler
    esas alınacaktır; üçü de genel kurula katılmış ve olumsuz oy kullanmıştır.


    | Pay sahibi | 14.04.2026 gün sonu payı | Sonraki işlemler | Muhalefet şerhi |

    |---|---|---|---|

    | Pusula Yatırım A.Ş. | 2.000.000 pay | 15.04.2026''da 1.000.000 pay alım; 04.06.2026''da 1.500.000 pay satım | Tutanağa
    geçirilmiştir |

    | Gülay Ersoy | Yok | 20.05.2026''da 3.000.000 pay alım | Tutanağa geçirilmiştir |

    | Tuna Danışmanlık Ltd. Şti. | 1.200.000 pay | İşlem yok | Tutanağa geçirilmemiştir |


    5. 14.04.2026''dan önceki son altı aylık dönemde, her ay için günlük düzeltilmiş ağırlıklı ortalama fiyatların aylık aritmetik
    ortalamaları sırasıyla 20, 22, 24, 26, 28 ve 30 TL''dir (her ayda işlem günü sayısı eşittir). Aynı tarihten önceki son
    bir aylık dönemin ortalaması 30 TL''dir.

    6. Çınar yönetim kurulu 18.06.2026 (Perşembe) tarihinde, yukarıdaki işlemlerden bağımsız olarak önemlilik ölçütünü sağladığı
    kabul edilen iki ayrı mal varlığı devrine daha karar vermiştir: (i) sermayesinin %100''üne sahip olduğu Çınar Enerji A.Ş.''ye
    devir, (ii) sermayesinin %80''ine sahip olduğu Çınar Lojistik A.Ş.''ye devir.


    **İstenenler**


    (a) 1 ve 2 numaralı olayları birlikte değerlendirerek tesis satışının önemli nitelikteki işlem sayılıp sayılmadığını önemlilik
    ölçütlerine göre hesaplayınız; arsa satışı hiç yapılmamış olsaydı sonucun ne olacağını belirtiniz. (7 puan)


    (b) Yönetim kurulu kararının açıklanması ve genel kurula götürülmesi bakımından süreçte aykırılık bulunup bulunmadığını
    değerlendiriniz; 3 numaralı olaydaki genel kurulda kararın alınıp alınmadığını nisap yönünden inceleyiniz. Toplantıda
    18.000.000 pay temsil edilip 11.000.000 pay olumlu oy kullanmış olsaydı sonuç ne olurdu? (6 puan)


    (c) 4 ve 5 numaralı olaylara göre hangi pay sahiplerinin ayrılma hakkı bulunduğunu, Pusula Yatırım A.Ş.''nin ayrılma hakkına
    konu pay tutarını, ayrılma hakkı kullanım fiyatını ve toplam bedeli hesaplayınız; ayrılma hakkının kullandırılmasına en
    geç başlanabilecek tarihi, ayrılma hakkına konu payların diğer pay sahiplerine veya yatırımcılara önerilmesi hâlinde alım
    taleplerinin iletilebileceği son günü ve yönetim kurulunun bu konuda karar alacağı günü belirtiniz. (8 puan)


    (d) 6 numaralı iki devir bakımından ayrılma hakkı ve genel kurul gerekliliğini değerlendiriniz; (ii) numaralı devir için
    başvurulabilecek yolu ve başvurunun yapılabileceği son tarihi belirtiniz. (4 puan)

    '
  cozum: "**Varsayım:** Resmî tatil bulunmadığından iş günü hesabında yalnızca hafta sonları dışlanmıştır.\n\n## (a) Önemlilik\
    \ ölçütü (II-23.3 md. 4, 6)\n\nMal varlığı devri, md. 4/1-(c) kapsamında önemli nitelikteki işlem olabilir; önemlilik\
    \ ölçütü yönetim kurulu karar tarihi itibarıyla aşağıdaki oranlardan **birinin** eşiği aşmasıdır (md. 6/1).\n\n- **Eşik:**\
    \ Normal eşik %75'ten fazla olmasıdır. Çınar Üçüncü Grupta, GYO/GSYO değildir ve fiili dolaşımdaki pay oranı %60 (> %50)\
    \ olduğundan birinci fıkradaki oran **%50** olarak uygulanır (md. 6/6).\n- **Konsolide tablolar:** Hem konsolide hem solo\
    \ tablo varsa konsolide tablolar esas alınır (md. 6/8).\n- **12 ay kuralı:** Ekonomik bütünlük oluşturan mal varlığına\
    \ ilişkin işlemler ilk işlem tarihinden itibaren 12 aylık dönemde birkaç seferde yapılırsa tek işlem sayılır (md. 6/7).\
    \ İlk işlem 25.11.2025, ikinci karar 20.04.2026 olduğundan (12 aylık dönem 25.11.2026'ya kadar) iki satış **tek işlemdir**.\n\
    - **Ortaklık değeri:** 40.000.000 pay × 30 TL = 1.200 milyon TL.\n\n| Ölçüt | Yalnız tesis | Tesis + arsa (tek işlem)\
    \ |\n|---|---|---|\n| Kayıtlı değer / aktif toplamı (md. 6/1-a) | 260 / 800 = %32,5 | (260 + 150) / 800 = **%51,25** |\n\
    | İşlem tutarı / ortaklık değeri (md. 6/1-b) | 300 / 1.200 = %25 | (300 + 180) / 1.200 = %40 |\n\n**Sonuç:** Birleşik\
    \ işlemde kayıtlı değer / aktif oranı %51,25 > %50 olduğundan işlem **önemli nitelikteki işlemdir** (tek ölçütün aşılması\
    \ yeterlidir). Arsa satışı olmasaydı iki oran da (%32,5 ve %25) %50'nin altında kalır; ayrıca %75 eşiği de aşılmadığından\
    \ işlem önemli nitelikte **olmazdı**. Bu nedenle 12 aylık birleştirme ve %50 eşiği birlikte sonucu belirler.\n\n## (b)\
    \ Süreç ve nisap (md. 7, 8, 10; SPKn md. 29/6)\n\n- **Açıklama zamanı:** Payları borsada işlem gören ortaklıklar, yönetim\
    \ kurulu kararına ilişkin özel durum açıklamasını Borsa pay piyasası işlem saatleri **dışında** yapar (md. 8/2). Kararın\
    \ işlem saatleri içinde açıklanması **aykırıdır**.\n- **Genel kurulun toplanma süresi:** Önemli nitelikteki işlem, yönetim\
    \ kurulu karar tarihinden itibaren en geç üç ay içinde toplanacak genel kurulun onayına sunulur (md. 10/1). Son gün 20.07.2026'dır;\
    \ 08.06.2026 tarihli toplantı **uygundur**.\n- **Nisap:** Toplantı nisabı aranmaz; katılan oy hakkını haiz payların üçte\
    \ ikisinin olumlu oyu gerekir. Ancak sermayeyi temsil eden oy hakkını haiz payların en az yarısı toplantıda hazır bulunursa\
    \ katılan payların çoğunluğu yeterlidir (md. 10/2; SPKn md. 29/6).\n  - Gerçek durum: 24.000.000 / 40.000.000 = %60 ≥\
    \ %50 → çoğunluk yeterli; 13.000.000 olumlu oy, katılan 24.000.000 payın yarısı olan 12.000.000'dan fazladır (%54,17)\
    \ → **karar alınmıştır**.\n  - Alternatif durum: 18.000.000 / 40.000.000 = %45 < %50 → üçte iki aranır: 18.000.000 × 2/3\
    \ = 12.000.000 olumlu oy gerekir; 11.000.000 yetersizdir → **karar alınamaz**.\n\n## (c) Ayrılma hakkı (md. 11–14)\n\n\
    - **Referans tarih:** Yönetim kurulu kararının kamuya açıklanmasından önce ortaklık yetkililerince işleme ilişkin bir\
    \ kamuya açıklama yapılmışsa bu açıklamanın tarihi esas alınır (md. 11/2). Genel müdürün 14.04.2026 tarihli açıklaması\
    \ nedeniyle hak sahipleri **14.04.2026** itibarıyla belirlenir (yönetim kurulu kararı tarihi 20.04.2026 esas alınmaz).\n\
    - **Hak sahipleri:** Gülay Ersoy 14.04.2026'da pay sahibi olmadığından hakkı yoktur. Tuna Danışmanlık muhalefet şerhini\
    \ tutanağa geçirtmediğinden hakkı yoktur (md. 11/1; md. 11/5'teki istisnalardan biri de yoktur). Pusula Yatırım hak sahibidir.\n\
    - **Pay tutarı (son giren ilk çıkar):** Genel kurul tarihine kadar yapılan satışlar, referans tarihteki paylardan son\
    \ giren ilk çıkar esasına göre düşülür (md. 11/2).\n\n| Tarih | Hareket | Lot 1 (14.04 bakiyesi) | Lot 2 (15.04 alımı)\
    \ |\n|---|---|---|---|\n| 14.04.2026 | Referans bakiye | 2.000.000 | – |\n| 15.04.2026 | +1.000.000 alım | 2.000.000 |\
    \ 1.000.000 |\n| 04.06.2026 | −1.500.000 satım (önce son giren) | 2.000.000 − 500.000 = 1.500.000 | 1.000.000 − 1.000.000\
    \ = 0 |\n\n  Ayrılma hakkına konu pay tutarı **1.500.000** paydır. (2.000.000 − 1.500.000 = 500.000 hesabı yanlıştır;\
    \ çünkü satış önce 15.04'te alınan paylardan düşülür.)\n- **Fiyat:** Yıldız Pazar dışındaki ortaklıklarda referans tarihten\
    \ önceki son **altı** aylık günlük düzeltilmiş ağırlıklı ortalama fiyatların aritmetik ortalaması esastır (md. 14/1);\
    \ son bir aylık ortalama (30 TL) yalnız Yıldız Pazar için geçerlidir. Fiyat = (20 + 22 + 24 + 26 + 28 + 30) / 6 = **25\
    \ TL**.\n- **Toplam bedel:** 1.500.000 × 25 = **37.500.000 TL** (tam ve nakden ödenir, md. 14/5).\n- **Süre:** Ayrılma\
    \ hakkının kullandırılması genel kurul tarihinden itibaren en geç altı iş günü içinde başlar (md. 12/2): 09, 10, 11, 12,\
    \ 15, 16 Haziran → en geç **16.06.2026 (Salı)**; kullanım süresi başlangıçtan itibaren on iş günüdür.\n- **Payların önerilmesi\
    \ (md. 13):** Alım talepleri genel kurul tarihinden itibaren üç iş günü içinde iletilir → son gün **11.06.2026 (Perşembe)**;\
    \ yönetim kurulu dördüncü iş gününde → **12.06.2026 (Cuma)** karar alır ve aynı gün KAP'ta ilan eder (md. 13/3).\n\n##\
    \ (d) Bağlı ortaklıklara devir (md. 15, 16, 7)\n\n- **(i) %100 bağlı ortaklık:** Sermayesinin en az %90'ına sahip olunan\
    \ bağlı ortaklıkla yapılan işlemlerde ayrılma hakkı **doğmaz** (md. 15/1-i). Bu durumda diğer mevzuat gereği genel kurul\
    \ zorunluluğu yoksa yönetim kurulu kararı yeterlidir, ayrıca genel kurul yapılmaz (md. 15/2); karar ve ayrılma hakkının\
    \ doğmama gerekçesi kamuya açıklanır (md. 15/3).\n- **(ii) %80 bağlı ortaklık:** %90'dan az paya sahip olunan bağlı ortaklıkla\
    \ yapılan işlemde md. 15/1-i uygulanmaz; işlem için genel kurul onayı aranır (md. 7/1) ve ayrılma hakkı doğar. Ancak md.\
    \ 16/1-e uyarınca ayrılma hakkının kullandırılması yükümlülüğünden **muafiyet** tanınabilir. Başvuru, yönetim kurulu karar\
    \ tarihini izleyen **on iş günü** içinde Kurula yapılır (md. 16/2): 19, 22, 23, 24, 25, 26, 29, 30 Haziran, 01, 02 Temmuz\
