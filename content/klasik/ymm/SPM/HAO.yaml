- id: YMM-SPM-HAO-K010
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - kâr payı dağıtımı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Payları Borsa İstanbul''da işlem gören **Altın Gıda A.Ş.**''nin hesap dönemi takvim yılıdır. Esas sözleşmesinde

    yönetim kurulu üyelerine kârdan pay verilebileceği hükmü bulunmakta, ancak oran belirlenmemektedir; kâr payı

    avansı dağıtılabileceğine ilişkin hüküm de vardır. Genel kurulca onaylanan kâr dağıtım politikasına göre net

    dağıtılabilir dönem kârının en az %50''si pay sahiplerine nakden dağıtılır. Ortaklığın imtiyazlı payı yoktur.


    SPK düzenlemelerine göre hazırlanan 2025 yılı finansal tablolarından bilgiler:


    | Kalem | Tutar (TL) |

    |---|---|

    | Net dönem kârı | 40.000.000 |

    | TTK''ya göre ayrılması gereken genel kanuni yedek akçe | 2.000.000 |

    | Geçmiş yıllar zararı | – |

    | 2025 yılında yapılan bağışlar (esas sözleşmede bağış hükmü vardır) | 1.000.000 |


    Yönetim kurulu, Mart 2026''daki olağan genel kurula pay sahiplerine politikadaki asgari oranda nakit kâr payı

    dağıtılmasını ve yönetim kurulu üyelerine toplam 6.000.000 TL kâr payı verilmesini önermektedir (TTK md. 519/2-c

    uyarınca ayrılacak ikinci tertip yedek akçe bu soruda dikkate alınmayacaktır).


    Genel kurul ayrıca yönetim kuruluna 2026 hesap dönemiyle sınırlı kâr payı avansı dağıtma yetkisi vermiştir.

    2026 ara dönem bilgileri:


    | Ara dönem | Net dönem kârı (TL) | Ayrılması gereken yedek akçe (TL) |

    |---|---|---|

    | 1 Ocak – 30 Haziran 2026 | 24.000.000 | 1.200.000 |

    | 1 Ocak – 30 Eylül 2026 | 34.000.000 | 1.700.000 |


    Ara dönem finansal tablolarında net dönem kârı hariç kâr dağıtımına konu edilebilecek diğer kaynaklar

    (olağanüstü yedekler) 15.000.000 TL''dir.


    **İstenenler** (Kâr Payı Tebliği II-19.1 çerçevesinde):


    (a) 2025 yılı net dağıtılabilir dönem kârını ve pay sahiplerine dağıtılacak asgari nakit kâr payını hesaplayınız.

    (5 puan)


    (b) Yönetim kurulu üyelerine önerilen kâr payının mevzuata uygunluğunu değerlendiriniz; verilebilecek azami tutarı

    ve ödeme şartını belirtiniz. (6 puan)


    (c) Haziran ve Eylül 2026 ara dönemleri için dağıtılabilecek azami kâr payı avansı tutarlarını hesaplayınız.

    (9 puan)


    (d) Kâr payı avansının ödeme şekli ve kime ödenebileceği bakımından sınırlarını; hesap dönemi sonunda yeterli kâr

    oluşmaması durumunun sonucunu ve kâr payında zamanaşımını açıklayınız. Ortaklığın payları borsada işlem görmeseydi

    kâr payı avansı ve asgari dağıtım bakımından ne değişirdi? (5 puan)

    '
  cozum: "**(a) Dağıtılabilir kâr ve asgari kâr payı**\n\nHesap dönemi içinde yapılan bağışlar dağıtılabilir kâr matrahına\
    \ eklenir (md. 6/1):\n\n| Kalem | TL |\n|---|---|\n| Net dönem kârı | 40.000.000 |\n| − Genel kanuni yedek akçe | (2.000.000)\
    \ |\n| = Net dağıtılabilir dönem kârı | 38.000.000 |\n| + Bağışlar | 1.000.000 |\n| **Bağışlar eklenmiş net dağıtılabilir\
    \ dönem kârı** | **39.000.000** |\n\nPolitika uyarınca asgari nakit kâr payı = 39.000.000 × %50 = **19.500.000 TL**.\n\
    \n**(b) Yönetim kurulu üyelerine kâr payı**\n\n- Yönetim kurulu üyelerine kâr payı verilebilmesi için esas sözleşmede\
    \ hüküm bulunması şarttır (md. 5/4); hüküm\n  vardır. Oran belirlenmediğinden bu kişilere dağıtılacak tutar, imtiyazdan\
    \ kaynaklananlar hariç, pay sahiplerine\n  dağıtılan kâr payının **dörtte birini** aşamaz: 19.500.000 / 4 = **4.875.000\
    \ TL**.\n- Önerilen 6.000.000 TL bu sınırı 1.125.000 TL aştığından mevzuata **aykırıdır**; en çok 4.875.000 TL verilebilir.\n\
    - TTK'ya göre ayrılması gereken yedek akçeler ve pay sahipleri için belirlenen kâr payı ayrılmadıkça ve bu kâr\n  payı\
    \ **nakden ödenmedikçe** yönetim kurulu üyelerine kârdan pay dağıtılamaz (md. 5/3).\n\n**(c) Kâr payı avansı**\n\nTek\
    \ avans sınırı (md. 10/1): ara dönem net kârından yedek akçeler ve geçmiş yıl zararları düşüldükten sonra kalanın\nyarısı.\
    \ Dönem toplam sınırı (md. 10/2): bir önceki yıl net dönem kârının yarısı (40.000.000 / 2 = 20.000.000 TL) ile\nara dönem\
    \ tablosundaki net dönem kârı hariç dağıtılabilir diğer kaynaklardan (15.000.000 TL) düşük olanı →\n**15.000.000 TL**.\n\
    \n| | Haziran 2026 | Eylül 2026 |\n|---|---|---|\n| Ara dönem net kârı | 24.000.000 | 34.000.000 |\n| − Yedek akçe | (1.200.000)\
    \ | (1.700.000) |\n| Kalan | 22.800.000 | 32.300.000 |\n| Tek avans sınırı (yarısı) | 11.400.000 | 16.150.000 |\n| Dönem\
    \ toplam sınırından kalan | 15.000.000 | 15.000.000 − 11.400.000 = 3.600.000 |\n| **Dağıtılabilecek azami avans** | **11.400.000**\
    \ | **3.600.000** |\n\nSonraki ara dönemde ödenecek avans hesaplanırken önceki ara dönemde ödenen avans dönem toplam sınırından\
    \ indirilir\n(md. 10/3). 2026 yılında toplam en çok 15.000.000 TL avans dağıtılabilir.\n\n**(d) Sınırlar ve sonuçlar**\n\
    \n- Avans yalnız **nakden** ve ara dönem tablolarındaki kâr üzerinden dağıtılır; belirli bir ara döneme ilişkin avans\n\
    \  **taksitle** ödenemez (md. 9/1). Mevcut payların tümüne eşit dağıtılır; **pay sahibi dışındaki kişilere** (yönetim\n\
    \  kurulu üyeleri dahil) avans dağıtılamaz (md. 9/4).\n- Yetki veren genel kurulda, dönem sonunda yeterli kâr oluşmaması\
    \ veya zarar oluşması hâlinde dağıtılan avansın\n  yıllık finansal durum tablosundaki kâr dağıtımına konu edilebilecek\
    \ kaynaklardan **mahsup edileceği** karara\n  bağlanmalıdır (md. 9/2). Önceki dönem avansları mahsup edilmeden yeni avans\
    \ ve kâr payı dağıtılamaz (md. 10/4).\n- Tahsil edilmeyen kâr payı, dağıtım tarihinden itibaren **beş yılda** zamanaşımına\
