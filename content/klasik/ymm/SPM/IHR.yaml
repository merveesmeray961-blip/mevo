  kazanimlar:
  - borçlanma araçlarının türleri ve vadeleri (tahvil, finansman bonosu, DET)
  - paya dönüştürülebilir tahvil ihracı koşulları ve kayıtlı sermaye tavanı
  - PDT'lerin paylara dönüştürülmesi, süreler ve küsurat
