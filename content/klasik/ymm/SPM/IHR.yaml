  soru: 'Payları borsada işlem gören **Tuna Otomotiv A.Ş.** (Tuna), daha önce paylarını halka arz etmiştir. İzahnamesi üç
    belgeden oluşmaktadır: ihraççı bilgi dokümanı (İBD), sermaye piyasası aracı notu (SPK notu) ve özet. Tuna''nın 2026 yılındaki
    sermaye artırımı yoluyla pay halka arzına ilişkin gelişmeler şöyledir (ilgili dönemde resmî tatil yoktur; hafta sonu tatildir):


    | Tarih | Olay |

    |---|---|

    | 14 Ekim 2025 (Salı) | Kurulca onaylanmış İBD, KAP''ta ilk kez ilan edilmiştir |

    | 9 Eylül 2026 (Çarşamba) | Kurul, SPK notu ve özeti onaylamıştır |

    | 11 Eylül 2026 (Cuma) | Tuna, onaylı SPK notunu ve özeti teslim almıştır |

    | 14 Eylül 2026 (Pazartesi) | SPK notu ve özet KAP''ta ve Tuna''nın internet sitesinde ilan edilmiştir |

    | 21–23 Eylül 2026 | Halka arz (satış) süresi |

    | 22 Eylül 2026 (Salı) | Satışın ikinci gününde, Tuna''nın en büyük müşterisinin (ciro payı %35) sözleşmeyi feshettiği
    ortaya çıkmış, durum aynı gün Kurula yazılı bildirilmiş ve satış süreci durdurulmuştur |

    | 25 Eylül 2026 (Cuma) | İzahnamenin nerede yayımlandığı hususu ticaret siciline tescil ve TTSG''de ilan edilmiştir |

    | 30 Eylül 2026 (Çarşamba) | Kurulca onaylanan izahname değişikliği ilan edilmiştir |


    Diğer bilgiler:


    1. Tuna, ikinci bir pay halka arzını **12 Ekim 2026''da (Plan A)** veya **19 Ekim 2026''da (Plan B)** yapmayı düşünmektedir.
    İBD''de herhangi bir değişiklik gerekmediği değerlendirilmektedir.

    2. Özette Tuna''nın 2025 yılı net satış hasılatı 480 milyon TL gösterilmiştir; izahnamenin finansal tablolar bölümünde
    ve bağımsız denetimden geçmiş tablolarda ise 430 milyon TL''dir. Yatırımcı Mert, yalnız özetteki bilgiye dayanarak pay
    almış ve zarar etmiştir.

    3. Tuna''nın halka arz afişinde "Halka arzımız SPK onaylıdır, Kurul güvencesindedir" ifadesi yer almaktadır.


    **İstenenler:**


    (a) İBD''nin geçerlilik süresinin bittiği tarihi ve SPK notu ile özetin en geç hangi tarihe kadar geçerli olabileceğini
    belirtiniz; Plan A ve Plan B''yi değerlendiriniz. (7 puan)


    (b) 22 Eylül tarihli gelişme karşısında izlenecek süreci açıklayınız; değişikliğin Kurulca onaylanması için son günü ve
    satın alma talebinde bulunmuş yatırımcıların talebini geri alabilecekleri son günü bulunuz. (6 puan)


    (c) SPK notu ve özetin ilanı, ticaret siciline tescil/TTSG ilanı ve Kurula bildirim için tanınan en geç tarihleri bulunuz;
    25 Eylül''deki tescilin satışa 21 Eylül''de başlanmasını etkileyip etkilemediğini belirtiniz. (7 puan)


    (d) 2 ve 3 numaralı bilgileri izahname sorumluluğu ve Kurul onayına ilişkin kurallar bakımından değerlendiriniz. (5 puan)

    '
  cozum: '**(a) Geçerlilik (II-5.1 md. 13/6, 17/1, 17/3; Pay Tebliği md. 28)**


    - İzahname, ilk yayım tarihinden itibaren **12 ay** boyunca yapılacak ihraçlar için geçerlidir; birden fazla belgeden
    oluşan izahnamede süre, **İBD''nin ilk yayım tarihinde** başlar. İBD 14 Ekim 2025''te yayımlandığından geçerlilik **14
    Ekim 2026''da** sona erer.

    - SPK notu ile özetin geçerlilik süresi İBD''nin süresini aşamaz: SPK notu ve özet 14 Eylül 2026''da ilan edilmiş olsa
    da en geç **14 Ekim 2026''ya kadar** geçerlidir.

    - **Plan A (12 Ekim 2026):** İBD''nin geçerlilik süresi içindedir; ancak yine de her satıştan önce yeni SPK notu ve özet
    hazırlanıp Kurul onayına sunulur (md. 13/6) ve Pay Tebliği md. 28 gereği her satıştan önce Kurula başvurulur. İBD''de
    değişiklik gerekmiyorsa bu husus ihraççı tarafından **Kurula yazılı olarak beyan edilir** (md. 17/3).

    - **Plan B (19 Ekim 2026):** Süre dolduğundan sonra yapılacak halka arzlarda **izahnamenin tümünün (İBD dahil) yeniden
    onaylanması** gerekir (md. 17/1). Mevcut belgelerle yapılamaz.


    **(b) Değişiklik süreci (II-5.1 md. 24)**


    - Yatırım kararını etkileyebilecek yeni husus (müşteri sözleşmesinin feshi) ortaya çıkınca ihraççı **derhâl yazılı olarak
    Kurula bildirir**; satış süreci ihraççı veya halka arz eden tarafından (veya bunların uygun görüşü üzerine yetkili kuruluşlarca)
    durdurulabilir; durdurulmazsa Kurul durdurmaya karar verebilir. Tuna''nın satışı durdurması ve Kurula bildirmesi uygundur.

    - Değiştirilecek kısımlar bildirim tarihinden itibaren **7 iş günü** içinde Kurulca onaylanır: 22 Eylül + 7 iş günü =
    **1 Ekim 2026 (Perşembe)**. Onaylı değişiklik md. 28''deki yerlerde derhâl ilan edilir; ayrıca internet sitesinde ve KAP''ta
    eski/yeni şekil karşılaştırması ile tek metin hâline getirilmiş sürüm yer alır. Değişiklik özeti de etkiliyorsa özet de
    değiştirilir.

    - Değişiklik yayımlanmadan önce talepte bulunmuş yatırımcılar, değişikliğin yayımından itibaren **2 iş günü** içinde taleplerini
    geri alabilir (izahnamede daha uzun süre belirlenebilir). Değişiklik 30 Eylül''de ilan edildiğinden son gün **2 Ekim 2026
    (Cuma)**''dir.


    **(c) İlan, tescil, bildirim (II-5.1 md. 28, 30)**


    | İşlem | Süre | En geç tarih |

    |---|---|---|

    | Onaylı izahnamenin (burada SPK notu ve özet) ilanı | Teslim alınmasını takiben 15 iş günü (md. 28/3) | 11 Eylül + 15
    iş günü = **2 Ekim 2026**. Tuna 14 Eylül''de ilan ederek süreye uymuştur |

    | İzahnamenin nerede yayımlandığının tescili ve TTSG''de ilanı | İlandan itibaren 10 iş günü (md. 28/9); belgeler farklı
    tarihte onaylanmışsa son belgenin ilanından sonra | 14 Eylül + 10 iş günü = **28 Eylül 2026**. 25 Eylül''deki tescil süresindedir
    |

    | TTSG tarih ve sayısının Kurula yazılı bildirimi | İlandan itibaren 6 iş günü (md. 30) | 25 Eylül + 6 iş günü = **5 Ekim
    2026 (Pazartesi)** |


    Satışa başlanması için izahnamenin nerede yayımlandığının tescil edilmesine **gerek yoktur** (md. 28/9); 25 Eylül tarihli
    tescil, satışın 21 Eylül''de başlamasını etkilemez.


    **(d) Özet ve Kurul onayı**


    - Özet izahnamenin bir girişi niteliğindedir ve yatırım kararlarının izahnamenin bütününe göre verilmesi uyarısı ile özetin
    yanıltıcı, hatalı veya tutarsız olması hâlinde ilgililerin hukuki sorumluluğunun bulunduğu uyarısını taşır (md. 13/11).
    Sadece özete dayanılarak sorumluluk yüklenemez; **ancak izahnamenin diğer kısımlarıyla birlikte okunduğunda özetin yanıltıcı,
    hatalı veya tutarsız olması hâli bunun dışındadır** (md. 25/3). Özetteki 480 milyon TL, izahnamenin diğer kısmındaki 430
    milyon TL ile tutarsız olduğundan sorumluluk doğabilir; Mert''in yalnız özete dayanması sorumluluğu ortadan kaldırmaz.

    - İzahname onayı, bilgilerin doğruluğunun Kurulca tekeffülü anlamına gelmez, reklam amacıyla kullanılamaz ve ilanlarda
    onayın tekeffül anlamına geldiğini belirten veya bu kanaati uyandıran ifade kullanılamaz (md. 22/3). "Kurul güvencesindedir"
    ifadesi **aykırıdır.** Tanıtım ve reklamlarda ayrıca yatırım kararlarının izahnamenin incelenmesi suretiyle verilmesi
    gerektiğine ilişkin uyarı bulunmalıdır (md. 27/1).


    Püf noktaları: (1) SPK notu ve özet kendi ilan tarihinden 12 ay geçerli sanılır, oysa İBD''nin süresini aşamaz; (2) tescil/TTSG
    ilanı satışın ön şartı değildir; (3) değişiklikte 7 iş günü Kurulun onay süresi, 2 iş günü yatırımcının geri alma süresidir.

    '
