  soru: 'Daha önce paylarını halka arz etmiş olan **Kuzey Enerji A.Ş.**, 2026 yılında tahvil ihraç etmeyi planlamaktadır.
    Genel kurul, **20 Mart 2026**''da borçlanma aracı ihracına karar vermiş; kararda ihraç yetkisinin yönetim kuruluna devredildiği
