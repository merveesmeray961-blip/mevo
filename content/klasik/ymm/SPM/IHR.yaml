  soru: 'Payları borsada işlem gören (tek pay grubu, hepsinin borsada işlem sırası vardır), kayıtlı sermaye sistemindeki **Akdeniz
    Seramik A.Ş.** (Akdeniz), 2023 yılında Kuruldan beş yıl süreyle geçerli 400.000.000 TL tutarında kayıtlı sermaye tavanı
    izni almıştır. Çıkarılmış sermayesi 100.000.000 TL''dir (pay başına nominal değer 1 TL). Paylar borsada 9 TL''den işlem
    görmekte, defter değeri pay başına 3 TL''dir. Dönemde resmî tatil yoktur; hafta sonu tatildir.


    Yönetim kurulu, **22 Haziran 2026''da (Pazartesi)** yeni pay alma haklarını sınırlandırmaksızın, **nakden** 50.000.000
    TL''lik bedelli sermaye artırımına karar vermiştir (her 1 pay için 0,5 yeni pay; pay başına kullanım fiyatı 1 TL).


    1. Yönetim, izahnamenin onayı için Kurula **27 Temmuz 2026''da** başvurmayı planlamaktadır.

    2. İzahname 3 Ağustos 2026''da (Pazartesi) Kurulca onaylanarak ilan edilmiştir. Yönetim, yeni pay alma hakkı kullanımını
    **12–21 Ağustos 2026** arasında (10 gün) yürütmeyi planlamaktadır.

    3. Pay sahibi Hakan 3.000 paya sahiptir ve haklarını tam kullanmak istemektedir.

    4. Hak kullanım süresi sonunda yeni pay alma hakları 49.880.000 pay için kullanılmıştır. Kullanım süresi (düzeltilmiş
    takvimle) **11 Eylül 2026 (Cuma)** günü sona ermiştir. Kalan paylar için Kurulca onaylanan tasarruf sahiplerine satış
    duyurusu yayımlanmamıştır.

    5. Kalan payların borsada satışı 21–25 Eylül 2026''da yapılmış; **20.000 pay satılamamıştır.** Ortaklık için bir satın
    alma taahhütnamesi **bulunmamaktadır.**


    **İstenenler:**


    (a) Yönetim kurulunun kararı ile Kurula başvuru planını kayıtlı sermaye ve süre bakımından değerlendiriniz; Akdeniz''in
    aynı tavan altında 2027''de nakden yapabileceği ek artırımın en çok tutarını bulunuz. (7 puan)


    (b) 2 numaralı planı yeni pay alma hakkı kullanımının başlangıcı ve süresi bakımından değerlendiriniz; Hakan''ın alabileceği
    pay sayısı ile ödeyeceği tutarı bulunuz; kullanım fiyatının belirlenmesinde Kurulun yetkisini açıklayınız. (6 puan)


    (c) 4 numaralı durumda kalan payların nominal tutarını bulunuz; tasarruf sahiplerine satış duyurusu bakımından Akdeniz''in
    durumunu, kalan payların nasıl satılacağını ve satışa başlamanın son gününü belirtiniz. Kalan pay 800.000 TL olsaydı sonuç
    ne olurdu? (7 puan)


    (d) 5 numaralı durumda Akdeniz''in yapması gereken işlemleri ve süreleri belirtiniz; taahhütname bulunsaydı ne olurdu?
    (5 puan)

    '
  cozum: '**(a) Karar, kayıtlı sermaye ve başvuru süresi (Pay Tebliği md. 12; Kayıtlı Sermaye Sistemi Tebliği md. 6)**


    - Kayıtlı sermaye tavanı iznin verildiği yıl dâhil **5 yıllık** (takvim yılı esaslı) süre için geçerlidir: 2023–2027.
    2026 tarihli karar süre içindedir. Artırım sonrası çıkarılmış sermaye 100 + 50 = **150.000.000 TL**, tavan olan 400.000.000
    TL''yi aşmaz.

    - Kayıtlı sermaye sisteminde **yönetim kurulu**, artırılacak sermaye miktarını ve satış esaslarını belirleyen karar alır
    (md. 12/1-a). Yeni pay alma hakları kısıtlanmadığından md. 12/1-c''ye ilişkin ek karar unsuru aranmaz.

    - Nakden yapılacak sermaye artırımlarıyla kayıtlı sermaye tavanı aşılamaz (II-18.1 md. 6/6). 2027''de tavana kadar kalan
    = 400 − 150 = **250.000.000 TL**; örneğin 260.000.000 TL''lik nakdi artırım (toplam 410.000.000 TL) mümkün değildir.

    - Izahname onayı için Kurula başvuru, yetkili organ kararının tarihinden itibaren **30 gün içinde** yapılır (md. 12/2):
    22 Haziran + 30 gün = **22 Temmuz 2026**. 27 Temmuz''a planlanan başvuru (35. gün) **süre dışıdır, aykırıdır.**


    **(b) Yeni pay alma hakkının kullanımı (Pay Tebliği md. 22; II-5.2 md. 25)**


    - Hak kullanımının izahnamenin ilanını takip eden **10 gün içinde başlatılması** zorunludur: 3 Ağustos + 10 gün = 13 Ağustos.
    12 Ağustos başlangıcı uygundur.

    - Payları borsada işlem gören ortaklıklarda hak kullanım süresi **15 günden az, 60 günden fazla olamaz.** 10 günlük süre
    **aykırıdır**; 15–60 gün arasında (örneğin 30 gün) belirlenmelidir.

    - Hakan: 3.000 × 0,5 = **1.500 yeni pay**; ödeyeceği tutar 1.500 × 1 TL = **1.500 TL**.

    - Hak kullanım fiyatı ortaklığın yetkili organınca belirlenir; ancak payların piyasa fiyatı veya defter değeri nominal
    değerin üzerindeyse Kurul, hakların nominal değer üzerinde bir fiyattan kullanılmasını isteyebilir (II-5.2 md. 25/1; SPKn
    md. 12/2). Burada borsa fiyatı (9 TL) ve defter değeri (3 TL) nominal değerin (1 TL) üzerinde olduğundan Kurul **primli
    fiyat talep edebilir.**


    **(c) Kalan paylar (II-5.1 md. 15/2; II-5.2 md. 10/9-10 ve 17/1; Pay Tebliği md. 23/4)**


    - Kalan pay = 50.000.000 − 49.880.000 = **120.000 pay (120.000 TL nominal)**.

    - Kalan payların nominal toplamı 150.000 TL''nin ve satışa sunulan payların nominal değerinin %1''inin (50.000.000 × %1
    = 500.000 TL) altında olduğundan, Akdeniz **Kuruldan onay almadan özel durum açıklaması yaparak tasarruf sahiplerine satış
    duyurusu yayımlamayabilir.**

    - Duyuru yayımlanmadığında payları borsada işlem gören ortaklık, kalan payları **borsada satışa sunmak** ve satış sonuçları
    hakkında özel durum açıklaması yapmak zorundadır (Pay Tebliği md. 23/4). Zaten borsada işlem sırası bulunan gruba ait
    paylarda borsada satış yöntemi **zorunludur** ve kalan paylar **nominal değerin altında satılamaz** (II-5.2 md. 17/1).

    - Satışa, hak kullanımının bitiminden itibaren **10 iş günü** içinde başlanır (II-5.2 md. 10/10): 11 Eylül + 10 iş günü
    = **25 Eylül 2026 (Cuma)**.

    - Kalan pay 800.000 TL olsaydı 150.000 TL''nin de %1''in de (500.000 TL) üzerinde kalacağından **Kurulca onaylanmış tasarruf
    sahiplerine satış duyurusu zorunlu** olurdu (II-5.1 md. 15/1); duyurunun ilanından sonraki 10 iş günü içinde satışa başlanır
    (II-5.2 md. 10/9) ve kalan paylar yine borsada satış yöntemiyle, nominal değerin altına inmeden satılırdı.


    **(d) Satış sonrası işlemler (Pay Tebliği md. 25/1)**


    - Kayıtlı sermaye sistemindeki ortaklıkta satın alma taahhütnamesi bulunmaması hâlinde **satış süresinin sona ermesini
    takiben 6 iş günü içinde satılamayan payların iptal ettirilmesi** gerekir: 25 Eylül + 6 iş günü = **5 Ekim 2026**. İptal
    edilmeden yeni pay çıkarılamaz (II-18.1 md. 6/5).

    - Ardından sermaye artırımının tamamlandığına ilişkin yönetim kurulu kararı ve satış belgeleriyle esas sözleşmenin sermaye
    maddesinin yeni şekli için Kurula başvurulur; uygun görüş sonrası 10 gün içinde tescil ve TTSG''de ilan edilir; artırımın
    tamamlandığı ve sağlanan toplam fon özel durum açıklamasıyla duyurulur.

    - Taahhütname bulunsaydı, satılmayan paylar için **satış süresinin bitiminden itibaren 3 iş günü içinde** taahhüt verenlere
    müracaat edilerek satış tamamlanırdı: 25 Eylül + 3 iş günü = **30 Eylül 2026**; bu paylar iptal edilmezdi.


    Püf noktaları: (1) "30 gün" Kurula başvuru süresi, "10 gün" hak kullanımının başlama süresi, "10 iş günü" kalan payların
    satışa başlama süresidir; (2) kalan pay küçükse duyuru zorunluluğu kalkar ama borsada satış kalkmaz; (3) nakden artırımla
    tavan hiçbir şekilde aşılamaz.

    '
