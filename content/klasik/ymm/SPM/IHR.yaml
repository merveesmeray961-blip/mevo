  soru: "**Pera Bankası A.Ş.** (Pera) 2025 yılında iki ayrı finansman işlemi yapmıştır:\n\n**İşlem 1 – Varlık finansmanı fonu:**\
    \ Pera'nın kurucusu olduğu (V) Varlık Finansmanı Fonu'na Pera'nın tüketici\nkredisi alacakları devredilmiş; fon bu portföye\
    \ dayalı olarak 400.000.000 TL nominal değerli **varlığa dayalı menkul\nkıymet** ihraç etmiştir.\n\n**İşlem 2 – Teminatlı\
    \ ihraç:** Pera, konut kredisi alacaklarından oluşan 600.000.000 TL'lik teminat havuzunu\nkarşılık göstererek kendisi\
    \ 500.000.000 TL nominal değerli **ipotek teminatlı menkul kıymet** ihraç etmiştir.\n\n2026 yılında Pera'nın mali durumu\
    \ bozulmuş ve yönetimi kamuya devredilmiştir. Bu tarihten sonra:\n\n- Pera'nın bir alacaklısı, (V) Fonu portföyündeki\
    \ kredi alacaklarına haciz koymak istemektedir.\n- (V) Fonunun portföyünden elde edilen tahsilatlar 380.000.000 TL'de\
    \ kalmış; varlığa dayalı menkul kıymet sahipleri\n  kalan alacakları için Pera'nın diğer varlıklarına başvurmak istemektedir.\n\
    - İpotek teminatlı menkul kıymetlerin vadesinde Pera ödeme yapamamış; teminat havuzundan 450.000.000 TL tahsil\n  edilmiştir.\n\
    - Pera'nın kamuya devredilen yönetimi, teminat havuzundaki varlıkları başka bir borcun teminatı olarak rehin vermek\n\
    \  istemektedir.\n\n**İstenenler:**\n\n(a) Konut finansmanı ve varlık finansmanı kavramlarını tanımlayınız; varlık finansmanı\
    \ fonunun hukuki niteliğini\naçıklayınız. (6 puan)\n\n(b) Varlığa dayalı ve varlık (ipotek) teminatlı menkul kıymet arasındaki\
    \ temel farkı açıklayınız; (V) Fonu\nyatırımcılarının Pera'nın diğer varlıklarına başvurma talebini değerlendiriniz. (7\
    \ puan)\n\n(c) İpotek teminatlı menkul kıymetlerde teminat havuzu tahsilatının kullanımını ve karşılanamayan tutar için\n\
    yatırımcıların başvurabileceği varlıkları hesaplayarak açıklayınız. (6 puan)\n\n(d) Haciz talebini ve teminat varlıklarının\
    \ rehin verilmesi önerisini değerlendiriniz; kira sertifikası, gayrimenkul\nsertifikası ve projeye dayalı menkul kıymetin\
    \ niteliklerini kısaca belirtiniz. (6 puan)\n"
  cozum: "**(a) Kavramlar**\n\n**Konut finansmanı**, konut edinmek amacıyla tüketiciye kredi kullandırılması, konutun finansal\
    \ kiralama yoluyla\nkiralanması ve bu kredilerin yeniden finansmanıdır; kredi ipotek veya Kurulca uygun görülen teminatla\
    \ güvenceye\nalınır (SPKn md. 57/1). **Varlık finansmanı**, Kurulca uygun görülen varlıklara dayalı sermaye piyasası aracı\n\
    ihracıdır (md. 57/4). **Konut ve varlık finansmanı fonu**, ipoteğe veya varlığa dayalı menkul kıymet karşılığı toplanan\n\
    paralarla kurulan, **tüzel kişiliği olmayan** mal varlığıdır; kurucunun ve varlıkları devredenlerin mal varlığından\n\
    ayrıdır (md. 58).\n\n**(b) Dayalı ve teminatlı ayrımı**\n\n- **Varlığa dayalı** menkul kıymette yatırımcının alacağı fon\
    \ portföyüne ve onun nakit akışlarına bağlıdır; ihraççı\n  fondur.\n- **Varlık (ipotek) teminatlı** menkul kıymet ise\
    \ ihraççının (Pera'nın) **genel yükümlülüğüdür**; teminat varlıklar ek\n  güvencedir (md. 59).\n\n(V) Fonu yatırımcılarının\
    \ alacakları fon portföyüne bağlı olduğundan, portföy tahsilatlarının (380.000.000 TL)\n400.000.000 TL'lik nominali karşılamaması\
    \ hâlinde kalan 20.000.000 TL için kural olarak **Pera'nın diğer varlıklarına\nbaşvurulamaz**; risk portföye ve ihraç\
    \ belgelerinde öngörülen kredi güçlendirmelerine bağlıdır.\n\n**(c) Teminatlı menkul kıymette ödeme**\n\nİhraççı ödeme\
    \ yapamazsa teminat varlıklardan elde edilen gelirler **önce menkul kıymet sahiplerine** kullanılır;\nkarşılanamayan kısım\
    \ için ihraççının **diğer varlıklarına** başvurulabilir (md. 59/4).\n\n- Teminat havuzu tahsilatı: 450.000.000 TL → yatırımcılara\
    \ ödenir.\n- Karşılanamayan tutar: 500.000.000 − 450.000.000 = **50.000.000 TL** → Pera'nın genel mal varlığından, diğer\n\
    \  alacaklılarla birlikte talep edilir.\n\n**(d) Haciz, rehin ve diğer araçlar**\n\nFon mal varlıkları ve teminat varlıkları,\
    \ ihraççının yönetimi kamuya devredilse dahi **amaç dışında tasarruf\nedilemez, rehnedilemez**, kamu alacakları için dahi\
    \ **haczedilemez ve iflas masasına girmez** (md. 58, 59). Bu\nnedenle (V) Fonu portföyüne haciz talebi ve teminat havuzunun\
    \ başka borca rehin verilmesi önerisi **kabul edilemez**.\n\n| Araç | Nitelik |\n|---|---|\n| Kira sertifikası | Varlık\
    \ kiralama şirketinin ihraç ettiği, sahiplerine varlık gelirlerinden pay veren araç (md. 61) |\n| Gayrimenkul sertifikası\
    \ | Gayrimenkul projesinin bağımsız bölümlerini veya alan birimini temsil eden araç (md. 61/A) |\n| Projeye dayalı menkul\
    \ kıymet | Altyapı, enerji gibi projelerin gelirlerine dayalı, proje finansman fonu tarafından ihraç edilen araç (md.\
    \ 61/B) |\n"
