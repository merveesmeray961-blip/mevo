    \ Eta konsolide finansal tablo hazırlamaktadır; ihraç limitinin hesaplanmasında esas alınacak\nbağımsız denetimden geçmiş\
    \ konsolide tablolara göre ana ortaklığa ait özkaynak 400.000.000 TL, kontrol gücü olmayan\npaylar dahil toplam özkaynak\
