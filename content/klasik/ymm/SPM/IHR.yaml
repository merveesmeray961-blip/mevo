      \ v in bekleyen.items() if v <= pay}\n        if not tamam:\n            for k in bekleyen:\n                sonuc_d[k]\
      \ = pay\n            kalan = 0\n            break\n        for k, v in tamam.items():\n            sonuc_d[k] = v\n\
      \            kalan -= v\n            del bekleyen[k]\n    return sonuc_d\ntalepler = [('Ahmet', 100000), ('Berna', 300000),\
      \ ('Berna', 200000), ('Cem', 500000), ('Deniz', 600000), ('Ece', 1200000), ('Fikret', 1900000)]\nen_yuksek = {}\nfor\
