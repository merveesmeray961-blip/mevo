- id: YMM-SPM-IHR-K018
  sinav: ymm
  ders: SPM
  konu: IHR
  kazanimlar:
  - ilk halka arz öncesi ön koşullar ve yüklenim
  - fiyat tespit raporu, analist raporu ve aracılık
  - ön talep toplama
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları ilk kez halka arz edilecek **Ege Biyoteknoloji A.Ş.** (Ege), 1.500.000 adet payı sermaye artırımı yoluyla,
    500.000 adet payı ortakların mevcut paylarının satışı yoluyla olmak üzere toplam **2.000.000 pay** (pay başına nominal
    1 TL) halka arz edecektir. Satış, **fiyat aralığı ile talep toplama** yöntemiyle yapılacak; fiyat aralığı **taban 18 TL
    – tavan 21 TL** olarak belirlenmiş, halka arz fiyatı sonradan 20 TL olarak kesinleşmiştir. Halka arz **14 Eylül 2026''da
    (Pazartesi)** başlayacaktır. Ege, borsa ve GİP dışı bir ortaklıktır (ek satış yoktur).


    Ege''nin izahnamesinde yer alacak en son finansal tablolara göre bilgiler:


    | Kalem | Tutar (TL) |

    |---|---|

    | Aktif toplamı | 1.000.000.000 |

    | Toplam alacaklar | 400.000.000 |

    | Kurulun ilgili düzenlemelerinde tanımlanan ilişkili taraflardan ticari olmayan alacaklar | 90.000.000 |


    Halka arza **Kıyı Yatırım Menkul Değerler A.Ş.** (Kıyı) konsorsiyum lideri, **Dere Menkul Değerler A.Ş.** (Dere) eş lider
    olarak aracılık etmektedir. Kıyı, Kurulun ilgili düzenlemelerinde tanımlanan anlamda Ege''nin **ilişkili tarafıdır.**
    Fiyat tespit raporunun hazırlanması için **Orman Yatırım A.Ş.**, analist raporu için ise Dere görevlendirilmek istenmektedir.
    Fiyat tespit raporunun KAP''ta **12 Eylül 2026''da** ilan edilmesi planlanmaktadır.


    **Ön talep toplama:** İzahname onay başvurusu 29 Haziran 2026''da yapılmış, Kurul ön talep toplamaya izin vermiştir. Ön
    talep toplama **20 Temmuz–5 Ağustos 2026** arasında yapılmak istenmekte; ön talep sonuçlarının Ege''nin basın bülteninde
    "Ön talepler 3 katına ulaştı" şeklinde duyurulması düşünülmektedir. Süre bitimi 31 Temmuz 2026 (Cuma) olarak düzeltilirse
    bu tarihe göre işlem yapılacaktır. (İlgili dönemde 15 Temmuz 2026 dışında resmî tatil yoktur; hafta sonu tatildir.)


    **İstenenler:**


    (a) Ege''nin ilişkili taraflardan olan ticari olmayan alacak oranlarını hesaplayınız; ilk halka arz ön koşulu bakımından
    durumunu ve çözüm yolunu açıklayınız. (5 puan)


    (b) Yüklenim zorunluluğunun doğup doğmadığını belirleyiniz; doğuyorsa tüm payların satılamaması hâlinde yetkili kuruluşların
    yüklenmesi gereken azami tutarı hesaplayınız, yüklenim sözleşmesi ile yüklenilen payların satışına ilişkin kuralları belirtiniz.
    (7 puan)


    (c) Fiyat tespit raporunu kimin hazırlaması gerektiğini, raporun ilanı için tanınan en geç tarihi ve Dere''nin analist
    raporu hazırlayıp hazırlayamayacağını değerlendiriniz. (8 puan)


    (d) Ön talep toplama planını süre, Kurula bildirim, sonuçların iletilmesi ve açıklanması bakımından değerlendiriniz; düzeltilmiş
    süre bitimine göre sonuçların Kurula iletilmesi için son günü bulunuz. (5 puan)

    '
  cozum: '**(a) İlk halka arz ön koşulu (Pay Tebliği md. 5/6)**


    - İlişkili taraflardan ticari olmayan alacakların tüm alacaklara oranı: 90.000.000 ÷ 400.000.000 = **%22,5** (sınır %20).

    - Aktif toplamına oranı: 90.000.000 ÷ 1.000.000.000 = **%9** (sınır %10).

    - Hükümde iki ölçüt de ayrı sınırdır: oranlar yüzde yirmiyi **veya** aktif toplamının yüzde onunu geçemez. Alacak oranı
    sınırı aşıldığından Ege ön koşula **uymamaktadır** (aktif oranı tek başına yeterli değildir).

    - Uyum için, ortakların mevcut paylarının satışından elde edilecek fonun ilişkili taraflardan olan alacakların tahsilinde
    kullanılması ve ortaklığın bu hükmün dolanılmasına yol açacak şekilde tekrar alacaklı hâle getirilmemesi **ortaklık ve
    halka arz edenlerce taahhüt edilmelidir.** Taahhüdün Kurulca uygun görülmesi durumunda hüküm uygulanmaz.


    **(b) Yüklenim (Pay Tebliği md. 5/7-8)**


    - Piyasa değeri, ek satış hariç halka arz edilecek payların halka arz fiyatı baz alınarak hesaplanır; **fiyat aralığında
    taban fiyat esas alınır:** 2.000.000 × 18 = **36.000.000 TL.**

    - 36 milyon TL, 20–40 milyon TL aralığında olduğundan yüklenim **zorunludur** (40 milyon TL üzerinde zorunlu olmazdı).
    Aralık kontrolü: 21 ≤ 18 × 1,20 = 21,6 (II-5.2 md. 14/8) uygundur.

    - Yüklenim kapsamı: satılamayan payların **20 milyon TL''ye kadar olan kısmının tamamı + aşan kısmının yarısı.** Tüm paylar
    satılamazsa satılamayan tutar, fıkradaki tutarlar taban fiyatla hesaplandığından (md. 5/7 son cümle) 2.000.000 × 18 =
    36.000.000 TL; yüklenim = 20.000.000 + (36.000.000 − 20.000.000) ÷ 2 = **28.000.000 TL.** (Yüklenilen payların satın alma
    fiyatı ise halka arz fiyatıdır.)

    - Yetkili kuruluşlar, halka arz fiyatı üzerinden payları satın alacaklarına dair ortaklığa karşı yüklenimde bulunur ve
    **yüklenim sözleşmesi izahnamenin Kurulca onaylanmasından önce Kurula gönderilir.**

    - Yüklenim sonucu portföye alınan payları, payların borsada işlem görmeye başlamasından itibaren **6 ay** boyunca halka
    arz fiyatının altında borsada satamazlar (md. 5/8).


    **(c) Fiyat tespit raporu ve analist raporu (Pay Tebliği md. 29/1-2)**


    - Fiyat tespit raporunu normalde konsorsiyum lideri veya eş lider hazırlar; ancak aracılık eden yetkili kuruluş halka
    açılacak ortaklığın **ilişkili tarafı** ise rapor **başka bir yetkili kuruluşça** hazırlanır. Kıyı ilişkili taraf olduğundan
    raporu Kıyı hazırlayamaz; Orman Yatırım (konsorsiyum dışı bir başka yetkili kuruluş) hazırlayabilir. (Eş lider Dere ilişkili
    taraf değildir; rapor Dere tarafından da hazırlanabilirdi.)

    - Rapor, halka arzın başlayacağı tarihten **en az 3 gün önce** KAP''ta ilan edilir: 14 Eylül − 3 gün = **en geç 11 Eylül
    2026.** 12 Eylül''de ilan **geçersiz bir plandır, aykırıdır** (halka arz tarihine 2 gün kalır).

    - Analist raporu, fiyat tespit raporunu analiz eden **başka** bir yetkili kuruluşça hazırlanabilir; ancak bu kuruluşun
    ilgili halka arzda **konsorsiyum lideri veya eş lideri olarak görev yapmaması** gerekir. Dere eş lider olduğundan analist
    raporunu hazırlayamaz. Rapor, halka arz fiyatına ilişkin görüş içerir ve en geç **halka arzın başladığı tarihte** (14
    Eylül) KAP''ta ortaklığa ilişkin bölümde ve raporu hazırlayan kuruluşun internet sitesinde ilan edilir.


    **(d) Ön talep toplama (Pay Tebliği md. 20)**


    - Ön talep toplamanın şartları: izahname onay başvurusunun yapılmış olması (29 Haziran''da yapılmıştır) ve Kurulun izin
    vermesi (verilmiştir). Bu iki şart karşılanmıştır.

    - Ön talep toplama süresi **10 iş gününden fazla olamaz.** 20 Temmuz–5 Ağustos arası 13 iş günüdür (20–24 Temmuz: 5; 27–31
    Temmuz: 10; 3–5 Ağustos: 13) → **aykırı.** 20–31 Temmuz tam 10 iş günüdür ve uygundur.

    - Başlangıç ve bitiş tarihleri, ön talep toplamaya başlamadan **en az 1 iş günü önce** yetkili kuruluşça Kurula bildirilir.

    - Sonuçlar, ön talep süresinin bitimini takip eden **2 iş günü** içinde Kurula iletilir: 31 Temmuz + 2 iş günü = **4 Ağustos
    2026 (Salı).** İzahnamenin onayına ilişkin Kurul inceleme süresi bu sonuçların iletilmesinden sonra başlar (md. 20/1).

    - Ön talep sonuçları **hiçbir şekilde kamuya açıklanamaz ve reklam amacıyla kullanılamaz** (md. 20/7); "Ön talepler 3
    katına ulaştı" duyurusu **aykırıdır.**


    Püf noktaları: (1) yüklenim zorunluluğu piyasa değerine göre taban fiyatla belirlenir, yüklenilecek tutar da aynı fıkra
    gereği taban fiyatla hesaplanır; (2) ilişkili taraf olan lider rapor hazırlayamaz, ancak eş lider (ilişkili değilse) hazırlayabilir;
    (3) analist raporunu lider veya eş lider hazırlayamaz.

    '
