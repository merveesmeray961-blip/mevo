- id: YMM-SPM-IHR-K001
  sinav: ymm
  ders: SPM
  konu: IHR
  kazanimlar:
  - izahname ve ihraç belgesi
  - satış yöntemleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Payları ilk kez halka arz edilecek **Tau A.Ş.**''ye ilişkin bilgiler şöyledir:


    - Halka arz edilecek payların toplam nominal değeri **40.000.000 TL**, satış fiyatı pay başına sabit **25 TL**''dir. Satış,
    **sabit fiyatla talep toplama** yöntemiyle yapılacak; borsada satış yöntemi kullanılmayacak, ek satış yapılmayacaktır.

    - Şirket izahname onayı için Kurula **1 Eylül 2026** tarihinde başvurmuştur. Şirketin KAP üyeliği ve internet sitesi vardır;
    halka arza bir yetkili kuruluş aracılık etmektedir.

    - Kurulca onaylanan izahname ile fiyat tespit raporu **3 Kasım 2026 Salı** günü KAP''ta ve diğer ilan yerlerinde birlikte
    yayımlanmıştır. Tasarruf sahiplerine satış duyurusu da aynı gün ilan edilmiştir.

    - İzahnamedeki tahsisat oranları: yurt içi bireysel **%50**, yurt içi kurumsal **%20**, yurt dışı kurumsal **%30**. Kurul
    asgari tahsisat oranlarını değiştirmemiştir.

    - Talep toplama sonunda gelen talepler (nominal): yurt içi bireysel 26.000.000 TL, yurt içi kurumsal 10.000.000 TL, yurt
    dışı kurumsal 7.000.000 TL.


    **İstenenler** (Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2) ve İzahname ve İhraç Belgesi Tebliği (II-5.1) çerçevesinde):


    (a) Halka arza en erken hangi tarihte başlanabileceğini gerekçesiyle belirtiniz. Satış süresinin hangi sınırlar içinde
    belirlenebileceğini ve talep toplama süresinde yeterli talep gelmesinin süreye etkisini açıklayınız. (6 puan)


    (b) Yurt içi bireysel ve yurt içi kurumsal yatırımcılara ayrılması zorunlu asgari tahsisat tutarlarını hesaplayınız ve
    izahnamedeki oranların bu sınırlara uyup uymadığını belirtiniz. Yurt dışı kurumsal yatırımcı grubunda karşılanamayan tutarı
    hesaplayıp bu tutarın nasıl değerlendirilebileceğini açıklayınız. (6 puan)


    (c) Kurula başvurudan sonra, onaydan önce izahnamenin ilanına ilişkin yükümlülükleri ve bu dönemde yapılabilecek tanıtım
    ve reklamların kapsamı ile içermesi zorunlu uyarıyı açıklayınız. (6 puan)


    (d) Onaylanan izahnamenin teslim alınması ve ilanına ilişkin süreleri, bu sürelere uyulmamasının sonucunu, izahnamenin
    geçerlilik süresinin başlangıcı ile süresini ve izahnamenin nerede yayımlandığına ilişkin tescil yükümlülüğünü açıklayınız.
    (7 puan)

    '
  cozum: "**(a) Satışın başlangıcı ve süresi (II-5.2 md. 10)**\n\n- Halka arza en erken, izahnamenin **ve** fiyat tespit raporunun\
    \ yayımlanmasını **takip eden üçüncü gün** başlanabilir (md. 10/1). İki belge de 3 Kasım 2026'da yayımlandığından üçüncü\
    \ gün **6 Kasım 2026 Cuma**'dır. Tau A.Ş.'nin payları ilk kez halka arz edildiğinden, borsada işlem gören ihraççılara\
    \ tanınan \"takip eden iş günü\" kolaylığı (md. 10/3) uygulanmaz. Tasarruf sahiplerine satış duyurusunun satıştan önce\
    \ ilanı şartı da sağlanmıştır.\n- Satış süresi **iki iş gününden az, yirmi iş gününden fazla olmamak** üzere ihraççı/halka\
    \ arz eden tarafından serbestçe belirlenir (md. 10/7).\n- Talep toplama yoluyla satışta, süre içinde yeterli talep gelse\
    \ **dahi süre sonuna kadar talep toplamaya devam edilir** (md. 10/7).\n\n**(b) Tahsisatlar (II-5.2 md. 18)**\n\n- Asgari\
    \ tahsisat: halka arz edilen nominal değerin en az %10'u yurt içi bireysel, %10'u yurt içi kurumsal yatırımcılara (md.\
    \ 18/4):\n  - Yurt içi bireysel: 40.000.000 × %10 = **4.000.000 TL**; izahnamede 40.000.000 × %50 = 20.000.000 TL → uygun.\n\
    \  - Yurt içi kurumsal: 40.000.000 × %10 = **4.000.000 TL**; izahnamede 40.000.000 × %20 = 8.000.000 TL → uygun.\n- Yurt\
    \ dışı kurumsal tahsisat: 40.000.000 × %30 = 12.000.000 TL; talep 7.000.000 TL → karşılanamayan kısım **5.000.000 TL**.\n\
    - Talep toplama yönteminde bir gruba tahsis edilen tutarı karşılayacak talep gelmemişse, o grubun karşılanamayan kısmı\
    \ **diğer gruplara aktarılabilir** ve bu durumda md. 18/4'teki sınırlamalar uygulanmaz (md. 18/6). Talep fazlası olan\
    \ yurt içi bireysel (fazla 6.000.000 TL) ve yurt içi kurumsal (fazla 2.000.000 TL) gruplara aktarım yapılabilir.\n\n**(c)\
    \ Onay öncesi ilan ve reklamlar (II-5.1 md. 27/2, 28/2)**\n\n- Kurula onay için sunulan izahname, **başvuru tarihinden\
    \ itibaren beş iş günü içinde** ihraççının internet sitesinde, KAP üyeliği olduğundan **KAP'ta** ve yetkili kuruluşun\
    \ internet sitesinde ilan edilir. İzahnamenin başında **henüz Kurulca onaylanmadığını** belirten, açıkça fark edilebilir\
    \ bir ifadeye yer verilir.\n- Başvurudan sonra ancak izahnamenin yayımlanmasından önce yapılan tanıtım ve reklamlar **yalnızca**\
    \ ihraççının faaliyet gösterdiği sektör ve sektördeki konumu, faaliyet konusu ve ürettiği mal veya hizmetler hakkında\
    \ olabilir. Bu reklamlarda izahname onaylanmadıysa **henüz onaylanmadığı**, onaylandıysa **nerede ilan edileceği** hususunda\
    \ uyarı zorunludur.\n\n**(d) Teslim, ilan, geçerlilik ve tescil (II-5.1 md. 17, 22/5, 28)**\n\n- Onaylanan izahname, onay\
    \ kararı tarihini takip eden **yirmi iş günü içinde teslim alınmalı**; teslim alınmasını takiben **on beş iş günü içinde**\
    \ ihraççının internet sitesinde, KAP'ta ve yetkili kuruluşun sitesinde ilan edilmelidir (md. 22/5, 28/3).\n- Bu sürelere\
    \ uyulmazsa izahnamenin **Kurulca yeniden onaylanmasına** karar verilmesi gerekir (md. 22/5).\n- Geçerlilik, ihraççının\
    \ KAP üyeliği bulunduğundan izahnamenin **KAP'ta ilan edildiği tarihte (3 Kasım 2026)** başlar (md. 28/5-a). İzahname,\
    \ güncelliği korunmak kaydıyla **ilk yayım tarihinden itibaren on iki ay** boyunca yapılacak ihraçlar için geçerlidir;\
    \ bu süre geçtikten sonraki halka arzlarda izahnamenin tümünün yeniden onaylanması gerekir (md. 17/1).\n- İzahnamenin\
    \ **nerede yayımlandığı** hususu ilandan itibaren **on iş günü içinde** ticaret siciline tescil ve TTSG'de ilan edilir;\
    \ ancak satışa başlanması için bu tescil şart değildir (md. 28/9). İzahname metninin kendisi tescil edilmez (Kanun md.\
    \ 7/1).\n"
  puanlama:
  - olcut: (a) En erken başlangıcı 6 Kasım 2026 olarak bulma ve 'takip eden üçüncü gün' kuralını, ilk halka arz nedeniyle
      iş günü kolaylığının uygulanmadığını belirtme (3); 2-20 iş günü sınırı (2); yeterli talepte de sürenin sonuna kadar
      devam (1)
    puan: 6
  - olcut: (b) Asgari tahsisatları 4.000.000 TL'şer bulup uygunluğu tespit (3); karşılanamayan 5.000.000 TL'yi hesaplama ve
      md. 18/6 uyarınca sınırlama olmaksızın diğer gruplara aktarılabileceğini belirtme (3)
    puan: 6
  - olcut: (c) Başvurudan itibaren 5 iş günü içinde ilan yerleri ve 'henüz onaylanmadı' ibaresi (3); reklamların sektör/konum/faaliyet/ürünlerle
      sınırlılığı ve zorunlu uyarı (3)
    puan: 6
  - olcut: (d) 20 iş günü teslim ve 15 iş günü ilan süreleri (2); yeniden onay sonucu (1); geçerliliğin KAP ilanıyla başlaması
      ve 12 ay (2); yayım yerinin 10 iş günü içinde tescili, satış için şart olmaması, metnin tescil edilmemesi (2)
    puan: 7
  kaynaklar:
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
