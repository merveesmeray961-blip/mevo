    bitis: null
  dogrulama:
    python: 'toplam = 40000000

      yayim_gun = 3

      sonuc = {''en_erken_baslangic'': ''2026-11-%02d'' % (yayim_gun + 3), ''asgari_bireysel'': toplam * 10 // 100, ''asgari_kurumsal'':
      toplam * 10 // 100, ''yurt_disi_karsilanamayan'': toplam * 30 // 100 - 7000000, ''bireysel_talep_fazlasi'': 26000000
      - toplam * 50 // 100, ''kurumsal_talep_fazlasi'': 10000000 - toplam * 20 // 100}'
  durum: kontrolde
  surum: 1
