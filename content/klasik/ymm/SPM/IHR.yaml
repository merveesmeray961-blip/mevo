- id: YMM-SPM-IHR-K016
  sinav: ymm
  ders: SPM
  konu: IHR
  kazanimlar:
  - halka açık ortaklığın sermaye artırımında halka arz edilmeksizin pay satışı (tahsisli satış)
  - tahsisli satışta yatırımcı sayısı sınırı ve izahname yükümlülüğü
  - halka arz edilmeksizin satışta beyan alınması ve saklama
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları borsada işlem gören, kayıtlı sermaye sistemindeki halka açık ortaklık **Boğaziçi Yazılım A.Ş.** (Boğaziçi),
    esas sözleşmeyle yetkilendirilmiş yönetim kurulu kararıyla yeni pay alma haklarını tamamen kısıtlayarak sermaye artırımı
    yapmayı ve artırılan sermayeyi temsil eden payları **halka arz etmeksizin, tahsisli satış yoluyla** satmayı planlamaktadır.
    İlgili dönemde (Haziran–Ekim 2026) 15 Temmuz 2026 dışında resmî tatil yoktur; hafta sonu tatildir.


    **Planlanan takvim:**


    | Tarih | Olay |

    |---|---|

    | 1 Haziran 2026 (Pazartesi) | Yönetim kurulu kararı |

    | 29 Haziran 2026 (Pazartesi) | Kurula ihraç belgesinin onayı için başvuru |

    | 20 Temmuz 2026 (Pazartesi) | Onaylı ihraç belgesinin ilanı |

    | 4–19 Ağustos 2026 | Payların satışı |


    Boğaziçi, satışın payları satın alacak üç fona **borsa dışında**, borsa fiyatının %12 altında bir fiyattan yapılmasını
    düşünmektedir.


    **Satış sonrası durum:** Satış, mevzuata uygun bir takvimle tamamlanmıştır. Boğaziçi, bu payları borsada işlem görmeyen
    nitelikte oluşturmuştur (tek ISIN). Payların gün sonu bakiyelerine göre yatırımcı dağılımı şöyledir (nitelikli yatırımcılar
    ve müşterek hesaplarda her hesap sahibi bu tabloda ayrıca belirtilmiştir):


    | Gün (2026) | Tekil hesaplı yatırımcı (nitelikli değil) | Müşterek hesap (her biri 2 kişi, hiçbiri nitelikli değil) |
    Nitelikli yatırımcı (tekil hesap) | Gün içinde alıp aynı gün tamamını satan |

    |---|---|---|---|---|

    | 14 Eylül (Pzt) | 100 | 10 | 30 | 6 |

    | 15 Eylül (Sal) | 112 | 14 | 35 | 8 |

    | 16 Eylül (Çar) | 118 | 16 | 40 | 5 |

    | 17 Eylül (Per) | 119 | 16 | 45 | 9 |


    MKK, gerekli sayı aşımını tespit ettiğinde bunu 18 Eylül 2026 (Cuma) günü ihraççıya ve Kurula bildirmiştir. Boğaziçi,
    satış öncesinde yatırımcılardan Kurulca içeriği belirlenen beyanları 31 Temmuz 2026''da imzalatmıştır. Bu yatırımcılardan
    Doğa Fonu 2024 yılında Boğaziçi''nin başka bir tahsisli satışında da beyan imzalamıştır; Zirve Portföy ise MKK nezdinde
    nitelikli yatırımcı olarak kaydı tutulan bir kurumdur.


    **İstenenler:**


    (a) Planlanan takvimi, Kurula başvuru süresi ile satışa başlama ve satış süresi bakımından değerlendiriniz; uyulması gereken
    en geç tarihleri ve Kurulun bu sürelere ilişkin yetkisini belirtiniz. (7 puan)


    (b) Satışın borsa dışında ve borsa fiyatının %12 altında yapılması planını değerlendiriniz; satış fiyatının nasıl belirleneceğini,
    Boğaziçi''nin payları borsada işlem görmeyen bir ortaklık olması hâlinde ne değişeceğini açıklayınız. (5 puan)


    (c) Tahsisli satılan payların gün sonu itibarıyla elinde bulunduran yatırımcı sayısını her gün için bulunuz; sayının aşıldığı
    günü, ihraççının izahname için Kurula ve borsaya başvuru süresinin son gününü belirtiniz. Boğaziçi payları borsada işlem
    gören nitelikte oluştursaydı sonuç ne olurdu? (8 puan)


    (d) Beyan alınması konusunda Doğa Fonu ve Zirve Portföy bakımından durumu ve beyanların saklanma süresini değerlendiriniz.
    (5 puan)

    '
  cozum: '**(a) Süreler (Pay Tebliği md. 13/1; II-5.2 md. 11/1, md. 12)**


    - Halka arz edilmeksizin pay satışında ihraç belgesinin onayı için başvuru, yetkili organ kararından itibaren **30 gün
    içinde** yapılır: 1 Haziran + 30 gün = **1 Temmuz 2026**. 29 Haziran''daki başvuru süresindedir.

    - Halka açık ortaklığın halka arz edilmeksizin yaptığı sermaye artırımında paylara, ihraç belgesinin ilan edildiği tarihi
    takip eden **10 iş günü içinde başlanmalı** ve satış **azami 10 iş günü içinde tamamlanmalıdır.** İlan 20 Temmuz olduğundan
    satışa en geç **3 Ağustos 2026 (Pazartesi)** başlanmalıdır (21–24 Temmuz: 4, 27–31 Temmuz: 9, 3 Ağustos: 10. iş günü).

    - Plan: satış 4 Ağustos''ta başlıyor → 11. iş günü, **aykırı.** Satış süresi 4–19 Ağustos arasında **12 iş günü** → azami
    10 iş gününü aşıyor, **aykırı.** (4–7 Ağustos: 4; 10–14 Ağustos: 9; 17–19 Ağustos: 12.)

    - Kurul, makul gerekçenin varlığı ve ihraççının talebi hâlinde bu satış sürelerinin uzatılmasına veya farklı bir süre
    belirlenmesine karar verebilir (II-5.2 md. 12/1); bu karar olmadan plan uygulanamaz.


    **(b) Satış yeri ve fiyatı (Pay Tebliği md. 13/3-6)**


    - Payları borsada işlem gören ortaklıkların sermaye artırımı yoluyla halka arz edilmeksizin yapacakları pay satışı **borsanın
    ilgili pazarında veya piyasasında** yapılmak zorundadır; borsa dışında satış planı **aykırıdır.**

    - Bu satışlarda satış fiyatı **borsa düzenlemelerine göre** belirlenir; ancak Kurulca uygun görülürse borsa düzenlemelerine
    göre farklı fiyattan satış yapılabilir. Borsa fiyatının %12 altında fiyat, Kurul uygun görmediği sürece uygulanamaz.

    - Yeni pay alma hakkının kısıtlanması, kayıtlı sermaye sisteminde esas sözleşmeyle yetkili kılınmışsa yönetim kurulu kararıyla
    yapılabilir (md. 13/3); Boğaziçi bu yönüyle uygundur.

    - Boğaziçi''nin payları borsada işlem görmeseydi, payların halka arz edilmeksizin satışında satış fiyatının tespiti için
    **yetkili kuruluşça fiyat tespit raporu hazırlanması zorunlu** olurdu (md. 13/6).


    **(c) Yatırımcı sayısı (II-5.2 md. 7/1-2, 8)**


    Tahsisli satılan araçların borsada işlem görmemesi esastır ve payları bir anda elinde bulunduran yatırımcı sayısının **150''yi
    geçmemesi** esastır. Kontrolde müşterek hesap sahibi kişiler ayrı ayrı sayılır, yalnızca **gün sonu bakiyesi olan** hesaplar
    dikkate alınır (gün içinde alıp satanlar sayılmaz) ve **nitelikli yatırımcılar hesaba katılmaz.**


    | Gün | Tekil | Müşterek (×2) | Sayılan yatırımcı | 150''yi aşıyor mu? |

    |---|---|---|---|---|

    | 14 Eylül | 100 | 10 × 2 = 20 | 120 | Hayır |

    | 15 Eylül | 112 | 14 × 2 = 28 | 140 | Hayır |

    | 16 Eylül | 118 | 16 × 2 = 32 | 150 | Hayır (geçmemesi esas; 150 geçmez) |

    | 17 Eylül | 119 | 16 × 2 = 32 | **151** | **Evet** |


    - Sayı **17 Eylül 2026''da** aşılmıştır. MKK 18 Eylül''de ihraççıya ve Kurula bildirdiğinden, ihraççı **bildirim tarihinden
    itibaren 20 iş günü içinde** hazırlayacağı izahnamenin onayı için Kurula ve payların borsada işlem görmesi için borsaya
    başvurur: 18 Eylül + 20 iş günü = **16 Ekim 2026 (Cuma)** (21–25 Eylül: 5; 28 Eylül–2 Ekim: 10; 5–9 Ekim: 15; 12–16 Ekim:
    20).

    - Boğaziçi, halka açık ortaklık olarak paylarını **borsada işlem gören nitelikte** oluştursaydı, bu paylar **yatırımcı
    sayısı yönünden bir sınırlama olmaksızın** borsada işlem görebilirdi (md. 7/2); 150 sınırı ve izahname başvurusu zorunluluğu
    doğmazdı.


    **(d) Beyanlar (II-5.2 md. 7/3-5, md. 9/2)**


    - Halka arz edilmeksizin yurt içinde yapılacak satışlarda içeriği Kurulca belirlenen beyanlar satıştan önce yatırımcılara
    imzalatılır; tahsisli satışta beyan, riskleri anlayıp kabul ettiğine ilişkin bilgiyi içerir.

    - **Doğa Fonu:** Daha önceki tahsisli satışta beyan imzalamış olması, yeni satıştaki beyan yükümlülüğünü ortadan kaldırmaz
    (md. 7/4); bu satış için de beyan alınması gerekir (31 Temmuz 2026''da alınmıştır, uygundur).

    - **Zirve Portföy:** MKK nezdinde kaydı tutulan nitelikli yatırımcılardan beyan alınması gerekmez; ancak MKK üyesi yatırım
    kuruluşları işlemden önce yatırımcının MKK kayıtlarında nitelikli olarak bulunup bulunmadığını kontrol etmekle yükümlüdür
    (md. 7/3). Kurumsal yatırımcılar zaten res''en kayda alınır (md. 9/2).

    - Beyanlar alındığı tarihten itibaren **5 yıl** saklanır ve istenirse bir örneği Kurula gönderilir: 31 Temmuz 2026 + 5
    yıl = **31 Temmuz 2031** (md. 7/5).


    Püf noktaları: (1) 150 sınırı "geçmemesi" olduğundan tam 150 ihlal değildir, 151. kişiyle ihlal doğar; (2) müşterek hesapta
    kişiler tek tek sayılır; (3) payları borsada işlem gören nitelikte oluşturmak sınırı ortadan kaldırır.

    '
