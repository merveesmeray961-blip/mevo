    **İfade 1 — Yanlış:** II-5.1 Tebliği uyarınca izahname, Kurul tarafından onaylanmadan kamuya duyurulamaz ve satış yapılamaz.
    Kurul, başvurunun eksiksiz tesliminden itibaren yirmi iş günü içinde onay ya da red kararı verir. Onay öncesi ilan yapılması
    Kanun''a aykırıdır ve idari yaptırıma yol açabilir.


    **İfade 2 — Yanlış:** II-5.2 Tebliği uyarınca fiyat aralığı yöntemiyle talep toplamada nihai satış fiyatı kamuoyuyla paylaşılan
    fiyat aralığı dışında belirlenemez. Aralığın üst ve alt sınırı bağlayıcıdır; "serbest fiyat belirleme" mümkün değildir.


    **İfade 3 — Yanlış:** SPKn md. 10 uyarınca izahnamedeki yanlış, yanıltıcı ve eksik bilgilerden doğan zararlardan ihraççı
    (Sigma dahil), halka arzı gerçekleştiren aracı kurum ve diğer sorumlular müteselsilen sorumludur. Sorumluluk yalnızca
    aracı kurumla sınırlı değildir; Sigma birinci derecede sorumlu taraftır.


    **(b) Satış yöntemleri:**


    II-5.2 Tebliği uyarınca halka arzda kullanılabilecek satış yöntemleri:


    1. **Sabit fiyatla satış:** Satış fiyatı önceden belirlenir ve kamuoyuyla paylaşılır. Talep aşımında orantılı dağıtım
    uygulanır.


    2. **Fiyat aralığı yöntemiyle talep toplama (kitap yapımı):** Belirlenen fiyat aralığında yatırımcılardan talep toplanır,
    sonra aralık içinde nihai fiyat belirlenir.


    3. **Borsa birincil piyasasında satış:** Borsanın belirlediği kurallara göre borsa platformu üzerinden gerçekleştirilir.


    Temel fark: Sabit fiyatla satışta fiyat sabittir; fiyat aralığı yönteminde piyasa dinamiğine göre fiyat oluşur. Borsa
    birincil piyasasında satış ise doğrudan borsa altyapısını kullanır.

    '
