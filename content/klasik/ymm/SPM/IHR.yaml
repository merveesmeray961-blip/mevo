    \ edilen tavanın uygunluğunu değerlendiriniz; Eta halka açık olmayan\nbir ortaklık olsaydı limitin ne olacağını belirtiniz.\
    \ (9 puan)\n\n(b) Esas sözleşmeyle ihraç yetkisinin devrini değerlendiriniz. Nitelikli yatırımcıya ve tahsisli satışta\n\
    hazırlanacak belgeyi, bu belgenin geçerlilik süresini ve yatırımcı sayısının 180'e çıkmasının sonucunu açıklayınız.\n\
    (7 puan)\n\n(c) Eta'nın ödeme güçlüğüne düşerek bono vadesinde ödeme yapamaması hâlinde borçlanma aracı sahipleri kurulunun\n\
    karar alma esaslarını ve vade erteleme kararının başlatılmış takiplere etkisini açıklayınız; temerrüt hâlinde\nyatırımcının\
    \ elindeki belgenin icra takibi açısından niteliğini belirtiniz. (6 puan)\n\n(d) Teminatlı bir ihraçta teminat yöneticisinin\
