  soru: 'Kappa Enerji A.Ş. (Kappa), 2026 yılında halka açılma sürecini tamamlamış; ancak halka arz izahnamesi yanlış finansal
    bilgiler içermiştir. Aşağıdaki kişiler izahname hazırlık sürecine dahil olmuştur:


    - **Kappa Yönetim Kurulu:** İzahname hazırlık sürecini yürütmüş ve imzalamıştır.

    - **Aracı Kurum Omega:** Halka arzı gerçekleştiren kuruluştur.

    - **Bağımsız Denetçi Delta:** Finansal tabloları denetlemiş ve raporunu izahname ekinde sunmuştur.


    Yatırımcı Zeynep Hanım, izahnamedeki hatalı bilgiye dayanarak 500.000 TL değerinde pay satın almış ve piyasa düzeltmesi
    sonucunda 100.000 TL zarar etmiştir.


    (a) Zeynep Hanım''ın tazminat talebini kimlere yöneltebileceğini ve hukuki dayanağını açıklayınız. (12 puan)


    (b) Kappa''nın kullandığı satış yöntemini fiyat aralığı yöntemiyle kıyaslayarak farkları belirtiniz. (8 puan)

    '
  cozum: '**(a) Tazminat talebi:**


    SPKn md. 10 uyarınca izahnamedeki yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan tüm sorumlular **müteselsilen**
    sorumludur. Zeynep Hanım 100.000 TL zararını şu kişilerden herhangi birinden veya tamamından talep edebilir:


    - **Kappa Yönetim Kurulu:** İhraççı sıfatıyla müteselsil sorumludur.

    - **Aracı Kurum Omega:** Halka arzı gerçekleştiren olarak müteselsil sorumluluk kapsamındadır.

    - **Bağımsız Denetçi Delta:** Denetlediği finansal tablolardaki hatalı bilgiler kapsamında müteselsil sorumlu olabilir.


    Müteselsil sorumluluk sayesinde Zeynep Hanım tazminatı bunların herhangi birinden —örneğin yalnızca aracı kurumdan— talep
    edebilir. İçlerinden biri tazminatı öderse diğerlerine rücu edebilir.


    **(b) Satış yöntemi karşılaştırması:**


    Kappa''nın kullandığı yöntem izahnamede açıkça belirtilmemiş olmakla birlikte iki temel yöntem şöyle karşılaştırılabilir:


    | Özellik | Sabit Fiyatla Satış | Fiyat Aralığı Yöntemi |

    |---|---|---|

    | Fiyat | Önceden sabittir | Aralık içinde talebe göre oluşur |

    | Esneklik | Düşük | Yüksek |

    | Talep aşımı | Orantılı dağıtım | Nihai fiyatla talep eşlenir |

    | Yatırımcı belirsizliği | Düşük | Orta |


    Fiyat aralığı yöntemi piyasa koşullarına daha duyarlıdır ve genellikle daha büyük halka arzlarda tercih edilir.

    '
