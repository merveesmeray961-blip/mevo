  soru: 'Aşağıdaki işletmelerin pay halka arzlarına ilişkin tarihler verilmiştir. Haziran 2026''da resmî tatil bulunmamaktadır;
    hafta sonu tatildir.


    | İşletme | Durum |

    |---|---|

    | **Anka Tarım A.Ş.** | Paylarını **ilk kez** halka arz edecektir; izahname **1 Haziran 2026 (Pzt)**, fiyat tespit raporu
    **2 Haziran 2026 (Sal)** tarihinde yayımlanmıştır |

    | **Bulut Enerji A.Ş.** | Payları borsada işlem görmektedir; ek pay halka arzı için izahname ve fiyat tespit raporu **2
    Haziran 2026 (Sal)** tarihinde yayımlanmıştır |


    Anka Tarım için talep toplama yoluyla satış yöntemi seçilmiştir. Ayrı iki durumda fiyat revizyonu söz konusudur: **Durum
    1:** Fiyat aralığı satış başlamadan önce **8 Haziran 2026 (Pzt)** günü özel durum açıklamasıyla aşağı yönlü revize edilmiştir.
    **Durum 2:** Halka arz süresi 10-12 Haziran 2026 (Çar-Cum) olarak belirlenmiş, fiyat aralığı 11 Haziran''da aşağı yönlü
    revize edilmiştir.


    **İstenenler:**

    (a) Anka Tarım için halka arzın başlayabileceği en erken tarihi belirtiniz. (5 puan)

    (b) Bulut Enerji için halka arzın başlayabileceği en erken tarihi belirtiniz. (4 puan)

    (c) Durum 1''de Anka Tarım halka arzının başlayabileceği en erken tarihi belirtiniz. (5 puan)

    (d) Durum 2''de halka arz süresinin nasıl değişeceğini ve en erken bitiş tarihini belirtiniz. (6 puan)

    (e) Talep toplama yönteminde yatırımcıların taleplerini değiştirme veya geri alma hakkını açıklayınız. (4 puan)

    '
  cozum: '**(a)** Halka arza en erken, izahnamenin ve fiyat tespit raporunun yayımlanmasını takip eden **üçüncü gün** başlanabilir;
    belgeler farklı günlerde ilan edilmişse süre **daha geç yayımlanan belgenin** ilan tarihinden başlar (II-5.2 md. 10/1).
    Geç olan belge 2 Haziran''dadır; 2 + 3 = **5 Haziran 2026**.


    **(b)** Payları borsada işlem gören ihraççıların sonraki halka arzlarında (ilk halka arz hariç) 10/1 ve 10/2''deki süreler
    **takip eden iş günü** olarak uygulanır (md. 10/3). Yayım 2 Haziran → **3 Haziran 2026 (Çarşamba)**.


    **(c)** Fiyat aralığı satış başlangıcından önce revize edilirse halka arza en erken, özel durum açıklamasını takip eden
    **ikinci gün** başlanabilir (md. 10/2). 8 + 2 = **10 Haziran 2026**.


    **(d)** Revize satış/talep toplama süresi **içinde** yapılırsa belirlenen halka arz süresine **asgari iki iş günü** ilave
    edilir. Süre 12 Haziran''da bitecekti; 15 Haziran (Pzt) ve 16 Haziran (Sal) eklenir; en erken bitiş **16 Haziran 2026**.


    **(e)** İzahnamede aksi belirtilmedikçe, talep toplama yöntemiyle yapılan halka arzlarda izahnamede değişiklik olmasa
    dahi yatırımcılar talep toplama süresi içinde taleplerini **değiştirme veya geri alma** hakkına sahiptir (md. 14/3).

    '
  puanlama:
