- id: YMM-SPM-IHR-K020
  sinav: ymm
  ders: SPM
  konu: IHR
  kazanimlar:
  - halka arz edilmeksizin borçlanma aracı satışı (tahsisli satış, nitelikli yatırımcıya satış)
  - ihraç belgesi, ihraç tavanı ve geçerlilik süresi
  - Kurul ücretinin hesaplanması ve ISIN kodu kuralı
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: 'Halka açık olmayan **Karadeniz Kimya A.Ş.** (Karadeniz), borçlanma araçlarını yurt içinde **halka arz etmeksizin**
    satmak istemektedir. Kurul, 300.000.000 TL ihraç tavanını içeren ihraç belgesini **14 Nisan 2026 (Salı)** tarihli kararıyla
    onaylamış; ihraç belgesi aynı hafta teslim alınmış ve Karadeniz''in internet sitesinde **21 Nisan 2026 (Salı)** günü ilan
    edilmiştir (Karadeniz KAP üyesi değildir). Karadeniz banka, finansal kuruluş ya da sermaye piyasası kurumu değildir; ihraççılar
    için Kurul ücreti oranlarının uygulanma biçimi mevzuata göre belirlenecektir. Dönemde 23 Nisan 2026 dışında resmî tatil
    yoktur; hafta sonu tatildir.


    Karadeniz''in planladığı tertipler:


    | Tertip | Araç | Nominal (TL) | Vade | Satış şekli |

    |---|---|---|---|---|

    | T1 | Tahvil (par değerinden) | 120.000.000 | 400 gün | Tahsisli satış; 22 Nisan 2026''da satış |

    | T2 | Finansman bonosu (iskontolu; ihraç değeri 76.000.000 TL) | 80.000.000 | 150 gün | Nitelikli yatırımcılara |

    | T3 | Finansman bonosu (par değerinden) | 40.000.000 | 200 gün | Nitelikli yatırımcılara, 12 Ocak 2027''de satış |

    | T4 | Tahvil (par değerinden) | 70.000.000 | 400 gün | Nitelikli yatırımcılara, 19 Nisan 2027''de satış |


    **T1 için ayrıntılar:** Tahvillerin birim nominal değeri **50.000 TL**''dir. Satışın 180 yatırımcıya yapılması hedeflenmekte,
    bunlardan 45''i nitelikli yatırımcı olup 135''i diğer yatırımcılardan oluşmaktadır. Yönetim, satışa ihraç belgesinin ilanıyla
    aynı gün olan **21 Nisan 2026**''da başlamayı düşünmektedir. T1''in satışı 22 Nisan 2026''da fiilen başlayıp tamamlanacaktır.


    **ISIN:** T1''in iki ayrı kısmı olarak 22 Nisan 2026 ve 6 Mayıs 2026''da ihraç edilen tahvillerin ikisi de aynı vade bitiş
    tarihinde (27 Mayıs 2027) itfa olacak ve aynı kupon oranını taşıyacaktır. Karadeniz bunların tek bir ISIN koduyla izlenmesini
    istemektedir.


    **İstenenler:**


    (a) T1 planını satış şekli, birim nominal değer ve yatırımcı sayısı bakımından değerlendiriniz; uygunluk sağlayacak alternatifleri
    belirtiniz. (5 puan)


    (b) İhraç belgesinin geçerlilik süresini, tertiplerin ihracında izlenecek usulü ve satışa başlanabilecek en erken günü
    belirtiniz; T3 ve T4 tertiplerini ihraç tavanı ve geçerlilik süresi bakımından değerlendiriniz. (8 puan)


    (c) T1, T2 ve T3 için Kurul ücretini hesaplayınız ve ücretin ödeneceği zamanı belirtiniz. (8 puan)


    (d) ISIN planını değerlendiriniz. (4 puan)

    '
  cozum: '**(a) T1: tahsisli satış (Borçlanma Araçları Tebliği md. 4/1; II-5.2 md. 8/1-2, 9/1)**


    - Yurt içinde halka arz edilmeksizin yapılacak borçlanma aracı satışları iki şekilde yapılabilir: **nitelikli yatırımcıya
    satış** ve **birim nominal değeri asgari 100.000 TL olmak kaydıyla tahsisli satış.** T1''in birim nominal değeri 50.000
    TL olduğundan tahsisli satış planı **aykırıdır.**

    - Yatırımcı sayısı: tahsisli satılan araçların belirli bir anda elinde bulunduran yatırımcı sayısının 150''yi geçmemesi
    esastır ve bu hesaplamada **nitelikli yatırımcılar dikkate alınmaz:** 180 − 45 = **135 < 150**, bu yönüyle sorun yoktur.

    - Alternatifler: (i) birim nominal değeri en az **100.000 TL**''ye çıkarmak; veya (ii) satışı **yalnızca nitelikli yatırımcılara**
    yapmak (asgari birim nominal değer aranmaz ve yatırımcı sayısı kısıtı uygulanmaz).


    **(b) İhraç belgesi ve tertipler (II-5.1 md. 5/2, 16, 18; Borçlanma Araçları Tebliği md. 6/4; II-5.2 md. 11/2)**


    - İzahname hazırlanmaksızın yapılan halka arz edilmeksizin satış için **ihraç belgesi hazırlanıp Kurulca onaylanması zorunludur.**
    İhraç tavanını içeren ihraç belgesi, onayın kararlaştırıldığı **Kurul karar tarihinden (14 Nisan 2026) itibaren bir yıl**
    geçerlidir: **14 Nisan 2027''ye kadar.**

    - Borçlanma araçlarının yurt içinde halka arz edilmeksizin ihracında, onaylı ihraç belgesinin ihraççıya verilmesinden
    sonra Kurul nezdinde başka işlem gerekmeksizin ihraç tavanı dahilinde **her tertibin satışından önce MKK''ya başvurularak**
    satış yapılır.

    - Pay dışı araçların halka arz edilmeksizin satışına, ihraç belgesinin ilan edildiği tarihi **takip eden iş gününde**
    başlanabilir: 21 Nisan 2026''da ilan edildiğinden en erken **22 Nisan 2026 (Çarşamba).** 21 Nisan''da satışa başlanması
    **aykırıdır.**

    - **T3:** Satış tarihi (12 Ocak 2027) geçerlilik süresi içindedir; kümülatif tutar 120 + 80 + 40 = 240.000.000 TL ≤ 300.000.000
    TL tavanı içindedir → **uygundur.**

    - **T4:** 19 Nisan 2027, ihraç belgesinin geçerlilik süresi (14 Nisan 2027) **sonrasındadır**; ayrıca 240 + 70 = 310.000.000
    TL tavanı da (300.000.000 TL) **aşar.** İki yönden de **uygun değildir**; yeni bir ihraç belgesi/tavan onayı gerekir.


    **(c) Kurul ücreti (Borçlanma Araçları Tebliği md. 12)**


    - Ücret, varsa **nominal değerden aşağı olmamak üzere** ihraç değeri üzerinden hesaplanır. Vadeye göre oranlar: ≤179 gün
    **on binde beş**; 180–364 gün **on binde yedi**; 365–730 gün **binde bir.**

    - Banka, finansal kuruluş, 6361''deki şirket, yurt dışı ihraççı ve sermaye piyasası kurumları dışındaki ihraççılar için
    oranların **%75''i** uygulanır. Karadeniz bunlardan biri olmadığından %75 geçerlidir.


    | Tertip | Matrah | Vade | Oran | %75 sonrası | Ücret |

    |---|---|---|---|---|---|

    | T1 | 120.000.000 | 400 gün | 0,001 | 0,00075 | **90.000 TL** |

    | T2 | 80.000.000 (ihraç değeri 76 milyon TL nominalin altında olduğundan nominal esas) | 150 gün | 0,0005 | 0,000375
    | **30.000 TL** |

    | T3 | 40.000.000 | 200 gün | 0,0007 | 0,000525 | **21.000 TL** |


    Toplam = **141.000 TL.** Yurt içi ihraçlarda ücret, ihraç belgesinin ihraççıya tesliminden sonra, MKK''nın belirlediği
    esaslar çerçevesinde araçların ihraççı havuz hesaplarına aktarılmasından **önce** Kurul bütçesine yatırılır (md. 12/3).


    **(d) ISIN (II-5.2 md. 5/10)**


    - Vade bitiş tarihi aynı gün olsa dahi, ihraç tarihindeki vadesi, faiz/iskonto oranı veya ihraç tavanı farklı olan araçlar
    için aynı ISIN kodu kullanılamaz. 22 Nisan 2026 ihraçlı tahvilin vadesi 400 gün; 6 Mayıs 2026 ihraçlı olanın vadesi 386
    gündür → ihraç tarihindeki vadeleri farklıdır. **Tek ISIN kullanılamaz;** ayrı ISIN alınmalıdır.


    Püf noktaları: (1) Tahsisli satışta 100.000 TL birim nominal şartı vardır, nitelikli yatırımcıya satışta yoktur; (2) 150
    hesabında nitelikli yatırımcılar sayılmaz; (3) ücret iskontolu ihraçta da nominal değerin altına inmez.

    '
