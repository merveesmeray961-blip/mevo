- id: YMM-SPM-IHR-K014
  sinav: ymm
  ders: SPM
  konu: IHR
  kazanimlar:
  - fiyat aralığı ile talep toplama yöntemi ve tahsisat kaydırma
  - talep toplamada dağıtım ilkeleri ve mükerrer talep
  - dağıtım listesi, bedel iadesi ve satış sonuçlarının açıklanması
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları ilk kez halka arz edilecek **Kızılırmak Gıda A.Ş.** (Kızılırmak), paylarını **fiyat aralığı ile talep toplama**
    yöntemiyle (borsada satış yöntemi kullanılmaksızın) halka arz edecektir. Aracılığı **Liman Menkul Değerler A.Ş.** (Liman)
    konsorsiyum lideri olarak yürütmekte; konsorsiyumda **Çarşı Yatırım A.Ş.** (Çarşı) üye olarak yer almaktadır. İlgili dönemde
    resmî tatil yoktur; hafta sonu tatildir.


    | Kalem | Bilgi |

    |---|---|

    | Halka arz edilecek pay | 10.000.000 adet (pay başına nominal değer 1 TL) |

    | İzahnamedeki tahsisat | Yurt içi bireysel 2.400.000 pay (%24); yurt içi kurumsal 4.000.000 pay (%40); yurt dışı kurumsal
    3.600.000 pay (%36) |

    | Fiyat aralığı (ilk öneri) | Taban 30 TL – tavan 38 TL |

    | Talep toplama süresi | 9–11 Eylül 2026 (Çarşamba–Cuma) |


    İzahnamede, tahsisat oranlarında kaydırma yapılabileceği ve kaydırmanın esasları açıklanmıştır.


    1. Yönetim, talep toplama sonunda yurt içi bireysel gruba ayrılan 2.400.000 payın **600.000 adedini** yurt içi kurumsal
    gruba kaydırmayı planlamaktadır.

    2. Yurt içi bireysel grubun payları, yalnızca bu grup içindeki talepler arasında, izahnamede belirtilen tahsisat üzerinden
    (kaydırma yapılmadığı varsayılarak) dağıtılacaktır. Bu gruba ilişkin talepler şöyledir:


    | Yatırımcı | Talebi toplayan yetkili kuruluş | Talep (pay) |

    |---|---|---|

    | Ahmet | Liman | 100.000 |

    | Berna | Liman | 300.000 |

    | Berna | Çarşı | 200.000 |

    | Cem | Çarşı | 500.000 |

    | Deniz | Liman | 600.000 |

    | Ece | Çarşı | 1.200.000 |

    | Fikret | Liman | 1.900.000 |


    3. Liman, dağıtım listesini ihraççıya teslim süresinin son günü teslim etmiştir. Kızılırmak da listeyi kendisine tanınan
    sürenin son günü onaylayıp Liman''a teslim etmiş, liste onay günü kesinleşmiştir. Liman, onaylı listeyi aynı gün teslim
    almıştır.

    4. Liman, talep toplama sürerken 10 Eylül 2026''da basına "Talepler satışa sunulan payların 3 katına ulaştı" açıklamasında
    bulunmuştur.

    5. Dağıtım sonucunda önemli alıcılar şunlardır: Fikret (bireysel) 500.000 pay; Güney Emeklilik Fonu (yurt içi kurumsal)
    800.000 pay; Toprak Portföy (yurt içi kurumsal) 500.000 pay; Fjord Fonu (yurt dışı kurumsal) 1.200.000 pay; Kızılırmak
    yönetim kurulu üyesi Hakan (bireysel) 20.000 pay.


    **İstenenler:**


    (a) 1 numaralı plan ile fiyat aralığı önerisini mevzuata göre değerlendiriniz; tavan fiyatın en çok kaç TL olabileceğini
    ve kaydırılabilecek en fazla pay sayısını bulunuz. (6 puan)


    (b) 2 numaralı verilerle bireysel gruptaki dağıtımı Tebliğdeki esaslara göre yapınız (mükerrer talebi de dikkate alınız).
    Oransal dağıtım yöntemi seçilmiş olsaydı Berna ve Fikret''e düşecek pay sayısını bulunuz. (8 puan)


    (c) 3 numaralı bilgilere göre; Liman''ın listeyi ihraççıya teslim ettiği, Kızılırmak''ın onayladığı, bedel iadelerinin
    yapılacağı ve dağıtım sonuçlarının kamuya açıklanacağı en geç tarihleri bulunuz. (6 puan)


    (d) 4 ve 5 numaralı bilgileri, satış sonuçlarının açıklanması ve satış sürecindeki açıklamalar bakımından değerlendiriniz;
    kamuya açıklanması zorunlu alıcıları belirtiniz. (5 puan)

    '
  cozum: '**(a) Fiyat aralığı ve kaydırma (II-5.2 md. 14/8 ve md. 18/4-5)**


    - Fiyat aralığı ile talep toplamada **tavan fiyat, taban fiyatın %20 fazlasını aşamaz.** Taban 30 TL ise tavan en çok
    30 × 1,20 = **36 TL** olabilir. 38 TL, taban fiyatın %26,67 fazlası olduğundan **aykırıdır**.

    - Tahsisat oranlarında kaydırma, esasları izahnamede açıklanmışsa yapılabilir (md. 18/5). Ancak (i) yurt içi bireysel
    ve yurt içi kurumsal gruplara ayrılacak asgari oranlar (nominal değerin en az %10''u = 1.000.000 pay) azaltılamaz; (ii)
    **herhangi bir yatırımcı grubu için izahnamede açıklanan tutarın %20''sinden fazla azaltma yapılamaz.**

    - Yurt içi bireysel grup için azami azaltma: 2.400.000 × %20 = **480.000 pay**; grup tahsisatı en az 1.920.000 pay kalmalıdır
    (bu tutar %10''luk asgari sınır olan 1.000.000 payın üzerindedir). Planlanan 600.000 paylık azaltma (%25) **aykırıdır.**


    **(b) Dağıtım (II-5.2 md. 19, 20, 22)**


    *Mükerrer talep (md. 22/1):* Bir defadan fazla talepte bulunan yatırımcının yalnızca en yüksek miktarlı talebi dikkate
    alınır. Berna''nın 300.000 ve 200.000 paylık talepleri için yalnız **300.000** hesaba katılır. Talep eden yatırımcı sayısı
    6''dır.


    *Eşit dağıtım (md. 20/2-a, b; grup içinde eşit davranılması md. 19/1):*


    | Tur | Dağıtılacak tutar | Yatırımcı sayısı | Kişi başı pay | Karşılanan talepler | Kalan |

    |---|---|---|---|---|---|

    | 1 | 2.400.000 | 6 | 400.000 | Ahmet 100.000; Berna 300.000 | 2.000.000 |

    | 2 | 2.000.000 | 4 | 500.000 | Cem 500.000 | 1.500.000 |

    | 3 | 1.500.000 | 3 | 500.000 | (altında talep yok) Deniz, Ece, Fikret 500.000''er | 0 |


    Sonuç: Ahmet 100.000; Berna 300.000; Cem 500.000; Deniz 500.000; Ece 500.000; Fikret 500.000 (toplam 2.400.000).


    *Oransal dağıtım (md. 20/3):* Arzın talebi karşılama oranı = tahsisat ÷ toplam talep. Oransal yöntemde **mükerrer talep
    hükmü uygulanmaz** (md. 22/1), yani Berna''nın iki talebi de sayılır: toplam talep = 100.000 + 300.000 + 200.000 + 500.000
    + 600.000 + 1.200.000 + 1.900.000 = 4.800.000. Oran = 2.400.000 ÷ 4.800.000 = **0,50**.

    - Berna: (300.000 + 200.000) × 0,50 = **250.000 pay**

    - Fikret: 1.900.000 × 0,50 = **950.000 pay**


    **(c) Süreler (II-5.2 md. 23 ve 24/4)**


    | Aşama | Dayanak | En geç tarih |

    |---|---|---|

    | Talep toplamanın bitişi | — | 11 Eylül 2026 (Cuma) |

    | Liman''ın dağıtım listesini ihraççıya teslimi | Bitimi izleyen 2 iş günü (md. 23/1) | **15 Eylül 2026 (Salı)** |

    | Kızılırmak''ın listeyi onaylayıp teslimi (liste kesinleşir) | Teslimi izleyen 2 iş günü (md. 23/2) | **17 Eylül 2026
    (Perşembe)** |

    | Liman''ın konsorsiyum üyelerine bildirimi | Onaylı listeyi aldığı gün (md. 23/4) | 17 Eylül 2026 |

    | Karşılanamayan taleplerin bedel iadesi (Liman ve Çarşı) | Listenin teslim alınmasını/bildirimi izleyen iş günü (md.
    23/4) | **18 Eylül 2026 (Cuma)** |

    | Dağıtım sonuçlarının KAP''ta açıklanması | Listenin kesinleştiği günü takip eden 2 iş günü (md. 24/4) | **21 Eylül 2026
    (Pazartesi)** |


    **(d) Satış sonuçlarının açıklanması ve satış sürecindeki açıklamalar**


    - Ek satış, kaydırma ve dağıtım sonuçlarının (nihai tutar, grup bazında tutar-oran-yatırımcı sayısı) açıklanması, md.
    24/4 uyarınca payların ilk halka arzında yetkili kuruluşun (burada Liman) yükümlülüğüdür.

    - Aynı bentte, halka arz edilen payların **nominal değerinin %5''inden fazlasını** satın alanlar açıklanır: %5 × 10.000.000
    = **500.000 pay**. Eşiğin *fazlası* aranır: **Güney Emeklilik Fonu (800.000) ve Fjord Fonu (1.200.000)** açıklanır; **Fikret
    ve Toprak Portföy 500.000 pay ile tam eşikte olduklarından açıklama kapsamına girmez.**

    - Ortaklıkta idari sorumluluğu bulunan kişilerin pay alımları (Hakan, 20.000 pay) **orana bağlı olmaksızın** kamuya açıklanır
    (md. 24/6).

    - Halka arz süreci devam ederken gelen talep tutarına ilişkin açıklama yapılamaz (md. 28/4). Liman''ın 10 Eylül tarihli
    açıklaması **aykırıdır**. Talep tutarı ancak halka arz süresi bittikten sonra, yanıltıcı olmamak şartıyla ve **tahsisat
    gruplarının seçilmiş bir kısmına ilişkin olmaksızın** açıklanabilir.


    Püf noktaları: (1) "Yüzde beşinden fazlası" ifadesinde tam %5 alan yatırımcı açıklama kapsamına girmez; (2) oransal dağıtımda
    mükerrer talep elenmez; (3) kaydırmada iki ayrı sınır vardır: asgari %10 ve grup başına %20 azaltma sınırı.

    '
  puanlama:
  - olcut: (a) Tavan fiyatın 36 TL olarak hesaplanması ve 38 TL'nin aykırılığı
    puan: 2
  - olcut: (a) Kaydırmada asgari oran ve %20 azaltma sınırı; en çok 480.000 pay
    puan: 4
  - olcut: (b) Mükerrer talebin elenmesi (Berna 300.000)
    puan: 2
  - olcut: (b) Eşit dağıtım adımlarının doğru uygulanması ve sonuç tablosu
    puan: 4
  - olcut: (b) Oransal yöntemde oran 0,50, Berna 250.000 ve Fikret 950.000; mükerrer hükmün uygulanmaması
    puan: 2
  - olcut: (c) Liman'ın liste teslimi 15 Eylül ve ihraççı onayı 17 Eylül
    puan: 2
