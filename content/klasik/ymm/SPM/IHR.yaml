    yer almaktadır; sonradan bu bilgilerin yanlış olduğu anlaşılmış ve yatırımcılar zarar görmüştür.


    **İstenenler:**

    (a) Genel kurul kararının kapsamı bakımından, kararda yalnızca "borçlanma aracı" ifadesi yer almasının sonucunu ve yönetim
