  soru: 'Payları borsada işlem gören, kayıtlı sermaye sistemindeki **Ova Çimento A.Ş.** (Ova), kısmen borçlanma aracı ihraç
    etmek istemektedir. Çıkarılmış sermayesi 270.000.000 TL (pay başına nominal 1 TL, toplam 270.000.000 pay), kayıtlı sermaye
    tavanı 300.000.000 TL''dir. Esas sözleşmesinde yönetim kuruluna yeni pay alma haklarını sınırlandırma yetkisi **verilmemiştir.**


    **1. Türlerin değerlendirilmesi.** Ova''nın ihraç etmeyi düşündüğü araçlar:


    | No | Araç | Özellik |

    |---|---|---|

    | I | "Tahvil" | Vadesi 300 gündür |

    | II | "Finansman bonosu" | Vadesi 360 gündür |

    | III | "Finansman bonosu" | Vadesi 400 gündür |

    | IV | Değiştirilebilir tahvil (DET) | Vadesi 18 ay; değiştirme hakkı vade başlangıcından 10 ay sonra kullanılabilecektir
    |


    **2. Paya dönüştürülebilir tahvil (PDT).** Ova, halka arz edilerek satılacak 200.000.000 TL nominal tutarında PDT çıkarmayı
    planlamaktadır. Dönüştürme fiyatı pay başına 4 TL''dir. Vade 24 ay olup vade başlangıç tarihi (PDT''lerin yatırımcı hesaplarına
    aktarıldığı ilk gün) **15 Haziran 2026 (Pazartesi)**''dir.


    **3. Dönüştürme.** (i) Ova, 2027 yılında **kendi talebiyle** PDT''leri paylara dönüştürmek için **22 Haziran 2027 (Salı)**
    günü talep toplamaya başlamayı, **2 Temmuz 2027 (Cuma)** günü bitirmeyi planlamakta; KAP açıklamasını **10 Haziran 2027''de**
    yapmayı düşünmektedir. (ii) Başka bir senaryoda PDT sahipleri, sahip oldukları toplam **40.000.000 TL** nominal PDT için
    kendi talepleriyle dönüştürme talebinde bulunmuştur (planlanan tutar 120.000.000 TL''ye indirildikten sonraki ihracın
    parçası olarak). (iii) PDT sahibi Selim''in elinde 1.010 TL nominal PDT vardır.


    Ova''nın ilgili dönemlerde resmî tatili yoktur; hafta sonu tatildir.


    **İstenenler:**


    (a) I–IV numaralı araçları, Borçlanma Araçları Tebliği''ndeki tanım ve vade koşullarına göre değerlendiriniz. (5 puan)


    (b) 2 numaralı PDT ihracını, halka arz koşulları ve kayıtlı sermaye tavanı bakımından değerlendiriniz; tavanı aşmadan
    ihraç edilebilecek en yüksek PDT nominal tutarını bulunuz. (8 puan)


    (c) 3 numaralı bilgileri değerlendiriniz: dönüştürmenin en erken yapılabileceği tarihi, (i) için KAP açıklamasının yapılması
    gereken en geç tarihi ve talep toplama süresini; (ii) için sermaye artırımı yapılıp yapılmayacağını (Ova''nın toplam pay
    sayısı 270.000.000 kabul edilecektir) ve 40.000.000 TL yerine 60.000.000 TL olsaydı sonucu belirtiniz. (8 puan)


    (d) Selim''in dönüştürmede alacağı pay sayısını ve nakden alacağı tutarı hesaplayınız; dönüştürme giderlerini ve ortak
    rüçhan haklarıyla ilişkisini belirtiniz. (4 puan)

    '
  cozum: '**(a) Türler (Borçlanma Araçları Tebliği md. 3, 24)**


    - **Tahvil:** vadesi **365 gün veya daha uzun** olan borçlanma aracıdır. **Finansman bonosu:** vadesi **30 günden az,
    364 günden fazla olmayan** araçtır.

    - I: Vadesi 300 gün olan araç tahvil olamaz; niteliği **finansman bonosudur** (tahvil olarak ihraç edilemez).

    - II: 360 gün, 30–364 gün aralığında → finansman bonosu olarak **uygundur.**

    - III: 400 gün vadeli araç finansman bonosu olamaz; niteliği **tahvildir.**

    - IV: DET''in vadesi 365 günden az olamaz (18 ay ≈ 547 gün uygundur); ancak DET''lerin paylarla değiştirilmesi vade başlangıç
    tarihinden itibaren **en erken 365 gün sonra** yapılabilir. Değiştirme hakkının 10 ay (≈ 300 gün) sonra tanınması **aykırıdır.**


    **(b) PDT ihracı (Borçlanma Araçları Tebliği md. 17/5; Kayıtlı Sermaye Sistemi Tebliği md. 6/7)**


    - PDT''lerin **halka arz edilerek** satılması için ihraççının payları borsada işlem görmeli (Ova görüyor), **kayıtlı sermaye
    sisteminde** olmalı (Ova öyle) ve **yönetim kurulu pay sahiplerinin yeni pay alma haklarının sınırlandırılması konusunda
    esas sözleşme ile yetkili kılınmış** olmalıdır. Ova''nın esas sözleşmesinde bu yetki bulunmadığından halka arz **bu hâliyle
    yapılamaz**; önce esas sözleşme değişikliği yapılmalıdır.

    - Kayıtlı sermayeli ortaklıkta PDT ihracında, dönüştürme sonucunda verilecek paylar ile çıkarılmış sermayenin toplamı
    **kayıtlı sermaye tavanını aşamaz.** 200.000.000 TL ÷ 4 TL = 50.000.000 pay; 270.000.000 + 50.000.000 = **320.000.000
    TL > 300.000.000 TL → aykırı.**

    - Tavan altında kalan pay payı: 300.000.000 − 270.000.000 = 30.000.000 pay; en yüksek PDT nominal tutarı = 30.000.000
    × 4 TL = **120.000.000 TL.**


    **(c) Dönüştürme (Borçlanma Araçları Tebliği md. 10/2, 17/2, 19, 21, 22)**


    - Vade başlangıç tarihi 15 Haziran 2026''dır; dönüştürme vade başlangıcından itibaren **en erken 365 gün sonra** yapılabilir:
    **15 Haziran 2027.**

    - **(i) Ortaklığın talebine bağlı dönüştürme:** Talep toplama süresinin başlangıcından **en az 15 gün önce** KAP''ta özel
    durum açıklaması yapılmalıdır: 22 Haziran 2027 − 15 gün = **en geç 7 Haziran 2027 (Pazartesi)**. 10 Haziran''daki açıklama
    (12 gün önce) **geç kalmıştır.** Talep toplama süresi **10 iş gününü geçemez**: 22 Haziran–2 Temmuz arası 9 iş günüdür
    (22–25 Haziran: 4; 28 Haziran–2 Temmuz: 9) ve uygundur. Talep toplama süresinde talepte bulunmayan PDT sahiplerinin iradeleri
    bedelin nakden ödenmesi şeklinde değerlendirilir.

    - **(ii) PDT sahibinin talebine bağlı dönüştürme:** 40.000.000 ÷ 4 = 10.000.000 pay; toplam paya oranı 10.000.000 ÷ 270.000.000
    = **%3,70 < %5** → halka açık ihraççılar **sermaye artırımı yapmayabilir** (md. 22/3). 60.000.000 TL olsaydı 15.000.000
    pay ve oran **%5,56** olacağından %5''in altında kalmayacak, sermaye artırımı **yapılması gerekecekti.**


    **(d) Küsurat, gider ve öncelik (md. 17/4, 17/6, 18/3)**


    - Selim: 1.010 ÷ 4 = 252,5 pay → **252 pay**; küsurata isabet eden 0,5 pay, dönüştürme fiyatı esas alınarak **nakden ve
    peşinen** ödenir: 0,5 × 4 TL = **2 TL.**

    - Dönüştürme giderlerinin tamamı **ortaklığa aittir.**

    - Halka açık ortaklığın PDT ile dönüştürülmek üzere çıkardığı ve artırılacak sermayeyi temsil eden payları, TTK md. 461''deki
    yeni pay alma hakkı dahil **her türlü önceliklerden öne alınarak PDT sahiplerine tahsis edilir.**


    Püf noktaları: (1) tahvil ile finansman bonosu ayrımı vade ile (365 gün sınırı) yapılır; (2) PDT ve DET''te hem vade hem
    dönüştürme/değiştirme için 365 gün şartı vardır; (3) "15 gün önce" KAP açıklaması takvim günüdür, "10 iş günü" ise talep
    toplama süresinin üst sınırıdır.

    '
