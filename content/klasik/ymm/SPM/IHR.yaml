  cozum: '**(a)** Yetkili organ kararında yalnızca "borçlanma aracı" ifadesine yer verilirse başvuru **yalnızca tahvil ve
    finansman bonosu** ihracı için yapılmış sayılır (VII-128.8 md. 5/5). Genel kurul ihraç yetkisini yönetim kuruluna **en
    çok on beş ay** için bırakabilir (md. 5/4): 20 Mart 2026 + 15 ay = **20 Haziran 2027**.


    **(b)** Yetkili organ kararının alındığı tarihten itibaren en geç **bir yıl** içinde Kurula başvuru zorunludur (md. 6/2):
    **20 Mart 2027**.


    **(c)** Her tertibin satışı için planlanan satış tarihinden **en az beş iş günü önce** onay başvurusu yapılır (md. 6/3).
    14 Temmuz''dan geriye beş iş günü: 13, 10, 9, 8, 7 Temmuz → en geç **7 Temmuz 2026**.


    **(d)** Başvuru, gerekli bilgi ve belgelerin sunulmasından itibaren **on iş günü** içinde karara bağlanır; ilk halka arzlarda
    bu süre yirmi iş günüdür (SPKn md. 6/2). Kuzey Enerji''nin ilk halka arzı olmadığından on iş günü uygulanır. Eksik bilgi/belge
    istenmişse süreler, **eksiklerin Kurula sunulduğu tarihten** itibaren işlemeye başlar (md. 6/3). Eksikler 12 Haziran''da
    tamamlandığına göre iş günleri: 15, 16, 17, 18, 19, 22, 23, 24, 25, 26 Haziran → **26 Haziran 2026**.


    **(e)** İzahnamedeki yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan **önce ihraççı** sorumludur. Zarar
    ihraççıdan tazmin edilemezse veya edilemeyeceği açıkça belliyse halka arz edenler, ihraca aracılık eden lider aracı kurum,
    varsa garantör ve yönetim kurulu üyeleri kusurlarına ve durumun gereklerine göre sorumludur. Bağımsız denetim kuruluşu
    gibi izahnamede yer almak üzere rapor hazırlayanlar da raporlarındaki yanlış, yanıltıcı ve eksik bilgilerden sorumludur
    (SPKn md. 10).

    '
