      \ * oran\nfikret = 1900000 * oran\nbitis = dt.date(2026, 9, 11)\nliste = isg(bitis, 2)\nonay = isg(liste, 2)\niade =\
      \ isg(onay, 1)\naciklama = isg(onay, 2)\nsonuc = {'tavan_fiyat': 30 * 1.2, 'azami_azaltma': 2400000 * 0.2, 'asgari_bireysel':\
