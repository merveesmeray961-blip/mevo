    puan: 5
  - olcut: '(b) Borsada işlem gören ihraççı için takip eden iş günü: 3 Haziran 2026'
    puan: 4
  - olcut: '(c) Satış öncesi revizede ikinci gün: 10 Haziran 2026'
    puan: 5
  - olcut: (d) Süre içinde revizede asgari iki iş günü ilavesi ve 16 Haziran 2026
    puan: 6
  - olcut: (e) Talep değiştirme/geri alma hakkı
    puan: 4
  kaynaklar:
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 10/1
    alinti: (1) Sermaye piyasası araçlarının halka arzına en erken, izahnamenin ve fiyat tespit raporunun yayımlanmasını takip
      eden üçüncü gün başlanabilir. İzahname ve fiyat tespit raporunun farklı günlerde ilan edilmesi durumunda bu süre daha
      geç yayımlanan belgenin ilan tarihi itibarıyla başlar.
