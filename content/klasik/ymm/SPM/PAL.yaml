  soru: 'Payları borsada işlem gören **Tuna Gıda A.Ş.** (Tuna) paylarının MKK nezdindeki kayıtları **Pınar Menkul Değerler
    A.Ş.** (Pınar) üyesi nezdinde izlenmektedir. Bay (E)''nin Pınar''daki hesabında Tuna''nın hamiline yazılı payları bulunmaktadır.
    Bay (E) 2026 yılında iki teminat sözleşmesi yapmıştır:


    **Sözleşme 1:** 3 Şubat 2026 tarihli, yazılı kredi teminat sözleşmesi. Teminat alan **Kızılırmak Bankası A.Ş.**, teminat
