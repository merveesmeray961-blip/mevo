    | Pusula | 06.01.2026 | 06.04.2026 | 02.04.2026 | Süresinde |


    **(d) Birlik kararlarına itiraz (md. 75/7)**


    Birliğin yetkili organlarınca alınan kararlara karşı, kararın ilgiliye **tebliğini izleyen on iş günü içinde Kurul nezdinde**
