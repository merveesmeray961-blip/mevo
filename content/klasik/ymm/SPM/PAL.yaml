  - olcut: (c) Listenin 26 Mayıs 2026'ya kadar hâkime tevdi edilmesi
    puan: 2
  - olcut: (c) İtirazın iki iş günü, aynı gün inceleme ve kesin karar; Kurulun itiraz hakkı
    puan: 2
  - olcut: (c) Aidatın icra yoluyla tahsili
    puan: 2
  - olcut: (d) İşlem durdurmanın derhâl Kurula bildirilmesi ve kamuya açıklanması; Kurulun yetkisi saklı
    puan: 2
  - olcut: (d) Gözcü'nün birden fazla borsaya hizmet verebileceği ve Borsanın sorumluluğunun sürdüğü
    puan: 3
