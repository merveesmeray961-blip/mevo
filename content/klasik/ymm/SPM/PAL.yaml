    ne: harici teslim t_S4.yaml, klasik 3
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-SPM-PAL-K002
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - borsalar ve piyasa işleticileri
  - takas ve merkezi karşı taraf
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**I. Borsa kuruluşu.** **Anadolu Emtia Borsası A.Ş.**'nin kuruluşuna Kurulun uygun görüşü üzerine 1 Şubat 2025'te\n\
    izin verilmiştir. Şirket faaliyet izni için 15 Mart 2026'da Kurula başvurmuştur; bu süre içinde zorunlu bir hâl\nnedeniyle\
    \ süre uzatımı talep edilmemiştir. Ayrıca:\n\n- Şirket esas sözleşmesine göre payların %10'u hamiline yazılı olarak çıkarılmıştır.\n\
    - Şirket, bir piyasayı işletmesi için (P) Piyasa İşleticisi A.Ş. ile Kurul onayı almadan sözleşme imzalamıştır.\n- Bir\
    \ ortak %15'lik payını Kurul izni olmadan devretmiş, devralan pay defterine kaydedilmeyi istemektedir.\n\n**II. Takas.**\
    \ Merkezî takas kuruluşu olarak faaliyet gösteren ve ilgili pazarda merkezî karşı taraf hizmeti veren\n**Takas Kuruluşu**'nun\
    \ üyesi **(Y) Yatırım Menkul Değerler A.Ş.** hakkında, 10 Haziran 2026 günü öğleden sonra\ntasfiye işlemlerine başlanmıştır.\
    \ Aynı gün sabah (Y)'nin verdiği takas talimatları sisteme girilmiştir. Gelişmeler:\n\n- (Y)'nin tasfiye memurları sabah\
    \ verilen takas talimatlarının iptalini ve Takas Kuruluşu nezdindeki teminatlarının\n  iadesini istemektedir.\n- Bir üçüncü\
    \ kişi, (Y)'nin teminat olarak yatırdığı payların kendisine ait olduğunu ileri sürerek Takas Kuruluşuna\n  karşı istihkak\
    \ iddiasında bulunmuştur.\n- (Y)'nin müşterisi Bay (K), (Y)'den alamadığı 400.000 TL'lik alacağını Takas Kuruluşundan\
    \ talep etmektedir.\n- Bir vergi dairesi, (Y)'nin vergi borcu nedeniyle garanti fonundaki tutarlara haciz uygulamak istemektedir.\n\
    \n**İstenenler:**\n\n(a) Borsaların kuruluş şartlarını ve iki aşamalı izin sürecini açıklayınız; I. bölümdeki tespitleri\n\
    değerlendiriniz. (11 puan)\n\n(b) Merkezî takas kuruluşu ve merkezî karşı taraf kavramlarını açıklayınız. (4 puan)\n\n\
    (c) II. bölümdeki taleplerin her birini takas kesinliği ve ilgili hükümler çerçevesinde değerlendiriniz. (8 puan)\n\n\
    (d) Borsalar aleyhine açılacak davaların hangi yargı yerinde görüleceğini belirtiniz. (2 puan)\n"
  cozum: '**(a) Borsa kuruluşu**


    Borsaların kuruluş şartları (SPKn md. 65/2): **anonim şirket** olarak kurulmak; payların tamamının **nama yazılı ve

    nakit karşılığı** çıkarılması; sermayenin Kurulca belirlenen tutardan az olmaması; kurucuların ve önemli etkiye sahip

    ortakların md. 44 şartlarını taşıması; esas sözleşmenin mevzuata uygunluğu.


    İzin iki aşamalıdır: **kuruluş izni** Kurulun uygun görüşü üzerine **Cumhurbaşkanınca**, **faaliyet izni** Kurulca

    verilir. Kuruluş izninden itibaren **en geç bir yıl** içinde faaliyet izni için başvurulması şarttır; Kurul eksiksiz

    başvuruyu altı ay içinde karara bağlar. Süresinde başvurulmazsa kuruluş izni **iptal olur**; zorunlu hâllerde Kurul

    süreyi bir yıl uzatabilir (md. 65/4).


    | Tespit | Değerlendirme |

    |---|---|

    | Faaliyet izni başvurusu 15 Mart 2026 | Bir yıllık süre 1 Şubat 2026''da dolmuştur; uzatma yoktur → kuruluş izni **iptal
    olmuştur**, faaliyet izni verilemez |

    | %10 hamiline pay | Payların tamamının nama yazılı olması şartına **aykırı** |

    | Kurul onaysız piyasa işleticisi sözleşmesi | Borsa piyasa işleticisiyle ancak Kurul onayıyla anlaşabilir; onaysız anlaşma
    **hüküm doğurmaz** (md. 65/5) |

    | İzinsiz %15 pay devri | Pay devirleri ve kontrol devri sonucunu doğuran işlemler Kurul iznine tabidir; izinsiz devir
    **pay defterine yazılmaz** (md. 65/7) |


    **(b) Kavramlar**


    **Merkezî takas kuruluşu**, borsalarda ve teşkilatlanmış pazar yerlerinde işlem gören araçların teslim, bedel ödeme

    ve teminat işlemlerini yürüten anonim ortaklıktır (md. 77/1). **Merkezî karşı taraf**, takas kuruluşunun alıcıya karşı

    satıcı, satıcıya karşı alıcı rolünü üstlenerek takasın tamamlanmasını taahhüt etmesidir; Kurul bunu piyasa veya araç

    bazında zorunlu tutabilir (md. 78/1). MKT''nin mali sorumluluğu limitler, üye teminatları ve diğer garantilerle

    sınırlıdır.


    **(c) Taleplerin değerlendirilmesi**


    | Talep | Değerlendirme |

    |---|---|

    | Sabah verilen takas talimatlarının iptali | Takas talimatları ve ödeme işlemleri, üyenin tasfiye işlemlerine başlanması
    dahil **geri alınamaz ve iptal edilemez** (takas kesinliği, md. 79/1) → **reddedilir** |

    | Teminatların iadesi | Takas kuruluşunun teminatlar üzerindeki hakları konkordato, iflas veya tasfiyeyle **sınırlandırılamaz**;
    MKT kapsamında alınan teminatların mülkiyeti takas kuruluşuna geçer → **reddedilir** |

    | Üçüncü kişinin istihkak iddiası | Üçüncü kişilerin istihkak iddiası takas kuruluşuna karşı **ileri sürülemez** (md.
    79) |

    | Bay (K)''nın talebi | Takas kuruluşu, üyelerin **kendi müşterilerine karşı** yükümlülüklerinden sorumlu değildir (md.
    78) → talep (Y)''ye yöneltilmeli; koşulları varsa Yatırımcı Tazmin Merkezine başvurulabilir |

    | Garanti fonuna haciz | Takas riskine karşı tutulan teminatlar ve garanti fonu amaç dışında kullanılamaz, **kamu alacağı
    için dahi haczedilemez**, iflas masasına girmez (md. 73/2) → **reddedilir** |


    **(d) Yargı yeri**


    Borsalar özel hukuk hükümlerine tabidir; aleyhlerine açılan davalar **adli yargıda** görülür (md. 65/10–11).

    '
