    puan: 3
  - olcut: (c) İstihkak iddiasının ileri sürülememesi ve müşteri alacağından takas kuruluşunun sorumlu olmaması
    puan: 3
  - olcut: (c) Garanti fonunun haczedilemezliği
    puan: 2
  - olcut: (d) Adli yargı
    puan: 2
