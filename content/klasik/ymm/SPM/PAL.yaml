  sure_dk: 35
  soru: 'Hakkında yatırımcıları tazmin kararı alınan **Ceylan Menkul Değerler A.Ş.** (Ceylan) için YTM, hak sahiplerini ve
    tazmin tutarlarını belirleme çalışmasını sürdürmektedir. Ceylan''ın yönetim kurulu üyesi Bay (H)''dir. Yeniden değerleme
    katsayısıyla yapılan artış dikkate alınmayacak, Kanunda yazılı **temel azami tutar** esas alınacaktır. Ceylan''ın yerine
    getirmediği yükümlülükler bakımından yatırımcılara ilişkin bilgiler şöyledir:


    | Yatırımcı | Ceylan tarafından karşılanmayan alacak ve ilgili bilgiler |

    |---|---|

    | A | Nakit hesabında 120.000 TL ve ayrı bir hesapta iade edilemeyen 150.000 TL değerinde sermaye piyasası aracı teslim
    yükümlülüğü |

    | B | Nakit hesabında 60.000 TL; ayrıca Ceylan''ın verdiği yatırım danışmanlığı nedeniyle uğradığını ileri sürdüğü 80.000
    TL''lik zarar talebi |

    | C | Toplam 130.000 TL talep. C, 107/1 kapsamındaki işlem bazlı piyasa dolandırıcılığından mahkûm olmuştur; talebin 90.000
    TL''si mahkûmiyete konu işlemlerle ilgili alacaktır, 40.000 TL''si ilgisiz bir nakit alacaktır |

    | D | Bay (H)''nin eşidir; nakit hesabında 70.000 TL |

    | E | Ceylan''ın %4 paya sahip ortağıdır, yönetici veya denetçi değildir ve Ceylan''ın mali sıkıntısında sorumluluğu yoktur;
    nakit hesabında 30.000 TL |

    | F | Nakit hesabında 55.000 TL; hakkında 107/1 kapsamındaki işlemleri nedeniyle suç duyurusunda bulunulmuş, soruşturma
    18 Şubat 2026''da başlamış, dava sürmektedir |

    | G | Toplam 260.000 TL nakit alacağı; 100.000 TL''yi aşan 160.000 TL''lik kısmı, başka bir yatırımcı olan M''ye ödenmesi
    amacıyla devredilmiştir |


    Yatırımcı B''nin Ceylan nezdindeki ayrı hesabında saklanan 1.000 adet pay da vardır; Ceylan''ın bu hesaba ilişkin yerine
    getirmediği 5.000 TL''lik bir takas yükümlülüğü bulunmaktadır (bu pay yukarıdaki tutarlara dâhil değildir).


    **İstenenler:**


    (a) Yukarıdaki tabloya göre her yatırımcıya şimdi ödenecek tazmin tutarını gerekçesiyle belirleyiniz (ödemesi durdurulan
    yatırımcı varsa ayrıca belirtiniz) ve toplamı bulunuz. (11 puan)


    (b) YTM''nin (a) şıkkındaki ödemeler karşısındaki konumunu ve Ceylan''ın yeniden yatırım hizmetlerinde bulunabilmesi için
    yerine getirmesi gereken yükümlülüğü açıklayınız. (5 puan)


    (c) B''nin hesabında saklanan paylara ilişkin işlemi açıklayınız. (3 puan)


    (d) YTM''nin gerekli görmesi hâlinde Ceylan''ın ödemeleri ve mal varlığı bakımından neye karar verilebileceğini; tazmin
    süreci tamamlandığında YTM''nin Kurula neyi sunacağını ve tedricî tasfiye ya da iflas kararının tazmin sürecine etkisini
    açıklayınız. (5 puan)

    '
  cozum: '**(a) Tazmin tutarları**


    Esaslar: Hak sahibi her bir yatırımcıya ödenecek azami tazmin tutarı **yüz bin TL**''dir; sınır, hesap sayısı, türü ve
    para birimine bakılmaksızın bir yatırımcının aynı kuruluştan olan taleplerinin **tümünü** kapsar (md. 84/5). Yatırım danışmanlığı
    veya piyasadaki fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir (md. 84/2).


    | Yatırımcı | Değerlendirme | Ödenecek (TL) |

    |---|---|---|

    | A | 120.000 + 150.000 = 270.000 TL; tüm hesaplar tek sınıra tabidir → sınır | 100.000 |

    | B | Nakit 60.000 tazmine konu; danışmanlık zararı (80.000) kapsam dışı | 60.000 |

    | C | 106/107 suçlarından mahkûmiyet nedeniyle yalnızca suçla ilgili alacak (90.000) kapsam dışı; ilgisiz 40.000 TL ödenir
    (md. 84/3) | 40.000 |

    | D | Yönetim kurulu üyesinin eşi tazmin edilmez (md. 84/4-a) | 0 |

    | E | Dışlama ölçütü %5 veya daha fazla paydır; %4 ortak, başka dışlama nedeni de yoktur → tazmin edilir (md. 84/4-a)
    | 30.000 |

    | F | Suç duyurusunda bulunulan kişiye ödeme, soruşturmanın başlamasından mahkeme kararının kesinleşmesine kadar **durur**
    (md. 84/3); talep 55.000 TL, ödeme askıda | 0 (askıda: 55.000) |

    | G | 260.000 TL > sınır; sınırı aşan 160.000 TL''nin devri nedeniyle devralan M''ye YTM ödeme yapmaz (md. 84/5) → G''ye
    sınır tutarı | 100.000 (M: 0) |


    Toplam şimdi ödenecek: 100.000 + 60.000 + 40.000 + 0 + 30.000 + 0 + 100.000 = **330.000 TL**; askıdaki tutar 55.000 TL.


    **(b)** YTM, yatırımcıların haklarına **ödediği tazmin tutarı kadar halef olur** (md. 85/4) → 330.000 TL tutarında. Tazmin
    edilenlerin (Ceylan''ın) yeniden yatırım hizmetleri ve faaliyetlerinde bulunabilmeleri için, mevzuatta aranan diğer şartlar
    saklı kalmak üzere, tazminden doğan ve YTM tarafından yapılan **tüm ödeme ve giderleri, anapara ve kanuni faiz dâhil olmak
    üzere ödemeleri zorunludur** (md. 85/5).


    **(c)** Tazmin talepleri yatırım kuruluşunca karşılanmayan nakit ve sermaye piyasası araçları iade yükümlülükleri üzerinden
    hesaplanır; yatırımcılar adına saklanan sermaye piyasası araçları hak sahiplerine **öncelikle dağıtılır**; bu araçlar
    bulundukları her bir hesap bazında ve özellikle yerine getirilmemiş takas yükümlülükleri için **mahsup edilir** (md. 85/3).
    B''nin 1.000 payı öncelikle B''ye dağıtılır; ilgili hesaptaki 5.000 TL''lik takas yükümlülüğü için hesap bazında mahsup
    yapılır.


    **(d)** YTM gerekli görürse Ceylan''ın **ödemelerinin durmasına** ve tüm mal varlığı üzerinde **sadece YTM tarafından
    tasarruf edilebilmesine** karar verilebilir (md. 83/3). Tazmin süreci tamamlandığında YTM, sonuçları, tedricî tasfiye
    veya iflasın istenmesinin yararlı olup olmayacağına ilişkin **gerekçeli önerisiyle** Kurula sunar; Kurul YTM''nin bildirimi
    üzerine tazmin sürecini kapatma kararı verir. **Tedricî tasfiye veya iflas kararı tazmin sürecinin işleyişini engellemez**
    (md. 85/4).

    '
