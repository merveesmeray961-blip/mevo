- id: YMM-SPM-PAL-K012
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - Türkiye Sermaye Piyasaları Birliği üyeliği ve organları
  - Türkiye Değerleme Uzmanları Birliği üyeliği
  - borsa gözetimi ve işlem durdurma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Sermaye piyasası kurumlarına ve borsalara ilişkin 2026 yılında şu gelişmeler yaşanmıştır:


    1. **Mavi Kitle Fonlama Platformu A.Ş.** Kurulca yetki belgesini 15 Ocak 2026''da, **Derin Kripto Varlık Hizmet Sağlayıcı
    A.Ş.** ise yetki belgesini 20 Şubat 2026''da almıştır. Her iki kuruluş da Türkiye Sermaye Piyasaları Birliğine (Birlik)
    üyelik başvurusu yapmamıştır.


    2. Gayrimenkul değerleme uzmanlığı lisansına **3 Mart 2026**''da hak kazanan **Bay (K)** ile aynı tarihte değerleme kuruluşu
    niteliğini kazanan **Ufuk Değerleme A.Ş.**, Türkiye Değerleme Uzmanları Birliğine başvuru yapmamıştır.


    3. Birliğin organlarının seçimi için genel kurul toplantısı **10 Haziran 2026** tarihine kararlaştırılmıştır. Seçimin
    ardından bir üye sonuçlara itiraz etmek istemektedir. Ayrıca bir Birlik üyesi, 2025 yılı aidatını Statüde belirlenen süre
    içinde ödememiştir.


    4. **Ege Menkul Kıymetler Borsası A.Ş.**, kotundaki bir payın işlem görmesini kendi düzenlemelerindeki şartların oluşması
    üzerine durdurmuş; ayrıca gözetim görevlerini **Gözcü Piyasa Gözetim A.Ş.**''den hizmet alarak yürütmektedir. Gözcü hâlen
    başka bir borsaya da hizmet vermektedir; Borsa, hizmet aldığı için gözetimle ilgili sorumluluğunun kalmadığını ileri sürmektedir.


    **İstenenler:**


    (a) 1 numaralı olayda iki kuruluşun Birliğe başvuru için son günlerini hesaplayınız ve başvurmamanın sonucunu belirtiniz.
    (7 puan)


    (b) 2 numaralı olayda (K) ve Ufuk Değerleme A.Ş. bakımından başvuru süresini, son günü ve başvurmamanın sonuçlarını ayrı
    ayrı açıklayınız. (7 puan)


    (c) 3 numaralı olayda genel kurul için seçmen listesinin en geç hangi tarihte ve kime tevdi edileceğini, itirazın nasıl
    sonuçlanacağını, Kurulun itiraz yetkisini ve aidatın tahsil yolunu açıklayınız. (6 puan)


    (d) 4 numaralı olayı değerlendiriniz: payın işlem durdurulmasında izlenecek yol, Gözcü ile ilgili iddia ve Kurulun yetkisi.
    (5 puan)'
  cozum: '**(a) Birlik üyeliği (md. 74/1)**


    - Yatırım hizmet ve faaliyetlerine yetkili kuruluşlar, Kurulca uygun görülen kurumlar ile **kitle fonlama platformları
    ve kripto varlık hizmet sağlayıcıları** Birliğe üye olmak için yetki belgelerini almalarından itibaren **üç ay içinde**
    başvurmak zorundadır.


    | Kuruluş | Yetki belgesi | Son başvuru günü |

    |---|---|---|

    | Mavi Kitle Fonlama Platformu | 15 Ocak 2026 | 15 Nisan 2026 |

    | Derin Kripto Varlık Hizmet Sağlayıcı | 20 Şubat 2026 | 20 Mayıs 2026 |


    - Yükümlülüğe uymayan kuruluşların **faaliyetleri Kurulca durdurulur**.


    **(b) Türkiye Değerleme Uzmanları Birliği (md. 76/2-3)**


    - Her ikisi için süre üç aydır: lisans sahibi için lisansa hak kazandığı, değerleme kuruluşu için değerleme kuruluşu niteliğini
    kazandığı tarihten itibaren. Son gün: 3 Mart 2026 + 3 ay = **3 Haziran 2026**.

    - (K) başvurmazsa **lisansı Kurulca iptal edilir** (md. 76/2).

    - Ufuk Değerleme başvurmazsa Kurul, faaliyetlerinin durdurulması ve yetkilerinin iptali dahil **her türlü tedbiri almaya
    yetkilidir** (md. 76/3). İki kuruluş için yaptırımlar farklıdır: lisans sahibi için iptal, kuruluş için durdurma ve yetki
    iptali dahil her türlü tedbir.


    **(c) Birlik seçimleri (md. 75)**


    - Seçmen listesi, toplantının gündemi vb. bilgilerle birlikte genel kurul toplantısından **en az on beş gün önce**, Yüksek
    Seçim Kurulunca belirlenecek seçim kurulu başkanı **hâkime** tevdi edilir: 10 Haziran 2026 - 15 gün = **26 Mayıs 2026**
    (en geç).

    - Tutanağın düzenlenmesinden itibaren **iki iş günü içinde** yapılacak her türlü itiraz hâkim tarafından **aynı gün incelenir
    ve kesin olarak karara bağlanır**. Kurul da itiraz hakkına sahiptir; Kurulun itirazı da aynı şekilde incelenir.

    - Birlik üyelik aidatları Statüde belirlenen süre içinde ödenmezse **Birlik tarafından icra yoluyla tahsil olunur**; aidat
    kararları İİK md. 68''de yazılı resmî belge niteliğindedir (md. 75/5).


    **(d) Borsa (md. 69/1, 70)**


    - Borsa, kendi düzenlemelerinde öngörülen şartların oluşması hâlinde işlem görmeyi durdurabilir veya kottan çıkarabilir;
    bu durum **derhâl Kurula bildirilir ve kamuya açıklanır**. Kurulun durdurma ve kottan çıkarma yetkisi saklıdır (md. 69/2).

    - Borsa, gözetim görevlerini dışarıdan hizmet alarak yerine getirebilir; hizmet veren kurum tek bir borsaya hizmet verebileceği
    gibi **birden fazla borsaya da** verebilir. Dolayısıyla Gözcü''nün başka bir borsaya hizmet vermesi aykırılık değildir.
    Ancak hizmet alınması **Borsanın görevleriyle ilgili sorumluluğunu ortadan kaldırmaz**; Borsanın iddiası yerinde değildir
    (md. 70/3).'
