- id: YMM-SPM-PAL-K001
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - yatırımcı tazmin merkezi
  - tedrici tasfiye
  - takas ve merkezi karşı taraf
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(M) Yatırım Menkul Değerler A.Ş.''nin müşterilerine olan nakit ödeme ve pay teslim yükümlülüklerini yerine getiremediği
    10 Ocak 2026''da Kurulca tespit edilmiş; Kurul 2 Mart 2026''da yatırımcıları tazmin kararı almış ve karar 5 Mart 2026''da
    ilan edilmiştir. (M) A.Ş. bir banka değildir.


    **Tazmin talepleri:**


    | Talep sahibi | Durum |

    |---|---|

    | Bay (A) | Adına saklanan 400.000 TL değerindeki paylar iade edilmemiştir; ayrıca 250.000 TL nakit alacağı ödenmemiştir.
    |

    | Bayan (B) | (M)''nin %8 paylı ortağıdır; 300.000 TL nakit alacağı vardır. |

    | Bay (C) | Portföyündeki payların borsada fiyat düşüşü nedeniyle 150.000 TL zarar ettiğini ileri sürmektedir. |

    | Bayan (D) | Tazmin talebini YTM''ye 20 Mart 2027''de yazılı olarak yapmıştır. |


    **Takas teminatları:** (M)''nin merkezî takas kuruluşunda bulunan teminatları için bir vergi dairesi kamu alacağı nedeniyle
    haciz istemiş, (M) de bu teminatların tedricî tasfiye masasına alınmasını talep etmiştir.


    **Tedricî tasfiye:** Kurul, tazmin sürecini kapatma kararıyla birlikte tedricî tasfiye kararı vermiştir. Nakde çevrilen
    aktifler 6.000.000 TL''dir. Tazmin edilmeyen müşteri alacakları 4.000.000 TL, kamu alacakları 1.500.000 TL, YTM''nin halefiyetten
    doğan alacağı ve tasfiye giderleri 900.000 TL, diğer alacaklılar 800.000 TL''dir.


    **İstenenler:**


    (a) Tazmin kararının süresinde alınıp alınmadığını belirtiniz ve (A), (B), (C) ve (D)''nin tazmin talepleri hakkında gerekçeli
    değerlendirme yapınız. (10 puan)


    (b) Vergi dairesinin haciz talebini ve (M)''nin teminatlara ilişkin talebini değerlendiriniz. (5 puan)


    (c) Tedricî tasfiyede aktiflerin alacaklılara dağıtımını sırasıyla gösteriniz. (10 puan)

    '
  cozum: '**(a) Tazmin kararı ve talepler**

    - Tazmin kararı durumun tespitinden itibaren üç ay içinde alınır (SPKn md. 82/1). Tespit 10 Ocak 2026, karar 2 Mart 2026''dır;
    karar **süresinde** alınmıştır.

    - **Bay (A):** Adına saklanan payların ve nakdin teslim edilmemesinden doğan talep tazmin kapsamındadır (md. 84/1). Saklanan
    paylar öncelikle aynen dağıtılır (md. 85/3); nakit alacak azami tazmin tutarı içinde tazmin edilir. Azami sınır, hesap
    ve para birimine bakılmaksızın Bay (A)''nın (M)''den olan bütün taleplerini kapsar (md. 84/5).

    - **Bayan (B):** %5 veya daha fazla paya sahip ortaklar tazmin edilmez (md. 84/4-a); %8 paylı olduğundan **tazmin edilmez**.

    - **Bay (C):** Piyasadaki fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir (md. 84/2); **tazmin edilmez**.

    - **Bayan (D):** Talep hakkı, ilandan (5 Mart 2026) itibaren bir yıl sonra, yani 5 Mart 2027''de zamanaşımına uğrar (md.
    85/1). 20 Mart 2027''deki talep **zamanaşımına uğramıştır**.


    **(b) Takas teminatları**

    - Takas risklerine karşı tutulan teminatlar ve garanti fonu varlıkları amaçları dışında kullanılamaz, **kamu alacakları
    için dahi haczedilemez**, iflas masasına dahil edilemez (md. 73/2). Vergi dairesinin haciz talebi yerinde değildir.

    - Merkezî takas kuruluşunun teminatlar üzerindeki hak ve yetkileri tedricî tasfiye hükümleriyle de sınırlandırılamaz (md.
    79/3). (M)''nin teminatların tasfiye masasına alınması talebi kabul edilemez.


    **(c) Tedricî tasfiyede dağıtım (md. 86/5)**


    | Sıra | Alacak | Tutar | Ödenen | Kalan aktif |

    |---|---|---|---|---|

    | 1 | Müşteri alacakları | 4.000.000 | 4.000.000 | 2.000.000 |

    | 2 | Kamu alacakları (garameten) | 1.500.000 | 1.500.000 | 500.000 |

    | 3 | YTM (md. 85 ödemeleri ve tasfiye giderleri) | 900.000 | **500.000** | 0 |

    | 4 | Diğer alacaklılar | 800.000 | 0 | 0 |


    YTM alacağının 400.000 TL''si karşılanamaz; diğer alacaklılara ödeme yapılamaz. Aktiflerin YTM ve diğer alacakları karşılamaya
    yetmediği tespit edildiğinden YTM, Kurulun uygun görüşüyle iflas da isteyebilir (md. 86/8).

    '
  puanlama:
  - olcut: Tazmin kararının üç aylık süre içinde alındığının tespiti
    puan: 2
  - olcut: 'Bay (A): kapsamda olduğu, payların aynen iadesi ve azami sınırın yatırımcı bazında uygulanması'
    puan: 3
  - olcut: 'Bayan (B): %5 eşiği nedeniyle tazmin dışı'
    puan: 2
  - olcut: 'Bay (C): fiyat hareketi zararı kapsam dışı'
    puan: 1
  - olcut: 'Bayan (D): 5 Mart 2027''de zamanaşımı'
    puan: 2
  - olcut: Takas teminatlarının kamu alacağı için haczedilemeyeceği (md. 73/2)
    puan: 3
  - olcut: Takas kuruluşunun haklarının tedricî tasfiyeyle sınırlandırılamayacağı (md. 79/3)
    puan: 2
  - olcut: Müşteri ve kamu alacaklarının sırasıyla tam ödenmesi
    puan: 4
  - olcut: YTM'ye 500.000 TL ödenmesi, diğer alacaklılara bir şey kalmaması
    puan: 4
  - olcut: Karşılanmayan YTM alacağı (400.000 TL) ve iflas isteme imkânı
    puan: 2
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 73, 79, 82, 84, 85, 86
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
