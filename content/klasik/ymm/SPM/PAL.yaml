  soru: '**Mirage Menkul Değerler A.Ş.** (Mirage) 30 Eylül 2026 tarihinde müşteri hesaplarını gözden geçirmektedir. Beş hesap
    sahibine ilişkin, **hesap sahibinin yaptığı** son talep, işlem veya verdiği yazılı talimat tarihleri şöyledir:


