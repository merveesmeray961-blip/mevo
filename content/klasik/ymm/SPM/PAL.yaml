- id: YMM-SPM-PAL-K003
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - kaydileştirme ve saklama
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**(R) Yatırım Menkul Değerler A.Ş.** (R) hakkında Kurul denetiminde ve sonrasında şu durumlar ortaya çıkmıştır:\n\
    \n1. (R), müşterisi Bayan (A)'ya ait ve MKK'da (R) nezdindeki hesapta izlenen payları, Bayan (A)'nın yazılı izni\n   olmaksızın\
    \ kendi banka kredisinin teminatı olarak bankaya rehin vermiştir.\n2. Müşterilerin yatırım amacıyla (R)'ye yatırdığı nakitler\
    \ (R)'nin kendi işletme hesabında tutulmaktadır.\n3. (R)'nin bir ticari alacaklısı, (R)'nin borcu nedeniyle müşterilere\
    \ ait pay ve nakitlere haciz uygulanmasını\n   istemektedir.\n4. Bay (B), payları üzerinde 5 Mayıs 2026'da (C)'ye rehin\
    \ hakkı tanımış, ancak rehin MKK'ya 20 Mayıs'ta bildirilmiştir.\n   Aynı paylar üzerinde 12 Mayıs'ta (D) lehine tesis\
    \ edilen ikinci bir hak aynı gün MKK'ya bildirilmiştir.\n5. Bay (E), şirketin kaydileştirilmesine karar verilen basılı\
    \ pay senetlerini MKK'ya teslim etmemiş ve bunları\n   borsada satmak istemektedir.\n6. (R)'nin personeli MKK sisteminde\
    \ Bay (F)'nin hesabına ilişkin kaydı hatalı tutmuş ve Bay (F) 300.000 TL zarara\n   uğramıştır. Mahkeme, zararın doğmasında\
    \ MKK'nın %30, (R)'nin %70 oranında kusurlu olduğunu tespit etmiştir.\n\n**İstenenler:**\n\n(a) Kaydileştirme kavramını\
    \ ve kayden izlenen araçlara ilişkin temel ilkeleri açıklayınız. (6 puan)\n\n(b) 1, 2 ve 3 numaralı durumları yatırımcı\
    \ varlıklarının ayrılığı ilkesi çerçevesinde değerlendiriniz. (8 puan)\n\n(c) 4 ve 5 numaralı durumları değerlendiriniz;\
    \ hakların üçüncü kişilere karşı ileri sürülebilmesinde esas alınacak\ntarihi belirtiniz. (6 puan)\n\n(d) 6 numaralı durumda\
    \ sorumluluğu açıklayarak tarafların ödeyeceği tazminatı hesaplayınız. (5 puan)\n"
  cozum: '**(a) Kaydileştirme**


    **Kaydileştirme**, sermaye piyasası araçlarının senede bağlanmaksızın elektronik ortamda kayden ihracı ve

    izlenmesidir; kayden ihraç esastır (SPKn md. 13/1). Kaydi araçlar, nama veya hamiline olmalarına bakılmaksızın

    isme açılmış hesaplarda izlenir; haklar **MKK** tarafından izlenir ve kayıtlar MKK sisteminde üyelerce tutulur.

    Tedbir ve haciz talepleri yalnız MKK üyeleri tarafından yerine getirilir. **MKK**, kaydileştirme işlemlerini yapan,

    kaydi araçları ve hakları elektronik ortamda izleyen ve merkezî saklamalarını yapan anonim şirkettir (md. 81);

    kaydileştirilen araçların merkezî saklama kuruluşu MKK''dır (md. 80/3).


    **(b) Yatırımcı varlıklarının ayrılığı (md. 46)**


    Yatırımcıların yatırım kuruluşu nezdindeki nakit ve sermaye piyasası araçları kuruluşun mal varlığından **ayrı

    izlenir**; kuruluşun borcu için **haczedilemez**, yatırımcının **yazılı izni olmadan rehnedilemez** ve iflas masasına

    girmez.


    | No | Değerlendirme |

    |---|---|

    | 1 | Bayan (A)''nın yazılı izni olmadan payların (R)''nin kendi borcu için rehnedilmesi **yasaktır**; ayrıca SPKn md.
    110/1-a kapsamında güveni kötüye kullanma suçunu oluşturabilir |

    | 2 | Müşteri nakitleri kuruluşun kendi hesaplarından **ayrı** izlenmelidir; işletme hesabında tutulması **aykırıdır**
    |

    | 3 | Müşteri varlıkları (R)''nin borcu için **haczedilemez**; talep yerine getirilemez |


    **(c) Bildirim tarihi ve kaydileştirme**


    Kayden izlenen araçlar üzerindeki hakların üçüncü kişilere karşı ileri sürülebilmesinde **MKK''ya yapılan bildirim

    tarihi** esas alınır (md. 13/5). (D) lehine tesis edilen hak 12 Mayıs''ta, (C)''nin rehni 20 Mayıs''ta bildirildiğinden

    üçüncü kişilere karşı **(D)''nin hakkı önceliklidir**; (C)''nin rehninin 5 Mayıs''ta tesis edilmiş olması sonucu

    değiştirmez.


    Kaydileştirilmesine karar verilen senetler MKK''ya teslim edildiğinde hükümsüz olur; **teslim edilmeyen senetler

    borsada işlem göremez** (md. 13). Bay (E) basılı senetleri borsada satamaz; önce kaydileştirme için teslim etmesi

    gerekir.


    **(d) Sorumluluk ve tazminat**


    MKK ve üyeleri, kayıtların yanlış tutulmasından doğan zararlardan **kusurları oranında** sorumludur (md. 81).


    - MKK: 300.000 × %30 = **90.000 TL**

    - (R): 300.000 × %70 = **210.000 TL**

