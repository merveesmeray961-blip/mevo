    | Kalem | Tutar |

    |---|---|

    | Brüt satış hasılatı | 600.000.000 TL |

    | Vergi öncesi kâr | 50.000.000 TL |


    Aykırılık nedeniyle şirketin yönetim kurulu başkanı **H** de Kurul düzenlemelerine aykırı davranmıştır. Bu aykırılık Bora
    Çimento''nun zararına bir sonuç doğurmamış, aksine şirkete menfaat sağlamıştır. Ayrıca Bora Çimento, ceza kararı verilinceye
    kadar aynı yükümlülüğe iki kez aykırı davranmış; bu yolla toplam **90.000 TL** menfaat sağlanmıştır. Bu iki kabahat için
    ilgili hükme göre bir idari para cezası belirlenmiş ve bu ceza **100.000 TL** olarak takdir edilmiştir.


