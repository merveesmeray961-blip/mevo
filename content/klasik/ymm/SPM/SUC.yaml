  soru: 'Kurul''un piyasa gözetim birimi, payları borsada işlem gören **Rho Gıda A.Ş.** (Rho) ve **Sigma Lojistik A.Ş.** (Sigma)
    paylarındaki işlemleri incelemiş ve aşağıdaki tespitleri yapmıştır:


    1. Rho''nun finans direktörü **(F)**, Rho''nun büyük bir kamu ihalesini kazandığını 10 Mart 2026''da öğrenmiştir. Bilgi
    17 Mart 2026''da kamuya açıklanmıştır. F, 12 Mart''ta 50.000 adet Rho payını 40 TL''den almış, açıklamadan sonra 20 Mart''ta
    52 TL''den satmıştır.

    2. **(H)**, kendi kontrolündeki iki ayrı hesap arasında Sigma paylarında karşılıklı alım satım yaparak, payın fiyatı ve
    işlem hacmi hakkında yanıltıcı izlenim uyandırmış ve bu yolla **400.000 TL** menfaat sağlamıştır. H, kovuşturma evresinde,
    hüküm verilmeden önce etkin pişmanlıktan yararlanmak istemektedir.

    3. **(J)**, sosyal medya hesabından Sigma''nın yurt dışında büyük bir şirket tarafından satın alınacağına ilişkin gerçeğe
    aykırı bir haber yaymış, fiyat yükselince elindeki Sigma paylarını satarak **150.000 TL** menfaat sağlamıştır. J da Hazineye
    ödeme yaparak cezadan kurtulmayı düşünmektedir.

    4. H ve J''nin emirlerine aracılık eden yatırım kuruluşu, işlemlerin piyasa dolandırıcılığı oluşturabileceğinden işlemler
    sırasında şüphelenmiştir.


    Komisyon, vergi ve benzeri maliyetler göz ardı edilecektir.


    **İstenenler** (6362 sayılı Sermaye Piyasası Kanunu''na göre):


    (a) F''nin fiilini nitelendiriniz; elde edilen menfaati hesaplayarak öngörülen cezayı ve adli para cezası hükmedilirse
    alt sınırını belirtiniz. (6 puan)


    (b) H''nin fiilini nitelendiriniz ve cezasını belirtiniz. H''nin etkin pişmanlık için ödemesi gereken asgari tutarı ve
    bunun sonucunu açıklayınız. H''nin menfaati 200.000 TL olsaydı ödenecek asgari tutar ne olurdu? (7 puan)


    (c) J''nin fiilini nitelendiriniz, cezasını belirtiniz ve J''nin Hazineye ödeme yoluyla etkin pişmanlıktan yararlanıp
    yararlanamayacağını açıklayınız. (5 puan)


    (d) Yatırım kuruluşunun yükümlülüğünü; inceleme sırasında Kurulun alabileceği tedbirleri (en az iki örnek ve J''nin paylaşımları
    bakımından); soruşturmanın başlatılması ve görevli mahkemeyi açıklayınız. (7 puan)'
  cozum: '**(a) F — Bilgi suistimali (md. 106)**


    - F ihraççının yöneticisidir (md. 106/1-a); fiyatı etkileyebilecek ve henüz kamuya duyurulmamış ihale bilgisine dayanarak
    alım emri vermiş ve menfaat sağlamıştır → **bilgi suistimali**.

    - Menfaat: 50.000 × (52 − 40) = **600.000 TL**.

    - Ceza: **üç yıldan beş yıla kadar hapis veya adli para cezası**. Adli para cezasına hükmedilirse ceza elde edilen menfaatin
    iki katından az olamaz: 2 × 600.000 = **1.200.000 TL**.


    **(b) H — İşlem bazlı piyasa dolandırıcılığı (md. 107/1)**


    - Fiyat ve işlem hacmi hakkında yanıltıcı izlenim uyandırmak amacıyla alım satım → md. 107/1.

    - Ceza: **üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası**; adli para cezası menfaatten
    (400.000 TL) az olamaz.

    - Etkin pişmanlık (md. 107/3): 500.000 TL''den az olmamak üzere menfaatin iki katı Hazineye ödenir: max(500.000; 800.000)
    = **800.000 TL**. Kovuşturma evresinde hüküm verilinceye kadar ödeme → **ceza üçte biri oranında indirilir**.

    - Menfaat 200.000 TL olsaydı: 2 × 200.000 = 400.000 < 500.000 → asgari ödeme **500.000 TL** olurdu.


    **(c) J — Bilgi bazlı piyasa dolandırıcılığı (md. 107/2)**


    - Fiyatı etkilemek amacıyla yalan/yanlış haber yayıp menfaat sağlama → md. 107/2.

    - Ceza: **üç yıldan beş yıla kadar hapis ve beş bin güne kadar adli para cezası**.

    - Etkin pişmanlık md. 107/3''te yalnız **birinci fıkradaki** (işlem bazlı) suç için öngörülmüştür; J **yararlanamaz**.


    **(d) Bildirim, tedbirler ve usul**


    - Yatırım kuruluşu, işlemin md. 106 veya 107''deki suçları oluşturduğuna dair bilgi veya şüphe bulunduğunda durumu Kurula
    (veya Kurulca belirlenen kuruma) **bildirmekle yükümlüdür**; bildirim hakkında mahkeme, savcılık ve MASAK dışında işleme
    taraf olanlar dâhil üçüncü kişilere bilgi veremez (md. 102).

    - Tedbirler (md. 101/1): makul şüphe bulunan kişiler ve ilgili araçlar için borsalarda geçici veya sürekli **işlem yasağı**,
    kredili alım/açığa satış/ödünç işlemlerine sınırlama, teminat yükümlülüğü, işlem veya pozisyon limiti vb. J''nin internet
    paylaşımları için Kurul **içeriğin çıkarılmasına ve/veya erişimin engellenmesine** karar verebilir; karar Erişim Sağlayıcıları
    Birliğine gönderilir (md. 101/3).

    - Soruşturma, Kurulun Cumhuriyet başsavcılığına **yazılı başvurusuna** bağlıdır (muhakeme şartı); kamu davası açılırsa
    iddianamenin kabulüyle Kurul **katılan** sıfatını kazanır; kovuşturmaya yer olmadığı kararına itiraz edebilir (md. 115).

    - Görevli mahkeme: HSK''nın ihtisas mahkemesi olarak görevlendirdiği **asliye ceza mahkemeleri** (md. 116).'
  puanlama:
  - olcut: (a) Bilgi suistimali nitelendirmesi ve F'nin md. 106/1-(a) kapsamında yönetici olması
    puan: 2
  - olcut: (a) Menfaat 600.000 TL; 3–5 yıl hapis veya adli para cezası; adli para alt sınırı 1.200.000 TL
    puan: 4
  - olcut: (b) md. 107/1 nitelendirmesi ve ceza (hapis ve adli para; adli para ≥ menfaat)
    puan: 2
  - olcut: (b) Etkin pişmanlık ödemesi 800.000 TL ve kovuşturma evresinde üçte bir indirim
    puan: 3
  - olcut: (b) 200.000 TL menfaat hâlinde 500.000 TL asgari ödeme
    puan: 2
  - olcut: (c) md. 107/2 nitelendirmesi ve cezası
    puan: 3
  - olcut: (c) Etkin pişmanlığın yalnız md. 107/1 için öngörüldüğü
    puan: 2
  - olcut: (d) md. 102 bildirim yükümlülüğü ve gizlilik
    puan: 2
  - olcut: (d) md. 101 tedbirleri ve internet içeriğine ilişkin erişim engeli
    puan: 3
  - olcut: (d) md. 115 yazılı başvuru/katılan sıfatı ve md. 116 görevli mahkeme
    puan: 2
