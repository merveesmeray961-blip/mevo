- id: YMM-SPM-SUC-K003
  sinav: ymm
  ders: SPM
  konu: SUC
  kazanimlar:
  - piyasa dolandırıcılığı
  - idari para cezaları ve tedbirler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "Kurul gözetim birimi, payları borsada işlem gören ve işlem hacmi düşük **Ladin Gıda A.Ş.** paylarında aşağıdaki\n\
    hususları tespit etmiştir:\n\n1. **Bay (R)**, Mart 2026'da birçok seansta gerçekleşme amacı taşımayan büyük hacimli alış\
    \ emirleri verip seans\n   içinde iptal etmiş; bu sırada pay fiyatı yükselmiş ve Bay (R) elindeki payları yükselen fiyattan\
    \ satarak\n   300.000 TL menfaat elde etmiştir. İncelemede Bay (R)'nin yanlış izlenim uyandırma amacı **ispatlanamamış**;\n\
    \   ancak işlemler Kurulca piyasanın güven ve istikrarını bozucu nitelikte bulunmuştur.\n2. Bay (R), Kurul karar vermeden\
    \ önce aynı nitelikteki işlemleri Nisan 2026'da da tekrarlamış ve bu işlemlerden de\n   ilave menfaat elde etmiştir; iki\
    \ dönemde elde edilen toplam menfaat 300.000 TL'dir.\n3. Bay (R)'nin işlemlerine aracılık eden **(P) Yatırım A.Ş.**'nin\
    \ genel müdürü, Kurulun gözetim düzenlemelerine aykırı\n   olarak şüpheli işlemleri raporlamamıştır. (P)'nin aykırılık\
    \ tarihinden önceki son bağımsız denetimden geçmiş yıllık\n   finansal tablolarına göre brüt satış hasılatı 400.000.000\
    \ TL, vergi öncesi kârı 30.000.000 TL'dir.\n\nBu soruda SPKn md. 104'teki alt ve üst sınırların 2026 için 50.000 TL ve\
    \ 1.250.000 TL olarak uygulandığı kabul\nedilecektir.\n\n**İstenenler:**\n\n(a) Bay (R)'nin fiilinin piyasa dolandırıcılığı\
    \ mı yoksa piyasa bozucu eylem mi olduğunu ayırt ederek\nnitelendiriniz; 1 numaralı olay tek başına değerlendirilseydi\
    \ verilecek idari para cezasının alt sınırını\nhesaplayınız. (7 puan)\n\n(b) 2 numaralı olay dikkate alındığında kabahatlerin\
    \ tekrarı kuralını uygulayarak verilecek cezanın alt sınırını\nbelirleyiniz; cezadan önceki usulü ve tahsil edilen cezanın\
    \ paylaştırılmasını açıklayınız. (6 puan)\n\n(c) (P) Yatırım A.Ş.'ye verilebilecek idari para cezasının üst sınırını hesaplayınız\
    \ ve tüzel kişiye ceza\nverilmesinin şartını açıklayınız. (6 puan)\n\n(d) Bay (R)'nin yanlış izlenim uyandırma amacı ispatlansaydı\
    \ fiilin nitelendirmesini, cezasını ve Hazineye ödeme\nyoluyla etkin pişmanlıktan yararlanma koşullarını (asgari ödeme\
    \ tutarıyla) açıklayınız. (6 puan)\n"
  cozum: '**(a) Nitelendirme**


    İşlem bazlı **piyasa dolandırıcılığı** (SPKn md. 107/1), fiyat ve arz-talep hakkında **yanlış veya yanıltıcı izlenim

    uyandırmak amacıyla** alım satım, emir verme, iptal ve değiştirme işlemlerini gerektirir; amaç unsuru ispatlanmadan bu

    suç oluşmaz. Suç oluşturmayan ancak piyasanın güven, açıklık ve istikrarını bozucu nitelikteki eylemler **piyasa

    bozucu eylem** olarak idari yaptırıma bağlanır (md. 104). Amaç ispatlanamadığından Bay (R)''nin fiili **piyasa bozucu

    eylemdir**.


    Piyasa bozucu eylemlerde ceza alt ve üst sınırlar arasındadır; menfaat sağlanmışsa ceza **menfaatin iki katından** az

    olamaz: 300.000 × 2 = **600.000 TL** (50.000 TL''lik alt sınırın üzerinde, 1.250.000 TL''lik üst sınırın altında).


    **(b) Tekrar ve usul**


    Kabahat karar verilinceye kadar birden çok işlenmişse **tek ceza** verilir ve ceza **iki kat** artırılır; bu yolla menfaat

    sağlanmışsa ceza menfaatin **üç katından** az olamaz (md. 105). Toplam menfaat 300.000 TL olduğundan ceza en az

    300.000 × 3 = **900.000 TL** olmalıdır.


    İdari para cezası verilmeden önce ilgilinin **savunması** alınır; tebliğden itibaren **otuz gün** içinde savunma

    verilmezse savunma hakkından feragat edilmiş sayılır. Tahsil edilen cezaların **%50''si genel bütçeye**, **%50''si

    Yatırımcı Tazmin Merkezine** aktarılır; kararlara karşı idari yargı yolu açıktır.


    **(c) Tüzel kişiye ceza**


    Tüzel kişilere, aykırılık tarihinden önceki son bağımsız denetimden geçmiş yıllık finansal tablolarındaki **brüt satış

    hasılatının %1''i** ile **vergi öncesi kârının %20''sinden** yüksek olanına kadar idari para cezası verilebilir

    (md. 103/1):


    - Hasılatın %1''i = 400.000.000 × %1 = 4.000.000 TL

    - Vergi öncesi kârın %20''si = 30.000.000 × %20 = 6.000.000 TL

    - Üst sınır = **6.000.000 TL**


    Aykırılık tüzel kişinin organ veya temsilcisi (genel müdür) tarafından işlendiğinden tüzel kişiye de ceza verilir;

