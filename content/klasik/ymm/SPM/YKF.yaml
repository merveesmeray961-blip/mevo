    aşım varsa uyum için asgari satış tutarlarını belirleyiniz. (10 puan)


    (d) Saklayıcı önerisini ve haciz talebini değerlendiriniz; yatırım fonunun hukuki niteliğini açıklayınız. (5 puan)

