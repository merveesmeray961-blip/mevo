    alinti: (5) 1.000.000 Türk Lirasını aşan fon taleplerinde, hedeflenen fon tutarının toplanmış sayılması için hedeflenen
      fonun en az %5’ine tekabül eden tutarın kampanya süresi içinde nitelikli yatırımcılar tarafından karşılanmış olması
