  soru: "**I. Kripto varlık platformu.** Kurul izniyle faaliyet gösteren **Kuzey Kripto Varlık Alım Satım Platformu A.Ş.**\n\
    (Kuzey) nezdinde yapılan incelemede şu tespitler yapılmıştır:\n\n1. Müşterilerle imzalanan sözleşmede \"Platform, müşteri\
    \ varlıklarının siber saldırı sonucu kaybından hiçbir şekilde\n   sorumlu değildir.\" hükmü bulunmaktadır.\n2. Müşterilerden\
    \ toplanan Türk lirası nakitler Kuzey'in kendi faaliyet hesabında tutulmaktadır.\n3. %15 paya sahip bir ortak, Kurul izni\
    \ olmaksızın paylarını üçüncü bir kişiye devretmiş ve devir pay defterine\n   işlenmek istenmektedir.\n4. Bir vergi dairesi,\
    \ Kuzey'in vergi borcu nedeniyle müşterilere ait ve Kuzey nezdinde saklanan kripto varlıklara\n   haciz uygulamak istemektedir.\n\
    5. Platformun bir yöneticisinin müşterilere ait kripto varlıkları kendi cüzdanına aktardığı anlaşılmıştır. Zarar\n   gören\
    \ müşteriler Yatırımcı Tazmin Merkezine başvurmak istemektedir.\n\n**II. Kitle fonlaması.** Bir girişim şirketi, Kurul\
    \ izinli bir kitle fonlama platformu aracılığıyla paya dayalı kitle\nfonlamasıyla fon toplamaktadır. Nitelikli yatırımcı\
    \ olmayan **Bay (M)** platforma yıllık net gelirini 1.500.000 TL,\n**Bayan (N)** 3.000.000 TL olarak beyan etmiştir. Bu\
    \ soruda Kitle Fonlaması Tebliği (III-35/A.2) md. 15'teki tutarlar\nesas alınacaktır. Girişim şirketinin bilgi formunda\
    \ finansal verilerin gerçeğe aykırı gösterildiği sonradan\nanlaşılmıştır.\n\n**İstenenler:**\n\n(a) I. bölümdeki 1–4 numaralı\
    \ tespitleri SPKn hükümleri çerçevesinde değerlendiriniz. (10 puan)\n\n(b) 5 numaralı tespiti cezai yönden ve müşterilerin\
    \ Yatırımcı Tazmin Merkezine başvuru imkânı yönünden\ndeğerlendiriniz. (5 puan)\n\n(c) Bay (M) ve Bayan (N)'nin bir takvim\
    \ yılında paya dayalı kitle fonlamasıyla yapabileceği azami yatırım\ntutarlarını hesaplayınız. (5 puan)\n\n(d) Kitle fonlamasının\
    \ izahname ve yatırımcı tazmini rejimi karşısındaki durumunu ve bilgi formundaki gerçeğe\naykırılıktan doğan sorumluluğu\
    \ açıklayınız. (5 puan)\n"
  cozum: '**(a) Platformdaki tespitler**


    | No | Değerlendirme | Dayanak |

    |---|---|---|

    | 1 | Kripto varlık hizmet sağlayıcıların müşterilerine karşı sorumluluğunu ortadan kaldıran veya sınırlandıran her türlü
    sözleşme şartı **geçersizdir**; Kuzey sorumluluktan kurtulamaz | SPKn md. 35/C-1 |

    | 2 | Müşteri nakitleri banka nezdinde tutulmalıdır; nakitlerin platformun kendi faaliyet hesabında tutulması **aykırıdır**
    | md. 35/C-6 |

    | 3 | Kripto varlık hizmet sağlayıcıların pay devirleri **Kurul iznine** tabidir; izinsiz devir **pay defterine kaydolunmaz**
    | md. 35/B-1 |

    | 4 | Müşterilere ait kripto varlıklar ve nakitler hizmet sağlayıcının mal varlığından **ayrıdır**; sağlayıcının borçları
    için **haczedilemez**, rehnedilemez ve iflas masasına girmez; haciz talebi yerine getirilemez | md. 35/C-7 |


    **(b) Zimmet ve tazmin**


    Kripto varlık hizmet sağlayıcının yöneticisinin, görevi gereği zilyetliği kendisine devredilmiş veya koruma ve

    gözetimiyle yükümlü olduğu kripto varlıkları kendisinin veya başkasının zimmetine geçirmesi **zimmet** suçudur;

    sekiz yıldan on dört yıla kadar hapis ve beş bin güne kadar adli para cezası gerektirir; hileli davranışlarla

    işlenirse ceza ağırlaşır (md. 110/A). Bu suçta gecikmesinde sakınca olan hâllerde savcı resen soruşturma yapabilir

    (md. 115/A).


    Kripto varlıklar SPKn md. 82''deki **yatırımcı tazmin hükümlerine tabi değildir** (md. 35/C-4); müşteriler Yatırımcı

    Tazmin Merkezinden tazmin talep edemez. Zararlarını genel hükümlere göre platform ve sorumlulardan talep ederler;

    faaliyet izni, işlemlerin kamunun güvencesi altında olduğu anlamına gelmez.


    **(c) Kitle fonlaması yatırım sınırı**


    Nitelikli yatırımcı olmayan gerçek kişiler bir takvim yılında paya dayalı kitle fonlamasıyla azami **50.000 TL**

    yatırım yapabilir; bu sınır **200.000 TL''yi** aşmamak kaydıyla beyan edilen yıllık net gelirin **%10''u** olarak

    uygulanabilir (md. 15/1).


    - Bay (M): 1.500.000 × %10 = 150.000 TL (≤ 200.000 TL) → azami **150.000 TL**.

    - Bayan (N): 3.000.000 × %10 = 300.000 TL > 200.000 TL → azami **200.000 TL**.


    Sınır kontrolü, platformlarca MKK''ya iletilen en son beyan esas alınarak MKK tarafından yapılır (md. 15/2).


    **(d) İzahname, tazmin ve sorumluluk**


    Kitle fonlaması yoluyla para toplanması **izahname ve ihraç belgesi** yükümlülüğüne tabi değildir (SPKn md. 4/1) ve

    SPKn''nin **yatırımcı tazminine** ilişkin hükümleri kapsamında değildir (md. 3/1-z); kitle fonlaması yatırım hizmeti

    sayılmaz (md. 35/A-4). Bilgi formunu imzalayanlar, formdaki yanlış, yanıltıcı veya eksik bilgiden doğan zararlardan

    **müteselsilen** sorumludur (md. 35/A-6).

