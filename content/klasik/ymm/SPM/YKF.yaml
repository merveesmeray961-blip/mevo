  soru: '**Fikir Fon Platformu A.Ş.** kitle fonlaması platformu olarak kurulmak istemektedir. Kurucular sermayeyi **800.000
    TL** olarak nakden ödemeyi, paylarının tamamını nama yazılı yapmayı, unvanda "Kitle Fonlama Platformu" ibaresini kullanmayı
    ve yönetim kurulunu **3 kişiden** oluşturmayı planlamaktadır.


    Platformda yürütülen **paya dayalı** bir kampanyada girişim şirketi **Doğa Yazılım A.Ş.** 4.000.000 TL hedef fon talep
    etmektedir. Kampanya başlangıcı **10 Mart 2026**''dır. Kampanya sonunda nitelikli yatırımcılardan toplanan tutar 150.000
    TL''dir. Girişim şirketi bilgi formunda açıklamak ve ihraç sınırını aşmamak kaydıyla ek fon toplamayı da öngörmektedir.
    Ayrıca Doğa Yazılım''ın kampanya başlangıcındaki ortaklarından, şirkette önemli etkiye sahip olan **O**, paylarını 2027
    yılında bir arkadaşına satmak istemektedir.


    Platform yatırımcıları: nitelikli yatırımcı olmayan **Y1** (beyan ettiği yıllık net geliri 800.000 TL) ve **Y2** (beyan
    ettiği yıllık net geliri 3.000.000 TL), aynı takvim yılında paya dayalı kitle fonlamasına yatırım yapmak istemektedir;
    ikisi de sınırların gelirin %10''una göre uygulanmasını talep etmektedir.


    **İstenenler:**

    (a) Platformun kuruluşuna izin verilebilmesi bakımından planlanan sermaye ve yönetim kurulu yapısını değerlendiriniz.
    (5 puan)

    (b) Kampanyada hedeflenen fonun toplanmış sayılması için nitelikli yatırımcılardan karşılanması gereken asgari tutarı
    hesaplayınız ve sonucu değerlendiriniz; toplanabilecek en yüksek ek fon tutarını belirtiniz. (8 puan)

    (c) Y1 ve Y2''nin bir takvim yılında yatırım yapabilecekleri azami tutarları hesaplayınız. (6 puan)

    (d) O''nun paylarını devredip devredemeyeceğini ve girişim şirketinin on iki ay içinde yapabileceği kampanya sayısını
    belirtiniz. (6 puan)

    '
  cozum: '**(a)** Platform anonim ortaklık olmalı; sermayesi asgari **1.000.000 TL** ve tamamı nakden ödenmiş olmalı, sermayesi
    ve özsermayesi bu tutardan az olmamalı; payların tamamı nama yazılı olmalı; ticaret unvanında "Kitle Fonlama Platformu"
    bulunmalı; yönetim kurulu asgari **3 kişiden** oluşmalıdır (III-35A.2 md. 5/1). Planlanan sermaye 800.000 TL **yetersizdir**;
    diğer şartlar (nama yazılı pay, unvan, 3 kişilik yönetim kurulu) sağlanmaktadır.


    **(b)** 1.000.000 TL''yi aşan fon taleplerinde hedeflenen fonun toplanmış sayılması için hedefin **en az %5**''inin kampanya
    süresinde nitelikli yatırımcılarca karşılanması zorunludur (md. 16/5): 4.000.000 × %5 = **200.000 TL**. Toplanan 150.000
    TL yetersiz olduğundan hedef fon **toplanmış sayılmaz**. Ek fon, talep edilen fon miktarının azami **%20**''sine kadar
    toplanabilir (md. 16/4): 4.000.000 × %20 = **800.000 TL** (ihraç sınırını aşmamak kaydıyla); %5 zorunluluğu ek fon bakımından
    uygulanmaz.


    **(c)** Nitelikli yatırımcı olmayan gerçek kişiler için sınır 50.000 TL''dir; ancak sınır 200.000 TL''yi aşmamak kaydıyla
    yatırımcının beyan ettiği yıllık net gelirinin %10''u olarak uygulanabilir (md. 15/1). Y1: 800.000 × %10 = **80.000 TL**.
    Y2: 3.000.000 × %10 = 300.000 TL > 200.000 TL → **200.000 TL**.


    **(d)** Kampanya sürecinin başladığı tarihteki ortaklardan fonlanan şirkette önemli etkiye sahip olanlar, kampanya başlangıcını
    izleyen **3 yıl** içinde (miras, mal rejimi, cebri icra nedenli devirler ile nitelikli yatırımcılara veya kendi aralarındaki
    devirler hariç) paylarını devredemez (md. 16/7). 10 Mart 2026 + 3 yıl = 10 Mart 2029; O''nun 2027''deki satışı arkadaşına
    yapılacağından **devredemez**. Girişim şirketi herhangi bir on iki aylık dönemde paya dayalı olarak **en fazla iki kampanya**
    ile fon toplayabilir (md. 16/4).

    '
