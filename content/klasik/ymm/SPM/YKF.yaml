      sınırsız sorumlulukla katıldıkları veya yönetim kurulu başkanı, üyesi, genel müdür, genel müdür yardımcısı oldukları
      ortaklıklara, b) Kamu tüzel kişileri hariç olmak üzere bir tüzel kişinin veya yukarıda sayılanların, sermayelerinin
      doğrudan veya dolaylı olarak %25 veya daha fazlasına iştirak ettikleri ortaklıklara, c) Kurul tarafından aralarında
