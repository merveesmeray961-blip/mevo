- id: YMM-SPM-YKF-K004
  sinav: ymm
  ders: SPM
  konu: YKF
  kazanimlar:
  - gayrimenkul yatırım ortaklıkları
  - kitle fonlaması
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Senaryo:**

    DEF GYO A.Ş. halka açık bir gayrimenkul yatırım ortaklığıdır. Şirket yönetimi; bir alışveriş merkezi projesi için yeni
    bir proje geliştirme ortaklığı kurmayı ve aynı zamanda kitle fonlaması platformu üzerinden küçük yatırımcılardan fon toplamayı
    değerlendirmektedir.


    **(a)** SPK III-48.1 Tebliği kapsamında DEF GYO''nun portföy yapısına ilişkin zorunlulukları ve bir inşaat projesine katılımın
    koşullarını açıklayınız. (10 puan)


    **(b)** SPK III-35a.2 Tebliği kapsamında kitle fonlaması yoluyla fon toplamanın GYO aracılığıyla mı yoksa doğrudan kitle
    fonlaması platformu üzerinden mi yapılabileceğini, her iki yolun mevzuat şartlarını karşılaştırarak açıklayınız. (10 puan)


    **(c)** Kitle fonlaması yatırımcılarının temel koruma mekanizmalarını belirtiniz. (5 puan)

    '
  cozum: '**(a) GYO Portföy Zorunlulukları ve İnşaat Projesi Katılımı:**


    III-48.1 Tebliği uyarınca GYO portföyü:

    - Portföyün belirlenen asgari oranında gayrimenkul, gayrimenkule dayalı haklar veya projelere yer verilmesi zorunludur.

    - Portföyde nakit ve sermaye piyasası araçları da bulunabilir (tebliğdeki sınırlar dahilinde).


    İnşaat Projesine Katılım Koşulları:

    - İnşaat taahhüt projeleri belirli portföy yüzdesiyle sınırlıdır.

    - Proje için gerekli izinlerin (imar, inşaat ruhsatı vb.) mevcut olması şarttır.

    - Proje değerlemesi yetkili değerleme şirketi tarafından yapılmalıdır.

    - Proje kapsamında inşaat şirketi seçimi rekabetçi usulde belirlenmelidir.


    **(b) Kitle Fonlaması — GYO mı, Doğrudan Platform mı?**


    GYO Aracılığıyla:

    - GYO pay ihracı için SPK mevzuatına tabi prosedür izlenir.

    - Halka arz zorunluluğu ve borsa kaydı gereklidir.

    - Bireysel yatırımcılar GYO payı alarak dolaylı yatırım yapar.

    - Daha kapsamlı regülasyon ve şeffaflık yükümlülükleri mevcuttur.


    Doğrudan Kitle Fonlaması Platformu Üzerinden:

    - III-35a.2 kapsamında Kurul izinli platformda pay bazlı kitle fonlaması yapılabilir.

    - Bireysel yatırımcı yıllık yatırım limitleri uygulanır.

    - Proje şirketi için bilgi formu ve taahhütname zorunludur.

    - İşlem maliyetleri GYO yoluna göre daha düşük olabilir; ancak yatırımcı tabanı sınırlıdır.


    **(c) Kitle Fonlaması Yatırımcı Koruma Mekanizmaları:**


    - Bireysel yatırımcılara yıllık yatırım limiti uygulanması

    - Platform aracılığıyla yatırım öncesinde proje bilgi formu sunulması

    - Fonun kullanımına ilişkin taahhütname ve takip yükümlülüğü

    - Kurul denetimi altındaki platform aracılığıyla şeffaflık

    - Yanlış/yanıltıcı bilgi verenler hakkında hukuki ve idari yaptırım uygulanabilmesi

    '
  puanlama:
