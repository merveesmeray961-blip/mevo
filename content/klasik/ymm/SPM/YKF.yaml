- id: YMM-SPM-YKF-K008
  sinav: ymm
  ders: SPM
  konu: YKF
  kazanimlar:
  - yatırım kuruluşlarının kuruluş şartları
  - yatırım hizmetleri ve faaliyetleri
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Yıldırım Yatırım Menkul Değerler A.Ş.** (kuruluş aşamasında) aracı kurum olarak kurulmak için Kurula başvurmayı\n\
    planlamaktadır. Kuruluş projesine ilişkin bilgiler:\n\n1. Şirket anonim ortaklık olarak kurulacaktır; payların %80'i nama,\
    \ %20'si hamiline yazılı olacaktır.\n2. Sermayenin bir kısmı, kurucu ortak (D)'nin ayni sermaye olarak koyacağı bir ofis\
    \ binasıyla karşılanacaktır.\n3. Kurucu ortak **(A)** 2018 yılında iflas etmiş, iflası 2022 yılında kaldırılmış ve karar\
    \ aynı yıl kesinleşmiştir.\n4. Kurucu ortak **(B) Holding A.Ş.**'nin önemli etkiye sahip ortağı **(C)**, vergi kaçakçılığı\
    \ suçundan kesinleşmiş\n   mahkûmiyete sahiptir.\n5. %25 paya sahip olacak kurucu ortak, yurt dışında yerleşik ve ortaklarının\
    \ kim olduğu bilinmeyen bir vakıftır.\n6. Şirket şu faaliyetleri yürütmeyi planlamaktadır: emirlerin alınması ve iletilmesi,\
    \ portföy yöneticiliği,\n   yatırım danışmanlığı, müşterilere sermaye piyasası işlemleri için kredi kullandırılması, yatırım\
    \ araştırması ve\n   şirketin hizmet sunma amacı olmaksızın yalnız kendi portföyü için yapacağı alım satımlar.\n\n**İstenenler:**\n\
    \n(a) Aracı kurumların kuruluşu için aranan şartları sayınız ve şirketin kuruluş projesindeki aykırılıkları\ngerekçeleriyle\
    \ belirleyiniz. (10 puan)\n\n(b) Planlanan faaliyetleri yatırım hizmetleri ve faaliyetleri, yan hizmetler ve izin gerektirmeyen\
    \ işlemler olarak\nsınıflandırınız; şirketin hangi aracı kurum grubunda yer alması gerektiğini ve yan hizmetlere başlama\
    \ usulünü\naçıklayınız. (8 puan)\n\n(c) Faaliyet izni başvurusunun karara bağlanma süresini ve faaliyet izninin Kurulca\
    \ iptal edilebileceği hâlleri;\nizinlerin tamamı iptal edilen kuruluşun yükümlülüğünü açıklayınız. (5 puan)\n\n(d) Kuruluştan\
    \ sonra ortaklarda kuruluş şartlarını etkileyen bir değişiklik olursa şirketin bildirim yükümlülüğünü\nbelirtiniz. (2\
    \ puan)\n"
  cozum: '**(a) Kuruluş şartları ve aykırılıklar**


    Aracı kurumun kuruluşuna izin için (Tebliğ III-39.1 md. 5/1): anonim ortaklık şeklinde kurulma; payların tamamının

    **nama yazılı** olması; payların **nakit karşılığı** çıkarılması; kuruluş sermayesinin Kurulca belirlenen tutardan

    (geniş yetkili aracı kurumlar için aranan asgari özsermayenin altında olmamak üzere) az olmaması; esas sözleşmenin

    mevzuata uygunluğu; kurucuların gerekli şartları taşıması ve **ortaklık yapısının şeffaf ve açık** olması gerekir.


    | No | Durum | Değerlendirme |

    |---|---|---|

    | 1 | %20 hamiline pay | Payların tamamının nama yazılı olması şartına **aykırı** |

    | 2 | Ayni sermaye (bina) | Payların nakit karşılığı çıkarılması şartına **aykırı** |

    | 3 | (A)''nın iflası 2022''de kaldırılmış | Kurucunun müflis olmaması şartı (md. 6/1-a), iflasın kaldırılmasına ilişkin
    kararın kesinleşmesinden itibaren **10 yıl** geçmedikçe dikkate alınır (md. 6/2); 2032''ye kadar **engeldir** |

    | 4 | (C)''nin vergi kaçakçılığı mahkûmiyeti | Tüzel kişi kurucunun önemli etkiye sahip ortaklarının da kurucu şartlarını
    taşıması zorunludur (md. 6/3); vergi kaçakçılığından mahkûmiyet şarta **aykırı** (md. 6/1-d) |

    | 5 | Ortakları belirsiz vakıf | Ortaklık yapısının şeffaf ve açık olması şartına **aykırı** (md. 5/1-f) |


    Anonim ortaklık şekli şartı sağlanmaktadır. Aykırılıklar giderilmeden kuruluş izni verilmez.


    **(b) Faaliyetlerin sınıflandırılması**


    | Faaliyet | Nitelik |

    |---|---|

    | Emirlerin alınması ve iletilmesi | Yatırım hizmeti (SPKn md. 37) |

    | Portföy yöneticiliği | Yatırım hizmeti (md. 37) |

    | Yatırım danışmanlığı | Yatırım hizmeti (md. 37) |

    | Müşterilere kredi kullandırılması | Yan hizmet (md. 38) |

    | Yatırım araştırması | Yan hizmet (md. 38) |

    | Yalnız kendi portföyü için alım satım (hizmet sunma amacı yok) | Kurul iznine tabi değildir (III-37.1 md. 5/3) |


    Yatırım hizmetleri Kurul izniyle ve yalnız yatırım kuruluşlarınca yürütülür (md. 39/1). Emir iletimi ve yatırım

    danışmanlığı dar yetkili aracı kurumlarca da yapılabilir; ancak **portföy yöneticiliği** kısmi yetkili aracı

    kurumların faaliyetleri arasında olduğundan şirket en az **kısmi yetkili** aracı kurum olmalıdır (III-37.1 md. 8).

    Yan hizmetler ayrıca yetki belgesine tabi değildir; Kurula **bildirilir** ve 20 iş günü içinde aksi görüş

    bildirilmezse yürütülmeye başlanır (III-37.1 md. 7).


    **(c) Karar süresi ve iptal**


    Faaliyet izni başvurusu, belgelerin eksiksiz sunulmasından itibaren **azami altı ay** içinde karara bağlanır

    (SPKn md. 39/4). Kurul, izin tarihinden itibaren **iki yıl** süreyle faaliyette bulunulmaması veya kaybedilen

    şartların tespitten itibaren **üç ay** içinde yeniden sağlanamaması hâllerinde izni iptal edebilir (md. 41/1).

    İzinlerinin tamamı iptal edilen kuruluş en geç **üç ay** içinde sona erme kararı almak veya unvan ve faaliyet

    konusunu değiştirmek zorundadır (md. 41/2).


    **(d) Bildirim**


    Aracı kurum, ortaklarının kurucu şartlarına ilişkin durumlarında değişiklik olması hâlinde durumu **3 iş günü**

    içinde Kurula bildirir (III-39.1 md. 6/6).

