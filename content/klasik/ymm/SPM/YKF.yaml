  - yatırım hizmetleri ve faaliyetleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Senaryo:**

    JKL Kripto A.Ş. hem kripto varlık hizmet sağlayıcısı hem de yatırım danışmanlığı hizmeti sunmak isteyen bir fintek şirketidir.


    **(a)** 6362 sayılı Kanun kapsamında kripto varlık hizmet sağlayıcısı statüsü kazanmak için gerekli koşulları açıklayınız.
    (10 puan)


    **(b)** SPK III-37.1 Tebliği kapsamında yatırım danışmanlığı hizmetinin tanımını ve bu hizmetin sunulmasında uyulması
    gereken "müşterini tanı" ilkesini açıklayınız. (10 puan)


    **(c)** Kripto varlık işlemleri ile geleneksel sermaye piyasası işlemleri arasındaki temel düzenleyici farklılıkları belirtiniz.
    (5 puan)

    '
  cozum: '**(a) Kripto Varlık Hizmet Sağlayıcısı Koşulları:**


    6362 sayılı Kanun ek maddeleri uyarınca:

    1. Anonim şirket statüsünde kurulmuş olmak

    2. Kurul tarafından belirlenen asgari sermaye yükümlülüğünü karşılamak

    3. Teknik altyapı ve siber güvenlik standartlarını sağlamak

    4. Kurul''a faaliyet izni başvurusunda bulunmak ve izni almak

    5. Müşteri varlıklarını kendi malvarlığından ayrı tutmaya ilişkin düzenleme yapmak

    6. Belirlenmiş yönetim kadrosu ve uyum yetkilisi atamak


    **(b) Yatırım Danışmanlığı ve Müşterini Tanı İlkesi:**


    III-37.1 Tebliği md. 3 uyarınca yatırım danışmanlığı: Müşteriye kişisel koşulları gözetilerek sermaye piyasası araçlarına
    ilişkin alım satım tavsiyesi verilmesidir.


    Müşterini Tanı İlkesi:

    - Müşterinin yatırım amacı ve risk toleransı belirlenir.

    - Müşterinin mali durumu ve yatırım deneyimi değerlendirilir.

    - Uygunluk testi ve yerindelik testi uygulanır.

    - Müşteriye uygun olmayan ürün tavsiye edilemez.


    **(c) Kripto Varlık ile Geleneksel İşlem Farklılıkları:**


    - Kripto varlık işlemleri merkeziyetsiz altyapı üzerinde gerçekleşebilirken geleneksel işlemler borsada yapılır.

    - Kripto varlıklarda geleneksel tahvil/hisse senedi gibi yasal güvenceler farklı kapsamda uygulanır.

    - Kripto varlık hizmet sağlayıcıları için sermaye ve yükümlülük standartları aracı kurum standartlarına benzer biçimde
    düzenlenmiş olmakla birlikte bazı farklılıklar mevcuttur.

    '
