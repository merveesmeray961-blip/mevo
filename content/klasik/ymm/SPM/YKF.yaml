  soru: 'Payları Borsa İstanbul''da işlem gören **Sedir Gayrimenkul Yatırım Ortaklığı A.Ş.**''nin (Sedir) hesap dönemi takvim
    yılıdır; ortaklık altyapı yatırım ve hizmetlerinden oluşan portföyü işletmemektedir. Sedir''e ilişkin 2025 yılı bilgileri
    şöyledir:


    **1. Finansal durum (31 Aralık 2025, TL).** Kamuya açıklanan bağımsız denetimden geçmiş tablolara göre:


    | Kalem | Bireysel (konsolide olmayan) | Konsolide |

    |---|---|---|

    | Öz sermaye | 640.000.000 | 900.000.000 |


    Sedir''in bireysel tablolarında yer alan borçlardan: banka kredileri 1.900.000.000; finansal kiralama işlemlerinden doğan
    borçlar 350.000.000; gayri nakdi krediler (teminat mektupları) 420.000.000; müteahhitlere ticari borçlar 300.000.000''dir.
    Sedir portföyle ilgili maliyetleri karşılamak üzere 2026 başında yeni bir banka kredisi (**600.000.000 TL**) kullanmayı
    planlamaktadır.


    **2. Portföy işlemleri (2025).** Her işlem için Kurulca listeye alınmış değerleme kuruluşunca tespit edilen ekspertiz
    değeri ve gerçekleşen işlem bedeli aşağıdadır:


    | No | İşlem | Ekspertiz değeri (TL) | İşlem bedeli (TL) |

    |---|---|---|---|

    | 1 | Ofis binası satın alınması | 120.000.000 | 124.000.000 |

    | 2 | Portföydeki deponun satışı | 80.000.000 | 76.000.000 |

    | 3 | Arsa satın alınması | 60.000.000 | 60.000.000 |

    | 4 | Portföydeki konutların satışı | 50.000.000 | 46.000.000 |

    | 5 | Alışveriş merkezinde bir mağazanın kiraya verilmesi (aylık kira) | 500.000 | 470.000 |


    **3. Kira gelirleri (2025).** Aşağıdaki gayrimenkullerin kira bedelleri kısmi/değişken doluluk ve ciro kirası içerdiğinden
    hesap döneminin sonunda ekspertiz kira bedeli ile karşılaştırılmaktadır:


    | Gayrimenkul | Toplam ekspertiz kira bedeli (yıllık, TL) | Yıl içindeki ortalama doluluk oranı | 2025''te elde edilen
    kira geliri (TL) |

    |---|---|---|---|

    | Sedir Plaza (AVM) | 48.000.000 | %75 | 34.200.000 |

    | Sedir İş Merkezi | 18.000.000 | %90 | 16.500.000 |


    **4. Değerleme kuruluşu seçimi.** Sedir, Sedir Plaza için 1 Ocak 2023 - 31 Aralık 2025 arasında her yıl **Ufuk Gayrimenkul
    Değerleme A.Ş.**''den hizmet almıştır. Yönetim kurulu, 12 Şubat 2026''da aldığı kararla 2026 yılı için Sedir Plaza''da
    yine Ufuk''u, portföye 2026 yılı içinde alınabilecek ve değerleme gerektirecek varlıklar için de üç ayrı değerleme kuruluşunu
