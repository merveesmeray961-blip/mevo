    yazılı olarak reddetmiş, buna rağmen çerçeve sözleşme imzalanıp hizmete başlanmıştır.

    5. M3 ile bireysel portföy yöneticiliği çerçeve sözleşmesi imzalanmadan önce yalnızca yatırım süresi ile risk ve getiri
    tercihlerine ilişkin bilgi alınmıştır; mali durum ve bilgi-tecrübe bilgileri alınmamıştır.

