    \ değeri yoktur**; birim pay\ndeğeri fon toplam değerinin pay sayısına bölünmesiyle bulunur (Tebliğ III-52.1 md. 14).\n\
    \n**(b) Şemsiye fon kuralı**\n\nHisse senedi şemsiye fonuna bağlı fonlarda fon toplam değerinin en az **%80'i** devamlı\
    \ olarak yerli ihraççıların\nborsada işlem gören paylarına yatırılır (md. 6/1). Oran = 165.000.000 / 200.000.000 = **%82,5**\
    \ ≥ %80 → **uygun**.\n\n**(c) İhraççı sınırları (md. 17/1-a, b)**\n\n| İhraççı | Değer | Fon toplam değerine oranı |\n\
