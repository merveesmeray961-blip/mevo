    **İstenenler:**


    (a) Sedir''in kredi kullanım sınırını hesaplayınız; planlanan 600.000.000 TL''lik krediyi bu sınır bakımından değerlendiriniz
    ve kullanılabilecek azami kredi tutarını bulunuz. Sınırın hesabında hangi kalemlerin dikkate alınıp alınmadığını gerekçesiyle
    belirtiniz. (6 puan)


    (b) Bölüm 2''deki işlemlerin hangileri için kamuya açıklama ve genel kurulda bilgi verme yükümlülüğü doğduğunu işlem bazında
    gerekçelendiriniz. (7 puan)


    (c) Bölüm 3''teki gayrimenkuller bakımından kira ekspertiz karşılaştırmasını yapınız; yükümlülük doğanlar için süreyi
    ve yapılacak işlemleri belirtiniz. (6 puan)


    (d) Bölüm 4''teki yönetim kurulu kararını değerleme kuruluşu seçimine ilişkin esaslar bakımından değerlendiriniz; Sedir''in
    Ufuk''tan Sedir Plaza için en erken hangi tarihten itibaren yeniden hizmet alabileceğini ve aykırı işlemlerden kimin sorumlu
    olduğunu belirtiniz. (6 puan)

