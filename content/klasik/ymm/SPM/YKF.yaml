    4. Kurul''a faaliyet izni başvurusunda bulunmak ve izni almak

    5. Müşteri varlıklarını kendi malvarlığından ayrı tutmaya ilişkin düzenleme yapmak

    6. Belirlenmiş yönetim kadrosu ve uyum yetkilisi atamak


    **(b) Yatırım Danışmanlığı ve Müşterini Tanı İlkesi:**


    III-37.1 Tebliği md. 3 uyarınca yatırım danışmanlığı: Müşteriye kişisel koşulları gözetilerek sermaye piyasası araçlarına
