    Portföy Yönetimi (bireysel/kurumsal):

    - Müşteri, kendi varlıkları üzerinde işlem yapılmasına yetki verir.

    - Her müşterinin portföyü ayrı ayrı yönetilir.

    - Müşteri ile imzalanan portföy yönetim sözleşmesi temeldir.

    - Müşterinin risk profili ve tercihleri bireysel olarak dikkate alınır.


    Yatırım Fonu Yönetimi:

    - Çok sayıda yatırımcının varlıkları ortak fon bünyesinde bir arada değerlendirilir.

    - Fon içtüzüğü yatırım politikasını belirler; bireysel tercihler genel kurallarla sınırlıdır.

    - Net varlık değeri hesaplanır ve yatırımcılara duyurulur.


    **(b) Kurucu ve Yöneticinin Yükümlülükleri:**


    Kurucu Yükümlülükleri:

    - Fonu Kurul''a kayıt ettirmek ve içtüzüğe uygun işletmek

    - Yatırımcılara yanlış, yanıltıcı bilgi vermemek

    - Fonun tasfiyesinde yatırımcı haklarını korumak


    Yönetici Yükümlülükleri:

    - Portföyü içtüzük ve mevzuata uygun yönetmek

    - Portföy kararlarında yatırımcı çıkarını ön planda tutmak

    - Çıkar çatışmalarından kaçınmak veya yönetmek

    - Riskleri gözetmek ve belirlenen sınırlar içinde hareket etmek

    '
