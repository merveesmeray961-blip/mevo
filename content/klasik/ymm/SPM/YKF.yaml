    \ / 200.000.000 =\n%80,5 olup %80 kuralı korunur; satış bedeli fonda nakit olarak kaldığından fon toplam değeri değişmez.)\n\
    \n**(d) Saklayıcı, haciz ve hukuki nitelik**\n\n**Yatırım fonu**, tasarruf sahiplerinden katılma payı karşılığında toplanan\
