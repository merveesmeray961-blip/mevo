  soru: '**Senaryo:**

    XYZ Portföy Yönetimi A.Ş., SPK III-37.1 Tebliği kapsamında lisansı bulunan bir aracı kurum olan ABC Aracı Kurumu A.Ş.
    adına yatırım fonu kurma ve yönetme işlemlerini yürütmektedir. Fon, BİST 100 endeks fonudur.


    **(a)** Yatırım fonu kurucusu ve yöneticisinin ayrı tüzel kişiler olmasının hukuki anlamını ve her ikisinin sorumluluk
    alanlarını açıklayınız. (10 puan)


    **(b)** BİST 100 endeks fonunun portföy yönetim stratejisini ve III-52.1 Tebliği kapsamındaki yatırım kısıtlamalarından
    en az ikisini açıklayınız. (8 puan)


    **(c)** Yatırım fonu pay sahiplerinin temel haklarını belirtiniz. (7 puan)

    '
  cozum: '**(a) Kurucu ve Yönetici Ayrımı:**


    III-52.1 Tebliği uyarınca yatırım fonunda kurucu ve yönetici ayrı tüzel kişiler olabilir.


    Kurucu (ABC Aracı Kurumu):

    - Fonu Kurul''a kayıt ettirir

    - Fon içtüzüğünü hazırlar ve imzalar

    - Yatırımcılara karşı birincil muhatabı oluşturur

    - Fonun hukuki sorumluluğunu taşır


    Yönetici (XYZ Portföy Yönetimi):

    - Fon portföyünü fiilen yönetir

    - Portföy kararlarından ve performanstan sorumludur

    - SPK yetki belgesiyle (portföy yönetim şirketi) faaliyet gösterir


    Her ikisi de yatırımcılara karşı ayrı sorumluluk alanlarında hesap verebilir durumdadır.


    **(b) BİST 100 Endeks Fonu Stratejisi ve Kısıtlamalar:**


    Strateji: BİST 100 endeksinin bileşimini ve ağırlıklarını taklit ederek pasif yönetim uygulanır. Hedef, endeks getirisiyle
    paralel performans sağlamaktır.


    III-52.1 Tebliği kapsamındaki yatırım kısıtlamalarından en az ikisi:

    1. Tek bir ihraçcıya ait menkul kıymetler fon portföyünün belirli bir oranını aşamaz (örn. %10 sınırı).

    2. Portföyde belirli oran altında nakit ve benzeri varlık tutulması zorunlu olabilir.


    **(c) Yatırım Fonu Pay Sahibi Hakları:**


    - Fon payını herhangi bir gün alım veya satım hakkı (açık uçlu fonlarda likidite hakkı)

    - Net varlık değeri üzerinden geri alım talep etme hakkı

    - Fona ilişkin bilgilere (izahname, içtüzük, performans raporu) erişim hakkı

    - Yönetici ve kurucuya karşı zararın tazmini talep hakkı

    '
  puanlama:
