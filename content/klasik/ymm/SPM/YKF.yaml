    \ ihracı ve işlem platformu Kurul iznine tabidir.\n- Kripto varlık hizmet sağlayıcıları:\n  1. Müşteri varlıklarını kendi\
    \ varlıklarından ayrı tutmak\n  2. Kurul tarafından belirlenen asgari sermaye yükümlülüklerini karşılamak\n  3. Müşterilere\
    \ açık, anlaşılır bilgi sunmak\n  4. Siber güvenlik ve teknik altyapı standartlarını sağlamak\n- Yükümlülüklere aykırılık\
    \ halinde Kurul lisansı iptal edebilir veya idari yaptırım uygulayabilir.\n"
