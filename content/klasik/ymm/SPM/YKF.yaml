  sure_dk: 25
  soru: '**Senaryo:**

    MNO GYO A.Ş. ve PQR Yatırım Fonu karşılaştırıldığında her ikisi de gayrimenkul yatırımı yapmaktadır. Ancak hukuki yapıları
    birbirinden farklıdır.


    **(a)** Gayrimenkul yatırım ortaklığı (GYO) ile gayrimenkule dayalı yatırım fonu arasındaki temel hukuki ve yapısal farklılıkları
    açıklayınız. (10 puan)


    **(b)** SPK III-48.1 Tebliği kapsamında GYO''nun portföy sınırlamalarından en az ikisini ve GYO paylarının halka arz zorunluluğunu
    açıklayınız. (10 puan)

    '
  cozum: '**(a) GYO ve Gayrimenkule Dayalı Yatırım Fonu Farkları:**


    GYO (MNO GYO A.Ş.):

    - Anonim şirket şeklinde kurulur

    - Pay senetleri Borsada işlem görür (likidite borsa aracılığıyla sağlanır)

    - Tüzel kişiliğe sahip olup bağımsız bir sermaye piyasası kurumu

    - Pay sahipleri pay alım/satımıyla yatırımdan çıkabilir


    Gayrimenkule Dayalı Yatırım Fonu:

    - Tüzel kişiliği yoktur; müşterek mülkiyet esasına göre kurulur

    - Kurucu aracı kurum veya portföy yönetim şirketi tarafından yönetilir

    - Belirli koşullarda kapalı uçlu yapıda olabilir; likidite kısıtlı


    **(b) GYO Portföy Sınırlamaları ve Halka Arz:**


    III-48.1 Tebliği kapsamında portföy sınırlamaları:

    1. GYO portföyünün belirli bir oranı gayrimenkul ve gayrimenkule dayalı haklardan oluşmak zorundadır (asgari oran belirlenir).

    2. Belirli bir orandaki portföy tek bir projeye veya mülke tahsis edilemez (yoğunlaşma sınırı).


    Halka arz zorunluluğu:

    III-48.1 Tebliği uyarınca GYO''ların paylarını halka arz etmesi zorunludur. Bu zorunluluk GYO''nun kamuya şeffaflık sağlamasını
    ve Borsa işlem görme koşulunu yerine getirmesini amaçlar. Kuruluş onayından itibaren belirli süre içinde halka arz gerçekleştirilmek
    zorundadır.

    '
