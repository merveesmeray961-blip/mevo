  soru: 'Payları borsada işlem görmeyen Deniz Yatırım Menkul Değerler A.Ş. (Deniz) aracı kurumdur. Deniz''in sermayesinin
    %9''una sahip ortağı Banu, ortaklık payını borsa dışında %11''e çıkaracak bir pay edinimi planlamaktadır. Sermayenin %35''ine
    sahip ortağı Cem, payının %4''ünü satarak %31''e inmek istemektedir. Sermayenin %21''ine sahip ortağı Derya, 3 Haziran
    2026 Çarşamba günü gerçekleştirdiği edinimle payını %25''e çıkarmıştır. Deniz''in ortağı olmayan Emre''nin eşi Fulya,
    Deniz''in sermayesinin %7''sine sahiptir; Emre, borsa dışında Deniz''in sermayesinin %4''üne karşılık gelen payları edinmek
    istemektedir. Son olarak genel müdür Gül, 4 Mayıs 2026 Pazartesi günü görevinden ayrılmıştır. (Anılan dönemlerde resmî
    tatil bulunmadığı, hafta sonlarının iş günü olmadığı varsayılacaktır; yönetim imtiyazı veya intifa hakkı veren pay yoktur.)


    III-39.1 sayılı Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği hükümlerine göre:

    a) Banu''nun planladığı edinim için Kurul izni gerekip gerekmediğini nedeniyle birlikte açıklayınız.

    b) Cem''in planladığı satış için Kurul izni gerekip gerekmediğini nedeniyle birlikte açıklayınız. Cem izin almadan payı
    devrederse devrin pay defteri bakımından sonucu nedir?

    c) Derya''nın edinimi için izin mi bildirim mi gerektiğini ve bildirim gerekiyorsa en geç hangi tarihte yapılması gerektiğini
    belirtiniz.

    d) Emre''nin planladığı edinim için Kurul izni gerekip gerekmediğini, Fulya''nın paylarının nasıl değerlendirileceğini
    açıklayarak belirtiniz.

    e) Gül ve Deniz''in görevden ayrılma nedenlerine ilişkin bildirim yükümlülüğünü (kime, hangi süre içinde, en geç hangi
    tarihte) belirtiniz.'
  cozum: 'a) Banu zaten ortaktır; ancak md. 34/1''e göre bir ortağa ait payların sermayenin %10''unu aşması sonucunu veren
    pay edinimleri Kurulun iznine tabidir. %9''dan %11''e çıkış %10 eşiğini aştığından Kurul izni gerekir.


    b) Md. 34/1 uyarınca bir ortağa ait payların %10, %20, %33 veya %50 oranlarının altına düşmesi sonucunu veren pay devirleri
    de Kurulun iznine tabidir. Cem %35''ten %31''e inerek %33 eşiğinin altına düşeceğinden Kurul izni gerekir. Md. 34/6''ya
    göre bu maddeye aykırı gerçekleştirilen devirler pay defterine kaydolunmaz ve aykırı olarak yapılan kayıtlar hükümsüzdür.


    c) Derya %21''den %25''e çıkmıştır; %20 ile %33 eşikleri arasında kaldığından eşik aşılmamıştır. Md. 34/4 uyarınca devri
    izleyen 10 iş günü içinde Kurula bildirim yapılır. 3 Haziran 2026 Çarşamba''dan sonraki 10. iş günü: 4-5 Haziran (2),
    8-12 Haziran (7), 15-17 Haziran (10) olduğundan son gün 17 Haziran 2026''dır.


    d) Md. 36/1-a uyarınca bir gerçek kişiyle eşine ait paylar bir kişiye ait addolunur. Emre''nin edineceği %4, eşi Fulya''nın
    %7''siyle birlikte değerlendirilince %11 eder; %10 eşiği aşıldığından md. 34/1 gereği Kurul izni gerekir.


    e) Md. 14/5 uyarınca görevden ayrılan genel müdürün ayrılma nedenleri, ilgili aracı kurum (Deniz) ve görevden ayrılan
    personel (Gül) tarafından 3 iş günü içinde Kurula ve Birliğe bildirilir. 4 Mayıs 2026 Pazartesi''den sonraki 3. iş günü
