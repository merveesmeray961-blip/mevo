- id: YMM-SPM-YKF-K001
  sinav: ymm
  ders: SPM
  konu: YKF
  kazanimlar:
  - yatırım fonları
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Atlas Portföy Yönetimi A.Ş., hem kurucusu hem yöneticisi olduğu iki fonu yönetmektedir: **(X) Değişken Fon** ve **(Y)
    Hisse Senedi Fonu**. Fonların hiçbiri serbest fon, katılım fonu, fon sepeti fonu veya garantili/koruma amaçlı fon değildir.


    30.09.2026 itibarıyla (X) fonunun toplam değeri **400.000.000 TL** olup portföyü aşağıdaki gibidir:


    | Varlık | Tutar (TL) |

    |---|---|

    | Başka bir kurucunun (Z) Para Piyasası Fonu katılma payları (izahnamesi Kurulca onaylı) | 36.000.000 |

    | Yabancı borsada işlem gören tek bir borsa yatırım fonunun katılma payları | 30.000.000 |

    | Türkiye''de kurulu tek bir borsa yatırım fonunun (T BYF) katılma payları | 60.000.000 |

    | Aracı kurum varantları ve sertifikalar (toplam) | 44.000.000 |

    | — bunun Kappa Yatırım Menkul Değerler A.Ş. tarafından ihraç edilen kısmı | 24.000.000 |

    | Hazine ve Maliye Bakanlığınca ihraç edilmiş tek bir devlet iç borçlanma senedi (aynı ihraç) | 150.000.000 |

    | Diğer varlıklar (paylar, ters repo vb.; sınırlara uygun) | 80.000.000 |

    | **Toplam** | **400.000.000** |


    Ayrıca (X) fonu Lima A.Ş.''nin sermayesinin ve oy haklarının **%8**''ine, (Y) fonu ise **%14**''üne sahiptir.


    **İstenenler** (III-52.1 sayılı Yatırım Fonlarına İlişkin Esaslar Tebliği''ne göre):


    (a) Kolektif yatırım kuruluşu paylarına ilişkin sınırlamalar bakımından (X) fonunun durumunu değerlendiriniz. (7 puan)


    (b) Varant ve sertifikalara ilişkin sınırlamalara uyumu değerlendiriniz; aşım varsa tutarını hesaplayınız. (6 puan)


    (c) Devlet iç borçlanma senedi yatırımının durumunu değerlendiriniz; aşım varsa tutarını hesaplayınız. (6 puan)


    (d) Lima A.Ş.''deki pay sahipliğini, fon bazında ve aynı yöneticinin yönettiği aynı kurucuya ait fonlar bazında değerlendiriniz.
    (6 puan)'
  cozum: '**(a) Kolektif yatırım kuruluşu payları (md. 18)**


    - Genel sınır: fon payları, MKYO payları, yabancı BYF ve yabancı fon payları toplamı fon toplam değerinin en fazla %20''si:
    400.000.000 × %20 = **80.000.000 TL**.

    - Bu sınıra girenler: (Z) fonu 36.000.000 + yabancı BYF 30.000.000 = **66.000.000 TL** → sınır içinde.

    - Türkiye''de kurulu BYF payları %20''lik genel sınıra dahil edilmez (md. 18/1, ikinci cümle).

    - Tek fon sınırları: tek bir yatırım fonu / yabancı BYF için %10 = 40.000.000 TL → (Z) 36.000.000 ve yabancı BYF 30.000.000
    uygun. Türkiye''de kurulu tek bir BYF için %20 = 80.000.000 TL → T BYF 60.000.000 uygun.

    - Sonuç: md. 18 bakımından **aykırılık yoktur**. (Z) fonunun izahnamesi Kurulca onaylı olduğundan md. 18/2 şartı da sağlanmıştır.


    **(b) Varant ve sertifikalar (md. 17/4)**


    - Toplam sınır: %10 → 40.000.000 TL; mevcut 44.000.000 → **4.000.000 TL aşım**.

    - Tek ihraççı sınırı: %5 → 20.000.000 TL; Kappa 24.000.000 → **4.000.000 TL aşım**.

    - Not: Kappa''ya ait 4.000.000 TL''lik azaltım, toplam sınırdaki aşımı da giderir (44 − 4 = 40).


    **(c) Devlet iç borçlanma senedi (md. 17/1-d)**


    - Hazine ve Maliye Bakanlığınca ihraç edilen araçlara md. 17/1''deki ihraççı sınırlamaları (%10, %5–%40, grup %20) uygulanmaz.

    - Ancak bu kapsamda **tek bir varlığa** yapılan yatırım fon toplam değerinin %35''ini aşamaz: 400.000.000 × %35 = 140.000.000
    TL.

    - Mevcut 150.000.000 TL → **10.000.000 TL aşım**.


    **(d) Lima A.Ş. pay sahipliği (md. 17/2)**


    - Fon tek başına bir ihraççının sermayesinin veya oy haklarının en fazla %10''una sahip olabilir: (X) %8 → uygun; (Y)
    %14 → **aykırı** (4 puanlık aşım).

    - Aynı yöneticinin yönetimindeki tek bir kurucuya ait fonlar toplu olarak en fazla %20''ye sahip olabilir: %8 + %14 =
    %22 → **2 puan aşım**.

    - (X) fonu tek başına sınır içindedir; ancak toplu sınır aşıldığından Atlas''ın fonlarının toplam payını %20''ye indirmesi
    gerekir. (Y)''nin payını %10''a indirmesi her iki sınırı birlikte sağlar (%8 + %10 = %18).'
  puanlama:
  - olcut: (a) %20 genel sınırın 80 milyon TL olarak hesaplanması ve kapsamdaki payların (66 milyon TL) doğru belirlenmesi
    puan: 3
  - olcut: (a) Türkiye'de kurulu BYF'nin genel sınıra dahil edilmemesi ve tek fon sınırlarının (%10 / %20) kontrolü
    puan: 4
  - olcut: (b) %10 toplam sınır ve 4 milyon TL aşım
    puan: 3
  - olcut: (b) %5 tek ihraççı sınırı ve Kappa için 4 milyon TL aşım
    puan: 3
  - olcut: (c) Hazine araçlarına genel sınırların uygulanmadığının belirtilmesi
    puan: 2
  - olcut: (c) Tek varlık %35 sınırı (140 milyon TL) ve 10 milyon TL aşım
    puan: 4
  - olcut: '(d) Fon bazında %10 sınırı: (X) uygun, (Y) aykırı'
    puan: 3
  - olcut: (d) Aynı yönetici/kurucu fonları için toplu %20 sınırı ve %22 ile aşım
    puan: 3
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 17/1-(d), 17/2, 17/4
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 18/1, 18/2
  gecerlilik:
    baslangic: '2020-03-04'
    bitis: null
  dogrulama:
    python: 'ftd = 400_000_000

      kyk_sinir = ftd * 20 // 100

      kyk = 36_000_000 + 30_000_000

      varant_asim = 44_000_000 - ftd * 10 // 100

      kappa_asim = 24_000_000 - ftd * 5 // 100

      dibs_asim = 150_000_000 - ftd * 35 // 100

      toplu = 8 + 14

      sonuc = {''kyk_sinir'': kyk_sinir, ''kyk'': kyk, ''varant_asim'': varant_asim, ''kappa_asim'': kappa_asim, ''dibs_asim'':
      dibs_asim, ''lima_toplu_oran'': toplu}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi SPM-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 4, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_SPM-2.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-SPM-YKF-K002
  sinav: ymm
