  cozum: '**(a) Borçlanma sınırı (md. 31/1)**


    - Ortaklıklar, hesap dönemi sonunda hazırlayıp kamuya açıkladıkları **konsolide olmayan (bireysel)** finansal tablolarındaki
    öz sermayelerinin **beş katı** kadar kredi kullanabilir. Dolayısıyla konsolide öz sermaye (900.000.000 TL) dikkate alınmaz:
    640.000.000 × 5 = **3.200.000.000 TL**.

    - Sınırın hesabında kredilere ek olarak finansal kiralama borçları ve gayri nakdi krediler de dikkate alınır:


    | Kalem | Tutar (TL) | Dikkate alınır mı? |

    |---|---|---|

    | Banka kredileri | 1.900.000.000 | Evet |

    | Finansal kiralama borçları | 350.000.000 | Evet (md. 31/1 son cümle) |

    | Gayri nakdi krediler | 420.000.000 | Evet (md. 31/1 son cümle) |

    | Müteahhitlere ticari borç | 300.000.000 | Hayır (kredi değildir) |

    | **Toplam** | **2.670.000.000** | |


    - Kalan kapasite: 3.200.000.000 - 2.670.000.000 = **530.000.000 TL**. Planlanan 600.000.000 TL''lik kredi sınırı **70.000.000
    TL** aşar; azami **530.000.000 TL** kredi kullanılabilir.

    - (Ayrıca md. 31/2 uyarınca Sedir borçlanma aracı ihraç edecekse, ihraç limitinden bu krediler düşülür.)


    **(b) Ekspertiz değerine göre işlemler (md. 37/1)**


    Alımlarda ekspertiz değerinden **daha yüksek**, satım ve kiralama işlemlerinde ekspertiz değerinin **%95''inden daha düşük**
    değer esas alınırsa durum Kurulun özel durumların kamuya açıklanmasına ilişkin düzenlemeleri çerçevesinde kamuya açıklanır
    ve yapılacak ilk genel kurul toplantısının gündemine alınarak ortaklara bilgi verilir.


    | No | Oran / karşılaştırma | Sonuç |

    |---|---|---|

    | 1 Ofis alımı | 124.000.000 > 120.000.000 (ekspertizden yüksek) | **Açıklama ve genel kurulda bilgi verme gerekir** |

    | 2 Depo satışı | 76.000.000 / 80.000.000 = %95; eşik 76.000.000 (daha düşük olması gerekir) | Gerekmez (tam %95, "daha
    düşük" değil) |

    | 3 Arsa alımı | 60.000.000 = 60.000.000 (daha yüksek değil) | Gerekmez |

    | 4 Konut satışı | 46.000.000 / 50.000.000 = %92 < %95 | **Gerekir** |

    | 5 Mağaza kiraya verilmesi | 470.000 / 500.000 = %94 < %95 (kiralama işlemi de kapsamdadır) | **Gerekir** |


    **(c) Kira ekspertiz karşılaştırması (md. 37/2)**


    Kısmi/değişken doluluğa sahip gayrimenkullerde elde edilen kira, gayrimenkulün toplam kiralanabilir alanının yıl içindeki
    **ortalama doluluk oranına göre düzeltilmiş** ekspertiz kira bedeli ile karşılaştırılır:


    | Gayrimenkul | Düzeltilmiş ekspertiz kirası | Elde edilen kira | Sonuç |

    |---|---|---|---|

    | Sedir Plaza | 48.000.000 × %75 = 36.000.000 | 34.200.000 | Ekspertiz kirasının **altında** (1.800.000 TL eksik): yükümlülük
    doğar |

    | Sedir İş Merkezi | 18.000.000 × %90 = 16.200.000 | 16.500.000 | Altında değil: yükümlülük yok |


    Sedir Plaza için bilgiler, hesap dönemini (31.12.2025) izleyen birinci ayın sonuna kadar, yani **31 Ocak 2026**''ya kadar
    Kurulun özel durumların kamuya açıklanmasına ilişkin düzenlemeleri çerçevesinde kamuya açıklanır ve yapılacak ilk genel
    kurul toplantısının gündemine alınarak pay sahiplerine bilgi verilir.


    **(d) Değerleme kuruluşu seçimi (md. 35)**


    Üç aykırılık vardır:

    1. **Süre:** Değerleme kuruluşlarını belirleyen yönetim kurulu kararı hesap döneminin bitimini takip eden bir ay içinde
    (31 Aralık 2025 dönem sonu için en geç **31 Ocak 2026**) alınmalıdır; karar 12 Şubat 2026''da alındığından süre geçmiştir
    (md. 35/2).

    2. **Sayı:** Portföye o yıl alınabilecek ve değerleme gerektirecek varlıklar için en fazla **iki** değerleme kuruluşu
    belirlenebilir; üç kuruluş belirlenmesi aykırıdır (md. 35/2).

    3. **Üç yıl kuralı:** Her bir varlık için aynı kuruluştan üst üste en fazla **üç yıl** hizmet alınabilir. Ufuk''tan 2023,
    2024 ve 2025''te hizmet alındığından 2026 için yeniden seçilemez (md. 35/3).


    Üç yıllık sürenin dolmasından sonra aynı kuruluştan tekrar hizmet alınabilmesi için en az **iki yılın** geçmesi gerekir:
    hizmet 31.12.2025''te sona erdiğinden iki yıl 31.12.2027''de dolar; Sedir en erken **1 Ocak 2028**''den itibaren Ufuk''tan
    Sedir Plaza için yeniden hizmet alabilir.


    Bu maddeye aykırı işlemlerden **ortaklık yönetim kurulu veya yönetim kurulunca yetkilendirilmiş olması halinde ilgili
    murahhas üye** sorumludur (md. 35/6).

    '
