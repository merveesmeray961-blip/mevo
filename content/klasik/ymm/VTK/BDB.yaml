    birleşmiştir. Upsilon A.Ş.''nin son 5 yıla ait beyanname ile beyan edilmiş geçmiş yıl zararı 3.000.000 TL''dir. Birleşme
    sonrası kurumun 2025 yılı kurumlar vergisi matrahı 2.500.000 TL''dir.


    **(a)** Nev''i değişikliğinin KVK md.19/1 kapsamındaki vergisel sonuçlarını açıklayınız.


    **(b)** Upsilon A.Ş.''nin geçmiş yıl zararlarından 2025 yılında ne kadar mahsup yapılabilir?


    **(c)** Kalan zarar için 2026 yılında mahsup yapılabilir mi?

