    - Beş yılı aşmamış: Koşul sağlanmış (son 5 yılın beyannameleri mevcut).

    - Mahsup sınırı: 2025 yılı matrahını (2.500.000 TL) aşamaz.

    - Mahsup tutarı = **2.500.000 TL** (matrahın tamamı)


    **(c) Kalan Zarar (500.000 TL) 2026 Yılı:**


    Kalan 500.000 TL, 5 yıl içinde mahsup hakkı kapsamında 2026 yılına devredilebilir ve 2026 matrahından düşülebilir (yeterli
    matrah varsa).

