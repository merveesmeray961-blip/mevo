    bitis: null
  dogrulama:
    python: 'tasfiye_sonu_servet = 5_000_000

      tasfiye_basi_oz_sermaye = 3_500_000

      tasfiye_kari = tasfiye_sonu_servet - tasfiye_basi_oz_sermaye

      kv_orani = 0.25

      kv = tasfiye_kari * kv_orani

      sonuc = {"tasfiye_kari": tasfiye_kari, "kurumlar_vergisi": kv}

      '
