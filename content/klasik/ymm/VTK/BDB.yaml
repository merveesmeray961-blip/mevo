- id: YMM-VTK-BDB-K001
  sinav: ymm
  ders: VTK
  konu: BDB
  kazanimlar:
  - KVK md.18-20 devir ve bölünme şartları
  - devralınan zararların mahsubu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Hesap dönemleri takvim yılı olan tam mükellef **Altın Gıda A.Ş.** ile **Gümüş Gıda Ltd. Şti.**nin kanuni
    merkezleri Türkiye''dedir. Gümüş Gıda Ltd. Şti., bilanço değerleri bir bütün hâlinde devralınıp aynen Altın Gıda A.Ş.nin
    bilançosuna geçirilmek suretiyle Altın Gıda A.Ş.ye devrolmuştur.


    - Devre ilişkin kararların ticaret siciline tescil tarihi: **15.6.2026**

    - Birleşmenin Türkiye Ticaret Sicili Gazetesinde ilan tarihi: **22.6.2026**

    - Gümüş Gıda''nın 2025 kurumlar vergisi beyannamesi Nisan 2026''da süresinde verilmiştir.

    - Gümüş Gıda''nın 1.1.2026 – 15.6.2026 dönemi ticari kazancı (indirimlerden önce, KKEG ve istisna yok): **250.000 TL**

    - Gümüş Gıda''nın beyannamelerinde yer alan ve hiç mahsup edilmemiş zararları: 2020: **300.000 TL**; 2022: **700.000 TL**;
    2024: **600.000 TL**. Gümüş Gıda kendi beyannamesinde zararlarını en eski yıldan başlayarak mahsup etmektedir.

    - Gümüş Gıda''nın devir tarihi itibarıyla VUK''a göre öz sermayesi: **1.000.000 TL**

    - Gümüş Gıda''nın son beş yıla ait beyannameleri kanuni sürelerinde verilmiştir.

    - Altın Gıda''nın 2026 hesap dönemi kurum kazancı (devir sonrası Gümüş faaliyetleri dahil, zarar mahsubundan önce): **3.000.000
    TL**; kendi 2025 yılı zararı: **200.000 TL**.


    Kurumlar vergisi oranı %25''tir; asgari kurumlar vergisi ve diğer indirim/istisnalar dikkate alınmayacaktır.


    **İstenenler:**


    (a) İşlemin KVK bakımından devir sayılmasının şartlarını ve vergisel sonucunu belirtiniz; verilecek beyanname(ler)i, verilme
    süresini, imza ve bağlı belge yükümlülüklerini açıklayınız. (7 puan)


    (b) Gümüş Gıda''nın kıst dönem kurumlar vergisi matrahını ve Altın Gıda''nın devralabileceği zarar tutarını hesaplayınız;
    iptal olan zararları gerekçeleriyle gösteriniz. (7 puan)


    (c) Altın Gıda A.Ş.nin 2026 kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; devralınan zararların
    hangi yıllara ait olarak gösterileceğine ilişkin kuralı açıklayınız. (6 puan)


    (d) Altın Gıda A.Ş.nin, devraldığı Gümüş Gıda faaliyetini 2028 yılında sona erdirdiğini varsayınız. Bunun sonuçlarını
    ve doğacak vergi farkını açıklayınız. (5 puan)

    '
  cozum: '**(a) Devir şartları, sonucu ve beyan**


    - Şartlar (KVK md. 19/1): (i) infisah eden kurum ile birleşilen kurumun kanuni veya iş merkezlerinin Türkiye''de bulunması;
    (ii) münfesih kurumun devir tarihindeki bilanço değerlerinin birleşilen kurum tarafından bir bütün hâlinde devralınıp
    aynen bilançosuna geçirilmesi. Her ikisi de sağlanmıştır.

    - Sonuç (md. 20/1): münfesih kurumun yalnız devir tarihine kadar elde ettiği kazançlar vergilendirilir; **birleşmeden
    doğan kârlar hesaplanmaz ve vergilendirilmez**.

    - Devir tarihi, tescil tarihi olan **15.6.2026**''dır. Devir Haziran''da gerçekleştiğinden (Aralık–Nisan aralığında değil)
    yalnız **1.1.2026 – 15.6.2026 kıst dönem beyannamesi** verilir; 2025 beyannamesi zaten verilmiştir.

    - Süre: TTSG ilan tarihinden (22.6.2026) itibaren **otuz gün içinde, 22.7.2026''ya kadar**.

    - Beyanname, münfesih kurum ile birleşilen kurum tarafından **müştereken imzalanır** ve **Gümüş Gıda''nın bağlı olduğu
    vergi dairesine** verilir.

    - Altın Gıda, münfesih kurumun tahakkuk etmiş ve edecek vergi borçlarını ödeyeceğini ve diğer ödevlerini yerine getireceğini
    beyanname ekindeki **taahhütname** ile taahhüt eder; mahallin en büyük mal memuru ayrıca teminat isteyebilir (md. 20/1-b).
    Tebliğe göre devre ilişkin bilanço ve gelir tablosu da eklenir.


    **(b) Kıst dönem matrahı ve devralınabilir zarar**


    - 2020 zararı beş yıllık nakil süresini (2021–2025) doldurmuştur; 2026''da kullanılamaz (md. 9/1-a).

    - Kıst dönemde Gümüş Gıda kendi zararlarından 2022 zararının 250.000 TL''sini mahsup eder → **kıst dönem matrahı 0**,
    kurumlar vergisi 0.

    - Kalan zararlar: 2022: 450.000 TL; 2024: 600.000 TL → toplam 1.050.000 TL.

    - Devralan kurum, devralınan kurumun devir tarihi itibarıyla öz sermayesini geçmeyen zararları indirebilir: **devralınabilir
    zarar = 1.000.000 TL**; öz sermaye sınırını aşan **50.000 TL iptal** olur. 2020 zararı (300.000 TL) ise süre aşımıyla
    zaten kullanılamaz.

    - Mahsup için son beş yıl beyannamelerinin süresinde verilmiş olması ve devralınan faaliyete en az beş yıl devam edilmesi
    şartları da aranır (md. 9/1-a-1, 2).


    **(c) Altın Gıda''nın 2026 matrahı**


    | Kalem | TL |

    |---|---|

    | Kurum kazancı | 3.000.000 |

    | Kendi 2025 zararı | (200.000) |

    | Devralınan zararlar | (1.000.000) |

    | **Matrah** | **1.800.000** |

    | **Kurumlar vergisi (%25)** | **450.000** |


    - Zararlar beyannamede her yıla ilişkin tutarlar ayrı ayrı gösterilerek indirilir (md. 9/1). Devralınan zararlar, devreden
    kurumda doğduğu dönemden itibaren beş yıl içinde mahsup edilebilir; mahsup edilecek zararların hangi döneme ait olduğu,
    beyanname ekinde bildirilmek şartıyla mükellefçe serbestçe belirlenebilir (Tebliğ 9.2.3). Örneğin 2022''den 450.000 TL
    ve 2024''ten 550.000 TL; 2022 zararının son mahsup yılı 2027 olduğundan önce eski yıl zararının kullanılması yerinde olur.


    **(d) Faaliyete devam şartının ihlali**


    - Devralınan kurumun faaliyetine, devrin meydana geldiği hesap döneminden itibaren **en az beş yıl** (2026–2030) devam
    edilmesi şarttır. Faaliyetin 2028''de sona erdirilmesi şartı ihlal eder.

    - Bu durumda devralınan zararların mahsubu hakkı ortadan kalkar; 2026 beyanı düzeltilir ve zarar mahsubu nedeniyle zamanında
    tahakkuk ettirilmeyen vergiler için **vergi ziyaı doğmuş sayılır** (md. 9/1-a son paragraf).

    - Vergi farkı: 1.000.000 × %25 = **250.000 TL** (ayrıca vergi ziyaı cezası ve gecikme faizi).

    '
  puanlama:
  - olcut: Devir şartlarının (Türkiye'de merkez; bilanço değerlerinin bütün hâlinde devralınıp aynen geçirilmesi) sayılması
      ve birleşme kârının vergilendirilmemesi
    puan: 2
  - olcut: Devir tarihinin tescil tarihi olduğu, yalnız kıst dönem beyannamesinin verileceği (2025'in kapsam dışı kalma gerekçesiyle)
    puan: 2
  - olcut: Süre (ilandan itibaren 30 gün, 22.7.2026), müşterek imza, münfesih kurumun vergi dairesi, taahhütname/teminat
