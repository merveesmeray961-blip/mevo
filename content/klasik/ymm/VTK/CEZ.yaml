    içindedir. Artırım %50 = 60.000 x %50 = 30.000 TL''dir; ancak artırım tutarı kesinleşen cezadan (20.000 TL) fazla olamaz.
    Artırım **20.000 TL**; kesilecek ceza = 60.000 + 20.000 = **80.000 TL**.


    **(d)** Usulsüzlükte süre, kesinleşme tarihini (6/3/2024) izleyen günden itibaren ikinci yılın isabet ettiği takvim yılının
    sonuna kadardır: ikinci yıl 2026 yılına isabet eder, süre **31/12/2026''da** biter.


