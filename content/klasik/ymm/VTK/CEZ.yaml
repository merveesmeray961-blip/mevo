- id: YMM-VTK-CEZ-K003
  sinav: ymm
  ders: VTK
  konu: CEZ
  kazanimlar:
  - pişmanlık ve ıslah
  - uzlaşma ve izaha davet
  - ceza indirimi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Olay:** **Kaya İnşaat Ltd. Şti.** 2025 yılı kurumlar vergisi beyannamesini süresinde (30.04.2026) vermiş ve\ntahakkuk\
    \ eden vergiyi aynı gün ödemiştir. Şirket, kanunen kabul edilmeyen 800.000 TL gideri matraha eklemediğini\nsonradan fark\
    \ etmiştir; eksik beyan edilen kurumlar vergisi 800.000 × %25 = 200.000 TL'dir. Konu hakkında herhangi\nbir ihbar yoktur.\
    \ Gecikme zammı oranı aylık %3,7'dir. Aşağıdaki üç senaryo birbirinden bağımsızdır; gecikme faizi\nhesaplanmayacaktır.\n\
    \n- **Senaryo A:** Şirket 14.09.2026'da pişmanlık dilekçesi vermiş, 20.09.2026'da düzeltme beyannamesi vermiş ve\n  25.09.2026'da\
    \ vergiyi pişmanlık zammıyla birlikte ödemiştir.\n- **Senaryo B:** Şirket herhangi bir başvuruda bulunmadan önce, vergi\
    \ dairesi verginin ziyaa uğradığına dair ön\n  tespit nedeniyle 01.09.2026'da izaha davet yazısı tebliğ etmiştir. Şirket\
    \ 20.09.2026'da izahta bulunmuş, izahın\n  yetersiz bulunduğuna ilişkin yazı 12.10.2026'da tebliğ edilmiştir. Şirket 05.11.2026'da\
    \ düzeltme beyannamesi vermiş\n  ve vergiyi zammıyla ödemiştir.\n- **Senaryo C:** Şirket hiçbir işlem yapmamış; inceleme\
    \ sonucu düzenlenen 200.000 TL vergi ve 200.000 TL vergi ziyaı\n  cezası içeren ihbarname 15.12.2026'da tebliğ edilmiştir.\n\
    \n**İstenenler:**\n\n(a) Senaryo A'da pişmanlık şartlarının gerçekleşip gerçekleşmediğini değerlendiriniz; ödenecek pişmanlık\
    \ zammını\nve cezayı hesaplayınız. (8 puan)\n\n(b) Senaryo B'de sürelere uyulup uyulmadığını değerlendiriniz; kesilecek\
    \ cezayı ve ödenecek zammı hesaplayınız;\nşirketin bu aşamada pişmanlıktan yararlanıp yararlanamayacağını belirtiniz.\
    \ (7 puan)\n\n(c) Senaryo C'de şirketin ceza indirimi ve uzlaşma imkânlarını, sürelerini ve ilişkisini açıklayarak ceza\
    \ indirimi\nhâlinde ödenecek toplam tutarı hesaplayınız. (7 puan)\n\n(d) Senaryo C'de ceza indirimiyle ödenen tutarların\
    \ yevmiye kaydını yapınız ve kurumlar vergisi matrahına etkisini\naçıklayınız. (3 puan)\n"
  cozum: "**(a) Pişmanlık ve ıslah (VUK md. 371)**\n\n- Şartlar: ihbar bulunmaması; dilekçenin olayın ilgili olduğu vergi\
    \ türüne ilişkin incelemeye başlanmadan ve takdire\n  sevkten önce verilmesi; eksik beyanın dilekçe tarihinden itibaren\
    \ **15 gün** içinde (en geç 29.09.2026)\n  düzeltilmesi; verginin aynı sürede, ödemenin geciktiği **her ay ve kesri için**\
    \ gecikme zammı oranında zamla\n  ödenmesi. 20.09 düzeltme ve 25.09 ödeme süresindedir → şartlar gerçekleşmiştir.\n- Gecikme:\
    \ 30.04.2026 vadeden 25.09.2026'ya 4 ay 26 gün → ay kesri tam ay sayılır → **5 ay**.\n- Pişmanlık zammı: 200.000 × %3,7\
    \ × 5 = **37.000 TL**. Vergi ziyaı cezası **kesilmez**.\n\n**(b) İzaha davet (VUK md. 370/a)**\n\n- Davet tebliğinden\
    \ itibaren 30 gün içinde izah gerekir (01.09 → 01.10.2026); 20.09 izahı süresindedir. İzah yetersiz\n  bulunduğundan değerlendirme\
