    (b) 2 numaralı olayda kesilecek cezayı hesaplayınız ve (a) şıkkından farkını gerekçelendiriniz. (6 puan)


    (c) 1 numaralı olayda bulunan vergi ziyaı cezasına, 3 numaralı olaydaki daha önce kesinleşen ceza dikkate alınarak tekerrür
    hükmünün nasıl uygulanacağını hesaplayınız. (7 puan)


    (d) 4 numaralı olaydaki cezaya göre, şirkete 20/12/2026''da ve 15/1/2027''de 17.000 TL tutarında yeni bir II. derece usulsüzlük
    cezası kesilmesi hâlinde tekerrür hükmünün sonucunu ayrı ayrı bulunuz. (5 puan)

