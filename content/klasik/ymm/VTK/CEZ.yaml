  soru: '(W) A.Ş.''nin 2025 hesap dönemine ilişkin yapılan vergi incelemesinde, şirketin fiilî bir mal alımına dayanmayan
    sahte faturaları kayıtlarına aldığı ve bu faturalar nedeniyle gider yazdığı tespit edilmiştir. Bu faturalar nedeniyle:


    - Kurumlar vergisi matrahı 5.000.000 TL eksik beyan edilmiştir (kurumlar vergisi oranı %25),

    - Haksız yere indirilen KDV tutarı 900.000 TL''dir.


    Sahte faturaların kullanılmasına şirketin mali müşaviri (M) iştirak etmiştir. Şirket, vergi inceleme raporu düzenlenmeden
    önce herhangi bir pişmanlık dilekçesi vermemiştir. Tarh edilen vergiler için yeterli süre içinde cezalar kesilmiş, vergi
    ve ceza ihbarnameleri 2026 yılında tebliğ edilmiştir. Gecikme faizi ve gecikme zammı dikkate alınmayacaktır; vergi alacaklarının
    2025 takvim yılında doğduğu varsayılacaktır.


    **İstenenler:**


    (a) (W) A.Ş. ve (M) adına kesilecek vergi ziyaı cezalarını md. 344''e göre ayrı ayrı hesaplayınız. (7 puan)


    (b) Sahte belge kullanımının VUK md. 359 uyarınca nasıl bir yaptırıma bağlandığını (hapis cezası süresi dâhil) ve vergi
    ziyaı cezası ile ilişkisini açıklayınız. (6 puan)


    (c) Tarh edilen verginin ve (W) A.Ş. adına kesilen vergi ziyaı cezasının yarısının soruşturma evresinde ödenmesi hâlinde
    md. 359''daki hapis cezasına ilişkin indirim oranını, kovuşturma evresinde ödenmesi hâlinde uygulanacak oranı ve soruşturma
    evresinde ödenmesi gereken tutarı hesaplayınız. (7 puan)


    (d) Bu vergi ziyaı cezalarının kesilebileceği son tarihi (ceza kesme zamanaşımı) md. 374''e göre bulunuz. (5 puan)

    '
  cozum: '**(a) Vergi ziyaı cezası (md. 344)**


    - Ziyaa uğratılan kurumlar vergisi = 5.000.000 x %25 = **1.250.000 TL**.

    - Ziyaa uğratılan KDV = **900.000 TL**; toplam ziyaa uğratılan vergi = 1.250.000 + 900.000 = **2.150.000 TL**.

    - Sahte belge kullanımı md. 359 kapsamında olduğundan md. 344/2 gereği ceza **üç kat** uygulanır: (W) A.Ş. için 2.150.000
    x 3 = **6.450.000 TL**.

    - Fiile iştirak eden (M) için ceza **bir kat**: 2.150.000 x 1 = **2.150.000 TL**.


    **(b) Md. 359**


    - Gerçek bir muamele veya durum olmadığı halde bunlar varmış gibi düzenlenen belge sahte belgedir; sahte belgeyi kullananlar
    md. 359/b uyarınca **üç yıldan sekiz yıla kadar hapis** cezasıyla cezalandırılır.

    - Md. 359''a göre hapis cezasına hükmedilmesi, vergi ziyaı cezasının ayrıca uygulanmasına engel değildir; (W) için hem
    vergi ziyaı cezası hem de ilgili kişiler hakkında hapis cezası gündeme gelir.


    **(c) Ödeme indirimi (md. 359 son fıkralar)**


    - Tarh edilen verginin, gecikme faizi ve gecikme zammının tamamı ile kesilen cezaların yarısı ve buna isabet eden gecikme
    zammı **soruşturma evresinde** ödenirse verilecek ceza **yarı oranında**, **kovuşturma evresinde** hüküm verilinceye kadar
    ödenirse **üçte bir oranında** indirilir.

    - Soruşturma evresinde ödenecek tutar (faiz ve zam hariç): vergi 2.150.000 + vergi ziyaı cezasının yarısı (6.450.000 /
    2 = 3.225.000) = **5.375.000 TL**.


    **(d) Ceza kesme zamanaşımı (md. 374/1)**


    - Vergi ziyaı cezasında süre, cezanın bağlı olduğu vergi alacağının doğduğu takvim yılını (2025) takip eden yılın (2026)
    birinci gününden başlayarak **beş yıldır**.

    - Süre 1.1.2026''da başlar ve **31.12.2030''da** sona erer; ceza ihbarnamesinin bu süre içinde tebliği zamanaşımını keser.
    İhbarnameler 2026''da tebliğ edildiğinden zamanaşımı dolmamıştır.

    '
