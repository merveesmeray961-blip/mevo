    ziyaı hem de usulsüzlük (35.000 TL) doğmuştur; md. 336/1''e göre bunlardan yalnızca miktar itibarıyla en ağırı kesilir.


    | Ceza | Tutar |

    |---|---|

    | Vergi ziyaı cezası (%50) | 60.000 |

    | I. derece usulsüzlük cezası | 35.000 |

    | **Kesilecek (en ağırı)** | **60.000** |


    **(b)** Vergi ziyaı cezası = 50.000 x %50 = 25.000 TL; usulsüzlük cezası 35.000 TL. Usulsüzlük cezası daha ağır olduğundan
    md. 336/1 uyarınca **yalnızca 35.000 TL usulsüzlük cezası** kesilir, vergi ziyaı cezası kesilmez. Fark: (a)''da vergi
    ziyaı cezası, (b)''de usulsüzlük cezası daha ağır olduğu için kesilir.


    **(c)** Vergi ziyaı cezasında tekerrür süresi, cezanın kesinleştiği tarihi izleyen günden itibaren beşinci yılın isabet
