- id: YMM-VTK-CEZ-K001
  sinav: ymm
  ders: VTK
  konu: CEZ
  kazanimlar:
  - vergi ziyaı ve usulsüzlük cezaları
  - ceza indirimi
  - uzlaşma ve izaha davet
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(Ü) Ltd. Şti. nezdinde 2026 yılında yapılan vergi incelemesi sonucunda 2024 hesap dönemine ilişkin aşağıdaki tespitler
    yapılmış ve ihbarnameler 15/9/2026''da şirkete tebliğ edilmiştir:


    | Tespit | Bilgi |

    |---|---|

    | Kurumlar vergisi matrah farkı (VUK md. 359 kapsamında fiil yok) | 400.000 TL; kurumlar vergisi oranı %25 |

    | Fatura düzenlenmemesi nedeniyle kesilen özel usulsüzlük cezası (nihai tutar) | 45.000 TL |

    | Kurumlar vergisi farkıyla ilgisi olmayan ayrı bir fiil nedeniyle kesilen II. derece usulsüzlük cezası (nihai tutar)
    | 6.000 TL |


    Ek bilgiler:


    - Şirket adına daha önce kesilen 20.000 TL vergi ziyaı cezası 10/5/2022''de kesinleşmiştir; başka kesinleşmiş vergi ziyaı
    cezası yoktur. Usulsüzlük cezalarına ilişkin tekerrür artırımı yukarıdaki nihai tutarlara dahildir.

    - 2026 yılı için uzlaşmaya konu edilebilecek usulsüzlük ve özel usulsüzlük cezalarına ilişkin sınır 40.000 TL''dir.

    - Gecikme faizi dikkate alınmayacaktır.


    **İstenenler:**


    (a) Kurumlar vergisi farkını ve tekerrür hükümlerini uygulayarak kesilecek vergi ziyaı cezasını hesaplayınız. (6 puan)


    (b) Şirket uzlaşma talep etmeden VUK md. 376''dan yararlanmak isterse başvuru ve ödeme şartlarını açıklayınız; her ceza
    için indirim sonrası ödenecek tutarı ve vergi aslı dahil ödenecek toplamı bulunuz. (8 puan)


    (c) Şirket uzlaşma yolunu seçerse hangi kalemlerin uzlaşmaya konu edilebileceğini, başvuru süresini ve uzlaşma ile md.
    376 indirimi arasındaki ilişkiyi açıklayınız. (6 puan)


    (d) Uzlaşma vaki olmazsa şirketin hangi yollara başvurabileceğini ve sürelerini açıklayınız. (5 puan)

    '
  cozum: '**(a) Vergi ziyaı cezası**


    - Kurumlar vergisi farkı = 400.000 x %25 = **100.000 TL**

    - Vergi ziyaı cezası (md. 344/1, bir kat) = 100.000 TL

    - Tekerrür (md. 339): Önceki vergi ziyaı cezası 10/5/2022''de kesinleşmiştir. Kesinleşmeyi izleyen günden itibaren beşinci
    yılın isabet ettiği takvim yılının sonuna kadar (en erken 31/12/2026) yeniden ceza kesildiğinden tekerrür vardır. Artırım
    %50 → 50.000 TL; ancak artırım kesinleşen cezayı (20.000 TL) aşamaz → 20.000 TL.

    - Kesilecek vergi ziyaı cezası = 100.000 + 20.000 = **120.000 TL**


    **(b) VUK md. 376 ile ödeme**


    Şartlar: İhbarnamelerin tebliğinden (15/9/2026) itibaren **otuz gün içinde** vergi dairesine başvurularak vergi ile cezaların
    indirimli kısmının vadesinde (veya 6183 sayılı Kanun''daki türden teminat gösterilerek vadenin bitiminden itibaren üç
    ay içinde) ödeneceği bildirilmeli ve bu sürede ödenmelidir. Süresinde ödenmez veya dava açılırsa indirimden yararlanılamaz.


    | Kalem | Tutar | İndirim | Ödenecek |

    |---|---|---|---|

    | Kurumlar vergisi aslı | 100.000 | İndirim yok | 100.000 |

    | Vergi ziyaı cezası | 120.000 | %50 (md. 376/1) | 60.000 |

    | Özel usulsüzlük cezası (40.000 TL''yi aşıyor) | 45.000 | %50 | 22.500 |

    | II. derece usulsüzlük cezası (40.000 TL''yi aşmıyor) | 6.000 | %50 artırımlı = %75 (Ek md. 1) | 1.500 |

    | **Toplam** | | | **184.000** |


    **(c) Uzlaşma**


    - Uzlaşmaya konu edilebilecekler (Ek md. 1): Vergi ziyaı cezası (120.000 TL) ve 40.000 TL''yi aşan özel usulsüzlük cezası
    (45.000 TL).

    - Konu edilemeyenler: Kurumlar vergisi aslı (7524 sayılı Kanun''dan sonra vergi aslı uzlaşma kapsamında değildir) ve fiil
    bazında 40.000 TL''yi aşmayan 6.000 TL''lik usulsüzlük cezası (bunun için 376 indirimi %75 uygulanır).

    - Süre: Uzlaşma talebi ihbarnamenin tebliğinden itibaren **otuz gün içinde** yapılır.

    - İlişki (Ek md. 9): Üzerinde uzlaşılan cezalara ayrıca indirim uygulanmaz; md. 376 hükümleri uygulanan cezalar için uzlaşma
    hükümleri uygulanmaz. Mükellef, uzlaşma tutanağını imzalayıncaya kadar uzlaşma talebinden vazgeçerek md. 376''nın uygulanmasını
    isteyebilir.


    **(d) Uzlaşma vaki olmazsa**


    - Aynı ceza için yeniden uzlaşma talep edilemez (Ek md. 1).

    - Tutanağa idarenin nihai teklifi yazılır; şirket **dava açma süresinin sonuna kadar** teklif edilen cezayı yazılı olarak
    kabul ederse uzlaşma sağlanmış sayılır (Ek md. 1).

    - Şirket, uzlaşmanın vaki olmadığına dair tutanağın tebliğinden itibaren genel hükümler dairesinde vergi mahkemesinde
    dava açabilir; dava açma süresi bitmiş veya 15 günden az kalmışsa süre, tutanağın tebliğinden itibaren **15 gün** olarak
    uzar (Ek md. 7).

    - Cezaların dava konusu yapılması hâlinde md. 376 indiriminden yararlanılamaz (md. 376/2); uzlaşmaya konu edilmeyen 6.000
    TL''lik usulsüzlük cezası için ise süresi içinde md. 376 başvurusu yapılmış olması gerekir.

    '
  puanlama:
  - olcut: Kurumlar vergisi farkı 100.000 ve bir kat VZC
    puan: 2
  - olcut: Tekerrür süresinin değerlendirilmesi
    puan: 2
  - olcut: Artırımın kesinleşen cezayla sınırlandırılması; VZC 120.000
    puan: 2
  - olcut: 376 başvuru ve ödeme şartları (30 gün, vade, teminatla 3 ay, dava açmama)
    puan: 2
  - olcut: VZC ve özel usulsüzlükte %50 indirim (60.000; 22.500)
    puan: 2
  - olcut: 40.000 TL'yi aşmayan usulsüzlükte %75 indirim (1.500)
    puan: 2
  - olcut: Vergi aslı dahil toplam 184.000
    puan: 2
  - olcut: Uzlaşmaya konu edilebilen ve edilemeyen kalemlerin ayrımı
    puan: 3
  - olcut: Otuz günlük uzlaşma talep süresi
    puan: 1
  - olcut: Uzlaşma ile 376 ilişkisi (Ek md. 9)
    puan: 2
  - olcut: Yeniden uzlaşma yasağı ve nihai teklifin kabulü
    puan: 2
  - olcut: Dava açma ve 15 günlük süre uzaması (Ek md. 7)
    puan: 3
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 336, 339, 344, 376
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Ek md. 1, 7, 9
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'kv = 400000 * 0.25

      vzc = kv + min(kv * 0.5, 20000)

      odenecek_vzc = vzc / 2

      ozel = 45000 / 2

      genel = 6000 * (1 - 0.75)

      toplam = kv + odenecek_vzc + ozel + genel

      sonuc = {''kv'': kv, ''vzc'': vzc, ''odenecek_vzc'': odenecek_vzc, ''ozel'': ozel, ''genel'': genel, ''toplam'': toplam}'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-VTK-CEZ-K002
  sinav: ymm
  ders: VTK
  konu: CEZ
  kazanimlar:
  - tekerrür ve fiil birleşmesi
  - vergi ziyaı ve usulsüzlük cezaları
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Olay:** **Yıldız Kimya A.Ş.** nezdinde 2027 yılında 2026 hesap dönemine ilişkin yapılan incelemede aşağıdaki\n\
    tespitler yapılmış, ihbarnameler Mart 2027'de tebliğ edilmiştir. Fiiller 2026 yılında işlendiğinden 2026 yılı\ntutarları\
    \ uygulanacaktır (I. derece usulsüzlük sermaye şirketleri 35.000 TL, II. derece 17.000 TL; md. 353/1 ilk\ntespit asgari\
    \ 17.000 TL). Kurumlar vergisi oranı %25, KDV oranı %20'dir. VUK md. 359 kapsamında fiil yoktur.\n\n1. Eylül 2026'da yapılan\
    \ dört ayrı satış (her biri 500.000 TL, toplam 2.000.000 TL) için fatura düzenlenmemiş, hasılat\n   kayıtlara alınmamıştır.\
    \ Tespit tek seferde yapılmıştır. Eksik hasılat hem 2026 kurumlar vergisi matrahını hem Eylül\n   2026 KDV matrahını etkilemektedir.\n\
    2. Ödenecek KDV'si 100.000 TL olan Ekim 2026 KDV beyannamesi, kanuni süresinden sonra, inceleme ve takdire sevkten\n \
    \  önce 03.12.2026'da kendiliğinden verilmiş ve vergi aynı gün ödenmiştir.\n3. Şirket Mart 2026 ve Eylül 2026'da yaptığı\
    \ iki ayrı adres değişikliğini süresinde bildirmemiştir (VUK md. 352/II-4).\n4. Şirket kayıtlarını muhasebe fişlerine\
    \ dayanarak yürütmektedir; 2026 yılının birçok ayında kayıtlar 45 günden fazla\n   gecikmiştir (VUK md. 352/I-6).\n5.\
    \ Şirkete 2023 yılında kesilen 300.000 TL vergi ziyaı cezası 15.05.2024'te kesinleşmiştir. Daha önce kesinleşmiş\n   usulsüzlük\
    \ cezası yoktur.\n\n**İstenenler:**\n\n(a) 1. maddedeki tespit nedeniyle kesilecek vergi ziyaı ve özel usulsüzlük cezalarını\
    \ hesaplayınız; fiil birleşmesi\nhükmünün uygulanıp uygulanmayacağını açıklayınız. (8 puan)\n\n(b) 2. maddedeki fiil için\
    \ kesilecek cezayı belirleyiniz. (5 puan)\n\n(c) 3. ve 4. maddelerdeki usulsüzlükler için kesilecek cezaları hesaplayınız.\
    \ (5 puan)\n\n(d) Tekerrür hükümlerinin uygulanıp uygulanmayacağını belirleyerek tekerrür dahil vergi ziyaı cezalarını\n\
    hesaplayınız. (7 puan)\n"
  cozum: "**(a) Kayıt dışı satış**\n\n- Kurumlar vergisi: 2.000.000 × %25 = 500.000 TL ziyaa uğratılan vergi → bir kat **500.000\
    \ TL** vergi ziyaı cezası.\n- KDV (Eylül 2026): 2.000.000 × %20 = 400.000 TL → **400.000 TL** vergi ziyaı cezası (md.\
    \ 344).\n- Fatura düzenlenmemesi (md. 353/1): her bir belge için meblağın %10'u, ilk tespitte 17.000 TL'den az olmamak\
    \ üzere:\n  500.000 × %10 = 50.000 TL > 17.000 TL → 4 belge × 50.000 = **200.000 TL**. Tek tespitte aynı neviden birden\
    \ fazla\n  belge her biri için ayrı ceza gerektirir; 2 sayılı cetveldeki tespit sayısı bakımından tek tespit sayılır.\n\
    - Md. 353 son fıkrası: bu usulsüzlükler vergi ziyaına da yol açtığından vergi ziyaı cezası **ayrıca** kesilir ve\n  **md.\
    \ 336 uygulanmaz**; özel usulsüzlük ve vergi ziyaı cezaları birlikte kesilir.\n\n**(b) Süresinden sonra verilen beyanname**\n\
    \n- Kanuni süresi geçtikten sonra, inceleme ve takdire sevkten önce verilen beyannamede vergi ziyaı cezası **%50**\n \
    \ oranında uygulanır (md. 344/3): 100.000 × %50 = **50.000 TL**.\n- Beyannamenin süresinde verilmemesi aynı zamanda I.\
    \ derece usulsüzlüktür (35.000 TL). Tek fiille vergi ziyaı ve\n  usulsüzlük birlikte işlendiğinden **yalnız miktarca en\
    \ ağır ceza** kesilir (md. 336): **50.000 TL vergi ziyaı\n  cezası**; usulsüzlük cezası ayrıca kesilmez.\n\n**(c) Usulsüzlükler**\n\
    \n- Adres değişikliklerinin bildirilmemesi II. derece usulsüzlüktür. Md. 352'deki aynı nevi (aynı derece ve fıkra)\n \
    \ usulsüzlük aynı takvim yılında birden fazla yapıldığından birincisi için 17.000 TL, ikincisi için birincinin dörtte\n\
    \  biri 4.250 TL: toplam **21.250 TL** (md. 337).\n- Kayıt nizamına aykırılık (md. 219) I. derece usulsüzlüktür; her incelemede\
    \ aynı takvim yılı için tespit edilenler\n  **tek fiil** sayılır: **35.000 TL** (md. 352/I-6).\n\n**(d) Tekerrür (md.\
    \ 339)**\n\n- Vergi ziyaı cezasında tekerrür süresi, cezanın kesinleştiği tarihi izleyen günden (16.05.2024) itibaren\
    \ beşinci\n  yılın isabet ettiği takvim yılının sonudur: **31.12.2029**. 2027'de kesilen vergi ziyaı cezaları bu süre\
    \ içindedir.\n- Vergi ziyaı cezaları **%50** artırılır; artırım tutarı kesinleşen cezayı (300.000 TL) aşamaz:\n\n| Ceza\
    \ | Esas | Artırım (%50) | Tekerrürlü ceza |\n|---|---|---|---|\n| Kurumlar vergisi VZC | 500.000 | 250.000 | 750.000\
    \ |\n| Eylül KDV VZC | 400.000 | 200.000 | 600.000 |\n| Ekim KDV VZC | 50.000 | 25.000 | 75.000 |\n| **Toplam** | **950.000**\
    \ | **475.000** | **1.425.000** |\n\n- Her bir artırım 300.000 TL sınırının altındadır. Daha önce kesinleşmiş usulsüzlük\
    \ cezası olmadığından usulsüzlük\n  ve özel usulsüzlük cezalarına tekerrür artırımı uygulanmaz.\n"
  puanlama:
  - olcut: Kurumlar vergisi (500.000) ve KDV (400.000) vergi ziyaı cezaları
    puan: 3
  - olcut: 'Fatura cezası: belge başına %10, tek tespit, 200.000 TL'
    puan: 3
  - olcut: 'Md. 353 son fıkrası: md. 336''nın uygulanmaması'
    puan: 2
  - olcut: 'Md. 344/3: %50 oranlı 50.000 TL vergi ziyaı cezası'
    puan: 2
  - olcut: 'Md. 336: tek fiilde yalnız ağır cezanın kesilmesi (50.000 > 35.000)'
    puan: 3
  - olcut: 'Md. 337: aynı nevi II. derece usulsüzlükte 17.000 + 4.250'
    puan: 3
  - olcut: Kayıt nizamında tek fiil ve 35.000 TL
    puan: 2
  - olcut: Tekerrür süresinin 31.12.2029 olarak belirlenmesi
    puan: 2
  - olcut: '%50 artırım ve kesinleşen ceza sınırının kontrolü'
    puan: 3
  - olcut: Tekerrür dahil cezalar (750.000 / 600.000 / 75.000; toplam 1.425.000)
    puan: 2
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 336, 337, 339, 344, 352, 353
  - mevzuat: VUK Genel Tebliği (Sıra No. 588)
    madde: ekli liste (md. 352, 353 tutarları)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'kv = 2000000*0.25; kdv = 2000000*0.20

      fatura = 4*max(500000*0.10, 17000)

      ekim = max(100000*0.5, 35000)

      adres = 17000 + 17000/4

      vzc = [kv, kdv, ekim]

      art = [min(x*0.5, 300000) for x in vzc]

      sonuc = {"vzc_kv": kv, "vzc_kdv": kdv, "fatura": fatura, "ekim": ekim, "adres": adres, "kayit": 35000, "tekerrur_artirim":
      sum(art), "vzc_toplam": sum(vzc)+sum(art)}

      '
