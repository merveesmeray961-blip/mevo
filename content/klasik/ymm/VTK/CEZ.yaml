    | 1 | Ocak 2026 dönemi KDV beyannamesi kanuni süresinden sonra 12/5/2026''da verilmiştir; beyannamede ödenecek KDV 120.000
    TL''dir. |

    | 2 | Mart 2026 dönemi KDV beyannamesi de kanuni süresinden sonra, aynı şekilde incelemeden önce verilmiştir; beyannamedeki
    ödenecek KDV 50.000 TL''dir. |

    | 3 | Şirkete 2022 yılında kesilen 20.000 TL tutarındaki vergi ziyaı cezası aynı yıl kesinleşmiştir. |

    | 4 | Şirketin ayrıca 6/3/2024''te kesinleşen 8.000 TL tutarında bir usulsüzlük cezası vardır. |


    Beyannamenin süresinde verilmemesi, sermaye şirketleri için I. derece usulsüzlük sayılır ve 2026 yılında bunun için kesilecek
    usulsüzlük cezası 35.000 TL''dir. II. derece usulsüzlükte sermaye şirketleri için 2026 tutarı 17.000 TL''dir. Gecikme
    zammı ve faizi dikkate alınmayacaktır; beyannamelerin geç verilmesi her olayda tek fiildir.


    **İstenenler:**


    (a) 1 numaralı olayda şirkete kesilecek cezayı, hangi cezanın hangi gerekçeyle kesileceğini belirterek hesaplayınız. (6
