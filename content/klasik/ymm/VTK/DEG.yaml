    bitis: null
  dogrulama:
    python: 'maliyet = 5000000

      oran_amortisman = 0.10

      birikmis = maliyet * oran_amortisman * 2

      net = maliyet - birikmis

      oran_deger = 0.40

      artis = net * oran_deger

      birikmis_artis = birikmis * oran_deger

      sonuc = {"birikmis_amortisman": birikmis, "net_deger": net, "artis_fonu": artis, "birikmis_artis": birikmis_artis}

      '
