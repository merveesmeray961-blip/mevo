    \ bilgileri aşağıdadır. Şirket gün esasına göre amortisman uygulamasını seçmemiştir; amortisman süreleri\nBakanlıkça ilan\
    \ edilen faydalı ömürlerdir. GVK md. 40 ve KVK md. 11 kapsamındaki gider kısıtlamaları dikkate\nalınmayacaktır.\n\n1.\
    \ **Kiralık depo:** Şirket 01.04.2026–31.03.2031 dönemi için (5 yıl) kiraladığı depoya ara kat ve yükleme rampası\n  \
    \ yaptırmıştır; toplam gider 1.500.000 TL'dir ve 01.04.2026'da kullanıma hazırdır.\n2. **Binek otomobil:** 10.08.2026'da\
    \ 1.800.000 TL maliyetle aktife alınmıştır; faydalı ömrü 5 yıl, normal yöntem.\n   Şirketin binek otomobil kiralama veya\
    \ işletme faaliyeti yoktur.\n3. **Forklift:** 02.01.2024'te 1.000.000 TL'ye alınmış; faydalı ömrü 5 yıl; 2024 ve 2025'te\
    \ azalan bakiyeler\n   yöntemiyle amortisman tam olarak ayrılmıştır. Şirket 2026 yılından itibaren normal amortisman yöntemine\
    \ geçmek\n   istemektedir.\n4. **Demirbaşlar (Mart 2026):** Her biri 1.500 TL olan 9 adet ofis sandalyesi (toplam 13.500\
    \ TL) ile kasa 9.000 TL,\n   monitör 5.000 TL, klavye-fare 1.000 TL'den oluşan bir masaüstü bilgisayar seti (toplam 15.000\
    \ TL). 2026 için\n   doğrudan gider yazma haddi 12.000 TL'dir.\n5. **Arsalı depo binası:** 05.01.2026'da 10.000.000 TL'ye\
    \ satın alınmış; tapu harcı, döner sermaye ve noter\n   giderleri 400.000 TL'dir. Değerleme raporuna göre bedelin %40'ı\
