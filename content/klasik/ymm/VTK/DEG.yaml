    3. **05.09.2026:** Yangında kullanılamaz hâle gelen **fabrika binasının** maliyeti 5.000.000 TL, ayrılmış amortismanı
    1.000.000 TL''dir. Bina için 4.600.000 TL sigorta tazminatı alınmış; şirket binayı yeniden inşa etmeye karar vererek teşebbüse
    geçmiştir. Aynı yangında yanan **emtianın** maliyeti 800.000 TL, ödenen sigorta tazminatı 950.000 TL''dir.


    **İstenenler:**


