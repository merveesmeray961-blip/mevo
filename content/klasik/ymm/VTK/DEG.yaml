- id: YMM-VTK-DEG-K002
  sinav: ymm
  ders: VTK
  konu: DEG
  kazanimlar:
  - maliyet bedeli ve borsa rayici
  - yeniden değerleme (VUK mükerrer 298/ç)
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Olay:** Bilanço esasına göre defter tutan tam mükellef **Pınar Metal A.Ş.** (hesap dönemi takvim yılı), aktifinde
    1.1.2025 tarihinde 5.000.000 TL''ye aldığı bir makineyi bulundurmaktadır. Makinenin Bakanlıkça ilan edilen normal amortisman
    oranı %10''dur. Şirket bu makine için normal amortisman yöntemini uygulamaktadır.


    2026 yılı yeniden değerleme oranı %40''tır. Şirket, makineyi VUK mükerrer md. 298/ç kapsamında yeniden değerlemeye tabi
    tutmak istemektedir.


    **İstenenler:**


    (a) 31.12.2026 tarihi itibarıyla makinenin net defter değerini ve 2025 yılı birikmiş amortismanını hesaplayınız. (8 puan)


    (b) Yeniden değerleme sonrasında oluşacak değerleme artış fonunu hesaplayınız ve bu fonun muhasebe kaydını gösteriniz.
    (7 puan)


    (c) Yeniden değerleme artış fonunun sermayeye eklenmesi ve ortaklara dağıtılması durumlarındaki vergisel sonuçları açıklayınız.
    (5 puan)

    '
  cozum: "**(a) 31.12.2026 net defter değeri**\n\nMakine maliyeti: 5.000.000 TL\nNormal amortisman oranı: %10\n\n2025 yılı\
    \ amortismanı = 5.000.000 × %10 = 500.000 TL\n2026 yılı amortismanı (yeniden değerleme öncesi) = 5.000.000 × %10 = 500.000\
    \ TL\n31.12.2026 birikmiş amortisman (değerleme öncesi) = 500.000 + 500.000 = 1.000.000 TL\n31.12.2026 net defter değeri\
    \ = 5.000.000 − 1.000.000 = 4.000.000 TL\n\n**(b) Yeniden değerleme artış fonu**\n\nDeğerleme artışı = Net defter değeri\
    \ × oran = 4.000.000 × %40 = 1.600.000 TL\n\nBirikmiş amortisman artışı = Birikmiş amortisman × oran = 1.000.000 × %40\
    \ = 400.000 TL\n\nMuhasebe kaydı:\n```\n253 Tesis, Makine ve Cihazlar       2.000.000 (5.000.000 × %40)\n    257 Birikmiş\
    \ Amortismanlar           400.000\n    522 Maddi Duran Varlık Yeniden\n        Değerleme Artışları             1.600.000\n\
    ```\n\n**(c) Vergisel sonuçlar**\n\n- Sermayeye ekleme: VUK mükerrer md. 298/ç uyarınca değerleme artış fonu sermayeye\
    \ eklenirse kâr dağıtımı sayılmaz; kurumlar vergisi hesaplanmaz.\n- Ortaklara dağıtım: Fon ortaklara dağıtılırsa kâr dağıtımı\
    \ sayılır; kurumlar vergisi ile stopaj yükümlülükleri doğar.\n"
  puanlama:
  - olcut: 2025 ve 2026 yılı amortisman tutarlarının doğru hesaplanması (500.000 + 500.000 = 1.000.000 TL)
    puan: 4
  - olcut: 31.12.2026 net defter değerinin doğru bulunması (4.000.000 TL)
    puan: 4
  - olcut: Değerleme artış fonunun doğru hesaplanması (1.600.000 TL)
    puan: 4
  - olcut: Muhasebe kaydının doğru (ATİK artış, birikmiş amortisman artış, fon) yapılması
    puan: 3
  - olcut: Sermayeye ekleme halinde vergilendirme olmayacağının doğru ifadesi
    puan: 3
  - olcut: Ortaklara dağıtımda kâr dağıtımı sayılacağının ve vergilendirme yapılacağının belirtilmesi
    puan: 2
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/ç
  gecerlilik:
