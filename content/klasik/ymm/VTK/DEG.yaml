    kâr, satışın yapıldığı yılı izleyen üçüncü takvim yılının (2029) kâr ve zarar hesabına eklenir.


    **(b) Mahsup**


    Geçici hesaptaki kâr, yeni kıymetin ayrılacak amortismanlarına mahsup edilir. Yeni makinenin yıllık amortismanı 4.000.000
