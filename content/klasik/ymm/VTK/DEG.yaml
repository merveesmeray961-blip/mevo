- id: YMM-VTK-DEG-K001
  sinav: ymm
  ders: VTK
  konu: DEG
  kazanimlar:
  - yeniden değerleme (VUK mükerrer 298/ç)
  - amortisman uygulaması
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Olay:** Tam mükellef, bilanço esasına göre defter tutan ve kayıtlarını Türk lirasıyla tutan **Ece Makina A.Ş.**nin
    hesap dönemi takvim yılıdır. VUK geçici md. 37 uyarınca şirket 2025 ve 2026 hesap dönemlerinde enflasyon düzeltmesi yapmamıştır.
    Şirket 31.12.2025 itibarıyla mükerrer md. 298/Ç kapsamında yeniden değerleme **yapmamış**, 31.12.2026 itibarıyla ise yeniden
    değerleme yapmaya karar vermiştir.


    31.12.2026 tarihli yasal kayıtlar (2026 amortismanları ayrılmış hâliyle):


    | Kıymet | Aktife giriş | Maliyet (TL) | Birikmiş amortisman (TL) | Amortisman |

    |---|---|---|---|---|

    | Bina | 2017 | 6.000.000 | 1.200.000 | Normal, %2 |

    | Makine | 2023 | 2.000.000 | 800.000 | Normal, %10 |

    | Kamyon | Mayıs 2026 | 1.500.000 | 300.000 | Normal, %20 |

    | Arsa | 2015 | 4.000.000 | – | – |


    Maliyet bedellerinde kur farkı veya kredi faizi bulunmamaktadır; kıymetler sat-kirala-geri al işlemine konu değildir.
    **2026 yılı yeniden değerleme oranının %20** olduğu varsayılacaktır. KDV dikkate alınmayacaktır.


    **İstenenler:**


    (a) Hangi kıymetlerin 31.12.2026 itibarıyla yeniden değerlenebileceğini gerekçeleriyle belirtiniz; şirketin 2025 yılında
    yapmadığı yeniden değerlemeyi 2026 yılında telafi edip edemeyeceğini açıklayınız. (6 puan)


    (b) Yeniden değerlenebilen kıymetlerin yeniden değerleme sonrası maliyet ve birikmiş amortisman tutarlarını, pasifte özel
    fon hesabına alınacak değer artışlarını hesaplayınız ve kayıtlarını yapınız. (8 puan)


    (c) Bina ve makine için 2027 yılında ayrılacak amortismanları hesaplayınız; değer artış fonunun sermayeye eklenmesi ile
    başka bir hesaba nakledilmesinin vergisel sonuçlarını açıklayınız. (5 puan)


    (d) Makine, 2027 amortismanı ayrıldıktan sonra Aralık 2027''de 1.800.000 TL''ye satılmıştır. Satış kârını hesaplayınız
    ve satış kaydını yapınız (yenileme fonu uygulanmayacaktır). (6 puan)

    '
  cozum: "**(a) Kapsam ve telafi**\n\n- Mükerrer md. 298/Ç, enflasyon düzeltmesi şartlarının gerçekleşmediği dönemlerde bilançoya\
    \ dâhil **amortismana tabi iktisadi kıymetler** ile bunların amortismanlarının yeniden değerlenmesine izin verir. Geçici\
    \ md. 37/2'ye göre enflasyon düzeltmesi yapılmayan 2025–2027 dönemleri bu bakımdan \"şartların gerçekleşmediği dönem\"\
    \ sayılır.\n- **Bina** ve **makine** kapsamdadır.\n- **Kamyon** 2026'da aktife girdiğinden aktife girdiği dönemde yeniden\
    \ değerlenemez (298/Ç-9).\n- **Arsa** amortismana tabi olmadığından (VUK md. 314) kapsam dışıdır.\n- Her yılın oranı ancak\
    \ o yıla ait değerlemede kullanılabilir; 2025'te yapılmayan değerleme sonraki yıllarda geçmişe dönük yapılamaz (298/Ç-8).\
    \ Ancak bir yıl yapılmaması sonraki dönemlerde yeniden değerleme yapılmasına engel değildir (298/Ç-13). Şirket 2026'da\
    \ yalnız **2026 oranını (%20)** kullanır.\n\n**(b) Hesaplama ve kayıt** (yeniden değerleme sonrası değer = defter değeri\
    \ × 1,20; değer artışı = net değerler farkı)\n\n| Kıymet | Maliyet önce → sonra | Birikmiş amort. önce → sonra | Net önce\
    \ → sonra | Değer artışı |\n|---|---|---|---|---|\n| Bina | 6.000.000 → 7.200.000 | 1.200.000 → 1.440.000 | 4.800.000\
    \ → 5.760.000 | 960.000 |\n| Makine | 2.000.000 → 2.400.000 | 800.000 → 960.000 | 1.200.000 → 1.440.000 | 240.000 |\n\
    | **Toplam** | | | | **1.200.000** |\n\nKayıtlar (31.12.2026; fon pasifte, her kıymete isabet eden artış ayrı izlenecek\
    \ şekilde özel bir fon hesabında, örneğin 522 MDV Yeniden Değerleme Artışları hesabının alt hesaplarında):\n\n- 252 Binalar\
    \ (B) 1.200.000 / 257 Birikmiş Amortismanlar (A) 240.000 / 522 – Bina değer artış fonu (A) 960.000\n- 253 Tesis, Makine\
    \ ve Cihazlar (B) 400.000 / 257 Birikmiş Amortismanlar (A) 160.000 / 522 – Makine değer artış fonu (A) 240.000\n\n**(c)\
    \ 2027 amortismanları ve fonun durumu**\n\n- Kıymetler yeniden değerleme sonrası değerleri üzerinden amortismana devam\
    \ eder (298/Ç-5):\n  - Bina: 7.200.000 × %2 = **144.000 TL**\n  - Makine: 2.400.000 × %10 = **240.000 TL** (kalan net\
    \ değer 1.440.000 TL kalan 6 yıla bölündüğünde de 240.000 TL bulunur)\n- Fonun **sermayeye eklenmesi** kâr dağıtımı sayılmaz;\
    \ eklenen tutar ortaklarca işletmeye konulmuş kıymet kabul edilir.\n- Sermayeye ekleme dışında **başka bir hesaba nakledilen\
    \ veya işletmeden çekilen** kısım, işlemin yapıldığı dönemde dönem kazancıyla ilişkilendirilmeksizin gelir veya kurumlar\
    \ vergisine tabi tutulur (298/Ç-6).\n\n**(d) Makinenin satışı**\n\n- Elden çıkarılan kıymete isabet eden değer artış fonu\
    \ **amortisman gibi** muameleye tabi tutulur (298/Ç-7).\n- Birikmiş amortisman: 960.000 + 240.000 (2027) = 1.200.000 TL\n\
    - Vergi değeri: 2.400.000 − 1.200.000 − 240.000 (fon) = 960.000 TL\n- **Satış kârı** = 1.800.000 − 960.000 = **840.000\
    \ TL**\n- Kontrol: Yeniden değerleme yapılmasaydı defter değeri 2.000.000 − 800.000 − 200.000 = 1.000.000 TL, kâr 800.000\
    \ TL olurdu. Aradaki 40.000 TL, 2027'de fazladan ayrılan amortismanın (240.000 − 200.000) satışta geri alınmasıdır.\n\n\
    Kayıt (KDV hariç):\n\n- 102 Bankalar (B) 1.800.000\n- 257 Birikmiş Amortismanlar (B) 1.200.000\n- 522 – Makine değer artış\
    \ fonu (B) 240.000\n- 253 Tesis, Makine ve Cihazlar (A) 2.400.000\n- 679 Diğer Olağandışı Gelir ve Kârlar (A) 840.000\n"
  puanlama:
  - olcut: Bina ve makinenin kapsamda, kamyonun (aktife giriş dönemi) ve arsanın (amortismana tabi değil) kapsam dışı olduğunun
      gerekçeli tespiti; geçici md. 37/2 bağlantısı
    puan: 4
  - olcut: 2025 değerlemesinin geriye dönük yapılamayacağı, 2026'da yalnız 2026 oranının kullanılacağı (298/Ç-8 ve 13)
    puan: 2
  - olcut: Yeniden değerleme sonrası maliyet ve birikmiş amortismanların doğru hesabı
    puan: 3
  - olcut: Değer artışlarının net değer farkı olarak bulunması (960.000 + 240.000 = 1.200.000)
    puan: 3
  - olcut: Fonun pasifte kıymet bazında izlendiği kayıtların doğru yapılması
    puan: 2
  - olcut: 2027 amortismanlarının yeniden değerlenmiş değerler üzerinden hesabı (144.000 ve 240.000)
    puan: 3
  - olcut: Fonun sermayeye eklenmesi ile başka hesaba nakil/çekilmenin sonuçları
    puan: 2
  - olcut: Fonun amortisman gibi dikkate alınarak satış kârının 840.000 TL bulunması
    puan: 4
  - olcut: Satış kaydının hesap kodlarıyla doğru yapılması
    puan: 2
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 298/Ç-4
    alinti: Değer artışı, iktisadi kıymetlerin yeniden değerleme sonrası ve yeniden değerleme öncesi net bilanço aktif değerleri
      arasındaki farktır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 298/Ç-6, 7
    alinti: Sermayeye eklenen değer artışları, ortaklar tarafından işletmeye ilave edilmiş kıymetler olarak kabul edilir.
      Bu işlemler kâr dağıtımı sayılmaz. … Yeniden değerlemeye tabi tutulan iktisadi kıymetlerin elden çıkarılması (satış,
      devir, işletmeden çekiş, tasfiye gibi) halinde, bunlara isabet eden pasifte özel bir fon hesabında gösterilen değer
      artışları aynen amortismanlar gibi muameleye tabi tutulur.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 298/Ç-8, 9
    alinti: Her yılın yeniden değerleme oranı ancak o yıla ait değerlemede nazara alınabilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Geçici md. 37
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 314
  gecerlilik:
    baslangic: '2022-01-01'
    bitis: null
  dogrulama:
    python: "oran = 0.20\nbina_m, bina_a = 6000000, 1200000\nmak_m, mak_a = 2000000, 800000\nbina_fon = (bina_m - bina_a)\
      \ * oran\nmak_fon = (mak_m - mak_a) * oran\nbina_m2, mak_m2, mak_a2 = bina_m * 1.2, mak_m * 1.2, mak_a * 1.2\nbina_amort_2027\
      \ = bina_m2 * 0.02\nmak_amort_2027 = mak_m2 * 0.10\nsatis_kari = 1800000 - (mak_m2 - (mak_a2 + mak_amort_2027) - mak_fon)\n\
      sonuc = {\"bina_fon\": round(bina_fon), \"makine_fon\": round(mak_fon), \"toplam_fon\": round(bina_fon + mak_fon),\n\
      \         \"bina_amort_2027\": round(bina_amort_2027), \"makine_amort_2027\": round(mak_amort_2027),\n         \"satis_kari\"\
      : round(satis_kari)}"
