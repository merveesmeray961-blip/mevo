    - **Emtia (md. 330):** Emtia için alınan sigorta tazminatı değerinden fazla olduğundan fazlalık (950.000 − 800.000 = **150.000
    TL**) doğrudan **kâra alınır**; amortismana tabi kıymetler için öngörülen geçici hesapta tutma imkânı emtia için yoktur.

