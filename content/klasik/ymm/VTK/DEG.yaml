- id: YMM-VTK-DEG-K020
  sinav: ymm
  ders: VTK
  konu: DEG
  kazanimlar:
  - azalan bakiyeler usulüyle amortisman
  - şüpheli alacak karşılığı
  - yabancı para borcun değerlemesi
  - enflasyon düzeltmesinin yapılmayacağı dönemler
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Takvim yılı hesap dönemine tabi, bilanço esasında defter tutan (G) A.Ş., 2026 hesap dönemine ilişkin aşağıdaki işlemleri
    yapmıştır. Tüm tutarlar KDV hariçtir ve işlemlerle ilgili başka bir vergisel sınırlama dikkate alınmayacaktır.


    - **Makine:** 1 Ocak 2026''da aktife alınan 2.000.000 TL bedelli makine için normal amortisman oranı %25''tir. Şirket
    azalan bakiyeler usulünü tercih etmiştir.

    - **Alacaklar (ticari kazançla ilgili):** (i) icra takibi safhasındaki 150.000 TL''lik alacak (bunun 40.000 TL''si teminatlıdır);
    (ii) yazı ile iki defa istenmesine rağmen ödenmemiş 24.000 TL''lik alacak; (iii) yazı ile iki defa istenmesine rağmen
    ödenmemiş 26.000 TL''lik alacak. 2026 yılında VUK md. 323''teki tutar sınırı 25.000 TL''dir.

    - **Yabancı para borcu:** Senetsiz 20.000 EUR tutarındaki ticari borç, defterlere 35 TL/EUR kurla (700.000 TL) kaydedilmiştir.
    Değerleme gününde borsa rayici (Maliye Bakanlığınca tespit edilen kur) 45 TL/EUR''dur.

    - Şirketin ayrıca 2026 mali tablolarında enflasyon düzeltmesi şartlarının oluştuğunu düşündüğü belirtilmektedir.


    **İstenenler:**


    (a) Makine için 2026 ve 2027 hesap dönemlerinde ayrılacak amortisman tutarlarını hesaplayınız; uygulanacak oranı gerekçesiyle
    belirtiniz. (8 puan)


    (b) Şüpheli alacak sayılacak alacakları belirleyerek karşılık ayrılabilecek en yüksek tutarı hesaplayınız. (7 puan)


    (c) Yabancı para borcun değerlemesi sonucu oluşan kur farkını hesaplayınız ve niteliğini belirtiniz. (5 puan)


    (d) Şirketin enflasyon düzeltmesi konusundaki düşüncesini, geçici md. 37 çerçevesinde değerlendiriniz. (5 puan)

    '
  cozum: '**(a) Azalan bakiyeler usulü (mükerrer md. 315)**


    - Bu usulde uygulanacak oran, %50''yi geçmemek üzere normal amortisman oranının iki katıdır. Normal oran %25 ise iki katı
    %50''dir; %50 sınırını aşmadığından uygulanacak oran **%50**''dir.

    - 2026: 2.000.000 x %50 = **1.000.000 TL**.

    - Her yıl üzerinden amortisman hesaplanacak değer, evvelce ayrılmış amortismanlar toplamı düşülerek bulunur: 2027 için
    2.000.000 - 1.000.000 = 1.000.000 TL; 1.000.000 x %50 = **500.000 TL**.

    - Md. 320: Amortisman süresi aktife girilen yıldan başlar; kıymet 1 Ocak''ta aktife girdiğinden 2026 tam yıl amortisman
    ayrılır.


    **(b) Şüpheli alacak (md. 323)**


    - (i) icra safhasındaki alacak, tutarına bakılmaksızın şüpheli alacaktır: 150.000 TL.

    - (ii) Yazı ile iki defa (bir defadan fazla) istenmesine rağmen ödenmeyen ve 25.000 TL''yi aşmayan 24.000 TL şüpheli alacaktır.

    - (iii) 26.000 TL, 25.000 TL''yi aştığından yazı ile istenmesi tek başına şüpheli alacak sayılmasını sağlamaz.

    - Şüpheli alacak toplamı = 150.000 + 24.000 = 174.000 TL.

    - Teminatlı alacaklarda karşılık teminattan geri kalan miktara inhisar eder: (150.000 - 40.000) + 24.000 = **134.000 TL**
    karşılık ayrılabilir.


    **(c) Yabancı para borç (md. 280)**


    - Yabancı paralar borsa rayici ile değerlenir; hüküm yabancı para ile olan senetli veya senetsiz alacak ve borçlar için
    de geçerlidir.

    - Değerleme günü değeri = 20.000 x 45 = 900.000 TL; kayıtlı değer 700.000 TL.

    - Kur farkı = 900.000 - 700.000 = **200.000 TL**; borç arttığı için kur farkı **gider** niteliğindedir.


    **(d) Enflasyon düzeltmesi (geçici md. 37)**


    - Geçici md. 37/1''e göre 2025 hesap dönemi ile geçici vergi dönemleri de dahil olmak üzere 2026 ve 2027 hesap dönemlerinde
    (özel hesap dönemlerinde 2026, 2027 ve 2028 yılında biten dönemler itibarıyla) mükerrer 298 kapsamındaki enflasyon düzeltmesine
    ilişkin şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine tabi tutulmaz.

    - Dolayısıyla (G) A.Ş.''nin 2026 mali tabloları şartlar oluşmuş olsa dahi enflasyon düzeltmesine tabi tutulmaz; şirketin
    düşüncesi yerinde değildir. Cumhurbaşkanı bu dönemleri üç hesap dönemine kadar uzatmaya yetkilidir.

    '
