  soru: "**Olay:** **Çınar Lojistik A.Ş.** 2025 hesap dönemi kurumlar vergisi beyannamesinde 5.000.000 TL matrah beyan etmiştir.\n\
    \n1. Vergi müfettişi 02.07.2026'da şirketin işyerine gelerek tam inceleme yapacağını sözlü olarak bildirmiş ve defter\n\
    \   ile belgelerin derhal ibrazını istemiştir. İnceleme aramalı inceleme değildir.\n2. Müfettiş 21.07.2026'da incelemenin\
    \ konusunu ve başladığını şirkete yazıyla bildirmiştir. Şirket kendisine verilen\n   15 günlük sürede defterlerini ibraz\
    \ etmemiştir. Müfettiş matrahın takdiri için şirketi takdir komisyonuna sevk\n   etmiştir.\n3. Takdir komisyonu, \"defterlerin\
    \ ibraz edilmemesinin takdir sebebi oluşturmadığı\" kanaatine varmış; buna rağmen\n   matrah takdir etmesi istenince 2025\
    \ yılı matrahını 4.600.000 TL olarak takdir etmiştir. Vergi dairesi takdir\n   edilen matrahın düşük olduğu görüşündedir.\n\
    4. Şirket, kendi beyannamesinde bir kanunen kabul edilmeyen gider kalemini (200.000 TL) yanlışlıkla iki kez matraha\n\
    \   eklediğini fark etmiş ve bu nedenle beyanına karşı doğrudan vergi mahkemesinde dava açmak istemektedir.\n\n**İstenenler:**\n\
    \n(a) Müfettişin 02.07.2026'daki talebini değerlendiriniz; incelemenin başlama tarihini, uyulacak başlıca esasları ve\n\
    incelemenin en geç bitirilmesi gereken tarihleri belirtiniz. (7 puan)\n\n(b) Resen takdir sebebini ve takdir komisyonunun\
    \ görev sınırını açıklayınız; takdire sevkin tarh zamanaşımına etkisini\nbelirtiniz. (6 puan)\n\n(c) Komisyonun takdir\
    \ ettiği matrahı beyana bağlılık açısından değerlendiriniz; vergi dairesinin başvurabileceği\nyolu ve süresini açıklayınız.\
    \ (6 puan)\n\n(d) Şirketin 4. maddedeki talebini değerlendirerek izlemesi gereken yolu açıklayınız. (6 puan)\n"
  cozum: "**(a) İnceleme (VUK md. 139, 140; 5604 md. 1/4)**\n\n- Mali tatil (1–20 Temmuz) süresince, aramalı incelemeler hariç,\
    \ inceleme amacıyla **defter ve belge ibrazı talep\n  edilemez** ve **işyerinde incelemeye başlanamaz**; 02.07.2026 talebi\
    \ hukuka aykırıdır. Ayrıca incelemenin konusu ve\n  başladığı **yazıyla** bildirilmelidir (md. 140/1); sözlü bildirim\
    \ yeterli değildir.\n- İnceleme 21.07.2026'da başlamıştır. Tam incelemede en fazla **bir yıl** (21.07.2027); bitirilemezse\
    \ en çok **altı ay**\n  ek süre verilebilir (21.01.2028) ve nedenleri yazıyla bildirilir (md. 140/6).\n- Diğer esaslar:\
    \ işyerinde inceleme yapılıyorsa muvafakat olmadıkça resmî çalışma saatleri dışında inceleme\n  yapılamaz; inceleme bitince\
    \ bunu gösteren belge verilir; Cumhurbaşkanı kararı, yönetmelik, genel tebliğ ve\n  sirkülere aykırı rapor düzenlenemez\
    \ (md. 140/3–5). İnceleme esas olarak dairede yapılır (md. 139).\n\n**(b) Resen takdir ve komisyon (md. 30, 74, 114)**\n\
    \n- Tutulması zorunlu defterlerin vergi incelemesine yetkili olanlara herhangi bir sebeple **ibraz edilmemesi** resen\n\
    \  takdir sebebidir (md. 30/3).\n- Takdir komisyonu istenen matrahı takdir eder; **takdir sebebi bulunup bulunmadığını\
    \ incelemez**; yalnız hatalı\n  gördüğü muamelelerde vergi dairesini **yazıyla ikaz** eder (md. 74). Komisyon dosyayı\
    \ takdir sebebi yok diyerek\n  iade edemez.\n- Takdir komisyonuna başvurulması tarh zamanaşımını durdurur; karar vergi\
    \ dairesine tevdi edilince kaldığı yerden\n  işler; işlemeyen süre bir yılı geçemez (md. 114/2).\n\n**(c) Beyana bağlılık\
    \ (md. 76, 377)**\n\n- Mükellefin evvelce beyan ettiği bir matraha ait takdirlerde takdir olunan matrah **beyandan düşük\
    \ olamaz**\n  (md. 76): 4.600.000 TL takdir edilemez; matrah en az **5.000.000 TL** olmalıdır.\n- Vergi dairesi, takdir\
    \ komisyonlarınca takdir olunan matrahlara karşı **vergi mahkemesinde dava açabilir**\n  (md. 377/2). Süre, komisyon kararının\
    \ idareye geldiği tarihi izleyen günden itibaren **30 gündür** (İYUK md. 7/2-b).\n\n**(d) Beyana karşı dava**\n\n- Mükellefler\
    \ beyan ettikleri matrahlara ve bunlar üzerinden tarh edilen vergilere karşı **dava açamaz**; vergi\n  hatalarına ilişkin\
    \ hükümler saklıdır (md. 378/2).\n- Aynı giderin iki kez matraha eklenmesi **matrah hatasıdır** (md. 117/1). Şirket önce\
    \ vergi dairesinden **yazılı\n  düzeltme talebinde** bulunmalı (md. 122); talep reddedilirse 30 gün içinde vergi mahkemesinde\
    \ dava açabilir, dava\n  süresi geçmişse Bakanlığa şikâyet yoluna başvurabilir (md. 124). Düzeltme tarh zamanaşımı içinde\
    \ istenmelidir.\n"
