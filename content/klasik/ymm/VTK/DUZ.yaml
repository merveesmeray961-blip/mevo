  soru: "**Olay:** Sera işletmeciliği yapan ve bilanço esasına göre defter tutan **Bay Hasan Ova**'nın tek gelir kaynağı bu\n\
    işletmedir.\n\n1. 2025 yılı gelir vergisi beyannamesinde hesaplanan gelir vergisi 500.000 TL'dir. Bay Ova, 2025 yılında\
    \ ödediği\n   60.000 TL geçici vergiyi beyannamede mahsup etmeyi unutmuş; 500.000 TL tahakkuk etmiştir. Birinci taksit\
    \ olan\n   250.000 TL'yi Mart 2026'da ödemiş; ikinci taksit (250.000 TL) Temmuz 2026'da ödenecektir. Ayrıca ödenmemiş\n\
    \   10.000 TL usulsüzlük cezası bulunmaktadır.\n2. 20.05.2026'daki sel felaketinde seralar zarar görmüş; mahallî idare\
    \ kurulunun tespitine göre Bay Ova\n   varlıklarının **%40**'ını kaybetmiştir. Bakanlıktan devralınan yetkiyle mahalline\
    \ başvuru yapılmış ve zararla\n   orantılı olarak %40 terkin kabul edilmiştir. Bay Ova'nın 2025 yılı gelir vergisinin\
    \ düzeltilmiş tutarı da terkin\n   kapsamındadır.\n3. Bay Ova, 2024 yılında Gelir İdaresi Başkanlığından aldığı özelgeye\
    \ göre bir gider kalemini indirim konusu\n   yapmıştır. 2026 yılındaki incelemede 2024 yılı için 80.000 TL vergi farkı\
    \ tespit edilmiştir. İki ayrı ihtimal\n   tartışılmaktadır: (i) özelgenin verildiği tarihte de kanuna aykırı olduğu; (ii)\
    \ İdarenin, uygulama tarzına ilişkin\n   görüşünü 2026'da yayımladığı bir sirkülerle değiştirdiği.\n\n**İstenenler:**\n\
    \n(a) Geçici verginin mahsup edilmemesinin niteliğini, düzeltme yolunu ve düzeltme sonrasında ödenecek ikinci taksit\n\
    tutarını belirleyiniz. (7 puan)\n\n(b) Terkinin şartlarını açıklayınız; terkin edilecek ve ödenecek tutarları hesaplayınız.\
    \ (8 puan)\n\n(c) Özelgeye ilişkin iki ihtimalde vergi, ceza ve gecikme faizi yönünden sonuçları açıklayınız. (6 puan)\n\
    \n(d) 6183 sayılı Kanun md. 105'in bu olaya uygulanıp uygulanmayacağını ve sel felaketinin vergi ödevlerine etkisini\n\
    açıklayınız. (4 puan)\n"
  cozum: "**(a) Mahsup hatası**\n\n- Beyannamede mahsubun yapılmaması **vergi miktarında hatadır** (hesap hatası, VUK md.\
    \ 117/2).\n- Mükellef beyanına karşı dava açamaz, ancak vergi hatası hükümleri saklıdır (md. 378/2): Bay Ova vergi dairesinden\n\
    \  **yazılı düzeltme** ister (md. 122); hata açık olduğundan müdür kararıyla **düzeltme fişi** düzenlenir (md. 120).\n\
    - Doğru vergi: 500.000 − 60.000 = **440.000 TL**; ödenen 250.000 TL düşüldüğünde ikinci taksit **190.000 TL** olur.\n\n\
    **(b) Terkin (VUK md. 115)**\n\n- Şartlar: yangın, su basması, sel gibi afetler yüzünden varlıkların **en az üçte birinin**\
    \ kaybedilmesi (%40 ≥ %33,3);\n  terkin konusu borçların afetin zarar verdiği **gelir kaynağı ile ilgili** vergi borçları\
    \ ve vergi cezaları olması;\n  zarar derecesinin mahallî idare heyetlerince tespiti; Bakanlığın (veya yetki devrettiği\
    \ mahallin) **zararla\n  orantılı** terkini.\n- Terkin: gelir vergisi 190.000 × %40 = **76.000 TL**; usulsüzlük cezası\
    \ 10.000 × %40 = **4.000 TL**.\n- Ödenecek: 190.000 − 76.000 = 114.000 TL vergi + 10.000 − 4.000 = 6.000 TL ceza = **120.000\
    \ TL**.\n\n**(c) Özelge (VUK md. 369, 413)**\n\n- (i) Yetkili makamın mükellefe yazıyla **yanlış izahat** vermesi hâlinde\
    \ vergi cezası kesilmez ve **gecikme faizi\n  hesaplanmaz**; ancak eksik kalan **80.000 TL vergi aslı** tarh edilir (md.\
    \ 369/1).\n- (ii) Bir hükmün uygulanma tarzına ilişkin görüşün **genel tebliğ veya sirküler değişikliğiyle** değiştirilmesi\n\
    \  hâlinde yeni görüş yayım tarihinden itibaren geçerlidir ve **geriye dönük uygulanamaz** (md. 369/2): 2024 yılı\n  için\
    \ vergi farkı aranamaz, ceza ve faiz de doğmaz. (Bu hüküm yargıca iptal edilen tebliğ ve sirkülerlere\n  uygulanmaz.)\n\
    \n**(d) 6183 md. 105 ve mücbir sebep**\n\n- 6183 md. 105 afet nedeniyle amme alacaklarının Cumhurbaşkanı kararıyla terkinini\
    \ düzenler (afetten itibaren 6 ay\n  içinde başvuru); ancak **VUK kapsamına giren** amme alacakları hakkında **VUK md.\
    \ 115** uygulanır. Gelir vergisi ve\n  usulsüzlük cezası VUK kapsamında olduğundan terkin md. 115'e göre yapılır.\n- Sel,\
    \ vergi ödevlerinin yerine getirilmesine engel olduğu ölçüde **mücbir sebeptir** (md. 13/2): süreler işlemez,\n  tarh\
    \ zamanaşımı uzar ve bu süredeki ödevler için ceza kesilmez (md. 15, 373).\n"
