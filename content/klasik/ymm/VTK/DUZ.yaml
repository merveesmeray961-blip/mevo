  soru: '(V) A.Ş. Ocak 2026 dönemi KDV beyannamesinde 480.000 TL olan indirilecek KDV''yi yanlışlıkla 48.000 TL olarak

    beyan etmiş ve 432.000 TL fazla vergi ödemiştir. İlgili belgeler Ocak 2026''da kanuni defterlere kaydedilmiştir. Şirket
    hatayı

    20.07.2026 tarihinde fark etmiştir; hakkında başlamış bir inceleme yoktur.


    (a) Hatanın VUK''taki niteliğini ve hangi tarihe kadar düzeltilebileceğini açıklayınız. (4 puan)

    (b) Şirketin fazla ödenen vergiyi geri almak için izleyebileceği yolları, süreleri ve başvuru mercileriyle sırasıyla açıklayınız.
    (10 puan)

    (c) Şirket kendi beyanına karşı doğrudan vergi mahkemesinde dava açabilir mi? Gerekçesiyle açıklayınız; düzeltme sonucu
    iade için başvuru süresini belirtiniz. (6 puan)'
  cozum: "**(a)** İndirimin eksik gösterilmesi VUK md. 117/1 anlamında bir **hesap (matrah) hatasıdır**; sonuçta haksız yere\n\
    fazla vergi alınmıştır (md. 116). Vergi hataları zamanaşımı süresi içinde düzeltilebilir (md. 126); Ocak 2026 KDV alacağı\n\
    2026'da doğduğundan zamanaşımı **31.12.2031**'de dolar.\n\n**(b)**\n1. **Düzeltme beyannamesi:** Şirket Ocak 2026 dönemi\
    \ için indirimi 480.000 TL olarak gösteren **düzeltme beyannamesi** verir;\n   düzeltme sonucu doğan **432.000 TL** fazla\
    \ ödeme, mahsup veya iade talebiyle geri alınır. Kendi lehine olan bu düzeltmede\n   vergi ziyaı söz konusu olmadığından\
    \ ceza ve pişmanlık zammı gündeme gelmez.\n2. **Düzeltme talebi:** Düzeltme beyannamesi yerine vergi dairesine yazılı\
    \ olarak **düzeltme talebinde** bulunabilir (md. 122);\n   talebi vergi dairesi müdürü karara bağlar ve hata düzeltme\
    \ fişiyle düzeltilir (md. 120).\n3. **Dava:** Düzeltme talebi reddedilirse şirket ret yazısının tebliğinden itibaren **30\
    \ gün** içinde vergi mahkemesinde dava\n   açabilir (İYUK md. 7).\n4. **Şikâyet:** Düzeltme talebi, verginin tahakkukuna\
    \ karşı dava açma süresi geçtikten sonra yapılmış ve reddedilmişse şirket\n   **şikâyet yoluyla Hazine ve Maliye Bakanlığına**\
    \ başvurabilir (md. 124). Somut olayda talep Temmuz 2026'da, yani dava\n   açma süresi geçtikten sonra yapılacağından\
    \ ret hâlinde bu yol da açıktır.\n\n**(c)** Hayır. Mükellefler beyan ettikleri matrahlara ve bunlar üzerinden tarh edilen\
    \ vergilere karşı dava açamaz; ancak vergi\nhatalarına ilişkin hükümler saklıdır (VUK md. 378). Bu nedenle yol düzeltme\
    \ talebi veya düzeltme beyannamesidir; dava ancak\ndüzeltme talebinin reddine karşı açılır. Düzeltme fişinin bir nüshası\
    \ mükellefe tebliğ edilir; mükellef tebliğden itibaren\n**bir yıl** içinde parasını geri almak için başvurmazsa hakkı\
    \ düşer (md. 120)."
