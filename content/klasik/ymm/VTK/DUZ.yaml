- id: YMM-VTK-DUZ-K001
  sinav: ymm
  ders: VTK
  konu: DUZ
  kazanimlar:
  - vergi hataları ve düzeltme (VUK md.116-126)
  - özelge ve beyana bağlılık
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: '(V) A.Ş. Ocak 2026 dönemi KDV beyannamesinde 480.000 TL olan indirilecek KDV''yi yanlışlıkla 48.000 TL olarak

    beyan etmiş ve fazla vergi ödemiştir. Şirket hatayı 20.07.2026 tarihinde fark etmiştir.


    (a) Bu hatanın VUK''taki niteliğini belirtiniz. (4 puan)

    (b) Şirketin izleyebileceği yolları sırasıyla ve süreleriyle açıklayınız. (10 puan)

    (c) Hata düzeltilirse fazla ödenen verginin iadesi için hangi süre içinde başvurulmalıdır? (6 puan)

    '
  cozum: '**(a)** İndirimin eksik gösterilmesi, VUK md. 117/1 anlamında bir **matrah (hesap) hatasıdır**; sonuçta haksız yere

    fazla vergi alınmıştır (md. 116).


    **(b)** Mükellef beyanına karşı doğrudan dava açamaz (VUK md. 378); önce vergi dairesinden **yazılı düzeltme**

    ister (md. 122). Talep reddedilirse ret yazısının tebliğinden itibaren **30 gün** içinde vergi mahkemesinde dava

    açar (İYUK md. 7). Dava süresi geçtikten sonra reddedilen talepler için **Hazine ve Maliye Bakanlığına şikâyet**

    yoluna başvurulur (md. 124). Hata zamanaşımı süresi içinde (2026 alacağı için 31.12.2031''e kadar) düzeltilebilir.


    **(c)** Düzeltme fişinin bir nüshası mükellefe tebliğ edilir; mükellef tebliğden itibaren **bir yıl** içinde

    başvurmazsa iade hakkı düşer (md. 120).

    '
  puanlama:
  - olcut: Hatanın hesap (matrah) hatası olarak nitelendirilmesi
    puan: 4
  - olcut: Beyana karşı doğrudan dava açılamayacağının ve düzeltme talebinin açıklanması
    puan: 4
  - olcut: Red üzerine 30 gün içinde dava ve sonrasında şikâyet yolunun belirtilmesi
    puan: 6
  - olcut: İade için bir yıllık başvuru süresinin belirtilmesi
    puan: 6
