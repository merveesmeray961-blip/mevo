- id: YMM-VTK-DUZ-K002
  sinav: ymm
  ders: VTK
  konu: DUZ
  kazanimlar:
  - vergi hataları ve düzeltme (VUK md.116-126)
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Olay:** Ticari kazanç sahibi **Bay Erkan Aydın** ile ilgili 2026 yılı olayları aşağıdadır.\n\n1. Bay Aydın Şubat\
    \ 2026 KDV beyannamesinde ödenecek KDV'yi 120.000 TL olarak beyan etmiş; vergi dairesinde veri\n   girişi hatası nedeniyle\
    \ tahakkuk fişi 210.000 TL olarak düzenlenmiş ve Bay Aydın 210.000 TL ödemiştir.\n2. Nisan 2026 muhtasar beyannamesi sistem\
    \ hatasıyla iki kez gönderilmiş, ikisi de tahakkuk etmiş ve 45.000 TL\n   iki kez ödenmiştir.\n3. Vergi dairesi, Bay Aydın'ın\
    \ aynı adı taşıyan (T.C. kimlik numarası farklı) kuzenine ait bir usulsüzlük cezası\n   ihbarnamesini Bay Aydın adına\
    \ düzenleyip tebliğ etmiştir.\n4. Vergi dairesi, Bay Aydın'ın yurt dışındaki bir firmaya verdiği hizmetten yurt dışında\
    \ yararlanılmadığı görüşüyle\n   hizmet ihracı istisnasını kabul etmeyerek ikmalen KDV tarh etmiştir; yararlanma yerinin\
    \ neresi olduğu taraflar\n   arasında tartışmalıdır. Bay Aydın bunun \"mevzuda hata\" olduğunu ileri sürerek düzeltme\
    \ istemektedir.\n5. Bay Aydın'ın 2020 yılına ait gelir vergisi ihbarnamesi 2025 yılında ilan yoluyla tebliğ edilmiş, dava\
    \ konusu\n   yapılmadan tahakkuk etmiş; ödeme emri 10.03.2026'da tebliğ edilmiştir. Bay Aydın 15.10.2026'da ihbarnamede\n\
    \   matrahın 580.000 TL yerine 850.000 TL olarak yazıldığını fark etmiştir.\n\n**İstenenler:**\n\n(a) 1–4. olayların VUK'taki\
    \ niteliğini belirleyiniz; hangilerinin vergi hatası olduğunu gerekçesiyle açıklayınız. (10 puan)\n\n(b) Vergi hatalarının\
    \ hangi yollarla ortaya çıkabileceğini, düzeltmeye kimin karar vereceğini, düzeltmenin nasıl\nyapılacağını ve fazla alınan\
    \ verginin iadesi için süreyi açıklayınız. (5 puan)\n\n(c) 5. olaydaki hatanın düzeltilip düzeltilemeyeceğini zamanaşımı\
    \ açısından değerlendiriniz. (5 puan)\n\n(d) Düzeltme talebinin reddedilmesi hâlinde Bay Aydın'ın başvurabileceği yolları\
    \ ve yargıdan geçmiş işlemlerde\ndüzeltme imkânını açıklayınız. (5 puan)\n"
  cozum: "**(a) Nitelik (VUK md. 116–118)**\n\n- Olay 1: Tahakkuk fişinde verginin fazla gösterilmesi **vergi miktarında hatadır**\
    \ (hesap hatası, md. 117/2);\n  fazla alınan 90.000 TL düzeltilir.\n- Olay 2: Aynı vergi kanununun uygulanmasında aynı\
    \ dönem ve matrah üzerinden birden fazla vergi alınması\n  **verginin mükerrer olmasıdır** (hesap hatası, md. 117/3);\
    \ 45.000 TL iade edilir.\n- Olay 3: Verginin asıl borçlusu yerine başka bir kişiden istenmesi **mükellefin şahsında hatadır**\
    \ (vergilendirme\n  hatası, md. 118/1); ihbarname Bay Aydın adına terkin edilir, gerçek borçlu adına yeniden işlem yapılır.\n\
    - Olay 4: \"Mevzuda hata\" ancak **açık olarak** vergi mevzuuna girmeyen veya vergiden müstesna işlemlerden vergi\n  istenmesidir\
    \ (md. 118/3). İstisna şartının gerçekleşip gerçekleşmediği tartışmalı ve hukuki değerlendirme\n  gerektirdiğinden bu\
    \ bir **vergi hatası değil, uyuşmazlıktır**; çözüm yeri düzeltme değil **dava** (30 gün) ve\n  cezalar için uzlaşmadır.\n\
    \n**(b) Düzeltme usulü (md. 119–122)**\n\n- Hatalar ilgili memurun görmesi, üst memur incelemesi, teftiş, vergi incelemesi\
    \ veya **mükellefin müracaatı** ile\n  ortaya çıkar (md. 119).\n- Düzeltmeye **vergi dairesi müdürü** (başkanlıklarda\
    \ başkan veya yetki devrettiği müdür) karar verir; hata\n  **düzeltme fişiyle** düzeltilir. Fazla alınan vergi iade edilir;\
    \ fişin bir nüshası mükellefe tebliğ edilir ve\n  mükellef tebliğden itibaren **bir yıl** içinde başvurmazsa iade hakkı\
    \ düşer (md. 120).\n- İdarece tereddüt edilmeyen **açık ve mutlak** hatalar (olay 1–3) resen düzeltilir (md. 121); mükellef\
    \ de yazıyla\n  (posta ile taahhütlü dahil) düzeltme isteyebilir (md. 122).\n\n**(c) Düzeltme zamanaşımı (md. 126)**\n\
    \n- 2020 gelir vergisinin tarh zamanaşımı 31.12.2025'te dolmuştur; zamanaşımından sonra ortaya çıkan hatalar kural\n \
    \ olarak düzeltilemez.\n- Ancak **ilan yoluyla tebliğ edilip dava konusu yapılmadan tahakkuk eden** vergilerde düzeltme\
    \ zamanaşımı, ödeme\n  emrinin tebliğ edildiği tarihten itibaren **bir yıldan aşağı olamaz** (md. 126/b): son tarih **10.03.2027**.\n\
    - Matraha ait rakamın fazla gösterilmesi **matrah hatasıdır** (md. 117/1; 270.000 TL fazla matrah). 15.10.2026'daki\n\
    \  talep süresindedir; fazla tarh edilen vergi terkin, ödenmişse iade edilir.\n\n**(d) Red ve sonrası (md. 121–125)**\n\
    \n- Düzeltme talebi reddedilirse karar yazıyla tebliğ edilir (md. 123); mükellef ret işlemine karşı **30 gün** içinde\n\
    \  vergi mahkemesinde dava açabilir.\n- Vergi mahkemesinde dava açma süresi geçtikten sonra yaptığı düzeltme talebi reddedilen\
    \ mükellef **Hazine ve\n  Maliye Bakanlığına şikâyet** yoluyla başvurabilir (md. 124).\n- Yargı mercilerinden geçmiş işlemlerde,\
    \ kararlar kesinleşmiş olsa bile, **hata hakkında yargı mercilerince karar\n  verilmemişse** düzeltme yapılabilir (md.\
    \ 125).\n"
