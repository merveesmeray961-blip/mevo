  sinav: ymm
  ders: VTK
  konu: DUZ
  kazanimlar:
  - hesap ve vergilendirme hatalarının sınıflandırılması
  - re'sen düzeltme
  - yargı kararından sonra düzeltme
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: '**Olay:** 2026 yılında vergi dairesince şu işlemler tespit edilmiştir:


    1. Bir kurumlar vergisi beyannamesinde matraha ait indirim rakamı yanlış hesaplanmış, matrah fazla gösterilmiştir.

    2. Vergi nispeti yanlış uygulanmış, mahsuplar yapılmamıştır.

    3. Aynı mükelleften aynı vergi için aynı matrah üzerinden iki kez vergi istenmiştir.

    4. Bir verginin asıl borçlusu yerine başka bir kişiden vergi istenmiştir.

    5. Kanunla vergiden muaf tutulmuş bir vakıftan, muafiyet kapsamındaki faaliyeti nedeniyle vergi alınmıştır.

    6. 2022 yılı vergisi hakkında vergi mahkemesi, bölge idare mahkemesi ve Danıştaydan geçmiş bir dosyada hesap hatası olduğu
    sonradan anlaşılmıştır; hatalar hakkında bu mercilerce bir karar verilmemiştir.

    7. Vergi dairesi müdürü, idarece tereddüt edilmeyen açık ve mutlak bir hatayı mükellef aleyhine düzeltmiştir.


    **İstenenler:**


    (a) 1–5 numaralı olayların her birini vergi hatası türü bakımından (hesap/vergilendirme hatası ve alt türü) sınıflandırınız.
    (10 puan)


    (b) 6 numaralı olayda hatanın düzeltilip düzeltilemeyeceğini koşullarıyla açıklayınız. (6 puan)


    (c) 7 numaralı olayda mükellefin başvurabileceği yolu belirtiniz. (4 puan)


    (d) Hataların hangi yollarla meydana çıkarılabileceğini sayınız. (3 puan)

    '
  cozum: '**(a)**

    | No | Hata türü |

    |---|---|

    | 1 | Hesap hatası – **matrah hatası** (md. 117/1) |

    | 2 | Hesap hatası – **vergi miktarında hata** (nispetin yanlış uygulanması, mahsupların yapılmaması) (md. 117/2) |

    | 3 | Hesap hatası – **verginin mükerrer olması** (md. 117/3) |

    | 4 | Vergilendirme hatası – **mükellefin şahsında hata** (md. 118/1) |

    | 5 | Vergilendirme hatası – **mükellefiyette hata** (muaf kimseden vergi istenmesi) (md. 118/2) |


    **(b)** Yargı mercilerinden geçmiş muamelelerde vergi hataları bulunduğu takdirde bu hatalar, yargı kararları **kesinleşmiş
    olsa bile** düzeltilebilir; ancak düzeltmenin yapılabilmesi için **hatalar hakkında anılan yargı mercileri tarafından
    bir karar verilmemiş olması** şarttır (md. 125). Hatalar hakkında karar verilmediğinden düzeltme **yapılabilir**; ayrıca
    düzeltme zamanaşımı süresi (md. 126) dolmamış olmalıdır.


    **(c)** İdarece tereddüt edilmeyen açık ve mutlak vergi hataları re''sen düzeltilir. Kendi aleyhlerine düzeltme yapılan
    kimselerin düzeltmeye karşı **vergi mahkemesinde dava açma hakları mahfuzdur** (md. 121).


    **(d)** Vergi hataları: (1) ilgili memurun hatayı bulması veya görmesi, (2) üst memurların incelemeleri, (3) teftiş sırasında,
    (4) vergi incelenmesi sırasında, (5) mükellefin müracaatı ile meydana çıkarılabilir (md. 119).

    '
