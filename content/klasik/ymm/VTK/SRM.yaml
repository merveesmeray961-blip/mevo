  soru: '**Olay:** Mavi Tekstil Ltd. Şti. (sermaye payları: Ali Kaya %70, Veli Kaya %30) 2025 yılında tasfiyeye girmiş, tasfiye
    tamamlanarak 2026 yılında ticaret sicilinden silinmiştir. Silinmeden sonra yapılan incelemede aşağıdaki tarhiyat ve ceza
    kesme işlemleri gündeme gelmiştir:


    | Dönem | Kalem | Tutar |

    |---|---|---|

    | Tasfiye öncesi dönemler | Kurumlar vergisi | 600.000 TL |

    | Tasfiye öncesi dönemler | Vergi ziyaı cezası | 600.000 TL |

    | Tasfiye dönemi | Vergi ve ceza toplamı | 400.000 TL |


    Şirketin müdürü Veli Kaya''dır. Tasfiye memuru Bay Orhan Dal''dır. Tasfiye sonucunda ortaklara dağıtılan tutar 250.000
    TL''dir. Gecikme zammı ve faizi dikkate alınmayacaktır.


    **İstenenler:**


    (a) Tasfiye öncesi dönem tarhiyat ve ceza kesme işlemlerinin kimler adına yapılabileceğini, tasfiye dönemi için kimin
    adına yapılacağını belirtiniz. (7 puan)


    (b) Tasfiye öncesi dönemlere ilişkin amme alacağından ortakların sermaye hisseleri oranında sorumlu olacakları tutarları
    hesaplayınız. (8 puan)


    (c) Tasfiye döneminin 400.000 TL''lik alacağından tasfiye memurunun sorumluluğunun sınırını belirleyiniz. (7 puan)

    '
  cozum: '**(a)** Md. 10/5: Tasfiye edilerek ticaret sicilinden silinmiş mükelleflerin, tasfiye öncesi ve tasfiye dönemlerine
    ilişkin her türlü vergi tarhiyatı ve ceza kesme işlemi, müteselsilen sorumlu olmak üzere, **tasfiye öncesi dönemler için
    kanuni temsilcilerden** (burada müdür Veli Kaya), **tasfiye dönemi için tasfiye memurlarından** (Orhan Dal) herhangi biri
    adına yapılır.


    **(b)** Limited şirket ortakları, tasfiye öncesi dönemlerle ilgili amme alacaklarından şirkete koydukları sermaye hisseleri
    oranında sorumludur. Alacak = 600.000 + 600.000 = 1.200.000 TL.


    | Ortak | Pay | Sorumluluk |

    |---|---|---|

    | Ali Kaya | %70 | 840.000 TL |

    | Veli Kaya | %30 | 360.000 TL |


    **(c)** Tasfiye memurlarının sorumluluğu, tasfiye sonucu dağıtılan tutarla sınırlıdır: 400.000 TL alacağın tamamı için
    değil, en çok **250.000 TL** için sorumludur.


    Püf noktaları: (1) Tasfiye öncesi için kanuni temsilci, tasfiye dönemi için tasfiye memuru muhataptır. (2) Ortak sorumluluğu
    "sermaye hissesi oranında"dır, müteselsil değil. (3) Tasfiye memurunun tavanı dağıtılan tutardır.

    '
