    puan: 2
  - olcut: Şartlar yerine getirilmezse şirketin müşterek ve müteselsil sorumluluğu
    puan: 1
  - olcut: Şirketin vergi sorumlusu olması; 360.000 TL vergi ve 360.000 TL ceza
    puan: 3
  - olcut: Md. 11/3 müteselsil sorumluluk ve idarenin seçimi
    puan: 2
  - olcut: Md. 11/2 rücu
    puan: 1
  - olcut: Tarhiyatın kanuni temsilci adına müteselsil sorumlulukla yapılması
    puan: 2
  - olcut: Tasfiye memurunun dağıtılan tutarla sınırlı sorumluluğu
    puan: 1
  - olcut: Ortakların sermaye hissesi oranında sorumluluğu (800.000 / 200.000)
    puan: 2
  - olcut: Kanuni temsilcinin şahsi sorumluluğu ve rücu hakkı
    puan: 1
