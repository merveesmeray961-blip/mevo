- id: YMM-VTK-SRM-K002
  sinav: ymm
  ders: VTK
  konu: SRM
  kazanimlar:
  - VUK mükerrer 257 teminat uygulaması
  - müteselsil sorumluluk (VUK md.11 ve 6183 md.35)
  - vergi sorumlusu ve kanuni temsilcilerin sorumluluğu (VUK md.8 ve 10)
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "**Olay:** LPG piyasasında lisanslı dağıtım faaliyeti yürüten **Mavi Petrol Dağıtım A.Ş.** ile ilgili 2026 yılı\n\
    bilgileri aşağıdadır. 2026 yılı tutarları 588 Sıra No.lu VUK Genel Tebliğine göre uygulanacaktır.\n\n1. Şirketin faaliyeti\
    \ devam etmektedir; 2025 hesap dönemine ait brüt satışları toplamı 45.000.000.000 TL'dir.\n   Hazine ve Maliye Bakanlığı\
    \ şirketten VUK mükerrer md. 257/1-8 uyarınca teminat istemeyi değerlendirmektedir.\n   Şirketin 2026'da kurduğu ve LPG\
    \ lisansı alarak yeni işe başlayan iştiraki Mavi Gaz Ltd. Şti. de aynı kapsamdadır.\n2. Bay Cem Öz, 2023'te başkaca faaliyeti\
    \ olmadan münhasıran sahte belge düzenlemek amacıyla kurduğu Öz Ticaret Ltd.\n   Şti.'nin %60 ortağı ve müdürüdür; şirketin\
    \ düzenlediği sahte belgelerin toplam tutarı vergi inceleme raporuyla\n   9.000.000 TL olarak tespit edilmiş, mükellefiyeti\
    \ terkin edilmiştir. Bay Öz 10.03.2026'da Mavi Petrol Dağıtım\n   A.Ş.'nin %15 ortağı ve yönetim kurulu üyesi olmuş; durum\
    \ 01.04.2026'da vergi dairesinin ıttılaına girmiştir.\n3. Şirket Mart 2026'da bir özel güvenlik şirketinden 2.000.000\
    \ TL + 400.000 TL KDV tutarında hizmet almıştır.\n   İşlem 9/10 oranında KDV tevkifatına tabidir; şirket tevkifat yapmadan\
    \ 2.400.000 TL'yi güvenlik şirketine ödemiş,\n   güvenlik şirketi de KDV'yi beyan etmemiştir.\n4. Şirketin %80, Bay Kaan\
    \ Tok'un %20 ortağı olduğu Mavi Lojistik Ltd. Şti. 2025'te tasfiye edilerek ticaret\n   sicilinden silinmiştir. Tasfiye\
    \ öncesi dönemde şirketin müdürü (kanuni temsilcisi) Bay Levent Ak, tasfiye memuru\n   Bay Okan Er'dir; tasfiye sonunda\
    \ ortaklara toplam 300.000 TL dağıtılmıştır. 2026 incelemesinde, tasfiye öncesi\n   2023 dönemine ilişkin 1.000.000 TL\
    \ vergi ve ceza tarhiyatı gerektiği tespit edilmiştir.\n\n**İstenenler:**\n\n(a) Mavi Petrol Dağıtım A.Ş. ve Mavi Gaz\
    \ Ltd. Şti.'den istenebilecek azami teminat tutarlarını ve kabul edilecek\nteminat türlerini açıklayınız. (6 puan)\n\n\
    (b) Bay Öz'ün ortaklığı nedeniyle Mavi Petrol Dağıtım A.Ş.'den istenecekleri, teminat tutarını ve şartlar yerine\ngetirilmezse\
    \ doğacak sonucu açıklayınız. (7 puan)\n\n(c) Güvenlik hizmetine ilişkin KDV tevkifatında sorumluluğu, aranacak vergi\
    \ ve cezayı ve müteselsil sorumluluğu\naçıklayınız. (6 puan)\n\n(d) Mavi Lojistik Ltd. Şti.'ye ilişkin tarhiyatın kimin\
    \ adına yapılacağını ve ilgililerin sorumluluk sınırlarını\naçıklayınız. (6 puan)\n"
  cozum: "**(a) Mükerrer md. 257/1-8 teminatı**\n\n- Lisansa tabi faaliyette bulunanlardan, doğacak vergilerin tahsil güvenliği\
    \ için **faaliyeti devam edenlerde**\n  790.000.000 TL'yi (2026) geçmemek üzere bir önceki hesap dönemi **brüt satışlarının\
    \ %1'ine kadar** teminat\n  alınabilir: 45.000.000.000 × %1 = **450.000.000 TL** (< 790.000.000 TL) → azami tutar 450.000.000\
    \ TL.\n- **Yeni işe başlayan** Mavi Gaz Ltd. Şti.'den **79.000.000 TL'ye kadar** teminat alınabilir.\n- Teminat, 6183\
    \ sayılı Kanunun 10. maddesinde sayılan türlerden **menkul mallar hariç** olmak üzere alınır (para,\n  süresiz ve şartsız\
    \ teminat mektubu, Devlet iç borçlanma senedi, millî esham ve tahvilat, gayrimenkul). Bakanlık\n  mükelleflerin durumuna\
    \ göre teminatın türünü, tutarını, zamanını belirlemeye; oran ve tutarları sıfıra kadar\n  indirmeye ve beş katına kadar\
    \ artırmaya yetkilidir. Zorunluluğa uymayanlara mük. md. 355 cezası uygulanır.\n\n**(b) VUK md. 153/A**\n\n- Bay Öz, münhasıran\
    \ sahte belge düzenlemek amacıyla mükellefiyet tesis ettirildiği raporla tespit edilen şirketin\n  kanuni temsilcisi ve\
    \ en az %10 ortağı olduğundan md. 153/A/1 kapsamındadır.\n- Bu kişinin mükellefiyeti bulunan bir ticaret şirketinin yönetim\
    \ kurulu üyesi veya en az %10 ortağı olması\n  hâlinde, keyfiyetin vergi dairesinin ıttılaına girmesini müteakiben, **60\
    \ gün** içinde md. 153/A/1'deki şartların\n  yerine getirilmesi (Bay Öz'ün ve terkin edilen şirketin tüm vergi borçlarının\
    \ ödenmesi ve teminat verilmesi) veya\n  aynı sürede Bay Öz'ün **statüsünün sonlandırılması** şirketten yazılı olarak\
    \ istenir (md. 153/A/3).\n- Teminat: sahte belge tutarının %10'u, 1.200.000 TL'den az ve 17.000.000 TL'den fazla olamaz:\
    \ 9.000.000 × %10 =\n  900.000 TL < 1.200.000 TL → **1.200.000 TL**; teminat 6183 md. 10/1-(1), (2), (3) türünden (para,\
    \ teminat mektubu,\n  Devlet iç borçlanma senedi) olmalıdır.\n- Süre içinde şartlar yerine getirilmez ve statü devam ederse,\
    \ Bay Öz'ün teminat isteme tarihi itibarıyla tahakkuk\n  etmiş tüm vergi borçları, **şirket müşterek ve müteselsil sorumlu**\
    \ olmak üzere 6183'e göre takip edilir; 60 gün\n  içinde statüyü sona erdirmeye yönelik yasal girişim başlatılıp sonuçlandırılırsa\
    \ şirket sorumlu tutulmaz.\n\n**(c) KDV tevkifatı (VUK md. 8, 11; KDVK md. 9)**\n\n- Şirket, hizmet alımında KDV'nin 9/10'unu\
    \ kesip sorumlu sıfatıyla beyan etmekle yükümlü **vergi sorumlusudur**;\n  verginin ödenmesi bakımından vergi dairesine\
    \ karşı muhataptır (md. 8/2) ve verginin tam kesilip ödenmesinden\n  sorumludur (md. 11/1).\n- Aranacak vergi: 400.000\
    \ × 9/10 = **360.000 TL**; sorumlu adına bir kat vergi ziyaı cezası **360.000 TL** (md. 344).\n- Hizmet ifası dolayısıyla\
    \ kesinti yapmak zorunda olanın bu ödevi yerine getirmemesi hâlinde işleme taraf olanlar\n  (güvenlik şirketi) **müteselsilen\
    \ sorumludur** (md. 11/3); idare alacağın tamamını taraflardan dilediğine\n  yöneltebilir. Şirket ödediği vergi için asıl\
    \ mükellefe **rücu** edebilir (md. 11/2).\n\n**(d) Tasfiye edilmiş şirket (VUK md. 10; 6183 md. 35, mük. md. 35)**\n\n\
    - Tasfiye edilerek sicilden silinen mükellefin **tasfiye öncesi dönemlerine** ilişkin tarhiyat ve ceza kesme işlemi,\n\
    \  müteselsilen sorumlu olmak üzere **kanuni temsilcilerden herhangi biri** adına yapılır → **Bay Levent Ak** adına.\n\
    \  Tasfiye memurları yalnız tasfiye dönemi için muhatap olur ve sorumlulukları **tasfiye sonucu dağıtılan tutarla\n  (300.000\
    \ TL)** sınırlıdır.\n- Limited şirket ortakları tasfiye öncesi dönemlere ilişkin alacaklardan **sermaye hisseleri oranında**\
    \ sorumludur:\n  Mavi Petrol Dağıtım A.Ş. 1.000.000 × %80 = **800.000 TL**; Bay Kaan Tok 1.000.000 × %20 = **200.000 TL**.\n\
    - Kanuni temsilci, ödevini yerine getirmemesi nedeniyle tüzel kişiden alınamayan alacaktan kendi mal varlığıyla\n  sorumludur\
    \ ve ödediği tutar için asıl borçluya rücu edebilir; tasfiye bu sorumluluğu kaldırmaz.\n"
  puanlama:
  - olcut: Brüt satışın %1'i 450.000.000 TL ve 790.000.000 TL üst sınırı
