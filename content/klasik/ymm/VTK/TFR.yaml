    puan: 2
  - olcut: Örtülü sermayenin 1.000.000 TL bulunması ve borç verenlere dağılımı
    puan: 2
  - olcut: KKEG faizin 165.000 TL (85.000 + 80.000) hesaplanması
    puan: 2
  - olcut: Ahmet Bey'e dağıtılmış kâr payı, brüte tamamlama ve 15.000 TL kesinti
    puan: 3
  - olcut: Kuzey Bankası nezdinde kâr payı/iştirak kazancı ve düzeltme şartı
    puan: 2
  - olcut: Lacivert'in ilişkili kişi olduğunun gerekçelendirilmesi
    puan: 2
  - olcut: Maliyet artı yöntemiyle 400.000 TL örtülü kazanç ve Hazine zararı şartı
    puan: 3
  - olcut: Kâr payı sayılma, kurum nezdinde kesinti olmaması ve karşı taraf düzeltme şartı
    puan: 3
  - olcut: Toplam KKEG 565.000 TL ve vergi etkisi 141.250 TL
    puan: 3
