      döneminin son günü itibarıyla söz konusu tutarlar üzerinden kâr dağıtımına bağlı vergi kesintisinin yapılması gerekmektedir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
