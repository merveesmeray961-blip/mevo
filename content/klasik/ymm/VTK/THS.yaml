- id: YMM-VTK-THS-K003
  sinav: ymm
  ders: VTK
  konu: THS
  kazanimlar:
  - mahsup ve gecikme zammı
  - teminat ve tecil
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** **Atlas Lojistik A.Ş.**nin aynı tahsil dairesine olan ve VUK kapsamına giren borçları 15.06.2026

    itibarıyla aşağıdadır. Hiçbir borç için teminat gösterilmemiştir.


    | Kod | Alacak | Vade | Tutar (TL) |

    |---|---|---|---|

    | A | Mayıs 2026 muhtasar (beyanname 10.06.2026''da verilmiş) | 26.06.2026 | 400.000 |

    | B | 2021 yılında vadesi gelen kesinleşmiş kurumlar vergisi; zamanaşımını kesen işlem yapılmamış | 2021 | 300.000 (asıl
    240.000 + 15.06.2026''ya kadar gecikme zammı 60.000) |

    | C | Mart 2026 muhtasar | 27.04.2026 | 1.000.000 |

    | D | Mart 2026 KDV | 28.04.2026 | 6.000.000 |


    Şirket 15.06.2026''da hangi borca mahsup edileceğini belirtmeden rızaen 2.400.000 TL ödemiştir. Gecikme zammı oranı

    aylık %3,7''dir; tam aylar vade tarihine tekabül eden günden itibaren, ay kesirleri günlük (ay 30 gün) hesaplanacaktır.

    Şirketin 20.06.2026''da 500.000 TL nakden KDV iadesi alacağı doğmuştur. Şirket 01.07.2026''da kalan borçlarının

    tecilini istemiş; tecil tarihi itibarıyla gecikme zammı dahil tecili istenen toplam borç 14.400.000 TL''dir. 6183 md.

    48''deki teminat aranmayan tutar, 11414 sayılı Cumhurbaşkanı Kararı (RG 13.06.2026) ile 10.000.000 TL olarak

    uygulanmaktadır.


    **İstenenler:**


    (a) C ve D borçları için 15.06.2026''ya kadar işleyen gecikme zammını hesaplayınız. (6 puan)


    (b) 2.400.000 TL''lik ödemenin hangi alacaklara, hangi sırayla ve hangi tutarlarda mahsup edileceğini gösteriniz. (8 puan)


    (c) 500.000 TL KDV iadesinin nasıl yapılacağını açıklayınız. (3 puan)


    (d) Tecil talebinin şartlarını, gösterilmesi gereken teminat tutarını, tecilin süresini ve gecikme zammı ile tecil

    şartlarına uyulmamasının sonuçlarını açıklayınız. (8 puan)

    '
  cozum: "**(a) Gecikme zammı (6183 md. 51)**\n\n- C: 27.04–27.05 bir tam ay; 27.05–15.06 **19 gün**. 1.000.000 × %3,7 = 37.000\
    \ + 1.000.000 × %3,7 / 30 × 19 =\n  23.433,33 → **60.433,33 TL**; C toplamı 1.060.433,33 TL.\n- D: 28.04–28.05 bir tam\
    \ ay; 28.05–15.06 **18 gün**. 6.000.000 × %3,7 = 222.000 + 6.000.000 × %3,7 / 30 × 18 =\n  133.200 → **355.200 TL**; D\
    \ toplamı 6.355.200 TL.\n\n**(b) Mahsup sırası (6183 md. 47)**\n\nRızaen yapılan ödemeler sırasıyla: (1) ödeme süresi\
    \ başlamış, henüz vadesi geçmemiş alacaklar; (2) içinde bulunulan\ntakvim yılı sonunda zamanaşımına uğrayacak alacaklar;\
    \ (3) vadesi önce gelen ve teminatsız veya az teminatlı alacaklar.\nÖdeme alacak aslı ile fer'ilerinin tamamını karşılamazsa\
    \ mahsup asıl ve fer'ilere orantılı yapılır.\n\n| Sıra | Alacak | Gerekçe | Mahsup (TL) |\n|---|---|---|---|\n| 1 | A\
    \ | Ödeme süresi başlamış, vadesi geçmemiş | 400.000,00 |\n| 2 | B | Vadesi 2021 → zamanaşımı 31.12.2026'da dolacak |\
    \ 300.000,00 |\n| 3 | C | Vadesi önce gelen (27.04) teminatsız | 1.060.433,33 |\n| 4 | D | Kalan tutar | 639.566,67 |\n\
    \nD'ye mahsup edilen 639.566,67 TL asıl ve fer'iye orantılı dağıtılır: asıl 639.566,67 × 6.000.000 / 6.355.200 =\n**603.820,49\
    \ TL**; gecikme zammı 639.566,67 × 355.200 / 6.355.200 = **35.746,17 TL**.\n\n**(c) Ret ve mahsup (6183 md. 23)**\n\n\
    Tahsil edilip kanuni sebeplerle reddi gereken alacaklar, hak sahibinin aynı amme idaresine olan **muaccel\nborçlarına\
    \ mahsup edilerek** reddolunur; mahsuptan artan kısım ödenir. 20.06.2026'da D'den kalan vadesi geçmiş\nborç bulunduğundan\
    \ 500.000 TL iade alacağı bu borca mahsup edilir; nakden ödeme yapılmaz.\n\n**(d) Tecil (6183 md. 48, 52)**\n\n- Şartlar:\
    \ borcun vadesinde ödenmesinin veya haczin borçluyu **çok zor duruma** düşürmesi, **yazılı talep** ve\n  **teminat**;\
    \ alacaklı amme idaresince **72 ayı geçmemek üzere ve faiz alınarak** tecil edilebilir.\n- Teminat: tecil edilen borç\
    \ toplamı 10.000.000 TL'ye kadar teminat aranmaz; aşan kısmın **yarısı** kadar teminat\n  gösterilir: (14.400.000 − 10.000.000)\
    \ / 2 = **2.200.000 TL**. Haczedilmiş mal varsa değeri tutarınca teminat\n  yerine geçer.\n- Gecikme zammı tecilin yapıldığı\
    \ güne kadar uygulanır (md. 52); sonrasında tecil faizi alınır. Talep reddedilirse\n  idarece 30 güne kadar verilen sürede\
    \ ödenen borç, ödendiği tarihe kadar faiz alınarak tecil olunur.\n- Tecil şartlarına uyulmaması veya değerini kaybeden\
    \ teminatın tamamlanmaması hâlinde amme alacağı **muaccel** olur.\n"
  puanlama:
  - olcut: C için tam ay ve 19 gün, 60.433,33 TL
    puan: 3
  - olcut: D için tam ay ve 18 gün, 355.200 TL
