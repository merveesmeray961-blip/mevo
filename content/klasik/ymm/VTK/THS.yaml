    puan: 2
  - olcut: C'nin tamamen, D'nin kalanla asıl/fer'i orantılı kapatılması (603.820,49 / 35.746,17)
    puan: 3
  - olcut: İadenin muaccel borca mahsup edilerek yapılması
    puan: 3
  - olcut: Tecil şartları (çok zor durum, yazılı talep, teminat, 72 ay, faiz)
    puan: 3
  - olcut: 10.000.000 TL eşiği ve 2.200.000 TL teminat
    puan: 3
  - olcut: Gecikme zammının tecil gününe kadar işlemesi ve şartlara uyulmamada muacceliyet
    puan: 2
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 23, 47, 48, 51, 52, 102
  - mevzuat: 10556 ve 11414 sayılı Cumhurbaşkanı Kararları
    madde: gecikme zammı oranı; md. 48 tutarı
  gecerlilik:
    baslangic: '2026-06-13'
    bitis: null
  dogrulama:
    python: 'r = 0.037

      c = 1000000*r + 1000000*r/30*19

      d = 6000000*r + 6000000*r/30*18

      kalan = 2400000 - 400000 - 300000 - (1000000+c)

      dt = 6000000 + d

      sonuc = {"zam_C": round(c,2), "zam_D": round(d,2), "D_mahsup": round(kalan,2), "D_asil": round(kalan*6000000/dt,2),
      "D_zam": round(kalan*d/dt,2), "teminat": (14400000-10000000)/2}

      '
