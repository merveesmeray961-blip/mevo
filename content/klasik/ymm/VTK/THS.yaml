  - hacze iştirak ve satış bedelinin paylaşımı
  - rehinli alacaklılarla sıralama
  - iflasta amme alacağı
  zorluk: 3
  puan: 20
  sure_dk: 25
  soru: '**Olay:** **Boğaz Metal A.Ş.**nin 1.200.000 TL değerindeki bir makinesi, özel alacaklı **Yurt Ticaret Ltd. Şti.**
    tarafından 120.000 TL''lik alacağı için haczedilmiştir. Makine paraya çevrilmeden önce vergi dairesi, şirketin vadesi
    gelmiş 80.000 TL tutarındaki gelir idaresi alacağı için aynı makineye haciz koymuştur. Makine, giderler ihmal edilerek
    100.000 TL''ye satılmıştır.


    Başka bir olayda, aynı şirketin 1.000.000 TL''ye satılan taşınmazı üzerinde 700.000 TL tutarlı ipotek bulunmaktadır. Taşınmaza
    ilişkin 400.000 TL''lik emlak vergisi (bina vergisi) de ödenmemiştir.


    **İstenenler:**


    (a) Vergi dairesinin makine üzerindeki haczinin hukuki niteliğini belirtiniz. (4 puan)


    (b) Makinenin 100.000 TL''lik satış bedelinin hangi esasa göre ve hangi tutarlarla paylaşılacağını hesaplayınız. (6 puan)


    (c) Taşınmazın satış bedelinden ipotekli alacaklı ile emlak vergisi alacağı için ayrılacak tutarları hesaplayınız ve gerekçesini
    belirtiniz. (6 puan)


    (d) Şirketin iflası halinde amme alacaklarının hangi sırada işlem göreceğini belirtiniz. (4 puan)

    '
  cozum: '**(a)** Üçüncü şahıslar tarafından haczedilen mallar paraya çevrilmeden evvel o mal üzerine amme alacağı için de
    haciz konulursa bu alacak da **hacze iştirak eder** ve aralarında satış bedeli garameten taksim olunur (md. 21/1). Vergi
    dairesi ayrıca satış yapmak zorunda olmadan satış bedelinden pay alır.


    **(b)** Garameten taksim: toplam alacak 120.000 + 80.000 = 200.000 TL; bedel 100.000 TL.

    - Yurt Ticaret: 100.000 × 120.000 / 200.000 = **60.000 TL**

    - Vergi dairesi: 100.000 × 80.000 / 200.000 = **40.000 TL**


    **(c)** Rehinli alacaklıların hakları mahfuzdur; gümrük resmi, bina ve arazi vergisi gibi eşya ve gayrimenkulün aynından
    doğan amme alacakları o gayrimenkul bedelinden tahsilinde **rehinli alacaklardan sonra** gelir (md. 21). Satış bedeli
    1.000.000 TL: önce ipotekli alacak 700.000 TL; kalan 300.000 TL emlak vergisine ayrılır (alacak 400.000 TL; 100.000 TL
    açıkta kalır).


    **(d)** Borçlunun iflası, mirasın reddi ve terekenin resmî tasfiyeye tabi tutulması hallerinde amme alacakları imtiyazlı
    alacak olarak İcra ve İflas Kanunu md. 206''nın **üçüncü sırasında**, bu sıranın önceliğini alan alacaklar da dahil olmak
    üzere tüm imtiyazlı alacaklarla birlikte işleme tabi tutulur (md. 21).

    '
