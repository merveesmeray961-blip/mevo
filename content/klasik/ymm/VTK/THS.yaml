    Seçkin 800.000 TL için sorumlu tutulabilir. Tüzel kişilerin tasfiye haline girmiş veya tasfiye edilmiş olmaları, kanuni
    temsilcilerin **tasfiyeye giriş tarihinden önceki zamanlara ait sorumluluklarını kaldırmaz.** Temsilciler bu madde gereğince
    ödedikleri tutarlar için asıl amme borçlusuna **rücu edebilir**.


    **(d)** Bu madde hükmü yabancı şahıs veya kurumların Türkiye''deki **mümessilleri hakkında da uygulanır** (mük. md. 35).

    '
