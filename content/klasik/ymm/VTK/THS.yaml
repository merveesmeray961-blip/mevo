  soru: '**Olay:** **Deniz Gıda Ltd. Şti.**nin amme borcu 1.000.000 TL olup şirketin mal varlığından tahsil edilememiştir.
    Şirket ortakları sermayeye şu oranlarda katılmaktadır: **Bay Ahmet** %60, **Bayan Banu** %40. Banu, hissesini borcun doğumundan
    sonra 2026 yılında **Bay Cemal**''e devretmiştir. Ayrıca şirketin müdürü ve kanuni temsilcisi **Bay Mehmet**''tir.


    Bir başka olayda **Alp Anonim Şirketi**''nin 800.000 TL tutarlı amme borcu şirketin mal varlığından tamamen tahsil edilememiş,
    şirket 2025''te tasfiyeye girmiştir; borç tasfiyeye giriş tarihinden önceki döneme aittir. Şirketin kanuni temsilcisi
    **Bay Seçkin**''dir.


    **İstenenler:**


    (a) Tahsil edilemeyen 1.000.000 TL için Ahmet ve Banu''nun sorumluluk tutarlarını hesaplayınız ve sorumluluğun niteliğini
    belirtiniz. (6 puan)


    (b) Banu''nun hisse devrinin sorumluluğa etkisini ve devir sonrası Cemal''in durumunu açıklayınız. (6 puan)


    (c) Alp A.Ş.''nin amme borcu için Bay Seçkin''in sorumluluğunu ve tasfiyenin etkisini açıklayınız; ödeme yapan temsilcinin
    hakkını belirtiniz. (7 puan)


    (d) Bu hükmün yabancı şahıs veya kurumların Türkiye''deki mümessilleri bakımından uygulanıp uygulanmayacağını belirtiniz.
    (3 puan)

    '
  cozum: '**(a)** Limited şirket ortakları, şirketten tamamen veya kısmen tahsil edilemeyen veya tahsil edilemeyeceği anlaşılan
    amme alacağından **sermaye hisseleri oranında doğrudan doğruya sorumlu** olurlar ve Kanun hükümleri gereğince takibe tabi
    tutulurlar (md. 35/1). Ahmet: 1.000.000 × %60 = **600.000 TL**; Banu: 1.000.000 × %40 = **400.000 TL**.


    **(b)** Ortağın şirketteki sermaye payını devretmesi halinde payı devreden ve devralan şahıslar, devir öncesine ait amme
    alacaklarının ödenmesinden **müteselsilen** sorumlu tutulur (md. 35/2). Bu nedenle Banu''nun payına isabet eden 400.000
    TL için hem Banu hem Cemal müteselsilen sorumludur; devir Banu''yu sorumluluktan kurtarmaz.


    **(c)** Tüzel kişilerin mal varlığından tamamen veya kısmen tahsil edilemeyen veya tahsil edilemeyeceği anlaşılan amme
