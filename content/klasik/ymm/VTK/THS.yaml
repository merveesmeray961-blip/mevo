  soru: "**Olay:** Kuyumculuk yapan tacir **Bay Kemal Şen**'in vadesi geçmiş ve kesinleşmiş 900.000 TL vergi borcu\n(gecikme\
    \ zammı hariç) bulunmaktadır.\n\n1. Ödeme emri 02.03.2026'da tebliğ edilmiş; Bay Şen 15 gün içinde ne borcunu ödemiş ne\
    \ de mal bildiriminde\n   bulunmuş, itiraz da etmemiştir.\n2. 25.03.2026'da yapılan hacizde şu durumlar ortaya çıkmıştır:\n\
    \   - Dükkândaki kuyum tezgâhı ve el aletleri ile evdeki buzdolabı ve yatak takımları haczedilmek istenmiştir.\n   - Bay\
    \ Şen'in evinde birlikte yaşadığı eşi, ruhsatı Bay Şen adına olan ve evin garajında bulunan otomobilin\n     kendisine\
    \ ait olduğunu ileri sürmüş; iddia haciz zaptına geçirilmiştir.\n   - Bay Şen'in bir galeride satışa bıraktığı ikinci\
    \ otomobil haczedilmiş; galeri sahibi aracı satın aldığını ileri\n     sürmüştür.\n   - Bay Şen'e ait dükkân (gayrimenkul)\
    \ haczedilmiş, değeri 600.000 TL olarak biçilmiştir.\n3. Bay Şen, dükkân üzerindeki haczin 6183 sayılı Kanunun 74/A maddesi\
    \ uyarınca kaldırılmasını istemektedir;\n   hacze karşı açılmış bir davası yoktur. Bay Şen'in Maliye Bakanlığına bağlı\
    \ tahsil dairelerine olan muaccel\n   borçlarının toplamı 900.000 TL'nin üzerindedir.\n4. Vergi dairesi Bay Şen'in iflasını\
    \ istemeyi düşünmekte; Bay Şen ise ticaret mahkemesine konkordato projesi sunmuş\n   olup projenin tasdik edilmesi beklenmektedir.\n\
    \n**İstenenler:**\n\n(a) Ödeme emrinin tebliğinden sonra Bay Şen'in hak ve ödevlerini ve 15 günlük sürede hiçbir işlem\
    \ yapmamasının\nsonuçlarını açıklayınız. (6 puan)\n\n(b) Haczedilmek istenen malları ve ileri sürülen istihkak iddialarını\
    \ süreleriyle birlikte değerlendiriniz. (9 puan)\n\n(c) Md. 74/A uyarınca haczin kaldırılması için ödenmesi gereken tutarı,\
    \ şartları ve sonuçlarını açıklayınız. (5 puan)\n\n(d) İflas yolunun ve konkordatonun amme alacağına etkisini açıklayınız.\
    \ (5 puan)\n"
  cozum: "**(a) Ödeme emri sonrası (6183 md. 55, 58, 60)**\n\n- Borçlu tebliğden itibaren **15 gün** içinde borcu ödemek veya\
    \ **mal bildiriminde** bulunmak zorundadır; aynı sürede\n  borcu olmadığını, kısmen ödediğini veya zamanaşımına uğradığını\
    \ **vergi itiraz komisyonu** nezdinde ileri\n  sürebilir (komisyon 7 gün içinde kesin karar verir).\n- Süresinde ödeme\
    \ ve mal bildirimi yapmayan borçlu, tahsil dairesinin yazılı talebi üzerine **icra tetkik mercii\n  hâkimi** kararıyla,\
    \ mal bildiriminde bulununcaya kadar **bir defaya mahsus ve üç ayı geçmemek üzere hapisle\n  tazyik** edilir; karar Cumhuriyet\
    \ savcılığınca infaz edilir (md. 60).\n- Mal bildiriminde bulunmamak ihtiyati haciz sebebidir (md. 13/5); tahsil dairesi\
    \ tespit ettiği malları haczeder\n  (md. 62). Ödeme emri tebliği tahsil zamanaşımını keser (md. 103).\n\n**(b) Haciz ve\
    \ istihkak**\n\n- Haczedilemeyen mallar (md. 70): borçlunun **sanat ve mesleği için gerekli alet ve edevatı** (kuyum tezgâhı\
    \ ve el\n  aletleri, md. 70/4), **pek lüzumlu ev eşyası** (buzdolabı, md. 70/3) ve borçlu ile ailesine gerekli **yatak\n\
    \  takımları** (md. 70/2) haczedilemez.\n- Eşin iddiası: borçlu ile birlikte ikamet eden kişinin istihkak iddiasında mal\
    \ **borçlunun elinde sayılır** (md. 67/2)\n  ve md. 66 uygulanır: iddia haciz zaptına geçirilir ve borçluya bildirilir.\
    \ Tahsil dairesi haciz zaptını aldığı\n  tarihten itibaren **7 gün** içinde iddiayı reddetmezse kabul etmiş sayılır; reddederse\
    \ 7 gün içinde mahkemeye\n  başvurması gerektiği eşe bildirilir, süresinde dava açılmazsa iddiadan vazgeçilmiş sayılır.\n\
    - Galeri sahibinin iddiası: mal **üçüncü şahıs elindedir** (md. 67/1). Malın borçluya ait olduğunu iddia eden tahsil\n\
    \  dairesi durumu alacaklı amme idaresine bildirir; idare bildirme tarihinden itibaren **15 gün** içinde dava açmazsa\n\
    \  istihkak iddiası kabul edilmiş sayılır.\n- İstihkak davalarına haczi yapan tahsil dairesinin bulunduğu yer mahkemesi\
    \ bakar; davacı teminat göstererek takibin\n  tehirini isteyebilir; tehir kararı verilip dava reddedilirse mahcuz mal\
    \ değerinin %10'u tazminata hükmolunur\n  (md. 68). İstihkak iddia edilen malların haczi en sonraya bırakılır (md. 62).\n\
    \n**(c) Haczin kaldırılması (6183 md. 74/A)**\n\n- Şartlar: mahcuz malın md. 10/5'teki mallardan olması; mala biçilen\
    \ değer ile %10 fazlasının ilk sırada haciz\n  uygulayan tahsil dairesine ödenmesi: 600.000 × 1,10 = **660.000 TL** (bu\
    \ tutar Maliyeye bağlı dairelere olan\n  muaccel borç toplamını aşamaz; 900.000 TL'den azdır); takip masraflarının ayrıca\
    \ ödenmesi; hacze karşı dava\n  açılmaması veya açılan davadan vazgeçilmesi.\n- Sonuç: haciz kaldırılır; haczin kaldırıldığı\
    \ tarihten itibaren **üç ay** süreyle aynı mala (md. 13 saklı kalmak\n  üzere) haciz uygulanamaz; ödenen tutar takip konusu\
    \ ve muaccel borçlara mahsup edilir.\n\n**(d) İflas ve konkordato (6183 md. 52, 54, 100, 101)**\n\n- Şartları varsa amme\
    \ alacağı için İcra ve İflas Kanunu hükümlerine göre borçlunun **iflası istenebilir** (md. 54/3,\n  md. 100). İflasın\
    \ açıldığı gün gecikme zammı durur (md. 52); alacak iflas masasına imtiyazlı alacak olarak\n  yazdırılır (md. 21).\n-\
    \ **Tasdik edilen konkordato amme alacakları için mecburi değildir** (md. 101); konkordato tasdik edilse bile amme\n \
    \ alacağı tam olarak takip edilir.\n"
