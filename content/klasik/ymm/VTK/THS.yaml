    pek lüzumlu mutfak takımı haczedilmek istenmektedir.

    4. **Bay Deniz Tekin**, haczedilmiş bir makineyi tahsil dairesinin onayı olmadan sattığını ve alıcı **Bay Ege**''nin makineyi
    iyi niyetle ve zilyetlik hükümlerine dayanarak satın aldığını ileri sürmektedir.


