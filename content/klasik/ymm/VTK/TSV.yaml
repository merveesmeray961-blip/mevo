  dogrulama:
    python: 'pay = 16000000 / 20000000

      kazanc_ih = 16000000 - 6000000 - 3000000 * pay

      ind_g = kazanc_ih * 0.80

      r = 0.40 * 0.50

      ind_n = 3000000 * r * 10 / 12 + 6000000 * r * 4 / 12

      kk = 9000000 + 300000

      matrah = kk - ind_g - ind_n

      kv = matrah * 0.25

      asgari = kk * 0.10

      sonuc = {''ihracat_kazanci'': round(kazanc_ih), ''ind_g'': round(ind_g), ''ind_n'': round(ind_n), ''matrah'': round(matrah),
      ''kv'': round(kv), ''asgari'': round(asgari), ''hesaplanan'': round(max(kv, asgari)), ''fark'': round(max(kv, asgari)
      - kv)}'
  durum: kontrolde
