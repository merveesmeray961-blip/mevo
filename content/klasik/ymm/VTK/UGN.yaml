  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Aşağıdaki dört kurumlar vergisi mükellefi ile bir gelir vergisi mükellefine ilişkin 2025 hesap dönemi işlemleri
    2026 yılında yürütülmektedir. Kurumlar vergisi oranı %25 alınacaktır; resmî tatil olarak yalnız hafta sonları dikkate
    alınacak, vergi mahkemesinde dava açma süresi 30 gün olarak uygulanacaktır.


    1. **Güneş Ambalaj A.Ş.** beyannamesini süresinde vermiş ve vergisini ödemiştir. Eylül 2026''da yapılan incelemede defter
    ve belgelere dayanılarak 400.000 TL ilave kurum kazancı tespit edilmiştir.

    2. **Ay Nakliyat Ltd. Şti.** beyannamesini kanuni süresinden 20 gün sonra, hakkında inceleme veya takdir komisyonuna sevk
    bulunmadan kendiliğinden vermiş ve 800.000 TL matrah beyan etmiştir. Vergi dairesi, kendi araştırmasına göre gerçek matrahın
    1.500.000 TL olduğunu düşünmektedir.

    3. **Deniz Gıda Ltd. Şti.** beyannamesini hiç vermemiş, vergi incelemesine başlandıktan sonra beyannameyi kendiliğinden
    vermiştir.

    4. **Orman Mobilya A.Ş.** beyannamesinde matrah bilgilerini göstermemiştir. Takdir komisyonu, şirketi 15 gün mühlet vererek
    bilgileri vermeye ve defterlerini ibraz etmeye davet etmiş; şirket defterlerini ibraz etmiştir. Defter ve vesikalar ihticaca
    salih olup kayıtlara göre matrah 1.000.000 TL''dir. Komisyon, piyasa araştırmasına dayanarak 1.600.000 TL takdir etmek
    istemektedir.

    5. **Kuzey Yazılım A.Ş.** için re''sen takdir edilen matrah 1.200.000 TL, şirketin beyan ettiği matrah 900.000 TL''dir.

    6. **Bay Mert Tuna** (ticari kazanç sahibi) hakkında defterlerini ibraz etmediği için re''sen tarhı gerektiren sebep vardır;
    ayrıca belgelere dayanılarak miktarı tespit edilen 60.000 TL''lik ikmalen tarhı gerektiren vergi farkı da bulunmaktadır.
    Re''sen takdir sonucunda hesaplanan toplam vergi 180.000 TL''dir ve bu tutarın içinde ikmale mesnet olan fark da dikkate
    alınmıştır.


    **İstenenler:**


    (a) 1, 4 ve 6 numaralı olaylarda uygulanacak tarh şeklini belirleyerek gerekçesini açıklayınız. (6 puan)


    (b) 2 ve 3 numaralı mükelleflerin geç verdikleri beyannamelerin tarhiyat bakımından farklı işlem görüp görmeyeceğini açıklayınız;
    2 numaralı mükellef için tarh edilecek kurumlar vergisini hesaplayınız. (7 puan)


    (c) 1, 4 ve 5 numaralı olaylarda tarh edilecek kurumlar vergisi tutarlarını hesaplayınız. (7 puan)


    (d) 6 numaralı mükellef için ikmalen ve re''sen tarh edilecek vergileri hesaplayınız; ayrıca verginin mükerrer md. 30
    uyarınca idarece tarh edilip ihbarnamenin bilinen adrese 10.06.2026 tarihinde posta ile tebliğ edildiği (ilan 03.06.2026''da
    asıldığı) bir olayda dava açma süresinin hangi tarihte başlayıp biteceğini belirtiniz. (5 puan)

    '
  cozum: '**(a) Tarh şekilleri**


    - **1 numara – ikmalen tarh:** Vergi tarh edildikten sonra bu vergiyle ilgili olarak ortaya çıkan ve defter, kayıt ve
    belgelere dayanılarak miktarı tespit edilen matrah farkı üzerinden tarh yapılır (md. 29).

    - **4 numara – re''sen tarh:** Beyannamede matrah bilgilerinin gösterilmemesi (md. 30/2. bent) re''sen tarh sebebidir;
    matrah takdir komisyonunca takdir edilir.

    - **6 numara – hem re''sen hem ikmalen:** Re''sen tarhı gerektiren sebep yanında ikmalen tarhı da gerektiren durum varsa
    re''sen takdir sonucu beklenmeksizin gerekli ikmal tarhiyatı yapılır (md. 30 son paragraf).


    **(b) Geç beyannameler**


    - Kanuni süresi geçtikten sonra **inceleme/takdire sevkten önce** verilen beyannamede (2 numara) beyan edilen matrah üzerinden
    re''sen gerekli tarhiyat yapılır ve beyanname re''sen takdir için takdir komisyonuna sevk edilmez. Vergi dairesi 1.500.000
    TL''lik görüşüne dayanarak takdire gidemez. Tarh edilecek vergi = 800.000 × %25 = **200.000 TL**.

    - Vergi incelemesine başlanıldıktan veya takdire sevk edildikten sonra kendiliğinden verilen beyannamelerde (3 numara)
    bu hüküm uygulanmaz; matrah re''sen takdir edilebilir. İki mükellef bu bakımdan farklı işlem görür.


    **(c) Hesaplamalar**


    | Olay | Hesap | Tarh edilecek vergi |

    |---|---|---|

    | 1 | 400.000 × %25 | 100.000 TL (ikmalen) |

    | 4 | Defter ve vesikalar ihticaca salih olduğundan takdir edilecek matrah, kayıtlara göre tespit edilecek miktardan fazla
    olamaz: 1.000.000 × %25 (1.600.000 TL takdir edilemez) | 250.000 TL |

    | 5 | Re''sen takdir edilen matrah beyan edilenden fazla olduğundan yalnız fark üzerinden tarh yapılır (md. 33): (1.200.000
    − 900.000) × %25 | 75.000 TL |


    **(d) 6 numaralı mükellef ve idarece tarh**


    - İkmalen tarh edilecek vergi: **60.000 TL** (re''sen takdir sonucu beklenmez).

    - Re''sen takdir sırasında ikmal tarhiyatına mesnet olan fark da nazara alındığından önceden tarh edilen vergi indirilir:
    180.000 − 60.000 = **120.000 TL** re''sen tarh edilir.

    - İdarece tarhta (mük. md. 30) ihbarname mükellefin bilinen adresine posta ile tebliğ edildiğinden dava açma süresi **tebliğ
    tarihine (10.06.2026)** bağlı olarak başlar (ilan tarihine göre değil); İYUK md. 8/1 gereği süre tebliği izleyen günden
    (11.06.2026) itibaren işler ve 30. gün olan **10.07.2026 Cuma** günü biter.

    '
  puanlama:
  - olcut: 1 numara için ikmalen tarh ve gerekçesi
    puan: 2
  - olcut: 4 numara için re'sen tarh (matrah bilgisinin gösterilmemesi) ve gerekçesi
