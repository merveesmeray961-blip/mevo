  soru: "**Olay:** Bilanço esasına göre defter tutan **Sarıkaya Elektrik Malzemeleri Ltd. Şti.** (ödenmiş sermayesi\n5.000.000\
    \ TL, ortakları Türkiye'de yerleşik) nezdinde Ekim 2026'da yapılan sınırlı incelemede şu tespitler yapılmıştır:\n\n1.\
    \ Şirket 02.03.2026'da Ekin İnşaat A.Ş.'ye 150.000 TL (KDV hariç) tutarında mal teslim etmiş, faturayı\n   13.03.2026'da\
    \ düzenlemiştir. Hasılat ve KDV Mart 2026 döneminde beyan edildiğinden vergi ziyaı doğmamıştır.\n   Bakanlıkça bu işlem\
    \ için daha kısa bir fatura düzenleme süresi belirlenmemiştir. Ekin İnşaat A.Ş. durumu idareye\n   bildirmemiştir.\n2.\
    \ Şirket kayıtlarını muhasebe fişlerine dayanarak yürütmektedir. Mart ve Nisan 2026 işlemlerine ait çok sayıda\n   kayıt,\
    \ işlem tarihlerinden 60–75 gün sonra yevmiye defterine intikal ettirilmiştir.\n3. Şirket Haziran 2026'da Almanya'daki\
    \ bir müşterisine avro cinsinden fatura düzenlemiş, faturada Türk lirası\n   karşılığını göstermemiştir. Şirket ayrıca\
    \ 2027'den itibaren defterlerini avro ile tutmak istemektedir.\n4. Şirket 10.01.2026'da 2020 ve 2021 yıllarına ait defter\
    \ ve belgelerini imha ettirmiştir. İnceleme elemanı 2021\n   hesap dönemi kurumlar vergisi için de belge istemiştir.\n\
    \n**İstenenler:**\n\n(a) Fatura düzenleme süresine uyulup uyulmadığını değerlendiriniz; satıcı ve alıcı için kesilecek\
    \ cezayı ve\nsatıcının ceza indirimi talep etmesi hâlinde ödeyeceği tutarı hesaplayınız. (7 puan)\n\n(b) Kayıt sürelerine\
    \ ilişkin tespiti değerlendiriniz ve kesilecek cezayı belirleyiniz. (6 puan)\n\n(c) Yabancı para cinsinden fatura ve yabancı\
    \ para ile defter tutma talebini değerlendiriniz. (5 puan)\n\n(d) Belgelerin imhasını saklama süresi ve tarh zamanaşımı\
    \ açısından değerlendirerek olası sonuçlarını\naçıklayınız. (7 puan)\n"
  cozum: "**(a) Fatura (VUK md. 231/5, 353/1)**\n\n- Fatura teslimden itibaren azami **7 gün** içinde (en geç 09.03.2026)\
    \ düzenlenmelidir; süresinde düzenlenmeyen\n  fatura **hiç düzenlenmemiş sayılır**.\n- Md. 353/1: belgeyi düzenlemek ve\
    \ almak zorunda olanların her birine meblağın %10'u, ilk tespitte 17.000 TL'den\n  az olmamak üzere özel usulsüzlük cezası\
    \ kesilir: 150.000 × %10 = 15.000 TL < 17.000 TL → satıcıya **17.000 TL**,\n  alıcı Ekin İnşaat A.Ş.'ye **17.000 TL**\
    \ (alıcı, süreyi izleyen beş iş günü içinde idareye bildirseydi kendisine\n  ceza kesilmezdi).\n- Vergi ziyaı olmadığından\
    \ yalnız özel usulsüzlük cezası söz konusudur. Ceza 40.000 TL'yi aşmadığından md. 376\n  indirimi %50 artırımlı (%75)\
    \ uygulanır (VUK Ek md. 1): satıcı 17.000 × %25 = **4.250 TL** öder.\n\n**(b) Kayıt zamanı (VUK md. 219)**\n\n- Kayıtlar\
    \ on günden fazla geciktirilemez; fiş ve bordroya dayanarak kayıt yürütenlerde fişe işleme deftere işleme\n  sayılır,\
    \ ancak esas defterlere intikal **45 günü** geçemez. 60–75 günlük gecikme md. 219'a aykırıdır.\n- Kayıt nizamına aykırılık\
    \ (md. 215–219) **birinci derece usulsüzlüktür** (md. 352/I-6); her incelemede aynı takvim\n  yılı için tespit edilenler\
    \ **tek fiil** sayılır: sermaye şirketi için **35.000 TL** (2026).\n\n**(c) Yabancı para (VUK md. 215)**\n\n- Kayıt ve\
    \ belgelerde Türk para birimi kullanılır; belgeler TL karşılığı gösterilerek yabancı para cinsinden de\n  düzenlenebilir.\
    \ **Yurt dışındaki müşteriler adına** düzenlenen belgelerde TL karşılığı gösterilmesi şartı\n  aranmaz → aykırılık yoktur.\n\
    - Yabancı para ile kayıt tutma izni ödenmiş sermayesi en az 100 milyon ABD doları muadili olan ve sermayesinin en az\n\
    \  %40'ı Türkiye'de yerleşik olmayanlara ait işletmelere Cumhurbaşkanınca verilebilir; şirket bu şartları\n  taşımadığından\
    \ defterlerini avro ile tutamaz.\n\n**(d) Saklama ve zamanaşımı**\n\n- Defter ve belgeler ilgili oldukları yılı izleyen\
    \ takvim yılından başlayarak **beş yıl** saklanır (md. 253):\n  2020 belgeleri 31.12.2025'e, 2021 belgeleri **31.12.2026**'ya\
    \ kadar saklanmalıdır. 2020 belgelerinin imhası VUK\n  açısından süre sonrasıdır; 2021 belgelerinin imhası ise **saklama\
    \ ödevine aykırıdır**.\n- 2021 kurumlar vergisi alacağı 2021'de doğmuş olup tarh zamanaşımı **31.12.2026**'da dolar (md.\
    \ 114); inceleme\n  tarh zamanaşımı süresi sonuna kadar yapılabilir (md. 138).\n- Belgelerin ibraz edilmemesi **resen\
    \ takdir sebebidir** (md. 30/3); saklama ve ibraz mecburiyeti bulunan defter ve\n  belgeleri yok etmek md. 359/b kapsamında\
    \ **üç yıldan sekiz yıla kadar hapis** cezasını gerektiren bir fiildir;\n  bu fiille vergi ziyaı doğarsa vergi ziyaı cezası\
    \ üç kat uygulanır (md. 344).\n"
