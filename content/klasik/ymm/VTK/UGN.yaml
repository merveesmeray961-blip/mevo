- id: YMM-VTK-UGN-K002
  sinav: ymm
  ders: VTK
  konu: UGN
  kazanimlar:
  - vergi kanunlarının uygulanması ve yorum
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "**Olay:** **Kaya Otomotiv Ltd. Şti.** nezdinde 2026 yılında 2025 hesap dönemine ilişkin yapılan vergi incelemesinde\n\
    aşağıdaki hususlar tartışmalıdır:\n\n1. Şirket, aktifindeki 2022 model bir binek otomobili (iki ayrı ekspertiz raporuna\
    \ göre emsal piyasa değeri\n   2.400.000 TL) 15.06.2025'te 600.000 TL'ye, şirket müdürü ve ortağı Bay Hakan Kaya'nın oğlu\
    \ Mert Kaya'ya\n   satmıştır. Şirket aracın \"motor arızalı\" olduğunu ileri sürmekte, ancak servis kaydı, ekspertiz veya\
    \ onarım\n   belgesi sunamamaktadır. Araç satıştan sonra onarım yapılmadan kullanılmaktadır.\n2. İnceleme elemanı, şirketten\
    \ 2024'te ayrılan bir muhasebe elemanının \"Şirketin genel olarak faturasız satış\n   yaptığını duydum.\" şeklindeki ifadesine\
    \ dayanarak 1.000.000 TL hasılat farkı önermiştir; başkaca tespit yoktur.\n   Şirket ise iddiayı çürütmek için müdürün\
    \ yemin etmeye hazır olduğunu bildirmiştir.\n3. Şirket, belediyeden ruhsat almadan işyeri bahçesinde ücretli otopark işletmiş;\
    \ 2025 yılında elde ettiği\n   300.000 TL hasılatı \"faaliyet mevzuata aykırı olduğu için vergiye tabi değildir\" gerekçesiyle\
    \ kayıtlara\n   almamıştır.\n4. Şirket, gerçek kişi Bay Ali Demir'den kiraladığı işyeri için 2025 yılında her ay 50.000\
    \ TL ödemiştir. Kira\n   sözleşmesinde \"Aylık kira bedeli 50.000 TL'dir. Gelir vergisi stopajı mal sahibine aittir; kiracı\
    \ kesinti\n   yapmayacaktır.\" hükmü bulunmaktadır. Şirket stopaj yapmamıştır. Taraflar 50.000 TL'nin brüt kira bedeli\n\
    \   olduğunu kabul etmektedir. Uygulanacak stopaj oranı %20'dir; gecikme faizi hesaplanmayacaktır.\n\n**İstenenler:**\n\
    \n(a) Araç satışını VUK md. 3 açısından değerlendiriniz; ispat yükünün kime ait olduğunu ve şirketin hangi\ndelillerle\
    \ ispat yapabileceğini açıklayınız. (7 puan)\n\n(b) Eski çalışanın ifadesinin ve şirketin yemin teklifinin delil değerini\
    \ değerlendiriniz. (6 puan)\n\n(c) Otopark hasılatı hakkındaki şirket görüşünü değerlendiriniz. (4 puan)\n\n(d) Kira sözleşmesindeki\
    \ hükmün vergi dairesine etkisini açıklayınız; şirketten aranacak 2025 yılı vergisini ve\nvergi ziyaı cezasını hesaplayınız;\
    \ şirketin ödediği tutarlar için başvurabileceği yolu belirtiniz. (8 puan)\n"
  cozum: "**(a) Araç satışı**\n\n- Vergi kanunları lafzı ve ruhu ile hüküm ifade eder (VUK md. 3/A); vergilendirmede vergiyi\
    \ doğuran olay ve buna\n  ilişkin muamelelerin **gerçek mahiyeti** esastır (md. 3/B).\n- Emsal değerin dörtte biri bedelle,\
    \ ortağın oğluna yapılan satış iktisadi, ticari ve teknik icaplara uymayan,\n  olağan ve mutat olmayan bir durumdur. \"\
    Arızalı araç\" iddiası olağan dışı bir durumdur; md. 3/B son fıkrasına göre\n  **ispat külfeti bunu iddia eden şirkete**\
    \ aittir.\n- Şirket yemin hariç her türlü delille (servis ve onarım kayıtları, bağımsız ekspertiz, sigorta hasar dosyası,\n\
    \  satış öncesi teknik rapor) ispat yapabilir. İspat edilemezse satış emsal değer üzerinden değerlendirilir; aradaki\n\
    \  1.800.000 TL ilişkili kişiye aktarılmış kazanç olarak ayrıca (KVK md. 13) değerlendirilir.\n\n**(b) Şahit ifadesi ve\
    \ yemin**\n\n- Vergiyi doğuran olayla ilgisi **tabii ve açık** bulunmayan şahit ifadesi ispat vasıtası olarak kullanılamaz\n\
    \  (md. 3/B). \"Duydum\" şeklindeki, tarih, alıcı, tutar içermeyen genel ifade olayla doğrudan ilgili değildir;\n  tek\
    \ başına tarhiyata dayanak olamaz. Kayıt dışı satış iddiası olağan dışı bir durum olduğundan ispat yükü\n  idaredeydi;\
    \ ifade ancak somut tespitlerle (kayıt dışı satış listeleri, tahsilat hareketleri) desteklenirse\n  değerlendirilebilir.\n\
    - Gerçek mahiyet **yemin hariç** her türlü delille ispatlanır; müdürün yemin teklifi delil değildir ve\n  değerlendirmeye\
    \ alınmaz.\n\n**(c) Otopark hasılatı**\n\nMükellefiyet ve vergi sorumluluğu için kanuni ehliyet şart değildir; **vergiyi\
    \ doğuran olayın kanunlarla yasak\nedilmiş olması mükellefiyeti kaldırmaz** (VUK md. 9). Ruhsatsız yürütülen faaliyetten\
    \ elde edilen 300.000 TL\nhasılat ticari kazanca dahildir ve vergilendirilir; ruhsatsızlık ayrıca ilgili mevzuata göre\
    \ yaptırıma bağlanır.\n\n**(d) Kira stopajı**\n\n- Kanunlarla kabul edilen hâller dışında mükellefiyete veya vergi sorumluluğuna\
    \ ilişkin **özel mukaveleler vergi\n  dairelerini bağlamaz** (VUK md. 8/3). Şirket, kira ödemesinden vergi kesmeye mecbur\
    \ olduğundan verginin tam\n  kesilip ödenmesinden **sorumludur** (md. 11/1).\n- Aranacak vergi: 50.000 × %20 × 12 = **120.000\
    \ TL**; sorumlu adına ziyaa uğratılan verginin bir katı vergi ziyaı\n  cezası **120.000 TL** (md. 344).\n- Şirket, sorumlu\
    \ sıfatıyla ödediği vergi için asıl mükellef Ali Demir'e **rücu** edebilir (md. 11/2); bu hak vergi\n  dairesine karşı\
    \ ileri sürülemez.\n"
  puanlama:
  - olcut: Md. 3/A yorum ve md. 3/B gerçek mahiyet ilkesinin açıklanması
    puan: 2
  - olcut: Olağan dışı durumu iddia eden şirketin ispat yükü ve kullanılabilecek deliller
    puan: 3
  - olcut: İspat edilemezse emsal değer üzerinden değerlendirme (1.800.000 TL fark)
    puan: 2
  - olcut: Şahit ifadesinin tabii ve açık ilgi şartı; genel ifadenin yetersizliği
    puan: 4
  - olcut: Yeminin delil olarak kullanılamaması
    puan: 2
  - olcut: 'Md. 9: ehliyet şartı yokluğu ve yasak faaliyetin mükellefiyeti kaldırmaması; hasılatın kazanca eklenmesi'
    puan: 4
  - olcut: 'Md. 8/3: özel sözleşmenin vergi dairesini bağlamaması ve şirketin sorumluluğu'
    puan: 3
  - olcut: 120.000 TL vergi ve 120.000 TL vergi ziyaı cezası
    puan: 3
  - olcut: Md. 11/2 rücu hakkı
    puan: 2
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 3, 8, 9, 11, 344
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 94/5-a
  gecerlilik:
    baslangic: '1981-01-01'
    bitis: null
