    \ işlem tarihlerinden 60–75 gün sonra yevmiye defterine intikal ettirilmiştir.\n3. Şirket Haziran 2026'da Almanya'daki\
    \ bir müşterisine avro cinsinden fatura düzenlemiş, faturada Türk lirası\n   karşılığını göstermemiştir. Şirket ayrıca\
    \ 2027'den itibaren defterlerini avro ile tutmak istemektedir.\n4. Şirket 10.01.2026'da 2020 ve 2021 yıllarına ait defter\
    \ ve belgelerini imha ettirmiştir. İnceleme elemanı 2021\n   hesap dönemi kurumlar vergisi için de belge istemiştir.\n\
    \n**İstenenler:**\n\n(a) Fatura düzenleme süresine uyulup uyulmadığını değerlendiriniz; satıcı ve alıcı için kesilecek\
