  soru: '**Olay:** Vergi müfettişi **Bay Kaan Demir** (evli; eşi Selin) 2026 yılında aşağıdaki gerçek kişi mükelleflerin incelenmesi
    için görevlendirilmiştir:


    | No | Mükellef | Bay Kaan ile ilişkisi |

    |---|---|---|

    | 1 | Bay Orhan | Eşi Selin''in erkek kardeşi |

    | 2 | Bay Tarık | Amcasının oğlu |

    | 3 | Bayan Deniz | Daha önce evli olduğu ve boşandığı eski eşi |

    | 4 | Bayan Nurhan | Annesinin kız kardeşi (teyzesi) |

    | 5 | Bay Emre | Kardeşinin oğlu |

    | 6 | Bay Selim | Bay Kaan''ın vekili olduğu kişi |


    Kan hısımlığında derece, ortak atadan her iki yana inilen basamakların toplamıdır; sıhri hısımlıkta eşin hısımları aynı
    dereceden hısım sayılır.


    Ayrıca aşağıdaki olaylar yaşanmıştır:


    - **I.** Vergi mahkemesinde görev yapıp emekli olan eski bir hâkim, görevi sırasında öğrendiği bir mükellefin hesap durumunu
    bir toplantıda anlatmıştır.

    - **II.** Hazine ve Maliye Bakanlığı, kesinleşen vergi ve cezalar ile vadesi geçtiği hâlde ödenmemiş vergi ve ceza miktarlarını
    açıklamıştır.

    - **III.** Vergi inceleme raporuyla sahte belge düzenlediği tespit edilen bir serbest muhasebeci mali müşavirin durumu,
    bağlı olduğu meslek odasına bildirilmiştir.

    - **IV.** Bay Kaan, hısımı olmayan bir mükellefin KDV beyannamesini ücret almadan hazırlamıştır.


    **İstenenler:**


    (a) 1-6 numaralı mükelleflerden hangilerine ait vergi inceleme ve takdir işleriyle Bay Kaan''ın uğraşamayacağını gerekçeleriyle
    belirtiniz. (8 puan)


    (b) I-IV numaralı olayların her birinin vergi mahremiyeti veya yasaklar bakımından hukuka uygun olup olmadığını açıklayınız.
    (8 puan)


    (c) Vergi mahremiyeti yasağının hangi kimseleri kapsadığını ve görevden ayrılmanın etkisini belirtiniz. (4 puan)


    (d) Sermaye şirketlerinin vergi levhası bakımından yükümlülüğünü ve süresini açıklayınız. (5 puan)

    '
  cozum: '**(a) Yasaklı mükellefler (md. 6)**


    Vergi muamelelerinde görevli olanlar kendilerine, nişanlılarına ve boşanmış olsalar bile eşlerine; kan hısımlığında üçüncü
    derece (dahil), sıhri hısımlıkta üçüncü derece (dahil) dereceye kadar olan civar hısımlarına; kanuni temsilcisi veya vekili
    bulundukları kimselere ait inceleme ve takdir işleriyle uğraşamazlar.


    | No | Derece | Sonuç |

    |---|---|---|

    | 1 Kayınbirader | Sıhri 2. derece | **Yasaklı** |

    | 2 Amcasının oğlu | Kan hısımlığı 4. derece (ortak ata: büyükbaba; 2 + 2) | Yasaklı değil |

    | 3 Boşandığı eşi | Boşanmış olsa bile eş | **Yasaklı** |

    | 4 Teyze | Kan 3. derece (1 + 2) | **Yasaklı** |

    | 5 Kardeşinin oğlu | Kan 3. derece (1 + 2) | **Yasaklı** |

    | 6 Vekili olduğu kişi | Vekil bulunduğu kimse | **Yasaklı** |


    **(b) Olaylar**


    - **I:** Mahremiyet ihlalidir; hâkimlerin de dahil olduğu yasak görevden ayrılsalar dahi devam eder.

    - **II:** İhlal değildir; Maliye Bakanlığı mükelleflerin vergi tarhına esas olan beyanlarını, kesinleşen vergi ve cezalarını
    ve vadesi geçmiş ödenmemiş miktarları açıklayabilir.

    - **III:** İhlal değildir; sahte belge düzenleyenlerin inceleme raporuyla tespit edilmesi hâlinde meslek kuruluşlarına
    ve 3568 sayılı Kanunla kurulan odalara bildirilmesi vergi mahremiyetini ihlal sayılmaz (bilgi verilen kişiler de yasaklara
    uyar).

    - **IV:** Hukuka aykırıdır; vergi muamelelerinde görevliler mükelleflerin vergi kanunlarının uygulanmasıyla ilgili hesap,
    yazı ve sair özel işlerini ücretsiz de olsa yapamazlar (md. 6/son).


    **(c) Kapsam**


    Yasak; vergi muameleleri ve incelemeleri ile uğraşan memurlar, vergi mahkemeleri, bölge idare mahkemeleri ve Danıştayda
    görevli olanlar, vergi kanunlarına göre kurulan komisyonlara iştirak edenler ve vergi işlerinde kullanılan bilirkişiler
    için geçerlidir; öğrendikleri sırları ifşa edemez ve kendilerinin veya üçüncü kişilerin yararına kullanamazlar. Yasak
    görevden ayrılsalar dahi devam eder (md. 5).


    **(d) Levha**


    Gelir vergisi mükellefleri (kazancı basit usulde tespit edilenler dahil) ile sermaye şirketleri her yıl **Mayıs ayının
    son gününe kadar** vergi tarhına esas olan kazanç tutarları ile bunlara isabet eden vergi miktarlarını gösteren levhayı
    almak zorundadır (md. 5).

    '
