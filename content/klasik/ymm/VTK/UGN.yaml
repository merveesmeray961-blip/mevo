    \ Şirket 02.03.2026'da Ekin İnşaat A.Ş.'ye 150.000 TL (KDV hariç) tutarında mal teslim etmiş, faturayı\n   13.03.2026'da\
    \ düzenlemiştir. Hasılat ve KDV Mart 2026 döneminde beyan edildiğinden vergi ziyaı doğmamıştır.\n   Bakanlıkça bu işlem\
    \ için daha kısa bir fatura düzenleme süresi belirlenmemiştir. Ekin İnşaat A.Ş. durumu idareye\n   bildirmemiştir.\n2.\
