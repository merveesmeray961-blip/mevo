    \ dairesinin ilan mahalline asılır ve\n  bir sureti mükellefin bilinen son adresinin bağlı olduğu muhtarlığa gönderilir.\
    \ Tutar 30.000–3.000.000 TL\n  arasında olduğundan ilan, vergi dairesinin bulunduğu yerin belediye sınırları içinde çıkan\
