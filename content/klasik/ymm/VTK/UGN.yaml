- id: YMM-VTK-UGN-K003
  sinav: ymm
  ders: VTK
  konu: UGN
  kazanimlar:
  - süreler mücbir sebep ve mali tatil
  - zamanaşımı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Olay:** Bir YMM bürosunun 2026 yılında izlediği dosyalar aşağıdadır. Resmî tatil olarak yalnız hafta sonları\n\
    dikkate alınacaktır; süre hesaplarında VUK md. 18 ve İYUK md. 7–8 esas alınacaktır.\n\n1. **Akın Yapı A.Ş.**: Hazine ve\
    \ Maliye Bakanlığı, şirketin bulunduğu ilde 06.02.2026'da meydana gelen deprem\n   nedeniyle VUK md. 15/3 uyarınca mücbir\
    \ sebep hâli ilan etmiştir. Bakanlıkça herhangi bir uzatma yapılmamıştır.\n2. **Bay Selim Öz** (serbest meslek erbabı):\
    \ 2025 yılı gelir vergisi beyannamesinin verilme ve ilk taksit ödeme\n   süresi 01–31.03.2026'dır. Bay Öz 20.03.2026–15.04.2026\
    \ arasında yoğun bakımda kalmış (sağlık kurulu raporu\n   mevcut), beyannamesini 20.04.2026'da vermiş ve ilk taksiti aynı\
    \ gün ödemiştir.\n3. **Bora Gıda A.Ş.**: 2025 yılı kurumlar vergisi beyannamesinin kanuni verilme süresi 01–30.04.2026'dır.\
    \ Mali\n   işler müdürü 20.04.2026'da vefat etmiş; şirket 24.04.2026'da mazeretini belirterek yazılı mühlet talep etmiştir.\n\
    4. **Bora Gıda A.Ş.**: 15.06.2026'da şirkete kurumlar vergisi ve vergi ziyaı cezası içeren ikmalen tarhiyat\n   ihbarnamesi,\
    \ 08.07.2026'da ise ayrı bir usulsüzlük cezası ihbarnamesi tebliğ edilmiştir. Şirketin ayrıca son\n   verilme günü 15.07.2026\
    \ olan bir ÖTV beyannamesi bulunmaktadır.\n\n**İstenenler:**\n\n(a) Akın Yapı A.Ş. için ilan edilen mücbir sebebin bitiş\
    \ tarihini, Bakanlığın uzatma yetkisinin sınırını ve\nmücbir sebebin sonuçlarını açıklayınız. (5 puan)\n\n(b) Bay Öz'ün\
    \ durumunu mücbir sebep açısından değerlendiriniz; beyanname ve ödeme süresinin hangi tarihe kadar\nuzadığını, ceza ve\
    \ tarh zamanaşımına etkisini belirtiniz. (6 puan)\n\n(c) Bora Gıda A.Ş.'nin mühlet talebinin şartlarını ve verilebilecek\
    \ mühletin azami son gününü belirleyiniz. (5 puan)\n\n(d) 15.06.2026 ihbarnamesi için uzlaşma veya ceza indirimi başvurusu\
    \ ile dava açma sürelerinin son günlerini;\n08.07.2026 ihbarnamesi için dava açma süresinin son gününü; ÖTV beyannamesinin\
    \ durumunu mali tatil açısından\nbelirleyiniz. (9 puan)\n"
  cozum: "**(a) İlan edilen mücbir sebep (VUK md. 15/3)**\n\n- Mücbir sebep, vukua geldiği tarihin rastladığı ayı (Şubat)\
    \ izleyen **üçüncü ayın son günü**, yani\n  **31.05.2026** itibarıyla bitmiş sayılır.\n- Bakanlık bu süreyi, vukua geldiği\
    \ ayı izleyen **on sekizinci ayın sonunu** (31.08.2027) geçmemek üzere\n  uzatabilir; yetkisini beyannamelerin toplulaştırılması,\
    \ yeni beyan süreleri belirlenmesi veya beyan\n  zorunluluğunun kaldırılması şeklinde de kullanabilir.\n- Mücbir sebep\
    \ süresince süreler işlemez, tarh zamanaşımı işlemeyen süre kadar uzar (md. 15/1) ve bu süredeki\n  ödevler için vergi\
    \ cezası kesilmez (md. 373).\n\n**(b) Bay Öz**\n\n- Vergi ödevinin yerine getirilmesine engel olacak derecede **ağır hastalık**\
    \ mücbir sebeptir (md. 13/1); sağlık\n  kurulu raporuyla ispat ve tevsik edilmiştir (md. 15/2).\n- Süre 01–19.03.2026\
    \ arasında 19 gün işlemiş; 20.03.2026'dan sebep kalkıncaya (15.04.2026) kadar işlememiştir.\n  Kalan 12 günlük süre 16.04.2026'dan\
    \ itibaren işler ve **27.04.2026** (Pazartesi) günü biter. Md. 15'in\n  uygulanması dolayısıyla süre uzadığından vade\
    \ de uzayan sürenin bittiği gündür (md. 111/3).\n- 20.04.2026'daki beyan ve ödeme süresindedir: usulsüzlük ve vergi ziyaı\
    \ cezası kesilmez (md. 373), gecikme\n  zammı doğmaz. Tarh zamanaşımı işlemeyen süre (27 gün) kadar uzar.\n\n**(c) Mühlet\
    \ (VUK md. 17)**\n\n- Şartlar: sürenin bitmesinden önce **yazılı istem** (24.04.2026 → süresinde), mazeretin mühlet verecek\
    \ makamca\n  kabule layık görülmesi ve mühlet verilmesi hâlinde **verginin alınmasının tehlikeye girmemesi**.\n- Kanuni\
    \ süre bir ay olduğundan mühlet **kanuni sürenin bir katını**, yani bir ayı geçemez: 30.04.2026 + 1 ay =\n  30.05.2026;\
    \ bu gün Cumartesi olduğundan süre izleyen ilk iş günü **01.06.2026** (Pazartesi) biter (md. 18/4).\n  Vade de mühletin\
    \ bittiği gündür (md. 111/3).\n\n**(d) Mali tatil (5604 sayılı Kanun)**\n\n- 15.06.2026 ihbarnamesi – uzlaşma talebi veya\
    \ md. 376 başvurusu (30 gün): son gün 15.07.2026 mali tatile rastlar;\n  tatilin son gününü izleyen tarihten itibaren\
    \ **7 gün uzar → 27.07.2026** (5604 md. 1/2-c). Vadesi tatile\n  rastlayan ikmalen tarhiyatın ödeme süresi de aynı şekilde\
    \ 27.07.2026'ya uzar (md. 1/2-b).\n- 15.06.2026 ihbarnamesi – dava açma (30 gün): süre 16.06'da başlar; 16–30 Haziran\
    \ **15 gün** işler; dava açma\n  süresi 1–20 Temmuz arasında **işlemez** (md. 1/3); kalan 15 gün 21.07.2026'dan işler\
    \ → **04.08.2026** (Salı).\n- 08.07.2026 ihbarnamesi: tebligat mali tatil içinde yapıldığından süre tatilin son gününden\
    \ itibaren işlemeye\n  başlar (md. 1/5); ilk gün 21.07.2026 → 30. gün **19.08.2026** (Çarşamba).\n- ÖTV beyannamesi: ÖTV'de\
    \ mali tatil uygulanmaz (md. 1/7); süre **15.07.2026**'da biter.\n"
