  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(P) A.Ş. adına re''sen tarh edilen 1.200.000 TL kurumlar vergisi ile aynı tutarda (1.200.000 TL) vergi ziyaı cezasına
    ilişkin ihbarnameler şirkete 25 Kasım 2026 Çarşamba günü tebliğ edilmiştir. Şirket, tarhiyatın 800.000 TL''lik kısmını
    ve cezanın tamamını dava konusu yapmayı, 400.000 TL''lik vergi kısmını ise kabul edip ödemeyi planlamaktadır. Dava ileri
    bir tarihte vergi mahkemesinde açılacak ve yürütmenin durdurulması da istenecektir. Resmî tatil ve çalışmaya ara verme
    dönemi dikkate alınmayacak, faiz ve zamlar hesaba katılmayacaktır.


    Vergi mahkemesi davayı reddetmiş, ret kararı şirkete 12 Mart 2027 Cuma günü tebliğ edilmiştir (dava konusu tutar, istinaf
    için kanunda aranan parasal sınırı aşmaktadır).


    **İstenenler:**


    (a) Vergi mahkemesinde dava açma süresini ve davanın açılabileceği son günü, dayanağıyla birlikte bulunuz. (5 puan)


    (b) Dava açılmasının tahsil işlemlerine etkisini açıklayınız; dava açıldığında tahsili duran ve tahsile devam edilebilecek
    tutarları hesaplayınız. (7 puan)


    (c) Yürütmenin durdurulması kararı verilebilmesi için gereken şartları, teminat konusunu, savunma alınmadan istemin reddedilip
    reddedilemeyeceğini, karara karşı başvuru yolunu ve süresini açıklayınız. (8 puan)


    (d) Ret kararına karşı başvurulabilecek kanun yolunu, merciini ve son başvuru gününü gösteriniz. (5 puan)

    '
  cozum: '**(a) Dava açma süresi**


    - Md. 7/1: Özel kanunlarında ayrı süre gösterilmeyen hâllerde dava açma süresi vergi mahkemelerinde **otuz gündür**.

    - Md. 7/2-b ve md. 8/1: Tebliğ yapılan hâllerde süre, tebliğ tarihini izleyen günden (26 Kasım 2026) işlemeye başlar.

    - Otuzuncu gün = 25 Aralık 2026 Cuma; tatil gününe rastlamadığından **son gün 25 Aralık 2026**''dır.


    **(b) Tahsile etkisi**


    - Md. 27/4: Vergi mahkemelerinde vergi davalarının açılması, tarh edilen vergi ve bunların zam ve cezalarının **dava konusu
    edilen bölümünün** tahsil işlemlerini durdurur.

    - Dava konusu edilen: 800.000 TL vergi + 1.200.000 TL ceza = **2.000.000 TL**; tahsili duran tutar budur.

    - Dava konusu edilmeyen 400.000 TL vergi için tahsil işlemleri devam eder (vadesinde ödenmediği takdirde cebrî takip yapılabilir).

    - Toplam talep = 1.200.000 + 1.200.000 = 2.400.000 TL; kontrol: 2.000.000 + 400.000 = 2.400.000 TL.


    **(c) Yürütmenin durdurulması (md. 27)**


    - Şartlar (md. 27/2): İdari işlemin uygulanması hâlinde **telafisi güç veya imkânsız zararların doğması** ve işlemin **açıkça
    hukuka aykırı olması** birlikte gerçekleşmelidir; karar gerekçeli olmalıdır.

    - Teminat (md. 27/6): Kararlar teminat karşılığında verilir; durumun gereklerine göre teminat aranmayabilir.

    - Md. 27/3: Dava dilekçesi ve eklerinden istemin yerinde olmadığı anlaşılırsa, davalı idarenin savunması alınmaksızın
    istem **reddedilebilir**.

    - Md. 27/7: Karara karşı kararın tebliğini izleyen günden itibaren **yedi gün** içinde bir defaya mahsus itiraz edilebilir
    (vergi mahkemesi kararına karşı bölge idare mahkemesine); itiraz üzerine verilen karar kesindir.

    - Md. 27/10: Aynı sebeplere dayanılarak ikinci kez yürütmenin durdurulması istenemez.


    **(d) Kanun yolu**


    - Md. 45/1: Vergi mahkemesi kararına karşı mahkemenin bulunduğu yargı çevresindeki **bölge idare mahkemesine**, kararın
    tebliğinden itibaren **otuz gün** içinde istinaf yoluna başvurulabilir.

    - Süre 13 Mart 2027''de başlar; otuzuncu gün 11 Nisan 2027 Pazar''a rastladığından md. 8/2 uyarınca süre ilk çalışma günü
    olan **12 Nisan 2027 Pazartesi** günü bitimine kadar uzar.

    '
