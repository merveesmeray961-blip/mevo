- id: YMM-VTK-YRG-K003
  sinav: ymm
  ders: VTK
  konu: YRG
  kazanimlar:
  - yürütmenin durdurulması
  - istinaf temyiz ve kanun yararına bozma
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: "**Olay:** **Nehir Turizm A.Ş.** ile ilgili 2026 yılı gelişmeleri aşağıdadır. Resmî tatil olarak yalnız hafta sonları\n\
    dikkate alınacaktır; 2026 yılında uygulanan istinaf sınırı 55.000 TL, temyiz sınırı 1.661.000 TL'dir.\n\n1. 12.01.2026'da\
    \ tebliğ edilen ihbarnamede 1.200.000 TL KDV, 1.200.000 TL vergi ziyaı cezası ve fatura\n   düzenlenmemesi nedeniyle 50.000\
    \ TL özel usulsüzlük cezası yer almaktadır. Şirket 05.02.2026'da yalnız KDV ve\n   vergi ziyaı cezasına karşı dava açmış\
    \ (dava konusu 2.400.000 TL), özel usulsüzlük cezasına dava açmamıştır.\n   Vergi mahkemesi davayı reddetmiş, karar 04.05.2026'da\
    \ şirkete tebliğ edilmiştir.\n2. Şirket Aralık 2025 dönemi KDV beyannamesini ihtirazi kayıtla vermiş (tahakkuk 300.000\
    \ TL) ve 20.02.2026'da dava\n   açarak yürütmenin durdurulmasını istemiştir. Vergi mahkemesinin istemi reddeden kararı\
    \ 25.03.2026'da tebliğ\n   edilmiştir.\n3. Vergi dairesi, kesinleşmiş başka bir borç için şirketin banka hesabına haciz\
    \ uygulamış; şirket hacze karşı dava\n   açmıştır.\n4. Şirketin Mart 2026'da açtığı 45.000 TL'lik bir usulsüzlük cezası\
    \ davası vergi mahkemesince reddedilmiştir. Şirket\n   ve vergi dairesi kararın açıkça hukuka aykırı olduğunu düşünmektedir.\n\
    \n**İstenenler:**\n\n(a) 1. maddedeki dava açılmasının tahsil işlemlerine etkisini; dava konusu yapılmayan cezanın durumunu\
    \ ve şirketin bu\nceza için yararlanabileceği imkânları açıklayınız. (6 puan)\n\n(b) 2. ve 3. maddedeki davaların tahsile\
    \ etkisini, yürütmenin durdurulması şartlarını, teminatı ve red kararına karşı\nbaşvuru yolunu son günüyle belirtiniz.\
    \ (8 puan)\n\n(c) 1., 2. ve 4. maddedeki davalarda vergi mahkemesi ve bölge idare mahkemesi kararlarına karşı hangi kanun\n\
    yollarına gidilebileceğini açıklayınız; 1. maddedeki karar için istinaf süresinin son gününü belirleyiniz. (8 puan)\n\n\
    (d) 4. maddedeki kararın düzeltilmesi için başvurulabilecek olağanüstü yolu ve sonucunu açıklayınız. (3 puan)\n"
  cozum: "**(a) Tahsilin durması (İYUK md. 27/4)**\n\n- Vergi mahkemesinde dava açılması, tarh edilen vergi ve cezaların **dava\
    \ konusu edilen bölümünün** tahsil\n  işlemlerini durdurur: 2.400.000 TL'nin tahsili durur.\n- Dava konusu yapılmayan\
    \ 50.000 TL özel usulsüzlük cezası kesinleşir ve tahsil edilir. Şirket, ihbarnamenin\n  tebliğinden itibaren 30 gün içinde\
    \ md. 376'ya göre başvurup ödeme şartlarını yerine getirerek cezanın yarısının\n  indirilmesinden (40.000 TL'yi aştığından\
    \ artırımlı oran uygulanmaz) ya da 40.000 TL'yi aşan ceza olduğu için\n  aynı süre içinde **uzlaşma** talebinden yararlanabilirdi\
    \ (VUK Ek md. 1); ikisi birlikte kullanılamaz.\n\n**(b) Tahsili durdurmayan davalar ve yürütmenin durdurulması**\n\n-\
    \ İhtirazi kayıtla verilen beyannameler üzerine yapılan işlemler ile **tahsil işlemlerine** (haciz) karşı açılan\n  davalar\
    \ tahsili durdurmaz; yürütmenin durdurulması istenebilir (md. 27/4).\n- Şartlar (md. 27/2): idari işlemin uygulanması\
    \ hâlinde **telafisi güç veya imkânsız zararların** doğması ve işlemin\n  **açıkça hukuka aykırı** olması birlikte gerçekleşmelidir.\
    \ Karar kural olarak savunma alındıktan veya savunma\n  süresi geçtikten sonra, gerekçeli olarak verilir.\n- Karar **teminat\
    \ karşılığında** verilir; durumun gereğine göre teminat aranmayabilir; idareden ve adli yardımdan\n  yararlananlardan\
    \ teminat alınmaz (md. 27/6).\n- Red kararına karşı tebliği izleyen günden itibaren **7 gün** içinde bir defaya mahsus\
    \ **bölge idare mahkemesine**\n  itiraz edilir: son gün **01.04.2026**. İtiraz mercii 7 gün içinde karar verir; karar\
    \ kesindir. Aynı sebeplere\n  dayanılarak ikinci kez yürütmenin durdurulması istenemez (md. 27/7, 27/10).\n\n**(c) Kanun\
    \ yolları (İYUK md. 45, 46, Ek md. 1)**\n\nİstinaf ve temyiz yoluna başvurulabilecek kararların belirlenmesinde **davanın\
    \ açıldığı tarihteki** parasal sınır\nesas alınır; üç dava da 2026'da açıldığından 55.000 / 1.661.000 TL sınırları uygulanır.\n\
    \n- 1. dava (2.400.000 TL): vergi mahkemesi kararına karşı tebliğden itibaren 30 gün içinde istinaf: son gün\n  **03.06.2026**.\
    \ Konusu 1.661.000 TL'yi aştığından bölge idare mahkemesi kararı 30 gün içinde **Danıştayda temyiz**\n  edilebilir.\n\
    - 2. dava (300.000 TL): istinaf yolu açıktır; konusu temyiz sınırının altında olduğundan bölge idare mahkemesi\n  kararı\
    \ **kesindir**.\n- 4. dava (45.000 TL): konusu 55.000 TL'yi geçmediğinden vergi mahkemesi kararı **kesindir**; istinaf\
    \ yolu kapalıdır.\n\n**(d) Kanun yararına bozma (İYUK md. 51)**\n\nKesin kararlar ile kanun yoluna gidilmeden kesinleşen\
    \ kararlar, ilgili bakanlığın göstereceği lüzum üzerine veya\nkendiliğinden **Danıştay Başsavcısı** tarafından kanun yararına\
    \ temyiz edilebilir; şirket doğrudan başvuramaz, ancak\nbakanlığa veya Başsavcılığa başvurarak talepte bulunabilir. Bozma\
    \ kararı **önceki kararın hukuki sonuçlarını\nkaldırmaz**; amaç içtihat birliğidir ve karar Resmî Gazete'de yayımlanır.\n"
