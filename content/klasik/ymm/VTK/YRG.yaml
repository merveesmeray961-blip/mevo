  soru: "**Olay:** İzmir'de faaliyet gösteren ve Kordon Vergi Dairesine bağlı **Ekin Gıda Ltd. Şti.**nin müdürü ve kanuni\n\
    temsilcisi Bay Can Ekin'dir; Bayan Ece Ekin ise müdür olmayan ortaktır. Resmî tatil olarak yalnız hafta sonları\ndikkate\
    \ alınacaktır.\n\n1. Kordon Vergi Dairesinin düzenlediği 2024 yılı KDV ikmalen tarhiyatına ilişkin ihbarname (400.000\
    \ TL KDV ve\n   400.000 TL vergi ziyaı cezası) 05.03.2026'da posta ile şirket müdürüne tebliğ edilmiştir.\n2. Şirket adına\
    \ müdür Can Ekin dava dilekçesini 03.04.2026'da **İstanbul Vergi Mahkemesine** vermiştir. Dilekçede\n   davalı olarak\
    \ \"Gelir İdaresi Başkanlığı\" gösterilmiş; uyuşmazlık konusu miktar ile ihbarnamenin tarih ve\n   numarası yazılmamıştır.\n\
    3. Ortak Ece Ekin de aynı ihbarnameye karşı kendi adına İzmir Vergi Mahkemesinde dava açmıştır.\n4. Şirket, Ekim 2025\
    \ dönemi KDV beyannamesini, uyuşmazlık konusu bir indirim kalemini ihtirazi kayıtla belirterek\n   26.11.2025'te vermiş;\
    \ tahakkuk fişi aynı gün düzenlenmiş ve şirket bu tahakkuka karşı 10.12.2025'te dava açmıştır.\n\n**İstenenler:**\n\n\
    (a) İhbarnameye karşı dava açma süresinin son gününü belirleyerek şirketin davasının süresinde açılıp açılmadığını\ndeğerlendiriniz.\
    \ (5 puan)\n\n(b) İstanbul Vergi Mahkemesindeki dilekçenin ilk incelemede hangi yönlerden ve hangi sırayla inceleneceğini\n\
    belirtiniz; yetki ve husumet yönünden verilecek kararları ve bu kararlara karşı kanun yolunu açıklayınız. (8 puan)\n\n\
    (c) Dilekçedeki eksiklikler ile Ece Ekin'in açtığı dava hakkında verilecek kararları ve sonuçlarını açıklayınız. (7 puan)\n\
    \n(d) İhtirazi kayıtla verilen beyannameye karşı açılan davanın süresini ve tahsil işlemlerine etkisini\ndeğerlendiriniz.\
    \ (5 puan)\n"
  cozum: "**(a) Dava açma süresi (İYUK md. 7, 8)**\n\nVergi mahkemesinde dava açma süresi 30 gündür ve tebliği izleyen günden\
    \ başlar: 06.03.2026 ilk gün, 30. gün\n04.04.2026 **Cumartesi**dir. Son gün tatile rastladığından süre izleyen ilk çalışma\
    \ günü **06.04.2026 (Pazartesi)**\nbiter. 03.04.2026'da açılan dava **süresindedir** (yetkisiz mahkemeye verilmiş olması\
    \ bu sonucu değiştirmez; dosya\nyetkili mahkemeye gönderilir).\n\n**(b) İlk inceleme (İYUK md. 14, 15)**\n\n- Sıra: (1)\
    \ görev ve yetki, (2) idari merci tecavüzü, (3) ehliyet, (4) idari davaya konu olacak kesin ve yürütülmesi\n  gereken\
    \ işlem bulunup bulunmadığı, (5) süre aşımı, (6) husumet, (7) md. 3 ve 5'e uygunluk.\n- Yetki: vergi uyuşmazlıklarında\
    \ yetkili mahkeme, vergiyi tarh eden ve cezayı kesen dairenin bulunduğu yer vergi\n  mahkemesidir (md. 37/a) → **İzmir\
    \ Vergi Mahkemesi**. İstanbul Vergi Mahkemesi davayı **yetki yönünden reddederek\n  dosyayı İzmir Vergi Mahkemesine gönderir**\
    \ (md. 15/1-a).\n- Husumet: dava yanlış hasım gösterilerek açılmıştır → dava dilekçesinin **gerçek hasma (Kordon Vergi\
    \ Dairesi\n  Müdürlüğü) tebliğine** karar verilir (md. 15/1-c); dava reddedilmez.\n- Yetki yönünden ret ve gerçek hasma\
    \ tebliğ kararlarına karşı **istinaf veya temyiz yoluna başvurulamaz** (md. 15/4).\n\n**(c) Dilekçe eksiklikleri ve ehliyet**\n\
    \n- Vergi davalarında uyuşmazlık konusu miktar ile ihbarnamenin tarih ve numarası dilekçede gösterilmelidir\n  (md. 3/2-d,\
    \ e). Eksiklik hâlinde **30 gün içinde yenilenmek üzere dilekçenin reddine** karar verilir\n  (md. 15/1-d); yeni dilekçe\
    \ için ayrıca harç alınmaz (md. 15/3); yeniden verilen dilekçede aynı yanlışlıklar\n  yapılırsa **dava reddedilir** (md.\
    \ 15/5). Dilekçe red kararına karşı kanun yolu yoktur.\n- Vergi davasını mükellef ve cezaya muhatap olan açabilir (VUK\
    \ md. 377). Tarhiyat şirket adınadır; şirketi kanuni\n  temsilcisi temsil eder. Müdür olmayan ortağın kendi adına açtığı\
    \ dava **ehliyet** yönünden reddedilir\n  (md. 14/3-c, 15/1-b); bu karara karşı istinaf yoluna başvurulabilir.\n\n**(d)\
    \ İhtirazi kayıtlı beyan**\n\n- Mükellef beyan ettiği matraha kural olarak dava açamaz (VUK md. 378/2); uyuşmazlık konusunu\
    \ ihtirazi kayıtla\n  beyan eden mükellef ise tahakkuka karşı dava açabilir. Süre, tebliğ yerine geçen tahakkuk fişinin\
    \ verildiği\n  tarihi izleyen günden başlar: 27.11.2025 → son gün **26.12.2025**; 10.12.2025'teki dava süresindedir.\n\
    - İhtirazi kayıtla verilen beyannameler üzerine yapılan işlemlere karşı açılan davalar **tahsili durdurmaz**\n  (İYUK\
    \ md. 27/4); şirket tahsilin durması için **yürütmenin durdurulmasını** istemelidir.\n"
