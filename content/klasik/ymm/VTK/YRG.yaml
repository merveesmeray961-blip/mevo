    etkisini ve şirketin başvurabileceği yolu açıklayınız. (6 puan)


    (c) Yürütmenin durdurulmasının hangi şartlarda verilebileceğini yazınız. (5 puan)


    (d) Yürütmenin durdurulması istemi hakkında verilen karara karşı itiraz süresini ve itiraz üzerine verilecek kararların
    niteliğini belirtiniz. (5 puan)

    '
