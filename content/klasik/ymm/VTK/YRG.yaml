  cozum: "**(a) Kanun yolundan vazgeçme (VUK md. 379)**\n\n- Vergi aslı dava konusu yapılmadığından vergi ziyaı cezası md.\
    \ 379/2 kapsamındadır: kaldırılan kısmın **%25'i**,\n  tasdik edilen kısmın **%75'i** tahakkuk eder.\n- Tahakkuk: 200.000\
    \ × %25 = 50.000 + 300.000 × %75 = 225.000 → **275.000 TL** (dilekçe tarihi 20.05.2026 itibarıyla,\n  başkaca işleme gerek\
    \ kalmaksızın).\n- Tahakkuk tarihinden itibaren bir ay içinde ödenir (son gün 20.06.2026 Cumartesi → 22.06.2026). Tutarın\
    \ %80'i bu\n  sürede tamamen ödenirse %20 indirim: 275.000 × %20 = **55.000 TL**; ödenecek **220.000 TL** (tasdik edilen\
    \ vergi\n  bulunmadığından indirim dışı kalan kısım yoktur).\n- Dilekçe, mükellef için geçerli kanun yolu süresi (istinaf:\
    \ 05.05.2026'yı izleyen 30 gün, son gün **04.06.2026**)\n  içinde, dava konusu tutarların **tümü** için **ilgili vergi\
    \ dairesine** verilir; dilekçe yargı merciine gönderilir.\n  İdare de ihtilafı sürdürmez; yargılama giderleri ve avukatlık\
    \ ücretleri karşılıklı talep edilmez.\n\n**(b) Ölüm**\n\n- Ölüm hâlinde vergi cezası düşer (VUK md. 372): md. 379'a göre\
    \ tahakkuk eden ve ödenmemiş **275.000 TL ceza\n  düşer**, mirasçılardan istenmez.\n- Ödenmiş vergi aslı kesinleşmiş bir\
    \ vergidir; ölüm iade sebebi değildir.\n- Devam eden dava: dava sırasında ölüm hâlinde, davayı takip hakkı kendisine geçenin\
    \ başvurusuna veya idarenin\n  mirasçılar aleyhine takibi yenilemesine kadar dosya **işlemden kaldırılır**; dört ay içinde\
    \ yenileme dilekçesi\n  verilmezse yürütmenin durdurulması kararı kendiliğinden hükümsüz kalır (İYUK md. 26/1).\n- 100.000\
    \ TL vergi ziyaı cezası ölümle düşer. Vergi aslı onanırsa mirası reddetmeyen mirasçılar miras hisseleri\n  oranında sorumludur\
    \ (VUK md. 12): eş 100.000 × 1/4 = **25.000 TL**; her çocuk 100.000 × 3/8 = **37.500 TL**.\n\n**(c) Danıştay bozması üzerine\
    \ verilen karar**\n\nMd. 379, vergi mahkemesinin istinaf yolu açık ve bölge idare mahkemesinin temyiz yolu açık kararlarında\
    \ uygulanır;\nancak **Danıştayın bozma kararı üzerine verilen kararlar** kapsam dışıdır. Şirketin talebi kabul edilemez;\
    \ kararın\ngenel hükümlere göre kanun yolu ve kesinleşme durumu izlenir.\n\n**(d) Davadan feragat**\n\n- Feragat İYUK\
    \ md. 31 yollamasıyla HMK hükümlerine tabidir; karar verilmeden önce davadan vazgeçilmesiyle dava sona\n  erer, dava konusu\
    \ tarhiyat **kesinleşir**; vergi ve cezanın tamamı indirim olmaksızın (gecikme faiziyle) ödenir,\n  yargılama giderleri\
    \ feragat edene yüklenir.\n- Dava açıldığından md. 376 ceza indiriminden de yararlanılamaz (md. 376/2). Buna karşılık\
    \ md. 379'da karar\n  verildikten sonra kaldırılan verginin yalnız %60'ı, cezaların indirimli kısımları ve ayrıca %20\
    \ indirim söz\n  konusudur. Bu nedenle feragat yerine kararı bekleyip kanun yolundan vazgeçmek genellikle daha avantajlıdır.\n"
