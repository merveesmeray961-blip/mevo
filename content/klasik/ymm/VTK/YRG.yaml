    (6 puan)


    (d) 4 numaralı olayda vergi dairesinin karar gereği işlem yapması için en geç hangi tarihe kadar süresi bulunduğunu belirtiniz.
    (5 puan)

    '
  cozum: '**(a)** Taraflar yapılan tebliğlere karşı tebliğ tarihinden itibaren **otuz gün** içinde cevap verebilir (İYUK md.
    16/3). Süre 03.03.2026''da başlar; son gün **01.04.2026 Çarşamba**''dır. Bu süre, haklı sebeplerin bulunması halinde taraflardan
