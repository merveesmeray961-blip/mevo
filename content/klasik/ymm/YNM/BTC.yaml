  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: "Yalçın Pompa A.Ş. 2026 yılının ilk çeyreği için ana bütçesini hazırlamaktadır. Tek tip ürünün satış tahminleri\n\
    (adet): Ocak 10.000; Şubat 12.000; Mart 15.000; Nisan 14.000; Mayıs 13.000. Birim satış fiyatı 500 TL'dir.\n\nBütçe politikaları\
    \ ve standartlar:\n\n- Her ay sonunda, izleyen ayın satış miktarının %20'si kadar mamul stoku bulundurulacaktır. 1 Ocak\
    \ 2026'da mamul\n  stoku 2.000 adettir.\n- Bir birim mamul 3 kg ham madde gerektirir; ham maddenin kg fiyatı 40 TL'dir.\
    \ Her ay sonunda, izleyen ayın üretim\n  ihtiyacının %25'i kadar ham madde stoku bulundurulacaktır. 1 Ocak 2026'da ham\
    \ madde stoku 8.000 kg'dır.\n- Bir birim mamul 0,5 saat direkt işçilik gerektirir; direkt işçilik saat ücreti 300 TL'dir.\n\
    \n**İstenenler:**\n\n(a) Ocak–Mart dönemi için aylık ve toplam satış bütçesini hazırlayınız. (3 puan)\n\n(b) Ocak–Nisan\
    \ ayları için üretim bütçesini hazırlayınız (Nisan, Mart sonu ham madde stokunun belirlenmesi için\ngereklidir). (8 puan)\n\
    \n(c) Ocak–Mart dönemi için ham madde kullanım ve satın alma bütçesini (kg ve TL) hazırlayınız. (10 puan)\n\n(d) Ocak–Mart\
    \ dönemi için direkt işçilik bütçesini hazırlayınız; ana bütçenin hazırlanmasında satış bütçesinin\nneden başlangıç noktası\
    \ olduğunu açıklayınız. (4 puan)\n"
  cozum: '**(a) Satış bütçesi**


    | | Ocak | Şubat | Mart | Toplam |

    |---|---|---|---|---|

    | Satış miktarı (adet) | 10.000 | 12.000 | 15.000 | 37.000 |

    | Birim fiyat (TL) | 500 | 500 | 500 | |

    | Satış tutarı (TL) | 5.000.000 | 6.000.000 | 7.500.000 | 18.500.000 |


    **(b) Üretim bütçesi**


    Üretim = Satış + İstenen dönem sonu stok − Dönem başı stok.


    | | Ocak | Şubat | Mart | Nisan |

    |---|---|---|---|---|

    | Satış | 10.000 | 12.000 | 15.000 | 14.000 |

    | + Dönem sonu stok (izleyen ay satışının %20''si) | 2.400 | 3.000 | 2.800 | 2.600 |

    | − Dönem başı stok | (2.000) | (2.400) | (3.000) | (2.800) |

    | **Üretim (adet)** | **10.400** | **12.600** | **14.800** | **13.800** |


    Çeyrek toplam üretimi 37.800 adettir.


    **(c) Ham madde bütçesi**


    | | Ocak | Şubat | Mart | Toplam |

    |---|---|---|---|---|

    | Üretim (adet) | 10.400 | 12.600 | 14.800 | 37.800 |

    | Kullanım (kg; × 3) | 31.200 | 37.800 | 44.400 | 113.400 |

    | + Dönem sonu stok (izleyen ay kullanımının %25''i) | 9.450 | 11.100 | 10.350 | 10.350 |

    | − Dönem başı stok | (8.000) | (9.450) | (11.100) | (8.000) |

    | **Satın alma (kg)** | **32.650** | **39.450** | **43.650** | **115.750** |

    | Satın alma (TL; × 40) | 1.306.000 | 1.578.000 | 1.746.000 | 4.630.000 |

    | Kullanım (TL; × 40) | 1.248.000 | 1.512.000 | 1.776.000 | 4.536.000 |


    Mart sonu stoku Nisan kullanımına göre belirlenir: 13.800 × 3 = 41.400 kg × %25 = 10.350 kg.


    **(d) Direkt işçilik bütçesi ve sıralama**


    | | Ocak | Şubat | Mart | Toplam |

    |---|---|---|---|---|

    | Üretim (adet) | 10.400 | 12.600 | 14.800 | 37.800 |

    | Direkt işçilik saati (× 0,5) | 5.200 | 6.300 | 7.400 | 18.900 |

    | Direkt işçilik tutarı (× 300 TL) | 1.560.000 | 1.890.000 | 2.220.000 | 5.670.000 |


    Ana bütçede üretim, ham madde, işçilik, genel üretim gideri, satış ve yönetim gideri, nakit ve proforma tablolar

    satış hacmine bağlı olarak belirlenir. İşletmenin ne kadar üreteceği ve hangi kaynaklara ihtiyaç duyacağı satılabilecek

    miktara göre planlandığından satış bütçesi ana bütçenin başlangıç noktasıdır; satış tahminindeki hata bütün alt

    bütçelere yayılır. (Kapasite, ham madde veya finansman gibi bir kısıt satışı sınırlıyorsa planlama o kısıttan başlar.)

    '
  puanlama:
  - olcut: (a) Aylık satış tutarları ve 18.500.000 TL toplam
    puan: 3
  - olcut: (b) Üretim bütçesi formülü ve dönem sonu stokları (2.400 / 3.000 / 2.800 / 2.600)
    puan: 4
  - olcut: (b) Aylık üretim miktarları (10.400 / 12.600 / 14.800 / 13.800)
    puan: 4
  - olcut: (c) Ham madde kullanım miktarları ve dönem sonu stoklarının izleyen ay kullanımına göre bulunması
    puan: 4
  - olcut: (c) Satın alma miktarları (32.650 / 39.450 / 43.650; toplam 115.750 kg)
    puan: 4
  - olcut: (c) Satın alma tutarları (toplam 4.630.000 TL)
    puan: 2
  - olcut: (d) Direkt işçilik saatleri ve tutarları (toplam 5.670.000 TL)
    puan: 2
  - olcut: (d) Satış bütçesinin başlangıç noktası olmasının açıklanması
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Yönetim muhasebesi, ana bütçe
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "s = [10000, 12000, 15000, 14000, 13000]\nstok = [2000] + [0.2 * s[i + 1] for i in range(4)]\nur = [s[i] + stok[i\
      \ + 1] - stok[i] for i in range(4)]\nkul = [3 * u for u in ur]\nhstok = [8000] + [0.25 * kul[i + 1] for i in range(3)]\n\
      al = [kul[i] + hstok[i + 1] - hstok[i] for i in range(3)]\nsonuc = {\"satis_top\": 500 * sum(s[:3]), \"ur_oc\": ur[0],\
      \ \"ur_su\": ur[1], \"ur_ma\": ur[2], \"ur_ni\": ur[3],\n         \"al_oc\": al[0], \"al_su\": al[1], \"al_ma\": al[2],\
      \ \"al_top\": sum(al), \"al_tl\": 40 * sum(al),\n         \"kul_tl\": 40 * sum(kul[:3]), \"dis_top\": 150 * sum(ur[:3]),\
      \ \"mart_son\": hstok[3]}\n"
  durum: kontrolde
