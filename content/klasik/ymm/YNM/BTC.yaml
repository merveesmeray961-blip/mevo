  soru: 'Nehir Pompa A.Ş. bir pompa modeli üretmektedir. Bir pompanın standart maliyeti: direkt ilk madde 20 TL, direkt işçilik
    18 TL, değişken genel üretim gideri 5 TL × 2 makine saati = 10 TL ve sabit genel üretim gideri. Planlı bakım duruşları
    dikkate alınarak normal kapasite yıllık 80.000 makine saatidir; yıllık sabit genel üretim gideri 960.000 TL''dir. Bir
    pompa 2 makine saati gerektirir. Dönemde talebin düşük kalması nedeniyle 32.000 pompa (64.000 makine saati) üretilmiş,
    27.000 pompa satılmıştır; dönem başı stok yoktur. Fiilî genel üretim gideri bütçeyle aynı gerçekleşmiştir.


    **İstenenler:**

    (a) Normal kapasiteye göre sabit genel üretim gideri yükleme oranını ve pompanın birim standart maliyetini bulunuz. (5
    puan)

    (b) Kapasite sapmasını hesaplayınız ve muhasebe işlemini açıklayınız. (6 puan)

    (c) Dönem sonu mamul stokunu ve satılan mamul maliyetini (kapasite sapması hariç) bulunuz. (5 puan)

    (d) Sabit gider, düşük kapasite kullanımını yansıtacak şekilde fiilî makine saati olan 64.000''e bölünerek yüklenseydi
    stok değeri ne kadar farklı çıkardı? (4 puan)

    '
  cozum: '**(a)** Sabit gider yükleme oranı = 960.000 / 80.000 = **12 TL/saat**. Birim standart maliyet = 20 + 18 + 10 + 2
    × 12 = **72 TL**.


    **(b)** Kapasite sapması = (80.000 − 64.000) × 12 = **192.000 TL** (olumsuz). Üretim birimlerine dağıtılan sabit gider,
    düşük üretim düzeyi nedeniyle artırılmaz; yüklenmeyen sabit gider (734 Kapasite Farkları) gerçekleştiği dönemde gider
    olarak finansal tablolara yansıtılır, stoklara eklenmez.


    **(c)** Stokta kalan = 32.000 − 27.000 = 5.000 pompa; stok değeri = 5.000 × 72 = **360.000 TL**. Satılan mamul maliyeti
    = 27.000 × 72 = **1.944.000 TL**; ayrıca 192.000 TL kapasite sapması dönem gideridir.


    **(d)** Fiilî saate göre sabit oran = 960.000 / 64.000 = 15 TL/saat; birim maliyet = 78 TL; stok değeri = 5.000 × 78 =
    390.000 TL. Fark = **30.000 TL**; bu yöntem stoku fazla gösterir ve normal kapasite ilkesine aykırıdır.

    '
  puanlama:
  - olcut: (a) yükleme oranı ve birim standart maliyet
    puan: 5
  - olcut: (b) kapasite sapması ve muhasebe işlemi
    puan: 6
  - olcut: (c) stok ve satılan mamul maliyeti
    puan: 5
