    | Dönem sonu hedef mamul stoku (adet) | 5.000 | 1.000 |

    | Birim direkt ilk madde (TL) | 40 | 55 |

    | Birim direkt işçilik saati | 2 | 3 |


    Direkt işçilik saat ücreti 25 TL''dir. Genel üretim gideri direkt işçilik saatine göre yüklenecektir: saat başına değişken
    gider 6 TL; yıllık sabit gider 624.000 TL.


    **İstenenler:**

    (a) Üretim bütçesini ve direkt işçilik bütçesini (saat ve TL) hazırlayınız. (6 puan)

    (b) Genel üretim gideri bütçesini ve saat başına yükleme oranını hesaplayınız. (7 puan)

    (c) Her ürünün birim maliyetini ve toplam üretim maliyeti bütçesini bulunuz. (7 puan)

    '
  cozum: '**(a)** Üretim = satış + son stok − başlangıç stoku: A = 12.000 + 5.000 − 3.000 = **14.000**; B = 8.500 + 1.000
    − 1.500 = **8.000** adet. İşçilik saati: A = 14.000 × 2 = 28.000; B = 8.000 × 3 = 24.000; toplam **52.000 saat**. İşçilik
    bütçesi = 52.000 × 25 = **1.300.000 TL**.


    **(b)** Değişken GÜG = 52.000 × 6 = 312.000 TL; sabit GÜG = 624.000 TL; toplam 312.000 + 624.000 = 936.000 TL. Yükleme
    oranı = 936.000 / 52.000 = **18 TL/saat**.


    **(c)** Birim maliyet: A = 40 + 2 × 25 + 2 × 18 = **126 TL**; B = 55 + 3 × 25 + 3 × 18 = **184 TL**. Toplam üretim maliyeti
    = direkt ilk madde 1.000.000 + işçilik 1.300.000 + GÜG 936.000 = **3.236.000 TL**. Kontrol: 14.000 × 126 + 8.000 × 184
    = 3.236.000 TL.

