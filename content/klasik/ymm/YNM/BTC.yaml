      cogs = satis * std_br

      stok = stok_ad * std_br

      f2 = sabit / f_saat

      br2 = 20 + 18 + 10 + 2 * f2

      stok2 = stok_ad * br2

      fark = stok2 - stok

      sonuc = {''a'': std_br, ''b'': kap, ''c'': stok, ''d'': fark, ''cogs'': cogs}

      '
