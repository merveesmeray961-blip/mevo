- id: YMM-YNM-BTC-K001
  sinav: ymm
  ders: YNM
  konu: BTC
  kazanimlar:
  - malzeme ve işçilik sapmaları
  - genel üretim gideri sapmaları
  - esnek bütçe
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Tork A.Ş. standart maliyet sistemi uygulamaktadır. Bir birim mamulün standart maliyet kartı aşağıdadır:


    | Unsur | Standart miktar | Standart fiyat | Birim standart maliyet |

    |---|---|---|---|

    | Direkt ilk madde ve malzeme | 5 kg | 12 TL/kg | 60 TL |

    | Direkt işçilik | 2 saat | 45 TL/saat | 90 TL |

    | Değişken GÜG | 2 DİŞ saati | 15 TL/saat | 30 TL |

    | Sabit GÜG | 2 DİŞ saati | 25 TL/saat | 50 TL |

    | **Toplam** | | | **230 TL** |


    Sabit GÜG oranı, aylık 250.000 TL''lik sabit GÜG bütçesi ile 10.000 direkt işçilik saatlik (5.000 birim) normal kapasiteye
    göre belirlenmiştir. GÜG, direkt işçilik saatine göre yüklenmektedir.


    Ekim ayı fiilî verileri:

    - Üretim: 4.800 birim (dönem başı ve sonu yarı mamul yoktur)

    - Malzeme: 24.500 kg satın alınıp tamamı kullanılmış; kg fiyatı 11,80 TL (toplam 289.100 TL)

    - Direkt işçilik: 9.800 saat; toplam 446.880 TL (saat ücreti 45,60 TL)

    - Fiilî değişken GÜG: 151.900 TL; fiilî sabit GÜG: 256.000 TL


    **İstenenler:**


    (a) Malzeme fiyat ve miktar sapmalarını hesaplayınız. (5 puan)


    (b) İşçilik ücret ve verimlilik sapmalarını hesaplayınız. (5 puan)


    (c) GÜG sapmalarını dört sapma yöntemiyle (değişken GÜG harcama ve verimlilik; sabit GÜG bütçe ve hacim sapmaları) hesaplayınız.
    (10 puan)


    (d) Fiilî üretimin standart maliyeti ile fiilî maliyet arasındaki toplam farkı bulup sapmalarla mutabakatını yapınız;
    hacim sapmasının nedenini ve hangi yönetim kademesinin kontrolünde olduğunu kısaca açıklayınız. (5 puan)

    '
  cozum: 'Fiilî üretim için standart miktarlar: malzeme 4.800 × 5 = 24.000 kg; işçilik 4.800 × 2 = 9.600 saat.


    **(a) Malzeme**

    - Fiyat sapması = (11,80 − 12) × 24.500 = **4.900 TL olumlu**

    - Miktar sapması = (24.500 − 24.000) × 12 = **6.000 TL olumsuz**

    - Toplam: 289.100 − 288.000 = 1.100 TL olumsuz


    **(b) İşçilik**

    - Ücret sapması = (45,60 − 45) × 9.800 = **5.880 TL olumsuz**

    - Verimlilik sapması = (9.800 − 9.600) × 45 = **9.000 TL olumsuz**

    - Toplam: 446.880 − 432.000 = 14.880 TL olumsuz


    **(c) GÜG (dört sapma)**

    - Değişken GÜG harcama = 151.900 − 9.800 × 15 = 151.900 − 147.000 = **4.900 TL olumsuz**

    - Değişken GÜG verimlilik = (9.800 − 9.600) × 15 = **3.000 TL olumsuz**

    - Sabit GÜG bütçe = 256.000 − 250.000 = **6.000 TL olumsuz**

    - Sabit GÜG hacim = 250.000 − 9.600 × 25 = 250.000 − 240.000 = **10.000 TL olumsuz**

    - Toplam GÜG sapması: (151.900 + 256.000) − 9.600 × 40 = 407.900 − 384.000 = 23.900 TL olumsuz (eksik yüklenen GÜG)


    **(d) Mutabakat**

    - Fiilî üretimin standart maliyeti = 4.800 × 230 = 1.104.000 TL

    - Fiilî maliyet = 289.100 + 446.880 + 151.900 + 256.000 = 1.143.880 TL

    - Fark = 39.880 TL olumsuz = 1.100 + 14.880 + 7.900 + 16.000


    Hacim sapması, fiilî üretimin (9.600 standart saat) normal kapasitenin (10.000 saat) altında kalmasından, yani sabit GÜG''ün
    tamamının mamullere yüklenememesinden doğar; bir harcama aşımı değildir. Kapasite kullanımına ilişkin olduğundan genellikle
    üretim planlama ve üst yönetimin (satış ve üretim hacmi kararlarının) sorumluluğundadır; bölüm yöneticisinin harcama kontrolüyle
    doğrudan ilgili değildir.

    '
  puanlama:
  - olcut: (a) Malzeme fiyat sapması 4.900 TL olumlu
    puan: 2
  - olcut: (a) Malzeme miktar sapması 6.000 TL olumsuz (standart fiyatla)
    puan: 3
  - olcut: (b) İşçilik ücret sapması 5.880 TL olumsuz
    puan: 2
  - olcut: (b) İşçilik verimlilik sapması 9.000 TL olumsuz (standart saat 9.600)
    puan: 3
  - olcut: (c) Değişken GÜG harcama (4.900) ve verimlilik (3.000) sapmaları
    puan: 4
  - olcut: (c) Sabit GÜG bütçe sapması 6.000 TL olumsuz
    puan: 2
  - olcut: (c) Sabit GÜG hacim sapması 10.000 TL olumsuz (standart saatle)
    puan: 4
  - olcut: (d) Standart ve fiilî maliyet farkı 39.880 TL ve sapmalarla mutabakat
    puan: 3
  - olcut: (d) Hacim sapmasının nedeni ve sorumluluğunun açıklanması
    puan: 2
  kaynaklar:
