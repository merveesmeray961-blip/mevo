    (d) Sapmaların sorumluluk merkezlerine göre değerlendirmesini yapınız ve satın alma ile üretim arasındaki olası

    ödünleşimi açıklayınız. (4 puan)

    '
  cozum: "**(a) Fiyat ve miktar sapmaları**\n\nFiilî üretim 18.000 kg = 18.000 / 90 = 200 parti. Fiilî üretim için standart\
    \ girdi: A 200 × 60 = 12.000 kg;\nB 200 × 40 = 8.000 kg (toplam 20.000 kg).\n\n| | A | B | Toplam |\n|---|---|---|---|\n\
    | Fiyat sapması: (FF − SF) × FM | (19 − 20) × 13.200 = 13.200 olumlu | (36 − 35) × 7.800 = 7.800 olumsuz | **5.400 olumlu**\
    \ |\n| Miktar sapması: (FM − SM) × SF | (13.200 − 12.000) × 20 = 24.000 olumsuz | (7.800 − 8.000) × 35 = 7.000 olumlu\
    \ | **17.000 olumsuz** |\n\nKontrol: fiilî maliyet 13.200 × 19 + 7.800 × 36 = 250.800 + 280.800 = 531.600 TL; standart\
    \ maliyet 200 × 2.600 =\n520.000 TL; fark 11.600 TL olumsuz = 17.000 olumsuz − 5.400 olumlu.\n\n**(b) Karma ve verim sapmaları**\n\
    \nFiilî toplam girdi 21.000 kg; standart karmayla dağılımı: A 21.000 × %60 = 12.600 kg, B 21.000 × %40 = 8.400 kg.\nStandart\
    \ ortalama girdi maliyeti = 2.600 / 100 = 26 TL/kg.\n\n- Karma sapması = (fiilî miktar − standart karmadaki fiilî toplam)\
    \ × SF:\n  A (13.200 − 12.600) × 20 = 12.000 olumsuz; B (7.800 − 8.400) × 35 = 21.000 olumlu → **9.000 TL olumlu**.\n\
    - Verim sapması = (fiilî toplam girdi − fiilî üretim için standart toplam girdi) × standart ortalama girdi maliyeti =\n\
    \  (21.000 − 20.000) × 26 = **26.000 TL olumsuz**.\n- Kontrol: 9.000 olumlu + 26.000 olumsuz = 17.000 TL olumsuz miktar\
    \ sapması.\n\n**(c) Yevmiye kayıtları**\n\nHam maddelerin kullanımı (fiilî maliyetle):\n\n| Hesap | Borç | Alacak |\n\
    |---|---|---|\n| 710 Direkt İlkmadde ve Malzeme Giderleri | 531.600 | |\n| 150 İlk Madde ve Malzeme | | 531.600 |\n\n\
    Standart maliyetin üretime yansıtılması ve farkların ayrılması:\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n| 151 Yarı\
    \ Mamuller – Üretim (standart) | 520.000 | |\n| 713 Direkt İlkmadde ve Malzeme Miktar Farkı | 17.000 | |\n| 712 Direkt\
    \ İlkmadde ve Malzeme Fiyat Farkı | | 5.400 |\n| 711 Direkt İlkmadde ve Malzeme Yansıtma Hesabı | | 531.600 |\n| 711 Direkt\
    \ İlkmadde ve Malzeme Yansıtma Hesabı | 531.600 | |\n| 710 Direkt İlkmadde ve Malzeme Giderleri | | 531.600 |\n\nNet fark\
    \ 11.600 TL olumsuzdur; önemli olduğundan dönem sonunda mamul stoku ile satılan mamullere oranla dağıtılır:\n\n| Hesap\
    \ | Borç | Alacak |\n|---|---|---|\n| 620 Satılan Mamuller Maliyeti (%75) | 8.700 | |\n| 152 Mamuller (%25) | 2.900 |\
    \ |\n| 712 Direkt İlkmadde ve Malzeme Fiyat Farkı | 5.400 | |\n| 713 Direkt İlkmadde ve Malzeme Miktar Farkı | | 17.000\
    \ |\n\n(Fark önemsiz olsaydı tamamı 620 Satılan Mamuller Maliyeti hesabına aktarılabilirdi.)\n\n**(d) Sorumluluk ve ödünleşim**\n\
    \nFiyat sapması satın alma bölümünün, karma ve verim sapmaları üretim bölümünün sorumluluğundadır. Üretim, daha ucuz\n\
    olan A'yı standart karmanın üzerinde (B yerine) kullanmış ve 9.000 TL olumlu karma sapması yaratmış; ancak bu\nkarma 26.000\
    \ TL olumsuz verim sapmasına yol açmıştır (aynı çıktı için daha fazla girdi). A'nın ucuz alınması\n(13.200 TL olumlu)\
    \ kalitesinin düşük olmasından kaynaklanıyorsa verim kaybının bir bölümü satın almaya da\nyüklenebilir. Sapmalar birlikte\
    \ değerlendirilmeli, bir bölümün olumlu sapması diğerinin olumsuz sapması pahasına\nelde edilmemelidir.\n"
