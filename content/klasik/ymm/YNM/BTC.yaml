  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Her bir üretim birimine dağıtılan sabit genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle
      arttırılmaz. Dağıtılmayan genel giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Anormal bir şekilde yüksek üretimin gerçekleştiği dönemlerde, her bir üretim birimine dağıtılan sabit genel gider
      miktarı düşer ve böylece stoklar maliyet değerini aşan bir değer üzerinden ölçülmemiş olur.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'normal = 80000

      f_saat = 64000

      sabit = 960000

      f = sabit / normal

      std_br = 20 + 18 + 10 + 2 * f

      kap = (normal - f_saat) * f

      uretim = 32000

      satis = 27000

