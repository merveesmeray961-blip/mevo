    (a) En yüksek-en düşük yöntemiyle maliyet formülünü (birim değişken gider ve sabit gider) bulunuz. (5 puan)

    (b) 12.500 saatlik esnek bütçeyi hazırlayarak bütçe (harcama) sapmasını hesaplayınız. (7 puan)

    (c) Normal kapasiteye göre genel üretim gideri yükleme oranını hesaplayarak toplam sapmayı bütçe, verimlilik ve kapasite
    sapması olarak ayırınız. (8 puan)

    '
  cozum: '**(a)** Birim değişken gider = (170.000 − 140.000) / (16.000 − 10.000) = **5 TL/saat**; sabit gider = 140.000 −
    5 × 10.000 = **90.000 TL**.


    **(b)** Esnek bütçe (12.500 saat) = 90.000 + 5 × 12.500 = 152.500 TL. Bütçe sapması = 156.000 − 152.500 = **3.500 TL**
    (olumsuz); THP''de 732 hesapta izlenir.


    **(c)** Sabit gider yükleme oranı = 90.000 / 15.000 = 6 TL/saat; toplam oran = 5 + 6 = **11 TL/saat**. Yüklenen GÜG =
    12.000 × 11 = 132.000 TL. Toplam sapma = 156.000 − 132.000 = **24.000 TL** (olumsuz).


