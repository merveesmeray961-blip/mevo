  konu: BTC
  kazanimlar:
  - nakit bütçesi ve finansman ihtiyacı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "Güneş Ticaret A.Ş. 2026 yılının ilk çeyreği için nakit bütçesi hazırlamaktadır. Bilgiler (tutarlar TL):\n\n| Ay |\
    \ Satışlar |\n|---|---|\n| Kasım 2025 (gerçekleşen) | 4.000.000 |\n| Aralık 2025 (gerçekleşen) | 4.500.000 |\n| Ocak 2026\
    \ | 5.000.000 |\n| Şubat 2026 | 6.000.000 |\n| Mart 2026 | 7.000.000 |\n| Nisan 2026 | 8.000.000 |\n\n- Satışların %30'u\
    \ peşin tahsil edilir; %50'si izleyen ay, %18'i ikinci ay tahsil edilir; %2'si tahsil edilemez.\n- Her ay, izleyen ayın\
    \ satışlarının %60'ı tutarında ticari mal satın alınır. Alımların %40'ı alım ayında, %60'ı\n  izleyen ay ödenir.\n- Aylık\
    \ nakit faaliyet giderleri (ücret, kira, enerji) 900.000 TL'dir; ayrıca aylık 150.000 TL amortisman gideri vardır.\n-\
    \ Şubat ayında peşin ödemeyle 2.500.000 TL'lik bir makine alınacak, Mart ayında 400.000 TL geçici vergi ödenecektir.\n\
    - 1 Ocak 2026 nakit mevcudu 300.000 TL'dir; her ay sonunda en az 500.000 TL nakit bulundurulacaktır.\n- Nakit açığı, ay\
    \ başında alınan ve 100.000 TL'nin katları olan banka kredisiyle kapatılır. Kredinin aylık %4 faizi\n  her ay sonunda\
    \ o ay başındaki kredi bakiyesi üzerinden ödenir. Nakit fazlası oluştuğunda, asgari nakit korunarak\n  ay sonunda 100.000\
    \ TL'nin katları hâlinde anapara geri ödenir.\n\n**İstenenler:**\n\n(a) Ocak, Şubat ve Mart ayları için tahsilat bütçesini\
    \ hazırlayınız. (6 puan)\n\n(b) Aynı aylar için ticari mal alımlarını ve satıcılara ödemeleri hesaplayınız. (6 puan)\n\
    \n(c) Kredi kullanımı, faiz ve geri ödemeyi içeren aylık nakit bütçesini hazırlayınız; Mart sonu nakit mevcudunu ve\n\
    kredi bakiyesini bulunuz. (10 puan)\n\n(d) 31 Mart 2026 itibarıyla proforma bilançoda yer alacak ticari alacak (tahsil\
    \ edilemeyecek tutar düşülmüş) ve\nsatıcılar bakiyelerini hesaplayınız. (3 puan)\n"
  cozum: "**(a) Tahsilatlar**\n\n| Kaynak | Ocak | Şubat | Mart |\n|---|---|---|---|\n| Ayın satışından %30 | 1.500.000 |\
    \ 1.800.000 | 2.100.000 |\n| Önceki ay satışından %50 | 2.250.000 | 2.500.000 | 3.000.000 |\n| İki ay önceki satıştan\
    \ %18 | 720.000 | 810.000 | 900.000 |\n| **Toplam tahsilat** | **4.470.000** | **5.110.000** | **6.000.000** |\n\nTahsil\
    \ edilemeyen %2 nakit akışı doğurmaz (şüpheli alacak karşılığı / gider olarak izlenir).\n\n**(b) Alımlar ve ödemeler**\n\
    \nAlımlar: Aralık 0,60 × 5.000.000 = 3.000.000; Ocak 3.600.000; Şubat 4.200.000; Mart 0,60 × 8.000.000 = 4.800.000.\n\n\
    | | Ocak | Şubat | Mart |\n|---|---|---|---|\n| Ayın alımından %40 | 1.440.000 | 1.680.000 | 1.920.000 |\n| Önceki ay\
    \ alımından %60 | 1.800.000 | 2.160.000 | 2.520.000 |\n| **Satıcılara ödeme** | **3.240.000** | **3.840.000** | **4.440.000**\
    \ |\n\n**(c) Nakit bütçesi**\n\n| Kalem | Ocak | Şubat | Mart |\n|---|---|---|---|\n| Dönem başı nakit | 300.000 | 630.000\
    \ | 516.000 |\n| + Tahsilatlar | 4.470.000 | 5.110.000 | 6.000.000 |\n| − Satıcılara ödeme | (3.240.000) | (3.840.000)\
    \ | (4.440.000) |\n| − Nakit faaliyet giderleri | (900.000) | (900.000) | (900.000) |\n| − Makine alımı | – | (2.500.000)\
    \ | – |\n| − Geçici vergi | – | – | (400.000) |\n| **Finansman öncesi nakit** | **630.000** | **(1.500.000)** | **776.000**\
    \ |\n| + Kredi kullanımı (ay başı) | – | 2.100.000 | – |\n| − Faiz (%4) | – | (84.000) | (84.000) |\n| − Anapara geri\
    \ ödemesi | – | – | (100.000) |\n| **Dönem sonu nakit** | **630.000** | **516.000** | **592.000** |\n\n- Amortisman nakit\
    \ çıkışı olmadığından bütçeye girmez.\n- Şubat: gereken kredi K için −1.500.000 + K − 0,04K ≥ 500.000 → 0,96K ≥ 2.000.000\
    \ → K ≥ 2.083.333 → 100.000'in\n  katı olarak **2.100.000 TL**.\n- Mart: faiz sonrası nakit 776.000 − 84.000 = 692.000\
    \ TL; asgari nakit korunarak geri ödenebilecek tutar\n  192.000 TL olup 100.000'in katı olarak **100.000 TL** geri ödenir.\n\
    - Mart sonu nakit **592.000 TL**, kredi bakiyesi **2.000.000 TL**.\n\n**(d) Proforma bakiyeler**\n\n- Ticari alacaklar:\
    \ Mart satışından tahsil edilecek %50 + %18 = 0,68 × 7.000.000 = 4.760.000; Şubat satışından %18 =\n  1.080.000 → toplam\
    \ **5.840.000 TL** (tahsil edilemeyecek %2'lik kısımlar hariç).\n- Satıcılar: Mart alımının ödenmemiş %60'ı = 0,60 × 4.800.000\
    \ = **2.880.000 TL**.\n"
  puanlama:
  - olcut: (a) Tahsilat oranlarının doğru aylara uygulanması
    puan: 3
  - olcut: (a) Tahsilat toplamları (4.470.000 / 5.110.000 / 6.000.000) ve %2'nin nakit dışı kalması
    puan: 3
  - olcut: (b) Alım tutarlarının izleyen ay satışına göre bulunması
