  dogrulama:
    python: "uretim = 4800\nsm = uretim * 5\nss = uretim * 2\nfm = 24500\nfs = 9800\nm_fiyat = round((11.80 - 12) * fm, 2)\n\
      m_miktar = (fm - sm) * 12\ni_ucret = round((45.60 - 45) * fs, 2)\ni_verim = (fs - ss) * 45\ndg_harcama = 151900 - fs\
      \ * 15\ndg_verim = (fs - ss) * 15\nsg_butce = 256000 - 250000\nsg_hacim = 250000 - ss * 25\nstd = uretim * 230\nfiili\
      \ = 289100 + 446880 + 151900 + 256000\ntoplam = m_fiyat + m_miktar + i_ucret + i_verim + dg_harcama + dg_verim + sg_butce\
      \ + sg_hacim\nsonuc = {\"malzeme_fiyat\": m_fiyat, \"malzeme_miktar\": m_miktar, \"iscilik_ucret\": i_ucret,\n     \
      \    \"iscilik_verimlilik\": i_verim, \"dgug_harcama\": dg_harcama, \"dgug_verimlilik\": dg_verim,\n         \"sgug_butce\"\
      : sg_butce, \"sgug_hacim\": sg_hacim, \"standart_maliyet\": std,\n         \"fiili_maliyet\": fiili, \"toplam_fark\"\
      : fiili - std, \"sapma_toplami\": round(toplam, 2)}\n"
  durum: kontrolde
