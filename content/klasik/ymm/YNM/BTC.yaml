  soru: 'Marmara Çanta A.Ş.''nin 2026 yılı statik (sabit) bütçesi ve fiilî sonuçları aşağıdadır:


    | Kalem | Statik bütçe | Fiilî sonuç |

    |---|---|---|

    | Satış miktarı (adet) | 20.000 | 18.000 |

    | Birim satış fiyatı (TL) | 250 | 260 |

    | Değişken üretim maliyetleri | adet başına 120 TL | toplam 2.250.000 TL |

    | Değişken satış giderleri | adet başına 10 TL | toplam 171.000 TL |

    | Sabit üretim giderleri | 800.000 TL | 830.000 TL |

    | Sabit pazarlama ve yönetim giderleri | 600.000 TL | 590.000 TL |


    Bütçe, sektörün 2026 satışlarının 200.000 adet olacağı ve işletmenin %10 pazar payı elde edeceği varsayımıyla

    hazırlanmıştır. Sektörün fiilî satışları 150.000 adet olmuştur. Stok yoktur.


    **İstenenler:**


    (a) Statik bütçe, fiilî satış hacmine göre esnek bütçe ve fiilî sonuçların faaliyet kârını katkı payı formatında

    gösteriniz. (8 puan)


    (b) Fiilî kâr ile statik bütçe kârı arasındaki toplam farkı satış hacmi sapması ve esnek bütçe sapmasına ayırınız;

    esnek bütçe sapmasını kalemler itibarıyla olumlu/olumsuz olarak gösteriniz. (9 puan)


    (c) Satış hacmi sapmasını pazar büyüklüğü sapması ve pazar payı sapmasına ayırınız. (5 puan)


    (d) Performans değerlendirmesinde statik bütçe yerine esnek bütçenin kullanılmasının gerekçesini açıklayınız. (3 puan)

    '
  cozum: "**(a) Bütçe karşılaştırması**\n\nBütçelenen birim değişken maliyet = 120 + 10 = 130 TL; bütçelenen birim katkı payı\
    \ = 250 − 130 = 120 TL.\n\n| Kalem | Statik bütçe (20.000) | Esnek bütçe (18.000) | Fiilî (18.000) |\n|---|---|---|---|\n\
    | Satışlar | 5.000.000 | 4.500.000 | 4.680.000 |\n| Değişken üretim maliyetleri | (2.400.000) | (2.160.000) | (2.250.000)\
    \ |\n| Değişken satış giderleri | (200.000) | (180.000) | (171.000) |\n| Katkı payı | 2.400.000 | 2.160.000 | 2.259.000\
    \ |\n| Sabit üretim giderleri | (800.000) | (800.000) | (830.000) |\n| Sabit pazarlama ve yönetim giderleri | (600.000)\
    \ | (600.000) | (590.000) |\n| **Faaliyet kârı** | **1.000.000** | **760.000** | **839.000** |\n\n**(b) Sapmalar**\n\n\
    Toplam fark = 839.000 − 1.000.000 = **161.000 TL olumsuz**.\n\n- Satış hacmi sapması = esnek bütçe kârı − statik bütçe\
    \ kârı = 760.000 − 1.000.000 = **240.000 TL olumsuz**\n  (2.000 adet × 120 TL bütçelenen katkı payı).\n- Esnek bütçe sapması\
    \ = fiilî kâr − esnek bütçe kârı = 839.000 − 760.000 = **79.000 TL olumlu**:\n\n| Kalem | Sapma (TL) | Yön |\n|---|---|---|\n\
    | Satış fiyatı: 18.000 × (260 − 250) | 180.000 | Olumlu |\n| Değişken üretim maliyetleri: 2.250.000 − 2.160.000 | 90.000\
    \ | Olumsuz |\n| Değişken satış giderleri: 180.000 − 171.000 | 9.000 | Olumlu |\n| Sabit üretim giderleri: 830.000 − 800.000\
    \ | 30.000 | Olumsuz |\n| Sabit pazarlama ve yönetim giderleri: 600.000 − 590.000 | 10.000 | Olumlu |\n| **Esnek bütçe\
    \ sapması** | **79.000** | **Olumlu** |\n\nKontrol: −240.000 + 79.000 = −161.000 TL.\n\n**(c) Satış hacmi sapmasının ayrıştırılması**\n\
    \nFiilî pazar payı = 18.000 / 150.000 = %12.\n\n- Pazar büyüklüğü sapması = (fiilî pazar − bütçelenen pazar) × bütçelenen\
    \ pay × bütçelenen birim KP =\n  (150.000 − 200.000) × %10 × 120 = **600.000 TL olumsuz**.\n- Pazar payı sapması = (fiilî\
    \ pay − bütçelenen pay) × fiilî pazar × bütçelenen birim KP =\n  (%12 − %10) × 150.000 × 120 = **360.000 TL olumlu**.\n\
    - Toplam: −600.000 + 360.000 = −240.000 TL (satış hacmi sapması).\n\nSatış miktarındaki düşüş, işletmenin kontrolü dışındaki\
    \ pazar daralmasından kaynaklanmıştır; pazarlama bölümü\npazar payını artırarak başarılı bir performans göstermiştir.\n\
    \n**(d) Esnek bütçenin gerekçesi**\n\nStatik bütçe, bütçelenen faaliyet hacmine göre hazırlandığından fiilî hacim farklı\
    \ olduğunda gelir ve değişken\ngiderlerin karşılaştırması anlamsızlaşır (bu örnekte değişken giderler statik bütçeye göre\
    \ olumlu görünür, oysa\nfiilî hacim düzeyinde olumsuzdur). Esnek bütçe, gerçekleşen hacimde olması gereken gelir ve maliyetleri\
    \ gösterir;\nböylece hacim etkisi (satış hacmi sapması) ile fiyat ve maliyet kontrolüne ilişkin etkiler (esnek bütçe sapması)\n\
    ayrılır ve yöneticiler kontrol edebildikleri unsurlardan sorumlu tutulur.\n"
