    |---|---|---|---|

    | Bütçe | 156.000 − 152.500 | 3.500 | 732 |

    | Verimlilik | (12.500 − 12.000) × 11 | 5.500 | 733 |

    | Kapasite | (15.000 − 12.500) × 6 | 15.000 | 734 |

    | **Toplam** | | **24.000** | |

    '
