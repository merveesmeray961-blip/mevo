      \ \"bm1\": bm[0], \"bm2\": bm[1], \"bm3\": bm[2],\n         \"smm1\": smm[0], \"smm2\": smm[1], \"smm3\": smm[2], \"\
      tk1\": tk[0], \"tk2\": tk[1], \"tk3\": tk[2],\n         \"f1\": tk[0] - dk[0], \"f2\": abs(tk[1] - dk[1]), \"f3\": abs(tk[2]\
      \ - dk[2]), \"top\": sum(tk)}\n"
