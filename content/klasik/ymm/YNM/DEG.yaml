  konu: DEG
  kazanimlar:
  - tam maliyetleme ve FIFO
  - değişken maliyetleme
  - stok azalışında kâr farkı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Gökova Armatür San. A.Ş. tek tip armatür üretmekte ve 7/A seçeneğini uygulamaktadır. Stoklar ilk giren ilk çıkar
    (FIFO) yöntemiyle değerlenmektedir. 2026 yılı verileri:


    - Dönem başı mamul stoku 3.000 adet; geçen yılın tam birim maliyeti 140 TL (direkt ilkmadde 60, direkt işçilik 40, değişken
    GÜG 20, sabit GÜG 20).

    - Cari yıl üretimi 6.000 adet; birim direkt ilkmadde 60 TL, direkt işçilik 40 TL, değişken GÜG 20 TL; cari yıl sabit GÜG
    toplamı 192.000 TL (üretime fiili üretim üzerinden yüklenmektedir, yükleme farkı yoktur).

    - Satış 8.000 adet, birim fiyat 260 TL. Birim değişken satış gideri 8 TL; yıllık sabit satış ve yönetim giderleri 90.000
    TL.


    **İstenenler:**


    (a) Tam maliyetleme ve FIFO ile satılan mamul maliyetini (620), dönem sonu 152 bakiyesini ve dönem kârını hesaplayınız.
    (8 puan)


    (b) Değişken maliyetleme ile dönem kârını hesaplayınız (dönem başı stokun birim değişken maliyeti 120 TL''dir). (6 puan)


    (c) Kâr farkını, dönem sonu stoktaki ve dönem başı stoktaki sabit GÜG''yi kullanarak mutabakat tablosuyla açıklayınız.
    (6 puan)


    (d) Üretimin satıştan az olduğu bu dönemde tam maliyet kârının değişken maliyet kârından düşük çıkmasının nedenini açıklayınız
    ve 152 hesaptaki hareketi (borç/alacak) gösteriniz. (5 puan)

    '
  cozum: '**(a)** Cari yıl sabit GÜG birimi = 192.000 / 6.000 = 32 TL; cari yıl tam birim maliyet = 60 + 40 + 20 + 32 = **152
    TL**. FIFO''ya göre önce dönem başı 3.000 adet (140 TL), sonra cari yıl üretiminden 5.000 adet satılır.


    620 = 3.000 × 140 + 5.000 × 152 = 420.000 + 760.000 = **1.180.000 TL**. Dönem sonu stok = 1.000 adet × 152 = **152.000
    TL** (152 bakiyesi).


    | Gelir tablosu (tam maliyet) | TL |

    |---|---:|

    | Satışlar (8.000 × 260) | 2.080.000 |

    | Satılan mamul maliyeti | (1.180.000) |

    | Brüt satış kârı | 900.000 |

    | Değişken satış gideri (8.000 × 8) ve sabit satış-yönetim gideri | (154.000) |

    | **Dönem kârı** | **746.000** |


    **(b)** Değişken maliyet: 8.000 × 120 = 960.000 TL. Katkı payı = 2.080.000 − 960.000 − 64.000 = 1.056.000 TL; sabit giderler
    = 192.000 + 90.000 = 282.000 TL; **dönem kârı = 774.000 TL**.


    **(c)** Fark = 746.000 − 774.000 = **-28.000 TL**.


    | Mutabakat | TL |

    |---|---:|

    | Dönem sonu stoktaki sabit GÜG (1.000 × 32) — dönem gideri olmaktan çıkar | +32.000 |

    | Dönem başı stoktan çıkan sabit GÜG (3.000 × 20) — cari yılın satış maliyetine girer | −60.000 |

    | **Tam maliyet kârı − değişken maliyet kârı** | **−28.000** |


    **(d)** Stok 3.000 adetten 1.000 adede indiği için önceki yıllarda aktifleştirilmiş 60.000 TL sabit GÜG cari yıl satış
    maliyetine yansırken yalnız 32.000 TL sabit GÜG yıl sonu stokuyla ertelenmiştir. 152 hesap: dönem başı 420.000 borç bakiyesi;
    üretimin ambara alınması 912.000 TL borç (6.000 × 152); satış 1.180.000 TL alacak; dönem sonu bakiye 152.000 TL borç.


    Püf noktaları: Eski stoğun birim maliyeti ile yeni üretimin birim maliyeti farklı olduğundan FIFO''da önce eski stoğu
    satın. Stok azalıyorsa tam maliyet kârı değişken maliyet kârının altında kalır.

    '
  puanlama:
  - olcut: (a) Cari yıl birim maliyet 152 ve FIFO ile 620 = 1.180.000
    puan: 4
  - olcut: (a) 152 bakiyesi 152.000 ve dönem kârı 746.000
    puan: 4
  - olcut: (b) Dönem kârı 774.000 (katkı payı 1.056.000)
    puan: 6
  - olcut: '(c) Mutabakat: +32.000 − 60.000 = −28.000'
    puan: 6
  - olcut: (d) Nedenin açıklanması ve 152 hesap hareketi
    puan: 5
