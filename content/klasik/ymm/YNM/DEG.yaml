- id: YMM-YNM-DEG-K010
  sinav: ymm
  ders: YNM
  konu: DEG
  kazanimlar:
  - normal kapasiteye göre tam maliyetleme
  - eksik yükleme farkının ayrıştırılması
  - yükleme farkının stok ve satış maliyetine aktarılması
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Konya Tarım Aletleri A.Ş. 7/A seçeneğini ve önceden saptanmış (normal) genel üretim gideri yükleme yöntemini uygulamaktadır.
    GÜG, direkt işçilik saati (DİS) üzerinden tam maliyetleme esasına göre yüklenmektedir. 2026 yılı standartları: normal
    kapasite 25.000 DİS; sabit GÜG bütçesi 500.000 TL; değişken GÜG 10 TL/DİS; bir birim ürün 2 DİS gerektirir. Birim direkt
    ilkmadde 70 TL, direkt işçilik 50 TL''dir.


    Gerçekleşenler: üretim 10.000 adet (fiili DİS standart saate eşit, 20.000 saat); fiili sabit GÜG 508.000 TL, fiili değişken
    GÜG 212.000 TL. Üretilen 10.000 adetten 8.000 adedi birim 300 TL''den satılmıştır (dönem başı stok yoktur).


    Farkların hesabında şu tanımlar kullanılacaktır: bütçe farkı = fiili GÜG − esnek bütçe (sabit bütçe + değişken GÜG × fiili
    DİS); verimlilik farkı = (fiili DİS − standart DİS) × değişken GÜG oranı; kapasite farkı = (normal kapasite − standart
    DİS) × sabit GÜG oranı. Yükleme farkı, stok ve satış maliyeti arasında üretim miktarı oranında paylaştırılacaktır.


    **İstenenler:**


    (a) Sabit GÜG oranını, yüklenen GÜG''yi ve toplam yükleme farkını hesaplayınız. (4 puan)


    (b) Farkı bütçe, verimlilik ve kapasite farkı olarak ayrıştırınız. (6 puan)


    (c) 730 ve 731 hesaplarını içeren yansıtma ve kapanış kayıtlarını (732, 733, 734 dahil) yapınız; yükleme farkının stok
    ve satış maliyetine aktarılma kaydını gösteriniz. (8 puan)


    (d) Brüt satış kârını ve 152 stok değerini bulunuz; farkın tamamı 620''ye yazılsaydı brüt kârın ne olacağını belirtiniz.
    (7 puan)

    '
  cozum: '**(a)** Sabit GÜG oranı = 500.000 / 25.000 = **20 TL/DİS**; toplam oran 30 TL/DİS. Yüklenen = 20.000 × 30 = **600.000
    TL**; fiili GÜG = 508.000 + 212.000 = 720.000 TL; fark = **120.000 TL (eksik yükleme)**.


    **(b)** Esnek bütçe = 500.000 + 10 × 20.000 = 700.000 TL.


    | Fark | Hesap | Hesaplama | TL |

    |---|---:|---:|---:|

    | Bütçe | 732 | 720.000 − 700.000 | 20.000 olumsuz |

    | Verimlilik | 733 | (20.000 − 20.000) × 10 | 0 |

    | Kapasite | 734 | (25.000 − 20.000) × 20 | 100.000 olumsuz |

    | **Toplam** |  |  | **120.000** |


    **(c)**


    *1) Fiili GÜG*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 720.000 |  |

    | İlgili aktif ve pasif hesaplar |  | 720.000 |

    | **Toplam** | **720.000** | **720.000** |


    *2) Yüklenen GÜG*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 600.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 600.000 |

    | **Toplam** | **600.000** | **600.000** |


    *3) Kapanış*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 600.000 |  |

    | 732 Genel Üretim Giderleri Bütçe Farkları | 20.000 |  |

    | 734 Genel Üretim Giderleri Kapasite Farkları | 100.000 |  |

    | 730 Genel Üretim Giderleri |  | 720.000 |

    | **Toplam** | **720.000** | **720.000** |


    *4) Farkların stok (%20) ve satış maliyetine (%80) aktarılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 152 Mamuller | 24.000 |  |

    | 620 Satılan Mamuller Maliyeti | 96.000 |  |

    | 732 Genel Üretim Giderleri Bütçe Farkları |  | 20.000 |

    | 734 Genel Üretim Giderleri Kapasite Farkları |  | 100.000 |

