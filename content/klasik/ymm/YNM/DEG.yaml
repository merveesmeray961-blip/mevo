    sabit genel gideri üretilen birimlere eşit dağıtılır. Başlangıç stoku sıfır, birim değişken üretim maliyeti ve satış fiyatı
    iki yöntemde aynı, başka stok farkı yoktur. Normal kapasite 12.000 birimdir.


    (a) Tam ve değişken maliyetleme yöntemlerinde sabit üretim genel giderinin muhasebeleştirilmesini karşılaştırınız. (8
    puan)

    (b) İki yönteme göre dönem kârı farkını hesaplayınız. (8 puan)

    (c) Normal kapasitenin sabit genel üretim gideri dağıtımındaki rolünü açıklayınız. (9 puan)'
  cozum: '(a) Tam maliyetlemede sabit üretim genel gideri ürün maliyetine alınır; değişken maliyetlemede dönem gideridir.

    (b) Birim sabit üretim genel gideri = 360000/12000=30 TL. Stok artışı = 12000-10000=2000 birim. Tam maliyet kârı değişken
    maliyet kârından 2000×30=60000 TL daha yüksektir.

    (c) Normal kapasite, olağan uzun dönem faaliyet seviyesidir; birim sabit genel giderin aşırı dalgalanmasını önlemeye yardımcı
    olur.'
