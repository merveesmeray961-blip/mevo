      (a) çözümü yüzeysel: tam maliyette ürün maliyetine/stoka, değişkende dönem gideri olarak 2000 birim stokta 60000 TL
      ertelenmesi ve kayıt/hesap yok; (c) normal kapasite altı üretimde dağıtılmayan sabit GÜG''ün dönem gideri (TMS 2.13)
      olduğu belirtilmemiş.'
