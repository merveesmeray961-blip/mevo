- id: YMM-YNM-DEG-K001
  sinav: ymm
  ders: YNM
  konu: DEG
  kazanimlar:
  - değişken ve tam maliyetle kâr farkı
  - stok değişiminin kâra etkisi
  - normal kapasite
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Deniz A.Ş. tek tür mamul üretmektedir. İki yıla ilişkin bütçe ve fiilî veriler aynıdır:


    | Kalem | Tutar |

    |---|---|

    | Birim satış fiyatı | 100 TL |

    | Birim değişken üretim maliyeti | 40 TL |

    | Birim değişken satış gideri | 6 TL |

    | Yıllık sabit üretim genel gideri | 480.000 TL |

    | Yıllık sabit pazarlama ve yönetim gideri | 150.000 TL |

    | Normal kapasite | 24.000 birim/yıl |


    | | 1. yıl | 2. yıl |

    |---|---|---|

    | Üretim | 26.000 birim | 20.000 birim |

    | Satış | 22.000 birim | 24.000 birim |


    İşletme 1. yılın başında faaliyete başlamıştır (dönem başı stok yoktur). Tam maliyetlemede sabit üretim genel gideri normal
    kapasiteye göre birimlere yüklenmekte, hacim farkı her yıl sonunda satılan mamul maliyetine aktarılmaktadır. Stok çıkışlarında
    FIFO yöntemi uygulanmaktadır.


    **İstenenler:**


    (a) Her iki yıl için tam maliyetlemeye göre gelir tablosunu (satışlar, satılan mamul maliyeti, hacim farkı, brüt kâr,
    faaliyet giderleri, faaliyet kârı) düzenleyiniz. (10 puan)


    (b) Her iki yıl için değişken maliyetlemeye göre gelir tablosunu düzenleyiniz. (6 puan)


    (c) Her yıl için iki yöntem arasındaki kâr farkını stok değişimiyle mutabakat yaparak açıklayınız; iki yılın toplam kârlarını
    karşılaştırınız. (5 puan)


    (d) 1. yılda satışlar 2. yıla göre daha düşük olduğu hâlde tam maliyetlemede 1. yıl kârının yüksek çıkmasının nedenini
    ve bunun yönetici performans değerlendirmesi açısından doğurduğu sakıncayı kısaca açıklayınız. (4 puan)

    '
  cozum: 'Birim sabit GÜG oranı = 480.000 / 24.000 = 20 TL; birim tam (standart) üretim maliyeti = 40 + 20 = 60 TL.


    **(a) Tam maliyetleme (TL)**


    | | 1. yıl | 2. yıl |

    |---|---|---|

    | Satışlar | 22.000 × 100 = 2.200.000 | 24.000 × 100 = 2.400.000 |

    | SMM (normal maliyetle, × 60) | 1.320.000 | 1.440.000 |

    | Hacim farkı | (26.000 − 24.000) × 20 = 40.000 olumlu (−) | (24.000 − 20.000) × 20 = 80.000 olumsuz (+) |

    | Düzeltilmiş SMM | 1.280.000 | 1.520.000 |

    | Brüt kâr | 920.000 | 880.000 |

    | Değişken satış gideri (× 6) | 132.000 | 144.000 |

    | Sabit pazarlama ve yönetim gideri | 150.000 | 150.000 |

    | **Faaliyet kârı** | **638.000** | **586.000** |


    **(b) Değişken maliyetleme (TL)**


    | | 1. yıl | 2. yıl |

    |---|---|---|

    | Satışlar | 2.200.000 | 2.400.000 |

    | Değişken maliyetler (× 46) | 1.012.000 | 1.104.000 |

    | Katkı payı | 1.188.000 | 1.296.000 |

    | Sabit üretim genel gideri | 480.000 | 480.000 |

    | Sabit pazarlama ve yönetim gideri | 150.000 | 150.000 |

    | **Faaliyet kârı** | **558.000** | **666.000** |


    **(c) Mutabakat**

    - 1. yıl: stok 0 → 4.000 birim; stokta ertelenen sabit GÜG 4.000 × 20 = 80.000 TL. Tam maliyetleme kârı 638.000 − 558.000
    = 80.000 TL fazla.

    - 2. yıl: stok 4.000 → 0 birim; önceki yıldan gelen 80.000 TL sabit GÜG gidere dönüşür. Tam maliyetleme kârı 586.000 −
    666.000 = −80.000 TL (80.000 TL az).

    - İki yılın toplamı: tam maliyetleme 638.000 + 586.000 = 1.224.000 TL; değişken maliyetleme 558.000 + 666.000 = 1.224.000
    TL. Başlangıçta ve sonda stok olmadığından toplamlar eşittir; yöntem yalnız kârın yıllara dağılımını değiştirir.


    **(d) Yorum**


    Tam maliyetlemede 1. yılda satıştan fazla üretilen 4.000 birim, 80.000 TL sabit GÜG''ü stokta (bilançoda) bırakmış ve
    gideri ertelemiştir; ayrıca normal kapasitenin üstünde üretim olumlu hacim farkı yaratmıştır. Böylece kâr, satış performansından
    bağımsız olarak üretim hacmine göre yükselmiştir. Tam maliyetleme kârıyla değerlendirilen yönetici, talep olmadığı hâlde
    stok üreterek kârı artırma eğilimine girebilir (stok tutma maliyeti, eskime riski). Değişken maliyetlemede kâr satışlarla
    aynı yönde hareket ettiğinden (2. yılda satış arttı, kâr arttı) performans değerlendirmesinde daha güvenilir bir göstergedir;
    tam maliyetleme kullanılıyorsa stok düzeyi hedefleri ya da stok tutma maliyeti yüklemesi gibi önlemler gerekir.

    '
  puanlama:
  - olcut: (a) Birim sabit GÜG oranı 20 TL ve normal maliyetle SMM
    puan: 2
  - olcut: (a) Hacim farklarının tutarı ve yönü (1. yıl 40.000 olumlu, 2. yıl 80.000 olumsuz)
    puan: 4
  - olcut: (a) Faaliyet kârları 638.000 TL ve 586.000 TL
    puan: 4
  - olcut: (b) Katkı payı ve sabit giderlerin dönem gideri yazılması
    puan: 3
  - olcut: (b) Faaliyet kârları 558.000 TL ve 666.000 TL
    puan: 3
  - olcut: (c) Her yıl için 80.000 TL farkın stok değişimi × 20 TL ile açıklanması
    puan: 3
  - olcut: (c) İki yıl toplamının (1.224.000 TL) eşitliği ve nedeni
    puan: 2
  - olcut: (d) Kârın üretim hacmine bağlı yükselmesi ve stok üretme sakıncası
    puan: 4
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "oran = 480000 / 24000\ntam1 = 22000 * 100 - (22000 * (40 + oran) - (26000 - 24000) * oran) - 22000 * 6 - 150000\n\
      tam2 = 24000 * 100 - (24000 * (40 + oran) + (24000 - 20000) * oran) - 24000 * 6 - 150000\ndeg1 = 22000 * (100 - 46)\
      \ - 480000 - 150000\ndeg2 = 24000 * (100 - 46) - 480000 - 150000\nsonuc = {\"oran\": oran, \"tam_1\": tam1, \"tam_2\"\
      : tam2, \"degisken_1\": deg1, \"degisken_2\": deg2,\n         \"fark_1\": tam1 - deg1, \"fark_2\": tam2 - deg2, \"stok_1\"\
      : (26000 - 22000) * oran,\n         \"toplam_tam\": tam1 + tam2, \"toplam_degisken\": deg1 + deg2}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-2.yaml, klasik 3
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
