  soru: 'Düzce Mobilya A.Ş. 7/A seçeneğini ve tam maliyetleme yöntemini uygulamaktadır. Satış her koşulda 8.000 adet ve birim
    fiyat 250 TL''dir. Birim değişken üretim maliyeti 120 TL, yıllık sabit GÜG 300.000 TL, normal kapasite 10.000 adettir
    (sabit GÜG yükleme oranı 30 TL/adet); sabit satış ve yönetim gideri 100.000 TL''dir. Üretim müdürü üretimi 8.000, 10.000
    veya 12.000 adet olarak planlayabilmekte ve prim ölçütü olarak tam maliyet esaslı dönem kârı kullanılmaktadır. Dönem başı
    stok yoktur. Yükleme farkı (eksik veya fazla yükleme), dönem sonu stok ve satış maliyeti arasında üretim miktarı oranında
    paylaştırılacaktır.


    **İstenenler:**


    (a) Her üretim düzeyi için tam maliyet esaslı dönem kârını ve 152 stok değerini hesaplayınız. (9 puan)


    (b) Değişken maliyetleme esaslı dönem kârını hesaplayınız. (4 puan)


    (c) Her üretim düzeyinde iki yöntem arasındaki kâr farkını, dönem sonu stoktaki sabit GÜG ile mutabakat yaparak açıklayınız.
    (4 puan)


    (d) 12.000 adet üretim senaryosunda 730, 731, 151 ve fazla yüklemenin (734) aktarılmasına ilişkin kayıtları yapınız. (4
    puan)


    (e) Prim ölçütünün tam maliyet kârı olmasının doğuracağı davranışsal riski açıklayınız. (4 puan)

    '
  cozum: '**(a)** Standart birim maliyet = 120 + 30 = 150 TL.


    |  | 8.000 adet | 10.000 adet | 12.000 adet |

    |---|---:|---:|---:|

    | Yüklenen sabit GÜG (üretim × 30) | 240.000 | 300.000 | 360.000 |

    | Yükleme farkı (fiili 300.000 − yüklenen) | 60.000 eksik | 0 | 60.000 fazla |

    | Stok adedi | 0 | 2.000 | 4.000 |

    | Satış maliyeti (8.000 × 150) | 1.200.000 | 1.200.000 | 1.200.000 |

    | Farktan satışa düşen | +60.000 | 0 | −40.000 |

    | Farktan stoka düşen | 0 | 0 | −20.000 |

    | **Dönem kârı** | **640.000** | **700.000** | **740.000** |

    | **152 stok değeri** | **0** | **300.000** | **580.000** |


    Kâr = 2.000.000 − satış maliyeti − 100.000. Örneğin 12.000 adette: 2.000.000 − (1.200.000 − 40.000) − 100.000 = 740.000
    TL; stok = 4.000 × 150 − 20.000 = 580.000 TL.


    **(b)** Değişken maliyet kârı = 8.000 × (250 − 120) − 300.000 − 100.000 = **640.000 TL** (üretim düzeyinden bağımsız).


    **(c)** Fark = tam − değişken: 8.000 adet: 0; 10.000 adet: 60.000 (2.000 × 30); 12.000 adet: 100.000 (4.000 stok × fiili
    sabit GÜG birimi 25 TL = 300.000/12.000). Yükleme farkı paylaştırıldığında stoktaki sabit GÜG fiili maliyete (25 TL) iner.


    **(d)**


    *1) Sabit GÜG (özet)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 300.000 |  |

    | İlgili aktif ve pasif hesaplar |  | 300.000 |

    | **Toplam** | **300.000** | **300.000** |


    *2) 12.000 × 30 yüklenmesi*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 360.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 360.000 |

    | **Toplam** | **360.000** | **360.000** |


    *3) Kapanış (fazla yükleme olumlu fark)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 360.000 |  |

    | 730 Genel Üretim Giderleri |  | 300.000 |

    | 734 Genel Üretim Giderleri Kapasite Farkları |  | 60.000 |

    | **Toplam** | **360.000** | **360.000** |


    *4) Olumlu farkın stok ve satış maliyetine aktarılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 734 Genel Üretim Giderleri Kapasite Farkları | 60.000 |  |

    | 152 Mamuller |  | 20.000 |

    | 620 Satılan Mamuller Maliyeti |  | 40.000 |

    | **Toplam** | **60.000** | **60.000** |


    **(e)** Tam maliyet kârı satış sabitken üretim arttıkça yükselir (640.000 → 700.000 → 740.000); yönetici stok biriktirerek
    sabit GÜG''nin bir bölümünü 152''de erteleyerek kârı yapay biçimde artırabilir. Oysa nakit ve gerçek performans bundan
    etkilenmez. Bu nedenle prim ölçütünün yalnız tam maliyet kârı olması aşırı üretim ve stok birikimini teşvik eder.


    Püf noktaları: Fazla yüklemede fark alacak kalıntısıdır ve stok ile satış maliyetini azaltır; eksik yüklemede tersi olur.
    Paylaştırma sonrası stoktaki sabit GÜG fiili birim (300.000 / üretim) üzerinden hesaplanır.

    '
