    birim tam maliyeti = 60 + 10 = **70 TL**; B''nin = 50 + 20 = **70 TL**. Kârlar: A = (100 − 70) × 12.000 = **360.000 TL**;
    B = (68 − 70) × 6.000 = **-12.000 TL (zarar)**; toplam = **348.000 TL**.


    **(b)** A: (100 − 60) × 12.000 = **480.000 TL**; B: (68 − 50) × 6.000 = **108.000 TL**.


    **(c)** B bırakılırsa 240.000 TL sabit GÜG yalnız A''ya yüklenir; kâr = 480.000 − 240.000 = **240.000 TL**. Değişim =
