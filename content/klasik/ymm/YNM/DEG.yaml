    model: 'harici: chatgpt'
    istem_surumu: uretici paketi YMM-YNM-G07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-13'
      G5:
        sonuc: kaldi
        tarih: '2026-10-13'
        not: 'Dört soru (K002–K005) birebir aynı metin/çözüm (mükerrer). Düzey SMMM giriş (tek çarpım 2000×30=60000; hesap
          doğru); 25 puan/30 dk yükle orantısız. Puanlama ölçütleri genel şablon ve soru içindeki puanlarla (a8/b8/c9) örtüşmüyor
          (8/9/8). (a) çözümü yüzeysel: tam maliyette ürün maliyetine/stoka, değişkende dönem gideri olarak 2000 birim stokta
          60000 TL ertelenmesi ve kayıt/hesap yok; (c) normal kapasite altı üretimde dağıtılmayan sabit GÜG''ün dönem gideri
          (TMS 2.13) olduğu belirtilmemiş.'
