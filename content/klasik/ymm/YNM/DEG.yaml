  - olcut: Hesaplama ve ara işlemlerin doğru yapılması
    puan: 9
  - olcut: Sonucun yorumlanması ve koşulların doğru açıklanması
    puan: 8
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: 'sonuc = {''birim_sabit_genel_gider'': 30, ''kar_farki'': 60000}'
  durum: geri_cekildi
  surum: 1
