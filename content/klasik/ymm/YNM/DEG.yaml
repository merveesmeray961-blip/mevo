    ve 152 hesaplarına hangi tutarlar yüklenir, satış ve yönetim giderleri neden ürün maliyetine girmez? (6 puan)

    '
  cozum: '**(a) Tam maliyetleme:** sabit GÜG birimi = 300.000 / 10.000 = 30 TL; birim maliyet = 60 + 40 + 20 + 30 = **150
    TL**.


    | Gelir tablosu (tam maliyet) | TL |

    |---|---:|

    | Satışlar (8.000 × 250) | 2.000.000 |

    | Satılan mamul maliyeti (8.000 × 150) | (1.200.000) |

    | **Brüt satış kârı** | **800.000** |

    | Satış ve dağıtım gideri (8.000 × 10) ve sabit satış-yönetim gideri | (230.000) |

    | **Dönem kârı** | **570.000** |


    152 bakiyesi = 2.000 × 150 = **300.000 TL**.


    **(b) Değişken maliyetleme:** birim değişken üretim maliyeti = 120 TL.


    | Katkı payı tablosu (değişken maliyet) | TL |

    |---|---:|

    | Satışlar | 2.000.000 |

    | Değişken üretim maliyeti (8.000 × 120) | (960.000) |

    | Değişken satış gideri (8.000 × 10) | (80.000) |

    | **Katkı payı** | **960.000** |

    | Sabit GÜG (dönem gideri) | (300.000) |

    | Sabit satış ve yönetim giderleri | (150.000) |

    | **Dönem kârı** | **510.000** |


    Stok değeri = 2.000 × 120 = **240.000 TL**.


    **(c)** Fark = 570.000 − 510.000 = **60.000 TL**. Üretim satıştan 2.000 adet fazladır; tam maliyette stoktaki 2.000 adede
    düşen sabit GÜG (2.000 × 30 = 60.000 TL) 152 hesapta aktifleşir, değişken maliyette ise dönem gideri olur. Stok değeri
    farkı da aynıdır: 300.000 − 240.000 = 60.000.


    **(d)** Tekdüzen Hesap Planı''nda 730 Genel Üretim Giderleri, direkt işçilik ve direkt ilkmadde dışında kalan ve ancak
    dağıtım yoluyla ürüne yansıtılabilen tüm üretim giderlerini (sabit ve değişken ayrımı yapmadan) kapsar. Bu giderler 731
    aracılığıyla, direkt ilkmadde (711) ve direkt işçilikle (721) birlikte 151''e, oradan 152''ye yüklenir; yani resmî muhasebe
    **tam maliyet** esaslıdır ve stoklar sabit GÜG''yi de içerir. Satış, pazarlama, yönetim giderleri "üretim maliyetlerine
    yüklenmeyen" faaliyet giderleri olarak 63 grubunda dönem gideri sayılır. Gider çeşitlerinin sabit/değişken/yarı değişken
    ayrımı ise işletmelerin kendi ihtiyaçlarına bırakılmıştır; değişken maliyetleme yönetim raporlaması için kullanılabilir
    ama stok değerlemesinde 7/A''ya uygun tam maliyet esas alınır.


    Püf noktaları: Kâr farkı = (stok değişimi, adet) × birim sabit GÜG''dir; stok artıyorsa tam maliyet kârı yüksektir. Değişken
    satış giderini iki yöntemde de katkı payı hesabına/dönem giderine alın, ürün maliyetine eklemeyin.

    '
