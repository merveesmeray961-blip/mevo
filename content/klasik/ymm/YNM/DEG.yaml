    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 240.000 |  |

    | 730 Genel Üretim Giderleri |  | 240.000 |

    | **Toplam** | **240.000** | **240.000** |


    B bırakılırsa aynı 240.000 TL''lik 730 gideri tamamen A''nın 151/152 kayıtlarına yüklenir (A''nın birim sabit GÜG''si
    20 TL, birim tam maliyeti 80 TL olur).


    **(e)** Tam maliyet kârı B''yi zararlı gösterir; oysa B''nin 108.000 TL katkı payı sabit GÜG''nin 108.000 TL''sini karşılar.
    Sabit GÜG, tesis kalmaya devam ettiği için kaçınılamaz bir giderdir; kararda yalnız değişen (ilgili) gelir ve giderler
    dikkate alınmalıdır. Tebliğ''deki tam maliyet esaslı hesap yapısı (730 → 731 → 151/152) stokların değerlemesi içindir;
    ürün kapatma kararı için katkı payı verisi kullanılır.


    Püf noktaları: Dağıtılmış sabit gider, ürün bırakıldığında ortadan kalkmıyorsa kararın ölçütü katkı payıdır. Kâr değişimi
    = bırakılan ürünün katkı payı (−108.000).

    '
