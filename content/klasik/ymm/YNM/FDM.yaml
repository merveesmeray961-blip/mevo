      \ \"gelir\": gelir,\n         \"uretim\": 50000 * yeni, \"kar\": gelir - maliyet, \"toplam\": maliyet, \"birim\": maliyet\
      \ / 50000,\n         \"oran\": round((gelir - maliyet) / gelir * 100, 2)}\n"
