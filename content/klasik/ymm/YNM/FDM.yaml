    göre satılan pompaların %70''i hatasız, %25''i küçük hatalı (onarım maliyeti 400 TL), %5''i büyük hatalı (onarım maliyeti
    2.400 TL) çıkmaktadır.


    Kalite bölümü, 500.000 TL''lik bir önleme programıyla (tedarikçi geliştirme ve proses iyileştirme) hatasız oranının %78''e
    (küçük hata %20, büyük hata %2) çıkabileceğini öngörmektedir.


    **İstenenler:**

    (a) Pompa başına beklenen garanti onarım maliyetini bulunuz. (5 puan)

    (b) Satılan pompalar için garanti yükümlülüğünün bir bütün olarak değerlendirilmesi ilkesine göre dönem sonunda ayrılacak
    karşılığı hesaplayınız. (7 puan)

    (c) Önleme programı uygulanırsa beklenen garanti maliyetini ve programın net faydasını bulunuz. (8 puan)

    '
