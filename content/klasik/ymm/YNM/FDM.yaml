  soru: 'Çorum Döküm San. A.Ş. 7/A seçeneğini uygulamakta ve GÜG''sini gider yerlerinde toplayarak ürünlere yüklemektedir.
    Gider yerleri: iki esas üretim gider yeri (Dökümhane ve İşleme) ve iki yardımcı hizmet gider yeri (Enerji ve Bakım-onarım).
    Dağıtım öncesi aylık giderler (730 hesapta, gider yeri koduyla): Dökümhane 500.000 TL, İşleme 400.000 TL, Bakım-onarım
    150.000 TL, Enerji 100.000 TL.


    Yardımcı hizmet giderleri **kademeli (basamaklı) dağıtım** yöntemiyle dağıtılacaktır: önce Enerji, sonra Bakım-onarım
    dağıtılır; Bakım-onarım, Enerji''den pay almaz. Dağıtım anahtarları:


    | Hizmet veren | Bakım-onarım | Dökümhane | İşleme |

    |---|---:|---:|---:|

    | Enerji (kWh payı) | %20 | %40 | %40 |

    | Bakım-onarım (saat payı) | — | %60 | %40 |


    Yükleme oranları: Dökümhane için normal kapasite 10.700 makine saati (MS); İşleme için 12.700 direkt işçilik saati (DİS).
    Ürün başına standart süreler: X ürünü 4 MS ve 3 DİS, Y ürünü 2 MS ve 5 DİS. Aylık üretim: X 1.500 adet, Y 2.000 adet.
    Yükleme farkı "734 Genel Üretim Giderleri Kapasite Farkları" hesabında izlenecektir.


    **İstenenler:**


    (a) Kademeli dağıtım tablosunu hazırlayarak Dökümhane ve İşleme''nin dağıtım sonrası toplam GÜG''sini bulunuz. (8 puan)


    (b) Aynı veriler için doğrudan dağıtım (Enerji payları Dökümhane ve İşleme arasında %50-%50, Bakım-onarım payları %60-%40)
    uygulansaydı gider yerlerinin toplamlarının ne olacağını bulunuz ve iki yöntem arasındaki farkı yorumlayınız. (4 puan)


    (c) Kademeli dağıtım sonuçlarına göre GÜG yükleme oranlarını, X ve Y ürünlerinin birim GÜG''sini bulunuz. (5 puan)


    (d) Fiili üretime yüklenen GÜG''yi, yükleme farkını ve 730, 731, 151, 734 hesaplarına ilişkin kayıtları gösteriniz. (5
    puan)


    (e) Bakım-onarım gider yerinde 40.000 TL''lik yedek parça (150 hesaptan) kullanılmıştır. Bu giderin kaydında muhasebe
