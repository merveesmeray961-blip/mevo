  cozum: '**(a) Kademeli dağıtım**


    | Gider yeri | Dağıtım öncesi | Enerji dağıtımı | Bakım-onarım dağıtımı | Dağıtım sonrası |

    |---|---:|---:|---:|---:|

    | Enerji | 100.000 | (100.000) |  | 0 |

    | Bakım-onarım | 150.000 | 20.000 | (170.000) | 0 |

    | Dökümhane | 500.000 | 40.000 | 102.000 | **642.000** |

    | İşleme | 400.000 | 40.000 | 68.000 | **508.000** |

    | **Toplam** | 1.150.000 |  |  | **1.150.000** |


    **(b)** Doğrudan dağıtımda Dökümhane = 500.000 + 50.000 + 90.000 = **640.000 TL**, İşleme = 400.000 + 50.000 + 60.000
    = **510.000 TL**. Kademeli yöntemde Bakım-onarım''ın Enerji''den aldığı 20.000 TL pay üretim yerlerine de yansıdığından
    Dökümhane 2.000 TL fazla, İşleme 2.000 TL eksik çıkar; toplam değişmez (1.150.000).


    **(c)** Dökümhane oranı = 642.000 / 10.700 = **60 TL/MS**; İşleme oranı = 508.000 / 12.700 = **40 TL/DİS**. X = 4 × 60
    + 3 × 40 = **360 TL**; Y = 2 × 60 + 5 × 40 = **320 TL**.


    **(d)** Kullanılan standart saatler: MS = 1.500 × 4 + 2.000 × 2 = 10.000; DİS = 1.500 × 3 + 2.000 × 5 = 14.500. Yüklenen:
    Dökümhane 10.000 × 60 = 600.000; İşleme 14.500 × 40 = 580.000; toplam **1.180.000 TL**. Fiili GÜG 1.150.000 TL olduğundan
    **30.000 TL fazla yükleme (olumlu fark)** vardır (Dökümhane 42.000 eksik, İşleme 72.000 fazla).


