    iki yöntemde aynı, başka stok farkı yoktur. Normal kapasite 12.000 birimdir.


    (a) Tam ve değişken maliyetleme yöntemlerinde sabit üretim genel giderinin muhasebeleştirilmesini karşılaştırınız. (8
