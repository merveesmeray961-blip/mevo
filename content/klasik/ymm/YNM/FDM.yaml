    Değer mühendisliği çalışmasıyla şu iyileştirmeler önerilmiştir: malzemede 35 TL (yeni kalıp yatırımı ile; kalıp yatırımı
    250.000 TL''dir), genel üretim giderinde 25 TL, dağıtımda 20 TL tasarruf.


    **İstenenler:**

    (a) Hedef maliyeti ve mevcut tasarımın maliyet açığını bulunuz. (6 puan)

    (b) Önerilen iyileştirmelerden sonra birim maliyeti bulunuz ve hedefe ulaşılıp ulaşılmadığını belirtiniz. (7 puan)

    (c) İyileştirmelerin yıllık kâra etkisini hesaplayınız; kalıp yatırımının kaç yılda geri döneceğini bulunuz. (7 puan)

    '
  cozum: '**(a)** Hedef maliyet = 800 × (1 − 0,25) = **600 TL**. Mevcut maliyet = 300 + 120 + 160 + 100 = 680 TL; maliyet
    açığı = **80 TL** (mevcut maliyetin %11,76''i).


    **(b)** Yeni maliyet = 265 + 120 + 135 + 80 = **600 TL**; hedef maliyete ulaşılmıştır.


    **(c)** Yıllık kâr: önce (800 − 680) × 10.000 = 1.200.000 TL; sonra (800 − 600) × 10.000 = **2.000.000 TL** (artış 800.000
    TL). Kalıptan sağlanan tasarruf yılda 35 × 10.000 = 350.000 TL olduğundan 250.000 / 350.000 ≈ 0,71 yıl (yaklaşık 8,6 ay)
    içinde geri döner.

    '
