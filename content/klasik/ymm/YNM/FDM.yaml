      \ 400 * 300\nb_fdm = 1000 * 300 + 1100 * 600 + 60 * 2000 + 1200 * 300\nb_yeni = 1200000 + 60 * 2500 - (500 * 300 + 600\
      \ * 600 + 60 * 2000 + 1200 * 300)\nsonuc = {\"m_gel\": m_gel, \"b_gel\": b_gel, \"m_kar_gel\": round(2500000 - m_gel,\
      \ 2), \"b_kar_gel\": round(1200000 - b_gel, 2),\n         \"m_fdm\": m_fdm, \"b_fdm\": b_fdm, \"m_kar\": 2500000 - m_fdm,\
      \ \"b_kar\": 1200000 - b_fdm,\n         \"m_fark\": round(2500000 - m_fdm - (2500000 - m_gel), 2), \"b_yeni\": b_yeni,\
