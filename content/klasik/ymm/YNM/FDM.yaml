    python: 'onleme = 120000 + 80000 + 100000

      degerleme = 150000 + 250000 + 60000

      ic = 340000 + 260000

      dis = 420000 + 90000 + 130000

      gorunmeyen = 300000

      top = onleme + degerleme + ic + dis

