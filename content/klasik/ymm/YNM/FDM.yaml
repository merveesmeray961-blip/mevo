    python: 'g1 = 400000

      g2 = 1800000

      g3 = 2200000

      g4 = 600000

      o1 = 500000

      o2 = 1300000

      o3 = 1500000

      o4 = 500000

      arge = 1000000

      son = 100000

      y0 = -arge

      y1 = g1 - o1

      y2 = g2 - o2

      y3 = g3 - o3

      y4 = g4 - o4 - son

      toplam = y0 + y1 + y2 + y3 + y4

      gelir = g1 + g2 + g3 + g4

