  soru: 'Delta Robotik A.Ş. beş yıl satılacak bir temizlik robotunun yaşam boyu maliyetini planlamaktadır. Beş yılda toplam
    100.000 adet satış beklenmektedir. Planlanan maliyetler:


    | Yaşam döngüsü aşaması | Maliyet |

    |---|---|

    | Araştırma (ilk yıl öncesi) | 1.200.000 TL |

    | Ürün geliştirme ve tasarım (aktifleştirme koşulları sağlanmaktadır) | 600.000 TL |

    | Üretim | Birim değişken 140 TL; sabit 400.000 TL/yıl |

    | Pazarlama ve dağıtım | 20 TL/adet; ayrıca 300.000 TL/yıl |

    | Satış sonrası hizmet ve garanti | 10 TL/adet |

    | Ürünün piyasadan çekilme maliyeti (son yıl) | 100.000 TL |


    Birim satış fiyatı 260 TL olarak düşünülmektedir.


    **İstenenler:**

    (a) Yaşam boyu toplam maliyeti ve birim yaşam boyu maliyeti bulunuz. (8 puan)

    (b) 260 TL fiyatla yaşam boyu toplam kârı ve %20 satış kâr marjı için gereken fiyatı hesaplayınız. (6 puan)

    (c) Finansal muhasebe açısından araştırma ve geliştirme harcamalarının nasıl işleneceğini belirterek geliştirme harcamasının
    yıllık itfa payını bulunuz (5 yıl, eşit). (6 puan)

    '
  cozum: '**(a)** Üretim = 140 × 100.000 + 5 × 400.000 = 16.000.000 TL; pazarlama = 5 × 300.000 + 20 × 100.000 = 3.500.000
    TL; hizmet = 1.000.000 TL.


    | Aşama | TL |

    |---|---|

    | Araştırma | 1.200.000 |

    | Geliştirme ve tasarım | 600.000 |

    | Üretim | 16.000.000 |

    | Pazarlama ve dağıtım | 3.500.000 |

    | Satış sonrası hizmet | 1.000.000 |

    | Çekilme | 100.000 |

    | **Toplam** | **22.400.000** |


    Birim yaşam boyu maliyeti = 22.400.000 / 100.000 = **224 TL**.


    **(b)** Yaşam boyu kâr = (260 − 224) × 100.000 = **3.600.000 TL**. %20 marj için fiyat = 224 / 0,80 = **280 TL**.


    **(c)** Araştırma harcamaları (1.200.000 TL) gerçekleştiğinde gider yazılır; geliştirme harcamaları ise koşulların tamamı
    sağlandığı için maddi olmayan duran varlık olarak aktifleştirilir ve 600.000 / 5 = **120.000 TL/yıl** itfa edilir. Yönetim
    muhasebesinde ise her iki harcama da yaşam boyu maliyete dâhildir; yıllık raporlama bu yatırımı ilk yıllarda gizler.

    '
