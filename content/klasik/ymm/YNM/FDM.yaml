  soru: 'Zeytin Beyaz Eşya A.Ş.''nin 2026 yılı satışları 20.000.000 TL''dir. Yıl içinde gerçekleşen kaliteyle ilgili giderler
    (TL):


    | Kalem | Tutar |

    |---|---|

    | Tasarım gözden geçirme | 120.000 |

    | Tedarikçi değerlendirme | 80.000 |

    | Çalışan kalite eğitimi | 100.000 |

    | Hammadde muayenesi | 150.000 |

    | Üretim hattı proses testleri | 250.000 |

    | Ölçü aletleri kalibrasyonu | 60.000 |

    | Hurda kayıpları | 340.000 |

    | Yeniden işleme | 260.000 |

    | Garanti kapsamında onarım | 420.000 |

    | Müşteri şikâyetlerinin işlenmesi | 90.000 |

    | İade edilen ürünler | 130.000 |

    | Kalite sorunu nedeniyle kaybedilen satışların tahmini katkı kaybı (muhasebe kaydı yok) | 300.000 |


    **İstenenler:**

    (a) Kalemleri önleme, değerleme, iç başarısızlık ve dış başarısızlık maliyetleri olarak sınıflandırarak muhasebe kayıtlarında
    yer alan kalite maliyetini ve satışlara oranını bulunuz. (8 puan)

    (b) Uyum (önleme + değerleme) ve uyumsuzluk (başarısızlık) maliyetlerini ayrı ayrı bulunuz; görünmeyen maliyetin raporlamadaki
    yerini açıklayınız. (6 puan)

    (c) Önleme programına 200.000 TL yatırım yapılması hâlinde iç ve dış başarısızlık maliyetlerinin %30 azalacağı tahmin
    edilmektedir. Programın net faydasını bulunuz. (6 puan)

    '
  cozum: '**(a)**


    | Sınıf | Tutar (TL) |

    |---|---|

    | Önleme (120.000 + 80.000 + 100.000) | 300.000 |

    | Değerleme (150.000 + 250.000 + 60.000) | 460.000 |

    | İç başarısızlık (340.000 + 260.000) | 600.000 |

    | Dış başarısızlık (420.000 + 90.000 + 130.000) | 640.000 |

    | **Toplam** | **2.000.000** |


    Kalite maliyeti / satışlar = 2.000.000 / 20.000.000 = **%10**.


    **(b)** Uyum maliyeti = 300.000 + 460.000 = **760.000 TL**; uyumsuzluk maliyeti = 600.000 + 640.000 = **1.240.000 TL**.
    Kaybedilen satış katkısı (300.000 TL) muhasebe kaydı olmayan görünmeyen dış başarısızlık maliyetidir; ayrıca tahmin edilip
    yönetim raporlarında gösterilmelidir, ancak finansal tablolara yansımaz.


    **(c)** Azalma = 1.240.000 × %30 = 372.000 TL; net fayda = 372.000 − 200.000 = **172.000 TL**. Program kabul edilmelidir.

    '
