    **(c)** Hedef maliyet = 380 − 30 = **350 TL**; maliyet açığı = 392 − 350 = **42 TL**. Fiyat düştükçe hedef maliyet aynı
    tutarda düşer; açık kapanmadan ürün hedef getiriyi sağlayamaz.

