    karşılık = 8.000 × 220 = **1.760.000 TL**.


    **(c)** Program sonrası beklenen birim maliyet = 0,20 × 400 + 0,02 × 2.400 = 80 + 48 = **128 TL**. Tasarruf = (220 − 128)
    × 8.000 = 736.000 TL; net fayda = 736.000 − 500.000 = **236.000 TL**. Program kârlıdır.

