  soru: 'Aydın Ofis Mobilyaları A.Ş. yeni bir çalışma masası modeli geliştirmektedir. Hedef satış fiyatı 900 TL, hedef kâr
    marjı satış fiyatının %20''sidir. Tahmini birim maliyetler:

    - Direkt ilk madde 380 TL; direkt işçilik 5 saat × 20 TL.

    - Genel üretim giderleri faaliyete dayalı olarak izlenmektedir: makine ayarı partide 2.400 TL (parti büyüklüğü 200 adet);
    kalite kontrol ürün başına 0,5 saat × 160 TL; makine kullanımı ürün başına 3 saat × 40 TL; malzeme taşıma ürün başına
    8 TL.


    **İstenenler:**

    (a) Hedef maliyeti ve faaliyete dayalı yöntemle hesaplanan tahmini birim maliyeti bulunuz; hedefe ulaşılıp ulaşılmadığını
    belirtiniz. (7 puan)

    (b) Tedarik sorunu nedeniyle parti büyüklüğü 100 adede düşer ve ürün başına muayene süresi 0,6 saate çıkarsa birim maliyet
    ve hedefe göre aşım ne olur? (7 puan)

    (c) Aşımı kapatmak için makine kullanım süresinin ne kadar kısaltılması gerektiğini bulunuz. (6 puan)

    '
  cozum: '**(a)** Hedef maliyet = 900 × 0,80 = **720 TL**. Genel üretim gideri = ayar (2.400 / 200 = 12) + kalite kontrol
    (80) + makine (120) + taşıma (8) = 220 TL. Birim maliyet = 380 + 100 + 220 = **700 TL**. Hedef maliyetin altında olduğundan
    hedefe ulaşılmıştır (kâr marjı %22,22).


    **(b)** Ayar = 2.400 / 100 = 24 TL; kalite kontrol = 0,6 × 160 = 96 TL. Birim maliyet = 380 + 100 + 24 + 96 + 120 + 8
    = **728 TL**; hedef maliyeti **8 TL** aşar.


    **(c)** Aşımı kapatmak için makine saati azalışı = 8 / 40 = **0,20 saat** (3 saatten 2,8 saate).

    '
