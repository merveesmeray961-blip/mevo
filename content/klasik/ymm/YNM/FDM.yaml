    (a) Ayar faaliyeti için pratik kapasiteye göre ve fiilî kullanıma göre maliyet sürücüsü oranlarını bulunuz. (5 puan)

    (b) Pratik kapasite oranıyla A ve B ürünlerine yüklenecek ayar giderini ve kullanılmayan kapasite maliyetini hesaplayınız;
    kullanılmayan kapasite maliyetinin muhasebe işlemini açıklayınız. (8 puan)

    (c) A ürününün dönem sonu stokunda yer alacak ayar gideri tutarını iki oran için bulunuz; fiilî kullanım oranının stokları
    nasıl etkilediğini belirtiniz. (7 puan)

    '
  cozum: '**(a)** Pratik kapasite oranı = 360.000 / 1.200 = **300 TL/ayar**; fiilî kullanıma göre = 360.000 / 900 = **400
    TL/ayar**.


    **(b)** A: 500 × 300 = **150.000 TL**; B: 400 × 300 = **120.000 TL**. Kullanılmayan kapasite maliyeti = (1.200 − 900)
    × 300 = **90.000 TL**. Üretim birimine dağıtılan sabit gider düşük üretim düzeyi veya atıl kapasite nedeniyle artırılmaz;
    dağıtılmayan genel giderler gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.


    **(c)** Stokta kalan 1.000 adet için: pratik kapasite oranıyla 150.000 / 5.000 × 1.000 = **30.000 TL**; fiilî kullanım
    oranıyla 500 × 400 / 5.000 × 1.000 = **40.000 TL**. Fiilî kullanım oranı, atıl kapasite maliyetini ürünlere yükleyerek
    stokları 10.000 TL fazla gösterir.

    '
