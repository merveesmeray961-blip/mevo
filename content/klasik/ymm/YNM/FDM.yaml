    1.000.000 TL''dir ve araştırma niteliğindedir. Yıllara göre satış gelirleri ve üretim-pazarlama maliyetleri (TL):


    | Yıl | Gelir | Üretim ve pazarlama maliyeti |

    |---|---|---|

    | 1 | 400.000 | 500.000 |

    | 2 | 1.800.000 | 1.300.000 |

    | 3 | 2.200.000 | 1.500.000 |

    | 4 | 600.000 | 500.000 |


    Ürünü piyasadan çekme maliyeti (yıl 4) 100.000 TL''dir.


    **İstenenler:**

    (a) Ürünün yaşam boyu toplam kârını bulunuz. (5 puan)

    (b) Araştırma harcamasının gerçekleştiği dönemde gider yazıldığını dikkate alarak yıllık sonuçları gösteriniz; ürünün
    ilk iki yıldaki durumunu yorumlayınız. (8 puan)

    (c) Yaşam boyu satış kâr marjının en az %20 olması için toplam gelirin ne kadar olması gerektiğini ve gelirdeki artış
    oranını hesaplayınız. (7 puan)

    '
  cozum: '**(a)** Toplam gelir = 5.000.000 TL; toplam maliyet = 1.000.000 + 3.800.000 + 100.000 = 4.900.000 TL. Yaşam boyu
    kâr = **100.000 TL** (satışların %2''si).


    **(b)**


    | Yıl | Sonuç (TL) |

    |---|---|

    | 0 | -1.000.000 |

    | 1 | -100.000 |

    | 2 | 500.000 |

    | 3 | 700.000 |

    | 4 (çekilme dâhil) | 0 |

    | **Toplam** | **100.000** |


    Araştırma harcaması 0. yılda gider yazıldığından ilk yıl ve 1. yıl zarar görünür; ürünün yaşam boyu kârlılığı ancak 2.
    ve 3. yıllarda ortaya çıkar. Yıllık raporlama bu nedenle ürünü olduğundan kötü gösterebilir.


    **(c)** Toplam maliyet 4.900.000 TL; %20 marj için gelir = 4.900.000 / 0,80 = **6.125.000 TL**. Gelir artışı = (6.125.000
    − 5.000.000) / 5.000.000 = **%22,50**.

    '
