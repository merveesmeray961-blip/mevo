    hazırlık gideri 400.000 TL (sürücü: parti sayısı) ve makine gideri 500.000 TL (sürücü: makine saati).


    | | P1 | P2 | P3 |

    |---|---|---|---|

    | Üretim (adet) | 20.000 | 5.000 | 4.000 |

    | Parti sayısı | 10 | 30 | 60 |

    | Makine saati | 2.000 | 1.000 | 2.000 |

    | Direkt işçilik saati | 2.000 | 1.000 | 2.000 |

    | Birim satış fiyatı (TL) | 60 | 120 | 200 |

    | Birim direkt maliyet (TL) | 40 | 70 | 90 |


    **İstenenler:**

    (a) Faaliyete dayalı maliyetleme ile ürünlerin birim genel üretim giderini bulunuz. (8 puan)

    (b) Genel üretim giderinin direkt işçilik saatine göre dağıtılması hâlinde birim giderleri bulunuz. (5 puan)

    (c) İki yönteme göre birim kârları hesaplayınız ve ürünlerin kârlılık sıralamasının nasıl değiştiğini açıklayınız. (7
    puan)

    '
  cozum: '**(a)** Parti oranı = 400.000 / 100 = 4.000 TL/parti; makine saati oranı = 500.000 / 5.000 = 100 TL/saat. P1 = (10
    × 4.000 + 2.000 × 100) / 20.000 = **12 TL**; P2 = (30 × 4.000 + 1.000 × 100) / 5.000 = **44 TL**; P3 = (60 × 4.000 + 2.000
    × 100) / 4.000 = **110 TL**.


    **(b)** İşçilik saati oranı = 900.000 / 5.000 = 180 TL. P1 = 2.000 × 180 / 20.000 = **18 TL**; P2 = **36 TL**; P3 = **90
    TL**.


    **(c)**


    | Birim kâr (TL) | P1 | P2 | P3 |

    |---|---|---|---|

    | Faaliyete dayalı | 8 | 6 | 0 |

    | İşçilik saati esaslı | 2 | 14 | 20 |


    Geleneksel yöntemde en kârlı görünen P3, çok sayıda küçük parti nedeniyle hazırlık faaliyetlerini yoğun kullandığı için
    gerçekte başabaştadır; P1 ise geleneksel yöntemde en az kârlı görünmesine karşın en kârlı üründür.

    '
