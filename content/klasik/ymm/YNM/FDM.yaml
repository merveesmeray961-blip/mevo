    alinti: Araştırmadan (veya işletme içi bir projenin araştırma safhasından) kaynaklanan herhangi bir maddi olmayan duran
      varlık muhasebeleştirilmez. Araştırma (veya işletme içi bir projenin araştırma safhası) harcamaları gerçekleştiğinde
      gider olarak muhasebeleştirilir.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 57
    alinti: 'Sadece ve sadece, aşağıdaki koşulların tamamının varlığı halinde, geliştirmeden (veya işletme bünyesinde yürütülen
      bir projenin geliştirme safhasından) kaynaklanan maddi olmayan duran varlıklar muhasebeleştirilir:'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'arge = 1200000

      tasarim = 600000

      adet = 100000

      uretim = 140 * adet + 5 * 400000

      paz = 5 * 300000 + 20 * adet

      hizmet = 10 * adet

      tasfiye = 100000

      top = arge + tasarim + uretim + paz + hizmet + tasfiye

      birim = top / adet

      kar = (260 - birim) * adet

