    puan: 2
  - olcut: (c) Yaşam boyu birim maliyet 1.115 TL ve kâr oranı %9,72
    puan: 3
  - olcut: (d) Karşılaştırma ve iki yöntemin birlikte uygulanmasının gerekçesi
    puan: 6
  kaynaklar:
  - mevzuat: Genel bilgi — Yönetim muhasebesi, hedef maliyetleme ve yaşam boyu maliyetleme
