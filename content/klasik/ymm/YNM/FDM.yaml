- id: YMM-YNM-FDM-K001
  sinav: ymm
  ders: YNM
  konu: FDM
  kazanimlar:
  - faaliyete dayalı maliyetleme
  - hedef maliyetleme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kalıp A.Ş. iki mamul üretmektedir: seri üretilen Standart (S) ve müşteri isteğine göre küçük partilerle üretilen
    Özel (Ö). İşletme bugüne kadar genel üretim giderlerini (GÜG) direkt işçilik saatine (DİS) dayalı tek bir oranla yüklemiştir.
    Dönem verileri aşağıdadır:


    | | S | Ö |

    |---|---|---|

    | Üretim ve satış miktarı | 8.000 birim | 2.000 birim |

    | Birim direkt ilk madde ve malzeme + direkt işçilik | 50 TL | 70 TL |

    | Birim başına DİS | 1 saat | 1,5 saat |


    Toplam GÜG 660.000 TL''dir. Yapılan faaliyet analizinin sonuçları:


    | Faaliyet | Maliyet | Maliyet etkeni | S | Ö |

    |---|---|---|---|---|

    | Makine çalıştırma | 220.000 TL | Makine saati | 4.000 | 1.500 |

    | Kurulum | 180.000 TL | Kurulum sayısı | 20 | 40 |

    | Malzeme taşıma | 120.000 TL | Taşıma sayısı | 80 | 160 |

    | Ürün mühendisliği | 140.000 TL | Mühendislik değişiklik emri | 10 | 25 |


    Ö mamulünün pazar fiyatı 300 TL''dir; işletme satış fiyatının %20''si oranında kâr hedeflemektedir.


    **İstenenler:**


    (a) Geleneksel yönteme (DİS''e dayalı tek oran) göre S ve Ö mamullerinin birim maliyetlerini hesaplayınız. (4 puan)


    (b) FDM''ye göre S ve Ö mamullerinin birim maliyetlerini hesaplayınız. (8 puan)


    (c) İki yöntemin sonuçlarını karşılaştırarak çapraz sübvansiyonun yönünü ve nedenini açıklayınız. (4 puan)


    (d) Ö mamulü için hedef birim maliyeti bulunuz ve FDM maliyetiyle karşılaştırınız. İşletme Ö''nün parti büyüklüğünü artırarak
    kurulum sayısını 40''tan 20''ye, taşıma sayısını 160''tan 120''ye indirmeyi planlamaktadır; faaliyet başına maliyetlerin
    değişmeyeceği ve faaliyet maliyetlerinin etken sayısıyla orantılı olarak azalacağı varsayımıyla bu iyileştirmenin hedef
    maliyete ulaşmak için yeterli olup olmadığını gösteriniz. (9 puan)

    '
  cozum: '**(a) Geleneksel yöntem**

    - Toplam DİS = 8.000 × 1 + 2.000 × 1,5 = 11.000 saat; GÜG oranı = 660.000 / 11.000 = 60 TL/DİS

    - S: GÜG payı 1 × 60 = 60 TL; birim maliyet = 50 + 60 = **110 TL**

    - Ö: GÜG payı 1,5 × 60 = 90 TL; birim maliyet = 70 + 90 = **160 TL**


    **(b) FDM**


    Faaliyet oranları: makine 220.000 / 5.500 = 40 TL/saat; kurulum 180.000 / 60 = 3.000 TL; taşıma 120.000 / 240 = 500 TL;
    mühendislik 140.000 / 35 = 4.000 TL.


    | Faaliyet | S | Ö |

    |---|---|---|

    | Makine çalıştırma | 4.000 × 40 = 160.000 | 1.500 × 40 = 60.000 |

    | Kurulum | 20 × 3.000 = 60.000 | 40 × 3.000 = 120.000 |

    | Malzeme taşıma | 80 × 500 = 40.000 | 160 × 500 = 80.000 |

    | Ürün mühendisliği | 10 × 4.000 = 40.000 | 25 × 4.000 = 100.000 |

    | **Toplam GÜG** | **300.000** | **360.000** |

    | Birim GÜG | 300.000 / 8.000 = 37,50 | 360.000 / 2.000 = 180 |

    | **Birim maliyet** | 50 + 37,50 = **87,50 TL** | 70 + 180 = **250 TL** |


    Kontrol: 300.000 + 360.000 = 660.000 TL.


    **(c) Çapraz sübvansiyon**


    Geleneksel yöntem S''ye birim başına 110 − 87,50 = 22,50 TL fazla (toplam 180.000 TL), Ö''ye 250 − 160 = 90 TL eksik (toplam
    180.000 TL) maliyet yüklemektedir; yüksek hacimli S, düşük hacimli Ö''yü sübvanse etmektedir. Nedeni, kurulum, taşıma
    ve mühendislik maliyetlerinin parti ve ürün düzeyinde olup üretim hacmiyle değil parti/değişiklik sayısıyla değişmesidir;
    hacme dayalı DİS oranı bu maliyetleri hacmi büyük olan S''ye kaydırır. Sonuçta Ö olduğundan kârlı (300 − 160 = 140 TL),
    S olduğundan kârsız görünür; fiyatlama ve ürün karması kararları yanıltıcı olur.


    **(d) Hedef maliyet ve iyileştirme**

    - Hedef kâr = 300 × %20 = 60 TL; hedef birim maliyet = 300 − 60 = **240 TL**

    - FDM maliyeti 250 TL; hedefin 10 TL üzerinde (maliyet açığı 10 TL/birim, toplam 20.000 TL)

    - İyileştirme tasarrufu: kurulum (40 − 20) × 3.000 = 60.000 TL; taşıma (160 − 120) × 500 = 20.000 TL; toplam 80.000 TL
    → birim başına 80.000 / 2.000 = 40 TL

    - Yeni birim maliyet = 250 − 40 = **210 TL** ≤ 240 TL; iyileştirme yeterlidir, hedefin 30 TL altına inilir.

    - Not: Bu tasarruf, kurulum ve taşıma kaynaklarının (personel, ekipman) gerçekten azaltılması ya da başka işlere kaydırılması
    hâlinde gerçekleşir; kaynak kapasitesi aynı kalırsa yalnız kullanılmayan kapasite ortaya çıkar.

    '
  puanlama:
  - olcut: (a) DİS oranı 60 TL ve birim maliyetler S 110 TL, Ö 160 TL
    puan: 4
  - olcut: (b) Dört faaliyet oranının doğru hesaplanması
    puan: 3
  - olcut: (b) Faaliyet maliyetlerinin mamullere yüklenmesi (300.000 / 360.000)
    puan: 3
  - olcut: (b) Birim maliyetler S 87,50 TL, Ö 250 TL
    puan: 2
  - olcut: (c) Sübvansiyonun yönü ve tutarı (S fazla, Ö eksik maliyetlenmiş)
    puan: 2
  - olcut: (c) Parti ve ürün düzeyindeki maliyetlerin hacme dayalı oranla dağıtılmasının açıklanması
    puan: 2
  - olcut: (d) Hedef maliyet 240 TL ve 10 TL maliyet açığı
    puan: 3
  - olcut: (d) Tasarrufun hesaplanması (80.000 TL; birim 40 TL)
    puan: 4
  - olcut: (d) Yeni maliyet 210 TL ile yeterlilik sonucu ve kaynak azaltımı koşulu
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Faaliyete dayalı ve stratejik maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "dis_orani = 660000 / (8000 * 1 + 2000 * 1.5)\ns_gel = 50 + 1 * dis_orani\no_gel = 70 + 1.5 * dis_orani\nmakine\
      \ = 220000 / 5500\nkurulum = 180000 / 60\ntasima = 120000 / 240\nmuh = 140000 / 35\ns_gug = 4000 * makine + 20 * kurulum\
      \ + 80 * tasima + 10 * muh\no_gug = 1500 * makine + 40 * kurulum + 160 * tasima + 25 * muh\ns_fdm = 50 + s_gug / 8000\n\
      o_fdm = 70 + o_gug / 2000\nhedef = 300 - 300 * 0.2\ntasarruf = (40 - 20) * kurulum + (160 - 120) * tasima\nyeni = o_fdm\
      \ - tasarruf / 2000\nsonuc = {\"dis_orani\": dis_orani, \"s_geleneksel\": s_gel, \"o_geleneksel\": o_gel, \"s_gug\"\
      : s_gug, \"o_gug\": o_gug,\n         \"s_fdm\": s_fdm, \"o_fdm\": o_fdm, \"hedef_maliyet\": hedef, \"maliyet_acigi\"\
      : o_fdm - hedef,\n         \"tasarruf\": tasarruf, \"yeni_birim_maliyet\": yeni}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-2.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
