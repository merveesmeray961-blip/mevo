    Yıllık genel üretim giderleri ve maliyet sürücüleri:


    | Faaliyet havuzu | Gider (TL) | Maliyet sürücüsü | S | Ö |

    |---|---|---|---|---|

    | Makine ayarı | 240.000 | Ayar sayısı | 40 | 120 |

    | Kalite kontrol | 180.000 | Muayene saati | 300 | 600 |

    | Malzeme taşıma | 120.000 | Taşıma sayısı | 200 | 400 |

    | Makine kullanımı | 600.000 | Makine saati | 6.000 | 4.000 |


    Diğer bilgiler:


    | | S | Ö |

    |---|---|---|

    | Yıllık üretim ve satış (adet) | 8.000 | 2.000 |

    | Birim satış fiyatı (TL) | 520 | 1.150 |

    | Birim direkt maliyet (ilk madde + işçilik, TL) | 400 | 900 |

    | Direkt işçilik saati (toplam) | 18.000 | 12.000 |


    **İstenenler:**

    (a) Her faaliyet havuzu için maliyet sürücüsü oranını hesaplayınız. (5 puan)

    (b) Faaliyete dayalı maliyetleme ile her ürüne yüklenecek genel üretim giderini ve birim genel üretim giderini bulunuz.
    (6 puan)

    (c) Genel üretim giderlerinin tamamının direkt işçilik saatine göre dağıtılması hâlinde birim genel üretim giderlerini
    hesaplayınız. (4 puan)

    (d) Her iki yönteme göre ürünlerin birim kârını bulunuz ve sonuçları yorumlayınız. (5 puan)

    '
  cozum: '**(a)** Ayar: 240.000 / 160 = **1.500 TL/ayar**; kalite kontrol: 180.000 / 900 = **200 TL/saat**; taşıma: 120.000
    / 600 = **200 TL/taşıma**; makine: 600.000 / 10.000 = **60 TL/saat**.


    **(b)** S: 40 × 1.500 + 300 × 200 + 200 × 200 + 6.000 × 60 = 520.000 TL → birim **65 TL**. Ö: 120 × 1.500 + 600 × 200
    + 400 × 200 + 4.000 × 60 = 620.000 TL → birim **310 TL**.


    **(c)** Genel oran = 1.140.000 / 30.000 = 38 TL/işçilik saati. S: 18.000 × 38 / 8.000 = **85,50 TL**; Ö: 12.000 × 38 /
    2.000 = **228 TL**.


    **(d)**


    | | S | Ö |

    |---|---|---|

    | Birim kâr — faaliyete dayalı | 55 | -60 |

    | Birim kâr — işçilik saati esaslı | 34,50 | 22 |


    Geleneksel yöntem, ayar, kontrol ve taşıma faaliyetlerini çok kullanan Özel kapıyı düşük maliyetli, Standart kapıyı ise
