- id: YMM-YNM-KRV-K001
  sinav: ymm
  ders: YNM
  konu: KRV
  kazanimlar:
  - ürün hattını kapatma
  - üret veya satın al
  - özel sipariş
  - fark analizi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Orkun A.Ş.''nin üç ürün hattına ilişkin yıllık bölüm gelir tablosu aşağıdadır (TL):


    | | X | Y | Z | Toplam |

    |---|---|---|---|---|

    | Satışlar | 800.000 | 600.000 | 400.000 | 1.800.000 |

    | Değişken giderler | 480.000 | 330.000 | 300.000 | 1.110.000 |

    | Katkı payı | 320.000 | 270.000 | 100.000 | 690.000 |

    | Doğrudan sabit giderler | 120.000 | 90.000 | 80.000 | 290.000 |

    | Dağıtılmış ortak sabit giderler | 160.000 | 120.000 | 80.000 | 360.000 |

    | Faaliyet kârı (zararı) | 40.000 | 60.000 | (60.000) | 40.000 |


    Ek bilgiler:

    - Z''nin doğrudan sabit giderlerinin 30.000 TL''si, satış değeri olmayan özel ekipmanın amortismanıdır; kalan 50.000 TL''lik
    personel gideri hat kapatılırsa ortadan kalkar. Ortak sabit giderler hiçbir seçenekte değişmez.

    - Hatların satışları birbirinden bağımsızdır.

    - İşletme, üretimde kullandığı P parçasını yılda 10.000 birim olarak birimi 18 TL''den satın almaktadır. Z hattı kapatılırsa
    boşalan kapasitede P üretilebilir; birim değişken maliyet 11 TL olacak, ayrıca yıllık 10.000 TL kalıp kirası ödenecektir.
    Z hattı açık kaldıkça P üretilemez.

    - X ürününün birim satış fiyatı 80 TL, birim değişken gideri 48 TL''dir; bu tutarın 3 TL''si satış komisyonudur. X hattında
    boş kapasite vardır.


    **İstenenler:**


    (a) Z hattı başka bir kullanım olmaksızın kapatılırsa işletmenin yıllık faaliyet kârı ne olur? Z hattı kapatılmalı mıdır?
    (8 puan)


    (b) Z hattı kapatılıp boşalan kapasitede P parçası üretilirse işletmenin yıllık faaliyet kârı ne olur? Üç seçeneği (Z
    devam, Z kapat, Z kapat ve P üret) karşılaştırarak öneride bulununuz. (9 puan)


    (c) Bir yurt dışı müşterisi, normal satışları etkilemeyecek tek seferlik 2.000 birim X için birim başına 56 TL teklif
    etmiştir. Bu satışta komisyon ödenmeyecek, toplam 6.000 TL tek seferlik hazırlık gideri oluşacaktır. Siparişin kâra etkisini
    ve kabul edilebilecek en düşük birim fiyatı bulunuz. (8 puan)

    '
  cozum: '**(a)** Z kapatılırsa:

    - Kaybedilen katkı payı: −100.000 TL

    - Kaçınılabilir sabit gider (personel): +50.000 TL

    - Amortisman (30.000) ve dağıtılmış ortak giderler (80.000) kaçınılamaz, ilgisizdir.

    - Net etki: −50.000 TL → faaliyet kârı 40.000 − 50.000 = **−10.000 TL (zarar)**.


    Z''nin bölüm zararı (60.000 TL) dağıtılmış giderlerden kaynaklanır; Z ortak giderlere 100.000 − 50.000 = 50.000 TL katkı
    sağladığından **tek başına kapatılmamalıdır.**


    **(b)** P''nin üretilmesinin etkisi:

    - Satın alma maliyetinden tasarruf: 10.000 × (18 − 11) = 70.000 TL

    - Kalıp kirası: −10.000 TL → net +60.000 TL


    | Seçenek | Faaliyet kârı |

    |---|---|

    | Z devam (P satın alınır) | 40.000 TL |

    | Z kapat, P satın al | −10.000 TL |

    | Z kapat, P üret | −10.000 + 60.000 = **50.000 TL** |


    Z''yi kapatıp P''yi üretmek, mevcut duruma göre kârı 10.000 TL artırır (−50.000 + 60.000). **Öneri:** Z kapatılmalı ve
    P içeride üretilmelidir. Z''nin boşalan kapasitesinin fırsat değeri (60.000 TL), Z''nin ortak giderlere katkısını (50.000
    TL) aşmaktadır.


    **(c)** Siparişin ilgili birim maliyeti = 48 − 3 = 45 TL (komisyon yok; sabit giderler değişmez, boş kapasite var).

    - Kâra etki = 2.000 × (56 − 45) − 6.000 = 22.000 − 6.000 = **+16.000 TL** → sipariş kabul edilmelidir.

    - En düşük birim fiyat = 45 + 6.000 / 2.000 = **48 TL**.

    '
  puanlama:
  - olcut: (a) Kaybedilen katkı payı ve kaçınılabilir giderin doğru belirlenmesi
    puan: 3
  - olcut: (a) Amortisman ve dağıtılmış giderlerin ilgisiz olduğunun açıklanması
    puan: 2
  - olcut: (a) Yeni kâr (−10.000 TL) ve Z'nin kapatılmaması kararı
    puan: 3
  - olcut: (b) P üretiminin net tasarrufunun (60.000 TL) hesaplanması
    puan: 3
  - olcut: (b) Üç seçeneğin kârlarının (40.000 / −10.000 / 50.000 TL) karşılaştırılması
    puan: 4
  - olcut: '(b) Gerekçeli öneri: Z kapatılıp P üretilmeli'
    puan: 2
  - olcut: (c) İlgili birim maliyetin komisyonsuz 45 TL alınması
    puan: 3
  - olcut: (c) Kâra etki +16.000 TL ve kabul kararı
    puan: 3
  - olcut: (c) En düşük fiyat 48 TL
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "mevcut_kar = 690000 - 290000 - 360000\nz_kapat = -100000 + 50000\np_net = 10000 * (18 - 11) - 10000\nsiparis\
      \ = 2000 * (56 - (48 - 3)) - 6000\nen_dusuk = (48 - 3) + 6000 / 2000\nsonuc = {\"mevcut_kar\": mevcut_kar, \"z_kapat_kar\"\
      : mevcut_kar + z_kapat, \"p_net_tasarruf\": p_net,\n         \"z_kapat_p_uret_kar\": mevcut_kar + z_kapat + p_net, \"\
      siparis_etkisi\": siparis,\n         \"en_dusuk_fiyat\": en_dusuk}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-1.yaml, klasik 2
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
