- id: YMM-YNM-KRV-K015
  sinav: ymm
  ders: YNM
  konu: KRV
  kazanimlar:
  - özel sipariş
  - fark analizi
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: 'Bora Mutfak Gereçleri A.Ş. yıllık 60.000 adet kapasiteli bir tesiste çelik tencere seti üretmektedir. Yıl içinde
    normal satışlar 50.000 adet olup birim satış fiyatı 140 TL''dir. Birim maliyet verileri:


    | Kalem | Birim (TL) |

    |---|---|

    | Direkt ilk madde ve malzeme | 48 |

    | Direkt işçilik | 30 |

    | Değişken genel üretim gideri | 12 |

    | Satış komisyonu | 10 |

    | Sabit genel üretim gideri (600.000 TL / 50.000 adet) | 12 |


    Yurt dışındaki bir müşteri, işletmenin normal pazarını etkilemeyecek biçimde 15.000 adet set için adedi 100 TL''den sipariş
    vermek istemektedir. Siparişte komisyon ödenmeyecektir; ancak siparişe özgü toplam 25.000 TL hazırlık ve sertifikasyon
    gideri oluşacaktır. Boş kapasite yalnızca 10.000 adettir; siparişin tamamı kabul edilirse 5.000 adet normal satıştan vazgeçilecektir.


    **İstenenler:**

    (a) Siparişin yalnız 10.000 adetlik bölümü kabul edilirse kâra etkisini hesaplayınız. (7 puan)

    (b) 15.000 adetlik siparişin tamamı kabul edilirse kâra etkisini hesaplayınız ve kararı belirtiniz. (9 puan)

    (c) 15.000 adetlik siparişin tamamının kabul edilebilmesi için istenebilecek asgari birim satış fiyatını bulunuz; tam
    maliyete (112 TL) göre karar vermenin neden yanıltıcı olacağını açıklayınız. (8 puan)

    '
  cozum: '**(a)** Özel siparişin birim katkısı = 100 − (48 + 30 + 12) = 10 TL (komisyon ödenmediği için ilgisiz). Sabit gider
    artmadığı için tam maliyetteki 12 TL ilgisizdir.

    10.000 × 10 − 25.000 = **75.000 TL** kâr artışı.


    **(b)** Normal satışın birim katkısı = 140 − (48 + 30 + 12 + 10) = 40 TL. Vazgeçilen 5.000 adet için fırsat maliyeti =
    5.000 × 40 = 200.000 TL.


    | Kalem | TL |

    |---|---|

    | Özel sipariş katkısı (15.000 × 10) | 150.000 |

    | Vazgeçilen normal katkı | -200.000 |

    | Hazırlık gideri | -25.000 |

    | **Net etki** | **-75.000** |


    Tamamı kabul edilirse kâr 75.000 TL azalır; yalnız 10.000 adetlik bölüm kabul edilmelidir.


    **(c)** Asgari fiyat = (15.000 × 90 + 200.000 + 25.000) / 15.000 = **105 TL/adet**. Tam maliyet 112 TL''dir; oysa sabit
    gider artmadığı için siparişin ilgili maliyeti 90 TL''dir ve fırsat maliyeti dışında sipariş 100 TL ile kârlıdır. Tam
    maliyet, ilgisiz sabit gideri karara katar.

    '
  puanlama:
  - olcut: (a) birim katkı ve 10.000 adet sonucu
    puan: 7
  - olcut: (b) fırsat maliyeti ve net etki, karar
    puan: 9
  - olcut: (c) asgari fiyat ve tam maliyetin yanıltıcılığı
    puan: 8
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 16
    alinti: (a) Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri, (b) Üretim
      sürecinde bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut
      konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Değişken genel üretim giderleri, endirekt (dolaylı) malzeme ve endirekt (dolaylı) işçilik gibi, üretim miktarı
      ile birlikte doğru orantılı olarak değişen dolaylı üretim maliyetleridir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'vc_normal = 48 + 30 + 12 + 10

      vc_ozel = 48 + 30 + 12

      katki_normal = 140 - vc_normal

      katki_ozel = 100 - vc_ozel

      hazirlik = 25000

      a = 10000 * katki_ozel - hazirlik

      kesinti = 5000 * katki_normal

      b = 15000 * katki_ozel - kesinti - hazirlik

      c = (15000 * vc_ozel + kesinti + hazirlik) / 15000

      tam = 112

