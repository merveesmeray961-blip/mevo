      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kA = 45

      kB = 30

      c1 = 400 * kA

      c2 = 350 * kB

      A = (2 * 800 - 700) / 3

      B = 800 - 2 * A

      opt = A * kA + B * kB

