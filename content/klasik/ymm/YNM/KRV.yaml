    alinti: Yan ürünlerin çoğu, yapıları gereği önemsizdir. Böyle bir durumda, yan ürünler genellikle net gerçekleşebilir
      değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden düşülür. Bunun sonucu olarak ana ürünün defter değeri, maliyet
      değerinden önemli ölçüde farklılık göstermez.
  - mevzuat: TMS 2 Stoklar
    madde: par. 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
