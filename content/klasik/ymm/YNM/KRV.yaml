  soru: 'Toros Döküm A.Ş. üç ürünü aynı CNC tezgâhlarında işlemektedir. Gelecek yıl kullanılabilecek toplam makine saati

    30.000 saattir. Ürün bilgileri:


    | Ürün | Birim satış fiyatı (TL) | Birim değişken maliyet (TL) | Birim makine saati | Azami talep (adet) |

    |---|---|---|---|---|

    | A | 400 | 250 | 3 | 4.000 |

    | B | 300 | 180 | 2 | 6.000 |

    | C | 500 | 300 | 5 | 3.000 |


    Yıllık sabit giderler 900.000 TL''dir ve üretim karmasından etkilenmez. Ürünler birbirinden bağımsız olarak

    satılabilmektedir; stok tutulmayacaktır.


    **İstenenler:**


    (a) Kısıtın bağlayıcı olup olmadığını gösteriniz; kârı en büyükleyen üretim karmasını, toplam katkı payını ve

    faaliyet kârını hesaplayınız. (8 puan)


    (b) Üretim önceliği birim katkı payına göre belirlenseydi oluşacak karmayı ve kâr kaybını hesaplayınız; doğru

    sıralama ölçütünü gerekçesiyle açıklayınız. (6 puan)


    (c) Bir işletme, yıl boyunca kullanılmak üzere 5.000 saatlik ek tezgâh kapasitesini kiralamayı önermektedir.

    İşletmenin bu kapasite için ödeyebileceği en yüksek kira bedelini bulunuz. Teklif 12.000 saat olsaydı ödenebilecek

    en yüksek tutar ne olurdu? (6 puan)


    (d) C ürününün, mevcut kapasitede üretim sıralamasında A''nın önüne geçebilmesi için satış fiyatının en az ne

    olması gerektiğini bulunuz. (5 puan)

    '
  cozum: "**(a) Optimal karma**\n\nTalebin tamamı için gerekli saat: A 4.000 × 3 = 12.000; B 6.000 × 2 = 12.000; C 3.000 ×\
    \ 5 = 15.000; toplam\n39.000 saat > 30.000 saat → makine saati **bağlayıcı kısıttır**.\n\n| Ürün | Birim KP (TL) | Saat\
    \ başı KP (TL) | Sıra |\n|---|---|---|---|\n| A | 150 | 150 / 3 = 50 | 2 |\n| B | 120 | 120 / 2 = 60 | 1 |\n| C | 200\
    \ | 200 / 5 = 40 | 3 |\n\nKıt kaynak, kıt kaynak birimi başına katkı payı en yüksek üründen başlanarak dağıtılır:\n\n\
    | Sıra | Ürün | Adet | Kullanılan saat | Kümülatif saat | Katkı payı (TL) |\n|---|---|---|---|---|---|\n| 1 | B | 6.000\
    \ | 12.000 | 12.000 | 720.000 |\n| 2 | A | 4.000 | 12.000 | 24.000 | 600.000 |\n| 3 | C | 6.000 / 5 = 1.200 | 6.000 |\
    \ 30.000 | 240.000 |\n| | | | | **Toplam** | **1.560.000** |\n\nFaaliyet kârı = 1.560.000 − 900.000 = **660.000 TL**.\n\
    \n**(b) Yanlış ölçüt**\n\nBirim katkı payı sırası C (200), A (150), B (120) olurdu: C 3.000 adet (15.000 saat), A 4.000\
    \ adet (12.000 saat),\nB kalan 3.000 saatle 1.500 adet. Katkı payı = 600.000 + 600.000 + 180.000 = 1.380.000 TL; kâr 480.000\
    \ TL.\nKâr kaybı **180.000 TL**'dir. Kapasite kısıtı varken amaç kıt kaynağın her biriminden en yüksek katkıyı elde\n\
    etmektir; bu nedenle ölçüt birim katkı payı değil **kıt kaynak (makine saati) başına katkı payıdır**.\n\n**(c) Ek kapasite**\n\
    \nEk saatler, karşılanmamış talebi olan C ürününe ayrılır: C için karşılanmamış talep 3.000 − 1.200 = 1.800 adet,\nyani\
    \ 9.000 saattir; her ek saat 40 TL katkı sağlar.\n- 5.000 saat: tamamı C'de kullanılır → 5.000 × 40 = **200.000 TL** (en\
    \ yüksek kira; saat başı 40 TL).\n- 12.000 saat: yalnız 9.000 saati kullanılabilir (talep sınırı) → 9.000 × 40 = **360.000\
    \ TL**; kalan 3.000 saatin\n  değeri sıfırdır.\n\n**(d) C'nin önceliği**\n\nC'nin saat başı katkı payının A'nınkini (50\
    \ TL) aşması gerekir: (F − 300) / 5 > 50 → F − 300 > 250 → **F > 550 TL**.\nFiyat 550 TL'yi aştığında C, A'dan önce üretilir.\n"
  puanlama:
