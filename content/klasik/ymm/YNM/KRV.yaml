    aylık beklenen sonuçlar:


    | Kalem | Aylık (TL) |

    |---|---|

    | Satışlar | 400.000 |

    | Değişken giderler | 310.000 |

    | Sabit giderler | 120.000 |


    Tesis üç ay kapatılırsa aylık sabit giderlerin 40.000 TL''si (vardiya amirleri, enerji bağlantı bedeli ve sigorta) ortadan
    kalkar, kalan 80.000 TL ise (kira ve amortisman) devam eder. Kapatma ve yeniden açılış için toplam 24.000 TL tek seferlik
    gider doğacaktır.


    **İstenenler:**

    (a) Tesis açık tutulursa bir aylık sonucu bulunuz. (5 puan)

    (b) Üç aylık dönem için açık tutma ve kapatma seçeneklerinin sonuçlarını karşılaştırınız; kararı gerekçelendiriniz. (9
    puan)

    (c) Tesisin açık tutulmasının kârlı olması için aylık katkı payının en az ne kadar olması gerektiğini bulunuz. (7 puan)

    '
  cozum: '**(a)** 400.000 − 310.000 − 120.000 = **-30.000 TL** (aylık zarar).


    **(b)** Aylık katkı payı = 400.000 − 310.000 = 90.000 TL.


    | Seçenek | Hesap | Üç aylık sonuç (TL) |

    |---|---|---|

    | Açık | 3 × (-30.000) | **-90.000** |

    | Kapalı | 3 × (−80.000) − 24.000 | **-264.000** |


    Açık tutmak üç ayda **174.000 TL** daha az zarar doğurur. Açıkken zarar görünse de kaçınılamayan 80.000 TL''lik sabit
    gider zaten ödenecek; katkı payı (90.000) kaçınılabilir sabit giderden (40.000) büyüktür.


    **(c)** Kritik katkı = kaçınılabilir sabit gider + aylığa düşen kapatma gideri = 40.000 + 24.000 / 3 = **48.000 TL**.
    Aylık katkı bu tutarın üzerindeyse tesis açık tutulur.

    '
