    Kendi üretiminde birim değişken maliyet 31 TL''dir; ayrıca üretimin sürdürülmesi hâlinde yıllık 98.000 TL kaçınılabilir
    sabit gider (özel kalite kontrol ekibi) doğmaktadır. Tedarikçi birim fiyatı 36 TL, kart başına nakliye ve gümrükleme 2
    TL''dir (toplam 38 TL).


    **İstenenler:**

    (a) Yıllık ihtiyaç 20.000 adet ise iki seçeneğin ilgili maliyetini hesaplayınız ve kararı belirtiniz. Üretimin ve satın
    almanın eşit maliyetli olduğu miktarı bulunuz. (7 puan)

    (b) Yıllık ihtiyaç 12.000 adet ise karar ne olur? Üretime göre satın almanın avantajını bulunuz. (7 puan)

    (c) Tedarikçi, yıllık 15.000 adet ve üzeri siparişlerin tamamında toplam birim maliyeti 37 TL''ye indirmeyi önermiştir.
    16.000 adetlik ihtiyaç için kararı yeniden değerlendiriniz. (7 puan)

    '
  cozum: '**(a)** Üretim: 31 × 20.000 + 98.000 = 718.000 TL; satın alma: 38 × 20.000 = 760.000 TL. Üretim **42.000 TL** avantajlıdır.
    Kayıtsızlık miktarı: 31 x + 98.000 = 38 x → x = **14.000 adet**; bu miktarın altında satın alma, üstünde üretim ucuzdur.


    **(b)** Üretim: 31 × 12.000 + 98.000 = 470.000 TL; satın alma: 38 × 12.000 = 456.000 TL. **Satın alma** 14.000 TL avantajlıdır.


    **(c)** İskontolu fiyatla satın alma: 37 × 16.000 = 592.000 TL; üretim: 31 × 16.000 + 98.000 = 594.000 TL. Satın alma
    **2.000 TL** avantajlıdır; 16.000 adet için satın alınmalıdır. (İskonto altında kayıtsızlık miktarı 98.000 / 6 ≈ 16.333
    adettir.)

    '
