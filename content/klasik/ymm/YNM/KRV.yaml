  soru: 'Nil Süt Ürünleri A.Ş. peynir üretimi sırasında yan ürün olarak peynir altı suyu tozu elde etmektedir. Dönem ortak
    işlem maliyeti 840.000 TL''dir. Dönemde 74.000 kg peynir (ana ürün) ve 20.000 kg süt tozu (yan ürün) üretilmiştir. Süt
    tozunun satış fiyatı 6 TL/kg, kg başına ayrıca 1 TL ambalaj ve satış gideri vardır. Dönem sonunda 14.000 kg peynir ve
    5.000 kg süt tozu satılmamıştır.


    İşletme, yan ürünü net gerçekleşebilir değerinden ölçmekte ve bu değeri ana ürünün maliyetinden düşmektedir.


    Yönetim, süt tozunu granül hâle getirmeyi düşünmektedir. Granül ürün 9 TL/kg''a satılabilecek; ek işlem kg başına 2,5
    TL değişken maliyet ve toplam 20.000 TL sabit işletme gideri doğuracaktır. Ambalaj ve satış gideri granülde de kg başına
    1 TL''dir.


    **İstenenler:**

    (a) Yan ürünün net gerçekleşebilir değerini ve ana ürünün kg başına maliyetini bulunuz. (7 puan)

    (b) Dönem sonu mamul stoklarının toplam değerini hesaplayınız. (7 puan)

    (c) Granül işleminin yapılıp yapılmayacağına karar veriniz ve kararın kâra etkisini bulunuz. (7 puan)

    '
  cozum: '**(a)** Yan ürün NGD = 20.000 × (6 − 1) = **100.000 TL** (5 TL/kg). Ana ürüne yüklenecek maliyet = 840.000 − 100.000
    = 740.000 TL; birim maliyet = 740.000 / 74.000 = **10 TL/kg**.


    **(b)** Peynir stoğu = 14.000 × 10 = 140.000 TL; süt tozu stoğu = 5.000 × 5 = 25.000 TL. Toplam = **165.000 TL** (stok
    maliyeti NGD''den yüksek olamaz).


    **(c)** Granülün net geliri = 9 − 1 − 2,5 = 5,50 TL/kg; mevcut net gelir 5 TL/kg. Artımlı kazanç = (5,50 − 5) × 20.000
    = 10.000 TL; sabit gider 20.000 TL düşüldüğünde net etki = **-10.000 TL**. Etki negatif olduğundan granül işlemi yapılmamalıdır.

    '
  puanlama:
