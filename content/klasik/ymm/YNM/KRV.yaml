      G5:
        sonuc: gecti
        tarih: '2026-10-22'
        not: güven 5, seviye 2
  gecmis:
  - tarih: '2026-10-22'
    kim: uretici
    ne: harici teslim t_K_YNM.yaml, klasik 1
  - tarih: '2026-10-22'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
