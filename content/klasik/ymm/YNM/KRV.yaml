    | Ürün | Pay | Dağıtılan ortak maliyet (TL) |

    |---|---|---|

    | X | 600.000 / 1.200.000 | **480.000** |

    | Y | 450.000 / 1.200.000 | **360.000** |

    | Z | 150.000 / 1.200.000 | **120.000** |


    **(b)** Z için artımlı gelir = 50.000 × (5 − 3) = 100.000 TL; ek işlem maliyeti = 50.000 × 1,5 = 75.000 TL. Net fayda
    = **25.000 TL** → ek işlem yapılmalıdır.


    **(c)** Y için artımlı gelir = 150.000 × (4 − 3) = 150.000 TL; ek işlem maliyeti = 180.000 TL; net etki = **-30.000 TL**
    → ek işlem yapılmamalı, Y ayrılma noktasında satılmalıdır. Ortak maliyet, ek işlem yapılsın ya da yapılmasın aynı tutarda
    gerçekleştiğinden batıktır; yalnız ayrılma noktasından sonraki artımlı gelir ve maliyetler ilgilidir.

    '
  puanlama:
