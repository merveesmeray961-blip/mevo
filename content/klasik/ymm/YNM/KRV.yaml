- id: YMM-YNM-KRV-K014
  sinav: ymm
  ders: YNM
  konu: KRV
  kazanimlar:
  - üret veya satın al
  - fark analizi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: 'Tuna Otomotiv A.Ş., montaj hattında kullandığı conta setini yılda 12.000 adet kendi atölyesinde üretmektedir. Birim
    maliyet bilgileri şöyledir:


    | Kalem | Birim (TL) |

    |---|---|

    | Direkt ilk madde ve malzeme | 14 |

    | Direkt işçilik | 10 |

    | Değişken genel üretim gideri | 6 |

    | Sabit genel üretim gideri (yıllık 96.000 TL, 12.000 adede bölünmüş) | 8 |

    | **Tam maliyet** | **38** |


    Yıllık 96.000 TL sabit genel üretim giderinin 36.000 TL''si atölye şefinin ücretidir ve üretim durursa ortadan kalkar;
    60.000 TL''si ise binanın amortismanı ve kirasıdır. Bir tedarikçi aynı kalitede conta setini adedi 31 TL''den sunmaktadır.


    **İstenenler:**

    (a) Kendi üretimi ile satın almayı ilgili maliyetler esasına göre karşılaştırarak kararı gerekçelendiriniz; kararın yıllık
    kâra etkisini bulunuz. (8 puan)

    (b) Üretim durdurulursa boşalan kapasitenin başka bir işte kullanılarak yılda 48.000 TL net katkı sağlayacağı anlaşılmıştır.
    Bu bilgiyle kararı yeniden değerlendiriniz ve satın almanın avantajını bulunuz. (8 puan)

    (c) Kapasite için bu alternatif varken işletmenin ödemeyi kabul edebileceği en yüksek tedarik fiyatını hesaplayınız. (6
    puan)

    '
  cozum: '**(a)** İlgili üretim maliyeti: değişken kalemler 30 TL + kaçınılabilir sabit gider (36.000 / 12.000 = 3 TL) = **33
    TL/adet**. Amortisman ve kira kaçınılamadığı için ilgisizdir; bu yüzden 38 TL''lik tam maliyet karar ölçütü olamaz (tam
    maliyet = 38 TL).


    Satın alma fiyatı 31 TL < 33 TL olduğundan satın alınmalıdır. Yıllık tasarruf = (33 − 31) × 12.000 = **24.000 TL**.


    **(b)** Satın alma seçeneğinin net maliyeti = 31 × 12.000 − 48.000 = 324.000 TL; üretim ilgili maliyeti = 33 × 12.000
    = 396.000 TL. Satın alma avantajı = **72.000 TL**; satın alma ve kapasiteyi alternatif işte kullanma tercih edilir.


    **(c)** Kapasite alternatifi varken kayıtsızlık fiyatı = (396.000 − 48.000) / 12.000 = **29 TL/adet**. Tedarik fiyatı
    bunun altındaysa satın alma, üstündeyse üretim kârlıdır.

    '
  puanlama:
  - olcut: (a) ilgili maliyetin doğru belirlenmesi, kaçınılamayan sabit giderin dışlanması, sonuç
    puan: 8
  - olcut: (b) fırsat maliyetinin karara eklenmesi ve avantaj tutarı
    puan: 8
  - olcut: (c) kayıtsızlık fiyatı
    puan: 6
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Değişken genel üretim giderleri, endirekt (dolaylı) malzeme ve endirekt (dolaylı) işçilik gibi, üretim miktarı
      ile birlikte doğru orantılı olarak değişen dolaylı üretim maliyetleridir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'adet = 12000

      degisken = 14 + 10 + 6

      kac_sabit_br = 36000 / adet

      uretim_ilgili = degisken + kac_sabit_br

      fiyat = 31

      tasarruf = (uretim_ilgili - fiyat) * adet

      alt_gelir = 48000

      uret_top = uretim_ilgili * adet

      al_top = fiyat * adet - alt_gelir

      avantaj = uret_top - al_top

      esik = (uret_top - alt_gelir) / adet

      esik_yok = uretim_ilgili

      tam_maliyet = degisken + 96000 / adet

      sonuc = {''a'': tasarruf, ''b'': avantaj, ''c'': esik, ''tam'': tam_maliyet}

      '
