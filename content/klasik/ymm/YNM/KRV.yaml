  soru: 'Cihan Ambalaj A.Ş. tek bir ham maddeyi kullanarak X, Y ve Z ürünlerini üretmektedir. Gelecek yıl için ham madde arzı
    en çok 24.000 kg ile sınırlıdır. Veriler:


    | | X | Y | Z |

    |---|---|---|---|

    | Birim katkı payı (TL) | 36 | 30 | 64 |

    | Birim başına ham madde (kg) | 3 | 2 | 4 |

    | Azami talep (adet) | 4.000 | 5.000 | 3.500 |


    Yıllık sabit giderler 280.000 TL''dir.


    **İstenenler:**

    (a) Ürünlerin ham madde kilogramı başına katkı payını hesaplayarak üretim sırasını belirleyiniz. (6 puan)

    (b) En çok kâr sağlayan üretim planını ve yıllık faaliyet kârını bulunuz. (8 puan)

    (c) Tedarikçi, normal fiyatın üzerinde kg başına 10 TL ek bedelle en çok 12.000 kg daha ham madde sağlayabileceğini bildirmiştir.
    Ek alımın yapılıp yapılmayacağına karar veriniz ve en yüksek faaliyet kârını bulunuz. (7 puan)

    '
