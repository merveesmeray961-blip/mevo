- id: YMM-YNM-KRV-K013
  sinav: ymm
  ders: YNM
  konu: KRV
  kazanimlar:
  - ürün hattını kapatma
  - fark analizi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: 'Deniz Mobilya A.Ş. iki ürün hattı işletmektedir. Hatlara ilişkin yıllık bölüm sonuçları aşağıdadır (TL):


    | | Dolap hattı | Sandalye hattı |

    |---|---|---|

    | Satışlar | 900.000 | 500.000 |

    | Değişken giderler | 540.000 | 380.000 |

    | Hatta doğrudan izlenen sabit giderler | 150.000 | 110.000 |

    | Dağıtılan ortak sabit giderler | 140.000 | 60.000 |


    Ek bilgiler:

    - Sandalye hattının doğrudan sabit giderlerinin 90.000 TL''si (usta ve vardiya personeli) hat kapatılırsa ortadan kalkar;
    kalan 20.000 TL makine amortismanıdır ve kaçınılamaz.

    - Dağıtılan ortak sabit giderler, hangi seçenek uygulanırsa uygulansın değişmez.

    - Sandalye hattı kapatılırsa boşalan üretim alanı bir komşu firmaya yıllık 45.000 TL''ye kiralanabilecektir.

    - Sandalye müşterileri aynı zamanda dolap da almaktadır; sandalye hattı kapatılırsa dolap satışlarının %10 oranında azalması,
    buna bağlı olarak dolap hattının değişken giderlerinin de oransal azalması beklenmektedir.


    **İstenenler:**

    (a) Sandalye hattının bölüm sonucunu bulunuz ve hattın kapatılmasının işletme kârına etkisini hesaplayınız. (7 puan)

    (b) Boşalan alanın kiralanması hâlinde kapatma kararının kâra etkisini bulunuz. (7 puan)

    (c) Dolap satışlarındaki düşüşü de dikkate alarak kiralama dâhil kapatma kararının kâra etkisini bulunuz; karar kayıtsızlık
    noktasındaki yıllık kira bedelini hesaplayınız. (8 puan)

    '
  cozum: '**(a)** Sandalye hattı bölüm sonucu = 500.000 − 380.000 − 110.000 − 60.000 = **-50.000 TL** (zarar). Ancak karar
    için yalnızca kaçınılabilir kalemler ilgilidir:


    | Kalem | Tutar (TL) |

    |---|---|

    | Kaybedilen katkı payı (500.000 − 380.000) | -120.000 |

    | Kaçınılan sabit gider | +90.000 |

    | Kapatmanın kâra etkisi | **-30.000** |


    Amortisman (20.000) ve dağıtılan ortak giderler (60.000) kaçınılamadığı için ilgisizdir; bölüm zararı tek başına kapatmayı
    haklı kılmaz. Hat, kaçınılamayan giderlere 30.000 TL katkı sağladığından kapatma kârı azaltır.


    **(b)** Kira geliri ilgili artımlı gelirdir: net etki = -30.000 + 45.000 = **15.000 TL**; kiralama ile birlikte kapatma
    kârı 15.000 TL artırır.


    **(c)** Dolap katkı payı kaybı = (900.000 − 540.000) × %10 = 36.000 TL. Toplam etki = 15.000 − 36.000 = **-21.000 TL**;
    kapatma kârı 21.000 TL azaltır, hat kapatılmamalıdır. Kayıtsızlık kirası = hat kapatmanın kayıpları (30.000 + 36.000)
    = **66.000 TL**; yıllık kira bunun üzerindeyse kapatma kârlı olur.

    '
  puanlama:
  - olcut: (a) bölüm sonucu ve doğru ilgili maliyet tablosu ile kapatma etkisi
    puan: 7
  - olcut: (b) kira gelirinin eklenmesi ve sonuç
    puan: 7
  - olcut: (c) çapraz etki, toplam etki ve kayıtsızlık kirası
