      yan_kg = 20000

      yan_ngd_br = 6 - 1

      yan_ngd = yan_kg * yan_ngd_br

      ana_maliyet = ortak - yan_ngd

      ana_kg = 74000

      ana_br = ana_maliyet / ana_kg

      stok_ana = 14000 * ana_br

      stok_yan = 5000 * yan_ngd_br

      toplam_stok = stok_ana + stok_yan

      islem_br = 9 - 1 - 2.5

      ek_kazanc = (islem_br - yan_ngd_br) * yan_kg

      net = ek_kazanc - 20000

