      : mevcut_kar + z_kapat, \"p_net_tasarruf\": p_net,\n         \"z_kapat_p_uret_kar\": mevcut_kar + z_kapat + p_net, \"\
      siparis_etkisi\": siparis,\n         \"en_dusuk_fiyat\": en_dusuk}\n"
