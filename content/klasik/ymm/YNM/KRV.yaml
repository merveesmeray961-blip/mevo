    **(b)** Z''nin tamamı: 3.500 × 4 = 14.000 kg; Y''nin tamamı: 5.000 × 2 = 10.000 kg; toplam 24.000 kg kapasiteyi doldurur,
    X üretilmez.

    Katkı = 3.500 × 64 + 5.000 × 30 = 374.000 TL; faaliyet kârı = 374.000 − 280.000 = **94.000 TL**.


    **(c)** Y ve Z''nin talebi zaten tamamen karşılanmıştır; ek hammadde yalnız X''e gidebilir. X''in kg başına katkısı 12
    TL, ek bedel 10 TL olduğundan kg başına 2 TL kazanç vardır. X''in azami talebi 4.000 adet = 12.000 kg, tedarik sınırı
    ile eşittir. Ek kazanç = 12.000 × 2 = 24.000 TL. En yüksek faaliyet kârı = 94.000 + 24.000 = **118.000 TL**. Ek bedel
    12 TL''yi aşarsa alım kârsız olur.

    '
