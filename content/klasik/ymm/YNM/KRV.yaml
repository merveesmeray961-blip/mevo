    | Yıllık işletme gideri | 180.000 TL | 120.000 TL |

    | Beş yıl sonundaki hurda değeri | 0 | 40.000 TL |

    | Bugün satılırsa elde edilecek tutar | 30.000 TL | - |


    Her iki makine de aynı üretim kapasitesine ve aynı gelire sahiptir. Eski makinenin defter değeri amortisman yoluyla beş
    yılda giderleşecektir.


    **İstenenler:**

    (a) Fark (artımlı) analizi ile beş yıllık toplamda makine değiştirmenin net maliyetini hesaplayınız ve kararı belirtiniz;
    eski makinenin defter değerinin kararla ilişkisini açıklayınız. (8 puan)

    (b) Yeni makinenin yıllık işletme gideri kaç TL olursa karar kayıtsız kalır? (7 puan)

    (c) Yeni makinenin yılda 20.000 TL fire tasarrufu sağlayacağı anlaşıldığında kararı yeniden değerlendiriniz. (7 puan)

    '
