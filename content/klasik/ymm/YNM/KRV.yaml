  soru: 'Fırat Elektronik A.Ş. iki bileşeni (K1 ve K2) kendi atölyesinde üretmektedir. Atölyenin işçi kapasitesi yıllık 6.000
    direkt işçilik saatidir. Veriler:


    | | K1 | K2 |

    |---|---|---|

    | Yıllık ihtiyaç (adet) | 3.000 | 2.000 |

    | Kendi üretimde birim değişken maliyet (TL) | 40 | 70 |

    | Birim başına direkt işçilik saati | 2 | 3 |

    | Dış tedarik fiyatı (TL/adet) | 52 | 94 |


    Atölyedeki sabit giderler, üretim kararından bağımsızdır. Eksik kalan ihtiyaç dış tedarikçilerden karşılanacaktır.


    **İstenenler:**

    (a) Her bileşen için kendi üretiminin işçilik saati başına sağladığı tasarruf tutarını hesaplayınız. (6 puan)

    (b) Toplam yıllık satın alma ve üretim maliyetini en aza indirecek planı kurunuz ve toplam maliyeti bulunuz. (9 puan)

    (c) K1 için tedarikçinin yılda en çok 1.500 adet teslim edebildiği varsayılırsa en uygun planı ve toplam maliyeti bulunuz.
    (7 puan)

    '
  cozum: '**(a)** Satın almanın ek maliyeti: K1 için 52 − 40 = 12 TL, saat başına 12 / 2 = **6 TL**; K2 için 94 − 70 = 24
    TL, saat başına 24 / 3 = **8 TL**.


    **(b)** Kıt kaynak (saat) en yüksek tasarrufu sağlayan bileşene ayrılır: K2 (8 TL/saat) önce, K1 (6 TL/saat) sonra. K2''nin
    tamamı için 2.000 × 3 = 6.000 saat gereklidir ve kapasiteyi doldurur. Plan: K2''nin tamamı kendi atölyede üretilir, K1''in
    tamamı satın alınır.

