      sürecinde bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut
      konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'katkiB = 500000 - 380000

      kacB = 90000

      bolum_zarar = katkiB - 110000 - 60000

      etki = -(katkiB - kacB)

      kira = 45000

      etki_kira = etki + kira

      capraz = 0.10 * (900000 - 540000)

      etki_capraz = etki_kira - capraz

      kayitsiz = -etki + capraz

      sonuc = {''a'': etki, ''b'': etki_kira, ''c'': etki_capraz, ''k'': kayitsiz}

      '
