    \ stokta yoktur ve 90 TL/kg'dan satın alınacaktır.\n4. **Vasıflı işçilik:** 400 saat gerekmektedir. Vasıflı işçilerin\
    \ saat ücreti 200 TL'dir. Halen 150 saatlik boş\n   kapasite vardır; bu süre için ücret işçiler çalışmasa da ödenmektedir.\
    \ Kalan 250 saat ya (i) başka bir işten\n   çekilerek (o işte vasıflı işçilik saati başına, ücret düşüldükten sonra 120\
    \ TL katkı payı kaybedilir) ya da\n   (ii) saat başı 300 TL fazla mesai ödenerek karşılanabilir.\n5. **Vasıfsız işçilik:**\
    \ 300 saat gerekmektedir; iş için saat ücreti 120 TL olan geçici işçi çalıştırılacaktır.\n6. **Makine:** İş, şu an boşta\
    \ olan bir makinede yapılacaktır. İşe makine amortismanından 10.000 TL pay\n   düşmektedir; makinenin kullanılması 4.000\
