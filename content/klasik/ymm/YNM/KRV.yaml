  soru: 'Anadolu Fırıncılık A.Ş. yılda 20.000 kasa dondurulmuş hamur (yarı mamul) üretmektedir. Hamurun üretim maliyeti kasa
    başına 26 TL''dir ve bu maliyet gerçekleşmiştir. Hamur kasası toptancılara 30 TL''ye satılabilmektedir. Alternatif olarak
    hamur pişirilip paketlenerek kasa başına 52 TL''ye satılabilir. Pişirme ve paketleme için:

    - Kasa başına 14 TL değişken maliyet,

    - Yıllık 60.000 TL tutarında ek ekipman kirası doğacaktır.


    **İstenenler:**

    (a) Hamurun işlenip satılması ile olduğu gibi satılması seçeneklerini artımlı analizle karşılaştırınız. 26 TL''lik üretim
    maliyetinin karardaki yerini açıklayınız. (7 puan)

    (b) İşlemenin kârlı olması için gereken asgari yıllık kasa miktarını bulunuz. (6 puan)

    (c) Pişirme sırasında hamurun %10''unun fire verdiği (fire kasaları satılamamakta, ancak işlem maliyeti 20.000 kasanın
    tamamı için doğmaktadır) anlaşılırsa kararı yeniden değerlendiriniz. (8 puan)

    '
  cozum: '**(a)** Artımlı gelir = 52 − 30 = 22 TL/kasa; artımlı değişken maliyet = 14 TL/kasa; kasa başına katkı 8 TL. Net
    etki = 8 × 20.000 − 60.000 = **100.000 TL** → işlenip satılmalıdır. 26 TL''lik hamur maliyeti her iki seçenekte de aynı
    olan, gerçekleşmiş (batık) maliyettir ve ilgisizdir.


    **(b)** Kayıtsızlık: 8 × x = 60.000 → x = **7.500 kasa**.


    **(c)** Satılabilir miktar = 20.000 × %90 = 18.000 kasa. İşleme seçeneği: 18.000 × 52 = 936.000 TL gelir; ek maliyet =
    20.000 × 14 + 60.000 = 340.000 TL; net = **596.000 TL**. Hamuru olduğu gibi satmak: 20.000 × 30 = 600.000 TL. Fark = **-4.000
    TL** → fire durumunda hamur olduğu gibi satılmalıdır.

    '
