    TL**; makine değiştirmek 30.000 TL daha pahalıdır, eski makine kullanılmaya devam etmelidir.

    Defter değeri (240.000 TL) her iki seçenekte de toplam gider yazılacağı için **batık maliyettir**, ilgisizdir; yalnız
    satış tutarı (30.000 TL) ilgilidir.


    **(b)** Kayıtsızlık: 400.000 − 40.000 − 30.000 + 5x = 900.000 → x = **114.000 TL**.


    **(c)** Yeni makinenin net maliyeti = 930.000 − 5 × 20.000 = 830.000 TL. Eski makine maliyeti 900.000 TL; fark = **70.000
    TL** lehine yeni makine → makine değiştirilmelidir.

    '
