      \ 200000\nx_fark = 20000 * 15 - 200000; y_fark = 10000 * 30 - 350000\nkar = 900000 + 700000 + ngd_z - 1200000 - 200000\n\
      sonuc = {\"ngd_z\": ngd_z, \"om\": om, \"x_fiz\": x_fiz, \"y_fiz\": y_fiz, \"x_sd\": x_sd, \"y_sd\": y_sd,\n       \
