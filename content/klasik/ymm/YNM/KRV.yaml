    bilgileri:


    | Kalem | Tutar |

    |---|---|

    | Değişken işletme gideri (yakıt, lastik, bakım) | km başına 4,2 TL |

    | Şoför ücretleri | Yıllık 360.000 TL (filo elden çıkarılırsa ortadan kalkar) |

    | Araç amortismanı | Yıllık 60.000 TL (defter değeri 300.000 TL, kalan ömür 5 yıl) |


    Bir nakliye firması aynı hizmeti km başına 4,6 TL''ye sunmaktadır. Filo elden çıkarılırsa araçlar bugün 400.000 TL''ye
    satılabilecektir.


    **İstenenler:**

    (a) Araçların satışı dikkate alınmadan, kendi filo ile dış hizmet alımını ilgili maliyetler esasına göre karşılaştırınız.
    (7 puan)

    (b) Araçların satışından elde edilecek 400.000 TL''yi beş yıla eşit yayarak karara dahil ediniz; dış hizmetin yıllık toplam
    avantajını bulunuz. Defter değerinin ve amortismanın karardaki yerini açıklayınız. (7 puan)

    (c) Kendi filonun dış hizmetten ucuz olması için gereken yıllık asgari km miktarını bulunuz. (7 puan)

    '
  cozum: '**(a)** Kendi filo: 4,2 × 600.000 + 360.000 = 2.880.000 TL. Dış hizmet: 4,6 × 600.000 = 2.760.000 TL. Amortisman
    kaçınılamayan, geçmişe ait bir gider olduğundan ilgisizdir. Dış hizmet yıllık **120.000 TL** avantaj sağlar.


    **(b)** Araç satışı yıllık 400.000 / 5 = 80.000 TL artımlı gelirdir. Dış hizmetin toplam avantajı = 120.000 + 80.000 =
    **200.000 TL**. Defter değeri (300.000 TL) ve amortisman (60.000 TL) batık maliyettir; yalnız elde edilecek satış bedeli
    ilgilidir.


    **(c)** 4,2 x + 360.000 < 4,6 x → x > 360.000 / 0,4 = **900.000 km**. Yıllık 900.000 km''nin üzerinde kendi filo daha
    ucuzdur; mevcut 600.000 km bu sınırın altındadır.

    '
