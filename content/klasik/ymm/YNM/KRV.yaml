  soru: 'Doruk Metal A.Ş. A ve B ürünlerini üretmektedir. Üretimde iki kıt kaynak vardır: aylık 800 makine saati ve 700 işçilik
    saati. Veriler:


    | | A | B |

    |---|---|---|

    | Birim katkı payı (TL) | 45 | 30 |

    | Birim başına makine saati | 2 | 1 |

    | Birim başına işçilik saati | 1 | 2 |


    Her iki ürüne talep sınırsızdır; üretim miktarları kesirli olabilir. Grafik çizmeden, köşe noktaları yöntemiyle çözüm
    yapılacaktır.


    **İstenenler:**

    (a) Yalnız A ve yalnız B üretildiğinde ulaşılabilecek azami üretim miktarlarını ve katkı paylarını bulunuz. (6 puan)

    (b) Her iki kısıtın aynı anda bağlayıcı olduğu üretim planını ve toplam katkı payını hesaplayınız. (8 puan)

    (c) Makine saati kapasitesi 90 saat artırıldığında katkının ne kadar artacağını bulunuz; bu saatlerin saat başına 12 TL
    ek bedelle kiralanabilmesi hâlinde kiralamanın net kazancını hesaplayınız. (7 puan)

    '
  cozum: '**(a)** Yalnız A: makine 800 / 2 = 400, işçilik 700 / 1 = 700 → en çok 400 adet; katkı = 400 × 45 = **18.000 TL**.
    Yalnız B: makine 800, işçilik 700 / 2 = 350 → en çok 350 adet; katkı = 350 × 30 = **10.500 TL**.


    **(b)** 2A + B = 800 ve A + 2B = 700 denklem sisteminin çözümü A = **300**, B = **200**. Toplam katkı = 300 × 45 + 200
    × 30 = **19.500 TL** (köşe noktalarındaki en yüksek değerdir).


    **(c)** Makine kapasitesi 890 saat: 2A + B = 890, A + 2B = 700 → A = 360, B = 170; katkı = 21.300 TL. Artış = **1.800
    TL** (saat başına 20 TL gölge fiyat). Kiralama bedeli 90 × 12 = 1.080 TL; net kazanç = 1.800 − 1.080 = **720 TL**.

    '
  puanlama:
  - olcut: (a) tek ürüne dayalı azami üretim ve katkılar
    puan: 6
  - olcut: (b) denklem sistemi çözümü ve optimal katkı
    puan: 8
  - olcut: (c) kapasite artışının katkısı ve kiralamanın net kazancı
    puan: 7
