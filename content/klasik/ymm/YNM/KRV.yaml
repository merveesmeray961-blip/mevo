    (b) Kârı en çok artıran üretim planını kurarak işletmenin faaliyet kârını bulunuz. (8 puan)

    (c) Makine saati başına 15 TL ek bedelle yan kuruluştan en çok 3.000 saat daha kapasite kiralanabileceği öğrenilmiştir.
    Kiralama kararını değerlendirerek en yüksek faaliyet kârını bulunuz. (8 puan)

    '
  cozum: '**(a)** Kısıtlı kaynak makine saati olduğundan ölçüt birim katkı değil saat başına katkıdır:


    | | P | Q | R |

    |---|---|---|---|

    | Birim katkı (TL) | 40 | 30 | 54 |

    | Saat başına katkı (TL) | 20 | 30 | 27 |


    Öncelik: Q (30) > R (27) > P (20).


    **(b)** Plan: Q 4.000 adet (4.000 saat), R 2.000 adet (4.000 saat), kalan 2.000 saat P için → 1.000 adet.

    Katkı = 4.000 × 30 + 2.000 × 54 + 1.000 × 40 = 268.000 TL; faaliyet kârı = 268.000 − 150.000 = **118.000 TL**.


    **(c)** P''nin saat başına katkısı 20 TL, ek saat bedeli 15 TL olduğundan her saatte 5 TL net kazanç vardır. P''nin kalan
    talebi 2.000 adet = 4.000 saat olup 3.000 saatlik kiralama sınırı bu talepten küçüktür; 3.000 saatin tamamı P için kullanılır
    (1.500 adet). Net kazanç = 3.000 × (20 − 15) = 15.000 TL. Faaliyet kârı = 118.000 + 15.000 = **133.000 TL**.

    '
