  soru: 'Kuzey Süt Ürünleri A.Ş. iki bölümlüdür. Bütçe verileri:


    | | Peynir bölümü | Yoğurt bölümü |

    |---|---|---|

    | Satışlar (TL) | 2.400.000 | 1.600.000 |

    | Katkı payı oranı | %35 | %25 |

    | Bölüme doğrudan bağlı sabit giderler (TL) | 420.000 | 240.000 |


    İşletmenin her iki bölüme ortak sabit gideri 270.000 TL''dir ve hangi seçenek uygulanırsa uygulansın değişmez.


    **İstenenler:**

    (a) Her bölümün kendi doğrudan sabit giderini karşılayan başabaş satış tutarını bulunuz. (6 puan)

    (b) Satış karması bütçedeki gibi kalacak şekilde işletmenin başabaş satış tutarını bulunuz. (7 puan)

    (c) Yoğurt bölümü kapatılırsa faaliyet kârı ne kadar değişir? (7 puan)

    '
  cozum: '**(a)** Peynir: 420.000 / 0,35 = **1.200.000 TL**; yoğurt: 240.000 / 0,25 = **960.000 TL**.


    **(b)** Katkı payları: peynir 840.000, yoğurt 400.000 TL; toplam satış 4.000.000 TL; ağırlıklı katkı oranı = **0,31**
    (%31). Toplam sabit gider = 420.000 + 240.000 + 270.000 = 930.000 TL. Başabaş satış = 930.000 / 0,31 = **3.000.000 TL**.


    **(c)** Mevcut kâr = 840.000 + 400.000 − 930.000 = 310.000 TL. Yoğurt kapatılırsa kâr = 840.000 − 420.000 − 270.000 =
    150.000 TL. Değişim = **-160.000 TL**. Yoğurt bölümü kendi doğrudan giderlerini aşan 160.000 TL katkı sağladığından kapatılmamalıdır;
    ortak gider kaçınılamaz.

