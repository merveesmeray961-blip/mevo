  dogrulama:
    python: "kp = 320\nbep = 4800000 / kp\nhedef = (4800000 + 1800000 / 0.75) / kp\nkar = 25000 * kp - 4800000\nfkd = 25000\
      \ * kp / kar\nbep2 = 6800000 / 400\nkay = (6800000 - 4800000) / (400 - 320)\nsonuc = {\"bep\": bep, \"bep_tl\": bep\
      \ * 800, \"hedef\": hedef, \"kar\": kar, \"fkd\": fkd, \"artis\": 25.0,\n         \"kar_artmis\": 27500 * kp - 4800000,\
      \ \"bep2\": bep2, \"kay\": kay, \"fkd2\": 25000 * 400 / (25000 * 400 - 6800000)}\n"
