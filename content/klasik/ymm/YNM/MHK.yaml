- id: YMM-YNM-MHK-K009
  sinav: ymm
  ders: YNM
  konu: MHK
  kazanimlar:
  - başabaş noktası
  - hedef kâr
  - güvenlik marjı
  - faaliyet kaldıracı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kartal Elektronik A.Ş. tek tip bir ölçüm cihazı üretmektedir. 2026 yılı bütçe verileri:


    | Veri | Değer |

    |---|---|

    | Birim satış fiyatı | 800 TL |

    | Birim değişken maliyet | 480 TL |

    | Yıllık sabit giderler | 4.800.000 TL |

    | Planlanan satış miktarı | 25.000 adet |

    | Kurumlar vergisi oranı | %25 |


    Yönetim, üretim hattını otomasyona geçirmeyi değerlendirmektedir. Otomasyonla birim değişken maliyet 400 TL''ye

    inecek, yıllık sabit giderler 6.800.000 TL''ye çıkacaktır; satış fiyatı değişmeyecektir.


    **İstenenler:**


    (a) Mevcut yapıda başabaş noktasını miktar ve tutar olarak hesaplayınız. (4 puan)


    (b) Mevcut yapıda vergi sonrası 1.800.000 TL net kâr elde edilebilmesi için gerekli satış miktarını bulunuz. (5 puan)


    (c) Planlanan satış düzeyinde mevcut yapı için güvenlik marjını ve faaliyet kaldıracı derecesini hesaplayınız; satışlar

    %10 artarsa faaliyet kârının yüzde kaç artacağını bulunuz. (6 puan)


    (d) Otomasyonlu yapının başabaş noktasını, iki yapının kayıtsızlık (eşit kâr) noktasını ve planlanan satış düzeyinde

    otomasyonlu yapının faaliyet kaldıracı derecesini hesaplayınız; satış beklentisine göre hangi yapının seçilmesi

    gerektiğini risk yönünden değerlendiriniz. (10 puan)

    '
  cozum: "Mevcut birim katkı payı = 800 − 480 = 320 TL (katkı payı oranı %40).\n\n**(a) Başabaş noktası**\n\nQ = 4.800.000\
    \ / 320 = **15.000 adet**; tutar 15.000 × 800 = **12.000.000 TL** (veya 4.800.000 / 0,40).\n\n**(b) Hedef kâr**\n\nVergi\
    \ öncesi kâr = 1.800.000 / (1 − 0,25) = 2.400.000 TL.\nQ = (4.800.000 + 2.400.000) / 320 = **22.500 adet** (18.000.000\
    \ TL satış).\n\n**(c) Güvenlik marjı ve faaliyet kaldıracı**\n\n- Güvenlik marjı = (25.000 − 15.000) / 25.000 = **%40**\
    \ (10.000 adet; 8.000.000 TL).\n- Katkı payı = 25.000 × 320 = 8.000.000 TL; faaliyet kârı = 8.000.000 − 4.800.000 = 3.200.000\
    \ TL.\n- Faaliyet kaldıracı derecesi = 8.000.000 / 3.200.000 = **2,5** (= 1 / güvenlik marjı = 1 / 0,40).\n- Satışlar\
    \ %10 artarsa faaliyet kârı %10 × 2,5 = **%25** artar (3.200.000 → 4.000.000 TL; kontrol: 27.500 × 320 −\n  4.800.000\
    \ = 4.000.000 TL).\n\n**(d) Otomasyon**\n\nOtomasyonlu birim katkı payı = 800 − 400 = 400 TL.\n\n- Başabaş noktası = 6.800.000\
    \ / 400 = **17.000 adet** (13.600.000 TL).\n- Kayıtsızlık noktası: 320Q − 4.800.000 = 400Q − 6.800.000 → 80Q = 2.000.000\
    \ → **Q = 25.000 adet**; bu düzeyde\n  her iki yapının kârı 3.200.000 TL'dir.\n- Planlanan satışta otomasyonlu yapının\
    \ katkı payı 10.000.000 TL, kârı 3.200.000 TL; faaliyet kaldıracı derecesi\n  = 10.000.000 / 3.200.000 = **3,125**; güvenlik\
    \ marjı (25.000 − 17.000) / 25.000 = %32.\n\nDeğerlendirme: Planlanan satış düzeyi kayıtsızlık noktasına eşittir. Satışların\
    \ 25.000 adeti aşması bekleniyorsa\notomasyon (birim katkı payı yüksek) daha fazla kâr sağlar; altında kalması bekleniyorsa\
    \ mevcut yapı daha\nkârlıdır. Otomasyon sabit giderleri artırdığından başabaş noktası yükselir, güvenlik marjı daralır\
    \ ve faaliyet\nkaldıracı büyür; satış dalgalanmalarında kâr daha oynak hâle gelir. Talep belirsizse ve 25.000 adetin altına\n\
    düşme olasılığı yüksekse daha düşük riskli mevcut yapı tercih edilmelidir.\n"
  puanlama:
  - olcut: (a) Başabaş 15.000 adet ve 12.000.000 TL
    puan: 4
  - olcut: (b) Vergi öncesi kâra çevirme (2.400.000) ve 22.500 adet
    puan: 5
  - olcut: (c) Güvenlik marjı %40 ve faaliyet kaldıracı 2,5
    puan: 4
  - olcut: (c) %25 kâr artışı ve kontrolü
    puan: 2
  - olcut: (d) Otomasyonlu başabaş 17.000 adet
    puan: 2
  - olcut: (d) Kayıtsızlık noktası 25.000 adet ve eşit kâr 3.200.000 TL
    puan: 4
  - olcut: (d) Otomasyonlu faaliyet kaldıracı 3,125
    puan: 2
  - olcut: (d) Risk değerlendirmesi ve karar
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Yönetim muhasebesi, maliyet-hacim-kâr analizi
    madde: '-'
