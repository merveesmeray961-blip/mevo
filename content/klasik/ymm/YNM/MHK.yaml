  - güvenlik marjı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir işletme tek ürün üretip satmaktadır. Dönem satış fiyatı 250 TL/birim, birim değişken maliyet 170 TL ve dönem
    sabit maliyeti 180000 TL''dir. Dönem içinde 1500 birim satılmıştır; birim fiyat ve maliyetlerin ilgili faaliyet aralığında
    sabit kaldığı, üretim ile satışın eşit olduğu ve başka gelir/gider bulunmadığı kabul edilecektir.


    (a) Birim katkı payını ve başabaş satış miktarını hesaplayınız. (8 puan)

    (b) Fiilî satış miktarına göre güvenlik marjını birim ve yüzde olarak hesaplayınız. (8 puan)

    (c) Fiilî satış düzeyindeki faaliyet kârını bulunuz ve sonucu yorumlayınız. (9 puan)'
  cozum: '(a) Birim katkı payı = 250-170=80 TL. Başabaş miktarı = 180000/80=2250 birim.

    (b) Güvenlik marjı = fiilî satış - başabaş satış = 1500-2250=-750 birim. Güvenlik marjı oranı = -750/1500×100 = %-50.00.

    (c) Faaliyet kârı = satış miktarı × birim katkı payı - sabit maliyet = 1500×80-180000=-60000 TL. Sonuç pozitifse kâr,
    negatifse zarar oluşur.'
  puanlama:
  - olcut: Temel yaklaşım ve ilgili formülün doğru kurulması
    puan: 8
  - olcut: Hesaplama ve ara işlemlerin doğru yapılması
    puan: 9
  - olcut: Sonucun yorumlanması ve koşulların doğru açıklanması
    puan: 8
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
