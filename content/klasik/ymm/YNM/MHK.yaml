    (d) Kampanya sonrası karmada mevcut bütçe kârına (b şıkkı) ulaşmak için gerekli toplam satış tutarını bulunuz;

    satış karmasındaki değişimin başabaş noktasına etkisini açıklayınız. (5 puan)

    '
  cozum: "**(a) Mevcut karma**\n\nAğırlıklı KPO = 0,50 × 0,40 + 0,30 × 0,30 + 0,20 × 0,60 = 0,20 + 0,09 + 0,12 = **0,41**.\n\
    Başabaş satış tutarı = 4.100.000 / 0,41 = **10.000.000 TL**.\n\n| Grup | Başabaş satışı (TL) | Katkı payı (TL) |\n|---|---|---|\n\
    | Giyim (%50) | 5.000.000 | 2.000.000 |\n| Ayakkabı (%30) | 3.000.000 | 900.000 |\n| Aksesuar (%20) | 2.000.000 | 1.200.000\
    \ |\n| **Toplam** | **10.000.000** | **4.100.000** |\n\n**(b) Bütçe düzeyi**\n\nKatkı payı = 16.000.000 × 0,41 = 6.560.000\
    \ TL; faaliyet kârı = 6.560.000 − 4.100.000 = **2.460.000 TL**.\nGüvenlik marjı = (16.000.000 − 10.000.000) / 16.000.000\
    \ = **%37,5** (6.000.000 TL).\n\n**(c) Kampanya**\n\n- Yeni ağırlıklı KPO = 0,40 × 0,40 + 0,40 × 0,30 + 0,20 × 0,60 =\
    \ 0,16 + 0,12 + 0,12 = **0,40**.\n- Katkı payı = 18.000.000 × 0,40 = 7.200.000 TL; sabit giderler 4.700.000 TL; faaliyet\
    \ kârı = **2.500.000 TL**.\n- Kâra etki = 2.500.000 − 2.460.000 = **+40.000 TL**.\n- Yeni başabaş = 4.700.000 / 0,40 =\
    \ **11.750.000 TL**; güvenlik marjı = (18.000.000 − 11.750.000) / 18.000.000 =\n  **%34,72**.\n\nDeğerlendirme: Kampanya\
    \ kârı yalnız 40.000 TL artırmakta, ancak satışların 2.000.000 TL artması varsayımına\ndayanmaktadır. Katkı payı oranı\
    \ düşük ayakkabı grubunun payı arttığı için ağırlıklı KPO düşmüş, sabit giderler\nartmış; başabaş noktası 1.750.000 TL\
    \ yükselmiş, güvenlik marjı daralmıştır. Kampanya sonrası satışlar 17.900.000\nTL'nin altında kalırsa (bkz. d) kâr mevcut\
    \ bütçenin altına düşer. Kâr artışı küçük, risk daha yüksek olduğundan\nsatış tahmini güvenilir değilse kampanya **önerilmez**;\
    \ güvenilirse sınırlı kabul edilebilir.\n\n**(d) Gerekli satış ve karma etkisi**\n\n(S × 0,40) − 4.700.000 = 2.460.000\
    \ → S = 7.160.000 / 0,40 = **17.900.000 TL**.\n\nÇok ürünlü işletmede başabaş noktası, sabit satış karması varsayımına\
    \ dayanır. Karma katkı payı oranı düşük\nürünlere kaydıkça ağırlıklı KPO düşer ve aynı sabit gideri karşılamak için daha\
    \ fazla satış gerekir; karma yüksek\nkatkı paylı ürünlere kaydığında başabaş noktası düşer. Bu nedenle toplam satış artsa\
    \ bile kârlılık karmaya bağlı\nolarak azalabilir.\n"
