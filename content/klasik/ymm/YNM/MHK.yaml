- id: YMM-YNM-MHK-K001
  sinav: ymm
  ders: YNM
  konu: MHK
  kazanimlar:
  - çok ürünlü başabaş
  - güvenlik marjı
  - hedef kâr
  - başabaş noktası
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Ekin A.Ş. K ve L ürünlerini üretip satmaktadır. Gelecek yıla ilişkin bütçe verileri aşağıdadır:


    | | K | L |

    |---|---|---|

    | Birim satış fiyatı | 80 TL | 120 TL |

    | Birim değişken maliyet | 50 TL | 60 TL |


    - Satış karması **miktar esasına göre** sabittir: her 3 birim K''ye karşılık 1 birim L satılmaktadır.

    - Yıllık ortak sabit giderler 450.000 TL''dir.

    - Planlanan satış: 12.000 birim K ve 4.000 birim L.

    - Kurumlar vergisi oranı %20''dir. Üretilen her birim aynı yıl satılmaktadır.


    **İstenenler:**


    (a) Başabaş noktasında her üründen satılması gereken miktarı ve toplam başabaş satış hasılatını bulunuz. (6 puan)


    (b) Planlanan satış düzeyinde faaliyet kârını, güvenlik marjını (tutar ve oran) ve faaliyet kaldıracı derecesini hesaplayınız;
    satış miktarlarının karma bozulmadan %10 artması hâlinde faaliyet kârının ne olacağını kaldıraç derecesini kullanarak
    gösteriniz. (6 puan)


    (c) Vergi sonrası 192.000 TL kâr elde etmek için her üründen satılması gereken miktarı bulunuz. (5 puan)


    (d) Bir otomasyon yatırımıyla K''nin birim değişken maliyetinin 45 TL''ye düşmesi, yıllık sabit giderlerin ise 78.000
    TL artması öngörülmektedir (fiyatlar ve karma değişmeyecektir). Yeni yapıda başabaş miktarlarını ve iki yapının aynı faaliyet
    kârını verdiği satış düzeyini bulunuz; planlanan satış düzeyine göre hangi yapının seçilmesi gerektiğini gerekçesiyle
    açıklayınız. (8 puan)

    '
  cozum: '**Karma paketi (3 K + 1 L):** katkı payı = 3 × 30 + 1 × 60 = 150 TL; hasılat = 3 × 80 + 1 × 120 = 360 TL.


    **(a)** Başabaş paket sayısı = 450.000 / 150 = 3.000 paket → K: 9.000 birim, L: 3.000 birim.

    Başabaş hasılatı = 3.000 × 360 = 1.080.000 TL (kontrol: 9.000 × 80 + 3.000 × 120 = 720.000 + 360.000).


    **(b)** Planlanan satış = 4.000 paket.

    - Hasılat = 4.000 × 360 = 1.440.000 TL; katkı payı = 4.000 × 150 = 600.000 TL

    - Faaliyet kârı = 600.000 − 450.000 = 150.000 TL

    - Güvenlik marjı = 1.440.000 − 1.080.000 = 360.000 TL; oran = 360.000 / 1.440.000 = %25

    - Faaliyet kaldıracı derecesi = 600.000 / 150.000 = 4 (= 1 / %25)

    - Satış miktarları %10 artarsa kâr %40 artar: 150.000 × 1,40 = 210.000 TL (kontrol: 4.400 × 150 − 450.000 = 210.000 TL)


    **(c)** Vergi öncesi hedef = 192.000 / (1 − 0,20) = 240.000 TL.

    Paket = (450.000 + 240.000) / 150 = 4.600 paket → K: 13.800 birim, L: 4.600 birim.


    **(d)** Yeni K katkı payı = 80 − 45 = 35 TL; paket katkı payı = 3 × 35 + 60 = 165 TL; sabit gider = 528.000 TL.

    - Yeni başabaş = 528.000 / 165 = 3.200 paket → K: 9.600 birim, L: 3.200 birim

    - Kayıtsızlık noktası: 150P − 450.000 = 165P − 528.000 → 15P = 78.000 → P = 5.200 paket (K: 15.600, L: 5.200)

    - Planlanan 4.000 pakette: mevcut yapı kârı 150.000 TL; otomasyonlu yapı kârı 4.000 × 165 − 528.000 = 132.000 TL

    - Planlanan satış kayıtsızlık noktasının (5.200 paket) altında kaldığından **mevcut yapı** tercih edilmelidir. Otomasyon
    ancak satışların 5.200 paketi aşması bekleniyorsa üstündür; ayrıca başabaş noktasını yükselttiği ve kaldıracı artırdığı
    için riski de büyütür.

    '
  puanlama:
  - olcut: (a) Paket katkı payının (150 TL) bulunması
    puan: 2
  - olcut: (a) Başabaş miktarları (K 9.000, L 3.000) ve hasılat (1.080.000 TL)
    puan: 4
  - olcut: (b) Faaliyet kârı 150.000 TL ve güvenlik marjı 360.000 TL / %25
    puan: 3
  - olcut: (b) Kaldıraç derecesi 4 ve %10 artışta kârın 210.000 TL olması
    puan: 3
  - olcut: (c) Vergi öncesi hedefin 240.000 TL bulunması
    puan: 2
  - olcut: (c) Gerekli miktarlar (K 13.800, L 4.600)
    puan: 3
  - olcut: (d) Yeni başabaş miktarları (K 9.600, L 3.200)
    puan: 3
  - olcut: (d) Kayıtsızlık noktası 5.200 paket
    puan: 3
  - olcut: (d) Planlanan düzeyde kârların karşılaştırılması ve mevcut yapının gerekçeli seçimi
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "kp_k = 80 - 50\nkp_l = 120 - 60\npaket_kp = 3 * kp_k + kp_l\npaket_has = 3 * 80 + 120\nsabit = 450000\nbep =\
      \ sabit / paket_kp\nplan = 4000\nkar = plan * paket_kp - sabit\ngm = plan * paket_has - bep * paket_has\nfkd = plan\
      \ * paket_kp / kar\nhedef = (sabit + 192000 / 0.8) / paket_kp\nyeni_kp = 3 * (80 - 45) + kp_l\nyeni_sabit = sabit +\
      \ 78000\nyeni_bep = yeni_sabit / yeni_kp\nkayitsiz = (yeni_sabit - sabit) / (yeni_kp - paket_kp)\nyeni_kar = plan *\
      \ yeni_kp - yeni_sabit\nsonuc = {\"bep_K\": 3 * bep, \"bep_L\": bep, \"bep_hasilat\": bep * paket_has, \"kar\": kar,\n\
      \         \"guvenlik_marji\": gm, \"gm_orani\": gm / (plan * paket_has), \"fkd\": fkd,\n         \"kar_10_artis\": kar\
      \ * (1 + fkd * 0.10), \"hedef_K\": 3 * hedef, \"hedef_L\": hedef,\n         \"yeni_bep_K\": 3 * yeni_bep, \"yeni_bep_L\"\
      : yeni_bep, \"kayitsizlik_paket\": kayitsiz,\n         \"yeni_kar_plan\": yeni_kar}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-1.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-YNM-MHK-K002
