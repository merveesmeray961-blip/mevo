      \ for t, p in talep), 2) for v in sabit}\ntam = sum(p * max(kar(v, t) for v in sabit) for t, p in talep)\nsonuc = {\"\
      b1\": 8000, \"b2\": 13000, \"b3\": 18000, \"esik\": (420000 + 1080000) / kp, \"k20001\": 20001 * kp - 1080000,\n   \
      \      \"dusus\": 420000 - (20001 * kp - 1080000), \"e1\": bek[1], \"e2\": bek[2], \"e3\": bek[3],\n         \"tam\"\
      : round(tam, 2), \"tbbd\": round(tam - bek[2], 2)}\n"
