      \ oran\ns103 = 120000 + 1500 * 200 + 1500 * oran\nyuk = 5000 * oran\nfark = 430000 - yuk\nsonuc = {\"oran\": oran, \"\
      s101\": s101, \"s102\": s102, \"s103\": s103, \"yans\": 350000 + 1000000 + yuk,\n         \"mamul\": s101 + s102, \"\
      fark\": fark, \"d101\": fark * 80 / 400, \"d102\": fark * 200 / 400,\n         \"d103\": fark * 120 / 400, \"brut\"\
      : 600000 - s101 - fark * 80 / 400}\n"
