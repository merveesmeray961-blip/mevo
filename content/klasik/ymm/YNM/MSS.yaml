  kazanimlar:
  - safha maliyet sistemi ve fire
  - üretilen mamul maliyeti tablosu
  - THP 7/A ve 7/B maliyet hesapları
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '(M) AŞ tek safhada seri üretim yapmakta, safha maliyetini **ağırlıklı ortalama yöntemle** hesaplamakta ve Tekdüzen
    Hesap Planı''nın **7/A seçeneğini** (fiili maliyet) uygulamaktadır. Malzeme sürecin başında eklenmekte, dönüştürme maliyeti
    süreç boyunca oluşmaktadır. Fire süreç sonundaki kalite kontrolde tespit edilmektedir. KDV dikkate alınmayacaktır.


    | Miktar bilgileri | Birim |

    |---|---|

    | Dönem başı yarı mamul (malzeme %100, dönüştürme %40) | 1.000 |

    | Dönemde üretime başlanan | 9.000 |

    | Tamamlanıp mamul ambarına devredilen | 8.000 |

    | Normal fire | 400 |

    | Anormal fire | 100 |

    | Dönem sonu yarı mamul (malzeme %100, dönüştürme %60) | 1.500 |


    | Maliyet bilgileri | Malzeme (TL) | Dönüştürme (TL) |

    |---|---|---|

    | Dönem başı yarı mamul | 18.000 | 8.000 |

    | Cari dönem | 182.000 | 227.000 (Dİ 107.000; GÜG 120.000) |


    Dönem başında mamul stoku yoktur. Tamamlanan 8.000 birimin 6.000''i dönem içinde satılmıştır.


    **İstenenler**


    (a) Malzeme ve dönüştürme için eşdeğer birim sayılarını ve birim maliyetleri hesaplayınız. (8 puan)


    (b) Tamamlanan mamullerin toplam ve birim maliyetini, anormal fire maliyetini ve dönem sonu yarı mamul maliyetini hesaplayınız.
    (7 puan)


    (c) Üretilen mamul maliyeti tablosunu düzenleyerek satılan mamul maliyetini bulunuz. (5 puan)


    (d) Maliyet unsurlarının yarı mamullere aktarılması, anormal fire, mamullere devir ve satılan mamul maliyeti kayıtlarını
    yapınız. (5 puan)

    '
  cozum: '**(a)** Fire süreç sonunda tespit edildiğinden eşdeğer birime tam katılır; ağırlıklı ortalamada dönem başı yarı
    mamul maliyetleri cari maliyetlere eklenir.


    | Eşdeğer birim | Malzeme | Dönüştürme |

    |---|---|---|

    | Tamamlanan | 8.000 | 8.000 |

    | Normal fire | 400 | 400 |

    | Anormal fire | 100 | 100 |

    | Dönem sonu yarı mamul | 1.500 | 900 |

    | **Toplam** | **10.000** | **9.400** |


    | | Malzeme | Dönüştürme |

    |---|---|---|

    | Toplam maliyet | 18.000 + 182.000 = 200.000 | 8.000 + 227.000 = 235.000 |

    | Birim maliyet | 200.000 / 10.000 = **20 TL** | 235.000 / 9.400 = **25 TL** |


    Tam birim maliyeti 45 TL''dir.


    **(b)**


    - Tamamlananlar: 8.000 × 45 = 360.000 TL + normal fire payı 400 × 45 = 18.000 TL → **378.000 TL**; birim maliyet = 378.000
    / 8.000 = **47,25 TL**

    - Anormal fire: 100 × 45 = **4.500 TL** (dönem gideri; stoklara yüklenmez)

    - Dönem sonu yarı mamul: 1.500 × 20 + 900 × 25 = **52.500 TL** (fire noktasına ulaşmadığından fireden pay almaz)

    - Sağlama: 378.000 + 4.500 + 52.500 = 435.000 TL = 200.000 + 235.000


    **(c)** Üretilen mamul maliyeti tablosu


    | Kalem | TL |

    |---|---|

    | Kullanılan direkt ilk madde ve malzeme | 182.000 |

    | Direkt işçilik | 107.000 |

    | Genel üretim giderleri | 120.000 |

    | **Dönem üretim maliyeti** | **409.000** |

    | + Dönem başı yarı mamul | 26.000 |

    | − Dönem sonu yarı mamul | (52.500) |

    | − Anormal fire (dönem gideri) | (4.500) |

    | **Üretilen mamul maliyeti** | **378.000** |

    | + Dönem başı mamul | 0 |

    | − Dönem sonu mamul (2.000 × 47,25) | (94.500) |

    | **Satılan mamul maliyeti (6.000 × 47,25)** | **283.500** |


    **(d)** Kayıtlar (7/A, fiili maliyet)


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 151 Yarı Mamuller-Üretim | 409.000 | |

    | 711 Direkt İlk Madde ve Malzeme Yansıtma Hesabı | | 182.000 |

    | 721 Direkt İşçilik Giderleri Yansıtma Hesabı | | 107.000 |

    | 731 Genel Üretim Giderleri Yansıtma Hesabı | | 120.000 |

    | 689 Diğer Olağandışı Gider ve Zararlar | 4.500 | |

    | 151 Yarı Mamuller-Üretim | | 4.500 |

    | 152 Mamuller | 378.000 | |

    | 151 Yarı Mamuller-Üretim | | 378.000 |

    | 620 Satılan Mamuller Maliyeti | 283.500 | |

    | 152 Mamuller | | 283.500 |


    Dönem sonunda 710, 720 ve 730 hesapları ilgili yansıtma hesaplarıyla karşılaştırılarak kapatılır. 151''in kalanı 26.000
    + 409.000 − 4.500 − 378.000 = 52.500 TL''dir ve dönem sonu yarı mamul maliyetine eşittir.

    '
  puanlama:
  - olcut: Malzeme eşdeğer birimini 10.000 bulma (fireler dahil)
