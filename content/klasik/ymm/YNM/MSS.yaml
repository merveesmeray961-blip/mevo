  dogrulama:
    python: 'basl = 10000

      iyi = 7600

      sonu = 1200

      fire = basl - iyi - sonu

      normal = iyi * 0.10

      anormal = fire - normal

      dm_es = basl

      dn_es = iyi + fire + sonu * 0.5

      dm_br = 120000 / dm_es

      dn_br = 94000 / dn_es

      birim = dm_br + dn_br

      n_mal = normal * birim

      a_mal = anormal * birim

      iyi_br = (iyi * birim + n_mal) / iyi

      sonu_mal = sonu * dm_br + sonu * 0.5 * dn_br

      kontrol = 120000 + 94000

      sonuc = {''a'': birim, ''b'': a_mal, ''c'': iyi_br, ''d'': sonu_mal, ''k'': kontrol - iyi * birim - n_mal - a_mal -
      sonu_mal}

      '
