- id: YMM-YNM-MSS-K002
  sinav: ymm
  ders: YNM
  konu: MSS
  kazanimlar:
  - sipariş maliyet sistemi
  - genel üretim giderlerinin yüklenmesi
  - THP 7/A ve 7/B maliyet hesapları
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: "Sipariş üzerine özel makine üreten Atlas Makine A.Ş. sipariş maliyet sistemi uygulamakta ve maliyet hesaplarını\n\
    Tekdüzen Hesap Planının 7/A seçeneğiyle tutmaktadır. Genel üretim giderleri siparişlere, yıl başında belirlenen\nönceden\
    \ saptanmış oranla direkt işçilik saati esasına göre yüklenmektedir. 2026 yılı tahmini genel üretim\ngiderleri 4.800.000\
    \ TL, tahmini direkt işçilik saati 60.000 saattir.\n\nOcak 2026 bilgileri:\n\n| | S-101 | S-102 | S-103 |\n|---|---|---|---|\n\
    | 1 Ocak itibarıyla birikmiş maliyet (devreden yarı mamul) | 150.000 TL | – | – |\n| Direkt ilk madde ve malzeme | 50.000\
    \ TL | 180.000 TL | 120.000 TL |\n| Direkt işçilik saati (saat ücreti 200 TL) | 1.000 | 2.500 | 1.500 |\n\n- Ocak ayında\
    \ fiilî genel üretim giderleri 430.000 TL olarak gerçekleşmiştir.\n- S-101 ve S-102 Ocak ayında tamamlanmıştır. S-101\
    \ müşterisine 600.000 TL + %20 KDV bedelle vadeli teslim edilmiş,\n  S-102 mamul deposundadır. S-103 ay sonunda üretimdedir.\n\
    - Ücretler ay sonunda ödenecektir; fiilî genel üretim giderlerinin karşılığı çeşitli hesaplarda (ödenecek giderler,\n\
    \  birikmiş amortisman, ilk madde stoku vb.) izlenmektedir.\n\n**İstenenler:**\n\n(a) Önceden saptanmış genel üretim gideri\
    \ yükleme oranını hesaplayınız ve her siparişin Ocak sonu maliyetini\nbulunuz. (7 puan)\n\n(b) Ocak ayı işlemlerinin (maliyetlerin\
    \ toplanması, üretime yansıtılması, tamamlanan siparişlerin mamule aktarılması,\nsatış ve satılan mamul maliyeti) yevmiye\
    \ kayıtlarını THP 7/A hesaplarıyla yapınız. (10 puan)\n\n(c) Eksik veya fazla yüklenen genel üretim giderini bulunuz;\
    \ bu farkın (i) önemsiz olması ve (ii) önemli olup ilgili\nhesaplara Ocak ayında yüklenen genel üretim giderleri oranında\
    \ dağıtılması hâlindeki kapanış kayıtlarını\ngösteriniz. (6 puan)\n\n(d) Fark (ii) yöntemiyle dağıtıldığında S-101'in\
    \ brüt kârını hesaplayınız. (2 puan)\n"
  cozum: '**(a) Yükleme oranı ve sipariş maliyetleri**


    Önceden saptanmış oran = 4.800.000 / 60.000 = **80 TL/direkt işçilik saati**.


    | Kalem | S-101 | S-102 | S-103 | Toplam |

    |---|---|---|---|---|

    | Devreden maliyet | 150.000 | – | – | 150.000 |

    | Direkt ilk madde ve malzeme | 50.000 | 180.000 | 120.000 | 350.000 |

    | Direkt işçilik (saat × 200) | 200.000 | 500.000 | 300.000 | 1.000.000 |

    | Yüklenen GÜG (saat × 80) | 80.000 | 200.000 | 120.000 | 400.000 |

    | **Sipariş maliyeti** | **480.000** | **880.000** | **540.000** | **1.900.000** |


    **(b) Yevmiye kayıtları**


    | Açıklama | Hesap | Borç | Alacak |

    |---|---|---|---|

    | Malzeme kullanımı | 710 Direkt İlkmadde ve Malzeme Giderleri | 350.000 | |

    | | 150 İlk Madde ve Malzeme | | 350.000 |

    | Direkt işçilik tahakkuku | 720 Direkt İşçilik Giderleri | 1.000.000 | |

    | | 335 Personele Borçlar (ve ilgili kesinti hesapları) | | 1.000.000 |

    | Fiilî GÜG | 730 Genel Üretim Giderleri | 430.000 | |

    | | Çeşitli hesaplar (381, 257, 150 vb.) | | 430.000 |

    | Üretime yansıtma | 151 Yarı Mamuller – Üretim | 1.750.000 | |

    | | 711 Direkt İlkmadde ve Malzeme Yansıtma Hesabı | | 350.000 |

    | | 721 Direkt İşçilik Giderleri Yansıtma Hesabı | | 1.000.000 |

    | | 731 Genel Üretim Giderleri Yansıtma Hesabı (yüklenen) | | 400.000 |

    | Tamamlanan siparişler | 152 Mamuller | 1.360.000 | |

    | | 151 Yarı Mamuller – Üretim (480.000 + 880.000) | | 1.360.000 |

    | Satış | 120 Alıcılar | 720.000 | |

    | | 600 Yurt İçi Satışlar | | 600.000 |

    | | 391 Hesaplanan KDV | | 120.000 |

    | Satılan mamul maliyeti | 620 Satılan Mamuller Maliyeti | 480.000 | |

    | | 152 Mamuller | | 480.000 |


    Dönem sonunda yansıtma hesapları gider hesaplarıyla kapatılır: 711/710 350.000; 721/720 1.000.000; 731/730 400.000.

    Kapanıştan sonra 730''da 30.000 TL borç bakiyesi kalır. 151 hesabında S-103''ün maliyeti olarak 540.000 TL bulunur.


    **(c) Eksik yüklenen GÜG**


    Fiilî 430.000 − yüklenen 400.000 = **30.000 TL eksik yükleme**.


    (i) Önemsizse tamamı satılan mamul maliyetine aktarılır: 620 borç 30.000 / 730 alacak 30.000.


    (ii) Önemliyse Ocak''ta yüklenen GÜG oranında (S-101 80.000, S-102 200.000, S-103 120.000; toplam 400.000) dağıtılır:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 620 Satılan Mamuller Maliyeti (S-101: 30.000 × 80/400) | 6.000 | |

    | 152 Mamuller (S-102: 30.000 × 200/400) | 15.000 | |

    | 151 Yarı Mamuller – Üretim (S-103: 30.000 × 120/400) | 9.000 | |

    | 730 Genel Üretim Giderleri | | 30.000 |


    **(d) S-101 brüt kârı**


    600.000 − (480.000 + 6.000) = **114.000 TL**.

    '
