  soru: 'Fidan Plastik A.Ş. tek safhalı seri üretimde safha maliyetini ağırlıklı ortalama yöntemiyle hesaplamaktadır. İlk
    madde başlangıçta %100 verilir, dönüşüm maliyeti eşit olarak oluşur. Kalite kontrol safhanın sonunda yapılır; fireler
    bu aşamada tespit edilir ve normal fire, kalite kontrolden geçen iyi birimlerin %10''u kadardır. Fire ürünlerin satış
    değeri yoktur.


    Dönemde 10.000 birim üretime başlanmış, 7.600 birim iyi mamul olarak tamamlanmış, 1.200 birim fire olmuş, 1.200 birim
    dönem sonu yarı mamul (dönüşüm %50 tamamlanmış) kalmıştır. Dönem başı yarı mamul yoktur. Dönem içi ilk madde maliyeti
    120.000 TL, dönüşüm maliyeti 94.000 TL''dir.


    **İstenenler:**

    (a) Eşdeğer birimleri ve fire dâhil birim maliyeti hesaplayınız. (6 puan)

    (b) Normal ve anormal fire miktarlarını ve maliyetlerini bulunuz; anormal fire maliyetinin muhasebe işlemini açıklayınız.
    (7 puan)

    (c) İyi mamullerin birim maliyetini ve dönem sonu yarı mamulün maliyetini bulunuz; mutabakat yapınız. (7 puan)

    '
  cozum: '**(a)** İlk madde eşdeğer birimi = 10.000 (fireler dâhil); dönüşüm eşdeğer birimi = 7.600 + 1.200 (fire) + 1.200
    × 0,50 = **9.400**. İlk madde birimi = 120.000 / 10.000 = 12 TL; dönüşüm birimi = 94.000 / 9.400 = 10 TL; birim maliyet
    = **22 TL**.


    **(b)** Normal fire = 7.600 × %10 = **760 birim** (16.720 TL, iyi mamullere yüklenir). Anormal fire = 1.200 − 760 = **440
    birim** = 440 × 22 = **9.680 TL**. Normalin üstünde gerçekleşen fire ve kayıplar stok maliyetine eklenmez; gerçekleştiği
    dönemde gider olarak yansıtılır.


    **(c)** İyi mamul birim maliyeti = (7.600 × 22 + 16.720) / 7.600 = **24,20 TL**. Dönem sonu yarı mamul = 1.200 × 12 +
    600 × 10 = **20.400 TL**. Mutabakat: 214.000 TL = iyi mamul (7.600 × 22 + 16.720) + anormal fire 9.680 + yarı mamul 20.400.

    '
  puanlama:
  - olcut: (a) eşdeğer birim ve birim maliyet
    puan: 6
  - olcut: (b) normal ve anormal fire ile muhasebe işlemi
