- id: YMM-YNM-MSS-K003
  sinav: ymm
  ders: YNM
  konu: MSS
  kazanimlar:
  - safha maliyet sistemi ve fire
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Pınar Ambalaj A.Ş. tek safhada seri üretim yapmakta ve safha maliyetlerini **ilk giren ilk çıkar (FIFO)**

    yöntemiyle hesaplamaktadır. Direkt ilk madde ve malzeme safha başında tamamen kullanılmakta, dönüştürme maliyetleri

    (direkt işçilik ve genel üretim giderleri) safha boyunca düzenli olarak oluşmaktadır. Kalite kontrol safha sonunda

    (işlemlerin %100''ü tamamlandığında) yapılmakta; kontrolden geçen sağlam mamullerin %10''u kadar fire normal

    kabul edilmektedir.


    Kasım 2026 verileri:


    | Kalem | Miktar | Tamamlanma derecesi (dönüştürme) | Maliyet (TL) |

    |---|---|---|---|

    | Dönem başı yarı mamul | 2.000 birim | %40 | Malzeme 40.000; dönüştürme 18.000 |

    | Döneme başlanan | 18.000 birim | | |

    | Tamamlanıp mamul deposuna gönderilen | 15.000 birim | | |

    | Dönem sonu yarı mamul | 3.000 birim | %60 | |

    | Fire (kontrolde ayrılan) | 2.000 birim | %100 | |

    | Dönem maliyetleri | | | Malzeme 378.000; dönüştürme 540.000 |


    Fire birimlerin hurda değeri yoktur.


    **İstenenler:**


    (a) FIFO yöntemine göre malzeme ve dönüştürme için eşdeğer birim miktarlarını ve dönem birim maliyetlerini

    hesaplayınız. (7 puan)


    (b) Normal ve anormal fire miktarını belirleyiniz; normal ve anormal fire maliyetlerini, tamamlanan mamullerin

    maliyetini ve dönem sonu yarı mamul maliyetini hesaplayarak maliyet mutabakatını yapınız. (11 puan)


    (c) Tamamlanan mamullerin mamul deposuna aktarılması ile anormal firenin gider yazılmasının yevmiye kayıtlarını

    THP 7/A hesaplarıyla yapınız. (4 puan)


    (d) Normal firenin dönem sonu yarı mamullere neden yüklenmediğini ve FIFO ile ağırlıklı ortalama yöntemleri

    arasındaki temel farkı açıklayınız. (3 puan)

    '
  cozum: "**(a) Eşdeğer birimler (FIFO)**\n\nDöneme başlanıp tamamlanan = 15.000 − 2.000 = 13.000 birim.\n\n| Kalem | Malzeme\
    \ | Dönüştürme |\n|---|---|---|\n| Dönem başı yarı mamulün tamamlanması (2.000 × %0 / %60) | 0 | 1.200 |\n| Döneme başlanıp\
    \ tamamlanan | 13.000 | 13.000 |\n| Dönem sonu yarı mamul (3.000 × %100 / %60) | 3.000 | 1.800 |\n| Fire (2.000 × %100)\
    \ | 2.000 | 2.000 |\n| **Eşdeğer birim** | **18.000** | **18.000** |\n| Dönem maliyeti (TL) | 378.000 | 540.000 |\n| **Birim\
    \ maliyet (TL)** | **21** | **30** |\n\nToplam dönem birim maliyeti 51 TL'dir.\n\n**(b) Fire ve maliyet dağıtımı**\n\n\
    - Normal fire = 15.000 × %10 = **1.500 birim**; anormal fire = 2.000 − 1.500 = **500 birim**.\n- Normal fire maliyeti\
    \ = 1.500 × 51 = **76.500 TL**; kontrol safha sonunda yapıldığından yalnız kontrolden geçen\n  (tamamlanan) mamullere\
    \ yüklenir.\n- Anormal fire maliyeti = 500 × 51 = **25.500 TL** (dönem gideri).\n\n| Kalem | TL |\n|---|---|\n| Dönem\
    \ başı yarı mamulün önceki dönem maliyeti | 58.000 |\n| Dönem başı yarı mamulün tamamlanması: 1.200 × 30 | 36.000 |\n\
    | Döneme başlanıp tamamlanan: 13.000 × 51 | 663.000 |\n| Normal fire payı | 76.500 |\n| **Tamamlanan 15.000 birimin maliyeti**\
    \ | **833.500** |\n| Dönem sonu yarı mamul: 3.000 × 21 + 1.800 × 30 | 117.000 |\n| Anormal fire | 25.500 |\n| **Toplam**\
    \ | **976.000** |\n\nMutabakat: dönem başı 58.000 + dönem maliyetleri (378.000 + 540.000) = 976.000 TL. Tamamlanan mamulün\
    \ birim\nmaliyeti 833.500 / 15.000 = 55,57 TL'dir.\n\n**(c) Yevmiye kayıtları**\n\n| Hesap | Borç | Alacak |\n|---|---|---|\n\
    | 152 Mamuller | 833.500 | |\n| 689 Diğer Olağandışı Gider ve Zararlar (anormal fire) | 25.500 | |\n| 151 Yarı Mamuller\
    \ – Üretim | | 859.000 |\n\nKayıt sonrası 151 hesabında dönem sonu yarı mamul maliyeti olarak 117.000 TL kalır.\n\n**(d)\
    \ Açıklamalar**\n\nDönem sonu yarı mamuller (%60 tamamlanmış) henüz kontrol noktasına (%100) ulaşmamıştır; firenin ortaya\
