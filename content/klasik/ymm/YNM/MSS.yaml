  dogrulama:
    python: 'eb_m = 8000 + 400 + 100 + 1500

      eb_d = 8000 + 400 + 100 + 1500 * 0.6

      bm = (18000 + 182000) / eb_m

      bd = (8000 + 227000) / eb_d

      tamamlanan = (8000 + 400) * (bm + bd)

      anormal = 100 * (bm + bd)

      ym_sonu = 1500 * bm + 1500 * 0.6 * bd

      dum = 182000 + 107000 + 120000

      birim = tamamlanan / 8000

      smm = 6000 * birim

      sonuc = {''eb_malzeme'': eb_m, ''eb_donusturme'': eb_d, ''birim_malzeme'': bm, ''birim_donusturme'': bd, ''tamamlanan'':
      tamamlanan, ''birim_mamul'': birim, ''anormal_fire'': anormal, ''ym_sonu'': ym_sonu, ''donem_uretim_maliyeti'': dum,
      ''smm'': smm, ''mamul_sonu'': 2000 * birim}'
