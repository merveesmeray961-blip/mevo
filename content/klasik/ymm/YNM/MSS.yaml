- id: YMM-YNM-MSS-K011
  sinav: ymm
  ders: YNM
  konu: MSS
  kazanimlar:
  - sipariş maliyet sistemi
  - genel üretim giderlerinin yüklenmesi
  zorluk: 3
  puan: 20
  sure_dk: 28
  soru: 'Dumlupınar Makine İmalat A.Ş., müşteri siparişlerini sipariş maliyet sistemiyle izlemekte ve fiyatı maliyetin %30
    üzerinde belirlemektedir. Genel üretim giderleri, direkt işçilik TL''si üzerinden yıllık bütçe oranıyla yüklenmektedir:
    bütçelenen genel üretim gideri 900.000 TL, bütçelenen direkt işçilik gideri 600.000 TL''dir.


    Yeni bir sipariş (S-210) için tahmini verilerin: direkt ilk madde 120.000 TL; direkt işçilik 800 saat × 50 TL/saat.


    **İstenenler:**

    (a) Genel üretim gideri yükleme oranını, S-210 siparişinin tahmini maliyetini ve teklif edilecek fiyatı hesaplayınız.
    (7 puan)

    (b) Sipariş tamamlandığında yılın gerçek genel üretim gideri oranının direkt işçilik giderinin %160''ı olduğu anlaşılırsa
    siparişin gerçek maliyetini ve (a)''daki fiyat üzerinden gerçekleşen kârı hesaplayınız. (7 puan)

    (c) Gerçek maliyet üzerinden %30 kâr elde edilmek istenseydi teklif edilmesi gereken fiyatı bulunuz ve sipariş maliyet
    sistemlerinde önceden belirlenmiş yükleme oranlarının kullanılma nedenini açıklayınız. (6 puan)

    '
  cozum: '**(a)** Yükleme oranı = 900.000 / 600.000 = **1,50** (direkt işçilik giderinin %150''si). Direkt işçilik = 800 ×
    50 = 40.000 TL; yüklenen GÜG = 40.000 × 1,5 = 60.000 TL; sipariş maliyeti = 120.000 + 40.000 + 60.000 = **220.000 TL**.
    Teklif edilecek fiyat = 220.000 × 1,30 = **286.000 TL**.


    **(b)** Gerçek oran %160 ise GÜG = 40.000 × 1,60 = 64.000 TL; gerçek maliyet = **224.000 TL**. Gerçekleşen kâr = 286.000
    − 224.000 = **62.000 TL** (maliyetin %27,68''i).


    **(c)** Gerçek maliyetin %30 üzerinden fiyat = 224.000 × 1,30 = **291.200 TL**. Sipariş tamamlandığında gerçek giderler
    henüz belli olmadığından ve her siparişin zamanında maliyetlenip fiyatlanması gerektiğinden önceden belirlenmiş yükleme
    oranı kullanılır; dönem sonunda oluşan eksik/fazla yükleme farkı düzeltilir.

    '
  puanlama:
  - olcut: (a) yükleme oranı, sipariş maliyeti ve fiyat
    puan: 7
  - olcut: (b) gerçek maliyet ve kâr
    puan: 7
  - olcut: (c) yeni fiyat ve oran gerekçesi
    puan: 6
