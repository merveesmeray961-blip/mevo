    | İlk madde ve malzeme stoku (31 Aralık) | 500.000 |

    | Üretimde kullanılan malzemenin endirekt kısmı (vida, yapıştırıcı, cila) | 200.000 |

    | Direkt işçilik | 1.800.000 |

    | Endirekt işçilik (ustabaşı, bakım personeli) | 400.000 |

    | Fabrika enerji giderleri | 350.000 |

    | Fabrika binası ve makine amortismanı | 450.000 |

    | Fabrika kirası | 150.000 |

    | Yarı mamul stoku: 1 Ocak / 31 Aralık | 300.000 / 450.000 |

    | Mamul stoku: 1 Ocak / 31 Aralık | 600.000 / 800.000 |

    | Net satışlar | 8.000.000 |

    | Pazarlama, satış ve dağıtım giderleri | 900.000 |

    | Genel yönetim giderleri | 600.000 |


    Yıl içinde 54.000 adet mamul üretilmiştir. Genel yönetim giderlerinden mamul maliyetine pay verilmemektedir.


    **İstenenler:**


    (a) Üretilen mamul maliyeti tablosunu düzenleyiniz; dönem üretim maliyetini, üretilen mamul maliyetini ve birim

    maliyeti bulunuz. (10 puan)


    (b) Satılan mamul maliyeti tablosunu ve faaliyet kârına kadar gelir tablosunu düzenleyiniz. (6 puan)


    (c) Genel üretim giderlerinin mamul maliyetine dahil edilmesinin VUK md. 275 ve TMS 2 bakımından dayanağını

    açıklayınız. (4 puan)


    (d) İşletme Tekdüzen Hesap Planının 7/B seçeneğini uygulasaydı giderlerin hangi esasa göre ve hangi hesap grubunda

    izleneceğini açıklayınız; 7/B''yi seçen işletmelerin gelir tablosuna ek olarak sunmak zorunda olduğu bilgiyi

    belirtiniz. (5 puan)

    '
  cozum: '**(a) Üretilen mamul maliyeti tablosu**


    | Kalem | TL | TL |

    |---|---|---|

    | Dönem başı ilk madde ve malzeme | 400.000 | |

    | + Net alışlar (2.600.000 − 100.000) | 2.500.000 | |

    | − Dönem sonu ilk madde ve malzeme | (500.000) | |

    | = Kullanılan ilk madde ve malzeme | 2.400.000 | |

    | − Endirekt malzeme (GÜG''e) | (200.000) | |

    | **Direkt ilk madde ve malzeme giderleri** | | **2.200.000** |

    | **Direkt işçilik giderleri** | | **1.800.000** |

    | Genel üretim giderleri: endirekt malzeme 200.000; endirekt işçilik 400.000; enerji 350.000; amortisman 450.000; kira
    150.000 | | **1.550.000** |

    | **Dönem üretim maliyeti** | | **5.550.000** |

    | + Dönem başı yarı mamul | | 300.000 |

    | − Dönem sonu yarı mamul | | (450.000) |

    | **Üretilen mamul maliyeti** | | **5.400.000** |


    Birim maliyet = 5.400.000 / 54.000 = **100 TL**.


    **(b) Satılan mamul maliyeti ve gelir tablosu**


    | Kalem | TL |

    |---|---|

    | Dönem başı mamul stoku | 600.000 |

    | + Üretilen mamul maliyeti | 5.400.000 |

    | − Dönem sonu mamul stoku | (800.000) |

    | **Satılan mamul maliyeti** | **5.200.000** |


    | Kalem | TL |

    |---|---|

    | Net satışlar | 8.000.000 |

    | Satışların maliyeti | (5.200.000) |

    | **Brüt satış kârı** | **2.800.000** |

    | Pazarlama, satış ve dağıtım giderleri | (900.000) |

    | Genel yönetim giderleri | (600.000) |

    | **Faaliyet kârı** | **1.300.000** |


    **(c) Dayanak**


    VUK md. 275''e göre imal edilen emtianın maliyet bedeli ham madde bedeli, mamule isabet eden işçilik ve genel imal

    giderlerinden mamule düşen hisseyi içerir; genel idare giderlerinden pay verilmesi ihtiyaridir (bu işletme pay

    vermemektedir). TMS 2''ye göre stokların maliyeti dönüştürme maliyetlerini kapsar; sabit genel üretim giderleri

    normal kapasite esas alınarak dağıtılır (par. 13). Bu nedenle enerji, amortisman, kira ve endirekt işçilik gibi

    fabrika giderleri dönem gideri yazılmaz, üretim maliyetine ve stoklara yüklenir.


    **(d) 7/B seçeneği**


    7/B''de giderler fonksiyon esasına göre değil **çeşit esasına** göre 79 Gider Çeşitleri grubunda izlenir: 790 İlk

    Madde ve Malzeme Giderleri (2.400.000), 791 İşçi Ücret ve Giderleri (direkt ve endirekt işçilik), 793 Dışarıdan

    Sağlanan Fayda ve Hizmetler (enerji, kira), 796 Amortismanlar ve Tükenme Payları vb.; dönem sonunda 798 Gider

    Çeşitleri Yansıtma Hesabı aracılığıyla ilgili bilanço ve gelir tablosu hesaplarına aktarılır. 7/B seçeneğini

    uygulayan işletmeler, gelir tablosuna ek olarak giderlerin fonksiyon esasına göre dağılımını (satışların maliyeti,

    araştırma-geliştirme, pazarlama-satış-dağıtım ve genel yönetim giderleri) gösteren bilgiyi sunmak zorundadır.

