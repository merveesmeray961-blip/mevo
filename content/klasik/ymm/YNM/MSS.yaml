    (b) Tamamlanan mamullerin ve dönem sonu yarı mamulün maliyetini bulunuz. (6 puan)

    (c) 2. safha maliyetlerinin 151 ve 152 hesaplarına kaydedilmesi ile ilgili yevmiye kaydını yapınız ve 152 hesabına aktarılan
    tutarı gösteriniz. (7 puan)

    '
  cozum: '**(a)** Devralınan maliyet birimi = 150.000 / 10.000 = **15 TL**. Ek malzeme eşdeğer birimi = 8.000; birim = 24.000
