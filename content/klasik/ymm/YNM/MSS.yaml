  soru: 'Kaya Mobilya A.Ş.''nin 2026 yılına ait maliyet ve stok bilgileri aşağıdadır (TL):


    | Kalem | Tutar |

    |---|---|

    | İlk madde ve malzeme stoku (1 Ocak) | 400.000 |

    | İlk madde ve malzeme alışları | 2.600.000 |

