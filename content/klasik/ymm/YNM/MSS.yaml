    |---|---|---|

    | Tamamlanan | 8.000 | 8.000 |

    | Normal fire | 400 | 400 |

    | Anormal fire | 100 | 100 |

    | Dönem sonu yarı mamul | 1.500 | 900 |

    | **Toplam** | **10.000** | **9.400** |


    | | Malzeme | Dönüştürme |

    |---|---|---|

    | Toplam maliyet | 18.000 + 182.000 = 200.000 | 8.000 + 227.000 = 235.000 |

    | Birim maliyet | 200.000 / 10.000 = **20 TL** | 235.000 / 9.400 = **25 TL** |


    Tam birim maliyeti 45 TL''dir.


    **(b)**


    - Tamamlananlar: 8.000 × 45 = 360.000 TL + normal fire payı 400 × 45 = 18.000 TL → **378.000 TL**; birim maliyet = 378.000
    / 8.000 = **47,25 TL**

    - Anormal fire: 100 × 45 = **4.500 TL** (dönem gideri; stoklara yüklenmez)

    - Dönem sonu yarı mamul: 1.500 × 20 + 900 × 25 = **52.500 TL** (fire noktasına ulaşmadığından fireden pay almaz)

    - Sağlama: 378.000 + 4.500 + 52.500 = 435.000 TL = 200.000 + 235.000


    **(c)** Üretilen mamul maliyeti tablosu


