    puan: 2
  - olcut: Dönem başı maliyetleri ekleyerek birim maliyetleri 20 TL ve 25 TL bulma
    puan: 4
  - olcut: Tamamlananlara normal fire payını yükleyerek 378.000 TL ve 47,25 TL bulma
    puan: 3
  - olcut: Anormal fireyi 4.500 TL bulma ve dönem gideri olarak ayırma
    puan: 2
  - olcut: Dönem sonu yarı mamulü 52.500 TL bulma
    puan: 2
  - olcut: Üretilen mamul maliyeti tablosu (409.000 → 378.000)
    puan: 3
  - olcut: Satılan mamul maliyetini 283.500 TL bulma
    puan: 2
  - olcut: 151 / 711-721-731 ve 689 / 151 kayıtları
    puan: 3
  - olcut: 152 / 151 ve 620 / 152 kayıtları
    puan: 2
