    birim maliyeti = 15 + 3 + 10 = **28 TL**.


    **(b)** Tamamlanan = 8.000 × 28 = **224.000 TL**. Dönem sonu yarı mamul = 2.000 × 15 + 1.000 × 10 = **40.000 TL**. Mutabakat:
    264.000 = 224.000 + 40.000.


    **(c)**


    | Kayıt | Borç | Alacak |

    |---|---|---|

