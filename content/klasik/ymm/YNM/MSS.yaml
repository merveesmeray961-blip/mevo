  soru: '(M) AŞ tek safhada seri üretim yapmakta, safha maliyetini **ağırlıklı ortalama yöntemle** hesaplamakta ve Tekdüzen
    Hesap Planı''nın **7/A seçeneğini** (fiili maliyet) uygulamaktadır. Malzeme sürecin başında eklenmekte, dönüştürme maliyeti
    süreç boyunca oluşmaktadır. Fire süreç sonundaki kalite kontrolde tespit edilmektedir. KDV dikkate alınmayacaktır.


    | Miktar bilgileri | Birim |

    |---|---|

    | Dönem başı yarı mamul (malzeme %100, dönüştürme %40) | 1.000 |

    | Dönemde üretime başlanan | 9.000 |

    | Tamamlanıp mamul ambarına devredilen | 8.000 |

    | Normal fire | 400 |

    | Anormal fire | 100 |

    | Dönem sonu yarı mamul (malzeme %100, dönüştürme %60) | 1.500 |


    | Maliyet bilgileri | Malzeme (TL) | Dönüştürme (TL) |

    |---|---|---|

    | Dönem başı yarı mamul | 18.000 | 8.000 |

    | Cari dönem | 182.000 | 227.000 (Dİ 107.000; GÜG 120.000) |


    Dönem başında mamul stoku yoktur. Tamamlanan 8.000 birimin 6.000''i dönem içinde satılmıştır.


    **İstenenler**


    (a) Malzeme ve dönüştürme için eşdeğer birim sayılarını ve birim maliyetleri hesaplayınız. (8 puan)


    (b) Tamamlanan mamullerin toplam ve birim maliyetini, anormal fire maliyetini ve dönem sonu yarı mamul maliyetini hesaplayınız.
    (7 puan)


    (c) Üretilen mamul maliyeti tablosunu düzenleyerek satılan mamul maliyetini bulunuz. (5 puan)


    (d) Maliyet unsurlarının yarı mamullere aktarılması, anormal fire, mamullere devir ve satılan mamul maliyeti kayıtlarını
    yapınız. (5 puan)

    '
  cozum: '**(a)** Fire süreç sonunda tespit edildiğinden eşdeğer birime tam katılır; ağırlıklı ortalamada dönem başı yarı
    mamul maliyetleri cari maliyetlere eklenir.


