- id: YMM-YNM-PRF-K001
  sinav: ymm
  ders: YNM
  konu: PRF
  kazanimlar:
  - yatırımın karlılığı ve artık kâr
  - işletme içi transfer fiyatlaması
  - sorumluluk merkezleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Merkez Holding''in yatırım merkezi olarak örgütlenen iki bölümü vardır: Motor bölümü ve Montaj bölümü. Holdingin
    asgari getiri oranı %12''dir.


    Motor bölümüne ilişkin yıllık veriler:

    - Üretim kapasitesi: 50.000 birim

    - Dış piyasaya satış: 40.000 birim, birim fiyat 200 TL (dış talep en çok 40.000 birimdir)

    - Birim değişken maliyet: 120 TL (iç transferde de aynıdır; dış satışa özgü ek gider yoktur)

    - Sabit giderler: 2.000.000 TL (kapasite içinde değişmez)

    - Ortalama faaliyet varlıkları: 8.000.000 TL


    Montaj bölümü yılda 20.000 birim motora ihtiyaç duymaktadır. Bu motorları dış tedarikçiden birimi 180 TL''ye alabilmektedir.
    Montaj bölümü siparişin tamamının tek tedarikçiden karşılanmasını şart koşmaktadır. Motor bölümü 20.000 birimi üstlenirse,
    kapasite sınırı nedeniyle dış satışlarını 30.000 birime indirmek zorunda kalacaktır.


    **İstenenler:**


    (a) Motor bölümünün mevcut durumdaki (iç transfer yokken) faaliyet kârını, yatırım kârlılığını (ROI) ve artık kârını hesaplayınız.
    (5 puan)


    (b) Motor bölümünün kabul edebileceği en düşük ve Montaj bölümünün ödemeye razı olacağı en yüksek birim transfer fiyatını
    bulunuz. (7 puan)


    (c) İç transferin, dış tedarikçiden alıma göre holding bütününün kârını nasıl etkilediğini hesaplayınız. (6 puan)


    (d) Transfer fiyatı birimi 170 TL olarak belirlenirse Motor bölümünün yeni faaliyet kârını, ROI''sini ve artık kârını
    hesaplayınız; holding kârındaki değişimin bölümler arasında nasıl paylaşıldığını gösteriniz. (7 puan)

    '
  cozum: '**(a) Mevcut durum**

    - Faaliyet kârı = 40.000 × (200 − 120) − 2.000.000 = 3.200.000 − 2.000.000 = **1.200.000 TL**

    - ROI = 1.200.000 / 8.000.000 = **%15**

    - Artık kâr = 1.200.000 − 8.000.000 × %12 = 1.200.000 − 960.000 = **240.000 TL**


    **(b) Transfer fiyatı aralığı**

    - Boş kapasite = 50.000 − 40.000 = 10.000 birim; dış satıştan vazgeçilecek miktar = 20.000 − 10.000 = 10.000 birim

    - Vazgeçilen katkı payı = 10.000 × (200 − 120) = 800.000 TL

    - En düşük transfer fiyatı = değişken maliyet + birim fırsat maliyeti = 120 + 800.000 / 20.000 = 120 + 40 = **160 TL**

    - En yüksek transfer fiyatı = Montaj''ın dış alım fiyatı = **180 TL**

    - Aralık 160–180 TL olduğundan karşılıklı kabul edilebilir bir fiyat vardır.


    **(c) Holding bütününe etki**

    - İç transferin holdinge maliyeti = 20.000 × 120 + 800.000 = 3.200.000 TL (birim 160 TL)

    - Dış alım maliyeti = 20.000 × 180 = 3.600.000 TL

    - İç transfer holding kârını **400.000 TL artırır**. Transfer fiyatı bu tutarı değiştirmez; yalnız bölümler arasındaki
    paylaşımı belirler.


    **(d) Transfer fiyatı 170 TL**

    - Motor katkı payı: dış satış 30.000 × 80 = 2.400.000 TL + iç transfer 20.000 × (170 − 120) = 1.000.000 TL = 3.400.000
    TL

    - Motor faaliyet kârı = 3.400.000 − 2.000.000 = **1.400.000 TL** (200.000 TL artış)

    - ROI = 1.400.000 / 8.000.000 = **%17,5**; artık kâr = 1.400.000 − 960.000 = **440.000 TL**

    - Montaj bölümünün tasarrufu = (180 − 170) × 20.000 = **200.000 TL**

    - Paylaşım: Motor +200.000 TL + Montaj +200.000 TL = holding +400.000 TL; (c) ile tutarlıdır.

    '
  puanlama:
  - olcut: (a) Faaliyet kârı 1.200.000 TL ve ROI %15
    puan: 3
  - olcut: (a) Artık kâr 240.000 TL
    puan: 2
  - olcut: (b) Boş kapasite ve vazgeçilen dış satış miktarının belirlenmesi
    puan: 2
  - olcut: (b) En düşük transfer fiyatı 160 TL (fırsat maliyetinin 20.000 birime yayılması)
    puan: 3
  - olcut: (b) En yüksek transfer fiyatı 180 TL
    puan: 2
  - olcut: (c) İç transferin holdinge maliyeti 3.200.000 TL ile dış alım 3.600.000 TL karşılaştırması
    puan: 4
  - olcut: (c) Holding kârında 400.000 TL artış ve transfer fiyatının nötr olduğunun belirtilmesi
    puan: 2
  - olcut: (d) Motor kârı 1.400.000 TL, ROI %17,5, artık kâr 440.000 TL
    puan: 4
  - olcut: (d) Montaj tasarrufu 200.000 TL ve paylaşımın mutabakatı
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — Performans ölçümü ve transfer fiyatı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "kar = 40000 * (200 - 120) - 2000000\nroi = kar / 8000000\nak = kar - 8000000 * 0.12\nbos = 50000 - 40000\nvazgecilen\
      \ = 20000 - bos\nfirsat = vazgecilen * (200 - 120)\nen_dusuk = 120 + firsat / 20000\nic_maliyet = 20000 * 120 + firsat\n\
      dis_maliyet = 20000 * 180\nyeni_kar = 30000 * (200 - 120) + 20000 * (170 - 120) - 2000000\nsonuc = {\"faaliyet_kari\"\
      : kar, \"roi\": roi * 100, \"artik_kar\": ak, \"en_dusuk_tf\": en_dusuk, \"en_yuksek_tf\": 180,\n         \"holding_etkisi\"\
      : dis_maliyet - ic_maliyet, \"yeni_kar\": yeni_kar, \"yeni_roi\": yeni_kar / 8000000 * 100,\n         \"yeni_artik_kar\"\
      : yeni_kar - 8000000 * 0.12, \"montaj_tasarrufu\": (180 - 170) * 20000}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: güven 4, seviye 3
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-2_k2.yaml, klasik 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-YNM-PRF-K002
  sinav: ymm
  ders: YNM
  konu: PRF
  kazanimlar:
  - sorumluluk merkezleri
  - yatırımın karlılığı ve artık kâr
  - dengeli başarı kartı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Akın Holding A.Ş.''nin yatırım merkezi olarak örgütlenmiş üç bölümünün 2026 yılı verileri (TL):


    | Bölüm | Net satışlar | Faaliyet kârı | Ortalama yatırılan sermaye |

    |---|---|---|---|

    | K | 40.000.000 | 4.000.000 | 20.000.000 |

    | L | 30.000.000 | 4.500.000 | 30.000.000 |

    | M | 15.000.000 | 3.000.000 | 10.000.000 |


    Holdingin bölümler için belirlediği asgari getiri oranı (sermaye maliyeti) %18''dir. Bölüm yöneticilerinin primleri

    yatırımın karlılığına (ROI) göre belirlenmektedir.


    **İstenenler:**


    (a) Sorumluluk merkezi türlerini açıklayarak bölümlerin neden yatırım merkezi olarak değerlendirildiğini

    belirtiniz. (4 puan)


    (b) Her bölümün ROI''sini satış kârlılığı ve yatırım devir hızına ayırarak (DuPont) hesaplayınız; artık kârlarını

    bulunuz ve bölümleri iki ölçüte göre sıralayınız. (9 puan)


    (c) K bölümü yöneticisine 5.000.000 TL yatırım gerektiren ve yıllık 950.000 TL faaliyet kârı sağlayacak bir proje

    önerilmiştir. Projenin K bölümünün ROI''si ve artık kârı üzerindeki etkisini hesaplayınız; yöneticinin ve holdingin

    bakış açısından kararı değerlendiriniz. (7 puan)


    (d) L bölümü için dengeli başarı kartının dört boyutunun her birinde birer performans ölçütü öneriniz ve finansal

    olmayan ölçütlerin önemini açıklayınız. (5 puan)

    '
  cozum: "**(a) Sorumluluk merkezleri**\n\nMaliyet merkezinin yöneticisi yalnız maliyetlerden, gelir merkezinin yöneticisi\
    \ gelirlerden, kâr merkezinin\nyöneticisi gelir ve maliyetlerden (dolayısıyla kârdan), yatırım merkezinin yöneticisi ise\
    \ kârın yanında bu kârı\nelde etmek için kullanılan varlıklardan (yatırım kararlarından) sorumludur. Bölümlerin performansı,\
    \ kâr ile\nyatırılan sermaye birlikte (ROI, artık kâr) ölçüldüğünden bölümler yatırım merkezidir.\n\n**(b) DuPont analizi\
    \ ve artık kâr**\n\n| Bölüm | Satış kârlılığı | Yatırım devir hızı | ROI | Asgari getiri (%18) | Artık kâr (TL) |\n|---|---|---|---|---|---|\n\
    | K | 4 / 40 = %10 | 40 / 20 = 2,0 | %20 | 3.600.000 | 400.000 |\n| L | 4,5 / 30 = %15 | 30 / 30 = 1,0 | %15 | 5.400.000\
    \ | (900.000) |\n| M | 3 / 15 = %20 | 15 / 10 = 1,5 | %30 | 1.800.000 | 1.200.000 |\n\nSıralama: ROI'ye göre M (%30),\
    \ K (%20), L (%15); artık kâra göre M (1.200.000), K (400.000), L (−900.000).\nL bölümü satış kârlılığı yüksek olmasına\
    \ karşın varlıklarını verimsiz kullandığı (devir hızı 1) için asgari getirinin\naltında kalmakta ve değer kaybettirmektedir.\n\
    \n**(c) Proje değerlendirmesi**\n\nProjenin ROI'si = 950.000 / 5.000.000 = %19.\n- K'nın yeni ROI'si = (4.000.000 + 950.000)\
    \ / (20.000.000 + 5.000.000) = 4.950.000 / 25.000.000 = **%19,8** (mevcut\n  %20'nin altına düşer).\n- Projenin artık\
    \ kârı = 950.000 − 5.000.000 × %18 = **+50.000 TL**; K'nın artık kârı 400.000 TL'den **450.000 TL**'ye\n  çıkar.\n\nPrimi\
    \ ROI'ye bağlı yönetici, bölüm ROI'sini düşürdüğü için projeyi **reddeder**. Oysa proje sermaye maliyetinin\n(%18) üzerinde\
    \ getiri sağladığından holdingin değerini artırır ve holding açısından **kabul edilmelidir**. ROI ile\nölçüm hedef uyumsuzluğuna\
    \ yol açmakta, yüksek ROI'li bölümleri kârlı yatırımları reddetmeye yöneltmektedir; artık\nkâr bu sakıncayı gidermektedir.\
    \ (Düşük ROI'li L bölümü ise %18'in altında getirili projeleri bile ROI'sini yükselttiği\niçin kabul etme eğiliminde olabilir.)\n\
    \n**(d) Dengeli başarı kartı**\n\n| Boyut | Örnek ölçüt (L bölümü) |\n|---|---|\n| Finansal | Yatırım devir hızı, artık\
    \ kâr veya ekonomik katma değer |\n| Müşteri | Müşteri memnuniyet endeksi, müşteri elde tutma oranı, pazar payı |\n| İç\
    \ süreçler | Stok devir hızı, kapasite kullanım oranı, hatalı ürün oranı, sipariş teslim süresi |\n| Öğrenme ve gelişme\
    \ | Çalışan başına eğitim saati, çalışan devir oranı, öneri sistemi katılımı |\n\nFinansal ölçütler geçmiş performansı\
    \ gösterir ve kısa vadeli kararları ödüllendirebilir. Finansal olmayan ölçütler,\ngelecekteki finansal sonuçların öncü\
    \ göstergeleridir; strateji ile günlük faaliyetleri neden-sonuç ilişkisi içinde\nbağlar ve yöneticileri uzun vadeli değer\
    \ yaratmaya yönlendirir.\n"
  puanlama:
  - olcut: (a) Sorumluluk merkezi türleri ve yatırım merkezi gerekçesi
    puan: 4
  - olcut: (b) Satış kârlılıkları ve devir hızları
    puan: 3
  - olcut: (b) ROI'ler (%20 / %15 / %30) ve artık kârlar (400.000 / −900.000 / 1.200.000)
    puan: 4
  - olcut: (b) Sıralama ve L bölümü yorumu
    puan: 2
  - olcut: (c) Yeni ROI %19,8 ve artık kâr etkisi (+50.000; 450.000)
    puan: 4
  - olcut: (c) Yönetici–holding hedef uyumsuzluğunun açıklanması
    puan: 3
  - olcut: (d) Dört boyut için ölçütler ve finansal olmayan ölçütlerin önemi
    puan: 5
  kaynaklar:
  - mevzuat: Genel bilgi — Yönetim muhasebesi, performans ölçümü ve dengeli başarı kartı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
  dogrulama:
    python: "b = {\"K\": (40e6, 4e6, 20e6), \"L\": (30e6, 4.5e6, 30e6), \"M\": (15e6, 3e6, 10e6)}\nroi = {k: round(v[1] /\
      \ v[2] * 100, 2) for k, v in b.items()}\nak = {k: v[1] - 0.18 * v[2] for k, v in b.items()}\nsonuc = {\"roiK\": roi[\"\
      K\"], \"roiL\": roi[\"L\"], \"roiM\": roi[\"M\"], \"akK\": ak[\"K\"], \"akL\": abs(ak[\"L\"]),\n         \"akM\": ak[\"\
      M\"], \"yeni_roi\": round(4.95e6 / 25e6 * 100, 2), \"proje_ak\": 950000 - 0.18 * 5e6,\n         \"yeni_ak\": ak[\"K\"\
      ] + 950000 - 0.18 * 5e6}\n"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi K_YNM
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-22'
      G5:
        sonuc: gecti
        tarih: '2026-10-22'
        not: güven 5, seviye 3
  gecmis:
  - tarih: '2026-10-22'
    kim: uretici
    ne: harici teslim t_K_YNM.yaml, klasik 22
  - tarih: '2026-10-22'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-YNM-PRF-K003
  sinav: ymm
  ders: YNM
  konu: PRF
  kazanimlar:
  - işletme içi transfer fiyatlaması
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Teknik Elektronik A.Ş.''nin iki kâr merkezi vardır. Çip Bölümü yıllık 50.000 adet kapasiteyle kontrol kartı

    üretmektedir; kartın birim değişken maliyeti 300 TL, birim sabit gider payı 100 TL''dir. Bölüm dış piyasada yıllık

    40.000 adet kart satabilmekte, piyasa fiyatı 500 TL''dir; dış satışlarda birim başına 20 TL değişken satış gideri

    (komisyon ve nakliye) oluşmakta, iç transferlerde bu gider doğmamaktadır.


    Cihaz Bölümü yıllık 15.000 adet karta ihtiyaç duymaktadır. Bir dış tedarikçi aynı kartı birim 470 TL''den

    sağlamayı teklif etmiştir. Bölüm yöneticileri özerktir; şirket yönetimi transfer fiyatının "tam maliyet + %25"

    olarak belirlenmesini önermektedir.


    **İstenenler:**


    (a) Çip Bölümünün 15.000 adetlik iç transfer için kabul edebileceği en düşük (ortalama) transfer fiyatını ve

    Cihaz Bölümünün ödemeye razı olacağı en yüksek fiyatı belirleyiniz. (8 puan)


    (b) Şirket bütünü açısından kartların ne kadarının içeriden, ne kadarının dışarıdan sağlanması gerektiğini

    hesaplayınız; şirketin bu karardan elde edeceği yararı, tüm kartların dışarıdan alınması seçeneğine göre bulunuz.

    (8 puan)


    (c) Önerilen "tam maliyet + %25" kuralının sonucunu ve şirket kârına etkisini değerlendiriniz; hedef uyumunu

    sağlayacak bir transfer fiyatlaması yaklaşımı öneriniz. (5 puan)


    (d) Bölümler ayrı tüzel kişilikler (ilişkili kurumlar) olsaydı transfer fiyatının vergisel boyutunu KVK md. 13

    çerçevesinde açıklayınız. (4 puan)

    '
  cozum: "**(a) Transfer fiyatı aralığı**\n\nBoş kapasite = 50.000 − 40.000 = 10.000 adet. 15.000 adetin 10.000'i boş kapasiteden,\
    \ 5.000'i dış satışlardan\nvazgeçilerek karşılanabilir.\n\n- Boş kapasiteyle karşılanan 10.000 adet için en düşük fiyat\
    \ = değişken maliyet = **300 TL** (fırsat maliyeti yok).\n- Dış satıştan vazgeçilen 5.000 adet için en düşük fiyat = değişken\
    \ maliyet + vazgeçilen birim katkı payı =\n  300 + (500 − 20 − 300) = 300 + 180 = **480 TL**.\n- 15.000 adet için ortalama\
    \ en düşük fiyat = (10.000 × 300 + 5.000 × 480) / 15.000 = 5.400.000 / 15.000 = **360 TL**.\n- Cihaz Bölümünün ödeyeceği\
    \ en yüksek fiyat = dış tedarikçi fiyatı = **470 TL**.\n\n**(b) Şirket açısından optimum**\n\n| Kaynak | Şirkete birim\
    \ maliyet (TL) | Karar |\n|---|---|---|\n| Boş kapasiteden iç üretim (10.000 adet) | 300 | İç kaynak (470'ten ucuz) |\n\
    | Dış satıştan vazgeçerek iç üretim (5.000 adet) | 480 | Dışarıdan al (470 < 480) |\n\nEn uygun çözüm: **10.000 adet içeriden,\
    \ 5.000 adet dışarıdan**. Şirketin maliyeti = 10.000 × 300 + 5.000 × 470 =\n3.000.000 + 2.350.000 = **5.350.000 TL**.\
    \ Tamamı dışarıdan alınsaydı 15.000 × 470 = 7.050.000 TL olurdu; yarar\n**1.700.000 TL**'dir. (15.000 adetin tamamı içeriden\
    \ sağlansaydı maliyet 5.400.000 TL olurdu; optimumdan 50.000 TL\nfazla.)\n\n**(c) \"Tam maliyet + %25\" kuralı**\n\nTransfer\
    \ fiyatı = (300 + 100) × 1,25 = **500 TL** olur. Cihaz Bölümü 470 TL'lik dış teklif nedeniyle kartların\ntamamını dışarıdan\
    \ alır; Çip Bölümünün 10.000 adetlik boş kapasitesi atıl kalır. Şirket, optimum çözüme göre\n10.000 × (470 − 300) = **1.700.000\
    \ TL** daha az kâr eder. Tam maliyet esaslı fiyat sabit giderleri değişken gibi\ngösterdiği ve fırsat maliyetini dikkate\
    \ almadığı için hedef uyumsuzluğu yaratır.\n\nÖneri: boş kapasite için değişken maliyet (fırsat maliyeti sıfır), dolu\
    \ kapasite için piyasa fiyatı eksi tasarruf\nedilen satış giderleri esas alınmalı; ya da bölümlerin 300–470 TL aralığında\
    \ müzakere etmesine izin verilmelidir.\nAyrıca alıcı bölüme değişken maliyetle, satıcı bölüme piyasa fiyatıyla kayıt yapılan\
    \ çift fiyat (ikili fiyat)\nyöntemi de hedef uyumunu sağlar.\n\n**(d) Vergisel boyut**\n\nBölümler ilişkili kurumlar olsaydı\
    \ aralarındaki mal alım satımında KVK md. 13'e göre **emsallere uygunluk ilkesi**\nuygulanır; emsale aykırı fiyatla yapılan\
    \ işlemlerde kazanç tamamen veya kısmen transfer fiyatlandırması yoluyla\nörtülü olarak dağıtılmış sayılır. Emsal fiyat;\
    \ karşılaştırılabilir fiyat, maliyet artı veya yeniden satış fiyatı\nyöntemlerinden (uygun değilse kâr bölüşüm veya işlemsel\
    \ net kâr marjı gibi diğer yöntemlerden) işlemin mahiyetine\nen uygun olanıyla belirlenir; burada bağımsız alıcılara yapılan\
    \ 500 TL'lik satışlar karşılaştırılabilir fiyat\nniteliğindedir. Yönetim muhasebesindeki iç transfer fiyatı ile vergisel\
    \ emsal fiyat farklı amaçlara hizmet eder.\n"
  puanlama:
  - olcut: (a) Boş kapasite ve vazgeçilen satış miktarının belirlenmesi
    puan: 2
  - olcut: (a) 300 TL ve 480 TL en düşük fiyatlar, ortalama 360 TL
    puan: 4
  - olcut: (a) En yüksek fiyat 470 TL
    puan: 2
  - olcut: (b) 10.000 içeriden / 5.000 dışarıdan kararı
    puan: 4
  - olcut: (b) Şirket maliyeti 5.350.000 TL ve 1.700.000 TL yarar
    puan: 4
  - olcut: (c) 500 TL transfer fiyatı, dış alım ve 1.700.000 TL kâr kaybı
    puan: 3
