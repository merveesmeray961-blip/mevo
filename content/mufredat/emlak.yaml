# Emlak Danışmanı MYK sınavı müfredatı — sürüm 2 (12 Kasım 2026).
# DERSLER = MYK YETERLİLİK BİRİMLERİ. RESMÎ. Kaynak: MYK ulusal yeterlilikleri
#   17UY0332-4 Emlak Danışmanı (Seviye 4) ve 17UY0333-5 Sorumlu Emlak Danışmanı (Seviye 5), Rev.00
#   (content/kaynaklar/myk/). Her birimin teorik (T1) sınavı AYRI yapılır: en az 20 soru, 4 SEÇENEK, soru başına
#   1,5 dakika (20 soru = 30 dk), birim başına en az yüzde 70 doğru; yanlış doğruyu götürmez.
#   Ayrıca A2 ve A3'te performans (P1) sınavı var; uygulama bunu "senaryo/yer gösterme" çalışmalarıyla destekler.
# Bölümler: S4 = Emlak Danışmanı (Seviye 4), S5 = Sorumlu Emlak Danışmanı (Seviye 5).
#   S4 birimleri: A1 İSG Çevre ve Kalite · A2 İş Planı Yapma ve Portföy Oluşturma · A3 Emlak Satışı/Kiralanması ve Sonrası İşlemleri
#   S5 birimleri: A1 İSG Çevre ve Kalite · A2 Pazarlama Stratejisi Geliştirme ve İş Organizasyonu · A3 Emlak Satışı/Kiralama Süreci İşlemlerinin Yürütülmesi
# Ders eşlemesi: ISG = A1 (iki seviye) · POR = S4-A2 · STR = S5-A2 · SAT = A3 (iki seviye; S5'e özgü konu agirlik S4: 0).
# KONULAR: birimlerin "Bilgiler" (BG) listesinden; mevzuat konuları (Taşınmaz Ticareti Yönetmeliği, TBK kira/satış,
#   tapu, kat mülkiyeti, imar, harç ve vergi, KVKK) ilgili BG'nin altına yerleştirildi. Ağırlıklar TASLAK.
# v1 (8 Ekim) → v2: v1 mevzuat başlıklarına göre 7 dersti ve 5 seçenekliydi; MYK sınavı birim bazlı ve 4 seçeneklidir.
#   Eski dosya: emlak_v1_2026-10-08.yaml. Eski ders/konu → yeni eşleme: docs/yeni_uygulamalar/EMLAK_PLAN.md.
