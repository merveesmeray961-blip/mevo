# HMGS (Hukuk Mesleklerine Giriş Sınavı, ÖSYM) müfredat TASLAĞI (8 Ekim 2026). ÖSYM kılavuzundaki soru dağılımıyla doğrulanmalı.
# Banka hedefi 5000 (+%20 eleme payı = üretim 6000).
sinav: hmgs
ad: Hukuk Mesleklerine Giriş Sınavı
