# HMGS (Hukuk Mesleklerine Giriş Sınavı, ÖSYM) müfredatı — sürüm 2 (12 Kasım 2026).
# DERSLER VE SORU SAYILARI: RESMÎ. Kaynak: ÖSYM 2026-HMGS/2 ve İYÖS Başvuru Kılavuzu, "alanlara göre soru dağılımı"
#   (dokuman.osym.gov.tr/web/2026/8/2026-hmgs-yos-basvuru-kilavuzu-cgu7rr-10132141.pdf). Yüzde × 120 = soru sayısı.
# Sınav biçimi (aynı kılavuz): 120 çoktan seçmeli soru, 5 seçenek (A–E), 155 dakika, başarı 100 üzerinden en az 70,
#   yanlış doğruyu götürmez. Yılda iki oturum (Nisan/Mayıs ve Eylül).
# KONULAR VE KAZANIMLAR: TASLAK. ÖSYM alt konu listesi yayımlamıyor; konu ağırlıkları ÖSYM'nin yayımladığı
#   2024–2026 temel soru kitapçıklarının ders ders analiziyle (YMM'de yaptığımız gibi) kesinleştirilecek.
# Banka hedefi: 5000 soru, ders payı = sınavdaki yüzde (yüzde 2,5 → 125; yüzde 5 → 250 ...).
# v1 (8 Ekim) → v2 farkı: 16 ders 20'ye çıktı (Anayasa Yargısı, Genel Kamu Hukuku, Vergi Usul Hukuku ayrı ders;
#   Milletlerarası Hukuk ile Milletlerarası Özel Hukuk ayrıldı). Eski dosya: hmgs_v1_2026-10-08.yaml.
