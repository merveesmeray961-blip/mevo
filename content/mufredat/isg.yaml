# İSG Uzmanlığı sınavı (ÖSYM) müfredat TASLAĞI (8 Ekim 2026). ÖSYM kılavuzu ve ÇSGB konu listesiyle doğrulanmalı.
# Banka hedefi 3000 (+%20 eleme payı = üretim 3600).
sinav: isg
ad: İş Güvenliği Uzmanlığı Sınavı
dersler:
  - kod: MEV
    ad: İSG Mevzuatı
    soru: {IGU: 1}
    hedef: 900
    kaynak_dosyalari: [isg_6331, isk, sgk]
    konular:
      - {kod: KAN, ad: 6331 sayılı Kanun, agirlik: {d: 45}, kazanimlar: [işveren yükümlülükleri, çalışanların hak ve yükümlülükleri, İSG hizmetleri ve uzman görevlendirme, kurullar ve temsilciler, idari para cezaları]}
      - {kod: YON, ad: İSG yönetmelikleri, agirlik: {d: 35}, kazanimlar: [iş güvenliği uzmanlarının görev yetki ve sorumlulukları, tehlike sınıfları ve çalışma süreleri, çalışanların İSG eğitimleri, sağlık gözetimi]}
      - {kod: ISK, ad: İş Kanunu ve SGK hükümleri, agirlik: {d: 20}, kazanimlar: [çalışma süreleri ve gece çalışması, kadın ve genç işçi çalışma yasakları, iş kazası tanımı ve bildirimi]}
  - kod: RSK
    ad: Risk Değerlendirmesi ve İSG Yönetimi
    soru: {IGU: 1}
    hedef: 540
    kaynak_dosyalari: [isg_6331]
    konular:
      - {kod: RDY, ad: Risk değerlendirmesi, agirlik: {d: 60}, kazanimlar: [tehlike ve risk kavramları, risk değerlendirme yöntemleri, risk değerlendirme ekibi ve yenileme süreleri]}
      - {kod: YNS, ad: İSG yönetim sistemleri, agirlik: {d: 40}, kazanimlar: [ISO 45001 temel ilkeleri, kontrol hiyerarşisi, iç denetim ve sürekli iyileştirme]}
  - kod: HIJ
    ad: İş Hijyeni
    soru: {IGU: 1}
    hedef: 450
    konular:
      - {kod: FIZ, ad: Fiziksel etkenler, agirlik: {d: 40}, kazanimlar: [gürültü ve maruziyet sınırları, titreşim, termal konfor ve aydınlatma]}
      - {kod: KIM, ad: Kimyasal ve biyolojik etkenler, agirlik: {d: 40}, kazanimlar: [kimyasal maruziyet ve güvenlik bilgi formu, tozlar ve asbest, biyolojik etkenler]}
      - {kod: KKD, ad: Kişisel koruyucu donanım, agirlik: {d: 20}, kazanimlar: [KKD seçimi ve kullanımı, solunum koruyucular, CE işareti]}
  - kod: ERG
    ad: Ergonomi ve Psikososyal Riskler
    soru: {IGU: 1}
    hedef: 240
    konular:
      - {kod: ERG, ad: Ergonomi ve psikososyal riskler, agirlik: {d: 100}, kazanimlar: [elle taşıma ve kas iskelet sistemi, ekranlı araçlarla çalışma, stres ve mobbing, vardiyalı çalışma]}
  - kod: KAZ
    ad: İş Kazaları ve Meslek Hastalıkları
    soru: {IGU: 1}
    hedef: 360
    kaynak_dosyalari: [isg_6331, sgk]
    konular:
      - {kod: KZA, ad: İş kazaları, agirlik: {d: 55}, kazanimlar: [kaza nedenleri ve teorileri, kaza araştırması ve kök neden analizi, kaza istatistikleri ve oranları]}
      - {kod: MHS, ad: Meslek hastalıkları, agirlik: {d: 45}, kazanimlar: [meslek hastalığı tanısı ve bildirimi, pnömokonyozlar, mesleki kanserler]}
  - kod: YNG
    ad: Yangın, Patlama ve Acil Durum
    soru: {IGU: 1}
    hedef: 300
    konular:
      - {kod: YNG, ad: Yangın ve patlama, agirlik: {d: 60}, kazanimlar: [yanma üçgeni ve yangın sınıfları, söndürücü seçimi, patlayıcı ortamlar]}
      - {kod: ACL, ad: Acil durum yönetimi, agirlik: {d: 40}, kazanimlar: [acil durum planı ve tatbikat, tahliye, destek elemanları]}
  - kod: ELK
    ad: Elektrik, Makine ve Yapı İşleri Güvenliği
    soru: {IGU: 1}
    hedef: 450
    konular:
      - {kod: ELK, ad: Elektrik güvenliği, agirlik: {d: 30}, kazanimlar: [elektrik çarpması ve etkileri, topraklama ve kaçak akım, statik elektrik]}
      - {kod: MAK, ad: Makine ve iş ekipmanı, agirlik: {d: 35}, kazanimlar: [makine koruyucuları, bakım ve kilitleme etiketleme, kaldırma ekipmanları ve basınçlı kaplar]}
      - {kod: YAP, ad: Yapı işleri ve yüksekte çalışma, agirlik: {d: 35}, kazanimlar: [iskele güvenliği, düşmeye karşı koruma, kazı işleri]}
  - kod: EGT
    ad: İSG Eğitimi, İletişim ve İlk Yardım
    soru: {IGU: 1}
    hedef: 210
    konular:
      - {kod: EGT, ad: Eğitim ve iletişim, agirlik: {d: 60}, kazanimlar: [yetişkin eğitimi ilkeleri, güvenlik kültürü ve davranış, işaretler ve uyarılar]}
      - {kod: ILK, ad: İlk yardım, agirlik: {d: 40}, kazanimlar: [temel yaşam desteği, yaralanma ve zehirlenmelerde ilk yardım, işyeri ilk yardımcı sayısı]}
  - kod: SKT
    ad: Sektörel Uygulamalar
    soru: {IGU: 1}
    hedef: 150
    konular:
      - {kod: SKT, ad: Sektörel riskler, agirlik: {d: 100}, kazanimlar: [maden işleri, kimya ve petrokimya, kapalı alanlarda çalışma]}
