# SMMM müfredat ağacı
# Durum: taslak_v1 — resmî kapsam (TÜRMOB YK kararı E.233, Sınav Yön. md.14) + 2025–2026 kitapçık analizi
#   (docs/analiz/). Uzman onayı (Kapı M) bekliyor.
#
# Yapı: ders → konu (kod, ad, ağırlık) → kazanımlar → kaynaklar
# agirlik: ders içindeki yaklaşık soru payı (yüzde). yet = Yeterlilik, sgs = Staja Giriş.
# Soru kimliği: SMMM-<DERS>-<KONU>-<NNNN>  (ör. SMMM-FIN-STK-0001)

durum: taslak_v1
kaynak_dizini: content/kaynaklar/mevzuat

dersler:

  # ───────────────────────── ORTAK: Yeterlilik + SGS ─────────────────────────
  - kod: FIN
    ad: Finansal Muhasebe
    soru: {yet: 20, sgs: 18}
    oturum_yet: 1
    notlar:
      - "Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi (MSUGT) esas alınır; KDV %20."
      - "Seçenekler çoğunlukla THP kodlu tam yevmiye kaydı veya 'X hesabına N ₺ borç/alacak'."
    konular:
      - {kod: STK, ad: Stoklar ve ticari mallar, agirlik: {yet: 20, sgs: 12},
         kazanimlar: [FIFO/ortalama ile maliyet, sürekli ve aralıklı envanter, alış/satış iade ve iskontoları, sayım farkları (397), normal fire, stok değer düşüklüğü (158/654), TMS 2 net gerçekleşebilir değer ve normal kapasite],
         kaynaklar: [MSUGT 15 grubu, VUK md.274-275, TMS 2]}
      - {kod: MDV, ad: Maddi ve maddi olmayan duran varlıklar, agirlik: {yet: 18, sgs: 20},
         kazanimlar: [aktifleştirme/gider ayrımı, özel maliyetler, yapılmakta olan yatırımlar, amortisman yöntemleri (eşit tutar, azalan bakiyeler, üretim miktarı), satış ve takas, yenileme fonu (549), sigorta hasarı, haklar ve şerefiye, TMS 16 yeniden değerleme ve bileşen, TMS 38 Ar-Ge, TMS 40 yatırım amaçlı gayrimenkul],
         kaynaklar: [MSUGT 25-26 grupları, VUK md.313-330, TMS 16, TMS 38, TMS 40]}
      - {kod: MKY, ad: Menkul kıymetler ve ortaklık payları, agirlik: {yet: 13, sgs: 9},
         kazanimlar: [hisse senedi ve tahvil alım-satımı, değer düşüklüğü karşılığı (119/654/644), temettü, iştirak ve bağlı ortaklık sınıflaması (242/245)],
