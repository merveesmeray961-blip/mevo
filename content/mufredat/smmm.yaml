  - kod: TAB
    ad: Finansal Tablolar ve Analizi
    sgs_ad: Mali Tablolar Analizi
    soru: {yet: 20, sgs: 8}
    oturum_yet: 2
    notlar:
      - "Kökte: 'Devir hızlarında ortalama değer; yıl 360, ay 30 gün.' Çeyrek 90, 6 ay 180 gün."
      - "Yeterlilik'te tek 3 yıllık bilanço + gelir tablosu 10–15 soruyu besler."
      - "Dikey analizde baz net satışlar; ticari borç süresi satışların maliyetiyle; brüt satış kârlılığı = brüt satış kârı / net satışlar."
      - "Grafik sorusu üretme (gerçek sınavdaki 3 grafik sorusunun üçü de iptal edildi)."
    konular:
      - {kod: DVR, ad: Devir hızları ve süreleri, agirlik: {yet: 25, sgs: 10},
         kazanimlar: [stok (ilk madde, yarı mamul, mamul, ticari mal) devir hızı/süresi, alacak tahsil süresi, borç ödeme süresi, hedef süreden geri hesap]}
      - {kod: LIK, ad: Likidite ve finansal yapı oranları, agirlik: {yet: 18, sgs: 27},
         kazanimlar: [net ve brüt işletme sermayesi, cari oran, likidite (asit-test) oranı, nakit oran, kaldıraç, devamlı sermaye oranları, hedef orandan geri hesap]}
      - {kod: DIK, ad: Dikey, yatay ve trend analizi, agirlik: {yet: 33, sgs: 20},
         kazanimlar: [dikey yüzdeler, karşılaştırmalı (yatay) analiz, trend yüzdeleri]}
      - {kod: KAR, ad: Kârlılık oranları, agirlik: {yet: 10, sgs: 25},
         kazanimlar: [brüt ve faaliyet kâr oranı, varlık ve özkaynak kârlılığı, DuPont]}
      - {kod: TMS, ad: Finansal tablolar ve TMS 1 / nakit akışı, agirlik: {yet: 14, sgs: 18},
