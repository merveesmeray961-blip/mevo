      - {kod: DON, ad: Dönem sonu tahakkuk, erteleme, reeskont ve karşılıklar, agirlik: {yet: 13, sgs: 11},
         kazanimlar: [gelecek aylara ait gider/gelir (180/380), gelir ve gider tahakkukları (181/381), alacak ve borç senedi reeskontu (122/302/647/657), gider karşılıkları (373), kurumlar vergisi karşılığı (691/370), kapanış kayıtları],
