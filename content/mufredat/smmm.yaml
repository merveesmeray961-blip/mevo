# SMMM müfredat ağacı — TASLAK
# Durum: teyit_bekliyor. Resmî kapsam (Sınav Yönetmeliği md.14, TESMER duyuruları)
# okunduktan ve muhasebeci onayından (Kapı M) sonra "onayli" olacak.
# Yapı: ders → unite → konu → kazanim. Bu taslakta yalnızca ders düzeyi ve kaynak eşlemesi var.

durum: teyit_bekliyor
dersler:
  - kod: FIN
    ad: Finansal Muhasebe
    sgs_soru: 18
    yet_soru: 20
    kaynaklar: [Muhasebe Sistemi Uygulama Genel Tebliğleri, "213 VUK md. 258-330 (değerleme)", BOBİ FRS, TMS/TFRS]
  - kod: STD
    ad: Muhasebe Standartları
    sgs_soru: 8
    yet_soru: 0          # Yeterlilik'te ayrı ders değil; Finansal Muhasebe içinde (teyit edilecek)
    kaynaklar: [TMS/TFRS, BOBİ FRS, KÜMİ FRS]
  - kod: TAB
    ad: Finansal Tablolar ve Analizi
    sgs_soru: 8
    yet_soru: 20
    kaynaklar: [MSUGT mali tablo ilkeleri, TMS 1, TMS 7]
  - kod: MAL
    ad: Maliyet Muhasebesi
    sgs_soru: 8
    yet_soru: 20
    kaynaklar: [MSUGT 7/A-7/B]
  - kod: DEN
    ad: Muhasebe Denetimi
    sgs_soru: 16
    yet_soru: 20
