# SPK Lisanslama Sınavları müfredat TASLAĞI (8 Ekim 2026). SPL konu listesiyle doğrulanmalı.
# Banka hedefi 4000 (+%20 eleme payı = üretim 4800). soru: lisans düzeyine göre ders kapsamı (D1 = Düzey 1, D2 = Düzey 2, D3 = Düzey 3); hedef = üretim hedefi.
sinav: spk
ad: SPK Lisanslama Sınavları
