# Yeminli Mali Müşavirlik (YMM) sınavı müfredatı — sürüm 2 (17 Ekim 2026).
# Dersler: YMM ve SMMM Sınav Yönetmeliği md. 14/a (content/kaynaklar/mevzuat/sinav_yon.txt) — resmî ve kesin.
# Konu ve kazanımlar: TESMER resmî alt konu listesi YAYIMLAMIYOR (tesmer.org.tr 2026/3 duyurusu yalnız ders adlarını verir).
# Bu sürüm, TESMER'in yayımladığı 2022/1–2026/1 (13 dönem, 130 sınav) soru ve cevap anahtarlarının konu konu
# analizinden türetildi: docs/denetim/ymm_cikmis_2026-10-17/ (ders başına soru dökümü, puan payı, stil).
# `agirlik` = 13 dönemdeki gerçek puan payına göre (ders başına toplam 100). Hiç sorulmayan konular silinmedi,
# ağırlığı düşürüldü (ders adı gereği ileride sorulabilir).
# Sınav biçimi: klasik yazılı, mikro puanlama (gerekçesiz sonuç puan almaz). Başarı: her dersten en az 50, ortalama
# en az 65 (md. 16/a). Yılda üç dönem (md. 8). Süre: REV ve GUV 3,5 saat; diğerleri 2 saat (2025/3–2026/1 sınav başlıkları).
# 2026-10-17 değişikliği: VTK'daki TFR, BDB, MTR, TSV konuları REV'e taşındı (sınavda REV'de soruluyor);
# VTK'ya vergi usulü konuları (usul, düzeltme, yargı, tahsilat, sorumluluk) eklendi.
sinav: ymm
ad: Yeminli Mali Müşavirlik Sınavı
dersler:
  - kod: IFM
    hesapli: true
    ad: İleri Düzeyde Finansal Muhasebe
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [tms_, tfrs_, kavramsal_cerceve, msugt_1, vuk, tsrs_]
    konular:
      - {kod: KCV, ad: Kavramsal Çerçeve ve finansal tabloların sunuluşu, agirlik: {ymm: 12}, kazanimlar: [finansal raporlamanın amacı ve yararlı finansal bilginin niteliksel özellikleri, finansal tablo unsurlarının tanımı ve muhasebeleştirilmesi, ölçüm esasları, TMS 1 ve TFRS 18 finansal tabloların sunuluşu, TMS 8 muhasebe politikaları tahmin değişiklikleri ve hatalar, TMS 10 raporlama döneminden sonraki olaylar ve TMS 24 ilişkili taraflar]}
      - {kod: VRG, ad: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar, agirlik: {ymm: 22}, kazanimlar: [VUK kayıtlarından TFRS düzeltme kayıtlarına geçiş, TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü, geçici farklar, ertelenmiş vergi kayıtları (289 489 695 696) ve mahsubu, cari ve ertelenmiş vergi gideri, TMS 37 karşılıklar ve koşullu yükümlülükler, TMS 19 kıdem tazminatı karşılığı ve kısa vadeli izin karşılığı]}
      - {kod: MDV, ad: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller, agirlik: {ymm: 15}, kazanimlar: [TMS 16 maddi duran varlıklar ve amortisman, yeniden değerleme modeli, TMS 38 maddi olmayan duran varlıklar ve kuruluş giderleri, TMS 36 varlıklarda değer düşüklüğü, TMS 40 yatırım amaçlı gayrimenkuller, TMS 23 borçlanma maliyetleri]}
      - {kod: STK, ad: Stoklar canlı varlıklar ve devlet teşvikleri, agirlik: {ymm: 8}, kazanimlar: [TMS 2 stokların maliyeti ve net gerçekleşebilir değer, stok değer düşüklüğü, TMS 41 tarımsal faaliyetler, TMS 20 devlet teşvikleri]}
      - {kod: KIR, ad: Hasılat ve kiralamalar, agirlik: {ymm: 12}, kazanimlar: [TFRS 15 beş adımlı model, yıllara yaygın inşaat ve tamamlanma oranı, sözleşme varlığı ve yükümlülüğü, TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü]}
      - {kod: TAB, ad: Nakit akış tablosu ve özel raporlama konuları, agirlik: {ymm: 8}, kazanimlar: [TMS 7 nakit akış tablosu, TFRS 5 satış amaçlı duran varlıklar ve durdurulan faaliyetler, TFRS 1 TFRS'nin ilk uygulaması, TFRS 13 gerçeğe uygun değer ölçümü, TSRS 1 sürdürülebilirlik raporlaması]}
      - {kod: FAR, ad: Finansal araçlar, agirlik: {ymm: 7}, kazanimlar: [TFRS 9 sınıflandırma ve ölçüm, etkin faiz yöntemi ve reeskont, beklenen kredi zararı, riskten korunma muhasebesi temel ilkeleri]}
      - {kod: ENF, ad: Enflasyon muhasebesi, agirlik: {ymm: 7}, kazanimlar: [TMS 29 yüksek enflasyonlu ekonomide finansal raporlama, parasal ve parasal olmayan kalemler, net parasal pozisyon kazanç ve kaybı, VUK mükerrer 298 enflasyon düzeltmesi]}
      - {kod: KON, ad: Konsolidasyon ve işletme birleşmeleri, agirlik: {ymm: 6}, kazanimlar: [TFRS 10 kontrol ve konsolide tablolar, grup içi işlemlerin elimine edilmesi, TFRS 3 satın alma yöntemi ve şerefiye, kontrol gücü olmayan paylar, TMS 28 özkaynak yöntemi]}
      - {kod: KUR, ad: Kur değişimi ve yabancı para işlemleri, agirlik: {ymm: 2}, kazanimlar: [TMS 21 işlevsel para birimi, parasal kalemlerin değerlemesi, yabancı işletmenin çevrimi, VUK md.280 değerleme]}
      - {kod: BDB, ad: Birleşme devir ve bölünme muhasebesi, agirlik: {ymm: 1}, kazanimlar: [birleşme ve devir kayıtları (devralan ve devrolunan), bölünme ve hisse değişimi, tasfiye muhasebesi, kayıtlı değer ve rayiç değer ayrımı]}

