# Yeminli Mali Müşavirlik (YMM) sınavı müfredat TASLAĞI (10 Ekim 2026).
# Dersler: YMM ve SMMM Sınav Yönetmeliği md. 14/a (content/kaynaklar/mevzuat/sinav_yon.txt) — resmî ve kesin.
# Konu ve kazanımlar: yönetmelikte yoktur; TESMER'in YMM sınav konuları ve çıkmış sorularla DOĞRULANMALIDIR.
# Sınav biçimi: yönetmelik test/klasik seçimini yalnız SMMM için Birlik'e bıraktığından YMM sınavı klasik yazılıdır
# (md. 5/c, 15, 17). Başarı: her dersten en az 50, ortalama en az 65 (md. 16/a). Yılda üç dönem (md. 8).
# Banka hedefi ders başına 300 (+%20 eleme payı = üretim 360; toplam 3600). Çoktan seçmeli bilgi pekiştirme
# sorularının yanında her derse klasik (açık uçlu) örnek soru ve çözüm de üretilecek.
sinav: ymm
ad: Yeminli Mali Müşavirlik Sınavı
dersler:
  - kod: IFM
    hesapli: true
    ad: İleri Düzeyde Finansal Muhasebe
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [tms_, tfrs_, kavramsal_cerceve, msugt_1, vuk]
    konular:
      - {kod: KON, ad: Konsolidasyon ve işletme birleşmeleri, agirlik: {ymm: 18}, kazanimlar: [TFRS 10 kontrol ve konsolide tablolar, TFRS 3 satın alma yöntemi ve şerefiye, kontrol gücü olmayan paylar, grup içi işlemlerin elimine edilmesi, TMS 28 özkaynak yöntemi]}
      - {kod: ENF, ad: Enflasyon düzeltmesi, agirlik: {ymm: 14}, kazanimlar: [VUK mükerrer 298 parasal ve parasal olmayan kalemler, düzeltme katsayıları, enflasyon düzeltmesi farkları hesabı (698), TMS 29 yüksek enflasyonlu ekonomi]}
      - {kod: FAR, ad: Finansal araçlar, agirlik: {ymm: 14}, kazanimlar: [TFRS 9 sınıflandırma ve ölçüm, etkin faiz yöntemi, beklenen kredi zararı, riskten korunma muhasebesi temel ilkeleri]}
      - {kod: KUR, ad: Kur değişimi ve yabancı para işlemleri, agirlik: {ymm: 10}, kazanimlar: [TMS 21 işlevsel para birimi, parasal kalemlerin değerlemesi, yabancı işletmenin çevrimi, VUK md.280 değerleme]}
      - {kod: KIR, ad: Kiralamalar ve hasılat, agirlik: {ymm: 14}, kazanimlar: [TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü, TFRS 15 beş adımlı model, sözleşme varlığı ve yükümlülüğü]}
      - {kod: VRG, ad: Gelir vergileri ve karşılıklar, agirlik: {ymm: 14}, kazanimlar: [TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü, geçici farklar, TMS 37 karşılıklar ve koşullu yükümlülükler, TMS 19 kıdem tazminatı karşılığı]}
      - {kod: BDB, ad: Birleşme devir ve bölünme muhasebesi, agirlik: {ymm: 16}, kazanimlar: [birleşme ve devir kayıtları (devralan ve devrolunan), bölünme ve hisse değişimi, tasfiye muhasebesi, kayıtlı değer ve rayiç değer ayrımı]}

  - kod: FYN
    hesapli: true
    ad: Finansal Yönetim
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: []
    konular:
      - {kod: ZDP, ad: Paranın zaman değeri ve değerleme, agirlik: {ymm: 15}, kazanimlar: [bugünkü ve gelecek değer, anüite, tahvil değerlemesi, hisse senedi değerlemesi (Gordon modeli)]}
      - {kod: SBT, ad: Sermaye bütçelemesi, agirlik: {ymm: 20}, kazanimlar: [net bugünkü değer, iç verim oranı, geri ödeme süresi, karlılık endeksi, yatırım projelerinde nakit akışı tahmini]}
      - {kod: SMR, ad: Sermaye maliyeti ve sermaye yapısı, agirlik: {ymm: 17}, kazanimlar: [ağırlıklı ortalama sermaye maliyeti, CAPM ve beta, finansal kaldıraç, optimal sermaye yapısı]}
      - {kod: ISY, ad: İşletme sermayesi yönetimi, agirlik: {ymm: 15}, kazanimlar: [nakit dönüşüm süresi, nakit ve stok yönetimi (EOQ), alacak yönetimi ve kredi politikası, kısa vadeli finansman]}
      - {kod: RGT, ad: Risk getiri ve portföy, agirlik: {ymm: 13}, kazanimlar: [beklenen getiri ve varyans, portföy çeşitlendirmesi, sistematik ve sistematik olmayan risk]}
      - {kod: FPA, ad: Finansal planlama analiz ve kâr dağıtımı, agirlik: {ymm: 20}, kazanimlar: [oran analizi ve DuPont, nakit bütçesi, kaldıraç dereceleri (faaliyet, finansal, birleşik), kâr payı politikası, birleşme ve satın alma değerlemesi]}

  - kod: YNM
    hesapli: true
    ad: Yönetim Muhasebesi
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: []
    konular:
      - {kod: MHK, ad: Maliyet hacim kâr analizi, agirlik: {ymm: 18}, kazanimlar: [başabaş noktası, güvenlik marjı, katkı payı, çok ürünlü başabaş, hedef kâr]}
      - {kod: KRV, ad: Karar verme ve ilgili maliyetler, agirlik: {ymm: 18}, kazanimlar: [fark analizi, üret veya satın al, özel sipariş, ürün hattını kapatma, kıt kaynak kullanımı]}
      - {kod: BTC, ad: Bütçeleme ve standart maliyet, agirlik: {ymm: 20}, kazanimlar: [ana bütçe, esnek bütçe, malzeme ve işçilik sapmaları, genel üretim gideri sapmaları]}
      - {kod: FDM, ad: Faaliyete dayalı ve stratejik maliyetleme, agirlik: {ymm: 14}, kazanimlar: [faaliyete dayalı maliyetleme, hedef maliyetleme, yaşam boyu maliyetleme, kalite maliyetleri]}
      - {kod: PRF, ad: Performans ölçümü ve transfer fiyatı, agirlik: {ymm: 16}, kazanimlar: [sorumluluk merkezleri, yatırımın karlılığı ve artık kâr, dengeli başarı kartı, işletme içi transfer fiyatlaması]}
      - {kod: DEG, ad: Değişken ve tam maliyetleme, agirlik: {ymm: 14}, kazanimlar: [değişken ve tam maliyetle kâr farkı, stok değişiminin kâra etkisi, normal kapasite]}

  - kod: DRM
    ad: Denetim, Raporlama ve Meslek Hukuku
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [bds_, bagimsiz_denetim_yon, bd_etik_kurallar, kgk_660_khk, smmm_kanunu, ymm_, calisma_usul_yon, disiplin_yon, etik_ilkeler_yon, haksiz_rekabet_yon, sinav_yon, smmm_ucret_tarifesi_2026]
    konular:
      - {kod: BDS, ad: Bağımsız denetim standartları, agirlik: {ymm: 22}, kazanimlar: [BDS 200 genel ilkeler, BDS 315 ve 330 risk değerlendirmesi ve yanıtlar, BDS 500 serisi denetim kanıtı, BDS 240 hile, BDS 570 işletmenin sürekliliği]}
      - {kod: RAP, ad: Denetim ve tasdik raporlaması, agirlik: {ymm: 20}, kazanimlar: [BDS 700 olumlu görüş, BDS 705 olumlu dışı görüş, BDS 706 dikkat çekme ve diğer hususlar, BDS 701 kilit denetim konuları, tasdik raporu türleri]}
      - {kod: YMM, ad: YMM tasdik esasları, agirlik: {ymm: 22}, kazanimlar: [tam tasdik, KDV iade tasdiki, tasdik sözleşmesi ve bildirim, YMM'nin sorumluluğu (VUK md.227), tasdik raporlarının süresi ve ibrazı]}
      - {kod: MHK, ad: Meslek hukuku ve disiplin, agirlik: {ymm: 20}, kazanimlar: [3568 sayılı Kanun YMM şartları ve yasaklar, YMM odaları ve TÜRMOB, disiplin cezaları, haksız rekabet ve reklam yasağı, ücret tarifesi]}
      - {kod: KGK, ad: KGK ve kamu gözetimi, agirlik: {ymm: 16}, kazanimlar: [660 sayılı KHK, bağımsız denetim yönetmeliği, denetçi bağımsızlığı ve rotasyon, kalite güvence]}

  - kod: REV
    hesapli: true
    ad: Revizyon
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [vuk, ymm_tasdik_yon, msugt_1, bds_5, kdvk, kvk]
    konular:
      - {kod: GNL, ad: Revizyonun kapsamı ve teknikleri, agirlik: {ymm: 14}, kazanimlar: [revizyonun amacı, belge ve kayıt incelemesi, karşılaştırma ve teyit, örnekleme, çalışma kâğıtları]}
      - {kod: AKT, ad: Aktif hesapların revizyonu, agirlik: {ymm: 22}, kazanimlar: [hazır değerler ve kasa sayımı, alacakların teyidi ve karşılıklar, stok sayımı ve değerlemesi, duran varlık ve amortisman incelemesi]}
      - {kod: PSF, ad: Pasif ve özkaynak hesaplarının revizyonu, agirlik: {ymm: 16}, kazanimlar: [borçların tamlığı ve teyidi, karşılıklar, sermaye ve sermaye taahhütleri, örtülü kazanç dağıtımı belirtileri]}
      - {kod: GLR, ad: Gelir tablosu hesaplarının revizyonu, agirlik: {ymm: 18}, kazanimlar: [hasılatın dönemselliği, maliyet hesaplarının incelenmesi, kanunen kabul edilmeyen giderler, kur farkı ve finansman giderleri]}
      - {kod: VIN, ad: Vergi incelemesi ve hile tespiti, agirlik: {ymm: 16}, kazanimlar: [VUK md.134-141 vergi incelemesi, sahte ve muhteviyatı itibarıyla yanıltıcı belge, defter ve belge ibrazı, vergi ziyaı ve usulsüzlük]}
      - {kod: TAS, ad: Tasdik çalışmalarında revizyon, agirlik: {ymm: 14}, kazanimlar: [tam tasdik kontrol listeleri, KDV iade incelemesi, tespit ve eleştiri yazılması]}

  - kod: VTK
    hesapli: true
    ad: Vergi Tekniği
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [vuk, kvk, gvk, kdvk, kv_genel_teblig_1, vuk_teblig_]
    konular:
      - {kod: DEG, ad: Değerleme, agirlik: {ymm: 18}, kazanimlar: [VUK md.258-298 değerleme ölçüleri, maliyet bedeli ve borsa rayici, yeniden değerleme (VUK mükerrer 298/ç), amortisman uygulaması]}
      - {kod: TFR, ad: Transfer fiyatlandırması ve örtülü sermaye, agirlik: {ymm: 18}, kazanimlar: [KVK md.13 emsallere uygunluk ve yöntemler, örtülü kazanç dağıtımı, KVK md.12 örtülü sermaye, düzeltme işlemleri]}
      - {kod: BDB, ad: Birleşme devir bölünme ve tür değişikliği, agirlik: {ymm: 18}, kazanimlar: [KVK md.18-20 devir ve bölünme şartları, tasfiye, nev'i değişikliği, devralınan zararların mahsubu]}
      - {kod: MTR, ad: Matrah ve beyan teknikleri, agirlik: {ymm: 18}, kazanimlar: [ticari bilanço kârından mali kâra geçiş, istisnalar ve indirimlerin sırası, geçmiş yıl zararları, geçici vergi, asgari kurumlar vergisi]}
      - {kod: TSV, ad: Teşvikler ve özel uygulamalar, agirlik: {ymm: 14}, kazanimlar: [yatırım teşvik belgesi ve indirimli kurumlar vergisi, Ar-Ge ve tasarım indirimi, nakdi sermaye artırımı indirimi, ihracat ve hizmet ihracatı indirimi]}
      - {kod: CEZ, ad: Vergi cezaları ve uzlaşma, agirlik: {ymm: 14}, kazanimlar: [vergi ziyaı ve usulsüzlük cezaları, pişmanlık ve ıslah, uzlaşma ve izaha davet, ceza indirimi]}

  - kod: GUV
    hesapli: true
    ad: Gelir Üzerinden Alınan Vergiler
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [gvk, kvk, gv_teblig, gvk_teblig, kv_genel_teblig, kv_teblig, yerel_kuresel_asgari]
    konular:
      - {kod: GVM, ad: Gelir vergisi mükellefiyeti ve kazanç unsurları, agirlik: {ymm: 18}, kazanimlar: [tam ve dar mükellefiyet, ticari ve zirai kazanç, ücret, serbest meslek kazancı, gayrimenkul ve menkul sermaye iradı, diğer kazanç ve iratlar]}
      - {kod: GVI, ad: Gelir vergisinde istisna indirim ve beyan, agirlik: {ymm: 16}, kazanimlar: [muafiyet ve istisnalar, gelirin toplanması ve indirimler, vergi tarifesi, beyan ve ödeme, tevkifat (GVK md.94)]}
      - {kod: KVM, ad: Kurumlar vergisi mükellefiyeti ve matrah, agirlik: {ymm: 20}, kazanimlar: [kurumlar vergisi mükellefleri, kurum kazancının tespiti, kanunen kabul edilmeyen giderler (KVK md.11), zarar mahsubu]}
      - {kod: KVI, ad: Kurumlar vergisinde istisnalar, agirlik: {ymm: 18}, kazanimlar: [iştirak kazançları istisnası, yurt dışı iştirak ve şube kazançları, taşınmaz ve iştirak hissesi satış istisnası, emisyon primi]}
      - {kod: DAR, ad: Dar mükellefiyet ve uluslararası vergilendirme, agirlik: {ymm: 14}, kazanimlar: [dar mükellef kurumların vergilendirilmesi, KVK md.30 tevkifat, çifte vergilendirmeyi önleme anlaşmaları, kontrol edilen yabancı kurum]}
      - {kod: ASG, ad: Asgari ve küresel asgari kurumlar vergisi, agirlik: {ymm: 14}, kazanimlar: [yurt içi asgari kurumlar vergisi, yerel ve küresel asgari tamamlayıcı vergi, uygulama kapsamı ve istisnalar]}

  - kod: HSV
    hesapli: true
    ad: Harcama ve Servet Üzerinden Alınan Vergiler
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [kdvk, kdv_gut, otvk, otv_, dvk, harclar, evk, vivk, mtvk]
    konular:
      - {kod: KDV, ad: KDV konusu mükellefiyet ve vergiyi doğuran olay, agirlik: {ymm: 18}, kazanimlar: [verginin konusu ve Türkiye'de yapılma, mükellef ve sorumlu, vergiyi doğuran olay, matrah ve oranlar]}
      - {kod: KIS, ad: KDV istisnaları ve iade, agirlik: {ymm: 22}, kazanimlar: [ihracat ve hizmet ihracı istisnası, diğer istisnalar (KDVK md.13-17), indirim (md.29-30), iade usulü ve teminat, tevkifat]}
      - {kod: OTV, ad: Özel tüketim vergisi, agirlik: {ymm: 16}, kazanimlar: [ÖTV listeleri, vergiyi doğuran olay ve matrah, ihracat istisnası ve iade, ÖTV'nin KDV matrahına etkisi]}
      - {kod: DMG, ad: Damga vergisi ve harçlar, agirlik: {ymm: 16}, kazanimlar: [damga vergisinin konusu ve kağıt kavramı, nispi ve maktu vergi, istisnalar, harç türleri]}
      - {kod: SRV, ad: Servet vergileri, agirlik: {ymm: 16}, kazanimlar: [emlak vergisi matrah ve oranları, veraset ve intikal vergisi, motorlu taşıtlar vergisi]}
      - {kod: USL, ad: Harcama vergilerinde usul ve cezalar, agirlik: {ymm: 12}, kazanimlar: [beyan ve ödeme süreleri, sorumluluk uygulamaları, sahte belge ve KDV'ye etkisi]}

  - kod: DTK
    ad: Dış Ticaret ve Kambiyo Mevzuatı
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [gumruk, tpkk_32, kdvk]
    konular:
      - {kod: GMR, ad: Gümrük mevzuatı temelleri, agirlik: {ymm: 22}, kazanimlar: [4458 sayılı Kanun kapsam ve tanımlar, gümrük vergisi ve gümrük kıymeti, menşe, gümrük beyanı ve yükümlülükler, gümrük borcu]}
      - {kod: REJ, ad: Gümrük rejimleri, agirlik: {ymm: 20}, kazanimlar: [serbest dolaşıma giriş, transit, antrepo, dahilde ve hariçte işleme, geçici ithalat, ihracat rejimi]}
      - {kod: IHI, ad: İhracat ve ithalat işlemleri, agirlik: {ymm: 16}, kazanimlar: [ihracat türleri ve teslim şekilleri, ithalat işlemleri, teslim şekilleri (Incoterms) ve ödeme yöntemleri, akreditif]}
      - {kod: KMB, ad: Kambiyo mevzuatı, agirlik: {ymm: 24}, kazanimlar: [32 sayılı Karar genel esaslar, döviz ve kıymet ithali ve ihracı, ihracat bedellerinin yurda getirilmesi, döviz cinsinden sözleşme yasağı ve istisnaları, sermaye hareketleri]}
      - {kod: VRG, ad: Dış ticaretin vergisel boyutu, agirlik: {ymm: 18}, kazanimlar: [ithalde KDV ve ÖTV, ihracat istisnası ve iadesi, gümrük cezaları ve uzlaşma, serbest bölgeler]}

  - kod: SPM
    ad: Sermaye Piyasası Mevzuatı
    soru: {YMM: 1}
    hedef: 360
    kaynak_dosyalari: [spkn, spk_]
    konular:
      - {kod: GEN, ad: SPKn genel hükümler ve Kurul, agirlik: {ymm: 14}, kazanimlar: [Kurulun görev ve yetkileri, tanımlar, sermaye piyasası kurumları]}
      - {kod: IHR, ad: İhraç ve halka arz, agirlik: {ymm: 18}, kazanimlar: [izahname ve ihraç belgesi, satış yöntemleri, izahnameden sorumluluk, borçlanma araçları]}
      - {kod: HAO, ad: Halka açık ortaklıklar, agirlik: {ymm: 22}, kazanimlar: [özel durumların kamuya açıklanması, kurumsal yönetim, kâr payı dağıtımı, önemli nitelikteki işlemler ve ayrılma hakkı, kayıtlı sermaye, birleşme ve bölünme]}
      - {kod: YKF, ad: Yatırım kuruluşları ve kolektif yatırım, agirlik: {ymm: 18}, kazanimlar: [yatırım hizmetleri ve faaliyetleri, yatırım fonları, gayrimenkul yatırım ortaklıkları, kitle fonlaması, kripto varlık hizmet sağlayıcıları]}
      - {kod: DNT, ad: Finansal raporlama ve bağımsız denetim, agirlik: {ymm: 12}, kazanimlar: [SPK finansal raporlama yükümlülükleri, bağımsız denetim kuruluşları, değerleme kuruluşları]}
      - {kod: SUC, ad: Suçlar ve yaptırımlar, agirlik: {ymm: 16}, kazanimlar: [piyasa dolandırıcılığı, bilgi suistimali, güveni kötüye kullanma, idari para cezaları ve tedbirler]}
