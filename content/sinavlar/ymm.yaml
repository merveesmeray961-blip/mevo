# YMM sınav formatı
# Kaynak: YMM ve SMMM Sınav Yönetmeliği (content/kaynaklar/mevzuat/sinav_yon.txt).
# Etiket: [R] = resmî metinden okundu · [?] = teyit edilmedi

sinav: ymm
ad: Yeminli Mali Müşavirlik Sınavı
duzenleyen: TÜRMOB / TESMER
resmi_baglanti_yok_ibaresi: "Bu uygulamanın TÜRMOB veya TESMER ile resmî bir bağlantısı yoktur."

bolumler:
  - kod: YMM
    ad: Yeminli Mali Müşavirlik Sınavı
    yontem: klasik                                            # [R] md. 5/c test seçeneğini yalnız SMMM için Birlik'e bırakır
    ders_sayisi: 10                                           # [R] md. 14/a; her dersten ayrı sınav
    sinav_zamani: "Yılda üç kez"                              # [R] md. 8
    yanlis_cezasi: 0
    gecme:                                                    # [R] md. 16/a
      ders_min: 50
      ortalama_min: 65
    sinav_hakki: "İlk sınav tarihinden itibaren 2 yıl içinde yılda 3 kez açılan tüm sınavlar; sonra 6 ay bekleme"   # [R] md. 21
    ders_sure_dakika: null                                    # [?] ilanla belirlenir; uygulamadaki klasik denemenin süresi soruların süre toplamıdır
