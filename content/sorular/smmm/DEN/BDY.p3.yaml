- id: SMMM-DEN-BDY-0006
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: 'denetim ekipleri: asgari denetçi sayısı, denetime yardımcı kişiler ve yedek denetçiler (md. 27)'
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: '(Y) AŞ''nin bağımsız denetimi için denetim kuruluşunca oluşturulan ekip şu kişilerden oluşmaktadır: sorumlu
    denetçi, bu denetim için yetkisi bulunan bir denetçi, bu denetim için yetkisi bulunmayan bir denetçi, bir denetçi
    yardımcısı ve teknik bilgisine başvurulan bir bilgi sistemleri uzmanı. Ekip için yedek denetçiler belirlenmiştir;
    Kurum tarafından bu işletme için farklı bir asgari denetçi sayısı belirlenmemiştir. KGK Bağımsız Denetim Yönetmeliği''nin
    denetim ekiplerine ilişkin hükümlerine göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Yetkisi bulunmayan denetçi, yardımcı ve uzman, denetçi olarak görevlendirilmemek kaydıyla ekipte yer alabilir;
      ancak asgari denetçi sayısına dahil edilmediklerinden ekip, üç denetçiden az olamaz şartını sağlamamaktadır.
    B: Ekipte beş kişi bulunduğundan denetim ekibinin asgari büyüklük şartı sağlanmıştır; yalnızca uzmanın denetimin
      hiçbir aşamasında karar verici konumda olmaması gerekir.
    C: Yetkisi bulunmayan denetçi denetim ekibinde hiçbir sıfatla yer alamaz; bu kişi ekipten çıkarıldığında kalan
      dört kişilik ekip asgari sayı şartını sağlamış olur.
    D: Yetkisi bulunmayan denetçi, denetçi unvanını taşıdığı için asgari denetçi sayısına dahil edilir; denetçi
      yardımcısı ile uzman dahil edilmediğinden ekip üç denetçiden oluşmuş sayılır.
    E: Ekibin asgari denetçi sayısı şartını sağlayabilmesi için denetçi yardımcısı sayısının bir artırılması yeterlidir;
      çünkü yardımcılar da asgari sayı hesabında dikkate alınır.
  dogru: A
  aciklama:
    dogru_neden: 'BDY md. 27/1''e göre denetim ekipleri üç denetçiden az olamaz. Md. 27/3''e göre söz konusu denetim
      için yetkisi bulunmayan denetçiler, denetçi yardımcıları ve teknik bilgisine başvurulan uzmanlar (bilgi sistemleri
      uzmanları dâhil) denetçi olarak görevlendirilmemek kaydıyla ekipte yer alabilir; ancak bu kişiler asgari denetçi
      sayısı hesabında dikkate alınmaz. Ekipte yalnızca iki yetkili denetçi (sorumlu denetçi ve yetkisi bulunan
      denetçi) vardır; yedek denetçilerin belirlenmiş olması bu eksikliği gidermez. Dolayısıyla ekip asgari sayı
      şartını sağlamamaktadır.


      Püf noktaları: Md. 27/1 (asgari sayı) ile 27/3 (kimlerin sayıya dahil edilmediği) birlikte okunur. Kişi sayısı
      değil, yetkili denetçi sayısı önemlidir. Yedek denetçi bilgisi çözüme etki etmeyen gereksiz veridir. Tuzaklar:
      yetkisi olmayan denetçiyi unvanı nedeniyle saymak; ekipteki toplam kişi sayısına bakmak; yardımcı sayısını
      artırarak sayıyı tamamlayabileceğini sanmak.'
    celdiriciler:
      B: Asgari şart ekipteki toplam kişi sayısına göre değil, denetçi sayısına göre aranır; denetçi yardımcısı,
        uzman ve yetkisiz denetçi md. 27/3 uyarınca asgari denetçi sayısı hesabında dikkate alınmaz.
      C: Md. 27/3, yetkisi bulunmayan denetçilerin de denetçi olarak görevlendirilmemek kaydıyla ekipte yer almasına
        izin verir; ayrıca yetkisi bulunmayan denetçi çıkarıldığında kalan dört kişide yetkili denetçi sayısı yine
        iki olduğundan şart sağlanmaz.
      D: Md. 27/3, yetkisi bulunmayan denetçileri de asgari denetçi sayısı hesabı dışında bırakır; unvanı taşımaları
        sayıya dahil edilmeleri için yeterli değildir.
      E: Md. 27/3'e göre denetçi yardımcıları asgari denetçi sayısı hesabında dikkate alınmaz; sayısının artırılması
        şartı sağlamaz.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/1
    alinti: Ancak denetim ekipleri üç denetçiden az olamaz. Denetim ekiplerindeki sorumlu denetçi ve belirlenen
      diğer kademeler için en az birer yedek denetçi belirlenir.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/3 (ilk cümle)
    alinti: Denetim ekiplerinde; söz konusu denetim için yetkisi bulunmayan denetçiler, denetçi yardımcıları, bilgi
      sistemleri denetimi de dahil olmak üzere teknik bilgisine başvurulacak uzmanlar ve denetime yardımcı diğer
      kişiler de denetçi olarak görevlendirilmemek kaydıyla yer alabilir.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/3 (son cümle)
    alinti: Bu kişiler, asgari denetçi sayısı hesabında dikkate alınmaz ve genel hükümler, bağımsızlık, tarafsızlık
      ve sır saklama yükümlülükleri saklı kalmak kaydıyla denetimden sorumlu tutulmaz.
