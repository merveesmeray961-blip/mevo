    B: Uzman ekipte yer alabilir; ancak asgari denetçi sayısı hesabına dahil edilmez ve karar verici olamaz.
    C: Uzman ekipte yer alabilir ve bir denetçi yerine sayılır; teknik konularda karar verme yetkisi de olabilir.
    D: Üç yetkili denetçi yeterli değildir; bankalarda uzman dördüncü denetçi sayılarak ekip dört denetçiyle kurulmalıdır.
    E: Uzman ekipte ancak sorumlu denetçi olarak görevlendirilirse yer alabilir; diğer kademelerde görev alamaz.
  dogru: B
  aciklama:
    dogru_neden: Md. 27/1 denetim ekiplerinin üç denetçiden az olamayacağını düzenler. Md. 27/3 ise teknik bilgisine
      başvurulan uzmanların ekipte yer alabileceğini, ancak bu kişilerin asgari denetçi sayısı hesabında dikkate
      alınmadığını ve denetimin herhangi bir aşamasında karar verici konumunda bulunamayacağını belirtir. Olaydaki
      üç yetkili denetçi asgari sayıyı karşılar.
    celdiriciler:
      A: Md. 27/3 uzmanların ekipte yer almasına açıkça izin verir.
      C: Uzman asgari denetçi sayısına dahil edilmez ve karar verici olamaz.
      D: Üç denetçi zaten md. 27/1'deki asgari sayıyı karşılar; uzman ayrıca denetçi sayılmaz.
      E: Uzmanın sorumlu denetçi olması şartı kaynakta yer almamaktadır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/1
    alinti: "Ancak denetim ekipleri üç denetçiden az olamaz. Denetim ekiplerindeki sorumlu denetçi ve belirlenen\
      \ diğer kademeler için en\naz birer yedek denetçi belirlenir. Yedek denetçiler yerini aldıklarının sorumluluklarını\
      \ üstlenebilecek nitelikte olmalıdır. Denetime tabi işletmelerin\nözellikleri itibarıyla, Kurum tarafından\
      \ farklı asgari denetçi ve yedek denetçi sayıları belirlenebilir.\n        (2) Belirli alanların düzenlenmesi\
      \ ve denetlenmesinden sorumlu kurum, kurul veya kuruluşların görüşlerini alarak, bu alanlarda denetim\nfaaliyetinde\
      \ bulunacaklar için Kurum ilave şartlar belirleyebilir.…"
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/3
    alinti: 'Denetim ekiplerinde; söz konusu denetim için yetkisi bulunmayan denetçiler, denetçi yardımcıları, bilgi
      sistemleri denetimi de dahil olmak

      üzere teknik bilgisine başvurulacak uzmanlar ve denetime yardımcı diğer kişiler de denetçi olarak görevlendirilmemek
      kaydıyla yer alabilir. 19/10/2005

      tarihli ve 5411 sayılı Bankacılık Kanununda tanımlanan bankalar ve Kurumca belirlenen diğer işletmelerin denetimlerinde
      bilgi sistemleri denetimi

      konusunda Kurumca öngörülen şartları taşıyan yeterli sayıda denetçi ya da uzman bulundurulur.…'
