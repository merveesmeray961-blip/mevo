      yönetici olarak görev alabilir.
    B: Kilit yönetici, denetim kuruluşunun ortakları arasından belirlenen kişidir; denetçi, görevden ayrıldıktan
      sonra iki yıl geçmedikçe son iki yılda denetlediği bağlı ortaklıklarda değil, ana işletmede kilit yönetici
      olamaz.
    C: Kilit yönetici tanımı yönetim organı üyelerini kapsamaz, üst düzey yöneticileri ifade eder; denetçi, görevden
      ayrıldıktan sonra iki yıl geçmedikçe son iki yılda denetlediği işletmede kilit yönetici olamaz.
