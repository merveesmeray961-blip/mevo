  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: kısıtlamalar ve rotasyon
  tip: uygulama
  zorluk: 2
  kok: KGK Bağımsız Denetim Yönetmeliği md. 26 uyarınca, bir denetim kuruluşu son on yılda aynı işletmenin denetiminde toplam
    yedi yıl görev almıştır. Bu kuruluşun, üç yıl beklemeden aynı işletmenin denetimini yeniden üstlenmesi durumunda aşağıdaki
    hükümlerden hangisi uygulanır?
  secenekler:
    A: Denetim üstlenilebilir; çünkü rotasyon kuralı yalnızca bireysel denetçiler için geçerlidir.
    B: Denetim üstlenilemez; üç yıl geçmedikçe aynı işletmeye ilişkin denetim yapılamaz.
    C: Denetim üstlenilebilir; çünkü on yıllık sürede yedi yıl sınırı aşılmamıştır.
    D: Denetim üstlenilebilir; yalnızca sorumlu denetçinin değiştirilmesi yeterlidir.
    E: Denetim üstlenilemez; ancak aynı ağ içindeki başka bir kuruluş üstlenebilir.
  dogru: B
  aciklama:
    dogru_neden: 'BDY md. 26/1-(ç)''ye göre denetim kuruluşları ve denetim üstlenen bağımsız denetçiler ile denetim çalışması
      yürüttükleri işletmelerin denetiminde görev alan denetçileri, son on yılda yedi yıl denetim çalışmasını yürüttükleri
      aynı işletmeye ilişkin denetimleri üç yıl geçmedikçe üstlenemezler. Püf noktaları: Süre hesabında ağ içi ve bireysel
