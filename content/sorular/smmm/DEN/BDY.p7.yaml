  kok: Bir denetçi KAYİK olmayan bir işletmenin bağımsız denetiminde sorumlu denetçi olmak istemektedir. 11 yıllık mesleki
    tecrübesi vardır; ancak bu sürenin yalnızca bir yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanıyla denetimlerde
    bulunmuştur. Diğer şartları sağladığı varsayılırsa aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Şartları sağlar; toplam 10 yıllık tecrübe yeterlidir.
    B: Şartları sağlamaz; diğer denetimlerde en az iki yıl fiilen ilgili unvanlarla denetimlerde bulunmuş olmalıdır.
    C: Şartları sağlar; fiili denetim süresi yalnız KAYİK denetimlerinde aranır.
    D: Şartları sağlamaz; diğer denetimlerde toplam tecrübenin en az 15 yıl olması gerekir.
    E: Şartları sağlar; sorumlu denetçi için fiili denetim süresi aranmaz
  dogru: B
  aciklama:
    dogru_neden: Md. 28/1-b'ye göre KAYİK dışındaki denetimler için sorumlu denetçinin 10 yıllık mesleki tecrübeye sahip olması
      ve bu sürenin en az iki yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile denetimlerde bulunmuş olması
      gerekir. Olayda toplam tecrübe yeterli olsa da fiili denetim süresi bir yıldır.
    celdiriciler:
      A: Toplam 10 yıl şartı yanında en az iki yıllık fiili denetim şartı da vardır.
      C: Fiili denetim süresi yalnız KAYİK denetimleri için değil, diğer denetimler için de aranır.
      D: KAYİK dışı denetimler için toplam tecrübe 15 değil 10 yıldır.
      E: Md. 28/1-b fiili denetim süresini açıkça şart koşar.
