      dikkate alınır.
    E: İki yıl geçmedikçe yeniden üstlenemez; süre hesabında denetçilerin kişisel süreleri dikkate alınmaz.
  dogru: D
  aciklama:
    dogru_neden: 'BDY md. 26/1-(ç)’ye göre üç yıl geçmedikçe; denetim kuruluşları ve denetim üstlenen bağımsız denetçiler
      ile denetim çalışması yürüttükleri işletmelerin denetiminde görev alan denetçileri, son on yılda yedi yıl
      denetim çalışmasını yürüttükleri aynı işletmeye ilişkin denetimleri üstlenemezler. Md. 26/2’ye göre sürelerin
      hesabında aynı denetim ağı içinde bulunan denetim kuruluşları ve denetim üstlenen bağımsız denetçiler ile
      bunların ilişkili olduğu denetim kuruluşu ve denetim üstlenen bağımsız denetçiler tarafından yapılan denetimlerde
      geçirdikleri süreler topluca dikkate alınır. Çalıştığı denetim kuruluşuna bakılmaksızın denetçinin aynı işletmenin
      denetiminde geçirdiği süreler birlikte dikkate alınır. Püf noktaları: Rotasyon kuralı 7/10 + 3 yıl cool-off’tur;
      ağ içi süreler birleştirilir.'
    celdiriciler:
