  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: denetim ekipleri
  tip: uygulama
  zorluk: 3
  kok: Bir banka denetimi için ekipte üç yetkili denetçi ve teknik bilgisine başvurulacak bir bilgi sistemleri uzmanı görevlendirilmiştir.
    Uzmanın teknik incelemelerde görev alması planlanmakta, ancak denetimin herhangi bir aşamasında karar verici olması planlanmamaktadır.
    Buna göre aşağıdakilerden hangisi Yönetmeliğe uygundur?
  secenekler:
    A: Uzman ekipte yer alamaz; ekip yalnız denetçilerden oluşmalıdır.
    B: Uzman ekipte yer alabilir ve üç yetkili denetçiye ek olarak görev yapabilir; ancak asgari denetçi sayısı hesabına dahil
      edilmez ve karar verici olamaz.
    C: Uzman ekipte yer alabilir ve bir denetçi yerine sayılır; karar verme yetkisi de olabilir.
    D: Üç yetkili denetçi yeterli değildir; uzman mutlaka dördüncü denetçi sayılır.
    E: Uzman ekipte ancak sorumlu denetçi olarak görevlendirilirse yer alabilir
  dogru: B
  aciklama:
    dogru_neden: Md. 27/1 denetim ekiplerinin üç denetçiden az olamayacağını düzenler. Md. 27/3 ise teknik bilgisine başvurulan
      uzmanların ekipte yer alabileceğini, ancak bu kişilerin asgari denetçi sayısı hesabında dikkate alınmadığını ve denetimin
      herhangi bir aşamasında karar verici konumunda bulunamayacağını belirtir. Olaydaki üç yetkili denetçi asgari sayıyı
      karşılar.
    celdiriciler:
      A: Md. 27/3 uzmanların ekipte yer almasına açıkça izin verir.
      C: Uzman asgari denetçi sayısına dahil edilmez ve karar verici olamaz.
      D: Üç denetçi zaten md. 27/1'deki asgari sayıyı karşılar; uzman ayrıca denetçi sayılmaz.
      E: Uzmanın sorumlu denetçi olması şartı kaynakta yer almamaktadır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 27/1
    alinti: "Ancak denetim ekipleri üç denetçiden az olamaz. Denetim ekiplerindeki sorumlu denetçi ve belirlenen diğer kademeler\
      \ için en\naz birer yedek denetçi belirlenir. Yedek denetçiler yerini aldıklarının sorumluluklarını üstlenebilecek nitelikte\
