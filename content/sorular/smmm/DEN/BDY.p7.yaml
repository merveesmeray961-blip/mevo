    D: 12 yıllık mesleki tecrübe ve bu sürenin en az dört yılında fiilen başdenetçi unvanı ile denetimlerde bulunmuş olmak
    E: 20 yıllık mesleki tecrübe ve herhangi bir fiili denetim şartı aranmaksızın
