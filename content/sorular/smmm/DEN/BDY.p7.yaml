    C: Yalnızca yönetim kurulu üyesi kilit yönetici kapsamına girer.
    D: Hiçbiri kilit yönetici sayılamaz; bu kavram yalnızca genel müdürü ifade eder.
    E: Teknik çalışan, şirkette çalıştığı için; yönetim kurulu üyesi ise yalnızca yönetim organı üyesi olduğu için kilit yöneticidir
