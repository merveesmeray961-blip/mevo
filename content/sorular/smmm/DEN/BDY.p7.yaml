      A: Bu şart md. 28/1-(b)’de ‘diğer denetimler’ için geçerlidir.
      C: Yönetmelikte 5 yıllık tecrübe şartı yoktur.
      D: Yönetmelikte 12 yıl ve dört yıl şartı yer almaz.
      E: Fiili denetim şartı zorunludur; 20 yıl şartı yoktur.
