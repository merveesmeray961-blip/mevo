  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: sözleşme
  tip: uygulama
  zorluk: 3
  kok: Bir denetim kuruluşunun seçildiği hesap döneminde denetlenen işletme sözleşmeyi imzalamaktan kaçınmaktadır.
    Denetimi üstlenen, işletmeye süresi içinde yazılı ihtar göndermiştir. Yönetmeliğe göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Sözleşme seçimden itibaren en geç 60 gün içinde yapılır; işletme yazılı ihtara rağmen kaçınırsa durum izleyen
      10 gün içinde Kuruma bildirilir.
    B: Sözleşme seçimden itibaren en geç 30 gün içinde yapılır; kaçınma halinde durum 60 gün içinde Kuruma bildirilir.
    C: Sözleşme için süre öngörülmemiştir; ihtar mahkemeye yapılır ve Kuruma bildirim yükümlülüğü doğmaz.
    D: Sözleşme seçimden itibaren 90 gün içinde yapılır; kaçınma halinde Kuruma bildirim yapılmaz.
    E: Sözleşme seçimden itibaren 60 gün içinde yapılır; kaçınma halinde Kuruma bildirim yapılabilmesi için ayrıca
      30 gün beklenir ve bildirim yazılı ihtardan önce yapılamaz.
  dogru: A
  aciklama:
    dogru_neden: Md. 29/3'e göre denetim sözleşmesi, denetim kuruluşu veya denetim üstlenen bağımsız denetçinin
      seçiminden itibaren en geç 60 gün içinde yapılır. Denetlenen işletme, yazılı ihtara rağmen sözleşme yapmaktan
      kaçınırsa denetimi üstlenen durumu izleyen 10 gün içinde Kuruma bildirir.
    celdiriciler:
      B: Kaynakta 30 ve 60 günlük süreler değil, 60 günlük sözleşme ve izleyen 10 günlük bildirim süresi vardır.
      C: Yönetmelik hem sözleşme için süre hem de kaçınma halinde Kuruma bildirim düzenler.
      D: Sözleşme süresi 90 gün değildir; kaçınma halinde bildirim öngörülmüştür.
      E: Kaçınma halinde ayrıca 30 gün beklenmez; izleyen 10 gün içinde bildirim yapılır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 29/3
    alinti: 'Denetim sözleşmesi, Türk Ticaret Kanunu uyarınca denetim kuruluşu veya denetim üstlenen bağımsız

      denetçinin seçildiği hesap dönemi için, denetim kuruluşu veya denetim üstlenen bağımsız denetçinin seçiminden
      itibaren en geç 60 gün içinde yapılır. Bu

      süre içinde, denetimi üstlenenin yazılı ihtarına rağmen denetlenen işletme sözleşme yapmaktan kaçınırsa, denetimi
      üstlenen durumu izleyen 10 gün

