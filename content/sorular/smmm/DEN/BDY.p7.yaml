  secenekler:
    A: 10 yıllık mesleki tecrübe ve bu sürenin en az iki yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile
      denetimlerde bulunmuş olmak
    B: 15 yıllık mesleki tecrübe ve bu sürenin en az üç yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile
      mevzuatta denetim öngörülen alanlarda denetimlerde bulunmuş olmak
