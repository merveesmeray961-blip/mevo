    ise yalnızca kendisine verilen teknik görevi yerine getirmekte, şirket faaliyetlerini planlama, yönetme veya kontrol etme
    konusunda doğrudan ya da dolaylı yetki ve sorumluluk taşımamaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
