  kok: KGK Bağımsız Denetim Yönetmeliği’ne göre bir denetim kuruluşu, aynı KAYİK olmayan işletmenin denetiminde
    son 10 yılda 7 yıl görev almıştır. Bu işletmenin denetimini yeniden üstlenebilmesi için gerekli minimum bekleme
    süresi ve süre hesabına ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Bekleme süresi yoktur; yedi yıl dolduktan sonra denetim hemen yeniden üstlenilebilir, ağ içi süreler ayrıca
      aranmaz.
    B: On yıl geçmedikçe yeniden üstlenemez; süre hesabında aynı ağ içindeki kuruluşların süreleri dikkate alınmaz.
    C: Beş yıl geçmedikçe yeniden üstlenemez; süre hesabında kendi kuruluşunun süreleri dikkate alınır, ağ içi süreler
