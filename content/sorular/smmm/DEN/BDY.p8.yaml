  tip: kavrama
  zorluk: 3
  kok: Denetim raporunun, denetim kanıtlarının TDS çerçevesinde değerlendirilmesi sonucunda oluşturulan görüşü kullanıcıların
    istifadesine sunan belge olduğu kabul edilmektedir. Aşağıdakilerden hangisi Yönetmeliğin denetim raporuna ilişkin
    tanımıyla uyumludur?
  secenekler:
    A: Rapor, denetim ekibinin çalışma kâğıtlarındaki kayıtların özetini içerir; denetçi görüşü içermez ve denetlenen
      işletmenin yönetimine iç bilgi amacıyla sunulur.
    B: Rapor, denetlenen işletmenin yönetimi tarafından hazırlanıp sorumlu denetçiye onaylatılan ve finansal tabloların
      doğruluğuna ilişkin beyanları içeren belgedir.
    C: Rapor, kanıtların TDS çerçevesinde değerlendirilmesi sonucunda oluşan denetçi görüşünü ve varsa dikkat çekilmek
      istenen diğer hususları kullanıcıların istifadesine sunmak amacıyla hazırlanır.
    D: Rapor, denetim kuruluşunun kalite yönetim sistemi kapsamındaki iç incelemelerin sonuçlarını içerir ve Kuruma
      bildirilmek üzere hazırlanan bir belgedir.
    E: Rapor, denetim sözleşmesi imzalanmadan önce denetçinin ön değerlendirmelerini içeren ve tarafların sorumluluklarını
      belirleyen bir ön yazışmadır.
  dogru: C
  aciklama:
    dogru_neden: 'BDY md. 10/1, denetim raporunu denetim kanıtlarının TDS çerçevesinde değerlendirilmesi sonucunda,
      belirlenen güvence seviyesine uygun şekilde oluşturulan denetçi görüşünü ve varsa dikkat çekilmek istenen
      diğer hususları kullanıcıların istifadesine sunmak amacıyla hazırlanan ve imzalanan belge olarak tanımlar.
      Püf noktaları: Tanımın ayırt edici unsurları kanıtların değerlendirilmesi, güvence seviyesi, görüş ve varsa
      diğer hususlardır.'
    celdiriciler:
      A: Rapor çalışma kâğıdı özeti değil, denetçi görüşünü içeren belgedir (md. 10/1).
      B: Raporu denetim kuruluşu veya denetim üstlenen bağımsız denetçi hazırlar ve sorumluluğunu üstlenir.
      D: Kalite yönetim sistemi incelemeleri rapor tanımına girmez; rapor kullanıcılara görüş sunar.
