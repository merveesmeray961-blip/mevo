  tip: kavrama
  zorluk: 3
  kok: Bir anonim şirketin faaliyetlerini planlama yetkisine doğrudan sahip olan genel müdür yardımcısı ile şirketin
    faaliyetlerini yalnızca kontrol etme konusunda dolaylı yetki ve sorumluluğu bulunan bir yönetici yardımcısı
    bulunmaktadır. Bağımsız Denetim Yönetmeliği'ndeki tanıma göre bu kişilerden hangisi veya hangileri kilit yönetici
    kapsamındadır?
  secenekler:
    A: Yönetim organı üyesi olan kişi kilit yöneticidir; yönetim organı üyesi olmayan yöneticiler bu kapsama girmez.
    B: Faaliyetleri fiilen yöneten kişi kilit yöneticidir; kontrol yetkisi dolaylı olan kişi bu kapsama girmez.
    C: İkisi de kilit yöneticidir; tanım, planlama, yönetme veya kontrol etme yetki ve sorumluluğunun doğrudan ya
      da dolaylı olmasını kapsar.
    D: İkisi de kilit yönetici değildir; bu sıfat şirketin ortaklık yapısına göre belirlenir ve ortak olmayanlar
      kapsam dışındadır, yönetim yetkisi önem taşımaz.
    E: Yönetim organı başkanı kilit yöneticidir; genel müdür yardımcısı ve yönetici yardımcısı bu kapsamda değildir.
  dogru: C
  aciklama:
    dogru_neden: 'BDY md. 4/1-(m), kilit yöneticiyi yönetim organı üyeleri dahil olmak üzere şirketin faaliyetlerini
      planlama, yönetme veya kontrol etme yetki ve sorumluluğuna doğrudan veya dolaylı olarak sahip kişiler olarak
      tanımlar. Püf noktaları: Tanım yalnızca yönetim organı üyelerine veya fiilî yönetime indirgenmemiş; üç farklı
      yetki alanını ve doğrudan/dolaylı sahipliği birlikte kapsar.'
    celdiriciler:
      A: Tanım yönetim organı üyelerini kapsar ancak bu kişilerle sınırlı değildir.
      B: Tanım kontrol etme yetki ve sorumluluğunun dolaylı olarak sahip olunmasını da kapsar.
      D: Kilit yönetici tanımı ortaklık sıfatına bağlanmamıştır.
      E: Tanım yönetim organı başkanına özgülenmemiştir.
