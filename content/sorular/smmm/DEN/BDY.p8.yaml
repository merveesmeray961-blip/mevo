      bulunmalı; kendisi ve denetçileri başka bir denetim kuruluşunda veya başka bir bağımsız denetçi yanında ortak,
      kilit yönetici ya da denetçi olarak görev yapmamalıdır. Her iki şart da sağlanmadığından E doğrudur.
    celdiriciler:
      A: Kalite yönetim sistemi ayrı bir şarttır; diğer kadro ve görev şartlarını ortadan kaldırmaz.
      B: Kendisi hariç sorumlu denetçi bulunması şartı kendi adına denetim üstlenme için genel olarak aranır.
      C: Yönetmelik başka kuruluştaki ortaklık için bir pay eşiği öngörmez; görev bulunması şartlara aykırıdır.
      D: Kendisi hariç en az bir sorumlu denetçi aranır; denetçi yardımcıları bu şartı karşılamaz.
