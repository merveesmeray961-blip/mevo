- id: SMMM-DEN-BDY-0071
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: kilit yönetici
  tip: uygulama
  zorluk: 3
  kok: Bir denetim kuruluşunda şirketin faaliyetlerini fiilen planlayan, yöneten ve kontrol eden bir yönetim organı üyesi
    ile bu faaliyetler üzerinde doğrudan yetkisi bulunmayan, yalnız teknik raporlama yapan bir uzman bulunmaktadır. Bağımsız
    Denetim Yönetmeliği'ndeki “kilit yönetici” tanımına göre aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: Yalnız yönetim organı üyesi unvanı nedeniyle kilit yöneticidir; faaliyetleri planlama, yönetme veya kontrol etme yetkisi
      aranmaz.
    B: Teknik raporlama yapan uzman, şirkette çalıştığı için kilit yöneticidir.
    C: Kilit yönetici yalnız şirketin ortakları arasından seçilebilir.
    D: Faaliyetleri planlama, yönetme veya kontrol etme yetki ve sorumluluğuna doğrudan veya dolaylı sahip olan kişi, yönetim
      organı üyesi olup olmamasına bakılmaksızın tanım kapsamına girebilir; yalnız teknik raporlama yapmak tek başına yeterli
      değildir.
    E: Kilit yönetici tanımı yalnız denetim ekibinin sorumlu denetçisini kapsar.
  dogru: D
  aciklama:
    dogru_neden: 'Bağımsız Denetim Yönetmeliği md. 4''te kilit yönetici, yönetim organı üyeleri dahil olmak üzere şirketin
      faaliyetlerini planlama, yönetme veya kontrol etme yetki ve sorumluluğuna doğrudan veya dolaylı olarak sahip olan kişiler
      olarak tanımlanır. Bu nedenle belirleyici ölçüt yalnız unvan değil, söz konusu yetki ve sorumluluktur. Püf noktaları:
      Tanım hem yönetim organı üyelerini kapsar hem de “dahil olmak üzere” ifadesiyle bunlarla sınırlı değildir; doğrudan
      veya dolaylı yetki ve sorumluluk aranır.'
    celdiriciler:
      A: Tanım yönetim organı üyelerini kapsar ancak yalnız unvanı yeterli saymaz; faaliyetleri planlama, yönetme veya kontrol
        etme yetki ve sorumluluğu belirleyicidir.
      B: Teknik raporlama görevi, şirket faaliyetlerini planlama, yönetme veya kontrol etme yetki ve sorumluluğu bulunmadıkça
        tek başına tanımı karşılamaz.
      C: Tanım ortaklık şartı getirmez; yönetim organı üyeleri dahil yetki ve sorumluluk ölçütünü kullanır.
      E: Kilit yönetici tanımı sorumlu denetçiyle sınırlı değildir; şirket faaliyetlerini planlama, yönetme veya kontrol etme
        yetki ve sorumluluğuna sahip kişileri kapsar.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 4/1-(m)
    alinti: 'Kilit yönetici: Yönetim organı üyeleri dahil olmak üzere, şirketin faaliyetlerini plânlama, yönetme veya kontrol
      etme yetki ve sorumluluğuna

      doğrudan veya dolaylı olarak sahip olan kişileri,'
