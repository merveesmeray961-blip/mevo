  kok: Bir denetim kuruluşu, Türk Ticaret Kanunu uyarınca seçildiği hesap döneminin başlangıcında denetimi üstlenmiştir. Seçimden
    itibaren 60 gün geçmiş, ancak denetlenen işletme yazılı ihtara rağmen sözleşmeyi imzalamaktan kaçınmıştır. Denetimi üstlenen
    kuruluş bu durumu 12 gün sonra fark etmiş ve henüz sözleşmeyi feshetmemiştir. KGK Bağımsız Denetim Yönetmeliği'ne göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Sözleşme için 90 günlük süre vardır; kaçınma hâlinde bildirim süresi de 30 gündür.
    B: Sözleşme seçimden itibaren en geç 60 gün içinde yapılmalı; işletme bu süre içinde yazılı ihtara rağmen kaçınırsa denetimi
      üstlenen durumdan sonraki 10 gün içinde Kuruma bildirim yapmalıdır.
    C: Sözleşme yalnız denetim raporu imzalandıktan sonra yapılabilir; Kuruma bildirim gerekmez.
    D: İşletmenin sözleşmeden kaçınması hâlinde denetim kuruluşu hiçbir bildirim yapmadan denetimi kendiliğinden sürdürebilir.
    E: Sözleşme için 60 gün şartı yoktur; yalnız sözleşmenin yazılı olması yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: 'BDY md. 29/3, denetim sözleşmesinin seçildiği hesap dönemi için seçimden itibaren en geç 60 gün içinde yapılmasını
      öngörür. Aynı fıkraya göre bu süre içinde denetimi üstlenenin yazılı ihtarına rağmen işletme sözleşme yapmaktan kaçınırsa,
      denetimi üstlenen durumu izleyen 10 gün içinde Kuruma bildirir. Senaryoda 12 gün geçtiği için 10 günlük bildirim süresi
      de aşılmıştır. Püf noktaları: 60 günlük sözleşme süresi ile kaçınma hâlindeki 10 günlük Kurum bildirim süresi ayrı sürelerdir.'
    celdiriciler:
      A: Yönetmelik 60 değil 90 günlük sözleşme süresi öngörür; ayrıca bildirim süresi 30 gün değildir.
      C: Sözleşme seçimden itibaren 60 gün içinde yapılmalıdır; rapor tarihine bırakılmaz.
      D: Kaçınma hâlinde Kuruma bildirim yükümlülüğü vardır.
      E: Yazılı olma zorunluluğunun yanında 60 günlük süre de açıkça düzenlenmiştir.
