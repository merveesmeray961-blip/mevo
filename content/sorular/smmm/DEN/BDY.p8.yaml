    KAYİK değildir ve Kurum tarafından faaliyet alanı, büyüklüğü veya çalışan sayısı gibi ölçütlerle ayrıca belirlenmiş
    işletmeler arasında da değildir. Yönetmeliğe göre bu denetimin üstlenilmesi bakımından aşağıdakilerden hangisi
    doğrudur?
