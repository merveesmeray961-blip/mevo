      veya alacak ilişkilerine girilmiş olmasını bağımsızlığı zedeleyen veya ortadan kaldıran bazı durumlardan biri
      olarak sayar. Püf noktaları: Buradaki kritik ayrım, borç ilişkisinin olağan ekonomik ilişki dışında olması
      ve hükmün kilit yöneticileri açıkça kapsamasıdır.'
