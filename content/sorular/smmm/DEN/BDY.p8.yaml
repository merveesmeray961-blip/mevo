  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/1
    alinti: 'MADDE 15 –(1) Denetçi olmak isteyenlerin en az 3 yıl süreyle, finansal tablo denetimi dahil olmak üzere mesleki
      konularda (Ek ibare:RG-

      21/7/2017-30130) denetim üstlenen bağımsız denetçi yanında ya da denetim kuruluşunda uygulamalı eğitim almaları şarttır.
