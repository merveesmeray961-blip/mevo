- id: SMMM-DEN-BDY-0072
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: tanımlar (denetim kıstası)
  tip: uygulama
  zorluk: 3
  kok: Bir bağımsız denetimde finansal tabloların hangi ölçütlere göre değerlendirileceği tartışılmaktadır. Denetim
    ekibinden bir kişi finansal tablolar için yalnız işletmenin iç politika ve prosedürlerinin denetim kıstası olduğunu,
    başka bir kişi ise denetim kıstasının önceden belirlenmiş kıstaslar olduğunu savunmaktadır. Bağımsız Denetim
    Yönetmeliği'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetim kıstası, denetim tamamlandıktan sonra denetçi tarafından, ulaşılan sonuçlar dikkate alınarak belirlenir.
    B: Finansal tablolar açısından denetim kıstası, işletmenin kendi muhasebe politikaları ile iç prosedürlerinden
      oluşur.
    C: Denetim kıstası, denetim konusunun uyumunun değerlendirildiği önceden belirlenmiş kıstaslardır; finansal
      tablolar açısından TMS esas alınır.
    D: Denetim kıstası, taraflarca denetim sözleşmesinde sonradan belirlenir; mevzuattaki düzenlemeler kıstas oluşturmaz.
    E: Finansal tablolar açısından TDS, yıllık faaliyet raporları açısından TMS denetim kıstasını oluşturur.
  dogru: C
  aciklama:
    dogru_neden: BDY md. 8/1, denetimde denetim konusunun uyumunun değerlendirildiği önceden belirlenmiş kıstasların
      esas alınacağını ve finansal tablolar açısından TMS'nin kıstas olduğunu düzenler. Md. 5/1 de denetimin belirlenmiş
      bir kıstasa uyum hakkında görüş oluşturma amacıyla yapıldığını belirtir.
    celdiriciler:
      A: Kıstas önceden belirlenmiş olmalıdır (md. 8/1); denetim sonrasında seçilen bir ölçüt değildir.
      B: Finansal tablolar açısından kıstas TMS'dir; işletmenin iç politikaları kıstas olmaz.
      D: Kıstas mevzuata ve önceden belirlenmiş kurallara dayanır; sonradan sözleşmeyle seçilmez.
      E: Finansal tablolarda TMS esastır; faaliyet raporlarında ise TTK ve ilgili mevzuat esas alınır (md. 8/1).
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 5/1
    alinti: Denetim finansal tablolar ve diğer finansal bilgiler dâhil olmak üzere denetime tabi konuların belirlenmiş
      bir kıstasa uyumlu olup olmadığı hususunda kullanıcılara TDS çerçevesinde güvence sağlayacak bir görüş oluşturulması
      amacı ile yapılır.
