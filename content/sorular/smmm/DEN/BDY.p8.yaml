- id: SMMM-DEN-BDY-0074
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: uygulamalı mesleki eğitim
  tip: uygulama
  zorluk: 3
  kok: Bir adayın 3568 sayılı Kanun kapsamındaki tasdik ve vergi denetimi hizmetlerinde geçen süreleri ile ilgili
    kamu kurumunda denetim yetkisine sahip olarak geçirdiği süreleri bulunmaktadır. Ayrıca toplam mesleki tecrübesi
    15 yılın altındadır. Bağımsız Denetim Yönetmeliği'ne göre bu sürelerin uygulamalı mesleki eğitim bakımından
    değerlendirilmesiyle ilgili aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bu süreler uygulamalı mesleki eğitim süresinden sayılmaz; eğitim süresi olarak bağımsız denetim kuruluşunda
      kadrolu çalışılan süreler dikkate alınır.
    B: Kamu kurumunda denetim yetkisiyle geçen süre eğitimden sayılır; tasdik ve vergi denetimi hizmetlerinde geçen
      süreler eğitim süresine eklenemez.
    C: Tasdik ve vergi denetimi hizmetlerinde ve belirtilen kamu kurumlarında denetim yetkisiyle geçen süreler eğitim
      süresinden sayılır; 15 yıl eşiği sağlanmadığından eğitim şartı kalkmaz.
    D: 15 yıldan az mesleki tecrübe bulunduğu için bu sürelerin eğitim bakımından dikkate alınması mümkün olmaz;
      adayın eğitimi baştan tamamlaması gerekir.
    E: Eğitim süresinden lisans eğitimi sırasında yapılan stajlar sayılır; tasdik, vergi denetimi ve kamu kurumu
      süreleri dikkate alınmaz, aday eğitimini kuruluş bünyesinde yeniden tamamlar.
  dogru: C
  aciklama:
    dogru_neden: 'BDY md. 15/1, 3568 sayılı Kanun kapsamındaki tasdik ve vergi denetimi hizmetleri ile 6 ncı maddenin
      ikinci fıkrasında belirtilen kamu kurum ve kuruluşlarında denetim yetkisini haiz kişilerin bu kurumlarda geçirdikleri
      sürelerin uygulamalı mesleki eğitim süresinden sayılacağını düzenler. Md. 15/2 ise en az 15 yıl mesleki tecrübesi
      olanlarda eğitim şartının aranmayacağını söyler; senaryoda bu eşik sağlanmamıştır. Püf noktaları: Eğitim süresinden
      sayılan faaliyet ile eğitim şartını tamamen kaldıran 15 yıllık eşik birbirinden ayrılmalıdır.'
    celdiriciler:
      A: Yönetmelik md. 15/1 belirli tasdik, vergi denetimi ve kamu kurumu sürelerini eğitimden sayılan süreler
        olarak açıkça sayar.
      B: Tasdik ve vergi denetimi hizmetleri de md. 15/1 kapsamında sayılır.
      D: 15 yıl eşiği eğitim şartının aranmayacağı hâli belirler; 15 yılın altındaki sürelerin md. 15/1 kapsamında
        sayılmasını engellemez.
      E: Lisans eğitimi md. 15/1'de uygulamalı mesleki eğitimden sayılan faaliyet olarak düzenlenmemiştir.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/1-2
    alinti: '3568 sayılı Kanun

      çerçevesinde tasdik ve vergi denetimi hizmetlerinde geçen süreler ile aynı Kanunun 6 ncı maddesinin ikinci
      fıkrasında yer alan kamu kurum ve

      kuruluşlarında denetim yetkisini haiz olanların, bu kamu kurum ve kuruluşlarında geçirdikleri süreler uygulamalı
      mesleki eğitim süresinden sayılır.'
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/2
    alinti: En az on beş yıl mesleki tecrübeye sahip olanlarda uygulamalı mesleki eğitim şartı aranmaz.
