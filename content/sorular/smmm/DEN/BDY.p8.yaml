    başka bir denetim kuruluşunda ortak, kilit yönetici veya denetçi olarak görevleri bulunmaktadır. Bağımsız Denetim
    Yönetmeliği'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kalite yönetim sistemi kurulmuşsa kadroya ilişkin diğer şartlar aranmaz.
    B: Kendisi hariç sorumlu denetçi bulunması şartı KAYİK denetimlerinde aranır.
    C: Başka kuruluştaki görevi, ortaklık payı yüzde onu aşmıyorsa engel değildir.
    D: Kadroda sorumlu denetçi yerine iki denetçi yardımcısı bulunması yeterlidir.
    E: Her iki durum da şartlara aykırıdır; kendi adına denetim üstlenemez.
