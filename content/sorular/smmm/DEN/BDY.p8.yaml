      B: Borç veya alacak ilişkisi md. 22/3-(a)'da bağımsızlığı zedeleyen hâllerdendir.
      C: Hüküm üçüncü kişi tarafı şartı aramaz; denetlenen işletmeyle olağan dışı borç/alacak ilişkisi yeterlidir.
      D: Bağımsızlık denetim süreci boyunca korunur; değerlendirme rapor sonrasına bırakılmamıştır.
