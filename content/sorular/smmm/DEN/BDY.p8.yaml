    toplam 10 yıllık mesleki tecrübesi vardır; bu sürenin 2 yılı fiilen denetçi, kıdemli denetçi veya başdenetçi unvanıyla
    denetimlerde geçmiştir ve denetim kuruluşunun yönetim organı tarafından kuruluş adına denetim raporunu imzalamaya yetkilendirilmiştir.
