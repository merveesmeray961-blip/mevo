  kok: Bağımsız denetçi olmak isteyen A'nın toplam 12 yıllık mesleki tecrübesi vardır. Bunun 2 yılı 3568 sayılı Kanun çerçevesinde
    tasdik ve vergi denetimi hizmetlerinde, 10 yılı ise diğer mesleki faaliyetlerde geçmiştir. A ayrıca denetçilik sınavında
    başarılıdır. A'nın uygulamalı mesleki eğitim şartı bakımından aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: A'nın 15 yıl tecrübesi bulunmadığından, tasdik ve vergi denetiminde geçen 2 yıl hiçbir şekilde dikkate alınmaz.
    B: A'nın toplam 12 yıllık tecrübesi bulunduğundan uygulamalı mesleki eğitim şartı otomatik olarak kalkar.
    C: A'nın yalnız sınavı geçmiş olması eğitim şartını ortadan kaldırır.
    D: A'nın tasdik ve vergi denetimi hizmetlerinde geçen 2 yılı eğitim süresinden sayılır; ancak 15 yıllık toplam mesleki
      tecrübeye ulaşmadığı için şartın tamamı otomatik olarak kalkmaz.
    E: A'nın 2 yıllık tasdik ve vergi denetimi süresi yalnız KAYİK denetimleri için sayılır.
  dogru: D
  aciklama:
    dogru_neden: 'BDY md. 15/1, denetçi olmak isteyenlerin en az üç yıl uygulamalı mesleki eğitim almasını öngörür ve 3568
      sayılı Kanun çerçevesinde tasdik ve vergi denetimi hizmetlerinde geçen sürelerin uygulamalı mesleki eğitim süresinden
      sayılacağını belirtir. Md. 15/2 ise en az 15 yıl mesleki tecrübeye sahip olanlarda eğitim şartının aranmayacağını düzenler.
      A 12 yıl tecrübeyle bu istisnadan yararlanamaz; ancak 2 yıllık süre eğitim süresinden sayılır. Püf noktaları: 15 yıllık
      istisna ile eğitim süresine sayılan faaliyetleri birbirine karıştırmamak gerekir.'
    celdiriciler:
      A: Tasdik ve vergi denetiminde geçen süreler açıkça eğitim süresinden sayılır.
      B: Eğitim şartının istisnası 12 değil, en az 15 yıllık mesleki tecrübe için öngörülmüştür.
      C: Sınavda başarılı olmak ayrı bir şarttır; eğitim şartını kendiliğinden kaldırmaz.
      E: Metin, tasdik ve vergi denetimi sürelerinin KAYİK ile sınırlı olduğunu söylemez.
