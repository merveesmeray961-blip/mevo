- id: SMMM-DEN-BDY-0072
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: tanımlar (denetim kıstası)
  tip: uygulama
  zorluk: 3
  kok: Bir bağımsız denetimde finansal tabloların hangi ölçütlere göre değerlendirileceği tartışılmaktadır. Denetim ekibinden
    bir kişi finansal tablolar için yalnız işletmenin iç politika ve prosedürlerinin denetim kıstası olduğunu, başka bir kişi
    ise denetim kıstasının önceden belirlenmiş kıstaslar olduğunu savunmaktadır. Bağımsız Denetim Yönetmeliği'ne göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Denetim kıstası her denetimde denetçi tarafından denetim tamamlandıktan sonra belirlenir.
    B: Finansal tablolar için denetim kıstası yalnız işletmenin iç politika ve prosedürleridir.
    C: Denetim kıstası, denetim konusunun uyumunun değerlendirildiği önceden belirlenmiş kıstaslardır; finansal tablolar açısından
      TMS esas alınır.
    D: Denetim kıstası yalnız denetim sözleşmesinde taraflarca sonradan belirlenir.
    E: Denetim kıstası yalnız denetim kanıtlarının yeterliliğini ölçmek için kullanılır; finansal tabloların uyum değerlendirmesinde
      kullanılmaz.
  dogru: C
  aciklama:
    dogru_neden: 'Bağımsız Denetim Yönetmeliği md. 8/1, denetimde denetim konusunun uyumunun değerlendirildiği önceden belirlenmiş
      kıstasların esas alınacağını ve finansal tablolar açısından TMS''nin denetim kıstası olduğunu düzenler. Md. 5/1 de denetimin
      belirlenmiş bir kıstasa uyumu hakkında güvence sağlayacak görüş oluşturma amacıyla yapıldığını belirtir. Püf noktaları:
      “Kıstas” denetim sonrasında seçilen bir ölçüt değildir; önceden belirlenmiş olmalı ve finansal tablolar açısından Yönetmelik
      TMS''yi açıkça gösterir.'
    celdiriciler:
      A: BDY md. 8/1 denetim kıstasının önceden belirlenmiş olmasını öngörür; denetim tamamlandıktan sonra belirlenmez.
      B: BDY md. 8/1 finansal tablolar açısından TMS'yi esas alır; işletmenin iç politikalarını tek kıstas olarak göstermez.
      D: BDY md. 8/1 kıstasın önceden belirlenmiş olmasını şart koşar; sonradan sözleşmeyle seçilmesi şeklinde mutlak bir
        kural yoktur.
      E: BDY md. 5 ve 8 denetim kıstasını denetim konusunun uyumunun değerlendirilmesi ve güvence görüşünün oluşturulmasıyla
        ilişkilendirir.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 5/1
    alinti: 'Denetimde denetim konusunun uyumunun değerlendirildiği önceden belirlenmiş kıstaslar esas alınır. Finansal tablolar
      açısından

      TMS; yıllık faaliyet raporları, riskin erken saptanması ve yönetimine ilişkin sistem açısından(Değişik ibare:RG-21/7/2017-30130)
      Türk Ticaret

      Kanununun ve ilgili mevzuatın denetim kıstasına ilişkin hükümleri; diğer mevzuattan kaynaklanan denetim konuları açısından
      ise denetim kıstasıyla ilgili

      düzenlemeler veya bunların atıf yaptığı kurallar denetim kıstasını oluşturur.'
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
