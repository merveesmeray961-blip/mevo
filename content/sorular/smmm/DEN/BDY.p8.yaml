  kok: Bir denetim kuruluşunun kilit yöneticisi, denetlenen işletmeyle olağan ekonomik ilişkiler dışında doğrudan
    bir borç ilişkisine girmiştir. Denetim kuruluşu bu durumu öğrendiğinde bağımsızlığın etkilenmesi bakımından
    hangi değerlendirmeyi yapmalıdır?
  secenekler:
    A: Kilit yönetici denetim ekibinde yer almadığı için ilişki bağımsızlık değerlendirmesinin dışında kalır; değerlendirme
      ekip üyeleri bakımından yapılır.
    B: Borç ilişkisi bağımsızlığı etkilemez; denetim ücretinin zamanında ödenmemesi ve denetim dışı hizmetler bağımsızlığı
      zedeleyen hâlleri oluşturur.
    C: Durum, borç ilişkisine denetlenen işletmenin ortaklarından biri de taraf olursa bağımsızlığı zedeleyen hâller
      kapsamında değerlendirilir.
    D: Değerlendirme, denetim raporunun düzenlenmesinden sonra yapılır; kilit yöneticilerin ilişkileri rapor tarihine
      kadar bağımsızlık bakımından incelenmez.
    E: Olağan ekonomik ilişkiler dışında borç ilişkisi, Yönetmelikte bağımsızlığı zedeleyen veya ortadan kaldıran
      hâller arasında sayıldığından bağımsızlık bakımından değerlendirilmelidir.
  dogru: E
  aciklama:
    dogru_neden: 'BDY md. 22/3-a, denetçiler ile denetim kuruluşunun ortakları, kilit yöneticileri ve denetçileri
