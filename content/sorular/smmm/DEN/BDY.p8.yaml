- id: SMMM-DEN-BDY-0071
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: kilit yönetici
  tip: uygulama
  zorluk: 3
  kok: Denetlenen bir şirkette, şirketin faaliyetlerini fiilen planlayan, yöneten ve kontrol eden bir yönetim organı
    üyesi ile bu faaliyetler üzerinde doğrudan yetkisi bulunmayan, yalnız teknik raporlama yapan bir uzman bulunmaktadır.
    Bağımsız Denetim Yönetmeliği'ndeki “kilit yönetici” tanımına göre aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: İki kişi de kilit yöneticidir; çünkü tanım, şirketin faaliyetlerine ilişkin bilgiye erişimi olan çalışanları
      da kapsar.
    B: İlk kişi, yönetim organı üyesi olması nedeniyle değil, ancak şirketin pay sahibi de olması halinde kilit
      yönetici sayılır; uzman kapsam dışındadır.
    C: Teknik uzman, raporları yönetim tarafından dikkate alındığından dolaylı yetkiye sahip sayılarak kilit yönetici
      kabul edilir; ilk kişi de kapsamdadır.
    D: İlk kişi kilit yöneticidir; teknik raporlama yapan uzman, faaliyetleri planlama, yönetme veya kontrol etme
      yetki ve sorumluluğu bulunmadığından bu kapsamda değildir.
    E: Kilit yönetici sayılma, denetim kuruluşunun ortağı olmaya bağlıdır; ilk kişi ortak değilse kapsam dışındadır.
  dogru: D
  aciklama:
    dogru_neden: 'Bağımsız Denetim Yönetmeliği md. 4''te kilit yönetici, yönetim organı üyeleri dahil olmak üzere
      şirketin faaliyetlerini planlama, yönetme veya kontrol etme yetki ve sorumluluğuna doğrudan veya dolaylı olarak
      sahip olan kişiler olarak tanımlanır. Bu nedenle belirleyici ölçüt yalnız unvan değil, söz konusu yetki ve
      sorumluluktur. Püf noktaları: Tanım hem yönetim organı üyelerini kapsar hem de “dahil olmak üzere” ifadesiyle
      bunlarla sınırlı değildir; doğrudan veya dolaylı yetki ve sorumluluk aranır.'
    celdiriciler:
      A: Bilgiye erişim tanımın ölçütü değildir; ölçüt planlama, yönetme veya kontrol etme yetki ve sorumluluğudur
        (md. 4/1-m).
      B: Yönetim organı üyeleri tanıma 'dahil olmak üzere' ifadesiyle doğrudan girer; pay sahipliği aranmaz.
      C: Dolaylı yetki de gerçek bir planlama-yönetme-kontrol yetkisini gerektirir; salt raporlama bu yetkiyi vermez.
      E: Tanım şirkete ilişkindir ve denetim kuruluşu ortaklığına bağlanmamıştır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 4/1-(m)
    alinti: 'Kilit yönetici: Yönetim organı üyeleri dahil olmak üzere, şirketin faaliyetlerini plânlama, yönetme
      veya kontrol etme yetki ve sorumluluğuna

      doğrudan veya dolaylı olarak sahip olan kişileri,'
