- id: SMMM-DEN-BDY-0157
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: yetkilendirme
  tip: kavrama
  zorluk: 3
  kok: Bir denetim kuruluşu yeni bir faaliyet izni sürecindedir. Kuruluş, faaliyet izni aldıktan sonra devredilmek
    istenmektedir; ayrıca ticaret unvanında “bağımsız denetim” ibaresi bulunmamaktadır. Aşağıdaki karşılaştırmalardan
    hangisi Yönetmelikteki iki durumu doğru ayırmaktadır?
  secenekler:
    A: Devir işlemi Kurum iznine tabidir; bağımsız denetim ibaresi bulunmayan kuruluşa ise üç ay içinde unvanını
      değiştirip Türkiye Ticaret Sicili Gazetesinde ilan etmesi koşuluyla faaliyet izni verilebilir.
    B: Devir işlemi serbesttir; unvan değişikliği için ise altı aylık süre tanınır.
    C: Devir için yalnızca genel kurul kararı yeterlidir; unvanın değiştirilmesi için Kurum izni aranır ve süre
      öngörülmez.
    D: Devir işlemi Kurum iznine tabi değildir; unvan değişikliği yapılmadan da faaliyet izni kesinleşir.
    E: Her iki işlem de yalnızca sicil tesciliyle tamamlanır ve Kurum izni veya ilan şartı aranmaz.
  dogru: A
  aciklama:
    dogru_neden: 'Yönetmelik denetim kuruluşlarının devir, bölünme, birleşme ve tür değişikliği işlemlerini Kurum
      iznine bağlar. Buna karşılık ticaret unvanında bağımsız denetim ibaresi bulunmayan kuruluş için üç aylık unvan
      değişikliği ve Türkiye Ticaret Sicili Gazetesinde ilan koşuluyla faaliyet izni verilebilmesine özel bir hüküm
      vardır.


      Püf noktaları: Yetkilendirmede kuruluşun olağan şartları ile devir/bölünme/birleşme/tür değişikliği için özel
      Kurum izni ve unvan için üç aylık düzeltme imkanını birbirinden ayırın.'
    celdiriciler:
      B: Üç aylık süre Yönetmelikte açıkça öngörülmüş olup altı ay değildir.
      C: Devir ve benzeri işlemler Kurum iznine tabidir; unvan hükmü ise ayrı bir özel düzenlemedir.
      D: Unvan değişikliği için üç aylık koşullu imkan vardır; bu durum faaliyetin ibaresiz olarak kalıcı biçimde
        sürdürülmesi anlamına gelmez.
      E: Sicil tescili tek başına iki düzenlemenin yerine geçmez; ilgili Kurum şartları ayrıca uygulanır.
    hesap_adimlari: []
  kaynaklar:
