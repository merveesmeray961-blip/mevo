    hangileri doğrudur?

    I. 3568 sayılı Kanun kapsamındaki mesleki faaliyetlerde veya aynı Kanun uyarınca staj ve stajdan sayılan hizmetlerde
    geçirilen süreler hesaba katılır.

    II. Kamu kurum ve kuruluşlarında geçirilen süreler hariç olmak üzere, bir yıldan fazla ara verilirse ara verilen
    sürenin tamamı hesaptan çıkarılır.

