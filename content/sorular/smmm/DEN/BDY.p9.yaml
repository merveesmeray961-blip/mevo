  aciklama:
    dogru_neden: Yönetmelik md. 22/3, ilk denetim sözleşmesi imza tarihinden itibaren KAYİK denetleyen kuruluşlar
      için asgari üç yılda bir inceleme yapılacağını ve izleyen incelemelerde sürenin önceki Kurul kararını takip
      eden takvim yılından yeniden başlayacağını düzenler.
    celdiriciler:
      B: Yönetmelik iki yıllık genel süre öngörmez.
      C: Altı yıllık süre diğerleri içindir.
      D: Kurum ihbar, şikâyet ve gerekli gördüğü diğer hallerde de inceleme yapabilir; planlı inceleme de vardır.
      E: İnceleme faaliyet izni yenilemesine bağlanmamıştır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 22/3
    alinti: İncelemeler, ilk denetim sözleşmesi imza tarihinden itibaren; KAYİK’leri denetleyen bağımsız denetim
      kuruluşları için asgari üç yılda bir, diğerleri için asgari altı yılda bir yapılır. İzleyen incelemelerde
