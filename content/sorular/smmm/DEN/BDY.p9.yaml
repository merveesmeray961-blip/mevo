  kok: Bir denetim kuruluşu KAYİK'leri denetlemektedir. İlk denetim sözleşmesi 2026 yılında imzalanmış, Kurumun
    planlı inceleme ve denetim takviminde başka bir özel inceleme nedeni bulunmamıştır. Yönetmelikteki inceleme
    sıklığına göre aşağıdaki seçeneklerden hangisi doğrudur?
  secenekler:
    A: İlk sözleşmeden itibaren asgari üç yılda bir inceleme yapılır; izleyen incelemede süre önceki Kurul kararını
      takip eden takvim yılından yeniden başlar.
    B: İlk sözleşmeden itibaren asgari iki yılda bir inceleme yapılır; süre her sözleşme imzasında yeniden başlar.
    C: KAYİK denetleyen kuruluşlar için asgari altı yıllık süre uygulanır.
    D: İnceleme yalnızca ihbar veya şikâyet gelirse yapılabilir.
    E: İlk inceleme yalnızca denetim kuruluşunun faaliyet izni yenilendiğinde yapılır.
