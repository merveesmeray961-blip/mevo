    ve bir denetim kuruluşunda fiilen çalışmaya başlamıştır. Kuruma bildirim ise Sosyal Güvenlik Kurumuna bildirim
    süresi içinde henüz yapılmamıştır. Yönetmeliğe göre uygulamalı mesleki eğitim hangi anda başlar?
  secenekler:
    A: Adayın denetim kuruluşunda ilk fiilî çalışma gününde
    B: Gerekli şartları gösteren bilgi ve belgelerin ilgili bildirim süresi içinde Kuruma bildirilmesiyle
    C: Denetim kuruluşunun adayla sözleşme imzaladığı gün
    D: Adayın gerekli belgeleri tamamladığı gün
    E: Denetçilik sınavında başarılı olunduğu gün
  dogru: B
  aciklama:
    dogru_neden: BDY md. 15/5, uygulamalı mesleki eğitimin gerekli şartları gösteren bilgi ve belgelerin ilgili
      denetim kuruluşu veya denetim üstlenen bağımsız denetçi tarafından Sosyal Güvenlik Kurumuna bildirim süresi
      içerisinde Kuruma bildirilmesiyle başladığını düzenler.
    celdiriciler:
      A: Fiilî çalışma başlangıcı tek başına başlangıç anı değildir.
      C: Sözleşme imzası hükümde başlangıç ölçütü değildir.
      D: Belgelerin hazırlanması tek başına yeterli değildir.
