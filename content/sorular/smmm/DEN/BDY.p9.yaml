  kok: Bir denetim kuruluşu, denetim ekibindeki kişilerden bağımsızlık, tarafsızlık ve sır saklamaya ilişkin yazılı
    taahhüt alacaktır. Denetim sırasında bir ekip üyesi bu hususları olumsuz etkileyebilecek yeni bir durumla karşılaşmıştır.
    Yönetmeliğe göre aşağıdakilerden hangisi doğrudur?
