      düzenler. III yanlıştır; yazılı taahhütler her denetimden önce ve her hâlükârda yılda en az bir kez alınır.
    celdiriciler:
      C: II de doğru olduğundan yalnız I doğru değildir.
      B: I de doğru olduğundan yalnız II doğru değildir.
      D: III yanlış olduğu için II ve III birlikte doğru değildir.
