    dogru_neden: 'Md. 28/1, sorumlu denetçilerin Kurumun onayı alınmak suretiyle görevlendirileceğini ve raporu
      denetimi üstlenenler adına imzalama yetkisine sahip olması gerektiğini; ayrıca (c) bendi bu imza yetkisinin
      kuruluşun yönetim organı veya denetim üstlenen bağımsız denetçi tarafından verilmesini şart koşar.


      Püf noktaları: Sorumlu denetçi olabilme şartlarını, Kurum onayını ve raporu imzalama yetkisinin ayrıca verilmesini
      tek bir yetkilendirme adımı gibi değerlendirmeyin.'
    celdiriciler:
      B: Md. 28/1(c), ayrıca yönetim organı veya denetim üstlenen bağımsız denetçi tarafından yetkilendirmeyi arar.
      C: Kurum onayı yalnızca KAYİK dışına özgü değildir; sorumlu denetçi görevlendirmesinin genel unsurudur.
      D: İmza yetkisi md. 28/1(c) kapsamında sorumlu denetçi şartlarının bir parçasıdır.
      E: Yalnızca tecrübe değil, Kurum onayı ve imza yetkisi de düzenlenmiştir.
