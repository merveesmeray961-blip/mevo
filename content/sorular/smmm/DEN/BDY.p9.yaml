    15'e göre E bakımından uygulamalı mesleki eğitim şartının aranıp aranmayacağına ilişkin aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Aranır; çünkü 15 yıllık mesleki tecrübe hesabında hiçbir ara dikkate alınmaz.
    B: Aranır; çünkü bağımsız denetim süresi 3 yıldan azdır.
