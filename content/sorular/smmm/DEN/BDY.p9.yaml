  aciklama:
    dogru_neden: Md. 28/1 sorumlu denetçilerin Kurum onayı alınarak görevlendirildiğini ve raporu imzalama yetkisini
      düzenler; md. 28/2 onay taleplerinin şartları gösteren bilgi ve belgelerle gönderileceğini belirtir.
    celdiriciler:
      A: Görevlendirme Kurum onayıyla yapılır; II rapor imza yetkisi değildir.
      C: I görevlendirme işlemidir; III ise imza yetkisidir.
      D: II bilgi-belge dayanağıdır, imza yetkisi değildir.
      E: I'nin karşılığı 3, II'nin karşılığı 1 olmalıdır.
