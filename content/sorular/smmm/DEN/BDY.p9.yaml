  konu: BDY
  kazanim: sorumlu denetçi şartları
  tip: kavrama
  zorluk: 3
  kok: 'Bir denetçinin sorumlu denetçi olarak görevlendirilmesine ilişkin olarak iki ayrı yetkilendirme unsuru tartışılmaktadır:
    Kurumun onayı ve denetim raporunu denetimi üstlenenler adına imzalama yetkisi. Aşağıdaki ifadelerden hangisi
    Yönetmeliğe göre doğru bir ayrımdır?'
  secenekler:
    A: Sorumlu denetçi, aranan şartları sağlayan denetçiler arasından Kurumun onayı alınarak görevlendirilir; ayrıca
      denetim kuruluşunun yönetim organı veya denetim üstlenen bağımsız denetçi tarafından raporu imzalamaya yetkilendirilmiş
      olmalıdır.
    B: Kurumun onayı yeterlidir; denetim kuruluşunun veya denetim üstlenen bağımsız denetçinin ayrıca imza yetkisi
      vermesine gerek yoktur.
    C: Yönetim organının imza yetkisi yeterlidir; Kurum onayı yalnızca KAYİK dışındaki denetimlerde aranır.
    D: İmza yetkisi, sorumlu denetçi olabilmenin şartı değildir; yalnızca raporun tesliminden sonra ayrıca verilebilir.
    E: Sorumlu denetçi görevlendirmesinde yalnızca mesleki tecrübe aranır; Kurum onayı ve imza yetkisi birbirinden
      bağımsızdır.
