    B: Taahhüt yalnızca denetimin sonunda alınır; yeni durum sözlü olarak bildirilirse yeterlidir.
    C: Taahhüt yalnızca KAYİK denetimlerinde alınır; diğer denetimlerde yeni durum bildirilmez.
    D: Taahhüt bir kez alınır ve sonraki denetimlerde yenilenmez; yeni durum yalnızca raporda açıklanır.
