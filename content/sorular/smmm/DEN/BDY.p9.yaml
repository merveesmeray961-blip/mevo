  konu: BDY
  kazanim: kendi adına denetim
  tip: uygulama
  zorluk: 3
  kok: Bağımsız denetçi Deniz, kendi adına denetim üstlenmek için başvuracaktır. Sorumlu denetçi olabilme şartlarını
    taşımakta, 27 nci maddeye uygun ekip kurabilecek kadroya sahip olmakta ve kadrosunda kendisi hariç bir sorumlu
    denetçi bulunmaktadır. Ancak kadrosundaki denetçilerden biri başka bir denetim kuruluşunda da denetçi olarak
    görev yapmakta, ayrıca Deniz kalite yönetim sistemine ilişkin yazılı politika ve süreçlerini oluşturmamıştır.
    Yönetmeliğe göre başvuru için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki eksiklik de önemsizdir; sorumlu denetçi olma şartı tek başına yeterlidir.
    B: Yalnız başka kuruluşta görev yapan denetçinin durumu engeldir; kalite yönetim sistemi şartı aranmaz.
    C: Yalnız kalite yönetim sistemi şartının eksikliği engeldir; diğer kuruluşta görev yapılabilir.
    D: Her iki durum da kendi adına denetim üstlenme şartları arasında yer aldığından başvuru bu hâliyle uygun değildir.
    E: Kadro şartı sağlandığından iki eksiklik de Kurum onayıyla otomatik olarak giderilmiş sayılır.
  dogru: D
  aciklama:
    dogru_neden: Md. 14/3-e, başvuranın ve denetçilerinin başka bir denetim kuruluşunda belirli sıfatlarla görev
      yapmamasını; md. 14/3-f ise kalite yönetim sistemine ilişkin yazılı politika ve süreçlerin oluşturulmasını
      şart koşar. İki eksiklik de başvuruyu uygunsuz hâle getirir.
    celdiriciler:
      A: Sorumlu denetçi olabilmek tek başına yeterli değildir.
      B: Kalite yönetim sistemi şartı açıkça vardır.
      C: Başka kuruluşta denetçi olarak görev yapma da engeldir.
      E: Eksikliklerin Kurum onayıyla otomatik giderildiğine ilişkin hüküm yoktur.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 14/3-b,c,ç,d
    alinti: "a) Müteakip bentlerdeki şartları sağladıklarını gösteren bilgi ve belgelerle Kuruma onay için başvuruda\
      \ bulunulması,\n        b) Başvuranın sorumlu denetçi olabilme şartlarını karşılaması,\n        c) Denetim\
      \ kadrosunun, asgari olarak, 27 nci maddede belirtilen denetim ekiplerini oluşturabilecek nitelik ve genişlikte\
      \ olması,\n        ç) Denetçilerin tam zamanlı ve asgari bir raporlama dönemi için istihdam edilmiş olması,\n\
      \        d) Denetim kadrosunda kendisi hariç en az bir sorumlu denetçinin bulunması,"
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 14/3-e,f
    alinti: "e) Kendisinin ve denetçilerinin herhangi bir denetim kuruluşunda veya başka bir denetim üstlenen bağımsız\
