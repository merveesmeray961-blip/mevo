- id: SMMM-DEN-BDY-0001
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: denetimin unsurları ve tarafları
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: >-
    KGK Bağımsız Denetim Yönetmeliği'ne göre aşağıdakilerden hangisi denetimin unsurlarından biri
    **değildir**?
  secenekler:
    A: Denetimin kıstası
    B: Denetim kanıtları
    C: Denetimin tarafları
    D: Denetim raporu
    E: Denetim sözleşmesi
  dogru: E
  aciklama:
    dogru_neden: >-
      Yönetmeliğin 5 inci maddesinin dördüncü fıkrasına göre denetimin unsurlarını denetimin konusu,
      tarafları, kıstası, kanıtları ve denetim raporu oluşturur. Denetim sözleşmesi 29 uncu maddede
      denetimi üstlenen ile denetlenen işletme arasında yazılı olarak düzenlenmesi zorunlu bir belge
      olarak düzenlenmiştir; ancak denetimin unsurları arasında sayılmamıştır.
    celdiriciler:
      A: Denetimin kıstası md. 5/4'te sayılan unsurlardandır; içeriği md. 8'de düzenlenmiştir.
      B: Denetim kanıtları md. 5/4'te sayılan unsurlardandır; tanımı md. 9'da yer alır.
      C: Denetimin tarafları md. 5/4'te sayılan unsurlardandır; md. 7'ye göre denetlenen, denetimi
        yapan ve hedeflenen kullanıcılardan oluşur.
      D: Denetim raporu md. 5/4'te sayılan unsurlardandır; tanımı md. 10'da yer alır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 5/4
    alinti: Denetimin unsurlarını; denetimin konusu, tarafları, kıstası, kanıtları ve denetim raporu
      oluşturur.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 7/1
    alinti: Denetlenen, denetimi yapan ve ilgili mevzuatında hedeflenen kullanıcılar denetimin taraflarını
      oluşturur.
  gecerlilik:
    baslangic: '2012-12-26'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-BDY-0002
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: kısıtlamalar ve rotasyon
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: >-
    Denetçi (K), (Z) AŞ'nin denetiminde 2018–2021 hesap dönemlerinde (A) Bağımsız Denetim AŞ
    bünyesinde, 2022–2024 hesap dönemlerinde ise (B) Bağımsız Denetim AŞ bünyesinde görev almıştır.
    (A) ile (B) aynı denetim ağında yer almamakta olup birbirleriyle ilişkili denetim kuruluşu da
    değildir; (B), (Z) AŞ'nin denetimini 2022 hesap döneminden beri yürütmektedir. (Z) AŞ bir kamu
    yararını ilgilendiren kuruluş (KAYİK) değildir. KGK Bağımsız Denetim Yönetmeliği'ne göre 2025
    hesap dönemi denetimi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: (K)'nın süreleri çalıştığı kuruluşlar itibarıyla ayrı ayrı dikkate alınır; (B)'deki süresi üç
      yıl olduğundan (K), (Z) AŞ denetiminde görev alabilir.
    B: (K), (Z) AŞ denetiminde son on yılda yedi yıl görev aldığından, iki yıl geçmedikçe bu işletmenin
      denetiminde görev alamaz.
    C: (K)'nın süreleri birlikte dikkate alınır ve üç yıl geçmedikçe (Z) AŞ denetiminde görev alamaz;
      (B) ise (Z) AŞ'nin denetimini üstlenmeye devam edebilir.
    D: (K)'nın son on yılda yedi yılı doldurması nedeniyle (B) de üç yıl geçmedikçe (Z) AŞ'nin
      denetimini üstlenemez.
    E: Yedi yıllık sınır yalnızca KAYİK denetimlerinde uygulandığından (K), (Z) AŞ denetiminde
      görev almaya devam edebilir.
  dogru: C
  aciklama:
    dogru_neden: >-
      Yönetmeliğin 26/1-(ç) bendine göre üç yıl geçmedikçe, denetim kuruluşları ve denetim üstlenen
      bağımsız denetçiler ile işletmelerin denetiminde görev alan denetçiler, son on yılda yedi yıl
      denetim çalışmasını yürüttükleri aynı işletmeye ilişkin denetimleri üstlenemez. 26/2'nin ikinci
      cümlesine göre çalıştığı denetim kuruluşuna bakılmaksızın denetçinin aynı işletmenin denetiminde
      geçirdiği süreler birlikte dikkate alınır: (K) için 2018–2024 = yedi yıl dolmuştur ve üç yıllık
      bekleme süresi başlar. (B) kuruluşunun kendi süresi ise üç yıldır; (A) ile aynı ağda veya
      ilişkili olmadığından 26/2'nin birinci cümlesindeki toplama yapılmaz ve (B) denetimi başka bir
      ekiple sürdürebilir. Zor soru teknikleri: madde birleştirme (26/1-ç ile 26/2'nin iki ayrı
      cümlesi; denetçi ve kuruluş için farklı toplama kuralları), yakın kavram ayrımı (üç yıllık
      bekleme ile 26/3'teki iki yıllık kilit yönetici yasağı) ve gereksiz veri (KAYİK bilgisi).
      Tuzak, denetçinin kuruluş değiştirmesiyle sürenin sıfırlandığını sanmak ya da denetçi için
      işleyen sürenin kuruluşa da yansıdığını düşünmektir.
    celdiriciler:
      A: 26/2'nin ikinci cümlesi, denetçinin aynı işletmede geçirdiği sürelerin çalıştığı kuruluşa
        bakılmaksızın birlikte dikkate alınmasını öngörür; süreler ayrı ayrı sayılmaz.
      B: Bekleme süresi 26/1-(ç)'ye göre üç yıldır. İki yıllık süre, 26/3'te denetçilikten
        ayrılanların denetlenen işletmede kilit yönetici olamayacağı süredir.
      D: Kuruluşlar için süreler yalnızca aynı denetim ağı veya ilişkili kuruluşlar arasında topluca
        dikkate alınır (26/2, birinci cümle); (B)'nin kendi süresi üç yıl olduğundan kuruluş için
        kısıt doğmamıştır.
      E: 26/1-(ç) bendi KAYİK ayrımı yapmaz; kısıtlama tüm denetimler için geçerlidir. KAYİK bilgisi
        çözüme etkisi olmayan veridir.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 26/1-(ç)
    alinti: Üç yıl geçmedikçe; denetim kuruluşları ve denetim üstlenen bağımsız denetçiler ile denetim
      çalışması yürüttükleri işletmelerin denetiminde görev alan denetçileri, son on yılda yedi yıl
      denetim çalışmasını yürüttükleri aynı işletmeye ilişkin denetimleri.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 26/2
    alinti: Birinci fıkranın (ç) bendinde geçen sürelerin hesabında aynı denetim ağı içinde bulunan
      denetim kuruluşları ve denetim üstlenen bağımsız denetçiler ile bunların ilişkili olduğu denetim
      kuruluşu ve denetim üstlenen bağımsız denetçiler tarafından yapılan denetimlerde geçirdikleri
      süreler topluca dikkate alınır. Çalıştığı denetim kuruluşuna veya denetim üstlenen bağımsız
      denetçiye bakılmaksızın, denetçinin aynı işletmenin denetiminde geçirdiği süreler birlikte
      dikkate alınır.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 26/3
    alinti: Denetçiler, denetçilik görevinden ayrılmalarından itibaren iki yıl geçmedikçe son iki yılda
      denetiminde bulunduğu işletmelerde ve bağlı ortaklıklarında kilit yönetici olarak görev alamazlar.
  gecerlilik:
    baslangic: '2022-12-17'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-BDY-0003
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: sorumlu denetçi şartları ve mesleki tecrübe
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: >-
    KGK Bağımsız Denetim Yönetmeliği'ne göre sorumlu denetçi olabilme şartları ve mesleki tecrübe
    süresinin hesabı ile ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. KAYİK'ler nezdinde yapılacak denetimler için 15 yıllık mesleki tecrübeye sahip olunması ve bu
    sürenin en az üç yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile mevzuatta
    denetim öngörülen alanlarda denetimlerde bulunulmuş olması gerekir.

    II. KAYİK dışındaki denetimler için 10 yıllık mesleki tecrübeye sahip olunması ve bu sürenin en
    az üç yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile denetimlerde bulunulmuş
    olması gerekir.

    III. Dört yılı aşmamak ve aynı tarihlere denk gelen süreler mükerreren sayılmamak şartıyla,
    Yönetmelikte belirtilen alanlardaki lisans ve lisansüstü eğitim süreleri mesleki tecrübe süresine
    ilave edilir.

    IV. Denetim kuruluşunun yönetim organınca denetim raporunu imzalamaya yetkilendirilen denetçinin
    sorumlu denetçi olarak görevlendirilmesi için ayrıca Kurumun onayı aranmaz.
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, III ve IV
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: >-
      I, md. 28/1-(a)'nın aynısıdır. III, md. 15/3'ün son cümlesine uygundur: lisans ve lisansüstü
      eğitim süreleri dört yılı aşmamak ve mükerrer sayılmamak şartıyla mesleki tecrübe süresine
      eklenir. II yanlıştır; md. 28/1-(b)'ye göre KAYİK dışındaki denetimlerde 10 yıllık tecrübenin
      en az iki yılında fiilen denetimde bulunulmuş olması yeterlidir. IV yanlıştır; md. 28/1'in
      girişine göre sorumlu denetçiler Kurumun onayı alınmak suretiyle görevlendirilir, yönetim
      organınca yetkilendirilme (28/1-c) ise ayrı ve ek bir şarttır. Zor soru teknikleri: tek unsuru
      değiştirilmiş sayısal şart (II'de iki yıl yerine üç yıl), madde birleştirme (md. 28 ile md. 15/3)
      ve istisna/ek şart ayrımı (IV'te yetkilendirmenin Kurum onayının yerine geçtiği izlenimi).
    celdiriciler:
      A: II yanlıştır; KAYİK dışındaki denetimlerde fiilen denetim süresi en az iki yıldır (md. 28/1-b).
      C: II ve IV yanlış, I ve III doğrudur; bu şık doğru ifadelerin hiçbirini içermez.
      D: IV yanlıştır; sorumlu denetçiler Kurumun onayı alınarak görevlendirilir (md. 28/1, giriş).
      E: II yanlıştır; KAYİK için aranan "en az üç yıl" şartı diğer denetimlere taşınmıştır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 28/1 (giriş)
    alinti: 'Sorumlu denetçiler, denetim raporunu denetimi üstlenenler adına imzalama yetkisini haiz olup,
      aşağıdaki şartları sağlayan denetçiler arasından, Kurumun onayı alınmak suretiyle görevlendirilir:'
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 28/1-(a) ve (b)
    alinti: a) KAYİK’ler nezdinde yapılacak denetimler için 15 yıllık mesleki tecrübeye sahip olması ve
      bu sürenin en az üç yılında fiilen denetçi, kıdemli denetçi veya başdenetçi unvanı ile mevzuatta
      denetim öngörülen alanlarda denetimlerde bulunmuş olması. b) Diğer denetimler için ise 10 yıllık
      mesleki tecrübeye sahip olması ve bu sürenin en az iki yılında fiilen denetçi, kıdemli denetçi
      veya başdenetçi unvanı ile denetimlerde bulunmuş olması.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/3
    alinti: Dört yılı aşmamak ve bu fıkradaki faaliyet ve hizmetlerle aynı tarihlere denk gelen süreler
      mükerreren sayılmamak şartıyla 14 üncü maddenin birinci fıkrasının (a) bendinde belirtilen
      alanlardaki lisans ve lisansüstü eğitim süreleri bu süreye ilave edilir.
  gecerlilik:
    baslangic: '2017-07-21'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-BDY-0004
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: uygulamalı mesleki eğitim
  tip: bilgi
  zorluk: 2
  soru_bicimi: bosluk
  kok: >-
    KGK Bağımsız Denetim Yönetmeliği'ne göre denetçi olmak isteyenlerin en az (i) yıl süreyle,
    finansal tablo denetimi dahil olmak üzere mesleki konularda denetim üstlenen bağımsız denetçi
    yanında ya da denetim kuruluşunda uygulamalı eğitim almaları şarttır. En az (ii) yıl mesleki
    tecrübeye sahip olanlarda bu şart aranmaz. Uygulamalı mesleki eğitim, gerekli şartların
    sağlandığını gösteren bilgi ve belgelerin, ilgili denetim kuruluşu veya denetim üstlenen bağımsız
    denetçi tarafından Sosyal Güvenlik Kurumuna bildirim süresi içerisinde (iii) bildirilmesiyle
    başlar.


    Yukarıdaki boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?
  secenekler:
    A: (i) 2 – (ii) on – (iii) Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumuna
    B: (i) 3 – (ii) on beş – (iii) Sosyal Güvenlik Kurumuna
    C: (i) 3 – (ii) on – (iii) Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumuna
    D: (i) 3 – (ii) on beş – (iii) Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumuna
    E: (i) 2 – (ii) on beş – (iii) TÜRMOB'a
  dogru: D
  aciklama:
    dogru_neden: >-
      Md. 15/1'e göre uygulamalı eğitim süresi en az 3 yıldır; md. 15/2'ye göre en az on beş yıl
      mesleki tecrübeye sahip olanlarda bu şart aranmaz; md. 15/5'e göre eğitim, bilgi ve belgelerin
      SGK'ya bildirim süresi içerisinde Kuruma (md. 4/1-o: Kamu Gözetimi, Muhasebe ve Denetim
      Standartları Kurumu) bildirilmesiyle başlar. Tuzak, (iii) boşluğunda süreyi belirleyen SGK ile
      bildirimin yapıldığı Kurumun karıştırılmasıdır.
    celdiriciler:
      A: Uygulamalı eğitim süresi 2 değil 3 yıl, muafiyet için gereken tecrübe on değil on beş yıldır.
      B: Sosyal Güvenlik Kurumu yalnızca bildirim süresinin ölçütüdür; bildirim Kuruma yapılır.
      C: Muafiyet için gereken mesleki tecrübe on değil on beş yıldır (md. 15/2). On yıl, KAYİK dışı
        denetimlerde sorumlu denetçi için aranan tecrübe süresidir (md. 28/1-b).
      E: Süre 3 yıldır ve bildirim TÜRMOB'a değil Kuruma yapılır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/1
    alinti: Denetçi olmak isteyenlerin en az 3 yıl süreyle, finansal tablo denetimi dahil olmak üzere
      mesleki konularda (Ek ibare:RG-21/7/2017-30130) denetim üstlenen bağımsız denetçi yanında ya da
      denetim kuruluşunda uygulamalı eğitim almaları şarttır.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/2
    alinti: En az on beş yıl mesleki tecrübeye sahip olanlarda uygulamalı mesleki eğitim şartı aranmaz.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 15/5
    alinti: Uygulamalı mesleki eğitim, gerekli şartların sağlandığını gösteren bilgi ve belgelerin, ilgili
      denetim kuruluşu veya denetim üstlenen bağımsız denetçi tarafından Sosyal Güvenlik Kurumuna
      bildirim süresi içerisinde, Kuruma bildirilmesiyle başlar.
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 4/1-(o)
    alinti: 'o) Kurum: Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunu,'
  gecerlilik:
    baslangic: '2017-07-21'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-BDY-0005
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Bağımsız Denetim Yönetmeliği
  konu: BDY
  kazanim: kendi adına denetim
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: >-
    KGK Bağımsız Denetim Yönetmeliği'ne göre, bağımsız denetçilerin kendi adına denetim
    üstlenebilmesi için aranan şartlar arasında aşağıdakilerden hangisi **yoktur**?
  secenekler:
    A: Denetim kadrosunda kendisi hariç en az iki sorumlu denetçinin bulunması
    B: Başvuranın sorumlu denetçi olabilme şartlarını karşılaması
    C: Denetim kadrosunun, asgari olarak, Yönetmelikte belirtilen denetim ekiplerini oluşturabilecek
      nitelik ve genişlikte olması
    D: Denetçilerin tam zamanlı ve asgari bir raporlama dönemi için istihdam edilmiş olması
    E: Kendisinin ve denetçilerinin herhangi bir denetim kuruluşunda ortak, kilit yönetici veya
      denetçi olarak görev almaması
  dogru: A
  aciklama:
    dogru_neden: >-
      Md. 14/3-(d)'ye göre denetim kadrosunda kendisi hariç en az bir sorumlu denetçinin bulunması
      yeterlidir; "en az iki" ifadesi sayısal şartı değiştirmiştir. "En az iki sorumlu denetçi" şartı
      md. 13/1-(ğ)'de denetim kuruluşlarının yetkilendirilmesi için aranır; tuzak bu iki hükmün
      karıştırılmasıdır.
    celdiriciler:
      B: Md. 14/3-(b)'de sayılan şarttır.
      C: Md. 14/3-(c)'de sayılan şarttır (27 nci maddedeki denetim ekipleri).
      D: Md. 14/3-(ç)'de sayılan şarttır.
      E: Md. 14/3-(e)'de sayılan şarttır.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 14/3-(b), (c), (ç), (d)
    alinti: b) Başvuranın sorumlu denetçi olabilme şartlarını karşılaması, c) Denetim kadrosunun, asgari
      olarak, 27 nci maddede belirtilen denetim ekiplerini oluşturabilecek nitelik ve genişlikte olması,
      ç) Denetçilerin tam zamanlı ve asgari bir raporlama dönemi için istihdam edilmiş olması, d) Denetim
      kadrosunda kendisi hariç en az bir sorumlu denetçinin bulunması,
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 14/3-(e)
    alinti: e) Kendisinin ve denetçilerinin herhangi bir denetim kuruluşunda veya başka bir denetim
      üstlenen bağımsız denetçi yanında ortak, kilit yönetici veya denetçi olarak görev almaması ve
      denetçilerinin ayrıca denetim üstlenen bağımsız denetçi olarak faaliyette bulunmaması,
