- id: SMMM-DEN-ICK-0031
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 240 hile ve hile üçgeni
  tip: uygulama
  zorluk: 2
  kok: Bir bağımsız denetimde denetçi, satış faturalarını incelerken bazı faturalardaki bilgilerin tahrif edilmiş olabileceğine
    inanmasına yol açan tespitlerde bulunmuştur. BDS 240’a göre denetçinin bu durumda yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Faturaları çalışma kâğıtlarından çıkararak yalnızca diğer belgelere dayanır.
    B: Belgelerin gerçekliğine ilişkin araştırmalarını derinleştirir.
    C: Belgelerin gerçek olduğunu kabul etmeye devam eder; çünkü gerçekliği doğrulamakla yükümlü değildir.
    D: Konuyu yönetimden alacağı yazılı beyanla sonuçlandırır ve ilave prosedür uygulamaz.
    E: Denetimi sonlandırarak yetkili kuruma rapor eder.
  dogru: B
  aciklama:
    dogru_neden: BDS 240 par. 14 uyarınca denetçi, aksini düşünmesini gerektiren bir gerekçe olmadığı sürece kayıt ve belgelerin
      gerçek olduğunu kabul edebilir; ancak yapılan tespitler bir belgenin gerçek olmayabileceğine veya bilgilerinin tahrif
