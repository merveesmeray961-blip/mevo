    B: Yeni kanıt toplayarak önemli bir hususa ilişkin vardığı sonucu değiştirmek
    C: Saklama süresi dolmadan önce nihai dosyadaki imzalı çalışma kâğıtlarını yok etmek
    D: Yönetim temsil mektubunu rapor tarihinden sonraki bir tarihle yeniden düzenlemek
    E: Çalışma kâğıtlarına yeni bir denetim prosedürünün sonuçlarını eklemek
  dogru: A
  aciklama:
    dogru_neden: 'BDS 230 A22’ye göre çalışma kâğıtlarının nihai denetim dosyasında birleştirilmesi yeni denetim prosedürleri
      uygulanmasını veya yeni sonuçlara ulaşılmasını içermeyen idari bir süreçtir; bu süreçte idari nitelikte olmak kaydıyla
      yenilenmiş çalışma kâğıtlarının eski taslaklarının silinmesi veya çıkarılması gibi değişiklikler yapılabilir. Püf noktaları:
      Birleştirme süreci idaridir, “yeni prosedür” ve “yeni sonuç” içeremez; saklama süresi dolmadan çalışma kâğıdı yok etmek
      ise par. 15 ile yasaktır. Yani silinebilen şey, yenilenerek yerini yeni sürüme bırakmış eski taslaktır.'
    celdiriciler:
      B: Yeni kanıtla sonucu değiştirmek idari işlem değildir; A22 birleştirme sürecinin yeni sonuç içermediğini belirtir.
      C: Par. 15 uyarınca çalışma kâğıtları saklama süresi sona ermeden silinemez, atılamaz veya yok edilemez.
      D: Temsil mektubunun yeniden düzenlenmesi idari değişiklikler arasında sayılmamıştır; belge kaydını sonradan değiştirmek
        par. 16 kapsamında belgelendirmeyi gerektirir.
      E: Yeni prosedür sonuçlarının eklenmesi birleştirme sürecinin dışındadır; bu durum par. 13 ve 16 kapsamında özel belgelendirme
        gerektirir.
