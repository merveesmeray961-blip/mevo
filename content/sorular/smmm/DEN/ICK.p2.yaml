  kok: BDS 230 “Bağımsız Denetimin Belgelendirilmesi” standardında tanımlanan tecrübeli denetçinin yeterli seviyede bilgiye
    sahip olması gereken alanlar arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Denetim süreçleri
    B: BDS’ler ve mevzuat hükümleri
    C: İşletmenin faaliyet gösterdiği iş çevresi
    D: Vergi mevzuatına ilişkin ayrıntılı danışmanlık uygulamaları
    E: İşletmenin faaliyet gösterdiği sektörle ilgili denetim ve finansal raporlamaya ilişkin hususlar
  dogru: D
