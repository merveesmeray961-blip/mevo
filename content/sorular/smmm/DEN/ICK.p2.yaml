  kok: Çalışan sayısı az olan bir işletmede satış görevlisi hem müşteri siparişlerini girmekte hem de ürün fiyat dosyalarını
    değiştirebilmektedir; ek personel istihdamı maliyet açısından mümkün olmamaktadır. BDS 315 Ek 3’e göre yönetimin bu durumda
    uygulayabileceği alternatif kontrol aşağıdakilerden hangisidir?
  secenekler:
    A: Satış görevlisinin fiyat dosyalarına erişimini kaldırarak siparişleri de başka birine devretmesi
    B: Satış işleviyle ilgisi olmayan personelin fiyat değişikliklerini periyodik olarak gözden geçirmesi
    C: Satış görevlisinin değişiklik yaptığını yönetime yıllık raporla bildirmesi
    D: Fiyat değişikliklerinin yalnızca dönem sonunda satış görevlisi tarafından kendi kendine gözden geçirilmesi
    E: Görevler ayrılığı sağlanamadığı için fiyat kontrolünün tamamen kaldırılması
  dogru: B
  aciklama:
    dogru_neden: 'BDS 315 Ek 3 par. 20’ye göre görevler ayrılığı bazı durumlarda pratik, fayda-maliyet açısından uygun veya
      uygulanabilir olmayabilir; bu durumda yönetim alternatif kontroller uygulayabilir. Örneğin satış görevlisinin ürün fiyat
      dosyalarını değiştirebilmesi durumunda, satış işleviyle ilgisi olmayan personelin fiyatların değiştirilip değiştirilmediğini
      ve hangi şartlar altında değiştirildiğini periyodik olarak gözden geçirmesi için tespit edici bir kontrol faaliyeti
      uygulanabilir. Püf noktaları: Görevler ayrılığı yoksa telafi edici kontrolün gözden geçireni, işlemi yapandan bağımsız
      olmalıdır; kendi kendine gözden geçirme veya kontrolü kaldırma çözüm değildir. Ayrıca ek personel maliyeti engel olduğu
      için “görevi devretme” seçeneği soru koşuluyla çelişir.'
    celdiriciler:
      A: Ek personel istihdamı mümkün olmadığından siparişleri başka birine devretmek soru koşuluyla bağdaşmaz; Ek 3 alternatif
        kontrol öngörür.
      C: Yıllık raporlama, tespit edici kontrol olarak periyodik ve bağımsız gözden geçirmenin yerine geçmez; gözden geçirme
        satış işleviyle ilgisi olmayan kişilerce yapılmalıdır.
      D: Kendi kendine gözden geçirme bağımsızlık sağlamaz; Ek 3 satış işleviyle ilgisi olmayan personelin gözden geçirmesini
        örnek verir.
      E: Görevler ayrılığının uygulanamaması kontrolün kaldırılmasını değil, alternatif kontrol uygulanmasını gerektirir.
