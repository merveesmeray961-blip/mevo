    dogru_neden: 'BDS 240 par. 27 uyarınca hasılatın finansal tablolara alınmasında hile riskleri bulunduğu varsayımı esastır.
      Par. 48’e göre denetçi bu varsayımın yürütülen denetimde geçerli olmadığı sonucuna ulaşırsa bunun gerekçelerini çalışma
      kâğıtlarına dâhil eder. Püf noktaları: Varsayım “risk vardır” yönündedir; bunun aksini savunan denetçi gerekçeyi belgelendirmek
      zorundadır. Belgelendirmenin yeri raporlama değil çalışma kâğıtlarıdır ve yönetim beyanı yerine geçmez.'
    celdiriciler:
      A: Par. 48 varsayımın geçerli olmadığı sonucuna varıldığında gerekçelerin çalışma kâğıtlarına dâhil edilmesini zorunlu
        kılar.
      B: Yönetim beyanı denetçinin kendi sonucunun gerekçesini belgelendirme yükümlülüğünün yerine geçmez.
      C: Risk olarak belirlenmeyen hasılatın ciddi risk sayılması gerekmez; ayrıca sonucun belgelendirilmemesi par. 48’e aykırıdır.
      E: Par. 48 belgelendirmenin yerini çalışma kâğıtları olarak belirler; denetçi raporuna ilişkin bir yükümlülük getirmez.
