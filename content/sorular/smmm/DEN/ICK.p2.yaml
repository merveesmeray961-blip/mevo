  kok: 'Bir işletmede ticari alacaklar hesabına ilişkin üç ayrı iç kontrol eksikliği belirlenmiştir: müşteri limit onaylarının
    zaman zaman atlanması, mutabakatların geç hazırlanması ve tahsilat kayıtlarının bir kısmının elle işlenmesi. Denetçi,
    eksikliklerin hiçbirinin tek başına önemli sayılacak kadar büyük olmadığını düşünmekte; ayrıca hesap bakiyesinde herhangi
    bir yanlışlık da tespit etmemiştir. BDS 265’e göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Yanlışlık tespit edilmediği için eksikliklerin önemli sayılması mümkün değildir ve bildirim gerekmez.
    B: Eksiklikler yalnızca tek tek değerlendirilir; birlikte oluşturdukları etki dikkate alınmaz ve hesaplanan toplam etki
      yok sayılır.
    C: Eksikliklerin önemli sayılması için en az birinin tek başına önemli olması şarttır.
    D: Aynı hesabı etkileyen eksiklikler birlikte önemli sayılabilir; yanlışlık tespit edilmemesi bunu engellemez.
    E: Eksiklikler yalnızca yanlışlık gerçekleşirse bildirilir; aksi hâlde yönetime sözlü bildirim yeterlidir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 265 par. 8 uyarınca denetçi, eksikliklerin tek başına veya birlikte önemli bir eksiklik teşkil edip
      etmediğine karar verir. A5’e göre eksikliğin önemi, yanlışlığın gerçekten meydana gelip gelmediğine değil, meydana gelebilme
      ihtimaline ve muhtemel büyüklüğüne bağlıdır; denetçi yanlışlık tespit etmemiş olsa dahi önemli eksiklikler mevcut olabilir.
      A8’e göre tek başına önemli olmayan eksiklikler, aynı hesap bakiyesini etkilediklerinde bir bütün olarak önemli eksikliğe
      neden olabilir. Püf noktaları: Soruda “tek başına önemsiz” ve “yanlışlık yok” bilgileri sizi yanıltmasın; değerlendirme
      bileşim esasına göre yapılır ve yanlışlığın gerçekleşmesi şart değildir. Önemli sayılan eksiklik üst yönetimden sorumlu
      olanlara zamanında ve yazılı bildirilir.'
    celdiriciler:
      A: A5 yanlışlık tespit edilmemiş olsa dahi önemli eksikliklerin mevcut olabileceğini belirtir.
      B: Par. 8 eksikliklerin tek başına veya birlikte önemli eksiklik teşkil edip etmediğine karar verilmesini ister; bileşim
        dikkate alınır.
      C: A8, tek başına önemli olmayan eksikliklerin bileşiminin önemli eksikliğe neden olabileceğini belirtir; tek tek önemli
        olma şartı yoktur.
      E: Önemli eksiklikler par. 9 uyarınca üst yönetimden sorumlu olanlara zamanında ve yazılı bildirilir; yanlışlığın gerçekleşmesi
        bildirimin şartı değildir.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A5
    alinti: Bir iç kontrol eksikliğinin veya eksikliklerinin bileşiminin önemi, sadece bir yanlışlığın gerçekten meydana gelip
      gelmediğine değil, aynı zamanda bir yanlışlığın meydana gelebilme ihtimaline ve yanlışlığın muhtemel büyüklüğüne bağlıdır.
      Bu nedenle denetçi denetim sırasında yanlışlık tespit etmemiş olsa dahi, önemli eksiklikler mevcut olabilir.
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
