        değildir.
      D: Muvazaalı işlemler hilenin tespitini güçleştirebilir (par. 6); ancak yönetim hilesinin her zaman bunlarla desteklendiği
        söylenemez ve risk farkının nedeni bu değildir.
      E: Üst yönetimden sorumlu olanlarla iletişim standartta düzenlenmiştir (par. 21-22, 42); katılımın hiç olmaması risk
