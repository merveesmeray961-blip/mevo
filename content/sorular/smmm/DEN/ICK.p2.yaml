- id: SMMM-DEN-ICK-0047
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 iç kontrol eksikliği
  tip: uygulama
  zorluk: 3
  kok: Denetçi önceki yıl denetiminde, stok kontrollerine ilişkin önemli bir iç kontrol eksikliğini yönetime ve üst yönetimden
    sorumlu olanlara bildirmiştir. Yönetim, düzeltici işlemlerin maliyetini yüksek bularak eksikliği gidermemiştir. Cari yıl
    denetiminde aynı eksiklik sürmektedir. BDS 265 “İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime
    Bildirilmesi” standardına göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Önceki yıl bildirim yapıldığı için cari yıl yeniden bildirim yapma zorunluluğu bulunmaz.
    B: Yönetim maliyet nedeniyle gidermemeyi tercih ettiğinden denetçinin yeniden bildirimi gerekmez.
    C: Önceki yıl bildirimine atıfta bulunarak veya açıklamayı tekrarlayarak cari yıl da bildirmelidir.
    D: Denetçi, eksikliği yalnızca yönetime sözlü olarak hatırlatmakla yetinebilir ve yazılı bildirim yapmaz.
    E: Eksiklik, yönetimin kararıyla kabul edildiği için artık önemli eksiklik sayılmaz ve bildirilmez.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 265 A17’ye göre önceki denetimde bildirilen önemli eksiklik için düzeltici işlemler henüz yapılmamışsa
      denetçinin aynı bildirimi tekrar etme zorunluluğu ortadan kalkmaz; cari yıl bildiriminde önceki yılın açıklaması tekrarlanabilir
      veya sadece bir önceki bildirime atıfta bulunulabilir. A16’ya göre düzeltici işlemlerin maliyet-fayda değerlendirmesi
      yönetimin sorumluluğudur ve par. 9’daki hüküm bu kaygılardan bağımsız geçerlidir. Püf noktaları: “Daha önce bildirdim”
      ve “yönetim maliyet nedeniyle gidermiyor” gerekçelerinin ikisi de bildirim yükümlülüğünü kaldırmaz. Mantıklı bir açıklama
      olmaksızın eksikliğin giderilmemesi başlı başına önemli bir eksiklik olabilir.'
    celdiriciler:
      A: A17 daha önce bildirilmiş olmasının, düzeltici işlemler yapılmamışsa tekrar bildirme zorunluluğunu ortadan kaldırmadığını
        belirtir.
      B: A16 uyarınca par. 9, yönetimin maliyet veya diğer kaygılardan bağımsız olarak geçerlidir; maliyet gerekçesi bildirimi
        gereksiz kılmaz.
      D: Önemli eksiklikler yazılı bildirilir (par. 9); sözlü hatırlatma yeterli değildir.
      E: Yönetimin gidermemeyi seçmesi eksikliğin önemini azaltmaz; A17’ye göre mantıklı bir açıklama olmaksızın giderilmemesi
        başlı başına önemli eksiklik olabilir.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A17
    alinti: Denetçinin daha önceki bir denetimde önemli bir eksikliği yönetime ve üst yönetimden sorumlu olanlara bildirmiş
      olması, düzeltici işlemler henüz yapılmamışsa denetçinin aynı bildirimi tekrar etme zorunluluğunu ortadan kaldırmaz.
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A16
    alinti: Düzeltici işlemlerin uygulanmasından doğacak maliyet ve faydaların değerlendirilmesi sorumluluğu yönetime ve üst
      yönetimden sorumlu olanlara aittir.
