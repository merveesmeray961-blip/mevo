    bu süreçte yeni bir denetim prosedürü uygulamamakta ve yeni bir sonuca ulaşmamaktadır. BDS 230 “Bağımsız Denetimin Belgelendirilmesi”
    standardına göre ekibin bu süreçte yapabileceği, idari nitelikteki değişiklik aşağıdakilerden hangisidir?
