- id: SMMM-DEN-ICK-0039
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 iç kontrol eksikliği
  tip: uygulama
  zorluk: 3
  kok: Bir bağımsız denetimde denetçi, alacak takip sürecinde önemli bir iç kontrol eksikliği belirlemiş ve konuyu işletmenin
    mali işler müdürüyle sözlü olarak görüşmüştür. Yönetim düzeltici işlemlere başlamıştır. Üst yönetimden sorumlu olanlara
    bildirimin zamanlamasını da değerlendiren denetçi, yönetimin eksikliği zaten bildiğini düşünmektedir. BDS 265 “İç Kontrol
    Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi” standardına göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Sözlü görüşme ve düzeltici işlem başladığı için yazılı bildirim yükümlülüğü ortadan kalkar.
    B: Yönetimin eksikliği önceden bilmesi, önemli eksikliğin yazılı bildirilmesi sorumluluğunu kaldırır.
    C: Zamanında ve yazılı bildirim gerekir; erken sözlü bildirim bu sorumluluğu ortadan kaldırmaz.
    D: Yazılı bildirim yalnızca yönetimin düzeltici işlem yapmadığı durumlarda gerekir.
    E: Önemli eksiklik yalnızca yönetime bildirilir; üst yönetimden sorumlu olanlara bildirim isteğe bağlıdır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 265 par. 9 uyarınca denetçi, denetim sırasında tespit edilen önemli iç kontrol eksikliklerini üst yönetimden
      sorumlu olanlara zamanında ve yazılı olarak bildirir. A14’e göre denetçi düzeltici işlemlerin zamanında yapılmasına
      yardımcı olmak için eksiklikleri ilk aşamada sözlü bildirebilir; ancak bu uygulama yazılı bildirme sorumluluğunu ortadan
      kaldırmaz. A16’ya göre yönetimin eksikliği önceden bilmesi veya maliyet kaygısıyla gidermemeyi tercih etmesi de par.
      9’u etkilemez. Püf noktaları: “Sözlü bildirim” ve “düzeltici işlemin başlaması” birer ek adımdır, yazılı bildirimin
      yerine geçmez. Önemli eksiklikte muhatap önce üst yönetimden sorumlu olanlardır; yönetime ayrıca bildirim par. 10’un
      konusudur.'
    celdiriciler:
      A: A14, sözlü bildirimin yazılı bildirim sorumluluğunu ortadan kaldırmadığını açıkça belirtir; düzeltici işlem başlaması
        da bu yükümlülüğü değiştirmez.
      B: A16 uyarınca yönetimin eksikliği önceden bilmesi veya gidermemeyi tercih etmesi par. 9’daki bildirim yükümlülüğünü
        etkilemez.
      D: Par. 9’daki yükümlülük yönetimin düzeltici işlem yapıp yapmadığına bağlı değildir.
      E: Par. 9 önemli eksikliklerin üst yönetimden sorumlu olanlara yazılı bildirilmesini zorunlu kılar; bu bildirim isteğe
        bağlı değildir.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: par. 9
    alinti: Denetçi denetim sırasında tespit edilen önemli iç kontrol eksikliklerini üst yönetimden sorumlu olanlara zamanında
      ve yazılı olarak bildirir
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A14
    alinti: Ancak bu uygulama denetçinin bu BDS uyarınca gerekli olan önemli eksiklikleri yazılı olarak bildirme sorumluluğunu
      ortadan kaldırmaz.
