  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: COSO
  tip: uygulama
  zorluk: 3
  kok: Bir işletmede iki faaliyet yürütülmektedir. (I) Her ay satış faturaları ile sevk irsaliyeleri karşılaştırılarak eksik
    veya hatalı kayıtlar tespit edilip düzeltilmektedir. (II) Muhasebe müdürü, hataların neden oluştuğunu sorgulamakta ve
    gelecekteki hataları önlemek için süreci düzeltme sorumluluğunu ilgili birime atamaktadır. BDS 315 Ek 3’ün bilgi sistemiyle
    ilgili kontrol ile izleme faaliyeti ayrımına göre bu faaliyetlerin nitelendirilmesi aşağıdakilerden hangisidir?
  secenekler:
    A: I kontrol faaliyetidir, II izleme faaliyetidir.
    B: I izleme faaliyetidir, II kontrol faaliyetidir.
    C: Her ikisi de izleme faaliyetidir.
    D: Her ikisi de kontrol faaliyetidir.
    E: Her ikisi de kontrol çevresi bileşeninin unsurudur.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 315 Ek 3 par. 13’e göre bilgi sistemiyle ilgili bir kontrol belirli bir riske karşılık verirken, bir
      izleme faaliyeti iç kontrol sisteminin bileşenlerindeki kontrollerin amaçlandığı gibi işleyip işlemediğini değerlendirir.
      Aylık tamlık kontrolünün amacı hataları tespit etmek ve düzeltmektir (kontrol); hataların neden oluştuğunu sorgulayıp
      süreci düzeltme sorumluluğunu atayan faaliyet izleme faaliyetidir. Püf noktaları: “Hatayı bulup düzeltiyorsa kontrol;
      hatanın nedenini sorgulayıp sistemi düzeltiyorsa izleme” ayrımını yapın. Gözetim incelemelerinin otomatik olarak izleme
      sayılmayacağını, nitelendirmenin mesleki muhakemeye bağlı olduğunu da unutmayın.'
    celdiriciler:
      B: 'Sıralama ters çevrilmiştir: hataları tespit edip düzelten faaliyet kontrol, nedenini sorgulayan faaliyet izlemedir.'
      C: Aylık eşleştirme hataları tespit edip düzeltir; bu faaliyet izleme değil belirli bir riske karşılık veren kontroldür.
      D: Hataları tespit edip düzelten faaliyet (I) belirli bir riske karşılık veren kontrol niteliğindedir; izleme faaliyeti
        değildir.
      E: Hataların nedenini sorgulayıp süreci düzeltme sorumluluğunu atayan faaliyet (II) izleme niteliğindedir; yalnızca
        kontrol sayılamaz.
  kaynaklar:
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi (Ek 3)
    madde: Ek 3 par. 13
    alinti: Basit bir ifadeyle, bilgi sistemiyle ilgili bir kontrol belirli bir riske karşılık verirken, bir izleme faaliyeti,
