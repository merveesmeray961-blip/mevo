      ve mevzuat hükümleri, işletmenin faaliyet gösterdiği iş çevresi ile sektörle ilgili denetim ve finansal raporlama hususlarında
      yeterli seviyede bilgiye sahip kişidir. Vergi danışmanlığı uygulamaları bu alanlar arasında sayılmamıştır.
    celdiriciler:
      A: Denetim süreçleri par. 6(c)(i)’de sayılan bilgi alanıdır.
      B: BDS’ler ve mevzuat hükümleri par. 6(c)(ii)’de sayılan bilgi alanıdır.
      C: İşletmenin faaliyet gösterdiği iş çevresi par. 6(c)(iii)’te sayılan bilgi alanıdır.
      E: Sektörle ilgili denetim ve finansal raporlama hususları par. 6(c)(iv)’te sayılan bilgi alanıdır.
