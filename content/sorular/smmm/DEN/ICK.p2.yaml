- id: SMMM-DEN-ICK-0060
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 230 belgelendirme
  tip: uygulama
  zorluk: 3
  kok: Bir denetim ekibi nihai denetim dosyasını oluşturmuştur. Bir süre sonra, kalite izleme faaliyeti sırasında alınan yorumlar
    üzerine ekip, mevcut bir çalışma kâğıdına açıklık kazandırmak istemektedir; bu değişiklik denetçi raporunu veya ulaşılan
    sonuçları etkilememektedir. BDS 230 “Bağımsız Denetimin Belgelendirilmesi” standardına göre ekip bu değişiklik için aşağıdakilerden
    hangisini yapmalıdır?
  secenekler:
    A: Değişiklik yalnızca açıklama niteliğinde olduğundan belgelendirme yapmaz ve dosyayı değiştirmez.
    B: Önceki çalışma kâğıdını silerek yenisini hazırlar, eski tarihi korur ve hiçbir kayıt düşmez.
    C: Değişikliğin özel sebeplerini ve ne zaman, kim tarafından yapıldığını ve gözden geçirildiğini belgelendirir.
    D: Denetçi raporunu yeniden düzenleyerek yeni bir tarihle yayımlar ve dosyayı kapatır.
    E: Değişikliği yalnızca denetim şirketi yönetimine bildirir; çalışma kâğıdına kayıt düşmez ve gözden geçirilmez.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 230 par. 16 uyarınca nihai denetim dosyasında birleştirme tamamlandıktan sonra mevcut çalışma kâğıtlarında
      değişiklik yapmak veya yeni çalışma kâğıdı eklemek gerekirse, değişikliklerin veya eklemelerin niteliğine bakılmaksızın
      değişiklik veya ekleme yapılmasının özel sebepleri ile bunların ne zaman ve kim tarafından yapıldığı ve gözden geçirildiği
      belgelendirilir. A24, izleme faaliyetleri veya dış teftişlerde alınan yorumlara bağlı açıklık ihtiyacını bu duruma örnek
      gösterir. Püf noktaları: “Yalnızca açıklama” olması belgelendirme yükümlülüğünü ortadan kaldırmaz; par. 16 niteliğe
      bakmaz. Rapor tarihinden sonra yeni prosedür veya yeni sonuç söz konusu olsaydı par. 13 de devreye girerdi.'
    celdiriciler:
      A: Par. 16 değişikliğin veya eklemenin niteliğine bakılmaksızın belgelendirmeyi zorunlu kılar.
      B: Çalışma kâğıtları saklama süresi sona ermeden silinemez veya yok edilemez (par. 15); yenisini hazırlayıp eskisini
        silmek de yasaktır.
      D: Denetçi raporunu yeniden düzenlemek çalışma kâğıdına açıklık kazandırmanın gereği değildir ve sonuçlar etkilenmediğinden
        söz konusu olmaz.
      E: Değişiklik çalışma kâğıdında belgelendirilmelidir; yalnızca yönetime bildirim par. 16’nın gereğini karşılamaz.
  kaynaklar:
  - mevzuat: BDS 230 Bağımsız Denetimin Belgelendirilmesi
    madde: par. 16
    alinti: çalışma kâğıtlarının nihai denetim dosyasında birleştirilmesi işlemi tamamlandıktan sonra mevcut çalışma kâğıtlarında
      değişiklik yapmayı veya yeni çalışma kâğıtları eklemeyi gerekli görürse, yapılan değişikliklerin veya eklemelerin niteliğine
      bakılmaksızın aşağıdaki hususları belgelendirir
  - mevzuat: BDS 230 Bağımsız Denetimin Belgelendirilmesi
