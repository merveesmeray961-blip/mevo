  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: COSO
  tip: bilgi
  zorluk: 1
  kok: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi standardının Ek 3’üne göre, ne kadar etkin
    olursa olsun bir işletmenin iç kontrol sistemi, finansal raporlama amaçlarına ulaşılması konusunda hangi düzeyde güvence
    sağlayabilir?
  secenekler:
    A: Kontroller etkin işlediği sürece mutlak güvence
    B: Bağımsız denetçinin görüşüyle birlikte kesin güvence
    C: Kontrollerin ağırlıklı olarak otomatik olması hâlinde yüksek güvence
    D: Üst yönetimden sorumlu olanların gözetimi varsa tam güvence
    E: Yapısal kısıtlamalar nedeniyle yalnızca makul güvence
  dogru: E
  aciklama:
    dogru_neden: BDS 315 Ek 3 par. 22 uyarınca ne kadar etkin olursa olsun bir işletmenin iç kontrol sistemi, finansal raporlama
      amaçlarına ulaşılması konusunda sadece makul bir güvence sağlayabilir; amaçlara ulaşma ihtimali iç kontrolün yapısal
      kısıtlamalarından etkilenir.
    celdiriciler:
      A: Kontrollerin etkin işlemesi mutlak güvence sağlamaz; sağlanabilecek güvence makul düzeydedir.
      B: Bağımsız denetçinin görüşü iç kontrolün sağlayabileceği güvence düzeyini değiştirmez.
      C: Otomatik kontrollerin ağırlığı, insan hatası ve atlatma gibi yapısal kısıtlamaları ortadan kaldırmaz.
      D: Üst yönetimden sorumlu olanların gözetimi iç kontrolün yapısal kısıtlamalarını ortadan kaldırmaz; güvence yine makul
        düzeydedir.
  kaynaklar:
