- id: SMMM-DEN-ICK-0026
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 240 hile ve hile üçgeni
  tip: kavrama
  zorluk: 1
  kok: BDS 240 “Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları” standardına göre,
    yönetimin ve üst yönetimden sorumlu olanların doğruluk ve dürüstlükleri konusunda denetçinin geçmişte olumlu bir tecrübesi
    bulunmaktadır. Denetçinin bu tecrübe karşısındaki tutumu aşağıdakilerden hangisidir?
  secenekler:
    A: Hile riski değerlendirmelerini yönetimin açıklamalarına dayandırarak şüpheciliğini hafifletir.
    B: Mesleki şüpheciliği yalnızca ilk kez denetlenen işletmelerde sürdürür.
    C: Geçmiş tecrübesine bakmaksızın, hile ihtimalinin bilinciyle şüpheciliğini sürdürür.
    D: Şüpheciliğini yalnızca yönetimin sorgulamalara tutarsız cevap verdiği dönemlerde sürdürür.
    E: Geçmiş tecrübesi olumlu olduğundan hile riski faktörlerini değerlendirmeyi atlar.
  dogru: C
  aciklama:
    dogru_neden: BDS 240 par. 13 uyarınca denetçi, yönetimin ve üst yönetimden sorumlu olanların doğruluk ve dürüstlükleri
      hakkındaki geçmiş tecrübesine bakmaksızın, hile kaynaklı önemli bir yanlışlık olabileceği ihtimalinin bilinciyle denetim
      boyunca mesleki şüpheciliğini sürdürür.
    celdiriciler:
      A: Geçmiş tecrübe, şüpheciliğin gevşetilmesine gerekçe olamaz; yönetim açıklamaları tek başına dayanak sayılmaz.
      B: Mesleki şüphecilik denetim boyunca sürdürülür; yalnızca ilk denetimlerle sınırlı değildir.
      D: Tutarsız cevaplar ayrıca araştırılır (par. 15); ancak şüphecilik bu dönemlerle sınırlı olmayıp denetim boyunca sürer.
      E: Denetçi, hile riski faktörlerini değerlendirmekten (par. 25) geçmiş tecrübeye dayanarak vazgeçemez.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 13
    alinti: denetçi, yönetimin ve üst yönetimden sorumlu olanların doğruluk ve dürüstlükleri hakkındaki geçmiş tecrübesine
      bakmaksızın, hile kaynaklı önemli bir yanlışlık olabileceği ihtimalinin bilinciyle, denetim boyunca mesleki şüpheciliğini
      sürdürür
