- id: SMMM-DEN-ICK-0027
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 iç kontrol eksikliği
  tip: bilgi
  zorluk: 1
  kok: BDS 265 “İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi” standardında denetçinin
    amacı aşağıdakilerden hangisi olarak belirlenmiştir?
  secenekler:
    A: Önemli bulduğu iç kontrol eksikliklerini üst yönetimden sorumlu olanlara ve yönetime bildirmek.
    B: İşletmenin iç kontrol sisteminin etkinliği hakkında ayrı bir görüş oluşturmak.
    C: Denetim sırasında tespit ettiği her iç kontrol eksikliğini, önemine bakmaksızın yazılı olarak yönetime iletmek.
    D: İç kontrol eksikliklerinin giderilmesi için işletmeye düzeltici bir eylem planı hazırlamak.
    E: Yalnızca finansal tablolarda yanlışlığa yol açmış kontrol eksikliklerini raporlamak.
  dogru: A
  aciklama:
    dogru_neden: BDS 265 par. 5 uyarınca denetçinin amacı, denetim sırasında tespit ettiği ve mesleki muhakemesi sonucunda
      üst yönetimden sorumlu olanların ve yönetimin dikkatini çekmeyi gerektirecek kadar önemli olduğuna kanaat getirdiği
      iç kontrol eksikliklerini uygun bir biçimde üst yönetimden sorumlu olanlara ve yönetime bildirmektir.
    celdiriciler:
      B: Denetçi iç kontrolü, etkinliğine ilişkin görüş vermek için değil, uygun denetim prosedürleri tasarlamak amacıyla
        dikkate alır (par. 11).
      C: Bildirim kapsamı denetçinin mesleki muhakemesiyle önemli bulduğu eksikliklerle sınırlıdır; önemsiz eksiklerin tamamı
        yazılı bildirilmez.
      D: Düzeltici işlemlerin değerlendirilmesi ve uygulanması yönetimin ve üst yönetimden sorumlu olanların sorumluluğundadır
        (A16).
      E: Eksikliğin önemi, yanlışlığın gerçekleşmesine bağlı değildir; yanlışlık tespit edilmemiş olsa da önemli eksiklik
        bulunabilir (A5).
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: par. 5
    alinti: Denetçinin amacı, denetim sırasında tespit ettiği ve mesleki muhakemesi sonucunda üst yönetimden sorumlu olanların
      ve yönetimin dikkatini çekmeyi gerektirecek kadar önemli olduğuna kanaat getirdiği iç kontrol eksikliklerini uygun bir
