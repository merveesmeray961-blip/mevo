      hakkında bilgilerinin olup olmadığını belirlemek amacıyla üst yönetimden sorumlu olanları sorgular; bu sorgulamalar,
      yönetimin verdiği cevapların doğrulanması için kullanılır.
    celdiriciler:
      A: Sorgulamalar yönetimin cevaplarının doğrulanması içindir; bu cevapların yerine geçen tek kanıt değildir.
      B: İç denetim fonksiyonu bulunan işletmelerde ayrıca iç denetime başvurulur (par. 20); üst yönetimden sorumlu olanların
        sorgulanması bunun yerine geçmez.
      C: Finansal tabloların onayı yönetimin ve üst yönetimden sorumlu olanların sorumluluğundadır; sorgulama bu amaca yönelik
        değildir.
      D: Hilenin önlenmesi ve tespitine ilişkin esas sorumluluk yönetimdedir; denetçinin sorgulaması sorumluluğu devretmez.
