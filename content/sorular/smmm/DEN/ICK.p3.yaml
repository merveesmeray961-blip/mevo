- id: SMMM-DEN-ICK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 240 hile ve hile riski faktörleri kavramı
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: BDS 240 "Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları" standardına
    göre, hile yapmaya teşvik eden, hile için baskı oluşturan veya hile yapma fırsatı sağlayan olay veya şartlar
    aşağıdakilerden hangisidir?
  secenekler:
    A: Hile riski faktörleri
    B: Denetim riski
    C: Hile
    D: Kontrol riski
    E: Önemli yanlışlık riski
  dogru: A
  aciklama:
    dogru_neden: BDS 240 par. 12, "hile riski faktörleri" terimini hile yapmaya teşvik eden, hile için baskı oluşturan
      veya hile yapma fırsatı sağlayan olay veya şartlar olarak tanımlar. Örneğin ilave özkaynak finansmanı sağlamak
      için üçüncü tarafların beklentilerini karşılama ihtiyacı baskı, gerçekçi olmayan kâr hedeflerinin tutturulması
      hâlinde ciddi primlerin verileceği taahhüdü teşvik, etkin olmayan bir kontrol çevresi ise fırsat oluşturabilir
      (BDS 240 A24).
    celdiriciler:
      B: Denetim riski, finansal tablolar önemli yanlışlık içerdiği hâlde denetçinin uygun olmayan bir görüş verme
        riskidir (BDS 200); hile yapmayı teşvik eden şartları ifade etmez.
      C: Hile, hile riski faktörü değil, bir veya birden fazla kişinin haksız veya yasalara aykırı bir menfaat elde
        etmek amacıyla yaptığı aldatma içeren kasıtlı eylemdir (BDS 240 par. 12).
      D: Kontrol riski, bir yönetim beyanındaki önemli yanlışlığın işletmenin kontrolleri tarafından zamanında önlenememesi
        veya tespit edilerek düzeltilememesi riskidir (BDS 200); hile yapmaya yönelik şartlar değildir.
      E: Önemli yanlışlık riski, finansal tabloların denetimden önce önemli yanlışlık içermesi riskidir; hile riski
        faktörleri bu riski artırabilecek olay veya şartlardır, riskin kendisi değildir.
  kaynaklar:
  - mevzuat: TDS BDS 240 Hileye İlişkin Sorumluluklar
    madde: par. 12 (hile riski faktörleri)
    alinti: 'Hile riski faktörleri: Hile yapmaya teşvik eden, hile için baskı oluşturan veya hile yapma fırsatı
      sağlayan olay veya şartlardır.'
  - mevzuat: TDS BDS 240 Hileye İlişkin Sorumluluklar
    madde: par. 12 (hile)
    alinti: 'Hile: Yönetimden, üst yönetimden sorumlu olanlardan, çalışanlardan veya üçüncü taraflardan bir veya
      birden fazla kişinin, haksız veya yasalara aykırı bir menfaat elde etmek amacıyla yaptığı aldatma içeren kasıtlı
      eylemlerdir.'
  - mevzuat: TDS BDS 200
    madde: par. 13 (denetim riski)
    alinti: 'Denetim riski: Finansal tabloların önemli bir yanlışlık içermesine rağmen, denetçinin duruma uygun
      olmayan bir denetim görüşü vermesi riskidir.'
  - mevzuat: TDS BDS 200
    madde: par. 13 (kontrol riski)
    alinti: 'Kontrol riski: Bir işlem sınıfı, hesap bakiyesi veya açıklamalara ilişkin bir yönetim beyanında ortaya
      çıkabilecek ve tek başına veya diğer yanlışlıklarla birlikte önemli olabilecek bir yanlışlığın, işletmenin
      kontrolleri tarafından zamanında önlenememesi veya tespit edilerek düzeltilememesi riskidir.'
  - mevzuat: TDS BDS 200
    madde: par. 13 (önemli yanlışlık riski)
    alinti: '“Önemli yanlışlık” riski: Finansal tabloların denetim öncesinde önemli bir yanlışlık içermesi riskidir.'
  gecerlilik:
    baslangic: '2020-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden''deki A24 örneği kaynağa uyduruldu (teşviki yaratan ''kâr hedefleri'' değil,
      hedef tutturulursa prim taahhüdü; baskı örneği eklendi); A çeldiricisinde hile tanımına ''veya yasalara aykırı''
      eklendi. Kök/şık değişmedi.'
    neden: 'G6: A24 örneğinin ve par. 12 hile tanımının özeti kaynakla birebir değildi.'
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'şık dengeleme: doğru şık C → A (metinler yer değiştirdi).'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: C (güven 5) BDS 240 tanım: Hile riski faktörleri = hile yapmaya teşvik eden, baskı oluşturan
          veya fırsat sağlayan olay/şartlar.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok (anahtar C): tanım BDS 240 par. 12''deki ''hile riski faktörleri'' tanımıyla birebir; A (hile),
          B (denetim riski), D (kontrol riski), E (önemli yanlışlık riski) BDS 240/200 tanımlarına göre kesin yanlış.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: alıntılar BDS 240 par. 12 ve BDS 200 par. 13 ile birebir; A24 örneği ve
          hile tanımı özeti kaynağa uyduruldu.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (C, güven 5)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
