- id: SMMM-DEN-ICK-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 240 hile ve hile üçgeni
  tip: kavrama
  zorluk: 3
  kok: Hileye ilişkin denetim standardına göre hile risk faktörleri (hile üçgeni) aşağıdakilerden hangisini içerir?
  secenekler:
    A: Teşvik veya baskı ile fırsat unsurlarının ikisi birlikte
    B: Finansal performans baskısı oluşturan koşullar
    C: İç kontrol zayıflıkları ve yetki devri eksiklikleri
    D: Yönetimin iç kontrolleri devre dışı bırakma riski
    E: Teşvik veya baskı, fırsat ve tutum/rasyonalizasyon
  dogru: E
  aciklama:
    dogru_neden: 'BDS 240’ta hile risk faktörleri, hile üçgeni olarak bilinen teşvik veya baskı, fırsat ve tutum/rasyonalizasyon
      unsurlarından oluşur. Püf noktaları: Üç unsurun birlikte varlığı hile riskini artırır; tek başına biri yeterli
      olmayabilir.'
    celdiriciler:
      A: Tutum/rasyonalizasyon üçüncü unsurdur; iki unsurla sınırlı değildir.
      B: Performans baskısı teşvik/baskı unsurunun bir örneğidir, üçgenin tamamı değildir.
      C: İç kontrol zayıflığı fırsat unsuruna girer ama üçgenin tamamı değildir.
      D: Yönetimin kontrolleri devre dışı bırakması fırsat unsurunun bir örneğidir.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: A1
    alinti: İster hileli finansal raporlama isterse varlıkların kötüye kullanılması şeklinde olsun hile; - Hile
      yapmaya yönelik teşvik veya baskıyı, - Hile yapmak için algılanan bir fırsatı ve - Eylemin bir ölçüde rasyonelleştirilmesini,
      içerir.
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R7: kökten standart numarası kaldırıldı, kavram adıyla soruldu; R5 R6: şık uzunlukları
          dengelendi / çeldiriciler mutlak ifadesiz yeniden yazıldı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_DEN.yaml, satır Grok_DEN-2026-10-06-G09 #8'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'şık dengeleme: doğru şık B → E (metinler yer değiştirdi).'
  - tarih: '2026-10-18'
    kim: hakem
    ne: düzeltildi
    neden: 'R7: kökten standart numarası kaldırıldı, kavram adıyla soruldu; R5 R6: şık uzunlukları dengelendi /
      çeldiriciler mutlak ifadesiz yeniden yazıldı'
- id: SMMM-DEN-ICK-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 230 belgelendirme
  tip: bilgi
  zorluk: 1
  kok: Denetimin belgelendirilmesine ilişkin denetim standardına göre denetçi, belirli kalemleri test ederken aşağıdakilerden
    hangisini kayıt altına almak zorundadır?
  secenekler:
    A: Prosedür sonuçlarını; çalışmayı kimin yaptığını yalnız önemli bulgularda
    B: İşletme çalışanlarının listesini ve görev tanımlarını
    C: Yönetimle yapılan görüşmelerin özetini ve yönetimin onayını
    D: Kalemlerin belirleyici özelliklerini, yapan ve gözden geçireni ile tarihleri
    E: Denetim ücretinin hesaplanma yöntemini ve ödeme planını
  dogru: D
  aciklama:
    dogru_neden: Denetçi, test edilen kalemlerin belirleyici özelliklerini, çalışmayı kimin yürüttüğünü ve tamamlandığı
      tarihi, kimin gözden geçirdiğini, gözden geçirme tarihini ve kapsamını belgelendirir. Bu nedenle D doğrudur.
    celdiriciler:
      A: Çalışmayı yapan ve gözden geçiren kişi her test için belgelendirilir; önemli bulgularla sınırlı değildir.
      B: Çalışan listesi belgelendirme standardının zorunlu unsuru değildir.
      C: Görüşmeler belgelenebilir, ancak yönetim onayı belgelendirme şartı değildir.
      E: Denetim ücreti çalışma kâğıtlarında kayda alınması zorunlu bir unsur değildir.
  kaynaklar:
  - mevzuat: BDS 230 Bağımsız Denetimin Belgelendirilmesi
    madde: par. 9
    alinti: 'Denetçi, uygulanan denetim prosedürlerinin niteliğini, zamanlamasını ve kapsamını belgelendirirken;
      (a) Test edilen kalemlerin ve hususların belirleyici özelliklerini (Bkz.: A12 paragrafı), (b) Denetim çalışmasını
      kimin yürüttüğünü ve ilgili çalışmanın tamamlandığı tarihi ve (c) Yürütülen denetim çalışmasını kimin gözden
      geçirdiğini, ilgili gözden geçirmenin tarihini ve kapsamını (Bkz.: A13 paragrafı), kayıt altına alır.'
