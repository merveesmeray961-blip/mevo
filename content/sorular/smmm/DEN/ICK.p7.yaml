- id: SMMM-DEN-ICK-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 240 hile ve hile üçgeni
  tip: kavrama
  zorluk: 3
  kok: BDS 240 “Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları”na göre
    hile risk faktörleri (hile üçgeni) aşağıdakilerden hangisini içerir?
  secenekler:
    A: Yalnızca teşvik/baskı ve fırsat
    B: Yalnızca finansal performans baskısı
    C: Yalnızca iç kontrol zayıflıkları
    D: Yalnızca yönetim override riski
    E: Teşvik veya baskı, fırsat ve tutum/rasyonalizasyon
  dogru: E
  aciklama:
    dogru_neden: 'BDS 240’ta hile risk faktörleri, hile üçgeni olarak bilinen teşvik veya baskı, fırsat ve tutum/rasyonalizasyon
      unsurlarından oluşur. Püf noktaları: Üç unsurun birlikte varlığı hile riskini artırır; tek başına biri yeterli
      olmayabilir.'
    celdiriciler:
      A: Tutum/rasyonalizasyon da üçüncü unsurdur.
      B: Performans baskısı teşvik/baskı unsuruna girer.
      C: İç kontrol zayıflığı fırsat unsuruna girer ama üçgenin tamamı değildir.
      D: Yönetim override fırsatın bir örneğidir.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: A1
    alinti: İster hileli finansal raporlama isterse varlıkların kötüye kullanılması şeklinde olsun hile; - Hile
      yapmaya yönelik teşvik veya baskıyı, - Hile yapmak için algılanan bir fırsatı ve - Eylemin bir ölçüde rasyonelleştirilmesini,
      içerir.
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_DEN.yaml, satır Grok_DEN-2026-10-06-G09 #8'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'şık dengeleme: doğru şık B → E (metinler yer değiştirdi).'
- id: SMMM-DEN-ICK-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 230 belgelendirme
  tip: bilgi
  zorluk: 1
  kok: BDS 230’a göre denetçi çalışma kâğıtlarını hazırlarken aşağıdakilerden hangisini kayıt altına almak zorundadır?
  secenekler:
    A: Yalnızca uygulanan prosedürlerin sonuçlarını.
    B: Denetlenen işletmenin tüm çalışanlarının listesini.
    C: Yalnızca yönetimle yapılan görüşmelerin özetini.
    D: Denetim ücretinin nasıl hesaplandığını.
    E: Test edilen kalemlerin belirleyici özelliklerini, çalışmayı kimin yürüttüğünü ve tamamlandığı tarihi ile
      kimin gözden geçirdiğini, tarihini ve kapsamını.
  dogru: E
  aciklama:
    dogru_neden: BDS 230 par. 9’a göre denetçi, uygulanan denetim prosedürlerinin niteliğini, zamanlamasını ve kapsamını
      belgelendirirken; (a) Test edilen kalemlerin ve hususların belirleyici özelliklerini, (b) Denetim çalışmasını
      kimin yürüttüğünü ve ilgili çalışmanın tamamlandığı tarihi ve (c) Yürütülen denetim çalışmasını kimin gözden
      geçirdiğini, ilgili gözden geçirmenin tarihini ve kapsamını kayıt altına alır.
    celdiriciler:
      A: Sonuçlar önemlidir ancak belirleyici özellikler, kimlerin yürüttüğü ve gözden geçirdiği de zorunludur.
      B: Çalışan listesi genel olarak gerekli değildir.
      C: Yönetimle müzakereler ayrıca belgelendirilir (par. 10) ancak soru prosedürlerin belgelendirilmesine ilişkindir.
      D: Ücret hesaplaması çalışma kâğıtlarının zorunlu unsuru değildir.
  kaynaklar:
  - mevzuat: BDS 230 Bağımsız Denetimin Belgelendirilmesi
    madde: par. 9
    alinti: 'Denetçi, uygulanan denetim prosedürlerinin niteliğini, zamanlamasını ve kapsamını belgelendirirken;
      (a) Test edilen kalemlerin ve hususların belirleyici özelliklerini (Bkz.: A12 paragrafı), (b) Denetim çalışmasını
      kimin yürüttüğünü ve ilgili çalışmanın tamamlandığı tarihi ve (c) Yürütülen denetim çalışmasını kimin gözden
      geçirdiğini, ilgili gözden geçirmenin tarihini ve kapsamını (Bkz.: A13 paragrafı), kayıt altına alır.'
