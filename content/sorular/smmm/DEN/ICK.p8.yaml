      A: Kontrol riski bir risk düzeyidir; tespit edilen tasarım hatasının adı iç kontrol eksikliğidir.
      B: Tespit riski denetçinin prosedürlerinin yanlışlığı bulamama riskidir.
      C: Önemli yanlışlık riski doğal risk ile kontrol riskinin birleşimidir; somut bir kontrol kusurunun adı değildir.
