- id: SMMM-DEN-ICK-0006
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 iç kontrol eksikliği
  tip: uygulama
  zorluk: 2
  kok: Denetçi bir iç kontrol eksikliği tespit etmiş, ancak denetim sırasında henüz bir finansal tablo yanlışlığı gerçekleşmemiştir.
    Eksikliğin gelecekte önemli yanlışlıklara yol açma ihtimali ve etkilenebilecek tutarların büyüklüğü yüksektir. BDS 265'e
    göre aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: Yanlışlık fiilen gerçekleşmediği için hiçbir durumda önemli iç kontrol eksikliği söz konusu olamaz.
    B: Eksiklik yalnız yönetimin kabul ettiği takdirde önemli sayılır.
    C: Önem yalnız geçmiş dönemde gerçekleşmiş yanlışlığın tutarına göre belirlenir.
    D: İç kontrol eksikliği yalnız denetçi görüşünü değiştirdiğinde önemli kabul edilir.
    E: Eksikliğin önemi, yalnız gerçekleşmiş yanlışlığa değil yanlışlığın meydana gelme ihtimaline ve muhtemel büyüklüğüne
      de bağlıdır; bu nedenle fiilî yanlışlık bulunmasa da önemli eksiklik mevcut olabilir.
  dogru: E
  aciklama:
    dogru_neden: BDS 265 A5, bir iç kontrol eksikliğinin öneminin yalnızca yanlışlığın gerçekten meydana gelip gelmediğine
      değil, yanlışlığın meydana gelebilme ihtimaline ve muhtemel büyüklüğüne de bağlı olduğunu açıklar. Bu nedenle denetim
      sırasında yanlışlık tespit edilmemiş olsa dahi önemli eksiklik mevcut olabilir.
    celdiriciler:
      A: BDS 265 A5, fiilî yanlışlık bulunmasa da önemli eksiklik olabileceğini açıkça belirtir.
      B: BDS 265 A5 önemi yönetimin kabulüne değil, yanlışlık ihtimali ve muhtemel büyüklük gibi unsurlara bağlar.
      C: BDS 265 A5 yalnız gerçekleşmiş yanlışlık tutarını değil, gelecekteki yanlışlık ihtimalini de dikkate alır.
      D: BDS 265 A5'in değerlendirmesi denetçi görüşünün değiştirilmesine değil iç kontrol eksikliğinin önemine ilişkindir.
  kaynaklar:
  - mevzuat: BDS 265
    madde: A5
    alinti: "Bir iç kontrol eksikliğinin veya eksikliklerinin bileşiminin önemi, sadece bir yanlışlığın\n    gerçekten meydana\
      \ gelip gelmediğine değil, aynı zamanda bir yanlışlığın meydana gelebilme\n    ihtimaline ve yanlışlığın muhtemel büyüklüğüne\
      \ bağlıdır. Bu nedenle denetçi denetim\n    sırasında yanlışlık tespit etmemiş olsa dahi, önemli eksiklikler mevcut\
