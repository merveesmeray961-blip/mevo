- id: SMMM-DEN-ICK-0005
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: kontrol çevresi
  tip: uygulama
  zorluk: 3
  kok: Bir işletmede yönetim dürüstlük ve etik değerlere bağlı olduğunu belirtmekte, ancak üst yönetimden sorumlu olanların
    gözetimi zayıf kalmakta ve yetki-sorumluluklar açık biçimde belirlenmemektedir. Denetçi kontrol çevresi hakkında kanaat
    edinmektedir. BDS 315'e göre aşağıdakilerden hangisi en doğru değerlendirmedir?
  secenekler:
    A: Kontrol çevresi yalnız etik değerlerden oluşur; gözetim ve yetki-sorumluluk düzeni dikkate alınmaz.
    B: Kontrol çevresi hakkında kanaat edinmek için yalnız iç denetim fonksiyonunun etkinliği test edilir.
    C: Denetçi, kontrol çevresini yalnız finansal tablo sonuçlarından hareketle değerlendirir; yönetimin davranışları risk
      değerlendirmesine konu edilmez.
    D: Denetçi; yönetimin gözetim sorumluluklarının nasıl yerine getirildiği, üst yönetimden sorumlu olanların gözetimi, yetki
      ve sorumlulukların belirlenmesi gibi unsurları ele almalı ve kontrol çevresinin iç kontrolün diğer bileşenleri için
      uygun zemin oluşturup oluşturmadığını değerlendirmelidir.
    E: Kontrol çevresindeki eksiklikler diğer iç kontrol bileşenlerini etkileyemeyeceğinden yalnız ilgili kontrol noktasında
      incelenir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 315 md. 21, kontrol çevresi hakkında kanaat edinirken yönetimin gözetim sorumluluklarının nasıl yerine
      getirildiğini, yönetimden sorumlu olanların gözetimini ve yetki-sorumlulukların belirlenmesini ele almayı; ayrıca kontrol
      çevresinin iç kontrolün diğer bileşenleri için uygun zemin oluşturup oluşturmadığını ve eksikliklerin diğer bileşenleri
      zayıflatıp zayıflatmadığını değerlendirmeyi öngörür. Püf noktaları: Kontrol çevresi yalnız etik beyanı değildir; gözetim,
      yetki-sorumluluk ve diğer bileşenler üzerindeki etkisi birlikte değerlendirilir.'
    celdiriciler:
      A: BDS 315 md. 21 kontrol çevresini yalnız etik değerlerle sınırlandırmaz; gözetim ve yetki-sorumluluklar da değerlendirilir.
      B: BDS 315 md. 21 risk değerlendirme prosedürleriyle kontrol çevresi hakkında kanaat edinilmesini öngörür; yalnız iç
        denetim fonksiyonuna indirgeme yapılamaz.
      C: BDS 315 md. 21 yönetim ve üst yönetimden sorumlu olanların gözetim davranışlarını kontrol çevresinin değerlendirilmesine
        dahil eder.
      E: BDS 315 md. 21, kontrol çevresindeki eksikliklerin iç kontrol sisteminin diğer bileşenlerini zayıflatıp zayıflatmadığının
        değerlendirilmesini açıkça ister.
  kaynaklar:
  - mevzuat: BDS 315
    madde: md. 21
    alinti: "Denetçi, aşağıdakileri yapmak suretiyle, risk değerlendirme prosedürleri uygulayarak\n        finansal tabloların\
      \ hazırlanmasıyla ilgili kontrol çevresi hakkında kanaat edinir (Bkz.: A99-\n        A100 paragrafları):"
