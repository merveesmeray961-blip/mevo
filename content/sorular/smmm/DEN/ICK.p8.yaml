  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: kontrol çevresi
  tip: uygulama
  zorluk: 3
  kok: Bir işletmede yönetim dürüstlük ve etik değerlere bağlı olduğunu belirtmekte, ancak üst yönetimden sorumlu
    olanların gözetimi zayıf kalmakta ve yetki-sorumluluklar açık biçimde belirlenmemektedir. Denetim standartlarına
    göre denetçinin kontrol çevresine ilişkin değerlendirmesi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Etik değerlere ilişkin beyan esas alınır; gözetim ve yetki düzeni risk değerlendirmesinin konusudur.
    B: Kanaat, iç denetim fonksiyonunun etkinliği test edilerek oluşturulur.
    C: Kontrol çevresi finansal tablo sonuçlarından hareketle değerlendirilir.
    D: Gözetim ile yetki ve sorumluluk düzeni ele alınarak diğer bileşenlere uygun zemin oluşup oluşmadığı değerlendirilir.
    E: Eksiklikler ilgili kontrol noktasında incelenir; diğer bileşenlere etkisi değerlendirilmez.
  dogru: D
  aciklama:
    dogru_neden: Denetçi kontrol çevresini değerlendirirken üst yönetimden sorumlu olanların gözetimini, yetki ve
      sorumlulukların belirlenmesini ele alır ve kontrol çevresinin iç kontrolün diğer bileşenleri için uygun bir
      zemin oluşturup oluşturmadığını değerlendirir. Bu nedenle D doğrudur.
    celdiriciler:
      A: Yönetimin beyanı yeterli değildir; gözetim ve yetki düzeni kontrol çevresinin unsurlarıdır.
      B: İç denetim tek başına kontrol çevresinin değerlendirilmesine yetmez.
      C: Kontrol çevresi yönetimin tutum ve davranışlarıyla ilgilidir; finansal tablo sonuçlarından çıkarılamaz.
      E: Kontrol çevresindeki eksiklikler diğer iç kontrol bileşenlerini etkileyebilir.
  kaynaklar:
  - mevzuat: BDS 315
    madde: md. 21
    alinti: "Denetçi, aşağıdakileri yapmak suretiyle, risk değerlendirme prosedürleri uygulayarak\n        finansal\
      \ tabloların hazırlanmasıyla ilgili kontrol çevresi hakkında kanaat edinir (Bkz.: A99-\n        A100 paragrafları):"
