  kok: Denetçi bir iç kontrol eksikliği tespit etmiş, ancak denetim sırasında henüz bir finansal tablo yanlışlığı
    gerçekleşmemiştir. Eksikliğin gelecekte önemli yanlışlıklara yol açma ihtimali ve etkilenebilecek tutarların
    büyüklüğü yüksektir. İç kontrol eksikliklerinin bildirilmesine ilişkin denetim standardına göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Fiilî yanlışlık gerçekleşmediğinden eksiklik önemli sayılamaz.
    B: Eksikliğin önemli sayılması, yönetimin eksikliği kabul etmesine bağlıdır.
    C: Önem, geçmiş dönemde gerçekleşen yanlışlıkların tutarına göre belirlenir.
    D: Eksiklik ancak denetçi görüşünü değiştirirse önemli kabul edilir.
    E: Önem, yanlışlığın ortaya çıkma ihtimaline ve muhtemel büyüklüğüne de bağlıdır.
  dogru: E
  aciklama:
    dogru_neden: Bir iç kontrol eksikliğinin önemi, yalnız gerçekleşmiş yanlışlığa değil, yanlışlığın ortaya çıkma
      ihtimaline ve muhtemel büyüklüğüne de bağlıdır. Fiilî yanlışlık olmasa da önemli eksiklik bulunabilir. Bu
      nedenle E doğrudur.
    celdiriciler:
      A: Fiilî yanlışlık bulunmaması eksikliğin önemli olmasını engellemez.
      B: Önem denetçinin muhakemesiyle belirlenir; yönetimin kabulüne bağlı değildir.
      C: Önem değerlendirmesi ileriye dönük ihtimali de kapsar.
      D: Denetçi görüşünün değişmesi önemli eksiklik ölçütü değildir.
  kaynaklar:
  - mevzuat: BDS 265
    madde: A5
    alinti: "Bir iç kontrol eksikliğinin veya eksikliklerinin bileşiminin önemi, sadece bir yanlışlığın\n    gerçekten\
      \ meydana gelip gelmediğine değil, aynı zamanda bir yanlışlığın meydana gelebilme\n    ihtimaline ve yanlışlığın\
      \ muhtemel büyüklüğüne bağlıdır. Bu nedenle denetçi denetim\n    sırasında yanlışlık tespit etmemiş olsa dahi,\
      \ önemli eksiklikler mevcut olabilir."
