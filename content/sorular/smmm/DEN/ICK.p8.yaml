    gerçekleşenden yüksek göstermesi yönünde baskı yapmakta; satış kayıtlarının ikinci bir kişi tarafından incelenmesine ilişkin
    kontrol de yönetici tarafından devre dışı bırakılmaktadır. Bu durum BDS 240 kapsamında değerlendirildiğinde aşağıdakilerden
    hangisi doğrudur?
