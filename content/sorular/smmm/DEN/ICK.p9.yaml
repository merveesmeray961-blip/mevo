- id: SMMM-DEN-ICK-0025
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 iç kontrol eksikliği
  tip: kavrama
  zorluk: 2
  kok: Denetçi, denetim sırasında önemli bir iç kontrol eksikliği tespit etmiştir. BDS 265’e göre aşağıdaki ifadelerden hangisi
    **yanlıştır**?
  secenekler:
    A: Önemli iç kontrol eksikliği üst yönetimden sorumlu olanlara zamanında ve yazılı olarak bildirilir.
    B: Denetçi, önemli iç kontrol eksikliğini uygun sorumluluğa sahip yönetim kademesine de zamanında ve yazılı olarak bildirir.
    C: Yönetim kademesine yapılacak bildirim, doğrudan bildirilmesinin uygun olmayacağı iç kontrol eksiklikleri bakımından
      istisnaya tabidir.
    D: Önemli iç kontrol eksikliklerinin bildirimi sözlü yapılabilir; yazılı bildirim şartı yoktur.
    E: Denetçi, önemli iç kontrol eksikliklerinin yanı sıra, mesleki muhakemesine göre yönetimin dikkatini gerektiren diğer
      iç kontrol eksikliklerini de zamanında bildirebilir.
  dogru: D
  aciklama:
    dogru_neden: BDS 265 md. 9 önemli iç kontrol eksikliklerinin üst yönetimden sorumlu olanlara zamanında ve yazılı bildirilmesini,
      md. 10 ise uygun sorumluluğa sahip yönetim kademesine de belirli istisnalar saklı kalmak üzere zamanında ve yazılı bildirim
      yapılmasını düzenler. Bildirimin rapor sonrasına bırakılması şeklinde bir kural yoktur.
    celdiriciler:
      A: Md. 9’da üst yönetimden sorumlu olanlara zamanında ve yazılı bildirim öngörülür.
      B: Md. 10’da uygun sorumluluğa sahip yönetim kademesine zamanında ve yazılı bildirim düzenlenir.
      C: Md. 10’da doğrudan bildirimin uygun olmayacağı eksiklikler için istisna yer alır.
      E: Md. 10, yönetimin dikkatini çekmeyi gerektirecek kadar önemli olan ve diğer taraflarca yönetime bildirilmemiş diğer
        iç kontrol eksikliklerinin de zamanında bildirilmesini düzenler.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: md. 9
    alinti: '9.    Denetçi denetim sırasında tespit edilen önemli iç kontrol eksikliklerini üst yönetimden sorumlu olanlara
      zamanında ve yazılı olarak bildirir (Bakınız: A12–A18, A27 paragrafları).'
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: md. 10
    alinti: '10.   Denetçi, ayrıca uygun sorumluluğa sahip yönetim kademesine (Bakınız: A19, A27 paragrafları): İçinde bulunan
      şartlar altında bu yönetim kademesine doğrudan bildirilmesi uygun olmayacak iç kontrol eksiklikleri dışında, üst yönetimden
      sorumlu olanlara bildirdiği veya bildirmeyi düşündüğü önemli iç kontrol eksikliklerini zamanında ve yazılı olarak bildirir
      (Bakınız: A14, A20–A21 paragrafları),'
