  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 230 belgelendirme
  tip: uygulama
  zorluk: 3
  kok: Denetçi, nihai denetim dosyasını oluşturduktan sonra bir çalışma kâğıdına yeni bilgi eklemenin gerekli olduğunu fark
    etmiştir. Ekleme denetim raporu tarihinden sonra yapılacaktır. BDS 230'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Çalışma kâğıdı dosyaya eklendiği anda eklemenin nedeni ve tarihi kayda alınmadan kullanılabilir.
    B: Nihai dosya oluşturulduktan sonra hiçbir koşulda yeni çalışma kâğıdı eklenemez.
    C: Eklemenin özel sebepleri ile ne zaman, kim tarafından yapıldığı ve gözden geçirildiği belgelendirilmelidir.
    D: Yalnızca değişikliği yapan kişinin adı kaydedilir; sebep ve gözden geçirme bilgisi gerekmez.
    E: Nihai dosya oluşturulduktan sonra çalışma kâğıtları silinebilir; yeter ki denetim raporu verilmiş olsun.
  dogru: C
  aciklama:
    dogru_neden: BDS 230 paragraf 16, nihai dosyanın birleştirilmesi tamamlandıktan sonra yeni çalışma kâğıdı eklenmesi veya
      mevcut çalışma kâğıdının değiştirilmesi gerekli görülürse, özel sebepler ile değişiklik/eklemenin zamanı, yapanı ve
      gözden geçireni belgelendirmeyi zorunlu kılar.
    celdiriciler:
      A: Özel sebep ve değişikliğin kim, ne zaman yaptığı/gözden geçirdiği kaydedilmelidir.
      B: Paragraf 16 mutlak bir yasak koymaz; gerekli görülen ekleme belgelendirilerek yapılabilir.
      D: Paragraf, sebep ve zaman/kişi/gözden geçirme bilgilerinin tamamını ister.
      E: Paragraf 15'e göre saklama süresi sona ermeden çalışma kâğıtları silinemez; rapor tarihinin geçmesi bu sonucu değiştirmez.
  kaynaklar:
  - mevzuat: BDS 230
    madde: par. 16
    alinti: denetçi, çalışma kâğıtlarının nihai denetim dosyasında birleştirilmesi işlemi tamamlandıktan sonra mevcut çalışma
      kâğıtlarında değişiklik yapmayı veya yeni çalışma kâğıtları eklemeyi gerekli görürse, yapılan değişikliklerin veya eklemelerin
      niteliğine bakılmaksızın aşağıdaki hususları belgelendirir
  - mevzuat: BDS 230
    madde: par. 16(a)-(b)
    alinti: Değişiklik veya ekleme yapmasının özel sebepleri ve
  - mevzuat: BDS 230
    madde: par. 16(b)
    alinti: Değişiklik veya eklemelerin ne zaman ve kim tarafından yapıldığı ve gözden geçirildiği.
  gecerlilik:
    baslangic: '2023-12-31'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
