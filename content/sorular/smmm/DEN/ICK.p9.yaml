    celdiriciler:
      A: Roller tersine çevrilmiştir.
      C: BDS 315 bunları ayrı bileşenler olarak sayar.
      D: BDS 315 bu kadar kesin bir düzey ayrımı yapmaz.
      E: Denetçi kontrol çevresi hakkında kanaat edinir.
