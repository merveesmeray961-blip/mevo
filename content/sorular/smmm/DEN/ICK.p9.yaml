  secenekler:
    A: Kontrol çevresi doğrudan belirli bir yanlışlığı düzeltmeye odaklanırken kontrol faaliyetleri yalnızca işletme kültürünü
      belirler.
    B: Kontrol çevresi diğer iç kontrol bileşenlerinin işlemesi için genel zemin oluşturabilir; kontrol faaliyetleri ise yönetim
      beyanı düzeyindeki risklere doğrudan karşılık veren kontrolleri içerebilir.
