  konu: ICK
  kazanim: COSO
  tip: kavrama
  zorluk: 3
  kok: Risk değerlendirmesine ilişkin denetim standardındaki iç kontrol sistemi bileşenlerinden kontrol çevresi
    ile kontrol faaliyetlerini karşılaştıran aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kontrol çevresi doğrudan belirli bir yanlışlığı düzeltmeye odaklanırken kontrol faaliyetleri işletme kültürünü
      ve yönetim anlayışını belirler.
    B: Kontrol çevresi denetçi tarafından ayrıca incelenmez; değerlendirme yönetimin öz değerlendirmesine bırakılır
      ve bu bilgi denetim kanıtı olarak kullanılır.
    C: Kontrol çevresi ile kontrol faaliyetleri aynı bileşenin farklı adlarıdır; bu nedenle ikisi için ayrı risk
      değerlendirmesi yapılmaz.
    D: Kontrol faaliyetleri finansal tablo düzeyindeki riskleri, kontrol çevresi ise yönetim beyanı düzeyindeki
      riskleri etkiler; bu ayrım standartta açıkça yapılmıştır.
    E: Kontrol çevresi diğer bileşenler için genel zemin oluşturabilir; kontrol faaliyetleri beyan düzeyindeki risklere
      doğrudan karşılık veren kontrolleri içerebilir.
  dogru: E
  aciklama:
    dogru_neden: BDS 315 A96-A97 kontrol çevresinin esasen dolaylı bir zemin oluşturduğunu; bilgi sistemi ve kontrol
      faaliyetlerinin ise yönetim beyanı düzeyindeki risk değerlendirmesinde daha doğrudan etkili olabileceğini
      açıklar.
    celdiriciler:
      A: Roller tersine çevrilmiştir.
      B: Denetçi kontrol çevresi hakkında kanaat edinir.
      C: BDS 315 bunları ayrı bileşenler olarak sayar.
      D: Standart bileşenler arasında bu kadar kesin bir düzey ayrımı yapmaz.
