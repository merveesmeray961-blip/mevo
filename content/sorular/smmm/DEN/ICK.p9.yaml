- id: SMMM-DEN-ICK-0011
  sinav: smmm
  bolum: &id001
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: COSO
  tip: uygulama
  zorluk: 2
  kok: Bir işletmede yönetim, finansal raporlama amaçlarıyla ilgili riskleri belirlemek için yılda bir kez toplantı yapmaktadır.
    Ancak yeni bir bilgi sistemi devreye alındığında risk değerlendirmesini güncellememekte ve denetçi yeni bilgi elde ettiğinde
    kendi risk değerlendirmesini de değiştirmemektedir. BDS 315'e göre bu durumla ilgili aşağıdaki değerlendirmelerden hangisi
    doğrudur?
  secenekler:
    A: Risk değerlendirme süreci yinelenen ve dinamik olduğundan, yeni bilgi ortaya çıktığında risk değerlendirmesinin gözden
      geçirilmesi gerekir.
    B: Risk değerlendirmesi yalnızca hesap dönemi başında yapılır; yeni bilgi elde edilmesi değerlendirmeyi değiştirmez.
    C: Risk değerlendirmesi yalnızca hile kaynaklı riskler için yinelenir; bilgi sistemi değişiklikleri dikkate alınmaz.
    D: İşletmenin risk değerlendirmesi ile denetçinin risk değerlendirmesi birbirinden tamamen bağımsızdır.
    E: Risk değerlendirmesinin güncellenmesi yalnızca finansal tablo görüşü açıklandıktan sonra yapılabilir.
  dogru: A
  aciklama:
    dogru_neden: BDS 315, risk belirleme ve değerlendirme sürecini yinelenen ve dinamik bir süreç olarak düzenler; denetçi
      yeni bilgi edindiğinde risk değerlendirmelerini revize eder.
    celdiriciler:
      B: BDS 315 süreci yalnızca dönem başına bağlamaz; süreç dinamiktir.
      C: Risk değerlendirmesi hata ve hile kaynaklı önemli yanlışlık risklerini kapsar.
      D: Denetçinin işletme ve iç kontrol hakkındaki kanaati risk değerlendirmesiyle bağlantılıdır.
      E: Revizyon, görüş sonrasına ertelenen bir işlem değildir.
  kaynaklar:
  - mevzuat: BDS 315
    madde: md. 7
    alinti: Denetçinin risk belirleme ve değerlendirme süreci, yinelenen ve dinamik bir süreçtir.
  - mevzuat: BDS 315
    madde: md. 7
    alinti: Ayrıca, bu BDS ve BDS 330 uyarınca denetçi; BDS 330’a göre müteakip denetim prosedürlerinin uygulanması sonucu
      elde edilen denetim kanıtlarına dayanarak ya da yeni bir bilgi edindiğinde, risk değerlendirmelerini revize eder ve
      yapacağı ilave genel işleri ve müteakip denetim prosedürlerini buna göre uyarlar.
