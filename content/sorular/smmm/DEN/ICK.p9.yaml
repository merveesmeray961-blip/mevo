    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: BDS 315 iç kontrol sistemini beş bileşenli olarak tanımlar; önemli yanlışlık riskleri hata ve hile
      kaynaklıdır ve kontrol çevresi finansal tablo düzeyindeki risk değerlendirmesini etkileyebilir.
    celdiriciler:
      A: III de doğrudur.
      B: II yanlıştır; riskler hata ve hile kaynaklı olabilir.
      D: II yanlış olduğu için bu seçenek elenir.
      E: II yanlış olduğundan üçü birlikte doğru değildir.
  kaynaklar:
  - mevzuat: BDS 315
    madde: Tanımlar
    alinti: 'BDS’lerin amaçları bakımından iç kontrol sistemi, birbiriyle ilişkili beş bileşenden oluşur:'
  - mevzuat: BDS 315
    madde: md. 6
    alinti: Denetçi tarafından belirlenen ve değerlendirilen “önemli yanlışlık” riskleri hata kaynaklı ve hile kaynaklı
      riskleri içerir.
  - mevzuat: BDS 315
    madde: md. 8
    alinti: "8.       BDS 330 uyarınca denetçi, finansal tablo düzeyinde “önemli yanlışlık” riski olarak\n     \
      \    değerlendirdiği risklere karşı yapacağı genel işleri tasarlar ve uygular.8 Ayrıca BDS 330’da,\n     \
      \    denetçinin finansal tablo düzeyindeki “önemli yanlışlık” risklerine ilişkin değerlendirmesinin\n    \
      \     ve denetçinin risklere karşı yapacağı genel işlerin, denetçinin kontrol çevresi hakkındaki\n       \
