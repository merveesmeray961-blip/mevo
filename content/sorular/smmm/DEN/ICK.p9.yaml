    madde: A97
    alinti: Kontrol çevresi, diğer iç kontrol sistemi bileşenlerinin işlemesi için genel bir zemin oluşturur. Kontrol
      çevresi, yanlışlıkları doğrudan önlemez, tespit etmez ve düzeltmez ancak iç kontrol sisteminin diğer bileşenlerindeki
      kontrollerin etkinliğini etkileyebilir.
