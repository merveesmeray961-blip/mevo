    değerlendirmesine ilişkin aşağıdaki öncüllerden hangileri doğrudur?

    I. İç kontrol sistemi birbiriyle ilişkili beş bileşenden oluşur.

    II. Denetçinin risk değerlendirme süreci yalnızca hile kaynaklı önemli yanlışlık risklerini kapsar.

    III. Denetçi, finansal tablo düzeyindeki önemli yanlışlık risklerine karşı genel işlerini tasarlarken kontrol
    çevresi hakkındaki kanaatinden etkilenebilir.'
