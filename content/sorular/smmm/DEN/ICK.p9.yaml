  zorluk: 2
  kok: Bir işletmede yönetim, finansal raporlamayla ilgili riskleri belirlemek için yılda bir kez toplantı yapmaktadır.
    Yeni bir bilgi sistemi devreye alındığında risk değerlendirmesi güncellenmemekte, denetçi de yeni bilgi elde
    ettiğinde kendi risk değerlendirmesini değiştirmemektedir. Denetim standartlarına göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Risk değerlendirmesi görüş açıklandıktan sonra sonraki dönem için güncellenir.
    B: Risk değerlendirmesi dönem başında yapılır; dönem içindeki yeni bilgiler planı etkilemez.
    C: Süreç yinelenen ve dinamik olduğundan yeni bilgi çıktığında değerlendirme gözden geçirilir.
    D: İşletmenin ve denetçinin risk değerlendirmeleri ayrı yürütüldüğünden birbirini etkilemez.
    E: Risk değerlendirmesi hile riskleri için güncellenir; sistem değişiklikleri izlemenin konusudur.
  dogru: C
  aciklama:
    dogru_neden: BDS 315, risk belirleme ve değerlendirme sürecini yinelenen ve dinamik bir süreç olarak düzenler;
      denetçi yeni bilgi edindiğinde risk değerlendirmelerini revize eder.
    celdiriciler:
      A: Güncelleme denetim sırasında, yeni bilgi elde edildikçe yapılır.
      B: Dönem içinde elde edilen yeni bilgi risk değerlendirmesini ve planı değiştirebilir.
      D: Denetçi işletmenin risk değerlendirme sürecini anlamak ve dikkate almak zorundadır.
      E: Bilgi sistemi değişiklikleri de risk değerlendirmesinin güncellenmesini gerektirebilir.
