- id: SMMM-DEN-ICK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: İç kontrol ve hile
  konu: ICK
  kazanim: BDS 265 önemli iç kontrol eksikliklerinin bildirilmesi
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: >-
    (M) AŞ'nin denetiminde denetçi, satın alma sürecinde önemli bir iç kontrol eksikliği olduğu
    kanaatine varmış; ancak denetim sırasında bu eksiklikten kaynaklanan herhangi bir yanlışlık
    tespit etmemiştir. BDS 265 "İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve
    Yönetime Bildirilmesi" standardına göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetim sırasında yanlışlık tespit edilmediğinden söz konusu eksiklik önemli iç kontrol
      eksikliği sayılamaz ve bildirilmesi gerekmez.
    B: Eksiklik üst yönetimden sorumlu olanlara zamanında ve yazılı olarak bildirilir; bildirimde iç
      kontrolün, etkinliği hakkında görüş vermek amacıyla dikkate alınmadığı açıklanır.
    C: Eksiklik üst yönetimden sorumlu olanlara sözlü olarak bildirilebilir; yazılı bildirim yalnızca
      yanlışlığa yol açmış eksiklikler için zorunludur.
    D: Denetçi, yazılı bildirimde işletmenin iç kontrol sisteminin etkinliğine ilişkin ayrı bir görüş
      verir.
    E: Eksiklik yalnızca uygun yönetim kademesine bildirilir; üst yönetimden sorumlu olanlar ise
      denetçi raporunun Kilit Denetim Konuları bölümü aracılığıyla bilgilendirilir.
  dogru: B
  aciklama:
    dogru_neden: >-
      BDS 265 parag. 9'a göre denetçi, denetim sırasında tespit edilen önemli iç kontrol eksikliklerini
      üst yönetimden sorumlu olanlara zamanında ve yazılı olarak bildirir. Parag. 11(b)(ii)'ye göre
      yazılı bildirimde, iç kontrolün iç kontrolün etkinliğine ilişkin bir görüş vermek amacıyla değil,
      içinde bulunulan şartlara uygun denetim prosedürleri tasarlamak amacıyla dikkate alındığı
      açıklanır. Tuzak, önemli eksikliğin ancak yanlışlık doğurduğunda var olacağının sanılmasıdır
      (parag. A5).
    celdiriciler:
      A: Parag. A5'e göre eksikliğin önemi yalnızca yanlışlığın gerçekten meydana gelip gelmediğine
        bağlı değildir; denetçi yanlışlık tespit etmemiş olsa dahi önemli eksiklikler mevcut olabilir.
      C: Parag. 9 önemli iç kontrol eksikliklerinin yazılı bildirilmesini, yanlışlık doğurup
        doğurmadığına bakmaksızın zorunlu kılar.
      D: Parag. 11(b)(i)-(ii)'ye göre denetimin amacı finansal tablolar hakkında görüş vermektir; iç
        kontrol, etkinliği hakkında görüş vermek amacıyla dikkate alınmaz.
      E: Parag. 9 bildirimi doğrudan üst yönetimden sorumlu olanlara yapılmasını öngörür; parag.
        10(a)'daki yönetim kademesine bildirim buna ek bir yükümlülüktür.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: parag. 9
    alinti: Denetçi denetim sırasında tespit edilen önemli iç kontrol eksikliklerini üst yönetimden
      sorumlu olanlara zamanında ve yazılı olarak bildirir
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: parag. 11(b)(i)-(ii)
    alinti: (i) Denetimin amacının finansal tablolar hakkında bir görüş vermek olduğunu, (ii) Denetim
      sırasında finansal tabloların hazırlanmasıyla ilgili olan iç kontrolün, iç kontrolün etkinliğine
      ilişkin bir görüş vermek amacıyla değil, içinde bulunulan şartlara uygun denetim prosedürleri
      tasarlamak amacıyla dikkate alındığını,
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: parag. A5
    alinti: Bir iç kontrol eksikliğinin veya eksikliklerinin bileşiminin önemi, sadece bir yanlışlığın
      gerçekten meydana gelip gelmediğine değil, aynı zamanda bir yanlışlığın meydana gelebilme
      ihtimaline ve yanlışlığın muhtemel büyüklüğüne bağlıdır. Bu nedenle denetçi denetim sırasında
      yanlışlık tespit etmemiş olsa dahi, önemli eksiklikler mevcut olabilir.
