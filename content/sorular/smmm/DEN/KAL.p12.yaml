        çelişir; süre tanımı da standartta yoktur.
      B: Gözden geçirme denetim boyunca uygun zamanlarda yürütülür; rapor tarihine kadar tamamlanması gerekir, rapor sonrasına
        bırakılamaz.
      D: Çalışma kâğıtlarının birleştirilmesi rapor tarihinden sonra yapılan KYS 1 md. 31(f) faaliyetidir; gözden geçirme
