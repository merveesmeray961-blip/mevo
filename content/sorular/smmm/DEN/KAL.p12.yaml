  kok: KYS 1'e göre kalite yönetim sistemi için nihai sorumluluk ve hesap verme yükümlülüğü verilen kişi veya kişilerin, denetim
    şirketi adına kalite yönetim sistemini değerlendirmesine ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Değerlendirme yalnızca eksiklik tespit edilen yıllarda yapılır.
    B: Değerlendirme belirli bir zamanda ve yılda en az bir kez yapılır.
    C: Değerlendirme her denetim raporu düzenlendikten sonra ayrı ayrı yapılır.
    D: Değerlendirme iki yılda bir yapılır ve sonucu yalnızca üst yönetimden sorumlu olanlara bildirilir.
    E: Değerlendirme, Kurumun dış teftiş yapacağı dönemlere denk getirilerek yapılır.
  dogru: B
  aciklama:
    dogru_neden: KYS 1 md. 53 uyarınca nihai sorumluluk verilen kişi veya kişiler denetim şirketi adına kalite yönetim sistemini
      belirli bir zamanda ve yılda en az bir kez değerlendirir.
    celdiriciler:
      A: Değerlendirme eksiklik tespit edilmesine bağlı değildir; eksiklik olsun veya olmasın her yıl yapılması gerekir.
      C: Değerlendirme şirket düzeyinde bir faaliyettir; her bir denetim raporunun ardından yapılması aranmaz, asgari sıklık
        yıllıktır.
      D: Asgari sıklık iki yıl değil bir yıldır; ayrıca sonuçlar md. 55 uyarınca denetim ekiplerine ve gerektiğinde şirket
        dışı taraflara da bildirilir.
      E: Değerlendirmenin zamanı dış teftişin takvimine bağlı değildir; standart belirli bir zaman ve yılda en az bir kez
        yapılmasını ister.
  kaynaklar:
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: md. 53
    alinti: Kalite yönetim sistemi için nihai sorumluluk ve hesap verme yükümlülüğü verilen kişi veya kişiler, denetim şirketi
      adına kalite yönetim sistemini değerlendirir. Değerlendirme, belirli bir zamanda ve yılda en az bir kez yapılır.
