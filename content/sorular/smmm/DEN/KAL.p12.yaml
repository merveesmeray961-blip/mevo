    E: Kalitenin gözden geçirilmesi, denetimin planlama aşamasında yalnızca bir kez yapılır ve sonraki aşamalarda tekrarlanmaz.
  dogru: C
  aciklama:
    dogru_neden: KYS 2 md. 13'teki tanıma göre kalitenin gözden geçirilmesi, kaliteyi gözden geçiren kişinin denetim ekibinin
