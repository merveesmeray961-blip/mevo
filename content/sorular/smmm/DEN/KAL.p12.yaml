- id: SMMM-DEN-KAL-0051
  sinav: smmm
  bolum: *id001
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1 bağımsızlık taahhüdü
  tip: kavrama
  zorluk: 1
  kok: Bir bağımsız denetim şirketi, etik hükümler uyarınca bağımsız olması gereken tüm personelinden bağımsızlık hükümlerine
    uyduklarını bildiren yazılı taahhüt almayı planlamaktadır. KYS 1'e göre bu taahhüt aşağıdakilerden hangisinde doğru zamanlama
    ile verilmiş olur?
  secenekler:
    A: Yalnızca yıl başında tek bir toplu taahhüt olarak
    B: Yalnızca denetim raporu düzenlendikten sonra, rapor tarihinde
    C: Yalnızca KAYİK denetimlerinden önce ve iki yılda bir
    D: Yalnızca işe girişte ve görev değişikliği hâllerinde
    E: Her bir denetimden önce ve her hâlükârda yılda en az bir kez
  dogru: E
  aciklama:
    dogru_neden: KYS 1 md. 34(b) uyarınca denetim şirketi, bağımsız olması gereken tüm personelinden her bir denetimden önce
      ve her hâlükârda yılda en az bir kez, bağımsızlık hükümlerine uyduklarını ve uyacaklarını bildiren yazılı bir taahhüt
      alır.
    celdiriciler:
      A: Yıllık taahhüt tek başına yeterli değildir; her bir denetimden önce de taahhüt alınması gerekir.
      B: Taahhüt önceden verilir, çünkü "uyacaklarını" da bildirmesi aranır; rapor tarihinden sonra alınan taahhüt amaca hizmet
        etmez.
      C: Taahhüt yalnızca KAYİK denetimlerine özgü değildir ve süre iki yıl değil, yılda en az bir kezdir.
      D: İşe giriş ve görev değişikliği tek başına yeterli sıklık sağlamaz; her denetimden önce ve yılda en az bir kez taahhüt
        şarttır.
  kaynaklar:
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: md. 34(b)
    alinti: Denetim şirketi, etik hükümler uyarınca bağımsız olması gereken tüm personelinden her bir denetimden önce ve her
      hâlükârda yılda en az bir kez, bağımsızlık hükümlerine uyduklarını ve uyacaklarını bildiren yazılı bir taahhüt alır.
