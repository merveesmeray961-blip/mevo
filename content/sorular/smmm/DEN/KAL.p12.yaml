      yasaklar.
    celdiriciler:
      A: Dosyaların başka bir denetçiye gösterilmesi yasaklanmış bir davranış değildir; yasak, kendi denetimini teftiş etmeye
        ilişkindir.
      B: Yetkinlik ve kabiliyet md. 39(a)'nın aradığı bir niteliktir, yasaklanan bir husus değildir.
      C: Teftiş sonuçlarının ilgili kişilere iletilmesi md. 46 gereği yapılması gereken bir iletişimdir, yasak değildir.
      E: Teftiş ekibinin birden fazla kişiden oluşması yasaklanmamıştır; tarafsızlık, bu kişilerin teftiş edilen denetimle
        ilişkisiz olmasıyla sağlanır.
