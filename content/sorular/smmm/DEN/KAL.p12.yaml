- id: SMMM-DEN-KAL-0052
  sinav: smmm
  bolum: *id001
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1 tamamlanmış denetimlerin teftişi
  tip: uygulama
  zorluk: 2
  kok: Beş sorumlu denetçisi bulunan bir denetim şirketi, izleme faaliyetleri kapsamında tamamlanmış denetimlerin teftişini
    planlamaktadır. KYS 1 md. 38'e göre şirketin seçim yaklaşımı aşağıdakilerden hangisinde standarda uygundur?
  secenekler:
    A: Her sorumlu denetçinin tamamlanmış en az bir denetimi, şirketin belirlediği periyodik aralıklarla teftişe seçilir.
    B: Yalnızca en yüksek ücretli denetimler seçilir; böylece her sorumlu denetçinin seçilmesi zorunlu olmaz.
    C: Teftiş kapsamına yalnızca devam eden denetimler alınır; tamamlanmış denetimler teftişe konu edilmez.
    D: Beş sorumlu denetçi arasından yalnızca kıdemli olan ikisinin denetimi seçilir ve kalan üçü teftişin dışında bırakılır.
    E: Teftişe konu denetimleri, ilgili denetimde kaliteyi gözden geçiren kişi seçer.
  dogru: A
  aciklama:
    dogru_neden: 'KYS 1 md. 38(c) uyarınca denetim şirketi tamamlanmış denetimleri, her bir sorumlu denetçinin tamamlanmış
      en az bir denetimini belirlediği periyodik aralıklarla seçecek şekilde izleme faaliyetlerine dâhil eder. Püf noktaları:
      Ölçüt ücret veya kıdem değil, her sorumlu denetçinin en az bir tamamlanmış denetiminin periyodik olarak kapsama alınmasıdır;
      teftiş devam eden değil tamamlanmış denetimler üzerindedir.'
    celdiriciler:
      B: Seçimde ücret ölçütü aranmaz; md. 38(c) her sorumlu denetçi için en az bir tamamlanmış denetimin periyodik aralıklarla
        seçilmesini ister.
      C: Md. 38 "tamamlanmış denetimlerin teftişini" izleme faaliyetlerine dâhil etmeyi öngörür; devam eden denetimlerle sınırlama
        standartta yoktur.
      D: Standart sorumlu denetçilerin bir kısmını dışarıda bırakmaya izin vermez; her biri için en az bir tamamlanmış denetim
        seçilir.
      E: Md. 39(b) uyarınca kaliteyi gözden geçiren kişi ve denetim ekibi üyeleri o denetimle ilgili teftiş yapamaz; seçim
        kararını denetim şirketi verir.
  kaynaklar:
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: md. 38
    alinti: Denetim şirketi, tamamlanmış denetimlerin teftişini izleme faaliyetlerine dâhil eder ve hangi denetimlerin ve
      sorumlu denetçilerin seçileceğini belirler.
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
