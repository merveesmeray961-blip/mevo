    A: Sorumlu denetçinin kendi denetimine ilişkin dosyaları, istişare amacıyla şirketteki başka bir denetçiye göstermesini
      ve görüş almasını
    B: İzleme faaliyetlerini yürütecek kişilerin, yeterli zaman dâhil yetkinlik ve kabiliyete sahip kişiler arasından seçilmesini
    C: Teftiş sonucunda tespit edilen eksikliklerin, kalite yönetim sisteminin işleyişinden sorumlu kişilere zamanında iletilmesini
    D: Denetim ekibi üyelerinin veya kaliteyi gözden geçiren kişinin, söz konusu denetimle ilgili herhangi bir teftiş yapmasını
    E: Tamamlanmış denetimlerin teftişinde, iş yükünü paylaşmak üzere birden fazla kişiden yararlanılmasını ve ekip kurulmasını
  dogru: D
  aciklama:
    dogru_neden: KYS 1 md. 39(b) uyarınca izleme faaliyetlerini yürüten kişilerin tarafsızlığını ele alan politika veya prosedürler,
