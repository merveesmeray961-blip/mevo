- id: SMMM-DEN-KAL-0064
  sinav: smmm
  bolum: *id002
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1 değerlendirme sonuçları
  tip: uygulama
  zorluk: 4
  kok: Bir denetim şirketinin yıllık değerlendirmesinde, kalite yönetim sisteminin işleyişi üzerinde ciddi ancak yaygın olmayan
    bir etkiye sahip bir eksiklik belirlenmiştir. Nihai sorumluluk sahibi kişiler bu eksiklikle ilgili hususlar dışında sistemin
    hedeflere ulaşıldığına dair makul güvence sağladığı kanaatindedir. KYS 1 md. 54'e göre ulaşılacak sonuç ve sonraki adım
    aşağıdakilerden hangisidir?
  secenekler:
    A: 54(b) sonucuna ulaşılır; zamanında ve uygun adımlar atılır ve durum ilgili denetim ekiplerine ve gerekiyorsa şirket
      dışı taraflara bildirilir.
    B: 54(a) sonucuna ulaşılır; makul güvence sağlandığından herhangi bir adım atılmaz ve bildirim yapılmaz.
    C: 54(c) sonucuna ulaşılır; çünkü tek bir ciddi eksiklik sistemin hedeflerine ulaştığına dair makul güvenceyi tamamen
      ortadan kaldırır.
    D: Hiçbir sonuca ulaşılmaz; sonuç yalnızca eksikliğin yaygın olması hâlinde belirlenir.
    E: 54(b) sonucuna ulaşılır; ancak bu durum yalnızca yıllık raporun kapanışında not edilir, bildirim yapılmaz.
  dogru: A
  aciklama:
    dogru_neden: 'KYS 1 md. 54(b) ciddi ancak yaygın olmayan etkili eksiklikler dışında sistemin makul güvence sağladığı durumu
      kapsar. Md. 55 uyarınca 54(b) veya 54(c) sonucuna ulaşılması hâlinde denetim şirketi zamanında ve uygun adımlar atar
      ve durumu denetim ekiplerine ve politikalar gerektiriyorsa şirket dışı taraflara bildirir. Püf noktaları: 54(b) ve 54(c)
      bildirim yükümlülüğü doğurur; 54(a) tek sonuçtur ki herhangi bir adım ve bildirim gerektirmez.'
    celdiriciler:
      B: Eksiklik tespit edildiği için 54(a) sonucuna ulaşılamaz; ayrıca 54(b) veya (c) hâlinde adım atılması ve bildirim
