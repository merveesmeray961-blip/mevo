  kok: BDS 220 “Finansal Tabloların Bağımsız Denetiminde Kalite Yönetimi” standardına göre, kalitesi gözden geçirilmesi gereken
    denetimlerde sorumlu denetçinin sorumlulukları hakkında aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Kaliteyi gözden geçiren kişinin atandığına karar verir.
    B: Kaliteyi gözden geçiren kişiyle iş birliği yapar ve ekip üyelerini bu konudaki sorumlulukları hakkında bilgilendirir.
    C: Denetim sırasında ortaya çıkan önemli konuları ve muhakemeleri kaliteyi gözden geçiren kişiyle müzakere eder.
    D: Gözden geçirme tamamlanıncaya kadar denetçi raporuna tarih vermez.
    E: Gözden geçirme sürerken de denetçi raporuna tarih verebilir; yeter ki gözden geçirme rapor tarihinden sonra bitsin.
  dogru: E
  aciklama:
    dogru_neden: BDS 220 par. 36(d) uyarınca sorumlu denetçi, gözden geçirme tamamlanıncaya kadar denetçi raporuna tarih vermez;
      ayrıca kalitenin gözden geçirilmesi rapor tarihinde veya öncesinde tamamlanır (par. 12). E şıkkı bu hükümlere aykırıdır.
    celdiriciler:
      A: Par. 36(a) bu sorumluluğu sorumlu denetçiye verir; ifade doğrudur.
      B: Par. 36(b) iş birliği ve ekibin bilgilendirilmesini öngörür; ifade doğrudur.
      C: Par. 36(c) önemli konuların ve muhakemelerin müzakere edilmesini öngörür; ifade doğrudur.
      D: Par. 36(d) gözden geçirme tamamlanıncaya kadar rapora tarih verilmemesini öngörür; ifade doğrudur.
  kaynaklar:
  - mevzuat: BDS 220 Finansal Tabloların Bağımsız Denetiminde Kalite Yönetimi
