      denetlenebilir dönem) fazla sorumlu denetçi, kaliteyi gözden geçiren veya diğer kilit denetçi rollerini üstlenemez.
    celdiriciler:
      A: Üç yıl, kaliteyi gözden geçirenin ara verme süresidir (A540.12); azami denetlenebilir dönem değildir.
      B: Beş yıl, sorumlu denetçi için ara verme süresidir (A540.11); azami denetlenebilir dönem değildir.
      D: On yıl Etik Kurallarda bu amaçla öngörülen bir süre değildir; sınır yedi yıldır.
      E: On beş yıl Etik Kurallarda bu amaçla öngörülen bir süre değildir; sınır yedi yıldır.
