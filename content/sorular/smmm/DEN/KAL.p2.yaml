  kok: Kaliteyi gözden geçiren kişi, denetim ekibinin yaptığı önemli bir muhakemenin uygun olmadığına dair endişesini sorumlu
    denetçiye bildirmiştir; ancak endişe ikna edici şekilde çözümlenememiştir. KYS 2 “Denetimin Kalitesinin Gözden Geçirilmesi”
    standardına göre kaliteyi gözden geçiren kişi aşağıdakilerden hangisini yapmalıdır?
  secenekler:
    A: Endişesini dosyaya kaydedip gözden geçirmenin tamamlandığını sorumlu denetçiye bildirir.
    B: Gözden geçirmeyi denetim şirketi dışındaki bir kişiye devrederek raporun düzenlenmesine izin verir.
    C: Denetim şirketindeki uygun kişi veya kişilere gözden geçirmenin tamamlanamadığı bilgisini verir.
    D: Sorumlu denetçi adına denetçi raporunu düzenler ve tarihini kendisi belirler.
    E: Çözümlenemeyen konuyu belgelendirmeden çıkararak çalışmayı sonuçlandırır.
  dogru: C
  aciklama:
    dogru_neden: 'KYS 2 par. 26 uyarınca endişeleri ikna edici şekilde çözümlenemezse kaliteyi gözden geçiren kişi, denetim
      şirketindeki uygun kişi veya kişilere kalitenin gözden geçirilmesinin tamamlanamadığı bilgisini verir. Par. 24(b) uyarınca
      sorumlu denetçi, tamamlandığına dair bildirim alana kadar denetim raporuna tarih vermez. Püf noktaları: Tamamlanma bildirimi
      (par. 27) ancak hükümler yerine getirildiğinde yapılır; çözümsüz endişe “tamamlandı” bildirimine dönüştürülemez ve rapor
      tarihi bu aşamada verilemez.'
    celdiriciler:
      A: Endişe çözümlenmeden tamamlandı bildirimi yapılamaz; par. 26 tamamlanamadığı bilgisinin verilmesini öngörür.
      B: Gözden geçirmeyi devretmek par. 26’daki süreci karşılamaz; denetim şirketine bilgi verilmesi gerekir.
      D: Denetçi raporunu düzenlemek ve tarihlemek sorumlu denetçinin işidir; kaliteyi gözden geçiren kişinin görevi değildir.
      E: Belgelendirme par. 30 uyarınca kaliteyi gözden geçirmeye ilişkin bildirimleri içerir; konuyu çıkarmak mümkün değildir.
