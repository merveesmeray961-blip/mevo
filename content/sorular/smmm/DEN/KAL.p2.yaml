- id: SMMM-DEN-KAL-0036
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 2
  tip: uygulama
  zorluk: 2
  kok: Bir denetimde kaliteyi gözden geçirme çalışmasına başlamış olan kaliteyi gözden geçiren kişi, kendi liyakatini zedeleyen
    bir durumun farkına varmıştır. KYS 2 “Denetimin Kalitesinin Gözden Geçirilmesi” standardına göre bu kişinin yapması gereken
    aşağıdakilerden hangisidir?
  secenekler:
    A: Uygun kişileri bilgilendirir ve kaliteyi gözden geçirmeyi durdurur.
    B: Gözden geçirmeyi tamamlar ve durumu yalnızca rapor tarihinden sonra bildirir.
    C: Atanmayı reddeder; başlamış olduğu çalışmayı olduğu gibi sorumlu denetçiye devreder.
    D: Durumu bildirmeden gözden geçirmeye devam eder ve belgelendirmede açıklar.
    E: Yerine geçecek kişiyi kendisi belirleyerek çalışmayı devreder.
  dogru: A
  aciklama:
    dogru_neden: KYS 2 par. 23 uyarınca kaliteyi gözden geçiren kişi, liyakatini zedeleyen durumların farkına vardığında denetim
      şirketindeki uygun kişi veya kişileri bilgilendirir; kaliteyi gözden geçirmeye başlamışsa gözden geçirmeyi durdurur.
      Atanmayı reddetme, henüz başlamamış olma hâline ilişkindir.
    celdiriciler:
      B: Gözden geçirmeye başlanmış olması hâlinde standart durdurmayı öngörür; bildirimin rapor tarihinden sonraya bırakılması
        mümkün değildir.
      C: Atanmayı reddetme yalnızca gözden geçirmeye henüz başlamamış kişi için geçerlidir (par. 23(a)).
      D: Bildirim yapılması zorunludur; durumu bildirmeden devam etmek par. 23’e aykırıdır.
      E: Yerine geçecek kişinin belirlenmesi ve atanması denetim şirketinin politika veya prosedürlerinde ele alınan bir süreçtir
        (par. 22); kaliteyi gözden geçiren kişinin işi değildir.
  kaynaklar:
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: par. 23
    alinti: Kaliteyi gözden geçiren kişi, liyakatini zedeleyen durumların farkına vardığında, denetim şirketindeki uygun kişi
      veya kişileri bilgilendirir ve
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: par. 23
    alinti: (a) Kaliteyi gözden geçirmeye başlamamışsa, kaliteyi gözden geçirmek üzere atanmayı reddeder veya (b) Kaliteyi
      gözden geçirmeye başlamışsa, kaliteyi gözden geçirmeyi durdurur.
