- id: SMMM-DEN-KAL-0039
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: uygulama
  zorluk: 3
  kok: Bir denetim şirketinde yıllık değerlendirme sonunda, tespit edilen eksikliklerin kalite yönetim sisteminin tasarımı,
    uygulanması ve işleyişi üzerinde ciddi ancak yaygın olmayan bir etkiye sahip olduğu görülmüştür. Bu eksikliklerle ilgili
    hususlar dışında sistem hedeflere ulaşıldığına dair makul güvence sağlamaktadır. KYS 1’e göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Sistem makul güvence sağladığından 54(a) sonucuna ulaşılır ve herhangi bir ek adım gerekmez.
    B: Sistem makul güvence sağlamadığından 54(c) sonucuna ulaşılır.
    C: 54(b) sonucuna ulaşılır; durum yalnızca denetim şirketi yönetimine bildirilir.
    D: 54(b) sonucuna ulaşılır; uygun adımlar atılır, durum ilgili denetim ekiplerine bildirilir.
    E: 54(b) sonucuna ulaşılır; adım atma yükümlülüğü yalnızca 54(c) sonucunda doğar.
  dogru: D
  aciklama:
    dogru_neden: 'KYS 1 par. 54(b) uyarınca ciddi ancak yaygın olmayan etkili eksiklikler dışında sistem makul güvence sağlıyorsa
      54(b) sonucuna ulaşılır. Par. 55’e göre 54(b) veya 54(c) sonucunda denetim şirketi zamanında ve uygun adımlar atar ve
      durumu sorumlulukları ölçüsünde denetim ekiplerine ve diğer görevlilere bildirir. Püf noktaları: “Ciddi ancak yaygın
      olmayan” ifadesi (b) sonucunu işaret eder; (c) sonucu makul güvencenin hiç sağlanmadığı durumdur. Adım atma ve bildirim
      yükümlülüğü her iki sonuç için de geçerlidir.'
    celdiriciler:
      A: Ciddi etkili eksiklik bulunduğundan sonuç (a) değildir; (b) sonucu için ayrıca adım atılır (par. 55).
      B: Eksikliklerle ilgili hususlar dışında makul güvence sağlandığından sonuç (c) değil (b)’dir.
      C: Par. 55(b)(i) bildirimin denetim ekiplerine ve görevlendirilen diğer kişilere de yapılmasını öngörür; yalnızca yönetime
        bildirim yetmez.
      E: Par. 55 adım atma yükümlülüğünü 54(b) veya 54(c) sonuçlarının her ikisi için öngörür.
  kaynaklar:
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: par. 54(b)
    alinti: Kalite yönetim sisteminin tasarımı, uygulanması ve işleyişi üzerinde ciddi ancak yaygın olmayan bir etkiye sahip
      olduğu tespit edilen eksikliklerle ilgili hususlar dışında; kalite yönetim sistemi, denetim şirketine, kalite yönetim
      sisteminin hedeflerine ulaşıldığına dair makul güvence sağlamaktadır
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: par. 55
    alinti: '54(b) veya 54(c) paragraflarında belirtilen sonuçlardan birine ulaşması durumunda, denetim şirketi; (Bkz.: A196
      paragrafı) (a) Zamanında ve uygun adımlar atar ve (b) Bu durumu aşağıdaki kişilere bildirir: (i) Sorumluluklarıyla ilgili
      olduğu ölçüde; denetim ekipleri ve kalite yönetim sistemi kapsamında görevlendirilen diğer kişiler'
