- id: SMMM-DEN-KAL-0046
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: Bağımsız Denetçiler için Etik Kurallar
  tip: uygulama
  zorluk: 3
  kok: Bir denetim müşterisi kamu yararını ilgilendiren kuruluş (KAYİK) hâline gelmiştir. Kilit denetçi S bu müşteriye kümülatif
    dört yıldır, kilit denetçi T ise kümülatif altı yıldır hizmet vermektedir. Bağımsız Denetçiler İçin Etik Kurallar’a göre
    rotasyona tabi tutularak ayrılmadan önce S ve T aynı sıfatla en fazla kaç yıl daha hizmet verebilir?
  secenekler:
    A: 'S: 1, T: 1 yıl'
    B: 'S: 2 yıl, T: 1 yıl'
    C: S için 2 yıl, T için 3 yıl
    D: S için 3 yıl; T için azami 2 yıl
    E: S için 3 yıl, T için 3 yıl ve daha fazlası
  dogru: D
  aciklama:
    dogru_neden: 'A540.8’e göre müşteri KAYİK hâline geldiğinde kişinin hizmet süresi kümülatif beş yıl veya daha az ise kalan
      süre yediden hizmet yılı çıkarılarak hesaplanır: S için 7 − 4 = 3 yıl. Hizmet süresi altı yıl veya daha fazla ise (T),
      üst yönetimden sorumlu olanların mutabakatıyla azami iki yıl daha hizmet verilebilir. Püf noktaları: Beş yıl ve altı
      yıl sınırında hesap yöntemi değişir; altı yıllık kişiye “7 − 6 = 1” uygulanmaz, sabit azami iki yıl uygulanır.'
    celdiriciler:
      A: S için kalan süre 7 − 4 = 3 yıldır; T için azami iki yıl tanınır.
      B: S için 3 yıl hakkı vardır; T için kural 7 − 6 = 1 yıl değil, azami iki yıldır.
      C: T için üç yıl öngörülmemiştir; azami süre iki yıldır, S için ise 3 yıldır.
      E: T için azami iki yıl öngörülmüştür; üç yıl değildir.
  kaynaklar:
  - mevzuat: Bağımsız Denetçiler İçin Etik Kurallar (Bağımsızlık Standartları Dâhil)
    madde: A540.8
    alinti: Müşteri KAYİK hâline geldiğinde, kişinin bu müşteriye kilit denetçi olarak hizmet vermiş olduğu süre kümülatif
      olarak beş yıl veya daha az ise; bu kişinin rotasyona tabi tutularak söz konusu denetimden ayrılmadan önce bu sıfatla
      hizmet vermeye devam edebileceği süre, yedi yıldan hizmet vermiş olduğu yıl sayısı çıkarılarak hesaplanır.
  - mevzuat: Bağımsız Denetçiler İçin Etik Kurallar (Bağımsızlık Standartları Dâhil)
    madde: A540.8
    alinti: A540.5 paragrafının bir istisnası olarak, müşteri KAYİK hâline geldiğinde, kişinin bu müşteriye kilit denetçi
      olarak hizmet vermiş olduğu süre kümülatif olarak altı yıl veya daha fazla ise, bu kişi rotasyona tabi tutularak söz
