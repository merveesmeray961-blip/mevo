    (KAYİK) denetiminde bir kişi sorumlu denetçi, kaliteyi gözden geçiren kişi veya diğer kilit denetçi rollerini kümülatif
    olarak en fazla kaç yıl üstlenebilir (azami denetlenebilir dönem)?
