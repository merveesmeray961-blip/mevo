  - mevzuat: BDS 220 Finansal Tabloların Bağımsız Denetiminde Kalite Yönetimi
    madde: par. 12
    alinti: Kalitenin gözden geçirilmesi, rapor tarihinde veya öncesinde tamamlanır.
