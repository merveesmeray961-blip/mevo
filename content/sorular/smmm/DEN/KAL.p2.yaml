- id: SMMM-DEN-KAL-0035
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: bilgi
  zorluk: 1
  kok: KYS 1 “Bağımsız Denetim Şirketleri İçin Kalite Yönetimi” standardına göre, kalite yönetim sistemi için nihai sorumluluk
    ve hesap verme yükümlülüğü denetim şirketinde kime verilir?
  secenekler:
    A: Kalite yönetim sisteminin işleyişinden sorumlu olarak görevlendirilen kişi veya kişilere
    B: İcra kurulu başkanına ya da yönetici ortağına veya uygun hâllerde yönetim kuruluna
    C: Bağımsızlık hükümlerine uygunluktan sorumlu olarak görevlendirilen kişi veya kişilere
    D: İzleme ve düzeltme süreci açısından operasyonel sorumluluk verilen kişi veya kişilere
    E: Her bir denetimin sorumlu denetçisine ve denetim ekibinin kıdemli üyelerine
  dogru: B
  aciklama:
    dogru_neden: KYS 1 par. 20(a) uyarınca denetim şirketi, kalite yönetim sistemi için nihai sorumluluk ve hesap verme yükümlülüğünü
      icra kurulu başkanına ya da yönetici ortağına (veya eşdeğerine) veya uygun hâllerde yönetim kuruluna (veya eş değerine)
      verir.
    celdiriciler:
      A: İşleyişten sorumlu kişiler par. 20(b) uyarınca ayrıca görevlendirilir; nihai sorumluluk ve hesap verme yükümlülüğü
        onlara değil, üst düzey yöneticiye verilir.
      C: Bağımsızlık hükümlerine uygunluktan sorumlu kişiler par. 20(c)(i) kapsamında belirli unsurların işleyişinden sorumlu
        olanlardır; nihai sorumluluk bunlarda değildir.
      D: İzleme ve düzeltme sürecinden sorumlu kişiler par. 20(c)(ii) kapsamında belirli unsurların işleyişinden sorumlu olanlardır;
        nihai sorumluluk bunlarda değildir.
      E: Sorumlu denetçi denetim düzeyinde sorumluluk taşır (BDS 220); sistem düzeyindeki nihai sorumluluk denetim şirketinin
        üst düzey yöneticisine verilir.
  kaynaklar:
  - mevzuat: KYS 1 Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: par. 20(a)
    alinti: Kalite yönetim sistemi için nihai sorumluluk ve hesap verme yükümlülüğünü, denetim şirketinin icra kurulu başkanına
      ya da yönetici ortağına (veya eşdeğerine) veya -uygun hâllerde- yönetim kuruluna (veya eş değerine) verir.
