    alinti: 'fazlasını oluşturması veya oluşturmasının muhtemel olması durumunda denetim şirketi, oluşan tehditlerin kabul
      edilebilir bir düzeye indirilmesinde aşağıdaki adımlardan herhangi birinin bir önlem olup olamayacağına karar verir
      ve öyle olması durumunda söz konusu adımı uygular:'
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar (Bağımsızlık Standartları Dâhil)
    madde: par. A410.18 (başlangıç)
    alinti: Birbirini takip eden iki yılın her biri için, KAYİK olan bir denetim müşterisinden alınan toplam ücretlerin, denetim
      şirketi tarafından alınan toplam ücretlerin
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar (Bağımsızlık Standartları Dâhil)
