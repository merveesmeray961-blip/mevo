- id: SMMM-DEN-KAL-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: 'Bağımsız Denetçiler için Etik Kurallar: denetim müşterisinden alınan ücretlerin yarattığı bağımlılık tehdidi (KAYİK
    ve KAYİK olmayan)'
  tip: bilgi
  zorluk: 2
  soru_bicimi: bosluk
  kok: 'Bağımsız Denetçiler için Etik Kurallar (Bağımsızlık Standartları Dâhil) uyarınca; KAYİK olmayan bir denetim müşterisinden
    alınan toplam ücretlerin, birbirini takip eden (i) yılın her biri için denetim şirketi tarafından alınan toplam ücretlerin
    %(ii)''sinden fazlasını oluşturması veya oluşturmasının muhtemel olması durumunda denetim şirketi, oluşan tehditlerin
    kabul edilebilir bir düzeye indirilmesinde belirtilen adımlardan herhangi birinin bir önlem olup olamayacağına karar verir.
    KAYİK olan bir denetim müşterisinde ise birbirini takip eden (iii) yılın her biri için müşteriden alınan toplam ücretlerin,
    denetim şirketi tarafından alınan toplam ücretlerin %(iv)''inden fazlasını oluşturması veya oluşturmasının muhtemel olması
    durumunda denetim şirketi, denetim görüşü yayımlanmadan önce görüş bildiren denetim şirketinin üyesi olmayan bir denetçi
    tarafından gerçekleştirilen gözden geçirmenin (yayımlanma öncesi inceleme) tehditlerin kabul edilebilir bir düzeye indirilmesinde
    bir önlem olup olamayacağına karar verir.


    Yukarıdaki boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?'
  secenekler:
    A: (i) 5 – (ii) 30 – (iii) 3 – (iv) 15
    B: (i) 5 – (ii) 15 – (iii) 2 – (iv) 30
    C: (i) 2 – (ii) 30 – (iii) 5 – (iv) 15
    D: (i) 3 – (ii) 30 – (iii) 2 – (iv) 15
    E: (i) 5 – (ii) 30 – (iii) 2 – (iv) 15
  dogru: E
  aciklama:
    dogru_neden: 'Etik Kurallar A410.15 paragrafına göre KAYİK olmayan denetim müşterisi için eşik, birbirini takip eden beş
      yılın her biri için denetim şirketinin toplam ücretlerinin %30''unu aşan ücret oranıdır. A410.18 paragrafına göre KAYİK
      olan denetim müşterisi için eşik daha sıkıdır: birbirini takip eden iki yılın her biri için toplam ücretlerin %15''ini
      aşan oran. Doğru sıra: (i) 5, (ii) 30, (iii) 2, (iv) 15.'
    celdiriciler:
      A: KAYİK için süre üç değil, iki yıldır (A410.18).
      B: 'Oranlar ters yazılmıştır: KAYİK olmayan müşteride %30, KAYİK müşteride %15 eşiği geçerlidir.'
      C: 'Süreler ters yazılmıştır: KAYİK olmayan müşteride beş yıl, KAYİK müşteride iki yıl esas alınır.'
      D: KAYİK olmayan müşteride süre üç değil, beş yıldır (A410.15).
  kaynaklar:
