  konu: KAL
  kazanim: KYS 2
  tip: bilgi
  zorluk: 3
  kok: KYS 2 “Denetimin Kalitesinin Gözden Geçirilmesi”ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: KYS 1 uyarınca kalitesi gözden geçirilmesi gereken denetimlerde uygulanır; gözden geçirmeyi atanan kişi yapar.
    B: Sınırlı güvence denetimlerinde uygulanır; makul güvence denetimleri KYS 1'e tabidir.
    C: Kaliteyi gözden geçiren kişi denetim ekibinin üyeleri arasından seçilir.
    D: Gözden geçirme KAYİK denetimlerinde ekibin sorumlu denetçisince yapılır.
    E: Gözden geçirme, risk değerlendirmesinden bağımsız olarak her denetimde aynı kapsamda yapılır.
  dogru: A
  aciklama:
    dogru_neden: 'KYS 2 md. 2’ye göre bu KYS, KYS 1 uyarınca kalitesi gözden geçirilmesi gereken tüm denetimler
      için uygulanır. Kalitenin gözden geçirilmesi, denetim şirketi adına kaliteyi gözden geçiren kişi tarafından
      yapılır. Püf noktaları: Ölçeklendirilebilirlik nedeniyle prosedürlerin kapsamı denetime göre değişir; her
      denetimde aynı değildir.'
    celdiriciler:
      B: KYS 2, KYS 1 uyarınca kalite gözden geçirmesi gereken tüm denetimlere uygulanır.
      C: Kaliteyi gözden geçiren kişi denetim ekibinin üyesi olmaz; tarafsızlık için ekip dışından atanır.
      D: Gözden geçirmeyi sorumlu denetçi değil, atanan kaliteyi gözden geçiren kişi yapar.
      E: Hangi denetimlerin gözden geçirileceği şirketin kalite risklerine verdiği yanıtlarla belirlenir.
