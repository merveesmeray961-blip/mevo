- id: SMMM-DEN-KAL-0004
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: bilgi
  zorluk: 1
  kok: KYS 1 Finansal Tabloların Bağımsız Denetim veya Sınırlı Bağımsız Denetimleri ile Diğer Güvence Denetimleri veya İlgili
    Hizmetleri Yürüten Bağımsız Denetim Şirketleri İçin Kalite Yönetimi Standardı'na göre, denetim şirketinin amacı aşağıdakilerden
    hangisidir?
  secenekler:
    A: Yalnızca finansal tablo denetimlerinde yüksek kalite sağlamak
    B: Yürüttüğü finansal tabloların bağımsız denetim veya sınırlı bağımsız denetimleri ile diğer güvence denetimleri veya
      ilgili hizmetlere ilişkin olarak, denetim şirketi ve personelinin sorumluluklarını mesleki standartlara ve mevzuat hükümlerine
      uygun olarak yerine getirdiği ve denetimi söz konusu standartlara ve mevzuat hükümlerine uygun yürüttüğü ile denetim
      şirketi (sorumlu denetçi) tarafından düzenlenen raporların içinde bulunulan şartlara uygun olduğu hususlarında kendisine
      makul güvence sağlayan bir kalite yönetim sistemi tasarlamak, uygulamak ve sistemin işleyişini sağlamak
    C: Sadece denetim ekiplerinin mesleki şüphecilik içinde hareket etmesini sağlamak
    D: Kalite yönetim sistemini yalnızca büyük denetim şirketleri için tasarlamak
    E: Denetim raporlarının mutlak güvence sağlamasını garanti etmek
  dogru: B
  aciklama:
    dogru_neden: 'KYS 1 paragraf 14, denetim şirketinin amacını açıkça bu şekilde tanımlar: makul güvence sağlayan bir kalite
      yönetim sistemi tasarlamak, uygulamak ve işleyişini sağlamak. Bu, kaliteli denetimlerin tutarlı yürütülmesine hizmet
      eder.'
    celdiriciler:
      A: Amaç yalnızca finansal tablo denetimleriyle sınırlı değildir; sınırlı bağımsız denetim, diğer güvence denetimleri
        ve ilgili hizmetleri de kapsar.
      C: Mesleki şüphecilik önemli olmakla birlikte, amacın tamamı değildir; amaç makul güvence sağlayan sistemdir.
      D: KYS 1 tüm bağımsız denetim şirketleri için geçerlidir; büyüklük ayrımı yapılmaz.
      E: Standart makul güvence ister; mutlak güvence mümkün değildir ve amaç bu değildir.
  kaynaklar:
  - mevzuat: KYS 1
    madde: paragraf 14
    alinti: Denetim şirketinin amacı, yürüttüğü finansal tabloların bağımsız denetim veya sınırlı bağımsız denetimleri ile
      diğer güvence denetimleri veya ilgili hizmetlere ilişkin olarak; Denetim şirketi ve personelinin, sorumluluklarını mesleki
      standartlara ve mevzuat hükümlerine uygun olarak yerine getirdiği ve denetimi söz konusu standartlara ve mevzuat hükümlerine
      uygun yürüttüğü ve Denetim şirketi (sorumlu denetçi) tarafından düzenlenen raporların içinde bulunulan şartlara uygun
      olduğu hususlarında kendisine makul güvence sağlayan bir kalite yönetim sistemi tasarlamak, uygulamak ve sistemin işleyişini
