  tip: bilgi
  zorluk: 3
  kok: KYS 2 “Denetimin Kalitesinin Gözden Geçirilmesi”ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kalitenin gözden geçirilmesi, yalnızca KAYİK denetimlerinde zorunludur ve denetim ekibi tarafından yapılır.
    B: Bu KYS, KYS 1 uyarınca kalitesi gözden geçirilmesi gereken tüm denetimler için uygulanır ve kalitenin gözden geçirilmesi
      denetim şirketi adına kaliteyi gözden geçiren kişi tarafından yapılır.
    C: Kaliteyi gözden geçiren kişi, denetim ekibinin bir üyesi olmak zorundadır.
    D: KYS 2, yalnızca sınırlı güvence denetimleri için geçerlidir.
    E: Kalitenin gözden geçirilmesi, denetim şirketinin risk değerlendirmesinden bağımsız olarak her denetimde aynı kapsamda
      uygulanır.
  dogru: B
  aciklama:
    dogru_neden: 'KYS 2 md. 2’ye göre bu KYS, KYS 1 uyarınca kalitesi gözden geçirilmesi gereken tüm denetimler için uygulanır.
      Kalitenin gözden geçirilmesi, denetim şirketi adına kaliteyi gözden geçiren kişi tarafından yapılır. Püf noktaları:
      Ölçeklendirilebilirlik nedeniyle prosedürlerin kapsamı denetime göre değişir; her denetimde aynı değildir.'
    celdiriciler:
      A: Yalnızca KAYİK ile sınırlı değildir; KYS 1’e göre gereken tüm denetimler içindir ve ekip tarafından değil kaliteyi
        gözden geçiren kişi tarafından yapılır.
      C: Kaliteyi gözden geçiren kişi bağımsız olmalı, ekip üyesi olamaz.
      D: Finansal tablo denetimleri dâhil tüm ilgili denetimler içindir.
      E: Ölçeklendirilebilirlik ilkesi gereği kapsam denetime göre farklılık gösterir.
