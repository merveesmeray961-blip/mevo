- id: SMMM-DEN-KAL-0006
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: Bağımsız Denetçiler için Etik Kurallar
  tip: uygulama
  zorluk: 3
  kok: Bağımsız Denetçiler için Etik Kurallar’a göre bağımsızlık tehditlerinin değerlendirilmesi ve önlemlerin uygulanmasına
    ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Tüm tehditler için aynı önlemler uygulanır; tehdit seviyesi dikkate alınmaz.
    B: Denetçi, bağımsızlık tehditlerini belirler, değerlendirir ve tehditleri kabul edilebilir seviyeye indirmek için önlemler
      uygular; önlemler tehdidin niteliğine ve seviyesine uygun olmalıdır.
    C: Bağımsızlık tehditleri yalnızca sözleşme kabulünden sonra değerlendirilir.
    D: Önlemler uygulanamasa bile denetim devam ettirilebilir.
    E: Tehdit değerlendirmesi yalnız sorumlu denetçi tarafından yapılır, ekip üyeleri sorumluluk taşımaz.
  dogru: B
  aciklama:
    dogru_neden: 'Bağımsız Denetçiler için Etik Kurallar’da bağımsızlık çerçevesi, tehditlerin belirlenmesi, değerlendirilmesi
      ve kabul edilebilir seviyeye indirilmesi için önlemlerin uygulanmasını gerektirir. Önlemler tehdidin niteliğine ve seviyesine
      uygun olmalıdır. Püf noktaları: Tehdit-önlem yaklaşımı temeldir; kabul edilebilir seviye aşılamazsa ilişki sonlandırılır.'
    celdiriciler:
      A: Önlemler tehdidin niteliği ve seviyesine göre değişir.
      C: Tehditler sözleşme kabulünden önce ve denetim boyunca sürekli değerlendirilir.
      D: Önlemler yetersizse bağımsızlık tehlikeye girer ve denetim üstlenilmemeli veya sonlandırılmalıdır.
      E: Tüm ekip üyeleri bağımsızlık yükümlülüklerine tabidir.
  kaynaklar:
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar
    madde: 120.10 U2
    alinti: Önlemler, temel ilkelere uyumu engelleyen tehditleri etkin bir şekilde kabul edilebilir bir düzeye indirmek için
      denetçi tarafından -tek başına veya birlikte- atılan adımlardır.
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar
    madde: 120.10 U1
    alinti: Durum ve gerçeklere bağlı olarak bir tehdit, söz konusu tehdidi oluşturan durum ortadan kaldırılarak ele alınabilir.
      Ancak, tehdidin yalnızca söz konusu mesleki faaliyetin reddedilmesi veya sonlandırılması suretiyle ele alınabileceği
      bazı durumlar da vardır. Bunun nedeni, tehditleri oluşturan durumların ortadan kaldırılamaması ile tehdidin kabul edilebilir
      bir düzeye indirilebilmesi için önlemlerin uygulanma kabiliyetinin bulunmamasıdır.
