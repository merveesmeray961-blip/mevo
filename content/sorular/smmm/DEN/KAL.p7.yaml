    madde: '2'
    alinti: Bu KYS, KYS 1 uyarınca kalitesi gözden geçirilmesi gereken tüm denetimler için uygulanır.1 Bu KYS, denetim
      şirketinin KYS 1’e veya en az KYS 1’de öngörülen yükümlülükleri karşılayacak muhtevadaki diğer düzenlemelere
      tabi olduğu ön kabulüne dayanarak düzenlenmiştir. Bu Standart, etik hükümlerle birlikte dikkate alınır.
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: '3'
