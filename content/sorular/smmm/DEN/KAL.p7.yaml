- id: SMMM-DEN-KAL-0007
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: uygulama
  zorluk: 3
  kok: Bir denetim şirketinin izleme sürecinde bir eksiklik tespit edilmiştir. Şirket, eksikliğin nedenini araştırmadan bütün
    personele aynı genel eğitimi vermeyi planlamaktadır. KYS 1'e göre aşağıdaki yaklaşım daha uygundur?
  secenekler:
    A: Eksikliğin kök nedenleri araştırılmalı ve bu analizin sonuçlarına karşılık veren düzeltici adımlar tasarlanıp uygulanmalıdır.
    B: Kök neden araştırılmadan yalnızca eksikliğin bulunduğu dosya kapatılmalıdır.
    C: Tüm düzeltici adımlar her durumda yalnızca yıllık eğitimden oluşmalıdır.
    D: İzleme süreci yalnızca eksikliğin kayda alınmasıyla tamamlanır.
    E: Kök neden araştırması yalnız KAYİK denetimleri için yapılır
  dogru: A
  aciklama:
    dogru_neden: 'KYS 1, tespit edilen eksikliklerin kök neden veya nedenlerinin araştırılmasını ve ardından kök neden analizinin
      sonuçlarına karşılık veren düzeltici adımların tasarlanıp uygulanmasını öngörür. Bu nedenle neden araştırılmadan aynı
      genel eğitimin otomatik olarak uygulanması, kaynakta öngörülen risk ve kök neden temelli yaklaşımı karşılamaz. Püf noktaları:
      Eksikliğin kendisi ile eksikliğin kök nedeni aynı şey değildir; düzeltici adım kök neden analizinin sonucuna karşılık
      vermelidir.'
    celdiriciler:
      B: Kök neden araştırması ve buna dayalı düzeltici adım yaklaşımı atlanmaktadır.
      C: Kaynak, her durumda yalnızca eğitim verilmesini öngörmez; düzeltici adım kök neden analizine dayanmalıdır.
      D: İzleme ve düzeltme süreci yalnızca eksikliği kaydetmekle sınırlı değildir.
      E: KYS 1'de bu yaklaşım yalnız KAYİK denetimleriyle sınırlandırılmamıştır.
  kaynaklar:
  - mevzuat: KYS 1 Finansal Tabloların Bağımsız Denetim veya Sınırlı Bağımsız Denetimleri ile Diğer Güvence Denetimleri veya
      İlgili Hizmetleri Yürüten Bağımsız Denetim Şirketleri İçin Kalite Yönetimi
    madde: 41(a), 42
    alinti: "Tespit edilen eksikliklerin kök neden veya nedenlerinin araştırılması. Denetim şirketi,\n            kök nedenlerin\
