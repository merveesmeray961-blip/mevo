- id: SMMM-DEN-KAL-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: Bağımsız Denetçiler için Etik Kurallar
  tip: uygulama
  zorluk: 3
  kok: Bağımsız Denetçiler için Etik Kurallar’a göre bağımsızlık tehditlerinin değerlendirilmesi ve önlemlerin uygulanmasına
    ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Tehdit seviyesi dikkate alınmaksızın tüm tehditlere standart önlemler uygulanır.
    B: Tehditler belirlenip değerlendirilir; niteliğine ve seviyesine uygun önlemlerle kabul edilebilir seviyeye
      indirilir.
    C: Tehditler sözleşme kabulünden sonra değerlendirilir; kabul aşamasında değerlendirme yapılmaz.
    D: Önlem uygulanamıyorsa durum dosyaya not edilerek denetime devam edilir.
    E: Tehdit değerlendirmesi sorumlu denetçinin görevidir; ekip üyelerinin bildirim yükümlülüğü yoktur.
  dogru: B
  aciklama:
    dogru_neden: 'Bağımsız Denetçiler için Etik Kurallar’da bağımsızlık çerçevesi, tehditlerin belirlenmesi, değerlendirilmesi
      ve kabul edilebilir seviyeye indirilmesi için önlemlerin uygulanmasını gerektirir. Önlemler tehdidin niteliğine
      ve seviyesine uygun olmalıdır. Püf noktaları: Tehdit-önlem yaklaşımı temeldir; kabul edilebilir seviye aşılamazsa
      ilişki sonlandırılır.'
    celdiriciler:
      A: Önlemler tehdidin niteliğine ve seviyesine göre belirlenir.
      C: Bağımsızlık tehditleri sözleşme kabulü aşamasında da değerlendirilir.
      D: Tehdit kabul edilebilir seviyeye indirilemiyorsa denetimden çekilmek gerekebilir; not almak yetmez.
      E: Ekip üyeleri de tehditleri belirleme ve bildirme sorumluluğu taşır.
  kaynaklar:
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar
    madde: 120.10 U2
    alinti: Önlemler, temel ilkelere uyumu engelleyen tehditleri etkin bir şekilde kabul edilebilir bir düzeye indirmek
      için denetçi tarafından -tek başına veya birlikte- atılan adımlardır.
  - mevzuat: Bağımsız Denetçiler için Etik Kurallar
    madde: 120.10 U1
    alinti: Durum ve gerçeklere bağlı olarak bir tehdit, söz konusu tehdidi oluşturan durum ortadan kaldırılarak
      ele alınabilir. Ancak, tehdidin yalnızca söz konusu mesleki faaliyetin reddedilmesi veya sonlandırılması suretiyle
      ele alınabileceği bazı durumlar da vardır. Bunun nedeni, tehditleri oluşturan durumların ortadan kaldırılamaması
