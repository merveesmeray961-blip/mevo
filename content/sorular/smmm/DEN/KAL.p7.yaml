  zorluk: 1
  kok: KYS 2 'Denetimin Kalitesinin Gözden Geçirilmesi' standardına göre bu standardın kapsamı aşağıdakilerden hangisini içerir?
  secenekler:
    A: Yalnızca denetim şirketinin genel kalite yönetim sisteminin tasarlanması.
    B: Kaliteyi gözden geçiren kişinin atanması ve liyakati ile kalitenin gözden geçirilmesi ve belgelendirilmesinde kaliteyi
      gözden geçiren kişinin sorumlulukları.
    C: Yalnızca KAYİK denetimlerinde kalite gözden geçirmesi zorunluluğu.
    D: Denetim ekibinin günlük denetim prosedürlerinin detaylı planlanması.
    E: Bağımsız denetçi belgesi verilmesi şartları.
  dogru: B
  aciklama:
    dogru_neden: KYS 2 md. 1'e göre standart; (a) kaliteyi gözden geçiren kişinin atanması ve liyakati ile (b) kalitenin gözden
      geçirilmesi ve belgelendirilmesinde kaliteyi gözden geçiren kişinin sorumluluklarını ele alır.
    celdiriciler:
      A: Genel kalite yönetim sistemi KYS 1 kapsamındadır.
      C: KYS 2, KYS 1 uyarınca kalitesi gözden geçirilmesi gereken tüm denetimler için uygulanır; yalnızca KAYİK ile sınırlı
        değildir.
      D: Günlük prosedür planlaması BDS 300 kapsamındadır.
      E: Yetkilendirme BDY kapsamındadır.
  kaynaklar:
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: '1'
    alinti: Bu Kalite Yönetim Standardı (KYS); (a) Denetimin kalitesini gözden geçiren kişinin (bundan sonra kaliteyi gözden
      geçiren kişi olarak kullanılacaktır) atanması ve liyakati ile (b) Denetimin kalitesinin gözden geçirilmesi (bundan sonra
      kalitenin gözden geçirilmesi olarak kullanılacaktır) ve belgelendirilmesinde kaliteyi gözden geçiren kişinin sorumluluklarını
