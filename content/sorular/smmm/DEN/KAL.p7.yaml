      \ eksikliklerin niteliğini ve olası ciddiyetini dikkate\n            alır. (Bkz.: A165–A169 paragrafları)\n      (b)\
      \   Tespit edilen eksikliklerin kalite yönetim sistemi üzerindeki etkisinin -tek başına ve\n            toplu hâlde-\
      \ değerlendirilmesi.\nTespit Edilen Eksikliklere Karşılık Verilmesi\n42.…"
