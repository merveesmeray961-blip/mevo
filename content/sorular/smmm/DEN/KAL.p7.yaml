- id: SMMM-DEN-KAL-0007
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: uygulama
  zorluk: 3
  kok: Bir denetim şirketinin izleme sürecinde bir eksiklik tespit edilmiştir. Şirket, eksikliğin nedenini araştırmadan
    bütün personele aynı genel eğitimi vermeyi planlamaktadır. KYS 1'e göre aşağıdakilerden hangisi uygun yaklaşımdır?
  secenekler:
    A: Kök nedenler araştırılmalı, analize karşılık veren düzeltici adımlar tasarlanıp uygulanmalıdır.
    B: Eksikliğin bulunduğu denetim dosyası yeniden incelenerek düzeltilmeli ve süreç kapatılmalıdır.
    C: Planlanan genel eğitim verilmeli, etkisi bir sonraki izleme döngüsünde ölçülmelidir.
    D: Eksiklik kayda alınmalı, kök neden analizi dış teftiş sonuçlarına göre yapılmalıdır.
    E: KAYİK denetimlerinde kök neden araştırılmalı, diğerlerinde genel eğitim uygulanmalıdır.
  dogru: A
  aciklama:
    dogru_neden: 'KYS 1, tespit edilen eksikliklerin kök neden veya nedenlerinin araştırılmasını ve ardından kök
      neden analizinin sonuçlarına karşılık veren düzeltici adımların tasarlanıp uygulanmasını öngörür. Bu nedenle
      neden araştırılmadan aynı genel eğitimin otomatik olarak uygulanması, kaynakta öngörülen risk ve kök neden
      temelli yaklaşımı karşılamaz. Püf noktaları: Eksikliğin kendisi ile eksikliğin kök nedeni aynı şey değildir;
      düzeltici adım kök neden analizinin sonucuna karşılık vermelidir.'
    celdiriciler:
      B: Dosyanın düzeltilmesi kök nedeni gidermez; KYS 1 kök neden analizini gerektirir.
