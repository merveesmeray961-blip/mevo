    celdiriciler:
      A: Hüküm uygun adımların denetim sırasında atılmasını öngörür; görmezden gelme seçeneği yoktur.
      B: Hüküm denetim şirketindeki diğer kişilerle istişareyi gerektirir.
      D: Etik uyum bir sonraki döneme ertelenecek bir konu olarak düzenlenmemiştir.
      E: Hüküm doğrudan etik hükümlerin yerine getirilmemesi durumuna ilişkindir; yalnızca finansal yanlışlık incelemesi değildir.
