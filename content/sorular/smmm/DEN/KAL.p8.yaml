  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: BDS 220
  tip: bilgi
  zorluk: 1
  kok: Denetim standartlarına göre “kalitenin gözden geçirilmesi” aşağıdakilerden hangisini ifade eder?
  secenekler:
    A: Ekibin önemli muhakemelerinin ve sonuçlarının atanmış kişice tarafsız değerlendirilmesi
    B: Sorumlu denetçinin, ekip üyelerinin çalışma kâğıtlarını rapordan önce imzalaması
    C: Denetim şirketinin izleme kapsamında tamamlanmış dosyaları incelemesi
    D: Kurumun denetim dosyaları üzerinde kalite güvence incelemesi yapması
    E: Dış uzmanın denetim ekibinin tüm çalışmalarını onaylaması
  dogru: A
  aciklama:
    dogru_neden: BDS 220 md. 12, kalitenin gözden geçirilmesini, kaliteyi gözden geçiren kişinin denetim ekibi tarafından
      yapılan önemli muhakemeleri ve bu kapsamda ulaşılan sonuçları tarafsız biçimde değerlendirmesi olarak tanımlar.
    celdiriciler:
      B: Sorumlu denetçinin gözden geçirmesi ekip içi bir süreçtir; kalitenin gözden geçirilmesi ekip dışından atanan
        kişice yapılır.
      C: Tamamlanmış dosyaların incelenmesi izleme faaliyetidir.
      D: Kurumun incelemesi kalite güvence sistemine aittir.
      E: Dış uzmanlar denetimde uzman görüşü sağlar; kalite gözden geçirmesi yapmaz.
  kaynaklar:
  - mevzuat: BDS 220
    madde: md. 12
    alinti: "Kalitenin gözden geçirilmesi: Kaliteyi gözden geçiren kişinin, denetim ekibi tarafından\n         \
      \       yapılan önemli muhakemeler ve bu kapsamda ulaşılan sonuçları tarafsız bir şekilde\n              \
      \  değerlendirmesidir. Kalitenin gözden geçirilmesi, rapor tarihinde veya öncesinde\n                tamamlanır."
