      dikkatine geldiğinde, denetim şirketindeki diğer kişilerle istişare ederek uygun adımları atmasını öngörür.
    celdiriciler:
      B: Etik hükümlere uyumsuzluk öncelikle denetim şirketi içinde ele alınır; yönetimin açıklaması ilk adım değildir.
      C: Durum içinde bulunulan denetimi etkiler; sonraki döneme bırakılamaz.
      D: Rapor tamamlanmadan önce uygun adımlar belirlenmelidir.
      E: Sorun etik hükümlere uyumla ilgilidir; finansal tablo yanlışlığı incelemesi ilk adım değildir.
