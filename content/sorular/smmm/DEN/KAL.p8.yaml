- id: SMMM-DEN-KAL-0014
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 2
  tip: uygulama
  zorluk: 3
  kok: Bir denetim şirketi, kaliteyi gözden geçirecek kişiyi aynı denetim ekibinin bir üyesi olarak görevlendirmeyi
    planlamaktadır. Kişi ayrıca yeterli zaman, yetkinlik ve uygun yetkiye sahiptir. Kalite yönetimine ilişkin ikinci
    standarda göre bu plan bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kaliteyi gözden geçiren kişinin denetim ekibinin bir üyesi olmaması, liyakat kıstasları arasında yer almalıdır.
    B: Kişinin yeterli zamana ve yetkinliğe sahip olması, denetim ekibinin üyesi olarak görevlendirilmesine engel
      oluşturmaz.
    C: Kişi ekibin üyesi olabilir; ancak sorumlu denetçiden daha kıdemli olması bu görevlendirme için yeterlidir.
    D: Kişi ekibin üyesi olabilir; ancak denetimle ilgili önemli muhakemelere ilişkin kararlara katılmaması gerekir.
    E: Ekip üyeliği, kişinin etik hükümlere uyması ve Kurumun izni alınması hâlinde engel oluşturmaz.
  dogru: A
  aciklama:
    dogru_neden: Standardın 18. paragrafı, denetim şirketinin kaliteyi gözden geçiren kişinin liyakat kıstaslarını
      belirlemesini ve bu kıstaslar arasında kişinin denetim ekibinin bir üyesi olmamasının, ayrıca yeterli zaman
      dahil yetkinlik, kabiliyet ve uygun yetkiye sahip olmasının ve etik hükümlere uymasının yer almasını öngörür.
      Yetkinlik ve yeterli zaman, ekip üyesi olmama şartının yerine geçmez.
    celdiriciler:
      B: Yeterli zaman ve yetkinlik ayrı şartlardır; ekip üyesi olmama şartını ortadan kaldırmaz.
      C: Hükümde kıdem ölçütü yoktur; kıdem, ekip üyesi olmama şartının yerine geçmez.
      D: Kıstaslar kişinin ekip üyesi olmamasını ister; ekip üyesi olup karara katılmamak bu şartı karşılamaz.
      E: Hüküm Kurum iznine bağlanmamıştır; kıstasları denetim şirketinin politika veya prosedürleri belirler ve
        etik hükümlere uyum ayrı bir kıstastır.
