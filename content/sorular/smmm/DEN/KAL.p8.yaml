- id: SMMM-DEN-KAL-0010
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: uygulama
  zorluk: 2
  kok: Bir denetim şirketinde kalite yönetim sisteminin risk değerlendirme süreci kurulmamıştır. Yönetim, yalnızca
    mevcut kalite hedeflerini yazılı hâle getirmenin yeterli olduğunu düşünmektedir. KYS 1'e göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Kalite risklerinin belirlenmesi ve değerlendirilmesi yalnız dış teftişten sonra yapılır.
    B: Kalite yönetim sistemi yalnız rapor yayımlandığında değerlendirilir.
    C: Mevcut kalite hedeflerini yazmak yeterlidir; kalite riskleri için ayrıca süreç kurulması gerekmez.
    D: Denetim şirketi kalite risklerini belirlemese de denetim ekibinin mesleki şüpheciliği bu yükümlülüğün yerine
      geçer.
    E: Denetim şirketi kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve değerlendirmek ve bu risklere
      karşı yapılacak işleri tasarlayıp uygulamak üzere bir risk değerlendirme süreci tasarlamalı ve uygulamalıdır.
  dogru: E
  aciklama:
    dogru_neden: KYS 1 md. 23, denetim şirketinin kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve
      değerlendirmek ve kalite risklerine karşı yapılacak işleri tasarlayıp uygulamak üzere bir risk değerlendirme
      süreci tasarlayıp uygulamasını zorunlu kılar. Md. 19 ise kalite yönetim sisteminin tasarlanması, uygulanması
      ve işleyişinin sağlanmasını düzenler.
    celdiriciler:
      A: KYS 1 md. 23 risk değerlendirme sürecini dış teftiş sonrasına bağlamaz; şirketin süreci tasarlayıp uygulamasını
        ister.
      B: KYS 1 md. 19 ve 23 kalite yönetim sisteminin sürekli tasarlanması ve risk değerlendirme sürecinin kurulmasını
        düzenler; yalnız rapor sonu incelemesi yeterli değildir.
      C: KYS 1 md. 23 kalite hedeflerinin yanında kalite risklerinin belirlenmesi ve değerlendirilmesini ayrıca
        öngörür.
      D: KYS 1 md. 23'teki risk değerlendirme süreci, kalite risklerine karşı yapılacak işlerin tasarlanmasını da
        kapsar; mesleki şüphecilik bu sürecin yerine geçmez.
  kaynaklar:
  - mevzuat: KYS 1
    madde: md. 19
    alinti: "Denetim şirketi; kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve değerlendirmek,\n \
      \     kalite risklerine karşı yapılacak işleri tasarlamak ve uygulamak üzere bir risk değerlendirme\n    \
      \  süreci tasarlar ve uygular. (Bkz.: A39–A41 paragrafları)"
