- id: SMMM-DEN-KAL-0012
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: BDS 220
  tip: uygulama
  zorluk: 2
  kok: Bir bağımsız denetimde sorumlu denetçinin liderliğindeki denetim ekibi, denetim şirketinin kalite yönetim
    sistemi kapsamında belirli sorumluluklar üstlenmektedir. Denetimde kalite yönetimine ilişkin standarda göre
    aşağıdakilerden hangisi denetim ekibinin sorumluluklarından biridir?
  secenekler:
    A: Şirketin politika veya prosedürleri dışında, denetim düzeyindeki risklere karşı ek işlerin gerekli olup olmadığına
      karar vermek
    B: Kalite yönetim sisteminin tasarımına ilişkin kalite hedeflerini ve kalite risklerini denetim şirketi düzeyinde
      belirlemek
    C: Kalite yönetim sisteminin işleyişine ilişkin yıllık değerlendirmeyi yaparak sistemin amaçlarına ulaştığı
      sonucuna varmak
    D: Denetim şirketinin kaynak ihtiyaçlarını karşılamak üzere şirket genelinde personel ve teknolojik kaynak ataması
      yapmak
    E: Denetim şirketinin müşteri ilişkisini kabul ve devam ettirmeye ilişkin politikalarını şirket adına yürürlüğe
      koymak
  dogru: A
  aciklama:
    dogru_neden: Standardın 4. paragrafı, denetim ekibinin şirketin politika veya prosedürlerini uygulamasını, denetimin
      niteliği ve şartlarını dikkate alarak denetim düzeyindeki risklere karşı şirketin politikalarının dışında
      ek işler tasarlanıp uygulanması gerekip gerekmediğine karar vermesini ve gerekli bilgileri şirkete bildirmesini
      ekibin sorumlulukları arasında sayar.
    celdiriciler:
      B: Kalite hedeflerinin ve kalite risklerinin belirlenmesi denetim şirketinin kalite yönetim sistemini tasarlama
        sorumluluğudur; denetim ekibi bu işi şirket adına yapmaz.
      C: Kalite yönetim sisteminin yıllık değerlendirilmesi ve sonuca varılması denetim şirketinin üst yönetiminin
        sorumluluğundadır; denetim ekibinin 4. paragraftaki sorumlulukları arasında yer almaz.
      D: Şirket genelindeki kaynakların tahsisi kalite yönetim sisteminin kaynaklar unsuruna ilişkin şirket düzeyindeki
        bir iştir; denetim ekibinin sorumluluğu değildir.
      E: Müşteri ilişkisinin kabulüne ve devamına ilişkin politikalar şirket düzeyinde belirlenir; denetim ekibi
        bu politikaları uygulamakla yükümlüdür, yürürlüğe koymakla değil.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 220 Finansal Tabloların Bağımsız Denetiminde Kalite Yönetimi
