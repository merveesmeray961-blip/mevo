  kok: Sorumlu denetçi, denetim sırasında geçerli etik hükümlerin yerine getirilmediğini gösteren bir durumun kalite yönetim
    sistemi aracılığıyla dikkatine sunulduğunu öğrenmiştir. BDS 220'ye göre sorumlu denetçinin uygun ilk adımı aşağıdakilerden
    hangisidir?
  secenekler:
    A: Durumu göz ardı ederek yalnızca denetim raporunun tamamlanmasını beklemek.
    B: Denetim ekibinden olayı gizlemek ve yalnızca işletme yönetimine bildirmek.
    C: Denetim şirketindeki diğer kişilerle istişare ederek uygun adımları atmak.
    D: Etik hükümleri yalnızca bir sonraki denetim döneminde değerlendirmek.
    E: Durumu yalnızca finansal tablolardaki yanlışlıklar açısından incelemek.
  dogru: C
  aciklama:
    dogru_neden: BDS 220/20, sorumlu denetçinin geçerli etik hükümlerin yerine getirilmediğini gösteren hususlar dikkatine
