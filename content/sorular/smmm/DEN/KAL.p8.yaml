    alinti: "Kalitenin gözden geçirilmesi: Kaliteyi gözden geçiren kişinin, denetim ekibi tarafından\n         \
      \       yapılan önemli muhakemeler ve bu kapsamda ulaşılan sonuçları tarafsız bir şekilde\n              \
      \  değerlendirmesidir. Kalitenin gözden geçirilmesi, rapor tarihinde veya öncesinde\n                tamamlanır."
