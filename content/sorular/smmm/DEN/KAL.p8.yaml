    olarak ele almak yerine, aralarındaki bağlantıları dikkate alan bir yaklaşım benimsemektedir. Kalite yönetimine
    ilişkin standarda göre bu yaklaşım aşağıdakilerden hangisidir?
  secenekler:
    A: Risk esaslı yaklaşım
    B: Süreç esaslı yaklaşım
    C: Kontrol esaslı yaklaşım
    D: Uyum esaslı yaklaşım
    E: Sonuç esaslı yaklaşım
