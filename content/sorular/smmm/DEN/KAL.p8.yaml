- id: SMMM-DEN-KAL-0015
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: Bağımsız Denetçiler için Etik Kurallar
  tip: uygulama
  zorluk: 3
  kok: 'Bir denetçi, denetim sırasında iki farklı durumla karşılaşmaktadır: (i) kişisel bir ilişkinin denetçinin
    görüşünü etkileyebilecek bir tesir oluşturması ve (ii) denetçi dışarıdan tarafsız davranıyor görünse de makul
    ve bilgi sahibi üçüncü kişilerde dürüstlük, tarafsızlık veya mesleki şüphecilikten ödün verildiği izlenimi doğurabilecek
    bir durumun bulunması. Bağımsız Denetçiler İçin Etik Kurallar''a göre bu iki durum sırasıyla hangi bağımsızlık
    unsurlarıyla ilgilidir?'
  secenekler:
    A: İlk durum şekilde bağımsızlık, ikinci durum esasta bağımsızlıktır.
    B: İlk durum yalnız sır saklama, ikinci durum mesleğe uygun davranış ilkesiyle ilgilidir.
    C: Her iki durum da yalnız tarafsızlık temel ilkesinin ihlalidir; bağımsızlığın ayrı unsurları yoktur.
    D: İlk durum yalnız kalite yönetimi, ikinci durum yalnız ücret tehdidi olarak değerlendirilir.
    E: İlk durum esasta bağımsızlık, ikinci durum şekilde bağımsızlıktır.
  dogru: E
  aciklama:
    dogru_neden: 'Etik Kurallar 120.15 U1''e göre esasta bağımsızlık, denetçinin mesleki muhakemesini olumsuz etkileyebilecek
      tesirlerden ari olarak görüş veya sonuç açıklamasını; şekilde bağımsızlık ise makul ve bilgi sahibi üçüncü
      kişilerde dürüstlük, tarafsızlık ve mesleki şüphecilikten ödün verildiği intibaını oluşturabilecek durum ve
      davranışlardan sakınmayı ifade eder. Püf noktaları: Birinci durum muhakemeyi etkileyen gerçek tesire, ikinci
      durum ise üçüncü kişinin oluşturabileceği görünüme odaklanır.'
    celdiriciler:
      A: Tanımlar ters verilmiştir; tesirden ari olma esasta, üçüncü kişi nezdindeki görünüm ise şekilde bağımsızlıktır.
      B: Sorudaki iki durum bağımsızlık unsurlarını ifade eder; yalnız sır saklama veya mesleğe uygun davranışa
        indirgenemez.
      C: Etik Kurallar bağımsızlığı esasta ve şekilde olmak üzere iki unsurla açıklar.
      D: Sorudaki unsurlar kalite yönetimi veya ücret tehdidi olarak tanımlanmamıştır; bunlar farklı değerlendirme
        konularıdır.
  kaynaklar:
  - mevzuat: Bağımsız Denetçiler İçin Etik Kurallar
    madde: 120.15 U1(a)
    alinti: "120.15 U1     Bağımsızlık Standartları; denetçilerin bağımsız denetimleri, sınırlı bağımsız\n     \
      \         denetimleri veya diğer güvence denetimlerini yürütürken bağımsız olmalarını\n              zorunlu\
      \ kılar. Bağımsızlık; tarafsızlık ve dürüstlük ilkeleriyle bağlantılıdır.\n              Bağımsızlık aşağıdaki\
      \ unsurlardan oluşur:\n              (a)    Esasta bağımsızlık: Denetçinin dürüstlük, tarafsızlık ve mesleki\
      \ şüphecilik\n                     içinde hareket etmesini teminen, mesleki muhakemesini olumsuz\n       \
      \              etkileyebilecek tesirlerden ari olarak görüş/sonuç açıklamasıdır."
  - mevzuat: Bağımsız Denetçiler İçin Etik Kurallar
    madde: 120.15 U1(b)
    alinti: "(b)    Şekilde bağımsızlık: Denetim şirketinin, denetçinin veya denetim ekibi\n                   \
      \  üyesinin; makul ve bilgi sahibi üçüncü kişilerde, dürüstlük, tarafsızlık ve\n                     mesleki\
      \ şüphecilikten ödün verdiği intibaını oluşturabilecek durum ve\n                     davranışlardan sakınmasıdır."
