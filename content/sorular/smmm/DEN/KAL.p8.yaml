  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: BDS 220
  tip: uygulama
  zorluk: 3
  kok: Sorumlu denetçi, denetim sırasında geçerli etik hükümlerin yerine getirilmediğini gösteren bir durumun kalite
    yönetim sistemi aracılığıyla dikkatine sunulduğunu öğrenmiştir. Denetim standartlarına göre sorumlu denetçinin
    uygun ilk adımı aşağıdakilerden hangisidir?
  secenekler:
    A: Denetim şirketindeki uygun kişilerle istişare ederek gerekli adımları belirlemek
    B: Durumu işletme yönetimine bildirip yönetimin açıklamasını beklemek
    C: Konuyu bir sonraki denetim döneminin planlamasında değerlendirmek
    D: Raporu tamamlayıp durumu yıllık izleme raporuna not etmek
    E: Durumu finansal tablolardaki olası yanlışlıklar açısından incelemek
