    A: Denetim ekibinin üyesi olması yeterlidir; başka şart aranmaz.
    B: Yeterli zamanı olması nedeniyle ekip üyesi olarak atanabilir.
    C: Yalnızca Kurum ayrıca izin verirse ekip üyesi olabilir.
    D: KYS 2, kaliteyi gözden geçiren kişinin denetim ekibinin bir üyesi olmamasını gerektirir.
    E: Kişinin yetkin olması, ekip üyeliği yasağını ortadan kaldırır.
