- id: SMMM-DEN-KAL-0010
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: uygulama
  zorluk: 2
  kok: Bir denetim şirketinde kalite yönetim sisteminin risk değerlendirme süreci kurulmamıştır. Yönetim, yalnızca
    mevcut kalite hedeflerini yazılı hâle getirmenin yeterli olduğunu düşünmektedir. KYS 1'e göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Kalite riskleri dış teftiş bulgularına göre belirlenir; teftişten önce süreç kurulması gerekmez.
    B: Sistem, denetim raporları yayımlandıktan sonra izleme yoluyla değerlendirilir.
    C: Kalite hedeflerinin yazılı hâle getirilmesi yeterlidir; risk süreci ayrıca kurulmaz.
    D: Ekibin mesleki şüpheciliği, kalite risklerini belirleme yükümlülüğünün yerine geçer.
    E: Hedefleri oluşturan, riskleri belirleyip değerlendiren ve yanıt veren bir süreç tasarlanmalıdır.
  dogru: E
  aciklama:
    dogru_neden: KYS 1 md. 23, denetim şirketinin kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve
      değerlendirmek ve kalite risklerine karşı yapılacak işleri tasarlayıp uygulamak üzere bir risk değerlendirme
      süreci tasarlayıp uygulamasını zorunlu kılar. Md. 19 ise kalite yönetim sisteminin tasarlanması, uygulanması
      ve işleyişinin sağlanmasını düzenler.
    celdiriciler:
      A: Risk değerlendirme süreci şirketin kendi sorumluluğundadır; dış teftişe bağlı değildir.
      B: İzleme ayrı bir bileşendir; risk değerlendirme sürecinin yerine geçmez.
      C: Hedeflerin yazılması yetmez; kalite risklerinin belirlenip değerlendirilmesi gerekir.
      D: Mesleki şüphecilik denetim ekibinin tutumudur; şirket düzeyindeki risk sürecinin yerini tutmaz.
  kaynaklar:
  - mevzuat: KYS 1
    madde: md. 19
    alinti: "Denetim şirketi; kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve değerlendirmek,\n \
      \     kalite risklerine karşı yapılacak işleri tasarlamak ve uygulamak üzere bir risk değerlendirme\n    \
      \  süreci tasarlar ve uygular. (Bkz.: A39–A41 paragrafları)"
  - mevzuat: KYS 1
    madde: md. 23
    alinti: "Denetim şirketi; kalite hedeflerini oluşturmak, kalite risklerini belirlemek ve değerlendirmek,\n \
      \     kalite risklerine karşı yapılacak işleri tasarlamak ve uygulamak üzere bir risk değerlendirme\n    \
      \  süreci tasarlar ve uygular."
