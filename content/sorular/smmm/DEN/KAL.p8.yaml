      birbiriyle bağlantılı ve koordineli olacak şekilde risk esaslı bir yaklaşım uygulanmasını gerektirir.
    celdiriciler:
      B: Süreç esaslı yaklaşım, standartta bağlantılı ve koordineli tasarımı ifade eden yaklaşım olarak yer almaz;
        standart risk esaslı yaklaşımı ister.
      C: Kontrol esaslı yaklaşım, standardın kalite yönetim sisteminin tasarımı için öngördüğü yaklaşım değildir;
        hüküm kalite risklerinin belirlenmesine dayanır.
      D: Uyum esaslı yaklaşım, kuralların biçimsel olarak izlenmesine odaklanır; standart ise riskleri dikkate alan
        koordineli bir yaklaşım öngörür.
      E: Sonuç esaslı yaklaşım, standartta unsurların bağlantılı tasarımını anlatan yaklaşım olarak geçmez; sonuçlar
        yalnızca izleme ve düzeltme sürecinin girdisidir.
