  tip: bilgi
  zorluk: 1
  kok: BDS 220'ye göre “kalitenin gözden geçirilmesi” aşağıdakilerden hangisini ifade eder?
  secenekler:
    A: Kaliteyi gözden geçiren kişinin, denetim ekibinin önemli muhakemelerini ve bu kapsamda ulaşılan sonuçları
      tarafsız biçimde değerlendirmesini.
    B: Denetçinin yalnız finansal tablo dipnotlarını yeniden hesaplamasını.
    C: Denetim şirketinin tüm personelinin yıllık performans değerlendirmesini.
    D: Üst yönetimden sorumlu olanların denetim raporunu yeniden yazmasını.
    E: Dış uzmanın denetim ekibinin tüm çalışmalarını onaylamasını.
  dogru: A
  aciklama:
    dogru_neden: BDS 220 md. 12, kalitenin gözden geçirilmesini, kaliteyi gözden geçiren kişinin denetim ekibi tarafından
      yapılan önemli muhakemeleri ve bu kapsamda ulaşılan sonuçları tarafsız biçimde değerlendirmesi olarak tanımlar.
    celdiriciler:
      B: BDS 220 md. 12'deki tanım finansal tablo dipnotlarının yeniden hesaplanmasını değil, önemli muhakeme ve
        sonuçların tarafsız değerlendirilmesini kapsar.
      C: BDS 220 md. 12 kalitenin gözden geçirilmesini personel performans değerlendirmesi olarak tanımlamaz.
      D: BDS 220 md. 12, bu işlevi üst yönetimden sorumlu olanların raporu yeniden yazması olarak tanımlamaz.
      E: BDS 220 md. 12, kaliteyi gözden geçiren kişiyi denetim şirketince atanan kişi olarak tanımlar; dış uzman
        tarafından tüm çalışmanın onaylanmasını şart koşmaz.
  kaynaklar:
  - mevzuat: BDS 220
