  kok: Sorumlu denetçi, denetim sırasında geçerli etik hükümlerin yerine getirilmediğini gösteren bir durumun kalite
    yönetim sistemi aracılığıyla dikkatine sunulduğunu öğrenmiştir. BDS 220'ye göre sorumlu denetçinin uygun ilk
    adımı aşağıdakilerden hangisidir?
  secenekler:
    A: Denetim şirketindeki diğer kişilerle istişare ederek uygun adımları atmak.
    B: Denetim ekibinden olayı gizlemek ve yalnızca işletme yönetimine bildirmek.
