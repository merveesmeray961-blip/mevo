- id: SMMM-DEN-KAL-0013
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 1
  tip: kavrama
  zorluk: 2
  kok: Bir denetim şirketi kalite yönetim sistemini tasarlarken unsurlarını birbirinden bağımsız ve sıralı adımlar
    olarak ele almak yerine, aralarındaki bağlantıları dikkate alan bir yaklaşım benimsemektedir. Kalite yönetimine
    ilişkin standarda göre bu yaklaşım aşağıdakilerden hangisidir?
  secenekler:
    A: Risk esaslı yaklaşım
    B: Süreç esaslı yaklaşım
    C: Kontrol esaslı yaklaşım
    D: Uyum esaslı yaklaşım
    E: Sonuç esaslı yaklaşım
  dogru: A
  aciklama:
    dogru_neden: Standardın 7. paragrafı, kalite yönetim sistemi unsurlarının tasarımı, uygulanması ve işleyişinde
      birbiriyle bağlantılı ve koordineli olacak şekilde risk esaslı bir yaklaşım uygulanmasını gerektirir.
    celdiriciler:
      B: Süreç esaslı yaklaşım, standartta bağlantılı ve koordineli tasarımı ifade eden yaklaşım olarak yer almaz;
        standart risk esaslı yaklaşımı ister.
      C: Kontrol esaslı yaklaşım, standardın kalite yönetim sisteminin tasarımı için öngördüğü yaklaşım değildir;
        hüküm kalite risklerinin belirlenmesine dayanır.
      D: Uyum esaslı yaklaşım, kuralların biçimsel olarak izlenmesine odaklanır; standart ise riskleri dikkate alan
        koordineli bir yaklaşım öngörür.
      E: Sonuç esaslı yaklaşım, standartta unsurların bağlantılı tasarımını anlatan yaklaşım olarak geçmez; sonuçlar
        yalnızca izleme ve düzeltme sürecinin girdisidir.
  kaynaklar:
  - mevzuat: KYS 1
    madde: §7
    alinti: KYS 1, denetim şirketinin, kalite yönetim sistemi unsurlarının tasarımı, uygulanması ve işleyişinde
      birbiriyle bağlantılı ve koordineli olacak şekilde risk esaslı bir yaklaşım uygulamasını gerektirir.
  gecerlilik:
    baslangic: '2023-12-31'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
