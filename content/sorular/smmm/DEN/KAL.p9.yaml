- id: SMMM-DEN-KAL-0021
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: GKGDS
  tip: uygulama
  zorluk: 3
  kok: Bir denetim şirketi, kaliteyi gözden geçiren kişi olarak önceki yıl aynı denetimde sorumlu denetçi olarak
    görev yapmış bir kişiyi, aradan yalnızca bir yıl geçtikten sonra atamıştır. Ayrıca kalite gözden geçirmesi tamamlanmadan
    sorumlu denetçi raporu imzalamaya hazırlanmaktadır. KYS 2’ye göre bu uygulama nasıl değerlendirilmelidir?
  secenekler:
    A: Uygundur; bir yıllık ara verme her durumda yeterlidir ve rapor gözden geçirme tamamlanmadan tarihlenebilir.
    B: Uygundur; önceki sorumlu denetçinin yeniden atanması yalnızca denetim ekibinde yer alması hâlinde yasaktır.
    C: Yalnız raporun imzalanması ertelenmelidir; kaliteyi gözden geçiren kişinin iki yıllık ara verme şartı yoktur.
    D: Uygundur; kalite gözden geçirmesi rapor tarihinden sonra tamamlanabilir.
    E: Uygun değildir; önceki sorumlu denetçi için en az iki yıllık ara verme öngörülür ve kalite gözden geçirmesi
      tamamlanmadan sorumlu denetçi rapora tarih veremez.
  dogru: E
  aciklama:
    dogru_neden: KYS 2 md. 19, önceki sorumlu denetçinin kaliteyi gözden geçiren kişi olmadan önce iki yıllık veya
      etik hükümler gerektiriyorsa daha uzun ara vermesini öngörür. Md. 24 ise gözden geçirmenin tamamlandığına
      dair bildirim alınana kadar rapora tarih verilmemesini düzenler.
    celdiriciler:
      A: Bir yıllık ara verme iki yıllık süreden kısadır; ayrıca rapor tarihlenemez.
      B: Ara verme kuralı yalnız ekip üyeliğiyle sınırlı değildir.
      C: İki yıllık ara verme kuralı açıkça vardır.
