- id: SMMM-DEN-KAL-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Kalite yönetimi ve etik kurallar
  konu: KAL
  kazanim: KYS 2 kaliteyi gözden geçiren kişi
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: KYS 2 "Denetimin Kalitesinin Gözden Geçirilmesi" standardına göre kaliteyi gözden geçiren kişi ve kalitenin
    gözden geçirilmesi ile ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Önceden sorumlu denetçi olarak görev yapmış bir kişi, etik hükümler daha uzun bir süre gerektirmedikçe, bir
      yıllık ara verme süresinden sonra kaliteyi gözden geçiren kişi olarak atanabilir.
    B: Kaliteyi gözden geçiren kişi denetim ekibinin bir üyesi değildir ve denetime ilişkin görüş veya sonuçları
      desteklemek için kanıt toplamasına gerek yoktur.
    C: Kalitenin gözden geçirilmesi rapor tarihinde veya öncesinde tamamlanır.
    D: Sorumlu denetçi, kaliteyi gözden geçiren kişiden gözden geçirmenin tamamlandığına dair bildirim alana kadar
      denetim raporuna tarih vermez.
    E: Liyakatini zedeleyen durumların farkına varan kaliteyi gözden geçiren kişi, gözden geçirmeye başlamışsa gözden
      geçirmeyi durdurur.
  dogru: A
  aciklama:
    dogru_neden: KYS 2 parag. 19'a göre denetim şirketinin politika veya prosedürleri, sorumlu denetçinin kalitenin
      gözden geçirilmesi görevini üstlenmesinden önce iki yıllık veya etik hükümler gerektiriyorsa daha uzun bir
      ara verme süresi belirler. A şıkkında süre bir yıla indirilmiştir; "etik hükümler daha uzun bir süre gerektirmedikçe"
      kısmı aynen korunduğu için ifade inandırıcı görünür. Tuzak, sayısal unsurdaki bu tek değişikliği fark etmeden
      ifadeyi doğru saymaktır.
    celdiriciler:
      B: Parag. 9'a göre kaliteyi gözden geçiren kişi denetim ekibinin üyesi değildir ve görüş veya sonuçları desteklemek
        için kanıt toplamasına gerek yoktur; ifade doğrudur.
      C: Parag. 13'teki tanıma göre kalitenin gözden geçirilmesi rapor tarihinde veya öncesinde tamamlanır; ifade
        doğrudur.
      D: Parag. 24(b)'ye göre sorumlu denetçi, tamamlanma bildirimini alana kadar denetim raporuna tarih vermez;
        ifade doğrudur.
      E: Parag. 23(b)'ye göre gözden geçirmeye başlamış olan kişi liyakatini zedeleyen durumda gözden geçirmeyi
        durdurur; ifade doğrudur.
  kaynaklar:
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: parag. 19
    alinti: Bu tür politika veya prosedürler, sorumlu denetçinin kalitenin gözden geçirilmesi görevini üstlenmesinden
      önce iki yıllık veya etik hükümler gerektiriyorsa daha uzun bir ara verme süresi belirler.
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: parag. 9
    alinti: Kaliteyi gözden geçiren kişi denetim ekibinin bir üyesi değildir. … Kaliteyi gözden geçiren kişinin
      denetime ilişkin görüş veya sonuçları desteklemek için kanıt toplamasına gerek yoktur
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: parag. 13
    alinti: Kalitenin gözden geçirilmesi, rapor tarihinde veya öncesinde tamamlanır.
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: parag. 24(b)
    alinti: (b) 27 nci paragraf uyarınca kaliteyi gözden geçiren kişiden, kalitenin gözden geçirilmesinin tamamlandığına
      dair bildirim alana kadar sorumlu denetçinin denetim raporuna tarih vermemesi
  - mevzuat: KYS 2 Denetimin Kalitesinin Gözden Geçirilmesi
    madde: parag. 23(b)
    alinti: (b) Kaliteyi gözden geçirmeye başlamışsa, kaliteyi gözden geçirmeyi durdurur.
