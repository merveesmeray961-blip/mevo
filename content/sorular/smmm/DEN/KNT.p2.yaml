      belirler.
    B: Tutarsızlığı önemsemeden yazılı beyanı esas alır.
    C: Yazılı beyanı geçersiz sayıp yönetimle hiç görüşmeden tüm denetim kanıtlarını sıfırdan yeniden toplar ve ardından yeni
      bir denetim planı hazırlar.
    D: Yönetimin değerlendirmesini değiştirmeden yalnızca ciroya bakarak sonuca varır.
    E: Beyan mektubunu yönetime iade eder ve denetimi sonlandırır.
