  tip: uygulama
  zorluk: 3
  kok: Yönetimin yazılı beyanı, denetçinin elde ettiği başka denetim kanıtlarıyla tutarsızdır. Denetçi tutarsızlığı çözmek
    için ilave prosedürler uygulamış, ancak sorun çözülememiştir. İşletmenin cirosu 18 milyon TL'dir. BDS 580'e göre denetçi
