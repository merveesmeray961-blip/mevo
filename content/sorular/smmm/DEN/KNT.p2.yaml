  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 500 dış bilgi kaynağı
  tip: kavrama
  zorluk: 2
  kok: BDS 500 Bağımsız Denetim Kanıtı standardına göre aşağıdakilerden hangisi, sağladığı bilgilere ilişkin olarak dış bilgi
    kaynağı şeklinde **kabul edilmez**?
  secenekler:
    A: Finansal tablo tahminlerinde yönetimin faydalandığı uzman sıfatıyla hareket eden aktüerya kuruluşu
    B: Hisse senedi fiyatlarını kamuya duyuran borsa
    C: Resmî fiyat endekslerini yayımlayan kamu kurumu
    D: Geniş kullanıcı kitlesine yönelik sektör raporları ve piyasa araştırmaları yayımlayan bağımsız araştırma şirketi
    E: Kamuya açık kredi derecelendirme notu veren bağımsız kuruluş
  dogru: A
  aciklama:
    dogru_neden: BDS 500 md. 5 uyarınca bilgilerin yönetimin faydalandığı uzman, hizmet kuruluşu veya denetçinin faydalandığı
      uzman sıfatıyla hareket eden bir kişi veya kuruluş tarafından sağlanması durumunda, bu kişi veya kuruluş söz konusu
      bilgilere ilişkin olarak dış bilgi kaynağı sayılmaz.
    celdiriciler:
      B: Borsa, geniş kullanıcı kitlesinin kullanımına uygun bilgi sağlayan işletme dışı bir kuruluştur; dış bilgi kaynağıdır.
      C: Kamu kurumunun yayımladığı resmî endeksler geniş kitlenin kullanımına uygundur; kurum dış bilgi kaynağıdır.
      D: Araştırma şirketi, kamuya yönelik rapor sağladığı sürece dış bilgi kaynağı niteliğini taşır.
      E: Kamuya açık derecelendirme notu veren kuruluş, geniş kitleye bilgi sağladığından dış bilgi kaynağıdır.
