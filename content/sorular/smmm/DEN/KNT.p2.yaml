  kok: Bir işletmenin 3.200.000 TL tutarındaki stoklarının fiziki sayımı 20 Aralık'ta yapılmış, finansal tablo tarihi ise
    31 Aralık'tır. Denetçi sayıma katılmış ve sayım prosedürlerini tamamlamıştır. BDS 501'e göre denetçi bu durumda ayrıca
    aşağıdakilerden hangisini yapar?
  secenekler:
    A: Sayım tarihindeki miktarların finansal tablo tarihinde de aynı olduğunu varsayarak ek prosedür uygulamaz.
    B: Sayımı finansal tablo tarihinde yeniden yaptırır ve başka prosedür uygulamaz.
    C: Yalnızca Aralık ayı satış faturalarını inceleyerek sonuçlandırır.
    D: Sayım ile tablo tarihi arasındaki stok değişikliklerinin kaydına ilişkin prosedürler uygular.
    E: Yönetimin yazılı beyanını yeterli kabul ederek ek prosedür uygulamaz.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 501 md. 5 uyarınca fiziki sayımın finansal tablo tarihinden farklı bir tarihte yapılması durumunda denetçi,
      md. 4 uyarınca zorunlu prosedürlere ek olarak, sayım tarihi ile finansal tablo tarihi arasında stoklarda meydana gelen
      değişikliklerin uygun kaydedilip kaydedilmediğine ilişkin kanıt elde etmek için denetim prosedürleri uygular. Püf noktaları:
      Sayım ile tablo tarihi arasında 11 günlük fark vardır; stok tutarı bu kuralı değiştirmez, bu nedenle tutar gereksiz
      veridir. Yönetim beyanı tek başına kanıt yerine geçmez.'
    celdiriciler:
      A: Aradaki dönemde giriş ve çıkışlar olabileceğinden miktarların aynı kalacağı varsayılamaz.
      B: Md. 5 sayımın yeniden yapılmasını değil, aradaki değişikliklere ilişkin prosedürleri ister.
      C: Yalnızca satış faturaları aradaki değişikliklerin tamamını kapsamaz; stok hareketlerinin kaydı değerlendirilmelidir.
      E: Yazılı beyan denetim prosedürlerinin yerine geçmez; md. 5 denetim prosedürleri ister.
