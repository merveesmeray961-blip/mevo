- id: SMMM-DEN-KNT-0039
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 501 sayıma katılamama
  tip: uygulama
  zorluk: 2
  kok: Denetçi, öngörülemeyen bir durum nedeniyle planladığı fiziki stok sayımına katılamamıştır. BDS 501'e göre denetçi aşağıdakilerden
    hangisini yapar?
  secenekler:
    A: Bazı sayımları başka bir tarihte yapar veya gözlemler ve önceki sayımla arasındaki işlemlere prosedür uygular.
    B: Sayıma katılım şartı kalktığı için stokları yalnızca yönetimin beyanına ve kayıtlarına dayanarak kabul eder ve ek prosedür
      uygulamaz.
    C: Doğrudan olumsuz görüş verir.
    D: Stokları denetim kapsamı dışında bırakır ve yalnızca Diğer Hususlar paragrafı ekler.
    E: Sayımın yönetim tarafından tek başına tekrarlanmasını yeterli sayar.
  dogru: A
  aciklama:
    dogru_neden: BDS 501 md. 6 uyarınca öngörülemeyen durumlardan dolayı fiziki stok sayımına katılamaması durumunda denetçi,
      bazı fiziki sayımları başka bir tarihte yapar veya gözlemler ve daha önceki sayım ile bu sayım arasında gerçekleşen
      işlemlere denetim prosedürlerini uygular.
    celdiriciler:
