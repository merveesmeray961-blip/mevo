    madde: md. 8
    alinti: 'Uzmanın yetkinliğini, kabiliyetini ve tarafsızlığını değerlendirir (Bkz.: A48-A54 paragrafları), Uzmanın çalışması
      hakkında kanaat edinir (Bkz.: A55-A58 paragrafları) ve İlgili yönetim beyanına ilişkin bir denetim kanıtı olarak kullanımı
      konusunda uzman çalışmasının uygunluğunu değerlendirir'
