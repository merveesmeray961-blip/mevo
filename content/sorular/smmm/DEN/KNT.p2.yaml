  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 500 yönetimin faydalandığı uzman
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin finansal tablolarındaki bir tutar, yönetimin faydalandığı bir uzmanın çalışması kullanılarak hazırlanmıştır.
    BDS 500'e göre denetçinin bu uzman çalışmasıyla ilgili yapacağı işlemler arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Uzmanın yetkinliğini, kabiliyetini ve tarafsızlığını değerlendirmek
    B: Uzmanın çalışması hakkında kanaat edinmek
    C: Uzmanın çalışmasını baştan sona kendi uzmanlığıyla yeniden gerçekleştirerek doğrulamak
    D: Uzman çalışmasının ilgili yönetim beyanına ilişkin kanıt olarak uygunluğunu değerlendirmek
    E: Gerekli olduğu ölçüde, uzmanın çalışmasının denetçinin amaçları açısından önemini dikkate almak
  dogru: C
  aciklama:
    dogru_neden: BDS 500 md. 8 uyarınca denetçi, gerektiği ölçüde uzmanın yetkinliğini, kabiliyetini ve tarafsızlığını değerlendirir,
      çalışması hakkında kanaat edinir ve çalışmasının uygunluğunu değerlendirir. Çalışmanın baştan sona yeniden yapılması
      standartta öngörülmemiştir.
    celdiriciler:
      A: Bu işlem md. 8(a)'da sayılmıştır.
      B: Bu işlem md. 8(b)'de sayılmıştır.
      D: Bu işlem md. 8(c)'de sayılmıştır.
      E: Md. 8, denetçinin çalışmanın önemini de dikkate almasını öngörür; bu işlem standartta vardır.
