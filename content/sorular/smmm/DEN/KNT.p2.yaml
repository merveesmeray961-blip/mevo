- id: SMMM-DEN-KNT-0062
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 580 talep edilen beyanların sunulmaması
  tip: uygulama
  zorluk: 3
  kok: Yönetim, denetçinin talep ettiği yazılı beyanlardan birini sunmamıştır. Denetçi, yönetimin dürüstlüğüne ilişkin yeterli
    şüphe bulunduğu sonucuna varmamıştır. BDS 580'e göre denetçi ilk aşamada aşağıdakilerden hangisini yapar?
  secenekler:
    A: Beyan sunulmadığı için başka hiçbir değerlendirme yapmadan doğrudan görüş vermekten kaçınır ve raporu düzenler.
    B: Konuyu yönetimle müzakere eder, dürüstlüğünü yeniden değerlendirir ve görüşe etkisine ilişkin adımları atar.
    C: Beyanın sunulmamasını hiç dikkate almaz, çünkü beyanlar kanıt sayılmaz.
    D: Beyanı kendisi yazarak yönetim adına imzalar.
    E: Beyan yerine yönetimin sözlü beyanını aynen yeterli sayar.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 580 md. 19 uyarınca yönetimin talep edilen yazılı beyanlardan bir veya daha fazlasını sunmaması durumunda
      denetçi konuyu yönetimle müzakere eder, yönetimin dürüstlüğünü yeniden değerlendirir ve BDS 705 uyarınca görüşe etkisini
      belirlemek dâhil uygun adımları atar. Püf noktaları: Görüş vermekten kaçınma (md. 20) ancak dürüstlük konusunda yeterli
      şüphe varsa veya md. 10-11 beyanları sunulmuyorsa söz konusudur; her eksik beyan doğrudan kaçınma gerektirmez.'
    celdiriciler:
      A: Doğrudan kaçınma md. 20'nin özel koşullarına bağlıdır; her eksik beyan bunu gerektirmez.
      C: Yazılı beyanlar denetim kanıtı niteliğindedir (md. 4); dikkate alınmaması yanlıştır.
      D: Beyanı yazıp imzalamak yönetimin sorumluluğudur.
      E: Sözlü beyan, talep edilen yazılı beyanın yerine geçmez.
  kaynaklar:
  - mevzuat: BDS 580 Yazılı Açıklamalar
    madde: md. 19
