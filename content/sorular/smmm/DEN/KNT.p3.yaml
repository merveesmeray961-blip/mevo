- id: SMMM-DEN-KNT-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 505 olumsuz teyit taleplerinin tek başına maddi doğrulama prosedürü olarak kullanılma koşulları
  tip: uygulama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: (D) AŞ'nin denetiminde denetçi, ticari alacakların varlığına ilişkin yönetim beyanı düzeyinde değerlendirilmiş "önemli
    yanlışlık" risklerini ele almak üzere, dış teyit prosedürü olarak yalnızca olumsuz teyit talepleri göndermeyi planlamaktadır.
    BDS 505 "Dış Teyitler" standardına göre, denetçinin olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak
    kullanabilmesi için aranan koşullardan biri aşağıdakilerden hangisi **değildir**?
  secenekler:
    A: Denetçinin "önemli yanlışlık" riskini düşük olarak değerlendirmiş ve yönetim beyanıyla ilgili kontrollerin işleyiş
      etkinliğine ilişkin yeterli ve uygun denetim kanıtı elde etmiş olması
    B: Olumsuz teyit prosedürüne konu olan kalemlerin yer aldığı anakitlenin çok sayıda küçük ve aynı türden hesap bakiyesinden
      oluşması
    C: Beklenen istisna oranının düşük olması
    D: Anakitlenin az sayıda ancak yüksek tutarlı hesap bakiyesinden oluşması ve bu bakiyelerin her birinin önemli olması
    E: Olumsuz teyit taleplerini alan kişilerin bu talepleri göz ardı etmesine sebep olacak durum veya şartlardan denetçinin
      haberdar olmaması
  dogru: D
  aciklama:
    dogru_neden: 'BDS 505 par. 15''e göre olumsuz teyitler olumlu teyitlere kıyasla daha az ikna edici kanıt sağlar; bu nedenle
      dört koşulun tümü birlikte mevcut olmadıkça olumsuz teyit talepleri tek başına maddi doğrulama prosedürü olarak kullanılamaz:
      (1) önemli yanlışlık riskinin düşük değerlendirilmesi ve kontrollerin etkinliğine ilişkin yeterli kanıt elde edilmesi,
      (2) anakitlenin çok sayıda küçük ve aynı türden kalemden oluşması, (3) beklenen istisna oranının düşük olması, (4) teyit
      taleplerini alanların bu talepleri göz ardı etmesine yol açacak durumlardan denetçinin haberdar olmaması. Az sayıda
      ancak yüksek tutarlı bakiyelerden oluşan anakitle, (2) numaralı koşulun tersidir; standartta aranan koşullar arasında
      yer almaz.'
    celdiriciler:
      A: 'Par. 15''in birinci koşuludur: önemli yanlışlık riski düşük değerlendirilmeli ve kontrollerin işleyiş etkinliğine
        ilişkin yeterli ve uygun kanıt elde edilmelidir.'
      B: 'Par. 15''in ikinci koşuludur: anakitle çok sayıda küçük ve aynı türden kalemden oluşmalıdır; D şıkkındaki durum
        bunun tersidir.'
      C: 'Par. 15''in üçüncü koşuludur: beklenen istisna oranının düşük olması gerekir.'
      E: 'Par. 15''in dördüncü koşuludur: teyit taleplerini alanların talepleri göz ardı etmesine sebep olacak durumlardan
        denetçinin haberdar olmaması gerekir.'
  kaynaklar:
  - mevzuat: TDS BDS 505 Dış Teyitler
    madde: par. 15 (giriş)
    alinti: Olumsuz teyitler, olumlu teyitlere göre daha az ikna edici denetim kanıtı sağlar. Dolayısıyla aşağıdaki durumların
      tümü mevcut olmadıkça, denetçi, yönetim beyanı düzeyinde değerlendirilmiş “önemli yanlışlık” risklerini ele almak üzere,
      olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanamaz
  - mevzuat: TDS BDS 505 Dış Teyitler
    madde: par. 15 (koşullar)
    alinti: Denetçinin “önemli yanlışlık” riskini düşük olarak değerlendirmiş ve yönetim beyanıyla ilgili kontrollerin işleyiş
      etkinliğine ilişkin yeterli ve uygun denetim kanıtı elde etmiş olması, Olumsuz teyit prosedürlerine konu olan kalemlerin
      yer aldığı anakitlenin çok sayıda küçük ve aynı türden hesap bakiyesi, işlem veya diğer kalemlerden oluşması, Beklenen
      istisna oranının düşük olması, Olumsuz teyit taleplerini alan kişilerin bu talepleri göz ardı etmesine sebep olacak
      durum veya şartlardan denetçinin haberdar olmaması.
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: D (güven 5) BDS 505 p.15: olumsuz teyit için anakitlenin çok sayıda küçük, aynı türden bakiyeden
          oluşması gerekir; az sayıda yüksek tutarlı bakiye koşul değil (D koşul olmadığı için doğru cevap).'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok (anahtar D): BDS 505 par. 15''teki dört koşul A, B, C, E''de yer alıyor; D (az sayıda yüksek tutarlı
          bakiye) ikinci koşulun tersi, standartta yok.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Alıntılar BDS 505 par. 15 ile birebir (madde imleri virgülle birleştirilmiş); açıklamadaki iddiaların tümü par.
          15'te karşılığını buluyor.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (D, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-DEN-KNT-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 520 analitik prosedürlerin tanımı ve BDS 500 denetim prosedürleri
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: BDS 520 "Analitik Prosedürler" standardına göre, finansal ve finansal olmayan veriler arasındaki anlamlı ilişkilerin
    analiz edilmesi yoluyla finansal bilgilerin değerlendirilmesini ifade eden denetim prosedürü aşağıdakilerden hangisidir?
  secenekler:
    A: Analitik prosedürler
    B: Dış teyit
    C: Yeniden hesaplama
    D: Gözlem
    E: Yeniden uygulama
  dogru: A
  aciklama:
    dogru_neden: BDS 520 par. 4 (BDS 500 A25 ile uyumlu), "analitik prosedürler" terimini finansal ve finansal olmayan veriler
      arasındaki anlamlı ilişkilerin analiz edilmesi yoluyla finansal bilgilerin değerlendirilmesi olarak tanımlar. Bu kapsamda
      beklenen değerlerden ciddi ölçüde farklı veya diğer bilgilerle tutarsız dalgalanma ve ilişkilerin gerektiğinde araştırılması
      da yer alır.
    celdiriciler:
      B: Dış teyit, üçüncü bir tarafın doğrudan denetçiye verdiği yazılı yanıttan elde edilen denetim kanıtıdır (BDS 500 A22).
      C: Yeniden hesaplama, belge veya kayıtların matematiksel doğruluğunun kontrolüdür (BDS 500 A23).
      D: Gözlem, başkaları tarafından uygulanan bir süreç veya prosedürün izlenmesidir (BDS 500 A21).
      E: Yeniden uygulama, işletmenin iç kontrolünün parçası olarak uygulanmış prosedür veya kontrollerin denetçi tarafından
        bağımsız biçimde yürütülmesidir (BDS 500 A24).
  kaynaklar:
  - mevzuat: TDS BDS 520 Analitik Prosedürler
    madde: par. 4
    alinti: BDS’lerin amaçlarına uygun olarak, “analitik prosedürler” terimi, finansal ve finansal olmayan veriler arasındaki
      anlamlı ilişkilerin analiz edilmesi yoluyla, finansal bilgilerin değerlendirilmesini ifade eder.
  - mevzuat: TDS BDS 500 Bağımsız Denetim Kanıtları
    madde: A22 (dış teyit)
    alinti: Dış teyit, üçüncü bir tarafın (teyit eden taraf) doğrudan denetçiye basılı, elektronik ortamda ya da başka bir
      depolama ortamında verdiği yazılı yanıttan elde edilen denetim kanıtını ifade eder.
  - mevzuat: TDS BDS 500 Bağımsız Denetim Kanıtları
    madde: A21 (gözlem)
    alinti: Gözlem, başkaları tarafından uygulanan bir süreç veya prosedürün izlenmesidir
  - mevzuat: TDS BDS 500 Bağımsız Denetim Kanıtları
    madde: A23 (yeniden hesaplama)
    alinti: Yeniden hesaplama, belge veya kayıtların matematiksel doğruluğunun kontrolüdür.
  - mevzuat: TDS BDS 500 Bağımsız Denetim Kanıtları
    madde: A24 (yeniden uygulama)
    alinti: Yeniden uygulama, aslen işletmenin iç kontrolünün bir parçası olarak uygulanmış olan prosedür veya kontrollerin,
      denetçi tarafından bağımsız bir şekilde yürütülmesidir.
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: A (güven 5) BDS 520 p.4: analitik prosedürler tanımı.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok (anahtar A): tanım BDS 520 par. 4 ve BDS 500 A25 ile birebir; B, C, D, E BDS 500 A21-A24''teki farklı
          prosedürler.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Alıntılar BDS 520 par. 4 ve BDS 500 A21-A24 ile birebir; paragraf numaraları doğru.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (A, güven 5)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
  gecmis:
  - tarih: '2026-10-09'
    kim: hakem
    ne: 'durum: kontrolde → geri_cekildi (tam banka hakem denetimi).'
    neden: 'Kök ''BDS 520 Analitik Prosedürler'' diyerek cevabı veriyor; ölçücülüğü yok.'
