- id: SMMM-DEN-KNT-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '520'
  tip: kavrama
  zorluk: 2
  kok: Analitik prosedürler standardına göre analitik prosedürlerin sonuçlarının araştırılmasına ilişkin aşağıdaki
    ifadelerden hangisi doğrudur?
  secenekler:
    A: Ciddi sapma veya tutarsızlık gösteren dalgalanmalar, yönetimin sorgulanması ve yanıtlarına ilişkin kanıt
      elde edilmesiyle araştırılır.
    B: Beklenen değerden sapan dalgalanmalar, yönetimin yazılı beyanı alındıktan sonra ek bir prosedür uygulanmadan
      kabul edilir.
    C: Sapmalar, yönetimin açıklaması makul görünüyorsa kanıtla desteklenmeden denetim dosyasına kaydedilir.
    D: Yönetimin sorgulanması sonucunda alınan sözlü yanıtlar kanıt olarak kabul edilerek araştırma tamamlanır.
    E: Araştırma, yönetime soru sorulmadan doğrudan detay testi örnekleminin genişletilmesiyle yapılır.
  dogru: A
  aciklama:
    dogru_neden: Standardın 7. paragrafı, analitik prosedürler sonucunda beklenen değerlerden ciddi ölçüde farklılık
      gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların belirlenmesi durumunda denetçinin
      yönetimi sorgulamasını ve yönetimin yanıtlarıyla ilgili uygun denetim kanıtı elde etmesini, gerekirse diğer
      prosedürleri uygulamasını öngörür.
    celdiriciler:
      B: Yazılı beyan, ciddi sapmanın araştırılması için yeterli değildir; yanıtlara ilişkin uygun denetim kanıtı
        da elde edilir.
      C: Yönetimin açıklamasının makul görünmesi araştırmayı tamamlamaz; yanıtlara ilişkin kanıt elde edilmesi gerekir.
      D: Sözlü yanıt tek başına kanıt değildir; standart yanıtlarla ilgili uygun denetim kanıtı elde edilmesini
        ister.
      E: Standart önce yönetimin sorgulanmasını ve gerekli olan diğer prosedürlerin uygulanmasını öngörür; sorgulama
        atlanamaz.
  kaynaklar:
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 7
    alinti: 'Bu BDS uyarınca uygulanan analitik prosedürler sonucunda beklenen değerlerden ciddi ölçüde farklılık
      gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların veya ilişkilerin belirlenmesi durumunda,
      denetçi aşağıda belirtilen işlemleri gerçekleştirerek bu farklılıkları araştırır: Yönetimin sorgulanması ve
      yönetimin verdiği yanıtlarla ilgili uygun denetim kanıtlarının elde edilmesi...'
