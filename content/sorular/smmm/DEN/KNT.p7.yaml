  kok: BDS 520’ye göre analitik prosedürlerin sonuçlarının araştırılmasına ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Beklenen değerlerden ciddi ölçüde farklılık gösteren dalgalanmalar araştırılmaz.
    B: Beklenen değerlerden ciddi ölçüde farklılık gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların
      belirlenmesi durumunda denetçi, yönetimin sorgulanması ve yönetimin verdiği yanıtlarla ilgili uygun denetim kanıtlarının
      elde edilmesi suretiyle bu farklılıkları araştırır.
    C: Analitik prosedür sonuçları hiçbir zaman detay testleri ile desteklenmez.
    D: Yalnızca olumlu farklılıklar araştırılır.
    E: Araştırma yalnızca denetim sonunda yapılır.
  dogru: B
  aciklama:
    dogru_neden: BDS 520 par. 7’ye göre bu BDS uyarınca uygulanan analitik prosedürler sonucunda beklenen değerlerden ciddi
      ölçüde farklılık gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların veya ilişkilerin belirlenmesi
      durumunda, denetçi yönetimin sorgulanması ve yönetimin verdiği yanıtlarla ilgili uygun denetim kanıtlarının elde edilmesi
      suretiyle bu farklılıkları araştırır.
    celdiriciler:
      A: Ciddi farklılıklar araştırılmak zorundadır.
      C: Gerekirse detay testleri ile desteklenir.
      D: Hem olumlu hem olumsuz ciddi farklılıklar araştırılır.
      E: Araştırma, farklılık belirlendiğinde yapılır.
  kaynaklar:
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 7
    alinti: 'Bu BDS uyarınca uygulanan analitik prosedürler sonucunda beklenen değerlerden ciddi ölçüde farklılık gösteren
      veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların veya ilişkilerin belirlenmesi durumunda, denetçi aşağıda
      belirtilen işlemleri gerçekleştirerek bu farklılıkları araştırır: Yönetimin sorgulanması ve yönetimin verdiği yanıtlarla
      ilgili uygun denetim kanıtlarının elde edilmesi...'
