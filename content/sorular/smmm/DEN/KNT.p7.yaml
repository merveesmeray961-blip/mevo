- id: SMMM-DEN-KNT-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '501'
  tip: kavrama
  zorluk: 2
  kok: Bağımsız denetim kanıtına ilişkin belirli kalemlere yönelik açıklamalar standardına göre stoklara ilişkin
    denetim prosedürleri hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Stokların finansal tablolar açısından önemli olması hâlinde de genel kanıt prosedürleri yeterli sayılır,
      ayrıca bir prosedür gerekmez.
    B: Denetçi stok sayımına katılmak yerine, yönetimin sayım sonuçlarına ilişkin yazılı beyanını almakla yetinebilir.
    C: Stok sayımı finansal tablo tarihinde yapılmamışsa denetçi sayım sonuçlarına dayanarak kanıt elde edemez.
    D: Denetçi, stokların mevcudiyetini üçüncü taraflardan alınacak teyit mektuplarıyla doğrulamakla yükümlüdür.
    E: Stoklar önemliyse denetçi, mümkün olan hâllerde fiziki sayıma katılarak stokların mevcudiyeti ve durumuna
      ilişkin kanıt elde eder.
  dogru: E
  aciklama:
    dogru_neden: Standart, stokların finansal tablolar açısından önemli olması durumunda stokların mevcudiyeti ve
      durumuna ilişkin yeterli ve uygun denetim kanıtı elde edilmesini, bunun için mümkün olan hâllerde fiziki stok
      sayımına katılımı gerektirir.
    celdiriciler:
      A: Önemli stoklar için standart özel prosedür (fiziki sayıma katılım gibi) öngörür; genel prosedürler yeterli
        sayılmaz.
      B: Yönetimin yazılı beyanı, sayıma katılım yoluyla elde edilecek kanıtın yerini almaz.
      C: Sayımın finansal tablo tarihinden farklı bir tarihte yapılması mümkündür; bu durumda tarihler arasındaki
        değişikliklere ilişkin ek prosedürler uygulanır.
      D: Teyit mektubu stoklar için tek yöntem değildir; fiziki gözlem ve sayım temel kanıt kaynağıdır.
  kaynaklar:
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtı – Belirli Kalemler İçin Belirli Açıklamalar
    madde: '4'
    alinti: 'Stokların finansal tablolar açısından önemli olması durumunda denetçi, aşağıdakileri gerçekleştirmek
      suretiyle stokların mevcudiyeti ve durumuna ilişkin yeterli ve uygun denetim kanıtı elde eder: Mümkün olan
      hâllerde, aşağıdakileri gerçekleştirmek için fiziki stok sayımına katılım …'
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
