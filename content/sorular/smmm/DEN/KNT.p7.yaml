        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R4/R5/R6/R7: çeldiriciler yenilendi, mutlak ifadeler kaldırıldı; kökten numara çıkarıldı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
