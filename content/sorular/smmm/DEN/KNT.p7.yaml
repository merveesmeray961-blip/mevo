- id: SMMM-DEN-KNT-0004
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '501'
  tip: kavrama
  zorluk: 2
  kok: BDS 501 “Bağımsız Denetim Kanıtı – Belirli Kalemler İçin Belirli Açıklamalar”a göre stoklara ilişkin denetim prosedürleri
    hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetçi, stokların fiziki sayımına katılmak zorunda değildir; yönetim beyanı yeterlidir.
    B: Stoklar finansal tablolar açısından önemliyse, denetçi stokların fiziki sayımına katılarak yeterliliği ve durumunu
      değerlendirir.
    C: Stok sayımı yalnızca yıl sonunda yapılabilir; ara dönem sayımı geçersizdir.
    D: Denetçi, stokların varlığını yalnızca teyit mektuplarıyla doğrulayabilir.
    E: Stoklar için hiçbir özel prosedür uygulanmaz; genel kanıt prosedürleri yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 501, stoklar önemliyse fiziki sayıma katılımı ve stokların yeterliliği ile durumunun değerlendirilmesini
      gerektirir. Püf noktaları: Fiziki sayıma katılım, stokların varlığı ve durumu için temel kanıttır.'
    celdiriciler:
      A: Önemli stoklarda fiziki sayıma katılım zorunludur.
      C: Sayım zamanlaması esnektir; ara dönem de olabilir.
      D: Teyit tek başına yeterli değildir; fiziki gözlem gerekir.
      E: Stoklar için özel prosedürler vardır.
  kaynaklar:
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtı – Belirli Kalemler İçin Belirli Açıklamalar
    madde: '4'
    alinti: 'Stokların finansal tablolar açısından önemli olması durumunda denetçi, aşağıdakileri gerçekleştirmek suretiyle
      stokların mevcudiyeti ve durumuna ilişkin yeterli ve uygun denetim kanıtı elde eder: Mümkün olan hâllerde, aşağıdakileri
      gerçekleştirmek için fiziki stok sayımına katılım …'
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
