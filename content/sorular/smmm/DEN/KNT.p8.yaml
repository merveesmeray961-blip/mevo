  bolum:
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '501'
  tip: uygulama
  zorluk: 2
  kok: Bir şirketin finansal tabloları açısından önemli tutarda stok, üçüncü bir tarafın emanetinde ve kontrolü altındadır.
    Denetçi stokların mevcudiyeti ve durumuna ilişkin yeterli ve uygun denetim kanıtı elde etmek istemektedir. BDS 501'e göre
    aşağıdakilerden hangisi uygundur?
  secenekler:
