- id: SMMM-DEN-KNT-0008
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '505'
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin ticari alacakları için denetçi dış teyit göndermek istemiş, ancak yönetim teyit talebinin gönderilmesine
    izin vermemiştir. Yönetimin gerekçesi denetçiyi ikna etmemiş ve alternatif prosedürlerle de ihtiyaca uygun ve güvenilir
    kanıt elde edilememiştir. Buna göre denetçinin izlemesi gereken yol aşağıdakilerden hangisidir?
  secenekler:
    A: Yönetimin izin vermemesi yeterli kabul edilir ve başka işlem yapılmadan alacak bakiyesi doğrulanmış sayılır.
    B: Yalnızca olumlu teyit yerine olumsuz teyit gönderilir ve diğer adımlar uygulanmaz.
    C: Teyit talebi yine de yönetim tarafından gönderilir; denetçinin doğrudan kontrolü gerekli değildir.
    D: Denetçi alacak bakiyesini otomatik olarak hileli kabul eder ve görüşünü doğrudan olumsuza çevirir.
    E: Denetçi yönetimin gerekçelerini sorgular ve bunların geçerliliği ile uygunluğu hakkında kanıt elde etmeye çalışır;
      etkileri değerlendirir ve alternatif prosedür uygular. Kanıt elde edilemezse üst yönetimden sorumlu olanlarla iletişim
      kurar ve görüş üzerindeki etkisini değerlendirir.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 505 md. 8, yönetimin izin vermemesi hâlinde gerekçelerin sorgulanmasını, etkilerin değerlendirilmesini
      ve alternatif prosedürlerin uygulanmasını ister. Md. 9, izin vermeme kararı makul bulunmaz veya alternatif prosedürlerle
      ihtiyaca uygun ve güvenilir kanıt elde edilemezse üst yönetimden sorumlu olanlarla iletişim kurulmasını ve BDS 705 uyarınca
      görüş üzerindeki etkinin değerlendirilmesini öngörür. Püf noktaları: Yönetimin engellemesi tek başına alacağın yanlış
      olduğu anlamına gelmez; önce gerekçe, risk etkisi ve alternatif kanıt yolları değerlendirilir, sonuç alınamazsa iletişim
      ve görüş etkisi aşamasına geçilir.'
    celdiriciler:
      A: BDS 505 md. 8 alternatif prosedürleri ve gerekçelerin değerlendirilmesini öngördüğü için teyit engeli doğrudan kabul
        edilmiş sayılmaz.
      B: Yönetimin teyit talebini engellemesi üzerine BDS 505 md. 8'de öngörülen alternatif denetim prosedürleri uygulanabilir;
        olumsuz teyit otomatik bir ikame değildir.
      C: BDS 505 md. 7 dış teyit sürecinde kontrolün denetçide olmasını gerektirir; yönetimin gönderim yapması bu gerekliliği
        karşılamaz.
      D: BDS 505 md. 9, görüş etkisinin değerlendirilmesini öngörür; doğrudan olumsuz görüş verilmesini zorunlu kılmaz.
  kaynaklar:
  - mevzuat: BDS 505
    madde: md. 8
    alinti: "Yönetimin denetçinin teyit talebi göndermesine izin vermemesi durumunda, denetçi:\n                İzin vermeme\
      \ kararıyla ilgili olarak yönetimin gerekçelerine ilişkin sorgulama yapar ve\n                bu gerekçelerin geçerliliği\
      \ ve uygunluğu konusunda denetim kanıtı elde etmeye çalışır\n                (Bakınız: A8 paragrafı)."
  - mevzuat: BDS 505
    madde: md. 9
    alinti: "Yönetimin teyit talebi gönderilmesine izin vermeme kararının denetçi tarafından makul\n         bulunmaması veya\
      \ denetçinin alternatif denetim prosedürleri sonucunda ihtiyaca uygun ve\n         güvenilir denetim kanıtı elde etmesinin\
      \ mümkün olmaması durumunda, denetçi BDS 26012\n         uyarınca üst yönetimden sorumlu olanlarla iletişim kurar. Denetçi\
      \ aynı zamanda BDS 705 13\n         uyarınca bu hususun denetim ve denetçi görüşü üzerindeki etkilerine karar verir.\n\
      Dış Teyit Prosedürlerinin Sonuçları\nTeyit Taleplerine Verilen Yanıtların Güvenilirliği"
