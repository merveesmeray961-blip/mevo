- id: SMMM-DEN-KNT-0007
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 500
  tip: uygulama
  zorluk: 3
  kok: Denetçi, satış analizinde bir dış bilgi kaynağından alınan sektör verisini ve işletmenin hazırladığı satış raporunu
    kullanacaktır. Dış verinin kaynağı güvenilir görünmekte; işletme raporunun ise doğruluğu ve tamlığı konusunda henüz kanıt
    bulunmamaktadır. BDS 500'e göre denetçinin yaklaşımı aşağıdakilerden hangisidir?
  secenekler:
    A: Dış bilgi kaynağının kullanılması, bu bilginin ihtiyaca uygunluk ve güvenilirlik bakımından değerlendirilmesini gerektirmez;
      işletme raporu da yönetimce hazırlandığı için doğrudan kullanılabilir.
    B: Yalnız işletme raporunun doğruluğu test edilir; dış bilgi kaynağının ihtiyaca uygunluğu ve güvenilirliği ayrıca değerlendirilmez.
    C: Dış bilgi kaynağından alınan bilginin ihtiyaca uygunluğu ve güvenilirliği mütalaa edilir; işletme tarafından oluşturulan
      rapor için de gerektiğinde doğruluk ve tamlığa ilişkin denetim kanıtı elde edilerek bilginin yeterli açıklık ve ayrıntıda
      olup olmadığı değerlendirilir.
    D: Her iki bilgi kaynağı da yönetim tarafından kullanıldığı için yalnızca yazılı beyan alınması yeterlidir.
    E: İşletme raporunun güvenilirliği yalnız önceki dönemle karşılaştırılarak belirlenir; dış bilgi kaynağı için ise yalnız
      kaynağın adı dikkate alınır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 500 md. 7, dış bilgi kaynağından elde edilen bilgiler dâhil denetim kanıtı olarak kullanılacak bilgilerin
      ihtiyaca uygunluğunun ve güvenilirliğinin mütalaa edilmesini ister. Md. 9 ise işletme tarafından oluşturulan bilgi için
      gerekli ölçüde doğruluk ve tamlığa ilişkin denetim kanıtı elde edilmesini ve bilginin amaçlar açısından yeterince açık
      ve ayrıntılı olup olmadığının değerlendirilmesini öngörür. Püf noktaları: İki bilgi türü aynı testten geçmez; dış kaynak
      için uygunluk ve güvenilirlik, işletme tarafından oluşturulan bilgi için ise ayrıca doğruluk ve tamlık boyutu önemlidir.'
    celdiriciler:
      A: BDS 500 md. 7 dış bilgi kaynaklarından elde edilen bilginin de ihtiyaca uygunluk ve güvenilirlik bakımından mütalaa
        edilmesini gerektirir.
      B: BDS 500 md. 9, işletme tarafından oluşturulan bilgi için doğruluk ve tamlığa ilişkin kanıt elde edilmesini ve açıklık
        ile ayrıntının değerlendirilmesini öngörür.
      D: BDS 500 md. 9, işletme tarafından oluşturulan bilgiyi koşulsuz kabul etmeyi değil, amaçlar açısından yeterince güvenilir
        olup olmadığını değerlendirmeyi gerektirir.
      E: BDS 500 md. 7 ve 9, iki farklı bilgi kaynağı için farklı değerlendirme unsurları öngörür; yalnızca kaynağın adının
        bilinmesi yeterli değildir.
  kaynaklar:
  - mevzuat: BDS 500
    madde: md. 7
    alinti: "Denetçi, denetim prosedürlerini tasarlar ve uygularken, dış bilgi kaynağından elde edilen\n      bilgiler dâhil\
      \ olmak üzere, denetim kanıtı olarak kullanılacak bilgilerin ihtiyaca uygunluğunu\n      ve güvenilirliğini mütalaa\
      \ eder (Bkz.: A30-A44 paragrafları)."
  - mevzuat: BDS 500
    madde: md. 9
    alinti: "İşletme tarafından oluşturulan bir bilgiyi kullanması durumunda denetçi, amaçları açısından\n      bu bilginin\
      \ yeterince güvenilir olup olmadığını değerlendirir. Denetçi bu değerlendirmeyi\n      yaparken, içinde bulunulan şartlar\
      \ altında gerekli olduğu ölçüde:\n            Bilginin doğruluğuna ve tamlığına ilişkin denetim kanıtı elde eder (Bkz.:\
      \ A60-A61\n            paragrafları) ve\n            Bilginin denetçinin amaçları açısından, yeterince açık ve ayrıntılı\
      \ olup olmadığını\n            değerlendirir (Bkz.: A62 paragrafı)."
