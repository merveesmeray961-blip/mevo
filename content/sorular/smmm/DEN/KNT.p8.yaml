- id: SMMM-DEN-KNT-0009
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: 580 yazılı beyanlar
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, finansal tabloların hazırlanmasına ilişkin sorumluluğun yönetimde bulunduğu bir denetimde yazılı beyan
    alacaktır. Yönetim, beyan mektubunu denetçi raporu tarihinden iki gün sonra düzenlemek istemektedir. Ayrıca yönetim, bağımsız
    denetim sözleşmesinde mutabakata varılan tüm bilgileri denetçiye sağladığını ve tüm işlemlerin finansal tablolara yansıtıldığını
    yazılı olarak teyit etmek istememektedir. BDS 580'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Beyan mektubunun rapor tarihinden sonra düzenlenmesi mümkündür; tüm bilgilerin sağlandığına ilişkin beyan ayrıca gerekli
      değildir.
    B: Yazılı beyanların tarihi rapor tarihinden sonra olabilir; yalnız finansal tabloların hazırlanmasına ilişkin sorumluluk
      beyanı yeterlidir.
    C: Yazılı beyanların rapor tarihinden sonra olmaması ve bu tarihe mümkün olan en yakın tarihte düzenlenmesi gerekir; ayrıca
      ilgili tüm bilgilerin sağlandığına ve tüm işlemlerin kaydedilip finansal tablolara yansıtıldığına ilişkin beyanlar talep
      edilir.
    D: Yazılı beyanlar yalnız üst yönetimden sorumlu olanlardan alınır; yönetimden alınamaz.
    E: Yazılı beyanların tarihi serbesttir; ancak beyan mektubunda yalnız yönetimin muhasebe politikaları açıklanmalıdır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 580 md. 14, yazılı beyanların tarihinin denetçi raporu tarihinden sonra olamayacağını ve bu tarihe mümkün
      olan en yakın tarih olması gerektiğini düzenler. Md. 10 yönetimin finansal tabloları geçerli finansal raporlama çerçevesine
      uygun hazırlama sorumluluğuna ilişkin yazılı beyanı; md. 11 ise ilgili tüm bilgilerin ve erişim imkânının sağlandığı
      ile tüm işlemlerin kaydedilip finansal tablolara yansıtıldığına ilişkin yazılı beyanları zorunlu kılar. Püf noktaları:
      Beyanın içeriği kadar zamanı da zorunludur; yönetimin temel sorumluluklarına ilişkin iki ayrı beyan grubu birlikte dikkate
      alınmalıdır.'
    celdiriciler:
      A: BDS 580 md. 14 rapor tarihinden sonra tarihli yazılı beyana izin vermez; md. 11 de ilgili bilgi ve işlemlerin tamlığına
        ilişkin beyanı düzenler.
      B: BDS 580 md. 14 tarihi sınırlar; md. 10 ve 11 ise yalnız tek bir beyan değil, yönetimin farklı sorumluluklarına ilişkin
        beyanları düzenler.
      D: BDS 580 md. 9 yazılı beyanların ilgili konularda bilgiye sahip yöneticilerden talep edilmesini öngörür; yalnız üst
        yönetimden sorumlu olanlarla sınırlı değildir.
      E: BDS 580 md. 10 ve 11, yalnız muhasebe politikalarının açıklanmasını değil, finansal tabloların hazırlanması ve sunulan
        bilgi ile işlemlerin tamlığına ilişkin sorumlulukları kapsar.
  kaynaklar:
  - mevzuat: BDS 580
    madde: md. 10
    alinti: "Denetçi, yönetimden finansal tabloları geçerli finansal raporlama çerçevesine uygun olarak\n         hazırlama\
      \ sorumluluğunu yerine getirdiğine dair bir yazılı beyan talep eder. Bu beyan, uygun\n         hâllerde bağımsız denetim\
      \ sözleşmesi şartlarında öngörülen, finansal tabloların gerçeğe uygun\n         bir biçimde sunulduğu hususunu da içerir\
      \ 2 (Bkz.: A7-A9 ve A14, A22 paragrafları).\nSunulan Bilgiler ve İşlemlerin Tamlığı"
  - mevzuat: BDS 580
    madde: md. 11
    alinti: "Denetçi yönetimden:\n                Bağımsız denetim sözleşmesinde mutabakata varıldığı üzere, ilgili tüm bilgileri\
      \ ve bu\n                bilgilere erişim imkânını denetçiye sağladığına 3 ve\n                Tüm işlemlerin kaydedildiğine\
      \ ve finansal tablolara yansıtıldığına,\n         dair bir yazılı beyan talep eder (Bkz.: A7-A9 ve A14, A22 paragrafları).\n\
      Yazılı Beyanlarda Yönetimin Sorumluluklarının Açıklanması"
  - mevzuat: BDS 580
    madde: md. 14
    alinti: "Yazılı beyanların tarihi, finansal tablolara ilişkin denetçi raporu tarihinden sonra olamaz;\n         ancak\
      \ bu tarihe mümkün olan en yakın tarihtir. Yazılı beyanlar denetçi raporunda atıf yapılan\n         tüm finansal tabloları\
      \ ve dönemi(leri) kapsar (Bkz.: A15-A18 paragrafları)."
