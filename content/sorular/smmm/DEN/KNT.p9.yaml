  konu: KNT
  kazanim: '501'
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin finansal tablolarında raporlanan faaliyet bölümlerine ilişkin açıklamalar önemlidir. Denetçi,
    yönetimin bölüm bilgilerine karar verirken kullandığı yöntemleri anlamış ve bu yöntemlerin geçerli finansal
    raporlama çerçevesine uygun bir açıklama sağlayıp sağlamadığını değerlendirmek istemektedir. Belirli kalemlere
    ilişkin denetim kanıtı standardına göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetçi bölüm bilgilerini işletmenin genel yönetim giderleriyle karşılaştırır; yönetimin kullandığı yöntemleri
      incelemez ve açıklamaları değerlendirmez.
    B: Denetçi bölüm bilgilerinin tutarlarını toplar; geçerli finansal raporlama çerçevesine uygunluk değerlendirmesi
      yapmaz ve yöntemleri anlamaya çalışmaz.
    C: Denetçi, yönetimin bölüm bilgileri için kullandığı yöntemleri anlamalı; çerçevenin gerektirdiği açıklamanın
      sağlanıp sağlanmadığını değerlendirmelidir.
    D: Denetçi bölüm bilgilerini üçüncü taraflardan teyit eder; yönetim tarafından kullanılan yöntemler kapsam dışıdır
      ve açıklamalar incelenmez.
    E: Denetçi bölüm bilgilerini finansal tablo tarihinden sonra inceleyebilir; dönem içinde yönetimin yöntemlerini
      değerlendirmez ve kanıt toplamaz.
