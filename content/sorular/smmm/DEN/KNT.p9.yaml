      ve bu yöntemlerin uygun bir açıklama sağlayıp sağlamadığının değerlendirilmesini öngörür.
    celdiriciler:
      A: Md. 13 yöntemlerin anlaşılmasını açıkça öngörür; bu nedenle yöntemleri dışlayan A yanlıştır.
      B: Md. 13 yalnız toplama işlemi değil, yöntem ve çerçeveye uygunluk değerlendirmesini kapsar.
      D: Md. 13 üçüncü taraf teyidini tek zorunlu yöntem olarak belirlemez; yönetimin yöntemleri de doğrudan kapsamda
