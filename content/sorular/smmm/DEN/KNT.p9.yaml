  kok: 'Dış teyitlere ilişkin standarda göre aşağıdaki iki dış teyit türü ile tanımları eşleştirildiğinde hangisi
    doğrudur?


    I. Olumlu teyit talebi

    II. Olumsuz teyit talebi


    a. Teyit eden tarafın yalnızca mutabık olmaması hâlinde yanıt verdiği talep

    b. Teyit eden tarafın mutabakatını bildirdiği veya istenen bilgiyi sunduğu talep'
  secenekler:
    A: I-a, II-b
    B: I-b, II-b
    C: I-b, II-a
    D: I-a, II-a
    E: I-b, II-b; olumlu teyitte yanıt farklılık varsa verilir
  dogru: C
  aciklama:
    dogru_neden: Olumlu teyitte karşı taraf mutabakatını bildirir veya istenen bilgiyi sunar; olumsuz teyitte ise
      yalnızca talepteki bilgilerle mutabık olmaması hâlinde yanıt verir.
    celdiriciler:
      A: Olumlu ve olumsuz teyidin yönleri ters çevrilmiştir.
      B: Olumsuz teyitte yanıt yalnızca mutabık olunmadığında verilir.
      D: Her iki tanımda da olumlu teyidin yanıt yapısı yanlış verilmiştir.
      E: Olumlu teyitte yanıt yalnızca farklılık halinde verilmez; yanıt verilmesi istenir.
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: Tanımlar
    alinti: "İstisna: Teyit edilmesi talep edilen veya işletmenin kayıtlarında bulunan bilgiler ile teyit\n    \
      \          eden tarafın sunduğu bilgiler arasında bir farklılık olduğunu işaret eden yanıttır.\n         \
      \     Olumlu teyit talebi: Teyit eden tarafın doğrudan denetçiye yanıt verdiği, talepte yer alan\n       \
      \       bilgilerle mutabık olup olmadığını gösteren veya kendisinden talep edilen bilgileri\n            \
      \  sunduğu taleptir.\n              Olumsuz teyit talebi: Teyit eden tarafın sadece, talepte yer alan bilgilerle\
      \ mutabık\n              olmaması durumunda doğrudan denetçiye yanıt verdiği taleptir."
