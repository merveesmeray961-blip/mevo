  kok: Denetçi, teyit talebine telefonla sözlü bir yanıt almıştır. Teyit eden taraf yazılı yanıt göndermemiştir. BDS 505'e
    göre denetçinin yaklaşımı aşağıdakilerden hangisi olmalıdır?
  secenekler:
    A: Sözlü yanıtı tek başına dış teyit olarak kabul edip başka kanıt aramamalıdır.
    B: Sözlü yanıtı otomatik olarak geçersiz sayıp denetimi sonlandırmalıdır.
    C: Sözlü yanıtı tek başına dış teyit olarak kabul etmemeli; şartlara bağlı olarak doğrudan yazılı yanıt istemeli, yazılı
      yanıt alınmazsa bilgiyi destekleyecek başka kanıt elde etmeye çalışmalıdır.
    D: Sözlü yanıtı yönetim beyanı olarak kabul edip dış teyit prosedürünü tamamlamış saymalıdır.
    E: Teyit eden tarafın sözlü yanıtını çalışma kâğıdına almak yeterlidir; başka prosedür gerekmez.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 505, sözlü yanıtın tek başına dış teyit tanımını karşılamadığını; yazılı doğrudan yanıt alınmazsa verilen
      bilgileri destekleyecek başka denetim kanıtı aranacağını belirtir. Püf noktaları: Sözlü cevap ile yazılı, doğrudan teyit
      yanıtı arasındaki ayrım sorunun kilit noktasıdır.'
    celdiriciler:
      A: Sözlü yanıtı dış teyit sayar.
      B: Standart, yazılı yanıt alınmasını veya başka kanıt elde edilmesini öngörür; denetimin sonlandırılmasını değil.
      D: Yönetim beyanı ile dış teyidi birbirine karıştırır.
      E: Sadece belgeleme yaparak kanıt ihtiyacını ortadan kaldırır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: A15
    alinti: "A15. Bir teyit talebine verilen sözlü yanıt tek başına dış teyit tanımını karşılamaz. Çünkü bu\n     denetçiye\
      \ verilmiş doğrudan yazılı bir yanıt değildir. Ancak, bir teyit talebine sözlü yanıt\n     verilmesi durumunda, denetçi\
      \ şartlara bağlı olarak teyit eden taraftan kendisine yazılı olarak\n     doğrudan yanıt vermesini talep edebilir. Yazılı\
