    az gösterilip gösterilmediğini test etmek arasında kullanılacak denetim kanıtının yönünü ayırmak istemektedir.
    Denetim kanıtına ilişkin standarda göre aşağıdaki karşılaştırmalardan hangisi doğrudur?
