      B: BDS 500 böyle bir dış bilgi kaynağı zorunluluğu veya yasağı getirmez; ayrım kanıtın amacına uygunluğudur.
      C: Seçenek, iki test yönünü tersine çevirmekte ve kayıtlı borçların rolünü yanlış vermektedir.
