      kanıtın uygunluğunu etkileyebileceğini açıklar. Ticari borçların fazla gösterilmesini test ederken kayıtlı
      borçların test edilmesi uygun olabilir; az gösterilmesini test ederken ödenmemiş faturalar, tedarikçi beyanları,
      eşleşmeyen alındı belgeleri ve sonraki dönem ödemeleri gibi kayıt dışı kalabilecek göstergelerin incelenmesi
      uygun olabilir. Püf noktaları: Aynı hesap için test yönü değiştiğinde uygun kanıtın kaynağı da değişebilir.'
    celdiriciler:
