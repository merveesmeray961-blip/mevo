- id: SMMM-DEN-KNT-0020
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: '520'
  tip: kavrama
  zorluk: 3
  kok: 'BDS 520’deki analitik prosedürlerin kullanım amaçları aşağıdaki ifadelerle eşleştirilecektir:


    I. Belirli yönetim beyanları için maddi doğrulama prosedürü tasarlamak

    II. Denetimin sonuna doğru finansal tablolar hakkında genel sonuç oluştururken yardımcı olmak

    III. Beklenen değerlerden ciddi farklılıkların nedenlerini araştırmak


    a. Yönetimin sorgulanması ve uygun denetim kanıtı elde edilmesi

    b. Analitik maddi doğrulama prosedürlerinin uygunluğuna karar verilmesi

    c. Genel sonuç oluştururken analitik prosedürlerin kullanılması


    Doğru eşleştirme hangisidir?'
  secenekler:
    A: I-a, II-b, III-c
    B: I-c, II-a, III-b
    C: I-b, II-c, III-a
    D: I-b, II-a, III-c
    E: I-c, II-b, III-a
  dogru: C
  aciklama:
    dogru_neden: BDS 520 md. 5 belirli yönetim beyanları için analitik maddi doğrulama prosedürlerinin uygunluğuna karar verilmesini;
      md. 6 genel sonuç oluştururken analitik prosedürleri; md. 7 ise ciddi farklılıkların yönetimin sorgulanması ve uygun
      kanıt elde edilmesi yoluyla araştırılmasını düzenler.
    celdiriciler:
      A: I için b, II için c, III için a gerekir.
      B: I ve II yanlış eşleştirilmiştir.
      D: II’nin karşılığı c’dir; a değildir.
      E: I’nin karşılığı b’dir; c değildir.
  kaynaklar:
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: md. 5
    alinti: "5.       Denetçi, BDS 330 3 uyarınca analitik maddi doğrulama prosedürlerini tek başına veya detay\n        \
      \ testleri ile birlikte, maddi doğrulama prosedürü olarak tasarlar ve uygularken (Bakınız: A4-\n         A5 paragrafları):\n\
      \                İlgili yönetim beyanları için -varsa- detay testleri ile değerlendirilmiş önemli yanlışlık\n      \
      \          risklerini dikkate alarak, bu yönetim beyanları için belirli analitik maddi doğrulama\n                prosedürlerinin\
      \ uygunluğuna karar verir (Bakınız: A6-A11 paragrafları),"
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: md. 6
    alinti: "6.   Denetçi finansal tabloların, denetçinin işletme hakkındaki anlayışı (işletmeyi tanıması) ile\n     tutarlı\
      \ olup olmadığına dair genel bir sonuç oluştururken, denetimin sonuna doğru, kendisine\n     yardımcı olan analitik\
      \ prosedürleri tasarlar ve uygular (Bakınız: A17–A19 paragrafları).\nAnalitik Prosedürlerin Sonuçlarının Araştırılması"
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: md. 7
    alinti: "7.   Bu BDS uyarınca uygulanan analitik prosedürler sonucunda beklenen değerlerden ciddi\n     ölçüde farklılık\
      \ gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren dalgalanmaların veya\n     ilişkilerin belirlenmesi durumunda,\
      \ denetçi aşağıda belirtilen işlemleri gerçekleştirerek bu\n     farklılıkları araştırır:\n           Yönetimin sorgulanması\
      \ ve yönetimin verdiği yanıtlarla ilgili uygun denetim\n           kanıtlarının elde edilmesi ve\n           İçinde\
      \ bulunulan şartlar altında gerekli olan diğer denetim prosedürlerinin"
