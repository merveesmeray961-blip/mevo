  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Denetim kanıtı
  konu: KNT
  kazanim: BDS 500
  tip: kavrama
  zorluk: 3
  kok: 'Bir denetimde önemli yanlışlık riski yüksek değerlendirilmiş ve denetçi elindeki çok sayıdaki kanıtın güvenilirliğinin
    düşük olduğunu fark etmiştir. BDS 500’de yeterlilik ve uygunluk ayrımı dikkate alındığında aşağıdaki önermelerden hangileri
    doğrudur?

    I. Riskin daha yüksek değerlendirilmesi, muhtemelen daha fazla denetim kanıtı gerektirir.

    II. Daha fazla denetim kanıtı elde edilmesi, düşük olan kanıt kalitesini mutlaka telafi eder.

    III. Yeterlilik miktarın, uygunluk ise kanıtın ihtiyaca uygunluğu ve güvenilirliğiyle ilgilidir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: BDS 500 A8’e göre önemli yanlışlık riskinin daha yüksek değerlendirilmesi muhtemelen daha fazla denetim kanıtı
      gerektirir; ancak daha fazla kanıt, düşük olan kaliteyi telafi etmeyebilir. A8 ve A9’a göre yeterlilik miktarın, uygunluk
      ise kanıtın ihtiyaca uygunluğu ve güvenilirliğinin ölçütüdür. Bu nedenle I ve III doğrudur, II yanlıştır.
    celdiriciler:
      A: III de doğrudur; uygunluk kanıtın ihtiyaca uygunluğu ve güvenilirliğiyle ilgilidir.
      B: Daha fazla kanıtın düşük kaliteyi mutlaka telafi edeceği ifadesi A8’e aykırıdır; ayrıca I de doğrudur.
      C: II yanlıştır; A8 daha fazla kanıtın düşük kaliteyi telafi etmeyebileceğini belirtir.
      E: II yanlıştır; I ve III doğru olsa da üç önermenin tamamı doğru değildir.
  kaynaklar:
  - mevzuat: BDS 500 Bağımsız Denetim Kanıtları
    madde: A8
    alinti: A8. Denetim kanıtının yeterliliği ve uygunluğu birbiriyle ilişkilidir. Yeterlilik, denetim kanıtının miktarının
      ölçütüdür. İhtiyaç duyulan denetim kanıtı miktarı, denetçinin “önemli yanlışlık” risklerine ilişkin değerlendirmesinden
      (risklerin daha yüksek olduğunun değerlendirilmesi sebebiyle muhtemelen daha fazla denetim kanıtı gerekecektir) ve ilgili
      denetim kanıtının kalitesinden (denetim kanıtının kalitesi arttıkça daha az denetim kanıtı gerekebilir) etkilenir.
