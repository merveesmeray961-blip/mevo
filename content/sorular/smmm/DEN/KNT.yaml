  kok: BDS 580 "Yazılı Beyanlar" standardına göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Sorgulamalara verilen yanıtlar gibi, yazılı beyanlar da denetim kanıtı niteliğindedir.
    B: Yazılı beyanlar, ele aldıkları konularla ilgili tek başlarına yeterli ve uygun denetim kanıtı sağlar.
    C: Yazılı beyanların tarihi, denetçi raporu tarihinden sonra olamaz; ancak bu tarihe mümkün olan en yakın tarihtir.
    D: Yazılı beyanlar, denetçiye hitaben yazılmış bir beyan mektubu şeklindedir.
    E: Yazılı beyanlar, finansal tabloları destekleyen defterleri ve kayıtları kapsamaz.
  dogru: B
  aciklama:
    dogru_neden: BDS 580 parag. 4'e göre yazılı beyanlar gerekli olan denetim kanıtını sağlamalarına rağmen, ele
      aldıkları konularla ilgili tek başlarına yeterli ve uygun denetim kanıtı sağlamazlar. Bu nedenle B şıkkı yanlıştır.
    celdiriciler:
      A: Parag. 3'e göre sorgulamalara verilen yanıtlar gibi yazılı beyanlar da denetim kanıtıdır.
      C: Parag. 14'te yazılı beyanların tarihine ilişkin hüküm aynen bu şekildedir.
      D: Parag. 15'e göre yazılı beyanlar denetçiye hitaben yazılmış bir beyan mektubu şeklindedir.
      E: Parag. 7'deki tanıma göre yazılı beyanlar finansal tabloları, bu tablolardaki yönetim beyanlarını veya
        bu tabloları destekleyen defterleri ve kayıtları kapsamaz.
  kaynaklar:
  - mevzuat: BDS 580 Yazılı Beyanlar
    madde: parag. 3
    alinti: Dolayısıyla, sorgulamalara verilen yanıtlar gibi, yazılı beyanlar da denetim kanıtı niteliğindedir
  - mevzuat: BDS 580 Yazılı Beyanlar
    madde: parag. 4
    alinti: Yazılı beyanlar gerekli olan denetim kanıtını sağlamalarına rağmen, ele aldıkları konularla ilgili tek
      başlarına yeterli ve uygun denetim kanıtı sağlamazlar.
  - mevzuat: BDS 580 Yazılı Beyanlar
    madde: parag. 7
    alinti: 'Yazılı beyan: Belirli konuları teyit etmek veya diğer denetim kanıtlarını desteklemek için yönetim
      tarafından denetçiye sunulan yazılı bildirimdir. Bu bağlamda yazılı beyanlar; finansal tabloları, bu tablolarda
      yer alan yönetim beyanlarını veya bu tabloları destekleyen defterleri ve kayıtları kapsamaz.'
  - mevzuat: BDS 580 Yazılı Beyanlar
    madde: parag. 14 ve 15
    alinti: Yazılı beyanların tarihi, finansal tablolara ilişkin denetçi raporu tarihinden sonra olamaz; ancak bu
      tarihe mümkün olan en yakın tarihtir. … Yazılı beyanlar, denetçiye hitaben yazılmış bir beyan mektubu şeklindedir.
