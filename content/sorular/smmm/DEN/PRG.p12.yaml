- id: SMMM-DEN-PRG-0053
  sinav: smmm
  bolum: *id001
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: hasılat - yan sözleşmelerin teyidi
  tip: kavrama
  zorluk: 1
  kok: Bir işletmede satış indirimi şartlarının ve kabul kıstaslarının genellikle eksik belgelendirildiği, bunun hasılatın
    finansal tablolara alınmasında hile riski doğurduğu belirlenmiştir. BDS 240'a göre bu risk için aşağıdaki prosedürlerden
    hangisi uygulanabilir?
  secenekler:
    A: Satış faturalarının yalnızca numara sırasına göre eksiksiz olup olmadığına bakılması
    B: Yönetimin hasılata ilişkin açıklamalarının sözlü olarak yeterli kabul edilmesi
    C: Satış sözleşmelerinin yalnızca işletmenin dosyalarındaki kopyalarının incelenmesi
    D: Yan sözleşmelerin bulunmadığının ve belirli sözleşme şartlarının müşterilerle teyit edilmesi
    E: Hasılat tutarının yıllık bütçeyle karşılaştırılıp bütçeye uyum gösterilmesi hâlinde başka prosedür uygulanmaması
  dogru: D
  aciklama:
    dogru_neden: 'BDS 240 Ek 2 hasılat bölümünde, indirim şartları ve ilgili dönem bilgileri genellikle eksik belgelendirildiğinden
      ve muhasebeleştirme bu şartlardan etkilendiğinden, yan sözleşmelerin bulunmadığının ve belirli sözleşme şartlarının
      müşterilerle teyit edilmesini örnek prosedür olarak gösterir. Püf noktaları: Risk, işletme içi belgede görünmeyen şartlardan
      kaynaklanır; bu yüzden kanıtın işletme dışındaki müşteriden alınması gerekir.'
    celdiriciler:
      A: Fatura numara sırası şartların belgelenmemesi riskine karşılık vermez; sorun kayıtlı olmayan sözleşme şartlarındadır.
      B: Yönetimin sözlü açıklamaları tek başına ikna edici kanıt sağlamaz; Ek 2 bağımsız kaynaklardan ilave kanıt elde edilmesini
        önerir.
      C: İşletmenin kendi dosyasındaki kopyalar, bildirilmemiş yan sözleşmeleri ortaya çıkarmaz; teyit müşteriden alınmalıdır.
      E: Bütçeye uyum hasılatın doğru dönemde ve doğru tutarda kaydedildiğini göstermez; hile riskine karşılık için başka
        prosedürler gerekir.
  kaynaklar:
