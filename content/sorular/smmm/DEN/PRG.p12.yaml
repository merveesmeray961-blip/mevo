- id: SMMM-DEN-PRG-0051
  sinav: smmm
  bolum: &id001
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: stoklar - hile riskine karşı sayım prosedürü
  tip: kavrama
  zorluk: 1
  kok: Bir işletmenin birden fazla depoda önemli tutarda stoku bulunmaktadır ve yönetimin stokları depolar arasında kaydırarak
    olduğundan fazla gösterme riski değerlendirilmiştir. BDS 240'ın hile riskine karşı örnek prosedürleri arasında yer alan
    aşağıdakilerden hangisi bu risk için en uygundur?
  secenekler:
    A: Stok sayımının yalnızca yönetimin belirleyeceği tek bir depoda ve yönetimin seçtiği tarihte yapılması
    B: Satış maliyetinin önceki yılın aynı dönemiyle genel düzeyde karşılaştırılmasıyla yetinilmesi
    C: Stok sayımlarının belirli yerlerde haber verilmeden gözlemlenmesi veya tüm yerlerde aynı tarihte yapılması
    D: Stok kayıtlarının yalnızca muhasebe departmanı çalışanlarıyla yapılan görüşmelere dayandırılması
    E: Sayım sonuçlarının yönetimden alınan yazılı beyanla doğrulanıp ayrıca sayıma katılınmaması
  dogru: C
  aciklama:
    dogru_neden: BDS 240 Ek 2 stok miktarlarına ilişkin örnek prosedürler arasında, sayımların belirli yerlerde önceden haber
      verilmeden gözlemlenmesini veya tüm yerlerde aynı tarihte yapılmasını sayar. Böylece stokların depolar arasında kaydırılarak
      sayıma gösterilmesi riski azaltılır.
    celdiriciler:
      A: Sayım yerini ve tarihini yönetimin belirlemesi sürpriz unsurunu ortadan kaldırır; Ek 2 haber verilmeden gözlem ve
        aynı tarihli sayımı önerir.
      B: Genel düzeyli karşılaştırma stokların depolar arasında kaydırılmasını göstermez; bu risk fiziki gözlem ve sayım koordinasyonuyla
        ele alınır.
      D: Muhasebe departmanıyla görüşme tek başına yeterli kanıt sağlamaz; Ek 2 sorguların kapsamının yönetim ve muhasebe
        dışındaki kişileri de içermesini önerir.
      E: Yönetim beyanı fiziki sayımın yerine geçmez; BDS 501 md. 4 mümkün olan hâllerde sayıma katılımı ister.
  kaynaklar:
  - mevzuat: BDS 240
    madde: Ek 2
    alinti: Stok sayımlarının belirli yerlerde önceden haber verilmeden gözlemlenmesi veya stok sayımlarının tüm yerlerde
      aynı tarihte yapılması.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
          kaynakta doğrulandı.'
