- id: SMMM-DEN-PRG-0052
  sinav: smmm
  bolum: *id001
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: kasa - habersiz sayım
  tip: kavrama
  zorluk: 1
  kok: BDS 240'ın hile kaynaklı yanlışlık riskine karşı uygulanabilecek örnek prosedürlerine göre, kasa mevcudunun varlığına
    ilişkin hile riskinin yüksek değerlendirildiği bir işletmede denetçinin aşağıdakilerden hangisini yapması uygundur?
  secenekler:
    A: Belirli bir tarihte haber vermeksizin kasa sayımı yapması
    B: Kasa sayımının tarihini kasiyerle önceden belirleyip hazırlık süresi tanıması
    C: Kasa sayımını yalnızca dönem sonundan iki ay sonra yapması
    D: Kasa bakiyesini önceki yıl bakiyesiyle karşılaştırıp başka bir işlem yapmaması
    E: Kasa sayımını kasiyerin kendisine yaptırıp sonucu yazılı beyan olarak alması
  dogru: A
  aciklama:
    dogru_neden: BDS 240 Ek 2'ye göre haber vermeksizin veya bildirimsiz olarak belirli testlerin yapılması hile riskine karşı
      uygulanabilecek bir prosedürdür; örnek olarak belirli bir tarihte haber vermeksizin kasa sayımı yapılması gösterilir.
    celdiriciler:
      B: Önceden haber vermek hile yapanın sayımı hazırlamasına olanak tanır; Ek 2 haber verilmeksizin sayım yapılmasını örnek
        gösterir.
      C: Sayımın dönem sonundan çok sonra yapılması, bakiyenin raporlama tarihindeki mevcudiyeti hakkında kanıt sağlamaz ve
        sürpriz unsurunu da taşımaz.
      D: Yalnızca bakiye karşılaştırması mevcudiyet kanıtı vermez; fiziki sayım gerektiren bir riske analitik inceleme yeterli
        karşılık olmaz.
      E: Sayımı sayılan hesabın sorumlusuna yaptırmak, denetçinin kontrolünü ortadan kaldırır ve hile riskine karşılık vermez.
  kaynaklar:
  - mevzuat: BDS 240
    madde: Ek 2
    alinti: Örneğin, önceden denetçinin katılımının bildirilmediği yerlerde denetçinin haber vermeksizin stok sayımını gözlemlemesi
      veya belirli bir tarihte haber vermeksizin kasa sayımı yapması.
