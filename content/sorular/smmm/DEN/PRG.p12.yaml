- id: SMMM-DEN-PRG-0054
  sinav: smmm
  bolum: *id001
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: stoklar - bilgisayar destekli sayım dökümü testi
  tip: uygulama
  zorluk: 2
  kok: Bir denetçi, işletmenin fiziki stok sayım dökümlerinde mükerrer veya atlanmış etiket bulunma ihtimalini sınamak istemektedir.
    BDS 240 Ek 2'ye göre denetçinin bu amaçla izleyebileceği yol aşağıdakilerden hangisidir?
  secenekler:
    A: Dökümleri yönetimin belirlediği sorumlu kişiye elle kontrol ettirip sonucu yazılı beyan olarak almak
    B: Yalnızca en yüksek değerli beş kalemi sayıp diğer kalemlerin güvenilir olduğunu varsaymak
    C: Sayım dökümlerinin yalnızca toplam tutarını finansal tablolardaki stok bakiyesiyle karşılaştırmak
    D: Dökümleri sayım tarihinden iki ay sonra alınan nüshalar üzerinden incelemek
    E: Bilgisayar destekli tekniklerle dökümleri etiket veya seri numarasına göre sıralayıp atlama ve tekrarları test etmek
  dogru: E
  aciklama:
    dogru_neden: 'BDS 240 Ek 2, fiziki stok sayım dökümlerinin ileri düzeyde test edilmesi için bilgisayar destekli denetim
      tekniklerinin kullanılmasını önerir ve örnek olarak etiket numaralarına göre sıralayarak etiket kontrollerinin veya
      ürün seri numarasına göre sıralayarak atlama ve tekrar kontrolünün yapılmasını gösterir. Püf noktaları: Toplam tutar
      karşılaştırması mükerrer ve atlanmış kalemleri birbirini dengeleyebileceği için ortaya çıkarmaz; kalem düzeyinde sıralama
      gerekir.'
    celdiriciler:
      A: Kontrolün yönetim temsilcisine bırakılması denetçinin bağımsız testini ortadan kaldırır ve yazılı beyan tek başına
        kanıt değildir.
      B: Yalnızca en yüksek değerli kalemleri sayıp geri kalanı varsaymak, mükerrer ve atlanmış etiketlerin tamamını yakalamaz.
      C: Toplam tutar karşılaştırması mükerrer ve atlanmış kalemleri birbirini dengeleyerek gizleyebilir; kalem düzeyinde
        test yapılmış olmaz.
      D: Dökümlerin sayımdan çok sonra alınması manipülasyon riskini artırır ve etiket sıralama testinin yerine geçmez.
  kaynaklar:
  - mevzuat: BDS 240
    madde: Ek 2
    alinti: Fiziki stok sayım dökümlerinin ileri düzeyde test edilmesi amacıyla bilgisayar destekli denetim tekniklerinin
      kullanılması.
  - mevzuat: BDS 240
    madde: Ek 2
    alinti: Örneğin, etiket numaralarına göre sıralayarak etiket kontrollerinin test edilmesi veya ürün seri numarasına göre
