    A: Stok bakiyesini yönetimin yazılı beyanına dayanarak kabul eder ve olumlu görüş verir.
    B: BDS 705 uyarınca olumlu görüş dışında bir görüş verir.
    C: Bu durumda denetimi derhâl sonlandırır; görüş vermez.
    D: Sorunu dikkat çekilen husus paragrafıyla belirtir, görüşünü değiştirmez.
    E: Üçüncü tarafın bakiyesini sıfır kabul ederek stokları finansal tablolardan çıkarır.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 501 par. 7 uyarınca fiziki stok sayımına katılım mümkün değilse denetçi, alternatif denetim prosedürleri
      uygular; bunun mümkün olmaması durumunda BDS 705 uyarınca olumlu görüş dışında bir görüş verir. Püf noktaları: Üçüncü
      tarafın kontrolündeki stoklar için teyit veya tetkik gibi seçenekler (par. 8) de alternatif kanıt yollarıdır; bunlarla
      da yeterli kanıt elde edilemezse görüş türü etkilenir. Yönetim beyanı denetim kanıtı eksikliğini gidermez ve denetçi
      muhasebe kaydını kendisi değiştirmez.'
    celdiriciler:
      A: Yönetim beyanı yeterli ve uygun denetim kanıtı yerine geçmez; par. 7 olumlu görüş dışında görüş öngörür.
      C: Par. 7 denetimin sonlandırılmasını değil, BDS 705 uyarınca olumlu görüş dışında görüş verilmesini öngörür.
      D: Dikkat çekilen husus paragrafı kanıt eksikliğini telafi etmez; par. 7 görüşün olumlu görüş dışında olmasını gerektirir.
      E: Denetçi stokları finansal tablolardan çıkarma yetkisine sahip değildir; yanlışlık yönetimle ilgili sorumluluktur.
