  kok: BDS 510 “İlk Bağımsız Denetimler – Açılış Bakiyeleri” standardına göre denetçinin açılış bakiyeleri hakkında yeterli
    ve uygun denetim kanıtı elde etmek için yaptığı işlemler arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Kapanış bakiyelerinin cari döneme doğru aktarılıp aktarılmadığına karar vermek
    B: Önceki dönem finansal tablolarının tamamını yeniden denetleyerek kanıt toplamak
    C: Açılış bakiyelerinin uygun muhasebe politikalarını yansıtıp yansıtmadığına karar vermek
    D: Önceki denetçinin çalışma kâğıtlarını gözden geçirmek (önceki yıl denetlenmişse)
    E: Cari dönem prosedürlerinin açılış bakiyelerine kanıt sağlayıp sağlamadığını değerlendirmek
  dogru: B
  aciklama:
    dogru_neden: BDS 510 par. 6 uyarınca denetçi; kapanış bakiyelerinin doğru aktarılıp aktarılmadığına, açılış bakiyelerinin
      uygun muhasebe politikalarını yansıtıp yansıtmadığına karar verir ve önceki denetçinin çalışma kâğıtlarını gözden geçirme,
      cari dönem prosedürlerinin kanıt sağlayıp sağlamadığını değerlendirme veya belirli prosedürler uygulama seçeneklerinden
      birini ya da fazlasını uygular. Önceki dönemin yeniden denetlenmesi öngörülmemiştir.
    celdiriciler:
      A: Par. 6(a) bu belirlemeyi öngörür.
      C: Par. 6(b) bu belirlemeyi öngörür.
      D: Par. 6(c)(i) önceki yıl denetlenmişse önceki denetçinin çalışma kâğıtlarının gözden geçirilmesini öngörür.
      E: Par. 6(c)(ii) cari dönem prosedürlerinin kanıt sağlayıp sağlamadığının değerlendirilmesini öngörür.
