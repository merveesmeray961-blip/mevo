  kok: Bir işletmenin önemli tutardaki stokları üçüncü bir tarafın deposundadır ve denetçi fiziki stok sayımına katılamamıştır.
    Alternatif denetim prosedürlerini uygulamasına rağmen stokların mevcudiyeti ve durumu hakkında yeterli ve uygun denetim
    kanıtı elde edememiştir. BDS 501’e göre denetçi ne yapmalıdır?
