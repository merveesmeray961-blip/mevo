      B: Tutar büyüklüğü anomali ölçütü değildir; par. 13 kesinlik derecesi yüksek kanaat ve ilave prosedür arar.
      C: Yönetim açıklaması tek başına yeterli kanıt değildir; denetçi ilave prosedürlerle kanıt elde eder.
      D: Par. 13 anomali değerlendirmesini çok ender durumlara özgü kılar; varsayılan yöntem değildir.
      E: Par. 12 her sapma veya yanlışlığın nitelik ve sebebinin araştırılmasını öngörür.
