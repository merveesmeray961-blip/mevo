- id: SMMM-DEN-PRG-0046
  sinav: smmm
  bolum:
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 3
  kok: Denetçi raporu 20 Mart tarihlidir ve finansal tablolar 5 Nisan’da yayımlanmıştır. Denetçi, 28 Mart’ta raporunu değiştirmesine
    sebep olabilecek bir durumdan haberdar olmuştur. BDS 560 “Bilanço Tarihinden Sonraki Olaylar” standardına göre denetçi
    ne yapar?
  secenekler:
    A: Rapor tarihinden sonra yükümlülüğü bulunmadığından hiçbir adım atmaz.
    B: Durumu yalnızca yönetimden yazılı beyan alarak kapatır.
    C: Konuyu yönetimle müzakere eder, değişiklik gerekliliğine karar verir
    D: Raporunu kendiliğinden geri çekip yeni tarihle yeniden düzenler.
    E: Durumu doğrudan yetkili kuruma bildirir; yönetime bilgi vermez.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 560 par. 10’a göre denetçinin rapor tarihinden sonra finansal tablolarla ilgili prosedür uygulama yükümlülüğü
      bulunmaz; ancak rapor tarihinden sonra yayımdan önce haberdar olduğu ve rapor tarihinde bilseydi raporunu değiştirmesine
      sebep olabilecek bir durum varsa konuyu yönetimle ve uygun hâllerde üst yönetimden sorumlu olanlarla müzakere eder,
      finansal tablolarda değişiklik gerekip gerekmediğine karar verir ve gerekliyse yönetimin bu hususu nasıl ele alacağını
      sorgular. Püf noktaları: Yükümlülük olmaması ile haberdar olunan durumda adım atılması ayrı hükümlerdir; yayım tarihi
      (5 Nisan) haberdar olma tarihinden sonradır, dolayısıyla par. 14 değil par. 10 uygulanır.'
    celdiriciler:
      A: İlk cümle prosedür yükümlülüğü olmadığını söyler; ancak “bununla birlikte” haberdar olunan durumda müzakere, karar
        ve sorgulama adımları gerekir.
      B: Yönetim beyanı değişiklik gerekip gerekmediği kararının yerine geçmez; par. 10 müzakere ve karar öngörür.
      D: Raporun geri çekilmesi par. 10’un öngördüğü adım değildir; yönetim değişiklik yaparsa yeni rapor sunulur (par. 11).
      E: Par. 10 öncelikle yönetimle müzakereyi öngörür; yetkili kuruma doğrudan bildirim ilk adım değildir.
  kaynaklar:
  - mevzuat: BDS 560 Bilanço Tarihinden Sonraki Olaylar
    madde: par. 10
    alinti: Denetçinin, denetçi raporu tarihinden sonra finansal tablolarla ilgili herhangi bir denetim prosedürünü uygulama
      yükümlülüğü bulunmaz. Bununla birlikte, denetçi raporu tarihinden sonra finansal tabloların yayımlandığı tarihten önce
