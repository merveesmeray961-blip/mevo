- id: SMMM-DEN-PRG-0045
  sinav: smmm
  bolum:
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: kavrama
  zorluk: 3
  kok: BDS 520 standardına göre analitik maddi doğrulama prosedürü tasarlayıp uygulayan denetçinin yapması gerekenler arasında
    aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Yönetim beyanları için belirli analitik prosedürlerin uygunluğuna karar vermek
    B: Beklentinin dayanağı olan verilerin güvenilirliğini değerlendirmek
    C: Beklentinin önemli bir yanlışlığı belirlemek için yeterince kesin olup olmadığını değerlendirmek
    D: Beklenen değerlerle kayıtlı tutarlar arasındaki kabul edilebilir farkları belirlemek
    E: Beklentiyi yönetimin tutarlarından türetip farkın tamamını yanlışlık kaydetmek
  dogru: E
  aciklama:
    dogru_neden: 'BDS 520 par. 5 uyarınca denetçi; analitik prosedürün uygunluğuna karar verir, verilerin güvenilirliğini
      değerlendirir, beklenti geliştirip yeterince kesin olup olmadığını değerlendirir ve ilave araştırma gerektirmeyecek
      kabul edilebilir tutar farklarını belirler. Farkın tamamının yanlışlık sayılması öngörülmemiştir; fark par. 7 uyarınca
      araştırılır. Püf noktaları: Beklenti denetçinin geliştirdiği beklentidir (yönetimin rakamı değil) ve kabul edilebilir
      fark dışındaki sapmalar önce araştırılır, doğrudan yanlışlık sayılmaz.'
    celdiriciler:
      A: Uygunluğa karar vermek par. 5(a)’dadır.
      B: Verilerin güvenilirliğini değerlendirmek par. 5(b)’dedir.
      C: Beklentinin yeterince kesin olup olmadığını değerlendirmek par. 5(c)’dedir.
      D: Kabul edilebilir tutar farklarını belirlemek par. 5(d)’dedir.
  kaynaklar:
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 5(a)
    alinti: İlgili yönetim beyanları için -varsa- detay testleri ile değerlendirilmiş önemli yanlışlık risklerini dikkate
      alarak, bu yönetim beyanları için belirli analitik maddi doğrulama prosedürlerinin uygunluğuna karar verir
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 5(b)
    alinti: kayıtlı tutarlara veya oranlara ilişkin denetçinin geliştirdiği beklentinin dayanağı olan verilerin güvenilirliğini
      değerlendirir
  - mevzuat: BDS 520 Analitik Prosedürler
    madde: par. 5(c)
    alinti: Kayıtlı tutarlara veya oranlara ilişkin bir beklenti geliştirir ve bu beklentinin, tek başına veya diğer yanlışlıklarla
      birlikte finansal tablolarda önemli bir yanlışlığa sebep olabilecek bir yanlışlığı belirlemek için yeterince kesin olup
