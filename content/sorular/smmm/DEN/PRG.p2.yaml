    C: Yönetimin tek seferlik hata olduğuna ilişkin açıklaması anomali kabulü için yeterli kanıt sayılır.
    D: Anomali değerlendirmesi, örneklemde tespit edilen her yanlışlık için varsayılan yöntemdir.
    E: Anomali kabul edilen yanlışlık için nedeni ve etkilerini araştırmak gerekmez.
  dogru: A
