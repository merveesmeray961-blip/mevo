    dogru_neden: 'BDS 530 par. 13 uyarınca örneklemde tespit edilen bir sapma veya yanlışlığı anomali olarak değerlendirmek
      çok ender durumlarda söz konusudur; denetçinin yanlışlığın anakitleyi temsil etmediğine dair kesinlik derecesi yüksek
      bir kanaate sahip olması ve bunun için anakitlenin geri kalanını etkilemediğine ilişkin ilave prosedürlerle yeterli
      ve uygun kanıt elde etmesi gerekir. Püf noktaları: Tutarın küçüklüğü ve yönetimin açıklaması kanıt yerine geçmez; par.
      12 uyarınca her yanlışlığın nedeni zaten araştırılır.'
