    Yanlışlığın tutarı küçüktür ve yönetim durumu tek seferlik bir hata olarak açıklamıştır. BDS 530 “Bağımsız Denetimde Örnekleme”
    standardına göre aşağıdakilerden hangisi doğrudur?
