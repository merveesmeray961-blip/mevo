  zorluk: 1
  kok: BDS 500 “Bağımsız Denetim Kanıtları” standardına göre denetçi, denetim prosedürlerini tasarlar ve uygularken denetim
    kanıtı olarak kullanılacak bilgilerin hangi niteliklerini mütalaa eder?
  secenekler:
    A: Yalnızca miktarını ve elde edilme maliyetini
    B: Yalnızca yönetim tarafından onaylanmış olup olmadığını
    C: İhtiyaca uygunluğunu ve güvenilirliğini birlikte
    D: Tamlığını ve düzenlendiği tarihin yakınlığını
    E: Yalnızca işletme dışı kaynaklardan gelip gelmediğini
  dogru: C
  aciklama:
    dogru_neden: BDS 500 par. 7 uyarınca denetçi, denetim prosedürlerini tasarlar ve uygularken, dış bilgi kaynağından elde
      edilen bilgiler dâhil olmak üzere, denetim kanıtı olarak kullanılacak bilgilerin ihtiyaca uygunluğunu ve güvenilirliğini
      mütalaa eder.
    celdiriciler:
      A: Miktar yeterlilikle ilgilidir; par. 7 bilginin ihtiyaca uygunluğu ve güvenilirliğini esas alır, elde etme maliyetini
        değil.
      B: Yönetim onayı par. 7’de bir ölçüt değildir; güvenilirlik değerlendirmesi denetçiye aittir.
      D: Par. 7 tamlık veya tarih yakınlığını ayrı birer ölçüt olarak saymaz.
      E: Dış bilgi kaynağından gelen bilgiler de değerlendirilir (par. 7); kaynağın işletme dışı olması tek ölçüt değildir.
  kaynaklar:
  - mevzuat: BDS 500 Bağımsız Denetim Kanıtları
    madde: par. 7
    alinti: Denetçi, denetim prosedürlerini tasarlar ve uygularken, dış bilgi kaynağından elde edilen bilgiler dâhil olmak
