- id: SMMM-DEN-PRG-0032
  sinav: smmm
  bolum:
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: alacaklar
  tip: kavrama
  zorluk: 2
  kok: BDS 501 standardına göre, stokların finansal tablolar açısından önemli olması durumunda denetçinin fiziki stok sayımına
    katılımı kapsamında yaptığı işlemler arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Yönetimin sayım sonuçlarının kayıt ve kontrol edilmesine yönelik talimat ve prosedürlerini değerlendirmek
    B: Yönetimin sayıma ilişkin prosedürlerinin uygulanmasını gözlemlemek
    C: Stokları tetkik etmek
    D: Test sayımlarını yapmak
    E: İşletmenin bütün stoklarını yönetimden bağımsız olarak baştan sona yeniden saymak
  dogru: E
  aciklama:
    dogru_neden: BDS 501 par. 4(a) uyarınca sayıma katılım; yönetimin talimat ve prosedürlerinin değerlendirilmesini, uygulamanın
      gözlemlenmesini, stokların tetkik edilmesini ve test sayımlarının yapılmasını kapsar. Bütün stokların yeniden sayılması
      bu işlemler arasında sayılmamıştır; denetçi test sayımı yapar.
    celdiriciler:
      A: Yönetimin talimat ve prosedürlerini değerlendirmek par. 4(a)(i)’de sayılmıştır.
      B: Sayım prosedürlerinin uygulanmasını gözlemlemek par. 4(a)(ii)’de sayılmıştır.
      C: Stokları tetkik etmek par. 4(a)(iii)’te sayılmıştır.
      D: Test sayımlarını yapmak par. 4(a)(iv)’te sayılmıştır.
  kaynaklar:
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtları – Belirli Kalemler İçin Dikkate Alınması Gereken Özel Hususlar
    madde: par. 4(a)
    alinti: 'Mümkün olan hâllerde, aşağıdakileri gerçekleştirmek için fiziki stok sayımına katılım (Bakınız: A1-A3 paragrafları):
      (i) Yönetimin, işletmenin fiziki stok sayımı sonuçlarının kayıt ve kontrol edilmesine yönelik talimat ve prosedürlerini
      değerlendirmek (Bakınız: A4 paragrafı), (ii) Yönetimin sayıma ilişkin prosedürlerinin uygulanmasını gözlemlemek (Bakınız:
      A5 paragrafı), (iii) Stokları tetkik etmek (Bakınız: A6 paragrafı), (iv) Test sayımlarını yapmak (Bakınız: A7-A8 paragrafları).'
