- id: SMMM-DEN-PRG-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: alacaklar
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin 31 Aralık tarihli finansal tablolarındaki ticari alacaklar için denetçi, 15 Ocak tarihinde
    yapılan tahsilatlara ilişkin banka kayıtlarını ve ödeme belgelerini incelemiştir. BDS 500'deki örneğe göre bu
    prosedür öncelikle hangi yönetim beyanlarına ilişkin denetim kanıtı sağlar?
  secenekler:
    A: Var olma ve değerleme
    B: Hesap kesimi ve sınıflandırma
    C: Tamlık ve haklar
    D: Sunum ve açıklama
    E: Yetkilendirme ve sınıflandırma
  dogru: A
  aciklama:
    dogru_neden: BDS 500 A32'de, alacakların bilanço tarihinden sonraki dönemde tahsil edilmesine ilişkin belgelerin
      tetkikinin var olma ve değerlemeyle ilgili denetim kanıtı sağladığı, hesap kesimiyle ilgili kanıt sağlamayabileceği
      belirtilir.
    celdiriciler:
      B: Kaynak, bu prosedürü hesap kesimiyle ilişkilendirmemektedir.
      C: Kaynakta bu örnek için tamlık ve haklar değil, var olma ve değerleme belirtilmiştir.
      D: Sunum ve açıklama bu örnekte belirtilen iki yönetim beyanı değildir.
      E: Yetkilendirme ve sınıflandırma, A32'deki örneğin sonucu değildir.
  kaynaklar:
  - mevzuat: BDS 500 Bağımsız Denetim Kanıtları
    madde: A32
    alinti: "Örneğin, alacakların bilanço tarihinden sonraki bir\n     dönemde tahsil edilmesiyle ilgili belgelerin\
      \ tetkiki, var olma ve değerlemeyle ilgili denetim\n     kanıtı sağlarken, hesap kesimiyle ilgili kanıt sağlamayabilir.\
      \ Benzer şekilde, stokların\n     mevcudiyeti gibi belirli bir yönetim beyanıyla ilgili denetim kanıtının\
      \ elde edilmesi, stokların\n     değerlemesi gibi başka bir yönetim beyanıyla ilgili denetim kanıtının elde\
      \ edilmesinin ikamesi\n     olmaz.…"
  gecerlilik:
    baslangic: '2023-12-31'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kaynaklı kör çözücü: anahtarla aynı (güven 5). BDS 500 A32: var olma ve değerleme'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_DEN.yaml, satır Merve_DEN-2026-10-06-G01 #1'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kaynaklı kör çözücü anahtarla uyuştu
- id: SMMM-DEN-PRG-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 3
  kok: Bir işletmede yönetimin satışları olduğundan yüksek gösterme riski bulunduğu, bazı satışların teslimattan
    önce fatura edilebildiği ve satış sözleşmelerindeki iade ve teslim şartlarının dönem sonuna yakın değiştirilebildiği
    belirlenmiştir. BDS 330'a göre denetçinin tasarlayacağı dış teyit prosedürlerinden hangisi bu riske en uygun
    yaklaşımdır?
  secenekler:
    A: Yalnızca dönem sonunda ödenmemiş borçların tutarını teyit etmek
    B: Yalnızca müşterilerin işletmeyle çalışma süresini teyit etmek
    C: Satış sözleşmelerini incelemeksizin yalnızca brüt satış kârı yüzdesini hesaplamak
    D: Yalnızca dönem başındaki satış bakiyelerini teyit etmek
    E: Satış sözleşmelerinin tarih, iade ve teslimata ilişkin şartlarını teyit etmek ve sözleşme/teslimat şartlarındaki
      değişiklikleri sorgulamak
  dogru: E
  aciklama:
    dogru_neden: BDS 330'un ilgili uygulama hükmünde, satışların teslimattan önce fatura edilmesi veya sözleşme
      şartları nedeniyle hasılatın yanlış muhasebeleştirilmesi riski bulunduğunda, yalnızca ödenmemiş borçların
      teyidiyle yetinilmeyip tarih, iade ve teslimat şartları dahil satış sözleşmesi ayrıntılarının teyit edilebileceği
      ve değişikliklerin sorgulanabileceği belirtilir.
    celdiriciler:
      A: Kaynak, bu riskte yalnızca ödenmemiş borçların teyidini yetersiz bırakıp sözleşme ayrıntılarının da teyidini
        öngörür.
      B: Müşterinin işletmeyle çalışma süresi, kaynakta belirtilen tarih, iade ve teslimat şartlarının yerine geçmez.
      C: Kaynakta dış teyit prosedürleri ve sözleşme ayrıntıları vurgulanırken yalnızca oran hesabıyla yetinilmesi
        önerilmemektedir.
      D: Dönem başı bakiyeleri, dönem sonundaki teslimat ve faturalama riskini doğrudan karşılamaz.
  kaynaklar:
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: A55
    alinti: "Bu tür durumlarda denetçi, örneğin yalnızca ödenmemiş borçların teyit edilmesi\n     amacıyla değil;\
      \ aynı zamanda tarih, iade ve teslimata ilişkin şartlar da dâhil, satış\n     sözleşmelerinin ayrıntılarını\
      \ teyit etmek için de dış teyit prosedürleri tasarlayabilir. Buna ek\n     olarak denetçi, satış sözleşmelerindeki\
      \ ve teslimat şartlarındaki her türlü değişiklik konusunda\n     işletmedeki finansla ilgili olmayan personeli\
      \ sorgulayarak bu tür dış teyitleri desteklemeyi\n     faydalı bulabilir.\nMaddi Doğrulama Prosedürlerinin\
      \ Zamanlaması (Bkz.: 22-23 üncü paragraflar)\nA56.…"
  gecerlilik:
    baslangic: '2022-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_DEN.yaml, satır Merve_DEN-2026-10-06-G01 #5'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'şık dengeleme: doğru şık C → E (metinler yer değiştirdi).'
