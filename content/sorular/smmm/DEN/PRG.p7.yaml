  kok: Dış teyitler standardına göre alacak hesap bakiyeleri için dış teyit talebine yanıt alınamaması durumunda
    denetçinin uygulayabileceği alternatif denetim prosedürlerine örnek olarak aşağıdakilerden hangisi verilebilir?
  secenekler:
    A: Yanıt vermeyen müşterilerin bakiyelerini yönetimin yazılı beyanına dayanarak doğrulanmış kabul etmek
    B: Yanıt vermeyen müşterilerin bakiyelerini önceki yıl teyit sonuçlarına dayanarak doğrulanmış saymak
    C: Teyit talebini yönetim aracılığıyla aynı müşterilere ikinci kez ileterek yanıt beklemek
    D: Sonradan yapılan belirli nakit tahsilatları, sevk irsaliyelerini ve dönem sonuna yakın satışları incelemek
    E: Yönetimin hazırladığı yaşlandırma raporunu incelemekle yetinerek bakiyelerin varlığına karar vermek
  dogru: D
  aciklama:
    dogru_neden: Dış teyitler standardının A18 paragrafı, alacak hesap bakiyeleri için alternatif prosedür örnekleri
      olarak daha sonra yapılan belirli nakit tahsilatların, sevk irsaliyelerinin ve dönem sonuna yakın tarihlerde
      gerçekleştirilen satışların incelenmesini verir.
    celdiriciler:
      A: Yönetimin yazılı beyanı, bakiyenin varlığına ilişkin bağımsız bir kanıt değildir; alternatif prosedürün
        yerine geçmez.
      B: Önceki yılın teyit sonuçları cari dönem bakiyesinin varlığını kanıtlamaz; alternatif prosedür örneği olarak
        sayılmamıştır.
      C: Teyit sürecinin denetçinin kontrolü dışında yönetim aracılığıyla yürütülmesi güvenilirliği zayıflatır;
        bu bir alternatif prosedür değildir.
      E: Yönetimin hazırladığı yaşlandırma raporu bağımsız kanıt sağlamaz ve bakiyenin varlığını göstermez; A18'de
        yer almaz.
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: A18
    alinti: 'Aşağıdakiler, denetçinin uygulayabileceği alternatif denetim prosedürlerine verilebilecek örneklerdendir:
      • Alacak hesap bakiyeleri için – daha sonra yapılan belirli nakit tahsilatların, sevk irsaliyelerinin ve dönem
