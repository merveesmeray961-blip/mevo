    durumunda denetçinin uygulayabileceği alternatif denetim prosedürlerine örnek olarak aşağıdakilerden hangisi
    verilebilir?
  secenekler:
    A: Yalnızca yönetimin sözlü beyanını kabul etmek
    B: Teyit talebini tekrar göndermeden denetimi tamamlamak
