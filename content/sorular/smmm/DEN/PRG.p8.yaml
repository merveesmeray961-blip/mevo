- id: SMMM-DEN-PRG-0007
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: alacaklar
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin ticari alacakları için yönetim dış teyit gönderilmesine izin vermemiş, denetçi de alternatif prosedürlerle
    yeterli kanıt elde edememiştir. Denetçi, alacakların önemli yanlışlık riskini ve teyit sürecinin sonuçlarını değerlendirirken
    aşağıdakilerden hangisini yapmalıdır?
  secenekler:
    A: Yönetimin izin vermemesi, alacakların doğru olduğunun kanıtı sayılır ve ilave işlem yapılmaz.
    B: Denetçi yönetimin gerekçesini sorgular, izin vermemenin risk değerlendirmesi ve diğer prosedürler üzerindeki etkisini
      değerlendirir; alternatif prosedürler kanıt sağlamazsa iletişim ve görüş üzerindeki etkiyi ayrıca ele alır.
    C: Denetçi yalnızca olumsuz teyit kullanmak zorundadır; alternatif prosedür uygulanamaz.
    D: Ticari alacaklar için dış teyit talebinde denetçinin süreç üzerinde kontrol sahibi olması gerekmez.
    E: Alternatif prosedürler sonuç vermese bile görüş üzerindeki etki değerlendirilmeden denetim tamamlanır.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 505 md. 7 dış teyit sürecinde denetçinin kontrol sahibi olmasını; md. 8 yönetimin izin vermemesi hâlinde
      gerekçenin sorgulanmasını, risk ve diğer prosedürler üzerindeki etkilerin değerlendirilmesini ve alternatif prosedürleri;
      md. 9 ise uygun ve güvenilir kanıt elde edilemezse üst yönetimden sorumlu olanlarla iletişimi ve görüş etkisinin değerlendirilmesini
      öngörür. Püf noktaları: Alacak bakiyesinin niteliği, teyit sürecinin denetçi kontrolünde olması ve kanıt elde edilememesinin
      görüşe etkisi aynı zincirin parçalarıdır.'
    celdiriciler:
      A: BDS 505 md. 8, yönetimin gerekçesinin ve izin vermemenin riskler üzerindeki etkisinin değerlendirilmesini ister;
        md. 9 ayrıca kanıt elde edilemezse sonraki adımları düzenler.
      C: BDS 505 md. 7 dış teyit sürecinin denetçi kontrolünde yürütülmesini, md. 8 ise gerektiğinde alternatif prosedür uygulanmasını
        düzenler; olumsuz teyit zorunlu bir tek seçenek değildir.
      D: BDS 505 md. 7 dış teyit taleplerinde teyit edilecek bilginin ve uygun tarafın seçimi ile taleplerin gönderilmesi
        üzerinde denetçi kontrolünü öngörür.
      E: BDS 505 md. 9, uygun ve güvenilir kanıt elde edilememesi hâlinde görüş üzerindeki etkinin değerlendirilmesini açıkça
        düzenler.
  kaynaklar:
  - mevzuat: BDS 505
    madde: md. 7
    alinti: "Dış teyit prosedürlerini uygularken denetçi, dış teyit talepleri üzerinde, aşağıdakiler dâhil\n         olmak\
      \ üzere kontrol sahibi olmak ve bu kontrolü muhafaza etmek zorundadır:\n                Teyit veya talep edilecek bilgilere\
      \ karar verilmesi (Bakınız: A1 paragrafı)."
  - mevzuat: BDS 505
    madde: md. 8
    alinti: "Yönetimin denetçinin teyit talebi göndermesine izin vermemesi durumunda, denetçi:\n                İzin vermeme\
      \ kararıyla ilgili olarak yönetimin gerekçelerine ilişkin sorgulama yapar ve\n                bu gerekçelerin geçerliliği\
      \ ve uygunluğu konusunda denetim kanıtı elde etmeye çalışır"
  - mevzuat: BDS 505
    madde: md. 9
    alinti: "Yönetimin teyit talebi gönderilmesine izin vermeme kararının denetçi tarafından makul\n         bulunmaması veya\
      \ denetçinin alternatif denetim prosedürleri sonucunda ihtiyaca uygun ve\n         güvenilir denetim kanıtı elde etmesinin\
      \ mümkün olmaması durumunda, denetçi BDS 26012\n         uyarınca üst yönetimden sorumlu olanlarla iletişim kurar. Denetçi\
      \ aynı zamanda BDS 705 13\n         uyarınca bu hususun denetim ve denetçi görüşü üzerindeki etkilerine karar verir.\n\
      Dış Teyit Prosedürlerinin Sonuçları\nTeyit Taleplerine Verilen Yanıtların Güvenilirliği"
