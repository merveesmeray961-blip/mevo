- id: SMMM-DEN-PRG-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin yıl sonuna yakın satışlarında olağandışı artış görülmüştür. Denetçi, hasılatın finansal tablolara alınmasında
    hile riskinin bulunduğu varsayımını uygulayarak bu riski ciddi risk olarak değerlendirmiş ve satış kontrollerinin tasarımını
    incelemiştir. Bu bulgular karşısında aşağıdaki denetim yaklaşımından hangisi BDS hükümleriyle uyumludur?
  secenekler:
    A: Hasılat riski varsayıldığından, ayrıca hangi hasılat işlemlerinin veya yönetim beyanlarının riske yol açabileceğini
      belirlemeye gerek yoktur.
    B: Hile riski ciddi risk sayılsa da satış kontrollerinin tasarımının değerlendirilmesi yeterlidir; müteakip prosedürlerin
      niteliği, zamanlaması ve kapsamı ayrıca risklere göre belirlenmez.
    C: Hasılat riski yalnız finansal tablo düzeyinde değerlendirilir; işlem sınıfı ve yönetim beyanı düzeyinde ayrı değerlendirme
      yapılmaz.
    D: Denetçi, hangi hasılat türü, işlemi veya yönetim beyanının riske yol açabileceğini değerlendirir; ciddi risk olarak
      ele aldığı risk için ilgili kontrolleri belirleyip tasarım ve uygulamalarını değerlendirir ve müteakip prosedürlerini
      riske göre tasarlar.
    E: Hasılatta hile riski varsayımı, yalnız yönetimin yazılı beyanının alınmasını gerektirir; kontrollerin değerlendirilmesi
      zorunlu değildir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 240 md. 27 uyarınca hasılatın finansal tablolara alınmasında hile riski bulunduğu varsayımıyla hangi
      hasılat türü, işlemi veya yönetim beyanlarının bu riske yol açabileceği değerlendirilir. Md. 28 uyarınca değerlendirilen
      hile kaynaklı önemli yanlışlık riskleri ciddi risk olarak ele alınır ve ilgili kontroller belirlenerek tasarım ve uygulamaları
      değerlendirilir. BDS 330 md. 6 ise müteakip prosedürlerin niteliği, zamanlaması ve kapsamının değerlendirilen riske
      göre tasarlanmasını ister. Püf noktaları: Hasılat varsayımı tek başına yeterli değildir; önce riskin hangi işlem veya
      beyana ilişkin olduğu belirlenir, ardından ciddi risk için kontrol değerlendirmesi ve riske uygun müteakip prosedürler
      birlikte düşünülür.'
    celdiriciler:
      A: BDS 240 md. 27, varsayımın hangi hasılat türü, işlemi veya yönetim beyanına ilişkin olduğunun ayrıca değerlendirilmesini
        ister.
      B: BDS 240 md. 28 ve BDS 330 md. 6, yalnız kontrol tasarımını değil, riske uygun müteakip denetim prosedürlerinin tasarımını
        da gerektirir.
      C: BDS 240 md. 27, hasılatla ilgili hile riskinin hangi tür hasılat, işlem veya yönetim beyanından kaynaklanabileceğinin
        değerlendirilmesini ister; değerlendirme tek bir düzeye indirgenmez.
      E: BDS 240 ve BDS 330, hile riskine karşı yalnız yazılı beyan alınmasını değil, riskin niteliğine göre denetim işlerinin
        tasarlanmasını gerektirir.
  kaynaklar:
  - mevzuat: BDS 240
    madde: md. 27
    alinti: "Denetçi, hile kaynaklı “önemli yanlışlık” risklerini belirler ve değerlendirirken, hasılatın\n         finansal\
      \ tablolara alınmasında hile risklerinin bulunduğu varsayımıyla, hangi tür hasılatın,\n         hasılat işlemlerinin\
      \ veya yönetim beyanlarının bu tür risklere sebep olabileceğini\n         değerlendirir. 48 inci paragraf denetçinin,\
      \ söz konusu denetimin yapıldığı şartlarda böyle bir"
  - mevzuat: BDS 240
    madde: md. 28
    alinti: "Denetçi, hile kaynaklı “önemli yanlışlık” riski olarak değerlendirdiği riskleri “ciddi riskler”\n         olarak\
      \ ele alır ve bu yüzden, henüz yapılmadıysa, bu tür riskleri ele alan işletme kontrollerini\n         belirler, bunların\
      \ tasarımını değerlendirir ve uygulanıp uygulanmadıklarını belirler9 (Bkz.:\n         A32-A33 paragrafları)."
  - mevzuat: BDS 330
    madde: md. 6
    alinti: "Denetçi; niteliği, zamanlaması ve kapsamı, yönetim beyanı düzeyinde “önemli yanlışlık” riski\n         olarak\
      \ değerlendirilen riskleri esas alan ve söz konusu risklere karşılık veren müteakip denetim\n         prosedürlerini\
      \ tasarlar ve uygular (Bkz.: A4-A8 ve A43-A54 paragrafları)."
