      B: Amortisman bir muhasebe tahmini örneğidir; dış bilgi kaynağı tanımı ayrı bir kavramdır.
      C: Yönetimin yanlılığı ayrı bir kavramdır; amortisman standartta muhasebe tahmini örneği olarak verilir, yanlılık
        göstergesi olarak değil.
