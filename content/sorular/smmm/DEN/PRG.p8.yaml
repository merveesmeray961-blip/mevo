- id: SMMM-DEN-PRG-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: uygulama
  zorluk: 2
  kok: Denetçi, maddi duran varlıkların amortisman giderini incelerken hem analitik prosedür hem de muhasebe tahmininin denetimi
    bakımından bir denetim programı oluşturacaktır. Aşağıdaki işlemlerden hangisi BDS'lere en uygun yaklaşımdır?
  secenekler:
    A: Amortisman tutarı bir muhasebe tahmini sayılamayacağından yalnız belge kontrolü yapılır.
    B: Amortismanı beklenen sonuçlarla karşılaştırmak analitik prosedür kapsamında kullanılabilir; ayrıca risklere karşılık
      olarak yönetimin tahmini nasıl oluşturduğunun test edilmesi de uygun bir müteakip prosedür olabilir.
    C: Amortisman için yalnızca dış teyit alınması gerekir; analitik prosedür kullanılamaz.
    D: Amortismanın denetiminde yalnız cari dönemden sonra gerçekleşen olaylar dikkate alınabilir.
    E: Amortisman tahmini yüksek riskli olsa bile denetçinin prosedürleri her durumda aynı kapsamda olmalıdır.
  dogru: B
  aciklama:
    dogru_neden: BDS 520 A1, amortisman tahmini gibi denetçinin beklentilerinin analitik prosedürlerde karşılaştırma unsuru
      olabileceğini belirtir. BDS 540 A1, maddi duran varlıkların amortismanını muhasebe tahmini örnekleri arasında sayar;
      md. 18 ise risklere karşı müteakip prosedürler arasında yönetimin muhasebe tahminini nasıl oluşturduğunun test edilmesini
      sayar.
    celdiriciler:
      A: BDS 540 A1 amortismanı muhasebe tahminleri arasında açıkça sayar.
      C: BDS 520 A1 amortisman tahminini analitik prosedürlerde kullanılabilecek bir beklenti örneği olarak verir; dış teyit
        zorunluluğu yoktur.
      D: BDS 540 md. 18 tek bir prosedür türüyle sınırlama getirmez; risklere uygun farklı yaklaşımlar öngörür.
      E: BDS 540 md. 18, risk düzeyi yükseldikçe daha ikna edici denetim kanıtı elde edilmesini dikkate alan risk esaslı yaklaşım
        öngörür.
  kaynaklar:
  - mevzuat: BDS 520
    madde: A1
    alinti: "Bütçe veya tahminler gibi işletmenin beklenen sonuçları veya amortisman tahmini gibi\n            denetçinin\
      \ beklentileri."
  - mevzuat: BDS 540
    madde: A1
    alinti: Maddi duran varlıkların amortismanı.
  - mevzuat: BDS 540
    madde: md. 18
    alinti: "       değerlendirmenin nedenlerini de dikkate alarak karşılık verecek mahiyette olmalıdır.\n       Denetçinin\
      \ uygulayacağı müteakip denetim prosedürleri aşağıda yer alan yaklaşımlardan bir\n       veya daha fazlasını içerir:\n\
      \              Denetçi raporu tarihine kadar meydana gelen olaylar hakkında denetim kanıtı elde\n              edilmesi\
      \ (Bkz.: 21 inci paragraf),\n              Yönetimin muhasebe tahminini nasıl oluşturduğunun test edilmesi (Bkz.: 22-27\
