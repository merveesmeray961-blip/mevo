  kok: Bir denetim programında maddi duran varlıkların amortismanına ilişkin bir kalem incelenmektedir. Muhasebe
    tahminlerinin denetimine ilişkin standardın muhasebe tahmini örneklerine göre aşağıdakilerden hangisi doğrudur?
