  kok: (V) AŞ'de yönetimin yıl sonu satış hedeflerini tutturma baskısı altında olduğu ve bazı satış sözleşmelerinde
    teslimatın henüz gerçekleşmediği belirlenmiştir. Denetçi, satışların olduğundan fazla gösterilmesi riskine karşı
    hem sözleşme koşullarını hem de satış verilerini incelemek istemektedir. Hile risklerine ilişkin denetim standardındaki
    hasılat hile riski yaklaşımına göre aşağıdakilerden hangisi en uygun denetim programını yansıtır?
  secenekler:
    A: Satış sözleşmelerinin tarih, iade hakkı ve teslimat şartlarını doğrulamak; satışları iş kolu veya aylara
      göre ayrıştırıp beklentilerle karşılaştırmak
    B: Dönem sonuna yakın satış kayıtlarını, yönetimin hedef gerçekleşme raporuyla karşılaştırmakla yetinmek
    C: Satış faturalarının tutar toplamlarını yeniden hesaplamak; sözleşme şartlarını ve teslimat tarihlerini incelemeden
      kayıtları kabul etmek
    D: Satışları yıllık toplam düzeyinde önceki yılla karşılaştırmak; iş kolu, faaliyet yeri veya aylara göre ayrıştırma
      yapmamak
    E: Satış hesaplarını risk dışı kabul ederek denetim kapsamını stok ve alacak hesaplarında yoğunlaştırmak
  dogru: A
  aciklama:
    dogru_neden: 'Standart hasılatın finansal tablolara alınmasında hile risklerinin bulunduğu varsayımı üzerinde
      durur (md. 27). Açıklayıcı hükümler, satışların olduğundan fazla gösterilmesi riskinde sözleşme tarihleri,
      iade hakkı ve teslimat şartlarının doğrulanmasını ve satışların ayrıştırılarak analitik maddi doğrulama prosedürleriyle
      beklentilerle karşılaştırılmasını örnekler. Püf noktası: ayrıntılı sözleşme doğrulaması ile ayrıştırılmış
      analitik prosedür birlikte düşünülmelidir.'
    celdiriciler:
      B: Yönetimin hedef gerçekleşme raporu bağımsız bir kanıt değildir ve sözleşme şartlarını sınamaz; hile riskine
        karşılık vermez.
      C: Faturaların aritmetik toplamı, teslimatın gerçekleşip gerçekleşmediğini göstermez; sözleşme şartları ve
        teslimat tarihleri incelenmelidir.
      D: Yıllık toplam düzeyindeki karşılaştırma olağan dışı dönem sonu satışlarını yakalayamaz; ayrıştırılmış verilerle
        karşılaştırma gerekir.
      E: Hasılatın finansal tablolara alınmasında hile riskinin bulunduğu varsayımı gereği satış hesapları denetim
        kapsamında kalır ve riske karşılık verilir.
