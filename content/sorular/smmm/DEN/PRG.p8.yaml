- id: SMMM-DEN-PRG-0014
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 3
  kok: (Y) AŞ'nin satış hesabında, yönetimin dönem sonu hedeflerini tutturma baskısı nedeniyle satışların olduğundan
    fazla gösterilmesi riski ciddi olarak değerlendirilmiştir. Özellikle bazı satış sözleşmelerinde teslimattan
    önce faturalama yapıldığı görülmüş, iade ve teslim şartlarının sözleşmeler arasında değiştiği belirlenmiştir.
    Bu risk için hesap bazlı denetim programına aşağıdaki prosedürlerden hangisinin eklenmesi değerlendirilen risklere
    karşı denetçinin yanıtlarına ilişkin standart açısından en uygundur?
  secenekler:
    A: Dönem sonunda ödenmemiş ticari alacakların bakiyelerini teyit etmek, sözleşme ayrıntılarını teyit kapsamına
      almamak ve teslimat şartlarını sorgulamamak.
    B: Satışların tamamını yeniden kaydetmek; ancak teslimat tarihleri ve sözleşme şartlarına ilişkin herhangi bir
      doğrulama yapmamak.
    C: Önceki yıl satış toplamını cari yıl satış toplamıyla karşılaştırmak ve fark bulunmazsa başka prosedür uygulamamak.
    D: Satış sözleşmelerinin tarih, iade ve teslimata ilişkin şartlarını dış teyitle doğrulamak ve değişiklikleri
      finans dışı personele sormak.
    E: Yönetimden satışların döneminde kaydedildiğine ilişkin yazılı beyan almak, dış teyit uygulamamak ve sözleşme
      şartlarını incelememek.
  dogru: D
  aciklama:
    dogru_neden: 'Yönetimin satışları olduğundan fazla gösterme riski, teslimattan önce faturalama ve hâsılatın
      yanlış muhasebeleştirilmesi riskini içerebilir. BDS 330''un A55 paragrafında bu durumda satış sözleşmelerinin
      tarih, iade ve teslim şartları dâhil ayrıntılarının dış teyitle doğrulanması ve finans dışı personelin sorgulanması
      örneklenmektedir. Püf noktaları: Burada yalnız alacak bakiyesinin teyidi yeterli değildir; ciddi riskin kaynağı
      olan teslimat ve sözleşme şartları da test edilmelidir.'
    celdiriciler:
      A: BDS 330 A55'te ciddi satış riskine karşı yalnız ödenmemiş borçların teyidi değil, sözleşme ayrıntılarının
        da doğrulanması örneklenmektedir.
      B: Yeniden kayıt yapmak, A55'te belirtilen tarih, iade ve teslim şartlarının doğrulanması ihtiyacını karşılamaz.
      C: Salt karşılaştırma, sözleşme ve teslim şartlarından doğan ciddi yanlışlık riskini doğrudan araştıran A55'teki
        yaklaşımı karşılamaz.
      E: Yönetim beyanı tek başına, ciddi risk karşısında A55'te örneklenen sözleşme ve teslim şartlarının doğrulanmasının
        yerini tutmaz.
  kaynaklar:
  - mevzuat: BDS 330 “Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler”
    madde: A55
    alinti: "Bu tür durumlarda denetçi, örneğin yalnızca ödenmemiş borçların teyit edilmesi\n     amacıyla değil;\
      \ aynı zamanda tarih, iade ve teslimata ilişkin şartlar da dâhil, satış\n     sözleşmelerinin ayrıntılarını\
      \ teyit etmek için de dış teyit prosedürleri tasarlayabilir. Buna ek\n     olarak denetçi, satış sözleşmelerindeki\
      \ ve teslimat şartlarındaki her türlü değişiklik konusunda\n     işletmedeki finansla ilgili olmayan personeli\
      \ sorgulayarak bu tür dış teyitleri desteklemeyi\n     faydalı bulabilir."
