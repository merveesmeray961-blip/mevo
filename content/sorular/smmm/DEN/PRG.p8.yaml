    henüz gerçekleşmediği belirlenmiştir. Denetçi, satışların olduğundan fazla gösterilmesi riskine karşı hem sözleşme koşullarını
    hem de satış verilerini incelemek istemektedir. BDS 240'taki hasılat hile riski yaklaşımına göre aşağıdakilerden hangisi
    en uygun denetim programını yansıtır?
  secenekler:
    A: Yalnızca dönem sonu banka bakiyelerini incelemek
    B: Yalnızca yönetimden sözlü açıklama almak
    C: Satış sözleşmelerinin tarih, iade hakkı ve teslimat şartlarını doğrulamak; ayrıca satışları iş kolu, faaliyet yeri
      veya aylara göre parçalayarak beklentilerle karşılaştırmak
    D: Yalnızca personel devam çizelgelerini incelemek
    E: Satış hesaplarını denetim dışında bırakmak
  dogru: C
  aciklama:
    dogru_neden: 'BDS 240 md. 27, hasılatın finansal tablolara alınmasında hile risklerinin bulunduğu varsayımıyla ilgili
      risklerin değerlendirilmesini; açıklayıcı hükümler ise satışların olduğundan fazla gösterilmesi riskinde sözleşme tarihleri,
      iade hakkı ve teslimat şartlarının doğrulanmasını ve satışların ayrıştırılarak analitik maddi doğrulama prosedürleriyle
      beklentilerle karşılaştırılmasını örnekler.


      Püf noktaları: Hasılat riski varsayımı ile satış sözleşmelerine yönelik ayrıntılı doğrulama ve ayrıştırılmış analitik
      prosedür birlikte düşünülmelidir.'
