      yönetim beyanlarının bu tür risklere sebep olabileceğini değerlendirir.
  - mevzuat: BDS 240
    madde: A31
    alinti: Örneğin denetçinin, yönetimin kazanç beklentilerini karşılama baskısı altında olduğunu tespit etmesi
      hâlinde; yönetimin, hasılatın finansal tablolara alınmasını engelleyen şartlar içeren satış sözleşmeleri yapmak
      veya satışları teslimattan önce fatura etmek suretiyle satışları olduğundan fazla göstermesi riski bulunabilir.
