- id: SMMM-DEN-PRG-0008
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: bilgi
  zorluk: 1
  kok: Hile risklerine ilişkin denetim standardına göre denetçinin, hasılatın finansal tablolara alınmasında hile
    risklerinin bulunduğu varsayımıyla ilgili olarak yapması gereken temel değerlendirme aşağıdakilerden hangisidir?
  secenekler:
    A: Hangi tür hasılatın, hasılat işlemlerinin veya yönetim beyanlarının hile riskine yol açabileceğini değerlendirmek
    B: Hasılatın hile riski taşıdığı varsayımını, yönetimin yazılı beyanına dayanarak çürütmek
    C: Hasılat hile riskini, tutarı önemlilik düzeyinin üzerinde olan satış işlemleriyle sınırlı olarak değerlendirmek
    D: Hasılat hile riskini, denetim raporunun tarihinden sonra yapılacak kontrollerle değerlendirmek
    E: Hasılat hile riskini finansal tablo dipnotlarındaki açıklamalarla sınırlı olarak değerlendirmek
  dogru: A
  aciklama:
    dogru_neden: Standardın 27. paragrafı, denetçinin hasılatın finansal tablolara alınmasında hile risklerinin
      bulunduğu varsayımıyla hangi tür hasılatın, hasılat işlemlerinin veya yönetim beyanlarının bu risklere sebep
      olabileceğini değerlendirmesini öngörür.
    celdiriciler:
      B: Varsayımın aksi ispat edilebilir (A31), ancak bu yazılı beyanla değil, hasılat doğuran işlemlerin niteliğine
        ilişkin değerlendirmeyle yapılır.
      C: Değerlendirme tutar sınırıyla daraltılmaz; hasılatın türü, işlemleri ve yönetim beyanları dikkate alınır.
      D: Risk değerlendirmesi rapor tarihinden sonraya ertelenmez; denetim sırasında, risklerin belirlenmesi ve
        değerlendirilmesi aşamasında yapılır.
      E: Değerlendirme dipnot açıklamalarıyla sınırlı değildir; hasılat türü ve işlemleri ile yönetim beyanlarını
        kapsar.
  kaynaklar:
