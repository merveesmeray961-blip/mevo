      A: Banka bakiyeleri satışların finansal tablolara alınma koşullarını tek başına test etmez.
      B: Sözlü yönetim açıklaması, sözleşme ve satış verilerine yönelik prosedürlerin yerine geçmez.
      D: Personel devam kayıtları bu satış hilesi riskine doğrudan karşılık veren prosedür değildir.
      E: BDS 240, hasılatın finansal tablolara alınmasına ilişkin hile riskini özellikle ele alır.
