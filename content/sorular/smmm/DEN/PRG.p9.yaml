- id: SMMM-DEN-PRG-0015
  sinav: smmm
  bolum: &id001
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: uygulama
  zorluk: 2
  kok: 'Bir denetim programında amortisman tahminine ilişkin çalışma kâğıtları üç başlık altında düzenlenmiştir: (I) ölçüm
    tekniği, (II) gelecekteki olaylara ilişkin muhakeme, (III) doğrudan gözlem veya işletme dışındaki taraftan elde edilen
    bilgi. BDS 540 terminolojisine göre doğru eşleştirme hangisidir?'
  secenekler:
    A: I-veri, II-yöntem, III-varsayım
    B: I-varsayım, II-veri, III-yöntem
    C: I-yöntem, II-varsayım, III-veri
    D: I-yöntem, II-veri, III-varsayım
    E: I-veri, II-varsayım, III-yöntem
  dogru: C
  aciklama:
    dogru_neden: BDS 540 A2 yöntemi ölçüm tekniği olarak, A3 varsayımları gelecekteki durum veya olaylara ilişkin muhakemeler
      olarak, A4 veriyi ise doğrudan gözlem veya işletme dışındaki taraftan elde edilebilen bilgi olarak tanımlar.
    celdiriciler:
      A: Yöntem ile veri ve varsayım yer değiştirmiştir.
      B: I ölçüm tekniği olduğundan varsayım değildir.
      D: II gelecekteki olaylara ilişkin muhakeme olduğundan veri değildir.
      E: I ölçüm tekniği, III ise veri olduğundan bu eşleştirme yanlıştır.
  kaynaklar:
  - mevzuat: BDS 540
    madde: A2
    alinti: Yöntem; yönetim tarafından, gerekli ölçüm esasına uygun şekilde muhasebe tahmininin oluşturulması için kullanılan
      bir ölçüm tekniğidir.
  - mevzuat: BDS 540
    madde: A3
    alinti: Varsayımlar; faiz oranı seçimi, iskonto oranı seçimi veya gelecekteki durum veya olaylara ilişkin yargılar gibi
      konular hakkındaki mevcut bilgilere dayanan muhakemeleri içerir.
  - mevzuat: BDS 540
    madde: A4
    alinti: Bu BDS’nin amaçları açısından veri, doğrudan gözlem yoluyla veya işletme dışındaki bir taraftan elde edilebilen
      bilgidir.
