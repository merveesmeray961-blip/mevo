      ve yükümlülükleri ve değerlemesi hakkında bazı kanıtlar sağlayabileceğini belirtir.
    celdiriciler:
      A: Açılış bakiyesi için tahsilatı kanıt kaynağı olarak doğru kabul eder.
      B: Açılış bakiyesine ilişkin dört niteliğin kaynakta sayılmasını doğru yansıtır.
      D: Önceki denetçinin çalışma kâğıtlarının uygun hâllerde gözden geçirilebileceği kuralıyla uyumludur.
      E: Cari dönem prosedürlerinin bazı kanıtlar sağlayabileceğini doğru aktarır.
