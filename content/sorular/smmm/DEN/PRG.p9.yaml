  zorluk: 1
  kok: Bir denetçi maddi duran varlıkların amortismanına ilişkin muhasebe tahminini denetlemektedir. BDS 540’a göre aşağıdakilerden
    hangisi **yanlıştır**?
  secenekler:
    A: Maddi duran varlıkların amortismanı bir muhasebe tahmini örneğidir.
    B: Denetçi, muhasebe tahmini oluşturulurken kullanılan yöntemin uygunluğunu değerlendirebilir.
    C: Uygun hâllerde yöntemde önceki döneme göre meydana gelen değişikliklerin uygun olup olmadığı değerlendirilir.
    D: Denetçi, yönetimin muhasebe tahminini nasıl oluşturduğunu test ederken yöntem, önemli varsayımlar ve verilerin seçimi
      ile uygulanmasını dikkate alır.
    E: Denetçi, seçilen yöntemin geçerli finansal raporlama çerçevesi bakımından uygunluğunu değerlendirmek zorunda değildir.
  dogru: E
  aciklama:
    dogru_neden: BDS 540 md. 22-23, yönetimin muhasebe tahminini oluştururken kullandığı yöntemlerin, önemli varsayımların
      ve verilerin seçimi ile uygulanmasının test edilmesini; seçilen yöntemin geçerli finansal raporlama çerçevesi bağlamında
      uygun olup olmadığının ve uygun hâllerde önceki döneme göre değişikliklerin uygunluğunun değerlendirilmesini öngörür.
      Bu nedenle E yanlıştır.
    celdiriciler:
      A: BDS 540 A1 maddi duran varlıkların amortismanını muhasebe tahmini örnekleri arasında sayar.
      B: Md. 23 seçilen yöntemin geçerli finansal raporlama çerçevesi bağlamında uygunluğunun değerlendirilmesini öngörür.
      C: Md. 23 önceki döneme göre meydana gelen değişikliklerin uygunluğunun değerlendirilmesini de içerir.
      D: Md. 22 yöntem, önemli varsayımlar ve verilerin seçimi ile uygulanmasını kapsar.
  kaynaklar:
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: md. 22
    alinti: '22.      Yönetimin muhasebe tahminini nasıl oluşturduğu test edilirken, denetçinin müteakip denetim prosedürleri;
      aşağıdakilerle ilgili “önemli yanlışlık” riskleri hakkında yeterli ve uygun denetim kanıtı elde etmek amacıyla, 23-26
      ncı paragraflara uygun olarak tasarlanan ve uygulanan prosedürleri içerir (Bkz.: A94 paragrafı): Muhasebe tahmini oluştururken
      yönetim tarafından kullanılan yöntemlerin, önemli varsayımların ve verilerin seçimi ile uygulanması ve Yönetimin, nokta
      tahminini nasıl seçtiği ve tahmin belirsizliğine ilişkin ilgili açıklamaları nasıl geliştirdiği.'
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: md. 23
    alinti: '23.      Yöntemlere ilişkin olarak 22 nci paragraf hükümleri uygulanırken, denetçinin müteakip denetim prosedürleri
      aşağıdakileri ele alır: Seçilen yöntemin geçerli finansal raporlama çerçevesi bağlamında uygun olup olmadığı ve -uygun
      hâllerde- önceki döneme göre meydana gelen değişikliklerin uygun olup olmadığı (Bkz.: A95, A97 paragrafları),'
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: A1
    alinti: 'A1.    İşlem sınıfları, hesap bakiyeleri ve açıklamalara ilişkin muhasebe tahminlerinin örnekleri aşağıdakileri
      içerir: •    Stok değer düşüklüğü. •    Maddi duran varlıkların amortismanı.'
