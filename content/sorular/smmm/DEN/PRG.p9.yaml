  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: alacaklar
  tip: kavrama
  zorluk: 3
  kok: Bir denetçi, çok sayıda küçük ve aynı türden hesap bakiyesinden oluşan bir anakitlede olumsuz dış teyit kullanmayı
    planlamaktadır. Aşağıdaki seçeneklerden hangisi **yanlıştır**?
  secenekler:
    A: Denetçinin önemli yanlışlık riskini düşük değerlendirmiş olması gerekir.
    B: Yönetim beyanıyla ilgili kontrollerin işleyiş etkinliğine ilişkin yeterli ve uygun denetim kanıtı elde edilmiş
      olmalıdır.
    C: Beklenen istisna oranının düşük olması gerekir.
    D: Olumsuz teyit taleplerini alan kişilerin talepleri göz ardı etmesine yol açacak durum veya şartların bulunmadığından
      denetçinin haberdar olması gerekir.
    E: Anakitledeki kalemlerin çok sayıda, küçük ve aynı türden olması aranan şartlardan biridir.
  dogru: D
  aciklama:
    dogru_neden: BDS 505 md. 15, olumsuz teyitlerin tek başına maddi doğrulama prosedürü olarak kullanılabilmesi
      için dört koşulun tümünün bulunmasını ister. Bunlardan biri, talepleri alan kişilerin talepleri göz ardı etmesine
      sebep olacak durum veya şartlardan denetçinin haberdar olmamasıdır; D seçeneği bunun tersini söylemektedir.
    celdiriciler:
      A: Düşük risk değerlendirmesi aranan koşullardan biridir.
      B: Kontrollerin işleyiş etkinliğine ilişkin yeterli ve uygun kanıt aranır.
      C: Beklenen istisna oranının düşük olması açık koşuldur.
      E: Anakitlede çok sayıda küçük ve aynı türden kalem bulunması açık koşuldur.
  kaynaklar:
  - mevzuat: BDS 505
    madde: par. 15
    alinti: Olumsuz teyitler, olumlu teyitlere göre daha az ikna edici denetim kanıtı sağlar. Dolayısıyla aşağıdaki
      durumların tümü mevcut olmadıkça, denetçi, yönetim beyanı düzeyinde değerlendirilmiş “önemli yanlışlık” risklerini
      ele almak üzere, olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanamaz
