- id: SMMM-DEN-PRG-0025
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: kavrama
  zorluk: 2
  kok: 'Bir denetim programında satış hesabına ilişkin iki farklı prosedür yer almaktadır:


    I. Satışların ve satış maliyetlerinin iş kolu, faaliyet yeri veya aylara göre ayrıştırılarak denetçinin geliştirdiği
    beklentilerle karşılaştırılması.

    II. İşletmenin üç aylık dönem sonu veya yıl sonu düzeltme kayıtlarının ayrıntılı olarak gözden geçirilmesi.


    Hile risklerine ilişkin denetim standardına göre bu iki prosedürün nitelikleri bakımından aşağıdaki değerlendirmelerden
    hangisi doğrudur?'
  secenekler:
    A: I analitik maddi doğrulama prosedürüdür; II hile riskine karşılık dönem sonu düzeltme kayıtlarının ayrıntılı
      gözden geçirilmesidir.
    B: I bir kontrol testidir; II ise analitik maddi doğrulama prosedürü niteliğindedir.
    C: I analitik maddi doğrulama prosedürüdür; II üçüncü taraflardan bilgi isteyen bir dış teyit prosedürüdür.
    D: I üçüncü taraflardan bilgi isteyen bir dış teyit prosedürüdür; II dönem sonu düzeltme kayıtlarının incelenmesidir.
    E: I ve II birlikte risk değerlendirme prosedürüdür ve ikisi de kontrol ortamının anlaşılmasına yöneliktir.
  dogru: A
  aciklama:
    dogru_neden: Standardın örnekleri, parçalara ayrılmış veriler kullanılarak beklentilerle karşılaştırmayı analitik
      maddi doğrulama prosedürü olarak; dönem sonu düzeltme kayıtlarının ayrıntılı gözden geçirilmesini ise hile
      riskine karşılık uygulanabilecek ayrı bir prosedür olarak verir.
    celdiriciler:
      B: I kontrol testi değil analitik maddi doğrulama prosedürüdür; II de analitik prosedür değil kayıtların gözden
        geçirilmesidir.
      C: II kayıtların kurum içinde ayrıntılı gözden geçirilmesidir; dış teyit prosedürü değildir.
      D: I verilerin ayrıştırılıp beklentiyle karşılaştırılmasıdır; üçüncü taraflardan bilgi istemek değildir.
      E: Her iki prosedür de hile riskine karşılık uygulanan maddi doğrulama niteliğindeki işlerdir; kontrol ortamının
        anlaşılmasına yönelik risk değerlendirme prosedürleri değildir.
    hesap_adimlari: []
  kaynaklar:
