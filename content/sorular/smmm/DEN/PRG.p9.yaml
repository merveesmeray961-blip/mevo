      \ münferit olarak makul olsalar dahi,\n         yönetimin muhtemel taraflılığına ilişkin göstergeler olup olmadıklarını\
      \ değerlendirir.\n         Yönetimin muhtemel taraflılığına ilişkin göstergelerin tespit edilmesi durumunda denetçi,\
      \ bu\n         durumun denetime olan etkilerini değerlendirir. Yanıltma kastı varsa, yönetimin taraflılığı"
