  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: alacaklar
  tip: kavrama
  zorluk: 3
  kok: Bir denetçi ticari alacaklar için dış teyit prosedürünü değerlendirmektedir. Riske karşılık verme standardının
    açıklayıcı hükümlerine göre dış teyitlerin alacaklara ilişkin sağladığı kanıtla ilgili aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Dış teyitler, alacak bakiyelerinin tahsil edilebilirliği ile karşılaştırıldığında var olduğuna ilişkin daha
      az ihtiyaca uygun kanıt sağlar.
    B: Dış teyitler, alacakların var olması ve tahsil edilebilirliği bakımından eşit düzeyde ihtiyaca uygun kanıt
      sağlar.
    C: Dış teyit prosedürü alacaklar için değil, ancak banka hesap bakiyeleri için kullanılabilen bir prosedürdür.
    D: Dış teyitler, alacak bakiyelerinin var olduğuna kıyasla tahsil edilebilir olduğuna ilişkin daha az ihtiyaca
      uygun kanıt sağlar.
    E: Dış teyitler, tahsil edilebilirliğe ilişkin en güçlü kanıtı sağlar; var olmaya ilişkin kanıtı ise sınırlıdır.
  dogru: D
  aciklama:
    dogru_neden: Standardın A51 paragrafı, dış teyitlerin belirli yönetim beyanlarına ilişkin ihtiyaca uygun kanıt
      sağlamasına rağmen, örneğin alacak hesap bakiyelerinin var olduğundan ziyade tahsil edilebilir olduğuna ilişkin
      daha az ihtiyaca uygun kanıt sağladığını belirtir. Teyit edilebilir olmak ile tahsil edilebilir olmak aynı
      yönetim beyanı değildir.
    celdiriciler:
      A: 'Yön tersine çevrilmiştir: teyit, alacağın var olduğuna ilişkin kanıt sağlar; daha az ihtiyaca uygun olduğu
        beyan tahsil edilebilirliktir.'
      B: Standart iki beyan arasında ayrım yapar; teyit varlık bakımından tahsil edilebilirlikten daha ihtiyaca
        uygundur.
      C: Alacak hesapları dış teyit prosedürünün uygulanabildiği alanlar arasında sayılır; prosedür banka bakiyeleriyle
        sınırlı değildir.
      E: Dış teyit, tahsil edilebilirlik için en zayıf kanıt türlerindendir; standart ters yönde bir ayrım yapar.
  kaynaklar:
  - mevzuat: BDS 330
    madde: A50-A51
    alinti: Dış teyitler, belirli yönetim beyanlarına ilişkin ihtiyaca uygun denetim kanıtı sağlamasına rağmen,
      dış teyitlerin daha az ihtiyaca uygun denetim kanıtı sağladığı bazı yönetim beyanları da mevcuttur. Örneğin
      dış teyitler, alacak hesap bakiyelerinin var olduğundan ziyade, tahsil edilebilir olduğuna ilişkin daha az
      ihtiyaca uygun denetim kanıtı sağlar.
