- id: SMMM-DEN-PRG-0018
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: kavrama
  zorluk: 3
  kok: 'Bir denetçi, işletmenin maddi duran varlık amortismanı için yönetimin faydalı ömür ve yöntem seçimlerini incelemektedir.
    BDS 540 kapsamında aşağıdaki öncüllerden hangileri doğrudur?


    I. Maddi duran varlıkların amortismanı muhasebe tahminlerine örnektir.

    II. Tek tek makul görünen yönetim yargıları, birlikte yönetimin muhtemel taraflılığına ilişkin gösterge oluşturabilir.

    III. Yönetimin muhtemel taraflılığına ilişkin gösterge tespit edilirse, bunun denetime etkisi değerlendirilmez.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'BDS 540 amortismanı muhasebe tahminlerine örnek sayar ve yönetimin yargı ve kararlarının muhtemel taraflılığa
      ilişkin gösterge olup olmadığının değerlendirilmesini ister; gösterge varsa etkisi ayrıca değerlendirilir. Püf noktaları:
      Zorlayıcı nokta, amortismanın tahmin niteliği ile yönetim taraflılığı değerlendirmesini aynı muhakemede birleştirmektir.'
    celdiriciler:
      A: II'yi dışlayarak eksik bırakır.
      B: I'i dışlayarak amortismanın muhasebe tahmini niteliğini reddeder.
      D: III'ü doğru kabul eder; oysa standart etki değerlendirmesini zorunlu kılar.
      E: III nedeniyle yanlış kombinasyon oluşturur.
