  zorluk: 3
  kok: 'Bir işletmenin ticari alacaklarının teyidinde denetçi, olumsuz teyit kullanmayı düşünmektedir. Aşağıdaki
    koşulların tümünün mevcut olduğu bir durumda hangi yöntem BDS 505''e uygundur?

    I. Önemli yanlışlık riski düşük değerlendirilmiş ve ilgili kontrollerin işleyiş etkinliğine ilişkin yeterli
    ve uygun kanıt elde edilmiştir.

    II. Anakitle çok sayıda küçük ve aynı türden hesap bakiyesinden oluşmaktadır.

    III. Beklenen istisna oranı düşüktür.

    IV. Teyit talebini alanların talepleri göz ardı etmesine yol açacak durum veya şartlardan denetçi haberdar değildir.'
  secenekler:
    A: Yalnız I ve II
    B: Yalnız II ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: E
  aciklama:
    dogru_neden: BDS 505 md. 15 olumsuz teyitlerin tek başına maddi doğrulama prosedürü olarak kullanılabilmesi
      için sayılan dört koşulun tümünün mevcut olmasını arar.
    celdiriciler:
      A: III ve IV de zorunlu koşullardır.
      B: I eksik bırakılmıştır.
      C: IV de aranır.
      D: I de aranır.
  kaynaklar:
  - mevzuat: BDS 505
    madde: md. 15
    alinti: 'Olumsuz teyitler, olumlu teyitlere göre daha az ikna edici denetim kanıtı sağlar. Dolayısıyla aşağıdaki
      durumların tümü mevcut olmadıkça, denetçi, yönetim beyanı düzeyinde değerlendirilmiş “önemli yanlışlık” risklerini
      ele almak üzere, olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanamaz (Bakınız:
      A23 paragrafı):'
  - mevzuat: BDS 505
    madde: md. 15
    alinti: Beklenen istisna oranının düşük olması,
