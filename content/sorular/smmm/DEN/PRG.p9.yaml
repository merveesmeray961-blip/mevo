  secenekler:
    A: Denetçi, bu olağan dışı veya beklenmeyen ilişkinin hile kaynaklı önemli yanlışlık riskine işaret edip etmediğini
      değerlendirir.
    B: Hasılat hesaplarıyla ilgili olağan dışı ilişkiler de bu değerlendirmenin kapsamındadır.
    C: Olağan dışı bir ilişkinin bulunması, tek başına hilenin gerçekleştiğini kesin olarak gösterir.
    D: Değerlendirmenin sonucu, hile kaynaklı önemli yanlışlık risklerinin belirlenmesinde ve değerlendirilmesinde
