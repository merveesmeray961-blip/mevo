- id: SMMM-DEN-PRG-0017
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: uygulama
  zorluk: 2
  kok: 'Denetçi, maddi duran varlık amortisman tahminini incelerken önceki dönem tahmininin sonucunu da gözden geçirmektedir.
    Aşağıdaki ifadelerden hangileri muhasebe tahminlerine ilişkin denetim standardına uygundur?


    I. Önceki tahminlerin sonuçları cari dönemdeki önemli yanlışlık risklerinin belirlenmesine yardımcı olabilir.

    II. Gözden geçirmenin amacı, geçmişte mevcut bilgilerle uygun biçimde yapılmış bir tahminin isabetini sonradan
    sorgulamaktır.

    III. Gözden geçirmenin niteliği ve kapsamı muhasebe tahminlerinin özellikleri dikkate alınarak belirlenir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: BDS 540 md. 14, önceki tahminlerin sonuçlarının cari dönem önemli yanlışlık risklerinin belirlenmesine
      yardımcı olmak için gözden geçirileceğini ve kapsamın tahminlerin özelliklerine göre belirleneceğini söyler.
      Gözden geçirmenin amacı uygun geçmiş yargıları sonradan sorgulamak değildir.
    celdiriciler:
      A: III de doğrudur; kapsam tahminlerin özelliklerine göre belirlenir.
      B: II, standardın açıkça reddettiği bir amaçtır.
      C: II yanlıştır.
      D: I doğrudur, II yanlıştır.
  kaynaklar:
  - mevzuat: BDS 540 Muhasebe Tahminlerinin ve İlgili Açıklamaların Bağımsız Denetimi
    madde: md. 14
    alinti: "yardımcı olması amacıyla önceki muhasebe tahminlerinin sonuçlarını ya da -uygun hâllerde-\n       \
      \  söz konusu tahminlere ilişkin oluşturulan sonraki tahminleri gözden geçirir. Söz konusu\n         gözden\
      \ geçirmenin niteliğine ve kapsamına karar verirken denetçi, muhasebe tahminlerinin\n         özelliklerini\
      \ dikkate alır. Gözden geçirme faaliyetinde amaç, tahminlerin yapıldığı zamanda\n         mevcut olan bilgilere\
      \ dayandığında uygun olan önceki dönem muhasebe tahminlerine ilişkin\n         varılmış yargılar hakkında\
      \ şüphe oluşturmak değildir (Bkz.: A55-A60 paragrafları)."
