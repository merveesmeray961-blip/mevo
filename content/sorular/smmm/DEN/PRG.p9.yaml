- id: SMMM-DEN-PRG-0026
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: kavrama
  zorluk: 2
  kok: İki işletmede maddi duran varlık amortismanı denetimi yapılmaktadır. Alfa AŞ'de varlıkların faydalı ömrü
    ve kalıntı değeri yüksek belirsizlik içeren yönetim tahminlerine dayanmaktadır. Beta AŞ'de ise tahmin belirsizliği
    ve karmaşıklık çok düşüktür. Muhasebe tahminlerinin denetimine ilişkin standart bakımından denetim prosedürlerinin
    kapsamı karşılaştırıldığında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Beta'da tahmin belirsizliği düşük olduğundan amortisman için herhangi bir denetim prosedürü uygulanması gerekmez.
    B: Alfa'da tahmin belirsizliği yüksek olduğundan daha kapsamlı risk değerlendirme ve müteakip denetim prosedürleri
      beklenir.
    C: İki işletmede de müteakip prosedürlerin kapsamı, tahmin belirsizliğinden bağımsız olarak aynı tutulur.
    D: Alfa'da amortisman yönetimin yargısına dayandığından denetçi, yönetimin tahmini yerine kendi nokta tahminini
      esas alır.
    E: Beta'da tahmin belirsizliği düşük olduğundan denetçi, risk değerlendirmesi yapmadan doğrudan sonuç prosedürlerine
      geçer.
  dogru: B
  aciklama:
    dogru_neden: Standart, muhasebe tahminlerinin tahmin belirsizliğine maruz kalma derecesine göre risk değerlendirmesinin
      ve müteakip prosedürlerin niteliğinin, zamanlamasının ve kapsamının değişeceğini; belirsizlik yüksek olduğunda
      prosedürlerin daha kapsamlı olmasının beklendiğini belirtir. Maddi duran varlıkların amortismanı da muhasebe
      tahmini örnekleri arasındadır.
    celdiriciler:
      A: Düşük belirsizlik prosedürlerin kapsamını azaltabilir ancak denetimi ortadan kaldırmaz; muhasebe tahminleri
        her durumda denetim kapsamındadır.
      C: Prosedürlerin kapsamı tahmin belirsizliğine ve değerlendirilen önemli yanlışlık risklerine göre farklılaşır.
      D: Nokta tahmin geliştirmek seçeneklerden biridir; yönetimin yargısına dayanması denetçinin yönetimin tahminini
        incelemesini engellemez.
      E: Belirsizlik düşük olsa bile risk değerlendirmesi yapılır; yalnızca prosedürlerin kapsamı buna göre ölçeklenir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 540 Muhasebe Tahminlerinin ve İlgili Açıklamaların Bağımsız Denetimi
    madde: md. 3, A1
    alinti: denetim prosedürleri, tahmin belirsizliğine ve ilgili “önemli yanlışlık” risklerinin
