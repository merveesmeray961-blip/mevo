- id: SMMM-DEN-PRG-0030
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: amortisman denetimi
  tip: kavrama
  zorluk: 1
  kok: Bir denetçi maddi duran varlıkların amortismanına ilişkin muhasebe tahminini denetlemektedir. Muhasebe tahminlerinin
    denetimine ilişkin standarda göre aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Maddi duran varlıkların amortismanı bir muhasebe tahmini örneğidir.
    B: Uygun hâllerde yöntemde önceki döneme göre meydana gelen değişikliklerin uygun olup olmadığı değerlendirilir.
    C: Yönetimin tahmini nasıl oluşturduğu test edilirken yöntem, önemli varsayımlar ve verilerin seçimi ile uygulanması
      dikkate alınır.
    D: Müteakip prosedürler, hesaplamaların seçilen yönteme uygun ve matematiksel olarak doğru yapılıp yapılmadığını
      da ele alır.
    E: Seçilen yöntemin geçerli finansal raporlama çerçevesi bakımından uygunluğu, denetçinin değerlendirmesi gereken
      bir konu değildir.
  dogru: E
  aciklama:
    dogru_neden: Standardın 22 ve 23. paragrafları, yönetimin muhasebe tahminini oluştururken kullandığı yöntemlerin,
      önemli varsayımların ve verilerin seçimi ile uygulanmasının test edilmesini; seçilen yöntemin geçerli finansal
      raporlama çerçevesi bağlamında uygun olup olmadığının ve uygun hâllerde önceki döneme göre değişikliklerin
      uygunluğunun değerlendirilmesini öngörür. Bu nedenle E **yanlıştır**.
    celdiriciler:
      A: 'Doğrudur: A1 paragrafı maddi duran varlıkların amortismanını muhasebe tahmini örnekleri arasında sayar.'
      B: 'Doğrudur: 23. paragraf önceki döneme göre meydana gelen değişikliklerin uygunluğunun değerlendirilmesini
        de içerir.'
      C: 'Doğrudur: 22. paragraf yöntem, önemli varsayımlar ve verilerin seçimi ile uygulanmasını kapsar.'
      D: 'Doğrudur: 23. paragraf hesaplamaların yönteme uygun ve matematiksel olarak doğru olup olmadığının da ele
        alınmasını ister.'
  kaynaklar:
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: md. 22
    alinti: '22.      Yönetimin muhasebe tahminini nasıl oluşturduğu test edilirken, denetçinin müteakip denetim
      prosedürleri; aşağıdakilerle ilgili “önemli yanlışlık” riskleri hakkında yeterli ve uygun denetim kanıtı elde
      etmek amacıyla, 23-26 ncı paragraflara uygun olarak tasarlanan ve uygulanan prosedürleri içerir (Bkz.: A94
      paragrafı): Muhasebe tahmini oluştururken yönetim tarafından kullanılan yöntemlerin, önemli varsayımların
      ve verilerin seçimi ile uygulanması ve Yönetimin, nokta tahminini nasıl seçtiği ve tahmin belirsizliğine ilişkin
      ilgili açıklamaları nasıl geliştirdiği.'
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: md. 23
    alinti: '23.      Yöntemlere ilişkin olarak 22 nci paragraf hükümleri uygulanırken, denetçinin müteakip denetim
      prosedürleri aşağıdakileri ele alır: Seçilen yöntemin geçerli finansal raporlama çerçevesi bağlamında uygun
      olup olmadığı ve -uygun hâllerde- önceki döneme göre meydana gelen değişikliklerin uygun olup olmadığı (Bkz.:
      A95, A97 paragrafları),'
  - mevzuat: BDS 540 Muhasebe Tahminleri ve İlgili Açıklamalar
    madde: A1
    alinti: 'A1.    İşlem sınıfları, hesap bakiyeleri ve açıklamalara ilişkin muhasebe tahminlerinin örnekleri aşağıdakileri
      içerir: •    Stok değer düşüklüğü. •    Maddi duran varlıkların amortismanı.'
