- id: SMMM-DEN-PRG-0020
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin satış denetim programında hasılatın gerçekleşmesi ve dönem sonu satışlarının uygun döneme kaydedilmesi
    riskleri ele alınmaktadır. Aşağıdaki prosedürlerden hangisi BDS 240'ta belirtilen hasılat risklerine karşı önerilen yaklaşım
    ile **uyumlu değildir**?
  secenekler:
    A: Cari dönem hasılatının ay, ürün veya iş kolu bazında önceki dönem verileriyle karşılaştırılması.
    B: Yan sözleşmelerin bulunmadığının ve teslimat, ödeme, iade gibi sözleşme şartlarının müşterilerle teyit edilmesi.
