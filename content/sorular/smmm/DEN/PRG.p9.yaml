- id: SMMM-DEN-PRG-0028
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Hesap bazlı denetim programları
  konu: PRG
  kazanim: satışlar
  tip: uygulama
  zorluk: 2
  kok: Bir işletmede dönem sonuna yakın satışlarda olağandışı ilişkiler tespit edilmiştir. Hile risklerine ilişkin
    denetim standardına göre analitik prosedürlerde belirlenen olağan dışı ilişkilerin değerlendirilmesine dair
    aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Olağan dışı veya beklenmeyen ilişkilerin hile kaynaklı önemli yanlışlık risklerine işaret edip etmediği değerlendirilir.
    B: Hasılat hesaplarıyla ilgili olağan dışı ilişkiler de bu değerlendirmenin kapsamındadır.
    C: Değerlendirmenin sonucu, hile kaynaklı önemli yanlışlık risklerinin belirlenmesi ve değerlendirilmesinde
      dikkate alınır.
    D: İlgili satış tutarının mutlak büyüklüğü düşükse olağan dışı ilişki hile riski bakımından değerlendirme dışı
      bırakılır.
    E: Bir ilişkinin hile riskine işaret etmesi hilenin gerçekleştiğini kanıtlamaz; ancak risk değerlendirmesine
      yansıtılır.
  dogru: D
  aciklama:
    dogru_neden: Standardın 23. paragrafı, analitik prosedürlerin uygulanması sırasında belirlenen, hasılat hesaplarıyla
      ilgili olanlar dahil olağan dışı veya beklenmeyen ilişkilerin hile kaynaklı önemli yanlışlık risklerine işaret
      edip etmediğinin değerlendirilmesini ister. Tutarın mutlak büyüklüğüne dayalı bir dışlama hükümde yoktur;
      bu nedenle D **yanlıştır**.
    celdiriciler:
      A: 'Doğrudur: 23. paragraf bu değerlendirmeyi açıkça ister.'
      B: 'Doğrudur: hükümde hasılat hesaplarıyla ilgili ilişkiler özellikle anılmıştır.'
      C: 'Doğrudur: değerlendirme, hile kaynaklı önemli yanlışlık risklerinin belirlenmesi ve değerlendirilmesi
        sürecinin parçasıdır.'
      E: 'Doğrudur: ilişkinin varlığı risk göstergesidir, hilenin gerçekleştiğinin kanıtı değildir.'
  kaynaklar:
