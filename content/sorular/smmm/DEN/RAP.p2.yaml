- id: SMMM-DEN-RAP-0053
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 706 diğer hususlar paragrafı
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, denetimin nasıl yürütüldüğüne ilişkin ve finansal tablolarda sunulmayan bir hususun, kullanıcıların denetçinin
    sorumluluklarını anlamaları açısından rapora eklenmesi gerektiğini düşünmektedir. Mevzuat bunu yasaklamamaktadır ve husus
    kilit denetim konusu olarak belirlenmemiştir. BDS 706'ya göre denetçi bu hususu raporunda hangi bölümde bildirir?
  secenekler:
    A: “Dikkat Çekilen Hususlar” başlıklı ayrı bir bölümde
    B: “Diğer Hususlar” veya uygun başka bir başlık altındaki ayrı bir bölümde
    C: Kilit denetim konusu olarak Kilit Denetim Konuları bölümünde ayrıntılı biçimde
    D: “Görüşün Dayanağı” bölümünde
    E: “Yönetimin Finansal Tablolara İlişkin Sorumlulukları” bölümünde
  dogru: B
  aciklama:
    dogru_neden: 'BDS 706 md. 10 uyarınca finansal tablolarda sunulan veya açıklananlar dışında kalan ve kullanıcıların denetimi,
      denetçinin sorumluluklarını veya raporu anlamalarıyla ilgili hususlar için (mevzuat yasaklamamış ve husus KDK olarak
      belirlenmemişse) Diğer Hususlar paragrafı eklenir; md. 11 uyarınca bu paragraf “Diğer Hususlar” veya uygun başka bir
      başlık altında ayrı bir bölümde yer alır. Püf noktaları: Dikkat Çekilen Hususlar paragrafı yalnızca finansal tablolarda
      sunulan veya açıklanan hususlar içindir; burada husus tablolarda yer almamaktadır.'
    celdiriciler:
      A: Dikkat Çekilen Hususlar paragrafı md. 8 uyarınca finansal tablolarda sunulan veya açıklanan hususlar içindir.
      C: KDK bölümü md. 10(b) uyarınca yalnızca kilit denetim konusu olarak belirlenen hususlar içindir; husus KDK değildir.
      D: Görüşün Dayanağı bölümü görüşün temelini açıklar; md. 11 diğer hususlar için ayrı bölüm ister.
      E: Yönetimin sorumlulukları bölümü yönetimin sorumluluğuna ilişkindir; diğer hususlar paragrafının yeri değildir.
  kaynaklar:
  - mevzuat: BDS 706 Dikkat Çekilen Hususlar ve Diğer Hususlar Paragrafları
    madde: md. 10
    alinti: Denetçinin, muhakemesine göre, kullanıcıların; denetimi, denetçinin sorumluluklarını veya denetçi raporunu anlamalarıyla
      ilgili olan ve finansal tablolarda sunulan veya açıklananlar dışındaki bir hususun denetçi raporunda bildirilmesinin
      gerekli olduğunu düşünmesi durumunda,
  - mevzuat: BDS 706 Dikkat Çekilen Hususlar ve Diğer Hususlar Paragrafları
    madde: md. 11
    alinti: Denetçi, raporuna Diğer Hususlar paragrafı eklediğinde, “Diğer Hususlar” ya da uygun başka bir başlık altında
      ayrı bir bölüm oluşturmak suretiyle, denetçi raporunda söz konusu paragrafa yer verir
