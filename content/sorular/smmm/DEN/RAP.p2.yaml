- id: SMMM-DEN-RAP-0032
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 700 olumlu görüş ifadeleri
  tip: kavrama
  zorluk: 1
  kok: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama standardına göre, gerçeğe uygun sunum çerçevesine uygun
    hazırlanan finansal tablolara olumlu görüş verilirken, mevzuatta aksi zorunlu kılınmadıkça kullanılabilen ve “gerçeğe
    uygun bir biçimde sunmaktadır” ifadesine eş değer kabul edilen ifade aşağıdakilerden hangisidir?
  secenekler:
    A: “…tüm önemli yönleriyle geçerli finansal raporlama çerçevesine uygun olarak hazırlanmıştır.”
    B: “…hata veya hile kaynaklı hiçbir yanlışlık içermemektedir.”
    C: “…işletmenin iç kontrol sisteminin etkin işlediğini göstermektedir.”
    D: “…işletmenin sürekliliğinin devam edeceğini garanti etmektedir.”
    E: “…tüm önemli yönleriyle doğru ve gerçeğe uygun bir görünüm sağlamaktadır.”
  dogru: E
  aciklama:
    dogru_neden: 'BDS 700 md. 25 uyarınca gerçeğe uygun sunum çerçevesinde olumlu görüş verilirken birbirine eş değer kabul
      edilen iki ifadeden biri kullanılır: finansal tabloları gerçeğe uygun bir biçimde sunmaktadır veya doğru ve gerçeğe
      uygun bir görünüm sağlamaktadır.'
    celdiriciler:
      A: Bu ifade, md. 26'da uygunluk çerçevesi için öngörülen ifadedir; gerçeğe uygun sunum çerçevesindeki eş değer ifade
        değildir.
      B: Denetim makul güvence sağlar; hata veya hile kaynaklı hiçbir yanlışlık bulunmadığına ilişkin mutlak güvence verilmez.
      C: BDS 700'de görüş, iç kontrolün etkinliğine ilişkin bir sonuç niteliği taşımaz; iç kontrol değerlendirmesi görüş amacı
        değildir.
      D: Süreklilik konusunda garanti verilmez; denetçi raporu işletmenin geleceğine ilişkin güvence niteliği taşımaz.
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: md. 25
    alinti: 'Bir gerçeğe uygun sunum çerçevesine uygun olarak hazırlanan finansal tablolara ilişkin olumlu görüş verilirken,
      mevzuatta aksi zorunlu kılınmadıkça, denetçi görüşünde birbirine eş değer kabul edilen aşağıdaki ifadelerden biri kullanılır:'
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: md. 25
    alinti: uygun olarak doğru ve gerçeğe uygun bir görünüm sağlamaktadır
  gecerlilik:
    baslangic: '2021-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
