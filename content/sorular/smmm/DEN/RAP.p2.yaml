  tip: uygulama
  zorluk: 3
  kok: Denetçi, birden fazla belirsizlik bulunan istisnai bir denetimde her bir belirsizliğe ilişkin yeterli ve uygun denetim
    kanıtı elde etmiştir. Ancak belirsizliklerin muhtemel etkileşimi ve finansal tablolar üzerindeki kümülatif etkileri nedeniyle
    finansal tablolara ilişkin görüş oluşturmanın mümkün olmadığı sonucuna varmıştır. BDS 705'e göre denetçi hangi görüşü
    verir?
