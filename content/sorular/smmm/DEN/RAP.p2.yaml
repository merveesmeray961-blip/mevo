  kok: BDS 700 uyarınca düzenlenen bağımsız denetçi raporunun denetçinin sorumluluklarına ilişkin bölümünde, hile ve hata
    kaynaklı önemli yanlışlıkların tespit edilememe riski bakımından aşağıdakilerden hangisi belirtilir?
  secenekler:
    A: Hata kaynaklı önemli bir yanlışlığı tespit edememe riski, hile kaynaklı olandan daha yüksektir.
    B: Hile ve hata kaynaklı yanlışlıkların tespit edilememe riskleri birbirine eşittir.
    C: Hile kaynaklı yanlışlıklar yalnızca borsada işlem gören işletmelerde tespit edilemeyebilir.
    D: Hile kaynaklı yanlışlığı tespit edememe riski, hata kaynaklı olandan daha yüksektir.
    E: Hile kaynaklı yanlışlıkların tespit edilememe riski, iç kontrol etkin olduğunda sıfırdır.
  dogru: D
  aciklama:
    dogru_neden: BDS 700 md. 39 uyarınca hile; muvazaa, sahtekârlık, kasıtlı ihmal, gerçeğe aykırı beyan veya iç kontrol ihlali
      fiillerini içerebildiğinden, hile kaynaklı önemli bir yanlışlığı tespit edememe riski hata kaynaklı olandan daha yüksektir.
    celdiriciler:
      A: Standart ters yönde bir ifade kullanır; yüksek olan hile kaynaklı yanlışlığı tespit edememe riskidir.
      B: Standart iki riski eşit saymaz; hile gizleme unsuru taşıdığı için riski daha yüksek kabul eder.
      C: Hile riskine ilişkin bu ifade işletmenin borsada işlem görüp görmemesine bağlı değildir.
      E: İç kontrol etkin olsa bile iç kontrol ihlali fiilleri mümkün olduğundan risk sıfıra inmez.
  kaynaklar:
