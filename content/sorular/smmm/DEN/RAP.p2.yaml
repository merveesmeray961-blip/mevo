    B: Olumsuz görüş verir.
    C: Olumlu görüş verir ve belirsizlikleri Dikkat Çekilen Hususlar paragrafında açıklar.
    D: Görüş vermekten kaçınır.
    E: Olumlu görüş verir ve belirsizlikleri kilit denetim konusu olarak bildirir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 705 md. 10 uyarınca denetçi, birden fazla belirsizlik içeren istisnai durumlarda, belirsizliklerin her
      birine ilişkin yeterli ve uygun kanıt elde edilmiş olmasına bağlı kalmaksızın, muhtemel etkileşim ve kümülatif etkiler
      nedeniyle görüş oluşturmanın mümkün olmadığı sonucuna varırsa görüş vermekten kaçınır. Püf noktaları: Her belirsizlik
      için kanıt elde edilmiş olması sonucu değiştirmez; belirleyici olan kümülatif etkidir. Olumlu görüşle verilen Dikkat
      Çekilen Hususlar veya KDK, bu durumda çözüm değildir.'
    celdiriciler:
      A: Sınırlı olumlu görüş, md. 10'daki kümülatif etki durumunda öngörülen sonuç değildir.
      B: Olumsuz görüş yeterli ve uygun kanıt elde edilen ve etkisi yaygın bulunan yanlışlık için verilir (md. 8); burada
        yanlışlık değil belirsizlik söz konusudur.
      C: Görüş oluşturmanın mümkün olmadığı durumda olumlu görüş verilemez; Dikkat Çekilen Hususlar paragrafı bunu telafi
        etmez.
