    D: Önceki dönem tablolarının önceki denetçi tarafından denetlendiğini ve önceki denetçinin sorumluluğu devraldığını
    E: Önceki dönem tablolarının denetlenmemiş olduğunu ve karşılık gelen bilgilere güvenilemeyeceğini
