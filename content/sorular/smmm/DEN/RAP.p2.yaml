    sonucuna varmıştır. Finansal tablolarda bu belirsizliğe ilişkin yeterli açıklama yapılmamıştır. BDS 570'e göre denetçi,
    raporunun Sınırlı Olumlu (veya Olumsuz) Görüşün Dayanağı bölümünde ne belirtir?
