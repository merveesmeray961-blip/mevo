      C: Kanıt elde edilemeden olumlu görüş verilemez; Diğer Hususlar paragrafı bunun yerine geçmez.
      D: Md. 13(b)(ii) rapor düzenlenmesini öngörür ve bu rapordaki görüş türünü görüş vermekten kaçınma olarak belirler.
