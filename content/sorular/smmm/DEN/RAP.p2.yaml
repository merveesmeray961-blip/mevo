- id: SMMM-DEN-RAP-0055
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 710 karşılaştırmalı bilgiler
  tip: kavrama
  zorluk: 2
  kok: BDS 710 Karşılaştırmalı Bilgiler standardına göre önceki döneme ait bilgilere ilişkin aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Karşılık gelen bilgiler sunulduğunda, istisnai durumlar dışında denetçi görüşünde bu bilgilere atıfta bulunulmaz.
    B: Karşılaştırmalı finansal tablolar sunulduğunda denetçi görüşü, hakkında görüş verilen her döneme atıf yapar.
    C: Önceki döneme ait tablolar denetlenmemişse denetçi, Diğer Hususlar paragrafında karşılık gelen bilgilerin denetlenmemiş
      olduğunu açıklar.
    D: Önceki döneme ait tablolar denetlenmemişse yapılan açıklama, denetçinin açılış bakiyelerine ilişkin yeterli ve uygun
      kanıt elde etme sorumluluğunu ortadan kaldırır.
    E: Önceki döneme ait tablolar önceki denetçi tarafından denetlenmişse ve atıf mevzuatla yasaklanmamışsa, Diğer Hususlar
      paragrafında önceki denetçinin görüş türü ve rapor tarihi belirtilir.
  dogru: D
  aciklama:
    dogru_neden: BDS 710 md. 14 uyarınca önceki döneme ait finansal tabloların denetlenmemiş olduğunu açıklamak, denetçinin
      açılış bakiyelerinin cari dönem tablolarını önemli derecede etkileyen yanlışlıklar içerip içermediği hakkında yeterli
      ve uygun kanıt elde etme sorumluluğunu ortadan kaldırmaz.
    celdiriciler:
      A: Bu ifade doğrudur; md. 10 karşılık gelen bilgilere görüşte atıf yapılmamasını öngörür.
      B: Bu ifade doğrudur; md. 15 görüşün sunulan her döneme atıf yapmasını ister.
      C: Bu ifade doğrudur; md. 14 denetlenmemiş olma durumunun Diğer Hususlar paragrafında açıklanmasını ister.
      E: Bu ifade doğrudur; md. 13 Diğer Hususlar paragrafında (a) denetlenmiş olduğunun, (b) görüş türünün, (c) rapor tarihinin
        belirtilmesini ister.
  kaynaklar:
  - mevzuat: BDS 710 Karşılaştırmalı Bilgiler
    madde: md. 14
    alinti: Bununla birlikte bu tür bir açıklama denetçinin, açılış bakiyelerinin cari döneme ait finansal tabloları önemli
      derecede etkileyen yanlışlıklar içerip içermediği hakkında yeterli ve uygun denetim kanıtı elde etme sorumluluğunu ortadan
