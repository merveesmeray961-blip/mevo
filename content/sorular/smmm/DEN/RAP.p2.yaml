    dönem denetçisi, karşılık gelen bilgilere ilişkin olarak önceki denetçinin raporuna atıfta bulunmayı düşünmektedir; bu
    atıf mevzuatla yasaklanmamıştır. BDS 710 md. 13'e göre cari dönem denetçisi raporunun Diğer Hususlar paragrafında aşağıdakilerden
    hangisini belirtir?
