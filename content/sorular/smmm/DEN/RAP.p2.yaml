    C: Konuyu üst yönetime iletir ve alternatif prosedürlerle kanıt elde edilip edilemeyeceğine karar verir.
    D: Konuyu yalnızca yönetime yazılı olarak bildirir ve sözleşmeyi hemen sona erdirir.
