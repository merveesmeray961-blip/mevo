    yol açabilecek şekilde denetimin kapsamını sınırladığını fark etmiş ve sınırlamanın kaldırılmasını istemiştir. Yönetim
    bu isteği reddetmiştir. BDS 705'e göre denetçi aşağıdakilerden hangisini yapar? (Üst yönetimden sorumlu olanların tamamı
    yönetimde icrai görev üstlenmemiştir.)
