- id: SMMM-DEN-RAP-0052
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 705 görüş vermekten kaçınma
  tip: kavrama
  zorluk: 3
  kok: Denetçi yeterli ve uygun denetim kanıtı elde edemediği için finansal tablolara ilişkin görüş vermekten kaçınmaktadır.
    BDS 705'e göre denetçi raporunda aşağıdakilerden hangisine **yer verilmez**?
  secenekler:
    A: Görüş bölümünde, ilişikteki finansal tablolara ilişkin görüş bildirilmediğine (verilmediğine) dair açıklama
    B: Görüş Vermekten Kaçınmanın Dayanağı başlıklı bölüm
    C: Kanıtların görüşe dayanak oluşturmaya yeterli ve uygun olup olmadığına ilişkin açıklama
    D: Denetçinin bağımsızlığına ve etiğe ilişkin diğer sorumluluklarına dair açıklama
    E: Denetçinin finansal tabloları denetlemek üzere görevlendirildiğini belirten açıklama
  dogru: C
  aciklama:
    dogru_neden: 'BDS 705 md. 26 uyarınca görüş vermekten kaçınılması durumunda raporda; denetçinin sorumluluklarının açıklandığı
      bölüme yönelik atıf ile elde edilen kanıtların görüş için yeterli ve uygun dayanak oluşturup oluşturmadığına ilişkin
      açıklamaya yer verilmez. Püf noktaları: Aynı durumda bağımsızlık ve etik açıklaması korunur (md. 28(c)); “denetlenmiş”
      ifadesi ise “denetlemek üzere görevlendirilmiş” olarak değiştirilir (md. 19).'
    celdiriciler:
      A: Md. 19, görüş bölümünde finansal tablolara ilişkin görüş bildirilmediğinin belirtilmesini ister.
      B: Md. 20 Görüşün Dayanağı bölümünün başlığının “Görüş Vermekten Kaçınmanın Dayanağı” olarak değiştirilmesini ister.
      D: Bağımsızlık ve etik açıklaması md. 28(c) uyarınca sorumluluk bölümünde yer almaya devam eder.
      E: Md. 19, “denetlenmiş” ifadesinin görevlendirildiğini belirten ifadeyle değiştirilmesini ister; bu ifade raporda yer
        alır.
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: md. 26
    alinti: 'Denetçinin finansal tablolara ilişkin bir görüş vermekten kaçınması durumunda, denetçi raporunda BDS 700’ün 28(b)
      ve 28(ç) paragraflarında zorunlu kılınan aşağıdaki unsurlara yer verilmez: Denetçinin sorumluluklarının açıklandığı
      bölüme yönelik atıf. Elde edilen denetim kanıtlarının, denetçi görüşünün oluşturulması için yeterli ve uygun bir dayanak
      oluşturup oluşturmadığı hakkında bir açıklama'
  gecerlilik:
    baslangic: '2021-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        not: 'denetçi: tek doğru, güncel hüküm (Kasım 2026)'
        tarih: '2026-11-02'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
