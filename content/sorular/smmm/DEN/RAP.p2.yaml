- id: SMMM-DEN-RAP-0036
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 700 denetçinin sorumlulukları bölümü
  tip: uygulama
  zorluk: 3
  kok: Bir denetimde denetçi, finansal tabloların denetimiyle birlikte işletmenin iç kontrolünün etkinliğine ilişkin bir görüş
    verme sorumluluğunu da üstlenmiştir. BDS 700'e göre bu durumda denetçi raporunun finansal tabloların denetimine ilişkin
    sorumluluklar bölümünde aşağıdakilerden hangisi yapılır?
  secenekler:
    A: İç kontrol değerlendirmesinin etkinliğe ilişkin görüş verme amacı taşımadığını belirten ifade rapora aynen konulur.
    B: İç kontrol değerlendirmesinin etkinliğe ilişkin görüş verme amacı taşımadığını belirten ifade rapordan çıkarılır.
    C: İç kontrole ilişkin bütün açıklamalar, rapordan çıkarılarak Diğer Hususlar paragrafına taşınır.
    D: Yönetimin iç kontrolden sorumlu olduğunu belirten açıklama rapordan çıkarılır.
    E: İç kontrol değerlendirmesinin yalnızca bağımsızlık açıklamasıyla birlikte sunulması yeterli sayılır.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 700 md. 39(b)(ii) uyarınca denetçinin finansal tabloların denetimiyle birlikte iç kontrolün etkinliğine
      ilişkin görüş verme sorumluluğunun da bulunduğu durumlarda, değerlendirmenin etkinliğe ilişkin görüş verme amacı taşımadığı
      yönündeki ifade denetçi tarafından rapordan çıkarılır. Püf noktaları: Bu ifade yalnızca iç kontrol hakkında görüş verilmeyen
      denetimlerde raporda kalır; iki görüş birlikte verildiğinde ifade çıkarılır. Yönetimin iç kontrol sorumluluğu ise ayrı
      bir bölümde (md. 34) yer almaya devam eder.'
    celdiriciler:
      A: İfade çıkarılır; çünkü iki görüşün birlikte verildiği durumda iç kontrol değerlendirmesi etkinlik görüşünün amacına
        da hizmet eder.
      C: Yalnızca söz konusu ifade çıkarılır; iç kontrole ilişkin diğer açıklamalar Diğer Hususlar paragrafına taşınmaz.
      D: Yönetimin iç kontrol sorumluluğuna ilişkin açıklama md. 34(a) gereği raporda yer almaya devam eder.
      E: Standartta böyle bir çözüm öngörülmemiştir; çıkarılması gereken tek unsur söz konusu ifadedir.
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: md. 39(b)(ii)
    alinti: Denetçinin finansal tabloların denetimiyle birlikte iç kontrolün etkinliğine ilişkin bir görüş verme sorumluluğunun
