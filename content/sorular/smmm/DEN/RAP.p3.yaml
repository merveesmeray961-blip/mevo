- id: SMMM-DEN-RAP-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 701 kilit denetim konularının belirlenmesi ve bildirilmesi; BDS 705 ile etkileşim
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Borsada işlem görmeyen ancak 6102 sayılı Türk Ticaret Kanunu uyarınca bağımsız denetime tabi olan (R) AŞ''nin denetiminde
    denetçi şu sonuçlara ulaşmıştır:

    - Stok sayımına katılamamış ve alternatif prosedürlerle yeterli ve uygun kanıt elde edememiştir; olası yanlışlıkların
    etkisi önemli olmakla birlikte yaygın bir etki yaratmamaktadır ve denetçi sınırlı olumlu görüş vermiştir.

    - Ticari alacak karşılıkları, yüksek tahmin belirsizliği içeren, üst yönetimden sorumlu olanlarla iletişim kurulmuş ve
    denetimde azami dikkat gerektirmiş bir konudur; denetçi bunu denetimde en çok önem arz eden konulardan biri olarak belirlemiştir.

    - Şirket hakkında devam eden bir idari soruşturma da aynı şekilde en çok önem arz eden konulardan biridir. Mevzuat konunun
    kamuya açıklanmasını yasaklamamaktadır; denetçi açıklamanın olumsuz sonuçlarının kamu yararını aşacağını düşünmekte, ancak
    şirket soruşturma hakkında kamuya bilgi açıklamıştır.

    BDS 701 "Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi" ve BDS 705 standartlarına göre aşağıdakilerden
    hangisi doğrudur?'
  secenekler:
    A: Üç konu da denetçi raporunun Kilit Denetim Konuları bölümünde, her biri için konunun kilit denetim konusu olarak belirlenme
      sebebi ve denetimde nasıl ele alındığı belirtilerek açıklanır.
    B: Stok konusu Kilit Denetim Konuları bölümünde açıklanmaz, bu bölümde Sınırlı Olumlu Görüşün Dayanağı bölümüne atıf yapılır;
      ticari alacak karşılıkları ve idari soruşturma konuları ise sebep ve denetimde ele alınış biçimiyle birlikte açıklanır.
    C: Stok ve idari soruşturma konuları Kilit Denetim Konuları bölümünde açıklanmaz; denetçi yalnızca ticari alacak karşılıkları
      konusunu sebep ve ele alınış biçimiyle birlikte açıklar.
    D: Stok konusu Kilit Denetim Konuları bölümünde açıklanmaz; ancak şirket borsada işlem görmediğinden diğer konular da
      dahil olmak üzere hiçbir kilit denetim konusu raporda bildirilmez.
    E: Stok konusu görüşün dayanağı bölümünde açıklandığından raporda Kilit Denetim Konuları bölümü düzenlenmez; ticari alacak
      karşılıkları ve idari soruşturma konuları Diğer Hususlar paragrafında yer alır.
  dogru: B
  aciklama:
    dogru_neden: 'Üç adımda çözülür. (1) BDS 701 par. 5T''ye göre TTK uyarınca yapılan bağımsız denetimlerde standart, borsada
      işlem görüp görmediğine bakılmaksızın denetime tabi tüm şirketler için uygulanır; dolayısıyla (R) AŞ''nin raporunda
      da kilit denetim konuları bölümü gerekir. (2) Par. 12 ve 15''e göre BDS 705 uyarınca olumlu görüş dışında görüş verilmesine
      neden olan konu (stok), nitelik itibarıyla kilit denetim konusudur; ancak Kilit Denetim Konuları bölümünde açıklanmaz,
      bunun yerine ilgili BDS''ye uygun olarak raporlanır ve bu bölümde Sınırlı Olumlu Görüşün Dayanağı bölümüne atıf yapılır.
      (3) Alacak karşılıkları par. 9''daki ölçütlere (yüksek tahmin belirsizliği içeren muhasebe tahminleri, önemli yargılar)
      uyan, üst yönetimden sorumlu olanlarla iletişim kurulan ve en çok önem arz eden konudur; par. 13 uyarınca sebebi ve
      denetimde nasıl ele alındığı açıklanır. Soruşturma konusunda par. 14''teki istisna (olumsuz sonuçların kamu yararını
      aşması) işletmenin konu hakkında kamuya bilgi açıklaması hâlinde uygulanmaz; bu nedenle konu da açıklanır.


      Püf noktaları: Burada üç ayrı hüküm birlikte okunur: olumlu görüş dışındaki görüşe neden olan konu KDK bölümünde anlatılmaz
      (par. 12 ve 15), standardın kapsamı TTK denetimlerinde tüm şirketlere uzanır (5T) ve "kamu yararı" istisnası, işletme
      konuyu zaten kamuya açıklamışsa çalışmaz (par. 14, son cümle). Tuzaklar: sınırlı olumlu görüşe neden olan konuyu da
      KDK olarak anlatmak; borsada işlem görmeyen şirkette KDK bölümü gerekmediğini sanmak; kamu yararı istisnasını işletmenin
      açıklamasına rağmen uygulamak.'
    celdiriciler:
      A: Olumlu görüş dışında görüş verilmesine neden olan stok konusu par. 12 ve 15 uyarınca Kilit Denetim Konuları bölümünde
        açıklanmaz; yalnızca ilgili bölüme atıf yapılır.
      C: İşletme soruşturma konusunda kamuya bilgi açıkladığından par. 14'teki istisna uygulanmaz ("işletmenin konu hakkında
        kamuya bilgi açıklaması hâlinde, bu hüküm uygulanmaz"); soruşturma konusu da bildirilir.
      D: Par. 5T'ye göre standart, TTK uyarınca bağımsız denetime tabi tüm şirketlerin denetiminde uygulanır; borsada işlem
        görmemek, kilit denetim konularının bildirilmesini ortadan kaldırmaz.
      E: Par. 15'e göre olumlu görüş dışında görüşe neden olan konu için Kilit Denetim Konuları bölümü düzenlenir ve bu bölümde
        Sınırlı Olumlu Görüşün Dayanağı bölümüne atıf yapılır; bölümün hiç düzenlenmemesi söz konusu değildir. Diğer kilit
        denetim konuları da Diğer Hususlar paragrafında değil, Kilit Denetim Konuları bölümünde açıklanır (par. 11 ve 13).
  kaynaklar:
  - mevzuat: TDS BDS 701 Kilit Denetim Konuları
    madde: par. 5T
    alinti: 6102 sayılı Türk Ticaret Kanunu uyarınca yapılan bağımsız denetimlerde bu BDS denetime tabi tüm şirketlerin finansal
      tablolarının denetiminde uygulanır.
  - mevzuat: TDS BDS 701 Kilit Denetim Konuları
    madde: par. 12
    alinti: BDS 705 uyarınca olumlu görüş dışında bir görüş vermesi gerektiği durumda denetçi, bu görüşün verilmesine sebep
      olan konuyu raporunun Kilit Denetim Konuları bölümünde bildirmez
  - mevzuat: TDS BDS 701 Kilit Denetim Konuları
    madde: par. 14
    alinti: Konuyu kamuya açıklamanın doğuracağı olumsuz sonuçların, kamuya açıklamanın doğuracağı kamu yararını aşacağının
      makul şekilde beklendiği oldukça istisnai durumlarda, denetçinin ilgili hususun denetçi raporunda bildirilmemesine karar
      vermesi. İşletmenin konu hakkında kamuya bilgi açıklaması hâlinde, bu hüküm uygulanmaz.
  - mevzuat: TDS BDS 701 Kilit Denetim Konuları
    madde: par. 15
    alinti: BDS 705 uyarınca olumlu görüş dışında bir görüş verilmesine neden olan bir konu veya BDS 570 uyarınca işletmenin
      sürekliliğini devam ettirme kabiliyetine ilişkin ciddi şüphe oluşturabilecek olay veya şartlarla ilgili önemli bir belirsizlik,
      nitelikleri itibarıyla kilit denetim konularıdır.
  - mevzuat: TDS BDS 701 Kilit Denetim Konuları
    madde: par. 13
    alinti: Konunun denetimde en çok önem arz eden konu olarak değerlendirilmesinin yani kilit denetim konusu olarak belirlenmesinin
      sebebi
  gecerlilik:
    baslangic: '2020-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden püf noktalarında standart paragrafı için kullanılan ''(md. 12/15)'' atfı ''(par. 12
      ve 15)'' olarak düzeltildi. Kök/şık değişmedi.'
    neden: 'G6: BDS paragrafları ''madde'' değil ''paragraf'' olarak atıflanır.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: B (güven 5) BDS 701 p.5T (TTK kapsamında tüm şirketlerde uygulanır), p.15 (görüş değişikliğine yol
          açan konu KDK bölümünde açıklanmaz, Sınırlı Olumlu Görüşün Dayanağı''na atıf), p.14 (işletme konuyu kamuya açıkladıysa
          bildirmeme istisnası uygulanmaz, idari soruşturma açıklanır).'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok (anahtar B): 5T gereği TTK denetiminde borsada işlem görmeyen şirkette de KDK bildirilir; par. 12 ve
          15 gereği sınırlı olumlu görüşe neden olan stok konusu KDK bölümünde açıklanmaz, Sınırlı Olumlu Görüşün Dayanağı
          bölümüne atıf yapılır; par. 14 son cümlesi gereği işletme açıkladığından kamu yararı istisnası uygulanmaz. A, C,
          D, E kesin yanlış.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: alıntılar BDS 701 par. 5T, 12, 13, 14, 15 ile birebir; yalnız ''md.'' atfı ''par.''
          olarak düzeltildi.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (B, güven 2)
      G2:
