- id: SMMM-DEN-RAP-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 720 diğer bilgilere ilişkin sorumluluklar ve TTK yıllık faaliyet raporu (Türkiye uygulaması)
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: BDS 720 "Bağımsız Denetçinin Diğer Bilgilere İlişkin Sorumlulukları" standardının Türkiye uygulamasına (T kodlu paragraflar)
    göre, 6102 sayılı Türk Ticaret Kanunu kapsamında yürütülen bağımsız denetimde yıllık faaliyet raporundaki diğer bilgilere
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Diğer bilgilerin denetimi sonucunda finansal tablolara ilişkin denetçi raporundan ayrı olarak "Yönetim Kurulunun Yıllık
      Faaliyet Raporuna İlişkin Denetçi Raporu" düzenlenir.
    B: Denetçi, diğer bilgilerin bir bütün olarak önemli bir yanlışlık içerip içermediği konusunda makul güvence elde etmekle
      yükümlüdür.
    C: Diğer bilgilerin finansal tablolarla veya denetçinin denetim sırasında elde ettiği bilgilerle tutarlı olmaması ya da
      gerçeğe uygun olmaması da yanlışlık kapsamında değerlendirilir.
    D: Denetçi, yıllık faaliyet raporundaki finansal bilgilerin ve işletmenin durumu hakkındaki irdelemelerin denetlenen tam
      set finansal tablolarla tutarlı olup olmadığı ve gerçeği yansıtıp yansıtmadığı hakkında görüş bildirir.
    E: Denetçinin finansal tablolara ilişkin verdiği görüş diğer bilgileri de kapsadığından, denetçinin diğer bilgilere ilişkin
      ayrıca makul güvence elde etmesi gerekmez.
  dogru: E
  aciklama:
    dogru_neden: BDS 720 par. 2'ye göre denetçinin finansal tablolara ilişkin verdiği görüş diğer bilgileri kapsamaz. Türkiye
      uygulamasında ise 8T paragrafı, TTK uyarınca yapılan yıllık faaliyet raporunun bağımsız denetiminde denetçiye diğer
      bilgilerin bir bütün olarak önemli yanlışlık içerip içermediği konusunda makul güvence elde etme yükümlülüğü getirir;
      bu sonuç 2T uyarınca ayrı bir raporla bildirilir. E şıkkı, görüşün diğer bilgileri kapsadığını ve ayrıca güvence gerekmediğini
      söylediği için yanlıştır.
    celdiriciler:
      A: 'Doğrudur: BDS 720 par. 2T diğer bilgilerin denetimi sonucunda TTK çerçevesinde ayrı bir rapor (Yönetim Kurulunun
        Yıllık Faaliyet Raporuna İlişkin Denetçi Raporu) düzenlendiğini belirtir.'
      B: 'Doğrudur: BDS 720 par. 8T, TTK uyarınca yapılan yıllık faaliyet raporunun denetiminde denetçinin makul güvence elde
        etmekle yükümlü olduğunu belirtir.'
      C: 'Doğrudur: BDS 720 par. 12(bT), TTK uyarınca diğer bilgilerin tutarlı olmamasının veya gerçeğe uygun olmamasının
        da yanlışlık kapsamında değerlendirildiğini belirtir.'
      D: 'Doğrudur: BDS 720 par. 2T, ayrı raporda finansal bilgilerin ve işletmenin durumu hakkındaki irdelemelerin finansal
        tablolarla tutarlı olup olmadığı ve gerçeği yansıtıp yansıtmadığı hakkında görüş bildirileceğini belirtir.'
  kaynaklar:
  - mevzuat: TDS BDS 720 Diğer Bilgilere İlişkin Sorumluluklar
    madde: par. 2
    alinti: Denetçinin finansal tablolara ilişkin verdiği görüş diğer bilgileri kapsamadığı gibi, bu BDS, denetçinin finansal
      tablolara ilişkin görüş oluşturması için gerekenden başka denetim kanıtı elde etmesini de zorunlu tutmaz.
  - mevzuat: TDS BDS 720 Diğer Bilgilere İlişkin Sorumluluklar
    madde: par. 2T
    alinti: Diğer bilgilerin denetimi sonucunda 6102 sayılı Türk Ticaret Kanunu (TTK) çerçevesinde ayrı bir rapor (Yönetim
      Kurulunun Yıllık Faaliyet Raporuna İlişkin Denetçi Raporu) düzenlenir. Denetçi, yıllık faaliyet raporunun denetimini
      BDS’lere uygun olarak yürütür. Yıllık faaliyet raporuna ilişkin denetçi raporunda, yıllık faaliyet raporunda yer alan
      finansal bilgilerin ve işletmenin durumu hakkındaki irdelemelerin denetlenen tam set finansal tablolarla ve bağımsız
      denetim sırasında elde edilen bilgilerle tutarlı olup olmadığı ve gerçeği yansıtıp yansıtmadığı hakkında bir görüş bildirilir.
  - mevzuat: TDS BDS 720 Diğer Bilgilere İlişkin Sorumluluklar
    madde: par. 8T
    alinti: TTK uyarınca yapılan yıllık faaliyet raporunun bağımsız denetiminde denetçi diğer bilgilerin bir bütün olarak
      önemli bir yanlışlık içerip içermediği konusunda makul güvence elde etmekle yükümlüdür.
  - mevzuat: TDS BDS 720 Diğer Bilgilere İlişkin Sorumluluklar
    madde: par. 12(bT)
    alinti: TTK uyarınca diğer bilgilerin, finansal tablolarla ve denetçinin denetim sırasında elde ettiği bilgilerle tutarlı
      olmaması veya gerçeğe uygun olmaması da yanlışlık kapsamında değerlendirilir.
