      sınırlı olumlu görüş (şartlı görüş), olumsuz görüş ve görüş vermekten kaçınma.'
    celdiriciler:
      A: Dikkat çekilen hususlar paragrafı bir görüş türü değil, görüşü değiştirmeyen bir raporlama aracıdır.
      C: Olumlu görüş, olumlu görüş dışındaki türler arasında sayılmaz; sınırlı olumlu görüş de eksiktir.
      D: Olumlu görüş, olumlu görüş dışında verilebilecek türlerden değildir; görüş vermekten kaçınma da eksiktir.
      E: Diğer hususlar paragrafı bir görüş türü değildir; olumsuz görüş de eksiktir.
  kaynaklar:
