      C: Kilit denetim konuları cari döneme ilişkindir; önceki dönem raporundaki hususlarla ilgisi tanımda yoktur.
      E: İç kontrol zayıflıkları ve hile bildirimleri tanımın ölçütü değildir; ölçüt, denetimde en çok önem arz
