- id: SMMM-DEN-RAP-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 700
  tip: bilgi
  zorluk: 1
  kok: Finansal tablolara ilişkin görüş oluşturma ve raporlama standardına göre bağımsız denetçinin görüş oluşturma
    ve raporlama sorumluluğu çerçevesinde aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetçi, yeterli ve uygun denetim kanıtı elde edemese de yönetimin yazılı beyanlarına dayanarak olumlu görüş
      oluşturabilir.
    B: Olumlu görüş dışındaki görüş türleri, borsada işlem gören işletmelerin denetimiyle sınırlı olarak kullanılabilir.
    C: Rapor, denetim sözleşmesini imzalayan yönetim organına hitaben düzenlenir; diğer kullanıcılar için ayrı rapor
      gerekir.
    D: Denetçi, finansal tabloların geçerli finansal raporlama çerçevesine uygun hazırlanıp hazırlanmadığı hakkında
      görüş oluşturur.
    E: Denetçi, görüşünü oluştururken gerçeğe uygun sunumu değil, kayıtların aritmetik doğruluğunu değerlendirir.
  dogru: D
  aciklama:
    dogru_neden: Standart, denetçinin elde edilen denetim kanıtlarından çıkarılan sonuçların değerlendirilmesine
      dayanarak finansal tablolara ilişkin görüş oluşturmasını ve finansal tabloların geçerli finansal raporlama
      çerçevesine uygun olarak hazırlanıp hazırlanmadığı hakkında görüş bildirmesini gerektirir.
    celdiriciler:
      A: Görüş, yeterli ve uygun denetim kanıtına dayanır; yönetim beyanı yeterli kanıt eksikliğini gidermez.
      B: Sınırlı olumlu, olumsuz görüş ve görüş vermekten kaçınma, işletmenin borsada işlem görüp görmemesine bakılmaksızın
        denetim sonuçlarına göre verilir.
      C: Rapor, finansal tabloların hedef kullanıcıları için düzenlenir; yalnızca sözleşmeyi imzalayan organa hitap
        etmez.
      E: Denetçi, finansal tabloların geçerli çerçeveye uygunluğunu ve gerçeğe uygun sunumunu değerlendirir; değerlendirme
        aritmetik doğrulukla sınırlı değildir.
  kaynaklar:
  - mevzuat: BDS 700
    madde: 6. paragraf
    alinti: Elde edilen denetim kanıtlarından çıkarılan sonuçların değerlendirilmesine dayanarak finansal tablolara
      ilişkin görüş oluşturmak
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R4/R5/R6/R7: çeldiriciler yenilendi, mutlak ifadeler kaldırıldı, doğru şık kısaltıldı;
          kökten numara çıkarıldı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_DEN.yaml, satır Grok_DEN-2026-10-06-G02 #15'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-09'
