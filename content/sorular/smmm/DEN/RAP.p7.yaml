    dışında verilebilecek görüş türleri aşağıdakilerden hangisidir?
  secenekler:
    A: Sınırlı olumlu görüş, olumsuz görüş ve dikkat çekilen hususlar paragrafı
    B: Sınırlı olumlu görüş (şartlı görüş), olumsuz görüş ve görüş vermekten kaçınma
    C: Olumlu görüş, olumsuz görüş ve görüş vermekten kaçınma
    D: Olumlu görüş, sınırlı olumlu görüş ve olumsuz görüş
