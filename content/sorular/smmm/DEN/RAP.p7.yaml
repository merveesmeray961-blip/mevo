      çıkarıldı'
- id: SMMM-DEN-RAP-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: '701'
  tip: bilgi
  zorluk: 2
  kok: Kilit denetim konularının bağımsız denetçi raporunda bildirilmesine ilişkin standarda göre bu bildirimin
    temel amacı aşağıdakilerden hangisidir?
  secenekler:
    A: Denetçi görüşünün türünü belirlemek ve olumlu görüş dışındaki görüşün gerekçelerini ayrıntılandırmak
    B: Yürütülen denetime ilişkin şeffaflığı artırarak raporun kullanıcılarının denetimi anlamasına yardımcı olmak
    C: Denetim sırasında saptanan iç kontrol eksikliklerini yönetime bildirerek düzeltilmesini sağlamak
    D: Denetçinin belirlediği önemlilik tutarını ve kullandığı örneklem yöntemini kullanıcılara açıklamak
    E: Sınırlı olumlu görüş verildiği hâllerde görüşe konu olan hususları zorunlu olarak ayrıntılı biçimde açıklamak
  dogru: B
  aciklama:
    dogru_neden: Standardın 2. paragrafı, kilit denetim konularının bildirilmesinin amacını, yürütülen denetime
      ilişkin daha fazla şeffaflık sağlayarak denetçi raporunun iletişim değerinin artırılması ve kullanıcıların
      denetimi anlamasına yardımcı olunması olarak belirtir. KDK bildirimi görüşü değiştirmez; şeffaflık ve iletişim
      aracıdır.
    celdiriciler:
      A: Kilit denetim konularının bildirilmesi görüş türünü belirlemez; görüş türü ayrı bir standarda göre verilir.
      C: İç kontrol eksikliklerinin iletilmesi ayrı bir standardın konusudur; amaç yönetime bildirim değil, rapor
        kullanıcılarına şeffaflıktır.
      D: Önemlilik tutarının veya örneklem yönteminin açıklanması bildirimin amacı değildir; amaç denetimin anlaşılmasına
        yardımcıdır.
      E: Olumlu görüş dışında görüşe neden olan konular Kilit Denetim Konuları bölümünde açıklanmaz, görüşün dayanağı
        bölümünde yer alır.
  kaynaklar:
  - mevzuat: BDS 701
    madde: paragraf 2
    alinti: Kilit denetim konularının bildirilmesinin amacı, yürütülen denetime ilişkin daha fazla şeffaflık sağlayarak
      denetçi raporunun iletişim değerinin artırılmasıdır. Kilit denetim konularının bildirilmesi, denetçinin mesleki
      muhakemesine göre, cari döneme ait finansal tabloların denetiminde en çok önem arz eden konuların anlaşılmasında
      finansal tabloların hedef kullanıcılarına (“hedef kullanıcılar”) ilâve bilgiler sağlar.
