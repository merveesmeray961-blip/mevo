- id: SMMM-DEN-RAP-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: '701'
  tip: bilgi
  zorluk: 2
  kok: BDS 701'e göre kilit denetim konularının denetçi raporunda bildirilmesinin temel amacı aşağıdakilerden hangisidir?
  secenekler:
    A: Denetçi görüşünün türünü değiştirmektir.
    B: Yürütülen denetime ilişkin daha fazla şeffaflık sağlamak ve kullanıcıların denetimi anlamasına yardımcı olmaktır.
    C: Yönetim organına iç kontrol eksikliklerini bildirmektir.
    D: Önemlilik tutarını kamuya açıklamaktır.
    E: Sınırlı olumlu görüş verildiğinde zorunlu açıklama yapmaktır.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 701 paragraf 2''ye göre kilit denetim konularının bildirilmesinin amacı, yürütülen denetime ilişkin
      daha fazla şeffaflık sağlamak ve böylece denetçi raporunun kullanıcılarına denetimi anlamalarında yardımcı olmaktır.
      Püf noktaları: KDK bildirimi görüşü değiştirmez; şeffaflık ve iletişim aracıdır.'
    celdiriciler:
      A: KDK bildirimi görüş türünü değiştirmez.
      C: İç kontrol eksiklikleri BDS 265 kapsamındadır.
      D: Önemlilik tutarı KDK olarak bildirilmesi zorunlu değildir.
      E: Görüş vermekten kaçınma durumunda KDK bildirimi yasaktır; sınırlı olumlu görüşte de özel kural vardır.
  kaynaklar:
  - mevzuat: BDS 701
    madde: paragraf 2
    alinti: Kilit denetim konularının bildirilmesinin amacı, yürütülen denetime ilişkin daha fazla şeffaflık sağlayarak denetçi
      raporunun iletişim değerinin artırılmasıdır. Kilit denetim konularının bildirilmesi, denetçinin mesleki muhakemesine
      göre, cari döneme ait finansal tabloların denetiminde en çok önem arz eden konuların anlaşılmasında finansal tabloların
      hedef kullanıcılarına (“hedef kullanıcılar”) ilâve bilgiler sağlar.
