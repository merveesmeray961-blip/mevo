- id: SMMM-DEN-RAP-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 700
  tip: bilgi
  zorluk: 1
  kok: BDS 700'e göre bağımsız denetçinin finansal tablolar hakkında görüş oluşturma ve raporlama sorumluluğu çerçevesinde
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetçi, finansal tabloların geçerli finansal raporlama çerçevesine uygun olarak hazırlanıp hazırlanmadığı hakkında
      görüş oluşturmak zorundadır.
    B: Denetçi yalnızca olumlu görüş bildirebilir; diğer görüş türleri yasaktır.
    C: Rapor, yalnızca yönetim organına hitaben yazılır.
    D: Görüş oluşturmak için denetim kanıtı toplanması zorunlu değildir.
    E: BDS 700 yalnızca KAYİK denetimlerinde uygulanır.
  dogru: A
  aciklama:
    dogru_neden: BDS 700, denetçinin finansal tabloların geçerli finansal raporlama çerçevesine uygun olarak hazırlanıp hazırlanmadığı
      hakkında bir görüş oluşturmasını gerektirir.
    celdiriciler:
      B: Olumsuz, şartlı görüş ve görüş bildirmekten kaçınma mümkündür (BDS 705).
      C: Rapor genellikle genel kurula veya hissedarlara hitaben yazılır; BDS 700'e göre kullanıcılar içindir.
      D: Yeterli ve uygun kanıt esastır.
      E: Tüm finansal tablo denetimlerinde uygulanır.
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolar Hakkında Görüş Oluşturma ve Raporlama
    madde: '6'
    alinti: 'Denetçinin amaçları: Elde edilen denetim kanıtlarından çıkarılan sonuçların değerlendirilmesine dayanarak finansal
      tablolara ilişkin görüş oluşturmak ve Yazılı bir rapor aracılığıyla açık bir biçimde bu görüşü ifade etmektir.'
  gecerlilik:
    baslangic: '2017-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
