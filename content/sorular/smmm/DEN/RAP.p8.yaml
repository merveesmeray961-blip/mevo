      bu hususun açıklanmasını öngörür. Püf noktaları: Belirsizliğin varlığı tek başına görüşün değişmesi anlamına
      gelmez; burada belirleyici olan açıklamanın yetersizliği ve etkisinin önemli ve yaygın olmasıdır.'
    celdiriciler:
      A: BDS 570/23, yeterli açıklama yapılmadığında olumlu görüşü zorunlu kılmaz.
      B: BDS 570 görüş türünü belirler; rapor düzenlenmemesi şeklinde bir sonuç öngörmez.
      C: Yetersiz açıklama için düzenlenen hüküm sınırlı olumlu veya olumsuz görüşü öngörür; otomatik olarak kaçınma
        sonucu doğmaz.
