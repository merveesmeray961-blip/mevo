  zorluk: 2
  kok: Denetçi, işletmenin yıllık faaliyet raporundaki diğer bilgilerden bazı tutarları finansal tablolardaki tutarlarla
    karşılaştırdığında önemli bir tutarsızlık şüphesiyle karşılaşmıştır. Diğer bilgilere ilişkin standarda göre
    ilk aşamada aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Diğer bilgiler denetimin kapsamı dışında olduğundan denetçi tutarsızlık şüphesini araştırmaz ve rapora yansıtmaz.
    B: Denetçi yönetimden yazılı beyan alır ve tutarları finansal tablolardaki karşılıklarıyla karşılaştırmayı gerekli
      görmez; tutarlılığı değerlendirmez.
    C: Denetçi diğer bilgilerin biçimsel olarak düzgün olup olmadığını inceler; tutar karşılaştırması yapmaz ve
      tutarlılığı değerlendirmez.
    D: Denetçi, seçilen tutarları finansal tablolardaki karşılıklarıyla karşılaştırır ve elde ettiği bilgilerle
      tutarlılığı da değerlendirir.
    E: Denetçi diğer bilgilerin denetim raporuyla aynı ifadeleri içerip içermediğini kontrol eder; tutar karşılaştırması
      yapmaz.
  dogru: D
  aciklama:
    dogru_neden: BDS 720 md. 14, denetçinin diğer bilgileri incelerken finansal tablolarla önemli tutarsızlık olup
      olmadığını mütalaa etmesini ve bu amaçla seçilen tutar veya kalemleri finansal tablolardaki karşılıklarıyla
      karşılaştırmasını; ayrıca diğer bilgiler ile denetim sırasında elde edilen bilgiler arasındaki önemli tutarsızlığı
      değerlendirmesini öngörür.
    celdiriciler:
      A: BDS 720 md. 14, diğer bilgilerin finansal tablolar ve denetim sırasında elde edilen bilgilerle tutarlılığının
        incelenmesini öngörür; diğer bilgiler tamamen işlem dışı değildir.
      B: BDS 720 md. 14 doğrudan karşılaştırma ve tutarlılık değerlendirmesi öngörür; yalnız yazılı beyanla yetinilmez.
      C: BDS 720 md. 14 finansal bilgiler arasındaki önemli tutarsızlığa odaklanır; inceleme biçimsel uygunlukla
        sınırlı değildir.
      E: BDS 720 md. 14, yalnız raporla aynı ifadeleri aramayı değil, finansal tablolar ve denetim sırasında elde
        edilen bilgilerle önemli tutarlılığı değerlendirmeyi öngörür.
  kaynaklar:
  - mevzuat: BDS 720
    madde: md. 14
    alinti: "Denetçi diğer bilgileri inceler ve bunu yaparken (Bkz.: A23-A24 paragrafları):\n      (a)   Diğer bilgiler\
      \ ile finansal tablolar arasında önemli bir tutarsızlık olup olmadığını mütalaa\n            eder. Bu mütalaaya\
      \ dayanak oluşturmak ve söz konusu tutar veya diğer kalemlerin\n            tutarlılığını değerlendirmek amacıyla,\
      \ diğer bilgilerden seçilen tutar veya diğer\n            kalemleri (finansal tablolardaki tutarlar veya diğer\
      \ kalemlerle aynı olması, bunları\n            özetlemesi veya bunlar hakkında daha fazla ayrıntı sunması\
