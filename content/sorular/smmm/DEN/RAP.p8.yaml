    temel teşkil edecek derecede önemli olduğunu değerlendiriyor. Bu husus olumlu görüş dışında bir görüş verilmesini gerektirmiyor
    ve BDS 701 uygulandığı hâlde kilit denetim konusu olarak belirlenmemiştir. BDS 706'ya göre denetçi ne yapmalıdır?
