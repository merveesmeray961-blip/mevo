    şartlarla ilgili önemli bir belirsizlik bulunduğunu belirlemiştir. Finansal tablolarda bu belirsizliğe ilişkin
    yeterli açıklama yapılmamıştır ve denetçi, bu eksikliğin denetim konusu üzerindeki etkisini önemli ve yaygın
    olarak değerlendirmiştir. İşletmenin sürekliliğine ilişkin standarda göre hangi sonuç doğar?
  secenekler:
    A: Açıklama yetersiz olsa da olumlu görüş verilir; belirsizlik, Dikkat Çekilen Hususlar paragrafında vurgulanarak
