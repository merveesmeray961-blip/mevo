- id: SMMM-DEN-RAP-0009
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: '706'
  tip: uygulama
  zorluk: 3
  kok: Denetçi, finansal tablolarda açıklanan ve kullanıcıların finansal tabloları anlaması açısından temel teşkil
    edecek derecede önemli bir hususun bulunduğunu, ancak bu hususun olumlu görüş dışında bir görüş gerektirmediğini
    ve BDS 701 kapsamında kilit denetim konusu olarak belirlenmediğini değerlendiriyor. Ayrıca raporda kullanıcıların
    denetimi anlaması için finansal tablolar dışında kalan bir hususun açıklanmasının gerekli olduğunu düşünüyor.
    Bu durumda aşağıdaki seçeneklerden hangisi doğrudur?
  secenekler:
    A: Her iki husus da tek bir “Görüş” paragrafında açıklanmalıdır.
    B: Finansal tablolarda açıklanan husus için Diğer Hususlar, finansal tablolar dışındaki husus için Dikkat Çekilen
      Hususlar paragrafı kullanılır.
    C: Her iki husus da yalnız kilit denetim konuları bölümünde açıklanmalıdır.
    D: Finansal tablolarda açıklanan husus için Dikkat Çekilen Hususlar, finansal tablolar dışında kalan ve denetimin
      anlaşılmasıyla ilgili husus için Diğer Hususlar paragrafı kullanılabilir.
    E: Dikkat Çekilen Hususlar paragrafı yalnız olumlu görüş dışında bir görüş verilmişse kullanılabilir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 706 md. 8, finansal tablolarda sunulan veya açıklanan ve kullanıcıların finansal tabloları
      anlamaları açısından temel teşkil edecek derecede önemli husus için, olumlu görüş dışında bir görüş gerekmemesi
      ve BDS 701 kapsamında kilit denetim konusu olarak belirlenmemesi şartlarıyla Dikkat Çekilen Hususlar paragrafını
      düzenler. Md. 10 ise finansal tablolarda sunulan veya açıklananlar dışındaki, denetimin, denetçinin sorumluluklarının
      veya raporun anlaşılmasıyla ilgili hususlar için şartları sağlamak kaydıyla Diğer Hususlar paragrafını düzenler.
      Püf noktaları: Ayrımın anahtarı hususun finansal tablolarda sunulup açıklanıp açıklanmadığıdır; iki paragraf
      aynı işlevi görmez.'
    celdiriciler:
      A: BDS 706 md. 8, ilk durumda Dikkat Çekilen Hususlar paragrafını; md. 10 ise ikinci durumda Diğer Hususlar
        paragrafını öngörür.
      B: BDS 706 md. 8 ve 10 iki farklı paragrafın farklı konulara uygulanacağını düzenler; adların ters çevrilmesi
        doğru değildir.
      C: BDS 706 md. 8, Dikkat Çekilen Hususlar için BDS 701 kapsamında kilit denetim konusu olmama şartını da içerir;
        her husus otomatik olarak bu bölüme taşınmaz.
      E: BDS 706 md. 8, Dikkat Çekilen Hususlar paragrafını yalnız olumlu görüş dışında görüş verilmesi şartına
        bağlamaz; tersine bunun verilmesini gerektirmemesi şartını arar.
  kaynaklar:
  - mevzuat: BDS 706
    madde: md. 8
    alinti: "Denetçi, muhakemesine göre, kullanıcıların finansal tabloları anlamaları açısından temel teşkil\n \
      \        edecek derecede öneme sahip olan, finansal tablolarda sunulan veya açıklanan bir hususa\n       \
      \  kullanıcıların dikkatinin çekilmesinin gerekli olduğunu düşünürse;\n         (a)   Bu hususun BDS 7054\
      \ uyarınca olumlu görüş dışında bir görüş verilmesini\n               gerektirmemesi ve\n         (b)   BDS\
      \ 701’in uygulandığı durumlarda, bu hususun denetçi raporunda bildirilecek bir kilit\n               denetim\
      \ konusu olarak belirlenmemiş olması (Bkz.: A1-A3 paragrafları),"
  - mevzuat: BDS 706
    madde: md. 10
    alinti: "Denetçinin, muhakemesine göre, kullanıcıların; denetimi, denetçinin sorumluluklarını veya\n       \
      \  denetçi raporunu anlamalarıyla ilgili olan ve finansal tablolarda sunulan veya açıklananlar\n         dışındaki\
      \ bir hususun denetçi raporunda bildirilmesinin gerekli olduğunu düşünmesi\n         durumunda,\n        \
      \ (a)   Mevzuatla yasaklanmamış olması ve\n         (b)   BDS 701’in uygulandığı durumlarda, bu hususun denetçi\
      \ raporunda bildirilecek bir kilit\n               denetim konusu olarak belirlenmemiş olması (Bkz.: A9-A14\
      \ paragrafları),"
