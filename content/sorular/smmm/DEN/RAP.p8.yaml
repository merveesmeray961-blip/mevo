    C: Görüş bildirmekten kaçınma görüşü verilir; belirsizliğin yeterince açıklanıp açıklanmadığı ayrıca değerlendirilmez.
    D: Dipnotlardaki eksik açıklamanın yönetimce düzeltilmesi yeterli görülür; denetçi görüşü değişmeden kalır ve
