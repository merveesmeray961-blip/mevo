      ile sebep ve denetimde nasıl ele alındığı hususlarını düzenler.
    celdiriciler:
      A: II de doğrudur.
      B: I de doğrudur.
      D: III yanlıştır; nasıl ele alındığı da açıklamanın unsurlarındandır.
      E: III yanlış olduğu için üçü birlikte doğru değildir.
