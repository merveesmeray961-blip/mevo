  kok: BDS 706’ya göre Dikkat Çekilen Hususlar paragrafı ile Diğer Hususlar paragrafı arasındaki ayrımı doğru veren seçenek
    hangisidir?
  secenekler:
    A: Dikkat Çekilen Hususlar paragrafı finansal tablolarda sunulan/açıklanan bir hususa, Diğer Hususlar paragrafı ise finansal
      tablolarda sunulan/açıklananlar dışındaki ve denetimi, denetçinin sorumluluklarını veya raporunu anlamayla ilgili bir
      hususa atıfta bulunur.
    B: Dikkat Çekilen Hususlar paragrafı yalnız mevzuatın yasakladığı bilgileri, Diğer Hususlar paragrafı yalnız finansal
      tablo dipnotlarını içerir.
    C: Her iki paragraf da yalnız finansal tablolarda sunulmayan hususlara atıfta bulunur; aralarında içerik bakımından fark
      yoktur.
    D: Dikkat Çekilen Hususlar paragrafı denetçinin sorumluluklarını açıklamak için, Diğer Hususlar paragrafı finansal tablolardaki
      önemli bir hususu vurgulamak için kullanılır.
    E: Diğer Hususlar paragrafı yalnızca finansal tablolarda uygun biçimde sunulmuş bir hususa atıfta bulunabilir; Dikkat
      Çekilen Hususlar paragrafı bunun tersidir.
  dogru: A
  aciklama:
    dogru_neden: BDS 706 md. 7’de Dikkat Çekilen Hususlar paragrafı finansal tablolarda uygun şekilde sunulan veya açıklanan
      ve kullanıcıların finansal tabloları anlaması açısından temel teşkil edecek derecede önemli hususa; Diğer Hususlar paragrafı
      ise finansal tablolarda sunulan veya açıklananlar dışındaki ve denetimi, denetçinin sorumluluklarını veya raporu anlamayla
      ilgili hususa atıfta bulunan paragraf olarak tanımlanmıştır.
    celdiriciler:
      B: BDS 706, her iki paragrafın da yasaklı bilgi için kullanılmasını değil, farklı amaçlarını düzenler.
      C: İki paragrafın ayrım noktası tam da finansal tablolarda sunulan/açıklanan husus ile bunların dışındaki husustur.
      D: Dikkat Çekilen Hususlar finansal tablolarda sunulan/açıklanan hususa; Diğer Hususlar ise denetim veya raporu anlamayla
        ilgili dış hususa yöneliktir.
      E: E, iki paragrafın yönünü tersine çevirmektedir.
