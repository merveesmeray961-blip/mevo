      denetçinin sorumluluklarını veya denetçi raporunu anlamalarıyla ilgili olan, finansal tablolarda sunulan veya açıklananlar
      dışında bir hususa atıfta bulunan paragraftır. (b)   Dikkat Çekilen Hususlar paragrafı: Denetçi raporuna eklenen, denetçinin
