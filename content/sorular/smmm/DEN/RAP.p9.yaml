- id: SMMM-DEN-RAP-0030
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: '705'
  tip: uygulama
  zorluk: 3
  kok: 'BDS 705’e göre aşağıdaki üç durumun karşılık geldiği sonuçlar birlikte değerlendirilecektir:

    I. Birden fazla belirsizliğin muhtemel etkileşimi ve kümülatif etkileri nedeniyle finansal tablolara ilişkin görüş oluşturulamamaktadır.

    II. Denetçi, bir bütün olarak finansal tablolara ilişkin olumsuz görüş vermeyi veya görüş vermekten kaçınmayı gerekli
    görmektedir.

    III. Yönetimin kapsam sınırlamasını kaldırmaması nedeniyle denetçi denetimden çekilme kararı almıştır.

    Bu durumlarda sırasıyla hangi sonuçlar doğar?'
  secenekler:
    A: 'I: Görüş vermekten kaçınma; II: Aynı raporda tek bir finansal tablo veya belirli bir unsur için olumlu görüş verilmemesi;
      III: Çekilmeden önce olumlu görüş dışında görüşe sebep olan hususların üst yönetime iletilmesi'
    B: 'I: Olumsuz görüş; II: Tek bir finansal tabloya olumlu görüş verilmesi; III: Çekilmeden sonra üst yönetime bildirim'
    C: 'I: Sınırlı olumlu görüş; II: Tek bir finansal tabloya olumlu görüş verilmesi; III: Çekilmeden önce bildirim yapılmaması'
    D: 'I: Görüş vermekten kaçınma; II: Tek bir finansal tabloya ayrıca olumlu görüş verilmesi; III: Çekilmeden sonra bildirim'
    E: 'I: Olumsuz görüş; II: Olumlu görüş dışında görüş verilmesine gerek olmaması; III: Çekilmeden önce yalnız yönetimden
      kapsam sınırlamasını kaldırması istenir'
  dogru: A
  aciklama:
    dogru_neden: 'BDS 705 md. 10, birden fazla belirsizliğin muhtemel etkileşimi ve kümülatif etkileri nedeniyle görüş oluşturulamıyorsa
      görüş vermekten kaçınmayı düzenler. Md. 15, bir bütün olarak finansal tablolara ilişkin olumsuz görüş veya görüş vermekten
      kaçınma gerekli olduğunda aynı raporda tek bir finansal tabloya veya belirli bir unsura ilişkin olumlu görüş verilmesini
      dışlar. Md. 14 ise denetçi çekilirse, çekilmeden önce olumlu görüş dışında bir görüş verilmesine sebep olan hususları
      üst yönetimden sorumlu olanlara iletmesini düzenler. Püf noktaları: Üç durum, sırasıyla görüş türü, rapordaki görüşlerin
      birlikte kullanımı ve çekilme öncesi iletişim sonuçlarını sınar.'
    celdiriciler:
      B: Md. 10 görüş vermekten kaçınmayı düzenler; md. 15 tek bir unsur için olumlu görüşü dışlar ve md. 14 bildirim için
        çekilme sonrasını değil öncesini esas alır.
      C: Md. 10’daki kümülatif belirsizlik durumu görüş vermekten kaçınmaya; md. 15 ve md. 14 ise B ve C’deki ters sonuçlara
        değil, A’daki sonuçlara götürür.
      D: Md. 15 bir bütün olarak olumsuz görüş veya görüşten kaçınma gerekli olduğunda aynı raporda tek bir finansal tabloya
        olumlu görüş verilmesine izin vermez; md. 14 bildirim için çekilme öncesini öngörür.
      E: Md. 10 ve md. 15’teki sonuçlar E’deki gibi değildir; md. 14 de yalnız kapsam sınırlamasının kaldırılmasını değil,
        çekilmeden önce ilgili hususların bildirilmesini düzenler.
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: md. 10
    alinti: 10.      Denetçi, birden fazla belirsizlik içeren istisnai durumlarda, belirsizliklerin her birine ilişkin yeterli
      ve uygun denetim kanıtı elde edilmiş olmasına bağlı kalmaksızın, belirsizliklerin muhtemel etkileşimi ve finansal tablolar
      üzerindeki muhtemel kümülatif etkileri sebebiyle, finansal tablolara ilişkin görüş oluşturmanın mümkün olmadığı sonucuna
      varırsa, görüş vermekten kaçınır.
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: md. 14
    alinti: '14.      Denetçi, 13(b)(i) paragrafında belirtilen şekilde denetimden çekilirse, denetimden çekilmeden önce,
      denetim sırasında belirlenen ve olumlu görüş dışında bir görüş verilmesine sebep olan yanlışlıklara ilişkin hususları,
      üst yönetimden sorumlu olanlara iletir (Bkz.: A15 paragrafı).'
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: md. 15
    alinti: 15.      Denetçinin, bir bütün olarak finansal tablolara ilişkin olumsuz görüş vermeyi veya görüş vermekten kaçınmayı
      gerekli görmesi durumunda, denetçi raporunda, aynı finansal raporlama
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: md. 15
    alinti: çerçevesi bakımından tek bir finansal tabloya veya finansal tablonun bir veya daha fazla belirli unsuruna, hesabına
      veya kalemine ilişkin olumlu görüş yer almaz. Bu şartlar altında aynı raporda3 bu tür bir olumlu görüşe yer verilmesi,
      denetçinin bir bütün olarak finansal tablolara ilişkin vermiş olduğu olumsuz görüşle veya görüş vermekten kaçınma durumuyla
      çelişir
