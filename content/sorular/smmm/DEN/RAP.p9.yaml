    A: Denetçi, düzeltilmemiş önemli yanlışlığın rapor kullanıcılarının dikkatine uygun şekilde sunulmasını sağlamak üzere
      uygun adımlar atar.
    B: Denetçi, sahip olduğu yasal hak ve yükümlülükleri dikkate alır.
    C: Diğer bilgiler düzeltilirse, içinde bulunulan şartlarda gerekli prosedürler uygulanır.
    D: Denetçi, diğer bilgilerin rapor tarihinden sonra elde edilmiş olması nedeniyle hiçbir işlem yapmaz.
