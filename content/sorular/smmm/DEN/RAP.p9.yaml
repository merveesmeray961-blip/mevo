- id: SMMM-DEN-RAP-0025
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: '705'
  tip: kavrama
  zorluk: 3
  kok: 'BDS 705''e göre aşağıdaki durumlar karşılaştırılmaktadır: (I) Finansal tablolarda önemli yanlışlık vardır ancak etkiler
    yaygın değildir. (II) Yeterli ve uygun denetim kanıtı elde edilememiştir ve muhtemel etkiler önemli ancak yaygın değildir.
    (III) Yeterli ve uygun denetim kanıtı elde edilememiştir ve muhtemel etkiler hem önemli hem yaygındır. Bu durumların uygun
    görüşlerle eşleştirilmesi aşağıdakilerden hangisidir?'
  secenekler:
    A: I–sınırlı olumlu, II–sınırlı olumlu, III–görüş vermekten kaçınma
    B: I–olumsuz, II–olumlu, III–sınırlı olumlu
    C: I–görüş vermekten kaçınma, II–olumsuz, III–sınırlı olumlu
    D: I–sınırlı olumlu, II–görüş vermekten kaçınma, III–olumsuz
    E: I–olumsuz, II–sınırlı olumlu, III–görüş vermekten kaçınma
  dogru: E
  aciklama:
    dogru_neden: 'BDS 705''te önemli fakat yaygın olmayan yanlışlık için sınırlı olumlu görüş; kanıt yetersizliği nedeniyle
      muhtemel etkiler önemli fakat yaygın değilse sınırlı olumlu; önemli ve yaygın muhtemel etkilerde görüş vermekten kaçınma
      öngörülür. Püf noktaları: Görüş türünü belirleyen ikinci eksen, yanlışlığın/kanıt yetersizliğinin etkisinin yaygınlığıdır.'
    celdiriciler:
      A: III için görüş vermekten kaçınma gerekir; I ve II de sınırlı olumlu olabilir.
      B: I yanlışlık içerdiği için olumlu görüş değildir; II kanıt yetersizliği nedeniyle de değerlendirilir.
      C: I için görüş vermekten kaçınma, III için olumsuz görüş verilmesi doğru eşleştirme değildir.
      D: II için yaygın olmayan kanıt yetersizliği sınırlı olumlu sonucu doğurur; III için olumsuz değil, görüş vermekten
        kaçınma söz konusudur.
  kaynaklar:
  - mevzuat: BDS 705 “Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi”
    madde: md. 7
    alinti: 'Denetçi, aşağıdaki durumlarda sınırlı olumlu görüş verir: Yeterli ve uygun denetim kanıtı elde etmiş olan denetçi,
      yanlışlıkların tek başına veya toplu olarak önemli olduğu ancak finansal tablolarda yaygın olmadığı sonucuna varırsa
      veya Görüşüne dayanak teşkil edecek yeterli ve uygun denetim kanıtı elde edememekle birlikte -varsa- tespit edilmemiş
      yanlışlıkların finansal tablolar üzerindeki muhtemel etkilerinin önemli olabileceği ancak yaygın olmayabileceği sonucuna
      varırsa.'
  - mevzuat: BDS 705 “Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi”
    madde: md. 8
    alinti: Yeterli ve uygun denetim kanıtı elde etmiş olan denetçi, yanlışlıkların tek başına veya toplu olarak finansal
