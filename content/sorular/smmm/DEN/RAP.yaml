- id: SMMM-DEN-RAP-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 705 görüş türü ve BDS 706 dikkat çekilen hususlar paragrafı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: >-
    (P) AŞ'nin denetiminde denetçi, yeterli ve uygun denetim kanıtı elde etmiş; stoklarda tek başına
    önemli olan ancak finansal tablolarda yaygın olmayan bir yanlışlık tespit etmiştir. Yönetim bu
    yanlışlığı düzeltmeyi reddetmiştir. Ayrıca işletme aleyhine açılmış, sonucu belirsiz istisnai bir
    dava finansal tablo dipnotlarında uygun bir şekilde açıklanmıştır. Denetçi, bu davanın
    kullanıcıların finansal tabloları anlaması açısından temel teşkil ettiği ve kullanıcıların
    dikkatinin bu davaya çekilmesi gerektiği kanaatindedir; dava kilit denetim konusu olarak
    belirlenmemiştir. BDS 705 "Bağımsız Denetçi Raporunda Olumlu Görüş Dışında
    Bir Görüş Verilmesi" ve BDS 706 "Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve
    Diğer Hususlar Paragrafları" standartlarına göre denetçi raporu ile ilgili aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Olumsuz görüş verilir; dava ayrıca "Dikkat Çekilen Hususlar" başlıklı ayrı bir bölümde
      açıklanır.
    B: Olumlu görüş verilir; stoklardaki yanlışlık ve dava "Dikkat Çekilen Hususlar" başlıklı ayrı bir
      bölümde açıklanır.
    C: Sınırlı olumlu görüş verilir; dava, kullanıcıların denetimi anlamasıyla ilgili olduğundan
      "Diğer Hususlar" paragrafında yer alır.
    D: Sınırlı olumlu görüş verilir; dava için "Dikkat Çekilen Hususlar" başlıklı ayrı bir bölüm
      oluşturulur ve bu hususun görüşü değiştirmediği belirtilir.
    E: Dava sonucuna ilişkin belirsizlik nedeniyle görüş vermekten kaçınılır; stoklardaki yanlışlık
      görüşün dayanağı bölümünde açıklanır.
  dogru: D
  aciklama:
    dogru_neden: >-
      Görüş türü senaryodan çıkarılır: yeterli ve uygun kanıt elde edilmiş, yanlışlık önemli fakat
      yaygın değildir; BDS 705 parag. 7 uyarınca sınırlı olumlu görüş verilir. Dava finansal tablolarda
      uygun şekilde açıklanmış, kullanıcıların finansal tabloları anlaması açısından temel teşkil eden
      bir husustur ve kilit denetim konusu değildir; bu nedenle BDS 706 parag. 7(b) ve 8 uyarınca
      Dikkat Çekilen Hususlar paragrafı eklenir. Parag. 9'a göre bu paragraf "Dikkat Çekilen Hususlar"
      ifadesini içeren başlık altında ayrı bir bölümde yer alır ve hususun görüşü değiştirmediği
      belirtilir. BDS 706 Ek 4'te sınırlı olumlu görüş ile Dikkat Çekilen Hususlar paragrafının aynı
      raporda yer aldığı örnek rapor bulunur. Zor soru teknikleri: iki standardın birlikte uygulanması
      (BDS 705 + 706), yakın kavram ayrımı (Dikkat Çekilen Hususlar / Diğer Hususlar; önemli / yaygın)
      ve görüş türünün senaryodan çıkarılması. Tuzak, Dikkat Çekilen Hususlar paragrafını olumlu
      görüş dışındaki görüşün yerine kullanmak veya tek bir belirsizlik için görüşten kaçınmaktır.
    celdiriciler:
      A: Olumsuz görüş, yanlışlıkların hem önemli hem yaygın olması hâlinde verilir (BDS 705 parag. 8);
        senaryodaki yanlışlık yaygın değildir.
      B: Dikkat Çekilen Hususlar paragrafı, BDS 705 uyarınca olumlu görüş dışında bir görüş
        verilmesinin yerini almaz (BDS 706 A7-a); önemli ve düzeltilmemiş yanlışlık görüşü değiştirir.
      C: Diğer Hususlar paragrafı finansal tablolarda sunulan veya açıklananlar dışındaki hususlar
        içindir (BDS 706 parag. 7-a); dava dipnotlarda açıklandığından Dikkat Çekilen Hususlar
        kapsamındadır.
      E: Görüş vermekten kaçınma, yeterli ve uygun kanıt elde edilemeyip muhtemel etkilerin önemli ve
        yaygın olabileceği durumlarda veya birden fazla belirsizliğin bulunduğu istisnai durumlarda
        söz konusudur (BDS 705 parag. 9-10); burada kanıt yeterlidir ve tek bir belirsizlik uygun
        şekilde açıklanmıştır.
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: parag. 7(a)
    alinti: 'Denetçi, aşağıdaki durumlarda sınırlı olumlu görüş verir: Yeterli ve uygun denetim kanıtı
      elde etmiş olan denetçi, yanlışlıkların tek başına veya toplu olarak önemli olduğu ancak finansal
      tablolarda yaygın olmadığı sonucuna varırsa'
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar
      Paragrafları
    madde: parag. 7
    alinti: '(a) Diğer Hususlar paragrafı: Denetçi raporuna eklenen, denetçinin muhakemesine göre,
      kullanıcıların; denetimi, denetçinin sorumluluklarını veya denetçi raporunu anlamalarıyla ilgili
      olan, finansal tablolarda sunulan veya açıklananlar dışında bir hususa atıfta bulunan paragraftır.
      (b) Dikkat Çekilen Hususlar paragrafı: Denetçi raporuna eklenen, denetçinin muhakemesine göre,
      kullanıcıların finansal tabloları anlamaları açısından temel teşkil edecek derecede öneme sahip
      olan, finansal tablolarda uygun bir şekilde sunulan veya açıklanan bir hususa atıfta bulunan
      paragraftır.'
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar
      Paragrafları
    madde: parag. 9(a) ve 9(c)
    alinti: (a) Bu paragrafa “Dikkat Çekilen Hususlar” ifadesini içeren uygun bir başlık altında ayrı
      bir bölüm oluşturarak denetçi raporunda yer verir. … (c) Dikkat çekilen hususun denetçi görüşünü
      değiştirmediğini belirtir
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar
      Paragrafları
    madde: parag. 8(b) ve Ek 4 başlığı
    alinti: '(b) BDS 701’in uygulandığı durumlarda, bu hususun denetçi raporunda bildirilecek bir kilit
      denetim konusu olarak belirlenmemiş olması (Bkz.: A1-A3 paragrafları), şartıyla denetçi raporuna
      Dikkat Çekilen Hususlar paragrafı ekler … Ek 4: Geçerli Finansal Raporlama Çerçevesinden Sapma
      Sebebiyle Sınırlı Olumlu Görüş ve Dikkat Çekilen Hususlar Paragrafı İçeren Denetçi Raporu Örneği'
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar
      Paragrafları
    madde: parag. A7
    alinti: 'Denetçi raporuna Dikkat Çekilen Hususlar paragrafının eklenmesi, denetçinin görüşünü
      etkilemez. Dikkat Çekilen Hususlar paragrafı aşağıdakilerin yerini almaz: (a) BDS 705 uyarınca
      denetimin kendine özgü şartlarının gerektirmesi sebebiyle denetçinin olumlu görüş dışında bir
      görüş vermesinin,'
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: parag. 8
    alinti: Yeterli ve uygun denetim kanıtı elde etmiş olan denetçi, yanlışlıkların tek başına veya
      toplu olarak finansal tablolar için önemli ve (etkisinin) yaygın olduğu sonucuna varırsa olumsuz
      görüş verir.
  gecerlilik:
    baslangic: '2021-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-RAP-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Raporlama ve görüş türleri
  konu: RAP
  kazanim: BDS 570 işletmenin sürekliliği ve denetçi raporu
  tip: bilgi
  zorluk: 2
  soru_bicimi: bosluk
  kok: >-
    BDS 570 "İşletmenin Sürekliliği" standardına göre; finansal tabloların işletmenin sürekliliği
    esasına göre hazırlanmış olması ancak yönetimin bu esası kullanmasının denetçinin yargısına göre
    uygun olmaması durumunda denetçi (i) verir. İşletmenin sürekliliği esasının kullanılması uygun
    olmakla birlikte önemli bir belirsizliğin bulunduğu ve finansal tablolarda bu belirsizliğe ilişkin
    yeterli açıklamanın yapıldığı durumda ise denetçi (ii) verir ve denetçi raporunda "(iii)" başlığı
    altında ayrı bir bölüme yer verir.


    Yukarıdaki boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?
  secenekler:
    A: (i) olumsuz görüş – (ii) sınırlı olumlu görüş – (iii) Sınırlı Olumlu Görüşün Dayanağı
    B: (i) görüş vermekten kaçınma – (ii) olumlu görüş – (iii) İşletmenin Sürekliliğiyle İlgili Önemli
      Belirsizlik
    C: (i) olumsuz görüş – (ii) olumlu görüş – (iii) İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik
    D: (i) olumsuz görüş – (ii) olumlu görüş – (iii) Dikkat Çekilen Hususlar
    E: (i) sınırlı olumlu görüş – (ii) olumlu görüş – (iii) Kilit Denetim Konuları
  dogru: C
  aciklama:
    dogru_neden: >-
      BDS 570 parag. 21'e göre işletmenin sürekliliği esasının kullanılması uygun değilse denetçi
      olumsuz görüş verir. Parag. 22'ye göre esasın kullanılması uygun olup önemli belirsizliğe ilişkin
      yeterli açıklama yapılmışsa denetçi olumlu görüş verir ve raporda "İşletmenin Sürekliliğiyle
      İlgili Önemli Belirsizlik" başlığı altında ayrı bir bölüme yer verir. Tuzak, bu bölümü BDS 706'daki
      Dikkat Çekilen Hususlar paragrafıyla karıştırmaktır.
    celdiriciler:
      A: Yeterli açıklama yapıldığında görüş olumlu kalır; sınırlı olumlu görüş ve dayanak bölümü,
        yeterli açıklamanın yapılmadığı durum içindir (BDS 570 parag. 23).
      B: Esasın kullanılmasının uygun olmaması hâlinde görüş vermekten kaçınılmaz, olumsuz görüş
        verilir (BDS 570 parag. 21).
      D: Dikkat Çekilen Hususlar paragrafı, önemli belirsizlik durumunda BDS 570'e uygun olarak
        yapılan raporlamanın yerini almaz (BDS 706 A7-c); ayrı başlık BDS 570 parag. 22'de belirlenmiştir.
      E: Esasın kullanılması uygun değilse sınırlı olumlu değil olumsuz görüş verilir; ayrı bölümün
        başlığı da Kilit Denetim Konuları değildir.
  kaynaklar:
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: parag. 21
    alinti: Finansal tabloların işletmenin sürekliliği esasına göre hazırlanmış olması ancak yönetimin
      işletmenin sürekliliği esasını kullanmasının denetçinin yargısına göre uygun olmaması durumunda
      denetçi olumsuz görüş verir
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: parag. 22
    alinti: Finansal tablolardaki önemli belirsizliğe ilişkin yeterli açıklamanın yapılması durumunda
      denetçi, olumlu görüş verir ve aşağıdaki amaçlarla denetçi raporunda “İşletmenin Sürekliliğiyle
      İlgili Önemli Belirsizlik” başlığı altında ayrı bir bölüme yer verir
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar
      Paragrafları
    madde: parag. A7 (giriş) ve A7(c)
    alinti: 'Dikkat Çekilen Hususlar paragrafı aşağıdakilerin yerini almaz: … (c) İşletmenin sürekliliğini
      devam ettirme kabiliyetine ilişkin ciddi şüphe oluşturabilecek olay veya şartlarla ilgili önemli bir
      belirsizliğin mevcut olması durumunda,'
  gecerlilik:
