- id: SMMM-DEN-RSK-0065
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: BDS 320 özel önemlilik düzeyi
  tip: uygulama
  zorluk: 3
  kok: Bir denetimde bir bütün olarak finansal tablolar için önemlilik 500.000 TL belirlenmiştir. Ancak ilişkili taraf işlemlerine
    ilişkin açıklamalardaki 500.000 TL'den çok daha düşük yanlışlıkların kullanıcıların ekonomik kararlarını etkileyeceği
    makul şekilde beklenmektedir. BDS 320'ye göre denetçi ne yapar?
  secenekler:
    A: Tek önemlilik yeterli olduğundan yalnızca 500.000 TL'yi kullanır.
    B: Bir bütün olarak tablolar için belirlediği önemliliği artırır.
    C: Bu açıklamalar için ayrıca daha düşük önemlilik düzeyi belirler.
    D: Açıklamaları, ancak tutar önemliliği aşarsa denetime dâhil eder.
    E: Performans önemliliğini 500.000 TL'nin üzerine çıkarır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 320 md. 10 uyarınca bir bütün olarak finansal tablolar için belirlenen önemlilikten daha düşük tutarlardaki
      yanlışlıkların kullanıcı kararlarını etkileyeceği makul şekilde beklenen işlem sınıfı, hesap bakiyesi veya açıklama
      varsa denetçi, bunlara uygulanmak üzere ayrıca önemlilik düzeyi veya düzeyleri belirler. Püf noktaları: Özel düzey,
      genel önemlilikten düşük olur; performans önemliliği ise ayrı bir kavramdır ve genel önemlilikten daha düşük belirlenir.'
    celdiriciler:
      A: Tek önemlilik, özel durumlarda md. 10'un ek düzey şartını karşılamaz.
      B: Önemliliği artırmak daha küçük yanlışlıkların gözden kaçmasına yol açar; md. 10 ek düzey ister.
      D: Tutar eşiği md. 10'da bu durum için aranmaz; özel düzey, genel önemlilikten düşüktür.
      E: Performans önemliliği genel önemlilikten düşük belirlenir (md. 9); üzerine çıkarılamaz.
  kaynaklar:
  - mevzuat: BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik
    madde: md. 10
    alinti: İşletmenin içinde bulunduğu özel şartlara göre, kullanıcıların finansal tablolara istinaden alacakları ekonomik
      kararları etkileyeceği makul şekilde beklenen, bir bütün olarak finansal tablolar için belirlenen önemlilikten daha
      düşük tutarlardaki yanlışlıkları içerebilecek bir veya daha fazla işlem sınıfının, hesap bakiyesinin veya açıklamanın
      bulunduğu durumda, denetçi bu özel işlem sınıfları, hesap bakiyeleri ve açıklamalara uygulanmak üzere ayrıca önemlilik
      düzeyi veya düzeyleri belirler
