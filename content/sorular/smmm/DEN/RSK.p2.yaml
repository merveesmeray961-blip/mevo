- id: SMMM-DEN-RSK-0068
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: BDS 320 belgelendirme
  tip: kavrama
  zorluk: 2
  kok: BDS 320'ye göre denetçinin çalışma kâğıtlarına dâhil edeceği hususlar arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Bir bütün olarak finansal tablolar için belirlenen önemlilik
    B: Uygun hâllerde belirli işlem sınıfları, hesap bakiyeleri veya açıklamalar için belirlenen önemlilik düzeyleri
    C: Önemlilik tutarına ilişkin yönetimin yazılı onayı
    D: Performans önemliliği
    E: Denetim yürütülürken yapılan değişiklikler
  dogru: C
  aciklama:
    dogru_neden: BDS 320 md. 14 uyarınca denetçi; bir bütün için önemliliği, özel düzeyleri, performans önemliliğini ve denetim
      sırasında yapılan değişiklikleri, bu tutarların belirlenmesinde dikkate alınan etkenlerle birlikte çalışma kâğıtlarına
      dâhil eder. Yönetim onayı bu listede yoktur.
    celdiriciler:
      A: Bu tutar md. 14(a)'dadır.
      B: Bu düzeyler md. 14(b)'dedir.
      D: Bu tutar md. 14(c)'dedir.
