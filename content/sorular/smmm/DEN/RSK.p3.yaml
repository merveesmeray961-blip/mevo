- id: SMMM-DEN-RSK-0003
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk, önemlilik ve planlama
  konu: RSK
  kazanim: 'BDS 530 denetim örneklemesi: uygulanamayan kalemler, anomali ve yanlışlıkların öngörülmesi'
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: BDS 530 "Denetim Örneklemesi" standardına göre denetçinin örneklemede karşılaştığı durumlara ve bunlara yaklaşımına
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Detay testi uygulanırken seçilen bir kalemle ilgili belgelerin kaybolması nedeniyle tasarlanan prosedürler
      ve uygun alternatif prosedürler uygulanamıyorsa, bu kalem bir yanlışlık olarak kabul edilir.
    B: Ödeme onaylarına ilişkin kontrol testinde seçilen bir çekin iptal edilmiş olduğu ve gerektiği gibi iptal
      edildiği konusunda denetçi ikna olmuşsa, test, iptal edilen çekin yerini alan uygun biçimde belirlenmiş başka
      bir kalem üzerinde uygulanır.
    C: Örneklemde tespit edilen bir yanlışlığı anomali olarak değerlendirebilmek için denetçinin, bu yanlışlığın
      anakitleyi temsil etmediğine dair yüksek derecede kesin bir kanaate sahip olması ve bunu ilave denetim prosedürleriyle
      desteklemesi gerekir.
    D: Alacakların varlığına ilişkin teyit gibi bir detay testinde, müşterinin teyit tarihinden önce yaptığı ancak
      ödemeyi alan tarafın bu tarihten kısa bir süre sonra teslim aldığı ödemeler, yanlışlık olarak kabul edilmez.
    E: Detay testlerinde örneklemde bulunan yanlışlıkların anakitlenin geneli için öngörülmesi, yalnızca istatistiki
      örnekleme yönteminin kullanıldığı durumlarda gereklidir.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 530 par. 14''e göre denetçi, detay testleri için örneklemde bulduğu yanlışlıkları kullanarak
      anakitlenin geneli için bir öngörüde bulunur; hüküm istatistiki veya istatistiki olmayan yöntem ayrımı yapmaz.
      E şıkkı öngörüyü yalnızca istatistiki örneklemeye bağladığı için yanlıştır. Diğer şıklar standartla uyumludur:
      par. 11 ve A15 (uygulanamayan kalem), par. 10 ve A14 (iptal edilmiş çek), par. 13 (anomali), A6 (teyit tarihinden
      önce yapılan ödeme).'
    celdiriciler:
      A: 'Doğrudur: par. 11 uyarınca prosedür uygulanamayan kalem detay testi açısından yanlışlık sayılır; A15 buna
        belgelerin kaybolmasını örnek verir.'
      B: 'Doğrudur: par. 10 ve A14, iptal edilmiş çek örneğinde denetçinin iptalin gereği gibi yapıldığı konusunda
        ikna olması hâlinde seçilen kalemin yerini alan başka bir kalemin incelenmesini öngörür.'
      C: 'Doğrudur: par. 13, anomali değerlendirmesi için kesinlik derecesi yüksek bir kanaat ve bunu sağlayacak
        ilave prosedürler gerektirir.'
      D: 'Doğrudur: A6, alacak hesaplarının varlığına ilişkin detay testlerinde (teyit gibi) teyit tarihinden önce
        yapılan ancak alıcı tarafından kısa süre sonra teslim alınan ödemelerin yanlışlık olarak kabul edilmediğini
        belirtir.'
  kaynaklar:
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: par. 14
    alinti: Denetçi detay testleri için, örneklemde bulduğu yanlışlıkları kullanarak anakitlenin geneli için bir
      öngörüde bulunur
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: par. 11
    alinti: Denetçinin tasarlanmış denetim prosedürlerini veya uygun olan alternatif prosedürleri seçilen bir kalem
      üzerinde uygulayamaması durumunda, söz konusu kalem, kontrol testleri açısından, öngörülen kontrolden bir
      sapma, detay testleri açısından ise bir yanlışlık olarak kabul edilir
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: A15
    alinti: Denetçinin tasarlanmış denetim prosedürlerini seçilen bir kaleme uygulayamayacağı duruma örnek olarak,
      söz konusu kalemle ilgili belgelerin kaybolması gösterilebilir.
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: par. 13
    alinti: Denetçinin, örneklemde tespit edilen bir sapma veya yanlışlığı anomali (aykırılık) olarak değerlendirdiği
      çok ender durumlarda, söz konusu sapma veya yanlışlığın anakitleyi temsil etmediğine dair kesinlik derecesi
      yüksek bir kanaate sahip olması gerekir.
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: A14
    alinti: Denetim prosedürünün seçilen kalemin yerini alan kaleme uygulanmasının gerektiği duruma örnek olarak,
      ödemeye yetkili kişilerce onay verilip verilmediğine ilişkin bir kanıt test edilirken iptal edilmiş bir çekin
      seçilmesi gösterilebilir.
  - mevzuat: TDS BDS 530 Denetim Örneklemesi
    madde: A6
    alinti: alıcının bu tarihten kısa bir süre sonra teslim aldığı ödemeler, yanlışlık olarak kabul edilmez.
