    C: Finansal tabloların mutlak doğruluğunu garanti etmek ve yönetim beyanlarını onaylamak.
    D: Denetlenen işletmenin iç kontrol sistemini kurmak ve işletmek.
    E: Denetim ücretini belirlemek ve sözleşme şartlarını müzakere etmek.
