    celdiriciler:
      B: Amaç hem hata hem hile kaynaklı yanlışlıkları kapsar; yalnızca hileyle sınırlı değildir.
      C: Makul güvence mutlak güvence değildir; yapısal kısıtlamalar vardır.
      D: İç kontrolün kurulması yönetimin sorumluluğudur.
      E: Ücret ve sözleşme, denetçinin genel amaçları arasında yer almaz.
  kaynaklar:
