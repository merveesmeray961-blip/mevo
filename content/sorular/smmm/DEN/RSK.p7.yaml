  konu: RSK
  kazanim: makul güvence
  tip: kavrama
  zorluk: 3
  kok: Bir denetçi, yeterli ve uygun denetim kanıtı elde ettiğinde finansal tablolar hakkında mutlak güvence sağlayabileceğini
    savunmaktadır. Başka bir denetçi ise makul güvencenin yüksek fakat mutlak olmayan bir güvence seviyesi olduğunu ve denetim
    riskini kabul edilebilir düşük bir seviyeye indirmek için yeterli ve uygun kanıt elde edilmesi gerektiğini belirtmektedir.
    BDS 200'a göre hangi değerlendirme doğrudur?
  secenekler:
    A: İlk değerlendirme doğrudur; yeterli kanıt mutlak güvence sağlar.
    B: Her iki değerlendirme de doğrudur; makul güvence mutlak güvenceye eşittir.
    C: İkinci değerlendirme doğrudur; makul güvence yüksek ancak mutlak olmayan bir güvence seviyesidir.
    D: İlk değerlendirme yalnız KAYİK denetimlerinde doğrudur.
    E: İkinci değerlendirme yanlıştır; makul güvence yalnız sınırlı güvenceyi ifade eder
  dogru: C
  aciklama:
    dogru_neden: 'BDS 200, makul güvenceyi yüksek ancak mutlak olmayan güvence seviyesi olarak tanımlar. Ayrıca denetçinin
      makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir seviyeye indirmek amacıyla yeterli ve uygun denetim
      kanıtı elde etmesini öngörür. Bu iki hüküm birlikte okunduğunda ikinci değerlendirme doğrudur. Püf noktaları: Yeterli
      kanıtın amacı mutlak güvence değil, makul güvence seviyesine ulaşmaktır.'
    celdiriciler:
      A: BDS 200 makul güvenceyi mutlak güvence olarak tanımlamaz.
      B: Makul güvence ile mutlak güvence aynı değildir; standart açıkça yüksek ancak mutlak olmayan seviyeden söz eder.
      D: Kaynak bu ayrımı yalnız KAYİK denetimleriyle sınırlamaz.
      E: Makul güvence, sınırlı güvenceyle eş anlamlı değildir; BDS 200 onu yüksek ancak mutlak olmayan güvence olarak tanımlar.
