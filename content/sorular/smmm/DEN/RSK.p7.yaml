- id: SMMM-DEN-RSK-0015
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: makul güvence
  tip: kavrama
  zorluk: 3
  kok: Bir denetçi, yeterli ve uygun denetim kanıtı elde ettiğinde finansal tablolar hakkında mutlak güvence sağlayabileceğini
    savunmaktadır. Başka bir denetçi ise makul güvencenin yüksek fakat mutlak olmayan bir güvence seviyesi olduğunu
    ve denetim riskini kabul edilebilir düşük bir seviyeye indirmek için yeterli ve uygun kanıt elde edilmesi gerektiğini
    belirtmektedir. Bağımsız denetçinin genel amaçlarına ilişkin standarda göre hangi değerlendirme doğrudur?
  secenekler:
    A: İlk değerlendirme doğrudur; yeterli ve uygun kanıt elde edilmesi güvence seviyesini mutlak hâle getirir.
    B: Her iki değerlendirme de doğrudur; makul güvence ile mutlak güvence aynı güvence seviyesini ifade eder.
    C: İkinci değerlendirme doğrudur; makul güvence yüksek ancak mutlak olmayan bir güvence seviyesidir.
    D: İkinci değerlendirme yanlıştır; makul güvence sınırlı güvence düzeyini ifade eder ve kanıt yeterliliğiyle
      ilgili değildir.
    E: Her iki değerlendirme de yanlıştır; güvence seviyesi kanıt miktarına göre değil, yönetim beyanlarına göre
      belirlenir.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 200, makul güvenceyi yüksek ancak mutlak olmayan güvence seviyesi olarak tanımlar. Ayrıca
      denetçinin makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir seviyeye indirmek amacıyla
      yeterli ve uygun denetim kanıtı elde etmesini öngörür. Bu iki hüküm birlikte okunduğunda ikinci değerlendirme
      doğrudur. Püf noktaları: Yeterli kanıtın amacı mutlak güvence değil, makul güvence seviyesine ulaşmaktır.'
    celdiriciler:
      A: Standart makul güvenceyi mutlak güvence olarak tanımlamaz; yeterli kanıt riski düşürür ancak sıfırlamaz.
      B: Makul güvence ile mutlak güvence aynı değildir; standart açıkça yüksek ancak mutlak olmayan seviyeden söz
        eder.
      D: Makul güvence sınırlı güvenceyle eş anlamlı değildir; güvence düzeyi yeterli ve uygun kanıtla ilişkilidir.
      E: Güvence düzeyi yönetim beyanlarına göre belirlenmez; denetim riskinin düşürülmesi için yeterli ve uygun
        kanıt aranır.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: Tanımlar - Makul güvence
    alinti: 'Makul güvence: Finansal tabloların denetimi çerçevesinde, yüksek ancak mutlak

      olmayan güvence seviyesidir.

      Mesleki muhakeme: Denetimin yürütülmesi sırasında mevcut olan şartlara uygun olarak

      atılacak adımlara yönelik bilgiye dayalı kararlar alınırken; mevzuat, BDS’ler, muhasebe

      standartları ve etik standartlar çerçevesinde, sahip olunan eğitim, bilgi ve deneyimin

      kullanılmasıdır. İlgili yerlerde bu kavram mesleki yargı olarak da kullanılmıştır.…'
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: '17'
    alinti: "Denetçi makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir seviyeye\n      indirmek\
      \ amacıyla yeterli ve uygun denetim kanıtı elde eder. Bu kanıtlar denetçinin, görüşüne\n      dayanak oluşturacak\
      \ makul sonuçlara ulaşmasını sağlar (Bkz.: A31-A57 paragrafları).\nDenetimin BDS’lere Uygun Olarak Yürütülmesi\n\
      Denetimle İlgili BDS’lere Uyma\n18.   Denetçi, denetimle ilgili tüm BDS’lere uyar. Yürürlükte olan bir BDS’nin\
