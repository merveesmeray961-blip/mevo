- id: SMMM-DEN-RSK-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: BDS 200 amaç
  tip: bilgi
  zorluk: 1
  kok: Bağımsız denetçinin genel amaçlarına ilişkin standarda göre, finansal tabloların denetiminin yürütülmesinde
    denetçinin genel amaçları aşağıdakilerden hangisidir?
  secenekler:
    A: Denetlenen işletmenin iç kontrol sistemini tasarlayıp uygulamak ve böylece finansal tabloların hazırlanmasına
      ilişkin yönetim sorumluluğunu üstlenmek.
    B: Finansal tablolardaki hile kaynaklı önemli yanlışlıkları belirleyip raporlamak, hata kaynaklı yanlışlıkları
      ise denetim kapsamının dışında bırakmak.
    C: Finansal tabloların hata veya hile kaynaklı önemli yanlışlık içerip içermediğine ilişkin makul güvence elde
      ederek çerçeveye uygunluk hakkında görüş bildirmek ve bulgulara uygun raporlama yapmak.
    D: Finansal tabloların doğruluğuna ilişkin güvence elde etmek, yönetim beyanlarını onaylamak ve denetim riskini
      sıfırlayacak düzeyde kanıt toplamak.
    E: Denetim ücretini ve sözleşme şartlarını yönetimle müzakere ederek denetimin kapsamını işletmenin talepleri
      doğrultusunda belirlemek.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 200 paragraf 11 denetçinin genel amaçlarını bu şekilde ortaya koyar. Püf noktaları: Makul
      güvence elde etme, görüş bildirme ve bulgulara uygun raporlama birlikte genel amaçtır.'
    celdiriciler:
      A: İç kontrolün tasarlanması ve işletilmesi yönetimin sorumluluğundadır; denetçi bu sorumluluğu devralmaz.
      B: Genel amaç hem hata hem hile kaynaklı yanlışlıkları kapsar; hata kaynaklı yanlışlıklar kapsam dışı değildir.
      D: Makul güvence mutlak güvence değildir; yönetim beyanları onaylanmaz, kanıtla değerlendirilir ve denetim
        riski sıfırlanamaz.
      E: Ücret ve sözleşme şartları denetçinin genel amaçları arasında yer almaz.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun
      Olarak Yürütülmesi
