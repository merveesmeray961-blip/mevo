    A: Finansal tabloların hata veya hile kaynaklı önemli bir yanlışlık içerip içermediği konusunda makul güvence elde etmek
      ve böylece finansal tabloların tüm önemli yönleriyle geçerli finansal raporlama çerçevesine uygun olarak hazırlanıp
