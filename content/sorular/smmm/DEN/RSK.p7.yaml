- id: SMMM-DEN-RSK-0007
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: denetim riski; BDS 210 ön kabul; BDS 300 planlama; BDS 315/330; BDS 320/450 önemlilik; BDS 530 örnekleme
  tip: kavrama
  zorluk: 3
  kok: 'Bağımsız denetimde risk, önemlilik ve örnekleme ilişkisi dikkate alındığında aşağıdakilerden hangisi doğrudur?


    (i) Denetim riski, denetçinin finansal tablolar önemli ölçüde yanlış olduğunda uygun olmayan bir denetim görüşü verme
    riskidir ve yapısal risk, kontrol riski ile tespit riskinin bir fonksiyonudur.

    (ii) BDS 320''ye göre önemlilik, finansal tablolardaki yanlışlıkların tek başına veya toplu olarak kullanıcıların ekonomik
    kararlarını etkileyebilecek büyüklükte olmasıyla ilgilidir.

    (iii) BDS 530''a göre örnekleme, tüm anakütle hakkında sonuç çıkarmak amacıyla anakütlenin yüzde yüzünden daha az bir
    kısmına denetim prosedürlerinin uygulanmasıdır.'
  secenekler:
    A: Yalnız (i)
    B: Yalnız (ii)
    C: (i) ve (ii)
    D: (ii) ve (iii)
    E: (i), (ii) ve (iii)
  dogru: E
  aciklama:
    dogru_neden: 'BDS 200 denetim riskini “önemli yanlışlık” riski ile tespit edememe riskinin bir fonksiyonu olarak tanımlar.
      BDS 320 önemliliği kullanıcı kararlarını etkileyecek yanlışlıklarla ilişkilendirir. BDS 530 örneklemeyi anakütlenin
      tamamından azına prosedür uygulama olarak tanımlar. Üçü de doğrudur.


      Püf noktaları: Risk modeli (DR = IR x CR x DR), önemlilik ve örnekleme birbiriyle bağlantılıdır; zorluk bu üç kavramın
      birlikte değerlendirilmesindedir.'
    celdiriciler:
      A: (ii) ve (iii) de doğrudur.
      B: (i) ve (iii) de doğrudur.
      C: (iii) de doğrudur.
      D: (i) de doğrudur.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: Tanımlar (Denetim riski)
    alinti: 'Denetim riski: Finansal tabloların önemli bir yanlışlık içermesine rağmen, denetçinin duruma uygun olmayan bir
      denetim görüşü vermesi riskidir. Denetim riski, “önemli yanlışlık” riski ile tespit edememe riskinin bir fonksiyonudur.'
  - mevzuat: BDS 320 Bağımsız Denetimde Önemlilik
    madde: '2'
    alinti: Genel olarak eksiklik ve yanlışlıkların -tek başına veya toplu olarak- finansal tablo kullanıcılarının bu tablolara
      istinaden alacakları ekonomik kararları etkilemesi makul ölçüde bekleniyorsa, söz konusu eksiklik ve yanlışlıklar önemli
      olarak değerlendirilir.
  - mevzuat: BDS 530 Bağımsız Denetimde Örnekleme
    madde: 5-(a)
    alinti: 'Denetim örneklemesi (örnekleme): Denetçinin, anakitlenin tamamı hakkında sonuçlara varması için makul bir dayanak
