- id: SMMM-DEN-RSK-0019
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: denetim riski; BDS 210 ön kabul; BDS 300 planlama; BDS 315/330; BDS 320/450 önemlilik; BDS 530 örnekleme
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin denetiminde yönetim, denetçinin çalışmasının kapsamını sınırlayan bir sözleşme şartı önermiş; denetçi
    bu sınırlamanın görüş vermekten kaçınmayı gerektireceğini değerlendirmiştir. Sözleşme kabul edildikten sonra yeni bilgiler
    nedeniyle başlangıçta belirlenen önemliliğin düşürülmesi gerekmiş ve örneklem seçilmiştir. Denetim boyunca biriktirilen
    yanlışlıklar da başlangıçtaki önemliliğe yaklaşmıştır. Bu durumda aşağıdaki işlemlerden hangisi BDS hükümleriyle birlikte
    değerlendirildiğinde doğrudur?
  secenekler:
    A: Kapsam sınırlaması sözleşmede yer aldığı için denetim kabul edilir; önemlilik değiştirilemez ve örneklem büyüklüğü
      sabit tutulur.
    B: Kapsam sınırlaması ön şartları etkilemez; yanlışlıklar önemliliğe yaklaşsa da yalnızca rapor aşamasında değerlendirilir.
    C: Kapsam sınırlaması bağımsız denetim sözleşmesi olarak kabulü engeller; önemlilik düşürülürse performans önemliliği
      ve denetim prosedürlerinin uygunluğu yeniden değerlendirilir, yanlışlıkların toplamı önemliliğe yaklaştığında planın
      revizyonu değerlendirilir ve örneklem tasarımında amaç ile anakitle özellikleri dikkate alınır.
    D: Örnekleme riskini azaltmak için her durumda anakitlenin tamamı incelenir; önemlilik yalnızca rapor görüşünü belirlemek
      için kullanılır.
    E: Yönetimin sorumluluklarını üstlenmesi konusunda mutabakat alınamasa bile denetçi sözleşmeyi kabul eder; yeni bilgiler
      yalnızca BDS 530 kapsamında dikkate alınır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 210/7 kapsamı sınırlayan ve görüş vermekten kaçınmayı gerektirecek şartın kabulünü engeller. BDS 320/13,
      önemliliğin düşürülmesi hâlinde performans önemliliği ile uygulanan veya uygulanacak prosedürlerin uygunluğunun değerlendirilmesini
      gerektirir. BDS 450/6, biriktirilen yanlışlıklar önemliliğe yaklaştığında genel strateji ve planın revizyonunun değerlendirilmesini
      ister. BDS 530/6 örneklem tasarımında prosedürün amacı ve anakitle özelliklerinin dikkate alınmasını öngörür. Püf noktaları:
      Burada kabul aşaması, önemlilik, yanlışlıkların toplu etkisi ve örnekleme ayrı ayrı değil, denetimin birbirini izleyen
      kararları olarak okunmalıdır.'
    celdiriciler:
      A: BDS 210/7 kapsam sınırlaması görüş vermekten kaçınmayı gerektirecekse sözleşmenin bağımsız denetim sözleşmesi olarak
        kabul edilmemesini öngörür.
      B: BDS 450/6 yanlışlıkların önemliliğe yaklaşmasını planın revizyonu açısından denetim sırasında dikkate alınacak bir
        durum olarak düzenler.
      D: BDS 530 örneklemenin tasarlanmasını öngörür; her durumda anakitlenin tamamının incelenmesini zorunlu kılmaz.
      E: BDS 210/8, yönetimin gerekli mutabakatının alınmaması durumunda, mevzuatta aksi zorunlu kılınmadıkça sözleşmenin
        kabul edilmemesini öngörür.
  kaynaklar:
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: md. 7-8
    alinti: "7.    Yönetimin veya üst yönetimden sorumlu olanların sözleşmede denetçinin yapacağı çalışmanın\n      kapsamını\
      \ sınırlandıracak şartlar teklif etmesi ve bu sınırlandırmanın finansal tablolar\n      hakkında görüş vermekten kaçınmasını\
      \ gerektireceğine inanması hâlinde denetçi, mevzuatla\n      aksi zorunlu kılınmadıkça, kapsamı sınırlandırılan bu sözleşmeyi\
      \ bir bağımsız denetim\n      sözleşmesi olarak kabul etmez.\nDenetim Sözleşmesinin Kabulünü Etkileyen Diğer Etkenler"
  - mevzuat: BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik
    madde: md. 13
    alinti: "13.      Denetçi, bir bütün olarak finansal tablolar için başlangıçta belirlediğinden (ve -uygun hâllerde-\n\
      \         özel işlem sınıfları, hesap bakiyeleri veya açıklamalar için belirlediği önemlilik düzeyi veya\n         düzeylerinden)\
      \ daha düşük bir önemliliğin uygun olduğu sonucuna varması durumunda,\n         performans önemliliğinin değiştirilmesinin\
      \ gerekli olup olmadığına ve uygulanan veya\n         uygulanacak olan denetim prosedürlerinin niteliğinin, zamanlamasının\
      \ ve kapsamının hâlâ\n         uygun olup olmadığına karar verir."
  - mevzuat: BDS 450 Denetim Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: md. 6
    alinti: 6.       De
  - mevzuat: BDS 530 Denetim Örneklemesi
    madde: md. 6
    alinti: "6.    Denetçi bir denetim örneklemini tasarlarken, denetim prosedürünün amacını ve örneklemin\n      seçileceği\
      \ anakitlenin özelliklerini mütalaa eder (Bakınız: A4-A9 paragrafları)."
