      yüksek risk için daha ikna edici kanıt elde edilir ve örneklem riski kabul edilebilir düşük seviyeye indirilir.
    E: Örnekleme yalnızca düşük riskli alanlarda kullanılabilir ve risk yükseldiğinde örneklem küçültülür.
