      değerlendirilir.
    B: Yüksek risk daha az ikna edici kanıt gerektirir; örneklem büyüklüğü riskten bağımsızdır.
    C: Ön kabul yalnızca sözleşme imzalandıktan sonra değerlendirilir; planlama risk değerlendirmesinden bağımsızdır.
