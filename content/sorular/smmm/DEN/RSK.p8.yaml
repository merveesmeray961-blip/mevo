- id: SMMM-DEN-RSK-0021
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: denetim riski; BDS 210 ön kabul; BDS 300 planlama; BDS 315/330; BDS 320/450 önemlilik; BDS 530 örnekleme
  tip: uygulama
  zorluk: 2
  kok: Denetçi, bir hesap bakiyesi için önemli yanlışlık riskini yüksek değerlendirmiştir. Bu risk değerlendirmesinden sonra
    uygulanacak müteakip denetim prosedürlerinin niteliği, zamanlaması ve kapsamının belirlenmesinde hangi yaklaşım BDS 315
    ve BDS 330 ile uyumludur?
  secenekler:
    A: Risk değerlendirmesi prosedürlerin niteliği, zamanlaması ve kapsamını etkilemez; tüm hesaplara aynı prosedür uygulanır.
    B: Denetçi yalnızca finansal tablo düzeyindeki riski dikkate alır, yönetim beyanı düzeyindeki riski dikkate almaz.
    C: Müteakip denetim prosedürleri, yönetim beyanı düzeyinde değerlendirilen önemli yanlışlık risklerini esas alacak ve
      bu risklere karşılık verecek şekilde tasarlanıp uygulanır.
    D: Risk yüksekse denetçi denetim kanıtı toplamadan görüş verir.
    E: Risk değerlendirmesi yalnızca denetim raporu yazıldıktan sonra yapılır.
  dogru: C
  aciklama:
    dogru_neden: BDS 330/6, niteliği, zamanlaması ve kapsamı yönetim beyanı düzeyinde değerlendirilen önemli yanlışlık risklerini
      esas alan ve bu risklere karşılık veren müteakip denetim prosedürlerinin tasarlanıp uygulanmasını öngörür. BDS 315/5
      de risklerin yönetim beyanı düzeyinde değerlendirilmesini ve yapısal risk ile kontrol riskinin ayrı ayrı değerlendirilmesini
      düzenler.
    celdiriciler:
      A: BDS 330/6 risk değerlendirmesinin prosedürlerin niteliği, zamanlaması ve kapsamına temel oluşturduğunu açıkça düzenler.
      B: BDS 315/5 yönetim beyanı düzeyinde risk değerlendirmesini açıkça öngörür.
      D: Risk değerlendirmesi denetim kanıtı toplama ve uygun prosedür uygulama sürecinin temelidir; kanıtsız görüş sonucu
        doğurmaz.
      E: Risk değerlendirmesi denetimin yürütülmesi sırasında ve öncesinde planlamayla bağlantılı olarak yapılır.
  kaynaklar:
  - mevzuat: BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: md. 5
    alinti: "5.       BDS 200 uyarınca “önemli yanlışlık” riskleri, yeterli ve uygun denetim kanıtının elde edilmesi\n   \
      \      için gereken müteakip denetim prosedürlerinin niteliğini, zamanlamasını ve kapsamını\n         belirlemek amacıyla\
      \ yönetim beyanı düzeyinde değerlendirilir.6 Bu BDS, yönetim beyanı\n         düzeyinde belirlenen “önemli yanlışlık”\
      \ riskleri için yapısal risk ve kontrol riskinin ayrı ayrı\n         değerlendirilmesini gerektirir."
  - mevzuat: BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler
    madde: md. 6
    alinti: "6.       Denetçi; niteliği, zamanlaması ve kapsamı, yönetim beyanı düzeyinde “önemli yanlışlık” riski\n     \
