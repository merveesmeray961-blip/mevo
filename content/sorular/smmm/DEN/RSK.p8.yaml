- id: SMMM-DEN-RSK-0031
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: denetim riski; BDS 210 ön kabul; BDS 300 planlama; BDS 315/330; BDS 320/450 önemlilik; BDS 530 örnekleme
  tip: uygulama
  zorluk: 3
  kok: Yeni bir müşteri denetiminde ekip; (i) yönetimin finansal tabloların hazırlanması ve denetçiye gerekli bilgilere erişim
    sağlanmasına ilişkin sorumluluklarını üstlenip üstlenmediğini değerlendiriyor, (ii) genel denetim stratejisini ve denetim
    planını oluşturuyor, (iii) yönetim beyanı düzeyinde önemli yanlışlık risklerini belirleyip değerlendiriyor, (iv) bu risklere
    karşı müteakip denetim prosedürlerini tasarlıyor, (v) performans önemliliğini belirliyor, (vi) örnekleme uygulamasında
    örnekleme riskini dikkate alıyor ve (vii) düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce önemliliği yeniden
    değerlendiriyor. Aşağıdaki eşleştirmelerden hangisi bu işlemlerin dayandığı standartları doğru verir?
  secenekler:
    A: (i) BDS 300; (ii) BDS 210; (iii) BDS 450; (iv) BDS 530; (v) BDS 315; (vi) BDS 320; (vii) BDS 330.
    B: (i) BDS 210; (ii) BDS 300; (iii) BDS 315; (iv) BDS 330; (v) BDS 320; (vi) BDS 530; (vii) BDS 450.
    C: (i) BDS 210; (ii) BDS 315; (iii) BDS 300; (iv) BDS 320; (v) BDS 330; (vi) BDS 450; (vii) BDS 530.
    D: (i) BDS 210; (ii) BDS 300; (iii) BDS 330; (iv) BDS 315; (v) BDS 450; (vi) BDS 530; (vii) BDS 320.
    E: (i) BDS 210; (ii) BDS 320; (iii) BDS 315; (iv) BDS 300; (v) BDS 330; (vi) BDS 530; (vii) BDS 450.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 210 denetimin ön şartlarını ve yönetimin sorumlulukları üzerindeki mutabakatı; BDS 300 genel denetim
      stratejisi ile denetim planını; BDS 315 önemli yanlışlık risklerinin belirlenmesi ve değerlendirilmesini; BDS 330 değerlendirilen
      risklere karşı müteakip denetim prosedürleri tasarlanmasını; BDS 320 performans önemliliğinin belirlenmesini; BDS 530
      örnekleme riskini; BDS 450 ise düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce önemliliğin yeniden değerlendirilmesini
      düzenler. Püf noktaları: Riskin belirlenmesi BDS 315, riske karşı yapılacak işlerin tasarlanması BDS 330''dur; önemlilikte
      BDS 320, düzeltilmemiş yanlışlıkların değerlendirilmesinde ise BDS 450 ayrıca dikkate alınır.'
    celdiriciler:
      A: BDS 210 ile BDS 300'ün rolleri ters çevrilmiş; BDS 450 de örnekleme standardı değildir.
      C: BDS 300 planlama, BDS 315 risklerin belirlenmesi ve değerlendirilmesi, BDS 320 performans önemliliği, BDS 530 örnekleme
        ve BDS 450 düzeltilmemiş yanlışlıkların değerlendirilmesiyle ilgilidir.
      D: BDS 315 risklerin belirlenmesi ve değerlendirilmesini, BDS 330 ise bu risklere karşı müteakip denetim prosedürlerini
        düzenler; seçenek bunları ters vermektedir.
      E: BDS 320 performans önemliliğiyle, BDS 300 planlamayla ve BDS 450 düzeltilmemiş yanlışlıkların etkisinin değerlendirilmesiyle
        ilgilidir; seçenek bu eşleştirmeleri karıştırmaktadır.
  kaynaklar:
  - mevzuat: BDS 210 “Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması”
    madde: md. 6
    alinti: "6.      Denetimin ön şartlarının mevcut olup olmadığını tespit etmek amacıyla denetçi;\n               Finansal\
      \ tabloların hazırlanmasında kullanılan finansal raporlama çerçevesinin kabul\n               edilebilir olup olmadığını\
      \ belirler (Bkz.: A2-A10 paragrafları),\n               Yönetimin aşağıdaki sorumluluklarını anladığına ve üstlendiğine\
      \ dair mutabakatını alır\n               (Bkz.: A11-A14, A21 paragrafları):"
  - mevzuat: BDS 300 “Finansal Tabloların Bağımsız Denetiminin Planlanması”
    madde: md. 7 ve 9
    alinti: "7.       Denetçi denetimin kapsamını, zamanlamasını ve yönünü belirleyen ve denetim planının\n         geliştirilmesine\
      \ yönelik rehberlik sağlayan genel denetim stratejisini oluşturur."
  - mevzuat: BDS 330 “Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler”
    madde: md. 6 ve 18
    alinti: "6.       Denetçi; niteliği, zamanlaması ve kapsamı, yönetim beyanı düzeyinde “önemli yanlışlık” riski\n     \
      \    olarak değerlendirilen riskleri esas alan ve söz konusu risklere karşılık veren müteakip denetim\n         prosedürlerini\
      \ tasarlar ve uygular (Bkz.: A4-A8 ve A43-A54 paragrafları)."
  - mevzuat: BDS 330 “Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler”
    madde: md. 18
    alinti: "18.   Denetçi, “önemli yanlışlık” riski olarak değerlendirilen risklerden bağımsız olarak, her bir\n      önemli\
      \ işlem sınıfı, hesap bakiyesi ve açıklama için maddi doğrulama prosedürleri tasarlar ve\n      uygular (Bkz.: A43-A49\
      \ paragrafları)."
  - mevzuat: BDS 320 “Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik”
    madde: md. 11
    alinti: "11.      Denetçi, “önemli yanlışlık” risklerini değerlendirmek ve müteakip denetim prosedürlerinin\n        \
      \ niteliğine, zamanlamasına ve kapsamına karar vermek amacıyla performans önemliliğini\n         belirler (Bkz.: A13\
      \ paragrafı)."
  - mevzuat: BDS 450 “Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi”
    madde: md. 10
    alinti: "10.      Denetçi, düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce BDS 320’ye uygun\n         olarak\
      \ belirlenen önemliliğin, işletmenin fiili finansal sonuçları kapsamında hâlâ geçerli olup\n         olmadığını doğrulamak\
      \ için önemliliği yeniden değerlendirir (Bkz.: A14-A15 paragrafları)."
  - mevzuat: BDS 530 “Bağımsız Denetimde Örnekleme”
    madde: Tanım – Örnekleme riski
    alinti: "Örnekleme riski: Denetçinin bir örneklemi temel alarak vardığı sonucun, aynı denetim\n           prosedürünün\
      \ anakitlenin tamamına uygulanması durumunda varılacak sonuçtan farklı\n           olması riskidir."
