- id: SMMM-DEN-RSK-0022
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: makul güvence
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, finansal tabloların önemli bir yanlışlık içerip içermediğine ilişkin görüşüne dayanak oluşturmak üzere
    yeterli ve uygun kanıt toplamıştır. Ancak denetim kanıtlarının kesin olmaktan çok ikna edici olması ve denetimin yapısal
    kısıtlamaları nedeniyle mutlak güvence sağlayamayacağını da dikkate almaktadır. BDS 200'e göre bu durum aşağıdakilerden
    hangisini ifade eder?
  secenekler:
    A: Sınırlı güvence sağlandığını
    B: Mutlak güvence sağlandığını
    C: Yalnızca mesleki şüphecilik uygulandığını
    D: Makul güvence sağlandığını
    E: Görüş vermekten kaçınılması gerektiğini
  dogru: D
  aciklama:
    dogru_neden: 'BDS 200''e göre denetçinin denetim riskini kabul edilebilir düşük bir seviyeye indirmek için yeterli ve
      uygun denetim kanıtı elde etmesi makul güvence sağlar; makul güvence yüksek bir güvence seviyesidir ancak mutlak güvence
      değildir.


      Püf noktaları: Yüksek güvence ile mutlak güvenceyi birbirine karıştırmamak gerekir; BDS 200 makul güvenceyi yüksek,
      fakat mutlak olmayan güvence olarak ele alır.'
    celdiriciler:
      A: Sınırlı güvence, burada belirtilen yüksek güvence seviyesini ifade etmez.
      B: Standart, denetimin yapısal kısıtlamaları nedeniyle makul güvencenin mutlak olmadığını açıkça belirtir.
      C: Mesleki şüphecilik denetimin yürütülme biçimidir; güvence seviyesinin adı değildir.
      E: Yeterli ve uygun kanıt elde edilmesi tek başına görüş vermekten kaçınmayı gerektirmez.
