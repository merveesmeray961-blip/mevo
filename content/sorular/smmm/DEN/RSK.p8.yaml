      ve deneyimin uygulanmasını içerir. 120.5 U5'e göre denetçi, uzmanlık ve deneyiminin yeterli olup olmadığını ve konuyla
      ilgili uzmanlık veya deneyime sahip başka kişilere danışma ihtiyacını değerlendirebilir.
    celdiriciler:
      A: İlk kanaati destekleyen bilgiye dayanmak, metnin öngördüğü yeterlilik ve danışma değerlendirmelerinin yerine geçmez.
      B: Mesleki muhakeme yalnız teknik bilgi yetersizliğiyle sınırlı değildir; mesleki faaliyetin niteliği ve kapsamı ile
        çıkar ve ilişkiler de dikkate alınır.
      D: Yönetimin görüşü, denetçinin ilgili eğitim, bilgi, beceri ve deneyimi uygulama yükümlülüğünü ortadan kaldırmaz.
      E: Başka kişilere danışma ihtiyacının değerlendirilmesi mümkündür; bu, denetçinin kendi mesleki muhakemesini tamamen
