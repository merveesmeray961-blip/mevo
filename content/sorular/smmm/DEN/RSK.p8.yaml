    A: İlk açıklama önceki kanaati desteklediği için ek değerlendirme yapmadan aynı sonuca varmak.
    B: Mesleki muhakemeyi yalnızca teknik bilgi yetersizliği varsa kullanmak.
    C: İlgili eğitim, bilgi, beceri ve deneyimi durumun niteliğine göre uygulamak; uzmanlık veya deneyimin yeterliliğini ve
      gerekirse başka uzmanlara danışma ihtiyacını değerlendirmek.
    D: Mesleki muhakemeyi kullanmamak; yalnızca yönetimin yazılı görüşünü esas almak.
    E: Karmaşık konularda yalnızca kıdemli denetçinin kararını uygulamak ve kendi değerlendirmesini yapmamak.
