- id: SMMM-DEN-RSK-0020
  sinav: smmm
  bolum:
  - YET
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: makul güvence
  tip: kavrama
  zorluk: 3
  kok: Bir denetim sözleşmesinde ilgili mevzuatta veya sözleşmede açıkça sınırlı güvence sağlanacağı belirtilmemiştir. Yönetmelikteki
    güvence seviyesine ilişkin hükme göre denetimin hangi güvence seviyesinde gerçekleştirilmesi esastır ve bunun kapsam bakımından
    sonucu nedir?
  secenekler:
    A: Denetim sınırlı güvenceyle yapılır ve kapsam her zaman aynı tutulur.
    B: Denetim güvence sağlamaz; yalnızca rapor düzenlenir.
    C: Denetim makul güvence verecek şekilde gerçekleştirilir; makul ve sınırlı güvence seviyesinin gerektirdiği denetimin
      kapsamı TDS çerçevesinde belirlenir.
    D: Güvence seviyesi yalnızca işletme tarafından belirlenir ve kapsam TDS dışında tutulur.
    E: Açıkça sınırlı güvence belirtilmemişse denetim otomatik olarak görüş bildirmekten kaçınma şeklinde yapılır.
  dogru: C
  aciklama:
    dogru_neden: BDY md. 5/2, denetimin kullanıcılara makul veya sınırlı güvence sağlayabileceğini; sınırlı güvence ilgili
      mevzuatta veya denetim sözleşmesinde açıkça belirtilmemişse denetimin makul güvence verecek şekilde gerçekleştirileceğini
      ve kapsamın TDS çerçevesinde belirleneceğini düzenler.
    celdiriciler:
      A: Açık bir sınırlı güvence hükmü yoksa Yönetmelik makul güvenceyi esas alır.
      B: Yönetmelik denetimin güvence sağlamak amacıyla yapılmasını öngörür.
      D: Kapsam TDS çerçevesinde belirlenir; yalnızca işletmenin tek taraflı tercihine bırakılmaz.
      E: Görüşten kaçınma güvence seviyesinin otomatik sonucu değildir.
  kaynaklar:
  - mevzuat: KGK Bağımsız Denetim Yönetmeliği
    madde: md. 5/2
    alinti: '(2) Denetim, kullanıcılara denetim konusunun denetim kıstasına uyumuyla ilgili makul veya sınırlı güvence sağlar.
      Sınırlı güvence sağlayacağı ilgili

      mevzuatında veya denetim sözleşmesinde açıkça belirtilmemiş ise denetim makul güvence verecek şekilde gerçekleştirilir.
