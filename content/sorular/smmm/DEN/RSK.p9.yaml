      olumlu dışında görüş veya mümkünse çekilme gerekip gerekmediğinin değerlendirilmesini; ayrıca durumun BDS 230 uyarınca
      belgelendirilmesi gereken önemli bir duruma işaret ettiğini belirtir.
    celdiriciler:
      A: I tek başına doğru değildir; II ve III de paragraf 24'te yer alır.
      B: I ve II doğrudur, ancak III'teki belgelendirme sonucu da açıkça düzenlenmiştir.
