    BDS 200 bakımından sonuçlarını değerlendirmektedir. Aşağıdaki eşleştirmelerden hangisi doğrudur?

    I. İlgili BDS amacına ulaşılamaması — genel amaçlara ulaşmaya etkisi değerlendirilir.

    II. Genel amaçlara ulaşmanın engellenmesi — olumlu dışında görüş veya mevzuat izin veriyorsa denetimden çekilme gerekip
    gerekmediği değerlendirilir.

    III. İlgili BDS amacına ulaşılamaması — belgelendirilmesi gereken önemli bir duruma işaret eder.'
