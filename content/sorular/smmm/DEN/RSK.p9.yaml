      denetim makul güvence verecek şekilde gerçekleştirilir.
    D: Sınırlı güvence her durumda makul güvenceden daha yüksek bir seviyedir.
    E: Makul ve sınırlı güvence arasında standartlar bakımından hiçbir fark yoktur.
