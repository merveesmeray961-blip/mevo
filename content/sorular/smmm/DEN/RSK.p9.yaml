  aciklama:
    dogru_neden: BDS 200 mesleki muhakemeyi, eğitim, bilgi ve deneyim çerçevesinde BDS'ler ve ilgili mevzuatın gereklerine
      uygun olarak bilinçli karar verme süreci olarak ele alır; denetim mevcut şartlara göre yürütülür.
    celdiriciler:
      A: Mesleki muhakeme önceki yönteme körü körüne bağlılık değildir.
      B: Mesleki muhakeme denetimin farklı aşamalarında kullanılır.
      D: Mesleki muhakeme denetçinin sorumluluğundadır.
      E: Yeni bilgi ve kanıtlar değerlendirmede dikkate alınır.
