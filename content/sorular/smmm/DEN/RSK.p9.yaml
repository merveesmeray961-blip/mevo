    III. Makul güvence


    a. Denetimin planlanması ve yürütülmesinde kullanılır.

    b. Önemli yanlışlık doğurabilecek şartların bulunabileceği kabulüyle denetimin planlanması ve yürütülmesidir.

    c. Denetim riskini kabul edilebilir düşük seviyeye indirmek için yeterli ve uygun kanıt elde edilmesini gerektirir.


