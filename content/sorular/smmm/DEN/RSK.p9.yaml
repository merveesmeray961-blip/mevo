      yanlışlıkların düzeltilmesi hâlinde denetçi bunların kalıp kalmadığını değerlendirmek için ilave prosedürler uygular.
    B: BDS 300 yalnızca denetim raporu yazımını planlamayı, BDS 320 yalnızca başlangıç önemliliğini belirlemeyi, BDS 450 ise
      düzeltilen yanlışlıklar için hiçbir ilave prosedür uygulanmamasını öngörür.
    C: BDS 300 planlamayı yalnızca sorumlu denetçinin görevi sayar; BDS 320 önemliliği sadece rapor yazımında kullanır; BDS
      450 yalnızca hile kaynaklı yanlışlıkları kapsar.
    D: BDS 300 planlamayı denetimin sonunda yapar; BDS 320 önemliliği örneklem seçimine indirger; BDS 450 yönetimin yaptığı
      düzeltmelerin yeniden incelenmesini yasaklar.
    E: BDS 300 planlamayı yalnızca denetim ekibi dışındaki uzmanlara bırakır; BDS 320 önemlilik kavramının kullanımını yasaklar;
      BDS 450 yanlışlıkların yönetime bildirilmesini zorunlu kılmaz.
  dogru: A
  aciklama:
    dogru_neden: 'A seçeneği üç ayrı standardın birbirini tamamlayan hükümlerini doğru verir: BDS 300 md. 4 planlama amacını,
      BDS 320 md. 5 önemliliğin kullanım alanlarını, BDS 450 md. 7 ise yönetim düzeltme yaptıktan sonra yanlışlıkların kalıp
      kalmadığının ilave prosedürlerle değerlendirilmesini düzenler.'
    celdiriciler:
      B: BDS 300’ün amacı denetimin etkin yürütülmesini sağlayacak şekilde planlamaktır; BDS 320 önemliliği yalnız başlangıçta
        değil birden çok aşamada kullanır; BDS 450 düzeltme sonrası ilave prosedür öngörür.
      C: BDS 300 planlamaya kilit ekip üyelerinin katılımını da düzenler; BDS 320 yalnız rapor yazımına indirgenemez; BDS
        450 yalnız hile yanlışlıklarıyla sınırlı değildir.
      D: BDS 300 planlamayı denetimin başında ele alır; BDS 320 önemliliği örnekleme kavramına indirgemez; BDS 450 düzeltme
        sonrası ilave prosedür öngörür.
      E: BDS 300 ve BDS 320’de planlama ve önemlilik düzenlenir; BDS 450 ise yanlışlıkların zamanında bildirilmesi ve düzeltilmesiyle
        ilgilidir.
  kaynaklar:
  - mevzuat: BDS 300 Bağımsız Denetimlerin Planlanması
    madde: md. 4-5
    alinti: 'Amaç 4.       Denetçinin amacı denetimi, etkin yürütülmesini sağlayacak şekilde planlamaktır. Ana Hükümler Denetim
      Ekibindeki Kilit Üyelerin Katılımı 5.       Sorumlu denetçi ve denetim ekibinin diğer kilit üyeleri, planlama ve denetim
      ekibi üyeleri arasında yapılan müzakerelere katılım sağlanması dâhil, denetimin planlanmasında yer alır (Bkz.: A5 paragrafı).'
  - mevzuat: BDS 320 Bağımsız Denetimlerin Planlanması ve Yürütülmesinde Önemlilik
    madde: md. 5
    alinti: '5.      Denetçi önemlilik kavramını; -      Denetimin planlanmasında ve yürütülmesinde, -      Belirlenen yanlışlıkların
      denetim üzerindeki etkilerinin değerlendirilmesinde ve -      Varsa, düzeltilmemiş yanlışlıkların finansal tablolar
      üzerindeki ve denetçi raporundaki görüşün oluşturulmasındaki etkilerinin değerlendirilmesinde, kullanır (Bkz.: A1 paragrafı).'
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: md. 7
    alinti: '7.       Denetçinin talebi üzerine yönetimin bir işlem sınıfını, hesap bakiyesini veya açıklamayı incelemesi
