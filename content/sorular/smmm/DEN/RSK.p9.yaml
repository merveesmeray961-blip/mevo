    denetim kanıtları elde edilmiştir. Elif, 'Önceki yıllarda işe yarayan yöntemi değiştirmemek mesleki muhakemenin gereğidir'
    demektedir. BDS 200'e göre aşağıdaki değerlendirmelerden hangisi doğrudur?
