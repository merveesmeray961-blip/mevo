  kok: 'Aşağıdaki ifadelerin makul güvence (M) veya sınırlı güvence (S) ile eşleştirilmesi istenmektedir:

    I. Sonuç, denetime konu bilgilerin tüm önemli yönleriyle geçerli kıstaslara uygun olarak hazırlandığı şeklinde ifade edilir.

    II. Sonuç, uygulanan prosedürler ve elde edilen kanıtlara dayanarak önemli yanlışlığa işaret eden bir hususun denetçinin
    dikkatini çekip çekmediği biçiminde ifade edilir.

    III. Uygulanan prosedürlerin niteliği, zamanlaması ve kapsamı makul güvence denetimine göre oldukça sınırlıdır.

    IV. Güvence denetimi riskinin kabul edilebilir düşük seviyeye indirilmesi, makul güvence denetiminin tanımlayıcı unsurudur.

    Doğru eşleştirme aşağıdakilerden hangisidir?'
  secenekler:
    A: I-S, II-M, III-M, IV-S
    B: I-M, II-S, III-S, IV-M
    C: I-M, II-M, III-S, IV-S
    D: I-S, II-S, III-M, IV-M
    E: I-S, II-M, III-S, IV-M
  dogru: B
  aciklama:
    dogru_neden: I ve IV makul güvenceyi; II ve III sınırlı güvenceyi tanımlar. GDS 3000, makul güvencede güvence denetimi
      riskinin kabul edilebilir düşük düzeye indirilmesini, sınırlı güvencede ise prosedürlerin makul güvenceye göre oldukça
      sınırlı olmasını ve sonucun dikkat çekip çekmeyen husus biçiminde ifade edilmesini öngörür.
    celdiriciler:
      A: I olumlu sonuç niteliğindeki makul güvenceye aittir; II sınırlı güvencedir ve ters eşleştirilmiştir.
      C: II'nin ifadesi sınırlı güvenceye özgüdür; bu nedenle C yanlıştır.
      D: I makul, II sınırlı güvenceye aittir; D her ikisini ters yerleştirir.
      E: IV makul güvenceyi tanımlar; E IV'ü doğru eşleştirse de I ve II'yi ters çevirmiştir.
