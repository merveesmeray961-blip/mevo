- id: SMMM-DEN-RSK-0041
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: denetim riski; BDS 210 ön kabul; BDS 300 planlama; BDS 315/330; BDS 320/450 önemlilik; BDS 530 örnekleme
  tip: kavrama
  zorluk: 3
  kok: 'Bir denetçi yeni bir finansal tablo denetimini yürütmektedir. Aşağıdaki aşamaların her birini ilgili BDS hükümlerine
    uygun zamanda yerine getirecektir:

    I. Denetim sözleşmesinin ön şartlarını ve yönetimin sorumluluklarına ilişkin mutabakatı değerlendirmek.

    II. Genel denetim stratejisini ve denetim planını oluşturmak.

    III. Önemli yanlışlık risklerini belirleyip değerlendirmek.

    IV. Bir bütün olarak finansal tablolar için önemliliği ve gerekli hâllerde performans önemliliğini belirlemek.

    V. Değerlendirilen risklere karşı müteakip denetim prosedürlerini tasarlamak.

    VI. Örneklem büyüklüğünü örnekleme riskini kabul edilebilir düşük düzeye indirecek şekilde belirlemek.

    VII. Biriktirilen yanlışlıkların önemlilikle ilişkisini değerlendirerek gerektiğinde planı revize etmek.

    Bu aşamaların BDS''lerdeki mantıksal sıralaması aşağıdakilerden hangisidir?'
  secenekler:
    A: II - I - III - IV - V - VI - VII
    B: I - III - II - IV - VI - V - VII
    C: I - II - IV - III - V - VII - VI
    D: I - II - III - IV - V - VI - VII
    E: I - II - III - V - IV - VI - VII
  dogru: D
  aciklama:
    dogru_neden: 'Ön şartlar ve sözleşmenin kabulü BDS 210 kapsamında önce gelir; BDS 300 planlamayı, BDS 315 risk değerlendirmesini,
      BDS 320 önemlilik belirlemesini ve BDS 330 risklere karşı prosedürleri izler. BDS 530 örnekleme uygulamasında örneklem
      büyüklüğü belirlenir; BDS 450 ise denetim boyunca biriktirilen yanlışlıkların önemlilikle ilişkisi ortaya çıktığında
      planın revizyonunu gündeme getirir.


      Püf noktaları: Sorudaki sıralama, standart adlarının ezberinden çok kabul, planlama, risk değerlendirmesi, önemlilik,
      risklere karşılık, örnekleme ve yanlışlıkların yeniden değerlendirilmesi arasındaki işlem akışını ayırt etmeyi gerektirir.'
    celdiriciler:
      A: Genel denetim stratejisi, denetimin ön şartlarının ve kabulünün yerine geçmez.
      B: Risk değerlendirmesi, genel denetim planlamasından sonra gelen bir aşamadır; ancak önemlilikten önce değerlendirilmesi
        gerekir.
      C: Önemlilik belirleme, risk değerlendirmesinden bağımsız olarak müteakip prosedürlerden sonra yapılmaz.
      E: BDS 330 risklere karşı prosedürleri, BDS 320 önemlilik belirlemesinden sonra gelen planlı bir karşılık olarak ele
        alır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 210
    madde: 6-8. paragraflar
    alinti: "Denetimin ön şartlarının mevcut olup olmadığını tespit etmek amacıyla denetçi;\n               Finansal tabloların\
      \ hazırlanmasında kullanılan finansal raporlama çerçevesinin kabul\n               edilebilir olup olmadığını belirler\
      \ (Bkz.: A2-A10 paragrafları),"
  - mevzuat: BDS 300
    madde: 7 ve 9. paragraflar
    alinti: "7.       Denetçi denetimin kapsamını, zamanlamasını ve yönünü belirleyen ve denetim planının\n         geliştirilmesine\
      \ yönelik rehberlik sağlayan genel denetim stratejisini oluşturur.\n8.       Genel denetim stratejisini oluştururken\
      \ denetçi, BDS 220 (Revize)’nin hükümlerini yerine\n         getirirken elde edilen bilgileri dikkate alır ve:\n   \
      \             Denetimin kapsamını tanımlayan denetimin özelliklerini belirler.\n                Denetimin zamanlamasını\
      \ ve kurulması gereken iletişimlerin niteliğini planlamak\n  "
  - mevzuat: BDS 315
