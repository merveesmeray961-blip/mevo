- id: SMMM-DEN-RSK-0062
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: makul güvence
  tip: kavrama
  zorluk: 2
  kok: Bir işletmenin finansal tabloları bağımsız denetimden geçmiştir. Yönetim, denetimin makul güvence sağladığını ileri
    sürerek finansal tabloların hazırlanmasına ilişkin kendi sorumluluğunun ortadan kalktığını savunmaktadır. BDS 200’e göre
    aşağıdaki karşılaştırmalardan hangisi doğrudur?
  secenekler:
    A: Makul güvence yüksek olduğundan yönetimin finansal tabloları hazırlama sorumluluğu denetçiye geçer.
    B: Makul güvence mutlak olmadığı için denetim yönetimin sorumluluğunu ortadan kaldırmaz; finansal tabloların denetlenmiş
      olması yönetimin ve uygun hâllerde üst yönetimden sorumlu olanların sorumluluklarını ortadan kaldırmaz.
    C: Makul güvence yalnız denetçinin sorumluluğunu belirler; yönetimin sorumluluğu denetim tamamlanınca sona erer.
    D: Finansal tabloların denetlenmiş olması, yalnız üst yönetimden sorumlu olanların sorumluluğunu kaldırır; yönetimin sorumluluğu
      devam eder.
    E: Makul güvence yüksek olduğundan yönetim, finansal tabloların hazırlanması yerine yalnız denetçiye bilgi vermekten sorumludur.
  dogru: B
  aciklama:
    dogru_neden: BDS 200 md. 4, BDS’lere uygun denetimin yönetimin ve uygun hâllerde üst yönetimden sorumlu olanların belirli
      sorumlulukları üstlendikleri ön kabulüne dayandığını; finansal tabloların denetlenmiş olmasının bu kişilerin sorumluluklarını
      ortadan kaldırmadığını belirtir. Aynı standardın md. 5’i makul güvencenin yüksek ancak yapısal kısıtlamalar nedeniyle
      mutlak olmayan bir güvence olduğunu açıklar.
    celdiriciler:
      A: Denetim görüşü yönetimin finansal tablo hazırlama sorumluluğunu denetçiye devretmez.
      C: Makul güvence denetçinin güvence düzeyidir; yönetimin finansal tablo hazırlama sorumluluğunun sona ermesi sonucunu
        doğurmaz.
      D: Md. 4, hem yönetimin hem de uygun hâllerde üst yönetimden sorumlu olanların sorumluluklarının denetim nedeniyle ortadan
        kalkmadığını belirtir.
      E: Yönetimin sorumluluğu yalnız bilgi sağlamakla sınırlı değildir; finansal tabloların hazırlanmasına ilişkin sorumluluklar
        devam eder.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: md. 4
    alinti: 'geçersiz kılmaz. Ancak BDS’lere uygun bir denetim, yönetimin ve -uygun hâllerde- üst yönetimden sorumlu olanların,
      denetimin yürütülmesi için gerekli olan belirli sorumlulukları üstlendikleri ön kabulüne dayalı olarak yürütülür. Finansal
      tabloların denetlenmiş olması, yönetimin veya üst yönetimden sorumlu olanların sorumluluklarını ortadan kaldırmaz (Bkz.:
      A2-A11 paragrafları).'
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: md. 5
    alinti: 5.      BDS’ler, bir bütün olarak finansal tabloların hata veya hile kaynaklı önemli bir yanlışlık içerip içermediği
      konusunda denetçinin, vereceği görüşe dayanak oluşturacak makul bir güvence elde etmesini zorunlu kılar. Makul güvence
      yüksek bir güvence seviyesidir. Denetçi, denetim
