- id: SMMM-DEN-RSK-0061
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk
  konu: RSK
  kazanim: BDS 200 amaç
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, önemli bir hesap bakiyesine ilişkin yönetim açıklamasını destekleyen tek belgenin güvenilirliği konusunda
    şüphe uyandıran bilgiler elde etmiştir. Yönetim aynı açıklamanın yeterli olduğunu savunmakta, ancak denetçi ek bir prosedür
    uygulamadan belgeyi kabul etmeyi düşünmektedir. BDS 200’e göre bu durumda aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: Belge işletme tarafından sunulduğu için denetçi ek değerlendirme yapmadan kabul edebilir.
    B: Mesleki şüphecilik yalnız hile şüphesi kesinleştiğinde uygulanır; burada uygulanmaz.
    C: Denetçi, kanıtın güvenilirliğine ilişkin şüpheyi dikkate almalı ve şartlar gerektiriyorsa ilave denetim prosedürlerini
      değerlendirmelidir.
    D: Yönetimin açıklaması tek başına yeterli olduğundan denetim kanıtı miktarı önem taşımaz.
    E: Mesleki şüphecilik yalnız denetim planlamasında kullanılır; denetim kanıtlarının değerlendirilmesine uygulanmaz.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 200 md. 15, denetçinin önemli yanlışlığa yol açabilecek şartların bulunabileceğini kabul ederek mesleki
      şüphecilik içinde denetimi planlamasını ve yürütmesini ister. A21-A23’te de güvenilirliği şüpheli belgeler, hile göstergeleri
      ve ilave prosedür gerektirebilecek durumlar karşısında dikkatli olunması ve kanıtların eleştirel değerlendirilmesi açıklanır.
      Püf noktaları: Şüphe kesinleşmiş bir hile iddiası değildir; güvenilirliğe ilişkin makul bir şüphe dahi eleştirel değerlendirmeyi
      gerektirir.'
    celdiriciler:
      A: BDS 200, belgelerin işletmeden gelmesini tek başına yeterlilik ölçütü olarak kabul etmez.
      B: Mesleki şüphecilik hilenin kesinleşmesini beklemeyi gerektirmez.
      D: Denetçi yeterli ve uygun kanıt elde etmekle yükümlüdür; tek açıklama otomatik olarak yeterli sayılmaz.
      E: Mesleki şüphecilik denetimin planlanması ve yürütülmesini kapsar ve kanıtların değerlendirilmesiyle ilgilidir.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: md. 15
    alinti: 'Mesleki Şüphecilik 15.   Denetçi finansal tabloların önemli ölçüde yanlışlık içermesine sebep olan şartların
      bulunabileceğini kabul ederek, denetimi mesleki şüphecilik içinde planlar ve yürütür (Bkz.: A21-A25 paragrafları).'
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin BDS'lere Uygun Olarak Yürütülmesi
    madde: A21
    alinti: 'A21. Mesleki şüphecilik, örnekleri aşağıda sıralanan durumlara karşı dikkatli olmayı gerektirir: •      Elde
      edilen diğer denetim kanıtlarıyla çelişen denetim kanıtları, •      Denetim kanıtı olarak kullanılacak belgelerin ve
      sorgulamalar sonucunda elde edilen cevapların güvenilirliğinde şüphe uyandıran bilgiler, •      Hile ihtimaline işaret
      edebilecek durumlar, •      BDS’lerde yer alan denetim prosedürlerine ilâve denetim prosedürleri gerektirebilecek durumlar.'
