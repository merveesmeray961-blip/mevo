- id: SMMM-DEN-RSK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk, önemlilik ve planlama
  konu: RSK
  kazanim: BDS 320 önemlilik ve BDS 450 düzeltilmemiş yanlışlıkların değerlendirilmesi
  tip: uygulama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: >-
    (T) AŞ'nin denetiminde denetçi, BDS 320 "Bağımsız Denetimin Planlanması ve Yürütülmesinde
    Önemlilik" uyarınca bir bütün olarak finansal tablolar için önemliliği 800.000 TL, performans
    önemliliğini 600.000 TL olarak; BDS 450 "Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen
    Yanlışlıkların Değerlendirilmesi" kapsamında altında kalan yanlışlıkların bariz biçimde önemsiz
    sayılacağı tutarı ise 40.000 TL olarak belirlemiştir. Denetim boyunca biriktirilen yanlışlıkların
    toplamı 760.000 TL'ye ulaşmıştır. Yönetim, bunlardan ilişkili bir tarafa yapılan satışın yanlış
    dönemde kaydedilmesinden kaynaklanan 300.000 TL tutarındaki yanlışlığı düzeltmeyi reddetmiştir.
    Bu iki standarda göre denetçinin tutumu ile ilgili aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: 300.000 TL'lik düzeltilmemiş yanlışlık, bir bütün olarak finansal tablolar için belirlenen
      önemliliğin altında kaldığından niteliğine bakılmaksızın önemsiz kabul edilir.
    B: Biriktirilen yanlışlıkların toplamı önemliliğe yaklaştığından, genel denetim stratejisi ile
      denetim planının revize edilmesinin gerekip gerekmediğine karar verilir.
    C: Düzeltilmemiş yanlışlıkların etkisi değerlendirilmeden önce, önemliliğin işletmenin fiili
      finansal sonuçları kapsamında hâlâ geçerli olup olmadığı yeniden değerlendirilir.
    D: Yönetimin düzeltme yapmama gerekçeleri hakkında bir kanaate ulaşılır ve finansal tabloların
      önemli yanlışlık içerip içermediği değerlendirilirken bu kanaat dikkate alınır.
    E: Yönetimden, düzeltilmemiş yanlışlıkların tek başına ve toplu hâlde etkisinin önemsiz olduğu
      kanaatine varıp varmadıklarına ilişkin yazılı beyan talep edilir.
  dogru: A
  aciklama:
    dogru_neden: >-
      BDS 320 parag. 6'ya göre planlama sırasında belirlenen önemlilik, bu tutarın altında kalan
      düzeltilmemiş yanlışlıkların her zaman önemsiz olarak değerlendirileceği bir tutar
      oluşturmayabilir; bazı yanlışlıklar önemliliğin altında olsalar bile önemli değerlendirilebilir.
      BDS 450 parag. 11'e göre de denetçi düzeltilmemiş yanlışlıkların önemli olup olmadığına karar
      verirken büyüklüğün yanında niteliği ve meydana geldiği özel şartları mütalaa eder. İlişkili
      tarafla yapılan işlemden kaynaklanan yanlışlığın "niteliğine bakılmaksızın" önemsiz sayılması
      bu iki hükme aykırıdır. Zor soru teknikleri: iki standardın birlikte uygulanması (BDS 320 + 450),
      gereksiz veri (performans önemliliği ve bariz önemsizlik tutarı çözüme etki etmez) ve yakın
      kavram ayrımı (önemlilik / bariz biçimde önemsiz). Tuzak, tutarsal karşılaştırmayla yetinip
      niteliksel değerlendirmeyi atlamaktır.
    celdiriciler:
      B: BDS 450 parag. 6(b)'ye göre biriktirilen yanlışlıklar toplamı önemliliğe yaklaştığında denetçi
        genel denetim stratejisi ile denetim planının revize edilmesinin gerekip gerekmediğine karar
        verir; ifade doğrudur.
      C: BDS 450 parag. 10'a göre denetçi düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce
        önemliliği yeniden değerlendirir; ifade doğrudur.
      D: BDS 450 parag. 9'a göre yönetim düzeltmeyi reddederse denetçi gerekçeler hakkında kanaate
        ulaşır ve bu kanaati değerlendirmede dikkate alır; ifade doğrudur.
      E: BDS 450 parag. 14'e göre denetçi bu konuda yönetimden yazılı beyan talep eder; ifade doğrudur.
  kaynaklar:
  - mevzuat: BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik
    madde: parag. 6
    alinti: Denetimin planlanması sırasında belirlenen önemlilik, -tek başına veya toplu olarak- bu
      tutarın altında kalan düzeltilmemiş yanlışlıkların her zaman önemsiz olarak değerlendirileceği
      bir tutar oluşturmayabilir. Bazı yanlışlıklarla ilgili durumlar denetçinin söz konusu
      yanlışlıkları önemliliğin altında olsalar bile önemli olarak değerlendirmesine sebep olabilir.
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 11(a)
    alinti: Denetçi, düzeltilmemiş yanlışlıkların -tek başına veya toplu olarak- önemli olup olmadığına
      karar verir. Denetçi bu kararı verirken, Yanlışlıkların belirli işlem sınıfları, hesap bakiyeleri
      veya açıklamalar ile bir bütün olarak finansal tablolar açısından büyüklüğünü ve niteliğini ve söz
      konusu yanlışlıkların meydana geldiği özel şartları
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 6(b)
    alinti: Denetim boyunca biriktirilen yanlışlıklar toplamının, BDS 320’ye uygun olarak belirlenen
      önemliliğe yaklaşması hâlinde (Bkz.: A8 paragrafı), genel denetim stratejisi ile denetim planının
      revize edilmesinin gerekip gerekmediğine karar verir.
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 9 ve 10
    alinti: Yönetimin, denetçi tarafından bildirilen yanlışlıkların bazılarını veya tamamını düzeltmeyi
      reddetmesi hâlinde denetçi, yönetimin düzeltme yapmama gerekçeleri hakkında bir kanaate ulaşır ve
      bir bütün olarak finansal tabloların önemli bir yanlışlık içerip içermediğini değerlendirirken bu
      kanaatini dikkate alır … Denetçi, düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce BDS
      320’ye uygun olarak belirlenen önemliliğin, işletmenin fiili finansal sonuçları kapsamında hâlâ
      geçerli olup olmadığını doğrulamak için önemliliği yeniden değerlendirir
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 14
    alinti: Denetçi, yönetimden ve -uygun hâllerde- üst yönetimden sorumlu olanlardan, düzeltilmemiş
      yanlışlıkların -tek başına ve toplu hâlde- bir bütün olarak finansal tablolar üzerindeki etkisinin
      önemsiz olduğu kanaatine varıp varmadıklarına ilişkin yazılı bir beyan talep eder.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-DEN-RSK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk, önemlilik ve planlama
  konu: RSK
  kazanim: BDS 210 denetimin ön şartları ve sözleşmenin kabulü
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: >-
    BDS 210 "Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması" standardına göre
    denetimin ön şartları ve denetim sözleşmesinin kabulü ile ilgili aşağıdaki ifadelerden hangisi
    doğrudur?
  secenekler:
    A: Yönetimin teklif ettiği kapsam sınırlamasının yalnızca sınırlı olumlu görüş verilmesini
      gerektireceğine inanan denetçi, sözleşmeyi bağımsız denetim sözleşmesi olarak kabul etmez.
    B: Denetimin ön şartlarının mevcut olmadığını belirleyen denetçi, konuyu yönetimle müzakere
      etmeksizin sözleşme teklifini reddeder.
    C: Finansal raporlama çerçevesinin kabul edilebilir olup olmadığı, sözleşme kabul edildikten sonra
      planlama aşamasında belirlenir.
    D: Yönetimin denetçiye erişim sağlama sorumluluğu, kayıt ve belgelerle sınırlı olup denetçinin
      işletme içindeki kişilerle görüşmesini kapsamaz.
    E: Yönetimin iç kontrole ilişkin sorumluluğunu anladığına ve üstlendiğine dair mutabakatı
      alınamayan denetçi, mevzuatta aksi zorunlu kılınmadıkça sözleşme teklifini kabul etmez.
  dogru: E
  aciklama:
    dogru_neden: >-
      BDS 210 parag. 6(b)(ii)'ye göre denetçi, yönetimin hata veya hile kaynaklı önemli yanlışlık
      içermeyen finansal tablolar hazırlanmasını sağlamak için gerekli gördüğü iç kontrole ilişkin
      sorumluluğunu anladığına ve üstlendiğine dair mutabakatını alır. Parag. 8'e göre mevzuatta aksi
      zorunlu kılınmadıkça 6(b) paragrafında belirtilen mutabakatın alınamaması durumunda denetçi
      denetim sözleşmesi teklifini kabul etmez.
    celdiriciler:
      A: Parag. 7'ye göre sözleşmenin kabul edilmemesi, kapsam sınırlamasının görüş vermekten
        kaçınmayı gerektireceğine inanılması hâlinde söz konusudur; sınırlı olumlu görüş için bu
        sonuç öngörülmemiştir.
      B: Parag. 8'e göre ön şartlar mevcut değilse denetçi önce konuyu yönetimle müzakere eder.
      C: Parag. 6(a)'ya göre çerçevenin kabul edilebilirliği, denetimin ön şartlarının mevcut olup
        olmadığının tespiti kapsamında, sözleşme kabul edilmeden önce belirlenir.
      D: Parag. 6(b)(iii)-c'ye göre yönetim, denetçinin işletme içinde gerekli gördüğü kişilerle
        kısıtlama olmaksızın görüşme imkânı sağlama sorumluluğunu da üstlenir.
  kaynaklar:
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 6(a), 6(b)(ii) ve 6(b)(iii)-c
    alinti: Denetimin ön şartlarının mevcut olup olmadığını tespit etmek amacıyla denetçi; Finansal
      tabloların hazırlanmasında kullanılan finansal raporlama çerçevesinin kabul edilebilir olup
      olmadığını belirler … (ii) Yönetimin, hata veya hile kaynaklı önemli yanlışlık içermeyen finansal
      tablolar hazırlanmasını sağlamak için gerekli gördüğü iç kontrole ilişkin sorumluluğu … c. Denetim
      kanıtlarının toplanması için denetçinin işletme içinde gerekli gördüğü kişilerle kısıtlama
      olmaksızın görüşme imkânı sağlama sorumluluğu.
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 7
    alinti: Yönetimin veya üst yönetimden sorumlu olanların sözleşmede denetçinin yapacağı çalışmanın
      kapsamını sınırlandıracak şartlar teklif etmesi ve bu sınırlandırmanın finansal tablolar hakkında
      görüş vermekten kaçınmasını gerektireceğine inanması hâlinde denetçi, mevzuatla aksi zorunlu
      kılınmadıkça, kapsamı sınırlandırılan bu sözleşmeyi bir bağımsız denetim sözleşmesi olarak kabul
      etmez.
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 8
    alinti: Denetimin ön şartlarının mevcut olmaması durumunda denetçi, bu konuyu yönetimle müzakere
      eder. Mevzuatta aksi zorunlu kılınmadıkça; … 6(b) paragrafında belirtilen mutabakatın alınamaması,
      durumunda denetçi, denetim sözleşmesi teklifini kabul etmez.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
