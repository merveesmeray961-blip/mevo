- id: SMMM-DEN-RSK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk, önemlilik ve planlama
  konu: RSK
  kazanim: BDS 210 denetimin ön şartları ve sözleşmenin kabulü
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: BDS 210 "Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması" standardına göre denetimin
    ön şartları ve denetim sözleşmesinin kabulü ile ilgili aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Yönetimin teklif ettiği kapsam sınırlamasının yalnızca sınırlı olumlu görüş verilmesini gerektireceğine inanan
      denetçi, sözleşmeyi bağımsız denetim sözleşmesi olarak kabul etmez.
    B: Denetimin ön şartlarının mevcut olmadığını belirleyen denetçi, konuyu yönetimle müzakere etmeksizin sözleşme
      teklifini reddeder.
    C: Finansal raporlama çerçevesinin kabul edilebilir olup olmadığı, sözleşme kabul edildikten sonra planlama
      aşamasında belirlenir.
    D: Yönetimin denetçiye erişim sağlama sorumluluğu, kayıt ve belgelerle sınırlı olup denetçinin işletme içindeki
      kişilerle görüşmesini kapsamaz.
    E: Yönetimin iç kontrole ilişkin sorumluluğunu anladığına ve üstlendiğine dair mutabakatı alınamayan denetçi,
      mevzuatta aksi zorunlu kılınmadıkça sözleşme teklifini kabul etmez.
  dogru: E
  aciklama:
    dogru_neden: BDS 210 parag. 6(b)(ii)'ye göre denetçi, yönetimin hata veya hile kaynaklı önemli yanlışlık içermeyen
      finansal tablolar hazırlanmasını sağlamak için gerekli gördüğü iç kontrole ilişkin sorumluluğunu anladığına
      ve üstlendiğine dair mutabakatını alır. Parag. 8'e göre mevzuatta aksi zorunlu kılınmadıkça 6(b) paragrafında
      belirtilen mutabakatın alınamaması durumunda denetçi denetim sözleşmesi teklifini kabul etmez.
    celdiriciler:
      A: Parag. 7'ye göre sözleşmenin kabul edilmemesi, kapsam sınırlamasının görüş vermekten kaçınmayı gerektireceğine
        inanılması hâlinde söz konusudur; sınırlı olumlu görüş için bu sonuç öngörülmemiştir.
      B: Parag. 8'e göre ön şartlar mevcut değilse denetçi önce konuyu yönetimle müzakere eder.
      C: Parag. 6(a)'ya göre çerçevenin kabul edilebilirliği, denetimin ön şartlarının mevcut olup olmadığının tespiti
        kapsamında, sözleşme kabul edilmeden önce belirlenir.
      D: Parag. 6(b)(iii)-c'ye göre yönetim, denetçinin işletme içinde gerekli gördüğü kişilerle kısıtlama olmaksızın
        görüşme imkânı sağlama sorumluluğunu da üstlenir.
  kaynaklar:
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 6(a), 6(b)(ii) ve 6(b)(iii)-c
    alinti: Denetimin ön şartlarının mevcut olup olmadığını tespit etmek amacıyla denetçi; Finansal tabloların hazırlanmasında
      kullanılan finansal raporlama çerçevesinin kabul edilebilir olup olmadığını belirler … (ii) Yönetimin, hata
      veya hile kaynaklı önemli yanlışlık içermeyen finansal tablolar hazırlanmasını sağlamak için gerekli gördüğü
      iç kontrole ilişkin sorumluluğu … c. Denetim kanıtlarının toplanması için denetçinin işletme içinde gerekli
      gördüğü kişilerle kısıtlama olmaksızın görüşme imkânı sağlama sorumluluğu.
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 7
    alinti: Yönetimin veya üst yönetimden sorumlu olanların sözleşmede denetçinin yapacağı çalışmanın kapsamını
      sınırlandıracak şartlar teklif etmesi ve bu sınırlandırmanın finansal tablolar hakkında görüş vermekten kaçınmasını
      gerektireceğine inanması hâlinde denetçi, mevzuatla aksi zorunlu kılınmadıkça, kapsamı sınırlandırılan bu
      sözleşmeyi bir bağımsız denetim sözleşmesi olarak kabul etmez.
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: parag. 8
    alinti: Denetimin ön şartlarının mevcut olmaması durumunda denetçi, bu konuyu yönetimle müzakere eder. Mevzuatta
      aksi zorunlu kılınmadıkça; … 6(b) paragrafında belirtilen mutabakatın alınamaması, durumunda denetçi, denetim
      sözleşmesi teklifini kabul etmez.
