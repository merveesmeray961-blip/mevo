- id: SMMM-DEN-RSK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: DEN
  unite: Risk, önemlilik ve planlama
  konu: RSK
  kazanim: BDS 320 önemlilik ve BDS 450 düzeltilmemiş yanlışlıkların değerlendirilmesi
  tip: uygulama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: (T) AŞ'nin denetiminde denetçi, BDS 320 "Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik" uyarınca
    bir bütün olarak finansal tablolar için önemliliği 800.000 TL, performans önemliliğini 600.000 TL olarak; BDS
    450 "Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi" kapsamında altında
    kalan yanlışlıkların bariz biçimde önemsiz sayılacağı tutarı ise 40.000 TL olarak belirlemiştir. Denetim boyunca
    biriktirilen yanlışlıkların toplamı 760.000 TL'ye ulaşmıştır. Yönetim, bunlardan ilişkili bir tarafa yapılan
    satışın yanlış dönemde kaydedilmesinden kaynaklanan 300.000 TL tutarındaki yanlışlığı düzeltmeyi reddetmiştir.
    Bu iki standarda göre denetçinin tutumu ile ilgili aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: 300.000 TL'lik düzeltilmemiş yanlışlık, hem bir bütün olarak finansal tablolar için belirlenen önemliliğin
      hem de performans önemliliğinin altında kaldığından tek başına önemli olarak değerlendirilemez.
    B: Biriktirilen yanlışlıkların toplamı önemliliği aşmamış olsa da önemliliğe yaklaştığından, genel denetim stratejisi
      ile denetim planının revize edilmesinin gerekip gerekmediğine karar verilir.
    C: Düzeltilmemiş yanlışlıkların etkisi değerlendirilmeden önce, önemliliğin işletmenin fiili finansal sonuçları
      kapsamında hâlâ geçerli olup olmadığı yeniden değerlendirilir.
    D: Yanlışlık önemliliğin altında olsa bile, yönetimin düzeltme yapmama gerekçeleri hakkında bir kanaate ulaşılır
      ve finansal tabloların önemli yanlışlık içerip içermediği değerlendirilirken bu kanaat dikkate alınır.
    E: Yönetimden, düzeltilmemiş yanlışlıkların tek başına ve toplu hâlde etkisinin önemsiz olduğu kanaatine varıp
      varmadıklarına ilişkin yazılı beyan talep edilir.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 320 parag. 6''ya göre planlama sırasında belirlenen önemlilik, bu tutarın altında kalan düzeltilmemiş
      yanlışlıkların her zaman önemsiz olarak değerlendirileceği bir tutar oluşturmayabilir; bazı yanlışlıklar önemliliğin
      altında olsalar bile önemli değerlendirilebilir. BDS 450 parag. 11''e göre denetçi düzeltilmemiş yanlışlıkların
      önemli olup olmadığına karar verirken büyüklüğün yanında niteliği ve meydana geldiği özel şartları mütalaa
      eder; parag. A21 bu şartlar arasında yanlışlığın işletme yönetimiyle ilişkili tarafları içeren kalemlerle
      ilgili olmasını sayar. İlişkili tarafa satıştan doğan 300.000 TL''lik yanlışlığın yalnız tutar karşılaştırmasıyla
      "tek başına önemli olarak değerlendirilemez" sayılması bu hükümlere aykırıdır. Kullanılan teknikler: (1) madde
      birleştirme — BDS 320 parag. 6 ile BDS 450 parag. 11 ve A21 kökteki ilişkili taraf bilgisiyle birlikte uygulanır;
      (2) yakın kavram ayrımı — önemlilik, performans önemliliği ve bariz biçimde önemsiz tutar; A, yanlışlığın
      iki eşiğin de altında kalmasını gerekçe yaparak adayı tutarsal karşılaştırmaya yöneltir; (3) gereksiz veri
      — 40.000 TL''lik bariz önemsizlik tutarı çözüme etki etmez. Tuzak, yalnız tutara bakıp niteliksel değerlendirmeyi
      atlamak ve B ile D''deki "aşmamış olsa da", "altında olsa bile" ifadelerini yanlışlık işareti saymaktır.'
    celdiriciler:
      B: BDS 450 parag. 6(b)'ye göre biriktirilen yanlışlıklar toplamı önemliliğe yaklaştığında (aşması gerekmez)
        denetçi genel denetim stratejisi ile denetim planının revize edilmesinin gerekip gerekmediğine karar verir;
        ifade doğrudur.
      C: BDS 450 parag. 10'a göre denetçi düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce önemliliği
        yeniden değerlendirir; ifade doğrudur.
      D: BDS 450 parag. 9'a göre yönetim bildirilen yanlışlıkları düzeltmeyi reddederse denetçi, yanlışlığın büyüklüğüne
        bağlı bir sınır olmaksızın gerekçeler hakkında kanaate ulaşır ve bu kanaati değerlendirmede dikkate alır;
        ifade doğrudur.
      E: BDS 450 parag. 14'e göre denetçi bu konuda yönetimden yazılı beyan talep eder; ifade doğrudur.
  kaynaklar:
  - mevzuat: BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik
    madde: parag. 6
    alinti: Denetimin planlanması sırasında belirlenen önemlilik, -tek başına veya toplu olarak- bu tutarın altında
      kalan düzeltilmemiş yanlışlıkların her zaman önemsiz olarak değerlendirileceği bir tutar oluşturmayabilir.
      Bazı yanlışlıklarla ilgili durumlar denetçinin söz konusu yanlışlıkları önemliliğin altında olsalar bile önemli
      olarak değerlendirmesine sebep olabilir.
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 11
    alinti: Denetçi, düzeltilmemiş yanlışlıkların -tek başına veya toplu olarak- önemli olup olmadığına karar verir.
      Denetçi bu kararı verirken, Yanlışlıkların belirli işlem sınıfları, hesap bakiyeleri veya açıklamalar ile
      bir bütün olarak finansal tablolar açısından büyüklüğünü ve niteliğini ve söz konusu yanlışlıkların meydana
      geldiği özel şartları
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. A21
    alinti: Bazı yanlışlıklar bir bütün olarak finansal tablolar için belirlenen önemliliğin altında olsa dahi,
      söz konusu yanlışlıklarla ilgili durumlar, denetçinin bunları tek başına veya denetim boyunca biriktirilen
      diğer yanlışlıklarla birlikte önemli olarak değerlendirmesine sebep olabilir. Değerlendirmeyi etkileyebilecek
      durumlar, yanlışlığın; ... Belirli tarafları içeren kalemlerle ne ölçüde ilgili olduğunu (örneğin, işlemin
      işletme dışı taraflarının, işletme yönetimiyle ilişkili olup olmadığı),
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 6(b)
    alinti: 'Denetim boyunca biriktirilen yanlışlıklar toplamının, BDS 320’ye uygun olarak belirlenen önemliliğe
      yaklaşması hâlinde (Bkz.: A8 paragrafı), genel denetim stratejisi ile denetim planının revize edilmesinin
      gerekip gerekmediğine karar verir.'
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 9 ve 10
    alinti: Yönetimin, denetçi tarafından bildirilen yanlışlıkların bazılarını veya tamamını düzeltmeyi reddetmesi
      hâlinde denetçi, yönetimin düzeltme yapmama gerekçeleri hakkında bir kanaate ulaşır ve bir bütün olarak finansal
      tabloların önemli bir yanlışlık içerip içermediğini değerlendirirken bu kanaatini dikkate alır … Denetçi,
      düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce BDS 320’ye uygun olarak belirlenen önemliliğin,
      işletmenin fiili finansal sonuçları kapsamında hâlâ geçerli olup olmadığını doğrulamak için önemliliği yeniden
      değerlendirir
  - mevzuat: BDS 450 Bağımsız Denetimin Yürütülmesi Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi
    madde: parag. 14
    alinti: Denetçi, yönetimden ve -uygun hâllerde- üst yönetimden sorumlu olanlardan, düzeltilmemiş yanlışlıkların
      -tek başına ve toplu hâlde- bir bütün olarak finansal tablolar üzerindeki etkisinin önemsiz olduğu kanaatine
      varıp varmadıklarına ilişkin yazılı bir beyan talep eder.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: A şıkkındaki cevabı ele veren 'niteliğine bakılmaksızın önemsiz kabul edilir' ifadesi, iki eşiğe (önemlilik
      ve performans önemliliği) dayanan 'tek başına önemli olarak değerlendirilemez' ifadesiyle değiştirildi; B
      ve D'ye doğruluğu değişmeyen benzer kesinlikte ifadeler ('aşmamış olsa da', 'altında olsa bile') eklendi;
      BDS 450 A21 kaynağı eklendi; dogru_neden teknikleri ve tuzağı yeniden yazıldı. Doğru cevap (A) değişmedi;
      zorluk 3 korundu.
    neden: 'G5 (küçük) ve GZ: mutlak ifade cevabı kural bilgisi olmadan tahmin ettiriyordu; ortalama aday rahat
      çözmüştü (güven 4). Soru performans önemliliği tuzağı ve doğru şıklardaki dengeleyici ifadelerle zorlaştırıldı.'
