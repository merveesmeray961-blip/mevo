- id: SMMM-EKO-DIS-0055
  sinav: smmm
  bolum: &id001
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: satın alma gücü paritesi
  tip: hesaplama
  zorluk: 2
  kok: Aynı mal sepeti Türkiye’de 1.200 TL, ABD’de 60 USD’dir. Mutlak satın alma gücü paritesine (SAGP) göre denge döviz kuru
    kaç TL/USD’dir?
  secenekler:
    A: '20'
    B: '24'
    C: '30'
    D: '1.140'
    E: '1.260'
  dogru: A
  aciklama:
    dogru_neden: 'Mutlak SAGP’ye göre kur = yurt içi fiyat / yurt dışı fiyat = 1.200 / 60 = 20 TL/USD. Püf noktaları: Kur,
      yerli para cinsinden fiyatın yabancı para cinsinden fiyata bölünmesiyle bulunur.'
    celdiriciler:
      B: 24 TL/USD, sepetin Türkiye’deki fiyatının 1.440 TL alınmasıyla bulunur; verilen fiyat 1.200 TL’dir.
      C: 30 TL/USD, sepetin Türkiye’deki fiyatının 1.800 TL alınmasıyla bulunur; verilen fiyat 1.200 TL’dir.
      D: 1.140, iki fiyatın farkıdır (1.200 − 60); SAGP oranlama gerektirir, çıkarma değil.
      E: 1.260, iki fiyatın toplamıdır (1.200 + 60); SAGP oranlama gerektirir, toplama değil.
    hesap_adimlari:
    - Kur = 1.200 TL / 60 USD
    - = 20 TL/USD
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Dış ekonomi
    madde: Satın alma gücü paritesi
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1200 / 60
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
          kaynakta doğrulandı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_B/EKO_DIS_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
      kaynakta doğrulandı.'
- id: SMMM-EKO-DIS-0056
  sinav: smmm
  bolum: *id001
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: örtülü faiz paritesi
  tip: hesaplama
  zorluk: 3
  kok: Spot kur 30 TL/USD, bir yıllık TL faiz oranı %50, bir yıllık USD faiz oranı %5’tir. Örtülü faiz paritesine göre bir
    yıllık vadeli (forward) kur yaklaşık kaç TL/USD’dir?
  secenekler:
    A: 31,50
    B: 42,86
    C: 43,50
    D: 45,00
    E: 47,25
  dogru: B
  aciklama:
    dogru_neden: 'Örtülü faiz paritesinde F = S × (1 + i_TL) / (1 + i_USD) = 30 × 1,50 / 1,05 ≈ 42,86 TL/USD. Faizi yüksek
      olan para vadelide primli (değer kaybetmiş) işlem görür. Püf noktaları: Yerli faiz çarpanı paya, yabancı faiz çarpanı
      paydaya yazılır.'
    celdiriciler:
      A: 31,50, spot kurun yalnızca USD faiziyle (1,05) çarpılmasıyla bulunur; iki ülkenin faiz oranı birlikte kullanılmamıştır.
      C: 43,50, spot kurun faiz farkı (%45) kadar artırılmasıyla bulunur; paritede faiz oranları oran olarak bölünür.
      D: 45,00, spot kurun yalnızca TL faiziyle (1,50) çarpılmasıyla bulunur; USD faizi hesaba katılmamıştır.
      E: 47,25, spot kurun her iki faiz çarpanıyla (1,50 × 1,05) çarpılmasıyla bulunur; USD çarpanıyla bölünmesi gerekir.
    hesap_adimlari:
    - F = S × (1+i_TL) / (1+i_USD)
    - 30 × 1,50 / 1,05
    - ≈ 42,86 TL/USD
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Dış ekonomi
    madde: Örtülü faiz paritesi
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 30 * 1.5 / 1.05
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
