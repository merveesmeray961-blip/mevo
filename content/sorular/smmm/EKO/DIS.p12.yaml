- id: SMMM-EKO-DIS-0059
  sinav: smmm
  bolum: *id001
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: gümrük vergisi geliri
  tip: hesaplama
  zorluk: 2
  kok: Küçük bir ülkede dünya fiyatı birim başına 40 TL olan bir maldan yıllık 1.500 birim ithal edilmektedir. Hükûmet bu
    mala %25 oranında gümrük vergisi koymuş, ithalat miktarı değişmemiştir. Devletin bu maldan elde ettiği gümrük vergisi
    geliri kaç TL’dir?
  secenekler:
    A: '1.500'
    B: '6.000'
    C: '10.000'
    D: '12.500'
    E: '15.000'
  dogru: E
  aciklama:
    dogru_neden: 'Gümrük geliri = dünya fiyatı × tarife oranı × ithalat miktarı = 40 × 0,25 × 1.500 = 15.000 TL. Küçük ülkede
      dünya fiyatı vergiden etkilenmez; iç fiyat 50 TL’ye çıkar ve vergi geliri birim başına 10 TL × 1.500 birimdir. Püf noktaları:
      Miktar değişmiyorsa gelir doğrudan hesaplanır.'
    celdiriciler:
      A: 1.500 yalnızca ithalat miktarıdır; vergi tutarı fiyat ve oranla çarpılmadan bulunamaz.
      B: 6.000, vergi oranının %10 alınmasıyla bulunur; soruda oran %25’tir.
      C: 10.000, ithalat miktarının 1.000 birim alınmasıyla bulunur; verilen miktar 1.500 birimdir.
      D: 12.500, birim fiyatın 50 TL ve miktarın 1.000 birim alınmasıyla bulunur; veriler farklıdır.
    hesap_adimlari:
    - Birim başına vergi = 40 × 0,25 = 10 TL
    - Gelir = 10 × 1.500
    - = 15.000 TL
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Dış ekonomi
    madde: Tarifenin gümrük geliri
    alinti: ''
