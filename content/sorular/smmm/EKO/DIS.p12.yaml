      E: 36,30, EUR/USD paritesinin iki kez uygulanmasıyla (30 × 1,10 × 1,10) bulunur; paritenin yalnızca bir kez kullanılması
        gerekir.
    hesap_adimlari:
    - EUR/TL = EUR/USD × USD/TL
