  kazanim: ticaret hadleri
  tip: hesaplama
  zorluk: 2
  kok: Bir ülkede ihracat fiyat endeksi 150, ithalat fiyat endeksi 120’dir. Bu ülkenin net (mübadele) ticaret hadleri endeksi
    kaçtır ve ne ifade eder?
  secenekler:
    A: 80, ticaret hadleri kötüleşmiştir
    B: 100, ticaret hadleri değişmemiştir
    C: 125, ticaret hadleri iyileşmiştir
    D: 150, yalnızca ihracat fiyatları artmıştır
    E: 270, hadler çok iyileşmiştir
  dogru: C
  aciklama:
    dogru_neden: Net ticaret hadleri = (ihracat fiyat endeksi / ithalat fiyat endeksi) × 100 = 150 / 120 × 100 = 125. 100’ün
      üzerinde olması bir birim ihracatla daha fazla ithalat satın alınabildiğini gösterir; hadler iyileşmiştir.
    celdiriciler:
      A: 80, oranın ters alınmasıyla (120/150) bulunur; bu durumda kötüleşme olurdu, oysa ihracat fiyatları daha çok artmıştır.
      B: 100 hadlerin değişmediği durumdur; fiyat endeksleri farklı olduğundan hadler değişmiştir.
      D: 150 yalnızca ihracat fiyat endeksidir; hadler bu endeksin ithalat fiyat endeksine bölünmesiyle bulunur.
      E: 270 iki endeksin toplamıdır; hadler toplama değil bölme ile hesaplanır.
    hesap_adimlari:
    - Hadler = (150 / 120) × 100
    - = 125
  kaynaklar:
