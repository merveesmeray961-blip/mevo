  kok: 'Bir ülkenin bir yıldaki dış işlemleri (milyar $) şöyledir: mal ihracatı 120, mal ithalatı 95, hizmetler dengesi -10,
    birincil gelir dengesi -8, ikincil gelir dengesi +3. Cari işlemler dengesi kaç milyar $''dır?'
  secenekler:
    A: '-10'
    B: '4'
    C: '10'
    D: '15'
    E: '25'
