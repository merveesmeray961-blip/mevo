- id: SMMM-EKO-DIS-0053
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: devalüasyon
  tip: uygulama
  zorluk: 3
  kok: A ülkesinde merkez bankası sabit kur rejimi çerçevesinde kuru 30 ₺'den 36 ₺'ye resmen çıkarmıştır. B ülkesinde ise
    esnek kur rejiminde piyasa koşullarıyla kur 30 ₺'den 36 ₺'ye yükselmiştir. Bu gelişmeler ve TL'nin dolar karşısındaki
    değer kaybı için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: A'da depresiyasyon, B'de devalüasyon olmuştur; TL'nin değer kaybı %20'dir ve kur rejimi fark yaratmaz.
    B: A'da devalüasyon, B'de depresiyasyon olmuştur; her ikisinde TL yaklaşık %16,67 değer kaybetmiştir.
    C: Her ikisinde de devalüasyon olmuştur; TL'nin değer kaybı %20'dir.
    D: A'da revalüasyon, B'de apresiyasyon olmuştur; TL yaklaşık %16,67 değer kazanmıştır.
    E: A'da devalüasyon, B'de apresiyasyon olmuştur; TL'nin değer kaybı %20'dir.
  dogru: B
  aciklama:
    dogru_neden: 'Sabit kurda otoritenin kararıyla resmî değerin düşürülmesi devalüasyon, esnek kurda piyasa koşullarıyla
      oluşan değer kaybı depresiyasyondur. Kur 30''dan 36''ya çıkınca doların TL değeri %20 artar ama TL''nin değer kaybı
      1 - 30/36 = %16,67''dir. Püf noktaları: Terimi belirleyen şey kurun nasıl değiştiğidir (karar mı, piyasa mı). %20 doların
      artışıdır, TL''nin kaybı değildir.'
    celdiriciler:
      A: Adlandırma ters kurulmuştur; ayrıca TL'nin değer kaybı %20 değil %16,67'dir.
      C: Esnek kurdaki piyasa kaynaklı değer kaybı devalüasyon değil depresiyasyondur; %20 doların artışıdır.
      D: Kur yükseldiği için TL değer kaybetmiştir; revalüasyon ve apresiyasyon değer artışını anlatır.
      E: Esnek kurda TL'nin değer kaybı apresiyasyon değil depresiyasyondur; %20 doların TL değerindeki artıştır.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §4.1
    alinti: Kısacası devalüasyon bir politika kararıdır; depresiyasyon piyasa hareketidir.
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §3
    alinti: Kur 30 ₺'den 36 ₺'ye çıkarsa doların TL değeri (36 − 30)/30 = **%20** artar; ama 1 ₺'nin dolar değeri 1/30'dan
      1/36'ya düşer, yani TL **%16,67** değer kaybeder (1 − 30/36).
