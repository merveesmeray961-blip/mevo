  zorluk: 1
  kok: Bir ülke aynı sürede ya 20 birim kumaş ya da 50 birim şarap üretebilmektedir. Bu ülkede 1 birim kumaşın fırsat maliyeti
    kaç birim şaraptır?
  secenekler:
    A: 0,4
