- id: SMMM-EKO-DIS-0054
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 3
  kok: Aynı sürede A ülkesi 30 kumaş veya 60 şarap, B ülkesi 15 kumaş veya 45 şarap üretebilmektedir. Ticaretten her iki ülke
    de kazanç sağlayacaksa 1 kumaş kaç şaraba değiştirilmelidir?
  secenekler:
    A: 0,33 ile 0,5 şarap arasında
    B: 1 ile 2 şarap arasında
    C: 3 şaraptan fazla
    D: 2 ile 3 şarap arasında
    E: 2 şaraptan az
  dogru: D
  aciklama:
    dogru_neden: '1 kumaşın fırsat maliyeti A''da 60 / 30 = 2 şarap, B''de 45 / 15 = 3 şaraptır; kumaşta A karşılaştırmalı
      üstündür. Değişim oranı iki ülkenin fırsat maliyetleri arasında, yani 1 kumaş = 2 ile 3 şarap arasında olursa iki ülke
      de kazanır. Püf noktaları: Tablo belirli sürede üretim miktarını verdiğinden fırsat maliyeti ''diğer mal / bu mal''
      diye kurulur; kesri ters kurarsan 0,33 ile 0,5 aralığına düşersin.'
    celdiriciler:
      A: Kesirler ters kurulmuştur (şarabın kumaş cinsinden maliyeti); soru 1 kumaşın şarap karşılığını sormaktadır.
      B: 1 ile 2 aralığı iki ülkenin fırsat maliyetlerini kapsamaz; A'nın maliyeti 2, B'nin 3'tür.
      C: 3'ten fazla oranda B ticaret yapmaz, çünkü kumaşı kendisi 3 şarap maliyetiyle üretebilir.
      E: 2'den az oranda A ticaret yapmaz, çünkü kumaşı kendisi 2 şarap maliyetiyle üretebilir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
