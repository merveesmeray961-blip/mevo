      A: 20 / 50 = 0,4 oranı 1 şarabın fırsat maliyetidir (kumaş cinsinden); kesir ters kurulmuştur.
      D: 30, iki üretim miktarının farkıdır (50 - 20); fırsat maliyeti oranla bulunur.
      E: 70, iki üretim miktarının toplamıdır; fırsat maliyeti toplam değil orandır.
      B: 1 doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 2,5 olarak bulunur.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
