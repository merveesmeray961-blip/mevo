- id: SMMM-EKO-DIS-0037
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: ödemeler dengesi
  tip: hesaplama
  zorluk: 3
  kok: Bir ülkede mal ihracatı 300, mal ithalatı 360, hizmetler dengesi +45, birincil gelir dengesi -20, ikincil gelir dengesi
    +8, sermaye hesabı +2 ve net hata ve noksan +5 milyar $'dır. Yıl içinde merkez bankası rezervleri 10, yerleşiklerin yurt
    dışı mevduatı 4 milyar $ artmıştır. Finans hesabı net varlık edinimi eksi net yükümlülük oluşumudur. Net yükümlülük oluşumu
    kaç milyar $'dır?
  secenekler:
    A: '-20'
    B: '6'
    C: '14'
    D: '34'
    E: '54'
  dogru: D
  aciklama:
    dogru_neden: 'Cari denge = (300 - 360) + 45 - 20 + 8 = -27''dir. Finans hesabı = cari denge + sermaye hesabı + net hata
      ve noksan = -27 + 2 + 5 = -20''dir. Net varlık edinimi 10 + 4 = 14''tür. Finans hesabı = net varlık edinimi - net yükümlülük
      oluşumu olduğundan net yükümlülük oluşumu = 14 - (-20) = 34 milyar $''dır. Püf noktaları: Önce cari dengeyi, sonra finans
      hesabını bul; net varlık edinimi ile net yükümlülüğü karıştırma. Rezerv artışı BPM6''da varlık edinimidir, işaret konvansiyonuna
      dikkat et.'
    hesap_adimlari:
    - Cari denge = (300 - 360) + 45 - 20 + 8 = -27
    - Finans hesabı = -27 + 2 + 5 = -20
    - Net varlık edinimi = 10 + 4 = 14
    - Net yükümlülük oluşumu = 14 - (-20) = 34
    celdiriciler:
      A: -20 finans hesabının kendisidir; net yükümlülük oluşumu değildir.
      B: Finans hesabının mutlak değeri ile net varlık edinimi farkı alınmıştır (20 - 14); doğru işlem 14 - (-20)'dir.
      C: 14 net varlık edinimidir; net yükümlülük oluşumu değildir.
      E: Finans hesabının mutlak değeri ile 34 toplanmıştır (34 + 20); fazladan işlem yapılmıştır.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §1.3
    alinti: '**Cari denge + Sermaye hesabı + Net hata ve noksan = Finans hesabı**'
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §1.5
    alinti: Yıl içinde rezervler 10, yerleşiklerin yurt dışı mevduatı 5 arttıysa net varlık edinimi 15'tir.
  gecerlilik:
    baslangic: '2026-11-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'cari = (300 - 360) + 45 - 20 + 8

      finans = cari + 2 + 5

      sonuc = (10 + 4) - finans'
