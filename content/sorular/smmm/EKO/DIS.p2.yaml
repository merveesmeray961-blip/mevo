      B: Birincil gelire ücret, faiz ve kâr payı yazılır; hisse alımı finans hesabı işlemidir.
      D: Sermaye hesabı marka, patent hakkı gibi üretilmemiş finansal olmayan varlıkları kapsar; hisse senedi bu kapsamda
        değildir.
      E: Denkleştirici işlemler rezerv kullanımı ve IMF kredisi gibi açığı kapatmaya yönelik işlemlerdir; borsadan hisse alımı
        kâr güdüsüyle yapılan otonom bir işlemdir.
