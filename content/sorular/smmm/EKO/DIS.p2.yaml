- id: SMMM-EKO-DIS-0042
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: devalüasyon
  tip: hesaplama
  zorluk: 3
  kok: Nominal döviz kuru 30 ₺'den 36 ₺'ye çıkmış, yabancı fiyat düzeyi sabit kalmış, yurt içi fiyat düzeyi ise yüzde 10 artmıştır.
    Reel döviz kuru q = e x P* / P tanımına göre q yüzde kaç artmıştır?
  secenekler:
    A: '%8,33'
    B: '%9,09'
    C: '%10'
    D: '%20'
    E: '%109,09'
  dogru: B
  aciklama:
    dogru_neden: 'q = e x P* / P''dir. e 30''dan 36''ya çıkarak 1,20 katına, P 1,10 katına çıkmıştır; P* sabittir. q''nun
      değişimi 1,20 / 1,10 = 1,0909, yani yaklaşık %9,09 artıştır. Püf noktaları: Nominal kur artışı (%20) ile reel kur artışını
      karıştırma; fiyat artışı pay değil paydadır, bu yüzden reel artış %20''den küçüktür. q''nun artması ulusal paranın reel
      değer kaybıdır.'
    hesap_adimlari:
    - 'Nominal kur oranı: 36 / 30 = 1,20'
    - 'Yurt içi fiyat oranı: 1,10'
    - 'q değişimi: 1,20 / 1,10 = 1,0909; artış %9,09'
    celdiriciler:
      A: 1 - 1,10 / 1,20 işlemiyle %8,33 bulunmuştur; doğru işlem 1,20 / 1,10 - 1'dir.
      C: Yurt içi fiyat artışı alınmıştır; reel kurdaki artış kur ve fiyat oranlarının bölümüyle bulunur.
      D: Nominal kur artışı alınmıştır; yurt içi fiyat artışı hesaba katılmamıştır.
      E: 1,0909 oranı yüzde olarak alınmıştır (%109,09); artış bu değerin 100 eksiğidir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §3
    alinti: '**Reel döviz kuru**, nominal kurun fiyat düzeyleriyle düzeltilmiş hâlidir: q = e × P* / P (e: nominal kur, P*:
      yabancı fiyat düzeyi, P: yurt içi fiyat düzeyi). Bu tanımda q''nun artması ulusal paranın reel değer kaybıdır ve rekabet
      gücünü artırır.'
  gecerlilik:
    baslangic: '2026-11-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (36 / 30 / 1.10 - 1) * 100
