      göre 1 kumaşın fırsat maliyeti 50 / 20 = 2,5 şaraptır.
    hesap_adimlari:
    - 'Kumaş üretiminden vazgeçilen şarap: 50 birim'
    - 1 kumaşın fırsat maliyeti = 50 / 20 = 2,5 şarap
