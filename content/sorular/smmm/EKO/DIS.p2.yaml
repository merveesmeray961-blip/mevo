      10 - 8 + 3 = 10 milyar $ (fazla).'
    hesap_adimlari:
    - Mal ticaret dengesi = 120 - 95 = +25
    - Cari denge = 25 - 10 - 8 + 3 = +10
    celdiriciler:
      A: İşaret hatası yapılmıştır; cari denge pozitif (fazla) çıkar.
      B: İkincil gelir dengesi eklenmesi gerekirken çıkarılmıştır (25 - 10 - 8 - 3 = 4).
      D: Yalnız mal ve hizmet dengesi alınmıştır (25 - 10); birincil ve ikincil gelir dengeleri unutulmuştur.
      E: Yalnız dış ticaret (mal) dengesi alınmıştır; cari denge hizmetleri ve gelir kalemlerini de içerir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/DIS
    madde: §1.2
    alinti: '| Cari işlemler hesabı | Mal ticareti, hizmetler (turizm, taşımacılık), birincil gelir (ücret, faiz, kâr payı),
      ikincil gelir (işçi dövizleri, hibe gibi karşılıksız cari transferler) |'
  gecerlilik:
    baslangic: '2026-11-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (120 - 95) - 10 - 8 + 3
  durum: kontrolde
