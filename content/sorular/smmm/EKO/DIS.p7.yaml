  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 3
  kok: 'İki ülkeli Ricardo modelinde emek tek faktördür. A ülkesinde 1 birim emekle 8 birim X veya 4 birim Y üretilir.
    B ülkesinde 1 birim emekle 6 birim X veya 2 birim Y üretilir. Buna göre aşağıdaki ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: A ülkesi her iki malda da karşılaştırmalı üstünlüğe sahiptir.
    B: B ülkesi X malında karşılaştırmalı üstünlüğe sahiptir.
    C: A ülkesinde 1 birim Y’nin fırsat maliyeti 2 birim X’tir.
    D: B ülkesi Y malında karşılaştırmalı üstünlüğe sahiptir.
    E: Her iki ülke de X malında mutlak üstünlüğe sahiptir.
  dogru: C
  aciklama:
    dogru_neden: 'A’da 1 Y’nin fırsat maliyeti = 8/4 = 2 X.

      B’de 1 Y’nin fırsat maliyeti = 6/2 = 3 X.

      Y’nin fırsat maliyeti A’da daha düşük → A, Y’de karşılaştırmalı üstün.

      X’in fırsat maliyeti A’da 4/8 = 0,5 Y; B’de 2/6 ≈ 0,33 Y → B, X’te karşılaştırmalı üstün.

      Doğru ifade C’dir.

      Püf noktaları: Karşılaştırmalı üstünlük fırsat maliyetine bakılarak belirlenir; mutlak üstünlük tek başına
      ticaret yönünü belirlemez.

      '
    celdiriciler:
      A: Bir ülke her iki malda karşılaştırmalı üstün olamaz; fırsat maliyetleri ters yönlüdür.
      B: X’te karşılaştırmalı üstünlük B’dedir (daha düşük fırsat maliyeti).
      D: Y’de karşılaştırmalı üstünlük A’dedir.
      E: B, X’te mutlak olarak daha az üretir (6 < 8); mutlak üstünlük A’dadır.
