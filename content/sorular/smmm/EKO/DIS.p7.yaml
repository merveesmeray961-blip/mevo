- id: SMMM-EKO-DIS-0007
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: ödemeler dengesi
  tip: kavrama
  zorluk: 2
  kok: 'Ödemeler bilançosunda cari işlemler hesabı ile sermaye ve finans hesabı arasındaki ilişkiye dair aşağıdaki
    ifadelerden hangisi doğrudur? (Esnek kur varsayımı)

    '
  secenekler:
    A: Cari açık her zaman rezerv azalmasıyla finanse edilir.
    B: Cari fazla, sermaye hesabında net çıkışa yol açarak dengeyi sağlar.
    C: Cari açık, sermaye hesabında net giriş (borçlanma/yabancı yatırım) ile finanse edilir.
    D: Ödemeler bilançosu her zaman açık verir.
    E: Cari hesap ile sermaye hesabı bağımsızdır; birbirini etkilemez.
  dogru: C
  aciklama:
    dogru_neden: 'Muhasebe kimliği gereği (rezerv hareketleri dâhil) cari işlemler hesabı + sermaye/finans hesabı
      ≈ 0’dır. Cari açık, yurt dışından net sermaye girişi (borçlanma veya varlık satışı) ile finanse edilir.

