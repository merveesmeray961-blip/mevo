- id: SMMM-EKO-DIS-0004
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: ödemeler dengesi
  tip: uygulama
  zorluk: 3
  kok: 'Bir ülkenin ödemeler bilançosunda aşağıdaki işlemler kaydedilmiştir (milyar dolar):


    - Mal ihracatı: +80

    - Mal ithalatı: -95

    - Hizmet ihracatı: +25

    - Hizmet ithalatı: -15

    - Yatırım gelirleri (net): +5

    - Cari transferler (net): -3

    - Doğrudan yatırımlar (net): +12

    - Portföy yatırımları (net): -8

    - Diğer yatırımlar (net): +4

    - Rezerv varlıklar: -5


    Buna göre cari işlemler hesabı bakiyesi kaç milyar dolardır?

    '
  secenekler:
    A: '-8'
    B: '-3'
    C: '+2'
    D: '+5'
    E: '+12'
  dogru: B
  aciklama:
    dogru_neden: 'Cari işlemler hesabı = mal ticareti + hizmet ticareti + yatırım gelirleri + cari transferler.

      Mal ticareti = 80 - 95 = -15

      Hizmet ticareti = 25 - 15 = +10

      Yatırım gelirleri = +5

      Cari transferler = -3

      Toplam = -15 + 10 + 5 - 3 = -3

      Püf noktaları: Sermaye ve finans hesabı kalemleri (doğrudan, portföy, diğer yatırımlar, rezervler) cari hesaba dahil
      edilmez.

      '
    hesap_adimlari:
    - Mal dengesi = 80 - 95 = -15
    - Hizmet dengesi = 25 - 15 = +10
    - Yatırım gelirleri = +5
    - Cari transferler = -3
    - Cari işlemler bakiyesi = -15 + 10 + 5 - 3 = -3
    celdiriciler:
      A: Mal ve hizmet dengesi (-5) ile transferler (-3) toplanmış, yatırım gelirleri unutulmuştur.
      C: Yatırım gelirleri ve transferler yanlış işaretle eklenmiştir.
      D: Yalnızca yatırım gelirleri alınmış veya mal-hizmet dengesi yanlış hesaplanmıştır.
      E: Finans hesabı kalemleri (doğrudan yatırım) cari hesaba dahil edilmiştir.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Ödemeler dengesi — cari işlemler hesabı bileşenleri
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'mal = 80 - 95

      hizmet = 25 - 15

      yatirim_gelir = 5

      transfer = -3

      sonuc = mal + hizmet + yatirim_gelir + transfer

      '
  durum: kontrolde
  surum: 1
