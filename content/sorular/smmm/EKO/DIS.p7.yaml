  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 3
  kok: 'Emeğin tek üretim faktörü olduğu iki ülkeli, iki mallı Ricardo modelinde A ve B ülkelerinde bir birim emekle üretilebilecek
    miktarlar şöyledir:


    | Ülke | Buğday (kg) | Kumaş (metre) |

    |------|-------------|---------------|

    | A    | 8           | 4             |

    | B    | 2           | 2             |


    A ülkesi buğdayda, B ülkesi kumaşta uzmanlaşırsa ve ticaret haddi 1 kg buğday = 1 metre kumaş olarak belirlenirse, her
    iki ülkenin de ticaretten karşılıklı kazanç sağlayabilmesi için aşağıdaki koşullardan hangisi geçerlidir?

    '
  secenekler:
    A: A ülkesi buğdayın tamamını ihraç etmeli, B ülkesi kumaşın tamamını ihraç etmelidir.
    B: Ticaret haddi, her iki ülkenin iç fırsat maliyetleri arasında yer almalıdır.
    C: A ülkesi mutlak üstünlüğe sahip olduğu için tek taraflı kazanç elde eder.
    D: B ülkesi her iki malda da mutlak dezavantajlı olduğundan ticaretten kazanç sağlayamaz.
    E: Ticaret haddi A ülkesinin iç maliyetine eşit olursa her iki ülke de kazançlı çıkar.
  dogru: B
  aciklama:
    dogru_neden: 'A''da 1 kg buğdayın fırsat maliyeti = 4/8 = 0,5 metre kumaş; B''de 1 kg buğdayın fırsat maliyeti = 2/2 =
      1 metre kumaş. Karşılıklı kazanç için uluslararası ticaret haddi bu iki iç fırsat maliyeti arasında (0,5 ile 1 arasında)
      olmalıdır. Verilen 1:1 haddi sınırdadır; B için kayıtsızlık, A için kazanç yaratır. Genel koşul olarak haddin iki iç
      maliyet arasında yer alması gerekir.

      Püf noktaları: Mutlak üstünlük değil karşılaştırmalı üstünlük ticareti belirler. Ticaret haddi iç fırsat maliyetleri
      aralığının dışında kalırsa en az bir ülke ticaretten zarar eder.

      '
    celdiriciler:
      A: Uzmanlaşma yönü doğrudur ancak kazanç koşulu ticaret haddinin konumuna bağlıdır; miktar zorunluluğu yoktur.
      C: A mutlak üstünlüğe sahiptir ancak her iki ülke de uygun had altında kazanç sağlayabilir.
      D: Ricardo modelinde mutlak dezavantaj ticaret kazancını engellemez; fırsat maliyetleri farklıysa kazanç mümkündür.
      E: Haddin bir ülkenin iç maliyetine eşit olması o ülkeyi kayıtsız bırakır; her iki ülke için kazanç sağlamaz.
