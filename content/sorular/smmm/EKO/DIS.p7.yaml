    dogru_neden: 'A''da 1 kg buğdayın fırsat maliyeti = 4/8 = 0,5 metre kumaş; B''de 1 kg buğdayın fırsat maliyeti
      = 2/2 = 1 metre kumaş. Karşılıklı kazanç için ticaret haddi bu iki iç fırsat maliyeti arasında olmalıdır.
      Verilen 0,75 had bu aralıktadır: A, 1 kg buğdayı 0,5 yerine 0,75 metre kumaşa satar; B, 1 kg buğdayı 1 yerine
      0,75 metre kumaş karşılığı alır. İki ülke de kazanır.

      Püf noktaları: Mutlak üstünlük değil karşılaştırmalı üstünlük ticareti belirler. Had, iç fırsat maliyetleri
      aralığının dışına çıkarsa en az bir ülke zarar eder.

      '
