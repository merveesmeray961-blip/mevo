- id: SMMM-EKO-DIS-0012
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: ödemeler dengesi
  tip: uygulama
  zorluk: 3
  kok: 'Bir ülkenin ödemeler bilançosunda cari işlemler hesabı 15 milyar $ açık vermiş, sermaye hesabı 3 milyar
    $ fazla vermiş ve resmi rezervlerde 4 milyar $ azalma kaydedilmiştir. Çift kayıt ilkesine göre finansal hesap
    (net) ile net hata ve noksan kaleminin toplamı kaç milyar $ olmalıdır?

    '
  secenekler:
    A: 8 fazla
    B: 12 fazla
    C: 15 fazla
    D: 19 fazla
    E: 22 fazla
  dogru: A
  aciklama:
    dogru_neden: 'Ödemeler bilançosu kimlik eşitliği: Cari + Sermaye + Finansal + Net hata ve noksan + Rezerv değişimi
      = 0. Rezerv azalması kaynak girişi gibi +4 yazılır. −15 + 3 + (F + NHN) + 4 = 0 → F + NHN = +8. Toplam 8 milyar
      $ fazla olmalıdır.

      Püf noktaları: Rezerv azalması bilançoda pozitif (kaynak) kaydedilir; kimlik her zaman sıfır toplamı gerektirir.

      '
    celdiriciler:
      B: Rezerv değişimini negatif alarak −15 + 3 + X − 4 = 0 → X = 16 gibi yanlış işaret kullanmıştır.
