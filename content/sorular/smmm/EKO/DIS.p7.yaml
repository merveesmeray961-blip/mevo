    | Ülke | Buğday (kg) | Kumaş (metre) |

    |------|-------------|---------------|

    | A    | 8           | 4             |

    | B    | 2           | 2             |


    A ülkesi buğdayda, B ülkesi kumaşta uzmanlaşır ve ticaret haddi 1 kg buğday = 0,75 metre kumaş olarak belirlenirse
    aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Had, B ülkesinin iç fırsat maliyetinin altında kaldığı için B ticaretten zarar eder.
    B: Had, iç fırsat maliyetleri (0,5 ile 1 metre kumaş) arasında kaldığı için her iki ülke de kazanır.
    C: A ülkesi iki malda da mutlak üstün olduğundan B ülkesi bu ticaretten kazanç elde edemez.
    D: B ülkesi iki malda da mutlak dezavantajlı olduğu için ticaretten kazanç sağlayamaz.
    E: A ülkesinde 1 kg buğdayın fırsat maliyeti 2 metre kumaştır; bu nedenle had A'yı zarara sokar.
  dogru: B
