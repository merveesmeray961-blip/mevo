- id: SMMM-EKO-DIS-0002
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 3
  kok: 'Emeğin tek üretim faktörü olduğu iki ülkeli, iki mallı Ricardo modelinde A ve B ülkelerinde bir birim emekle
    üretilebilecek buğday ve kumaş miktarları aşağıdaki gibidir:


    | Ülke | Buğday (ton) | Kumaş (metre) |

    |---|---|---|

    | A | 8 | 4 |

    | B | 6 | 2 |


    Ülkeler serbest ticaret yapmaya karar vermiş ve her biri karşılaştırmalı üstün olduğu mala tamamen uzmanlaşmıştır.
    Buna göre aşağıdaki ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: A ülkesi her iki malda da mutlak ve karşılaştırmalı üstünlüğe sahiptir.
    B: B ülkesi buğday üretiminde karşılaştırmalı üstünlüğe sahiptir.
    C: A ülkesinde 1 ton buğdayın fırsat maliyeti 0,5 metre kumaştır.
    D: B ülkesi kumaş üretiminde karşılaştırmalı üstünlüğe sahiptir ve ticaretten kazanç sağlar.
    E: Fırsat maliyetleri eşit olduğundan iki ülke arasında karşılıklı kazançlı ticaret mümkün değildir.
  dogru: C
  aciklama:
    dogru_neden: 'Karşılaştırmalı üstünlük fırsat maliyetine göre belirlenir. A ülkesinde 1 ton buğdayın fırsat
      maliyeti 4/8 = 0,5 metre kumaş, 1 metre kumaşın fırsat maliyeti 8/4 = 2 ton buğdaydır. B ülkesinde 1 ton buğdayın
      fırsat maliyeti 2/6 ≈ 0,33 metre kumaş, 1 metre kumaşın fırsat maliyeti 6/2 = 3 ton buğdaydır. Dolayısıyla
      A kumaşta (daha düşük fırsat maliyeti: 2 < 3), B buğdayda (0,33 < 0,5) karşılaştırmalı üstünlüğe sahiptir.
      C şıkkı A ülkesindeki buğday fırsat maliyetini doğru verir.

      Püf noktaları: Mutlak üstünlük ile karşılaştırmalı üstünlük karıştırılmamalıdır. A her iki malda mutlak üstündür
      ancak fırsat maliyetleri ters olduğundan her iki malda birden karşılaştırmalı üstün olamaz. Uzmanlaşma ve
      ticaretten kazanç için fırsat maliyetlerinin farklı olması yeterlidir.

      '
    celdiriciler:
      A: A her iki malda mutlak üstündür ancak fırsat maliyetleri karşılıklı olduğundan iki malda birden karşılaştırmalı
        üstün olamaz; A yalnızca kumaşta karşılaştırmalı üstündür.
      B: Buğdayda karşılaştırmalı üstünlük B'dedir (fırsat maliyeti daha düşük); şık yanlış malı gösterir.
      D: B kumaşta değil buğdayda karşılaştırmalı üstündür; kumaşta üstün olan A'dır.
      E: Fırsat maliyetleri farklıdır (0,5 ≠ 0,33), dolayısıyla karşılıklı kazançlı ticaret mümkündür.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Karşılaştırmalı üstünlük (Ricardo) ve fırsat maliyeti
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_EKO.yaml, satır EkoYazar_EKO-2026-10-06-G02 #1'
