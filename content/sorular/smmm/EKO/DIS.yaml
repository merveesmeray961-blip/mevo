- id: SMMM-EKO-DIS-0001
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Emeğin tek üretim faktörü olduğu iki ülkeli, iki mallı Ricardo modelinde X ve Y ülkelerinde bir birim emekle

    üretilebilecek kumaş ve şarap miktarları aşağıda verilmiştir.


    | Ülke | Kumaş (metre) | Şarap (litre) |

    |---|---|---|

    | X | 6 | 3 |

    | Y | 2 | 2 |


    Buna göre aşağıdaki ifadelerden hangisi doğrudur?'
  secenekler:
    A: X ülkesi her iki malın üretiminde de karşılaştırmalı üstünlüğe sahiptir.
    B: Y ülkesi kumaş üretiminde karşılaştırmalı üstünlüğe sahiptir.
    C: X ülkesinde 1 metre kumaşın fırsat maliyeti 2 litre şaraptır.
    D: Y ülkesi şarap üretiminde karşılaştırmalı üstünlüğe sahiptir.
    E: Y ülkesi her iki malda da mutlak dezavantajlı olduğundan iki ülke arasında karşılıklı kazanç sağlayan ticaret
      mümkün değildir.
  dogru: D
  aciklama:
    dogru_neden: Karşılaştırmalı üstünlük, bir malı daha düşük fırsat maliyetiyle üreten ülkededir. X ülkesinde
      1 litre şarabın fırsat maliyeti 6 / 3 = 2 metre kumaş, Y ülkesinde ise 2 / 2 = 1 metre kumaştır. Şarabın fırsat
      maliyeti Y'de daha düşük olduğundan Y ülkesi şarap üretiminde karşılaştırmalı üstünlüğe sahiptir.
    celdiriciler:
      A: Bir ülke her iki malda mutlak üstünlüğe sahip olabilir, ancak fırsat maliyetleri karşılıklı (birbirinin
        tersi) olduğundan iki malda birden karşılaştırmalı üstünlüğe sahip olamaz. X yalnızca kumaşta karşılaştırmalı
        üstündür.
      B: 1 metre kumaşın fırsat maliyeti Y'de 1 litre şarap, X'te 0,5 litre şaraptır; kumaşı daha düşük fırsat maliyetiyle
        X ürettiğinden kumaşta karşılaştırmalı üstünlük X'tedir.
      C: X ülkesinde 1 metre kumaşın fırsat maliyeti 3 / 6 = 0,5 litre şaraptır; 2 değeri, 1 litre şarabın kumaş
        cinsinden fırsat maliyetidir (oran ters kurulmuştur).
      E: Ricardo'ya göre ticaretten karşılıklı kazanç için mutlak üstünlük değil, fırsat maliyetlerinin farklı olması
        yeterlidir. Fırsat maliyetleri farklı olduğundan her iki ülke de uzmanlaşma ve ticaretle kazanç sağlayabilir.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Karşılaştırmalı üstünlük (Ricardo) ve fırsat maliyeti
    alinti: ''
