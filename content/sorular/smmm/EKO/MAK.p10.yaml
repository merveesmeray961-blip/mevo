      C: Nakit/mevduat oranındaki artış para çarpanını etkiler; etkisiz olduğu ifadesi yanlıştır.
      E: Zorunlu karşılık oranının etkisi doğru verilmiş, nakit/mevduat oranının etkisi ters çevrilmiştir.
