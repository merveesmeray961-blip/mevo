      2,5 = 150 milyar ₺. Püf noktaları: Otonom tüketim ve yatırım çarpanı değiştirmez, gereksiz veridir. Vergi oranı ve ithalat
      eğilimi çarpanı küçülten sızıntılardır; ikisini de paydaya koymayı unutma.'
    hesap_adimlari:
    - c(1 - t) = 0,9 x 0,8 = 0,72
    - Çarpan = 1 / (1 - 0,72 + 0,12) = 1 / 0,4 = 2,5
    - ΔY = 60 x 2,5 = 150
    celdiriciler:
      A: 60 yalnızca ilk tur artışıdır; çarpan etkisi hesaba katılmamıştır.
      C: İthalat eğilimi unutulmuştur (60 / 0,28); açık ekonomide payda m'yi de içerir.
      D: Vergi oranı unutulmuştur (60 / 0,22); gelire bağlı vergi de sızıntıdır.
      E: Vergi ve ithalat sızıntıları hesaba katılmamıştır (60 / 0,1); basit çarpan kullanılmıştır.
