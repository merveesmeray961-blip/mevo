  kok: Bir açık ekonomide otonom tüketim 80, yatırım 100 milyar ₺; marjinal tüketim eğilimi 0,9, gelire bağlı vergi oranı
    %20 ve marjinal ithalat eğilimi 0,12'dir. Kamu harcamaları 60 milyar ₺ artırılırsa denge gelir kaç milyar ₺ artar?
  secenekler:
    A: '60'
    B: '150'
    C: 214,3
    D: 272,7
    E: '600'
