      A: Yalnız elma enflasyonunu (50 %) veya yanlış ağırlık kullanmıştır.
      B: Sepeti 10 elma + 10 ekmek gibi yanlış varsaymıştır.
      D: Deflatörü 125 kabul ederek 150 − 125 = 25 bulmuştur.
      E: TÜFE'yi (60 / 40) × 100 yerine 180 gibi yanlış hesaplamıştır.
    hesap_adimlari:
    - Baz sepet = 10×2 + 5×4 = 40
    - Cari sepet = 10×3 + 5×6 = 60
    - TÜFE = 60/40 × 100 = 150
    - Fark = 150 − 130 = 20
