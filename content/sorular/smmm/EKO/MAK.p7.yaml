- id: SMMM-EKO-MAK-0002
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Makro iktisat
  konu: MAK
  kazanim: para politikası ve para çarpanı
  tip: hesaplama
  zorluk: 2
  kok: 'Basit para çarpanı modelinde zorunlu karşılık oranı %20, bankaların elinde tuttuğu aşırı rezerv oranı %5
    ve halkın elinde tuttuğu nakit/mevduat oranı %15''tir. Merkez bankası açık piyasa işlemleriyle 40 milyar TL''lik
    devlet tahvili satın almıştır. Diğer koşullar sabitken para arzındaki maksimum değişim kaç milyar TL''dir?

    '
  secenekler:
    A: '80'
    B: '100'
    C: '115'
    D: 133,3
    E: '200'
  dogru: C
  aciklama:
    dogru_neden: 'Para çarpanı m = (1 + c) / (rr + er + c) formülüyle hesaplanır; burada c nakit/mevduat oranı,
      rr zorunlu karşılık oranı, er aşırı rezerv oranıdır. m = (1 + 0,15) / (0,20 + 0,05 + 0,15) = 1,15 / 0,40 =
      2,875. Para arzı değişimi ΔM = m × ΔMB = 2,875 × 40 = 115.

      Püf noktaları: Basit çarpan (1/rr) kullanılmamalıdır; nakit sızıntısı ve aşırı rezervler çarpanı küçültür.

      '
    hesap_adimlari:
    - c = 0,15; rr = 0,20; er = 0,05
    - m = (1 + 0,15) / (0,20 + 0,05 + 0,15) = 1,15 / 0,40 = 2,875
    - ΔM = 2,875 × 40 = 115
    celdiriciler:
      A: Yalnız zorunlu karşılık oranı dikkate alınarak 1/0,20 = 5 ve 40 × 2 = 80 alınmıştır; nakit ve aşırı rezerv
        sızıntıları ihmal edilmiştir.
      B: 1/(rr+er) = 1/0,25 = 4 ve 40 × 2,5 = 100 alınmıştır; nakit oranı hesaba katılmamıştır.
      D: 1/rr = 5 ve 40 × 3,333 ≈ 133,3 alınmıştır; sızıntılar yok sayılmıştır.
      E: 1/rr = 5 ve 40 × 5 = 200 alınmıştır; en basit (ve en yüksek) çarpan kullanılmıştır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Para çarpanı (zorunlu karşılık, aşırı rezerv, nakit sızıntısı)
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'c = 0.15

      rr = 0.20

      er = 0.05

      m = (1 + c) / (rr + er + c)

      sonuc = m * 40

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kaynaklı kör çözücü: anahtarla aynı (güven 4). m=(1+0,15)/(0,15+0,20+0,05)=2,875; x40=115'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; kaynaksız ders'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_EKO.yaml, satır EkoYazar_EKO-2026-10-06-G02 #2'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kaynaklı kör çözücü anahtarla uyuştu
