  kok: 'Bir ekonomide baz yılında elma 2 TL, ekmek 4 TL''dir ve sepet 10 elma + 5 ekmekten oluşur. Cari yılda elma
    3 TL, ekmek 6 TL olmuştur. Aynı yılda GSYH deflatörü 130 olarak ölçülmüştür. Buna göre cari yıl TÜFE''si ile
    deflatör arasındaki fark (TÜFE − deflatör) yüzde puan olarak kaçtır? (Baz yılı endeks = 100)

    '
