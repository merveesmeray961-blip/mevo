  tip: hesaplama
  zorluk: 3
  kok: 'Bir tüketici sepetinde yalnızca iki mal bulunmaktadır: ekmek ve süt. Baz yılında ekmek fiyatı 4 TL, süt
    fiyatı 8 TL''dir; sepet 5 ekmek ve 3 sütten oluşur. Cari yılda ekmek fiyatı 6 TL''ye, süt fiyatı 10 TL''ye yükselmiştir.
    Tüketici cari yılda sepetini 4 ekmek ve 4 süt olacak şekilde değiştirmiştir. Laspeyres tipi TÜFE''ye göre enflasyon
    oranı yüzde kaçtır?

    '
  secenekler:
    A: '%25'
    B: '%30'
    C: '%36,4'
    D: '%40'
    E: '%50'
  dogru: C
  aciklama:
    dogru_neden: 'Laspeyres tipi TÜFE baz yılı miktarlarını kullanır. Baz yılı sepet değeri = 5×4 + 3×8 = 44 TL.
      Cari yıl fiyatlarıyla aynı sepet = 5×6 + 3×10 = 60 TL. Enflasyon oranı = (60/44 - 1) × 100 ≈ %36,36 ≈ %36,4.

      Püf noktaları: Laspeyres endeksi cari yıl miktarlarını değil, baz yılı miktarlarını kullanır. Cari sepet değişikliği
      (4 ekmek + 4 süt) dikkate alınmaz; bu Paasche endeksiyle karıştırılan tipik hatadır.

      '
    hesap_adimlari:
    - Baz yılı sepet değeri = 5×4 + 3×8 = 44 TL
    - Cari fiyatlarla baz sepet = 5×6 + 3×10 = 60 TL
