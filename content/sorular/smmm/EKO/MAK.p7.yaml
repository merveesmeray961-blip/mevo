  - SGS
  ders: EKO
  unite: Makro iktisat
  konu: MAK
  kazanim: GSYH ve deflatör
  tip: hesaplama
  zorluk: 3
  kok: 'Bir ekonomide yalnızca elma ve armut üretilmektedir. 2024 ve 2025 yıllarına ait üretim ve fiyat verileri
    şöyledir:


    | Yıl | Elma miktarı | Elma fiyatı (TL) | Armut miktarı | Armut fiyatı (TL) |

    |---|---|---|---|---|

    | 2024 | 100 | 10 | 50 | 20 |

    | 2025 | 100 | 15 | 50 | 30 |


    2024 baz yılı kabul edildiğinde 2025 yılı GSYH deflatörü kaçtır? (GSYH deflatörü = (Nominal GSYH / Reel GSYH)
    × 100)

    '
  secenekler:
    A: '120'
    B: '125'
    C: '140'
    D: '150'
    E: '160'
  dogru: D
  aciklama:
    dogru_neden: '2025 nominal GSYH = 100 × 15 + 50 × 30 = 1500 + 1500 = 3000.

      2025 reel GSYH (2024 fiyatlarıyla) = 100 × 10 + 50 × 20 = 1000 + 1000 = 2000.

      Deflatör = (3000 / 2000) × 100 = 150.

      Püf noktaları: Deflatör tüm mal ve hizmetleri kapsar ve cari yıl miktarlarını kullanır; TÜFE sabit sepet kullanır.
      Bu örnekte miktarlar değişmediği için deflatör yalnızca fiyat değişimini yansıtır.

      '
    hesap_adimlari:
    - Nominal GSYH 2025 = 100×15 + 50×30 = 3000
    - Reel GSYH 2025 (2024 fiyatları) = 100×10 + 50×20 = 2000
    - Deflatör = (3000/2000)×100 = 150
    celdiriciler:
      A: Yanlış reel veya nominal ile 120 bulunmuştur.
      B: Yanlış hesapla 125 bulunmuştur.
      C: Yaklaşık değer ile 140 bulunmuştur.
      E: Yanlış (nominal/reel) ile 160 bulunmuştur.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: GSYH deflatörü (nominal / reel GSYH)
    alinti: (genel bilgi)
