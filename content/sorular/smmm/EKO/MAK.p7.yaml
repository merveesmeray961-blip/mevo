- id: SMMM-EKO-MAK-0017
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Makro iktisat
  konu: MAK
  kazanim: para politikası ve para çarpanı
  tip: hesaplama
  zorluk: 3
  kok: 'Kapalı bir ekonomide bankacılık sisteminin zorunlu karşılık oranı %10''dur. Merkez bankası açık piyasa işlemiyle
    200 milyar TL tutarında devlet tahvili satın almıştır. Ticari bankalar bu işlemin tamamını zorunlu karşılık
    olarak tutmak yerine, yeni kredilerin %20''sini gönüllü (fazla) rezerv olarak tutmayı tercih etmektedir. Diğer
    koşullar sabitken, bu işlemin maksimum yaratabileceği para arzı artışı kaç milyar TL''dir?

    '
  secenekler:
    A: '500'
    B: '667'
    C: '1000'
    D: '1600'
    E: '2000'
  dogru: B
  aciklama:
    dogru_neden: 'Etkili rezerv oranı = zorunlu karşılık oranı + gönüllü rezerv oranı = 0,10 + 0,20 = 0,30''tur.
      Para çarpanı = 1 / 0,30 ≈ 3,333''tür. Merkez bankasının tahvil alımı banka rezervlerini 200 milyar TL artırır.
      Maksimum para arzı artışı = 200 × (1 / 0,30) ≈ 666,67 ≈ 667 milyar TL''dir.

      Püf noktaları: Gönüllü rezervler zorunlu karşılık oranına eklenerek etkili rezerv oranını yükseltir ve çarpanı
      küçültür. Yalnız zorunlu karşılık oranıyla (çarpan 10) hesaplamak veya gönüllü rezervi ihmal etmek tipik hatalardır.

      '
    hesap_adimlari:
    - Zorunlu karşılık oranı (rr) = 0,10
    - Gönüllü (fazla) rezerv oranı (er) = 0,20
    - Etkili rezerv oranı = rr + er = 0,30
    - Para çarpanı = 1 / 0,30 ≈ 3,333
    - Rezerv artışı (ΔR) = 200 milyar TL
    - Para arzı artışı = 200 × (1 / 0,30) ≈ 667 milyar TL
    celdiriciler:
      A: 500, etkili oranın 0,40 alınması veya başka bir kombinasyonla bulunur.
      C: 1000, zorunlu karşılık oranıyla (çarpan 10) hesaplanan tutarın yarısıdır; gönüllü rezervler ihmal edilmiştir.
      D: 1600, gönüllü rezerv oranının yanlış eklenmesi veya çarpanın 8 alınmasıyla elde edilir.
      E: 2000, yalnız zorunlu karşılık oranıyla (1/0,10 = 10) hesaplanır; bankaların gönüllü rezerv tuttuğu göz
        ardı edilmiştir.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Para çarpanı (zorunlu ve fazla rezerv oranları)
    alinti: (genel bilgi)
