- id: SMMM-EKO-MAK-0005
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Makro iktisat
  konu: MAK
  kazanim: Keynesyen çarpan
  tip: hesaplama
  zorluk: 2
  kok: 'Basit Keynesyen modelde kapalı bir ekonomide marjinal tüketim eğilimi 0,8''dir. Yatırımlar 25 milyar TL
    artmış, hükûmet götürü vergileri 10 milyar TL yükseltmiştir. Diğer koşullar sabitken denge milli gelirdeki net
    değişim kaç milyar TL''dir?

    '
  secenekler:
    A: '50'
    B: '75'
    C: '85'
    D: '100'
    E: '125'
  dogru: C
  aciklama:
    dogru_neden: 'Harcama çarpanı = 1/(1-0,8) = 5. Vergi çarpanı = -0,8/(1-0,8) = -4.

      Yatırım artışı etkisi: 25 × 5 = 125.

      Vergi artışı etkisi: 10 × (-4) = -40.

      Net değişim: 125 - 40 = 85 milyar TL.

      Püf noktaları: İki çarpanın etkisi birlikte hesaplanır; vergi artışı harcanabilir geliri azaltır.

      '
    hesap_adimlari:
    - Harcama çarpanı = 1/(1-0,8) = 5
    - Vergi çarpanı = -0,8/(1-0,8) = -4
    - Yatırım etkisi = 25×5 = 125
    - Vergi etkisi = 10×(-4) = -40
    - Net = 125-40 = 85
    celdiriciler:
      A: Yalnız vergi çarpanı büyüklüğü (4) ile 10×5=50 alınmıştır.
      B: Vergi çarpanı yanlışlıkla -3 alınarak 125-50=75 bulunmuştur.
      D: Yalnız yatırım etkisi (125) alınmış, vergi daraltıcı etkisi ihmal edilmiştir.
      E: Vergi etkisi ters işaretle eklenerek 125+0 alınmış veya yanlış çarpan kullanılmıştır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Keynesyen harcama ve vergi çarpanları
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'mte = 0.8

      dI = 25

      dT = 10

      harcama_carpani = 1 / (1 - mte)

      vergi_carpani = -mte / (1 - mte)

      sonuc = dI * harcama_carpani + dT * vergi_carpani

      '
