  kok: 'Bir ekonomide zorunlu karşılık oranı %10, nakit tercih oranı (nakit/mevduat) %20 ve fazla rezerv oranı sıfırdır.
    Merkez bankası açık piyasa işlemiyle 140 milyon TL''lik devlet tahvili satın almıştır. Para çarpanı modeline
    göre para arzındaki maksimum artış ne kadardır?

    '
  secenekler:
    A: 280 milyon TL
    B: 400 milyon TL
    C: 560 milyon TL
    D: 700 milyon TL
    E: 1400 milyon TL
  dogru: C
  aciklama:
    dogru_neden: 'Para çarpanı m = (1 + c) / (c + r + e) formülüyle bulunur. c = 0,20, r = 0,10, e = 0 olduğundan
      m = 1,20 / 0,30 = 4. ΔM = 4 × 140 = 560 milyon TL.

      Püf noktaları: Nakit tercih oranı çarpanı küçültür; fazla rezerv yokken formül (1+c)/(c+r) olur.

      '
    celdiriciler:
      A: Yalnız (1/r) yerine 1/(c+r) = 1/0,5 = 2 × 140 = 280 bulmuştur.
      B: Çarpanı 1/c = 5 veya 140 × (1/0,35) gibi yanlış payda kullanmıştır.
      D: Yalnız r=0,2 alarak 1/0,2 = 5 × 140 = 700 bulmuştur.
      E: Yalnız zorunlu karşılık çarpanı 1/0,10 = 10 × 140 = 1400'dür; nakit tercihini ihmal etmiştir.
    hesap_adimlari:
    - m = (1 + 0,20) / (0,20 + 0,10) = 1,20 / 0,30 = 4
    - ΔM = 4 × 140 = 560
