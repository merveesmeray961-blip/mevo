- id: SMMM-EKO-MAK-0032
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Makro iktisat
  konu: MAK
  kazanim: GSYH ve deflatör
  tip: hesaplama
  zorluk: 3
  kok: Bir ekonomide 2025 yılında nominal GSYH 1.500 milyar TL ve reel GSYH 1.250 milyar TL’dir. 2025 yılı GSYH deflatörü
    kaçtır? Ayrıca nominal GSYH’nin reel GSYH’den yüksek olmasının fiyat düzeyi bakımından yorumu aşağıdakilerden hangisidir?
  secenekler:
    A: 100; fiyat düzeyi baz yılına göre düşüktür.
    B: 110; fiyat düzeyi reel üretimden bağımsızdır.
    C: 120; cari fiyatlar baz yılı fiyatlarının üzerindedir.
    D: 125; cari fiyatlar baz yılı fiyatlarının altındadır.
    E: 150; nominal ve reel GSYH eşittir.
  dogru: C
  aciklama:
    dogru_neden: 'GSYH deflatörü = (nominal GSYH / reel GSYH) × 100 = (1500/1250)×100 = 120. Deflatörün 100’ün üzerinde olması,
      cari fiyat düzeyinin baz yılına göre daha yüksek olduğunu gösterir. Püf noktaları: Deflatör miktar değil fiyat düzeyi
      göstergesidir.'
    celdiriciler:
      A: Deflatör 100 değil, 120dir.
      B: Deflatör 110 değildir ve fiyat düzeyini ölçer.
      D: 125 sonucu vermez; ayrıca 125 nominal/reel oranı değildir.
      E: 150, nominal ve reel GSYH oranına karşılık gelmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş bilgi
    madde: '-'
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (1500 / 1250) * 100
