  kok: Basit para çarpanı modelinde, diğer koşullar sabitken halkın nakit tutma eğilimi ile bankaların fazla rezerv
    tutma eğilimindeki artışın para çarpanına etkisi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki artış da bankaların kredi verebileceği fonları çoğalttığı için çarpan yükselir.
    B: Nakit tutma eğilimindeki artış çarpanı düşürür; fazla rezerv artışı çarpanı etkilemez.
    C: Fazla rezerv artışı çarpanı düşürür; nakit tutma eğilimindeki artış çarpanı etkilemez.
    D: Nakit tercihindeki artış çarpanı düşürürken fazla rezerv artışı çarpanı yükseltir.
    E: Her iki eğilimdeki artış mevduat yaratma sürecini zayıflatır ve çarpanı düşürür.
  dogru: E
  aciklama:
    dogru_neden: Halkın daha fazla nakit tutması mevduat sisteminde kalan fonları azaltır; bankaların fazla rezerv
      tutması da kredi ve mevduat yaratma sürecini sınırlar. Her iki gelişme de diğer koşullar sabitken para çarpanını
      aşağı çeker.
    celdiriciler:
      A: Nakit sızıntısı ve atıl rezerv kredi verilebilir fonları azaltır, çoğaltmaz; çarpan düşer.
      B: Nakit tercihinin artması çarpanı düşürür doğru, ancak fazla rezervler de çarpanın belirleyicisidir ve çarpanı
        düşürür.
      C: Fazla rezerv artışı çarpanı düşürür doğru, ancak nakit tercihindeki artış da çarpanı düşürür.
      D: Fazla rezerv artışı da çarpanı düşürür; iki eğilim aynı yönde etki eder, zıt yönde değil.
