- id: SMMM-EKO-MAK-0001
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Ekonomi
  konu: MAK
  kazanim: Keynesyen çarpan
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: Basit Keynesyen modelle incelenen kapalı bir ekonomide otonom tüketim 50 milyar TL, marjinal tüketim eğilimi
    0,75'tir. Vergiler götürü (gelirden bağımsız) olup yatırımlar ve fiyatlar genel düzeyi sabittir. Hükûmet kamu
    harcamalarını 40 milyar TL, götürü vergileri ise 20 milyar TL artırmıştır. Diğer koşullar sabitken denge milli
    gelir ne kadar artar?
  secenekler:
    A: 40 milyar TL
    B: 80 milyar TL
    C: 100 milyar TL
    D: 160 milyar TL
    E: 220 milyar TL
  dogru: C
  aciklama:
    dogru_neden: 'Basit Keynesyen modelde götürü vergi varsayımı altında kamu harcaması çarpanı 1 / (1 - MTE), vergi
      çarpanı -MTE / (1 - MTE)''dir (MTE: marjinal tüketim eğilimi). MTE = 0,75 olduğundan harcama çarpanı 4, vergi
      çarpanı -3''tür. Harcama artışının etkisi 40 x 4 = 160 milyar TL, vergi artışının etkisi 20 x (-3) = -60 milyar
      TL''dir; denge gelirindeki net artış 100 milyar TL olur. Sağlama: harcamanın 20 milyar TL''lik kısmı vergiyle
      finanse edildiğinden denk bütçe çarpanıyla (1) 20 milyar TL, kalan 20 milyar TL''lik harcama 20 x 4 = 80 milyar
      TL etki doğurur; toplam 100 milyar TL.


      Püf noktaları: İki çarpanın etkisi birlikte hesaplanır. Otonom tüketim değişmediği için gelirdeki değişime
      etki etmez. Tuzak: vergi çarpanını harcama çarpanıyla aynı büyüklükte almak; vergi artışı harcanabilir geliri
      azaltır ve tüketimi yalnızca MTE oranında düşürür.'
    hesap_adimlari:
    - 'Kamu harcaması çarpanı: 1 / (1 - 0,75) = 4'
    - 'Vergi çarpanı: -0,75 / (1 - 0,75) = -3'
    - 'Harcama etkisi: 40 x 4 = 160 milyar TL'
    - 'Vergi etkisi: 20 x (-3) = -60 milyar TL'
    - 'Net artış: 160 - 60 = 100 milyar TL (otonom tüketim değişmediğinden hesaba girmez)'
    celdiriciler:
      A: 40, denk bütçe çarpanının (1) harcama artışının tamamına uygulanmasıyla bulunur; oysa vergiler harcama
        artışının yalnız 20 milyar TL'lik kısmını finanse eder, kalan 20 milyar TL'lik harcama 4 kat etki doğurur.
      B: 80, vergi çarpanının -1 / (1 - MTE) = -4 alınmasıyla bulunur (160 - 80); vergi artışı tüketimi MTE oranında
        azalttığından vergi çarpanı -MTE / (1 - MTE) = -3'tür.
      D: 160, yalnız kamu harcaması artışının etkisidir (40 x 4); götürü vergilerdeki 20 milyar TL'lik artışın daraltıcı
        etkisi dikkate alınmamıştır.
      E: 220, vergi artışının etkisi ters işaretle eklenerek bulunur (160 + 60); vergi artışı harcanabilir geliri
        ve tüketimi azalttığından denge gelirini düşürür.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Keynesyen kamu harcaması ve vergi çarpanları (götürü vergi, kapalı ekonomi)
    alinti: ''
  dogrulama:
    python: 'mte = 0.75

      dG = 40

      dT = 20

      harcama_carpani = 1 / (1 - mte)

      vergi_carpani = -mte / (1 - mte)

      sonuc = round(dG * harcama_carpani + dT * vergi_carpani, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: kamu harcaması (40 milyar TL) ve götürü vergi (20 milyar TL) birlikte artırılıyor,
      MTE 0,80 → 0,75, kökte gereksiz veri (otonom tüketim) eklendi; şıklar 40/80/100/160/220 milyar TL, doğru şık
      E → C; açıklama, çeldirici gerekçeleri, hesap adımları ve dogrulama.python yeniden yazıldı; zorluk 2 → 3;
      gecerlilik.baslangic 2026-10-03 → 2026-01-01 (teori sorusu).'
    neden: 'Rötuş: GZ''de ortalama aday rahat çözdü (güven 4); MLY/EKO soruları kolay kalmıştı. Zorlaştırma §7 teknikleriyle
      (çok adımlı hesap, gereksiz veri, tipik hata çeldiricileri), SGS düzeyinde yapıldı.'
