- id: SMMM-EKO-MIK-0008
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: tüketici ve üretici fazlası
  tip: hesaplama
  zorluk: 3
  kok: 'Bir malın talep fonksiyonu P = 120 − 2Q, arz fonksiyonu P = 20 + 3Q şeklindedir. Piyasa dengesinde tüketici fazlası
    ile üretici fazlasının toplamı (toplam refah) kaç birimdir?

    '
  secenekler:
    A: '400'
    B: '500'
    C: '600'
    D: '800'
    E: '1000'
  dogru: E
  aciklama:
    dogru_neden: 'Denge: 120 − 2Q = 20 + 3Q → 100 = 5Q → Q* = 20, P* = 20 + 3·20 = 80.

      Tüketici fazlası: (1/2)·(120 − 80)·20 = (1/2)·40·20 = 400.

      Üretici fazlası: (1/2)·(80 − 20)·20 = (1/2)·60·20 = 600.

      Toplam refah = 400 + 600 = 1000.

      Püf noktaları: Toplam refah = tüketici + üretici fazlası üçgenlerinin toplamıdır; denge fiyat ve miktarı doğru bulmak
      esastır.

      '
    hesap_adimlari:
    - 'Denge: 120 − 2Q = 20 + 3Q → 100 = 5Q → Q* = 20'
    - P* = 20 + 3·20 = 80
    - Tüketici fazlası = (1/2)·(120 − 80)·20 = 400
    - Üretici fazlası = (1/2)·(80 − 20)·20 = 600
    - Toplam = 400 + 600 = 1000
    celdiriciler:
      A: Yalnızca tüketici fazlasını (400) verir; üretici fazlasını eklemez.
      B: Üretici fazlasından 100 eksik veya yanlış yükseklik kullanımıyla (ör. 50·20/2) elde edilir.
      C: Yalnızca üretici fazlasını (600) verir; tüketici fazlasını unutur.
      D: İki fazlanın yanlış toplanması veya denge miktarının 16 alınmasıyla (ör. farklı denklem çözümü) bulunur.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Tüketici ve üretici fazlası (üçgen alan formülü)
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'Q = 20

      P = 80

      tf = 0.5 * (120 - P) * Q

      uf = 0.5 * (P - 20) * Q

      sonuc = tf + uf

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
