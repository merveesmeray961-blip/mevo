- id: SMMM-EKO-MIK-0019
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 3
  kok: 'Bir malın fiyatı 20 TL''den 25 TL''ye yükseldiğinde talep edilen miktar 100 birimden 80 birime düşmüştür. Bu mal için
    talep esnekliği (mutlak değer) ve fiyat artışının toplam hasılat üzerindeki etkisi aşağıdakilerden hangisidir? (Orta nokta
    / yay esnekliği formülü kullanılacaktır.)

    '
  secenekler:
    A: Esneklik 0,8; toplam hasılat artar
    B: Esneklik 1,0; toplam hasılat değişmez
    C: Esneklik 1,22; toplam hasılat azalır
    D: Esneklik 0,5; toplam hasılat artar
    E: Esneklik 2,0; toplam hasılat azalır
  dogru: B
  aciklama:
    dogru_neden: 'Yay (orta nokta) esnekliği = |(ΔQ / ort Q) / (ΔP / ort P)|. ort Q = 90, ort P = 22,5. |(20/90) / (5/22,5)|
      = 1. Toplam hasılat başlangıçta 20×100 = 2000 TL, sonrasında 25×80 = 2000 TL olduğundan değişmez. Esneklik tam 1 iken
      toplam hasılat değişmez.

      Püf noktaları: Yay esnekliği uç noktaların ortalamasını kullanır. Basit (nokta) esneklik 0,8 verse de soru yay formülünü
      istemektedir.

      '
    hesap_adimlari:
    - ort Q = (100+80)/2 = 90
    - ort P = (20+25)/2 = 22,5
    - ΔQ/ortQ = 20/90 ≈ 0,2222
    - ΔP/ortP = 5/22,5 ≈ 0,2222
    - Esneklik = 1
    - Hasılat başlangıç = 2000; sonraki = 2000 → değişmez
    celdiriciler:
      A: 0,8, basit (nokta) esneklik formülüyle (ΔQ/Q1)/(ΔP/P1) hesaplanır; yay formülü istenmiştir. Ayrıca hasılat değişmez.
      C: 1,22, (20/90)/(5/25) gibi yanlış ortalama kullanımıyla elde edilir.
      D: 0,5, yalnızca fiyat veya miktar değişim oranının yarısı alınarak bulunur.
      E: 2,0, ters oran (fiyat/miktar) veya abartılı hesap hatasıdır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Talep esnekliği (yay formülü) ve toplam hasılat
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'q1, q2 = 100, 80

      p1, p2 = 20, 25

      ort_q = (q1 + q2) / 2

      ort_p = (p1 + p2) / 2

      esneklik = abs((q2 - q1) / ort_q) / abs((p2 - p1) / ort_p)

      sonuc = round(esneklik, 2)

      '
  durum: geri_cekildi
