- id: SMMM-EKO-MIK-0013
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 3
  kok: 'Bir malın talep fonksiyonu Q = 100 − 2P’dir. Fiyat 20 TL’den 25 TL’ye çıktığında nokta (ark) talep esnekliğinin mutlak
    değeri yaklaşık kaçtır? (Orta nokta formülü kullanınız.)

    '
  secenekler:
    A: 0,5
    B: 0,6
    C: 0,8
    D: 1,0
    E: 1,2
  dogru: C
  aciklama:
    dogru_neden: 'Orta nokta (ark) esneklik: |[(Q₂−Q₁)/(Q₁+Q₂)/2] / [(P₂−P₁)/(P₁+P₂)/2]|.

      P₁=20 → Q₁=100−40=60; P₂=25 → Q₂=100−50=50.

      ΔQ = −10, ort. Q = 55; ΔP = 5, ort. P = 22,5.

      Esneklik = (10/55) / (5/22,5) = (0,1818) / (0,2222) ≈ 0,818 ≈ 0,8.

      Püf noktaları: Orta nokta formülü yön bağımsızdır ve ortalama değerleri kullanır.

      '
    hesap_adimlari:
    - Q₁ = 100 − 2·20 = 60; Q₂ = 100 − 2·25 = 50
    - Ortalama Q = 55; ortalama P = 22,5
    - '|ε| = (10/55) ÷ (5/22,5) = 0,1818 / 0,2222 ≈ 0,818 → 0,8'
    celdiriciler:
      A: Yalnızca ΔQ/ΔP = 10/5 = 2’yi esneklik sanır veya yanlış ortalama.
      B: Başlangıç noktasını kullanarak (10/60)/(5/20)=0,167/0,25=0,67 ≈0,6.
      D: Birim esnek varsayar.
      E: Ters oranı veya ΔP/ΔQ kullanır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Ark (orta nokta) talep esnekliği
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'Q1 = 100 - 2*20

      Q2 = 100 - 2*25

      P1 = 20

      P2 = 25

      eps = abs( (Q2-Q1)/((Q1+Q2)/2) / ( (P2-P1)/((P1+P2)/2) ) )

      sonuc = round(eps, 1)

      '
  durum: kontrolde
