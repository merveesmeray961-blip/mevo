      Yeni denge: 80 − Q = 30 + Q → 50 = 2Q → Q = 25. Ölü ağırlık kaybı = ½ × (Q_eski − Q_yeni) × vergi = ½ × 5 × 10 = 25
      TL.

      Püf noktaları: Ölü ağırlık yalnızca işlemeyen miktar üzerinden üçgen alanıdır; vergi hasılatı refah transferidir, kayıp
      değildir.

      '
    celdiriciler:
      A: Yalnız (Q_eski − Q_yeni) = 5'i kayıp sanmıştır.
      B: ½ × 5 × 8 gibi yanlış yükseklik kullanmıştır.
      D: Tam dikdörtgen (5 × 10 = 50) veya ½ × 8 × 10 almıştır.
      E: Vergi hasılatını (25 × 10 = 250) yanlışlıkla 50'ye indirmiş veya tüm kaybı hasılat sanmıştır.
    hesap_adimlari:
    - 'Vergisiz: 80 − Q = 20 + Q → Q = 30, P = 50'
    - 'Vergili arz: P = 30 + Q → 80 − Q = 30 + Q → Q = 25'
    - Ölü ağırlık = ½ × 5 × 10 = 25
