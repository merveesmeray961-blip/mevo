  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: marjinal fayda ve maliyet
  tip: hesaplama
  zorluk: 3
  kok: 'Bir tüketicinin X malından elde ettiği toplam fayda TU = 40X − X² şeklindedir. X malının birim fiyatı 8 TL, tüketicinin
    paranın marjinal faydası sabittir ve 2’dir. Fayda maksimizasyonu için tüketici kaç birim X malı satın almalıdır? (MU =
    λ·P kuralı)

    '
  secenekler:
    A: '8'
    B: '12'
    C: '16'
    D: '18'
    E: '20'
  dogru: B
  aciklama:
    dogru_neden: 'Marjinal fayda MU = dTU/dX = 40 − 2X.

      Optimum: MU = λ·P → 40 − 2X = 2·8 = 16 → 40 − 16 = 2X → 24 = 2X → X = 12.

      Püf noktaları: Marjinal faydanın fiyata oranı paranın marjinal faydasına eşitlenir; türev almayı unutmamak gerekir.

      '
    hesap_adimlari:
    - MU = 40 − 2X
    - λ·P = 2·8 = 16
    - 40 − 2X = 16 → 2X = 24 → X = 12
    celdiriciler:
      A: MU = P kuralını (λ=1) uygulayarak 40−2X=8 → X=16 yerine yanlış çözümle 8 bulur.
      C: λ’yı unutup MU=P → 40−2X=8 → X=16 bulur.
      D: Türevde 2X yerine X alarak 40−X=16 → X=24 veya benzer hata.
      E: Toplam faydayı maksimize edip X=20 (TU tepe noktası) alır; fiyat ve λ dikkate alınmaz.
