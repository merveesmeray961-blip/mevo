    dogru_neden: 'Marjinal fayda MU = dTU/dQ = 40 - 4Q''dir. Optimum koşul MU = P (paranın marjinal faydası 1 iken). 40 -
      4Q = 8 → 4Q = 32 → Q = 8. İkinci türev negatif olduğundan maksimum noktadır.

      Püf noktaları: Toplam fayda fonksiyonundan marjinal fayda türetilir; ortalama fayda ile karıştırılmamalıdır. Optimumda
      MU = P eşitliği kullanılır.

      '
    hesap_adimlari:
    - MU = 40 - 4Q
    - 'Optimum: 40 - 4Q = 8'
    - 4Q = 32
    - Q = 8
    celdiriciler:
      A: 6, MU = 40 - 2Q gibi yanlış türev alınmasıyla bulunur.
      C: 10, TU'nun maksimum olduğu nokta (40-4Q=0 → Q=10) ile karıştırılmıştır; fiyat dikkate alınmamıştır.
      D: 12, 40 - 4Q = 0 yerine başka bir eşitlik veya 40/Q formülüyle elde edilir.
      E: 16, toplam faydanın veya ortalama faydanın maksimumu sanılarak bulunur.
