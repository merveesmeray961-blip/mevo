- id: SMMM-EKO-MIK-0005
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: piyasa yapıları
  tip: kavrama
  zorluk: 3
  kok: 'Aşağıdaki piyasa yapıları ve özellikleri eşleştirmelerinden hangisi doğrudur?


    I. Tam rekabet — uzun dönemde ekonomik kâr sıfır, fiyat = asgari ortalama maliyet

    II. Tekel — kısa ve uzun dönemde ekonomik kâr mümkün, fiyat > marjinal maliyet

    III. Tekelci rekabet — uzun dönemde ekonomik kâr sıfır, fiyat > marjinal maliyet

    IV. Oligopol — firmalar birbirinin davranışını dikkate alır, fiyat genellikle marjinal maliyetin üzerindedir

    '
  secenekler:
    A: Yalnız I ve II
    B: Yalnız I, II ve III
    C: Yalnız II, III ve IV
    D: I, II, III ve IV
    E: Yalnız I ve III
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur: tam rekabette giriş-çıkış serbestliği uzun dönemde ekonomik kârı sıfırlar ve fiyat asgari ortalama
      maliyete eşittir.

      II doğrudur: tekelde engeller nedeniyle uzun dönemde de ekonomik kâr mümkündür ve monopolcü fiyat marjinal maliyetin
      üzerindedir.

      III doğrudur: tekelci rekabette serbest giriş uzun dönemde ekonomik kârı sıfırlar ancak ürün farklılaştırması nedeniyle
      fiyat marjinal maliyetin üzerindedir (etkinsizlik).

      IV doğrudur: oligopolde stratejik karşılıklı bağımlılık vardır ve fiyat genellikle marjinal maliyetin üzerindedir.

      Püf noktaları: Uzun dönem ekonomik kârın sıfır olması yalnızca serbest giriş-çıkış olan piyasalarda (tam rekabet ve
      tekelci rekabet) geçerlidir; tekel ve oligopolde engeller nedeniyle kâr sürebilir.

      '
    celdiriciler:
      A: III ve IV de doğrudur; eksik bırakılmıştır.
      B: IV de doğrudur; oligopol özelliği atlanmıştır.
      C: I de doğrudur; tam rekabet özelliği atlanmıştır.
      E: II ve IV de doğrudur; tekel ve oligopol özellikleri atlanmıştır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Piyasa yapıları (tam rekabet, tekel, tekelci rekabet, oligopol)
