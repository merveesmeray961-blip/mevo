- id: SMMM-EKO-MIK-0024
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 3
  kok: 'Bir malın talep fonksiyonu Q = 200 − 4P''dir. Fiyat 30 TL iken talep esnekliği (mutlak değer) kaçtır? Fiyat %10 artarsa
    toplam hasılat nasıl değişir?

    '
  secenekler:
    A: 1,5; hasılat artar
    B: 1,5; hasılat azalır
    C: 2,0; hasılat artar
    D: 2,0; hasılat azalır
    E: 0,5; hasılat artar
  dogru: B
  aciklama:
    dogru_neden: 'P = 30 iken Q = 200 − 4 × 30 = 80. Esneklik |ε| = |dQ/dP| × (P/Q) = 4 × (30/80) = 1,5. Esneklik > 1 (esnek)
      olduğundan fiyat artışı toplam hasılatı azaltır.

      Püf noktaları: Esnek talepte fiyat ve hasılat ters yönde hareket eder.

      '
    celdiriciler:
      A: Esneklik doğru ancak hasılat yönü yanlıştır (esnek talepte fiyat artışı hasılatı düşürür).
      C: Esnekliği 4 × (30/60) gibi yanlış Q ile 2 bulmuştur; hasılat yönü de yanlıştır.
      D: Esneklik yanlış, hasılat yönü doğru.
      E: Esnekliği ters (Q/P) almıştır.
    hesap_adimlari:
    - Q = 200 − 4×30 = 80
    - '|ε| = 4 × (30/80) = 1,5'
    - 1,5 > 1 → fiyat ↑ hasılat ↓
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Talep esnekliği ve hasılat ilişkisi
    alinti: (genel bilgi)
