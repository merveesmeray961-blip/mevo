- id: SMMM-EKO-MIK-0007
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 2
  kok: 'Bir malın fiyatı 20 TL''den 25 TL''ye yükseldiğinde talep edilen miktar 400 birimden 300 birime düşmüştür. Bu malın
    talep esnekliği (mutlak değer) kaçtır? (Orta nokta yöntemi kullanılacaktır.)

    '
  secenekler:
    A: 0,8
    B: 1,0
    C: 1,29
    D: 1,5
    E: 2,0
  dogru: C
  aciklama:
    dogru_neden: 'Orta nokta (yay) esnekliği = |(ΔQ/Qort) / (ΔP/Port)|.

      ΔQ = 300-400 = -100; Qort = (400+300)/2 = 350 → ΔQ/Qort = -100/350 ≈ -0,2857

      ΔP = 25-20 = 5; Port = (20+25)/2 = 22,5 → ΔP/Port = 5/22,5 ≈ 0,2222

      Esneklik = 0,2857 / 0,2222 ≈ 1,286 ≈ 1,29

      Püf noktaları: Nokta esnekliği yerine orta nokta yöntemi istendiği için ortalama değerler kullanılmalıdır.

      '
    hesap_adimlari:
    - ΔQ = -100; Qort = 350 → ΔQ/Qort ≈ -0,2857
    - ΔP = 5; Port = 22,5 → ΔP/Port ≈ 0,2222
    - Esneklik = 0,2857 / 0,2222 ≈ 1,29
    celdiriciler:
      A: Basit yüzde değişim (100/400)/(5/20)=0,8 alınmıştır; orta nokta kullanılmamıştır.
      B: Yaklaşık 1 alınarak birim esnek varsayılmıştır.
      D: (100/350)/(5/20) ≈ 1,43 veya benzer yanlış ortalama kullanılmıştır.
      E: (100/400)/(5/25)=2 alınmıştır; hem baz hem yöntem yanlıştır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Talep esnekliği (orta nokta / yay yöntemi)
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dQ = 300 - 400

      Qort = (400 + 300) / 2

      dP = 25 - 20

      Port = (20 + 25) / 2

      sonuc = round(abs((dQ / Qort) / (dP / Port)), 2)

      '
