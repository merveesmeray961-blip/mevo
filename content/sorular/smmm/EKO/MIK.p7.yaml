  kok: 'Bir malın talep fonksiyonu P = 80 − Q, arz fonksiyonu P = 20 + Q''dur. Piyasa dengesi oluştuktan sonra hükûmet birim
    başına 10 TL''lik bir satış vergisi koymuştur (vergi üreticiden alınmaktadır). Vergi sonrası ölü ağırlık kaybı (refah
    kaybı) kaç TL''dir?

    '
