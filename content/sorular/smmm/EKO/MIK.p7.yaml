  kok: 'Bir tüketici yalnız X malı tüketmektedir. X malının toplam fayda fonksiyonu TU = 40Q - 2Q² şeklindedir (Q miktar).
    X malının birim fiyatı 8 TL''dir. Tüketici faydasını maksimize etmek için kaç birim X malı tüketmelidir? (Paranın marjinal
    faydası 1 kabul edilecektir.)

    '
