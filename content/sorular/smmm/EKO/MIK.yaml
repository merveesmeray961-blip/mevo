- id: SMMM-EKO-MIK-0001
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Ekonomi
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Bir malın fiyatı 40 TL iken talep edilen miktarı 100 birimdir. Bu mala ilişkin talebin fiyat esnekliği katsayısı
    -2'dir (yüzde değişimler başlangıç değerleri esas alınarak hesaplanmaktadır). Diğer koşullar sabitken malın
    fiyatı 50 TL'ye yükseltilirse tüketicilerin bu mala yaptığı toplam harcama nasıl değişir?
  secenekler:
    A: 2.000 TL azalır.
    B: 1.500 TL azalır.
    C: Değişmez.
    D: 375 TL artar.
    E: 1.000 TL artar.
  dogru: B
  aciklama:
    dogru_neden: 'Talebin fiyat esnekliği, talep edilen miktardaki yüzde değişmenin fiyattaki yüzde değişmeye oranıdır;
      esneklik ve fiyattaki değişme verildiğinde miktardaki değişme geri hesapla bulunur. Fiyat %25 artmıştır ((50
      - 40) / 40); esneklik -2 olduğundan talep edilen miktar %25 x 2 = %50 azalır ve 100 birimden 50 birime düşer.
      Toplam harcama 40 x 100 = 4.000 TL''den 50 x 50 = 2.500 TL''ye iner, yani 1.500 TL azalır. Talep esnek (|e|
      > 1) olduğundan fiyat artışı toplam harcamayı azaltır. Tuzak: esnekliği ters kurmak ya da yalnız fiyat artışına
      bakıp harcamanın artacağını düşünmek.'
    hesap_adimlari:
    - 'Fiyattaki yüzde değişme: (50 - 40) / 40 = +%25'
    - 'Miktardaki yüzde değişme: -2 x %25 = -%50; yeni miktar 100 x 0,50 = 50 birim'
    - 'İlk harcama: 40 x 100 = 4.000 TL; yeni harcama: 50 x 50 = 2.500 TL'
    - 'Değişme: 2.500 - 4.000 = -1.500 TL (1.500 TL azalır)'
    celdiriciler:
      A: Yeni miktar (50 birim) doğru bulunmuş, ancak eski fiyatla çarpılmıştır (40 x 50 = 2.000 TL; 4.000 - 2.000
        = 2.000); yeni harcama yeni fiyatla hesaplanır (50 x 50 = 2.500 TL).
      C: Esneklik katsayısı eğim gibi kullanılarak miktar 2 x 10 = 20 birim azaltılmıştır (yeni miktar 80, harcama
        50 x 80 = 4.000 TL); esneklik mutlak değişmelerin değil yüzde değişmelerin oranıdır.
      D: Esneklik ters kurularak miktardaki azalma %25 / 2 = %12,5 bulunmuştur (yeni miktar 87,5; harcama 50 x 87,5
        = 4.375 TL); doğru azalma %25 x 2 = %50'dir.
      E: Talep edilen miktar 100 birimde sabit kabul edilip yalnız fiyat artışının etkisi hesaplanmıştır (100 x
        10); esnek talepte fiyat artışı miktarı fiyattan daha büyük oranda azaltır.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Talebin fiyat esnekliği ve toplam harcama (gelir) ilişkisi
    alinti: ''
  dogrulama:
    python: 'p0 = 40

      p1 = 50

      q0 = 100

      esneklik = -2

      yuzde_p = (p1 - p0) / p0

      q1 = q0 * (1 + esneklik * yuzde_p)

      degisim = p1 * q1 - p0 * q0

      sonuc = -degisim  # şıkta ''azalır'' olarak ifade edilen tutar

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: esneklik hesaplatmak yerine esneklik katsayısı verilip fiyat artışının toplam harcamaya
      etkisi soruluyor (geri hesap + iki adım); şıklar harcama değişimine göre yeniden yazıldı, doğru şık C → B;
      açıklama, çeldirici gerekçeleri, hesap adımları ve dogrulama.python yeniden yazıldı; zorluk 1 → 2; gecerlilik.baslangic
      2026-10-03 → 2026-01-01 (teori sorusu).'
    neden: 'Rötuş: GZ''de ortalama aday rahat çözdü (güven 4); MLY/EKO soruları kolay kalmıştı. Zorlaştırma §7 teknikleriyle
      (geri hesap, tipik hata çeldiricileri), SGS düzeyinde yapıldı.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) Hesap doğru: %25 fiyat artışı, %50 miktar düşüşü, 4.000 → 2.500 (1.500 azalır, B). Esneklik
          yorumu (başlangıç değerleri) kökte tanımlı; ark esnekliği belirsizliği kapatılmış. Çeldirici değerleri
          (2.000/0/375/1.000) tutarlı; tek cevap.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
- id: SMMM-EKO-MIK-0002
  sinav: smmm
  bolum:
  - SGS
  ders: EKO
  unite: Ekonomi
  konu: MIK
  kazanim: piyasa yapıları
  tip: kavrama
  zorluk: 1
  soru_bicimi: oncullu
  kok: 'Tam rekabet piyasasına ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Piyasadaki her firma fiyatı veri olarak kabul eder (fiyat kabul edicidir).

    II. Uzun dönem dengesinde firmalar yalnızca normal kâr elde eder; ekonomik kâr sıfırdır.

    III. Tek bir firmanın karşılaştığı talep eğrisi negatif eğimlidir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: Tam rekabet piyasasında çok sayıda küçük firma homojen mal üretir; hiçbir firma tek başına fiyatı
      etkileyemez ve piyasada oluşan fiyatı veri olarak kabul eder (I doğru). Piyasaya giriş ve çıkış serbest olduğundan
      kısa dönemdeki ekonomik kârlar yeni firmaların girişiyle ortadan kalkar; uzun dönem dengesinde firmalar yalnızca
      normal kâr elde eder (II doğru). Tek bir firmanın karşılaştığı talep eğrisi, piyasa fiyatı düzeyinde yatay
      (tam esnek) bir doğrudur; negatif eğimli olan piyasa talep eğrisidir (III yanlış).
    celdiriciler:
      A: Yalnız I eksiktir; uzun dönemde ekonomik kârın sıfırlanmasını ifade eden II de doğrudur.
      B: Yalnız II eksiktir; firmaların fiyat kabul edici olduğunu ifade eden I de doğrudur.
      D: III yanlıştır; tam rekabetçi firmanın talep eğrisi yataydır. Ayrıca doğru olan I dışarıda bırakılmıştır.
      E: III yanlış olduğundan üç öncülün tamamı doğru değildir; negatif eğimli talep eğrisi tekel ve tekelci rekabet
        gibi eksik rekabet piyasalarındaki firmalara özgüdür.
  kaynaklar:
  - mevzuat: İktisat teorisi — genel kabul görmüş tanım
    madde: Tam rekabet piyasası (fiyat kabul edici firma, uzun dönem dengesi)
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: gecerlilik.baslangic 2026-10-03 (üretim tarihi) → 2026-01-01 (yasal dayanağı olmayan teori sorusu).
    neden: 'Rötuş talimatı §3: üretim tarihi başlangıç olarak yazılmıştı.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
