- id: SMMM-FIN-ALC-0029
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Alacaklar ve senetler
  konu: ALC
  kazanim: senet yenileme ve iskonto
  tip: hesaplama
  zorluk: 3
  kok: İşletmenin vadesi gelen 20.000 TL alacak senedi, 2.000 TL faiz eklenerek yenilenmiştir. Yeni senedin nominal tutarı
    kaç TL’dir?
  secenekler:
    A: 18.000 TL
    B: 20.000 TL
    C: 22.000 TL
    D: 24.000 TL
    E: 26.000 TL
  dogru: C
  aciklama:
    dogru_neden: İşletmenin vadesi gelen 20.000 TL alacak senedi, 2.000 TL faiz eklenerek yenilenmiştir. Yeni senedin nominal
      tutarı kaç TL’dir? Verilen sayılarla işlem yapıldığında sonuç 22.000 TL olur.
    celdiriciler:
      A: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      B: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      D: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      E: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
    hesap_adimlari:
    - İşletmenin vadesi gelen 20.000 TL alacak senedi, 2.000 TL faiz eklenerek yenilenmiştir. Yeni senedin nominal tutarı
      kaç TL’dir?
    - 'Sonuç: 22.000 TL.'
  kaynaklar:
  - mevzuat: 1 Sıra No’lu Muhasebe Sistemi Uygulama Genel Tebliği
    madde: Tekdüzen Hesap Çerçevesi, Hesap Planı ve Hesap Planı Açıklamaları
    alinti: 'İşletmeler, muhasebe sistemlerini tekdüzen hesap çerçevesi ve hesap planı doğrultusunda

      kurmak zorundadır. Hesapların çalışması hesap planı açıklamalarında belirtildiği gibi

      gerçekleşir.


      A – TEKDÜZEN HESAP ÇERÇEVESİ


      Tekdüzen hesap çerçevesindeki he'
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 22000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kalite hakemi + bağımsız çözücü (kaynaklı): anahtarla aynı (güven 5).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_FIN.yaml, satır ChatGPT_FIN-2026-10-09-1-145 #2'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kalite hakemi + bağımsız çözücü (kaynaklı) anahtarla uyuştu
