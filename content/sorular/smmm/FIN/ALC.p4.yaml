- id: SMMM-FIN-ALC-0002
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: ALC
  kazanim: 'Teminatlı şüpheli alacak için karşılık ayrılması (129/654): karşılık yalnızca teminattan geri kalan
    kısım için'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: 'Giderlerini 7/A seçeneğine göre izleyen (T) A.Ş., 120 Alıcılar hesabında izlediği, (R) Ltd. Şti.''ne ait
    600.000 ₺ tutarındaki alacağı için 2026 yılında dava açmıştır. Alacak dava safhasında bulunduğundan şüpheli
    alacak niteliği kazanmış ve tamamı 128 Şüpheli Ticari Alacaklar hesabına aktarılmıştır. Dava sürerken (R) Ltd.
    Şti. 100.000 ₺ ödemiş, bu tutar 128 hesabından düşülmüştür. 31.12.2026 itibarıyla alacağın kalanı için (R) Ltd.
    Şti.''nin verdiği 200.000 ₺ değerinde ipotek teminatı bulunmaktadır. Vergi Usul Kanunu''ndaki şüpheli alacak
    karşılığı koşulları sağlanmıştır; şirket ayrılabilecek en yüksek karşılığı ayıracaktır. Alacak tutarları KDV
    hariçtir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    31.12.2026''da şüpheli alacak için ayrılacak karşılığa ilişkin kayıt aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 654 Karşılık Giderleri 300.000

      Alacak: 129 Şüpheli Ticari Alacaklar Karşılığı 300.000'
    B: 'Borç: 654 Karşılık Giderleri 400.000

      Alacak: 129 Şüpheli Ticari Alacaklar Karşılığı 400.000'
    C: 'Borç: 654 Karşılık Giderleri 500.000

      Alacak: 129 Şüpheli Ticari Alacaklar Karşılığı 500.000'
    D: 'Borç: 689 Diğer Olağandışı Gider ve Zararlar 300.000

      Alacak: 129 Şüpheli Ticari Alacaklar Karşılığı 300.000'
    E: 'Borç: 654 Karşılık Giderleri 300.000

      Alacak: 128 Şüpheli Ticari Alacaklar 300.000'
  dogru: A
  aciklama:
    dogru_neden: VUK md. 323 uyarınca, ticari ve zirai kazancın elde edilmesi ve idame ettirilmesi ile ilgili olmak
      şartıyla, dava safhasındaki alacaklar şüpheli alacak sayılır (kökte bu koşulların sağlandığı belirtilmiştir)
      ve bunlar için değerleme gününün tasarruf değerine göre karşılık ayrılabilir; teminatlı alacaklarda karşılık
      teminattan geri kalan miktara inhisar eder. 128 hesabında kalan alacak 600.000 − 100.000 = 500.000 ₺, teminat
      200.000 ₺'dir; karşılık 500.000 − 200.000 = 300.000 ₺'dir. THP 129'a göre hesaplanan karşılık tutarı 129 Şüpheli
      Ticari Alacaklar Karşılığı hesabına alacak, 654 Karşılık Giderleri hesabına borç kaydedilir.
    celdiriciler:
      B: '400.000 ₺: Alacağın tahsil edilen 100.000 ₺''lik kısmı dikkate alınmamıştır (600.000 − 200.000). Karşılık,
        dönem sonunda kalan alacak üzerinden hesaplanır.'
      C: '500.000 ₺: Teminat dikkate alınmamış, kalan alacağın tamamı için karşılık ayrılmıştır. Oysa VUK md. 323
        ve THP 129 uyarınca teminatlı alacakta karşılık teminattan geri kalan kısım için ayrılır.'
      D: 689 Diğer Olağandışı Gider ve Zararlar hesabı tutarı doğru olsa da yanlış gider hesabıdır; aktifle ilgili
        olarak ayrılan karşılık giderleri 654 Karşılık Giderleri hesabında izlenir (THP 129 ve 654). 689, başka
        hesapların kapsamına girmeyen olağandışı gider ve zararlar içindir.
      E: Karşılık, alacak hesabının (128) alacağına yazılarak alacaktan doğrudan düşülemez; THP 129'a göre karşılıklar
        ayrı bir düzenleyici hesap olan 129 Şüpheli Ticari Alacaklar Karşılığı hesabında izlenir.
    hesap_adimlari:
    - '128 hesabında kalan alacak: 600.000 − 100.000 = 500.000 ₺'
    - 'Teminattan geri kalan kısım: 500.000 − 200.000 = 300.000 ₺'
    - 'Kayıt: 654 Karşılık Giderleri B 300.000 / 129 Şüpheli Ticari Alacaklar Karşılığı A 300.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 323/1 (giriş cümlesi ve 1 numaralı bent)
    alinti: Ticari ve zirai kazancın elde edilmesi ve idame ettirilmesi ile ilgili olmak şartıyla; […] 1. […] Dava
      veya icra safhasında bulunan alacaklar; […] Şüpheli alacak sayılır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 323 (karşılık ve teminat)
    alinti: Yukarıda yazılı şüpheli alacaklar için değerleme gününün tasarruf değerine göre pasifte karşılık ayrılabilir.
      Bu karşılığın hangi alacaklara ait olduğu karşılık hesabında gösterilir. Teminatlı alacaklarda bu karşılık
      teminattan geri kalan miktara inhisar eder.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 129 Şüpheli Ticari Alacaklar Karşılığı (-)
    alinti: Teminatlı alacaklarda karşılık teminatı aşan kısım için ayrılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 129 Şüpheli Ticari Alacaklar Karşılığı (-) — İşleyişi
    alinti: Hesaplanan karşılık tutarı bu hesaba alacak, "654. Karşılık Giderleri" hesabına borç kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 654 Karşılık Giderleri (-)
    alinti: Aktifle ilgili olarak ayrılan karşılık giderlerinin izlendiği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 689 Diğer Olağandışı Gider ve Zararlar
    alinti: Yukarıda tanımlanan hesaplar kapsamı dışında kalan diğer olağan dışı gider ve zararlardan oluşur.
  dogrulama:
    python: 'kalan = 600000 - 100000

      sonuc = kalan - 200000

      '
    secenek_sayisi_bekleniyor: false
