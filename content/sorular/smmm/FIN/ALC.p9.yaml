- id: SMMM-FIN-ALC-0016
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Alacaklar ve senetler
  konu: ALC
  kazanim: senet yenileme ve iskonto
  tip: hesaplama
  zorluk: 1
  kok: Bir işletmenin 72.000 TL nominal değerli, vadesine 60 gün kalan ve yıllık faiz oranı %5 olan bir alacak senedi bulunmaktadır.
    Senette faiz oranı açıklandığından bu oran kullanılacaktır. Reeskont, basit faiz yöntemiyle nominal değer × yıllık faiz
    oranı × kalan gün / 360 formülüne göre hesaplanacaktır. Buna göre reeskont tutarı kaç TL'dir?
  secenekler:
    A: 500 TL
    B: 600 TL
    C: 700 TL
    D: 800 TL
    E: 900 TL
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 281''e göre senette faiz oranı açıklanmışsa bu oran esas alınır. Kökte verilen basit faiz reeskont
      formülüyle 72.000 × %5 × 60/360 = 600 TL bulunur. Püf noktaları: Resmî iskonto haddi ancak senette faiz oranı açıklanmamışsa
      devreye girer.'
    celdiriciler:
      A: 500 TL, 60 günlük süre veya faiz oranının eksik uygulanmasıyla elde edilen tipik bir düşük hesaplamadır.
      C: 700 TL, verilen nominal değer, oran ve gün sayısının birlikte yanlış çarpılmasıyla elde edilir.
      D: 800 TL, 60 günlük sürenin 360 günlük esasa yanlış çevrilmesi veya oran bazının hatalı alınması sonucudur.
      E: 900 TL, nominal tutara faiz tutarının yanlış bir dönemle uygulanması sonucu oluşan yüksek hesaplamadır.
    hesap_adimlari:
    - 72.000 × 0,05 = 3.600 TL yıllık faiz tutarı.
    - 3.600 × 60 / 360 = 600 TL reeskont.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 281
    alinti: Vadesi gelmemiş olan senede bağlı alacaklar değerleme gününün kıymetine irca olunabilir. Bu takdirde, senette
      faiz nispeti açıklanmış ise bu nispet, açıklanmamışsa Cumhuriyet Merkez Bankasının resmi iskonto haddi uygulanır.
  gecerlilik:
    baslangic: '1961-01-10'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 72000 * 0.05 * 60 / 360
