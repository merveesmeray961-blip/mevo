      altında veya ekte açıklanacağını düzenler. III ise sorumluluk ilişkisinin doğrudan ticari mal maliyeti olduğu sonucunu
      desteklemez. Püf noktaları: Akreditif teyidinde sorumluluk ilişkisinin bilanço dışı açıklama boyutunu, malın maliyetinden
      ayrı düşünün.'
