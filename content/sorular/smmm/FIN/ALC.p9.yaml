    A: '126 hesabı: 25.000 TL; 226 hesabı: 40.000 TL'
    B: '126 hesabı: 40.000 TL; 226 hesabı: 25.000 TL'
    C: '126 hesabı: 65.000 TL; 226 hesabı: 0 TL'
    D: '226 hesabı: 65.000 TL; 126 hesabı: 0 TL'
    E: '126 hesabı: 15.000 TL; 226 hesabı: 50.000 TL'
  dogru: A
  aciklama:
    dogru_neden: '25.000 TL''lik teminat 31 Aralık 2026''da geri alınacağından bir yıldan kısa vadelidir ve 126''da; 40.000
