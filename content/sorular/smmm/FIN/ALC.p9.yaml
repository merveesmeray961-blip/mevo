  kok: (E) A.Ş. 1 Mart 2026'da 40.000 TL depozito vermiştir. Depozitonun geri alınması 1 Ekim 2027'de beklenmektedir. Aynı
    gün işletme 25.000 TL tutarında, 31 Aralık 2026'da geri alınacak başka bir teminat vermiştir. Bu iki tutarın ilk kayıtta
    kullanılacak hesaplarının toplamı kaç TL'dir?
