      TL''dir. Püf noktaları: Sınıflandırmada işlem türü kadar vade de belirleyicidir.'
    celdiriciler:
      B: Kısa ve uzun vadeli tutarları ters sınıflandırmıştır.
      C: 126 toplamı 65.000 olamaz; 40.000 TL'lik tutarın vadesi bir yıldan uzundur.
      D: İki tutarın da uzun vadeli sayılması kaynak koşuluna aykırıdır.
      E: Tutarlar verilen vadelerden farklı bölünmüştür.
    hesap_adimlari:
    - 25.000 TL kısa vadeli → 126; 40.000 TL uzun vadeli → 226.
    - Toplam verilen depozito ve teminat = 25.000 + 40.000 = 65.000 TL.
