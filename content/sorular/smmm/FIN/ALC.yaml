- id: SMMM-FIN-ALC-0001
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: ALC
  kazanim: Karşılık ayrılmış şüpheli alacağın kısmen tahsili ve kalanının değersizleşmesi (128/129/644)
  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: '(A) Ticaret A.Ş., 2025 yılında hakkında icra takibi başlattığı bir müşterisinden olan 50.000 ₺ alacağı 128
    Şüpheli Ticari Alacaklar hesabına aktarmış ve alacağın tamamı için karşılık ayırmıştır. 2026 yılında bu alacağın
    20.000 ₺''si banka hesabına tahsil edilmiş, kalan kısmın tahsil edilemeyeceği ise kesinleşmiştir. KDV etkisi
    dikkate alınmayacaktır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    2026 yılında bu gelişmeler için yapılacak birleşik yevmiye kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 102 Bankalar 20.000

      Borç: 689 Diğer Olağandışı Gider ve Zararlar 30.000

      Alacak: 128 Şüpheli Ticari Alacaklar 50.000'
    B: 'Borç: 102 Bankalar 20.000

      Borç: 129 Şüpheli Ticari Alacaklar Karşılığı 30.000

      Alacak: 128 Şüpheli Ticari Alacaklar 50.000'
    C: 'Borç: 102 Bankalar 20.000

      Borç: 129 Şüpheli Ticari Alacaklar Karşılığı 50.000

      Alacak: 128 Şüpheli Ticari Alacaklar 50.000

      Alacak: 644 Konusu Kalmayan Karşılıklar 20.000'
    D: 'Borç: 102 Bankalar 20.000

      Borç: 129 Şüpheli Ticari Alacaklar Karşılığı 50.000

      Alacak: 128 Şüpheli Ticari Alacaklar 50.000

      Alacak: 671 Önceki Dönem Gelir ve Kârları 20.000'
    E: 'Borç: 102 Bankalar 20.000

      Borç: 654 Karşılık Giderleri 30.000

      Alacak: 128 Şüpheli Ticari Alacaklar 50.000'
  dogru: C
  aciklama:
    dogru_neden: THP 128'e göre alacağın tahsili veya tahsil edilemeyeceğinin kesinleşmesi durumunda 128 hesabı
      alacaklanır (toplam 50.000 ₺). THP 129'a göre tahmin olunan zararın gerçekleşmeyen kısmı (tahsil edilen 20.000
      ₺) karşılık hesabına borç yazılarak 644 Konusu Kalmayan Karşılıklar hesabına aktarılır; tahsili imkânsızlaşan
      30.000 ₺ için ise karşılık hesabı borçlandırılıp ilgili hesap alacaklandırılır, yeni gider yazılmaz. Böylece
      129'a toplam 50.000 ₺ borç, 644'e 20.000 ₺ alacak kaydedilir. Borç 70.000 = alacak 70.000.
    celdiriciler:
      A: Değersizleşen 30.000 ₺ için daha önce karşılık ayrıldığından ikinci kez gider (689) yazılamaz; ayrıca 129
        hesabı kapatılmamış, tahsil edilen kısma ait karşılık iptal edilmemiştir.
      B: Değersizleşen kısım için karşılık doğru kullanılmış, ancak tahsil edilen 20.000 ₺'ye ait karşılık 644'e
        aktarılmamış; 129 hesabında karşılığı kalmayan 20.000 ₺ bakiye kalır.
      D: Tahsil edilen kısma ait karşılığın iptali için THP özel olarak 644 Konusu Kalmayan Karşılıklar hesabını
        öngörür; 671 önceki dönemlere ait unutulmuş gelirler içindir.
      E: Karşılık zaten 2025'te 654 ile gider yazılmıştır; 654'ün tekrar borçlandırılması zararı iki kez gidere
        yansıtır ve 129 hesabını açık bırakır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 129 Şüpheli Ticari Alacaklar Karşılığı — İşleyişi
    alinti: Hesaplanan karşılık tutarı bu hesaba alacak, "654. Karşılık Giderleri" hesabına borç kaydedilir. Şüpheli
      alacağın tahsiline bağlı olarak, tahmin olunan zararın kısmen ya da tamamen gerçekleşmemesi halinde, gerçekleşmeyen
      kısım "644. Konusu Kalmayan Karşılıklar Hesabı" alacağına devredilerek bu hesaba borç kaydedilir. Şüpheli
      alacağın tahsilinin imkansız olduğu kesinleştiği takdirde bu hesaba borç, ilgili hesaba da alacak kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 128 Şüpheli Ticari Alacaklar — İşleyişi
    alinti: Tahsili şüpheli hale gelmiş olan alacaklar ilgili hesapların alacağı karşılığında bu hesaba borç yazılarak
      bu durumdaki alacaklar normal alacaklardan çıkarılır. Alacağın tahsili veya tahsil edilemeyeceğinin kesinleşmesi
      durumunda bu hesaba alacak kaydedilir.
