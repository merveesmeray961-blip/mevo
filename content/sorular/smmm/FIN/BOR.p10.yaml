- id: SMMM-FIN-BOR-0039
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Yabancı kaynaklar ve mali borçlar
  konu: BOR
  kazanim: bono ve tahvil ihracı (305/308/405/408)
  tip: hesaplama
  zorluk: 2
  kok: İşletme 100.000 TL nominal değerli tahvilleri 96.000 TL bedelle ihraç etmiştir. İhraç farkının tutarı kaç TL’dir?
  secenekler:
    A: 2.000 TL
    B: 4.000 TL
    C: 6.000 TL
    D: 96.000 TL
    E: 100.000 TL
  dogru: B
  aciklama:
    dogru_neden: İşletme 100.000 TL nominal değerli tahvilleri 96.000 TL bedelle ihraç etmiştir. İhraç farkının tutarı kaç
      TL’dir? Verilen sayılarla işlem yapıldığında sonuç 4.000 TL olur.
    celdiriciler:
      A: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      C: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      D: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
      E: Bu seçenek, ilgili hesabın işlevini yanlış geneller veya hesapların farklı niteliklerini birbirine karıştırır.
    hesap_adimlari:
    - İşletme 100.000 TL nominal değerli tahvilleri 96.000 TL bedelle ihraç etmiştir. İhraç farkının tutarı kaç TL’dir?
    - 'Sonuç: 4.000 TL.'
  kaynaklar:
  - mevzuat: 1 Sıra No’lu Muhasebe Sistemi Uygulama Genel Tebliği
    madde: Tekdüzen Hesap Çerçevesi, Hesap Planı ve Hesap Planı Açıklamaları
    alinti: 'İşletmeler, muhasebe sistemlerini tekdüzen hesap çerçevesi ve hesap planı doğrultusunda

      kurmak zorundadır. Hesapların çalışması hesap planı açıklamalarında belirtildiği gibi

      gerçekleşir.


      A – TEKDÜZEN HESAP ÇERÇEVESİ


      Tekdüzen hesap çerçevesindeki he'
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 100000 - 96000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kalite hakemi + bağımsız çözücü (kaynaklı): anahtarla aynı (güven 5).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_FIN.yaml, satır ChatGPT_FIN-2026-10-09-1-145 #82'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kalite hakemi + bağımsız çözücü (kaynaklı) anahtarla uyuştu
