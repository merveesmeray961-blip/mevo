  konu: BOR
  kazanim: finansman bonosu ihracında iskonto ve ihraç bedeli (305/308)
  tip: hesaplama
  zorluk: 1
  kok: KDV dikkate alınmayacaktır. PY A.Ş., nominal değeri 800.000 ₺ olan, 90 gün vadeli finansman bonosunu yıllık %36 basit
    iskonto oranıyla (yıl 360 gün alınacaktır) ihraç etmiş ve ihraç bedelini bankaya yatırmıştır. İşletmenin bankadan tahsil
    ettiği tutar kaç ₺'dir?
  secenekler:
    A: 512.000 ₺
    B: 728.000 ₺
    C: 728.986,30 ₺
    D: 800.000 ₺
    E: 872.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'İskonto = 800.000 × %36 × 90 / 360 = 72.000 ₺''dir. Bankadan tahsil edilen ihraç bedeli 800.000 − 72.000
      = 728.000 ₺''dir. Kayıt: 102 Bankalar 728.000 ₺ ve 308 Menkul Kıymetler İhraç Farkları 72.000 ₺ borç; 305 Çıkarılmış
      Bonolar ve Senetler 800.000 ₺ alacak.'
    celdiriciler:
      A: İskonto oranı vade gün sayısına göre oranlanmamış, yıllık oran vadenin tamamına uygulanmıştır.
      C: Yıl 365 gün alınmıştır; soruda yılın 360 gün alınacağı belirtilmiştir.
      D: Bonoların nominal değeridir; iskonto düşülmemiştir.
      E: İskonto nominal değere eklenmiştir; nominal değerin altında ihraçta iskonto düşülür.
    hesap_adimlari:
    - İskonto = 800.000 × 0.36 × 90 / 360 = 72.000
    - Bedel = 800.000 − 72.000 = 728.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek-5 Tekdüzen Hesap Planı Açıklamaları'
    madde: 305 Çıkarılmış Bonolar ve Senetler
    alinti: Tedavüldeki finansman bonoları ve banka bonoları gibi kısa vadeli para ve sermaye piyasası araçları karşılığında
      sağlanan fonlar bu hesapta izlenir.
  gecerlilik: &id001
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 800000 - 800000 * 0.36 * 90 / 360
  durum: kontrolde
  surum: 1
  uretim:
