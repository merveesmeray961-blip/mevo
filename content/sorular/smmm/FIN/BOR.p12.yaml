  kok: KDV dikkate alınmayacaktır. (K) A.Ş. aynı hesap dönemi içinde, 6 ay vadeli 12.000 ABD Doları tutarındaki banka kredisini
    kullandığı gün 1 USD = 30,50 ₺ iken 300 Banka Kredileri hesabına kaydetmiştir. Kredi, vadesinde 1 USD = 33,00 ₺ kuru ile
    bankadan havale edilerek ödenmiştir (faiz dikkate alınmayacaktır). Ödeme kaydı Tekdüzen Hesap Planı'na göre aşağıdakilerden
    hangisidir?
