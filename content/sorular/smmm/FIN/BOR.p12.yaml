      B: Yedek akçeler sınır hesabına katılmamıştır.
      C: Yeniden değerleme fonları sınır hesabına katılmamıştır; madde bu fonların da toplama katılacağını belirtir.
      E: Toplam ihraç sınırıdır; daha önce çıkarılmış senetlerin tutarı düşülmemiştir.
