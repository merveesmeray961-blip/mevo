- id: SMMM-FIN-BOR-0052
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Yabancı kaynaklar ve mali borçlar
  konu: BOR
  kazanim: finansman bonosu iskontosunun dönem sonunda 308 hesabında kalan kısmı
  tip: hesaplama
  zorluk: 2
  kok: KDV dikkate alınmayacaktır. KT A.Ş. 1 Aralık 2026 tarihinde nominal değeri 600.000 ₺ olan, 120 gün vadeli finansman
    bonosunu 564.000 ₺'ye ihraç etmiştir. Aradaki fark vade boyunca eşit olarak (günlük) itfa edilecektir; 31 Aralık 2026
    itibarıyla 30 gün geçmiştir. Dönem sonu itfa işlemi yapıldıktan sonra 308 Menkul Kıymetler İhraç Farkları hesabında kalan
    borç bakiyesi kaç ₺'dir?
  secenekler:
    A: 9.000 ₺
    B: 18.000 ₺
    C: 22.500 ₺
    D: 27.000 ₺
    E: 31.500 ₺
  dogru: D
  aciklama:
    dogru_neden: 'İskonto 600.000 − 564.000 = 36.000 ₺''dir; günlük itfa 36.000 / 120 = 300 ₺. 30 günlük itfa 9.000 ₺ olup
      66 grubundaki ilgili hesaba (660 Kısa Vadeli Borçlanma Giderleri) gider yazılır. 308 hesabında kalan bakiye 36.000 −
      9.000 = 27.000 ₺''dir. Püf noktaları: Bono vadesi bir yılın altında olduğundan iskonto doğrudan 308''de izlenir; dönem
      sonunda yalnızca geçen güne ait kısım gidere aktarılır, kalan bakiye 308''de kalır.'
    celdiriciler:
      A: Dönemde itfa edilen (66 grubuna aktarılan) tutardır; hesapta kalan bakiye değildir.
      B: İskontonun yarısı kalan sayılmıştır; vadenin yarısı geçmemiştir.
      C: 45 gün itfa edilmiş sayılmıştır; geçen süre 30 gündür.
      E: Dönem sonuna kadar yalnızca 15 gün itfa edilmiş sayılmıştır; 1 Aralık–31 Aralık arası 30 gündür.
    hesap_adimlari:
    - İskonto = 36.000
    - İtfa = 36.000 × 30 / 120 = 9.000
    - 308 bakiyesi = 36.000 − 9.000 = 27.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek-5 Tekdüzen Hesap Planı Açıklamaları'
    madde: 308 Menkul Kıymetler İhraç Farkları
    alinti: Nominal değerinin altında ihraç edilen tahvil, senet vs. diğer menkul kıymetlerin nominal değeri ile satış fiyatı
      arasındaki farkın gelecek döneme ait olan kısmı bu hesapta izlenir.
  gecerlilik: *id001
  dogrulama:
    python: sonuc = (600000 - 564000) - (600000 - 564000) * 30 / 120
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
          kaynakta doğrulandı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_A/FIN_BOR_20261111_1.yaml#2
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Kabul. Anahtar bağımsız çözümle uyumlu, tek doğru şık, açıklama tutarlı; madde/oran/hesap
      kaynakta doğrulandı.'
- id: SMMM-FIN-BOR-0053
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Yabancı kaynaklar ve mali borçlar
  konu: BOR
  kazanim: uzun vadeli tahvil ihraç farkının dönem sonunda 408'de kalan bakiyesi
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. ND A.Ş. 1 Temmuz 2026 tarihinde nominal değeri 3.000.000 ₺ olan, 48 ay vadeli tahvilleri
    2.760.000 ₺'ye ihraç etmiştir. İhraç farkı vade boyunca eşit aylık tutarlarla itfa edilecektir. 31 Aralık 2026'da dönem
    sonu işlemleri tamamlandığında (2026'ya ait itfa gidere yazılmış, izleyen yıla ait kısım 308 hesabına aktarılmıştır) 408
    Menkul Kıymetler İhraç Farkı hesabında kalan borç bakiyesi kaç ₺'dir?
  secenekler:
    A: 60.000 ₺
    B: 120.000 ₺
    C: 150.000 ₺
    D: 180.000 ₺
    E: 210.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'İhraç farkı 3.000.000 − 2.760.000 = 240.000 ₺, aylık itfa 240.000 / 48 = 5.000 ₺''dir. 2026''ya ait 6 ay:
      30.000 ₺ (661 hesabına gider); izleyen yıla ait 12 ay: 60.000 ₺ (408''den 308''e aktarılır). 408 hesabında kalan bakiye
      240.000 − 30.000 − 60.000 = 150.000 ₺''dir. Püf noktaları: Vadesi bir yılı aşan tahvilin ihraç farkı önce 408''e yazılır;
      dönem sonunda bir yıl içinde itfa edilecek kısım 308''e aktarılır, geçen döneme ait kısım ise gidere gider.'
    celdiriciler:
      A: 308 hesabına aktarılan izleyen yıl itfa payıdır; 408'de kalan bakiye değildir.
      B: İzleyen yıl için 12 yerine 18 aylık pay 308'e aktarılmış varsayılmıştır; yalnızca bilanço tarihinden itibaren bir
        yıl içindeki itfa 308'e aktarılır.
      D: Yalnızca izleyen yıla ait kısım düşülmüştür; 2026'da geçen aylık itfa da düşülmelidir.
      E: Yalnızca 2026'ya ait 6 aylık itfa düşülmüştür; izleyen yıla ait 60.000 ₺ 308 hesabına aktarıldığı için 408'de kalmaz.
    hesap_adimlari:
    - Aylık itfa = 240.000 / 48 = 5.000
    - 2026 itfası = 30.000; 308'e aktarılan = 60.000
    - 408 bakiyesi = 150.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek-5 Tekdüzen Hesap Planı Açıklamaları'
    madde: 408 Menkul Kıymetler İhraç Farkı
    alinti: Bu satış farklarında gelecek dönemde itfa edilecek kısmı bilanço tarihinde "308. Menkul Kıymetler İhraç Farkı
      Hesabı"na aktarılarak bu hesaba alacak kaydedilir.
  gecerlilik: *id001
  dogrulama:
    python: sonuc = (3000000 - 2760000) - (3000000 - 2760000) / 48 * 6 - (3000000 - 2760000) / 48 * 12
