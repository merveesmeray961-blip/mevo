    dogru_neden: 'Kredi 12.000 × 30,50 = 366.000 ₺ ile kaydedilmişti; ödeme anındaki tutar 12.000 × 33,00 = 396.000 ₺''dir.
      30.000 ₺''lik kur farkı zararı, borçlanma ile ilgili olduğundan 656 Kambiyo Zararları''na değil, bir yıla kadar vadeli
      olduğu için 660 Kısa Vadeli Borçlanma Giderleri hesabına borç yazılır. Püf noktaları: Yabancı para borçlanmanın kur
      farkı kambiyo hesaplarına değil, finansman giderine gider: vade bir yıla kadarsa 660, bir yılı aşıyorsa 661.'
    celdiriciler:
      B: 300 hesabı kayıtlı değeriyle (366.000 ₺) kapatılır; 30.000 ₺'lik kur farkı ayrıca kaydedilmelidir, aksi halde kaydın
        tutarları kayıtlı borçla uyuşmaz.
      C: 656 hesap açıklamasına göre borçlanma ile ilgili kur farkları kambiyo zararlarına alınmaz, finansman gideri olarak
        muhasebeleştirilir.
