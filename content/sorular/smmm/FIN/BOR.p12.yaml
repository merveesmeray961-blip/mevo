      A: 303'e 14 taksit aktarılmış sayılmıştır; bilanço tarihinden itibaren bir yıl içinde 12 taksit ödenecektir.
      B: Ödenen taksit sayısı 9 alınmıştır; 1 Mayıs–1 Aralık arası 8 taksit ödenmiştir.
      D: 303'e yalnızca 10 taksit aktarılmış sayılmıştır; 2027'de 12 taksit ödenecektir.
      E: Ödenmiş taksitler düşülmemiştir; yalnızca 303'e aktarılan tutar çıkarılmıştır.
    hesap_adimlari:
    - Ödenen = 8 × 50.000 = 400.000
    - Kalan anapara = 2.000.000
    - 303'e aktarılan = 12 × 50.000 = 600.000
    - 400 bakiyesi = 1.400.000
