  kok: KDV dikkate alınmayacaktır. ER A.Ş. 1 Nisan 2026 tarihinde 2.400.000 ₺ tutarında, 48 ay vadeli uzun vadeli banka kredisi
    kullanmıştır. Anapara her ayın 1'inde ödenen eşit 50.000 ₺'lik taksitlerle geri ödenecek, ilk taksit 1 Mayıs 2026'da ödenmiştir.
    Taksitler zamanında ödenmiş olup faiz dikkate alınmayacaktır. 31 Aralık 2026 bilançosunda 303 Uzun Vadeli Kredilerin Anapara
    Taksitleri ve Faizleri hesabına aktarma yapıldıktan sonra 400 Banka Kredileri hesabında kalan bakiye kaç ₺'dir?
