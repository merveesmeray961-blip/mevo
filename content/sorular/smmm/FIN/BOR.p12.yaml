    verdiği yeniden değerleme fonları 500.000 ₺'dir. Şirket tarafından daha önce çıkarılmış ve dolaşımda bulunan borçlanma
    senetlerinin toplam tutarı 2.800.000 ₺'dir. 6102 sayılı Türk Ticaret Kanunu'nun 506 ncı maddesindeki sınır dikkate alınırsa
    şirket en fazla kaç ₺ tutarında yeni borçlanma senedi çıkarabilir? (Sermaye Piyasası Kanunu istisnaları dikkate alınmayacaktır.)
