    B: 1.350.000 ₺
    C: 1.400.000 ₺
    D: 1.500.000 ₺
    E: 1.800.000 ₺
  dogru: C
  aciklama:
    dogru_neden: '1 Mayıs–1 Aralık 2026 arasında 8 taksit (400.000 ₺) ödenmiştir; kalan anapara 2.400.000 − 400.000 = 2.000.000
      ₺''dir. Bilanço tarihinden itibaren bir yıl içinde 12 taksit (600.000 ₺) ödeneceğinden bu tutar 303''e aktarılır (400
