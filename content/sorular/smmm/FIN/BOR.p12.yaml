    C: 300 Banka Kredileri 366.000 ₺ borç, 656 Kambiyo Zararları 30.000 ₺ borç / 102 Bankalar 396.000 ₺ alacak
    D: 300 Banka Kredileri 366.000 ₺ borç, 661 Uzun Vadeli Borçlanma Giderleri 30.000 ₺ borç / 102 Bankalar 396.000 ₺ alacak
    E: 300 Banka Kredileri 396.000 ₺ borç / 102 Bankalar 366.000 ₺ alacak, 646 Kambiyo Karları 30.000 ₺ alacak
