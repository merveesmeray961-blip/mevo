    D: 3.200.000 ₺
    E: 6.000.000 ₺
  dogru: D
  aciklama:
    dogru_neden: 'TTK md. 506/1''e göre 504 ve 505 inci maddelere bağlı borçlanma senetlerinin toplam tutarı sermaye ile bilançodaki
      yedek akçelerin toplamını aşamaz; yeniden değerleme fonları da toplama katılır. Sınır 4.000.000 + 1.500.000 + 500.000
      = 6.000.000 ₺; daha önce çıkarılan 2.800.000 ₺ düşüldüğünde yeni ihraç edilebilecek azami tutar 3.200.000 ₺''dir. Püf
      noktaları: Sınır, çıkarılan tüm senetlerin toplamı için geçerlidir; bu yüzden mevcut tutar sınırdan düşülür. Yeniden
      değerleme fonu ve yedek akçe toplama dahildir.'
