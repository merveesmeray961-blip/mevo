    bankaya yatırılmıştır. İskonto tutarının tamamı gelecek döneme aittir. Aksi belirtilmedikçe Tekdüzen Hesap Planı esas
    alınacak ve KDV dikkate alınmayacaktır. İşletmenin ihraç anında yapacağı kayıt aşağıdakilerden hangisidir?
