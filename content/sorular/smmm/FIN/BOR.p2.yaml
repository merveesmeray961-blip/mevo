- id: SMMM-FIN-BOR-0041
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Yabancı kaynaklar ve mali borçlar
  konu: BOR
  kazanim: banka kredileri ve faiz tahakkuku
  tip: hesaplama
  zorluk: 2
  kok: AB İşletmesi 1 Kasım 2026 tarihinde bankadan 3 ay vadeli 300.000 ₺ tutarında, yıllık %48 faizli kredi kullanmıştır.
    Faiz vade sonunda ana para ile birlikte ödenecektir. Yıl 360 gün, ay 30 gün kabul edilerek 31 Aralık 2026 itibarıyla bu
    krediye ilişkin cari döneme düşen faiz tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: 12.000 ₺
    B: 24.000 ₺
    C: 36.000 ₺
    D: 144.000 ₺
    E: 324.000 ₺
  dogru: B
  aciklama:
    dogru_neden: Faiz, bir yıla kadar vadeli borçlanma gideri olarak THP 660'ta izlenir. Cari döneme düşen süre 1 Kasım -
      31 Aralık = 60 gündür. Faiz = 300.000 × 0,48 × 60 / 360 = 24.000 ₺'dir.
    celdiriciler:
      A: 12.000 ₺ yalnızca bir ayın (30 gün) faizidir; 1 Kasım - 31 Aralık arası iki aydır.
      C: 36.000 ₺ vadenin tamamı olan üç ayın (90 gün) faizidir; cari döneme yalnızca iki ay isabet eder.
      D: 144.000 ₺ bir yıllık faizdir (300.000 × %48).
      E: 324.000 ₺ anapara ile cari dönem faizinin toplamıdır (300.000 + 24.000); sorulan yalnızca faiz tutarıdır.
    hesap_adimlari:
    - 'Cari döneme düşen süre: 60 gün'
    - 'Faiz: 300.000 × 0,48 × 60 / 360 = 24.000 ₺'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 660 Kısa Vadeli Borçlanma Giderleri
    alinti: Bir yıla kadar vadeli olan borçlanmalarla ilgili olarak yüklenilen ve varlıkların maliyetine eklenmeyen faiz ve
      benzeri diğer giderlerin izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 300 Banka Kredileri
    alinti: Alınan kısa vadeli krediler bu hesaba alacak, ödenmeleri halinde borç kaydedilir.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 300000 * 0.48 * 60 / 360
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: gecti
        not: dogrulama.python doğru şıkla tuttu
        tarih: '2026-11-02'
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) duzelt: E çeldirici açıklaması yanlış: 324.000 ₺ anapara + bir yıllık faiz (444.000) değil,
          anapara + cari dönem faizidir (300.000 + 24.000). Anahtar (B) doğru.'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-02'
    kim: uretici
    ne: harici teslim FIN_BOR_20261102_1.yaml, satır None
  - tarih: '2026-11-02'
    kim: asistan
    ne: toplu kabul denetimi geçti → kontrolde
  - tarih: '2026-11-02'
    kim: asistan
    ne: 'otomatik kapı: doğru şıkta tek bir sayısal değer okunamadı'
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) duzelt: E çeldirici açıklaması yanlış: 324.000 ₺ anapara + bir yıllık faiz (444.000) değil,
      anapara + cari dönem faizidir (300.000 + 24.000). Anahtar (B) doğru.'
