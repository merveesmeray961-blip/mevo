      B: 408 vadesi bir yılı aşan menkul kıymetlerin ihraç farkıdır; 90 günlük bono için 308 kullanılır.
      C: Gelecek döneme ait iskonto ihraç anında gider yazılmaz; 308 hesabında izlenir ve vadeye yayılarak itfa edilir.
      E: 405 vadesi bir yılı aşan tahviller içindir; kısa vadeli bono 305'te izlenir.
