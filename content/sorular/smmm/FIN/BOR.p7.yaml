    ihraç etmiştir. 31.12.2026 itibarıyla ihraç iskontosunun gelecek yıllara ait kısmı 30.000 TL'dir. Tekdüzen Hesap Planına
    göre aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: 405 hesaba 960.000 TL alacak, 408 hesaba 40.000 TL borç kaydedilir.
    B: 405 hesaba 1.000.000 TL alacak, 408 hesaba 40.000 TL borç kaydedilir.
    C: 405 hesaba 1.000.000 TL borç, 408 hesaba 30.000 TL alacak kaydedilir.
    D: 308 hesaba 40.000 TL borç, 405 hesaba 960.000 TL alacak kaydedilir.
    E: 405 hesaba 960.000 TL alacak, 308 hesaba 40.000 TL alacak kaydedilir.
  dogru: B
  aciklama:
    dogru_neden: 405 Çıkarılmış Tahviller nominal bedel üzerinden alacaklandırılır. Nominal değer ile satış fiyatı arasındaki
      40.000 TL fark, uzun vadeye ait kısmı 408 Menkul Kıymetler İhraç Farkı hesabında izlenir ve 408 borçlandırılır.
    celdiriciler:
      A: Tahvil borcu nominal bedel üzerinden kaydedilir; 960.000 TL satış bedeli 405'in nominal kaydının yerine geçmez.
      C: 405 hesabının yönü ve 408'in yönü ters kurulmuştur.
      D: Uzun vadeli ihraç farkı 408'de izlenir; 308 kısa vadeli gelecek dönem kısmı içindir.
      E: İhraç farkı 408'de borç, 405 tahvil hesabında nominal bedel üzerinden alacak çalışır.
    hesap_adimlari:
    - Nominal değer = 1.000.000 TL
    - İhraç farkı = 1.000.000 − 960.000 = 40.000 TL
    - Gelecek yıllara ait ihraç farkı 31.12.2026'da 30.000 TL olduğundan 408'de izlenir
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 405 Çıkarılmış Tahviller
