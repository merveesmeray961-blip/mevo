- id: SMMM-FIN-BOR-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Yabancı kaynaklar ve mali borçlar
  konu: BOR
  kazanim: kur farkı
  tip: hesaplama
  zorluk: 3
  kok: (F) A.Ş., 1 Ekim 2026'da 50.000 USD tutarında banka kredisi kullanmış ve krediyi 1 USD = 32 TL kurundan 300 Banka Kredileri
    hesabına kaydetmiştir. 31 Aralık 2026'da kredi tamamen ödenmemiştir ve bilanço günü kuru 35 TL'dir. Faiz dikkate alınmayacaktır.
    Buna göre dönem sonu değerlemesinde oluşan kur farkının tutarı ve kaydedileceği sonuç hesabı hangisidir?
  secenekler:
    A: 150.000 TL; 656 Kambiyo Zararları
    B: 150.000 TL; 780 Finansman Giderleri
    C: 100.000 TL; 780 Finansman Giderleri
    D: 50.000 TL; 780 Finansman Giderleri
    E: 150.000 TL; 646 Kambiyo Kârları
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 280 yabancı para borçların da değerleme hükümlerine tabi olduğunu belirtir. 50.000 USD × (35−32)
      = 150.000 TL kur farkıdır. MSUGT''de borçlanma ile ilgili kur farklarının 656 Kambiyo Zararları hesabına alınmayıp finansman
      gideri olarak muhasebeleştirileceği belirtilmiştir. Bu nedenle sonuç 780 Finansman Giderleri''dir. Püf noktaları: Tutarı
      bulmak tek başına yeterli değildir; borçlanmaya ilişkin kur farkının 656 yerine finansman gideri olarak sınıflandırılması
      ikinci adımdır.'
    celdiriciler:
      A: Tutar doğru olsa da borçlanma ile ilgili kur farkının 656'ya alınmaması gerekir.
      C: Kur farkı yalnız 3 TL değil, 32 TL kayıtlı kurdan 35 TL bilanço kuruna kadar olan 3 TL farkın 50.000 USD ile çarpılmasıdır.
      D: Kur farkı 1 TL kabul edilerek hesaplanmıştır.
      E: Borç yükseldiği için kâr değil zarar oluşur; ayrıca borçlanma kur farkı finansman gideridir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 280
    alinti: 'Yabancı paralar borsa rayici ile değerlenir. Borsa rayicinin takarrüründe muvazaa olduğu anlaşılırsa bu rayiç
      yerine alış bedeli esas alınır. Yabancı paranın borsada rayici yoksa, değerlemeye uygulanacak kur Maliye Bakanlığınca
      tesbit olunur. (Değişik: 22/7/1998-4369/7 md.) Bu madde hükmü yabancı para ile olan senetli veya senetsiz alacaklar
      ve borçlar hakkında da caridir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 656. Kambiyo Zararları
    alinti: Kambiyo zararlarının izlendiği hesaptır. (Borçlanma ile ilgili kur farkları bu hesaba alınmaz, finansman gideri
      olarak muhasebeleştirilir.)
  gecerlilik:
