  tip: kavrama
  zorluk: 2
  kok: 'Bir işletme aynı tarihte iki finansman aracı ihraç etmiştir: 6 ay vadeli finansman bonosu ve vadesine 20 ay kalan,
    nominal değerinin altında ihraç edilmiş tahvil. Aşağıdaki öncüllerden hangileri doğrudur?

    I. 6 ay vadeli finansman bonosu 305 hesapta izlenir.

    II. Vadesi bir yılı aşan tahvil 405 hesapta izlenir.

    III. Nominal değer ile satış fiyatı arasındaki gelecek yıllara ait fark 408 hesapta izlenebilir.'
