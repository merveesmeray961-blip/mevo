    dogru_neden: '305 kısa vadeli finansman bonosu ve banka bonosu gibi araçları; 405 vadesi bir yılı aşan tahvilleri; 408
      ise nominal değerinin altında ihraç edilen tahvil ve benzeri araçların gelecek yıllara ait ihraç farkını izler. Bu nedenle
      üç öncül de doğrudur. Püf noktaları: 305/405 ayrımında esas belirleyici vade, 408''de ise nominal değer ile satış fiyatı
      arasındaki farktır.'
    celdiriciler:
      A: II ve III de doğrudur; 305 yalnız I'i açıklamaz.
      B: II doğrudur ancak I ve III de kaynakla uyumludur.
      C: III de doğru olduğu için yalnız I-II seçeneği eksiktir.
      D: I de doğru olduğundan yalnız II-III seçeneği eksiktir.
