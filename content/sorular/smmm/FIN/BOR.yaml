  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: dogru_neden'de 'üç teknik' ifadesi sayılan teknik sayısıyla tutarlı hâle getirildi ('dört teknik'); 7/A'da
      finansman giderinin 780'e yazılıp 781 aracılığıyla 66 grubuna aktarıldığı THP 66/660 açıklamasıyla eklendi
      ve kaynaklara alıntılandı; baslangic 1994-01-01.
    neden: 'G5 (küçük): teknik sayısı tutarsızdı; G6 (küçük): 7/A–781 cümlesi kaynaklarda yoktu; baslangic üretim
      tarihiydi.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: Gerekçe ve hesap adımları THP 408/308 işleyişine göre düzeltildi (308 B 60.000 / 408 A 60.000; 780 B 30.000
      / 308 A 30.000); 781 → 661 notu ve 661 alıntısı eklendi; teknik not 'Püf noktaları:' biçimine getirildi. Birleşik
      kayıt (D) değişmedi.
    neden: 'Bağımsız hakem bulgusu (3 Ekim 2026, no. 1): 408''e alacak yalnız 308''e aktarmayla yazılır.'
