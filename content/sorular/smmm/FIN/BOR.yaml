- id: SMMM-FIN-BOR-0001
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: BOR
  kazanim: İskontolu tahvil ihracı — ihraç farkının itfası ve kısa vadeye aktarılması (405/408/308)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: yevmiye
  kok: 'Giderlerini 7/A seçeneğine göre izleyen (B) A.Ş. ile ilgili bilgiler şöyledir:


    - 01.01.2026 tarihinde 3 yıl vadeli (vade 31.12.2028), kuponsuz tahviller nominal 900.000 ₺ üzerinden 810.000
    ₺''ye ihraç edilmiştir.

    - İhraç kaydında 405 Çıkarılmış Tahviller hesabına 900.000 ₺ alacak, ihraç farkının tamamı (90.000 ₺) 408 Menkul
    Kıymetler İhraç Farkı hesabına borç yazılmış; aracı kuruma ödenen 4.000 ₺ komisyon ihraç tarihinde 780 Finansman
    Giderleri hesabına kaydedilmiştir.

    - İhraç farkı vade boyunca eşit tutarlarla itfa edilmektedir; yıl içinde bu tahvillerle ilgili başka kayıt yapılmamıştır.


    Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır. 31.12.2026 tarihinde ihraç farkıyla ilgili yapılması
    gereken birleşik dönem sonu kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 780 Finansman Giderleri 30.000

      Alacak: 408 Menkul Kıymetler İhraç Farkı 30.000'
    B: 'Borç: 780 Finansman Giderleri 90.000

      Alacak: 408 Menkul Kıymetler İhraç Farkı 90.000'
    C: 'Borç: 780 Finansman Giderleri 30.000

      Borç: 308 Menkul Kıymetler İhraç Farkları 60.000

      Alacak: 408 Menkul Kıymetler İhraç Farkı 90.000'
    D: 'Borç: 780 Finansman Giderleri 30.000

      Borç: 308 Menkul Kıymetler İhraç Farkları 30.000

      Alacak: 408 Menkul Kıymetler İhraç Farkı 60.000'
    E: 'Borç: 780 Finansman Giderleri 30.000

      Borç: 308 Menkul Kıymetler İhraç Farkları 30.000

      Borç: 405 Çıkarılmış Tahviller 900.000

      Alacak: 408 Menkul Kıymetler İhraç Farkı 60.000

      Alacak: 304 Tahvil Anapara Borç, Taksit ve Faizleri 900.000'
  dogru: D
  aciklama:
    dogru_neden: 'Soru dört tekniği birleştirir: çok adımlı hesap, madde birleştirme (THP 308, 405, 408 ve 66/660
      açıklamaları), yakın kavram ayrımı (408/308 ve 405/304) ve gereksiz veri (komisyon). İhraç farkı 900.000 −
      810.000 = 90.000 ₺, yıllık itfa 90.000 / 3 = 30.000 ₺. (1) 2026 payı 30.000 ₺ finansman giderdir; THP 660
      açıklamasına göre 7. grupta izlenen finansman giderleri 7/A seçeneğinde 781 Finansman Giderleri Yansıtma Hesabı
      aracılığıyla 66 grubuna aktarıldığından gider önce 780''e borç, 408''e alacak yazılır. (2) THP 408''e göre
      farkın gelecek dönemde itfa edilecek kısmı (2027 payı 30.000 ₺) bilanço tarihinde 308''e aktarılır: 308 borç,
      408 alacak. 408''de yalnızca 2028 payı (30.000 ₺) kalır. Tuzaklar: kalan farkın tamamını kısa vadeye almak
      ve anaparayı erken sınıflandırmak. Tahvillerin vadesine 31.12.2026''da 2 yıl kaldığından anapara 405''te kalır.
      Komisyon ihraçta giderleştirildiği için hesaplamayı etkilemez.'
    celdiriciler:
      A: Yalnızca 2026 itfası yapılmış, 2027'de itfa edilecek 30.000 ₺'nin THP 408 uyarınca bilanço tarihinde 308'e
        aktarılması unutulmuştur.
      B: İhraç farkının tamamı ilk yıl gider yazılmıştır; fark tahvilin vadesine paralel olarak 3 yılda itfa edilir.
      C: 2028 yılına ait 30.000 ₺ de kısa vadeye (308) aktarılmıştır; 308'e yalnızca izleyen yıl itfa edilecek kısım
        alınır, daha sonraki yıllara ait kısım 408'de kalır.
      E: İhraç farkı kısmı doğrudur, ancak anapara 304'e aktarılmıştır; 405'ten 304'e yalnızca bilanço tarihinden
        itibaren bir yıl içinde ödenecek tutar aktarılır, oysa tahvillerin vadesine iki yıl vardır.
    hesap_adimlari:
    - İhraç farkı = 900.000 − 810.000 = 90.000 ₺; yıllık itfa = 90.000 / 3 = 30.000 ₺
    - '2026 itfası: 780 B 30.000 / 408 A 30.000'
    - '2027 payının kısa vadeye aktarılması: 308 B 30.000 / 408 A 30.000'
    - 'Birleşik kayıt: 780 B 30.000 + 308 B 30.000 = 408 A 60.000; 408''de 2028 payı 30.000 ₺ kalır'
    - 'Anapara: vadeye 2 yıl kaldığından 405''ten 304''e aktarma yapılmaz; 4.000 ₺ komisyon gereksiz veridir'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 408 Menkul Kıymetler İhraç Farkı — İşleyişi
    alinti: Nominal değerinin altında ihraç edilen tahvil, senet ve diğer menkul kıymetlerin nominal değeri ile
      satış fiyatı arasındaki fark bu hesabın borcuna kaydedilir. Bu satış farklarında gelecek dönemde itfa edilecek
      kısmı bilanço tarihinde "308. Menkul Kıymetler İhraç Farkı Hesabı"na aktarılarak bu hesaba alacak kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 308 Menkul Kıymetler İhraç Farkları — İşleyişi
    alinti: Nominal değerin altında ihraç edilen tahvil, senet vs. diğer menkul kıymetlerin nominal değeri ile satış
      fiyatı arasındaki farklardan gelecek döneme ait olanlar ve "408. Menkul Kıymetler İhraç Farkı Hesabı"ndan
      bu hesaba aktarılanlar bu hesabın borcuna, menkul kıymetin vadesine paralel olarak itfa edilmesi kaydıyla
      hesaplanan itfa tutarları, "66. Finansman Giderleri" grubundaki hesaplar karşılığında bu hesaba alacak kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 405 Çıkarılmış Tahviller — İşleyişi; 780 Finansman Giderleri
    alinti: '405: Çıkarılmış tahviller nominal bedelleri ile bu hesaba alacak kaydedilir. Bilanço tarihinden itibaren
      bir yıl içinde ödenecek tahvil, anapara borç ve taksitleri bilanço dönemlerinde "304. Tahvil Anapara, Borç,
      Taksit ve Faizleri Hesabına" aktarılmak suretiyle bu hesaba borç kaydedilir. 780: İşletme faaliyetlerinin
      aksamadan yürütülebilmesi amacıyla borçlanılan tutarlarla ilgili faiz, kur farkları, komisyon ve benzeri giderler
      bu hesaba borç kaydedilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 66 Finansman Giderleri (grup açıklaması); 660 Kısa Vadeli Borçlanma Giderleri
    alinti: '66: İşletmenin borçlandığı tutarlarla ilgili olarak katlanılan ve varlıkların maliyetine eklenmemiş
      bulunan faiz, kur farkları, kredi komisyonları ve benzeri diğer giderleri kapsar. 660: [...] 7. grupta izlenen
      finansman giderleri 7/A seçeneğinde "781- Finansman Giderleri Yansıtma Hesabı" 7/B seçeneğinde ise "798- Gider
      Çeşitleri Yansıtma Hesabı"nın alacağı ile bu hesabın borcuna aktarılır.'
  dogrulama:
    python: 'fark = 900000 - 810000

      yillik = fark / 3

      gider_2026 = yillik

      kisa_vadeye = yillik

      assert gider_2026 == 30000

      # ana tutar: 408 hesabına toplam alacak

      sonuc = gider_2026 + kisa_vadeye

      '
    secenek_sayisi_bekleniyor: false
