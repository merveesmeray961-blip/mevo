  kazanim: 'Peşin tahsil edilen çok yıllık kira — dönem sonu erteleme kaydı: 380 Gelecek Aylara Ait Gelirler ve 480 Gelecek
    Yıllara Ait Gelirler ayrımı'
  tip: hesaplama
  zorluk: 3
  soru_bicimi: yevmiye
  kok: 'Giderlerini 7/A seçeneğine göre izleyen ve esas faaliyet konusu gayrimenkul kiralama olmayan (Y) A.Ş., atıl durumdaki
    deposunu 1 Temmuz 2026 tarihinde 24 ay süreyle kiraya vermiş ve 24 aylık kira bedelinin tamamı olan 240.000 ₺''yi peşin
    tahsil etmiştir. Tahsilat tarihinde tutarın tamamı 649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilmiştir. Hesap
    dönemi takvim yılıdır; kira bedeli aylara eşit dağıtılacaktır ve KDV dikkate alınmayacaktır. Aksi belirtilmedikçe Tekdüzen
    Muhasebe Sistemi esas alınır.


    31.12.2026 tarihinde yapılması gereken dönem sonu düzeltme kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 649 Diğer Olağan Gelir ve Karlar 180.000

      Alacak: 380 Gelecek Aylara Ait Gelirler 180.000'
    B: 'Borç: 649 Diğer Olağan Gelir ve Karlar 180.000

      Alacak: 380 Gelecek Aylara Ait Gelirler 120.000

      Alacak: 480 Gelecek Yıllara Ait Gelirler 60.000'
    C: 'Borç: 649 Diğer Olağan Gelir ve Karlar 180.000

      Alacak: 380 Gelecek Aylara Ait Gelirler 60.000

      Alacak: 480 Gelecek Yıllara Ait Gelirler 120.000'
    D: 'Borç: 649 Diğer Olağan Gelir ve Karlar 240.000

      Alacak: 380 Gelecek Aylara Ait Gelirler 120.000

      Alacak: 480 Gelecek Yıllara Ait Gelirler 120.000'
    E: 'Borç: 649 Diğer Olağan Gelir ve Karlar 120.000

      Alacak: 380 Gelecek Aylara Ait Gelirler 120.000'
  dogru: B
  aciklama:
    dogru_neden: 'Aylık kira 240.000 / 24 = 10.000 ₺''dir. 1 Temmuz–31 Aralık 2026 arasındaki 6 ay (60.000 ₺) 2026 gelirine
      aittir; kalan 18 ay (180.000 ₺) peşin tahsil edilmiş ve cari dönem gelirine kaydedilmemesi gereken gelirdir. THP 380''e
      göre bir yıldan kısa süreye ait kısım 380 Gelecek Aylara Ait Gelirler''de, THP 480''e göre bir yıldan uzun süreye ait
      kısım 480 Gelecek Yıllara Ait Gelirler''de izlenir. Bilanço tarihinden (31.12.2026) sonraki ilk 12 ay (2027) için 120.000
      ₺ 380''e, 2028''in Ocak–Haziran dönemine ait 6 ay için 60.000 ₺ 480''e alacak yazılır; tahsilatta tamamı 649''a alacak
      yazıldığından 649 hesabına 180.000 ₺ borç kaydedilir.


      Püf noktaları: Tahsil edilen 24 aylık kira üç parçaya bölünür: 2026''ya ait 6 ay gelirde kalır, bilanço tarihinden sonraki
      ilk 12 ay 380''e, daha sonraki 6 ay 480''e gider. Sınır, kira başlangıç tarihinden değil bilanço tarihinden itibaren
      bir yıldır. Bu yüzden 380/480 ayrımını ilk 12 ay / ikinci 12 ay diye (kira süresine göre) yapmak veya 2026''ya ait kısmı
      da ertelemek yanlış sonuç verir.'
    celdiriciler:
      A: Kalan 18 ayın tamamı 380'e alınmıştır; oysa bilanço tarihinden itibaren bir yıldan uzun süreye ait 60.000 ₺ (2028
        Ocak–Haziran) THP 480'e göre 480 Gelecek Yıllara Ait Gelirler'de izlenir.
      C: '380 ve 480 tutarları ters yazılmıştır: bilanço tarihinden itibaren ilk 12 ay (2027) 120.000 ₺ olup 380''de, sonrası
        60.000 ₺ olup 480''de izlenir.'
      D: 24 ayın ilk 12 ayı 380'e, ikinci 12 ayı 480'e yazılmıştır ve 2026'ya ait 6 aylık kısım da gelirden çıkarılmıştır.
        Kiranın 6 ayı (60.000 ₺) 31.12.2026'ya kadar kazanılmış olup 649'da kalır; ertelenecek tutar 180.000 ₺'dir.
      E: Yalnızca 2027'ye ait 12 aylık kısım ertelenmiş, 2028'e ait 60.000 ₺ gelir 2026 gelirinde bırakılmıştır. Bilanço tarihinden
        sonraki tüm süreye ait gelir (180.000 ₺) cari dönemden çıkarılır.
    hesap_adimlari:
    - 'Aylık kira: 240.000 / 24 = 10.000 ₺'
    - '2026''ya ait (Temmuz–Aralık): 6 × 10.000 = 60.000 ₺'
    - 'Ertelenecek tutar: 240.000 − 60.000 = 180.000 ₺ (649 borç)'
    - 'Bilanço tarihinden itibaren ilk 12 ay (2027): 12 × 10.000 = 120.000 ₺ → 380 alacak'
    - 'Sonraki 6 ay (2028 Ocak–Haziran): 6 × 10.000 = 60.000 ₺ → 480 alacak'
