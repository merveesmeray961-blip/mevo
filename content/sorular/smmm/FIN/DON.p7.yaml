    - 'Alacak reeskont: 180.000 × 0,18 × 90/360 = 8.100'
    - 'Borç reeskont: 120.000 × 0,18 × 90/360 = 5.400'
    - 'Net gider: 8.100 − 5.400 = 2.700'
