    dogru_neden: 'Alacak reeskontu (gider): 180.000 × 0,18 × (90/360) = 8.100 ₺ → 657 B / 122 A. Borç reeskontu (gelir): 120.000
      × 0,18 × (90/360) = 5.400 ₺ → 322 B / 647 A. Net: 8.100 − 5.400 = 2.700 ₺ gider.

      Püf noktaları: Alacak reeskontu gider (657/122), borç reeskontu gelir (647/322); net etki farktır.

