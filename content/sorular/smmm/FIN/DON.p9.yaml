      C: 691 ve 370 hesaplarının kayıt yönleri ters çevrilmiştir.
      D: Peşin vergi tutarı karşılık tutarı sanılmıştır.
      E: Vergi oranı yanlış uygulanarak 350.000 TL bulunmuştur.
