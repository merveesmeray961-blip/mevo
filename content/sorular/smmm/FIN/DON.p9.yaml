  kok: (G) A.Ş.'nin 2026 hesap dönemine ilişkin vergi öncesi dönem kârı 1.000.000 TL'dir. Soruda kurumlar vergisi oranı %25
    olarak verilmiştir. Dönem içinde 100.000 TL peşin vergi ödenmiştir. Dönem sonu kurumlar vergisi karşılığı ve bu karşılığın
    peşin vergiyle mahsup edilmesi dikkate alınacaktır. İlk karşılık kaydında 691 ve 370 hesaplarına yazılacak tutarlar hangisidir?
