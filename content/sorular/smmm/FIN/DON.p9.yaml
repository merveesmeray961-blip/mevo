    D: 691 borç 100.000 TL; 370 alacak 100.000 TL
    E: 691 borç 350.000 TL; 370 alacak 350.000 TL
  dogru: A
  aciklama:
    dogru_neden: Vergi karşılığı 1.000.000 × %25 = 250.000 TL'dir. MSUGT'ye göre dönem kârı üzerinden hesaplanan vergi 691
