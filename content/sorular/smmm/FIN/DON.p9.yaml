- id: SMMM-FIN-DON-0046
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Dönem sonu tahakkuk
  konu: DON
  kazanim: gelecek aylara ait gider/gelir (180/380)
  tip: hesaplama
  zorluk: 2
  kok: Bir işletme 1 Kasım 2026'da, Kasım 2026–Şubat 2027 dönemini kapsayan 4 aylık hizmet bedelini peşin olarak 48.000 TL
    tahsil etmiştir. Tutarın tamamı başlangıçta 380 Gelecek Aylara Ait Gelirler hesabında izlenmiştir. 31 Aralık 2026'da 2027
    yılına ait henüz kazanılmamış gelir için 380 hesabında kalması gereken tutar kaç TL'dir?
  secenekler:
    A: 12.000 TL
    B: 24.000 TL
    C: 36.000 TL
    D: 48.000 TL
    E: 60.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Toplam 48.000 TL dört aya eşit dağılıyorsa aylık gelir 12.000 TL''dir. Kasım ve Aralık aylarına ait 24.000
      TL ilgili gelir hesaplarına aktarılmış, Ocak ve Şubat 2027''ye ait 24.000 TL ise 31 Aralık 2026 itibarıyla 380 hesabında
      kalmıştır. Püf noktaları: 380 hesabı peşin tahsil edilen ve gelecek bilanço dönemlerine ait bir yıldan kısa süreli gelirlerin
      ilgili döneme kadar olan kısmını taşır.'
    celdiriciler:
      A: Yalnız bir aylık gelir dönemselleştirilmiştir; Kasım ve Aralık iki aylık gelir vardır.
      C: 36.000 TL, üç aylık kısmın ertelenmesi olur; 2026'da iki ay gerçekleşmiştir.
      D: Tüm tutarın 380'de bırakılması, gerçekleşen iki aylık geliri de ertelemek anlamına gelir.
      E: Toplam tutar dört aylık olduğundan 60.000 TL olamaz.
    hesap_adimlari:
    - Aylık gelir = 48.000 / 4 = 12.000 TL.
    - 2026'da gerçekleşen iki ay = 2 × 12.000 = 24.000 TL.
