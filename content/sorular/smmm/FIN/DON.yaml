- id: SMMM-FIN-DON-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: DON
  kazanim: Gelecek aylara ait giderler (180) — dönem sonu erteleme kaydı
  tip: hesaplama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: 'Giderlerini 7/A seçeneğine göre izleyen (Y) A.Ş., 01.10.2026 tarihinde yönetim binası için 12 aylık sigorta
    poliçesi düzenletmiş ve 24.000 ₺ prim tutarını peşin ödemiştir. Ödeme tarihinde tutarın tamamı 770 Genel Yönetim
    Giderleri hesabına borç kaydedilmiştir. Hesap dönemi takvim yılıdır. Aksi belirtilmedikçe Tekdüzen Muhasebe
    Sistemi esas alınır.


    31.12.2026 tarihinde yapılması gereken dönem sonu düzeltme kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 770 Genel Yönetim Giderleri 6.000

      Alacak: 180 Gelecek Aylara Ait Giderler 6.000'
    B: 'Borç: 180 Gelecek Aylara Ait Giderler 18.000

      Alacak: 770 Genel Yönetim Giderleri 18.000'
    C: 'Borç: 180 Gelecek Aylara Ait Giderler 6.000

      Alacak: 770 Genel Yönetim Giderleri 6.000'
    D: 'Borç: 280 Gelecek Yıllara Ait Giderler 18.000

      Alacak: 770 Genel Yönetim Giderleri 18.000'
    E: 'Borç: 770 Genel Yönetim Giderleri 18.000

      Alacak: 180 Gelecek Aylara Ait Giderler 18.000'
  dogru: B
  aciklama:
    dogru_neden: Poliçenin 3 ayı (Ekim–Aralık) 2026'ya, 9 ayı 2027'ye aittir. Aylık prim 24.000 / 12 = 2.000 ₺;
      gelecek döneme ait kısım 9 × 2.000 = 18.000 ₺'dir. Ödeme anında tamamı gider yazıldığından, dönem sonunda
      gelecek döneme ait kısım giderden çıkarılıp THP 180 Gelecek Aylara Ait Giderler hesabına aktarılır (peşin
      ödenen ve cari dönem gider hesaplarına kaydedilmemesi gereken giderler). Kayıt 180 borç / 770 alacak 18.000
      ₺'dir. Kalan süre bir yılı aşmadığından 280 değil 180 kullanılır.
    celdiriciler:
      A: Bu kayıt, peşin ödemenin önce tamamen 180 hesabına alındığı yöntemde döneme ait 6.000 ₺'nin gidere aktarılmasıdır;
        kökte ödeme 770 hesabına kaydedilmiştir.
      C: Hesaplar doğru, tutar yanlıştır; 6.000 ₺ cari döneme ait kısımdır, gelecek döneme aktarılması gereken tutar
        18.000 ₺'dir.
      D: THP 280, peşin ödenen ve gelecek yıllara ait giderleri izlemek için kullanılır; ilgili hesap dönemlerinde
        bu hesabın alacağı karşılığında 180'e aktarma yapılır. 2027'nin ilk 9 ayına ait gider, bilanço tarihinden
        itibaren bir yıl içinde gidere dönüşeceğinden 180'de izlenir.
      E: Taraflar ters yazılmıştır; bu kayıt gideri azaltmak yerine 18.000 ₺ daha artırır ve 180 hesabına alacak
        bakiyesi verir.
    hesap_adimlari:
    - Aylık prim = 24.000 / 12 = 2.000 ₺
    - 2026 payı (Ekim–Aralık) = 3 × 2.000 = 6.000 ₺; 2027 payı = 9 × 2.000 = 18.000 ₺
    - 'Ödeme 770''e yazıldığından 2027 payı 770''ten 180''e aktarılır: 180 B 18.000 / 770 A 18.000'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 180 Gelecek Aylara Ait Giderler
    alinti: 'Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek
      döneme ait giderleri izlemek için kullanılır. İşleyişi : Gelecek aylarda ilgili gider ve maliyet hesaplarına
      borç kaydedilecek peşin olarak ödenen giderler, bu hesabın borcuna kaydedilir. Gelecek aylarda bu hesaba alacak
      verilmek suretiyle ilgili gider hesabına aktarılır.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 770 Genel Yönetim Giderleri
    alinti: Bir işletmenin yönetim fonksiyonları, işletme politikasının tayini, organizasyon ve kadro kuruluşu,
      büro hizmetleri, kamu ilişkileri, güvenlik, hukuk işleri, personel işleri, kredi ve tahsilatı da kapsayan
      muhasebe ve mali işler servislerin giderleri bu hesaba borç kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 280 Gelecek Yıllara Ait Giderler
    alinti: Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek
      yıllara ait giderleri izlemek için kullanılır.
  dogrulama:
    python: 'aylik = 24000 / 12

      sonuc = aylik * 9

      '
    secenek_sayisi_bekleniyor: false
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: D çeldiricisi THP 280 ile uyumlu; 180 B/770 A 18.000 (B) tek cevap.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: THP 280 alıntısı birebir.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday yanlış (güven 4)
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'gecerlilik.baslangic soru üretim tarihinden dayanılan hükmün yürürlüğüne çekildi: MSUGT (Sıra No:1) 1994-01-01.'
    neden: 'Rötuş talimatı md. 3: baslangic soru üretim tarihiydi.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: D çeldiricisi için THP 280 alıntısı eklendi; önceki gecmis kaydındaki hatalı VUK md. 281/2 ve KDVK md. 29/1-a
      atfı çıkarıldı (bu sorunun dayanağı yalnız MSUGT'dir).
    neden: G6 denetçi notu (DUZELTME_LISTESI.md).
- id: SMMM-FIN-DON-0002
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: DON
  kazanim: Alacak senedi reeskontu (122/657) — iç iskonto
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '(Z) A.Ş.''nin portföyünde, bir müşterisinden 15.11.2026 tarihinde aldığı 206.000 ₺ nominal değerli bir alacak
    senedi bulunmaktadır. 31.12.2026 itibarıyla senedin vadesine 30 gün kalmıştır ve senette faiz oranı belirtilmemiştir.
    Şirket alacak senetlerini VUK md. 281 uyarınca değerleme gününün kıymetine irca etmektedir. Değerleme günündeki
    Merkez Bankası resmî iskonto haddi yıllık %36''dır. Reeskont iç iskonto yöntemiyle hesaplanacak; yıl 360 gün
    kabul edilecektir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    31.12.2026 tarihli reeskont kaydıyla ilgili aşağıdaki ifadelerden hangisi doğrudur?'
  secenekler:
    A: 122 Alacak Senetleri Reeskontu hesabına 6.000 ₺ borç kaydedilir.
    B: 647 Reeskont Faiz Gelirleri hesabına 6.000 ₺ alacak kaydedilir.
    C: 657 Reeskont Faiz Giderleri hesabına 6.180 ₺ borç kaydedilir.
    D: 657 Reeskont Faiz Giderleri hesabına 6.000 ₺ borç kaydedilir.
    E: 122 Alacak Senetleri Reeskontu hesabına 6.180 ₺ alacak kaydedilir.
  dogru: D
  aciklama:
    dogru_neden: İç iskontoda reeskont = N × f × t / (36.000 + f × t) formülüyle bulunur. f × t = 36 × 30 = 1.080;
      206.000 × 1.080 / (36.000 + 1.080) = 206.000 × 1.080 / 37.080 = 6.000 ₺. THP 657 açıklamasına göre senetli
      alacakların dönem sonu reeskont faiz giderleri 657 Reeskont Faiz Giderleri hesabında izlenir; karşılığında
      122 Alacak Senetleri Reeskontu hesabına alacak yazılır. Kayıt 657 borç / 122 alacak 6.000 ₺'dir. Senedin alınış
      tarihi sonucu etkilemez.
    celdiriciler:
      A: 122 düzenleyici (pasif karakterli) bir hesaptır; hesaplanan reeskont bu hesaba borç değil alacak yazılır.
      B: 647 Reeskont Faiz Gelirleri, borç senetlerinin dönem sonu reeskontunda kullanılır; alacak senedi reeskontu
        gider doğurur.
      C: Hesap ve taraf doğrudur, ancak tutar dış iskontoyla bulunmuştur (206.000 × 0,36 × 30 / 360 = 6.180); kökte
        iç iskonto istenmektedir.
      E: Hesap ve taraf doğrudur, ancak tutar dış iskonto yöntemiyle hesaplanmıştır; iç iskontoya göre reeskont
        6.000 ₺'dir.
    hesap_adimlari:
    - f × t = 36 × 30 = 1.080 (30 günlük oran %3)
    - İç iskonto = 206.000 × 1.080 / (36.000 + 1.080) = 206.000 × 3 / 103 = 2.000 × 3 = 6.000 ₺
    - '(Dış iskonto olsaydı: 206.000 × 1.080 / 36.000 = 6.180 ₺)'
    - 'Kayıt: 657 Reeskont Faiz Giderleri B 6.000 / 122 Alacak Senetleri Reeskontu A 6.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 281/2
    alinti: Vadesi gelmemiş olan senede bağlı alacaklar değerleme gününün kıymetine irca olunabilir. Bu takdirde,
      senette faiz nispeti açıklanmış ise bu nispet, açıklanmamışsa Cumhuriyet Merkez Bankasının resmi iskonto haddi
      uygulanır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 657 Reeskont Faiz Giderleri; 122 Alacak Senetleri Reeskontu
    alinti: '657: İşletmenin senetli alacaklarının dönem sonu itibariyle yapılan reeskont faiz giderleri ile borç
      senetleri reeskontunun, izleyen dönem başında iptalinden ortaya çıkan faiz giderlerinin izlendiği hesaptır.
      122: Bilanço gününde, senetli alacakların tasarruf değeri ile değerlenmesini sağlamak üzere alacak senetleri
      için ayrılan reeskont tutarlarının izlenmesinde kullanılır. İşleyişi : Hesaplanan reeskont tutarları bu hesaba
      alacak, [...]'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 647 Reeskont Faiz Gelirleri — İşleyişi
    alinti: İşletmenin senetli borçlarının dönem sonu itibariyle yapılan reeskont işlem faiz geliri ile; alacak
      senetleri reeskontunun, izleyen dönem başında iptalinden ortaya çıkan faiz gelirleri bu hesaba alacak yazılır.
  dogrulama:
    python: 'n = 206000

      ft = 36 * 30

      sonuc = n * ft / (36000 + ft)

      '
    secenek_sayisi_bekleniyor: false
