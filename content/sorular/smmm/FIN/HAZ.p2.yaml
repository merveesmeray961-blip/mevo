- id: SMMM-FIN-HAZ-0034
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Hazır değerler
  konu: HAZ
  kazanim: KDV mahsubu (191/391/360)
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme dönem içinde KDV dahil 600.000 ₺'lik mal alımı ve KDV dahil 960.000 ₺'lik mal satışı yapmıştır (KDV oranı
    %20; önceki dönemden devreden KDV yoktur). Dönem sonunda 391 Hesaplanan KDV hesabı 191 İndirilecek KDV ile karşılaştırılacağına
    göre 360 Ödenecek Vergi ve Fonlar hesabına aktarılacak KDV tutarı kaç ₺'dir?
  secenekler:
    A: 6.000 ₺
    B: 60.000 ₺
    C: 100.000 ₺
    D: 160.000 ₺
    E: 260.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'KDV dahil alış 600.000 ₺''nin KDV''si 600.000 / 1,20 × 0,20 = 100.000 ₺ (191), KDV dahil satış 960.000 ₺''nin
      KDV''si 960.000 / 1,20 × 0,20 = 160.000 ₺ (391)''dır. 391 bakiyesi 191''den fazla olduğundan fark 60.000 ₺ vadesinde
      ödenmek üzere 360 hesabına aktarılır. Püf noktaları: KDV dahil tutarlardan KDV bulunurken tutar 1,20''ye bölünüp 0,20
      ile çarpılır; tutarın doğrudan %20''si alınırsa sonuç yanlış çıkar. Ödenecek KDV 391 ile 191 arasındaki farktır.'
    celdiriciler:
      A: 6.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      C: 100.000 ₺ indirilecek KDV tutarıdır; ödenecek tutar 391 ile 191 arasındaki farktır.
      D: 160.000 ₺ hesaplanan KDV'nin tamamıdır; indirilecek KDV düşülmelidir.
      E: 260.000 ₺, hesaplanan ve indirilecek KDV'nin toplanmasıyla bulunur.
    hesap_adimlari:
    - İndirilecek KDV = 600.000 / 1,2 × 0,2 = 100.000
    - Hesaplanan KDV = 960.000 / 1,2 × 0,2 = 160.000
    - Ödenecek KDV = 60.000 ₺
  kaynaklar:
  - mevzuat: 1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)
    madde: 391. Hesaplanan KDV
    alinti: Hesaplanan katma değer vergisi bu hesaba alacak kaydedilir.
  - mevzuat: 1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)
    madde: 391. Hesaplanan KDV
    alinti: vadesinde ödenmek üzere "360-ÖDENECEK VERGİ VE FONLAR" hesabına aktarılarak kapatılır.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 960000 / 1.2 * 0.2 - 600000 / 1.2 * 0.2
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
