- id: SMMM-FIN-HAZ-0038
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Hazır değerler
  konu: HAZ
  kazanim: mizan
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin mizanında hesapların bakiyeleri şöyledir: 100 Kasa 40.000 ₺ (borç), 102 Bankalar 160.000 ₺ (borç),
    120 Alıcılar 300.000 ₺ (borç), 121 Alacak Senetleri 400.000 ₺ (borç), 300 Banka Kredileri 180.000 ₺ (alacak), 321 Borç
    Senetleri 220.000 ₺ (alacak), 129 Şüpheli Ticari Alacaklar Karşılığı 50.000 ₺ (alacak). Mizanın dengeli olması için 500
    Sermaye hesabının alacak bakiyesi kaç ₺ olmalıdır?'
  secenekler:
    A: 45.000 ₺
    B: 450.000 ₺
    C: 900.000 ₺
    D: 1.350.000 ₺
    E: 4.500.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Borç bakiyeleri toplamı 40.000 + 160.000 + 300.000 + 400.000 = 900.000 ₺''dir. Mizanda borç ve alacak toplamları
      eşit olmalıdır; diğer alacak bakiyeleri 180.000 + 220.000 + 50.000 = 450.000 ₺''dir. Sermaye = 900.000 − 450.000 = 450.000
      ₺. Püf noktaları: 129 aktif hesap olmasına karşın alacak bakiyeli olduğundan alacak tarafına yazılır. Mizanda hesabı
      nitelendirmeyip bakiyesinin yönüne göre sınıflandırın.'
    celdiriciler:
      A: 45.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      C: 900.000 ₺ borç bakiyeleri toplamıdır; diğer alacak bakiyeleri düşülmelidir.
