    A: 108.000 ₺
    B: 270.000 ₺
    C: 1.080.000 ₺
    D: 1.350.000 ₺
    E: 10.800.000 ₺
  dogru: C
  aciklama:
    dogru_neden: '691 hesabına vergi karşılığı borç yazılır; 690 ile 691 karşılıklı kapatıldığında bulunan fark 692''ye kaydedilir.
      Net dönem kârı 1.350.000 − 270.000 = 1.080.000 ₺ olup 692''nin alacağına yazılır. Püf noktaları: Önce 690 bakiyesinin
      kâr mı zarar mı olduğunu, sonra vergi karşılığının 691''e borç yazıldığını belirleyin. Net kâr = vergi öncesi kâr −
      vergi; 270.000 ₺ veya 1.350.000 ₺ tek başına cevap değildir.'
    celdiriciler:
      A: 108.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 270.000 ₺ vergi karşılığıdır; net kâr bu tutar düşülerek bulunur.
      D: 1.350.000 ₺ vergiden önceki dönem kârıdır; vergi karşılığı düşülmelidir.
      E: 10.800.000 ₺, doğru sonucun on katıdır.
    hesap_adimlari:
    - Net dönem kârı = 1.350.000 − 270.000 = 1.080.000 ₺
