  kok: Dönem sonunda 690 Dönem Kârı veya Zararı hesabı 1.350.000 ₺ alacak bakiyesi vermektedir. Dönem kârı üzerinden hesaplanan
    vergi ve diğer yasal yükümlülük karşılığı 270.000 ₺'dir. 690 ve 691 hesapları kapatılarak 692 hesabına devredilirse, 692
    hesabının alacağına kaydedilen vergi sonrası net dönem kârı kaç ₺'dir?
