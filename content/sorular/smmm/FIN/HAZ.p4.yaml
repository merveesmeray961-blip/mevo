  unite: Finansal Muhasebe
  konu: HAZ
  kazanim: 'Dönem sonu kapanış: dönem kârı vergi karşılığının ayrılması (691/370) ve 690 Dönem Kârı veya Zararı hesabı'
  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: 'Giderlerini 7/A seçeneğine göre izleyen (K) A.Ş.''nin 2026 hesap dönemi sonunda tüm gelir ve gider hesapları 690 Dönem
    Kârı veya Zararı hesabına aktarılmış ve bu hesap 500.000 ₺ alacak bakiyesi vermiştir. Şirket, dönem kârı üzerinden hesaplanan
    125.000 ₺ tutarındaki kurumlar vergisi karşılığını muhasebeleştirecektir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi
    esas alınır.


    Kurumlar vergisi karşılığının ayrılmasına ilişkin kayıt aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 690 Dönem Kârı veya Zararı 125.000

      Alacak: 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000'
    B: 'Borç: 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000

      Alacak: 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000'
    C: 'Borç: 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000

      Alacak: 193 Peşin Ödenen Vergiler ve Fonlar 125.000'
    D: 'Borç: 692 Dönem Net Kârı veya Zararı 125.000

      Alacak: 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000'
    E: 'Borç: 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000

      Alacak: 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları 125.000'
  dogru: E
  aciklama:
    dogru_neden: THP 691'e göre dönem kârı üzerinden hesaplanan vergi ve yasal yükümlülükler 691 hesabın borcuna, 370 hesabın
      alacağına kaydedilir. 690 ve 691 hesapları daha sonra karşılıklı olarak kapatılır ve fark 692 Dönem Net Kârı veya Zararı
      hesabına kaydedilir (THP 692). Dolayısıyla doğru kayıt 691 Borç / 370 Alacak 125.000 ₺'dir.
    celdiriciler:
      A: Vergi karşılığı 690 Dönem Kârı veya Zararı hesabına borç yazılmaz; 690'ın kalanı vergiden önceki dönem kârını gösterir
        (THP 690). THP 691'e göre hesaplanan vergi 691 hesabın borcuna yazılır; 690 ile 691 dönem sonunda karşılıklı kapatılarak
        fark 692'ye aktarılır (THP 692).
      B: 'Taraflar ters yazılmıştır: THP 691''e göre vergi karşılığı 691''in borcuna, 370''in alacağına kaydedilir.'
      C: 193 Peşin Ödenen Vergiler ve Fonlar, dönem içinde peşin ödenen (ör. geçici) vergilerin izlendiği hesaptır; hesaplanan
        vergi karşılığının karşı hesabı 370'tir.
      D: 692 Dönem Net Kârı veya Zararı, 690 ile 691'in kapatılması sonucu bulunan farkı gösterir; vergi karşılığı 692'ye
        borç yazılmaz, 691'e borç yazılır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları (-)
    alinti: Dönem kârı üzerinden, ilgili mevzuat hükümlerine göre hesaplanan vergi ve yasal yükümlülükler bu hesabın borcuna,
      "370- Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları Hesabı"nın alacağına kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 690 Dönem Kârı veya Zararı
    alinti: Hesabın kalanı vergiden önceki dönem kârı veya zararını gösterir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları
    alinti: Dönem kârı üzerinden hesaplanan kurumlar vergisi, diğer vergi ve kesintiler, fonlar ve benzeri diğer yükümlülükler
      için ayrılan karşılıkların izlendiği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 193 Peşin Ödenen Vergiler ve Fonlar
    alinti: Mevzuat gereğince peşin ödenen ve bir yıl içinde indirim konusu yapılabilecek gelir, kurumlar ve diğer vergiler
      ile fonların kayıt ve takip edildiği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 692 Dönem Net Kârı veya Zararı
    alinti: '"690- Dönem Kâr veya Zararı Hesabı" ile "691- Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları Hesapları"nın
      karşılıklı olarak kapatılması sonucu bulunan fark'
