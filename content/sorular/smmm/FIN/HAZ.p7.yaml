    190 Devreden KDV 20.000 TL borçtur. Dönem sonu KDV mahsup kaydında 360 Ödenecek Vergi ve Fonlar hesabına aktarılacak tutar
    kaç TL'dir?
  secenekler:
    A: '20.000'
