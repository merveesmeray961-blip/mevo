  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Hazır değerler
  konu: HAZ
  kazanim: kasa ve banka işlemleri
  tip: hesaplama
  zorluk: 2
  kok: (I) A.Ş. kasasındaki 80.000 TL'nin 30.000 TL'sini banka hesabına yatırmış, aynı gün bankadan 12.000 TL çekerek kasaya
    almıştır. Bu iki işlemin yalnızca 100 Kasa ve 102 Bankalar hesapları açısından toplam etkisi hangisidir?
  secenekler:
    A: 100 Kasa borç 12.000 TL; 102 Bankalar borç 30.000 TL
    B: 100 Kasa alacak 18.000 TL; 102 Bankalar borç 18.000 TL
    C: 100 Kasa borç 18.000 TL; 102 Bankalar alacak 18.000 TL
    D: 100 Kasa alacak 42.000 TL; 102 Bankalar borç 42.000 TL
    E: 100 Kasa alacak 30.000 TL; 102 Bankalar alacak 12.000 TL
  dogru: B
  aciklama:
    dogru_neden: Bankaya yatırılan 30.000 TL 100 Kasa hesabını alacak, 102 Bankalar hesabını borçlandırır. Bankadan çekilen
      12.000 TL ise 102'yi alacak, 100'ü borçlandırır. Net etki 100 Kasa için 18.000 TL alacak, 102 Bankalar için 18.000 TL
      borçtur.
    celdiriciler:
      A: İki işlemin hesap yönleri ters ve tutarlar netleştirilmeden verilmiştir.
      C: 100 Kasa hesabının net yönü borç değil alacaktır.
      D: İki işlemin toplamı 42.000 TL değildir; biri diğerini kısmen ters yönde etkiler.
      E: 102 Bankalar hesabının net yönü alacak değil borçtur.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 100. Kasa; 102. Bankalar
    alinti: Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima
      borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 102. Bankalar — İşleyişi
    alinti: Bankalara para olarak veya hesaben yatırılan değerler borç, çekilen tutarlar ile üçüncü kişilerce tahsil edildiği
