- id: SMMM-FIN-MDV-0004
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: 'TMS 38: işletme içi geliştirilen maddi olmayan duran varlık — araştırma ve geliştirme safhaları, aktifleştirilecek
    maliyet (263 Araştırma ve Geliştirme Giderleri)'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '(G) Yazılım A.Ş., 2026 yılında kendi bünyesinde yeni bir yazılım ürünü geliştirmektedir; muhasebeleştirme
    TMS 38''e göre yapılacaktır. Projeye ilişkin harcamalar şöyledir:


    - Ocak–Mart 2026 araştırma safhası harcamaları: 200.000 ₺,


    - Nisan–Haziran 2026''da, TMS 38 par. 57''deki koşulların tamamı henüz sağlanmadan yapılan geliştirme harcamaları:
    150.000 ₺,


    - TMS 38 par. 57''deki koşulların tamamı ilk kez 1 Temmuz 2026''da sağlanmıştır. Temmuz–Eylül döneminde yapılan
    ve varlıkla doğrudan ilişkilendirilebilen geliştirme harcamaları: 250.000 ₺,


    - Ekim–Aralık döneminde yapılan ve varlıkla doğrudan ilişkilendirilebilen geliştirme harcamaları: 120.000 ₺,


    - Aynı dönemde katlanılan, projeyle doğrudan ilişkilendirilemeyen genel yönetim giderleri: 40.000 ₺.


    Proje 31.12.2026 itibarıyla devam etmektedir ve itfa payı ayrılmayacaktır. Aksi belirtilmedikçe Tekdüzen Muhasebe
    Sistemi esas alınır.


    Buna göre (G) A.Ş.''nin 31.12.2026 tarihinde 263 Araştırma ve Geliştirme Giderleri hesabında izleyeceği (aktifleştireceği)
    tutar kaç ₺''dir?'
  secenekler:
    A: '370.000'
    B: '410.000'
    C: '520.000'
    D: '560.000'
    E: '720.000'
  dogru: A
  aciklama:
    dogru_neden: TMS 38 par. 54'e göre araştırma safhası harcamaları gerçekleştiğinde gider yazılır. Geliştirme
      harcamaları ancak par. 57'deki koşulların tamamı sağlandığında varlık olarak muhasebeleştirilir; par. 65'e
      göre işletme içi yaratılan varlığın maliyeti, kriterlerin ilk defa sağlandığı tarihten itibaren yapılan harcamaların
      toplamıdır ve par. 71 daha önce gider yazılan harcamaların sonradan aktifleştirilmesine izin vermez. Par.
      67(a) uyarınca varlıkla doğrudan ilgili olmayan yönetim ve genel giderler maliyete dahil edilmez. Aktifleştirilecek
      tutar 250.000 + 120.000 = 370.000 ₺'dir.
    celdiriciler:
      B: '410.000: Projeyle doğrudan ilişkilendirilemeyen genel yönetim giderleri (40.000) de maliyete eklenmiştir.
        TMS 38 par. 67(a) bunları maliyetin parçası saymaz.'
      C: '520.000: Koşullar sağlanmadan önce gider yazılan 150.000 ₺''lik geliştirme harcaması da aktifleştirilmiştir.
        Par. 65 ve 71''e göre maliyet, kriterlerin ilk sağlandığı tarihten itibaren yapılan harcamalardır.'
      D: '560.000: Hem genel yönetim giderleri (40.000) hem de kriterler sağlanmadan önceki geliştirme harcamaları
        (150.000) maliyete eklenmiştir.'
      E: '720.000: Projenin tüm doğrudan harcamaları aktifleştirilmiştir (200.000 + 150.000 + 250.000 + 120.000).
        Araştırma harcamaları par. 54 uyarınca, kriterlerden önceki geliştirme harcamaları ise par. 71 uyarınca
        gider kalır.'
    hesap_adimlari:
    - 'Araştırma (200.000) ve kriterlerden önceki geliştirme (150.000): gider (par. 54, 71)'
    - 'Genel yönetim giderleri (40.000): maliyete dahil edilmez (par. 67-a)'
    - 'Aktifleştirilecek: 250.000 + 120.000 = 370.000 ₺'
  kaynaklar:
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 54
    alinti: Araştırmadan (veya işletme içi bir projenin araştırma safhasından) kaynaklanan herhangi bir maddi olmayan
      duran varlık muhasebeleştirilmez. Araştırma (veya işletme içi bir projenin araştırma safhası) harcamaları
      gerçekleştiğinde gider olarak muhasebeleştirilir.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 57 (giriş)
    alinti: 'Sadece ve sadece, aşağıdaki koşulların tamamının varlığı halinde, geliştirmeden (veya işletme bünyesinde
      yürütülen bir projenin geliştirme safhasından) kaynaklanan maddi olmayan duran varlıklar muhasebeleştirilir:'
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 65
    alinti: 24’üncü paragrafa göre işletme içi yaratılan bir maddi olmayan duran varlığın maliyeti, ilgili varlığın
      21, 22 ve 57’nci paragraflardaki muhasebeleştirilme kriterlerini ilk defa sağladığı tarihten itibaren yapılan
      harcamaların toplamıdır. 71’inci paragraf, daha önceki dönemlerde gider olarak muhasebeleştirilen harcamaların
      tekrar muhasebeleştirilmesine izin vermez.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 67(a)
    alinti: Varlığın kullanıma hazır hale getirilmesi ile doğrudan ilgili olmayan satış ve yönetim giderleri ile
      diğer genel giderler;
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 71
    alinti: Başlangıçta gider olarak muhasebeleştirilen bir maddi olmayan duran varlık ile ilgili harcamalar, daha
      sonraki bir tarihte maddi olmayan duran varlık maliyetinin bir parçası olarak muhasebeleştirilmezler.
  dogrulama:
    python: 'sonuc = 250000 + 120000

