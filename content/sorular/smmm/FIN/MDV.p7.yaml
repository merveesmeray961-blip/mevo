- id: SMMM-FIN-MDV-0005
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: haklar ve şerefiye
  tip: hesaplama
  zorluk: 3
  kok: (P) A.Ş. bir işletmeyi 1.200.000 TL bedelle devralmıştır. Devir tarihinde devralınan işletmenin rayiç bedelle hesaplanan
    net varlıklarının değeri 950.000 TL'dir. Aynı dönemde kullanım süresi belli olmayan bir lisans hakkı için 300.000 TL ödenmiştir.
    Bu iki işlem için MSUGT'ye göre aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Lisans 260'da izlenir; şerefiye 250.000 TL'dir ve 5 yılda eşit taksitlerle itfa edilir.
    B: Lisans 261'de izlenir; şerefiye 300.000 TL'dir ve 3 yılda itfa edilir.
    C: Lisans gider yazılır; şerefiye 250.000 TL'dir ve 5 yılda itfa edilir.
    D: Lisans 260'da izlenir; şerefiye 950.000 TL'dir ve 5 yılda itfa edilir.
    E: Lisans 263'te izlenir; şerefiye 250.000 TL'dir ve yararlanma süresince itfa edilir.
  dogru: A
  aciklama:
    dogru_neden: 'İmtiyaz, patent ve lisans gibi bedel ödenerek elde edilen haklar 260 Haklar hesabında izlenir ve kullanım
      süresi belli değilse 5 yılda eşit taksitlerle itfa edilir. Şerefiye, devir maliyeti ile rayiç bedelle hesaplanan net
      varlık değeri arasındaki olumlu farktır: 1.200.000 − 950.000 = 250.000 TL; bu tutar 5 yılda eşit taksitlerle itfa edilir.
      Püf noktaları: Lisansın 260, şerefiyenin 261 hesapta izlenmesi ve şerefiyenin iki tutar arasındaki olumlu fark olarak
      hesaplanması birlikte dikkate alınmalıdır.'
    celdiriciler:
      B: 261 Şerefiye, işletme devralınırken oluşan olumlu farkı izler; lisansın hesabı değildir.
      C: 260 kapsamındaki lisans aktifleştirilen bir haktır; doğrudan gider yazılmaz.
      D: 950.000 TL net varlık değeri şerefiye değil, şerefiyenin hesaplanmasında kullanılan ikinci unsurdur.
      E: 263 Araştırma ve Geliştirme Giderleri hesabıdır; lisans hakkının hesabı değildir.
    hesap_adimlari:
    - Şerefiye = 1.200.000 − 950.000 = 250.000 TL
    - Kullanım süresi belli olmayan lisansın itfa süresi = 5 yıl
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 260. Haklar — İşleyişi
    alinti: '260. HAKLAR İmtiyaz, patent, lisans, ticari marka ve ünvan gibi bir bedel ödenerek elde edilen bazı hukuki tasarruflar
      ile kamu otoritelerinin işletmeye belirli alanlarda tanıdığı kullanma, yararlanma gibi yetkiler dolayısıyla yapılan
      harcamaları kapsar. İşleyişi : Edinilen haklar, maliyet bedelleri ile bu hesaba borç kaydedilir. Yararlanma süreleri
      içerisinde, yararlanma sürelerinin belli olmaması durumunda, 5 yıllık sürede eşit taksitlerle itfa olunarak yok edilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 261. Şerefiye — İşleyişi
    alinti: '261. ŞEREFİYE Bu hesap, bir işletme devralınırken katlanılan maliyet ile söz konusu işletmenin rayiç bedelle
      hesaplanan net varlıklarının (öz varlık) değeri arasındaki olumlu farkların izlenmesinde kullanılır. Şerefiye hesaplanırken
      rayiç bedelin tespit edilmemesi halinde, net defter değeri esas alınır. İşleyişi : Ödenen şerefiye bedellerinin tamamı
      bu hesabın borcuna kaydolunur. Yok edilmeleri amortisman yoluyla 5 yıl içinde eşit taksitlerle yapılır.'
  gecerlilik:
