  kok: '(J) A.Ş., bir üretim makinesini 1.1.2026’da 900.000 TL’ye satın almış, kalıntı değeri 100.000 TL, tahmini toplam üretim
    kapasitesi 400.000 birim olarak belirlenmiştir. Şirket üretim miktarı yöntemini uygulamaktadır. 2026 yılında 80.000 birim
    üretim yapılmıştır. Aksi belirtilmedikçe BOBİ FRS esas alınır.


