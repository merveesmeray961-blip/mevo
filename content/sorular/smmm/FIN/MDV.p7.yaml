- id: SMMM-FIN-MDV-0031
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: amortisman yöntemleri (eşit tutar
  tip: hesaplama
  zorluk: 3
  kok: '(C) A.Ş., 1 Ocak 2026’da 1.200.000 TL maliyetli bir makine satın almıştır. Makinenin faydalı ömrü 5 yıl, kalıntı değeri
    200.000 TL olarak tahmin edilmiştir. Şirket doğrusal (eşit tutar) amortisman yöntemini uygulamakta ve kıst amortisman
    esasını benimsemektedir. 2026 yılında makine 1 Temmuz’da kullanıma hazır hale gelmiştir. Aksi belirtilmedikçe BOBİ FRS
    esas alınır.


    Buna göre (C) A.Ş.’nin 2026 hesap döneminde bu makine için ayıracağı amortisman tutarı kaç TL’dir?

    '
  secenekler:
    A: '100.000'
    B: '120.000'
    C: '200.000'
    D: '240.000'
    E: '400.000'
  dogru: A
  aciklama:
    dogru_neden: 'Amortismana tabi tutar = maliyet − kalıntı değer = 1.200.000 − 200.000 = 1.000.000 TL. Doğrusal yöntemde
      yıllık amortisman = 1.000.000 / 5 = 200.000 TL. Kıst esasına göre 1 Temmuz’da kullanıma hazır hale geldiğinden 2026
      için 6/12 × 200.000 = 100.000 TL ayrılır.


      Püf noktaları: BOBİ FRS’de amortisman, varlık yönetim tarafından amaçlanan kullanıma hazır hale geldiği tarihten başlar;
      kıst zorunludur. Kalıntı değer amortismana tabi tutardan düşülür.

      '
    celdiriciler:
      B: Kalıntı değer düşülmeden (1.200.000 / 5 × 6/12) hesaplanmıştır.
      C: Tam yıl amortismanı alınmış, kıst esası unutulmuştur.
      D: Kalıntı değer düşülmeden tam yıl amortismanı hesaplanmıştır.
      E: Amortismana tabi tutar yerine maliyet bedeli üzerinden ve tam yıl hesaplanmıştır.
    hesap_adimlari:
    - 'Amortismana tabi tutar: 1.200.000 − 200.000 = 1.000.000 TL'
    - 'Yıllık doğrusal amortisman: 1.000.000 / 5 = 200.000 TL'
    - '2026 kıst (6 ay): 200.000 × 6/12 = 100.000 TL'
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS)
    madde: 12.24 - 12.26, 12.29
    alinti: Amortismana tâbi tutar, maddi duran varlığın maliyet bedelinden ya da yeniden değerleme sonrası bulunan tutarından
      kalıntı değerin indirilmesi suretiyle belirlenir. ... Amortisman işlemine, varlık yönetim tarafından amaçlanan kullanıma
      hazır hale geldiği tarih itibarıyla başlanır ... Doğrusal yöntemde, varlığın kalıntı değeri değişmediği sürece, amortisman
      gideri faydalı ömrü boyunca sabittir.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'amortismana_tabi = 1200000 - 200000

      yillik = amortismana_tabi / 5

      sonuc = yillik * 6 / 12

      '
  durum: taslak
