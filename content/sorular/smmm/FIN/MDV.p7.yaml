    dogru_neden: 'Amortismana tabi tutar = 900.000 − 100.000 = 800.000 TL. Birim amortisman = 800.000 / 400.000 = 2 TL/birim.
      2026 amortismanı = 80.000 × 2 = 160.000 TL.

      '
    celdiriciler:
      B: Kalıntı değer düşülmeden (900.000 / 400.000 × 80.000) hesaplanmıştır.
      C: Toplam kapasite yerine yanlış payda kullanılmıştır.
      D: Yanlış amortismana tabi tutar veya oran hatası.
      E: Kalıntı değer dikkate alınmadan ve yanlış kapasite ile hesaplanmıştır.
    hesap_adimlari:
    - 'Amortismana tabi tutar: 900.000 − 100.000 = 800.000 TL'
    - 'Birim amortisman: 800.000 / 400.000 = 2 TL'
    - '2026: 80.000 × 2 = 160.000 TL'
