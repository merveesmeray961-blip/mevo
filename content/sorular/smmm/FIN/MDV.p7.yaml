    C: Normal amortisman başladıktan sonra yalnızca kalan değer beş eşit parçaya bölünerek azalan bakiyelere geçilir.
    D: Normal amortisman başladıktan sonra azalan bakiyelere geçiş serbesttir ve geçmiş dönem amortismanları yeniden hesaplanır.
