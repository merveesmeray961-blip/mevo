    alinti: Gayrimenkullerin, elektrik üretim ve dağıtım varlıklarının ve gemilerin iktisadî kıymetlerini artıran
      ve 272 nci maddede yazılı özel maliyet bedelleri, kira veya işletme hakkı süresine göre eşit yüzdelerle itfa
      edilir.
