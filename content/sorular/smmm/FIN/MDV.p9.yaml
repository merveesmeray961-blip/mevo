- id: SMMM-FIN-MDV-0034
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: özel maliyetler
  tip: hesaplama
  zorluk: 3
  kok: (C) A.Ş., 6 yıllık kira süresi bulunan bir işyerinde normal bakım ve temizlik dışındaki, gayrimenkulün ekonomik değerini
    sürekli artıran ve kira sonunda mal sahibine bırakılacak 300.000 TL tutarında bir harcama yapmıştır. Tekdüzen Muhasebe
    Sistemi esas alındığında bu özel maliyetin amortisman süresi ve yıllık itfa tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: 3 yıl; 100.000 TL
    B: 4 yıl; 75.000 TL
    C: 5 yıl; 60.000 TL
    D: 6 yıl; 50.000 TL
    E: 10 yıl; 30.000 TL
  dogru: C
  aciklama:
    dogru_neden: '264 Özel Maliyetler hesabı, kiralanan gayrimenkulün ekonomik değerini artıran ve kira sonunda mal sahibine
      bırakılacak bu tür harcamaları kapsar. Kaynağa göre kira süresi beş yıldan fazla olduğunda harcama beş yılda eşit tutarlarla
      amorti edilir. 300.000 / 5 = 60.000 TL yıllık itfa tutarıdır. Püf noktaları: Kira süresi 6 yıl olduğu için beş yıllık
      özel maliyet itfa sınırı uygulanır; doğrudan altı yıla bölünmez.'
    celdiriciler:
      A: 300.000 TL'nin üç yıla bölünmesi için kaynakta bir dayanak yoktur.
      B: Dört yıllık süre, verilen kira süresinden veya kaynakta belirtilen beş yıllık kuraldan çıkmaz.
      D: Kira süresinin tamamını altı yıl almak, beş yıldan uzun kira süresi için özel maliyet kuralını gözden kaçırır.
      E: On yıllık itfa süresi kaynakta öngörülmemiştir.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 264. Özel Maliyetler — İşleyişi
    alinti: 'Kiralanan gayrimenkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla yapılan
      giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için yapılıp kira süresinin
      sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar. İşleyişi : Yapılan harcamalar hesaba borç kaydedilir.
      Bu harcamalar kira süresi içerisinde, kira süresinin beş yıldan fazla olması durumunda da beş yılda eşit tutarlarla,
      amorti edilir.'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 300000 / 5
  durum: geri_cekildi
