- id: SMMM-FIN-MDV-0037
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: TMS 16 yeniden değerleme ve bileşen
  tip: hesaplama
  zorluk: 3
  kok: Bir maddi duran varlığın ilk maliyeti 150.000 ₺'dır. Bunun 40.000 ₺'lık önemli bir parçasının faydalı ömrü
    4 yıl, kalan 110.000 ₺'lık kısmın faydalı ömrü 10 yıldır; kalıntı değer yoktur ve doğrusal amortisman uygulanmaktadır.
    İkinci yılın sonunda varlık yeniden değerlenmiş ve gerçeğe uygun değeri 132.000 ₺ bulunmuştur. Buna göre yeniden
    değerleme sonucu oluşan artış kaç TL'dir?
  secenekler:
    A: 2.000 ₺
    B: 12.000 ₺
    C: 24.000 ₺
    D: 57.000 ₺
    E: 132.000 ₺
  dogru: C
  aciklama:
    dogru_neden: BOBİ FRS 12.22'ye göre önemli parça ayrı amortismana tâbi tutulur. İkinci yıl sonunda 40.000 ₺'lık
      parçanın defter değeri 20.000 ₺, 110.000 ₺'lık kısmın defter değeri 88.000 ₺, toplam defter değeri 108.000
      ₺'dır. Yeniden değerleme artışı 132.000 − 108.000 = 24.000 ₺'dır.
    celdiriciler:
      A: 2.000 ₺, 110.000 ₺'lık kısmın amortismana tâbi tutulmaması durumunda bulunur (defter değeri 20.000 + 110.000
        = 130.000 ₺).
      B: 12.000 ₺, tüm varlığın tek bir 10 yıllık ömürle amortismana tâbi tutulmasıyla bulunur (defter değeri 120.000
        ₺); parça ayrı amortismana tâbi tutulmamıştır.
      D: 57.000 ₺, tüm varlığın tek bir 4 yıllık ömürle amortismana tâbi tutulmasıyla bulunur (defter değeri 75.000
        ₺).
      E: 132.000 ₺ gerçeğe uygun değerin kendisidir; artış, bu değer ile defter değeri arasındaki farktır.
    hesap_adimlari:
    - 'Parça: 40.000 / 4 = 10.000 ₺/yıl → 2 yıl sonra defter değeri 20.000 ₺'
    - 'Kalan kısım: 110.000 / 10 = 11.000 ₺/yıl → 2 yıl sonra defter değeri 88.000 ₺'
    - Toplam defter değeri = 20.000 + 88.000 = 108.000 ₺
    - Artış = 132.000 − 108.000 = 24.000 ₺
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS), Bölüm 12
    madde: '12.22'
    alinti: Bir maddi duran varlığın önemli bir parçası, maddi duran varlıktan farklı bir faydalı ömre sahip olabilir
      ve/veya bu parça için maddi duran varlık için kullanılan amortisman yönteminden farklı bir amortisman yöntemi
      kullanılması gerekli olabilir. Bu durumda bu tür önemli parçalar ayrı bir şekilde amortismana tâbi tutulur.
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS), Bölüm 12
    madde: '12.16'
    alinti: İlk kayda almadan sonra bir maddi duran varlık yeniden değerlenmiş tutarı üzerinden ölçüldüğünde ölçüme
      esas alınacak değer, yeniden değerlemenin yapıldığı tarihteki gerçeğe uygun değerdir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'parca1 = 40000 - 2 * (40000 / 4)

      parca2 = 110000 - 2 * (110000 / 10)

      defter = parca1 + parca2

      sonuc = 132000 - defter'
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 5).'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R4: bozuk kök cümlesi onarıldı (hesaplanan tutar ifadesi kaldırıldı); çeldiriciler
          tek ömür / amortismansız parça gibi tipik hatalarla yazıldı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_FIN.yaml, satır ChatGPT_FIN-2026-10-08v2-G01 #5'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-18'
    kim: hakem
    ne: düzeltildi
    neden: 'R4: bozuk kök cümlesi onarıldı (hesaplanan tutar ifadesi kaldırıldı); çeldiriciler tek ömür / amortismansız
