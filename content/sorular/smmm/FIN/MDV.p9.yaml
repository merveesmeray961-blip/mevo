- id: SMMM-FIN-MDV-0076
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: satış ve takas
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme net defter değeri 420.000 TL olan bir makineyi takas ederek başka bir makine edinmiştir. Takas sırasında
    ayrıca 80.000 TL nakit ödeme yapılmıştır. BOBİ FRS 12.12'ye göre, başka bir ölçüm bilgisi verilmediğinde edinilen yeni
    makinenin maliyeti kaç TL kabul edilir?
  secenekler:
    A: 340.000 TL
    B: 420.000 TL
    C: 500.000 TL
    D: 80.000 TL
    E: 580.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Takas işleminde edinilen maddi duran varlığın maliyeti, elden çıkarılan parasal olmayan kalemin net defter
      değeri esas alınarak belirlenir. Parasal kalem de ödenmişse, ödenen parasal kalemin gerçeğe uygun değeri net defter
      değerine eklenir. Bu nedenle 420.000 + 80.000 = 500.000 TL''dir. Püf noktaları: Takas bedelinin tamamını tek başına
      esas almak yerine önce elden çıkarılan varlığın net defter değeri, sonra ödenen parasal kalem dikkate alınır.'
    celdiriciler:
      A: 420.000 TL'den 80.000 TL çıkarılmıştır; nakit ödeme maliyete eklenmelidir.
      B: Parasal ödeme dikkate alınmamıştır.
      D: Yalnız nakit ödeme esas alınmıştır; elden çıkarılan makinenin net defter değeri de maliyete girer.
      E: 580.000 TL, net defter değerine nakit ödemenin iki kez eklenmesine yol açar.
    hesap_adimlari:
    - Elden çıkarılan makinenin net defter değeri = 420.000 TL.
    - Ödenen parasal kalem = 80.000 TL.
    - Yeni makinenin maliyeti = 420.000 + 80.000 = 500.000 TL.
  kaynaklar:
  - mevzuat: BOBİ FRS Bölüm 12, Maddi Duran Varlıklar
