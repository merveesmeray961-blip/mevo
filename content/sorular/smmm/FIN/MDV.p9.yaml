  kok: Bir işletme kiraladığı bir gayrimenkulde 180.000 ₺ olağan bakım-onarım, 260.000 ₺ binanın ekonomik değerini
    devamlı artıran düzenleme ve 140.000 ₺ işletmenin faaliyetini yürütmesi için oluşturduğu tesisata ilişkin harcama
    yapmıştır. VUK md. 272 bakımından bu üç harcamanın sınıflandırılması için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: 180.000 ₺, 260.000 ₺ ve 140.000 ₺'nın tamamı özel maliyet bedeli olarak aktifleştirilir.
    B: 180.000 ₺ ile 260.000 ₺ özel maliyet bedelidir; 140.000 ₺ gider yazılır.
    C: 180.000 ₺ gider yazılır; 260.000 ₺ ve 140.000 ₺ özel maliyet bedeli sayılır.
    D: 260.000 ₺ gider yazılır; 180.000 ₺ ve 140.000 ₺ özel maliyet bedelidir.
    E: 180.000 ₺ ve 260.000 ₺ gider yazılır; 140.000 ₺ özel maliyet bedelidir.
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 272, normal bakım, tamir ve temizleme giderlerini maliyet artışı kapsamından ayırır. Buna
      karşılık kiralanan gayrimenkulün iktisadi kıymetini devamlı artıran giderler özel maliyet bedeli olarak ayrıca
      değerlenir; kiracının faaliyetini yürütmek için oluşturduğu tesisata ait giderler de aynı hükme tabidir. Bu
      nedenle 180.000 ₺ gider, 260.000 ₺ ve 140.000 ₺ özel maliyet bedelidir. Püf noktaları: Önce olağan bakım-onarımı
      ayırmak, sonra kiralanan taşınmazdaki değer artırıcı ve faaliyet tesisatı harcamalarını özel maliyet kapsamına
      almak gerekir.'
    celdiriciler:
      A: Olağan bakım-onarım giderleri özel maliyet bedeline alınmaz.
      B: Faaliyet için oluşturulan tesisata ait 140.000 ₺ de özel maliyet hükmündedir.
      D: Değer artırıcı 260.000 ₺ özel maliyet kapsamındadır; olağan bakım gideri değildir.
      E: 260.000 ₺ değer artırıcı düzenleme de özel maliyet bedelidir.
