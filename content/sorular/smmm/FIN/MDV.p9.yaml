  aciklama:
    dogru_neden: BOBİ FRS 12.4, ekonomik ömrü uzatan veya kapasiteyi genişleterek gelecekteki faydayı artıran harcamaların
      ve tanımı karşılamaları durumunda büyük çaplı kontrol harcamalarının defter değerine dâhil edileceğini belirtir.
      Olağan bakım ve onarım giderleri ise 12.15 uyarınca maliyete dâhil edilmez. Dolayısıyla I, II ve IV dâhil
      edilir.
    celdiriciler:
      A: Yalnız I eksiktir; kapasiteyi genişleten (II) ve tanımı karşılayan büyük çaplı kontrol (IV) harcamaları
        da defter değerine dâhil edilir.
      B: I ve II doğrudur ancak IV eksiktir; tanımı karşılayan büyük çaplı kontrol harcamaları 12.4 kapsamındadır.
      C: III olağan bakım ve onarım olduğundan maliyete dâhil edilmez; ayrıca I ve IV de dâhil edilir.
      D: III maliyete dâhil edilmediği için bu kombinasyon yanlıştır; ayrıca II de aktifleştirilir.
