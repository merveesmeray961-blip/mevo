  tip: kavrama
  zorluk: 1
  kok: 'Bir işletmenin kullandığı maddi duran varlıklarla ilgili aşağıdaki harcamalardan hangileri BOBİ FRS''ye
    göre varlığın defter değerine dâhil edilir?

    I. Varlığın ekonomik ömrünü uzatan harcama.

    II. Varlığın kapasitesini genişleten harcama.

    III. Olağan bakım ve onarım gideri.

    IV. Maddi duran varlık tanımını karşılayan büyük çaplı kontrol harcaması.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I, III ve IV
    E: I, II ve IV
