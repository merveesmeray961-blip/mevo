  konu: MDV
  kazanim: özel maliyetler
  tip: hesaplama
  zorluk: 3
  kok: (K) Ltd. Şti. kiraladığı bir taşınmazın ekonomik değerini artırmak amacıyla 600.000 TL harcama yapmış ve bu harcamanın
    özel maliyet bedeli olduğu kabul edilmiştir. Kira süresi 5 yıldır. İşletme 3. yılın sonunda taşınmazı boşaltırsa, henüz
    itfa edilmemiş özel maliyet tutarı nasıl giderleştirilir?
  secenekler:
    A: Kalan tutar sonraki iki yıla yayılır.
    B: Kalan tutar boşaltmanın gerçekleştiği yılda bir defada gider yazılır.
    C: Kalan tutar 520 hesabına aktarılır.
    D: Kalan tutar yalnız kira süresi sonunda gider yazılır.
    E: Kalan tutar gider yazılamaz.
  dogru: B
  aciklama:
    dogru_neden: 'Özel maliyet bedeli kira süresine göre eşit yüzdelerle itfa edilir; kira süresi dolmadan taşınmaz boşaltılırsa
      henüz itfa edilmemiş giderler boşaltma yılında bir defada gider yazılır. 600.000 / 5 = 120.000 TL yıllık itfa; 3 yılda
      360.000 TL, kalan 240.000 TL''dir. Püf noktaları: Erken boşaltma, kalan itfanın aynı yılda giderleşmesini doğurur.'
    celdiriciler:
      A: Erken boşaltma halinde sonraki yıllara yayma yapılmaz.
      C: Özel maliyet bedeli 520 sermaye yedeğine aktarılmaz.
      D: Kira süresinin sonu beklenmez.
      E: Kaynak kalan tutarın gider yazılmasını açıkça düzenler.
    hesap_adimlari:
    - 600.000 / 5 = 120.000 TL yıllık itfa
    - 3 × 120.000 = 360.000 TL itfa
    - 600.000 − 360.000 = 240.000 TL kalan
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 327
    alinti: Gayrimenkullerin, elektrik üretim ve dağıtım varlıklarının ve gemilerin iktisadî kıymetlerini artıran ve 272 nci
      maddede yazılı özel maliyet bedelleri, kira veya işletme hakkı süresine göre eşit yüzdelerle itfa edilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 327
    alinti: Kira veya işletme hakkı süresi dolmadan, kiralanan veya işletme hakkı alınan şeyin boşaltılması veya işletme hakkının
      herhangi bir sebepten sona ermesi halinde henüz itfa edilmemiş olan giderler, boşaltma veya hakkın sona erdiği yılda
      bir defada gider yazılır.
