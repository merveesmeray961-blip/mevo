- id: SMMM-FIN-MDV-0037
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: TMS 16 yeniden değerleme ve bileşen
  tip: hesaplama
  zorluk: 3
  kok: Bir maddi duran varlığın ilk maliyeti 150.000 TL'dir. Bunun 40.000 TL'lik önemli bir parçasının faydalı ömrü 4 yıl,
    kalan 110.000 TL'lik kısmın faydalı ömrü 10 yıldır ve doğrusal amortisman uygulanmaktadır. İkinci yılın sonunda yeniden
    değerleme yapılmadan önceki defter değeri üzerinden hesaplanan tutar ile yeniden değerleme tarihindeki gerçeğe uygun değer
    132.000 TL'dir. Buna göre yeniden değerleme sonucu oluşan artış kaç TL'dir?
  secenekler:
    A: 18.000 TL
    B: 20.000 TL
    C: 24.000 TL
    D: 28.000 TL
    E: 30.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Önemli parça ayrı amortismana tabi tutulur. İkinci yıl sonunda 40.000 TL''lik parçanın defter değeri 20.000
      TL, 110.000 TL''lik kısmın defter değeri 88.000 TL ve toplam defter değeri 108.000 TL''dir. Yeniden değerleme tarihindeki
      gerçeğe uygun değer 132.000 TL olduğundan artış 24.000 TL''dir. Püf noktaları: Önemli parçayı tek bir faydalı ömürle
      amortismana tabi tutmak, yeniden değerleme öncesi defter değerini olduğundan farklı çıkarır.'
    celdiriciler:
      A: 18.000 TL, parçaların ikinci yıl sonundaki toplam defter değerinin hatalı hesaplanmasıyla elde edilir.
      B: 20.000 TL, 40.000 TL'lik önemli parçanın kalan defter değerinin yeniden değerleme artışı sanılması hatasıdır.
      D: 28.000 TL, 110.000 TL'lik kısmın amortismanının eksik hesaplanması sonucudur.
      E: 30.000 TL, başlangıç maliyetinin yeniden değerleme artışı olarak alınması hatasına dayanır.
    hesap_adimlari:
    - 'Önemli parçanın yıllık amortismanı: 40.000 / 4 = 10.000 TL; ikinci yıl sonu defter değeri: 40.000 - 20.000 = 20.000
      TL.'
    - 'Kalan kısmın yıllık amortismanı: 110.000 / 10 = 11.000 TL; ikinci yıl sonu defter değeri: 110.000 - 22.000 = 88.000
      TL.'
    - 'Toplam yeniden değerleme öncesi defter değeri: 20.000 + 88.000 = 108.000 TL.'
    - 'Yeniden değerleme artışı: 132.000 - 108.000 = 24.000 TL.'
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS), Bölüm 12
    madde: '12.22'
    alinti: Bir maddi duran varlığın önemli bir parçası, maddi duran varlıktan farklı bir faydalı ömre sahip olabilir ve/veya
      bu parça için maddi duran varlık için kullanılan amortisman yönteminden farklı bir amortisman yöntemi kullanılması gerekli
      olabilir. Bu durumda bu tür önemli parçalar ayrı bir şekilde amortismana tâbi tutulur.
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS), Bölüm 12
    madde: '12.16'
    alinti: İlk kayda almadan sonra bir maddi duran varlık yeniden değerlenmiş tutarı üzerinden ölçüldüğünde ölçüme esas alınacak
      değer, yeniden değerlemenin yapıldığı tarihteki gerçeğe uygun değerdir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'parca1 = 40000 - 2 * (40000 / 4)

      parca2 = 110000 - 2 * (110000 / 10)

      defter = parca1 + parca2

      sonuc = 132000 - defter'
  durum: kontrolde
  surum: 1
