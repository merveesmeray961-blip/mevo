      da yeniden değerlemeye tabi tutulması gerekir.
    D: Maddi duran varlığın önemli bir parçası farklı faydalı ömre sahipse veya farklı amortisman yöntemi gerekiyorsa, bu
      parça ayrı amortismana tabi tutulabilir.
