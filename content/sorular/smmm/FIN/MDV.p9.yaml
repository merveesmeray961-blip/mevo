  kok: (K) A.Ş.'nin amortismana tabi bir makinesi yangında tamamen zarar görmüştür. Makinenin amortisman sonrası değeri 420.000
    TL, sigorta tazminatı 500.000 TL'dir. İşletme, makinenin yerine benzer bir iktisadi kıymet edinmek üzere teşebbüse geçmiş
    ve tazminat fazlasını geçici hesapta tutmuştur. Tazminatın alındığı tarihi izleyen üçüncü takvim yılının sonuna kadar
    yeni kıymet edinilmezse aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Tazminat fazlası 80.000 TL süresiz olarak geçici hesapta tutulur.
    B: Tazminat fazlası 80.000 TL tazminatın alındığı yılı izleyen üçüncü takvim yılının kâr ve zarar hesabına eklenir.
    C: Tazminatın tamamı olan 500.000 TL üçüncü yıl sonunda kâr ve zarar hesabına eklenir.
    D: Yalnız makinenin amortisman sonrası değeri olan 420.000 TL üçüncü yıl sonunda kâr ve zarar hesabına eklenir.
    E: Tazminat fazlası 80.000 TL dördüncü takvim yılının sonuna kadar geçici hesapta tutulur.
  dogru: B
  aciklama:
    dogru_neden: Sigorta tazminatı makinenin amortisman sonrası değerini 80.000 TL aşmaktadır. VUK md. 329 uyarınca yenileme
      için teşebbüse geçilmişse tazminat fazlası, tazminatın alındığı tarihi takip eden üçüncü takvim yılının sonuna kadar
      geçici hesapta tutulabilir; bu sürede yenileme gerçekleşmezse fazlalık ilgili yılın kâr ve zarar hesabına eklenir.
    celdiriciler:
      A: Geçici hesapta tutma süresi sınırsız değildir; üçüncü takvim yılının sonu ile sınırlıdır.
      C: Kâr veya zarara girecek tutar tazminatın tamamı değil, makinenin amortisman sonrası değerini aşan 80.000 TL'lik fazlalıktır.
      D: 420.000 TL makinenin amortisman sonrası değeridir; kâr veya zarara aktarılacak olan tazminat fazlasıdır.
      E: Kaynak metin dördüncü takvim yılının sonuna kadar ek süre öngörmemektedir.
