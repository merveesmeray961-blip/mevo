- id: SMMM-FIN-MDV-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: Özel maliyetler — kiralanan gayrimenkul için yapılan harcamanın aktifleştirilmesi (264)
  tip: uygulama
  zorluk: 1
  soru_bicimi: yevmiye
  kok: "(N) Ticaret A.Ş., 4 yıllığına kiraladığı mağazanın ekonomik değerini sürekli olarak artıran ve kira süresi
    sonunda mal sahibine bırakılacak olan kalıcı bir tadilat yaptırmıştır. Tadilat bedeli 250.000 ₺ + %20 KDV olup
    banka hesabından ödenmiştir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.\n\nBu harcamanın kaydı
    aşağıdakilerden hangisidir?"
  secenekler:
    A: "Borç: 252 Binalar 250.000\nBorç: 191 İndirilecek KDV 50.000\nAlacak: 102 Bankalar 300.000"
    B: "Borç: 770 Genel Yönetim Giderleri 250.000\nBorç: 191 İndirilecek KDV 50.000\nAlacak: 102 Bankalar 300.000"
    C: "Borç: 264 Özel Maliyetler 300.000\nAlacak: 102 Bankalar 300.000"
    D: "Borç: 258 Yapılmakta Olan Yatırımlar 250.000\nBorç: 191 İndirilecek KDV 50.000\nAlacak: 102 Bankalar 300.000"
    E: "Borç: 264 Özel Maliyetler 250.000\nBorç: 191 İndirilecek KDV 50.000\nAlacak: 102 Bankalar 300.000"
  dogru: E
  aciklama:
    dogru_neden: THP'ye göre kiralanan gayrimenkullerin ekonomik değerini sürekli olarak artırmak amacıyla yapılan ve
      kira süresi sonunda mal sahibine bırakılacak harcamalar 264 Özel Maliyetler hesabına borç kaydedilir. Faturada
      gösterilen KDV (250.000 × %20 = 50.000 ₺) maliyete eklenmez, 191 İndirilecek KDV hesabına borç yazılır; bankadan
      ödenen 300.000 ₺ 102 Bankalar hesabına alacak kaydedilir.
    celdiriciler:
      A: Mağaza işletmenin mülkü değildir; kiracının kiralanan gayrimenkule yaptığı harcama 252 Binalar'da değil 264 Özel
        Maliyetler'de izlenir.
      B: Harcama normal bakım-onarım değil, ekonomik değeri sürekli artıran bir harcamadır; THP bunu gider değil 264
        hesabında aktifleştirilecek bir varlık olarak tanımlar.
      C: İndirilebilir KDV maliyete eklenmiştir; KDV 191 İndirilecek KDV hesabında ayrıca izlenir ve özel maliyet bedeli
        250.000 ₺'dir.
      D: 258 hesabı yapımı süren yatırımlar içindir ve tamamlandığında ilgili maddi duran varlık hesabına aktarılır;
        tamamlanmış, kiralanan yerde yapılan tadilat doğrudan 264'te izlenir.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 264 Özel Maliyetler
    alinti: 'Kiralanan gayrimenkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla yapılan
      giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için yapılıp kira
      süresinin sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar. İşleyişi: Yapılan harcamalar
      hesaba borç kaydedilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 191 İndirilecek KDV
    alinti: Her türlü mal ve hizmetin satın alınması sırasında satıcılara ödenen katma değer vergisinin kaydedildiği ve
      izlendiği hesaptır.
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-FIN-MDV-0002
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: TMS 16 yeniden değerleme modeli — orantılı yöntem ve kıst amortisman
  tip: hesaplama
  zorluk: 3
  soru_bicimi: yevmiye
  kok: "TMS 16 Maddi Duran Varlıklar standardında yeniden değerleme modelini uygulayan (P) A.Ş. ile ilgili bilgiler
    şöyledir:\n\n- Bir makine 01.07.2022 tarihinde 400.000 ₺'ye edinilmiş ve aynı gün kullanıma hazır hâle gelmiştir.\n-
    Yararlı ömür 10 yıl, kalıntı değer sıfırdır; doğrusal amortisman ay esasına göre (kıst) uygulanmaktadır.\n- Makine
    daha önce hiç yeniden değerlenmemiştir. 31.12.2026 tarihinde, 2026 yılı amortismanı kaydedildikten sonra makinenin
    gerçeğe uygun değeri 330.000 ₺ olarak belirlenmiştir.\n- Kalan yararlı ömür tahmini değişmemiştir.\n- Şirket,
    birikmiş amortismanı brüt defter değerindeki değişimle orantılı olarak düzeltmektedir (TMS 16 par. 35(a)).\n- Vergi
    etkileri dikkate alınmayacaktır.\n\nBuna göre 31.12.2026 tarihli yeniden değerleme kaydı aşağıdakilerden hangisidir?"
  secenekler:
    A: "Borç: 257 Birikmiş Amortismanlar 180.000\nAlacak: 253 Tesis, Makine ve Cihazlar 70.000\nAlacak: 522 M.D.V. Yeniden
      Değerleme Artışları 110.000"
    B: "Borç: 253 Tesis, Makine ve Cihazlar 150.000\nAlacak: 257 Birikmiş Amortismanlar 60.000\nAlacak: 522 M.D.V. Yeniden
      Değerleme Artışları 90.000"
    C: "Borç: 253 Tesis, Makine ve Cihazlar 200.000\nAlacak: 257 Birikmiş Amortismanlar 90.000\nAlacak: 522 M.D.V. Yeniden
      Değerleme Artışları 110.000"
    D: "Borç: 253 Tesis, Makine ve Cihazlar 200.000\nAlacak: 257 Birikmiş Amortismanlar 90.000\nAlacak: 649 Diğer Olağan
      Gelir ve Kârlar 110.000"
    E: "Borç: 253 Tesis, Makine ve Cihazlar 200.000\nAlacak: 522 M.D.V. Yeniden Değerleme Artışları 200.000"
  dogru: C
  aciklama:
    dogru_neden: 'Soru üç tekniği birleştirir: çok adımlı hesap (kıst amortisman → net defter değeri → oran), yakın kavram
      ayrımı (par. 35(a) orantılı yöntem ile par. 35(b) eliminasyon yöntemi) ve tipik hata çeldiricileri. Birinci tuzak
      ilk yılın yarım yıl olmasıdır: 01.07.2022–31.12.2026 arası 4,5 yıl, birikmiş amortisman 4,5 × 40.000 = 180.000 ₺,
      net defter değeri 220.000 ₺. Gerçeğe uygun değer 330.000 ₺ olduğundan artış 110.000 ₺, oran 330.000 / 220.000 =
      1,5''tir. Orantılı yöntemde brüt değer 400.000''den 600.000''e (+200.000), birikmiş amortisman 180.000''den 270.000''e
      (+90.000) çıkarılır. İkinci tuzak artışın yeridir: daha önce kâr veya zarara yansıtılmış bir azalış olmadığından
      TMS 16 par. 39 uyarınca artış diğer kapsamlı gelirde muhasebeleştirilip özkaynakta (THP 522) toplanır.'
    celdiriciler:
      A: Bu kayıt par. 35(b) eliminasyon yöntemidir (birikmiş amortisman brüt değerle netleştirilip brüt değer 330.000'e
        indirilir); kökte şirketin orantılı yöntemi uyguladığı belirtilmiştir.
      B: Kıst amortisman göz ardı edilip 4 tam yıl (160.000 ₺) birikmiş amortisman alınmıştır; net değer 240.000 ₺ ve
        oran 1,375 bulunmuş, tüm tutarlar hatalı çıkmıştır.
      D: Daha önce gidere yazılmış bir değer azalışı bulunmadığından artış gelir tablosuna (649) değil, TMS 16 par. 39
        uyarınca özkaynakta yeniden değerleme artışı olarak (522) izlenir.
      E: Birikmiş amortisman düzeltilmemiş, net defter değerindeki artış yerine brüt değerdeki artış özkaynağa alınmıştır;
        kayıt sonrası net değer 600.000 − 180.000 = 420.000 ₺ olur ve gerçeğe uygun değere (330.000 ₺) eşit olmaz.
    hesap_adimlari:
    - 'Yıllık amortisman = 400.000 / 10 = 40.000 ₺; süre 01.07.2022–31.12.2026 = 4,5 yıl'
    - 'Birikmiş amortisman = 4,5 × 40.000 = 180.000 ₺; net defter değeri = 400.000 − 180.000 = 220.000 ₺'
    - 'Yeniden değerleme artışı = 330.000 − 220.000 = 110.000 ₺; oran = 330.000 / 220.000 = 1,5'
    - 'Yeni brüt değer = 400.000 × 1,5 = 600.000 → 253 borç 200.000 ₺'
    - 'Yeni birikmiş amortisman = 180.000 × 1,5 = 270.000 → 257 alacak 90.000 ₺'
    - 'Kontrol: 600.000 − 270.000 = 330.000 ₺; 522 alacak 110.000 ₺; borç 200.000 = alacak 90.000 + 110.000'
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 35
    alinti: 'Yeniden değerleme tarihinde, varlık aşağıdaki yöntemlerden birine göre işleme tabi tutulur: (a) Brüt defter
      değeri, varlığın defter değerinin yeniden değerlemesiyle tutarlı bir şekilde düzeltilir. Örneğin, brüt defter değeri
      gözlemlenebilir piyasa verileri dikkate alınarak veya defter değerindeki değişimle orantılı olarak düzeltilebilir.
      Yeniden değerleme tarihindeki birikmiş amortisman, brüt defter değeri ile varlığın birikmiş değer düşüklüğü
      zararlarının dikkate alınmasından sonraki defter değeri arasındaki fark kadar düzeltilir ya da (b) Birikmiş amortisman
      varlığın brüt defter değeri ile netleştirilir.'
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 39
    alinti: Eğer bir varlığın defter değeri yeniden değerleme sonucunda artmışsa, bu artış diğer kapsamlı gelirde
      muhasebeleştirilmelidir ve doğrudan özkaynak hesap grubunda yeniden değerleme değer artışı adı altında toplanmalıdır.
      Ancak, bir yeniden değerleme değer artışı, aynı varlığın daha önce kar ya da zarar ile ilişkilendirilmiş bulunan
      yeniden değerleme değer azalışını tersine çevirdiği ölçüde gelir olarak muhasebeleştirilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 522 M.D.V. Yeniden Değerleme Artışları
    alinti: 'İşletmenin aktifine kayıtlı maddi duran varlık kalemlerinin yeniden değerlenmesinden oluşan değer artışlarının
      izlendiği hesaptır. İşleyişi : Yeniden değerleme net değer artışı ilgili hesaplar karşılığında bu hesaba alacak
      kaydedilir.'
  dogrulama:
    python: |
      maliyet = 400000
      yillik = maliyet / 10
      birikmis = 4.5 * yillik
      net = maliyet - birikmis
      oran = 330000 / net
      brut_artis = maliyet * oran - maliyet
      ba_artis = birikmis * oran - birikmis
      artis = brut_artis - ba_artis
      # ana tutar: 253 hesabına borç (brüt artış); 257 alacak 90.000, 522 alacak 110.000
      assert ba_artis == 90000 and artis == 110000
      sonuc = brut_artis
    secenek_sayisi_bekleniyor: false
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-FIN-MDV-0003
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: TMS 16 üretim miktarı yöntemiyle amortisman
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "TMS 16'yı uygulayan (R) A.Ş., 01.01.2025 tarihinde kullanıma hazır hâle gelen bir pres makinesini 550.000 ₺'ye
    edinmiştir. Makinenin kalıntı değeri 50.000 ₺, yararlı ömrü 5 yıl, ömrü boyunca üretebileceği toplam miktar 100.000
    birim olarak tahmin edilmiştir. Şirket, ekonomik yararların tüketim biçimini en iyi yansıttığı için üretim miktarı
    yöntemini kullanmaktadır. Makineyle 2025 yılında 30.000 birim, 2026 yılında 24.000 birim üretim yapılmıştır.\n\nBuna
    göre makine için 2026 yılında ayrılacak amortisman tutarı kaç TL'dir?"
  secenekler:
    A: 100.000 ₺
    B: 110.000 ₺
    C: 120.000 ₺
    D: 132.000 ₺
    E: 150.000 ₺
  dogru: C
  aciklama:
    dogru_neden: TMS 16 par. 62'ye göre üretim miktarı yönteminde amortisman beklenen üretim miktarı üzerinden ayrılır;
      par. 53'e göre amortismana tabi tutar kalıntı değer düşülerek belirlenir. Amortismana tabi tutar 550.000 − 50.000 =
      500.000 ₺; birim başına amortisman 500.000 / 100.000 = 5 ₺. 2026 amortismanı 24.000 × 5 = 120.000 ₺'dir. Yararlı
      ömrün yıl olarak verilmesi bu yöntemde sonucu etkilemez.
    celdiriciler:
      A: Doğrusal yöntem uygulanmıştır (500.000 / 5); kökte şirketin üretim miktarı yöntemini kullandığı belirtilmiştir.
      B: Hem doğrusal yöntem uygulanmış hem de kalıntı değer düşülmemiştir (550.000 / 5).
      D: Kalıntı değer düşülmeden birim amortisman 5,5 ₺ bulunmuştur (550.000 / 100.000 × 24.000); par. 53 kalıntı değerin
        düşülmesini gerektirir.
      E: 2026 yerine 2025 yılı üretimi (30.000 birim × 5 ₺) kullanılmıştır.
    hesap_adimlari:
    - 'Amortismana tabi tutar = 550.000 − 50.000 = 500.000 ₺'
    - 'Birim amortisman = 500.000 / 100.000 = 5 ₺'
    - '2026 amortismanı = 24.000 × 5 = 120.000 ₺'
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 62
    alinti: Bir varlığın amortismana tabi tutarının yararlı ömrü boyunca sistematik olarak dağıtmak için çeşitli amortisman
      yöntemleri kullanılabilir. Bu yöntemler doğrusal amortisman yöntemi, azalan bakiyeler yöntemi, ve üretim miktarı
      yöntemlerini içerir. [...] Üretim miktarı yönteminde beklenen kullanım ya da üretim miktarı üzerinden amortisman
      ayrılır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 53
    alinti: Bir varlığın amortismana tabi tutarı, kalıntı değeri düşülerek belirlenir.
  dogrulama:
    python: |
      birim = (550000 - 50000) / 100000
      sonuc = 24000 * birim
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
