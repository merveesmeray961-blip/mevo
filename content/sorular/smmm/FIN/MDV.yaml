    kim: rotus
    ne: 'Soru zorlaştırıldı: 01.01.2025''te kalan yararlı ömrün 6 yıla revize edilmesi (TMS 16 par. 51 + TMS 8 par.
      36, ileriye dönük tahmin değişikliği) eklendi; doğru kayıt 253 B 260.000 / 257 A 130.000, 522 A 130.000 oldu
      (doğru şık yine C). Eski doğru cevap (tahmin değişikliğini yok sayan 200/90/110) B çeldiricisi yapıldı; A,
      D, E yeni tutarlara uyarlandı; dogru_neden teknikleri ve tuzakları adlandırıyor; hesap_adimlari, dogrulama.python
      ve kaynaklar (par. 51, TMS 8 par. 36) güncellendi; baslangic 2019-01-15 (TMS 16''nın RG''de yeniden yayımı).'
    neden: 'GZ: zor etiketli ama ortalama aday rahat çözdü (güven 4) → zorlaştır; baslangic üretim tarihiydi.'
- id: SMMM-FIN-MDV-0003
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: TMS 16 üretim miktarı yöntemiyle amortisman
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'TMS 16''yı uygulayan (R) A.Ş., 01.01.2025 tarihinde kullanıma hazır hâle gelen bir pres makinesini 550.000
    ₺''ye edinmiştir. Makinenin kalıntı değeri 50.000 ₺, yararlı ömrü 5 yıl, ömrü boyunca üretebileceği toplam miktar
    100.000 birim olarak tahmin edilmiştir. Şirket, ekonomik yararların tüketim biçimini en iyi yansıttığı için
    üretim miktarı yöntemini kullanmaktadır. Makineyle 2025 yılında 30.000 birim, 2026 yılında 24.000 birim üretim
    yapılmıştır.


    Buna göre makine için 2026 yılında ayrılacak amortisman tutarı kaç TL''dir?'
  secenekler:
    A: 100.000 ₺
    B: 110.000 ₺
    C: 120.000 ₺
    D: 132.000 ₺
    E: 150.000 ₺
  dogru: C
  aciklama:
    dogru_neden: TMS 16 par. 62'ye göre üretim miktarı yönteminde amortisman beklenen üretim miktarı üzerinden ayrılır;
      par. 53'e göre amortismana tabi tutar kalıntı değer düşülerek belirlenir. Amortismana tabi tutar 550.000 −
      50.000 = 500.000 ₺; birim başına amortisman 500.000 / 100.000 = 5 ₺. 2026 amortismanı 24.000 × 5 = 120.000
      ₺'dir. Yararlı ömrün yıl olarak verilmesi bu yöntemde sonucu etkilemez.
    celdiriciler:
      A: Doğrusal yöntem uygulanmıştır (500.000 / 5); kökte şirketin üretim miktarı yöntemini kullandığı belirtilmiştir.
      B: Hem doğrusal yöntem uygulanmış hem de kalıntı değer düşülmemiştir (550.000 / 5).
      D: Kalıntı değer düşülmeden birim amortisman 5,5 ₺ bulunmuştur (550.000 / 100.000 × 24.000); par. 53 kalıntı
        değerin düşülmesini gerektirir.
      E: 2026 yerine 2025 yılı üretimi (30.000 birim × 5 ₺) kullanılmıştır.
    hesap_adimlari:
    - Amortismana tabi tutar = 550.000 − 50.000 = 500.000 ₺
    - Birim amortisman = 500.000 / 100.000 = 5 ₺
    - 2026 amortismanı = 24.000 × 5 = 120.000 ₺
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 62
    alinti: Bir varlığın amortismana tabi tutarının yararlı ömrü boyunca sistematik olarak dağıtmak için çeşitli
      amortisman yöntemleri kullanılabilir. Bu yöntemler doğrusal amortisman yöntemi, azalan bakiyeler yöntemi,
      ve üretim miktarı yöntemlerini içerir. [...] Üretim miktarı yönteminde beklenen kullanım ya da üretim miktarı
      üzerinden amortisman ayrılır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 53
    alinti: Bir varlığın amortismana tabi tutarı, kalıntı değeri düşülerek belirlenir.
  dogrulama:
    python: 'birim = (550000 - 50000) / 100000

      sonuc = 24000 * birim

      '
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: gecerlilik.baslangic TMS 16'nın Resmî Gazete'de yeniden yayım tarihine (2019-01-15) çekildi.
    neden: 'Rötuş talimatı md. 3: baslangic soru üretim tarihiydi.'
