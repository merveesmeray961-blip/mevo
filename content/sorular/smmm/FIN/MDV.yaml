  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: Özel maliyetler — kiralanan gayrimenkul için yapılan harcamanın aktifleştirilmesi (264)
  tip: uygulama
  zorluk: 1
  soru_bicimi: yevmiye
  kok: '(N) Ticaret A.Ş., 4 yıllığına kiraladığı mağazanın ekonomik değerini sürekli olarak artıran ve kira süresi
    sonunda mal sahibine bırakılacak olan kalıcı bir tadilat yaptırmıştır. Tadilat bedeli 250.000 ₺ + %20 KDV olup
    banka hesabından ödenmiştir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    Bu harcamanın kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 252 Binalar 250.000

      Borç: 191 İndirilecek KDV 50.000

      Alacak: 102 Bankalar 300.000'
    B: 'Borç: 770 Genel Yönetim Giderleri 250.000

      Borç: 191 İndirilecek KDV 50.000

      Alacak: 102 Bankalar 300.000'
    C: 'Borç: 264 Özel Maliyetler 300.000

      Alacak: 102 Bankalar 300.000'
    D: 'Borç: 258 Yapılmakta Olan Yatırımlar 250.000

      Borç: 191 İndirilecek KDV 50.000

      Alacak: 102 Bankalar 300.000'
    E: 'Borç: 264 Özel Maliyetler 250.000

      Borç: 191 İndirilecek KDV 50.000

      Alacak: 102 Bankalar 300.000'
  dogru: E
  aciklama:
    dogru_neden: THP'ye göre kiralanan gayrimenkullerin ekonomik değerini sürekli olarak artırmak amacıyla yapılan
      ve kira süresi sonunda mal sahibine bırakılacak harcamalar 264 Özel Maliyetler hesabına borç kaydedilir. Faturada
      gösterilen KDV (250.000 × %20 = 50.000 ₺) maliyete eklenmez, 191 İndirilecek KDV hesabına borç yazılır; bankadan
      ödenen 300.000 ₺ 102 Bankalar hesabına alacak kaydedilir.
    celdiriciler:
      A: Mağaza işletmenin mülkü değildir; kiracının kiralanan gayrimenkule yaptığı harcama 252 Binalar'da değil
        264 Özel Maliyetler'de izlenir.
      B: Harcama normal bakım-onarım değil, ekonomik değeri sürekli artıran bir harcamadır; THP bunu gider değil
        264 hesabında aktifleştirilecek bir varlık olarak tanımlar.
      C: İndirilebilir KDV maliyete eklenmiştir; KDV 191 İndirilecek KDV hesabında ayrıca izlenir ve özel maliyet
        bedeli 250.000 ₺'dir.
      D: 258 hesabı yapımı süren yatırımlar içindir ve tamamlandığında ilgili maddi duran varlık hesabına aktarılır;
        tamamlanmış, kiralanan yerde yapılan tadilat doğrudan 264'te izlenir.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 264 Özel Maliyetler
    alinti: 'Kiralanan gayrimenkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla
      yapılan giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için
      yapılıp kira süresinin sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar. İşleyişi : Yapılan
      harcamalar hesaba borç kaydedilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 191 İndirilecek KDV
    alinti: Her türlü mal ve hizmetin satın alınması sırasında satıcılara ödenen katma değer vergisinin kaydedildiği
      ve izlendiği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 258 Yapılmakta Olan Yatırımlar
    alinti: İşletmede, yapımı süren ve tamamlandığında ilgili maddi duran varlık hesabına aktarılacak olan, her
      türlü madde ve malzeme ile işçilik ve genel giderlerle ilgili harcamaların izlendiği hesaptır.
