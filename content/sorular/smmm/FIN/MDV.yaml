- id: SMMM-FIN-MDV-0002
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MDV
  kazanim: TMS 16 yeniden değerleme modeli — orantılı yöntem, kıst amortisman ve yararlı ömür tahmin değişikliği
  tip: hesaplama
  zorluk: 3
  soru_bicimi: yevmiye
  kok: 'TMS 16 Maddi Duran Varlıklar standardında yeniden değerleme modelini uygulayan (P) A.Ş. ile ilgili bilgiler
    şöyledir:


    - Bir makine 01.07.2022 tarihinde 400.000 ₺''ye edinilmiş ve aynı gün kullanıma hazır hâle gelmiştir.

    - Edinim tarihinde yararlı ömür 10 yıl, kalıntı değer sıfır olarak tahmin edilmiştir; doğrusal amortisman ay
    esasına göre (kıst) uygulanmaktadır.

    - 01.01.2025 tarihinde, yeni bilgiler ışığında makinenin kalan yararlı ömrü 6 yıl olarak yeniden tahmin edilmiştir
    (kalıntı değer yine sıfırdır).

    - Makine daha önce hiç yeniden değerlenmemiştir. 31.12.2026 tarihinde, 2026 yılı amortismanı kaydedildikten
    sonra makinenin gerçeğe uygun değeri 330.000 ₺ olarak belirlenmiştir.

    - Şirket, birikmiş amortismanı brüt defter değerindeki değişimle orantılı olarak düzeltmektedir (TMS 16 par.
    35(a)).

    - Vergi etkileri dikkate alınmayacaktır.


    Buna göre 31.12.2026 tarihli yeniden değerleme kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 257 Birikmiş Amortismanlar 200.000

      Alacak: 253 Tesis, Makine ve Cihazlar 70.000

      Alacak: 522 M.D.V. Yeniden Değerleme Artışları 130.000'
    B: 'Borç: 253 Tesis, Makine ve Cihazlar 200.000

      Alacak: 257 Birikmiş Amortismanlar 90.000

      Alacak: 522 M.D.V. Yeniden Değerleme Artışları 110.000'
    C: 'Borç: 253 Tesis, Makine ve Cihazlar 260.000

      Alacak: 257 Birikmiş Amortismanlar 130.000

      Alacak: 522 M.D.V. Yeniden Değerleme Artışları 130.000'
    D: 'Borç: 253 Tesis, Makine ve Cihazlar 260.000

      Alacak: 257 Birikmiş Amortismanlar 130.000

      Alacak: 649 Diğer Olağan Gelir ve Kârlar 130.000'
    E: 'Borç: 253 Tesis, Makine ve Cihazlar 260.000

      Alacak: 522 M.D.V. Yeniden Değerleme Artışları 260.000'
  dogru: C
  aciklama:
    dogru_neden: 'Soru beş tekniği birleştirir: çok adımlı hesap (kıst amortisman → tahmin değişikliği → net defter
      değeri → oran), madde birleştirme (TMS 16 par. 51 ile TMS 8 par. 36; TMS 16 par. 35 ve 39), tarih/süre hesabı
      (ilk yılın yarım yıl olması), yakın kavram ayrımı (par. 35(a) orantılı yöntem ile par. 35(b) eliminasyon yöntemi)
      ve tipik hata çeldiricileri. (1) 01.07.2022–31.12.2024 arası 2,5 yıl × 40.000 = 100.000 ₺ birikmiş amortisman;
      01.01.2025 net defter değeri 300.000 ₺. (2) TMS 16 par. 51 uyarınca yararlı ömürdeki değişiklik TMS 8''e göre
      muhasebe tahmininde değişikliktir ve TMS 8 par. 36 gereği ileriye yönelik yansıtılır: geçmiş amortisman düzeltilmez,
      kalan 300.000 ₺ yeni kalan ömre (6 yıl) dağıtılır; 2025 ve 2026 amortismanı 50.000''er ₺. (3) 31.12.2026 birikmiş
      amortisman 100.000 + 100.000 = 200.000 ₺, net defter değeri 200.000 ₺; gerçeğe uygun değer 330.000 ₺ olduğundan
      artış 130.000 ₺, oran 330.000 / 200.000 = 1,65. (4) Orantılı yöntemde brüt değer 400.000''den 660.000''e (+260.000),
      birikmiş amortisman 200.000''den 330.000''e (+130.000) çıkarılır. (5) Daha önce kâr veya zarara yansıtılmış
      bir azalış olmadığından TMS 16 par. 39 uyarınca artış diğer kapsamlı gelirde muhasebeleştirilip özkaynakta
      (THP 522) toplanır. Tuzaklar: tahmin değişikliğini göz ardı edip ilk tahminle (10 yıl) devam etmek (B), eliminasyon
      yöntemini uygulamak (A) ve artışı gelir tablosuna almak (D).'
    celdiriciler:
      A: 'Bu kayıt par. 35(b) eliminasyon yöntemidir (200.000 ₺ birikmiş amortisman brüt değerle netleştirilip brüt
        değer 330.000 ₺''ye indirilir: 253 alacak 70.000); kökte şirketin orantılı yöntemi uyguladığı belirtilmiştir.'
      B: Yararlı ömür tahminindeki değişiklik göz ardı edilip amortisman ilk tahminle (yıllık 40.000 ₺ × 4,5 yıl
        = 180.000 ₺) hesaplanmıştır; net değer 220.000 ₺ ve oran 1,5 bulunmuştur. TMS 16 par. 51 ve TMS 8 par. 36
        uyarınca 2025'ten itibaren amortisman yeni kalan ömre göre (300.000 / 6 = 50.000 ₺) ayrılır.
      D: Tutarlar doğrudur; ancak daha önce gidere yazılmış bir değer azalışı bulunmadığından artış gelir tablosuna
        (649) değil, TMS 16 par. 39 uyarınca özkaynakta yeniden değerleme artışı olarak (522) izlenir.
      E: Birikmiş amortisman düzeltilmemiş, brüt değerdeki artışın tamamı özkaynağa alınmıştır; kayıt sonrası net
        değer 660.000 − 200.000 = 460.000 ₺ olur ve gerçeğe uygun değere (330.000 ₺) eşit olmaz.
    hesap_adimlari:
    - İlk tahminle yıllık amortisman = 400.000 / 10 = 40.000 ₺; 01.07.2022–31.12.2024 = 2,5 yıl → birikmiş amortisman
      100.000 ₺
    - 01.01.2025 net defter değeri = 300.000 ₺; yeni kalan ömür 6 yıl → yıllık amortisman 50.000 ₺ (ileriye dönük)
    - 31.12.2026 birikmiş amortisman = 100.000 + 2 × 50.000 = 200.000 ₺; net defter değeri = 200.000 ₺
    - Yeniden değerleme artışı = 330.000 − 200.000 = 130.000 ₺; oran = 330.000 / 200.000 = 1,65
    - Yeni brüt değer = 400.000 × 1,65 = 660.000 → 253 borç 260.000 ₺
    - Yeni birikmiş amortisman = 200.000 × 1,65 = 330.000 → 257 alacak 130.000 ₺
    - 'Kontrol: 660.000 − 330.000 = 330.000 ₺; 522 alacak 130.000 ₺; borç 260.000 = alacak 130.000 + 130.000'
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 51
    alinti: Bir varlığın kalıntı değeri ve yararlı ömrü en azından her hesap dönemi sonunda gözden geçirilerek,
      beklentilerin önceki tahminlerden farklı olması durumunda, değişiklik(ler) TMS 8 Muhasebe Politikaları, Muhasebe
      Tahminlerindeki Değişikler ve Hatalar uyrınca muhasebe tahmininde değişiklik olarak muhasebeleştirilir.
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 36
    alinti: '37’nci paragrafın uygulandığı değişiklikler dışında kalan muhasebe tahminindeki bir değişikliğin etkisi,
      aşağıda belirtilen dönemlerin kâr veya zararına dâhil edilmek suretiyle, ileriye yönelik olarak finansal tablolara
      yansıtılır: [...] (b) Değişikliğin yapıldığı dönemle birlikte gelecek dönemleri de etkilemesi durumunda, hem
      değişikliğin yapıldığı dönem hem de gelecek dönemler.'
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 35
    alinti: (a) Brüt defter değeri, varlığın defter değerinin yeniden değerlemesiyle tutarlı bir şekilde düzeltilir.
      Örneğin, brüt defter değeri gözlemlenebilir piyasa verileri dikkate alınarak veya defter değerindeki değişimle
      orantılı olarak düzeltilebilir. Yeniden değerleme tarihindeki birikmiş amortisman, brüt defter değeri ile
      varlığın birikmiş değer düşüklüğü zararlarının dikkate alınmasından sonraki defter değeri arasındaki fark
      kadar düzeltilir ya da (b) Birikmiş amortisman varlığın brüt defter değeri ile netleştirilir.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 39
    alinti: Eğer bir varlığın defter değeri yeniden değerleme sonucunda artmışsa, bu artış diğer kapsamlı gelirde
      muhasebeleştirilmelidir ve doğrudan özkaynak hesap grubunda yeniden değerleme değer artışı adı altında toplanmalıdır.
      Ancak, bir yeniden değerleme değer artışı, aynı varlığın daha önce kar ya da zarar ile ilişkilendirilmiş bulunan
      yeniden değerleme değer azalışını tersine çevirdiği ölçüde gelir olarak muhasebeleştirilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 522 M.D.V. Yeniden Değerleme Artışları
    alinti: 'İşletmenin aktifine kayıtlı maddi duran varlık kalemlerinin yeniden değerlenmesinden oluşan değer artışlarının
      izlendiği hesaptır. İşleyişi : Yeniden değerleme net değer artışı ilgili hesaplar karşılığında bu hesaba alacak
      kaydedilir.'
  dogrulama:
    python: 'maliyet = 400000

      ilk_yillik = maliyet / 10

      ba_2024 = 2.5 * ilk_yillik

      yeni_yillik = (maliyet - ba_2024) / 6

      birikmis = ba_2024 + 2 * yeni_yillik

      net = maliyet - birikmis

      gud = 330000

      brut_artis = maliyet * gud / net - maliyet

      ba_artis = birikmis * gud / net - birikmis

      artis = gud - net

      # ana tutar: 253 hesabına borç (brüt artış); 257 alacak 130.000, 522 alacak 130.000

      assert ba_artis == 130000 and artis == 130000 and brut_artis - ba_artis == artis

      sonuc = brut_artis

      '
    secenek_sayisi_bekleniyor: false
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
