- id: SMMM-FIN-MKY-0058
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Menkul kıymetler ve ortaklık payları
  konu: MKY
  kazanim: değer düşüklüğü karşılığı (119/654/644)
  tip: hesaplama
  zorluk: 3
  kok: AB İşletmesi, 110 Hisse Senetleri hesabında 1.000 adet maliyeti 50 ₺ olan hisse senedi bulundurmaktadır. Bu hisseler
    için 2025 yıl sonunda borsa değerinin sürekli düştüğü tespit edilerek toplam 8.000 ₺ karşılık ayrılmıştır. 31 Aralık 2026'da
    hisselerin borsa değeri adet başına 38 ₺'dir ve değer düşüklüğünün sürekli olduğu anlaşılmıştır. THP'ye göre 2026 yılında
    ilave olarak ayrılacak karşılık tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: 4.000 ₺
    B: 8.000 ₺
    C: 12.000 ₺
    D: 20.000 ₺
    E: 38.000 ₺
  dogru: A
  aciklama:
    dogru_neden: 'THP 119''a göre değer azalışlarının tamamını karşılayacak tutar 119''a alacak, 654''e borç kaydedilir. Toplam
      azalış (50 − 38) × 1.000 = 12.000 ₺; önceki yıl 8.000 ₺ ayrıldığından 2026''da ilave karşılık 4.000 ₺''dir. Püf noktaları:
      Karşılık bakiye mantığıyla tamamlanır; toplam azalış bulunur ve mevcut 119 bakiyesi düşülür.'
    celdiriciler:
      B: 8.000 ₺ önceki yıl ayrılan karşılıktır; ilave karşılık toplam gerekli tutardan bu tutar düşülerek bulunur.
      C: 12.000 ₺ toplam gerekli karşılıktır; önceki yıl ayrılan 8.000 ₺ düşülmelidir.
      D: 20.000 ₺ karşılık ile toplam değer azalışının toplanmasıyla bulunur.
      E: 38.000 ₺ hisselerin yıl sonu borsa değeridir; karşılık tutarı değildir.
    hesap_adimlari:
    - 'Toplam azalış: (50 - 38) × 1.000 = 12.000 ₺'
    - 'İlave karşılık: 12.000 - 8.000 = 4.000 ₺'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 119 Menkul Kıymetler Değer Düşüklüğü Karşılığı
    alinti: Menkul kıymetlerin borsa veya piyasa değerlerinde önemli ölçüde ya da sürekli olarak değer azalması olduğu tespit
      edildiğinde ortaya çıkacak zararların karşılanması amacı ile ayrılması gereken karşılıkların izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 654 Karşılık Giderleri
    alinti: Aktifle ilgili olarak ayrılan karşılık giderlerinin izlendiği hesaptır.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (50 - 38) * 1000 - 8000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: gecti
        not: dogrulama.python doğru şıkla tuttu
        tarih: '2026-11-02'
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: (50−38)×1.000 − 8.000 = 4.000 ₺; THP 119/654 uyumlu.'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-02'
