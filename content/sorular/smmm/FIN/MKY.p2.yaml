  kok: AB İşletmesi, fiyat değişmelerinden yararlanarak kâr elde etmek amacıyla geçici bir süre elde tutmak üzere borsada
    10.000 adet hisse senedini adedi 12 ₺'den satın almış, bedeli bankadan ödemiştir. Aksi belirtilmedikçe Tekdüzen Hesap
    Planı esas alınacak ve KDV dikkate alınmayacaktır. İşletmenin bu işleme ilişkin yapacağı kayıt aşağıdakilerden hangisidir?
  secenekler:
