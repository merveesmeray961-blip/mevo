    C: 'Borç: 242 İştirakler 120.000

      Alacak: 102 Bankalar 120.000'
    D: 'Borç: 111 Özel Kesim Tahvil, Senet ve Bonoları 120.000

      Alacak: 102 Bankalar 120.000'
    E: 'Borç: 102 Bankalar 120.000

      Alacak: 110 Hisse Senetleri 120.000'
