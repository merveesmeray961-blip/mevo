  aciklama:
    dogru_neden: THP 110'a göre geçici olarak elde tutulan hisse senetleri 110 Hisse Senetleri hesabında izlenir; THP 11 işleyişine
      göre edinildiğinde alış bedeli üzerinden borç kaydedilir. 10.000 × 12 = 120.000 ₺'dir.
    celdiriciler:
      B: 240 uzun vadede elde tutulması amaçlanan hisse senetleri içindir; amaç geçici elde tutmaktır.
      C: 242, yönetime ve ortaklık politikalarına katılmak üzere edinilen paylar içindir; amaç fiyat kazancıdır.
      D: 111 özel sektör tahvil, senet ve bonoları içindir; hisse senedi 110'da izlenir.
      E: Kayıt ters yapılmıştır; alışta 110 borç, 102 alacak kaydedilir.
    hesap_adimlari:
    - 'Alış bedeli: 10.000 × 12 = 120.000 ₺'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 110 Hisse Senetleri
    alinti: Geçici olarak, elde tutulan hisse senetleri bu hesapta izlenir.
