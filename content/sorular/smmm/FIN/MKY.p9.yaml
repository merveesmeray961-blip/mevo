- id: SMMM-FIN-MKY-0025
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Menkul kıymetler ve ortaklık payları
  konu: MKY
  kazanim: hisse senedi ve tahvil alım-satımı
  tip: hesaplama
  zorluk: 2
  kok: (K) A.Ş. geçici olarak elde tutmak amacıyla 40.000 TL maliyetle menkul kıymet satın almış ve daha sonra bunları 46.000
    TL'ye satmıştır. Satın alma giderleri ayrıca ilgili gider hesabında izlenmiştir. Satıştan doğan olumlu farkın tutarı ve
    kullanılacak sonuç hesabı hangisidir?
  secenekler:
    A: 6.000 TL; 645 Menkul Kıymet Satış Kârları
    B: 6.000 TL; 655 Menkul Kıymet Satış Zararları
    C: 46.000 TL; 645 Menkul Kıymet Satış Kârları
    D: 40.000 TL; 645 Menkul Kıymet Satış Kârları
    E: 6.000 TL; 646 Kambiyo Kârları
  dogru: A
  aciklama:
    dogru_neden: Menkul kıymetler edinildiğinde alış bedeliyle ilgili menkul kıymet hesabına borç, elden çıkarıldığında aynı
      bedelle alacak kaydedilir. Satış değeri ile maliyet değeri arasındaki olumlu fark 645 hesabına alacak yazılır. 46.000
      − 40.000 = 6.000 TL kârdır.
    celdiriciler:
      B: Olumlu fark zarar değil kârdır; 655 hesabı olumsuz farklar içindir.
      C: 645'e satışın tamamı değil satış değeri ile maliyet arasındaki olumlu fark kaydedilir.
      D: 40.000 TL maliyet tutarıdır; satış kârı 6.000 TL'dir.
      E: Menkul kıymet satış kârı 646 Kambiyo Kârları değil 645 hesabında izlenir.
    hesap_adimlari:
    - Satış kârı = 46.000 − 40.000 = 6.000 TL.
    - Olumlu fark 645 Menkul Kıymet Satış Kârları hesabında izlenir.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 110-118 Menkul Kıymetler Hesaplarının İşleyişi; 645. Menkul Kıymet Satış Kârları
    alinti: Menkul kıymetler edinildiğinde alış bedeli üzerinden yukarıdaki hesaplara borç, elden çıkartıldığında ise, aynı
      bedel ile alacak kaydedilir. Menkul kıymetlerin satınalma giderleri "65. Diğer Faaliyetlerden Olağan Gider Ve Zararlar"
      grubundaki ilgili gider hesabında izlenir. Menkul kıymetlerin satışından doğan zararlar "Diğer Faaliyetlerden Olağan
      Gider ve Zararlar" grubundaki ilgili hesapta; kârlar ise "64. Diğer Faaliyetlerden Olağan Gelir ve Kârlar" grubundaki
      ilgili hesapta izlenir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 645. Menkul Kıymet Satış Kârları — İşleyişi
    alinti: Menkul kıymetler satıldığında, satış değeri ile maliyet değeri arasındaki olumlu fark bu hesaba alacak yazılır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 46000 - 40000
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
