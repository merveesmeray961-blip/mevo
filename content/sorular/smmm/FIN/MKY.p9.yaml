    celdiriciler:
      A: Net dönem kârı açıkça sayılan kaynaklardan biridir.
      B: Serbest yedek akçeler açıkça sayılan kaynaklardan biridir.
      C: Sermaye için faiz ödenemeyeceği md. 509/1'de düzenlenmiştir.
      E: Kâr payı avansı için ayrıca düzenleme öngörülmüştür.
