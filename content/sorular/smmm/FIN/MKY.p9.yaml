    taşımayan hisse senedi, (3) başka bir işletmenin yönetimine katılmak amacıyla edinilmiş ve iştirak niteliğindeki ortaklık
    payı.
  secenekler:
    A: 110 - 240 - 242
    B: 240 - 110 - 242
    C: 110 - 242 - 240
    D: 111 - 240 - 242
    E: 110 - 240 - 245
  dogru: A
  aciklama:
    dogru_neden: 'Geçici olarak elde tutulan hisse senetleri 110''da izlenir. Uzun vadeli tutulması amaçlanan ve iştirak için
      gerekli asgari oranı taşımayan hisse senetleri 240 Bağlı Menkul Kıymetler hesabında; yönetim ve ortaklık politikalarının
      belirlenmesine katılmak amacıyla edinilen iştirak niteliğindeki paylar 242 İştirakler hesabında izlenir. Püf noktaları:
      Belirleyici ayrım yalnız menkul kıymetin türü değil, elde tutma amacı ve iştirak ilişkisinin oluşup oluşmamasıdır.'
    celdiriciler:
      B: İlk geçici hisse senedi 240 değil 110'da izlenir.
      C: İkinci kalem 242 değil, iştirak oranı şartını taşımayan uzun vadeli menkul kıymetler için 240'tır.
      D: 111 özel sektör tahvil, senet ve bonoları içindir; ilk kalem hisse senedidir.
      E: 245 bağlı ortaklıkları ifade eder; üçüncü kalemde iştirak niteliği verilmiştir.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 110, 111 ve 112
    alinti: 110. HİSSE SENETLERİ  Geçici olarak, elde tutulan hisse senetleri bu hesapta izlenir.  111. ÖZEL KESİM TAHVİL,
      SENET VE BONOLARI  Özel sektörün çıkartmış bulunduğu tahvil, senet ve bonolar bu hesapta izlenir.  112. KAMU KESİMİ
      TAHVİL, SENET VE BONOLARI  Kamu tarafından çıkartılmış bulunan tahvil, senet ve bonolar bu hesapta izlenir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 240. Bağlı Menkul Kıymetler
    alinti: İşletmenin, esas faaliyet konusu dışındaki işlemleri dolayısı ile (ödünç verme ve benzer nedenlerle ortaya çıkan)
      iştiraklerinden olan alacaklarını içerir.  233. BAĞLI ORTAKLIKLARDAN ALACAKLAR  İşletmenin, esas faaliyet konusu dışındaki
      işlemleri dolayısı ile (ödünç verme ve benzer nedenlerle ortaya çıkan) bağlı ortaklıklarından olan alacaklarını kapsar.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 242. İştirakler
    alinti: kapsar. Bunlara verilen avanslar bu hesapta izlenmez.  236. DİĞER ÇEŞİTLİ ALACAKLAR  Ticari olmayan ve yukarıda
      sayılan hesaplardan herhangi birine dahil edilemeyen alacakların izlendiği hesaptır.  237. DİĞER ALACAK SENETLERİ REESKONTU
      (-)
