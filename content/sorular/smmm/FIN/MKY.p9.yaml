    madde: 242- İştirakler
    alinti: İştirakler hesabı, bir ortaklıktaki en fazla % 50 oranında olan sermaye payları veya oy haklarının izlenmesinde
      kullanılır. İştirak edilen ortaklıklarda iştirak ilişkisinden bahsedebilmek için sermaye payı dikkate alınmaksızın sahip
      olunan oy hakkı veya yönetime katılma hakkının en az % 10 oranında bulunması gerekir.
