      B: 654 karşılık gideri ilk karşılık ayrılırken kullanılır; burada karşılık konusu kalmadığından 644 kullanılır.
      C: 119 hesabı borçlandırılmalı, 644 alacaklandırılmalıdır; yönler ters verilmiştir.
      D: 119'un alacağına kayıt karşılığı kapatmaz; ayrıca 654 bu aşamada kullanılmaz.
      E: 644 gelir hesabıdır ve borçlandırılmaz; 119 borç, 644 alacak çalışır.
