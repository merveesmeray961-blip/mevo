  kok: 'İki ortaklık için aşağıdaki bilgiler verilmiştir: X şirketinde sermaye payı %45, oy hakkı %45 ve yönetim çoğunluğunu
    seçme hakkı %52; Y şirketinde sermaye payı %20, oy hakkı %12 ve yönetim çoğunluğunu seçme hakkı bulunmamaktadır. THP''deki
    242 ve 245 hesap açıklamalarına göre doğru sınıflandırma hangisidir?'
  secenekler:
    A: 'X: 245 Bağlı Ortaklıklar; Y: 242 İştirakler'
    B: 'X: 242 İştirakler; Y: 245 Bağlı Ortaklıklar'
    C: 'X: 240 Bağlı Menkul Kıymetler; Y: 242 İştirakler'
    D: 'X: 245 Bağlı Ortaklıklar; Y: 240 Bağlı Menkul Kıymetler'
    E: 'X: 242 İştirakler; Y: 240 Bağlı Menkul Kıymetler'
  dogru: A
  aciklama:
    dogru_neden: X şirketinde sermaye ve oy oranları %50yi aşmamakla birlikte yönetim çoğunluğunu seçme hakkı %52dir. THP
      245 hesabında bağlı ortaklık sahipliğinin belirlenmesinde yönetim çoğunluğunu seçme hakkının esas alınacağı belirtilir.
      Y şirketinde oy hakkı %12 olduğundan, diğer şartlar bulunmasa da %10 asgari oy hakkı eşiği iştirak ilişkisi için yeterlidir;
      bu nedenle Y 242 hesabında izlenir.
    celdiriciler:
      B: X için yönetim çoğunluğunu seçme hakkı %50yi aştığından 242 değil 245 uygulanır; Y de %10 oy hakkı eşiği nedeniyle
        242dir.
      C: X ve Y için 240 hesabı değil, ilgili ortaklık niteliğine göre 242 veya 245 hesapları kullanılır.
      D: Y şirketinde %12 oy hakkı iştirak için yeterli olduğundan 240 değil 242 kullanılmalıdır.
      E: X için yönetim çoğunluğunu seçme hakkı belirleyici olduğundan 242 değil 245; Y için ise %12 oy hakkı nedeniyle 242
        kullanılır.
