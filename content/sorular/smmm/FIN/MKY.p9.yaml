  kok: Anonim şirkette kâr dağıtımıyla ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Kâr payı net dönem kârından dağıtılabilir.
    B: Kâr payı serbest yedek akçelerden dağıtılabilir.
    C: Sermaye için faiz ödenemez.
