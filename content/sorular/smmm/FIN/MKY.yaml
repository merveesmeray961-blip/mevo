        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: E (güven 5); B: E (güven 4)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: Kökün son maddesine kalan hisselerdeki 2026 sonu değer düşüklüğünün de önemli ve sürekli kabul edildiği
      eklendi; baslangic 1994-01-01.
    neden: 'G5 (küçük): kalan düşüşün niteliği belirtilmediğinden +14.000 ₺ de savunulabilirdi; baslangic üretim
      tarihiydi.'
