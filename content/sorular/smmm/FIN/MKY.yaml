- id: SMMM-FIN-MKY-0002
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MKY
  kazanim: Değer düşüklüğü karşılığı ayrılmış hisse senedinin kısmi satışı ve dönem sonu karşılık güncellemesi (110/119/644/655)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: '(U) A.Ş. ile ilgili bilgiler şöyledir:


    - 2025 yılında geçici yatırım amacıyla (V) A.Ş.''nin 2.000 adet hisse senedi birim 50 ₺''den alınmış ve 110
    Hisse Senetleri hesabına kaydedilmiştir.

    - 31.12.2025''te hisselerin borsa değeri birim 40 ₺''ye düşmüş, bu düşüş önemli ve sürekli kabul edilerek değer
    azalışının tamamı için karşılık ayrılmıştır.

    - 2026 yılında hisselerin 1.500 adedi birim 46 ₺''den peşin satılmıştır.

    - 31.12.2026''da kalan hisselerin borsa değeri birim 44 ₺''dir; kalan hisselerdeki değer düşüklüğü de önemli
    ve sürekli kabul edilmektedir.


    Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır. Bu hisse senetleriyle ilgili 2026 yılında yapılan
    kayıtların (satış ve dönem sonu karşılık düzeltmesi) 2026 yılı dönem kârına net etkisi kaç TL''dir? (Artış +,
    azalış − ile gösterilmiştir.)'
  secenekler:
    A: -6.000 ₺
    B: -4.000 ₺
    C: +6.000 ₺
    D: +9.000 ₺
    E: +11.000 ₺
  dogru: E
  aciklama:
    dogru_neden: 'Soru üç tekniği birleştirir: çok adımlı hesap, madde birleştirme (THP 110, 119, 644 ve 655 açıklamaları)
      ve tipik hata çeldiricileri. (1) Menkul kıymetler alış bedeliyle izlenir; satılan 1.500 adedin maliyeti 75.000
      ₺, satış bedeli 69.000 ₺, 655 Menkul Kıymet Satış Zararları''na −6.000 ₺. (2) THP 119''a göre karşılık ayrılmış
      menkul kıymet elden çıkarıldığında karşılık 644 Konusu Kalmayan Karşılıklar''a aktarılır: 1.500 × 10 = +15.000
      ₺. (3) Kalan 500 adet için gereken karşılık 500 × (50 − 44) = 3.000 ₺, mevcut karşılık 500 × 10 = 5.000 ₺;
      gerçekleşmeyen 2.000 ₺ yine 644''e aktarılır: +2.000 ₺. Net etki −6.000 + 15.000 + 2.000 = +11.000 ₺. Tuzak,
      satış zararını görüp karşılık iptallerini unutmak ya da kalan hisseler için mevcut karşılığı hesaba katmadan
      yeni karşılık ayırmaktır.'
    celdiriciler:
      A: Yalnızca satış zararı (69.000 − 75.000) dikkate alınmış; satılan hisselere ait 15.000 ₺ karşılığın ve kalan
        hisselerdeki 2.000 ₺ fazla karşılığın 644'e aktarılması unutulmuştur.
      B: Satış zararı ile yıl sonu 2.000 ₺ karşılık iptali alınmış, satılan hisselere ait 15.000 ₺ karşılığın iptali
        unutulmuştur.
      C: Satış etkisi (+9.000 ₺) doğru bulunmuş, ancak kalan hisseler için mevcut 5.000 ₺ karşılık dikkate alınmadan
        3.000 ₺ yeni karşılık gideri yazılmıştır; mevcut karşılık gerekenden fazla olduğundan gider değil 2.000
        ₺ iptal gerekir.
      D: Satış zararı ve satılan kısmın karşılık iptali doğru alınmış, kalan hisselerdeki değer artışı nedeniyle
        konusu kalmayan 2.000 ₺ karşılığın 644'e aktarılması unutulmuştur.
    hesap_adimlari:
    - 'Satılan maliyet = 1.500 × 50 = 75.000 ₺; satış bedeli = 1.500 × 46 = 69.000 ₺ → 655: −6.000 ₺'
    - 'Satılan kısmın karşılığı = 1.500 × (50 − 40) = 15.000 ₺ → 644: +15.000 ₺'
    - 'Kalan 500 adet: mevcut karşılık 5.000 ₺, gereken 500 × (50 − 44) = 3.000 ₺ → 644: +2.000 ₺'
    - Net etki = −6.000 + 15.000 + 2.000 = +11.000 ₺
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 119 Menkul Kıymetler Değer Düşüklüğü Karşılığı — İşleyişi
    alinti: Değer azalışları için azalışın tamamını karşılayacak olan tutar bu hesaba alacak "65. Diğer Faaliyetlerden
      Olağan Gider ve Zararlar" grubunda yer alan "654. Karşılık Giderleri" hesabına borç kaydedilir. Kendisine
      karşılık ayrılmış olan menkul kıymet elden çıkarıldığında veya değer düşüklüğünün gerçekleşmemesi halinde
      bu hesaba borç kaydedilerek, karşılık tutarı "644. Konusu Kalmayan Karşılıklar Hesabı"na aktarılarak kapatılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: Menkul Kıymetler Hesaplarının İşleyişi (110–118); 655 Menkul Kıymet Satış Zararları
    alinti: 'Menkul kıymetler edinildiğinde alış bedeli üzerinden yukarıdaki hesaplara borç, elden çıkartıldığında
      ise, aynı bedel ile alacak kaydedilir. [...] 655: Menkul kıymetler satıldığında, satış değeri ile maliyet
      değeri arasındaki olumsuz fark bu hesaba borç yazılır.'
  dogrulama:
    python: 'satis_etkisi = 1500 * 46 - 1500 * 50

      satilan_karsilik = 1500 * (50 - 40)

      kalan_mevcut = 500 * (50 - 40)

      kalan_gereken = 500 * max(0, 50 - 44)

      sonuc = satis_etkisi + satilan_karsilik + (kalan_mevcut - kalan_gereken)

      '
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
