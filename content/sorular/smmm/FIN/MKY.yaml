  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: MKY
  kazanim: İştirak ve bağlı ortaklık sınıflaması (242/245) ve temettü geliri
  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: '(S) A.Ş., (T) A.Ş.''nin sermayesinin ve oy haklarının %60''ına sahiptir ve yönetim kurulu üyelerinin çoğunluğunu
    seçme hakkını elinde bulundurmaktadır. (T) A.Ş.''nin Mart 2026''da yapılan genel kurulunda 2025 yılı kârından
    dağıtım yapılmasına karar verilmiş; (S) A.Ş.''ye düşen 90.000 ₺ kâr payı aynı gün (S) A.Ş.''nin banka hesabına
    yatırılmıştır. Kâr payı üzerinden stopaj yapılmamıştır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas
    alınır.


    (S) A.Ş.''nin bu işlem için yapacağı kayıt aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 102 Bankalar 90.000

      Alacak: 641 Bağlı Ortaklıklardan Temettü Gelirleri 90.000'
    B: 'Borç: 102 Bankalar 90.000

      Alacak: 640 İştiraklerden Temettü Gelirleri 90.000'
    C: 'Borç: 102 Bankalar 90.000

      Alacak: 645 Menkul Kıymet Satış Kârları 90.000'
    D: 'Borç: 102 Bankalar 90.000

      Alacak: 245 Bağlı Ortaklıklar 90.000'
    E: 'Borç: 102 Bankalar 90.000

      Alacak: 671 Önceki Dönem Gelir ve Kârları 90.000'
  dogru: A
  aciklama:
    dogru_neden: THP'ye göre yüzde 50'den fazla sermaye veya oy hakkına ya da yönetim çoğunluğunu seçme hakkına
      sahip olunan ortaklıklar 245 Bağlı Ortaklıklar hesabında izlenir. (S) A.Ş. %60 paya ve yönetim çoğunluğunu
      seçme hakkına sahip olduğundan (T) A.Ş. bağlı ortaklıktır. Bağlı ortaklıklardan elde edilen temettü gelirleri
      641 Bağlı Ortaklıklardan Temettü Gelirleri hesabına alacak, bankaya yatırılan tutar 102 Bankalar hesabına
      borç kaydedilir.
    celdiriciler:
      B: 640 hesabı en fazla %50 paya sahip olunan iştiraklerden alınan temettüler içindir; %60 pay ve yönetim çoğunluğu
        bağlı ortaklık ilişkisi doğurur.
      C: 645 hesabı menkul kıymetlerin satış değeri ile maliyeti arasındaki olumlu fark içindir; temettü bir satış
        kârı değildir.
      D: Temettü, yatırımın elden çıkarılması değildir; 245 hesabı yalnızca ortaklık paylarının elden çıkarılmasıyla
        alacaklanır.
      E: THP'ye göre 671 hesabı, cari dönemden önceki dönemlere ait olup o dönemlerin mali tablolarına hata ya da
        unutulma nedenleriyle yansıtılamayan tutarlar içindir. Kâr payının 2025 kârından dağıtılması, (S) A.Ş.'nin
        önceki dönem tablolarında hata ya da unutulma nedeniyle yansıtılmamış bir gelir olduğu anlamına gelmez;
        bu nedenle 671 kullanılmaz.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 245 Bağlı Ortaklıklar
    alinti: İşletmenin doğrudan veya dolaylı olarak yüzde 50 oranından fazla sermaye ya da oy hakkına veya en az
      bu oranda yönetim çoğunluğunu seçme hakkına sahip olduğu iştiraklerin sermaye paylarının izlendiği hesaptır.
      Bağlı ortaklığın sahipliğinin belirlenmesinde yukarıdaki kıstaslardan, yönetim çoğunluğunu seçme hakkı, esas
      alınır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 641 Bağlı Ortaklıklardan Temettü Gelirleri; 242 İştirakler
    alinti: '641: İşletmenin bağlı ortaklıklarından elde ettikleri temettü gelirlerinin izlendiği hesaptır. 242:
      İştirakler hesabı, bir ortaklıktaki en fazla % 50 oranında olan sermaye payları veya oy haklarının izlenmesinde
      kullanılır.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 671 Önceki Dönem Gelir ve Kârları
    alinti: Cari dönemden önceki dönemlere ait olan ve bu dönemlerin mali tablolarına hata ya da unutulma nedenleriyle
      yansıtılamayan tutarların gösterildiği hesap kalemidir.
  gecerlilik:
