        not: 'A: E (güven 5); B: E (güven 4)'
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday yanlış (güven 2)
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) Yazar notu doğrulandı: net etki sorulduğu için 644/645 tartışması sonucu değiştirmiyor. THP
          yolu 655 −6.000 + 644 +15.000 = +9.000. Net defter değeri yolu 69.000 − (75.000 − 15.000) = 645 +9.000.
          TFRS 9 gerçeğe uygun değer farkı kâr/zarara yolu 1.500 × (46 − 40) + 500 × (44 − 40) = 11.000. Üç yaklaşım
          da +11.000 ₺ veriyor. dogrulama.python 11.000 verdi. | (küçük) Yıl sonu düzeltmesinde mevcut 5.000 ₺ karşılık
          tamamen iptal edilip yeniden 3.000 ₺ ayrılsa da net etki +2.000 ₺. Kök 2026 sonundaki kalan düşüşün (50
          → 44) ''önemli ve sürekli'' sayılıp sayılmadığını söylemiyor. Sayılmazsa sonuç +14.000 ₺ olur; bu şıklarda
          yok, ikinci doğru doğmuyor. Yalnız VUK md. 279 ile (alış bedeli, karşılık yok) düşünen aday A (−6.000)
          bulur. Ancak kök karşılığın ayrıldığını veri olarak verdiği ve ''dönem kârı'' sorduğu için bu, ikinci
          doğru değil, gerçek bir aday hatası. Tamlık için kökte ''kalan hisselerdeki değer düşüklüğü de önemli
          ve sürekli kabul edilmektedir'' denebilir. | Öneri: Kökün son maddesine ekle: ''(kalan değer düşüklüğü
          de önemli ve sürekli kabul edilmektedir)''.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
        not: (küçük) dogru_neden satış zararını yalnız 655 yoluyla (THP 110–118 işleyişi + 655) anlatıyor; alternatif
          645 net yolu anılmıyor. Net etki aynı olduğu için iddia desteksiz değil. THP 119 alıntısı birebir; 119
          tanımındaki 'önemli ölçüde ya da sürekli' ifadesi kökteki 'önemli ve sürekli' ile uyumlu.
