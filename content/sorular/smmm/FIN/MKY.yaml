        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) B (640 tanımı), C (645 işleyişi) ve D (245 işleyişi: ''ortaklık paylarının elden çıkarılmasıyla
          alacak'') gerekçeleri THP''de birebir karşılığı var ama kaynaklar alanında alıntılanmamış.'
