      250.000 ₺ ve primin tamamı 100.000 × 3 = 300.000 ₺ tescilden önce ödenir; toplam 550.000 ₺''dir. Püf noktaları: Artırımda
      da kuruluştaki ödeme rejimi kıyasen uygulanır: nominalin dörtte biri ve primin tamamı. Çıkarma fiyatının tamamını veya
      yalnız nominali yazmak tipik hatadır.'
