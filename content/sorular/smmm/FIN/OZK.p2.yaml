      A: 66.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 300.000 ₺ yalnızca itibari değerin yüzde yirmibeşidir; prim de tescilden önce ödenir.
      C: 360.000 ₺ yalnızca primdir; itibari değerin yüzde yirmibeşi de ödenmelidir.
      E: 1.560.000 ₺ çıkarma bedelinin tamamıdır; itibari değerin kalan kısmı tescilden sonra ödenebilir.
    hesap_adimlari:
    - Nominal = 1.200.000; %25 = 300.000
    - Prim = 120.000 × 3 = 360.000
    - Toplam 660.000 ₺
