  aciklama:
    dogru_neden: 'İtibari değerlerin toplamı 1.200.000 ₺ olup en az yüzde yirmibeşi (300.000 ₺) tescilden önce ödenir. Çıkarma
      primi 120.000 × 3 = 360.000 ₺''nin tamamı da tescilden önce ödenir. Toplam 300.000 + 360.000 = 660.000 ₺''dir. Püf noktaları:
      Prim ile nominal değerin ödeme rejimi farklıdır: prim tamamen, nominal ise en az yüzde yirmibeşi tescilden önce ödenir.
      Çıkarma fiyatının tamamını ya da yalnız nominalin dörtte birini yazmak tipik hatadır.'
