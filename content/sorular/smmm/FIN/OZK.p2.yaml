  kok: Ödenmiş sermayesi 2.000.000 ₺ olan anonim şirketin bilançosunda 540 Yasal Yedekler 1.350.000 ₺, 542 Olağanüstü Yedekler
    300.000 ₺ ve 570 Geçmiş Yıllar Kârları 200.000 ₺'dir. Olağanüstü yedek ve geçmiş yıl kârları amaca özgülenmemiştir. TTK
    md. 462 ve 519/3'e göre iç kaynaklardan sermayeye dönüştürülebilecek en yüksek tutar kaç ₺'dir?
  secenekler:
    A: 85.000 ₺
    B: 500.000 ₺
    C: 850.000 ₺
    D: 1.350.000 ₺
    E: 1.850.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Genel kanuni yedek akçe sermayenin yarısını (1.000.000 ₺) aşmadığı sürece belirli amaçlar dışında kullanılamaz;
      yarıyı aşan 1.350.000 − 1.000.000 = 350.000 ₺ serbestçe kullanılabilir. Toplam 350.000 + 300.000 + 200.000 = 850.000
      ₺''dir. Püf noktaları: Kanuni yedeğin yalnızca sermayenin yarısını aşan kısmı serbesttir. Yedeğin tamamını toplamak
      tipik hatadır.'
