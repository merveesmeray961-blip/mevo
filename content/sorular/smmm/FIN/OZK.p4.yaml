- id: SMMM-FIN-OZK-0002
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: OZK
  kazanim: 'Kâr dağıtımında genel kanuni yedek akçe: birinci tertip yedek akçe sınırı (%20) ve ikinci tertip yedek
    akçe (TTK md. 519)'
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: '(M) A.Ş., 2026 yılı kârının dağıtımını olağan genel kurulunda görüşecektir. Şirketin ödenmiş sermayesi 2.000.000
    ₺, 2026 yılı vergi sonrası yıllık kârı 800.000 ₺''dir ve geçmiş yıl zararı bulunmamaktadır. Şirketin genel kanuni
    yedek akçe hesabında daha önceki yıllardan gelen 380.000 ₺ birikmiş yedek akçe vardır. Genel kurul, pay sahiplerine
    yüzde beş oranında kâr payı ödendikten sonra kârdan pay alacak kişilere dağıtılacak toplam tutarı 500.000 ₺
    olarak belirlemiştir. Şirket, başlıca amacı başka işletmelere katılmak olan bir holding şirketi niteliğinde
    bulunmamaktadır; esas sözleşmede yedek akçeye ilişkin ek bir hüküm de yer almamaktadır.


    6102 sayılı Türk Ticaret Kanunu''nun 519. maddesine göre şirketin 2026 yılı kârından genel kanuni yedek akçeye
    ayıracağı toplam tutar kaç ₺''dir?'
  secenekler:
    A: '20.000'
    B: '50.000'
    C: '70.000'
    D: '90.000'
    E: '120.000'
  dogru: C
  aciklama:
    dogru_neden: 'TTK md. 519/1''e göre yıllık kârın %5''i, ödenmiş sermayenin %20''sine ulaşıncaya kadar genel
      kanuni yedek akçeye ayrılır. Sınır 2.000.000 × %20 = 400.000 ₺''dir; birikmiş yedek 380.000 ₺ olduğundan bu
      yıl en fazla 20.000 ₺ ayrılabilir (%5 × 800.000 = 40.000 ₺ değil). Md. 519/2-c''ye göre ise, birinci fıkradaki
      sınıra ulaşıldıktan sonra da, pay sahiplerine %5 kâr payı ödendikten sonra kârdan pay alacak kişilere dağıtılacak
      toplam tutarın %10''u (500.000 × %10 = 50.000 ₺) genel kanuni yedek akçeye eklenir. Toplam 20.000 + 50.000
      = 70.000 ₺''dir.


      Püf noktaları: Md. 519/1 ve 519/2-c birlikte okunur. Birinci fıkradaki %5''lik ayırma, birikmiş yedeğin sermayenin
      %20''sine (400.000 ₺) ulaşmasıyla sınırlıdır; kalan boşluk yalnızca 20.000 ₺''dir, bu yüzden 40.000 ₺ ayrılamaz.
      İkinci fıkranın (c) bendindeki %10 ise sınıra ulaşılmış olsa bile işler ve yıllık kâra değil, %5 kâr payından
      sonra dağıtılacak toplam tutara uygulanır. Pay sahiplerine ödenecek %5 oranındaki birinci kâr payı (2.000.000
      × %5 = 100.000 ₺) bu matraha girmez; matrah, kökte verilen 500.000 ₺''dir.'
    celdiriciler:
      A: '20.000: Yalnızca birinci fıkra gereği ayrılan tutar alınmış, md. 519/2-c uyarınca eklenecek %10''luk tutar
        unutulmuştur.'
      B: '50.000: Yalnızca md. 519/2-c tutarı alınmış; sınıra ulaşılıncaya kadar birinci fıkra gereği ayrılacak
        20.000 ₺ unutulmuştur.'
      D: '90.000: Birinci fıkra gereği 800.000 × %5 = 40.000 ₺ ayrılmış (sınıra yalnızca 20.000 ₺ kalmışken), üzerine
        50.000 ₺ eklenmiştir. Genel kanuni yedek akçe ödenmiş sermayenin %20''sini (400.000 ₺) aşacak şekilde birinci
        fıkra gereğince ayrılamaz.'
      E: '120.000: Birinci fıkra tutarı yanlış (40.000, sınır dikkate alınmamış) ve md. 519/2-c tutarı yanlış hesaplanmıştır:
        %10, yıllık kâra (800.000 × %10 = 80.000) değil, pay sahiplerine %5 kâr payı ödendikten sonra dağıtılacak
        toplam tutara uygulanır.'
    hesap_adimlari:
    - 'Sınır: 2.000.000 × %20 = 400.000 ₺; kalan: 400.000 − 380.000 = 20.000 ₺'
    - 'Birinci fıkra: min(800.000 × %5 = 40.000; 20.000) = 20.000 ₺'
    - 'Md. 519/2-c: 500.000 × %10 = 50.000 ₺'
    - 'Toplam: 20.000 + 50.000 = 70.000 ₺'
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 519/1
    alinti: Yıllık kârın yüzde beşi, ödenmiş sermayenin yüzde yirmisine ulaşıncaya kadar genel kanuni yedek akçeye
      ayrılır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 519/2
    alinti: Birinci fıkradaki sınıra ulaşıldıktan sonra da;
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 519/2-c
    alinti: Pay sahiplerine yüzde beş oranında kâr payı ödendikten sonra, kârdan pay alacak kişilere dağıtılacak
      toplam tutarın yüzde onu, genel kanuni yedek akçeye eklenir.
  dogrulama:
    python: 'sinir = 2000000 * 0.20 - 380000

      birinci = min(800000 * 0.05, sinir)

      ikinci = 500000 * 0.10

      sonuc = birinci + ikinci

      '
