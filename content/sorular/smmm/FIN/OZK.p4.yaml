          Toplam 70.000.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Anahtar C doğru: sınır 2.000.000 × %20 = 400.000, kalan 20.000 = min(40.000; 20.000); 519/2-c: 500.000
