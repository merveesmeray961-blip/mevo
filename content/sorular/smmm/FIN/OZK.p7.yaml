    dönüştürerek sermayesini iç kaynaklardan artıracaktır. TTK md. 462/2'ye göre artırılan kısmı karşılayan iç kaynak
    tutarının şirket bünyesinde gerçekten var olduğu nasıl doğrulanır?
  secenekler:
    A: Yönetim kurulunun sözlü beyanı yeterlidir; bilanço aranmaz.
    B: Onaylanmış yıllık bilanço ve yönetim kurulunun açık, yazılı beyanıyla; bilanço tarihinin üzerinden on iki
      aydan fazla geçmişse yeni bilanço şarttır.
    C: Denetçi raporu ve genel kurul kararı yeterlidir; onaylanmış bilançoya gerek yoktur.
    D: Onaylanmış yıllık bilanço ve yönetim kurulunun açık, yazılı beyanıyla; bilanço tarihinin üzerinden altı aydan
      fazla geçmişse yeni bilanço şarttır.
    E: Onaylanmış yıllık bilanço ve yönetim kurulunun açık, yazılı beyanıyla; bilanço tarihinin üzerinden üç aydan
      fazla geçmişse yeni bilanço şarttır.
  dogru: D
  aciklama:
    dogru_neden: TTK md. 462/2'ye göre iç kaynakların şirket bünyesinde gerçekten var olduğu onaylanmış yıllık bilanço
      ve yönetim kurulunun vereceği açık ve yazılı bir beyanla doğrulanır. Bilanço tarihinin üzerinden altı aydan
      fazla zaman geçmişse yeni bir bilanço çıkarılması ve yönetim kurulunca onaylanması şarttır.
    celdiriciler:
      A: Kanun açık ve yazılı beyanı ve onaylanmış yıllık bilançoyu arar; sözlü beyan yeterli değildir.
      B: Yeni bilanço şartı on iki ay değil, bilanço tarihinin üzerinden altı aydan fazla zaman geçmesi hâlinde
        doğar.
      C: Kanun doğrulama aracı olarak onaylanmış yıllık bilançoyu ve yönetim kurulu beyanını sayar; denetçi raporu
        ve genel kurul kararı bunun yerine geçmez.
      E: Yeni bilanço şartı üç ay değil, altı aydan fazla zaman geçmesi hâlinde doğar.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 462/2
    alinti: Sermayenin artırılan kısmını, iç kaynaklardan karşılayan tutarın şirket bünyesinde gerçekten varolduğu,
