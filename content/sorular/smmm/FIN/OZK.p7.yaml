- id: SMMM-FIN-OZK-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Özkaynak işlemleri
  konu: OZK
  kazanim: primli sermaye artırımı (520)
  tip: kavrama
  zorluk: 2
  kok: Anonim şirket niteliğindeki (H) A.Ş.'nin esas sözleşmesinde primli pay ihracına izin verilmiştir. Şirket,
    nominal değeri 100 ₺ olan 8.000 adet payı 125 ₺ bedelle ihraç etmiş ve bedeli ortaklardan peşin tahsil ederek
    bankaya yatırmıştır. Tekdüzen Hesap Planına göre bu ihraçta alacak kayıtları aşağıdakilerden hangisinde doğru
    verilmiştir?
  secenekler:
    A: 500 Sermaye 1.000.000 ₺
    B: 500 Sermaye 800.000 ₺; 549 Özel Fonlar 200.000 ₺
    C: 500 Sermaye 800.000 ₺; 520 Hisse Senetleri İhraç Primleri 200.000 ₺
    D: 500 Sermaye 800.000 ₺; 570 Geçmiş Yıllar Kârları 200.000 ₺
    E: 501 Ödenmemiş Sermaye 800.000 ₺; 520 Hisse Senetleri İhraç Primleri 200.000 ₺
  dogru: C
  aciklama:
    dogru_neden: TTK md. 347'ye göre pay itibarî değerinden yüksek bedelle çıkarılabilir. Nominal değer 8.000 ×
      100 = 800.000 ₺ 500 Sermaye hesabına, itibarî değeri aşan 8.000 × 25 = 200.000 ₺ prim ise sermaye yedekleri
      grubundaki 520 Hisse Senetleri İhraç Primleri hesabına alacak kaydedilir.
    celdiriciler:
      A: 1.000.000 ₺'nın tamamının sermayeye yazılması, itibarî değeri aşan primi sermaye ile karıştırır.
      B: 549 Özel Fonlar işletmede bırakılması zorunlu yasal fonlar içindir; primli satıştan doğan tutarlar 520'de
        izlenir.
      D: 570 geçmiş faaliyet dönemlerinin kârları içindir; ihraç primi kâr değildir.
      E: Bedel peşin tahsil edildiğinden ödenmemiş sermaye (501) hesabı kullanılmaz; ödenmiş nominal tutar 500'e
        yazılır.
    hesap_adimlari:
    - Nominal tutar = 8.000 × 100 = 800.000 ₺ → 500 Sermaye (alacak)
    - Prim = 8.000 × (125 − 100) = 200.000 ₺ → 520 (alacak)
    - Banka girişi = 8.000 × 125 = 1.000.000 ₺
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 347/1
    alinti: İtibarî değerinden aşağı bedelle pay çıkarılamaz. Payların itibarî değerinden yüksek bir bedelle çıkarılabilmeleri
      için esas sözleşmede hüküm veya genel kurul kararı bulunmalıdır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 520. Hisse Senetleri İhraç Primleri
    alinti: 520. HİSSE SENETLERİ İHRAÇ PRİMLERİ
