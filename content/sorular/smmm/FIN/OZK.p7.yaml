      D: 482/1 temerrüt faizini ayrıca düzenler; 482/2’de payın satılması ve pay senedinin iptali de mümkündür.
      E: Genel usulde süre, yönetim kurulunun ihtarındaki bir aylık ödeme süresidir; pay senedinin basımı başlangıç ölçütü
