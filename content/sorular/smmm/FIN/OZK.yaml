        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: Kökte 'payları borsada işlem görmeyen' yerine 'halka açık olmayan' denildi (SPKn md. 12 tam ödeme şartıyla
      ikinci yorum kapatıldı); E çeldiricisi için THP 521 alıntısı eklendi; baslangic 2012-07-01 (6102 sayılı TTK
      yürürlüğü; md. 344 ve 459 değişmemiş).
    neden: 'G5 (küçük): borsada işlem görmeyen bir şirket halka açık olabilir; G6 (küçük): 521 tanımı alıntısızdı;
      baslangic üretim tarihiydi.'
