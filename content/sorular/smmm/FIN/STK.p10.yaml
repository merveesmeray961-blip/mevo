  kok: Üretime giren 2.000 kg hammaddeden 1.880 kg sağlam ürün elde edilmiştir. Normal fire oranı girdi miktarının
    %2'sidir. BOBİ FRS'ye göre stok maliyetine dahil edilemeyen, normalin üstündeki fire miktarı kaç kg'dır?
  secenekler:
    A: 37,6 kg
    B: 40 kg
    C: 80 kg
    D: 120 kg
    E: 160 kg
  dogru: C
  aciklama:
    dogru_neden: Toplam fire 2.000 - 1.880 = 120 kg, normal fire 2.000 × %2 = 40 kg olduğundan normalin üstündeki
      fire 120 - 40 = 80 kg'dır. BOBİ FRS 6.15(a) uyarınca normalin üstündeki fire stok maliyetine dahil edilmez,
      oluştuğu dönemde gider yazılır.
    celdiriciler:
      A: Oran girdi yerine sağlam ürüne (1.880 × %2) uygulanmıştır; ayrıca bu işlem normal fireyi verir, aşan kısmı
        değil.
      B: Bu tutar normal fire miktarıdır; sorulan normalin üstündeki fire için toplam fireden düşülmesi gerekir.
      D: Bu tutar toplam fire miktarıdır; normal fire düşülmediği için normalin üstündeki kısım bulunamamıştır.
      E: Normalin üstündeki fire miktarı (80 kg) yanlışlıkla iki katına çıkarılmıştır; hesap hatalıdır.
    hesap_adimlari:
    - Toplam fire = 2.000 - 1.880 = 120 kg
    - Normal fire = 2.000 × %2 = 40 kg
    - Normalin üstündeki fire = 120 - 40 = 80 kg
  kaynaklar:
  - mevzuat: BOBİ FRS
    madde: 6.15(a)
    alinti: Normalin üstünde gerçekleşen; fire ve kayıplar, işçilik ve diğer dönüştürme maliyetleri.
