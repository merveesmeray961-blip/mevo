- id: SMMM-FIN-STK-0025
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: FIFO/ortalama ile maliyet
  tip: hesaplama
  zorluk: 2
  kok: '(K) A.Ş. ticari mallarını ilk giren ilk çıkar (FIFO) yöntemine göre izlemektedir. 2026 yılında ilgili mala ilişkin
    stok hareketleri şöyledir:

    - 1.1.2026 açılış: 200 birim × 40 ₺ = 8.000 ₺

    - 15.3.2026 alış: 300 birim × 50 ₺ = 15.000 ₺

    - 20.6.2026 alış: 250 birim × 55 ₺ = 13.750 ₺

    - 10.9.2026 satış: 400 birim

    - 25.11.2026 alış: 150 birim × 60 ₺ = 9.000 ₺

    Dönem sonunda stokta kalan birim sayısı 500’dür. Aksi belirtilmedikçe BOBİ FRS ve Tekdüzen Muhasebe Sistemi esas alınır.

    Buna göre dönem sonu stok maliyeti kaç ₺’dir?

    '
  secenekler:
    A: '25.000'
    B: '26.500'
    C: '27.750'
    D: '28.000'
    E: '29.250'
  dogru: C
  aciklama:
    dogru_neden: 'FIFO yönteminde satışlar en eski stoklardan karşılanır. 400 birimlik satış: önce 200 birim × 40 ₺ = 8.000
      ₺, sonra 200 birim × 50 ₺ = 10.000 ₺; toplam satış maliyeti 18.000 ₺. Dönem sonu stok 500 birim: kalan 100 birim × 50
      ₺ = 5.000 ₺ + 250 birim × 55 ₺ = 13.750 ₺ + 150 birim × 60 ₺ = 9.000 ₺ = 27.750 ₺.

      Püf noktaları: FIFO’da dönem sonu stok en son alınanlardan oluşur; satış maliyeti hesaplanırken açılış ve ilk alışlar
      önceliklidir.

      '
    celdiriciler:
      A: '25.000: Ağırlıklı ortalama maliyet yöntemiyle hesaplanmıştır (toplam maliyet 45.750 ₺ / 900 birim ≈ 50,83; 500 ×
        50,83 ≈ 25.415, yuvarlanarak yaklaşılmıştır).'
      B: '26.500: Son alışlar yerine orta alışlar tercih edilerek yanlış birim seçilmiştir.'
      D: '28.000: Açılış stokunun tamamı dönem sonuna bırakılmış, satışlarda yanlış sıra izlenmiştir.'
      E: '29.250: LIFO mantığıyla (en son alınanlar satılmış) hesaplanmıştır.'
    hesap_adimlari:
    - 'Satış 400 birim: 200 × 40 = 8.000 + 200 × 50 = 10.000 → satış maliyeti 18.000 ₺'
    - 'Dönem sonu 500 birim: 100 × 50 = 5.000 + 250 × 55 = 13.750 + 150 × 60 = 9.000 = 27.750 ₺'
  kaynaklar:
  - mevzuat: BOBİ FRS Bölüm 6 Stoklar
    madde: '6.20'
    alinti: Stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemlerinden biri kullanılarak
      hesaplanır. Benzer niteliklere ve benzer kullanıma sahip tüm stoklar için aynı maliyet hesaplama yöntemi kullanılır.
      Nitelikleri veya kullanım alanları itibarıyla farklı olan stoklar için farklı maliyet hesaplama yöntemleri kullanılabilir.
      Son giren ilk çıkar (LIFO) yönteminin kullanımına ise izin verilmemektedir.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'sonuc = 100*50 + 250*55 + 150*60

