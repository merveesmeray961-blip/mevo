      maliyeti 1.000 + 280 = 1.280 TL'dir. Toplam stok maliyeti 1.000 + 1.400 = 2.400 TL olduğundan dönem sonu 80 adet stok
      14 TL'den, yani 1.120 TL'dir. BOBİ FRS 6.20 FIFO veya ağırlıklı ortalama yöntemlerinden birinin kullanılmasına izin
