- id: SMMM-FIN-STK-0026
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: TMS 2 net gerçekleşebilir değer ve normal kapasite
  tip: uygulama
  zorluk: 2
  kok: '(C) A.Ş., BOBİ FRS’ye göre stoklarını ölçmektedir. Üretim tesisinin normal kapasitesi yıllık 10.000 birimdir. 2026’da
    fiili üretim 6.000 birim olmuş, sabit genel üretim giderleri toplam 1.200.000 ₺ olarak gerçekleşmiştir. Düşük kapasite
    nedeniyle dağıtılamayan sabit genel üretim gideri tutarı kaç ₺’dir ve bu tutar nasıl raporlanır?

    '
  secenekler:
    A: 480.000 ₺ – stok maliyetine eklenir
    B: 480.000 ₺ – Satışların Maliyeti’nde gider yazılır
    C: 720.000 ₺ – stok maliyetine eklenir
    D: 720.000 ₺ – Satışların Maliyeti’nde gider yazılır
    E: 1.200.000 ₺ – tamamı stok maliyetine dağıtılır
  dogru: B
  aciklama:
    dogru_neden: 'Normal kapasite 10.000 birim; birim başına sabit GÜG = 1.200.000 / 10.000 = 120 ₺. 6.000 birime dağıtılan
      = 720.000 ₺. Dağıtılamayan = 1.200.000 − 720.000 = 480.000 ₺. BOBİ FRS 6.13’e göre dağıtılmayan tutar gerçekleştiği
      dönemde “Satışların Maliyeti”nde gösterilir; birim başına tutar düşük kapasite nedeniyle artırılamaz.

      Püf noktaları: Normal kapasite esas alınır; fiili üretim düşük olsa da birim maliyet şişirilmez.

      '
    celdiriciler:
      A: Dağıtılamayan tutar doğru ama stok maliyetine eklenmiştir (yanlış yer).
      C: Dağıtılan tutar (720.000) yanlışlıkla dağıtılamayan sanılmıştır.
      D: Dağıtılan tutar doğru hesaplanmış ama ‘dağıtılamayan’ diye raporlanmıştır.
      E: Tamamı dağıtılmış; düşük kapasite kuralı yok sayılmıştır.
    hesap_adimlari:
    - Birim sabit GÜG = 1.200.000 / 10.000 = 120
    - Dağıtılan = 6.000 × 120 = 720.000
    - Dağıtılamayan = 1.200.000 − 720.000 = 480.000 → Satışların Maliyeti
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler için Finansal Raporlama Standardı (BOBİ FRS)
    madde: '6.13'
    alinti: Bununla birlikte, sabit genel üretim giderlerinin, normal üretim kapasitesi esas alınarak dönüştürme maliyetine
      dâhil edilmesi de mümkündür (normal maliyet yöntemi). Bu durumda normal üretim kapasitesi, planlanan bakım-onarım çalışmalarından
      kaynaklanacak kapasite düşüklüğü de dikkate alınarak, normal şartlarda bir veya birkaç dönem veya sezonda elde edilmesi
      beklenen ortalama üretim miktarıdır. ... Her bir üretim birimine dağıtılan sabit genel üretim gider tutarı, düşük kapasite
      ya da atıl kapasite nedeniyle arttırılamaz. Dağıtılmayan genel üretim gideri, gerçekleştiği dönemde “Satışların Maliyeti”
      kaleminde gösterilir.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
