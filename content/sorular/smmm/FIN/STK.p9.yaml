      C: Sabit genel üretim gideri fiili üretime bölünerek 100 TL yapılmıştır; normal kapasite esas alınmalıdır.
      D: Net gerçekleşebilir değer hesabında tamamlanma ve satış maliyetleri yanlış ele alınmıştır.
      E: Hem stok ölçümü hem sabit genel üretim gideri yanlış hesaplanmıştır.
    hesap_adimlari:
    - Net gerçekleşebilir değer = 1.000 − 180 − 70 = 750 TL.
    - Stok ölçümü = min(780, 750) = 750 TL.
    - Normal kapasiteye göre sabit genel üretim gideri = 600.000 / 10.000 = 60 TL/birim.
