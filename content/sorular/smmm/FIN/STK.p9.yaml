    B: 750 TL ve 60 TL
    C: 750 TL ve 100 TL
    D: 850 TL ve 60 TL
    E: 930 TL ve 100 TL
  dogru: B
  aciklama:
    dogru_neden: 'Net gerçekleşebilir değer 1.000 − 180 − 70 = 750 TL''dir; stok maliyet ile net gerçekleşebilir değerden
      düşük olan üzerinden ölçüldüğünden birim değer 750 TL olur. Normal kapasite esas alınırsa sabit genel üretim gideri
      birim başına 600.000 / 10.000 = 60 TL''dir; düşük kapasite nedeniyle bu tutar 100 TL''ye yükseltilmez. Püf noktaları:
      Değer düşüklüğünde maliyet ile net gerçekleşebilir değer karşılaştırılır; normal maliyet yönteminde düşük kapasitenin
      birim sabit gideri şişirmesine izin verilmez.'
