      Ancak faaliyetleri geçici veya kalıcı olarak durdurulan ya da henüz faaliyete geçmemiş bölümlere ilişkin sabit genel
      üretim giderleri dönüştürme maliyetine dâhil edilmez, gider olarak “Satışların Maliyeti” kaleminde gösterilir.
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS), Bölüm 6
    madde: '6.13'
    alinti: Bununla birlikte, sabit genel üretim giderlerinin, normal üretim kapasitesi esas alınarak dönüştürme maliyetine
      dâhil edilmesi de mümkündür (normal maliyet yöntemi). Bu durumda normal üretim kapasitesi, planlanan bakım-onarım çalışmalarından
