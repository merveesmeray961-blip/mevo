- id: SMMM-FIN-STK-0057
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: FIFO/ortalama ile maliyet
  tip: kavrama
  zorluk: 1
  kok: Dönem başında 60 adet ticari mal birim 12 TL maliyetle bulunmaktadır. Dönem içinde 40 adet daha birim 18 TL’den alınmış
    ve 50 adet satılmıştır. BOBİ FRS’ye göre (I) FIFO yöntemi ve (II) ağırlıklı ortalama maliyet yöntemi kullanıldığında satılan
    malların maliyeti sırasıyla kaç TL olur?
  secenekler:
    A: 600 TL; 720 TL
    B: 720 TL; 600 TL
    C: 720 TL; 720 TL
    D: 600 TL; 700 TL
    E: 900 TL; 720 TL
  dogru: A
  aciklama:
    dogru_neden: 'Doğru cevap A’dır. FIFO’da 50 adet ilk partiden 12 TL ile satılır: 600 TL. Ağırlıklı ortalama birim maliyet
      (60x12 + 40x18)/100 = 14,40 TL olduğundan 50 adet için 720 TL’dir.'
    celdiriciler:
      B: FIFO ile ağırlıklı ortalamanın sonuçlarını ters çevirmiştir.
      C: İki yöntemi aynı sonuç verecek biçimde hesaplamıştır.
      D: Ağırlıklı ortalama maliyeti 14 TL kabul etmiştir.
      E: FIFO’da ikinci partinin tamamını önce tüketmiştir.
    hesap_adimlari:
    - 'FIFO: 50 x 12 = 600 TL.'
    - 'Ağırlıklı ortalama birim maliyet: (60x12 + 40x18)/100 = 14,40 TL.'
    - 'Ağırlıklı ortalama ile satış maliyeti: 50 x 14,40 = 720 TL.'
  kaynaklar:
  - mevzuat: BOBİ FRS
    madde: '6.20'
    alinti: Stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemlerinden biri kullanılarak
