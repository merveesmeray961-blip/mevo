- id: SMMM-FIN-STK-0031
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: TMS 2 net gerçekleşebilir değer ve normal kapasite
  tip: hesaplama
  zorluk: 2
  kok: Bir üretim işletmesinde normal üretim kapasitesi 10.000 birim, dönem içindeki fiili üretim 6.000 birimdir. Sabit genel
    üretim giderleri toplamı 120.000 TL'dir. BOBİ FRS'nin normal maliyet yöntemi esas alınacaktır. Düşük kapasite nedeniyle
    birim başına sabit genel üretim gideri artırılmayacağına göre stoklara dağıtılacak sabit genel üretim gideri ve dönem
    gideri olarak kalacak dağıtılmamış tutar sırasıyla kaç TL'dir?
  secenekler:
    A: 60.000 TL ve 60.000 TL
    B: 72.000 TL ve 48.000 TL
    C: 80.000 TL ve 40.000 TL
    D: 120.000 TL ve 0 TL
    E: 48.000 TL ve 72.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Normal kapasite 10.000 birimdir. Sabit genel üretim gideri birim başına 120.000 / 10.000 = 12 TL olarak
      dağıtılır. 6.000 birim üretime 72.000 TL dağıtılır; düşük kapasite nedeniyle artırılamayan 48.000 TL dağıtılmamış genel
      üretim gideri dönem gideri olarak kâr veya zarara yansıtılır. Püf noktaları: Dağıtım fiili üretime göre 20 TL/birim
      yapılmaz; düşük kapasite stok maliyetini şişirecek şekilde kullanılmaz.'
    celdiriciler:
      A: 120.000 TL'nin yarısı hem stoklara hem döneme dağıtılarak kapasite kuralı yanlış uygulanmıştır.
      C: Sabit gider 6.000 fiili birime bölünerek 20 TL/birim bulunmuş ve düşük kapasite nedeniyle birim maliyet artırılmıştır.
      D: Tüm sabit genel üretim giderinin stoklara verilmesi kaynakta öngörülen düşük kapasite kuralına aykırıdır.
      E: Dağıtılan ve dağıtılmayan tutarlar ters çevrilmiştir.
    hesap_adimlari:
    - Birim sabit genel üretim gideri = 120.000 / 10.000 = 12 TL.
    - Stoklara dağıtılan = 6.000 × 12 = 72.000 TL.
    - Dağıtılmayan = 120.000 − 72.000 = 48.000 TL.
  kaynaklar:
  - mevzuat: BOBİ FRS, Bölüm 6 Stoklar
    madde: '6.13'
    alinti: Her bir üretim birimine dağıtılan sabit genel üretim gider tutarı, düşük kapasite ya da atıl kapasite nedeniyle
      arttırılamaz. Dağıtılmayan genel üretim gideri, gerçekleştiği dönemde “Satışların Maliyeti” kaleminde gösterilir.
  gecerlilik:
    baslangic: '2021-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'birim = 120000 / 10000

      stok = 6000 * birim

      sonuc = (stok, 120000 - stok)'
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_FIN.yaml, satır ChatGPT_FIN-2026-10-06-G04 #28'
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'durum: taslak → geri_cekildi.'
    neden: otomatik kapı hatası veya bankada aynı kök
- id: SMMM-FIN-STK-0032
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: FIN
  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: TMS 2 net gerçekleşebilir değer ve normal kapasite
  tip: kavrama
  zorluk: 3
  kok: BOBİ FRS'nin stok maliyetlerinde sabit genel üretim giderlerinin ele alınmasına ilişkin aşağıdaki öncüllerden hangileri
    doğrudur? I. Faaliyeti geçici veya kalıcı olarak duran ya da henüz faaliyete geçmemiş bölümlere ilişkin sabit genel üretim
    giderleri dönüştürme maliyetine dahil edilmez ve satışların maliyetinde gider gösterilir. II. Normal maliyet yönteminde
    normal üretim kapasitesi, planlanan bakım-onarım çalışmalarından kaynaklanacak kapasite düşüklüğü de dikkate alınarak
    beklenen ortalama üretim miktarıdır. III. Anormal derecede yüksek üretim dönemlerinde birim başına dağıtılmış sabit genel
    üretim gideri düşürülür.
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I, II ve III
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Üç öncül de BOBİ FRS Bölüm 6''da açıkça düzenlenmiştir. Duran veya henüz başlamamış bölümlerin sabit genel
      üretim giderleri dönüştürme maliyetine alınmaz; normal kapasite bakım-onarım kaynaklı düşüşleri de dikkate alan beklenen
      ortalama üretim miktarıdır; anormal yüksek üretimde birim başına sabit genel üretim gideri düşürülür. Püf noktaları:
      Düşük kapasite sabit gideri birim başına artırma gerekçesi değildir; yüksek üretimde de stokların maliyetinin üzerine
      çıkmasını önlemek için dağıtım azaltılır.'
    celdiriciler:
      A: II ve III de kaynakta açıkça düzenlendiği için yalnız I eksiktir.
      B: I ve III de doğrudur; yalnız II seçeneği eksik kalır.
      C: III de doğrudur; anormal yüksek üretimde birim başına sabit genel üretim gideri düşürülür.
      E: I de doğrudur; geçici/kalıcı duruş veya faaliyete geçmeme halinde sabit genel üretim gideri satışların maliyetinde
        gösterilir.
    hesap_adimlari: []
