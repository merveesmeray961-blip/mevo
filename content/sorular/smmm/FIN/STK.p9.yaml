      ölçüm esasının kullanılmasına ilişkindir; değer değişimi de doğrudan kâr veya zarara gider.'
    celdiriciler:
      A: II ve III de 6.5'te açıkça düzenlendiği için yalnız I eksiktir.
      B: I ve III de doğrudur; yalnız II'yi seçmek eksik kalır.
      C: III de doğrudur; dönemsel değişiklikler kâr veya zarara yansıtılır.
      D: II de doğrudur; emtia alım satımına aracılık edenler de istisna kapsamındadır.
