  kok: Bir işletmede tek bir ürünün birim üretim maliyeti 780 TL'dir. Raporlama tarihinde tahmini satış fiyatı 1.000 TL, tahmini
    tamamlanma maliyeti 180 TL ve satış için gerekli tahmini maliyet 70 TL'dir. Üretimde sabit genel üretim giderleri 600.000
    TL, normal üretim kapasitesi 10.000 birim, fiili üretim 6.000 birimdir. BOBİ FRS 6.4 ve 6.13 birlikte uygulandığında birim
    stok ölçümü ile normal maliyet yönteminde birim başına dağıtılacak sabit genel üretim gideri aşağıdakilerden hangisidir?
