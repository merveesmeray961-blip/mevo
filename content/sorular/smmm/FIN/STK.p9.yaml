      için gerekli olan tahmini maliyetlerin çıkarılmasıyla elde edilen tutardır.
  - mevzuat: BOBİ FRS Bölüm 6, Stoklar
    madde: '6.13'
    alinti: 6.13    Bununla birlikte, sabit genel üretim giderlerinin, normal üretim kapasitesi esas         alınarak dönüştürme
      maliyetine dâhil edilmesi de mümkündür (normal maliyet         yöntemi). Bu durumda normal üretim kapasitesi, planlanan
