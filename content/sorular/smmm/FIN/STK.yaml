- id: SMMM-FIN-STK-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: Sayım farkları — sayım noksanının geçici olarak izlenmesi (197/397)
  tip: uygulama
  zorluk: 1
  soru_bicimi: yevmiye
  kok: "Sürekli envanter yöntemini uygulayan (K) Ticaret A.Ş.'nin dönem sonunda yaptığı fiziki sayımda, ticari mallarda
    maliyet bedeli 15.000 ₺ olan bir noksanlık tespit edilmiştir. Noksanlığın nedeni henüz araştırılmaktadır.
    Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.\n\nBu tespit üzerine yapılması gereken yevmiye kaydı
    aşağıdakilerden hangisidir?"
  secenekler:
    A: "Borç: 397 Sayım ve Tesellüm Fazlaları 15.000\nAlacak: 153 Ticari Mallar 15.000"
    B: "Borç: 197 Sayım ve Tesellüm Noksanları 15.000\nAlacak: 153 Ticari Mallar 15.000"
    C: "Borç: 153 Ticari Mallar 15.000\nAlacak: 397 Sayım ve Tesellüm Fazlaları 15.000"
    D: "Borç: 689 Diğer Olağandışı Gider ve Zararlar 15.000\nAlacak: 153 Ticari Mallar 15.000"
    E: "Borç: 153 Ticari Mallar 15.000\nAlacak: 197 Sayım ve Tesellüm Noksanları 15.000"
  dogru: B
  aciklama:
    dogru_neden: THP açıklamalarına göre sayımlar sonucunda tespit edilen stok noksanları, nedeni belli oluncaya kadar
      geçici olarak 197 Sayım ve Tesellüm Noksanları hesabında izlenir ve noksanlığın ortaya çıkmasıyla bu hesaba
      borç yazılır. Sürekli envanterde ticari mallar maliyet bedeliyle izlendiği için ambardan eksilen mal 153 Ticari
      Mallar hesabına maliyet bedeli üzerinden alacak kaydedilir. Kayıt 197 borç 15.000 / 153 alacak 15.000'dir.
    celdiriciler:
      A: 397 Sayım ve Tesellüm Fazlaları bir kaynak (yabancı kaynak) hesabıdır ve sayım fazlaları için kullanılır;
        noksanlık bir varlık azalışıdır ve aktif nitelikli 197 hesabında izlenir.
      C: Bu kayıt sayım fazlası tespit edildiğinde yapılır (stok artar, 397 alacaklanır); kökte noksanlık söz konusudur.
      D: Neden araştırılırken noksan doğrudan zarar yazılmaz; THP'ye göre önce 197'de geçici olarak izlenir, zarar
        kaydı ancak sorumlusundan tahsil edilemeyeceği anlaşıldığında 197'nin alacağı karşılığında yapılır.
      E: Taraflar ters yazılmıştır; bu kayıt stoku artırır ve 197'yi alacaklandırır, oysa noksanlıkta 197 borçlanır,
        153 alacaklanır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 197 Sayım ve Tesellüm Noksanları
    alinti: 'Sayımlar sonucunda tespit edilen kasa, stok ve maddi duran varlıklar noksanlarıyla, tesellüm sırasında
      ortaya çıkan noksanların geçici olarak kayıt ve izleneceği hesaptır. İşleyişi: Noksanlığın ortaya çıkması ile
      hesaba borç, sorumlularından tahsili veya zarar kaydedilmesi halinde ise alacak kaydedilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 397 Sayım ve Tesellüm Fazlaları
    alinti: Sayımlar sonunda tespit edilen kasa, stok ve maddi duran varlıklar fazlalarıyla, üniteler arası yoklamada
      ortaya çıkan fazlaların geçici olarak kayıt edileceği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 153 Ticari Mallar — İşleyişi
    alinti: Satın alınan ticari mallar (emtia) maliyet bedeli ile bu hesaba borç, satılması veya herhangi bir nedenle
      ambardan çekilmesinde ise maliyet bedeli ile alacak kaydedilir.
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-FIN-STK-0002
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: TMS 2 net gerçekleşebilir değer ve kalem bazında stok değer düşüklüğü (158/654)
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "TMS 2 Stoklar standardını uygulayan (L) A.Ş.'nin 31.12.2026 tarihli ticari mal stoklarına ilişkin bilgiler
    aşağıdadır. Önceki dönemlerden devreden stok değer düşüklüğü karşılığı bulunmamaktadır.\n\n| Kalem | Maliyet (₺) | Tahmini
    satış fiyatı (₺) | Satış için gerekli tahmini maliyet (₺) |\n|---|---|---|---|\n| X | 40.000 | 44.000 | 3.000 |\n|
    Y | 30.000 | 28.000 | 4.000 |\n| Z | 50.000 | 50.000 | 2.000 |\n\nBu bilgilere göre 31.12.2026 tarihinde muhasebeleştirilmesi
    gereken stok değer düşüklüğü tutarı kaç TL'dir?"
  secenekler:
    A: 2.000 ₺
    B: 6.000 ₺
    C: 7.000 ₺
    D: 8.000 ₺
    E: 11.000 ₺
  dogru: D
  aciklama:
    dogru_neden: TMS 2 par. 9'a göre stoklar maliyet ile net gerçekleşebilir değerin (NGD) düşük olanıyla ölçülür; NGD,
      tahmini satış fiyatından satış için gerekli tahmini maliyetlerin düşülmesiyle bulunur (par. 6). Par. 29 uyarınca
      indirgeme her kalem için ayrı ayrı yapılır. X'in NGD'si 41.000 ₺ maliyetin üzerindedir (indirim yok, artış da
      kaydedilmez); Y'nin NGD'si 24.000 ₺ (6.000 ₺ değer düşüklüğü); Z'nin NGD'si 48.000 ₺ (2.000 ₺ değer düşüklüğü).
      Toplam 8.000 ₺; MSUGT'de 654 Karşılık Giderleri borç / 158 Stok Değer Düşüklüğü Karşılığı alacak kaydedilir.
    celdiriciler:
      A: Satış için gerekli maliyetler düşülmeden yalnızca satış fiyatı maliyetle karşılaştırılmıştır (Y için 2.000 ₺);
        NGD tanımı bu maliyetlerin indirilmesini gerektirir.
      B: Satış fiyatı maliyete eşit olan Z kalemi gözden kaçırılmıştır; satış giderleri düşüldüğünde Z'nin NGD'si
        maliyetin 2.000 ₺ altına iner.
      C: Stoklar toplam bazında değerlenmiş, X'teki 1.000 ₺ fazla diğer kalemlerin düşüklüğüyle mahsup edilmiştir
        (120.000 − 113.000); TMS 2 par. 29 kalem bazında indirgemeyi esas alır.
      E: Fiyat farkına (2.000 ₺) değer düşüklüğü bulunmayan X dahil tüm kalemlerin satış giderleri (9.000 ₺) eklenmiştir;
        NGD'si maliyetin üzerinde olan kalem için indirim yapılmaz.
    hesap_adimlari:
    - 'NGD = tahmini satış fiyatı − satış için gerekli tahmini maliyet'
    - 'X: 44.000 − 3.000 = 41.000 > 40.000 → değer düşüklüğü yok'
    - 'Y: 28.000 − 4.000 = 24.000 < 30.000 → 6.000'
    - 'Z: 50.000 − 2.000 = 48.000 < 50.000 → 2.000'
    - 'Toplam değer düşüklüğü = 6.000 + 2.000 = 8.000 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 6 (tanımlar), par. 9
    alinti: 'Net gerçekleşebilir değer: Olağan iş akışı içinde tahmini satış fiyatından, tahmini tamamlanma maliyetlerinin
      ve satışı gerçekleştirmek için gerekli olan tahmini maliyetlerin düşülmesiyle elde edilen tutardır. [...] 9 Stoklar,
      maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.'
  - mevzuat: TMS 2 Stoklar
    madde: par. 29
    alinti: Stokların net gerçekleşebilir değere indirgenmesi genellikle, her bir kalem için ayrı ayrı gerçekleştirilir.
      [...] Stokları sınıf bazında (örneğin mamuller veya belirli faaliyet bölümlerindeki tüm stoklar) net gerçekleşebilir
      değere indirgemek uygun değildir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 158 Stok Değer Düşüklüğü Karşılığı — İşleyişi
    alinti: Stok değer düşüklüğü tespit edildiğinde "654. Karşılık Giderleri Hesabı"nın borcu karşılığında bu hesaba
      alacak kaydedilir.
  dogrulama:
    python: |
      kalemler = [(40000, 44000, 3000), (30000, 28000, 4000), (50000, 50000, 2000)]
      sonuc = sum(max(0, m - (f - g)) for m, f, g in kalemler)
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-FIN-STK-0003
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: TMS 2 normal kapasite ile sabit genel üretim gideri dağıtımı ve net gerçekleşebilir değer
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "TMS 2 Stoklar standardını uygulayan (M) Sanayi A.Ş. tek tür mamul üretmektedir. 2026 yılına ilişkin bilgiler
    şöyledir:\n\n- Normal kapasite: 12.000 birim/yıl. Makine arızası nedeniyle fiili üretim 8.000 birimde kalmıştır
    (fiili üretim normal kapasiteye yakın kabul edilmemektedir).\n- Birim başına direkt ilk madde ve malzeme, direkt
    işçilik ve değişken genel üretim gideri toplamı: 40 ₺\n- Sabit genel üretim giderleri: 240.000 ₺\n- Genel yönetim
    giderleri: 60.000 ₺\n- Dönem başında mamul stoku bulunmamaktadır; üretilen mamullerin 6.000 birimi satılmıştır.\n- 31.12.2026 itibarıyla
    mamulün birim tahmini satış fiyatı 62 ₺, satış için gerekli tahmini maliyeti birim başına 4 ₺'dir.\n\nBuna göre
    31.12.2026 tarihinde dönem sonu mamul stoku için muhasebeleştirilmesi gereken değer düşüklüğü tutarı kaç TL'dir?"
  secenekler:
    A: 4.000 ₺
    B: 12.000 ₺
    C: 14.000 ₺
    D: 16.000 ₺
    E: 24.000 ₺
  dogru: A
  aciklama:
    dogru_neden: 'Soru iki tekniği birleştirir: çok adımlı hesap (önce maliyet, sonra NGD karşılaştırması) ve madde
      birleştirme (TMS 2 par. 13, 16 ve 9). Tuzak, sabit genel üretim giderinin fiili üretime bölünmesidir. Par. 13''e
      göre sabit GÜG normal kapasite esas alınarak dağıtılır ve birim başına dağıtılan tutar düşük üretim nedeniyle
      artırılmaz: 240.000 / 12.000 = 20 ₺. Dağıtılmayan 80.000 ₺ dönem gideridir. Genel yönetim giderleri par. 16(c)
      uyarınca stok maliyetine girmez (gereksiz veri). Birim maliyet 40 + 20 = 60 ₺; dönem sonu stok 2.000 birim.
      NGD = 62 − 4 = 58 ₺ (par. 6). Par. 9 gereği stok 58 ₺''den ölçülür; değer düşüklüğü 2.000 × (60 − 58) = 4.000 ₺''dir.'
    celdiriciler:
      B: Birim değer düşüklüğü (2 ₺) dönem sonu stoku yerine satılan 6.000 birime uygulanmıştır; değer düşüklüğü yalnızca
        elde kalan 2.000 birim için hesaplanır.
      C: Genel yönetim giderleri de normal kapasiteye bölünerek (60.000 / 12.000 = 5 ₺) maliyete katılmıştır (birim 65 ₺,
        2.000 × 7); TMS 2 par. 16(c) bu giderleri stok maliyetinden dışlar.
      D: Sabit GÜG fiili üretime bölünüp (30 ₺, birim maliyet 70 ₺) satış giderleri düşülmeden satış fiyatıyla
        karşılaştırılmış (2.000 × 8) ya da birim düşüklük üretilen 8.000 birimin tamamına uygulanmıştır; her iki yol da
        hatalıdır.
      E: Sabit GÜG fiili üretime bölünmüştür (240.000 / 8.000 = 30 ₺, birim maliyet 70 ₺; 2.000 × 12). Par. 13'e göre
        düşük üretimde birime dağıtılan sabit gider artırılmaz; fazlası dönem gideridir.
    hesap_adimlari:
    - 'Birim sabit GÜG (normal kapasite) = 240.000 / 12.000 = 20 ₺; dağıtılmayan = 240.000 − 8.000 × 20 = 80.000 ₺ (dönem gideri)'
    - 'Birim mamul maliyeti = 40 + 20 = 60 ₺ (genel yönetim gideri dahil edilmez)'
    - 'Dönem sonu stok = 8.000 − 6.000 = 2.000 birim; maliyet = 120.000 ₺'
    - 'NGD = 62 − 4 = 58 ₺/birim → 116.000 ₺'
    - 'Değer düşüklüğü = 120.000 − 116.000 = 4.000 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Sabit genel üretim giderleri, üretim tesislerinin normal kapasitesi esas alınarak dönüştürme maliyetlerine
      dağıtılır. [...] Fiili üretim düzeyinin normal kapasiteye yakın olması durumunda, sabit genel üretim giderlerinin
      dönüştürme maliyetlerine dağıtımında bu üretim düzeyi de kullanılabilir. Her bir üretim birimine dağıtılan sabit
      genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle arttırılmaz. Dağıtılmayan genel giderler,
      gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(c)
    alinti: 'Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal tablolara
      yansıtılan maliyetlere örnek olarak verilebilir: [...] (c) Stokların mevcut konumuna ve durumuna getirilmesinde
      katkısı olmayan genel yönetim giderleri,'
  - mevzuat: TMS 2 Stoklar
    madde: par. 6 (tanımlar), par. 9
    alinti: 'Net gerçekleşebilir değer: Olağan iş akışı içinde tahmini satış fiyatından, tahmini tamamlanma maliyetlerinin
      ve satışı gerçekleştirmek için gerekli olan tahmini maliyetlerin düşülmesiyle elde edilen tutardır. [...] 9 Stoklar,
      maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.'
  dogrulama:
    python: |
      birim_sabit = 240000 / 12000
      birim_maliyet = 40 + birim_sabit
      stok = 8000 - 6000
      ngd = 62 - 4
      sonuc = stok * max(0, birim_maliyet - ngd)
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
