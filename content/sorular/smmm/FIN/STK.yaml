- id: SMMM-FIN-STK-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: Sayım farkları — sayım noksanının geçici olarak izlenmesi (197/397)
  tip: uygulama
  zorluk: 1
  soru_bicimi: yevmiye
  kok: 'Sürekli envanter yöntemini uygulayan (K) Ticaret A.Ş.''nin dönem sonunda yaptığı fiziki sayımda, ticari
    mallarda maliyet bedeli 15.000 ₺ olan bir noksanlık tespit edilmiştir. Noksanlığın nedeni henüz araştırılmaktadır.
    Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    Bu tespit üzerine yapılması gereken yevmiye kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 621 Satılan Ticari Mallar Maliyeti 15.000

      Alacak: 153 Ticari Mallar 15.000'
    B: 'Borç: 197 Sayım ve Tesellüm Noksanları 15.000

      Alacak: 153 Ticari Mallar 15.000'
    C: 'Borç: 153 Ticari Mallar 15.000

      Alacak: 397 Sayım ve Tesellüm Fazlaları 15.000'
    D: 'Borç: 689 Diğer Olağandışı Gider ve Zararlar 15.000

      Alacak: 153 Ticari Mallar 15.000'
    E: 'Borç: 153 Ticari Mallar 15.000

      Alacak: 197 Sayım ve Tesellüm Noksanları 15.000'
  dogru: B
  aciklama:
    dogru_neden: THP açıklamalarına göre sayımlar sonucunda tespit edilen stok noksanları, nedeni belli oluncaya
      kadar geçici olarak 197 Sayım ve Tesellüm Noksanları hesabında izlenir ve noksanlığın ortaya çıkmasıyla bu
      hesaba borç yazılır. Sürekli envanterde ticari mallar maliyet bedeliyle izlendiği için ambardan eksilen mal
      153 Ticari Mallar hesabına maliyet bedeli üzerinden alacak kaydedilir. Kayıt 197 borç 15.000 / 153 alacak
      15.000'dir.
    celdiriciler:
      A: Sürekli envanterde 153 hesabının maliyet bedeliyle alacaklandırılması doğrudur; ancak 621 hesabı satılan
        ticari malların maliyeti içindir. Noksanlık bir satış değildir; nedeni belli oluncaya kadar 197 Sayım ve
        Tesellüm Noksanları hesabında geçici olarak izlenir.
      C: Bu kayıt sayım fazlası tespit edildiğinde yapılır (stok artar, 397 alacaklanır); kökte noksanlık söz konusudur.
      D: Neden araştırılırken noksan doğrudan zarar yazılmaz; THP'ye göre önce 197'de geçici olarak izlenir, zarar
        kaydı ancak sorumlusundan tahsil edilemeyeceği anlaşıldığında 197'nin alacağı karşılığında yapılır.
      E: Taraflar ters yazılmıştır; bu kayıt stoku artırır ve 197'yi alacaklandırır, oysa noksanlıkta 197 borçlanır,
        153 alacaklanır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 197 Sayım ve Tesellüm Noksanları
    alinti: 'Sayımlar sonucunda tespit edilen kasa, stok ve maddi duran varlıklar noksanlarıyla, tesellüm sırasında
      ortaya çıkan noksanların geçici olarak kayıt ve izleneceği hesaptır. İşleyişi: Noksanlığın ortaya çıkması
      ile hesaba borç, sorumlularından tahsili veya zarar kaydedilmesi halinde ise alacak kaydedilir.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 397 Sayım ve Tesellüm Fazlaları
    alinti: Sayımlar sonunda tespit edilen kasa, stok ve maddi duran varlıklar fazlalarıyla, üniteler arası yoklamada
      ortaya çıkan fazlaların geçici olarak kayıt edileceği hesaptır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 153 Ticari Mallar — İşleyişi
    alinti: Satın alınan ticari mallar (emtia) maliyet bedeli ile bu hesaba borç, satılması veya herhangi bir nedenle
      ambardan çekilmesinde ise maliyet bedeli ile alacak kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 621 Satılan Ticari Mallar Maliyeti (-)
    alinti: 'Herhangi bir değişikliğe tabi olmadan satılmak amacıyla alınan ticari mallar (emtia) ve benzeri kalemlerin
      maliyetini kapsar. İşleyişi : Satılan ticari malların maliyet tutarı "153. Ticari Mallar Hesabı"na alacak,
      bu hesaba borç kaydedilir.'
