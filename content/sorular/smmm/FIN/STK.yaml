        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: Köke X, Y ve Z'nin birbirinden bağımsız (gruplandırılamayan) ürünler olduğu eklendi (TMS 2 par. 29 gruplandırma
      istisnası kapatıldı); par. 29 alıntısı istisna cümlesini de içerecek şekilde tamamlandı; dogru_neden ve C
      açıklaması buna uyumlandı; baslangic 2018-05-24 (TMS 2'nin RG'de yeniden yayımı).
    neden: 'G5/G6 (küçük): par. 29''daki gruplandırma istisnası kökte kapatılmamıştı ve alıntıda atlanmıştı; baslangic
      üretim tarihiydi.'
- id: SMMM-FIN-STK-0003
  sinav: smmm
  bolum:
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: TMS 2 normal kapasite ile sabit genel üretim gideri dağıtımı, net gerçekleşebilir değer ve ilk maddenin
    indirgenmesi (par. 32)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'TMS 2 Stoklar standardını uygulayan (M) Sanayi A.Ş. tek tür mamul üretmektedir. 2026 yılına ilişkin bilgiler
    şöyledir:


    - Normal kapasite: 12.000 birim/yıl. Makine arızası nedeniyle fiili üretim 8.000 birimde kalmıştır (fiili üretim
    normal kapasiteye yakın kabul edilmemektedir).

    - Birim başına direkt ilk madde ve malzeme, direkt işçilik ve değişken genel üretim gideri toplamı: 40 ₺

    - Sabit genel üretim giderleri: 240.000 ₺

    - Genel yönetim giderleri: 60.000 ₺

    - Dönem başında mamul stoku bulunmamaktadır; üretilen mamullerin 6.000 birimi satılmıştır.

    - 31.12.2026 itibarıyla mamulün birim tahmini satış fiyatı 62 ₺, satış için gerekli tahmini maliyeti birim başına
    4 ₺''dir.

    - Dönem sonunda ayrıca bu mamulün üretiminde kullanılacak, maliyeti 30.000 ₺ olan ilk madde stoku bulunmaktadır.
    İlk madde fiyatları düşmüş; bu stokun 31.12.2026 itibarıyla yenileme maliyeti 26.000 ₺''dir ve yenileme maliyeti
    net gerçekleşebilir değerin en iyi ölçüsü kabul edilmektedir.

    - Bu ilk maddeyle 2027''de üretilecek mamullerin birim maliyetinin ve satış koşullarının 31.12.2026''daki mamul
    stokuyla aynı olması beklenmektedir.


    Buna göre 31.12.2026 tarihinde dönem sonu stokları (mamul ve ilk madde) için muhasebeleştirilmesi gereken toplam
    değer düşüklüğü tutarı kaç TL''dir?'
  secenekler:
    A: 4.000 ₺
    B: 8.000 ₺
    C: 16.000 ₺
    D: 18.000 ₺
    E: 28.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Soru dört tekniği birleştirir: çok adımlı hesap (önce mamul maliyeti ve NGD karşılaştırması, sonucu
      ilk madde kararına girdi olur), madde birleştirme (TMS 2 par. 13, 16, 6, 9 ve 32), istisnanın istisnası (par.
      32) ve gereksiz veri (genel yönetim giderleri). (1) Mamul: par. 13''e göre sabit GÜG normal kapasite esas
      alınarak dağıtılır ve düşük üretim nedeniyle birime düşen tutar artırılmaz: 240.000 / 12.000 = 20 ₺; dağıtılmayan
      80.000 ₺ dönem gideridir. Genel yönetim giderleri par. 16(c) uyarınca maliyete girmez. Birim maliyet 40 +
      20 = 60 ₺, NGD 62 − 4 = 58 ₺ (par. 6); 2.000 birimlik stokta değer düşüklüğü 2.000 × (60 − 58) = 4.000 ₺ (par.
      9). (2) İlk madde: par. 32''nin ilk cümlesine göre mamulün maliyete eşit veya üstünde satılması bekleniyorsa
      ilk madde maliyetinin altına indirgenmez (istisna). Burada mamulün maliyeti (60 ₺) NGD''sini (58 ₺) aştığından
      istisnanın istisnası işler: ilk madde net gerçekleşebilir değerine, yani en iyi ölçü kabul edilen yenileme
      maliyetine indirgenir: 30.000 − 26.000 = 4.000 ₺. Toplam değer düşüklüğü 4.000 + 4.000 = 8.000 ₺''dir. Tuzak,
      ilk maddenin mamule dönüşecek olduğu için hiç indirgenmeyeceğini sanmak (A) ve sabit GÜG''ü fiili üretime
      bölmektir (E).'
    celdiriciler:
      A: 4.000 ₺ yalnızca mamul stokundaki değer düşüklüğüdür; ilk madde indirgenmemiştir. TMS 2 par. 32 uyarınca
        mamulün maliyeti NGD'sini aştığından ilk madde de yenileme maliyetine (26.000 ₺) indirgenir.
      C: 16.000 ₺, mamuldeki birim değer düşüklüğü (2 ₺) dönem sonu stoku yerine satılan 6.000 birime uygulanıp
        (12.000 ₺) ilk maddedeki 4.000 ₺ eklenerek bulunur; değer düşüklüğü yalnızca elde kalan 2.000 birim için
        hesaplanır.
      D: 18.000 ₺, genel yönetim giderleri de normal kapasiteye bölünerek (60.000 / 12.000 = 5 ₺) mamul maliyetine
        katılıp (birim 65 ₺; 2.000 × 7 = 14.000 ₺) ilk maddedeki 4.000 ₺ eklenerek bulunur; TMS 2 par. 16(c) bu
        giderleri stok maliyetinden dışlar.
      E: 28.000 ₺, sabit GÜG fiili üretime bölünüp (240.000 / 8.000 = 30 ₺, birim maliyet 70 ₺; 2.000 × 12 = 24.000
        ₺) ilk maddedeki 4.000 ₺ eklenerek bulunur. Par. 13'e göre düşük üretimde birime dağıtılan sabit gider artırılmaz;
        fazlası dönem gideridir.
    hesap_adimlari:
    - Birim sabit GÜG (normal kapasite) = 240.000 / 12.000 = 20 ₺; dağıtılmayan = 240.000 − 8.000 × 20 = 80.000
      ₺ (dönem gideri)
    - Birim mamul maliyeti = 40 + 20 = 60 ₺ (genel yönetim gideri dahil edilmez)
    - Dönem sonu mamul stoku = 8.000 − 6.000 = 2.000 birim; maliyet = 120.000 ₺; NGD = 2.000 × (62 − 4) = 116.000
      ₺ → 4.000 ₺
    - 'Mamul maliyeti (60 ₺) > NGD (58 ₺) → par. 32 istisnası uygulanmaz; ilk madde yenileme maliyetine indirgenir:
      30.000 − 26.000 = 4.000 ₺'
    - Toplam değer düşüklüğü = 4.000 + 4.000 = 8.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Sabit genel üretim giderleri, üretim tesislerinin normal kapasitesi esas alınarak dönüştürme maliyetlerine
      dağıtılır. [...] Fiili üretim düzeyinin normal kapasiteye yakın olması durumunda, sabit genel üretim giderlerinin
      dönüştürme maliyetlerine dağıtımında bu üretim düzeyi de kullanılabilir. Her bir üretim birimine dağıtılan
      sabit genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle arttırılmaz. Dağıtılmayan genel
      giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(c)
    alinti: 'Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal
      tablolara yansıtılan maliyetlere örnek olarak verilebilir: [...] (c) Stokların mevcut konumuna ve durumuna
      getirilmesinde katkısı olmayan genel yönetim giderleri,'
  - mevzuat: TMS 2 Stoklar
    madde: par. 6 (tanımlar), par. 9
    alinti: 'Net gerçekleşebilir değer: Olağan iş akışı içinde tahmini satış fiyatından, tahmini tamamlanma maliyetlerinin
      ve satışı gerçekleştirmek için gerekli olan tahmini maliyetlerin düşülmesiyle elde edilen tutardır. [...]
      9 Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.'
  - mevzuat: TMS 2 Stoklar
    madde: par. 32
    alinti: Üretiminde kullanılacakları mamullerin, maliyete eşit veya maliyetin üstünde bir fiyattan satılmasının
      beklenmesi durumunda, mamul üretiminde kullanılmak üzere elde tutulan hammadde ve malzeme, maliyetinin altına
