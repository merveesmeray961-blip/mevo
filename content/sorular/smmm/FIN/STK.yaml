- id: SMMM-FIN-STK-0002
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Finansal Muhasebe
  konu: STK
  kazanim: TMS 2 net gerçekleşebilir değer ve kalem bazında stok değer düşüklüğü (158/654)
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'TMS 2 Stoklar standardını uygulayan (L) A.Ş.''nin 31.12.2026 tarihli ticari mal stoklarına ilişkin bilgiler
    aşağıdadır. X, Y ve Z birbirinden bağımsız (gruplandırılamayan) ürünlerdir. Önceki dönemlerden devreden stok
    değer düşüklüğü karşılığı bulunmamaktadır.


    | Kalem | Maliyet (₺) | Tahmini satış fiyatı (₺) | Satış için gerekli tahmini maliyet (₺) |

    |---|---|---|---|

    | X | 40.000 | 44.000 | 3.000 |

    | Y | 30.000 | 28.000 | 4.000 |

    | Z | 50.000 | 50.000 | 2.000 |


    Bu bilgilere göre 31.12.2026 tarihinde muhasebeleştirilmesi gereken stok değer düşüklüğü tutarı kaç TL''dir?'
  secenekler:
    A: 2.000 ₺
    B: 6.000 ₺
    C: 7.000 ₺
    D: 8.000 ₺
    E: 11.000 ₺
  dogru: D
  aciklama:
    dogru_neden: TMS 2 par. 9'a göre stoklar maliyet ile net gerçekleşebilir değerin (NGD) düşük olanıyla ölçülür;
      NGD, tahmini satış fiyatından satış için gerekli tahmini maliyetlerin düşülmesiyle bulunur (par. 6). Par.
      29 uyarınca indirgeme her kalem için ayrı ayrı yapılır; benzer veya ilişkili kalemlerin gruplandırılması istisnası,
      kökte ürünlerin birbirinden bağımsız olduğu belirtildiğinden uygulanmaz. X'in NGD'si 41.000 ₺ maliyetin üzerindedir
      (indirim yok, artış da kaydedilmez); Y'nin NGD'si 24.000 ₺ (6.000 ₺ değer düşüklüğü); Z'nin NGD'si 48.000
      ₺ (2.000 ₺ değer düşüklüğü). Toplam 8.000 ₺; MSUGT'de 654 Karşılık Giderleri borç / 158 Stok Değer Düşüklüğü
      Karşılığı alacak kaydedilir.
    celdiriciler:
      A: Satış için gerekli maliyetler düşülmeden yalnızca satış fiyatı maliyetle karşılaştırılmıştır (Y için 2.000
        ₺); NGD tanımı bu maliyetlerin indirilmesini gerektirir.
      B: Satış fiyatı maliyete eşit olan Z kalemi gözden kaçırılmıştır; satış giderleri düşüldüğünde Z'nin NGD'si
        maliyetin 2.000 ₺ altına iner.
      C: Stoklar toplam bazında değerlenmiş, X'teki 1.000 ₺ fazla diğer kalemlerin düşüklüğüyle mahsup edilmiştir
        (120.000 − 113.000); TMS 2 par. 29 kalem bazında indirgemeyi esas alır; kökteki ürünler birbirinden bağımsız
        olduğundan gruplandırma istisnası da yoktur.
      E: Fiyat farkına (2.000 ₺) değer düşüklüğü bulunmayan X dahil tüm kalemlerin satış giderleri (9.000 ₺) eklenmiştir;
        NGD'si maliyetin üzerinde olan kalem için indirim yapılmaz.
    hesap_adimlari:
    - NGD = tahmini satış fiyatı − satış için gerekli tahmini maliyet
    - 'X: 44.000 − 3.000 = 41.000 > 40.000 → değer düşüklüğü yok'
    - 'Y: 28.000 − 4.000 = 24.000 < 30.000 → 6.000'
    - 'Z: 50.000 − 2.000 = 48.000 < 50.000 → 2.000'
    - Toplam değer düşüklüğü = 6.000 + 2.000 = 8.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 6 (tanımlar), par. 9
    alinti: 'Net gerçekleşebilir değer: Olağan iş akışı içinde tahmini satış fiyatından, tahmini tamamlanma maliyetlerinin
      ve satışı gerçekleştirmek için gerekli olan tahmini maliyetlerin düşülmesiyle elde edilen tutardır. [...]
      9 Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.'
  - mevzuat: TMS 2 Stoklar
    madde: par. 29
    alinti: Stokların net gerçekleşebilir değere indirgenmesi genellikle, her bir kalem için ayrı ayrı gerçekleştirilir.
      Ancak bazı durumlarda, benzer veya ilişkili kalemleri gruplandırmak uygun olabilir. Bu durum, aynı üretim
      hattında üretilen; benzer amaçlara veya nihai kullanıma sahip stok kalemlerinin aynı coğrafi bölgede üretilmesi
      ve pazarlanması ve söz konusu üretim hattındaki diğer ürünlerden ayrı olarak değerlenememesi durumunda ortaya
      çıkabilir. Stokları sınıf bazında (örneğin mamuller veya belirli faaliyet bölümlerindeki tüm stoklar) net
      gerçekleşebilir değere indirgemek uygun değildir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 158 Stok Değer Düşüklüğü Karşılığı — İşleyişi
    alinti: Stok değer düşüklüğü tespit edildiğinde "654. Karşılık Giderleri Hesabı"nın borcu karşılığında bu hesaba
      alacak kaydedilir.
  dogrulama:
    python: 'kalemler = [(40000, 44000, 3000), (30000, 28000, 4000), (50000, 50000, 2000)]

      sonuc = sum(max(0, m - (f - g)) for m, f, g in kalemler)

      '
