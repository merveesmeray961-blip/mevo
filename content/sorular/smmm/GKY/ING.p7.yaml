- id: SMMM-GKY-ING-0047
  sinav: smmm
  bolum:
  - SGS
  ders: GKY
  unite: İngilizce
  konu: ING
  kazanim: dil bilgisi (zamanlar)
  tip: uygulama
  zorluk: 3
  kok: 'Aşağıdaki cümlede boş bırakılan yere uygun zaman (tense) yapısını seçiniz.


    By the time the committee finally ______ a decision, the project ______ already ______ three different phases of review.

    '
  secenekler:
    A: will make / has undergone
    B: made / had undergone
    C: makes / undergoes
    D: had made / has undergone
    E: was making / underwent
  dogru: B
  aciklama:
    dogru_neden: 'İki geçmiş eylem arasında öncelik-sonralık ilişkisi vardır. Komitenin karar vermesinden önce proje üç aşamadan
      geçmiş olmalıdır. Bu durumda ''By the time + Simple Past'' ve ana cümlede ''Past Perfect'' kullanılır: made / had undergone.
      Püf noktaları: ''already'' Past Perfect''i güçlendirir; gelecek veya şimdiki zaman yapıları bu geçmiş bağlamda kullanılamaz.'
    celdiriciler:
      A: Future tense (will make) ve Present Perfect (has undergone) bu geçmiş bağlamda uyumsuzdur.
      C: Present Simple (makes / undergoes) genel doğrular veya alışkanlıklar için kullanılır; burada spesifik geçmiş olay
        anlatılmaktadır.
      D: Past Perfect (had made) ile Present Perfect (has undergone) zaman uyumu bozulur; ikinci eylem de geçmişte tamamlanmış
        olmalıdır.
      E: Past Continuous (was making) kararın süregelen bir eylem olduğunu ima eder; 'finally' ile uyumsuzdur ve 'underwent'
        Past Perfect gerektiren önceliği karşılamaz.
