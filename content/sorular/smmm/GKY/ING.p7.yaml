      konuşmacının açıklama yapmasına yol açmalıdır; bu yüzden neden soran ifade en uygundur.'
    celdiriciler:
      A: Hemen çözüm önermek, A’nın neden açıklamasını gereksiz kılar.
      C: Teselli, neden sormadan yapılırsa diyalog akışı bozulur.
      D: Suçlayıcı bir ifade, açıklama beklentisiyle uyumsuzdur.
