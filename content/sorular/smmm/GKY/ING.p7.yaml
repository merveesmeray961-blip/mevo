- id: SMMM-GKY-ING-0053
  sinav: smmm
  bolum:
  - SGS
  ders: GKY
  unite: İngilizce
  konu: ING
  kazanim: okuma-anlama (özgün kısa paragraf)
  tip: kavrama
  zorluk: 1
  kok: 'Read the short paragraph and answer the question.


    Many people believe that learning a new language is only useful for travel or work. However, recent studies show that
    bilingual individuals often have better problem-solving skills and stronger memory. Switching between languages exercises
    the brain in unique ways. Therefore, even a basic knowledge of a second language can bring long-term cognitive benefits.


    According to the paragraph, what is one advantage of being bilingual?

    '
