  kok: Read the paragraph and answer the question. “Lena had planned to study at the library on Saturday, but the library
    closed early because of a power problem. She first considered studying at home, then decided to join an online study group
    that her classmate recommended. The group focused on solving practice questions rather than reviewing the whole chapter.
    By the evening, Lena had completed more questions than she usually did alone.” Which conclusion is best supported by the
    paragraph?
