  kazanim: cümle tamamlama
  tip: uygulama
  zorluk: 3
  kok: 'Choose the option that best completes the sentence: If the manager ______ the warning earlier, she ______ the team
    before the deadline was missed.'
  secenekler:
    A: noticed / would have warned
    B: had noticed / would have warned
    C: has noticed / will warn
    D: would notice / had warned
    E: was noticing / warns
  dogru: B
  aciklama:
    dogru_neden: The sentence describes an unreal past condition and a past consequence. “Had noticed” marks the earlier unreal
      condition, while “would have warned” expresses the hypothetical past result.
    celdiriciler:
      A: “Noticed” is simple past and does not form the required third conditional if-clause.
      C: The present perfect and future forms do not match the unreal past situation.
      D: “Would notice” should not be used in the if-clause here, and “had warned” does not supply the correct result pattern.
      E: “Was noticing” and “warns” do not express the required completed past condition and hypothetical result.
