  kok: Read the paragraph and answer the question. “Lena planned to study at the library on Saturday. When she learned that
    the library would close early for maintenance, she changed her plan and studied at home. She chose the quietest room in
    the house and turned off her phone.” Which statement best explains Lena’s decisions?
  secenekler:
    A: She preferred studying at home because the library was always noisy.
    B: She changed locations because of the early closure and then reduced distractions at home.
    C: She went home because her phone was not working at the library.
    D: She studied at the library first and moved home after finishing her work.
    E: She chose the quietest room because the library had no available seats.
  dogru: B
  aciklama:
    dogru_neden: 'The paragraph gives two connected decisions: the early library closure caused the change of location, and
      choosing a quiet room plus turning off the phone reduced distractions at home.'
    celdiriciler:
      A: The paragraph does not say that the library was always noisy; the stated reason was its early closure.
      C: Nothing is said about Lena’s phone failing at the library; she turned it off intentionally at home.
      D: She did not first study at the library; she changed her plan before studying.
      E: The paragraph does not mention a lack of seats; the quietest room was a choice she made at home.
