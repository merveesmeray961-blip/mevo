    dogru_neden: 'Paragraf iki bilgiyi birlikte verir: grup alıştırma sorularına odaklanmıştır ve Lena gün sonunda tek başına
      yaptığından daha fazla soru tamamlamıştır. Bu iki bilgi birleştirildiğinde grubun Lena’nın daha fazla alıştırma sorusu
      çözmesine yardımcı olduğu sonucu en güçlü biçimde desteklenir. Püf noktaları: Hem grubun çalışma biçimini hem de gün
      sonundaki sonucu birlikte değerlendirmek gerekir.'
    celdiriciler:
      A: Paragraf, grubun daha az yararlı olduğunu değil, Lena’nın normalden fazla soru tamamladığını gösterir.
