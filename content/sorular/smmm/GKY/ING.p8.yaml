    A: It was less useful than studying at home because it covered fewer topics.
    B: It was recommended by Lena’s teacher and required a full chapter review.
    C: It helped Lena solve more practice questions than she usually solved alone.
    D: It was organized by the library staff after the power problem.
    E: It had been Lena’s first choice because she had planned to join it before the library closed.
