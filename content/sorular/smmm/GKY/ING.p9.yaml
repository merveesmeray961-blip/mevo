  tip: uygulama
  zorluk: 3
  kok: Read the paragraph and answer the question. “A community center decided to turn an unused courtyard into a small garden.
    First, volunteers removed broken paving stones. Next, they collected rainwater in two barrels and used it for the new
    plants. After several weeks, the garden began attracting residents who had not previously visited the center. The organizers
    now plan to add benches and a notice board.” Which sequence correctly orders the events described in the paragraph?
  secenekler:
    A: The garden attracts residents → paving stones are removed → rainwater is collected → benches are planned.
    B: Paving stones are removed → rainwater is collected → the garden attracts residents → benches and a notice board are
      planned.
    C: Rainwater is collected → benches are planned → paving stones are removed → residents visit.
    D: Benches are planned → residents visit → rainwater is collected → paving stones are removed.
    E: Paving stones are removed → residents visit → benches are planned → rainwater is collected.
  dogru: B
  aciklama:
    dogru_neden: Paragraf olayları sırasıyla bozuk taşların kaldırılması, yağmur suyunun toplanması, bahçenin ilgi görmesi
      ve son olarak banklarla ilan panosu ekleme planı olarak verir.
    celdiriciler:
      A: İlk iki aşamayı tersine çevirir.
      C: Yağmur suyu toplama ile bank planlama sırasını ve ilk aşamayı yanlış verir.
      D: Planlanan bankları olayların başına alır ve olayların sırasını bozar.
      E: Ziyaretçilerin gelişi ile yağmur suyu toplama sırasını ters çevirir.
