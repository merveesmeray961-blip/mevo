  zorluk: 2
  kok: 'A: “I’m not sure whether we should publish the report this week.” B: “The data still need to be checked.” A: “So,
    which of the following is the closest meaning of B’s statement?” Bu diyaloğa göre aşağıdakilerden hangisi **yanlıştır**?'
  secenekler:
    A: The data have not been fully verified yet.
    B: The report may need to be delayed until the data are checked.
    C: The data require further examination before publication.
    D: The report is definitely ready to be published now.
    E: Checking the data is still necessary.
  dogru: D
  aciklama:
    dogru_neden: B'nin “The data still need to be checked” sözü, verilerin henüz tamamen kontrol edilmediğini anlatır; bu
      nedenle raporun kesinlikle hemen yayıma hazır olduğu söylenemez.
    celdiriciler:
      A: Verilerin henüz tam olarak doğrulanmadığı anlamını doğru verir.
      B: Veriler kontrol edilene kadar gecikme olabileceği çıkarımıyla uyumludur.
      C: Verilerin yayımdan önce yeniden incelenmesi gerektiğini doğru ifade eder.
      E: Kontrol işleminin hâlâ gerekli olduğunu doğru aktarır.
