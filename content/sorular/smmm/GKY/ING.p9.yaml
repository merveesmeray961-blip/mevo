- id: SMMM-GKY-ING-0192
  sinav: smmm
  bolum:
  - SGS
  ders: GKY
  unite: İngilizce
  konu: ING
  kazanim: kelime bilgisi
  tip: kavrama
  zorluk: 2
  kok: Aşağıdaki senaryoda “discrepancy” sözcüğü hangi anlamda kullanılmıştır? “During the audit, the accountant noticed a
    discrepancy between the cash balance in the records and the amount counted in the safe.”
  secenekler:
    A: anlaşma
    B: uyuşmazlık
    C: artış
    D: tahmin
    E: gecikme
  dogru: B
  aciklama:
    dogru_neden: “Discrepancy” birbiriyle uyuşmayan iki bilgi veya tutar arasındaki farklılık, yani uyuşmazlık anlamındadır.
      Senaryoda kayıtlardaki nakit ile kasada sayılan tutar birbirini tutmamaktadır.
    celdiriciler:
