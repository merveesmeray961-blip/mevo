      ve kütüphanecilerin yorumlama konusunda daha fazla zaman harcadığını söylüyor.
    celdiriciler:
      B: II metne göre doğrudur, III ise yanlıştır.
      C: I de metinde açıkça desteklenmektedir.
      D: I ve II doğrudur; III yanlıştır.
      E: II, özgün nüshayı inceleme amacıyla ziyaret edildiği için doğrudur.
