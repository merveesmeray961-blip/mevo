  kok: 'Aşağıdaki parçayı okuyunuz.

    “After the town library introduced a digital archive, visitors began using the physical collection differently. Instead
    of asking librarians to locate every historical newspaper, many users first searched the archive from home and visited
    the library only when they wanted to examine an original copy. The librarians therefore spent more time helping visitors
    interpret sources than simply locating them.”

    Aşağıdaki eşleştirmelerden hangisi doğrudur?

    I. Digital archive → evden ön araştırma

    II. Original copies → kütüphaneye ziyaret nedenlerinden biri

    III. Librarians → yalnızca fiziksel materyal bulma işi'
