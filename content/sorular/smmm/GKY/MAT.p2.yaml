  - SGS
  ders: GKY
  unite: Matematik
  konu: MAT
  kazanim: sayılar ve temel işlemler
  tip: uygulama
  zorluk: 3
  kok: 'Rakamları farklı ve a > b olan iki basamaklı ab sayısı ile ba sayısının toplamı 121''dir. Ayrıca a − b = 3''tür. Buna
    göre aşağıdaki yargılardan hangileri doğrudur?

    I. a + b = 12''dir.

    II. ab sayısı 74''tür.

    III. ab sayısı ile ba sayısının farkı 27''dir.'
  secenekler:
    A: Yalnız II
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 'ab + ba = 10a + b + 10b + a = 11(a + b) = 121 olduğundan a + b = 11''dir (I yanlış). a − b = 3 ile birlikte
      a = 7, b = 4 bulunur; ab = 74''tür (II doğru). ab − ba = 74 − 47 = 27''dir (III doğru). Püf noktaları: Toplam 11''in
      katıdır; ab − ba farkı ise 9 × (a − b) = 27 şeklinde doğrudan da bulunabilir.'
    hesap_adimlari:
    - 11(a + b) = 121, a + b = 11
    - a − b = 3 ; a = 7, b = 4
    - 74 − 47 = 27
    celdiriciler:
      A: 'III de doğrudur: 74 − 47 = 27''dir.'
      B: 'II de doğrudur: a = 7 ve b = 4 olduğundan ab = 74''tür.'
      C: I yanlıştır; ab + ba = 11 × (a + b) = 121 olduğundan a + b = 11'dir.
      D: I yanlıştır; a + b = 12 değil 11'dir.
