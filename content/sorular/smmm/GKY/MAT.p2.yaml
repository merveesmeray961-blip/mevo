  kok: 'Alış fiyatı 480 ₺ olan bir ürün %35 kârla satılmıştır. Buna göre aşağıdaki yargılardan hangileri doğrudur?

    I. Satış fiyatı 648 ₺''dir.

    II. Kâr tutarı 160 ₺''dir.

    III. Satış fiyatı, alış fiyatının 1,35 katıdır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
