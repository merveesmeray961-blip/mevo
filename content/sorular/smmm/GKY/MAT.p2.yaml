    dogru_neden: Kâr tutarı 480 × 0,35 = 168 ₺, satış fiyatı 480 + 168 = 648 ₺'dir. Bu nedenle I doğru, II yanlıştır (168
      ≠ 160). Satış fiyatı 480 × 1,35 = 648 olduğundan III de doğrudur.
    hesap_adimlari:
    - 'Kâr: 480 × 0,35 = 168 ₺'
    - 'Satış: 480 + 168 = 648 ₺ = 480 × 1,35'
    celdiriciler:
      A: 'III de doğrudur: satış fiyatı alış fiyatının 1,35 katıdır.'
      B: II yanlıştır; kâr 480 × 0,35 = 168 ₺'dir.
      C: 'I de doğrudur: 480 × 1,35 = 648 ₺''dir.'
      D: II yanlıştır; kâr tutarı 160 değil 168 ₺'dir.
