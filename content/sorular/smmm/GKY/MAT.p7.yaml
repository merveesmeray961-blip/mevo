      saatlik toplam üretimi: 5 × 12 = 60 birim. Gerekli süre: 480 ÷ 60 = 8 saat. Püf noktaları: Önce A''ların üretimini sabitleyip
      kalanı B''lere paylaştırın; saatlik hızları karıştırmayın.'
