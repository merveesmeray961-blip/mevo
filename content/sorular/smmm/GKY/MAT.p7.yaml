    A: 120 birim

    B: 150 birim

    C: 90 birim


    A makinesi 4 gün, B makinesi 3 gün, C makinesi 5 gün çalıştığında toplam üretim 1140 birim olmuştur. Ancak kayıtta bir
    hata olduğu ve C makinesinin gerçekte 4 gün çalıştığı anlaşılmıştır. Bu durumda gerçek toplam üretim kaç birimdir?

    '
  secenekler:
    A: '1050'
    B: '1080'
    C: '1110'
    D: '1120'
    E: '1130'
  dogru: A
  aciklama:
    dogru_neden: 'Kayıttaki üretim: 120×4 + 150×3 + 90×5 = 480 + 450 + 450 = 1380 değil; soruda 1140 verilmiş, bu yüzden oranlama
      değil doğrudan düzeltme yapılır. C’nin 1 gün fazla yazıldığı varsayımıyla: fazla yazılan 90 birim çıkarılır → 1140 −
      90 = 1050. Püf noktaları: Kayıttaki toplam ile gerçek gün farkını kullanarak fazla kaydı çıkarmak yeterlidir; makinelerin
      verimlerini yeniden hesaplamaya gerek yoktur.'
    celdiriciler:
      B: C’nin 1 gününü yanlışlıkla B’ye ekleyip 150 çıkarma hatası.
      C: Yalnızca A veya B’nin gününü düzeltme varsayımı.
      D: 90 yerine 20 gibi yanlış fark kullanma.
      E: Toplamı 1140 kabul edip küçük bir düzeltme yapma.
    hesap_adimlari:
    - Kayıtta C 5 gün → gerçek 4 gün → 1 gün fazla = 90 birim fazla kaydedilmiş
    - Gerçek toplam = 1140 − 90 = 1050
