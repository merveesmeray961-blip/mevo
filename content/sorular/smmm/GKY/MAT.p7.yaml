      B: A üretimini 4×15×7 gibi yanlış süreyle alma.
      D: Kalan 540 birim varsayımı veya 5×12×9 hatası.
      E: Toplam üretimi 1000 varsayıp 520 kalan / 60 ≈ 8,67 yuvarlama hatası.
