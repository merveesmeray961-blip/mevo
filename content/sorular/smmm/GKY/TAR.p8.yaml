  ders: GKY
  unite: Atatürk İlkeleri ve İnkılap Tarihi
  konu: TAR
  kazanim: Millî Mücadele cepheleri ve antlaşmalar
  tip: kavrama
  zorluk: 3
  kok: Doğu Cephesi'nde Ermenistan'la yapılan savaşların ardından Gümrü Antlaşması imzalanmıştır. Bu gelişmenin
    yanı sıra aşağıdaki eşleştirmelerden hangisi Millî Mücadele'deki cephe-antlaşma ilişkisini doğru verir?
  secenekler:
    A: Doğu Cephesi — Gümrü Antlaşması; Güney Cephesi — Ankara Antlaşması
    B: Doğu Cephesi — Mudanya Ateşkesi; Batı Cephesi — Gümrü Antlaşması
    C: Güney Cephesi — Kars Antlaşması; Doğu Cephesi — Mudanya Ateşkesi
    D: Batı Cephesi — Ankara Antlaşması; Güney Cephesi — Moskova Antlaşması
    E: Doğu Cephesi — Ankara Antlaşması; Güney Cephesi — Gümrü Antlaşması
  dogru: A
  aciklama:
    dogru_neden: 'Doğu Cephesi''ndeki Türk-Ermeni savaşlarının ardından Gümrü Antlaşması, Güney Cephesi''nde Fransa
      ile yürütülen sürecin ardından ise 20 Ekim 1921 Ankara Antlaşması imzalanmıştır. Püf noktaları: Gümrü ile
      Ankara antlaşmalarını cephelerle eşleştirirken antlaşmaların taraflarını ve cephe bağlantılarını birlikte
      düşünmek gerekir.'
    celdiriciler:
      B: Mudanya Ateşkesi Doğu Cephesi'nin antlaşması değildir; Gümrü de Batı Cephesi'yle ilişkilendirilemez.
      C: Kars Antlaşması Doğu sınırının düzenlenmesiyle ilgilidir; Mudanya Ateşkesi ise Batı Cephesi'ndeki savaşların
        ardından imzalanmıştır.
      D: Ankara Antlaşması Güney Cephesi'yle, Moskova Antlaşması ise Sovyet Rusya ile ilişkilerle bağlantılıdır;
        eşleştirme ters kurulmuştur.
      E: Ankara Antlaşması Güney Cephesi'yle, Gümrü ise Doğu Cephesi'yle ilişkilidir; seçenek iki bağlantıyı yer
        değiştirmiştir.
