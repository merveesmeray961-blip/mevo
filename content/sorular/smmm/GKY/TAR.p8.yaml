  kok: Aşağıdaki cephe–antlaşma eşleştirmelerinden hangisi Millî Mücadele dönemi için doğrudur?
  secenekler:
    A: Doğu Cephesi — Ankara Antlaşması; Güney Cephesi — Gümrü Antlaşması
    B: Doğu Cephesi — Kars Antlaşması; Güney Cephesi — Mudanya Ateşkesi
    C: Batı Cephesi — Gümrü Antlaşması; Doğu Cephesi — Mudanya Ateşkesi
    D: Güney Cephesi — Moskova Antlaşması; Batı Cephesi — Ankara Antlaşması
    E: Doğu Cephesi — Gümrü Antlaşması; Güney Cephesi — Ankara Antlaşması
  dogru: E
  aciklama:
    dogru_neden: 'Doğu Cephesi''nde Ermenistan''la yapılan savaşın ardından Gümrü Antlaşması (1920), Güney Cephesi''nde
      Fransa ile 20 Ekim 1921 Ankara Antlaşması imzalanmıştır. Püf noktaları: Antlaşmaları cephelerle eşleştirirken
      karşı tarafı (Ermenistan, Fransa, Yunanistan) birlikte hatırlamak gerekir.'
    celdiriciler:
      A: Gümrü ve Ankara antlaşmalarının cepheleri yer değiştirmiştir; Gümrü Doğu, Ankara Güney Cephesi ile ilişkilidir.
      B: Kars Antlaşması (1921) Doğu Cephesi ile ilişkilidir ancak Mudanya Ateşkesi Güney Cephesi'ne değil Batı
        Cephesi'ne aittir.
      C: Gümrü Antlaşması Batı Cephesi ile değil Doğu Cephesi ile, Mudanya Ateşkesi ise Batı Cephesi ile ilişkilidir.
      D: Moskova Antlaşması Sovyet Rusya ile yapılmıştır, Güney Cephesi ile ilgili değildir; Ankara Antlaşması da
        Batı değil Güney Cephesi ile ilişkilidir.
