- id: SMMM-HUK-BRC-0003
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: müteselsil borç — alacaklının bir borçluyu ibrası ve iç ilişkide rücu (TBK md. 166, 167, 168)
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'A, B ve C, alacaklı K''ya karşı 1.800.000 TL tutarındaki bir borçtan müteselsil borçlu sıfatıyla sorumludur.
    Borçlular arasında paylaşıma ilişkin bir anlaşma bulunmamaktadır ve aralarındaki hukuki ilişkinin niteliği de
    farklı bir paylaşımı gerektirmemektedir. Alacaklı K, B ile bir ibra sözleşmesi yaparak B''yi borçtan ibra etmiş,
    ardından C''den borcun ifasını istemiştir. C, K''ya 1.200.000 TL ödemiş ve K''nın alacağı tamamen sona ermiştir.
    A hiçbir ödeme yapmamıştır.


    6098 sayılı Türk Borçlar Kanunu''na göre C''nin, A''ya rücu edebileceği tutar kaç TL''dir?'
  secenekler:
    A: '300.000'
    B: '400.000'
    C: '600.000'
    D: 1.200.000
    E: 1.800.000
  dogru: C
  aciklama:
    dogru_neden: 'Müteselsil borçta paylaşım aksi kararlaştırılmadıkça eşittir (md. 167/1): üç borçlunun payı 600.000
      TL''dir. Alacaklının borçlulardan biriyle yaptığı ibra sözleşmesi, diğer borçluları da ibra edilen borçlunun
      iç ilişkideki borca katılma payı oranında borçtan kurtarır (md. 166/3); B''nin payı 600.000 TL olduğundan
      alacaklının talep edebileceği borç 1.800.000 − 600.000 = 1.200.000 TL''ye iner. B''nin payı md. 166/3 gereği
      alacaktan düştüğünden bu pay A ve C''ye yüklenmez; bu sonuç, alacaklının diğerlerinin zararına olarak bir
      borçlunun durumunu iyileştirmesinin sonuçlarına kendisinin katlanacağını söyleyen md. 168/2 ile de uyumludur.
      A ve C kalan borçtan iç ilişkide 600.000''er TL sorumludur; C''nin ödemesi B''nin payını içermediğinden B''ye
      rücu edilecek bir fazla ödeme yoktur. C 1.200.000 TL ödediğinden kendi payını aşan 600.000 TL''yi A''dan isteyebilir
      (md. 167/2).


      Püf noktaları: Md. 166/3 ile md. 167 birlikte okunmalıdır. İbra, B''yi borçtan kurtarırken A ve C''yi tam
      olarak B''nin payı kadar rahatlatır: borç 1.800.000 TL''den 1.200.000 TL''ye düşer, B''nin payı A ve C''ye
      yüklenmez (md. 166/3; md. 168/2: alacaklı katlanır). C''nin ödediği 1.200.000 TL''yi A ile eşit (600.000''er
      TL) paylaşması gerekir. Kökte yazan 1.800.000 TL yanıltıcı bir tutardır; payları eski borç üzerinden değil,
      ibra sonrası kalan borç üzerinden düşünün.'
    celdiriciler:
      A: '300.000: B''nin ibra edilen payı A ve C arasında paylaştırılmıştır (A ve C 900.000''er TL üstlenmiş sayılmış;
        1.200.000 − 900.000). Md. 166/3 uyarınca B''nin payı alacaktan düşer; bu pay md. 167/3 anlamında ''alınamayan
        miktar'' değildir ve ibranın sonucuna alacaklı katlanır (md. 168/2); B''nin payı diğer borçlulara yüklenmez.'
      B: '400.000: Ödenen tutar, ibra dikkate alınmadan üç eşit paya bölünmüş (1.200.000 / 3) ve C''nin A''ya rücu
        edeceği tutar bu pay olarak alınmıştır. Kalan borç iki borçlu (A ve C) arasında 600.000''er TL paylaşılır.'
      D: '1.200.000: C''nin ödediği tutarın tamamı A''dan istenmiştir. Md. 167/2 uyarınca C kendi payına düşen kısım
        için rücu edemez; yalnızca payını aşan kısmı isteyebilir.'
      E: '1.800.000: Borcun ibradan önceki toplamı esas alınmıştır; ibra sözleşmesi md. 166/3 uyarınca diğer borçluları
        da B''nin payı oranında borçtan kurtarmıştır ve C zaten yalnızca 1.200.000 TL ödemiştir.'
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 166/3
    alinti: Alacaklının borçlulardan biriyle yaptığı ibra sözleşmesi, diğer borçluları da ibra edilen borçlunun
      iç ilişkideki borca katılma payı oranında borçtan kurtarır.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 167/1
    alinti: Aksi kararlaştırılmadıkça veya borçlular arasındaki hukuki ilişkinin niteliğinden anlaşılmadıkça, borçlulardan
      her biri, alacaklıya yapılan ifadan, birbirlerine karşı eşit paylarla sorumludurlar.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 167/2
    alinti: Kendisine düşen paydan fazla ifada bulunan borçlunun, ödediği fazla miktarı diğer borçlulardan isteme
      hakkı vardır. Bu durumda borçlu, her bir borçluya ancak payı oranında rücu edebilir.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 168/2
    alinti: Alacaklı diğerlerinin zararına olarak borçlulardan birinin durumunu iyileştirirse, bunun sonuçlarına
      katlanır.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden''de ''B''nin payı A ve C''ye yüklenmez'' sonucunun dayanağı md. 166/3 olarak
      öne alındı, md. 168/2 destekleyici ilke olarak bırakıldı; C''nin B''ye rücu edemeyeceği gerekçesiyle eklendi;
      A çeldiricisine payın md. 167/3 anlamında ''alınamayan miktar'' olmadığı eklendi. Anahtar değişmedi (C).'
    neden: 'G5: sonucu yalnız md. 168/2''ye bağlamak, hükmün (halefiyet bağlamındaki genel ilke) kapsamını aşan
      bir özetti; asıl dayanak md. 166/3''tür.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: C (güven 5) TBK 166/3: ibra, diğer borçluları ibra edilenin iç ilişkideki payı (600.000)
          oranında kurtarır => kalan borç 1.200.000 (C ödedi). TBK 167: eşit pay 600.000; TBK 168/2: alacaklı B''yi
          iyileştirmenin sonucuna katlanır. C kendi payı 600.000''i aşan 600.000''i A''ya rücu eder.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: eşit paylar 600.000 (167/1); B''nin ibrası A ve C''yi B''nin payı oranında
          kurtarır (166/3) → borç 1.200.000; C bunu ödedi, kendi payı 600.000''i aşan 600.000''i A''dan ister (167/2)
          → C. 300.000 savunulamaz: B''nin payı alacaktan düştüğünden C''nin ödemesi B''nin payını içermez, B''ye
          rücu yok. B 400.000, D 1.200.000, E 1.800.000 kesin yanlış. Zorluk 3 makul.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: TBK 166/3, 167/1, 167/2, 168/2 alıntıları tbk.txt ile birebir; 168/2''ye
          dayanan iddia 166/3''e dayandırılacak biçimde düzeltildi.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday yanlış (B, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-HUK-BRC-0004
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: 'sözleşmenin kurulması — süresiz öneri: hazır olanlar arasında yapılan öneri ve telefonla yapılan öneri
    (TBK md. 4)'
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: '(P), (Q)''yu telefonla arayarak kullanılmış bir aracını 500.000 TL''ye satmayı önermiş, kabul için herhangi
    bir süre belirlememiştir. (Q), "Düşünüp yarın dönerim." demiş; (P) buna bir karşılık vermemiş, beklemeyi kabul
    ettiğini veya kabul için bir süre tanıdığını da bildirmemiş ve görüşme sona ermiştir. (Q) ertesi gün (P)''yi
    arayarak öneriyi kabul ettiğini bildirmiştir.


    6098 sayılı Türk Borçlar Kanunu''na göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Telefonla yapılan öneri hazır olmayanlar arasında yapılmış sayıldığından (P), zamanında ve usulüne uygun
      gönderilen bir yanıtın ulaşmasının beklenebileceği ana kadar önerisiyle bağlıdır; satış sözleşmesi kurulmuştur.
    B: Kabul için süre belirlenmediğinden (P) önerisiyle süresiz olarak bağlıdır; (Q)'nun ertesi günkü kabulüyle
      satış sözleşmesi kurulmuştur.
    C: (P), (Q)'nun yarın dönerim diyerek bildirdiği süre olan bir günün sonuna kadar önerisiyle bağlıdır; satış
      sözleşmesi kurulmuştur.
    D: (Q) öneriyi hemen reddetmediğinden öneri örtülü olarak kabul edilmiş sayılır; satış sözleşmesi telefon görüşmesi
      sırasında kurulmuştur.
    E: Telefonla yapılan öneri hazır olanlar arasında yapılmış sayıldığından ve hemen kabul edilmediğinden (P) önerisiyle
      bağlılıktan kurtulmuştur; (Q)'nun ertesi günkü açıklaması kendiliğinden satış sözleşmesini kurmaz.
  dogru: E
  aciklama:
    dogru_neden: TBK md. 4'e göre kabul için süre belirlenmeksizin hazır olan bir kişiye yapılan öneri hemen kabul
      edilmezse öneren, önerisiyle bağlılıktan kurtulur; telefon gibi iletişim araçlarıyla doğrudan iletişim sırasında
      yapılan öneri de hazır olanlar arasında yapılmış sayılır. (P)'nin önerisi telefon görüşmesi sırasında hemen
      kabul edilmemiştir; (P) bağlılıktan kurtulmuştur ve (Q)'nun ertesi günkü açıklaması kendiliğinden sözleşmeyi
      kurmaz.
    celdiriciler:
      A: Telefonla doğrudan iletişim sırasında yapılan öneri md. 4/2 gereği hazır olanlar arasında yapılmış sayılır;
        md. 5'teki 'yanıtın ulaşmasının beklenebileceği ana kadar bağlılık' kuralı yalnızca hazır olmayanlar arasında
        yapılan süresiz öneriye uygulanır.
      B: Kabul için süre belirlenmemiş olması öneren için süresiz bağlılık doğurmaz; hazır olanlar arasında yapılan
        süresiz öneri hemen kabul edilmezse bağlılık sona erer (md. 4/1). Süreyle bağlılık ancak kabul için süre
        belirlendiğinde söz konusudur (md. 3).
      C: Kabul için süreyi öneren belirlerse öneren o süre sonuna kadar bağlı kalır (md. 3); burada süreyi belirleyen
        (P) değil, (Q)'dur ve (P) kabul için süre belirlememiştir.
      D: Örtülü kabul (md. 6), yalnızca kanun, işin özelliği veya durumun gereği açık bir kabulü beklemek gerekmiyorsa
        ve öneri uygun sürede reddedilmediğinde söz konusu olur; burada (Q) öneriyi kabul etmeyip yanıtı ertelemiştir;
        üstelik hazır olanlar arasında yapılan süresiz öneri hemen kabul edilmediğinden md. 4/1 uyarınca bağlayıcılığını
        yitirmiştir.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 4/1
    alinti: Kabul için süre belirlenmeksizin hazır olan bir kişiye yapılan öneri hemen kabul edilmezse; öneren,
      önerisiyle bağlılıktan kurtulur.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 4/2
    alinti: Telefon, bilgisayar gibi iletişim sağlayabilen araçlarla doğrudan iletişim sırasında yapılan öneri,
      hazır olanlar arasında yapılmış sayılır.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 5/1
    alinti: Kabul için süre belirlenmeksizin hazır olmayan bir kişiye yapılan öneri, zamanında ve usulüne uygun
      olarak gönderilmiş bir yanıtın ulaşmasının beklenebileceği ana kadar, önereni bağlar.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 3/1
    alinti: Kabul için süre belirleyerek bir sözleşme yapılmasını öneren, bu sürenin sona ermesine kadar önerisiyle
      bağlıdır.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 6
    alinti: Öneren, kanun veya işin özelliği ya da durumun gereği açık bir kabulü beklemek zorunda değilse, öneri
      uygun bir sürede reddedilmediği takdirde, sözleşme kurulmuş sayılır.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: A çeldiricisinin açıklaması md. 5''in yalnız hazır olmayanlar arasındaki süresiz öneriye
      uygulandığını söyleyecek biçimde yeniden yazıldı (önceki cümle ''süresiz öneride md. 5 uygulanır'' diye mutlak
      okunuyordu); D çeldiricisindeki kaynaksız ''bu bir araç satışı önerisidir'' gerekçesi md. 4/1''e dayanan gerekçeyle
      değiştirildi. Anahtar değişmedi (E).'
    neden: 'G5/G6: kural özeti öznesiz/şartsızdı; D''deki gerekçenin md. 6''da karşılığı yoktu.'
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: GZ sonrası kök netleştirildi: (Q)''nun ''yarın dönerim'' sözüne (P)''nin karşılık vermediği,
      beklemeyi kabul etmediği ve süre tanımadığı açıkça yazıldı (C şıkkındaki ''Q''nun bildirdiği süre''nin P''nin
      örtülü süre tanıması olarak okunması engellendi); zorluk 1 → 2; surum 1 → 2. Şıklar ve anahtar değişmedi (E).'
    neden: 'GZ: kaynaksız ortalama aday C''yi seçti. Kök, P''nin Q''nun erteleme sözüne rıza gösterip göstermediği
      konusunda sessizdi; P''nin onayı bulunsaydı md. 3 anlamında süreli öneri savunulabilirdi.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: E (güven 5) TBK 4/2: telefonla doğrudan iletişim sırasında yapılan öneri hazır olanlar
          arasında sayılır; TBK 4/1: süresiz öneri hemen kabul edilmezse öneren bağlılıktan kurtulur. Ertesi gün
          kabul yeni öneri niteliğinde, sözleşme kendiliğinden kurulmaz.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: telefonla doğrudan iletişimde öneri hazır olanlar arasında sayılır (4/2),
          süresiz ve hemen kabul edilmediğinden öneren bağlılıktan kurtulur (4/1) → E. A (md. 5 hazır olmayanlar),
          B (süresiz bağlılık yok), C (süreyi öneren belirlemeli, md. 3), D (örtülü kabul yok; Q yanıtı erteledi)
          kesin yanlış. Ertesi günkü kabul ancak yeni bir öneri niteliğindedir; E ''kendiliğinden kurmaz'' dediğinden
          doğru. Zorluk 1 makul. GZ sonrası: kökte P''nin Q''nun erteleme sözüne rıza göstermediği açıkça yazıldı;
          böylece C için örtülü süre tanıma yorumu kapandı, tek doğru E.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: TBK 3/1, 4/1, 4/2, 5/1, 6 alıntıları tbk.txt ile birebir; çeldirici açıklamaları
          kaynakla uyumlu hâle getirildi.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday yanlış (C, güven 2)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
