    A: Kusurlu ve hukuka aykırı bir fiille başkasına zarar verilmesi
    B: Kusur aranmaksızın, hukuka aykırı bir fiille başkasına zarar verilmesi
    C: Haklı sebep olmaksızın başkasının malvarlığından zenginleşilmesi
