      B: Müteselsil borçlulukta alacaklının önce diğer borçlulara başvurması gibi bir sıra yoktur; alacaklı seçtiği
        borçludan doğrudan isteyebilir (md. 163/1).
      C: Md. 163/1 alacaklıya borçluların hepsinden veya yalnız birinden isteme seçimini tanır; bütün borçluların
        birlikte dava edilmesi şartı yoktur.
      D: Md. 163/2'ye göre borçluların sorumluluğu borcun tamamı ödeninceye kadar devam eder; B'den ifa istenmesi
        A ve C'nin sorumluluğunu kaldırmaz.
