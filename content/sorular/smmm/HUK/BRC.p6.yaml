- id: SMMM-HUK-BRC-0007
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: yanılma
  tip: uygulama
  zorluk: 2
  kok: R, karşı tarafla yaptığı sözleşmede 100.000 TL ödemeyi üstlenmek isterken iradesini 1.000.000 TL ödeme yönünde açıklamıştır.
    Hata basit bir hesap yanlışlığı değildir. R, yanıldığını öğrendiği gün karşı tarafa sözleşmeyle bağlı olmadığını bildirmiştir.
    6098 sayılı TBK'ya göre R sözleşmeyle bağlı mıdır?
  secenekler:
    A: Her durumda bağlıdır.
    B: Esaslı yanılma nedeniyle bağlı değildir.
    C: Yalnız karşı taraf kabul ederse ileri sürülebilir.
    D: Yalnız saikte yanılma esaslıdır.
    E: Otomatik tazminat doğar.
  dogru: B
  aciklama:
    dogru_neden: TBK md. 31'in birinci fıkrasının 5 numaralı bendine göre yanılanın gerçekte üstlenmek istediğinden önemli
      ölçüde fazla bir edim için iradesini açıklaması esaslı yanılmadır (100.000 TL yerine 1.000.000 TL). Md. 30'a göre esaslı
      yanılmaya düşen taraf sözleşmeyle bağlı olmaz; R, md. 39/1'deki bir yıllık süre içinde bağlı olmadığını bildirdiğinden
      sözleşmeyi onamış da sayılmaz.
    celdiriciler:
      A: Md. 30 esaslı yanılmaya düşen tarafın sözleşmeyle bağlı olmayacağını öngörür. Basit hesap yanlışlığı olsaydı sözleşme
        geçerli kalıp yalnız düzeltilirdi (md. 31/2); kök bunu dışlamıştır.
      C: Yanılmanın ileri sürülmesi karşı tarafın kabulüne bağlı değildir; yanılan, md. 39/1'deki süre içinde sözleşmeyle
        bağlı olmadığını bildirir.
      D: Olay iradenin açıklanmasında yanılmadır (md. 31/1-5), saikte yanılma değildir; ayrıca md. 32'ye göre saikte yanılma
        kural olarak esaslı sayılmaz.
      E: Tazminat kendiliğinden doğmaz; md. 35/1'e göre yanılan, yanılmasında kusurlu ise sözleşmenin hükümsüzlüğünden doğan
        zararı gidermekle yükümlüdür ve karşı taraf yanılmayı biliyor veya bilmesi gerekiyorsa tazminat istenemez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6098 sayılı TBK
    madde: md. 30
    alinti: Sözleşme kurulurken esaslı yanılmaya düşen taraf, sözleşme ile bağlı olmaz.
  - mevzuat: 6098 sayılı TBK
    madde: md. 31/1-5
    alinti: Yanılan, gerçekte üstlenmek istediğinden önemli ölçüde fazla bir edim için veya gerçekte istediğinden önemli ölçüde
      az bir karşı edim için iradesini açıklamışsa.
  - mevzuat: 6098 sayılı TBK
    madde: md. 39/1
    alinti: Yanılma veya aldatma sebebiyle ya da korkutulma sonucunda sözleşme yapan taraf, yanılma veya aldatmayı öğrendiği
      ya da korkutmanın etkisinin ortadan kalktığı andan başlayarak bir yıl içinde sözleşme ile bağlı olmadığını bildirmez
      veya verdiği şeyi geri istemezse, sözleşmeyi onamış sayılır.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
