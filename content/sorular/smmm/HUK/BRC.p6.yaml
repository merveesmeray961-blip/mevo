  kok: R, karşı tarafla yaptığı sözleşmede 100.000 ₺ ödemeyi üstlenmek isterken iradesini 1.000.000 ₺ ödeme yönünde
    açıklamıştır. Hata basit bir hesap yanlışlığı değildir. R, yanıldığını öğrendiği gün karşı tarafa sözleşmeyle
    bağlı olmadığını bildirmiştir. 6098 sayılı TBK'ya göre R sözleşmeyle bağlı mıdır?
  secenekler:
    A: Bir yıllık süre geçtiği için sözleşmeyi onamış sayılır ve sözleşmeyle bağlıdır.
    B: Esaslı yanılmaya düştüğü için sözleşmeyle bağlı olmaz.
    C: Karşı taraf kabul ederse sözleşmeyle bağlı olmaktan kurtulur.
    D: Yanılma saik niteliğinde olduğundan esaslı sayılmaz ve sözleşmeyle bağlıdır.
    E: Sözleşmeyle bağlı değildir ve kusuru aranmaksızın karşı tarafın zararını gidermek zorundadır.
  dogru: B
  aciklama:
    dogru_neden: TBK md. 31'in birinci fıkrasının 5 numaralı bendine göre yanılanın gerçekte üstlenmek istediğinden
      önemli ölçüde fazla bir edim için iradesini açıklaması esaslı yanılmadır (100.000 ₺ yerine 1.000.000 ₺). Md.
      30'a göre esaslı yanılmaya düşen taraf sözleşmeyle bağlı olmaz; R, md. 39/1'deki bir yıllık süre içinde bağlı
      olmadığını bildirdiğinden sözleşmeyi onamış da sayılmaz.
    celdiriciler:
      A: Md. 39/1'deki bir yıllık süre yanılmanın öğrenildiği andan başlar; R aynı gün bildirimde bulunduğundan
        sözleşmeyi onamış sayılmaz.
      C: Esaslı yanılmada sözleşmeyle bağlı olmama, karşı tarafın kabulüne bağlı değildir; yanılan süresi içinde
        bildirimde bulunur (md. 30, 39/1).
      D: Olay iradenin açıklanmasında yanılmadır (md. 31/1-5), saikte yanılma değildir; saikte yanılma ise md. 32'ye
        göre kural olarak esaslı sayılmaz.
      E: Md. 35/1'e göre tazminat için yanılanın yanılmasında kusurlu olması gerekir; karşı taraf yanılmayı biliyor
        veya bilmesi gerekiyorsa tazminat da istenemez.
    hesap_adimlari: []
  kaynaklar:
