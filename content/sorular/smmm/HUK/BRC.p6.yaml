    model: 'harici: ChatGPT'
    istem_surumu: uretici paketi HUK-2026-10-05-30
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: B (güven 4) TBK 30-32 beyanda yanılma, miktarda esaslı yanılma; bağlı değil'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Düzeltildikten sonra geçti: md. 31/1-5 (bent atfı doğru) + md. 30 + md. 39/1 bildirimi ile anahtar B tek doğru;
          örtük bildirim varsayımı köke yazıldı. Zorluk 3 → 2.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 30, 31/1-5, 31/2, 32, 35/1, 39/1 alıntı ve iddiaları tbk.txt ile uyumlu.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (B, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 14
  - tarih: '2026-10-05'
    kim: hakem
