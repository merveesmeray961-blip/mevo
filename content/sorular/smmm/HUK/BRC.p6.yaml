        koşulu değildir.
      D: Md. 49/1 zararın giderilmesini düzenler; zarar doğmadan bu hükme göre giderim yükümlülüğü doğmaz.
      E: Sözleşmeye aykırılıktan doğan sorumluluk md. 112'de ayrıca düzenlenir; haksız fiil sorumluluğu taraflar
        arasında sözleşme bulunmasını gerektirmez.
