      md. 39/1 kaynağı eklendi; dogru_neden'de bent atfı açıkça yazıldı (md. 31/1, bent 5); A, C, D, E açıklamaları md. 31/2,
      32, 35/1 ve 39/1'e bağlandı (E'deki 'tazminat ayrıca kusura bağlanmıştır' cümlesi md. 35'in kimin tazminat ödediğini
      söylemiyordu); zorluk 3 → 2; surum 1 → 2. Şıklar ve anahtar değişmedi (B).
