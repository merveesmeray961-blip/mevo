  kok: '(A), (B)’ye 01.03.2020 tarihinde 50.000 TL tutarında kira bedeli borcu doğmuştur. (B), bu alacağı 15.04.2026
    tarihinde dava yoluyla talep etmiştir. Sözleşmede zamanaşımı süresine ilişkin bir hüküm yoktur.


    6098 sayılı Türk Borçlar Kanunu’na göre bu alacak zamanaşımına uğramış mıdır?

    '
