  kok: '(A), (B)’ye 01.03.2020 tarihinde 50.000 TL tutarında kira bedeli borcu doğmuştur. (B), bu alacağı 15.04.2026 tarihinde
    dava yoluyla talep etmiştir. Sözleşmede zamanaşımı süresine ilişkin bir hüküm yoktur.


    6098 sayılı Türk Borçlar Kanunu’na göre bu alacak zamanaşımına uğramış mıdır?

    '
  secenekler:
    A: Evet, çünkü kira bedelleri beş yıllık zamanaşımına tabidir ve süre dolmuştur.
    B: Hayır, çünkü her alacak on yıllık zamanaşımına tabidir ve süre dolmamıştır.
    C: Evet, çünkü kira bedelleri iki yıllık zamanaşımına tabidir.
    D: Hayır, çünkü dönemsel edimler on yıllık zamanaşımına tabidir.
    E: Evet, çünkü zamanaşımı süreleri sözleşmeyle uzatılamaz ve süre dolmuştur.
  dogru: A
  aciklama:
    dogru_neden: 'TBK md. 147/1’e göre kira bedelleri, anapara faizleri ve ücret gibi diğer dönemsel edimler beş yıllık zamanaşımına
      tabidir. Md. 146 genel on yıllık süreyi öngörür ancak md. 147 özel süre getirmiştir. 01.03.2020’de muaccel olan alacak
      için beş yıl 01.03.2025’te dolmuştur; 15.04.2026’daki dava zamanaşımına uğramıştır.

      Püf noktaları: Dönemsel edimler (kira, faiz, ücret) beş yıllık özel süreye tabidir; genel on yıllık süre uygulanmaz.

      '
    celdiriciler:
      B: Genel süre on yıldır ancak kira bedelleri için md. 147 özel beş yıllık süre öngörmüştür.
      C: İki yıllık süre haksız fiil tazminatı içindir; kira bedeli beş yıldır.
      D: Dönemsel edimler beş yıllık zamanaşımına tabidir (md. 147/1).
      E: Sürelerin kesinliği (md. 148) doğru olsa da asıl neden beş yıllık sürenin dolmasıdır; bu şık yanıltıcıdır.
  kaynaklar:
