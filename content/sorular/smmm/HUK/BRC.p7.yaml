- id: SMMM-HUK-BRC-0010
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: zamanaşımı süreleri
  tip: uygulama
  zorluk: 3
  kok: '(K) ile (L) arasında 15.3.2018 tarihinde bir eser sözleşmesi kurulmuş, (L) yüklenici olarak bir villanın
    inşaatını üstlenmiştir. (L) yükümlülüklerini ağır kusuruyla hiç ifa etmemiştir. (K), 20.4.2024 tarihinde (L)''ye
    karşı alacak davası açmıştır. Sözleşmede zamanaşımı süresine ilişkin herhangi bir hüküm yoktur.

    6098 sayılı Türk Borçlar Kanunu''na göre (K)''nın alacağı hakkında aşağıdaki ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: Alacak 10 yıllık zamanaşımına tabidir ve süre dolmuştur.
    B: Alacak 5 yıllık zamanaşımına tabidir; süre dolmuştur.
    C: Alacak 5 yıllık zamanaşımına tabidir; ancak ağır kusur nedeniyle 10 yıllık süre uygulanır ve süre dolmamıştır.
    D: Alacak 10 yıllık zamanaşımına tabidir; süre dolmamıştır.
    E: Eser sözleşmelerinden doğan alacaklar her durumda 5 yıllık zamanaşımına tabidir.
  dogru: C
  aciklama:
    dogru_neden: 'TBK md. 147/6 uyarınca eser sözleşmesinden doğan alacaklar kural olarak 5 yıllık zamanaşımına
      tabidir. Ancak "Yüklenicinin yükümlülüklerini ağır kusuruyla hiç ya da gereği gibi ifa etmemesi dışında" ibaresi
      nedeniyle ağır kusur halinde bu istisna uygulanmaz ve genel 10 yıllık süre (md. 146) geçerli olur. 2018''den
      2024''e 6 yıl geçtiği için 10 yıllık süre dolmamıştır. Süreler sözleşmeyle değiştirilemez (md. 148).

      Püf noktaları: md. 147/6''daki "ağır kusuruyla hiç ya da gereği gibi ifa etmemesi dışında" ifadesi istisnanın
      istisnasıdır; ağır kusurda genel süreye dönülür.

      '
    celdiriciler:
      A: Genel süre 10 yıldır ancak eser sözleşmesinde kural 5 yıldır; ağır kusur istisnası nedeniyle 10 yıl uygulanır
        ve dolmamıştır.
      B: Ağır kusur nedeniyle 5 yıllık süre uygulanmaz.
      D: Kural 5 yıldır; ağır kusur olmasa 5 yıl uygulanırdı.
      E: Ağır kusur istisnası vardır; her durumda 5 yıl değildir.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 146
    alinti: Kanunda aksine bir hüküm bulunmadıkça, her alacak on yıllık zamanaşımına tabidir.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 147/6
    alinti: Yüklenicinin yükümlülüklerini ağır kusuruyla hiç ya da gereği gibi ifa etmemesi dışında, eser sözleşmesinden
      doğan alacaklar.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 148
    alinti: Bu ayırımda belirlenen zamanaşımı süreleri, sözleşmeyle değiştirilemez.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_HUK.yaml, satır GrokYazar_HUK-2026-10-06-G04 #2'
- id: SMMM-HUK-BRC-0011
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: haksız fiil ve zamanaşımı
  tip: uygulama
  zorluk: 2
  kok: '(A), 12.03.2023 tarihinde (B)’nin aracına çarparak 80.000 TL maddi zarar vermiştir. (B), zararı ve tazminat
    yükümlüsünü 20.04.2023 tarihinde öğrenmiştir. (B), 15.05.2025 tarihinde (A) aleyhine tazminat davası açmıştır.


    6098 sayılı Türk Borçlar Kanunu’na göre, (B)’nin tazminat istemi zamanaşımına uğramış mıdır?

    '
  secenekler:
    A: Evet, çünkü zarar ve tazminat yükümlüsünün öğrenildiği tarihten itibaren iki yıl geçmiştir.
    B: Hayır, çünkü fiilin işlendiği tarihten itibaren on yıl henüz dolmamıştır.
    C: Evet, çünkü fiilin işlendiği tarihten itibaren iki yıl geçmiştir.
    D: Hayır, çünkü zarar ve tazminat yükümlüsünün öğrenildiği tarihten itibaren on yıl henüz dolmamıştır.
    E: Evet, çünkü her hâlde fiilin işlendiği tarihten itibaren beş yıl geçmiştir.
  dogru: A
  aciklama:
    dogru_neden: 'TBK md. 72/1 uyarınca tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği
      tarihten başlayarak iki yılın ve her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına
      uğrar. (B) zararı ve yükümlüyü 20.04.2023’te öğrenmiş, dava 15.05.2025’te açılmıştır; iki yıllık süre dolmuştur.
      On yıllık süre henüz dolmamış olsa da iki yıllık süre dolduğu için istem zamanaşımına uğramıştır.

      Püf noktaları: İki yıllık süre öğrenme tarihinden, on yıllık süre fiil tarihinden işlemeye başlar; hangi süre
      önce dolarsa zamanaşımı gerçekleşir.

      '
    celdiriciler:
      B: On yıllık süre dolmamış olsa da iki yıllık öğrenme süresi dolduğu için zamanaşımı gerçekleşir.
      C: İki yıllık süre fiilin işlendiği tarihten değil, zarar ve yükümlünün öğrenildiği tarihten işlemeye başlar.
      D: On yıllık süre öğrenme tarihinden değil, fiilin işlendiği tarihten işlemeye başlar; ayrıca iki yıllık süre
        zaten dolmuştur.
      E: Kanunda beş yıllık bir süre öngörülmemiştir; süreler iki ve on yıldır.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 72/1
    alinti: Tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yılın
      ve her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar.
