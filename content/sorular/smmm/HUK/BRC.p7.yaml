      borçtan kurtarır; kalan borç 1.600.000 TL olur. B 1.600.000 TL ödediğinden kendi payını (800.000) aşan 800.000 TL’yi
      C’den isteyebilir (md. 167/2).

      Püf noktaları: İbra sonrası kalan borç üzerinden eşit paylaşım yapılır; ibranın sonucuna alacaklı katlanır (md. 168/2).

      '
