- id: SMMM-HUK-BRC-0012
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: müteselsil borç
  tip: uygulama
  zorluk: 3
  kok: '(X), (Y) ve (Z), alacaklı (A)’ya karşı 900.000 TL tutarındaki bir borçtan müteselsil borçlu sıfatıyla sorumludur.
    Borçlular arasında paylaşıma ilişkin bir anlaşma yoktur ve hukuki ilişkinin niteliği de farklı bir paylaşımı
    gerektirmemektedir. (X), alacaklı (A)’ya 900.000 TL’nin tamamını ödemiştir. (Y) ve (Z)’nin ödeme gücü vardır.


    6098 sayılı Türk Borçlar Kanunu’na göre (X)’in (Y) ve (Z)’ye rücu edebileceği tutarların toplamı kaç TL’dir?

    '
  secenekler:
    A: '300.000'
    B: '450.000'
    C: '600.000'
    D: '900.000'
    E: '0'
  dogru: C
  aciklama:
    dogru_neden: 'TBK md. 167/1’e göre aksi kararlaştırılmadıkça borçlulardan her biri eşit paylarla sorumludur;
      her birinin payı 300.000 TL’dir. Md. 167/2 uyarınca kendisine düşen paydan fazla ifada bulunan borçlu, ödediği
      fazla miktarı diğer borçlulardan isteme hakkına sahiptir ve her birine ancak payı oranında rücu edebilir.
      (X) 900.000 TL ödediğinden kendi payını (300.000 TL) aşan 600.000 TL’yi (Y) ve (Z)’den isteyebilir.

      Püf noktaları: Rücu, yalnızca kendi payını aşan kısım içindir; tamamı için rücu edilemez.

      '
    celdiriciler:
      A: Yalnızca bir borçlunun payı esas alınmıştır; (X) iki borçludan toplam 600.000 TL isteyebilir.
      B: Ödenen tutar ikiye bölünmüş (900.000/2); oysa üç eşit pay vardır.
      D: Kendi payı dahil tamamı rücu edilemez; md. 167/2 yalnızca fazla ödenen miktar için rücu hakkı tanır.
      E: Rücu hakkı vardır; (Y) ve (Z) ödeme gücüne sahip olduğundan alınamayan miktar sorunu da yoktur.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 167/1
    alinti: Aksi kararlaştırılmadıkça veya borçlular arasındaki hukuki ilişkinin niteliğinden anlaşılmadıkça, borçlulardan
      her biri, alacaklıya yapılan ifadan, birbirlerine karşı eşit paylarla sorumludurlar.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 167/2
    alinti: Kendisine düşen paydan fazla ifada bulunan borçlunun, ödediği fazla miktarı diğer borçlulardan isteme
      hakkı vardır. Bu durumda borçlu, her bir borçluya ancak payı oranında rücu edebilir.
