- id: SMMM-HUK-BRC-0014
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: taksitle satış
  tip: uygulama
  zorluk: 3
  kok: '(S) satıcı, (A) alıcı ile 10.01.2026 tarihinde yazılı taksitle satış sözleşmesi yapmıştır. Sözleşme, satıcının
    ticari faaliyeti kapsamındadır. (A), sözleşmenin bir nüshasını 10.01.2026’da eline geçirmiştir. (A), 15.01.2026
    tarihinde geri alma hakkını kullanmak istemektedir.


    6098 sayılı Türk Borçlar Kanunu’na göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Geri alma hakkı yedi gündür; 15.01.2026’da süre dolmuştur, kullanılamaz.
    B: Geri alma hakkı yedi gündür; 15.01.2026 süresi içindedir ve yazılı bildirimle kullanılabilir.
    C: Geri alma hakkı on gündür; kullanılabilir.
    D: Geri alma hakkından önceden feragat edilebilir.
    E: Geri alma hakkı yalnızca tüketici işlemlerinde geçerlidir; ticari satışta yoktur.
  dogru: B
  aciklama:
    dogru_neden: 'TBK md. 255’e göre taksitle satış sözleşmesi, alıcı bakımından taraflarca imzalanmış sözleşmenin
      bir nüshasının eline geçmesinden yedi gün sonra hüküm ve sonuçlarını doğurur. Alıcı, bu süre içinde irade
      açıklamasını geri aldığını satıcıya yazılı olarak bildirebilir. Bu haktan önceden feragat edilemez. 10.01’de
      nüsha alınmış, 15.01 yedi günlük süre içindedir (11-17 Ocak).

      Püf noktaları: Süre nüshanın eline geçmesinden başlar; yazılı bildirim şarttır ve feragat edilemez.

      '
    celdiriciler:
      A: 10.01 + 7 gün = 17.01; 15.01 süre içindedir.
      C: Süre yedi gündür, on gün değildir.
      D: Bu haktan önceden feragat edilemez (md. 255).
      E: Taksitle satış hükümleri ticari faaliyet kapsamındaki satışlarda da uygulanır (md. 253).
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 255
    alinti: Taksitle satış sözleşmesi, alıcı bakımından, taraflarca imzalanmış sözleşmenin bir nüshasının eline
      geçmesinden yedi gün sonra hüküm ve sonuçlarını doğurur. Alıcı, bu süre içinde irade açıklamasını geri aldığını
      satıcıya yazılı olarak bildirebilir. Bu haktan önceden feragat edilemez.
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 253
    alinti: 'Taksitle satış sözleşmesi, yazılı şekilde yapılmadıkça geçerli olmaz. Malın satıcının ticari faaliyeti
      kapsamında satılması hâlinde, sözleşmede aşağıdaki hususlar belirtilir: … 8. Alıcının yedi gün içinde sözleşme
      yapılması konusundaki irade açıklamasını geri alma hakkı.'
  gecerlilik:
