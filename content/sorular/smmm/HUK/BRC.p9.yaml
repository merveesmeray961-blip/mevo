- id: SMMM-HUK-BRC-0046
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: yanılma
  tip: kavrama
  zorluk: 1
  kok: 6098 sayılı Türk Borçlar Kanununa göre aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Basit hesap yanlışlıkları sözleşmenin geçerliliğini etkilemez; bunların düzeltilmesiyle yetinilir.
    B: Yanılan, gerçekte istediğinden önemli ölçüde fazla bir edim için irade açıklamışsa bu yanılma esaslı olabilir.
    C: Saikte yanılma kural olarak esaslı yanılma sayılmaz.
    D: İrade açıklamasının haberci veya çevirmen tarafından yanlış iletilmesi hâlinde yanılma hükümleri uygulanmaz.
    E: Sözleşme kurulurken esaslı yanılmaya düşen taraf sözleşme ile bağlı olmaz.
  dogru: D
  aciklama:
    dogru_neden: E yanlıştır. TBK md. 33, iradenin haberci veya çevirmen gibi bir aracı ya da araç tarafından yanlış
      iletilmesinde de yanılma hükümlerinin uygulanacağını açıkça belirtir.
    celdiriciler:
      A: Md. 31 basit hesap yanlışlıkları için özel kural koyar.
      B: Md. 31/5 esaslı yanılma hâllerinden biridir.
      C: Md. 32'nin kuralıdır.
      E: Md. 30'un sonucudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 30
    alinti: '         MADDE 30- Sözleşme kurulurken esaslı yanılmaya düşen taraf, sözleşme ile bağlı

      olmaz.'
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 31
    alinti: "        MADDE 31- Özellikle aşağıda sayılan yanılma hâlleri esaslıdır:\n        1. Yanılan, kurulmasını\
      \ istediği sözleşmeden başka bir sözleşme için iradesini açıklamışsa.\n        2. Yanılan, istediğinden başka\
      \ bir konu için iradesini açıklamışsa.\n        3. Yanılan, sözleşme yapma iradesini, gerçekte sözleşme yapmak\
      \ istediği kişiden\nbaşkasına açıklamışsa."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 31
    alinti: "        4. Yanılan, sözleşmeyi yaparken belirli nitelikleri olan bir kişiyi dikkate almasına\nkarşın\
      \ başka bir kişi için iradesini açıklamışsa.\n        5. Yanılan, gerçekte üstlenmek istediğinden önemli ölçüde\
      \ fazla bir edim için veya\ngerçekte istediğinden önemli ölçüde az bir karşı edim için iradesini açıklamışsa.\n\
      \        Basit hesap yanlışlıkları sözleşmenin geçerliliğini etkilemez; bunların düzeltilmesi ile\nyetinilir."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 32-33
    alinti: "        b. Saikte yanılma\n        MADDE 32- Saikte yanılma, esaslı yanılma sayılmaz. Yanılanın, yanıldığı\
      \ saiki\nsözleşmenin temeli sayması ve bunun da iş ilişkilerinde geçerli dürüstlük kurallarına uygun\nolması\
      \ hâlinde yanılma esaslı sayılır. Ancak bu durumun karşı tarafça da bilinebilir olması\ngerekir.\n\n     \
      \   c. İletmede yanılma\n        MADDE 33- Sözleşmenin kurulmasına yönelik iradenin haberci veya çevirmen\
      \ gibi bir\naracı ya da bir araç tarafından yanlış iletilmiş olması hâlinde de yanılma hükümleri uygulanır."
