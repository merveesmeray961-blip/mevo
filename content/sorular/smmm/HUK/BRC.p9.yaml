- id: SMMM-HUK-BRC-0045
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: sözleşmenin kurulması
  tip: kavrama
  zorluk: 1
  kok: '6098 sayılı Türk Borçlar Kanununa göre aşağıdaki önermelerden hangileri doğrudur?

    I. Fiyatını göstererek mal sergilenmesi, aksi açıkça ve kolaylıkla anlaşılmadıkça öneri sayılır.

    II. Geri alma açıklaması, öneriden önce veya aynı anda ulaşırsa öneri yapılmamış sayılır.

    III. Hazır olmayanlar arasında sözleşme, kabulün gönderildiği anda hüküm doğurur.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: Üç önerme de TBK md. 8, 10 ve 11'deki kurallarla uyumludur.
    celdiriciler:
      A: II ve III de doğrudur.
      B: I ve III de doğrudur.
      C: III de doğrudur.
      D: I de doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 8
    alinti: "        5. Bağlayıcı olmayan öneri ve herkese açık öneri\n        MADDE 8- Öneren, önerisi ile bağlı\
      \ olmama hakkının saklı olduğunu açıkça belirtirse\nveya işin özelliğinden ya da durumun gereğinden bağlanma\
      \ niyetinde olmadığı anlaşılırsa,\nönerisi kendisini bağlamaz.\n        Fiyatını göstererek mal sergilenmesi\
      \ veya tarife, fiyat listesi ya da benzerlerinin\ngönderilmesi, aksi açıkça ve kolaylıkla anlaşılmadıkça öneri\
      \ sayılır."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 10-11
    alinti: "      7. Önerinin ve kabulün geri alınması\n      MADDE 10- Geri alma açıklaması, diğer tarafa öneriden\
      \ önce veya aynı anda ulaşmış\nya da daha sonra ulaşmakla birlikte diğer tarafça öneriden önce öğrenilmiş\
      \ olursa, öneri\nyapılmamış sayılır.\n      Bu kural, kabulün geri alınmasında da uygulanır.\n\n       III.\
      \ Hazır olmayanlar arasında kurulan sözleşmenin hüküm anı\n       MADDE 11- Hazır olmayanlar arasında kurulan\
      \ sözleşmeler, kabulün gönderildiği\nandan başlayarak hüküm doğurur."
