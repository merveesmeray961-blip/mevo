    madde: md. 31
    alinti: "        4. Yanılan, sözleşmeyi yaparken belirli nitelikleri olan bir kişiyi dikkate almasına\nkarşın başka bir\
      \ kişi için iradesini açıklamışsa.\n        5. Yanılan, gerçekte üstlenmek istediğinden önemli ölçüde fazla bir edim\
      \ için veya\ngerçekte istediğinden önemli ölçüde az bir karşı edim için iradesini açıklamışsa.\n        Basit hesap\
      \ yanlışlıkları sözleşmenin geçerliliğini etkilemez; bunların düzeltilmesi ile\nyetinilir."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 32-33
