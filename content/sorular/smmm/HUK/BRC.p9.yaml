  kok: Aşağıdaki olayların borç kaynağı bakımından doğru eşleştirilmesi hangisidir? I. Geçerli bir sözleşmeyle tarafların
    karşılıklı irade açıklamaları sonucu doğan edim borcu. II. Kusurlu ve hukuka aykırı fiille başkasına zarar verilmesi.
    III. Haklı sebep olmaksızın başkasının malvarlığından zenginleşme.
  secenekler:
    A: I-sözleşme, II-haksız fiil, III-sebepsiz zenginleşme
    B: I-haksız fiil, II-sözleşme, III-sebepsiz zenginleşme
    C: I-sebepsiz zenginleşme, II-haksız fiil, III-sözleşme
    D: I-sözleşme, II-sebepsiz zenginleşme, III-haksız fiil
    E: I-haksız fiil, II-sebepsiz zenginleşme, III-sözleşme
  dogru: A
  aciklama:
    dogru_neden: 'I, sözleşmenin karşılıklı ve uygun irade açıklamalarıyla kurulmasına; II, kusurlu ve hukuka aykırı fiille
      zararın giderilmesine; III, haklı sebep olmaksızın malvarlığından veya emekten zenginleşmenin geri verilmesine dayanır.
      Püf noktaları: Borç kaynağını belirlerken olayın görünüşüne değil, borcu doğuran hukuki olguya bakılmalı; sözleşme,
      haksız fiil ve sebepsiz zenginleşmenin kurucu unsurları ayrıştırılmalıdır.'
    celdiriciler:
      B: I ve II'nin kaynaklarını tersine çevirir.
      C: I ile III'ün kaynaklarını tersine çevirir.
      D: II ve III'ün kaynaklarını tersine çevirir.
      E: Üçlü sınıflandırmayı iki noktada yanlış eşleştirir.
    hesap_adimlari: []
