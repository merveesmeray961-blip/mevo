      \       İrade açıklaması, açık veya örtülü olabilir."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 49
    alinti: "        MADDE 49- Kusurlu ve hukuka aykırı bir fiille başkasına zarar veren, bu zararı\ngidermekle yükümlüdür.\n\
      \        Zarar verici fiili yasaklayan bir hukuk kuralı bulunmasa bile, ahlaka aykırı bir fiille\nbaşkasına kasten zarar\
      \ veren de, bu zararı gidermekle yükümlüdür."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 77
