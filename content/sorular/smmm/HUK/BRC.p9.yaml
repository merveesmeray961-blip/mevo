    madde: md. 31
    alinti: "        MADDE 31- Özellikle aşağıda sayılan yanılma hâlleri esaslıdır:\n        1. Yanılan, kurulmasını istediği\
      \ sözleşmeden başka bir sözleşme için iradesini açıklamışsa.\n        2. Yanılan, istediğinden başka bir konu için iradesini\
      \ açıklamışsa.\n        3. Yanılan, sözleşme yapma iradesini, gerçekte sözleşme yapmak istediği kişiden\nbaşkasına açıklamışsa."
