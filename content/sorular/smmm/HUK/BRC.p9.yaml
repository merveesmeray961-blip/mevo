  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: borç kaynakları
  tip: kavrama
  zorluk: 3
  kok: Aşağıdaki olayların borç kaynağı bakımından doğru eşleştirilmesi hangisidir? I. Kiracının kira bedelini ödeme
    borcu. II. Sürücünün dikkatsizlikle park hâlindeki araca çarparak verdiği zararı giderme borcu. III. Hatayla
    başkasının hesabına yapılan ödemenin geri verilmesi borcu.
  secenekler:
    A: I-sözleşme, II-haksız fiil, III-sebepsiz zenginleşme
    B: I-haksız fiil, II-sözleşme, III-sebepsiz zenginleşme
    C: I-sebepsiz zenginleşme, II-haksız fiil, III-sözleşme
    D: I-sözleşme, II-sebepsiz zenginleşme, III-haksız fiil
    E: I-haksız fiil, II-sebepsiz zenginleşme, III-sözleşme
  dogru: A
  aciklama:
    dogru_neden: I, karşılıklı ve birbirine uygun irade açıklamalarıyla kurulan kira sözleşmesine (md. 1); II, kusurlu
      ve hukuka aykırı fiille başkasına zarar verilmesine (md. 49/1); III, haklı sebep olmaksızın başkasının malvarlığından
      zenginleşmenin geri verilmesine (md. 77) dayanır. Borç kaynağını belirlerken olayın görünüşüne değil, borcu
      doğuran hukuki olguya bakılmalıdır.
    celdiriciler:
      B: I ve II'nin kaynaklarını tersine çevirir.
      C: I ile III'ün kaynaklarını tersine çevirir.
      D: II ve III'ün kaynaklarını tersine çevirir.
      E: Üç olayın hiçbirini doğru kaynakla eşleştirmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 1
    alinti: "       MADDE 1- Sözleşme, tarafların iradelerini karşılıklı ve birbirine uygun olarak\naçıklamalarıyla\
      \ kurulur.\n       İrade açıklaması, açık veya örtülü olabilir."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 49
    alinti: "        MADDE 49- Kusurlu ve hukuka aykırı bir fiille başkasına zarar veren, bu zararı\ngidermekle\
      \ yükümlüdür.\n        Zarar verici fiili yasaklayan bir hukuk kuralı bulunmasa bile, ahlaka aykırı bir fiille\n\
      başkasına kasten zarar veren de, bu zararı gidermekle yükümlüdür."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 77
    alinti: "        MADDE 77- Haklı bir sebep olmaksızın, bir başkasının malvarlığından veya\nemeğinden zenginleşen,\
