- id: SMMM-HUK-BRC-0047
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: borcun sona ermesi
  tip: uygulama
  zorluk: 3
  kok: 6098 sayılı Türk Borçlar Kanununa göre aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Asıl borcun ifa veya başka bir sebeple sona ermesi hâlinde, rehin, kefalet, faiz ve ceza koşulu gibi bağlı hak ve borçlar
      da kural olarak sona erer.
    B: Şekle bağlı bir borç, tarafların şekle bağlı olmaksızın yaptıkları ibra sözleşmesiyle tamamen veya kısmen ortadan kaldırılabilir.
    C: Mevcut borcun yeni bir borçla sona ermesi, tarafların bu yöndeki açık iradesini gerektirir.
    D: Mevcut borç için yeni bir alacak senedi düzenlenmesi, tarafların açık yenileme iradesi bulunmasa bile tek başına yenileme
      sayılır.
    E: Alacaklı ve borçlu sıfatlarının aynı kişide birleşmesiyle borç sona erer; üçüncü kişilerin alacak üzerindeki önceden
      mevcut hakları bundan etkilenmez.
  dogru: D
  aciklama:
    dogru_neden: 'D yanlıştır. Yeni alacak senedi düzenlenmesi, tarafların açık yenileme iradesi olmadıkça yenileme sayılmaz.
      Püf noktaları: Borcun sona ermesinin genel sonucu ile ibra, yenileme ve birleşme birbirinden ayrılmalı; özellikle yeni
      senet düzenlenmesi ile yenileme arasında açık irade şartı aranmalıdır.'
    celdiriciler:
      A: Md. 131'in bağlı hak ve borçlara ilişkin sonucudur.
      B: Md. 132, ibra için borcu doğuran işlemdeki şekle bağlılığı aramaz.
      C: Md. 133 açık yenileme iradesini şart koşar.
      E: Md. 135'in birleşme kuralıdır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 131
    alinti: "        MADDE 131- Asıl borç ifa ya da diğer bir sebeple sona erdiği takdirde, rehin, kefalet,\nfaiz ve ceza\
      \ koşulu gibi buna bağlı hak ve borçlar da sona ermiş olur.\n        İşlemiş faizin ve ceza koşulunun ifasını isteme\
      \ hakkı sözleşmeyle veya ifa anına kadar\nyapılacak bir bildirimle saklı tutulmuş ise ya da durum ve koşullardan saklı\
      \ tutulduğu\nanlaşılmaktaysa, bu faizler ve ceza koşulu istenebilir.\n        Taşınmaz rehnine, kıymetli evraka ve konkordatoya\
      \ ilişkin özel hükümler saklıdır."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 132
    alinti: "       B. İbra\n       MADDE 132- Borcu doğuran işlem kanunen veya taraflarca belli bir şekle bağlı\ntutulmuş\
      \ olsa bile borç, tarafların şekle bağlı olmaksızın yapacakları ibra sözleşmesiyle\ntamamen veya kısmen ortadan kaldırılabilir."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 133
    alinti: "       C. Yenileme\n       I. Genel olarak\n       MADDE 133- Yeni bir borçla mevcut bir borcun sona erdirilmesi,\
      \ ancak tarafların bu\nyöndeki açık iradesi ile olur.\n       Özellikle mevcut borç için kambiyo taahhüdünde bulunulması\
      \ veya yeni bir alacak\nsenedi ya da yeni bir kefalet senedi düzenlenmesi, tarafların açık yenileme iradeleri olmadıkça\n\
      yenileme sayılmaz."
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 135
    alinti: "       D. Birleşme\n       MADDE 135- Alacaklı ve borçlu sıfatlarının aynı kişide birleşmesiyle borç sona erer.\n\
      Ancak, üçüncü kişilerin alacak üzerinde önceden mevcut olan hakları birleşmeden etkilenmez.\n       Birleşme geçmişe\
      \ etkili olarak ortadan kalkarsa, borç varlığını sürdürür."
