- id: SMMM-HUK-BRC-0001
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: haksız fiil ve zamanaşımı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: >-
    Aralarında herhangi bir sözleşme ilişkisi bulunmayan M'nin kusurlu davranışı sonucunda K'ye ait iş makinesi
    15 Mart 2021 tarihinde hasar görmüştür. K, zararını ve tazminat yükümlüsünün M olduğunu ancak 20 Haziran
    2026 tarihinde öğrenmiştir. Fiil, ceza kanunlarında daha uzun bir zamanaşımı öngörülen bir suç
    oluşturmamaktadır. Zamanaşımını kesen veya durduran bir sebep bulunmadığına göre, 6098 sayılı Türk Borçlar
    Kanunu'na göre K'nin haksız fiilden doğan tazminat istemi hangi tarihte zamanaşımına uğrar?
  secenekler:
    A: "15 Mart 2023"
    B: "20 Haziran 2028"
    C: "15 Mart 2031"
    D: "20 Haziran 2031"
    E: "20 Haziran 2036"
  dogru: B
  aciklama:
    dogru_neden: >-
      TBK md. 72/1'e göre tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten
      başlayarak iki yılın ve her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına
      uğrar. İki yıllık süre öğrenme tarihinden (20 Haziran 2026) itibaren 20 Haziran 2028'de, on yıllık
      süre fiil tarihinden (15 Mart 2021) itibaren 15 Mart 2031'de dolar. "Her hâlde" ifadesi gereği hangi
      süre önce dolarsa istem o tarihte zamanaşımına uğrar; sonuç 20 Haziran 2028'dir.
    celdiriciler:
      A: "İki yıllık süre fiil tarihinden değil, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlar; fiil tarihine iki yıl eklemek hatalıdır."
      C: "15 Mart 2031, fiil tarihinden başlayan on yıllık üst süredir; ancak öğrenmeden başlayan iki yıllık süre daha önce (20 Haziran 2028'de) dolduğundan istem o tarihte zamanaşımına uğrar."
      D: "Öğrenme tarihine beş yıl eklenerek bulunmuştur; haksız fiilden doğan tazminat istemi için md. 72'de beş yıllık bir süre öngörülmemiştir."
      E: "On yıllık süre öğrenme tarihinden değil fiilin işlendiği tarihten başlar; ayrıca iki yıllık süre çok daha önce dolmaktadır."
    hesap_adimlari:
      - "İki yıllık süre: öğrenme tarihi 20.06.2026 + 2 yıl = 20.06.2028"
      - "On yıllık üst süre: fiil tarihi 15.03.2021 + 10 yıl = 15.03.2031"
      - "Önce dolan süre esas alınır: 20.06.2028"
  kaynaklar:
    - mevzuat: "6098 sayılı Türk Borçlar Kanunu"
      madde: "md. 72/1"
      alinti: "Tazminat istemi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yılın ve her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar. Ancak, tazminat ceza kanunlarının daha uzun bir zamanaşımı öngördüğü cezayı gerektiren bir fiilden doğmuşsa, bu zamanaşımı uygulanır."
  gecerlilik:
    baslangic: "2012-07-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"

- id: SMMM-HUK-BRC-0002
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: Borçlar hukuku (6098)
  konu: BRC
  kazanim: zamanaşımı süreleri
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: >-
    6098 sayılı Türk Borçlar Kanunu'na göre aşağıdaki alacaklardan hangisi beş yıllık zamanaşımına tabi
    **değildir**?
  secenekler:
    A: "Bir otelde konaklama bedelinden doğan alacak"
    B: "Dönemsel olarak ödenen kira bedeli alacağı"
    C: "Vekâlet sözleşmesinden doğan alacak"
    D: "Ticari simsarlık ücreti alacağı"
    E: "Küçük çapta perakende satıştan doğan alacak"
  dogru: D
  aciklama:
    dogru_neden: >-
      TBK md. 147'nin 5. bendi vekâlet, komisyon ve acentalık sözleşmelerinden doğan alacakları ve simsarlık
      sözleşmesinden doğan alacakları beş yıllık zamanaşımına bağlarken "ticari simsarlık ücreti alacağı"nı
      açıkça bu kapsamın dışında bırakmıştır. Bu nedenle ticari simsarlık ücreti alacağı md. 147'deki beş
      yıllık zamanaşımına tabi değildir; Kanunda aksine bir hüküm bulunmadıkça md. 146'daki on yıllık genel
      zamanaşımı uygulanır.
    celdiriciler:
      A: "md. 147/2 uyarınca otel, motel, pansiyon ve tatil köyü gibi yerlerdeki konaklama bedelleri beş yıllık zamanaşımına tabidir."
      B: "md. 147/1 uyarınca kira bedelleri, anapara faizleri ve ücret gibi dönemsel edimler beş yıllık zamanaşımına tabidir."
      C: "md. 147/5 uyarınca vekâlet sözleşmesinden doğan alacaklar beş yıllık zamanaşımına tabidir."
      E: "md. 147/3 uyarınca küçük sanat işlerinden ve küçük çapta perakende satışlardan doğan alacaklar beş yıllık zamanaşımına tabidir."
  kaynaklar:
    - mevzuat: "6098 sayılı Türk Borçlar Kanunu"
      madde: "md. 147/1, 2, 3, 5"
      alinti: "Aşağıdaki alacaklar için beş yıllık zamanaşımı uygulanır: 1. Kira bedelleri, anapara faizleri ve ücret gibi diğer dönemsel edimler. 2. Otel, motel, pansiyon ve tatil köyü gibi yerlerdeki konaklama bedelleri ile lokanta ve benzeri yerlerdeki yeme içme bedelleri. 3. Küçük sanat işlerinden ve küçük çapta perakende satışlardan doğan alacaklar. ... 5. Vekâlet, komisyon ve acentalık sözleşmelerinden, ticari simsarlık ücreti alacağı dışında, simsarlık sözleşmesinden doğan alacaklar."
    - mevzuat: "6098 sayılı Türk Borçlar Kanunu"
      madde: "md. 146"
      alinti: "Kanunda aksine bir hüküm bulunmadıkça, her alacak on yıllık zamanaşımına tabidir."
  gecerlilik:
    baslangic: "2012-07-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"
