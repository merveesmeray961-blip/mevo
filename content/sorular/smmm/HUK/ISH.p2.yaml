  soru_bicimi: standart
  kok: 4857 sayılı İş Kanunu'na göre, belirsiz süreli iş sözleşmesiyle çalışan aşağıdaki işçilerden hangisinin sözleşmesini
    fesheden işveren, feshi geçerli bir sebebe dayandırmak zorundadır?
  secenekler:
    A: İşverenin tek işyeri olan ve 40 işçi çalıştırılan işyerinde, yer üstü işlerinde çalışan ve 5 aylık kıdemi
      bulunan işçi.
    B: 24 işçi çalıştırılan işyerinde 2 yıldır çalışan işçi; işverenin farklı bir işkolunda 20 işçi çalıştırdığı
      ikinci bir işyeri vardır.
    C: İşverenin tek işyeri olan ve 29 işçi çalıştırılan işyerinde, yer altı işlerinde 2 aydır çalışan işçi.
    D: 60 işçi çalıştıran işyerinde 3 yıldır çalışan; işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve
      işten çıkarma yetkisi bulunan işveren vekili.
    E: 24 işçi çalıştırılan işyerinde 2 yıldır çalışan işçi; işverenin aynı işkolunda 7 işçi çalıştırdığı ikinci
      bir işyeri vardır.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 18/1''e göre geçerli sebep zorunluluğu, otuz veya daha fazla işçi çalıştıran işyerlerinde
      en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren için vardır; yer altı
      işlerinde kıdem şartı aranmaz. Md. 18/4''ün ikinci cümlesine göre işverenin aynı işkolunda birden fazla işyeri bulunması hâlinde
      işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir. E şıkkında 24
      + 7 = 31 işçi vardır ve işçinin kıdemi iki yıldır; geçerli sebep zorunludur. Püf noktaları: Belirsiz
      süreli sözleşmeyle çalışan işçi için iki koşul birlikte aranır: işyerinde otuz veya daha fazla işçi çalışması
      ve en az altı aylık kıdem. Ayrıca md. 18/5 uyarınca işletmenin bütününü sevk ve idare eden işveren vekili
      ve yardımcıları ile işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan
      işveren vekilleri hakkında md. 18 uygulanmaz; kapsam dışı bırakılan, her işveren vekili değil yalnızca bunlardır.
      Yer altı işçisi için yalnızca kıdem şartı aranmaz, işçi sayısı şartı aranır (29 işçili işyeri yetmez). Md.
      18/4 toplama kuralını yalnızca işverenin aynı işkolundaki işyerleri için öngörür; farklı işkolundaki işyerinin
      işçileri bu kurala göre sayıya eklenmez.'
    celdiriciler:
      A: İşyerindeki işçi sayısı yeterlidir (40) ancak işçinin kıdemi altı aydan azdır (5 ay) ve yer altı işçisi
        olmadığından kıdem şartından muaf değildir (md. 18/1).
      B: Md. 18/4 toplam işçi sayısını yalnızca işverenin aynı işkolunda birden fazla işyeri bulunması hâlinde esas
        alır; farklı işkolundaki işyerinin 20 işçisi sayıya eklenmez. İşyerindeki işçi sayısı 24'tür, otuzdan azdır.
      C: Yer altı işlerinde çalışan işçilerde yalnızca kıdem şartı aranmaz (md. 18/1); işyerinde en az otuz işçi
        çalışması şartı devam eder ve işverenin tek işyerinde 29 işçi vardır.
      D: İşyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri
        hakkında md. 18 uygulanmaz (md. 18/5).
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 18/1
    alinti: 'Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli
      iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin
      veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.)
      Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz.'
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 18/4 (ikinci cümle)
    alinti: İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu
      işyerlerinde çalışan toplam işçi sayısına göre belirlenir.
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 18/5
    alinti: İşletmenin bütününü sevk ve idare eden işveren vekili ve yardımcıları ile işyerinin bütününü sevk ve
      idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri hakkında bu madde, 19 ve
      21 inci maddeler ile 25 inci maddenin son fıkrası uygulanmaz.
