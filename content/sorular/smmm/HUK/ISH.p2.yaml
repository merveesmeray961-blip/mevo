  kok: 4857 sayılı İş Kanunu'na göre, belirsiz süreli iş sözleşmesiyle çalışan aşağıdaki işçilerden hangisinin sözleşmesini
    fesheden işveren, feshi geçerli bir sebebe dayandırmak zorundadır?
  secenekler:
    A: Çalışan sayısı 40 olan işyerinde, yer üstü işlerinde 5 aydır çalışan işçi.
    B: 24 işçi çalıştırılan işyerinde 2 yıldır çalışan işçi; işverenin farklı bir işkolunda 20 işçi çalıştırdığı
      ikinci bir işyeri vardır.
    C: Çalışan sayısı 29 olan işyerinde, yer altı işlerinde 2 aydır çalışan işçi.
    D: 60 işçi çalıştıran işyerinde 3 yıldır çalışan; işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve
      işten çıkarma yetkisi bulunan işveren vekili.
    E: 24 işçi çalıştırılan işyerinde 2 yıldır çalışan işçi; işverenin aynı işkolunda 7 işçi çalıştırdığı ikinci
      bir işyeri vardır.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 18/1''e göre geçerli sebep zorunluluğu, otuz veya daha fazla işçi çalıştıran işyerlerinde
      en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren için vardır; yer altı
      işlerinde kıdem şartı aranmaz. Md. 18/4''e göre işverenin aynı işkolunda birden fazla işyeri bulunması hâlinde
      işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir. E şıkkında 24
      + 7 = 31 işçi vardır ve işçinin kıdemi iki yıldır; geçerli sebep zorunludur. Püf noktaları: Üç koşul birlikte
      aranır: işçi sayısı (30 ve üzeri), kıdem (6 ay) ve işçinin işveren vekili olmaması. Yer altı işçisi için yalnızca
      kıdem şartı aranmaz, işçi sayısı şartı aranır (29 işçili işyeri yetmez). İşyerlerinin toplanması yalnızca
      aynı işkolundaki işyerleri için geçerlidir; farklı işkolundaki işyeri sayıya eklenmez.'
    celdiriciler:
      A: İşyerindeki işçi sayısı yeterlidir (40) ancak işçinin kıdemi altı aydan azdır (5 ay) ve yer altı işçisi
        olmadığından kıdem şartından muaf değildir (md. 18/1).
      B: Farklı işkolundaki işyerinin işçileri sayıya eklenmez; yalnızca aynı işkolunda birden fazla işyeri bulunması
        hâlinde toplam işçi sayısı esas alınır (md. 18/4). İşyerindeki işçi sayısı 24'tür, otuzdan azdır.
      C: Yer altı işlerinde çalışan işçilerde yalnızca kıdem şartı aranmaz (md. 18/1); işyerinde en az otuz işçi
        çalışması şartı devam eder ve işyerinde 29 işçi vardır.
      D: İşyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri
        hakkında md. 18 uygulanmaz (md. 18/5).
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
