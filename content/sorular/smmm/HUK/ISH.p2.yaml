      veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.)
      Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz.'
  - mevzuat: 4857 sayılı İş Kanunu
