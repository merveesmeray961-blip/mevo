    madde: md. 53/5 (yaş sınırı)
    alinti: Ancak onsekiz ve daha küçük yaştaki işçilerle elli ve daha yukarı yaştaki işçilere verilecek yıllık
      ücretli izin süresi yirmi günden az olamaz.
