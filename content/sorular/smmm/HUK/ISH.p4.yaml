  kazanim: 'izinler — yıllık ücretli izin süreleri: hizmet süresi basamakları ile yaş alt sınırı (md. 53)'
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: '4857 sayılı İş Kanunu''na göre aşağıdaki işçilerden hangisinin kanuni asgari yıllık ücretli izin süresi
    diğerlerinden farklıdır?


    (Tüm işçiler yıllık ücretli izin hakkını kazanmıştır; hiçbiri yer altı işlerinde çalışmamaktadır; iş sözleşmelerinde
    ve toplu iş sözleşmelerinde izin süresini artıran bir hüküm bulunmamaktadır; hizmet süreleri tam yıldır.)'
  secenekler:
    A: 7 yıllık hizmet süresi bulunan 30 yaşındaki işçi
    B: 3 yıllık hizmet süresi bulunan 52 yaşındaki işçi
    C: 2 yıllık hizmet süresi bulunan 17 yaşındaki işçi
    D: 5 yıllık hizmet süresi bulunan 35 yaşındaki işçi
    E: 12 yıllık hizmet süresi bulunan 40 yaşındaki işçi
  dogru: D
  aciklama:
    dogru_neden: Md. 53'e göre yıllık ücretli izin süresi, hizmet süresi bir yıldan beş yıla kadar (beş yıl dahil)
      olanlara 14 günden, beş yıldan fazla on beş yıldan az olanlara 20 günden, on beş yıl (dahil) ve daha fazla
      olanlara 26 günden az olamaz; ancak on sekiz ve daha küçük yaştaki işçilerle elli ve daha yukarı yaştaki işçilere
      verilecek izin süresi yirmi günden az olamaz. 5 yıllık hizmeti olan 35 yaşındaki işçide asgari süre 14 gündür;
      diğer dört işçide asgari süre 20 gündür.
    celdiriciler:
      A: 7 yıl, beş yıldan fazla on beş yıldan az hizmet basamağındadır; asgari izin süresi 20 gündür.
      B: 3 yıllık hizmet süresine göre izin süresi 14 gün olacaktır; ancak elli ve daha yukarı yaştaki işçiye verilecek
        izin süresi yirmi günden az olamayacağından asgari süre 20 gündür.
      C: 2 yıllık hizmet süresine göre 14 gün olacaktır; ancak on sekiz ve daha küçük yaştaki işçilere verilecek
        izin süresi yirmi günden az olamayacağından 17 yaşındaki işçi için asgari süre 20 gündür.
      E: 12 yıl, beş yıldan fazla on beş yıldan az hizmet basamağındadır; asgari izin süresi 20 gündür.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 53/4 (a)–(c)
    alinti: İşçilere verilecek yıllık ücretli izin süresi, hizmet süresi; a) Bir yıldan beş yıla kadar (beş yıl
      dahil) olanlara ondört günden, b) Beş yıldan fazla onbeş yıldan az olanlara yirmi günden, c) Onbeş yıl (dahil)
      ve daha fazla olanlara yirmialtı günden, Az olamaz.
