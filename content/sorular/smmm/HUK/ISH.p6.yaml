      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
