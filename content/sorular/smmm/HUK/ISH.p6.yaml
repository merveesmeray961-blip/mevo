- id: SMMM-HUK-ISH-0005
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857, 7036)
  konu: ISH
  kazanim: iş sözleşmesi türleri ve deneme süresi
  tip: bilgi
  zorluk: 1
  kok: 4857 sayılı İş Kanununda bireysel iş sözleşmesine konulan deneme süresi, toplu iş sözleşmesiyle uzatma yapılmadığı
    durumda en çok kaç aydır?
  secenekler:
    A: '1'
    B: '6'
    C: '3'
    D: '4'
    E: '2'
  dogru: E
  aciklama:
    dogru_neden: Md. 15/1'e göre iş sözleşmesine konulan deneme kaydının süresi en çok iki aydır; bu süre ancak toplu iş sözleşmeleriyle
      dört aya kadar uzatılabilir. Kökte toplu iş sözleşmesiyle uzatma bulunmadığından azami süre iki aydır.
    celdiriciler:
      A: Bir ay kanuni azami süre değildir; md. 15/1'e göre taraflar en çok iki aylık deneme süresi koyabilir. Bir ay bu sınır
        içinde kararlaştırılabilecek bir süredir, üst sınır değildir.
      B: Altı aylık deneme süresi md. 15'te yer almaz; deneme süresi toplu iş sözleşmesiyle bile en çok dört aya kadar uzatılabilir.
      C: Üç ay iki aylık azami süreyi aşar; iki ayı aşan deneme süresi ancak toplu iş sözleşmesiyle (dört aya kadar) öngörülebilir,
        kökte böyle bir uzatma yoktur.
      D: Dört ay, deneme süresinin toplu iş sözleşmeleriyle uzatılabileceği üst sınırdır (md. 15/1 ikinci cümle); kökte toplu
        iş sözleşmesiyle uzatma yoktur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 15/1
    alinti: Taraflarca iş sözleşmesine bir deneme kaydı konulduğunda, bunun süresi en çok iki ay olabilir. Ancak deneme süresi
      toplu iş sözleşmeleriyle dört aya kadar uzatılabilir.
  gecerlilik:
    baslangic: '2003-06-10'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ChatGPT'
    istem_surumu: uretici paketi HUK-2026-10-05-30
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: E (güven 5) İK 15: deneme süresi en çok 2 ay (TİS ile 4)'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Düzeltildikten sonra geçti: anahtar E (2 ay) tek doğru; D (4 ay) yalnız TİS ile, kök TİS''i dışlıyor. A çeldiricisinin
          çelişkili açıklaması düzeltildi. Zorluk 1 uygun.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 15/1 iki cümlesi isk.txt ile birebir; çeldirici açıklamalarının hepsi md. 15/1'e dayanıyor. gecerlilik.baslangic
          2003-06-10 doğru (hüküm ilk metinden beri değişmedi).
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (E, güven 5)
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 3
  - tarih: '2026-10-05'
    kim: hakem
    ne: Çeldirici açıklamaları yeniden yazıldı (A'daki 'Azami süre iki ay değildir' cümlesi şıkla çelişiyordu; C ve D TİS
      ile dört aya kadar uzatma imkânına bağlandı); kaynak 'md. 15' → 'md. 15/1', alıntıya TİS cümlesi eklendi; unite alanı
      'İş hukuku (4857' → 'İş hukuku (4857, 7036)'. Kök, şıklar ve anahtar değişmedi (E).
    neden: 'G5/G6: A çeldiricisinin açıklaması kendi şıkkıyla çelişiyordu (A = 1 ay); ''Üç ay öngörülmemiştir'' TİS ile uzatma
      hâlinde yanlış okunabiliyordu.'
