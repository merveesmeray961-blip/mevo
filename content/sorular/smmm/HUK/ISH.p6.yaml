    A: Haktan vazgeçilebilir.
    B: Bir yıldan kısa mevsimlik işlerde zorunludur.
    C: Bir-beş yıl kıdemde en az 14 gün verilir.
    D: Herkese 7 gün verilir.
    E: 15 yıl kıdemde 14 gün verilir.
  dogru: C
  aciklama:
    dogru_neden: Md. 53/1'e göre deneme süresi dahil en az bir yıl çalışmış işçilere yıllık ücretli izin verilir; md. 53/4-a'ya
      göre hizmet süresi bir yıldan beş yıla kadar (beş yıl dahil) olanlara verilecek izin ondört günden az olamaz. (Onsekiz
      ve daha küçük ya da elli ve daha yukarı yaştakiler için yirmi gün alt sınırı bu ifadeyi çürütmez; 'en az 14 gün' yine
      doğrudur.)
    celdiriciler:
      A: Md. 53/2'ye göre yıllık ücretli izin hakkından vazgeçilemez.
      B: Md. 53/3'e göre niteliklerinden ötürü bir yıldan az süren mevsimlik veya kampanya işlerinde çalışanlara yıllık ücretli
        izin hükümleri uygulanmaz.
      D: İzin süresi hizmet süresine göre 14, 20 veya 26 günden az olamaz (md. 53/4); herkese 7 gün verileceğine ilişkin bir
        kural yoktur.
      E: Hizmet süresi onbeş yıl (dahil) ve daha fazla olanlara verilecek izin yirmialtı günden az olamaz (md. 53/4-c).
    hesap_adimlari: []
