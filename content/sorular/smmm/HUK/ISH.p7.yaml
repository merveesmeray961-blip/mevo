- id: SMMM-HUK-ISH-0011
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: toplu işçi çıkarma
  tip: uygulama
  zorluk: 2
  kok: '(N) A.Ş.''nin bir işyerinde 250 işçi çalışmaktadır. İşveren ekonomik nedenlerle 30 işçinin iş sözleşmesini 17. madde
    uyarınca bir aylık süre içinde feshetmek istemektedir.

    4857 sayılı İş Kanunu''na göre bu durum toplu işçi çıkarma sayılır mı ve işverenin yükümlülüğü nedir?

    '
  secenekler:
    A: Sayılır; en az 30 gün önceden işyeri sendika temsilcilerine, bölge müdürlüğüne ve İŞKUR'a yazılı bildirim yapılmalıdır.
    B: Sayılmaz çünkü 30 işçi, 101-300 arası için yüzde on oranının altındadır.
    C: Sayılır; sadece İŞKUR'a bildirim yeterlidir.
    D: Sayılmaz; toplu işçi çıkarma en az 50 işçi için geçerlidir.
    E: Sayılır; bildirim sonrası fesih bildirimleri hemen hüküm doğurur.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 29''a göre 101-300 işçi arasında en az yüzde on oranında (250''nin %10''u=25) işçi çıkarılması toplu
      işçi çıkarmadır; 30 > 25 olduğu için sayılır. En az 30 gün önceden yazılı bildirim işyeri sendika temsilcilerine, ilgili
      bölge müdürlüğüne ve Türkiye İş Kurumuna yapılmalıdır. Fesih bildirimleri, bildirimin bölge müdürlüğüne yapılmasından
      30 gün sonra hüküm doğurur.

      '
    celdiriciler:
      B: Yüzde on 25'tir; 30 işçi bu eşiği aştığı için sayılır.
      C: Üç mercie bildirim zorunludur.
      D: Eşikler 20-100 için 10, 101-300 için %10, 301+ için 30'dur.
      E: Fesih bildirimleri bildirimin bölge müdürlüğüne yapılmasından 30 gün sonra hüküm doğurur.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 29
    alinti: 'İşveren; ekonomik, teknolojik, yapısal ve benzeri işletme, işyeri veya işin gerekleri sonucu toplu işçi çıkarmak
      istediğinde, bunu en az otuz gün önceden bir yazı ile, işyeri sendika temsilcilerine, ilgili bölge müdürlüğüne ve Türkiye
      İş Kurumuna bildirir. İşyerinde çalışan işçi sayısı: a) 20 ile 100 işçi arasında ise, en az 10 işçinin, b) 101 ile 300
      işçi arasında ise, en az yüzde on oranında işçinin, c) 301 ve daha fazla ise, en az 30 işçinin, İşine 17 nci madde uyarınca
      ve bir aylık süre içinde aynı tarihte veya farklı tarihlerde son verilmesi toplu işçi çıkarma sayılır. ... Fesih bildirimleri,
      işverenin toplu işçi çıkarma isteğini bölge müdürlüğüne bildirmesinden otuz gün sonra hüküm doğurur.'
