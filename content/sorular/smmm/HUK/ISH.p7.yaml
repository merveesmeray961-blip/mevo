      B: 400 saat iki aylık dönemde ortalamayı aşar.
      D: Denkleştirme süresi iki aydır; toplu iş sözleşmesiyle dört aya kadar uzatılabilir.
      E: Günde 11 saat sınırı aşılmadığı varsayılmıştır; sorun ortalama aşımdadır.
