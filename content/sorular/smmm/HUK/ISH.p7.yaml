    B: Fazla çalışma oluşmamıştır; çünkü iki aylık ortalama haftalık süre 45 saati aşmamıştır (400 / 8 ≈ 50 hafta değil, 2
      ay ≈ 8-9 hafta; ortalama kontrol edilmelidir).
    C: Fazla çalışma oluşmuştur; çünkü toplam 400 saat, 2 ay × 45 saat = 360 saati aşmıştır.
    D: Denkleştirme süresi en çok bir aydır; uygulama geçersizdir.
    E: Günde 11 saat sınırı aşıldığı için fazla çalışma sayılır.
  dogru: C
  aciklama:
    dogru_neden: 'İş K. md. 63’e göre tarafların anlaşması ile haftalık normal çalışma süresi, günde onbir saati aşmamak koşulu
      ile farklı şekilde dağıtılabilir. Bu halde iki aylık süre içinde işçinin haftalık ortalama çalışma süresi, normal haftalık
      çalışma süresini aşamaz. 2 ay ≈ 8-9 hafta; 45 × 8 = 360, 45 × 9 = 405. 400 saat, 8 haftalık dönemde ortalama 50 saati
      aşar; dolayısıyla fazla çalışma oluşur. Md. 41’e göre denkleştirme uygulanan hallerde ortalama aşılmadıkça fazla çalışma
      sayılmaz; ortalama aşıldığı için sayılır.

      Püf noktaları: Denkleştirmede kritik olan ortalama süredir; toplam sürenin normal toplamı aşıp aşmadığına bakılır.

      '
    celdiriciler:
