- id: SMMM-HUK-ISH-0010
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: fesih ve bildirim
  tip: uygulama
  zorluk: 3
  kok: '(A) Ltd. Şti.''nde 45 işçi çalışmaktadır. İşçi (B), aynı işverenin farklı işyerlerinde toplam 2 yıl 4 ay kıdemi bulunarak
    çalışmaktadır. İşveren, (B)''nin davranışlarından kaynaklanan geçerli bir sebeple belirsiz süreli iş sözleşmesini feshetmek
    istemektedir. Fesih bildirimi yazılı olarak yapılmış ve sebep açıkça belirtilmiştir; ancak (B)''nin savunması alınmamıştır.
    İşveren bildirim süresine ait ücreti peşin ödememiştir.

    4857 sayılı İş Kanunu''na göre bu fesih hakkında aşağıdaki ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: Fesih geçerli sebebe dayandığı için savunma alınmamış olması feshi geçersiz kılmaz.
    B: Bildirim süresi altı haftadır; savunma alınmaması nedeniyle fesih geçersizdir ve (B) işe iade talep edebilir.
    C: Bildirim süresi dört haftadır; savunma alınmaması feshi geçersiz kılmaz çünkü geçerli sebep vardır.
    D: İşyerinde 30'dan fazla işçi olduğu ve kıdem 6 aydan fazla olduğu için fesih usulsüzdür; bildirim süresi sekiz haftadır.
    E: Savunma alınmadığı için fesih geçersizdir; bildirim süresi iki haftadır.
  dogru: B
  aciklama:
    dogru_neden: 'İşyerinde 45 işçi olduğu için md. 18 uygulanır (30 veya daha fazla). (B)''nin kıdemi 2 yıl 4 ay olduğundan
      md. 17/1-(c) uyarınca bildirim süresi altı haftadır. Md. 19/2 uyarınca, işçinin davranışı veya verimi ile ilgili nedenlerle
      fesihte savunma alınmadan fesih yapılamaz (25/II saklıdır; burada geçerli sebep davranış kaynaklıdır). Dolayısıyla fesih
      usulsüz ve geçersizdir; (B) md. 20 uyarınca işe iade talebiyle arabulucuya başvurabilir. Peşin ücret ödenmemesi de md.
      17''ye aykırıdır ancak asıl geçersizlik savunma eksikliğindendir.

      Püf noktaları: Geçerli sebep + usul (yazılı + sebep + savunma) birlikte aranır. Kıdem hesabında aynı işverenin işyerleri
      birleştirilir (md. 18).

      '
    celdiriciler:
      A: Savunma alınmaması md. 19/2'ye aykırıdır; geçerli sebep tek başına yeterli değildir.
      C: Kıdem 1,5-3 yıl arası olduğu için süre 6 haftadır (md. 17); savunma zorunludur.
      D: Bildirim süresi 6 haftadır (3 yıldan az); usulsüzlük savunma eksikliğindendir.
      E: Süre 6 haftadır; iki hafta 6 aydan az kıdem içindir.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 17/1
    alinti: İş sözleşmeleri; a) İşi altı aydan az sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak
      iki hafta sonra, b) İşi altı aydan birbuçuk yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından
      başlayarak dört hafta sonra, c) İşi birbuçuk yıldan üç yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından
      başlayarak altı hafta sonra, d) İşi üç yıldan fazla sürmüş işçi için, bildirim yapılmasından başlayarak sekiz hafta
      sonra, feshedilmiş sayılır.
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 18/1
    alinti: Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini
      fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden
      kaynaklanan geçerli bir sebebe dayanmak zorundadır.
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 19/2
    alinti: Hakkındaki iddialara karşı savunmasını almadan bir işçinin belirsiz süreli iş sözleşmesi, o işçinin davranışı
      veya verimi ile ilgili nedenlerle feshedilemez. Ancak, işverenin 25 inci maddenin (II) numaralı bendi şartlarına uygun
      fesih hakkı saklıdır.
