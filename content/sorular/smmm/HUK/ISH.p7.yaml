- id: SMMM-HUK-ISH-0014
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: çalışma süreleri
  tip: uygulama
  zorluk: 3
  kok: '(İ) işyerinde normal haftalık çalışma süresi 45 saattir. Taraflar anlaşarak haftalık çalışma süresini günde 11 saati
    aşmamak koşuluyla farklı günlere dağıtmışlardır. İki aylık denkleştirme süresi uygulanmaktadır. Bir işçinin iki aylık
    dönemde toplam çalışması 400 saat olmuştur.


