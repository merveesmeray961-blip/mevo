- id: SMMM-HUK-ISH-0012
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: iş sözleşmesi türleri ve deneme süresi
  tip: uygulama
  zorluk: 3
  kok: '(İ) ile (İşveren) arasında 01.02.2026 tarihinde belirsiz süreli iş sözleşmesi imzalanmış ve sözleşmeye iki aylık deneme
    süresi konulmuştur. Deneme süresi içinde (İşveren), 20.03.2026 tarihinde (İ)’nin iş sözleşmesini bildirim süresine uymaksızın
    ve tazminat ödemeksizin feshetmiştir. (İ), fesihte bildirimsiz ve tazminatsız feshin hukuka aykırı olduğunu ileri sürerek
    kıdem ve ihbar tazminatı talep etmektedir. İşyerinde toplu iş sözleşmesi yoktur.


    4857 sayılı İş Kanunu’na göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Deneme süresi en çok bir ay olabileceğinden fesih geçersizdir.
    B: Deneme süresi içinde bildirim süresine gerek olmaksızın ve tazminatsız fesih mümkündür; (İ)’nin talebi yerinde değildir.
    C: Deneme süresi toplu iş sözleşmesiyle uzatılmadığı için iki ayı aşamaz; fesih geçersizdir.
    D: Deneme süresi içinde yalnızca işçi bildirim süresine gerek olmaksızın feshedebilir; işveren ihbar tazminatı ödemelidir.
    E: Deneme süresi içinde fesih mümkün olsa da işçinin çalıştığı günler için ücret ödenmez.
  dogru: B
  aciklama:
    dogru_neden: 'İş K. md. 15’e göre deneme süresi en çok iki ay olabilir (toplu iş sözleşmesiyle dört aya kadar uzatılabilir).
      Deneme süresi içinde taraflar iş sözleşmesini bildirim süresine gerek olmaksızın ve tazminatsız feshedebilir; işçinin
      çalıştığı günler için ücret ve diğer hakları saklıdır. Toplu iş sözleşmesi olmadığı için iki aylık süre geçerlidir ve
      20.03.2026 tarihi deneme süresi içindedir.

      Püf noktaları: Deneme süresi her iki taraf için de bildirim ve tazminatsız fesih imkânı tanır; sadece işçi lehine değildir.

      '
    celdiriciler:
      A: Kanun deneme süresini en çok iki ay olarak belirlemiştir; bir ay sınırı yoktur.
      C: İki aylık süre yasal üst sınırdır; toplu iş sözleşmesi olmadan da iki ay kararlaştırılabilir. Uzatma dört aya kadardır.
      D: Madde açıkça “taraflar” demektedir; hem işçi hem işveren deneme süresi içinde bildirim ve tazminatsız feshedebilir.
      E: İşçinin çalıştığı günler için ücret ve diğer hakları saklıdır.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 15
    alinti: Taraflarca iş sözleşmesine bir deneme kaydı konulduğunda, bunun süresi en çok iki ay olabilir. Ancak deneme süresi
      toplu iş sözleşmeleriyle dört aya kadar uzatılabilir. Deneme süresi içinde taraflar iş sözleşmesini bildirim süresine
      gerek olmaksızın ve tazminatsız feshedebilir. İşçinin çalıştığı günler için ücret ve diğer hakları saklıdır.
