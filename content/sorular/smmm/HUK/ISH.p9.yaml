      yerine maddede sayılan kalemlerin kapsamı okunmalı; yıllık izin ücreti ile tazminat listesi de birbirinden ayrılmalıdır.'
    celdiriciler:
      A: Ek Madde 3'te yıllık izin ücreti açıkça sayılmıştır.
      B: Kıdem tazminatı (a) bendindedir.
      C: Bildirim şartına uyulmaksızın fesih tazminatı (b) bendindedir.
      D: Kötüniyet tazminatı (c) bendindedir.
