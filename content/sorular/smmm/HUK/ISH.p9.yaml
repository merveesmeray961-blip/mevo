      \ yapılabilir. Fazla çalışma, Kanunda yazılı koşullar çerçevesinde,\nhaftalık kırkbeş saati aşan çalışmalardır. 63 üncü\
      \ madde hükmüne göre denkleştirme esasının\nuygulandığı hallerde, işçinin haftalık ortalama çalışma süresi, normal haftalık\
