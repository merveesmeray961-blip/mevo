- id: SMMM-HUK-ISH-0049
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: toplu işçi çıkarma
  tip: kavrama
  zorluk: 1
  kok: 4857 sayılı İş Kanununda toplu işçi çıkarma ile bireysel fesih arasındaki ayrım bakımından aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Toplu işçi çıkarma yalnızca işverenin ekonomik gerekçeyle tek bir işçiyi işten çıkarmasıdır.
    B: Toplu işçi çıkarma, Kanundaki eşiklerin bir aylık süre içinde gerçekleşmesi hâlinde, işverenin en az otuz gün önceden
      ilgili yerlere bildirimde bulunmasını gerektiren özel bir fesih rejimidir.
    C: Toplu işçi çıkarma için işçi sayısı eşikleri aranmaz; yalnızca otuz günlük bildirim yeterlidir.
    D: Toplu işçi çıkarma bildirimi yalnızca işyerindeki sendika temsilcilerine yapılır.
    E: Toplu işçi çıkarma hâlinde fesih bildirimleri, işverenin bildiriminin yapıldığı gün hüküm doğurur.
  dogru: B
  aciklama:
    dogru_neden: Md. 29, belirli işçi sayısı eşiklerinin bir aylık süre içinde gerçekleşmesini ve en az otuz gün önceden işyeri
      sendika temsilcilerine, ilgili bölge müdürlüğüne ve Türkiye İş Kurumuna bildirim yapılmasını öngörür.
