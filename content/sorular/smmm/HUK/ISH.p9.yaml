- id: SMMM-HUK-ISH-0045
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: telafi ve fazla çalışma
  tip: uygulama
  zorluk: 2
  kok: Bir işyerinde zorunlu nedenle iki saat çalışılmamış, işveren bu iki saati sonraki hafta bir iş gününde telafi etmek
    istemiştir. Telafi yapılacak gün ulusal bayram değildir ve işçinin o günkü normal günlük çalışma süresi içinde kalınacaktır.
    Aynı hafta işçiye ayrıca iki saat fazla çalışma yaptırılması planlanmaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Telafi çalışması fazla çalışma sayılır ve ayrıca yüzde elli zamlı ücret doğurur.
    B: Telafi çalışması yapılabilir; telafi çalışması fazla çalışma sayılmaz, ayrıca fazla çalışmanın yapılabilmesi için işçinin
      onayının alınması gerekir.
    C: Telafi çalışması yalnız işçinin yazılı talebiyle yapılabilir; işveren tek başına karar veremez.
    D: Telafi çalışması günde üç saati aşmasa bile günlük en çok çalışma süresini aşabilir.
    E: Telafi çalışması ile fazla çalışma aynı hukuki nitelikte olduğundan yıllık 270 saatlik sınır telafi çalışmasına da
      uygulanır.
  dogru: B
  aciklama:
    dogru_neden: Md. 64'e göre zorunlu nedenle çalışılmayan süre telafi edilebilir ve bu çalışma fazla çalışma veya fazla
      sürelerle çalışma sayılmaz. Md. 41'e göre fazla saatlerle çalışma için işçinin onayı gerekir.
    celdiriciler:
      A: Telafi çalışmasının fazla çalışma sayılmadığını gözden kaçırır.
      C: Md. 64, sayılan hâllerde işverene telafi çalışması yaptırma imkânı verir.
      D: Telafi çalışması günlük en çok çalışma süresini aşamaz.
      E: 270 saatlik sınır md. 41'de fazla çalışma için düzenlenmiştir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 64
    alinti: "        Telafi çalışması\n        Madde 64 - Zorunlu nedenlerle işin durması, ulusal bayram ve genel tatillerden\
      \ önce\nveya sonra işyerinin tatil edilmesi veya benzer nedenlerle işyerinde normal çalışma sürelerinin\nönemli ölçüde\
      \ altında çalışılması veya tamamen tatil edilmesi ya da işçinin talebi ile kendisine\nizin verilmesi hallerinde, işveren\
      \ dört ay içinde çalışılmayan süreler için telafi çalışması\nyaptırabilir. (Ek cümle:25/3/2020-7226/43 md.) Cumhurbaşkanı\
      \ bu süreyi iki katına kadar\nartırmaya yetkilidir. Bu çalışmalar fazla çalışma veya fazla sürelerle çalışma sayılmaz.19"
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 41
    alinti: "       Fazla çalışma veya fazla sürelerle çalışma yapan işçi isterse, bu çalışmalar karşılığı\nzamlı ücret yerine,\
      \ fazla çalıştığı her saat karşılığında bir saat otuz dakikayı, fazla sürelerle\nçalıştığı her saat karşılığında bir\
      \ saat onbeş dakikayı serbest zaman olarak kullanabilir.\n       İşçi hak ettiği serbest zamanı altı ay zarfında, çalışma\
      \ süreleri içinde ve ücretinde bir\nkesinti olmadan kullanır."
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 41
    alinti: "       63 üncü maddenin son fıkrasında yazılı sağlık nedenlerine dayanan kısa veya sınırlı\nsüreli işlerde ve\
      \ 69 uncu maddede belirtilen gece çalışmasında fazla çalışma yapılamaz.\n       Fazla saatlerle çalışmak için işçinin\
      \ onayının alınması gerekir.\n       Fazla çalışma süresinin toplamı bir yılda ikiyüzyetmiş saatten fazla olamaz."
  gecerlilik:
    baslangic: '2020-03-26'
