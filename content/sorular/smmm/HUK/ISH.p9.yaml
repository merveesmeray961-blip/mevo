      aşmamak koşuluyla bazı haftalarda 45 saati aşan çalışmanın fazla çalışma sayılmayacağını belirtir. Püf noktaları: Tek
      haftadaki 45 saat aşımı ile denkleştirme dönemi ortalamasını birlikte değerlendirmek gerekir.'
