    B: Kıdem tazminatı bakımından Ek Madde 3'te beş yıllık zamanaşımı süresi öngörülmüştür.
    C: Bildirim şartına uyulmaksızın fesihten kaynaklanan tazminat Ek Madde 3'te beş yıllık süre kapsamındadır.
