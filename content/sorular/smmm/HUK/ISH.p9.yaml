- id: SMMM-HUK-ISH-0047
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857; 7036)
  konu: ISH
  kazanim: izinler
  tip: kavrama
  zorluk: 2
  kok: 4857 sayılı İş Kanununa göre yıllık ücretli izin uygulaması bakımından aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: İşveren, yıllık izin ücretini işçinin izne başlamasından önce peşin olarak ödemek veya avans olarak vermek zorundadır.
    B: Yıllık izin süresine rastlayan hafta tatili, ulusal bayram ve genel tatil günleri izin süresinden sayılmaz.
    C: İşveren, işyerinin kurulu bulunduğu yerden başka yerde izin geçirecek işçiye, koşulları varsa gidiş ve dönüş yolunda
      geçecek süre için toplam dört güne kadar ücretsiz izin vermek zorundadır.
    D: İşverenin feshi hâlinde yeni iş arama izinleri yıllık ücretli izin süreleriyle iç içe girebilir.
    E: Yıllık izin kullanan işçiye izin dönemine ilişkin ücretin peşin veya avans olarak verilmesi gerekir.
  dogru: D
  aciklama:
    dogru_neden: D yanlıştır. İş Kanunu md. 59, fesih bildirim süresi ile yeni iş arama izinlerinin yıllık ücretli izin süreleriyle
      iç içe giremeyeceğini belirtir. Diğer seçenekler md. 56-57'deki uygulama kurallarıdır.
    celdiriciler:
      A: Md. 57'nin peşin/avans ödeme kuralıdır.
      B: Md. 56'nın izin hesabına ilişkin kuralıdır.
      C: Md. 56'nın yol için toplam dört güne kadar ücretsiz izin düzenlemesidir.
      E: A seçeneğiyle aynı md. 57 kuralını ifade eder.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 56-57
    alinti: "         Madde 56 - Yıllık ücretli izin işveren tarafından bölünemez.\n         Bu iznin 53 üncü maddede gösterilen\
      \ süreler içinde işveren tarafından sürekli bir\nşekilde verilmesi zorunludur.\n         (Değişik üçüncü fıkra: 14/4/2016-6704/16\
      \ md.) Ancak, 53 üncü maddede öngörülen\nizin süreleri, tarafların anlaşması ile bir bölümü on günden aşağı olmamak\
      \ üzere bölümler\nhâlinde kullanılabilir.\n         İşveren tarafından yıl içinde verilmiş bulunan diğer ücretli ve\
      \ ücretsiz izinler veya"
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 59
    alinti: "        Sözleşmenin sona ermesinde izin ücreti\n        Madde 59 - İş sözleşmesinin, herhangi bir nedenle sona\
      \ ermesi halinde işçinin hak\nkazanıp da kullanmadığı yıllık izin sürelerine ait ücreti, sözleşmenin sona erdiği tarihteki\n\
      ücreti üzerinden kendisine veya hak sahiplerine ödenir. Bu ücrete ilişkin zamanaşımı iş\nsözleşmesinin sona erdiği tarihten\
      \ itibaren başlar.\n        İşveren tarafından iş sözleşmesinin feshedilmesi halinde 17 nci maddede belirtilen\nbildirim\
      \ süresiyle, 27 nci madde gereğince işçiye verilmesi zorunlu yeni iş arama izinleri\nyıllık ücretli izin süreleri ile\
      \ iç içe giremez."
