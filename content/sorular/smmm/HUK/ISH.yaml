- id: SMMM-HUK-ISH-0001
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857, 7036)
  konu: ISH
  kazanim: toplu işçi çıkarma
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: 4857 sayılı İş Kanunu'na göre, 260 işçinin çalıştığı bir işyerinde işveren, ekonomik nedenlerle işçi sayısını
    azaltmayı planlamaktadır. Bu işyerinde bir aylık süre içinde aynı tarihte veya farklı tarihlerde, 17. madde
    uyarınca en az kaç işçinin işine son verilmesi toplu işçi çıkarma sayılır?
  secenekler:
    A: '10'
    B: '20'
    C: '26'
    D: '30'
    E: '52'
  dogru: C
  aciklama:
    dogru_neden: 4857 sayılı Kanun md. 29/2 uyarınca işyerinde çalışan işçi sayısı 101 ile 300 arasında ise en az
      yüzde on oranında işçinin işine 17. madde uyarınca ve bir aylık süre içinde aynı tarihte veya farklı tarihlerde
      son verilmesi toplu işçi çıkarma sayılır. 260 işçinin yüzde onu 26'dır.
    celdiriciler:
      A: En az 10 işçi ölçütü, işçi sayısı 20 ile 100 arasında olan işyerleri için geçerlidir; 260 işçili işyeri
        bu aralıkta değildir.
      B: 20, md. 29'daki ilk dilimin alt sınırını oluşturan işyeri işçi sayısıdır; çıkarılması gereken asgari işçi
        sayısı değildir.
      D: En az 30 işçi ölçütü, 301 ve daha fazla işçi çalışan işyerleri için geçerlidir.
      E: 52, işçi sayısına yüzde yirmi oranı uygulanarak bulunur; kanundaki oran yüzde ondur.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 29/2
    alinti: 'İşyerinde çalışan işçi sayısı: a) 20 ile 100 işçi arasında ise, en az 10 işçinin, b) 101 ile 300 işçi
      arasında ise, en az yüzde on oranında işçinin, c) 301 ve daha fazla ise, en az 30 işçinin, İşine 17 nci madde
      uyarınca ve bir aylık süre içinde aynı tarihte veya farklı tarihlerde son verilmesi toplu işçi çıkarma sayılır.'
  gecerlilik:
    baslangic: '2003-06-10'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-HUK-ISH-0002
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İş hukuku (4857, 7036)
  konu: ISH
  kazanim: telafi ve fazla çalışma
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: 4857 sayılı İş Kanunu'nun telafi çalışmasına ilişkin hükümleri dikkate alındığında aşağıdaki ifadelerden
    hangisi **yanlıştır**?
  secenekler:
    A: Zorunlu nedenlerle işin durması hâlinde işveren, çalışılmayan süreler için dört ay içinde telafi çalışması
      yaptırabilir.
    B: Cumhurbaşkanı, telafi çalışması yaptırılabilecek dört aylık süreyi iki katına kadar artırmaya yetkilidir.
    C: Telafi çalışmaları, fazla çalışma veya fazla sürelerle çalışma sayılmaz.
    D: Telafi çalışması, günlük en çok çalışma süresini aşmamak koşuluyla günde üç saatten fazla olamaz.
    E: İşçinin yazılı onayı alınmak koşuluyla telafi çalışması tatil günlerinde de yaptırılabilir.
  dogru: E
  aciklama:
    dogru_neden: 4857 sayılı Kanun md. 64/2'nin son cümlesine göre tatil günlerinde telafi çalışması yaptırılamaz.
      Kanun bu yasağa işçinin onayı da dâhil herhangi bir istisna öngörmemiştir; bu nedenle ifade yanlıştır.
    celdiriciler:
      A: md. 64/1 uyarınca zorunlu nedenlerle işin durması hâlinde işveren dört ay içinde çalışılmayan süreler için
        telafi çalışması yaptırabilir; ifade doğrudur.
      B: md. 64/1'e 7226 sayılı Kanunla eklenen cümle uyarınca Cumhurbaşkanı bu süreyi iki katına kadar artırmaya
        yetkilidir; ifade doğrudur.
      C: md. 64/1'in son cümlesine göre telafi çalışmaları fazla çalışma veya fazla sürelerle çalışma sayılmaz;
        ifade doğrudur.
      D: md. 64/2 uyarınca telafi çalışmaları günlük en çok çalışma süresini aşmamak koşuluyla günde üç saatten
        fazla olamaz; ifade doğrudur.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 64/1
    alinti: işveren dört ay içinde çalışılmayan süreler için telafi çalışması yaptırabilir. (Ek cümle:25/3/2020-7226/43
      md.) Cumhurbaşkanı bu süreyi iki katına kadar artırmaya yetkilidir. Bu çalışmalar fazla çalışma veya fazla
      sürelerle çalışma sayılmaz.
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 64/2
    alinti: Telafi çalışmaları, günlük en çok çalışma süresini aşmamak koşulu ile günde üç saatten fazla olamaz.
      Tatil günlerinde telafi çalışması yaptırılamaz.
