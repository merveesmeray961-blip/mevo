- id: SMMM-HUK-IYU-0003
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İdari yargılama (2577)
  konu: IYU
  kazanim: 'dava açma süreleri — üst makama başvuru: sürenin durması, reddedilmiş sayılma ve kalan süre (İYUK md.
    7, 11)'
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: 'İdare mahkemesinde iptal davasına konu olabilecek bir idari işlem, ilgiliye 2 Mart 2026 tarihinde yazılı
    olarak bildirilmiştir; özel kanunda ayrı bir dava açma süresi öngörülmemiştir. İlgili, işlemin geri alınması
    istemiyle işlemi yapan makamın üst makamına başvurmuştur; başvuru yapıldığı sırada dava açma süresinin 20 günü
    geçmiştir. Üst makam başvuruya otuz gün içinde cevap vermemiş ve sonradan da cevap vermemiştir.


    2577 sayılı İdari Yargılama Usulü Kanunu''na göre ilgilinin, başvurunun reddedilmiş sayılmasından sonra idare
    mahkemesinde dava açabileceği kalan dava açma süresi kaç gündür?'
  secenekler:
    A: '20'
    B: '30'
    C: '40'
    D: '60'
    E: '90'
  dogru: C
  aciklama:
    dogru_neden: Özel kanunda ayrı süre gösterilmeyen hâllerde idare mahkemelerinde dava açma süresi 60 gündür (md.
      7/1). Dava açılmadan önce işlemin geri alınması üst makamdan, dava açma süresi içinde istenebilir ve bu başvuru
      işlemeye başlamış olan süreyi durdurur (md. 11/1). Otuz gün içinde cevap verilmezse istek reddedilmiş sayılır;
      bu durumda dava açma süresi yeniden işlemeye başlar ve başvuru tarihine kadar geçmiş süre de hesaba katılır
      (md. 11/2-3). Dolayısıyla kalan süre 60 − 20 = 40 gündür.
    celdiriciler:
      A: '20: Başvuruya kadar geçen süre kalan süre sanılmıştır. Md. 11/3''e göre başvuruya kadar geçen süre hesaba
        katılır, yani 60 günden düşülür.'
      B: '30: Üst makamın cevap verme süresi (otuz gün) ya da vergi mahkemelerindeki dava açma süresi kalan süre
        sanılmıştır. İdare mahkemesinde dava açma süresi 60 gündür.'
      D: '60: Süre yeniden işlemeye başladığında geçmiş sürenin hesaba katılmadığı varsayılmıştır. Md. 11/3 başvuru
        tarihine kadar geçmiş sürenin de hesaba katılacağını açıkça belirtir.'
      E: '90: Dava açma süresine üst makamın otuz günlük cevap süresi eklenmiştir (60 + 30). Üst makama başvurma
        süreyi durdurur; durma süresi dava açma süresine eklenmez, kalan süre geçmiş süre düşülerek bulunur.'
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 7/1
    alinti: Dava açma süresi, özel kanunlarında ayrı süre gösterilmeyen hallerde Danıştayda ve idare mahkemelerinde
      altmış ve vergi mahkemelerinde otuz gündür.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 11/1
    alinti: İlgililer tarafından idari dava açılmadan önce, idari işlemin kaldırılması, geri alınması, değiştirilmesi
      veya yeni bir işlem yapılması üst makamdan, üst makam yoksa işlemi yapmış olan makamdan, idari dava açma süresi
      içinde istenebilir. Bu başvurma, işlemeye başlamış olan idari dava açma süresini durdurur.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 11/2
    alinti: Otuz gün içinde bir cevap verilmezse istek reddedilmiş sayılır.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 11/3
    alinti: İsteğin reddedilmesi veya reddedilmiş sayılması halinde dava açma süresi yeniden işlemeye başlar ve
      başvurma tarihine kadar geçmiş süre de hesaba katılır.
