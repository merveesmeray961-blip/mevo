    seçenektedir?
  secenekler:
    A: İtiraz—vergi mahkemesi / istinaf—BİM
    B: İstinaf—Danıştay / temyiz—idare mahkemesi
    C: Temyiz—Danıştay / itiraz—BİM
    D: İstinaf—BİM / temyiz—Danıştay
    E: Temyiz—BİM / istinaf—Danıştay
  dogru: D
  aciklama:
    dogru_neden: İYUK md. 45/1'e göre idare ve vergi mahkemelerinin kararlarına karşı (aynı fıkranın ikinci cümlesindeki
      parasal sınırın altında kalan kesin kararlar hariç) mahkemenin bulunduğu yargı çevresindeki bölge idare mahkemesine
      istinaf yoluna başvurulur; md. 46/1'e göre Danıştay dava dairelerinin nihai kararları Danıştayda temyiz edilebilir.
      Bu düzen 6545 sayılı Kanunla getirilmiş ve bölge idare mahkemelerinin tüm yurtta göreve başladığı 20.07.2016'dan
      sonra verilen kararlara uygulanmaktadır (İYUK geçici md. 8/1).
    celdiriciler:
      A: İdare mahkemesi kararlarına karşı kanun yolu vergi mahkemesine itiraz değil, BİM'de istinaftır (md. 45/1);
        Danıştay dava dairesinin nihai kararına karşı ise istinaf değil Danıştayda temyiz yoluna gidilir (md. 46/1).
      B: İstinaf mercii Danıştay değil bölge idare mahkemesidir (md. 45/1); idare mahkemesi temyiz mercii değildir,
        temyiz Danıştayda incelenir (md. 46/1).
      C: İdare mahkemesi kararına karşı ilk kanun yolu temyiz değil BİM'de istinaftır; Danıştay dava dairesinin
        nihai kararına karşı yol BİM'e itiraz değil Danıştayda temyizdir.
      E: 'Mercileri ters eşleştirir: istinaf mercii BİM, temyiz mercii Danıştaydır; idare mahkemesi kararına karşı
        ilk yol istinaf, Danıştay dava dairesinin nihai kararına karşı yol temyizdir.'
