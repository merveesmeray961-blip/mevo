- id: SMMM-HUK-IYU-0009
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İdari yargılama (2577)
  konu: IYU
  kazanim: dava açma süreleri
  tip: uygulama
  zorluk: 3
  kok: '(M), 10.1.2025 tarihinde kendisine tebliğ edilen bir idari işleme karşı, 15.1.2025''te işlemi yapan makama
    2577 sayılı İYUK md. 11 uyarınca itiraz başvurusunda bulunmuştur. İdare 20.2.2025''te başvuruyu reddetmiştir
    ve red kararı 25.2.2025''te (M)''ye tebliğ edilmiştir. (M) 24.4.2025''te idare mahkemesinde iptal davası açmıştır.
    Özel kanununda ayrı süre gösterilmemiştir.

    Bu durumda dava açma süresi hakkında hangisi doğrudur?'
  secenekler:
    A: Süre 60 gündür; başvuru süreyi durdurur, geçen 5 gün hesaba katılır ve kalan 55 gün 21.4.2025'te dolduğundan
      dava süresinde açılmamıştır.
    B: Süre 60 gündür; başvuru süreyi keser, red tebliğinden itibaren yeni 60 gün işler ve dava süresinde açılmıştır.
    C: Süre 30 gündür; kalan 25 gün 22.3.2025'te dolduğundan dava süresinde açılmamıştır.
    D: Süre 60 gündür; başvuru süreye etki etmez, süre 10.1.2025 tebliğinden itibaren işler, 11.3.2025'te dolmuş
      ve dava süresinde açılmamıştır.
    E: Süre 60 gündür; başvuru süreyi durdurur, kalan süre iki ay olarak hesaplanıp 25.4.2025'e kadar dava açılabilir
      ve dava süresinde açılmıştır.
  dogru: A
  aciklama:
    dogru_neden: İYUK md. 7/1 uyarınca idare mahkemelerinde dava açma süresi (özel kanun yoksa) 60 gündür. Md. 11/1
      uyarınca idareye başvurma, işlemeye başlamış olan dava açma süresini durdurur; md. 11/3 uyarınca isteğin reddi
      hâlinde süre yeniden işlemeye başlar ve başvurma tarihine kadar geçmiş süre de hesaba katılır. Tebliğ 10.1.2025,
      süre 11.1'de başlar; başvuru 15.1'de olduğundan 5 gün geçmiştir. Red tebliği 25.2.2025'tir; kalan 55 gün 26.2'de
      başlayıp 21.4.2025'te sona erer. 24.4.2025'te açılan dava süresinde değildir.
    celdiriciler:
      B: Md. 11/3'e göre süre yeniden başlamaz; durmuş olan süre kaldığı yerden işler ve başvuruya kadar geçen 5
        gün hesaba katılır.
      C: İdare mahkemelerinde süre otuz değil altmış gündür (md. 7/1); otuz gün vergi mahkemeleri için geçerlidir.
      D: Md. 11/1 başvurunun işlemeye başlamış dava açma süresini durdurduğunu düzenler; başvurunun süreye etki
        etmediği yönündeki hesap bu hükme aykırıdır.
      E: Süre günle hesaplanır; kalan 55 günlük süre 21.4.2025'te sona erer, iki ay olarak hesaplanıp 25.4.2025'e
        uzatılamaz.
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 7/1
    alinti: Dava açma süresi, özel kanunlarında ayrı süre gösterilmeyen hallerde Danıştayda ve idare mahkemelerinde
      altmış ve vergi mahkemelerinde otuz gündür.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 11
    alinti: İlgililer tarafından idari dava açılmadan önce, idari işlemin kaldırılması, geri alınması, değiştirilmesi
      veya yeni bir işlem yapılması üst makamdan, üst makam yoksa işlemi yapmış olan makamdan, idari dava açma süresi
      içinde istenebilir. Bu başvurma, işlemeye başlamış olan idari dava açma süresini durdurur. ... İsteğin reddedilmesi
      veya reddedilmiş sayılması halinde dava açma süresi yeniden işlemeye başlar ve başvurma tarihine kadar geçmiş
      süre de hesaba katılır.
