    B: 22.03.2026
    C: 25.03.2026
    D: 26.03.2026
    E: 05.03.2026
  dogru: A
  aciklama:
    dogru_neden: "İYUK md. 7/1’e göre idare mahkemelerinde dava açma süresi 60 gündür; süre tebliğ tarihini izleyen günden\
      \ başlar (md. 8/1). Üst makama başvurma (md. 11) işlemeye başlamış olan süreyi durdurur; red üzerine süre yeniden işlemeye\
