      B: Hesapta bir gün fazla sayılmıştır.
      C: 60 günün tamamı red sonrası sayılmıştır; geçmiş süre düşülmez.
      D: Tebliğ günü veya başvuru günü yanlış sayılmıştır.
      E: Yanlış başlangıç veya 30 günlük süre zannedilmiştir.
