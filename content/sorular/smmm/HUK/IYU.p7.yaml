  dogru: A
  aciklama:
    dogru_neden: "İYUK md. 7/1’e göre idare mahkemelerinde dava açma süresi 60 gündür; süre tebliğ tarihini izleyen\
      \ günden başlar (md. 8/1). Üst makama başvurma (md. 11) işlemeye başlamış olan süreyi durdurur; red üzerine\
      \ süre yeniden işlemeye başlar ve başvurma tarihine kadar geçmiş süre hesaba katılır. \nTebliğ 05.01 → süre\
      \ 06.01’de başlar. 10.02 başvuru tarihine kadar geçen süre: 06.01-31.01 = 26 gün + 01.02-09.02 = 9 gün = 35\
