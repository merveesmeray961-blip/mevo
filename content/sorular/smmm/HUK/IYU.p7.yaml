      \ = 3 gün, Mart 1-22 = 22 gün, toplam 25; son gün 22.03 olur. Düzeltme: 26.02 + 24 gün = 21.03 (25. gün 21.03).\
      \ Doğru son gün 21.03.2026’dır.\nPüf noktaları: Geçen süre düşülür; red tebliğinden izleyen günden kalan süre\
      \ işlemeye başlar.\n"
