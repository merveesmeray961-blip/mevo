- id: SMMM-HUK-IYU-0009
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İdari yargılama (2577)
  konu: IYU
  kazanim: dava açma süreleri
  tip: uygulama
  zorluk: 3
  kok: '(M), 10.1.2025 tarihinde kendisine tebliğ edilen bir idari işleme karşı, 15.1.2025''te işlemi yapan makama 2577 sayılı
    İYUK md. 11 uyarınca itiraz başvurusunda bulunmuştur. İdare 20.2.2025''te başvuruyu reddetmiştir ve red kararı 25.2.2025''te
    (M)''ye tebliğ edilmiştir. (M) 10.3.2025''te idare mahkemesinde iptal davası açmıştır. Özel kanununda ayrı süre gösterilmemiştir.

    Bu durumda dava açma süresi hakkında hangisi doğrudur?

    '
  secenekler:
    A: Dava süresi 60 gündür; itiraz süreyi durdurduğu için dava süresinde açılmıştır.
    B: Dava süresi 30 gündür; itiraz sonrası kalan süre dikkate alındığında dava süresinde açılmıştır.
    C: Dava süresi 60 gündür; itiraz sonrası süre yeniden başladığı için dava süresinde açılmıştır.
    D: Dava süresi 60 gündür; red tebliğinden itibaren 60 gün içinde açılmalıdır ve açılmıştır.
    E: İtiraz başvurusu dava açma süresini keser; red tebliğinden itibaren yeni 60 günlük süre işlemeye başlar.
  dogru: A
  aciklama:
    dogru_neden: 'İYUK md. 7/1 uyarınca idare mahkemelerinde dava açma süresi (özel kanun yoksa) 60 gündür. Md. 11 uyarınca
      idareye başvurma, işlemeye başlamış olan dava açma süresini durdurur. Red veya reddedilmiş sayılma halinde süre yeniden
      işlemeye başlar ve başvurma tarihine kadar geçmiş süre hesaba katılır. Tebliğ 10.1, başvuru 15.1 (5 gün geçmiş), red
      tebliği 25.2; kalan 55 gün içinde 10.3''te açıldığı için süresindedir (25.2 + 55 gün ~ 21.4''e kadar).

      Püf noktaları: Md. 11''de süre "durur", kesilmez; geçmiş süre düşülür. Vergi mahkemesi 30 gün, idare 60 gündür.

      '
    celdiriciler:
      B: İdare mahkemelerinde süre 60 gündür (md. 7); vergi mahkemelerinde 30 gündür.
      C: Süre yeniden başlar ama geçmiş süre hesaba katılır; tam 60 gün yeniden işlemez.
      D: Red tebliğinden tam 60 gün değil, kalan süre uygulanır.
      E: Süre kesilmez, durur; geçmiş süre hesaba katılır (md. 11/3).
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 7/1
    alinti: Dava açma süresi, özel kanunlarında ayrı süre gösterilmeyen hallerde Danıştayda ve idare mahkemelerinde altmış
      ve vergi mahkemelerinde otuz gündür.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 11
    alinti: İlgililer tarafından idari dava açılmadan önce, idari işlemin kaldırılması, geri alınması, değiştirilmesi veya
      yeni bir işlem yapılması üst makamdan, üst makam yoksa işlemi yapmış olan makamdan, idari dava açma süresi içinde istenebilir.
      Bu başvurma, işlemeye başlamış olan idari dava açma süresini durdurur. ... İsteğin reddedilmesi veya reddedilmiş sayılması
      halinde dava açma süresi yeniden işlemeye başlar ve başvurma tarihine kadar geçmiş süre de hesaba katılır.
  gecerlilik:
    baslangic: '1982-01-20'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kaynaklı kör çözücü: anahtarla aynı (güven 4). md.11/1 başvuru süreyi durdurur; 60 gün idare mah.; kalan 55
          gün içinde açılmış'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
