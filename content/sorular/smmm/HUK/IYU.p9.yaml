      \ başka kanunlarda farklı bir kanun yolu\nöngörülmüş olsa dahi, mahkemenin bulunduğu yargı çevresindeki bölge idare\
      \ mahkemesine,\nkararın tebliğinden itibaren otuz gün içinde istinaf yoluna başvurulabilir. (Değişik\ncümle:28/7/2024-7524/52\
      \ md.) Ancak, konusu otuz bir bin Türk lirasını geçmeyen; vergi\n"
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 45/2
    alinti: '        2. İstinaf, temyizin şekil ve usullerine tabidir. İstinaf başvurusuna konu olacak kararlara

