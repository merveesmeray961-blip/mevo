      \ sınavlar, bu sınavlara ilişkin iş ve işlemler ile sınav sonuçları hakkında\naçılan davalara ilişkin yargılama usulünde:\n\
      \        a) Dava açma süresi on gündür.\n        b) Bu Kanunun 11 inci maddesi hükümleri uygulanmaz."
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 20/B/1-(b)-(c)
    alinti: "        b) Bu Kanunun 11 inci maddesi hükümleri uygulanmaz.\n        c) Yedi gün içinde ilk inceleme yapılır\
      \ ve dava dilekçesi ile ekleri tebliğe çıkarılır.\n        ç) Savunma süresi dava dilekçesinin tebliğinden itibaren\
