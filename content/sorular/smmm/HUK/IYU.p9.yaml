    alinti: "        d) Savunma süresi dava dilekçesinin tebliğinden itibaren on beş gün olup, bu süre bir\ndefaya mahsus\
      \ olmak üzere en fazla on beş gün uzatılabilir. Savunmanın verilmesi veya\nsavunma verme süresinin geçmesiyle dosya\
      \ tekemmül etmiş sayılır.\n        e) Yürütmenin durdurulması talebine ilişkin olarak verilecek kararlara itiraz edilemez.\n\
      \        f) Bu davalar dosyanın tekemmülünden itibaren en geç bir ay içinde karara bağlanır. Ara\nkararı verilmesi,\
      \ keşif, bilirkişi incelemesi ya da duruşma yapılması gibi işlemler ivedilikle\nsonuçlandırılır."
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
