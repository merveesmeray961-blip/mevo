- id: SMMM-HUK-IYU-0033
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: İdari yargılama (2577)
  konu: IYU
  kazanim: kararların uygulanması (md.28)
  tip: uygulama
  zorluk: 3
  kok: 2577 sayılı İYUK md. 28 bakımından aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: İdare, esasa ve yürütmenin durdurulmasına ilişkin mahkeme kararlarının icaplarına göre gecikmeksizin işlem tesis etmek
      veya eylemde bulunmak zorundadır.
    B: Genel kural olarak kararın idareye tebliğinden itibaren otuz gün içinde gereğinin yerine getirilmesi gerekir.
    C: Md. 28'de sayılan özel kamu personeli grupları ve belirli güvenlik soruşturması işlemlerine ilişkin, göreve iade sonucunu
      doğuran kararlar nihai kararların kesinleşmesinden sonra yerine getirilir.
    D: Mahkeme kararının süresi içinde kamu görevlilerince yerine getirilmemesi hâlinde tazminat davası doğrudan ilgili kamu
      görevlisine karşı açılabilir.
    E: Karara göre işlem tesis edilmemesi veya eylemde bulunulmaması hâlinde idare aleyhine Danıştay ve ilgili idari mahkemede
      maddi ve manevi tazminat davası açılabilir.
  dogru: D
  aciklama:
    dogru_neden: 'D yanlıştır. Md. 28/4, kararın kamu görevlilerince süresi içinde yerine getirilmemesi hâlinde tazminat davasının
      ancak ilgili idare aleyhine açılabileceğini belirtir. Ayrıca genel otuz günlük kural ile 2026''da eklenen özel kesinleşme
      istisnası birlikte okunmalıdır. Püf noktaları: Genel süre ile özel kesinleşme rejimi birbirinden ayrılmalı; tazminatın
      davalısı ayrıca kontrol edilmelidir.'
    celdiriciler:
      A: Md. 28/1'in genel yükümlülüğünü ifade eder.
      B: Md. 28/1'deki otuz günlük üst sınırdır.
      C: Md. 28/1'e 2026'da eklenen özel kesinleşme kuralına dayanır.
      E: Md. 28/3 idare aleyhine maddi ve manevi tazminat davasına izin verir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 28/1
    alinti: '        Madde 28 – 1. (Değişik:10/6/1994-4001/13 md.) Danıştay, bölge idare mahkemeleri,

      idare ve vergi mahkemelerinin esasa ve yürütmenin durdurulmasına ilişkin kararlarının

      icaplarına göre idare, gecikmeksizin işlem tesis etmeye veya eylemde bulunmaya mecburdur.

      Bu süre hiçbir şekilde kararın idareye tebliğinden başlayarak otuz günü geçemez. (İptal cümle:'
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 28/1 özel kural
    alinti: 'cümle: 10/9/2014-6552/97 md.) (…)22 ancak disiplin hükümleri saklıdır. (Ek cümle:2/7/2026-

      7588/7 md.) Millî Savunma Bakanlığı merkez, taşra, yurt dışı teşkilatı ile bağlı, ilgili, ilişkili ve

      bünyesindeki kuruluşlarda görevli personel ve bunların adayları ile Milli Savunma

      Üniversitesinde eğitim gören askeri öğrenci ve bunların adayları hakkında; Jandarma, Sahil

      Güvenlik ve Emniyet teşkilatlarında görevli personel ve bunların adayları ile Jandarma ve Sahil

      Güvenlik Akademisi, Polis Akademisi ve bunlara bağlı eğitim ve öğretim kurumlarındaki'
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 28/1 özel kural
    alinti: 'feshedilenlerle ilgili idari davalar ile 27/6/1989 tarihli ve 375 sayılı Kanun Hükmünde

      Kararnamenin geçici 35 inci maddesi uyarınca tesis edilen idari işlemlere yönelik açılan idari

      davalar ile ilgili mevzuat uyarınca gerçekleştirilen güvenlik soruşturması ve arşiv araştırması

      işlemlerinin idarece olumsuz değerlendirilmesi sonucu söz konusu idari işleme yönelik açılan

      davalarda verilen ve göreve iade sonucunu doğuran mahkeme kararları uyarınca tesis edilecek

      işlemler, nihai kararların kesinleşmesinden sonra yerine getirilir.'
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 28/4
    alinti: "        3. Danıştay, bölge idare mahkemeleri, idare ve vergi mahkemeleri kararlarına göre\nişlem tesis edilmeyen\
      \ veya eylemde bulunulmayan hallerde idare aleyhine Danıştay ve ilgili\nidari mahkemede maddi ve manevi tazminat davası\
      \ açılabilir.\n        4. (Değişik: 21/2/2014-6526/18 md.) Mahkeme kararlarının süresi içinde kamu\ngörevlilerince yerine\
      \ getirilmemesi hâlinde tazminat davası ancak ilgili idare aleyhine açılabilir."
