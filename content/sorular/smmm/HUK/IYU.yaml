    ne: A çeldirici açıklamasındaki 'yalnızca' ifadesi kaldırılıp md. 15/1-(a)'daki ret hâli de anılarak açıklama
      md. 15/1 ile uyumlu hâle getirildi; gecerlilik.baslangic 2026-01-01 → 1990-04-10 (md. 14/3 ve 15/1'i değiştiren
      3622 s. Kanunun yürürlüğü).
    neden: 'G5/G6 (küçük): md. 15/1-(a) adli yargı görevi hâlinde de davanın reddini öngördüğünden ''yalnızca''
      metinle örtüşmüyordu; gecerlilik.baslangic hükmün gerçek yürürlüğüyle uyumsuzdu.'
