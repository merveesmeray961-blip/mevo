- id: SMMM-HUK-IYU-0001
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: İdari yargılama (2577)
  konu: IYU
  kazanim: ilk inceleme
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: >-
    2577 sayılı İdari Yargılama Usulü Kanunu'na göre, idare mahkemesinde yapılan ilk inceleme sırasında bir
    iptal davasının, işlemi tesis eden idare yerine başka bir idare hasım gösterilerek açıldığı tespit
    edilmiştir. Mahkemenin bu durumda vereceği karar aşağıdakilerden hangisidir?
  secenekler:
    A: "Davanın husumet yönünden reddine"
    B: "Dilekçenin otuz gün içinde yeniden düzenlenmek üzere reddine"
    C: "Dilekçenin görevli idare merciine tevdiine"
    D: "Davanın yetki yönünden reddedilerek dosyanın yetkili mahkemeye gönderilmesine"
    E: "Dava dilekçesinin tespit edilecek gerçek hasma tebliğine"
  dogru: E
  aciklama:
    dogru_neden: >-
      İYUK md. 14/3-(f) uyarınca dilekçeler ilk incelemede husumet yönünden de incelenir. md. 15/1-(c)'ye
      göre davanın hasım gösterilmeden veya yanlış hasım gösterilerek açılması hâlinde dava dilekçesinin
      tespit edilecek gerçek hasma tebliğine karar verilir.
    celdiriciler:
      A: "md. 15/1-(b) davanın reddini yalnızca 3/c (ehliyet), 3/d (kesin ve yürütülmesi gereken işlem) ve 3/e (süre aşımı) hâllerine bağlamıştır; husumet hatası (3/f) davanın reddini değil, gerçek hasma tebliği gerektirir."
      B: "Otuz gün içinde yeniden düzenlenmek üzere dilekçenin reddi, md. 15/1-(d) uyarınca dilekçenin 3. ve 5. maddelere uygun olmaması (3/g) hâlinde verilir; yanlış hasım hâlinde değil."
      C: "Dilekçenin görevli idare merciine tevdii, md. 15/1-(e) uyarınca idari merci tecavüzü (3/b) hâlinde verilen karardır."
      D: "Yetki yönünden ret ve dosyanın yetkili mahkemeye gönderilmesi, md. 15/1-(a) uyarınca görev ve yetki (3/a) yönünden aykırılık hâlinde verilir; somut olayda yetki sorunu yoktur."
  kaynaklar:
    - mevzuat: "2577 sayılı İdari Yargılama Usulü Kanunu"
      madde: "md. 15/1-(a)–(e)"
      alinti: "b) 3/c, 3/d ve 3/e bentlerinde yazılı hallerde davanın reddine, c) 3/f bendine göre, davanın hasım gösterilmeden veya yanlış hasım gösterilerek açılması halinde, dava dilekçesinin tespit edilecek gerçek hasma tebliğine, d) 3/g bendinde yazılı halde otuzgün içinde 3 ve 5 inci maddelere uygun şekilde yeniden düzenlenmek veya noksanları tamamlanmak ... dilekçelerin reddine, e) 3/b bendinde yazılı halde dilekçelerin görevli idare merciine tevdiine,"
    - mevzuat: "2577 sayılı İdari Yargılama Usulü Kanunu"
      madde: "md. 14/3"
      alinti: "a) Görev ve yetki, ... b) İdari merci tecavüzü, c) Ehliyet, d) İdari davaya konu olacak kesin ve yürütülmesi gereken bir işlem olup olmadığı, e) Süre aşımı, f) Husumet, g) 3 ve 5 inci maddelere uygun olup olmadıkları, Yönlerinden sırasıyla incelenir."
  gecerlilik:
    baslangic: "2026-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"
