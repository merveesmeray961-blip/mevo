- id: SMMM-HUK-SGK-0004
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: bildirimler — sigortalı işe giriş bildirgesinin verilmemesine bağlı idari para cezası
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: (A) Ltd. Şti. işyerinde, 5510 sayılı Kanunun 8 inci maddesinin birinci fıkrasında belirtilen sigortalı işe
    giriş bildirgesinin 3 sigortalı için verilmediği, Kurumun denetim ve kontrolle görevli memurlarının 12 Mart
    2025 tarihli tespitiyle anlaşılmış ve işveren hakkında Kanunun 102 nci maddesi uyarınca idari para cezası uygulanmıştır.
    Aynı işyerinde, yine Kurumun denetim ve kontrolle görevli memurlarının 20 Ocak 2026 tarihli tespitiyle 2 başka
    sigortalı için de bildirgenin verilmediği anlaşılmıştır. 20 Ocak 2026 tarihli tespit nedeniyle işveren hakkında
    uygulanacak idari para cezası toplam kaç asgari ücret tutarındadır?
  secenekler:
    A: Asgari ücretin 4 katı tutarında
    B: Asgari ücretin 5 katı tutarında
    C: Asgari ücretin 6 katı tutarında
    D: Asgari ücretin 10 katı tutarında
    E: Asgari ücretin 15 katı tutarında
  dogru: D
  aciklama:
    dogru_neden: Md. 102/1-(a)-(2)'ye göre bildirgenin verilmediğinin Kurumun denetim ve kontrolle görevli memurlarının
      tespitinden anlaşılması hâlinde her bir sigortalı için asgari ücretin iki katı idari para cezası uygulanır.
      Md. 102/1-(a)-(3)'e göre tespit tarihinden itibaren bir yıl içinde aynı işyerinde (2) numaralı alt bentte
      sayılan durumlardan biriyle tekrar bildirge verilmediğinin anlaşılması hâlinde bu defa her bir sigortalı için
      asgari ücretin beş katı idari para cezası uygulanır. İkinci tespit, birinci tespitten (12 Mart 2025) itibaren
      bir yıl içinde (20 Ocak 2026) yapıldığından 2 sigortalı × 5 = asgari ücretin 10 katı uygulanır.
    celdiriciler:
      A: 4 kat, tekrar hükmü (beş kat) uygulanmayıp her sigortalı için iki kat esas alınarak bulunur (2 × 2).
      B: 5 kat, ceza sigortalı sayısı dikkate alınmadan yalnızca beş kat olarak alındığında bulunur; ceza her bir
        sigortalı için uygulanır.
      C: 6 kat, ilk tespitteki sigortalı sayısı (3) ile iki kat esas alınarak bulunur; sorulan 20 Ocak 2026 tespitidir
        ve 2 sigortalıyı kapsar.
      E: 15 kat, ilk tespitteki sigortalı sayısı (3) beş kat ile çarpılarak bulunur; ikinci tespitte 2 sigortalı
        vardır.
  kaynaklar:
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 8/1 (birinci cümle)
    alinti: İşverenler, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılan kişileri, 7 nci
      maddenin birinci fıkrasının (a) bendinde belirtilen sigortalılık başlangıç tarihinden önce, sigortalı işe
      giriş bildirgesi ile Kuruma bildirmekle yükümlüdür.
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 102/1-(a)-(2)
    alinti: 2) 8 inci maddenin birinci fıkrasında belirtilen bildirgenin verilmediğinin, mahkeme ... halinde bildirgeyi
      vermekle yükümlü olanlar hakkında her bir sigortalı için asgari ücretin iki katı tutarında idari para cezası
      uygulanır.
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 102/1-(a)-(3)
    alinti: 3) İşyeri esas alınmak suretiyle bildirgenin verilmediğine ilişkin; mahkemenin karar tarihinden, Kurumun
      denetim ve kontrolle görevli memurlarının tespit tarihinden, ... itibaren bir yıl içinde bu bendin (2) numaralı
      alt bendinde sayılan durumlardan biriyle tekrar bildirge verilmediğinin anlaşılması halinde, bildirgeyi vermekle
      yükümlü olanlar hakkında bu defa her bir sigortalı için asgari ücretin beş katı tutarında idari para cezası
      uygulanır.
