  kok: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu'na göre aşağıdakilerden hangisi uzun vadeli
    sigorta kollarından biridir?
  secenekler:
    A: Genel sağlık sigortası
    B: Malûllük sigortası
    C: İş kazası ve meslek hastalığı sigortası
    D: Hastalık sigortası
    E: Analık sigortası
  dogru: B
  aciklama:
    dogru_neden: 5510 sayılı Kanun md. 3'ün (5) numaralı bendi uyarınca uzun vadeli sigorta kolları malûllük, yaşlılık
      ve ölüm sigortası kollarıdır; dolayısıyla malûllük sigortası uzun vadeli sigorta kollarındandır.
    celdiriciler:
      A: Genel sağlık sigortası md. 3'ün (8) numaralı bendinde ayrıca tanımlanmıştır; (4) ve (5) numaralı bentlerde
        sayılan kısa veya uzun vadeli sigorta kollarından biri değildir.
      C: İş kazası ve meslek hastalığı sigortası md. 3'ün (4) numaralı bendine göre kısa vadeli sigorta kollarındandır.
      D: Hastalık sigortası md. 3'ün (4) numaralı bendine göre kısa vadeli sigorta kollarındandır.
      E: Analık sigortası md. 3'ün (4) numaralı bendine göre kısa vadeli sigorta kollarındandır.
  kaynaklar:
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 3 (3), (4) ve (5) numaralı bentler
    alinti: '3) Sosyal sigortalar: Kısa ve uzun vadeli sigorta kollarını, 4) Kısa vadeli sigorta kolları: İş kazası
      ve meslek hastalığı, hastalık ve analık sigortası kollarını, 5) Uzun vadeli sigorta kolları: Malûllük, yaşlılık
      ve ölüm sigortası kollarını,'
