    değildir; isteğe bağlı sigortalı da değildir. Kurumca yapılan gelir tespitine göre aile içindeki geliri kişi başına düşen
    aylık tutar asgari ücretin üçte birinden azdır. Ece’nin başka bir genel sağlık sigortalılığı veya bakmakla yükümlü olunan
    kişi statüsü de bulunmamaktadır. Hangisi doğrudur?
