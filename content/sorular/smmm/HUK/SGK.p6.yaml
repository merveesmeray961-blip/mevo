    D: Yalnız isteğe bağlı sigortalı olursa GSS’lidir.
    E: Yalnız 4/a’ya girince GSS’lidir.
  dogru: A
  aciklama:
    dogru_neden: Md. 60/1-c-1'e göre ikametgâhı Türkiye'de olan ve (a) ile (b) bentlerine göre sigortalı sayılmayanlardan,
      Kurumca belirlenecek test yöntemleriyle tespit edilen aile içindeki geliri kişi başına düşen aylık tutarı asgari ücretin
      üçte birinden az olan vatandaşlar genel sağlık sigortalısı sayılır. Ece bu şartların hepsini taşır.
    celdiriciler:
      B: Ece md. 4 kapsamında sigortalı olmadığından kısa vadeli sigorta kollarına tabi değildir; durumu md. 60/1-c-1'deki
        genel sağlık sigortalılığına ilişkindir.
      C: Gelir tespitine göre kişi başına aylık gelir asgari ücretin üçte birinden az olduğundan Ece md. 60/1-c-1 kapsamında
        genel sağlık sigortalısıdır; GSS dışında kalmaz.
      D: İsteğe bağlı sigortalılık md. 60/1-b'deki ayrı bir GSS kapsamıdır; md. 60/1-c-1 kapsamına girmek için isteğe bağlı
        sigortalı olmak gerekmez.
      E: Md. 60/1-c-1 kapsamı, (a) ve (b) bentlerine göre sigortalı sayılmayanlara ilişkindir; 4/a kapsamında çalışmaya başlamak
        şart değildir.
