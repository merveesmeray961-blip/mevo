  konu: SGK
  kazanim: iş kazası ve kısa vadeli sigortalar
  tip: uygulama
  zorluk: 2
  kok: '(S), 4/1-(a) kapsamında sigortalı olarak (İ) işyerinde çalışmaktadır. (S), işverence sağlanan servis aracıyla
    işyerine giderken meydana gelen kaza sonucunda bedenen engelli hâle gelmiştir.


    5510 sayılı Kanun’a göre bu olayın niteliği ve bildirimi hakkında aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: İş kazası sayılmaz; çünkü işyerinde meydana gelmemiştir.
    B: İş kazası sayılır; işveren olayı en geç kazadan sonraki üç işgünü içinde Kuruma bildirmek zorundadır.
    C: İş kazası sayılır; bildirim süresi bir aydır.
    D: Meslek hastalığı sayılır; çünkü iş nedeniyle meydana gelmiştir.
    E: İş kazası sayılmaz; çünkü görevli olarak işyeri dışında gönderilmemiştir.
  dogru: B
  aciklama:
    dogru_neden: '5510 sayılı Kanun md. 13/e’ye göre sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı
      yere gidiş gelişi sırasında meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle
      getiren olay iş kazasıdır. 4/1-(a) kapsamındaki sigortalılar bakımından işveren, olayı Kuruma en geç kazadan
      sonraki üç işgünü içinde bildirmek zorundadır.

      Püf noktaları: Servis kazası açıkça iş kazası sayılır; bildirim süresi üç işgünüdür.

      '
    celdiriciler:
      A: Md. 13/e açıkça işverence sağlanan taşıtla gidiş-gelişi iş kazası sayar.
      C: 4/1-(a) için bildirim süresi üç işgünüdür; bir ay 4/1-(b) için geçerlidir.
      D: Meslek hastalığı tekrarlanan sebeple veya işin yürütüm şartlarından doğar; ani olay iş kazasıdır.
      E: Görevli gönderme (md. 13/c) ayrı bir hâldir; servis kazası bağımsız olarak düzenlenmiştir.
