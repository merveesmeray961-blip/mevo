    İşveren, sigortalı işe giriş bildirgesini 10 Mart 2026 günü Kuruma vermiştir.


    5510 sayılı Kanun''a göre bu bildirim, sigortalılık başlangıcından önce yapılmış sayılır mı? Ayrıca, sigortalının kendisinin
    de Kuruma bildirim yükümlülüğü var mıdır ve bu yükümlülüğün yerine getirilmemesi sigortalı aleyhine delil teşkil eder
    mi?'
  secenekler:
    A: Bildirim önceden sayılır; sigortalının bildirimi zorunludur ve aleyhine delil teşkil eder.
    B: Bildirim önceden sayılır; sigortalının bildirimi zorunludur ama aleyhine delil teşkil etmez.
    C: Bildirim önceden sayılmaz çünkü inşaatta en geç işe başlatıldığı gün yapılmalıdır; sigortalının bildirimi yoktur.
    D: Bildirim önceden sayılır; sigortalının bildirimi yoktur.
    E: Bildirim önceden sayılmaz; sigortalının bildirimi zorunludur ve aleyhine delil teşkil eder.
  dogru: B
  aciklama:
    dogru_neden: '5510 md. 8''e göre inşaat işyerlerinde işe başlatılacak sigortalılar için bildirgenin en geç çalışmaya başlatıldığı
      gün verilmesi halinde sigortalılık başlangıcından önce bildirilmiş sayılır. Sigortalılar da en geç bir ay içinde bildirim
      yaparlar ancak kendilerini bildirmemeleri aleyhlerine delil teşkil etmez.


      Püf noktaları: İnşaat özel kuralı (md. 8/a) ve sigortalının bildiriminin aleyhine delil olmaması ayrı ayrı değerlendirilmelidir.'
    celdiriciler:
      A: Sigortalının bildiriminin aleyhine delil teşkil ettiği yanlıştır.
      C: İnşaatta en geç aynı gün verilmesi önceden sayılma sonucunu doğurur.
      D: Sigortalının da bildirim yükümlülüğü vardır (md. 8/2).
      E: İnşaat kuralı nedeniyle önceden sayılır.
