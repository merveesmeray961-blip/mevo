    alinti: İşverenler, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılan kişileri, 7 nci
      maddenin birinci fıkrasının (a) bendinde belirtilen sigortalılık başlangıç tarihinden önce, sigortalı işe
      giriş bildirgesi ile Kuruma bildirmekle yükümlüdür. Ancak işveren tarafından sigortalı işe giriş bildirgesi;
      a) İnşaat, balıkçılık ve tarım işyerlerinde işe başlatılacak sigortalılar için, en geç çalışmaya başlatıldığı
      gün, ... Kuruma verilmesi halinde, sigortalılık başlangıcından önce bildirilmiş sayılır. Sigortalılar, çalışmaya
