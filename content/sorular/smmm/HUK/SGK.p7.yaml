      B: Bunlar uzun vadeli sigorta kollarıdır (md. 3 bent 5).
      C: Malûllük uzun vadeli bir koldur; kısa vadeli kollar arasında yer almaz.
      D: Yaşlılık uzun vadeli bir koldur; kısa vadeli kollar arasında yer almaz.
