- id: SMMM-HUK-SGK-0015
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: idari para cezaları
  tip: bilgi
  zorluk: 1
  kok: '5510 sayılı Kanun md. 102’ye göre, işveren tarafından sigortalı işe giriş bildirgesinin kanunda belirtilen süre içinde
    veya Kurumca belirlenen şekle ve usule uygun verilmemesi hâlinde, her bir sigortalı için uygulanacak idari para cezası
    tutarı nedir?

    '
  secenekler:
    A: Asgari ücret tutarında
    B: Asgari ücretin iki katı tutarında
    C: Asgari ücretin üç katı tutarında
    D: Asgari ücretin beş katı tutarında
    E: Bir aylık brüt asgari ücretin yarısı tutarında
  dogru: A
  aciklama:
    dogru_neden: '5510 sayılı Kanun md. 102/a-1’e göre 8 inci maddenin birinci fıkrası ile 61 inci maddede belirtilen bildirgeyi,
      bu Kanunda belirtilen süre içinde ya da Kurumca belirlenen şekle ve usule uygun vermeyenler veya Kurumca internet, elektronik
      veya benzeri ortamda göndermekle zorunlu tutulduğu hâlde anılan ortamda göndermeyenler hakkında her bir sigortalı için
      asgari ücret tutarında idari para cezası uygulanır.

      '
    celdiriciler:
      B: İki kat, bildirgenin verilmediğinin mahkeme/denetim vb. yollarla anlaşılması hâlinde uygulanır (md. 102/a-2).
      C: Üç kat, işyeri bildirgesi için kamu idareleri ve bilanço esasına göre defter tutanlar içindir.
      D: Beş kat, bir yıl içinde tekrar bildirge verilmediğinin anlaşılması hâlinde uygulanır.
      E: Yarım asgari ücret tutarı kanun da yoktur.
  kaynaklar:
