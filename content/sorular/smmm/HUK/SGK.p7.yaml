- id: SMMM-HUK-SGK-0014
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: ücret tanımı
  tip: uygulama
  zorluk: 3
  kok: '(S), 4/1-(a) kapsamında sigortalıdır. İşveren (İ), (S)’ye aylık brüt 25.000 TL ücret, ayrıca her ay düzenli
    olarak 2.000 TL yol ve yemek yardımı (nakdi) ödemektedir. Prim hesabında hangi tutar esas alınır?


    5510 sayılı Kanun’a göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Yalnızca 25.000 TL ücret prime esas kazanca dahil edilir; yol ve yemek yardımı dahil edilmez.
    B: 25.000 TL + 2.000 TL = 27.000 TL prime esas kazanca dahil edilir; çünkü süreklilik niteliği taşıyan para
      ile ödenen tutarlardır.
    C: Yalnızca asgari ücret tutarı prime esas alınır.
    D: Yol ve yemek yardımı ayni olduğu için hiçbiri dahil edilmez.
    E: 25.000 TL’nin yarısı + 2.000 TL esas alınır.
  dogru: B
  aciklama:
    dogru_neden: '5510 sayılı Kanun md. 3 bent 12’ye göre ücret; 4/1-(a) ve (c) kapsamındaki sigortalılara saatlik,
      günlük, haftalık, aylık veya yıllık olarak para ile ödenen ve süreklilik niteliği taşıyan brüt tutarı ifade
      eder. Düzenli nakdi yol ve yemek yardımı da süreklilik taşıyan para ödemesi olduğundan ücrete dahildir ve
      prime esas kazanca girer.

      Püf noktaları: Süreklilik ve para ile ödeme şartı aranır; ayni yardımlar veya arızi ödemeler farklı değerlendirilebilir.

      '
    celdiriciler:
      A: Süreklilik niteliği taşıyan nakdi yardımlar da ücret tanımına girer.
      C: Asgari ücret alt sınırdır; fiilî ücret daha yüksekse o esas alınır.
      D: Yol ve yemek yardımı nakdi (para ile) ödendiği için ayni değildir.
      E: Kanunda yarısı alınacağına dair hüküm yoktur.
  kaynaklar:
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 3/12
    alinti: 'Ücret: 4 üncü maddenin birinci fıkrasının (a) ve (c) bendi kapsamında sigortalı sayılanlara saatlik,
