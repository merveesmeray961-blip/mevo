    ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: Genel sağlık sigortası, yalnız uzun vadeli sigorta kollarına tabi olanları kapsar.
    B: Genel sağlık sigortası, kişilerin öncelikle sağlıklarının korunmasını, sağlık riskleri ile karşılaşmaları halinde ise
      oluşan harcamaların finansmanını sağlayan sigortadır.
    C: Genel sağlık sigortalısı olabilmek için mutlaka kısa vadeli sigorta kollarına tabi olmak gerekir.
    D: Genel sağlık sigortası primi, yalnız işveren tarafından ödenir.
    E: Genel sağlık sigortası, iş kazası ve meslek hastalığı sigortasının bir koludur.
  dogru: B
  aciklama:
    dogru_neden: '5510 sayılı Kanun md. 3 bent 8’e göre genel sağlık sigortası; kişilerin öncelikle sağlıklarının korunmasını,
      sağlık riskleri ile karşılaşmaları halinde ise oluşan harcamaların finansmanını sağlayan sigortadır. Genel sağlık sigortalısı
      md. 60’ta sayılan kişilerdir.

      '
    celdiriciler:
      A: GSS, kısa ve uzun vadeli sigorta kollarından bağımsız olarak tanımlanan ayrı bir sigortadır.
      C: GSS kapsamı md. 60’ta ayrıca düzenlenmiştir; kısa vadeli sigorta şartı yoktur.
      D: Prim yükümlülüğü sigortalı ve işveren arasında paylaşılır; yalnız işveren değildir.
      E: İş kazası ve meslek hastalığı kısa vadeli sigorta koludur; GSS ayrıdır.
