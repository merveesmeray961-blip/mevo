  kok: '5510 sayılı Kanun’a göre, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı çalıştıran işverenler,
    sigortalı işe başlatmadan önce işe giriş bildirgesini ne zaman vermek zorundadır?

    '
  secenekler:
    A: Sigortalının işe başladığı gün
    B: Sigortalının işe başlamasından önceki gün
    C: Sigortalı işe başlamadan önce
    D: Sigortalının işe başladığı ayın sonuna kadar
    E: Sigortalının işe başladığı tarihten itibaren üç iş günü içinde
  dogru: C
  aciklama:
    dogru_neden: 'Madde 8/1: İşverenler, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılanları, sigortalı
      işe başlamadan önce, sigortalı işe giriş bildirgesi ile Kuruma bildirmekle yükümlüdür.

      '
    celdiriciler:
