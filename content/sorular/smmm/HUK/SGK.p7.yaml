      D: İkinci olay için md. 102/a-3 beş kat öngörür; on katlık bir tutar bu fiil için düzenlenmemiştir.
      E: İlk denetim tespiti beş kat değildir; beş kat, bir yıl içinde tekrar tespit hâlinde uygulanır.
