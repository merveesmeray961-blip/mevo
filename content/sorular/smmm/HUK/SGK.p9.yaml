      C: Kamu/bilanço statüsünün üç kat olduğu kuralını tersine çevirmiştir.
      D: Kaynakta beş kat ve üç kat şeklinde bir kademelendirme yoktur.
      E: Ceza defter tutma statüsüne göre farklılaşır.
