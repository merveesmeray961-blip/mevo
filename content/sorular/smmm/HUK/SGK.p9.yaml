- id: SMMM-HUK-SGK-0049
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: iş kazası ve kısa vadeli sigortalar
  tip: uygulama
  zorluk: 3
  kok: 5510 sayılı Kanuna göre aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: 4/a kapsamındaki sigortalının işverence sağlanan taşıtla işin yapıldığı yere gidişi sırasında meydana gelen ve sigortalıyı
      sonradan bedenen engelli hâle getiren olay iş kazası sayılabilir.
    B: 4/a kapsamındaki sigortalının iş kazasının işverenin kontrolü dışındaki bir yerde meydana gelmesi hâlinde Kuruma bildirim
      süresi, işverenin kazayı öğrendiği tarihten itibaren başlar.
    C: 4/b kapsamındaki sigortalı bakımından iş kazasının Kuruma bildirimi, rahatsızlığın bildirime engel olmadığı günden
      sonra üç işgünü içinde yapılır; ancak bu süre bir ayı geçemez.
    D: İşverenin iş kazasını Kuruma bildirmesi için tanınan üç işgünlük süre, olayın işverenin kontrolü dışındaki yerde meydana
      gelmesi hâlinde olay tarihinden itibaren değişmeden işlemeye devam eder.
    E: Kurumun soruşturması sonucunda yazılı bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı anlaşılırsa,
      Kurumca bu olay için yersiz yapılan ödemeler gerçeğe aykırı bildirimde bulunanlardan tahsil edilebilir.
  dogru: D
  aciklama:
    dogru_neden: 'D yanlıştır. İşverenin kontrolü dışındaki yerde meydana gelen iş kazasında üç işgünlük Kurum bildirim süresi,
      kazanın öğrenildiği tarihten başlar. Püf noktaları: İş kazasının kapsamı ile bildirim süresinin başlangıcı ayrı kurallardır;
      ayrıca 4/a ve 4/b sigortalılarının bildirim rejimleri aynı değildir.'
    celdiriciler:
      A: Md. 13/1-(e) kapsamındaki işverence sağlanan taşıtla gidiş-geliş hâlidir.
      B: Md. 13/2-(a) öğrenme tarihini esas alır.
      C: Md. 13/2-(b) 4/b için özel süreyi düzenler.
      E: Md. 13/3 gerçeğe aykırı bildirim hâlinde yersiz ödemelerin tahsilini öngörür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 13/1-(e), 13/2-(a)
    alinti: "         c) Bir işverene bağlı olarak çalışan sigortalının, görevli olarak işyeri dışında başka bir\nyere gönderilmesi\
      \ nedeniyle asıl işini yapmaksızın geçen zamanlarda,\n         d) (Değişik: 17/4/2008-5754/8 md.) Bu Kanunun 4 üncü\
      \ maddesinin birinci fıkrasının\n(a) bendi kapsamındaki emziren kadın sigortalının, iş mevzuatı gereğince çocuğuna süt\n\
      vermek için ayrılan zamanlarda,\n         e) Sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı yere gidiş\
      \ gelişi sırasında,\n         meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle\ngetiren\
      \ olaydır.25"
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 13/2-(b)
    alinti: "         İş kazasının 4 üncü maddenin birinci fıkrasının;\n         a) (a) bendi ile 5 inci madde kapsamında\
      \ bulunan sigortalılar bakımından bunları\nçalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve\
      \ Kuruma da en geç\nkazadan sonraki üç işgünü içinde,\n         b) (b) bendi kapsamında bulunan sigortalı bakımından\
      \ kendisi tarafından, bir ayı\ngeçmemek şartıyla rahatsızlığının bildirim yapmaya engel olmadığı günden sonra üç işgünü\n\
      içinde,"
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 13/3
    alinti: '         (Değişik paragraf: 17/4/2008-5754/8 md.) iş kazası ve meslek hastalığı bildirgesi ile

      doğrudan ya da taahhütlü posta ile Kuruma bildirilmesi zorunludur. Bu fıkranın (a) bendinde

      belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş

      kazasının öğrenildiği tarihten itibaren başlar.'
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 13/3
    alinti: '         Kuruma bildirilen olayın iş kazası sayılıp sayılmayacağı hakkında bir karara

      varılabilmesi için gerektiğinde, Kurumun denetim ve kontrol ile yetkilendirilen memurları

      tarafından veya Bakanlık iş müfettişleri vasıtasıyla soruşturma yapılabilir. Bu soruşturma

      sonunda yazılı olarak bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı

      anlaşılırsa, Kurumca bu olay için yersiz olarak yapılmış bulunan ödemeler, ödemenin

      yapıldığı tarihten itibaren gerçeğe aykırı bildirimde bulunanlardan, 96 ncı madde hükmüne

      göre tahsil edilir.'
