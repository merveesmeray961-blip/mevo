- id: SMMM-HUK-SGK-0001
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: bildirimler
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: >-
    5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu'na göre, bir inşaat işyerinde
    4. maddenin birinci fıkrasının (a) bendi kapsamında çalıştırılacak bir işçinin sigortalı işe giriş
    bildirgesinin, sigortalılık başlangıcından önce bildirilmiş sayılabilmesi için Kuruma en geç ne
    zaman verilmesi gerekir?
  secenekler:
    A: "Çalışmaya başlatılacağı günden bir gün önce"
    B: "Çalışmaya başlatıldığı gün"
    C: "Çalışmaya başlatıldığı tarihten itibaren on beş gün içinde"
    D: "Çalışmaya başlatıldığı tarihten itibaren bir ay içinde"
    E: "Çalışmaya başlatıldığı ayı izleyen ayın sonuna kadar"
  dogru: B
  aciklama:
    dogru_neden: >-
      5510 sayılı Kanun md. 8/1'e göre işverenler 4/a kapsamındaki sigortalıları sigortalılık başlangıç
      tarihinden önce bildirmekle yükümlüdür. Ancak aynı fıkranın (a) bendi uyarınca inşaat, balıkçılık ve
      tarım işyerlerinde işe başlatılacak sigortalılar için işe giriş bildirgesinin en geç çalışmaya
      başlatıldığı gün Kuruma verilmesi hâlinde bildirge sigortalılık başlangıcından önce verilmiş sayılır.
    celdiriciler:
      A: "Kanunda 'bir gün önce' biçiminde bir süre öngörülmemiştir; inşaat işyerleri için kanun, bildirgenin en geç çalışmaya başlatıldığı gün verilmesini yeterli saymıştır."
      C: "On beş günlük süre, md. 8'de 4/b kapsamındakilere ilişkin ilgili kurumların bildirimleri ve 4/c kapsamındakilerin işe giriş bildirimi için öngörülmüştür; inşaat işyerinde 4/a sigortalısı için değildir."
      D: "Bir aylık süre, md. 8/1-(b) ve (c) bentlerindeki özel durumlar (ilk defa işyeri bildirgesi verilecek işyerleri, kamu idarelerinin belirli sözleşmeli personeli vb.) ile sigortalının kendi bildirimi için öngörülmüştür."
      E: "Kanunda işe giriş bildirimi için 'izleyen ayın sonu' biçiminde bir süre yoktur; inşaat işyerlerinde son gün, çalışmaya başlatılan gündür."
  kaynaklar:
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 8/1-(a)"
      alinti: "Ancak işveren tarafından sigortalı işe giriş bildirgesi; a) İnşaat, balıkçılık ve tarım işyerlerinde işe başlatılacak sigortalılar için, en geç çalışmaya başlatıldığı gün,"
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 8/1 (son paragraf)"
      alinti: "Kuruma verilmesi halinde, sigortalılık başlangıcından önce bildirilmiş sayılır."
  gecerlilik:
    baslangic: "2008-10-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"

- id: SMMM-HUK-SGK-0002
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: iş kazası ve kısa vadeli sigortalar
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: >-
    (A) Ltd. Şti.'nde 5510 sayılı Kanun'un 4. maddesinin birinci fıkrasının (a) bendi kapsamında çalışan
    teknik servis elemanı, işverenin kontrolü dışında bulunan bir müşteri işyerinde arıza giderirken
    yaralanmıştır. İşveren olayı, kazanın meydana gelmesinden iki gün sonra öğrenmiştir. 5510 sayılı
    Kanun'a göre işverenin bu iş kazasını Kuruma bildirmesine ilişkin aşağıdaki ifadelerden hangisi
    doğrudur?
  secenekler:
    A: "Bildirim, kazanın meydana geldiği günden itibaren üç işgünü içinde yapılmalıdır."
    B: "Bildirim, kazanın meydana geldiği günden itibaren on gün içinde yapılmalıdır."
    C: "Bildirim, kazanın öğrenildiği tarihten itibaren bir ay içinde yapılmalıdır."
    D: "Bildirim için öngörülen üç işgünlük süre, kazanın öğrenildiği tarihten itibaren başlar."
    E: "İşveren yalnızca kolluk kuvvetlerine bildirimde bulunur; Kuruma bildirimi kolluk yapar."
  dogru: D
  aciklama:
    dogru_neden: >-
      5510 sayılı Kanun md. 13/2-(a) uyarınca 4/a kapsamındaki sigortalının iş kazası, işveren tarafından o
      yer yetkili kolluk kuvvetlerine derhal, Kuruma da en geç kazadan sonraki üç işgünü içinde bildirilir.
      Aynı fıkraya göre bu süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi hâlinde
      iş kazasının öğrenildiği tarihten itibaren başlar. Kaza müşteri işyerinde (işverenin kontrolü dışında)
      meydana geldiğinden üç işgünlük süre işverenin olayı öğrendiği tarihten başlar.
    celdiriciler:
      A: "Üç işgünlük süre kural olarak kazadan sonra işlemeye başlar; ancak kaza işverenin kontrolü dışındaki bir yerde meydana geldiğinden kanun, sürenin öğrenme tarihinden başlayacağını öngörmüştür."
      B: "md. 13'te iş kazasının Kuruma bildirimi için on günlük bir süre öngörülmemiştir; 4/a sigortalıları bakımından süre üç işgünüdür."
      C: "Bir aylık süre md. 13'te yalnızca 4/b kapsamındaki sigortalının kendi bildirimi bakımından, rahatsızlığın bildirime engel olduğu sürenin üst sınırı olarak geçer; 4/a sigortalısı için işverenin bildirim süresi üç işgünüdür."
      E: "İşveren hem o yer yetkili kolluk kuvvetlerine derhal hem de Kuruma bildirimde bulunmakla yükümlüdür; Kuruma bildirim yükümlülüğü kolluğa devredilmemiştir."
  kaynaklar:
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 13/2-(a)"
      alinti: "a) (a) bendi ile 5 inci madde kapsamında bulunan sigortalılar bakımından bunları çalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve Kuruma da en geç kazadan sonraki üç işgünü içinde,"
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 13/2 (son paragraf)"
      alinti: "Bu fıkranın (a) bendinde belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş kazasının öğrenildiği tarihten itibaren başlar."
  gecerlilik:
    baslangic: "2008-10-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"

- id: SMMM-HUK-SGK-0003
  sinav: smmm
  bolum: [YET]
  ders: HUK
  unite: Sosyal güvenlik (5510)
  konu: SGK
  kazanim: sigortalılık (4/a-b-c) ve kapsam
  tip: kavrama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: >-
    5510 sayılı Kanun'un 6. maddesine göre, aşağıdakilerden hangisi kısa ve uzun vadeli sigorta kolları
    hükümlerinin uygulanmasında sigortalı sayılmayanlar arasında **yer almaz**?
  secenekler:
    A: "Ev hizmetlerinde ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışan kişi"
    B: "İşverenin işyerinde ücretsiz çalışan eşi"
    C: "Askerlik hizmetini er veya erbaş olarak yapmakta olan kişi"
    D: "Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen hasta"
    E: "Yabancı ülkedeki bir kuruluşça Türkiye'ye üç ayı geçmemek üzere bir iş için gönderilen ve o ülkede sosyal sigortaya tabi olduğunu belgeleyen kişi"
  dogru: A
  aciklama:
    dogru_neden: >-
      md. 6/1-(c) bendi ev hizmetlerinde çalışanları sigortalı sayılmayanlar arasında saymakla birlikte, ücretle
      aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanları (ve ek 9. maddenin ikinci fıkrası
      kapsamında sigortalı olanları) bu istisnanın dışında tutmuştur. Dolayısıyla bu kişi, md. 6'da sayılan
      sigortalı sayılmayanlar arasında yer almaz.
    celdiriciler:
      B: "md. 6/1-(a) uyarınca işverenin işyerinde ücretsiz çalışan eşi sigortalı sayılmaz; bu kişi md. 6 kapsamındadır."
      C: "md. 6/1-(d) uyarınca askerlik hizmetini er ve erbaş olarak yapmakta olanlar sigortalı sayılmaz; bu kişi md. 6 kapsamındadır."
      D: "md. 6/1-(g) uyarınca sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen hasta veya malûller sigortalı sayılmaz; bu kişi md. 6 kapsamındadır."
      E: "md. 6/1-(e) uyarınca, uluslararası sosyal güvenlik sözleşmeleri hükümleri saklı kalmak kaydıyla, yabancı bir ülkedeki kuruluş tarafından Türkiye'ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler sigortalı sayılmaz; bu kişi md. 6 kapsamındadır."
  kaynaklar:
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 6/1-(a), (c), (d)"
      alinti: "a) İşverenin işyerinde ücretsiz çalışan eşi, ... c) (Değişik: 17/4/2008-5754/4 md.) Ev hizmetlerinde çalışanlar (Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar hariç), d) Askerlik hizmetlerini er ve erbaş olarak yapmakta olanlar ile yedek subay ve yedek astsubay okulu öğrencileri,"
    - mevzuat: "5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu"
      madde: "md. 6/1-(e), (g) ve fıkra sonu"
      alinti: "yabancı bir ülkede kurulu herhangi bir kuruluş tarafından ve o kuruluş adına ve hesabına Türkiye’ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler ... g) Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen, hasta veya malûller, ... 4 üncü ve 5 inci maddelere göre sigortalı sayılmaz."
  gecerlilik:
    baslangic: "2026-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"
