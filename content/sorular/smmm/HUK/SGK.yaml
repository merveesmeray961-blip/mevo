      girdi; resmî metindeki 12 numaralı dipnotla doğrulandı).
    neden: 'G5 (küçük): gecerlilik.baslangic hükmün gerçek yürürlük tarihiyle uyumsuzdu.'
  - tarih: '2026-10-03'
