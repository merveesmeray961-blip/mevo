- id: SMMM-HUK-TIC-0003
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: kıymetli evrak — çekte ibraz süresi ve başvurma haklarının zamanaşımı
  tip: uygulama
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6102 sayılı Türk Ticaret Kanunu''na göre, İstanbul''da düzenlenip Ankara''da ödenecek bir çekle ilgili aşağıdaki
    ifadelerden hangileri doğrudur?


    I. Çek, bir ay içinde muhataba ibraz edilmelidir; bu süre çekte yazılı olan düzenlenme tarihinin ertesi günü
    başlar.


    II. Hamilin, cirantalarla düzenleyene karşı sahip olduğu başvurma hakları, çekin düzenlenme tarihinden itibaren
    üç yıl geçmekle zamanaşımına uğrar.


    III. Çek borçlularından birinin diğerine karşı sahip olduğu başvurma hakları, bu çek borçlusunun çeki ödediği
    veya çekin dava yolu ile kendisine karşı ileri sürüldüğü tarihten itibaren üç yıl geçmekle zamanaşımına uğrar.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'I numaralı ifade md. 796/1 ve 796/3''e uygundur: düzenlendiği yerden başka bir yerde ödenecek
      çek bir ay içinde ibraz edilmelidir ve süre düzenlenme tarihinin ertesi günü başlar. III numaralı ifade md.
      814/2''ye uygundur. II numaralı ifade yanlıştır: md. 814/1''e göre hamilin başvurma hakları, düzenlenme tarihinden
      değil ibraz süresinin bitiminden itibaren üç yıl geçmekle zamanaşımına uğrar. Doğru ifadeler I ve III''tür.
      Püf noktası: Md. 814''ün birinci ve ikinci fıkralarındaki süreler, 31/1/2012 tarihli ve 6273 sayılı Kanunun
      8 inci maddesiyle "altı ay"dan "üç yıl"a çıkarılmıştır; altı aylık süreyi esas alan aday III''ü yanlış sayıp
      "Yalnız I" şıkkına yönelir.'
    celdiriciler:
      A: I numaralı ifade doğrudur; ancak III numaralı ifade de md. 814/2'ye uygundur, dolayısıyla yalnız I eksik
        bir cevaptır. Bu şık, 6273 sayılı Kanunla "üç yıl"a çıkarılmadan önceki altı aylık süreyi esas alan adayı
        yakalar.
      B: II numaralı ifade md. 814/1'e aykırıdır; zamanaşımı başlangıcı düzenlenme tarihi değil ibraz süresinin
        bitimidir.
      D: II numaralı ifade md. 814/1'e aykırıdır (zamanaşımı ibraz süresinin bitiminden itibaren işler); ayrıca
        doğru olan I numaralı ifade bu şıkta yer almamıştır.
      E: II numaralı ifade md. 814/1'e aykırı olduğundan üç ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 796/1
    alinti: (1) Bir çek, düzenlendiği yerde ödenecekse on gün; düzenlendiği yerden başka bir yerde ödenecekse bir
      ay içinde muhataba ibraz edilmelidir.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 796/3
    alinti: (3) Birinci ve ikinci fıkralarda yazılı süreler, çekte yazılı olan düzenlenme tarihinin ertesi günü
      başlar.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 814/1
    alinti: (1) Hamilin, cirantalarla düzenleyene ve diğer çek borçlularına karşı sahip olduğu başvurma hakları,
      ibraz süresinin bitiminden itibaren üç yıl geçmekle zamanaşımına uğrar.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 814/2
    alinti: (2) Çek borçlularından birinin diğerine karşı sahip olduğu başvurma hakları, bu çek borçlusunun çeki
      ödediği veya çekin dava yolu ile kendisine karşı ileri sürüldüğü tarihten itibaren üç yıl geçmekle zamanaşımına
      uğrar.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 814 (99 numaralı dipnot)
    alinti: 31/1/2012 tarihli ve 6273 sayılı Kanunun 8 inci maddesiyle, bu maddenin birinci ve ikinci fıkralarında
      yer alan “altı ay” ibareleri “üç yıl” şeklinde değiştirilmiş ve metne işlenmiştir.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'Doğru nedene ve A çeldiricisine md. 814''teki sürelerin 6273 s. Kanunla ''altı ay''dan ''üç yıl''a çıkarıldığı notu, kaynaklara md. 814''ün 99 numaralı dipnotu eklendi; anahtar (C) değişmedi.'
    neden: 'hakem 2026-10-04: G3 kör çözücüsü eski altı aylık süreye dayanarak A seçti (güven 4). Resmî metin (TTK md. 814, dipnot 99) süreyi üç yıl olarak veriyor; ikinci savunulabilir şık yok, kök belirsiz değil. Eski süre tuzağı açıklamada görünür kılındı.'
