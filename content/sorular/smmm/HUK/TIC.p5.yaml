- id: SMMM-HUK-TIC-0004
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: şirket türleri
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: 6102 sayılı Türk Ticaret Kanunu'na göre ticaret şirketlerine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kollektif şirket, ticari bir işletmeyi ortak bir ticaret unvanı altında işletmek üzere, gerçek veya tüzel
      kişiler arasında kurulabilen bir ortaklıktır.
    B: Şirketin komandit olup olmadığı sözleşmeden açıkça saptanamıyorsa, ortaklar tarafından şirkete verilen ad
      ve niteliğe bakılarak şirket komandit sayılır.
    C: Limited şirket tek bir gerçek veya tüzel kişiyle de kurulabilir; ortaklar şirket borçlarından sorumlu olmayıp
      sermaye payını öder, varsa ek ödeme ve yan edimleri yerine getirir.
    D: Komandit şirket, anonim ve limited şirketle birlikte Kanunda sermaye şirketi sayılan ticaret şirketleri arasındadır.
    E: Anonim şirketin pay sahipleri, şirket borçlarından dolayı alacaklılara karşı kişisel malvarlıklarıyla sınırsız
      olarak sorumludur.
  dogru: C
  aciklama:
    dogru_neden: 'md. 573/1''e göre limited şirket bir veya daha çok gerçek veya tüzel kişi tarafından kurulur;
      md. 574/2 ayrıca şirketin bir ortakla kurulduğu hâli düzenler; md. 573/2''ye göre ortaklar şirket borçlarından
      sorumlu olmayıp yalnızca taahhüt ettikleri esas sermaye paylarını ödemek ve şirket sözleşmesinde öngörülen
      ek ödeme ve yan edim yükümlülüklerini yerine getirmekle yükümlüdür.


      Püf noktaları: Her şık ayrı bir maddeye dayanır (md. 124/2, 211/1, 306, 329, 573). Kollektif şirkette ortakların
      gerçek kişi olması şarttır; komandit şirketin türü sözleşme hükümlerine göre belirlenir, ortakların şirkete
      verdiği ad ve nitelik tek başına yeterli değildir ve komandit olduğu açıkça saptanamıyorsa şirket kollektif
      sayılır. Sermaye şirketi sayılanlar arasına yalnız sermayesi paylara bölünmüş komandit şirket girer, adi komandit
      şirket şahıs şirketidir. Limited şirkette ortaklar şirket borçlarından sorumlu değildir; ek ödeme ve yan edim
      şirket alacaklılarına karşı bir sorumluluk değil, şirkete karşı üstlenilen yükümlülüktür; anonim şirkette
      ise pay sahibi yalnızca şirkete karşı ve taahhüt ettiği sermaye payı ile sorumludur. Tuzak: şirket türü ve
      ortak sorumluluğu kavramlarını karıştırmak.'
    celdiriciler:
      A: md. 211/1'e göre kollektif şirket yalnız gerçek kişiler arasında kurulur; tüzel kişi ortak olamaz.
      B: md. 306/2'ye göre şirketin komandit olduğu açıkça saptanamıyorsa şirket komandit değil, kollektif sayılır.
      D: md. 124/2'ye göre kollektif ile komandit şirket şahıs şirketi sayılır; sermaye şirketleri anonim, limited
        ve sermayesi paylara bölünmüş komandit şirkettir.
      E: md. 329/1-2'ye göre anonim şirketin borçlarından dolayı yalnız şirket malvarlığı sorumludur; pay sahipleri
        yalnızca taahhüt ettikleri sermaye payları ile ve şirkete karşı sorumludur.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 124/2
    alinti: (2) Bu Kanunda, kollektif ile komandit şirket şahıs; anonim, limited ve sermayesi paylara bölünmüş komandit
      şirket sermaye şirketi sayılır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 211/1
    alinti: (1) Kollektif şirket ticari bir işletmeyi bir ticaret unvanı altında işletmek amacıyla, gerçek kişiler
      arasında kurulan ve ortaklarından hiçbirinin sorumluluğu şirket alacaklılarına karşı sınırlanmamış olan şirkettir.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 306
    alinti: (1) Şirketin komandit olup olmadığı sözleşme hükümlerine göre belirlenir. Ortaklar tarafından şirkete
      verilen ad ve nitelik o şirketin türünün belirlenmesinde yalnız başına yeterli olmaz. (2) Bir şirketin komandit
      olduğu açıkça saptanamıyorsa o şirket kollektif sayılır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 329/1-2
    alinti: (1) Anonim şirket, sermayesi belirli ve paylara bölünmüş olan, borçlarından dolayı yalnız malvarlığıyla
      sorumlu bulunan şirkettir. (2) Pay sahipleri, sadece taahhüt etmiş oldukları sermaye payları ile ve şirkete
      karşı sorumludur.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 574/2 (son cümle)
    alinti: Aynı yükümlülük, şirketin bir ortakla kurulduğu hâllerde de geçerlidir.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 573/1-2
    alinti: (1) Limited şirket, bir veya daha çok gerçek veya tüzel kişi tarafından bir ticaret unvanı altında kurulur;
      esas sermayesi belirli olup, bu sermaye esas sermaye paylarının toplamından oluşur. (2) Ortaklar, şirket borçlarından
      sorumlu olmayıp, sadece taahhüt ettikleri esas sermaye paylarını ödemekle ve şirket sözleşmesinde öngörülen
      ek ödeme ve yan edim yükümlülüklerini yerine getirmekle yükümlüdürler.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: D şıkkı md. 573/2''ye uygun yazıldı ("ek ödeme ve yan edim yükümlülükleri dışında şirket
      borçlarından sorumlu değildir" → "şirket borçlarından sorumlu olmayıp sermaye payını öder, varsa ek ödeme
      ve yan edimleri yerine getirir"); B şıkkı md. 306/1 ifadesine ("ortaklar tarafından şirkete verilen") getirildi;
      püf noktalarındaki iki ifade düzeltildi; kaynaklara md. 574/2 eklendi; surum 1 → 2.'
    neden: 'G5: eski D, ek ödeme ve yan edimi şirket borçlarından sorumluluğun istisnası gibi sunuyordu; oysa md.
      573/2''ye göre ortaklar şirket borçlarından hiç sorumlu değildir, ek ödeme (md. 603) ve yan edim şirkete karşı
      yükümlülüktür; ayrıca esas sermaye payını ödeme yükümlülüğü atlanmıştı. Püf noktasındaki "ad ve niteliğe değil
      sözleşmeye bakılarak" ifadesi md. 306/1''deki "yalnız başına yeterli olmaz" kaydını mutlaklaştırıyordu.'
