    istem_surumu: uretici paketi HUK-2026-10-05-30
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: B (güven 5) TTK 889/1-2: iki durumda da karine'
      G5:
