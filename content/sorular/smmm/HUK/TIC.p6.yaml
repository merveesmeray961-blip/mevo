- id: SMMM-HUK-TIC-0005
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: kıymetli evrak (ciro)
  tip: uygulama
  zorluk: 2
  kok: Poliçenin lehtarı A, poliçeyi B'ye tam ciroyla devretmiştir. B, poliçenin arkasına yalnız imzasını atarak (beyaz ciro)
    poliçeyi C'ye teslim etmiştir. C, beyaz ciroyu doldurmadan ve poliçeyi yeniden ciro etmeden poliçeyi D'ye teslim eder.
    6102 sayılı TTK'ya göre D'nin durumu nedir?
  secenekler:
    A: Ciro zinciri kesildiğinden yetkili hamil olamaz.
    B: Yalnız alacağın temliki hükümlerine göre hak kazanır.
    C: Beyaz ciroyu doldurmadan teslim alsa da yetkili hamil sayılır.
    D: Poliçe üzerinde C'nin cirosu bulunmadığından poliçe hakları C'de kalır.
    E: Poliçe haklarını ancak B'nin yazılı izniyle kazanır.
  dogru: C
  aciklama:
    dogru_neden: TTK md. 684/2-c'ye göre ciro beyaz ciro ise hamil (C), beyaz ciroyu doldurmaksızın ve poliçeyi tekrar ciro
      etmeksizin poliçeyi başka bir kişiye (D) verebilir. Md. 686/1'e göre poliçeyi elinde bulunduran kişi, son ciro beyaz
      ciro olsa da hakkı müteselsil ve birbirine bağlı cirolardan anlaşıldığı takdirde yetkili hamil sayılır. Poliçede A'nın
      B'ye tam cirosu ve B'nin beyaz cirosu bulunduğundan D yetkili hamildir.
    celdiriciler:
      A: 'Ciro zinciri kesilmemiştir: md. 686/1''e göre son ciro beyaz ciro olsa da hakkı birbirine bağlı cirolardan anlaşılan
        kişi yetkili hamil sayılır; beyaz cirodan sonra teslimle el değiştirme zinciri bozmaz (md. 684/2-c).'
      B: Beyaz ciroyla alınan poliçe md. 684/2-c uyarınca yeniden ciro edilmeksizin teslimle başkasına verilebilir; D'nin
        hakkı ciro ve zilyetliğin geçirilmesine dayanır (md. 684/1), alacağın temliki hükümlerine değil.
      D: Md. 684/2-c beyaz ciroyu doldurmaksızın ve poliçeyi tekrar ciro etmeksizin poliçenin başka bir kişiye verilebileceğini
        öngörür; C'nin cirosunun bulunmaması D'nin yetkili hamilliğine engel değildir.
      E: Beyaz ciroyla poliçeyi alan hamilin onu başkasına vermesi için kanunda B'nin iznine ilişkin bir şart yoktur (md.
        684/2-c).
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı TTK
    madde: md. 684/2-c
    alinti: Beyaz ciroyu doldurmaksızın ve poliçeyi tekrar ciro etmeksizin poliçeyi başka bir kişiye verebilir.
  - mevzuat: 6102 sayılı TTK
    madde: md. 686/1
    alinti: '...kendi hakkı müteselsil ve birbirine bağlı cirolardan anlaşıldığı takdirde, yetkili hamil sayılır.'
  - mevzuat: 6102 sayılı TTK
    madde: md. 684/1
    alinti: Ciro ve zilyetliğin geçirilmesi ile poliçeden doğan bütün haklar devrolunur.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ChatGPT'
    istem_surumu: uretici paketi HUK-2026-10-05-30
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: C (güven 5) TTK 685/1: blanko ciro doldurulmadan teslimle devir mümkün'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Düzeltildikten sonra geçti: md. 684/2-c + 686/1 ile anahtar C tek doğru; A, B, D, E kanuna aykırı. Zorluk 3
          → 2.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 684/1, 684/2-c, 686/1 alıntıları ttk.txt ile birebir; bent atıfları doğru.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (C, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 5
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'Kök yeniden yazıldı: ''B''nin C''ye yaptığı ciro beyaz cirodur'' ifadesi (beyaz ciroda lehtar adı yazılmaz) ciro
      zincirini (A→B tam ciro, B beyaz ciro, C teslim) açıkça veren anlatımla değiştirildi ve soru TTK''ya bağlandı; anahtar
      şık ''hamil olabilir'' → ''yetkili hamil sayılır'' (md. 686/1 terimi); D ve E çeldiricileri somutlaştırıldı; md. 684/1
      kaynağı eklendi; zorluk 3 → 2; surum 1 → 2. Anahtar harfi değişmedi (C).'
    neden: 'G5: ''hamil olabilir'' her zilyet için doğru, ayırt edici olmayan bir ifadeydi; kökteki beyaz ciro anlatımı çelişkiliydi;
      B açıklaması (''ciro yoluyla hak kazanımı mümkündür'') senaryodaki teslimle devri açıklamıyordu.'
- id: SMMM-HUK-TIC-0006
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: kıymetli evrak (ciro; ziya; emre yazılı senet)
  tip: bilgi
  zorluk: 1
  kok: Poliçeyi eline geçiren kişinin kimliği bilinmiyorsa zayi olmuş poliçe bakımından hangi yol istenebilir?
  secenekler:
    A: Poliçeyi eline geçirene karşı iade davası açılması
    B: Poliçenin iptaline karar verilmesi
    C: Poliçenin, ilana gerek olmaksızın kendiliğinden hükümsüz sayılması
    D: Son cironun kendiliğinden hükümsüz sayılması
    E: Yalnız ceza soruşturması
  dogru: B
  aciklama:
    dogru_neden: TTK md. 759/1, poliçeyi eline geçiren kişi bilinmiyorsa poliçenin iptaline karar verilmesinin istenebileceğini
      düzenler.
    celdiriciler:
      A: İade davası, poliçeyi eline geçiren kişinin bilindiği (md. 758/1) veya poliçenin mahkemeye sunulduğu (md. 763/1)
        hâllere ilişkindir; eline geçiren bilinmediğinde kanunun öngördüğü yol iptaldir (md. 759/1).
      C: Poliçe kendiliğinden hükümsüz olmaz; mahkeme ilanla poliçeyi eline geçireni belirli süre içinde getirmeye davet eder
        ve aksi hâlde iptale karar vereceğini ihtar eder (md. 760/1).
      D: Ziya ciroları kendiliğinden hükümsüz kılmaz; eline geçiren bilinmiyorsa istenebilecek yol poliçenin iptalidir (md.
        759/1).
      E: Md. 759/1 hukuki yol olarak poliçenin iptalini düzenler; ceza soruşturması bu hükmün öngördüğü yol değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı TTK
    madde: md. 759/1
    alinti: Poliçeyi eline geçiren kişi bilinmiyorsa, poliçenin iptaline karar verilmesi istenebilir.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ChatGPT'
    istem_surumu: uretici paketi HUK-2026-10-05-30
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: B (güven 5) TTK 757 vd. poliçenin iptali'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Düzeltildikten sonra geçti: md. 759/1 atfı doğru; anahtar B tek doğru (md. 757 ödeme yasağı ikinci doğru olmasın
          diye şıklara konmadı). Zorluk 1 uygun.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 758/1, 759/1, 760/1, 763/1 ttk.txt ile uyumlu; alıntı birebir.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (B, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 11
  - tarih: '2026-10-05'
    kim: hakem
    ne: Kökü okumadan elenen A ('Doğrudan tahsil') ve zayıf C, D şıkları, ziya hükümlerinde karıştırılan seçeneklerle (iade
      davası — md. 758/763; ilansız hükümsüzlük — md. 760; cironun hükümsüzlüğü) değiştirildi; açıklamalar madde atıflarıyla
      yeniden yazıldı; surum 1 → 2. Anahtar değişmedi (B). Muhatabın ödemeden men'i (md. 757) de bu durumda istenebildiğinden
      şık olarak kullanılmadı.
    neden: 'G5: çeldiriciler kökü okumadan elenebiliyordu.'
- id: SMMM-HUK-TIC-0007
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: emre yazılı senet
  tip: uygulama
  zorluk: 2
  kok: İmza edenin yer, zaman ve tutar bakımından belirli bir nakdî ödemeyi borçlandığı, kambiyo senedi niteliği taşımayan
    bir senet açıkça emre yazılıdır. 6102 sayılı TTK'ya göre bu senet bakımından hangisi doğrudur?
  secenekler:
    A: Yalnız noter onaylı devir sözleşmesiyle devredilebilir.
    B: Emre yazılı olsa da ciro ile devredilemez.
    C: Ciro ile devredilebilir.
    D: Yalnız alacağın temliki yoluyla devredilebilir.
    E: Ciro ile devredilir ve kambiyo senetlerindeki başvurma hükümleri kendiliğinden uygulanır.
  dogru: C
  aciklama:
    dogru_neden: TTK md. 831/1'e göre imza edenin yer, zaman ve tutar bakımlarından belirli nakdî ödemelerde bulunmayı borçlandığı
      senetler, açıkça emre yazılı oldukları takdirde ciro ile devredilebilir. Md. 831/3'e göre ise kambiyo senetlerindeki
      başvurmaya ilişkin hükümler, kanunda açık hüküm olmadıkça bu senetler hakkında uygulanmaz.
    celdiriciler:
      A: Md. 831/1 bu senetlerin ciro ile devredilebileceğini öngörür; noter onaylı devir sözleşmesi şartı yoktur.
      B: Md. 831/1'e göre bu senetler açıkça emre yazılı oldukları takdirde ciro ile devredilebilir.
      D: Açıkça emre yazılı senet md. 831/1 uyarınca ciro ile devredilebildiğinden devir alacağın temlikiyle sınırlı değildir.
      E: Md. 831/3'e göre kambiyo senetlerindeki başvurmaya ilişkin hükümler, kanunda açık hüküm olmadıkça bu senetler hakkında
        uygulanmaz; cironun şekli ve hamilin hak sahipliği gibi konularda ise poliçe hükümleri geçerlidir (md. 831/2).
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı TTK
    madde: md. 831/1
    alinti: '...senetler, açıkça emre yazılı oldukları takdirde ciro ile devredilebilirler.'
  - mevzuat: 6102 sayılı TTK
    madde: md. 831/3
    alinti: Kambiyo senetlerindeki başvurmaya ilişkin hükümler kanunda açık hüküm olmadıkça, birinci fıkrada yazılı senetler
      hakkında uygulanmaz.
