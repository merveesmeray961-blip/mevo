      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 16
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'Kök yeniden yazıldı: eski kök ''ciro edilebilir bir senet'' diyerek cevabı (C: ciro ile devredilebilir) veriyordu;
      yeni kök md. 831/1''in unsurlarını (belirli nakdî ödeme, açıkça emre yazılılık, kambiyo senedi olmama) veriyor. Zayıf
      E şıkkı (''düzenleyenin yeni imzası'') md. 831/3''e dayanan şıkla değiştirildi, A, B, D netleştirildi; md. 831/3 kaynağı
      eklendi; zorluk 3 → 2; surum 1 → 2. Anahtar değişmedi (C).'
    neden: 'G5: kök cevabı içeriyordu (totoloji); zorluk 3 gerçekçi değildi.'
- id: SMMM-HUK-TIC-0008
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: taşıma
  tip: uygulama
  zorluk: 2
  kok: Eşyanın hasarı teslimde açıkça görülüyor; teslim anına kadar bildirim yapılmıyor. Başka bir hasar açıkça görülmüyor
    ve teslimden sonra 7 gün içinde de bildirilmiyor. Hangisi doğrudur?
  secenekler:
    A: Her iki durumda istem korunur.
    B: İki durumda da md. 889’daki uygun teslim karinesi uygulanır.
    C: Yalnız açık hasarda karine vardır.
    D: İki durumda da 21 günlük süre vardır.
    E: Açık hasarda 7, gizli hasarda 21 gün vardır.
  dogru: B
  aciklama:
    dogru_neden: TTK md. 889/1'e göre zıya veya hasar açıkça görülüyorsa ve gönderen veya gönderilen en geç teslim anına kadar
      bildirmezse eşyanın sözleşmeye uygun teslim edildiği varsayılır; md. 889/2'ye göre bu karine, açıkça görülmeyen zıya
      veya hasarın teslimden sonra yedi gün içinde bildirilmemesi hâlinde de geçerlidir. Md. 889/3'teki yirmibir günlük süre
      yalnız teslim süresinin aşılmasının (gecikmenin) bildirimine ilişkindir.
    celdiriciler:
      A: Süresinde bildirim yapılmadığından her iki durumda da md. 889/1-2'deki uygun teslim karinesi doğar; istem bu karinenin
        dışında kalmaz.
      C: Md. 889/2, açıkça görülmeyen zıya veya hasarın teslimden sonra yedi gün içinde bildirilmemesi hâlinde de aynı karinenin
        geçerli olduğunu öngörür.
      D: Md. 889/3'teki yirmibir günlük süre yalnız teslim süresinin aşıldığının bildirimine ilişkindir; zıya ve hasar için
        teslim anı ve yedi gün kuralları uygulanır.
      E: Açıkça görülen zıya veya hasar en geç teslim anına kadar bildirilmelidir (md. 889/1); yirmibir gün gecikme bildirimine
        ilişkindir (md. 889/3).
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı TTK
    madde: md. 889/1-3
    alinti: '...en geç teslim anına kadar zıyaı veya hasarı bildirmezlerse, eşyanın sözleşmeye uygun olarak teslim edildiği
      varsayılır. ... tesliminden sonra yedi gün içinde bildirilmemesi hâlinde de geçerlidir. ... teslim süresinin aşıldığını,
      teslimden itibaren yirmibir gün içinde bildirmezse, gecikmeden kaynaklanan hakları sona erer.'
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
