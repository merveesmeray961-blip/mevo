        not: md. 889/1-3 alıntısı ttk.txt ile uyumlu; açıklamaların hepsinin karşılığı var.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday yanlış (C, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
  gecmis:
  - tarih: '2026-10-05'
    kim: uretici
    ne: harici teslim teslim_chatgpt.yaml, satır 21
  - tarih: '2026-10-05'
    kim: hakem
    ne: Çeldirici açıklamaları fıkra atıflarıyla yeniden yazıldı (A'daki 'kanuni sonucu vardır' ve D'deki '21 gün gecikme
      içindir' gibi gerekçesiz cümleler md. 889/1-3'e bağlandı); dogru_neden'de bildirimin gönderen veya gönderilen tarafından
      yapılacağı eklendi; zorluk 3 → 2. Kök, şıklar ve anahtar değişmedi (B).
    neden: 'G5/G6: açıklamalar fıkra belirtmiyordu; zorluk tek maddenin üç fıkrasının ezberi.'
- id: SMMM-HUK-TIC-0009
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: haksız rekabet
  tip: bilgi
  zorluk: 2
  kok: Aşağıdakilerden hangisi TTK md. 55’te haksız rekabet hâllerinin başlıcalarından biridir?
  secenekler:
    A: Başkasının malları veya iş ürünleriyle karıştırılmaya yol açan önlemler almak
    B: Mallarını, rakiplerinden daha düşük ancak tedarik fiyatının üzerinde bir fiyatla satmak
    C: Kendisi ve malları hakkında gerçeğe uygun ve yanıltıcı olmayan açıklamalar yapmak
    D: Rakibin işçisini, sözleşmesine aykırı davranmaya yöneltmeden, kendi başvurusu üzerine işe almak
    E: Kendi işçilerinden iş sırlarını korumalarını sözleşmeyle istemek
  dogru: A
  aciklama:
    dogru_neden: TTK md. 55/1-a-4, başkasının malları, iş ürünleri, faaliyetleri veya işleri ile karıştırılmaya yol açan önlemler
