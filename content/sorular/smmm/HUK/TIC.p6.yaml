      yedi gün içinde bildirimsizlikte uygun teslim karinesi öngörür. 21 gün gecikme bildirimine ilişkindir.
    celdiriciler:
      A: Bildirim yapılmamasının kanuni sonucu vardır.
      C: Gizli hasar için yedi günlük kural vardır.
