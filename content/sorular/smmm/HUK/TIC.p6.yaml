  secenekler:
    A: Yetkili hamil olamaz.
    B: Yalnız temlik hükümlerine göre hak kazanır.
    C: Beyaz ciroyu doldurmadan senedi teslim alarak hamil olabilir.
    D: Cirosu geçersizdir.
    E: B’nin yazılı izni gerekir.
