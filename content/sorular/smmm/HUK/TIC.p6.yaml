    celdiriciler:
      A: Beyaz ciroda bu zorunluluk yoktur.
      B: Ciro yoluyla hak kazanımı mümkündür.
      D: Beyaz ciro geçersizlik nedeni değildir.
      E: B’nin ek izni aranmaz.
