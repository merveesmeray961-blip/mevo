  kazanim: kıymetli evrak (ciro; ziya; emre yazılı senet)
  tip: uygulama
  zorluk: 3
  kok: Bir emre yazılı senet, kıymetli evrakın devrine ilişkin genel kurala göre devredilmek istenmektedir. Senet üzerindeki
    zilyetlik alıcıya geçirilmiş, ancak ciro yapılmamıştır. 6102 sayılı Türk Ticaret Kanunu'na göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Devir tamamlanmıştır; ciro hiçbir durumda aranmaz.
    B: Yalnızca noter onayı gerekir.
    C: Ciro ve zilyetliğin geçirilmesi gerekir.
    D: Sadece yazılı devir beyanı yeterlidir.
    E: Senet mutlaka hamile yazılı senede dönüştürülmelidir.
  dogru: C
  aciklama:
    dogru_neden: 'TTK md. 647/2 uyarınca emre yazılı senetlerde ciroya, nama yazılı senetlerde ise yazılı devir beyanına gerek
      vardır; somut olayda emre yazılı senet söz konusu olduğundan zilyetliğin geçirilmesine ek olarak ciro gerekir. Püf noktaları:
      Nama ve emre yazılı senetlerin devir şekilleri birbirine karıştırılmamalıdır.'
    celdiriciler:
      A: Emre yazılı senet için ciro gerektiğinden tek başına zilyetlik yeterli değildir.
      B: Kanunda noter onayı öngörülmemiştir.
      D: Yazılı devir beyanı nama yazılı senetler için öngörülmüştür.
      E: Senedin hamile yazılı senede dönüştürülmesi devir için zorunlu değildir.
