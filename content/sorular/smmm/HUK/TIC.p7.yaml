- id: SMMM-HUK-TIC-0012
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: elektronik işlemler
  tip: uygulama
  zorluk: 2
  kok: 'Tacir (T), bir poliçe düzenlemek istemektedir. Güvenli elektronik imza kullanarak poliçeyi elektronik ortamda düzenleyip
    ciro etmek istemektedir.


    6102 sayılı Türk Ticaret Kanunu’na göre bu işlem hakkında aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Poliçe, bono ve çek güvenli elektronik imza ile düzenlenebilir.
    B: Poliçe, bono, çek, makbuz senedi, varant ve kambiyo senetlerine benzeyen senetler güvenli elektronik imza ile düzenlenemez;
      ciro da yapılamaz.
    C: Yalnızca ciro güvenli elektronik imza ile yapılabilir; düzenleme yapılamaz.
    D: Tüm kıymetli evrak elektronik imza ile düzenlenebilir.
    E: Poliçe elektronik imza ile düzenlenebilir ancak ciro edilemez.
  dogru: B
  aciklama:
    dogru_neden: 'TTK md. 1526/1’e göre poliçe, bono, çek, makbuz senedi, varant ve kambiyo senetlerine benzeyen senetler
      güvenli elektronik imza ile düzenlenemez. Bu senetlere ilişkin kabul, aval ve ciro gibi senet üzerinde gerçekleştirilen
      işlemler güvenli elektronik imza ile yapılamaz.

      Püf noktaları: Kambiyo senetleri için elektronik imza yasağı açıktır; diğer senetler (konişmento vb.) için istisnalar
      vardır.

      '
    celdiriciler:
      A: Md. 1526/1 açıkça poliçe, bono ve çeki elektronik imza yasağı kapsamına alır.
      C: Hem düzenleme hem ciro yasaktır.
      D: Kambiyo senetleri için özel yasak vardır; tüm kıymetli evrak serbest değildir.
      E: Hem düzenleme hem ciro yasaktır.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1526/1
    alinti: Poliçe, bono, çek, makbuz senedi, varant ve kambiyo senetlerine benzeyen senetler güvenli elektronik imza ile
