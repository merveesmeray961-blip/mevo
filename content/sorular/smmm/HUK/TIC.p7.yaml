- id: SMMM-HUK-TIC-0010
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: emre yazılı senet
  tip: uygulama
  zorluk: 3
  kok: 'Tacir (T), 10.01.2026 tarihinde (L) lehine 250.000 TL bedelli bir bono düzenlemiştir. Senette “bono” kelimesi, kayıtsız
    şartsız ödeme vaadi, vade, ödeme yeri, lehdarın adı, düzenlenme tarihi ve yeri ile düzenleyenin imzası yer almaktadır.
    Ancak senette düzenlenme yeri olarak sadece “İstanbul” yazılmış, ödeme yeri ayrıca gösterilmemiştir.


    6102 sayılı Türk Ticaret Kanunu’na göre bu senedin hukuki niteliği aşağıdakilerden hangisidir?

    '
  secenekler:
    A: Bono sayılmaz, çünkü ödeme yeri gösterilmemiştir.
    B: Görüldüğünde ödenmesi şart olan bir bono sayılır.
    C: Ödeme yeri, düzenlendiği yer olan İstanbul’dur ve bono geçerlidir.
    D: Nama yazılı senet sayılır.
    E: Poliçe sayılır, çünkü ödeme yeri eksiktir.
  dogru: C
  aciklama:
    dogru_neden: 'TTK md. 776 bononun unsurlarını sayar; md. 777/3’e göre açıklık bulunmadığı takdirde senedin düzenlendiği
      yer, ödeme yeri ve aynı zamanda düzenleyenin yerleşim yeri sayılır. Bu nedenle ödeme yeri gösterilmemiş olsa da düzenlenme
      yeri (İstanbul) ödeme yeri kabul edilir ve senet bono niteliğini korur.

      Püf noktaları: Vade eksikliği görüldüğünde ödeme kabul edilir (md. 777/2); ödeme yeri eksikliği ise düzenlenme yerine
      bağlanır. Unsur eksikliklerinin sonuçları farklıdır.

      '
    celdiriciler:
      A: Ödeme yeri eksikliği, md. 777/3 uyarınca senetin bono sayılmasını engellemez; düzenlenme yeri ödeme yeri sayılır.
      B: Görüldüğünde ödeme, vade gösterilmemişse uygulanır (md. 777/2); ödeme yeri eksikliğinde bu hüküm uygulanmaz.
      D: Senet emre yazılı unsurları taşıdığı için nama yazılı senet değildir.
      E: Poliçe ayrı bir kıymetli evrak türüdür; bono düzenleyenin ödeme vaadini içerir.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 776/1
    alinti: Bono veya emre yazılı senet; a) Senet metninde “bono” veya “emre yazılı senet” kelimesini ve senet Türkçe’den
      başka bir dille yazılmışsa, o dilde bono veya emre yazılı senet karşılığı olarak kullanılan kelimeyi, b) Kayıtsız ve
      şartsız belirli bir bedeli ödemek vaadini, c) Vadeyi, d) Ödeme yerini, e) Kime veya kimin emrine ödenecek ise onun adını,
      f) Düzenlenme tarihini ve yerini, g) Düzenleyenin imzasını, içerir.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 777/3
    alinti: Açıklık bulunmadığı takdirde senedin düzenlendiği yer, ödeme yeri ve aynı zamanda düzenleyenin yerleşim yeri sayılır.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kaynaklı kör çözücü: anahtarla aynı (güven 5). TTK 777: düzenleme yeri ödeme yeri sayılır'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
