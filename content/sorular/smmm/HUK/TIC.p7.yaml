- id: SMMM-HUK-TIC-0011
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: haksız rekabet
  tip: uygulama
  zorluk: 2
  kok: 'Tacir (T), rakip tacir (R)’nin mallarını ve fiyatlarını gerçek dışı ve yanıltıcı açıklamalarla kötüleyen reklamlar
    yayımlatmıştır. (R), bu durumun haksız rekabet oluşturduğunu ileri sürmektedir.


    6102 sayılı Türk Ticaret Kanunu’na göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Bu davranış haksız rekabet sayılmaz; çünkü yalnızca reklamdır.
    B: Bu davranış dürüstlük kuralına aykırı reklam olarak haksız rekabet hâllerindendir.
    C: Haksız rekabet yalnızca sözleşmeye aykırılık hâllerinde doğar.
    D: Yalnızca fiyat karşılaştırması haksız rekabet sayılır.
    E: Bu davranış yalnızca ceza hukuku bakımından sorumluluk doğurur.
  dogru: B
  aciklama:
    dogru_neden: 'TTK md. 54/2’ye göre rakipler arasındaki ilişkileri etkileyen aldatıcı veya dürüstlük kuralına aykırı davranışlar
      haksız ve hukuka aykırıdır. Md. 55/1-a-1’e göre başkalarını veya onların mallarını, fiyatlarını yanlış, yanıltıcı veya
      gereksiz yere incitici açıklamalarla kötülemek haksız rekabet hâllerinin başlıcalarındandır.

      '
    celdiriciler:
      A: Reklam da dürüstlük kuralına aykırıysa haksız rekabet oluşturur (md. 55/1-a).
      C: Haksız rekabet, sözleşmeye aykırılık dışında da dürüstlük kuralına aykırı davranışlarla doğar.
      D: Kötüleme, gerçek dışı açıklama gibi birçok hâl sayılmıştır; yalnız fiyat karşılaştırması değildir.
      E: Haksız rekabet hukuki sonuçlar (men, tazminat vb.) doğurur; ceza sorumluluğu ayrıdır.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 54/2
    alinti: Rakipler arasında veya tedarik edenlerle müşteriler arasındaki ilişkileri etkileyen aldatıcı veya dürüstlük kuralına
      diğer şekillerdeki aykırı davranışlar ile ticari uygulamalar haksız ve hukuka aykırıdır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 55/1-a-1
    alinti: Başkalarını veya onların mallarını, iş ürünlerini, fiyatlarını, faaliyetlerini veya ticari işlerini yanlış, yanıltıcı
