- id: SMMM-HUK-TIC-0029
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: taşıma
  tip: kavrama
  zorluk: 2
  kok: 6102 sayılı Türk Ticaret Kanununda taşıma işlerine ilişkin aşağıdaki karşılaştırmalardan hangisi doğrudur?
  secenekler:
    A: Taşıma işini arızi olarak üstlenen kişi hiçbir durumda taşıma hükümlerine tabi değildir.
    B: Taşıyıcının kanuni sorumluluğunu önceden kaldıran bir hüküm, yalnızca genel işlem şartlarında yer alıyorsa geçerlidir.
    C: Taşıyıcı ve taşıma işleri komisyoncusu, taşıma işini özel hükümlere tabi bir kuruluşa gördürse bile kanunun yüklediği
      sorumluluğun hafifletilmesini veya kaldırılmasını isteyemez.
    D: Taşıma sözleşmesinde sorumluluğun önceden kaldırılması, bilet veya tarifede yazılıysa geçerlidir.
    E: Deniz, demir ve hava yoluyla taşıma ile posta idaresine ilişkin özel hükümler hiçbir zaman saklı tutulmaz.
  dogru: C
  aciklama:
    dogru_neden: TTK md. 851 arızi taşıyıcıya da uygun düştüğü ölçüde taşıma hükümlerini uygular; md. 853 ise özel hükümlere
      tabi kuruluşun kullanılmasının sorumluluğu hafifletme veya kaldırma sonucu doğurmasına izin vermez; md. 854 de önceden
      sorumluluk kaldıran/hafifleten hükümlerin geçersizliğini düzenler.
    celdiriciler:
      A: Md. 851 arızi taşıyıcıyı da kapsamaktadır.
      B: Md. 854, genel işlem şartları dahil çeşitli belgelerdeki önceden sorumluluk sınırlamalarını geçersiz kılar.
      D: Bilet ve tarifedeki önceden sorumluluk kaldırmaları da geçersizdir.
      E: Md. 852 özel hükümleri saklı tutar.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 851-853
    alinti: "       B) Hükümlerin uygulama alanı\n       MADDE 851- (1) Eşya ve yolcu taşımayı arizi olarak üstlenen kişi\
      \ hakkında da bu\nKitap hükümleri, uygun düştükleri ölçüde, uygulanır.\n\n      C) Saklı tutulan hükümler\n      I-\
      \ Kural\n      MADDE 852- (1) Deniz, demir ve hava yoluyla taşıma ile posta idaresine ilişkin özel\nhükümler saklıdır."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 853
    alinti: "       II- Özel hükümlerin sorumluluğu etkilememesi\n       MADDE 853- (1) Taşıyıcı ve taşıma işleri komisyoncusu,\
      \ taşıma işini 852 nci\nmaddede öngörülen özel hükümlere bağlı bulunan bir kuruluşa gördürdükleri takdirde de\nKanunun\
      \ kendilerine yüklediği sorumluluğun hafifletilmesini veya kaldırılmasını\nisteyemezler. Değişik tür araçlar ile taşımaya\
      \ ilişkin Dördüncü Kısım hükümleri saklıdır."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 854
    alinti: "       D) Sorumluluğun kaldırılmasına veya hafifletilmesine ait hükümlerin geçersizliği\n       MADDE 854- (1)\
      \ Kanunun, taşıyıcıya, taşıma işleri komisyoncusuna ve faaliyetleri\nDevlet iznine bağlı taşıma işletmelerine yüklediği\
      \ sorumlulukların, önceden hafifletilmesi\nveya kaldırılması sonucunu doğuran tüm sözleşme hükümleri geçersizdir. Bu\
      \ hükümlerin,\nişletme tüzüklerinde, genel işlem şartlarında, biletlerde, tarifelerde veya benzer diğer\nbelgelerde\
      \ öngörülmüş olmaları hâlinde de hüküm aynıdır."
