    hâlinde devredilebilir.

    II. Devir sözleşmesinin yazılı yapılması ve ticaret siciline tescil ve ilan edilmesi gerekir.

    III. Aksi öngörülmemişse devir sözleşmesinin duran malvarlığı, işletme değeri, kiracılık hakkı, ticaret unvanı ve diğer
    fikrî mülkiyet haklarını içermesi kabul edilir.'
