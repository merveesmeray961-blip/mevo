    İkinci modelde ortaklardan birinin sorumluluğu sınırlanmamış, diğer ortakların sorumluluğu belirli sermaye ile sınırlandırılmıştır.
    6102 sayılı Türk Ticaret Kanunu'na göre bu iki model sırasıyla hangi şirket türlerini ifade eder?
  secenekler:
    A: Anonim şirket – limited şirket
    B: Limited şirket – kollektif şirket
    C: Kollektif şirket – komandit şirket
    D: Komandit şirket – anonim şirket
    E: Kooperatif – komandit şirket
  dogru: C
  aciklama:
    dogru_neden: 'TTK md. 211''e göre ortaklarının hiçbirinin sorumluluğu şirket alacaklılarına karşı sınırlanmamış olan şirket
      kollektif şirkettir. Md. 304''e göre ortaklardan bir veya birkaçının sorumluluğu sınırlanmamış, diğer ortakların sorumluluğu
      belirli sermaye ile sınırlandırılmışsa şirket komandittir. Püf noktaları: Ayrım, ortakların şirkete koyduğu sermayeden
      çok şirket alacaklılarına karşı sorumluluğun niteliğine göre yapılır.'
    celdiriciler:
      A: Anonim ve limited şirketlerde ortakların sorumluluk yapısı bu iki modele uymaz.
      B: İlk model md. 211 anlamında kollektif, ikinci model md. 304 anlamında komandittir.
