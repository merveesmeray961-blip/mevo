- id: SMMM-HUK-TIC-0031
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: elektronik işlemler
  tip: kavrama
  zorluk: 3
  kok: 'TTK md. 1527''deki elektronik katılım düzenlemeleri bakımından aşağıdaki eşleştirmelerden hangisi doğrudur?

    I. Sermaye şirketlerinde yönetim kurulu/müdürler kurulu toplantısının tamamen elektronik yapılabilmesi — şirket sözleşmesi/esas
    sözleşmede düzenlenme.

    II. Kollektif, komandit, limited ve sermayesi paylara bölünmüş şirketlerde elektronik ortaklar kurulu/genel kurula katılım
    — şirket sözleşmesi/esas sözleşmede öngörülme.

    III. Elektronik oy kullanma — özgülenmiş internet sitesi, teknik rapor ve kimliklerin saklanması gibi şartlar.

    IV. Borsaya kote edilmiş anonim şirketlerde genel kurula elektronik katılım ve oy kullanma — yönetmelik yürürlüğe girdiğinde
    zorunluluk.'
  secenekler:
    A: Yalnız I ve II
    B: I, II ve III
    C: II, III ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: E
  aciklama:
    dogru_neden: 'Md. 1527''nin 1-5. fıkraları dört önermenin de dayanağıdır. Püf noktaları: Elektronik yönetim kurulu toplantısı
      ile elektronik ortaklar kurulu/genel kurul katılımı farklı fıkralarda düzenlenmiş; ayrıca elektronik oy için teknik
      ve kimlik şartları aranmış ve kote şirketlerde zorunluluk ayrıca belirtilmiştir.'
    celdiriciler:
      A: III ve IV de doğrudur.
      B: IV de doğrudur.
      C: I de doğrudur.
      D: II de doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1527/1
    alinti: '         MADDE 1527- (1) Şirket sözleşmesinde veya esas sözleşmede düzenlenmiş olması

      şartıyla, sermaye şirketlerinde yönetim kurulu ve müdürler kurulu tamamen elektronik

      ortamda yapılabileceği gibi, bazı üyelerin fiziken mevcut bulundukları bir toplantıya bir kısım

      üyelerin elektronik ortamda katılması yoluyla da icra edilebilir. Bu hâllerde Kanunda veya

      şirket sözleşmesinde ve esas sözleşmede öngörülen toplantı ile karar nisaplarına ilişkin

      hükümler aynen uygulanır.'
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1527/2
    alinti: '         (2) Kollektif, komandit, limited ve sermayesi paylara bölünmüş şirketlerde, şirket

      sözleşmesinde ve esas sözleşmede öngörülerek elektronik ortamda ortaklar kuruluna ve genel

      kurula katılma, öneride bulunma ve oy verme, fizikî katılımın, öneride bulunmanın ve oy

      vermenin bütün hukuki sonuçlarını doğurur.'
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1527/3
