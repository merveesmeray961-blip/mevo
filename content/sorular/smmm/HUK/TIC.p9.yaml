- id: SMMM-HUK-TIC-0072
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: elektronik işlemler
  tip: uygulama
  zorluk: 2
  kok: 'Bir anonim şirket ile bir tedarikçi, aralarındaki ticari ilişkide ihbar, itiraz ve teyit mektuplarının elektronik
    ortamda gönderilmesi konusunda açıkça anlaşmıştır. Tedarikçi, düzenlediği faturayı ve sözleşme görüşmesini doğrulayan
    teyit mektubunu elektronik ortamda şirkete göndermiş; şirket de teyit mektubuna süresi içinde itiraz etmemiştir.


    Bu olayda aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Açık anlaşma bulunsa bile elektronik ortamda gönderilen teyit mektubu hiçbir şekilde hukuki sonuç doğurmaz.
    B: Elektronik ortam yalnızca genel kurul ve yönetim kurulu toplantıları için kullanılabilir; fatura ve teyit mektubu için
      kullanılamaz.
    C: Elektronik gönderme ancak güvenli elektronik imza ile yapılmışsa geçerli olur; tarafların açık anlaşması ayrıca önem
      taşımaz.
    D: Tarafların açıkça anlaşması hâlinde, TTK md. 1525 kapsamındaki beyanlar ve teyit mektupları elektronik ortamda düzenlenebilir,
      gönderilebilir ve kabul edilmişse hüküm ifade eder.
    E: Elektronik ortamda yapılan gönderme, karşı tarafın itiraz etmemesi hâlinde dahi hiçbir zaman kabul edilmiş sayılmaz.
  dogru: D
  aciklama:
    dogru_neden: TTK md. 1525/1, tarafların açıkça anlaşmaları ve md. 18/3 saklı kalmak şartıyla ihbar, ihtar, itiraz, fatura
      ve teyit mektubu gibi belirtilen işlemlerin elektronik ortamda düzenlenebileceğini ve kabul edilmişse hüküm ifade edeceğini
      düzenler. Olaydaki açık anlaşma bu şartı karşılamaktadır.
    celdiriciler:
      A: Md. 1525/1 elektronik ortamda düzenleme ve gönderme imkânını açıkça kabul eder.
