      \ üzerindeki zilyetliğin devri şarttır.\n       (2) Bundan başka emre yazılı senetlerde ciroya, nama yazılı senetlerde\
      \ yazılı bir devir\nbeyanına da gerek vardır. Bu beyan kıymetli evrakın veya ayrı bir kâğıdın üzerine yazılabilir.\n\
      \       (3) Kanun veya sözleşme ile başkalarının, bu arada, özellikle borçlunun da devre\nkatılmaları zorunluluğu öngörülebilir.\n\
      \n           II - Ciro\n           1. Şekil"
