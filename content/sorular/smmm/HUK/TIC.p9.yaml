- id: SMMM-HUK-TIC-0045
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: elektronik işlemler
  tip: uygulama
  zorluk: 3
  kok: 'Bir anonim şirketin yönetim kurulu, kanunun zorunlu tuttuğu üç işlemi elektronik ortamda gerçekleştirecektir. Şirket
    adına imza yetkisi bulunan Deniz, işlemleri kendi adına düzenlenmiş güvenli elektronik sertifikasıyla imzalamaktadır.
    Buna göre;

    I. Poliçenin güvenli elektronik imza ile düzenlenmesi ve ciro edilmesi mümkündür.

    II. Kanunun zorunlu tuttuğu şirket işlemleri, güvenli elektronik imza ile elektronik ortamda yapılabilir.

    III. Şirket adına imza yetkisi bulunan kişinin sertifikasında kendi adıyla birlikte temsil ettiği tüzel kişinin adı da
    yer alabilir.

    6102 sayılı Türk Ticaret Kanunu''na göre yukarıdakilerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'TTK md. 1526/1 poliçe gibi kambiyo senetlerinin güvenli elektronik imza ile düzenlenmesini ve bunlara ilişkin
      kabul, aval ve ciro işlemlerini yasaklar; bu nedenle I yanlıştır. Md. 1526/3 zorunlu şirket işlemlerinin güvenli elektronik
      imza ile yapılmasına izin verir. Md. 1526/4 ise şirket adına imza yetkilisinin kendi adına üretilen güvenli elektronik
      imzayı şirket namına kullanabilmesini ve sertifikada temsil edilen tüzel kişinin adının da bulunmasını düzenler. Püf
      noktaları: Genel elektronik işlem kuralı ile kambiyo senetlerine özgü yasak aynı maddede birlikte yer alır.'
    celdiriciler:
      A: I yanlış olduğu gibi II ve III doğru olduğundan yalnız I seçeneği doğru bileşimi vermez.
      B: II doğru olmakla birlikte III de doğrudur; şirket adına imza yetkilisinin sertifikasında tüzel kişinin adı bulunabilir.
      C: I doğru değildir; ayrıca III de doğru olduğundan I ve II bileşimi yanlıştır.
      E: I yanlıştır; kambiyo senetleri bakımından elektronik imza yasağı devam eder.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1526/1
    alinti: Poliçe, bono, çek, makbuz senedi, varant ve kambiyo senetlerine benzeyen senetler güvenli elektronik imza ile
      düzenlenemez. Bu senetlere ilişkin kabul, aval ve ciro gibi senet üzerinde gerçekleştirilen işlemler güvenli elektronik
      imza ile yapılamaz.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 1526/3
    alinti: Ticaret şirketleri ile gerçek ve tüzel kişi diğer tacirlere ilişkin olarak, bu Kanunun zorunlu tuttuğu bütün işlemler
      elektronik ortamda güvenli elektronik imza ile de yapılabilir.
