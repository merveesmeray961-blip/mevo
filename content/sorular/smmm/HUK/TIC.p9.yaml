  konu: TIC
  kazanim: kıymetli evrak (ciro; ziya; emre yazılı senet)
  tip: kavrama
  zorluk: 2
  kok: 'Emre yazılı bir senet hamiline yazılı senede dönüştürülmek istenmektedir. Senet üzerindeki hak ve borç sahibi kişilerin
    tamamının muvafakati alınmış ve muvafakat doğrudan senet üzerine yazılmıştır. Ayrıca başka bir emre yazılı senet ciro
    edilerek devredilecektir. 6102 sayılı Türk Ticaret Kanunu''na göre;

    I. Emre yazılı senedin hamiline yazılı senede dönüştürülmesi için gerekli tüm hak ve borç sahiplerinin muvafakati aranır.

    II. Bu muvafakatin doğrudan senet üzerine yazılması gerekir.

    III. Emre yazılı senedin olağan devrinde ciro ile birlikte senedin zilyetliğinin geçirilmesi gerekir.

    ifadelerinden hangileri doğrudur?'
