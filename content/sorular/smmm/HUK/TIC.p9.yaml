    dogru_neden: 'TTK md. 650/1, emre yazılı senedin hamiline yazılı senede dönüştürülmesi için kendisine hak verilen ve borç
      yüklenen tüm kişilerin muvafakatini ve bu muvafakatin doğrudan senet üzerine yazılmasını arar. Md. 647/2 ve 648/2 ise
      emre yazılı senedin devrinde ciro ve zilyetliğin geçirilmesini öngörür. Bu nedenle üç öncül de doğrudur. Püf noktaları:
      Tür değiştirme ile olağan ciro yoluyla devir aynı işlem değildir; tür değiştirmede tüm ilgili kişilerin muvafakati ayrıca
      aranır.'
