- id: SMMM-HUK-TIC-0030
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: haksız rekabet
  tip: kavrama
  zorluk: 2
  kok: Aşağıdaki fiiller ile TTK md. 55'teki haksız rekabet hâlleri eşleştirilecektir. I. Rakibin fiyatlarını yanlış ve yanıltıcı
    açıklamalarla kötülemek. II. Kendisine emanet edilmiş planı yetkisiz kullanmak. III. Üretim sırrını hukuka aykırı ifşa
    etmek. IV. Dürüstlük kuralına aykırı genel işlem şartı kullanmak. Doğru eşleştirme hangisidir?
  secenekler:
    A: I-a/1, II-c/1, III-d, IV-f
    B: I-b/1, II-a/1, III-c/1, IV-d
    C: I-a/4, II-c/3, III-e, IV-b/1
    D: I-f/1, II-d, III-a/2, IV-c/1
    E: I-c/2, II-f/2, III-b/3, IV-a/9
  dogru: A
  aciklama:
    dogru_neden: Md. 55/1-(a)-1 rakibi kötülemeyi; (c)-1 emanet edilen iş ürününden yetkisiz yararlanmayı; (d) üretim ve iş
      sırlarının hukuka aykırı ifşasını; (f) dürüstlük kuralına aykırı işlem şartlarını düzenler.
    celdiriciler:
      B: Fiillerin md. 55 bentleri sistematik olarak kaydırılmıştır.
      C: Planın yetkisiz kullanımı c/1'dir; burada farklı eşleştirilmiştir.
      D: Sır ifşası d bendindedir; a/2 değildir.
      E: Kötüleme a/1'dir; c/2 değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 55/1-(a)
    alinti: "       MADDE 55- (1) Aşağıda sayılan hâller haksız rekabet hâllerinin başlıcalarıdır:\n       a) Dürüstlük kuralına\
      \ aykırı reklamlar ve satış yöntemleri ile diğer hukuka aykırı\ndavranışlar ve özellikle;\n       1. Başkalarını veya\
      \ onların mallarını, iş ürünlerini, fiyatlarını, faaliyetlerini veya ticari\nişlerini yanlış, yanıltıcı veya gereksiz\
      \ yere incitici açıklamalarla kötülemek,\n       2. Kendisi, ticari işletmesi, işletme işaretleri, malları, iş ürünleri,\
      \ faaliyetleri, fiyatları,\nstokları, satış kampanyalarının biçimi ve iş ilişkileri hakkında gerçek dışı veya yanıltıcı\n"
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 55/1-(c)
    alinti: "        c) Başkalarının iş ürünlerinden yetkisiz yararlanma; özellikle;\n        1. Kendisine emanet edilmiş\
      \ teklif, hesap veya plan gibi bir iş ürününden yetkisiz\nyararlanmak,\n        2. Üçüncü kişilere ait teklif, hesap\
      \ veya plan gibi bir iş ürününden, bunların kendisine\nyetkisiz olarak tevdi edilmiş veya sağlanmış olduğunun bilinmesi\
      \ gerektiği hâlde, yararlanmak,\n        3. Kendisinin uygun bir katkısı olmaksızın başkasına ait pazarlanmaya hazır\
      \ çalışma\nürünlerini teknik çoğaltma yöntemleriyle devralıp onlardan yararlanmak."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 55/1-(d)
    alinti: '        d) Üretim ve iş sırlarını hukuka aykırı olarak ifşa etmek; özellikle, gizlice ve izinsiz

      olarak ele geçirdiği veya başkaca hukuka aykırı bir şekilde öğrendiği bilgileri ve üretenin iş

      sırlarını değerlendiren veya başkalarına bildiren dürüstlüğe aykırı davranmış olur.'
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 55/1-(f)
    alinti: "        f) Dürüstlük kuralına aykırı işlem şartları kullanmak. Özellikle yanıltıcı bir şekilde\ndiğer taraf aleyhine;\n\
      \        1. Doğrudan veya yorum yoluyla uygulanacak kanuni düzenlemeden önemli ölçüde\nayrılan, veya\n        2. Sözleşmenin\
      \ niteliğine önemli ölçüde aykırı haklar ve borçlar dağılımını öngören,\nönceden yazılmış genel işlem şartlarını kullananlar\
      \ dürüstlüğe aykırı davranmış olur."
