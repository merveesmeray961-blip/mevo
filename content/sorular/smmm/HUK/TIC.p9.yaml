- id: SMMM-HUK-TIC-0028
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: şirket türleri
  tip: kavrama
  zorluk: 3
  kok: 6102 sayılı Türk Ticaret Kanununa göre aşağıdaki şirket türü–ortaklık sorumluluğu eşleştirmelerinden hangisi doğrudur?
  secenekler:
    A: Kollektif şirket — ortakların sorumluluğu şirket alacaklılarına karşı sınırlıdır.
    B: Komandit şirket — komandite ortaklar tüzel kişi olabilir; komanditer ortaklar yalnız gerçek kişi olabilir.
    C: Anonim şirket — şirket borçlarından dolayı yalnız pay sahiplerinin kişisel malvarlığı sorumludur.
    D: Limited şirket — ortak sayısı elliyi aşabilir ve ortaklar şirket borçlarından sınırsız sorumludur.
    E: Komandit şirket — sorumluluğu sınırlı olmayan ortak komandite, sorumluluğu sınırlı olan ortak komanditerdir; komandite
      ortak gerçek kişi olmalıdır.
  dogru: E
  aciklama:
    dogru_neden: 'Komandit şirkette sorumluluğu sınırlı olmayan ortak komandite, sınırlı olan komanditerdir; komandite ortakların
      gerçek kişi olması gerekir. Püf noktaları: Şirket türü ile ortak sorumluluğunu birlikte değerlendirmek gerekir; anonim
      ve limited şirketlerdeki sınırlı sorumluluk kuralı kollektif ve komandite ortaklara aynen taşınamaz.'
    celdiriciler:
      A: Kollektif şirkette hiçbir ortağın sorumluluğu alacaklılara karşı sınırlı değildir.
      B: Tüzel kişiler komanditer olabilir; komandite ortak gerçek kişi olmalıdır.
      C: Anonim şirkette borçlardan şirket malvarlığı sorumludur; pay sahiplerinin sorumluluğu taahhüt ettikleri sermaye payı
        ile sınırlıdır.
      D: Limited şirkette ortak sayısı elliyi aşamaz ve ortaklar şirket borçlarından kural olarak sorumlu değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 211
    alinti: '       MADDE 211- (1) Kollektif şirket ticari bir işletmeyi bir ticaret unvanı altında

      işletmek amacıyla, gerçek kişiler arasında kurulan ve ortaklarından hiçbirinin sorumluluğu

      şirket alacaklılarına karşı sınırlanmamış olan şirkettir.'
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 304
    alinti: "         MADDE 304- (1) Ticari bir işletmeyi bir ticaret unvanı altında işletmek amacıyla kurulan,\nşirket alacaklılarına\
      \ karşı ortaklardan bir veya birkaçının sorumluluğu sınırlandırılmamış ve diğer\nortak veya ortakların sorumluluğu belirli\
      \ bir sermaye ile sınırlandırılmış olan şirket komandit\nşirkettir.\n         (2) Sorumluluğu sınırlı olmayan ortaklara\
      \ komandite, sorumluluğu sınırlı olanlara\nkomanditer denir.\n         (3) Komandite ortakların gerçek kişi olmaları\
      \ gerekir. Tüzel kişiler ancak komanditer\nortak olabilirler."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 329
    alinti: "       MADDE 329- (1) Anonim şirket, sermayesi belirli ve paylara bölünmüş olan,\nborçlarından dolayı yalnız\
      \ malvarlığıyla sorumlu bulunan şirkettir.\n       (2) Pay sahipleri, sadece taahhüt etmiş oldukları sermaye payları\
      \ ile ve şirkete karşı\nsorumludur."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 573
    alinti: "        MADDE 573- (1) Limited şirket, bir veya daha çok gerçek veya tüzel kişi tarafından\nbir ticaret unvanı\
      \ altında kurulur; esas sermayesi belirli olup, bu sermaye esas sermaye\npaylarının toplamından oluşur.\n        (2)\
      \ Ortaklar, şirket borçlarından sorumlu olmayıp, sadece taahhüt ettikleri esas\nsermaye paylarını ödemekle ve şirket\
      \ sözleşmesinde öngörülen ek ödeme ve yan edim\nyükümlülüklerini yerine getirmekle yükümlüdürler.\n        (3) Limited\
      \ şirket, kanunen yasak olmayan her türlü ekonomik amaç ve konu için\nkurulabilir."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 574
    alinti: "       B) Ortakların sayısı\n       MADDE 574- (1) Ortakların sayısı elliyi aşamaz.\n\n       (2) Ortak sayısı\
      \ bire düşerse durum, bu sonucu doğuran işlem tarihinden itibaren yedi\ngün içinde müdürlere yazıyla bildirilir. Müdürler,\
      \ bildirimin alınması tarihinden başlayarak\nyedinci günün sonuna kadar, şirketin tek ortaklı olduğunu, bu ortağın adını,\
      \ yerleşim yerini ve\nvatandaşlığını tescil ve ilan ettirirler, aksi hâlde doğacak zarardan sorumlu olurlar. Aynı\n\
      yükümlülük, şirketin bir ortakla kurulduğu hâllerde de geçerlidir."
