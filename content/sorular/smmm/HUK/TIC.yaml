- id: SMMM-HUK-TIC-0001
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: tacir ve ticari işletme
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 6102 sayılı Türk Ticaret Kanunu'nun 18. maddesine göre tacirler arasında diğer tarafı temerrüde düşürmeye,
    sözleşmeyi feshe veya sözleşmeden dönmeye ilişkin ihbar ve ihtarların yapılabileceği yollar arasında aşağıdakilerden
    hangisi **sayılmamıştır**?
  secenekler:
    A: Faks mesajı
    B: Noter aracılığıyla gönderilen ihtarname
    C: Taahhütlü mektup
    D: Telgraf
    E: Güvenli elektronik imza kullanılarak kayıtlı elektronik posta sistemi
  dogru: A
  aciklama:
    dogru_neden: TTK md. 18/3'e göre tacirler arasında temerrüde düşürme, fesih ve sözleşmeden dönmeye ilişkin ihbar
      veya ihtarlar noter aracılığıyla, taahhütlü mektupla, telgrafla veya güvenli elektronik imza kullanılarak
      kayıtlı elektronik posta sistemi ile yapılır. Faks mesajı bu dört yol arasında sayılmamıştır.
    celdiriciler:
      B: Noter aracılığıyla yapılan ihbar veya ihtar md. 18/3'te açıkça sayılmıştır.
      C: Taahhütlü mektup md. 18/3'te açıkça sayılmıştır.
      D: Telgraf md. 18/3'te açıkça sayılmıştır.
      E: Güvenli elektronik imza kullanılarak kayıtlı elektronik posta sistemi ile yapılan bildirim md. 18/3'te
        açıkça sayılmıştır.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 18/3
    alinti: Tacirler arasında, diğer tarafı temerrüde düşürmeye, sözleşmeyi feshe, sözleşmeden dönmeye ilişkin ihbarlar
      veya ihtarlar noter aracılığıyla, taahhütlü mektupla, telgrafla veya güvenli elektronik imza kullanılarak
      kayıtlı elektronik posta sistemi ile yapılır.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: A şıkkı 'Güvenli elektronik imza kullanılmaksızın gönderilen olağan e-posta' → 'Faks mesajı'; dogru_neden
      buna göre güncellendi.
    neden: 'G5 (küçük): A ve E şıkları ''e-imzalı / e-imzasız'' biçiminde ikiz olduğundan doğru cevap tahmin edilebiliyordu.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: Zorluk 1 → 2.
    neden: 'GZ: kolay etiketli ama ortalama aday yanıldı (güven 2) → etiket 2.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: A (güven 5); B: A (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday yanlış (güven 2)
- id: SMMM-HUK-TIC-0002
  sinav: smmm
  bolum:
  - YET
  ders: HUK
  unite: Ticaret hukuku (6102)
  konu: TIC
  kazanim: ticari davalar ve görevli mahkeme
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Asliye ticaret mahkemesi bulunmayan bir yargı çevresinde, her iki tarafın da ticari işletmesiyle ilgili bir
    alacak davası asliye hukuk mahkemesinde açılmıştır. Davacı, dava dilekçesinde davanın ticari dava olduğuna ilişkin
    görev kuralına dayanmamıştır; dava şartlarına ilişkin başka bir eksiklik de bulunmamaktadır. 6102 sayılı Türk
    Ticaret Kanunu'na göre asliye hukuk mahkemesinin yapması gereken işlem aşağıdakilerden hangisidir?
  secenekler:
    A: Görevsizlik kararı vererek dosyayı en yakın asliye ticaret mahkemesine gönderir.
    B: Yetkisizlik kararı vererek dosyayı ticari davalara bakan mahkemeye gönderir.
    C: Görevsizlik kararı vermeksizin davaya devam eder.
    D: Davayı görev yönünden usulden reddederek dosyayı kapatır.
    E: Davacıya dilekçesini ticari dava olarak yeniden düzenlemesi için süre verir.
  dogru: C
  aciklama:
    dogru_neden: Her iki tarafın ticari işletmesiyle ilgili hususlardan doğan hukuk davaları TTK md. 4/1 uyarınca
      ticari davadır. TTK md. 5/4'e göre asliye ticaret mahkemesi bulunmayan yargı çevresindeki bir ticari davada
      görev kuralına dayanılmamış olması görevsizlik kararı verilmesini gerektirmez; asliye hukuk mahkemesi davaya
      devam eder.
    celdiriciler:
      A: md. 5/4, asliye ticaret mahkemesi bulunmayan yargı çevresinde görev kuralına dayanılmamış olmasının görevsizlik
        kararı verilmesini gerektirmediğini açıkça düzenlemiştir.
      B: Asliye ticaret ile asliye hukuk mahkemesi arasındaki ilişki md. 5/3 uyarınca yetki değil görev ilişkisidir;
        ayrıca md. 5/4 gereği mahkeme davaya devam eder.
      D: md. 5/4 asliye hukuk mahkemesinin davaya devam edeceğini öngördüğünden davanın görev yönünden reddi söz
        konusu değildir.
      E: Kanunda bu durum için dilekçenin yeniden düzenlenmesi öngörülmemiştir; md. 5/4 uyarınca mahkeme doğrudan
        davaya devam eder.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 4/1
    alinti: Her iki tarafın da ticari işletmesiyle ilgili hususlardan doğan hukuk davaları ve çekişmesiz yargı işleri
      ile
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 5/3 ve 5/4
    alinti: '(3) (Değişik: 26/6/2012-6335/2 md.) Asliye ticaret mahkemesi ile asliye hukuk mahkemesi ve diğer hukuk
      mahkemeleri arasındaki ilişki görev ilişkisi olup, bu durumda göreve ilişkin usul hükümleri uygulanır. (4)
      (Değişik: 26/6/2012-6335/2 md.) Asliye ticaret mahkemesi bulunmayan yargı çevresindeki bir ticari davada görev
      kuralına dayanılmamış olması, görevsizlik kararı verilmesini gerektirmez; asliye hukuk mahkemesi, davaya devam
      eder.'
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 2)
