- id: SMMM-MAL-7AB-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: 7AB
  kazanim: '7/A seçeneğinde fiili maliyet yöntemi: yansıtma hesapları, çalışmayan kısım giderleri ve 151 hesabına aktarılan
    tutar'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '7/A seçeneğini ve fiili maliyet yöntemini uygulayan ST İşletmesi''nin dönem içinde fonksiyon esasına göre kaydettiği
    giderler şöyledir:

    - 710 Direkt İlkmadde ve Malzeme Giderleri: 800.000 TL

    - 720 Direkt İşçilik Giderleri: 450.000 TL (bunun 30.000 TL''si, üretimin durduğu günlere ait üretim yapılmayan işçiliktir;
    işletme bu tutar için Tekdüzen Hesap Planı''nda fiili maliyet yönteminde olağan durumlar için öngörülen kaydı uygulamaktadır)

    - 730 Genel Üretim Giderleri: 300.000 TL

    - 760 Pazarlama Satış ve Dağıtım Giderleri: 120.000 TL

    - 770 Genel Yönetim Giderleri: 90.000 TL

    - 780 Finansman Giderleri: 50.000 TL

    Dönem sonunda ilgili yansıtma hesaplarının alacağı karşılığında 151 Yarı Mamüller-Üretim hesabına borç kaydedilecek toplam
    tutar kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: 1.100.000
    B: 1.220.000
    C: 1.520.000
    D: 1.550.000
    E: 1.660.000
  dogru: C
  aciklama:
    dogru_neden: 'MSUGT''ye göre fiili maliyet yönteminde 710, 720 ve 730 hesaplarının borcuna kaydedilen giderler yansıtma
      hesapları (711, 721, 731) alacağı karşılığında 151 Yarı Mamüller-Üretim hesabına borç kaydedilir. THP 721 açıklamasına
      göre fiili maliyet yönteminde üretim yapılmayan işçilikler olağan durumlarda 721''in alacağı karşılığı 680 Çalışmayan
      Kısım Giderleri hesabının borcuna aktarılır; dolayısıyla 30.000 TL maliyete girmez. 760, 770 ve 780 hesapları üretim
      maliyetine değil, sırasıyla pazarlama, genel yönetim ve finansman giderleri olarak gelir tablosuna aktarılır. 151''e
      aktarılan tutar: 800.000 + (450.000 − 30.000) + 300.000 = 1.520.000 TL.'
    celdiriciler:
      A: '1.100.000: direkt işçilik (720) unutulmuştur (800.000 + 300.000).'
      B: '1.220.000: genel üretim giderleri (730) unutulmuştur (800.000 + 420.000).'
      D: '1.550.000: 30.000 TL''lik üretim yapılmayan işçilik 680''e aktarılmayıp maliyete dahil edilmiştir (800.000 + 450.000
        + 300.000).'
      E: '1.660.000: genel yönetim (90.000) ve finansman (50.000) giderleri de üretim maliyetine katılmıştır (1.520.000 +
        90.000 + 50.000).'
    hesap_adimlari:
    - '710 → 711 → 151: 800.000 TL'
    - '720 → 721 → 151: 450.000 − 30.000 (680''e aktarılan çalışmayan kısım) = 420.000 TL'
    - '730 → 731 → 151: 300.000 TL'
    - '760, 770 ve 780 maliyete girmez; 151''e aktarılan toplam: 800.000 + 420.000 + 300.000 = 1.520.000 TL'
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 711. Direkt İlkmadde ve Malzeme Yansıtma Hesabı
    alinti: Fiili maliyet yönteminin uygulandığı durumlarda "710- Direkt İlkmadde ve Malzeme Giderleri Hesabı"nın borcuna
      gider çeşidi olarak kaydedilen giderler ile, önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden
      hesaplanmış giderler, maliyet unsuru olarak bu hesabın alacağı karşılığında "151- Yarı Mamüller-Üretim Hesabı"na borç
      kaydedilir.
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 721. Direkt İşçilik Giderleri Yansıtma Hesabı
    alinti: Fiili maliyet yönteminin uygulandığı işletmelerde üretim yapılmayan işçilikler olağan durumlarda bu hesabın alacağı
      karşılığı "680- Çalışmayan Kısım Giderleri Hesabı"nın borcuna aktarılır.
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 731. Genel Üretim Giderleri Yansıtma Hesabı
    alinti: Fiili maliyet yönteminin uygulandığı durumlarda, "730- Genel üretim Giderleri Hesabı"nın borcuna kaydedilen giderleri,
      bu hesabın alacağı karşılığı "151- Yarı Mamüller Üretim Hesabı" ile diğer aktif, gider ve zarar hesaplarına borç kaydedilir.
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 680. Çalışmayan Kısım Gider ve Zararları
    alinti: Üretimle ilgili giderlerden çalışılmayan döneme ve çalışmayan kısımlara ait giderleri içerir.
  dogrulama:
    python: 'sonuc = 800000 + (450000 - 30000) + 300000

      '
