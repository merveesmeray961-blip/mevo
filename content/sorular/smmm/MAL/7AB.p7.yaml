      Giderleri", "631- Pazarlama Satış ve Dağıtım Giderleri", "632- Genel Yönetim Giderleri", "66- Finansman Giderleri" grubunun
      ilgili hesabına, "680- Çalışmayan Kısım Gider ve Zararları" hesaplarının ilgili olanlarına veya aktifleşmesi gereken
