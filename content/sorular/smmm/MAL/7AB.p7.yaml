    ve Malzeme Giderleri hesabına 450.000 TL, 720 Direkt İşçilik Giderleri hesabına 280.000 TL ve 730 Genel Üretim Giderleri
    hesabına 190.000 TL kaydedilmiştir. Ayrıca üretim yapılmayan günlere ait 25.000 TL tutarındaki işçilik gideri THP açıklamalarına
    uygun şekilde ayrı izlenmiştir. Dönem sonunda yansıtma hesapları aracılığıyla 151 Yarı Mamüller-Üretim hesabına aktarılacak
    tutar aşağıdakilerden hangisidir? KDV dikkate alınmayacaktır.
