    düzenleyen bir üretim işletmesinde, dönem içinde 791 İşçi Ücret ve Giderleri hesabının borcuna toplam 600.000 TL kaydedilmiştir.
    Gider dağıtım tablosuna göre bu tutarın;


    - 380.000 TL''si mamullere doğrudan yüklenebilen işçilikle,

    - 100.000 TL''si üretim bölümünde çalışan ve mamullere doğrudan yüklenemeyen işçilikle,

    - 30.000 TL''si üretimin durduğu günlere ait işçilikle,

    - 50.000 TL''si satış elemanlarının ücretleriyle,

    - 40.000 TL''si genel yönetim personelinin ücretleriyle


    ilgili olduğu saptanmıştır. Dönem sonunda 798 Gider Çeşitleri Yansıtma Hesabı''nın alacağı karşılığında 799 Üretim Maliyet
    Hesabı''nın borcuna kaydedilecek işçilik tutarı kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: '380.000'
    B: '450.000'
    C: '480.000'
    D: '510.000'
    E: '560.000'
  dogru: C
  aciklama:
    dogru_neden: '7/B seçeneğinde işçi ücretleri dönem boyunca 791''in borcuna kaydedilir; dönem sonunda gider dağıtım tablosuna
      göre fonksiyonlarına ayrılan tutarlar 798''in alacağı karşılığında 799 Üretim Maliyet Hesabı''na, 630-632 faaliyet gideri
      hesaplarına, 66 grubuna, 680 Çalışmayan Kısım Gider ve Zararları''nın ilgili hesaplarına veya ilgili aktif hesaplara
      aktarılır. 799''a yalnızca üretim fonksiyonuna ait giderler girer: mamullere doğrudan yüklenebilen işçilik ile direkt
      işçilik dışında kalan, üretime bağlı işçilik (730 kapsamındaki dolaylı işçilik). Üretimin durduğu günlere ait işçilik
      680''e, satış elemanlarının ücreti 631''e, yönetim personelinin ücreti 632''ye aktarılır. 799''a aktarılacak işçilik
      = 380.000 + 100.000 = 480.000 TL.'
    celdiriciler:
      A: '380.000: Yalnızca mamullere doğrudan yüklenebilen işçilik alınmıştır; üretim bölümündeki dolaylı işçilik de üretim
        maliyetinin parçasıdır ve 799''a aktarılır.'
      B: '450.000: Üretim işçiliği tutarından (480.000 TL) üretimin durduğu günlere ait işçilik (30.000 TL) ayrıca düşülmüştür;
        oysa bu tutar 480.000 TL''nin içinde değil, ayrı bir kalemdir.'
      D: '510.000: Üretimin durduğu günlere ait işçilik (30.000 TL) de üretim maliyetine katılmıştır; bu tutar 680 Çalışmayan
        Kısım Gider ve Zararları hesabına aktarılır.'
      E: '560.000: Üretimin durduğu günlere ait işçilik ile satış elemanlarının ücretleri de 799''a aktarılmıştır; birincisi
        680''e, ikincisi 631''e gider.'
    hesap_adimlari:
    - '791 toplamı: 380.000 + 100.000 + 30.000 + 50.000 + 40.000 = 600.000 TL'
    - '799''a aktarılan: doğrudan işçilik 380.000 + dolaylı üretim işçiliği 100.000 = 480.000 TL'
    - '680''e: 30.000 TL; 631''e: 50.000 TL; 632''ye: 40.000 TL'
