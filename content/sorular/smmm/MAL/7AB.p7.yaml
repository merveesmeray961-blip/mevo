- id: SMMM-MAL-7AB-0004
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: 7/A ve 7/B seçenekleri ve hesap akışı
  konu: 7AB
  kazanim: yansıtma hesapları
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. NP İşletmesi 7/A seçeneğinde fiili maliyet yöntemini kullanmaktadır. Dönem giderleri 710
    hesabında 240.000 TL, 720 hesabında 160.000 TL ve 730 hesabında 100.000 TL olarak izlenmiştir. 720 hesabındaki tutarın
    10.000 TL'si üretim yapılmayan günlere ait işçiliktir ve olağan durumdaki ilgili kayıt uygulanacaktır. Dönem sonunda 710,
    720 ve 730 hesaplarının yansıtma işlemleri yapıldığında 151- Yarı Mamuller-Üretim hesabına aktarılacak toplam tutar kaç
    TL'dir?
  secenekler:
    A: 480.000 TL
    B: 510.000 TL
    C: 500.000 TL
    D: 490.000 TL
    E: 520.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Fiili maliyet yönteminde 710 giderleri 711 aracılığıyla, 720 giderleri 721 aracılığıyla ve 730 giderleri
      731 aracılığıyla maliyete yansıtılır. Ancak olağan durumda üretim yapılmayan işçilik 721''in alacağı karşılığında 680''e
      aktarılır. Bu nedenle 151''e giden tutar 240.000 + (160.000 − 10.000) + 100.000 = 490.000 TL''dir. Püf noktaları: 720''nin
      tamamı 151''e aktarılmaz; üretim yapılmayan 10.000 TL önce 680 hesabına yönelir.'
    celdiriciler:
      A: 480.000 TL, 720 hesabının tamamının 151'e aktarılması yerine 10.000 TL'nin fazladan düşülmesiyle bulunur.
      C: 500.000 TL, 720 hesabındaki 10.000 TL'lik çalışılmayan işçiliğin 680'e aktarılmamasıyla elde edilir.
      E: 520.000 TL, üretim maliyetine 760 veya 770 gibi üretim dışı bir gider eklenmiş kabul edilerek bulunur.
      B: 510.000 TL, 720 hesabının tamamının maliyete alınmasına ek olarak 10.000 TL'nin tekrar 151'e eklenmesiyle oluşur.
    hesap_adimlari:
    - '710 → 711 → 151: 240.000 TL'
    - '720 → 721: 160.000 TL − 10.000 TL = 150.000 TL; 10.000 TL 680''e aktarılır'
    - '730 → 731 → 151: 100.000 TL'
    - 151'e aktarılan toplam = 240.000 + 150.000 + 100.000 = 490.000 TL
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 711. Direkt İlkmadde ve Malzeme Yansıtma Hesabı
    alinti: 'Fiili maliyet yönteminin uygulandığı durumlarda "710- Direkt İlkmadde ve Malzeme

      Giderleri Hesabı"nın borcuna gider çeşidi olarak kaydedilen giderler ile, önceden saptanmış

      maliyet yöntemlerinin uygulandığı durumlarda, önceden hesaplanmış giderler, maliyet unsuru

      olarak bu hesabın alacağı karşılığında "151- Yarı Mamüller-Üretim Hesabı"na borç kaydedilir.

      Dönem sonlarında "710- Direkt İlkmadde ve Malzeme Giderleri Hesabı" ile karşılaştırılarak

      kapatılır.'
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 721. Direkt İşçilik Giderleri Yansıtma Hesabı
    alinti: 'Fiili maliyet yönteminin uygulandığı işletmelerde üretim yapılmayan işçilikler olağan

      durumlarda bu hesabın alacağı karşılığı "680- Çalışmayan Kısım Giderleri Hesabı"nın

      borcuna aktarılır.'
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 731. Genel Üretim Giderleri Yansıtma Hesabı
    alinti: 'Fiili maliyet yönteminin uygulandığı durumlarda, "730- Genel üretim Giderleri Hesabı"nın

      borcuna kaydedilen giderleri, bu hesabın alacağı karşılığı "151- Yarı Mamüller Üretim

      Hesabı" ile diğer aktif, gider ve zarar hesaplarına borç kaydedilir.'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 240000 + (160000 - 10000) + 100000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kaynaklı kör çözücü: anahtarla aynı (güven 4). 500.000 - 10.000 çalışmayan işçilik (680)'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
