- id: SMMM-MAL-7AB-0019
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: 7/A ve 7/B seçenekleri ve hesap akışı
  konu: 7AB
  kazanim: 740/741/622 kapanışı
  tip: hesaplama
  zorluk: 3
  kok: 'Hizmet üreten HT İşletmesi, 7/A seçeneğini ve fiili maliyet yöntemini uygulamaktadır. Dönem içinde fonksiyon esasına
    göre kaydedilen giderlerin dönem sonu borç kalanları şöyledir:


    - 740 Hizmet Üretim Maliyeti: 900.000 TL

    - 750 Araştırma ve Geliştirme Giderleri: 40.000 TL

    - 760 Pazarlama Satış ve Dağıtım Giderleri: 140.000 TL

    - 770 Genel Yönetim Giderleri: 110.000 TL

    - 780 Finansman Giderleri: 60.000 TL


    İşletmenin dönem içindeki hizmet gelirleri 2.000.000 TL''dir. Dönem sonunda ilgili yansıtma hesaplarının alacağı karşılığında
    yapılan devirlerden sonra 622 Satılan Hizmet Maliyeti, 630 Araştırma ve Geliştirme Giderleri, 631 Pazarlama Satış ve Dağıtım
    Giderleri ile 632 Genel Yönetim Giderleri hesaplarının borç tutarları toplamı kaç TL olur? KDV dikkate alınmayacaktır.'
  secenekler:
    A: '900.000'
    B: 1.040.000
    C: 1.150.000
    D: 1.190.000
    E: 1.250.000
  dogru: D
  aciklama:
    dogru_neden: '7/A seçeneğinde fiili maliyet yöntemini uygulayan hizmet işletmesinde 740 hesabının borcuna kaydedilen tutar
      dönem sonunda 741 Hizmet Üretim Maliyeti Yansıtma Hesabı''nın alacağı karşılığında 622 Satılan Hizmet Maliyeti hesabının
      borcuna aktarılır. Araştırma ve geliştirme giderleri 751''in alacağı karşılığında 630''a, pazarlama giderleri 761''in
      alacağı karşılığında 631''e, genel yönetim giderleri 771''in alacağı karşılığında 632''ye devredilir. Finansman giderleri
      ise 781''in alacağı karşılığında 63 grubuna değil, 66 Finansman Giderleri grubunun ilgili hesabına aktarılır. Sorulan
      toplam: 622 (900.000) + 630 (40.000) + 631 (140.000) + 632 (110.000) = 1.190.000 TL.


      Püf noktaları: Beş gider hesabının hepsi sonuç hesaplarına devredilir, ancak soru yalnızca 622 ve 63 grubunu sorar;
      780''den gelen 60.000 TL 66 grubuna gittiği için toplama girmez. Araştırma ve geliştirme (750) gibi az kullanılan bir
      hesabın unutulması en sık yapılan hatadır. Hizmet gelirleri çözüme etki etmeyen gereksiz veridir.'
    celdiriciler:
      A: '900.000: Yalnızca 740 → 741 → 622 devri dikkate alınmıştır; 630, 631 ve 632 hesaplarına yapılan devirler unutulmuştur.'
      B: '1.040.000: 622 ile 631 toplanmış (900.000 + 140.000); araştırma-geliştirme ve genel yönetim giderlerinin 630 ve
        632''ye devri unutulmuştur.'
      C: '1.150.000: 750 hesabının 751 alacağı karşılığında 630''a devri unutulmuştur (900.000 + 140.000 + 110.000).'
