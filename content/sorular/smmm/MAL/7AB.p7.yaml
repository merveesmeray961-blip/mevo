    E: 995.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'MSUGT Tekdüzen Hesap Planı açıklamalarına göre fiili maliyet yönteminde 710, 720 ve 730 hesaplarının borcuna
      kaydedilen tutarlar ilgili yansıtma hesapları (711, 721, 731) alacağı karşılığında 151 hesabına borç yazılır. Ancak
      721 açıklamasına göre üretim yapılmayan işçilikler olağan durumlarda 680 Çalışmayan Kısım Gider ve Zararları hesabına
      aktarılır; dolayısıyla 25.000 TL üretim maliyetine dahil edilmez. Aktarılacak tutar: 450.000 + (280.000 − 25.000) +
      190.000 = 895.000 TL.'
    celdiriciler:
      B: '920.000 TL: 25.000 TL’lik çalışmayan kısım gideri maliyete dahil edilerek (450.000 + 280.000 + 190.000) hesaplanmıştır.'
      C: '945.000 TL: Direkt işçilikten çalışmayan kısım düşülmemiş ve ayrıca 25.000 TL eklenerek fazla hesaplanmıştır.'
      D: '970.000 TL: Genel üretim giderleri yerine başka bir tutar eklenerek veya çalışmayan kısım yanlış işaretle işlenmiştir.'
      E: '995.000 TL: Tüm giderler (çalışmayan kısım dahil) toplanmış ve ek bir kalem eklenmiştir.'
    hesap_adimlari:
    - '710 → 711 → 151: 450.000 TL'
    - '720 → 721 → 151: 280.000 − 25.000 (680’e) = 255.000 TL'
    - '730 → 731 → 151: 190.000 TL'
    - 'Toplam: 450.000 + 255.000 + 190.000 = 895.000 TL'
