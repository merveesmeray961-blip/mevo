  kok: KDV dikkate alınmayacaktır. Q İşletmesi önceden saptanmış maliyet yöntemini uygulamaktadır. Dönemde fiilen gerçekleşen
    genel üretim giderleri 530.000 TL, maliyetlere yüklenen önceden saptanmış genel üretim giderleri 560.000 TL'dir. Üretimin
    tamamı satılmıştır. Bu durumda 732- Genel Üretim Giderleri Bütçe Farkları hesabıyla ilgili aşağıdaki ifadelerden hangisi
    doğrudur?
  secenekler:
    A: 732 hesabı 30.000 TL borçlandırılır ve fark stok hesaplarında bırakılır.
    B: 732 hesabı 30.000 TL alacaklandırılır; fark dönem sonunda ilgili stok ve satış maliyeti hesaplarına aktarılır.
    C: 732 hesabı 30.000 TL borçlandırılır; fark dönem sonunda 151- Yarı Mamuller-Üretim hesabına aktarılır.
    D: 732 hesabı 90.000 TL alacaklandırılır ve fark 730 hesabına geri aktarılır.
    E: 732 hesabı kullanılmaz; fark 741- Hizmet Üretim Maliyeti Yansıtma hesabına aktarılır.
  dogru: B
  aciklama:
    dogru_neden: 'Fiili genel üretim giderleri 530.000 TL iken maliyetlere yüklenen önceden saptanmış giderler 560.000 TL''dir;
      30.000 TL olumlu bütçe farkı vardır. MSUGT''ye göre olumlu farklar 732 hesabının alacağına kaydedilir ve dönem sonunda
      ilgili stok ve satış maliyeti hesaplarına aktarılır. Üretimin tamamı satıldığı için soruda ilgili maliyet hesabı satış
      maliyetidir. Püf noktaları: 732''de yönü belirleyen farkın işareti önemlidir; fiili tutarın yüklenen tutardan düşük
      olması olumlu farktır.'
    celdiriciler:
      A: 30.000 TL borç yönü, olumsuz fark için geçerlidir; burada fiili gider yüklenen tutardan düşüktür.
      C: 30.000 TL borç yönü yanlıştır ve 151'e aktarım ifadesi sorudaki üretimin tamamının satılmış olmasıyla bağdaşmaz.
      D: Fark 30.000 TL'dir; 90.000 TL hesaplaması verilere dayanmamaktadır ve 730'a geri aktarım kaynakta belirtilmemiştir.
      E: 732 hesabı tam da fiili üretim genel giderleri ile önceden saptanmış giderler arasındaki bütçe farklarının izlendiği
        hesaptır; 741 hizmet işletmelerine özgüdür.
    hesap_adimlari:
    - 'Fiili genel üretim gideri: 530.000 TL'
    - 'Maliyetlere yüklenen önceden saptanmış gider: 560.000 TL'
    - Olumlu bütçe farkı = 560.000 − 530.000 = 30.000 TL
    - Olumlu fark 732 hesabının alacağına kaydedilir ve dönem sonunda ilgili stok/satış maliyeti hesaplarına aktarılır.
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 732. Genel Üretim Giderleri Bütçe Farkları
    alinti: 'Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki

      olumlu ya da olumsuz bütçe farklarının izlendiği hesaptır.


