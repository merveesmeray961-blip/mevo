  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: 7AB
  kazanim: 7/A seçeneğinde finansman giderlerinin izlenmesi (78 grubu)
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: Maliyet hesaplarında Muhasebe Sistemi Uygulama Genel Tebliği'nde yer alan 7/A seçeneğini kullanan E İşletmesi,
    dönem içinde tahakkuk eden ve herhangi bir varlığın maliyetine eklenmeyecek olan banka kredisi faizini ilk olarak
    hangi hesaba borç kaydeder?
  secenekler:
    A: 780 Finansman Giderleri
    B: 660 Kısa Vadeli Borçlanma Giderleri
    C: 730 Genel Üretim Giderleri
    D: 770 Genel Yönetim Giderleri
    E: 797 Finansman Giderleri
  dogru: A
  aciklama:
    dogru_neden: 7/A seçeneğinde giderler defter-i kebirde fonksiyon esasına göre izlenir (MSUGT THP, 7 Maliyet
      Hesapları girişi). Borçlanılan tutarlarla ilgili faiz ve benzeri giderler önce 78 Finansman Giderleri grubundaki
      780 Finansman Giderleri hesabına borç kaydedilir; 781 Finansman Giderleri Yansıtma hesabı aracılığıyla sonuç
      hesaplarındaki 66 Finansman Giderleri grubunun ilgili hesabına (kısa vadeli kredide 660 Kısa Vadeli Borçlanma
      Giderleri) aktarılır.
    celdiriciler:
      B: 660 Kısa Vadeli Borçlanma Giderleri, sonuç hesaplarındaki 66 Finansman Giderleri grubunun bir hesabıdır;
        7/A seçeneğinde faiz önce 780 hesabına borç kaydedilir ve 781 yansıtma hesabı aracılığıyla 66 grubunun ilgili
        hesabına aktarılır.
      C: 730 Genel Üretim Giderleri hesabı üretimle ilgili dolaylı giderler içindir; işletme kredisi faizi üretim
        maliyetine katılmaz.
      D: 770 Genel Yönetim Giderleri hesabı yönetim fonksiyonuna ilişkin giderler içindir; finansman giderleri ayrı
        bir grupta (78) izlenir.
      E: 797 Finansman Giderleri hesabı, giderlerin çeşit esasına göre izlendiği 7/B seçeneğine aittir; kökteki
        işletme fonksiyon esasına dayanan 7/A seçeneğini kullanmaktadır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 7 Maliyet Hesapları — giriş (7/A ve 7/B seçenekleri)
    alinti: Bu bölümde yer alan gider hesapları uygulamada esneklik sağlamak üzere iki seçenek halinde 7/A ve 7/B
      olarak sunulmuştur. 7/A seçeneğinde giderler defter-i kebirde fonksiyon esasına göre, 7/B seçeneğinde ise
      çeşit esasına göre belirlenmiştir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 78 Finansman Giderleri (grup açıklaması)
    alinti: Bu grupta işletmenin borçlandığı tutarlarla ilgili olarak katlanılan ve varlıkların maliyetine eklenmemiş
      bulunan faiz ve benzeri giderlerle, yansıtma ve fark hesapları yer alır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 780 Finansman Giderleri Hesabı
    alinti: İşletme faaliyetlerinin aksamadan yürütülebilmesi amacıyla borçlanılan tutarlarla ilgili faiz, kur farkları,
      komisyon ve benzeri giderler bu hesaba borç kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 781 Finansman Giderleri Yansıtma Hesabı
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden saptanmış finansman giderleri
      ile fiili maliyet yöntemlerinin uygulandığı durumlarda "780- Finansman Giderleri Hesabı"nın borcuna kaydedilen
      giderler bu hesabın alacağı karşılığında sonuç hesaplarındaki "66- Finansman Giderleri" grubunun ilgili hesabına
      borç kaydedilir.
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
