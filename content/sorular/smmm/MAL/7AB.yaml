- id: SMMM-MAL-7AB-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: 7AB
  kazanim: 7/A seçeneğinde finansman giderlerinin izlenmesi (78 grubu)
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: Maliyet hesaplarında Muhasebe Sistemi Uygulama Genel Tebliği'nde yer alan 7/A seçeneğini kullanan E İşletmesi,
    dönem içinde tahakkuk eden ve herhangi bir varlığın maliyetine eklenmeyecek olan banka kredisi faizini ilk olarak
    hangi hesaba borç kaydeder?
  secenekler:
    A: 780 Finansman Giderleri
    B: 660 Kısa Vadeli Borçlanma Giderleri
    C: 730 Genel Üretim Giderleri
    D: 770 Genel Yönetim Giderleri
    E: 797 Finansman Giderleri
  dogru: A
  aciklama:
    dogru_neden: 7/A seçeneğinde giderler fonksiyon esasına göre 71–78 hesap gruplarında izlenir. Borçlanmalardan
      doğan faiz ve benzeri giderler önce 78 Finansman Giderleri grubundaki 780 Finansman Giderleri hesabına borç
      kaydedilir; dönem sonunda 781 Finansman Giderleri Yansıtma hesabı aracılığıyla gelir tablosu hesabı olan 660
      Kısa Vadeli Borçlanma Giderleri hesabına (veya ilgili varlığa) aktarılır.
    celdiriciler:
      B: 660 hesabı gelir tablosu hesabıdır; 7/A seçeneğinde faiz önce 780 hesabında toplanır ve 660'a dönem sonunda
        yansıtma hesabı aracılığıyla aktarılır.
      C: 730 Genel Üretim Giderleri hesabı üretimle ilgili dolaylı giderler içindir; işletme kredisi faizi üretim
        maliyetine katılmaz.
      D: 770 Genel Yönetim Giderleri hesabı yönetim fonksiyonuna ilişkin giderler içindir; finansman giderleri ayrı
        bir grupta (78) izlenir.
      E: 797 Finansman Giderleri hesabı, giderlerin çeşit esasına göre izlendiği 7/B seçeneğine aittir; kökteki
        işletme 7/A seçeneğini kullanmaktadır.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1)
    madde: Hesap Planı ve Hesap Planı Açıklamaları — 7 Maliyet Hesapları (7/A seçeneği), 78 Finansman Giderleri
    alinti: ''
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: A (güven 5); B: A (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) Kökte kredinin vadesi belirtilmemiş; açıklama aktarımı 660''a bağlıyor. MSUGT 781 açıklaması
          ''66- Finansman Giderleri grubunun ilgili hesabı'' der; uzun vadeli kredide 661 olur. Sorulan ilk kayıt
          (780) bundan etkilenmiyor. | Öneri: Açıklamada ''660'' yerine ''66 grubunun ilgili hesabı (kısa vadeli
          kredide 660)'' yazılabilir.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) Bu kaynak satırında alıntı alanı boş (uretim.md §2.3 birebir alıntı istiyor). İddia aşağıda
          belirtilen resmî metinle doğrulandı. MSUGT THP: 780 (''…faiz, kur farkları, komisyon ve benzeri giderler
          bu hesaba borç kaydedilir''), 781 (''…66- Finansman Giderleri grubunun ilgili hesabına borç kaydedilir''),
          66/660 (''7. grupta izlenen finansman giderleri 7/A seçeneğinde 781…''). ''(veya ilgili varlığa)'' ifadesi
          170–177 açıklamasıyla (''…751, 761, 771 ve 781 kod numaralı yansıtma hesaplarının alacağı karşılığında'')
          destekleniyor. 797''nin 7/B''ye ait olduğu doğru. | (küçük) Açıklama aktarımı doğrudan ''660'' hesabına
          bağlıyor; MSUGT ise ''66 grubunun ilgili hesabı'' diyor.'
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-MAL-7AB-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: 7AB
  kazanim: 7/A seçeneğinde yansıtma hesapları ve faaliyet giderlerinin gelir tablosuna aktarılması
  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: 7/A seçeneğini kullanan F İşletmesi'nin dönem içinde 760 Pazarlama Satış ve Dağıtım Giderleri hesabında 85.000
    ₺ gider birikmiştir. Dönem sonunda bu giderlerin gelir tablosu hesabına aktarılması için yapılması gereken (yansıtma)
    kaydı aşağıdakilerden hangisidir?
  secenekler:
    A: 'Borç: 761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma 85.000 / Alacak: 760 Pazarlama Satış ve Dağıtım
      Giderleri 85.000'
    B: 'Borç: 760 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 761 Pazarlama Satış ve Dağıtım Giderleri
      Yansıtma 85.000'
    C: 'Borç: 631 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 761 Pazarlama Satış ve Dağıtım Giderleri
      Yansıtma 85.000'
    D: 'Borç: 631 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 760 Pazarlama Satış ve Dağıtım Giderleri
      85.000'
    E: 'Borç: 761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma 85.000 / Alacak: 631 Pazarlama Satış ve Dağıtım
      Giderleri 85.000'
  dogru: C
  aciklama:
    dogru_neden: 7/A seçeneğinde fonksiyonel gider hesapları gelir tablosu hesaplarına doğrudan değil, yansıtma
      hesapları aracılığıyla aktarılır. Pazarlama giderleri 631 Pazarlama Satış ve Dağıtım Giderleri hesabına borç,
      761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma hesabına alacak kaydedilir. Ardından 761 hesabı 760 hesabıyla
      karşılaştırılarak kapatılır (761 borç / 760 alacak).
    celdiriciler:
      A: Bu kayıt, aktarmadan sonra yansıtma hesabının ana gider hesabıyla kapatılmasıdır; giderleri gelir tablosu
        hesabına aktarmaz.
      B: Gider hesabı 760 zaten borç bakiyelidir; bu kayıt yansıtma hesabını ters yönde çalıştırır ve gideri gelir
        tablosuna taşımaz.
      D: 760 hesabının doğrudan 631'e kapatılması yansıtma hesabını atlar; 7/A seçeneğinde aktarma 761 yansıtma
        hesabı aracılığıyla yapılır.
      E: Taraflar ters yazılmıştır; 631 gider hesabı alacaklandırılırsa gelir tablosuna gider aktarılmaz, gider
        azaltılmış olur.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1)
    madde: Hesap Planı Açıklamaları — 76 Pazarlama Satış ve Dağıtım Giderleri (760, 761) ve 63 Faaliyet Giderleri
      (631)
    alinti: ''
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 4)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: (küçük) B şıkkı (760 borç / 761 alacak) yön bilgisiyle kolay eleniyor; çeldirici zayıf.
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
        not: (küçük) Bu kaynak satırında alıntı alanı boş (uretim.md §2.3 birebir alıntı istiyor). İddia aşağıda
          belirtilen resmî metinle doğrulandı. MSUGT THP 760 ('…761 … ile karşılaştırılarak kapatılır'), 761 ('…760
          … borcuna kaydedilen giderler bu hesabın alacağı karşılığı 631 … devredilir'), 631 açıklaması. Bütün iddialar
          destekleniyor.
      G2:
        sonuc: gecti
