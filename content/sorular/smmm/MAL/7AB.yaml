  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: 7/A seçeneğini kullanan F İşletmesi'nin dönem içinde 760 Pazarlama Satış ve Dağıtım Giderleri hesabında 85.000
    ₺ gider birikmiştir. Dönem sonunda bu giderlerin gelir tablosu hesabına aktarılması için yapılması gereken (yansıtma)
    kaydı aşağıdakilerden hangisidir?
  secenekler:
    A: 'Borç: 761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma 85.000 / Alacak: 760 Pazarlama Satış ve Dağıtım
      Giderleri 85.000'
    B: 'Borç: 631 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 798 Gider Çeşitleri Yansıtma Hesabı 85.000'
    C: 'Borç: 631 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 761 Pazarlama Satış ve Dağıtım Giderleri
      Yansıtma 85.000'
    D: 'Borç: 631 Pazarlama Satış ve Dağıtım Giderleri 85.000 / Alacak: 760 Pazarlama Satış ve Dağıtım Giderleri
      85.000'
    E: 'Borç: 761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma 85.000 / Alacak: 631 Pazarlama Satış ve Dağıtım
      Giderleri 85.000'
  dogru: C
  aciklama:
    dogru_neden: 7/A seçeneğinde fonksiyonel gider hesapları gelir tablosu hesaplarına doğrudan değil, yansıtma
      hesapları aracılığıyla aktarılır. MSUGT THP 761 açıklamasına göre 760 hesabının borcuna kaydedilen giderler
      761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma hesabının alacağı karşılığı 631 Pazarlama Satış ve Dağıtım
      Giderleri hesabına devredilir (631 borç / 761 alacak). Ardından 761 hesabı 760 hesabıyla karşılaştırılarak
      kapatılır (761 borç / 760 alacak).
    celdiriciler:
      A: Bu kayıt, aktarmadan sonra yansıtma hesabının ana gider hesabıyla kapatılmasıdır; giderleri gelir tablosu
        hesabına aktarmaz.
      B: 798 Gider Çeşitleri Yansıtma Hesabı 7/B seçeneğinde kullanılır; THP 631 açıklamasına göre 7/A seçeneğinde
        pazarlama giderleri 761 yansıtma hesabının alacağı ile 631'e devredilir. Kökteki işletme 7/A seçeneğini
        kullanmaktadır.
      D: 760 hesabının doğrudan 631'e kapatılması yansıtma hesabını atlar; 7/A seçeneğinde aktarma 761 yansıtma
        hesabı aracılığıyla yapılır.
      E: Taraflar ters yazılmıştır; 631 gider hesabı alacaklandırılırsa gelir tablosuna gider aktarılmaz, gider
        azaltılmış olur.
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 761 Pazarlama Satış ve Dağıtım Giderleri Yansıtma Hesabı
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda önceden saptanmış pazarlama, satış ve
      dağıtım giderleri ile, fiili maliyet yönteminin uygulandığı durumlarda "760- Pazarlama Satış ve Dağıtım Giderleri
      Hesabı"nın borcuna kaydedilen giderler bu hesabın alacağı karşılığı "631- Pazarlama Satış ve Dağıtım Giderleri
      Hesabı"na devredilir. Dönem sonlarında bu hesap, "760- Pazarlama Satış ve Dağıtım Giderleri Hesabı" ile karşılaştırılarak
      kapatılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 631 Pazarlama, Satış ve Dağıtım Giderleri (-)
    alinti: Pazarlama fonksiyonu ile ilgili giderler 7 inci grupta izlenir ve dönem sonlarında "761- Pazarlama Satış
