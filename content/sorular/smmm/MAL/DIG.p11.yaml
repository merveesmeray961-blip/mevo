      GÜG''den doğar; sabit pazarlama ve yönetim giderleri iki yöntemde de dönem gideridir.'
    celdiriciler:
      A: Üretim ve satış miktarı farklı olduğunda kârlar ayrışır.
      B: Üretim satıştan fazla olduğunda tam maliyet kârı daha yüksektir; yön terstir.
      D: Sabit pazarlama ve yönetim giderleri de stoka yüklenmiş gibi hesaplanmıştır (2.000 × 29).
      E: Satılan birimlerin sabit GÜG'ü (8.000 × 20) fark sanılmıştır.
    hesap_adimlari:
    - Birim sabit GÜG = 200.000 / 10.000 = 20 ₺
    - Stoktaki sabit GÜG = 2.000 × 20 = 40.000 ₺
    - Tam maliyet kârı 40.000 ₺ yüksek
