  kok: KDV dikkate alınmayacaktır. Dönem başı stoku bulunmayan TR İşletmesi dönemde 10.000 birim üretmiş, 8.000
    birim satmıştır. Birim değişken üretim maliyeti 30 ₺, dönemin sabit genel üretim giderleri 200.000 ₺, sabit
    pazarlama ve yönetim giderleri 90.000 ₺'dır. Üretim normal kapasitede gerçekleşmiştir. Tam maliyet yöntemiyle
    hesaplanan dönem kârı ile değişken maliyet yöntemiyle hesaplanan dönem kârı arasındaki fark ve yönü aşağıdakilerden
    hangisidir?
  secenekler:
    A: Fark yoktur; iki yöntemde kâr aynıdır.
    B: Tam maliyette kâr 40.000 ₺ daha düşüktür.
    C: Tam maliyette kâr 40.000 ₺ daha yüksektir.
    D: Tam maliyette kâr 58.000 ₺ daha yüksektir.
    E: Tam maliyette kâr 160.000 ₺ daha yüksektir.
  dogru: C
  aciklama:
    dogru_neden: 'Tam maliyette sabit GÜG birimlere yüklenir: 200.000 / 10.000 = 20 ₺. Satılmayan 2.000 birimin
      stokta taşıdığı sabit GÜG 2.000 × 20 = 40.000 ₺''dir; bu tutar değişken maliyette dönem gideri yazılır. Üretim
