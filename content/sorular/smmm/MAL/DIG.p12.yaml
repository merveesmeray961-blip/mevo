  kok: KDV dikkate alınmayacaktır. LT İşletmesinin aylık kapasitesi 20.000 birim olup normal satışları 14.000 birimdir. Birim
    satış fiyatı 100 ₺, birim değişken üretim gideri 62 ₺, dönemlik sabit giderler 420.000 ₺'dir. Bir müşteri, normal pazarı
    etkilemeyecek biçimde 4.000 birimlik özel sipariş için birim fiyatı 75 ₺ önermektedir; siparişe özgü ambalaj gideri birim
    başına 3 ₺'dir ve ek sabit gider doğmamaktadır. Siparişin kabul edilmesi işletme kârını nasıl etkiler?
  secenekler:
    A: Kâr 100.000 ₺ azalır
    B: Kâr 80.000 ₺ azalır
    C: Kâr 68.000 ₺ azalır
    D: Kâr 40.000 ₺ artar
    E: Kâr 52.000 ₺ artar
  dogru: D
  aciklama:
    dogru_neden: 'Sipariş atıl kapasite (6.000 birim) içinde kaldığından ve sabit giderleri artırmadığından ilgili ölçüt artan
      katkı payıdır: 4.000 × (75 − 62 − 3) = 40.000 ₺. Tam maliyet (92 ₺) ilgisizdir; sipariş kârı 40.000 ₺ artırır. Püf noktaları:
      Atıl kapasitede sabit giderler karar için ilgisizdir; yalnızca siparişe özgü gelir ve giderler karşılaştırılır. Siparişe
      özgü ambalaj gibi ek değişken giderleri unutmayın.'
    celdiriciler:
      A: Özel sipariş fiyatı normal satış fiyatıyla (100 ₺) karşılaştırılmıştır; karar ölçütü artan katkı payıdır.
      B: Birim maliyete sabit gider payı (30 ₺) eklenmiştir; sabit giderler sipariş nedeniyle değişmediğinden ilgisizdir.
      C: Tam maliyetle karşılaştırılmış ve ambalaj gideri unutulmuştur; sabit giderler karar için ilgisizdir.
      E: Siparişe özgü ambalaj gideri (3 ₺/birim) düşülmemiştir; artan kâr yalnızca değişken üretim giderine göre hesaplanmıştır.
