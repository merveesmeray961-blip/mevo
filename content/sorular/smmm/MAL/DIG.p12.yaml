- id: SMMM-MAL-DIG-0056
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: hedef kâr için gerekli birim satış fiyatı
  tip: hesaplama
  zorluk: 2
  kok: KDV dikkate alınmayacaktır. ÇB İşletmesi yeni bir mamul için fiyat belirlemektedir. Birim değişken gider 45 ₺, dönemlik
    sabit giderler 120.000 ₺'dir; dönemde 8.000 birim satış öngörülmektedir. İşletme dönem için 40.000 ₺ faaliyet kârı hedeflemektedir.
    Hedefe ulaşmak için birim satış fiyatı en az kaç ₺ olmalıdır?
  secenekler:
    A: 50 ₺
    B: 60 ₺
    C: 65 ₺
    D: 85 ₺
    E: 110 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Hedef kâr için gerekli toplam katkı payı 120.000 + 40.000 = 160.000 ₺''dir. Birim katkı payı 160.000 / 8.000
      = 20 ₺; birim satış fiyatı = birim değişken gider + birim katkı payı = 45 + 20 = 65 ₺''dir. Püf noktaları: Fiyat bulunurken
      önce sabit gider ve hedef kâr toplanarak satış miktarına bölünür; çıkan sonuç katkı payıdır, değişken gider eklenmeden
      fiyat olmaz.'
    celdiriciler:
      A: Sabit giderler hesaba katılmamıştır; hedef kâr yalnızca değişken giderin üzerine eklenmiştir.
      B: Kâr hedefi hesaba katılmamıştır; bu fiyat yalnızca başabaş noktasını sağlar.
      D: Gereken katkı payı iki kez eklenmiştir.
      E: Birim değişken gider iki kez eklenmiştir.
    hesap_adimlari:
    - Gerekli katkı payı = 120.000 + 40.000 = 160.000
    - Birim katkı = 160.000 / 8.000 = 20
    - Fiyat = 45 + 20 = 65
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Maliyet-hacim-kâr analizi — fiyatlama
    alinti: ''
  gecerlilik: &id001
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 45 + (120000 + 40000) / 8000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Bağımsız çözüm anahtarla aynı; hesap/mevzuat doğrulandı, tek doğru şık.'
