  zorluk: 3
  kok: KDV dikkate alınmayacaktır. OV İşletmesi 10.000 birimlik kapasitesinin tamamını kullanarak mamulünü birim 60 ₺'den
    satmaktadır; birim değişken gider 36 ₺'dir. Bir müşteri 2.000 birimlik özel sipariş için birim 52 ₺ önermektedir. Siparişi
    karşılamak için normal satışlardan aynı miktarda vazgeçilecek ve siparişe özgü 5.000 ₺ ek sabit gider (kalıp bedeli) doğacaktır.
    Siparişin kabul edilmesinin kâr üzerindeki etkisi aşağıdakilerden hangisidir?
  secenekler:
    A: Kâr 21.000 ₺ azalır
    B: Kâr 16.000 ₺ azalır
    C: Kâr 11.000 ₺ azalır
    D: Kâr 27.000 ₺ artar
    E: Kâr 32.000 ₺ artar
  dogru: A
  aciklama:
    dogru_neden: 'Kapasite dolu olduğundan fırsat maliyeti vardır. Siparişin katkı payı 2.000 × (52 − 36) = 32.000 ₺; vazgeçilen
      satışların katkı payı 2.000 × (60 − 36) = 48.000 ₺; ek sabit gider 5.000 ₺. Net etki -21.000 ₺''dir (azalış). Püf noktaları:
      Kapasite doluysa vazgeçilen normal satışın katkı payı fırsat maliyetidir; siparişe özgü sabit gider de karara dahil
      edilir.'
    celdiriciler:
      B: Fırsat maliyeti düşülmüş ancak siparişe özgü ek sabit gider unutulmuştur.
      C: Ek sabit gider kârdan düşülmesi gerekirken ilave edilmiştir.
      D: Ek sabit gider düşülmüş ancak vazgeçilen normal satışların katkı payı (fırsat maliyeti) dikkate alınmamıştır.
      E: Yalnızca siparişin katkı payı dikkate alınmıştır; vazgeçilen normal satışların katkı payı ve ek sabit gider yok sayılmıştır.
    hesap_adimlari:
    - Sipariş katkısı = 32.000
    - Vazgeçilen katkı = 48.000
