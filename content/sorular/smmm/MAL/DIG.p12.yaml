        (5 ₺) kullanılmalıdır.
      C: Sabit gider farkı yalnızca tam otomatik yöntemin birim değişken giderine bölünmüştür; birim değişken gider farkı
        kullanılmalıdır.
      D: Sabit giderler ve değişken giderler toplanarak bölünmüştür; kayıtsızlık noktası farkların oranıyla bulunur.
