      C: Toplam değişken giderlerdir; başabaşta satışlar değişken ve sabit giderlerin toplamına eşittir.
      D: Sabit gider iki katına çıkarılmıştır (hem satıştan hem değişkenden çıkarılmış gibi).
      E: Başabaş noktasındaki satış tutarının kendisidir; sabit gider değildir.
