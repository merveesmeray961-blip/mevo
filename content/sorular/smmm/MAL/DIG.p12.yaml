- id: SMMM-MAL-DIG-0061
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: kıt kaynak (darboğaz) altında ürün karması
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. YG İşletmesi aynı makinede iki mamul üretmektedir. X mamulünün birim katkı payı 36 ₺, makine
    süresi 3 saat, azami talebi 3.000 birimdir; Y mamulünün birim katkı payı 24 ₺, makine süresi 1,50 saat, azami talebi 6.000
    birimdir. Dönemde toplam makine kapasitesi 12.000 saattir. Dönemlik sabit giderler üretim karmasından bağımsızdır. Kârı
    en çok artıracak üretim karmasında toplam katkı payı kaç ₺ olur?
  secenekler:
    A: 156.000 ₺
    B: 162.000 ₺
    C: 180.000 ₺
    D: 192.000 ₺
    E: 252.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Makine saati başına katkı payı: X 36 / 3 = 12 ₺; Y 24 / 1,50 = 16 ₺. Önce Y talep ölçüsünde üretilir: 6.000
      birim × 1,50 saat = 9.000 saat. Kalan 3.000 saatle X mamulünden 1.000 birim üretilir. Toplam katkı payı 6.000 × 24 +
      1.000 × 36 = 180.000 ₺''dir. Püf noktaları: Kıt kaynak varsa sıralama kaynak birimi başına katkı payına göre yapılır;
      talep sınırı dolunca kalan kaynak diğer mamule gider. Sabit gider karmayı değiştirmez.'
    celdiriciler:
      A: Mamuller birim katkı payına göre sıralanmıştır; kıt kaynak makine saati olduğundan sıralama makine saati başına katkı
        payına göre yapılmalıdır.
      B: Kalan kapasitenin yalnızca yarısı ikinci mamule ayrılmıştır.
      D: Tüm makine saatleri en yüksek katkı oranlı mamule ayrılmış, talep sınırı yok sayılmıştır.
      E: Makine kapasitesi sınırı dikkate alınmadan azami talepler üretilmiş sayılmıştır.
    hesap_adimlari:
    - 'Saat başına katkı: X 12, Y 16'
    - 'Y: 6.000 birim, X: 1.000 birim'
    - Toplam katkı = 180.000 ₺
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Kıt kaynak analizi
    alinti: ''
  gecerlilik: *id001
  dogrulama:
    python: sonuc = 6000 * 24 + 1000.0 * 36
  durum: kontrolde
  surum: 1
