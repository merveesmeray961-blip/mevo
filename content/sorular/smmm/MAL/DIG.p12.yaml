- id: SMMM-MAL-DIG-0075
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: TMS 2 kapsamında dış raporlamada maliyetleme yöntemi
  tip: bilgi
  zorluk: 2
  kok: TMS 2 Stoklar standardına göre üretilen stokların finansal tablolarda ölçümünde kullanılacak maliyete ilişkin aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Dönüştürme maliyetlerine, sabit ve değişken genel üretim giderlerinden sistematik dağıtılan tutarlar da dahildir.
    B: Yalnızca değişken genel üretim giderleri stok maliyetine eklenir; sabit olanlar dönem gideridir.
    C: Dönüştürme maliyetleri yalnızca direkt işçilik giderlerinden oluşur; genel üretim giderleri dönem giderine gider.
    D: Sabit genel üretim giderleri fiili üretim düzeyi ne olursa olsun daima fiili üretim miktarına bölünerek dağıtılır.
    E: Üretimle ilgisi olmayan genel yönetim giderleri de her zaman stok maliyetine eklenir.
  dogru: A
  aciklama:
    dogru_neden: 'TMS 2 par. 12''ye göre stokların dönüştürme maliyetleri, direkt işçiliğin yanı sıra ilk madde ve malzemenin
      mamule dönüştürülmesinde katlanılan sabit ve değişken genel üretim giderlerinden sistematik bir şekilde dağıtılan tutarları
      içerir. Bu nedenle dış raporlamada tam (soğurma) maliyetleme esastır. Püf noktaları: Dış raporlamada yalnızca değişken
      maliyetleme yeterli değildir; sabit GÜG de normal kapasiteye göre dağıtılarak stok maliyetine girer.'
    celdiriciler:
      B: TMS 2 par. 12'ye göre dönüştürme maliyetleri hem sabit hem değişken genel üretim giderlerinden sistematik dağıtılan
        tutarları içerir; yalnızca değişken yöntem standarda uygun değildir.
      C: Dönüştürme maliyetleri direkt işçiliğin yanında genel üretim giderlerinden dağıtılan tutarları da içerir.
      D: Sabit genel üretim giderleri normal kapasite esas alınarak dağıtılır; düşük üretim veya atıl kapasite nedeniyle birim
        başına dağıtılan tutar artırılmaz.
      E: Stokların mevcut konumuna ve durumuna getirilmesine katkısı olmayan genel yönetim giderleri stok maliyetine dahil
        edilmez, dönem gideri olur.
