  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: çok ürünlü işletmede başabaş noktası (satış karması)
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. KS İşletmesi A, B ve C mamullerini satmaktadır: A için satış fiyatı 40 ₺, birim değişken
    gider 28 ₺; B için satış fiyatı 60 ₺, birim değişken gider 42 ₺; C için satış fiyatı 90 ₺, birim değişken gider 66 ₺.
    Satışlar A, B, C sırasıyla 3:2:1 birim oranında yapılmakta, dönemlik sabit giderler 192.000 ₺ olmaktadır. Bu satış karması
    sabit kaldığı sürece işletmenin başabaş noktasındaki toplam satış miktarı kaç birimdir?'
  secenekler:
    A: 6.000 birim
    B: 8.000 birim
    C: 10.666,67 birim
    D: 12.000 birim
    E: 16.000 birim
  dogru: D
  aciklama:
    dogru_neden: 'Karma paketin katkı payı 3 × 12 + 2 × 18 + 1 × 24 = 96 ₺''dir. Başabaş paket sayısı 192.000 / 96 = 2.000;
      paket başına 6 birim olduğundan toplam 12.000 birimdir. Püf noktaları: Önce karma paketin ağırlıklı katkı payını bulun;
      çıkan sayı paket sayısıdır, birim sayısı için paket içindeki birim toplamıyla çarpın.'
    celdiriciler:
      A: Yalnızca A mamulünün başabaş miktarıdır; toplam satış miktarı istenmiştir.
      B: Yalnızca en yüksek birim katkı payı (24 ₺) esas alınmıştır; karma birlikte değerlendirilmelidir.
      C: Ürünlerin katkı paylarının basit ortalaması (18 ₺) alınmıştır; satış karması ağırlıkları dikkate alınmamıştır.
      E: Yalnızca en düşük birim katkı payı (12 ₺) esas alınmıştır; karma birlikte değerlendirilmelidir.
    hesap_adimlari:
    - Paket katkı payı = 96
    - Paket sayısı = 192.000 / 96 = 2.000
    - Toplam birim = 2.000 × 6 = 12.000
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Maliyet-hacim-kâr analizi — satış karması
    alinti: ''
