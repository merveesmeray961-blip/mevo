  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: değişken maliyet ve tam maliyet
  tip: hesaplama
  zorluk: 3
  kok: AX İşletmesi dönem başında stoksuzdur. Dönemde 12.000 birim üretmiş ve 10.500 birim satmıştır. Birim satış fiyatı 90
    ₺, sabit GÜG 84.000 ₺'dir. Tam maliyet yöntemine göre dönem kârı 140.000 ₺ bulunmuştur. Aynı verilerle değişken maliyet
    yöntemine göre dönem kârı aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 10.500 ₺ (stoktaki sabit GÜG payı)
    B: 56.000 ₺
    C: 129.500 ₺
    D: 140.000 ₺
    E: 150.500 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Üretim satıştan 1.500 birim fazladır; birim sabit GÜG 84.000 / 12.000 = 7 ₺ olduğundan stoka giren sabit
      GÜG 10.500 ₺''dir. Tam maliyette bu tutar gider yazılmaz, değişken maliyette gider yazılır. Değişken maliyet kârı 140.000
      − 10.500 = 129.500 ₺''dir. Püf noktaları: Satış fiyatı gereksiz veridir; farkı yalnızca stok değişimi ile birim sabit
      GÜG belirler ve tüm sabit GÜG''yi (84.000 ₺) çıkarmak yaygın hatadır. Püf noktaları: Geri hesap ve gereksiz veri (satış
      fiyatı); tüm sabit GÜG''nin değil yalnızca stoktaki payının çıkarılması gerekir.'
    celdiriciler:
      A: 10.500 ₺ yalnızca stoktaki sabit GÜG payıdır (kâr farkı); değişken maliyet kârı için tam maliyet kârından çıkarılmalıdır.
      B: 56.000 ₺, tam maliyet kârından tüm sabit GÜG'nin (84.000 ₺) çıkarılmasıyla bulunur; yalnızca stoktaki pay (10.500
        ₺) çıkarılmalıdır.
      D: Stok arttığı için iki yöntemin kârı aynı değildir; değişken maliyet kârı daha düşüktür.
      E: Stok artışı nedeniyle değişken maliyet kârı tam maliyet kârından düşüktür; fark eklenmemelidir.
    hesap_adimlari:
    - 'Birim sabit GÜG: 84.000 / 12.000 = 7 ₺'
    - 'Stok artışı: 12.000 - 10.500 = 1.500 birim'
    - 'Kâr farkı: 1.500 × 7 = 10.500 ₺'
    - 'Değişken maliyet kârı: 140.000 - 10.500 = 129.500 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 13
    alinti: Her bir üretim birimine dağıtılan sabit genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle
      arttırılmaz. Dağıtılmayan genel giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  gecerlilik:
