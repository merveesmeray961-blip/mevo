    dönem sonu stoka tam maliyet yönteminde fiili üretim üzerinden pay verilir. Tam maliyet yöntemine göre bulunan dönem kârı,
    değişken maliyet yöntemine göre bulunan kârdan ne kadar farklıdır? (KDV dikkate alınmayacaktır.)
