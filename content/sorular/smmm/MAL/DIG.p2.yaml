- id: SMMM-MAL-DIG-0021
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: değişken maliyet ve tam maliyet
  tip: hesaplama
  zorluk: 1
  kok: AB İşletmesi bir mamulün üretiminde birim başına 14 ₺ direkt ilk madde, 10 ₺ direkt işçilik ve 6 ₺ değişken GÜG kullanmaktadır.
    Dönemde 10.000 birim mamul üretilmiş, sabit GÜG 120.000 ₺ olmuştur; ayrıca birim başına 4 ₺ değişken satış gideri vardır.
    Tam maliyet yöntemine (fiili üretim üzerinden) göre mamulün birim maliyeti aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 24 ₺ (14 + 10)
    B: 30 ₺ (14 + 10 + 6)
    C: 42 ₺ (14 + 10 + 6 + 12)
    D: 46 ₺ (14 + 10 + 6 + 12 + 4)
    E: 34 ₺ (14 + 10 + 6 + 4)
  dogru: C
  aciklama:
    dogru_neden: Tam maliyette direkt ilk madde, direkt işçilik, değişken GÜG ve sabit GÜG'nin tamamı mamule yüklenir (TMS
      2 paragraf 12); satış maliyetleri stok maliyetine girmez (paragraf 16(d)). Birim sabit GÜG 120.000 / 10.000 = 12 ₺,
      birim maliyet 14 + 10 + 6 + 12 = 42 ₺'dir.
    celdiriciler:
      A: 24 ₺ yalnızca direkt ilk madde ve direkt işçiliği kapsar; değişken ve sabit GÜG de eklenmelidir.
      B: 30 ₺ sabit GÜG'yi dışlayan değişken maliyettir; tam maliyette sabit GÜG de mamule yüklenir.
      D: Satış maliyetleri TMS 2 paragraf 16(d) uyarınca stok maliyetine dâhil edilmez; 4 ₺ eklenmemelidir.
      E: 34 ₺ (14 + 10 + 6 + 4) doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 42 ₺ (14 + 10 + 6 + 12)
        olarak bulunur.
    hesap_adimlari:
    - 'Birim sabit GÜG: 120.000 / 10.000 = 12 ₺'
    - 'Birim tam maliyet: 14 + 10 + 6 + 12 = 42 ₺ (satış gideri hariç)'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Stokların dönüştürme maliyetleri; direkt işçilik giderleri gibi, üretimle doğrudan ilişkili maliyetleri kapsar.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 16
    alinti: (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 14 + 10 + 6 + 120000 / 10000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: gecti
        not: dogrulama.python doğru şıkla tuttu
        tarih: '2026-11-02'
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        not: 'denetçi: tek doğru, güncel hüküm (Kasım 2026)'
        tarih: '2026-11-02'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-02'
    kim: uretici
    ne: harici teslim MAL_DIG_20261102_1.yaml, satır None
  - tarih: '2026-11-02'
    kim: asistan
    ne: toplu kabul denetimi geçti → kontrolde
  - tarih: '2026-11-02'
    kim: asistan
    ne: 'otomatik kapı: doğru şıkta tek bir sayısal değer okunamadı'
