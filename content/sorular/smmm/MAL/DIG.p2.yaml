  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: tam ve normal maliyet
  tip: hesaplama
  zorluk: 3
  kok: AB İşletmesinin normal kapasitesi 10.000 birim, fiili üretimi 8.000 birimdir. Birim başına değişken üretim maliyeti
    30 ₺, dönem sabit GÜG'si 120.000 ₺'dir. Dönemde 6.000 birim satılmış, dönem başı stok yoktur. Normal maliyet yöntemine
    göre dönem sonu mamul stokunun değeri aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 24.000 ₺
    B: 42.000 ₺ (1.000 × 42)
    C: 84.000 ₺ (2.000 × 42)
    D: 90.000 ₺ (2.000 × 45)
    E: 252.000 ₺ (6.000 × 42)
  dogru: C
  aciklama:
    dogru_neden: 'Sabit GÜG oranı normal kapasiteye göre 120.000 / 10.000 = 12 ₺''dir; birim maliyet 30 + 12 = 42 ₺. Dönem
      sonu stok 8.000 − 6.000 = 2.000 birimdir; değeri 2.000 × 42 = 84.000 ₺''dir (TMS 2 paragraf 13). Atıl kapasite payı
      20.000 ₺ stoka yüklenmez. Püf noktaları: Fiili üretimdeki düşüklük birim maliyeti artırmaz; satılan birim sayısı ise
      stok sorusunda yalnızca kalan miktarı bulmak için kullanılır. Püf noktaları: Düşük üretimde birim sabit gider artırılmaz;
      stok miktarı üretim ve satıştan hesaplanır.'
    celdiriciler:
      A: 24.000 ₺ stoktaki sabit GÜG payının (2.000 × 12) tek başına alınmasıdır; değişken maliyet de eklenmelidir.
      B: 42.000 ₺ stoktaki 1.000 birimin değeridir; stok 2.000 birimdir.
      D: 90.000 ₺ sabit GÜG fiili üretime bölünerek (15 ₺) bulunan tam maliyet değeridir; normal kapasite esas alınmalıdır.
      E: 252.000 ₺ satılan 6.000 birimin maliyetidir; sorulan dönem sonu stok değildir.
    hesap_adimlari:
    - 'Sabit GÜG oranı: 120.000 / 10.000 = 12 ₺'
    - 'Birim maliyet: 30 + 12 = 42 ₺'
    - 'Stok miktarı: 8.000 - 6.000 = 2.000 birim; değeri 84.000 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 13
    alinti: Sabit genel üretim giderleri, üretim tesislerinin normal kapasitesi esas alınarak dönüştürme maliyetlerine dağıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 13
    alinti: Her bir üretim birimine dağıtılan sabit genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle
      arttırılmaz. Dağıtılmayan genel giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
