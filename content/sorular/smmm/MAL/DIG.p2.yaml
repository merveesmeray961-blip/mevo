    dogru_neden: Başabaş miktarı sabit giderlerin birim katkı payına bölünmesiyle bulunur. Birim katkı payı 60 − 36 = 24 ₺;
      başabaş miktarı 72.000 / 24 = 3.000 birimdir. Sabit ve değişken gider ayrımı TMS 2 paragraf 12 tanımlarına dayanır.
    celdiriciler:
      A: 1.200 birim doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 birim (72.000 / 24) olarak bulunur.
      B: 2.000 birim doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 birim (72.000 / 24) olarak bulunur.
      D: 4.500 birim doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 birim olarak bulunur.
      E: 7.200 birim doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 birim olarak bulunur.
    hesap_adimlari:
    - 'Birim katkı payı: 60 - 36 = 24 ₺'
