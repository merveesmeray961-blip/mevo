      Safha ve sipariş maliyeti birlikte maliyet hesaplama sistemlerini oluşturur.
    celdiriciler:
      A: İlk giren ilk çıkar ve hareketli ortalama maliyet stok değerleme yöntemleridir, maliyet hesaplama sistemi
        değildir.
      B: Sipariş maliyeti bir maliyet hesaplama sistemidir ancak ağırlıklı ortalama maliyet stok değerleme yöntemidir.
      C: Safha maliyeti bir maliyet hesaplama sistemidir ancak hareketli ortalama maliyet stok değerleme yöntemidir.
      E: Safha maliyeti bir maliyet hesaplama sistemidir ancak ilk giren ilk çıkar stok değerleme yöntemidir.
