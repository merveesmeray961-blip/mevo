    olarak sayılan yöntemler aşağıdakilerden hangisinde birlikte verilmiştir?
  secenekler:
    A: İlk giren ilk çıkar veya hareketli ortalama maliyet
    B: Ağırlıklı ortalama maliyet veya sipariş maliyeti
    C: Safha maliyeti veya hareketli ortalama maliyet
