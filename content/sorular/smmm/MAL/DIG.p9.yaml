    A: 320.000 TL
    B: 360.000 TL
    C: 400.000 TL
    D: 480.000 TL
    E: 500.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Tam maliyet yönteminde birim maliyet = değişken 80 + (100.000 / 5.000) = 80 + 20 = 100 TL. Satılan mamul
      maliyeti = 4.000 × 100 = 400.000 TL. Püf noktaları: Sabit GÜG üretilen birimlere dağıtılır; satılanlara yüklenir.'
    celdiriciler:
      A: Yalnız değişken maliyeti dikkate alır (değişken maliyet yöntemi).
      B: Sabit GÜG’yi satılan birimlere dağıtarak (100.000/4.000) yanlış hesaplar.
      D: Üretilen tüm birimlerin maliyetini alır.
      E: Sabit GÜG’yi ekleyerek abartır.
    hesap_adimlari:
    - Birim sabit GÜG = 100000 / 5000 = 20
    - Birim tam maliyet = 80 + 20 = 100
    - SMM = 4000 * 100 = 400000
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 0-9 Gider Çeşitleri
    alinti: Gider çeşitleri hesaplarının sabit, değişken ve yarı değişken olarak gruplandırılması mümkündür.
