- id: SMMM-MAL-DIG-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: FIFO ve hareketli ortalama
  tip: hesaplama
  zorluk: 1
  kok: Stok değerlemede hareketli ortalama maliyet yöntemini uygulayan bir işletmenin elinde birim maliyeti 20 ₺
    olan 10 birim mal bulunmaktadır. İşletme sırasıyla birim maliyeti 26 ₺ olan 20 birim mal satın almış, 15 birim
    mal satmış ve birim maliyeti 30 ₺ olan 10 birim mal daha satın almıştır. Birim maliyet her alımdan sonra yeniden
    hesaplandığına göre, son alım sonrası hareketli ortalama birim maliyet kaç TL olur?
  secenekler:
    A: 24,00 ₺
    B: 25,50 ₺
    C: 26,40 ₺
    D: 27,00 ₺
    E: 27,60 ₺
  dogru: C
  aciklama:
    dogru_neden: İlk alımdan sonra ortalama (10×20 + 20×26) / 30 = 24 ₺'dır. 15 birimlik satış birim maliyeti değiştirmez,
      kalan 15 birim 24 ₺'dan 360 ₺ eder. Son alımla toplam 660 ₺ / 25 birim = 26,40 ₺ olur.
    celdiriciler:
      A: 24,00 ₺, son alımın (10 birim × 30 ₺) ortalamaya katılmaması durumunda bulunan değerdir.
      B: 25,50 ₺, satış çıkışı dikkate alınmadan tüm alımların ortalaması (1.020 ₺ / 40 birim) alınarak bulunur.
      D: 27,00 ₺, 24 ₺ ile 30 ₺'nın basit ortalamasıdır; miktar ağırlıkları dikkate alınmamıştır.
      E: 27,60 ₺, satışın ilk girenlerden karşılandığı (FIFO) varsayımıyla bulunur; yöntem hareketli ortalamadır.
    hesap_adimlari:
    - 'İlk alım sonrası: (10×20 + 20×26) / 30 = 720 / 30 = 24 ₺'
    - 'Satış: 15 birim × 24 ₺ = 360 ₺ çıkar; kalan 15 birim = 360 ₺ (birim maliyet 24 ₺ değişmez)'
    - 'Son alım: 10 × 30 = 300 ₺; toplam (360 + 300) / (15 + 10) = 660 / 25 = 26,40 ₺'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:2)
    madde: MSUGT Sıra No:2 — gelir tablosu dipnotu
    alinti: Maliyet hesaplama sistemleri (safha veya sipariş) ve stok değerleme yöntemleri (ağırlıklı ortalama maliyet,
      ilk giren ilk çıkar, hareketli ortalama maliyet vs.. gibi)
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (15 * ((10 * 20 + 20 * 26) / 30) + 10 * 30) / (15 + 10)
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 5).'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R4: tek adımlık ortalama yerine alım-satış-alım içeren hareketli ortalama hesabı yapıldı;
          şıklar tipik hata sonuçları (satış göz ardı, FIFO, basit ortalama); dogrulama güncellendi'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_MAL.yaml, satır ChatGPT_MAL-2026-10-08v2-G14 #5'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → kontrolde (hızlı denetim).'
    neden: kör çözücü (kaynaksız) anahtarla uyuştu
  - tarih: '2026-10-18'
    kim: hakem
    ne: düzeltildi
    neden: 'R4: tek adımlık ortalama yerine alım-satış-alım içeren hareketli ortalama hesabı yapıldı; şıklar tipik
      hata sonuçları (satış göz ardı, FIFO, basit ortalama); dogrulama güncellendi'
- id: SMMM-MAL-DIG-0008
  sinav: smmm
