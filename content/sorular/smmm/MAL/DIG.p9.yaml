  unite: Değişken/tam maliyet
  konu: DIG
  kazanim: değişken
  tip: uygulama
  zorluk: 1
  kok: 'KDV dikkate alınmayacaktır. Üretim işletmesi KL, değişken maliyet yöntemini uygulamaktadır. Dönem içinde
    toplam üretim maliyeti 800.000 ₺ olarak hesaplanmış olup bunun 320.000 ₺''sı sabit genel üretim gideridir. Dönem
    içinde üretilen 4.000 birim mamulün tamamı satılmıştır. Değişken maliyet yöntemine göre dönem sonunda mamul
    stoklarında kalan maliyet kaç TL’dir?

    '
  secenekler:
    A: 0 ₺
    B: 320.000 ₺
    C: 480.000 ₺
    D: 800.000 ₺
    E: 1.120.000 ₺
  dogru: A
  aciklama:
    dogru_neden: 'Değişken maliyet yönteminde sabit genel üretim giderleri dönem gideri olarak kabul edilir ve stoklara
      yüklenmez. Üretilen mamullerin tamamı satıldığı için stokta kalan tutar sıfırdır. Püf noktaları: Değişken
      maliyetle sabit GÜG stoka girmeyeceği için satışların tamamı gerçekleştiğinde stok maliyeti sıfır olur.'
    celdiriciler:
      B: Sabit GÜG’nin stoka yüklendiği varsayımıyla bulunur.
      C: Değişken kısmın (800.000 − 320.000) stoka yüklendiği varsayımıyla bulunur.
      D: Toplam üretim maliyetinin stoka yüklendiği varsayımıyla bulunur.
      E: Sabit ve değişken toplamın yanlış eklenmesiyle bulunur.
    hesap_adimlari:
    - Değişken maliyet yönteminde sabit GÜG dönem gideridir.
    - Üretilenlerin tamamı satıldığı için stok = 0.
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 0-9 Gider Çeşitleri
    alinti: Gider çeşitleri hesaplarının sabit, değişken ve yarı değişken olarak gruplandırılması mümkündür. Gruplar
      içindeki gider çeşitlerinin sabit, değişken ve yarı değişken biçimde ayırımı işletmelerin kendi ihtiyaç ve
      insiyatiflerine bırakılmıştır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 0
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: gecti
        tarih: '2026-10-19'
