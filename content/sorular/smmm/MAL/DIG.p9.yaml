        not: 'c1: A (güven 5); c2: A (güven 5)'
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: baş hakem düzeltmesiyle; yeniden kör çözüme
      G6:
        sonuc: gecti
        tarih: '2026-10-19'
