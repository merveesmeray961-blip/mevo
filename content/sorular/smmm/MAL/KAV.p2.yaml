        direkt maddedir.
      C: 76 grubu mamulün stoklara verilmesinden alıcılara teslimine kadar yapılan giderleri kapsar; üretimde tüketilen kereste
        bu grupta değildir.
      D: 77 grubu işletmenin yönetim fonksiyonuna ilişkin giderleri kapsar; üretimde tüketilen malzeme yönetim gideri değildir.
