  kok: Bir işletmede asal maliyet 760.000 ₺, direkt işçilik 90.000 ₺ ve dönüştürme maliyeti 250.000 ₺'dir. KDV dikkate alınmayacaktır.
    Direkt ilk madde ve malzeme gideri kaç ₺'dir?
  secenekler:
    A: 90.000 ₺
    B: 670.000 ₺
    C: 760.000 ₺
    D: 850.000 ₺
    E: 1.010.000 ₺
  dogru: B
  aciklama:
    dogru_neden: Asal maliyet = Direkt ilk madde + Direkt işçilik olduğundan direkt ilk madde = 760.000 − 90.000 = 670.000
      ₺'dir. Dönüştürme maliyeti bu hesapta gereksiz veridir.
    celdiriciler:
      A: Bu tutar direkt işçiliktir.
      C: Bu tutar asal maliyettir; direkt işçilik düşülmemiştir.
      D: Direkt işçilik asal maliyete eklenmiştir; oysa asal maliyet zaten direkt işçiliği içerir.
      E: Asal ve dönüştürme maliyeti toplanmıştır; bu bir direkt ilk madde değeri değildir.
    hesap_adimlari:
    - DİMM = Asal maliyet − Direkt işçilik
    - 760.000 − 90.000 = 670.000 ₺
  kaynaklar:
  - mevzuat: 1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)
    madde: Satışların Maliyeti Tablosu, A - Direkt İlk Madde ve Malzeme Giderleri
