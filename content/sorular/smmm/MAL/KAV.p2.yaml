    dogru_neden: THP'ye göre 71 grubu, üretilen mamulün bünyesine ana madde olarak katılan ve hangi mamulden ne kadar tüketildiği
      ekonomik bakımdan ayrı izlenebilen ilkmadde ve malzemelerle ilgili gider, yansıtma ve fark hesaplarını kapsar. Kereste
      bu tanıma uyar.
    celdiriciler:
      A: 72 grubu mamule doğrudan yüklenebilen işçilik giderlerini kapsar; malzeme tüketimi işçilik değildir.
