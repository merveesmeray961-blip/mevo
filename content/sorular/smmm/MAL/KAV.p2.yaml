      idare hissesinin katılması ise ihtiyaridir. Zorunlu unsurlar: 640.000 + 180.000 + 90.000 + 30.000 = 940.000 ₺. Püf noktaları:
      "İhtiyari" kalem sorulan tutara dâhil edilmez; pazarlama ve faiz VUK md. 275''in saydığı unsurlar arasında yoktur, gereksiz
      veridir.'
