- id: SMMM-MAL-KAV-0050
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Temel kavramlar ve GÜG kalemleri
  konu: KAV
  kazanim: asal maliyet
  tip: kavrama
  zorluk: 1
  kok: Maliyet unsurlarından direkt ilk madde ve malzeme giderleri ile direkt işçilik giderlerinin toplamına aşağıdakilerden
    hangisi denir?
  secenekler:
    A: Asal maliyet (ana maliyet)
    B: Dönüştürme (işleme) maliyeti
    C: Dönemin üretim giderleri
    D: Genel üretim giderleri
    E: Dönem giderleri
  dogru: A
  aciklama:
    dogru_neden: MSUGT Ek 4'e göre direkt ilk madde ve malzeme ile direkt işçilik, mamulün maliyetine doğrudan yüklenebilen
      unsurlardır; bu iki unsurun toplamı asal (ana) maliyet adını alır.
    celdiriciler:
      B: Dönüştürme maliyeti direkt işçilik ile genel üretim giderlerinin toplamıdır; direkt ilk madde bu toplamda yer almaz.
      C: Dönemin üretim giderleri direkt ilk madde, direkt işçilik ve genel üretim giderlerinin toplamıdır; üç unsuru birlikte
        kapsar.
      D: Genel üretim giderleri direkt ilk madde ve direkt işçilik dışında kalan üretim giderleridir.
      E: Dönem giderleri pazarlama, genel yönetim ve finansman gibi maliyete girmeyen giderlerdir.
  kaynaklar:
  - mevzuat: 1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)
    madde: Satışların Maliyeti Tablosu, A - Direkt İlk Madde ve Malzeme Giderleri
    alinti: 'A _ Direkt İlk Madde ve Malzeme Giderleri : Mamülün bünyesine giren mamülün temel öğesini oluşturan ve mamülün
      bünyesine doğrudan yüklenebilen maddelerin kullanımı bu grupta yer alır. Üretimde kullanılmayan ve satılan ilk madde
      ve malzemenin maliyeti, tablonun ticari faaliyete ilişkin bölümünde dikkate alınır.'
  - mevzuat: 1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)
    madde: Satışların Maliyeti Tablosu, B - Direkt İşçilik Giderleri
    alinti: 'B _ Direkt İşçilik Giderleri : Mamülü meydana getirmek için harcanan ve maliyetlere doğrudan yüklenebilen direkt
      işçilik giderlerini içerir.'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
