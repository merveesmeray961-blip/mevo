    ekonomik olarak ayrı izlenebilen direkt ilk madde olarak değerlendirmektedir. Tekdüzen Hesap Planına göre bu kerestenin
    üretimde kullanım gideri hangi hesap grubunda izlenir?
  secenekler:
    A: 72 Direkt İşçilik Giderleri
