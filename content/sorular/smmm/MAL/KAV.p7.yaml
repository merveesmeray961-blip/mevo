        asal maliyete eklenmiştir.'
      D: '890.000: İlkmadde kullanımı yerine dönem içi alım tutarı (560.000 ₺) esas alınmıştır (560.000 + 330.000).'
      E: '950.000: Üretim bölümünün toplam işçilik gideri (450.000 ₺) direkt işçilik sayılmıştır; bakım-onarım ile
        temizlik-ambar işçilikleri genel üretim giderleridir (500.000 + 450.000).'
    hesap_adimlari:
    - 'İlkmadde kullanımı: 120.000 + 560.000 − 180.000 = 500.000 ₺'
    - 'Direkt işçilik (yalnız makine başı işçiler): 330.000 ₺'
    - Bakım-onarım (70.000), temizlik-ambar (50.000) işçiliği ve yağ-temizlik malzemesi (40.000) GÜG'dür; satış
      primi (25.000) maliyete girmez
    - 'Asal maliyet: 500.000 + 330.000 = 830.000 ₺'
