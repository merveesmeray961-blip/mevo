    celdiriciler:
      A: Pazarlama ve genel yönetim giderleri kaynak metindeki 151 hesabının maliyet unsurları arasında sayılmamıştır.
      D: Satış ve finansman giderleri 151 hesabının maliyet unsurları arasında yer almaz.
      E: Genel yönetim ve pazarlama giderleri 151 hesabının açıklamasındaki üretim maliyeti unsurları değildir.
