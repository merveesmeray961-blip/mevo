  kok: 'YT İşletmesi, imal ettiği mamulün maliyet bedelini Vergi Usul Kanunu''nun 275. maddesinde sayılan unsurlardan ihtiyari
    olanları dışarıda bırakarak belirlemek istemektedir. Mamulün ambalajlı olarak piyasaya arz edilmesi zorunludur. Cari dönemde
    üretilen mamule ilişkin veriler şöyledir:


    - Mamulün bünyesine giren ve doğrudan yüklenebilen ilk madde ve malzeme: 420.000 TL

    - Mamule isabet eden direkt işçilik: 260.000 TL

    - Genel üretim giderlerinden mamule düşen pay: 140.000 TL

    - Genel yönetim giderlerinden mamule düşen pay: 40.000 TL

    - Ambalaj malzemesi bedeli: 30.000 TL

    - Pazarlama, satış ve dağıtım giderleri: 55.000 TL

    - İşletme sermayesi ihtiyacı için kullanılan genel kredilerin faiz giderleri: 25.000 TL


    Buna göre mamulün VUK md. 275 uyarınca belirlenebilecek en düşük maliyet bedeli kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: '820.000'
    B: '850.000'
    C: '890.000'
    D: '945.000'
    E: '970.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 275''e göre imal edilen mamulün maliyet bedeli; ilk madde bedelini, mamule isabet eden işçiliği,
      genel imal giderlerinden mamule düşen payı ve ambalajlı olarak piyasaya arz edilmesi zorunlu mamullerde ambalaj malzemesinin
      bedelini içerir. Genel idare (yönetim) giderlerinden mamule düşen payın maliyete katılması ise ihtiyaridir; bu nedenle
      en düşük maliyet bedeline dahil edilmez. Pazarlama, satış ve dağıtım giderleri md. 275''teki unsurlar arasında yer almaz
      ve Tekdüzen Hesap Planı''nda satışın fonksiyonel gideri olarak (760) izlenir; işletme sermayesi için kullanılan genel
      kredilerin faizi de üretimle ilişkilendirilmeyen finansman gideridir (780). En düşük maliyet bedeli = 420.000 + 260.000
      + 140.000 + 30.000 = 850.000 TL.


