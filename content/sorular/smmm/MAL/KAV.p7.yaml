  aciklama:
    dogru_neden: 'Asal maliyet = direkt ilkmadde ve malzeme + direkt işçilik. İlkmadde kullanımı 120.000 + 560.000
      − 180.000 = 500.000 ₺''dır. Direkt işçilik, belli bir mamule dağıtım anahtarına gerek duyulmadan doğrudan
      yüklenebilen işçiliktir (THP 720); bu nedenle yalnızca makine başı işçilerin 330.000 ₺''sı alınır. Bakım-onarım
      ve temizlik-ambar işçilikleri ile mamulün bünyesine girmeyen yağ ve temizlik malzemesi, dağıtım yoluyla yüklenebilen
      genel üretim giderleridir (THP 730). Satış elemanı primi ise üretim maliyetine hiç girmez. Asal maliyet =
      500.000 + 330.000 = 830.000 ₺.


