      belirtilmiştir. Püf noktaları: Gider yeri yalnızca üretim salonu değildir; hizmet ve maliyet oluşan diğer örgütsel birimler
      de kapsama girebilir.'
    celdiriciler:
      A: D bölümünde maliyet oluşmadığı açıkça verildiği için kaynak tanımını karşılamaz.
      C: Kaynak gider yerini yalnızca ana üretim birimiyle sınırlamamaktadır.
      D: A ve C de kaynakta belirtilen üretim/hizmet ve maliyet oluşumu ölçütlerini karşılayabilir; D karşılamaz.
      E: Kaynak tanımı gider yerini genel yönetim birimleriyle sınırlamamaktadır.
