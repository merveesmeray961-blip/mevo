    direkt işçilik giderlerinin toplamıdır. İşletmenin dönem verileri şöyledir:


    - Dönem başı ilkmadde stoku 120.000 ₺, dönem içi ilkmadde alımları 560.000 ₺, dönem sonu ilkmadde stoku 180.000
    ₺''dır. İlkmaddelerin tamamı mamulün bünyesine girmiş; dönem içinde ilkmadde satışı veya iadesi olmamıştır.

    - Üretim bölümünün işçilik giderleri toplamı 450.000 ₺''dır. Bunun 330.000 ₺''sı makine başında mamulü doğrudan
    şekillendiren işçilere, 70.000 ₺''sı bakım-onarım işçilerine, 50.000 ₺''sı temizlik ve ambar işçilerine aittir.

    - Mamulün bünyesine girmeyen yağ ve temizlik malzemesi kullanımı 40.000 ₺, satış elemanlarına ödenen prim 25.000
    ₺''dır.


    KDV dikkate alınmayacaktır. Dönem asal maliyeti kaç TL''dir?'
