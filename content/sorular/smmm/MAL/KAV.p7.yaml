  konu: KAV
  kazanim: maliyet unsurları
  tip: hesaplama
  zorluk: 3
  kok: 'YT İşletmesi, imal ettiği mamulün maliyet bedelini Vergi Usul Kanunu''nun 275. maddesinde sayılan unsurlardan
    ihtiyari olanları dışarıda bırakarak belirlemek istemektedir. Mamulün ambalajlı olarak piyasaya arz edilmesi
    zorunludur. Cari dönemde üretilen mamule ilişkin veriler şöyledir:


    - Mamulün bünyesine giren ve doğrudan yüklenebilen ilk madde ve malzeme: 420.000 ₺

    - Mamule isabet eden direkt işçilik: 260.000 ₺

    - Genel üretim giderlerinden mamule düşen pay: 140.000 ₺

    - Genel yönetim giderlerinden mamule düşen pay: 40.000 ₺

    - Ambalaj malzemesi bedeli: 30.000 ₺

    - Pazarlama, satış ve dağıtım giderleri: 55.000 ₺

    - İşletme sermayesi ihtiyacı için kullanılan genel kredilerin faiz giderleri: 25.000 ₺


    Buna göre mamulün VUK md. 275 uyarınca belirlenebilecek en düşük maliyet bedeli kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: '820.000'
    B: '850.000'
    C: '890.000'
    D: '945.000'
    E: '970.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 275''e göre imal edilen mamulün maliyet bedeli; ilk madde bedelini, mamule isabet eden
      işçiliği, genel imal giderlerinden mamule düşen payı ve ambalajlı olarak piyasaya arz edilmesi zorunlu mamullerde
      ambalaj malzemesinin bedelini içerir. Genel idare (yönetim) giderlerinden mamule düşen payın maliyete katılması
      ise ihtiyaridir; bu nedenle en düşük maliyet bedeline dahil edilmez. Pazarlama, satış ve dağıtım giderleri
      md. 275''teki unsurlar arasında yer almaz ve Tekdüzen Hesap Planı''nda satışın fonksiyonel gideri olarak (760)
      izlenir; işletme sermayesi için kullanılan genel kredilerin faizi de üretimle ilişkilendirilmeyen finansman
      gideridir (780). En düşük maliyet bedeli = 420.000 + 260.000 + 140.000 + 30.000 = 850.000 ₺.


      Püf noktaları: Soruda iki ayrı ayrım yapılması gerekir. Birincisi, md. 275''in içinde bulunan ama ihtiyari
      olan unsur (genel yönetim payı) ile zorunlu unsurların (özellikle ambalaj bedeli) ayrılmasıdır; kökte ambalajlı
      arzın zorunlu olduğu belirtildiği için ambalaj bedeli maliyete girer. İkincisi, md. 275''te hiç yer almayan
      kalemlerin (pazarlama ve genel kredi faizi) maliyete katılmamasıdır.'
    celdiriciler:
      A: '820.000: Ambalaj malzemesi bedeli unutulmuştur (420.000 + 260.000 + 140.000). Ambalajlı arzı zorunlu mamullerde
        ambalaj bedeli md. 275/5 uyarınca maliyet bedeline girer.'
      C: '890.000: İhtiyari olan genel yönetim payı (40.000 ₺) maliyete eklenmiştir; en düşük maliyet bedeli hesaplanırken
        ihtiyari unsur dahil edilmez.'
      D: '945.000: Genel yönetim payına ek olarak pazarlama, satış ve dağıtım giderleri (55.000 ₺) de maliyete katılmıştır;
        bu gider md. 275''te sayılan unsurlar arasında yoktur.'
      E: '970.000: Genel yönetim payı, pazarlama giderleri ve genel kredi faizi (25.000 ₺) maliyete katılmıştır;
        hiçbiri md. 275''in zorunlu unsurları değildir.'
    hesap_adimlari:
    - 'İlk madde: 420.000 ₺'
    - 'Mamule isabet eden işçilik: 260.000 ₺'
    - 'Genel imal giderlerinden pay: 140.000 ₺'
    - 'Ambalaj malzemesi bedeli (ambalajlı arz zorunlu): 30.000 ₺'
    - İhtiyari genel yönetim payı, pazarlama giderleri ve genel kredi faizi dahil edilmez
    - 'Toplam: 420.000 + 260.000 + 140.000 + 30.000 = 850.000 ₺'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 275/1-5
    alinti: 'İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder:
      1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik;
      3. Genel imal giderlerinden mamule düşen hisse; … 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin
      mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde
      ambalaj malzemesinin bedeli.'
