  kok: 'ÖK İşletmesi, mamul üretiminde 7/A seçeneğini uygulamaktadır. Asal maliyet, direkt ilkmadde ve malzeme ile direkt
    işçilik giderlerinin toplamıdır. İşletmenin dönem verileri şöyledir:


    - Dönem başı ilkmadde stoku 120.000 TL, dönem içi ilkmadde alımları 560.000 TL, dönem sonu ilkmadde stoku 180.000 TL''dir.
    İlkmaddelerin tamamı mamulün bünyesine girmiş; dönem içinde ilkmadde satışı veya iadesi olmamıştır.

    - Üretim bölümünün işçilik giderleri toplamı 450.000 TL''dir. Bunun 330.000 TL''si makine başında mamulü doğrudan şekillendiren
    işçilere, 70.000 TL''si bakım-onarım işçilerine, 50.000 TL''si temizlik ve ambar işçilerine aittir.

    - Mamulün bünyesine girmeyen yağ ve temizlik malzemesi kullanımı 40.000 TL, satış elemanlarına ödenen prim 25.000 TL''dir.


    KDV dikkate alınmayacaktır. Dönem asal maliyeti kaç TL''dir?'
