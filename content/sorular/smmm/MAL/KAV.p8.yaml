    TL genel yönetim gideri oluşmuştur. Bu soruda asal maliyet, direkt ilk madde ve malzeme ile direkt işçilik giderlerinin
    toplamı olarak kabul edilecektir. Buna göre birim başına asal maliyet kaç TL'dir?
