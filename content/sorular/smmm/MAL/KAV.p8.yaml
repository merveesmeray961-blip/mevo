- id: SMMM-MAL-KAV-0025
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Temel kavramlar ve GÜG kalemleri
  konu: KAV
  kazanim: dönüştürme maliyeti
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. Bu soruda asal maliyet, direkt ilk madde ve malzeme ile direkt işçilik giderlerinin
    toplamı; dönüştürme maliyeti ise direkt işçilik ile genel üretim giderlerinin toplamı olarak kabul edilmektedir.
    Bir işletmede asal maliyet 640.000 TL, dönüştürme maliyeti 560.000 TL, genel üretim giderleri 235.000 TL ve
    genel yönetim giderleri 40.000 TL'dir. Buna göre direkt ilk madde ve malzeme gideri kaç TL'dir?
  secenekler:
    A: 80.000 TL
    B: 235.000 TL
    C: 315.000 TL
    D: 325.000 TL
    E: 405.000 TL
  dogru: C
  aciklama:
    dogru_neden: Dönüştürme maliyeti = direkt işçilik + genel üretim giderleri olduğundan direkt işçilik 560.000
      − 235.000 = 325.000 TL'dir. Asal maliyet = direkt ilk madde ve malzeme + direkt işçilik olduğundan direkt
      ilk madde ve malzeme 640.000 − 325.000 = 315.000 TL'dir. Genel yönetim gideri hesaba katılmaz.
    celdiriciler:
      A: 80.000 TL, asal maliyet ile dönüştürme maliyeti arasındaki farktır (640.000 − 560.000); bu fark direkt
        ilk madde ile genel üretim gideri farkını gösterir.
      B: 235.000 TL, genel üretim giderinin kendisidir; direkt ilk madde tutarı değildir.
      D: 325.000 TL, direkt işçilik tutarıdır; direkt ilk madde için bu tutar asal maliyetten düşülmelidir.
      E: 405.000 TL, asal maliyetten doğrudan genel üretim giderinin düşülmesiyle bulunur; direkt işçilik hesaba
        katılmamıştır.
    hesap_adimlari:
    - Direkt işçilik = dönüştürme maliyeti − genel üretim giderleri = 560.000 − 235.000 = 325.000 TL
    - Direkt ilk madde ve malzeme = asal maliyet − direkt işçilik = 640.000 − 325.000 = 315.000 TL
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 72. Direkt İşçilik Giderleri
    alinti: 'Bu grup bir mal veya hizmetin üretim maliyetine doğrudan doğruya verilebilen işçilik

      giderleri ile ilgili gider, yansıtma ve fark hesaplarından oluşur.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 73. Genel Üretim Giderleri
    alinti: 'Bu grup işletmenin üretimi ve bu üretime bağlı hizmetler için yapılan direkt ilk madde ve

      malzeme ve direkt işçilik dışında kalan giderlerle ilgili gider, yansıtma ve fark hesaplarından

