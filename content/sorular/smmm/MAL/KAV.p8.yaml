- id: SMMM-MAL-KAV-0022
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Temel kavramlar ve GÜG kalemleri
  konu: KAV
  kazanim: asal maliyet
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. AL İşletmesi üretiminde 310.000 TL direkt ilk madde ve malzeme, 210.000 TL direkt işçilik
    ve 120.000 TL genel üretim gideri kullanmıştır. Ayrıca 35.000 TL genel yönetim gideri bulunmaktadır. Bu soruda asal maliyet,
    direkt ilk madde ve malzeme ile direkt işçilik giderlerinin toplamı olarak kabul edilecektir. Buna göre asal maliyet kaç
    TL'dir?
  secenekler:
    A: 485.000 TL
    B: 520.000 TL
    C: 555.000 TL
    D: 640.000 TL
    E: 675.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Asal maliyet yalnız direkt ilk madde ve malzeme ile direkt işçilikten oluşur. 310.000 + 210.000 = 520.000
      TL''dir. Genel üretim ve genel yönetim giderleri bu hesaplamaya dahil edilmez. Püf noktaları: GÜG üretim maliyetinin
      bir unsuru olsa da kökte tanımlanan asal maliyete eklenmez; genel yönetim gideri ise ayrıca maliyet kapsamı dışında
      tutulmuştur.'
    celdiriciler:
      A: 485.000 TL, 35.000 TL genel yönetim giderinin yanlış yönde düşülmesiyle elde edilir.
      C: 555.000 TL, 35.000 TL genel yönetim giderinin asal maliyete eklenmesiyle elde edilir.
      D: 640.000 TL, direkt ilk madde ve malzeme ile direkt işçiliğe 120.000 TL GÜG eklenmesiyle bulunur.
      E: 675.000 TL, üç üretim maliyeti unsuruna 35.000 TL genel yönetim giderinin de eklenmesiyle bulunur.
    hesap_adimlari:
    - 'Direkt ilk madde ve malzeme: 310.000 TL'
    - 'Direkt işçilik: 210.000 TL'
    - Asal maliyet = 310.000 + 210.000 = 520.000 TL
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 151. Yarı Mamuller-Üretim
    alinti: 'Maliyet dönemi sonunda direkt ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri

      tutarları kadar bu hesap borçlandırılır. Üretimi tamamlananların maliyet tutarı bu hesabın

      alacağı karşılığında ilgili stok hesaplarına aktarılır.'
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 72. Direkt İşçilik Giderleri
    alinti: 'Bu grup bir mal veya hizmetin üretim maliyetine doğrudan doğruya verilebilen işçilik

      giderleri ile ilgili gider, yansıtma ve fark hesaplarından oluşur.'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 310000 + 210000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 5).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
