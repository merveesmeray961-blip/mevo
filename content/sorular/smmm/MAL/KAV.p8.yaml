  kok: KDV dikkate alınmayacaktır. Bu soruda dönüştürme maliyeti, direkt işçilik ile genel üretim giderlerinin toplamı olarak
    kabul edilmektedir. Bir işletmede dönüştürme maliyeti 560.000 TL, genel üretim giderleri 235.000 TL ve genel yönetim giderleri
    40.000 TL'dir. Buna göre direkt işçilik gideri kaç TL'dir?
  secenekler:
    A: 285.000 TL
    B: 315.000 TL
    C: 325.000 TL
    D: 365.000 TL
    E: 395.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Kökte verilen tanıma göre dönüştürme maliyeti = direkt işçilik + genel üretim giderleridir. 560.000 = direkt
      işçilik + 235.000 olduğundan direkt işçilik 325.000 TL''dir. Genel yönetim gideri hesaba katılmaz. Püf noktaları: Sonuçtan
      bilinen GÜG''yi geri çıkarmak gerekir; genel yönetim giderinin verilmesi ise üretim maliyeti ile dönem giderini karıştırma
      tuzağıdır.'
    celdiriciler:
      A: 285.000 TL, 560.000 TL'den GÜG yerine 275.000 TL'lik farklı bir tutarın çıkarılmasıyla oluşur.
      B: 315.000 TL, GÜG'nin 245.000 TL olduğu varsayımına dayanan yakın bir hesap hatasıdır.
      D: 365.000 TL, genel yönetim giderinin de dönüştürme maliyetinden düşülmesiyle elde edilir.
      E: 395.000 TL, GÜG'nin yerine genel yönetim giderinin eklenmesiyle oluşan ters yönlü bir hatadır.
    hesap_adimlari:
    - Dönüştürme maliyeti = 560.000 TL
    - Genel üretim giderleri = 235.000 TL
    - Direkt işçilik = 560.000 − 235.000 = 325.000 TL
  kaynaklar:
