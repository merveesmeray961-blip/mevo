  kok: 'Muhasebe bilgi sisteminin işletme faaliyetleri ve karar alma sürecindeki işlevine ilişkin aşağıdaki üç ifade verilmiştir:

    I. İşletmenin faaliyet ve sonuçları konusunda bilgi kaynağı olarak muhasebe kayıt ve belgeleri ile bunlara dayanılarak
    hazırlanmış mali tablolar esas alınır.

    II. Karar alma durumunda bulunan ilgililerin kararlarında öne çıkan nitelik, muhasebe bilgilerinin sağlıklı ve mukayese
    edilebilir olmasıdır.

    III. Tekdüzen hesap planı uygulaması, mali tablolar aracılığıyla sunulan bilgilerin denetlenmesinin gerekli olduğu hallerde
    denetimin iş yükünü azaltıp kolaylaştırabilir.

    Buna göre, yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'I, II ve III kaynak metindeki muhasebe bilgilerinin kaynağı, karar alma bakımından niteliği ve tekdüzen
      hesap planının denetime etkisine ilişkin açıklamalarla uyumludur. Püf noktaları: Muhasebe bilgi sistemini yalnız kayıt
      tutma olarak değil, doğru ve karşılaştırılabilir bilginin ilgililere sunulması ve denetlenebilirliği açısından birlikte
      değerlendirin.'
    celdiriciler:
      A: I doğru olmasına rağmen II ve III de kaynak metinde açıkça belirtilmiştir.
      B: II doğru olmakla birlikte I ve III de düzenlemenin niteliği ve etkileri kapsamında yer almaktadır.
      C: I ve II doğru olsa da III de tekdüzen hesap planının denetim iş yüküne etkisini doğru ifade eder.
      D: II ve III doğru olsa da I, işletme faaliyetleri ve sonuçları konusunda bilgi kaynağını doğru belirtmektedir.
  kaynaklar:
