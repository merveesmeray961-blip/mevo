      A: 40.000 TL, 240.000 TL ile 200.000 TL arasındaki farktır; kökteki 190.000 TL kullanılmamıştır.
      C: 60.000 TL, 240.000 TL'den 180.000 TL çıkarılmasıyla bulunur; verilen alacak tutarı 190.000 TL'dir.
      D: 190.000 TL, 700 hesabına kaydedilen alacak tutarıdır; net borç bakiyesi değildir.
      E: 240.000 TL, dönem içindeki borç toplamıdır; dönem sonundaki 190.000 TL alacak kaydı düşülmemiştir.
    hesap_adimlari:
    - 700 borç toplamı = 240.000 TL.
    - 700 alacak toplamı = 190.000 TL.
    - 700 borç bakiyesi = 240.000 − 190.000 = 50.000 TL.
