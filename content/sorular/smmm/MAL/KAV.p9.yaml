  kok: 'Muhasebe bilgi sisteminin işletme faaliyetleri ve karar alma sürecindeki işlevine ilişkin aşağıdaki üç ifade
    verilmiştir:

    I. İşletmenin faaliyet ve sonuçları konusunda bilgi kaynağı olarak muhasebe kayıt ve belgeleri ile bunlara dayanılarak
    hazırlanmış mali tablolar esas alınır.

    II. Karar alma durumunda bulunan ilgililerin kararlarında öne çıkan nitelik, muhasebe bilgilerinin sağlıklı
    ve mukayese edilebilir olmasıdır.

    III. Tekdüzen hesap planı uygulaması, mali tablolar aracılığıyla sunulan bilgilerin denetlenmesinin gerekli
    olduğu hallerde denetimin iş yükünü azaltıp kolaylaştırabilir.

