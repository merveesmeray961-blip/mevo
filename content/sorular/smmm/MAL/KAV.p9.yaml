    Muhasebesi Bağlantı Hesabı'na toplam 240.000 TL borç kaydedilmiştir. Dönem sonunda maliyet muhasebesinin genel muhasebeye
    bildirdiği 190.000 TL tutar, 700 hesabının alacağına kaydedilmiştir. Başka bir işlem bulunmadığına göre 700 hesabının
