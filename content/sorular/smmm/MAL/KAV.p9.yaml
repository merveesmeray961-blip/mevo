  konu: KAV
  kazanim: dönüştürme maliyeti
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. ZR İşletmesi''nin dönem üretim maliyeti toplamı 980.000 TL''dir. Bu tutarın 320.000 TL''si
    direkt ilkmadde ve malzeme, 280.000 TL''si genel üretim giderleridir. Buna göre dönüştürme maliyeti kaç TL''dir?

    '
  secenekler:
    A: '320.000'
    B: '280.000'
    C: '600.000'
    D: '660.000'
    E: '380.000'
  dogru: D
  aciklama:
    dogru_neden: Dönüştürme maliyeti = Direkt işçilik + Genel üretim giderleri. Üretim maliyeti = DİMM + Dİ + GÜG = 980.000.
      DİMM = 320.000, GÜG = 280.000 → Dİ = 980.000 − 320.000 − 280.000 = 380.000. Dönüştürme = 380.000 + 280.000 = 660.000
      TL.
    celdiriciler:
      A: Yalnız DİMM'i alarak dönüştürme maliyetini karıştırmıştır.
      B: Yalnız GÜG'ü almıştır.
      C: DİMM + GÜG toplamını alarak asal maliyetle karıştırmıştır.
      E: Yalnız Dİ'yi hesaplayıp dönüştürme sanmıştır.
    hesap_adimlari:
    - Dİ = Üretim maliyeti − DİMM − GÜG = 980.000 − 320.000 − 280.000 = 380.000 TL
    - Dönüştürme maliyeti = Dİ + GÜG = 380.000 + 280.000 = 660.000 TL
