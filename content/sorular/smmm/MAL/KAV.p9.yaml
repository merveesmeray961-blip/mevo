    alinti: İşletmelerin faaliyet ve sonuçları konusunda bilgi kaynağı ise o işletmenin muhasebe kayıt ve belgeleri
      ile bunlara dayanılarak hazırlanmış mali tablolardır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1)
    madde: III _ DÜZENLEMENİN NİTELİĞİ
    alinti: Muhasebe bilgilerinin sunulduğu mali tablolara dayanılarak karar alma durumunda bulunan ilgililerin
