      dayanılarak hazırlanmış mali tablolardır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1)
    madde: III _ DÜZENLEMENİN NİTELİĞİ
    alinti: Muhasebe bilgilerinin sunulduğu mali tablolara dayanılarak karar alma durumunda bulunan ilgililerin karar almalarında
      en önemli etken, bu bilgilerin sağlıklı ve mukayese edilebilir nitelikte olmasıdır.
