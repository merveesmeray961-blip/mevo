- id: SMMM-MAL-KAV-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: KAV
  kazanim: Dönüştürme maliyeti
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: 'D İşletmesi''nin dönem içinde katlandığı giderler şöyledir: direkt ilk madde ve malzeme 300.000 ₺, direkt
    işçilik 200.000 ₺, endirekt malzeme 40.000 ₺, endirekt işçilik 60.000 ₺, fabrika binası amortismanı 50.000 ₺,
    fabrika enerji gideri 30.000 ₺, genel yönetim giderleri 70.000 ₺, finansman giderleri 20.000 ₺. KDV dikkate
    alınmayacaktır. Buna göre D İşletmesi''nin dönüştürme maliyeti kaç ₺''dir?'
  secenekler:
    A: '380.000'
    B: '450.000'
    C: '470.000'
    D: '500.000'
    E: '680.000'
  dogru: A
  aciklama:
    dogru_neden: 'Dönüştürme maliyeti, direkt işçilik ile genel üretim giderlerinin toplamıdır (TMS 2 par. 12).
      Genel üretim giderleri endirekt malzeme, endirekt işçilik, fabrika amortismanı ve fabrika enerjisinden oluşur:
      40.000 + 60.000 + 50.000 + 30.000 = 180.000 ₺. Dönüştürme maliyeti 200.000 + 180.000 = 380.000 ₺''dir. Genel
      yönetim ve finansman giderleri üretim maliyetine girmez.'
    hesap_adimlari:
    - 'Genel üretim giderleri: 40.000 + 60.000 + 50.000 + 30.000 = 180.000 ₺'
    - Dönüştürme maliyeti = Direkt işçilik + GÜG = 200.000 + 180.000 = 380.000 ₺
    celdiriciler:
      B: 450.000 ₺, genel yönetim giderlerinin (70.000) genel üretim giderlerine katılmasıyla bulunur; bu gider
        üretimle ilgili değildir.
      C: 470.000 ₺, genel yönetim (70.000) ve finansman giderlerinin (20.000) maliyete katılmasıyla bulunur; ikisi
        de dönem gideridir.
      D: '500.000 ₺ asal (ilk) maliyettir: direkt ilk madde ve malzeme + direkt işçilik (300.000 + 200.000). Dönüştürme
        maliyetiyle karıştırılmıştır.'
      E: 680.000 ₺ dönem üretim maliyetidir (300.000 + 200.000 + 180.000); dönüştürme maliyetine direkt ilk madde
        ve malzeme girmez.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Stokların dönüştürme maliyetleri; direkt işçilik giderleri gibi, üretimle doğrudan ilişkili maliyetleri
      kapsar. Bu maliyetler ayrıca ilk madde ve malzemenin mamule dönüştürülmesinde katlanılan sabit ve değişken
      genel üretim giderlerinden sistematik bir şekilde dağıtılan tutarları da içerir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(c)
    alinti: (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri,
  dogrulama:
    python: 'gug = 40000 + 60000 + 50000 + 30000

      sonuc = 200000 + gug

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS 2 atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic TMS 2'nin RG'de yeniden yayım tarihine
      (2018-05-24) çekildi.
    neden: Terim tutarlılığı (TMS'de birim paragraftır); baslangic soru üretim tarihiydi.
- id: SMMM-MAL-KAV-0002
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: KAV
  kazanim: Genel üretim gideri kalemleri
  tip: kavrama
  zorluk: 2
  soru_bicimi: oncullu
  kok: 'Bir üretim işletmesinde dönem içinde aşağıdaki giderler oluşmuştur:

    I. Fabrika binasının amortismanı,

    II. Üretim bölümünde çalışan ustabaşının ücreti,

    III. Genel müdürlük binasının kirası,

    IV. İşletmenin kullandığı işletme kredisinin faizi,

    V. Üretim makinelerinde kullanılan yağlama malzemesi.

    Bu giderlerden hangileri genel üretim giderleri arasında yer alır?'
  secenekler:
    A: I ve II
    B: I ve V
    C: II, III ve V
    D: I, II ve IV
    E: I, II ve V
  dogru: E
  aciklama:
    dogru_neden: TMS 2 par. 12'ye göre genel üretim giderleri; fabrika amortismanı gibi sabit dolaylı üretim maliyetleri
      ile endirekt malzeme ve endirekt işçilik gibi değişken dolaylı üretim maliyetlerinden oluşur. Fabrika binası
      amortismanı (I), ustabaşı ücreti (II, endirekt işçilik) ve yağlama malzemesi (V, endirekt malzeme) genel üretim
      gideridir. Genel müdürlük kirası (III) genel yönetim gideridir ve TMS 2 par. 16(c) uyarınca stok maliyetine
      girmez. İşletme kredisi faizi (IV) MSUGT THP 66 Finansman Giderleri tanımına göre varlıkların maliyetine eklenmemiş
      bir finansman gideridir; borçlanma maliyetlerinin stok maliyetine girebileceği sınırlı koşulları TMS 2 par.
      17'nin yollamasıyla TMS 23 belirler.
    celdiriciler:
      A: 'Eksiktir: üretimde kullanılan yağlama malzemesi (V) endirekt malzemedir ve genel üretim gideridir.'
      B: 'Eksiktir: ustabaşının ücreti (II) endirekt işçilik olarak genel üretim gideridir.'
      C: Genel müdürlük binasının kirası (III) genel yönetim gideridir; ayrıca fabrika binası amortismanı (I) dışarıda
        bırakılmıştır.
      D: İşletme kredisinin faizi (IV) finansman gideridir, genel üretim gideri değildir; yağlama malzemesi (V)
        de eksik bırakılmıştır.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile
      üretim sürecinde yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit
      kalan dolaylı üretim maliyetleri ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir. Değişken genel
      üretim giderleri, endirekt (dolaylı) malzeme ve endirekt (dolaylı) işçilik gibi, üretim miktarı ile birlikte
      doğru orantılı olarak değişen dolaylı üretim maliyetleridir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(c)
    alinti: (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri,
  - mevzuat: TMS 2 Stoklar
    madde: par. 17
    alinti: TMS 23 Borçlanma Maliyetleri, borçlanma maliyetlerinin stokların maliyetine dâhil edildiği sınırlı koşulları
      belirler.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 66 Finansman Giderleri (-) (grup açıklaması)
    alinti: İşletmenin borçlandığı tutarlarla ilgili olarak katlanılan ve varlıkların maliyetine eklenmemiş bulunan
      faiz, kur farkları, kredi komisyonları ve benzeri diğer giderleri kapsar.
  gecerlilik:
    baslangic: '2019-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: TMS 2 md. 16(c)–(d) ile md. 17'yi birleştiren alıntı ayrı kaynak girdilerine bölündü (md. 16(c), md. 17);
      finansman giderinin dışlanması için MSUGT THP 66 alıntısı eklendi ve dogru_neden'deki md. 17 atfı metne uygun
      daraltıldı.
    neden: 'G6 (küçük): alıntı paragrafları ayırıcı olmadan birleştiriyordu; md. 17 atfı fazla genişti.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS 2 atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic 2019-01-01 (alıntılanan par. 12'yi
      değiştiren TFRS 16 değişikliğinin uygulanma tarihi, TMS 2 par. 40G).
    neden: Terim tutarlılığı; baslangic soru üretim tarihiydi.
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
