    ne: harici teslim t_M2b.yaml, satır 1
- id: SMMM-MAL-ORT-0015
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: net satış değeri yöntemi
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. NP İşletmesi ortak bir süreçten X ve Y ürünlerini elde etmektedir. Ayrılma noktasına
    kadar katlanılan ortak maliyet 360.000 ₺''dır. X ürününden 5.000 kg elde edilmiş ve ayrılma noktasında kilogramı
    34 ₺''den satılmaktadır. Y ürününden 4.000 litre elde edilmiş; Y, ayrılma noktasından sonra 50.000 ₺ ek işlem
    maliyetine katlanılarak litresi 60 ₺''den satılmakta ve bu satışlar için ayrıca 20.000 ₺ satış komisyonu ödenmektedir.
    Ortak maliyet net satış değerleri oranında dağıtılmaktadır.


    Buna göre Y ürününün birim stok maliyeti kaç TL''dir?'
  secenekler:
    A: 40,00
    B: 45,00
    C: 52,50
    D: 57,50
    E: 60,00
  dogru: D
  aciklama:
    dogru_neden: 'X''in ayrılma noktasındaki satış değeri 5.000 × 34 = 170.000 ₺''dir. Y''nin net satış değeri 4.000
      × 60 − 50.000 − 20.000 = 170.000 ₺''dir. Toplam 340.000 ₺ olduğundan Y''ye ortak maliyetin yarısı, 180.000
      ₺ düşer. Y''nin stok maliyeti ortak maliyet payı ile ek işlem maliyetinin toplamıdır: 180.000 + 50.000 = 230.000
      ₺; birim maliyet 230.000 / 4.000 = 57,50 ₺. Satış komisyonu net satış değerinin bulunmasında düşülür, ancak
      TMS 2 par. 16(d) gereği stok maliyetine eklenmez.'
    celdiriciler:
      A: '40,00: Ortak maliyet fiziki miktara göre dağıtılmış (360.000 × 4/9 = 160.000) ve ek işlem maliyeti eklenmemiştir.'
      B: '45,00: Ortak maliyet payı doğru bulunmuş, ancak ayrılma sonrası 50.000 ₺ ek işlem maliyeti Y''nin maliyetine
        eklenmemiştir.'
      C: '52,50: Ortak maliyet fiziki miktara göre dağıtılmıştır (160.000 + 50.000 = 210.000).'
      E: '60,00: Satış komisyonu net satış değerinden düşülmemiş (Y için 190.000), pay 360.000 × 190/360 = 190.000
        bulunmuştur.'
    hesap_adimlari:
    - X satış değeri = 5.000 × 34 = 170.000 ₺
    - Y net satış değeri = 240.000 − 50.000 − 20.000 = 170.000 ₺
    - Y'nin ortak maliyet payı = 360.000 × 170.000 / 340.000 = 180.000 ₺
    - Y stok maliyeti = 180.000 + 50.000 = 230.000 ₺; birim = 57,50 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(d)
    alinti: (d) Satış maliyetleri.
  - mevzuat: Hakemli konu anlatımı — MAL/ORT (Ortak ve yan ürün)
    madde: §3 Net satış değeri yöntemi
    alinti: ''
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'x = 5000 * 34

      y_nsd = 4000 * 60 - 50000 - 20000

      pay = 360000 * y_nsd / (x + y_nsd)

      sonuc = (pay + 50000) / 4000'
