- id: SMMM-MAL-ORT-0012
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: satış değeri yöntemi
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. DR İşletmesi ortak bir süreçte A ve B ana ürünlerini ve Z yan ürününü elde etmektedir.
    Dönemde ayrılma noktasına kadar 830.000 ₺ ortak üretim maliyetine ve 50.000 ₺ genel yönetim giderine katlanılmıştır.
    Üretim miktarları ve ayrılma noktasındaki satış fiyatları şöyledir: A 4.000 kg, 150 ₺/kg; B 8.000 kg, 50 ₺/kg;
    Z 1.000 kg, 40 ₺/kg. Z''nin satışı için kilogram başına 10 ₺ satış gideri gerekmektedir. İşletme yan ürünün
    net gerçekleşebilir değerini ortak maliyetten düşmekte, kalan tutarı ana ürünlere satış değerleri oranında dağıtmaktadır.
    Genel yönetim giderleri maliyete katılmamaktadır.


    Buna göre A ürününün birim maliyeti kaç TL''dir?'
  secenekler:
    A: 66,67
    B: 117,00
    C: 118,50
    D: 120,00
    E: 124,50
  dogru: D
  aciklama:
    dogru_neden: 'Z''nin net gerçekleşebilir değeri 1.000 × (40 − 10) = 30.000 ₺''dir. Ana ürünlere dağıtılacak
      tutar 830.000 − 30.000 = 800.000 ₺''dir. Satış değerleri A 600.000, B 400.000 ₺ olduğundan A''nın payı %60,
      yani 480.000 ₺; birim maliyeti 480.000 / 4.000 = 120 ₺''dir. Püf noktaları: Önce yan ürün değeri düşülür,
      sonra kalan ortak ürünlere dağıtılır; sıra ters çevrilemez. Yan üründen düşülen tutar brüt satış değeri değil,
      satış gideri indirilmiş net değerdir. 50.000 ₺ genel yönetim gideri soruda yalnız dikkat ölçmek için verilmiştir.'
    celdiriciler:
      A: '66,67: Kalan 800.000 ₺ satış değeri yerine fiziki miktara göre dağıtılmıştır (800.000 × 4/12).'
      B: '117,00: Satış gideri düşüleceği yerde eklenmiş, yan ürün değeri 50.000 alınmıştır (780.000 × %60).'
      C: '118,50: Yan ürünün brüt satış değeri (40.000) düşülmüştür (790.000 × %60).'
      E: '124,50: Yan ürün değeri hiç düşülmeden 830.000 ₺ dağıtılmıştır.'
    hesap_adimlari:
    - Z net gerçekleşebilir değeri = 1.000 × (40 − 10) = 30.000 ₺
    - Dağıtılacak ortak maliyet = 830.000 − 30.000 = 800.000 ₺
    - 'Satış değerleri: A 600.000, B 400.000; A oranı %60'
    - A payı = 480.000 ₺; birim = 480.000 / 4.000 = 120 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: yan ürünler genellikle net gerçekleşebilir değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden
      düşülür
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ngd = 1000 * (40 - 10)

      kalan = 830000 - ngd

      a_sd = 4000 * 150

      b_sd = 8000 * 50

      sonuc = kalan * a_sd / (a_sd + b_sd) / 4000'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_M2.yaml, satır 4
- id: SMMM-MAL-ORT-0013
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: satış değeri yöntemi
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. SN İşletmesi ortak bir süreçte 450.000 ₺ ortak maliyetle 3.000 kg A ve 6.000
    kg B ürünü elde etmiştir. Ayrılma noktasındaki satış fiyatları A için 80 ₺/kg, B için 60 ₺/kg''dır. Ortak maliyet
    satış değeri yöntemiyle dağıtılmaktadır. Dönemde A''dan 2.000 kg, B''den 5.400 kg ayrılma noktasındaki fiyatlarla
    satılmıştır; dönem başında stok yoktur.


    Buna göre dönemin brüt satış kârı kaç TL''dir?'
  secenekler:
    A: '34.000'
    B: '114.000'
    C: '121.000'
    D: '142.000'
    E: '150.000'
  dogru: C
  aciklama:
    dogru_neden: Satış değerleri A 240.000, B 360.000 ₺; toplam 600.000 ₺. Ortak maliyet / satış değeri = 450.000
      / 600.000 = %75 olduğundan birim maliyetler A 60 ₺, B 45 ₺'dir. Satışlar 2.000 × 80 + 5.400 × 60 = 484.000
      ₺; satılan mamul maliyeti 2.000 × 60 + 5.400 × 45 = 363.000 ₺; brüt kâr 121.000 ₺'dir (her iki üründe %25).
    celdiriciler:
      A: '34.000: Ortak maliyetin tamamı, stokta kalan kısım ayrılmadan satılanların maliyeti sayılmıştır (484.000
        − 450.000).'
      B: '114.000: Ortak maliyet fiziki miktara göre dağıtılmış, birim maliyet her iki ürün için 50 ₺ alınmıştır.'
      D: '142.000: Dağıtım oranları ters uygulanmış (A''ya %60, B''ye %40), birim maliyetler A 90 ₺, B 30 ₺ bulunmuştur.'
      E: '150.000: Üretimin tamamı satılmış gibi toplam satış değerinden ortak maliyet düşülmüştür.'
    hesap_adimlari:
    - 'Satış değerleri: A 240.000, B 360.000; maliyet oranı 450.000 / 600.000 = %75'
    - 'Birim maliyet: A 80 × 0,75 = 60 ₺; B 60 × 0,75 = 45 ₺'
    - Satışlar = 160.000 + 324.000 = 484.000 ₺
    - SMM = 120.000 + 243.000 = 363.000 ₺; brüt kâr = 121.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı
      andaki nispi satış değerine göre yapılabilir
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oran = 450000 / (3000 * 80 + 6000 * 60)

      satis = 2000 * 80 + 5400 * 60

      smm = 2000 * 80 * oran + 5400 * 60 * oran

      sonuc = satis - smm'
  durum: taslak
  surum: 1
