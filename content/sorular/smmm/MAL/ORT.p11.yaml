- id: SMMM-MAL-ORT-0014
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: katsayılı bölme
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. KT İşletmesi tek bir ortak süreçte A, B ve C ürünlerini elde etmekte ve 330.000
    ₺ tutarındaki ortak maliyeti katsayılı bölme (eşdeğer katsayılar) yöntemiyle dağıtmaktadır. Dönemde A ürününden
    3.000 adet (katsayı 1), B ürününden 4.000 adet ve C ürününden 1.000 adet (katsayı 2) üretilmiştir. B ürününün
    katsayısı kayıtlarda bulunamamış; ancak A ürününün birim maliyetinin 30 ₺ olarak hesaplandığı bilinmektedir.
    Ürünlerin birim satış fiyatları A için 45 ₺, B için 60 ₺, C için 80 ₺''dir.


    Buna göre B ürününe dağıtılan ortak maliyet kaç TL''dir?'
  secenekler:
    A: '120.000'
    B: '165.000'
    C: '180.000'
    D: '210.000'
    E: '240.000'
  dogru: C
  aciklama:
    dogru_neden: 'Katsayısı 1 olan A ürününün birim maliyeti eşdeğer birim maliyete eşittir: 30 ₺. Toplam eşdeğer
      miktar = 330.000 / 30 = 11.000''dir. A''nın eşdeğer miktarı 3.000, C''ninki 1.000 × 2 = 2.000 olduğundan B''nin
      eşdeğer miktarı 11.000 − 3.000 − 2.000 = 6.000''dir (katsayı 6.000 / 4.000 = 1,5). B''ye düşen pay 6.000 ×
      30 = 180.000 ₺''dir. Püf noktaları: Ölçü ürünün (katsayısı 1) birim maliyeti, eşdeğer birim maliyetin ta kendisidir;
      geri hesap buradan başlar. C''nin fiziki adedini değil eşdeğer miktarını (1.000 × 2) düşmeyi unutma. Satış
      fiyatları bu yöntemde kullanılmaz.'
    celdiriciler:
      A: '120.000: B''nin katsayısı 1 kabul edilerek 4.000 × 30 hesaplanmıştır; katsayı geri hesaplanmamıştır.'
      B: '165.000: Ortak maliyet fiziki miktarlara göre dağıtılmıştır (330.000 × 4.000 / 8.000); katsayılar dikkate
        alınmamıştır.'
      D: '210.000: C''nin eşdeğer miktarı fiziki adediyle (1.000) alınmış, katsayısı 2 ile çarpılmamıştır (7.000
        × 30).'
      E: '240.000: C ürünü hesaba katılmadan, ortak maliyetten yalnız A''nın payı (90.000) düşülmüştür.'
    hesap_adimlari:
    - Eşdeğer birim maliyet = A'nın birim maliyeti (katsayı 1) = 30 ₺
    - Toplam eşdeğer miktar = 330.000 / 30 = 11.000
    - B'nin eşdeğer miktarı = 11.000 − 3.000 − (1.000 × 2) = 6.000 (katsayı 1,5)
    - B'nin payı = 6.000 × 30 = 180.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler
      arasında mantıklı ve tutarlı bir biçimde dağıtılır.
  - mevzuat: Hakemli konu anlatımı — MAL/ORT (Ortak ve yan ürün)
    madde: §4 Katsayılı bölme yöntemi
    alinti: ''
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'esdeger_bm = 30

      toplam_esd = 330000 / esdeger_bm

      b_esd = toplam_esd - 3000 * 1 - 1000 * 2

      sonuc = b_esd * esdeger_bm'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
