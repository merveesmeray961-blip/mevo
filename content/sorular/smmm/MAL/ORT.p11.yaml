  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: yan ürün geri hesap
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. YR İşletmesi ortak bir süreçte 20.000 kg ana ürün ve 2.000 kg yan ürün elde
    etmiştir. Ayrılma noktasına kadar katlanılan ortak maliyet 500.000 ₺''dır. Yan ürün, ayrılma noktasından sonra
    6.000 ₺ ek işlem maliyetine katlanılarak kilogramı 30 ₺''den satılabilecektir; satış için 4.000 ₺ satış gideri
    yapılacaktır. İşletme yan ürün için satış tutarının %10''u oranında normal kâr öngörmekte ve yan ürünün değerini
    geri hesap yöntemiyle bulup ortak maliyetten düşmektedir.


    Buna göre ana ürünün birim maliyeti kaç TL''dir?'
  secenekler:
    A: 22,00
    B: 22,30
    C: 22,50
    D: 22,60
    E: 22,80
  dogru: E
  aciklama:
    dogru_neden: Yan ürün satış değeri 2.000 × 30 = 60.000 ₺, normal kâr 60.000 × %10 = 6.000 ₺'dir. Ayrılma noktasındaki
      değer = 60.000 − 6.000 (normal kâr) − 6.000 (ek işlem) − 4.000 (satış gideri) = 44.000 ₺. Ana ürüne kalan
      maliyet 500.000 − 44.000 = 456.000 ₺; birim maliyet 456.000 / 20.000 = 22,80 ₺'dir.
    celdiriciler:
      A: '22,00: Yan ürünün brüt satış tutarının (60.000) tamamı ortak maliyetten düşülmüştür.'
      B: '22,30: Yalnız ek işlem maliyeti düşülmüş; satış gideri ve normal kâr düşülmemiştir (60.000 − 6.000 = 54.000).'
      C: '22,50: Normal kâr düşülmeden net gerçekleşebilir değer (50.000) kullanılmıştır.'
      D: '22,60: Satış gideri unutulmuştur (60.000 − 6.000 − 6.000 = 48.000).'
    hesap_adimlari:
    - Satış değeri = 2.000 × 30 = 60.000 ₺; normal kâr = 6.000 ₺
    - Ayrılma noktasındaki değer = 60.000 − 6.000 − 6.000 − 4.000 = 44.000 ₺
    - Ana ürün maliyeti = 500.000 − 44.000 = 456.000 ₺
    - Birim maliyet = 456.000 / 20.000 = 22,80 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: yan ürünler genellikle net gerçekleşebilir değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden
      düşülür
  - mevzuat: Hakemli konu anlatımı — MAL/ORT (Ortak ve yan ürün)
    madde: §5 Yan ürün ve geri hesap
    alinti: ''
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'sd = 2000 * 30

      deger = sd - sd * 0.10 - 6000 - 4000

      sonuc = (500000 - deger) / 20000'
