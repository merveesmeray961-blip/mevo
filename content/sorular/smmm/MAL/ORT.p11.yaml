  kok: 'KDV dikkate alınmayacaktır. MK İşletmesi ortak bir süreçten elde ettiği X ve Y ürünlerini ayrılma noktasından
    sonra ek işleme tabi tutmakta ve ortak maliyeti net satış değerleri oranında dağıtmaktadır. X''in nihai satış
    değeri 400.000 ₺, ek işlem maliyeti 100.000 ₺; Y''nin nihai satış değeri 240.000 ₺, ek işlem maliyeti 40.000
    ₺''dir. Ortak maliyetin tutarı kayıtlardan çıkarılamamış, ancak X''e 240.000 ₺ ortak maliyet dağıtıldığı bilinmektedir.


    Buna göre Y ürününün toplam maliyeti kaç TL''dir?'
  secenekler:
    A: '120.000'
    B: '160.000'
    C: '184.000'
    D: '200.000'
    E: '216.000'
  dogru: D
  aciklama:
    dogru_neden: 'Net satış değerleri X 400.000 − 100.000 = 300.000 ₺, Y 240.000 − 40.000 = 200.000 ₺; toplam 500.000
      ₺. X''in payı 240.000 ₺ ve oranı 300/500 olduğundan ortak maliyet 240.000 × 500 / 300 = 400.000 ₺''dir. Y''nin
      payı 400.000 − 240.000 = 160.000 ₺; toplam maliyeti 160.000 + 40.000 = 200.000 ₺''dir. Püf noktaları: Geri
      hesapta da oran nihai satış değerinden değil net satış değerinden kurulur. Ürünün toplam maliyeti, ortak maliyet
      payına kendi ek işlem maliyeti eklenerek bulunur; ek işlem maliyeti dağıtıma sokulmaz.'
    celdiriciler:
      A: '120.000: Ek işlem maliyeti eklenmesi gerekirken ortak maliyet payından düşülmüştür (160.000 − 40.000).'
      B: '160.000: Yalnız ortak maliyet payı bulunmuş, Y''nin 40.000 ₺ ek işlem maliyeti eklenmemiştir.'
      C: '184.000: Oran nihai satış değerleriyle kurulmuştur (ortak maliyet 240.000 × 640/400 = 384.000; Y payı
        144.000 + 40.000).'
      E: '216.000: Ek işlem maliyetleri (140.000) ortak maliyete katılıp net satış değeri oranında dağıtılmıştır
        (540.000 × 2/5).'
    hesap_adimlari:
    - 'NSD: X 300.000, Y 200.000; toplam 500.000 ₺'
    - Ortak maliyet = 240.000 × 500.000 / 300.000 = 400.000 ₺
    - Y payı = 400.000 − 240.000 = 160.000 ₺
    - Y toplam maliyeti = 160.000 + 40.000 = 200.000 ₺
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — MAL/ORT (Ortak ve yan ürün)
    madde: §3 Net satış değeri yöntemi
    alinti: ''
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler
      arasında mantıklı ve tutarlı bir biçimde dağıtılır.
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'x_nsd = 400000 - 100000

      y_nsd = 240000 - 40000

      ortak = 240000 * (x_nsd + y_nsd) / x_nsd

      sonuc = ortak * y_nsd / (x_nsd + y_nsd) + 40000'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
