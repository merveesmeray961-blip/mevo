    B: Yan ürün sayılır; net gerçekleşebilir değeri ana ürünün maliyetine eklenir.
    C: Yan ürün sayılır ve satışa hazır mamul olarak 152 Mamuller hesabında izlenir.
    D: Artık sayılır; hiçbir değerle ölçülmez ve maliyetten pay almaz.
    E: Yan üründür; net değeri ana ürün maliyetinden düşülür ve 157'de izlenir.
