  kok: AB İşletmesi'nde ortak maliyet 180.000 TL olup ana üründen 10.000 kg üretilmiş, ana ürünün kg başına maliyeti 17,2
    TL olarak belirlenmiştir. Ana ürünün maliyeti, yan ürünün ayrılma noktasındaki değeri ortak maliyetten düşülerek bulunmuştur.
