      A: Normal kâr payı hesaba katılmamıştır; yalnızca ek işlem ve satış gideri eklenmiştir.
      B: Satış gideri eklenmeden yalnızca ek işlem eklenerek (9.200 / 0,80) hesaplanmıştır; satış gideri de geriye doğru eklenmelidir.
      C: Normal kâr, satış tutarına göre değil maliyetin %20'si olarak (10.000 × 1,2) eklenmiştir.
      E: Yan ürünün toplam satış tutarıdır; kg fiyatına ulaşmak için miktara bölünmemiştir.
