  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: satış değeri yöntemi
  tip: hesaplama
  zorluk: 2
  kok: AB İşletmesi'nde ortak maliyet 126.000 TL'dir. Ayrılma noktasında X ürününden 3.000 kg (kg fiyatı 30 TL), Y ürününden
    4.000 kg (kg fiyatı 15 TL) elde edilmiş ve tamamı satılmıştır. Ortak maliyet satış değeri oranında dağıtılırsa X ürününün
    kg başına brüt kârı kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 4,8 TL
    B: 9 TL
    C: 12 TL
    D: 25,2 TL
    E: 30 TL
  dogru: A
  aciklama:
    dogru_neden: Satış değerleri X 90.000, Y 60.000 TL; toplam 150.000 TL. X'in payı 126.000 × 90.000 / 150.000 = 75.600 TL,
      kg maliyeti 25,2 TL; kg kârı 30 − 25,2 = 4,8 TL'dir (TMS 2 par. 14).
    celdiriciler:
      B: Ortak maliyet iki ürüne eşit paylaştırılmıştır (63.000 / 3.000 = 21 TL).
      C: Ortak maliyet fiziksel miktara göre (126.000 / 7.000 = 18 TL) dağıtılmıştır.
      D: X ürününün kg maliyetidir; kâr için fiyattan düşülmelidir.
      E: X ürününün kg satış fiyatıdır; maliyet düşülmemiştir.
    hesap_adimlari:
    - X payı = 126.000 × 90.000 / 150.000 = 75.600 TL
    - Kg maliyeti = 75.600 / 3.000 = 25,2 TL
    - Kg kârı = 30 − 25,2 = 4,8 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile
      bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak
      belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı
      örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki
      nispi satış değerine göre yapılabilir.
  gecerlilik:
