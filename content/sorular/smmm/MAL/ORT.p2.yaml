      TL; toplam 300.000 TL. M''nin ortak maliyet payı 180.000 × 160.000 / 300.000 = 96.000 TL''dir. Ek işlem maliyeti eklenince
      toplam maliyet 121.000 TL, birim maliyet 121.000 / 5.000 = 24,2 TL olur. TMS 2 paragraf 16(d) satış maliyetlerinin stok
      maliyetine dahil edilmediğini belirtir.'
