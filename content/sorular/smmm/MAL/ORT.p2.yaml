  konu: ORT
  kazanim: net satış değeri yöntemi
  tip: hesaplama
  zorluk: 1
  kok: AB İşletmesi'nde K ve L ortak ürünleri için ortak maliyet 90.000 TL'dir. K ürününden 8.000 birim elde edilmiştir; K
    ürünü ek işlemden sonra toplam 150.000 TL'ye satılabilecek ve ayrılma noktasından sonra 30.000 TL ek işlem maliyeti oluşacaktır.
    L ürünü ek işlemden sonra toplam 130.000 TL'ye satılabilecek ve 50.000 TL ek işlem maliyeti oluşacaktır. Ortak maliyet
    net satış değeri oranında dağıtılırsa K ürününün birim maliyeti (ortak maliyet payı ve kendi ek işlem maliyeti dahil)
    kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 6,75 TL
    B: 10,5 TL
    C: 11,25 TL
    D: 15 TL
    E: 18,75 TL
  dogru: B
  aciklama:
    dogru_neden: Ürünler ek işlemden sonra satılacağından net satış değeri esas alınır. K'nın net satış değeri 150.000 − 30.000
      = 120.000 TL, L'nin 130.000 − 50.000 = 80.000 TL; toplam 200.000 TL'dir. K'nın ortak maliyet payı 90.000 × 120.000 /
      200.000 = 54.000 TL'dir. Ek işlem maliyeti eklenince K'nın toplam maliyeti 84.000 TL, birim maliyeti 84.000 / 8.000
      = 10,5 TL olur. TMS 2 paragraf 14 dağıtımın mantıklı ve tutarlı yapılmasını gerektirir.
    celdiriciler:
      C: Ortak maliyetin tamamı (90.000 TL) K'nın birim sayısına bölünmüştür; dağıtım yapılmamıştır.
      D: K'nın net satış değeri (120.000 TL) birim sayısına bölünmüştür; maliyet değil değerdir.
      E: K'nın nihai satış tutarı (150.000 TL) birim sayısına bölünmüştür; bu birim satış fiyatıdır.
      A: K'nın toplam maliyetidir; birim maliyete ulaşmak için birim sayısına bölünmemiştir.
    hesap_adimlari:
    - K NSD = 150.000 − 30.000 = 120.000 TL; L NSD = 130.000 − 50.000 = 80.000 TL
    - K payı = 90.000 × 120.000 / 200.000 = 54.000 TL
    - K toplam maliyet = 54.000 + 30.000 = 84.000 TL
    - Birim maliyet = 84.000 / 8.000 = 10,5 TL
  kaynaklar:
