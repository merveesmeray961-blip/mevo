      ve ana ürünün maliyetinden düşülür. Tek Düzen Hesap Planı''na göre yan ürün 157 Diğer Stoklar hesabında izlenir. Püf
      noktaları: Fiziksel miktar yanıltıcıdır; ayrımı satış değerinin göreli önemi belirler. ''Düşülür'' ile ''eklenir'' ayrımına
      ve 152 ile 157 farkına dikkat et.'
