      400.000 = 37.500 TL. Ek işlem maliyeti 10.000 TL eklenince 47.500 TL, birim maliyet 47.500 / 400 = 118,75 TL''dir (TMS
      2 par. 14). Püf noktaları: Ek işlem maliyeti dağıtım ölçüsünden düşülür, ancak dağıtım sonrası ilgili ürüne yeniden
