      ve sistematik dağıtılan genel üretim giderlerini kapsar. Paragraf 16''daki kalemler ise stok maliyeti dışındadır. Püf
      noktaları: Paragraf 16''daki dört kalem (fire, gereksiz depolama, katkısız genel yönetim, satış maliyeti) dönem giderine
      gider. ''Gerekli olanlar dışında kalan'' ifadesi, gerekli depolamanın maliyete girdiğini gösterir.'
    celdiriciler:
      A: Paragraf 16(d) satış maliyetlerini stok maliyeti dışında bırakır; dönem gideridir.
      B: Paragraf 16(c) bu giderleri stok maliyeti dışında tutar.
      C: Paragraf 16(a) normalin üstündeki fire ve kayıpları dönem gideri sayar.
      E: Paragraf 16(b) yalnızca bir sonraki aşamadan önce gerekli olmayan depolamayı dışlar; bu maliyetler dönem gideridir.
