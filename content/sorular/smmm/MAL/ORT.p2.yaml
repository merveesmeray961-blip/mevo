  aciklama:
    dogru_neden: 'Yan ürünün ayrılma noktasındaki değeri 180.000 − 10.000 × 17,2 = 8.000 TL''dir. Geri hesapta değer = satış
      tutarı − satış gideri − ek işlem − normal kâr olduğundan 8.000 = S − 800 − 1.200 − 0,20 S ve 0,80 S = 10.000, S = 12.500
