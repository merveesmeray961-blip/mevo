      düşülmesini öngörür. Püf noktaları: Soru geri yönde sorulmaktadır: önce ana ürün maliyetinden yan ürün değerini bul,
      sonra satış tutarına çık. Normal kâr satış tutarının yüzdesidir; bu yüzden toplam 0,80''e bölünür. Ortak maliyet ve
      ana ürün miktarı yalnızca yan ürün değerini bulmak içindir.'
