    maliyeti ve 10.000 TL satış gideri oluşacaktır. Net satış değeri, ürüne özgü satış giderleri de düşülerek hesaplanacak
    ve satış giderleri stok maliyetine dahil edilmeyecektir. M ürününün birim maliyeti kaç TL'dir? KDV dikkate alınmayacaktır.
