- id: SMMM-MAL-ORT-0002
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: ORT
  kazanim: yan ürünün net gerçekleşebilir değerinin ortak maliyetten düşülmesi ve fiziki miktar yöntemiyle dağıtım
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'FK İşletmesi, ortak bir üretim sürecinde X ve Y ana ürünlerini ve Z yan ürününü elde etmektedir. Dönemde
    ayırma noktasına kadar katlanılan ortak maliyet 1.200.000 TL''dir. Üretilen miktarlar X için 6.000, Y için 4.000
    ve Z için 5.000 birimdir. Z yan ürünü ayırma noktasından sonra ek işleme tabi tutulmadan birim satış fiyatı
    14 TL''den satılmakta ve birim başına 4 TL satış gideri oluşmaktadır. Yan ürünün net gerçekleşebilir değeri
    ortak maliyetten düşülmekte, kalan ortak maliyet ana ürünlere fiziki miktar oranında dağıtılmaktadır. KDV dikkate
    alınmayacaktır.


    Buna göre Y ürününe dağıtılacak ortak maliyet kaç TL''dir?'
  secenekler:
    A: '320.000'
    B: '444.000'
    C: '452.000'
    D: '460.000'
    E: '480.000'
  dogru: D
  aciklama:
    dogru_neden: TMS 2 par. 14'e göre yan ürünler genellikle net gerçekleşebilir değer üzerinden ölçülür ve bu değer
      ana ürünün maliyetinden düşülür. Yan ürünün net gerçekleşebilir değeri = (14 − 4) × 5.000 = 50.000 TL'dir.
      Ana ürünlere dağıtılacak ortak maliyet 1.200.000 − 50.000 = 1.150.000 TL; Y'nin fiziki miktar payı 4.000 ÷
      10.000 = %40 olduğundan Y'ye 460.000 TL düşer.
    celdiriciler:
      A: '320.000: yan ürün de ana ürün gibi fiziki miktar payı almış (4.000 ÷ 15.000 × 1.200.000) ve net gerçekleşebilir
        değeri düşülmemiştir.'
      B: '444.000: yan ürünün brüt satış değeri (70.000) düşülmüş, satış giderleri (20.000) ise eklenmesi gerekirken
        ayrıca düşülmüştür (1.200.000 − 70.000 − 20.000 = 1.110.000; 1.110.000 × %40); doğrusu net gerçekleşebilir
        değerin (70.000 − 20.000 = 50.000) düşülmesidir.'
      C: '452.000: yan ürünün net gerçekleşebilir değeri yerine brüt satış değeri (70.000) düşülmüştür (1.130.000
        × %40).'
      E: '480.000: yan ürünün net gerçekleşebilir değeri ortak maliyetten düşülmemiş, ortak maliyetin tamamı ana
        ürünlere dağıtılmıştır (1.200.000 × %40).'
    hesap_adimlari:
    - 'Yan ürünün net gerçekleşebilir değeri: (14 − 4) × 5.000 = 50.000 TL'
    - 'Ana ürünlere dağıtılacak ortak maliyet: 1.200.000 − 50.000 = 1.150.000 TL'
    - 'Y''nin fiziki miktar payı: 4.000 ÷ (6.000 + 4.000) = %40'
    - 'Y''ye dağıtılan ortak maliyet: 1.150.000 × 0,40 = 460.000 TL'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Yan ürünlerin çoğu, yapıları gereği önemsizdir. Böyle bir durumda, yan ürünler genellikle net gerçekleşebilir
      değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden düşülür.
  dogrulama:
    python: 'ngd = (14 - 4) * 5000

      sonuc = (1200000 - ngd) * 4000 / (6000 + 4000)

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: B çeldirici açıklaması ''satış gideri çift sayılmıştır'' → satış giderinin ters işaretle
      düşüldüğü açıkça yazıldı. Kök/şık/anahtar değişmedi.'
    neden: 'G5 İYİLEŞTİRME: 1.200.000 − 70.000 − 20.000 hatası ''çift sayım'' değil işaret hatasıdır.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: D (güven 5) Z NRV=5.000x(14-4)=50.000; dağıtılacak 1.150.000; Y payı 4.000/10.000 = 460.000.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Anahtar doğru: NGD (14 − 4) × 5.000 = 50.000; (1.200.000 − 50.000) × %40 = 460.000 (D). B çeldirici
          açıklaması (işaret hatası) düzeltildi; tüm çeldiriciler kesin yanlış.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: TMS 2 par. 14 alıntısı birebir; yan ürün NGD'sinin ana ürün maliyetinden düşülmesi par. 14 ile, fiziki
          miktar esası kökte tanımlı; dogrulama.python 460.000.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (D, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-MAL-ORT-0003
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: ORT
  kazanim: ortak maliyetin net satış değeri yöntemiyle dağıtımı, ayırma sonrası işleme maliyeti ve dönem sonu stok
    maliyeti
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'HL İşletmesi, ortak bir üretim sürecinde A ve B ürünlerini elde etmektedir. Dönemde ayırma noktasına kadar
    katlanılan ortak maliyet 500.000 TL, genel yönetim gideri 150.000 TL''dir. A ürününden 10.000 birim üretilmiş
    olup birim satış fiyatı 60 TL''dir; A ürünü ayırma noktasından sonra ek işlemden geçirilmekte ve bu işleme ilişkin
    200.000 TL maliyet oluşmaktadır. B ürününden 20.000 birim üretilmiş olup birim satış fiyatı 30 TL''dir; B ürünü
    ayırma noktasında satılmakta ve ek işleme tabi tutulmamaktadır. Ortak maliyet, ürünlerin son satış değerinden
    ayırma sonrası ek işlem maliyeti düşülerek bulunan net satış değerlerine göre dağıtılmaktadır. Dönem içinde
    A ürününden 8.000 birim satılmış, 2.000 birimi dönem sonu stokunda kalmıştır. Birim maliyetler üretilen birim
    sayısı üzerinden hesaplanacaktır. KDV dikkate alınmayacaktır.


    Dönem sonundaki A ürünü stokunun maliyeti kaç TL''dir?'
  secenekler:
    A: '40.000'
    B: '80.000'
    C: '90.000'
    D: '100.000'
    E: '120.000'
  dogru: B
  aciklama:
    dogru_neden: 'Net satış değerleri: A = 10.000 × 60 − 200.000 = 400.000 TL; B = 20.000 × 30 = 600.000 TL; toplam
      1.000.000 TL. Ortak maliyetten A''ya %40 (200.000 TL), B''ye %60 (300.000 TL) düşer. A ürününün toplam maliyeti,
      ortak maliyet payı ile ayırma sonrası işlem maliyetinin toplamıdır: 200.000 + 200.000 = 400.000 TL; birim
      maliyet 400.000 ÷ 10.000 = 40 TL. Dönem sonu stok = 2.000 × 40 = 80.000 TL. Genel yönetim gideri stok maliyetine
      girmez (TMS 2 par. 16-c).


      Püf noktaları: Ortak maliyet dağıtımında net satış değeri A için ek işlem maliyeti düşüldükten sonraki tutardır;
      ancak aynı ek işlem maliyeti A''nın birim maliyetine tekrar eklenir. Birim maliyet üretilen miktara bölünür,
      satılan miktara değil. Genel yönetim gideri gereksiz verilerden biridir.'
    celdiriciler:
      A: '40.000: ayırma sonrası ek işlem maliyeti birim maliyete eklenmemiş, yalnızca ortak maliyet payı (200.000
        ÷ 10.000 = 20 TL) alınmıştır.'
      C: '90.000: ortak maliyet ek işlem düşülmeden son satış değerine göre dağıtılmıştır (A payı 250.000 TL); (250.000
        + 200.000) ÷ 10.000 = 45 TL × 2.000.'
      D: '100.000: toplam maliyet (400.000) satılan birime (8.000) bölünmüştür: 50 TL × 2.000.'
      E: '120.000: stok, maliyet yerine birim satış fiyatıyla (60 TL) değerlenmiştir.'
    hesap_adimlari:
    - 'A''nın net satış değeri: 10.000 × 60 − 200.000 = 400.000 TL; B''nin: 20.000 × 30 = 600.000 TL'
    - 'Ortak maliyet payları: A = 500.000 × 400 ÷ 1.000 = 200.000 TL; B = 300.000 TL'
    - 'A''nın toplam maliyeti: 200.000 + 200.000 = 400.000 TL; birim maliyet 400.000 ÷ 10.000 = 40 TL'
    - 'Dönem sonu A stoku: 2.000 × 40 = 80.000 TL'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler
      arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak
      belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki nispi satış değerine göre
      yapılabilir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16
    alinti: Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri,
  dogrulama:
    python: 'nsd_a = 10000 * 60 - 200000

      nsd_b = 20000 * 30

      pay_a = 500000 * nsd_a / (nsd_a + nsd_b)

      birim = (pay_a + 200000) / 10000

      sonuc = 2000 * birim

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: B (güven 5) A NSD=600.000-200.000=400.000; B=600.000; A payı ortak maliyet 200.000; A
          toplam maliyet 400.000/10.000=40 TL; stok 2.000x40=80.000.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok: NSD A 400.000, B 600.000; A payı 200.000 + ek işlem 200.000 = 400.000; birim 40; stok 80.000
          (B). C (son satış değeri), D (satılan birime bölme), A, E kesin yanlış.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: TMS 2 par. 14 ve par. 16(c) alıntıları birebir; net satış değeri yöntemi kökte tanımlı; dogrulama.python
          80.000.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (B, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
