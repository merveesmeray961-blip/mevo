    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'Net yöntemde ek işleme düşülür (III) ve net değerlere göre oranlanır (I). II yanlıştır. X net = 180.000
      − 20.000 = 160.000; Y net = 120.000 − 10.000 = 110.000; toplam 270.000. X payı = 160/270 × 240.000 ≈ 142.222 TL. Püf
      noktaları: Net yöntemde brüt değil net kullanılır.'
    celdiriciler:
      A: Ek işleme düşülmesini dışlar.
      B: Brüt yöntemi kabul eder.
      D: Brüt yöntem ve ek işleme düşülmesini birleştirir.
      E: Brüt yöntemi de doğru sayar.
    hesap_adimlari:
    - X net = 180000-20000=160000; Y net=120000-10000=110000
    - X payı = 160000/270000 * 240000 ≈ 142222
