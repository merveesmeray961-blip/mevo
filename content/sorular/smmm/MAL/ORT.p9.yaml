  zorluk: 2
  kok: 'Ortak süreçten X ve Y ürünleri elde edilmektedir. Ayrılma noktasına kadar ortak maliyet 240.000 TL’dir. X’in ayrılma
    noktasındaki tahmini satış değeri 180.000 TL, ek işleme 20.000 TL; Y’nin tahmini satış değeri 120.000 TL, ek işleme 10.000
    TL’dir. Net gerçekleşebilir değer yöntemine göre X’e yüklenecek ortak maliyet tutarı kaç TL’dir?

    I. Net değerler oranına göre dağıtım yapılır.

    II. Brüt satış değerleri oranına göre dağıtım yapılır.

    III. Ek işleme maliyetleri net değer hesabında düşülür.

    '
  secenekler:
