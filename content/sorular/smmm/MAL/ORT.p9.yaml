- id: SMMM-MAL-ORT-0008
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: yan ürün geri hesap
  tip: uygulama
  zorluk: 3
  kok: 'Tek bir ortak üretim sürecinden 20.000 birim ana ürün ve 2.000 birim yan ürün elde eden BT İşletmesi, ayrılma noktasına
    kadar 600.000 TL ortak maliyet yüklenmiştir. Yan ürünün ayrılma noktasındaki tahmini satış değeri 40.000 TL, ek işleme
    maliyeti 8.000 TL ve satış gideri 2.000 TL’dir. Yan ürün net gerçekleşebilir değer yöntemiyle muhasebeleştirilmektedir.
    Ana ürüne yüklenecek ortak maliyet tutarı kaç TL’dir?

    I. Yan ürünün net gerçekleşebilir değeri ortak maliyetten düşülür.

    II. Yan ürünün brüt satış değeri ortak maliyetten düşülür.

    III. Ek işleme ve satış giderleri dikkate alınmadan brüt değer kullanılır.

    Yukarıdaki ifadelerden hangileri yan ürün muhasebesinde doğrudur?

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: 'Net gerçekleşebilir değer yönteminde yan ürünün tahmini satış değerinden ek işleme ve satış giderleri düşülerek
      net değer bulunur ve bu tutar ortak maliyetten düşülerek ana ürüne yüklenir. I doğrudur; II ve III yanlıştır. Hesap:
      Net değer = 40.000 − 8.000 − 2.000 = 30.000 TL; ana ürüne 600.000 − 30.000 = 570.000 TL. Püf noktaları: Net yöntemde
      brüt değil net değer kullanılır.'
    celdiriciler:
      B: Brüt satış değerinin düşüldüğünü kabul eder.
      C: Hem net hem brüt yöntemini birden kabul eder.
      D: Brüt yöntem ve ek giderlerin dikkate alınmamasını kabul eder.
      E: Üç ifadeyi de doğru kabul eder.
    hesap_adimlari:
    - Net gerçekleşebilir değer = 40.000 − 8.000 − 2.000 = 30.000
    - Ana ürüne yüklenecek = 600.000 − 30.000 = 570.000
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: Maliyet hesapları
    alinti: Maliyet hesapları, mal ve hizmetlerin planlanan biçim ve niteliğe getirilmesi için yapılan giderlerin toplandığı
      ve maliyet unsurlarına dönüştürülerek izlendiği hesaplardır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 600000 - (40000 - 8000 - 2000)
