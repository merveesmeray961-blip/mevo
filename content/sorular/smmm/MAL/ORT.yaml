- id: SMMM-MAL-ORT-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: ORT
  kazanim: Ortak maliyetin net satış değeri yöntemiyle dağıtımı
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'G İşletmesi ortak bir üretim sürecinde X, Y ve Z ürünlerini elde etmektedir. Ayrılma noktasına kadar katlanılan
    ortak maliyet 360.000 ₺''dir. Ürünler ayrılma noktasından sonra ek işleme tabi tutulmaktadır. X: 4.000 kg, satış
    fiyatı 50 ₺/kg, ek işlem maliyeti 40.000 ₺; Y: 6.000 kg, satış fiyatı 40 ₺/kg, ek işlem maliyeti 40.000 ₺; Z:
    2.000 kg, satış fiyatı 80 ₺/kg, ek işlem maliyeti 40.000 ₺. Ortak maliyet net satış değeri (nihai satış değeri
    - ayrılma noktasından sonraki ek işlem maliyeti) yöntemiyle dağıtılmaktadır. KDV dikkate alınmayacaktır. Buna
    göre Y ürününün toplam üretim maliyeti kaç ₺''dir?'
  secenekler:
    A: '220.000'
    B: '190.000'
    C: '184.000'
    D: '180.000'
    E: '150.000'
  dogru: B
  aciklama:
    dogru_neden: 'Net satış değeri, nihai satış değerinden ayrılma noktası sonrası ek işlem maliyetinin düşülmesiyle
      bulunur: X 160.000, Y 200.000, Z 120.000; toplam 480.000 ₺. Y''ye düşen ortak maliyet 360.000 × 200.000 /
      480.000 = 150.000 ₺''dir. Y''nin toplam üretim maliyeti, ortak maliyet payı ile kendi ek işlem maliyetinin
      toplamıdır: 150.000 + 40.000 = 190.000 ₺. TMS 2 par. 14, ortak maliyetin ürünler arasında mantıklı ve tutarlı
      bir biçimde dağıtılmasını öngörür.'
    hesap_adimlari:
    - 'Satış değerleri: X 4.000 × 50 = 200.000; Y 6.000 × 40 = 240.000; Z 2.000 × 80 = 160.000 ₺'
    - 'Net satış değerleri: X 160.000; Y 200.000; Z 120.000; toplam 480.000 ₺'
    - 'Y''nin ortak maliyet payı: 360.000 × 200.000 / 480.000 = 150.000 ₺'
    - 'Y''nin toplam üretim maliyeti: 150.000 + 40.000 = 190.000 ₺'
    celdiriciler:
      A: 220.000 ₺, ortak maliyetin fiziksel miktar (kg) oranıyla dağıtılıp (360.000 × 6/12 = 180.000) ek işlem
        maliyetinin eklenmesiyle bulunur; kök net satış değeri yöntemini istemektedir.
      C: 184.000 ₺, ortak maliyetin nihai satış değerleriyle dağıtılmasıyla (360.000 × 240/600 = 144.000) ve ek
        işlemin eklenmesiyle bulunur; ek işlem maliyeti düşülmeden satış değeri yöntemi uygulanmıştır.
      D: 180.000 ₺, fiziksel miktar yöntemiyle bulunan ortak maliyet payıdır; hem yöntem yanlıştır hem de ek işlem
        maliyeti eklenmemiştir.
      E: 150.000 ₺ yalnızca Y'ye düşen ortak maliyet payıdır; ayrılma noktasından sonraki ek işlem maliyeti (40.000)
        eklenmemiştir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana
      ürün ile bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin
      ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır.
      Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki
      veya üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir.
  - mevzuat: Maliyet muhasebesi — genel kabul görmüş ortak maliyet dağıtım yöntemleri
    madde: Net satış değeri (nihai satış değeri - ayrılma sonrası ek maliyet) yöntemi
    alinti: ''
  dogrulama:
    python: 'nsd_x = 4000 * 50 - 40000

      nsd_y = 6000 * 40 - 40000

      nsd_z = 2000 * 80 - 40000

      pay_y = 360000 * nsd_y / (nsd_x + nsd_y + nsd_z)

      sonuc = pay_y + 40000

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: Kökte 'net satış değeri' tanımlandı (nihai satış değeri - ayrılma noktasından sonraki ek işlem maliyeti).
    neden: 'G5 (küçük): TMS 2 md. 14 nihai nispi satış değerini de örnek verdiğinden terim kökte tanımlanmalıydı.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS 2 atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic TMS 2'nin RG'de yeniden yayım tarihine
      (2018-05-24) çekildi.
    neden: Terim tutarlılığı (TMS'de birim paragraftır); baslangic soru üretim tarihiydi.
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
