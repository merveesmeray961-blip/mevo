    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dbym, tamam, dsym = 2000, 11000, 3000

      sonuc = dbym * (1 - 0) + (tamam - dbym) + dsym * 0'
