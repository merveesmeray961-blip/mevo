- id: SMMM-MAL-SAF-0015
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: kavrama
  zorluk: 2
  kok: 'Çok safhalı üretim yapan ve 7/A seçeneğini uygulayan bir işletmede safha maliyetlerinin hesaplara aktarılmasıyla
    ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Son safhada üretimi tamamlanan mamullerin maliyeti, 152 Mamuller hesabının borcuna ve 151 Yarı Mamuller -
    Üretim hesabının alacağına kaydedilir.

    II. Dönem sonu yarı mamullerin maliyeti dönem sonunda 152 Mamuller hesabına aktarılarak 151 Yarı Mamuller -
    Üretim hesabı kapatılır.

    III. İkinci safhanın dönem sonu yarı mamulleri için önceki safhadan devralınan maliyet unsurunun tamamlanma
    derecesi, ikinci safhanın dönüştürme tamamlanma derecesine eşit kabul edilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: A
  aciklama:
    dogru_neden: 'I doğrudur: 151 hesabında üretimi tamamlananların maliyeti hesabın alacağı karşılığında stok hesaplarına
      aktarılır; 152 hesabı üretimi tamamlanan mamullerin ambara alınmasıyla borçlandırılır. II yanlıştır: Dönem
      sonu yarı mamul maliyeti 151 hesabında borç kalanı olarak kalır ve gelecek dönemin dönem başı yarı mamulünü
      oluşturur; henüz mamul hâline gelmediği için 152''ye aktarılmaz. III yanlıştır: Önceki safhadan devralınan
      birimler devralınan maliyet unsuru bakımından %100 tamamdır.'
    celdiriciler:
      B: II yanlıştır; yarı mamuller 151'de kalır, 152'ye ancak üretimi tamamlanan mamuller alınır.
