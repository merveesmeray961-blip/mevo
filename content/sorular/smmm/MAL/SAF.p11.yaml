- id: SMMM-MAL-SAF-0014
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: tamamlanma derecesi geri hesap
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. Tek safhalı üretim yapan ZT İşletmesi ağırlıklı ortalama yöntemini uygulamakta,
    ilk madde ve malzemeyi üretimin başında koymaktadır. Dönem başında 1.000 birim yarı mamul vardır; maliyeti ilk
    madde 24.000 ₺, dönüştürme 9.000 ₺''dır. Dönemde 7.000 birim üretime alınmış ve 176.000 ₺ ilk madde kullanılmıştır.
    Dönemde 6.500 birim tamamlanmış, 1.500 birim dönüştürme bakımından %40 tamamlanmış hâlde kalmıştır. Tamamlanan
    mamullerin maliyeti 357.500 ₺ olarak hesaplanmış, ancak dönemin dönüştürme maliyeti kayıtlardan silinmiştir.


    Buna göre dönem içinde katlanılan dönüştürme maliyeti kaç TL''dir?'
  secenekler:
    A: '195.000'
    B: '204.000'
    C: '213.000'
    D: '231.000'
    E: '240.000'
  dogru: B
  aciklama:
    dogru_neden: 'İlk madde birim maliyeti = (24.000 + 176.000) / (6.500 + 1.500) = 25 ₺. Tamamlanan birim maliyeti
      357.500 / 6.500 = 55 ₺ olduğundan dönüştürme birim maliyeti 55 − 25 = 30 ₺''dir. Dönüştürme eşdeğer birimi
      6.500 + 1.500 × %40 = 7.100; toplam dönüştürme maliyeti 7.100 × 30 = 213.000 ₺. Ortalama yönteminde bu toplam
      DBYM''nin dönüştürme maliyetini de içerdiğinden dönem içi tutar 213.000 − 9.000 = 204.000 ₺''dir. Püf noktaları:
      Ağırlıklı ortalamada birim maliyet (DBYM + dönem maliyeti) havuzundan çıkar; geri hesapta bulduğun havuzdan
      DBYM payını düşmeyi unutma. İlk madde başta konulduğu için yarı mamuller ilk madde bakımından %100 sayılır.'
    celdiriciler:
      A: '195.000: Dönüştürme maliyeti yalnız tamamlananlar için hesaplanmıştır (6.500 × 30); yarı mamul eşdeğeri
        unutulmuştur.'
      C: '213.000: Toplam dönüştürme havuzu bulunmuş, DBYM''nin 9.000 ₺ dönüştürme maliyeti düşülmemiştir.'
      D: '231.000: Yarı mamuller dönüştürme bakımından tam kabul edilmiş (8.000 × 30), sonra DBYM payı düşülmüştür.'
      E: '240.000: Yarı mamuller tam kabul edilmiş ve DBYM payı da düşülmemiştir (8.000 × 30).'
    hesap_adimlari:
    - İlk madde birim maliyeti = 200.000 / 8.000 = 25 ₺
    - Dönüştürme birim maliyeti = 357.500 / 6.500 − 25 = 30 ₺
    - Dönüştürme EB = 6.500 + 600 = 7.100; havuz = 213.000 ₺
    - Dönem içi dönüştürme = 213.000 − 9.000 = 204.000 ₺
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — MAL/SAF (Safha maliyeti ve eşdeğer birim)
    madde: §4 Ağırlıklı ortalama yöntemi
    alinti: ''
  - mevzuat: TMS 2 Stoklar
    madde: par. 27
    alinti: dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın alınan veya üretilen benzer kalemlerin
      maliyetlerinin ağırlıklı ortalaması alınarak belirlenir
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ilk = (24000 + 176000) / (6500 + 1500)

      don_bm = 357500 / 6500 - ilk

      havuz = (6500 + 1500 * 0.4) * don_bm

      sonuc = havuz - 9000'
