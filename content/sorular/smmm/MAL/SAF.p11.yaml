- id: SMMM-MAL-SAF-0013
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: eşdeğer birim
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. Tek safhalı üretim yapan FL İşletmesi FIFO yöntemini uygulamaktadır. İlk madde
    ve malzeme safhanın sonunda, kalite kontrolden hemen önce eklenmektedir. Dönem başında dönüştürme bakımından
    %30 tamamlanmış 2.000 birim yarı mamul vardır. Dönemde 12.000 birim üretime alınmış, 11.000 birim tamamlanmış,
    3.000 birim dönüştürme bakımından %50 tamamlanmış hâlde dönem sonu yarı mamul olarak kalmıştır.


    Buna göre ilk madde ve malzeme için FIFO eşdeğer birim sayısı kaçtır?'
  secenekler:
    A: '9.000'
    B: '11.000'
    C: '12.000'
    D: '12.500'
    E: '14.000'
  dogru: B
  aciklama:
    dogru_neden: İlk madde safha sonunda eklendiği için dönem başı ve dönem sonu yarı mamullerin ilk madde tamamlanma
      derecesi %0'dır. FIFO eşdeğer birim = DBYM × (1 − 0) + başlanıp bitirilen (11.000 − 2.000 = 9.000) + DSYM
      × %0 = 2.000 + 9.000 + 0 = 11.000. Dönem başı yarı mamuller ilk maddelerini bu dönem almıştır; dönem sonu
      yarı mamuller henüz hiç ilk madde almamıştır.
    celdiriciler:
      A: '9.000: Dönem başı yarı mamullerin ilk maddesi geçen dönemde konulmuş sanılarak yalnız başlanıp bitirilenler
        sayılmıştır.'
      C: '12.000: Dönemde üretime alınan fiziki miktar eşdeğer birim sanılmıştır.'
      D: '12.500: Dönem sonu yarı mamullere dönüştürme derecesi (%50) ilk madde için de uygulanmıştır (11.000 +
        1.500).'
      E: '14.000: İlk madde başta konuluyormuş gibi dönem sonu yarı mamuller %100 sayılmıştır (11.000 + 3.000).'
    hesap_adimlari:
    - DBYM'nin bu dönem aldığı ilk madde = 2.000 × %100 = 2.000
    - Başlanıp bitirilen = 11.000 − 2.000 = 9.000
    - DSYM ilk madde eşdeğeri = 3.000 × %0 = 0
    - FIFO EB = 2.000 + 9.000 + 0 = 11.000
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — MAL/SAF (Safha maliyeti ve eşdeğer birim)
    madde: §2 Eşdeğer birim
    alinti: ''
