- id: SMMM-MAL-SAF-0011
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: eşdeğer birim
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. İki safhalı üretim yapan TS İşletmesi ağırlıklı ortalama yöntemini uygulamaktadır.
    II. safhada dönem başında 1.000 birim yarı mamul vardır; maliyeti devralınan maliyet 30.000 ₺, dönüştürme maliyeti
    8.000 ₺''dır. Dönemde I. safhadan 9.000 birim 300.000 ₺ maliyetle devralınmıştır. II. safhada ambalaj malzemesi
    safhanın sonunda konulmakta olup dönemde 40.000 ₺ ambalaj malzemesi kullanılmıştır; dönemin dönüştürme maliyeti
    154.000 ₺''dır. Dönemde 8.000 birim tamamlanarak mamul ambarına gönderilmiş, 2.000 birim dönüştürme bakımından
    %50 tamamlanmış hâlde dönem sonu yarı mamul olarak kalmıştır.


    Buna göre II. safhanın dönem sonu yarı mamul maliyeti kaç TL''dir?'
  secenekler:
    A: '18.000'
    B: '66.000'
    C: '84.000'
    D: '92.000'
    E: '112.000'
  dogru: C
  aciklama:
    dogru_neden: 'Eşdeğer birimler (ortalama): devralınan maliyet 8.000 + 2.000 × %100 = 10.000; ambalaj (safha
      sonunda) 8.000 + 2.000 × %0 = 8.000; dönüştürme 8.000 + 2.000 × %50 = 9.000. Birim maliyetler: devralınan
      (30.000 + 300.000) / 10.000 = 33 ₺; ambalaj 40.000 / 8.000 = 5 ₺; dönüştürme (8.000 + 154.000) / 9.000 = 18
      ₺. Dönem sonu yarı mamul = 2.000 × 33 + 0 + 1.000 × 18 = 84.000 ₺. Püf noktaları: Önceki safhadan devralınan
      unsur yarı mamul için daima %100 tamamdır; safha sonunda konulan malzemeden yarı mamule pay düşmez. Üç unsuru
      ayrı ayrı ele almadan tek derece uygulamak sonucu bozar. Kontrol: tamamlananlar 8.000 × 56 = 448.000 ₺ + 84.000
      = 532.000 ₺ toplam maliyet.'
    celdiriciler:
      A: '18.000: Devralınan maliyet ayrı bir unsur olarak dikkate alınmamış, yalnız dönüştürme payı hesaplanmıştır.'
      B: '66.000: Yalnız devralınan maliyet payı alınmış, dönüştürme payı unutulmuştur.'
      D: '92.000: Safha sonunda konulan ambalaj malzemesi yarı mamuller için %100 kabul edilmiştir (ambalaj birim
        maliyeti 4 ₺; 66.000 + 8.000 + 18.000).'
      E: '112.000: Yarı mamullerin fiziki adedi eşdeğer birim kabul edilip tam birim maliyetle çarpılmıştır (2.000
        × 56).'
    hesap_adimlari:
    - 'EB: devralınan 10.000; ambalaj 8.000; dönüştürme 9.000'
    - 'Birim maliyet: devralınan 33 ₺; ambalaj 5 ₺; dönüştürme 18 ₺'
    - DSYM = 2.000 × 33 + 1.000 × 18 = 84.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 25
    alinti: ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir
  - mevzuat: Hakemli konu anlatımı — MAL/SAF (Safha maliyeti ve eşdeğer birim)
    madde: §2 Eşdeğer birim
    alinti: ''
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dev = (30000 + 300000) / (8000 + 2000)

      amb = 40000 / 8000

      don = (8000 + 154000) / (8000 + 2000 * 0.5)

      sonuc = 2000 * dev + 0 * amb + 2000 * 0.5 * don'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: gecti
        tarih: '2026-10-19'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: gecti
        not: 'c1: C (güven 4); c2: C (güven 5)'
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'baş hakem: tek tek okundu, hesaplar doğrulandı'
      G6:
        sonuc: gecti
        tarih: '2026-10-19'
        not: alıntılar mevzuat metninde doğrulandı; yöntem sorularında formül kökte/açıklamada
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_M2b.yaml, satır 13
- id: SMMM-MAL-SAF-0012
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: tamamlanma derecesi geri hesap
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. Tek safhalı üretim yapan EV İşletmesi''nin dönem verileri hem ağırlıklı ortalama
    hem FIFO yöntemiyle hesaplanmıştır. Dönüştürme maliyetleri için eşdeğer birim ağırlıklı ortalama yönteminde
    9.200, FIFO yönteminde 8.300 bulunmuştur. Dönem başında 1.500 birim yarı mamul vardır. Dönem sonunda 2.000 birim
    yarı mamul dönüştürme bakımından %40 tamamlanmış durumdadır.


    Buna göre dönemde tamamlanan birim sayısı ve dönem başı yarı mamullerin dönem başındaki dönüştürme tamamlanma
    derecesi aşağıdakilerden hangisidir?'
  secenekler:
    A: 7.200 birim; %60
    B: 7.500 birim; %60
    C: 8.300 birim; %60
    D: 8.400 birim; %40
    E: 8.400 birim; %60
  dogru: E
  aciklama:
    dogru_neden: 'Ortalama yöntemde eşdeğer birim = tamamlanan + DSYM eşdeğeri olduğundan tamamlanan = 9.200 − 2.000
      × %40 = 8.400 birimdir. İki yöntemin eşdeğer birim farkı DBYM''nin geçen dönemde ulaştığı eşdeğere eşittir:
      9.200 − 8.300 = 900 = 1.500 × derece → %60. Kontrol (FIFO): 1.500 × %40 + (8.400 − 1.500) + 800 = 600 + 6.900
      + 800 = 8.300. Püf noktaları: Fark, DBYM''nin bu dönem tamamlanan kısmını (%40) değil, dönem başında zaten
      sahip olduğu kısmı (%60) verir. Tamamlananı FIFO eşdeğerinden değil ortalama eşdeğerinden bulmalısın.'
    celdiriciler:
      A: '7.200 birim; %60: Tamamlanan bulunurken DSYM''nin eşdeğeri yerine fiziki adedi (2.000) düşülmüştür.'
      B: '7.500 birim; %60: Tamamlanan, FIFO eşdeğer biriminden DSYM eşdeğeri düşülerek bulunmuştur; FIFO formülünde
        DBYM''nin geçen dönem payı da düşülmüş olduğundan sonuç eksik kalır.'
      C: '8.300 birim; %60: FIFO eşdeğer birimi doğrudan tamamlanan birim sayısı sanılmıştır.'
      D: '8.400 birim; %40: Fark 900''ün DBYM''ye oranı (%60) dönem başındaki derecedir; %40 bu dönemde tamamlanan
        kısımdır.'
    hesap_adimlari:
    - Tamamlanan = 9.200 − 2.000 × 0,40 = 8.400 birim
    - Fark = 9.200 − 8.300 = 900 = 1.500 × derece
    - Derece = 900 / 1.500 = %60
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — MAL/SAF (Safha maliyeti ve eşdeğer birim)
    madde: §6 İki yöntemin karşılaştırılması
    alinti: ''
  - mevzuat: TMS 2 Stoklar
    madde: par. 25
    alinti: ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'tamamlanan = 9200 - 2000 * 0.40

      derece = (9200 - 8300) / 1500

      sonuc = tamamlanan'
    secenek_sayisi_bekleniyor: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: gecti
        tarih: '2026-10-19'
        not: şıklar sayı + nitelik içeriyor; sonuç hakemce doğrulandı
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: gecti
        not: 'c1: E (güven 5); c2: E (güven 5)'
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'baş hakem: tek tek okundu, hesaplar doğrulandı'
      G6:
        sonuc: gecti
        tarih: '2026-10-19'
      GZ:
        sonuc: bekliyor
