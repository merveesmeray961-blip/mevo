- id: SMMM-MAL-SAF-0051
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: ağırlıklı ortalama yöntemde tamamlanan birimlerin maliyeti
  tip: hesaplama
  zorluk: 2
  kok: KDV dikkate alınmayacaktır. TL İşletmesi tek safhalı üretim yapmakta ve safha maliyetini ağırlıklı ortalama yöntemiyle
    hesaplamaktadır. İlk madde safhanın başında tamamen verilmekte, dönüşüm giderleri düzenli oluşmaktadır. Dönem başında
    600 birim yarı mamul bulunmakta olup bunların maliyeti 8.400 ₺ ilk madde ve 4.500 ₺ dönüşüm giderinden oluşmaktadır. Dönem
    içinde 5.400 birim üretime başlanmış, 5.200 birim tamamlanmış ve dönem sonunda dönüşüm bakımından %25 tamamlanmış 800
    birim yarı mamul kalmıştır. Dönem içinde katlanılan ilk madde maliyeti 81.600 ₺, dönüşüm maliyeti 60.300 ₺'dir. Dönem
    içinde tamamlanan 5.200 birimin toplam maliyeti kaç ₺'dir?
  secenekler:
    A: 14.400 ₺
    B: 127.500 ₺
    C: 134.160 ₺
    D: 140.400 ₺
    E: 153.300 ₺
  dogru: D
  aciklama:
    dogru_neden: 'İlk madde eşdeğer birimi 5.200 + 800 = 6.000; dönüşüm eşdeğer birimi 5.200 + 800 × 0.25 = 5.400. Ağırlıklı
      ortalamada dönem başı maliyetler cari maliyetlere eklenir: ilk madde (8.400 + 81.600) / 6.000 = 15 ₺, dönüşüm (4.500
      + 60.300) / 5.400 = 12 ₺. Tamamlanan birimlerin maliyeti 5.200 × (15 + 12) = 140.400 ₺''dir. Püf noktaları: Ağırlıklı
      ortalamada dönem başı yarı mamul tamamlanmış kabul edilip maliyeti havuza eklenir; bu yüzden dönem başı birimlerin tamamlanma
      yüzdesi eşdeğer birim hesabını etkilemez.'
    celdiriciler:
      A: Dönem sonu yarı mamullerin maliyetidir; tamamlanan birimlerin maliyeti istenmiştir.
      B: Dönem başı yarı mamul maliyeti birim maliyetten ayrıca düşülmüştür; ağırlıklı ortalama yöntemde bu maliyet birim
        maliyete katılır.
      C: Dönem sonu yarı mamuller dönüşüm bakımından tamamlanmış gibi (%100) eşdeğer birim hesaplanmıştır; oysa bu birimler
        %25 tamamlanmıştır.
      E: Dönem başı yarı mamul maliyeti (12.900 ₺) ağırlıklı ortalama birim maliyete zaten dahil olduğundan ayrıca eklenmesi
        çifte sayımdır.
    hesap_adimlari:
    - İlk madde EB = 6.000; birim = 15
    - Dönüşüm EB = 5.400; birim = 12
    - Tamamlanan = 5.200 × 27 = 140.400
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Safha maliyeti — ağırlıklı ortalama
    alinti: ''
  gecerlilik: &id001
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 5200 * ((8400 + 81600) / (5200 + 800) + (4500 + 60300) / (5200 + 800 * 0.25))
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Bağımsız çözüm anahtarla aynı; hesap/mevzuat doğrulandı, tek doğru şık.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_A/MAL_SAF_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Bağımsız çözüm anahtarla aynı; hesap/mevzuat doğrulandı, tek doğru şık.'
