      birim düşülür. Dönem sonu yarı mamuller %30 düzeyinde olup ilave madde noktasına ulaşmamıştır. FIFO eşdeğer birim =
      5.000 − 800 + 0 = 4.200. Püf noktaları: FIFO''da yalnızca bu dönem verilen ilave madde sayılır: dönem başı stok maddeyi
      geçen dönem almışsa çıkarılır, dönem sonu stok noktayı geçmişse eklenir.'
