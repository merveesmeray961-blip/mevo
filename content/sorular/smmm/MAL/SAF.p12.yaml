  kok: KDV dikkate alınmayacaktır. KV İşletmesi tek safhalı üretim yapmakta ve ağırlıklı ortalama yöntemini uygulamaktadır.
    İlk madde safhanın sonunda, yalnızca tamamlanan birimlere verilmektedir; dönüşüm giderleri düzenli oluşmaktadır. Dönem
    başında dönüşüm bakımından %60 tamamlanmış 1.000 birim yarı mamul vardır (dönüşüm maliyeti 7.200 ₺). Dönem içinde 7.000
    birim üretime başlanmış, 6.400 birim tamamlanmış, dönem sonunda %50 dönüşüm düzeyinde 1.600 birim yarı mamul kalmıştır.
    Dönem içindeki dönüşüm maliyeti 79.200 ₺, tamamlanan birimlere verilen ilk madde maliyeti 128.000 ₺'dir. Dönem sonu yarı
    mamullerin maliyeti kaç ₺'dir?
  secenekler:
    A: 9.600 ₺
    B: 16.000 ₺
    C: 19.200 ₺
    D: 25.600 ₺
    E: 51.200 ₺
  dogru: A
  aciklama:
    dogru_neden: 'İlk madde dönem sonu yarı mamullere verilmediğinden onların maliyeti yalnızca dönüşüm giderinden oluşur.
      Dönüşüm eşdeğer birimi 6.400 + 1.600 × 0.5 = 7.200; birim dönüşüm maliyeti (7.200 + 79.200) / 7.200 = 12 ₺. Dönem sonu
      yarı mamul maliyeti 1.600 × 0.5 × 12 = 9.600 ₺''dir. Püf noktaları: İlk madde safha sonunda veriliyorsa yarı mamulün
      ilk madde eşdeğer birimi sıfırdır; yalnızca dönüşüm payı hesaplanır. Dönem başı maliyet ağırlıklı ortalamada havuza
      girer.'
    celdiriciler:
      B: Yarı mamullere yalnızca ilk madde maliyeti yüklenmiştir; ilk madde henüz verilmediği için yarı mamulün maliyeti dönüşüm
        giderinden oluşur.
      C: Dönem sonu yarı mamuller dönüşüm bakımından %100 tamamlanmış gibi değerlenmiştir; oysa bu birimler %50 düzeydedir.
      D: Dönüşüm payı doğru alınmış ancak yarı mamullere ilk madde maliyeti de yüklenmiştir; ilk madde henüz verilmemiştir.
      E: İlk madde safha sonunda verildiğinden dönem sonu yarı mamullere ilk madde maliyeti yüklenemez; hem dönüşüm %100 hem
        ilk madde eklenmiştir.
    hesap_adimlari:
    - Dönüşüm EB = 6.400 + 1.600 × 0.5 = 7.200
    - Birim dönüşüm = (7.200 + 79.200) / 7.200 = 12
