  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO yönteminde tamamlanan birimlerin toplam maliyeti
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. DR İşletmesi tek safhalı üretim yapmakta ve FIFO yöntemini uygulamaktadır. İlk madde safhanın
    başında tamamen verilmekte, dönüşüm giderleri düzenli oluşmaktadır. Dönem başında dönüşüm bakımından %40 tamamlanmış 500
    birim yarı mamul vardır; bunların önceki dönemde oluşan maliyeti 17.000 ₺'dir. Dönem içinde 6.000 birim üretime başlanmış,
    5.700 birim tamamlanmış, dönem sonunda dönüşüm bakımından %50 tamamlanmış 800 birim yarı mamul kalmıştır. Dönem içinde
    katlanılan ilk madde maliyeti 90.000 ₺, dönüşüm maliyeti 70.800 ₺'dir. Dönem içinde tamamlanan 5.700 birimin toplam maliyeti
    kaç ₺'dir?
  secenekler:
    A: 144.000 ₺
    B: 153.900 ₺
    C: 161.000 ₺
    D: 163.400 ₺
    E: 177.800 ₺
  dogru: C
  aciklama:
    dogru_neden: 'FIFO''da ilk madde eşdeğer birimi 5.700 − 500 + 800 = 6.000 (birim maliyet 15 ₺); dönüşüm eşdeğer birimi
      5.700 − 500 × 0.4 + 800 × 0.5 = 5.900 (birim maliyet 12 ₺). Tamamlanan maliyet = dönem başı maliyet 17.000 + tamamlama
      300 × 12 = 3.600 + dönemde başlanıp biten 5.200 × 27 = 140.400 → 161.000 ₺. Püf noktaları: FIFO''da tamamlanan maliyet
      üç parçadır: dönem başı yarı mamulün eski maliyeti, onu tamamlama maliyeti ve dönem içinde başlanıp bitenlerin maliyeti.'
    celdiriciler:
      A: Dönem başı yarı mamullerin önceki dönemde oluşan maliyeti (17.000 ₺) eklenmemiştir.
      B: Tamamlanan tüm birimler cari dönem birim maliyetiyle çarpılmıştır; dönem başı yarı mamulün önceki dönem maliyeti
        göz ardı edilmiş ve tamamlama aşaması ayrılmamıştır.
      D: Dönem başı yarı mamuller dönemde %100 dönüşüm görmüş gibi hesaplanmıştır; oysa geçen dönem %40 dönüşüm yapılmıştır.
      E: Dönem sonu yarı mamullerin maliyeti de eklenmiştir; bu tutar dönemin toplam maliyetidir, tamamlanan birimlerin maliyeti
        değildir.
    hesap_adimlari:
    - İlk madde EB = 6.000; birim = 15
    - Dönüşüm EB = 5.900; birim = 12
    - Tamamlanan = 17.000 + 3.600 + 140.400 = 161.000
