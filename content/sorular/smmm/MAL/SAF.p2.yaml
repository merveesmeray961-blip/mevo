    C: Genel imal giderlerinden mamule düşen hisse mamul maliyetine katılmaz.
    D: Zaruri ambalaj bedeli ve işçilik mamul maliyetinin ihtiyari unsurlarıdır.
    E: Normalin üstünde gerçekleşen hammadde fireleri stok maliyetine katılır.
