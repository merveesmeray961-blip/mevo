- id: SMMM-MAL-SAF-0016
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: eşdeğer birim
  tip: hesaplama
  zorluk: 1
  kok: KB İşletmesi'nin safha maliyet raporunda dönem sonu yarı mamul 1.000 birim olup bu birimler dönüşüm bakımından %50
    tamamlanmıştır. Bu yarı mamullerin dönüşüm bakımından eşdeğer birim sayısı kaçtır?
  secenekler:
    A: 50 birim
    B: 500 birim
    C: 1.000 birim
    D: 1.500 birim
    E: 2.000 birim
  dogru: B
  aciklama:
    dogru_neden: 'Eşdeğer birim, kısmen tamamlanmış birimlerin tam mamul cinsinden karşılığıdır: fiziki miktar × tamamlanma
      derecesi = 1.000 × %50 = 500 birimdir. Yarı mamullerin izlendiği 151 Yarı Mamuller-Üretim hesabı, henüz tam mamul haline
      gelmemiş üretim aşamasındaki mamulleri kapsar.'
    celdiriciler:
      A: Tamamlanma yüzdesi (50) eşdeğer birim sayısı olarak alınmıştır; fiziki miktarla çarpılmamıştır.
      C: Fiziki yarı mamul miktarıdır; tamamlanma derecesi uygulanmamıştır.
      D: Fiziki miktara eşdeğer birimin eklenmesiyle bulunmuştur; eşdeğer birim yalnızca miktar × derecedir.
      E: Fiziki miktar tamamlanma oranına bölünmüş (1.000 / 0,5) gibi işlem yapılmıştır.
    hesap_adimlari:
    - Eşdeğer birim = 1.000 × 0,50 = 500
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tekdüzen Hesap Planı'
    madde: 151 Yarı Mamuller-Üretim
    alinti: 'Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden
      belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi : Maliyet dönemi sonunda direkt
      ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır. Üretimi tamamlananların
      maliyet tutarı bu hesabın alacağı karşılığında ilgili stok hesaplarına aktarılır.'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1000 * 0.5
  durum: kontrolde
  surum: 1
  uretim:
