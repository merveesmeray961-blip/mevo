      C: Dönüşüm maliyeti yalnızca tamamlanan birimlere (6.000) bölünmüştür; DSYM'nin eşdeğeri unutulmuştur.
      D: Devralınan maliyet tamamlanan birimlere (6.000) bölünmüş, DSYM'nin devralınan maliyetteki payı atlanmıştır.
      E: Devralınan toplam maliyettir; birim maliyet değildir.
    hesap_adimlari:
    - Devralınan birim maliyet = 400.000 / 8.000 = 50
    - Dönüşüm eşdeğer birimi = 6.000 + 1.000 = 7.000
    - Dönüşüm birim maliyeti = 73.500 / 7.000 = 10,5
    - Toplam = 60,5 TL
