- id: SMMM-MAL-SAF-0036
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: hesaplama
  zorluk: 3
  kok: AZ İşletmesi safha maliyet sistemini uygulamaktadır. İlk madde safhanın başında tamamen verilmekte, dönüşüm giderleri
    (işçilik ve genel üretim giderleri) üretim boyunca düzenli oluşmaktadır. Dönem başında 400 birim yarı mamul (dönüşüm bakımından
    %50 tamamlanmış) bulunmakta, dönem içinde 5.600 birim üretime başlanmış, 5.400 birim tamamlanmış ve 600 birim yarı mamul
    (dönüşüm bakımından %50 tamamlanmış) dönem sonunda kalmıştır. FIFO yöntemi uygulanmaktadır; dönem içinde katlanılan maliyetler
    ilk madde 112.000 TL, dönüşüm 159.500 TL'dir. Dönem sonu yarı mamullerin FIFO yöntemine göre maliyeti kaç TL'dir? KDV
    dikkate alınmayacaktır.
  secenekler:
    A: 8.700 TL
    B: 12.000 TL
    C: 20.700 TL
    D: 21.000 TL
    E: 264.600 TL
  dogru: C
  aciklama:
    dogru_neden: 'İlk madde eşdeğer birimi 5.400 − 400 + 600 = 5.600; birim maliyeti 112.000 / 5.600 = 20 TL. Dönüşüm eşdeğer
      birimi 5.500; birim maliyeti 159.500 / 5.500 = 29 TL. DSYM = 600 × 20 + 300 × 29 = 12.000 + 8.700 = 20.700 TL''dir.
      FIFO''da DSYM cari dönem birim maliyetleriyle değerlenir. Püf noktaları: FIFO''da DSYM''nin ilk madde derecesi %100,
      dönüşüm derecesi %50''dir; eşdeğer birimlerde DBYM''nin geçen dönem payı düşülür. Ortalama yöntem birim maliyetlerini
      kullanmak tipik hatadır.'
    celdiriciler:
      A: Yalnızca dönüşüm maliyetidir (300 × 29); ilk madde maliyeti eklenmemiştir.
      B: Yalnızca ilk madde maliyetidir (600 × 20); dönüşüm eklenmemiştir.
      D: Ağırlıklı ortalama birim maliyetlerinin (20 + 30) kullanıldığı değerdir; FIFO'da dönem birim maliyetleri (20 ve 29)
        kullanılır.
      E: Tamamlanan 5.400 birimin dönem birim maliyetiyle (49 TL) çarpımıdır; dönem sonu yarı mamul sorulmaktadır.
    hesap_adimlari:
    - İlk madde birim = 112.000 / 5.600 = 20
    - Dönüşüm birim = 159.500 / 5.500 = 29
    - DSYM = 600 × 20 + 300 × 29 = 20.700 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
  - mevzuat: 'MSUGT Sıra No: 1, Tekdüzen Hesap Planı'
    madde: 151 Yarı Mamuller-Üretim
    alinti: 'Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden
      belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi : Maliyet dönemi sonunda direkt
      ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır. Üretimi tamamlananların
      maliyet tutarı bu hesabın alacağı karşılığında ilgili stok hesaplarına aktarılır.'
