      B: FIFO dönüşüm eşdeğer birim sayısıdır; maliyet değildir.
      D: DBYM'nin tamamı (400 birim) bu dönemde işlenmiş gibi birim maliyetle çarpılmıştır; geçen dönemdeki %50 düşülmemiştir.
      E: DBYM'nin geçen dönem maliyeti (14.000 TL) ile bu dönemde katlanılan 5.800 TL'nin toplamıdır; yalnızca bu dönem katlanılan
        sorulmaktadır.
