  kok: AB İşletmesi safha maliyet sistemini uygulamaktadır. İlk madde safhanın başında tamamen verilmekte, dönüşüm giderleri
    (işçilik ve genel üretim giderleri) üretim boyunca düzenli oluşmaktadır. Dönem başında 400 birim yarı mamul (dönüşüm bakımından
    %50 tamamlanmış) bulunmakta, dönem içinde 5.600 birim üretime başlanmış, 5.400 birim tamamlanmış ve 600 birim yarı mamul
    (dönüşüm bakımından %50 tamamlanmış) dönem sonunda kalmıştır. FIFO yöntemi uygulanmaktadır; dönem içinde katlanılan dönüşüm
    maliyeti 159.500 TL'dir. Dönem başı yarı mamullerin tamamlanması için bu dönemde dönüşüm bakımından katlanılan maliyet
    kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
