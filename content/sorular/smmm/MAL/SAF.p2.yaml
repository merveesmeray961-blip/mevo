    B: Dönem sonu yarı mamullerin ilk madde eşdeğer birimi fiziki miktarın %40'ına, dönüşüm eşdeğer birimi fiziki miktara
      eşittir.
    C: Dönem sonu yarı mamuller eşdeğer birim hesabına katılmaz; yalnızca tamamlananlar esas alınır.
    D: İlk madde eşdeğer birimi fiziki miktara, dönüşüm eşdeğer birimi fiziki miktarın %40'ına eşittir.
    E: Ağırlıklı ortalama ile FIFO yöntemlerinin eşdeğer birimleri bu durumda farklı çıkar.
  dogru: D
  aciklama:
    dogru_neden: 'Tekdüzen Hesap Planı''na göre 151 Yarı Mamuller-Üretim hesabı ilk madde, işçilik ve genel üretim giderleri
      kadar borçlandırılır. İlk madde başta verildiğinden yarı mamul ilk madde bakımından tamdır; dönüşüm bakımından derecesi
      kadar eşdeğerdir. DBYM bulunmadığından FIFO ve ağırlıklı ortalama aynı sonucu verir (TMS 2 par. 27). Püf noktaları:
      Unsur bazında düşün: ilk madde derecesi %100, dönüşüm derecesi soruda verilen orandır. DBYM yoksa yöntem farkı da kalmaz.'
    celdiriciler:
      A: İlk madde başta verildiğinden yarı mamuller ilk madde bakımından %100 tamamdır.
      B: Dereceler ters yazılmıştır; dönüşüm %40, ilk madde %100'dür.
      C: Yarı mamuller eşdeğer birim hesabına derecelerine göre katılır; aksi halde maliyetleri dağıtılamaz.
      E: DBYM olmadığından iki yöntemin eşdeğer birimleri aynıdır.
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tekdüzen Hesap Planı'
    madde: 151 Yarı Mamuller-Üretim
    alinti: 'Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden
      belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi : Maliyet dönemi sonunda direkt
      ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır. Üretimi tamamlananların
      maliyet tutarı bu hesabın alacağı karşılığında ilgili stok hesaplarına aktarılır.'
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
