- id: SMMM-MAL-SAF-0027
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: hesaplama
  zorluk: 2
  kok: AB İşletmesi safha maliyet sistemini uygulamaktadır. İlk madde safhanın başında tamamen verilmekte, dönüşüm giderleri
    (işçilik ve genel üretim giderleri) üretim boyunca düzenli oluşmaktadır. Dönem başında 2.000 birim yarı mamul (dönüşüm
    bakımından %25 tamamlanmış) bulunmakta, dönem içinde 8.000 birim üretime başlanmış, 7.000 birim tamamlanmış ve 3.000 birim
    yarı mamul (dönüşüm bakımından %40 tamamlanmış) dönem sonunda kalmıştır. FIFO yöntemi uygulanmakta olup dönem içinde katlanılan
    maliyetler ilk madde 100.000 TL, dönüşüm 77.000 TL'dir. Bu dönemin bir birim tam mamul için birim maliyeti (ilk madde
    + dönüşüm) kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 10 TL
    B: 12,5 TL
    C: 17,7 TL
    D: 22,5 TL
    E: 177.000 TL
  dogru: D
  aciklama:
    dogru_neden: FIFO'da yalnızca dönem maliyeti kullanılır. İlk madde eşdeğer birimi 7.000 − 2.000 + 3.000 = 8.000, birim
      maliyeti 12,5 TL. Dönüşüm eşdeğer birimi 7.000 − 500 + 1.200 = 7.700, birim maliyeti 10 TL. Toplam 22,5 TL'dir (TMS
      2 paragraf 27).
    celdiriciler:
      A: Yalnızca dönüşüm birim maliyetidir (77.000 / 7.700); ilk madde eklenmemiştir.
      B: Yalnızca ilk madde birim maliyetidir (100.000 / 8.000); dönüşüm eklenmemiştir.
      C: Her iki maliyet de fiziki toplama (10.000) bölünmüştür; eşdeğer birim kullanılmamıştır.
      E: Toplam dönem maliyetidir; birim maliyete ulaşmak için eşdeğer birimlere bölünmemiştir.
    hesap_adimlari:
    - 'İlk madde: 100.000 / 8.000 = 12,5'
    - 'Dönüşüm: 77.000 / 7.700 = 10'
    - Toplam = 22,5 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
