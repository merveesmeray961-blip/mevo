    dogru_neden: 'VUK md. 275''e göre genel idare giderlerinden mamule düşen hissenin maliyete katılması ihtiyaridir. TMS
      2 paragraf 16(d)''ye göre satış maliyetleri stokların maliyetine dahil edilmeyip gerçekleştikleri dönemde gider olarak
      yansıtılır. Püf noktaları: İki metnin ölçütleri farklıdır: VUK ihtiyari unsuru sayar, TMS 2 dönem gideri sayılacak kalemleri
      sayar. Seçeneklerde zorunlu ve ihtiyari unsurları ters yazan ifadelere dikkat et.'
    celdiriciler:
      B: Satış maliyetleri TMS 2'ye göre stok maliyeti dışındadır; genel idare hissesi VUK'a göre ihtiyaridir.
      C: Genel imal giderlerinden hisse VUK md. 275'in zorunlu unsurudur; TMS 2 de dağıtılan genel üretim giderlerini dahil
        eder.
      D: İşçilik ve zaruri ambalaj bedeli VUK'a göre maliyet bedelinin unsurlarıdır, ihtiyari olan genel idare hissesidir.
      E: TMS 2 paragraf 16(a)'ya göre normalin üstündeki fire ve kayıplar dönem giderine yazılır.
