      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
