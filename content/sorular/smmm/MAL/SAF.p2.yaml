- id: SMMM-MAL-SAF-0018
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: eşdeğer birim
  tip: hesaplama
  zorluk: 1
  kok: AB İşletmesi safha maliyet sistemini uygulamaktadır. İlk madde safhanın başında tamamen verilmekte, dönüşüm giderleri
    (işçilik ve genel üretim giderleri) üretim boyunca düzenli oluşmaktadır. Dönem başında 2.000 birim yarı mamul (dönüşüm
    bakımından %25 tamamlanmış) bulunmakta, dönem içinde 8.000 birim üretime başlanmış, 7.000 birim tamamlanmış ve 3.000 birim
    yarı mamul (dönüşüm bakımından %40 tamamlanmış) dönem sonunda kalmıştır. Ağırlıklı ortalama yöntemine göre dönüşüm bakımından
    toplam eşdeğer birim sayısı kaçtır?
  secenekler:
    A: 500 birim
    B: 7.000 birim
    C: 7.700 birim
    D: 8.200 birim
    E: 10.000 birim
  dogru: D
  aciklama:
    dogru_neden: Ağırlıklı ortalamada dönem başı yarı mamul ve dönem maliyeti tek havuzda birleştirilir (TMS 2 paragraf 27).
      Eşdeğer birim = tamamlanan + DSYM × derece = 7.000 + 3.000 × %40 = 8.200 birimdir.
    celdiriciler:
      A: DBYM'nin geçen dönemde işlenmiş eşdeğer birimidir (2.000 × %25); ortalama yöntemde bu birimler çıkarılmaz.
      B: Yalnızca tamamlanan birimlerdir; dönem sonu yarı mamulün eşdeğeri eklenmemiştir.
      C: FIFO yöntemine göre eşdeğer birimdir; DBYM'nin geçen dönemdeki eşdeğeri düşülmüştür.
      E: İlk madde eşdeğer birimidir (7.000 + 3.000 × %100); dönüşüm için derece %40'tır.
    hesap_adimlari:
    - DSYM = 2.000 + 8.000 − 7.000 = 3.000 birim
    - Eşdeğer birim = 7.000 + 3.000 × 0,40 = 8.200
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 7000 + 3000 * 0.4
