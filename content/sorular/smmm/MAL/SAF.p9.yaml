- id: SMMM-MAL-SAF-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmede dönem başında 200 birim yarı mamulün birim maliyeti 10 TL, dönem içinde 100 birim yarı mamulün birim
    maliyeti 16 TL'dir. Dönemde 180 birim satılmıştır. Bu soruda FIFO yöntemi, en eski maliyetli birimlerin önce satıldığını;
    ağırlıklı ortalama yöntem ise toplam maliyetin toplam birim sayısına bölünmesiyle bulunan ortalama birim maliyetin satılan
    birimlere uygulanmasını ifade etmektedir. Buna göre FIFO ile ağırlıklı ortalama yöntemine göre hesaplanan satılan mamul
    maliyetleri arasındaki fark kaç TL'dir?
  secenekler:
    A: 240 TL
    B: 300 TL
    C: 360 TL
    D: 420 TL
    E: 480 TL
  dogru: C
  aciklama:
    dogru_neden: 'FIFO''da satılan 180 birimin maliyeti 180 × 10 = 1.800 TL''dir. Ağırlıklı ortalama birim maliyet (200 ×
      10 + 100 × 16) / 300 = 12 TL''dir; satılan mamul maliyeti 180 × 12 = 2.160 TL olur. Aradaki fark 2.160 − 1.800 = 360
      TL''dir. Püf noktaları: Önce toplam stok maliyeti ve birim sayısından ortalama maliyet bulunmalı, sonra iki yöntemin
      satılan birimlere uygulanması karşılaştırılmalıdır.'
    celdiriciler:
      A: 240 TL, ağırlıklı ortalama birim maliyet ile FIFO maliyeti arasındaki farkı tek bir birim üzerinden almaya karşılık
        gelir.
      B: 300 TL, toplam birim sayısını fark tutarıymış gibi kullanmaya dayanan hatalı sonuçtur.
      D: 420 TL, iki yöntemin maliyet farkına stokta kalan birimlerin ayrıca eklenmesiyle oluşan hatalı sonuçtur.
      E: 480 TL, toplam maliyet farkının satılan birim sayısına yanlış biçimde uygulanmasıyla oluşur.
    hesap_adimlari:
    - Toplam stok maliyeti = 200 × 10 + 100 × 16 = 3.600 TL.
    - FIFO satılan mamul maliyeti = 180 × 10 = 1.800 TL.
    - Ağırlıklı ortalama birim maliyet = 3.600 / 300 = 12 TL.
    - Ağırlıklı ortalama satılan mamul maliyeti = 180 × 12 = 2.160 TL.
    - Yöntemler arasındaki fark = 2.160 − 1.800 = 360 TL.
  kaynaklar:
  - mevzuat: MSUGT Sıra No 2 – 1 Sıra No'lu MSUGT'ye ilişkin düzeltmeler
    madde: Gelir Tablosu Dipnotları, 9 numaralı dipnot
    alinti: Maliyet hesaplama sistemleri (safha veya sipariş) ve stok değerleme yöntemleri (ağırlıklı ortalama maliyet, ilk
      giren ilk çıkar, hareketli ortalama maliyet vs.. gibi)
  gecerlilik:
    baslangic: '1993-12-16'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (3600/300)*180 - 180*10
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_MAL.yaml, satır ChatGPT_MAL-2026-10-08v2-G04 #22'
