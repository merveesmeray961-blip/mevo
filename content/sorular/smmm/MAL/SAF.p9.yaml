  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: tamamlanma derecesi geri hesap
  tip: hesaplama
  zorluk: 2
  kok: 'Tek safhalı üretim yapan RM İşletmesi ağırlıklı ortalama yöntemini uygulamaktadır. Dönem başında yarı mamul
    yoktur. Dönem içinde 5.000 birim üretime alınmış, 4.000 birim tamamlanmış ve 1.000 birim yarı mamul kalmıştır.
    Dönem sonu yarı mamullerin tamamlanma derecesi %50’dir. Dönem içinde 270.000 ₺ dönüştürme maliyeti oluşmuştur.
    Dönem sonu yarı mamullere yüklenecek dönüştürme maliyeti kaç TL’dir?

    '
  secenekler:
    A: 30.000 ₺
    B: 45.000 ₺
    C: 54.000 ₺
    D: 60.000 ₺
    E: 90.000 ₺
  dogru: A
  aciklama:
    dogru_neden: 'Eşdeğer birim = tamamlanan 4.000 + (1.000 × %50) = 4.500. Birim dönüştürme maliyeti = 270.000
      / 4.500 = 60 ₺. Dönem sonu yarı mamule = 1.000 × %50 × 60 = 30.000 ₺. Püf noktaları: Ağırlıklı ortalama ve
      tamamlanma derecesi çarpımı ile eşdeğer bulunur.'
    celdiriciler:
      B: Tamamlanma derecesi %75 alınarak bulunur.
      C: Eşdeğer birim 5.000 kabul edilerek bulunur.
      D: Tamamlanma derecesi %100 alınarak bulunur.
      E: Eşdeğer birim 3.000 kabul edilerek bulunur.
    hesap_adimlari:
    - Eşdeğer birim (dönüştürme) = 4.000 + 1.000×0,5 = 4.500
    - Birim maliyet = 270.000 / 4.500 = 60
    - Yarı mamul dönüştürme = 500 × 60 = 30.000
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: Maliyet hesapları
    alinti: Maliyet hesapları, mal ve hizmetlerin planlanan biçim ve niteliğe getirilmesi için yapılan giderlerin
      toplandığı ve maliyet unsurlarına dönüştürülerek izlendiği hesaplardır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1000 * 0.5 * (270000 / (4000 + 1000 * 0.5))
