- id: SMMM-MAL-SAF-0006
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmede dönem başında 200 birim yarı mamulün birim maliyeti 10 ₺, dönem içinde 100 birim yarı mamulün
    birim maliyeti 16 ₺'dır. Dönemde 180 birim satılmıştır. Bu soruda FIFO yöntemi, en eski maliyetli birimlerin
    önce satıldığını; ağırlıklı ortalama yöntem ise toplam maliyetin toplam birim sayısına bölünmesiyle bulunan
    ortalama birim maliyetin satılan birimlere uygulanmasını ifade etmektedir. Buna göre FIFO ile ağırlıklı ortalama
    yöntemine göre hesaplanan satılan mamul maliyetleri arasındaki fark kaç TL'dir?
  secenekler:
    A: 240 ₺
    B: 300 ₺
    C: 360 ₺
    D: 420 ₺
    E: 480 ₺
  dogru: C
  aciklama:
    dogru_neden: 'FIFO''da satılan 180 birimin maliyeti 180 × 10 = 1.800 ₺''dır. Ağırlıklı ortalama birim maliyet
      (200 × 10 + 100 × 16) / 300 = 12 ₺''dır; satılan mamul maliyeti 180 × 12 = 2.160 ₺ olur. Aradaki fark 2.160
      − 1.800 = 360 ₺''dır. Püf noktaları: Önce toplam stok maliyeti ve birim sayısından ortalama maliyet bulunmalı,
      sonra iki yöntemin satılan birimlere uygulanması karşılaştırılmalıdır.'
    celdiriciler:
      A: 240 ₺, ağırlıklı ortalama birim maliyet ile FIFO maliyeti arasındaki farkı tek bir birim üzerinden almaya
        karşılık gelir.
      B: 300 ₺, toplam birim sayısını fark tutarıymış gibi kullanmaya dayanan hatalı sonuçtur.
      D: 420 ₺, iki yöntemin maliyet farkına stokta kalan birimlerin ayrıca eklenmesiyle oluşan hatalı sonuçtur.
      E: 480 ₺, toplam maliyet farkının satılan birim sayısına yanlış biçimde uygulanmasıyla oluşur.
    hesap_adimlari:
    - Toplam stok maliyeti = 200 × 10 + 100 × 16 = 3.600 ₺.
    - FIFO satılan mamul maliyeti = 180 × 10 = 1.800 ₺.
    - Ağırlıklı ortalama birim maliyet = 3.600 / 300 = 12 ₺.
    - Ağırlıklı ortalama satılan mamul maliyeti = 180 × 12 = 2.160 ₺.
    - Yöntemler arasındaki fark = 2.160 − 1.800 = 360 ₺.
  kaynaklar:
  - mevzuat: MSUGT Sıra No 2 – 1 Sıra No'lu MSUGT'ye ilişkin düzeltmeler
    madde: Gelir Tablosu Dipnotları, 9 numaralı dipnot
    alinti: Maliyet hesaplama sistemleri (safha veya sipariş) ve stok değerleme yöntemleri (ağırlıklı ortalama maliyet,
      ilk giren ilk çıkar, hareketli ortalama maliyet vs.. gibi)
  gecerlilik:
    baslangic: '1993-12-16'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (3600/300)*180 - 180*10
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
