  konu: SIP
  kazanim: gider yeri katsayıları
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. Sipariş maliyeti yöntemini uygulayan GN İşletmesi''nde II. dağıtım sonrasında
    Kesim gider yerinde 240.000 ₺, Montaj gider yerinde 180.000 ₺ genel üretim gideri toplanmıştır. Kesim''de 12.000
    makine saati, Montaj''da 6.000 direkt işçilik saati çalışılmış olup GÜG bu ölçülerle siparişlere yüklenmektedir.
    S-14 siparişi için 18.000 ₺ direkt ilk madde ve malzeme, 12.000 ₺ direkt işçilik gideri kullanılmış; sipariş
    Kesim''de 250 makine saati, Montaj''da 150 direkt işçilik saati çalışmıştır. Siparişin teslimi için 2.000 ₺
    pazarlama gideri yapılmış, siparişe 3.000 ₺ genel yönetim gideri payı hesaplanmıştır. İşletme genel yönetim
    giderlerinden mamullere pay vermemektedir.


    Buna göre S-14 siparişinin maliyeti kaç TL''dir?'
  secenekler:
    A: '39.500'
    B: '40.500'
    C: '41.500'
    D: '42.500'
    E: '44.500'
  dogru: A
  aciklama:
    dogru_neden: 'Gider yeri katsayıları: Kesim 240.000 / 12.000 = 20 ₺/makine saati; Montaj 180.000 / 6.000 = 30
      ₺/DİŞ saati. Yüklenen GÜG = 250 × 20 + 150 × 30 = 5.000 + 4.500 = 9.500 ₺. Sipariş maliyeti = 18.000 + 12.000
      + 9.500 = 39.500 ₺. VUK md. 275''e göre genel idare giderinden pay vermek ihtiyaridir ve işletme bu yolu seçmemiştir;
      pazarlama gideri ise TMS 2 par. 16(d) gereği stok maliyetine girmez.'
    celdiriciler:
      B: '40.500: Katsayılar ters uygulanmıştır (Kesim için 30, Montaj için 20 ₺).'
      C: '41.500: Pazarlama gideri (2.000 ₺) sipariş maliyetine eklenmiştir.'
      D: '42.500: İşletme pay vermediği hâlde 3.000 ₺ genel yönetim gideri payı maliyete katılmıştır.'
      E: '44.500: Hem pazarlama gideri hem genel yönetim gideri payı maliyete eklenmiştir.'
    hesap_adimlari:
    - Kesim katsayısı = 240.000 / 12.000 = 20 ₺; Montaj katsayısı = 180.000 / 6.000 = 30 ₺
    - Yüklenen GÜG = 250 × 20 + 150 × 30 = 9.500 ₺
    - Sipariş maliyeti = 18.000 + 12.000 + 9.500 = 39.500 ₺
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 275
    alinti: Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.)
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(d)
    alinti: (d) Satış maliyetleri.
  - mevzuat: Hakemli konu anlatımı — MAL/SIP (Sipariş maliyeti ve GÜG yükleme/dağıtım)
    madde: §5 Gider yeri katsayısı
    alinti: ''
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kesim = 240000 / 12000

      montaj = 180000 / 6000

      sonuc = 18000 + 12000 + 250 * kesim + 150 * montaj'
