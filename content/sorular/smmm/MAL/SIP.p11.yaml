  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: faaliyet tabanlı maliyet
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. FT İşletmesi genel üretim giderlerini faaliyet tabanlı maliyetleme ile siparişlere
    yüklemektedir. Dönemin faaliyet havuzları ve maliyet sürücüleri şöyledir: Makine kurulumu 180.000 ₺ (300 kurulum),
    Malzeme taşıma 72.000 ₺ (1.800 taşıma), Kalite kontrol 48.000 ₺ (400 kontrol). Toplam 300.000 ₺ GÜG daha önce
    fabrika genelinde 12.000 makine saati üzerinden tek oranla yüklenmekteydi. K-7 siparişi 5 kurulum, 30 taşıma,
    10 kontrol ve 160 makine saati kullanmıştır; siparişin direkt ilk madde ve malzeme gideri 14.000 ₺''dır.


    Buna göre faaliyet tabanlı maliyetlemeyle K-7 siparişine yüklenen GÜG kaç TL''dir?'
  secenekler:
    A: '2.400'
    B: '4.000'
    C: '4.200'
    D: '5.000'
    E: '5.400'
  dogru: E
  aciklama:
    dogru_neden: 'Faaliyet oranları: kurulum 180.000 / 300 = 600 ₺, taşıma 72.000 / 1.800 = 40 ₺, kontrol 48.000
      / 400 = 120 ₺. K-7''ye yüklenen GÜG = 5 × 600 + 30 × 40 + 10 × 120 = 3.000 + 1.200 + 1.200 = 5.400 ₺. Direkt
      ilk madde ve malzeme gideri GÜG yüklemesini etkilemez.'
    celdiriciler:
      A: '2.400: Kurulum havuzu hesaba katılmamış, yalnız taşıma ve kontrol payları toplanmıştır.'
      B: '4.000: Geleneksel tek oran uygulanmıştır (300.000 / 12.000 = 25 ₺ × 160 makine saati).'
      C: '4.200: Havuzlardan biri (taşıma veya kontrol) unutulmuştur (3.000 + 1.200).'
      D: '5.000: Toplam GÜG tek bir sürücüye, kurulum sayısına bölünmüştür (300.000 / 300 × 5).'
    hesap_adimlari:
    - Kurulum oranı = 600 ₺; taşıma oranı = 40 ₺; kontrol oranı = 120 ₺
    - K-7 GÜG = 5 × 600 + 30 × 40 + 10 × 120 = 5.400 ₺
