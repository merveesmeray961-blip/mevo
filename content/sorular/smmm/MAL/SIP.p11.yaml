  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. Sipariş maliyeti yöntemini uygulayan PL İşletmesi, GÜG''yi dönem başında belirlediği
    oranla direkt işçilik saati üzerinden siparişlere yüklemektedir. Yükleme oranı, bütçelenen GÜG''nin bütçelenen
    25.000 direkt işçilik saatine bölünmesiyle bulunmuştur. Dönemde 24.000 direkt işçilik saati çalışılmış, fiili
    GÜG 510.000 ₺ olarak gerçekleşmiş ve dönem sonunda 30.000 ₺ eksik yükleme tespit edilmiştir.


    Buna göre dönem başında bütçelenen GÜG kaç TL''dir?'
  secenekler:
    A: '500.000'
    B: '510.000'
    C: '531.250'
    D: '540.000'
    E: '562.500'
  dogru: A
  aciklama:
    dogru_neden: 'Eksik yüklemede fiili GÜG yüklenen tutardan büyüktür: yüklenen GÜG = 510.000 − 30.000 = 480.000
      ₺. Yükleme oranı = 480.000 / 24.000 fiili saat = 20 ₺. Oran bütçelenen GÜG / 25.000 saat olduğundan bütçelenen
      GÜG = 20 × 25.000 = 500.000 ₺''dir. Püf noktaları: Siparişlere oran, fiili saat üzerinden uygulanır; oranı
      bulmak için yüklenen tutarı fiili saate, bütçeyi bulmak için oranı bütçelenen saate taşı. ''Eksik'' sözcüğü
      yüklenen tutarı niteler; farkı fiili tutardan düşmen gerekir, eklemen değil.'
    celdiriciler:
      B: '510.000: Fiili GÜG bütçelenen GÜG ile aynı sanılmıştır.'
      C: '531.250: Oran fiili GÜG''nin fiili saate bölünmesiyle bulunmuştur (510.000 / 24.000 = 21,25 × 25.000).'
      D: '540.000: Eksik yükleme fiili GÜG''ye eklenerek bütçe tutarı sanılmıştır.'
      E: '562.500: Fark fazla yükleme gibi yorumlanmış, yüklenen GÜG 540.000 alınmıştır (540.000 / 24.000 = 22,5
        × 25.000).'
    hesap_adimlari:
    - Yüklenen GÜG = 510.000 − 30.000 = 480.000 ₺
    - Yükleme oranı = 480.000 / 24.000 = 20 ₺/saat
    - Bütçelenen GÜG = 20 × 25.000 = 500.000 ₺
  kaynaklar:
