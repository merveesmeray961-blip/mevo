- id: SMMM-MAL-SIP-0011
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: fazla/eksik yükleme
  tip: hesaplama
  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. 7/A seçeneğini ve önceden belirlenmiş GÜG yükleme oranını kullanan BF İşletmesi''nde
    dönem sonunda 732 Genel Üretim Giderleri Bütçe Farkları hesabında 36.000 ₺ eksik yükleme farkı bulunmaktadır.
    İşletme bu farkı, dönem içinde yüklenen GÜG tutarları oranında ilgili stok ve satış maliyeti hesaplarına aktarmaktadır.
    Dönemde yüklenen GÜG''nin 40.000 ₺''si 151 Yarı Mamuller - Üretim, 60.000 ₺''si 152 Mamuller, 200.000 ₺''si
    620 Satılan Mamuller Maliyeti hesabında yer alan mamullere aittir. Bu hesapların dönem sonu bakiyeleri sırasıyla
    200.000 ₺, 300.000 ₺ ve 700.000 ₺''dir.


    Buna göre 732 hesabının kapatılması kaydında 620 Satılan Mamuller Maliyeti hesabına yapılacak kayıt aşağıdakilerden
    hangisidir?'
  secenekler:
    A: 21.000 ₺ borç
    B: 24.000 ₺ borç
    C: 24.000 ₺ alacak
    D: 36.000 ₺ borç
    E: 36.000 ₺ alacak
  dogru: B
  aciklama:
    dogru_neden: Eksik yükleme olumsuz farktır ve 732'nin borcunda birikir; kapatılırken 732 alacaklandırılır, fark
      maliyetleri artıracak biçimde ilgili hesapların borcuna aktarılır. 620'nin payı 36.000 × 200.000 / 300.000
      = 24.000 ₺'dir; 620 hesabına 24.000 ₺ borç yazılır (151'e 4.800, 152'ye 7.200 ₺ borç).
    celdiriciler:
      A: '21.000 ₺ borç: Dağıtım hesap bakiyelerine göre yapılmıştır (36.000 × 700/1.200); işletme yüklenen GÜG
        oranını esas almaktadır.'
      C: '24.000 ₺ alacak: Tutar doğru, yön yanlıştır; alacak kaydı fazla yükleme (olumlu fark) durumunda maliyetleri
        azaltmak için yapılır.'
      D: '36.000 ₺ borç: Farkın tamamı satılan mamuller maliyetine verilmiştir; işletme farkı stok hesaplarına da
        dağıtmaktadır.'
      E: '36.000 ₺ alacak: Hem farkın tamamı 620''ye verilmiş hem de yön ters kurulmuştur.'
    hesap_adimlari:
    - Toplam yüklenen GÜG = 40.000 + 60.000 + 200.000 = 300.000 ₺
    - 620 payı = 36.000 × 200.000 / 300.000 = 24.000 ₺
    - 'Eksik yükleme maliyeti artırır: 620 borç 24.000 ₺'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 732 Genel Üretim Giderleri Bütçe Farkları
    alinti: Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 732 Genel Üretim Giderleri Bütçe Farkları
    alinti: bu hesap ilgili stok ve satış maliyeti hesaplarına aktarılarak kapatılır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 36000 * 200000 / (40000 + 60000 + 200000)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
