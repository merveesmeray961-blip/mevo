- id: SMMM-MAL-SIP-0012
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: I. ve II. dağıtım (matematiksel; kademeli)
  tip: hesaplama
  zorluk: 3
  kok: 'KDV dikkate alınmayacaktır. MT İşletmesi''nde I. dağıtım sonrasında yardımcı gider yerlerinde Bakım (Y1)
    44.000 ₺, Enerji (Y2) 20.000 ₺ gider toplanmıştır. Hizmet oranları şöyledir: Bakım; Enerji''ye %20, Kesim (E1)
    esas gider yerine %40, Montaj (E2) esas gider yerine %40 hizmet vermektedir. Enerji; Bakım''a %20, Kesim''e
    %50, Montaj''a %30 hizmet vermektedir. İşletme II. dağıtımda matematiksel (karşılıklı) dağıtım yöntemini uygulamaktadır.


    Buna göre II. dağıtımla Montaj gider yerine aktarılan toplam tutar kaç TL''dir?'
  secenekler:
    A: '23.600'
    B: '28.400'
    C: '29.000'
    D: '29.500'
    E: '30.000'
  dogru: C
  aciklama:
    dogru_neden: 'Denklemler: Y1 = 44.000 + 0,20 Y2 ve Y2 = 20.000 + 0,20 Y1. Yerine koyarsak Y1 = 44.000 + 4.000
      + 0,04 Y1 → 0,96 Y1 = 48.000 → Y1 = 50.000; Y2 = 20.000 + 10.000 = 30.000. Montaj''a aktarılan = 50.000 ×
      %40 + 30.000 × %30 = 20.000 + 9.000 = 29.000 ₺. Püf noktaları: Yüzdeler I. dağıtım tutarlarına değil, karşılıklı
      hizmet dahil bulunan Y1 ve Y2 toplamlarına uygulanır. Seçeneklerdeki yakın sayılar diğer yöntemlerin sonuçlarıdır;
      kontrol için esas yerlere geçen toplamın 64.000 ₺ (Kesim 35.000 + Montaj 29.000) olduğunu doğrula.'
    celdiriciler:
      A: '23.600: Yardımcı yerlerin karşılıklı hizmeti yok sayılmış, oranlar yeniden ölçeklenmeden I. dağıtım tutarlarına
        uygulanmıştır (44.000 × %40 + 20.000 × %30); 16.000 ₺ dağıtılmadan kalır.'
      B: '28.400: Kademeli yöntem, önce Bakım dağıtılarak uygulanmıştır (17.600 + 28.800 × 3/8).'
      D: '29.500: Doğrudan dağıtım yöntemi uygulanmıştır (44.000 × 40/80 + 20.000 × 30/80).'
      E: '30.000: Kademeli yöntem, önce Enerji dağıtılarak uygulanmıştır (6.000 + 48.000 × 40/80).'
    hesap_adimlari:
    - Y1 = 44.000 + 0,20 Y2; Y2 = 20.000 + 0,20 Y1
    - 0,96 Y1 = 48.000 → Y1 = 50.000; Y2 = 30.000
    - Montaj = 50.000 × 0,40 + 30.000 × 0,30 = 29.000 ₺
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — MAL/SIP (Sipariş maliyeti ve GÜG yükleme/dağıtım)
    madde: '§4 Gider dağıtımı: I., II. ve III. dağıtım'
    alinti: ''
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 10-99 Gider Yerleri
    alinti: Gider yerlerinin saptanmasında genellikle kuruluşların organizasyon şeması esas alınır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'y1 = (44000 + 0.2 * 20000) / (1 - 0.2 * 0.2)

      y2 = 20000 + 0.2 * y1

      sonuc = 0.4 * y1 + 0.3 * y2'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_M2b.yaml, satır 7
- id: SMMM-MAL-SIP-0013
  sinav: smmm
  bolum:
  - YET
  - SGS
