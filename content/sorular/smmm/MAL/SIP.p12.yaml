  zorluk: 2
  kok: 'KDV dikkate alınmayacaktır. PK İşletmesinde GÜG, Kesim gider yerinde makine saatine, Montaj gider yerinde direkt işçilik
    saatine göre yüklenmektedir. Dönem başında Kesim için 360.000 ₺ GÜG ve 24.000 makine saati, Montaj için 288.000 ₺ GÜG
    ve 16.000 direkt işçilik saati tahmin edilmiştir. 214 sayılı siparişe ilişkin gerçekleşmeler: direkt ilk madde 52.000
    ₺, direkt işçilik 30.000 ₺, Kesim''de 120 makine saati, Montaj''da 200 direkt işçilik saati; sipariş 100 adetlik üretimdir.
    Siparişin birim maliyeti kaç ₺''dir?'
  secenekler:
    A: 820 ₺
    B: 868 ₺
    C: 871,84 ₺
    D: 874 ₺
    E: 877,60 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Kesim oranı 360.000 / 24.000 = 15 ₺/makine saati, Montaj oranı 288.000 / 16.000 = 18 ₺/saat. Siparişe yüklenen
      GÜG 120 × 15 + 200 × 18 = 5.400 ₺. Toplam maliyet 52.000 + 30.000 + 5.400 = 87.400 ₺; birim maliyet 87.400 / 100 = 874
      ₺. Püf noktaları: Her gider yeri kendi tabanıyla ve kendi oranıyla yükler; ortak bir oran kullanılmaz. Son adım toplamı
      adet sayısına bölmektir.'
    celdiriciler:
      A: GÜG siparişe hiç yüklenmemiştir.
      B: Tüm saatlere Kesim'in makine saati oranı (15 ₺) uygulanmıştır; Montaj kendi oranıyla yüklenmelidir.
      C: İki gider yerinin tahminleri birleştirilip tek oran (16,20 ₺) kullanılmıştır; soruda gider yerlerine göre ayrı oranlar
        belirtilmiştir.
      E: Tüm saatlere Montaj'ın oranı (18 ₺) uygulanmıştır; Kesim kendi oranıyla yüklenmelidir.
    hesap_adimlari:
    - Kesim oranı = 15; Montaj oranı = 18
    - GÜG = 5.400
    - Birim maliyet = 87.400 / 100 = 874
  kaynaklar:
