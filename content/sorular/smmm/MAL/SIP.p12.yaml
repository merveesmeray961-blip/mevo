  kok: KDV dikkate alınmayacaktır. MH İşletmesinde I. dağıtım sonrası Bakım 40.000 ₺, Enerji 20.000 ₺ (yardımcı yerler); Kesim
    100.000 ₺, Montaj 70.000 ₺ (esas yerler) gider toplamına sahiptir. Bakım hizmetlerinin %20'ini Enerji'ye, %40'ini Kesim'e,
    %40'ini Montaj'a; Enerji hizmetlerinin %20'ini Bakım'a, %30'ini Kesim'e, %50'ini Montaj'a vermektedir. II. dağıtım kademeli
    yöntemle ve önce Enerji gider yeri dağıtılarak yapılacaktır. II. dağıtım sonrası Montaj gider yerinin toplam gideri kaç
    ₺ olur?
  secenekler:
    A: 100.000 ₺
    B: 102.000 ₺
    C: 102.500 ₺
    D: 103.500 ₺
    E: 130.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Önce Enerji dağıtılır: Bakım''a 4.000, Kesim''e 6.000, Montaj''a 10.000 ₺. Bakım''ın toplamı 40.000 + 4.000
      = 44.000 ₺ olur ve yalnızca esas yerlere (Kesim %50, Montaj %50) dağıtılır (Enerji''ye geri hizmet verilmez, çünkü Enerji
      kapanmıştır). Montaj = 70.000 + 10.000 + 22.000 = 102.000 ₺''dir. Püf noktaları: Kademeli yöntemde kapatılan yer, sonradan
      dağıtılan yerden pay alamaz; ilk dağıtılan yer ise diğer yardımcı yere de pay verir. Dağıtım sırası sonucu değiştirir.'
    celdiriciler:
      A: Enerji'nin Bakım'a verdiği hizmet payı (4.000 ₺) Bakım'ın toplamına eklenmeden dağıtım yapılmıştır.
      C: Doğrudan dağıtım sonucudur; yardımcı yerler arasındaki hizmetler hiç dikkate alınmamıştır.
      D: Dağıtım sırası ters alınmıştır (önce Bakım); soruda önce Enerji dağıtılacaktır, sıra değişince sonuç değişir.
      E: Yardımcı yerlerin giderlerinin tamamı Montaj'a aktarılmıştır.
    hesap_adimlari:
    - 'Enerji dağıtımı: Bakım 4.000, Kesim 6.000, Montaj 10.000'
    - Bakım toplamı = 44.000; Montaj payı = 22.000
    - Montaj = 102.000
  kaynaklar:
