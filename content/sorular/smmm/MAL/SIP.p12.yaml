- id: SMMM-MAL-SIP-0057
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: sipariş maliyetine kâr marjı eklenerek satış fiyatının bulunması
  tip: hesaplama
  zorluk: 2
  kok: KDV dikkate alınmayacaktır. OS İşletmesi sipariş maliyet sistemi uygulamaktadır ve GÜG'yi direkt işçilik saatine göre
    saat başına 28 ₺ ile yüklemektedir. 40 adetlik 305 sayılı siparişe 36.000 ₺ direkt ilk madde harcanmış, 450 direkt işçilik
    saati çalışılmıştır (saat ücreti 40 ₺). İşletme, satış fiyatını belirlerken satış fiyatının %20'si kadar kâr marjı hedeflemektedir.
    Siparişin toplam satış fiyatı kaç ₺ olmalıdır?
  secenekler:
    A: 16.650 ₺
    B: 66.600 ₺
    C: 67.500 ₺
    D: 79.920 ₺
    E: 83.250 ₺
  dogru: E
  aciklama:
    dogru_neden: 'Direkt işçilik 450 × 40 = 18.000 ₺; yüklenen GÜG 450 × 28 = 12.600 ₺; sipariş maliyeti 36.000 + 18.000 +
      12.600 = 66.600 ₺. Kâr marjı satış fiyatının %20''si olduğundan maliyet satış fiyatının %80''ine eşittir: fiyat = 66.600
      / 0,80 = 83.250 ₺. Püf noktaları: Marj satış fiyatına göre verilmişse maliyet fiyatın (1 − marj)''ıdır, bu yüzden bölme
      yapılır; maliyete yüzde eklemek farklı (daha düşük) fiyat verir.'
    celdiriciler:
      A: Hedeflenen kâr tutarıdır; satış fiyatı değildir.
