- id: SMMM-MAL-SIP-0052
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: I. dağıtım sonrası doğrudan dağıtım yöntemiyle II. dağıtım
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. TY İşletmesinde I. dağıtım sonrası yardımcı gider yerlerinden Bakım (Y1) 30.000 ₺, Enerji
    (Y2) 18.000 ₺; esas üretim gider yerlerinden Kesim 100.000 ₺, Montaj 90.000 ₺ gider toplamına sahiptir. Bakım hizmetlerinin
    %20'ini Enerji'ye, %30'ini Kesim'e, %50'ini Montaj'a; Enerji hizmetlerinin %10'unu Bakım'a, %45'ini Kesim'e, %45'ini Montaj'a
    vermektedir. II. dağıtım doğrudan dağıtım yöntemiyle yapılacaktır. II. dağıtım sonrası Montaj gider yerinin toplam gideri
    kaç ₺ olur?
  secenekler:
    A: 114.000 ₺
    B: 117.000 ₺
    C: 117.750 ₺
    D: 120.250 ₺
    E: 138.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Doğrudan dağıtımda yardımcı yerler arasındaki hizmetler dikkate alınmaz; yalnızca esas yerlere verilen paylar
      100''e tamamlanır. Bakım: Montaj payı %62,50, Enerji: Montaj payı %50. Montaj = 90.000 + 30.000 × 0,625 + 18.000 × 0,50
      = 117.750 ₺''dir. Püf noktaları: Doğrudan dağıtımda yardımcı yerlere verilen hizmetler yok sayılır ve esas yerlere düşen
      oranlar toplamı 100 olacak biçimde yeniden hesaplanır.'
    celdiriciler:
      A: Yardımcı yerlerin giderleri iki esas yer arasında eşit paylaştırılmıştır; hizmet oranları dikkate alınmamıştır.
      B: Kademeli dağıtım sonucudur (Bakım önce); doğrudan dağıtımda yardımcı yerler arası hizmetler dikkate alınmaz.
      D: Kesim gider yerinin doğrudan dağıtım sonrası toplam giderleridir; Montaj'ın gideri değildir.
      E: Yardımcı yerlerin giderlerinin tamamı Montaj'a aktarılmıştır.
    hesap_adimlari:
    - Bakım'dan Montaj payı = 30.000 × 0,50/0,80 = 18.750
    - Enerji'den Montaj payı = 18.000 × 0,45/0,90 = 9.000
    - Montaj = 90.000 + 18.750 + 9.000 = 117.750
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: GÜG dağıtımı — doğrudan yöntem
    alinti: ''
  gecerlilik: &id001
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 90000 + 30000 * 0.5 / (0.3 + 0.5) + 18000 * 0.45 / (0.45 + 0.45)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) duzelt: Anahtar (C, 117.750) doğru; açıklamada hesap satırında 0,62 yazılmış, doğrusu 0,625
          (30.000 x 0,62 = 18.600 olurdu, sonuç tutmuyor).'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_A/MAL_SIP_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) duzelt: Anahtar (C, 117.750) doğru; açıklamada hesap satırında 0,62 yazılmış, doğrusu 0,625
      (30.000 x 0,62 = 18.600 olurdu, sonuç tutmuyor).'
