- id: SMMM-MAL-SIP-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: SIP
  kazanim: önceden belirlenmiş GÜG yükleme oranı ile eksik yükleme tutarının hesaplanması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Sipariş maliyeti yöntemini uygulayan JL İşletmesi, genel üretim giderlerini direkt işçilik saati esasına göre önceden
    belirlenmiş oranla siparişlere yüklemektedir. Dönem başında bütçelenen genel üretim gideri 1.200.000 TL, bütçelenen direkt
    işçilik saati 100.000 saattir. Dönem içinde 101 nolu siparişe 50.000, 102 nolu siparişe 40.000 direkt işçilik saati harcanmıştır.
    Dönemin fiili genel üretim giderleri 1.125.000 TL olmuştur. KDV dikkate alınmayacaktır.


    Dönem sonunda siparişlere yüklenen genel üretim gideri fiili genel üretim giderinden az kaldığına göre, eksik yükleme
    tutarı kaç TL''dir?'
  secenekler:
    A: '45.000'
    B: '75.000'
    C: '112.500'
    D: '120.000'
    E: '525.000'
  dogru: A
  aciklama:
    dogru_neden: 'Önceden belirlenmiş yükleme oranı = bütçelenen GÜG ÷ bütçelenen direkt işçilik saati = 1.200.000 ÷ 100.000
      = 12 TL/saat. Siparişlere yüklenen GÜG, fiili saatler üzerinden hesaplanır: (50.000 + 40.000) × 12 = 1.080.000 TL. Fiili
      GÜG 1.125.000 TL olduğundan eksik yükleme 1.125.000 − 1.080.000 = 45.000 TL''dir. Önceden saptanmış giderler ile fiili
      giderler arasındaki fark MSUGT''ye göre genel üretim giderleri fark hesaplarında (732 vb.) izlenir.'
    celdiriciler:
      B: '75.000: fiili GÜG ile bütçelenen GÜG karşılaştırılmıştır (1.200.000 − 1.125.000); yükleme farkı fiili saatle yüklenen
        tutar üzerinden bulunur.'
      C: '112.500: oran, fiili GÜG''ün bütçelenen saate bölünmesiyle (11,25 TL) bulunmuş ve yükleme bu oranla yapılmıştır;
        oysa oran bütçelenen GÜG''den hesaplanır.'
      D: '120.000: bütçelenen ile fiili saat farkı (10.000 saat) yükleme oranıyla çarpılmıştır (kullanılmayan kapasite); eksik
        yükleme bu değildir.'
      E: '525.000: yükleme yalnızca 101 nolu siparişin saatleriyle (50.000 × 12 = 600.000) yapılmış, 102 nolu sipariş unutulmuştur.'
    hesap_adimlari:
    - 'Yükleme oranı: 1.200.000 ÷ 100.000 = 12 TL/saat'
    - 'Yüklenen GÜG: (50.000 + 40.000) × 12 = 1.080.000 TL'
    - 'Eksik yükleme: 1.125.000 − 1.080.000 = 45.000 TL'
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 731. Genel Üretim Giderleri Yansıtma Hesabı
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden saptanmış genel üretim giderleri,
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 732. Genel Üretim Giderleri Bütçe Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz
      bütçe farklarının izlendiği hesaptır.
  dogrulama:
    python: 'oran = 1200000 / 100000

      yuklenen = (50000 + 40000) * oran

      sonuc = 1125000 - yuklenen

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
