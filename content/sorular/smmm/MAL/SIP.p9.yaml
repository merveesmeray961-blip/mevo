- id: SMMM-MAL-SIP-0008
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: fazla/eksik yükleme
  tip: hesaplama
  zorluk: 3
  kok: 'Sipariş maliyet sistemini uygulayan TY İşletmesi, genel üretim giderlerini makine saati üzerinden yüklemektedir. Yıl
    başında tahmini GÜG 360.000 TL, tahmini makine saati 12.000 saat olarak belirlenmiştir. Yıl içinde fiili GÜG 385.000 TL,
    fiili makine saati 11.500 saat gerçekleşmiştir. Fazla veya eksik yükleme tutarı kaç TL’dir ve ne yöndedir?

    '
  secenekler:
    A: 20.000 TL fazla yükleme
    B: 20.000 TL eksik yükleme
    C: 40.000 TL fazla yükleme
    D: 40.000 TL eksik yükleme
    E: 25.000 TL eksik yükleme
  dogru: D
  aciklama:
    dogru_neden: 'Yükleme oranı = 360.000 / 12.000 = 30 TL/saat. Yüklenen GÜG = 11.500 × 30 = 345.000 TL. Fiili 385.000 −
      345.000 = 40.000 TL eksik yükleme. Püf noktaları: Fiili > yüklenen ise eksik yüklemedir.'
    celdiriciler:
      A: Farkı ters yönde ve yanlış tutarla alır.
      B: Tutar yanlış, yön doğru.
      C: Yön ters, tutar doğru.
      E: Yükleme oranını 35 alarak yanlış hesaplar.
    hesap_adimlari:
    - Yükleme oranı = 360000 / 12000 = 30
    - Yüklenen = 11500 * 30 = 345000
    - Fark = 385000 - 345000 = 40000 eksik
  kaynaklar:
  - mevzuat: MSUGT 2-15
    madde: Maliyet hesaplama sistemleri
    alinti: '"Maliyet hesaplama sistemleri (safha veya sipariş) ve stok değerleme yöntemleri (ağırlıklı ortalama maliyet,
      ilk giren ilk çıkar, hareketli ortalama maliyet vs.. gibi)"'
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: oran = 360000 / 12000; yuklenen = 11500 * oran; sonuc = 385000 - yuklenen
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
