  unite: Sipariş maliyeti ve GÜG yükleme/dağıtım
  konu: SIP
  kazanim: gider yeri katsayıları
  tip: uygulama
  zorluk: 2
  kok: Bir fabrikada bakım atölyesi üretim makinelerine, yemekhane ise çalışanlara hizmet vermektedir. Maliyet muhasebesi
    sorumlusu bu birimleri gider yeri planına alırken aşağıdaki yaklaşımlardan hangisini esas almalıdır?
  secenekler:
    A: Yalnız satış yapılan yerleri gider yeri saymalıdır.
    B: Gider yerlerini yalnız bina katlarına göre belirlemelidir.
    C: Organizasyon yapısını esas almalı, faaliyet ve teknolojik akışa uygun alt gider yerleri açabilmelidir.
    D: Yalnız esas üretim gider yerleri tanımlanmalıdır.
    E: Yardımcı hizmet birimleri gider yeri planına alınmamalıdır.
  dogru: C
  aciklama:
    dogru_neden: Gider yerlerinin belirlenmesinde genellikle organizasyon şeması esas alınır; faaliyet alanı ve teknolojik
      akışa uygun gider yerleri ana gruplar altında açılabilir.
    celdiriciler:
      A: Gider yerleri yalnız satış noktalarıyla sınırlı değildir.
      B: Kaynak bina katlarını ölçüt olarak koymaz.
      D: Gider yeri türleri esas üretimle sınırlı değildir.
      E: Yardımcı hizmet gider yerleri de listelenmiştir.
