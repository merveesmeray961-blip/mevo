  tip: bilgi
  zorluk: 2
  kok: 'Sipariş maliyet sistemini uygulayan bir işletmede genel üretim giderlerinin yüklenmesiyle ilgili aşağıdaki ifadelerden
    hangisi **yanlıştır**?

    '
  secenekler:
    A: Yükleme oranı, tahmini GÜG’nin tahmini faaliyet hacmine bölünmesiyle bulunur.
    B: Fiili GÜG ile yüklenen GÜG arasındaki fark fazla veya eksik yükleme olarak adlandırılır.
    C: Yükleme oranı dönem başında belirlenir ve dönem boyunca değişmez.
    D: Direkt işçilik saati, makine saati veya direkt işçilik maliyeti yükleme anahtarı olarak kullanılabilir.
    E: Fiili GÜG tutarı, yükleme oranı ile fiili faaliyet hacminin çarpımıdır.
  dogru: E
  aciklama:
