  - tarih: '2026-10-03'
    kim: duzeltici
    ne: 'Kök tek cevaplı yapıldı: soru ''önceden belirlenmiş oranla hesaplanan (normal) üretim maliyeti''ni soruyor;
      yükleme oranı formülü köke yazıldı; fiili GÜG verisi çeldirici amaçlı tutuldu ve farkın 732 hesabında izlenip
      S-12''ye dağıtılmadığı kökte belirtildi. dogru_neden''deki fark cümlesi THP 731/732 ile uyumlu yeniden yazıldı;
      C açıklaması güncellendi; alıntısız ''genel kabul görmüş'' kaynak yerine THP 731 ve 732 alıntıları eklendi;
      dogrulama.python''a C çeldiricisi hesabı eklendi.'
    neden: 'G5/G6 kaldı: kök yıl sonu fiili GÜG''yi verip ''üretim maliyeti''ni sorduğundan, THP 732''ye göre fark
      dönem sonunda stok/satış maliyetine dağıtılabildiği için C (115.200) de savunulabiliyordu; açıklamadaki ''fark
      siparişe değil...'' cümlesi THP 732 ile çelişiyordu.'
