- id: SMMM-MAL-SIP-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: SIP
  kazanim: Önceden belirlenmiş GÜG yükleme oranıyla sipariş maliyeti
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Sipariş maliyeti yöntemini uygulayan K İşletmesi, genel üretim giderlerini siparişlere direkt işçilik saatine
    dayalı önceden belirlenmiş yükleme oranıyla (tahmini genel üretim giderleri / tahmini direkt işçilik saati)
    yüklemektedir. Yıl başında tahmini genel üretim giderleri 600.000 ₺, tahmini direkt işçilik saati 40.000 saat
    olarak belirlenmiştir. Yıl sonunda fiili genel üretim giderleri 640.000 ₺, fiili direkt işçilik saati 40.000
    saat olmuştur; fiili ve yüklenen genel üretim giderleri arasındaki fark 732 Genel Üretim Giderleri Bütçe Farkları
    hesabında izlenmekte ve S-12 numaralı siparişe dağıtılmamaktadır. S-12 numaralı sipariş için 48.000 ₺ direkt
    ilk madde ve malzeme kullanılmış, saat ücreti 40 ₺ olan 1.200 saat direkt işçilik harcanmış ve siparişin satışı
    için 6.000 ₺ satış komisyonu ödenmiştir. KDV dikkate alınmayacaktır. Buna göre S-12 numaralı siparişin önceden
    belirlenmiş oranla hesaplanan (normal) üretim maliyeti kaç ₺'dir?
  secenekler:
    A: '121.200'
    B: '120.000'
    C: '115.200'
    D: '114.000'
    E: '96.000'
  dogru: D
  aciklama:
    dogru_neden: Önceden belirlenmiş yükleme oranı 600.000 / 40.000 = 15 ₺/saattir. Siparişe yüklenen genel üretim
      gideri 1.200 × 15 = 18.000 ₺'dir. Sipariş normal üretim maliyeti 48.000 + (1.200 × 40 = 48.000) + 18.000 =
      114.000 ₺'dir. MSUGT THP 731 açıklamasına göre önceden saptanmış maliyet yöntemlerinde maliyetlere önceden
      saptanmış genel üretim giderleri yüklenir. Fiili genel üretim giderleri (640.000 ₺) ile yüklenen tutar (40.000
      × 15 = 600.000 ₺) arasındaki 40.000 ₺ olumsuz fark, THP 732 açıklaması uyarınca 732 Genel Üretim Giderleri
      Bütçe Farkları hesabının borcuna kaydedilir ve dönem sonlarında ilgili stok ve satış maliyeti hesaplarına
      aktarılarak kapatılır. Bu dönem sonu düzeltmesi normal maliyetin parçası değildir; kök ayrıca farkın S-12
      siparişine dağıtılmadığını belirtmektedir. Satış komisyonu bir satış maliyetidir; TMS 2 par. 16(d) uyarınca
      stok (üretim) maliyetine girmez.
    hesap_adimlari:
    - 'GÜG yükleme oranı: 600.000 / 40.000 = 15 ₺/saat'
    - 'Direkt işçilik: 1.200 × 40 = 48.000 ₺'
    - 'Yüklenen GÜG: 1.200 × 15 = 18.000 ₺'
    - 'Sipariş normal üretim maliyeti: 48.000 + 48.000 + 18.000 = 114.000 ₺'
    celdiriciler:
      A: 121.200 ₺, fiili oranın (640.000 / 40.000 = 16 ₺) kullanılması ve satış komisyonunun maliyete katılmasıyla
        bulunur; iki hata birlikte yapılmıştır.
      B: 120.000 ₺, satış komisyonunun (6.000) sipariş üretim maliyetine eklenmesiyle bulunur; satış maliyetleri
        üretim maliyetine girmez (TMS 2 par. 16(d)).
      C: 115.200 ₺, önceden belirlenmiş oran yerine fiili oranla (1.200 × 16 = 19.200) genel üretim gideri yüklenmesiyle
        bulunur. Kök, önceden belirlenmiş oranla hesaplanan (normal) maliyeti sormakta ve fiili ile yüklenen tutar
        arasındaki farkın 732 hesabında izlenip S-12'ye dağıtılmadığını belirtmektedir.
      E: 96.000 ₺ yalnızca asal maliyettir (48.000 + 48.000); siparişe genel üretim gideri yüklenmemiştir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(d)
    alinti: (d) Satış maliyetleri.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 731 Genel Üretim Giderleri Yansıtma Hesabı
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden saptanmış genel üretim giderleri,
      Fiili maliyet yönteminin uygulandığı durumlarda, "730- Genel üretim Giderleri Hesabı"nın borcuna kaydedilen
      giderleri, bu hesabın alacağı karşılığı "151- Yarı Mamüller Üretim Hesabı" ile diğer aktif, gider ve zarar
      hesaplarına borç kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 732 Genel Üretim Giderleri Bütçe Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya
      da olumsuz bütçe farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına
      kaydedilir. Dönem sonlarında bu hesap ilgili stok ve satış maliyeti hesaplarına aktarılarak kapatılır.
  dogrulama:
    python: 'oran = 600000 / 40000

      celdirici_c = 48000 + 1200 * 40 + 1200 * (640000 / 40000)

      sonuc = 48000 + 1200 * 40 + 1200 * oran

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 3
