  kok: Standart maliyet sistemi uygulayan bir işletmede sabit GÜG standart oranı normal kapasiteye göre belirlenmiştir. Dönemde
    fiili üretim normal kapasitenin altında kalmıştır. Bu durumda ortaya çıkan kapasite (hacim) farkına ilişkin aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Ürünlere yüklenen sabit GÜG bütçelenenden fazla olduğundan olumlu kapasite farkı doğar ve 734 hesabının alacağına kaydedilir;
      üretim düşüklüğü bu sonucu etkilemez.
    B: Fiili sabit GÜG bütçelenenden yüksek olduğunda ortaya çıkar ve 732 hesabında izlenir.
    C: Değişken GÜG'nin saat verimliliğinden kaynaklanır ve 733 hesabında izlenir.
    D: Yüklenen sabit GÜG bütçelenenden az kalır; olumsuz kapasite farkı doğar ve 734 hesabının borcuna kaydedilir.
    E: Düşük üretim nedeniyle birim başına sabit GÜG yükleme oranı artırılarak sapma önlenir.
  dogru: D
  aciklama:
    dogru_neden: 'Sabit GÜG normal kapasiteye göre yüklendiğinden üretim normalin altında kaldığında yüklenen tutar bütçelenen
      tutardan az olur. Fark olumsuz kapasite farkıdır ve Tekdüzen Hesap Planı''na göre 734 Genel Üretim Giderleri Kapasite
      Farkları hesabının borcuna kaydedilir. Püf noktaları: Kapasite farkı yüklenen ve bütçelenen sabit GÜG arasındadır; bütçe
      farkı ise fiili ve bütçelenen sabit GÜG arasındadır. Normalin altında üretim her zaman olumsuz kapasite farkı demektir.'
    celdiriciler:
      A: Üretim normal kapasitenin altında kaldığı için yüklenen sabit GÜG azalır; fark olumsuzdur ve borç kaydedilir.
      B: Fiili ve bütçelenen sabit gider arasındaki fark bütçe (harcama) farkıdır; kapasite farkı yüklenen ve bütçelenen tutarlar
        arasında doğar ve 734'te izlenir.
      C: 733 verimlilik farklarının izlendiği hesaptır; sabit GÜG'nin normal kapasite kullanımıyla ilgili değildir.
      E: TMS 2'ye göre düşük üretim düzeyi veya atıl kapasite nedeniyle birim başına sabit GÜG artırılmaz; dağıtılmayan kısım
        dönem gideridir/sapma olarak kalır.
