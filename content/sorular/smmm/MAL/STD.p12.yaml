      B: Yalnızca fiili ve standart saat farkının oranla çarpımıdır (verimlilik farkı); bütçe farkı eklenmemiştir.
      D: Tutar doğrudur ancak yön ters alınmıştır; fiili GÜG izin verilen esnek bütçenin üstünde olduğundan fark olumsuzdur.
      E: Fiili GÜG yalnızca sabit bütçeyle karşılaştırılmıştır; değişken kısmı esnek bütçeye dahil edilmemiştir.
