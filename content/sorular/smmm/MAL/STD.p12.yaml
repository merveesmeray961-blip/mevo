    Bir mamul için standart makine süresi 2 saattir. Dönemde 3.000 birim mamul üretilmiş, fiilen 6.400 makine saati kullanılmış
    ve fiili GÜG 190.000 ₺ olmuştur. KDV dikkate alınmayacaktır. Fiili GÜG ile fiili üretim için izin verilen standart saatlere
    göre esnek bütçe karşılaştırılırsa fark kaç ₺'dir ve hangi yöndedir?
