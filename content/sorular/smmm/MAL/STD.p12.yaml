    kullanmaktadır. Bir mamul için standart süre 3 saattir. Dönemde 2.000 birim mamul üretilmiş, fiilen 6.300 işçilik saati
    kullanılmış ve fiili değişken GÜG 60.300 ₺ olmuştur. KDV dikkate alınmayacaktır. Buna göre değişken GÜG harcama (bütçe)
    sapması kaç ₺'dir ve hangi yöndedir?
  secenekler:
    A: 3.600 ₺ olumsuz
    B: 3.600 ₺ olumlu
    C: 6.300 ₺ olumsuz
    D: 54.000 ₺ olumsuz
    E: 56.700 ₺ olumsuz
  dogru: A
  aciklama:
    dogru_neden: 'Fiili üretim için izin verilen standart süre 2.000 × 3 = 6.000 saattir. Değişken güg harcama (bütçe) sapması
      60.300 − 9 × 6.300 = 3.600 ₺ olup pozitif çıktığından olumsuzdur; mutlak değeri 3.600 ₺''dir. Püf noktaları: Harcama
      sapması fiili saat bazlı esnek bütçeyle, verimlilik sapması ise fiili ile standart saat farkı × standart oranla bulunur;
      ikisinin toplamı toplam sapmayı verir.'
    celdiriciler:
      B: Tutar doğrudur ancak yön ters alınmıştır; fiili harcama/kullanım standardın üzerinde olduğundan sapma olumsuz niteliktedir.
      C: Bu tutar harcama ve verimlilik sapmalarının toplamıdır; soruda istenen sapma değildir.
      D: Standart saatlere göre esnek bütçe tutarıdır (6.000 × 9); bir sapma değildir.
      E: Fiili saatlere göre esnek bütçe tutarıdır (6.300 × 9); bir sapma değildir.
    hesap_adimlari:
    - Standart saat = 2.000 × 3 = 6.000
    - Değişken güg harcama (bütçe) sapması = 60.300 − 9 × 6.300 = 3.600
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Standart maliyet — GÜG sapmaları
    alinti: ''
  gecerlilik: *id001
  dogrulama:
    python: sonuc = abs(60300 - 9 * 6300)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
