  unite: Standart maliyet ve sapmalar
  konu: STD
  kazanim: direkt işçilik ücret sapmasından geriye doğru fiili saat ücreti
  tip: hesaplama
  zorluk: 2
  kok: SY İşletmesinde direkt işçilik saat ücreti standardı 48 ₺'dir. Dönemde fiilen 2.500 direkt işçilik saati çalışılmış
    (fiili üretim için izin verilen standart süre 3.000 saattir) ve ücret sapması 7.500 ₺ olumsuz olarak hesaplanmıştır. Buna
    göre fiilen ödenen saat ücreti kaç ₺'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 3 ₺
    B: 45 ₺
    C: 48 ₺
    D: 50,50 ₺
    E: 51 ₺
  dogru: E
  aciklama:
    dogru_neden: 'Ücret sapması = (fiili ücret − standart ücret) × fiili saat olduğundan saat başına fark 7.500 / 2.500 =
      3 ₺''dir. Sapma olumsuz olduğundan fiili ücret 48 + 3 = 51 ₺''dir. Püf noktaları: Ücret sapmasının tabanı fiili saattir;
      süre (verimlilik) sapmasının tabanı ise standart ücrettir. Standart süre bu soruda gereksiz bilgidir.'
    celdiriciler:
      A: Saat başına ücret farkıdır (7.500 / 2.500); standart ücrete eklenmediği veya çıkarılmadığı için fiili ücret değildir.
      B: Sapmanın yönü ters yorumlanmıştır; olumsuz ücret sapması fiili ücretin standart ücretten yüksek olduğunu gösterir.
      C: Standart ücretin kendisidir; sapma hesaba katılmamıştır.
      D: Sapma, fiili saat yerine izin verilen standart saate (3.000) bölünmüştür; ücret sapması fiili saat üzerinden hesaplanır.
    hesap_adimlari:
    - Saat başına fark = 7.500 / 2.500 = 3 ₺
    - Fiili ücret = 48 + 3 = 51 ₺
  kaynaklar:
