- id: SMMM-MAL-STD-0054
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Standart maliyet ve sapmalar
  konu: STD
  kazanim: direkt ilk madde fiyat sapmasının satın alma anında ayrıştırılması
  tip: hesaplama
  zorluk: 1
  kok: PR İşletmesi, polietilen granül için kg başına 22 ₺ standart fiyat belirlemiştir. Dönemde 12.000 kg polietilen granül
    kg başına 24 ₺'den satın alınmış, bunun 9.500 kg'ı üretimde kullanılmıştır (fiili üretim için izin verilen standart miktar
    9.000 kg'dır). İşletme fiyat sapmasını malzeme satın alınırken ayırarak izlemektedir. KDV dikkate alınmayacaktır. Buna
    göre fiyat sapması kaç ₺'dir ve hangi yöndedir?
  secenekler:
    A: 5.000 ₺ olumsuz
    B: 18.000 ₺ olumsuz
    C: 19.000 ₺ olumsuz
    D: 24.000 ₺ olumsuz
    E: 24.000 ₺ olumlu
  dogru: D
  aciklama:
    dogru_neden: 'Fiyat sapması satın alma anında ayrıştırıldığından satın alınan miktar esas alınır: (24 − 22) × 12.000 =
      24.000 ₺. Fiili fiyat standart fiyatın üstünde olduğundan sapma olumsuzdur.'
    celdiriciler:
      A: Yalnızca kullanılmayıp stokta kalan 2.500 kg'ın fiyat farkı hesaplanmıştır; satın alınan miktarın tamamı dikkate
        alınmamıştır.
      B: Fiyat farkı izin verilen standart miktar (9.000 kg) üzerinden hesaplanmıştır; fiyat sapması satın alınan miktara
        uygulanır.
      C: Fiyat farkı yalnızca üretimde kullanılan 9.500 kg üzerinden hesaplanmıştır; satın alma anında ayrıştırılan sapma
        satın alınan 12.000 kg'a ilişkindir.
      E: Tutar doğrudur ancak yön ters alınmıştır; fiili fiyat standardın üstünde olduğundan sapma olumsuz niteliktedir.
    hesap_adimlari:
    - Fiyat farkı = 24 − 22 = 2 ₺/kg
    - Satın alınan miktar = 12.000 kg
    - Sapma = 2 × 12.000 = 24.000 ₺ (olumsuz)
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Maliyet muhasebesi
    madde: Standart maliyet — fiyat sapması
    alinti: ''
  gecerlilik: &id001
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = abs((24 - 22) * 12000)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Bağımsız çözüm anahtarla aynı; hesap/mevzuat doğrulandı, tek doğru şık.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_A/MAL_STD_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Bağımsız çözüm anahtarla aynı; hesap/mevzuat doğrulandı, tek doğru şık.'
