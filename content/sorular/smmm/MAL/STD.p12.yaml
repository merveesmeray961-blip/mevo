  aciklama:
    dogru_neden: 'Standart saat 3.000 × 2 = 6.000; esnek bütçe 150.000 + 6 × 6.000 = 186.000 ₺''dir. Fark 190.000 − 186.000
      = 4.000 ₺ olup olumsuzdur. Bu fark bütçe (harcama) farkı ile verimlilik farkının toplamıdır. Püf noktaları: Esnek bütçe
      standart saatle kurulduğunda bulunan fark, bütçe ve verimlilik farklarının toplamıdır; kapasite farkı bu karşılaştırmanın
      dışındadır.'
