- id: SMMM-MAL-STD-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: STD
  kazanim: direkt işçilik zaman (verimlilik) sapması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Standart maliyet sistemi uygulayan MN İşletmesi''nde bir birim mamul için standart direkt işçilik süresi 3 saat, standart
    saat ücreti 20 TL''dir. Dönemde 4.000 birim mamul üretilmiş, bunun için 12.600 direkt işçilik saati kullanılmış ve direkt
    işçilik için toplam 302.400 TL ödenmiştir (saat başına ortalama 24 TL). KDV dikkate alınmayacaktır.


    Direkt işçilik zaman (verimlilik) sapması kaç TL''dir? (Sapma tutarı mutlak değer olarak istenmektedir.)'
  secenekler:
    A: '62.400'
    B: '50.400'
    C: '14.400'
    D: '12.000'
    E: '600'
  dogru: D
  aciklama:
    dogru_neden: Zaman (süre) sapması = (fiili saat − fiili üretime izin verilen standart saat) × standart saat ücretidir.
      Standart saat = 4.000 × 3 = 12.000 saattir. Zaman sapması = (12.600 − 12.000) × 20 = 12.000 TL (olumsuz). MSUGT'de zaman
      farkları 723 Direkt İşçilik Süre (Zaman) Farkları hesabında izlenir; olumsuz farklar hesabın borcuna kaydedilir.
    celdiriciler:
      A: '62.400: toplam direkt işçilik sapmasıdır (302.400 − 240.000); ücret ve zaman sapmalarının toplamıdır.'
      B: '50.400: ücret sapmasıdır ((24 − 20) × 12.600); zaman sapması değildir.'
      C: '14.400: saat sapması standart ücret yerine fiili ücretle (600 × 24) çarpılmıştır.'
      E: '600: yalnızca saat farkıdır; parasal değere çevrilmemiştir.'
    hesap_adimlari:
    - 'İzin verilen standart saat: 4.000 × 3 = 12.000 saat'
    - 'Saat sapması: 12.600 − 12.000 = 600 saat (olumsuz)'
    - 'Zaman sapması: 600 × 20 = 12.000 TL (olumsuz)'
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 723. Direkt İşçilik Süre (Zaman) Farkları
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda fiili giderler ile önceden saptanmış giderler arasındaki
      olumlu ya da olumsuz süre (zaman) farklarının kaydedildiği hesaptır.
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: 722. Direkt İşçilik Ücret Farkları
    alinti: Önceden saptanmış maliyet hesaplama yöntemlerinin uygulandığı durumlarda, fiili direkt işçilik giderleri ile önceden
      saptanmış ve maliyetlere yüklenmiş direkt işçilik giderleri arasındaki olumlu veya olumsuz ücret farklarının izlendiği
      hesaptır.
  dogrulama:
    python: 'sonuc = (12600 - 4000 * 3) * 20

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: D (güven 5) Zaman sapması=(12.600-4.000x3)x20=12.000 (olumsuz).'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Hata yok: (12.600 − 12.000) × 20 = 12.000 olumsuz (D); ücret sapması 50.400, toplam 62.400, 600 × 24 = 14.400
          ve 600 saat kesin yanlış.'
      G6:
        sonuc: gecti
