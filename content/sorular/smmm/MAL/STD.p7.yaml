- id: SMMM-MAL-STD-0005
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: Standart maliyet ve sapmalar
  konu: STD
  kazanim: GÜG sapmaları
  tip: hesaplama
  zorluk: 3
  kok: 'Önceden saptanmış maliyet yöntemini ve 7/A seçeneğini uygulayan N İşletmesi, dönem içinde 20.000 birim mamul üretmiş
    ve bunların 16.000 birimini satmıştır; kalan 4.000 birim dönem sonu mamul stokundadır. Dönem boyunca maliyetlere yüklenen
    önceden saptanmış genel üretim giderleri 400.000 TL''dir. Fiili genel üretim giderleri ile yüklenen giderler arasındaki
    fark analiz edilmiş ve şu sonuçlar bulunmuştur (olumsuz fark, fiili giderin yüklenen gideri aştığını gösterir):

    - Bütçe farkı: 12.000 TL olumsuz

    - Verimlilik farkı: 5.000 TL olumlu

    - Kapasite farkı: 8.000 TL olumsuz

    İşletme, dönem sonunda genel üretim giderleri fark hesaplarının net bakiyesini, üretim miktarına göre satılan ve stokta
    kalan mamullere dağıtmaktadır. Stokta kalan mamullere düşen pay 152 Mamüller hesabına, satılan mamullere düşen pay ise
    ilgili satış maliyeti hesabına aktarılmaktadır. KDV dikkate alınmayacaktır.


    Fark hesaplarının kapatılması sırasında 620 Satılan Mamüller Maliyeti hesabına borç kaydedilecek tutar kaç TL''dir?'
  secenekler:
    A: '3.000'
    B: '12.000'
    C: '15.000'
    D: '16.000'
    E: '20.000'
  dogru: B
  aciklama:
    dogru_neden: 'THP''ye göre genel üretim giderlerinin bütçe (732), verimlilik (733) ve kapasite (734) farkları ayrı hesaplarda
      izlenir; olumsuz farklar hesabın borcuna, olumlu farklar alacağına kaydedilir ve dönem sonunda ilgili stok ve satış
      maliyeti hesaplarına aktarılarak kapatılır. Hesaplar: 732 borç 12.000, 733 alacak 5.000, 734 borç 8.000. Net bakiye
      = 12.000 − 5.000 + 8.000 = 15.000 TL borçtur. Net tutar üretim miktarına göre dağıtılır: satılan pay 16.000 ÷ 20.000
      = %80 → 15.000 × 0,80 = 12.000 TL (620''ye borç); stoktaki pay 3.000 TL (152''ye borç).


      Püf noktaları: Önce üç fark hesabının işaretlerine göre net bakiye bulunmalıdır; olumlu verimlilik farkı toplamı azaltır.
      Dağıtım, net bakiye üzerinden yapılır; farkların ayrı ayrı veya yalnızca olumsuz olanların dağıtılması hatalıdır. Maliyetlere
      yüklenen 400.000 TL çözüme etki etmeyen gereksiz veridir.'
    celdiriciler:
      A: '3.000: stokta kalan mamullere düşen pay (15.000 × 4.000/20.000) bulunmuş, 620''ye aktarılacak satılan pay yerine
        alınmıştır.'
      C: '15.000: net bakiyenin tamamı satılan mamullere aktarılmış, stokta kalan 4.000 birimin payı dikkate alınmamıştır.'
      D: '16.000: yalnızca olumsuz farklar (12.000 + 8.000 = 20.000 TL) alınmış ve olumlu verimlilik farkı mahsup edilmeden
        satılan pay (%80) uygulanmıştır.'
      E: '20.000: olumsuz farkların toplamı (12.000 + 8.000) dağıtılmadan alınmıştır; olumlu fark mahsup edilmemiş ve stok
        payı ayrılmamıştır.'
    hesap_adimlari:
    - '732 (bütçe, olumsuz): 12.000 TL borç; 733 (verimlilik, olumlu): 5.000 TL alacak; 734 (kapasite, olumsuz): 8.000 TL
      borç'
    - 'Net bakiye: 12.000 − 5.000 + 8.000 = 15.000 TL borç'
    - 'Satılan mamul payı: 16.000 ÷ 20.000 = %80'
    - '620 hesabına aktarılacak tutar: 15.000 × 0,80 = 12.000 TL (152 hesabına 3.000 TL)'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 732. Genel Üretim Giderleri Bütçe Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz
      bütçe farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir. Dönem
      sonlarında bu hesap ilgili stok ve satış maliyeti hesaplarına aktarılarak kapatılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 733. Genel Üretim Giderleri Verimlilik Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz
      verimlilik farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 734. Genel Üretim Giderleri Kapasite Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz
      kapasite farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 620. Satılan Mamuller Maliyet — İşleyişi
    alinti: Satılan mamullerin maliyet tutarı 152 nolu hesaba (Mamuller Hs.) alacak, bu hesaba ise borç kaydedilir.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'net = 12000 - 5000 + 8000

      sonuc = net * 16000 / 20000

      '
