      THP'ye göre olumsuz farklar hesabın borcuna, olumlu farklar alacağına yazılır.
    celdiriciler:
      A: '712 için 8.000 TL: fiyat farkı fiili miktar yerine standart miktar (2 × 4.000) ile hesaplanmıştır.'
      B: '713 için 5.400 TL: miktar farkı standart fiyat yerine fiili fiyatla (300 × 18) hesaplanmıştır.'
      D: Her iki farkın yönü de ters alınmıştır; olumsuz miktar farkı borca, olumlu fiyat farkı alacağa yazılır.
      E: Miktar farkı olumsuz olduğu halde 713 hesabın alacağına yazılmıştır; olumsuz farklar hesabın borcuna kaydedilir.
    hesap_adimlari:
    - 'Fiyat farkı: (18 − 20) × 4.300 = −8.600 TL (olumlu) → 712 alacak'
    - 'Miktar farkı: (4.300 − 4.000) × 20 = 6.000 TL (olumsuz) → 713 borç'
  kaynaklar:
