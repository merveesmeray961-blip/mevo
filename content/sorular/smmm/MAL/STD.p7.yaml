    - Birim standart fiyat: 20 TL/kg

    - Fiili alış fiyatı: 18 TL/kg

    - Fiili üretim düzeyi için izin verilen standart miktar: 4.000 kg

    - Fiili kullanılan miktar: 4.300 kg

    Fiyat farkı, fiili fiyat ile standart fiyat arasındaki farkın fiili miktarla; miktar farkı ise fiili miktar ile standart
    miktar arasındaki farkın standart fiyatla çarpılmasıyla bulunur. Fiili maliyetin standardın üzerinde kalması olumsuz farktır.
    KDV dikkate alınmayacaktır.


