- id: SMMM-MAL-STD-0004
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: Standart maliyet ve sapmalar
  konu: STD
  kazanim: direkt işçilik ücret ve zaman sapması
  tip: uygulama
  zorluk: 3
  kok: 'Önceden saptanmış (standart) maliyet yöntemini 7/A seçeneği ile uygulayan GM İşletmesi''nde bir mamul için direkt
    işçilik standartları, birim başına 4 saat ve saat başına 30 TL ücrettir. Dönemde 2.500 birim üretilmiştir (planlanan üretim
    3.000 birimdi). Fiilen 10.400 direkt işçilik saati çalışılmış ve saat başına ortalama 29 TL ücret ödenmiştir.


    Ücret sapması fiili saat üzerinden, zaman sapması standart ücret üzerinden hesaplanacak; sapmalar Tekdüzen Hesap Planı''ndaki
    ilgili fark hesaplarında izlenecektir. KDV dikkate alınmayacaktır. Dönem sonunda ilgili fark hesaplarının bakiyeleri aşağıdakilerden
    hangisidir?'
  secenekler:
    A: '722: 10.400 TL alacak; 723: 12.000 TL borç'
    B: '722: 10.000 TL alacak; 723: 12.000 TL borç'
    C: '722: 10.400 TL alacak; 723: 11.600 TL borç'
    D: '722: 10.400 TL borç; 723: 12.000 TL borç'
    E: '722: 10.400 TL alacak; 723: 12.000 TL alacak'
  dogru: A
  aciklama:
    dogru_neden: 'Standart saat = 2.500 × 4 = 10.000 saattir (planlanan 3.000 birim esnek bütçeye girer; çözümde kullanılmaz).
      Ücret sapması = (29 − 30) × 10.400 = 10.400 TL olumludur. Zaman sapması = (10.400 − 10.000) × 30 = 12.000 TL olumsuzdur.
      THP''ye göre olumsuz ücret farkları 722''nin borcuna, olumlu ücret farkları alacağına; olumsuz süre farkları 723''ün
      borcuna, olumlu süre farkları alacağına kaydedilir. Bakiyeler: 722 → 10.400 TL alacak, 723 → 12.000 TL borç.


      Püf noktaları: Standart saat fiili üretimden bulunur, plandan değil. İki sapmanın yönü birbirine zıttır: daha ucuz ama
      daha uzun çalışılmıştır. Ücret sapmasında fiili saat, zaman sapmasında standart ücret kullanılır; tersi çeldiricilere
      götürür.'
    celdiriciler:
      B: Ücret sapması standart saat (10.000) üzerinden hesaplanmıştır; kökte fiili saat esas alınacağı belirtilmiştir.
      C: Zaman sapması standart ücret (30 TL) yerine fiili ücretle (29 TL) hesaplanmıştır (400 × 29).
      D: Fiili ücret standardın altında olduğundan ücret sapması olumludur ve 722'nin alacağında izlenir; borçta gösterilmesi
        yön hatasıdır.
      E: Fiili saat standart saatten fazla olduğundan zaman sapması olumsuzdur ve 723'ün borcunda izlenir; alacakta gösterilmesi
        yön hatasıdır.
    hesap_adimlari:
    - 'Standart saat: 2.500 × 4 = 10.000 saat'
    - 'Ücret sapması: (29 − 30) × 10.400 = −10.400 TL → olumlu → 722 alacak'
    - 'Zaman sapması: (10.400 − 10.000) × 30 = 12.000 TL → olumsuz → 723 borç'
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 722. Direkt İşçilik Ücret Farkları
    alinti: Olumsuz ücret farkları bu hesabın borcuna, olumlu ücret farkları ise alacağına kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-5 Tekdüzen Hesap Planı Açıklamaları
    madde: 723. Direkt İşçilik Süre (Zaman) Farkları
    alinti: Olumsuz süre farkları bu hesabın borcuna olumlu süre farkları ise alacağına kaydedilir.
