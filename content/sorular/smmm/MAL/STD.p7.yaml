    B: 712 hesaba 8.600 TL alacak; 713 hesaba 5.400 TL borç
    C: 712 hesaba 8.600 TL alacak; 713 hesaba 6.000 TL borç
    D: 712 hesaba 8.600 TL borç; 713 hesaba 6.000 TL alacak
    E: 712 hesaba 8.600 TL alacak; 713 hesaba 6.000 TL alacak
  dogru: C
  aciklama:
