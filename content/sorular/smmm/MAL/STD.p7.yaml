    direkt işçilik standartları, mamul başına 2 saat ve saat başına 30 TL''dir. Cari dönemde 5.000 birim mamul üretilmiş,
    9.500 direkt işçilik saati kullanılmış ve fiili saat ücreti 32 TL olarak gerçekleşmiştir. İşletme, ücret farkını (fiili
