    TL olumsuz bütçe farkı, 5.000 TL olumlu verimlilik farkı ve 9.000 TL olumsuz kapasite farkı. Kaynakta belirtilen borç/alacak
    yönlerine göre bu üç farkın ilgili hesaplarda oluşturacağı net bakiye hangi seçenekte doğru verilmiştir?'
