    A: 732 hesabında 12.000 TL borç, 733 hesabında 5.000 TL borç, 734 hesabında 9.000 TL borç
    B: 732 hesabında 12.000 TL alacak, 733 hesabında 5.000 TL borç, 734 hesabında 9.000 TL alacak
    C: 732 hesabında 12.000 TL borç, 733 hesabında 5.000 TL alacak, 734 hesabında 9.000 TL borç
    D: 732 hesabında 5.000 TL borç, 733 hesabında 12.000 TL alacak, 734 hesabında 9.000 TL borç
    E: 732 hesabında 9.000 TL borç, 733 hesabında 5.000 TL alacak, 734 hesabında 12.000 TL borç
