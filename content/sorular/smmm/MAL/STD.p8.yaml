  aciklama:
    dogru_neden: '732 Genel Üretim Giderleri Bütçe Farkları hesabında olumsuz farklar borca, olumlu farklar alacağa kaydedilir.
      Aynı yön 733 Verimlilik Farkları ve 734 Kapasite Farkları için de geçerlidir. Bu nedenle 12.000 TL olumsuz bütçe farkı
      732''ye borç, 5.000 TL olumlu verimlilik farkı 733''e alacak, 9.000 TL olumsuz kapasite farkı 734''e borç kaydedilir.
      Püf noktaları: Önce farkın türünü doğru hesaba, sonra olumlu/olumsuz niteliğini borç veya alacağa eşleştirin.'
    celdiriciler:
      A: 733'teki 5.000 TL olumlu verimlilik farkını borç göstermektedir; kaynakta olumlu farkların alacağa kaydedileceği
        belirtilir.
      B: 732 ve 734 için olumlu/olumsuz yönler ters çevrilmiştir.
      D: Bütçe ve verimlilik farklarının tutarları ile hesapları yer değiştirilmiştir.
