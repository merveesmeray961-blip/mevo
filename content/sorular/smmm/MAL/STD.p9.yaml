- id: SMMM-MAL-STD-0016
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Standart maliyet ve sapmalar
  konu: STD
  kazanim: direkt ilk madde fiyat ve miktar sapması
  tip: uygulama
  zorluk: 2
  kok: 'Standart maliyet yöntemini uygulayan bir işletmede bir mamul için standart direkt ilk madde miktarı 5 kg/birim, standart
    fiyat 12 TL/kg’dır. Dönemde 2.000 birim üretilmiş, 11.000 kg ilk madde 13 TL/kg fiyatla satın alınmış ve kullanılmıştır.
    Fiyat sapması ve miktar sapması sırasıyla kaç TL’dir?

    '
  secenekler:
    A: 11.000 TL olumsuz; 12.000 TL olumsuz
    B: 11.000 TL olumlu; 12.000 TL olumsuz
    C: 12.000 TL olumsuz; 11.000 TL olumsuz
    D: 13.000 TL olumsuz; 10.000 TL olumsuz
    E: 11.000 TL olumsuz; 10.000 TL olumlu
  dogru: A
  aciklama:
    dogru_neden: 'Fiyat sapması = (fiili fiyat − standart fiyat) × fiili miktar = (13 − 12) × 11.000 = 11.000 olumsuz. Miktar
      sapması = (fiili miktar − standart miktar) × standart fiyat = (11.000 − 2.000×5) × 12 = (11.000 − 10.000) × 12 = 12.000
      olumsuz. Püf noktaları: Fiyat sapmasında fiili miktar, miktar sapmasında standart fiyat kullanılır.'
    celdiriciler:
      B: Fiyat sapmasının yönünü ters çevirir.
      C: Sapma tutarlarını yer değiştirir.
      D: Yanlış miktar ve fiyat farkı kullanır.
      E: Miktar sapmasının yönünü ters çevirir.
    hesap_adimlari:
    - Fiyat sapması = (13-12)*11000 = 11000 olumsuz
    - Standart miktar = 2000*5 = 10000
    - Miktar sapması = (11000-10000)*12 = 12000 olumsuz
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı
    madde: Fark hesapları
    alinti: Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: fiyat = (13-12)*11000; miktar = (11000 - 2000*5)*12; sonuc = (fiyat, miktar)
  durum: taslak
  surum: 1
  uretim:
