- id: SMMM-MAL-STD-0001
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: STD
  kazanim: Direkt ilk madde ve malzeme miktar sapması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Standart maliyet sistemi uygulayan L İşletmesi'nde bir birim mamul için standart olarak 4 kg ilk madde ve
    malzeme kullanılması, ilk madde ve malzemenin standart fiyatının 20 ₺/kg olması öngörülmüştür. Dönem içinde
    2.500 birim mamul üretilmiş; bu üretim için kilogramı 19 ₺'den satın alınan 10.800 kg ilk madde ve malzeme kullanılmıştır.
    KDV dikkate alınmayacaktır. Buna göre direkt ilk madde ve malzeme miktar sapması aşağıdakilerden hangisidir?
  secenekler:
    A: 5.200 ₺ aleyhte
    B: 10.000 ₺ lehte
    C: 10.800 ₺ lehte
    D: 15.200 ₺ aleyhte
    E: 16.000 ₺ aleyhte
  dogru: E
  aciklama:
    dogru_neden: Miktar sapması, fiili miktar ile fiili üretim için izin verilen standart miktar arasındaki farkın
      standart fiyatla çarpılmasıyla bulunur. Standart miktar 2.500 × 4 = 10.000 kg'dır. Miktar sapması (10.800
      - 10.000) × 20 = 16.000 ₺'dir; standarttan fazla malzeme kullanıldığı için aleyhtedir.
    hesap_adimlari:
    - 'Fiili üretim için standart miktar: 2.500 × 4 = 10.000 kg'
    - 'Miktar farkı: 10.800 - 10.000 = 800 kg (fazla kullanım)'
    - 'Miktar sapması: 800 × 20 = 16.000 ₺ aleyhte'
    - 'Kontrol: fiyat sapması (19 - 20) × 10.800 = 10.800 ₺ lehte; toplam sapma 16.000 - 10.800 = 5.200 ₺ aleyhte'
    celdiriciler:
      A: 5.200 ₺ aleyhte toplam ilk madde sapmasıdır (fiili maliyet 205.200 - standart maliyet 200.000); miktar
        ve fiyat sapmaları ayrıştırılmamıştır.
      B: 10.000 ₺ lehte, fiyat farkının (1 ₺) fiili miktar yerine standart miktarla (10.000 kg) çarpılmasıyla bulunur;
        bu tutar fiyat sapmasına ilişkin hatalı bir hesaptır.
      C: 10.800 ₺ lehte fiyat sapmasıdır ((19 - 20) × 10.800); soru miktar sapmasını sormaktadır.
      D: 15.200 ₺ aleyhte, miktar farkının standart fiyat yerine fiili fiyatla (800 × 19) çarpılmasıyla bulunur.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 21
    alinti: Sonuçların maliyete yakın olması durumunda, kolaylık sağlaması amacıyla, standart maliyet yöntemi veya
      perakende yöntemi gibi, stokların maliyetinin ölçümüne yönelik teknikler kullanılabilir. Standart maliyetler;
      hammadde ve malzemenin, işçiliğin, etkinliğin ve kapasite kullanımının normal düzeylerini dikkate alır.
  - mevzuat: Maliyet muhasebesi — genel kabul görmüş standart maliyet sapma analizi
    madde: Miktar sapması = (Fiili miktar - Standart miktar) × Standart fiyat
    alinti: ''
  dogrulama:
    python: 'standart_miktar = 2500 * 4

      sonuc = (10800 - standart_miktar) * 20

      '
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
