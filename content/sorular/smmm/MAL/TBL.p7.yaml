    - Satılan malların müşterilere teslimi için yapılan nakliye gideri: 25.000 TL

    - Dönem içinde 621 Satılan Ticari Mallar Maliyeti hesabına borç kaydedilen tutar: 890.000 TL


    Dönem içinde alınan tüm mallar stoklara girmiştir. Buna göre dönem sonu ticari mal stoku kaç TL''dir? KDV dikkate
    alınmayacaktır.'
  secenekler:
    A: '235.000'
    B: '210.000'
    C: '185.000'
    D: '160.000'
    E: '60.000'
