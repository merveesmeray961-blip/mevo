- id: SMMM-MAL-TBL-0022
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet tabloları ve geri hesaplar
  konu: TBL
  kazanim: zincirleme dönem tabloları
  tip: hesaplama
  zorluk: 3
  kok: 'Mamul üreten V İşletmesi, birbirini izleyen X1 ve X2 dönemlerinin satışların maliyeti tablolarını düzenlemektedir.
    Yarı mamul ve mamul stoklarındaki değişim, ilgili stokun dönem başı tutarından dönem sonu tutarı çıkarılarak
    bulunmakta ve işaretiyle birlikte ilgili toplama eklenmektedir. Dönemlerin verileri şöyledir (TL):


    X1 dönemi: Direkt ilk madde ve malzeme 400.000; direkt işçilik 300.000; genel üretim giderleri 200.000; dönem
    başı yarı mamul stoku 40.000; dönem sonu yarı mamul stoku 70.000; dönem başı mamul stoku 100.000; satılan mamul
    maliyeti 840.000. Dönem sonu mamul stoku verilmemiştir.


    X2 dönemi: Direkt ilk madde ve malzeme 450.000; direkt işçilik 330.000; genel üretim giderleri 220.000; dönem
    sonu yarı mamul stoku 50.000; dönem sonu mamul stoku 90.000. İşletmenin X2 dönemi başı stokları, X1 dönemi sonu
    stoklarına eşittir.


    X2 dönemi satılan mamul maliyeti kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: '940.000'
    B: 1.000.000
    C: 1.020.000
    D: 1.040.000
    E: 1.060.000
  dogru: E
  aciklama:
    dogru_neden: 'Satışların maliyeti tablosunda direkt ilk madde, direkt işçilik ve genel üretim giderleri ile
      yarı mamul stoklarındaki değişim toplanarak üretim maliyeti bulunur; mamul stoklarındaki değişimin üretim
      maliyetine eklenmesi veya çıkarılması ile satılan mamul maliyetine ulaşılır. X1: üretim maliyeti = 400.000
      + 300.000 + 200.000 + (40.000 − 70.000) = 870.000 TL; satılan mamul maliyeti 840.000 = 870.000 + (100.000
      − dönem sonu mamul) olduğundan X1 sonu mamul stoku 130.000 TL''dir. Bu tutarlar X2 dönemi başı stoklarıdır
      (yarı mamul 70.000; mamul 130.000). X2: üretim maliyeti = 450.000 + 330.000 + 220.000 + (70.000 − 50.000)
      = 1.020.000 TL; satılan mamul maliyeti = 1.020.000 + (130.000 − 90.000) = 1.060.000 TL.


      Püf noktaları: X2''nin dönem başı stokları X1 tablosundan geri hesapla bulunmalıdır; mamul stoku X1''de verilmemiştir.
      X1''in dönem başı stokları (40.000 ve 100.000) X2''de kullanılamaz. İki stok değişiminin de "dönem başı −
      dönem sonu" işaretiyle eklendiğine dikkat edilmelidir.'
    celdiriciler:
      A: '940.000: iki stok değişimi de ters işaretle uygulanmıştır (1.000.000 − 20.000 − 40.000).'
      B: '1.000.000: zincir kopartılarak X1 dönemi başı stokları (40.000 ve 100.000) kullanılmıştır; (1.000.000
        + (40.000 − 50.000) + (100.000 − 90.000)).'
      C: '1.020.000: yalnızca üretim maliyeti alınmış, mamul stoklarındaki değişim (40.000 TL) eklenmemiştir.'
      D: '1.040.000: yarı mamul stoklarındaki değişim (20.000 TL) unutulmuş, yalnızca mamul stok değişimi eklenmiştir
        (1.000.000 + 40.000).'
    hesap_adimlari:
    - 'X1 üretim maliyeti: 900.000 + (40.000 − 70.000) = 870.000 TL'
