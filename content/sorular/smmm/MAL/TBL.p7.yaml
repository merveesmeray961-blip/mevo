      dönem başı ile dönem sonu stoku arasındaki farktır. 20X2 dönem başı stokları bilinmediğinden önce 20X1 tablosu
      çözülür.

      20X1 üretim maliyeti = 600.000 + 20.000 − 50.000 = 570.000 TL. 20X1 dönem sonu mamul stoku = 570.000 + 40.000
