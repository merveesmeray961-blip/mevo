    dogru_neden: 'VUK md. 262''ye göre maliyet bedeli, iktisadi kıymetin iktisabı için yapılan ödemelerle bunlara
      müteferri bilümum giderlerin toplamıdır; gümrük vergileri ve nakliye giderleri iktisapla doğrudan ilgili olduğundan
      maliyet bedeline girer. (Faturadaki satın alma bedelini ifade eden alış bedeli, md. 268/A uyarınca diğer iktisap
      giderlerini içermez.) 153 Ticari Mallar hesabı maliyet bedeli ile borçlandırılır, satılan malların maliyet
      bedeli ile alacaklandırılır ve karşılığında 621''e borç kaydedilir. Müşteriye teslim nakliyesi ise satış fonksiyonunun
      gideri olup (631) ticari mal maliyetine girmez. Alışların maliyeti = 900.000 + 20.000 + 30.000 = 950.000 TL.
      Dönem sonu stok = 150.000 + 950.000 − 890.000 = 210.000 TL.


      Püf noktaları: Burada iki kavram ayrılmalıdır: faturadaki alış bedeli ile gümrük ve nakliye gibi müteferri
      giderleri de içeren maliyet bedeli. Ayrıca 621''e giden tutar stok hesabından çıkan maliyet olduğundan hesap
      geriye doğru yapılır (dönem sonu stok = dönem başı + alışların maliyeti − satılan malın maliyeti). Satış nakliyesi
