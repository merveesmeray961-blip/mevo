- id: SMMM-MAL-TBL-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet tabloları ve geri hesaplar
  konu: TBL
  kazanim: satılan mamul maliyeti
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. LD İşletmesi'nde dönem başı mamul stoku 90.000 TL, dönem sonu mamul stoku 70.000
    TL'dir. Dönem içinde direkt ilk madde ve malzeme 240.000 TL, direkt işçilik 110.000 TL, genel üretim giderleri
    80.000 TL ve üretimde kullanılan yarı mamul tutarı 30.000 TL'dir. Dönem içinde mamullerin 10.000 TL'lik kısmı
    işletme içinde tüketilmiştir. Buna göre satılan mamul maliyeti kaç TL'dir?
  secenekler:
    A: 430.000 TL
    B: 450.000 TL
    C: 470.000 TL
    D: 490.000 TL
    E: 510.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Üretim maliyeti 240.000 + 110.000 + 80.000 + 30.000 = 460.000 TL''dir. Mamul stoklarında değişim,
      dönem başı mamul stoku ile dönem sonu mamul stoku ve iç tüketim toplamı arasındaki farktır: 90.000 − (70.000
      + 10.000) = 10.000 TL. Bu tutar üretim maliyetine eklendiğinde satılan mamul maliyeti 470.000 TL olur. Püf
      noktaları: İç tüketim tutarı dönem sonu mamul stokuyla birlikte stok değişiminin hesabına alınır; yalnızca
      dönem başı ve dönem sonu stok farkını kullanmak doğru değildir.'
    celdiriciler:
      A: 430.000 TL, 30.000 TL'lik yarı mamul kullanım tutarının üretim maliyetinden çıkarılmasıyla bulunur.
      B: 450.000 TL, 10.000 TL iç tüketimin satılan mamul maliyetine etkisinin göz ardı edilmesiyle bulunur.
      D: 490.000 TL, 10.000 TL iç tüketimin stok değişimine yanlış yönde dahil edilmesiyle elde edilir.
      E: 510.000 TL, dönem başı mamul stoku ve iç tüketimin üretim maliyetine ayrıca eklenmesiyle oluşur.
    hesap_adimlari:
    - Üretim maliyeti = 240.000 + 110.000 + 80.000 + 30.000 = 460.000 TL
    - Mamul stoklarında değişim = 90.000 − (70.000 + 10.000) = 10.000 TL
    - Satılan mamul maliyeti = 460.000 + 10.000 = 470.000 TL
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği — Ek 4
    madde: Satışların Maliyet Tablosu, E. Mamul Stoklarında Değişim
    alinti: Direkt ilk madde ve malzeme, direkt işçilik, genel üretim giderleri ve yarı mamul kullanım tutarlarının
      toplamı üretim maliyetini verir. Dönem başı mamul stoku ile dönem sonu mamul stoku ve mamullerinin bir bölümünü
      iç tüketimde kullanan işletmelerde, sözkonusu tüketim miktarının toplamı arasındaki fark "Mamul Stoklarında
      Değişim" tutarını oluşturur. Bu tutarın üretim maliyetine eklenmesi veya çıkarılması ile satılan mamul maliyetine
      ulaşılır.
  gecerlilik:
    baslangic: '2008-12-26'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'uretim = 240000 + 110000 + 80000 + 30000

      stok_degisim = 90000 - (70000 + 10000)

      sonuc = uretim + stok_degisim'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 5).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı; alıntılar otomatik olarak resmî metinde doğrulandı'
      GZ:
