  unite: Maliyet tabloları ve geri hesaplar
  konu: TBL
  kazanim: satılan mamul maliyeti
  tip: uygulama
  zorluk: 2
  kok: 'Bir üretim işletmesinin satışların maliyeti tablosu verileri şöyledir: Direkt ilk madde ve malzeme giderleri
    320.000 TL, Direkt işçilik giderleri 180.000 TL, Genel üretim giderleri 140.000 TL, Yarı mamul stoklarında artış
    25.000 TL, Dönem başı mamul stoku 90.000 TL, Dönem sonu mamul stoku 70.000 TL. Buna göre satılan mamul maliyeti
    kaç TL’dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: 615.000 TL
    B: 635.000 TL
    C: 645.000 TL
    D: 665.000 TL
    E: 685.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Üretim maliyeti = Direkt İMM + Direkt işçilik + GÜG + Yarı mamul stoklarında değişim. Yarı mamul
      stoklarında artış (kullanım negatif etki) olduğu için üretim maliyetinden düşülür: 320.000 + 180.000 + 140.000
      − 25.000 = 615.000 TL. Satılan mamul maliyeti = Üretim maliyeti + Dönem başı mamul − Dönem sonu mamul = 615.000
      + 90.000 − 70.000 = 635.000 TL.'
    celdiriciler:
      A: '615.000 TL: Yalnız üretim maliyeti hesaplanmış; mamul stok değişimi eklenmemiştir.'
      C: '645.000 TL: Yarı mamul artışı eklenerek (yanlış işaret) üretim maliyeti 640.000 alınmış, sonra mamul farkı
        uygulanmıştır.'
      D: '665.000 TL: Yarı mamul değişimi yok sayılarak 640.000 + 90.000 − 70.000 = 660.000 civarı yanlış yuvarlama
        veya ekleme yapılmıştır.'
      E: '685.000 TL: Tüm kalemler (yarı mamul artışı dahil) toplanmış ve mamul stok farkı yanlış işaretle işlenmiştir.'
    hesap_adimlari:
    - Üretim maliyeti = 320.000 + 180.000 + 140.000 − 25.000 (yarı mamul artışı) = 615.000 TL
    - Satılan mamul maliyeti = 615.000 + 90.000 − 70.000 = 635.000 TL
