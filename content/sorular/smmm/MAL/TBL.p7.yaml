  ders: MAL
  unite: Maliyet tabloları ve geri hesaplar
  konu: TBL
  kazanim: üretim maliyeti
  tip: hesaplama
  zorluk: 1
  kok: KDV dikkate alınmayacaktır. KZ İşletmesi'nin bir üretim döneminde direkt ilk madde ve malzeme giderleri 180.000
    TL, direkt işçilik giderleri 140.000 TL ve genel üretim giderleri 100.000 TL'dir. Bu verilere göre üretim maliyeti
    kaç TL'dir?
  secenekler:
    A: 420.000 TL
    B: 380.000 TL
    C: 440.000 TL
    D: 460.000 TL
    E: 480.000 TL
  dogru: A
  aciklama:
    dogru_neden: MSUGT'deki satışların maliyeti tablosu açıklamasına göre direkt ilk madde ve malzeme, direkt işçilik,
      genel üretim giderleri ve varsa yarı mamul kullanım tutarları üretim maliyetini verir. Bu soruda yarı mamul
      kullanım tutarı verilmediğinden 180.000 + 140.000 + 100.000 = 420.000 TL'dir.
    celdiriciler:
      C: 440.000 TL, genel üretim giderlerinin 20.000 TL fazla alınmasıyla bulunur.
      D: 460.000 TL, direkt ilk madde ve malzeme ile direkt işçiliğin toplamına genel üretim giderlerinin hatalı
        olarak eklenmesi sonucu oluşur.
      E: 480.000 TL, verilen üç maliyet unsurunun toplamına kaynakta bulunmayan ek bir unsur dahil edilmesiyle elde
        edilir.
      B: 380.000 TL, genel üretim giderlerinin 20.000 TL eksik alınmasıyla bulunur.
    hesap_adimlari:
    - 'Direkt ilk madde ve malzeme: 180.000 TL'
    - 'Direkt işçilik: 140.000 TL'
    - 'Genel üretim giderleri: 100.000 TL'
    - Üretim maliyeti = 180.000 + 140.000 + 100.000 = 420.000 TL
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği — Ek 4
    madde: Satışların Maliyet Tablosu, E. Mamul Stoklarında Değişim
    alinti: Direkt ilk madde ve malzeme, direkt işçilik, genel üretim giderleri ve yarı mamul kullanım tutarlarının
      toplamı üretim maliyetini verir.
  gecerlilik:
