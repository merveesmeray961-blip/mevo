- id: SMMM-MAL-TBL-0040
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet tabloları ve geri hesaplar
  konu: TBL
  kazanim: satılan mamul maliyeti
  tip: hesaplama
  zorluk: 3
  kok: KDV dikkate alınmayacaktır. Bir üretim işletmesinin dönem üretim maliyeti 400.000 TL, dönem başı mamul stoku 80.000
    TL ve dönem sonu mamul stoku 50.000 TL'dir. İşletme ürettiği mamullerin 20.000 TL'lik kısmını işletme içinde tüketmiştir.
    Buna göre satılan mamul maliyeti kaç TL'dir?
  secenekler:
    A: 390.000 TL
    B: 400.000 TL
    C: 410.000 TL
    D: 430.000 TL
    E: 450.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Üretim maliyetine mamul stok değişimi uygulanır; iç tüketim de satılan mamul maliyetine dahil olmayan bir
      kullanım olduğundan düşülür. Satılan mamul maliyeti = 400.000 + 80.000 − 50.000 − 20.000 = 410.000 TL. Püf noktaları:
      İç tüketim tutarı satış olarak kabul edilmediği için satılan mamul maliyetinden ayrıca çıkarılır.'
    celdiriciler:
      A: 390.000 TL, üretim maliyetine dönem başı ve dönem sonu stok farkının yanlış yönde uygulanmasıyla elde edilir.
      B: 400.000 TL, stok değişimi ve iç tüketim etkilerinin tamamen göz ardı edilmesiyle bulunur.
      D: 430.000 TL, iç tüketimin satılan mamul maliyetinden çıkarılmamasıyla oluşur.
      E: 450.000 TL, dönem başı stokunun üretim maliyetine eklenip dönem sonu ve iç tüketimin doğru biçimde düşülmemesiyle
        oluşur.
    hesap_adimlari:
    - Üretim maliyeti = 400.000 TL.
    - Mamul stok değişimi = 80.000 − 50.000 = 30.000 TL.
    - İç tüketim = 20.000 TL.
    - Satılan mamul maliyeti = 400.000 + 30.000 − 20.000 = 410.000 TL.
  kaynaklar:
  - mevzuat: MSUGT Sıra No 2 – Satışların Maliyeti Tablosu düzeltmesi
    madde: E. Mamül Stoklarında Değişim
    alinti: Direkt ilk madde ve malzeme, direkt işçilik, genel üretim giderleri ve yarı mamul kullanım tutarlarının toplamı
      üretim maliyetini verir. Dönem başı mamul stoku ile dönem sonu mamul stoku ve mamullerinin bir bölümünü iç tüketimde
      kullanan işletmelerde, sözkonusu tüketim miktarının toplamı arasındaki fark "Mamul Stoklarında Değişim" tutarını oluşturur.
      Bu tutarın üretim maliyetine eklenmesi veya çıkarılması ile satılan mamul maliyetine ulaşılır.
  gecerlilik:
    baslangic: '1993-12-16'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 400000 + 80000 - 50000 - 20000
  durum: taslak
  surum: 1
