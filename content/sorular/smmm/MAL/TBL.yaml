- id: SMMM-MAL-TBL-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: TBL
  kazanim: Satılan mamul maliyeti (çeldirici kalemli maliyet tablosu)
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'AK İşletmesi''nin dönemine ait bilgiler şöyledir: dönem başı ilk madde ve malzeme stoku 40.000 ₺, dönem
    içi ilk madde ve malzeme alışları 260.000 ₺, dönem sonu ilk madde ve malzeme stoku 60.000 ₺, direkt işçilik
    giderleri 180.000 ₺, genel üretim giderleri 120.000 ₺, dönem başı yarı mamul stoku 30.000 ₺, dönem sonu yarı
    mamul stoku 50.000 ₺, dönem başı mamul stoku 70.000 ₺, dönem sonu mamul stoku 90.000 ₺, genel yönetim giderleri
    45.000 ₺, finansman giderleri 25.000 ₺, pazarlama, satış ve dağıtım giderleri 35.000 ₺. KDV dikkate alınmayacaktır.
    Buna göre AK İşletmesi''nin satılan mamul maliyeti kaç ₺''dir?'
  secenekler:
    A: '570.000'
    B: '545.000'
    C: '540.000'
    D: '520.000'
    E: '500.000'
  dogru: E
  aciklama:
    dogru_neden: Satılan mamul maliyeti yalnızca üretim maliyetlerinden (direkt ilk madde ve malzeme, direkt işçilik,
      genel üretim giderleri) ve stok değişimlerinden oluşur. TMS 2 md. 16'ya göre stokların mevcut konumuna ve
      durumuna getirilmesinde katkısı olmayan genel yönetim giderleri ile satış maliyetleri stok maliyetine girmez;
      finansman giderleri de dönem gideridir. Direkt ilk madde ve malzeme gideri 240.000 ₺, dönem üretim maliyeti
      540.000 ₺, üretilen mamul maliyeti 520.000 ₺, satılan mamul maliyeti 520.000 + 70.000 - 90.000 = 500.000 ₺'dir.
    hesap_adimlari:
    - 'Direkt ilk madde ve malzeme gideri: 40.000 + 260.000 - 60.000 = 240.000 ₺'
    - 'Dönem üretim maliyeti: 240.000 + 180.000 + 120.000 = 540.000 ₺'
    - 'Üretilen mamul maliyeti: 540.000 + 30.000 - 50.000 = 520.000 ₺'
    - 'Satılan mamul maliyeti: 520.000 + 70.000 - 90.000 = 500.000 ₺'
    - Genel yönetim, finansman ve pazarlama giderleri dönem gideridir; tabloya girmez.
    celdiriciler:
      A: 570.000 ₺, doğru tutara genel yönetim giderleri (45.000) ve finansman giderleri (25.000) eklenerek bulunur;
        bu iki kalem dönem gideridir, mamul maliyetine katılmaz.
      B: 545.000 ₺, genel yönetim giderlerinin (45.000) maliyete katılmasıyla bulunur; TMS 2 md. 16(c) uyarınca
        bu giderler stok maliyetine dâhil edilmez.
      C: 540.000 ₺ dönem üretim maliyetidir; yarı mamul ve mamul stoklarındaki değişim hesaba katılmamıştır (mamul
        stok değişimi ters işaretle alındığında da aynı tutar çıkar).
      D: 520.000 ₺ üretilen mamul maliyetidir; mamul stoklarındaki değişim (70.000 - 90.000) dikkate alınmadan durulmuştur.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: md. 16
    alinti: 'Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal
      tablolara yansıtılan maliyetlere örnek olarak verilebilir: (a) Normalin üstünde gerçekleşen; hammadde fire
      ve kayıpları, işçilik ve diğer üretim maliyetleri, (b) Üretim sürecinde bir sonraki üretim aşamasından önce
      gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut konumuna ve durumuna getirilmesinde
      katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.'
  - &id001
    mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-e) Satışların Maliyeti Tablosu — E kalemi
    alinti: 'E _ Mamül Stoklarında Değişim : Direkt ilk madde ve malzeme, direkt işçilik, genel üretim giderleri
      ve yarı mamül kullanım tutarlarının toplamı üretim maliyetini verir. Dönem başı mamül stoku ile dönem sonu
      mamül stoku arasındaki farkı ifade eden mamül stok farkının üretim maliyetine eklenmesiyle satılan mamülün
      maliyetine ulaşılır.'
  dogrulama:
    python: 'dimm = 40000 + 260000 - 60000

      donem_uretim = dimm + 180000 + 120000

      uretilen = donem_uretim + 30000 - 50000

      sonuc = uretilen + 70000 - 90000

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: MSUGT Ek-4 Satışların Maliyeti Tablosu (E kalemi) kaynak satırına birebir alıntı eklendi.
    neden: 'G6 (küçük): MSUGT kaynak satırında alıntı boştu.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: E (güven 5); B: E (güven 5)'
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
- id: SMMM-MAL-TBL-0002
  sinav: smmm
  bolum:
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: TBL
  kazanim: Zincirleme dönem tabloları ve geri hesap (yarı mamul stoku)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'BX İşletmesi''nin Ocak ayı verileri şöyledir: direkt ilk madde ve malzeme gideri 200.000 ₺, direkt işçilik
    giderleri 120.000 ₺, genel üretim giderleri 80.000 ₺, ay başı yarı mamul stoku 40.000 ₺, üretilen mamul maliyeti
    380.000 ₺, ay başı mamul stoku 50.000 ₺, satılan mamul maliyeti 360.000 ₺. Şubat ayı verileri ise şöyledir:
    direkt ilk madde ve malzeme gideri 220.000 ₺, direkt işçilik giderleri 130.000 ₺, genel üretim giderleri 90.000
    ₺, genel yönetim giderleri 30.000 ₺, ay sonu mamul stoku 40.000 ₺, satılan mamul maliyeti 450.000 ₺. Ocak ayı
    sonu stokları Şubat ayının başlangıç stoklarıdır. KDV dikkate alınmayacaktır. Buna göre BX İşletmesi''nin Şubat
    ayı sonu yarı mamul stoku kaç ₺''dir?'
  secenekler:
    A: '40.000'
    B: '50.000'
    C: '60.000'
    D: '80.000'
    E: '110.000'
  dogru: D
  aciklama:
    dogru_neden: 'Önce Ocak ayı sonu stokları bulunur: Ocak sonu yarı mamul 40.000 + 400.000 - 380.000 = 60.000
      ₺, Ocak sonu mamul 50.000 + 380.000 - 360.000 = 70.000 ₺. Bunlar Şubat''ın başlangıç stoklarıdır. Şubat üretilen
      mamul maliyeti satılan mamul maliyetinden geri hesapla 450.000 + 40.000 - 70.000 = 420.000 ₺''dir. Şubat dönem
      üretim maliyeti 440.000 ₺ olduğundan (genel yönetim gideri TMS 2 md. 16(c) uyarınca maliyete girmez) Şubat
      sonu yarı mamul stoku 60.000 + 440.000 - 420.000 = 80.000 ₺''dir. Zorluk (3) kaynakları: geri hesap (üretilen
      mamul maliyeti satılan mamul maliyetinden bulunur), iki aylık zincirleme çok adımlı hesap ve gereksiz veri.
      Tuzak, Şubat başı stokları Ocak sonu yerine Ocak başı tutarlarla almak ve maliyete girmeyen genel yönetim
      giderini (30.000 ₺) dönem üretim maliyetine eklemektir.'
    hesap_adimlari:
    - 'Ocak dönem üretim maliyeti: 200.000 + 120.000 + 80.000 = 400.000 ₺'
    - 'Ocak sonu yarı mamul: 40.000 + 400.000 - 380.000 = 60.000 ₺'
    - 'Ocak sonu mamul: 50.000 + 380.000 - 360.000 = 70.000 ₺'
    - 'Şubat dönem üretim maliyeti: 220.000 + 130.000 + 90.000 = 440.000 ₺ (genel yönetim gideri hariç)'
    - 'Şubat üretilen mamul maliyeti: 450.000 + 40.000 - 70.000 = 420.000 ₺'
    - 'Şubat sonu yarı mamul: 60.000 + 440.000 - 420.000 = 80.000 ₺'
    celdiriciler:
      A: 40.000 ₺, Şubat başı yarı mamul ve mamul stokları olarak Ocak ayının başlangıç stokları (40.000 ve 50.000)
        alındığında bulunur; zincirleme tabloda Şubat başı stok, Ocak sonu stoktur.
      B: 50.000 ₺, Şubat mamul stokları yok sayılıp üretilen mamul maliyeti satılan mamul maliyetine (450.000) eşit
        alındığında bulunur.
      C: 60.000 ₺, Şubat başı stoklardan yalnızca birinde Ocak başı tutar kullanıldığında (yarı mamulde 40.000 ya
        da mamulde 50.000) bulunur; ayrıca Ocak sonu yarı mamul stokuna eşittir.
      E: 110.000 ₺, genel yönetim giderlerinin (30.000) Şubat dönem üretim maliyetine katılmasıyla bulunur; bu gider
        dönem gideridir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: md. 16(c)
    alinti: (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri,
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-e) Satışların Maliyeti Tablosu — D ve E kalemleri
    alinti: 'D _ Yarı Mamül Stoklarında Değişim : Henüz mamül haline gelmemiş fakat ilk madde ve malzeme ile işçilik
      ve genel üretim giderlerinden pay almış, üretim aşamasındaki maddelerin dönem başı stoku ile dönem sonu stoku
      arasındaki fark bu grupta yer alır.'
  - *id001
  dogrulama:
    python: 'ocak_ym_sonu = 40000 + (200000 + 120000 + 80000) - 380000

      ocak_mamul_sonu = 50000 + 380000 - 360000

      subat_dum = 220000 + 130000 + 90000

      subat_umm = 450000 + 40000 - ocak_mamul_sonu

      sonuc = ocak_ym_sonu + subat_dum - subat_umm

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: MSUGT Ek-4 Satışların Maliyeti Tablosu kaynak satırı D ve E kalemleri olarak ikiye bölündü ve her birine
      birebir alıntı eklendi.
    neden: 'G6 (küçük): MSUGT kaynak satırında alıntı boştu.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: D (güven 5); B: D (güven 5)'
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday yanlış (güven 3)
- id: SMMM-MAL-TBL-0003
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: TBL
  kazanim: Satılan ticari mal maliyeti
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'CK İşletmesi''nin dönemine ait bilgiler şöyledir: dönem başı ticari mal stoku 80.000 ₺, ticari mal alışları
    400.000 ₺, alış iadeleri 20.000 ₺, alış iskontoları 10.000 ₺, alışlara ilişkin nakliye giderleri 15.000 ₺, satış
    iskontoları 25.000 ₺, dönem sonu ticari mal stoku 90.000 ₺. KDV dikkate alınmayacaktır. Buna göre CK İşletmesi''nin
    satılan ticari mal maliyeti kaç ₺''dir?'
  secenekler:
    A: '350.000'
    B: '360.000'
    C: '375.000'
    D: '405.000'
    E: '435.000'
  dogru: C
  aciklama:
    dogru_neden: TMS 2 md. 11'e göre satın alma maliyeti, edinimle doğrudan ilişkili taşıma maliyetlerini içerir;
      iskontolar ve benzeri kalemler indirilir. Net alışlar 400.000 - 20.000 - 10.000 + 15.000 = 385.000 ₺'dir.
      Satılan ticari mal maliyeti 80.000 + 385.000 - 90.000 = 375.000 ₺'dir. MSUGT Ek-4 gelir tablosu düzeninde
      satış iskontoları B Satış İndirimleri grubunda yer alır ve net satışları azaltır; satılan ticari mallar maliyeti
      ise C Satışların Maliyeti grubundadır. Bu nedenle satış iskontoları satışların maliyetini etkilemez.
    hesap_adimlari:
    - 'Net alışlar: 400.000 - 20.000 - 10.000 + 15.000 = 385.000 ₺'
    - 'Satışa hazır ticari mal: 80.000 + 385.000 = 465.000 ₺'
    - 'Satılan ticari mal maliyeti: 465.000 - 90.000 = 375.000 ₺'
    celdiriciler:
      A: 350.000 ₺, satış iskontolarının (25.000) da maliyetten düşülmesiyle bulunur; satış iskontosu brüt satışlardan
        indirilir, satılan malın maliyetini etkilemez.
      B: 360.000 ₺, alışlara ilişkin nakliye giderinin (15.000) maliyete eklenmemesiyle bulunur; TMS 2 md. 11'e
        göre taşıma maliyeti satın alma maliyetine dâhildir.
      D: 405.000 ₺, alış iadeleri ve alış iskontolarının (20.000 + 10.000) alışlardan düşülmemesiyle bulunur.
      E: 435.000 ₺, alış iadeleri ve alış iskontolarının alışlara eklenmesiyle (ters işaret) bulunur.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: md. 11
    alinti: Stokların satın alma maliyetleri; satın alma fiyatı, ithalat vergileri ve diğer vergiler (işletme tarafından
      daha sonra vergi idaresinden iade alınabilecekler hariç) ile mamul, malzeme ve hizmetlerin edinimiyle doğrudan
      ilişkilendirilebilen taşıma, yükleme-boşaltma ve diğer maliyetleri içerir. Ticari iskontolar, indirimler ve
      diğer benzer kalemler satın alma maliyetleri belirlenirken indirim konusu yapılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-e) Satışların Maliyeti Tablosu
    alinti: Gelir tablosundaki satışların maliyeti kısmı işletmenin dönem içindeki stok hareketleri ile satılan
      mamül, ilk madde ve malzeme ile ticari mal gibi maddelerin ve satılan hizmetlerin maliyetini göstermek üzere
      ayrı bir tablo halinde düzenlenir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-d) Gelir tablosu kalemleri — B Satış İndirimleri, C Satışların Maliyeti
    alinti: B _ SATIŞ İNDİRİMLERİ (-) 1. SATIŞTAN İADELER (-) 2. SATIŞ İSKONTOLARI (-) 3. DİĞER İNDİRİMLER (-) NET
      SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-)
  dogrulama:
    python: 'net_alis = 400000 - 20000 - 10000 + 15000

      sonuc = 80000 + net_alis - 90000

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: Zorluk 1 → 2; MSUGT Ek-4 Satışların Maliyeti Tablosu kaynak satırına birebir alıntı eklendi; satış iskontosunun
      net satışları etkilediği iddiası için Ek-4 gelir tablosu düzeninden alıntı eklendi ve dogru_neden'e işlendi.
    neden: 'G5 (küçük): net alış düzeltmesi + gereksiz veri + tuzak çeldirici birlikte, §7''ye göre orta (2); G6
      (küçük): MSUGT kaynak satırında alıntı boştu.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
