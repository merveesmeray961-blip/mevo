    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 4
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: MSUGT Ek-4 Satışların Maliyeti Tablosu kaynak satırı D ve E kalemleri olarak ikiye bölündü ve her birine birebir alıntı
      eklendi.
    neden: 'G6 (küçük): MSUGT kaynak satırında alıntı boştu.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS 2 atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic TMS 2'nin RG'de yeniden yayım tarihine (2018-05-24)
