      satışları etkilediği iddiası için Ek-4 gelir tablosu düzeninden alıntı eklendi ve dogru_neden'e işlendi.
    neden: 'G5 (küçük): net alış düzeltmesi + gereksiz veri + tuzak çeldirici birlikte, §7''ye göre orta (2); G6 (küçük):
      MSUGT kaynak satırında alıntı boştu.'
  - tarih: '2026-10-03'
