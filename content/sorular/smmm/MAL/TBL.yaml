- id: SMMM-MAL-TBL-0003
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet Muhasebesi
  konu: TBL
  kazanim: Satılan ticari mal maliyeti
  tip: hesaplama
  zorluk: 2
