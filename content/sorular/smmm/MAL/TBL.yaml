  kok: 'CK İşletmesi''nin dönemine ait bilgiler şöyledir: dönem başı ticari mal stoku 80.000 ₺, ticari mal alışları 400.000
    ₺, alış iadeleri 20.000 ₺, alış iskontoları 10.000 ₺, alışlara ilişkin nakliye giderleri 15.000 ₺, satış iskontoları 25.000
    ₺, dönem sonu ticari mal stoku 90.000 ₺. KDV dikkate alınmayacaktır. Buna göre CK İşletmesi''nin satılan ticari mal maliyeti
    kaç ₺''dir?'
  secenekler:
    A: '350.000'
    B: '360.000'
    C: '375.000'
    D: '405.000'
    E: '435.000'
  dogru: C
  aciklama:
    dogru_neden: TMS 2 par. 11'e göre satın alma maliyeti, edinimle doğrudan ilişkili taşıma maliyetlerini içerir; iskontolar
      ve benzeri kalemler indirilir. Net alışlar 400.000 - 20.000 - 10.000 + 15.000 = 385.000 ₺'dir. Satılan ticari mal maliyeti
      80.000 + 385.000 - 90.000 = 375.000 ₺'dir. MSUGT Ek-4 gelir tablosu düzeninde satış iskontoları B Satış İndirimleri
      grubunda yer alır ve net satışları azaltır; satılan ticari mallar maliyeti ise C Satışların Maliyeti grubundadır. Bu
      nedenle satış iskontoları satışların maliyetini etkilemez.
    hesap_adimlari:
    - 'Net alışlar: 400.000 - 20.000 - 10.000 + 15.000 = 385.000 ₺'
    - 'Satışa hazır ticari mal: 80.000 + 385.000 = 465.000 ₺'
    - 'Satılan ticari mal maliyeti: 465.000 - 90.000 = 375.000 ₺'
    celdiriciler:
      A: 350.000 ₺, satış iskontolarının (25.000) da maliyetten düşülmesiyle bulunur; satış iskontosu brüt satışlardan indirilir,
        satılan malın maliyetini etkilemez.
      B: 360.000 ₺, alışlara ilişkin nakliye giderinin (15.000) maliyete eklenmemesiyle bulunur; TMS 2 par. 11'e göre taşıma
        maliyeti satın alma maliyetine dâhildir.
      D: 405.000 ₺, alış iadeleri ve alış iskontolarının (20.000 + 10.000) alışlardan düşülmemesiyle bulunur.
      E: 435.000 ₺, alış iadeleri ve alış iskontolarının alışlara eklenmesiyle (ters işaret) bulunur.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 11
    alinti: Stokların satın alma maliyetleri; satın alma fiyatı, ithalat vergileri ve diğer vergiler (işletme tarafından daha
      sonra vergi idaresinden iade alınabilecekler hariç) ile mamul, malzeme ve hizmetlerin edinimiyle doğrudan ilişkilendirilebilen
      taşıma, yükleme-boşaltma ve diğer maliyetleri içerir. Ticari iskontolar, indirimler ve diğer benzer kalemler satın alma
      maliyetleri belirlenirken indirim konusu yapılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-e) Satışların Maliyeti Tablosu
    alinti: Gelir tablosundaki satışların maliyeti kısmı işletmenin dönem içindeki stok hareketleri ile satılan mamül, ilk
      madde ve malzeme ile ticari mal gibi maddelerin ve satılan hizmetlerin maliyetini göstermek üzere ayrı bir tablo halinde
      düzenlenir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1) — Ek-4 Mali Tabloların Düzenlenmesi ve Sunulması
    madde: A-2-d) Gelir tablosu kalemleri — B Satış İndirimleri, C Satışların Maliyeti
    alinti: B _ SATIŞ İNDİRİMLERİ (-) 1. SATIŞTAN İADELER (-) 2. SATIŞ İSKONTOLARI (-) 3. DİĞER İNDİRİMLER (-) NET SATIŞLAR
      C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-)
  dogrulama:
