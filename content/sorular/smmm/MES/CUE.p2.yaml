- id: SMMM-MES-CUE-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: CUE
  kazanim: Ticari faaliyet yasağı — bağımsız yönetim kurulu üyeliği istisnası ve hizmet verme yasağı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: Çalışanlar listesine kayıtlı serbest muhasebeci mali müşavir (SMMM) Ayhan, Mart 2026'da (Y) A.Ş.'nin bağımsız yönetim
    kurulu üyeliğine seçilmiştir. Ayhan, aynı zamanda ortaklarından biri olduğu (K) SMMM Mesleki Şirketi bünyesinde mesleki
    faaliyetini sürdürmektedir. (Z) Ltd. Şti., Y A.Ş.'nin iştirakidir. Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin
    Çalışma Usul ve Esasları Hakkında Yönetmelik'in ticari faaliyet yasağına ilişkin hükümlerine göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Bağımsız üyelik dahil yönetim kurulu üyeliği ticari faaliyet sayıldığından Ayhan bu görevi üstlenemez.
    B: Üstlenebilir; Y A.Ş.'ye ve iştiraki Z'ye hizmet veremez; K Mesleki Şirketi ve ortakları da Y A.Ş.'ye hizmet veremez.
    C: Görevi üstlenebilir ve Y A.Ş.'ye hizmet veremez; ancak iştiraki Z Ltd. Şti.'ne Kanunun 2 nci maddesindeki hizmetleri
      verebilir.
    D: Görevi üstlenebilir; hizmet verme yasağı Ayhan'a özgüdür, K Mesleki Şirketi ve diğer ortakları Y A.Ş.'ye hizmet verebilir.
    E: Aynı düzenleme bağımsız olmayan yönetim kurulu üyeliği için de geçerlidir; bu görev de ticari faaliyet sayılmaz.
  dogru: B
  aciklama:
    dogru_neden: 'Yönetmelik md. 43''e göre meslek mensupları anonim şirketlerin yönetim kurulu üyeliği ve başkanlığı görevinde
      bulunamaz; ancak 14/01/2026 tarihli değişiklikle anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet
      sayılmamıştır. Bu görevi üstlenen meslek mensupları, yönetim kurulu üyesi oldukları şirketlere ve bu şirketlerin doğrudan
      veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında hizmet veremez; mesleki şirketler
      ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim kurulu üyesi olduğu anonim şirketlere
      hizmet veremez. Dolayısıyla Ayhan hem Y A.Ş.''ye hem iştiraki Z Ltd. Şti.''ne hizmet veremez; K Mesleki Şirketi ve ortakları
      da Y A.Ş.''ye hizmet veremez. Püf noktaları: Genel kural yasaktır (anonim şirket yönetim kurulu üyeliği); istisna yalnızca
      bağımsız üyeliktir; istisnanın da bir bedeli vardır: şirkete ve iştiraklerine hizmet yasağı. Yasak yalnızca şahsa değil,
      şahsın ortağı olduğu mesleki şirkete ve o şirketin diğer ortaklarına da uzanır.'
    celdiriciler:
      A: Yönetmeliğin 14/01/2026 tarihli değişikliğine göre anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet
        sayılmaz; bu görev üstlenilebilir.
      C: Hizmet verme yasağı, yönetim kurulu üyesi olunan şirketin yanında doğrudan veya dolaylı hissedarı ya da iştiraki
        olduğu şirketleri de kapsar. Z Ltd. Şti. Y A.Ş.'nin iştiraki olduğundan Y A.Ş. Z Ltd. Şti.'nin doğrudan hissedarıdır;
        Z Ltd. Şti. bu nedenle yasak kapsamındadır.
      D: Mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim kurulu üyesi
        oldukları anonim şirketlere hizmet veremez; yasak yalnızca Ayhan'a özgü değildir.
      E: İstisna yalnızca bağımsız yönetim kurulu üyeliği için getirilmiştir; bağımsız olmayan yönetim kurulu üyeliği md.
        43'e göre yasaktır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, birinci fıkra (beşinci cümle)
    alinti: (Değişik cümle:R.G.14/01/2026-33137) Limited şirketlerde müdürlük, anonim şirketlerin yönetim kurulu üyeliği ve
      başkanlığı görevinde bulunamazlar.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, ikinci fıkra (birinci ve ikinci cümle)
    alinti: '(Ek fıkra: R.G.14/01/2026-33137) Anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz.
      Şu kadar ki, bu kapsamda görev alacak meslek mensupları, yönetim kurulu üyesi olacakları şirketlere ve bu şirketlerin
      doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında hizmet veremezler.'
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, ikinci fıkra (üçüncü cümle)
    alinti: Mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim kurulu
      üyesi oldukları anonim şirketlere hizmet veremezler.
  gecerlilik:
    baslangic: '2026-01-14'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: Kökte ''2026 yılında'' → ''Mart 2026''da''; kaynak atıfları md. 43/1 beşinci cümle, md. 43/2 birinci-ikinci
      ve üçüncü cümle olarak düzeltildi; C çeldiricisinde Z''nin kapsama giriş yolu (Y''nin doğrudan hissedar olması) açık
      yazıldı. gecerlilik.baslangic 2026-01-14 doğrulandı (değişiklik yönetmeliği md. 7: yayımı tarihinde yürürlüğe girer;
      RG 14.01.2026/33137, ISMMMO RG sureti).'
    neden: 'G5/G6: ''2026 yılında'' 1-13 Ocak 2026''yı (değişiklikten önce) da kapsıyordu (örtük varsayım); md. 43 tek fıkradan
      oluşuyordu, değiştirilen cümle ''ikinci fıkra'' değil birinci fıkranın beşinci cümlesidir, ek fıkra ikinci fıkradır.'
  - tarih: '2026-10-18'
    kim: hakem
    ne: düzeltildi
    neden: R6
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): B (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R6'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: fıkra/cümle atıfları RG 14.01.2026/33137 md. 5 ile uyumlu; alıntılar birebir; yürürlük
          14.01.2026 teyitli.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (B, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
