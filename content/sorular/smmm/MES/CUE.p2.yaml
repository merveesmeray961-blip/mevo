- id: SMMM-MES-CUE-0002
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: CUE
  kazanim: Ticari faaliyet yasağı — bağımsız yönetim kurulu üyeliği istisnası ve hizmet verme yasağı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: Çalışanlar listesine kayıtlı serbest muhasebeci mali müşavir (SMMM) Ayhan, 2026 yılında (Y) A.Ş.'nin bağımsız
    yönetim kurulu üyeliğine seçilmiştir. Ayhan, aynı zamanda ortaklarından biri olduğu (K) SMMM Mesleki Şirketi
    bünyesinde mesleki faaliyetini sürdürmektedir. (Z) Ltd. Şti., Y A.Ş.'nin iştirakidir. Serbest Muhasebeci Mali
    Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik'in ticari faaliyet yasağına
    ilişkin hükümlerine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Anonim şirketlerde yönetim kurulu üyeliği, bağımsız üyelik dahil, ticari faaliyet sayıldığından Ayhan bu
      görevi üstlenemez.
    B: Ayhan bu görevi üstlenebilir; ancak Y A.Ş.'ye ve iştiraki Z Ltd. Şti.'ne Kanunun 2 nci maddesi kapsamında
      hizmet veremez; K Mesleki Şirketi ve ortakları da Y A.Ş.'ye hizmet veremez.
    C: Ayhan bu görevi üstlenebilir ve Y A.Ş.'ye hizmet veremez, ancak Y A.Ş.'nin iştiraki Z Ltd. Şti.'ne Kanunun
      2 nci maddesi kapsamındaki hizmetleri verebilir.
    D: Ayhan bu görevi üstlenebilir; hizmet verme yasağı yalnızca Ayhan için geçerlidir, K Mesleki Şirketi ve diğer
      ortakları Y A.Ş.'ye hizmet verebilir.
    E: Aynı düzenleme bağımsız olmayan yönetim kurulu üyeliği için de geçerlidir; bu görev de ticari faaliyet sayılmaz
      ve yalnızca hizmet verme yasağı doğurur.
  dogru: B
  aciklama:
    dogru_neden: 'Yönetmelik md. 43''e göre meslek mensupları anonim şirketlerin yönetim kurulu üyeliği ve başkanlığı
      görevinde bulunamaz; ancak 14/01/2026 tarihli değişiklikle anonim şirketlerde bağımsız yönetim kurulu üyeliği
      ticari faaliyet sayılmamıştır. Bu görevi üstlenen meslek mensupları, yönetim kurulu üyesi oldukları şirketlere
      ve bu şirketlerin doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında
      hizmet veremez; mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız
      yönetim kurulu üyesi olduğu anonim şirketlere hizmet veremez. Dolayısıyla Ayhan hem Y A.Ş.''ye hem iştiraki
      Z Ltd. Şti.''ne hizmet veremez; K Mesleki Şirketi ve ortakları da Y A.Ş.''ye hizmet veremez. Püf noktaları:
      Genel kural yasaktır (anonim şirket yönetim kurulu üyeliği); istisna yalnızca bağımsız üyeliktir; istisnanın
      da bir bedeli vardır: şirkete ve iştiraklerine hizmet yasağı. Yasak yalnızca şahsa değil, şahsın ortağı olduğu
      mesleki şirkete ve o şirketin diğer ortaklarına da uzanır.'
    celdiriciler:
      A: Yönetmeliğin 14/01/2026 tarihli değişikliğine göre anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari
        faaliyet sayılmaz; bu görev üstlenilebilir.
      C: Hizmet verme yasağı, yönetim kurulu üyesi olunan şirketin yanında doğrudan veya dolaylı hissedarı ya da
        iştiraki olduğu şirketleri de kapsar; Z Ltd. Şti. Y A.Ş.'nin iştirakidir.
      D: Mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim
        kurulu üyesi oldukları anonim şirketlere hizmet veremez; yasak yalnızca Ayhan'a özgü değildir.
      E: İstisna yalnızca bağımsız yönetim kurulu üyeliği için getirilmiştir; bağımsız olmayan yönetim kurulu üyeliği
        md. 43'e göre yasaktır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, ikinci fıkra (son cümle)
    alinti: (Değişik cümle:R.G.14/01/2026-33137) Limited şirketlerde müdürlük, anonim şirketlerin yönetim kurulu
      üyeliği ve başkanlığı görevinde bulunamazlar.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, ek fıkra
    alinti: '(Ek fıkra: R.G.14/01/2026-33137) Anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet
      sayılmaz. Şu kadar ki, bu kapsamda görev alacak meslek mensupları, yönetim kurulu üyesi olacakları şirketlere
      ve bu şirketlerin doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında
      hizmet veremezler.'
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43, ek fıkra (mesleki şirketler)
    alinti: Mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim
      kurulu üyesi oldukları anonim şirketlere hizmet veremezler.
