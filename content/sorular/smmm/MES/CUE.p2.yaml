- id: SMMM-MES-CUE-0003
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: CUE
  kazanim: Sözleşme — zorunlu haller, fesih ve defter-belge iadesi
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: 'Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik''e
    göre meslek mensupları ile iş sahipleri arasındaki sözleşmelere ve defter ve belgelerin iadesine ilişkin aşağıdaki
    ifadelerden hangileri doğrudur?


    I. Mesleki konularda yapılacak her türlü iş için, işin niteliği ne olursa olsun sözleşme yapılması zorunludur.


    II. Taraflar haklı nedenlerle veya karşılıklı rızaları ile sözleşmeyi feshederlerse, alınmış olan defter ve
    belgeler bir ay içinde devir teslim tutanağı düzenlenmek suretiyle sahiplerine geri verilir.


    III. İşin bitiminden itibaren bir ay içinde sahipleri tarafından alınmayan defter ve belgeler, bir yazı ile
    ilgililerin bağlı olduğu vergi dairesine teslim edilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'I numaralı ifade yanlıştır: md. 24''e göre taraflar mesleki konularda yapılacak işler için sözleşme
      yapabilirler; sözleşme yapılması yalnızca defter tutmak, süreklilik arz eden müşavirlik hizmeti, inceleme-tahlil-denetim
      ve bunlarla ilgili rapor düzenlemek ile yeminli mali müşavirlerin tasdik işlemlerinde zorunludur. II numaralı
      ifade md. 26''ya, III numaralı ifade md. 27''ye uygundur. Doğru ifadeler II ve III''tür.'
    celdiriciler:
      A: I numaralı ifade yanlıştır; sözleşme yapılması her iş için değil, md. 24'te sayılan çalışma konularında
        zorunludur. II ve III ise doğrudur.
      B: II numaralı ifade md. 26'ya uygun olduğundan doğrudur; ancak III numaralı ifade de md. 27'ye uygundur,
        dolayısıyla yalnız II eksik bir cevaptır.
      C: I numaralı ifade md. 24'e aykırıdır; sözleşme her işte zorunlu değildir. III numaralı ifade ise doğru olduğu
        hâlde bu şıkta yer almamıştır.
      E: I numaralı ifade md. 24'e aykırıdır; sözleşme yapılması yalnızca sayılan çalışma konularında zorunludur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 24
    alinti: Taraflar, mesleki konularda yapılacak işler için sözleşme yapabilirler. Aşağıdaki çalışma konularında
      sözleşme yapılması zorunludur. a) Defter tutmak, b) Süreklilik arz eden müşavirlik hizmetinde, c) İnceleme,
      tahlil ve denetim yapmak ve bunlarla ilgili, rapor ve benzerlerini düzenlemek, d) Yeminli Mali Müşavirlerin
      tasdik işlemleri.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 26, ikinci fıkra
    alinti: Taraflar haklı nedenlerle veya karşılıklı rızaları ile aralarındaki sözleşmeyi her zaman feshedebilirler.
      Bu takdirde alınmış olan defter ve belgeler bir ay içinde devir teslim tutanağı düzenlenmek suretiyle sahiplerine
      geri verilir.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 27
    alinti: İşin bitiminden itibaren bir ay içinde sahipleri tarafından alınmayan defter ve belgeler bir yazı ile
      ilgililerin bağlı olduğu vergi dairesine teslim edilir.
