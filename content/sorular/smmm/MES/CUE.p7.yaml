      yer alması zorunludur; ayrıca Yönetmelikte belirlenenler dışında yabancı dilde ifadeler kullanılamaz. Püf noktaları:
      Tabelanın ihtiyari olması, asıldığında içerik kurallarının olmadığı anlamına gelmez.'
    celdiriciler:
      A: Tabela asılması ihtiyaridir; zorunlu değildir. Ayrıca birlikte çalışma hâlinde ad ve soyadların yer alması ortaklık
