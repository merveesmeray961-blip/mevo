    ve denetim hizmeti için de sözleşme düzenlenmemiştir. Yönetmeliğe göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki hizmet için de sözleşme zorunlu değildir.
    B: Yalnız süreklilik arz eden müşavirlik hizmetinde sözleşme zorunludur.
    C: Yalnız inceleme, tahlil ve denetim hizmetinde sözleşme zorunludur.
    D: Her iki çalışma konusunda da sözleşme yapılması zorunludur.
