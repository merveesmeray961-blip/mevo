    ortaklık kurulmadığı için B’nin adının tabelada hiç yer almamasını istemektedir. Ayrıca tabelaya yabancı dilde bir slogan
    eklenmesi planlanmaktadır. Yönetmeliğe göre aşağıdakilerden hangisi **doğrudur**?
