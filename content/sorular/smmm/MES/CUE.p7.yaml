- id: SMMM-MES-CUE-0010
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: büro ve tabela
  tip: bilgi
  zorluk: 1
  kok: Çalışma Usul ve Esasları Yönetmeliği'ne göre meslek mensuplarınca tabela asılması hakkında aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Tabela asılması zorunludur.
    B: Tabela asılması ihtiyaridir; asılması halinde tabelada oda ve Birlik amblemi, meslek unvanı ile ad-soyad, adres, telefon,
      internet ve e-posta yer alabilir; ışıklı tabela kullanılamaz; mavi zemin üzerine beyaz yazılı olmalı ve Mm logosu kullanılmalıdır.
    C: Tabela bina cephesine asılabilir ve ışıklı olabilir.
    D: Tabelada yabancı dil ifadeler serbestçe kullanılabilir.
    E: Tabela asılması yasaktır.
  dogru: B
  aciklama:
    dogru_neden: Yönetmelik md. 15, tabela asılmasının ihtiyari olduğunu; asılması halinde içerik, yer, renk, logo ve ışıklı
      tabela yasağını düzenler.
    celdiriciler:
      A: İhtiyaridir, zorunlu değildir.
      C: Bina cephesine ve ışıklı tabela yasaktır.
      D: Yabancı dil ifadeler yasaktır.
      E: İhtiyaridir, yasak değildir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 15
    alinti: Meslek mensuplarınca tabela asılması ihtiyaridir. Tabela asılması halinde; a) Tabelalarda; oda ve Birlik amblemi,
      meslek unvanı ile ad ve soyadı, ortaklık bürosu unvanı, şirket ise şirket unvanı varsa akademik unvanı, büronun adresi,
      telefon numarası, internet adresi ile elektronik posta adresi yer alabilir. Tabelada bu Yönetmelikte belirlenenlerin
      dışında unvan, deyim, yabancı dillerde yazılmış ifadeler ile sair şekiller, işaret, resim, fotoğraf ve benzerlerine
      yer verilemez. ... c) Tabela, büronun bulunduğu binanın giriş kapısının yanına, giriş holü veya koridoruna ya da büro
      giriş kapılarının yanına asılabilir. Bina cephelerine, büro balkonu ve pencerelerine birden fazla tabela asılamaz, benzeri
