- id: SMMM-MES-CUE-0005
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: ticari faaliyet yasağı
  tip: uygulama
  zorluk: 2
  kok: Bir meslek mensubu anonim şirkette bağımsız yönetim kurulu üyesi olmak istemekte ve aynı zamanda bu şirketin iştiraki
    olan bir şirkete Kanunun 2 nci maddesi kapsamındaki hizmetleri vermeyi planlamaktadır. 14/01/2026 tarihli değişiklik dikkate
    alındığında aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Bağımsız yönetim kurulu üyeliği ticari faaliyettir ve hiçbir durumda üstlenilemez.
    B: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz; ancak meslek mensubu, üyesi olduğu şirketin iştiraki olan
      şirkete Kanunun 2 nci maddesi kapsamında hizmet veremez.
    C: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz ve iştiraklere hizmet verme yasağı yoktur.
    D: Yasak yalnız yönetim kurulu üyesi olunan şirkete hizmet vermeyi kapsar; iştiraklere uygulanmaz.
    E: Bağımsız yönetim kurulu üyeliği yalnız YMM'ler için ticari faaliyet sayılmaz.
  dogru: B
  aciklama:
    dogru_neden: 'Çalışma Usul ve Esasları Hakkında Yönetmelik md. 43''ün 14/01/2026 tarihli değişikliğiyle anonim şirketlerde
      bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmamıştır. Ancak bu görevi üstlenen meslek mensubu, yönetim kurulu
      üyesi olacağı şirketlere ve bunların doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci
      maddesi kapsamında hizmet veremez. Püf noktaları: İstisna yalnız görevin ticari faaliyet sayılmamasına ilişkindir; hizmet
      yasağını ortadan kaldırmaz ve iştirakleri de kapsar.'
    celdiriciler:
      A: 2026 değişikliği bağımsız yönetim kurulu üyeliğini ticari faaliyet saymayan bir istisna getirmiştir.
      C: İştiraklere hizmet yasağı md. 43/2'de açıkça yer alır.
      D: Yasak yalnız yönetim kurulu üyesi olunan şirketle sınırlı değildir; doğrudan veya dolaylı hissedarı ya da iştiraki
        olunan şirketleri de kapsar.
      E: Düzenleme meslek mensuplarına yöneliktir; yalnız YMM'lere özgü bir istisna değildir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43/2
    alinti: '(Ek fıkra: R.G.14/01/2026-33137) Anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz.
      Şu kadar ki, bu kapsamda görev alacak meslek mensupları, yönetim kurulu üyesi olacakları şirketlere ve bu şirketlerin
      doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında hizmet veremezler.'
