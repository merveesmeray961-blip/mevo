- id: SMMM-MES-CUE-0020
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: ticari faaliyet yasağı
  tip: uygulama
  zorluk: 1
  kok: 2026 yılında bir meslek mensubu anonim şirkette bağımsız yönetim kurulu üyesi olmayı planlamaktadır. Çalışma
    Usul ve Esasları Hakkında Yönetmelik'in güncel hükmüne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayıldığından anonim şirketlerde de yasaktır.
    B: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz; ancak üyesi olunan şirkete Kanunun 2 nci maddesi
      kapsamında hizmet verilemez.
    C: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz; üyesi olunan şirkete hizmet verilmesi de serbesttir.
    D: Anonim şirketlerde yönetim kurulu üyeliği ve başkanlığı serbesttir; bağımsız üyelik ise ticari faaliyet sayıldığından
      yasaktır.
    E: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz; limited şirketlerde müdürlük görevi de aynı kapsamda
      serbesttir.
  dogru: B
  aciklama:
    dogru_neden: Md. 43'e 14/01/2026 tarihli değişiklikle eklenen fıkra uyarınca anonim şirketlerde bağımsız yönetim
      kurulu üyeliği ticari faaliyet sayılmaz. Şu kadar ki, bu görevi alan meslek mensupları üyesi oldukları şirkete
      ve bu şirketin doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında
      hizmet veremezler.
    celdiriciler:
      A: 2026 değişikliğiyle anonim şirketlerde bağımsız yönetim kurulu üyeliğinin ticari faaliyet sayılmayacağı
        açıkça düzenlenmiştir (md. 43).
      C: Üyesi olunan şirkete ve onun hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında
        hizmet verilmesi yasaklanmıştır.
      D: Anonim şirketlerde yönetim kurulu üyeliği ve başkanlığı yasaktır; ticari faaliyet sayılmayan istisna bağımsız
        üyeliğe ilişkindir.
      E: Limited şirketlerde müdürlük görevi md. 43 uyarınca yasaktır; istisna anonim şirketlerdeki bağımsız yönetim
        kurulu üyeliğine ilişkindir.
