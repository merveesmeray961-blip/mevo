- id: SMMM-MES-CUE-0008
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: büro ve tabela
  tip: uygulama
  zorluk: 3
  kok: Bir SMMM yeni bürosunu açmış ve odaya kayıt olmuştur. Büro Tescil Belgesi'ni altıncı ayda almış, tabelasına da kendi
    adı, meslek unvanı, büro adresi ve telefonunu yazmıştır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Büro Tescil Belgesi üç ay içinde alınmak zorunda olduğundan belge geç alınmıştır; tabela ise her durumda yasaktır.
    B: Büro Tescil Belgesi iki yıl içinde alınır; tabela asılması zorunludur.
    C: Büro Tescil Belgesi odaya kayıttan itibaren üç ay içinde alınmalıydı; tabela asılması ise ihtiyaridir ve belirtilen
      bilgiler kullanılabilir.
    D: Büro Tescil Belgesi yalnız vergi dairesinden alınır; tabela için hiçbir sınırlama yoktur.
    E: Büro Tescil Belgesi beş yıl geçerlidir; tabelada yalnız ad ve soyadı bulunabilir.
  dogru: C
  aciklama:
    dogru_neden: Yönetmeliğe göre büro edinen meslek mensubu odaya kayıt olduktan itibaren üç ay içinde Büro Tescil Belgesi
      almak zorundadır ve belge iki yılda bir vize edilir. Tabela asılması ise ihtiyaridir; tabela asılırsa Yönetmelikte sayılan
      bilgiler kullanılabilir ve bunun dışındaki unvan, ifade, işaret ve benzerlerine yer verilemez.
    celdiriciler:
      A: Tabela yasak değildir; md. 15'te açıkça ihtiyari olduğu düzenlenmiştir.
      B: Büro Tescil Belgesi için süre üç ay, iki yıl ise vize süresidir.
      D: Büro Tescil Belgesi odaca düzenlenir; tabela için de Yönetmelikte açık sınırlamalar vardır.
      E: Belgenin vize süresi iki yıldır; tabelada yalnız ad ve soyadı değil, Yönetmelikte sayılan başka bilgiler de yer alabilir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 14-15
    alinti: Büro edinen meslek mensupları odaya kayıt olduktan itibaren üç ay içinde Büro Tescil Belgesi almak zorundadırlar.
      Büro Tescil Belgeleri iki yılda bir vize ettirilir.
