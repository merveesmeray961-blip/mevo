- id: SMMM-MES-CUE-0004
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: bildirimler
  tip: uygulama
  zorluk: 3
  kok: Bir meslek mensubu, mesleki faaliyet sırasında öğrendiği bir sırrı açıklamayı planlamaktadır. Bilginin açıklanması
    için kanuni bir hak veya görev bulunmadığı, ancak bilginin adli yargıya göre suç teşkil eden bir duruma ilişkin olduğu
    kabul edilmiştir. Çalışma Usul ve Esasları Hakkında Yönetmelik'e göre aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Mesleki sır olduğu için hiçbir koşulda açıklanamaz.
    B: Meslek mensubu, yalnızca müşterinin yazılı izni varsa yetkili mercilere bildirim yapabilir.
    C: Suç teşkil eden hallerin yetkili mercilere duyurulması zorunludur; adli veya idari her türlü inceleme veya soruşturma
      da sır saklama hükmünün dışındadır.
    D: Bildirim zorunluluğu yalnızca mesleki faaliyete devam edildiği sürece geçerlidir.
    E: Adli inceleme sır saklama yükümlülüğünü değiştirmez; yalnız idari inceleme istisnadır.
  dogru: C
  aciklama:
    dogru_neden: 'Yönetmelik md. 7''ye göre meslek mensupları mesleki faaliyetleri nedeniyle öğrendikleri bilgi ve sırları
      ifşa edemez; ancak adli yargıya göre suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir. Aynı maddede
      adli veya idari her türlü inceleme veya soruşturmanın birinci fıkra hükmünün dışında olduğu belirtilmiştir. Püf noktaları:
      Genel kural sır saklamadır; suç teşkil eden haller ve adli/idari inceleme-soruşturma düzenlemede ayrıca ele alınır.'
    celdiriciler:
      A: Suç teşkil eden haller için yetkili mercilere duyurma zorunluluğu açıkça düzenlenmiştir.
      B: Düzenleme müşteri iznini şart koşmamaktadır; suç teşkil eden hallerin duyurulması mecburidir.
      D: Sır saklama hükmü mesleki faaliyetin sona ermesiyle ortadan kalkmaz; düzenleme aksine faaliyete son verilse bile
        sırların ifşa edilemeyeceğini belirtir.
      E: Adli inceleme de idari inceleme gibi birinci fıkra hükmünün dışındadır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 7
    alinti: Meslek mensupları ve bunların yanlarında çalışanlar mesleki faaliyetleri dolayısıyla öğrendikleri bilgi ve sırları
      mesleki faaliyetlerine son verseler bile ifşa edemezler, çeşitli kanunlarla muhbirlere tanınan hak ve menfaatlerden
      faydalanamazlar; ancak adli yargıya göre suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir.
  gecerlilik:
