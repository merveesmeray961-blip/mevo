- id: SMMM-MES-CUE-0012
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: Çalışma Usul ve Esasları — ticari faaliyet yasağı
  tip: uygulama
  zorluk: 3
  kok: Serbest muhasebeci mali müşavir (SMMM) Deniz, bir anonim şirketin bağımsız yönetim kurulu üyesidir. Şirketin iştiraki
    başka bir şirkettir ve Deniz'in ortağı olduğu bir mesleki şirket de bulunmaktadır. Deniz'in bağımsız yönetim kurulu üyesi
    olduğu anonim şirkete Kanunun 2 nci maddesi kapsamındaki hizmeti, iştirake aynı hizmeti ve ortağı olduğu mesleki şirketin
    bu anonim şirkete aynı hizmeti vermesi planlanmaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Deniz bağımsız yönetim kurulu üyesi olamayacağından bu hizmetlerin hiçbiri yapılamaz.
    B: Deniz şirkete hizmet verebilir; hizmet yasağı yalnızca iştirake uygulanır.
    C: Bağımsız yönetim kurulu üyeliği ticari faaliyet sayıldığından yalnızca mesleki şirketin hizmeti yasaktır.
    D: Deniz şirkete hizmet veremez; ancak iştirake ve mesleki şirkete hizmet verilebilir.
    E: Deniz, anonim şirkete ve iştirakine hizmet veremez; ortağı olduğu mesleki şirket ve ortakları da anonim şirkete hizmet
      veremez.
  dogru: E
  aciklama:
    dogru_neden: 'Yönetmeliğin md. 43''ündeki 14/01/2026 tarihli düzenlemeye göre bağımsız yönetim kurulu üyeliği ticari faaliyet
      sayılmaz. Ancak görev alan meslek mensubu yönetim kurulu üyesi olacağı şirkete ve bu şirketin doğrudan veya dolaylı
      hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında hizmet veremez; mesleki şirketler ve ortakları
      da bu anonim şirkete hizmet veremez. Püf noktaları: İstisna bağımsız üyeliği mümkün kılar; aynı hüküm hem şirkete/iştiraklerine
      hem de mesleki şirkete yönelik hizmet yasağı getirir.'
    celdiriciler:
      A: Bağımsız yönetim kurulu üyeliği md. 43'ün ikinci fıkrasında ticari faaliyet sayılmamıştır; bu nedenle Deniz bu görevi
        üstlenebilir.
      B: Hizmet yasağı yalnızca iştirake değil, yönetim kurulu üyesi olunacak anonim şirkete de uygulanır.
      C: İştirak de yasak kapsamındadır; ayrıca mesleki şirket ve ortakları anonim şirkete hizmet veremez.
      D: İstisna yalnızca bağımsız yönetim kurulu üyeliğini mümkün kılar; hizmet verme yasağı devam eder.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43/1 (son cümle)
    alinti: (Değişik cümle:R.G.14/01/2026-33137) Limited şirketlerde müdürlük, anonim şirketlerin yönetim kurulu üyeliği ve
      başkanlığı görevinde bulunamazlar.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43/2 (ilk iki cümle)
    alinti: '(Ek fıkra: R.G.14/01/2026-33137) Anonim şirketlerde bağımsız yönetim kurulu üyeliği ticari faaliyet sayılmaz.
      Şu kadar ki, bu kapsamda görev alacak meslek mensupları, yönetim kurulu üyesi olacakları şirketlere ve bu şirketlerin
      doğrudan veya dolaylı hissedarı ya da iştiraki olduğu şirketlere Kanunun 2 nci maddesi kapsamında hizmet veremezler.'
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43/2 (son cümle)
    alinti: Mesleki şirketler ve bu şirketlerin ortakları da şirket ortaklarından herhangi birinin bağımsız yönetim kurulu
      üyesi oldukları anonim şirketlere hizmet veremezler.
