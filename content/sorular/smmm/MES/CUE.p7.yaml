      B: İnceleme, tahlil ve denetim hizmeti de açıkça sözleşme yapılması zorunlu çalışma konusudur.
      C: Süreklilik arz eden müşavirlik hizmeti de açıkça zorunlu sözleşme kapsamındadır.
