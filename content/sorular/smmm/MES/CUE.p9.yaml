- id: SMMM-MES-CUE-0023
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Çalışma Usul ve Esasları
  konu: CUE
  kazanim: meslek onuru
  tip: kavrama
  zorluk: 3
  kok: Çalışma Usul ve Esasları Hakkında Yönetmelik'in meslekle ve meslek onuruyla bağdaşmayan haller ile ticari faaliyet
    yasağına ilişkin hükümleri birlikte değerlendirildiğinde aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Meslek mensubunun yanında çalıştırdığı kişilere karşı uygunsuz davranışlarda bulunması meslek onuruyla bağdaşmayan
      hallerden biridir.
    B: Meslek mensubunun Türk Ticaret Kanununa göre tacir sayılmasını gerektiren bir faaliyette bulunması, Madde 42'de sayılan
      meslek onuruyla bağdaşmayan hallerden biri olarak düzenlenmiştir.
    C: Meslek mensubunun kanunlara göre yapılması yasak olan işlerden herhangi birini yapması meslek onuruyla bağdaşmayan
      haldir.
    D: Meslek mensubunun aşırı içki ve kumar düşkünlüğü ile tanınması meslek onuruyla bağdaşmayan haller arasında sayılmıştır.
    E: Meslekî etik ve meslekî bağımsızlık kurallarının ihlal edilmesi meslek onuruyla bağdaşmayan hallerden biridir.
  dogru: B
  aciklama:
    dogru_neden: 'Madde 42''de meslek onuruyla bağdaşmayan haller ayrıca sayılmıştır; tacir veya esnaf sayılmayı gerektiren
      faaliyet yasağı ise Madde 43''te düzenlenmiştir. Püf noktaları: Yakın görünen iki hüküm farklı maddelerde ve farklı
      başlıklarda düzenlenmiştir.'
    celdiriciler:
      A: Madde 42/a bu davranışı açıkça meslek onuruyla bağdaşmayan hal saymaktadır.
      C: Madde 42/d kanunlara göre yapılması yasak olan işlerden herhangi birinin yapılmasını saymaktadır.
      D: Madde 42/b aşırı içki ve kumar düşkünlüğü ile tanınmayı saymaktadır.
      E: Madde 42/e meslekî etik ve meslekî bağımsızlık kurallarının ihlalini saymaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 42
    alinti: 'Madde 42 - Meslek mensuplarının aşağıda belirtilen davranışlarda

      bulunmaları meslekle ve meslek onuruyla bağdaşmayan hallerden

      sayılır.

      a) Yanında çalıştırdığı kişilere karşı uygunsuz davranışlarda bulunmak,

      b) Aşırı içki ve kumar düşkünlüğü ile tanınmak,

      c)   (Değişik:R.G.:21/11/2007-26707)     İlgili mevzuat     gereğince

      meslektaşlarına, müşterilerine ve kanunlara göre bilgi vermek zorunda

      olduğu kişi ve kuruluşlara bilgi vermemek veya kasten yanıltıcı bilgi

      vermek,


      d) Kanunlara göre yapılması yasak olan işlerden herhangi birini yapmak.'
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 43
    alinti: 'Madde 43 - Meslek mensupları, Türk Ticaret Kanununa göre (Tacir)

      veya (esnaf) sayılmalarını gerektirecek bir faaliyette bulunmazlar.

