  kok: Bir SMMM, bir komandit şirkette komanditer ortak olmayı ve aynı zamanda başka bir limited şirkette müdür olarak görev
    yapmayı planlamaktadır. Çalışma Usul ve Esasları Hakkında Yönetmelik'in ticari faaliyette bulunamama hükümlerine göre
    aşağıdakilerden hangisi doğrudur?
