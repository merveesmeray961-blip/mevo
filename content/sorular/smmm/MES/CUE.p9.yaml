    dogru_neden: Yönetmelik md. 43'te komandit şirketlerde komandite ortak olma yasaklanmış, komanditer ortaklık ayrıca yasaklanmamıştır.
      Aynı maddede limited şirketlerde müdürlük açıkça yasaklanmıştır. Bu nedenle D doğrudur.
    celdiriciler:
      A: Komandit şirkette yasaklanan ortaklık türü komandite ortaklıktır; komanditer ortaklık bu hükümde yasaklanmamıştır.
      B: Limited şirketlerde müdürlük açıkça yasaktır.
      C: Komanditer ortaklık yasak değildir; limited şirket müdürlüğü ise yasaktır.
      E: Yönetmelik bu ayrımı SMMM-YMM şeklinde yapmaz; yasak meslek mensuplarına uygulanır.
