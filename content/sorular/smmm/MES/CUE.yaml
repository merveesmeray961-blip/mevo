- id: SMMM-MES-CUE-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: CUE
  kazanim: Büro edinme zorunluluğu — bildirim, tescil ve vize süreleri, şube
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik'in
    büro edinme zorunluluğuna ilişkin hükümlerine göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: İşyeri açılış ve kapanışları en geç otuz gün içinde odaya bildirilir.
    B: Meslek mensupları ile kurdukları ortaklık büroları ve şirketler hiçbir şekilde irtibat bürosu açamaz.
    C: Büro edinen meslek mensubu, odaya kayıt olduktan itibaren üç ay içinde Büro Tescil Belgesi almak zorundadır.
    D: Büro Tescil Belgesi üç yılda bir vize ettirilir.
    E: Mesleki şirketin başka bir ilde açtığı şubeden sorumlu ortağın, şubenin bulunduğu ilde ikamet etmesi zorunludur.
  dogru: D
  aciklama:
    dogru_neden: Yönetmelik md. 14'e göre "Büro edinen meslek mensupları odaya kayıt olduktan itibaren üç ay içinde
      Büro Tescil Belgesi almak zorundadırlar. Büro Tescil Belgeleri iki yılda bir vize ettirilir." Vize süresi
      üç yıl değil iki yıldır; D şıkkı yanlıştır. Tuzak, tescil belgesinin alınma süresindeki "üç" sayısının vize
      süresine taşınmasıdır.
    celdiriciler:
      A: Doğrudur. md. 14/1'e 24/02/2025 tarihli değişiklikle eklenen hükme göre işyeri açılış ve kapanışları en
        geç otuz gün içerisinde odaya bildirilir.
      B: Doğrudur. md. 14/1'e göre meslek mensupları ve bunların kurdukları ortaklık büroları ve şirketler hiçbir
        şekilde irtibat bürosu açamazlar.
      C: Doğrudur. md. 14'e göre büro edinen meslek mensupları odaya kayıttan itibaren üç ay içinde Büro Tescil
        Belgesi almak zorundadır.
      E: Doğrudur. md. 14'e göre bir şirketin başka bir ilde şube açabilmesi o ildeki odanın çalışanlar listesine
        kayıtlı, temsil ve ilzama yetkili bir ortağın görevlendirilmesine bağlıdır ve şubeden sorumlu ortağın şubenin
        bulunduğu ilde ikamet etmesi zorunludur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 14/1
    alinti: Her meslek mensubu meslekî faaliyetine başlamadan önce bağlı olduğu oda bilgisinde iş yeri açmak zorundadır.
      (Ek:RG.:24/02/2025-32823) İşyeri açılış ve kapanışları en geç otuz gün içerisinde Odaya bildirilir. Meslek
      mensupları ve bunların kurdukları ortaklık büroları ve şirketler, hiçbir şekilde irtibat bürosu açamazlar.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 14 (yoklama ve Büro Tescil Belgesi)
    alinti: İşyeri açılışına ilişkin gerekli yoklama odalar tarafından yapılır. Vergi dairelerince mükellefiyet
      tesisinde oda sicil belgesi aranır. Büro edinen meslek mensupları odaya kayıt olduktan itibaren üç ay içinde
      Büro Tescil Belgesi almak zorundadırlar. Büro Tescil Belgeleri iki yılda bir vize ettirilir.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 14 (şube)
    alinti: Bir şirketin bir başka ilde şube açabilmesi, o ildeki ilgili meslek odasının çalışanlar listesine kayıtlı,
      şirketi temsil ve ilzama yetkili bir ortak görevlendirmesi hâlinde mümkündür. (Ek:RG.:24/02/2025-32823) Şubeden
      sorumlu olacak ortağın, şubenin bulunduğu ilde ikamet etmesi zorunludur.
