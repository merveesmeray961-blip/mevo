      ka)'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): A (güven 5)'
      G5:
        sonuc: kaldi
        tarih: '2026-10-18'
        not: 'R4: sınav düzeyinin altında / biçim hatası ( Ücretlerin Esasları Yön. md 7''ye uygun; ancak ''Geçici Kurul''
          fiilen ka)'
      G6:
