- id: SMMM-MES-DGR-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: Ücretlerin Esasları — ücret sözleşmesi, sürelere ilişkin kurallar
  tip: bilgi
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
    Yönetmelik''e göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Süreli ücret sözleşmelerinin en az bir yıllık olması şarttır.


    II. Ücret sözleşmesine, yapılan hizmet karşılığı meslek mensubuna ortaklık payı verileceğine dair hüküm konulabilir.


    III. İş sahibinin tebligat adresi değişirse, bu değişiklik en geç üç gün içinde iş sahibi tarafından taahhütlü
    mektupla meslek mensubuna bildirilmelidir.


    IV. Meslek mensubunun sözleşme şartlarına uymaması durumunda iş sahibinin sözleşmeyi feshedebilmesi için en
    az on beş gün önceden yazılı olarak haber vermesi gerekir.'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: III ve IV
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade md. 14/1''e, III numaralı ifade md. 23/2''ye uygundur. II numaralı ifade md.
      13/1''e aykırıdır: ücret sözleşmesine hizmet karşılığı ortaklık payı verileceğine dair hüküm konulamaz. IV
      numaralı ifade md. 19/3''e aykırıdır: sözleşme şartlarına uymayan meslek mensubuyla sözleşme bir hafta önceden
      yazılı haber verilerek feshedilir; on beş günlük bir asgari ihbar süresi aranmaz. Doğru ifadeler I ve III''tür.
      Püf noktaları: Bu soruda dört ayrı maddenin (md. 13, 14, 19, 23) süre ve şartları birlikte sorulmaktadır.
      Süreler birbirine karıştırılır: sözleşme süresi bir yıl, tebligat adresi bildirimi üç gün, fesih ihbarı bir
      hafta. II numaralı ifade, md. 13/1''in ikinci cümlesindeki açık yasağın tersidir; aynı fıkranın ilk cümlesi
      ücret sözleşmesinin yazılı yapılmasını ve belli bir meblağı kapsamasını şart koşar.'
    celdiriciler:
      A: II numaralı ifade yanlıştır; md. 13/1'e göre ücret sözleşmesine hizmet karşılığı ortaklık payı verileceğine
        dair hüküm konulamaz. III numaralı ifade doğru olduğu hâlde bu şıkta yoktur.
      B: IV numaralı ifade yanlıştır; md. 19/3'e göre fesih bir hafta önceden yazılı haber verilerek yapılır, en
        az on beş gün önceden haber verme şartı yoktur. III numaralı ifade doğru olduğu hâlde bu şıkta yoktur.
      C: II numaralı ifade md. 13/1'e aykırıdır; I numaralı ifade ise doğru olduğu hâlde bu şıkta yer almamıştır.
      D: IV numaralı ifade md. 19/3'e aykırıdır (süre bir haftadır); I numaralı ifade ise doğru olduğu hâlde bu
        şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 13/1
    alinti: Ücret sözleşmesine, yapılan hizmet karşılığı meslek mensubuna ortaklık payı verileceğine dair hüküm
      konulamaz.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 14/1
    alinti: Ücret sözleşmeleri münferit ya da süreli olarak yapılabilir. Süreli sözleşmelerin en az bir yıllık olması
      şarttır.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 19/3
    alinti: Keza, meslek mensubunun sözleşme şartlarına uymaması durumunda, bir hafta önceden yazılı olarak haber
      verilerek sözleşme fesh edilir ve iş başka bir meslek mensubuna devredilir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 23/2
    alinti: Adres değişiklikleri, en geç üç gün içinde, iş sahibi tarafından taahhütlü mektupla meslek mensubuna
      bildirilmelidir.
  gecerlilik:
    baslangic: '1990-01-02'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: IV numaralı öncül ''on beş gün önceden ... feshedebilir'' → ''feshedebilmesi için en
      az on beş gün önceden ... haber vermesi gerekir'' biçimine getirildi; dogru_neden''deki ''ücretin yalnızca
      belli bir meblağ olarak belirlenebileceği kuralı'' ifadesi md. 13/1 metnine göre düzeltildi; B çeldiricisi
      uyarlandı.'
    neden: 'G5: eski IV öncülü (on beş gün önceden haber vererek feshedebilir) bir haftalık ihbar süresini aştığı
      için lafzen doğru okunabiliyordu; ''yalnızca belli bir meblağ'' md. 9/2 ve md. 15''teki (''kural olarak'')
      istisnaları yok sayıyordu.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): E (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: IV artık kesin yanlış; I ve III doğru, tek doğru şık E.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Dört alıntı Ücretler Yönetmeliği md. 13, 14, 19, 23 metniyle birebir; dogru_neden md. 13/1'e uyumlu
          hâle getirildi.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday yanlış (D, güven 2)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-MES-DGR-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: Ücretlerin Esasları — asgari ücret tarifesinin hazırlanma takvimi
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
    Yönetmelik'e göre, bir yılın asgari ücret tarifesinin hazırlanmasına ilişkin takvim aşağıdakilerden hangisinde
    doğru olarak verilmiştir?
  secenekler:
    A: Odalar, tarifenin hazırlanmasına önceki yılın Ekim ayında başlar ve hazırladıkları yeni tarifeleri Kasım
      ayı sonuna kadar Geçici Kurul'a gönderir.
    B: Odalar, tarifenin hazırlanmasına önceki yılın Eylül ayında başlar ve hazırladıkları yeni tarifeleri Ekim
      ayı sonuna kadar Geçici Kurul'a gönderir.
    C: Odalar, tarifenin hazırlanmasına önceki yılın Eylül ayında başlar ve hazırladıkları yeni tarifeleri Kasım
      ayı sonuna kadar doğrudan Bakanlığa gönderir.
    D: Geçici Kurul, tarifeyi bütün ülke için tek tarife veya bölgelere göre birden çok tarife olarak düzenler ve
      Ekim ayı sonuna kadar Bakanlığa gönderir.
    E: Bir yılın tarifesi, o yılın Ocak ayında Resmî Gazete ile ilan olunur ve yeni tarife kesinleşinceye kadar
      eski tarife uygulanmaz.
  dogru: B
  aciklama:
    dogru_neden: 'Yönetmelik md. 7''ye göre bir yılın tarifesinin hazırlanmasına önceki yılın Eylül ayında odalarca
      başlanır ve odalar hazırladıkları yeni tarifeleri Ekim ayı sonuna kadar Geçici Kurul''a yollar. Geçici Kurul
      tarifeyi Kasım ayı sonuna kadar düzenleyip Bakanlığa gönderir; Bakanlık tasdik eder ve Resmî Gazete''de yayımlar.
      Not: Yönetmelik (1990) Kanunun geçici 4 üncü maddesi uyarınca kurulan Geçici Kurul''u anar; 3568 sayılı Kanunun
      46 ncı maddesine göre bugün oda yönetim kurulları tarifeleri Birliğe gönderir, Birlik yönetim kurulu tarifeleri
      hazırlayarak Bakanlığa gönderir ve Bakanlık tasdik eder. Soru, Yönetmelikteki takvimi sorar; ay sınırları
      (Eylül–Ekim sonu–Kasım sonu) yalnızca Yönetmelikte yer alır.'
    celdiriciler:
      A: Hazırlığa başlama ayı Ekim değil Eylül; odaların Geçici Kurul'a gönderme süresi de Kasım değil Ekim ayı
        sonudur (md. 7/1-2).
      C: Odalar tarifeleri doğrudan Bakanlığa değil, Ekim ayı sonuna kadar Geçici Kurul'a gönderir; Kasım ayı sonu
        Geçici Kurul'un Bakanlığa gönderme süresidir (md. 7/2-3).
      D: Geçici Kurul tarifeyi Ekim ayı sonuna kadar değil, Kasım ayı sonuna kadar Bakanlığa gönderir (md. 7/3).
      E: Tarife en geç önceki yılın Aralık ayının 20'sine kadar Resmî Gazete ile ilan olunur; ayrıca yeni tarife
        kesinleşinceye kadar eski tarife uygulanır (md. 5/2, md. 10/1).
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 7
    alinti: Bir yılın tarifesinin hazırlanmasına önceki yılın Eylül ayında odalarca başlanır. Odalar; hazırladıkları
      yeni tarifeleri Ekim ayı sonuna kadar Geçici Kurul’a yollarlar. Geçici Kurul, Kasım ayı sonuna kadar tarifeyi
      bütün ülke için bir tek ya da bölgelere göre birden çok tarife olarak düzenler ve Bakanlığa gönderir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 10/1
    alinti: Bir yıl sonra uygulanacak ücretlere ait tarife, en geç önceki yılın Aralık ayının 20’sine kadar Resmi
      Gazete ile ilan olunur.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 5/2
    alinti: Yeni tarife kesinleşinceye kadar eski tarife uygulanır.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 46/3-5
    alinti: Birlik yönetim kurulu, oda yönetim kurullarının tekliflerini de gözönüne almak suretiyle çeşitli odaları
      içine alacak grupları tespit ve gruplarda uygulanacak tarifeleri hazırlayarak Maliye Bakanlığına gönderir.
      Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder. Tarifeler Resmi Gazete'de
      yayımlanarak yürürlüğe girer.
  gecerlilik:
    baslangic: '1990-01-02'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden''e Yönetmelikteki ''Geçici Kurul'' ile Kanun md. 46''daki güncel süreç (oda
      → Birlik → Bakanlık) arasındaki farkı açıklayan not ve md. 46 alıntısı eklendi. Şık ve anahtar değişmedi.'
    neden: 'G5: ''Geçici Kurul'' 1990 tarihli geçiş dönemi organıdır; açıklama bunu belirtmeden takvimi güncel süreç
      gibi sunuyordu. md. 5/2 (Geçici Kurul ilan eder) ile md. 7/3 (Bakanlık RG''de yayımlar) arasındaki iç çelişki
      soruyu etkilemiyor. Kaynaksız adayın seçtiği B (Ekim''de başlar, Kasım sonuna kadar gönderir) md. 7/1-2''ye
      açıkça aykırı; ikinci savunulabilir şık yok.'
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'şık dengeleme: doğru şık A → B (metinler yer değiştirdi).'
