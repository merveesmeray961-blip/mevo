    dogru_neden: 'SMGE Yönetmeliği md. 13/1 uyarınca stajyer mentorluğunda her ay için 1 kredi kazanılır, ancak bu yolla elde
      edilen krediler yılda 7 krediyi geçemez (12 ay için 12 değil 7 kredi). Birlik tarafından düzenlenen etkinliğe konuşmacı
      olarak katılım 5 kredi, SÜRGEM''e akredite kuruluşun etkinliğine katılım ise 2 kredidir. Toplam 7 + 5 + 2 = 14 kredi.
