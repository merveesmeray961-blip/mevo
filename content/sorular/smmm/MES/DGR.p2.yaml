    konuşmacı olarak katılmış ve SÜRGEM'e akredite bir kuruluşun düzenlediği bir seminere dinleyici olarak katılmıştır. Sürekli
    Mesleki Geliştirme Eğitimi Yönetmeliği'ne göre M'nin bu yıl diğer faaliyetlerden elde edeceği toplam kredi kaçtır?
