- id: SMMM-MES-DGR-0002
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: Ücretlerin Esasları — ücret sözleşmesi, sürelere ilişkin kurallar
  tip: bilgi
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
    Yönetmelik''e göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Süreli ücret sözleşmelerinin en az bir yıllık olması şarttır.


    II. Ücret sözleşmesine, yapılan hizmet karşılığı meslek mensubuna ortaklık payı verileceğine dair hüküm konulabilir.


    III. İş sahibinin tebligat adresi değişirse, bu değişiklik en geç üç gün içinde iş sahibi tarafından taahhütlü
    mektupla meslek mensubuna bildirilmelidir.


    IV. Meslek mensubunun sözleşme şartlarına uymaması durumunda iş sahibi, on beş gün önceden yazılı olarak haber
    vererek sözleşmeyi feshedebilir.'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: III ve IV
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade md. 14/1''e, III numaralı ifade md. 23/2''ye uygundur. II numaralı ifade md.
      13/1''e aykırıdır: ücret sözleşmesine hizmet karşılığı ortaklık payı verileceğine dair hüküm konulamaz. IV
      numaralı ifade md. 19/3''e aykırıdır: sözleşme şartlarına uymayan meslek mensubuyla sözleşme bir hafta önceden
      yazılı haber verilerek feshedilir. Doğru ifadeler I ve III''tür. Püf noktaları: Bu soruda dört ayrı maddenin
      (md. 13, 14, 19, 23) süre ve şartları birlikte sorulmaktadır. Süreler birbirine karıştırılır: sözleşme süresi
      bir yıl, tebligat adresi bildirimi üç gün, fesih ihbarı bir hafta. II numaralı ifade, ücretin yalnızca belli
      bir meblağ olarak belirlenebileceği kuralına dayanır; ortaklık payı hükmü konulamaz.'
    celdiriciler:
      A: II numaralı ifade yanlıştır; md. 13/1'e göre ücret sözleşmesine hizmet karşılığı ortaklık payı verileceğine
        dair hüküm konulamaz. III numaralı ifade doğru olduğu hâlde bu şıkta yoktur.
      B: IV numaralı ifade yanlıştır; md. 19/3'e göre fesih bir hafta önceden yazılı haber verilerek yapılır, on
        beş gün kuralı yoktur. III numaralı ifade doğru olduğu hâlde bu şıkta yoktur.
      C: II numaralı ifade md. 13/1'e aykırıdır; I numaralı ifade ise doğru olduğu hâlde bu şıkta yer almamıştır.
      D: IV numaralı ifade md. 19/3'e aykırıdır (süre bir haftadır); I numaralı ifade ise doğru olduğu hâlde bu
        şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 13/1
    alinti: Ücret sözleşmesine, yapılan hizmet karşılığı meslek mensubuna ortaklık payı verileceğine dair hüküm
      konulamaz.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 14/1
    alinti: Ücret sözleşmeleri münferit ya da süreli olarak yapılabilir. Süreli sözleşmelerin en az bir yıllık olması
      şarttır.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 19/3
    alinti: Keza, meslek mensubunun sözleşme şartlarına uymaması durumunda, bir hafta önceden yazılı olarak haber
      verilerek sözleşme fesh edilir ve iş başka bir meslek mensubuna devredilir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 23/2
    alinti: Adres değişiklikleri, en geç üç gün içinde, iş sahibi tarafından taahhütlü mektupla meslek mensubuna
      bildirilmelidir.
