      A: 9 kredi, konuşmacı olarak katılım kredisi (5) hesaba katılmadan bulunur (7 + 2).
      B: 12 kredi, mentorluk kredisi sınırsız (12 ay) alınıp seminerler eklenmeden ya da 7 + 5 şeklinde akredite kuruluş kredisi
        unutularak bulunur.
      E: 19 kredi, mentorluk kredisindeki 7 kredilik yıllık sınır uygulanmadan (12 + 5 + 2) bulunur.
      D: 17 kredi doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 14 kredi olarak bulunur.
