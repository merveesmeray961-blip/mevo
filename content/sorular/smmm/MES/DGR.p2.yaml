- id: SMMM-MES-DGR-0003
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: Ücretlerin Esasları — asgari ücret tarifesinin hazırlanma takvimi
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
    Yönetmelik'e göre, bir yılın asgari ücret tarifesinin hazırlanmasına ilişkin takvim aşağıdakilerden hangisinde
    doğru olarak verilmiştir?
  secenekler:
    A: Odalar, tarifenin hazırlanmasına önceki yılın Eylül ayında başlar ve hazırladıkları yeni tarifeleri Ekim
      ayı sonuna kadar Geçici Kurul'a gönderir.
    B: Odalar, tarifenin hazırlanmasına önceki yılın Ekim ayında başlar ve hazırladıkları yeni tarifeleri Kasım
      ayı sonuna kadar Geçici Kurul'a gönderir.
    C: Odalar, tarifenin hazırlanmasına önceki yılın Eylül ayında başlar ve hazırladıkları yeni tarifeleri Kasım
      ayı sonuna kadar doğrudan Bakanlığa gönderir.
    D: Geçici Kurul, tarifeyi bütün ülke için tek tarife veya bölgelere göre birden çok tarife olarak düzenler ve
      Ekim ayı sonuna kadar Bakanlığa gönderir.
    E: Bir yılın tarifesi, o yılın Ocak ayında Resmî Gazete ile ilan olunur ve yeni tarife kesinleşinceye kadar
      eski tarife uygulanmaz.
  dogru: A
  aciklama:
    dogru_neden: Yönetmelik md. 7'ye göre bir yılın tarifesinin hazırlanmasına önceki yılın Eylül ayında odalarca
      başlanır ve odalar hazırladıkları yeni tarifeleri Ekim ayı sonuna kadar Geçici Kurul'a yollar. Geçici Kurul
      tarifeyi Kasım ayı sonuna kadar düzenleyip Bakanlığa gönderir; Bakanlık tasdik eder ve Resmî Gazete'de yayımlar.
    celdiriciler:
      B: Hazırlığa başlama ayı Ekim değil Eylül; odaların Geçici Kurul'a gönderme süresi de Kasım değil Ekim ayı
        sonudur (md. 7/1-2).
      C: Odalar tarifeleri doğrudan Bakanlığa değil, Ekim ayı sonuna kadar Geçici Kurul'a gönderir; Kasım ayı sonu
        Geçici Kurul'un Bakanlığa gönderme süresidir (md. 7/2-3).
      D: Geçici Kurul tarifeyi Ekim ayı sonuna kadar değil, Kasım ayı sonuna kadar Bakanlığa gönderir (md. 7/3).
      E: Tarife en geç önceki yılın Aralık ayının 20'sine kadar Resmî Gazete ile ilan olunur; ayrıca yeni tarife
        kesinleşinceye kadar eski tarife uygulanır (md. 5/2, md. 10/1).
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 7
    alinti: Bir yılın tarifesinin hazırlanmasına önceki yılın Eylül ayında odalarca başlanır. Odalar; hazırladıkları
      yeni tarifeleri Ekim ayı sonuna kadar Geçici Kurul’a yollarlar. Geçici Kurul, Kasım ayı sonuna kadar tarifeyi
      bütün ülke için bir tek ya da bölgelere göre birden çok tarife olarak düzenler ve Bakanlığa gönderir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 10/1
    alinti: Bir yıl sonra uygulanacak ücretlere ait tarife, en geç önceki yılın Aralık ayının 20’sine kadar Resmi
      Gazete ile ilan olunur.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 5/2
    alinti: Yeni tarife kesinleşinceye kadar eski tarife uygulanır.
