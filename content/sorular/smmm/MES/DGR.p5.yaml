      teklif edilecek 5 aday arasından, 2 üye ise Birlikçe teklif edilecek 4 üye arasından Maliye Bakanı tarafından
      seçilir.
    celdiriciler:
      A: Bu oluşum SMMM sınavına değil, md. 10'daki yeminli mali müşavirlik sınavı komisyonuna aittir.
      B: md. 7'ye göre üyelerin 2'si Maliye Bakanlığını temsil eder, 3'ü Yükseköğretim Kurulunca teklif edilen adaylardan
        seçilir; tüm üyelerin Birlikçe teklif edilmesi söz konusu değildir.
      C: md. 7'ye göre Maliye Bakanlığını temsil eden üye sayısı 3 değil 2'dir; Yükseköğretim Kurulunca teklif edilen
        adaylardan seçilen üye sayısı ise 3'tür.
      E: md. 7'ye göre sınav Maliye Bakanlığı tarafından değil Birlik tarafından yapılır ve yazılıdır; sözlü sınav
        öngörülmemiştir.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 7/1-2
    alinti: Serbest muhasebeci mali müşavirlik sınavı Birlik tarafından yazılı olarak yapılır. Sınav Komisyonu 7
      üyeden oluşur. Üyelerin 2'si Maliye Bakanlığını temsil eder. Diğer 3 üye Yüksek Öğretim Kurulunca teklif edilecek
      5 aday arasından diğer 2 üye ise Birlikçe teklif edilecek 4 üye arasından Maliye Bakanı tarafından seçilir.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 10/2 (karşılaştırma)
    alinti: Sınav komisyonu biri başkan olmak üzere yedi üyeden oluşur. Sınav komisyonu başkan ve üyeleri; dördü
