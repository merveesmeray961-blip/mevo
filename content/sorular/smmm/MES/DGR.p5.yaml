  secenekler:
    A: Sınav komisyonu 7 üyeden oluşur; 4 üye Maliye Bakanlığı vergi denetim elemanları arasından, 1 üye Yükseköğretim
      Kurulunca önerilecek 2 aday arasından, 2 üye Birlikçe önerilecek 4 aday arasından Maliye Bakanı tarafından
      seçilir.
    B: Sınav komisyonu 7 üyeden oluşur; tüm üyeler Birlikçe teklif edilecek adaylar arasından Maliye Bakanı tarafından
      seçilir.
    C: Sınav komisyonu 7 üyeden oluşur; 3 üye Maliye Bakanlığını temsil eder, 2 üye Yükseköğretim Kurulunca teklif
      edilecek 5 aday arasından, 2 üye Birlikçe teklif edilecek 4 üye arasından seçilir.
    D: Sınav komisyonu 7 üyeden oluşur; 2 üye Maliye Bakanlığını temsil eder, 3 üye Yükseköğretim Kurulunca teklif
      edilecek 5 aday arasından, 2 üye Birlikçe teklif edilecek 4 üye arasından Maliye Bakanı tarafından seçilir.
    E: Sınav, Maliye Bakanlığı tarafından yazılı ve sözlü olarak yapılır.
  dogru: D
  aciklama:
    dogru_neden: md. 7'ye göre serbest muhasebeci mali müşavirlik sınavı Birlik tarafından yazılı olarak yapılır.
