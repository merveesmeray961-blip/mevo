- id: SMMM-MES-DGR-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: Odalar
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Serbest Muhasebeci Mali Müşavirler Odaları Yönetmeliği'ne göre, üye sayısı 5.000 olan bir Serbest Muhasebeci
    Mali Müşavirler Odası'nın Yönetim Kurulu kaç asıl ve kaç yedek üyeden oluşur?
  secenekler:
    A: 5 asıl, 5 yedek
    B: 7 asıl, 5 yedek
    C: 7 asıl, 7 yedek
    D: 9 asıl, 7 yedek
    E: 9 asıl, 9 yedek
  dogru: C
  aciklama:
    dogru_neden: md. 10/1'e göre Yönetim Kurulu üye sayısı binin altında olan odalarda beş asıl ve beş yedek, üye
      sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek, üye sayısı beşbini aşan odalarda ise
      dokuz asıl ve dokuz yedek üyeden oluşur. 5.000 üyeli oda "bin ilâ beşbin arasında" aralığına girer, "beşbini
      aşan" aralığına girmez; bu nedenle yedi asıl ve yedi yedek üye seçilir.
    celdiriciler:
      A: 5 asıl ve 5 yedek üye, üye sayısı binin altında olan odalar içindir.
      B: Yönetmelikte asıl ve yedek üye sayıları her aralıkta eşittir; yedi asıl üyeye karşılık beş yedek üye öngörülmemiştir.
      D: Yönetmelikte dokuz asıl üyeye karşılık yedi yedek üye öngörülmemiştir; ayrıca 5.000 üye "beşbini aşan"
        aralığa girmez.
      E: 9 asıl ve 9 yedek üye, üye sayısı beşbini aşan odalar içindir; 5.000 üyeli oda bu aralıkta değildir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirler Odaları Yönetmeliği
    madde: md. 10/1
    alinti: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen, üye sayısı binin altında
      olan odalarda beş asıl ve beş yedek, üye sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek,
      üye sayısı beşbini aşan odalarda ise dokuz asıl ve dokuz yedek üyeden oluşur.
  gecerlilik:
    baslangic: '2012-12-25'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Odalar Yön. md. 10/1 ve 3568 md. 21/1 aynı: 1.000-5.000 arası 7+7; 5.000 ''beşbini aşan'' değil. İkinci savunulabilir şık yok.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'md. 10/1 alıntısı birebir (RG 25/12/2012 değişik fıkra).'
      GZ:
        sonuc: bekliyor
- id: SMMM-MES-DGR-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: TÜRMOB
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği Yönetmeliği'ne göre,
    üye sayısı 1.620 olan bir oda, Birlik Genel Kurulu'na toplam kaç asıl delege seçer?
  secenekler:
    A: '21'
    B: '22'
    C: '24'
    D: '25'
    E: '50'
  dogru: D
  aciklama:
    dogru_neden: 'md. 11/1''e göre her oda, üye sayısına bağlı olmaksızın seçeceği üç temsilciye ilâve olarak üyelerinin
      yetmişbeşte biri oranında temsilci seçer; bu oranın yarısından az olan kesirler dikkate alınmaz, fazla olanlar
      ise tüme tamamlanır. 1.620 / 75 = 21 tam ve 45 kalan; kalan, yetmişbeşin yarısı olan 37,5''ten fazla olduğundan
      tüme tamamlanarak 22 delege sayılır. Toplam: 3 + 22 = 25.'
    celdiriciler:
      A: 3 sabit temsilci unutulmuş ve kesir de yok sayılmıştır (yalnızca 21).
      B: 3 sabit temsilci unutulmuştur; yalnızca orana göre bulunan 22 delege sayılmıştır.
      C: Kalan 45, yetmişbeşin yarısından (37,5) fazla olduğu hâlde tüme tamamlanmamıştır (3 + 21).
      E: Asıl delege sayısı (25) yedek temsilciler de sayılarak ikiyle çarpılmıştır; soru yalnız asıl delege sayısını
        sorar. Yedek temsilci ayrıca "aynı sayıya kadar" seçilir, asıl delege sayısına eklenmez.
    hesap_adimlari:
    - 'Oranla bulunan temsilci: 1.620 / 75 = 21 tam, kalan 1.620 - 21 x 75 = 45'
    - 'Kalan 45, 75''in yarısı olan 37,5''ten fazla: tüme tamamlanır (+1) -> 22'
    - 'Sabit temsilci 3 eklenir: 3 + 22 = 25 asıl delege'
  kaynaklar:
  - mevzuat: Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği Yönetmeliği
    madde: md. 11/1
    alinti: Birlik Genel Kurulu üyeleri, odaların kendi üyeleri arasından seçecekleri delegelerden ve Birlik Yönetim
      Kurulu üyelerinden oluşur. (Değişik ikinci cümle:RG-25/12/2012-28508) Her oda, üye sayısına bağlı olmaksızın
      seçeceği üç temsilciye ilâve olarak, üyelerinin yetmişbeşte biri oranında temsilci ve aynı sayıya kadar yedek
      temsilci seçer. Bu oranın yarısından az olanlar nazara alınmaz. Fazla olanlar ise, tüme tamamlanır.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 32/1
    alinti: Her oda, üye sayısına bağlı olmaksızın seçeceği üç temsilciye ilâve olarak, üyelerinin yetmişbeşte biri
      oranında temsilci ve aynı sayıya kadar yedek temsilci seçer. Bu oranın yarısından az olanlar nazara alınmaz,
      fazla olanlar ise tüme tamamlanır.
  gecerlilik:
    baslangic: '2012-12-25'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: Birlik Yönetmeliği md. 11/1 alıntısındaki ''Bu ... oranın'' → ''Bu oranın'' (metinde atlanan
      söz yok; yalnız sayfa sonu); aynı kuralı içeren 3568 md. 32/1 kaynak olarak eklendi; E çeldiricisi açıklaması
      netleştirildi. Kök, şıklar ve anahtar değişmedi.'
    neden: 'G6: alıntı birebir değildi. G5 (kör çözücü notu): yuvarlama kuralı hem Yönetmelik md. 11/1''de hem Kanun
      md. 32/1''de açıkça yazılı ve kök ''Yönetmeliği''ne göre'' diye kuralın kaynağını gösteriyor; kural sorunun ölçtüğü
      bilgi olduğundan köke yazılmadı. 1.620 = 21 x 75 + 45; 45 > 37,5 → 22; 3 + 22 = 25. Tam yarı (37,5) 75 tek
      olduğundan oluşamaz.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: gecti
        tarih: '2026-10-05'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: '1.620 = 21 x 75 + 45; 45 > 37,5 → 22; 3 + 22 = 25. Yuvarlama kuralı Yön. md. 11/1 ve 3568 md. 32/1''de açık; C (24) kuralı bilmeyen adayın çeldiricisi.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'md. 11/1 alıntısındaki fazladan ''...'' kaldırıldı, 3568 md. 32/1 eklendi; dogrulama.python 25 veriyor, açıklamayla aynı.'
      GZ:
        sonuc: bekliyor
  dogrulama:
    python: 'tam = 1620 // 75

      kalan = 1620 - 75 * tam

      ek = 1 if 2 * kalan >= 75 else 0

      sonuc = 3 + tam + ek'
- id: SMMM-MES-DGR-0006
  sinav: smmm
