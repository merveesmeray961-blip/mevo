  kok: SMGE kapsamındaki bir meslek mensubu üç yıllık dönemde toplam 120 krediye ulaşmış, ancak bu kredilerin doğrulanabilir
    kısmı 55 kredide kalmıştır. Aynı dönemde Mesleki Çalışma Standartları ve Etik İlkeler konusundan 3 kredi, Denetim; Denetim
    ve Güvence Standartları konusundan 2 kredi almıştır. Bu durum için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yükümlülük yerine getirilmemiştir; çünkü doğrulanabilir kredinin üç yıllık asgari miktarı 60 kredidir.
    B: Yükümlülük yerine getirilmemiştir; çünkü toplam kredi en az 150 olmalıdır.
    C: Yükümlülük tamamen yerine getirilmiştir; doğrulanabilir kredi için ayrıca asgari aranmaz.
    D: Yükümlülük yerine getirilmiştir; konu bazlı kredi şartları toplam 120 krediye dahil değildir.
    E: Yükümlülük yerine getirilmiştir; doğrulanabilir kredinin yıllık 15 kredi olması üç yıllık dönemde 55 krediyi yeterli
      kılar.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 11/1 üç yıllık dönemde en az 120 kredi, md. 11/2 ise bunun doğrulanabilir kısmının üç yıllık dönemde
      en az 60 kredi olmasını şart koşar. Meslek mensubu konu bazlı 3 ve 2 kredilik alt şartları sağlasa da 55 doğrulanabilir
      kredi ile üç yıllık asgari 60 krediyi karşılamamaktadır. Püf noktaları: 120 toplam kredi ile 60 doğrulanabilir kredi
      ayrı alt sınırlar; konu bazlı asgari kredilerin sağlanması doğrulanabilir kredi açığını kapatmaz.'
    celdiriciler:
      B: Üç yıllık toplam asgari kredi 150 değil 120'dir.
      C: 120 toplam kredi tek başına yeterli değildir; üç yıllık doğrulanabilir kredi alt sınırı da 60'tır.
      D: Konu bazlı eğitimler toplam yükümlülüğün içindedir; ayrıca doğrulanabilir kredi alt sınırı vardır.
      E: Yıllık 15 kredi doğrulanabilirlik için alt sınırdır; üç yıllık dönemde ayrıca en az 60 doğrulanabilir kredi gerekir.
