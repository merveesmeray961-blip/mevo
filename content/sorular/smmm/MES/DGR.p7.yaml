      TESMER kurs ve seminerlerinde geçen ve altı ayı aşmayan süreler stajdan sayılır. Püf noktaları: Sınavı kazanmak tek
      başına yeterli değildir; TESMER eğitimi de tamamlanmalıdır.'
    celdiriciler:
      A: Kanun staja başlamadan önce TESMER eğitim programının tamamlanıp başarılı olunmasını şart koşar; ilk altı ayla sınırlı
        bir erteleme yoktur.
      B: Staja giriş sınavını kazanmak gerekli olmakla birlikte tek başına yeterli değildir; TESMER programı da tamamlanmalıdır.
      C: Kanun stajın bağımsız çalışan SMMM veya YMM yanında ya da şirketlerinde yapılabileceğini açıkça düzenler.
      E: TESMER eğitim programının tamamlanması staja başlama şartıdır; ayrıca kurs ve seminerlerde geçen sürenin stajdan
        sayılması altı ayı aşmayan sürelerle sınırlıdır.
