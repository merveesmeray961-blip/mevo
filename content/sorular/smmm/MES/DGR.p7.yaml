      C: İlan için Ocak ayı değil önceki yılın Aralık ayının 20'si son tarihtir; ayrıca eski tarife uygulanmaya devam eder.
      D: Kesinleşene kadar ücretler serbestçe belirlenmez; eski tarife uygulanır.
