  - YET
  ders: MES
  unite: Diğer yönetmelikler
  konu: DGR
  kazanim: Staj
  tip: uygulama
  zorluk: 3
  kok: Staja başlamak isteyen bir aday, staja giriş sınavını kazanmış ancak Birlik tarafından kurulan Temel Eğitim ve Staj
    Merkezinin eğitim programını henüz tamamlamamıştır. Aday ayrıca bağımsız çalışan bir SMMM'nin yanında staj yapmak istemektedir.
    3568 sayılı Kanuna göre aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Staja başlanabilir; TESMER programının tamamlanması yalnızca stajın ilk altı ayı için aranır.
    B: Staja başlanabilir; çünkü staja giriş sınavını kazanmak tek başına yeterlidir.
    C: Staj yalnızca bir YMM şirketinde yapılabilir; SMMM yanında staj yapılamaz.
    D: Staja başlayabilmek için staja giriş sınavını kazanmanın yanında TESMER eğitim programının tamamlanıp başarılı olunması
      gerekir; staj bağımsız çalışan SMMM veya YMM yanında ya da şirketlerinde yapılabilir.
    E: TESMER eğitimi tamamlanmadan staja başlanabilir; ancak geçen kurs süresinin tamamı stajdan sayılır.
  dogru: D
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 6''ya göre SMMM stajı bağımsız çalışan SMMM veya YMM yanında ya da şirketlerinde yapılır.
