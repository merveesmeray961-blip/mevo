  kok: Bir SMMM, müşterisiyle yaptığı sözleşme kapsamındaki işi sözleşme süresince yürütmektedir. Müşteri sözleşmeyi kendi
    isteğiyle feshetmiş; ancak SMMM'nin kusur veya ihmali bulunmamaktadır. Sözleşmeye göre ücretin peşin ödenmesi kararlaştırılmış
    ve müşteri ücretin bir kısmını henüz ödememiştir. Ücretlerin Esasları Hakkında Yönetmelik'e göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: SMMM, müşteri feshettiği için hiçbir ücret talep edemez.
    B: SMMM yalnızca ödenmiş kısmı talep edebilir; kalan ücret kendiliğinden düşer.
    C: SMMM'nin kusuru bulunmadığından sözleşmede kararlaştırılan ücretin tamamının ödenmesi gerekir; peşin ödenmesi gereken
      ücret veya avans ödenmemişse işi başlatmama veya sürdürmeme hakkı da vardır.
    D: SMMM yalnızca işin tamamlanan kısmı için ücret talep edebilir ve peşin ücret hükmü geçersizdir.
    E: Müşteri feshi halinde ücret ancak yeni bir meslek mensubuna devredilirse doğar.
