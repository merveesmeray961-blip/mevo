      gerekir.
    celdiriciler:
      A: İl merkezindeki eşik 100 değil 250'dir; ayrıca tüzel kişilik seçimle değil kuruluşun bildirilmesiyle kazanılır.
      C: İlçede 250 meslek mensubu bulunması yanında en az 100 meslek mensubunun yazılı başvurusu aranır; 50 yeterli değildir.
      D: İlçede yazılı başvuru şartı vardır ve tüzel kişilik ilk genel kurul toplantısıyla değil bildirimle kazanılır.
      E: Kuruluş bildiriminin Maliye Bakanlığına yapılması tüzel kişilik için düzenlenmiştir; ayrıca bir onay şartı metinde
        yoktur.
