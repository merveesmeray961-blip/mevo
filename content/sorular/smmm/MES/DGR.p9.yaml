    dogru_neden: 'Madde 17''ye göre sözleşmenin iş sahibince feshi halinde meslek mensubunun ücretinin tamamının ödenmesi
      gerekir; istisna, meslek mensubunun bu duruma kendi kusur ve ihmali ile yol açmasıdır. Aynı maddede peşin verilmesi
      gereken ücret veya avans ödenmezse meslek mensubunun işe başlamak veya işi sürdürmek zorunda olmadığı da düzenlenmiştir.
      Püf noktaları: Müşterinin feshi ile meslek mensubunun kusuru ayrı ayrı değerlendirilmelidir.'
    celdiriciler:
      A: Müşterinin feshi tek başına ücreti ortadan kaldırmaz; kusur yoksa tamamı ödenir.
      B: Yönetmelik kalan ücretin kendiliğinden düşeceğini değil, ücretin tamamının ödenmesini öngörür.
      D: Peşin ödeme esastır ve kusur yoksa sözleşmedeki ücretin tamamı ödenir.
      E: Ücret hakkının doğması yeni meslek mensubuna devir şartına bağlanmamıştır.
