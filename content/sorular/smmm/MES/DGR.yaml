- id: SMMM-MES-DGR-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DGR
  kazanim: SMMM sınavına giriş şartları, başarı ölçütü ve tekrar sınav hakkı (Sınav ve Staj yönetmelikleri, 3568)
  tip: uygulama
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'Staja giriş sınavını kazanarak Nisan 2025''te oda nezdinde staj dosyası açtıran aday meslek mensubu (B),
    Serbest Muhasebeci Mali Müşavirlik sınavına girmeye hazırlanmaktadır. 3568 sayılı Kanun, Yeminli Mali Müşavirlik
    ve Serbest Muhasebeci Mali Müşavirlik Sınav Yönetmeliği ve Serbest Muhasebeci Mali Müşavirlik Staj Yönetmeliği
    birlikte değerlendirildiğinde (B) ile ilgili aşağıdaki ifadelerden hangileri doğrudur?

    I. En az üç yıl staj yapması gerekir; Temel Eğitim ve Staj Merkezinin kurs ve seminerlerinde geçen ve altı ayı
    aşmayan süreler staj süresinden sayılır.

    II. Sınava girebilmesi için yanında staj yaptığı meslek mensubundan 100 üzerinden en az 70 staj değerlendirme
    notu almış olması yeterlidir.

    III. Sınavda başarılı sayılması için her konudan 100 üzerinden en az 50 almak şartıyla, tezkiye not ortalaması
    ayrı bir ders gibi dahil edilerek hesaplanan ortalamanın en az 60 olması gerekir.

    IV. Sınavda başarılı olamazsa, ilk sınav tarihinden itibaren 2 yıl içinde yılda 3 kez açılacak tüm sınavlara
    girebilir.'
  secenekler:
    A: I ve II
    B: II ve IV
    C: I ve III
    D: I, II ve III
    E: I, III ve IV
  dogru: E
  aciklama:
    dogru_neden: 'I: 3568 md. 5/A(b) en az üç yıl staj şartını, md. 6/1 ise TESMER kurs ve seminerlerinde geçen
      ve altı ayı aşmayan sürelerin stajdan sayılacağını düzenler (Staj Yön. md. 9(a) aynı hükmü tekrarlar). III:
      Sınav Yön. md. 16(b) her konudan en az 50 şartıyla ortalamanın en az 60 olmasını ve tezkiye not ortalamasının
      ayrı bir ders gibi ortalamaya dahil edilmesini öngörür. IV: Sınav Yön. md. 21/2, 24/02/2025 değişikliğiyle
      başarısız adaylara ilk sınav tarihinden itibaren 2 yıl içinde yılda 3 kez açılacak sınavlara girme hakkı tanır.
      Geçici md. 2 eski hükmü yalnız bu maddenin yürürlüğe girdiği tarihten önce Oda nezdinde staj dosyası açtırmış
      ve staja giriş sınavını kazanmış olanlara uygular; iki koşul birlikte aranır. (B) dosyasını Nisan 2025''te
      açtırdığı için bu kapsama girmez ve yeni hüküm uygulanır. II yanlıştır: staj değerlendirme (tezkiye) notu
      en az 80 olmalıdır (Sınav Yön. md. 9/2, Staj Yön. md. 5(d)); ayrıca not tek başına yeterli değildir, stajın
      tamamlanması da gerekir. Kullanılan teknikler: (1) madde birleştirme — Kanun, Sınav ve Staj yönetmelikleri
      birlikte okunur; (2) tarih/süre hesabı — staj dosyasının açılış tarihi geçiş hükmünün yürürlük tarihiyle karşılaştırılır;
      (3) yakın kavram ayrımı — II''de tezkiye notu 80 yerine 70 verilmiştir. Tuzak, Geçici md. 2''deki eski hükmün
      tüm stajyerlere uygulandığını sanıp IV''ü yanlış saymaktır.'
    celdiriciler:
      A: II yanlıştır; Sınav Yön. md. 9/2 ve Staj Yön. md. 5(d)'ye göre gerekli not 100 üzerinden en az 80'dir.
        Ayrıca doğru olan III ve IV dışarıda bırakılmıştır.
      B: II yanlıştır (asgari not 80'dir) ve doğru olan I ile III dışarıda bırakılmıştır.
      C: I ve III doğrudur ancak IV de doğrudur; (B) staj dosyasını 24/02/2025'ten sonra açtırdığı için Geçici md.
        2 kapsamına girmez ve md. 21/2'deki 2 yıllık hak uygulanır.
      D: II yanlıştır (asgari not 80'dir) ve doğru olan IV dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 5/A (b) ve md. 6/1
    alinti: b) (Değişik:10/7/2008-5786/3 md.) En az üç yıl staj yapmış olmak. ... Staja başlayabilmek için staja
      giriş sınavını kazanmak ve Birlik tarafından kurulan Temel Eğitim ve Staj Merkezinin eğitim programını tamamlayıp
      başarılı olmak şarttır. Temel Eğitim ve Staj Merkezinin kurs ve seminerlerinde geçen ve altı ayı aşmayan süreler,
      staj süresinden sayılır.
  - mevzuat: Yeminli Mali Müşavirlik ve Serbest Muhasebeci Mali Müşavirlik Sınav Yönetmeliği
    madde: md. 9/2
    alinti: Serbest Muhasebeci Mali Müşavirlik sınavına girebilmek için, aday meslek mensubunun stajı tamamlamış
      ve yanında veya denetim ve gözetiminde staj yaptığı meslek mensubundan staj değerlendirme notu olarak en az
      100 üzerinden (Değişik ibare:R.G.:24/02/2025-32823) 80 almış olması gerekir.
  - mevzuat: Yeminli Mali Müşavirlik ve Serbest Muhasebeci Mali Müşavirlik Sınav Yönetmeliği
    madde: md. 16 (b)
    alinti: b) Serbest Muhasebeci Mali Müşavirlik sınavında başarılı olmak için her konudan 100 üzerinden en az
      50 almak şartıyla, sınavın tüm konularının notları toplanır ve aritmetik ortalaması alınır. Başarılı sayılmak
      için bu ortalamanın en az 60 olması gerekir. Yanında staj yapılan meslek mensubu tarafından verilen tezkiye
      not ortalaması ayrı bir ders gibi ortalamaya dahil edilir.
  - mevzuat: Yeminli Mali Müşavirlik ve Serbest Muhasebeci Mali Müşavirlik Sınav Yönetmeliği
    madde: md. 21/2 ve Geçici md. 2
    alinti: Serbest Muhasebeci Mali Müşavirlik sınavında başarılı olamayanlar, ilk sınav tarihinden itibaren (Değişik
      ibare:R.G.:24/02/2025-32823) 2 yıl içerisinde yılda 3 kez açılacak tüm sınavlara girebilirler. ... Geçici
      Madde 2- Bu maddenin yürürlüğe girdiği tarihten önce Oda nezdinde staj dosyası açtırmış ve staja giriş sınavını
      kazanmış olanlar hakkında, 21 inci maddenin ikinci fıkrasının bu maddeyi ihdas eden Yönetmelikle değiştirilmeden
      önceki hükümleri uygulanmaya devam olunur.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik Staj Yönetmeliği
    madde: md. 5 (d)
    alinti: d) (Değişik:RG-25/12/2012-28508) Tezkiye olumlu değerlendirme ölçütü, 100 üzerinden yapılacak değerlendirmede
      80 ve üzeri notu ifade eder. (Ek cümle:R.G.:24/02/2025-32823) Tezkiye notu 80 puanın altında olan adayların,
      80 puanın altında not verilen dönemi kapsayan stajları geçersiz sayılır ve eksik süre tamamlatılır.
