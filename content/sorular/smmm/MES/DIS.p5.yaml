- id: SMMM-MES-DIS-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DIS
  kazanim: itiraz süreleri
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: 3568 sayılı Kanun Disiplin Yönetmeliği'ne göre ilgililer, Oda Disiplin Kurulu kararlarına karşı hangi merciye
    ve bildirim tarihinden itibaren kaç gün içinde itiraz edebilirler?
  secenekler:
    A: Birlik Disiplin Kuruluna 30 gün
    B: Oda Yönetim Kuruluna 30 gün
    C: Birlik Disiplin Kuruluna 15 gün
    D: Hazine ve Maliye Bakanlığına 30 gün
    E: Birlik Yönetim Kuruluna 60 gün
  dogru: A
  aciklama:
    dogru_neden: md. 28/1'e göre Oda disiplin kurulunun kararlarına karşı ilgililer, bildirim tarihinden itibaren
      30 gün içinde ilgili oda aracılığı ile veya doğrudan Birlik Disiplin Kuruluna itiraz edebilirler.
    celdiriciler:
      B: Oda disiplin kurulu kararlarına itiraz mercii Oda Yönetim Kurulu değil, Birlik Disiplin Kuruludur (md.
        28/1).
      C: İtiraz süresi 15 gün değil, bildirim tarihinden itibaren 30 gündür (md. 28/1).
      D: Hazine ve Maliye Bakanlığı Oda disiplin kurulu kararlarına itiraz mercii değildir; Bakanlık onayı yalnız
        Birlik Disiplin Kurulunun itirazların reddine ait kararları için aranır (md. 29).
      E: İtiraz mercii Birlik Yönetim Kurulu değil Birlik Disiplin Kuruludur; süre de 60 gün değil 30 gündür.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 28/1
    alinti: Oda disiplin kurulunun kararlarına karşı ilgililer bildirim tarihinden itibaren 30 gün içinde ilgili
      oda aracılığı ile veya doğrudan Birlik Disiplin Kuruluna itiraz edebilirler.
