- id: SMMM-MES-DIS-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DIS
  kazanim: cezalar
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 3568 sayılı Kanun Disiplin Yönetmeliği'ne göre, tekerrür ve takdir hakkı kullanımı bulunmadığı varsayıldığında,
    aşağıdaki eylem-ceza eşleştirmelerinden hangisi **yanlıştır**?
  secenekler:
    A: 'Aday meslek mensubunun mesleğin vakar ve onuru ile bağdaşmayan işler yapmasına bilerek izin verilmesi: Uyarma'
    B: 'Reklam yasağına uyulmaması: Kınama'
    C: 'Asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi: Kınama'
    D: 'Beyanname ve bildirimlerin imzalanması ve denetimi ile ilgili ilke, kural ve ilan olunmuş norm ve standartlara
      kasten aykırı davranılması: Geçici olarak mesleki faaliyetten alıkoyma'
    E: 'Kasıt olmaksızın, gerekli özen ve titizlik yeterince gösterilmeden, yasal düzenlemelere ve ilan olunmuş
      norm ve standartlara aykırı olarak beyanname ve bildirimlerin imzalanması: Geçici olarak mesleki faaliyetten
      alıkoyma'
  dogru: E
  aciklama:
    dogru_neden: 'E şıkkındaki eylem md. 6/1 (n) kapsamındadır: meslek mensuplarınca, kasıt olmaksızın gerekli özen
      ve titizlik yeterince gösterilmeden, yasal düzenlemelere ve ilan olunmuş norm ve standartlara aykırı olarak
      beyanname ve bildirimlerin imzalanması kınama cezasını gerektirir. Geçici olarak mesleki faaliyetten alıkoyma
      cezası ise md. 7/1 (f)''ye göre beyanname ve bildirimlerin imzalanması ve denetimi ile ilgili yasal düzenlemelerdeki
      ilke ve kurallarla, ilan olunmuş norm ve standartlara kasten aykırı davranılması (veya imzalama ve denetim
      yetkisinin kasten gerçeğe aykırı kullanılması) hâlinde uygulanır.'
    celdiriciler:
      A: md. 5 (c)'ye göre aday meslek mensubunun mesleğin vakar ve onuru ile bağdaşmayan işler yapmasına neden
        olunması veya bilerek izin verilmesi uyarma cezası gerektirir; eşleştirme doğrudur.
      B: md. 6/1 (f)'ye göre reklam yasağına uyulmaması kınama cezası gerektirir; eşleştirme doğrudur.
      C: md. 6/1 (g)'ye göre asgari ücret tarifesindeki ücretlerin altında iş kabul edilmesi kınama cezası gerektirir;
        eşleştirme doğrudur.
      D: md. 7/1 (f)'ye göre ilke, kural ve norm ve standartlara kasten aykırı davranılması geçici olarak mesleki
        faaliyetten alıkoyma cezası gerektirir; eşleştirme doğrudur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 5 (c)
    alinti: 'Uyarma cezası aşağıdaki durumlarda uygulanır : ... c) Aday meslek mensubunun, mesleğin vakar ve onuru
      ile bağdaşmayan işler yapmasına neden olunması veya bilerek izin verilmesi veya bu eyleme göz yumulması,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/1 (f), (g) ve (n)
    alinti: 'Kınama cezası, aşağıdaki durumlarda uygulanır: ... f) Meslek mensuplarınca, reklam yasağına uyulmaması,
      g) (Değişik:RG-27/09/2007-26656) Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında
      iş kabul edilmesi, ... n) Meslek mensuplarınca, kasıt olmaksızın gerekli özen ve titizlik yeterince gösterilmeden;
      yasal düzenlemelere ve ilan olunmuş norm ve standartlara aykırı olarak beyanname ve bildirimlerin imzalanması,
      denetlenmesi ve tasdik edilmesi,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/1 (f)
    alinti: f) Meslek mensuplarınca, beyanname ve bildirimlerin imzalanması ve denetimi ile ilgili yasal düzenlemelerdeki
      ilke ve kurallarla, ilan olunmuş norm ve standartlara kasten aykırı davranılması veya beyanname imzalama ve
      denetim yetkisinin kasten gerçeğe aykırı olarak kullanılması.
  gecerlilik:
    baslangic: '2023-10-07'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: E şıkkına md. 6/1 (n)''deki ''yasal düzenlemelere ve ilan olunmuş norm ve standartlara
      aykırı olarak'' şartı eklendi; dogru_neden''de md. 6/1 (n) şartla birlikte, md. 7/1 (f) ise metindeki unsurlarla
      yazıldı (''aynı eylemin kasten yapılması'' ifadesi kaldırıldı). Anahtar değişmedi (E).'
    neden: 'G5: E şıkkı ve dogru_neden md. 6/1 (n)''nin ''norm ve standartlara aykırı olarak'' şartını atlıyordu;
      şartsız hâliyle eylem 6/1 (n) kapsamında sayılamaz. md. 7/1 (f) ''aynı eylemin kasten yapılması'' diye özetlenmişti;
      7/1 (f) tasdiki kapsamaz (o, YMM için 7/1 (g)).'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: E (güven 5) Disiplin Yön. m.6/n: kasıt olmaksızın özensiz beyanname imzalama = Kınama;
          alıkoyma değil. Diğerleri doğru (5c Uyarma, 6f, 6g Kınama, 7 kasten aykırılık alıkoyma).'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: E şıkkı tek yanlış eşleştirme (6/1-n kınama); A 5-c, B 6/1-f, C 6/1-g, D 7/1-f ile birebir. E şıkkı
          ve dogru_neden 6/1 (n) şartıyla düzeltildi (surum 2).
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 5 (c), 6/1 (f), (g), (n), 7/1 (f) alıntıları Disiplin Yönetmeliği metniyle birebir; iddiaların
          tümü metinde karşılıklı.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (E, güven 3)
- id: SMMM-MES-DIS-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DIS
  kazanim: itiraz süreleri
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: 3568 sayılı Kanun Disiplin Yönetmeliği'ne göre ilgililer, Oda Disiplin Kurulu kararlarına karşı hangi merciye
    ve bildirim tarihinden itibaren kaç gün içinde itiraz edebilirler?
  secenekler:
    A: Birlik Disiplin Kuruluna 30 gün
    B: Oda Yönetim Kuruluna 30 gün
    C: Birlik Disiplin Kuruluna 15 gün
    D: Hazine ve Maliye Bakanlığına 30 gün
    E: Birlik Yönetim Kuruluna 60 gün
  dogru: A
  aciklama:
    dogru_neden: md. 28/1'e göre Oda disiplin kurulunun kararlarına karşı ilgililer, bildirim tarihinden itibaren
      30 gün içinde ilgili oda aracılığı ile veya doğrudan Birlik Disiplin Kuruluna itiraz edebilirler.
    celdiriciler:
      B: Oda disiplin kurulu kararlarına itiraz mercii Oda Yönetim Kurulu değil, Birlik Disiplin Kuruludur (md.
        28/1).
      C: İtiraz süresi 15 gün değil, bildirim tarihinden itibaren 30 gündür (md. 28/1).
      D: Hazine ve Maliye Bakanlığı Oda disiplin kurulu kararlarına itiraz mercii değildir; Bakanlık onayı yalnız
        Birlik Disiplin Kurulunun itirazların reddine ait kararları için aranır (md. 29).
      E: İtiraz mercii Birlik Yönetim Kurulu değil Birlik Disiplin Kuruludur; süre de 60 gün değil 30 gündür.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 28/1
    alinti: Oda disiplin kurulunun kararlarına karşı ilgililer bildirim tarihinden itibaren 30 gün içinde ilgili
      oda aracılığı ile veya doğrudan Birlik Disiplin Kuruluna itiraz edebilirler.
  gecerlilik:
    baslangic: '2026-01-14'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: A (güven 5) Disiplin Yön. m.28: Oda Disiplin Kurulu kararlarına bildirimden 30 gün içinde
          Birlik Disiplin Kuruluna itiraz.'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'md. 28/1: 30 gün, Birlik Disiplin Kurulu; B-E açıkça aykırı. D çeldiricisindeki Bakanlık onayı (md.
          29) doğru.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: md. 28/1 alıntısı birebir; md. 29 iddiası metinde var (3568 md. 25 son fıkra ve md. 38 ile de uyumlu).
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (A, güven 4)
