- id: SMMM-MES-DIS-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DIS
  kazanim: cezalar
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 3568 sayılı Kanun Disiplin Yönetmeliği'ne göre, tekerrür ve takdir hakkı kullanımı bulunmadığı varsayıldığında,
    aşağıdaki eylem-ceza eşleştirmelerinden hangisi **yanlıştır**?
  secenekler:
    A: 'Aday meslek mensubunun mesleğin vakar ve onuru ile bağdaşmayan işler yapmasına bilerek izin verilmesi: Uyarma'
    B: 'Reklam yasağına uyulmaması: Kınama'
    C: 'Asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi: Kınama'
    D: 'Beyanname ve bildirimlerin imzalanması ve denetimi ile ilgili ilke, kural ve ilan olunmuş norm ve standartlara
      kasten aykırı davranılması: Geçici olarak mesleki faaliyetten alıkoyma'
    E: 'Kasıt olmaksızın, gerekli özen ve titizlik yeterince gösterilmeden beyanname ve bildirimlerin imzalanması:
      Geçici olarak mesleki faaliyetten alıkoyma'
  dogru: E
  aciklama:
    dogru_neden: 'E şıkkındaki eylem md. 6/1 (n) kapsamındadır: kasıt olmaksızın gerekli özen ve titizlik gösterilmeden
      beyanname ve bildirimlerin imzalanması kınama cezasını gerektirir. Geçici olarak mesleki faaliyetten alıkoyma
      cezası ise md. 7/1 (f)''ye göre aynı eylemin kasten yapılması hâlinde uygulanır.'
    celdiriciler:
      A: md. 5 (c)'ye göre aday meslek mensubunun mesleğin vakar ve onuru ile bağdaşmayan işler yapmasına neden
        olunması veya bilerek izin verilmesi uyarma cezası gerektirir; eşleştirme doğrudur.
      B: md. 6/1 (f)'ye göre reklam yasağına uyulmaması kınama cezası gerektirir; eşleştirme doğrudur.
      C: md. 6/1 (g)'ye göre asgari ücret tarifesindeki ücretlerin altında iş kabul edilmesi kınama cezası gerektirir;
        eşleştirme doğrudur.
      D: md. 7/1 (f)'ye göre ilke, kural ve norm ve standartlara kasten aykırı davranılması geçici olarak mesleki
        faaliyetten alıkoyma cezası gerektirir; eşleştirme doğrudur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 5 (c)
    alinti: 'Uyarma cezası aşağıdaki durumlarda uygulanır : ... c) Aday meslek mensubunun, mesleğin vakar ve onuru
      ile bağdaşmayan işler yapmasına neden olunması veya bilerek izin verilmesi veya bu eyleme göz yumulması,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/1 (f), (g) ve (n)
    alinti: 'Kınama cezası, aşağıdaki durumlarda uygulanır: ... f) Meslek mensuplarınca, reklam yasağına uyulmaması,
      g) (Değişik:RG-27/09/2007-26656) Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında
      iş kabul edilmesi, ... n) Meslek mensuplarınca, kasıt olmaksızın gerekli özen ve titizlik yeterince gösterilmeden;
      yasal düzenlemelere ve ilan olunmuş norm ve standartlara aykırı olarak beyanname ve bildirimlerin imzalanması,
      denetlenmesi ve tasdik edilmesi,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/1 (f)
    alinti: f) Meslek mensuplarınca, beyanname ve bildirimlerin imzalanması ve denetimi ile ilgili yasal düzenlemelerdeki
      ilke ve kurallarla, ilan olunmuş norm ve standartlara kasten aykırı davranılması veya beyanname imzalama ve
      denetim yetkisinin kasten gerçeğe aykırı olarak kullanılması.
  gecerlilik:
    baslangic: '2023-10-07'
