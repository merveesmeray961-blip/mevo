      cezası ile cezalandırılmasından sonra bu cezayı gerektiren eylemin yeniden işlenmesi meslekten çıkarma cezasını
      gerektirir.
    celdiriciler:
      A: Tekrarlanan eylem için özel hüküm meslekten çıkarma cezasını öngörür; uyarma uygulanmaz.
      B: Kınama, md. 9/1-a'daki tekrar koşulunda uygulanacak ceza değildir.
      C: Bir yıla kadar geçici faaliyetten alıkoyma genel ceza türünün sınırıdır; burada md. 9/1-a'daki özel tekrar
        hükmü uygulanır.
      D: Yeminli sıfatını kaldırma yalnız YMM'lere ilişkin özel koşullarda uygulanır; verilen olayda kanundaki özel
        sonuç meslekten çıkarmadır.
