    ve bu cezaları gerektiren eylemlerden sonra aynı nitelikte yeni bir eylem işlemiştir. Disiplin Yönetmeliği'ne
    göre yeni eylem bakımından aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Yeni eylem için yalnız uyarma cezası verilebilir.
    B: Yeni eylem için yalnız kınama cezası verilebilir.
    C: Yeni eylem için en fazla bir yıl süreyle geçici olarak mesleki faaliyetten alıkoyma cezası verilebilir.
    D: Yeni eylem için yeminli sıfatını kaldırma cezası zorunludur.
