- id: SMMM-MES-DIS-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: cezalar
  tip: uygulama
  zorluk: 3
  kok: Bir meslek mensubu beş yıllık dönem içinde iki kez geçici olarak mesleki faaliyetten alıkoyma cezası almış
    ve bu cezaları gerektiren eylemlerden sonra aynı nitelikte yeni bir eylem işlemiştir. Disiplin Yönetmeliği'ne
    göre yeni eylem bakımından aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Yeni eylem için yalnız uyarma cezası verilebilir.
    B: Yeni eylem için yalnız kınama cezası verilebilir.
    C: Yeni eylem için en fazla bir yıl süreyle geçici olarak mesleki faaliyetten alıkoyma cezası verilebilir.
    D: Yeni eylem için yeminli sıfatını kaldırma cezası zorunludur.
    E: Beş yıllık dönem içinde iki kez geçici olarak mesleki faaliyetten alıkoyma cezasından sonra bu cezayı gerektiren
      eylemin yeniden işlenmesi hâlinde meslekten çıkarma cezası uygulanır.
  dogru: E
  aciklama:
    dogru_neden: Disiplin Yönetmeliği md. 9/1-a'ya göre beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma
      cezası ile cezalandırılmasından sonra bu cezayı gerektiren eylemin yeniden işlenmesi meslekten çıkarma cezasını
      gerektirir.
    celdiriciler:
      A: Tekrarlanan eylem için özel hüküm meslekten çıkarma cezasını öngörür; uyarma uygulanmaz.
      B: Kınama, md. 9/1-a'daki tekrar koşulunda uygulanacak ceza değildir.
      C: Bir yıla kadar geçici faaliyetten alıkoyma genel ceza türünün sınırıdır; burada md. 9/1-a'daki özel tekrar
        hükmü uygulanır.
      D: Yeminli sıfatını kaldırma yalnız YMM'lere ilişkin özel koşullarda uygulanır; verilen olayda kanundaki özel
        sonuç meslekten çıkarmadır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Disiplin Yönetmeliği
    madde: md. 9/1-a
    alinti: a) Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra
