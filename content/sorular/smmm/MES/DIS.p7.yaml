  kazanim: duyurulan cezalar
  tip: kavrama
  zorluk: 2
  kok: Bir meslek mensubu hakkında uyarma, kınama, geçici olarak mesleki faaliyetten alıkoyma ve meslekten çıkarma
    cezalarından biri kesinleşmiştir. Disiplin cezalarının duyurulmasına ilişkin düzenlemeye göre aşağıdakilerden
    hangisi **doğrudur**?
  secenekler:
    A: Uyarma ve kınama cezaları Hazine ve Maliye Bakanlığına duyurulur; diğer cezalar duyurulmaz.
    B: Uyarma dışındaki tüm disiplin cezaları Hazine ve Maliye Bakanlığına duyurulur.
    C: Kınama dışındaki tüm disiplin cezaları Hazine ve Maliye Bakanlığına duyurulur.
    D: Uyarma ve kınama cezaları hariç diğer disiplin cezaları Hazine ve Maliye Bakanlığı ile diğer ilgili kurum
      ve kuruluşlara duyurulur.
    E: Yalnız meslekten çıkarma cezası Hazine ve Maliye Bakanlığına duyurulur.
  dogru: D
  aciklama:
    dogru_neden: Disiplin Yönetmeliği md. 12'ye göre uyarma ve kınama cezaları hariç diğer disiplin cezaları Hazine
      ve Maliye Bakanlığı ile diğer ilgili kurum ve kuruluşlara duyurulur.
    celdiriciler:
      A: Uyarma ve kınama cezaları duyuru kapsamı dışında bırakılmıştır; diğer cezalar duyurulur.
      B: Uyarma da duyuru dışında olduğu için ifade doğru kapsamı vermez; kınama da duyuru dışındadır.
      C: Kınama da uyarma gibi duyuru kapsamı dışındadır.
      E: Geçici olarak mesleki faaliyetten alıkoyma ve yeminli sıfatının kaldırılması da duyuru kapsamındadır.
  kaynaklar:
