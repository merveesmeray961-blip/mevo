    cezalarından biri kesinleşmiştir. Disiplin cezalarının duyurulmasına ilişkin düzenlemeye göre aşağıdakilerden
    hangisi **doğrudur**?
  secenekler:
    A: Uyarma ve kınama cezaları Hazine ve Maliye Bakanlığına duyurulur; diğer cezalar duyurulmaz.
    B: Uyarma dışındaki tüm disiplin cezaları Hazine ve Maliye Bakanlığına duyurulur.
    C: Kınama dışındaki tüm disiplin cezaları Hazine ve Maliye Bakanlığına duyurulur.
    D: Uyarma ve kınama dışındaki cezalar Bakanlık ile diğer ilgili kurum ve kuruluşlara duyurulur.
