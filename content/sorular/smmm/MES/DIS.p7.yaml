- id: SMMM-MES-DIS-0009
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: duyurulan cezalar
  tip: kavrama
  zorluk: 2
  kok: 3568 sayılı Kanun'a göre disiplin cezaları hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Geçici olarak mesleki faaliyetten alıkoyma cezası altı aydan az olmamak üzere en çok iki yıl süreyle verilir.
    B: Meslekten çıkarma cezası, ruhsatnamenin üç yıl süreyle geri alınmasıdır.
    C: Kınama cezası, meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir.
    D: Geçici olarak mesleki faaliyetten alıkoyma cezası altı aydan az, bir yıldan çok olmamak üzere verilir.
    E: Disiplin cezası verilmeden önce savunma alınması, ilgili disiplin kurulunun takdirine bağlıdır.
  dogru: D
  aciklama:
    dogru_neden: Kanun md. 48, disiplin cezalarını (uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma,
      meslekten çıkarma) ve süreleri düzenler; geçici olarak mesleki faaliyetten alıkoyma altı aydan az, bir yıldan
      çok olmamak üzere verilir. Savunması alınmadan disiplin cezası verilemez.
    celdiriciler:
      A: Kanun md. 48/c süreyi altı aydan az, bir yıldan çok olmamak üzere belirler; iki yıl öngörülmemiştir.
      B: Meslekten çıkarma, ruhsatnamenin geri alınarak bir daha mesleğin icrasına izin verilmemesidir; süreli değildir.
      C: Bu tanım uyarma cezasına aittir; kınama, meslek mensubuna görevinde ve davranışında kusurlu sayıldığının
