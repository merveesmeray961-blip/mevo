    celdiriciler:
      A: Uyarma ve kınama cezaları duyuru kapsamı dışında bırakılmıştır; diğer cezalar duyurulur.
      B: Uyarma da duyuru dışında olduğu için ifade doğru kapsamı vermez; kınama da duyuru dışındadır.
      C: Kınama da uyarma gibi duyuru kapsamı dışındadır.
