- id: SMMM-MES-DIS-0007
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: cezalar
  tip: uygulama
  zorluk: 3
  kok: Bir meslek mensubu hakkında, meslek ruhsatnamesini başka bir kişiye bedelsiz olarak kullandırdığı tespit
    edilmiştir. Disiplin cezasının türü ve sonucu bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Uyarma cezası verilir; ruhsatname meslek mensubunda kalır.
    B: Kınama cezası verilir; ruhsatname bir yıl süreyle askıya alınır.
    C: Geçici olarak mesleki faaliyetten alıkoyma cezası verilir; ruhsatname geri alınmaz.
    D: Yeminli sıfatı kaldırılır; ruhsatname meslek mensubunda kalır.
    E: Meslekten çıkarma cezası verilir; ruhsatname geri alınır ve mesleğin yeniden icrasına izin verilmez.
  dogru: E
  aciklama:
    dogru_neden: Disiplin hükümlerinde ruhsatnamesini bir başkasına bedelli veya bedelsiz kullandırdığı tespit edilen
      meslek mensubuna meslekten çıkarma cezası verileceği düzenlenmiştir. Meslekten çıkarma, ruhsatnamenin geri
      alınarak mesleğin bir daha yürütülmesine izin verilmemesidir.
    celdiriciler:
      A: Fiil için Kanunda uyarma değil, meslekten çıkarma cezası öngörülmüştür.
      B: Kanunda bu fiil için kınama ve bir yıllık askı şeklinde bir yaptırım bulunmamaktadır.
      C: Geçici olarak mesleki faaliyetten alıkoyma ayrı bir ceza türüdür; ruhsatı başkasına kullandırma meslekten
        çıkarma sonucunu doğurur.
      D: Yeminli sıfatının kaldırılması bu fiil için öngörülen ceza değildir; Kanun meslekten çıkarmayı düzenlemektedir.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 48
    alinti: (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları
      tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen,
      imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 48
    alinti: e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine
