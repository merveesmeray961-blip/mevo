- id: SMMM-MES-DIS-0022
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: duyurulan cezalar
  tip: kavrama
  zorluk: 2
  kok: Disiplin Yönetmeliği'nde geçici olarak mesleki faaliyetten alıkoyma veya meslekten çıkarma cezasının kesinleşmesi sonrasında
    uygulanacak işlemler bakımından aşağıdaki sıralamalardan hangisi doğrudur?
  secenekler:
    A: Ceza kesinleşir → 60 günlük teslim süresi başlar → yeni iş kabul etmeye devam edilir → ruhsat daha sonra teslim edilir.
    B: Ceza kesinleşir → yalnızca ceza süresi sonunda işler odaya teslim edilir → bu sürede mühür kullanılabilir.
    C: Ceza kesinleşir → önce yeni iş kabul edilir → 60 gün sonunda mevcut işler odaya teslim edilir.
    D: Ceza kesinleşir → yalnızca YMM'ler için iş teslimi gerekir → SMMM'ler mevcut işlerini sürdürebilir.
    E: Ceza kesinleşir → mesleki iş kabul edilemez ve mühür/kaşe kullanılamaz → eldeki işler 60 gün içinde odaya teslim edilir.
  dogru: E
  aciklama:
    dogru_neden: 'Yönetmeliğe göre geçici olarak mesleki faaliyetten alıkoyma, meslekten çıkarma veya yeminli sıfatının kaldırılması
      cezaları kesinleştikten sonra ilgili kişiler iş kabul edemez ve mühür veya kaşe kullanamaz; eldeki işler de kesinleşme
      tarihinden itibaren 60 gün içinde odaya teslim edilir. Püf noktaları: Süre cezanın bitiminden değil, kesinleşme tarihinden
      başlar.'
