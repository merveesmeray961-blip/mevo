- id: SMMM-MES-DIS-0018
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: itiraz süreleri
  tip: uygulama
  zorluk: 3
  kok: Bir Oda Disiplin Kurulu kararı 3 Haziran 2026'da meslek mensubuna bildirilmiştir. Meslek mensubu itiraz dilekçesini
    posta ile göndermiş ve dilekçe 2 Temmuz 2026'da kurum evrakına girmiştir. Ayrıca başka bir meslek mensubu aynı tür karara
    hiç itiraz etmemiştir. Disiplin Yönetmeliği'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Posta ile gönderilen dilekçede gönderim tarihi esas alınır; ikinci karar da 30 gün sonunda değil 60 gün sonunda kesinleşir.
    B: Posta ile gönderilen dilekçede kurum evrakına giriş tarihi esas alınır; süresinde itiraz edilmeyen Oda Disiplin Kurulu
      kararı itiraz süresinin geçmesiyle kendiliğinden kesinleşir.
    C: İtiraz süresi bildirimden itibaren 15 gündür; ikinci karar bildirimden hemen sonra kesinleşir.
    D: Posta ile gönderilen dilekçede tebliğ tarihi esas alınır; ikinci karar için ayrıca Birlik Disiplin Kurulu kararı gerekir.
    E: İtiraz süresi 30 gün değil 20 gündür; posta ile gönderimde gönderim tarihi esas alınır.
  dogru: B
  aciklama:
    dogru_neden: 'Md. 28''e göre Oda Disiplin Kurulu kararlarına karşı bildirimden itibaren 30 gün içinde itiraz edilebilir
      ve posta ile yapılan itirazlarda dilekçenin kurum evrakına girdiği tarih itiraz tarihi sayılır. Md. 29''a göre süresinde
      itiraz edilmeyen kararlar itiraz süresinin geçirilmesiyle kendiliğinden kesinleşir. Püf noktaları: Posta yönünden gönderim
      tarihi değil kurum evrakına giriş tarihi önemlidir; ayrıca itiraz edilmeyen karar için yeni bir Birlik kararı beklenmez.'
    celdiriciler:
      A: Yönetmelik posta itirazında gönderim tarihini değil kurum evrakına giriş tarihini esas alır; ayrıca süresinde itiraz
        edilmeyen karar kendiliğinden kesinleşir.
      C: İtiraz süresi 30 gündür ve karar kendiliğinden kesinleşmesi için sürenin geçirilmesi gerekir.
      D: Posta ile itirazda kurum evrakına giriş tarihi esas alınır; tebliğ tarihi bu özel kuralın yerine geçmez.
      E: Md. 28'de süre 30 gündür ve posta bakımından kurum evrakına giriş tarihi esas alınır.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik Disiplin Yönetmeliği
    madde: md. 28
    alinti: Oda disiplin kurulunun kararlarına karşı ilgililer bildirim tarihinden itibaren 30 gün içinde ilgili oda aracılığı
      ile veya doğrudan Birlik Disiplin Kuruluna itiraz edebilirler.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik Disiplin Yönetmeliği
    madde: md. 28
    alinti: Posta ile yapılan itirazlarda, itiraz dilekçesinin kurum evrakına girdiği tarih, itiraz tarihi olarak kabul edilir.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik Disiplin Yönetmeliği
    madde: md. 29
    alinti: Birlik Disiplin Kuruluna otuz gün içinde itiraz edilmeyen ilgili Oda Disiplin Kurulu kararları, itiraz süresinin
