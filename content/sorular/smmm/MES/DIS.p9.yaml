- id: SMMM-MES-DIS-0020
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Disiplin Yönetmeliği
  konu: DIS
  kazanim: cezalar
  tip: kavrama
  zorluk: 3
  kok: Disiplin Yönetmeliği'nde yer alan ceza türleri ve bunların uygulanma koşulları karşılaştırıldığında aşağıdaki eşleştirmelerden
    hangisi doğrudur?
  secenekler:
    A: Üç yıllık dönemde üçüncü kez kınama cezası gerektiren eylemin yinelenmesi → geçici olarak mesleki faaliyetten alıkoyma
    B: Sahip olunmayan unvanın kullanılması → meslekten çıkarma
    C: Ticari faaliyet yasağına uyulmaması → kınama
    D: Meslek ruhsatnamesinin başkasına kullandırılması → geçici olarak mesleki faaliyetten alıkoyma
    E: Beş yıllık dönemde iki kez geçici olarak faaliyetten alıkoymadan sonra aynı fiilin yeniden işlenmesi → kınama
  dogru: A
  aciklama:
    dogru_neden: 'Madde 7/a, üç yıllık dönem içinde üçüncü kez kınama cezası gerektiren bir hal veya eylemin yinelenmesini
      geçici olarak mesleki faaliyetten alıkoyma cezası kapsamında düzenler. Diğer seçeneklerde ceza türleri daha hafif veya
      yanlış kategoriye bağlanmıştır. Püf noktaları: Üç yıllık tekrar kuralı ile beş yıllık tekerrür kuralı farklı sonuçlara
      bağlanır.'
    celdiriciler:
      B: Sahip olunmayan unvanın kullanılması Madde 6/b kapsamında kınama cezasıdır.
      C: Ticari faaliyet yasağına uyulmaması Madde 7/e kapsamında geçici olarak mesleki faaliyetten alıkoyma cezasıdır.
      D: Ruhsatın başkasına kullandırılması Madde 9/d kapsamında meslekten çıkarma cezasıdır.
      E: Beş yıllık dönemde iki kez geçici faaliyetten alıkoymadan sonra aynı fiilin yeniden işlenmesi Madde 9/a kapsamında
        meslekten çıkarmaya götürür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/a-b
    alinti: 'a) (Değişik:RG-27/09/2007-26656) Üç yıllık bir dönem içinde (Ek ibare:

      RG-07/10/2023-32332) üçüncü kez uyarma cezası gerektiren herhangi

      bir eylemin yinelenmesi,


      b) Meslek mensuplarınca, sahip olunmayan unvanların kullanılması,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/a
    alinti: 'Madde 7 - (Değişik:RG-27/09/2007-26656)

      Geçici olarak mesleki faaliyetten alıkoyma cezası, her bir eylem için altı

      aydan az, bir yıldan çok olmamak üzere aşağıdaki hâllerde uygulanır.

      a) Üç yıllık bir dönem içinde (Ek ibare: RG-07/10/2023-32332) üçüncü

      kez kınama cezası gerektiren herhangi bir hâl ve eylemin yinelenmesi.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/e
    alinti: 'd) Müşterilerden makbuz düzenlemek veya her türlü yöntem ile topladık-

      ları para veya para hükmündeki değerleri kendisine veya bir başkasına

      mal edilmesi veya emanetin inkar edilmesi.

      e) Ticari faaliyet yasağına uyulmaması.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 9/a
    alinti: 'Madde 9 - Meslekten çıkarma cezası aşağıdaki hallerde uygulanır:

      a) Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası

      ile cezalandırılmasından sonra bu cezayı gerektiren eylemin yeniden

      işlenmesi,'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 9/d
    alinti: 'd) (Değişik:RG-27/09/2007-26656) Meslek ruhsatnamesinin bir başka-

      sına kiraya verilmesi, herhangi bir şekilde bir başkasına kullandırılması

      veya meslek mensubunun mesleki konulardaki yetkilerini genel vekâ-

      letname ve/veya düzenleme şeklinde vekâletname ile veya muvazaa

      yoluyla yahut da başka kanunlardaki düzenlemeleri kötüye kullanarak,

      mesleğini bizzat yapmayıp, yetkilerini devamlı ya da geçici olarak mes-

      lek mensubu olmayan kişilere kullandırması, kendi adına müşteri kabul

      etmesine, resmî belgelerde mühür ya da kaşesinin kullanılmasına izin

      verilmesi.'
