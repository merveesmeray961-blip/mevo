  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: Köke ilk iki kınama cezasının Eylül 2026'dan (son eylemden) önce kesinleştiği açıkça eklendi; gecerlilik.baslangic
      2026-10-03 → 2023-10-07.
    neden: 'G5 (küçük): Disiplin Yön. md. 11/3''ün aradığı ''ilk iki cezanın kesinleşip bildirilmesi'' koşulu kökte
      yalnız anlatım sırasından anlaşılıyordu. md. 7/1-a (ek ibare) ve md. 11 RG-07/10/2023-32332 ile değişti.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: E çeldiricisi düzeltildi (md. 4/2(c) ve md. 7/1'e göre 6 ay–1 yıl; yalnız md. 7 ek fıkrasındaki 153/A hâlinde
      3 yıl; 1–2 yıl aralığı yok); atıflar fıkra düzeyine çıkarıldı (md. 4/2(c), 6/1(d), 7/1(a), 9/1(a)); md. 4/2(c)
      alıntısı eklendi; teknik not 'Püf noktaları:' biçimine getirildi.
    neden: 'Bağımsız hakem bulgusu (3 Ekim 2026, no. 25): E çeldiricisi ''bir yıldan fazla olamaz'' diyerek md.
      7 ek fıkrasıyla çelişiyordu.'
  - tarih: '2026-10-04'
    kim: hakem
    ne: Püf noktalarındaki '(gereksiz veri)' ifadesi 'çözüme etki etmeyen veridir' olarak değiştirildi.
    neden: 'hakem 2026-10-04: öğrenciye dönük metinde yazar terimi.'
