- id: SMMM-MES-DIS-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: DIS
  kazanim: Disiplin cezalarında tekerrür — kınamanın yinelenmesi ve geçici olarak mesleki faaliyetten alıkoyma
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: (A), serbest muhasebeci mali müşavirdir. (A)'nın Mart 2024'te reklam yasağına uymaması ve Şubat 2025'te asgari
    ücret tarifesinin altında iş kabul etmesi nedeniyle verilen iki kınama cezası kesinleşmiş ve (A)'ya bildirilmiştir.
    (A) ayrıca 2023 yılında adres değişikliğini süresinde bildirmediği için uyarma cezası almıştır. (A), Eylül 2026'da
    yazılı hizmet sözleşmesi yapmadan bir defter tutma işini kabul etmiştir. 3568 sayılı Kanun Disiplin Yönetmeliği'ne
    göre, disiplin kurulunun bir derece ağır veya hafif ceza takdir hakkını kullanmadığı varsayıldığında, (A)'ya
    son eylemi nedeniyle uygulanacak ceza aşağıdakilerden hangisidir?
  secenekler:
    A: Kınama
    B: Altı aydan az, bir yıldan çok olmamak üzere geçici olarak mesleki faaliyetten alıkoyma
    C: Üç yıl süreyle geçici olarak mesleki faaliyetten alıkoyma
    D: Meslekten çıkarma
    E: Bir yıldan az, iki yıldan çok olmamak üzere geçici olarak mesleki faaliyetten alıkoyma
  dogru: B
  aciklama:
    dogru_neden: 'Yazılı hizmet sözleşmesi yapmadan iş kabul edilmesi tek başına kınama cezası gerektiren bir eylemdir
      (md. 6(d)). Ancak md. 7(a)''ya göre "Üç yıllık bir dönem içinde üçüncü kez kınama cezası gerektiren herhangi
      bir hâl ve eylemin yinelenmesi" geçici olarak mesleki faaliyetten alıkoyma cezasını gerektirir ve bu ceza
      her bir eylem için altı aydan az, bir yıldan çok olmamak üzere uygulanır. Mart 2024 – Eylül 2026 arası üç
      yılı aşmadığı ve md. 11/3''ün aradığı şekilde ilk iki kınama cezası kesinleşip ilgiliye bildirildiği için
      tekerrür hükmü işler. Kullanılan teknikler: (1) tarih/süre hesabı — üç yıllık dönemin hesabı; (2) gereksiz
      veri — 2023 tarihli uyarma cezası kınama tekerrürünü etkilemez; (3) yakın kavram ayrımı — kınamanın yinelenmesinde
      üç yıllık dönem ve alıkoyma, alıkoymanın yinelenmesinde beş yıllık dönem ve meslekten çıkarma uygulanır. Tuzak,
      son eylemin niteliğine bakıp yalnızca kınama cezası verilmesidir.'
    celdiriciler:
      A: Son eylem tek başına kınama gerektirse de üç yıllık dönem içinde üçüncü kez kınama gerektiren eylem yinelendiği
        için md. 7(a) uyarınca daha ağır olan geçici alıkoyma cezası uygulanır.
      C: Üç yıl süreyle geçici alıkoyma, md. 7'nin ek fıkrasına göre VUK md. 153/A'nın birinci fıkrasında sayılan
        haller nedeniyle mükellefiyeti terkin edilenlerin fiillerine iştirak ettiği kesinleşen meslek mensuplarına
        uygulanır; olayla ilgisi yoktur.
      D: Meslekten çıkarma md. 9(a)'ya göre beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası
        ile cezalandırıldıktan sonra bu cezayı gerektiren eylemin yeniden işlenmesi halinde uygulanır; (A) hiç alıkoyma
        cezası almamıştır.
      E: Geçici alıkoyma cezasının süresi md. 4(c) ve md. 7'ye göre altı aydan az, bir yıldan fazla olamaz; bir-iki
        yıl aralığı Yönetmelikte yoktur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/1 (a)
    alinti: 'Geçici olarak mesleki faaliyetten alıkoyma cezası, her bir eylem için altı aydan az, bir yıldan çok
      olmamak üzere aşağıdaki hâllerde uygulanır. a) Üç yıllık bir dönem içinde (Ek ibare: RG-07/10/2023-32332)
      üçüncü kez kınama cezası gerektiren herhangi bir hâl ve eylemin yinelenmesi.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 11/1 ve 11/3
    alinti: Disiplin kurulları, gerekçesini kararda belirtmek kaydıyla bir derece ağır veya bir derece hafif disiplin
      cezası uygulanmasına karar verebilirler. ... 6 ncı maddenin birinci fıkrasının (a) bendi, 7 nci maddenin birinci
      fıkrasının (a) bendi ve 9 uncu maddenin birinci fıkrasının (a) bendinin tatbiki için, ilk iki cezanın kesinleşip
      ilgiliye bildirilmesi ve buna rağmen belirtilen süre içerisinde aynı cezayı gerektiren yeni bir disiplin suçunun
      işlenmesi gerekmektedir.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/1 (d), (f), (g)
    alinti: d) Meslek mensuplarınca, (Mülga ibare:RG-04/08/2015-29435) (...) Serbest Muhasebeci Mali Müşavir ve
      Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelikte öngörülen yazılı hizmet sözleşmesi
      yapmadan iş kabul edilmesi, ... f) Meslek mensuplarınca, reklam yasağına uyulmaması, g) (Değişik:RG-27/09/2007-26656)
      Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi,
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 9/1 (a) ve md. 7 (ek fıkra)
    alinti: a) Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra
      bu cezayı gerektiren eylemin yeniden işlenmesi, ... 213 sayılı Vergi Usul Kanununun 153/A maddesinin birinci
      fıkrasında sayılan haller dolayısıyla mükellefiyeti terkin edilenlerin bu fiillerine iştirak ettikleri inceleme
      raporuyla tespit edilen ve bu durumları kesinleşen meslek mensupları hakkında üç yıl süreyle geçici olarak
      mesleki faaliyetten alıkoyma cezası uygulanır.
