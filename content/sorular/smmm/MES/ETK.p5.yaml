- id: SMMM-MES-ETK-0003
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: ETK
  kazanim: temel etik ilkeler
  tip: kavrama
  zorluk: 2
  soru_bicimi: oncullu
  kok: 'SMMM ve YMM''lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler''e göre temel etik ilkelerine ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Gizlilik ilkesinden doğan sorumluluk, meslek mensubunun müşteri ya da işveren ile ilişkisi sona erdiğinde
    de devam eder.


    II. Mesleki yeterlilik ve özen ilkesi gereği meslek mensubu, kendi otoritesi altında çalışanların da uygun mesleki
    eğitim almalarını ve gözetim altında tutulmalarını sağlamalıdır.


    III. Mesleki davranış ilkesi yalnızca kanun ve yönetmeliklere aykırı davranışlardan kaçınmayı kapsar; kanuna
    aykırı olmayan bir davranış mesleğin itibarını zedeleyecek nitelikte sayılmaz.


    IV. Gizlilik ilkesi gereği meslek mensubu, mesleki ilişkisi sonucu elde ettiği gizli bilgiyi kişisel çıkarı
    ya da üçüncü kişilerin yararına kullanmamalı, kullanıyor izlenimi de bırakmamalıdır.'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade Ek-1 Birinci Kısım md. 13/1''e, II numaralı ifade md. 11/3''e, IV numaralı ifade
      md. 12/1 (b)''ye uygundur. III numaralı ifade yanlıştır: md. 16/1''e göre mesleki davranış ilkesi hem kanun
      ve düzenlemelere uyma hem de mesleğin itibarını zedeleyecek davranışlardan kaçınma yükümlülüğü getirir; mesleğin
      itibarını zedeleyecek davranışlar, tüm gerekli bilgilere sahip üçüncü kişi ya da grubun mesleğin adını olumsuz
      etkileyeceğini düşündüğü davranışları da kapsar.


      Püf noktaları: Her ifade farklı bir temel ilkeye ve maddeye dayanır (md. 11/3, 12/1-b, 13/1, 16/1); hangi
      yükümlülüğün hangi ilkeden doğduğunu ayırın. Gizlilik yükümlülüğü ilişki bittiğinde sona ermez. Mesleki davranış
      ilkesi yalnız yasaya uygunluğa indirgenemez; itibarı zedeleyen ama yasaya aykırı olmayan davranışlar da kapsama
      girer. Tuzak: "yalnızca" ifadesiyle ilkenin kapsamını daraltan III numaralı ifadeyi doğru sanmak.'
    celdiriciler:
      A: I ve II doğrudur; ancak IV numaralı ifade de md. 12/1 (b)'ye uygun olduğundan seçenek eksiktir.
      B: III numaralı ifade md. 16/1'e aykırıdır; mesleğin itibarını zedeleyecek davranışlar yalnız yasaya aykırı
        davranışlarla sınırlı değildir. Ayrıca doğru olan I ve IV dışarıda kalmıştır.
      C: III numaralı ifade yanlış olduğundan I, II ve III birlikte doğru değildir; doğru olan IV de seçenekte yoktur.
      D: III numaralı ifade md. 16/1'e aykırıdır; ayrıca doğru olan I seçenekte yer almamıştır.
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 11/3
    alinti: (3) Meslek mensubu, kendi otoritesi altında çalışanların da uygun meslekî eğitim almalarını ve gözetim
      altında tutulmalarını sağlamalıdır.
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 12/1 (b) ve md. 13/1
    alinti: b) Meslekî ilişkisi sonucu elde edilen gizli bilgiyi kişisel çıkar uğruna ya da üçüncü kişilerin yararına
      kullanmaması ya da kullanıyor izlenimi bırakmaması gerekmektedir. ... (1) Meslek mensubunun gizlilik sorumluluğu
      müşteri ya da işveren ile ilişkisi sona erdiği zaman bile devam eder.
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 16/1
    alinti: (1) Meslekî davranış ilkesi, meslek mensuplarına, mesleğin itibarını zedeleyecek davranışlardan kaçınma
      ve ilgili kanun ve düzenlemelere uyma yükümlülüğünü getirmektedir. Mesleğin itibarını zedeleyecek davranışlar
      tüm gerekli bilgilere sahip üçüncü kişi ya da grup tarafından da, mesleğin adını olumsuz etkileyeceği düşünülen
      davranışları kapsar.
