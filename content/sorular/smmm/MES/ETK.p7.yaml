- id: SMMM-MES-ETK-0009
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: önlemler
  tip: uygulama
  zorluk: 3
  kok: 'Etik İlkeler Yönetmeliği''ne göre tehditleri ortadan kaldıran veya kabul edilebilir düzeye indiren önlemler hakkında
    aşağıdakilerden hangisi doğrudur?


    (i) Önlemler iki büyük gruba ayrılır: mevzuat ile oluşturulabilecek önlemler ve iş çevresinden sağlanacak önlemler.

    (ii) Mevzuat ile oluşturulabilecek önlemlere örnek: mesleğe giriş için eğitim/staj/tecrübe gereksinimleri, sürekli mesleki
    gelişim, kurumsal yönetim, mesleki standartlar, izleme ve disiplin prosedürleri, dış kontrol.

    (iii) Saptanan tehditlerin önemsiz olmadığı durumlarda meslek mensubu bunları ortadan kaldıracak veya kabul edilebilir
    düzeye indirecek önlemleri uygulamalıdır.'
  secenekler:
    A: Yalnız (i)
    B: Yalnız (ii)
    C: (i) ve (ii)
