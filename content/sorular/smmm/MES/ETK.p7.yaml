  konu: ETK
  kazanim: Etik İlkeler Yönetmeliği — beş temel tehdit
  tip: uygulama
  zorluk: 3
  kok: Bir meslek mensubu, müşterisinin paylarına sahip olması nedeniyle finansal çıkar taşımaktadır. Aynı mensup,
    daha önce kendisinin hazırladığı bir raporu bu kez denetleyerek yeniden değerlendirecektir. Bu iki durumun oluşturduğu
    tehditler aşağıdakilerden hangisinde doğru eşleştirilmiştir?
  secenekler:
    A: Yakınlık — Yıldırma Amaçlı
    B: Kişisel Çıkar — Yeniden Değerlendirme
    C: Taraf Tutma — Yakınlık
    D: Yeniden Değerlendirme — Kişisel Çıkar
    E: Yıldırma Amaçlı — Taraf Tutma
  dogru: B
  aciklama:
    dogru_neden: 'İlk durum meslek mensubunun müşterideki finansal çıkarından kaynaklandığı için Kişisel Çıkar Tehdididir.
      İkinci durum daha önce alınmış bir kararın aynı meslek mensubunca yeniden değerlendirilmesi olduğundan Yeniden
      Değerlendirme Tehdididir. Püf noktaları: Finansal çıkar ile önceki çalışmanın yeniden değerlendirilmesi iki
      ayrı tehdit türüdür; olayın müşteriyle yakınlık içermesi gerekmez.'
    celdiriciler:
      A: Yakınlık tehdidi yakın ilişkilerden, yıldırma tehdidi ise gerçek veya hissedilen tehdit nedeniyle tarafsız
        davranmaktan kaçınmaya zorlanmadan doğar.
      C: Finansal çıkar, taraf tutma veya yakınlık değil Kişisel Çıkar Tehdidi olarak sınıflandırılır.
      D: İki durumun sırası ters kurulmuştur; ilk olay Kişisel Çıkar, ikinci olay Yeniden Değerlendirme Tehdididir.
      E: Olaylarda yıldırma veya tarafsızlığı tehlikeye düşüren bir durum ya da fikir bulunmamaktadır.
