      İkinci durum daha önce alınmış bir kararın aynı meslek mensubunca yeniden değerlendirilmesi olduğundan Yeniden Değerlendirme
      Tehdididir. Püf noktaları: Finansal çıkar ile önceki çalışmanın yeniden değerlendirilmesi iki ayrı tehdit türüdür; olayın
      müşteriyle yakınlık içermesi gerekmez.'
