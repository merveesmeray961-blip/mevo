- id: SMMM-MES-ETK-0004
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: beş temel tehdit
  tip: uygulama
  zorluk: 3
  kok: 'Bir meslek mensubunun karşılaştığı beş ayrı durum aşağıda verilmiştir: (I) Yakın aile üyesinin finansal çıkarı, (II)
    daha önce verdiği bir kararı yeniden değerlendirmesi, (III) bir görüşü tarafsızlığını tehlikeye düşürecek biçimde savunması,
    (IV) müşteriyle yakın ilişki nedeniyle onun çıkarına uygun davranması, (V) gerçek veya hissedilen tehdit nedeniyle tarafsız
    davranmaktan kaçınmaya zorlanması. Bu durumların tehdit türleriyle eşleştirilmesi aşağıdakilerden hangisinde doğru verilmiştir?'
  secenekler:
    A: I-Kişisel çıkar, II-Yeniden değerlendirme, III-Taraf tutma, IV-Yakınlık, V-Yıldırma amaçlı
    B: I-Yakınlık, II-Taraf tutma, III-Kişisel çıkar, IV-Yıldırma amaçlı, V-Yeniden değerlendirme
    C: I-Kişisel çıkar, II-Taraf tutma, III-Yeniden değerlendirme, IV-Yakınlık, V-Yıldırma amaçlı
    D: I-Yeniden değerlendirme, II-Kişisel çıkar, III-Yakınlık, IV-Taraf tutma, V-Yıldırma amaçlı
    E: I-Kişisel çıkar, II-Yeniden değerlendirme, III-Yakınlık, IV-Taraf tutma, V-Yıldırma amaçlı
  dogru: A
  aciklama:
    dogru_neden: 'Yönetmelik md. 3''te kişisel çıkar, yeniden değerlendirme, taraf tutma, yakınlık ve yıldırma amaçlı tehditler
      ayrı ayrı tanımlanmıştır. Verilen beş olay sırasıyla bu beş tanıma uymaktadır. Püf noktaları: Yeniden değerlendirme
      daha önce alınmış kararın tekrar incelenmesi; yakınlık ise kurulan yakın ilişkinin kişinin çıkarına göre davranmaya
      yol açmasıdır.'
    celdiriciler:
      B: İlk iki ve sonraki eşleştirmelerde tehdit türleri yer değiştirmiştir; md. 3'teki tanımlarla uyuşmaz.
      C: III numaralı olay taraf tutma değil yeniden değerlendirme olarak yazılmıştır; II numaralı olay ise yeniden değerlendirmedir.
      D: I numaralı olay kişisel çıkar tehdididir; II numaralı olay da yeniden değerlendirme tehdididir.
      E: III numaralı olay taraf tutma tehdididir; IV numaralı olay yakınlık tehdididir.
  kaynaklar:
  - mevzuat: Meslek Mensuplarının Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 3
    alinti: 'a) Kişisel Çıkar Tehditleri: Meslek mensubunun kendisinin veya yakın ailesinden bir üyenin finansal veya diğer
      çıkarları sonucu ortaya çıkabilecek tehditlerdir.'
  - mevzuat: Meslek Mensuplarının Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 3
    alinti: 'b) Yeniden Değerlendirme Tehditleri: Daha önceden alınmış bir kararın o karardan sorumlu meslek mensubu tarafından
      yeniden değerlendirilmesi nedeniyle oluşan tehditlerdir.'
  - mevzuat: Meslek Mensuplarının Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 3
    alinti: 'c) Taraf Tutma Tehditleri: Meslek mensubunun bir durum ya da fikri, tarafsızlığını tehlikeye düşürecek bir noktaya
      taşıması sonucu oluşan tehditlerdir.'
  - mevzuat: Meslek Mensuplarının Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 3
    alinti: 'ç) Yakınlık Tehditleri: Üçüncü kişilerle kurulan yakın ilişkiler sonucu, meslek mensubunun bu kişilerin çıkarlarına
      uygun olacak şekilde davranması sonucu ortaya çıkabilecek tehditlerdir.'
  - mevzuat: Meslek Mensuplarının Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 3
    alinti: 'd) Yıldırma Amaçlı Tehditler: Meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan
      kaçınmaya zorlanması (yıldırılması) sonucu ortaya çıkabilecek tehditlerdir.'
