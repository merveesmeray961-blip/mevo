- id: SMMM-MES-ETK-0055
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: beş temel tehdit
  tip: kavrama
  zorluk: 1
  kok: 'Aşağıdaki olaylar ile Etik İlkeler Yönetmeliği''ndeki tehdit türleri birlikte değerlendirilmektedir.


    I. Bir müşteri, meslek mensubunu olumsuz bir görüş vermesi hâlinde sözleşmeyi feshetmekle tehdit etmektedir.

    II. Meslek mensubu, daha önce kendisinin verdiği bir kararı yeniden değerlendirmek zorunda kalmaktadır.

    III. Meslek mensubu, yakın ilişkisi bulunan bir kişinin çıkarına uygun hareket etmektedir.


    Bu olayların tehdit türleriyle doğru eşleştirilmesi aşağıdakilerden hangisidir?'
  secenekler:
    A: I-Yıldırma amaçlı · II-Yeniden değerlendirme · III-Yakınlık
    B: I-Yakınlık · II-Taraf tutma · III-Kişisel çıkar
    C: I-Taraf tutma · II-Yıldırma amaçlı · III-Yeniden değerlendirme
    D: I-Kişisel çıkar · II-Yakınlık · III-Taraf tutma
    E: I-Yeniden değerlendirme · II-Kişisel çıkar · III-Yıldırma amaçlı
  dogru: A
  aciklama:
    dogru_neden: I, gerçek veya hissedilen tehdit nedeniyle tarafsız davranmaktan kaçınmaya zorlama olduğu için yıldırma amaçlı
      tehdittir. II, daha önce alınmış bir kararın aynı sorumlu meslek mensubunca yeniden değerlendirilmesi olduğu için yeniden
      değerlendirme tehdididir. III, yakın ilişki nedeniyle diğer kişinin çıkarına uygun davranma olduğundan yakınlık tehdididir.
    celdiriciler:
      B: I yıldırma amaçlı, II yeniden değerlendirme ve III yakınlık tehdididir; bu şık üç eşleştirmeyi de değiştirir.
      C: I, II ve III için verilen tehdit türleri Yönetmelikteki tanımlarla uyuşmamaktadır.
      D: I tehdit nedeniyle baskı, II önceki kararın yeniden değerlendirilmesi ve III yakınlık ilişkisi olduğundan bu eşleştirme
        yanlıştır.
      E: II yeniden değerlendirme, III yakınlık tehdididir; I ise yıldırma amaçlı tehdittir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-b
    alinti: 'b) Yeniden Değerlendirme Tehditleri: Daha önceden alınmış bir kararın

      o karardan sorumlu meslek mensubu tarafından yeniden değerlendiril-

      mesi nedeniyle oluşan tehditlerdir.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-ç
    alinti: 'ç) Yakınlık Tehditleri: Üçüncü kişilerle kurulan yakın ilişkiler sonucu,

      meslek mensubunun bu kişilerin çıkarlarına uygun olacak şekilde dav-

      ranması sonucu ortaya çıkabilecek tehditlerdir.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-d
    alinti: 'd) Yıldırma Amaçlı Tehditler: Meslek mensubunun gerçek veya hisse-

      dilen tehditler nedeniyle tarafsız davranmaktan kaçınmaya zorlanması

      (yıldırılması) sonucu ortaya çıkabilecek tehditlerdir.'
