  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: temel etik ilkeler
  tip: kavrama
  zorluk: 3
  kok: Etik İlkeler Yönetmeliği'ndeki temel etik ilkeler ile aşağıdaki davranışlar eşleştirilmiştir. Hangi eşleştirme doğrudur?
  secenekler:
    A: Müşteri yöneticisinin baskısı nedeniyle mesleki kararı değiştirmek — tarafsızlık
    B: Teknik standartlara uygun, özenli ve gayretli çalışmak — gizlilik
    C: Mesleki ilişkiden edinilen bilgiyi yetki veya görev olmadan açıklamak — mesleki davranış
    D: Yasa ve yönetmeliklere uymak, mesleğin itibarını zedeleyecek davranışlardan kaçınmak — mesleki yeterlilik ve özen
    E: Tüm iş ilişkilerinde doğru sözlü ve dürüst davranmak — tarafsızlık
  dogru: A
  aciklama:
    dogru_neden: Yönetmelik tarafsızlığı, yanlı veya önyargılı davranışların ve üçüncü kişilerin haksız baskılarının mesleki
      kararları etkilememesi olarak tanımlar. Bu nedenle müşterinin baskısının mesleki kararı değiştirmemesi tarafsızlık ilkesiyle
      ilgilidir.
    celdiriciler:
      B: Teknik ve mesleki standartlara uygun, özenli ve gayretli davranmak mesleki yeterlilik ve özen ilkesidir.
      C: Yetki veya görev olmadıkça mesleki bilgiyi açıklamamak gizlilik ilkesidir.
      D: Yasa ve yönetmeliklere uymak ve itibarı zedeleyecek davranışlardan kaçınmak mesleki davranış ilkesidir.
      E: Doğru sözlü ve dürüst davranmak dürüstlük ilkesidir.
