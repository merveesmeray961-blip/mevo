      alınması bir önlemdir.
    B: Farklı sözleşme ekiplerinin kullanılması bir önlem olabilir.
    C: Bilgiye ulaşımı engelleyen süreçler oluşturulması bir önlemdir.
    D: Firma ortakları ve çalışanları tarafından gizlilik anlaşmaları yapılması bir önlem olabilir.
    E: Çıkar çatışması bulunan tüm müşterilere, başka hiçbir değerlendirme yapılmaksızın özel hizmet sunulması zorunludur.
  dogru: E
  aciklama:
    dogru_neden: Yönetmeliğin 37 nci maddesi çatışmaya bağlı olarak bilgi verme ve onay alma, farklı sözleşme ekipleri, bilgiye
      erişimi engelleyen süreçler ve gizlilik anlaşmaları gibi önlemleri saymaktadır. Çıkar çatışması bulunan tüm müşterilere
      özel hizmet sunulmasını zorunlu kılan bir hüküm yoktur.
    celdiriciler:
      A: Md. 37/b'de ilgili tüm taraflara bilgi verilmesi ve onaylarının alınması düzenlenmiştir.
      B: Md. 37/ç'de farklı sözleşme ekiplerinin kullanılması sayılmıştır.
      C: Md. 37/d'de bilgiye ulaşımı engelleyen süreçler oluşturulması sayılmıştır.
      D: Md. 37/f'de gizlilik anlaşmaları yapılması sayılmıştır.
