  kok: 'Etik İlkeler Yönetmeliği''ne göre aşağıdaki öncüllerden hangileri tehditleri ortadan kaldıran veya kabul edilebilir
    bir düzeye indiren önlemlere ilişkin doğrudur?


    I. Mesleğe giriş için gerekli eğitim, meslekî eğitim ve tecrübe gereksinimleri mevzuat ile oluşturulabilecek önlemlerdendir.

    II. Farklı sözleşme ekiplerinin kullanılması, çıkar çatışmasına ilişkin bir önlemdir.

    III. Firma ortakları ve çalışanları tarafından imzalanan gizlilik anlaşmaları yapılması, çıkar çatışmasına ilişkin bir
    önlemdir.'
