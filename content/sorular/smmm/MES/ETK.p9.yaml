- id: SMMM-MES-ETK-0021
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: beş temel tehdit
  tip: uygulama
  zorluk: 3
  kok: 'Aşağıdaki üç olayın Etik İlkeler Yönetmeliği''ndeki tehdit türleriyle eşleştirilmesi istenmektedir: I. Meslek mensubu,
    raporunda istediği sonucu yazmazsa müşterinin sözleşmeyi sona erdireceği yönünde baskı görmektedir. II. Meslek mensubu,
    savunduğu bir görüşü desteklemek üzere mesleki bir toplantıda kamuya açık biçimde taraf olmaktadır. III. Uzun yıllardır
    aynı müşteriyle çok yakın ilişki içinde bulunan meslek mensubu, müşterinin çıkarlarına uygun davranma eğilimi göstermektedir.
    Buna göre doğru eşleştirme hangisidir?'
  secenekler:
    A: I-Yıldırma, II-Taraf Tutma, III-Yakınlık
    B: I-Yakınlık, II-Yıldırma, III-Taraf Tutma
    C: I-Kişisel Çıkar, II-Yakınlık, III-Yıldırma
    D: I-Taraf Tutma, II-Kişisel Çıkar, III-Yeniden Değerlendirme
    E: I-Yeniden Değerlendirme, II-Taraf Tutma, III-Kişisel Çıkar
  dogru: A
  aciklama:
    dogru_neden: 'Md. 3''e göre gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan kaçınmaya zorlanma yıldırma
      tehdididir; bir durum veya fikri tarafsızlığı tehlikeye düşürecek noktaya taşıma taraf tutma tehdididir; üçüncü kişilerle
      yakın ilişkiler sonucu onların çıkarlarına uygun davranma yakınlık tehdididir. Püf noktaları: Olayın kaynağına bakın;
      baskı yıldırmayı, savunulan görüşe angaje olma taraf tutmayı, uzun süreli yakın ilişki ise yakınlığı gösterir.'
    celdiriciler:
      B: I'deki müşteri baskısı yakınlık değil yıldırma tehdididir; II de yıldırma değil taraf tutmadır.
      C: I yıldırma tehdididir; III ise yıldırma değil yakınlık tehdididir.
      D: I'deki baskı taraf tutma değil yıldırmadır; II yeniden değerlendirme değil taraf tutmadır.
      E: I yeniden değerlendirme değildir; daha önce alınmış kararın yeniden incelenmesi söz konusu değildir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-c
    alinti: 'c) Taraf Tutma Tehditleri: Meslek mensubunun bir durum ya da fikri, tarafsızlığını tehlikeye düşürecek bir noktaya
      taşıması sonucu oluşan tehditlerdir.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-ç
    alinti: 'ç) Yakınlık Tehditleri: Üçüncü kişilerle kurulan yakın ilişkiler sonucu, meslek mensubunun bu kişilerin çıkarlarına
      uygun olacak şekilde davranması sonucu ortaya çıkabilecek tehditlerdir.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
      Hakkında Yönetmelik
    madde: md. 3/1-d
    alinti: 'd) Yıldırma Amaçlı Tehditler: Meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan
      kaçınmaya zorlanması (yıldırılması) sonucu ortaya çıkabilecek tehditlerdir.'
