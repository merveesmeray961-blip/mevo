      önlem olarak sayılmış; md. 37'de farklı sözleşme ekipleri ile gizlilik anlaşmaları çıkar çatışmasına ilişkin önlemler
      arasında gösterilmiştir.
    celdiriciler:
      A: II ve III de doğru olduğundan yalnız I eksik bir cevaptır.
      B: I ve III de doğru olduğundan yalnız II eksik bir cevaptır.
      C: III de doğru olduğundan I ve II ile sınırlı değildir.
      D: I de doğru olduğundan II ve III ile sınırlı değildir.
