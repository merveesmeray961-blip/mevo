- id: SMMM-MES-ETK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: ETK
  kazanim: Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi örnekleri ve yakınlık tehdidinden ayrımı
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
    Hakkında Yönetmelik ekindeki etik ilkelere göre, aşağıdakilerden hangisi bağımsız çalışan meslek mensubu için
    kişisel çıkar tehdidi yaratabilecek durumlara örnek **değildir**?
  secenekler:
    A: Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık
    B: Müşteri ile yakın iş ilişkisi kurulması
    C: Güvence sağlama sözleşmesi ile ilgili şarta bağlı ücretler
    D: Güvence sağlama müşterisinden veya yöneticilerinden borç alınması
    E: Üst düzey personelin güvence sağlama müşterisiyle uzun süreli arkadaşlık ilişkisi
  dogru: E
  aciklama:
    dogru_neden: 'Ek-1 Etik İlkeler İkinci Kısım md. 24/1-(d), "Üst düzey personel ile güvence sağlama müşterisi
      arasında uzun süreli arkadaşlık ilişkisinin olması"nı bağımsız çalışan meslek mensubu için yakınlık tehdidi
      yaratabilecek durumlar arasında sayar; md. 48/1 de ailevi veya kişisel bir ilişkinin tarafsızlık ilkesine
      yönelik yakınlık tehdidi oluşturabileceğini belirtir. Bu durum md. 21/1''deki kişisel çıkar tehdidi örnekleri
      arasında yer almaz. Birinci Kısım md. 3/1''deki tanımlara göre de buradaki tehdit, meslek mensubunun finansal
      veya diğer çıkarlarından (a bendi) değil, üçüncü kişilerle kurulan yakın ilişkiden (ç bendi) doğar. Diğer
      dört şık md. 21/1''de kişisel çıkar tehdidi örneği olarak açıkça sayılmıştır. Tuzak, B şıkkındaki "yakın iş
      ilişkisi" ifadesinin yalnız yakınlık tehdidi sanılmasıdır: müşteri ile yakın iş ilişkisi kurmak md. 21/1-(c)''de
      kişisel çıkar tehdidi örneğidir.'
    celdiriciler:
      A: Md. 21/1-(b)'de kişisel çıkar tehdidi örneği olarak sayılmıştır.
      B: Md. 21/1-(c)'de "Müşteri ile yakın iş ilişkisi kurmak" kişisel çıkar tehdidi örneği olarak sayılmıştır.
        Md. 48/1'e göre yakın bir iş ilişkisi tarafsızlık ilkesine yönelik yakınlık tehdidi de oluşturabilir; ancak
        bu, onu md. 21/1'deki kişisel çıkar örneği olmaktan çıkarmaz.
      C: Md. 21/1-(e)'de kişisel çıkar tehdidi örneği olarak sayılmıştır; md. 42/1 de şarta bağlı ücretlerin tarafsızlık
        ilkesine yönelik kişisel çıkar tehdidine neden olabileceğini belirtir.
      D: Md. 21/1-(f)'de güvence sağlama müşterisinden veya yöneticilerden borç alınması kişisel çıkar tehdidi örneği
        olarak sayılmıştır.
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 21/1 (b)–(f)
    alinti: 'Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi yaratabilecek durumlara verilebilecek bazı
      örnekler şunlar olabilir: ... b) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık. c) Müşteri ile
      yakın iş ilişkisi kurmak. ç) Müşteriyi kaybetme olasılığını dikkate alma. d) Müşteri tarafından istihdam edilme
      olasılığı. e) Güvence sağlama sözleşmesi ile ilgili şarta bağlı ücretler. f) Güvence sağlama müşterisinden
      veya yöneticilerden borç alınması ya da güvence sağlama müşterisine/yöneticilerine borç verilmesi.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 24/1 (d)
    alinti: 'Bağımsız çalışan meslek mensubu için yakınlık tehdidi yaratabilecek durumlara verilebilecek bazı örnekler
      şunlar olabilir: ... d) Üst düzey personel ile güvence sağlama müşterisi arasında uzun süreli arkadaşlık ilişkisinin
      olması.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 48/1
    alinti: Bağımsız çalışan meslek mensubu, herhangi bir hizmet sunarken, müşteri, yönetici veya çalışanları ile
      olan ilişkilerinin tarafsızlık temel ilkesine yönelik tehdit oluşturmamasına dikkat etmelidir. Örneğin; ailevi
      veya kişisel bir ilişki ya da yakın bir iş ilişkisi tarafsızlık ilkesine yönelik yakınlık tehdidi oluşturabilir.
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 3/1 (a) ve (ç)
    alinti: 'a) Kişisel Çıkar Tehditleri: Meslek mensubunun kendisinin veya yakın ailesinden bir üyenin finansal
      veya diğer çıkarları sonucu ortaya çıkabilecek tehditlerdir. ... ç) Yakınlık Tehditleri: Üçüncü kişilerle
      kurulan yakın ilişkiler sonucu, meslek mensubunun bu kişilerin çıkarlarına uygun olacak şekilde davranması
      sonucu ortaya çıkabilecek tehditlerdir.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 42/1
    alinti: Güvence sağlamaya yönelik sözleşmelerin bazı türlerinde şarta bağlı ücret geniş ölçüde kullanılmaktadır.
      Ancak, bu tür ücretler temel etik ilkelere yönelik tehditlere, örneğin tarafsızlık ilkesine yönelik kişisel
      çıkar tehdidine neden olabilir.
  gecerlilik:
    baslangic: '2007-10-19'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: E şıkkı (müşteriden önemsiz olmayan hediye alınması) 'Üst düzey personelin güvence sağlama müşterisiyle
      uzun süreli arkadaşlık ilişkisi' (md. 24/1-d) ile değiştirildi; B şıkkı (istihdam olasılığı, md. 21/1-d) yerine
      'Müşteri ile yakın iş ilişkisi kurulması' (md. 21/1-c) tuzak çeldiricisi kondu. dogru_neden, çeldiriciler
      ve kaynaklar (md. 21/1, 24/1-d, 48/1, 3/1, 42/1) yeniden yazıldı; gecerlilik.baslangic 2007-10-19 (Yönetmeliğin
      RG tarihi; md. 3, 21, 24, 42, 48 değişmemiş).
    neden: 'G5/G6 kaldı: Ek-1 md. 46/1 müşteriden hediye kabulünü açıkça ''objektiflik ilkesine yönelik kişisel
      çıkar tehdidi'' saydığından eski E de kişisel çıkar örneğiydi ve sorunun doğru cevabı yoktu. Yeni E md. 21/1
      ve md. 46 kapsamına girmiyor; md. 24/1-d ve md. 48/1 onu yalnız yakınlık tehdidi olarak sınıflandırıyor.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: E (güven 5); B: E (güven 5)'
        tarih: '2026-10-03'
- id: SMMM-MES-ETK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: ETK
  kazanim: Temel etik ilkelere yönelik tehdit türlerinin tanınması
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: Bir müşterisinin finansal sisteminin tasarım ve uygulamasına katılan bağımsız çalışan meslek mensubu, daha
    sonra aynı sistemin işleyişi hakkında rapor vermektedir. Etik İlkeler Hakkında Yönetmelik ekindeki etik ilkelere
    göre bu durum, temel etik ilkelere yönelik tehditlerden hangisine örnektir?
  secenekler:
    A: Kişisel çıkar tehditleri
    B: Yeniden değerlendirme tehditleri
    C: Taraf tutma tehditleri
    D: Yakınlık tehditleri
    E: Yıldırma amaçlı tehditler
  dogru: B
  aciklama:
    dogru_neden: Ek-1 Birinci Kısım md. 3(1)(b)'ye göre yeniden değerlendirme tehditleri, "Daha önceden alınmış
      bir kararın o karardan sorumlu meslek mensubu tarafından yeniden değerlendirilmesi nedeniyle oluşan tehditlerdir."
      İkinci Kısım md. 22(1)(b) de "Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin işleyişi
      hakkında rapor verilmesi"ni tekrar değerlendirme tehdidi örneği olarak sayar. Meslek mensubu kendi tasarladığı
      sistemi değerlendirmektedir.
    celdiriciler:
      A: Kişisel çıkar tehdidi, meslek mensubunun veya yakın ailesinden bir üyenin finansal veya diğer çıkarları
        sonucu ortaya çıkar (md. 3(1)(a)); olayda bir çıkar ilişkisi değil, kendi işini değerlendirme söz konusudur.
      C: Taraf tutma tehdidi, meslek mensubunun bir durum ya da fikri tarafsızlığını tehlikeye düşürecek bir noktaya
        taşımasıdır (md. 3(1)(c)); olayda müşteri adına taraf olma yoktur.
      D: Yakınlık tehdidi, üçüncü kişilerle kurulan yakın ilişkiler sonucu ortaya çıkar (md. 3(1)(ç)); olayda yakın
        ilişki unsuru yoktur.
      E: Yıldırma amaçlı tehdit, meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan
        kaçınmaya zorlanmasıdır (md. 3(1)(d)); olayda baskı unsuru yoktur.
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 3/1 (a)–(c)
    alinti: 'a) Kişisel Çıkar Tehditleri: Meslek mensubunun kendisinin veya yakın ailesinden bir üyenin finansal
      veya diğer çıkarları sonucu ortaya çıkabilecek tehditlerdir. b) Yeniden Değerlendirme Tehditleri: Daha önceden
      alınmış bir kararın o karardan sorumlu meslek mensubu tarafından yeniden değerlendirilmesi nedeniyle oluşan
      tehditlerdir. c) Taraf Tutma Tehditleri: Meslek mensubunun bir durum ya da fikri, tarafsızlığını tehlikeye
      düşürecek bir noktaya taşıması sonucu oluşan tehditlerdir.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 22/1 (b)
    alinti: 'Bağımsız çalışan meslek mensubu için tekrar değerlendirme tehdidi yaratabilecek durumlara verilebilecek
      bazı örnekler şunlar olabilir: ... b) Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin
      işleyişi hakkında rapor verilmesi,'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 3/1 (ç)–(d)
    alinti: 'ç) Yakınlık Tehditleri: Üçüncü kişilerle kurulan yakın ilişkiler sonucu, meslek mensubunun bu kişilerin
      çıkarlarına uygun olacak şekilde davranması sonucu ortaya çıkabilecek tehditlerdir. d) Yıldırma Amaçlı Tehditler:
      Meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan kaçınmaya zorlanması (yıldırılması)
      sonucu ortaya çıkabilecek tehditlerdir.'
  gecerlilik:
    baslangic: '2007-10-19'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: Birinci kaynağın madde etiketi 'md. 3/1 (a)–(d)' → 'md. 3/1 (a)–(c)' (alıntı yalnız a–c bentlerini içeriyor);
      gecerlilik.baslangic 2026-10-03 → 2007-10-19.
    neden: 'G6 (küçük) etiket/alıntı uyumsuzluğu; G5 (küçük) üretim tarihi yerine yürürlük tarihi. Ek-1 md. 3 ve
      22 değişiklik notu taşımıyor; Yönetmelik 19.10.2007 RG''de yayımlanıp yayımı tarihinde yürürlüğe girdi (md.
      8). md. 46 sorunu bu soruda yok: tasarım/işleyiş örneği Ek-1''de yalnız md. 22/1-b''de (tekrar değerlendirme)
      geçiyor.'
