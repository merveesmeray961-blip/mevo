- id: SMMM-MES-ETK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: ETK
  kazanim: Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi örnekleri ve yakınlık tehdidinden ayrımı
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler
    Hakkında Yönetmelik ekindeki etik ilkelere göre, aşağıdakilerden hangisi bağımsız çalışan meslek mensubu için
    kişisel çıkar tehdidi yaratabilecek durumlara örnek **değildir**?
  secenekler:
    A: Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık
    B: Müşteri tarafından istihdam edilme olasılığı
    C: Güvence sağlama sözleşmesi ile ilgili şarta bağlı ücretler
    D: Güvence sağlama müşterisinden veya yöneticilerinden borç alınması
    E: Değeri önemsiz olmayan bir hediyenin müşteriden alınması
  dogru: E
  aciklama:
    dogru_neden: 'Ek-1 Etik İlkeler, İkinci Kısım md. 24(1)(ç)''de "Değeri önemsiz olanlar hariç, bir müşteriden hediye
      veya ayrıcalıklı hizmet alınması" yakınlık tehdidi yaratabilecek durumlar arasında sayılmıştır. Bu nedenle
      müşteriden hediye alınması kişisel çıkar tehdidinin değil yakınlık tehdidinin örneğidir. Tuzak: hediye maddi
      bir çıkar gibi görünse de Yönetmelik onu yakınlık tehdidi altında sınıflandırır.'
    celdiriciler:
      A: Ek-1 md. 21(1)(b)'de kişisel çıkar tehdidi örneği olarak sayılmıştır.
      B: Ek-1 md. 21(1)(d)'de kişisel çıkar tehdidi örneği olarak sayılmıştır.
      C: Ek-1 md. 21(1)(e)'de kişisel çıkar tehdidi örneği olarak sayılmıştır.
      D: Ek-1 md. 21(1)(f)'de güvence sağlama müşterisinden veya yöneticilerden borç alınması kişisel çıkar tehdidi
        örneği olarak sayılmıştır.
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 21/1
    alinti: 'Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi yaratabilecek durumlara verilebilecek bazı örnekler
      şunlar olabilir: ... b) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık. ... d) Müşteri tarafından istihdam
      edilme olasılığı. e) Güvence sağlama sözleşmesi
      ile ilgili şarta bağlı ücretler. f) Güvence sağlama müşterisinden veya yöneticilerden borç alınması ya da güvence
      sağlama müşterisine/yöneticilerine borç verilmesi.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 24/1 (ç)
    alinti: 'Bağımsız çalışan meslek mensubu için yakınlık tehdidi yaratabilecek durumlara verilebilecek bazı örnekler
      şunlar olabilir: ... ç) Değeri önemsiz olanlar hariç, bir müşteriden hediye veya ayrıcalıklı hizmet alınması,'
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-MES-ETK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: ETK
  kazanim: Temel etik ilkelere yönelik tehdit türlerinin tanınması
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: Bir müşterisinin finansal sisteminin tasarım ve uygulamasına katılan bağımsız çalışan meslek mensubu, daha sonra
    aynı sistemin işleyişi hakkında rapor vermektedir. Etik İlkeler Hakkında Yönetmelik ekindeki etik ilkelere göre
    bu durum, temel etik ilkelere yönelik tehditlerden hangisine örnektir?
  secenekler:
    A: Kişisel çıkar tehditleri
    B: Yeniden değerlendirme tehditleri
    C: Taraf tutma tehditleri
    D: Yakınlık tehditleri
    E: Yıldırma amaçlı tehditler
  dogru: B
  aciklama:
    dogru_neden: 'Ek-1 Birinci Kısım md. 3(1)(b)''ye göre yeniden değerlendirme tehditleri, "Daha önceden alınmış bir
      kararın o karardan sorumlu meslek mensubu tarafından yeniden değerlendirilmesi nedeniyle oluşan tehditlerdir."
      İkinci Kısım md. 22(1)(b) de "Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin işleyişi
      hakkında rapor verilmesi"ni tekrar değerlendirme tehdidi örneği olarak sayar. Meslek mensubu kendi tasarladığı
      sistemi değerlendirmektedir.'
    celdiriciler:
      A: Kişisel çıkar tehdidi, meslek mensubunun veya yakın ailesinden bir üyenin finansal veya diğer çıkarları sonucu
        ortaya çıkar (md. 3(1)(a)); olayda bir çıkar ilişkisi değil, kendi işini değerlendirme söz konusudur.
      C: Taraf tutma tehdidi, meslek mensubunun bir durum ya da fikri tarafsızlığını tehlikeye düşürecek bir noktaya
        taşımasıdır (md. 3(1)(c)); olayda müşteri adına taraf olma yoktur.
      D: Yakınlık tehdidi, üçüncü kişilerle kurulan yakın ilişkiler sonucu ortaya çıkar (md. 3(1)(ç)); olayda yakın
        ilişki unsuru yoktur.
      E: Yıldırma amaçlı tehdit, meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan
        kaçınmaya zorlanmasıdır (md. 3(1)(d)); olayda baskı unsuru yoktur.
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 3/1 (a)–(d)
    alinti: 'a) Kişisel Çıkar Tehditleri: Meslek mensubunun kendisinin veya yakın ailesinden bir üyenin finansal veya
      diğer çıkarları sonucu ortaya çıkabilecek tehditlerdir. b) Yeniden Değerlendirme Tehditleri: Daha önceden alınmış
      bir kararın o karardan sorumlu meslek mensubu tarafından yeniden değerlendirilmesi nedeniyle oluşan tehditlerdir.
      c) Taraf Tutma Tehditleri: Meslek mensubunun bir durum ya da fikri, tarafsızlığını tehlikeye düşürecek bir noktaya
      taşıması sonucu oluşan tehditlerdir.'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: İkinci Kısım, md. 22/1 (b)
    alinti: 'Bağımsız çalışan meslek mensubu için tekrar değerlendirme tehdidi yaratabilecek durumlara verilebilecek
      bazı örnekler şunlar olabilir: ... b) Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin
      işleyişi hakkında rapor verilmesi,'
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik, Ek-1 Etik İlkeler
    madde: Birinci Kısım, md. 3/1 (ç)–(d)
    alinti: 'ç) Yakınlık Tehditleri: Üçüncü kişilerle kurulan yakın ilişkiler sonucu, meslek mensubunun bu kişilerin
      çıkarlarına uygun olacak şekilde davranması sonucu ortaya çıkabilecek tehditlerdir. d) Yıldırma Amaçlı Tehditler:
      Meslek mensubunun gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan kaçınmaya zorlanması (yıldırılması)
      sonucu ortaya çıkabilecek tehditlerdir.'
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
