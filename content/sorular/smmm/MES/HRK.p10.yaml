  kok: Bir meslek mensubu yeni müşteri kazanmak amacıyla bürosunu tanıtmak istemektedir. Haksız Rekabet ve Reklam
    Yasağı Yönetmeliği'ne göre aşağıdakilerden hangisi reklam kurallarına uygundur?
  secenekler:
    A: Düzenlediği semineri basın ve yayın yoluyla üçüncü kişilere duyurabilir.
    B: Tabelasına, Yönetmelikte sayılanların yanı sıra hizmetlerini anlatan resim ve fotoğraflar ekleyebilir.
    C: Başlıklı kâğıt ve kartvizitlerini reklam niteliği taşıyacak biçimde düzenleyebilir.
    D: Nesnel kalmak koşuluyla bürosunun tanıtımı için broşür bastırabilir.
    E: Bina cephesine ve büro pencerelerine birden fazla tabela asabilir.
  dogru: D
  aciklama:
    dogru_neden: Haksız Rekabet ve Reklam Yasağı Yönetmeliğinin 13 üncü maddesinin dördüncü fıkrasına göre meslek
      mensubu, bürosunun tanıtımı için broşür bastırabilir. Seminerlerin basın ve yayınla duyurulması, tabela ve
      basılı evrakta reklam niteliği taşıyan düzenlemeler ise yasaktır.
    celdiriciler:
      A: Seminer ve eğitim programları düzenlenebilir ancak bu faaliyetler basın ve yayın yoluyla üçüncü kişilere
        duyurulamaz (md. 13/2).
      B: Tabelada Yönetmelikte belirlenenlerin dışında resim ve fotoğraflara yer verilemez (md. 14/1).
      C: Başlıklı kâğıt, kartvizit ve diğer basılı evrak reklam niteliği taşıyacak şekilde düzenlenemez (md. 15/1).
      E: Bina cephelerine ve pencerelere birden fazla tabela asılamaz (md. 14/3).
