    ödülünü yerel gazetede duyurmuştur. Haksız Rekabet ve Reklam Yasağı Yönetmeliği’ne göre Pelin’in bu duyurusu bakımından
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Duyuru, mesleki unvan kullanılmasa dahi reklam sayılır ve bu nedenle yapılamaz.
    B: Duyuru yalnızca bağlı olunan odanın önceden yazılı izni ile yapılabilir.
    C: Duyuru, ödülün mesleki bir başarıyla ilgili olması şartıyla reklam sayılmaz.
    D: Duyuru yapılabilir, ancak gazete yerine yalnızca bürodaki ilan panosunda yapılmalıdır.
    E: Meslek alanı dışındaki faaliyetten alınan ödülün kamuya duyurulması reklam sayılmaz.
