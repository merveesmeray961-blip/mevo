    A: Meslek mensubunun yalnızca asgari ücret tarifesinin altında ücret talep etmesi veya hiç ücret almadan hizmet vermesi
      gibi tek bir ücret uygulaması
    B: Meslek mensubunun müşterisine verdiği zararın mahkeme kararıyla sabit olduğu her türlü mesleki hata
    C: Meslek mensuplarının birbirleriyle ve iş sahibiyle ilişkilerini etkileyen, dürüstlük kurallarına aykırı davranış ve
      uygulamalar
    D: Meslek mensuplarının yalnızca basın ve yayın yoluyla yaptıkları reklam niteliğindeki açıklamaları
    E: Meslek mensubunun bağlı olduğu odaya bildirmeden büro adresini değiştirmesi
  dogru: C
  aciklama:
    dogru_neden: Yönetmeliğin 4 üncü maddesinin (ç) bendine göre haksız rekabet, meslek mensuplarının birbirleriyle ve iş
      sahibi ile olan ilişkilerini etkileyen aldatıcı veya diğer şekillerdeki dürüstlük kurallarına aykırı davranışları veya
      mesleki uygulamalarıdır.
    celdiriciler:
      A: Asgari ücret tarifesinin altında ücret talep etmek, md. 7/a’da sayılan haksız rekabet hallerinden yalnızca biridir;
        kavramın tanımı değildir.
      B: Mesleki hata ve sorumluluk tanımda yer almaz; tanım, mahkeme kararına değil dürüstlük kurallarına aykırılığa dayanır.
      D: Reklam yoluyla haksız rekabet md. 8’de düzenlenen hallerden biridir; tanım ücret, iş sahibi ilişkileri gibi alanları
        da kapsar.
      E: Adres bildirimi yükümlülüğü haksız rekabet tanımı kapsamında değildir; tanım dürüstlük kurallarına aykırı davranışlara
        ilişkindir.
