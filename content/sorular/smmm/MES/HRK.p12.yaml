    iktisap ettiği bir unvana da sahiptir ve bu işi fiilen yürütmektedir. Aslı ayrıca belediye meclisinde geçmişte üyelik
    yapmıştır. Haksız Rekabet ve Reklam Yasağı Yönetmeliği’ne göre Aslı’nın tabelasında aşağıdakilerden hangisi yer alabilir?
  secenekler:
    A: Mesleki unvanı ile birlikte, kamu tüzel kişilerinden iktisap ettiği tüm unvanlar
    B: Mesleki unvanı ile birlikte, lisansla iktisap ettiği unvanın yalnızca bir tanesi
    C: Mesleki unvanı ile birlikte geçmiş belediye meclisi üyeliği görevi
    D: Mesleki unvanı ile birlikte, işi fiilen yürütmese de lisansını aldığı unvan
    E: Yalnızca lisansla iktisap ettiği unvan, mesleki unvan yazılmadan
  dogru: B
  aciklama:
    dogru_neden: '14 üncü maddenin dördüncü fıkrasına göre meslek mensupları, mesleki unvanlarını kullanmak şartıyla, mesleğin
      konusuna giren işlerle ilgili alanlarda ilgili kamu tüzel kişilerinden lisans ve ruhsat gibi belgeler ile iktisap ettikleri
      unvanlarından sadece birini de kullanabilirler; kullanılacak unvana ilişkin işin fiilen icra ediliyor olması şarttır.
      Püf noktaları: Üç şart birlikte aranır: mesleki unvanın korunması, yalnızca bir ek unvan ve işin fiilen yürütülmesi.'
    celdiriciler:
      A: Yönetmelik, bu şekilde iktisap edilen unvanlardan yalnızca birinin kullanılmasına izin verir.
      C: Tabelada Yönetmelikte belirlenenlerin dışında unvan ve deyime yer verilemez; geçmiş belediye meclisi üyeliği bunlar
        arasında sayılmamıştır.
      D: Unvanın kullanılabilmesi için ilgili işin fiilen icra ediliyor olması şarttır.
      E: Hüküm, mesleki unvanın kullanılmasını şart koşar.
