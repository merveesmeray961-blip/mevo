    haksız rekabet) sayılan haller arasında aşağıdakilerden hangisi **yer almaz**?
  secenekler:
    A: Meslek ruhsatını kiralamak veya menfaat sağlayarak meslek mensubu olmayan kişilere faaliyette bulunma imkânı vermek
    B: Mesleği yasaklananları çalıştırmak
    C: Üçüncü şahısları yanıltacak şekilde gerçeğe aykırı belge düzenlemek ve onaylamak
    D: Mevzuatın emredici kurallarına aykırı davranarak meslek mensupları karşısında haksız avantaj elde etmek
    E: İş sahiplerinden emanet para toplamak ve bu paraya ilişkin belge düzenlemek
  dogru: E
  aciklama:
    dogru_neden: 'İş sahiplerinden emanet para toplamak, 7 nci maddede (ücret ve diğer mali nitelikteki uygulamalar ile haksız
      rekabet) sayılmıştır; 6 ncı maddede yer almaz. Diğer seçenekler 6 ncı maddenin (d), (e), (f) ve (ı) bentlerindedir.
      Püf noktaları: Maddeleri konularıyla ezberleyin; 6 = meslek mensupları ve iş sahipleriyle ilişkiler, 7 = ücret ve mali
      uygulamalar, 8 = reklam yoluyla haksız rekabet.'
    celdiriciler:
      A: Ruhsatın kiralanması veya menfaat karşılığı meslek mensubu olmayanlara faaliyet imkânı verilmesi 6 ncı maddenin (d)
        bendinde sayılmıştır.
      B: Mesleği yapması yasaklananlarla çalışmak veya onlarla işbirliği yapmak (e) bendinde yer alır.
      C: Gerçeğe aykırı belge düzenleyip onaylayarak üçüncü şahısları yanıltmak (f) bendinde yer alır.
      D: Emredici kurallara aykırı davranarak haksız avantaj sağlamak (ı) bendinde yer alır.
