      Türk Ticaret Kanunu’ndaki dava haklarını kullanma imkânı tanır. Püf noktaları: “Zarar görme tehlikesi” ibaresi, fiilen
      zarar şartını ortadan kaldırır; hak “ve/veya” ile birlikte kullanılabilir.'
    celdiriciler:
      B: 10 uncu madde zarar görme tehlikesi bulunan meslek mensubuna da bu hakkı tanır.
      C: 10 uncu maddede şikâyet ve dava hakları “ve/veya” ile birlikte tanınmıştır.
      D: Şikâyet yolu maddede açıkça düzenlenmiştir.
      E: Maddede müşterinin yazılı talebi şartı yoktur.
