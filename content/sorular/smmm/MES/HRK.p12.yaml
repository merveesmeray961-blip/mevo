      kullanabilir.
    B: Şikâyet veya dava hakkı, ancak fiilen zarar doğduktan ve zararın miktarı belirlendikten sonra kullanılabilir.
    C: Okan yalnızca odaya şikâyet edebilir; dava hakkı yalnızca oda tarafından kullanıldığından Türk Ticaret Kanunu kapsamındaki
      dava haklarını kullanamaz.
    D: Okan yalnızca dava açabilir; odaya şikâyet yolu mesleki dayanışma gereği kapalıdır.
    E: Okan’ın hakkı, ancak müşterisinin yazılı talebiyle doğar.
