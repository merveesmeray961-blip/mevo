  aciklama:
    dogru_neden: '13 üncü maddenin beşinci fıkrasına göre meslek mensubunun mesleki faaliyet ve meslek alanı dışında yerel,
      ulusal veya uluslararası düzeydeki herhangi bir faaliyetinin tanıtılması veya aldığı bir ödülün kamuya duyurulması ya
      da üyesi olduğu bir kurumdaki üyeliğini açıklaması reklam sayılmaz. Püf noktaları: Hükmün anahtarı “mesleki faaliyet
      ve meslek alanı dışında” olmasıdır; mesleki bir başarının duyurulması aynı serbestiden yararlanmaz.'
    celdiriciler:
      A: 13 üncü maddenin beşinci fıkrası, bu tür ödül duyurusunu unvan koşuluna bağlamadan reklam saymamıştır.
      B: Maddede oda izni şartı yoktur.
      C: Hüküm tam tersine, mesleki faaliyet ve meslek alanı dışındaki faaliyetleri kapsar.
      D: Hükümde duyuru ortamına yönelik böyle bir kısıt yoktur; kamuya duyurulması reklam sayılmaz.
