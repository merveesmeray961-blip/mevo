    gelmiştir; ancak Okan henüz fiilen bir zarara uğramamıştır. Haksız Rekabet ve Reklam Yasağı Yönetmeliği’ne göre Okan bakımından
    aşağıdakilerden hangisi doğrudur?
  secenekler:
