- id: SMMM-MES-HRK-0053
  sinav: smmm
  bolum: *id001
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: bağımlı çalışan meslek mensubu
  tip: uygulama
  zorluk: 3
  kok: Bir şirkette ücretli ve bağımlı olarak çalışan SMMM Gül, aynı dönemde üç ayrı işletmenin mali müşavirliği için mesleki
    sorumluluk üstlenmiştir. Haksız Rekabet ve Reklam Yasağı Yönetmeliği’ne göre Gül’ün bu davranışı bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Bu yasak yalnızca serbest çalışan meslek mensuplarına özgü olup bağımlı çalışanlar bakımından haksız rekabet sayılmaz,
      çünkü işveren sorumludur.
    B: Bağımlı çalışanın aynı anda birden çok işletmede mesleki sorumluluk üstlenmesi 6 ncı maddenin (h) bendine göre haksız
      rekabettir.
    C: Haksız rekabetin oluşması için üç işletmenin de aynı sektörde faaliyet göstermesi gerekir.
    D: Her işletme ile ayrı yazılı sözleşme yapılmış olması davranışı haksız rekabet olmaktan çıkarır.
    E: Davranış, 6 ncı madde değil yalnızca ücret ve mali nitelikteki uygulamalara ilişkin 7 nci madde kapsamındadır.
  dogru: B
  aciklama:
    dogru_neden: '6 ncı maddenin (h) bendi, bağımlı çalışan meslek mensupları bakımından aynı anda birden çok işletmede mesleki
      sorumluluk üstlenmeyi özellikle haksız rekabet saymıştır. Püf noktaları: Yasağın konusu “bağımlı çalışan” sıfatı ve
      “aynı anda birden çok işletme”dir; sektör, sözleşme biçimi veya ücret ölçüt değildir.'
    celdiriciler:
      A: (h) bendi doğrudan bağımlı çalışan meslek mensuplarına ilişkindir; yasak onlar için konmuştur.
      C: Maddede sektör benzerliği şartı yoktur; birden çok işletmede aynı anda sorumluluk üstlenmek yeterlidir.
      D: Yazılı sözleşme yapılması (h) bendindeki yasağı ortadan kaldırmaz; yasak, sorumluluğun aynı anda üstlenilmesine bağlıdır.
      E: Bu hâl 7 nci maddede değil, 6 ncı maddenin (h) bendinde düzenlenmiştir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
