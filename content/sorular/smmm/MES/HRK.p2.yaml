  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: HRK
  kazanim: Reklam kuralları — tabela
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam
    Yasağı Yönetmeliği'nin tabelaya ilişkin hükümlerine göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Aynı büroda birlikte çalışan meslek mensuplarının ad ve soyadlarının tabelada yer alması isteğe bağlıdır.
    B: Tabelada Oda ve Birlik amblemi ile büronun internet adresi ve elektronik posta adresi yer alabilir.
    C: Tabela, büronun bulunduğu binanın giriş kapısının yanına, giriş holüne veya koridoruna asılabilir.
    D: Bina cephelerine, büro balkonu ve pencerelerine birden fazla tabela asılamaz.
    E: Tabelada Yönetmelikte belirlenenlerin dışında yabancı dillerde yazılmış ifadelere yer verilemez.
  dogru: A
  aciklama:
    dogru_neden: Yönetmelik md. 14/2'ye göre aynı büroda birlikte çalışma hâlinde birlikte çalışan meslek mensuplarının
      ad ve soyadlarının, ortaklık şeklinde çalışılması durumunda ise ortaklık unvanının tabelada yer alması zorunludur;
      isteğe bağlı olduğunu söyleyen A şıkkı yanlıştır.
    celdiriciler:
      B: Doğrudur. md. 14/1'e göre tabelada Oda ve Birlik amblemi, internet adresi ile elektronik posta adresi yer
        alabilir.
      C: Doğrudur. md. 14/3'e göre tabela büronun bulunduğu binanın giriş kapısının yanına, giriş holüne veya koridoruna
        ya da büro giriş kapılarının yanına asılabilir.
      D: Doğrudur. md. 14/3'e göre bina cephelerine, büro balkonu ve pencerelerine birden fazla tabela asılamaz.
      E: Doğrudur. md. 14/1'e göre Yönetmelikte belirlenenlerin dışında unvan, deyim ve yabancı dillerde yazılmış
        ifadelere tabelada yer verilemez.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve
      Reklam Yasağı Yönetmeliği
    madde: md. 14/1
    alinti: Meslek mensupları kullanacakları tabelalarda; oda ve Birlik amblemi, meslek unvanı ile ad ve soyadı,
      ortaklık bürosu unvanı, şirket ise şirket unvanı varsa akademik unvanı, büronun adresi, telefon numarası,
      internet adresi ile elektronik posta adresi yer alabilir. Tabelada bu Yönetmelikte belirlenenlerin dışında
      unvan, deyim, yabancı dillerde yazılmış ifadeler ile sair şekiller, işaret, resim, fotoğraf ve benzerlerine
      yer verilemez.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve
      Reklam Yasağı Yönetmeliği
    madde: md. 14/2-3
    alinti: (2) Aynı büroda birlikte çalışma halinde, birlikte çalışan meslek mensuplarının ad ve soyadlarının,
      ortaklık şeklinde çalışılması durumunda ise ortaklık unvanının tabelada yer alması zorunludur. (3) Tabela,
      büronun bulunduğu binanın giriş kapısının yanına, giriş holü veya koridoruna ya da büro giriş kapılarının
      yanına asılabilir. Bina cephelerine, büro balkonu ve pencerelerine birden fazla tabela asılamaz, benzeri yazılar
      yazılamaz.
