- id: SMMM-MES-HRK-0007
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: Haksız Rekabet ve Reklam Yasağı — ücret uygulamaları
  tip: uygulama
  zorluk: 3
  kok: Bir SMMM; asgari ücret tarifesinin altında ücret talep etmekte, yaptığı işin sonucunda elde edilecek menfaat
    üzerinden iş sahibiyle pay anlaşması yapmakta ve yeni müşteri kazanmak için üçüncü kişiye menfaat vaat etmektedir.
    Ayrıca çalışanlarına iş mevzuatındaki ücret ve sosyal hakları vermemektedir. Bu uygulamalar bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Asgari ücret tarifesinin altında ücret talebi ile pay anlaşması haksız rekabettir; menfaat vaadi ve çalışan
      hakları sözleşme özgürlüğü kapsamındadır.
    B: Düşük ücret, menfaat vaadi ve çalışan haklarının verilmemesi haksız rekabettir; pay anlaşması ücret tarifesi
      saklı olduğundan haksız rekabet sayılmaz.
    C: Sayılan dört uygulamanın dördü de Yönetmelikte ücret ve mali nitelikteki uygulamalara ilişkin haksız rekabet
      hâli olarak sayılmıştır.
    D: Düşük ücret ve çalışan haklarının verilmemesi haksız rekabettir; pay anlaşması ile menfaat vaadi iş sahibinin
      rızası varsa haksız rekabet sayılmaz.
    E: Dört uygulama da mesleki dayanışma ilkesine aykırıdır; ancak haksız rekabet hâli değil, genel ahlak kuralı
      ihlali olarak değerlendirilir.
  dogru: C
  aciklama:
    dogru_neden: 'Yönetmelik md. 7/1''de asgari ücret tarifesinin altında ücret talep etmek, hizmet sonucu elde
      edilen menfaat üzerinden ortaklık pay anlaşması yapmak, üçüncü kişilere menfaat sağlamak veya vaat etmek ve
      çalışanların öngörülen ücret ve sosyal haklarını vermemek özellikle haksız rekabet halleri arasında sayılmıştır.
      Püf noktaları: Düzenleme yalnız düşük ücreti değil, ücretin belirlenme biçimini, iş elde etme yöntemini ve
      çalışanların mali haklarını da kapsar.'
    celdiriciler:
      A: Menfaat vaadi (md. 7/1-e, f) ve çalışan haklarının verilmemesi (md. 7/1-ğ) de açıkça haksız rekabet hâlleri
        arasındadır.
      B: Pay anlaşması md. 7/1-b'de haksız rekabet hâlidir; 'ücret tarifesi saklı kalmak kaydıyla' ifadesi yasağı
        kaldırmaz.
      D: Md. 7/1'de iş sahibinin rızası bir istisna olarak öngörülmemiştir; pay anlaşması ve menfaat vaadi haksız
        rekabettir.
      E: Md. 7/1 bu uygulamaları doğrudan haksız rekabet hâli olarak saymıştır; genel ahlak kuralı ihlali olarak
