- id: SMMM-MES-HRK-0003
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: ücret uygulamaları
  tip: uygulama
  zorluk: 3
  kok: Bir SMMM'nin aşağıdaki uygulamalardan hangisi, Ücret ve diğer mali nitelikteki uygulamalar ile haksız rekabet hükümleri
    birlikte dikkate alındığında **haksız rekabet teşkil etmez**?
  secenekler:
    A: Asgari ücret tarifesinin altında ücret talep ederek hizmet vermek.
    B: Bir meslek mensubuna ücret borcunu ödememiş iş sahibine hizmet vermek.
    C: Sözleşme değerinin altında serbest meslek makbuzu düzenlemek.
    D: İş sahibine ait bilgileri kullanarak ekonomik çıkar sağlamak.
    E: Ücret tarifesindeki asgari miktara uyarak hizmet bedeli belirlemek.
  dogru: E
  aciklama:
    dogru_neden: Haksız Rekabet ve Reklam Yasağı Yönetmeliği md. 7'de asgari ücret tarifesinin altında ücret talep etmek,
      ücret borcu bulunan iş sahibine hizmet vermek, sözleşme değerinin altında belge düzenlemek ve iş sahibine ait bilgileri
      kullanarak ekonomik çıkar sağlamak özellikle haksız rekabet sayılmıştır. Tarifenin asgari miktarına uymak ise yasaklanan
      uygulamalardan değildir.
    celdiriciler:
      A: Asgari ücret tarifesinin altında ücret talep etmek md. 7/1-a kapsamında özellikle haksız rekabet teşkil eder.
      B: Ücret borcunu ödememiş iş sahibine hizmet vermek md. 7/1-c kapsamında özellikle haksız rekabettir.
      C: Sözleşme değerinin altında serbest meslek makbuzu veya fatura düzenlemek md. 7/1-d kapsamındadır.
      D: İş sahiplerine ait veya onlardan elde edilen bilgileri kullanmak suretiyle ekonomik çıkar sağlamak md. 7/1-g kapsamında
        özellikle haksız rekabettir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 7/1
    alinti: a) Asgari ücret tarifesinin altında ücret talep etmek veya ücretsiz hizmet vermek. b) Ücret tarifesindeki düzenlemeler
      saklı kalmak kaydıyla, yapılacak hizmet veya iş sonucu elde edilen menfaat üzerinden iş sahibi ile ortaklık pay anlaşmaları
      yapmak. c) Bir meslek mensubuna olan ücret borcunu ödememiş iş sahibine hizmet vermek.
