    özellikle haksız rekabet teşkil eden hallerden hangisi doğrudur?


    (i) Bir diğer meslek mensubu ile sözleşmesi bulunan iş sahiplerini mevcut sözleşmelere aykırı davranmaya veya
    feshetmeye yöneltmek.

