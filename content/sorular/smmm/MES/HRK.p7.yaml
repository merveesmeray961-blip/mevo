- id: SMMM-MES-HRK-0004
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: haksız rekabet halleri
  tip: uygulama
  zorluk: 2
  kok: Bir SMMM, başka bir meslek mensubu ile sözleşmesi devam eden bir müşteriyi mevcut sözleşmesini feshetmeye yönlendirerek
    kendisiyle sözleşme yapmaya çalışmaktadır. Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Bu davranış yalnızca reklam yasağı kapsamında değerlendirilir.
    B: Müşteri kendi isteğiyle geliyorsa her durumda serbesttir.
    C: Bu davranış özellikle haksız rekabet teşkil eden hallerden biridir.
    D: Sözleşme devam ederken yeni sözleşme yapılması yalnız oda onayına bağlıdır.
    E: Haksız rekabet yalnız ücretlerin düşürülmesi halinde oluşur.
  dogru: C
  aciklama:
    dogru_neden: Yönetmeliğin 6 ncı maddesinde, başka bir meslek mensubu ile sözleşmesi bulunan iş sahiplerinin mevcut sözleşmelere
      aykırı davranmaya veya sözleşmeleri feshetmeye yöneltilmesi özellikle haksız rekabet teşkil eden haller arasında sayılmıştır.
    celdiriciler:
      A: Hüküm doğrudan haksız rekabet hallerini düzenleyen md. 6'da yer almaktadır; yalnız reklam yasağıyla sınırlı değildir.
      B: Müşterinin isteği, mevcut sözleşmeyi feshetmeye yöneltme eylemini md. 6'daki haksız rekabet hükmünden çıkarmaz.
      D: Yönetmelik bu davranışı oda onayına bağlı bir serbestlik olarak değil, haksız rekabet olarak düzenler.
      E: Haksız rekabet halleri yalnız ücretle sınırlı değildir; sözleşmeli müşteriyi feshe yöneltme açıkça sayılmıştır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 6/1-b
    alinti: b) Bir diğer meslek mensubu ile sözleşmesi bulunan iş sahiplerini sözleşme yapmak amacıyla mevcut sözleşmelere
      aykırı davranmaya veya bu sözleşmeleri feshetmeye yöneltmek.
