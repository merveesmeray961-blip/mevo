  kok: Bir SMMM, mesleki faaliyetini tanıtmak için internet sitesini arama motoruna kaydederken adı ve kayıtlı olduğu
    odasının yanında 'en iyi mali müşavir' ifadesini anahtar kelime olarak kullanmak istemektedir. Yönetmeliğe göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: İfade kullanılabilir; internet ortamında reklam yasağı uygulanmaz.
    B: İfade kullanılabilir; yalnız ücret bilgisi verilmediği sürece anahtar kelimeler serbesttir.
    C: İfade kullanılamaz; iş sağlama amacı ve haksız rekabet yaratmamak kaydıyla anahtar kelimeler arasında Yönetmelikte
      sayılan kimlik ve yer bilgileri dışında tanıtım ibaresi kullanılamaz.
    D: İfade yalnız oda yönetim kurulunun yazılı izniyle kullanılabilir.
    E: İfade zorunludur; internet sitesinin meslekiunvanı.tr uzantılı olması bunu gerektirir.
  dogru: C
  aciklama:
    dogru_neden: İnternet uygulamalarına ilişkin hüküm, iş sağlama amacına yönelik olmamak ve haksız rekabete yol
      açmamak kaydıyla anahtar kelime olarak adı, soyadı, büro veya mesleki şirket unvanı, bulunduğu şehir ve kayıtlı
      olunan oda dışındaki sözcük veya tanıtım amaçlı ibarelerin kullanılmasını yasaklar.
    celdiriciler:
      A: Yönetmelik internet uygulamalarını açıkça düzenler; internet ortamı reklam yasağının dışında değildir.
      B: Kısıtlama yalnız ücret bilgisine bağlanmamıştır; anahtar kelimeler için açık bir içerik sınırı vardır.
      D: Yönetmelik bu tür tanıtım ibaresini oda izniyle serbest bırakan bir hüküm getirmemektedir.
      E: Meslekiunvanı.tr uzantısı kullanılması, yasaklanan tanıtım ibaresini zorunlu veya serbest hale getirmez.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve
      Reklam Yasağı Yönetmeliği
    madde: md. 22/3-b
    alinti: b) İş sağlama amacına yönelik olmamak ve meslektaşlarıyla haksız rekabete yol açmamak kaydıyla internet
