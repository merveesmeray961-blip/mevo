- id: SMMM-MES-HRK-0006
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: haksız rekabet halleri
  tip: uygulama
  zorluk: 3
  kok: 'Haksız Rekabet ve Reklam Yasağı Yönetmeliği''ne göre meslek mensupları arasında ve iş sahipleriyle ilişkilerde özellikle
    haksız rekabet teşkil eden hallerden hangisi doğrudur?


    (i) Bir diğer meslek mensubu ile sözleşmesi bulunan iş sahiplerini mevcut sözleşmelere aykırı davranmaya veya feshetmeye
    yöneltmek.

    (ii) Asgari ücret tarifesinin altında ücret talep etmek veya ücretsiz hizmet vermek.

    (iii) Yetki belgeleri ve ruhsatları iptal olduğu halde unvanlarında veya reklamlarında mesleki faaliyette bulundukları
    intibaını yaratacak ibareler kullanmak.

    (iv) Meslek ruhsatının kiralanması veya meslek mensubu olmayan kişilere faaliyette bulunma imkânı sağlamak.'
  secenekler:
    A: Yalnız (i) ve (ii)
    B: Yalnız (i), (iii) ve (iv)
    C: (i), (ii) ve (iii)
    D: (ii), (iii) ve (iv)
    E: (i), (ii), (iii) ve (iv)
  dogru: E
  aciklama:
    dogru_neden: 'Md. 6 (ilişkilerde) (i), (iii), (iv) hallerini; md. 7 (ücret) (ii) halini özellikle haksız rekabet olarak
      sayar. Tümü doğrudur.


      Püf noktaları: Haksız rekabet halleri md. 6 ve 7’de ayrı ayrı listelenir; ücret altı ve ruhsat kiralama gibi tipik tuzaklar
      birlikte bilinmelidir.'
    celdiriciler:
      A: (iii) ve (iv) de doğrudur.
      B: (ii) de doğrudur.
      C: (iv) de doğrudur.
      D: (i) de doğrudur.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 6
    alinti: 'Aşağıda sayılı haller özellikle haksız rekabet teşkil eder: a) Muhasebe ve denetim standartlarına uymamak...
      b) Bir diğer meslek mensubu ile sözleşmesi bulunan iş sahiplerini sözleşme yapmak amacıyla mevcut sözleşmelere aykırı
      davranmaya veya bu sözleşmeleri feshetmeye yöneltmek. ... ç) Yetki belgeleri ve ruhsatları iptal olduğu veya faaliyetleri
      geçici olarak durdurulduğu halde unvanlarında, ilan ve reklamlarında, mesleki faaliyette bulundukları intibaını yaratacak
      kelime veya ibareler kullanmak. d) Meslek ruhsatının kiralanması veya çeşitli menfaatler sağlayarak meslek mensubu olmayan
      kişilere faaliyette bulunma imkanı sağlamak.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 7
    alinti: 'Aşağıda sayılı haller özellikle haksız rekabet teşkil eder: a) Asgari ücret tarifesinin altında ücret talep etmek
      veya ücretsiz hizmet vermek.'
