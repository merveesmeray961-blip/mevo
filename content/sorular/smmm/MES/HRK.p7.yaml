      Reklam Yasağı Yönetmeliği
    madde: md. 7/1
    alinti: a) Asgari ücret tarifesinin altında ücret talep etmek veya ücretsiz hizmet vermek. b) Ücret tarifesindeki
      düzenlemeler saklı kalmak kaydıyla, yapılacak hizmet veya iş sonucu elde edilen menfaat üzerinden iş sahibi
      ile ortaklık pay anlaşmaları yapmak. c) Bir meslek mensubuna olan ücret borcunu ödememiş iş sahibine hizmet
      vermek.
