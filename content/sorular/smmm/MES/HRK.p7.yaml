  kok: Bir meslek mensubu, yeni müşteri kazanmak için asgari ücret tarifesinin altında ücret teklif etmiş, ayrıca başka bir
    meslek mensubuna ücret borcu bulunan iş sahibine hizmet vermeye başlamıştır. Yönetmeliğe göre bu davranışlarla ilgili
    aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Yalnızca asgari ücretin altında ücret teklif etmek haksız rekabettir; ücret borcu bulunan iş sahibine hizmet verilebilir.
    B: Her iki davranış da yalnızca reklam yasağına ilişkindir.
    C: Her iki davranış da ücret ve mali nitelikteki uygulamalarda özellikle haksız rekabet sayılan davranışlar arasındadır.
    D: Ücret borcu bulunan iş sahibine hizmet vermek serbesttir; yalnızca ücretsiz hizmet yasaktır.
    E: Asgari ücret tarifesinin altında ücret teklif etmek haksız rekabet sayılmaz; ancak ücretsiz hizmet vermek yasaktır.
  dogru: C
  aciklama:
    dogru_neden: 'Haksız Rekabet ve Reklam Yasağı Yönetmeliğinin 7 nci maddesi, asgari ücret tarifesinin altında ücret talep
      etmeyi veya ücretsiz hizmet vermeyi ve bir meslek mensubuna olan ücret borcunu ödememiş iş sahibine hizmet vermeyi özellikle
      haksız rekabet teşkil eden davranışlar arasında sayar. Püf noktaları: İki ayrı davranış da aynı maddede düzenlendiğinden
      yalnızca ücretsiz hizmete odaklanmak veya borçlu iş sahibine hizmeti serbest kabul etmek yanlıştır.'
    celdiriciler:
      A: Ücret borcunu ödememiş iş sahibine hizmet vermek de 7 nci maddede özellikle haksız rekabet sayılmıştır.
      B: Düzenleme reklam değil, ücret ve mali nitelikteki uygulamalarda haksız rekabet başlığındadır.
      D: Madde, ücret borcunu ödememiş iş sahibine hizmet vermeyi de özellikle haksız rekabet saymaktadır.
      E: Asgari ücret tarifesinin altında ücret talep etmek açıkça özellikle haksız rekabet sayılmıştır.
