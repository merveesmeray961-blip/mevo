- id: SMMM-MES-HRK-0007
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: Haksız Rekabet ve Reklam Yasağı — ücret uygulamaları
  tip: uygulama
  zorluk: 3
  kok: Bir SMMM; asgari ücret tarifesinin altında ücret talep etmekte, yaptığı işin sonucunda elde edilecek menfaat üzerinden
    iş sahibiyle pay anlaşması yapmakta ve yeni müşteri kazanmak için üçüncü kişiye menfaat vaat etmektedir. Ayrıca çalışanlarına
    iş mevzuatındaki ücret ve sosyal hakları vermemektedir. Bu uygulamalar bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnızca düşük ücret haksız rekabet oluşturur.
    B: Yalnızca üçüncü kişiye menfaat vaadi haksız rekabet oluşturur.
    C: Sayılan dört uygulamanın tamamı ücret ve mali nitelikteki haksız rekabet halleridir.
    D: İlk iki uygulama serbesttir; yalnız çalışanların haklarının verilmemesi yasaktır.
    E: Menfaat üzerinden pay anlaşması, diğer uygulamalardan bağımsız olarak her durumda serbesttir.
  dogru: C
  aciklama:
    dogru_neden: 'Yönetmelik md. 7/1''de asgari ücret tarifesinin altında ücret talep etmek, hizmet sonucu elde edilen menfaat
      üzerinden ortaklık pay anlaşması yapmak, üçüncü kişilere menfaat sağlamak veya vaat etmek ve çalışanların öngörülen
      ücret ve sosyal haklarını vermemek özellikle haksız rekabet halleri arasında sayılmıştır. Püf noktaları: Düzenleme yalnız
      düşük ücreti değil, ücretin belirlenme biçimini, iş elde etme yöntemini ve çalışanların mali haklarını da kapsar.'
    celdiriciler:
      A: Asgari ücretin altında çalışma dışında menfaat üzerinden pay anlaşması, üçüncü kişiye menfaat vaadi ve çalışan haklarının
        verilmemesi de haksız rekabet halleridir.
      B: Üçüncü kişiye menfaat vaadi dışında asgari ücretin altında ücret, menfaat üzerinden pay anlaşması ve çalışan haklarının
        verilmemesi de sayılmıştır.
      D: İlk iki uygulama serbest değildir; asgari ücretin altında ücret ve menfaat üzerinden pay anlaşması açıkça yasaktır.
      E: Menfaat üzerinden ortaklık pay anlaşması, düzenlemede özellikle haksız rekabet hali olarak sayılmıştır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 7/1-(a)-(b)
    alinti: 'a) Asgari ücret tarifesinin altında ücret talep etmek veya ücretsiz hizmet vermek.

      b) Ücret tarifesindeki düzenlemeler saklı kalmak kaydıyla, yapılacak hizmet veya iş sonucu elde edilen menfaat üzerinden
      iş sahibi ile ortaklık pay anlaşmaları yapmak.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 7/1-(e)-(f)
    alinti: 'e) Üçüncü kişilere ücret ya da herhangi bir menfaat sağlamak veya vaat etmek suretiyle iş almak.

      f) İş sahiplerine menfaat sağlamayı vaat etmek veya menfaat sağlamak ve bu suretle iş almak.'
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
