- id: SMMM-MES-HRK-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: haksız rekabet halleri
  tip: uygulama
  zorluk: 2
  kok: Bir SMMM, başka bir meslek mensubu ile sözleşmesi devam eden bir müşteriyi mevcut sözleşmesini feshetmeye
    yönlendirerek kendisiyle sözleşme yapmaya çalışmaktadır. Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bu davranış, mesleki ruhsatın kiralanmasına ilişkin haksız rekabet hâli kapsamında değerlendirilir.
    B: Müşteri eski meslek mensubuna olan ücret borcunu ödemişse bu davranış haksız rekabet sayılmaz.
    C: Bu davranış, mevcut sözleşmeyi feshe yöneltme niteliğiyle özellikle haksız rekabet teşkil eden hallerden
      biridir.
    D: Bu davranış, ancak asgari ücret tarifesinin altında ücret teklif edilirse haksız rekabet sayılır.
    E: Bu davranış, ücret ve mali nitelikteki uygulamalara ilişkin md. 7 kapsamında değerlendirilir.
  dogru: C
  aciklama:
    dogru_neden: Yönetmeliğin 6 ncı maddesinde, başka bir meslek mensubu ile sözleşmesi bulunan iş sahiplerinin
      mevcut sözleşmelere aykırı davranmaya veya sözleşmeleri feshetmeye yöneltilmesi özellikle haksız rekabet teşkil
      eden haller arasında sayılmıştır.
    celdiriciler:
      A: Ruhsat kiralama md. 6/d'de ayrı bir haldir; olayda sözleşmeli müşteriyi feshe yöneltme söz konusudur (md.
        6/b).
      B: Ücret borcunun ödenmiş olması, sözleşmeyi feshe yöneltme eylemini md. 6/b'deki haksız rekabet hükmünden
        çıkarmaz.
      D: Md. 6/b ücret düzeyine bağlı değildir; sözleşmeli müşteriyi feshe yöneltmek ücret teklifinden bağımsız
        haksız rekabettir.
      E: Eylem md. 7'deki ücret ve mali uygulamalar değil, md. 6/b'deki meslek mensupları arası haksız rekabet hâlidir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve
      Reklam Yasağı Yönetmeliği
    madde: md. 6/1-b
    alinti: b) Bir diğer meslek mensubu ile sözleşmesi bulunan iş sahiplerini sözleşme yapmak amacıyla mevcut sözleşmelere
      aykırı davranmaya veya bu sözleşmeleri feshetmeye yöneltmek.
