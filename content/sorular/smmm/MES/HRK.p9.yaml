  kok: Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre aşağıdaki davranış çiftlerinden hangisinde yalnızca ilk
    davranış özellikle haksız rekabet teşkil eden bir davranıştır?
  secenekler:
    A: Müşteriye mesleki bilgi vermek — meslektaşın çalışanından iş sırrı elde etmeye yöneltmek
    B: Mesleki standartlara uygun çalışmak — sözleşmesi bulunan iş sahibini sözleşmesini feshetmeye yöneltmek
    C: Telefon rehberinde ad ve soyad yayımlamak — mesleki özeni göstermek
    D: Bilimsel çalışma yayımlamak — başka meslek mensubunun iş sahibine hizmet vermek
    E: Muhasebe ve denetim standartlarına uymamak — mesleki faaliyetlerde gerekli özeni göstermek
  dogru: E
  aciklama:
    dogru_neden: Yönetmeliğin 6/a bendinde muhasebe ve denetim standartlarına uymamak özellikle haksız rekabet olarak
      sayılmıştır. Diğer davranışlardan gerekli özeni göstermek veya mesleki standartlara uygun çalışmak yasak değildir;
      diğer bazı seçeneklerde ise ikinci davranış haksız rekabet kapsamında düzenlenmiştir.
    celdiriciler:
      A: İlk davranış tek başına haksız rekabet değildir; ikinci davranış iş sırrı elde etmeye yöneltme olarak düzenlenmiştir.
      B: İlk davranış yasak değildir; ikinci davranış, mevcut sözleşmeyi feshetmeye yöneltme olarak md. 6/b'de haksız
        rekabettir.
      C: İlk davranış tek başına haksız rekabet olarak düzenlenmemiştir.
      D: Bilimsel çalışma yayımlamak tek başına bu bentte haksız rekabet olarak sayılmamıştır; ikinci davranışın
        içeriği ayrıca değerlendirilir.
