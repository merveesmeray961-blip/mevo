    B: Gerçeğe aykırı belge düzenlemek ve onaylamak.
    C: Bir diğer meslek mensubunun çalışanına yükümlülüğüne aykırı davranması için menfaat önermek.
    D: Bir meslek mensubuna ücret borcunu ödememiş iş sahibine hizmet vermek.
