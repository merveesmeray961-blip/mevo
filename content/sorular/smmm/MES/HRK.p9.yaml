      özeni göstermemek.
  - mevzuat: Meslek mensuplarına ilişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 6/f-g
    alinti: f) Üçüncü şahısları yanıltacak şekilde gerçeğe aykırı belge düzenlemek ve onaylamak, g) Bir diğer meslek
      mensubunun çalışanlarına ve diğer yardımcı kişilere işlerini yerine getirirken yükümlülüklerine aykırı davranmaya
      yöneltebilecek şekilde doğrudan veya dolaylı menfaat sağlamak veya önermek.
  - mevzuat: Meslek mensuplarına ilişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
