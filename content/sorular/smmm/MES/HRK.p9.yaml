      C: Md. 6/g, başka bir meslek mensubunun çalışanlarına menfaat sağlanmasını veya önerilmesini düzenler.
      D: Md. 6'da, başka bir meslek mensubuna ücret borcunu ödememiş iş sahibine hizmet vermek ayrıca haksız rekabet
        sayılmıştır.
  kaynaklar:
