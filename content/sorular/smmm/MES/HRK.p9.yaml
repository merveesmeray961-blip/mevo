  - YET
  - SGS
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: ücret uygulamaları
  tip: uygulama
  zorluk: 2
  kok: Bir meslek mensubu, tarifede hizmetin özelliğine göre ücretin işin yüzdesi olarak belirlenmesine ilişkin
    hüküm uygulanarak belirlenmiş bir ücretle hizmet vermektedir. Başka bir meslek mensubu ise aynı dönemde bir
    hizmeti hiçbir ücret almadan yapacağını ilan etmiştir. Haksız Rekabet ve Reklam Yasağı Yönetmeliği ile Ücretlerin
    Esasları Hakkında Yönetmelik birlikte değerlendirildiğinde aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki uygulama da haksız rekabettir; ücret işin yüzdesi olarak belirlenemez.
    B: İlk uygulama haksız rekabet, ikinci uygulama ise serbest meslek hizmetlerinde izin verilen bir uygulamadır.
    C: İlk uygulama tarife izin verdiği için haksız rekabet değildir; ücretsiz hizmet ise özellikle haksız rekabettir.
    D: Ücretsiz hizmet yalnız reklam yoluyla duyurulursa haksız rekabet olur; aksi hâlde ücret yönetmeliği buna
      izin verir.
    E: İlk uygulama yalnız YMM'ler için geçerlidir; ücretsiz hizmet ise ücret tarifesine uyulduğu sürece mümkündür.
  dogru: C
  aciklama:
    dogru_neden: 'Ücretler Yönetmeliği, genel ilke olarak yüzde oranı belirlemeyi yasaklasa da hizmetin özelliğine
      göre tarifedeki ücretin işin yüzdesi olarak belirlenmesine izin verir. Haksız Rekabet Yönetmeliği ise asgari
      ücret tarifesinin altında ücret talep etmeyi veya ücretsiz hizmet vermeyi özellikle haksız rekabet sayar.
      Püf noktaları: Yüzde esaslı ücretin varlığı tek başına yasak değildir; ücretsiz hizmet ise ayrıca açıkça sayılmıştır.'
    celdiriciler:
      A: Yüzde esaslı ücret her durumda yasak değildir; hizmetin özelliğine göre tarifede belirlenebilir. Ücretsiz
        hizmet ise özellikle haksız rekabettir.
      B: İlk uygulama, tarifedeki istisna kapsamında olduğundan tek başına haksız rekabet değildir; ikinci uygulama
        ise haksız rekabettir.
      D: Ücretsiz hizmetin haksız rekabet niteliği reklam yapılıp yapılmamasına bağlanmamıştır; ücret yönetmeliği
        de ücretsiz işlemi serbest bırakmaz.
      E: Yüzde esaslı ücret yalnız YMM'lere özgü değildir; yönetmelik meslek ücretlerine ilişkin genel kuralı düzenler.
        Ücretsiz hizmet de yasaktır.
