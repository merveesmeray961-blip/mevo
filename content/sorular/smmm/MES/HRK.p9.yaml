  secenekler:
    A: İnternet adresi ve elektronik posta adresi yayımlanabilir.
    B: Büro adresi ve telefon numarası telefon rehberinde yayımlanabilir.
    C: Ayırt edici bir sembol kullanılması koşuluyla ilan verilebilir.
