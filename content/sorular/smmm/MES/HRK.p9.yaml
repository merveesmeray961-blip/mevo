  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında
      Yönetmelik
    madde: md. 9
    alinti: Tarifelerde genel ilke olarak yüzde oranı biçiminde ücret belirlenemez. Ancak, hizmetin özelliğine göre
