  kok: Bir SMMM, mesleki unvanını kullanarak bir dergide her ay düzenli biçimde mesleki konularda yazılar yayımlamak
    istemektedir. Aynı kişi aynı yıl içinde tek bir bilimsel nitelikte yazı yayımlama seçeneğini de değerlendirmektedir.
    Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki yayın da serbesttir; süreklilik şartı aranmaz.
    B: Düzenli aylık yazılar serbesttir; tek bilimsel yazı yasaktır.
    C: Mesleki konularda ve bilimsel nitelikte yazı yazmak, gazete ve dergilerde devamlılık arz etmemek üzere mümkündür;
      düzenli aylık yayın yapılamaz.
    D: Meslek mensubu hiçbir koşulda gazete veya dergide yazı yazamaz.
    E: Yazı yazılabilir; ancak yalnızca meslek unvanı kullanılmadan yayımlanabilir.
  dogru: C
  aciklama:
    dogru_neden: Yönetmelik md. 45, meslek mensuplarının unvanlarını kullanarak mesleki konularda ve bilimsel nitelikte
      gazete ve dergilerde devamlılık arz etmemek üzere yazı yazabileceğini, ancak yayıncılık yapamayacağını düzenler.
      Bu nedenle düzenli aylık yazılar bu sınırı aşar; tek ve devamlılık arz etmeyen yazı mümkündür.
    celdiriciler:
      A: Yönetmelik devamlılık arz etmeme şartı koyduğundan aylık düzenli yayın serbest değildir.
      B: Tek bilimsel yazı şartlara uygun olabilir; düzenli aylık yazı ise devamlılık nedeniyle uygun değildir.
      D: Yönetmelik mutlak bir yazı yasağı koymamış, devamlılık arz etmeyen yazılara izin vermiştir.
      E: Meslek mensubu unvanını kullanarak da şartlara uygun yazı yazabilir.
