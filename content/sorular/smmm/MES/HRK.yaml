- id: SMMM-MES-HRK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: HRK
  kazanim: Reklam kuralları — broşür, sirküler, kitap ve medya ilişkileri
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam
    Yasağı Yönetmeliği'ne göre, bir meslek mensubunun aşağıdaki davranışlarından hangisi Yönetmeliğin reklam kurallarına
    **aykırı değildir**?
  secenekler:
    A: Mesleki konuda tek başına yazdığı kitabı bastırıp satması
    B: Büro açılışını yerel bir gazeteye ilan vererek duyurması
    C: Tanıtım broşüründe hizmet verdiği müşterilerinin unvanlarına referans olarak yer vermesi
    D: Mesleki bilgi içeren sirkülerini, yazılı talepleri olmaksızın müşterisi olmayan işletmelere e-posta ile göndermesi
    E: Yazdığı mesleki makalede ortağı olduğu mesleki şirketin unvanını kullanması
  dogru: A
  aciklama:
    dogru_neden: Yönetmelik md. 19/2'ye göre meslek mensupları yayıncılık yapamaz; ancak "Meslek mensuplarının tek
      başına veya diğer bir meslek mensubu ile birlikte yazdıkları kitapları bastırıp satmaları yayıncılık faaliyeti
      sayılmaz." Bu nedenle kendi yazdığı kitabı bastırıp satması Yönetmeliğe aykırı değildir.
    celdiriciler:
      B: md. 21/1(a)'ya göre meslek mensupları büro açılışlarını basın ve yayın yoluyla duyuramaz.
      C: md. 18/2'ye göre meslek mensubu tanıtım için hazırlayacağı kitapçık ve broşürlerde mevcut ve geçmiş müşterilerinin
        isim ve unvanlarını açıklayamaz.
      D: md. 18/1'e göre sirküler ve benzeri dokümanlar mevcut müşterilere ve diğer meslek mensuplarına dağıtılabilir;
        müşterisi olmayan kişi ve kurumlara ancak yazılı talepleri halinde verilebilir.
      E: md. 19/1'e göre meslek mensubu kitap ve makalelerinde mesleki ve akademik unvanını kullanabilir, ancak
        çalıştığı büro, şirket veya kurumun ad veya unvanını kullanamaz.
  kaynaklar:
  - mevzuat: SMMM ve YMM Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 19
    alinti: (1) Meslek mensupları, mesleki konularda hazırlayacağı kitap, makale ve benzeri bilimsel çalışmalarda
      mesleki ve akademik unvanlarını kullanabilir ancak, çalıştığı büro, şirket veya kurumun ad veya unvanını kullanamaz.
      ... (2) Meslek mensupları yayıncılık yapamaz. Meslek mensuplarının tek başına veya diğer bir meslek mensubu
      ile birlikte yazdıkları kitapları bastırıp satmaları yayıncılık faaliyeti sayılmaz.
  - mevzuat: SMMM ve YMM Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 18
    alinti: (1) Meslek mensubu, mesleki bilgi içeren sirküler, kitapçık, tanıtım broşürü ve benzeri dokümanları,
      mevcut müşterilerine ve diğer meslek mensuplarına posta ve elektronik posta gibi yöntemlerle dağıtabilir;
      bu yayınları, müşterisi olmayan kişi ve kurumlara ancak bunların yazılı talepleri halinde verebilir. (2) Meslek
      mensubu sunduğu mesleki faaliyetlerin tanıtımı için hazırlayacağı kitapçık ve broşürlerde, mevcut ve geçmiş
      müşterilerinin isim ve unvanlarını açıklayamaz,
  - mevzuat: SMMM ve YMM Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 21/1 (a)
    alinti: (1) Meslek mensupları; a) Büro açılışlarını basın ve yayın yoluyla duyuramaz.
