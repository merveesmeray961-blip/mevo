- id: SMMM-MES-KAN-0003
  sinav: smmm
  bolum:
  - YET
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: KAN
  kazanim: Birlik Genel Kurulu — toplantı ve karar yeter sayıları, kurulların asıl üye sayıları
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 3568 sayılı Kanun'a göre, Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği
    Genel Kurulunun temsilci tamsayısı 120'dir. Genel Kurulun ilk toplantısına 50 temsilci katılabildiği için yeterli
    çoğunluk sağlanamamış ve ikinci toplantı yapılmıştır. İkinci toplantıya 35 temsilci katılmış, bir gündem maddesinin
    oylanması sırasında 35 temsilcinin tamamı salonda hazır bulunmuştur. Bu toplantıya ilişkin aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Toplantı yapılamaz; ilk toplantıda aranan temsilci tamsayısının salt çoğunluğu olan 61 sayısı ikinci toplantıda
      da aranır.
    B: Toplantı yapılamaz; katılım, Birlik Yönetim, Disiplin ve Denetleme kurulları asıl ve yedek üyeleri toplamının
      iki katı olan 68 sayısının altında kalmıştır.
    C: Toplantı yapılır; katılım, bu kurulların asıl üyeleri toplamının iki katı olan 34 sayısını aştığından yeterlidir
      ve karar, hazır bulunan 35 temsilcinin salt çoğunluğu olan en az 18 olumlu oyla alınır.
    D: Toplantı yapılır; ancak karar, temsilci tamsayısının salt çoğunluğu olan en az 61 olumlu oyla alınabilir.
    E: Toplantı yapılır; karar, hazır bulunan temsilcilerin üçte iki çoğunluğu ile, yani en az 24 olumlu oyla alınır.
  dogru: C
  aciklama:
    dogru_neden: 'Birlik Genel Kurulu temsilcilerin tamsayısının salt çoğunluğu ile toplanır; ilk toplantıda yeterli
      çoğunluk sağlanamazsa ikinci toplantıda çoğunluk aranmaz, ancak katılan temsilci sayısı Birlik Yönetim, Disiplin
      ve Denetleme kurulları asıl üyeleri toplamının iki katından az olamaz (md. 34/4). Bu kurulların asıl üye sayıları
      9 (md. 35/1), 5 (md. 38/1) ve 3''tür (md. 39/1); toplam 17, iki katı 34''tür. 35 temsilci bu sınırı aştığından
      toplantı yapılır. Kararlar ise hazır bulunanların salt çoğunluğu ile alınır (md. 34/7); 35 temsilcinin salt
      çoğunluğu 18''dir. Püf noktaları: Toplantı yeter sayısı ile karar yeter sayısı ayrı kurallardır; ilk toplantı
      için aranan 61 yalnız ilk toplantıya, 34 sınırı yalnız ikinci toplantıya aittir. İkinci toplantı sınırında
      yalnızca asıl üyeler sayılır (yedekler dahil edilirse 68 bulunur). Karar sayısı ise katılanların (35) salt
      çoğunluğudur; temsilci tamsayısı (120) karar sayısını etkilemez.'
    hesap_adimlari:
    - 'Birlik kurullarının asıl üyeleri: Yönetim 9 + Disiplin 5 + Denetleme 3 = 17'
    - 'İkinci toplantı alt sınırı: 17 × 2 = 34; katılım 35 ≥ 34 → toplantı yapılır'
    - 'Karar sayısı: hazır bulunan 35 temsilcinin salt çoğunluğu = 35 / 2 → 17,5; bir üst tam sayı 18'
    celdiriciler:
      A: 61, yalnızca ilk toplantı için aranan yeter sayıdır (120 / 2 + 1); ikinci toplantıda çoğunluk aranmaz,
        yalnızca 34 alt sınırı aranır.
      B: 68, yedek üyeler de sayılarak bulunur; md. 34/4 yalnızca kurulların asıl üyelerini sayar (17 × 2 = 34).
        Katılım 35 olduğundan toplantı yapılır.
      D: 61, karar için değil ilk toplantının yeter sayısıdır; kararlar hazır bulunanların salt çoğunluğu ile alınır
        (md. 34/7).
      E: Kanunda üçte iki çoğunluk öngörülmemiştir; karar için hazır bulunanların salt çoğunluğu (35 kişide 18)
        yeterlidir.
