  kazanim: genel ve özel şartlar
  tip: uygulama
  zorluk: 3
  kok: Bir aday; T.C. vatandaşıdır, medeni hakları kullanma ehliyetine sahiptir, kamu haklarından mahrum değildir,
    gerekli öğrenim ve üç yıllık staj şartlarını sağlamıştır. Ayrıca vergi inceleme yetkisini almış, mesleki yeterlilik
    sınavında başarılı olmuş ve yeminli mali müşavirlik sınavını vermiştir. Ancak serbest muhasebeci mali müşavirlik
    sınavını kazanmamıştır. 3568 sayılı Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: SMMM sınavını kazanmadığı için özel şartları hiçbir istisna olmaksızın tamamlanmamıştır.
    B: Vergi inceleme yetkisi ve sonraki sınavlar nedeniyle SMMM sınavını kazanmış sayılır ve ayrıca ruhsat gerekmez.
    C: SMMM sınavını kazanma şartı bu durumda aranmaz; ancak diğer şartların ve SMMM ruhsatını alma şartının ayrıca
      karşılanması gerekir.
    D: Üç yıllık staj şartı bu aday bakımından da aranmaz.
    E: Genel şartlardan biri olan T.C. vatandaşlığı bu aday için aranmaz.
  dogru: C
  aciklama:
    dogru_neden: Kanunun 5 inci maddesinde, vergi inceleme yetkisini almış ve mesleki yeterlilik sınavında başarılı
      olduktan sonra yeminli mali müşavirlik sınavını vermiş olanlarda SMMM sınavını kazanmış olma şartının aranmayacağı
      düzenlenmiştir. Aynı maddede ruhsatı almış olmak da özel şartlar arasında sayılmıştır.
    celdiriciler:
      A: Kanun bu özel durum için açık bir istisna getirmektedir; SMMM sınavını kazanma şartı aranmaz.
      B: İstisna sınav şartına ilişkindir; ruhsat alma şartını ortadan kaldırmaz.
      D: Kanun en az üç yıl staj yapmış olmayı özel şart olarak korumaktadır.
      E: T.C. vatandaşlığı Kanunun 4 üncü maddesindeki genel şartlardan biridir; adayın vatandaş olması bu şartı
        zaten karşılamaktadır.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 4
    alinti: 'Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest
      muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak.
      c) Kamu haklarından mahrum bulunmamak.'
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 5/A
    alinti: 'Serbest muhasebeci mali müşavir olabilmek için aşağıdaki özel şartlar aranır. a) Hukuk, iktisat, maliye,
