  ders: MES
  unite: 3568 sayılı Kanun
  konu: KAN
  kazanim: ruhsat ve iptal
  tip: uygulama
  zorluk: 3
  kok: Bir meslek mensubu, disiplin hükümleri kapsamında meslekten çıkarma cezası almıştır. 3568 sayılı Kanunda meslekten
    çıkarma cezasının ruhsat açısından sonucu ile Birlik Yönetim Kurulunun ruhsat verme görevi birlikte değerlendirildiğinde
    aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Meslekten çıkarma, ruhsatın yalnızca geçici olarak askıya alınmasıdır; ruhsat verme görevi odalara aittir.
    B: Meslekten çıkarma, ruhsatnamenin geri alınarak mesleğin bir daha yürütülmesine izin verilmemesidir; mesleki ruhsatları
      verme görevi Birlik Yönetim Kuruluna aittir.
    C: Meslekten çıkarma, yalnız YMM mührünün geri alınmasını ifade eder; ruhsat verme görevi Bakanlığa aittir.
    D: Meslekten çıkarma halinde ruhsat korunur; yalnız çalışanlar listesinden silinme yapılır.
    E: Meslekten çıkarma, ruhsatın iptalini doğurmaz; yeni ruhsat verilmesine yalnız oda genel kurulu karar verir.
  dogru: B
  aciklama:
    dogru_neden: '3568 sayılı Kanunda meslekten çıkarma, meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği
      icra etmesine izin verilmemesi olarak tanımlanmıştır. Aynı Kanunun 36 ncı maddesinde Birlik Yönetim Kurulunun görevleri
      arasında mesleki ruhsatları vermek sayılmıştır. Püf noktaları: Meslekten çıkarma ile geçici faaliyetten alıkoyma aynı
      sonuç doğurmaz; ilkinde ruhsat geri alınır ve mesleğin yeniden yürütülmesine izin verilmez.'
    celdiriciler:
      A: Meslekten çıkarma geçici değil, ruhsatnamenin geri alınması ve mesleği bir daha yürütmeye izin verilmemesi sonucunu
        doğurur; ruhsat verme görevi de Birlik Yönetim Kurulundadır.
      C: Yeminli sıfatının kaldırılması ile meslekten çıkarma farklı disiplin cezalarıdır; ruhsat verme görevi Bakanlığa değil
        Birlik Yönetim Kuruluna aittir.
      D: Kanun meslekten çıkarmayı yalnız çalışanlar listesinden silme olarak değil, ruhsatnamenin geri alınması olarak tanımlar.
      E: Meslekten çıkarma ruhsatname açısından doğrudan sonuç doğurur; oda genel kurulu ruhsat verme mercii olarak düzenlenmemiştir.
  kaynaklar:
