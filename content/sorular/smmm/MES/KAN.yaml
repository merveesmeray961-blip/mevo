- id: SMMM-MES-KAN-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: KAN
  kazanim: Oda organları — yönetim kurulunun oluşumu, seçilme yeterliği ve genel kurul toplantısı
  tip: uygulama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: 3568 sayılı Kanun'a göre, odaya kayıtlı üye sayısı 3.400 olan (X) Serbest Muhasebeci Mali Müşavirler Odasının
    organlarına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen yedi asıl ve yedi yedek üyeden
      oluşur.
    B: Yönetim Kurulu üyeliğine, odada en az üç yıl kıdemli olup bu Kanun hükümlerine göre fiilen mesleki faaliyette
      bulunanlar arasından seçim yapılır.
    C: Üst üste iki seçim döneminde iki defa Yönetim Kurulu başkanlığına seçilmiş olan üye, aradan bir seçim dönemi
      geçtikten sonra yeniden Yönetim Kurulu üyeliğine seçilebilir.
    D: Odaya kayıtlı üyelerin beşte birinin görüşme konularını belirten yazılı talebi üzerine Yönetim Kurulu Başkanı,
      Genel Kurulu en geç 15 gün içinde toplantıya çağırmak zorundadır.
    E: Oda Yönetim Kurulu Başkanı ile yönetim ve denetleme kurulu üyeleri, Genel Kurul başkanlık divanına seçilemez.
  dogru: C
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 22/1''e göre "Odalarda üst üste iki seçim döneminde iki defa Yönetim Kurulu
      başkanlığına seçilmiş olanlar, aradan iki seçim dönemi geçmedikçe Yönetim Kurulu üyeliğine seçilemezler."
      C şıkkı bekleme süresini "bir seçim dönemi" olarak verdiği için yanlıştır. Zorluk kaynağı: (1) madde birleştirme
      — şıklar md. 20, 21 ve 22''nin birlikte okunmasını gerektirir; (2) yakın kavram ayrımı — yönetim kurulu üye
      sayısı oda büyüklüğüne göre 5/7/9 olarak değişir ve 3.400 üyeli oda "bin ilâ beşbin" aralığındadır; üç yıllık
      kıdem şartı ise yalnız üye sayısı yüzden az olan odalarda aranmaz; (3) tek unsuru değiştirilmiş sayısal şart
      — tuzak, "iki defa başkanlık" ile "iki seçim dönemi" sayılarının karıştırılarak beklemenin bir döneme indirilmesidir.'
    celdiriciler:
      A: Doğrudur. md. 21/1'e göre üye sayısı bin ilâ beşbin arasında olan odalarda yönetim kurulu üç yıl için seçilen
        yedi asıl ve yedi yedek üyeden oluşur; 3.400 üyeli oda bu aralıktadır.
      B: Doğrudur. md. 22/1'e göre yönetim kurulu üyeleri en az üç yıl kıdemli olup fiilen mesleki faaliyette bulunanlar
        arasından seçilir; üç yıllık süre şartı yalnız üye sayısı yüzden az olan odalarda aranmaz, (X) Odası bu istisnaya
        girmez.
      D: Doğrudur. md. 20/3'e göre Oda Yönetim Kurulu Başkanı, üyelerin beşte birinin görüşme konularını belirten yazılı
        talebi ile en geç 15 gün içinde Genel Kurulu toplantıya çağırmak zorundadır.
      E: Doğrudur. md. 20'nin son fıkrasına göre Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık
        divanına seçilemezler.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 22/1
    alinti: Yönetim Kurulu üyeleri, kayıtlı olduğu meslek odasında en az üç yıl kıdemli olup serbest veya bir işyerine
      bağlı olarak bu Kanun hükümlerine göre fiilen mesleki faaliyette bulunanlar arasından seçilir. Üye sayısı yüzden
      az olan odalarda üç yıllık süre şartı aranmaz. Odalarda üst üste iki seçim döneminde iki defa Yönetim Kurulu
      başkanlığına seçilmiş olanlar, aradan iki seçim dönemi geçmedikçe Yönetim Kurulu üyeliğine seçilemezler.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 21/1
    alinti: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen, üye sayısı binin altında olan
      odalarda beş asıl ve beş yedek, üye sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek, üye
      sayısı beşbini aşan odalarda ise dokuz asıl ve dokuz yedek üyeden oluşur.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 20/3
    alinti: Oda Yönetim Kurulu Başkanı, Odaya kayıtlı üyelerin beşte birinin görüşme konularını belirten yazılı talebi
      ile en geç 15 gün içinde Genel Kurulu toplantıya çağırmak zorundadır.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 20 (son fıkra)
    alinti: Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık divanına seçilemezler.
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2

- id: SMMM-MES-KAN-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: KAN
  kazanim: Odaların kuruluşu — asgari meslek mensubu sayıları ve tüzelkişilik kazanma
  tip: bilgi
  zorluk: 2
  soru_bicimi: bosluk
  kok: '3568 sayılı Kanun''un 15''inci maddesine göre: "Bölgesi içinde kendi mesleği konusunda en az ( i ) meslek
    mensubu bulunan il merkezlerinde ve bölgesi içinde ( i ) meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi
    sınırları içindeki ilçeler hariç) bir oda kurulur. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az ( ii )
    meslek mensubunun yazılı başvurusu aranır. Odalar, kuruluşlarını ( iii ) aracılığıyla Maliye Bakanlığına bildirmekle
    tüzelkişilik kazanırlar." Yukarıdaki boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?'
  secenekler:
    A: (i) 250 – (ii) 100 – (iii) Birlik Yönetim Kurulu
    B: (i) 100 – (ii) 250 – (iii) Birlik Yönetim Kurulu
    C: (i) 250 – (ii) 100 – (iii) Birlik Genel Kurulu
    D: (i) 500 – (ii) 100 – (iii) Birlik Yönetim Kurulu
    E: (i) 250 – (ii) 50 – (iii) Valilik
  dogru: A
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 15/1''e göre oda kurulabilmesi için il merkezinde ve ilçede bölgesi içinde
      en az 250 meslek mensubu bulunmalı, ilçelerde ayrıca o ilçedeki en az 100 meslek mensubunun yazılı başvurusu
      aranır. md. 15/3''e göre odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle
      tüzelkişilik kazanır. Doğru sıralama: 250 – 100 – Birlik Yönetim Kurulu.'
    celdiriciler:
      B: 250 ve 100 sayılarının yerleri değiştirilmiştir; oda kuruluş sayısı 250, ilçede yazılı başvuru sayısı 100'dür.
      C: Sayılar doğru olmakla birlikte bildirim Birlik Genel Kurulu değil, Birlik Yönetim Kurulu aracılığıyla yapılır.
      D: Oda kurulması için aranan asgari meslek mensubu sayısı 500 değil 250'dir.
      E: İlçede aranan yazılı başvuru sayısı 50 değil 100'dür; bildirim valilik değil Birlik Yönetim Kurulu aracılığıyla
        yapılır.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 15/1
    alinti: Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi içinde
      250 meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi sınırları içindeki ilçeler hariç) bir oda kurulur.
      Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları ilin veya
      ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun yazılı
      başvurusu aranır.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 15/3
    alinti: Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar.
