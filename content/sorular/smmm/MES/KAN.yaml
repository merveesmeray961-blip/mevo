- id: SMMM-MES-KAN-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: KAN
  kazanim: Oda organları — yönetim, disiplin ve denetleme kurullarının oluşumu, seçilme yeterliği ve genel kurul
    toplantı nisabı
  tip: uygulama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: 3568 sayılı Kanun'a göre, odaya kayıtlı üye sayısı 3.400 olan (X) Serbest Muhasebeci Mali Müşavirler Odasının
    organlarına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen yedi asıl ve yedi yedek üyeden
      oluşur.
    B: Yönetim Kurulu üyeliğine, odada en az üç yıl kıdemli olup bu Kanun hükümlerine göre fiilen mesleki faaliyette
      bulunanlar arasından seçim yapılır.
    C: Üst üste iki seçim döneminde iki defa Yönetim Kurulu başkanlığına seçilmiş olan üye, aradan bir seçim dönemi
      geçtikten sonra yeniden Yönetim Kurulu üyeliğine seçilebilir.
    D: Genel Kurulun ilk toplantısında yeterli çoğunluk sağlanamazsa ikinci toplantıda çoğunluk aranmaz; ancak ikinci
      toplantıya katılan üye sayısı 30'dan aşağı olamaz.
    E: Oda Yönetim Kurulu Başkanı ile yönetim ve denetleme kurulu üyeleri, Genel Kurul başkanlık divanına seçilemez.
  dogru: C
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 22/1''e göre "Odalarda üst üste iki seçim döneminde iki defa Yönetim Kurulu
      başkanlığına seçilmiş olanlar, aradan iki seçim dönemi geçmedikçe Yönetim Kurulu üyeliğine seçilemezler."
      C şıkkı bekleme süresini "bir seçim dönemi" olarak verdiği için yanlıştır. Kullanılan teknikler: (1) madde
      birleştirme ve çok adımlı hesap — D şıkkının doğruluğu md. 20/5, 21/1, 25/1 ve 27/1''in birlikte okunmasıyla
      anlaşılır: 3.400 üyeli odada Yönetim Kurulu 7, Disiplin Kurulu 5 (üye sayısı 50''den fazla), Denetleme Kurulu
      3 asıl üyeden oluşur; ikinci toplantı nisabı 2 × (7 + 5 + 3) = 30''dur. (2) Yakın kavram ayrımı — yönetim
      kurulu üye sayısı oda büyüklüğüne göre 5/7/9, disiplin kurulu üye sayısı 3/5 olarak değişir; üç yıllık kıdem
      şartı yalnız üye sayısı yüzden az olan odalarda aranmaz; başkanlıktan sonraki bekleme bir değil iki seçim
      dönemidir. Tuzak, D''deki 30''u yanlış basamak (5 veya 9 asıl üye) ya da yedek üyeleri hesaba katarak yanlış
      sanmak ve C''deki "bir seçim dönemi"ni gözden kaçırmaktır.'
    celdiriciler:
      A: Doğrudur. md. 21/1'e göre üye sayısı bin ilâ beşbin arasında olan odalarda yönetim kurulu üç yıl için seçilen
        yedi asıl ve yedi yedek üyeden oluşur; 3.400 üyeli oda bu aralıktadır.
      B: Doğrudur. md. 22/1'e göre yönetim kurulu üyeleri en az üç yıl kıdemli olup fiilen mesleki faaliyette bulunanlar
        arasından seçilir; üç yıllık süre şartı yalnız üye sayısı yüzden az olan odalarda aranmaz, (X) Odası bu
        istisnaya girmez.
      D: 'Doğrudur. md. 20/5''e göre ikinci toplantıya katılan üye sayısı Yönetim, Disiplin ve Denetleme Kurulları
        asıl üyelerinin toplamının iki katından aşağı olamaz. 3.400 üyeli odada asıl üyeler: Yönetim Kurulu 7 (md.
        21/1), Disiplin Kurulu 5 (md. 25/1), Denetleme Kurulu 3 (md. 27/1); toplam 15, iki katı 30''dur. Yedek üyeler
        hesaba katılmaz.'
      E: Doğrudur. md. 20'nin son fıkrasına göre Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri
        başkanlık divanına seçilemezler.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 22/1
    alinti: Yönetim Kurulu üyeleri, kayıtlı olduğu meslek odasında en az üç yıl kıdemli olup serbest veya bir işyerine
      bağlı olarak bu Kanun hükümlerine göre fiilen mesleki faaliyette bulunanlar arasından seçilir. Üye sayısı
      yüzden az olan odalarda üç yıllık süre şartı aranmaz. Odalarda üst üste iki seçim döneminde iki defa Yönetim
      Kurulu başkanlığına seçilmiş olanlar, aradan iki seçim dönemi geçmedikçe Yönetim Kurulu üyeliğine seçilemezler.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 21/1
    alinti: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen, üye sayısı binin altında
      olan odalarda beş asıl ve beş yedek, üye sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek,
      üye sayısı beşbini aşan odalarda ise dokuz asıl ve dokuz yedek üyeden oluşur.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 20 (son fıkra)
    alinti: Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık divanına seçilemezler.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 20/5
    alinti: Oda Genel Kurulu üye tam sayısının salt çoğunluğu ile toplanır. İlk toplantıda yeterli çoğunluk sağlanamazsa
      ikinci toplantıda çoğunluk aranmaz. Ancak, ikinci toplantıya katılan üye sayısı; Yönetim, Disiplin ve Denetleme
      Kurulları asıl üyelerinin toplamının iki katından aşağı olamaz.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 25/1
    alinti: Oda Disiplin Kurulu, üye sayısı 50'ye kadar olan Odalarda üç, 50'den fazla olan Odalarda beş üyeden
      oluşur. Ayrıca, Disiplin Kurulu üyesi 3 olan Odalarda bir, 5 olan Odalarda 3 yedek üye seçilir.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 27/1
    alinti: Denetleme Kurulu üyeleri, kayıtlı olduğu meslek odasında en az üç yıl kıdemli olup serbest veya bir
      işyerine bağlı olarak bu Kanun hükümlerine göre fiilen mesleki faaliyette bulunanlar arasından üç yıl için
      seçilen üç üyeden oluşur. Ayrıca bir yedek üye seçilir.
  gecerlilik:
    baslangic: '2008-07-26'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: D şıkkı (md. 20/3, beşte bir talep) yerine md. 20/5 + 21/1 + 25/1 + 27/1'in birlikte okunmasını ve 2 × (7
      + 5 + 3) = 30 hesabını gerektiren doğru bir ifade (ikinci toplantı nisabı) kondu; dogru_neden teknikleri gerçekten
      kullanılanlarla yeniden yazıldı, kaynaklar güncellendi; kazanım genişletildi; zorluk 3 korundu. gecerlilik.baslangic
      2026-10-03 → 2008-07-26.
    neden: 'G5 (küçük): ''madde birleştirme'' iddiası fiilen yoktu (her şık tek maddeyi yokluyordu); GZ''de ortalama
      aday yanıldığından etiket düşürülmek yerine soru gerçek madde birleştirme + çok adımlı hesapla zorlaştırıldı.
      md. 21, 22, 25, 27 son hâlini 5786 sayılı Kanunla aldı (yürürlük 26/7/2008, 3568 yürürlük tablosu); md. 20''nin
      7546 ile değişen 4. fıkrası soruda kullanılmıyor.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) 3568 md. 20/5, 21/1, 22/1, 25/1, 27/1 güncel metinle karşılaştırıldı: 3.400 üyeli odada asıl
          üye 7 + 5 + 3 = 15, ikinci toplantı nisabı 30; D doğru. C (bir seçim dönemi) md. 22/1''e aykırı, tek yanlış
          ifade. 7546 sayılı Kanun yalnız md. 20/4''ü değiştirmiş; kullanılan fıkralar etkilenmiyor.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-MES-KAN-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: MES
  unite: Muhasebecilik ve Mali Müşavirlik Meslek Hukuku
  konu: KAN
  kazanim: Odaların kuruluşu — asgari meslek mensubu sayıları ve tüzelkişilik kazanma
  tip: bilgi
  zorluk: 2
  soru_bicimi: bosluk
  kok: '3568 sayılı Kanun''un 15''inci maddesine göre: "Bölgesi içinde kendi mesleği konusunda en az ( i ) meslek
    mensubu bulunan il merkezlerinde ve bölgesi içinde ( i ) meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi
    sınırları içindeki ilçeler hariç) bir oda kurulur. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az
    ( ii ) meslek mensubunun yazılı başvurusu aranır. Odalar, kuruluşlarını ( iii ) aracılığıyla Maliye Bakanlığına
    bildirmekle tüzelkişilik kazanırlar." Yukarıdaki boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?'
  secenekler:
    A: (i) 250 – (ii) 100 – (iii) Birlik Yönetim Kurulu
    B: (i) 100 – (ii) 250 – (iii) Birlik Yönetim Kurulu
    C: (i) 250 – (ii) 100 – (iii) Birlik Genel Kurulu
    D: (i) 500 – (ii) 100 – (iii) Birlik Yönetim Kurulu
    E: (i) 250 – (ii) 50 – (iii) Valilik
  dogru: A
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 15/1''e göre oda kurulabilmesi için il merkezinde ve ilçede bölgesi içinde
      en az 250 meslek mensubu bulunmalı, ilçelerde ayrıca o ilçedeki en az 100 meslek mensubunun yazılı başvurusu
      aranır. md. 15/3''e göre odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle
      tüzelkişilik kazanır. Doğru sıralama: 250 – 100 – Birlik Yönetim Kurulu.'
    celdiriciler:
      B: 250 ve 100 sayılarının yerleri değiştirilmiştir; oda kuruluş sayısı 250, ilçede yazılı başvuru sayısı 100'dür.
      C: Sayılar doğru olmakla birlikte bildirim Birlik Genel Kurulu değil, Birlik Yönetim Kurulu aracılığıyla yapılır.
      D: Oda kurulması için aranan asgari meslek mensubu sayısı 500 değil 250'dir.
      E: İlçede aranan yazılı başvuru sayısı 50 değil 100'dür; bildirim valilik değil Birlik Yönetim Kurulu aracılığıyla
        yapılır.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 15/1
    alinti: Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi
      içinde 250 meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi sınırları içindeki ilçeler hariç) bir oda
      kurulur. Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları
      ilin veya ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun
      yazılı başvurusu aranır.
  - mevzuat: 3568 sayılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 15/3
    alinti: Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik
      kazanırlar.
