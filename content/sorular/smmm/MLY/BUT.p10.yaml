      B: Yeterince büyük bir birincil fazla, r > g iken de borç oranını sabitleyebilir veya düşürebilir.
      C: Büyümenin artması GSYH'yi yani paydayı büyütür ve borç oranını düşürücü etki yapar.
      E: Borç oranı faiz ve büyüme farkından da etkilenir; birincil açık yokken de r > g ile oran yükselebilir.
