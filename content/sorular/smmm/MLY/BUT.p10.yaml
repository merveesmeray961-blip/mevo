    B: genel yönetim bütçeleri merkezî yönetim, sosyal güvenlik kurumları ve mahallî idare bütçeleri olarak hazırlanır ve
      uygulanır
    C: kamu idareleri kanunda sayılanların dışında sınırsız sayıda bütçe oluşturabilir
    D: mahallî idare bütçeleri merkezî yönetim bütçesinin içindedir
    E: sosyal güvenlik kurumları bütçeleri genel bütçenin cetvelidir
