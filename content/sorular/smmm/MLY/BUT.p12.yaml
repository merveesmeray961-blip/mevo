- id: SMMM-MLY-BUT-0048
  sinav: smmm
  bolum: &id001
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: gayri safilik ilkesi
  tip: uygulama
  zorluk: 1
  kok: Bir kamu idaresi, tahsil ettiği 100 milyon TL tutarındaki geliri bütçesinde göstermeden, bu gelirin tahsili için yaptığı
    15 milyon TL’lik gideri düşerek 85 milyon TL net gelir yazmıştır. Bu uygulama 5018 sayılı Kanunun 13 üncü maddesindeki
    hangi bütçe ilkesine **aykırıdır**?
  secenekler:
    A: Bütçelerin ait olduğu yıl başlamadan önce kabul edilmesi ilkesine
    B: Bütçelerde gelir ve gider denkliğinin sağlanması ilkesine
    C: Tüm gelir ve giderlerin gayri safi olarak bütçelerde gösterilmesi ilkesine
    D: Bütçelerde bütçeyi ilgilendirmeyen hususlara yer verilmemesi ilkesine
    E: Ödeneklerin belirli amaçları gerçekleştirmek üzere tahsis edilmesi ilkesine
  dogru: C
  aciklama:
    dogru_neden: 13 üncü maddenin (f) bendine göre tüm gelir ve giderler gayri safi olarak bütçelerde gösterilir. Gelirden
      gider düşülerek net tutarın yazılması bu ilkeye aykırıdır.
    celdiriciler:
      A: Önceden kabul ilkesi bütçenin yürürlüğe girme zamanıyla ilgilidir; olaydaki sorun gelirin net gösterilmesidir.
      B: Denklik ilkesi gelir toplamı ile gider toplamının dengesini ifade eder; net gösterim denkliğin değil kapsamlılığın
        ihlalidir.
      D: Bu ilke bütçe kanununa yabancı konuların konulmamasını ifade eder; gelir-gider netleştirmesiyle ilgisi yoktur.
      E: Bu ilke ödeneklerin amaca bağlı tahsisini düzenler; gelirin brüt tutarıyla gösterilmesi ayrı bir ilkedir.
  kaynaklar:
  - mevzuat: 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu
    madde: md. 13/f
