    bütçesi aşağıdakilerden hangisidir?
  secenekler:
    A: Düzenleyici ve denetleyici kurum bütçesi
    B: Genel bütçe
    C: Özel bütçe
    D: Sosyal güvenlik kurumu bütçesi
    E: Mahallî idare bütçesi
