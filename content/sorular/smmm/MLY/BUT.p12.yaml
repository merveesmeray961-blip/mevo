      C: Özel bütçe, Kanuna ekli (II) sayılı cetvelde yer alan her bir kamu idaresinin bütçesidir.
      D: Sosyal güvenlik kurumu bütçesi, Kanuna ekli (IV) sayılı cetvelde yer alan kamu idarelerinin bütçesidir.
      E: Mahallî idare bütçesi, Kanuna ekli bir cetvelle değil, mahallî idare kapsamındaki idarelerin bütçesi olarak tanımlanır.
  kaynaklar:
  - mevzuat: 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu
