      hesabında faiz giderlerini hiç kullanmayın; işareti gelir-gider farkına göre belirleyin.'
    celdiriciler:
      A: 500 milyar TL faiz giderinin tutarıdır; birincil denge gelir ile faiz dışı giderler arasındaki farktır ve fazladır.
      B: 200 milyar TL açık yanlış işaretli bir tutardır; gelirler faiz dahil toplam gideri (3.800) aştığı için nominal denge
