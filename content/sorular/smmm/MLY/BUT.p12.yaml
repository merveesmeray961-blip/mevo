      D: '%4 hiçbir adımla ilişkili bir sonuç değildir; fiili açık oranı %5, konjonktürel kısım %3’tür.'
      E: '%5 fiili açığın GSYH’ye oranıdır (150 / 3.000); konjonktürel kısım düşülmemiştir.'
