- id: SMMM-MLY-BUT-0053
  sinav: smmm
  bolum: *id001
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: olağanüstü hâllerde ödeneklerin kullanımı
  tip: hesaplama
  zorluk: 2
  kok: Genel seferberlik ilan edilmiş; Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı bütçelerindeki
    mevcut ödenekler birleştirilerek kullanılacaktır. Bu idarelerin ödenekleri sırasıyla 90, 25 ve 5 milyar TL olup birleştirilen
    ödenekler yetersiz kalmıştır. 5018 sayılı Kanun’a göre bu durumda toplam ödenek tutarına ek olarak en fazla kaç milyar
    TL harcama yapılabilir?
  secenekler:
    A: 6 milyar TL
    B: 12 milyar TL
    C: 18 milyar TL
    D: 24 milyar TL
    E: 120 milyar TL
  dogru: C
  aciklama:
    dogru_neden: '20 nci maddenin (g) bendine göre bu idarelerin mevcut ödenekleri, ödenek toplamları aşılmamak şartıyla birleştirilerek
      kullanılabilir; mevcut ödeneklerin yeterli olmaması hâlinde toplam ödenek tutarının yüzde on beşine kadar ek harcama
      yapılabilir: (90 + 25 + 5) × 0,15 = 18 milyar TL. Püf noktaları: Yüzde 15 yalnızca ek harcama sınırıdır; toplam ödenek
      hesaba üç idarenin birlikte katılmasıyla bulunur.'
    celdiriciler:
      A: 6 milyar TL toplam ödeneğin yüzde 5’idir; Kanundaki oran yüzde 15’tir.
      B: 12 milyar TL toplam ödeneğin yüzde 10’udur; Kanun yüzde on beşe izin verir.
      D: 24 milyar TL toplam ödeneğin yüzde 20’sidir; Kanundaki sınır yüzde 15’tir.
      E: 120 milyar TL ödeneklerin toplamıdır; ek harcama yalnızca bu toplamın yüzde 15’i kadardır.
    hesap_adimlari:
    - Toplam ödenek = 90 + 25 + 5 = 120 milyar TL
    - Ek harcama sınırı = 120 × %15
