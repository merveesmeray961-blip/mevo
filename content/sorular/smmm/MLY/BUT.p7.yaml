  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: borç dinamiği
  tip: uygulama
  zorluk: 2
  kok: 'Kamu borcunun GSYH’ye oranının (b) istikrarlı kalması için gereken birincil fazla (s) oranı, reel faiz oranı (r) ile
    büyüme oranı (g) farkının borç oranıyla çarpımıyla bulunur: s = (r − g) × b. Bir ekonomide borç/GSYH oranı %60, reel faiz
    %5 ve büyüme oranı %2 ise, borcun istikrarlı kalması için gereken asgari birincil fazla oranı aşağıdakilerden hangisidir?

    '
  secenekler:
    A: '%0,6'
    B: '%1,2'
    C: '%1,8'
    D: '%2,4'
    E: '%3,0'
  dogru: C
  aciklama:
    dogru_neden: 's = (r − g) × b = (0,05 − 0,02) × 0,60 = 0,03 × 0,60 = 0,018 = %1,8. Bu oran, borcun GSYH’ye oranını sabit
      tutmak için gereken asgari birincil fazladır.

      '
    celdiriciler:
      A: (r − g) yerine yalnızca g × b almak (0,02 × 0,60).
      B: (r − g) × b hesabında 0,02 × 0,60 yerine 0,03 × 0,40 gibi yanlış borç oranı kullanmak.
      D: Nominal faiz kullanmak veya (r + g) × b hesaplamak.
      E: r × b = 0,05 × 0,60 = 0,03 almak; büyüme etkisini ihmal etmek.
    hesap_adimlari:
    - r − g = 0,05 − 0,02 = 0,03
    - s = 0,03 × 0,60 = 0,018 → %1,8
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: borç dinamiği (s = (r − g) × b)
