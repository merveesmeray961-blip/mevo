  tip: kavrama
  zorluk: 3
  kok: '5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu’na göre aşağıdakilerden hangisi **yanlıştır**?

    '
  secenekler:
    A: Genel bütçe, Devlet tüzel kişiliğine dâhil olan ve Kanuna ekli (I) sayılı cetvelde yer alan kamu idarelerinin bütçesidir.
    B: Özel bütçe, bir bakanlığa bağlı veya ilgili olarak belirli bir kamu hizmetini yürütmek üzere kurulan ve Kanuna ekli
      (II) sayılı cetvelde yer alan kamu idarelerinin bütçesidir.
    C: Düzenleyici ve denetleyici kurum bütçesi, Kanuna ekli (III) sayılı cetvelde yer alan kurumların bütçesidir.
    D: Kamu idarelerince merkezî yönetim bütçesi, sosyal güvenlik kurumları bütçeleri ve mahallî idareler bütçeleri dışında
      herhangi bir ad altında bütçe oluşturulabilir.
    E: Sosyal güvenlik kurumu bütçesi, Kanuna ekli (IV) sayılı cetvelde yer alan kamu idarelerinin bütçesidir.
  dogru: D
  aciklama:
    dogru_neden: '5018 sayılı Kanun md. 12 açıkça “Kamu idarelerince bunlar dışında herhangi bir ad altında bütçe oluşturulamaz.”
      demektedir. Dolayısıyla D’deki “oluşturulabilir” ifadesi kanuna aykırıdır ve yanlıştır. Diğer şıklar md. 12’nin ilgili
      fıkralarının birebir karşılığıdır. Püf noktaları: Bütçe türleri limitatif olarak sayılmıştır; ek bütçe türü ihdas edilemez.

      '
    celdiriciler:
      A: 'md. 12: Genel bütçe tanımı doğrudur.'
      B: 'md. 12: Özel bütçe tanımı doğrudur.'
      C: 'md. 12: Düzenleyici ve denetleyici kurum bütçesi tanımı doğrudur.'
      E: 'md. 12: Sosyal güvenlik kurumu bütçesi tanımı doğrudur.'
  kaynaklar:
  - mevzuat: 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu
    madde: md. 12
    alinti: Genel yönetim kapsamındaki idarelerin bütçeleri; merkezî yönetim bütçesi, sosyal güvenlik kurumları bütçeleri
      ve mahallî idareler bütçeleri olarak hazırlanır ve uygulanır. Kamu idarelerince bunlar dışında herhangi bir ad altında
      bütçe oluşturulamaz. Merkezî yönetim bütçesi, bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerinin
      bütçelerinden oluşur. Genel bütçe, Devlet tüzel kişiliğine dahil olan ve bu Kanuna ekli (I) sayılı cetvelde yer alan
      kamu idarelerinin bütçesidir. Özel bütçe, bir bakanlığa bağlı veya ilgili olarak belirli bir kamu hizmetini yürütmek
      üzere kurulan, gelir tahsis edilen, bu gelirlerden harcama yapma yetkisi verilen, kuruluş ve çalışma esasları kanunla
      veya Cumhurbaşkanlığı kararnamesiyle düzenlenen ve bu Kanuna ekli (II) sayılı cetvelde yer alan her bir kamu idaresinin
      bütçesidir. Düzenleyici ve denetleyici kurum bütçesi, kanunla veya Cumhurbaşkanlığı kararnamesiyle kurul, kurum veya
      üst kurul şeklinde teşkilatlanan ve bu Kanuna ekli (III) sayılı cetvelde yer alan her bir düzenleyici ve denetleyici
      kurumun bütçesidir. Sosyal güvenlik kurumu bütçesi, sosyal güvenlik hizmeti sunmak üzere, kanunla veya Cumhurbaşkanlığı
      kararnamesiyle kurulan ve bu Kanuna ekli (IV) sayılı cetvelde yer alan her bir kamu idaresinin bütçesidir.
