- id: SMMM-MLY-BUT-0005
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: borç dinamiği
  tip: uygulama
  zorluk: 3
  kok: Bir ekonomide bir önceki yıl sonu borç stokunun GSYH’ye oranı %60, reel faiz oranı %4, reel büyüme oranı %2 ve birincil
    fazla/GSYH oranı %1’dir. Borç dinamiği denklemi (Δb ≈ (r − g)·b − pb) çerçevesinde, cari yılda borç/GSYH oranının değişimi
    yaklaşık kaç puan olur?
  secenekler:
    A: 0,2 puan artış
    B: 1,2 puan artış
    C: 0,2 puan azalış
    D: 1,2 puan azalış
    E: 2,0 puan azalış
  dogru: A
  aciklama:
    dogru_neden: 'Borç dinamiği denklemi: Δb ≈ (r − g)·b − pb. Burada r = 0,04, g = 0,02, b = 0,60, pb = 0,01. (0,04 − 0,02)·0,60
      − 0,01 = 0,012 − 0,01 = 0,002 yani 0,2 puan artış. Birincil fazla, faiz-büyüme farkından kaynaklanan artış baskısını
      kısmen karşılamış ancak tamamen dengeleyememiştir.'
    celdiriciler:
      B: (r−g)·b terimi 0,012 olarak hesaplanır; pb’yi çıkarmadan 1,2 puan demek yanlıştır.
      C: İşaret pozitiftir (artış); azalış değildir.
      D: Hem işaret hem büyüklük yanlıştır.
      E: pb’nin iki katı kadar azalış varsayımı temelsizdir.
    hesap_adimlari:
    - r − g = 0,04 − 0,02 = 0,02
    - (r − g)·b = 0,02 × 0,60 = 0,012
    - Δb ≈ 0,012 − 0,01 = 0,002 (0,2 puan artış)
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Borç dinamiği denklemi Δb ≈ (r − g)·b − pb
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (0.04 - 0.02) * 0.60 - 0.01
