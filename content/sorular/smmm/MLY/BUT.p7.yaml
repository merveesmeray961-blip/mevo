- id: SMMM-MLY-BUT-0008
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: operasyonel açık
  tip: uygulama
  zorluk: 3
  kok: 'Bir ekonomide bir önceki yılın kamu borcu 2.000 milyar TL, enflasyon oranı %20, nominal faiz oranı %30 ve faiz dışı
    (birincil) açık 100 milyar TL olarak gerçekleşmiştir. Operasyonel açığın, birincil açık ile enflasyon düzeltmeli (reel)
    faiz ödemelerinin toplamı olarak tanımlandığı varsayımı altında, operasyonel açık tutarı aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 100 milyar TL
    B: 200 milyar TL
    C: 300 milyar TL
    D: 400 milyar TL
    E: 500 milyar TL
  dogru: C
  aciklama:
    dogru_neden: 'Nominal faiz ödemesi = 2.000 × 0,30 = 600 milyar TL. Enflasyonun erittiği borç tutarı (parasal düzeltme)
      = 2.000 × 0,20 = 400 milyar TL. Reel faiz ödemesi = 600 − 400 = 200 milyar TL. Operasyonel açık = birincil açık + reel
      faiz ödemesi = 100 + 200 = 300 milyar TL. Püf noktaları: Operasyonel açık nominal faiz değil, yalnızca reel faiz yükünü
      dikkate alır; enflasyon düzeltmesi unutulursa 700 milyar TL gibi yanlış sonuçlar ortaya çıkar.

      '
    celdiriciler:
      A: Yalnızca birincil açığı yazmak; reel faiz bileşenini tamamen ihmal etmek.
      B: Reel faiz ödemesini (200) alıp birincil açığı eklememek.
      D: Nominal faiz ödemesinden (600) birincil açığı çıkarmak veya enflasyon oranını yanlış uygulamak.
      E: Nominal faiz ödemesini (600) doğrudan operasyonel açık saymak; enflasyon düzeltmesini hiç yapmamak.
    hesap_adimlari:
    - Nominal faiz = 2000 × 0,30 = 600
    - Enflasyon düzeltmesi = 2000 × 0,20 = 400
    - Reel faiz = 600 − 400 = 200
    - Operasyonel açık = 100 + 200 = 300
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: operasyonel açık (birincil açık + reel faiz ödemesi)
    alinti: ''
