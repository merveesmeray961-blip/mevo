- id: SMMM-MLY-BUT-0007
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: operasyonel açık
  tip: uygulama
  zorluk: 3
  kok: Bir ülkede nominal bütçe açığı 120 milyar TL, faiz ödemeleri 80 milyar TL, yıl başı borç stoku 2.000 milyar TL ve yıllık
    enflasyon oranı %10’dur. Operasyonel açık (birincil açık − enflasyonun borç stoku üzerindeki aşındırma etkisi) yaklaşık
    kaç milyar TL’dir?
  secenekler:
    A: 40 milyar TL açık
    B: 160 milyar TL fazla (operasyonel fazla)
    C: 280 milyar TL açık
    D: 120 milyar TL açık
    E: 80 milyar TL açık
  dogru: B
  aciklama:
    dogru_neden: Birincil açık = nominal açık − faiz ödemeleri = 120 − 80 = 40 milyar TL. Enflasyonun mevcut borç stoku üzerindeki
      aşındırma etkisi = π × B = 0,10 × 2.000 = 200 milyar TL. Operasyonel açık = birincil açık − πB = 40 − 200 = −160 milyar
      TL, yani 160 milyar TL operasyonel fazla. Enflasyon, borç stokunun reel değerini düşürerek kamu kesimine ‘enflasyon
      vergisi’ sağlar.
    celdiriciler:
      A: Bu tutar yalnızca birincil açıktır; enflasyon düzeltmesi yapılmamıştır.
      C: Nominal açık ile πB’nin toplanması (işaret hatası) sonucu ortaya çıkar.
      D: Nominal açığın kendisidir; faiz ve enflasyon dikkate alınmamıştır.
      E: Yalnızca faiz ödemesidir.
    hesap_adimlari:
    - Birincil açık = 120 − 80 = 40
    - π × B = 0,10 × 2.000 = 200
    - Operasyonel açık = 40 − 200 = −160 (160 milyar TL fazla)
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Operasyonel açık
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (120 - 80) - (0.10 * 2000)
  durum: geri_cekildi
  surum: 1
  uretim:
