  kok: Borç dinamiği denklemi Δb ≈ (r − g)·b − pb çerçevesinde aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: r > g ve pb = 0 ise borç/GSYH oranı yükselme eğilimindedir.
    B: r < g ise birincil açık bile olsa borç oranı düşebilir.
    C: Borç oranının sabit kalması için pb = (r − g)·b şartı gerekir.
    D: pb > 0 (birincil fazla) her durumda borç oranını düşürür.
    E: r − g farkı büyüdükçe borç oranını stabilize etmek için gereken birincil fazla artar.
