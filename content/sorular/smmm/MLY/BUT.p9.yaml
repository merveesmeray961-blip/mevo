  kok: Borç dinamiği denkleminde (r − g) terimi ile birincil fazla (s) arasındaki ilişki bakımından aşağıdaki karşılaştırmalardan
    hangisi doğrudur?
  secenekler:
    A: r > g iken borç oranının istikrarlı kalması için birincil açık verilmesi yeterlidir.
    B: r < g iken borç oranı otomatik olarak düşer; birincil fazla gerekmez.
    C: r > g iken borç oranının sabit kalması için s ≥ (r − g)·b şartı aranır.
    D: r = g iken birincil fazla ne olursa olsun borç oranı artar.
    E: r > g iken birincil fazla s > 0 olması borç oranını mutlaka düşürür.
  dogru: C
  aciklama:
    dogru_neden: Δb ≈ (r − g)·b − s = 0 için s = (r − g)·b gerekir. r > g ise pozitif birincil fazla, borç oranını sabitlemek
      için en az (r − g)·b kadar olmalıdır. Bu, istikrar koşuludur.
    celdiriciler:
      A: r > g iken birincil açık borç oranını daha da yükseltir; fazla gerekir.
      B: r < g iken (r − g) negatif olduğu için borç oranı düşme eğilimindedir ama birincil açık bu etkiyi tersine çevirebilir;
        'otomatik' mutlak değildir.
      D: r = g iken Δb ≈ −s; birincil fazla borç oranını düşürür, açık artırır.
      E: s > 0 olsa bile s < (r − g)·b ise borç oranı artmaya devam eder.
    hesap_adimlari: []
