- id: SMMM-MLY-BUT-0012
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: operasyonel açık
  tip: uygulama
  zorluk: 2
  kok: Bir ülkede nominal bütçe açığı 130 milyar TL, faiz ödemeleri 120 milyar TL, yıl başı kamu borç stoku 2.000 milyar TL
    ve yıllık enflasyon oranı %5’tir. Operasyonel açığın yaklaşık tutarı kaç milyar TL’dir?
  secenekler:
    A: '10'
    B: '30'
    C: '50'
    D: '110'
    E: '130'
  dogru: B
  aciklama:
    dogru_neden: Birincil açık = nominal açık − faiz ödemeleri = 130 − 120 = 10 milyar TL. Nominal faiz oranı = 120 / 2.000
      = %6. Reel faiz oranı = %6 − %5 = %1. Operasyonel açık = birincil açık + (reel faiz × borç stoku) = 10 + (0,01 × 2.000)
      = 10 + 20 = 30 milyar TL.
    celdiriciler:
      A: Yalnızca birincil açığın alınması; reel faiz yükünün unutulması.
      C: Reel faiz oranının %2 alınması veya borç stokunun yanlış çarpılması.
      D: Faiz ödemelerinden enflasyon etkisinin eksik düşülmesi (120 − 0,05×2000 = 20; 10+100 gibi hatalı ara adım).
      E: Nominal açığın doğrudan operasyonel açık kabul edilmesi.
    hesap_adimlari:
    - Birincil açık = 130 − 120 = 10
    - Nominal faiz oranı = 120 / 2000 = 0,06
    - Reel faiz oranı = 0,06 − 0,05 = 0,01
    - Operasyonel açık = 10 + 0,01 × 2000 = 30
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Operasyonel açık
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: birincil = 130 - 120; reel_faiz = 0.06 - 0.05; sonuc = birincil + reel_faiz * 2000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
        not: 'kör çözücü (kaynaksız): anahtarla aynı (güven 4).'
      G5:
        sonuc: atlandi
        not: 'hızlı denetim: hakem incelemesi yapılmadı'
      G6:
