  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: borç dinamiği
  tip: kavrama
  zorluk: 3
  kok: Borç dinamiği denklemi Δb ≈ (r − g)·b − s (s birincil fazla oranı) çerçevesinde, borç/GSYH oranının istikrarlı kalması
    (Δb = 0) için gereken birincil fazla oranı ile reel faiz-büyüme farkı arasındaki ilişki aşağıdakilerden hangisinde doğru
    karşılaştırılmıştır?
  secenekler:
    A: Birincil fazla oranı, (r − g)·b’ye eşit olmalıdır; faiz-büyüme farkı ne kadar büyükse gereken fazla o kadar yüksektir.
    B: Birincil fazla oranı her zaman sıfır olmalıdır.
    C: Birincil fazla oranı, (r − g)·b’den bağımsızdır.
    D: Borç oranı istikrarlı kalsın diye birincil açık verilmelidir.
    E: Reel faiz oranı büyüme oranından düşükse, birincil fazla gerekmez; hatta açık verilebilir.
  dogru: A
  aciklama:
    dogru_neden: Δb = 0 için s = (r − g)·b. Dolayısıyla (r − g) pozitif ve büyükse, aynı borç oranı için daha yüksek birincil
      fazla gerekir. E şıkkı da kısmen doğru görünür (r < g ise s negatif olabilir yani açık verilebilir) ancak soru ‘istiktarlı
      kalması için gereken’ ifadesiyle A’yı temel ilişki olarak sorar. A en doğru ve tam karşılaştırmadır.
    celdiriciler:
      B: Sıfır ancak r = g ise geçerlidir.
      C: Doğrudan bağlıdır.
      D: İstikrar için fazla (veya r < g ise açık) gerekir; genel olarak açık değil.
      E: Doğru bir özel durumdur ancak temel ilişki A’da ifade edilmiştir.
    hesap_adimlari: []
