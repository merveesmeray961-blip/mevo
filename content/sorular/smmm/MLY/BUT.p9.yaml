- id: SMMM-MLY-BUT-0018
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Bütçe ve kamu açığı
  konu: BUT
  kazanim: borç dinamiği
  tip: uygulama
  zorluk: 2
  kok: Bir ekonomide önceki yıl sonu borç/GSYH oranı %50, reel faiz oranı %5, reel büyüme oranı %3 ve birincil açık/GSYH oranı
    %1’dir. Borç dinamiği denklemi Δb ≈ (r − g)·b + pd çerçevesinde (pd birincil açık oranı), cari yılda borç/GSYH oranındaki
    değişim yaklaşık kaç puan olur?
  secenekler:
    A: 0 puan (değişmez)
    B: 0,5 puan azalış
    C: 1,0 puan artış
    D: 2,0 puan artış
    E: 1,5 puan azalış
  dogru: D
  aciklama:
    dogru_neden: Δb ≈ (r − g)·b + pd = (0,05 − 0,03)·0,50 + 0,01 = 0,02 × 0,50 + 0,01 = 0,01 + 0,01 = 0,02 yani 2 puan artış.
    celdiriciler:
      A: (r−g)·b ile pd’nin birbirini dengelemesi varsayımı yanlıştır.
      B: İşaret artıştır; azalış değildir.
      C: Hesap sonucu 1 değil 2 puandır.
      E: İşaret ve büyüklük yanlıştır.
    hesap_adimlari:
    - r − g = 0.05 − 0.03 = 0.02
    - (r − g)·b = 0.02 × 0.50 = 0.01
    - Δb ≈ 0.01 + 0.01 = 0.02 (2 puan artış)
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Borç dinamiği denklemi
    alinti: ''
