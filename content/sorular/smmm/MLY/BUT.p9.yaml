    dogru_neden: pb > 0 (birincil fazla) borç oranını düşürme yönünde etki eder; ancak (r − g)·b terimi yeterince büyükse
      (yüksek reel faiz – düşük büyüme) birincil fazla bu etkiyi dengeleyemeyebilir ve borç oranı yine yükselebilir. Bu nedenle
      ‘her durumda’ ifadesi yanlıştır.
    celdiriciler:
      A: Denklem gereği doğrudur.
      B: r < g iken büyüme etkisi açık etkisini aşabilir; doğrudur.
      C: Stabilize edici birincil fazla şartı doğrudur.
      E: Fark büyüdükçe gereken fazla artar; doğrudur.
