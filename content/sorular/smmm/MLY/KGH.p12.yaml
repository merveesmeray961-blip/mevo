- id: SMMM-MLY-KGH-0058
  sinav: smmm
  bolum: &id001
  - SGS
  ders: MLY
  unite: Kamu gelirleri ve harcamaları
  konu: KGH
  kazanim: görünüşte ve reel kamu harcaması
  tip: hesaplama
  zorluk: 2
  kok: Kamu harcamaları 2025 yılında 800 milyar TL iken 2026 yılında 1.350 milyar TL olmuştur. Genel fiyat endeksi 2025 yılında
    100, 2026 yılında 150’dir. 2026 yılı kamu harcamasının 2025 fiyatlarıyla (reel) tutarı kaç milyar TL’dir?
  secenekler:
    A: 900 milyar TL
    B: 1.200 milyar TL
    C: 1.350 milyar TL
    D: 1.500 milyar TL
    E: 2.025 milyar TL
  dogru: A
  aciklama:
    dogru_neden: 'Reel harcama = nominal harcama / fiyat endeksi oranı = 1.350 / (150/100) = 900 milyar TL. Reel harcama 2025’teki
      800 milyar TL’nin üzerinde olduğundan reel artış vardır (%12,5); nominal artış ise %68,75’tir. Püf noktaları: Nominal
      değer fiyat endeksiyle çarpılmaz, bölünür.'
    celdiriciler:
      B: 1.200 milyar TL, nominal tutardan 150 birimlik fiyat farkının doğrudan çıkarılmasıyla bulunur; deflatörle bölme yapılmamıştır.
      C: 1.350 milyar TL görünüşteki (nominal) harcama tutarıdır; fiyat artışından arındırılmamıştır.
      D: 1.500 milyar TL, nominal tutara fiyat endeksi farkının eklenmesiyle bulunur; reel değer için bölme gerekir.
      E: 2.025 milyar TL, nominal tutarın fiyat endeksiyle çarpılmasıyla (1.350 × 1,5) bulunur; reel değer için çarpma değil
        bölme yapılır.
    hesap_adimlari:
    - Fiyat endeksi oranı = 150 / 100 = 1,5
    - Reel harcama = 1.350 / 1,5
    - = 900 milyar TL
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Kamu maliyesi
    madde: Görünüşte ve reel artış
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1350 / (150/100)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Anahtar bağımsız çözümle ve kaynakla (mevzuat/hesap) doğrulandı; tek doğru şık,
          açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim smmm_test.yaml, satır SMMM_B/MLY_KGH_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Anahtar bağımsız çözümle ve kaynakla (mevzuat/hesap) doğrulandı; tek doğru şık, açıklama
