- id: SMMM-MLY-KGH-0062
  sinav: smmm
  bolum: *id001
  ders: MLY
  unite: Kamu gelirleri ve harcamaları
  konu: KGH
  kazanim: dengeli bütçe çarpanı
  tip: hesaplama
  zorluk: 3
  kok: Marjinal tüketim eğiliminin 0,8 olduğu kapalı bir ekonomide devlet, kamu harcamalarını ve götürü (miktar) vergileri
    aynı anda 300 milyar TL artırmıştır. Haavelmo teoremine göre milli gelir kaç milyar TL artar?
  secenekler:
    A: −1.200 milyar TL
    B: 60 milyar TL
    C: 240 milyar TL
    D: 300 milyar TL
    E: 1.500 milyar TL
  dogru: D
  aciklama:
    dogru_neden: 'Harcama çarpanı 1/(1−c) = 5, götürü vergi çarpanı −c/(1−c) = −4’tür. ΔY = 300 × 5 − 300 × 4 = 1.500 − 1.200
      = 300 milyar TL. Yani dengeli bütçe çarpanı 1’dir (Haavelmo teoremi). Püf noktaları: Harcama ve vergi aynı tutarda artırıldığında
      gelir, bu tutar kadar artar.'
    celdiriciler:
      A: −1.200 milyar TL yalnızca vergi artışının (−c/(1−c) × ΔT) milli gelirde yarattığı azalmadır; harcama artışının etkisi
        hesaba katılmamıştır.
      B: 60 milyar TL, harcama artışının tasarruf eğilimiyle (0,2) çarpılmasıyla bulunur; çarpan etkisi dikkate alınmamıştır.
      C: 240 milyar TL, vergi artışının marjinal tüketim eğilimiyle (0,8) çarpılmasıyla bulunur; çarpan hesabı yapılmamıştır.
      E: 1.500 milyar TL yalnızca harcama çarpanının (300 × 5) etkisidir; vergi artışının daraltıcı etkisi dikkate alınmamıştır.
    hesap_adimlari:
    - Harcama çarpanı = 1/(1−0,8) = 5
    - Vergi çarpanı = −0,8/(1−0,8) = −4
    - ΔY = 300×5 − 300×4
    - = 300 milyar TL
  kaynaklar:
  - mevzuat: Genel kabul görmüş ders bilgisi — Kamu maliyesi
    madde: Haavelmo teoremi (dengeli bütçe çarpanı)
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 300/(1-0.8) - 0.8*300/(1-0.8)
  durum: kontrolde
  surum: 1
