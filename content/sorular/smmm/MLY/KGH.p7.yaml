    hangisi bütçe giderlerine ilişkin tertibin kapsamını doğru gösterir?
  secenekler:
    A: Yalnızca program sınıflandırmasının ilk düzeyini kapsar.
    B: Program sınıflandırmasının ilk düzeyi ile ekonomik sınıflandırmanın yalnızca ilk düzeyini kapsar.
    C: Kurumsal sınıflandırmanın yalnızca ilk düzeyini ve program sınıflandırmasının tüm düzeylerini kapsar.
    D: Program sınıflandırmasının ilk düzeyini, kurumsal ve finansman tipi sınıflandırmanın bütün düzeyleri ile
      ekonomik sınıflandırmanın ilk iki düzeyini kapsar.
    E: Ekonomik sınıflandırmanın bütün düzeylerini, kurumsal sınıflandırmanın ilk iki düzeyini ve finansman tipi
      sınıflandırmanın ilk düzeyini kapsar.
  dogru: D
  aciklama:
    dogru_neden: 5018 sayılı Kanun md. 15'teki tanıma göre giderlere ilişkin "Tertip"; program sınıflandırmasının
      ilk düzeyini, kurumsal ve finansman tipi sınıflandırmanın bütün düzeyleri ile ekonomik sınıflandırmanın ilk
      iki düzeyini ifade eder.
    celdiriciler:
      A: Tanım yalnızca program sınıflandırmasının ilk düzeyiyle sınırlı değildir; kurumsal, finansman tipi ve ekonomik
        sınıflandırmanın belirtilen düzeylerini de kapsar.
      B: Kurumsal ve finansman tipi sınıflandırmanın bütün düzeyleri de tertip tanımına dahildir.
      C: Kanun program sınıflandırmasının tüm düzeylerini değil ilk düzeyini; ayrıca ekonomik sınıflandırmanın ilk
        iki düzeyini esas alır.
      E: Ekonomik sınıflandırmanın bütün düzeyleri tertip kapsamında değildir; ilk iki düzey kapsanır.
  kaynaklar:
  - mevzuat: 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu
    madde: md. 15
    alinti: İlgili mevzuatta giderlere ilişkin olarak yer alan “Tertip” deyimi program sınıflandırmasının ilk düzeyini,
