      bir sınıflandırmaya tabi tutulur.
    B: Bütçeler yalnızca ekonomik sonuçları gösterecek şekilde sınıflandırılır.
    C: Bütçeler yalnızca kurumsal sonuçları gösterecek şekilde sınıflandırılır.
    D: Bütçeler yalnızca gelirlerin tahsil edildiği idarelere göre sınıflandırılır.
