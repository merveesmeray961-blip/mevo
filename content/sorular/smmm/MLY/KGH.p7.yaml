      uluslararası standartlara uygun olarak belirlenen bir sınıflandırmaya tabi tutularak hazırlanır ve uygulanır.”
      Bu nedenle B doğrudur. Püf noktaları: Hem kurumsal hem ekonomik boyutun birlikte arandığı, program yapısının
      esas alındığı ve yetkinin Cumhurbaşkanlığında olduğu unutulmamalıdır.

      '
