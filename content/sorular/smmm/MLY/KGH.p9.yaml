  - SGS
  ders: MLY
  unite: Kamu gelirleri ve harcamaları
  konu: KGH
  kazanim: Peacock-Wiseman
  tip: kavrama
  zorluk: 3
  kok: 'Peacock-Wiseman hipotezinin temel unsurlarını doğru sırayla eşleştiriniz.

    I. Yerinden etme (displacement) etkisi

    II. Denetim (inspection) etkisi

    III. Konsantrasyon etkisi


    Hangi sıralama hipotezin kronolojik/mantıksal akışını doğru yansıtır?'
  secenekler:
    A: I → II → III
    B: II → I → III
    C: III → I → II
    D: I → III → II
    E: II → III → I
  dogru: A
  aciklama:
    dogru_neden: Peacock-Wiseman hipotezinde önce bir sosyal sarsıntı (savaş vb.) kamu harcamalarını sıçratır (yerinden etme
      etkisi); ardından kamu, yeni harcama alanlarını inceler ve meşrulaştırır (denetim etkisi); uzun dönemde merkezi hükümetin
      payı artar (konsantrasyon etkisi). Mantıksal sıra I → II → III’tür.
    celdiriciler:
      B: Denetim etkisi yerinden etme sonrasındadır.
      C: Konsantrasyon uzun dönem sonucudur, başlangıç değildir.
      D: Denetim, konsantrasyondan önce gelir.
      E: Yerinden etme ilk adımdır.
