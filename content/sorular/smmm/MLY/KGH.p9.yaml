  konu: KGH
  kazanim: Wagner
  tip: uygulama
  zorluk: 3
  kok: Bir ülkede kişi başına gelir 10.000 $’dan 15.000 $’a yükselirken kamu harcamalarının GSYH içindeki payı %25’ten %32’ye
    çıkmıştır. Aynı dönemde özel sektör yatırımlarının GSYH payı gerilemiş, kentleşme oranı %40’tan %55’e yükselmiştir. Bu
    gözlem Wagner yasasının hangi mekanizmasıyla en tutarlıdır?
  secenekler:
    A: Yalnızca savaş dönemlerindeki geçici harcama sıçraması
