- id: SMMM-MLY-KGH-0017
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Kamu gelirleri ve harcamaları
  konu: KGH
  kazanim: Wagner
  tip: kavrama
  zorluk: 1
  kok: Wagner yasası ile Adolph Wagner’in ‘artan devlet faaliyetleri yasası’ arasındaki temel fark aşağıdakilerden hangisidir?
  secenekler:
    A: Wagner yasası yalnız savaş dönemlerini, artan devlet faaliyetleri yasası barış dönemlerini açıklar.
    B: Wagner yasası kamu harcamalarının mutlak düzeyini, artan devlet faaliyetleri yasası ise kamu harcamalarının GSYH içindeki
      payını vurgular.
    C: Wagner yasası kamu harcamalarının millî gelirden daha hızlı artmasını (göreli pay artışı) ileri sürerken, ‘artan devlet
      faaliyetleri’ ifadesi bu olgunun tarihsel gözlemine işaret eder; ikisi aynı hipotezin farklı adlandırmalarıdır.
    D: Artan devlet faaliyetleri yasası yalnız sosyal güvenlik harcamalarını, Wagner yasası tüm kamu harcamalarını kapsar.
    E: Wagner yasası azalan, artan devlet faaliyetleri yasası artan marjinal kamu harcama eğilimini öngörür.
  dogru: C
  aciklama:
    dogru_neden: Wagner’in ‘Gesetz der wachsenden Staatsausgaben’ hipotezi, sanayileşme ve kentleşme sürecinde kamu harcamalarının
      millî gelirden daha hızlı artarak GSYH içindeki payının yükselmesini öngörür. ‘Artan devlet faaliyetleri yasası’ bu
      hipotezin Türkçe literatürdeki yaygın karşılığıdır; ayrı bir teori değildir.
    celdiriciler:
      A: Wagner hipotezi savaş-barış ayrımı yapmaz; uzun dönemli yapısal bir eğilimdir.
      B: Hipotez hem mutlak hem göreli artışı içerir; temel vurgu göreli pay üzerinedir.
      D: Kapsam tüm kamu faaliyetleridir; sosyal güvenlikle sınırlı değildir.
      E: Marjinal eğilim kavramı Wagner hipotezinin parçası değildir.
    hesap_adimlari: []
