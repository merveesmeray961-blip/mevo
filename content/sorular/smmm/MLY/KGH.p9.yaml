    E: Peacock-Wiseman yerinden etme etkisinin kısa dönemli sonucu
  dogru: B
  aciklama:
    dogru_neden: Wagner hipotezi, ekonomik gelişme (kişi başına gelir artışı) ve kentleşme ile birlikte kamu hizmetlerine
      talebin gelir esnekliğinin 1’den büyük olması nedeniyle kamu harcamalarının GSYH payının yükselmesini öngörür. Verilen
      senaryo bu yapısal mekanizmayla uyumludur.
    celdiriciler:
      A: Senaryoda savaş unsuru yoktur; uzun dönemli yapısal değişim vardır.
      C: Parafiskal gelirler Wagner mekanizmasının parçası değildir.
      D: Baumol göreli fiyat etkisini açıklar; burada gelir ve kentleşme vurgulanmıştır.
      E: Peacock-Wiseman sıçramalı (displacement) etkiyi vurgular; burada sürekli pay artışı vardır.
