    dogru_neden: Baumol hipotezi, emek yoğun kamu hizmetlerinde (eğitim, sağlık, güvenlik) verimlilik artışının imalat sektörüne
      göre yavaş kalması nedeniyle birim maliyetlerin ve göreli fiyatların yükselmesini öngörür. I ve II doğrudur; III yanlıştır
      — göreli fiyat artışı kamu harcamalarının payını yükseltme eğilimindedir.
    celdiriciler:
      A: I doğru ama II de hipotezin temel sonucudur.
      B: II, I’in sonucudur; ikisi birlikte doğrudur.
      D: III hipotezin öngördüğünün tersidir.
      E: III yanlıştır.
