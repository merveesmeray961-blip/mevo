    celdiriciler:
      A: "Peacock-Wiseman hipotezi, kamu harcamalarının savaş ve kriz gibi toplumsal çalkantı dönemlerinde sıçrama yaptığını ve bu dönemlerden sonra eski düzeyine inmediğini (yer değiştirme etkisi) ileri sürer; kişi başına gelir artışına dayanmaz."
