  kok: Sanayileşme ve kentleşmeyle birlikte kişi başına gelir arttıkça kamu faaliyetlerinin genişlediğini ve kamu
    harcamalarının milli gelire oranının yükseldiğini ileri süren yaklaşım aşağıdakilerden hangisidir?
  secenekler:
    A: Peacock-Wiseman hipotezi
    B: Baumol hipotezi
    C: Niskanen'in bürokrasi modeli
    D: Wagner kanunu
    E: Mali yanılsama (Puviani) hipotezi
  dogru: D
  aciklama:
    dogru_neden: Wagner kanunu (kamu faaliyetlerinin artışı kanunu), sanayileşme, kentleşme ve kişi başına gelir
      artışıyla birlikte devletin üstlendiği işlevlerin genişlediğini ve kamu harcamalarının milli gelirden daha
      hızlı artarak milli gelire oranının yükseldiğini ileri sürer.
    celdiriciler:
      A: Peacock-Wiseman hipotezi, kamu harcamalarının savaş ve kriz gibi toplumsal çalkantı dönemlerinde sıçrama
        yaptığını ve bu dönemlerden sonra eski düzeyine inmediğini (yer değiştirme etkisi) ileri sürer; kişi başına
        gelir artışına dayanmaz.
      B: Baumol hipotezi, kamu hizmetlerinin emek yoğun olması nedeniyle bu alanda verimlilik artışının düşük kaldığını
        ve birim maliyetlerin, dolayısıyla harcamaların, arttığını açıklar.
      C: Niskanen'in modeli, kamu harcamalarının artışını bütçelerini en yüksek düzeye çıkarmaya çalışan bürokratların
        davranışıyla açıklar.
      E: Mali yanılsama hipotezi, kamu harcamalarının artışını vergi yükünün (dolaylı vergiler, borçlanma gibi yollarla)
        bireylerce olduğundan düşük algılanması ve bu nedenle daha fazla kamu hizmeti talep edilmesiyle açıklar;
        sanayileşme, kentleşme ve kişi başına gelir artışına dayanmaz.
