- id: SMMM-MLY-VTE-0005
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: negatif gelir vergisi
  tip: uygulama
  zorluk: 3
  kok: Negatif gelir vergisi sisteminde garanti edilen asgari gelir (temel gelir) G = 12.000 TL, vergi oranı t = %30’dur (hem
    pozitif hem negatif bölgede aynı oran uygulanır). Yıllık geliri Y = 20.000 TL olan bir bireyin eline geçecek net gelir
    kaç TL’dir? (Net gelir = G + (1 − t)·Y)
  secenekler:
    A: 6.000 TL
    B: 14.000 TL
    C: 20.000 TL
    D: 26.000 TL
    E: 32.000 TL
  dogru: D
  aciklama:
    dogru_neden: Negatif gelir vergisi formülü Net = G + (1 − t)·Y şeklindedir. G = 12.000, t = 0,30, Y = 20.000 için Net
      = 12.000 + 0,70 × 20.000 = 12.000 + 14.000 = 26.000 TL. Birey 6.000 TL net transfer almış olur (çünkü t·(Y − G/t) =
      0,30·(20.000 − 40.000) = −6.000).
    celdiriciler:
      A: Bu tutar alınan net transferdir; soru net geliri sormaktadır.
      B: Bu tutar yalnızca (1−t)·Y kısmıdır; G eklenmemiştir.
      C: Bu, transfer ve vergi hiç yokmuş gibi brüt gelirdir.
      E: G’nin iki katı eklenmesi veya yanlış oran kullanımı sonucu ortaya çıkar.
    hesap_adimlari:
    - G = 12.000 TL
    - (1 − t) = 0,70
    - (1 − t)·Y = 0,70 × 20.000 = 14.000 TL
    - Net gelir = 12.000 + 14.000 = 26.000 TL
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Negatif gelir vergisi (Friedman tipi)
    alinti: ''
  gecerlilik:
