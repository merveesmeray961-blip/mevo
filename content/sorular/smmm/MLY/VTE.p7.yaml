- id: SMMM-MLY-VTE-0003
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: çifte vergilendirme
  tip: uygulama
  zorluk: 3
  kok: Türkiye’de yerleşik bir mükellef, yurt dışında elde ettiği ticari kazanç üzerinden kaynak ülkede %15 stopaj ödemiş,
    aynı kazanç Türkiye’de de gelir vergisine tabi tutulmuştur. Çifte vergilendirmeyi önleme anlaşması (ÇVÖA) kapsamında mahsup
    yöntemi uygulandığında, aşağıdaki sonuçlardan hangisi doğrudur? (Türkiye’de ilgili kazanç için uygulanacak gelir vergisi
    oranı %35, kaynak ülkede ödenen stopaj 150.000 TL, Türkiye’de hesaplanan vergi 350.000 TL’dir.)
  secenekler:
    A: Türkiye’de ödenecek vergi 350.000 TL’dir; yurt dışında ödenen hiç mahsup edilemez.
    B: Türkiye’de ödenecek vergi 200.000 TL’dir; yurt dışında ödenen 150.000 TL’nin tamamı mahsup edilir.
    C: Türkiye’de ödenecek vergi 0 TL’dir; yurt dışında ödenen stopaj Türkiye vergisini tamamen karşılar.
    D: Türkiye’de ödenecek vergi 350.000 TL’dir; ancak 150.000 TL iade alınır.
    E: Türkiye’de ödenecek vergi 150.000 TL’dir; mahsup yalnızca stopaj tutarı kadar yapılır.
  dogru: B
  aciklama:
    dogru_neden: Mahsup yönteminde, kaynak ülkede ödenen vergi, Türkiye’de aynı kazanç üzerinden hesaplanan vergiden düşülür;
      ancak mahsup edilecek tutar, Türkiye’de hesaplanan vergiyi aşamaz. 150.000 TL < 350.000 TL olduğundan tamamı mahsup
      edilir ve Türkiye’de ödenecek net vergi 200.000 TL olur. Çifte vergilendirme teorisinde mahsup (kredi) yönteminin temel
      kuralıdır.
    celdiriciler:
      A: Mahsup yöntemi yurt dışında ödenen verginin düşülmesine imkân verir; hiç mahsup edilmez demek yanlıştır.
      C: Kaynak ülkede ödenen 150.000 TL, Türkiye vergisini (350.000 TL) karşılamaz; sıfır olmaz.
      D: Mahsup, iade değil, Türkiye’de hesaplanan vergiden düşme işlemidir; fazla ödeme yoktur.
      E: Mahsup üst sınırı Türkiye’de hesaplanan vergidir; stopaj tutarıyla sınırlı değildir, ancak bu örnekte stopaj daha
        küçüktür.
    hesap_adimlari:
    - 'Türkiye’de hesaplanan vergi: 350.000 TL'
    - 'Kaynak ülkede ödenen: 150.000 TL'
    - Mahsup edilebilir tutar = min(150.000, 350.000) = 150.000 TL
    - Türkiye’de ödenecek net vergi = 350.000 − 150.000 = 200.000 TL
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Çifte vergilendirme — mahsup (kredi) yöntemi
    alinti: ''
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Ek Madde 14
    alinti: Mükellefler, usulüne uygun yürürlüğe konulmuş bir çifte vergilendirmeyi önleme anlaşması hükümlerine aykırı olarak
      vergilendirildiği veya bu şekilde vergilendirileceğine ilişkin kuvvetli emareler bulunduğu iddiasıyla anlaşmanın “Karşılıklı
      Anlaşma Usulü” hükümlerine göre Gelir İdaresi Başkanlığına başvurabilir.
  gecerlilik:
    baslangic: '1961-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 350000 - 150000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
