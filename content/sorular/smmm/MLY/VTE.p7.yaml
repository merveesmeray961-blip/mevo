- id: SMMM-MLY-VTE-0011
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: negatif gelir vergisi
  tip: uygulama
  zorluk: 3
  kok: 'Negatif gelir vergisi sisteminde temel gelir garantisi (garanti edilen asgari gelir) 12.000 TL, marjinal vergi oranı
    %40 olarak belirlenmiştir. Yıllık geliri 20.000 TL olan bir kişi için ödenecek negatif gelir vergisi (yani devletin yapacağı
    net transfer) tutarı aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 0 TL
    B: 2.000 TL
    C: 4.000 TL
    D: 8.000 TL
    E: 12.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Negatif gelir vergisi formülü: Transfer = Garanti edilen gelir − (marjinal oran × fiili gelir). 12.000 −
      (0,40 × 20.000) = 12.000 − 8.000 = 4.000 TL. Kişi 20.000 TL gelir elde ettiği halde 4.000 TL net transfer alır; toplam
      kullanılabilir geliri 24.000 TL olur. Püf noktaları: Break-even noktası = 12.000 / 0,40 = 30.000 TL’dir; bu noktanın
      altında kalan her gelir düzeyinde pozitif transfer yapılır.

      '
    celdiriciler:
      A: Gelirin pozitif olmasını transfer yapılmaması sanmak.
      B: Garanti edilen gelir ile fiili gelir farkının yarısını almak veya oranı yanlış uygulamak.
      D: Yalnızca marjinal oran × gelir = 8.000 TL’yi transfer sanmak.
      E: Garanti edilen tutarı olduğu gibi transfer etmek; fiili geliri hiç dikkate almamak.
    hesap_adimlari:
    - Vergiye tabi tutulan kısım = 0,40 × 20.000 = 8.000
    - Transfer = 12.000 − 8.000 = 4.000
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: negatif gelir vergisi (Friedman)
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 12000 - (0.40 * 20000)
