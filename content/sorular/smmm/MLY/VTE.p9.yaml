- id: SMMM-MLY-VTE-0045
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: artan/düz/azalan oranlı vergi
  tip: uygulama
  zorluk: 3
  kok: 'Bir ülkede gelir vergisi tarifesi şu şekildedir: 0-50.000 TL arası %10, 50.001-150.000 TL arası %20, 150.001 TL üzeri
    %30. Ayşe’nin yıllık geliri 80.000 TL, Mehmet’in yıllık geliri 200.000 TL’dir. Bu tarife yapısına göre aşağıdaki ifadelerden
    hangisi doğrudur?'
  secenekler:
    A: Ayşe’nin ortalama vergi oranı Mehmet’inkinden yüksektir.
    B: Mehmet’in marjinal vergi oranı Ayşe’ninkinden düşüktür.
    C: Tarife artan oranlıdır; Mehmet’in ortalama vergi oranı Ayşe’ninkinden yüksektir.
    D: Tarife düz oranlıdır çünkü dilimler sabit oran içerir.
    E: Tarife azalan oranlıdır çünkü yüksek gelirde ek dilim oranı düşer.
  dogru: C
  aciklama:
    dogru_neden: 'Tarife dilim oranları matrah arttıkça yükseldiği için artan oranlıdır. Ayşe: 50.000×0,10 + 30.000×0,20 =
      5.000+6.000=11.000; ortalama=11.000/80.000=%13,75. Mehmet: 50.000×0,10 + 100.000×0,20 + 50.000×0,30 = 5.000+20.000+15.000=40.000;
      ortalama=40.000/200.000=%20. Mehmet’in ortalama oranı daha yüksektir.'
    celdiriciler:
      A: Ayşe’nin ortalaması %13,75, Mehmet’inki %20’dir; tersidir.
      B: Mehmet’in marjinal oranı %30, Ayşe’ninki %20’dir; Mehmet’inki daha yüksektir.
      D: Dilim oranları yükseldiği için düz oranlı değildir.
      E: Oranlar yükseldiği için azalan oranlı değildir.
    hesap_adimlari:
    - Ayşe vergisi = 50.000×0,10 + 30.000×0,20 = 11.000; ortalama = 11.000/80.000 = %13,75
    - Mehmet vergisi = 50.000×0,10 + 100.000×0,20 + 50.000×0,30 = 40.000; ortalama = 40.000/200.000 = %20
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Artan oranlı vergi tarifesi
