  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: Laffer eğrisi
  tip: kavrama
  zorluk: 1
  kok: 'Tek tepeli Laffer eğrisinde aşağıdaki noktaları doğru eşleştiriniz.

    I. Vergi oranı %0

    II. Vergi oranı %100

    III. Gelir maksimize eden oran


    Hangi ifade doğrudur?'
  secenekler:
    A: I ve II’de vergi geliri sıfırdır; III tepe noktasıdır.
    B: I’de gelir maksimum, II’de sıfırdır.
