- id: SMMM-MLY-VTE-0019
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: negatif gelir vergisi
  tip: kavrama
  zorluk: 2
  kok: 'Negatif gelir vergisi sisteminde aşağıdaki kavramları doğru eşleştiriniz.

    I. Temel gelir (G)

    II. Başa baş noktası

    III. Marjinal vergi oranı (t)


    Hangi ifade doğrudur?'
  secenekler:
    A: Başa baş noktası = G / t ; bu noktada net transfer sıfırdır.
    B: Başa baş noktası = G × t ; bu noktada vergi borcu maksimumdur.
    C: Temel gelir, yalnızca pozitif gelir diliminde uygulanır.
    D: Marjinal oran yalnız negatif dilimde geçerlidir.
    E: Başa baş noktası = G − t ; net transfer her zaman pozitiftir.
  dogru: A
  aciklama:
    dogru_neden: Negatif gelir vergisi formülünde net transfer = G − t × Y. Net transferin sıfır olduğu başa baş noktası Y*
      = G / t’dir. Bu noktadan sonra mükellef pozitif vergi ödemeye başlar.
    celdiriciler:
      B: Çarpım değil bölme işlemi geçerlidir; vergi borcu bu noktada sıfırdır.
      C: Temel gelir tüm gelir düzeylerinde (negatif bölgede) geçerlidir.
      D: Marjinal oran hem negatif hem pozitif dilimde aynıdır.
      E: Formül yanlıştır; net transfer başa baş noktasından sonra negatife döner.
    hesap_adimlari: []
