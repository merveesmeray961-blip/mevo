  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: artan/düz/azalan oranlı vergi
  tip: kavrama
  zorluk: 2
  kok: Marjinal vergi oranı ile ortalama vergi oranı arasındaki ilişki açısından aşağıdakilerden hangisi artan oranlı (progressive)
    bir vergi tarifesini doğru tanımlar?
  secenekler:
    A: Marjinal oran her matrah diliminde ortalama orana eşittir.
    B: Marjinal oran, ortalama oranın sürekli altında seyretmek zorundadır.
    C: Marjinal oran, matrah arttıkça ortalama oranı yukarı çekecek şekilde ortalama oranın üzerinde kalır.
    D: Ortalama oran sabit kalırken marjinal oran sıfırdır.
    E: Marjinal oran ile ortalama oran arasında hiçbir sistematik ilişki yoktur.
  dogru: C
  aciklama:
    dogru_neden: Artan oranlı tarifede her ek gelir dilimine uygulanan marjinal oran, o ana kadarki ortalama orandan yüksektir;
      bu nedenle ortalama oran da matrah arttıkça yükselir. Bu, progressivity’nin temel matematiksel tanımıdır.
    celdiriciler:
      A: Marjinal = ortalama eşitliği düz (proportional) tarifenin özelliğidir.
      B: Marjinal oranın ortalama oranın altında kalması azalan oranlı (regressive) tarifeyi tanımlar.
      D: Ortalama sabit, marjinal sıfır durumu vergi tarifesi değil, sabit vergi tutarı (lump-sum) durumudur.
      E: Tarife türlerinin sınıflandırılması tam da bu iki oran arasındaki ilişkiye dayanır.
    hesap_adimlari: []
