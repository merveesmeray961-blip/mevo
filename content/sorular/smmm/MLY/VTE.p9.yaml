- id: SMMM-MLY-VTE-0025
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Vergi teorisi
  konu: VTE
  kazanim: artan/düz/azalan oranlı vergi
  tip: uygulama
  zorluk: 3
  kok: 'Bir ülkede gelir vergisi tarifesi şu şekildedir: 0–40.000 TL arası %10, 40.001–120.000 TL arası %20, 120.001 TL ve
    üzeri %30. Aynı ülkede bir mükellefin yıllık matrahı 60.000 TL, başka bir mükellefin yıllık matrahı 160.000 TL’dir. Bu
    iki mükellefin ortalama vergi oranları sırasıyla yaklaşık yüzde kaçtır ve tarife hangi türdür?'
  secenekler:
    A: '%10 ve %20 — düz oranlı'
    B: '%13,33 ve %20 — artan oranlı'
    C: '%15 ve %25 — azalan oranlı'
    D: '%20 ve %30 — artan oranlı'
    E: '%12 ve %18 — artan oranlı'
  dogru: B
  aciklama:
    dogru_neden: 'Birinci mükellef: 40.000 × 0,10 = 4.000; (60.000 − 40.000) × 0,20 = 4.000; toplam vergi 8.000; ortalama
      oran 8.000 / 60.000 ≈ %13,33. İkinci mükellef: 40.000 × 0,10 = 4.000; 80.000 × 0,20 = 16.000; (160.000 − 120.000) ×
      0,30 = 12.000; toplam 32.000; ortalama 32.000 / 160.000 = %20. Matrah arttıkça ortalama oran yükseldiği için tarife
      artan oranlıdır.'
    celdiriciler:
      A: Düz oranlı değildir; ortalama oranlar farklıdır.
      C: Azalan oranlı değildir; ortalama oranlar artmaktadır.
      D: Marjinal oranları ortalama oran sanmak.
      E: Yanlış hesap.
    hesap_adimlari:
    - 1. mükellef vergi = 40000*0.1 + 20000*0.2 = 4000+4000=8000; ort = 8000/60000 ≈ 0.1333
    - 2. mükellef vergi = 40000*0.1 + 80000*0.2 + 40000*0.3 = 4000+16000+12000=32000; ort = 32000/160000 = 0.20
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Artan oranlı tarife
    alinti: ''
