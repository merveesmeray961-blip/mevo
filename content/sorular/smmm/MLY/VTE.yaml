- id: SMMM-MLY-VTE-0001
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Maliye
  konu: VTE
  kazanim: artan/düz/azalan oranlı vergi
  tip: uygulama
  zorluk: 1
  soru_bicimi: standart
  kok: 'Bir vergi tarifesinde farklı matrah düzeylerine karşılık gelen vergi tutarları aşağıda verilmiştir.


    | Matrah (TL) | Vergi (TL) |

    |---|---|

    | 10.000 | 1.500 |

    | 20.000 | 3.000 |

    | 50.000 | 7.500 |


    Buna göre bu tarife aşağıdakilerden hangisidir?'
  secenekler:
    A: Düz (sabit) oranlı tarife
    B: Artan oranlı tarife
    C: Azalan oranlı tarife
    D: Maktu (spesifik) tarife
    E: Karma (bileşik) tarife
  dogru: A
  aciklama:
    dogru_neden: 'Ortalama vergi oranı her matrah düzeyinde aynıdır: 1.500 / 10.000 = 3.000 / 20.000 = 7.500 / 50.000
      = %15. Matrah ne olursa olsun aynı oranın uygulandığı, vergi tutarının matrahla orantılı arttığı tarife düz
      (sabit, nispi) oranlı tarifedir.'
    celdiriciler:
      B: Artan oranlı tarifede matrah büyüdükçe ortalama vergi oranı yükselir; tabloda oran tüm düzeylerde %15'te
        sabittir.
      C: Azalan oranlı tarifede matrah büyüdükçe ortalama vergi oranı düşer; tabloda oran değişmemektedir.
      D: Maktu tarifede vergi, matrahın değerine bağlı bir oranla değil, miktar başına ya da sabit tutar olarak
        belirlenir; tabloda vergi matrahın sabit bir yüzdesidir.
      E: Karma (bileşik) tarifede vergi, matrahın değerine uygulanan bir oran ile miktar başına alınan maktu bir
        tutarın birlikte uygulanmasıyla bulunur; tabloda maktu bir bileşen yoktur, vergi her düzeyde matrahın yalnızca
        %15'idir (ör. 10.000 TL matrahta vergi tam 1.500 TL).
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: 'Vergi tarifeleri: düz (sabit) oranlı, artan oranlı, azalan oranlı, maktu ve karma (bileşik) tarife'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: E şıkkı 'Dilim usulü artan oranlı tarife' → 'Karma (bileşik) tarife'; E açıklaması ve kaynak tanımı güncellendi.
    neden: 'G5 (küçük): B (artan oranlı) ile E (dilim usulü artan oranlı) iç içeydi; birlikte elenebiliyordu.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: gecerlilik.baslangic 2026-10-03 (üretim tarihi) → 2026-01-01 (yasal dayanağı olmayan teori sorusu).
    neden: 'Rötuş talimatı §3: üretim tarihi başlangıç olarak yazılmıştı.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-MLY-VTE-0002
  sinav: smmm
  bolum:
  - SGS
  ders: MLY
  unite: Maliye
  konu: VTE
  kazanim: Laffer eğrisi
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Tek tepeli ve zaman içinde değişmeyen bir Laffer eğrisinin geçerli olduğu varsayılan bir ekonomide gelir
    vergisi oranı %40 iken vergi matrahı 1.000 milyar TL'dir. Oran %50'ye yükseltildiğinde, çalışma ve yatırım isteğinin
    azalması ile kayıt dışılığın artması sonucunda matrah 700 milyar TL'ye gerilemiştir. Buna göre aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Vergi oranı artışı vergi gelirini artırmıştır; ekonomi eğrinin yükselen bölgesindedir.
    B: Vergi geliri 50 milyar TL azalmıştır; %50 oranı eğrinin tepe noktasının sağında kalan yasak bölgededir.
    C: Matrah %30 daraldığından vergi geliri de %30 oranında azalmıştır.
    D: Vergi oranı yeniden %40'a indirilirse vergi geliri bugünkü düzeyinin altına düşer.
    E: Vergi gelirini en yüksek düzeye çıkaran oran %50'nin üzerinde bir orandır.
  dogru: B
  aciklama:
    dogru_neden: 'Vergi geliri, vergi oranı ile matrahın çarpımıdır. %40 oranında gelir 0,40 x 1.000 = 400 milyar
      TL, %50 oranında 0,50 x 700 = 350 milyar TL''dir; oran artışı geliri 50 milyar TL azaltmıştır. Tek tepeli
      Laffer eğrisinde tepe noktasının solunda (yükselen bölge) oran artışı vergi gelirini artırır, sağında (yasak
      ya da engelleyici bölge) azaltır. Oran artışı geliri azalttığına göre gelirin en yüksek olduğu oran %50''nin
      altındadır ve %50 oranı tepe noktasının sağındaki yasak bölgededir. Tuzak: matrahtaki daralma oranını gelirdeki
      daralma oranı sanmak ya da oran artışının vergi gelirini her durumda artıracağını düşünmek.'
    celdiriciler:
      A: Gelir 400 milyar TL'den 350 milyar TL'ye düşmüştür; oran artışının geliri azaltması ekonominin yükselen
        bölgede değil, tepe noktasının sağında olduğunu gösterir.
      C: Matrah %30 daralırken oran 10 puan (göreli olarak %25) artmıştır; gelir 400 milyar TL'den 350 milyar TL'ye,
        yani %12,5 azalmıştır. Matrahtaki değişme oranı gelirdeki değişme oranına eşit değildir.
      D: Eğri değişmediğinden oran %40'a indirildiğinde matrah 1.000 milyar TL'ye döner ve gelir 400 milyar TL'ye
        yükselir; gelir azalmaz, artar.
      E: Tepe noktası %50'nin üzerinde olsaydı %40'tan %50'ye çıkış eğrinin yükselen bölgesinde kalır ve geliri
        artırırdı; gelir azaldığına göre tepe noktası %50'nin altındadır.
  kaynaklar:
  - mevzuat: Kamu maliyesi teorisi — genel kabul görmüş tanım
    madde: Laffer eğrisi (yükselen bölge, tepe noktası ve yasak bölge)
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: tanım sorusu yerine sayısal bir Laffer senaryosu (oran %40 → %50, matrah 1.000 → 700
      milyar TL) verilip gelirdeki değişme ve eğri üzerindeki konum soruluyor; şıklar, açıklama ve çeldirici gerekçeleri
      yeniden yazıldı (doğru şık B); tip kavrama → uygulama; zorluk 1 → 2; gecerlilik.baslangic 2026-10-03 → 2026-01-01
      (teori sorusu).'
    neden: 'Rötuş: GZ''de ortalama aday rahat çözdü (güven 4); MLY soruları kolay kalmıştı. Zorlaştırma iki adımlı
      uygulama ve tuzak çeldiriciyle (matrah–gelir değişme oranı karışıklığı), SGS düzeyinde yapıldı.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
