  - SGS
  ders: SHK
  unite: Borçlar hukuku
  konu: BRC
  kazanim: 'sözleşmenin kurulması: öneri ve kabul'
  tip: uygulama
  zorluk: 2
  kok: Telefon görüşmesi sırasında kabul için süre vermeden eşyasını satmayı öneren S'ye karşı taraf A, ertesi gün kabul ettiğini
    bildirmiştir. 6098 sayılı Türk Borçlar Kanunu'na göre S'nin durumu hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: S, önerisiyle bir hafta bağlıdır.
    B: S, ertesi günkü kabulle bağlıdır.
    C: S, önerisiyle bir ay bağlıdır.
    D: S'nin bağlılığı yalnızca yazılı öneride sona erer.
    E: S, hemen kabul edilmeyen öneriden kurtulmuştur.
  dogru: E
  aciklama:
    dogru_neden: Md. 4/1 uyarınca kabul için süre belirlenmeksizin hazır olan bir kişiye yapılan öneri hemen kabul edilmezse
      öneren, önerisiyle bağlılıktan kurtulur; md. 4/2 uyarınca telefon gibi araçlarla doğrudan iletişim sırasında yapılan
      öneri hazır olanlar arasında yapılmış sayılır.
    celdiriciler:
      A: Md. 4/1 ve 4/2'ye göre telefon gibi doğrudan iletişim hazır olanlar arasında sayılır; bir haftalık bağlılık öngörülmemiştir.
      B: Hemen kabul edilmeyen öneriyle bağlılık kalkar; ertesi günkü kabul S'yi bağlamaz.
      C: Md. 4'te bir aylık bağlılık süresi öngörülmemiştir.
      D: Md. 4/2 telefonla yapılan öneriyi de hazır olanlar arasında saydığından yazılı şekil aranmaz.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 4/1-2
    alinti: Kabul için süre belirlenmeksizin hazır olan bir kişiye yapılan öneri hemen kabul edilmezse; öneren, önerisiyle
      bağlılıktan kurtulur. Telefon, bilgisayar gibi iletişim sağlayabilen araçlarla doğrudan iletişim sırasında yapılan öneri,
      hazır olanlar arasında yapılmış sayılır.
