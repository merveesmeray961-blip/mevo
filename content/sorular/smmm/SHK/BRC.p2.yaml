- id: SMMM-SHK-BRC-0003
  sinav: smmm
  bolum:
  - SGS
  ders: SHK
  unite: Borçlar hukuku
  konu: BRC
  kazanim: 'satış sözleşmesi: gözden geçirme ve bildirme'
  tip: kavrama
  zorluk: 3
  kok: Alıcı R, devraldığı eşyada olağan bir gözden geçirmeyle ortaya çıkarılamayacak gizli bir ayıp fark etmiştir. 6098 sayılı
    Türk Borçlar Kanunu'na göre R'nin bu ayıp bakımından yükümlülüğü aşağıdakilerden hangisidir?
  secenekler:
    A: Ayıbı ancak satıcı sorarsa bildirmelidir.
    B: Ayıbı iki yıl içinde bildirmesi yeterlidir.
    C: Ayıbı yalnızca noter aracılığıyla bildirebilir.
    D: Anladığında hemen satıcıya bildirmelidir.
    E: Gizli ayıbı bildirmesi gerekmez.
  dogru: D
  aciklama:
    dogru_neden: 'Md. 223/2 uyarınca olağan bir gözden geçirmeyle ortaya çıkarılamayacak bir ayıp sonradan anlaşılırsa hemen
      satıcıya bildirilmelidir; bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır. Püf noktaları: Açık ayıpta
      uygun süre içinde bildirim, gizli ayıpta ise ayıbın anlaşılmasından sonra hemen bildirim gerekir; bildirim yoksa alıcı
      eşyayı ayıpla birlikte kabul etmiş sayılır.'
    celdiriciler:
      A: Bildirim yükümlülüğü satıcının sormasına bağlı değildir.
      B: Md. 223/2 gizli ayıpta da hemen bildirim arar; iki yıllık bir süre öngörmez.
      C: Md. 223 bildirim için noter şekli aramaz.
      E: Bildirilmezse eşya ayıpla birlikte kabul edilmiş sayılır; bildirim gereksiz değildir.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 223/1-2
    alinti: Alıcı, devraldığı satılanın durumunu işlerin olağan akışına göre imkân bulunur bulunmaz gözden geçirmek ve satılanda
      satıcının sorumluluğunu gerektiren bir ayıp görürse, bunu uygun bir süre içinde ona bildirmek zorundadır. Alıcı gözden
      geçirmeyi ve bildirimde bulunmayı ihmal ederse, satılanı kabul etmiş sayılır. Ancak, satılanda olağan bir gözden geçirmeyle
      ortaya çıkarılamayacak bir ayıp bulunması hâlinde, bu hüküm uygulanmaz. Bu tür bir ayıbın bulunduğu sonradan anlaşılırsa,
      hemen satıcıya bildirilmelidir; bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır.
