    ölüm sigortaları primi (%21), kısa vadeli sigorta kolları primi (%2,25) ve genel sağlık sigortası primi (%12,5) oranlarının
    toplamı üzerinden primini ödemektedir. Bu kişinin aylık toplam primi kaç ₺'dir? (Prime esas kazancın alt ve üst sınırlar
    arasında olduğu kabul edilecektir.)
