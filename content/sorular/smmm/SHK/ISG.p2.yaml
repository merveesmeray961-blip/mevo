    2025 tarihinde yaptığı bildirimle feshetmiştir. Sözleşmede bildirim sürelerini artıran bir hüküm yoktur. 4857 sayılı İş
    Kanunu'na göre D'nin sözleşmesinin sona ermesi için bildirimden sonra en az ne kadar süre geçmesi gerekir?
