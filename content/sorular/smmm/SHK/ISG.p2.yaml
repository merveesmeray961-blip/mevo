  aciklama:
    dogru_neden: '4857 sayılı Kanun md. 17/1 uyarınca işi birbuçuk yıldan üç yıla kadar sürmüş işçi için bildirim süresi altı
      haftadır. D''nin kıdemi fesih bildirimi tarihinde 2 yıl 9 ay 26 gündür. Püf noktaları: Kıdemi bildirim tarihine kadar
      hesaplayın; üç yıl dolmadığı için sekiz hafta uygulanmaz. Bildirim süreleri asgari olduğundan sözleşmede artırım yoksa
      kanundaki süre esas alınır.'
    celdiriciler:
      A: İki hafta, işi altı aydan az sürmüş işçi için öngörülen süredir.
      B: Dört hafta, işi altı aydan birbuçuk yıla kadar sürmüş işçi için öngörülen süredir.
      D: Sekiz hafta, işi üç yıldan fazla sürmüş işçi içindir; D'nin kıdemi üç yılı doldurmamıştır.
      E: On hafta, md. 17/1'de öngörülen bir süre değildir.
  kaynaklar:
  - mevzuat: 4857 sayılı İş Kanunu
    madde: md. 17/1
    alinti: a) İşi altı aydan az sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak iki hafta sonra,
      b) İşi altı aydan birbuçuk yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak dört hafta
      sonra, c) İşi birbuçuk yıldan üç yıla kadar sürmüş olan işçi için, bildirimin diğer tarafa yapılmasından başlayarak
