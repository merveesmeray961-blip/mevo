      C: 1.312,50 ₺ yüzde yirmibeş artırımla bulunur; bu oran fazla sürelerle çalışma içindir.
      E: 2.100 ₺ yüzde yüz artırımla bulunur; md. 41'deki genel oran yüzde elli, yüzde yüz ise yer altı maden işleri için
        öngörülen bir orandır.
