      toplamı üzerinden primlerini öder: %21 + %2,25 + %12,5 = %35,75. 100.000 × %35,75 = 35.750 ₺. Püf noktaları: 4/b sigortalısı
      işveren olmadığı için bütün hisseleri kendisi öder; sigortalı ve işveren hisselerini ayırıp yalnızca birini almayın.'
