      tescil edilmiş olsalar bile iyiniyetli üçüncü kişilere karşı ileri sürülemez; tutar sınırlaması bu gruptadır. Püf noktaları:
      Yalnızca iki sınırlama (şube, birlikte imza) tescille etkili olur; 250.000 TL gibi tutarlar sınırlamanın türünü değiştirmez,
      gereksiz veridir.'
