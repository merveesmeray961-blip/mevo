  konu: TCR
  kazanim: temsil yetkisinin sınırlandırılması
  tip: uygulama
  zorluk: 3
  kok: İşletme sahibi M, ticari temsilcisinin yetkisini birlikte imza koşuluna bağlamış ve bunu tescil ettirmiş; ayrıca temsilcinin
    100.000 TL'nin üzerindeki işlemleri yapamayacağını belirlemiş ve bunu da tescil ettirmiştir. Temsilci tek başına imzalayarak
    iyiniyetli T ile 250.000 TL'lik bir sözleşme yapmıştır. 6098 sayılı Türk Borçlar Kanunu'nun 549 uncu maddesine göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Sınırlamaların hiçbiri iyiniyetli T'ye karşı ileri sürülemez; bu nedenle sözleşme M'yi bağlar ve T hak kazanır.
    B: Sözleşme, tescilli birlikte imza koşuluna aykırı olduğundan M'yi bağlamaz; tutar sınırlaması tescilli olsa da T'ye
      ileri sürülemez.
    C: Tutar sınırlaması tescilli olduğundan sözleşme M'yi bağlamaz; birlikte imza koşulu tescil edilse bile ileri sürülemez.
    D: Her iki sınırlama da tescil edildiğinden iyiniyetli T'ye ileri sürülebilir ve sözleşme M'yi bağlamaz.
    E: Sözleşme M'yi bağlar; çünkü birlikte imza koşulu, ancak tutar sınırlamasıyla birlikte tescil edilirse iyiniyetli üçüncü
      kişilere karşı hüküm doğurur.
