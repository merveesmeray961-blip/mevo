    devredilen gayrimenkul 60.000.000 TL'ye satılmıştır. Satış tutarı yatırımcılar arasında nominal tutarları oranında paylaştırılacaktır.
    6362 sayılı Sermaye Piyasası Kanunu'nun 31/B maddesi esas alındığında nominal değeri 400.000 TL olan bir yatırımcıya kaç
