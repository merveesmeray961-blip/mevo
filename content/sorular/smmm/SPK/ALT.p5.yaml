  soru_bicimi: standart
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre merkezî takas kuruluşları ve takasa ilişkin aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Takas kuruluşları, üyelerinin müşterilerine olan yükümlülüklerinden sorumlu değildir.
    B: Merkezî takas kuruluşlarının kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı tarafından izin verilir.
    C: Merkezî takas kuruluşunun üyesi hakkında idari ve adli merciler nezdinde tasfiye işlemlerine başlanması hâlinde,
      o üyenin takas talimat ve işlemleri geri alınabilir.
    D: Merkezî karşı taraf hizmeti kapsamında alınan teminatların mülkiyeti, takas kuruluşuna geçmez; teminatı veren
      üyede kalır.
    E: Kurul, borsalar ve teşkilatlanmış diğer pazar yerleri dışında gerçekleştirilen işlemlerin takasının merkezî
      takas kuruluşu nezdinde yapılmasını zorunlu tutamaz.
  dogru: A
  aciklama:
    dogru_neden: md. 78/2'ye göre takas kuruluşları, üyelerinin müşterilerine olan yükümlülüklerinden sorumlu değildir.
    celdiriciler:
      B: md. 77/1'e göre merkezî takas kuruluşlarının kuruluşuna Kurulun teklifi üzerine ilgili Bakan tarafından
        izin verilir; Cumhurbaşkanı izni borsalar için öngörülmüştür (md. 65/1).
      C: md. 79/1'e göre takas talimat ve işlemleri ile ödeme işlemleri, üyelerin faaliyetlerinin durdurulması veya
        tasfiye işlemlerine başlanması hâlinde bile geri alınamaz ve iptal edilemez.
      D: md. 78/2'ye göre merkezî karşı taraf hizmeti çerçevesinde alınan teminatların mülkiyeti takas kuruluşuna
        geçer.
      E: md. 77/3'e göre Kurul, borsalar ve teşkilatlanmış diğer pazar yerleri dışında gerçekleştirilen işlemlerin
        takasının merkezî takas kuruluşu nezdinde yerine getirilmesini zorunlu tutabilir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 77/1 ve 77/3
    alinti: Merkezî takas kuruluşlarının kuruluşuna Kurulun teklifi üzerine ilgili Bakan tarafından izin verilir.
      Bu kuruluşların faaliyete geçmesi Kurulun iznine tabidir. ... Ayrıca Kurul, borsalar ve teşkilatlanmış diğer
      pazar yerleri dışında gerçekleştirilen sermaye piyasası araçları ile ilgili işlemlerin takasının merkezî takas
      kuruluşu nezdinde yerine getirilmesini zorunlu tutabilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 78/2
    alinti: Merkezî karşı taraf hizmeti çerçevesinde takas kuruluşları tarafından alınan teminatların mülkiyeti
      takas kuruluşuna geçer. ... Takas kuruluşları, üyelerinin müşterilerine olan yükümlülüklerinden sorumlu değildir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/1
    alinti: (1) Sermaye piyasası araçlarının takas talimat ve işlemleri ile ödeme işlemleri, merkezî takas kuruluşlarının
      üyelerinin faaliyetlerinin geçici ya da sürekli olarak durdurulması, idari ve adli merciler nezdinde tasfiye
      işlemlerine başlanması durumu da dâhil olmak üzere, geri alınamaz ve iptal edilemez.
