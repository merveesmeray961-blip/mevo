  kok: Temerrüt hâlinde teminattan alacağın karşılanması söz konusu olduğunda teminat yöneticisi bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Teminat yöneticisi ancak adli merciden izin aldıktan sonra teminatı satabilir.
    B: Teminat yöneticisi yalnız yatırımcıların tamamının yazılı onayıyla teminatı satabilir.
    C: Teminat yöneticisi teminatı yalnız açık artırmayla nakde çevirebilir.
    D: Teminat yöneticisinin teminatı satabilmesi için önce ihbar, ihtar ve ayrıca süre verme şartlarının tamamlanması gerekir.
    E: Teminat yöneticisi, herhangi bir ihbar veya ihtar, süre verme ya da adli veya idari merciden izin veya onay alma gibi
      ön şartlar aranmaksızın teminat konusu varlıkları satıp bedellerini yatırımcılar arasında paylaştırabilir.
  dogru: E
  aciklama:
    dogru_neden: SPKn md. 31/B/5, temerrüt veya kanun/sözleşmede öngörülen sebepler gerçekleştiğinde teminat yöneticisinin
      belirli ön şartları yerine getirmeksizin teminat konusu varlıkları satıp bedellerini yatırımcılar arasında paylaştırabilmesine
      izin verir.
    celdiriciler:
      A: Hüküm adli merciden izin alma şartını kaldırır.
      B: Yatırımcıların tamamının yazılı onayı şeklinde bir ön şart düzenlenmemiştir.
      C: Açık artırma zorunlu değildir; hüküm açık artırma veya başka bir yol ile nakde çevirmeyi ön şart olmaksızın düzenler.
      D: İhbar, ihtar ve süre verme yükümlülükleri de ön şart olarak aranmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 31/B/5
    alinti: '(5) Temerrüt hâlinde ya da kanun veya sözleşme hükümlerinde öngörülen sebeplerle,

      teminattan alacağın karşılanması söz konusu olduğunda; herhangi bir ihbar veya ihtarda bulunma,

