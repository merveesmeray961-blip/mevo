- id: SMMM-SPK-ALT-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Piyasa altyapıları
  konu: ALT
  kazanim: veri depolama
  tip: uygulama
  zorluk: 3
  kok: Kurul, sistemik riskin gözetimi amacıyla bir sermaye piyasası işleminin taraflarından işlem bilgilerini yetkilendirdiği
    veri depolama kuruluşuna bildirmelerini istemiştir. Kuruluş, özel mevzuatındaki sır saklama yükümlülüğünü gerekçe göstererek
    bilgileri vermemekte; ayrıca veri depolama kuruluşunda bulunan bilgilerin başka bir kamu tüzel kişisine Kurul onayı olmaksızın
    aktarılması planlanmaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kuruluş sır saklama yükümlülüğünü ileri sürerek bilgileri vermeyebilir; aktarım için Kurul onayı gerekmez.
    B: Bilgilerin yalnız doğrudan Kurula verilmesi mümkündür; veri depolama kuruluşuna bildirim yapılamaz.
    C: Bilgilerin verilmesi zorunludur; ancak kamu tüzel kişileri arasında paylaşım için ayrıca Kurul onayı aranmaz.
    D: Kurul veri depolama kuruluşuna bildirim isteyebilir, fakat özel mevzuattaki sır saklama yükümlülüğü bildirimi engeller.
    E: Kuruluş sır saklama yükümlülüğünü ileri sürerek bildirimden kaçınamaz; veri depolama kuruluşundaki bilgilerin kamu
      tüzel kişileri dâhil üçüncü kişilerle paylaşılması ise Kurulun onayına tabidir.
  dogru: E
  aciklama:
    dogru_neden: 'SPKn md. 87/1, talep edilen bilgilerin sır saklama yükümlülüğü ileri sürülerek verilmemesini engeller; md.
      87/3 ise veri depolama kuruluşundaki bilgilerin üçüncü kişilerle paylaşımını Kurul onayına bağlar. Püf noktaları: Bildirim
      yükümlülüğü ile sonradan bilgi paylaşımı iki ayrı kuraldır; sır saklama itirazı ilk aşamada koruma sağlamaz, paylaşımda
      ise Kurul onayı aranır.'
    celdiriciler:
      A: Sır saklama yükümlülüğü ileri sürülemez ve üçüncü kişilerle paylaşım için Kurul onayı gerekir; bu nedenle aktarım
        kısmı yanlıştır.
      B: md. 87/1 veri depolama kuruluşuna bildirim yapılmasına açıkça izin verir.
      C: md. 87/3 kamu tüzel kişilerini de üçüncü kişiler kapsamına alır ve Kurul onayı ister.
      D: Sır saklama yükümlülüğü bilgilerin verilmesini engellemez; md. 87/1 bunun aksini açıkça söyler.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 87/1
    alinti: 'MADDE 87 – (1) Sistemik riskin gözetimi ve finansal istikrarın korunması amacıyla,

      Kurul, sermaye piyasasında gerçekleştirilen işlemlere ilişkin olarak, bu işlemleri

      gerçekleştirenlerden, bu işlemlere ilişkin bilgilerin, belirleyeceği şekil ve içerikte, doğrudan

      kendisine veya yetkilendireceği bir veri depolama kuruluşuna bildirilmesini isteyebilir. Bu

      madde kapsamında, bildirim yapmakla yükümlü olanlar, özel mevzuatındaki gizlilik ve sır

      saklama yükümlülüklerini ileri sürerek talep edilen bilgileri vermekten imtina edemez.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 87/3
    alinti: '(3) Veri depolama kuruluşları nezdindeki bilgilerin kamu tüzel kişileri dâhil üçüncü

      kişiler ile paylaşımı Kurulun onayına tabidir. Bu fıkranın uygulanmasında kişisel verilerin

      kullanılmasına ilişkin mevzuata riayet edilir.'
