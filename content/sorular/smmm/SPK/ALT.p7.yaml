- id: SMMM-SPK-ALT-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Piyasa altyapıları
  konu: ALT
  kazanim: merkezi takas
  tip: kavrama
  zorluk: 2
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre merkezî takas kuruluşlarının faaliyetlerine ilişkin aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Merkezî takas kuruluşlarının kuruluşuna Cumhurbaşkanı tarafından doğrudan izin verilir.
    B: Takas kuruluşları, üyelerinin müşterilerine olan yükümlülüklerinden sorumludur.
    C: Merkezî karşı taraf hizmeti kapsamında alınan teminatların mülkiyeti takas kuruluşuna geçer.
    D: Üyelerin faaliyetleri durdurulduğunda takas talimatları ve ödeme işlemleri geri alınabilir.
    E: Kurul, borsalar dışındaki sermaye piyasası aracı işlemlerinin takasının merkezî takas kuruluşunda yapılmasını zorunlu
      tutamaz.
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 78/2'ye göre merkezî karşı taraf hizmeti çerçevesinde alınan teminatların mülkiyeti takas kuruluşuna
      geçer. Aynı fıkra takas kuruluşlarının üyelerinin müşterilerine olan yükümlülüklerinden sorumlu olmadığını düzenler;
      md. 79/1 ise takas talimat ve işlemleri ile ödeme işlemlerinin belirli durumlarda geri alınamayacağını ve iptal edilemeyeceğini
      belirtir.
    celdiriciler:
      A: Merkezî takas kuruluşlarının kuruluşuna Kurulun teklifi üzerine ilgili Bakan tarafından izin verilir; Cumhurbaşkanı
        düzenlemesi borsalar için md. 65/1'de yer alır.
      B: Md. 78/2 açıkça takas kuruluşlarının üyelerinin müşterilerine olan yükümlülüklerinden sorumlu olmadığını belirtir.
      D: Md. 79/1, üyelerin faaliyetlerinin geçici veya sürekli durdurulması hâlinde dahi takas talimat ve işlemleri ile ödeme
        işlemlerinin geri alınamayacağını düzenler.
      E: Md. 77/3 Kurula, borsalar ve teşkilatlanmış diğer pazar yerleri dışındaki işlemlerin takasını merkezî takas kuruluşu
        nezdinde zorunlu tutma yetkisi verir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 78/2
    alinti: "MADDE 77 – (1) Merkezî takas kuruluşları, borsalarda ve teşkilatlanmış diğer pazar\nyerlerinde işlem gören sermaye\
      \ piyasası araçlarının teslimi, bedellerinin ödenmesi ve bu\n\fişlemlere ilişkin teminat yükümlülüklerinin ifası ile\
      \ ilgili işlemleri yürüten anonim ortaklık\nşeklindeki özel hukuk tüzel kişiliğini haiz kurumlardır. Merkezî takas kuruluşlarının\n\
      kuruluşuna Kurulun teklifi üzerine ilgili Bakan tarafından izin verilir. Bu kuruluşların\nfaaliyete geçmesi Kurulun\
      \ iznine tabidir."
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/1
    alinti: 'mülkiyeti takas kuruluşuna

      geçer.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 77/1 ve 77/3
    alinti: 'MADDE 79 – (1) Sermaye piyasası araçlarının takas talimat ve işlemleri ile ödeme

      işlemleri, merkezî takas kuruluşlarının üyelerinin faaliyetlerinin geçici ya da sürekli olarak

      durdurulması, idari ve adli merciler nezdinde tasfiye işlemlerine başlanması durumu da dâhil

      olmak üzere, geri alınamaz ve iptal edilemez.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 77/3
    alinti: 'Ayrıca Kurul, borsalar ve teşkilatlanmış diğer pazar

      yerleri dışında gerçekleştirilen sermaye piyasası araçları ile ilgili işlemlerin takasının merkezî

      takas kuruluşu nezdinde yerine getirilmesini zorunlu tutabilir.'
