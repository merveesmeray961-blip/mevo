- id: SMMM-SPK-ALT-0001
  sinav: smmm
  bolum: [YET]
  ders: SPK
  unite: Piyasa altyapıları
  konu: ALT
  kazanim: borsalar
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: |-
    6362 sayılı Sermaye Piyasası Kanunu'na göre borsalara ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. Borsaların kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı tarafından izin verilir; borsaların faaliyete geçmesi ise Kurulun iznine tabidir.
    II. Borsalara karşı açılacak davalar idari yargıda görülür.
    III. Kuruluş izninden itibaren bir yıl içinde faaliyet izni için Kurula başvurmayan borsanın kuruluş izni iptal olur; zorunlu şartların varlığı hâlinde bu süre Kurulca bir yıl uzatılabilir.
    IV. Borsa başkanı, yönetim kurulu üyeleri ve üst yönetimi hakkında Kanunda yer alan faaliyetleri nedeniyle soruşturma yapılabilmesi Kurulun yazılı iznine bağlıdır.
  secenekler:
    A: "I ve II"
    B: "I ve III"
    C: "II ve IV"
    D: "I, III ve IV"
    E: "I, II, III ve IV"
  dogru: D
  aciklama:
    dogru_neden: >-
      SPKn md. 65/1'e göre borsaların kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı izin verir ve
      faaliyete geçmeleri Kurul iznine tabidir (I doğru). md. 65/4'e göre kuruluş izninden itibaren bir yıl
      içinde Kurula başvuruda bulunmayan kuruluşun kuruluş izni iptal olur; bu süre zorunlu şartların varlığı
      hâlinde Kurulca bir yıl uzatılabilir (III doğru). md. 65/12'ye göre borsa başkanı, yönetim kurulu
      üyeleri ve üst yönetimi hakkında Kanundaki faaliyetleri nedeniyle soruşturma yapılabilmesi Kurulun
      yazılı iznine bağlıdır (IV doğru). md. 65/11'e göre ise borsalara karşı açılacak davalar adli yargıda
      görülür (II yanlış).
    celdiriciler:
      A: "II numaralı ifade md. 65/11'e aykırıdır; borsalara karşı açılacak davalar idari değil adli yargıda görülür. Ayrıca doğru olan III ve IV dışarıda kalmıştır."
      B: "I ve III doğrudur; ancak md. 65/12'ye uygun olan IV numaralı ifade de doğru olduğundan seçenek eksiktir."
      C: "II numaralı ifade md. 65/11'e aykırıdır; ayrıca doğru olan I ve III dışarıda kalmıştır."
      E: "II numaralı ifade md. 65/11'e aykırı olduğundan dört ifadenin birlikte doğru olması mümkün değildir."
  kaynaklar:
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 65/1 ve 65/4"
      alinti: "Borsaların ve piyasa işleticilerinin kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı tarafından izin verilir. Bu kuruluşların faaliyete geçmesi Kurulun iznine tabidir. ... Kuruluş izninden itibaren bir yıl içinde Kurula başvuruda bulunmayan veya başvurusunun sonucunda kendilerine faaliyet izni verilmesi uygun görülmeyen kuruluşun kuruluş izni iptal olur. Bu süre, zorunlu şartların varlığı veya başvuruda bulunulmamasının kuruluş izni alan kuruluşa hasredilemeyecek sebeplerin varlığı hâlinde, Kurul tarafından bir yıl uzatılabilir."
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 65/11 ve 65/12"
      alinti: "(11) Borsalara karşı açılacak davalar adli yargıda görülür. Borsaların 22/5/2003 tarihli ve 4857 sayılı İş Kanununa göre çalışan personel ile ihtilaflarında iş mahkemeleri görevlidir. (12) Borsa başkanı ve yönetim kurulu üyeleri ve üst yönetimi hakkında, bu Kanunda yer alan faaliyetleri nedeniyle soruşturma yapılabilmesi Kurulun yazılı iznine bağlıdır."
  gecerlilik:
    baslangic: "2018-07-09"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"
