      A: 9 milyon TL, geçmiş yıllar zararının ikinci kez düşülmesiyle (15 - 6) bulunur; zarar yalnızca bir kez düşülür.
      C: 18 milyon TL, geçmiş yıllar zararı düşülmeden (40 - 4) / 2 işlemiyle bulunur; md. 10/1 zararı da düşer.
      D: 20 milyon TL, hiçbir indirim yapılmadan 40 / 2 işlemiyle bulunur; yedek akçe ve geçmiş yıllar zararı düşülmelidir.
      E: 27,5 milyon TL, yalnızca önceki yıl kârının yarısıdır; cari ara dönem kârından hesaplanan sınır ve diğer kaynaklar
        da uygulanır.
    hesap_adimlari:
    - 'Bu avans için sınır: (40 - 4 - 6) / 2 = 15 milyon TL'
    - 'Dönem toplam sınırı: min(55 / 2; 25) = min(27,5; 25) = 25 milyon TL'
