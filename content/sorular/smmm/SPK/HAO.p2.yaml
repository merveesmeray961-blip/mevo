      tamamlanmış satışlar için genel kurul/ayrılma hakkı anlatımı olay sırası bakımından gerçekçi değildi; 2020-02-20 Tebliğin
      değil 7222 sayılı Kanunun tarihidir. %75 / %50 eşikleri ve %55 hesabı doğru.'
