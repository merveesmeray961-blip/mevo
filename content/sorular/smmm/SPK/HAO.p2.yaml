        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-SPK-HAO-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: önemli nitelikteki işlemler ve ayrılma hakkı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Payları borsada işlem gören (X) A.Ş., Kurumsal Yönetim Tebliği (II-17.1) uyarınca Birinci veya İkinci Grupta
    yer almamaktadır; gayrimenkul yatırım ortaklığı veya girişim sermayesi yatırım ortaklığı sınıfında yer almamaktadır.
    X A.Ş.''nin fiili dolaşımdaki pay oranı %60 olup kamuya açıklanmış son finansal tablolarındaki aktif toplamı
    400 milyon ₺''dir. Şirket, ekonomik bir bütünlük oluşturan bir üretim tesisini aynı alıcıya iki ayrı işlemle
    satmıştır: kayıtlı değeri 120 milyon ₺ olan ilk bölümü 15 Ocak''ta, kayıtlı değeri 100 milyon ₺ olan ikinci
    bölümü aynı yılın 10 Ağustos''unda. Önemlilik ölçütü yalnızca işleme konu mal varlığının kayıtlı değerinin aktif
    toplamına oranı bakımından değerlendirilecek, oranlar aynı finansal tablolara göre hesaplanacaktır. Ayrılma
    hakkının doğmadığı hâllerden (Tebliğ md. 15) hiçbiri gerçekleşmemiştir.


    Sermaye Piyasası Kanunu ile Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği''ne
    (II-23.3) göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: İşlemler ayrı ayrı değerlendirilir; her biri %75'in altında kaldığından önemli nitelikteki işlem sayılmaz.
    B: İşlemler tek işlem sayılır; toplam oran %55 olup uygulanacak %50 oranını aştığından işlem önemli niteliktedir
      ve genel kurulda olumsuz oy verip muhalefetini tutanağa geçiren pay sahipleri ayrılma hakkını kullanabilir.
    C: İşlemler tek işlem sayılır; ancak toplam oran %75'in altında kaldığından işlem önemli nitelikte değildir
      ve ayrılma hakkı doğmaz.
    D: İkinci işlem ilk işlemden sonra yapıldığından ayrı bir işlemdir; yalnızca ikinci işlemin oranı (%25) esas
      alınır ve işlem önemli nitelikte sayılmaz.
    E: İşlemler tek işlem sayılır ve önemli niteliktedir; ancak ayrılma hakkı, muhalefet şerhi aranmaksızın genel
      kurula katılıp katılmadığına bakılmadan tüm pay sahiplerine tanınır.
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğ md. 6/1-(a)''ya göre önemlilik ölçütü, işleme konu mal varlığının kayıtlı değerinin aktif
      toplamına oranının %75''ten fazla olmasıdır; ancak md. 6/6''ya göre Birinci ve İkinci Grup dışında kalan,
      GYO ve girişim sermayesi yatırım ortaklığı olmayan ve fiili dolaşımdaki pay oranı %50''nin üstünde olan ortaklıklarda
      bu oran %50 olarak uygulanır. Md. 6/7''ye göre ekonomik bütünlük oluşturan mal varlığına ilişkin işlemlerin
      ilk işlem tarihinden itibaren on iki aylık dönem içinde birkaç seferde yapılması hâlinde işlemler tek işlem
      sayılır. Tesisin iki bölümü 15 Ocak ile 10 Ağustos arasında, yani on iki ay içinde satıldığından tek işlemdir:
      (120 + 100) / 400 = %55 > %50. İşlem önemli nitelikte olduğundan ayrılma hakkı doğar; genel kurulda olumsuz
      oy verip muhalefetini tutanağa geçiren pay sahipleri paylarını ortaklığa satarak ayrılma hakkını kullanabilir
      (SPKn md. 24/1; Tebliğ md. 11/1). Püf noktaları: Soruda üç ayrı hükmün birlikte okunması gerekir: %75 sınırı
      kural, %50 sınırı fiili dolaşım oranı yüksek ortaklıklar için özel orandır; on iki ay içinde yapılan parçalı
      satışlar toplanır. Her bir bölüm tek başına %50''nin altındadır (%30 ve %25), tuzak bu bölümleri ayrı ayrı
      değerlendirmektir. Fiili dolaşım oranı (%60) ve grup şartı %50 oranının uygulanması için gereklidir.'
    celdiriciler:
      A: İşlemler ayrı ayrı değil, tek işlem olarak değerlendirilir (md. 6/7); ayrıca bu ortaklık için uygulanacak
        oran %75 değil %50'dir (md. 6/6).
      C: Toplam oran %55'tir ve bu ortaklık için uygulanacak %50 oranını aşar (md. 6/6); %75 sınırı bu ortaklık
        için uygulanmaz. İşlem önemli nitelikte olduğundan ayrılma hakkı doğar.
      D: Ekonomik bütünlük oluşturan mal varlığına ilişkin işlemler ilk işlem tarihinden itibaren on iki ay içinde
        birkaç seferde yapılırsa tek işlem sayılır (md. 6/7); ikinci işlem 10 Ağustos'ta yapıldığından bu süre içindedir.
      E: Ayrılma hakkı muhalefet şerhi aranmaksızın ancak katılma veya oy kullanmaya haksız bir biçimde izin verilmemesi,
        çağrının usulüne uygun yapılmaması veya gündemin gereği gibi ilan edilmemesi hâllerinde tanınır (SPKn md.
        24/2); genel kural olumsuz oy ve muhalefet şerhidir.
  kaynaklar:
  - mevzuat: Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/1-(a) ve 6/1 sonu
    alinti: (1) 4 üncü maddenin birinci fıkrasının (c) bendinde belirlenen önemli nitelikteki işlemler için önemlilik
      ölçütü, yönetim kurulu karar tarihi itibarıyla; a) Ortaklığın kamuya açıklanmış son finansal tablolarına göre
      işleme konu mal varlığının kayıtlı değerinin varlık (aktif) toplamına oranının veya, ... %75’ten fazla olması
      durumudur.
  - mevzuat: Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/6
    alinti: (6) Önemli nitelikteki işleme ilişkin yönetim kurulu kararının kamuya açıklandığı tarih itibarıyla Kurumsal
      Yönetim Tebliği (II-17.1) uyarınca Birinci ve İkinci Grupta yer alan ortaklıklar, gayrimenkul yatırım ortaklıkları
      ve girişim sermayesi yatırım ortaklıkları dışındaki payları borsada işlem gören ortaklıklardan, fiili dolaşımdaki
      pay oranı yüzde %50’nin üstünde olanlar için, birinci fıkrada belirtilen oran %50 olarak uygulanır.
  - mevzuat: Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/7
    alinti: (7) Bu Tebliğde belirtilen oranlara ilişkin sınırların altında kalmak amacıyla, ekonomik bir bütünlük
      oluşturan mal varlığına ilişkin işlemlerin ilk işlem tarihinden itibaren on iki aylık bir dönem içinde birkaç
      seferde yapılması durumunda, işlemler tek bir işlem olarak dikkate alınır.
  - mevzuat: Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 11/1
    alinti: MADDE 11 – (1) Bu maddenin ikinci ve üçüncü fıkralarında belirtilen tarihler itibarıyla ortaklıkta pay
      sahibi olan ve genel kurul toplantısına katılarak önemli nitelikteki işleme ilişkin gündem maddesine olumsuz
      oy veren ve bu muhalefeti tutanağa geçirten pay sahipleri, paylarını ortaklığa satarak ayrılma hakkına sahiptir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 24/1
    alinti: (1) 23 üncü maddede belirtilen önemli nitelikteki işlemlere ilişkin genel kurul toplantısına katılıp
      da olumsuz oy veren ve bu muhalefeti tutanağa geçirten pay sahipleri, paylarını halka açık ortaklığa satarak
      ayrılma hakkına sahiptir.
