  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kayıtlı sermaye
  tip: hesaplama
  zorluk: 3
  kok: Kayıtlı sermaye tavanı belirlenmek üzere Kurula başvuran halka açık S Anonim Ortaklığı'nın başvuru tarihine en yakın
    bağımsız denetimden geçmiş finansal tablolarında ödenmiş sermayesi 40 milyon TL, özsermayesi 70 milyon TL'dir. Finansal
    tabloların dönem sonu tarihinden sonra S, iç kaynaklarından yaptığı sermaye artırımıyla ödenmiş sermayesini 100 milyon
    TL'ye çıkarmıştır. Kayıtlı Sermaye Sistemi Tebliği (II-18.1) md. 5'e göre tavan en çok kaç TL olabilir?
  secenekler:
    A: 70 milyon TL
    B: 200 milyon TL
    C: 350 milyon TL
    D: 500 milyon TL
    E: 1.050 milyon TL
  dogru: D
  aciklama:
    dogru_neden: 'II-18.1 md. 5/4 uyarınca tavan, ödenmiş/çıkarılmış sermaye veya özsermayeden yüksek olanının beş katını
      aşamaz. Md. 5/5 uyarınca finansal tablo dönem sonundan sonra sermaye artırılmış ve artırım sonrası sermaye tablolardaki
      özsermayeden yüksek olmuşsa tavan hesabında ortaklığın güncel ödenmiş sermayesi esas alınır. Güncel sermaye (100 milyon
      TL) özsermayeden (70 milyon TL) yüksek olduğundan tavan 5 x 100 = 500 milyon TL''dir. Püf noktaları: Tablodaki 40 milyon
      TL eski bir veridir ve tavan hesabına girmez; ''yüksek olan'' karşılaştırması güncel sermaye ile özsermaye arasında
      yapılır. Toplama işlemi yapılmaz, yalnızca yüksek tutar beşle çarpılır.'
    celdiriciler:
      A: 70 milyon TL özsermayenin kendisidir ve tavan değildir; ayrıca güncel sermaye özsermayeden yüksektir.
      B: 200 milyon TL, tablodaki eski sermayenin (40 milyon TL) beş katıdır; md. 5/5 güncel sermayeyi esas alır.
      C: 350 milyon TL, özsermayenin (70 milyon TL) beş katıdır; güncel sermaye daha yüksek olduğundan md. 5/5 uyarınca bu
        esas alınmaz.
      E: 1.050 milyon TL, üç tutarın (40 + 70 + 100) toplamının beş katıdır; kanun toplamı değil yüksek olanı esas alır.
    hesap_adimlari:
    - 'Artırım sonrası güncel sermaye: 100 milyon TL'
    - 'Özsermaye: 70 milyon TL; güncel sermaye daha yüksek olduğundan esas alınır'
    - 'Tavan: 100 x 5 = 500 milyon TL'
