  kok: Payları borsada işlem gören halka açık P3 Anonim Ortaklığı'nın sermayesi 40 milyon TL'dir. P3, payları borsada işlem
    görmeyen R3 Anonim Şirketi'ni devralma şeklinde birleştirmek ve bu birleşme için 45 milyon TL sermaye artırımı yapmak
    istemektedir. Birleşmeye yalnızca bu iki şirket katılmaktadır. Birleşme ve Bölünme Tebliği (II-23.2) md. 12/4'e göre aşağıdakilerden
    hangisi doğrudur?
