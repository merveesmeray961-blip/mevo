    A: Artırım P3'ün sermayesini aştığı hâlde birleşme sınırsızca yapılabilir.
    B: Birleşme yapılabilir; yalnızca R3 ortaklarına verilecek paylar için ayrıca uzman kuruluş görüşü alınması yeterlidir.
    C: Birleşme, sermaye artışının %50'yi aşmaması koşuluyla yapılabilir; artış %112,5 olduğundan Kurul izniyle yapılır.
    D: Sermaye artışı P3'ün sermayesinin %100'ünden fazla olacağından bu birleşme işlemi yapılamaz.
    E: Birleşme yapılabilir; ancak P3 sermaye artışını iki aşamada yapmak zorundadır.
  dogru: D
  aciklama:
    dogru_neden: 'II-23.2 md. 12/4 (a) uyarınca birleşmeye taraf şirket sayısı iki olan, payları borsada işlem gören halka
      açık ortaklık ile payları borsada işlem görmeyen bir şirket arasında devralma şeklinde birleşme, borsada işlem gören
      ortaklığın sermayesinin %100''den fazla artması ile sonuçlanacak şekilde yapılamaz. 45 / 40 = %112,5 > %100''dür. Püf
      noktaları: İki şirketli birleşme ve devralan tarafın borsada işlem görmesi şartlarını doğrulayın; yüzde, artışın mevcut
      sermayeye oranıdır.'
    celdiriciler:
      A: Md. 12/4 (a) sermaye artışı bakımından %100 üst sınırı koyar; sınırsız birleşme yoktur.
      B: Uzman kuruluş görüşü alınması md. 12/4'teki yasağı ortadan kaldırmaz.
      C: Md. 12/4 (a)'daki eşik %50 değil %100'dür ve Kurul izniyle aşılamaz.
      E: İki aşamada yapılan artış da toplam sonucu değiştirmez; md. 12/4 sonucu esas alır.
