  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: özel durumlar
  tip: kavrama
  zorluk: 2
  kok: 'Özel Durumlar Tebliği (II-15.1) md. 6''ya göre içsel bilgilerin kamuya açıklanmasının ertelenmesine ilişkin aşağıdaki
    ifadelerden hangileri doğrudur?


    I. İhraççı, içsel bilginin açıklanmasını ertelemek için önceden Kuruldan izin almak zorundadır.


    II. Ertelemenin ihraççının meşru çıkarlarının korunmasına etkisi, yatırımcıların yanıltılması riskini oluşturmaması ve
    gizliliğin korunması için alınan tedbirler yönetim kurulu kararına bağlanır.


    III. Erteleme sebepleri ortadan kalkar kalkmaz bilgi kamuya açıklanır ve açıklamada erteleme kararı ile bunun temelindeki
    sebepler belirtilir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: II doğrudur; md. 6/4 ertelemenin etkisine ve gizliliği korumak için alınan tedbirlere ilişkin değerlendirmenin
      yönetim kurulu kararına (veya yetki verilen kişinin yazılı onayına) bağlanmasını ister. III doğrudur; md. 6/2 uyarınca
      sebepler ortadan kalkar kalkmaz bilgi açıklanır ve açıklamada erteleme kararı ve sebepleri belirtilir. I yanlıştır;
      md. 6/1 ertelemeyi sorumluluğu ihraççıya ait olmak üzere ihraççıya bırakır, Kurul izni aramaz; Kurul ancak sonradan
      erteleme sebeplerinin yerinde olup olmadığını inceleyebilir.
    celdiriciler:
      A: I yanlıştır; md. 6/1 erteleme için Kurul izni aramaz, sorumluluğu ihraççıya bırakır.
      B: I yanlış olduğundan bu şık doğru değildir; II ise doğrudur.
      C: I yanlıştır ve II doğrudur; bu şık yanlış önermeyi içerip doğru olan II'yi dışarıda bırakır.
      E: I yanlış olduğundan üç ifadenin tümü doğru değildir.
  kaynaklar:
  - mevzuat: Özel Durumlar Tebliği (II-15.1)
    madde: md. 6/1
    alinti: İhraççı; sorumluluğu kendisine ait olmak üzere, meşru çıkarlarının zarar görmemesi için içsel bilgilerin kamuya
      açıklanmasını, yatırımcıların yanıltılmasına yol açmaması ve bu bilgilerin gizli tutulmasını sağlayabilecek olması kaydıyla
      erteleyebilir.
  - mevzuat: Özel Durumlar Tebliği (II-15.1)
    madde: md. 6/2
    alinti: İçsel bilgilerin kamuya açıklanmasının ertelenme sebepleri ortadan kalkar kalkmaz, ihraççılar söz konusu içsel
      bilgileri bu Tebliğde yazılı olan esaslara uygun şekilde kamuya açıklar. Yapılacak açıklamada erteleme kararı ve bunun
      temelindeki sebepler belirtilir.
  - mevzuat: Özel Durumlar Tebliği (II-15.1)
    madde: md. 6/4
    alinti: Ertelemenin ihraççının meşru çıkarlarının korunmasına olan etkisi, yatırımcıların yanıltılması riskini oluşturmadığı
