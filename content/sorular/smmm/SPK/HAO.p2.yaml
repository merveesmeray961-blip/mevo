- id: SMMM-SPK-HAO-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: ilişkili taraf işlemleri — örtülü kazanç aktarımı
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''nun örtülü kazanç aktarımı yasağına ilişkin hükümlerine göre aşağıdaki
    ifadelerden hangileri doğrudur?


    I. Halka açık ortaklıklar ve kolektif yatırım kuruluşları, ilişkili taraf işlemlerinin emsallerine, piyasa teamüllerine,
    ticari hayatın basiret ve dürüstlük ilkelerine uygun şartlarda gerçekleştirilmiş olduğunu belgelemek ve bu durumu
    tevsik edici bilgi ve belgeleri en az beş yıl süre ile saklamak zorundadır.


    II. Kazanç aktarımının Kurulca tespiti hâlinde, kendilerine kazanç aktarımı yapılan taraflar, Kurulca belirlenecek
    süre içinde aktarılan tutarı kanuni faizi ile birlikte iade etmek zorundadır.


    III. Halka açık bir ortaklığın, kârlarını veya malvarlıklarını korumak ya da artırmak için yapması beklenen
    faaliyetleri yapmaması yoluyla ilişkili olduğu kişilerin kârlarının veya malvarlıklarının artmasını sağlaması
    da örtülü kazanç aktarımı sayılır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade yanlıştır: md. 21/3''e göre ilişkili taraf işlemlerine ilişkin bilgi ve belgeler
      en az sekiz yıl süre ile saklanır; beş yıl değildir. II numaralı ifade md. 21/4''e, III numaralı ifade md.
      21/2''ye uygundur. Doğru ifadeler II ve III''tür.'
    celdiriciler:
      A: I numaralı ifade saklama süresini yanlış verir (sekiz yıl yerine beş yıl); doğru olan II ve III numaralı
        ifadeler de bu şıkta yer almamıştır.
      B: II numaralı ifade doğrudur; ancak III numaralı ifade de md. 21/2'ye uygundur, dolayısıyla yalnız II eksik
        bir cevaptır.
      C: I numaralı ifade saklama süresi bakımından md. 21/3'e aykırıdır (süre en az sekiz yıldır); II numaralı
        ifade ise doğru olduğu hâlde bu şıkta yer almamıştır.
      D: I numaralı ifade md. 21/3'e aykırıdır (süre en az sekiz yıldır); II numaralı ifade doğru olduğu hâlde bu
        şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/2
    alinti: (2) Halka açık ortaklıklar ve kolektif yatırım kuruluşları ile bunların iştirak ve bağlı ortaklıklarının,
      esas sözleşmeleri veya iç tüzükleri çerçevesinde basiretli ve dürüst bir tacir olarak veya piyasa teamülleri
      uyarınca kârlarını ya da malvarlıklarını korumak veya artırmak için yapmaları beklenen faaliyetleri yapmamaları
      yoluyla ilişkili oldukları gerçek veya tüzel kişilerin kârlarının ya da malvarlıklarının artmasını sağlamaları
      da örtülü kazanç aktarımı sayılır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/3
    alinti: (3) Halka açık ortaklıklar ve kolektif yatırım kuruluşları, ilişkili taraf işlemlerinin emsallerine,
      piyasa teamüllerine, ticari hayatın basiret ve dürüstlük ilkelerine uygun şartlarda gerçekleştirilmiş olduğunu
      belgelemek ve bu durumu tevsik edici bilgi ve belgeleri en az sekiz yıl süre ile saklamak zorundadırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/4
    alinti: (4) Kazanç aktarımının Kurulca tespiti hâlinde halka açık ortaklıklar, kolektif yatırım kuruluşları
      ile bunların iştirak ve bağlı ortaklıkları, Kurulca belirlenecek süre içinde kendilerine kazanç aktarımı yapılan
      taraflardan, aktarılan tutarın kanuni faizi ile birlikte mal varlığı veya kârı azaltılan ortaklığa veya kolektif
      yatırım kuruluşuna iadesini talep eder. Kendilerine kazanç aktarımı yapılan taraflar Kurulca belirlenecek
      süre içinde aktarılan tutarı kanuni faizi ile birlikte iade etmek zorundadır.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
