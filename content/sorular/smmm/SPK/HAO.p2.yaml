  kok: Konsolide finansal tablolarında aktif toplamı 800 milyon TL olan halka açık C Anonim Ortaklığı, ekonomik bir bütünlük
    oluşturan mal varlığını, ilk işlem tarihinden itibaren 10 ay içinde üç ayrı işlemle devretmiştir. Devredilen varlıkların
    kayıtlı değerleri sırasıyla 250 milyon TL, 200 milyon TL ve 160 milyon TL'dir. Yönetim Kurulu karar tarihinde C'nin fiili
    dolaşımdaki pay oranı %50'nin altındadır. II-23.3'e göre bu işlemlerin değerlendirilmesinde aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: İşlemlerin hiçbiri tek başına %75'i aşmadığından önemli nitelikteki işlem yoktur.
    B: İşlemler tek işlem sayılır; oran %76,25 olup %75'i aştığından önemli nitelikteki işlem söz konusudur.
    C: İşlemler tek işlem sayılır; oran %60 olup %75'in altında kaldığından önemli nitelikteki işlem yoktur.
    D: Yalnızca ilk işlem değerlendirmeye alınır; oran %31,25 olduğundan önemli nitelikteki işlem yoktur.
    E: İşlemler 12 aylık dönem içinde yapıldığından ayrı ayrı değerlendirilir; yalnızca birinci ve ikinci işlem önemli sayılır.
  dogru: B
  aciklama:
    dogru_neden: 'II-23.3 md. 6/7 uyarınca oranlara ilişkin sınırların altında kalmak amacıyla ekonomik bir bütünlük oluşturan
      mal varlığına ilişkin işlemlerin ilk işlem tarihinden itibaren on iki aylık dönem içinde birkaç seferde yapılması hâlinde
      işlemler tek işlem sayılır. Toplam kayıtlı değer 250 + 200 + 160 = 610 milyon TL olup aktif toplamına oranı 610 / 800
      = %76,25''tir. Md. 6/1 (a) uyarınca ölçüt %75''ten fazla olmasıdır. Püf noktaları: Tek tek bakınca hiçbir işlem eşiğe
      yaklaşmaz; parçalama yoluyla eşiğin altında kalma girişimi on iki aylık toplulaştırma kuralıyla engellenir. Eşik ''en
      az'' değil ''fazla''dır; %76,25 bunu aşar.'
    celdiriciler:
      A: Md. 6/7 on iki ay içindeki parçalı işlemleri tek işlem sayar; tek tek değerlendirme yapılmaz.
      C: Oran 610 / 800 = %76,25'tir; %60 yanlış hesaplanmış bir orandır ve gerçek oran %75 eşiğinin üzerindedir.
      D: Md. 6/7 uyarınca işlemler birleştirilir; yalnızca ilk işlemin esas alınması yanlıştır.
      E: Md. 6/7 on iki ay içindeki işlemlerin ayrı ayrı değil tek işlem olarak dikkate alınmasını öngörür.
    hesap_adimlari:
    - 'Toplam kayıtlı değer: 250 + 200 + 160 = 610 milyon TL'
    - 'Oran: 610 / 800 = %76,25'
    - 'Ölçüt: %75''ten fazla; 76,25 > 75 olduğundan önemli nitelikteki işlem'
  kaynaklar:
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/1-a
    alinti: Ortaklığın kamuya açıklanmış son finansal tablolarına göre işleme konu mal varlığının kayıtlı değerinin varlık
      (aktif) toplamına oranının
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/1-c
    alinti: Ortaklığın kamuya açıklanmış son yıllık finansal tablolarına göre önemli nitelikteki işleme konu mal varlığından
      elde edilen gelirin, sürdürülen faaliyetler dönem net karı/zararına etki eden tüm gelir kalemlerinin toplamına oranının,
      %75’ten fazla olması durumudur.
