      B: '%5 ve değerleme kuralı md. 9''daki ilişkili taraf işlemleri içindir; yaygın ve süreklilik arz eden işlemlerde md.
        10''daki %10 ölçütü ve rapor kuralı uygulanır.'
      C: Bağımsız üye onayı md. 9/3'te %10'dan fazla orana ulaşılan olağan ilişkili taraf işlemleri içindir; ayrıca toplam
        oran esas alınmaz.
