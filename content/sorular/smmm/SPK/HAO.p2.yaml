    B: P, genel kurula katılmamış olsa bile payı üzerinde intifa hakkı bulunduğundan ayrılma hakkını kullanabilir; bedel intifa
      hakkı sahibine ödenir.
    C: Hem P hem İ, ayrılma hakkını birlikte kullanabilir; pay bedeli aralarında paylaştırılır.
    D: Ayrılma hakkı yalnızca pay üzerindeki intifa hakkının sona ermesinden sonra doğar.
    E: İ kullanamaz; P'nin kullanabilmesi için kendisinin veya temsilcisinin genel kurulda olumsuz oy verip şerh düşmesi gerekir.
  dogru: E
  aciklama:
    dogru_neden: 'II-23.3 md. 11/6 uyarınca pay üzerinde intifa hakkı bulunduğu ve oy hakkının intifa hakkı sahiplerince kullanıldığı
      hâllerde intifa hakkı sahibi ayrılma hakkını kullanamaz. Bu durumda pay sahibi veya temsilcisi, ayrılma hakkını kullanmak
      için genel kurul toplantılarına katılıp ilgili işleme karşı olumsuz oy kullanmak ve muhalefet şerhini toplantı tutanağına
      işletmek zorundadır. Püf noktaları: Şartı yerine getiren kişi (İ) ile hakkın sahibi (P) farklıdır; olumsuz oy ve şerh,
      hakkı kullanacak pay sahibinin kendisi veya temsilcisi tarafından yerine getirilmelidir. Aksi iki istisna (haksız alınmama,
