    dogru_neden: I doğrudur; SPKn md. 24/1 olumsuz oy veren ve muhalefetini tutanağa geçirten pay sahiplerine ayrılma hakkı
      tanır. III doğrudur; md. 24/2 uyarınca toplantıya katılmasına haksız biçimde izin verilmemesi hâlinde muhalif kalma
      ve şerh düşme şartı aranmaz. II yanlıştır; çekimser oy olumsuz oy sayılmaz ve ayrılma hakkı doğurmaz.
    celdiriciler:
      A: III de doğrudur; md. 24/2 haksız biçimde toplantıya alınmayan pay sahibi için muhalefet şartını kaldırır.
      B: II yanlıştır; kanun yalnız olumsuz oy veren ve muhalefetini tutanağa geçirten pay sahibine hak tanır.
      C: I de doğrudur ve II yanlıştır; bu şık doğru önermeyi dışarıda bırakıp yanlış önermeyi içerir.
      E: II yanlış olduğundan üç önermenin tümü doğru değildir; çekimser oy ayrılma hakkı doğurmaz.
