  konu: HAO
  kazanim: özel durumlar
  tip: kavrama
  zorluk: 3
  kok: 'Özel Durumlar Tebliği (II-15.1) md. 7''ye göre içsel bilgilere erişimi olan kişiler listesine ilişkin aşağıdaki ifadelerden
    hangileri doğrudur?


    I. İhraççıya bağlı çalışan ve içsel bilgilere düzenli erişimi olan kişilerin bilgilerinde değişiklik olduğunda güncelleme
    en geç iki iş günü içinde yapılır.


    II. Liste, ihraççının kendi nezdinde saklanır; MKK yalnızca ihraççıdan gelen bildirimleri alır ve Kurula iletmez.


    III. İdari sorumluluğu bulunan kişiler, Tebliğ hükümleri çerçevesinde aynı zamanda içsel bilgilere erişimi olan kişiler
    kabul edilir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'I doğrudur; md. 7/1 değişiklik olduğunda en geç iki iş günü içinde güncelleme yapılmasını öngörür. III doğrudur;
      md. 7/2 idari sorumluluğu bulunan kişileri aynı zamanda içsel bilgilere erişimi olan kişiler kabul eder. II yanlıştır;
      md. 7/1 uyarınca listeyi MKK saklar ve talep üzerine Kurula ve ilgili borsaya gönderir. Püf noktaları: Listenin saklayıcısı
      (MKK) ile bildirim yükümlüsü (ihraççı) rollerini karıştırmayın; süre iki iş günüdür.'
    celdiriciler:
