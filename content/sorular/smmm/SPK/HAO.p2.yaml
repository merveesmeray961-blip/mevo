  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kâr payı ve avans
  tip: hesaplama
  zorluk: 2
  kok: Esas sözleşmesinde yönetim kurulu üyelerine kârdan pay verilmesine ilişkin hüküm bulunan, ancak bu pay için oran belirlenmemiş
    olan halka açık N Anonim Ortaklığı'nda genel kurul, pay sahiplerine 8.000.000 TL kâr payı dağıtılmasına karar vermiştir.
    İmtiyazdan kaynaklanan bir pay bulunmadığına göre Kâr Payı Tebliği (II-19.1) md. 5/4'e göre yönetim kurulu üyelerine dağıtılabilecek
    kâr payı en çok kaç TL'dir?
  secenekler:
    A: 800.000 TL
    B: 1.600.000 TL
    C: 2.000.000 TL
    D: 4.000.000 TL
    E: 10.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: II-19.1 md. 5/4 uyarınca esas sözleşmede söz konusu kişilere kâr payı dağıtılması hususunda hüküm bulunmasına
      rağmen oran belirlenmemişse bu kişilere dağıtılacak kâr payı, imtiyazdan kaynaklananlar hariç her durumda pay sahiplerine
      dağıtılan kâr payının dörtte birini aşamaz. 8.000.000 / 4 = 2.000.000 TL.
    celdiriciler:
      A: 800.000 TL, pay sahiplerine dağıtılan tutarın onda biridir; kanundaki oran dörtte birdir.
