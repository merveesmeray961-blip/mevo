- id: SMMM-SPK-HAO-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: ilişkili taraf işlemleri — örtülü kazanç aktarımı
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''nun örtülü kazanç aktarımı yasağına ilişkin hükümlerine göre aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Halka açık ortaklıklar ve kolektif yatırım kuruluşları, ilişkili taraf işlemlerinin emsallerine, piyasa teamüllerine,
    ticari hayatın basiret ve dürüstlük ilkelerine uygun şartlarda gerçekleştirilmiş olduğunu belgelemek ve bu durumu tevsik
    edici bilgi ve belgeleri en az beş yıl süre ile saklamak zorundadır.


    II. Kazanç aktarımının Kurulca tespiti hâlinde, kendilerine kazanç aktarımı yapılan taraflar, Kurulca belirlenecek süre
    içinde aktarılan tutarı kanuni faizi ile birlikte iade etmek zorundadır.


    III. Halka açık bir ortaklığın, kârlarını veya malvarlıklarını korumak ya da artırmak için yapması beklenen faaliyetleri
    yapmaması yoluyla ilişkili olduğu kişilerin kârlarının veya malvarlıklarının artmasını sağlaması da örtülü kazanç aktarımı
    sayılır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade yanlıştır: md. 21/3''e göre ilişkili taraf işlemlerine ilişkin bilgi ve belgeler en az
      sekiz yıl süre ile saklanır; beş yıl değildir. II numaralı ifade md. 21/4''e, III numaralı ifade md. 21/2''ye uygundur.
      Doğru ifadeler II ve III''tür.'
    celdiriciler:
      A: I numaralı ifade saklama süresini yanlış verir (sekiz yıl yerine beş yıl); doğru olan II ve III numaralı ifadeler
        de bu şıkta yer almamıştır.
      B: II numaralı ifade doğrudur; ancak III numaralı ifade de md. 21/2'ye uygundur, dolayısıyla yalnız II eksik bir cevaptır.
      C: I numaralı ifade saklama süresi bakımından md. 21/3'e aykırıdır (süre en az sekiz yıldır); III numaralı ifade ise
        doğru olduğu hâlde bu şıkta yer almamıştır.
      D: I numaralı ifade md. 21/3'e aykırıdır (süre en az sekiz yıldır); II numaralı ifade doğru olduğu hâlde bu şıkta yer
        almamıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/2
    alinti: (2) Halka açık ortaklıklar ve kolektif yatırım kuruluşları ile bunların iştirak ve bağlı ortaklıklarının, esas
      sözleşmeleri veya iç tüzükleri çerçevesinde basiretli ve dürüst bir tacir olarak veya piyasa teamülleri uyarınca kârlarını
      ya da malvarlıklarını korumak veya artırmak için yapmaları beklenen faaliyetleri yapmamaları yoluyla ilişkili oldukları
      gerçek veya tüzel kişilerin kârlarının ya da malvarlıklarının artmasını sağlamaları da örtülü kazanç aktarımı sayılır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/3
    alinti: (3) Halka açık ortaklıklar ve kolektif yatırım kuruluşları, ilişkili taraf işlemlerinin emsallerine, piyasa teamüllerine,
      ticari hayatın basiret ve dürüstlük ilkelerine uygun şartlarda gerçekleştirilmiş olduğunu belgelemek ve bu durumu tevsik
      edici bilgi ve belgeleri en az sekiz yıl süre ile saklamak zorundadırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 21/4
    alinti: (4) Kazanç aktarımının Kurulca tespiti hâlinde halka açık ortaklıklar, kolektif yatırım kuruluşları ile bunların
      iştirak ve bağlı ortaklıkları, Kurulca belirlenecek süre içinde kendilerine kazanç aktarımı yapılan taraflardan, aktarılan
      tutarın kanuni faizi ile birlikte mal varlığı veya kârı azaltılan ortaklığa veya kolektif yatırım kuruluşuna iadesini
      talep eder. Kendilerine kazanç aktarımı yapılan taraflar Kurulca belirlenecek süre içinde aktarılan tutarı kanuni faizi
      ile birlikte iade etmek zorundadır.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: C çeldiricisinde ''II numaralı ifade ... bu şıkta yer almamıştır'' → ''III numaralı ifade ...''.'
    neden: 'G5: C şıkkı ''I ve II''dir; şıkta eksik olan doğru ifade II değil III''tür.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): E (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: anahtar E doğru (md. 21/3 sekiz yıl); C çeldirici açıklamasındaki yanlış öncül numarası
          düzeltildi.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: SPKn md. 21/2-4 alıntıları birebir.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (E, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
- id: SMMM-SPK-HAO-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: önemli nitelikteki işlemler ve ayrılma hakkı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Payları borsada işlem gören (X) A.Ş., Kurumsal Yönetim Tebliği (II-17.1) uyarınca Birinci veya İkinci Grupta yer almamaktadır;
    gayrimenkul yatırım ortaklığı veya girişim sermayesi yatırım ortaklığı sınıfında yer almamaktadır. X A.Ş.''nin fiili dolaşımdaki
    pay oranı %60 olup kamuya açıklanmış son finansal tablolarındaki aktif toplamı 400 milyon ₺''dır. Şirket, ekonomik bir
    bütünlük oluşturan bir üretim tesisini, Tebliğde belirtilen oran sınırlarının altında kalmak amacıyla iki ayrı işleme
    bölerek aynı alıcıya satmayı planlamaktadır: kayıtlı değeri 120 milyon ₺ olan ilk bölüm 15 Ocak''ta, kayıtlı değeri 100
    milyon ₺ olan ikinci bölüm aynı yılın 10 Ağustos''unda devredilecektir. Önemlilik ölçütü yalnızca işleme konu mal varlığının
    kayıtlı değerinin aktif toplamına oranı bakımından değerlendirilecek, oranlar aynı finansal tablolara göre hesaplanacaktır.
    Ayrılma hakkının doğmadığı hâllerden (Tebliğ md. 15) hiçbiri gerçekleşmemiştir.


    Sermaye Piyasası Kanunu ile Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği''ne (II-23.3) göre aşağıdakilerden hangisi
    doğrudur?'
  secenekler:
    A: İşlemler ayrı ayrı değerlendirilir; her biri %75'in altında kaldığından önemli nitelikteki işlem sayılmaz.
    B: Tek işlem sayılır; toplam %55 oranı %50'yi aştığından önemlidir ve olumsuz oy verip muhalefet şerhi koyanlar ayrılabilir.
    C: İşlemler tek işlem sayılır; ancak toplam oran %75'in altında kaldığından işlem önemli nitelikte değildir ve ayrılma
      hakkı doğmaz.
    D: İkinci işlem ilk işlemden sonra yapılacağından ayrı bir işlemdir; ikinci işlemin oranı (%25) esas alınır ve işlem önemli
      sayılmaz.
    E: Tek işlem sayılır ve önemlidir; ancak ayrılma hakkı muhalefet şerhi aranmaksızın tüm pay sahiplerine tanınır.
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğ md. 6/1-(a)''ya göre önemlilik ölçütü, işleme konu mal varlığının kayıtlı değerinin aktif toplamına
      oranının %75''ten fazla olmasıdır; ancak md. 6/6''ya göre Birinci ve İkinci Grup dışında kalan, GYO ve girişim sermayesi
      yatırım ortaklığı olmayan ve fiili dolaşımdaki pay oranı %50''nin üstünde olan ortaklıklarda payları borsada işlem gören
      ortaklıklarda bu oran %50 olarak uygulanır. Md. 6/7''ye göre Tebliğdeki oran sınırlarının altında kalmak amacıyla ekonomik
      bütünlük oluşturan mal varlığına ilişkin işlemlerin ilk işlem tarihinden itibaren on iki aylık dönem içinde birkaç seferde
      yapılması hâlinde işlemler tek işlem sayılır. Tesisin iki bölümü bu amaçla 15 Ocak ile 10 Ağustos arasında, yani on
      iki ay içinde satılacağından tek işlemdir: (120 + 100) / 400 = %55 > %50. İşlem önemli nitelikte olduğundan ayrılma
      hakkı doğar; genel kurulda olumsuz oy verip muhalefetini tutanağa geçiren pay sahipleri paylarını ortaklığa satarak
      ayrılma hakkını kullanabilir (SPKn md. 24/1; Tebliğ md. 11/1). Püf noktaları: Soruda üç ayrı hükmün birlikte okunması
      gerekir: %75 sınırı kural, %50 sınırı fiili dolaşım oranı yüksek ortaklıklar için özel orandır; sınırların altında kalmak
      amacıyla on iki ay içinde yapılan parçalı satışlar toplanır. Her bir bölüm tek başına %50''nin altındadır (%30 ve %25),
      tuzak bu bölümleri ayrı ayrı değerlendirmektir. Fiili dolaşım oranı (%60) ve grup şartı %50 oranının uygulanması için
      gereklidir.'
    celdiriciler:
      A: İşlemler ayrı ayrı değil, tek işlem olarak değerlendirilir (md. 6/7); ayrıca bu ortaklık için uygulanacak oran %75
        değil %50'dir (md. 6/6).
      C: Toplam oran %55'tir ve bu ortaklık için uygulanacak %50 oranını aşar (md. 6/6); %75 sınırı bu ortaklık için uygulanmaz.
        İşlem önemli nitelikte olduğundan ayrılma hakkı doğar.
      D: Oran sınırlarının altında kalmak amacıyla ekonomik bütünlük oluşturan mal varlığına ilişkin işlemler ilk işlem tarihinden
        itibaren on iki ay içinde birkaç seferde yapılırsa tek işlem sayılır (md. 6/7); ikinci işlem 10 Ağustos'ta yapılacağından
        bu süre içindedir.
      E: Ayrılma hakkı muhalefet şerhi aranmaksızın ancak katılma veya oy kullanmaya haksız bir biçimde izin verilmemesi,
        çağrının usulüne uygun yapılmaması veya gündemin gereği gibi ilan edilmemesi hâllerinde tanınır (SPKn md. 24/2); genel
        kural olumsuz oy ve muhalefet şerhidir.
  kaynaklar:
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/1-(a) ve 6/1 sonu
    alinti: (1) 4 üncü maddenin birinci fıkrasının (c) bendinde belirlenen önemli nitelikteki işlemler için önemlilik ölçütü,
      yönetim kurulu karar tarihi itibarıyla; a) Ortaklığın kamuya açıklanmış son finansal tablolarına göre işleme konu mal
      varlığının kayıtlı değerinin varlık (aktif) toplamına oranının veya, ... %75’ten fazla olması durumudur.
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/6
    alinti: (6) Önemli nitelikteki işleme ilişkin yönetim kurulu kararının kamuya açıklandığı tarih itibarıyla Kurumsal Yönetim
      Tebliği (II-17.1) uyarınca Birinci ve İkinci Grupta yer alan ortaklıklar, gayrimenkul yatırım ortaklıkları ve girişim
      sermayesi yatırım ortaklıkları dışındaki payları borsada işlem gören ortaklıklardan, fiili dolaşımdaki pay oranı yüzde
      %50’nin üstünde olanlar için, birinci fıkrada belirtilen oran %50 olarak uygulanır.
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 6/7
    alinti: (7) Bu Tebliğde belirtilen oranlara ilişkin sınırların altında kalmak amacıyla, ekonomik bir bütünlük oluşturan
      mal varlığına ilişkin işlemlerin ilk işlem tarihinden itibaren on iki aylık bir dönem içinde birkaç seferde yapılması
      durumunda, işlemler tek bir işlem olarak dikkate alınır.
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 11/1
    alinti: MADDE 11 – (1) Bu maddenin ikinci ve üçüncü fıkralarında belirtilen tarihler itibarıyla ortaklıkta pay sahibi
      olan ve genel kurul toplantısına katılarak önemli nitelikteki işleme ilişkin gündem maddesine olumsuz oy veren ve bu
      muhalefeti tutanağa geçirten pay sahipleri, paylarını ortaklığa satarak ayrılma hakkına sahiptir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 24/1
    alinti: (1) 23 üncü maddede belirtilen önemli nitelikteki işlemlere ilişkin genel kurul toplantısına katılıp da olumsuz
      oy veren ve bu muhalefeti tutanağa geçirten pay sahipleri, paylarını halka açık ortaklığa satarak ayrılma hakkına sahiptir.
  gecerlilik:
    baslangic: '2020-06-27'
    bitis: null
    yila_bagli_tutar: false
