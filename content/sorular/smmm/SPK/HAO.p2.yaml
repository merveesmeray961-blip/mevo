    dogru_neden: I doğrudur; II-17.1 md. 9/3 uyarınca işlemin görüşüleceği toplantılarda ilişkili taraf niteliğindeki yönetim
      kurulu üyeleri oy kullanamaz. III doğrudur; SPKn md. 17/3 uyarınca bu esaslara uygun alınmayan yönetim kurulu ve genel
      kurul kararları geçerli sayılmaz. II yanlıştır; bağımsız üyelerin çoğunluğunun işlemi onaylamaması hâlinde işlem Kurul
      onayına değil, genel kurul onayına sunulur.
    celdiriciler:
      A: III de doğrudur; esaslara uygun alınmayan kararlar geçerli sayılmaz (md. 17/3).
      B: II yanlıştır; işlem Kurul onayına değil genel kurul onayına sunulur.
      D: I de doğrudur ve II yanlıştır; bu şık doğru olan I'i dışarıda bırakır.
      E: II yanlış olduğundan üç ifadenin tümü doğru değildir.
