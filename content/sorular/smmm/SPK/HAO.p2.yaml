  kok: Halka açık Ö Anonim Ortaklığı'nın son yıllık finansal tablolarındaki hasılatı 400 milyon TL'dir. Ö, ilişkili tarafı
    olan Y şirketiyle yaygın ve süreklilik arz eden işlemler yapmakta olup bir hesap döneminde Y'ye 30 milyon TL tutarında
    ürün satışı ve 22 milyon TL tutarında hizmet satışı yapılacağı öngörülmektedir. Kurumsal Yönetim Tebliği (II-17.1) md.
    10'a göre Ö bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Toplam satış tutarı hasılatın %13'üne ulaştığından işlemlere ilişkin rapor hazırlanması zorunludur.
    B: Her işlem, hasılatın %5'ini aştığından işlem öncesinde değerleme yaptırılması zorunludur.
    C: Toplam oran %10'u aştığından işlemler bağımsız üyelerin çoğunluğunun onayına bağlıdır.
    D: Ürün ve hizmet satışları aynı nitelikte kabul edilerek toplam oran esas alınır; bu durumda işlem genel kurulun onayına
      sunulmalıdır.
    E: Farklı nitelikteki işlemler ayrı değerlendirilir; oranlar %7,5 ve %5,5 olup %10'u aşmadığından rapor zorunluluğu doğmaz.
  dogru: E
  aciklama:
    dogru_neden: 'II-17.1 md. 10/2 uyarınca yaygın ve süreklilik arz eden satış işlemlerinin bir hesap dönemindeki tutarının
      son yıllık hasılata oranının %10''dan fazla olacağının öngörülmesi hâlinde yönetim kurulu raporu hazırlanır. Aynı fıkra,
      aynı nitelikteki işlemlerin toplu, farklı nitelikteki işlemlerin ise ayrı ayrı değerlendirilmesini ister. Ürün satışı
      30 / 400 = %7,5, hizmet satışı 22 / 400 = %5,5''tir; hiçbiri %10''u aşmadığından rapor zorunluluğu doğmaz. Püf noktaları:
      Toplam (%13) hesabı yanıltıcıdır; farklı nitelikteki işlemler toplanmaz. %5 ve %10 eşikleri md. 9''daki olağan ilişkili
