    alinti: Bağımsız yönetim kurulu üyelerinin çoğunluğunun söz konusu işlemi onaylamaması hâlinde, bu durum işleme ilişkin
      yeterli bilgiyi içerecek şekilde kamuyu aydınlatma düzenlemeleri çerçevesinde kamuya duyurulur ve işlem genel kurul
