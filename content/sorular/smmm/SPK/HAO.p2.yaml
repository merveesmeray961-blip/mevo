  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kâr payı ve avans
  tip: hesaplama
  zorluk: 3
  kok: Payları borsada işlem gören T2 Anonim Ortaklığı'nın bir önceki yıla ait net dönem kârı 48 milyon TL'dir. Aynı hesap
    döneminde altı aylık tablolara göre 14 milyon TL kâr payı avansı ödenmiştir. Dokuz aylık ara dönem finansal tablolarında
    net dönem kârı 36 milyon TL, ayrılması gereken yedek akçe 2 milyon TL, geçmiş yıllar zararı 4 milyon TL; net dönem kârı
    hariç dağıtıma konu edilebilecek diğer kaynaklar ise 30 milyon TL'dir. Kâr Payı Tebliği (II-19.1) md. 10'a göre dokuz
    aylık dönem için dağıtılabilecek avans en çok kaç TL'dir?
  secenekler:
    A: 7 milyon TL
    B: 10 milyon TL
    C: 15 milyon TL
    D: 24 milyon TL
    E: 29,5 milyon TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 10/1 uyarınca bu avans, (36 - 2 - 4) / 2 = 15 milyon TL''yi geçemez. Md. 10/2 uyarınca dönem toplamı,
      önceki yıl net dönem kârının yarısı (24 milyon TL) ile diğer kaynaklardan (30 milyon TL) düşük olanı olan 24 milyon
      TL''yi aşamaz. Md. 10/3 uyarınca önceki ara dönemlerde ödenen avanslar bu toplamdan indirilir: 24 - 14 = 10 milyon TL.
      Bu avans için sınır olan 15 milyon TL''den düşük olduğundan dağıtılabilecek avans 10 milyon TL''dir. Püf noktaları:
      İki sınırı ayrı ayrı hesaplayıp düşük olanı seçin; önceden ödenen avansı yalnızca dönem toplamından düşün, ara dönem
      kârının yarısından değil.'
    celdiriciler:
      A: 7 milyon TL, önceki avansın ara dönem sınırından (15 milyon TL) değil, yarıya inmiş bir tutardan düşülmesiyle bulunur;
        md. 10/3 düşümü dönem toplam sınırı üzerinden yapar.
      C: 15 milyon TL, yalnızca bu avansa ilişkin ara dönem sınırıdır; dönem toplamından önceki avans düşülünce kalan 10 milyon
        TL'dir.
      D: 24 milyon TL, dönem toplam sınırıdır; önceki avans düşülmemiş ve ara dönem sınırı dikkate alınmamıştır.
      E: 29,5 milyon TL, anlamlı bir sınır değildir; diğer kaynaklar (30) ile önceki avansın (14) karışık kullanımıyla bulunmuş
        hatalı bir tutardır.
    hesap_adimlari:
    - 'Bu avans için sınır: (36 - 2 - 4) / 2 = 15 milyon TL'
    - 'Dönem toplam sınırı: min(48 / 2; 30) = 24 milyon TL'
    - 'Önceki avans düşülünce kalan: 24 - 14 = 10 milyon TL'
    - 'Dağıtılabilecek avans: min(15; 10) = 10 milyon TL'
  kaynaklar:
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/1
    alinti: Dağıtılacak kâr payı avansı, ara dönem finansal tablolara göre oluşan net dönem kârından TTK’ya ve esas sözleşmeye
      göre ayrılması gereken yedek akçeler ile geçmiş yıllar zararları düşüldükten sonra kalan kısmın yarısını geçemez.
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/2
    alinti: Bir hesap döneminde verilecek toplam kâr payı avansı tutarı; a) Bir önceki yıla ait net dönem kârının yarısından,
      b) İlgili ara dönem finansal tablolarında yer alan net dönem kârı hariç kâr dağıtımına konu edilebilecek diğer kaynaklardan
      düşük olanı aşamaz.
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/3
    alinti: Aynı hesap dönemi içinde birden fazla sayıda kâr payı avansı ödemesi yapıldığı takdirde; sonraki ara dönemlerde
