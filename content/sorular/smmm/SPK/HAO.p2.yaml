    madde: md. 5/4
    alinti: Kurulca beş yıl süreyle geçerli olmak üzere izin verilecek kayıtlı sermaye tavanı, ortaklıkların ödenmiş/çıkarılmış
      sermayesi veya özsermayesinden yüksek olanının beş katını aşamaz.
