    ne: 'hakem 2026-10-04: Tebliğ adı ''Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)'' olarak düzeltildi
      (kök ve kaynaklar); köke md. 6/7''nin amaç şartı (''oran sınırlarının altında kalmak amacıyla'') eklendi ve satışlar
      planlanan işlem olarak yazıldı (D şıkkı zamanı uyarlandı); dogru_neden ve D çeldiricisinde md. 6/7 şartı ve md. 6/6''daki
      ''payları borsada işlem gören'' şartı eklendi; gecerlilik.baslangic 2020-02-20 → 2020-06-27 (RG 27.06.2020/31168, Tebliğ
      md. 21).'
    neden: 'G5/G6: kullanılan ad 2020''de yürürlükten kaldırılan II-23.1''in adıydı (Tebliğ md. 20); md. 6/7 yalnız sınırların
