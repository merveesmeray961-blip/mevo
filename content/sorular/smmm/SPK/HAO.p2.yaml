  kok: Payları borsada işlem gören T Anonim Ortaklığı'nın bir önceki yıla ait net dönem kârı 55 milyon TL'dir. Altı aylık
    ara dönem finansal tablolarında net dönem kârı 40 milyon TL, ayrılması gereken yedek akçe 4 milyon TL, geçmiş yıllar zararı
    6 milyon TL; net dönem kârı hariç kâr dağıtımına konu edilebilecek diğer kaynaklar ise 25 milyon TL'dir. Bu hesap döneminde
    ilk kez kâr payı avansı dağıtılacağına göre Kâr Payı Tebliği (II-19.1) md. 10'a göre dağıtılabilecek avans tutarı en çok
    kaç TL'dir?
  secenekler:
    A: 9 milyon TL
    B: 15 milyon TL
    C: 18 milyon TL
    D: 20 milyon TL
    E: 27,5 milyon TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 10/1 uyarınca avans, ara dönem net dönem kârından yedek akçeler ve geçmiş yıllar zararları düşüldükten
      sonra kalanın yarısını geçemez: (40 - 4 - 6) / 2 = 15 milyon TL. Md. 10/2 uyarınca dönem toplamı, önceki yıl net dönem
      kârının yarısı (27,5) ile diğer kaynaklardan (25) düşük olanı olan 25 milyon TL''yi aşamaz; ilk avans olduğundan 15
      milyon TL bu toplam sınırın altındadır.'
