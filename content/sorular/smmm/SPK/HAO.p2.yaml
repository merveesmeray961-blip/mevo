      C: Md. 11/6 intifa hakkı sahibine hak tanımaz; hak tek başına pay sahibine aittir.
      D: Md. 11/6 ayrılma hakkının intifa hakkının sona ermesine bağlanması gibi bir koşul öngörmez.
