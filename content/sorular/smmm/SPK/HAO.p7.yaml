    dogru_neden: 'Kayıtlı Sermaye Sistemi Tebliği md. 5/4''e göre tavan, ödenmiş/çıkarılmış sermaye veya özsermayeden yüksek
      olanın beş katını aşamaz. Md. 5/5''e göre dönem sonundan sonra ödenmiş sermaye artırılmış ve artırım sonrası tutar finansal
      tablolardaki özsermayeden yüksekse güncel ödenmiş sermaye esas alınır. Bu nedenle 150 x 5 = 750 milyon TL''dir. Püf
      noktaları: 100 milyon TL''lik dönem sonu sermayesi değil, md. 5/5 şartı gerçekleştiği için güncel 150 milyon TL kullanılır.'
