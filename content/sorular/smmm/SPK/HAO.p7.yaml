  kok: Halka açık bir ortaklığın ilişkili tarafıyla yaptığı yaygın ve süreklilik arz eden alış işlemlerinin bir hesap dönemindeki
    tutarının, son yıllık finansal tablolara göre oluşan satışların maliyetinin %11'ine ulaşacağı öngörülmektedir. Buna göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnızca yönetim kurulu kararı alınması yeterlidir; KAP açıklaması yapılamaz.
    B: Yönetim kurulu kararı gerekmez; yalnız bağımsız denetim raporu hazırlanır.
    C: İşlemlerin tutarı %20'yi aşmadıkça ek rapor hazırlanması gerekmez.
    D: Yönetim kurulu kararına ek olarak işlemlerin şartları ve piyasa koşullarıyla karşılaştırılmasına ilişkin rapor hazırlanmalı
      ve raporun tamamı veya sonucu KAP'ta açıklanmalıdır.
    E: Yalnız genel kurul kararı alınır; yönetim kurulu kararı ve KAP açıklaması aranmaz.
