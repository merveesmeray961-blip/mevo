- id: SMMM-SPK-HAO-0007
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: önemli nitelikteki işlemler ve ayrılma hakkı
  tip: uygulama
  zorluk: 3
  kok: Halka açık bir ortaklığın önemli nitelikteki bir işlemine ilişkin genel kurul toplantısına pay sahibi katılmış ve işleme
    olumsuz oy vermiştir. Pay sahibi muhalefetini toplantı tutanağına geçirttiğini belirtiyor. Aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Pay sahibi, paylarını ortaklığa satarak ayrılma hakkını kullanabilir; ortaklık payları Kurulca belirlenecek esaslara
      göre adil bir bedel üzerinden satın almakla yükümlüdür.
    B: Ayrılma hakkı yalnız olumlu oy veren pay sahiplerine tanınır.
    C: Ayrılma hakkı için genel kurula katılmak yeterlidir; olumsuz oy ve muhalefet şerhi aranmaz.
    D: Ortaklık ayrılma hakkına konu payları hiçbir koşulda satın almak zorunda değildir.
    E: Önemli nitelikteki işlem ayrılma hakkı doğurmaz; yalnız zorunlu pay alım teklifi gündeme gelir.
  dogru: A
  aciklama:
    dogru_neden: 'SPKn md. 23/1 önemli nitelikteki işlemleri, yatırım kararlarının değişmesine yol açacak ortaklığın yapısına
      ilişkin temel işlemler arasında sayar. Md. 24/1''e göre bu işlemlere ilişkin genel kurul toplantısına katılıp olumsuz
      oy veren ve muhalefetini tutanağa geçirten pay sahipleri paylarını ortaklığa satarak ayrılma hakkına sahiptir; ortaklık
      payları adil bedel üzerinden satın almakla yükümlüdür. Püf noktaları: Ayrılma hakkının doğması için genel kurula katılım,
      olumsuz oy ve muhalefetin tutanağa geçirilmesi birlikte önem taşır.'
    celdiriciler:
      B: Kaynak, olumlu oy değil olumsuz oy ve muhalefetin tutanağa geçirilmesini arar.
      C: Genel kurula katılmak tek başına yeterli değildir; md. 24/1'de olumsuz oy ve muhalefet şerhi de düzenlenmiştir.
      D: Ortaklık, pay sahibinin talebi üzerine Kurulca belirlenecek esaslara göre adil bedel üzerinden satın almakla yükümlüdür.
      E: Önemli nitelikteki işlemler ayrılma hakkının kanuni temelidir; md. 24 bunu açıkça düzenler.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 23/1
    alinti: 'MADDE 23 – (1) (Değişik:20/2/2020-7222/25 md.) Halka açık ortaklıkların

      birleşme, bölünme işlemlerine taraf olması, tür değiştirmesi, imtiyaz öngörmesi veya mevcut

      imtiyazların kapsam veya konusunu değiştirmesi gibi yatırımcıların yatırım kararlarının

      değişmesine yol açacak ortaklığın yapısına ilişkin temel işlemler bu Kanunun

      uygulanmasında önemli nitelikte işlem sayılır.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 24/1
    alinti: "MADDE 24 – (Değişik:20/2/2020-7222/26 md.)\n         (1) 23 üncü maddede belirtilen önemli nitelikteki işlemlere\
      \ ilişkin genel kurul\ntoplantısına katılıp da olumsuz oy veren ve bu muhalefeti tutanağa geçirten pay sahipleri,\n\
      paylarını halka açık ortaklığa satarak ayrılma hakkına sahiptir."
