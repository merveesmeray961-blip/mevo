      A: Kanun, ayrılma hakkını olumlu oy verenlere değil, önemli nitelikteki işleme karşı olumsuz oy verip muhalefetini tutanağa
        geçiren pay sahiplerine tanır.
      C: Ayrılma hakkının doğması için ayrıca yönetim kurulu kararı aranmaz; md. 24/1'deki şartların gerçekleşmesi yeterlidir.
      D: Muhalefetin tutanağa geçirilmesi şartı genel kurul toplantısı sırasında yerine getirilir; haktan önce kullanma zorunluluğu
        yoktur.
      E: md. 24/1 ortaklığa, pay sahibinin talebi üzerine payları adil bir bedel üzerinden satın alma yükümlülüğü getirir.
