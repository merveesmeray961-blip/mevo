      \ kurulu tarafından işlemlerin\nşartlarına ve piyasa koşulları ile karşılaştırılmasına ilişkin olarak bir rapor hazırlanır\
      \ ve bu raporun tamamı veya sonucu KAP’ta açıklanır."
