- id: SMMM-SPK-HAO-0006
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kâr payı ve avans
  tip: hesaplama
  zorluk: 2
  kok: Bir halka açık ortaklığın önceki yıla ait dönem kârı 8 milyon TL'dir. Önceki dönemde ödenmiş 1 milyon TL kâr payı avansı
    henüz mahsup edilmemiştir. Mevcut hesap döneminde verilebilecek toplam kâr payı avansının azami tutarı ve yeni bir avans
    kararı bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Azami toplam avans 4 milyon TL'dir; önceki avans mahsup edilmeden kalan 3 milyon TL için yeni avans verilebilir.
    B: Azami toplam avans 8 milyon TL'dir; önceki avansın mahsup edilmesi aranmaz.
    C: Azami toplam avans 4 milyon TL'dir; önceki avans mahsup edilmeden ilave kâr payı avansına karar verilemez.
    D: Azami toplam avans 3 milyon TL'dir; ayrıca önceki avansın mahsubu gerekmez.
    E: Azami toplam avans 2 milyon TL'dir; önceki avans mahsup edilmeden kâr payı dağıtılabilir.
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 20/1'e göre toplam kâr payı avansı önceki yıl dönem kârının yarısını aşamaz; 8 milyon TL'nin yarısı
      4 milyon TL'dir. Aynı hüküm, önceki dönemde ödenen avanslar mahsup edilmeden ilave avans veya kâr payı dağıtımına karar
      verilemeyeceğini belirtir.
    celdiriciler:
      A: 4 milyon TL azami toplam tutar doğru olsa da önceki 1 milyon TL mahsup edilmeden ilave avans kararı verilemez.
      B: Üst sınır önceki dönem kârının yarısıdır; 8 milyon TL değildir ve önceki avansın mahsubu aranır.
      D: Azami toplam tutar 3 değil 4 milyon TL'dir.
      E: Azami toplam tutar 2 değil 4 milyon TL'dir; ayrıca mahsup şartı vardır.
    hesap_adimlari:
    - Önceki yıl dönem kârı 8.000.000 TL olduğundan toplam kâr payı avansı üst sınırı 8.000.000 / 2 = 4.000.000 TL'dir.
    - Önceki dönemde ödenen 1.000.000 TL avans mahsup edilmeden ilave kâr payı avansına karar verilemez.
