  aciklama:
    dogru_neden: II-17.1 Tebliği md. 10/2'ye göre yaygın ve süreklilik arz eden alış işlemlerinin bir hesap dönemindeki tutarının
      satışların maliyetine oranının %10'dan fazla olacağının öngörülmesi hâlinde yönetim kurulu kararına ilaveten rapor hazırlanır
      ve tamamı veya sonucu KAP'ta açıklanır.
    celdiriciler:
      A: '%10 eşiği aşıldığında yönetim kurulu kararına ilaveten rapor ve KAP açıklaması gerekir; yalnız karar yeterli değildir.'
      B: Kaynak hüküm ek rapor ve KAP açıklaması öngörür; yalnız bağımsız denetim raporu yeterli değildir.
      C: Eşik %20 değil, %10'dan fazla orandır.
      E: Hüküm ek genel kurul kararı değil, yönetim kurulu kararı ve raporlama yükümlülüğü öngörür.
  kaynaklar:
