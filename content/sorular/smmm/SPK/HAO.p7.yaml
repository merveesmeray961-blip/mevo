- id: SMMM-SPK-HAO-0027
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: genel kurul
  tip: uygulama
  zorluk: 3
  kok: Halka açık bir ortaklığın genel kurulunda önemli nitelikteki bir işlemin karara bağlanması planlanmaktadır. Esas sözleşmede
    bu işlemler için daha ağır bir nisap öngörülmemiştir. Toplantıda sermayeyi temsil eden oy hakkını haiz payların en az
    yarısı hazır bulunmuştur. Bu durumda aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Toplantıya katılan oy hakkını haiz payların üçte ikisinin olumlu oyu her hâlükârda zorunludur.
    B: Toplantıya katılan oy hakkını haiz payların çoğunluğu ile karar alınabilir; ancak 6102 sayılı Kanunun 436/1'ine göre
      taraf olan ortaklar oy kullanamaz.
    C: Karar yalnızca oy hakkını haiz payların tamamının oybirliğiyle alınabilir.
    D: Önemli nitelikteki işlem için genel kurul kararı gerekmez; yönetim kurulu tek başına karar verebilir.
    E: Toplantıya katılan payların üçte birinin olumlu oyu yeterlidir ve taraf olan ortaklar oy kullanabilir.
  dogru: B
  aciklama:
    dogru_neden: '6362 sayılı Sermaye Piyasası Kanunu md. 29/6''ya göre önemli nitelikteki işlemlerde, daha ağır bir nisap
      öngörülmemişse kural olarak katılan oy hakkını haiz payların üçte ikisinin olumlu oyu aranır. Ancak toplantıda sermayeyi
      temsil eden oy hakkını haiz payların en az yarısı hazır bulunuyorsa, katılan oy hakkını haiz payların çoğunluğu yeterlidir.
      Aynı fıkra, 6102 sayılı Kanunun 436/1''ine göre taraf olan ortakların bu işlemlerin onaylanacağı toplantıda oy kullanamayacağını
      da düzenler. Püf noktaları: Önce hazır bulunan sermaye oranını, sonra katılan oyların nisabını değerlendirin; ayrıca
      işlemde taraf olan ortakların oy kullanamayacağını unutmayın.'
    celdiriciler:
      A: Toplantıda sermayeyi temsil eden oy hakkını haiz payların en az yarısı hazır bulunduğu için özel çoğunluk kuralı
        devreye girer.
      C: Kanun oybirliği öngörmez; belirtilen koşullarda katılan oy hakkını haiz payların çoğunluğu yeterlidir.
      D: Önemli nitelikteki işlemler için md. 29/6 genel kurul kabul nisabını düzenlemektedir.
      E: Kanundaki çoğunluk üçte bir değildir ve taraf olan ortakların oy kullanamaması kuralı vardır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 29/6
    alinti: Halka açık ortaklıklarda yeni pay alma haklarının kısıtlanmasına, kayıtlı sermaye sisteminde yönetim kuruluna
      yeni pay alma haklarını kısıtlama yetkisinin verilmesine, sermaye azaltımına ve 23 üncü maddenin birinci fıkrasına göre
      belirlenen önemli nitelikteki işlemlere ilişkin kararların genel kurulca kabul edilebilmesi için, esas sözleşmelerinde
      açıkça oran belirtilmek suretiyle daha ağır nisaplar öngörülmediği takdirde, toplantı nisabı aranmaksızın, ortaklık
      genel kuruluna katılan oy hakkını haiz payların üçte ikisinin olumlu oy vermesi şartı aranır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 29/6 devamı
    alinti: Ancak, toplantıda sermayeyi temsil eden oy hakkını haiz payların en az yarısının hazır bulunması hâlinde, esas
      sözleşmede açıkça daha ağır nisaplar öngörülmedikçe, toplantıya katılan oy hakkını haiz payların çoğunluğu ile karar
      alınır. Bu işlemlerde, 6102 sayılı Kanunun 436 ncı maddesinin birinci fıkrasına göre taraf olan ortaklar bu işlemlerin
      onaylanacağı genel kurul toplantılarında oy kullanamazlar.
