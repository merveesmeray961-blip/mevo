  kok: Bir ortaklığın başvuruya en yakın finansal tablolarında ödenmiş sermayesi 100 milyon TL, özsermayesi 120 milyon TL'dir.
    Finansal tablo dönem sonundan sonra ödenmiş sermaye 150 milyon TL'ye çıkarılmıştır. Kayıtlı sermaye tavanının Tebliğdeki
    azami tutarı kaç milyon TL olur?
  secenekler:
    A: 500 milyon TL
    B: 600 milyon TL
    C: 700 milyon TL
    D: 900 milyon TL
    E: 750 milyon TL
