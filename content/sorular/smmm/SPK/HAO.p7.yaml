    madde: md. 10/1-2
    alinti: "a) Alış işlemlerinde kamuya açıklanan son yıllık finansal tablolara göre oluşan satışların maliyetine olan oranının,\n\
      \        b) Satış işlemlerinde kamuya açıklanan son yıllık finansal tablolara göre oluşan hasılat tutarına olan oranının,\n\
