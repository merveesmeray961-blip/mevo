      A: 100 x 5 = 500 milyon TL; ancak dönem sonrasındaki güncel sermaye md. 5/5 nedeniyle esas alınır.
      B: 120 x 5 = 600 milyon TL; ancak güncel ödenmiş sermaye özsermayeden daha yüksektir.
      C: 700 milyon TL, Tebliğdeki beş kat kuralının verilen tutarlara uygulanmasıyla çıkmaz.
      D: 900 milyon TL, güncel sermayenin beş katı yerine altı katının alınmasına dayanır.
