  kok: 'Halka açık ortaklıkların genel kurul karar nisaplarına ilişkin aşağıdaki eşleştirmelerden hangisi doğrudur?

    I. Yeni pay alma haklarının kısıtlanması → Toplantı nisabı aranmaksızın katılan oy hakkını haiz payların 2/3''ünün olumlu
    oyu (sermayenin en az yarısı hazırsa çoğunluk)

    II. Önemli nitelikteki işlemler → Toplantı nisabı aranmaksızın katılan oy hakkını haiz payların 2/3''ünün olumlu oyu (sermayenin
    en az yarısı hazırsa çoğunluk)

    III. Bilanço zararlarının kapatılması için yükümlülük koyan kararlar → 6102 sayılı Kanun md. 418 nisapları uygulanır

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 29/6''ya göre yeni pay alma haklarının kısıtlanması, kayıtlı sermayede yönetim kuruluna yetki verilmesi,
      sermaye azaltımı ve 23 üncü maddedeki önemli nitelikteki işlemler için toplantı nisabı aranmaksızın katılanların 2/3''ü
      (sermayenin yarısı hazırsa çoğunluk) aranır. md. 29/3''e göre bilanço zararlarının kapatılması için yükümlülük koyan
      kararlar bu ağırlaştırılmış nisaptan muaftır ve 6102 md. 418 uygulanır; dolayısıyla III yanlıştır. Püf noktaları: Önemli
      işlemler ile yeni pay alma kısıtlaması aynı nisaba tabi iken bilanço zararı yükümlülüğü istisnadır.

      '
    celdiriciler:
      A: II de doğrudur; yalnız I yetersizdir.
      B: I de doğrudur; yalnız II yetersizdir.
      D: III yanlıştır çünkü bilanço zararı yükümlülüğü ağırlaştırılmış nisaptan muaftır.
      E: III yanlıştır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 29/6
    alinti: Halka açık ortaklıklarda yeni pay alma haklarının kısıtlanmasına, kayıtlı sermaye sisteminde yönetim kuruluna
      yeni pay alma haklarını kısıtlama yetkisinin verilmesine, sermaye azaltımına ve 23 üncü maddenin birinci fıkrasına göre
      belirlenen önemli nitelikteki işlemlere ilişkin kararların genel kurulca kabul edilebilmesi için, esas sözleşmelerinde
      açıkça oran belirtilmek suretiyle daha ağır nisaplar öngörülmediği takdirde, toplantı nisabı aranmaksızın, ortaklık
      genel kuruluna katılan oy hakkını haiz payların üçte ikisinin olumlu oy vermesi şartı aranır. Ancak, toplantıda sermayeyi
      temsil eden oy hakkını haiz payların en az yarısının hazır bulunması hâlinde, esas sözleşmede açıkça daha ağır nisaplar
      öngörülmedikçe, toplantıya katılan oy hakkını haiz payların çoğunluğu ile karar alınır.
