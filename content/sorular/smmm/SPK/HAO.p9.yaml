    C: Tavan süresi sonunda sermaye artırımı kararı alınabilmesi için mevzuattaki yenileme/izin şartları dikkate
      alınmalıdır.
    D: Tavanın geçerlilik süresi hesaplanırken takvim yılı esas alınır.
