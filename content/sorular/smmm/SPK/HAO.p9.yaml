    C: Kâr payı avansı için esas sözleşmede hüküm bulunması zorunludur; kâr payı için böyle bir şart aranmaz.
    D: Kâr payı dağıtımında yönetim kurulu üyelerine kârdan pay verilemez; kâr payı avansında ise verilebilir.
