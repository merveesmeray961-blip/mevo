  konu: HAO
  kazanim: kayıtlı sermaye
  tip: kavrama
  zorluk: 3
  kok: Kayıtlı sermaye sistemindeki bir ortaklıkta, Kurulca izin verilen tavanın geçerlilik süresi sona ermiştir; ortaklık
    bu süre içinde tavana ulaşamamıştır. Aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: İzin verilen tavanın süresi, iznin verildiği yıl dâhil beş yıllık dönem esas alınarak hesaplanır.
    B: Süre sonunda tavana ulaşılmamış olması, eski tavanla yönetim kurulunun süresiz artırım kararı alabileceği anlamına
      gelmez.
    C: Tavan süresi sonunda sermaye artırımı kararı alınabilmesi için mevzuattaki yenileme/izin şartları dikkate alınmalıdır.
    D: Tavanın geçerlilik süresi hesaplanırken takvim yılı esas alınır.
    E: Kurulca verilen kayıtlı sermaye tavanı izni, tavana ulaşılıp ulaşılmadığına bakılmaksızın süresiz geçerlidir.
  dogru: E
  aciklama:
    dogru_neden: 'II-18.1 sayılı Tebliğ md. 6/2, tavan izninin iznin verildiği yıl dâhil beş yıllık süre için geçerli olduğunu
      ve sürenin takvim yılı esasına göre hesaplanacağını düzenler. Püf noktaları: Tavana ulaşılmamış olması süreyi kendiliğinden
      uzatmaz.'
    celdiriciler:
      A: Beş yıllık süre, iznin verildiği yıl dâhil hesaplanır.
      B: Süre bitimi yeni izin/tavan süreci bakımından önemlidir; süresiz kullanım sonucu çıkarılamaz.
      C: Süre sona erdiğinde artırım yetkisinin devamı için Tebliğdeki şartlar uygulanır.
      D: Tebliğ takvim yılı esasını açıkça belirtir.
  kaynaklar:
  - mevzuat: Kayıtlı Sermaye Sistemi Tebliği (II-18.1)
