    kâr dağıtım politikası çerçevesinde yapılır. II. Kanunen ayrılması gereken yedek akçeler ve esas sözleşmede pay sahipleri
    için belirlenen kâr payı ayrılmadan başka yedek akçe ayrılabilir. III. Kurul, benzer nitelikteki ortaklıklar için farklı
    kâr dağıtım esasları belirleyebilir.
