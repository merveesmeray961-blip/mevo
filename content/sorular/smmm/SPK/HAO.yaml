- id: SMMM-SPK-HAO-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kayıtlı sermaye
  tip: kavrama
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre halka açık ortaklıklarda kayıtlı sermaye sistemine ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Yönetim kuruluna kayıtlı sermaye tavanına kadar sermaye artırma yetkisi genel kurul tarafından en çok beş
    yıl süreyle verilebilir; bu süre azami beş yıllık dönemler itibarıyla genel kurul kararıyla uzatılabilir.

    II. İmtiyazlı payların bulunduğu bir ortaklıkta, kayıtlı sermaye tavanı dâhilinde yapılan sermaye artırımları
    için ayrıca imtiyazlı pay sahipleri özel kurulu kararı aranmaz.

    III. Daha önce çıkarılan paylar tamamen satılarak bedelleri ödenmemiş veya satılamayan paylar iptal edilmemiş
    olsa bile, yönetim kurulu kararıyla yeni pay çıkarılabilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 18/2'ye göre kayıtlı sermaye tavanına kadar sermaye artırma yetkisi genel kurul tarafından
      en çok beş yıl süreyle verilebilir ve azami beş yıllık dönemler itibarıyla genel kurul kararıyla uzatılabilir
      (I doğru). md. 18/4'e göre ortaklıkların kayıtlı sermaye tavanı dâhilindeki sermaye artırımlarında ayrıca
      imtiyazlı pay sahipleri özel kurulu kararı aranmaz (II doğru). md. 18/3'e göre ise çıkarılan paylar tamamen
      satılarak bedelleri ödenmedikçe veya satılamayan paylar iptal edilmedikçe yeni pay çıkarılamaz (III yanlış).
      Doğru ifadeler I ve II'dir.
    celdiriciler:
      A: II numaralı ifade de md. 18/4'ün son cümlesine uygun olduğundan yalnız I eksik bir cevaptır.
      B: III numaralı ifade md. 18/3'e aykırıdır; çıkarılan paylar satılıp bedelleri ödenmedikçe veya satılamayanlar
        iptal edilmedikçe yeni pay çıkarılamaz.
      D: III numaralı ifade md. 18/3'e aykırı olduğundan bu seçenek yanlıştır; ayrıca doğru olan I numaralı ifadeyi
        içermemektedir.
      E: III numaralı ifade md. 18/3'e aykırı olduğundan üç ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 18/2
    alinti: Şu kadar ki, bu yetki genel kurul tarafından en çok beş yıl süre ile verilebilir. Bu yetkinin süresi
      azami beş yıllık dönemler itibarıyla genel kurul kararıyla uzatılabilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 18/3
    alinti: Kayıtlı sermaye sisteminde, çıkarılan paylar tamamen satılarak bedelleri ödenmedikçe veya satılamayan
      paylar iptal edilmedikçe yeni pay çıkarılamaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 18/4
    alinti: Şu kadar ki, ortaklıkların kayıtlı sermaye tavanı dâhilindeki sermaye artırımlarında ayrıca imtiyazlı
      pay sahipleri özel kurulu kararı aranmaz.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-SPK-HAO-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kâr payı ve avans
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre halka açık ortaklıklarda kâr payı, kâr payı avansı ve bağışa
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Bir hesap döneminde verilecek toplam kâr payı avansı, bir önceki yıla ait dönem kârının yarısını aşamaz.
    B: Kâr payı, dağıtım tarihindeki mevcut paylara, payların ihraç ve iktisap tarihleri dikkate alınarak ortaklıkta
      kaldıkları süreyle orantılı olarak dağıtılır.
    C: Önceki dönemde ödenen kâr payı avansları mahsup edilmeden ilave kâr payı avansı verilmesine karar verilemez.
    D: Bağış yapılabilmesi için esas sözleşmede hüküm bulunması şarttır ve ortaklığın ilgili mali yıl içinde yaptığı
      bağışlar dağıtılabilir kâr matrahına eklenir.
    E: Sermaye artırımlarında bedelsiz paylar, artırım tarihindeki mevcut paylara dağıtılır.
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 19/3'e göre halka açık ortaklıklarda kâr payı, dağıtım tarihi itibarıyla mevcut payların
      tümüne, bunların ihraç ve iktisap tarihleri dikkate alınmaksızın eşit olarak dağıtılır. Payların ortaklıkta
      kaldığı süreyle orantılı dağıtım öngörülmediğinden ifade yanlıştır.
    celdiriciler:
      A: md. 20/1'in ilk cümlesine göre bir hesap döneminde verilecek toplam kâr payı avansı bir önceki yıla ait
        dönem kârının yarısını aşamaz; ifade doğrudur.
      C: md. 20/1'in ikinci cümlesine göre önceki dönemde ödenen kâr payı avansları mahsup edilmeden ilave kâr payı
        avansı verilmesine karar verilemez; ifade doğrudur.
      D: md. 19/5'e göre bağış için esas sözleşmede hüküm bulunması şarttır ve ilgili mali yıl içinde yapılan bağışlar
        dağıtılabilir kâr matrahına eklenir; ifade doğrudur.
      E: md. 19/4'e göre halka açık ortaklıkların sermaye artırımlarında bedelsiz paylar artırım tarihindeki mevcut
        paylara dağıtılır; ifade doğrudur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 19/3, 19/4, 19/5
    alinti: (3) Halka açık ortaklıklarda kâr payı, dağıtım tarihi itibarıyla mevcut payların tümüne, bunların ihraç
      ve iktisap tarihleri dikkate alınmaksızın eşit olarak dağıtılır. (4) Halka açık ortaklıkların sermaye artırımlarında,
      bedelsiz paylar artırım tarihindeki mevcut paylara dağıtılır. (5) Halka açık ortaklıklar tarafından bağış
      yapılabilmesi veya pay sahibi dışındaki kişilere kârdan pay dağıtılabilmesi için esas sözleşmede hüküm bulunması
      şarttır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 19/5 (son cümle) ve md. 20/1
    alinti: Ortaklıkların ilgili mali yıl içinde yapmış olduğu bağışlar, dağıtılabilir kâr matrahına eklenir. ...
      Bir hesap döneminde verilecek toplam kâr payı avansı bir önceki yıla ait dönem kârının yarısını aşamaz. Önceki
      dönemde ödenen kâr payı avansları mahsup edilmeden ilave kâr payı avansı verilmesine ve kâr payı dağıtılmasına
      karar verilemez.
