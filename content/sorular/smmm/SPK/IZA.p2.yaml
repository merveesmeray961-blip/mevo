  aciklama:
    dogru_neden: 'II-5.2 md. 20/3 uyarınca oransal dağıtımda gruba tahsis edilen miktar gruba gelen toplam talebe bölünerek
      arzın talebi karşılama oranı bulunur ve bu oran her yatırımcının talebiyle çarpılır. Oran 100.000 / 250.000 = %40; Z''ye
      30.000 x 0,40 = 12.000 lot dağıtılır. Püf noktaları: Oransal dağıtımda mükerrer taleplerde en yüksek talebin esas alınması
      kuralı uygulanmaz; eşit dağıtımda ise kalan tutar küçük talepler karşılandıktan sonra bölünür.'
    hesap_adimlari:
    - Karşılama oranı = 100.000 / 250.000 = 0,40
    - Z'ye dağıtılacak = 30.000 x 0,40 = 12.000 lot
    celdiriciler:
      A: Bir basamak kaydırılmış tutardır.
      C: Talebin yarısı (30.000 / 2) alınarak bulunmuştur; oran %50 değil %40'tır.
      D: Oran ters hesaplanarak (%60) bulunmuştur; karşılama oranı tahsisat bölü talep olarak hesaplanır.
      E: Sonuç bir basamak kaydırılarak yazılmıştır.
