      onaylanan listenin yetkili kuruluş tarafından teslim alınmasını izleyen iş günü içerisinde yerine getirilir. Püf noktaları:
      Listeyi düzenleme (talep toplama bitiminden sonra iki iş günü), onaylama (iki iş günü) ve iade (bir iş günü) süreleri
      farklıdır; iade süresi onay süresine değil, onaylı listenin teslim alınmasına bağlanmıştır.'
