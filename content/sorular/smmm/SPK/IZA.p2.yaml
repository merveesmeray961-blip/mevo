      tarafından daha uzun olarak belirlenebilir (II doğru); değiştirilecek hususları içeren izahname kısımları Kurula bildirim
      tarihinden itibaren yedi iş günü içinde onaylanır (III doğru). I bu nedenle yanlıştır. Püf noktaları: İki iş günülük
      süre asgari süredir ve uzatılabilir, kısaltılamaz; yedi iş günü ise Kurulun onay süresidir, yatırımcının geri alma süresi
