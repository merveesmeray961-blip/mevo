    tahsis edilmiştir. Talep toplama süresi sonunda tahsisat oranlarında kaydırma yapılacaktır; yurt içi bireysel ve kurumsal
    grupların asgari tahsisat oranları azaltılmayacaktır. Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2) md. 18/5'e
    göre azaltma sonrasında çalışanlar grubuna kalması gereken asgari tahsisat tutarı kaç TL'dir?
