  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: talebin geri alınması
  tip: uygulama
  zorluk: 3
  kok: Fiyat aralığı ile talep toplama yöntemiyle yapılan bir halka arzda yatırımcı Y, talep toplamanın ikinci gününde talepte
    bulunmuştur. Izahnamede talebin geri alınmasına ilişkin aksi bir hüküm bulunmamaktadır ve izahnamede hiçbir değişiklik
    yapılmamıştır. Y, talep toplama süresi devam ederken üçüncü gün talebini geri almak istemektedir. Sermaye Piyasası Araçlarının
    Satışı Tebliği (II-5.2) md. 14/3'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Y, yalnızca izahnamede değişiklik yapılırsa ve değişikliğin yayımından itibaren iki iş günü içinde talebini geri alabilir
    B: Y, talebini geri alamaz; talep verildikten sonra değiştirilmesi ya da geri alınması mümkün değildir
    C: Y, izahnamede değişiklik olmasa dahi talep toplama süresi içinde talebini değiştirme ya da geri alma hakkına sahiptir
    D: Y, ancak ihraççının yazılı onayı hâlinde talebini geri alabilir
    E: Y, yalnızca talebinin karşılanmayan kısmını geri alabilir, talebin tamamını geri alamaz
  dogru: C
  aciklama:
    dogru_neden: 'II-5.2 md. 14/3 uyarınca izahnamede aksi belirtilmediği sürece, talep toplama yoluyla satış yönteminin kullanıldığı
      halka arzlarda izahnamede herhangi bir değişiklik olmasa dahi yatırımcılar talep toplama süresi içerisinde taleplerini
      değiştirme ya da geri alma hakkına sahiptir. Püf noktaları: Talep geri alma hakkının iki ayrı kaynağı vardır: izahname
      değişikliği hâlinde yayımdan itibaren iki iş günü (SPKn md. 8/4) ve talep toplama yönteminin kendisinden doğan, süre
      içinde serbestçe kullanılan hak. Bu olayda ikincisi söz konusudur.'
    celdiriciler:
      A: İki iş günülük hak izahname değişikliği hâline özgüdür; talep toplama yönteminde değişiklik olmasa da geri alma hakkı
        vardır.
      B: Talep toplama süresi içinde talep değiştirilebilir ya da geri alınabilir.
      D: İhraççının onayı aranmaz; hak doğrudan Tebliğden doğar.
      E: Tebliğ kısmi geri alma ile sınırlama getirmez; talep değiştirilebilir ya da geri alınabilir.
