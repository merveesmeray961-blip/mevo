    zarara uğramıştır. Özet bölümü, izahnamenin diğer kısımlarıyla birlikte okunduğunda doğru ve tutarlıdır; yalnızca özette
    yer almayan bir ayrıntıyı yatırımcı sonradan sorun etmektedir. İzahname ve İhraç Belgesi Tebliği (II-5.1) md. 25/3'e göre
    aşağıdakilerden hangisi doğrudur?
