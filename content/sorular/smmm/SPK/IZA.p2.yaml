    hangileri doğrudur?


    I. Yurt içi bireysel ve kurumsal yatırımcılar için öngörülen asgari tahsisat oranları borsada satış yöntemiyle yapılan
    halka arzlarda da aynen uygulanır.

    II. Talep toplama yönteminde belirli bir yatırımcı grubuna tahsis edilen tutarı karşılayacak talep gelmemişse, o gruba
    ait tahsisatın karşılanamayan kısmı diğer gruplara aktarılabilir.

    III. Herhangi bir tahsisat grubuna dahil olamayan yatırımcı talepleri, halka arza aracılık eden yetkili kuruluşun onayı
    ile uygun bir tahsisat grubuna dahil edilir.'
