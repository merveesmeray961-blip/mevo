  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 20/3
    alinti: herhangi bir yatırımcı grubuna tahsis edilmiş bulunan toplam sermaye piyasası aracı miktarının bu gruba gelen
      toplam talep miktarına bölünmesi ile arzın talebi karşılama oranı bulunduğu oransal dağıtım yöntemi kullanılabilir.
