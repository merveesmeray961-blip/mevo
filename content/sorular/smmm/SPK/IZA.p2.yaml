      C: Onay süresi doğrudur ancak iade süresi on iş günü değil, onaylı listenin teslim alınmasını izleyen iş günüdür.
      D: Liste talep toplama süresi bittikten sonra düzenlenir; bu süre bitmeden onaylanması söz konusu olamaz.
