    C: Sorumluluk yalnızca özeti hazırlayan lider aracı kuruma yüklenir
    D: Özet bölümündeki sorumluluk ancak özette ayrıca bir uyarı bulunuyorsa doğar
    E: Özete dayanan sorumluluk, Kurulun onay tarihinden sonra otomatik olarak doğar
  dogru: A
  aciklama:
    dogru_neden: 'II-5.1 md. 25/3 uyarınca izahnamenin diğer kısımları ile birlikte okunduğu takdirde özetin yanıltıcı, hatalı
      veya tutarsız olması durumu hariç olmak üzere, sadece özete bağlı olarak ilgililere herhangi bir hukuki sorumluluk yüklenemez.
      Bu olayda özet doğru ve tutarlıdır. Püf noktaları: Kural sorumluluğu tümden kaldırmaz; özetin diğer kısımlarla birlikte
      okunduğunda yanıltıcı, hatalı veya tutarsız olması hâlinde sorumluluk doğar. Burada o istisna gerçekleşmemiştir.'
    celdiriciler:
      B: Özet tek başına sorumluluk doğurmaz; istisna yalnızca özetin yanıltıcı, hatalı veya tutarsız olduğu durumdur.
      C: Sorumluluk yalnızca aracı kuruma yüklenmez; ayrıca özetten bağımsız olarak sadece özete bağlı sorumluluk kuralı geçerlidir.
      D: Tebliğ özette ek bir uyarı bulunmasını sorumluluk şartı yapmaz; ölçüt özetin yanıltıcı, hatalı veya tutarsız olmasıdır.
