  kok: Halka açık bir ortaklık, halka arz edilmeksizin bedelli sermaye artırımı yapmak istemektedir ve ihraç belgesi ilan
    edilmiştir. Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2) md. 11/1'e göre ihraç belgesinin ilan edildiği tarihi
    takip eden günden itibaren, satışa başlama süresi ile satışın tamamlanma süresi birlikte değerlendirildiğinde satışın
    en geç kaç iş günü içinde sona ermesi gerekir?
  secenekler:
