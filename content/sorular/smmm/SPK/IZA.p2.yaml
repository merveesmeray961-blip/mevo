  aciklama:
    dogru_neden: II-5.2 md. 18/6 uyarınca karşılanamayan tahsisat kısmı diğer gruplara aktarılabilir (II doğru). Md. 18/7
      uyarınca hiçbir gruba dahil olamayan talepler aracı yetkili kuruluşun onayıyla uygun gruba dahil edilir (III doğru).
      Md. 18/4 uyarınca asgari tahsisat sınırlamaları borsada satış yöntemiyle yapılan halka arzlarda uygulanmaz (I yanlış).
    celdiriciler:
      A: I yanlıştır; borsada satış yönteminde asgari tahsisat sınırlamaları uygulanmaz. Ayrıca II ve III dışarıda bırakılmıştır.
      B: I yanlıştır; III ise doğru olduğu hâlde dışarıda bırakılmıştır.
      C: I yanlıştır; II ise doğru olduğu hâlde dışarıda bırakılmıştır.
      E: I yanlış olduğundan üç öncülün hepsi doğru değildir.
