    - Başlama süresi azami 10 iş günü + tamamlanma süresi azami 10 iş günü = 20 iş günü
    celdiriciler:
      A: On iş günü yalnızca iki süreden biridir; iki süre toplanmalıdır.
      B: On beş iş günü, md. 11/1'de öngörülen bir süre değildir.
      D: Otuz iş günü, iki süreden daha uzun bir toplam verir; md. 11/1'de böyle bir süre yoktur.
      E: Kırk iş günü, md. 11/1'de öngörülen sürelerin toplamından fazladır.
