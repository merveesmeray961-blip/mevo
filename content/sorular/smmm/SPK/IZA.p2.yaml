  kok: Bir halka arzda talep toplama süresi sona ermiş ve yetkili kuruluş dağıtım listesini düzenleyerek ihraççıya vermiştir.
    Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2) md. 23'e göre ihraççının listeyi onaylama süresi ile karşılanamayan
    taleplere ilişkin bedel iadelerinin yerine getirilme zamanı bakımından aşağıdakilerden hangisi doğrudur? (Konsorsiyum
    oluşturulmamıştır.)
