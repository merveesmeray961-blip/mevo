    C: İhraççı listeyi teslimini izleyen iki iş günü içinde onaylar; bedel iadeleri onaydan sonra on iş günü içinde yapılır
    D: İhraççı listeyi talep toplama süresi bitmeden onaylar; bedel iadeleri onay gününde yapılır
