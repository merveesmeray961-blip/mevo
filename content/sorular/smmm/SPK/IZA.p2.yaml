- id: SMMM-SPK-IZA-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: izahnamede değişiklik — Kurula bildirim, onay süresi ve talebin geri alınması
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre, izahname ile kamuya açıklanan bilgilerde satış süresi içinde
    yatırımcıların yatırım kararını etkileyebilecek değişiklik veya yeni hususlar ortaya çıkması hâline ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Durum, ihraççı veya halka arz eden tarafından en uygun haberleşme vasıtasıyla derhâl Kurula bildirilir.


    II. Değiştirilecek veya yeni eklenecek hususlar, bildirim tarihinden itibaren on iş günü içinde onaylanır ve
    yayımlanır.


    III. Değişiklik veya yeni hususların yayımlanmasından önce satın alma talebinde bulunmuş yatırımcılar, yayımlanmasından
    itibaren beş iş günü içinde taleplerini geri alma hakkına sahiptir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve II
    E: II ve III
  dogru: A
  aciklama:
    dogru_neden: 'I numaralı ifade md. 8/1''e uygundur. II numaralı ifade yanlıştır: md. 8/3''e göre değiştirilecek
      veya yeni eklenecek hususlar bildirim tarihinden itibaren yedi iş günü içinde onaylanır ve yayımlanır. III
      numaralı ifade de yanlıştır: md. 8/4''e göre yatırımcılar, ek ve değişikliklerin yayımlanmasından itibaren
      iki iş günü içinde taleplerini geri alma hakkına sahiptir. Doğru ifade yalnız I''dir.'
    celdiriciler:
      B: II numaralı ifade md. 8/3'e aykırıdır; onay ve yayımlama süresi on iş günü değil, yedi iş günüdür.
      C: III numaralı ifade md. 8/4'e aykırıdır; talebi geri alma süresi beş iş günü değil, iki iş günüdür.
      D: II numaralı ifade md. 8/3'e aykırıdır (süre yedi iş günüdür); bu nedenle I ve II birlikte doğru değildir.
      E: II ve III numaralı ifadelerin ikisi de süre bakımından yanlıştır (yedi iş günü ve iki iş günü); doğru olan
        I numaralı ifade ise bu şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/1
    alinti: (1) İzahname ile kamuya açıklanan bilgilerde, satışa başlamadan önce veya satış süresi içinde yatırımcıların
      yatırım kararını etkileyebilecek değişiklik veya yeni hususların ortaya çıkması hâlinde durum ihraççı veya
      halka arz eden tarafından en uygun haberleşme vasıtasıyla derhâl Kurula bildirilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/3
    alinti: (3) Değiştirilecek veya yeni eklenecek hususlar bildirim tarihinden itibaren yedi iş günü içinde 6 ncı
      maddede yer alan esaslar çerçevesinde onaylanır ve 7 nci maddede belirtilen şekilde yayımlanır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/4
    alinti: (4) Değişiklik veya yeni hususların yayımlanmasından önce sermaye piyasası araçlarını satın almak için
      talepte bulunmuş olan yatırımcılar, izahnamede yapılan ek ve değişikliklerin yayımlanmasından itibaren iki
      iş günü içinde taleplerini geri alma hakkına sahiptirler.
