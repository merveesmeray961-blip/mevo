  aciklama:
    dogru_neden: 'II-5.2 md. 11/1 uyarınca halka açık ortaklıkların halka arz edilmeksizin gerçekleştireceği sermaye artırımı
      nedeniyle ihraç edilen payların satışına ihraç belgesinin ilan edildiği tarihi takip eden on iş günü içinde başlanması
      ve satışın azami on iş günü içinde tamamlanması zorunludur. En geç 10 + 10 = 20 iş günü içinde satış sona erer. Püf
      noktaları: İki sürenin toplamı sorulmaktadır; yalnızca birini almak hatalıdır.'
