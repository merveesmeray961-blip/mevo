  kok: Sabit fiyatla talep toplama yöntemiyle yapılan bir halka arzda izahnamede oransal dağıtım yöntemi öngörülmüştür. Bireysel
    gruba 100.000 lot tahsis edilmiş, gruba gelen toplam talep 250.000 lottur. Yatırımcı Z 30.000 lot talep etmiştir. Sermaye
    Piyasası Araçlarının Satışı Tebliği (II-5.2) md. 20/3'e göre Z'ye kaç lot dağıtılır?
  secenekler:
    A: 1.200 lot
    B: 12.000 lot
    C: 15.000 lot
    D: 18.000 lot
    E: 120.000 lot
