- id: SMMM-SPK-IZA-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: izahnamede değişiklik — Kurula bildirim, onay süresi ve talebin geri alınması
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre, izahname ile kamuya açıklanan bilgilerde satış süresi içinde yatırımcıların
    yatırım kararını etkileyebilecek değişiklik veya yeni hususlar ortaya çıkması hâline ilişkin aşağıdaki ifadelerden hangileri
    doğrudur?


    I. Durum, ihraççı veya halka arz eden tarafından en uygun haberleşme vasıtasıyla derhâl Kurula bildirilir.


    II. Değiştirilecek veya yeni eklenecek hususlar, bildirim tarihinden itibaren on iş günü içinde onaylanır ve yayımlanır.


    III. Değişiklik veya yeni hususların yayımlanmasından önce satın alma talebinde bulunmuş yatırımcılar, yayımlanmasından
    itibaren beş iş günü içinde taleplerini geri alma hakkına sahiptir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve II
    E: II ve III
  dogru: A
  aciklama:
    dogru_neden: 'I numaralı ifade md. 8/1''e uygundur. II numaralı ifade yanlıştır: md. 8/3''e göre değiştirilecek veya yeni
      eklenecek hususlar bildirim tarihinden itibaren yedi iş günü içinde onaylanır ve yayımlanır. III numaralı ifade de yanlıştır:
      md. 8/4''e göre yatırımcılar, ek ve değişikliklerin yayımlanmasından itibaren iki iş günü içinde taleplerini geri alma
      hakkına sahiptir. Doğru ifade yalnız I''dir.'
    celdiriciler:
      B: II numaralı ifade md. 8/3'e aykırıdır; onay ve yayımlama süresi on iş günü değil, yedi iş günüdür.
      C: III numaralı ifade md. 8/4'e aykırıdır; talebi geri alma süresi beş iş günü değil, iki iş günüdür.
      D: II numaralı ifade md. 8/3'e aykırıdır (süre yedi iş günüdür); bu nedenle I ve II birlikte doğru değildir.
      E: II ve III numaralı ifadelerin ikisi de süre bakımından yanlıştır (yedi iş günü ve iki iş günü); doğru olan I numaralı
        ifade ise bu şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/1
    alinti: (1) İzahname ile kamuya açıklanan bilgilerde, satışa başlamadan önce veya satış süresi içinde yatırımcıların yatırım
      kararını etkileyebilecek değişiklik veya yeni hususların ortaya çıkması hâlinde durum ihraççı veya halka arz eden tarafından
      en uygun haberleşme vasıtasıyla derhâl Kurula bildirilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/3
    alinti: (3) Değiştirilecek veya yeni eklenecek hususlar bildirim tarihinden itibaren yedi iş günü içinde 6 ncı maddede
      yer alan esaslar çerçevesinde onaylanır ve 7 nci maddede belirtilen şekilde yayımlanır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 8/4
    alinti: (4) Değişiklik veya yeni hususların yayımlanmasından önce sermaye piyasası araçlarını satın almak için talepte
      bulunmuş olan yatırımcılar, izahnamede yapılan ek ve değişikliklerin yayımlanmasından itibaren iki iş günü içinde taleplerini
      geri alma hakkına sahiptirler.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): A (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Hata yok; I md. 8/1 ile birebir, II (yedi iş günü) ve III (iki iş günü) yanlış; tek doğru şık A.
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: SPKn md. 8/1, 8/3, 8/4 alıntıları birebir.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday yanlış (E, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
