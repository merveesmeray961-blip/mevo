    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: II numaralı öncülden "iki yüz elli bin TL" tutarı çıkarıldı ("Tebliğde belirlenen tutar")
      ve bozuk cümle yapısı düzeltildi; dogru_neden''e tutarların yıllık yeniden değerlendiği ve 2026 tutarları
      (9.500.000 TL / 142.500.000 TL) eklendi; kaynaklara SPK 68/2461 sayılı Karar eklendi; B çeldirici atfı düzeltildi;
      gecerlilik.baslangic 2026-10-03 → 2026-01-01; surum 1 → 2.'
    neden: 'G5/G6: 250.000 TL Tebliğin 22/7/2013 tarihli ilk metnindeki tutardır; SPK yeniden değerleme tablosuna
      göre 2026 için birim nominal eşiği 9.500.000 TL''dir, bu yüzden 2026''da "en az 250.000 TL" diyen öncül yanlış
      hâle geliyordu. 2026-10-03 yalnızca metnin indirildiği tarihtir: Tebliğ RG 22/6/2013''te yayımlanmış, md.
      34 uyarınca bir ay sonra (22/7/2013) yürürlüğe girmiş; md. 6''da sonradan değişiklik yoktur. 2026 tutarları
      1/1/2026''dan itibaren uygulanır. "md. 6/4''ün (b) bendi" yanlış atıftı; (b) bendi md. 6/1''dedir.'
