- id: SMMM-SPK-IZA-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: muafiyetler
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'İzahname ve İhraç Belgesi Tebliği (II-5.1)''ne göre izahname hazırlama yükümlülüğüne ilişkin aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Sermaye piyasası araçlarının sadece nitelikli yatırımcılara satışında izahname hazırlanmaz.


    II. Birim nominal değeri en az iki yüz elli bin TL olan sermaye piyasası araçlarının halka arzında izahname
    hazırlama yükümlülüğünden muaf olarak ihraç edilen bu araçlar halka arz edilerek yeniden satışa sunulması izahname
    hazırlanmasını gerektirmez.


    III. Tahsisli satış yoluyla ihraç edilen sermaye piyasası araçları halka arz edilerek yeniden satışa sunulursa
    izahname hazırlanması zorunludur.


    IV. Payların ilk halka arzı da dâhil olmak üzere, toplam satış bedeli Tebliğde belirlenen limitin altında kalan
    halka arzlarda ihraççı, Kurul kararı ve duyuru metni gerekmeksizin kendiliğinden izahname hazırlama yükümlülüğünden
    muaf olur.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I numaralı ifade md. 6/2 (a)''ya, III numaralı ifade md. 6/2 (b) ile md. 6/4''e uygundur. II numaralı
      ifade de doğrudur: md. 6/4 yeniden satışta izahname zorunluluğunu getirir, ancak md. 6/1 (b) (birim nominal
      değeri en az iki yüz elli bin TL olan araçlar) bu zorunluluğun dışında tutulmuştur. IV numaralı ifade yanlıştır:
      md. 6/3''e göre payların ilk halka arzı hariç tutulmuştur, ayrıca muafiyet ihraççının talebi üzerine Kurulca
      getirilebilir ve duyuru metninin ilanı şarttır.


      Püf noktaları: md. 6/1, 6/2, 6/3 ve 6/4 birlikte okunmalıdır. Genel kural (md. 6/4): muaf ya da izahname gerektirmeyen
      ihraçlarda çıkarılan araçlar halka arz edilerek yeniden satışa sunulursa izahname zorunludur; bunun istisnası
      md. 6/1 (b) bendidir. Küçük tutarlı halka arz muafiyeti kendiliğinden işlemez, talebe bağlıdır ve ilk halka
      arzı kapsamaz. Tuzak: yeniden satış kuralının (b) bendi hariç olduğunu unutmak ya da küçük tutar muafiyetini
      otomatik sanmak.'
    celdiriciler:
      A: I ve II doğrudur; ancak III numaralı ifade de md. 6/2 (b) ve 6/4'e uygun olduğundan seçenek eksiktir.
      B: I ve III doğrudur; ancak II numaralı ifade de md. 6/4'ün (b) bendi istisnasına uygun olduğundan seçenek
        eksiktir.
      D: IV numaralı ifade md. 6/3'e aykırıdır (ilk halka arz hariçtir; muafiyet talebe bağlıdır ve duyuru metni
        şarttır); ayrıca doğru olan I seçenekte yer almamıştır.
      E: IV numaralı ifade md. 6/3'e aykırı olduğundan dört ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/1 (b) ve 6/2 (a), (b)
    alinti: (1) ... b) Birim nominal değeri en az iki yüzelli bin TL olan sermaye piyasası araçlarının halka arzında,
      ... ihraççı veya halka arz eden izahname hazırlama yükümlülüğünden muaftır. (2) a) Sermaye piyasası araçlarının
      sadece nitelikli yatırımcılara satışında, b) Sermaye piyasası araçlarının tahsisli satışında, ... izahname
      hazırlanmaz.
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/3
    alinti: (3) Payların ilk halka arzı hariç olmak üzere, ihraççıların halka arz ettikleri sermaye piyasası aracının
      toplam satış bedelinin beş milyon TL’nin altında olması durumunda, kamuyu aydınlatma amacıyla, gerekli bilgileri
      içeren ve standardı Kurulca belirlenen duyuru metninin ilan edilmesi şartıyla, ihraççıların talebi üzerine
      Kurulca izahname hazırlama yükümlülüğünden muafiyet getirilebilir.
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/4
    alinti: (4) Bu maddenin birinci fıkrasının (b) bendi hariç olmak üzere, izahname hazırlama yükümlülüğünden muaf
      olarak veya izahname hazırlanmasını gerektirmeyen durumlarda ihraç edilen sermaye piyasası araçlarının, halka
      arz edilerek yeniden satışa sunulması halinde izahname hazırlanması zorunludur.
