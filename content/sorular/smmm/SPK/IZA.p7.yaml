- id: SMMM-SPK-IZA-0005
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: muafiyetler
  tip: kavrama
  zorluk: 3
  kok: Aşağıdaki halka arz senaryolarından hangisinde izahname hazırlama yükümlülüğünden muafiyet, verilen koşulların tamamı
    dikkate alındığında doğru şekilde belirtilmiştir?
  secenekler:
    A: Her halka arzda yatırımcı başına 200.000 TL değerinde sermaye piyasası aracı alınması yeterlidir.
    B: Nitelikli yatırımcılara satılmak üzere ihraç edilen sermaye piyasası araçlarının borsada nitelikli yatırımcılar arasında
      işlem görmesi durumunda ihraççı izahname hazırlamaktan muaftır.
    C: Sermaye piyasası araçlarının yalnız nitelikli yatırımcılara satılması hâlinde her durumda md. 6/1 kapsamındaki izahname
      muafiyeti uygulanır.
    D: Birim nominal değeri 200.000 TL olan sermaye piyasası araçlarının halka arzı, tutar ne olursa olsun muafiyet sağlar.
    E: Birleşme nedeniyle çıkarılan araçlarda duyuru metni aranmaksızın her durumda izahname muafiyeti uygulanır.
  dogru: B
  aciklama:
    dogru_neden: 'II-5.1 Tebliği md. 6/1-c, nitelikli yatırımcılara satılmak üzere ihraç edilen sermaye piyasası araçlarının
      borsada nitelikli yatırımcılar arasında işlem görmesi durumunda izahname hazırlama yükümlülüğünden muafiyet öngörür.
      Püf noktaları: Yalnız nitelikli yatırımcılara satış ile borsada nitelikli yatırımcılar arasında işlem görme aynı düzenleme
      değildir; ayrıca 250.000 TL eşikleri md. 6/1-a ve b''de yer alır.'
    celdiriciler:
      A: Kaynakta eşik 200.000 TL değil 250.000 TL'dir.
      C: Yalnız nitelikli yatırımcılara satış md. 6/2-a'da izahname hazırlama gerektirmeyen durumlardan biri olarak düzenlenir;
        md. 6/1-c'deki muafiyet için borsada nitelikli yatırımcılar arasında işlem görme koşulu vardır.
      D: Birim nominal değer eşiği 250.000 TL'dir.
      E: Birleşme, devir, bölünme veya pay değişimi kapsamında md. 6/1-ç'deki duyuru metni şartı bulunur; 'her durumda' ifadesi
        yanlıştır.
  kaynaklar:
  - mevzuat: İzahname ve İhraç Belgesinin Hazırlanmasına İlişkin Genel Esaslar ile İzahname Hazırlanması ile İlgili Muafiyetler
      Tebliği (II-5.1)
    madde: md. 6/1-a-c
    alinti: "MADDE 6 – (1) a) Her halka arz için ayrı ayrı olmak üzere yatırımcı başına en az iki yüzelli bin TL değerinde\
      \ sermaye piyasası aracı alan yatırımcılara yönelik\nyapılan halka arzlarda,\n       b) Birim nominal değeri en az iki\
      \ yüzelli bin TL olan sermaye piyasası araçlarının halka arzında,\n       c) Nitelikli yatırımcılara satılmak üzere\
      \ ihraç edilen sermaye piyasası araçlarının borsada nitelikli yatırımcılar arasında işlem görmesi durumunda,"
  - mevzuat: İzahname ve İhraç Belgesinin Hazırlanmasına İlişkin Genel Esaslar ile İzahname Hazırlanması ile İlgili Muafiyetler
      Tebliği (II-5.1)
    madde: md. 6/2-a
    alinti: (2) a) Sermaye piyasası araçlarının sadece nitelikli yatırımcılara satışında,
  - mevzuat: İzahname ve İhraç Belgesinin Hazırlanmasına İlişkin Genel Esaslar ile İzahname Hazırlanması ile İlgili Muafiyetler
