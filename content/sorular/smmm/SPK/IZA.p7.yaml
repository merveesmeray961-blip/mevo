- id: SMMM-SPK-IZA-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: izahnameden sorumluluk
  tip: kavrama
  zorluk: 2
  kok: Bir halka arzda izahnamede yer alan yanlış ve yanıltıcı bilgiler nedeniyle yatırımcı zarara uğramıştır. İhraççının
    zararı tazmin edemediği de açıkça ortaya çıkmıştır. 6362 sayılı Sermaye Piyasası Kanunu'na göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: İhraççı sorumluluktan tamamen çıkar; yalnızca halka arz eden sorumlu olur.
    B: Halka arz eden, lider aracı kurum, varsa garantör ve yönetim kurulu üyeleri, kusur ve durumun gereklerine göre zarar
      kendilerine yükletilebildiği ölçüde sorumlu olabilir.
    C: Yalnızca bağımsız denetim kuruluşu sorumludur.
    D: Yönetim kurulu üyeleri kusurları aranmaksızın her durumda sınırsız sorumludur.
    E: Garantör varsa ihraççının sorumluluğu kendiliğinden sona erer.
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 10/1'e göre yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan öncelikle ihraççılar
      sorumludur; zarar ihraççıdan tazmin edilemez veya edilemeyeceği açıkça belli olursa sayılan diğer kişiler kusur ve durumun
      gereklerine göre sorumlu olabilir.
    celdiriciler:
      A: İhraççının ilk derece sorumluluğu ortadan kalkmaz; md. 10/1 sorumluluğu ihraççıya yükler.
      C: Md. 10/2 rapor hazırlayan bağımsız denetim, derecelendirme ve değerleme kuruluşlarının kendi raporlarındaki bilgiler
        bakımından sorumluluğunu düzenler; tek sorumlu bunlar değildir.
      D: Yönetim kurulu üyeleri ancak kusur ve durumun gereklerine göre zarar kendilerine yükletilebildiği ölçüde sorumludur.
      E: Garantörün sorumluluğunun doğabilmesi ihraççının sorumluluğunu kendiliğinden ortadan kaldırmaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
