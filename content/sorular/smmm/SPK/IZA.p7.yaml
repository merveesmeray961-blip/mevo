  kok: 'İhraççı A, sermaye piyasası araçlarını halka arz etmeyi planlamaktadır. Aşağıdaki durumlardan hangileri Tebliğdeki
    izahname hazırlama muafiyeti veya izahname hazırlamama hâlleri kapsamındadır?


    I. Birim nominal değeri en az 250.000 TL olan araçların halka arzı.

    II. Payların ilk halka arzı hariç olmak üzere toplam satış bedelinin 4 milyon TL olması.

    III. Araçların yalnızca nitelikli yatırımcılara satılması.

    IV. Nitelikli yatırımcılara satılmak üzere ihraç edilen araçların borsada yalnızca nitelikli yatırımcılar arasında işlem
    görmesi.'
  secenekler:
    A: Yalnız I ve II
    B: I, II ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'II numaralı durum, Tebliğin 6 ncı maddesinin üçüncü fıkrasındaki 5 milyon TL sınırı bakımından ayrıca Kurulca
      muafiyet getirilebilmesini ifade eder; otomatik muafiyet değildir ve ilk halka arzlar kapsam dışıdır. I, III ve IV ise
      6 ncı maddede doğrudan düzenlenen hâllerdir. Püf noktaları: 5 milyon TL eşiği ile doğrudan muafiyet hâllerini birbirinden
      ayırın.'
    celdiriciler:
      A: II numaralı durum otomatik muafiyet sağlamaz; üçüncü fıkrada Kurulca muafiyet getirilebilmesi düzenlenmiştir.
      B: II numaralı durum otomatik muafiyet sayıldığı için seçenek fazladan bir durumu doğru kabul etmektedir.
      D: I numaralı durum 6 ncı maddenin birinci fıkrasının (b) bendinde doğrudan muafiyet kapsamındadır.
      E: II numaralı durum otomatik muafiyet olmadığından dört durumun tamamı doğru değildir.
  kaynaklar:
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/1-b ve 6/1-c
    alinti: "yapılan halka arzlarda,\n       b) Birim nominal değeri en az iki yüzelli bin TL olan sermaye piyasası araçlarının\
      \ halka arzında,\n       c) Nitelikli yatırımcılara satılmak üzere ihraç edilen sermaye piyasası araçlarının borsada\
      \ nitelikli yatırımcılar arasında işlem görmesi durumunda,\n"
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/2-a
    alinti: "        (2) a) Sermaye piyasası araçlarının sadece nitelikli yatırımcılara satışında,\n        b) Sermaye piyasası\
      \ araçlarının tahsisli satışında,\n        c) Bir ortaklığın sermayesini değiştirmeyecek şekilde kupür, tertip, pay\
      \ birleştirilmesine veya bölünmesine konu paylar olması durumunda,"
