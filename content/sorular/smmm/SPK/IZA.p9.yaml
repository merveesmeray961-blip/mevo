- id: SMMM-SPK-IZA-0018
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: satış yöntemleri
  tip: uygulama
  zorluk: 3
  kok: Bir ihraççı, halka arz edilmeksizin satışa konu edilecek payların bir kısmını mevcut ortakların mevcut payları olarak,
    diğer kısmını ise sermaye artırımıyla çıkarılan yeni paylar olarak satmayı planlamaktadır. Sermaye Piyasası Araçlarının
    Satışı Tebliği'nin kapsamı bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Her iki satış da Tebliğ kapsamındadır; halka arz edilmeyen paylar için istisna yoktur.
    B: Yalnız mevcut ortakların paylarının satışı Tebliğ kapsamındadır.
    C: Her iki satış da, halka arz edilmeksizin yapıldıkları için Tebliğ hükümlerine tabi değildir.
    D: Halka açık olmayan ortaklıkların mevcut paylarının halka arz edilmeksizin satışı Tebliğ dışında kalır; ancak bu, halka
      arz edilmeksizin yapılan her sermaye artırımı satışının otomatik olarak kapsam dışında olduğu anlamına gelmez.
    E: Tebliğ yalnız borsada işlem gören payların satışına uygulanır.
  dogru: D
  aciklama:
    dogru_neden: 'Sermaye Piyasası Araçlarının Satışı Tebliği md. 2/2, halka açık olmayan ortaklıkların ortaklarının mevcut
      paylarının veya bu ortaklıklarca sermaye artırımı yoluyla çıkarılacak payların halka arz edilmeksizin satışını Tebliğ
      kapsamı dışında bırakır. Püf noktaları: İstisnanın öznesi halka açık olmayan ortaklıktır; hükmü bütün ihraççılara genellememek
      gerekir.'
    celdiriciler:
      A: Tebliğ md. 2/2 açıkça kapsam dışında kalan satışları sayar.
      B: İstisna yalnız mevcut paylarla sınırlı değildir; sermaye artırımıyla çıkarılacak paylar da sayılmıştır.
      C: Sonuç doğruya yakın olsa da istisnanın yalnız halka açık olmayan ortaklıklar için olduğu göz ardı edilmiştir.
      E: Tebliğin kapsamı yalnız borsada işlem gören paylarla sınırlanmamıştır.
  kaynaklar:
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 2/2
    alinti: Yatırım fonu ile emeklilik yatırım fonu katılma payları ve değişken sermayeli yatırım ortaklığı paylarının ihracı
      ile halka açık olmayan ortaklıkların ortaklarının mevcut paylarının veya bu ortaklıklarca sermaye artırımı yoluyla çıkarılacak
