- id: SMMM-SPK-IZA-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: izahnameden sorumluluk
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre, izahnamede yer alan yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan
    zararın ihraççıdan tazmin edilememesi veya edilemeyeceğinin açıkça belli olması hâlinde, kusurlarına ve durumun
    gereklerine göre zararlar kendilerine yükletilebildiği ölçüde sorumlu olacaklar arasında aşağıdakilerden hangisi
    **sayılmamıştır**?
  secenekler:
    A: Halka arz edenler
    B: İhraççının genel müdürü
    C: İhraca aracılık eden lider aracı kurum
    D: Varsa garantör
    E: İhraççının yönetim kurulu üyeleri
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 10/1'e göre izahnamedeki yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan
      öncelikle ihraççılar sorumludur. Zararın ihraççıdan tazmin edilememesi veya edilemeyeceğinin açıkça belli
      olması hâlinde halka arz edenler, ihraca aracılık eden lider aracı kurum, varsa garantör ve ihraççının yönetim
      kurulu üyeleri kusurlarına ve durumun gereklerine göre sorumludur. İhraççı bünyesinden bu sayımda yer alanlar
      yönetim kurulu üyeleridir; genel müdür sayılmamıştır. Tuzak, yönetim kurulu üyeleri ile genel müdür gibi yakın
      kavramların ayırt edilmesindedir.
    celdiriciler:
      A: Halka arz edenler md. 10/1'in ikinci cümlesinde açıkça sayılmıştır.
      C: İhraca aracılık eden lider aracı kurum md. 10/1'in ikinci cümlesinde açıkça sayılmıştır.
      D: Varsa garantör md. 10/1'in ikinci cümlesinde açıkça sayılmıştır.
      E: İhraççının yönetim kurulu üyeleri md. 10/1'in ikinci cümlesinde açıkça sayılmıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 10/1
    alinti: İzahnamede yer alan yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan ihraççılar sorumludur.
      Zararın söz konusu kişilerden tazmin edilememesi veya edilemeyeceğinin açıkça belli olması hâlinde; halka
      arz edenler, ihraca aracılık eden lider aracı kurum, varsa garantör ve ihraççının yönetim kurulu üyeleri kusurlarına
      ve durumun gereklerine göre zararlar kendilerine yükletilebildiği ölçüde sorumludur.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: B şıkkı (doğru) 'Lider olmayan konsorsiyum üyesi aracı kurumlar' → 'İhraççının genel müdürü'; dogru_neden
      buna göre güncellendi. md. 10/2 kapsamındaki rapor hazırlayanlardan kaçınıldı.
    neden: 'G5 (küçük): doğru şık B, C şıkkıyla ''lider / lider olmayan'' biçiminde ikiz olduğundan cevabı ele veriyordu.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: Zorluk 3 → 2.
    neden: 'G5 (küçük): §7 zor soru için en az iki teknik ister; soruda yalnız yakın kavram ayrımı (yönetim kurulu
      üyeleri / genel müdür) var, tek hüküm ve tek tuzaktan oluşan bu yapı orta (2) düzeyin tanımına uyar.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
