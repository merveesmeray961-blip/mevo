    kredisi borcu 110 milyon TL, finansal kiralama işlemlerinden doğan borcu 40 milyon TL ve gayri nakdi kredileri 25 milyon
    TL'dir. Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1) md. 31/1'deki sınır esas alındığında ortaklık
    ilave olarak en fazla kaç milyon TL kredi kullanabilir?
