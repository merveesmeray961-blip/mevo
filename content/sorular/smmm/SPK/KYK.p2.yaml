- id: SMMM-SPK-KYK-0055
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım fonları
  tip: hesaplama
  zorluk: 3
  kok: 'Toplam değeri 150.000.000 TL olan bir yatırım fonunun portföyünde, her biri fon toplam değerinin %5''inden fazla olmak
    üzere dört ihraççının araçları bulunmaktadır: A ihraççısı 15.000.000 TL, B ihraççısı 13.500.000 TL, C ihraççısı 12.000.000
    TL ve D ihraççısı 9.000.000 TL. Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1) md. 17/1-a ve 17/1-b sınırları dikkate
    alınacak, başka sınırlama dikkate alınmayacaktır. Fon, yeni bir E ihraççısına toplam değerin %5''inden fazla yatırım yapmak
    isterse E''ye en fazla kaç TL yatırabilir?'
  secenekler:
    A: 7.500.000 TL
    B: 10.500.000 TL
    C: 15.000.000 TL
    D: 49.500.000 TL
    E: 150.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'III-52.1 md. 17/1-b uyarınca fon toplam değerinin %5''inden fazla yatırım yapılan ihraççıların araçlarının
      toplam değeri fon toplam değerinin %40''ını aşamaz: 150.000.000 x %40 = 60.000.000 TL. A, B, C ve D''ye yapılmış yatırımların
      toplamı 49.500.000 TL olduğundan E için kalan hak 60.000.000 - 49.500.000 = 10.500.000 TL''dir. Md. 17/1-a uyarınca
      tek ihraççı sınırı %10, yani 15.000.000 TL''dir; bağlayıcı olan daha düşük tutar 10.500.000 TL''dir. Püf noktaları:
      İki sınırdan küçük olanı alınır; %5 eşiği (7.500.000 TL) sınır değil, %40 kuralının devreye girdiği eşiktir.'
    hesap_adimlari:
    - Toplam sınır = 150.000.000 x 0,40 = 60.000.000 TL
    - Mevcut toplam = 15.000.000 + 13.500.000 + 12.000.000 + 9.000.000 = 49.500.000 TL
    - Kalan hak = 60.000.000 - 49.500.000 = 10.500.000 TL
    - Tek ihraççı sınırı = 150.000.000 x 0,10 = 15.000.000 TL
    - E için azami tutar = min(10.500.000; 15.000.000) = 10.500.000 TL
    celdiriciler:
      A: 7.500.000 TL, toplam değerin %5'idir; bu tutar sınır değil, %40 toplam sınırının uygulanmaya başladığı eşiktir.
      C: 15.000.000 TL yalnızca %10 tek ihraççı sınırını gösterir; %40 toplam sınırından kalan hak daha düşüktür.
      D: 49.500.000 TL mevcut yatırımların toplamıdır; E için kalan hak değildir.
      E: 150.000.000 TL fonun toplam değeridir; sınırlar bu tutarı yatırıma açmaz.
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 17/1-a
    alinti: a) Fonun toplam değerinin %10’undan fazlası bir ihraççının para ve sermaye piyasası araçlarına ve bu araçlara
      dayalı türev araçlara yatırılamaz.
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 17/1-b
    alinti: b) Fon toplam değerinin %5’inden fazla yatırım yapılan ihraççıların para ve sermaye piyasası araçlarının toplam
      değeri fon toplam değerinin %40’ını aşamaz.
