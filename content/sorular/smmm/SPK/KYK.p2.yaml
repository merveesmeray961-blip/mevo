    madde: md. 11/2
    alinti: Şu kadar ki, bir şemsiye fona bağlı olarak oluşturulacak ilk fonun katılma payı ihracı başvurusunun içtüzüğün
      tescilinden itibaren en geç üç ay içinde yapılması zorunludur. Bu süre içinde Kurula başvuru yapılmaması durumunda,
      içtüzük kurucu tarafından ticaret sicilinden terkin ettirilir.
