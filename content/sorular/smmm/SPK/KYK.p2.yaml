  aciklama:
    dogru_neden: 'III-52.1 md. 11/2 uyarınca bir şemsiye fona bağlı ilk fonun katılma payı ihracı başvurusu içtüzüğün tescilinden
      itibaren en geç üç ay içinde yapılmalıdır; Kurulca uygun görülecek makul gerekçelerin varlığı hâlinde bu süre bir defaya
      mahsus olmak üzere üç ay daha uzatılabilir. Toplam süre 3 + 3 = 6 aydır. Püf noktaları: Uzatma süresi asıl sürenin üzerine
      eklenir, yenilenmez; uzatma yalnızca bir defa yapılabilir. Süre aşılırsa içtüzük kurucu tarafından ticaret sicilinden
      terkin ettirilir.'
    celdiriciler:
      A: Üç ay yalnızca asıl süredir; Kurulca uygun görülen makul gerekçe hâlinde üç ay daha uzatılabilir.
      C: Dokuz ay, ek sürenin birden fazla kez verilmesiyle bulunur; uzatma yalnızca bir defaya mahsustur.
      D: Oniki ay, md. 11/2'de öngörülen bir süre değildir.
      E: On beş ay, md. 11/2'de öngörülen bir süre değildir.
