      50.000.000 TL, tek banka sınırı 200.000.000 x %10 = 20.000.000 TL''dir. Toplam sınırdan kalan 50.000.000 - 20.000.000
      = 30.000.000 TL, Y bankası sınırından kalan ise 20.000.000 - 7.000.000 = 13.000.000 TL''dir; bağlayıcı olan küçük tutar
      13.000.000 TL''dir. Püf noktaları: Standart fonlardaki %10 ve %3 oranları katılım fonlarında %25 ve %10 olarak uygulanır;
      iki sınırdan kalan hak ayrı ayrı bulunup küçüğü alınır.'
    hesap_adimlari:
    - Toplam sınır = 200.000.000 x 0,25 = 50.000.000 TL; kalan = 50.000.000 - 20.000.000 = 30.000.000 TL
    - Tek banka sınırı = 200.000.000 x 0,10 = 20.000.000 TL; kalan = 20.000.000 - 7.000.000 = 13.000.000 TL
    - İlave azami tutar = min(30.000.000; 13.000.000) = 13.000.000 TL
    celdiriciler:
      A: Bir basamak kayması ile yazılmış bir tutardır; hiçbir sınırdan bu sonuç çıkmaz.
      B: Standart fonlardaki %3 tek banka sınırı (6.000.000 TL) uygulanmıştır; katılım fonlarında bu oran %10'dur ve mevcut
        tutar da düşülmelidir.
      D: Toplam sınırdan kalan hakkı gösterir (50.000.000 - 20.000.000); tek banka sınırı dikkate alınmamıştır.
      E: Sonuç bir basamak kaydırılarak yazılmıştır; hiçbir sınırdan bu tutar çıkmaz.
