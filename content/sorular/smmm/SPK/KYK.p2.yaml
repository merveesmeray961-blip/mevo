      saklayıcının yönetici olmayan bir ortağının PYŞ''de ortak olması fıkrada yasaklanmamıştır. Püf noktaları: Yasak kişi
      düzeyindedir ve yönetici, temsilci ya da ilzama yetkili sıfatına bağlıdır; salt ortaklık sıfatı saklayıcı tarafında
      yasak kapsamında sayılmamıştır.'
    celdiriciler:
      A: Saklayıcının yöneticisinin PYŞ'de ortak, yönetici ya da temsilci olması md. 56/7'de açıkça yasaklanmıştır.
