- id: SMMM-SPK-KYK-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım fonları — kuruluş, tüzel kişilik ve sicil işlemleri
  tip: bilgi
  zorluk: 2
  soru_bicimi: standart
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre yatırım fonlarına ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yatırım fonu tüzel kişiliği bulunmayan bir mal varlığıdır; sicil işlemleriyle sınırlı olarak tüzel kişiliği
      haiz addolunur ve portföyündeki taşınmazlar tapu kütüğüne fon adına tescil edilir.
    B: Yatırım fonu kuruluş başvuruları, gerekli belgelerin Kurula eksiksiz olarak sunulmasından itibaren altı ay
      içinde Kurul tarafından karara bağlanır ve durum ilgililere bildirilir.
    C: Tapuda ve ticaret sicilinde fon adına yapılacak işlemler, portföy yönetim şirketinin yetkilisinin tek başına
      imzasıyla gerçekleştirilir.
    D: Yatırım fonu, portföy yönetim şirketi tarafından kurulan ve kendi tüzel kişiliği bulunan bir anonim ortaklıktır;
      portföyündeki taşınmazlar tapu kütüğüne portföy yönetim şirketi adına tescil edilir.
    E: Yatırım fonlarının kuruluş izni alabilmesi için fon iç tüzüğünün Kurulca onaylanması yeterlidir; portföy
      saklama hizmetini yürütecek kuruluşla anlaşma, izin alındıktan sonra yapılabilir.
  dogru: A
  aciklama:
    dogru_neden: Md. 52/1'e göre yatırım fonu, portföy yönetim şirketleri tarafından fon iç tüzüğü ile kurulan ve
      tüzel kişiliği bulunmayan mal varlığıdır. Md. 52/5'e göre fon, her türlü sicil işlemleri ile limited ve anonim
      şirketlerin ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz addolunur ve portföyünde bulunan
      taşınmazlar tapu kütüğüne fon adına tescil edilir.
    celdiriciler:
      B: Yatırım fonu kuruluş başvuruları iki ay içinde karara bağlanır (md. 52/2); altı ay, portföy yönetim şirketi
        kuruluş başvuruları için öngörülen süredir (md. 55/1).
      C: Tapuda, ticaret sicilinde ve diğer resmî sicillerde fon adına yapılacak işlemler, portföy yönetim şirketi
        ile portföy saklama hizmetini yürüten kuruluşu temsil eden birer yetkilinin müşterek imzalarıyla gerçekleştirilir
        (md. 52/5).
      D: Yatırım fonu anonim ortaklık değil, tüzel kişiliği bulunmayan mal varlığıdır (md. 52/1); taşınmazlar fon
        adına tescil edilir (md. 52/5). Anonim ortaklık olan yatırım ortaklığıdır (md. 48/1).
      E: Kuruluş izni için kurucunun portföy saklama hizmetini yürütmek üzere Kurulca yetkilendirilmiş bir kuruluşla
        anlaşmış olması ve fon iç tüzüğünün Kurulca onaylanması birlikte gereklidir (md. 52/2).
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 52/1
    alinti: (1) Bu Kanun hükümleri uyarınca tasarruf sahiplerinden fon katılma payı karşılığında toplanan para ya
      da diğer varlıklarla, tasarruf sahipleri hesabına, inançlı mülkiyet esaslarına göre Kurulca belirlenen varlık
      ve haklardan oluşan portföy veya portföyleri işletmek amacıyla portföy yönetim şirketleri tarafından fon iç
      tüzüğü ile kurulan ve tüzel kişiliği bulunmayan mal varlığına yatırım fonu adı verilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 52/2
    alinti: (2) Yatırım fonlarının kuruluş izni alabilmesi için, kurucunun portföy saklama hizmetini yürütmek üzere
      Kurulca yetkilendirilmiş bir kuruluş ile anlaşmış olması ve fon iç tüzüğünün Kurulca onaylanması gereklidir.
      Yatırım fonu kuruluş başvuruları, gerekli belgelerin Kurula eksiksiz olarak sunulmasından itibaren iki ay
      içinde Kurul tarafından karara bağlanır ve keyfiyet ilgililere bildirilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 52/5 (birinci cümle)
    alinti: Fon; tapu ve diğer resmî sicillere tescil, değişiklik, terkin ve düzeltme talepleri dâhil olmak üzere
      her türlü sicil işlemleri ile ortağı olacağı limited ve anonim şirketlerin kuruluş, sermaye artırımı veya
      pay devri işlemleri dâhil her tür ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz addolunur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 52/5 (ikinci ve üçüncü cümle)
    alinti: Yatırım fonu portföyünde bulunan taşınmazlar, taşınmaza dayalı haklar ve taşınmaza dayalı senetler tapu
      kütüğüne fon adına tescil edilir. Tapuda, ticaret sicilinde ve diğer resmî sicillerde fon adına yapılacak
      işlemler, portföy yönetim şirketi ile portföy saklama hizmetini yürüten kuruluşu temsil eden birer yetkilinin
      müşterek imzalarıyla gerçekleştirilir.
