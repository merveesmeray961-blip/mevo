    C: Portföy yönetim şirketinin ortağının, saklama hizmetini yürüten kuruluşta yönetici olması
    D: Saklama hizmetini yürüten kuruluşun yönetici olmayan bir ortağının, portföy yönetim şirketinde ortak olması
    E: Portföy yönetim şirketini temsil ve ilzama yetkili kişinin, saklayıcıda temsilci olması
