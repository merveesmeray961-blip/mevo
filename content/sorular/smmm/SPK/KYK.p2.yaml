      şartıyla kredi almak, türev araç, açığa satış ve benzeri işlemler haricinde teminat gösterilemez ve rehnedilemez (I
      doğru). Aynı fıkra kamu alacakları için dahi haczi yasaklar (II yanlış); md. 53/3 uyarınca tasfiyede yalnızca katılma
      payı sahiplerine ödeme yapılabilir (III yanlış). Püf noktaları: Teminat yasağının istisnası vardır, haciz yasağının
      ise kamu alacağı dahil istisnası yoktur; tasfiye ödemesi yalnız katılma payı sahiplerine yapılır.'
    celdiriciler:
      B: II yanlıştır; kamu alacaklarının tahsili amacıyla dahi haciz konulamaz.
      C: III yanlıştır; tasfiyede yalnızca katılma payı sahiplerine ödeme yapılabilir.
      D: II ve III yanlıştır; ayrıca doğru olan I dışarıda bırakılmıştır.
      E: II ve III yanlış olduğundan üç öncülün hepsi doğru değildir.
