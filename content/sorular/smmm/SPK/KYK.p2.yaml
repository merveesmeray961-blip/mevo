  kok: Bir şemsiye fonun içtüzüğü, Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1) uyarınca ticaret siciline tescil edilmiştir.
    Kurucu, bu şemsiye fona bağlı ilk fonun katılma payı ihracı için süresinde Kurula başvuramamış; makul gerekçelerini Kurula
    sunmuş ve Kurul, mevzuatın izin verdiği ek süreyi uygun görmüştür. İçtüzüğün tescilinden itibaren ilk fonun katılma payı
    ihracı başvurusu en geç kaç ay içinde yapılmalıdır?
  secenekler:
    A: Üç ay
    B: Altı ay
    C: Dokuz ay
    D: On iki ay
    E: On beş ay
