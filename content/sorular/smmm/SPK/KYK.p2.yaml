- id: SMMM-SPK-KYK-0078
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım fonları
  tip: hesaplama
  zorluk: 3
  kok: Aynı yöneticinin yönetimindeki ve aynı kurucuya ait A, B ve C fonları, sermayesi 400.000.000 TL olan X A.Ş.'nin paylarına
    yatırım yapmaktadır. A Fonu X'in sermayesinin 36.000.000 TL'lik, B Fonu 22.000.000 TL'lik kısmına sahiptir. Yatırım Fonlarına
    İlişkin Esaslar Tebliği (III-52.1) md. 17/2 sınırları esas alındığında C Fonu X'in sermayesinden en fazla kaç TL'lik pay
    daha edinebilir?
  secenekler:
    A: 4.000.000 TL
    B: 22.000.000 TL
    C: 40.000.000 TL
    D: 44.000.000 TL
    E: 220.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'III-52.1 md. 17/2 uyarınca bir fon tek başına bir ihraççının sermayesinin %10''undan, aynı yöneticinin yönetimindeki
      tek bir kurucuya ait fonlar ise toplu olarak %20''sinden fazlasına sahip olamaz. Tek fon sınırı 400.000.000 x %10 =
      40.000.000 TL, toplu sınır 400.000.000 x %20 = 80.000.000 TL''dir. A ve B''nin toplam payı 58.000.000 TL olduğundan
      C için toplu sınırdan kalan 22.000.000 TL''dir ve bu tutar tek fon sınırının altındadır. Püf noktaları: İki sınır birlikte
      uygulanır ve küçük olan bağlayıcıdır; mevcut payların toplamı toplu sınırdan düşülür, tek fon sınırından değil.'
    hesap_adimlari:
    - Tek fon sınırı = 400.000.000 x 0,10 = 40.000.000 TL
    - Toplu sınır = 400.000.000 x 0,20 = 80.000.000 TL
    - A ve B toplamı = 36.000.000 + 22.000.000 = 58.000.000 TL
    - Toplu sınırdan kalan = 80.000.000 - 58.000.000 = 22.000.000 TL
    - C için azami = min(40.000.000; 22.000.000) = 22.000.000 TL
    celdiriciler:
      A: Tek fon sınırından yalnızca A Fonu'nun payı düşülerek (40.000.000 - 36.000.000) bulunmuştur; sınır fon bazında değil
        toplu olarak uygulanır.
      C: Yalnızca tek fon sınırı (%10) dikkate alınmıştır; aynı kurucuya ait fonlar için toplu %20 sınırı da vardır.
      D: Toplu sınırdan yalnızca A Fonu'nun payı düşülmüş (80.000.000 - 36.000.000), B Fonu unutulmuştur; ayrıca sonuç tek
        fon sınırını aşar.
      E: Sonuç bir basamak kaydırılarak yazılmıştır; doğru hesapta C Fonu en fazla 22.000.000 TL pay edinebilir.
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 17/2
    alinti: (2) Fon tek başına hiçbir ihraççının sermayesinin ya da tüm oy haklarının %10’undan fazlasına, aynı yöneticinin
