  kok: Bir hisse senedi fonunun portföyündeki varlıkların değeri 49.000.000 TL, banka mevduatı 1.600.000 TL ve fona ait tahakkuk
    etmiş gider borcu 600.000 TL'dir. Fon toplam değeri, varlıklar toplamından borçların düşülmesiyle bulunmaktadır. Dolaşımdaki
    katılma payı sayısı 4.000.000 adet olduğuna göre fon birim pay değeri kaç TL'dir?
  secenekler:
    A: 1,25
    B: 12,50
    C: 12,65
    D: 12,80
    E: 125,00
  dogru: B
  aciklama:
    dogru_neden: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1) md. 14/2 uyarınca birim pay değeri, fon toplam değerinin
      katılma paylarının sayısına bölünmesiyle bulunur. Fon toplam değeri 49.000.000 + 1.600.000 - 600.000 = 50.000.000 TL;
      birim pay değeri 50.000.000 / 4.000.000 = 12,50 TL'dir.
    hesap_adimlari:
    - Fon toplam değeri = 49.000.000 + 1.600.000 - 600.000 = 50.000.000 TL
    - Birim pay değeri = 50.000.000 / 4.000.000 = 12,50 TL
    celdiriciler:
      A: Bölme sırasında bir basamak kayması yapılmıştır; doğru işlemde sonuç 12,50 TL'dir.
      C: Gider borcu düşülmeden (50.600.000 / 4.000.000) bulunan değerdir; borçlar toplamdan düşülmelidir.
      D: Gider borcu varlıklara eklenerek (51.200.000 / 4.000.000) bulunan değerdir; borç düşülmeli, eklenmemelidir.
      E: Toplam değer katılma payı sayısına bölünürken ondalık kayması yapılmıştır; doğru sonuç 12,50 TL'dir.
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 14/2
    alinti: (2) Fon birim pay değeri, fon toplam değerinin katılma paylarının sayısına bölünmesiyle elde edilir.
