- id: SMMM-SPK-KYK-0057
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım ortaklıkları
  tip: uygulama
  zorluk: 3
  kok: Gayrimenkul yatırım ortaklığı olarak kurulan X A.Ş.'nin kuruluşu ticaret siciline tescil edilmiştir. X, gerekli donanım
    ve organizasyonu kurmuş ancak çıkarılmış sermayesinin asgari %25'ini temsil eden payların halka arzı için Gayrimenkul
    Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1) md. 11/1'deki süre içinde Kurula başvurmamıştır. Bu durumda
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: X, GYO olarak faaliyetine devam eder; yalnızca idari para cezası uygulanır ve Kurulca ek süre verilir.
    B: GYO olarak faaliyet hakkı ortadan kalkar; ortaklık Kurul kararıyla hemen tasfiye edilir ve sona erer.
    C: X'e Kurulca bir yıl ek süre verilmesi zorunludur; bu sürede GYO olarak faaliyetine devam eder.
    D: GYO faaliyet hakkı ortadan kalkar; süre bitiminden itibaren en geç üç ay içinde esas sözleşme değişikliği için Kurula
      başvurulur.
    E: X, yalnızca nitelikli yatırımcıya satış yaparak GYO statüsünü koruyabilir; halka arz başvurusu yapma zorunluluğu da
      tamamen ortadan kalkar.
  dogru: D
  aciklama:
    dogru_neden: 'III-48.1 md. 11/1 uyarınca halka arz başvurusu, kuruluşun ticaret siciline tescilini takip eden üç ay içinde
      yapılmalıdır. Md. 11/3 uyarınca bu süre içinde başvurmayan ortaklığın GYO olarak faaliyette bulunma hakkı ortadan kalkar;
      ortaklık, sürenin bitiminden itibaren en geç üç ay içinde esas sözleşmeyi GYO faaliyetini kapsamayacak şekilde değiştirmek
      ve kayıtlı sermaye sisteminden çıkmak üzere Kurula başvurmakla yükümlüdür. Püf noktaları: Sonuç idari para cezası ya
      da hemen tasfiye değil, faaliyet hakkının düşmesi ve üç aylık dönüşüm başvurusu yükümlülüğüdür; iki üç aylık süre birbirine
      karıştırılmamalıdır.'
    celdiriciler:
      A: Md. 11/3 yaptırım olarak GYO faaliyet hakkının ortadan kalkmasını öngörür; faaliyete devam edilemez.
      B: Ortaklık hemen tasfiye edilmez; üç ay içinde esas sözleşmeyi değiştirmek üzere başvurmak zorundadır, yapmazsa TTK
        uyarınca sona ermiş sayılır.
      C: Md. 11'de bir yıllık zorunlu ek süre öngörülmemiştir.
      E: Nitelikli yatırımcıya satış, halka arz başvuru yükümlülüğünü ortadan kaldırmaz; bu seçenek GYO statüsünü korumaz.
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 11/1
    alinti: (1) Gayrimenkul yatırım ortaklığı olarak kurulan veya esas sözleşme tadili yoluyla gayrimenkul yatırım ortaklığına
      dönüşen ortaklıkların, paylarını halka arz yoluyla satabilmek için kuruluşlarının veya esas sözleşme değişikliklerinin
      ticaret siciline tescilini takip eden üç ay içinde
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 11/3
    alinti: Birinci fıkrada belirtilen süre içinde halka arz standart formunu ve formda belirtilen belgeleri tamamlayarak
      Kurula başvurmayan veya gerekli şartları sağlamadığı için başvurusu Kurulca onaylanmayan ortaklıkların, gayrimenkul
      yatırım ortaklığı olarak faaliyette bulunma hakları ortadan kalkar.
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 11/3
    alinti: Ortaklıklar, ilgili sürenin bitiminden veya Kurulun olumsuz görüşünün kendilerine bildirildiği tarihten itibaren
      en geç üç ay içinde esas sözleşme hükümlerini gayrimenkul yatırım ortaklığı faaliyetini kapsamayacak şekilde değiştirmek
      ve kayıtlı sermaye sisteminden çıkmak üzere Kurula başvurmakla yükümlüdürler.
