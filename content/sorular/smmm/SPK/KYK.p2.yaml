  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: DSYO
  tip: uygulama
  zorluk: 3
  kok: Bir değişken sermayeli yatırım ortaklığının kurucu paylarının değeri Kurulca belirlenen tutarın altına düşmüştür. 6362
    sayılı Sermaye Piyasası Kanunu'nun 50 nci maddesine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yönetim kurulu durumu en geç otuz gün içinde Kurula bildirir; genel kurul altmış gün içinde toplanır.
    B: Yatırımcı paylarının değeri düşmedikçe herhangi bir bildirim ve genel kurul toplantısı yükümlülüğü doğmaz.
    C: Kurul, sorun giderilemese bile tasfiye dışında bir tedbir alamaz; tasfiye ancak genel kurulca kararlaştırılabilir.
    D: Yönetim kurulu durumu Kurula bildirir; genel kurul toplanması için Kurulun ayrıca izin vermesi gerekir.
    E: Durum gecikmeksizin Kurula bildirilir; genel kurul derhâl çağrılır ve en geç otuz gün içinde toplanır.
  dogru: E
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 50/4 uyarınca kurucu payların değeri Kurulca belirlenen tutarların altına düşerse
      yönetim kurulu bu durumu gecikmeksizin Kurula bildirir, genel kurulu derhâl toplantıya çağırır ve en geç otuz gün içinde
      genel kurul toplanır. Sorun giderilemezse Kurul tasfiye dâhil her tür tedbiri almaya yetkilidir. Püf noktaları: Bildirim
      ''gecikmeksizin'' yapılır; otuz günlük süre bildirimin değil genel kurulun toplanması içindir. Tetikleyici de yatırımcı
      payları değil kurucu paylarının değeridir.'
    celdiriciler:
      A: Bildirim gecikmeksizin yapılır ve genel kurul en geç otuz gün içinde toplanır; altmış günlük süre kanunda yoktur.
      B: Tetikleyici kurucu paylarının değerinin Kurulca belirlenen tutarın altına düşmesi ya da mali zayıflamadır; yatırımcı
        payları ölçüt değildir.
      C: Sorun giderilemezse Kurul tasfiye dâhil her tür tedbiri almaya yetkilidir; tasfiye de Kurulun alabileceği tedbirler
        arasındadır.
      D: Genel kurul yönetim kurulunca derhâl çağrılır; Kurulun ayrıca izin vermesi koşulu kanunda yoktur.
  kaynaklar:
