  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: portföy saklama
  tip: uygulama
  zorluk: 3
  kok: Bir portföy saklayıcısı, saklamasındaki fon varlıklarının bir kısmını başka bir saklama kuruluşu nezdinde saklatmıştır.
    Alt saklayıcının kusuru nedeniyle fon zarara uğramıştır. 6362 sayılı Sermaye Piyasası Kanunu'nun 56 ncı maddesine göre
    portföy saklama hizmetini veren kuruluşların sorumluluğu bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnızca alt saklayıcı, kendi kusuru oranında sorumludur.
    B: Yalnızca ilk saklayıcı sorumludur; alt saklayıcı sorumlu tutulamaz.
    C: Portföy saklama hizmetini veren tüm kuruluşlar müteselsilen sorumludur.
    D: Kuruluşlar yalnızca kusurları oranında ve ayrı ayrı sorumludur.
    E: Alt saklama Kurul iznine bağlı olduğundan, izin alınmışsa ilk saklayıcı sorumluluktan kurtulur.
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 56/4 uyarınca saklayıcı, saklamasındaki varlıkların tümünü veya bir kısmını portföy
      saklama hizmeti yürüten diğer kuruluşlar nezdinde saklayabilir; bu hâlde portföy saklama hizmetini veren tüm kuruluşlar
      müteselsilen sorumludur. Püf noktaları: Müteselsil sorumluluk, zarar görenin her bir saklayıcıya karşı tüm zarar için
      başvurabilmesi demektir; kusur oranına göre bölünme yoktur. Alt saklama için Kurul izni kuralı da bulunmamaktadır.'
    celdiriciler:
      A: Alt saklama hâlinde sorumluluk yalnız alt saklayıcıya yüklenmez; tüm saklayıcılar müteselsilen sorumludur.
      B: Alt saklayıcı da sorumludur; md. 56/4 tüm saklama hizmeti verenleri müteselsil sorumlu kılar.
      D: Kusur oranına göre ayrı ayrı sorumluluk (örneğin MKK'da olduğu gibi) bu hâlde değil, müteselsil sorumluluk öngörülmüştür.
      E: Md. 56/4'te Kurul izniyle sorumluluktan kurtulma imkânı tanınmamıştır; sorumluluk devam eder.
