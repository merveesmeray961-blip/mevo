  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım ortaklıkları
  tip: uygulama
  zorluk: 3
  kok: Halka arzdan sonra yönetim kontrolünü sağlayan paylara sahip olan ortak Z, gayrimenkul yatırım ortaklıkları için aranan
    nitelik şartlarını sonradan sağlayamaz hâle gelmiştir. Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    md. 15/2'ye göre Z'nin yükümlülüğü aşağıdakilerden hangisidir?
  secenekler:
    A: Şartları sağlayamadığı tarihten itibaren en geç üç ay içinde yönetim kontrolü sağlayan paylarını elden çıkarmak
    B: Şartları sağlayamadığı tarihten itibaren en geç bir yıl içinde yönetim kontrolü sağlayan paylarını elden çıkarmak
    C: Şartları yeniden sağlayıncaya kadar yalnızca oy haklarını kullanmaktan kaçınmak
    D: Şartları sağlayamadığını tevsik eden belgeleri on iş günü içinde Kurula iletmek ve payları elinde tutmaya devam etmek
    E: Payların tamamını Kurulca belirlenen fiyattan ortaklığa satmak
