      hâlinde, yönetim kontrolü sağlayan paylarını şartları sağlayamadıkları tarihten itibaren en geç üç ay içerisinde elden
      çıkarmaları zorunludur. Püf noktaları: On iş günü, şartları taşıdığını gösteren belgelerin edinimden sonra Kurula iletilmesi
      süresidir; elden çıkarma süresi ise üç aydır.'
