    madde: md. 50/4
    alinti: (4) Değişken sermayeli yatırım ortaklıklarının kurucu paylarının değerinin Kurulca belirlenen tutarların altına
      düşmesi yahut mali durumlarının yükümlülüklerini karşılayamayacak kadar zayıflaması hâlinde, yönetim kurulu, bu durumu
      gecikmeksizin Kurula bildirir. Yönetim kurulu, bildirimi takiben, gerekli önlemleri almak üzere genel kurulu derhâl
