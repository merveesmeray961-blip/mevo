    ne: 'hakem 2026-10-05: IV''ün neden yanlış olduğuna md. 49/1 (c) genel kuralı eklendi (kaynaklara alıntı ile);
      gecerlilik.baslangic 2014-02-20 → 2012-12-30.'
    neden: 'G6: ayni sermayenin GYO''ya özgü istisna olduğu, genel kuralın (nakit karşılığı pay) kaynağı gösterilmeden
      söyleniyordu. Dayanılan md. 48/3, 49/1, 49/5 ve 50/2 6362 sayılı Kanunun ilk hâlidir (RG 30/12/2012); 2014-02-20
      soruyla ilgisiz md. 48/4''ü ekleyen 6525 sayılı Kanunun kabul tarihidir.'
  uretim:
