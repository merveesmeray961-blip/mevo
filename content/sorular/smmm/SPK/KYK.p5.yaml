- id: SMMM-SPK-KYK-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım ortaklıkları
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre yatırım ortaklıklarına ilişkin aşağıdaki ifadelerden hangileri
    doğrudur?


    I. Yatırım ortaklıklarının esas sözleşme değişikliklerinde Kurulun uygun görüşünün alınması zorunludur.


    II. Değişken sermayeli yatırım ortaklıklarında kurucu paylarının nama yazılı olması zorunludur.


    III. Değişken sermayeli yatırım ortaklıklarının yatırımcı payları, sahibine genel kurulda oy hakkı dâhil idari
    haklar verir.


    IV. Kurulca portföye alınması uygun görülen varlıkların ayni sermaye olarak konulabilmesi, her tür yatırım ortaklığının
    kuruluşunda mümkündür.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'I numaralı ifade md. 48/3''e, II numaralı ifade md. 50/2''ye uygundur. III numaralı ifade yanlıştır:
      md. 50/2 son cümleye göre yatırımcı payları sahibine idari haklar vermez. IV numaralı ifade de yanlıştır:
      md. 49/5''e göre ayni sermaye imkânı gayrimenkul yatırım ortaklıklarına tanınmıştır.


      Püf noktaları: md. 48, 49 ve 50 birlikte okunmalıdır. Değişken sermayeli yatırım ortaklığında iki pay grubu
      vardır: nama yazılı olması zorunlu kurucu payları ve idari hak vermeyen yatırımcı payları. Ayni sermaye hükmü
      genel değil, yalnız gayrimenkul yatırım ortaklıklarına özgüdür. Tuzak: bir türe özgü istisnayı tüm yatırım
      ortaklıklarına ya da yatırımcı paylarına genellemek.'
    celdiriciler:
      A: I doğrudur; ancak md. 50/2'ye uygun olan II numaralı ifade de doğru olduğundan seçenek eksiktir.
      C: III numaralı ifade md. 50/2 son cümleye aykırıdır; yatırımcı payları idari hak vermez. Bu nedenle I, II
        ve III birlikte doğru değildir.
      D: III ve IV numaralı ifadeler yanlıştır (md. 50/2 ve md. 49/5); ayrıca doğru olan I seçenekte yer almamıştır.
      E: III ve IV numaralı ifadeler yanlış olduğundan dört ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 48/3
    alinti: (3) Yatırım ortaklıklarının esas sözleşme değişikliklerinde Kurulun uygun görüşünün alınması zorunludur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 50/2
    alinti: (2) Değişken sermayeli yatırım ortaklığının payları, yatırımcı payları ile nama yazılı olması zorunlu
      olan kurucu paylarından oluşur. ... Yatırımcı payları, sahibine idari haklar vermez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 49/5
    alinti: (5) Gayrimenkul yatırım ortaklıklarının kuruluşlarında ve sermaye artırımlarında, Kurulca portföye alınması
      uygun görülen varlıklar ayni sermaye olarak konulabilir.
