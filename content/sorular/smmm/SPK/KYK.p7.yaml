      saklayıcısından ayrılığını iki ayrı düzey olarak değerlendirin.'
    celdiriciler:
      A: md. 4/1-a, bağlı fonların varlık ve yükümlülüklerinin birbirinden ayrı olduğunu söyler; ortak bir malvarlığı kabul
        edilmez.
      B: Kurucu onayı, Tebliğdeki malvarlığı ayrılığı kuralını ortadan kaldırmaz.
      D: Ayrılık kuralı belirli bir işlem gören fon grubuyla sınırlanmamıştır.
      E: md. 5/1, fon malvarlığını kurucunun ve portföy saklayıcısının malvarlığından açıkça ayırır.
