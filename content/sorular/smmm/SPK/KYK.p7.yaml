      biçimde rehnedilebilir.
    D: Fon malvarlığı yalnız portföy saklayıcısının borçları için haczedilemez; kurucunun borçları için haczedilebilir.
    E: Fon malvarlığı kurucunun borçları için haczedilemez; ayrıca kurucunun üçüncü kişilere olan borçları ile fonların aynı
      üçüncü kişilerden olan alacakları birbirlerine karşı mahsup edilemez.
