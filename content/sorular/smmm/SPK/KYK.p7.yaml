  secenekler:
    A: Fonun ayrı bir tüzel kişilik kazanması ve ortaklar kurulunun kurulması.
    B: Kurucunun, portföy saklama hizmetini yürütmek üzere Kurulca yetkilendirilmiş bir kuruluşla anlaşması ve fon içtüzüğünün
      Kurulca onaylanması.
    C: Fon malvarlığının kurucunun malvarlığıyla birleştirilmesi.
    D: Kuruluş başvurusunun eksik belgelerle yapılması; Kurulun iki ay içinde tamamlanmasını istemesi.
    E: Portföy yönetim şirketinin fon varlıklarını kendi adına ve kendi hesabına yönetmesi.
