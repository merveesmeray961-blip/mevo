- id: SMMM-SPK-KYK-0008
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: fon mal varlığının ayrılığı
  tip: uygulama
  zorluk: 3
  kok: Bir portföy yönetim şirketinin üçüncü kişiye olan borcu nedeniyle alacaklı, yatırım fonunun mal varlığına haciz koydurmak
    istemektedir. Aynı zamanda fon hesabına kredi alınması ve fon iç tüzüğünde hüküm bulunması şartlarının mevcut olduğu bir
    işlemde fon mal varlığının teminat gösterilmesi planlanmaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Fon mal varlığı, portföy yönetim şirketinin mal varlığından ayrıdır; şirket borcu için haczedilemez ve belirtilen şartlar
      altında fon hesabına kredi alma işlemi için teminat gösterilebilir.
    B: Fon mal varlığı şirket borçları için haczedilebilir; ancak hiçbir durumda teminat gösterilemez.
    C: Fon mal varlığı şirket mal varlığından ayrı değildir; yalnızca kamu alacakları için haczedilemez.
    D: Fon mal varlığı şirket borcu için haczedilemez, ancak fon hesabına kredi alınması için içtüzükte hüküm bulunsa bile
      teminat gösterilemez.
    E: Fon mal varlığı ayrı olmakla birlikte, portföy saklama hizmetini yürüten kuruluşun borçları için haczedilebilir.
  dogru: A
  aciklama:
    dogru_neden: 'SPKn md. 53/1 fon mal varlığını portföy yönetim şirketi ve portföy saklama kuruluşunun mal varlığından ayırır.
      Md. 53/2, fon hesabına olması ve içtüzükte hüküm bulunması şartıyla kredi alma gibi sayılan işlemler için teminat gösterilmesine
      istisna tanır; ayrıca fon mal varlığı haczedilemez. Yatırım Fonları Tebliği md. 5 de aynı ayrılığı teyit eder. Püf noktaları:
      Ayrılık ilkesi ile teminat yasağının istisnası birlikte uygulanır; kredi işlemi için iki şartın da gerçekleşmesi gerekir.'
    celdiriciler:
      B: Ayrılık ve haczedilmezlik doğru olsa da, md. 53/2'de kredi alma için şartları gerçekleşen istisna bulunduğundan 'hiçbir
        durumda' ifadesi yanlıştır.
      C: md. 53/1 fon mal varlığının hem portföy yönetim şirketinden hem portföy saklama kuruluşundan ayrı olduğunu söyler;
        kamu alacağına özgü bir ayrım yapmaz.
      D: İçtüzükte hüküm ve fon hesabına olma şartları mevcutsa kredi alma işlemi istisna kapsamındadır.
      E: Fon mal varlığı portföy saklama kuruluşunun mal varlığından da ayrıdır ve md. 53/2 kapsamında haczedilemez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 53/1-2
