    C: Her bir fonun tüm varlık ve yükümlülükleri birbirinden ayrıdır; fon malvarlığı da kurucunun ve portföy saklayıcısının
      malvarlığından ayrıdır.
    D: Fon malvarlığının ayrılığı yalnızca borsada işlem gören fonlar için geçerlidir.
    E: Portföy saklayıcısının malvarlığı ile fon malvarlığı arasında ayrım yapılmaz.
  dogru: C
  aciklama:
    dogru_neden: 'Yatırım Fonlarına İlişkin Esaslar Tebliği md. 3 ve 4 çerçevesinde şemsiye fona bağlı her bir fonun tüm varlık
