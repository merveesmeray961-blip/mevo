- id: SMMM-SPK-KYK-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım ortaklıkları
  tip: kavrama
  zorluk: 3
  kok: 'Bir yatırım ortaklığının kuruluşu değerlendirilirken aşağıdaki ifadelerden hangileri doğrudur?


    I. Yatırım ortaklıkları sabit veya değişken sermayeli anonim ortaklıklardır.

    II. Kuruluş izni için payların nakit karşılığı çıkarılması ve kuruluş sırasında pay bedellerinin tam ve nakden ödenmesi
    gerekir.

    III. Yatırım ortaklığı, esas sözleşmesinde hüküm bulunması ve Kurulun onayı şartıyla bir portföy yönetim şirketinden hizmet
    alabilir.

    IV. Değişken sermayeli yatırım ortaklıklarının sermayesi her zaman net aktif değerine eşittir.'
  secenekler:
    A: I ve II
    B: I, II ve III
    C: II ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: E
  aciklama:
    dogru_neden: 'SPKn md. 48/1 yatırım ortaklıklarını sabit veya değişken sermayeli anonim ortaklıklar olarak tanımlar; md.
      49/1-c kuruluşta payların nakit karşılığı çıkarılmasını ve bedellerin tam ve nakden ödenmesini, md. 49/4 ise esas sözleşmede
      hüküm ve Kurul onayı şartıyla portföy yönetim şirketinden hizmet alınabilmesini düzenler. Md. 50/1''e göre değişken
      sermayeli yatırım ortaklığının sermayesi her zaman net aktif değerine eşittir. Püf noktaları: Kuruluş şartları ile değişken
      sermayeli yatırım ortaklığının özel yapısı ayrı hükümlerden birlikte okunmalıdır.'
    celdiriciler:
      A: III ve IV de kaynakta açıkça düzenlendiğinden yalnız I ve II eksik kalır.
      B: IV de doğrudur; değişken sermayeli yatırım ortaklığının sermayesi net aktif değerine eşittir.
      C: I ve III dışarıda bırakılmıştır; her ikisi de kaynakta yer alır.
      D: II de kuruluş şartıdır; bu nedenle yalnız I, III ve IV eksik bir kombinasyondur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 48/1
    alinti: 'MADDE 48 – (1) Yatırım ortaklıkları, sermaye piyasası araçları, gayrimenkul, girişim

      sermayesi yatırımları ile Kurulca belirlenecek diğer varlık ve haklardan oluşan portföyleri

      işletmek amacıyla, paylarını ihraç etmek üzere kurulan sabit veya değişken sermayeli anonim

      ortaklıklardır.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 49/1 ve 49/4
    alinti: 'c) Paylarının nakit karşılığı çıkarılması ve pay bedellerinin kuruluş sırasında tam ve

      nakden ödenmesi,'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 49/4
    alinti: '(4) Yatırım ortaklıkları, esas sözleşmelerinde hüküm bulunmak kaydıyla ve Kurulun

      onayını almak şartıyla bir portföy yönetim şirketinden hizmet alabilir.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 50/1
    alinti: 'MADDE 50 – (1) Değişken sermayeli yatırım ortaklıkları, sermayesi her zaman net

      aktif değerine eşit olan yatırım ortaklıklarıdır. Net aktif değer ise varlıkların toplamından

      borçların toplamının düşülmesi suretiyle bulunan tutarı ifade eder.'
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
