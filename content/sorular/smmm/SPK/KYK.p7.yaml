      düzenler. Senaryoda bu istisnalardan biri kurulmadığından D doğrudur. Püf noktaları: Fonun ayrı malvarlığı niteliğini,
      haciz yasağını ve mahsup yasağını birlikte değerlendirin; kurucunun borcu otomatik olarak fon malvarlığına yöneltilemez.'
