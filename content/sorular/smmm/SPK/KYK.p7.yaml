    C: '%5''ten fazla yatırım yapılan ihraççıların toplamı sınırı aşmadığı için verilen üç tutar bakımından sınırlamalar aşılmamıştır.'
    D: Tek ihraççı sınırı 5 milyon TL olduğu için yatırım uygun değildir.
    E: Aynı grup sınırı 10 milyon TL olduğu için yatırım uygun değildir.
  dogru: C
  aciklama:
    dogru_neden: 'III-52.1 sayılı Tebliğ md. 17/1-a-c uyarınca tek ihraççı için genel sınır %10, aynı grup için sınır %20
      ve %5''ten fazla yatırım yapılan ihraççıların toplamı için sınır %40''tır. 100 milyon TL üzerinden sırasıyla 10, 20
      ve 40 milyon TL sınırları vardır; 9, 19 ve 39 milyon TL bu sınırların altındadır. Püf noktaları: Üç sınır farklı bazlara
      değil aynı fon toplam değerine uygulanır ve verilen üç tutar ayrı ayrı değerlendirilir.'
    celdiriciler:
      A: 9 milyon TL, 100 milyon TL'nin %9'udur; %10 sınırını aşmaz.
      B: 19 milyon TL, %19'dur; %20 sınırını aşmaz.
      D: Tek ihraççı sınırı %10'dur; 5 milyon TL değildir.
      E: Aynı grup sınırı %20'dir; 10 milyon TL değildir.
