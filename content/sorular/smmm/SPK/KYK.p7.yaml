      C: Fonun malvarlığı kurucunun malvarlığından ayrıdır; birleştirilmesi öngörülmez.
      D: Başvurunun gerekli belgelerinin Kurula eksiksiz sunulması gerekir; iki aylık süre Kurulun karar verme süresidir.
      E: Portföy yönetim şirketi fon hesabına ve mevzuat ile içtüzüğe uygun tasarrufta bulunur; kendi hesabına yönetim öngörülmez.
