  aciklama:
    dogru_neden: SPKn md. 52/2'ye göre yatırım fonunun kuruluş izni alabilmesi için kurucunun portföy saklama hizmetini yürütmek
      üzere Kurulca yetkilendirilmiş bir kuruluşla anlaşmış olması ve fon içtüzüğünün Kurulca onaylanması gerekir.
