      ve kurucu paylarının nama yazılı olduğunu düzenler. Püf noktaları: DSYO açık uçlu yapıya benzer.'
    celdiriciler:
      A: II ve III de doğrudur.
      B: III de doğrudur.
      C: I de doğrudur.
      D: II de doğrudur.
