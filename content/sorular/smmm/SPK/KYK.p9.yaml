  kok: 'Değişken sermayeli yatırım ortaklıklarına (DSYO) ilişkin aşağıdaki eşleştirmelerden hangisi doğrudur?

    I. Sermaye – Net aktif değere eşit

    II. Paylar – İtibari değeri bulunmaz

    III. Kurucu payları – Nama yazılıdır'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I ve III
    E: I, II ve III
