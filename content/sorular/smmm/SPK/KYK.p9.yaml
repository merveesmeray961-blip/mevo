  zorluk: 3
  kok: Fon toplam değeri 200 milyon TL olan bir yatırım fonunda, portföyün 24 milyon TL'si tek bir ihraççının para ve sermaye
    piyasası araçlarına yatırılmıştır. Ayrıca fon toplam değerinin %5'inden fazla yatırım yapılan ihraççıların araçlarının
    toplamı 76 milyon TL'dir. Tebliğdeki iki portföy sınırlaması birlikte dikkate alındığında hangi değerlendirme doğrudur?
  secenekler:
    A: Her iki sınır da aşılmıştır.
    B: Tek ihraççı sınırı aşılmıştır; %5'ten fazla yatırım yapılan ihraççıların toplamına ilişkin sınır aşılmamıştır.
    C: Tek ihraççı sınırı aşılmamıştır; toplam sınır aşılmıştır.
    D: Her iki sınır da aşılmamıştır.
    E: Bu iki sınır yatırım fonları için uygulanmaz.
  dogru: B
  aciklama:
    dogru_neden: 'III-52.1 sayılı Tebliğ md. 17/1-(a) uyarınca tek ihraççıya genel sınır fon toplam değerinin %10''udur; 200
      milyon TL''nin %10''u 20 milyon TL olup 24 milyon TL bu sınırı aşar. Md. 17/1-(b) uyarınca %5''ten fazla yatırım yapılan
      ihraççıların toplamı %40''ı aşamaz; 200 milyon TL''nin %40''ı 80 milyon TL olup 76 milyon TL sınırın altındadır. Püf
      noktaları: Tek ihraççı sınırı ile yüksek ağırlıklı yatırımların toplam sınırı ayrı ayrı hesaplanır.'
    celdiriciler:
      A: '%40 sınırı 80 milyon TL''dir; 76 milyon TL bu sınırı aşmaz.'
      C: 24 milyon TL, 20 milyon TL'lik tek ihraççı sınırını aşar.
      D: Tek ihraççı sınırı aşılmıştır.
      E: Tebliğ md. 17 portföy sınırlamalarını düzenler.
    hesap_adimlari:
    - 'Tek ihraççı sınırı: 200.000.000 × %10 = 20.000.000 TL.'
    - Gerçek yatırım 24.000.000 TL olduğundan tek ihraççı sınırı aşılmıştır.
    - '%5''ten fazla yatırım yapılan ihraççıların toplam sınırı: 200.000.000 × %40 = 80.000.000 TL.'
    - Toplam 76.000.000 TL olduğundan %40 sınırı aşılmamıştır.
