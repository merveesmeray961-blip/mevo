- id: SMMM-SPK-KYK-0033
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: fon mal varlığının ayrılığı
  tip: kavrama
  zorluk: 2
  kok: Yatırım fonunun mal varlığına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Fon mal varlığı, portföy yönetim şirketi ve portföy saklama hizmetini yürüten kuruluşun mal varlığından ayrıdır.
    B: Fon mal varlığı, fon hesabına olması ve fon iç tüzüğünde hüküm bulunması şartıyla kredi almak veya türev araç işlemleri
      için teminat gösterilebilir.
    C: Fon mal varlığı, portföy yönetim şirketinin iflası hâlinde iflas masasına dâhil edilebilir.
    D: Fon mal varlığının tasfiyesi durumunda yalnızca katılma payı sahiplerine ödeme yapılabilir.
    E: Portföy yönetim şirketinin üçüncü kişilere olan borçları ile fonun aynı kişilerden alacakları mahsup edilemez.
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 53/2 fon mal varlığının iflas masasına dâhil edilemeyeceğini, haczedilemeyeceğini açıkça düzenler.
      Püf noktaları: Ayrılık ilkesi kamu alacakları dâhil her türlü haczi engeller.'
    celdiriciler:
      A: md. 53/1 doğru ifadedir.
      B: md. 53/2 teminat gösterme istisnasını düzenler; doğru ifadedir.
      D: md. 53/3 doğru ifadedir.
      E: md. 53/4 doğru ifadedir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 53/2
    alinti: (2) Fon mal varlığı, fon hesabına olması ve fon iç tüzüğünde hüküm bulunması şartıyla kredi almak, türev araç
      işlemleri, açığa satış işlemleri veya fon adına taraf olunan benzer nitelikteki işlemlerde bulunmak haricinde teminat
      gösterilemez ve rehnedilemez. Fon mal varlığı portföy yönetim şirketinin ve portföy saklama hizmetini yürüten kuruluşun
      yönetiminin veya denetiminin kamu kurumlarına devredilmesi hâlinde dahi başka bir amaçla tasarruf edilemez, kamu alacaklarının
      tahsili amacı da dâhil olmak üzere haczedilemez, üzerine ihtiyati tedbir konulamaz ve iflas masasına dâhil edilemez.
