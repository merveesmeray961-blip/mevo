  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: portföy saklama
  tip: kavrama
  zorluk: 3
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre portföy saklama hizmetine ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Portföy saklama hizmetini yürüten kuruluş ile portföy yönetim şirketi aynı tüzel kişi olamaz.
    B: Portföy saklama hizmetini yürüten kuruluş, saklamasında bulunan varlıkların tümünü veya bir kısmını başka bir portföy
      saklama hizmeti yürüten kuruluş nezdinde saklayabilir; bu hâlde tüm kuruluşlar müteselsilen sorumludur.
    C: Portföy saklama hizmetini yürüten kuruluşun yöneticileri, portföy yönetim şirketinde ortak, yönetici veya temsilci
      olabilir.
    D: Portföy saklama hizmetini yürüten kuruluş, yükümlülüklerini yerine getirmemesi nedeniyle yatırım fonlarında portföy
      yönetim şirketi ve katılma payı sahiplerine verdiği zararlardan sorumludur.
    E: Portföy saklama hizmetini yürüten kuruluş ve portföy yönetim şirketi, görevlerini yerine getirirken birbirlerinden
      bağımsız ve sadece katılma payı sahiplerinin menfaatleri doğrultusunda hareket etmekle yükümlüdür.
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 56/7''ye göre portföy saklama hizmetini yürüten kuruluşun yöneticileri ile bu kuruluşları temsil
      ve ilzama yetkili kişiler, portföy yönetim şirketinde ortak, yönetici ya da temsilci olamazlar. Püf noktaları: Bağımsızlık
      kuralı yöneticilerin çapraz görev almasını yasaklar; aynı tüzel kişi olamama (md. 56/6) ile karıştırılmamalıdır.'
    celdiriciler:
      A: md. 56/6 açıkça aynı tüzel kişi olamayacaklarını düzenler; doğru ifadedir.
      B: md. 56/4 alt saklamaya ve müteselsil sorumluluğa izin verir; doğru ifadedir.
      D: md. 56/2 sorumluluğu açıkça düzenler; doğru ifadedir.
      E: md. 56/6 bağımsızlık ve menfaat yönelimini düzenler; doğru ifadedir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 56/7
    alinti: (7) Portföy saklama hizmetini yürüten kuruluş ve fon portföyüne varlık alım satımına aracılık hizmeti veren yatırım
      kuruluşunun yöneticileri ile bu kuruluşları temsil ve ilzama yetkili kişiler, portföy yönetim şirketinde ortak, yönetici
      ya da temsilci olamazlar. Portföy yönetim şirketinin ortakları, yöneticileri ile bu şirketleri temsil ve ilzama yetkili
      kişiler de saklama hizmetini yürüten kuruluşta yönetici ya da temsilci olamazlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 56/6
    alinti: (6) Portföy saklama hizmetini yürüten kuruluş ile portföy yönetim şirketi aynı tüzel kişi olamaz. Portföy saklama
      hizmetini yürüten kuruluş ve portföy yönetim şirketi görevlerini yerine getirirken birbirlerinden bağımsız ve sadece
      katılma payı sahiplerinin menfaatleri doğrultusunda hareket etmekle yükümlüdürler.
