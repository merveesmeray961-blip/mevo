- id: SMMM-SPK-KYK-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: fon mal varlığının ayrılığı
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre yatırım fonlarının mal varlığına ilişkin aşağıdaki ifadelerden
    hangisi **yanlıştır**?
  secenekler:
    A: Fonun mal varlığı, portföy yönetim şirketinin ve portföy saklama hizmetini yürüten kuruluşun mal varlığından
      ayrıdır.
    B: Fon mal varlığı, kamu alacaklarının tahsili amacıyla dahi haczedilemez, üzerine ihtiyati tedbir konulamaz
      ve iflas masasına dâhil edilemez.
    C: Fon mal varlığının tasfiyesi durumunda yalnızca katılma payı sahiplerine ödeme yapılabilir.
    D: Fon mal varlığı, fon hesabına olması ve fon iç tüzüğünde hüküm bulunması şartıyla kredi almak amacıyla teminat
      gösterilebilir.
    E: Portföy yönetim şirketinin üçüncü kişilere olan borçları ile fonun aynı üçüncü kişilerden olan alacakları
      birbirine karşı mahsup edilebilir.
  dogru: E
  aciklama:
    dogru_neden: SPKn md. 53/4'e göre portföy yönetim şirketlerinin üçüncü kişilere olan borçları ve yükümlülükleri
      ile yatırım fonlarının aynı üçüncü kişilerden olan alacakları birbirlerine karşı mahsup edilemez. Mahsubun
      mümkün olduğunu söyleyen ifade yanlıştır.
    celdiriciler:
      A: md. 53/1'e göre fonun mal varlığı, portföy yönetim şirketi ve portföy saklama hizmetini yürütecek kuruluşun
        mal varlığından ayrıdır; ifade doğrudur.
      B: md. 53/2'ye göre fon mal varlığı kamu alacaklarının tahsili amacı da dâhil olmak üzere haczedilemez, üzerine
        ihtiyati tedbir konulamaz ve iflas masasına dâhil edilemez; ifade doğrudur.
      C: md. 53/3'e göre fon mal varlığının tasfiyesi durumunda yalnızca katılma payı sahiplerine ödeme yapılabilir;
        ifade doğrudur.
      D: md. 53/2'ye göre fon mal varlığı, fon hesabına olması ve fon iç tüzüğünde hüküm bulunması şartıyla kredi
        almak gibi işlemler için teminat gösterilebilir; ifade doğrudur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 53/1–2
    alinti: (1) Fonun mal varlığı, portföy yönetim şirketi ve portföy saklama hizmetini yürütecek kuruluşun mal
      varlığından ayrıdır. (2) Fon mal varlığı, fon hesabına olması ve fon iç tüzüğünde hüküm bulunması şartıyla
      kredi almak, türev araç işlemleri, açığa satış işlemleri veya fon adına taraf olunan benzer nitelikteki işlemlerde
      bulunmak haricinde teminat gösterilemez ve rehnedilemez. ... kamu alacaklarının tahsili amacı da dâhil olmak
      üzere haczedilemez, üzerine ihtiyati tedbir konulamaz ve iflas masasına dâhil edilemez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 53/3–4
    alinti: (3) Fon mal varlığının tasfiyesi durumunda yalnızca katılma payı sahiplerine ödeme yapılabilir. (4)
      Portföy yönetim şirketlerinin üçüncü kişilere olan borçları ve yükümlülükleri ile yatırım fonlarının aynı
      üçüncü kişilerden olan alacakları birbirlerine karşı mahsup edilemez.
