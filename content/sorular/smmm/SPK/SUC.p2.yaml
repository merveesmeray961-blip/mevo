      D: 7.000.000 TL günlük hesap ile menfaatin toplamıdır; kanun toplamı değil büyüğünü esas alır.
      E: 12.000.000 TL menfaatin üç katıdır; md. 107/1'de böyle bir alt sınır yoktur.
