      artırılmaz.
    B: Altı aydan iki yıla kadar hapis; cebir nedeniyle ayrıca 5237 sayılı Kanunun ilgili maddelerine göre de cezaya hükmolunur.
    C: Bir yıldan üç yıla kadar hapis cezası verilir; cebir ağırlaştırıcı neden sayılır.
    D: Yalnızca TCK hükümleri uygulanır; md. 111/2 uygulanmaz.
    E: Yalnızca idari para cezası verilir.
