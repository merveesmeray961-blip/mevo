    dogru_neden: 'I doğrudur; md. 115/1 Kurulun yazılı başvurusunu muhakeme şartı sayar. III doğrudur; md. 115/4 uyarınca
      kovuşturmaya yer olmadığı kararına karşı Kurul itiraza yetkilidir. II yanlıştır; md. 116 uyarınca yargılamaya HSK''nın
      ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri yetkilidir. Ağır ceza mahkemeleri yalnızca kripto
      varlık hizmet sağlayıcılarında zimmet suçuna ilişkin davalara bakar. Püf noktaları: Genel kural ihtisas asliye ceza
      mahkemesi, istisna zimmet suçunda ağır cezadır.'
    celdiriciler:
      A: II yanlıştır; kural olarak ihtisas asliye ceza mahkemeleri yetkilidir.
      C: II yanlış olduğundan bu şık doğru değildir.
      D: I de doğrudur; Kurulun yazılı başvurusu muhakeme şartıdır.
      E: II yanlış olduğundan üç ifadenin tümü doğru değildir.
