    I. Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı soruşturma yapılması, Kurulun Cumhuriyet başsavcılığına yazılı
    başvuruda bulunmasına bağlıdır ve bu başvuru muhakeme şartı niteliğindedir.


    II. Kanundaki suçlara ilişkin davalar kural olarak ağır ceza mahkemelerinde görülür.


    III. Kovuşturmaya yer olmadığı kararı verilmesi hâlinde Kurul bu karara karşı itiraza yetkilidir.'
