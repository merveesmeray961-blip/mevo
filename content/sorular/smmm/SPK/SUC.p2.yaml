    - 'Gün sayısı x gün karşılığı: 6.000 x 500 = 3.000.000 TL'
    - 'Menfaat: 4.000.000 TL'
    - 'Alt sınır: max(3.000.000; 4.000.000) = 4.000.000 TL'
