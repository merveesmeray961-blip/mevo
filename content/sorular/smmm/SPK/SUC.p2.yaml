  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 105/2
    alinti: Bu Kanunda tanımlanan kabahatlerden birinin idari yaptırım kararı verilinceye kadar birden çok işlenmesi hâlinde,
      ilgili hükme göre, ilgili gerçek veya tüzel kişiye bir idari para cezası verilir ve verilecek ceza iki kat artırılır.
