      yararlanamaz. Püf noktaları: (b) ve (c) bentlerinde ''Kurul düzenlemelerine uygunluk'' şartı vardır.'
    celdiriciler:
      A: I ve III de doğrudur; yalnız II doğru değildir.
      B: II yanlış olduğundan üç ifadenin tümü doğru değildir.
      C: II yanlıştır; düzenlemeye aykırı geri alım programı muafiyet kapsamında değildir.
      D: I de doğrudur; TCMB işlemleri md. 108/1 (a) kapsamındadır.
