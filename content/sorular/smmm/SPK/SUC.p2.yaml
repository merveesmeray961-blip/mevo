      benzeri maliyetler dikkate alınmaksızın hesaplama yapılır. Menfaat 300.000 TL kabul edilir. Md. 103/1 uyarınca ceza
      menfaatin iki katından az olamaz: 2 x 300.000 = 600.000 TL.'
