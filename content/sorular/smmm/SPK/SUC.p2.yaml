    madde: md. 103/2
    alinti: Birinci fıkradaki yükümlülüklere aykırı hareket eden kişinin bir özel hukuk tüzel kişisinin organ veya temsilcisi
      olması veya organ veya temsilcisi olmamakla birlikte bu tüzel kişinin faaliyeti çerçevesinde görev üstlenen bir kişi
      olması hâlinde, ayrıca tüzel kişi hakkında da birinci fıkra hükmüne göre idari para cezası verilir. Aykırılığın, temsilcisi
      olunan veya adına hareket edilen tüzel kişinin zararına bir sonuç doğurması hâlinde, tüzel kişiye idari para cezası
      verilmez.
