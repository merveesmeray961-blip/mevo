      idari para cezası verilir. Menfaat temin edilmişse verilecek idari para cezası bu menfaatin iki katından az olamaz;
      250.000 TL menfaat için ceza en az 500.000 TL''dir. Püf noktaları: Üç kat kuralı yalnızca birden çok işlenen kabahatler
      içindir (md. 105/2); kabahat yargısı idari yargıdır, ceza yargılaması değildir.'
    celdiriciler:
      A: Piyasa bozucu eylem suç değil kabahattir; yaptırımı idari para cezasıdır.
      B: Üç kat md. 105/2'deki tekrarlanan kabahatler içindir; md. 104'te alt sınır menfaatin iki katıdır.
      D: Md. 104/1 idari para cezası öngörür; yalnızca iade yeterli değildir.
      E: Piyasa bozucu eylem suç olmadığından kamu davası açılmaz; Kurul idari yaptırım uygular.
