      A: 60.000 TL ödenen maliyetin kendisidir; ceza hesabıyla ilgisi yoktur.
      B: 300.000 TL menfaatin kendisidir; alt sınır iki katıdır.
      C: 480.000 TL maliyet düşülerek bulunan net menfaatin (240.000) iki katıdır; md. 103/9 maliyetlerin dikkate alınmamasını
        ister.
