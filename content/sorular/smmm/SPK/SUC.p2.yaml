  kok: Bir halka açık ortaklığın yöneticisi, Kurul denetçilerinin görevini yapmasını engellemek için denetçilere cebir kullanmış
    ve görevli denetçiyi yaralamıştır. 6362 sayılı Kanun md. 111/2'ye göre yöneticinin sorumluluğu aşağıdakilerden hangisidir?
