- id: SMMM-SPK-SUC-0105
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: kavrama
  zorluk: 3
  kok: '6362 sayılı Kanun md. 107''ye ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. İşlem bazlı piyasa dolandırıcılığında adli para cezasının miktarı, suçun işlenmesi ile elde edilen menfaatten az olamaz.


    II. Etkin pişmanlık ödemesi soruşturma başlamadan önce yapılırsa verilecek ceza yarısı oranında indirilir.


    III. Etkin pişmanlık ödemesi kovuşturma evresinde hüküm verilinceye kadar yapılırsa verilecek ceza üçte biri oranında
    indirilir.'
  secenekler:
    A: Yalnız II
    B: I, II ve III
    C: I ve II
    D: Yalnız III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'I doğrudur; md. 107/1 adli para cezasının menfaatten az olamayacağını belirtir. III doğrudur; md. 107/3
      (c) kovuşturma evresinde hüküm verilinceye kadar yapılan ödemede cezaya üçte bir indirim bağlar. II yanlıştır; soruşturma
      başlamadan önce ödeme hâlinde hakkında cezaya hükmolunmaz (md. 107/3-a), yarı oranında indirim ise soruşturma evresindeki
      ödemeye bağlanmıştır (md. 107/3-b). Püf noktaları: Evre-sonuç eşleşmesi: öncesi cezasızlık, soruşturma yarı, kovuşturma
      üçte bir.'
    celdiriciler:
      A: I ve III doğrudur; II evre-sonuç eşleşmesini yanlış verir.
      B: II yanlış olduğundan üç ifadenin tümü doğru değildir.
      C: II yanlıştır; soruşturma başlamadan önceki ödeme cezasızlık doğurur.
      D: I de doğrudur; adli para cezası menfaatten az olamaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1
    alinti: Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak yanlış veya yanıltıcı
      izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler, emir değiştirenler veya hesap
      hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası ile
      cezalandırılırlar. Ancak, bu suçtan dolayı verilecek olan adli para cezasının miktarı, suçun işlenmesi ile elde edilen
      menfaatten az olamaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/3
    alinti: Birinci fıkrada tanımlanan suçu işleyen kişi pişmanlık göstererek, beş yüz bin Türk Lirasından az olmamak üzere,
      elde ettiği veya elde edilmesine sebep olduğu menfaatin iki katı miktarı kadar parayı, Hazineye;
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/3
    alinti: Henüz soruşturma başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz. b) Soruşturma evresinde ödediği
