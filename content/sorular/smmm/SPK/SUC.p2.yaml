    ve gün karşılığını 500 TL olarak belirlemiştir. Suçtan elde edilen menfaat 4.000.000 TL'dir. 6362 sayılı Kanun md. 107/1'e
    göre bu kişiye verilecek adli para cezasının miktarı en az kaç TL olmalıdır?
  secenekler:
    A: 500.000 TL
    B: 3.000.000 TL
    C: 4.000.000 TL
    D: 7.000.000 TL
    E: 12.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 107/1 uyarınca suçtan dolayı verilecek adli para cezasının miktarı, suçun işlenmesi ile elde edilen
      menfaatten az olamaz. Gün sayısı ve gün karşılığına göre hesaplanan tutar 6.000 x 500 = 3.000.000 TL olup menfaatin
      (4.000.000 TL) altında kaldığından ceza 4.000.000 TL''ye yükseltilir. Püf noktaları: Piyasa dolandırıcılığında alt sınır
      menfaatin kendisidir (iki katı değil); bilgi suistimalinde ise adli para cezası menfaatin iki katından az olamaz.'
