  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: idari para cezaları
  tip: kavrama
  zorluk: 3
  kok: '6362 sayılı Kanun md. 103''e göre idari para cezalarına ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Aykırılığı yapan kişi bir özel hukuk tüzel kişisinin organı veya temsilcisiyse ayrıca tüzel kişi hakkında da idari
    para cezası verilir.


    II. Aykırılık, temsil edilen tüzel kişinin zararına bir sonuç doğursa bile tüzel kişiye idari para cezası verilir.


    III. Kurulun görevlerini yapmalarını engelleyen veya zorlaştıran kişilere de md. 103/1''deki idari para cezası verilir.'
  secenekler:
    A: Yalnız II
    B: I ve III
    C: I ve II
    D: Yalnız III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'I doğrudur; md. 103/2 organ veya temsilcinin aykırılığında ayrıca tüzel kişiye de ceza verilmesini öngörür.
      III doğrudur; md. 103/7 Kurulun veya görevlendirilenlerin görevlerini yapmalarını engelleyen veya zorlaştıran kişilere
      md. 103/1''in birinci cümlesi uyarınca idari para cezası verilmesini öngörür. II yanlıştır; md. 103/2 son cümlesi aykırılığın
      tüzel kişinin zararına sonuç doğurması hâlinde tüzel kişiye idari para cezası verilmeyeceğini belirtir. Püf noktaları:
      Tüzel kişiye ceza kuralı ile onun istisnasını (zararına sonuç) birlikte okuyun.'
    celdiriciler:
      A: II yanlıştır; tüzel kişinin zararına sonuç doğuran aykırılıkta tüzel kişiye ceza verilmez.
      C: II yanlıştır ve III doğrudur; bu şık yanlış önermeyi içerir.
      D: I de doğrudur; tüzel kişiye ayrıca ceza verilir.
      E: II yanlış olduğundan üç ifadenin tümü doğru değildir.
  kaynaklar:
