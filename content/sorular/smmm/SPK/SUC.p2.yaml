- id: SMMM-SPK-SUC-0036
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: bilgi
  zorluk: 1
  kok: 6362 sayılı Sermaye Piyasası Kanunu md. 107/1'de düzenlenen, fiyat ve arz-talep hakkında yanlış veya yanıltıcı izlenim
    uyandırmak amacıyla alım satım yapma suçunun yaptırımı aşağıdakilerden hangisidir?
  secenekler:
    A: Üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası
    B: İki yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası
    C: Üç yıldan beş yıla kadar hapis veya adli para cezası
    D: Üç yıldan beş yıla kadar hapis ve beş bin güne kadar adli para cezası
    E: Bir yıldan üç yıla kadar hapis cezası
  dogru: A
  aciklama:
    dogru_neden: SPKn md. 107/1 uyarınca bu fiili işleyenler üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne
      kadar adli para cezası ile cezalandırılır; adli para cezasının miktarı suçtan elde edilen menfaatten az olamaz.
    celdiriciler:
      B: İki yıl alt sınırı 2020 değişikliğinden önceki sınırdır; mevcut alt sınır üç yıldır.
      C: Seçimlik (hapis veya adli para) yaptırım md. 106'daki bilgi suistimaline özgüdür; md. 107/1'de hapis ve adli para
        cezası birlikte verilir.
      D: Beş bin güne kadar adli para cezası md. 107/2'deki bilgi bazlı dolandırıcılık içindir; md. 107/1'de beş bin günden
        on bin güne kadardır.
      E: Bir yıldan üç yıla kadar hapis md. 111/1'deki bilgi vermeme suçunun yaptırımıdır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1
    alinti: Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak yanlış veya yanıltıcı
      izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler, emir değiştirenler veya hesap
      hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası ile
      cezalandırılırlar. Ancak, bu suçtan dolayı verilecek olan adli para cezasının miktarı, suçun işlenmesi ile elde edilen
      menfaatten az olamaz.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
