      kullanılmış olması hâlinde ayrıca 5237 sayılı Kanunun ilgili maddelerine göre cezaya hükmolunur. Püf noktaları: Denetimi
      engelleme (111/2: 6 ay-2 yıl) ile bilgi vermeme (111/1: 1-3 yıl) süreleri karıştırılmamalı; cebir hâlinde TCK cezası
      ayrıca eklenir, md. 111/2''nin yerine geçmez.'
    celdiriciler:
      A: Cebir veya tehdit hâlinde ayrıca TCK'nın ilgili maddelerine göre cezaya hükmolunur.
      C: Bir yıldan üç yıla kadar hapis md. 111/1'in yaptırımıdır; cebir hâlinde ayrıca TCK uygulanır.
      D: Md. 111/2 de uygulanır; TCK ayrıca hükmolunur.
      E: Engelleme hapis cezasını gerektiren bir suçtur; yalnızca idari para cezası öngörülmemiştir.
