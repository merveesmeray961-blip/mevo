      bağlantılı işlemler ve faaliyetlerde ödediği komisyonlar, vergiler, kredi faizleri, danışmanlık ücretleri ve Kurulca
      benzer kapsamda olduğu değerlendirilen diğer maliyetler dikkate alınmaksızın ve elde edilen menfaatin nakde çevrilip
