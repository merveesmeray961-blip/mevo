  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: idari para cezaları
  tip: hesaplama
  zorluk: 3
  kok: Bir gerçek kişi, idari yaptırım kararı verilinceye kadar 6362 sayılı Kanunda tanımlanan aynı kabahati birden çok kez
    işlemiştir. Kabahat için bir ceza 350.000 TL olarak belirlenmiştir ve bu kabahatin işlenmesiyle toplam 300.000 TL menfaat
    temin edilmiştir. Kanun md. 105/2'ye göre verilecek idari para cezası en az kaç TL'dir?
  secenekler:
    A: 90.000 TL
    B: 300.000 TL
    C: 700.000 TL
    D: 900.000 TL
    E: 1.400.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'SPKn md. 105/2 uyarınca idari yaptırım kararı verilinceye kadar birden çok işlenen kabahat için bir idari
      para cezası verilir ve ceza iki kat artırılır: 350.000 x 2 = 700.000 TL. Ancak menfaat temin edilmişse verilecek ceza
      bu menfaatin üç katından az olamaz: 300.000 x 3 = 900.000 TL. Büyük olan 900.000 TL''dir. Püf noktaları: İki hesabı
      ayrı ayrı yapıp büyüğünü seçin; menfaat iki değil üç kat alınır.'
    celdiriciler:
      A: 90.000 TL menfaatin onda biri bir tutardır, anlamlı bir sınır değildir.
      B: 300.000 TL menfaatin kendisidir; alt sınır üç katıdır.
      C: 700.000 TL yalnızca iki kat artırılmış cezadır; menfaatin üç katı (900.000 TL) daha yüksektir.
      E: 1.400.000 TL, iki kat artırılmış cezanın tekrar ikiye katlanmasıyla bulunur; çifte artırım yoktur.
    hesap_adimlari:
    - 'İki kat artırılmış ceza: 350.000 x 2 = 700.000 TL'
    - 'Menfaatin üç katı: 300.000 x 3 = 900.000 TL'
    - 'Alt sınır: max(700.000; 900.000) = 900.000 TL'
