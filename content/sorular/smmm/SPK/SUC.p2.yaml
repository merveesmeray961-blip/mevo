    veya finansal istikrarın sağlanması amacıyla yaptıkları işlemler sayılmaz.


    II. Ortaklığın Kurul düzenlemelerine aykırı biçimde yürüttüğü geri alım programı da sayılmaz.


    III. Fiyat istikrarını sağlayıcı işlemler ve piyasa yapıcılığı, Kurulun düzenlemelerine uygun olarak icra edilmeleri kaydıyla
    sayılmaz.'
