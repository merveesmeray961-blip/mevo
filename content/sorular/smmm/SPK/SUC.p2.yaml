  aciklama:
    dogru_neden: 'I doğrudur; md. 107/2 menfaat sağlanmasını fiilin unsuru yapar. III doğrudur; md. 107/3 (a) uyarınca soruşturma
      başlamadan önce ödeme hâlinde cezaya hükmolunmaz. II yanlıştır; md. 107/3 yalnızca birinci fıkrada tanımlanan (işlem
      bazlı) suçu işleyenler için uygulanır. Püf noktaları: Etkin pişmanlık fıkra numarasına bağlıdır; ikinci fıkradaki suç
      kapsam dışındadır.'
    celdiriciler:
      B: I de doğrudur; bilgi bazlı suç menfaat sağlanmasıyla oluşur.
      C: II yanlıştır; etkin pişmanlık yalnızca birinci fıkradaki suç içindir.
      D: II yanlıştır; I ve III doğrudur.
      E: II yanlış olduğundan üç ifadenin tümü doğru değildir.
