  kok: Bir yatırımcı, piyasa bozucu nitelikte eylem gerçekleştirmiş ve bu eylemden 250.000 TL menfaat sağlamıştır. Eylemin
    işlem bazlı piyasa dolandırıcılığı suçunu oluşturmadığı belirlenmiştir. 6362 sayılı Kanun md. 104'e göre bu kişi hakkındaki
    yaptırımla ilgili aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Hapis cezası verilir; menfaat varsa adli para cezası da eklenir.
    B: Kurul idari para cezası verir; menfaat varsa ceza en az menfaatin üç katı olur ve ayrıca adli para cezası eklenir.
    C: Kurul idari para cezası verir; menfaat temin edilmişse ceza menfaatin iki katından az olamaz.
    D: Hiçbir yaptırım uygulanmaz; yalnızca menfaat Hazineye iade edilir.
    E: Cumhuriyet savcısı kamu davası açar ve ağır ceza mahkemesi karar verir.
