- id: SMMM-SPK-SUC-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: piyasa bozucu eylemler
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: (K), Kurulca piyasa bozucu eylem olarak belirlenen, makul bir ekonomik veya finansal gerekçeyle açıklanamayan
    ve borsanın güven, açıklık ve istikrar içinde çalışmasını bozacak nitelikteki bir işlem yapmış ve bu işlemle
    1.000.000 TL tutarında menfaat temin etmiştir. (K), bu menfaatin elde edilmesiyle bağlantılı olarak 200.000
    TL komisyon, vergi ve kredi faizi ödemiştir. Eylem ayrıca bir suç oluşturmamaktadır. 6362 sayılı Sermaye Piyasası
    Kanunu'na göre (K) hakkında verilecek yaptırımla ilgili aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Eylem suç oluşturmadığından (K) hakkında herhangi bir yaptırım uygulanmaz.
    B: Kurul tarafından idari para cezası verilir; ceza miktarı 2.000.000 TL'den az olamaz.
    C: Kurul tarafından idari para cezası verilir; ceza miktarı 1.600.000 TL'den az olamaz.
    D: Mahkemece üç yıldan beş yıla kadar hapis cezası verilir.
    E: Kurul tarafından idari para cezası verilir; ancak miktar menfaat ne olursa olsun Kanunda yazılı üst sınırı
      aşamaz.
  dogru: B
  aciklama:
    dogru_neden: md. 104/1'e göre suç oluşturmayan piyasa bozucu eylemleri gerçekleştirenlere Kurul tarafından idari
      para cezası verilir; menfaat temin edilmişse ceza miktarı menfaatin iki katından az olamaz. md. 103/9'a göre
      menfaat hesaplanırken kişinin menfaatin elde edilmesiyle bağlantılı olarak ödediği komisyon, vergi, kredi
      faizi gibi maliyetler dikkate alınmaz. Menfaat 1.000.000 TL olduğundan ceza 2.000.000 TL'den az olamaz.
    celdiriciler:
      A: md. 104/1 piyasa bozucu eylemleri tam da bir suç oluşturmadığı takdirde idari para cezasına bağlamıştır;
        suç oluşturmaması yaptırım uygulanmasını engellemez.
      C: Menfaat net (800.000 TL) alınarak iki katı hesaplanmıştır; oysa md. 103/9'a göre komisyon, vergi ve kredi
        faizi gibi maliyetler menfaat hesabında dikkate alınmaz.
      D: Hapis cezası suç niteliğindeki eylemler (md. 106 ve 107) içindir; suç oluşturmayan piyasa bozucu eylemde
        idari para cezası verilir.
      E: md. 104/1'de idari para cezasının, menfaat temin edilmişse menfaatin iki katından az olamayacağı belirtilmiştir;
        Kanundaki üst sınır bu alt sınırı bağlamaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 104/1
    alinti: (1) Makul bir ekonomik veya finansal gerekçeyle açıklanamayan, borsa ve teşkilatlanmış diğer piyasaların
      güven, açıklık ve istikrar içinde çalışmasını bozacak nitelikteki eylem ve işlemler, bir suç oluşturmadığı
      takdirde, piyasa bozucu nitelikte eylem sayılır. Kurulca belirlenen piyasa bozucu eylemleri gerçekleştiren
      kişilere Kurul tarafından yirmi bin Türk Lirasından beş yüz bin Türk Lirasına kadar idari para cezası verilir.
      Ancak, bu suretle menfaat temin edilmiş olması hâlinde verilecek idari para cezasının miktarı bu menfaatin
      iki katından az olamaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 103/9
    alinti: (9) (Ek:26/6/2024-7518/11 md.) Bu maddede ve Kanunun 104 üncü maddesinde belirtilen menfaat hesaplamalarında;
      kişinin menfaatin elde edilmesiyle bağlantılı işlemler ve faaliyetlerde ödediği komisyonlar, vergiler, kredi
      faizleri, danışmanlık ücretleri ve Kurulca benzer kapsamda olduğu değerlendirilen diğer maliyetler dikkate
      alınmaksızın ve elde edilen menfaatin nakde çevrilip çevrilmediğine bakılmaksızın hesaplama yapılır.
