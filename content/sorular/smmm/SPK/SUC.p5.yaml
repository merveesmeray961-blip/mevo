- id: SMMM-SPK-SUC-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: bilgi suistimali
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre, bir ihraççının yöneticisi henüz kamuya duyurulmamış ve ilgili
    sermaye piyasası aracının fiyatını etkileyebilecek nitelikteki bilgiye dayanarak alım emri verip kendisine menfaat
    temin ederse, aşağıdaki yaptırımlardan hangisiyle karşılaşır?
  secenekler:
    A: Üç yıldan beş yıla kadar hapis veya adli para cezası
    B: İki yıldan beş yıla kadar hapis veya adli para cezası
    C: Yalnızca Kurul tarafından verilen idari para cezası
    D: Üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası
    E: Bir yıldan üç yıla kadar hapis cezası
  dogru: A
  aciklama:
    dogru_neden: md. 106/1'e göre ihraççıların yöneticileri, henüz kamuya duyurulmamış ve fiyatları veya yatırımcıların
      kararlarını etkileyebilecek nitelikteki bilgilere dayalı olarak alım ya da satım emri verip kendisine veya
      bir başkasına menfaat temin ederlerse üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılırlar.
    celdiriciler:
      B: '"İki yıldan" alt sınırı eski düzenlemedir; 7222 sayılı Kanunla bu ibare "üç yıldan" olarak değiştirilmiştir.'
      C: Bilgi suistimali bir suçtur ve md. 106/1'de hapis veya adli para cezası öngörülmüştür; Kurulca verilen
        idari para cezası ise suç oluşturmayan fiiller (örneğin md. 103'teki aykırılıklar ve md. 104'teki piyasa
        bozucu eylemler) için öngörülmüştür.
      D: Hapis ve beş bin günden on bin güne kadar adli para cezasının birlikte verilmesi piyasa dolandırıcılığına
        ilişkin md. 107/1 hükmüdür; bilgi suistimalinde hapis veya adli para cezası seçimliktir.
      E: Bir yıldan üç yıla kadar hapis cezası md. 106'da yer almaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 106/1
    alinti: Doğrudan ya da dolaylı olarak sermaye piyasası araçları ya da ihraççılar hakkında, ilgili sermaye piyasası
      araçlarının fiyatlarını, değerlerini veya yatırımcıların kararlarını etkileyebilecek nitelikteki ve henüz
      kamuya duyurulmamış bilgilere dayalı olarak ilgili sermaye piyasası araçları için alım ya da satım emri veren
      veya verdiği emri değiştiren veya iptal eden ve bu suretle kendisine veya bir başkasına menfaat temin eden;
      a) İhraççıların veya bunların bağlı veya hâkim ortaklıklarının yöneticileri, ... üç yıldan beş yıla kadar
      hapis veya adli para cezası ile cezalandırılırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1 (karşılaştırma)
    alinti: (1) Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak
      yanlış veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler,
      emir değiştirenler veya hesap hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden
      on bin güne kadar adli para cezası ile cezalandırılırlar.
  gecerlilik:
    baslangic: '2020-02-25'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: C çeldiricisindeki "idari para cezası piyasa bozucu eylemler (md. 104) içindir" ifadesi
      md. 103 ve 104''ü örnek veren biçimde düzeltildi; gecerlilik.baslangic 2020-02-20 → 2020-02-25.'
    neden: 'G5/G6: idari para cezası yalnız md. 104''e özgü değildir (md. 103/1, 103/3, 103/4, 103/6 vb.); md. 106/1''deki
      "üç yıldan" ibaresini getiren 7222 sayılı Kanunun kabul tarihi 20/2/2020, yürürlüğü RG yayımı 25/2/2020''dir.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: A (güven 5) 6362 m.106: bilgi suistimali 3-5 yıl hapis veya adli para cezası (hapis ve
          adli para cezası m.107 piyasa dolandırıcılığı).'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: Anahtar A doğru (md. 106/1, 7222 ile "üç yıldan"); B eski metin, D md. 107/1, C ve E açıkça yanlış.
          C çeldirici açıklamasındaki mutlak ifade düzeltildi.
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: Alıntılar SPKn md. 106/1 ve 107/1 ile birebir; 7222 değişikliği dipnot 14 ile doğrulandı.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (A, güven 4)
- id: SMMM-SPK-SUC-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: piyasa bozucu eylemler
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: (K), Kurulca piyasa bozucu eylem olarak belirlenen, makul bir ekonomik veya finansal gerekçeyle açıklanamayan
    ve borsanın güven, açıklık ve istikrar içinde çalışmasını bozacak nitelikteki bir işlemi bir kez gerçekleştirmiş
    ve bu işlemden 1.000.000 TL tutarında brüt menfaat elde etmiştir. (K), bu menfaatin elde edilmesiyle bağlantılı
    olarak toplam 200.000 TL komisyon, vergi ve kredi faizi ödemiş; net kazancı 800.000 TL olmuştur. Eylem ayrıca
    bir suç oluşturmamaktadır. 6362 sayılı Sermaye Piyasası Kanunu'na göre (K) hakkında verilecek yaptırımla ilgili
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Eylem suç oluşturmadığından (K) hakkında herhangi bir yaptırım uygulanmaz.
    B: Kurul tarafından idari para cezası verilir; cezanın alt sınırı 2.000.000 TL'dir.
    C: Kurul tarafından idari para cezası verilir; cezanın alt sınırı 1.600.000 TL'dir.
    D: Mahkemece üç yıldan beş yıla kadar hapis cezası verilir.
    E: Kurul tarafından idari para cezası verilir; ancak miktar menfaat ne olursa olsun Kanunda yazılı üst sınırı
      aşamaz.
  dogru: B
  aciklama:
    dogru_neden: md. 104/1'e göre bir suç oluşturmayan ve Kurulca belirlenen piyasa bozucu eylemleri gerçekleştirenlere
      Kurul tarafından idari para cezası verilir; bu suretle menfaat temin edilmişse ceza miktarı menfaatin iki
      katından az olamaz. 7518 sayılı Kanunla eklenen md. 103/9, "bu maddede ve Kanunun 104 üncü maddesinde belirtilen
      menfaat hesaplamalarında" kişinin menfaatin elde edilmesiyle bağlantılı işlemlerde ödediği komisyon, vergi,
      kredi faizi gibi maliyetlerin dikkate alınmayacağını hükme bağlar; kural md. 103'te yer almakla birlikte md.
      104'teki menfaat hesabına da açıkça uygulanır. Bu nedenle menfaat brüt 1.000.000 TL'dir ve cezanın alt sınırı
      2 × 1.000.000 = 2.000.000 TL'dir.
    celdiriciler:
      A: md. 104/1 piyasa bozucu eylemleri tam da bir suç oluşturmadığı takdirde idari para cezasına bağlamıştır;
        suç oluşturmaması yaptırım uygulanmasını engellemez.
      C: Menfaat net (800.000 TL) alınarak iki katı hesaplanmıştır; oysa md. 103/9'a göre md. 104'teki menfaat hesabında
        komisyon, vergi ve kredi faizi gibi maliyetler dikkate alınmaz.
      D: Hapis cezası suç niteliğindeki fiiller (örneğin md. 106 bilgi suistimali, md. 107 piyasa dolandırıcılığı)
        için öngörülmüştür; kökte eylemin suç oluşturmadığı belirtildiğinden md. 104/1 uyarınca idari para cezası
        verilir.
      E: md. 104/1'de idari para cezasının, menfaat temin edilmişse menfaatin iki katından az olamayacağı belirtilmiştir;
        Kanundaki üst sınır bu alt sınırı bağlamaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 104/1
    alinti: (1) Makul bir ekonomik veya finansal gerekçeyle açıklanamayan, borsa ve teşkilatlanmış diğer piyasaların
      güven, açıklık ve istikrar içinde çalışmasını bozacak nitelikteki eylem ve işlemler, bir suç oluşturmadığı
      takdirde, piyasa bozucu nitelikte eylem sayılır. Kurulca belirlenen piyasa bozucu eylemleri gerçekleştiren
      kişilere Kurul tarafından yirmi bin Türk Lirasından beş yüz bin Türk Lirasına kadar idari para cezası verilir.
      Ancak, bu suretle menfaat temin edilmiş olması hâlinde verilecek idari para cezasının miktarı bu menfaatin
      iki katından az olamaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 103/9
    alinti: (9) (Ek:26/6/2024-7518/11 md.) Bu maddede ve Kanunun 104 üncü maddesinde belirtilen menfaat hesaplamalarında;
      kişinin menfaatin elde edilmesiyle bağlantılı işlemler ve faaliyetlerde ödediği komisyonlar, vergiler, kredi
      faizleri, danışmanlık ücretleri ve Kurulca benzer kapsamda olduğu değerlendirilen diğer maliyetler dikkate
      alınmaksızın ve elde edilen menfaatin nakde çevrilip çevrilmediğine bakılmaksızın hesaplama yapılır.
  gecerlilik:
    baslangic: '2024-07-02'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-05'
    kim: hakem
    ne: 'hakem 2026-10-05: kökte menfaatin brüt olduğu, net kazancın 800.000 TL olduğu ve eylemin bir kez işlendiği
      açıkça yazıldı; B ve C şıkları "ceza miktarı ... TL''den az olamaz" yerine "cezanın alt sınırı ... TL''dir"
      biçimine getirildi; dogru_neden''e md. 103/9''un md. 104''e açık atfı eklendi; D çeldiricisi örnekleyici yapıldı;
      gecerlilik.baslangic 2024-06-26 → 2024-07-02; surum 1 → 2.'
    neden: 'G5: "1.000.000 TL menfaat" brüt mü net mi belirsizdi; alt sınır 2.000.000 TL iken "1.600.000 TL''den
      az olamaz" önermesi mantıken de doğru olduğundan C savunulabilirdi; md. 105/2 (tekrar hâlinde üç kat) için
      örtük varsayım vardı. Atıf kontrolü: md. 103/9 "Bu maddede ve Kanunun 104 üncü maddesinde belirtilen menfaat
      hesaplamalarında" dediğinden md. 103/9 atfı doğrudur. 7518 sayılı Kanun RG 2/7/2024''te yayımlanmıştır.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-05'
      G3:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'kör çözücü: B (güven 5) 6362 m.104: idari para cezası menfaatin 2 katından az olamaz; m.103/9: komisyon,
          vergi, kredi faizi dikkate alınmaz -> 1.000.000 x 2 = 2.000.000.'
      G5:
        sonuc: gecti
        tarih: '2026-10-05'
        not: 'Düzeltildikten sonra geçti: brüt/net belirsizliği ve "az olamaz" mantık açığı giderildi; anahtar B
          (md. 104/1 + 103/9) tek doğru.'
      G6:
        sonuc: gecti
        tarih: '2026-10-05'
        not: Alıntılar SPKn md. 104/1 ve 103/9 ile birebir; md. 103/9'un 104'e uygulanması metinde açık.
      GZ:
        sonuc: gecti
        tarih: '2026-10-05'
        not: ortalama aday doğru (B, güven 3)
