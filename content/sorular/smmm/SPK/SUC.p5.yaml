- id: SMMM-SPK-SUC-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: bilgi suistimali
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre, bir ihraççının yöneticisi henüz kamuya duyurulmamış ve ilgili
    sermaye piyasası aracının fiyatını etkileyebilecek nitelikteki bilgiye dayanarak alım emri verip kendisine menfaat
    temin ederse, aşağıdaki yaptırımlardan hangisiyle karşılaşır?
  secenekler:
    A: Üç yıldan beş yıla kadar hapis veya adli para cezası
    B: İki yıldan beş yıla kadar hapis veya adli para cezası
    C: Yalnızca Kurul tarafından verilen idari para cezası
    D: Üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası
    E: Bir yıldan üç yıla kadar hapis cezası
  dogru: A
  aciklama:
    dogru_neden: md. 106/1'e göre ihraççıların yöneticileri, henüz kamuya duyurulmamış ve fiyatları veya yatırımcıların
      kararlarını etkileyebilecek nitelikteki bilgilere dayalı olarak alım ya da satım emri verip kendisine veya
      bir başkasına menfaat temin ederlerse üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılırlar.
    celdiriciler:
      B: '"İki yıldan" alt sınırı eski düzenlemedir; 7222 sayılı Kanunla bu ibare "üç yıldan" olarak değiştirilmiştir.'
      C: Bilgi suistimali bir suçtur ve md. 106/1'de hapis veya adli para cezası öngörülmüştür; idari para cezası
        piyasa bozucu eylemler (md. 104) içindir.
      D: Hapis ve beş bin günden on bin güne kadar adli para cezasının birlikte verilmesi piyasa dolandırıcılığına
        ilişkin md. 107/1 hükmüdür; bilgi suistimalinde hapis veya adli para cezası seçimliktir.
      E: Bir yıldan üç yıla kadar hapis cezası md. 106'da yer almaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 106/1
    alinti: Doğrudan ya da dolaylı olarak sermaye piyasası araçları ya da ihraççılar hakkında, ilgili sermaye piyasası
      araçlarının fiyatlarını, değerlerini veya yatırımcıların kararlarını etkileyebilecek nitelikteki ve henüz
      kamuya duyurulmamış bilgilere dayalı olarak ilgili sermaye piyasası araçları için alım ya da satım emri veren
      veya verdiği emri değiştiren veya iptal eden ve bu suretle kendisine veya bir başkasına menfaat temin eden;
      a) İhraççıların veya bunların bağlı veya hâkim ortaklıklarının yöneticileri, ... üç yıldan beş yıla kadar
      hapis veya adli para cezası ile cezalandırılırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1 (karşılaştırma)
    alinti: (1) Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak
      yanlış veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler,
      emir değiştirenler veya hesap hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden
      on bin güne kadar adli para cezası ile cezalandırılırlar.
  gecerlilik:
    baslangic: '2020-02-20'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-05'
