    B: Yalnız tüzel kişi hakkında idari para cezası verilir; A hakkında ceza uygulanamaz.
    C: A hakkında ve ayrıca tüzel kişi hakkında, 103 üncü maddenin birinci fıkrasına göre idari para cezası verilir.
    D: Tüzel kişi hakkında ceza verilebilmesi için ayrıca Kurulun özel bir izin kararı gerekir.
    E: A hakkında yalnız adli para cezası verilir; tüzel kişiye ise idari para cezası uygulanır.
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Sermaye Piyasası Kanunu md. 103/1, düzenlemelere ve Kurul kararlarına aykırı hareket eden kişilere
      idari para cezası öngörür. md. 103/2''ye göre aykırılığı yapan kişi özel hukuk tüzel kişisinin organı veya temsilcisi
      ise ayrıca tüzel kişi hakkında da birinci fıkra hükmüne göre idari para cezası verilir; ancak aykırılık tüzel kişinin
      zararına sonuç doğurmuşsa tüzel kişiye ceza verilmez. Somut olayda bu istisna gerçekleşmemiştir. Püf noktaları: Temsilciye
      uygulanan ceza ile tüzel kişiye ayrıca uygulanacak cezayı ve tüzel kişi lehine olan zarar istisnasını birlikte değerlendirin.'
    celdiriciler:
      A: md. 103/2, şartları oluştuğunda tüzel kişi hakkında ayrıca ceza verilmesini öngörür.
