  kok: Bir işlem, makul bir ekonomik veya finansal gerekçeyle açıklanamamakta ve borsa ile teşkilatlanmış diğer
    piyasaların güven, açıklık ve istikrar içinde çalışmasını bozacak nitelik taşımaktadır; ancak işlem bir suç
    oluşturmamaktadır. 6362 sayılı Sermaye Piyasası Kanunu'na göre aşağıdakilerden hangisi doğrudur?
