- id: SMMM-SPK-SUC-0009
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: denetim
  tip: kavrama
  zorluk: 2
  kok: Bir kripto varlık hizmet sağlayıcısının mali denetimi ile bilgi sistemleri bağımsız denetimi bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Her iki denetim Kurul personeli tarafından yapılır; bağımsız denetim kuruluşları görevlendirilemez.
    B: Mali denetim bağımsız denetim kuruluşlarınca, bilgi sistemleri denetimi ise yalnız TÜBİTAK tarafından yapılır.
    C: Mali denetim ve bilgi sistemleri bağımsız denetimi, Kurulca ilan edilen listede yer alan bağımsız denetim
      kuruluşlarınca yapılır.
    D: Bağımsız denetim kuruluşları denetimi yaptıktan sonra ulaştıkları sonuçlardan Kurul personeli de sorumludur.
    E: Bilgi sistemleri denetiminde Kurul personelinin denetçi bağımsızlığını zedeleyecek şekilde denetçi sıfatıyla
      katılması zorunludur.
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 99/B/2, kripto varlık hizmet sağlayıcılarının mali denetimi ve bilgi sistemleri bağımsız
      denetiminin Kurulca ilan edilen listede yer alan bağımsız denetim kuruluşlarınca yapılacağını açıkça düzenler.
    celdiriciler:
      A: md. 99/B/2 bağımsız denetim kuruluşlarını açıkça görevlendirir; denetim yalnız Kurul personeline bırakılmamıştır.
