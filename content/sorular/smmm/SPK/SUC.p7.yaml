    aykırı hareket etmiştir. A'nın bu aykırılığı, temsilcisi olduğu tüzel kişinin faaliyeti çerçevesinde gerçekleşmiş;
    ancak aykırılık tüzel kişinin zararına bir sonuç doğurmamıştır. Buna göre idari para cezası bakımından aşağıdakilerden
    hangisi doğrudur?
