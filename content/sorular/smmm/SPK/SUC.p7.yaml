        düzenlenmiştir.
      D: md. 103/2'de tüzel kişiye ayrıca ceza verilmesi için Kurulun özel bir izin kararı şartı yer almaz.
      E: Buradaki yaptırım md. 103 kapsamında idari para cezasıdır; somut olayın iki öznesi bakımından da bu hüküm uygulanır.
