  kok: Bir şirket yöneticisi, henüz kamuya duyurulmamış ve sermaye piyasası aracının fiyatını etkileyebilecek bir bilgiye
    dayanarak alım emri vermiş ve bu işlemden kendisine menfaat sağlamıştır. 6362 sayılı Sermaye Piyasası Kanunu'na göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Fiil yalnızca idari para cezasını gerektirir.
    B: Fiil bir yıldan üç yıla kadar hapis cezasını gerektirir.
    C: Fiil üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezasının birlikte verilmesini gerektirir.
    D: Fiil üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılır; adli para cezasına hükmedilirse ceza
      elde edilen menfaatin iki katından az olamaz.
    E: Fiil yalnızca işlem yasağı uygulanmasına yol açar.
  dogru: D
  aciklama:
    dogru_neden: SPKn md. 106/1, henüz kamuya duyurulmamış ve fiyatları, değerleri veya yatırımcı kararlarını etkileyebilecek
      bilgilere dayalı işlemle menfaat sağlayan sayılan kişilerin üç yıldan beş yıla kadar hapis veya adli para cezasıyla
      cezalandırılacağını; adli para cezasının da elde edilen menfaatin iki katından az olamayacağını düzenler.
    celdiriciler:
      A: Bilgi suistimali md. 106'da suç olarak düzenlenmiş ve hapis veya adli para cezası öngörülmüştür.
      B: Kaynakta alt sınır bir yıl değil, üç yıldır.
      C: Beş bin günden on bin güne kadar adli para cezasının hapisle birlikte verilmesi md. 107/1'deki piyasa dolandırıcılığına
        ilişkindir.
      E: Fiil yalnızca işlem yasağıyla sınırlı değildir; md. 106/1 cezai yaptırım öngörür.
