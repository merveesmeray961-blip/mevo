- id: SMMM-SPK-SUC-0005
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: bilgi suistimali
  tip: uygulama
  zorluk: 2
  kok: Bir şirket yöneticisi, henüz kamuya duyurulmamış ve sermaye piyasası aracının fiyatını etkileyebilecek bir
    bilgiye dayanarak alım emri vermiş ve bu işlemden kendisine menfaat sağlamıştır. 6362 sayılı Sermaye Piyasası
    Kanunu'na göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Fiil üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılır; adli para cezasına hükmedilirse
      ceza elde edilen menfaatin iki katından az olamaz.
    B: Fiil bir yıldan üç yıla kadar hapis cezasını gerektirir.
    C: Fiil üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezasının birlikte verilmesini
      gerektirir.
    D: Fiil yalnızca idari para cezasını gerektirir.
    E: Fiil yalnızca işlem yasağı uygulanmasına yol açar.
  dogru: A
  aciklama:
    dogru_neden: SPKn md. 106/1, henüz kamuya duyurulmamış ve fiyatları, değerleri veya yatırımcı kararlarını etkileyebilecek
      bilgilere dayalı işlemle menfaat sağlayan sayılan kişilerin üç yıldan beş yıla kadar hapis veya adli para
      cezasıyla cezalandırılacağını; adli para cezasının da elde edilen menfaatin iki katından az olamayacağını
      düzenler.
    celdiriciler:
      B: Kaynakta alt sınır bir yıl değil, üç yıldır.
      C: Beş bin günden on bin güne kadar adli para cezasının hapisle birlikte verilmesi md. 107/1'deki piyasa dolandırıcılığına
        ilişkindir.
      D: Bilgi suistimali md. 106'da suç olarak düzenlenmiş ve hapis veya adli para cezası öngörülmüştür.
      E: Fiil yalnızca işlem yasağıyla sınırlı değildir; md. 106/1 cezai yaptırım öngörür.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 106/1
    alinti: "Doğrudan ya da dolaylı olarak sermaye piyasası araçları ya da\nihraççılar hakkında, ilgili sermaye\
      \ piyasası araçlarının fiyatlarını, değerlerini veya yatırımcıların\n\fkararlarını etkileyebilecek nitelikteki\
      \ ve henüz kamuya duyurulmamış bilgilere dayalı olarak\nilgili sermaye piyasası araçları için alım ya da satım\
      \ emri veren veya verdiği emri değiştiren\nveya iptal eden ve bu suretle kendisine veya bir başkasına menfaat\
      \ temin eden;"
