      belirlenen bu eylemler için idari para cezası öngörür.
    celdiriciler:
      A: Bilgi suistimali için md. 106'da aranan henüz kamuya duyurulmamış bilgiye dayalı işlem unsuru bu olayda verilmemiştir.
      C: Kaynak hüküm ayrıca idari yaptırım öngörür; fiil yalnız özel hukuk sorumluluğuna indirgenemez.
      D: Suç oluşturmaması, md. 104 kapsamındaki idari yaptırımı ortadan kaldırmaz.
      E: Kanun doğrudan Kurul tarafından idari para cezası uygulanmasını öngörmektedir.
