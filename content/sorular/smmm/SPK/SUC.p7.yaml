    madde: md. 103/1-2
    alinti: 'MADDE 103 – (1) Bu Kanuna dayanılarak yapılan düzenlemelere, belirlenen standart

      ve formlara ve Kurulca alınan genel ve özel nitelikteki kararlara aykırı hareket eden kişilere

