    madde: md. 106/1
    alinti: 'üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılırlar. Ancak, bu

      suçtan dolayı adli para cezasına hükmedilmesi hâlinde verilecek ceza elde edilen menfaatin

