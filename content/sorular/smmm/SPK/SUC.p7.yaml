  kok: Bir özel hukuk tüzel kişisinin organı olan genel müdür, Kurulca alınan bir karara aykırı hareket etmiş ve bu aykırılık
    şirketin faaliyeti çerçevesinde gerçekleşmiştir. Aykırılığın şirketin zararına bir sonuç doğurduğu belirtilmemiştir. 6362
    sayılı Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnız genel müdüre idari para cezası verilebilir; tüzel kişiye hiçbir durumda ceza verilmez.
    B: Yalnız tüzel kişiye idari para cezası verilebilir; genel müdüre ceza verilemez.
    C: Hem genel müdür hem özel hukuk tüzel kişisi hakkında md. 103/1'e göre idari para cezası uygulanabilir.
    D: Fiil yalnız piyasa bozucu eylem oluşturursa idari para cezası verilebilir; Kurul kararına aykırılık ayrıca yaptırımsızdır.
    E: Tüzel kişi ancak zarar görmüşse idari para cezasına tabi olur.
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 103/1 Kurulca alınan genel ve özel nitelikteki kararlara aykırılık için idari para cezası öngörür.
      Md. 103/2'ye göre bu yükümlülüklere aykırı hareket eden kişi özel hukuk tüzel kişisinin organı veya temsilcisi ise ayrıca
      tüzel kişi hakkında da birinci fıkra hükmüne göre ceza verilir; ancak aykırılık tüzel kişinin zararına sonuç doğurmuşsa
      tüzel kişiye ceza verilmez. Soruda şirket zararının doğduğu belirtilmediğinden iki yönlü yaptırım kuralı uygulanır.
    celdiriciler:
      A: Md. 103/2, belirli koşullarda tüzel kişi hakkında ayrıca ceza verilmesini öngörür.
      B: Organ veya temsilci olan kişi de md. 103/1 kapsamında cezalandırılabilir.
      D: Kurul kararına aykırılık md. 103/1'de doğrudan idari para cezası sebebidir; piyasa bozucu eylem şartı aranmaz.
      E: Tüzel kişinin ceza almaması için zarar görmesi değil, aykırılığın tüzel kişinin zararına sonuç doğurması gerekir.
  kaynaklar:
