- id: SMMM-SPK-SUC-0031
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: piyasa bozucu eylemler
  tip: kavrama
  zorluk: 2
  kok: Piyasa bozucu eylem ile bilgi suistimali suçu arasındaki temel ayrım aşağıdakilerden hangisinde doğru olarak belirtilmiştir?
  secenekler:
    A: Piyasa bozucu eylem her durumda suçtur; bilgi suistimali yalnızca idari para cezası gerektirir.
    B: Piyasa bozucu eylem, makul ekonomik veya finansal gerekçeyle açıklanamayan ve suç oluşturmayan eylemleri kapsar; bilgi
      suistimali ise henüz kamuya duyurulmamış bilgilere dayalı menfaat teminini suç olarak düzenler.
    C: Her iki kavram da aynı idari para cezasına tabidir.
    D: Bilgi suistimali yalnızca borsa dışında, piyasa bozucu eylem yalnızca borsada işlenebilir.
    E: Piyasa bozucu eylem için menfaat temini şarttır; bilgi suistimalinde menfaat aranmaz.
  dogru: B
  aciklama:
    dogru_neden: 'SPKn md. 104/1 piyasa bozucu eylemi ''bir suç oluşturmadığı takdirde'' idari yaptırıma bağlarken, md. 106
      bilgi suistimalini henüz kamuya duyurulmamış bilgilere dayalı menfaat temini olarak suç sayar. Püf noktaları: İki hükmün
      birlikte okunması gerekir; biri idari, diğeri cezai yaptırımdır.'
    celdiriciler:
      A: Tersine çevrilmiştir; piyasa bozucu eylem suç oluşturmadığı takdirde idari, bilgi suistimali suçtur.
      C: Yaptırımlar farklıdır; biri idari para, diğeri hapis ve adli para cezasıdır.
      D: Her iki eylem de borsa ve teşkilatlanmış piyasalarda işlenebilir.
      E: md. 104 menfaat olmasa da idari ceza verir; md. 106 menfaat teminini arar.
