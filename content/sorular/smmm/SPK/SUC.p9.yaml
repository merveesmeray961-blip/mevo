- id: SMMM-SPK-SUC-0030
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: bilgi suistimali
  tip: uygulama
  zorluk: 3
  kok: Bir şirket yöneticisi, görevi nedeniyle öğrendiği ve henüz kamuya duyurulmamış, fiyatı etkileyebilecek nitelikteki
    bilgiyi kullanarak kendi hesabına alım emri vermiş ve bu işlemden kâr elde etmiştir. 6362 sayılı Kanunun 106
    ncı maddesi bakımından yöneticinin davranışının değerlendirilmesinde aşağıdakilerden hangisi belirleyicidir?
  secenekler:
    A: Bilginin görev nedeniyle öğrenilmiş olması; bu durumda işlem yapan kişi hakkında md. 106 uygulanmaz.
    B: Bilginin işlemden sonra kamuya açıklanmış olması; açıklama önceki işlemi hukuka uygun hâle getirir.
    C: Kamuya duyurulmamış ve fiyatı etkileyebilecek nitelikteki bilgiye dayanılarak emir verilmesi ve bu suretle
      menfaat sağlanması.
    D: Bilginin yazılı bir belge aracılığıyla edinilmiş olması; sözlü yolla edinilen bilgiler md. 106 kapsamı dışında
      kalır.
    E: İşlemin ihraççının yönetim kurulu kararıyla onaylanmış olması; onay bulunduğunda sorumluluk doğmaz.
  dogru: C
  aciklama:
    dogru_neden: Md. 106/1'e göre henüz kamuya duyurulmamış ve fiyatları, değerleri veya yatırımcı kararlarını etkileyebilecek
      nitelikteki bilgilere dayalı olarak alım veya satım emri veren ve bu suretle kendisine veya bir başkasına
      menfaat temin eden, ihraççı yöneticisi gibi sayılan kişiler bilgi suistimali suçundan cezalandırılır. Belirleyici
      ölçüt, bilginin niteliği, bilgiye dayalı emir verilmesi ve menfaat temin edilmesidir.
    celdiriciler:
      A: Md. 106/1-a ihraççıların yöneticilerini ve md. 106/1-c görev nedeniyle bilgiye sahip olanları açıkça kapsar;
        görev nedeniyle bilgi edinmek sorumluluğu kaldırmaz.
      B: Md. 106/1 suçu bilgiye dayalı emir verilmesiyle oluşturur; bilginin sonradan açıklanması gerçekleşmiş fiili
        hukuka uygun hâle getirmez.
      D: Md. 106/1 bilginin edinme biçimini (yazılı veya sözlü) ayırt etmez; ölçüt bilginin niteliği ve ona dayalı
        emir verilmesidir.
      E: Yönetim kurulu onayı md. 106/1'deki unsurları ortadan kaldırmaz; md. 108'deki istisnalar arasında da yer
        almaz.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 106/1
    alinti: henüz kamuya duyurulmamış bilgilere dayalı olarak ilgili sermaye piyasası araçları için alım ya da satım
