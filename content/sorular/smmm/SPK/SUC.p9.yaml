      A: Kanun fiil türlerini tek bir idari ihlal olarak birleştirmez.
      B: Kanuni düzenleme bilgi temelli ve işlem temelli fiilleri ayırır.
      D: Düzenleme yalnız halka arz dönemine özgülenmemiştir.
