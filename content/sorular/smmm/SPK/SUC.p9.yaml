  kok: Piyasa bozucu eylem ile bilgi suistimali suçu arasındaki temel ayrım aşağıdakilerden hangisinde doğru olarak
    belirtilmiştir?
  secenekler:
    A: Piyasa bozucu eylem suçtur; bilgi suistimali ise idari para cezası gerektirir.
    B: Piyasa bozucu eylem için menfaat temini şarttır; bilgi suistimali suçunda ise menfaat aranmaz.
    C: Her iki kavram da aynı idari para cezasına tabidir.
    D: Bilgi suistimali borsa dışında, piyasa bozucu eylem ise borsada işlenebilir.
    E: Piyasa bozucu eylem suç oluşturmayan ve makul gerekçeyle açıklanamayan eylemlerdir; bilgi suistimali ise
      suçtur.
  dogru: E
  aciklama:
    dogru_neden: 'SPKn md. 104/1 piyasa bozucu eylemi ''bir suç oluşturmadığı takdirde'' idari yaptırıma bağlarken,
      md. 106 bilgi suistimalini henüz kamuya duyurulmamış bilgilere dayalı menfaat temini olarak suç sayar. Püf
      noktaları: İki hükmün birlikte okunması gerekir; biri idari, diğeri cezai yaptırımdır.'
    celdiriciler:
      A: Tersine çevrilmiştir; piyasa bozucu eylem suç oluşturmadığı takdirde idari, bilgi suistimali suçtur.
      B: md. 104 menfaat olmasa da idari ceza verir; md. 106 menfaat teminini arar.
      C: Yaptırımlar farklıdır; biri idari para, diğeri hapis ve adli para cezasıdır.
      D: Her iki eylem de borsa ve teşkilatlanmış piyasalarda işlenebilir.
