- id: SMMM-SPK-SUC-0029
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: kavrama
  zorluk: 2
  kok: Bir incelemede, bir kişinin sermaye piyasası aracının fiyatı hakkında yanıltıcı izlenim yaratmak amacıyla
    emirler verdiği; başka bir kişinin ise yatırımcı kararlarını etkilemek amacıyla yanlış bilgi yayarak menfaat
    sağladığı tespit edilmiştir. 6362 sayılı Kanun bakımından bu iki davranışın değerlendirilmesinde aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: İki davranış da emir ve işleme dayandığından 107 nci maddenin birinci fıkrası kapsamında değerlendirilir.
    B: Birinci kişinin davranışı bilgi suistimali (md. 106), ikinci kişinin davranışı ise 107 nci maddenin ikinci
      fıkrası kapsamında değerlendirilir.
    C: Birinci kişinin davranışı 107 nci maddenin birinci fıkrası, ikinci kişinin davranışı ise ikinci fıkrası kapsamında
      değerlendirilir.
    D: Birinci kişinin davranışı suç oluşturmadığından piyasa bozucu eylem (md. 104) sayılır; ikinci kişinin davranışı
      107 nci maddenin ikinci fıkrası kapsamındadır.
    E: Birinci kişinin davranışı 107 nci maddenin ikinci fıkrası, ikinci kişinin davranışı ise birinci fıkrası kapsamında
      değerlendirilir.
  dogru: C
  aciklama:
    dogru_neden: Md. 107/1, fiyatlara ilişkin yanlış veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım
      yapanları, emir verenleri, emir iptal edenleri veya değiştirenleri (işlem temelli piyasa dolandırıcılığı);
      md. 107/2 ise fiyatları, değerleri veya yatırımcı kararlarını etkilemek amacıyla yalan, yanlış veya yanıltıcı
      bilgi verenleri, söylenti çıkaranları ve bu suretle menfaat sağlayanları (bilgi temelli piyasa dolandırıcılığı)
      düzenler. Bu nedenle emir veren kişinin fiili birinci, yanlış bilgi yayarak menfaat sağlayan kişinin fiili
      ikinci fıkraya girer.
    celdiriciler:
      A: Yanlış bilgi yayarak menfaat sağlama, emir ve işlem temelli değil bilgi temelli bir fiildir ve md. 107/2'de
        ayrıca düzenlenmiştir.
      B: Bilgi suistimali (md. 106) kamuya duyurulmamış bilgiye dayalı emir verme fiilidir; yanıltıcı izlenim amacıyla
        emir verme md. 107/1'e girer.
      D: Yanıltıcı izlenim amacıyla emir vermek md. 107/1 kapsamında suçtur; md. 104 yalnızca suç oluşturmayan eylemler
        için uygulanır.
      E: 'Fıkralar ters eşleştirilmiştir: emir ve işleme dayalı fiil birinci, yanlış bilgi yayma fiili ikinci fıkradadır.'
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1
    alinti: Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak yanlış
      veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler, emir
      değiştirenler veya hesap hareketleri gerçekleştirenler
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/2
    alinti: yalan, yanlış veya yanıltıcı bilgi veren, söylenti çıkaran, haber veren, yorum yapan veya rapor hazırlayan
      ya da bunları yayan ve bu suretle menfaat sağlayanlar üç yıldan beş yıla kadar hapis ve beş bin güne kadar
      adli para cezası ile cezalandırılırlar.
