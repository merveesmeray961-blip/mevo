  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 104/1
    alinti: Makul bir ekonomik veya finansal gerekçeyle açıklanamayan, borsa ve teşkilatlanmış diğer piyasaların güven, açıklık
      ve istikrar içinde çalışmasını bozacak nitelikteki eylem ve işlemler, bir suç oluşturmadığı takdirde, piyasa bozucu
      nitelikte eylem sayılır.
