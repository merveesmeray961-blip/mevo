    C: Davranışın hangi piyasa dolandırıcılığı türüne girdiği, fiilin niteliği ve ilgili kanun hükmü incelenerek belirlenir.
    D: Piyasa dolandırıcılığı yalnız halka arz döneminde işlenebilir.
