      niteliği ile işlem arasındaki ilişki dikkate alınır. Püf noktaları: Sadece bilgiye erişim değil, kanundaki fiil ve amaç
      unsurları birlikte değerlendirilmelidir.'
    celdiriciler:
      A: Görev nedeniyle bilgi edinilmesi fiilin değerlendirilmesini engellemez.
      B: Sonradan açıklama, daha önceki işlemi kendiliğinden hukuka uygun hâle getirmez.
      D: Bilgi suistimali yalnız ilk halka arzla sınırlı değildir.
      E: Unvan tek başına tüm unsurların yerine geçmez.
