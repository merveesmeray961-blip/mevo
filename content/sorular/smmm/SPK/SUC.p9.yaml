  tip: uygulama
  zorluk: 3
  kok: Bir şirket yöneticisi, görevi nedeniyle öğrendiği henüz kamuya açıklanmamış fiyatı etkileyebilecek bilgiyi kullanarak
    işlem yapmıştır. Aynı bilgiyi alan başka bir kişi ise bilgiyi kullanmadan önce kamuya açıklanmasını beklemiştir. İlk kişinin
    davranışını değerlendirirken aşağıdaki ölçütlerden hangisi belirleyicidir?
  secenekler:
    A: Bilginin yalnız şirket içinde öğrenilmiş olması, fiilin değerlendirilmesini tamamen engeller.
    B: Bilginin daha sonra kamuya açıklanması, önceki kullanımın her durumda hukuka uygun olduğu anlamına gelir.
    C: Bilginin fiyat veya yatırımcı kararları bakımından niteliği ve kişinin bu bilgiye dayanarak işlem yapıp yapmadığı ilgili
      kanun hükmü çerçevesinde incelenir.
    D: Bilgi suistimali yalnız şirket paylarının ilk halka arzında söz konusu olabilir.
    E: Kişinin yönetici olması, işlem amacı ve bilgi niteliği incelenmeksizin otomatik olarak suçun oluştuğunu gösterir.
