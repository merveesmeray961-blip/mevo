- id: SMMM-SPK-SUC-0028
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar
  konu: SUC
  kazanim: Kurul tedbirleri
  tip: kavrama
  zorluk: 2
  kok: Kurulun piyasa bozucu eylemler, bilgi suistimali ve piyasa dolandırıcılığı incelemelerinde uygulayabileceği
    tedbirlere ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Kurul, bu fiilleri işlediğine dair makul şüphe bulunan kişiler bakımından tedbirleri ancak mahkeme kararı
      alındıktan sonra uygulayabilir.
    B: Kurul, makul şüphe bulunan kişiler ve ilgili sermaye piyasası araçları bakımından borsalarda geçici veya
      sürekli olarak işlem yapılmasını yasaklayabilir.
    C: Kurul, makul şüphe bulunan kişiler ve ilgili sermaye piyasası araçları bakımından teminat yükümlülüğü getirebilir
      veya yükümlülüğü değiştirebilir.
    D: Kurul, makul şüphe bulunan kişiler ve ilgili sermaye piyasası araçları bakımından kredili alım, açığa satış,
      ödünç alma ve verme işlemlerine sınırlama getirebilir.
    E: Kurul, makul şüphe bulunan kişiler ve ilgili sermaye piyasası araçları bakımından işlem veya pozisyon limiti
      getirebilir.
  dogru: A
  aciklama:
    dogru_neden: Md. 101/1'e göre Kurul, 104, 106 ve 107 nci maddelerde sayılan fiilleri işlediğine dair makul şüphe
      bulunan kişiler ile ilgili sermaye piyasası araçlarına ilişkin olarak borsalarda işlem yasağı, takas yöntemlerinin
      değiştirilmesi, işlem sınırlamaları, teminat yükümlülüğü, işlem veya pozisyon limiti gibi piyasanın etkin
      ve sağlıklı işleyişini teminen gerekli her türlü tedbiri almaya yetkilidir. Tedbir için mahkeme kararı şartı
      aranmaz; bu nedenle A ifadesi yanlıştır.
    celdiriciler:
      B: Md. 101/1-a, borsalarda geçici veya sürekli işlem yapılmasının yasaklanmasını Kurula tedbir olarak tanır;
        ifade doğrudur.
      C: Md. 101/1-ç, teminat yükümlülüğü getirilmesini veya değiştirilmesini tedbir olarak sayar; ifade doğrudur.
      D: Md. 101/1-c, kredili alım, açığa satış, ödünç alma ve verme işlemlerine sınırlama getirilmesini tedbir
        olarak sayar; ifade doğrudur.
      E: Md. 101/1-f, işlem veya pozisyon limiti getirilmesini tedbir olarak sayar; ifade doğrudur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 101/1
    alinti: Kurul, 104 üncü, 106 ncı ve 107 nci maddelerde sayılan fiilleri işlediğine dair makul şüphe bulunan
      gerçek veya tüzel kişiler ile tüzel kişilerin yetkilileri ile ilgili sermaye piyasası araçlarına ilişkin olarak;
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 101/1-a
    alinti: a) Borsalarda geçici veya sürekli olarak işlem yapılmasının yasaklanması,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 101/1-c
    alinti: c) Kredili alım, açığa satış, ödünç alma ve verme işlemlerine ilişkin sınırlamalar getirilmesi,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 101/1-ç
    alinti: ç) Teminat yükümlülüğü getirilmesi veya yükümlülüğün değiştirilmesi,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 101/1-f
    alinti: f) İşlem veya pozisyon limiti getirilmesi,
