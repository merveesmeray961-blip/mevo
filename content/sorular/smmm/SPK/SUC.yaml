- id: SMMM-SPK-SUC-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Bir yatırımcı, borsada işlem gören bir payın fiyatı ve arzı hakkında yanlış ve yanıltıcı izlenim uyandırmak
    amacıyla kendi kontrolündeki hesaplar arasında karşılıklı alım satım emirleri vermiş ve bu yolla menfaat elde
    etmiştir. Hakkında 6362 sayılı Sermaye Piyasası Kanunu'nun 107. maddesinin birinci fıkrası kapsamında soruşturma
    başlatılmış; yatırımcı, soruşturma evresinde pişmanlık göstererek Kanunda öngörülen tutardaki parayı Hazineye
    ödemiştir. Bu kişi hakkında aşağıdakilerden hangisi uygulanır?
  secenekler:
    A: Verilecek ceza yarısı oranında indirilir.
    B: Hakkında cezaya hükmolunmaz.
    C: Verilecek ceza üçte biri oranında indirilir.
    D: Verilecek ceza dörtte biri oranında indirilir.
    E: Pişmanlık hükmü uygulanmaz; ceza indirimsiz olarak verilir.
  dogru: A
  aciklama:
    dogru_neden: Fiyat, arz ve talep hakkında yanlış veya yanıltıcı izlenim uyandırmak amacıyla emir vermek SPKn
      md. 107/1'de tanımlanan (işlem bazlı) piyasa dolandırıcılığıdır. md. 107/3'e göre bu suçu işleyen kişi pişmanlık
      göstererek beş yüz bin Türk lirasından az olmamak üzere elde ettiği veya elde edilmesine sebep olduğu menfaatin
      iki katı kadar parayı Hazineye soruşturma evresinde öderse verilecek ceza yarısı oranında indirilir.
    celdiriciler:
      B: md. 107/3-(a) uyarınca cezaya hükmolunmaması, ödemenin henüz soruşturma başlamadan önce yapılması hâlinde
        söz konusudur; somut olayda soruşturma başlamıştır.
      C: md. 107/3-(c) uyarınca üçte bir oranında indirim, ödemenin kovuşturma evresinde hüküm verilinceye kadar
        yapılması hâlinde uygulanır.
      D: md. 107/3'te dörtte bir oranında bir indirim öngörülmemiştir.
      E: md. 107/3, pişmanlık hükmünü açıkça birinci fıkrada tanımlanan suç için düzenlemiştir; somut olay birinci
        fıkra kapsamında olduğundan pişmanlık hükmü uygulanır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/1
    alinti: Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak yanlış
      veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler, emir
      değiştirenler veya hesap hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden on
      bin güne kadar adli para cezası ile cezalandırılırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/3
    alinti: Birinci fıkrada tanımlanan suçu işleyen kişi pişmanlık göstererek, beş yüz bin Türk Lirasından az olmamak
      üzere, elde ettiği veya elde edilmesine sebep olduğu menfaatin iki katı miktarı kadar parayı, Hazineye; a)
      Henüz soruşturma başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz. b) Soruşturma evresinde ödediği
      takdirde, verilecek ceza yarısı oranında indirilir. c) Kovuşturma evresinde hüküm verilinceye kadar ödediği
      takdirde, verilecek ceza üçte biri oranında indirilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: A (güven 5); B: A (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday yanlış (güven 1)
- id: SMMM-SPK-SUC-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: görevli mahkeme
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: Faaliyet izni yürürlükte olan kripto varlık hizmet sağlayıcısı (K) A.Ş.'nin yönetim kurulu üyesi (M), görevi
    nedeniyle saklama ve gözetimiyle yükümlü olduğu müşteri kripto varlıklarını kendi zimmetine geçirmiştir. Fiil,
    6362 sayılı Sermaye Piyasası Kanunu'nun 110/A maddesinin birinci fıkrasında tanımlanan zimmet suçunu oluşturmaktadır.
    Kanun'a göre bu suçun soruşturma ve yargılama usulü bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Gecikmesinde sakınca bulunan hâllerde Cumhuriyet savcısı, Kurulun yazılı başvurusunu beklemeksizin resen
      soruşturma başlatabilir.
    B: Dava, Hâkimler ve Savcılar Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemesinde görülür.
    C: Dava, kural olarak fiilin işlendiği yerin bağlı olduğu ilin adıyla anılan (1) numaralı ağır ceza mahkemesinde
      görülür.
    D: Soruşturma ve kovuşturmada, 5411 sayılı Kanun'un 166. maddesinde yer alan hükümler uygulanır.
    E: Mahkûmiyet hâlinde, Hazineye olan borç ve tazminatlar ödenmemiş olsa bile hükümlü hakkında koşullu salıverilme
      hükümleri uygulanabilir.
  dogru: C
  aciklama:
    dogru_neden: 'Zor soru; üç teknik birlikte kullanılır: istisnanın istisnası, madde birleştirme (md. 110/A, 115,
      115/A ve 116) ve yakın kavram ayrımı (md. 110/A-(1)''deki zimmet ile md. 110/A-(3)''te faaliyet izni kaldırılan
      sağlayıcının gerçek kişi ortaklarının zimmet sayılan fiilleri). Görevli mahkemede genel kural md. 116/1''dir:
      Kanunda tanımlanan suçlarda ihtisas mahkemesi olarak görevlendirilen asliye ceza mahkemeleri yetkilidir. 7518
      sayılı Kanunla eklenen md. 115/A-(3) bu kurala istisna getirir: Kanunda tanımlanan zimmet suçuna ait davalar,
      fiilin işlendiği yerin bağlı olduğu ilin adıyla anılan (1) numaralı ağır ceza mahkemelerinde görülür (gerekli
      yerlerde diğer ağır ceza mahkemeleri de görevlendirilebilir). M''nin fiili md. 110/A-(1)''deki zimmet suçu
      olduğundan C doğrudur. Tuzak: md. 115/A''nın fıkraları farklı kapsamlara sahiptir. Resen soruşturma (115/A-(1))
      ve 5411 sayılı Kanun md. 166''nın uygulanması (115/A-(4)) yalnız md. 110/A-(3)''teki suç için öngörülmüştür;
      md. 110/A-(1) suçunda soruşturma bakımından genel kural olan md. 115/1''e (Kurulun yazılı başvurusu, muhakeme
      şartı) geri dönülür. Buna karşılık görevli mahkemeye ilişkin 115/A-(3) zimmet suçunun tamamını, koşullu salıverilme
      yasağına ilişkin 115/A-(5) ise md. 110/A''da yazılı tüm suçları kapsar.'
    celdiriciler:
      A: 'Kurul bildirimi olmaksızın, gecikmesinde sakınca görülen hâllerde resen soruşturma imkânı md. 115/A-(1)
        uyarınca yalnız md. 110/A-(3)''te belirtilen suç için tanınmıştır. M''nin fiili md. 110/A-(1) kapsamında
        olduğundan genel kural uygulanır: md. 115/1''e göre soruşturma yapılması Kurulun Cumhuriyet başsavcılığına
        yazılı başvurusuna bağlıdır ve bu başvuru muhakeme şartıdır.'
      B: İhtisas mahkemesi olarak görevlendirilen asliye ceza mahkemelerinin yetkisi md. 116/1'deki genel kuraldır;
        md. 115/A-(3) Kanunda tanımlanan zimmet suçuna ait davaları ağır ceza mahkemelerine vermiştir. İstisnayı
        gözden kaçıran aday bu şıkkı seçer.
      D: md. 115/A-(4)'e göre 5411 sayılı Kanun md. 166 hükümleri yalnız md. 110/A'nın üçüncü fıkrası kapsamına
        giren suçların soruşturma ve kovuşturmalarında uygulanır; md. 110/A-(1) suçu bu kapsamda değildir.
      E: md. 115/A-(5)'e göre md. 110/A'da yazılı suçlardan mahkûm olanlar hakkında, Hazineye olan borçları ve tazminatları
        ödenmedikçe veya malvarlıklarından tahsil olunamadıkça koşullu salıverilme hükümleri uygulanmaz; bu yasak
        md. 110/A'nın birinci fıkrasındaki suçu da kapsar.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: 'md. 110/A-(1) (Ek: 26/6/2024-7518/13 md.)'
    alinti: Kripto varlık hizmet sağlayıcı görevi nedeniyle kendisine tevdi edilmiş olan veya koruma, saklama ve
      gözetimiyle yükümlü olduğu para veya para yerine geçen evrak veya senetleri, diğer malları veya kripto varlıkları
      kendisinin ya da başkasının zimmetine geçiren kripto varlık hizmet sağlayıcı yönetim kurulu başkan ve üyeleri
      ile diğer mensupları, sekiz yıldan on dört yıla kadar hapis ... ile cezalandırılacakları gibi kripto varlık
      hizmet sağlayıcının zararını tazmine mahkûm edilirler.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 115/1
    alinti: Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı soruşturma yapılması, Kurul tarafından
      Cumhuriyet başsavcılığına yazılı başvuruda bulunulmasına bağlıdır. Bu başvuru muhakeme şartı niteliğindedir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: 'md. 115/A-(1), (4) (Ek: 26/6/2024-7518/15 md.)'
    alinti: (1) Bu Kanunun 110/A maddesinin üçüncü fıkrasında belirtilen suçtan dolayı soruşturma ve kovuşturmalar
      Kurulun yazılı bildirimi üzerine veya gecikmesinde sakınca görülen hâllerde resen Cumhuriyet savcılarınca
      yapılır ve Kurul haberdar edilir. ... (4) Bu Kanunun 110/A maddesinin üçüncü fıkrası kapsamına giren suçların
      soruşturma ve kovuşturmalarında 5411 sayılı Kanunun 166 ncı maddesinde yer alan hükümler tatbik olunur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: 'md. 115/A-(3), (5) (Ek: 26/6/2024-7518/15 md.)'
    alinti: (3) Bu Kanunda tanımlanan zimmet suçuna ait davalar, fiilin işlendiği yerin bağlı olduğu ilin adıyla
      anılan (1) numaralı ağır ceza mahkemelerinde görülür. ... (5) Bu Kanunun 110/A maddesinde yazılı suçlardan
      dolayı mahkûm olanlar, Hazineye olan borçları ve tazminatları ödemediği veya bu borçlar ve tazminatlar malvarlıklarından
      tahsil olunamadığı sürece, bunlar hakkında koşullu salıverilme hükümleri uygulanmaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 116/1
    alinti: Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı yargılama yapmaya Hâkimler ve Savcılar
      Yüksek Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri yetkilidir.
  gecerlilik:
    baslangic: '2024-07-02'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: Kök md. 110/A-(1) zimmet suçu senaryosuna dönüştürüldü (olumsuz kök → standart); şıklar md. 115/1, 115/A
      ve 116 ilişkisine göre yeniden yazıldı; doğru şık D → C; tip bilgi → uygulama; zorluk 1 → 3 (istisnanın istisnası
      + madde birleştirme + yakın kavram ayrımı); kaynaklara md. 110/A-(1) ve 115/A eklendi; gecerlilik.baslangic
      2012-12-30 → 2024-07-02 (7518 s. K. yürürlüğü).
    neden: 'G5/G6 kaldı: md. 115/A (7518 s. K. ile eklendi) zimmet davalarını ağır ceza mahkemesine verdiğinden
      D, 110/A-(3) için resen soruşturma öngördüğünden A şıkkı da savunulabilir ''yanlış'' idi; dogru_neden md.
      115/A-(3) ile çelişiyordu.'
