- id: SMMM-SPK-SUC-0001
  sinav: smmm
  bolum: [YET]
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: >-
    Bir yatırımcı, borsada işlem gören bir payın fiyatı ve arzı hakkında yanlış ve yanıltıcı izlenim
    uyandırmak amacıyla kendi kontrolündeki hesaplar arasında karşılıklı alım satım emirleri vermiş ve bu
    yolla menfaat elde etmiştir. Hakkında 6362 sayılı Sermaye Piyasası Kanunu'nun 107. maddesinin birinci
    fıkrası kapsamında soruşturma başlatılmış; yatırımcı, soruşturma evresinde pişmanlık göstererek
    Kanunda öngörülen tutardaki parayı Hazineye ödemiştir. Bu kişi hakkında aşağıdakilerden hangisi
    uygulanır?
  secenekler:
    A: "Verilecek ceza yarısı oranında indirilir."
    B: "Hakkında cezaya hükmolunmaz."
    C: "Verilecek ceza üçte biri oranında indirilir."
    D: "Verilecek ceza dörtte biri oranında indirilir."
    E: "Pişmanlık hükmü uygulanmaz; ceza indirimsiz olarak verilir."
  dogru: A
  aciklama:
    dogru_neden: >-
      Fiyat, arz ve talep hakkında yanlış veya yanıltıcı izlenim uyandırmak amacıyla emir vermek SPKn md.
      107/1'de tanımlanan (işlem bazlı) piyasa dolandırıcılığıdır. md. 107/3'e göre bu suçu işleyen kişi
      pişmanlık göstererek beş yüz bin Türk lirasından az olmamak üzere elde ettiği veya elde edilmesine
      sebep olduğu menfaatin iki katı kadar parayı Hazineye soruşturma evresinde öderse verilecek ceza
      yarısı oranında indirilir.
    celdiriciler:
      B: "md. 107/3-(a) uyarınca cezaya hükmolunmaması, ödemenin henüz soruşturma başlamadan önce yapılması hâlinde söz konusudur; somut olayda soruşturma başlamıştır."
      C: "md. 107/3-(c) uyarınca üçte bir oranında indirim, ödemenin kovuşturma evresinde hüküm verilinceye kadar yapılması hâlinde uygulanır."
      D: "md. 107/3'te dörtte bir oranında bir indirim öngörülmemiştir."
      E: "md. 107/3, pişmanlık hükmünü açıkça birinci fıkrada tanımlanan suç için düzenlemiştir; somut olay birinci fıkra kapsamında olduğundan pişmanlık hükmü uygulanır."
  kaynaklar:
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 107/1"
      alinti: "Sermaye piyasası araçlarının fiyatlarına, fiyat değişimlerine, arz ve taleplerine ilişkin olarak yanlış veya yanıltıcı izlenim uyandırmak amacıyla alım veya satım yapanlar, emir verenler, emir iptal edenler, emir değiştirenler veya hesap hareketleri gerçekleştirenler üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası ile cezalandırılırlar."
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 107/3"
      alinti: "Birinci fıkrada tanımlanan suçu işleyen kişi pişmanlık göstererek, beş yüz bin Türk Lirasından az olmamak üzere, elde ettiği veya elde edilmesine sebep olduğu menfaatin iki katı miktarı kadar parayı, Hazineye; a) Henüz soruşturma başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz. b) Soruşturma evresinde ödediği takdirde, verilecek ceza yarısı oranında indirilir. c) Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, verilecek ceza üçte biri oranında indirilir."
  gecerlilik:
    baslangic: "2012-12-30"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"

- id: SMMM-SPK-SUC-0002
  sinav: smmm
  bolum: [YET]
  ders: SPK
  unite: Suçlar, idari yaptırımlar ve tedbirler
  konu: SUC
  kazanim: görevli mahkeme
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: >-
    6362 sayılı Sermaye Piyasası Kanunu'nda tanımlanan suçlara ilişkin soruşturma ve yargılama usulü
    bakımından aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: "Soruşturma yapılması, Kurulun Cumhuriyet başsavcılığına yazılı başvuruda bulunmasına bağlıdır ve bu başvuru muhakeme şartı niteliğindedir."
    B: "Başvuru üzerine kamu davası açılması hâlinde iddianamenin kabulüyle birlikte Kurul katılan sıfatını kazanır."
    C: "Soruşturmada kovuşturmaya yer olmadığı kararı verilmesi hâlinde Kurul, bu karara itiraz etmeye yetkilidir."
    D: "Bu suçlardan dolayı yargılama yapmaya, ihtisas mahkemesi olarak görevlendirilen ağır ceza mahkemeleri yetkilidir."
    E: "Soruşturma sırasında Cumhuriyet savcısı, Kurul meslek personelinden yararlanabilir."
  dogru: D
  aciklama:
    dogru_neden: >-
      SPKn md. 116/1'e göre Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı yargılama yapmaya
      Hâkimler ve Savcılar Yüksek Kurulunun (Kanun metnindeki ifadeyle) ihtisas mahkemesi olarak
      görevlendireceği asliye ceza mahkemeleri yetkilidir. Ağır ceza mahkemesi öngörülmediğinden ifade yanlıştır.
    celdiriciler:
      A: "md. 115/1'e göre soruşturma yapılması Kurulun Cumhuriyet başsavcılığına yazılı başvurusuna bağlıdır ve bu başvuru muhakeme şartıdır; ifade doğrudur."
      B: "md. 115/2'ye göre kamu davası açılması hâlinde iddianamenin kabulüyle birlikte bir örneği Kurula tebliğ edilir ve Kurul katılan sıfatını kazanır; ifade doğrudur."
      C: "md. 115/4'e göre kovuşturmaya yer olmadığı kararına karşı Kurul itiraza yetkilidir; ifade doğrudur."
      E: "md. 115/3'e göre Cumhuriyet savcısı soruşturmada Kurul meslek personelinden yararlanabilir; ifade doğrudur."
  kaynaklar:
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 115/1–4"
      alinti: "(1) Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı soruşturma yapılması, Kurul tarafından Cumhuriyet başsavcılığına yazılı başvuruda bulunulmasına bağlıdır. Bu başvuru muhakeme şartı niteliğindedir. (2) Başvuru üzerine kamu davası açılması hâlinde iddianamenin kabulü ile birlikte, bir örneği Kurula tebliğ edilir ve Kurul aynı zamanda katılan sıfatını kazanır. ... Cumhuriyet savcısı, Kurul meslek personelinden yararlanabilir. ... kovuşturmaya yer olmadığı kararının verilmesi hâlinde, Kurul bu karara karşı itiraza yetkilidir."
    - mevzuat: "6362 sayılı Sermaye Piyasası Kanunu"
      madde: "md. 116/1"
      alinti: "Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı yargılama yapmaya Hâkimler ve Savcılar Yüksek Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri yetkilidir."
  gecerlilik:
    baslangic: "2012-12-30"
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: "claude"
    istem_surumu: "uretim.md v1"
