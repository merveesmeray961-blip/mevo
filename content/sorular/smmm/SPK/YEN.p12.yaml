      tazmin hükümlerine tabi değildir.
    celdiriciler:
      A: İzin kamu güvencesi anlamına gelmez; ayrıca kripto varlıklar tazmin hükümlerine tabi değildir.
      B: Kripto varlıklar md. 82 kapsamındaki tazmin hükümlerine tabi değildir; yalnızca kamu güvencesinin bulunmadığı kısmı
        doğrudur.
      C: Bankalar nezdinde saklanan kripto varlıklar da kamu güvencesi veya mevduat sigortası kapsamına girmez (md. 35/C/6).
      D: Tazmin kapsamı bir talebe bağlı değildir; kripto varlıklar kanunen tazmin hükümlerinin dışında bırakılmıştır.
