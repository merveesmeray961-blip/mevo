- id: SMMM-SPK-YEN-0050
  sinav: smmm
  bolum: &id001
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: 35/B ortakların niteliği kaybetmesi
  tip: uygulama
  zorluk: 3
  kok: Bir kripto varlık hizmet sağlayıcının sermayesinin %12'sine sahip gerçek kişi ortak O, kasten işlenen bir suçtan beş
    yıl hapis cezasına mahkûm edilerek 6362 sayılı Kanun md. 35/B/3-a'daki şartlardan birini kaybetmiştir. Kanuna göre O'nun
    payları bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Payları bir yıl içinde herhangi bir kişiye serbestçe devredebilir
    B: Payları devretmek zorunda değildir; yalnızca oy haklarını kullanamaz
    C: Sahip olduğu payları, aranan şartları sağlayan kişilere altı ay içinde devretmesi gerekir
    D: Payları otuz gün içinde Kurula devretmek zorundadır
    E: Payları derhâl hükümsüz sayılır ve şirket sermayesinden düşülür
  dogru: C
  aciklama:
    dogru_neden: 'Kanun md. 35/B/3-d uyarınca sermayenin veya oy haklarının %10 veya fazlasını temsil eden paylara sahip ortaklar,
      (a) bendindeki nitelikleri (mali güç, dürüstlük ve itibar şartı dışında) kaybederlerse sahip oldukları payları (a) bendindeki
      şartları sağlayan kişilere altı ay içinde devretmek zorundadır; devredilecek paylara düşen oy haklarının kimlerce ve
      nasıl kullanılacağını Kurul belirler. Püf noktaları: Süre altı aydır; devir serbest değil, şartları sağlayan kişilere
      yapılır. (a) bendinin 5 numaralı alt bendi (mali güç, dürüstlük, itibar) bu kuraldan hariçtir.'
    celdiriciler:
      A: Serbest devir mümkün değildir; devir yalnızca şartları sağlayan kişilere ve altı ay içinde yapılır.
      B: Devir zorunluluğu vardır; yalnızca oy hakkı kısıtlaması yeterli değildir ve oy haklarının kullanımını Kurul belirler.
      D: Süre otuz gün değildir ve devir Kurula değil, şartları sağlayan kişilere yapılır.
      E: Payların kendiliğinden hükümsüz sayılması kanunda öngörülmemiştir; öngörülen çözüm altı ay içinde devirdir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/B/3-d
    alinti: bendinde belirtilen nitelikleri kaybetmeleri hâlinde, sahip oldukları payları (a) bendinde belirtilen şartları
      sağlayan kişilere altı ay içinde devretmeleri gerekir.
