    A: Faaliyet izni, işlemlerin kamu güvencesi altında olduğunu gösterir; kripto varlıklar yatırımcı tazmin hükümlerine tabidir
    B: Kripto varlıklar Yatırımcı Tazmin Merkezinin tazmin kapsamındadır ancak faaliyet izni kamu güvencesi sağlamaz
    C: Faaliyet izni yalnızca bankalar nezdinde saklanan kripto varlıkları kamu güvencesi altına alır
    D: Kripto varlıklar için tazmin yalnızca platform ortaklarının talebi hâlinde uygulanır
