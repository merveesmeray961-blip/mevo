  kok: 'Girişimci G''nin paya dayalı kitle fonlaması kampanyası 2 Mart 2026 tarihinde başlamıştır. G''nin, fonlanan şirkette
    önemli etkiye sahip olacak ortağı O, 1 Kasım 2027 tarihinde aşağıdaki işlemleri yapmıştır. Kitle Fonlaması Tebliği''ne
    (III-35/A.2) göre bu işlemlerden hangileri O bakımından paylarını devretme yasağına **aykırı değildir**?


    I. Paylarının mirasçıya geçmesi (miras)


    II. Paylarını kendi aralarında diğer girişimci ortağa devretmesi


    III. Paylarının cebri icra yoluyla satılması


    IV. Paylarını nitelikli yatırımcı olmayan üçüncü bir kişiye satması'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve IV
    D: I, II ve III
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Kitle Fonlaması Tebliği md. 16/7 uyarınca önemli etkiye sahip olacak ortaklar, kampanya sürecinin başladığı
      tarihi takip eden 3 yıl içinde miras, mirasın paylaşımı, eşler arasındaki mal rejimi hükümleri veya cebri icra nedenleriyle
      yapılacak devirler ile nitelikli yatırımcılara ya da kendi aralarında yapacakları devirler hariç olmak üzere paylarını
      devredemez. 1 Kasım 2027 tarihi, 2 Mart 2026''dan başlayan üç yıllık süre içindedir; miras (I), kendi aralarında devir
      (II) ve cebri icra (III) yasak dışıdır, IV ise yasaktır. Püf noktaları: Önce süreyi kontrol edin (üç yıl dolmamıştır),
      sonra yasağın istisnalarını tek tek eşleştirin. Nitelikli yatırımcıya devir serbesttir, ''herhangi bir üçüncü kişiye''
      devir serbest değildir.'
    celdiriciler:
      A: III numaralı işlem de yasak kapsamı dışındadır; cebri icra nedeniyle yapılan devirler yasaktan hariç tutulmuştur.
      B: IV numaralı işlem yasağa aykırıdır; nitelikli yatırımcı olmayan üçüncü kişiye satış istisna değildir.
      C: IV yasağa aykırıdır; ayrıca I ve III de istisna kapsamındadır.
      E: IV numaralı işlem, nitelikli yatırımcıya ya da kendi aralarında yapılan devir olmadığından yasağa aykırıdır.
