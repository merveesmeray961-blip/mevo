      fonu sağlamak amacıyla Kurul tarafından belirlenen esaslar dâhilinde Kanunun yatırımcı tazminine ilişkin hükümlerine
      tabi olmaksızın kitle fonlama platformları aracılığıyla halktan para toplanmasıdır.
