      kaybı için fıkradaki altı aylık devir yükümlülüğü doğmaz. Püf noktaları: Altı aylık devir kuralını ezberlemekle yetinmeyin;
      fıkrada ''(d) bendi hariç'' istisnası vardır. Yüzde on eşiği sağlansa bile hangi şartın kaybedildiğine bakmak gerekir.'
    celdiriciler:
