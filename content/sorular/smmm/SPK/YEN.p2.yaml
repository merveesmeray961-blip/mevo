    Kitle Fonlaması Tebliği'ne (III-35/A.2) göre kampanya sonrası süreç hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kampanya süresinin sona ermesini takip eden otuz iş günü içinde anonim şirket kurulur; sermaye artırımı doksan gün
      içinde yapılır.
    B: Kampanya süresinin sona ermesini takip eden altmış gün içinde limited şirket kurulur.
    C: Kampanya süresinin sona ermesini takip eden altmış gün içinde anonim şirket kurulur; sermaye artırımı otuz iş günü
      içinde yapılır.
    D: Kampanya süresinin sona ermesini takip eden doksan gün içinde sermaye artırımı yapılır; ardından anonim şirket kurulur.
    E: Doksan gün içinde anonim şirket kurulur; sermaye artırımı, tescili takip eden otuz iş günü içinde yapılır.
  dogru: E
  aciklama:
    dogru_neden: 'Kitle Fonlaması Tebliği md. 17/7-(a)(1) uyarınca girişimci tarafından yürütülen kampanyalarda kampanya süresinin
      sona ermesini takip eden doksan gün içinde bir anonim şirket kurulması zorunludur; en geç kuruluşun ticaret siciline
      tescilini takip eden otuz iş günü içinde fonlanan şirket tarafından toplanan fon tutarı kadar sermaye artırımı yapılır.
      Püf noktaları: İki ayrı süre vardır (doksan gün ve otuz iş günü) ve sırası önemlidir: önce şirket kuruluşu, sonra tescilden
      başlayan sermaye artırımı. Gün ile iş günü ayrımına ve şirket türüne dikkat edin.'
    celdiriciler:
      A: Süreler yer değiştirmiştir; anonim şirket doksan gün içinde kurulur, sermaye artırımı ise tescili takip eden otuz
        iş günü içinde yapılır.
      B: Girişimci tarafından yürütülen kampanyalarda kurulması zorunlu olan şirket anonim şirkettir ve süre altmış gün değildir.
      C: Anonim şirketin kurulması için süre altmış gün değil, doksan gündür.
      D: Önce anonim şirket kurulur; sermaye artırımı, kuruluşun ticaret siciline tescilinden sonra yapılır.
  kaynaklar:
  - mevzuat: Kitle Fonlaması Tebliği (III-35/A.2)
    madde: md. 17/7-a-1
    alinti: 1) Girişimci tarafından yürütülen kampanyalarda, kampanya süresinin sona ermesini takip eden doksan gün içinde
