    C: O, paylarını otuz gün içinde devretmek zorundadır.
    D: O, paylarını bir yıl içinde devretmek zorundadır.
    E: O'nun payları kendiliğinden hazineye geçer.
  dogru: A
  aciklama:
    dogru_neden: 'III-35/B.1 sayılı Tebliğ md. 6/4 uyarınca yüzde on veya daha fazla paya sahip ortaklar ile ilgili ortaklar,
      birinci fıkranın (d) bendi hariç olmak üzere birinci fıkradaki nitelikleri kaybetmeleri hâlinde paylarını altı ay içinde
