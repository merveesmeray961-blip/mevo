  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: hesaplama
  zorluk: 3
  kok: Bir kripto varlık hizmet sağlayıcısının yönetim kurulu üyesi Y, zimmetin açığa çıkmamasını sağlamaya yönelik hileli
    davranışlarla zimmet suçunu işlemiş ve temel hapis cezası 18 yıl olarak belirlenmiştir. Y, kovuşturma başladıktan sonra,
    ancak hüküm verilmeden önce zimmete geçirdiği kripto varlıkları gönüllü olarak aynen iade etmiştir. 6362 sayılı Kanun'un
    110/A maddesine göre ceza kaç yıl hapis olur? (Başka bir artırım veya indirim sebebi **yoktur**.)
  secenekler:
    A: 6 yıl
    B: 9 yıl
    C: 12 yıl
    D: 13,5 yıl
    E: 18 yıl
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 110/A/5 uyarınca kovuşturma başlamadan önce yapılan gönüllü iade hâlinde cezanın yarısı
      indirilir; bu durumun hükümden önce gerçekleşmesi hâlinde verilecek cezanın üçte biri indirilir. Y, kovuşturma başladıktan
      sonra ama hükümden önce iade ettiğinden cezanın üçte biri (18 / 3 = 6 yıl) indirilir ve ceza 12 yıl olur. Püf noktaları:
      Soruşturma öncesi iade üçte iki (md. 110/A/4), kovuşturma öncesi gönüllü iade yarı, hükümden önceki iade ise üçte bir
      indirim sağlar; iadenin hangi aşamada yapıldığına bakın. Hileli zimmetin temel cezası ayrıca düzenlenmiştir, soruda
      ceza zaten verilmiştir.'
    celdiriciler:
      A: Altı yıl, cezanın üçte ikisinin indirilmesiyle bulunur; bu oran soruşturma başlamadan önce yapılan iadeye uygulanır,
        hükümden önceki iadeye değil.
      B: Dokuz yıl, cezanın yarısının indirilmesiyle bulunur; yarı oranında indirim kovuşturma başlamadan önce gönüllü iade
        hâlinde uygulanır.
      D: Kanunda dörtte bir oranında indirim öngörülmemiştir; 13,5 yıl kanundaki hiçbir indirim oranının sonucu değildir.
      E: On sekiz yıl indirim hiç uygulanmadığında kalan cezadır; hükümden önce gerçekleşen gönüllü iade üçte bir indirim
        sağlar.
    hesap_adimlari:
    - 'Hükümden önce gönüllü iade: cezanın üçte biri indirilir.'
    - İndirim = 18 x 1/3 = 6 yıl
    - Kalan ceza = 18 - 6 = 12 yıl
  kaynaklar:
