    madde: md. 110/A/4
    alinti: (4) Soruşturma başlamadan önce, zimmete geçirilen para veya para yerine geçen evrak veya senetlerin, diğer malların
      veya kripto varlıkların aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi hâlinde, verilecek cezanın
      üçte ikisi indirilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 110/A/5
    alinti: (5) Kovuşturma başlamadan önce, zimmete geçirilen para veya para yerine geçen evrak veya senetlerin, diğer malların
