  zorluk: 3
  kok: 'Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğ''e (III-35/B.1) göre platformlar
    ile saklama kuruluşlarındaki görevlere ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Banka dışı bir saklama kuruluşunun yöneticisi, platformda yönetici olarak görev alamaz.


    II. Saklama hizmeti sunacak bir bankanın yöneticisi, yönetici sıfatıyla platformda görev alabilir.


    III. Saklama hizmeti sunacak bir bankanın personeli, platformda personel olarak görev alabilir.


    IV. Platform personeli, banka dışı bir saklama kuruluşunda görev alamaz.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve III
    D: I, II ve IV
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'III-35/B.1 sayılı Tebliğ md. 9/7 uyarınca platform yöneticileri ve personeli saklama kuruluşlarında, saklama
      kuruluşu yöneticileri ve personeli platformlarda görev alamaz; saklama hizmeti sunacak bankalar bakımından ise bu hüküm
      yalnızca yöneticiler yönüyle uygulanmaz. Bu nedenle I, II ve IV doğru, III yanlıştır. Püf noktaları: Yasağın ana kuralı
      iki yönlüdür (platformdan saklamaya, saklamadan platforma). Banka istisnası sadece ''yöneticiler yönüyle'' geçerlidir;
      personele genişletmeyin.'
    celdiriciler:
      A: IV numaralı ifade de doğrudur; platform personeli banka dışı saklama kuruluşunda görev alamaz.
      B: III yanlıştır; bankalar için istisna yalnızca yöneticiler yönüyledir, personel için geçerli değildir.
      C: I de doğrudur; III ise yanlıştır, çünkü banka istisnası personeli kapsamaz.
      E: III yanlıştır; banka personelinin platformda görev alması istisna kapsamında değildir ve I de doğrudur.
