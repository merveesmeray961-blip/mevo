- id: SMMM-SPK-YEN-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar, kitle fonlaması, tanımlar
  konu: YEN
  kazanim: kitle fonlaması — kanun tanımı ve kitle fonlama platformları
  tip: bilgi
  zorluk: 1
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre kitle fonlamasına ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Kitle fonlaması, bir projenin veya girişim şirketinin ihtiyaç duyduğu fonu sağlamak amacıyla, Kurul tarafından
    belirlenen esaslar dâhilinde, Kanunun yatırımcı tazminine ilişkin hükümlerine tabi olmaksızın kitle fonlama
    platformları aracılığıyla halktan para toplanmasıdır.


    II. Kitle fonlama platformlarının kurulabilmesi ve faaliyete başlaması için Kuruldan izin alınması zorunludur.


    III. Kitle fonlaması ve buna bağlı yapılan işlemler ile kitle fonlama platformları, Kanunun 37 nci ve 38 inci
    maddeleri kapsamında değerlendirilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'I numaralı ifade md. 3/1-(z)''deki tanıma, II numaralı ifade md. 35/A-2''ye uygundur. III numaralı
      ifade yanlıştır: md. 35/A-4''e göre kitle fonlaması ve buna bağlı yapılan işlemler ile kitle fonlama platformları
      Kanunun 37 nci ve 38 inci maddesi kapsamında değerlendirilmez. Doğru ifadeler I ve II''dir.'
    celdiriciler:
      A: I numaralı ifade doğrudur; ancak II numaralı ifade de md. 35/A-2'ye uygundur, dolayısıyla yalnız I eksik
        bir cevaptır.
      B: III numaralı ifade md. 35/A-4'e aykırıdır; kitle fonlaması 37 nci ve 38 inci maddeler kapsamında değerlendirilmez.
      D: III numaralı ifade md. 35/A-4'e aykırıdır; ayrıca doğru olan I numaralı ifade bu şıkta yer almamıştır.
      E: III numaralı ifade md. 35/A-4'e aykırı olduğundan üç ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-(z)
    alinti: 'Kitle fonlaması: Bir projenin veya girişim şirketinin ihtiyaç duyduğu fonu sağlamak amacıyla Kurul
      tarafından belirlenen esaslar dâhilinde bu Kanunun yatırımcı tazminine ilişkin hükümlerine tabi olmaksızın
      kitle fonlama platformları aracılığıyla halktan para toplanmasını,'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/A-2
    alinti: (2) Kitle fonlama platformlarının kurulabilmesi ve faaliyete başlaması için Kuruldan izin alınması zorunludur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/A-4
    alinti: (4) Kitle fonlaması ve buna bağlı yapılan işlemler ile kitle fonlama platformları bu Kanunun 37 nci
      ve 38 inci maddesi kapsamında değerlendirilmez.
