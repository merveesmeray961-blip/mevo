- id: SMMM-SPK-YEN-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kanun tanımları
  tip: bilgi
  zorluk: 2
  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre aşağıdakilerden hangisi kripto varlığın tanımıdır?
  secenekler:
    A: Dağıtık defter teknolojisi veya benzer bir teknoloji kullanılarak elektronik olarak oluşturulup saklanabilen,
      dijital ağlar üzerinden dağıtımı yapılan ve değer veya hak ifade edebilen gayri maddi varlıklardır.
    B: Kripto varlıkların transfer edilebilmesini ve bu varlıklara ilişkin özel ve açık anahtarların çevrim içi
      veya çevrim dışı olarak depolanmasını sağlayan yazılım, donanım, sistem ya da uygulamalardır.
    C: Platform müşterilerinin kripto varlıklarının veya cüzdandan transfer hakkı sağlayan özel anahtarların saklanmasını,
      yönetimini veya Kurulca belirlenecek diğer saklama hizmetlerini ifade eden hizmettir.
    D: Kripto varlık alım satım, ilk satış ya da dağıtım, takas, transfer, bunların gerektirdiği saklama ve belirlenebilecek
      diğer işlemlerin bir veya daha fazlasının gerçekleştirildiği kuruluşlardır.
    E: Dağıtık defter teknolojisiyle oluşturulan, ihraççının borçlanma yükümlülüğünü gösteren ve Kurulca onaylanan
      izahnameyle ihraç edilen kaydi menkul kıymetlerdir.
  dogru: A
  aciklama:
    dogru_neden: SPKn md. 3/1-bb kripto varlığı, dağıtık defter teknolojisi veya benzer teknoloji kullanılarak elektronik
      olarak oluşturulup saklanabilen, dijital ağlar üzerinden dağıtılan ve değer veya hak ifade edebilen gayri
      maddi varlık olarak tanımlar.
    celdiriciler:
      B: Bu ifade kripto varlığın değil, cüzdanın (md. 3/1-aa) tanımıdır.
      C: Bu ifade kripto varlığın değil, kripto varlık saklama hizmetinin (md. 3/1-çç) tanımıdır.
      D: Bu ifade kripto varlığın değil, platformun (md. 3/1-dd) tanımıdır.
      E: Kanundaki kripto varlık tanımı borçlanma yükümlülüğü veya izahnameyle ihraç unsuru içermez.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-bb
    alinti: 'Kripto varlık: Dağıtık defter teknolojisi veya benzer bir teknoloji kullanılarak elektronik olarak
      oluşturulup saklanabilen, dijital ağlar üzerinden dağıtımı yapılan ve değer veya hak ifade edebilen gayri
      maddi varlıkları,'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-aa
    alinti: 'Cüzdan: Kripto varlıkların transfer edilebilmesini ve bu varlıkların ya da bu varlıklara ilişkin özel
      ve açık anahtarların çevrim içi veya çevrim dışı olarak depolanmasını sağlayan yazılım, donanım, sistem ya
      da uygulamaları,'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-çç
    alinti: 'Kripto varlık saklama hizmeti: Platform müşterilerinin kripto varlıklarının veya bu varlıklara ilişkin
      cüzdandan transfer hakkı sağlayan özel anahtarların saklanmasını, yönetimini veya Kurulca belirlenecek diğer
      saklama hizmetlerini,'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-dd
    alinti: 'Platform: Kripto varlık alım satım, ilk satış ya da dağıtım, takas, transfer, bunların gerektirdiği
      saklama ve belirlenebilecek diğer işlemlerin bir veya daha fazlasının gerçekleştirildiği kuruluşları,'
