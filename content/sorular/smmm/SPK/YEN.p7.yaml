- id: SMMM-SPK-YEN-0007
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kitle fonlaması
  tip: kavrama
  zorluk: 3
  kok: Bir girişim şirketi, Kurulca belirlenen esaslar çerçevesinde bir kitle fonlama platformu aracılığıyla halktan proje
    finansmanı için para toplamaktadır. Bu işlem için aşağıdaki ifadelerden hangisi Kanundaki düzenlemeye uygundur?
  secenekler:
    A: Kitle fonlaması, yalnızca yatırım danışmanlığı hizmeti karşılığında para toplanmasını ifade eder ve izahname zorunludur.
    B: Kitle fonlaması, yatırımcı tazmin hükümlerine tabi olarak yalnızca borsada işlem gören payların halka arz edilmesidir.
    C: Kitle fonlaması yalnız bağış karşılığında fon toplanmasını kapsar ve sermaye piyasası mevzuatından tamamen bağımsızdır.
    D: Kitle fonlaması platformları üzerinden halktan para toplanması yalnızca yabancı ihraççılar için mümkündür.
    E: Kitle fonlaması, yatırımcı tazminine ilişkin hükümlere tabi olmaksızın platformlar aracılığıyla halktan para toplanmasını
      ifade eder; ayrıca bu yolla halktan para toplanması izahname veya ihraç belgesi hazırlama yükümlülüğüne tabi değildir.
  dogru: E
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 3/1-z kitle fonlamasını, yatırımcı tazminine ilişkin hükümlere tabi olmaksızın kitle
      fonlama platformları aracılığıyla halktan para toplanması olarak tanımlar. Md. 4/1 ayrıca kitle fonlaması suretiyle
      halktan para toplanmasının Kanunun izahname ya da ihraç belgesi hazırlama yükümlülüğüne tabi olmadığını düzenler. Püf
      noktaları: Kitle fonlamasının tanımındaki tazmin istisnası ile md. 4/1''deki izahname/ihraç belgesi istisnasını birlikte
      okuyun.'
    celdiriciler:
      A: Kitle fonlamasının tanımı yatırım danışmanlığıyla sınırlı değildir; ayrıca md. 4/1 bu işlemi izahname veya ihraç
        belgesi yükümlülüğünden çıkarır.
      B: Tanım, yatırımcı tazminine ilişkin hükümlere tabi olmaksızın gerçekleştirildiğini söyler; borsada işlem gören paylarla
        sınırlı değildir.
      C: Tebliğ paya ve borçlanmaya dayalı kitle fonlamasını düzenler; bağış karşılığı fon toplama Tebliğ kapsamı dışındadır
        ancak bu, kitle fonlamasının Kanundaki tanımını ortadan kaldırmaz.
      D: Kanun, kitle fonlamasını yabancı ihraççılarla sınırlamamaktadır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-z
    alinti: 'Kitle fonlaması: Bir projenin veya girişim şirketinin ihtiyaç duyduğu fonu sağlamak amacıyla Kurul tarafından
      belirlenen esaslar dâhilinde bu Kanunun yatırımcı tazminine ilişkin hükümlerine tabi olmaksızın kitle fonlama platformları
      aracılığıyla halktan para toplanmasını,'
