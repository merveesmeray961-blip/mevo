      araçlarıdır.
    E: İpotek finansmanı kuruluşlarının devraldığı konut finansmanı alacaklarını teminat göstererek kaynak sağlamak
      amacıyla ihraç ettiği, sahiplerine faiz geliri sağlayan borçlanma araçlarıdır.
