  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: uygulama
  zorluk: 3
  kok: Bir şirket, platform işletmekte ve ayrıca kripto varlık saklama hizmeti sunmaktadır; Kuruldan gerekli izinleri almadan
    bu faaliyetleri yürütmeye devam etmektedir. 6362 sayılı Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Şirket kripto varlık hizmet sağlayıcı sayılmaz; yalnızca platformlar bu kapsamdadır.
    B: Şirket yalnızca saklama kuruluşu sayılır; platform faaliyeti ayrı bir hukuki kategori olduğundan Kanundaki tanıma girmez.
    C: Platformlar ve kripto varlık saklama hizmeti sağlayan kuruluşlar kripto varlık hizmet sağlayıcı tanımına dahildir;
      izin almaksızın kripto varlık hizmet sağlayıcılığı faaliyeti yürütenlerin yetkilileri için Kanunda hapis ve adli para
      cezası öngörülmüştür.
    D: Kripto varlık hizmet sağlayıcı sayılmak için yalnızca kripto varlıkların ilk satışını yapmak gerekir.
    E: İzin alınmadan yürütülen kripto varlık hizmet sağlayıcılığı faaliyeti yalnızca idari para cezası sonucunu doğurur.
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 3/1-cc kripto varlık hizmet sağlayıcı tanımına platformları ve kripto varlık saklama hizmeti sağlayan
      kuruluşları dahil eder. Md. 109/A/1 ise izin almaksızın kripto varlık hizmet sağlayıcı olarak faaliyet yürüttüğü tespit
      edilen gerçek kişiler ve tüzel kişilerin yetkilileri için üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne
      kadar adli para cezası öngörür. Püf noktaları: Tanımdaki birden fazla kuruluş türünü ve izinsiz faaliyetin ayrı suç
      hükmünü birlikte değerlendirin.'
    celdiriciler:
      A: Kanun tanımında platformlar açıkça kripto varlık hizmet sağlayıcı kapsamındadır.
      B: Tanım platformları ve saklama hizmeti sağlayan kuruluşları birlikte sayar; platform faaliyeti ayrı bırakılmamıştır.
      D: Tanım yalnız ilk satış faaliyetinden ibaret değildir; platform ve saklama kuruluşlarını da kapsar.
      E: Md. 109/A/1 izinsiz kripto varlık hizmet sağlayıcılığı için yalnız idari yaptırım değil, hapis ve adli para cezası
        öngörür.
