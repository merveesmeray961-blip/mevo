- id: SMMM-SPK-YEN-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: uygulama
  zorluk: 3
  kok: Bir şirket, platform işletmekte ve ayrıca kripto varlık saklama hizmeti sunmaktadır; Kuruldan gerekli izinleri
    almadan bu faaliyetleri yürütmeye devam etmektedir. 6362 sayılı Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Platform ve saklama kuruluşları hizmet sağlayıcıdır; izinsiz faaliyet yürüten yetkililere hapis ve adli para
      cezası öngörülür.
    B: Şirket saklama kuruluşu sayılır; platform faaliyeti ayrı bir kategori olduğundan Kanundaki tanıma girmez.
    C: Kripto varlık hizmet sağlayıcı sayılmak için kripto varlıkların ilk satışını yapmak gerekir.
    D: Şirket kripto varlık hizmet sağlayıcı sayılmaz; tanım platformlarla sınırlıdır.
    E: İzinsiz kripto varlık hizmet sağlayıcılığı faaliyeti idari para cezası doğurur, suç oluşturmaz.
  dogru: A
  aciklama:
    dogru_neden: 'SPKn md. 3/1-cc kripto varlık hizmet sağlayıcı tanımına platformları ve kripto varlık saklama
      hizmeti sağlayan kuruluşları dahil eder. Md. 109/A/1 ise izin almaksızın kripto varlık hizmet sağlayıcı olarak
      faaliyet yürüttüğü tespit edilen gerçek kişiler ve tüzel kişilerin yetkilileri için üç yıldan beş yıla kadar
      hapis ve beş bin günden on bin güne kadar adli para cezası öngörür. Püf noktaları: Tanımdaki birden fazla
      kuruluş türünü ve izinsiz faaliyetin ayrı suç hükmünü birlikte değerlendirin.'
    celdiriciler:
      B: Tanım platformları ve saklama hizmeti sağlayan kuruluşları birlikte sayar; platform faaliyeti ayrı bırakılmamıştır.
      C: Tanım yalnız ilk satış faaliyetinden ibaret değildir; platform ve saklama kuruluşlarını da kapsar.
      D: Kanun tanımında platformlar açıkça kripto varlık hizmet sağlayıcı kapsamındadır.
      E: Md. 109/A/1 izinsiz kripto varlık hizmet sağlayıcılığı için yalnız idari yaptırım değil, hapis ve adli
        para cezası öngörür.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 3/1-cc
    alinti: "cc)      (Ek:26/6/2024-7518/1       md.)      Kripto      varlık    hizmet     sağlayıcı:\nPlatformları,\
      \ kripto varlık saklama hizmeti sağlayan kuruluşları ve bu Kanuna dayanılarak\nyapılacak düzenlemelerde kripto\
      \ varlıkların ilk satış ya da dağıtımı dâhil olmak üzere kripto\nvarlıklarla ilgili olarak hizmet sağlamak\
      \ üzere belirlenmiş diğer kuruluşları,\n        "
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 109/A/1
    alinti: "İzinsiz kripto varlık hizmet sağlayıcılığı faaliyeti\n       MADDE 109/A- (Ek:26/6/2024-7518/12 md.)\n\
      \       (1) İzin almaksızın kripto varlık hizmet sağlayıcı olarak faaliyet yürüttüğü tespit edilen\ngerçek\
      \ kişiler ve tüzel kişilerin yetkilileri üç yıldan beş yıla kadar hapis ve beş bin günden on\nbin güne kadar\
      \ adli para cezası ile cezalandırılırlar."
