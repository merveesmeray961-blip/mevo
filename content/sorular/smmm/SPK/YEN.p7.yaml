- id: SMMM-SPK-YEN-0006
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kira sertifikası
  tip: uygulama
  zorluk: 3
  kok: Bir varlık kiralama şirketinin ihraç ettiği kira sertifikalarına ilişkin olarak ihraççı vadesinde yükümlülüklerini
    yerine getirememiştir. Buna göre aşağıdakilerden hangisi Kanuna uygundur?
  secenekler:
    A: Kira sertifikası sahiplerine yapılacak ödemelerden önce portföydeki varlık gelirleri genel alacaklılara dağıtılır.
    B: Varlık kiralama şirketi, kira sertifikası sahiplerinin menfaatlerine aykırı olsa dahi portföydeki varlıkları
      serbestçe devredebilir.
    C: Kira sertifikası sahiplerinin hakları sözleşmede ayrıca yazılmışsa korunur; Kurulun ek tedbir alma yetkisi
      yoktur.
    D: Kira sertifikası sahiplerine ödeme için önce varlık kiralama şirketinin diğer ticari borçlarının ödenmesi
      gerekir.
    E: Portföy varlıklarından elde edilen gelirler öncelikle kira sertifikası sahiplerine ödemede kullanılır; Kurul
      da tedbir almaya yetkilidir.
  dogru: E
  aciklama:
    dogru_neden: 'SPKn md. 61/4, ihraççının kira sertifikası yükümlülüklerini vadesinde yerine getirememesi hâlinde
      portföydeki varlıklardan elde edilen gelirin öncelikle kira sertifikası sahiplerine yapılacak ödemelerde kullanılacağını
      ve Kurulun hakları koruyucu tedbirler alabileceğini düzenler. Md. 61/3 de portföy varlıklarının kira sertifikası
      sahiplerinin menfaatlerine aykırı şekilde devredilmesini/kiralanmasını sınırlar. Püf noktaları: Öncelik ödeme
      sırasındadır; ayrıca portföy varlıklarının korunmasına ilişkin sınırlama, temerrüt hâlindeki ödeme kuralını
      tamamlar.'
    celdiriciler:
      A: Kanun genel alacaklıları değil, kira sertifikası sahiplerini önceliklendirir.
      B: Md. 61/3 varlıkların kira sertifikası sahiplerinin menfaatlerine aykırı biçimde kiralanmasını veya devredilmesini
        yasaklar.
      C: Md. 61/4 Kurula açıkça gerekli her türlü tedbiri alma yetkisi verir.
      D: Portföy gelirlerinin önceliği kira sertifikası sahiplerindedir; diğer borçların önce ödenmesi öngörülmemiştir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/3
    alinti: "(2) Varlık kiralama şirketleri münhasıran kira sertifikası ihraç etmek üzere kurulan\nanonim ortaklıklardır.\n\
      \         (3) Varlık kiralama şirketi, Kurul tarafından uygun görüş verilen esas sözleşmesinde\nbelirtilen\
      \ faaliyetler dışında herhangi bir ticari faaliyetle uğraşamayacağı gibi sahip olduğu\nvarlıklar ve haklar\
      \ üzerinde esas sözleşmesinde izin verilenler hariç olmak üzere, üçüncü\nkişiler lehine hiçbir ayni hak tesis\
      \ edemez ve bunları kira sertifikası sahiplerinin menfaatlerine"
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/3
    alinti: 'aykırı bir şekilde kiralayamaz veya devredemez. Kira sertifikaları itfa edilinceye kadar, varlık

      kiralama şirketinin portföyünde yer alan varlıklar ve haklar, ihraççının yönetiminin veya

      denetiminin kamu kurumlarına devredilmesi hâlinde dahi teminat amacı dışında tasarruf

      edilemez, rehnedilemez, teminat gösterilemez, kamu alacaklarının tahsili amacı da dâhil

      olmak üzere haczedilemez, iflas masasına dâhil edilemez, ayrıca bunlar hakkında ihtiyati

      tedbir kararı verilemez.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/4
    alinti: '(4) İhraççının kira sertifikalarından kaynaklanan yükümlülüklerini vadesinde yerine

      getirememesi, yönetiminin veya denetiminin kamu kurumlarına devredilmesi, faaliyet izninin

      kaldırılması veya iflası hâlinde portföyündeki varlıklardan elde edilen gelir öncelikle kira

      sertifikası sahiplerine yapılacak ödemelerde kullanılır. Bu durumda Kurul kira sertifikası

      sahiplerinin haklarının korunmasını teminen gerekli her türlü tedbiri almaya yetkilidir.'
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
