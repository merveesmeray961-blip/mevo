    alinti: "cc)      (Ek:26/6/2024-7518/1       md.)      Kripto      varlık    hizmet     sağlayıcı:\nPlatformları, kripto\
      \ varlık saklama hizmeti sağlayan kuruluşları ve bu Kanuna dayanılarak\nyapılacak düzenlemelerde kripto varlıkların\
      \ ilk satış ya da dağıtımı dâhil olmak üzere kripto\nvarlıklarla ilgili olarak hizmet sağlamak üzere belirlenmiş diğer\
      \ kuruluşları,\n        "
