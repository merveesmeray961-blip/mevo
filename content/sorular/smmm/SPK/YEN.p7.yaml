      zorunludur; düzenlemelere aykırı devirler pay defterine kaydolunmaz ve bu hükme aykırı kayıtlar hükümsüzdür.
      Püf noktaları: Kuruluş/faaliyete başlama izni ile pay devri iznini ayrı şartlar olarak değerlendirin; pay
      devrinde yalnız bildirim yeterli değildir.'
    celdiriciler:
      A: Kanun hem kuruluş hem de faaliyete başlama için Kurul izni öngörür.
      B: Aykırı devirlerin yalnızca bildirilmesi yeterli değildir; pay defterine kaydolmaz ve aykırı kayıt hükümsüzdür.
      C: Pay devirlerinde Kurul izni açıkça zorunludur.
      D: Kanun, yapılabilecek faaliyetlerin Kurul tarafından belirlenmesini açıkça düzenler.
