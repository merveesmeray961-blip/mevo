  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: uygulama
  zorluk: 1
  kok: Bir girişimci kripto varlık alım satım platformu kurarak faaliyete başlamak istemektedir. 6362 sayılı Kanun
    bakımından hangi adımı atması gerekir?
  secenekler:
    A: Ticaret siciline tescil ettirmesi ve ayrıca Bankacılık Düzenleme ve Denetleme Kurumundan faaliyet izni alması
      gerekir.
    B: Faaliyete başlamadan önce Kuruldan izin alması gerekir; Kurul izni için bilgi sistemleri ve altyapı bakımından
      TÜBİTAK kriterlerine uygunluk aranır.
    C: Faaliyete başladıktan sonra otuz gün içinde Kurula bildirimde bulunması ve faaliyet raporunu sunması yeterlidir.
    D: TÜBİTAK'tan bilgi sistemleri ve teknolojik altyapıya ilişkin uygunluk raporu alması ve bu raporu Kurula sunması
      yeterlidir.
    E: Mali Suçları Araştırma Kurulu Başkanlığına yükümlü olarak kaydolması ve iç kontrol birimini oluşturması yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: Md. 35/B/1'e göre kripto varlık hizmet sağlayıcıların kurulabilmesi ve faaliyete başlaması için
      Kuruldan izin alınması zorunlu olup, bunlar münhasıran Kurulca belirlenecek faaliyetleri yerine getirir. Md.
      35/B/2 uyarınca izin verilebilmesi için bilgi sistemleri ve teknolojik altyapılar konusunda TÜBİTAK'ın belirleyeceği
      kriterlere uygunluk da aranır.
    celdiriciler:
      A: İzin yetkisi BDDK'ya değil Kurula aittir (md. 35/B/1); ticaret siciline tescil Kurul izninin yerine geçmez.
      C: İzin faaliyete başlamadan önce alınmalıdır; sonradan bildirim yeterli değildir.
      D: TÜBİTAK kriterlerine uygunluk Kurul izninin bir şartıdır (md. 35/B/2); tek başına izin yerine geçmez.
      E: Mali Suçları Araştırma Kurulu Başkanlığına kayıt Kurul izninin yerine geçmez; izin yetkisi Kuruldadır (md.
        35/B/1).
