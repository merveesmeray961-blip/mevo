    niteliği ve izin şartı bakımından hangisi doğrudur?
  secenekler:
    A: Platform, bankacılık mevzuatına tabidir ve faaliyete başlamak için Bankacılık Düzenleme ve Denetleme Kurumundan
      izin alınması gerekir.
    B: Platform, kitle fonlamasına aracılık eden ve elektronik ortamda hizmet veren bir kuruluştur; kurulabilmesi
      ve faaliyete başlaması için Kuruldan izin alınması zorunludur.
    C: Platform, borsa niteliğinde sayılır ve faaliyetleri borsalara ve piyasa işleticilerine ilişkin hükümlere
      tabi olarak yürütülür.
    D: Platform halka açık ortaklıklarca kurulabilir ve faaliyete başlamak için Ticaret Bakanlığından izin alınması
      gerekir.
    E: Platform üzerinden fon toplanması Kanunun izahname hazırlama yükümlülüğüne tabidir ve izahname Kurulca onaylanır.
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 35/A/1, kitle fonlama platformlarını kitle fonlamasına aracılık eden ve elektronik ortamda
      hizmet veren kuruluşlar olarak tanımlar; md. 35/A/2 platformların kurulabilmesi ve faaliyete başlaması için
      Kuruldan izin alınmasını zorunlu kılar.
    celdiriciler:
      A: İzin makamı BDDK değil Kuruldur; borçlanmaya dayalı kitle fonlamasında bankacılık mevzuatı hükümleri uygulanmaz
        (md. 35/A/1).
      C: Kitle fonlaması ve platformlar borsalar ve piyasa işleticileri ile ilgili hükümlere tabi değildir (md.
        35/A/4).
      D: Md. 35/A/2 izin makamı olarak Kurulu gösterir ve platformları halka açık ortaklıklarla sınırlamaz.
      E: Kitle fonlaması suretiyle halktan para toplanması izahname veya ihraç belgesi hazırlama yükümlülüğüne tabi
        değildir (md. 4/1).
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/A/1
    alinti: Kitle fonlama platformları, kitle fonlamasına aracılık eden ve elektronik ortamda hizmet veren kuruluşlardır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/A/2
    alinti: Kitle fonlama platformlarının kurulabilmesi ve faaliyete başlaması için Kuruldan izin alınması zorunludur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/A/4
    alinti: Kitle fonlaması ve buna bağlı yapılan işlemler ile kitle fonlama platformları bu Kanunun 37 nci ve 38
      inci maddesi kapsamında değerlendirilmez. Bu faaliyetler bu Kanunun borsalar, piyasa işleticileri ve teşkilatlanmış
      diğer pazar yerleri ile ilgili hükümlerine tabi değildir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 4/1
    alinti: kitle fonlaması suretiyle halktan para toplanması, Kurulca faaliyet izni verilen kitle fonlama platformları
      aracılığıyla gerçekleştirilir ve bu Kanunun izahname ya da ihraç belgesi hazırlama yükümlüğüne ilişkin hükümlerine
      tabi değildir.
