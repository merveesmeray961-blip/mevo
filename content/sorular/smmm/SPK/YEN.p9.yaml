  kok: Bir varlık kiralama şirketi, kira sertifikası ihracından elde edeceği fonu belirli bir taşınmaz hakkının
    finansmanında kullanacaktır. İhraçtan doğan hak sahipliği bakımından aşağıdaki değerlendirmelerden hangisi doğrudur?
  secenekler:
    A: Sertifika sahipleri ihraççının payları üzerinde ortaklık hakkı kazanır.
    B: Kira sertifikasını taşınmazın tapu maliki doğrudan ihraç edebilir.
    C: Sertifika sahipleri sabit faiz ödemesine hak kazanır; dayanak varlıkla bağlantı kurulmaz.
    D: Varlık kiralama şirketi kira sertifikası dışında borçlanma aracı ihraç etmek amacıyla kurulur.
    E: Sertifika sahipleri, varlık veya haktan elde edilen gelirlerde payları oranında hak sahibi olur.
