      A: Kira sertifikası sahipliği pay sahipliğiyle aynı değildir.
      B: İhraççı, dayanak varlığın tapu maliki olmak zorunda değildir; kanun varlık kiralama şirketini ihraççı olarak
        düzenler.
      C: Kanun, hak veya varlıktan elde edilen gelirlerle bağlantı kurar; yalnız sabit faiz hakkı tanımlamaz.
      D: Varlık kiralama şirketleri münhasıran kira sertifikası ihraç etmek üzere kurulur.
