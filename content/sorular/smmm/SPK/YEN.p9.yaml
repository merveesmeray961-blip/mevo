- id: SMMM-SPK-YEN-0017
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar
  konu: YEN
  kazanim: kanun tanımları
  tip: kavrama
  zorluk: 3
  kok: III-35/B.1 sayılı Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğdeki tanımlara
    göre aşağıdaki kavram-tanım eşleştirmelerinden hangisi doğrudur?
  secenekler:
    A: Sıcak cüzdan — kritik işlemlerin internetten izole edilmiş ortamlarda yapılmasına ve işlem imzalanmasına
      olanak sağlayan cüzdan teknolojisi.
    B: Açık anahtar — cüzdanlardan transfer hakkı sağlayan, kullanıcı tarafından gizli tutulması gereken anahtar.
    C: Soğuk cüzdan — anahtarların fiziksel, idari ve teknik güvenlik kontrolleriyle korunduğu, kritik işlemlerin
      internetten izole ortamlarda yapıldığı cüzdan teknolojisi.
    D: Özel anahtar — bir cüzdandan diğerine kripto varlık gönderilebilmesi için cüzdanı eşsiz biçimde adresleyen
      anahtar.
    E: Saklama kuruluşu — kripto varlık alım satımının eşleştirildiği ve gerçekleştirildiği, Kurulca yetkilendirilmiş
      kuruluş.
  dogru: C
  aciklama:
    dogru_neden: 'III-35/B.1 sayılı Tebliğ md. 4/1-t, soğuk cüzdanı, kripto varlığın kontrolünü sağlayan anahtarların
      fiziksel, idari ve teknik bilgi güvenliği kontrolleri ile korunduğu, işlem onaylama ve işlem imzalama gibi
      kritik işlemlerin yetkili personel müdahalesiyle fiziki veya teknik hava boşlukları ile internetten izole
      edilmiş ortamlarda yapılmasına olanak sağlayan cüzdan teknolojisi olarak tanımlar. Püf noktaları: Sıcak cüzdan
      internete bağlı olandır; açık ve özel anahtar tanımları birbiriyle karıştırılmamalıdır.'
    celdiriciler:
      A: İnternetten izole ortamlar soğuk cüzdanın özelliğidir; sıcak cüzdan internete bağlı olan teknolojidir (md.
        4/1-ş).
      B: Cüzdanlardan transfer hakkı sağlayan gizli anahtar özel anahtardır (md. 4/1-o); açık anahtar cüzdanı eşsiz
        biçimde adresler (md. 4/1-a).
      D: Cüzdanı eşsiz biçimde adresleyen anahtar açık anahtardır (md. 4/1-a); özel anahtar transfer hakkı sağlayan
        gizli anahtardır.
      E: Alım satımın gerçekleştirildiği kuruluş platformdur (md. 4/1-r); saklama kuruluşu saklama hizmeti için
        yetkilendirilmiş kuruluştur (md. 4/1-s).
  kaynaklar:
  - mevzuat: Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğ (III-35/B.1)
    madde: md. 4/1-t
    alinti: 'Soğuk cüzdan: Kripto varlığın kontrolünü sağlayan anahtarların fiziksel, idari ve teknik bilgi güvenliği
      kontrolleri ile korunduğu, işlem onaylama ve işlem imzalama gibi kritik işlemlerin buna yetkili personel müdahalesiyle
      fiziki veya teknik hava boşlukları ile internetten izole edilmiş ortamlarda yapılmasına olanak sağlayan cüzdan
      teknolojisini,'
  - mevzuat: Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğ (III-35/B.1)
