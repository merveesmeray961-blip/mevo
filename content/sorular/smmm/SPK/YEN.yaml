- id: SMMM-SPK-YEN-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kripto varlıklar, kitle fonlaması, tanımlar
  konu: YEN
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: bilgi
  zorluk: 1
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre kripto varlık hizmet sağlayıcıları ve platformlara ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Kripto varlık hizmet sağlayıcılarının müşterilerine karşı sorumluluğunu ortadan kaldıran veya sınırlandıran
    her türlü sözleşme şartı geçersizdir.

    II. Kripto varlıklar, Kanunun 82. maddesinde düzenlenen yatırımcı tazmin hükümlerine tabidir.

    III. Bir kripto varlığın platformlarca listelenmiş olması, bu varlığın kamuca tekeffülü anlamına gelmez.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 35/C-1'e göre kripto varlık hizmet sağlayıcıların müşterilerine karşı sorumluluğunu ortadan
      kaldıran veya sınırlandıran her türlü sözleşme şartı geçersizdir (I doğru). md. 35/C-2'ye göre bir kripto
      varlığın platformlarca listelenmiş olması kamuca tekeffülü anlamına gelmez (III doğru). md. 35/C-4'e göre
      ise kripto varlıklar Kanunun 82. maddesinde düzenlenen yatırımcı tazmin hükümlerine tabi değildir (II yanlış).
      Doğru ifadeler I ve III'tür.
    celdiriciler:
      A: III numaralı ifade de md. 35/C-2'ye uygun olduğundan yalnız I eksik bir cevaptır.
      B: II numaralı ifade md. 35/C-4'e aykırıdır; kripto varlıklar yatırımcı tazmin hükümlerine tabi değildir.
      D: II numaralı ifade md. 35/C-4'e aykırıdır; ayrıca doğru olan I numaralı ifade dışarıda kalmıştır.
      E: II numaralı ifade md. 35/C-4'e aykırı olduğundan üç ifadenin birlikte doğru olması mümkün değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/C-1 ve 35/C-2
    alinti: Kripto varlık hizmet sağlayıcıların müşterilerine karşı sorumluluğunu ortadan kaldıran veya sınırlandıran
      her türlü sözleşme şartı geçersizdir. ... Bir kripto varlığın platformlarca listelenmiş olması bunların kamuca
      tekeffülü anlamına gelmez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 35/C-4
    alinti: Platformlara Kurul tarafından faaliyet izni verilmiş olması, işlemlerin kamunun güvencesi altında olduğu
      anlamına gelmez. Kripto varlıklar bu Kanunun 82 nci maddesinde düzenlenen yatırımcı tazmin hükümlerine tabi
      değildir.
