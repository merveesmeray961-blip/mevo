    B: Yüzde ikilik pay ve kira kontratı açıklanmak zorunda değildir; yalnızca yüzde beş ve üzeri paylar açıklanır.
    C: Yalnızca kira kontratı açıklanır; pay sahipliği oranı açıklanmaz.
    D: Hiçbiri açıklanmaz; çünkü X A.Ş.'nin kuruluştaki oy hakkı yüzde birin altındadır.
    E: Yalnızca Kurula bildirilir; müşteriye açıklama yapılmaz.
