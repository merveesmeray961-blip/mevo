- id: SMMM-SPK-YHZ-0001
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: Yatırımcı Tazmin Merkezi — tazmin kapsamı ve tazmin edilmeyenler
  tip: bilgi
  zorluk: 2
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre Kurulca bir aracı kurum hakkında yatırımcıları tazmin kararı verilmiştir.
    Bu karar kapsamında yapılacak tazminata ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Aracı kurumun yüzde beş oranında paya sahip ortağı tazmin edilmez.


    II. Yatırımcının piyasadaki fiyat hareketlerinden kaynaklanan zararı tazmin kapsamındadır.


    III. Aracı kurumun yönetim kurulu üyesinin yüzde otuz oranında paya sahip olduğu şirket tazmin edilmez.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve III
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: Md. 84/4-(a)'ya göre tazmin kararı verilen yatırım kuruluşunun yüzde beş veya daha fazla paya sahip ortakları
      tazmin edilmez (I doğru). Md. 84/4-(c)'ye göre (a) bendinde sayılan kişilerin (yönetim kurulu üyeleri de bu kişiler
      arasındadır) yüzde yirmi beş veya daha fazla paya sahip olduğu şirketler de tazmin edilmez (III doğru). Md. 84/2'ye
      göre yatırımcıların yatırım danışmanlığı veya piyasadaki fiyat hareketlerinden kaynaklanan zararları tazmin kapsamında
      değildir (II yanlış). Doğru ifadeler I ve III'tür.
    celdiriciler:
      A: I numaralı ifade doğrudur; ancak III numaralı ifade de md. 84/4-(c)'ye uygundur, dolayısıyla yalnız I eksik bir cevaptır.
      B: II numaralı ifade md. 84/2'ye aykırıdır; fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir.
      C: III numaralı ifade doğrudur; ancak I numaralı ifade de md. 84/4-(a)'ya uygundur (yüzde beş veya daha fazla paya sahip
        ortak), dolayısıyla yalnız III eksik bir cevaptır.
      E: II numaralı ifade md. 84/2'ye aykırıdır; fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/2
    alinti: Yatırımcıların yatırım danışmanlığı veya piyasadaki fiyat hareketlerinden kaynaklanan zararları tazmin kapsamında
      değildir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/4-(a)
    alinti: a) Yatırımcıları tazmin kararı verilen yatırım kuruluşlarının yönetim kurulu üyeleri, yöneticileri ve şahsen sorumlu
      ortakları, yüzde beş veya daha fazla paya sahip ortakları
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/4-(c)
    alinti: c) Bu fıkranın (a) bendinde sayılan gerçek ve tüzel kişilerin yüzde yirmi beş veya daha fazla paya sahip olduğu
      şirketler
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden''de ''(a) bendinde sayılan kişilerin, yani yönetim kurulu üyelerinin'' → ''(a) bendinde
      sayılan kişilerin (yönetim kurulu üyeleri de bu kişiler arasındadır)''.'
    neden: 'G5: (a) bendi yönetim kurulu üyeleriyle sınırlı değildir (yöneticiler, %5+ ortaklar, denetim kurulu üyeleri, hısımlar
      vb.); ''yani'' kapsamı daraltıyordu.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): D (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: I (%5 ≥ %5) ve III (%30 ≥ %25) doğru, II md. 84/2''ye aykırı; tek doğru şık D.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: SPKn md. 84/2, 84/4-a, 84/4-c alıntıları birebir.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (D, güven 2)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
