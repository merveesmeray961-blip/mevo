      oldukları yönetim imtiyazına, aralarındaki kredi sözleşmesi, kira kontratları gibi diğer önemli finansal ilişkiler bulunması
      durumunda bunlara ilişkin bilgilerin müşteriye açıklanması zorunludur. Yetkili kuruluşun X A.Ş.''deki yüzde ikilik payı
      eşiği aştığından ve kira kontratı bulunduğundan bu bilgiler açıklanır. Püf noktaları: Eşik yüzde birdir; ''veya'' ifadesi
      nedeniyle her biri ayrı ayrı açıklama sebebidir. Karşılıklı payların biri eşiğin altında olsa da diğeri üstündeyse ve
      ayrıca önemli bir finansal ilişki varsa açıklama yapılır.'
