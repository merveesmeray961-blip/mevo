      yönünde açık bir talimatının bulunduğu durumda yatırım kuruluşu müşteri emrini en iyi şekilde gerçekleştirme yükümlülüğünü
      yerine getirmiş sayılır.
    celdiriciler:
      A: Açık talimat bulunduğunda kuruluş, talimata uymakla yükümlülüğünü yerine getirmiş sayılır; başka piyasaya yönlendirme
        zorunluluğu yoktur.
      C: Tebliğ açık talimat hâlinde yükümlülüğün yerine getirilmiş sayılacağını belirtir; kuruluşun ayrıca değerlendirme
