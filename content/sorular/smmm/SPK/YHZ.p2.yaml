    ödenmiş sermayesinin yüzde ikisine, X A.Ş.'nin de kendi oy haklarının yüzde yarımına sahip olduğunu, ayrıca aralarında
    bir kira kontratı bulunduğunu bilmektedir. III-37.1 sayılı Tebliğ'in 50 nci maddesine göre aşağıdakilerden hangisi doğrudur?
