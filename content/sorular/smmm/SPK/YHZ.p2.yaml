    A: Yatırım kuruluşu, talimata rağmen daha uygun fiyatlı başka bir piyasaya yönlendirmek zorundadır.
    B: Açık talimat bulunduğundan kuruluş, en iyi şekilde gerçekleştirme yükümlülüğünü yerine getirmiş sayılır.
    C: Yatırım kuruluşu, yükümlülüğünü yerine getirmiş sayılmaz; çünkü yalnızca fiyat dikkate alınmıştır.
    D: Yatırım kuruluşu, emri yerine getirmeden önce Kurulun onayını almak zorundadır.
    E: Yatırım kuruluşu, emir gerçekleştirme politikasından bağımsız olarak emri gerçekleştirir; hiçbir yükümlülüğü kalmaz.
