  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 86/1 uyarınca Kurul, bankalar hariç olmak üzere tazmin sürecinin kapanmasına ilişkin
      kararı ile birlikte tedricî tasfiye kararı da verebilir ve tedricî tasfiye işlemleri YTM tarafından yürütülür (I ve
      II doğru). Md. 86/4 uyarınca tedricî tasfiye kararı verilmesi hâlinde bu tasfiyenin kapatılması kararına kadar iflas
      kararı verilemez (III doğru). Md. 86/2 uyarınca tedricî tasfiye karar ve işlemlerinde 6102 sayılı Kanun, 2004 sayılı
      Kanun ve diğer mevzuatın tasfiye ile ilgili hükümleri uygulanmaz (IV yanlış). Püf noktaları: Tedricî tasfiye genel tasfiye
      ve iflas hükümlerinden bağımsız özel bir rejimdir; bankalar bu rejimin dışındadır.'
    celdiriciler:
      B: III numaralı ifade de doğrudur; tedricî tasfiye kapatılana kadar iflas kararı verilemez.
      C: IV yanlıştır; tedricî tasfiye karar ve işlemlerinde 6102 ve 2004 sayılı Kanunların tasfiye ile ilgili hükümleri uygulanmaz.
      D: IV yanlıştır; bu Kanunların tasfiye hükümleri uygulanmaz, ayrıca III doğrudur.
