- id: SMMM-SPK-YHZ-0002
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: aracı kurum yetkileri
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre yatırım hizmetleri ve faaliyetleri ile yan hizmetlere ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Yatırım ve kalkınma bankası niteliğinde olmayan bir banka, sermaye piyasası araçlarının kendi hesabından
    alım ve satımı hizmetini yürütebilir.


    II. Yatırım ve kalkınma bankası niteliğinde olmayan bir banka, sermaye piyasası araçlarının halka arzında yüklenimde
    bulunularak satışa aracılık edilmesi hizmetini yürütebilir.


    III. Yatırım ve kalkınma bankaları, yatırım danışmanlığı ve portföy yöneticiliği hizmetlerini de sunabilir.


    IV. Yatırım kuruluşları, Kanunun 38 inci maddesinde sayılan yan hizmetleri ayrıca bir yetki belgesine tabi olmaksızın,
    Kurulca belirlenen esaslar çerçevesinde yapabilir.'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II ve IV
  dogru: C
  aciklama:
    dogru_neden: 'md. 39/9''a göre md. 37''nin (a), (b), (c), (ğ) ve (h) bentlerindeki hizmetler bankalarca da yürütülebilir;
      (ç), (d), (e) ve (f) bentlerindeki hizmetleri ise ayrıca yatırım ve kalkınma bankaları sunabilir. Kendi hesabından
      alım satım (md. 37/1-c) tüm bankalarca yürütülebildiğinden I doğrudur. Yatırım danışmanlığı (d) ve portföy
      yöneticiliği (ç) yatırım ve kalkınma bankalarına tanınmıştır (III doğru). md. 39/2''ye göre yan hizmetler
      ayrıca yetki belgesine tabi değildir (IV doğru). Yüklenimli satışa aracılık (e) yalnız yatırım ve kalkınma
      bankalarının yapabildiği hizmetlerdendir (II yanlış).


      Püf noktaları: md. 37''deki bentleri md. 39/9 ile birlikte okuyun: bankalar için genel kural (a, b, c, ğ,
      h), yatırım ve kalkınma bankaları için ise genişletilmiş liste (ç, d, e, f) vardır. İfadelerdeki "yatırım
      ve kalkınma bankası niteliğinde olmayan" ve "yatırım ve kalkınma bankaları" ayrımına dikkat edin. Yan hizmetler
      (md. 38) ana hizmetlerden ayrı tutulur ve ayrıca yetki belgesi aranmaz. Tuzak: yüklenimli ve yüklenimsiz satışa
      aracılığı ya da kendi hesabına alım satımı ile portföy yöneticiliğini birbirine karıştırmak.'
    celdiriciler:
      A: I doğrudur; ancak II yanlıştır, çünkü yüklenimli satışa aracılık (md. 37/1-e) yatırım ve kalkınma bankası
        niteliğinde olmayan bankalarca yürütülemez.
      B: 'II yanlıştır (md. 39/9: (e) bendi yalnız yatırım ve kalkınma bankalarına tanınmıştır); ayrıca doğru olan
        I ve IV dışarıda kalmıştır.'
      D: II yanlıştır; md. 39/9'a göre yüklenimli satışa aracılık yalnız yatırım ve kalkınma bankalarınca yapılabilir.
        Doğru olan I da seçenekte yoktur.
      E: II yanlıştır (md. 39/9); ayrıca doğru olan III bu seçenekte yer almamıştır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 37/1 (c), (ç), (d), (e)
    alinti: c) Sermaye piyasası araçlarının kendi hesabından alım ve satımı ç) Portföy yöneticiliği d) Yatırım danışmanlığı
      e) Sermaye piyasası araçlarının halka arzında yüklenimde bulunularak satışa aracılık edilmesi
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 39/2 ve 39/9
    alinti: (2) Yan hizmetler, yatırım kuruluşları ve portföy yönetim şirketlerince ayrıca bir yetki belgesine tabi
      olmaksızın Kurulca belirlenen esaslar çerçevesinde yapılır. ... (9) Bu Kanunun 37 nci maddesinin (a), (b),
      (c), (ğ) ve (h) bentlerinde sayılan yatırım hizmet ve faaliyetleri bankalarca da yürütülebilir. Yatırım ve
      kalkınma bankaları aynı maddenin (ç), (d), (e) ve (f) bentlerinde sayılan hizmetleri de sunabilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 38/1 (giriş)
    alinti: '(1) Yatırım kuruluşları ve portföy yönetim şirketlerinin yapabilecekleri yan hizmetler şunlardır:'
