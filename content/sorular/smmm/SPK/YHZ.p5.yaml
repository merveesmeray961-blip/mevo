      tanınmıştır" ifadesi "bankalar arasında yalnız yatırım ve kalkınma bankalarına" olarak daraltıldı; gecerlilik.baslangic
      2020-02-20 → 2012-12-30.'
    neden: 'G5/G6: md. 37/1-e hizmetini aracı kurumlar da yürütür; md. 39/9 yalnız bankalar arasındaki ayrımı yapar.
      Dayanılan md. 37, 38/1 giriş, 39/2 ve 39/9 6362 sayılı Kanunun ilk hâlidir (RG 30/12/2012); 2020-02-20 7222
      sayılı Kanunun kabul tarihidir ve soruyu etkileyen bir değişiklik içermez.'
