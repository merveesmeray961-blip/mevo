- id: SMMM-SPK-YHZ-0004
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: Yatırımcı Tazmin Merkezi
  tip: uygulama
  zorluk: 3
  kok: Bir yatırım kuruluşu hakkında yatırımcıları tazmin kararı verilmiştir. Yatırımcının zararı, yatırım kuruluşunun yatırımcı
    adına sakladığı nakdin ödenmemesinden kaynaklanmaktadır. Ancak yatırımcı aynı zamanda yatırım danışmanlığı hizmetinden
    kaynaklandığını ileri sürdüğü ayrı bir zarar talebinde bulunmaktadır. Tazmin süreci bakımından aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Her iki zarar da YTM tarafından tazmin edilir; danışmanlık kaynaklı zararlar kapsam dışı değildir.
    B: Yalnız yatırım danışmanlığı zararları tazmin edilir; saklanan nakdin ödenmemesi kapsam dışıdır.
    C: Yatırımcı yalnızca bir yıl içinde yazılı olarak başvurursa her iki zarar için sınırsız tazmin alır.
    D: Yatırım kuruluşunun yatırımcı adına sakladığı nakdin ödenmemesinden doğan talep kapsamda olabilir; yatırım danışmanlığından
      kaynaklanan zarar kapsam dışıdır ve tazmin talebi YTM'ye yazılı yapılır.
    E: Tazmin talebi yalnız mahkemeye yapılabilir; YTM'ye başvuru öngörülmemiştir.
  dogru: D
  aciklama:
    dogru_neden: 'SPKn md. 84/1''e göre yatırımcı adına saklanan nakit ödeme yükümlülüğünün yerine getirilmemesinden kaynaklanan
      talepler tazmin kapsamındadır; md. 84/2 yatırım danışmanlığından kaynaklanan zararları kapsam dışında bırakır. Md. 85/1''e
      göre tazmin talepleri YTM''ye yazılı yapılır ve tazmin kararının ilanından itibaren bir yıl sonra zamanaşımına uğrar.
      Püf noktaları: Tazmin kapsamını zararın kaynağı belirler; yatırım danışmanlığı zararını saklama/ödeme yükümlülüğünün
      ihlalinden ayırın.'
    celdiriciler:
      A: Yatırım danışmanlığından kaynaklanan zararlar md. 84/2 uyarınca kapsam dışıdır.
      B: Saklanan nakdin ödenmemesinden doğan talep md. 84/1 kapsamında olabilir.
      C: Tazmin sınırsız değildir; ayrıca başvuru YTM'ye yazılı yapılır ve süre bir yıldır.
      E: Md. 85/1 tazmin taleplerinin YTM'ye yazılı yapılacağını açıkça düzenler.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/1-2
    alinti: "MADDE 84 – (1) Tazminin kapsamını, yatırımcılara ait olan ve yatırım hizmeti ve\nfaaliyeti veya yan hizmetler\
      \ ile bağlantılı olarak yatırım kuruluşu tarafından yatırımcı adına\nsaklanan veya yönetilen nakit ödeme veya sermaye\
      \ piyasası araçlarının teslim\nyükümlülüklerinin yerine getirilmemesinden kaynaklanan talepler oluşturur.\n        (2)\
      \ Yatırımcıları tazmin kararı verilen kuruluşların yatırımcıları, bu madde\nkapsamında tazmin talep etme hakkına sahiptir.\
      \ Yatırımcıların yatırım danışmanlığı veya\npiyasadaki fiyat hareketlerinden kaynaklanan zararları tazmin kapsamında\
      \ değildir."
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 85/1
    alinti: '(5) Hak sahibi her bir yatırımcıya ödenecek azami tazmin tutarı yüz bin Türk Lirasıdır.

      Bu tutar her yıl ilan edilen yeniden değerleme katsayısı oranında artırılır. Kurulun teklifi

      üzerine Cumhurbaşkanı tarafından toplam tazmin tutarı beş katına kadar artırılabilir.'
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/5
    alinti: 'MADDE 85 – (1) Yatırımcılar tazmin taleplerini YTM’ye yazılı olarak yaparlar. Tazmin

      talebinde bulunma hakkı, tazmin kararının ilanından itibaren bir yıl sonra zamanaşımına uğrar.'
