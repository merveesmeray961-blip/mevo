- id: SMMM-SPK-YHZ-0005
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: aracı kurum yetkileri
  tip: bilgi
  zorluk: 1
  kok: Yatırım kuruluşunun, yetkili olduğu yatırım hizmetleri ve faaliyetlerine bağlı bir yan hizmeti sunması planlanmaktadır.
    Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yan hizmetin sunulabilmesi için her durumda ayrıca bir yetki belgesi alınması gerekir.
    B: Yan hizmetler yalnızca portföy yönetim şirketleri tarafından sunulabilir.
    C: Yan hizmetler için ayrıca Kurul izni alınması, yatırım hizmeti ve faaliyetleri için alınan izinden bağımsız olarak
      zorunludur.
    D: Yan hizmetler yalnızca faaliyet izninden sonra bildirilebilir; başvuru sırasında bildirim yapılamaz.
    E: Yan hizmetler ayrıca bir yetki belgesine tabi olmaksızın, Kurulca belirlenen esaslar çerçevesinde yapılabilir.
  dogru: E
  aciklama:
    dogru_neden: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ md. 7/1, yan hizmetlerin
      ayrıca bir yetki belgesine tabi olmaksızın Kurulca belirlenen esaslar çerçevesinde yapılacağını düzenler.
    celdiriciler:
      A: md. 7/1'de ayrıca yetki belgesi alınması değil, bu belgeden bağımsız olarak yan hizmet sunulabilmesi öngörülür.
      B: Tebliğ md. 6'da yatırım kuruluşlarının yan hizmetleri düzenlenmiştir; bunlar yalnız portföy yönetim şirketlerine
        özgülenmemiştir.
      C: Yan hizmetler için ayrıca Kurul izni alınması değil, ayrıca yetki belgesi olmaksızın sunulabilmesi esastır.
      D: md. 7/2 uyarınca planlanan yan hizmetler faaliyet izni başvurusu sırasında Kurula bildirilir; sonradan ek hizmet
        için de bildirim yapılır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 7/1-2
    alinti: "MADDE 7 – (1) Yan hizmetler, yatırım kuruluşları tarafından ayrıca bir yetki belgesine tâbi olmaksızın Kurulca\
      \ belirlenen esaslar çerçevesinde\nyapılır.\n        (2) Yatırım kuruluşları, faaliyet izni başvuruları sırasında sunmayı\
      \ planladıkları yan hizmetleri de Kurula bildirmekle yükümlüdürler. Faaliyet\nizninin alınmasından sonra, başka yan\
      \ hizmetlerin de sunulmak istenmesi halinde, bunlar için de ayrıca Kurula bildirimde bulunulur."
