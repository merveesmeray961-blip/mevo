  tip: kavrama
  zorluk: 3
  kok: Bir aracı kurum emir iletimine aracılık ve yatırım danışmanlığı faaliyetlerinin yanı sıra genel saklama hizmeti de
    yürütmek istemektedir. Tebliğdeki aracı kurum gruplandırmasına göre bu kurum hangi grupta yer alır?
  secenekler:
    A: Dar yetkili
    B: Kısmi yetkili
    C: Geniş yetkili
    D: Sınırlı yetkili
    E: Özel yetkili
