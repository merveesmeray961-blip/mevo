  aciklama:
    dogru_neden: 'III-37.1 sayılı Tebliğ md. 8/1''e göre emir iletimine aracılık ve yatırım danışmanlığı faaliyetleri dar
      yetkili grubu; genel saklama hizmeti ise geniş yetkili grubu belirleyen faaliyetler arasındadır. Verilen faaliyetler
      içinde genel saklama bulunduğundan kurum geniş yetkili gruptadır. Püf noktaları: Birden fazla faaliyet verildiğinde,
      gruplandırmada daha üst grubu belirleyen faaliyetin bulunup bulunmadığını kontrol edin.'
    celdiriciler:
      A: Dar yetkili grup emir iletimine aracılık ve yatırım danışmanlığı faaliyetleriyle tanımlanır; genel saklama bu grubu
        aşar.
      B: Kısmi yetkili grup işlem aracılığı, en iyi gayret aracılığı, sınırlı saklama ve portföy yöneticiliği faaliyetleriyle
        tanımlanır.
      D: Tebliğde bu faaliyet kombinasyonu için 'sınırlı yetkili' grubu yoktur.
      E: Tebliğde bu faaliyet kombinasyonu için 'özel yetkili' grubu yoktur.
