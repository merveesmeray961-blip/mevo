  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: Yatırımcı Tazmin Merkezi
  tip: uygulama
  zorluk: 3
  kok: Bir yatırım kuruluşunun yatırım hizmet ve faaliyetlerinden kaynaklanan yükümlülüklerini yerine getirememesi nedeniyle
    yatırımcıların tazmini gündeme gelmiştir. Aşağıdakilerden hangisi Yatırımcı Tazmin Merkezi bakımından doğrudur?
  secenekler:
    A: YTM özel hukuk tüzel kişisidir ve yatırım kuruluşlarının katılımı isteğe bağlıdır.
    B: YTM yalnızca yatırım kuruluşlarının gönüllü olarak başvurması hâlinde tazmin işlemi yapabilir.
    C: YTM kamu tüzel kişiliğini haizdir; yatırımcıların Kanundaki şartlar çerçevesinde tazmini amacıyla kurulmuştur ve yatırım
      kuruluşlarının YTM'ye katılması zorunludur.
    D: YTM'nin kurulması için yatırım kuruluşlarının tamamının ayrıca genel kurul kararı alması gerekir.
    E: YTM yalnızca sermaye piyasası araçlarının tesliminden doğan yükümlülükler için kurulmuştur; nakit ödeme yükümlülükleri
      kapsam dışıdır.
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Sermaye Piyasası Kanunu md. 83/1''e göre yatırımcıların Kanundaki şartlar çerçevesinde tazmini
      amacıyla kamu tüzel kişiliğini haiz YTM kurulmuştur. md. 83/2''ye göre yatırım kuruluşlarının YTM''ye katılması zorunludur.
      Püf noktaları: YTM''nin hukuki niteliği ile kuruluş amacını ve yatırım kuruluşlarının zorunlu katılımını birlikte değerlendirin;
      nakit ödeme yükümlülükleri de Kanunun yatırımcı tazmin rejiminde yer alır.'
    celdiriciler:
      A: md. 83/1 YTM'yi kamu tüzel kişiliğine haiz olarak tanımlar; md. 83/2 katılımı zorunlu tutar.
      B: YTM'nin kuruluş amacı yatırımcıların Kanundaki şartlar çerçevesinde tazminidir; gönüllü başvuru şartı yoktur.
      D: YTM'nin kuruluşu Kanunun 83 üncü maddesiyle düzenlenmiştir; her yatırım kuruluşunun ayrıca kuruluş kararı alması
        aranmaz.
      E: Kanundaki tanım ve tazmin rejimi yatırım kuruluşlarının yatırım hizmet ve faaliyetlerinden kaynaklanan nakit ödeme
        veya sermaye piyasası araçlarının teslim yükümlülüklerini kapsar.
