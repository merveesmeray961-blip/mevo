- id: SMMM-SPK-YHZ-0003
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: yerindelik testi
  tip: uygulama
  zorluk: 2
  kok: Bir yatırım kuruluşu, müşterisiyle bireysel portföy yöneticiliği hizmeti için çerçeve sözleşmesi imzalamayı planlamaktadır.
    Müşteri yerindelik testi için istenen bilgilerin bir bölümünü vermemekte ve verilen bazı bilgilerin güncel olmadığı açıkça
    anlaşılmaktadır. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kuruluş, eksik bilgileri kendi tahminleriyle tamamlayarak hizmeti sunabilir.
    B: Yerindelik testi yalnız profesyonel müşteriler için yapılır.
    C: Müşteriye hizmet sunulabilir; yalnızca yazılı bir uyarı verilmesi yeterlidir.
    D: Müşterinin bilgileri eksik veya açıkça güncel değilse bireysel portföy yöneticiliği veya yatırım danışmanlığı hizmeti
      sunulamaz ve müşteriye yazılı bildirim yapılmalıdır.
    E: Müşterinin bilgi vermemesi hizmetin sunulmasına engel değildir; test yalnız tavsiye niteliğindedir.
  dogru: D
  aciklama:
    dogru_neden: III-37.1 Tebliği md. 40/6'ya göre müşterinin yerindelik testi için istenen bilgileri vermemesi veya eksik
      ya da güncel olmadığı açıkça anlaşılabilen bilgi vermesi durumunda müşteriye bireysel portföy yöneticiliği veya yatırım
      danışmanlığı hizmeti sunulamaz; yetkili kuruluş bunu yazılı olarak bildirmek zorundadır.
    celdiriciler:
      A: Kuruluş eksik bilgileri varsayımla tamamlayamaz; kaynak hüküm hizmet sunulmasını yasaklar.
      B: Yerindelik testi bireysel portföy yöneticiliği ve yatırım danışmanlığı hizmetinden önce zorunludur; yalnız profesyonel
        müşterilere özgü değildir.
      C: Yazılı bildirim hizmet sunma yasağının yerine geçmez; hizmet sunulamaz.
      E: Kaynak hüküm, gerekli bilgilerin verilmemesini hizmet sunulmasına doğrudan engel olarak düzenler.
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 40/1 ve 40/6
    alinti: "(1) Yetkili kuruluşun bir müşteriye bireysel portföy yöneticiliği veya yatırım danışmanlığı hizmeti sunmak üzere\
      \ çerçeve\nsözleşmesi imzalamasından önce “yerindelik testi” uygulaması zorunludur. Yerindelik testi, bireysel portföy\
      \ yöneticiliği veya yatırım danışmanlığı\n\fkapsamında müşteriye sunulacak hizmet ile müşterinin yatırım amaçları, mali\
      \ durumu ile bilgi ve tecrübesinin uyumlu olup olmadığının yetkili kuruluşlar\ntarafından değerlendirilmesidir. Bireysel\
      \ portföy yöneticiliği veya yatırım danışmanlığı hizmeti yerindelik testinin sonucuna uygun olarak sunulur."
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 40/6
    alinti: '(6) Müşterinin yerindelik testi için istenen bilgileri vermemesi veya eksik ya da güncel olmadığı açıkça anlaşılabilen
      bilgi vermesi durumunda bu

      müşteriye bireysel portföy yöneticiliği veya yatırım danışmanlığı hizmeti sunulamaz. Bu durumda yetkili kuruluş müşteriye,
      söz konusu hizmetlerin

      kendisine verilemeyeceği konusunda yazılı bildirim yapmak zorundadır.'
