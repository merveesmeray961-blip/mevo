- id: SMMM-SPK-YHZ-0007
  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: Yatırımcı Tazmin Merkezi
  tip: uygulama
  zorluk: 2
  kok: Bir yatırım kuruluşunun Yatırımcı Tazmin Merkezine katılımı ve yatırım hizmetlerinden doğan, hesap sahibinin son talep
    veya işleminden sonra uzun süre talep edilmeyen emanet ve alacaklar bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yatırım kuruluşlarının YTM'ye katılması isteğe bağlıdır; emanetler beş yıl sonra devredilir.
    B: Yatırım kuruluşlarının YTM'ye katılması zorunludur; yatırım hizmetlerinden kaynaklanan emanet ve alacaklar son talep,
      işlem veya yazılı talimat tarihinden başlayarak on yıl içinde talep ve tahsil edilmezse YTM'ye emaneten devredilir.
    C: YTM'ye yalnız bankaların katılması zorunludur; emanetler on beş yıl sonra devredilir.
    D: YTM'ye katılım zorunlu olmakla birlikte emanet ve alacakların YTM'ye devri için Kurulun ayrıca her bir hesap sahibinden
      onay alması gerekir.
    E: YTM kamu tüzel kişiliğine sahip değildir ve yalnız özel hukuk sözleşmeleriyle faaliyet gösterir.
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 83/1 YTM'nin kamu tüzel kişiliğine sahip olduğunu; md. 83/2 yatırım kuruluşlarının YTM'ye katılmasının
      zorunlu olduğunu; md. 83/4 ise belirli emanet ve alacakların on yıl içinde talep ve tahsil edilmemesi hâlinde YTM'ye
      emaneten devredileceğini düzenler.
    celdiriciler:
      A: Katılım isteğe bağlı değil zorunludur; süre de beş değil on yıldır.
      C: Hüküm yalnız bankalarla sınırlı değildir; yatırım kuruluşlarının katılımı zorunludur.
      D: Md. 83/4'te bireysel Kurul onayı şartı bulunmaz.
      E: Md. 83/1 YTM'yi açıkça kamu tüzel kişiliğine sahip olarak tanımlar.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 83/1-2
