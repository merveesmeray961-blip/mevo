  aciklama:
    dogru_neden: III-37.1 sayılı Tebliğ md. 40/1, yatırım danışmanlığı veya bireysel portföy yöneticiliği sözleşmesinden önce
      yerindelik testi uygulanmasını zorunlu tutar.
    celdiriciler:
      A: Değerlendirme yalnız gelir belgesinden ibaret değildir; amaç, mali durum, bilgi ve tecrübe birlikte değerlendirilir.
      C: Risk tercihi tek başına düzenlemede sayılan bütün unsurları karşılamaz.
      D: Geçmiş işlem deneyimi tek başına yeterli değildir.
      E: Test sözleşmeden önce yapılmalıdır.
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 40/1
