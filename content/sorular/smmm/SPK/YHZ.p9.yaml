  ders: SPK
  unite: Yatırım hizmetleri ve tazmin
  konu: YHZ
  kazanim: yerindelik testi
  tip: uygulama
  zorluk: 1
  kok: Bir müşteri yatırım danışmanlığı hizmeti almak istemektedir. Yetkili kuruluş, çerçeve sözleşmesini imzalamadan önce
    hangi değerlendirmeyi yapmak zorundadır?
  secenekler:
    A: Yalnız müşterinin gelir belgesini incelemelidir.
    B: Müşterinin yatırım amaçları, mali durumu, bilgi ve tecrübesinin sunulacak hizmetle uyumunu değerlendiren yerindelik
      testini uygulamalıdır.
    C: Yalnız müşterinin risk tercihini yazılı olarak almalıdır.
    D: Müşterinin geçmişte borsada işlem yapmış olması yeterlidir.
    E: Testi sözleşmeden sonra, ilk yatırım emri verilince uygulamalıdır.
