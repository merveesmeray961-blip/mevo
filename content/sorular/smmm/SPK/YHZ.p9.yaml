      sermaye piyasası araçları teslim yükümlülüklerini yerine getirememeleri hâlinde Kurulca alınan tazmin kararını
      yerine getirmek amacıyla kurulmuş, kamu tüzel kişiliğine sahip Yatırımcı Tazmin Merkezi olarak tanımlar. Püf
      noktaları: Tazmin kararını Kurul alır, merkez bu kararı yerine getirir.'
    celdiriciler:
      A: YTM takas ve teminat işlemi yürütmez; Kanunda kamu tüzel kişiliğine sahip olarak tanımlanmıştır.
      B: YTM mevduat sigortası kuruluşu değildir; tazmin kararını yerine getirmek üzere kurulmuş kamu tüzel kişisidir.
      D: Tazmin kararını Kurul alır; YTM bu kararı yerine getirir (md. 3/1-y), karar organı değildir.
