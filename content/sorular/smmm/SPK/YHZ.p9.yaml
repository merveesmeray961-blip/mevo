      getirmek amacıyla kurulmuş, kamu tüzel kişiliğine sahip merkezdir.
    D: Yatırım kuruluşlarının yükümlülüklerini yerine getirememesi hâlinde tazmin kararını bizzat veren, Kurul bünyesinde
      faaliyet gösteren karar organıdır.
    E: Yatırım fonlarının portföyündeki varlıkları saklayan ve fon katılma payı sahiplerine tazminat ödeyen özel
      hukuk kuruluşudur.
