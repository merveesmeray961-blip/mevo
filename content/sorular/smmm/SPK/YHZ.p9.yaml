      varlığı hakkında sunduğu bilgilerle sınırlıdır.
    celdiriciler:
      A: Md. 40/3 mali durum değerlendirmesini müşterinin sunduğu bilgilerle sınırlar; kuruluşa ayrıca hesap veya
        taşınmaz araştırması yükümlülüğü getirmez.
      B: Md. 40/4'te bilgilerin alınmasının zorunlu olmadığı hâl, talebe dayalı olarak kabul edilenler hariç profesyonel
        müşterilerdir; talebe dayalı profesyonel müşterilerden bu bilgiler alınır.
      D: Md. 40/7'ye göre müşteri, yerindelik testi için verdiği bilgilerin doğruluğundan sorumludur.
      E: Md. 40/5'e göre testin sonuçlarına uygun olmayan hizmet müşteriye sunulamaz; yazılı talep bu yasağı kaldırmaz.
