  kok: TSRS 1'e göre işletme, sürdürülebilirlikle ilgili risk ve fırsatlardan hangilerine ilişkin bilgileri açıklamak
    zorundadır?
  secenekler:
    A: Çevre ve toplum üzerindeki etkisi en yüksek olarak değerlendirilen risk ve fırsatlar
    B: Paydaş anketlerinde en çok bilgi talep edilen konulara ilişkin risk ve fırsatlar
    C: Bir yıllık raporlama dönemi içinde finansal tablolara yansıması kesin olan risk ve fırsatlar
    D: Nakit akışlarını, finansmana erişimini veya sermaye maliyetini etkilemesi makul ölçüde beklenebilecekler
    E: Sektörde yasal zorunluluk olarak izlenen çevresel göstergelerle ilgili risk ve fırsatlar
  dogru: D
  aciklama:
    dogru_neden: TSRS 1 prg. 3'e göre işletme, kısa, orta veya uzun vadede nakit akışlarını, finansmana erişimini
      veya sermaye maliyetini etkilemesi makul ölçüde beklenebilecek sürdürülebilirlikle ilgili tüm risk ve fırsatlara
      ilişkin bilgileri açıklar. Bu yaklaşım asli kullanıcıların (yatırımcı ve kredi verenler) kararlarını esas
      alır; gelecekteki finansal yeterliliği etkilemesi makul ölçüde beklenemeyecek risk ve fırsatlar kapsam dışıdır
      (prg. 6).
    celdiriciler:
      A: İşletmenin çevre ve topluma etkisini esas alan yaklaşım etki önemliliğidir; TSRS 1 finansal etkiyi esas
        alır.
      B: Ölçüt paydaş anketi değil, işletmenin gelecekteki finansal yeterliliğini etkileme beklentisidir.
      C: Standart kısa, orta ve uzun vadeyi birlikte kapsar; bir yılla ve kesin yansımayla sınırlı değildir.
      E: Kapsam yasal göstergelerle değil, işletmenin nakit akışları, finansmana erişimi ve sermaye maliyeti üzerindeki
        makul beklenen etkiyle belirlenir.
