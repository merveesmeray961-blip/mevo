- id: SMMM-STD-KRL-0014
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Meslek kuruluşları ve sürdürülebilirlik
  konu: KRL
  kazanim: TSRS ve KGK
  tip: kavrama
  zorluk: 3
  kok: 'TSRS 1''i ilk kez uygulayan bir işletme, ilk yıllık raporlama döneminde geçiş muafiyetini kullanarak yalnız
    iklimle ilgili risk ve fırsatlara ilişkin bilgileri açıklamıştır. TSRS 1 Ek E''ye göre aşağıdaki ifadelerden
    hangileri doğrudur?

    I. İşletme bu geçiş muafiyetini kullandığını açıklar.

    II. İşletmenin ikinci yıllık raporlama döneminde, iklimle ilgili olanlar dışındaki sürdürülebilirlikle ilgili
    risk ve fırsatlar için karşılaştırmalı bilgi açıklaması zorunlu değildir.

    III. İşletmenin ilk yıllık raporlama döneminde, iklimle ilgili risk ve fırsatlar için önceki döneme ait karşılaştırmalı
    bilgi açıklaması zorunludur.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'TSRS 1 E5''e göre işletme ilk yıllık raporlama döneminde yalnız iklimle ilgili risk ve fırsatlara
      ilişkin bilgileri açıklayabilir ve bu muafiyeti kullanırsa bu durumu açıklar (I doğru). E6(b)''ye göre muafiyeti
      kullanan işletmenin ikinci yıllık raporlama döneminde iklim dışındaki risk ve fırsatlar için karşılaştırmalı
      bilgi açıklaması zorunlu değildir (II doğru). E6(a) ve E3''e göre ilk yılda iklimle ilgili karşılaştırmalı
      bilgi de zorunlu değildir (III yanlış).


      Püf noktaları: E5 ile E6 birlikte okunmalı: ilk yıl yalnız iklim konusu açıklanır ve karşılaştırmalı bilgi
      verilmez; ikinci yıl iklim dışı konular ilk kez açıklandığından onların karşılaştırmalı bilgisi de istenmez.
      Prg. 70''teki karşılaştırmalı bilgi genel kuralını geçiş döneminde aynen uygulama.'
    celdiriciler:
      A: II de doğrudur; E6(b) ikinci yılda iklim dışı konular için karşılaştırmalı bilgi zorunluluğunu kaldırır.
      C: III yanlıştır; E6(a) ilk yılda iklimle ilgili karşılaştırmalı bilgiyi zorunlu tutmaz.
      D: I doğru, III yanlıştır; muafiyeti kullanan işletme bunu açıklar.
      E: III yanlış olduğundan üç ifade birlikte doğru değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: TSRS 1 Sürdürülebilirlikle İlgili Finansal Bilgilerin Açıklanmasına İlişkin Genel Hükümler
    madde: Ek E prg. E5
    alinti: Bu geçiş muafiyetini kullanması durumunda, işletme bu durumu açıklar.
  - mevzuat: TSRS 1 Sürdürülebilirlikle İlgili Finansal Bilgilerin Açıklanmasına İlişkin Genel Hükümler
    madde: Ek E prg. E6
    alinti: İşletmenin bu Standardı uyguladığı ikinci yıllık raporlama döneminde, iklimle ilgili risk ve fırsatlar
