    hangi kapsamda sınıflandırılır?

    I. Kendi fırınlarında yakılan kömürden kaynaklanan emisyonlar

    II. Fabrikada tüketilen, şebekeden satın alınmış elektriğin üretiminden kaynaklanan emisyonlar

    III. Satın alınan hammaddelerin tedarikçi tesislerinde üretilmesinden kaynaklanan emisyonlar'
  secenekler:
    A: 'I: Kapsam 1, II: Kapsam 2, III: Kapsam 3'
    B: 'I: Kapsam 1, II: Kapsam 3, III: Kapsam 2'
    C: 'I: Kapsam 2, II: Kapsam 1, III: Kapsam 3'
    D: 'I: Kapsam 1, II: Kapsam 1, III: Kapsam 3'
    E: 'I: Kapsam 2, II: Kapsam 3, III: Kapsam 3'
  dogru: A
  aciklama:
    dogru_neden: TSRS 2'ye göre Kapsam 1, işletmenin sahip olduğu veya kontrol ettiği kaynaklardan ortaya çıkan
      doğrudan emisyonlardır (I). Kapsam 2, işletmece tüketilen satın alınmış veya edinilmiş elektriğin, buharın,
      ısıtmanın veya soğutmanın üretiminden kaynaklanan dolaylı emisyonlardır (II). Kapsam 3, Kapsam 2 dışında kalan
      ve değer zincirinde ortaya çıkan dolaylı emisyonlardır; satın alınan mal ve hizmetler ilk Kapsam 3 kategorisidir
      (III).
    celdiriciler:
      B: Satın alınan elektrik Kapsam 2'dir; tedarikçide üretilen hammadde emisyonu Kapsam 3'tür.
      C: Kendi fırınındaki yakıt doğrudan emisyon (Kapsam 1), satın alınan elektrik dolaylı emisyondur (Kapsam 2).
      D: Elektrik işletmenin kendi tesisinde değil üretildiği santralde emisyon oluşturur; bu nedenle Kapsam 1 değil
        Kapsam 2'dir.
      E: Kendi kaynağında yakılan kömür Kapsam 1'dir; satın alınan elektrik Kapsam 3'e değil Kapsam 2'ye girer.
