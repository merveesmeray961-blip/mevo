  zorluk: 3
  kok: Ara dönem finansal tablo sunma zorunluluğu bulunmayan ve gönüllü olarak da ara dönem finansal tablo sunmayan
    bir işletme, TSRS 1'i ilk kez 1/1/2025–31/12/2025 yıllık raporlama dönemi için uygulamaktadır. İşletmenin 2025
    yılı finansal tabloları 31/3/2026 tarihinde yayımlanmıştır. İşletme TSRS 1 Ek E'deki geçiş muafiyetini kullanırsa
    sürdürülebilirlikle ilgili finansal açıklamalarını en geç hangi tarihte raporlamalıdır?
  secenekler:
    A: 31 Mart 2026
    B: 30 Haziran 2026
    C: 30 Eylül 2026
    D: 31 Aralık 2026
    E: 31 Mart 2027
  dogru: C
  aciklama:
    dogru_neden: 'TSRS 1 prg. 64''e göre genel kural, sürdürülebilirlikle ilgili finansal açıklamaların finansal
      tablolarla aynı zamanda raporlanmasıdır. Ancak Ek E4''e göre standardın uygulandığı ilk yıllık raporlama döneminde
      bu açıklamaların finansal tablolardan sonra raporlanmasına izin verilir; ara dönem finansal tablo sunma zorunluluğu
      olmayan ve gönüllü sunmayan işletme, ilk uygulama döneminin sonundan (31/12/2025) itibaren dokuz ay içinde,
      yani en geç 30 Eylül 2026''da raporlar.


      Püf noktaları: Dokuz aylık süre finansal tabloların yayım tarihinden değil, ilk uygulama yapılan yıllık raporlama
      döneminin sonundan başlar; 31/3/2026 tarihi süreyi etkilemez. Genel kuraldaki “aynı zamanda raporlama” ilk
      yıl için geçiş muafiyetiyle esnetilmiştir.'
    celdiriciler:
      A: Finansal tablolarla aynı zamanda raporlama prg. 64'teki genel kuraldır; ilk yılda geçiş muafiyeti daha
        geç raporlamaya izin verir.
      B: Altı aylık ara dönem raporuyla birlikte raporlama, ara dönem rapor sunan işletmeler için geçerlidir; bu
        işletme ara dönem rapor sunmamaktadır.
      D: Dokuz ay, finansal tabloların yayım tarihinden (31/3/2026) sayılarak bulunmuştur; süre dönem sonundan başlar.
      E: On iki aylık bir süre geçiş hükümlerinde yer almaz.
    hesap_adimlari:
    - 'İlk uygulama döneminin sonu: 31/12/2025'
    - 'Ara dönem rapor yok → Ek E4(c): dönem sonundan itibaren 9 ay'
    - 31/12/2025 + 9 ay = 30/9/2026
