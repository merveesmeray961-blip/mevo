- id: SMMM-STD-KRL-0005
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Meslek kuruluşları ve sürdürülebilirlik
  konu: KRL
  kazanim: TSRS ve KGK
  tip: uygulama
  zorluk: 3
  kok: '660 sayılı KHK''ya göre KGK Kurulunun toplantı ve karar usulüne ilişkin aşağıdaki ifadelerden hangileri
    doğrudur?

    I. Kurul, en az altı üyenin hazır bulunmasıyla toplanır.

    II. Altı üyenin katıldığı bir toplantıda dört üyenin aynı yöndeki oyu karar alınması için yeterlidir.

    III. Kurul oylamalarında çekimser oy kullanılamaz.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: '660 sayılı KHK md. 8/3''e göre Kurul en az altı üyenin hazır bulunmasıyla toplanır (I doğru) ve
      en az beş üyenin aynı yöndeki oyuyla karar alır; oylamalarda çekimser oy kullanılamaz (III doğru). Altı üyeli
      toplantıda dört oy salt çoğunluğu sağlasa da kanunun aradığı beş aynı yönde oya ulaşmaz (II yanlış).


      Püf noktaları: Toplantı nisabı (altı) ile karar nisabı (beş aynı yönde oy) ayrı sayılardır ve karar nisabı
      katılanların çoğunluğuna göre değil sabit sayı olarak belirlenmiştir. Altı kişilik toplantıda salt çoğunluk
      mantığıyla dört oyu yeterli sayma tuzağına düşme.'
    celdiriciler:
      A: Çekimser oy yasağı da md. 8/3'te açıkça yer aldığından III de doğrudur.
      B: Karar için en az beş üyenin aynı yöndeki oyu gerekir; dört oy yetmez.
      C: II yanlıştır; dört oy karar nisabını karşılamaz. III ise doğrudur.
      E: II yanlış olduğundan üç ifade birlikte doğru değildir.
    hesap_adimlari: []
