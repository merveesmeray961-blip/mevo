  - SGS
  ders: STD
  unite: Meslek kuruluşları ve sürdürülebilirlik
  konu: KRL
  kazanim: 3568 - amacı dışında faaliyet gösteren oda
  tip: uygulama
  zorluk: 3
  kok: Bir serbest muhasebeci mali müşavirler odasının, kuruluş amaçları dışında faaliyet gösterdiği belirlenmiştir. 3568
    sayılı Kanuna göre sorumlu organların görevlerine son verilmesi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Birlik Yönetim Kurulu kendiliğinden karar verir ve bu karar Maliye Bakanlığınca doğrudan tescil edilir
    B: Oda Genel Kurulu olağanüstü toplanarak organları görevden alır ve yerlerine yenilerini seçer
    C: Kamu Gözetimi Kurumu, idari yaptırım kararıyla organların görevine son verir ve kararı tebliğ eder
    D: Sulh ceza hâkimliği, savcılığın istemi üzerine dosya üzerinden bir ay içinde karar verir ve kesinleşir
    E: Bakanlığın veya Başsavcılığın istemi üzerine asliye hukuk mahkemesi basit usulle karar verir; dava üç ay içinde biter
  dogru: E
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 15 uyarınca amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine
      son verilmesine ve yerlerine yenilerinin seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının
      istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç
      üç ay içinde sonuçlandırılır. Püf noktaları: Karar mercii mahkemedir; istem makamı Bakanlık veya Başsavcılıktır. Mahkeme
      görevden alma kararında ayrıca yeni organları seçecek beş kişiyi görevlendirir ve seçim bir ay içinde sonuçlandırılır.'
    celdiriciler:
      A: Birlik Yönetim Kurulunun odanın organlarını kendiliğinden görevden alma yetkisi yoktur; karar mahkemece verilir.
      B: Genel Kurul odanın en yüksek organıdır, ancak amacı dışına çıkan organların görevine son verme yetkisi md. 15'e göre
        mahkemeye aittir.
      C: Kurum bu konuda bir idari yaptırım yetkisi taşımaz; yetkili mahkeme asliye hukuk mahkemesidir.
      D: Yetkili mahkeme sulh ceza hâkimliği değil asliye hukuk mahkemesidir ve yargılama dosya üzerinden değil basit usule
        göre yapılır; süre bir ay değil üç aydır.
  kaynaklar:
