      yazılı başvurusu aranır. Püf noktaları: 250 sayısı kuruluş için gereken meslek mensubu sayısıdır, başvuru eşiği ise
      sabit 100 kişidir; başvuru sayısı mevcut meslek mensubu sayısına oranlanmaz.'
    celdiriciler:
      A: 26, meslek mensubu sayısının onda biridir; kanunda böyle bir oran yoktur, başvuru eşiği sabit 100 kişidir.
      B: 50 kişilik bir başvuru eşiği kanunda yoktur; kanun en az 100 meslek mensubunun yazılı başvurusunu arar.
      D: Meslek mensubu sayısının yarısı gibi bir oran kanunda yoktur; 130 tutarı hesapla bulunan bir değerdir, eşik sabittir.
      E: 250 ilçede oda kurulması için gereken meslek mensubu sayısıdır; yazılı başvuru eşiği değildir.
