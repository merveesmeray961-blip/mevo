    madde: md. 15
    alinti: Amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin
      seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk
      mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır.
