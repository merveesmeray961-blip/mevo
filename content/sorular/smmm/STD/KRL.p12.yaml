  kok: Büyükşehir belediyesi sınırları dışındaki bir ilçede 260 serbest muhasebeci mali müşavir bulunmaktadır. 3568 sayılı
    Kanuna göre bu ilçede oda kurulabilmesi için ilçedeki en az kaç meslek mensubunun yazılı başvurusu aranır?
  secenekler:
    A: '26'
    B: '50'
    C: '100'
    D: '130'
    E: '250'
