  aciklama:
    dogru_neden: TSRS 1 paragraf 1 uyarınca Standardın amacı, bir işletmenin genel amaçlı finansal raporların asli kullanıcıları
      açısından işletmeye kaynak sağlama kararı verirken faydalı olacak sürdürülebilirlikle ilgili risklerine ve fırsatlarına
      ilişkin bilgileri açıklamasını zorunlu kılmaktır.
    celdiriciler:
      A: TSRS 1 vergi uyumunu denetleyen bir standart değildir.
      C: Amaç yalnızca çevresel cezaları açıklamak değil, sürdürülebilirlikle ilgili risk ve fırsatlara ilişkin faydalı bilgi
        sağlamaktır.
      D: Standart kâr dağıtım politikalarını düzenlemez.
      E: Denetim ücretlerinin belirlenmesi Standardın konusu değildir.
  kaynaklar:
  - mevzuat: TSRS 1 Sürdürülebilirlikle İlgili Finansal Bilgilerin Açıklanmasına İlişkin Genel Hükümler
    madde: paragraf 1
    alinti: TSRS 1 Sürdürülebilirlikle İlgili Finansal Bilgilerin Açıklanmasına İlişkin Genel Hükümler’in amacı; bir işletmenin
