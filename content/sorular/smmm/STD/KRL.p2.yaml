    hangisidir?
  secenekler:
    A: İşletmenin vergi mevzuatına uyumunu denetleyen raporlama kurallarını belirlemek
    B: Kaynak sağlama kararında faydalı risk ve fırsat bilgilerinin açıklanmasını zorunlu kılmak
    C: İşletmenin yalnızca çevresel zararlara ilişkin ceza tutarlarını ve tazminat bilgilerini açıklamasını sağlamak
    D: İşletmelerin kâr dağıtım politikalarını sürdürülebilirlik ölçütlerine bağlamak
    E: Bağımsız denetçilerin sürdürülebilirlik denetim ücretlerini belirlemek
