  konu: KRL
  kazanim: TSRS ve KGK
  tip: uygulama
  zorluk: 3
  kok: Bir işletme, bir sürdürülebilirlik riskinin kısa vadede nakit akışlarını etkilemesinin beklenmediği, ancak uzun vadede
    sermaye maliyetini etkilemesinin makul ölçüde beklenebildiği sonucuna varmıştır. İşletmenin ayrıca başka bir sürdürülebilirlik
    fırsatının hiçbir vadede finansal yeterliliğini etkilemesinin makul ölçüde beklenemeyeceği sonucuna vardığı bilinmektedir.
    TSRS 1'e göre bu iki konunun kapsam bakımından durumu aşağıdakilerden hangisidir?
  secenekler:
    A: Risk kapsamdadır, fırsat kapsam dışıdır.
    B: Risk kapsam dışıdır, fırsat kapsamdadır.
    C: İkisi de kapsamdadır.
    D: İkisi de kapsam dışıdır.
    E: Risk ancak kısa vadede etkileyebildiği için kapsamdadır, fırsat ise kapsamdadır.
  dogru: A
  aciklama:
    dogru_neden: 'TSRS 1 paragraf 3 uyarınca kısa, orta veya uzun vadede nakit akışlarını, finansmana erişimi veya sermaye
      maliyetini etkilemesi makul ölçüde beklenebilecek tüm risk ve fırsatlar kapsamdadır; paragraf 6 uyarınca finansal yeterliliği
      etkilemesi beklenemeyenler ise kapsam dışıdır. Uzun vadede sermaye maliyetini etkileyecek risk kapsamda, hiçbir vadede
      etkilemeyecek fırsat kapsam dışındadır. Püf noktaları: Vade ölçütü kısa, orta ve uzun vadeyi birlikte kapsar; kısa vadede
      etki olmaması riski kapsam dışına çıkarmaz.'
    celdiriciler:
      B: Risk, uzun vadede sermaye maliyetini etkilemesi makul ölçüde beklendiği için kapsamdadır; kapsam dışı değildir.
      C: Fırsat hiçbir vadede finansal yeterliliği etkilemediğinden kapsam dışıdır; kapsamda sayılamaz.
      D: İki konudan fırsat kapsam dışıdır; ikisinin de kapsamda olduğu söylenemez.
      E: Risk kapsamda olmakla birlikte gerekçe yanlıştır; vade ölçütü kısa, orta ve uzun vadeyi birlikte kapsar ve fırsat
        kapsam dışıdır.
