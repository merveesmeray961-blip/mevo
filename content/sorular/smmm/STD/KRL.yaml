- id: SMMM-STD-KRL-0001
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: KRL
  kazanim: Ulusal standartların uluslararası kaynakları — Uluslararası Muhasebe Standartları Kurulu, IAASB, IFAC
    ve KGK
  tip: bilgi
  zorluk: 2
  soru_bicimi: standart
  kok: KGK tarafından yayımlanan TMS 24 İlişkili Taraf Açıklamaları Standardının güncelleme notları ile BDS 210
    Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması Standardının giriş açıklaması dikkate alındığında,
    Türkiye Muhasebe Standartlarının ve Bağımsız Denetim Standartlarının dayandığı uluslararası kaynaklar aşağıdakilerin
    hangisinde doğru eşleştirilmiştir?
  secenekler:
    A: 'TMS: Uluslararası Muhasebeciler Federasyonu (IFAC) — BDS: Uluslararası Muhasebe Standartları Kurulu'
    B: 'TMS: Uluslararası Muhasebe Standartları Kurulu — BDS: Uluslararası Muhasebe Standartları Kurulu'
    C: 'TMS: Uluslararası Bağımsız Denetim ve Güvence Denetimi Standartları Kurulu (IAASB) — BDS: IFAC'
    D: 'TMS: Uluslararası Muhasebe Standartları Kurulu — BDS: IAASB tarafından düzenlenip IFAC tarafından yayımlanan
      standartlar'
    E: 'TMS: Uluslararası Muhasebe Standartları Kurulu — BDS: IFAC tarafından düzenlenip IAASB tarafından yayımlanan
      standartlar'
  dogru: D
  aciklama:
    dogru_neden: TMS 24'ün güncelleme notlarında Standardın "Uluslararası Muhasebe Standartları Kurulu tarafından
      yayımlanan yeni halinin mevzuatımıza kazandırılması"ndan söz edilir; TMS'ler bu Kurulun standartlarına dayanır.
      BDS 210'un giriş açıklamasına göre metin, "Uluslararası Bağımsız Denetim ve Güvence Denetimi Standartları
      Kurulu (IAASB) tarafından düzenlenen ve Uluslararası Muhasebeciler Federasyonu (IFAC) tarafından yayımlanan"
      standardın Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu (KGK) tarafından yapılan Türkçe tercümesidir.
      Doğru eşleştirme D şıkkıdır.
    celdiriciler:
      A: TMS'lerin kaynağı IFAC değil Uluslararası Muhasebe Standartları Kurulu'dur; BDS'ler ise IAASB tarafından
        düzenlenip IFAC tarafından yayımlanan standartlara dayanır.
      B: TMS eşleştirmesi doğru, ancak BDS'lerin kaynağı Uluslararası Muhasebe Standartları Kurulu değil, IAASB'nin
        düzenleyip IFAC'in yayımladığı standartlardır.
      C: IAASB denetim standartlarını düzenleyen kuruldur; TMS'lerin kaynağı Uluslararası Muhasebe Standartları
        Kurulu'dur.
      E: Düzenleyen ve yayımlayan kuruluşlar ters verilmiştir; BDS 210'a göre standardı IAASB düzenler, IFAC yayımlar.
  kaynaklar:
  - mevzuat: TMS 24 İlişkili Taraf Açıklamaları (Güncellemeler ve Yürürlük Tarihleri)
    madde: Güncelleme notları, ikinci değişiklik
    alinti: İkinci değişiklik TMS 24'ün Uluslararası Muhasebe Standartları Kurulu tarafından yayımlanan yeni halinin
      mevzuatımıza kazandırılmasına ilişkin olup, esas itibariyle 31/12/2010 tarihinden sonra başlayan hesap dönemleri
      için geçerlidir.
  - mevzuat: BDS 210 Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması
    madde: Giriş açıklaması (telif notu)
    alinti: Bu metin, Uluslararası Bağımsız Denetim ve Güvence Denetimi Standartları Kurulu (IAASB) tarafından düzenlenen
      ve Uluslararası Muhasebeciler Federasyonu (IFAC) tarafından yayımlanan ... Uluslararası Bağımsız Denetim Standardı
      (BDS) 210 "Bağımsız Denetim Sözleşmesinin Şartları Üzerinde Anlaşmaya Varılması"nın, Kamu Gözetimi, Muhasebe
      ve Denetim Standartları Kurumu tarafından yapılan Türkçe tercümesini IFAC'in izniyle tamamen ya da kısmen
      çoğaltmaktadır.
