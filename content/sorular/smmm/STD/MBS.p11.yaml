- id: SMMM-STD-MBS-0006
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: erişim kontrolleri
  tip: kavrama
  zorluk: 2
  kok: BDS 315'teki ayrıma göre aşağıdaki kontrollerden hangisi bilgi işleme kontrolleri değil, genel BT kontrolleri
    grubunda yer alır?
  secenekler:
    A: Finansal raporlama verilerinin planlandığı gibi yedeklenmesi ve kesintide zamanında kurtarılabilmesi
    B: Fatura birim fiyatının satın alma emri fiyatıyla tolerans dâhilinde otomatik karşılaştırılması
    C: Satış emri girişinde müşteri numarası alanının boş bırakılmasına izin verilmemesi
    D: Günlük işlenen fatura toplamının muhasebe kaydı toplamıyla karşılaştırılması
    E: Kredi limitini aşan siparişin sistemde onay bekleyen işlem olarak durdurulması
  dogru: A
  aciklama:
    dogru_neden: BDS 315'e göre BT süreçleri; erişimi yönetme, program değişikliklerini yönetme ve BT operasyonlarını
      yönetme süreçleridir. Ek 6'da BT faaliyetlerini yönetme süreci altında sayılan yedekleme ve kurtarma kontrolü
      genel BT kontrolüdür; belirli bir işlemin değil, tüm uygulamaların sağlıklı çalışmasını destekler.
    celdiriciler:
      B: Fatura fiyatının satın alma emriyle otomatik karşılaştırılması, BDS 315'te otomatik onaya örnek verilen
        bir bilgi işleme kontrolüdür.
      C: Zorunlu alan kontrolü, belirli bir uygulamadaki girdi kontrolüdür (bilgi işleme kontrolü).
      D: Fatura toplamının kayıt toplamıyla karşılaştırılması işlemlerin tamlık ve doğruluğuna yönelik mutabakattır
        (bilgi işleme kontrolü).
      E: Kredi limiti kontrolü satış uygulamasındaki işlemlere uygulanan bilgi işleme kontrolüdür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: Ek 6 prg. 2 (BT faaliyetlerini yönetme süreci — yedekleme ve kurtarma)
    alinti: Finansal raporlama verilerinin yedeklenmesinin planlandığı gibi yapılmasını ve bu tür verileri bir kesinti
      veya saldırı durumunda zamanında kurtarmak için erişilebilir olmasını sağlayan kontroller.
  - mevzuat: BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: prg. 12 (BT çevresi tanımı)
    alinti: BT süreçleri; BT çevresine erişimi yönetme, program değişikliklerini veya BT çevresinde meydana gelen
      değişiklikleri yönetme ve BT operasyonlarını yönetmeye ilişkin işletme süreçleridir.
