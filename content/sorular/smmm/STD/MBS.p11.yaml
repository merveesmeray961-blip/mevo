- id: SMMM-STD-MBS-0007
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: erişim kontrolleri
  tip: uygulama
  zorluk: 3
  kok: Bağımsız denetçi, bir işletmenin satış uygulamasında kredi limitini aşan siparişleri otomatik olarak durduran
    kontrolün test tarihinde doğru çalıştığını tespit etmiştir. Ancak aynı uygulamada yazılım geliştiricilerin,
    test ve onay süreci olmadan üretim ortamına program değişikliği aktarabildiği görülmüştür. BDS 315'e göre bu
    durumla ilgili en doğru değerlendirme aşağıdakilerden hangisidir?
  secenekler:
    A: Otomatik kontrol test tarihinde doğru çalıştığından dönemin tamamı için güvenilir kabul edilir.
    B: Sorun bir bilgi işleme kontrolü eksikliğidir; genel BT kontrolleriyle bir ilişkisi bulunmamaktadır.
    C: Program değişikliği bir yedekleme konusudur; eksiklik yedekten geri yükleme kontrolüyle giderilir.
    D: Otomatik kontrolün dönem boyunca işleyişi program değişikliği kontrollerine bağlı olduğundan kontrol riski
      yüksek değerlendirilebilir.
    E: Geliştiricilerin müdahalesi fiziksel erişim sorunudur; veri merkezine girişlerin kısıtlanması yeterlidir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 315 A166''ya göre bir bilgi işleme kontrolünün devam eden işleyiş etkinliği, yetkisiz program
      değişikliklerini önleyen veya tespit eden genel BT kontrollerine (program değişikliği kontrollerine) bağlı
      olabilir; bu kontrollerin etkisiz olması kontrol riskinin daha yüksek değerlendirilmesine yol açabilir. Ek
      6''da değişim yönetimi ve değişim migrasyonunda görevler ayrılığı, program değişikliklerini yönetme sürecindeki
      genel BT kontrolleri olarak sayılır.


      Püf noktaları: Kontrolün tek bir tarihte doğru çalışması, dönem boyunca değiştirilmeden çalıştığını göstermez.
      Otomatik bir kontrole güvenebilmek için onu koruyan değişiklik yönetimi kontrollerine bakmalısın; geliştiricinin
      değişikliği kendisinin canlıya aktarabilmesi, değişim migrasyonundaki görevler ayrılığının bozulduğunu gösterir.'
    celdiriciler:
      A: Test tarihindeki doğru çalışma, yetkisiz program değişikliğine açık bir ortamda dönemin geri kalanı için
        güvence vermez.
      B: Program değişikliklerini yönetme bir BT sürecidir ve buradaki kontroller genel BT kontrolüdür; bilgi işleme
        kontrolünün güvenilirliği bunlara bağlıdır.
      C: Yedekleme ve kurtarma BT faaliyetlerini yönetme sürecine aittir; yetkisiz program değişikliği riskini değişim
        yönetimi kontrolleri ele alır.
      E: Sorun, mantıksal erişim ve değişim migrasyonundaki görevler ayrılığıyla ilgilidir; veri merkezine fiziksel
        giriş kısıtı bu riski gidermez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: A166 (örnek)
    alinti: Bir bilgi işleme kontrolünün devam eden işleyiş etkinliği, BT bilgi işleme kontrolünde yapılacak yetkisiz
      program değişikliklerini önleyen ya da tespit eden belli genel BT kontrollerine
