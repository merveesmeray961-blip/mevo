    B: Satış işleviyle ilgisi olmayan bir personelin fiyat değişikliklerini dönemsel gözden geçirmesi — önleyici
      kontrol
    C: Satış görevlisinin kendi yaptığı fiyat değişikliklerini ay sonunda listeleyip onaylaması — tespit edici kontrol
    D: Satış müdürünün, satış görevlisinin fiyat değişikliklerini dönemsel gözden geçirmesi — düzeltici kontrol
