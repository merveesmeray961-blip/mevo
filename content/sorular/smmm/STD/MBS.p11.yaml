  kazanim: satış-tahsilat süreci
  tip: hesaplama
  zorluk: 2
  kok: Bir işletme, birim satış fiyatı 600 ₺ olan 150 adet ticari malı %20 KDV ile vadeli olarak satmış ve satış
    tutarını 120 Alıcılar hesabına kaydetmiştir. Müşteri borcunun 40.000 ₺'sini banka havalesiyle ödemiş, kalan
    tutar için çek vermiştir. Tahsilat kaydında 101 Alınan Çekler hesabına borç kaydedilecek tutar kaç ₺'dir?
  secenekler:
    A: 50.000 ₺
    B: 60.000 ₺
    C: 68.000 ₺
    D: 90.000 ₺
    E: 108.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Satış tutarı 150 × 600 = 90.000 ₺, KDV 90.000 × %20 = 18.000 ₺, müşteri alacağı 108.000 ₺''dir.
      Havaleyle ödenen 40.000 ₺ düşüldüğünde çekle kapatılan tutar 108.000 − 40.000 = 68.000 ₺ olur. Kayıt: 102
      Bankalar 40.000 ₺ ve 101 Alınan Çekler 68.000 ₺ borç, 120 Alıcılar 108.000 ₺ alacak.'
    celdiriciler:
      A: KDV dikkate alınmadan 90.000 − 40.000 olarak bulunur; alacak KDV dahil tutardır.
      B: Havale tutarı KDV hariç sanılıp 40.000 × 1,20 = 48.000 düşülerek bulunur; havale tutarı müşteri borcundan
        doğrudan düşülür.
      D: KDV hariç satış tutarının tamamıdır; havale düşülmemiş ve KDV eklenmemiştir.
      E: Alacağın tamamıdır; havaleyle ödenen kısım düşülmemiştir.
    hesap_adimlari:
    - 'Satış tutarı: 150 × 600 = 90.000 ₺'
    - 'KDV: 90.000 × 0,20 = 18.000 ₺'
    - '120 Alıcılar bakiyesi: 108.000 ₺'
    - 'Çek tutarı: 108.000 − 40.000 = 68.000 ₺'
