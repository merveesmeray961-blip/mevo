      ve hasılat bu anda kaydedilir; kontrol 29 Aralık 2025''te devredildiğinden hasılat 2025 dönemine aittir (I
      doğru, III yanlış). VUK md. 231/5''e göre fatura teslimden itibaren azami yedi gün içinde düzenlenir; 29 Aralık
      + 7 gün = 5 Ocak 2026 olduğundan 4 Ocak''ta düzenlenen fatura süresindedir (II doğru).


      Püf noktaları: Hasılatın dönemini fatura tarihi değil kontrolün devri belirler; yıl sonunda teslim edilip
