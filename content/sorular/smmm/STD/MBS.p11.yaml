- id: SMMM-STD-MBS-0004
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: akış şeması
  tip: uygulama
  zorluk: 2
  kok: 'Bir işletmenin satış sürecine ait belge akış şeması incelenmiş ve aşağıdaki durumlar tespit edilmiştir:

    I. Kredi onayını gösteren karar simgesinden yalnız “onaylandı” dalı çıkmakta, onaylanmayan siparişlerin nereye
    gittiği gösterilmemektedir.

    II. Üç nüsha düzenlenen satış faturasının 3 numaralı nüshası şemada herhangi bir birime gönderilmemekte ve dosyalanmamaktadır.

    III. Satış, depo ve muhasebe birimleri şemada ayrı sütunlar hâlinde gösterilmiştir.

    Bu durumlardan hangileri akış şeması çizim kuralları bakımından eksiklik oluşturur?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: Her karar simgesinden en az iki çıkış olmalı ve “hayır” dalının nereye gittiği gösterilmelidir
      (I eksikliktir). Belgenin her nüshası numaralanır ve nereye gittiği gösterilir; bir nüsha şemada nedensiz
      kaybolmamalı, ya dosyalanmalı ya başka birime gitmelidir (II eksikliktir). Şemanın birimlere ayrılmış sütunlar
      hâlinde çizilmesi ise kuralın kendisidir (III eksiklik değildir).
    celdiriciler:
      A: II'deki nüshanın şemada kaybolması da çizim kuralına aykırıdır.
      C: Birimlerin ayrı sütunlarda gösterilmesi doğru çizim kuralıdır; eksiklik değildir.
      D: Karar simgesinin tek dallı çizilmesi (I) eksikliktir; III ise eksiklik değildir.
      E: III doğru uygulamadır; eksiklik sayılmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Muhasebe bilgi sistemi — akış şeması çizim kuralları (hakemli anlatım STD/MBS §3)
    madde: Çizim kuralları 1-3
    alinti: ''
