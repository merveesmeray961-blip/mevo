        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: gecti
        not: 'c1: C (güven 5); c2: C (güven 5)'
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'baş hakem: tek tek okundu, hesaplar doğrulandı'
      G6:
        sonuc: gecti
        tarih: '2026-10-19'
        not: alıntılar mevzuat metninde doğrulandı; yöntem sorularında formül kökte/açıklamada
