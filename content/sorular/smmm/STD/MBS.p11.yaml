- id: SMMM-STD-MBS-0003
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: akış şeması
  tip: kavrama
  zorluk: 2
  kok: Muhasebe bilgi sisteminin belgelendirilmesinde kullanılan veri akış diyagramı (VAD), belge akış şeması ile
    karşılaştırıldığında aşağıdakilerden hangisi VAD için doğrudur?
  secenekler:
    A: Belgenin her nüshasının hangi birime gittiğini birim sütunları hâlinde gösterir.
    B: Bir bilgisayar programının mantıksal adımlarını komut düzeyinde gösterir.
    C: Girdi, işleme ve depolamanın bilgisayar donanımındaki akışını gösterir.
    D: Kontrolün hangi personel tarafından, hangi belgeyle yapıldığını gösterir.
    E: Verinin kaynağını, işlendiği süreçleri ve depolandığı yerleri mantıksal olarak gösterir.
  dogru: E
  aciklama:
    dogru_neden: Veri akış diyagramı verinin kaynağını, varış yerini, işlendiği süreçleri ve depolandığı yerleri
      gösterir; işin kim tarafından ve hangi araçla yapıldığını değil, ne yapıldığını (mantıksal akışı) anlatır.
      Belge akış şeması ise fiziksel akışı (birim, belge, nüsha) gösterir.
    celdiriciler:
      A: Nüshaların birimler arasındaki hareketini sütunlar hâlinde göstermek belge akış şemasının özelliğidir.
      B: Programın mantıksal adımlarını gösteren çizim program akış şemasıdır.
      C: Girdi, işleme, depolama ve çıktının bilgisayar sistemindeki akışını sistem akış şeması gösterir.
      D: Kontrolü kimin, hangi belgeyle yaptığını göstermek belge akış şemasının işlevidir; VAD fiziksel ayrıntıya
        girmez.
    hesap_adimlari: []
