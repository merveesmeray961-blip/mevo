    Ek personel almanın maliyeti yüksek olduğundan yönetim, ideal görevler ayrılığı yerine alternatif bir kontrol
    uygulamaya karar vermiştir. BDS 315'e göre uygulanabilecek kontrol ve bu kontrolün türü aşağıdakilerin hangisinde
