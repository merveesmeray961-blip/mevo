- id: SMMM-STD-MBS-0002
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: akış şeması
  tip: bilgi
  zorluk: 1
  kok: Bir satış sürecinin belge akış şemasında, satış faturasının bir nüshası yanında “müşteri adına göre” notu
    bulunan bir simgeye yönelmektedir. Bu simge ve gösterdiği işlem aşağıdakilerden hangisidir?
  secenekler:
    A: Silindir — verinin veri tabanında depolanması
    B: Yamuk — işlemin elle (manuel) yapılması
    C: Ters üçgen — belgenin belirtilen ölçüte göre dosyalanması
    D: Beşgen — akışın başka bir sayfada devam etmesi
    E: Küçük daire — akışın aynı sayfada başka noktaya bağlanması
  dogru: C
  aciklama:
    dogru_neden: Akış şemalarında ters üçgen dosyalama/arşivleme simgesidir; belgenin hangi ölçüte göre (müşteri
      adı, tarih, numara) dosyalandığı simgenin yanına yazılır. Belge akış şemasında her nüshanın nereye gittiği
      gösterilmeli, nüsha ya başka birime gitmeli ya da dosyalanmalıdır.
    celdiriciler:
      A: Silindir, veri tabanı veya disk depolamayı gösterir; kâğıt belgenin dosyalanmasını göstermez.
      B: Yamuk, elle yapılan işlemi gösterir; belgenin arşive kaldırılmasını göstermez.
      D: Beşgen (ev biçimi), akışın başka bir sayfaya bağlandığını gösterir.
      E: Küçük daire, aynı sayfa içindeki bağlantıyı gösterir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Muhasebe bilgi sistemi — genel kabul görmüş akış şeması simgeleri (hakemli anlatım STD/MBS §3)
    madde: 'Sembol tablosu: ters üçgen = dosyalama, arşivleme (yanına sıralama ölçütü yazılır)'
    alinti: ''
  gecerlilik:
