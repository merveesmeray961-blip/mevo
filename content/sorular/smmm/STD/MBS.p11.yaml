      küçük işletmelerde yönetim alternatif kontroller uygulayabilir. Satış görevlisinin fiyat dosyasını değiştirebildiği
      durumda, satış işleviyle ilgisi olmayan personelin fiyatların değiştirilip değiştirilmediğini ve hangi şartlarla
      değiştirildiğini periyodik olarak gözden geçirmesi için tespit edici bir kontrol faaliyeti uygulanabilir.


