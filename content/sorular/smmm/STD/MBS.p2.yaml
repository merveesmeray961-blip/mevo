- id: SMMM-STD-MBS-0019
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe bilgi sistemi
  konu: MBS
  kazanim: erişim kontrolleri
  tip: uygulama
  zorluk: 3
  kok: Bir işletmede kredili satışlara yetki veren müdür, aynı zamanda alacak hesaplarının ve nakit makbuzlarının kaydını
    da tutmaktadır. İşletmenin yıllık kredili satışları 12 milyon TL'dir. BDS 315'e göre bu düzenlemeden doğan risk ve uygun
    kontrol aşağıdakilerden hangisidir?
  secenekler:
    A: Risk yalnızca satış tutarının büyüklüğünden doğar; tutar azaltılınca görev birleşimi sakıncasız olur
    B: Risk doğmaz; yetki ve kayıt görevinin tek kişide toplanması kayıt hızını artırarak kontrolü güçlendirir
    C: Risk yalnızca stok sayımından doğar; yıl sonu sayımı yapılırsa yetki ve kayıt aynı kişide kalabilir
    D: Tespit edilemeyen sahte satış riski doğar; yetkilendirme ve kayıt görevleri ayrı kişilere verilmelidir
    E: Risk yalnızca bilgisayar erişiminden doğar; parola uygulanırsa görevlerin birleşmesi sorun olmaz
  dogru: D
  aciklama:
    dogru_neden: 'BDS 315 görevler ayrılığı örneğinde, kredili satışlara yetki veren bir yöneticinin alacak hesaplarının veya
      nakit makbuzların tutulmasından sorumlu olmaması gerektiğini belirtir; bir kişi tüm bu faaliyetleri gerçekleştirebiliyorsa
      tespit edilemeyen sahte bir satış ortaya çıkabilir. Püf noktaları: Satış tutarı gereksiz veridir; risk tutardan değil,
      görevlerin tek kişide birleşmesinden doğar. Parola gibi mantıksal erişim kontrolleri görev birleşimi riskini ortadan
      kaldırmaz.'
    celdiriciler:
      A: Risk satış tutarının büyüklüğüne bağlı değildir; tutar azalsa bile görevlerin birleşmesi sahte satış riskini doğurur.
      B: Görevlerin tek kişide toplanması kontrolü zayıflatır; hız artışı riski gidermez.
      C: Stok sayımı sahte satış riskini tek başına gidermez; ilgili kontrol görevler ayrılığıdır.
      E: Parola gibi erişim kontrolleri görevler ayrılığının yerini tutmaz.
  kaynaklar:
  - mevzuat: BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: Ek 3 paragraf 20
    alinti: kredili satışlara yetki veren bir yönetici, alacak hesaplarının veya nakit makbuzların tutulmasından sorumlu değildir.
      Bir kişi tüm bu faaliyetleri gerçekleştirebiliyorsa, tespit edilemeyen sahte bir satış ortaya çıkabilir.
