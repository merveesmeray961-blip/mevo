  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 219/b
    alinti: Kayıtlarını devamlı olarak muhasebe fişleri, primanota ve bordro gibi yetkili amirlerin imza ve parafını taşıyan
