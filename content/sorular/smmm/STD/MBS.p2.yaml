    dogru_neden: VUK md. 219/c uyarınca günlük kasa, günlük, perakende satış ve hasılat defterleri ile serbest meslek kazanç
      defterine muameleler günü gününe kaydedilir.
    celdiriciler:
      B: On günlük süre md. 219/a'daki genel kayıt gecikmesi sınırıdır; perakende satış defteri için istisna olarak günü gününe
        kayıt aranır.
      C: Haftalık toplu kayıt perakende satış defteri için öngörülmemiştir; kayıt günü gününe yapılır.
      D: Ay sonunda toplu kayıt md. 219/c'ye aykırıdır.
      E: Kırk beş gün, md. 219/b'deki mazbut vesikalara dayanan kayıt sisteminin esas defterlere intikal sınırıdır; perakende
        satış defteri için geçerli değildir.
