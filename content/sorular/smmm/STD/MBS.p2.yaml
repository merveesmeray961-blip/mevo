    dayanarak yürüten bir müessesede, muamelelerin bu vesikalara işlenmesi deftere işlenmesi hükmündedir. 213 sayılı Vergi
    Usul Kanunu'na göre bu kayıtların esas defterlere intikali en çok kaç günü aşamaz?
