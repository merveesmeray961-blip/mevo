  zorluk: 1
  kok: 213 sayılı Vergi Usul Kanunu'na göre perakende satış defterine yapılacak kayıtların zamanlaması bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Muameleler günü gününe, ertelenmeden deftere kaydedilir.
    B: Muameleler on gün içinde toplu olarak deftere kaydedilir.
    C: Muameleler haftalık dönemler hâlinde toplu deftere kaydedilir.
    D: Muameleler ay sonunda toplu olarak deftere kaydedilir.
    E: Muameleler kırk beş günlük sürede deftere intikal ettirilebilir.
