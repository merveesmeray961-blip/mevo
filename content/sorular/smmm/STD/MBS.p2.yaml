  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 219/c
    alinti: Günlük kasa, günlük, parakende satış ve hasılat defterleri ile serbest meslek kazanç defterine muameleler günü
      gününe kaydedilir.
