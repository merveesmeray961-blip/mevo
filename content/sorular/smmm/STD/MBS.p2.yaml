      C: Aynı personelin tüm görevleri yürütmesi görevler ayrılığına aykırıdır.
      D: Görev rotasyonu başka bir kontrol yöntemidir; görevler ayrılığı sorumlulukların farklı kişilere verilmesidir.
      E: Kayıtların bağımsız denetçi tarafından tutulması hem denetçi bağımsızlığını zedeler hem de görevler ayrılığı kavramıyla
