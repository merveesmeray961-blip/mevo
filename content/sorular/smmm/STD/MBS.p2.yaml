  secenekler:
    A: Bütün muhasebe görevlerinin güvenilir tek bir yetkili kişiye devredilmesi ve bu kişinin sıkı izlenmesi
    B: Yetkilendirme, kayıt ve varlıkların korunması sorumluluklarının farklı kişilere verilmesi
