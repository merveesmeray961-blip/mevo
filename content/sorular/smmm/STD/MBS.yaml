- id: SMMM-STD-MBS-0001
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: MBS
  kazanim: Muhasebe bilgi sisteminin belgelendirilmesi — akış şeması simgeleri
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: Muhasebe bilgi sisteminin belgelendirilmesinde kullanılan akış şemalarında, bir koşulun sağlanıp sağlanmadığına
    göre işlem akışının iki ya da daha fazla yola ayrıldığı karar noktası genel kabul görmüş simgelerden hangisiyle
    gösterilir?
  secenekler:
    A: Eşkenar dörtgen (baklava dilimi)
    B: Dikdörtgen
    C: Oval (yuvarlatılmış uçlu şekil)
    D: Paralelkenar
    E: Alt kenarı dalgalı dikdörtgen
  dogru: A
  aciklama:
    dogru_neden: Akış şemalarında genel kabul görmüş (ANSI) simge tanımlarına göre eşkenar dörtgen (baklava dilimi)
      karar simgesidir; bir koşulun cevabına (evet/hayır gibi) göre akışın farklı yollara ayrıldığı noktayı gösterir.
      Bu soru bir yasal metne değil, muhasebe bilgi sistemleri alanının genel kabul görmüş tanımlarına dayanır;
      simgelerin anlamları bu açıklamada açıkça verilmiştir.
    celdiriciler:
      B: Dikdörtgen, akış şemalarında bir işlem veya işlem adımını (hesaplama, kayıt gibi) gösterir; karar noktası
        değildir.
      C: Oval (yuvarlatılmış uçlu şekil), akışın başlangıç ve bitiş noktasını (terminal) gösterir.
      D: Paralelkenar, genel girdi/çıktı işlemini (verinin sisteme girişi veya sistemden çıkışı) gösterir.
      E: Alt kenarı dalgalı dikdörtgen, fatura, sipariş formu gibi bir belgeyi gösterir.
  kaynaklar:
  - mevzuat: Genel kabul görmüş tanım — akış şeması simgeleri (ANSI X3.5 standart akış şeması simgeleri; muhasebe
      bilgi sistemleri ders kitapları)
    madde: Yasal metni olmayan yöntem (kontrol.md "Yasal metni olmayan yöntem soruları")
