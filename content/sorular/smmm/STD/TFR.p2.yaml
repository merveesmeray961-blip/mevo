  aciklama:
    dogru_neden: 'TMS 8 paragraf 34A uyarınca bir girdi ya da ölçüm tekniğindeki değişikliğin etkileri, önceki dönem hatalarının
      düzeltilmesinden kaynaklanmadıkça muhasebe tahminlerindeki değişiklik olarak ele alınır. Paragraf 38 uyarınca tahmin
      değişikliğinin etkisi ileriye yönelik yansıtılır. Püf noktaları: Teknik değişikliği ile politika değişikliğini karıştırma;
      politika (ilke, esas, kural) değişmediği için burada tahmin söz konusudur. Hata olmadığı soruda açıkça verilmiştir,
      dolayısıyla geriye dönük düzeltme yapılmaz.'
    celdiriciler:
      B: Politika değişmemiştir; yalnızca ölçüm tekniği değişmiştir ve bu tahmin değişikliği sayılır.
      C: Soruda değişikliğin hata düzeltmesinden kaynaklanmadığı belirtilmiştir.
      D: Tahmin değişikliği geçmiş dönemlerle ilgili değildir; geriye dönük uygulama yapılmaz.
      E: Hata söz konusu olmadığından bu çözüm uygulanmaz; tahmin değişikliği ileriye yönelik yansıtılır.
