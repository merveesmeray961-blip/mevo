    C: A binası için aktifleştirme devam eder; B ve C binaları için sona erer.
    D: A binasına ilişkin faizlerin aktifleştirilmesine son verilir; B ve C için devam edilir.
    E: Aktifleştirme yapılmaz, faizlerin tamamı gider yazılır çünkü varlık parçalar hâlinde tamamlanmaktadır.
