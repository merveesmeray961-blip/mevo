    Bu değişiklik önceki dönem hatalarının düzeltilmesinden kaynaklanmamakta, işletmenin muhasebe politikasında da bir değişiklik
    bulunmamaktadır. TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre bu değişiklik
    nasıl değerlendirilir?
