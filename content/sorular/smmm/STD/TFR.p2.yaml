    madde: paragraf 34
    alinti: Niteliği gereği bir muhasebe tahminindeki değişikliğin geçmiş dönemlerle bir ilgisi yoktur ve söz konusu değişiklik
      bir hata düzeltmesi değildir.
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 38
    alinti: Muhasebe tahminindeki bir değişiklik yalnızca cari dönemin kâr veya zararını etkileyebileceği gibi, hem cari dönemin
      hem de gelecek dönemlerin kâr veya zararını etkileyebilir.
