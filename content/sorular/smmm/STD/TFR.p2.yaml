  kok: Bir işletme 480.000 TL maliyetli ve kalıntı değeri bulunmayan makinesini 8 yıl yararlı ömürle doğrusal amortisman yöntemiyle
    amortismana tabi tutmaktadır. İki yıl amortisman ayrıldıktan sonra yararlı ömür toplam 10 yıl olarak yeniden tahmin edilmiş,
    yöntem değişmemiştir. TMS 16 Maddi Duran Varlıklar Standardına göre üçüncü yıl için ayrılacak amortisman kaç TL'dir?
  secenekler:
    A: 3.750 TL
    B: 36.000 TL
    C: 45.000 TL
    D: 60.000 TL
    E: 360.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'TMS 16 paragraf 51 uyarınca yararlı ömürdeki değişiklik muhasebe tahmini değişikliğidir ve ileriye yönelik
      uygulanır. İki yıl sonunda birikmiş amortisman 2 x 60.000 = 120.000 TL, defter değeri 360.000 TL''dir. Toplam ömür 10
      yıl olduğundan kalan ömür 10 - 2 = 8 yıldır; 360.000 / 8 = 45.000 TL. Püf noktaları: 10 yıl toplam ömürdür, kalan ömür
      8 yıldır; yeni tahmin geçmiş yıllara dokunmaz, yalnızca kalan defter değerine uygulanır. Yıllık tutarı aylığa çevirmek
      de gerekmez.'
    hesap_adimlari:
    - Eski yıllık amortisman = 480.000 / 8 = 60.000 TL
    - 2 yıl sonunda defter değeri = 480.000 - 2 x 60.000 = 360.000 TL
    - Kalan yararlı ömür = 10 - 2 = 8 yıl
    - Yeni yıllık amortisman = 360.000 / 8 = 45.000 TL
    celdiriciler:
      A: 3.750 TL aylık tutardır (45.000 / 12); soruda yıllık amortisman sorulmaktadır.
      B: 36.000 TL, defter değerinin toplam ömür olan 10 yıla bölünmesiyle bulunur; kalan ömür 8 yıldır.
      D: 60.000 TL, eski tahmine göre hesaplanan yıllık tutardır; tahmin değişikliği ileriye yönelik uygulanmıştır.
      E: 360.000 TL, makinenin iki yıl sonundaki defter değeridir; yıllık amortisman tutarı değildir.
