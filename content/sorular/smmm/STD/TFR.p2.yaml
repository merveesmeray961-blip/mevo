  kok: Bir işletmenin yeniden değerlenmemiş makinesinin geri kazanılabilir tutarı, defter değerinden yüksek bulunmuştur. TMS
    36 Varlıklarda Değer Düşüklüğü Standardına göre bu makine için aşağıdakilerden hangisi uygulanır?
  secenekler:
    A: Değer düşüklüğü zararı muhasebeleştirilmez ve defter değeri korunur.
    B: Fark kadar değer artışı doğrudan kâr veya zararda gelir yazılır.
    C: Defter değeri geri kazanılabilir tutara kadar artırılır.
    D: Fark tutarında değer düşüklüğü karşılığı ayrılır.
    E: Makine satış amaçlı elde tutulan varlık olarak yeniden sınıflandırılır.
