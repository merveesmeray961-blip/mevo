- id: SMMM-STD-TFR-0103
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 8
  tip: uygulama
  zorluk: 2
  kok: Bir işletme, bir önceki dönemin finansal tablolarında önemli bir hata yapıldığını cari dönemde tespit etmiştir. Hatanın
    dönemler itibarıyla etkisi belirlenebilmektedir. TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve
    Hatalar Standardına göre bu hata nasıl düzeltilir?
  secenekler:
    A: Hata, tespit edildiği dönemin kâr veya zararına gider olarak yansıtılır.
    B: Hata, yalnızca gelecek dönemlerde ileriye yönelik olarak düzeltilir.
    C: Hata, muhasebe tahmini değişikliği gibi cari ve gelecek dönemlere yayılır.
    D: Geriye dönük yeniden düzenlenir; tespit dönemi kârı veya zararı değişmez.
    E: Hata düzeltilmez; yalnızca dipnotlarda açıklanması yeterlidir.
  dogru: D
  aciklama:
    dogru_neden: TMS 8 paragraf 43 uyarınca etkisi belirlenebilen geçmiş dönem hatası geriye dönük olarak yeniden düzenleme
      yapılarak düzeltilir; paragraf 46 uyarınca hatanın tespit edildiği dönemin kâr veya zararında herhangi bir değişiklik
      yapılmaz.
    celdiriciler:
      A: Hata cari dönem kâr veya zararına yazılmaz; paragraf 46 tespit dönemi kâr veya zararında değişiklik yapılmamasını
        öngörür.
      B: İleriye yönelik düzeltme yalnızca etkinin belirlenmesinin mümkün olmadığı hâllerde söz konusudur.
      C: Dönemlere yayma, tahmin değişikliğinin yöntemidir; hata geriye dönük düzeltilir.
      E: Önemli hata yalnızca açıklanarak bırakılmaz; geriye dönük yeniden düzenleme zorunludur.
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 43
    alinti: Bir geçmiş dönem hatasının dönemler itibarıyla yarattığı etkinin ya da birikimli etkisinin belirlenmesinin mümkün
      olmadığı durumlar dışında, söz konusu hata, geriye dönük olarak yeniden düzenleme yapılarak düzeltilir.
