- id: SMMM-STD-TFR-0105
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: hesaplama
  zorluk: 2
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardı kapsamında bir makinenin defter değeri 1.200.000 TL, satış maliyetleri
    düşülmüş gerçeğe uygun değeri 1.050.000 TL ve kullanım değeri 1.100.000 TL'dir. Makine yeniden değerlenmiş tutarı üzerinden
    izlenmemektedir. Muhasebeleştirilecek değer düşüklüğü zararı kaç TL'dir?
  secenekler:
    A: 50.000 TL
    B: 100.000 TL
    C: 125.000 TL
    D: 150.000 TL
    E: 1.100.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'TMS 36 paragraf 18 uyarınca geri kazanılabilir tutar, iki değerden yüksek olanıdır: 1.100.000 TL. Paragraf
      59 uyarınca defter değeri geri kazanılabilir tutara indirgenir; 1.200.000 - 1.100.000 = 100.000 TL değer düşüklüğü zararı
      kâr veya zararda muhasebeleştirilir.'
    hesap_adimlari:
    - Geri kazanılabilir tutar = max(1.050.000; 1.100.000) = 1.100.000 TL
    - Değer düşüklüğü zararı = 1.200.000 - 1.100.000 = 100.000 TL
    celdiriciler:
