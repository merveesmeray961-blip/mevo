- id: SMMM-STD-TFR-0101
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 8
  tip: uygulama
  zorluk: 2
  kok: Bir işletme, makinesinin kalan yararlı ömrüne ilişkin tahminini yeni bilgiler ışığında yeniden değerlendirmiş ve amortisman
    süresini uzatmıştır. TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre bu
    değişikliğin etkisi nasıl yansıtılır?
  secenekler:
    A: Geçmiş dönem finansal tabloları yeniden düzenlenir ve fark birikmiş kârlara yansıtılır.
    B: Değişiklik hata düzeltmesi sayılır ve karşılaştırmalı tutarlar geriye dönük düzeltilir.
    C: Etkisi yalnızca bir sonraki dönemin kâr veya zararına yansıtılır.
    D: Etkisi diğer kapsamlı gelir tablosunda ayrı bir kalem olarak gösterilir.
    E: Etkisi cari dönemin ve etkilenen gelecek dönemlerin kâr veya zararına yansıtılır.
  dogru: E
  aciklama:
    dogru_neden: TMS 8 paragraf 34 ve 38 uyarınca tahmindeki değişikliğin geçmiş dönemlerle ilgisi yoktur ve hata düzeltmesi
      değildir; etkisi ileriye yönelik olarak yalnızca cari dönemi ya da hem cari hem gelecek dönemleri etkileyebilir ve kâr
      veya zarara dâhil edilir.
    celdiriciler:
      A: Geriye dönük yeniden düzenleme politika değişikliği ve hata düzeltmesi içindir; tahmin değişikliğinde yapılmaz.
      B: Paragraf 34 tahmin değişikliğinin hata düzeltmesi olmadığını açıkça belirtir.
      C: Etki, değişikliğin yapıldığı cari dönemi de kapsar; yalnızca sonraki dönemlere bırakılamaz.
      D: Tahmin değişikliğinin etkisi kâr veya zarara dâhil edilir; ayrı bir diğer kapsamlı gelir kalemi öngörülmemiştir.
  kaynaklar:
