      biter, B ve C için sürer. Püf noktaları: Çelik fabrikası gibi bütünü tamamlanmadan hiçbir parçası kullanılamayan tesislerde
      ise aktifleştirme bütünün tamamlanmasına kadar sürer; burada binalar bağımsız olduğundan parça bazında karar verilir.'
    celdiriciler:
      A: Bağımsız kullanılabilen tamamlanmış parça için aktifleştirme sona erer; tamamının bitmesi beklenmez.
      B: Aktifleştirme yalnızca tamamlanan A binası için biter; B ve C için devam eder.
      C: Tamamlanan parça için aktifleştirme devam etmez; sona erer.
      E: Özellikli varlığın parçalar halinde tamamlanması aktifleştirmeyi engellemez; paragraf 24 parça bazında düzenleme
        yapar.
