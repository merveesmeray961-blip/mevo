    B: Bir varlığın tahmini yararlı ömrünün değiştirilmesi
    C: Uygulanan ölçüm esasının (örneğin maliyet modelinden gerçeğe uygun değer modeline) değiştirilmesi
    D: Şüpheli alacaklar için ayrılan karşılık oranının piyasa koşullarındaki değişime göre güncellenmesi
