  kok: TMS 16 Maddi Duran Varlıklar Standardına göre, yeniden değerleme modelinin uygulanmasıyla ilgili aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Yeniden değerleme, yalnızca bir kez yapılabilir ve sonraki dönemlerde maliyet modeli zorunludur.
    B: Yeniden değerleme, gerçeğe uygun değerin güvenilir bir şekilde ölçülebildiği durumlarda uygulanabilir ve düzenli aralıklarla
      tekrarlanır.
    C: Yeniden değerleme artışı her zaman kâr veya zarara yansıtılır.
    D: Yeniden değerleme modeli yalnızca gayrimenkuller için geçerlidir.
    E: Yeniden değerleme azalması hiçbir durumda kâr veya zarara yansıtılmaz.
  dogru: B
  aciklama:
    dogru_neden: TMS 16’ya göre yeniden değerleme modeli, gerçeğe uygun değerin güvenilir biçimde ölçülebileceği durumlarda
      seçilebilir. Yeniden değerlemeler, defter değerinin gerçeğe uygun değerden önemli ölçüde farklılaşmaması için düzenli
