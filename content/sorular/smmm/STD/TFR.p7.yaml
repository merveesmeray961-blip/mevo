  kok: TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardı’nın temel ilkesi aşağıdakilerden hangisidir?
  secenekler:
    A: Hasılat, devredilen mal veya hizmet karşılığında hak kazanılması beklenen bedeli yansıtan tutarla kaydedilir
    B: Hasılat, müşteriden tahsilat yapıldığı tarihte tahsil edilen tutarla muhasebeleştirilir
    C: Hasılat, fatura düzenlendiği tarihte fatura tutarı üzerinden muhasebeleştirilir
    D: Hasılat, sözleşmenin imzalandığı tarihte sözleşme bedelinin tamamı üzerinden muhasebeleştirilir
    E: Hasılat, sözleşme maliyetlerinin karşılandığı ölçüde ve bu tutarla muhasebeleştirilir
  dogru: A
  aciklama:
    dogru_neden: TFRS 15 paragraf 2’ye göre Standardın temel ilkesi, işletmenin müşterilerine taahhüt ettiği mal
      veya hizmetlerin devri karşılığında hak kazanmayı beklediği bedeli yansıtan bir tutar üzerinden hasılatı finansal
      tablolara yansıtmasıdır.
    celdiriciler:
      B: Tahsilat nakit esaslıdır; TFRS 15 tahakkuk esasına dayanır ve kontrol devrine odaklanır.
      C: Fatura düzenleme, hasılatın muhasebeleştirilmesi için yeterli kriter değildir.
      D: Hasılat, edim yükümlülüğünün yerine getirilmesine bağlıdır; sözleşme imzası yeterli değildir.
      E: Maliyet karşılama yöntemi eski hasılat standartlarına aittir; TFRS 15’te geçerli değildir.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 2
    alinti: 1’inci paragrafta belirlenen amacın gerçekleştirilmesi açısından bu Standardın temel ilkesi, işletmenin
      müşterilerine taahhüt ettiği mal veya hizmetlerin devri karşılığında hak kazanmayı beklediği bedeli yansıtan
      bir tutar üzerinden hasılatı finansal tablolara yansıtmasıdır.
