- id: SMMM-STD-TFR-0014
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 23
  tip: uygulama
  zorluk: 3
  kok: 'TMS 23 Borçlanma Maliyetleri Standardına göre, özellikli bir varlık için borçlanma maliyetlerinin aktifleştirilmesine
    ilişkin aşağıdaki durumlardan hangisi doğrudur?


    I. Aktifleştirme, varlık için harcamaların yapıldığı, borçlanma maliyetlerinin katlanıldığı ve varlık için gerekli faaliyetlerin
    sürdürüldüğü dönemde başlar.

    II. Aktifleştirme, varlığın amaçlanan kullanıma veya satışa hazır hale geldiği anda sona erer.

    III. Özellikli varlık tamamlandıktan sonra katlanılan borçlanma maliyetleri de aktifleştirilmeye devam eder.

    IV. Genel amaçlı borçlanmalardan kaynaklanan aktifleştirme tutarı, ağırlıklı ortalama borçlanma maliyeti kullanılarak
    hesaplanır.'
  secenekler:
    A: Yalnız I ve II
    B: I, II ve IV
    C: II, III ve IV
    D: Yalnız I ve IV
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: I, II ve IV doğrudur. Aktifleştirme, harcama + maliyet + faaliyet koşulları sağlandığında başlar ve varlık
      hazır hale geldiğinde sona erer. Genel amaçlı borçlanmalarda ağırlıklı ortalama kullanılır. III yanlıştır; tamamlandıktan
      sonra aktifleştirme durur.
    celdiriciler:
      A: IV de doğrudur; genel amaçlı borçlanmalarda ağırlıklı ortalama kullanılır.
      C: III yanlıştır; aktifleştirme varlık hazır olduğunda biter.
      D: II de doğrudur.
      E: III yanlıştır.
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 17, 22, 14
    alinti: 'İşletmelerce borçlanma maliyetlerinin bir özellikli varlığın maliyetinin parçası olarak aktifleştirilmesine,
      aktifleştirme koşullarının sağlandığı tarihte başlanır. Aktifleştirmenin başlama tarihi, işletmenin aşağıdaki koşulların
      tümünü sağladığı tarihtir: (a) İşletme, varlık için harcama yaptığında; (b) Borçlanma maliyetleri oluştuğunda; (c) İşletme,
      ilgili varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli işlemlere başladığında. … Bir
      varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli tüm işlemler esas itibarıyla tamamlandığında,
