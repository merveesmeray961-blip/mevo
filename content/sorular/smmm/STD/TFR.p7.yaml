- id: SMMM-STD-TFR-0006
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: kavrama
  zorluk: 2
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre, bir varlığın geri kazanılabilir tutarı ile ilgili aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Geri kazanılabilir tutar, her zaman net satış fiyatına eşittir.
    B: Geri kazanılabilir tutar, varlığın net satış fiyatı ile kullanım değerinden yüksek olanıdır.
    C: Geri kazanılabilir tutar, yalnızca kullanım değerine eşittir.
    D: Geri kazanılabilir tutar, varlığın defter değerinden her zaman düşüktür.
    E: Geri kazanılabilir tutar, yalnızca gerçeğe uygun değere eşittir.
  dogru: B
  aciklama:
    dogru_neden: TMS 36’ya göre bir varlığın geri kazanılabilir tutarı, net satış fiyatı (veya elden çıkarma maliyetleri düşülmüş
      gerçeğe uygun değeri) ile kullanım değerinden yüksek olanıdır. Değer düşüklüğü testi bu tutar ile defter değerinin karşılaştırılmasıyla
      yapılır.
    celdiriciler:
      A: Net satış fiyatı tek başına geri kazanılabilir tutar değildir; kullanım değeri de dikkate alınır.
      C: Kullanım değeri tek başına yeterli değildir; net satış fiyatı da karşılaştırılır.
      D: Geri kazanılabilir tutar defter değerinden yüksek veya düşük olabilir; test buna göre yapılır.
      E: Gerçeğe uygun değer tek başına değil, elden çıkarma maliyetleri düşülmüş hali ve kullanım değeri ile birlikte değerlendirilir.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 18
    alinti: 'Geri kazanılabilir tutar: Bir varlığın veya nakit yaratan birimin, satış maliyetleri düşülmüş gerçeğe uygun değeri
      ile kullanım değerinden yüksek olanıdır.'
