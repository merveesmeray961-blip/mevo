- id: SMMM-STD-TFR-0007
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 16
  tip: uygulama
  zorluk: 3
  kok: 'TMS 16 Maddi Duran Varlıklar Standardına göre, bir maddi duran varlık kaleminin maliyetine dahil edilebilecek unsurlarla
    ilgili aşağıdaki durumlardan hangisi doğrudur?


    I. Varlığın sökülmesi ve taşınması ile yerleştirildiği alanın restorasyonuna ilişkin tahmini maliyetler (TMS 37 kapsamında
    karşılık ayrıldığı ölçüde)

    II. Varlığın elde edilmesi sırasında katlanılan ithalat vergileri ve iade edilmeyen alış vergileri

    III. Varlığın kullanıma hazır hale getirilmesi için katlanılan doğrudan işçilik maliyetleri

    IV. Varlığın faaliyete geçmesinden sonra ortaya çıkan günlük bakım onarım giderleri'
  secenekler:
    A: Yalnız I ve II
    B: I, II ve III
    C: II, III ve IV
    D: Yalnız II ve III
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: TMS 16 par. 16’ya göre maliyet; satın alma fiyatı (ithalat vergileri ve iade edilmeyen vergiler dahil), doğrudan
      atfedilebilen maliyetler ve sökme/taşıma/restorasyon yükümlülüklerini (TMS 37 kapsamında) içerir. Günlük bakım onarım
      giderleri (par. 12) maliyetin parçası değildir, dönem gideridir.
    celdiriciler:
      A: III de doğrudan atfedilebilen maliyet olarak dahil edilir.
      C: IV günlük bakım onarım gideridir, maliyete dahil edilmez.
      D: I de (sökme/restorasyon) maliyete dahil edilir.
      E: IV dahil edilemez.
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 16
    alinti: 'Bir maddi duran varlık kaleminin maliyeti aşağıdaki unsurları içerir: (a) İndirimler ve ticari iskontolar düşüldükten
      sonra, ithalat vergileri ve iade edilmeyen alış vergileri dahil, satın alma fiyatı. (b) Varlığın yerleştirileceği yere
      ve yönetim tarafından amaçlanan koşullarda çalışabilmesini sağlayacak duruma getirilmesine ilişkin her türlü maliyet.
      (c) Maddi duran varlığın sökülmesi ve taşınması ile yerleştirildiği alanın restorasyonuna ilişkin tahmini maliyeti,
      işletmenin ilgili kalemin elde edilmesi ya da stok üretimi dışında bir amaçla belirli bir süre kullanımı sonucunda katlandığı
      yükümlülük.'
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 12
    alinti: 7’nci paragrafta belirtilen muhasebeleştirme ilkeleri kapsamında, bir işletme maddi duran varlık kalemlerinin
      günlük bakım maliyetlerini aktifleştiremez. Aksine, bu maliyetleri oluştukları tarihte gelir tablosu ile ilişkilendirir.
      Günlük bakım maliyetleri esas olarak, işçilik, sarf malzemeleri ve küçük parça maliyetlerini içerir. Bu harcamaların
      amacı genel olarak maddi duran varlık kaleminin ‘tamir ve bakım’ı olarak tanımlanır.
