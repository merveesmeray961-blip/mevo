- id: SMMM-STD-TFR-0008
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 23
  tip: bilgi
  zorluk: 1
  kok: Bir işletme, inşasının tamamlanması uzun bir süre gerektiren fabrika binası için kullandığı kredinin faizini
    ödemektedir. Bu faiz, binanın inşası ile doğrudan ilişkilendirilebilmektedir. TMS 23 Borçlanma Maliyetleri Standardına
    göre bu borçlanma maliyeti nasıl muhasebeleştirilir?
  secenekler:
    A: Oluştuğu dönemde gider olarak kâr veya zararda muhasebeleştirilir.
    B: İnşa tamamlanıncaya kadar gider yazılır; tamamlandıktan sonra varlığın maliyetine eklenir.
    C: Ödenen kısmı varlığın maliyetine eklenir, tahakkuk eden kısmı gider olarak yazılır.
    D: Varlığın maliyetine eklenmez; diğer kapsamlı gelirde izlenir.
    E: Varlığın maliyetinin bir parçası olarak aktifleştirilir.
  dogru: E
  aciklama:
    dogru_neden: TMS 23 par. 8'e göre özellikli varlığın elde edilmesi, inşası veya üretimi ile doğrudan ilişkilendirilebilen
      borçlanma maliyetleri, ilgili varlığın maliyetinin bir parçası olarak aktifleştirilir. Aktifleştirme, koşulların
      sağlandığı tarihte başlar ve gerekli işlemler esas itibarıyla tamamlandığında sona erer (par. 17 ve 22).
    celdiriciler:
      A: Gider yazma, varlıkla doğrudan ilişkilendirilemeyen diğer borçlanma maliyetleri için geçerlidir (par. 8);
        ilişkilendirilebilen faiz aktifleştirilir.
      B: Aktifleştirme inşa süresince, koşulların sağlandığı tarihten itibaren yapılır (par. 17); inşa bitene kadar
        gider yazılıp sonradan varlığa eklenmez.
      C: Aktifleştirme ödemeye değil oluşan borçlanma maliyetine göre yapılır (par. 17); tahakkuk eden faiz de varlığın
        maliyetine dahil edilir.
      D: Standart, ilişkilendirilebilen borçlanma maliyeti için diğer kapsamlı gelir yaklaşımı öngörmez; tutar varlığın
        maliyetine eklenir.
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 8
    alinti: İşletmelerce, bir özellikli varlığın elde edilmesi, inşası veya üretimi ile doğrudan ilişkilendirilebilen
      borçlanma maliyetleri, ilgili özellikli varlığın maliyetinin bir parçası olarak aktifleştirilir. İşletmeler,
      diğer borçlanma maliyetlerini oluştukları dönemde gider olarak muhasebeleştirirler.
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 22
    alinti: Bir varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli tüm işlemler esas
      itibarıyla tamamlandığında, borçlanma maliyetlerinin aktifleştirilmesine son verilir.
