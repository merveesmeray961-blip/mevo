  tip: bilgi
  zorluk: 1
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardı’nın temel amacı aşağıdakilerden hangisidir?
  secenekler:
    A: Varlıkların gerçeğe uygun değerle ölçülmesini sağlamak
    B: Bir işletmenin varlıklarının geri kazanılabilir tutarından daha yüksek bir değerden izlenmemesini sağlamak
    C: Tüm varlıklar için yıllık zorunlu değer düşüklüğü testi yapmak
    D: Değer düşüklüğü zararlarının geriye dönük düzeltilmesini zorunlu kılmak
    E: Yalnızca maddi duran varlıklar için değer düşüklüğü muhasebesi belirlemek
  dogru: B
  aciklama:
    dogru_neden: TMS 36 paragraf 1’e göre Standardın amacı; bir işletmenin, varlıklarının geri kazanılabilir tutarından daha
      yüksek bir değerden izlenmemesini sağlamak amacıyla uygulanması gereken ilkeleri belirlemektir. Varlık defter değeri
      kullanımı veya satışı ile geri kazanılacak tutardan fazlaysa değer düşüklüğüne uğramıştır.
    celdiriciler:
      A: Gerçeğe uygun değer ölçümü TFRS 13 ve ilgili standartların konusudur; TMS 36 geri kazanılabilir tutarı (kullanım
        değeri veya satış maliyetleri düşülmüş gerçeğe uygun değer) esas alır.
      C: Yıllık zorunlu test yalnızca şerefiye ve belirsiz ömürlü maddi olmayan duran varlıklar için geçerlidir; diğer varlıklar
        için göstergeler varsa test edilir.
      D: Değer düşüklüğü zararları genellikle ileriye yönelik muhasebeleştirilir; geriye dönük düzeltme TMS 8 kapsamındaki
        hatalar içindir.
      E: Standart stok, ertelenmiş vergi, finansal araçlar vb. hariç birçok varlık türüne uygulanır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 1
