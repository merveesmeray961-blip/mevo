- id: SMMM-STD-TFR-0009
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 3
  tip: kavrama
  zorluk: 2
  kok: TFRS 3 İşletme Birleşmeleri Standardına göre, bir işletme birleşmesinde edinen işletme, edinilen işletmenin
    tanımlanabilir varlık ve yükümlülüklerini hangi değere göre muhasebeleştirir?
  secenekler:
    A: Kullanım değerine göre
    B: Defter değerine göre
    C: Maliyet bedeline göre
    D: Net gerçekleşebilir değere göre
    E: Gerçeğe uygun değere göre
  dogru: E
  aciklama:
    dogru_neden: TFRS 3’e göre edinen işletme, edinilen işletmenin tanımlanabilir varlıklarını ve üstlendiği yükümlülüklerini
      edinme tarihindeki gerçeğe uygun değerleri üzerinden muhasebeleştirir (satın alma yöntemi / edinme yöntemi).
    celdiriciler:
      A: Kullanım değeri değer düşüklüğü testinde kullanılır, işletme birleşmesinde değil.
      B: Defter değeri değil, gerçeğe uygun değer esas alınır.
      C: Maliyet bedeli edinen için ödenen bedeldir; tanımlanan varlıklar gerçeğe uygun değerle ölçülür.
      D: Net gerçekleşebilir değer stoklar vb. için kullanılabilir; genel kural gerçeğe uygun değerdir.
  kaynaklar:
