- id: SMMM-STD-TFR-0016
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 15
  tip: kavrama
  zorluk: 2
  kok: TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardı’na göre hasılatın muhasebeleştirilmesi için beş adımlı modelde aşağıdaki
    adımlardan hangisi doğru sırada değildir?
  secenekler:
    A: Müşteri ile sözleşmenin tanımlanması → Edim yükümlülüklerinin belirlenmesi → İşlem bedelinin belirlenmesi → İşlem bedelinin
      edim yükümlülüklerine dağıtılması → Hasılatın muhasebeleştirilmesi
    B: Müşteri ile sözleşmenin tanımlanması → İşlem bedelinin belirlenmesi → Edim yükümlülüklerinin belirlenmesi → İşlem bedelinin
      edim yükümlülüklerine dağıtılması → Hasılatın muhasebeleştirilmesi
    C: Müşteri ile sözleşmenin tanımlanması → Edim yükümlülüklerinin belirlenmesi → İşlem bedelinin belirlenmesi → İşlem bedelinin
      edim yükümlülüklerine dağıtılması → Edim yükümlülüğü yerine getirildiğinde hasılatın muhasebeleştirilmesi
    D: Sözleşmenin tanımlanması → Performans yükümlülüklerinin belirlenmesi → İşlem fiyatının belirlenmesi → Fiyatın dağıtılması
      → Hasılatın kaydı
    E: Sözleşme tanımlama → Edim yükümlülüğü belirleme → Bedel belirleme → Bedeli dağıtma → Yerine getirme anında hasılat
  dogru: B
  aciklama:
    dogru_neden: 'TFRS 15 paragraf 9–31 ve 46–90’a göre beş adımlı model sırası şöyledir: (1) müşteri ile sözleşmenin tanımlanması,
      (2) sözleşmedeki edim yükümlülüklerinin belirlenmesi, (3) işlem bedelinin belirlenmesi, (4) işlem bedelinin edim yükümlülüklerine
      dağıtılması, (5) edim yükümlülüğü yerine getirildiğinde (veya yerine getirildikçe) hasılatın muhasebeleştirilmesi. B
      seçeneğinde 2. ve 3. adımlar yer değiştirmiştir.'
    celdiriciler:
      A: Doğru sırayı yansıtır.
      C: Doğru sırayı yansıtır (5. adım açıkça belirtilmiş).
      D: Aynı doğru sıranın farklı ifadeyle sunumudur.
      E: Aynı doğru sıranın kısa ifadesidir.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 9, 22, 47, 73, 31
    alinti: 'İşletme, ancak aşağıdaki şartların tamamının karşılanması durumunda, müşteriyle yapılan bir sözleşmeyi bu Standart
      kapsamında muhasebeleştirir: [...] Sözleşme başlangıcında işletme, müşteriyle yaptığı bir sözleşmede taahhüt ettiği
      mal veya hizmetleri değerlendirir ve aşağıdakilerden birini devretmeye yönelik müşteriye verdiği her bir taahhüdü bir
      edim yükümlülüğü olarak belirler: [...] İşlem bedeli, işletmenin üçüncü şahıslar adına tahsil edilen tutarlar hariç
      [...], taahhüt ettiği mal veya hizmetleri müşteriye devretmesi karşılığında hak etmeyi beklediği bedeldir. [...] İşletme
      açısından, işlem bedelinin dağıtımından amaç, işlem bedelinin her bir edim yükümlülüğüne (veya farklı mal veya hizmete)
      tahsis edilmesidir. [...] İşletme taahhüt edilen bir mal veya hizmeti (başka bir ifadeyle, bir varlığı) müşterisine
      devrederek edim yükümlülüğünü yerine getirdiğinde (veya getirdikçe) hasılatı finansal tablolara alır.'
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: geri_cekildi
  surum: 1
  uretim:
