- id: SMMM-STD-TFR-0006
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: kavrama
  zorluk: 2
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre, bir varlığın geri kazanılabilir tutarı ile ilgili aşağıdaki
    ifadelerden hangisi doğrudur?
  secenekler:
    A: Satış maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinden düşük olanıdır.
    B: Satış maliyetleri düşülmemiş gerçeğe uygun değer ile defter değerinden yüksek olanıdır.
    C: Kullanım değeri ile defter değerinden yüksek olanıdır.
    D: Satış maliyetleri düşülmüş gerçeğe uygun değer ile defter değerinden düşük olanıdır.
    E: Satış maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinden yüksek olanıdır.
  dogru: E
  aciklama:
    dogru_neden: TMS 36 par. 6'ya göre geri kazanılabilir tutar, varlığın satış maliyetleri düşülmüş gerçeğe uygun
      değeri ile kullanım değerinden yüksek olanıdır. Değer düşüklüğü, defter değerinin bu tutarı aşması halinde
      ortaya çıkar (par. 59).
    celdiriciler:
      A: İki tutardan düşük olanı değil, yüksek olanı alınır; düşük olanın seçilmesi TFRS 5 ölçümüne özgü bir kuraldır.
      B: Gerçeğe uygun değerden satış maliyetleri düşülür ve karşılaştırma defter değeriyle değil kullanım değeriyle
        yapılır.
      C: Defter değeri geri kazanılabilir tutarın bileşeni değildir; karşılaştırılan tutarlar satış maliyetleri
        düşülmüş gerçeğe uygun değer ve kullanım değeridir.
      D: Defter değeri geri kazanılabilir tutarın hesabına girmez; ayrıca düşük olan değil yüksek olan tutar esas
        alınır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 6
    alinti: 'Geri kazanılabilir tutar: Bir varlığın veya nakit yaratan birimin, satış maliyetleri düşülmüş gerçeğe
      uygun değeri ile kullanım değerinden yüksek olanıdır.'
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 59
    alinti: Sadece ve sadece, bir varlığın geri kazanılabilir tutarının defter değerinden düşük olması durumunda,
      söz konusu varlığın defter değeri geri kazanılabilir tutarına indirgenir.
