- id: SMMM-STD-TFR-0005
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 8
  tip: bilgi
  zorluk: 1
  kok: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre, bir işlem, diğer olay
    veya koşula özel olarak uygulanan bir TFRS’nin bulunmaması durumunda işletme yönetimi muhasebe politikasını geliştirirken
    ve uygularken kendi takdirini kullanırken, uygulanabilirliklerini göz önünde bulundurarak sırasıyla hangi kaynaklara başvurur?
  secenekler:
    A: Önce diğer standart belirleyici organların en son düzenlemelerine, sonra Kavramsal Çerçeve’ye
    B: Önce benzer ve ilişkili konuları ele alan TFRS’lerde yer alan hükümlere, sonra Kavramsal Çerçeve’de yer alan tanımlar,
      finansal tablolara alma kıstasları ve ölçüm esaslarına
    C: Yalnızca Kavramsal Çerçeve’de yer alan tanımlara ve ölçüm esaslarına
    D: Önce kabul görmüş sektör uygulamalarına, sonra benzer TFRS hükümlerine
    E: Yalnızca TMS 1 Finansal Tabloların Sunuluşu hükümlerine
  dogru: B
  aciklama:
    dogru_neden: TMS 8 par. 11’e göre işletme yönetimi, 10’uncu paragraf çerçevesinde kendi takdirini kullanırken sırasıyla
      (a) benzer ve ilişkili konuları ele alan TFRS’lerde yer alan hükümlere ve (b) Kavramsal Çerçeve’de yer alan tanımlar,
      finansal tablolara alma kıstasları ve ölçüm esaslarına başvurur.
    celdiriciler:
      A: Sıra terstir; önce benzer TFRS’ler, sonra Kavramsal Çerçeve gelir.
      C: Kavramsal Çerçeve ikinci sıradadır; benzer TFRS’ler önce gelir.
      D: Sektör uygulamaları par. 12’de, 11’deki kaynaklarla çelişmediği sürece dikkate alınabilir; birinci sırada değildir.
      E: TMS 1 açıklama hükümleri içindir; politika seçiminde doğrudan kaynak değildir.
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 11
    alinti: 'İşletme yönetimi, 10’uncu paragraf çerçevesinde kendi takdirini kullanırken, uygulanabilirliklerini göz önünde
      bulundurarak, sırasıyla aşağıdaki kaynaklara başvurur: (a) Benzer ve ilişkili konuları ele alan TFRS’lerde yer alan
      hükümler ve (b) Varlık, yükümlülük, gelir ve giderlerle ilgili olarak Finansal Raporlamaya İlişkin Kavramsal Çerçeve’de
      (Kavramsal Çerçeve) yer alan tanımlar, finansal tablolara alma kıstasları ve ölçüm esasları.'
