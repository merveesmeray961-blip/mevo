      taahhüt ettiği mal veya hizmetleri değerlendirir ve aşağıdakilerden birini devretmeye yönelik müşteriye verdiği
      her bir taahhüdü bir edim yükümlülüğü olarak belirler: [...] İşlem bedeli, işletmenin üçüncü şahıslar adına
      tahsil edilen tutarlar hariç [...], taahhüt ettiği mal veya hizmetleri müşteriye devretmesi karşılığında hak
      etmeyi beklediği bedeldir. [...] İşletme açısından, işlem bedelinin dağıtımından amaç, işlem bedelinin her
      bir edim yükümlülüğüne (veya farklı mal veya hizmete) tahsis edilmesidir. [...] İşletme taahhüt edilen bir
      mal veya hizmeti (başka bir ifadeyle, bir varlığı) müşterisine devrederek edim yükümlülüğünü yerine getirdiğinde
      (veya getirdikçe) hasılatı finansal tablolara alır.'
