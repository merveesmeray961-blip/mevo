  kok: 'TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardına göre, hasılatın muhasebeleştirilmesine ilişkin beş adımlı modelde
    aşağıdaki adımlardan hangisi doğru sırayla yer alır?


    I. Sözleşmedeki edim yükümlülüklerinin belirlenmesi

    II. İşlem bedelinin belirlenmesi

    III. Sözleşmenin tanımlanması

    IV. İşlem bedelinin edim yükümlülüklerine dağıtılması

