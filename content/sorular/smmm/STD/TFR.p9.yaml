      uygun değerler temelinde dağıtılır ve şerefiye oluşmaz.
    D: Varlık grubu tek kalem olarak özkaynaklarda muhasebeleştirilir.
    E: İşlem ortak kontrole tabi birleşme sayılarak kapsam dışına çıkarılır.
  dogru: C
  aciklama:
    dogru_neden: 'TFRS 3 paragraf 2(b), işletme tanımına uymayan varlık veya varlık grubunun edinimini kapsam dışında bırakır;
      varlıklar ve borçlar ayrı ayrı tanımlanıp muhasebeleştirilir ve maliyet gerçeğe uygun değerler temelinde dağıtılır.
      Püf noktaları: Önce edinilen şeyin bir işletme olup olmadığı belirlenir.'
    celdiriciler:
      A: Satın alma yöntemi tüm varlık edinimlerine otomatik uygulanmaz.
      B: Senaryoda edinilen grubun işletme olmadığı belirtilmiştir.
      D: Metin, ayrı ayrı tanımlama ve muhasebeleştirme ister.
      E: Ortak kontrol bilgisi verilmemiştir; ayrıca farklı bir kapsam istisnasıdır.
