  kazanim: TMS 16
  tip: kavrama
  zorluk: 3
  kok: 'TMS 16''nın kapsamına ilişkin aşağıdaki önermeleri değerlendiriniz.


    I. Taşıyıcı bitkiler dışındaki tarımsal faaliyetlerle ilgili canlı varlıklar bu Standardın kapsamı dışındadır.

    II. Taşıyıcı bitkilerin kendileri TMS 16 kapsamındadır; taşıyıcı bitkilerin ürünleri ise bu kapsamda değildir.

    III. Bu kapsam dışı varlıkların geliştirilmesi veya korunmasında kullanılan maddi duran varlıklar da her durumda TMS 16
    dışında kalır.


    Hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'TMS 16 paragraf 3(b), taşıyıcı bitkiler dışındaki canlı varlıkları hariç tutar; taşıyıcı bitkileri kapsar,
      ürünlerini kapsamaz. Aynı paragrafın son cümlesi, belirli kapsam dışı varlıkların geliştirilmesi veya korunmasında kullanılan
      maddi duran varlıklara Standardın uygulanacağını belirtir. Püf noktaları: Varlığın kendisi ile onu geliştiren/koruyan
      maddi duran varlığı ayırın.'
    celdiriciler:
      A: II de doğrudur.
      B: I de doğrudur.
      D: III, paragrafın son cümlesiyle çelişir.
      E: III yanlıştır.
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 3(b) ve son cümle
    alinti: 'Taşıyıcı bitkiler dışındaki tarımsal faaliyetlerle ilgili canlı varlıklar (bakınız: TMS 41 Tarımsal Faaliyetler).
      Bu Standart taşıyıcı bitkilere uygulanır ancak taşıyıcı bitkilerin ürünlerine uygulanmaz.'
