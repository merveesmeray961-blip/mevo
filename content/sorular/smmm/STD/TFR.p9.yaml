  tip: uygulama
  zorluk: 3
  kok: Bir şirket, işletme tanımını karşılamayan bir varlık grubunu 1.000.000 TL bedelle satın almıştır. Grupta
    yer alan tanımlanabilir varlıkların ve üstlenilen borçların satın alma tarihindeki gerçeğe uygun değerlerinin
    net toplamı 900.000 TL'dir. TFRS 3'e göre aradaki 100.000 TL'lik fark nasıl muhasebeleştirilir?
  secenekler:
    A: Şerefiye olarak finansal tablolara alınır ve değer düşüklüğü testine tabi tutulur.
    B: Satın alma tarihinde gider olarak kâr veya zarara yansıtılır.
    C: Maliyet, varlık ve borçlara gerçeğe uygun değerleriyle orantılı dağıtılır; şerefiye oluşmaz.
    D: Ayrı bir maddi olmayan duran varlık olarak izlenir ve itfa edilir.
    E: Maliyet, varlıkların defter değerleriyle orantılı dağıtılır; şerefiye oluşmaz.
  dogru: C
  aciklama:
    dogru_neden: TFRS 3 par. 2(b), işletme tanımına uymayan varlık grubunun ediniminde varlıkların ve borçların
      ayrı ayrı tanımlanıp muhasebeleştirilmesini, grubun maliyetinin satın alma tarihindeki gerçeğe uygun değerlerine
      bağlı olarak bunlara dağıtılmasını ve işlemin şerefiyeye yol açmamasını öngörür. Bu nedenle 100.000 TL'lik
      fark şerefiye olmaz, dağıtıma dahil edilir.
    celdiriciler:
      A: Şerefiye işletme birleşmesinde (par. 32) ortaya çıkar; par. 2(b) kapsamındaki işlem şerefiyeye yol açmaz.
      B: Grubun maliyeti gider değildir; edinilen varlık ve borçlara dağıtılan bir maliyettir.
      D: Fark ayrı bir maddi olmayan duran varlık oluşturmaz; maliyet tanımlanabilir varlık ve borçlara dağıtılır.
      E: Dağıtımın esası defter değerleri değil, satın alma tarihindeki gerçeğe uygun değerlerdir (par. 2(b)).
  kaynaklar:
