  kok: Mavi AŞ, başka bir işletmeden üretim hattı, bina ve bunlarla ilgili bazı yükümlülükleri tek işlemle satın almıştır.
    Edinilen varlık grubu işletme tanımını karşılamamaktadır. TFRS 3'e göre hangi muhasebeleştirme yaklaşımı uygundur?
  secenekler:
    A: Her durumda satın alma yöntemi uygulanır ve şerefiye hesaplanır.
    B: İşlem işletme birleşmesi sayılır; kontrol gücü olmayan paylar belirlenir.
