      ister. Finansal varlıklar ve kısa sürede üretilen stoklar özellikli varlık değildir. Püf noktaları: Hem özellikli varlık
      koşulu hem doğrudan ilişkilendirme aranır.'
    celdiriciler:
      B: Finansal varlıklar özellikli varlık değildir.
      C: II aktifleştirme kapsamına girmez.
