  kok: TMS 23'ün borçlanma maliyetlerine ilişkin yaklaşımı bakımından aşağıdaki durumların muhasebeleştirilmesini
    doğru eşleştiren seçenek hangisidir? I. Özellikli varlık olan fabrikanın inşası için özel olarak alınan kredinin
    faizi. II. Özellikli varlıkla ilişkilendirilemeyen işletme sermayesi kredisinin faizi. III. Özel kredinin henüz
    kullanılmayan kısmının geçici olarak nemalandırılmasından elde edilen faiz geliri.
  secenekler:
    A: I gider yazılır; II aktifleştirilir; III aktifleştirilecek tutara eklenir.
    B: I ve II aktifleştirilir; III aktifleştirilecek tutardan düşülür.
    C: I aktifleştirilir; II gider yazılır; III aktifleştirilecek tutara eklenir.
    D: I aktifleştirilir; II gider yazılır; III aktifleştirilecek tutardan düşülür.
    E: I aktifleştirilir; II gider yazılır; III diğer kapsamlı gelirde izlenir.
  dogru: D
  aciklama:
    dogru_neden: TMS 23 par. 8'e göre doğrudan ilişkilendirilebilen borçlanma maliyeti (I) aktifleştirilir, diğer
      borçlanma maliyeti (II) oluştuğu dönemde gider yazılır. Par. 12'ye göre özel borçlanmanın geçici nemalandırılmasından
      sağlanan gelir (III), aktifleştirilecek borçlanma maliyetinden düşülür.
    celdiriciler:
      A: I ve II'nin işlemleri ters çevrilmiş, III'ün aktifleştirilecek tutara eklenmesi de par. 12'ye aykırıdır.
      B: İlişkilendirilemeyen işletme sermayesi kredisinin faizi (II) aktifleştirilmez; oluştuğu dönemde gider yazılır
        (par. 8).
      C: III için eklenmesi yanlıştır; geçici nemalandırma geliri aktifleştirilecek borçlanma maliyetinden düşülür
        (par. 12).
      E: Geçici nemalandırma geliri diğer kapsamlı gelirde izlenmez; aktifleştirilecek borçlanma maliyetinden düşülür
        (par. 12).
