  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 3
  tip: uygulama
  zorluk: 3
  kok: Mavi AŞ, başka bir işletmeden üretim hattı, bina ve bunlarla ilgili bazı yükümlülükleri tek işlemle satın
    almıştır. Edinilen varlık grubu işletme tanımını karşılamamaktadır. TFRS 3'e göre hangi muhasebeleştirme yaklaşımı
    uygundur?
  secenekler:
    A: Satın alma yöntemi uygulanır; edinilen net varlıklar ile bedel arasındaki fark şerefiyedir.
    B: İşlem işletme birleşmesi sayılır; kontrol gücü olmayan paylar ve şerefiye belirlenir.
    C: Varlık grubu tek kalem olarak ve maliyet bedeliyle özkaynaklarda muhasebeleştirilir.
    D: İşlem ortak kontrole tabi birleşme sayılır ve TFRS 3 kapsamı dışına çıkarılır.
    E: Varlık ve borçlar ayrı ayrı tanınır; maliyet gerçeğe uygun değerlere göre dağıtılır ve şerefiye oluşmaz.
  dogru: E
  aciklama:
    dogru_neden: 'TFRS 3 paragraf 2(b), işletme tanımına uymayan varlık veya varlık grubunun edinimini kapsam dışında
      bırakır; varlıklar ve borçlar ayrı ayrı tanımlanıp muhasebeleştirilir ve maliyet gerçeğe uygun değerler temelinde
      dağıtılır. Püf noktaları: Önce edinilen şeyin bir işletme olup olmadığı belirlenir.'
    celdiriciler:
      A: Satın alma yöntemi tüm varlık edinimlerine otomatik uygulanmaz.
      B: Senaryoda edinilen grubun işletme olmadığı belirtilmiştir.
      C: Metin, ayrı ayrı tanımlama ve muhasebeleştirme ister.
      D: Ortak kontrol bilgisi verilmemiştir; ayrıca farklı bir kapsam istisnasıdır.
