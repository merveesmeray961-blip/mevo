  kok: Bir sözleşmede müşteriye tek bir bedel karşılığında iki ayrı mal ve hizmet taahhüt edilmiştir. Taahhüt edilen
    mal ve hizmetler birbirinden farklı olup ayrı edim yükümlülükleri olarak belirlenmiştir ve işletme işlem bedelini
    de tespit etmiştir. TFRS 15'in beş adımlı modelinde işletmenin bu aşamadan sonra izlemesi gereken adım aşağıdakilerden
    hangisidir?
  secenekler:
    A: Hasılatı, edim yükümlülükleri yerine getirildikçe finansal tablolara almak
    B: Sözleşmedeki edim yükümlülüklerini ayrı ayrı belirlemek
    C: Müşteriyle yapılan sözleşmenin varlığını ve niteliğini tanımlamak
    D: Değişken bedel tahminlerini sınırlandırarak işlem bedelini düzeltmek
    E: İşlem bedelini sözleşmedeki edim yükümlülüklerine dağıtmak
  dogru: E
  aciklama:
    dogru_neden: TFRS 15 par. 73-74'e göre işlem bedelinin dağıtımından amaç, işlem bedelinin her bir edim yükümlülüğüne
      tahsis edilmesidir; dağıtım nispi tek başına satış fiyatı esasına göre yapılır. Bu adım, işlem bedelinin belirlenmesinden
      sonra ve hasılatın finansal tablolara alınmasından önce gelir.
    celdiriciler:
      A: Hasılat, bedel edim yükümlülüklerine dağıtıldıktan sonra, edim yükümlülüğü yerine getirildikçe finansal
        tablolara alınır (par. 46); bu adım dağıtımın önüne geçemez.
      B: Edim yükümlülükleri sözleşme başlangıcında belirlenir (par. 22); kökte bu adım zaten tamamlanmıştır.
      C: Sözleşmenin tanımlanması modelin ilk adımıdır ve işlem bedelinin belirlenmesinden önce yapılmıştır.
      D: Değişken bedel tahminlerinin sınırlandırılması işlem bedelinin belirlenmesi adımının içindedir (par. 56-58);
        kökte bu adım tamamlanmıştır.
