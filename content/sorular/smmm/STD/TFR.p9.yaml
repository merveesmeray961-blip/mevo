      uygulanması beklenen tüketim modelini yansıtır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 61
    alinti: Bir varlığa uygulanan amortisman yöntemi en azından, her hesap döneminin sonunda gözden geçirilir. Varlığın
