    finansal tablolara almak istemektedir. Bu kalemin maliyetinin varlık olarak finansal tablolara yansıtılabilmesi
    için hangi koşulların birlikte sağlanması gerekir?
  secenekler:
    A: Maliyetin güvenilir ölçülebilmesi ve varlığın yeniden değerleme modeline göre izlenmesi
