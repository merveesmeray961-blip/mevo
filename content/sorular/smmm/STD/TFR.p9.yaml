- id: SMMM-STD-TFR-0071
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: par. 8
  tip: kavrama
  zorluk: 1
  kok: TMS 23 açısından özellikli varlıkla doğrudan ilişkilendirilebilen borçlanma maliyetlerinin muhasebeleştirilmesinde
    temel ayrım hangisidir?
  secenekler:
    A: Özellikli varlıkla doğrudan ilişkilendirilebilen maliyetler aktifleştirilir; diğer borçlanma maliyetleri
      oluştukları dönemde gider yazılır
    B: Doğrudan ilişkilendirilebilen maliyetler oluştukları dönemde gider yazılır; diğer borçlanma maliyetleri varlığın
      maliyetine eklenir
    C: Faiz giderleri gider yazılır; borçlanmayla ilişkili diğer maliyetler varlığın maliyetine eklenir
    D: Aktifleştirme tercihe bağlıdır; işletme ilişkilendirilebilen maliyetleri dilerse gider yazabilir
    E: Doğrudan ilişkilendirilebilen maliyetler varlık satıldığında gider yazılır; diğerleri oluştukları dönemde
      gider yazılır
  dogru: A
  aciklama:
    dogru_neden: TMS 23 par. 8'e göre özellikli varlığın elde edilmesi, inşası veya üretimi ile doğrudan ilişkilendirilebilen
