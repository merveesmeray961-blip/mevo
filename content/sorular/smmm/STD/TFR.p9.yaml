- id: SMMM-STD-TFR-0021
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: Kavramsal Çerçeve; diğer TMS/TFRS kapsam ve ölçüm
  tip: uygulama
  zorluk: 3
  kok: Bir işletme, bir sözleşmenin bazı kısımlarının özel bir standardın ilk ölçüm hükümlerine, kalan kısmının ise TFRS 15'e
    tabi olduğunu belirlemiştir. TFRS 15'in 7'nci paragrafındaki yaklaşıma göre aşağıdaki işlem sırası hangisidir?
  secenekler:
    A: Önce sözleşmenin tüm bedeli TFRS 15'e dağıtılır, sonra özel standart uygulanır.
    B: Önce diğer standardın ayırma ve/veya ilk ölçüm hükümleri uygulanır; bu kısımlara ilişkin tutarlar işlem bedelinden
      çıkarılır ve kalan tutar TFRS 15 uyarınca dağıtılır.
    C: Sözleşmenin tamamı, bedelin çoğunluğunu oluşturan standarda tabi tutulur.
    D: İşletme iki standardı aynı anda uygulayamaz; sözleşmenin tamamı kapsam dışı kalır.
    E: Önce tüm bedel özel standarda göre ölçülür; kalan tutar hasılat olarak kaydedilmeden bırakılır.
  dogru: B
  aciklama:
    dogru_neden: 'TFRS 15 paragraf 7(a), diğer standartlar ayırma veya ilk ölçümü düzenliyorsa öncelikle o hükümlerin uygulanmasını;
      bu kısımların işlem bedelinden çıkarılmasını ve kalan tutarın TFRS 15''e göre dağıtılmasını öngörür. Püf noktaları:
      Öncelik, sözleşmenin tamamına değil ilgili kısma ilişkin özel standart hükümlerinedir.'
    celdiriciler:
      A: Özel standardın önceliğini tersine çevirir.
      C: Bedelin çoğunluğuna göre standart seçme kuralı yoktur.
      D: Standartların kısmen birlikte uygulanması mümkündür.
      E: Kalan bedelin TFRS 15 uyarınca dağıtılması gerekir.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 7(a)
    alinti: Diğer Standartlar sözleşmenin bir veya daha çok kısmının nasıl ayrılacağını ve/veya ilk ölçümünün nasıl yapılacağını
      açıklamışsa, işletme öncelikle o Standartlarda yer alan ayırma ve/veya ölçüm hükümlerini uygular.
