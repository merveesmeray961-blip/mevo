- id: SMMM-STD-TFR-0002
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TMS 36 — geri kazanılabilir tutar ve değer düşüklüğü zararının hesaplanması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardını uygulayan K A.Ş.'nin maliyet modeliyle izlediği bir makinesinin
    raporlama dönemi sonundaki defter değeri 500.000 ₺'dir. Makinenin gerçeğe uygun değeri 470.000 ₺, makinenin
    elden çıkarılmasıyla doğrudan ilgili maliyetler 20.000 ₺, makineden elde edilmesi beklenen gelecekteki nakit
    akışlarının bugünkü değeri ise 430.000 ₺'dir. Buna göre makine için finansal tablolara alınacak değer düşüklüğü
    zararı kaç ₺'dir?
  secenekler:
    A: 20.000 ₺
    B: 30.000 ₺
    C: 50.000 ₺
    D: 70.000 ₺
    E: 450.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'TMS 36 md. 6 ve 18''e göre geri kazanılabilir tutar, satış maliyetleri düşülmüş gerçeğe uygun
      değer (470.000 − 20.000 = 450.000 ₺) ile kullanım değerinden (430.000 ₺) yüksek olanıdır: 450.000 ₺. md. 59''a
      göre defter değeri geri kazanılabilir tutardan yüksek olduğundan defter değeri bu tutara indirgenir; değer
      düşüklüğü zararı 500.000 − 450.000 = 50.000 ₺''dir.'
    hesap_adimlari:
    - 'Satış maliyetleri düşülmüş gerçeğe uygun değer: 470.000 − 20.000 = 450.000 ₺'
    - 'Kullanım değeri: 430.000 ₺'
    - Geri kazanılabilir tutar = yüksek olanı = 450.000 ₺
    - 'Değer düşüklüğü zararı: 500.000 − 450.000 = 50.000 ₺'
    celdiriciler:
      A: 20.000 ₺ yalnızca elden çıkarma maliyetleridir; değer düşüklüğü zararı defter değeri ile geri kazanılabilir
        tutar arasındaki farktır.
      B: Elden çıkarma maliyetleri düşülmeden gerçeğe uygun değer (470.000 ₺) geri kazanılabilir tutar sayılmıştır
        (500.000 − 470.000).
      D: Geri kazanılabilir tutar olarak iki ölçüden düşük olan kullanım değeri (430.000 ₺) alınmıştır; Standart
        yüksek olanın alınmasını öngörür.
      E: 450.000 ₺ geri kazanılabilir tutardır; değer düşüklüğü zararı defter değerinin bu tutarı aşan kısmıdır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: md. 6 (tanımlar)
    alinti: 'Değer düşüklüğü zararı: Bir varlığın veya nakit yaratan birimin defter değerinin geri kazanılabilir
      tutarı aşan kısmını ifade eder. Geri kazanılabilir tutar: Bir varlığın veya nakit yaratan birimin, satış maliyetleri
      düşülmüş gerçeğe uygun değeri ile kullanım değerinden yüksek olanıdır. ... Kullanım değeri: Bir varlık veya
      nakit yaratan birimden elde edilmesi beklenen gelecekteki nakit akışlarının bugünkü değeridir.'
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: md. 59
    alinti: Sadece ve sadece, bir varlığın geri kazanılabilir tutarının defter değerinden düşük olması durumunda,
      söz konusu varlığın defter değeri geri kazanılabilir tutarına indirgenir. Anılan indirgeme, bir değer düşüklüğü
      zararıdır.
  dogrulama:
    python: 'defter_degeri = 500000

      satis_maliyeti_dusulmus_gud = 470000 - 20000

      kullanim_degeri = 430000

      geri_kazanilabilir = max(satis_maliyeti_dusulmus_gud, kullanim_degeri)

      sonuc = max(defter_degeri - geri_kazanilabilir, 0)

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-STD-TFR-0003
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TMS 23 — özel amaçlı borçlanmada aktifleştirme dönemi ve aktifleştirilecek borçlanma maliyeti
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: M A.Ş., yalnızca bir fabrika binası (özellikli varlık) inşa etmek amacıyla 1 Ocak 2026'da yıllık %24 basit
    faizli 2.000.000 ₺ banka kredisi kullanmıştır. Arsa üzerinde 1 Nisan 2026'ya kadar hiçbir çalışma yapılmamış;
    bu tarihte inşaat izni işlemlerine başlanmış ve ilk inşaat harcaması yapılmıştır. Binanın fiziki inşası 30 Eylül
    2026'da esas itibarıyla tamamlanmış, müşteri talebine bağlı küçük dekorasyon işleri ise Aralık 2026 sonuna kadar
    sürmüştür. Kredinin henüz harcanmayan kısmının Nisan–Eylül 2026 döneminde geçici olarak nemalandırılmasından
    30.000 ₺ gelir elde edilmiştir. TMS 23 Borçlanma Maliyetleri Standardına göre 2026 yılında bina maliyetine eklenecek
    (aktifleştirilecek) borçlanma maliyeti kaç ₺'dir?
  secenekler:
    A: 480.000 ₺
    B: 450.000 ₺
    C: 330.000 ₺
    D: 240.000 ₺
    E: 210.000 ₺
  dogru: E
  aciklama:
    dogru_neden: 'TMS 23 md. 17''ye göre aktifleştirme; harcama yapıldığında, borçlanma maliyeti oluştuğunda ve
      varlığın hazır hale getirilmesi için gerekli işlemlere başlandığında başlar. md. 19''a göre herhangi bir gelişme
      olmaksızın arsanın elde tutulması sırasındaki borçlanma maliyetleri aktifleştirilemez; bu nedenle başlangıç
      1 Nisan 2026''dır. md. 22–23''e göre fiziki inşanın tamamlanmasıyla (dekorasyon gibi küçük işler devam etse
      de) aktifleştirme sona erer: 30 Eylül 2026. Aktifleştirme dönemi 6 aydır. Aylık faiz 2.000.000 × %24 / 12
      = 40.000 ₺; 6 aylık faiz 240.000 ₺. md. 12''ye göre geçici nemalandırma geliri düşülür: 240.000 − 30.000 =
      210.000 ₺. Kullanılan teknikler: (1) çok adımlı hesap; (2) tarih/süre hesabı — başlangıç ve bitiş tarihlerinin
      Standarda göre belirlenmesi; (3) tipik hata çeldiricileri. Tuzak, dekorasyon işleri nedeniyle aktifleştirmenin
      Aralık sonuna kadar sürdürülmesi ve kredinin kullanıldığı Ocak ayından başlatılmasıdır.'
    hesap_adimlari:
    - 'Aktifleştirme başlangıcı: 1 Nisan 2026 (harcama + gerekli işlemlerin başlaması; md. 17, 19)'
    - 'Aktifleştirme sonu: 30 Eylül 2026 (fiziki inşa esas itibarıyla tamamlandı; md. 22–23)'
    - 'Süre: Nisan–Eylül = 6 ay'
    - 'Faiz: 2.000.000 × 0,24 × 6/12 = 240.000 ₺'
    - 'Nemalandırma geliri düşülür: 240.000 − 30.000 = 210.000 ₺'
    celdiriciler:
      A: Yıllık faizin tamamı gelir düşülmeden aktifleştirilmiştir; hem dönem sınırları hem md. 12 göz ardı edilmiştir.
      B: Aktifleştirme kredinin kullanıldığı 1 Ocak'tan yıl sonuna kadar yapılmıştır (480.000 − 30.000); oysa işlem
        başlamadan arsanın elde tutulduğu dönemde ve inşa tamamlandıktan sonra aktifleştirme yapılmaz.
      C: Aktifleştirme dekorasyon işleri nedeniyle Aralık sonuna kadar (9 ay) sürdürülmüştür (360.000 − 30.000);
        md. 23'e göre küçük dekorasyon işleri tüm işlemlerin esas itibarıyla tamamlanmadığı anlamına gelmez.
      D: 6 aylık faiz doğru hesaplanmış ancak md. 12 uyarınca düşülmesi gereken 30.000 ₺ geçici nemalandırma geliri
        düşülmemiştir.
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: md. 12
    alinti: Bir işletme bir özellikli varlığın edinilmesi amacıyla özellikle borçlanmış ise, bu durumda aktifleştirilecek
      borçlanma maliyeti tutarı; ilgili dönem boyunca söz konusu borçlanmaya ilişkin oluşan borçlanma maliyetlerinden,
      söz konusu fonların geçici olarak nemalandırılması ile sağlanan gelirlerin düşülmesi suretiyle belirler.
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: md. 17
    alinti: 'İşletmelerce borçlanma maliyetlerinin bir özellikli varlığın maliyetinin parçası olarak aktifleştirilmesine,
      aktifleştirme koşullarının sağlandığı tarihte başlanır. Aktifleştirmenin başlama tarihi, işletmenin aşağıdaki
      koşulların tümünü sağladığı tarihtir: (a) İşletme, varlık için harcama yaptığında; (b) Borçlanma maliyetleri
      oluştuğunda; (c) İşletme, ilgili varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli
      işlemlere başladığında.'
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: md. 19 (son cümleler)
    alinti: Ancak, bu tür işlemler, varlığın durumunu değiştiren herhangi bir üretim veya gelişme olmaksızın varlığın
      elde tutulmasını kapsamaz. ... Ancak, bina yapma amacıyla alınan bir arazinin, herhangi bir gelişme olmaksızın
      elde tutulması sırasında oluşan borçlanma maliyetleri aktifleştirilemez.
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: md. 22–23
    alinti: Bir varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli tüm işlemler esas
      itibarıyla tamamlandığında, borçlanma maliyetlerinin aktifleştirilmesine son verilir. ... Normal şartlar altında,
      bir varlığın fiziken inşasının tamamlanması; olağan idari işlemler devam etse dahi, ilgili varlığın amaçlanan
      kullanıma veya satışa hazır olduğu anlamına gelir. Varlıkla ilgili, müşterinin veya kullanıcının talebine
      göre, dekorasyon ve benzeri küçük işlemlere devam edilmesi tüm işlemlerin esas itibarıyla tamamlanmadığı anlamına
      gelmez.
  dogrulama:
    python: 'anapara = 2000000

      yillik_oran = 0.24

      aktiflestirme_ay = 6  # 1 Nisan - 30 Eylül

      nemalandirma_geliri = 30000

      sonuc = anapara * yillik_oran * aktiflestirme_ay / 12 - nemalandirma_geliri

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-STD-TFR-0004
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TFRS 15 — işlem bedelinin nispi tek başına satış fiyatlarına göre edim yükümlülüklerine dağıtılması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: P A.Ş., bir müşterisine bir makine ile iki yıllık bakım hizmetini birlikte 900.000 ₺ karşılığında satmıştır.
    Makine ve bakım hizmeti iki ayrı edim yükümlülüğüdür. P A.Ş.'nin bu mal ve hizmeti benzer müşterilere ayrı ayrı
    sattığı fiyatlar makine için 800.000 ₺, bakım hizmeti için 200.000 ₺'dir. İndirimin edim yükümlülüklerinden
    yalnızca birine ilişkin olduğuna dair gözlemlenebilir bir gösterge bulunmamaktadır. TFRS 15 Müşteri Sözleşmelerinden
    Hasılat Standardına göre işlem bedelinden makineye dağıtılacak tutar kaç ₺'dir?
  secenekler:
    A: 900.000 ₺
    B: 800.000 ₺
    C: 750.000 ₺
    D: 720.000 ₺
    E: 700.000 ₺
  dogru: D
  aciklama:
    dogru_neden: TFRS 15 md. 74 ve 76'ya göre işlem bedeli, edim yükümlülüklerine nispi tek başına satış fiyatı
      esasına göre dağıtılır. md. 81'e göre indirimin yalnızca bir edim yükümlülüğüne ait olduğuna dair gözlemlenebilir
      gösterge yoksa indirim tüm edim yükümlülüklerine orantılı dağıtılır. Tek başına satış fiyatları toplamı 1.000.000
      ₺'dir; makinenin payı 800.000 / 1.000.000 = %80. Makineye dağıtılacak tutar 900.000 × %80 = 720.000 ₺'dir.
    hesap_adimlari:
    - 'Tek başına satış fiyatları toplamı: 800.000 + 200.000 = 1.000.000 ₺'
    - 'Makinenin nispi payı: 800.000 / 1.000.000 = %80'
    - 'Makineye dağıtılan işlem bedeli: 900.000 × 0,80 = 720.000 ₺'
    celdiriciler:
      A: Sözleşme bedelinin tamamı makineye verilmiştir; iki ayrı edim yükümlülüğü olduğundan bedel dağıtılmalıdır.
      B: Makinenin tek başına satış fiyatı doğrudan alınmıştır; 100.000 ₺ indirim md. 81 uyarınca orantılı dağıtılmalıdır.
      C: 100.000 ₺ indirim iki edim yükümlülüğüne eşit (50.000'er ₺) bölünmüştür; md. 81 orantılı (nispi tek başına
        satış fiyatına göre) dağıtım öngörür.
      E: İndirimin tamamı makineye yüklenmiştir (900.000 − 200.000); bu, indirimin yalnızca makineye ait olduğuna
