- id: SMMM-STD-TFR-0001
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TMS 8 — muhasebe tahminindeki değişiklik, muhasebe politikası değişikliği ve geçmiş dönem hatası ayrımı
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre aşağıdaki
    durumlardan hangileri muhasebe tahminindeki değişiklik olarak ele alınır ve etkisi ileriye yönelik olarak finansal
    tablolara yansıtılır?

    I. Gerçeğe uygun değerle ölçülen bir varlığın değerlemesinde, piyasa koşullarındaki gelişmeler nedeniyle kullanılan
    değerleme tekniğinin pazar yaklaşımından gelir yaklaşımına değiştirilmesi (değişiklik bir hatanın düzeltilmesinden
    kaynaklanmamaktadır)

    II. Bir finansal tablo kalemi için uygulanan ölçüm esasının değiştirilmesi

    III. Bir değişikliğin muhasebe politikasındaki değişiklik mi yoksa muhasebe tahminindeki değişiklik mi olduğunun
    belirlenmesinin zor olduğu durumda yapılan değişiklik

    IV. Önceki yılın finansal tabloları onaylanırken mevcut olan bilgilere rağmen, kullanımdaki bir binanın amortismanının
    gözden kaçırılarak hiç ayrılmamış olduğunun cari yılda fark edilmesi (tutar önemlidir)'
  secenekler:
    A: Yalnız III
    B: I ve III
    C: II ve IV
    D: I, II ve III
    E: I, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'I: TMS 8 par. 32A''ya göre ölçüm teknikleri, gerçeğe uygun değerin ölçülmesinde kullanılan değerleme
      tekniklerini de içerir; par. 34A''ya göre bir ölçüm tekniğindeki değişikliğin muhasebe tahmini üzerindeki
      etkileri, önceki dönem hatalarının düzeltilmesinden kaynaklanmadıkça muhasebe tahminlerindeki değişiklik olarak
      ele alınır. III: par. 35''e göre bir değişikliğin politika değişikliği mi tahmin değişikliği mi olduğunun
      belirlenmesi zor olduğunda söz konusu değişiklik muhasebe tahminindeki değişiklik olarak kabul edilir. Tahmin
      değişikliklerinin etkisi par. 36 uyarınca ileriye yönelik yansıtılır. II ise par. 35 uyarınca muhasebe politikasındaki
      değişikliktir; IV, par. 5''teki tanım gereği (gözden kaçırma) geçmiş dönem hatasıdır ve par. 42 uyarınca geriye
      dönük düzeltilir. Kullanılan teknikler: (1) yakın kavram ayrımı — ''ölçüm tekniği'' (tahmin) ile ''ölçüm esası''
      (politika), tahmin değişikliği ile hata; (2) madde birleştirme — 2021 değişikliğiyle eklenen par. 32A ve 34A
      ile par. 35, 36, 5 ve 42; (3) istisna — par. 34A''daki ''önceki dönem hatalarının düzeltilmesinden kaynaklanmadıkça''
      kaydı ve par. 35''teki belirsizlik karinesi. Tuzak, I''deki teknik değişikliğini II''deki ölçüm esası değişikliğiyle
      aynı sanıp politika değişikliği saymak (A) ya da ''ölçüm'' kelimesi geçtiği için II''yi de tahmin değişikliği
      saymaktır (D).'
    celdiriciler:
      A: 'I de tahmin değişikliğidir: par. 34A''ya göre ölçüm (değerleme) tekniğindeki değişiklik, hata düzeltmesinden
        kaynaklanmadıkça muhasebe tahminindeki değişikliktir; ölçüm esası değişikliğiyle (II) karıştırılmamalıdır.'
      C: II par. 35'e göre muhasebe politikasındaki değişiklik, IV ise geçmiş dönem hatasıdır; ikisi de tahmin değişikliği
        değildir.
      D: II, uygulanan ölçüm esasındaki değişiklik olduğundan par. 35 uyarınca muhasebe politikası değişikliğidir;
        ölçüm tekniğindeki değişiklikten (I) farklıdır.
      E: IV, mevcut güvenilir bilginin gözden kaçırılmasından kaynaklanan geçmiş dönem hatasıdır; par. 42 uyarınca
        geriye dönük düzeltilir, ileriye yönelik yansıtılmaz.
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 32A, 34A
    alinti: 32A Bir muhasebe tahmininde bulunmak amacıyla işletme, ölçüm tekniklerini ve girdileri kullanır. Ölçüm
      teknikleri; tahmin teknikleri [...] ile değerleme tekniklerini (örneğin, TFRS 13 uygulanarak bir varlığın
      ya da yükümlülüğün gerçeğe uygun değerinin ölçülmesi amacıyla kullanılan teknikler) içerir. [...] 34A Bir
      girdi ya da ölçüm tekniğindeki değişikliğin muhasebe tahmini üzerindeki etkileri de -önceki dönem hatalarının
      düzeltilmesinden kaynaklanmadıkça- muhasebe tahminlerindeki değişiklik olarak ele alınır.
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 35
    alinti: Uygulanan ölçüm esasında yapılan bir değişiklik, muhasebe tahminindeki bir değişiklik değil, muhasebe
      politikasındaki bir değişikliktir. Bir değişikliğin muhasebe politikasındaki bir değişiklik mi yoksa muhasebe
      tahminindeki bir değişiklik mi olduğunun belirlenmesi zor olduğunda söz konusu değişiklik, muhasebe tahminindeki
      bir değişiklik olarak kabul edilir.
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 36
    alinti: 37’nci paragrafın uygulandığı değişiklikler dışında kalan muhasebe tahminindeki bir değişikliğin etkisi,
      aşağıda belirtilen dönemlerin kâr veya zararına dâhil edilmek suretiyle, ileriye yönelik olarak finansal tablolara
      yansıtılır
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 5 (Geçmiş dönem hataları)
    alinti: 'Geçmiş dönem hataları: Geçmiş dönem veya dönemlere ait finansal tablolarda, aşağıdaki niteliklere sahip
      güvenilir bilginin kullanılmaması ya da yanlış kullanılmasından kaynaklanan eksiklik veya yanlışlıklardır:
      (a) Geçmiş dönem veya dönemlere ait finansal tabloların yayımlanması için onaylandığı tarihte mevcut olan
      ve (b) ... Bu tür hatalar; matematiksel hataların, muhasebe politikalarının uygulanmasında yapılan hataların,
      olayların yanlış yorumlanmasının veya gözden kaçırılmasının ve hilelerin etkilerini içerir.'
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 42
    alinti: 43'üncü paragraf hükümleri saklı kalmak kaydıyla, işletme önemli geçmiş dönem hatalarını, bu hatalar
      tespit edildikten sonra yayımlanması için onaylanan ilk finansal tablolarında geriye dönük olarak düzeltir.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) dogru_neden''deki üçüncü teknik adı ''istisna'' §7 listesinde yok (§7''de ''istisnanın istisnası''
          var); ''madde birleştirme'' ve ''yakın kavram ayrımı'' zaten 3 düzeyini taşıyor. I (par. 32A/34A) ve III
          (par. 35) tahmin değişikliği, II politika, IV hata; tek cevap B. | Öneri: (küçük) ''(3) istisna'' yerine
          §7 terimi kullanılabilir veya çıkarılabilir.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 3)
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: kolay öncül I (yararlı ömür tahmini) yerine 2021 değişikliğiyle eklenen TMS 8 par.
      32A/34A''ya dayanan ''değerleme tekniğinin değiştirilmesi'' öncülü kondu (ölçüm tekniği = tahmin, ölçüm esası
      = politika ayrımı); A şıkkı ''Yalnız III'' yapıldı (doğru şık yine B: I ve III); atıflar ''md.'' yerine ''par.'';
      dogru_neden teknikleri ve tuzağı adlandırıyor; kaynaklara par. 32A, 34A ve 36 eklendi, par. 38 çıkarıldı;
      baslangic 2023-01-01 (par. 32A/34A''nın uygulanma tarihi).'
    neden: 'GZ: zor etiketli ama ortalama aday rahat çözdü (güven 4) → zorlaştır; G5/G6 (küçük): ''md.'' yerine
      ''paragraf''; baslangic üretim tarihiydi.'
- id: SMMM-STD-TFR-0002
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TMS 36 — geri kazanılabilir tutar ve değer düşüklüğü zararının hesaplanması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: TMS 36 Varlıklarda Değer Düşüklüğü Standardını uygulayan K A.Ş.'nin maliyet modeliyle izlediği bir makinesinin
    raporlama dönemi sonundaki defter değeri 500.000 ₺'dir. Makinenin gerçeğe uygun değeri 470.000 ₺, makinenin
    elden çıkarılmasıyla doğrudan ilgili maliyetler 20.000 ₺, makineden elde edilmesi beklenen gelecekteki nakit
    akışlarının bugünkü değeri ise 430.000 ₺'dir. Buna göre makine için finansal tablolara alınacak değer düşüklüğü
    zararı kaç ₺'dir?
  secenekler:
    A: 20.000 ₺
    B: 30.000 ₺
    C: 50.000 ₺
    D: 70.000 ₺
    E: 450.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'TMS 36 par. 6 ve 18''e göre geri kazanılabilir tutar, satış maliyetleri düşülmüş gerçeğe uygun
      değer (470.000 − 20.000 = 450.000 ₺) ile kullanım değerinden (430.000 ₺) yüksek olanıdır: 450.000 ₺. par.
      59''a göre defter değeri geri kazanılabilir tutardan yüksek olduğundan defter değeri bu tutara indirgenir;
      değer düşüklüğü zararı 500.000 − 450.000 = 50.000 ₺''dir.'
    hesap_adimlari:
    - 'Satış maliyetleri düşülmüş gerçeğe uygun değer: 470.000 − 20.000 = 450.000 ₺'
    - 'Kullanım değeri: 430.000 ₺'
    - Geri kazanılabilir tutar = yüksek olanı = 450.000 ₺
    - 'Değer düşüklüğü zararı: 500.000 − 450.000 = 50.000 ₺'
    celdiriciler:
      A: 20.000 ₺ yalnızca elden çıkarma maliyetleridir; değer düşüklüğü zararı defter değeri ile geri kazanılabilir
        tutar arasındaki farktır.
      B: Elden çıkarma maliyetleri düşülmeden gerçeğe uygun değer (470.000 ₺) geri kazanılabilir tutar sayılmıştır
        (500.000 − 470.000).
      D: Geri kazanılabilir tutar olarak iki ölçüden düşük olan kullanım değeri (430.000 ₺) alınmıştır; Standart
        yüksek olanın alınmasını öngörür.
      E: 450.000 ₺ geri kazanılabilir tutardır; değer düşüklüğü zararı defter değerinin bu tutarı aşan kısmıdır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 6 (tanımlar)
    alinti: 'Değer düşüklüğü zararı: Bir varlığın veya nakit yaratan birimin defter değerinin geri kazanılabilir
      tutarı aşan kısmını ifade eder. Geri kazanılabilir tutar: Bir varlığın veya nakit yaratan birimin, satış maliyetleri
      düşülmüş gerçeğe uygun değeri ile kullanım değerinden yüksek olanıdır. ... Kullanım değeri: Bir varlık veya
      nakit yaratan birimden elde edilmesi beklenen gelecekteki nakit akışlarının bugünkü değeridir.'
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 59
    alinti: Sadece ve sadece, bir varlığın geri kazanılabilir tutarının defter değerinden düşük olması durumunda,
      söz konusu varlığın defter değeri geri kazanılabilir tutarına indirgenir. Anılan indirgeme, bir değer düşüklüğü
      zararıdır.
  dogrulama:
    python: 'defter_degeri = 500000

      satis_maliyeti_dusulmus_gud = 470000 - 20000

      kullanim_degeri = 430000

      geri_kazanilabilir = max(satis_maliyeti_dusulmus_gud, kullanim_degeri)

      sonuc = max(defter_degeri - geri_kazanilabilir, 0)

      '
  gecerlilik:
    baslangic: '2017-12-19'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: C (güven 5); B: C (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
        not: (küçük) dogru_neden par. 18'e atıf yapıyor; kaynaklarda yalnız par. 6 ve 59 var (içerik par. 6 tanımıyla
          destekleniyor).
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic TMS 36'nın son güncellemesine (RG 19/12/2017)
      çekildi.
    neden: Terim tutarlılığı (TFR-0001/0003 G5/G6 notu); baslangic soru üretim tarihiydi.
- id: SMMM-STD-TFR-0003
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TMS 23 — özel amaçlı borçlanmada aktifleştirme dönemi ve aktifleştirilecek borçlanma maliyeti
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: M A.Ş., yalnızca bir fabrika binası (özellikli varlık) inşa etmek amacıyla 1 Ocak 2026'da yıllık %24 basit
    faizli 2.000.000 ₺ banka kredisi kullanmıştır. Arsa üzerinde 1 Nisan 2026'ya kadar hiçbir çalışma yapılmamış;
    bu tarihte inşaat izni işlemlerine başlanmış ve ilk inşaat harcaması yapılmıştır. Binanın fiziki inşası 30 Eylül
    2026'da esas itibarıyla tamamlanmış, kullanıcı birimlerin talebine bağlı küçük dekorasyon işleri ise Aralık
    2026 sonuna kadar sürmüştür. Kredinin henüz harcanmayan kısmının Nisan–Eylül 2026 döneminde geçici olarak nemalandırılmasından
    30.000 ₺ gelir elde edilmiştir. TMS 23 Borçlanma Maliyetleri Standardına göre 2026 yılında bina maliyetine eklenecek
    (aktifleştirilecek) borçlanma maliyeti kaç ₺'dir?
  secenekler:
    A: 480.000 ₺
    B: 450.000 ₺
    C: 330.000 ₺
    D: 240.000 ₺
    E: 210.000 ₺
  dogru: E
  aciklama:
    dogru_neden: 'TMS 23 par. 17''ye göre aktifleştirme; harcama yapıldığında, borçlanma maliyeti oluştuğunda ve
      varlığın hazır hale getirilmesi için gerekli işlemlere başlandığında başlar. par. 19''a göre gerekli işlemler
      inşaattan önceki, gerekli izinlerin alınması gibi teknik ve idari faaliyetleri de içerir; ancak herhangi bir
      gelişme olmaksızın arsanın elde tutulması sırasındaki borçlanma maliyetleri aktifleştirilemez. İzin işlemlerine
      başlanıp ilk harcamanın yapıldığı tarih olan 1 Nisan 2026 başlangıçtır. par. 22–23''e göre fiziki inşanın
      tamamlanmasıyla (dekorasyon gibi küçük işler devam etse de) aktifleştirme sona erer: 30 Eylül 2026. Aktifleştirme
      dönemi 6 aydır. Aylık faiz 2.000.000 × %24 / 12 = 40.000 ₺; 6 aylık faiz 240.000 ₺. par. 12''ye göre geçici
      nemalandırma geliri düşülür: 240.000 − 30.000 = 210.000 ₺. Kullanılan teknikler: (1) çok adımlı hesap; (2)
      tarih/süre hesabı — başlangıç ve bitiş tarihlerinin Standarda göre belirlenmesi; (3) tipik hata çeldiricileri.
      Tuzak, dekorasyon işleri nedeniyle aktifleştirmenin Aralık sonuna kadar sürdürülmesi ve kredinin kullanıldığı
      Ocak ayından başlatılmasıdır.'
    hesap_adimlari:
    - 'Aktifleştirme başlangıcı: 1 Nisan 2026 (harcama + gerekli işlemlerin başlaması; par. 17, 19)'
    - 'Aktifleştirme sonu: 30 Eylül 2026 (fiziki inşa esas itibarıyla tamamlandı; par. 22–23)'
    - 'Süre: Nisan–Eylül = 6 ay'
    - 'Faiz: 2.000.000 × 0,24 × 6/12 = 240.000 ₺'
    - 'Nemalandırma geliri düşülür: 240.000 − 30.000 = 210.000 ₺'
    celdiriciler:
      A: Yıllık faizin tamamı gelir düşülmeden aktifleştirilmiştir; hem dönem sınırları hem par. 12 göz ardı edilmiştir.
      B: Aktifleştirme kredinin kullanıldığı 1 Ocak'tan yıl sonuna kadar yapılmıştır (480.000 − 30.000); oysa işlem
        başlamadan arsanın elde tutulduğu dönemde ve inşa tamamlandıktan sonra aktifleştirme yapılmaz.
      C: Aktifleştirme dekorasyon işleri nedeniyle Aralık sonuna kadar (9 ay) sürdürülmüştür (360.000 − 30.000);
        par. 23'e göre küçük dekorasyon işleri tüm işlemlerin esas itibarıyla tamamlanmadığı anlamına gelmez.
      D: 6 aylık faiz doğru hesaplanmış ancak par. 12 uyarınca düşülmesi gereken 30.000 ₺ geçici nemalandırma geliri
        düşülmemiştir.
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 12
    alinti: Bir işletme bir özellikli varlığın edinilmesi amacıyla özellikle borçlanmış ise, bu durumda aktifleştirilecek
      borçlanma maliyeti tutarı; ilgili dönem boyunca söz konusu borçlanmaya ilişkin oluşan borçlanma maliyetlerinden,
      söz konusu fonların geçici olarak nemalandırılması ile sağlanan gelirlerin düşülmesi suretiyle belirler.
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 17
    alinti: 'İşletmelerce borçlanma maliyetlerinin bir özellikli varlığın maliyetinin parçası olarak aktifleştirilmesine,
      aktifleştirme koşullarının sağlandığı tarihte başlanır. Aktifleştirmenin başlama tarihi, işletmenin aşağıdaki
      koşulların tümünü sağladığı tarihtir: (a) İşletme, varlık için harcama yaptığında; (b) Borçlanma maliyetleri
      oluştuğunda; (c) İşletme, ilgili varlığın amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli
      işlemlere başladığında.'
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 19
