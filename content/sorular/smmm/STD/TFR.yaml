- id: SMMM-STD-TFR-0004
  sinav: smmm
  bolum:
  - SGS
  ders: STD
  unite: Muhasebe Standartları
  konu: TFR
  kazanim: TFRS 15 — işlem bedelinin nispi tek başına satış fiyatlarına göre edim yükümlülüklerine dağıtılması
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: P A.Ş., bir müşterisine bir makine ile iki yıllık bakım hizmetini birlikte 900.000 ₺ karşılığında satmıştır.
    Makine ve bakım hizmeti iki ayrı edim yükümlülüğüdür. P A.Ş.'nin bu mal ve hizmeti benzer müşterilere ayrı ayrı
    sattığı fiyatlar makine için 800.000 ₺, bakım hizmeti için 200.000 ₺'dir. İndirimin edim yükümlülüklerinden
    yalnızca birine ilişkin olduğuna dair gözlemlenebilir bir gösterge bulunmamaktadır. TFRS 15 Müşteri Sözleşmelerinden
    Hasılat Standardına göre işlem bedelinden makineye dağıtılacak tutar kaç ₺'dir?
  secenekler:
    A: 900.000 ₺
    B: 800.000 ₺
    C: 750.000 ₺
    D: 720.000 ₺
    E: 700.000 ₺
  dogru: D
  aciklama:
    dogru_neden: TFRS 15 par. 74 ve 76'ya göre işlem bedeli, edim yükümlülüklerine nispi tek başına satış fiyatı
      esasına göre dağıtılır. par. 81'e göre indirimin yalnızca bir edim yükümlülüğüne ait olduğuna dair gözlemlenebilir
      gösterge yoksa indirim tüm edim yükümlülüklerine orantılı dağıtılır. Tek başına satış fiyatları toplamı 1.000.000
      ₺'dir; makinenin payı 800.000 / 1.000.000 = %80. Makineye dağıtılacak tutar 900.000 × %80 = 720.000 ₺'dir.
    hesap_adimlari:
    - 'Tek başına satış fiyatları toplamı: 800.000 + 200.000 = 1.000.000 ₺'
    - 'Makinenin nispi payı: 800.000 / 1.000.000 = %80'
    - 'Makineye dağıtılan işlem bedeli: 900.000 × 0,80 = 720.000 ₺'
    celdiriciler:
      A: Sözleşme bedelinin tamamı makineye verilmiştir; iki ayrı edim yükümlülüğü olduğundan bedel dağıtılmalıdır.
      B: Makinenin tek başına satış fiyatı doğrudan alınmıştır; 100.000 ₺ indirim par. 81 uyarınca orantılı dağıtılmalıdır.
      C: 100.000 ₺ indirim iki edim yükümlülüğüne eşit (50.000'er ₺) bölünmüştür; par. 81 orantılı (nispi tek başına
        satış fiyatına göre) dağıtım öngörür.
      E: İndirimin tamamı makineye yüklenmiştir (900.000 − 200.000); bu, indirimin yalnızca makineye ait olduğuna
        dair gözlemlenebilir gösterge bulunmasını gerektirir, olayda böyle bir gösterge yoktur.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 76
    alinti: İşletme, işlem bedelinin her bir edim yükümlülüğüne dağıtımını nispi tek başına satış fiyatı esasına
      göre yapmak için, sözleşmedeki her bir edim yükümlülüğü kapsamındaki farklı mal veya hizmetin sözleşme başlangıcındaki
      tek başına satış fiyatını tespit eder ve işlem bedelini bu tek başına satış fiyatlarına orantılı olarak dağıtır.
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 81
    alinti: Sözleşmede taahhüt edilen mal veya hizmetlerin tek başına satış fiyatları toplamının sözleşmede bunlar
      için taahhüt edilen bedeli aşması durumunda, müşteri bir mal veya hizmet paketi satın alması karşılığında
      indirim almış demektir. İndirimin sözleşmede düzenlenen edim yükümlülüklerinin tamamına değil yalnızca bir
      veya birkaçına ilişkin olduğuna dair 82'nci paragraf uyarınca gözlemlenebilir göstergelerin bulunduğu durumlar
      haricinde, işletme, indirimi sözleşmedeki tüm edim yükümlülüklerine orantılı bir şekilde dağıtır.
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 77
    alinti: Tek başına satış fiyatı, işletmenin taahhüt ettiği bir mal veya hizmeti müşteriye ayrı olarak satmış
      olması durumunda talep edeceği fiyattır.
  dogrulama:
    python: 'islem_bedeli = 900000

      makine_tbsf = 800000

      bakim_tbsf = 200000

      sonuc = islem_bedeli * makine_tbsf / (makine_tbsf + bakim_tbsf)

      '
