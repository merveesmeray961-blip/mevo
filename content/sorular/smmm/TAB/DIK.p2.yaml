      B: Önemli etki yoksa üçüncü tablo yükümlülüğü doğmaz; 'dipnotsuz sunma' bir yükümlülük seçeneği değildir.
      C: Sınıflandırma değişikliği karşılaştırmalı bilgiyi sunma yükümlülüğünü kaldırmaz.
      D: Üçüncü tablo için yeniden sınıflandırmanın önceki dönem başındaki bilgiler üzerinde önemli etkisi de aranır.
      E: Asgari karşılaştırmalı bilgi gereği en az iki finansal durum tablosu sunulur.
