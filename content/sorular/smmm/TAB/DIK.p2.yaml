    | Ticari Borçlar | 120 | 150 | 200 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 30 | 30 | 60 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **250** | **300** | **400** |

    | Uzun Vadeli Mali Borçlar | 250 | 250 | 250 |

    | Ödenmiş Sermaye | 400 | 400 | 400 |

    | Geçmiş Yıllar Kârları | 60 | 90 | 120 |

    | Dönem Net Kârı | 40 | 60 | 80 |

    | **Özkaynaklar** | **500** | **550** | **600** |

    | **Toplam Pasif** | **1.000** | **1.100** | **1.250** |

    | **GELİR TABLOSU** |  |  |  |

