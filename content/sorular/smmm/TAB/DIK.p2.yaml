    NB A.Ş. için yapılan 2027 tahmininde net satışların 2026 yılına göre %20 artacağı, satışların maliyetinin net satışlara
    oranının (dikey yüzde) 2026 yılındaki düzeyinde kalacağı ve faaliyet giderlerinin net satışlara oranının 2026 yılına göre
    2 yüzde puan azalacağı öngörülmektedir. Bu tahminlere göre 2027 yılı faaliyet kârı kaç bin ₺ olur?'
  secenekler:
    A: 180,00
    B: 183,60
    C: 210,00
    D: 216,00
    E: 230,40
  dogru: D
  aciklama:
    dogru_neden: '2027 net satışları 1.500 × 1,20 = 1.800 bin ₺''dır. 2026''da satışların maliyeti oranı 1.200 / 1.500 = %80,
      faaliyet giderleri oranı 150 / 1.500 = %10''dur. Faaliyet giderleri oranı 2 yüzde puan azalarak %8 olur. Faaliyet kârının
      net satışlara oranı 100 − 80 − 8 = %12''dir; faaliyet kârı 1.800 × %12 = 216 bin ₺. Püf noktaları: Soruda bilanço verileri
      çözüme etkisizdir. "2 yüzde puan" azalış, oranın kendisinden 2 puan çıkarılması demektir (10 → 8); oranın %2''si kadar
      azalış (10 × 0,98 = 9,8) değildir. Oranlar sabit tutulduğunda tutarlar net satışlarla birlikte büyür; 2026 faaliyet
      gideri tutarını (150) sabit bırakmak yanlıştır. Dikey yüzdelerin bazı da brüt satışlar değil net satışlardır.'
    hesap_adimlari:
    - '2027 net satışları: 1.500 × 1,20 = 1.800'
    - 'Satışların maliyeti oranı: 1.200 / 1.500 = %80'
    - 'Faaliyet giderleri oranı: 150 / 1.500 = %10 → 2 puan azalış → %8'
    - 'Faaliyet kârı oranı: 100 − 80 − 8 = %12'
    - 'Faaliyet kârı: 1.800 × 0,12 = 216'
    celdiriciler:
      A: 180,00, faaliyet giderleri oranının azalışı yok sayılıp %10 olarak bırakıldığında bulunur (1.800 × %10).
      B: 183,60, 2 yüzde puanlık azalış yerine oranın %2'si kadar azalış alındığında bulunur (gider oranı 10 × 0,98 = %9,8;
        1.800 × %10,2).
      C: 210,00, faaliyet giderleri tutarı sabit 150 bin ₺ bırakıldığında bulunur (1.800 × %20 − 150); oran sabit tutulacağı
        için gider de büyür.
      E: 230,40, baz olarak brüt satışlar (1.600 × 1,20 = 1.920) alındığında bulunur (1.920 × %12); dikey analizde baz net
        satışlardır.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'Dikey analiz: gelir tablosu kalemi / Net satışlar × 100'
    alinti: ''
  dogrulama:
    python: 'ns = 1500 * 120 / 100

      smm_oran = 1200 / 1500

      gider_oran = 150 / 1500 - 0.02

      sonuc = round(ns * (1 - smm_oran - gider_oran), 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 2
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: Püf noktasındaki 'Baz yıl da brüt satışlar değil net satışlardır' cümlesi 'Dikey yüzdelerin bazı da brüt satışlar
      değil net satışlardır' olarak düzeltildi.
    neden: 'hakem 2026-10-04: ''baz yıl'' yatay/trend analizine ait kavramdır; burada kastedilen dikey analizin baz kalemidir.'
  - tarih: '2026-10-04'
