  secenekler:
    A: '%5'
    B: '%20'
    C: '%25'
    D: '%44'
    E: '%144'
  dogru: D
  aciklama:
    dogru_neden: 'Brüt satış kârı 2025''te 500.000 ₺, 2026''da 720.000 ₺''dir. Yatay analizde değişim önceki dönem bazlıdır:
      (720.000 - 500.000) / 500.000 × 100 = %44. Püf noktaları: Dikey yüzdeyi önce TL''ye çevir; sonra iki yılın kâr tutarlarını
      yatay analizle karşılaştır. Satış artışı ya da marj farkı tek başına kâr artışını vermez.'
    celdiriciler:
      A: Dikey yüzdeler arasındaki puan farkı alınmıştır; brüt kârın TL cinsinden yüzde artışı sorulmaktadır.
      B: Bu oran net satışlardaki artıştır; brüt satış kârı yüzdesindeki değişim de etkili olduğundan kâr artışı farklıdır.
      C: Satış artışı ile marj farkı toplanmıştır; kâr tutarları bulunup oranlanmalıdır.
      E: Cari kâr önceki kâra oranlanmış, 100 çıkarılmamıştır; bu değer artış yüzdesi değil, oranın kendisidir.
    hesap_adimlari:
    - 2025 brüt satış kârı = 2.000.000 × %25 = 500.000 ₺
    - 2026 brüt satış kârı = 2.400.000 × %30 = 720.000 ₺
    - Yüzde değişim = (720.000 - 500.000) / 500.000 × 100 = %44
