        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): D (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 216 doğrulandı (1.800 × [1 − 0,80 − 0,08]); çeldiriciler 180/183,6/210/230,4 doğru. '2 yüzde puan azalacağı'
          ifadesi tek anlamlı (10 → 8); oranın %2'si yorumu B çeldiricisi olarak açıkça ayrışıyor.
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Gelir tablosu dikey analizi formülü açıklamada açık; dogrulama.python 216 ile aynı.
