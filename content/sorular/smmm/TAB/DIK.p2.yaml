    alinti: BRÜT SATIŞ KÂRI VEYA ZARARI D. FAALİYET GİDERLERİ (-) 1. ARAŞTIRMA VE GELİŞTİRME GİDERLERİ (-) 2. PAZARLAMA, SATIŞ
