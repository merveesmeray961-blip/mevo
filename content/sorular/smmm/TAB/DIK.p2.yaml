  kok: Pusula Yazılım A.Ş.'nin bilançosunda maddi duran varlıklar kalemi 500.000 ₺ olup dikey yüzdesi %10'dur. Aynı bilançoda
    stoklar kaleminin dikey yüzdesi %45 olduğuna göre stoklar kaç TL'dir?
