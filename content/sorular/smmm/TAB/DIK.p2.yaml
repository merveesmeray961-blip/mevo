    - Brüt satış kârı = 1.600.000 - 1.000.000 = 600.000 ₺
    - Faaliyet kârı = 600.000 - 240.000 = 360.000 ₺
    - Dikey yüzde = 360.000 / 1.600.000 × 100 = %22,5
