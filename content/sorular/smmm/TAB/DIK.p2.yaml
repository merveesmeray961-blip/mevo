    |---|---:|

    | Brüt satışlar | 1.664.000 |

    | Satış indirimleri (-) | 64.000 |

    | Satışların maliyeti (-) | 1.000.000 |

    | Faaliyet giderleri (-) | 240.000 |

    | Faiz gelirleri | 32.000 |

    | Finansman giderleri (-) | 64.000 |


