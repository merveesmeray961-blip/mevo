      C: Satış indirimleri dikkate alınmadan brüt satışlardan maliyet ve gider düşülmüş, kâr net satışlara oranlanmıştır.
      D: Faaliyet giderleri düşülmemiş, brüt satış kârı yüzdesi bulunmuştur.
