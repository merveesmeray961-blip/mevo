  kok: 'Aşağıda Pınar Un Mamulleri A.Ş.''nin 2024-2026 dönemine ait gelir tablosu kalemleri verilmiştir.


    | Kalem (₺) | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | Brüt satışlar | 1.560.000 | 1.989.000 | 3.060.000 |

    | Satış indirimleri (-) | 60.000 | 39.000 | 60.000 |

    | Satışların maliyeti (-) | 1.050.000 | 1.170.000 | 1.875.000 |

    | Faaliyet giderleri (-) | 150.000 | 156.000 | 300.000 |


    Trend yüzdesi yönteminde 2024 baz (100) kabul edildiğinde 2026 yılı brüt satış kârı için hesaplanacak endeks aşağıdakilerden
    hangisidir?'
  secenekler:
    A: '25'
    B: 178,57
    C: '200'
    D: 232,35
    E: '250'
  dogru: E
  aciklama:
    dogru_neden: 'Brüt satış kârı = net satışlar - satışların maliyeti''dir. 2024''te 450.000 ₺, 2026''da 1.125.000 ₺ bulunur.
      Trend yüzdesi = 1.125.000 / 450.000 × 100 = 250. Püf noktaları: Önce her yıl için net satışlara, sonra brüt satış kârına
      ulaş. 2025 sütunu ve faaliyet giderleri bu soruda gereksizdir; endeks baz yıla (2024) göre hesaplanır.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
      B: Satışların maliyetinin endeksi hesaplanmıştır; kâr kalemi değildir.
      C: Net satışların endeksi hesaplanmıştır; sorulan brüt satış kârının endeksidir.
      D: Satış indirimleri dikkate alınmadan brüt satışlardan maliyet düşülerek kâr bulunmuştur; brüt satış kârı net satışlardan
        hesaplanır.
    hesap_adimlari:
    - 2024 net satışlar = 1.560.000 - 60.000 = 1.500.000; brüt satış kârı = 1.500.000 - 1.050.000 = 450.000 ₺
    - 2026 net satışlar = 3.060.000 - 60.000 = 3.000.000; brüt satış kârı = 3.000.000 - 1.875.000 = 1.125.000 ₺
    - Trend yüzdesi = 1.125.000 / 450.000 × 100 = 250
