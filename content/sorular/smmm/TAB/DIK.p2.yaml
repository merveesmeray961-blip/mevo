    A: 225.000 ₺
    B: 675.000 ₺
    C: 1.111.111 ₺
    D: 2.250.000 ₺
    E: 22.500.000 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Önce toplam bulunur: 500.000 × 100 / 10 = 5.000.000 ₺. Sonra aranan kaleme kendi yüzdesi uygulanır: 5.000.000
      × %45 = 2.250.000 ₺.'
    celdiriciler:
      A: Bilinen kalemin tutarı aranan kalemin yüzdesiyle çarpılmıştır; yüzde toplam tutara uygulanmalıdır.
      B: Yüzdeler arasındaki fark bilinen tutara uygulanmış, kalemler arasında toplamsal ilişki varmış gibi davranılmıştır.
      C: Bilinen tutar aranan yüzdeye bölünmüştür; toplam bulunduktan sonra yüzde çarpma ile uygulanır.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Toplam = 500.000 × 100 / 10 = 5.000.000 ₺
    - Stoklar = 5.000.000 × %45 = 2.250.000 ₺
