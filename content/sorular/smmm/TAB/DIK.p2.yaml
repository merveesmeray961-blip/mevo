- id: SMMM-TAB-DIK-0056
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Dikey
  konu: DIK
  kazanim: dikey yüzdeler
  tip: hesaplama
  zorluk: 3
  kok: 'Polat Boru A.Ş.''nin 2026 yılı net satışları 2.000.000 ₺''dir ve gelir tablosunun dikey yüzdeleri aşağıdaki gibidir.


    | Kalem (2026) | Dikey yüzde |

    |---|---:|

    | Net satışlar | %100 |

    | Satışların maliyeti | %70 |

    | Faaliyet giderleri | %10 |


    İşletme 2027 yılında net satışlarının %10 artacağını ve dikey yüzdelerin aynen korunacağını öngörmektedir. Bu varsayıma
    göre 2027 faaliyet kârı kaç TL olur?'
  secenekler:
    A: 44.000 ₺
    B: 440.000 ₺
    C: 600.000 ₺
    D: 660.000 ₺
    E: 4.400.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Dikey yüzdeler sabit kalacağından faaliyet kâr yüzdesi %20''dir. 2027 net satışları 2.200.000 ₺ olduğundan
      faaliyet kârı 2.200.000 × %20 = 440.000 ₺ olur. Püf noktaları: Önce yeni dönemin net satışlarını bul, sonra faaliyet
      kâr yüzdesini (100 - maliyet - gider) tüm yeni satış tutarına uygula. Artış tutarına uygulamak ya da eski satışlarla
      hesaplamak tipik hatadır.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
      C: 2026 faaliyet kârına satış artışının tamamı eklenmiştir; artan satışın yalnızca faaliyet kârı yüzdesi kadarı kâra
        yansır.
      D: Faaliyet giderleri düşülmemiştir; bu tutar 2027 brüt satış kârıdır.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - 2027 net satışları = 2.000.000 × 1,1 = 2.200.000 ₺
    - Faaliyet kâr yüzdesi = 100 - 70 - 10 = %20
    - 2027 faaliyet kârı = 2.200.000 × %20 = 440.000 ₺
  kaynaklar:
