  kok: 'Aşağıda Mercan Turizm A.Ş.''nin 2026 dönemine ait gelir tablosu kalemleri yer almaktadır.


    | Kalem | 2026 (₺) |

    |---|---:|

    | Brüt satışlar | 2.625.000 |

    | Satış indirimleri (-) | 125.000 |

    | Satışların maliyeti (-) | 1.562.500 |

    | Faaliyet giderleri (-) | 437.500 |

    | Faiz gelirleri | 50.000 |

    | Finansman giderleri (-) | 75.000 |


    Bu verilere göre faaliyet kârı için hesaplanacak dikey yüzde aşağıdakilerden hangisidir?'
  secenekler:
    A: '%2'
    B: '%19'
    C: '%19,05'
    D: '%20'
    E: '%25'
  dogru: D
  aciklama:
    dogru_neden: 'Faaliyet kârı = net satışlar - satışların maliyeti - faaliyet giderleri = 500.000 ₺''dir. Faiz geliri ve
      finansman gideri faaliyet kârından sonraki bölümlerde yer alır. Baz net satışlardır: 500.000 / 2.500.000 × 100 = %20.
      Püf noktaları: Önce net satışlara ulaş; tabloda yer alan faiz geliri ve finansman gideri faaliyet kârını etkilemez,
      bunlar gereksiz veridir. Payda brüt satışlar değil net satışlardır.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır.
      B: Faiz geliri ve finansman gideri de hesaba katılmıştır; bunlar faaliyet kârından sonraki bölümde yer alır.
      C: Faaliyet kârı brüt satışlara bölünmüştür; gelir tablosunda baz net satışlardır.
      E: Satış indirimleri dikkate alınmadan brüt satışlardan maliyet ve gider düşülmüş, kâr net satışlara oranlanmıştır.
    hesap_adimlari:
    - Net satışlar = 2.625.000 - 125.000 = 2.500.000 ₺
    - Brüt satış kârı = 2.500.000 - 1.562.500 = 937.500 ₺
    - Faaliyet kârı = 937.500 - 437.500 = 500.000 ₺
    - Dikey yüzde = 500.000 / 2.500.000 × 100 = %20
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Gelir tablosu kalemleri (C)
    alinti: NET SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-)
      3. SATILAN HİZMET MALİYETİ (-) 4. DİĞER SATIŞLARIN MALİYETİ (-) BRÜT SATIŞ KÂRI VEYA ZARARI
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Gelir tablosu kalemleri (D)
    alinti: BRÜT SATIŞ KÂRI VEYA ZARARI D. FAALİYET GİDERLERİ (-) 1. ARAŞTIRMA VE GELİŞTİRME GİDERLERİ (-) 2. PAZARLAMA, SATIŞ
      VE DAĞITIM GİDERLERİ (-) 3. GENEL YÖNETİM GİDERLERİ (-) FAALİYET KÂRI VEYA ZARARI
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'brut = 2625000

      indirim = 125000

      maliyet = 1562500

      faaliyet_gideri = 437500

      net = brut - indirim

      sonuc = (net - maliyet - faaliyet_gideri) / net * 100'
