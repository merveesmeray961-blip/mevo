- id: SMMM-TAB-DIK-0042
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Dikey
  konu: DIK
  kazanim: dikey yüzdeler
  tip: hesaplama
  zorluk: 2
  kok: 'Mali işler birimi tarafından yapılan karşılaştırmada ilgili tutarlar ve oranlar aktarılmıştır. Aşağıda Tuna Yapı Malzemeleri
    A.Ş. için derlenen gelir tablosu özeti verilmiştir.


    | Kalem | 2026 (₺) |

    |---|---:|

    | Brüt satışlar | 1.312.500 |

    | Satış indirimleri (-) | 62.500 |

    | Satışların maliyeti (-) | 781.250 |


    Bu özete göre brüt satış kârının dikey (yüzde) oranı aşağıdakilerden hangisidir?'
  secenekler:
    A: '%37,5'
    B: '%40,48'
    C: '%59,52'
    D: '%62,5'
    E: '%375'
  dogru: A
  aciklama:
    dogru_neden: Net satışlar 1.250.000 ₺, brüt satış kârı 468.750 ₺'dir. Baz net satışlar olduğundan dikey yüzde 468.750
      / 1.250.000 × 100 = %37,5 olur.
    celdiriciler:
      B: Satış indirimleri unutulmuş ve brüt satışlar baz alınmıştır; iki hata birlikte yapılmıştır.
      C: Maliyet brüt satışlara bölünmüştür; hem baz hem de aranan kalem yanlıştır.
      D: Bu değer satışların maliyetinin dikey yüzdesidir; brüt satış kârı yüzdesi onun tümleyenidir.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Net satışlar = 1.312.500 - 62.500 = 1.250.000 ₺
    - Brüt satış kârı = 1.250.000 - 781.250 = 468.750 ₺
    - Dikey yüzde = 468.750 / 1.250.000 × 100 = %37,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Gelir tablosu kalemleri (C)
    alinti: NET SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-)
      3. SATILAN HİZMET MALİYETİ (-) 4. DİĞER SATIŞLARIN MALİYETİ (-) BRÜT SATIŞ KÂRI VEYA ZARARI
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'brut = 1312500

      indirim = 62500

      maliyet = 781250

      net = brut - indirim

      sonuc = (net - maliyet) / net * 100'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: gecti
        not: dogrulama.python doğru şıkla tuttu
        tarih: '2026-11-02'
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        not: 'denetçi: tek doğru, güncel hüküm (Kasım 2026)'
        tarih: '2026-11-02'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
