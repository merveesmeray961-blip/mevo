    C: Üçüncü tablo cari dönemin başına ait olarak düzenlenir.
    D: İki finansal durum tablosu sunulur; üçüncü tablo isteğe bağlıdır.
    E: Üç tablo sunulur; açılış tablosunun dipnotlarının sunulması gerekmez.
