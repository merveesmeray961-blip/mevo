    | Faaliyet Kârı | 100 | 120 | 150 |

    | Finansman Giderleri (-) | 50 | 45 | 50 |

    | Dönem Kârı (vergi öncesi) | 50 | 75 | 100 |

    | Vergi Karşılığı (-) | 10 | 15 | 20 |

    | Dönem Net Kârı | 40 | 60 | 80 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.


    Bilançonun dikey analizinde toplam aktif %100 kabul edildiğine göre NB A.Ş.''nin 2026 yılı ticari alacaklar
    kaleminin dikey yüzdesi kaçtır?'
  secenekler:
    A: 14,67
    B: 17,60
    C: 20,00
    D: 36,67
    E: 40,74
  dogru: B
  aciklama:
    dogru_neden: 'Bilançonun dikey analizinde her kalem toplam aktife bölünür. 2026 ticari alacakları 220 bin ₺,
      toplam aktif 1.250 bin ₺''dir: 220 / 1.250 × 100 = %17,60.'
    hesap_adimlari:
    - 'Ticari alacaklar / Toplam aktif (2026): 220 / 1.250 = 0,176'
    - 'Dikey yüzde: 0,176 × 100 = 17,60'
    celdiriciler:
      A: 14,67, baz olarak net satışlar (220 / 1.500) alındığında bulunur; net satışlar gelir tablosunun dikey analizinde
        bazdır.
      C: 20,00, baz olarak önceki yılın toplam aktifi (220 / 1.100) alındığında bulunur.
      D: 36,67, baz olarak özkaynaklar (220 / 600) alındığında bulunur.
      E: 40,74, baz olarak dönen varlıklar toplamı (220 / 540) alındığında bulunur; bu, dönen varlıklar içindeki
        paydır.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'Dikey analiz: bilanço kalemi / Toplam aktif × 100'
    alinti: ''
  dogrulama:
    python: 'sonuc = round(220 / 1250 * 100, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
- id: SMMM-TAB-DIK-0004
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: DIK
  kazanim: Gelir tablosunun dikey yüzdeleri ile tahmin (oranların sabit tutulması, yüzde puan değişimi)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  ortak_veri: TAB-SET-02
  kok: 'NB A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** |  |  |  |

    | Hazır Değerler | 40 | 50 | 80 |

    | Ticari Alacaklar | 150 | 180 | 220 |

    | Stoklar | 120 | 160 | 200 |

    | Diğer Dönen Varlıklar | 40 | 30 | 40 |

    | **Dönen Varlıklar** | **350** | **420** | **540** |

    | Maddi Duran Varlıklar (net) | 650 | 680 | 710 |

    | **Toplam Aktif** | **1.000** | **1.100** | **1.250** |

    | Kısa Vadeli Mali Borçlar | 100 | 120 | 140 |

    | Ticari Borçlar | 120 | 150 | 200 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 30 | 30 | 60 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **250** | **300** | **400** |

    | Uzun Vadeli Mali Borçlar | 250 | 250 | 250 |

    | Ödenmiş Sermaye | 400 | 400 | 400 |

    | Geçmiş Yıllar Kârları | 60 | 90 | 120 |

    | Dönem Net Kârı | 40 | 60 | 80 |

    | **Özkaynaklar** | **500** | **550** | **600** |

    | **Toplam Pasif** | **1.000** | **1.100** | **1.250** |

    | **GELİR TABLOSU** |  |  |  |

    | Brüt Satışlar | 1.050 | 1.250 | 1.600 |

    | Satış İndirimleri (-) | 50 | 50 | 100 |

    | Net Satışlar | 1.000 | 1.200 | 1.500 |

    | Satışların Maliyeti (-) | 800 | 960 | 1.200 |

    | Brüt Satış Kârı | 200 | 240 | 300 |

    | Faaliyet Giderleri (-) | 100 | 120 | 150 |

    | Faaliyet Kârı | 100 | 120 | 150 |

    | Finansman Giderleri (-) | 50 | 45 | 50 |

    | Dönem Kârı (vergi öncesi) | 50 | 75 | 100 |

    | Vergi Karşılığı (-) | 10 | 15 | 20 |

    | Dönem Net Kârı | 40 | 60 | 80 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.


    NB A.Ş. için yapılan 2027 tahmininde net satışların 2026 yılına göre %20 artacağı, satışların maliyetinin net
    satışlara oranının (dikey yüzde) 2026 yılındaki düzeyinde kalacağı ve faaliyet giderlerinin net satışlara oranının
    2026 yılına göre 2 yüzde puan azalacağı öngörülmektedir. Bu tahminlere göre 2027 yılı faaliyet kârı kaç bin
    ₺ olur?'
  secenekler:
    A: 180,00
    B: 183,60
    C: 210,00
    D: 216,00
    E: 230,40
  dogru: D
  aciklama:
    dogru_neden: '2027 net satışları 1.500 × 1,20 = 1.800 bin ₺''dir. 2026''da satışların maliyeti oranı 1.200 /
      1.500 = %80, faaliyet giderleri oranı 150 / 1.500 = %10''dur. Faaliyet giderleri oranı 2 yüzde puan azalarak
      %8 olur. Faaliyet kârının net satışlara oranı 100 − 80 − 8 = %12''dir; faaliyet kârı 1.800 × %12 = 216 bin
      ₺. Püf noktaları: Soruda bilanço verileri çözüme etkisizdir. "2 yüzde puan" azalış, oranın kendisinden 2 puan
      çıkarılması demektir (10 → 8); oranın %2''si kadar azalış (10 × 0,98 = 9,8) değildir. Oranlar sabit tutulduğunda
      tutarlar net satışlarla birlikte büyür; 2026 faaliyet gideri tutarını (150) sabit bırakmak yanlıştır. Baz
      yıl da brüt satışlar değil net satışlardır.'
    hesap_adimlari:
    - '2027 net satışları: 1.500 × 1,20 = 1.800'
    - 'Satışların maliyeti oranı: 1.200 / 1.500 = %80'
    - 'Faaliyet giderleri oranı: 150 / 1.500 = %10 → 2 puan azalış → %8'
    - 'Faaliyet kârı oranı: 100 − 80 − 8 = %12'
    - 'Faaliyet kârı: 1.800 × 0,12 = 216'
    celdiriciler:
      A: 180,00, faaliyet giderleri oranının azalışı yok sayılıp %10 olarak bırakıldığında bulunur (1.800 × %10).
      B: 183,60, 2 yüzde puanlık azalış yerine oranın %2'si kadar azalış alındığında bulunur (gider oranı 10 × 0,98
        = %9,8; 1.800 × %10,2).
      C: 210,00, faaliyet giderleri tutarı sabit 150 bin ₺ bırakıldığında bulunur (1.800 × %20 − 150); oran sabit
        tutulacağı için gider de büyür.
      E: 230,40, baz olarak brüt satışlar (1.600 × 1,20 = 1.920) alındığında bulunur (1.920 × %12); dikey analizde
        baz net satışlardır.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'Dikey analiz: gelir tablosu kalemi / Net satışlar × 100'
    alinti: ''
  dogrulama:
    python: 'ns = 1500 * 120 / 100

      smm_oran = 1200 / 1500

      gider_oran = 150 / 1500 - 0.02

      sonuc = round(ns * (1 - smm_oran - gider_oran), 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
