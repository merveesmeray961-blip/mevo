  kok: Dönem sonu kapanış çalışmaları sırasında elde edilen sonuçlar aşağıda özetlenmiştir. Hasat Tohumculuk A.Ş.'nin 2025
    gelir tablosunda satışların maliyeti net satışların %45'idir. 2026'da net satışlar bir önceki yıla göre %50, satışların
    maliyeti ise %15 artmıştır. 2026 gelir tablosunda satışların maliyetinin dikey yüzdesi kaç olur?
  secenekler:
    A: '%10'
    B: '%13,5'
    C: '%34,5'
    D: '%51,75'
    E: '%58,7'
