  kok: 'Aşağıda Cevher Madencilik A.Ş.''nin net satışları ile brüt satış kârı dikey yüzdeleri verilmiştir.


    | Kalem | 2025 | 2026 |

    |---|---:|---:|

    | Net satışlar (₺) | 2.000.000 | 2.400.000 |

    | Brüt satış kârının dikey yüzdesi | %25 | %30 |


