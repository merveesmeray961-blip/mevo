      Trend yüzdesi = 630.000 / 600.000 × 100 = 105. Püf noktaları: Önce her yıl için net satışlara, sonra brüt satış kârına
      ulaş. 2025 sütunu ve faaliyet giderleri bu soruda gereksizdir; endeks baz yıla (2024) göre hesaplanır.'
