  kok: Boran Tekstil Ltd. Şti.'nin toplam aktifi 4.000.000 ₺'dir. Bilançoda dönen varlıkların dikey yüzdesi %40, stokların
    tutarı ise 480.000 ₺'dir. Stokların dönen varlıklar grubu içindeki payı yüzde kaçtır?
  secenekler:
    A: '%3'
    B: '%12'
    C: '%30'
    D: '%40'
    E: '%300'
  dogru: C
  aciklama:
    dogru_neden: 'Önce dönen varlıklar bulunur: 4.000.000 × %40 = 1.600.000 ₺. Grup içi yüzdede baz grubun toplamıdır: 480.000
      / 1.600.000 × 100 = %30.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır.
      B: Stoklar toplam aktife bölünmüştür; soru dönen varlıklar grubu içindeki payı sormaktadır.
      D: Bu değer dönen varlıkların toplam aktif içindeki dikey yüzdesidir; stokların grup içi payı değildir.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Dönen varlıklar = 4.000.000 × %40 = 1.600.000 ₺
    - Stokların grup içi payı = 480.000 / 1.600.000 × 100 = %30
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Bilançonun biçimsel yapısı
    alinti: Varlıklar, dönen ve duran olarak adlandırılan iki grupta toplanır. Dönen varlıklar grubunda, bir yıl veya işletmenin
