    C: 20,00
    D: 36,67
    E: 40,74
  dogru: B
  aciklama:
    dogru_neden: 'Bilançonun dikey analizinde her kalem toplam aktife bölünür. 2026 ticari alacakları 220 bin ₺, toplam aktif
      1.250 bin ₺''dır: 220 / 1.250 × 100 = %17,60.'
    hesap_adimlari:
    - 'Ticari alacaklar / Toplam aktif (2026): 220 / 1.250 = 0,176'
    - 'Dikey yüzde: 0,176 × 100 = 17,60'
    celdiriciler:
      A: 14,67, baz olarak net satışlar (220 / 1.500) alındığında bulunur; net satışlar gelir tablosunun dikey analizinde
        bazdır.
      C: 20,00, baz olarak önceki yılın toplam aktifi (220 / 1.100) alındığında bulunur.
      D: 36,67, baz olarak özkaynaklar (220 / 600) alındığında bulunur.
      E: 40,74, baz olarak dönen varlıklar toplamı (220 / 540) alındığında bulunur; bu, dönen varlıklar içindeki paydır.
