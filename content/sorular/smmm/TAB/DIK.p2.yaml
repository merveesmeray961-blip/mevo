    |---|---:|---:|

    | Maddi duran varlıklar | 300.000 | 600.000 |

    | Toplam aktif | 3.000.000 | 4.000.000 |


    Yatay analizde maddi duran varlıklar kalemindeki artışın, toplam aktifteki artışın yüzde kaçını oluşturduğu hesaplanmak
    istenmektedir. Sonuç kaçtır?'
  secenekler:
    A: '%3'
    B: '%10'
    C: '%30'
    D: '%33,33'
    E: '%300'
  dogru: C
  aciklama:
    dogru_neden: 'Kalem artışı 300.000 ₺, toplam aktif artışı 1.000.000 ₺''dir. Kalem artışının toplam artıştaki payı 300.000
      / 1.000.000 × 100 = %30. Püf noktaları: İki mutlak değişimi ayrı ayrı bul ve birbirine oranla. Kalemin kendi yüzde artışı
      ya da toplam aktifin yüzde artışı sorulan oranlar değildir.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır.
      B: Kalem artışı önceki dönem toplam aktifine oranlanmıştır; bu, kalemin toplam büyümeye katkısını yüzde puan olarak
        verir, toplam artış içindeki payı vermez.
      D: Bu oran toplam aktifteki yüzde artıştır; kalemin payını göstermez.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Kalem artışı = 600.000 - 300.000 = 300.000 ₺
    - Toplam aktif artışı = 4.000.000 - 3.000.000 = 1.000.000 ₺
    - Pay = 300.000 / 1.000.000 × 100 = %30
