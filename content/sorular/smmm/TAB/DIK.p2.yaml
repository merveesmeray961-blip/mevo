  kok: Bağımsız mali müşavirin hazırladığı raporda değerlendirmeye alınan hususlar şunlardır. Demirsoy Otomotiv A.Ş.'nin ticari
    alacaklar kalemi, baz yılı 2024 olan trend analizinde 2025'te 105, 2026'da 110 trend yüzdesine ulaşmıştır. Kalemin 2024
    tutarı 400.000 ₺ olduğuna göre 2026 tutarı kaç TL'dir?
  secenekler:
    A: 40.000 ₺
    B: 363.636 ₺
    C: 420.000 ₺
    D: 440.000 ₺
    E: 44.000.000 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Trend yüzdesi = ilgili yıl / baz yıl × 100 olduğundan ilgili yıl = baz × endeks / 100''dür. 2026: 400.000
      × 110 / 100 = 440.000 ₺. 2025 endeksi bu hesapta kullanılmaz.'
    celdiriciler:
      A: Yalnızca baz yıla göre artış tutarı bulunmuştur; 2026 tutarı baz tutar ile artışın toplamıdır.
      B: Baz tutar endekse bölünmüştür; tutara ulaşmak için baz tutar endeksle çarpılır.
      C: 2025 yılının trend yüzdesi kullanılmıştır; sorulan 2026'dır.
      E: Endeks yüzde olarak 100'e bölünmeden doğrudan çarpılmıştır.
    hesap_adimlari:
    - 2026 tutarı = 400.000 × 110 / 100 = 440.000 ₺
