  kok: 'RT A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** |  |  |  |

    | Hazır Değerler | 60 | 80 | 120 |

    | Menkul Kıymetler | 20 | 20 | 40 |

    | Ticari Alacaklar | 200 | 240 | 300 |

    | Stoklar | 170 | 210 | 240 |

    | Diğer Dönen Varlıklar | 10 | 10 | 20 |

    | **Dönen Varlıklar** | **460** | **560** | **720** |

    | Maddi Duran Varlıklar (net) | 740 | 840 | 880 |

    | **Toplam Aktif** | **1.200** | **1.400** | **1.600** |

    | Kısa Vadeli Mali Borçlar | 120 | 130 | 140 |

    | Ticari Borçlar | 170 | 210 | 240 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 10 | 10 | 20 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **300** | **350** | **400** |

    | Uzun Vadeli Mali Borçlar | 300 | 350 | 400 |

    | Ödenmiş Sermaye | 400 | 400 | 400 |

    | Geçmiş Yıllar Kârları | 120 | 200 | 280 |

    | Dönem Net Kârı | 80 | 100 | 120 |

    | **Özkaynaklar** | **600** | **700** | **800** |

    | **Toplam Pasif** | **1.200** | **1.400** | **1.600** |

    | **GELİR TABLOSU** |  |  |  |

    | Brüt Satışlar | 1.260 | 1.575 | 1.890 |

    | Satış İndirimleri (-) | 60 | 75 | 90 |

    | **Net Satışlar** | **1.200** | **1.500** | **1.800** |

    | Satışların Maliyeti (-) | 900 | 1.125 | 1.350 |

    | **Brüt Satış Kârı** | **300** | **375** | **450** |

    | Faaliyet Giderleri (-) | 150 | 190 | 230 |

    | **Faaliyet Kârı** | **150** | **185** | **220** |

    | Finansman Giderleri (-) | 50 | 60 | 70 |

    | Dönem Kârı (vergi öncesi) | 100 | 125 | 150 |

    | Vergi Karşılığı (-) | 20 | 25 | 30 |

    | **Dönem Net Kârı** | **80** | **100** | **120** |


    Karşılaştırmalı (yatay) analizde bir kalemin değişim yüzdesi, (Cari yıl tutarı − Önceki yıl tutarı) / Önceki yıl tutarı
    × 100 formülüyle hesaplanmaktadır.


    Buna göre RT A.Ş.''nin ticari alacaklarındaki 2026 yılı değişimi, bir önceki yıla göre yüzde kaçtır?'
  secenekler:
    A: '%20'
    B: '%25'
    C: '%50'
    D: '%60'
    E: '%125'
  dogru: B
  aciklama:
    dogru_neden: Karşılaştırmalı analizde baz, bir önceki yıldır. Ticari alacaklar 2025'te 240, 2026'da 300 bin ₺'dir. Değişim
      yüzdesi (300 − 240) / 240 × 100 = %25'tir.
    celdiriciler:
      A: '%20, değişimin cari yıl tutarına bölünmesiyle bulunur (60 / 300); formülde payda önceki yıl tutarıdır.'
      C: '%50, bazın önceki yıl (2025) yerine 2024 yılı alınmasıyla bulunur ((300 − 200) / 200).'
      D: '%60: Değişimin mutlak tutarı (300 − 240 = 60 bin ₺) yüzde olarak okunmuştur.'
      E: '%125, cari yıl tutarının önceki yıl tutarına oranıdır (300 / 240 × 100); bu bir endeks değeridir, değişim yüzdesi
        için 100 çıkarılmalıdır.'
    hesap_adimlari:
    - 'Değişim: 300 − 240 = 60 bin ₺'
    - 'Değişim yüzdesi: 60 / 240 × 100 = %25'
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'Karşılaştırmalı analiz: Değişim % = (Cari yıl − Önceki yıl) / Önceki yıl × 100'
    alinti: ''
  dogrulama:
    python: 'sonuc = (300 - 240) / 240 * 100

