    A: '%15 ve değişim yoktur'
    B: '%15 ve 1 yüzde puanı artmıştır'
    C: '%14 ve 1 yüzde puanı azalmıştır'
    D: '%16 ve 1 yüzde puanı artmıştır'
    E: '%12 ve 3 yüzde puanı artmıştır'
  dogru: A
  aciklama:
    dogru_neden: '2026 dikey yüzde 375 / 2.500 × 100 = %15''tir. 2025''te 360 / 2.400 × 100 = %15 olduğundan değişim 0 yüzde
      puanıdır. Püf noktaları: Dikey yüzde tutarı değil, kalemin ilgili toplam içindeki payını gösterir; iki yılın tutarları
      değişse de oran aynı kalabilir.'
    celdiriciler:
      B: 2025 oranı yanlış hesaplanarak 14 kabul edilmiştir; 2025 oranı da %15'tir.
      C: 2026 oranında 375 / 2.500 işlemi %14 değildir; sonuç %15'tir.
      D: 2026 oranı %15 olduğundan 1 yüzde puanı artış yoktur.
      E: 375 / 2.500 işlemi %12 değil %15 verir.
    hesap_adimlari:
    - '2026 dikey yüzde: 375 / 2.500 × 100 = %15'
    - '2025 dikey yüzde: 360 / 2.400 × 100 = %15'
    - 'Değişim: %15 − %15 = 0 yüzde puanı'
