  kok: Bir işletmenin bilançosunda toplam aktif 2025 yılında 2.400 bin TL, ticari alacaklar 360 bin TL; 2026 yılında toplam
    aktif 2.500 bin TL, ticari alacaklar 375 bin TL'dir. Dikey analizde bilanço kalemleri toplam aktife bölünerek yüzdeye
    çevrilecek ve 2025–2026 değişimi yüzde puan olarak değerlendirilecektir. Buna göre ticari alacakların 2026 dikey yüzdesi
    ve 2025'e göre değişimi hangisidir?
