- id: SMMM-TAB-DIK-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: DIK
  kazanim: Gelir tablosunun dikey analizi (baz net satışlar)
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  ortak_veri: TAB-SET-01
  kok: 'MK A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** | | | |

    | Hazır Değerler | 60 | 70 | 100 |

    | Ticari Alacaklar | 120 | 140 | 160 |

    | Stoklar | 130 | 145 | 175 |

    | Diğer Dönen Varlıklar | 30 | 45 | 65 |

    | **Dönen Varlıklar** | **340** | **400** | **500** |

    | Maddi Duran Varlıklar (net) | 460 | 500 | 540 |

    | **Toplam Aktif** | **800** | **900** | **1.040** |

    | Kısa Vadeli Mali Borçlar | 70 | 80 | 120 |

    | Ticari Borçlar | 60 | 70 | 90 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 30 | 40 | 40 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **160** | **190** | **250** |

    | Uzun Vadeli Mali Borçlar | 240 | 230 | 190 |

    | Ödenmiş Sermaye | 300 | 300 | 300 |

    | Geçmiş Yıllar Kârları | 40 | 100 | 180 |

    | Dönem Net Kârı | 60 | 80 | 120 |

    | **Özkaynaklar** | **400** | **480** | **600** |

    | **Toplam Pasif** | **800** | **900** | **1.040** |

    | **GELİR TABLOSU** | | | |

    | Brüt Satışlar | 840 | 1.050 | 1.260 |

    | Satış İndirimleri (-) | 40 | 50 | 60 |

    | Net Satışlar | 800 | 1.000 | 1.200 |

    | Satışların Maliyeti (-) | 640 | 780 | 960 |

    | Brüt Satış Kârı | 160 | 220 | 240 |

    | Faaliyet Giderleri (-) | 50 | 70 | 60 |

    | Faaliyet Kârı | 110 | 150 | 180 |

    | Finansman Giderleri (-) | 35 | 50 | 30 |

    | Dönem Kârı (vergi öncesi) | 75 | 100 | 150 |

    | Vergi Karşılığı (-) | 15 | 20 | 30 |

    | Dönem Net Kârı | 60 | 80 | 120 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.

    Gelir tablosunun dikey analizinde net satışlar %100 kabul edildiğine göre MK A.Ş.''nin 2026 yılı

    finansman giderlerinin dikey yüzdesi kaçtır?'
  secenekler:
    A: 2,38
    B: 2,50
    C: 2,88
    D: 3,13
    E: 16,67
  dogru: B
  aciklama:
    dogru_neden: 'Gelir tablosunun dikey analizinde her kalem net satışlara bölünür. 2026 finansman giderleri 30
      bin ₺, net satışlar 1.200 bin ₺''dir: 30 / 1.200 × 100 = %2,50.'
    hesap_adimlari:
    - 'Finansman giderleri / Net satışlar (2026): 30 / 1.200 = 0,025'
    - 'Dikey yüzde: 0,025 × 100 = 2,50'
    celdiriciler:
      A: 2,38, baz olarak net satışlar yerine brüt satışlar (30 / 1.260) alındığında bulunur.
      C: 2,88, baz olarak toplam aktif (30 / 1.040) alındığında bulunur; toplam aktif bilançonun dikey analizinde
        bazdır.
      D: 3,13, baz olarak satışların maliyeti (30 / 960) alındığında bulunur.
      E: 16,67, baz olarak faaliyet kârı (30 / 180) alındığında bulunur.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'Dikey analiz: gelir tablosu kalemi / Net satışlar × 100'
    alinti: ''
  dogrulama:
    python: 'sonuc = round(30 / 1200 * 100, 2)

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
- id: SMMM-TAB-DIK-0002
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: DIK
  kazanim: Trend yüzdelerinden tutara geri hesap
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'N İşletmesi''nin net satışlarına ilişkin trend yüzdeleri (baz yıl 2024 = 100) şöyledir: 2025 yılı 125, 2026
    yılı 140. Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır. 2026 yılı net satışları
    2.800.000 ₺ olduğuna göre N İşletmesi''nin 2025 yılı net satışları kaç ₺''dir?'
  secenekler:
    A: 3.500.000
    B: 2.500.000
    C: 2.380.000
    D: 2.240.000
    E: 2.000.000
  dogru: B
  aciklama:
    dogru_neden: Trend yüzdesi, ilgili yıl tutarının baz yıl tutarına oranıdır. Baz yıl (2024) net satışları 2.800.000
      / 1,40 = 2.000.000 ₺'dir. 2025 net satışları 2.000.000 × 1,25 = 2.500.000 ₺'dir.
    hesap_adimlari:
    - 'Baz yıl (2024) net satışları: 2.800.000 × 100 / 140 = 2.000.000 ₺'
    - '2025 net satışları: 2.000.000 × 125 / 100 = 2.500.000 ₺'
    celdiriciler:
      A: 3.500.000 ₺, 2026 tutarının 2025 trend yüzdesiyle çarpılmasıyla (2.800.000 × 1,25) bulunur; trend yüzdeleri
        baz yıla göredir, 2026'ya göre değil.
      C: 2.380.000 ₺, 140'tan 125'e 15 puanlık farkın %15'lik azalış sanılmasıyla (2.800.000 × 0,85) bulunur; puan
        farkı yüzde değişim değildir.
      D: 2.240.000 ₺, 2026 tutarının 2025 trend yüzdesine bölünmesiyle (2.800.000 / 1,25) bulunur; bu işlem 2025'i
        baz yıl gibi kabul eder.
      E: 2.000.000 ₺ baz yıl (2024) net satışlarıdır; soru 2025 yılını sormaktadır.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Trend yüzdesi = İlgili yıl tutarı / Baz yıl tutarı × 100
    alinti: ''
  dogrulama:
    python: 'baz = 2800000 * 100 / 140

      sonuc = baz * 125 / 100

      '
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
