        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: gecti
        tarih: '2026-10-07'
