    dogru_neden: Stok devir hızı 900 / 150 = 6 kezdir. Stokta kalma süresi 360 / 6 = 60 gündür.
    celdiriciler:
      A: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      B: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      D: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      E: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
    hesap_adimlari:
    - Stok devir hızı = 900 / 150 = 6
    - Stokta kalma süresi = 360 / 6 = 60 gün
  kaynaklar:
  - mevzuat: Genel bilgi — Finansal tablolar analizi
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 360 / (900 / 150)
