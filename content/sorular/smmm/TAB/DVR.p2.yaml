- id: SMMM-TAB-DVR-0028
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: ilk madde devir hızı
  tip: hesaplama
  zorluk: 1
  kok: Bir imalat işletmesinde ilk madde ve malzeme stoku dönem başında 70.000 ₺, dönem sonunda 90.000 ₺'dir. Dönem içinde
    380.000 ₺'lik ilk madde ve malzeme satın alınmıştır. İlk madde ve malzeme devir hızı kaç kezdir? Ortalama değer; yıl 360,
    ay 30 gün alınacaktır.
  secenekler:
    A: 2,25 kez
    B: 4 kez
    C: 4,5 kez
    D: 4,75 kez
    E: 5,62 kez
  dogru: C
  aciklama:
    dogru_neden: Kullanılan ilk madde = dönem başı stok + alışlar − dönem sonu stok = 70.000+380.000−90.000 = 360.000 ₺. Ortalama
      stok 80.000 ₺ olduğundan devir hızı 360.000/80.000 = 4,5 kezdir. İlk madde devir hızında pay, üretime verilen ilk madde
      ve malzeme maliyetidir (150 İlk Madde ve Malzeme).
    celdiriciler:
      A: Dönem başı ve sonu stok toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama stok yerine yalnızca dönem sonu stoku kullanılmış.
