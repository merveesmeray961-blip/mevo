  kok: Bir ticari işletmede ortalama ticari mal stoku 300.000 ₺, ticari mal devir hızı 4 kez, brüt satış kârı oranı net satışların
    %20'sidir. Ortalama ticari alacaklar 190.000 ₺ olduğuna göre alacak tahsil süresi kaç gündür? Ortalama değer; yıl 360,
