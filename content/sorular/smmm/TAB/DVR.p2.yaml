        not: 'Geri hesap doğrulandı: hız 10, ortalama 180, dönem sonu 2×180−220 = 140; çeldiriciler 68/160/180/360 doğru.
          2027 verileri DIK-0004 ile tutarlı (1.800; SMM %80).'
      G6:
