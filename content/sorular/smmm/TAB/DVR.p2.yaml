  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: borç devir hızı
  tip: hesaplama
  zorluk: 3
  kok: Bir toptan gıda işletmesinde ticari mal stoku yıl başında 90.000 ₺, yıl sonunda 110.000 ₺'dir; yıl içinde 470.000 ₺'lik
    mal alınmıştır. Ticari borçlar yıl başında 50.000 ₺, yıl sonunda 70.000 ₺'dir. Borç devir hızının payı satışların maliyeti
    olduğuna göre borç devir hızı kaç kezdir?
  secenekler:
    A: 3,75 kez
    B: 6,43 kez
    C: 7,5 kez
    D: 7,83 kez
    E: 9 kez
  dogru: C
  aciklama:
    dogru_neden: 'Satışların maliyeti = 90.000+470.000−110.000 = 450.000 ₺''dir. Ortalama bakiye = (50.000+70.000)/2 = 60.000;
      devir hızı = 450.000/60.000 = 7,5 kezdir. Püf noktaları: Alış tutarı verilmiş olsa da pay, stok değişimi düzeltilmiş
      satışların maliyetidir. Alışları doğrudan pay yapmak tuzaktır.'
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      D: Pay olarak satışların maliyeti yerine alışlar alınmış.
      E: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (50.000 + 70.000) / 2 = 60.000
    - Devir hızı = 450.000 / 60.000 = 7,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 320 - Satıcılar
    alinti: İşletmenin faaliyet konusu ile ilgili her türlü mal ve hizmet alımlarından kaynaklanan senetsiz borçların izlendiği
      hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 321 - Borç Senetleri
    alinti: İşletmenin faaliyet konusu ile ilgili her türlü mal ve hizmet alımlarından kaynaklanan senede bağlanmış ticari
      borçlarının izlendiği hesaptır.
