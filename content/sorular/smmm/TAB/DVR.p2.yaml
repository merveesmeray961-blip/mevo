    dogru_neden: 'Satışların maliyeti = 4 × 300.000 = 1.200.000 ₺. Brüt kâr oranı %20 ise maliyet net satışların %80''idir;
      net satışlar 1.200.000/0,80 = 1.500.000 ₺. Tahsil süresi = 360 × 190.000/1.500.000 = 45,6 gündür. Püf noktaları: Brüt
      kâr oranı satış üzerinden verildiğinden net satış = maliyet / (1 − oran) olur; maliyeti 1,20 ile çarpmak klasik tuzaktır.
