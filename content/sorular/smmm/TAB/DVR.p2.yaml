    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 's1=90000; s2=110000; alis=470000; a=50000; b=70000

      sonuc = round(((s1+alis-s2)/(((a)+(b))/2)), 2)'
