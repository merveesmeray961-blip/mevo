      B: Sonuç gereksiz yere ikiye bölünmüş.
      D: Net satışlar maliyet bölünerek değil, maliyet (1 + kâr oranı) ile çarpılarak bulunmuş; kâr oranı satış üzerinden
        tanımlıdır.
      E: Net satışlar, maliyet (1 − kâr oranı) ile çarpılarak bulunmuş; doğrusu bölmektir.
