- id: SMMM-TAB-DVR-0050
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: hedef süreden geri hesap
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin satışların maliyeti yıllık 720.000 ₺'dir. Ticari mal stoku dönem başında 145.000 ₺, dönem sonunda 150.000
    ₺'dir. Yönetim, satışların maliyeti değişmeden ticari mal devir süresini 60 güne düşürmek ve dönem başı stok tutarını
    koruyarak yalnızca dönem sonu stoku değiştirmek istemektedir. Dönem sonu stokun kaç ₺ azaltılması gerekir? Ortalama değer;
    yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 5.000 ₺
    B: 27.500 ₺
    C: 30.000 ₺
    D: 55.000 ₺
    E: 120.000 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Hedef süre 60 gün ise gerekli hız 6; gerekli ortalama stok 720.000/6 = 120.000 ₺. Hedef dönem sonu stok
      2×120.000−145.000 = 95.000 ₺''dir. Mevcut dönem sonu stok 150.000 ₺ olduğundan azaltılması gereken tutar 150.000−95.000
      = 55.000 ₺''dir. Püf noktaları: Soru hedef bakiyeyi değil azaltılacak tutarı sorar. Ortalama stokun iki katından dönem
      başını çıkarıp ardından mevcut dönem sonuyla farkı alman gerekir; ara sonuçlar şıklarda çeldirici olarak yer alır.'
    celdiriciler:
      A: Dönem başı ile sonu arasındaki mevcut fark azalış sanılmış.
      B: Ortalama stoktaki azalış bulunmuş; dönem sonu stoktaki azalış bunun yaklaşık iki katıdır.
      C: Gerekli ortalama stok, dönem sonu stok sanılarak azalış hesaplanmış.
      E: Bulunan tutar gerekli ortalama stoktur; azalış tutarı değildir.
    hesap_adimlari:
    - Gerekli hız = 360 / 60 = 6
    - Gerekli ortalama stok = 720.000 / 6 = 120.000
    - Hedef dönem sonu stok = 2 × 120.000 − 145.000 = 95.000
    - Azaltılacak tutar = 150.000 − 95.000 = 55.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 153 - Ticari Mallar
    alinti: Herhangi bir değişikliğe tabi tutulmadan satmak amacı ile işletmeye alınan ticari mallar (emtia) ve benzeri kalemler
      bu hesapta yer alır.
