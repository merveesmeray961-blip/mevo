    | Satışların Maliyeti (-) | 800 | 960 | 1.200 |

    | Brüt Satış Kârı | 200 | 240 | 300 |

    | Faaliyet Giderleri (-) | 100 | 120 | 150 |

    | Faaliyet Kârı | 100 | 120 | 150 |

    | Finansman Giderleri (-) | 50 | 45 | 50 |

    | Dönem Kârı (vergi öncesi) | 50 | 75 | 100 |

    | Vergi Karşılığı (-) | 10 | 15 | 20 |

    | Dönem Net Kârı | 40 | 60 | 80 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.


    NB A.Ş.''nin 2027 yılında net satışlarının 1.800 bin ₺, satışların maliyetinin 1.440 bin ₺ olacağı öngörülmektedir. Yönetim,
    2027 yılında ticari alacak tahsil süresinin 36 güne düşürülmesini hedeflemektedir. Alacak devir hızının hesabında net
    satışlar ve ortalama ticari alacaklar kullanılacaktır. Bu hedefe ulaşılabilmesi için 2027 yıl sonunda ticari alacaklar
    kaç bin ₺ olmalıdır?'
  secenekler:
    A: '68'
    B: '140'
    C: '160'
    D: '180'
    E: '360'
  dogru: B
  aciklama:
    dogru_neden: 'Hedef tahsil süresi 36 gün olduğuna göre alacak devir hızı 360 / 36 = 10 kezdir. Ortalama ticari alacak
      = Net satışlar / Devir hızı = 1.800 / 10 = 180 bin ₺. Ortalama alacak (2026 sonu + 2027 sonu) / 2 olduğundan (220 +
      X) / 2 = 180 ve X = 140 bin ₺''dır. Püf noktaları: Sonuç doğrudan bulunmaz; önce devir hızı, sonra ortalama alacak,
      en son dönem sonu alacak hesaplanır (geri hesap). Bulunan 180, dönem sonu değil ortalama değerdir; dönem sonu değer,
      başlangıç bakiyesi (2026 sonu: 220) düşülerek bulunur. Satışların maliyeti ve brüt satışlar gibi veriler çözüme etkisizdir;
      alacak devir hızında net satışlar esas alınır.'
    hesap_adimlari:
    - 'Hedef devir hızı: 360 / 36 = 10'
    - 'Ortalama ticari alacak: 1.800 / 10 = 180'
    - 'Dönem sonu: 2 × 180 − 220 = 140'
    celdiriciler:
      A: '68, baz olarak satışların maliyeti (1.440) alındığında bulunur: ortalama alacak 1.440 / 10 = 144; 2 × 144 − 220
        = 68.'
      C: '160, başlangıç bakiyesi olarak 2026 ortalama alacağı (200) alındığında bulunur: 2 × 180 − 200 = 160; başlangıç bakiyesi
        2026 yıl sonu değeridir (220).'
      D: 180, hedeflenen ortalama alacağın dönem sonu alacak sanılmasıyla bulunur; ortalamada başlangıç bakiyesi de vardır.
      E: 360, iki bakiyenin toplamı (2 × 180) alınıp başlangıç bakiyesi (220) düşülmeden bulunur; doğru işlem 360 − 220 =
        140'tır.
  kaynaklar: *id001
  dogrulama:
    python: 'hiz = 360 / 36

      ort = 1800 / hiz

      sonuc = round(2 * ort - 220, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
