    göre hesaplanmaktadır. Ticari alacaklar dönem başında 64.000 ₺'dir. Yönetim tahsil süresini 30 güne indirmek istemektedir.
    Satışlar değişmeyeceğine göre dönem sonu ticari alacaklar en fazla kaç ₺ olmalıdır? Ortalama değer; yıl 360, ay 30 gün
    alınacaktır.
  secenekler:
    A: 8.000 ₺
    B: 56.000 ₺
    C: 60.000 ₺
    D: 96.000 ₺
    E: 184.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Vadeli satışlar 960.000×%75 = 720.000 ₺; hedef hız 360/30 = 12; gerekli ortalama alacak 720.000/12 = 60.000
      ₺''dir. Dönem sonu alacak 2×60.000−64.000 = 56.000 ₺''dir. Püf noktaları: Pay yalnızca vadeli satışlardır; tüm net satışı
      kullanmak ortalamayı şişirir. Ortalamayı bulduktan sonra 2 ile çarpıp dönem başı bakiyeyi çıkarmayı unutma.'
    celdiriciler:
      A: Bulunan tutar dönem başı ile hedef dönem sonu arasındaki azalıştır; sorulan bakiyedir.
      C: Bulunan tutar gerekli ortalama alacaktır; dönem sonu için 2 × ortalama − dönem başı hesaplanmalıdır.
      D: Pay olarak yalnız vadeli satışlar yerine tüm net satışlar alınmış.
      E: Dönem başı alacak çıkarılmak yerine eklenmiş.
    hesap_adimlari:
    - Vadeli satışlar = 960.000 × %75 = 720.000
    - Gerekli hız = 360 / 30 = 12; ortalama alacak = 60.000
    - Dönem sonu alacak = 2 × 60.000 − 64.000 = 56.000
