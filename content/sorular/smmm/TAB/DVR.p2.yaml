  kazanim: Alacak devir hızı ve alacak tahsil süresi
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  ortak_veri: TAB-SET-02
  kok: 'NB A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** |  |  |  |

    | Hazır Değerler | 40 | 50 | 80 |

    | Ticari Alacaklar | 150 | 180 | 220 |

    | Stoklar | 120 | 160 | 200 |

    | Diğer Dönen Varlıklar | 40 | 30 | 40 |

    | **Dönen Varlıklar** | **350** | **420** | **540** |

