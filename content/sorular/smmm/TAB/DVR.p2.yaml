  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: mamul devir süresi
  tip: hesaplama
  zorluk: 3
  kok: Bir kimya işletmesinde altı aylık (180 gün) dönemde dönemin üretim giderleri 370.000 ₺'dir. Yarı mamul stoku dönem
    başında 40.000 ₺, dönem sonunda 50.000 ₺; mamul stoku dönem başında 60.000 ₺, dönem sonunda 100.000 ₺'dir. Mamul devir
    süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 4 gün
    B: 33,75 gün
    C: 38,92 gün
    D: 40 gün
    E: 45 gün
  dogru: E
  aciklama:
    dogru_neden: 'Tamamlanan üretim maliyeti 40.000+370.000−50.000 = 360.000 ₺; satılan mamul maliyeti 60.000+360.000−100.000
      = 320.000 ₺''dir. Ortalama bakiye = (60.000+100.000)/2 = 80.000; devir hızı = 320.000/80.000 = 4 kez; devir süresi =
      180/4 = 45 gündür. Püf noktaları: Altı aylık dönemde gün sayısı 180''dir. İki aşamalı stok hareketini (yarı mamul, sonra
      mamul) sırayla işle.'
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için gün sayısının hıza bölünmesi gerekir.
      B: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
      C: Pay olarak dönemin üretim giderleri alınmış.
      D: Pay olarak satılan mamul maliyeti yerine tamamlanan üretim maliyeti alınmış.
    hesap_adimlari:
    - Ortalama bakiye = (60.000 + 100.000) / 2 = 80.000
    - Devir hızı = 320.000 / 80.000 = 4
    - Devir süresi = 180 / 4 = 45 gün
