  kok: Bir ticari işletmenin altı aylık dönemde (180 gün) satışların maliyeti 540.000 ₺'dir. Ticari borçlar dönem başında
    70.000 ₺, dönem sonunda 110.000 ₺ olduğuna göre borç ödeme süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 6 gün
    B: 30 gün
    C: 36,67 gün
    D: 46,67 gün
    E: 60 gün
  dogru: B
  aciklama:
    dogru_neden: 'Ortalama ticari borç (70.000+110.000)/2 = 90.000 ₺; altı aylık devir hızı 540.000/90.000 = 6 kezdir. Akış
      altı aylık olduğundan süre 180/6 = 30 gündür. Püf noktaları: Akış altı aylıksa gün sayısı 180''dir; 360 kullanmak sonucu
      iki katına çıkarır. Dönem başı ile sonu arasındaki büyük fark, tek bakiyeyle hesap yapma tuzağını cazip kılar.'
    celdiriciler:
      A: Bulunan değer altı aylık borç devir hızıdır (kez); süre değildir.
      C: Ortalama borç yerine yalnızca dönem sonu borcu kullanılmış.
