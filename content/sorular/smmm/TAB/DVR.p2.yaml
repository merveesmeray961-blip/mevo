- id: SMMM-TAB-DVR-0039
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: nakit dönüşüm süresi
  tip: hesaplama
  zorluk: 3
  kok: 'Bir ticari işletmenin 2026 yılı net satışları 1.800.000 ₺, satışların maliyeti 1.200.000 ₺''dir. Bilanço kalemleri
    aşağıdaki gibidir.


    | Kalem | Dönem başı (₺) | Dönem sonu (₺) |

    |---|---|---|

    | Ticari mallar | 180.000 | 220.000 |

    | Ticari alacaklar | 140.000 | 160.000 |

    | Ticari borçlar | 110.000 | 130.000 |


    İşletmenin nakit dönüşüm süresi (stok devir süresi + alacak tahsil süresi − borç ödeme süresi) kaç gündür? Ticari borç
    devir hızında pay olarak satışların maliyeti kullanılacaktır. Ortalama değer; yıl 360, ay 30 gün alınacaktır.'
  secenekler:
    A: 6 gün
    B: 54 gün
    C: 66 gün
    D: 90 gün
    E: 126 gün
  dogru: B
  aciklama:
    dogru_neden: 'Stok devir süresi 360×200.000/1.200.000 = 60 gün; alacak tahsil süresi 360×150.000/1.800.000 = 30 gün; borç
      ödeme süresi 360×120.000/1.200.000 = 36 gündür. Nakit dönüşüm süresi 60+30−36 = 54 gündür. Püf noktaları: Üç ayrı ortalama
      bulunur; stok ve borç süresinde pay satışların maliyeti, alacak süresinde net satışlardır. Borç süresini toplamak yerine
      çıkarmayı unutma; şıklardaki 90 ve 126 gibi değerler bu hatadan çıkar.'
    celdiriciler:
      A: Stok devir hızı (kez) nakit dönüşüm süresi sanılmış.
      C: Borç ödeme süresinde pay olarak satışların maliyeti yerine net satışlar alınmış.
      D: Borç ödeme süresi çıkarılmamış; bu değer faaliyet dönemidir.
      E: Borç ödeme süresi çıkarılmak yerine eklenmiş.
    hesap_adimlari:
    - Stok süresi = 360 × 200.000 / 1.200.000 = 60
    - Tahsil süresi = 360 × 150.000 / 1.800.000 = 30
    - Ödeme süresi = 360 × 120.000 / 1.200.000 = 36
    - Nakit dönüşüm süresi = 60 + 30 − 36 = 54
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 153 - Ticari Mallar
    alinti: Herhangi bir değişikliğe tabi tutulmadan satmak amacı ile işletmeye alınan ticari mallar (emtia) ve benzeri kalemler
      bu hesapta yer alır.
