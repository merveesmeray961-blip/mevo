    | Net Satışlar | 1.000 | 1.200 | 1.500 |

    | Satışların Maliyeti (-) | 800 | 960 | 1.200 |

    | Brüt Satış Kârı | 200 | 240 | 300 |

    | Faaliyet Giderleri (-) | 100 | 120 | 150 |

    | Faaliyet Kârı | 100 | 120 | 150 |

    | Finansman Giderleri (-) | 50 | 45 | 50 |

    | Dönem Kârı (vergi öncesi) | 50 | 75 | 100 |

    | Vergi Karşılığı (-) | 10 | 15 | 20 |

    | Dönem Net Kârı | 40 | 60 | 80 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.


    Alacak devir hızının hesabında net satışlar esas alınacaktır. NB A.Ş.''nin 2026 yılı ticari alacak tahsil süresi (ortalama
    tahsil süresi) kaç gündür?'
  secenekler:
    A: 7,50
    B: 45,00
    C: 48,00
    D: 52,80
    E: 60,00
  dogru: C
  aciklama:
    dogru_neden: Ortalama ticari alacak = (180 + 220) / 2 = 200 bin ₺. Alacak devir hızı = Net satışlar / Ortalama ticari
      alacaklar = 1.500 / 200 = 7,5 kez. Tahsil süresi = 360 / 7,5 = 48 gün.
    hesap_adimlari:
    - 'Ortalama ticari alacak: (180 + 220) / 2 = 200'
    - 'Alacak devir hızı: 1.500 / 200 = 7,5'
    - 'Tahsil süresi: 360 / 7,5 = 48 gün'
    celdiriciler:
      A: 7,50, alacak devir hızıdır (kez); soru gün olarak tahsil süresini sormaktadır.
      B: 45,00, baz olarak brüt satışlar (1.600) alındığında bulunur (360 × 200 / 1.600); alacak devir hızında net satışlar
        esas alınır.
      D: 52,80, ortalama alacak yerine dönem sonu alacak (220) alındığında bulunur (360 × 220 / 1.500).
      E: 60,00, baz olarak satışların maliyeti (1.200) alındığında bulunur (360 × 200 / 1.200); alacaklar satış tutarı ile
        ilişkilendirilir.
  kaynaklar: &id001
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Alacak devir hızı = Net satışlar / Ortalama ticari alacaklar; Alacak tahsil süresi = 360 / Alacak devir hızı
    alinti: ''
  dogrulama:
    python: 'ort_alacak = (180 + 220) / 2

      hiz = 1500 / ort_alacak

      sonuc = round(360 / hiz, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
