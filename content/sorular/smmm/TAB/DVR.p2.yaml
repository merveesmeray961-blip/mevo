  aciklama:
    dogru_neden: 'Hedef tahsil süresi 45 gün ise gerekli hız 360/45 = 8; gerekli ortalama alacak 720.000/8 = 90.000 ₺''dir.
      Dönem sonu alacak = 2×90.000−94.000 = 86.000 ₺''dir (120 Alıcılar ve 121 Alacak Senetleri). Mevcut tahmin edilen 140.000
      ₺ hedefin üzerindedir. Püf noktaları: Mevcut dönem sonu tahmini (gereksiz veri) hesaba girmez. Ortalamayı bulduktan
      sonra 2 ile çarpıp dönem başını çıkarmayı unutma; ortalama bakiyeyi cevap sanmak en sık hatadır.'
    celdiriciler:
      A: Bulunan tutar dönem başı ile hedef dönem sonu arasındaki azalıştır; sorulan bakiyedir.
      C: Bulunan tutar gerekli ortalama alacaktır; dönem sonu için 2 × ortalama − dönem başı hesaplanmalıdır.
      D: Dönem başı alacağı dönem sonu hedefi sanılmış.
      E: Dönem başı alacak çıkarılmak yerine eklenmiş.
    hesap_adimlari:
    - Gerekli hız = 360 / 45 = 8
    - Gerekli ortalama alacak = 720.000 / 8 = 90.000
    - Dönem sonu alacak = 2 × 90.000 − 94.000 = 86.000
  kaynaklar:
