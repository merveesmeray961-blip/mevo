  kok: Bir işletmenin net satışları yıllık 720.000 ₺ olup aynı kalacaktır. Ticari alacaklar dönem başında 94.000 ₺, mevcut
    tahmine göre dönem sonunda 140.000 ₺ olacaktır. Yönetim, alacak tahsil süresini 45 güne indirmeyi hedeflemektedir. Bu
    hedef için dönem sonu ticari alacaklar en fazla kaç ₺ olmalıdır? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 8.000 ₺
