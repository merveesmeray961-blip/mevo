- id: SMMM-TAB-DVR-0026
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: ticari mal devir süresi
  tip: hesaplama
  zorluk: 1
  kok: Bir ticari işletmede satışların maliyeti 600.000 ₺, net satışlar 800.000 ₺'dir. Ticari mal stoku dönem başında 90.000
    ₺, dönem sonunda 110.000 ₺ olduğuna göre ticari mal devir süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 6 gün
    B: 54 gün
    C: 60 gün
    D: 66 gün
    E: 120 gün
  dogru: C
  aciklama:
    dogru_neden: Ticari mal devir hızı, satışların maliyetinin ortalama ticari mala bölünmesiyle bulunur. Ortalama stok (90.000+110.000)/2
      = 100.000 ₺, devir hızı 600.000/100.000 = 6 kez, devir süresi 360/6 = 60 gündür. Stoklar bilançoda maliyetle izlendiği
      için (153 Ticari Mallar) pay satışların maliyetidir.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için 360 günün hıza bölünmesi gerekir.
      B: Ortalama stok yerine yalnızca dönem başı stoku kullanılmış.
      D: Ortalama stok yerine yalnızca dönem sonu stoku kullanılmış.
      E: Dönem başı ve dönem sonu stok toplamı ikiye bölünmeden payda yapılmış.
    hesap_adimlari:
    - Ortalama stok = (90.000 + 110.000) / 2 = 100.000
    - Devir hızı = 600.000 / 100.000 = 6
    - Devir süresi = 360 / 6 = 60 gün
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 153 - Ticari Mallar
    alinti: Herhangi bir değişikliğe tabi tutulmadan satmak amacı ile işletmeye alınan ticari mallar (emtia) ve benzeri kalemler
      bu hesapta yer alır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap grubu 15 - Stoklar
    alinti: Bu grup, işletmenin satmak, üretimde kullanmak veya tüketmek amacıyla edindiği, ilk madde ve malzeme, yarı mamul,
      mamul, ticari mal, yan ürün, artık ve hurda gibi bir yıldan az bir sürede kullanılacak olan veya bir yıl içerisinde
      nakde çevrilebileceği düşünülen varlıklardan oluşur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'smm=600000; ns=800000; a=90000; b=110000

      sonuc = round(360/(smm/((a+b)/2)), 2)'
