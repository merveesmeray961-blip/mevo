  konu: DVR
  kazanim: 'Nakit dönüşüm süresi: stok devir süresi + alacak tahsil süresi − borç ödeme süresi'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  ortak_veri: TAB-SET-03
  kok: 'RT A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** |  |  |  |

    | Hazır Değerler | 60 | 80 | 120 |

    | Menkul Kıymetler | 20 | 20 | 40 |

    | Ticari Alacaklar | 200 | 240 | 300 |

    | Stoklar | 170 | 210 | 240 |

    | Diğer Dönen Varlıklar | 10 | 10 | 20 |

    | **Dönen Varlıklar** | **460** | **560** | **720** |

    | Maddi Duran Varlıklar (net) | 740 | 840 | 880 |

    | **Toplam Aktif** | **1.200** | **1.400** | **1.600** |

    | Kısa Vadeli Mali Borçlar | 120 | 130 | 140 |

    | Ticari Borçlar | 170 | 210 | 240 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 10 | 10 | 20 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **300** | **350** | **400** |

    | Uzun Vadeli Mali Borçlar | 300 | 350 | 400 |

    | Ödenmiş Sermaye | 400 | 400 | 400 |

    | Geçmiş Yıllar Kârları | 120 | 200 | 280 |

    | Dönem Net Kârı | 80 | 100 | 120 |

    | **Özkaynaklar** | **600** | **700** | **800** |

    | **Toplam Pasif** | **1.200** | **1.400** | **1.600** |

    | **GELİR TABLOSU** |  |  |  |

    | Brüt Satışlar | 1.260 | 1.575 | 1.890 |

    | Satış İndirimleri (-) | 60 | 75 | 90 |

    | **Net Satışlar** | **1.200** | **1.500** | **1.800** |

    | Satışların Maliyeti (-) | 900 | 1.125 | 1.350 |

    | **Brüt Satış Kârı** | **300** | **375** | **450** |

    | Faaliyet Giderleri (-) | 150 | 190 | 230 |

    | **Faaliyet Kârı** | **150** | **185** | **220** |

    | Finansman Giderleri (-) | 50 | 60 | 70 |

    | Dönem Kârı (vergi öncesi) | 100 | 125 | 150 |

    | Vergi Karşılığı (-) | 20 | 25 | 30 |

    | **Dönem Net Kârı** | **80** | **100** | **120** |


    Devir hızlarında ve kârlılık oranlarında ortalama değerler (yıl başı ve yıl sonu bakiyelerinin ortalaması) kullanılacak;
    yıl 360, ay 30 gün alınacaktır.


    Stok devir süresi ve borç ödeme süresi satışların maliyeti ile, alacak tahsil süresi net satışlarla hesaplanacaktır.
    Nakit dönüşüm süresi = Stok devir süresi + Alacak tahsil süresi − Borç ödeme süresi formülüyle bulunmaktadır.


    Buna göre RT A.Ş.''nin 2026 yılı nakit dönüşüm süresi kaç gündür?'
  secenekler:
    A: '54'
    B: '60'
    C: '69'
    D: '114'
    E: '174'
  dogru: A
  aciklama:
    dogru_neden: Ortalama stok (210 + 240) / 2 = 225; stok devir hızı 1.350 / 225 = 6, devir süresi 360 / 6 = 60
      gündür. Ortalama ticari alacak (240 + 300) / 2 = 270; alacak devir hızı 1.800 / 270 = 6,67, tahsil süresi
      360 × 270 / 1.800 = 54 gündür. Ortalama ticari borç (210 + 240) / 2 = 225; borç devir hızı 1.350 / 225 = 6,
      ödeme süresi 60 gündür. Nakit dönüşüm süresi 60 + 54 − 60 = 54 gündür.
    celdiriciler:
      B: '60: Ortalama yerine dönem sonu bakiyeler alınmıştır (stok 64 + alacak 60 − borç 64).'
      C: '69: Borç ödeme süresi satışların maliyeti yerine net satışlarla hesaplanmıştır (225 × 360 / 1.800 = 45);
        60 + 54 − 45 = 69.'
      D: '114: Borç ödeme süresi çıkarılmamıştır (60 + 54).'
      E: '174: Borç ödeme süresi çıkarılacak yerde eklenmiştir (60 + 54 + 60).'
    hesap_adimlari:
    - 'Stok devir süresi: 360 × 225 / 1.350 = 60 gün'
    - 'Alacak tahsil süresi: 360 × 270 / 1.800 = 54 gün'
    - 'Borç ödeme süresi: 360 × 225 / 1.350 = 60 gün'
    - 'Nakit dönüşüm süresi: 60 + 54 − 60 = 54 gün'
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Nakit dönüşüm süresi = Stok devir süresi + Alacak tahsil süresi − Borç ödeme süresi
    alinti: ''
  dogrulama:
    python: 'stok = 360 * ((210 + 240) / 2) / 1350

      alacak = 360 * ((240 + 300) / 2) / 1800

      borc = 360 * ((210 + 240) / 2) / 1350

      sonuc = stok + alacak - borc

      '
