  aciklama:
    dogru_neden: 'Ortalama ticari mal stoku (180 + 220) / 2 = 200 bin ₺dir. Devir hızı 1.080 / 200 = 5,4 kez, süre ise 360
      / 5,4 = 66,67 gündür. Doğru seçenek Cdir. Püf noktaları: Devir hızında dönem başı ve dönem sonu stoklarının ortalaması
      kullanılır; süre devir hızının 360 güne bölünmesiyle bulunur.'
