  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: stok (ilk madde; yarı mamul; mamul; ticari mal) devir hızı/süresi
  tip: hesaplama
  zorluk: 1
  kok: Bir üretim işletmesinde ilk madde ve malzeme stokunun dönem başı tutarı 80 bin TL, dönem sonu tutarı 120 bin TL'dir.
    Dönem içinde üretimde kullanılan ilk madde ve malzeme maliyeti 400 bin TL'dir. İlk madde ve malzeme devir hızı = kullanılan
    ilk madde ve malzeme maliyeti / ortalama ilk madde ve malzeme stoku olarak alınacaktır. Devir hızı kaçtır?
  secenekler:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
    E: '6'
  dogru: C
  aciklama:
    dogru_neden: Ortalama ilk madde ve malzeme stoku (80 + 120) / 2 = 100 bin TL'dir. Devir hızı 400 / 100 = 4'tür.
    celdiriciler:
      A: Dönem sonu stok 120 bin TL doğrudan payda alınmıştır.
      B: Dönem başı stok 80 bin TL doğrudan payda alınmıştır.
      D: Kullanılan maliyet ile dönem sonu stok toplanarak yanlış bir payda oluşturulmuştur.
      E: İki dönem stok toplamı 200 bin TL, ortalama yerine doğrudan payda alınmıştır.
    hesap_adimlari:
    - 'Ortalama stok: (80 + 120) / 2 = 100'
    - 'Devir hızı: 400 / 100 = 4'
  kaynaklar:
  - mevzuat: MSUGT Tekdüzen Hesap Planı Açıklamaları
    madde: 150. İlk Madde ve Malzeme
    alinti: 'Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı

      madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır.'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 400 / ((80+120)/2)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
