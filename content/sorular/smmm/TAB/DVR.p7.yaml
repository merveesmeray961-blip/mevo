        yakın sonuçtur.
      E: 6 kez ve 72 gün, hız ile sürenin birbirine tutarlı çevrilmemesinden kaynaklanır.
    hesap_adimlari:
    - 'Ortalama stok: (180 + 220) / 2 = 200'
    - 'Devir hızı: 1.080 / 200 = 5,4'
    - 'Devir süresi: 360 / 5,4 = 66,67 gün'
