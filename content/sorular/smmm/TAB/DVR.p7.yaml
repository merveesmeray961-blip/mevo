  kok: Bir işletmede satılan ticari malların maliyeti 1.080 bin ₺dir. Ticari malların dönem başı stoku 180 bin ₺, dönem sonu
    stoku 220 bin ₺dir. Devir hızında ortalama stok, sürede 360 gün kullanılacaktır. Ticari mal devir hızı ve devir süresi
