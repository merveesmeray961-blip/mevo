  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: borç ödeme süresi
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin ortalama ticari borçları 150 bin TL, yıllık kredili mal alışları 900 bin TL’dir. Yönetim,
    tedarikçilere ödeme süresinin uzamasını değerlendirirken hangi hesaplamayı esas almalıdır? Yıl 360 gün kabul
    edilecektir.
  secenekler:
    A: 900 / 150 × 360 = 2.160 gün
    B: 150 / 900 × 360 = 60 gün
    C: 150 / 900 × 365 = 60,83 gün
    D: 900 / 150 = 6 gün
    E: 150 / (900 + 150) × 360 = 51,43 gün
  dogru: B
  aciklama:
    dogru_neden: Borç ödeme süresi = ortalama ticari borçlar / kredili alışlar × 360 = 150 / 900 × 360 = 60 gündür.
    celdiriciler:
      A: Oran ters çevrilmiş ve 360 ile çarpılmıştır; devir hızı süreyle karıştırılmıştır.
      C: Yıl 360 gün kabul edilecekken 365 gün kullanılmıştır.
      D: Borç devir hızı (6 kez) gün olarak yorumlanmıştır.
      E: Payda kredili alışlara ortalama borç eklenmiştir; payda yalnız kredili alışlardır.
    hesap_adimlari:
    - Borç devir hızı = 900 / 150 = 6
    - Ödeme süresi = 360 / 6 = 60 gün
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — borç ödeme süresi
    madde: Borç ödeme süresi
    alinti: ''
