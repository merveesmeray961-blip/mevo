      C: Oran ters çevrilmiş ve 360 ile çarpılmıştır.
      D: Gün dönüşümü yapılmamıştır.
      E: Formülde 360 yerine 180 kullanılmasıyla bulunur.
    hesap_adimlari:
    - Borç devir hızı = 900 / 150 = 6
    - Ödeme süresi = 360 / 6 = 60 gün
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — borç ödeme süresi
