    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.

    Ticari borç devir hızı = Satışların maliyeti / Ortalama ticari borçlar formülüyle hesaplandığına göre

    MK A.Ş.''nin 2026 yılı ticari borç ödeme süresi kaç gündür?'
  secenekler:
    A: 24,00
    B: 30,00
    C: 30,42
    D: 33,75
    E: 45,00
  dogru: B
  aciklama:
    dogru_neden: 2026 ortalama ticari borçlar (70 + 90) / 2 = 80 bin ₺'dir. Ticari borç devir hızı 960 / 80 = 12,
      borç ödeme süresi 360 / 12 = 30 gündür.
    hesap_adimlari:
    - 'Ortalama ticari borçlar (2026): (70 + 90) / 2 = 80'
    - 'Ticari borç devir hızı: 960 / 80 = 12'
    - 'Borç ödeme süresi: 360 / 12 = 30 gün'
    celdiriciler:
      A: 24 gün, pay olarak satışların maliyeti yerine net satışlar (1.200 / 80 = 15; 360 / 15) kullanıldığında
        bulunur; kökteki formül satışların maliyetini esas almaktadır.
      C: 30,42 gün, yıl 360 yerine 365 gün alındığında (365 / 12) bulunur.
      D: 33,75 gün, ortalama yerine dönem sonu ticari borç (960 / 90 = 10,67) kullanıldığında bulunur.
      E: '45 gün, ticari borç ödeme süresi yerine ticari alacak tahsil süresi hesaplandığında bulunur: ortalama
        ticari alacaklar (140 + 160) / 2 = 150, alacak devir hızı 1.200 / 150 = 8, 360 / 8 = 45. Soru ticari borçları
        ve satışların maliyetini esas almaktadır.'
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Ticari borç devir hızı = Satışların maliyeti / Ortalama ticari borçlar; Borç ödeme süresi = 360 / Ticari
      borç devir hızı
    alinti: ''
  dogrulama:
    python: 'ort_borc = (70 + 90) / 2

      hiz = 960 / ort_borc

      celdirici_e = 360 / (1200 / ((140 + 160) / 2))

      sonuc = round(360 / hiz, 2)

      '
