  kazanim: brüt ve faaliyet kâr oranı
  tip: hesaplama
  zorluk: 2
  kok: Bir işletmenin net satışları 1.000 bin TL, satışların maliyeti 700 bin TL ve faaliyet giderleri 150 bin TL'dir. Brüt
    satış kârı oranı ve faaliyet kârı oranı sırasıyla kaçtır?
  secenekler:
    A: '%15 ve %30'
    B: '%30 ve %15'
    C: '%30 ve %45'
    D: '%70 ve %15'
    E: '%15 ve %70'
  dogru: B
  aciklama:
    dogru_neden: Brüt satış kârı 1.000 − 700 = 300 bin TL, faaliyet kârı 300 − 150 = 150 bin TL'dir. Net satışlara oranları
      sırasıyla %30 ve %15'tir.
    celdiriciler:
      A: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      C: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      D: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
      E: Bu seçenek, doğru formül veya yorumla uyuşmamaktadır.
    hesap_adimlari:
    - Brüt satış kârı = 1.000 − 700 = 300
    - Faaliyet kârı = 300 − 150 = 150
    - 'Oranlar: %30 ve %15'
  kaynaklar:
  - mevzuat: Genel bilgi — Finansal tablolar analizi
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = round((1000 - 700) / 1000 * 100, 2)
