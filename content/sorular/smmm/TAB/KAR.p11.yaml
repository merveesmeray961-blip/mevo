- id: SMMM-TAB-KAR-0014
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: brüt ve faaliyet kâr oranı
  tip: hesaplama
  zorluk: 3
  kok: Bir ticaret işletmesi, sattığı malların liste fiyatını alış maliyetinin iki katı olarak belirlemekte ve tüm
    müşterilerine liste fiyatı üzerinden %20 satış iskontosu uygulamaktadır. Dönemde satılan ticari malların maliyeti
    400 bin ₺'dir; satıştan iade ve diğer indirim yoktur. Brüt satış kârı oranı = Brüt satış kârı / Net satışlar
    × 100 olduğuna göre işletmenin brüt satış kârı oranı yüzde kaçtır?
  secenekler:
    A: 30,00
    B: 37,50
    C: 50,00
    D: 60,00
    E: 80,00
  dogru: B
  aciklama:
    dogru_neden: 'Brüt satışlar liste fiyatıyla 400 × 2 = 800 bin ₺, satış iskontosu 800 × %20 = 160 bin ₺, net
      satışlar 800 − 160 = 640 bin ₺''dir. Brüt satış kârı 640 − 400 = 240 bin ₺; brüt satış kârı oranı 240 / 640
      × 100 = %37,50''dir.


      Püf noktaları: Önce net satışı bulmalısın; satış iskontosu brüt satıştan düşülür ve oranın paydası net satışlardır.
      Maliyete eklenen kâr payı (%100) ile satış üzerinden kâr oranı farklı şeylerdir; iskontoyu da yüzde puan olarak
      kâr oranından düşemezsin.'
    celdiriciler:
      A: İskontonun yüzdesi, iskontosuz brüt kâr oranından (%50) yüzde puan olarak düşülerek bulunur (50 − 20);
        iskonto satış tutarını, dolayısıyla paydayı da değiştirir.
      C: İskonto dikkate alınmadan 400 / 800 hesaplanmıştır; payda net satışlardır.
      D: Brüt kâr maliyete bölünmüştür (240 / 400); oran net satışlar üzerinden hesaplanır.
      E: Maliyet üzerindeki %100 kâr payından iskonto oranı yüzde puan olarak düşülmüştür; hem baz hem yöntem yanlıştır.
    hesap_adimlari:
    - 'Brüt satışlar: 400 × 2 = 800 bin ₺'
    - 'Satış iskontosu: 800 × 0,20 = 160 bin ₺'
    - 'Net satışlar: 800 − 160 = 640 bin ₺'
    - 'Brüt satış kârı: 640 − 400 = 240 bin ₺'
    - 'Brüt satış kârı oranı: 240 / 640 × 100 = %37,50'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Ayrıntılı gelir tablosu (satış indirimleri)
    alinti: B _ SATIŞ İNDİRİMLERİ (-) 1. SATIŞTAN İADELER (-) 2. SATIŞ İSKONTOLARI (-)
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları (hakemli anlatım TAB/KAR §3)
    madde: Brüt satış kârı oranı = Brüt satış kârı / Net satışlar × 100
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'maliyet = 400

      brut_satis = maliyet * 2

      net_satis = brut_satis * (1 - 0.20)

      brut_kar = net_satis - maliyet

      sonuc = round(brut_kar / net_satis * 100, 2)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi M1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: gecti
        tarih: '2026-10-19'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: gecti
        not: 'c1: B (güven 5); c2: B (güven 5)'
        tarih: '2026-10-19'
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'baş hakem: tek tek okundu, hesaplar doğrulandı'
      G6:
        sonuc: gecti
        tarih: '2026-10-19'
        not: alıntılar mevzuat metninde doğrulandı; yöntem sorularında formül kökte/açıklamada
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_M1.yaml, satır 29
