  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: varlık ve özkaynak kârlılığı
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin 2026 yılı dönem net kârı 240 bin ₺'dir. Vergi gideri dönem kârının (vergi öncesi kâr) %20'si
    kadardır; olağandışı gelir ve gider yoktur. Dönemin finansman giderleri 100 bin ₺'dir. Toplam aktif dönem başında
    1.800 bin ₺, dönem sonunda 2.200 bin ₺'dir. Ekonomik rantabilite = (Vergi öncesi kâr + Finansman giderleri)
    / Ortalama toplam aktif × 100 olduğuna göre işletmenin ekonomik rantabilitesi yüzde kaçtır?
  secenekler:
    A: 12,00
    B: 15,00
    C: 17,00
    D: 18,18
    E: 20,00
  dogru: E
  aciklama:
    dogru_neden: 'Vergi gideri vergi öncesi kârın %20''si olduğundan net kâr vergi öncesi kârın %80''idir: vergi
      öncesi kâr 240 / 0,80 = 300 bin ₺. Faiz ve vergi öncesi kâr 300 + 100 = 400 bin ₺; ortalama toplam aktif (1.800
      + 2.200) / 2 = 2.000 bin ₺. Ekonomik rantabilite 400 / 2.000 × 100 = %20''dir.


      Püf noktaları: Vergi öncesi kârı net kârdan geriye doğru bulurken vergiyi net kârın değil vergi öncesi kârın
      yüzdesi olarak düşün (240 / 0,80). Pay faiz ve vergi öncesi kârdır, payda ise dönem sonu değil ortalama aktiftir.'
    celdiriciler:
      A: Dönem net kârı ortalama aktife bölünmüştür (240 / 2.000); bu varlık kârlılığıdır, ekonomik rantabilite
        değildir.
      B: Vergi öncesi kâr bulunmuş ancak finansman giderleri eklenmemiştir (300 / 2.000).
      C: Finansman giderleri net kâra eklenmiş, vergi geri eklenmemiştir (340 / 2.000).
      D: Pay doğru bulunmuş ancak ortalama yerine dönem sonu aktif kullanılmıştır (400 / 2.200).
    hesap_adimlari:
    - 'Vergi öncesi kâr: 240 / (1 − 0,20) = 300'
    - 'Faiz ve vergi öncesi kâr: 300 + 100 = 400'
    - 'Ortalama toplam aktif: (1.800 + 2.200) / 2 = 2.000'
    - 'Ekonomik rantabilite: 400 / 2.000 × 100 = %20'
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları (hakemli anlatım TAB/KAR §5)
    madde: Ekonomik rantabilite = (Vergi öncesi kâr + Finansman giderleri) / Ortalama toplam aktif
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'net_kar = 240

      vok = net_kar / (1 - 0.20)

      fvok = vok + 100

      ort_aktif = (1800 + 2200) / 2

      sonuc = round(fvok / ort_aktif * 100, 2)'
