- id: SMMM-TAB-KAR-0018
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: varlık ve özkaynak kârlılığı
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin yönetimi 2027 yılı için %18 özkaynak kârlılığı hedeflemektedir. Ortalama özkaynakların 2.000
    bin ₺, finansman giderlerinin 120 bin ₺ olacağı; vergi giderinin vergi öncesi kârın %25'i olacağı, diğer faaliyetlerden
    gelir ve gider ile olağandışı kalem oluşmayacağı öngörülmektedir. İşletmenin brüt satış kârı oranı %40, faaliyet
    kâr oranı %15 olarak planlanmıştır. Özkaynak kârlılığı = Dönem net kârı / Ortalama özkaynaklar × 100 olduğuna
    göre hedefe ulaşmak için gerekli net satış tutarı kaç bin ₺'dir?
  secenekler:
    A: '4.000'
    B: '3.800'
    C: '3.200'
    D: '2.400'
    E: '1.500'
  dogru: A
  aciklama:
    dogru_neden: 'Gerekli net kâr 2.000 × %18 = 360 bin ₺''dir. Vergi vergi öncesi kârın %25''i olduğundan vergi
      öncesi kâr 360 / 0,75 = 480 bin ₺''dir. Diğer faaliyet ve olağandışı kalem olmadığından faaliyet kârı = vergi
      öncesi kâr + finansman giderleri = 480 + 120 = 600 bin ₺. Faaliyet kâr oranı %15 olduğundan net satışlar 600
      / 0,15 = 4.000 bin ₺''dir.


      Püf noktaları: Gelir tablosunu aşağıdan yukarı çıkmalısın: net kâr → vergi öncesi kâr → faaliyet kârı → net
      satış. Vergiyi net kârın %25''i sanma; brüt kâr oranı (%40) çözümde kullanılmayan veridir.'
    celdiriciler:
      B: 'Vergi, net kârın %25''i sanılmıştır: 360 × 1,25 = 450; (450 + 120) / 0,15 = 3.800. Vergi, vergi öncesi
        kârın %25''idir.'
      C: 'Finansman giderleri eklenmemiştir: 480 / 0,15 = 3.200. Faaliyet kârı finansman giderinden önceki kârdır.'
      D: Net kâr doğrudan faaliyet kâr oranına bölünmüştür (360 / 0,15); vergi ve finansman giderleri dikkate alınmamıştır.
      E: Faaliyet kârı brüt satış kârı oranına bölünmüştür (600 / 0,40); faaliyet kârı faaliyet kâr oranıyla ilişkilendirilmelidir.
    hesap_adimlari:
    - 'Gerekli net kâr: 2.000 × 0,18 = 360'
    - 'Vergi öncesi kâr: 360 / 0,75 = 480'
    - 'Faaliyet kârı: 480 + 120 = 600'
    - 'Net satışlar: 600 / 0,15 = 4.000'
    - Brüt kâr oranı (%40) çözümde kullanılmaz.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları (hakemli anlatım TAB/KAR §9)
    madde: 'Hedef orandan geri hesap: Özkaynak kârlılığı = Dönem net kârı / Ortalama özkaynaklar; Faaliyet kâr oranı
      = Faaliyet kârı / Net satışlar'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'net_kar = 2000 * 0.18

      vok = net_kar / (1 - 0.25)

      faaliyet_kari = vok + 120

      sonuc = round(faaliyet_kari / 0.15, 2)'
