- id: SMMM-TAB-KAR-0017
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: DuPont
  tip: hesaplama
  zorluk: 2
  kok: 'Bir işletmenin 2026 yılına ait verileri (bin ₺) şöyledir: net satışlar 3.000; dönem net kârı 240; ortalama
    toplam aktif 2.400; ortalama toplam yabancı kaynaklar 1.440. DuPont analizine göre Özkaynak kârlılığı = Net
    kâr marjı × Aktif devir hızı × (Ortalama toplam aktif / Ortalama özkaynaklar) olduğuna göre işletmenin özkaynak
    kârlılığı yüzde kaçtır?'
  secenekler:
    A: 10,00
    B: 16,67
    C: 20,00
    D: 25,00
    E: 62,50
  dogru: D
  aciklama:
    dogru_neden: 'Net kâr marjı 240 / 3.000 = %8; aktif devir hızı 3.000 / 2.400 = 1,25; ortalama özkaynaklar 2.400
      − 1.440 = 960, özkaynak çarpanı 2.400 / 960 = 2,5. Özkaynak kârlılığı = %8 × 1,25 × 2,5 = %25 (kontrol: 240
      / 960 = %25).'
    celdiriciler:
      A: Özkaynak çarpanı unutulmuştur; %8 × 1,25 = %10 varlık kârlılığıdır.
      B: Payda olarak özkaynak yerine yabancı kaynaklar kullanılmıştır (240 / 1.440); özkaynak çarpanı Toplam aktif
        / Özkaynaklardır.
      C: Aktif devir hızı atlanmıştır (%8 × 2,5); DuPont'ta üç çarpan birlikte kullanılır.
      E: Aktif devir hızı yerine özkaynak devir hızı (3.000 / 960 = 3,125) kullanılmıştır; DuPont'ta devir hızı
        net satışlar / toplam aktiftir.
    hesap_adimlari:
    - 'Net kâr marjı: 240 / 3.000 = 0,08'
    - 'Aktif devir hızı: 3.000 / 2.400 = 1,25'
    - 'Ortalama özkaynaklar: 2.400 − 1.440 = 960'
    - 'Özkaynak çarpanı: 2.400 / 960 = 2,5'
    - 'Özkaynak kârlılığı: 0,08 × 1,25 × 2,5 = 0,25 → %25'
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları (hakemli anlatım TAB/KAR §7)
    madde: 'DuPont: Özkaynak kârlılığı = Net kâr marjı × Aktif devir hızı × Özkaynak çarpanı'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'marj = 240 / 3000

      devir = 3000 / 2400

      ozkaynak = 2400 - 1440

      carpan = 2400 / ozkaynak

      sonuc = round(marj * devir * carpan * 100, 2)'
