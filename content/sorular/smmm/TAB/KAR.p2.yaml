  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin yıllık gelir tablosu verileri aşağıdadır.


    | Kalem | Tutar (₺) |

    |---|---|

    | Brüt satışlar | 1.650.000 |

    | Satıştan iadeler (−) | 50.000 |

    | Satışların maliyeti (−) | 1.040.000 |

    | Faaliyet giderleri (−) | 300.000 |

    | Finansman giderleri (−) | 110.000 |


    Dönem kârı vergi karşılığı vergi öncesi kârın %20''idir. Net kâr marjı yüzde kaçtır?'
  secenekler:
    A: '%7,27'
    B: '%7,5'
    C: '%9,38'
    D: '%13'
    E: '%21,43'
  dogru: B
  aciklama:
    dogru_neden: 'Net satışlar 1.600.000 ₺; brüt kâr 560.000; faaliyet kârı 260.000; vergi öncesi kâr 150.000; net kâr 120.000
      ₺. Net kâr marjı %7,5''dir. Püf noktaları: Satıştan iadeler brüt satıştan düşülür; sonra kalemleri sırayla işle, vergiyi
      unutma. Payda net satıştır.'
    celdiriciler:
      A: Payda olarak net satışlar yerine brüt satışlar alınmış.
      C: Vergi karşılığı düşülmemiş; bu vergi öncesi kâr marjıdır.
      D: Finansman giderleri düşülmemiş.
      E: Payda olarak net satışlar yerine brüt satış kârı alınmış.
