- id: SMMM-TAB-KAR-0021
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: brüt satış kârı oranı
  tip: hesaplama
  zorluk: 1
  kok: Bir işletmenin brüt satışları 1.260.000 ₺, satış iskontoları ve iadeleri 60.000 ₺, satışların maliyeti 870.000 ₺'dir.
    Brüt satış kârı oranı yüzde kaçtır?
  secenekler:
    A: '%5'
    B: '%27,5'
    C: '%30,95'
    D: '%37,93'
    E: '%72,5'
  dogru: B
  aciklama:
    dogru_neden: Net satışlar = 1.260.000−60.000 = 1.200.000 ₺; brüt satış kârı = 1.200.000−870.000 = 330.000 ₺. Brüt satış
      kârı oranı = 330.000/1.200.000 = %27,5'dir. Payda daima net satışlardır (60 Brüt Satışlar, 61 Satış İndirimleri).
    celdiriciler:
      A: Satış indirimlerinin net satışlara oranı bulunmuş; kâr oranı değildir.
      C: Payda olarak net satışlar yerine brüt satışlar alınmış; iskonto ve iadeler düşülmemiş.
      D: Brüt kâr satışların maliyetine oranlanmış; marj net satışlar üzerinden hesaplanır.
      E: Satışların maliyetinin net satışlara oranı bulunmuş; brüt kâr oranı değildir.
    hesap_adimlari:
    - Net satışlar = 1.260.000 − 60.000 = 1.200.000
    - Brüt satış kârı = 1.200.000 − 870.000 = 330.000
    - Oran = 330.000 / 1.200.000 × 100 = 27,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap grubu 60 - Brüt Satışlar
    alinti: İşletmenin esas faaliyetleri çerçevesinde satılan mal yada hizmetler karşılığında alınan yada tahakkuk ettirilen
      toplam değerleri kapsar.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap grubu 61 - Satış İndirimleri
    alinti: Net satış hasılatına ulaşabilmek için brüt satışlardan indirilmesi gereken değerleri kapsar.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap grubu 62 - Satışların Maliyeti
    alinti: İşletmenin dönem içindeki stok hareketleri ile satılan mamul, yarı mamul, ilk madde ve malzeme ile ticari mal
      gibi maddelerin ve satılan hizmetlerin maliyetini kapsar.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bs=1260000; isk=60000; smm=870000

      sonuc = round((bs-isk-smm)/(bs-isk)*100, 2)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude-sonnet-5-5)'
    istem_surumu: uretici paketi SMMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-02'
      G4:
        sonuc: gecti
        not: dogrulama.python doğru şıkla tuttu
        tarih: '2026-11-02'
      G7:
        sonuc: gecti
        not: çıkmış (SGS 2004–2026, SMMM 2026) ve banka; kalıp hariç 4-gram + ortak şık
        tarih: '2026-11-02'
      G3:
        sonuc: gecti
        not: bağımsız denetçi kör çözüm (16 grup) + 70 soruluk kör örneklem 70/70
        tarih: '2026-11-02'
      G5:
        sonuc: gecti
        not: 'denetçi: tek doğru, güncel hüküm (Kasım 2026)'
        tarih: '2026-11-02'
      G6:
        sonuc: gecti
        not: alıntı resmî metin/hakemli anlatımda birebir
        tarih: '2026-11-02'
      GZ:
        sonuc: bekliyor
  gecmis:
