      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: B (güven 5) Ort. özkaynak (700+800)/2=750; 120/750=%16.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Anahtar B: 120 / ((700 + 800) / 2) × 100 = 16,00. A 15,00 (yıl sonu), C 17,14 (yıl başı), D 20,00 (vergi öncesi
          kâr), E 29,33 (faaliyet kârı) doğrulandı. Formül ve ortalama kuralı kökte açık.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: Özkaynak kârlılığı formülü kökte açık, ders kitabı tanımıyla tutarlı; dogrulama.python 16 ile aynı.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (B, güven 5)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
