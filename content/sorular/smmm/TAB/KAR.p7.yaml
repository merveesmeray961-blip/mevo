- id: SMMM-TAB-KAR-0004
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: brüt ve faaliyet kâr oranı
  tip: hesaplama
  zorluk: 2
  kok: Bir işletmenin net satışları 2.000 bin TL, brüt satış kârı 500 bin TL ve faaliyet kârı 300 bin TL'dir. Brüt kâr oranı
    = brüt satış kârı / net satışlar × 100, faaliyet kâr oranı = faaliyet kârı / net satışlar × 100 olarak alınacaktır. Bu
    iki oran arasındaki fark kaç yüzde puanıdır?
  secenekler:
    A: '5'
    B: '10'
    C: '15'
    D: '20'
    E: '25'
  dogru: D
  aciklama:
    dogru_neden: Brüt kâr oranı 500 / 2.000 × 100 = %25, faaliyet kâr oranı 300 / 2.000 × 100 = %15'tir. Aradaki fark 10 yüzde
      puanıdır.
    celdiriciler:
      A: Brüt oran %20 kabul edilerek 5 puan fark bulunmuştur.
      B: İki oran arasındaki fark yerine faaliyet kârı tutarı esas alınmıştır.
      C: '%25 ile %15 farkı 15 puan olarak yanlış hesaplanmıştır.'
      E: '%25 + %15 = %40 alınmıştır; soru farkı sormaktadır.'
    hesap_adimlari:
    - 'Brüt kâr oranı: %25'
    - 'Faaliyet kâr oranı: %15'
    - 'Fark: 10 yüzde puanı'
  kaynaklar:
  - mevzuat: MSUGT Sıra No 1 – Ek 4
    madde: Gelir tablosu tanımı
    alinti: Gelir tablosu, işletmenin belli bir dönemde elde ettiği tüm gelirler ile aynı dönemde katlandığı bütün maliyet
      ve giderleri ve bunların sonucunda işletmenin elde ettiği dönem net kârını veya dönem net zararını kapsar.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 500/2000*100 - 300/2000*100
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_TAB.yaml, satır ristaycraft_TAB-2026-10-06-G01 #13'
  - tarih: '2026-10-07'
    kim: otomatik
    ne: 'durum: taslak → geri_cekildi.'
    neden: otomatik kapı hatası veya bankada aynı kök
- id: SMMM-TAB-KAR-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: brüt ve faaliyet kâr oranı
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin net satışları 2.400 bin ₺, brüt satış kârı 600 bin ₺ ve faaliyet kârı 240 bin ₺dir. Brüt kâr oranı =
    brüt satış kârı / net satışlar × 100 ve faaliyet kâr oranı = faaliyet kârı / net satışlar × 100 olarak alınacaktır. Bu
    iki oran aşağıdakilerden hangisidir?
  secenekler:
    A: '%20 ve %10'
    B: '%25 ve %8'
    C: '%25 ve %10'
    D: '%30 ve %8'
    E: '%40 ve %10'
  dogru: C
  aciklama:
    dogru_neden: 'Brüt kâr oranı 600 / 2.400 × 100 = %25; faaliyet kâr oranı 240 / 2.400 × 100 = %10dur. Püf noktaları: İki
      oran için de paydada net satışlar kullanılır; brüt satışlar veya toplam aktif payda yapılmaz.'
    celdiriciler:
      A: '%20 ve %10, brüt satış kârının net satışlara değil 3.000 bin ₺ gibi farklı bir satış tutarına oranlanmasıyla oluşur.'
      B: '%25 ve %8, faaliyet kârının 240 yerine 192 bin ₺ alınmasıyla elde edilen hatalı orandır.'
      D: '%30 ve %8, hem brüt kâr hem faaliyet kârı paylarının değiştirilmesinden kaynaklanır.'
      E: '%40 ve %10, brüt satış kârının net satışlara oranı yerine 600 / 1.500 işleminin kullanılmasından doğar.'
    hesap_adimlari:
    - 'Brüt kâr oranı: 600 / 2.400 × 100 = %25'
    - 'Faaliyet kâr oranı: 240 / 2.400 × 100 = %10'
  kaynaklar:
  - mevzuat: MSUGT 1 Sıra No.lu Genel Tebliğ — Gelir Tablosu İlkeleri
    madde: 1. Gelir Tablosu İlkeleri
    alinti: Gelir tablosu ilkelerinin amacı; satışların, gelirlerin, satışlar maliyetinin, giderlerin, kâr ve zararlara ait
      hesapların ve belli dönemlere ait işletme faaliyeti sonuçlarının sınıflandırılmış ve gerçeğe uygun olarak gösterilmesini
      sağlamaktır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'brut = 600 / 2400 * 100

      faaliyet = 240 / 2400 * 100

      sonuc = (brut, faaliyet)'
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_TAB.yaml, satır ristaycraft_TAB-2026-10-06-G03 #3'
