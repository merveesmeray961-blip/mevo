- id: SMMM-TAB-KAR-0008
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Kârlılık oranları
  konu: KAR
  kazanim: brüt ve faaliyet kâr oranı
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin net satışları 1.000 bin ₺, satışların maliyeti 600 bin ₺, faaliyet giderleri 250 bin ₺'dır.
    Yönetim, brüt kâr oranının yüksek olmasına karşın faaliyet kâr oranının düşük olmasını araştırıyor. İki oran
    arasındaki farkı en doğru açıklayan seçenek hangisidir?
  secenekler:
    A: Brüt kâr oranı %25, faaliyet kâr oranı %40’tır; fark satış maliyetindendir.
    B: Brüt kâr oranı %40, faaliyet kâr oranı %15’tir; fark faaliyet giderlerindendir.
    C: Her iki oran da %15’tir; faaliyet giderleri oranı etkilemez.
    D: Brüt kâr oranı %60, faaliyet kâr oranı %25’tir; fark faaliyet giderlerindendir.
    E: Faaliyet kâr oranı brüt kâr oranından yüksektir; fark satış maliyetinden kaynaklanır.
  dogru: B
  aciklama:
    dogru_neden: 'Brüt kâr 400, faaliyet kârı 400−250=150 bin ₺''dır. Net satışlara oranları sırasıyla %40 ve %15’tir.
      Püf noktaları: Faaliyet giderleri brüt kâr ile faaliyet kârı arasındaki farkı oluşturur.'
    celdiriciler:
      A: Brüt kâr 400’dür; %25 değildir.
      C: Brüt kâr oranı %40’tır.
      D: '%60 satışların maliyeti oranıdır.'
      E: Faaliyet giderleri nedeniyle faaliyet kâr oranı daha düşük olabilir.
    hesap_adimlari:
    - Brüt kâr = 1.000 − 600 = 400
    - Faaliyet kârı = 400 − 250 = 150
    - Brüt kâr oranı = 400/1.000×100 = %40
    - Faaliyet kâr oranı = 150/1.000×100 = %15
  kaynaklar:
  - mevzuat: MSUGT Sıra No 1 – Ek 4
    madde: Gelir tablosu ve satışların maliyeti
    alinti: Gelir tablosu, işletmenin belli bir dönemde elde ettiği tüm gelirler ile aynı dönemde katlandığı bütün
      maliyet ve giderleri ve bunların sonucunda işletmenin elde ettiği dönem net kârını veya dönem net zararını
      kapsar.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (1000 - 600 - 250) / 1000 * 100
  durum: kontrolde
  surum: 2
