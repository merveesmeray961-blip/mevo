- id: SMMM-TAB-KAR-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: KAR
  kazanim: Brüt satış kârlılığı
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  ortak_veri: TAB-SET-01
  kok: 'MK A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** | | | |

    | Hazır Değerler | 60 | 70 | 100 |

    | Ticari Alacaklar | 120 | 140 | 160 |

    | Stoklar | 130 | 145 | 175 |

    | Diğer Dönen Varlıklar | 30 | 45 | 65 |

    | **Dönen Varlıklar** | **340** | **400** | **500** |

    | Maddi Duran Varlıklar (net) | 460 | 500 | 540 |

    | **Toplam Aktif** | **800** | **900** | **1.040** |

    | Kısa Vadeli Mali Borçlar | 70 | 80 | 120 |

    | Ticari Borçlar | 60 | 70 | 90 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 30 | 40 | 40 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **160** | **190** | **250** |

    | Uzun Vadeli Mali Borçlar | 240 | 230 | 190 |

    | Ödenmiş Sermaye | 300 | 300 | 300 |

    | Geçmiş Yıllar Kârları | 40 | 100 | 180 |

    | Dönem Net Kârı | 60 | 80 | 120 |

    | **Özkaynaklar** | **400** | **480** | **600** |

    | **Toplam Pasif** | **800** | **900** | **1.040** |

    | **GELİR TABLOSU** | | | |

    | Brüt Satışlar | 840 | 1.050 | 1.260 |

    | Satış İndirimleri (-) | 40 | 50 | 60 |

    | Net Satışlar | 800 | 1.000 | 1.200 |

    | Satışların Maliyeti (-) | 640 | 780 | 960 |

    | Brüt Satış Kârı | 160 | 220 | 240 |

    | Faaliyet Giderleri (-) | 50 | 70 | 60 |

    | Faaliyet Kârı | 110 | 150 | 180 |

    | Finansman Giderleri (-) | 35 | 50 | 30 |

    | Dönem Kârı (vergi öncesi) | 75 | 100 | 150 |

    | Vergi Karşılığı (-) | 15 | 20 | 30 |

    | Dönem Net Kârı | 60 | 80 | 120 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.

    Brüt satış kârlılığı = Brüt satış kârı / Net satışlar × 100 formülüyle hesaplandığına göre MK A.Ş.''nin 2026
    yılı brüt satış kârlılığı yüzde kaçtır?'
  secenekler:
    A: 10,00
    B: 15,00
    C: 19,05
    D: 20,00
    E: 25,00
  dogru: D
  aciklama:
    dogru_neden: 2026 brüt satış kârı 240 bin ₺, net satışlar 1.200 bin ₺'dir. Brüt satış kârlılığı 240 / 1.200
      × 100 = %20'dir.
    hesap_adimlari:
    - 'Brüt satış kârı (2026): 1.200 - 960 = 240'
    - 'Brüt satış kârlılığı: 240 / 1.200 × 100 = 20,00'
    celdiriciler:
      A: 10,00 net kâr marjıdır (120 / 1.200); payda net satışlar doğru alınmış, ancak pay olarak brüt satış kârı
        yerine dönem net kârı kullanılmıştır.
      B: 15,00 faaliyet kâr marjıdır (180 / 1.200); payda net satışlar doğru alınmış, ancak pay olarak brüt satış
        kârı yerine faaliyet kârı kullanılmıştır.
      C: 19,05, payda olarak net satışlar yerine brüt satışlar (240 / 1.260) alındığında bulunur.
      E: 25,00, payda olarak net satışlar yerine satışların maliyeti (240 / 960) alındığında bulunur; bu oran brüt
        satış kârlılığı değil, maliyet üzerinden kâr ekleme oranıdır (brüt satış kârı / satışların maliyeti).
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Brüt satış kârlılığı = Brüt satış kârı / Net satışlar
    alinti: ''
  dogrulama:
    python: 'bsk = 1200 - 960

      sonuc = round(bsk / 1200 * 100, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: A ve B çeldirici açıklamaları düzeltildi (dönem net kârı ve faaliyet kârı PAY'dadır, payda net satışlardır);
      E açıklamasında terim 'maliyet üzerinden kâr ekleme oranı' olarak düzeltildi.
    neden: 'G6 kaldı: A ve B açıklamalarında pay/payda karıştırılmıştı; E''deki terim yanlıştı.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: Kökteki soru cümlesini ikiye bölen satır sonu kaldırıldı (soru cümlesi tek paragraf); gecerlilik.baslangic
      yöntem sorusu kuralına (2026-01-01) çekildi.
    neden: 'G5 (küçük, biçimsel): satır sonu cümleyi bölüyordu (aynı kusur ortak veri setli diğer sorularda da vardı);
      baslangic soru üretim tarihiydi.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
      G3:
        sonuc: gecti
        not: 'A: D (güven 5); B: D (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 4)
- id: SMMM-TAB-KAR-0002
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: KAR
  kazanim: DuPont analizi ve finansal kaldıraç
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: P İşletmesi'nin dönem sonu değerlerine göre vergi öncesi kâr marjı (Vergi öncesi kâr / Net satışlar) %10,
    aktif devir hızı (Net satışlar / Toplam aktif) 1,6, cari oranı 1,8 ve özkaynak kârlılığı (Dönem net kârı / Özkaynaklar)
    %30'dur. Dönemin vergi gideri vergi öncesi kârın %25'idir. DuPont analizine göre P İşletmesi'nin toplam yabancı
    kaynaklarının toplam aktife oranı yüzde kaçtır?
  secenekler:
    A: 40,00
    B: 46,67
    C: 60,00
    D: 71,43
    E: 150,00
  dogru: C
  aciklama:
    dogru_neden: 'Net kâr marjı = vergi öncesi kâr marjı × (1 − vergi oranı) = %10 × 0,75 = %7,5. DuPont''a göre
      aktif kârlılığı = net kâr marjı × aktif devir hızı = %7,5 × 1,6 = %12. Özkaynak kârlılığı = aktif kârlılığı
      × özkaynak çarpanı (Toplam aktif / Özkaynaklar) olduğundan özkaynak çarpanı 30 / 12 = 2,5''tir. Özkaynaklar
      toplam aktifin 1 / 2,5 = %40''ı, yabancı kaynaklar ise %100 − %40 = %60''ıdır.


      Püf noktaları: Zincirleme gidin: vergi etkisi, net kâr marjı, aktif kârlılığı, özkaynak çarpanı, finansal
      yapı; özkaynak kârlılığından geriye doğru finansal yapıya ulaşılır. Cari oran çözüme etki etmeyen veridir.
      Tuzaklar: DuPont''ta net kâr marjı yerine vergi öncesi kâr marjını kullanmak (B), özkaynak çarpanını yabancı
      kaynak / özkaynak oranıyla karıştırmak (D), sorulan oranın tümleyenini (özkaynak / toplam aktif) vermek (A).'
    hesap_adimlari:
    - 'Net kâr marjı: 10 × (1 − 0,25) = %7,5'
    - 'Aktif kârlılığı: 7,5 × 1,6 = %12'
    - 'Özkaynak çarpanı (Toplam aktif / Özkaynaklar): 30 / 12 = 2,5'
    - 'Özkaynaklar / Toplam aktif: 1 / 2,5 = 0,40'
    - 'Yabancı kaynaklar / Toplam aktif: 1 − 0,40 = 0,60 → %60'
    - Cari oran (1,8) çözümde kullanılmaz.
    celdiriciler:
      A: 40,00 özkaynakların toplam aktife oranıdır (1 / 2,5); soru yabancı kaynakların toplam aktife oranını sormaktadır.
      B: 46,67, vergi etkisi düşülmeden vergi öncesi kâr marjıyla aktif kârlılığı bulunup (%10 × 1,6 = %16) özkaynak
        çarpanı 30 / 16 = 1,875 alındığında bulunur (1 − 1 / 1,875); DuPont'ta dönem net kârına dayanan net kâr
        marjı kullanılır.
      D: 71,43, özkaynak çarpanı (2,5) yabancı kaynak / özkaynak oranı sanılarak 2,5 / 3,5 hesaplandığında bulunur.
      E: 150,00 yabancı kaynakların özkaynaklara oranıdır (60 / 40); soru toplam aktife oranı sormaktadır.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: 'DuPont: Özkaynak kârlılığı = Net kâr marjı × Aktif devir hızı × (Toplam aktif / Özkaynaklar); Net kâr
      marjı = Vergi öncesi kâr marjı × (1 − vergi oranı)'
    alinti: ''
  dogrulama:
    python: 'net_marj = 10 * (1 - 0.25)

      aktif_karliligi = net_marj * 1.6

      carpan = 30 / aktif_karliligi

      celdirici_b = round((1 - 1 / (30 / (10 * 1.6))) * 100, 2)

      sonuc = round((1 - 1 / carpan) * 100, 2)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 4
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: Kökten standart 'Devir hızlarında ortalama değerler…' cümlesi çıkarıldı (soru dönem sonu değerleriyle).
    neden: 'G5 (küçük): ''dönem sonu değerlerine göre'' ifadesiyle standart cümle çelişkili okunabiliyordu.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: net kâr marjı yerine vergi öncesi kâr marjı (%10) ve vergi oranı (%25) verildi (net
      marj %7,5 hesaplanır), aktif devir hızı 1,6 yapıldı, gereksiz veri olarak cari oran eklendi; doğru cevap yine
      %60 (C). Zayıf çeldiriciler (82,22 ve 250,00) gerçek aday hatalarıyla (40,00: tümleyen; 46,67: vergi öncesi
      marj) değiştirildi; dogru_neden teknikleri ve tuzakları adlandırıyor; hesap_adimlari, dogrulama.python ve
      kaynak tanımı güncellendi; baslangic 2026-01-01.'
    neden: 'GZ: zor etiketli ama ortalama aday rahat çözdü (güven 5) → zorlaştır; baslangic soru üretim tarihiydi.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: Teknik not 'Püf noktaları:' biçimine getirildi (uretim.md §7).
    neden: DUZELTME_LISTESI.md 'Açıklama biçimi (21 soru)'; açıklamanın içeriği değişmedi.
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
