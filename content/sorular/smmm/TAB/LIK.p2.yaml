    A: Stoklar 200.000 ₺'dir ve dönen varlıkların yüzde 25'ini oluşturur
    B: Stoklar 600.000 ₺'dir ve dönen varlıkların yüzde 75'ini oluşturur
    C: Stoklar 800.000 ₺'dir ve dönen varlıkların tamamını oluşturur
    D: Stoklar 200.000 ₺'dir ve dönen varlıkların yüzde 75'ini oluşturur
    E: Stoklar 1.400.000 ₺'dir ve dönen varlıkların yüzde 25'ini oluşturur
  dogru: A
