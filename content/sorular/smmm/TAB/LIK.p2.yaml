    - (540.000 − x) / (330.000 − x) = 2
    - 540.000 − x = 660.000 − 2x
    - x = 120.000 ₺
    - 'Kontrol: 420.000 / 210.000 = 2'
    celdiriciler:
      A: Yalnız paydadan düşülmüş, dönen varlıkların da azalacağı dikkate alınmamıştır (540.000 / (330.000 − x) = 2 için x
        = 60.000).
      C: Kısa vadeli yabancı kaynakların tamamı ödenmiştir; bu durumda payda sıfır olur ve oran tanımsızdır.
      D: Hedef dönen varlık tutarı (2 × 330.000) ödeme sayılmıştır; ödeme hem payı hem paydayı azaltır.
      E: Mevcut ve hedef dönen varlık tutarları toplanmıştır (540.000 + 660.000).
