    C: Kaldıraç oranı yüzde 125'tir.
    D: Duran varlıklar tamamen özkaynaklarla finanse edilmiştir.
    E: Net işletme sermayesi negatiftir ve cari oran 1'in altındadır.
  dogru: E
  aciklama:
    dogru_neden: 'Oran 1,25 ise duran varlıklar devamlı sermayeden büyüktür. Net işletme sermayesi devamlı sermaye − duran
      varlıklar olduğundan negatiftir; yani dönen varlıklar kısa vadeli yabancı kaynakların altında kalır, cari oran 1''in
      altındadır ve duran varlıkların bir kısmı kısa vadeli borçla finanse edilmiştir. Püf noktaları: Bilanço eşitliğinden
      net işletme sermayesi = devamlı sermaye − duran varlıklar yazılabilir. Oran 1''i aştığında pay payda''dan büyük olduğundan
      fark negatif çıkar; cari oranın 1''in altında kalması da buna bağlıdır.'
