    alinti: Dönen varlıklar, raporlama döneminden sonraki on iki ay içinde nakde dönüşmesi beklenmese dahi, normal faaliyet
      döngüsünün bir parçası olarak satılan, tüketilen veya nakde çevrilen varlıkları (örneğin, stokları ve ticari alacakları)
