  aciklama:
    dogru_neden: 'Verilen formülde stoklar ve gelecek aylara ait giderler düşülür: 1.100.000 − 400.000 − 100.000 = 600.000
      ₺. Oran 600.000 / 500.000 = 1,2''dir.'
