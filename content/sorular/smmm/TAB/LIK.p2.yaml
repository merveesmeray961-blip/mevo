      B: Cari oran dönen varlıkların kısa vadeli yabancı kaynaklara oranıdır; bu bilgiyle 1,25 bulunamaz, ayrıca oran 1'in
        altındadır.
      C: Kaldıraç oranı toplam yabancı kaynakların toplam aktife oranıdır ve 1'i aşamaz; verilen oranla bulunamaz.
      D: Duran varlıklar devamlı sermayeden bile fazladır; özkaynak tutarı bu bilgiyle belirlenemez ve duran varlıkların tamamı
