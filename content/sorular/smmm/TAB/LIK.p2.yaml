  kok: Dönen varlıkları 1.090.000 ₺ olan bir işletmenin stokları 400.000 ₺, kısa vadeli yabancı kaynakları 500.000 ₺'dir.
    İşletme, vadesi gelen kısa vadeli borçlarının bir kısmını nakit ödeyerek likidite oranını ((dönen varlıklar − stoklar)
    / kısa vadeli yabancı kaynaklar) 1,5'e çıkarmak istemektedir. Ödenecek borç tutarı kaç ₺'dir?
  secenekler:
    A: 60.000 ₺
    B: 120.000 ₺
    C: 180.000 ₺
    D: 750.000 ₺
    E: 1.380.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Ödeme hem stok dışı dönen varlıkları hem kısa vadeli yabancı kaynakları x kadar azaltır: (690.000 − x) /
      (500.000 − x) = 1,5. Çözümde 0,5x = 60.000 ve x = 120.000 ₺ bulunur; kontrol: 570.000 / 380.000 = 1,5. Püf noktaları:
