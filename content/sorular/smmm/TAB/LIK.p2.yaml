      B: III numaralı işlemde de oran 1.000.000 / 1.800.000 = 0,56 olur ve 0,6'nın altına iner.
      C: II numaralı işlemde oran 1.400.000 / 2.200.000 = 0,64 olur ve yükselir; kredi hem yabancı kaynakları hem aktifi büyütür.
      D: II numaralı işlem oranı yükseltir (0,64); I numaralı işlem ise oranı 1.200.000 / 2.200.000 = 0,55'e düşürür.
      E: II numaralı işlem kaldıraç oranını artırır; oran 1,2 milyon yerine 1,4 milyonluk yabancı kaynağa çıkar.
