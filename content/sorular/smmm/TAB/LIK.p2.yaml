      x''in katsayısı 0,5''tir; son adımda 0,5''e bölmeyi unutma.'
    hesap_adimlari:
    - Stok dışı dönen varlıklar = 1.090.000 − 400.000 = 690.000
    - (690.000 − x) / (500.000 − x) = 1,5
    - 690.000 − x = 750.000 − 1,5x
    - 0,5x = 60.000 → x = 120.000 ₺
    - 'Kontrol: 570.000 / 380.000 = 1,5'
    celdiriciler:
