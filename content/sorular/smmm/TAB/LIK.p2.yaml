      A: 0,5, net işletme sermayesinin kısa vadeli yabancı kaynaklara oranıdır ((900.000 − 600.000) / 600.000); cari oranın
        payı dönen varlıkların tamamıdır.
      B: Pay ile payda ters alınmıştır (600.000 / 900.000).
      C: Stoklar düşülerek likidite (asit-test) oranı bulunmuştur ((900.000 − 300.000) / 600.000); cari oran stokları da içerir.
      E: Paya kısa vadeli yabancı kaynaklar da eklenmiştir ((900.000 + 600.000) / 600.000).
  kaynaklar:
