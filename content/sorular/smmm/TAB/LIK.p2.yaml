  aciklama:
    dogru_neden: 'Mevcut kaldıraç oranı 1.200.000 / 2.000.000 = 0,6''dır. I''de oran 1.200.000 / 2.200.000 = 0,55, III''te
      1.000.000 / 1.800.000 = 0,56 olur; ikisi de düşer. II''de oran 1.400.000 / 2.200.000 = 0,64 olur ve yükselir. Püf noktaları:
