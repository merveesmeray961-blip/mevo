    E: Dönen varlık olarak; çünkü on iki ay içinde nakde dönüşecektir
  dogru: D
  aciklama:
    dogru_neden: 'TMS 1 paragraf 66(a) uyarınca varlığın normal faaliyet döngüsü içinde realize edilmesinin beklenmesi dönen
      varlık sınıflaması için yeterlidir. Paragraf 68''e göre stoklar ve ticari alacaklar, raporlama döneminden sonraki on
      iki ay içinde nakde dönüşmesi beklenmese dahi dönen varlıklar içinde yer alır. Püf noktaları: On iki ay ölçütü yalnızca
      normal faaliyet döngüsünün belirlenemediği hâlde varsayılır; döngü 18 ay ise 16 ay sonra satılacak stok da dönen varlıktır.
      16 ay ile 18 ay karşılaştırması ise gereksiz bir tuzaktır.'
    celdiriciler:
      A: Stoklar, on iki ay içinde nakde dönüşmesi beklenmese dahi normal faaliyet döngüsü içinde satılıyorsa dönen varlıktır.
      B: 16 ay, 18 aylık normal faaliyet döngüsünden kısadır; stoklar bu döngü içinde satılır.
      C: Standart varlığı bölmeden, normal faaliyet döngüsü içinde realize edilecekse bütünüyle dönen varlık sayar.
      E: Stokların 16 ay sonra satılması beklenmektedir; sınıflandırma ölçütü normal faaliyet döngüsüdür, on iki ay değildir.
