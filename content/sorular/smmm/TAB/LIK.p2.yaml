  kok: 'Nakit oranı hesabında hazır değerler 200.000 ₺, menkul kıymetler 100.000 ₺, borç tarafında ise yalnızca 500.000 ₺
    kısa vadeli yabancı kaynak bulunmaktadır. Şu üç işlemden her biri tek başına gerçekleşirse hangisi ya da hangileri nakit
    oranını yükseltir?


    I. Ticari alacaklardan 100.000 ₺''nin tahsili

    II. Satıcılara olan 100.000 ₺ borcun nakden kapatılması

    III. 100.000 ₺ tutarında ticari malın peşin alınması'
  secenekler:
    A: I ve II
    B: II ve III
    C: I ve III
    D: Yalnız I
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Mevcut nakit oranı (200.000 + 100.000) / 500.000 = 0,6''dır. I''de nakit 100.000 ₺ artar ve oran 0,8 olur.
      II''de pay ve payda 100.000 ₺ azalır; oran 200.000 / 400.000 = 0,5 olur. III''te pay 100.000 ₺ azalır, oran 0,4 olur.
      Püf noktaları: Alacağın tahsili nakit oranını artırır, çünkü alacak payda yer almazken tahsil edilen nakit paya girer.
      Oran 1''in altındayken nakitle borç ödemesi payı borçtan daha büyük oranda azaltır; bu yüzden oran düşer.'
    celdiriciler:
      A: II numaralı işlemde oran (300.000 − 100.000) / (500.000 − 100.000) = 0,5 olur ve 0,6'dan düşer; oran 1'in altındayken
        nakitle borç ödemesi oranı azaltır.
      B: I numaralı işlem nakdi artırdığından oranı 0,8'e çıkarır; II ve III ise oranı düşürür.
      C: III numaralı işlemde nakit azalıp stok artar; oran 200.000 / 500.000 = 0,4 olur ve düşer.
      E: II ve III numaralı işlemler nakit oranını düşürür; yalnız I artırır.
