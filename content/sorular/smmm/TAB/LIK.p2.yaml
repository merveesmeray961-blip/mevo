- id: SMMM-TAB-LIK-0091
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: hedef orandan geri hesap
  tip: hesaplama
  zorluk: 3
  kok: Stoklar dışındaki dönen varlıkları 1.080.000 ₺, kısa vadeli yabancı kaynakları 600.000 ₺ olan bir işletmenin likidite
    oranı, (dönen varlıklar − stoklar) / kısa vadeli yabancı kaynaklar formülüne göre 1,8'dir. İşletme, vadesi gelmiş borçlarının
    bir kısmını nakit ödeyerek bu oranı 2'ye çıkarmak istemektedir. Ödenecek tutar kaç ₺'dir? (Stokların tutarı bilinmemektedir.)
  secenekler:
    A: 60.000 ₺
    B: 120.000 ₺
    C: 240.000 ₺
    D: 600.000 ₺
    E: 1.200.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Nakit ödeme stok dışı dönen varlıkları ve kısa vadeli yabancı kaynakları x kadar azaltır: (1.080.000 − x)
      / (600.000 − x) = 2. Çözümde x = 120.000 ₺ bulunur; kontrol: 960.000 / 480.000 = 2. Püf noktaları: Stok tutarı bilinmese
      de soruyu çözmek için gerekmez, çünkü pay zaten stok dışı varlıklardır. Ödeme tutarını hem paydan hem paydan düşmeyi
      unutma.'
    hesap_adimlari:
    - (1.080.000 − x) / (600.000 − x) = 2
    - 1.080.000 − x = 1.200.000 − 2x
    - x = 120.000 ₺
    - 'Kontrol: 960.000 / 480.000 = 2'
    celdiriciler:
      A: Yalnız paydadan düşülmüştür (1.080.000 / (600.000 − x) = 2 için x = 60.000); ödeme stok dışı dönen varlıkları da
        azaltır.
