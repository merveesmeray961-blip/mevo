    | Dönen varlık kalemi | Tutar (₺) |

    |---|---|

    | Hazır değerler | 200.000 |

    | Menkul kıymetler | 50.000 |

    | Ticari alacaklar | 250.000 |

    | Stoklar | 400.000 |

    | Gelecek aylara ait giderler | 100.000 |

    | Diğer dönen varlıklar | 100.000 |

    | **Dönen varlıklar toplamı** | **1.100.000** |


    Kısa vadeli yabancı kaynakları 500.000 ₺ olan işletmenin ihtiyatlı likidite oranı, (dönen varlıklar − stoklar − gelecek
    aylara ait giderler) / kısa vadeli yabancı kaynaklar formülüne göre kaçtır?'
