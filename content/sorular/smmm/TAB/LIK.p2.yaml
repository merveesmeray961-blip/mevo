- id: SMMM-TAB-LIK-0028
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: kaldıraç
  tip: hesaplama
  zorluk: 2
  kok: Toplam aktifi 3.000.000 ₺ olan bir işletmenin kısa vadeli yabancı kaynakları 600.000 ₺, uzun vadeli yabancı kaynakları
    1.200.000 ₺'dir. Bu işletmenin borç/özkaynak oranı (toplam yabancı kaynaklar / özkaynaklar) kaçtır?
  secenekler:
    A: 0,6
    B: 0,67
    C: '1'
    D: 1,5
    E: 2,5
  dogru: D
  aciklama:
    dogru_neden: Özkaynaklar bilanço eşitliğinden 3.000.000 − 1.800.000 = 1.200.000 ₺ bulunur. Borç/özkaynak oranı 1.800.000
      / 1.200.000 = 1,5'tir.
    hesap_adimlari:
    - Toplam yabancı kaynaklar = 600.000 + 1.200.000 = 1.800.000
    - Özkaynaklar = 3.000.000 − 1.800.000 = 1.200.000
    - Borç/özkaynak = 1.800.000 / 1.200.000 = 1,5
