    - Pay = 1.100.000 − 400.000 − 100.000 = 600.000
    - Oran = 600.000 / 500.000 = 1,2
    celdiriciler:
      A: Pay ile payda ters alınmıştır (500.000 / 600.000).
      B: Diğer dönen varlıklar da düşülmüştür ((1.100.000 − 400.000 − 100.000 − 100.000) / 500.000); verilen formülde bu kalem
        çıkarılmaz.
      D: Gelecek aylara ait giderler düşülmemiştir; yalnız stoklar çıkarılarak klasik likidite oranı bulunmuştur.
      E: Dönen varlıkların tamamı paya alınarak cari oran bulunmuştur.
  kaynaklar:
