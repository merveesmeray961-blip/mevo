  kok: Bir işletmenin dönen varlıkları 540.000 ₺ (bunun 180.000 ₺'si stoklardır), kısa vadeli yabancı kaynakları 330.000 ₺,
    uzun vadeli yabancı kaynakları 400.000 ₺'dir. İşletme, vadesi gelmiş kısa vadeli borçlarından bir kısmını nakit ödeyerek
    cari oranını 2'ye çıkarmak istemektedir. Ödenecek borç tutarı kaç ₺ olmalıdır?
  secenekler:
    A: 60.000 ₺
    B: 120.000 ₺
    C: 330.000 ₺
    D: 660.000 ₺
    E: 1.200.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Ödeme dönen varlıkları ve kısa vadeli yabancı kaynakları x kadar azaltır: (540.000 − x) / (330.000 − x)
      = 2. Denklem çözülünce x = 2 × 330.000 − 540.000 = 120.000 ₺ bulunur; kontrol edilince 420.000 / 210.000 = 2 olur. Püf
      noktaları: Nakitle borç ödemesinde x''i hem paya hem paydaya yansıt. Stoklar ve uzun vadeli yabancı kaynaklar cari oran
      hesabında soruyu çözmene yardımcı olmayan gereksiz verilerdir.'
