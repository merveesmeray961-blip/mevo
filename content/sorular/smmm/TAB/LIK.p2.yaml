      C: Bulunması gereken tutar hedef oranla (1,5) bir kez daha çarpılmıştır.
      D: Bu tutar hedef paydır (1,5 × 500.000); ödeme hem payı hem paydayı azaltır.
      E: Stok dışı dönen varlıkların iki katı alınmıştır (2 × 690.000).
