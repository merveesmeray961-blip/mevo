  tip: hesaplama
  zorluk: 2
  kok: 'Bir işletmenin bilanço kalemlerinden bazıları şöyledir:


    | Kalem | Tutar (₺) |

    |---|---|

    | Kasa | 40.000 |

    | Bankalar | 260.000 |

    | Alınan çekler | 60.000 |

    | Verilen çekler ve ödeme emirleri (-) | 60.000 |

    | Menkul kıymetler | 120.000 |

    | Ticari alacaklar | 280.000 |

    | Stoklar | 140.000 |


    Kısa vadeli yabancı kaynakları 700.000 ₺ olan işletmenin nakit oranı kaçtır?'
  secenekler:
    A: 0,43
    B: 0,6
    C: 0,69
    D: '1'
    E: 1,2
  dogru: B
  aciklama:
    dogru_neden: Verilen çekler ve ödeme emirleri hazır değerleri azaltan (−) kalemdir; hazır değerler 300.000 ₺ olur. Menkul
      kıymetlerle birlikte pay 420.000 ₺, nakit oranı 420.000 / 700.000 = 0,6'dır.
    hesap_adimlari:
    - Hazır değerler = 40.000 + 260.000 + 60.000 − 60.000 = 300.000
    - Pay = 300.000 + 120.000 = 420.000
    - Nakit oranı = 420.000 / 700.000 = 0,6
    celdiriciler:
      A: Menkul kıymetler paya eklenmemiştir (300.000 / 700.000); nakit oranının payında hazır değerler ile menkul kıymetler
        birlikte yer alır.
      C: Verilen çekler ve ödeme emirleri (−) hazır değerlerden düşülmemiştir ((360.000 + 120.000) / 700.000).
      D: Ticari alacaklar da paya eklenmiştir ((300.000 + 120.000 + 280.000) / 700.000); alacaklar nakit oranının payına girmez.
      E: Dönen varlıkların tamamı paya alınarak cari oran bulunmuştur (840.000 / 700.000).
