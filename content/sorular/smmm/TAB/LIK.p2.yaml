    dogru_neden: 'Likidite oranı başlangıçta (900.000 − 300.000) / 500.000 = 1,2''dir. I''de stok dışı varlıklar 500.000 ₺''ye
      iner, oran 1,0 olur. II''de nakit artar, alacak aynı tutarda azalır; oran 1,2''de kalır. III''te stok 100.000 ₺ azalır,
      nakit 100.000 ₺ artar; oran 700.000 / 500.000 = 1,4 olur. Püf noktaları: Likidite oranında stok paydan çıkarılır; bu
      yüzden stok ile nakit/alacak arasındaki dönüşüm cari oranı değiştirmezken likidite oranını değiştirir. Peşin alım oranı
      düşürür, stokun nakde dönmesi oranı yükseltir.'
    celdiriciler:
      B: Peşin mal alımı nakdi azaltıp stoku artırdığından likidite oranını 1,2'den 1,0'a düşürür.
      C: Alacak tahsili stok dışı dönen varlıklar toplamını değiştirmez; oran 1,2'de kalır.
      D: I numaralı işlem stok dışı varlıkları azalttığından oranı düşürür.
      E: I numaralı işlem oranı düşürür, II numaralı işlem ise nakit artarken alacak aynı tutarda azaldığından oranı değiştirmez.
