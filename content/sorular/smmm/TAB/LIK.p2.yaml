  kok: 'Dönen varlıkları 900.000 ₺ (bunun 300.000 ₺''si stoklardır), kısa vadeli yabancı kaynakları 500.000 ₺ olan bir işletmede
    aşağıdaki işlemler birbirinden bağımsız olarak ayrı ayrı yapılacaktır:


    I. 100.000 ₺''lik ticari malın peşin satın alınması

    II. 100.000 ₺''lik ticari alacağın nakit tahsil edilmesi

    III. Maliyeti 100.000 ₺ olan ticari malın maliyetine peşin satılması


