      C: Duran varlıklardan yalnız uzun vadeli yabancı kaynaklar düşülmüştür (1.000.000 − 500.000); özkaynaklar da devamlı
        sermayeye dahildir.
      D: Bu tutar devamlı sermayedir (500.000 + 960.000); duran varlıklar düşülmemiştir.
      E: Duran varlıklar ile devamlı sermaye toplanmıştır; fark alınması gerekir.
