- id: SMMM-TAB-LIK-0047
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: kaldıraç
  tip: hesaplama
  zorluk: 3
  kok: Toplam aktifi 2.000.000 ₺, toplam yabancı kaynakları 1.200.000 ₺ olan bir işletme, kasasındaki nakitten 400.000 ₺'yi
    yabancı kaynaklarına ödemiştir (işlemden başka değişiklik yoktur). İşlem sonrasında kaldıraç oranı (toplam yabancı kaynaklar
    / toplam aktif) kaç olur?
  secenekler:
    A: 0,5
    B: 0,6
    C: 0,75
    D: '1'
    E: 1,5
  dogru: A
  aciklama:
    dogru_neden: 'Nakitle borç ödemesi hem aktifi hem yabancı kaynakları 400.000 ₺ azaltır. Yeni kaldıraç oranı 800.000 /
      1.600.000 = 0,5 olur; özkaynak 800.000 ₺ olarak değişmez. Püf noktaları: Nakitle borç ödemesi hem payı hem paydayı azaltır;
      yalnız birini düşmek en sık yapılan hatadır. Özkaynak değişmediğinden sonuçta borç/özkaynak oranının 1 çıkması kaldıraç
      oranının 1 olduğu anlamına gelmez.'
    hesap_adimlari:
    - Yabancı kaynaklar = 1.200.000 − 400.000 = 800.000
    - Toplam aktif = 2.000.000 − 400.000 = 1.600.000
