    A: 0,20
    B: 0,30
    C: 0,40
    D: 1,20
    E: 1,80
  dogru: C
  aciklama:
    dogru_neden: 2026 yılı sonu itibarıyla hazır değerler 120, menkul kıymetler 40 bin ₺ olup toplamı 160 bin ₺'dir; kısa
      vadeli yabancı kaynaklar 400 bin ₺'dir. Nakit oran 160 / 400 = 0,40'tır.
    celdiriciler:
      A: '0,20: Payda olarak kısa vadeli yabancı kaynaklar yerine toplam yabancı kaynaklar (400 + 400 = 800) alınmıştır (160
        / 800).'
      B: '0,30: Pay olarak yalnızca hazır değerler alınmış, menkul kıymetler unutulmuştur (120 / 400).'
      D: '1,20: Stoklar dönen varlıklardan çıkarılarak bulunan değer (720 − 240) / 400 likidite oranı türünden bir orandır;
        nakit oran yalnızca hazır değerler ve menkul kıymetleri içerir.'
      E: '1,80: Dönen varlıkların tamamı kısa vadeli yabancı kaynaklara bölünmüştür (720 / 400); bu cari orandır.'
    hesap_adimlari:
    - 'Hazır değerler + menkul kıymetler (2026): 120 + 40 = 160'
    - 'Nakit oran: 160 / 400 = 0,40'
