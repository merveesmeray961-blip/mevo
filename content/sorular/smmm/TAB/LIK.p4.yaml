    Nakit oran = (Hazır değerler + Menkul kıymetler) / Kısa vadeli yabancı kaynaklar formülüyle hesaplandığına göre RT A.Ş.''nin
    2026 yılı sonu itibarıyla nakit oranı kaçtır?'
