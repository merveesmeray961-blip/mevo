- id: SMMM-TAB-LIK-0005
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: net ve brüt işletme sermayesi
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin dönen varlıkları 900 bin TL, kısa vadeli yabancı kaynakları 600 bin TL'dir. Brüt işletme sermayesi =
    dönen varlıklar; net işletme sermayesi = dönen varlıklar − kısa vadeli yabancı kaynaklar olarak tanımlanacaktır. Buna
    göre brüt ve net işletme sermayesi ile aralarındaki fark hangisidir?
  secenekler:
    A: Brüt 300, net 600, fark 300
    B: Brüt 900, net 300, fark 600
    C: Brüt 900, net 600, fark 300
    D: Brüt 1.500, net 300, fark 1.200
    E: Brüt 600, net 300, fark 300
  dogru: B
  aciklama:
    dogru_neden: 'Brüt işletme sermayesi dönen varlıklar olduğundan 900 bin TL''dir. Net işletme sermayesi 900 − 600 = 300
      bin TL''dir. Aralarındaki fark 600 bin TL, yani kısa vadeli yabancı kaynaklar tutarıdır. Püf noktaları: Net işletme
      sermayesinde kısa vadeli yabancı kaynaklar düşülür; brüt tutar ise yalnızca dönen varlıkları ifade eder.'
    celdiriciler:
      A: Brüt ve net tutarlar ters yazılmıştır.
      C: Net işletme sermayesi 600 değil 300 bin TL'dir.
      D: Dönen varlıklarla kısa vadeli yabancı kaynaklar toplanarak brüt sermaye 1.500 alınmıştır.
      E: Brüt işletme sermayesi kısa vadeli yabancı kaynaklara eşit kabul edilmiştir.
    hesap_adimlari:
    - 'Brüt işletme sermayesi: 900'
    - 'Net işletme sermayesi: 900 − 600 = 300'
    - 'Fark: 900 − 300 = 600'
  kaynaklar:
  - mevzuat: MSUGT Sıra No 1 – Ek 4
    madde: Net İşletme (Çalışma) Sermayesindeki Değişim Tablosu
    alinti: '_ Net İşletme (Çalışma) Sermayesindeki Değişim Tablosu: İşletmenin belirli bir hesap döneminde, net işletme sermayesinin
      kaynaklarını ve kullanım yerlerini gösteren tablodur. Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı
      kaynaklar far-kını belirten net işletme (çalışma) sermayesini kapsar.'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 900 - 600
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-07'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-07'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-07'
    kim: uretici
    ne: 'harici teslim aday_TAB.yaml, satır ristaycraft_TAB-2026-10-06-G01 #6'
