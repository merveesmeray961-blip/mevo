      C: 1.200 / 700 işlemiyle yalnızca borç azaltılmıştır.
      E: 1.100 / 675 gibi verilen verilerden çıkmayan bir kısa vadeli borç tutarı kullanılmıştır.
    hesap_adimlari:
    - 'Ödeme sonrası dönen varlıklar: 1.200 − 100 = 1.100'
    - 'Ödeme sonrası kısa vadeli yabancı kaynaklar: 800 − 100 = 700'
    - 'Cari oran: 1.100 / 700 = 1,57'
