  aciklama:
    dogru_neden: 'Ödeme dönen varlıkları 100 bin TL, kısa vadeli yabancı kaynakları da 100 bin TL azaltır. Yeni tutarlar 1.100
      ve 700 bin TL''dir. Cari oran 1.100 / 700 = 1,57''dir. Püf noktaları: Borç ödemesi iki tarafı da azaltır; yalnızca borcu
      700''e indirip dönen varlıkları 1.200''de bırakmak oranı gereğinden yüksek çıkarır.'
