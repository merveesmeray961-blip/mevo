  kok: Bir işletmenin başlangıçta dönen varlıkları 1.200 bin TL ve kısa vadeli yabancı kaynakları 800 bin TL'dir. İşletme
    100 bin TL nakit kullanarak kısa vadeli borcunun 100 bin TL'sini ödemiştir. Cari oran = dönen varlıklar / kısa vadeli
    yabancı kaynaklar olarak alınacaktır. Ödeme sonrasında cari oran kaçtır?
  secenekler:
    A: 1,25
    B: 1,40
    C: 1,50
    D: 1,57
    E: 1,63
