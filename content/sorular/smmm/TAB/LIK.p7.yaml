      D: 1,4, dönen varlıkların kısa vadeli yabancı kaynaklara doğrudan oranlanmasıyla bulunan 900 / 650 benzeri yanlış yaklaşıma
        karşılık gelir.
      E: 1,8, dönen varlıkların tamamının kısa vadeli kaynaklara bölünmesiyle bulunan 900 / 500 sonucudur.
    hesap_adimlari:
