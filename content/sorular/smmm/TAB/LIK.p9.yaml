  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: net ve brüt işletme sermayesi
  tip: kavrama
  zorluk: 3
  kok: Bir işletmenin dönen varlıkları 780 bin ₺, kısa vadeli yabancı kaynakları 520 bin ₺ ve hazır değerleri 90 bin ₺dir.
    Finansal tabloların düzenlenmesine ilişkin kaynak metindeki tanıma göre net işletme sermayesi hangi ifadeyle doğru açıklanır?
  secenekler:
    A: Dönen varlıklar ile kısa vadeli yabancı kaynaklar arasındaki farktır; verilen tutarlara göre 260 bin ₺dir.
    B: Hazır değerler ile kısa vadeli yabancı kaynaklar arasındaki farktır; verilen tutarlara göre 430 bin ₺dir.
    C: Dönen varlıklar ile toplam yabancı kaynaklar arasındaki farktır; uzun vadeli borçlar da mutlaka düşülür.
    D: Duran varlıklar ile kısa vadeli yabancı kaynaklar arasındaki farktır.
    E: Net satışlar ile ticari borçlar arasındaki farktır.
  dogru: A
  aciklama:
    dogru_neden: 'Kaynak metin net işletme (çalışma) sermayesini dönen varlıklar ile kısa vadeli yabancı kaynaklar farkı olarak
      tanımlar. Bu nedenle 780 − 520 = 260 bin ₺ bulunur. Püf noktaları: Fon kavramının bu tabloda kullanımı kasa ve banka
      bakiyeleriyle sınırlı değildir; net işletme sermayesi iki bilanço grubunun farkıdır.'
    celdiriciler:
      B: Yalnızca hazır değerleri kullanır; dönen varlıkların tamamını dikkate almaz.
      C: Kaynak metindeki tanımda toplam yabancı kaynaklar değil kısa vadeli yabancı kaynaklar esas alınır.
      D: Dönen varlıklar yerine duran varlıkları kullanır.
      E: Net satışlar ve ticari borçlar, kaynak metindeki net işletme sermayesi tanımını oluşturmaz.
    hesap_adimlari:
    - Net işletme sermayesi = dönen varlıklar − kısa vadeli yabancı kaynaklar
    - 780 − 520 = 260 bin ₺
  kaynaklar:
  - mevzuat: MSUGT Sıra No 1 – Ek 4, Mali Tabloların Düzenlenmesi ve Sunulması
    madde: Net İşletme (Çalışma) Sermayesindeki Değişim Tablosu tanımı
    alinti: Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı kaynaklar far-kını belirten net işletme (çalışma)
