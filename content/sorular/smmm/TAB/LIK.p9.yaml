- id: SMMM-TAB-LIK-0012
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: hedef orandan geri hesap
  tip: hesaplama
  zorluk: 2
  kok: Bir işletmenin cari oran hedefi 2,0’dır. Kısa vadeli yabancı kaynakları 300 bin TL, mevcut dönen varlıkları 300 bin
    TL’dir ve dönen varlıklar yalnızca nakit artırılarak hedefe ulaştırılacaktır. Aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Hedef dönen varlık 600 bin TL’dir.
    B: Eklenecek nakit 300 bin TL’dir.
    C: Nakit eklenince cari oran 2,0 olur.
    D: Eklenecek nakit 600 bin TL olmalıdır.
    E: Hedef için dönen varlıkların 300 bin TL artması yeterlidir.
  dogru: D
  aciklama:
    dogru_neden: Hedef dönen varlık = 2 × 300 = 600 bin TL. Mevcut dönen varlık 300 bin TL olduğundan gerekli nakit artışı
      300 bin TL’dir; 600 bin TL eklemek yanlıştır.
    celdiriciler:
      A: Hedef dönen varlık tutarı 600 bin TL’dir.
      B: 600 − 300 = 300 bin TL eklenmelidir.
      C: 600 / 300 = 2,0 olur.
      E: 300 bin TL artış hedefe ulaştırır.
    hesap_adimlari:
    - Hedef dönen varlıklar = 2,0 × 300 = 600
    - Gerekli nakit = 600 − 300 = 300
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — cari oran formülü
    madde: 'Cari oran: dönen varlıklar / kısa vadeli yabancı kaynaklar'
    alinti: ''
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 2 * 300 - 300
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-09'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-09'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-09'
    kim: uretici
    ne: 'harici teslim aday_TAB.yaml, satır ChatGPT_TAB-2026-10-08v2-G07 #5'
  - tarih: '2026-10-09'
    kim: otomatik
    ne: 'durum: taslak → geri_cekildi.'
    neden: otomatik kapı hatası veya bankada aynı kök
