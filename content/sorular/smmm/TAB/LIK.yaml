- id: SMMM-TAB-LIK-0003
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: LIK
  kazanim: Hedef cari orandan geri hesap
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: M İşletmesi'nin dönem sonu bilançosunda dönen varlıklar 600.000 ₺ (hazır değerler 180.000 ₺ dâhil), kısa
    vadeli yabancı kaynaklar 300.000 ₺'dir. İşletme, cari oranını 2,50'ye yükseltmek amacıyla kısa vadeli ticari
    borçlarının bir kısmını hazır değerlerinden ödemeyi planlamaktadır. Başka bir işlem olmadığı varsayılmaktadır.
    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır. Cari oran = Dönen varlıklar
    / Kısa vadeli yabancı kaynaklar formülüyle hesaplandığına göre, cari oranın 2,50 olması için ödenmesi gereken
    borç tutarı kaç ₺'dir?
  secenekler:
    A: '240.000'
    B: '200.000'
    C: '150.000'
    D: '100.000'
    E: '60.000'
  dogru: D
  aciklama:
    dogru_neden: 'Borç hazır değerlerden ödendiğinde hem dönen varlıklar hem kısa vadeli yabancı kaynaklar aynı
      tutarda (x) azalır: (600.000 - x) / (300.000 - x) = 2,50. Buradan 600.000 - x = 750.000 - 2,5x, 1,5x = 150.000
      ve x = 100.000 ₺ bulunur. Kontrol: 500.000 / 200.000 = 2,50. Zorluk (3) kaynakları: geri hesap (hedef orandan
      işlem tutarı istenir) ve tipik hata çeldiricileri. Tuzak, ödemenin yalnızca borçları azalttığını sanıp dönen
      varlıklardaki eşit azalışı gözden kaçırmaktır.'
    hesap_adimlari:
    - 'Ödeme sonrası: (600.000 - x) / (300.000 - x) = 2,50'
    - 600.000 - x = 750.000 - 2,5x
    - 1,5x = 150.000 → x = 100.000 ₺
    - 'Kontrol: (600.000 - 100.000) / (300.000 - 100.000) = 500.000 / 200.000 = 2,50'
    celdiriciler:
      A: 240.000 ₺, dönen varlıkların değişmediği varsayılarak hedef kısa vadeli yabancı kaynak tutarının (600.000
        / 2,50) ödenecek borç sanılmasıyla bulunur.
      B: 200.000 ₺, ödeme sonrasında kalan kısa vadeli yabancı kaynak tutarıdır (300.000 - 100.000); ödenen tutar
        değildir.
      C: 150.000 ₺, denklemde 1,5x = 150.000 adımında 1,5'e bölme yapılmadan durulmasıyla bulunur.
      E: 60.000 ₺, ödemenin dönen varlıkları da azalttığı göz ardı edilerek 600.000 / (300.000 - x) = 2,50 denkleminden
        bulunur.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Cari oran = Dönen varlıklar / Kısa vadeli yabancı kaynaklar
    alinti: ''
  dogrulama:
    python: 'dv = 600000

      kvyk = 300000

      hedef = 2.5

      sonuc = (hedef * kvyk - dv) / (hedef - 1)

      '
