  konu: LIK
  kazanim: Likidite (asit-test) oranı
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  ortak_veri: TAB-SET-01
  kok: 'MK A.Ş.''nin 2024–2026 yıllarına ait özet bilanço ve gelir tablosu verileri (bin ₺) aşağıda verilmiştir.


    | Kalem | 2024 | 2025 | 2026 |

    |---|---:|---:|---:|

    | **BİLANÇO** | | | |

    | Hazır Değerler | 60 | 70 | 100 |

    | Ticari Alacaklar | 120 | 140 | 160 |

    | Stoklar | 130 | 145 | 175 |

    | Diğer Dönen Varlıklar | 30 | 45 | 65 |

    | **Dönen Varlıklar** | **340** | **400** | **500** |

    | Maddi Duran Varlıklar (net) | 460 | 500 | 540 |

    | **Toplam Aktif** | **800** | **900** | **1.040** |

    | Kısa Vadeli Mali Borçlar | 70 | 80 | 120 |

    | Ticari Borçlar | 60 | 70 | 90 |

    | Diğer Kısa Vadeli Yabancı Kaynaklar | 30 | 40 | 40 |

    | **Kısa Vadeli Yabancı Kaynaklar** | **160** | **190** | **250** |

    | Uzun Vadeli Mali Borçlar | 240 | 230 | 190 |

    | Ödenmiş Sermaye | 300 | 300 | 300 |

    | Geçmiş Yıllar Kârları | 40 | 100 | 180 |

    | Dönem Net Kârı | 60 | 80 | 120 |

    | **Özkaynaklar** | **400** | **480** | **600** |

    | **Toplam Pasif** | **800** | **900** | **1.040** |

    | **GELİR TABLOSU** | | | |

    | Brüt Satışlar | 840 | 1.050 | 1.260 |

    | Satış İndirimleri (-) | 40 | 50 | 60 |

    | Net Satışlar | 800 | 1.000 | 1.200 |

    | Satışların Maliyeti (-) | 640 | 780 | 960 |

    | Brüt Satış Kârı | 160 | 220 | 240 |

    | Faaliyet Giderleri (-) | 50 | 70 | 60 |

    | Faaliyet Kârı | 110 | 150 | 180 |

    | Finansman Giderleri (-) | 35 | 50 | 30 |

    | Dönem Kârı (vergi öncesi) | 75 | 100 | 150 |

    | Vergi Karşılığı (-) | 15 | 20 | 30 |

    | Dönem Net Kârı | 60 | 80 | 120 |


    Devir hızlarında ortalama değerler kullanılacak; yıl 360, ay 30 gün alınacaktır.

    Likidite oranı = (Dönen varlıklar - Stoklar) / Kısa vadeli yabancı kaynaklar formülüyle hesaplandığına göre

    MK A.Ş.''nin 2026 yılı likidite oranı kaçtır?'
  secenekler:
    A: 1,30
    B: 1,48
    C: 1,60
    D: 1,74
    E: 2,00
  dogru: A
  aciklama:
    dogru_neden: Likidite oranı bir bilanço tarihindeki duruma ilişkin orandır; ortalama değil, ilgili yılın dönem
      sonu tutarları kullanılır. 2026 için (500 - 175) / 250 = 325 / 250 = 1,30'dur.
    hesap_adimlari:
    - 'Dönen varlıklar - Stoklar (2026): 500 - 175 = 325'
    - 'Likidite oranı: 325 / 250 = 1,30'
    celdiriciler:
      B: 1,48, payda olarak 2025 ve 2026 kısa vadeli yabancı kaynaklarının ortalaması ((190 + 250) / 2 = 220) kullanıldığında
        bulunur; ortalama değer yalnızca devir hızlarında kullanılır.
      C: 1,60, dönen varlıklardan stoklar yerine hazır değerler düşüldüğünde ((500 - 100) / 250) bulunur.
      D: 1,74, dönen varlıklardan stoklar yerine diğer dönen varlıklar düşüldüğünde ((500 - 65) / 250) bulunur.
      E: 2,00 cari orandır (500 / 250); stoklar dönen varlıklardan düşülmemiştir.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Likidite (asit-test) oranı = (Dönen varlıklar - Stoklar) / Kısa vadeli yabancı kaynaklar
    alinti: ''
  dogrulama:
    python: 'sonuc = round((500 - 175) / 250, 2)

      '
