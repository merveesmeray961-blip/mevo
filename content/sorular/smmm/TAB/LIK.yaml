- id: SMMM-TAB-LIK-0003
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: LIK
  kazanim: Hedef cari orandan geri hesap
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'M İşletmesi''nin mevcut bilançosunda dönen varlıklar 600.000 ₺ (hazır değerler 180.000 ₺ dâhil), kısa vadeli
    yabancı kaynaklar 300.000 ₺''dir. Kısa vadeli yabancı kaynakların tamamı ticari borçtur. İşletme, bilanço tarihinden
    önce sırasıyla şu iki işlemi yapmayı planlamaktadır: (1) 60.000 ₺ tutarında ticari malı vadeli olarak (kısa
    vadeli ticari borç karşılığında) satın alacak; (2) ardından cari oranını 2,50''ye yükseltmek amacıyla kısa vadeli
    ticari borçlarının bir kısmını hazır değerlerinden ödeyecektir. KDV dikkate alınmayacak; başka bir işlem olmadığı
    varsayılmaktadır. Cari oran = Dönen varlıklar / Kısa vadeli yabancı kaynaklar formülüyle hesaplandığına göre,
    cari oranın 2,50 olması için ödenmesi gereken borç tutarı kaç ₺''dir?'
  secenekler:
    A: '240.000'
    B: '200.000'
    C: '160.000'
    D: '100.000'
    E: '96.000'
  dogru: C
  aciklama:
    dogru_neden: 'Önce vadeli mal alımı: dönen varlıklar (stok) ve kısa vadeli yabancı kaynaklar 60.000 ₺ artar
      ve 660.000 / 360.000 olur. Ardından borç hazır değerlerden ödendiğinde ikisi de aynı tutarda (x) azalır: (660.000
      − x) / (360.000 − x) = 2,50 → 660.000 − x = 900.000 − 2,5x → 1,5x = 240.000 → x = 160.000 ₺. Kontrol: 500.000
      / 200.000 = 2,50; ödeme hazır değerlerden (180.000 ₺) karşılanabilir. Aynı sonuca net çalışma sermayesiyle
      de ulaşılır: ne vadeli alım ne borç ödemesi net çalışma sermayesini (300.000) değiştirir; hedef kısa vadeli
      yabancı kaynaklar 300.000 / (2,50 − 1) = 200.000 ₺, ödeme 360.000 − 200.000 = 160.000 ₺''dir.


      Püf noktaları: İki işlemin etkisini sırayla hesaplayın: vadeli alım dönen varlıkları ve kısa vadeli yabancı
      kaynakları birlikte artırır, borç ödemesi ise ikisini birlikte azaltır. Hedef orandan geriye giderek ödenecek
      tutarı bulun. Tuzaklar: vadeli alımın kısa vadeli yabancı kaynakları da artırdığını unutmak (D), ödemenin
      dönen varlıkları da azalttığını gözden kaçırmak (E), net çalışma sermayesini (2,50 − 1) yerine 2,50''ye bölmek
      (A) ve kalan borcu ödenen tutarla karıştırmak (B).'
    hesap_adimlari:
    - 'Vadeli alım sonrası: dönen varlıklar 600.000 + 60.000 = 660.000; kısa vadeli yabancı kaynaklar 300.000 +
      60.000 = 360.000'
    - 'Ödeme sonrası: (660.000 − x) / (360.000 − x) = 2,50'
    - 660.000 − x = 900.000 − 2,5x → 1,5x = 240.000 → x = 160.000 ₺
    - 'Kontrol: (660.000 − 160.000) / (360.000 − 160.000) = 500.000 / 200.000 = 2,50; 160.000 ≤ hazır değerler 180.000'
    - 'Alternatif: net çalışma sermayesi 300.000 sabit; hedef KVYK = 300.000 / 1,5 = 200.000; ödeme = 360.000 −
      200.000 = 160.000 ₺'
    celdiriciler:
      A: 240.000 ₺, değişmeyen net çalışma sermayesinin (300.000) (2,50 − 1) yerine 2,50'ye bölünmesiyle hedef kısa
        vadeli yabancı kaynaklar 120.000 ₺ bulunup ödeme 360.000 − 120.000 olarak hesaplandığında bulunur; bu tutar
        hazır değerleri (180.000 ₺) de aşar.
      B: 200.000 ₺, ödeme sonrasında kalan kısa vadeli yabancı kaynak tutarıdır (360.000 − 160.000); ödenen tutar
        değildir.
      D: 100.000 ₺, vadeli mal alımı göz ardı edilerek (600.000 − x) / (300.000 − x) = 2,50 denkleminden bulunur;
        alım hem dönen varlıkları hem kısa vadeli yabancı kaynakları 60.000 ₺ artırır.
      E: 96.000 ₺, ödemenin dönen varlıkları da azalttığı göz ardı edilerek 660.000 / (360.000 − x) = 2,50 denkleminden
        bulunur.
  kaynaklar:
  - mevzuat: Finansal tablolar analizi — genel kabul görmüş oran tanımları
    madde: Cari oran = Dönen varlıklar / Kısa vadeli yabancı kaynaklar
    alinti: ''
  dogrulama:
    python: 'dv = 600000 + 60000

      kvyk = 300000 + 60000

      hedef = 2.5

      celdirici_d = (hedef * 300000 - 600000) / (hedef - 1)

      celdirici_e = kvyk - dv / hedef

      assert (dv - 160000) / (kvyk - 160000) == hedef

      sonuc = (hedef * kvyk - dv) / (hedef - 1)

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 4
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: 'Kökten ilgisiz standart ''Devir hızlarında…'' cümlesi çıkarıldı; zayıf C çeldiricisi (150.000, 1,5''e bölmeyi
      unutmak) net çalışma sermayesini (oran - 1) yerine orana bölme hatasından türeyen 180.000 ile değiştirildi
      (şıklar sıralı); dogru_neden, hesap_adimlari, C açıklaması ve dogrulama.python güncellendi; zorluk 3 teknikleri
      ve tuzak açıkça yazıldı. (Not: bu kayıttaki şık ve tutarlar bundan sonraki kayıtla değişen eski sürüme aittir;
      güncel şıklar 240.000/200.000/160.000/100.000/96.000, doğru cevap C''dir.)'
    neden: 'G5 (küçük): ilgisiz kök cümlesi ve zayıf C çeldiricisi.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'Soru zorlaştırıldı: borç ödemesinden önce 60.000 ₺ vadeli ticari mal alımı eklendi (iki işlemin sıralı
      etkisi); doğru cevap 160.000 ₺ (C), şıklar 240.000/200.000/160.000/100.000/96.000; eski doğru cevap (100.000,
      alımı yok sayma) D çeldiricisi yapıldı, her çeldirici ayrı bir aday hatasından türetildi; dogru_neden teknikleri
      ve tuzakları adlandırıyor; hesap_adimlari ve dogrulama.python güncellendi; baslangic 2026-01-01.'
    neden: 'GZ: zor etiketli ama ortalama aday rahat çözdü (güven 5) → zorlaştır; baslangic soru üretim tarihiydi.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: Köke 'Kısa vadeli yabancı kaynakların tamamı ticari borçtur.' eklendi (160.000 ₺ ödemenin karşılanabilmesi
      için ticari borç tutarı belirsizdi); eski sürümü anlatan ilk gecmis kaydına açıklayıcı not eklendi; teknik
      not 'Püf noktaları:' biçimine getirildi. Doğru cevap (C) ve hesap değişmedi.
    neden: Bağımsız hakem bulgusu (3 Ekim 2026, no. 7).
  - tarih: '2026-10-04'
    kim: GZ
    ne: Zorluk 3→2
    neden: Ortalama aday kaynaksız ve yüksek güvenle doğru çözdü; uretim.md §7 gereği zorluk 3→2.
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): C (güven 5)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: Köke ''KVYK tamamı ticari borç'' eklendi; (660.000−x)/(360.000−x)=2,5 → 160.000 (C); A 240.000,
          D 100.000, E 96.000 yeniden hesaplandı, tutarlı.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: Kaynak alıntıları değişmedi; açıklamadaki iddialar mevcut alıntılarla destekli.'
