- id: SMMM-TAB-TMS-0054
  sinav: smmm
  bolum: *id001
  ders: TAB
  unite: Finansal tablolar ve TMS 1 / nakit akışı
  konu: TMS
  kazanim: TMS 7 kredili cari hesap
  tip: kavrama
  zorluk: 2
  kok: Bir işletme, talep üzerine geri ödenebilir nitelikteki banka kredili cari hesabını nakit yönetiminin ayrılmaz
    bir parçası olarak kullanmakta ve hesap bakiyesi sıklıkla pozitiften negatife dalgalanmaktadır. TMS 7'ye göre
    bu kredili cari hesap nasıl ele alınır?
  secenekler:
    A: Bankalardan yapılan borçlanma olarak daima finansman faaliyeti sayılır
    B: Yatırım faaliyetlerinden kaynaklanan nakit akışı olarak sınıflandırılır
    C: Nakit ve nakit benzerlerinin bir bileşeni olarak değerlendirilir
    D: Nakit akış tablosunun dışında bırakılır, yalnızca dipnotta açıklanır
    E: Esas faaliyet borcu sayılarak ticari borçlarla birleştirilir
  dogru: C
  aciklama:
    dogru_neden: 'TMS 7 paragraf 8 uyarınca bankalardan yapılan borçlanmalar genellikle finansman faaliyetidir;
      ancak talep üzerine geri ödenebilir nitelikteki ve nakit yönetiminin ayrılmaz parçası olan kredili cari hesaplar
      nakit ve nakit benzerlerinin bir bileşenidir. Bu bakiyenin sıklıkla pozitiften negatife dalgalanması bu tür
      işlemlerin özelliğidir. Püf noktaları: genel kural finansman faaliyetidir, istisna talep üzerine geri ödenebilir
      ve nakit yönetiminin parçası olan kredili hesaptır.'
    celdiriciler:
      A: '"Daima finansman" ifadesi yanlıştır; paragraf 8 nakit yönetiminin parçası olan kredili hesap için istisna
        tanır.'
      B: Kredili cari hesap yatırım faaliyetiyle ilgili değildir; uzun vadeli varlık edinimi veya elden çıkarılması
        söz konusu değildir.
      D: Kredili hesap nakit ve nakit benzerlerinin bileşeni olduğundan tablo dışında bırakılmaz; mutabakatta yer
        alır.
      E: Standart kredili cari hesabı ticari borç saymaz; nakit ve nakit benzerlerinin bileşeni olarak ele alır.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
