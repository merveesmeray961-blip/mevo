- id: SMMM-TAB-TMS-0057
  sinav: smmm
  bolum: *id001
  ders: TAB
  unite: Finansal tablolar ve TMS 1 / nakit akışı
  konu: TMS
  kazanim: TMS 7 dolaylı yöntem esas faaliyet nakit akışı
  tip: hesaplama
  zorluk: 1
  kok: Bir işletmenin dönem net kârı 120 milyon ₺'dir. Dönemde amortisman gideri 30 milyon ₺, duran varlık satış
    zararı 6 milyon ₺ olmuştur. Stoklar 14 milyon ₺ azalmış, ticari alacaklar 22 milyon ₺ artmış, ticari borçlar
    9 milyon ₺ azalmıştır. Vergi ve faiz ile ilgili ayrı bir düzeltme yoktur. TMS 7'ye göre dolaylı yöntemle esas
    faaliyetlerden net nakit akışı kaç milyon ₺'dir?
  secenekler:
    A: '111'
    B: '127'
    C: '133'
    D: '139'
    E: '157'
  dogru: D
  aciklama:
    dogru_neden: TMS 7 paragraf 20 uyarınca dolaylı yöntemde dönem kârı, stok ile esas faaliyetlerle ilgili alacak
      ve borçlardaki değişimlerin, nakit akışı yaratmayan kalemlerin ve yatırım ya da finansman faaliyetlerine ilişkin
      kalemlerin etkilerine göre düzeltilir. 120 + 30 + 6 + 14 - 22 - 9 = 139 milyon ₺.
    hesap_adimlari:
    - Net kâra nakit çıkışı yaratmayan amortisman (+30) eklenir.
    - Duran varlık satış zararı yatırım faaliyetiyle ilgilidir; esas faaliyet nakit akışında geri eklenir (+6).
    - Stok azalışı nakit artırıcıdır (+14); ticari alacak artışı (-22) ve ticari borç azalışı (-9) nakit azaltıcıdır.
    - 120 + 30 + 6 + 14 - 22 - 9 = 139 milyon ₺.
    celdiriciler:
      A: 111, stok azalışının nakit artırıcı etkisinin eksi yazılmasıyla bulunur (-14); stok azalışı eklenmelidir.
      B: 127, satış zararının net kârdan düşülmesiyle bulunur; zarar nakit çıkışı yaratmadığı için geri eklenir.
      C: 133, satış zararının hesaba katılmamasıyla bulunur; yatırım faaliyetine ilişkin zarar kalemi düzeltilmelidir.
      E: 157, ticari borç azalışının nakit artırıcı sayılmasıyla bulunur; borç azalışı nakit çıkışıdır.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
