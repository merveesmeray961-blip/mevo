- id: SMMM-TAB-TMS-0052
  sinav: smmm
  bolum: &id001
  - SGS
  - YET
  ders: TAB
  unite: Finansal tablolar ve TMS 1 / nakit akışı
  konu: TMS
  kazanim: TMS 7 nakit benzeri kavramı
  tip: kavrama
  zorluk: 1
  kok: TMS 7'ye göre aşağıdakilerden hangisi, özü itibarıyla nakit benzeri tanımını karşılamadığı sürece **nakit
    benzeri olarak değerlendirilmez**?
  secenekler:
    A: Edinim tarihinden itibaren 2 ay vadeli ve değerindeki değişim riski önemsiz olan kamu bonosu
    B: Borsada işlem gören bir şirketin itfa tarihi bulunmayan, vadesine kalan süreden bağımsız adi payları
    C: Vadesine kısa bir süre kala edinilen ve belirli bir itfa tarihi olan imtiyazlı paylar
    D: Edinim tarihinden itibaren 3 ay vadeli, belirli bir nakde kolayca çevrilebilen mevduat
    E: Tutarı belirli bir nakde kolayca çevrilebilen, kısa vadeli nakit taahhütleri için tutulan yüksek likiditeli
      yatırım
  dogru: B
  aciklama:
    dogru_neden: TMS 7 paragraf 7 uyarınca özkaynak yatırımları, özü itibarıyla nakit benzerleri tanımını karşılamadıkça
      nakit benzeri sayılmaz. İtfa tarihi olmayan adi paylar bu tanımı karşılamaz. Vadesine kısa süre kala edinilen,
      belirli itfa tarihli imtiyazlı paylar ise standardın verdiği istisna örneğidir.
    celdiriciler:
      A: Edinim tarihinden 3 ay veya daha kısa vadeli, değer değişim riski önemsiz yatırım genellikle nakit benzeridir.
      C: Standart, vadesine kısa süre kala edinilen belirli itfa tarihli imtiyazlı payları nakit benzeri örneği
        olarak verir.
      D: Üç aylık vadeli, belirli tutarda nakde kolayca çevrilen mevduat nakit benzeri niteliğindedir.
      E: Bu ifade nakit benzeri tanımının kendisidir; tanımı karşılayan yatırım nakit benzeri sayılır.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 7
    alinti: Özkaynak yatırımları, özü itibarıyla nakit benzerleri tanımını karşılamadıkça (nakit benzerleri tanımını
