      alınan faizin esas veya yatırım faaliyeti olarak sınıflandırılmasına izin verir; ancak seçilen yöntem tutarlı
      uygulanmalıdır. Püf noktaları: iki seçenek de geçerlidir, fakat dönemler arasında keyfi geçiş yapılamaz.'
    celdiriciler:
      A: Paragraf 31 dönemler itibarıyla tutarlılık ister; seçim her dönem değiştirilemez.
      B: Paragraf 33 finansal kuruluş olmayan işletme için hem esas hem yatırım sınıflamasına izin verir; yalnızca
        yatırım zorunlu değildir.
      C: Paragraf 33 yalnızca esas faaliyet sınıflandırmasını zorunlu kılmaz; yatırım faaliyeti alternatifi de vardır.
      E: Paragraf 31 alınan faizin ayrı açıklanmasını zorunlu kılar; diğer tahsilatlarla birleştirilemez.
