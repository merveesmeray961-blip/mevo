- id: SMMM-TAB-TMS-0053
  sinav: smmm
  bolum: *id001
  ders: TAB
  unite: Finansal tablolar ve TMS 1 / nakit akışı
  konu: TMS
  kazanim: TMS 7 nakit ve nakit benzerleri arası hareketler
  tip: uygulama
  zorluk: 1
  kok: Bir işletme, vadesiz mevduat hesabındaki 40 milyon ₺'yi edinim tarihinden itibaren 2 ay vadeli, değerindeki
    değişim riski önemsiz bir vadeli mevduat hesabına aktarmıştır. TMS 7'ye göre bu işlemin nakit akış tablosundaki
    durumu aşağıdakilerden hangisidir?
  secenekler:
    A: 40 milyon ₺ yatırım faaliyetlerinden nakit çıkışıdır
    B: 40 milyon ₺ finansman faaliyetlerinden nakit çıkışıdır
    C: 40 milyon ₺ esas faaliyetlerden nakit çıkışıdır
    D: 40 milyon ₺ yatırım faaliyetlerinden nakit çıkışı, aynı tutar esas faaliyetlerden nakit girişidir
    E: Nakit akışı olarak değerlendirilmez; nakit yönetiminin bir parçasıdır
  dogru: E
  aciklama:
    dogru_neden: TMS 7 paragraf 9 uyarınca nakit ve nakit benzerlerini oluşturan kalemler arasındaki hareketler
      esas, yatırım ve finansman faaliyetlerinin parçası olmayıp işletmenin nakit yönetiminin parçasıdır; bu nedenle
      nakit akışı sayılmaz. Vadesiz mevduat nakit, 2 ay vadeli ve değer değişim riski önemsiz mevduat ise nakit
      benzeridir.
    celdiriciler:
      A: Aktarım nakit benzeri içindeki bir kalemden diğerine yapıldığından yatırım faaliyeti çıkışı doğurmaz.
      B: Finansman faaliyeti, sermaye veya borçlanma büyüklüğünü değiştiren işlemlerdir; bu aktarım böyle bir sonuç
        doğurmaz.
      C: Esas faaliyet nakit çıkışı oluşması için hasılat yaratan faaliyetle ilişkili bir ödeme gerekir; burada
        ödeme yoktur.
      D: İşlem toplam nakit ve nakit benzerlerini değiştirmediğinden hiçbir faaliyet sınıfında gösterilmez.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 9
    alinti: Nakit ve nakit benzerlerini oluşturan kalemler arasındaki hareketler; esas, yatırım ve finansman faaliyetlerinin
      bir parçası olmaktan ziyade işletmenin nakit yönetiminin bir parçasını oluşturduğundan, nakit akışı olarak
