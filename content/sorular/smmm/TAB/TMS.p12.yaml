    C: Alınan faiz yalnızca esas faaliyet olarak sınıflandırılabilir, diğer seçenek yoktur
    D: Faiz ve temettü akışları ayrı açıklanır ve dönemler itibarıyla tutarlı sınıflandırılır
    E: Alınan faizler ayrı açıklanmaz, diğer tahsilatlarla tek kalemde gösterilir
  dogru: D
