  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin net maddi duran varlıkları dönem başında 400 milyon ₺, dönem sonunda 520 milyon ₺'dir. Dönem
    amortisman gideri 60 milyon ₺'dir. Dönem içinde defter değeri 40 milyon ₺ olan bir makine 55 milyon ₺'ye nakden
    satılmıştır. Dönemdeki maddi duran varlık edinimlerinin 30 milyon ₺'si borçlanma yoluyla yapılmış olup bu kısım
    için nakit çıkışı olmamıştır. Başka hareket yoktur. TMS 7'ye göre maddi duran varlıklarla ilgili olarak yatırım
    faaliyetlerinden net nakit çıkışı kaç milyon ₺'dir?
  secenekler:
    A: '135'
    B: '165'
    C: '175'
    D: '190'
    E: '245'
  dogru: A
  aciklama:
    dogru_neden: 'TMS 7 paragraf 16(a) ve (b) duran varlık edinimi için yapılan nakit ödemeleri ve satışından elde
      edilen nakit tahsilatları yatırım faaliyeti sayar; paragraf 43-44 ise borçlanma yoluyla edinimi nakit akışı
      yaratmayan işlem olarak dışarıda bırakır. Nakit ödeme 190, nakit tahsilat 55 olduğundan net çıkış 135 milyon
      ₺''dir. Püf noktaları: Önce bilanço hareketinden toplam edinimi bulun (520 - 400 + 60 + 40 = 220), sonra nakit
      dışı kısmı çıkarın, en son satış tahsilatını mahsup edin; satış kârı tahsilatın içindedir, ayrıca eklenmez.'
    hesap_adimlari:
    - Toplam edinim = dönem sonu - dönem başı + amortisman + elden çıkarılan varlığın defter değeri = 520 - 400
      + 60 + 40 = 220 milyon ₺.
    - Borçlanma yoluyla yapılan 30 milyon ₺ nakit çıkışı yaratmaz; nakit ödeme = 220 - 30 = 190 milyon ₺.
    - Satıştan nakit tahsilatı 55 milyon ₺'dir (defter değeri 40 + kâr 15).
    - Net yatırım nakit çıkışı = 190 - 55 = 135 milyon ₺.
    celdiriciler:
      B: 165 toplam edinimin (220) nakit dışı kısım düşülmeden alınıp tahsilatın (55) düşülmesiyle bulunur.
      C: 175, satış kârının (15) ödemeden düşülmesiyle bulunur; kâr yatırım nakit akışına ayrıca yansıtılmaz, tahsilat
        55'tir.
      D: 190 yalnızca brüt nakit ödemedir; satıştan elde edilen 55 milyon ₺ tahsilat mahsup edilmemiştir.
      E: 245 satış tahsilatının çıkış tutarına eklenmesiyle bulunur; tahsilat çıkışı azaltır.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 16(a)
    alinti: Maddi ve maddi olmayan duran varlıklar ile diğer uzun vadeli varlıkların edinimi için yapılan nakit
      ödemeler.
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 16(b)
    alinti: Maddi ve maddi olmayan duran varlıklar ile diğer uzun vadeli varlıkların satışından elde edilen nakit
