      A: 32 aktifleştirilen faizin dışarıda bırakılmasıyla bulunur; paragraf 32 aktifleştirilen faizi de kapsar.
      B: 40, aktifleştirilen faizin dışlanması ve tahakkuk değişiminin ters işaretle alınmasıyla bulunur.
      D: 46 tahakkuk eden toplam faizdir; faiz borcundaki artış ödenmeyen kısım olduğundan ödeme daha düşüktür.
      E: 50, tahakkuk değişiminin ters işaretle uygulanmasıyla bulunur (46 - 5 + 9).
