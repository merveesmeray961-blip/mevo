- id: SMMM-TAB-TMS-0056
  sinav: smmm
  bolum: *id001
  ders: TAB
  unite: Finansal tablolar ve TMS 1 / nakit akışı
  konu: TMS
  kazanim: TMS 7 bağlı ortaklık edinimi nakit akışı
  tip: hesaplama
  zorluk: 2
  kok: Bir işletme, dönem içinde bir bağlı ortaklığın kontrolünü elde etmek için tamamı nakden 500 milyon ₺ ödeme
    yapmıştır. Edinilen bağlı ortaklığın kontrol tarihindeki nakit ve nakit benzerleri 60 milyon ₺'dir. TMS 7'ye
    göre nakit akış tablosunda yatırım faaliyetlerinden gösterilecek bu işlemin net nakit çıkışı kaç milyon ₺'dir?
  secenekler:
    A: '60'
    B: '380'
    C: '440'
    D: '500'
    E: '560'
  dogru: C
  aciklama:
    dogru_neden: TMS 7 paragraf 39 uyarınca kontrolün elde edilmesinden doğan toplam nakit akışı yatırım faaliyeti
      sayılır. Paragraf 42 uyarınca ödenen toplam nakit bedel, edinilen nakit ve nakit benzerleri ile netleştirilerek
      sunulur. Net çıkış 500 - 60 = 440 milyon ₺ olur.
    hesap_adimlari:
    - Ödenen toplam nakit bedel 500 milyon ₺'dir.
    - Edinilen nakit ve nakit benzerleri 60 milyon ₺ olup ödenen bedelden netleştirilir.
    - Net nakit çıkışı = 500 - 60 = 440 milyon ₺ ve yatırım faaliyeti olarak sınıflandırılır.
    celdiriciler:
      A: 60 yalnızca edinilen nakittir; net çıkış ödenen bedelden bu tutar düşülerek bulunur.
      B: 380 ise edinilen nakdin iki kez düşülmesiyle bulunmuştur (500 - 60 - 60 = 380).
      D: 500 brüt ödemedir; edinilen nakit ve nakit benzerleri netleştirilmeden gösterilemez.
      E: Edinilen nakit ödenen bedele eklenmez, ondan düşülür; 560 işaret hatasıdır.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 42
    alinti: netleştirilerek sunulur.
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 39
    alinti: nakit akış tablosunda ayrı bir şekilde gösterilir ve yatırım faaliyetleri olarak sınıflandırılır.
  gecerlilik:
