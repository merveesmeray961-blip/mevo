    maliyetine eklenerek aktifleştirilen faiz 10 milyon ₺'dir. Faiz tahakkuku (ödenecek faiz) dönem başında 5 milyon
    ₺, dönem sonunda 9 milyon ₺'dir. TMS 7 paragraf 32'ye göre nakit akış tablosunda açıklanacak dönem içinde ödenen
    toplam faiz kaç milyon ₺'dir?
  secenekler:
    A: '32'
    B: '40'
    C: '42'
    D: '46'
    E: '50'
  dogru: C
  aciklama:
    dogru_neden: 'TMS 7 paragraf 32 uyarınca gider olarak kâr veya zarara yansıtılan veya TMS 23 uyarınca aktifleştirilen,
      dönem boyunca ödenen toplam faiz tutarı nakit akış tablosunda açıklanır. Tahakkuk eden toplam faiz 46, faiz
      borcundaki 4 milyon ₺ artış ödenmeyen kısımdır; ödenen toplam faiz 42 milyon ₺''dir. Püf noktaları: aktifleştirilen
      faiz de ödenen faize dahildir; borç artışı nakit ödemeyi azaltır.'
