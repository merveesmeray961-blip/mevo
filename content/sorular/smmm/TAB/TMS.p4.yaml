- id: SMMM-TAB-TMS-0002
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: TMS
  kazanim: 'TMS 7: dolaylı yöntemle esas faaliyetlerden nakit akışı (nakit dışı kalemler, işletme sermayesi değişimleri,
    yatırım ve finansman kalemlerinin ayrılması)'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '(Ş) A.Ş.''nin 2026 yılına ilişkin bilgileri (bin ₺) aşağıdadır. Esas faaliyetlerden nakit akışları, TMS
    7''ye göre dolaylı yöntemle raporlanacaktır.


    - Dönem net kârı: 600,


    - Amortisman gideri: 150,


    - Maddi duran varlık satış kârı (kâra dahildir; satış bedeli yatırım faaliyetlerinden nakit girişi olarak raporlanacaktır):
    40,


    - Kıdem tazminatı karşılığı gideri (dönem içinde ödeme yapılmamıştır): 30,


    - Gerçekleşmemiş kur farkı kazancı (nakit akışı yaratmamıştır): 15,


    - Ticari alacaklardaki artış: 120,


    - Stoklardaki artış: 100,


    - Ticari borçlardaki artış: 90,


    - Maddi duran varlık alımı için yapılan nakit ödeme: 300,


    - Banka kredisi anapara geri ödemesi: 80,


    - Pay ihracından elde edilen nakit girişi: 200.


    Faiz ve vergi ödemeleri esas faaliyetlerde sınıflandırılmakta olup net kâra dahil edilmiştir; başka bir düzeltme
    gerektirmemektedir.


    Buna göre (Ş) A.Ş.''nin 2026 yılı esas faaliyetlerden kaynaklanan net nakit akışı kaç bin ₺''dir?'
  secenekler:
    A: '295'
    B: '515'
    C: '565'
    D: '595'
    E: '635'
  dogru: D
  aciklama:
    dogru_neden: 'TMS 7 par. 20''ye göre dolaylı yöntemde esas faaliyetlerden net nakit akışı, dönem kârının (a)
      stoklarda ve esas faaliyetlerle ilgili alacak ve borçlardaki değişimler, (b) amortisman, karşılık ve gerçekleşmemiş
      kur farkı gibi nakit akışı yaratmayan kalemler ve (c) yatırım veya finansman faaliyetlerinden kaynaklanan
      nakit akışlarına neden olan kalemler yönünden düzeltilmesiyle bulunur. Hesap: 600 + 150 (amortisman) − 40
      (satış kârı, yatırım) + 30 (karşılık) − 15 (kur farkı kazancı) − 120 (alacak artışı) − 100 (stok artışı) +
      90 (borç artışı) = 595 bin ₺. Maddi duran varlık alımı (par. 16/a) yatırım, kredi geri ödemesi (par. 17/d)
      ve pay ihracı (par. 17/a) finansman faaliyetleridir; esas faaliyet akışını etkilemez.


      Püf noktaları: Sorunun iki katmanı vardır. Birincisi dolaylı yöntemin düzeltmeleridir: nakit dışı giderler
      (amortisman, karşılık) eklenir, nakit dışı gelirler (gerçekleşmemiş kur kazancı) çıkarılır, işletme sermayesindeki
      artışlar (alacak, stok) çıkarılıp borç artışı eklenir. İkincisi sınıflamadır: maddi duran varlık alımı, satış
      kârı, kredi geri ödemesi ve pay ihracı esas faaliyetlerin dışındadır; bunlardan satış kârı dışındakiler esas
      faaliyet akışına hiç girmez, satış kârı ise net kârdan çıkarılır. Kökte verilen 300, 80 ve 200''lük kalemler
      çözüme etki etmeyen verilerdir.'
    celdiriciler:
      A: '295: Maddi duran varlık alımı için yapılan 300 bin ₺''lik ödeme esas faaliyetlerden düşülmüştür. Bu ödeme
        yatırım faaliyetlerinden nakit akışıdır (par. 16/a).'
      B: '515: Banka kredisi anapara geri ödemesi (80) esas faaliyetlerden düşülmüştür. Borçlanılan tutarlara ilişkin
        geri ödemeler finansman faaliyetidir (par. 17/d).'
      C: '565: Nakit çıkışı yaratmayan kıdem tazminatı karşılığı gideri (30) kâra geri eklenmemiştir. Karşılıklar
        par. 20/b uyarınca nakit akışı yaratmayan kalemlerdir.'
      E: '635: Maddi duran varlık satış kârı (40) net kârdan çıkarılacak yerde bırakılmıştır; satış kârı ve satış
        bedeli yatırım faaliyetlerine aittir (par. 14 son paragraf).'
    hesap_adimlari:
    - 'Net kâr: 600'
    - 'Nakit dışı kalemler: +150 (amortisman) + 30 (karşılık) − 15 (kur farkı kazancı) = +165'
    - 'Yatırım faaliyetine ait kalem: −40 (satış kârı)'
    - 'İşletme sermayesi değişimleri: −120 − 100 + 90 = −130'
    - 'Esas faaliyetlerden net nakit akışı: 600 + 165 − 40 − 130 = 595'
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 20
    alinti: 'Dolaylı yöntemde, esas faaliyetlerden kaynaklanan net nakit akışı, dönem kâr veya zararının aşağıdakilerin
      etkilerine göre düzeltilmesiyle tespit edilir: (a) Stoklarda ve esas faaliyetlerle ilgili alacak ve borçlarda
      dönem içinde meydana gelen değişimler, (b) Amortismanlar, karşılıklar, ertelenmiş vergiler, kur farklarından
      kaynaklanan gerçekleşmemiş kazanç veya kayıplar ve iştiraklerin dağıtılmamış kârları gibi nakit akışı yaratmayan
      kalemler ve (c) Yatırım veya finansman faaliyetlerinden kaynaklanan nakit akışlarına neden olan diğer tüm
      kalemler.'
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 16 (a)
    alinti: Maddi ve maddi olmayan duran varlıklar ile diğer uzun vadeli varlıkların edinimi için yapılan nakit
      ödemeler.
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 17 (a)
    alinti: Pay veya diğer özkaynak araçlarının ihracından elde edilen nakit girişleri,
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 17 (d)
    alinti: Borçlanılan tutarlara ilişkin nakit geri ödemeler
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 14 (son paragraf)
    alinti: Fabrikanın bir unsurunun satışı gibi bazı işlemler, kâr veya zarara dâhil edilen bir kazanç veya kaybın
      ortaya çıkmasına neden olabilir. Bu tür işlemlerle ilgili nakit akışları, yatırım faaliyetlerinden kaynaklanan
      nakit akışlarıdır.
  dogrulama:
    python: 'sonuc = 600 + 150 - 40 + 30 - 15 - 120 - 100 + 90

      '
  gecerlilik:
    baslangic: '2018-06-06'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: D (güven 5) 600+150-40+30-15-120-100+90=595 (TMS 7 dolaylı yöntem; yatırım/finansman kalemleri
          hariç).'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Anahtar D: 600 + 150 − 40 + 30 − 15 − 120 − 100 + 90 = 595 (TMS 7 par. 20). MDV alımı (16/a) yatırım,
          kredi anapara (17/d) ve pay ihracı (17/a) finansman; satış kârı par. 14 gereği yatırım akışına ait olduğundan
          kârdan düşülür. A 295, B 515, C 565, E 635 tek hatalı adımla doğrulandı.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: TMS 7 par. 14, 16(a), 17(a), 17(d), 20 alıntıları birebir; dogrulama.python 595 ile aynı.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (D, güven 4)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
  gecmis:
  - tarih: '2026-10-04'
    kim: GZ
    ne: Zorluk 3→2
    neden: Ortalama aday kaynaksız ve yüksek güvenle doğru çözdü.
- id: SMMM-TAB-TMS-0003
  sinav: smmm
  bolum:
  - YET
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: TMS
  kazanim: 'TMS 7: satışlardan kaynaklanan nakit girişi (alacak ve müşteri avansı değişimleri)'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '(P) A.Ş.''nin 2026 yılında KDV hariç net satışları 1.200 bin ₺''dir ve satışların tamamı gelir tablosuna
    yansıtılmıştır. Ticari alacaklar yıl başında 100 bin ₺, yıl sonunda 160 bin ₺; alınan sipariş avansları (müşterilerden
    önceden tahsil edilen tutarlar) yıl başında 30 bin ₺, yıl sonunda 10 bin ₺''dir. Dönem içinde silinen alacak,
    iskonto veya başka bir düzeltme bulunmamaktadır; KDV dikkate alınmayacaktır.


    Buna göre (P) A.Ş.''nin 2026 yılında müşterilerden yaptığı tahsilat, yani mal satışından elde edilen nakit giriş
    tutarı kaç bin ₺''dir?'
  secenekler:
    A: '1.280'
    B: '1.200'
    C: '1.180'
    D: '1.140'
    E: '1.120'
  dogru: E
  aciklama:
    dogru_neden: Mal satışından elde edilen nakit tahsilatlar esas faaliyetlerden nakit akışıdır (TMS 7 par. 14/a)
      ve doğrudan yöntemde satışların, esas faaliyetlerle ilgili alacak ve borçlarda dönem içinde meydana gelen
      değişimlerin etkisine göre düzeltilmesiyle bulunur (par. 19/b-i). Alacaklar 60 bin ₺ arttığından satışın o
      kısmı henüz tahsil edilmemiştir; müşteri avansları 20 bin ₺ azaldığından satışların 20 bin ₺'lik kısmı daha
      önce nakit olarak tahsil edilmiştir. Nakit giriş 1.200 − 60 − 20 = 1.120 bin ₺'dir.
    celdiriciler:
      A: '1.280: Her iki değişim ters işaretle uygulanmıştır (1.200 + 60 + 20). Alacak artışı tahsilatı azaltır,
        avans azalışı da bu yıl nakit tahsilatını azaltır.'
      B: '1.200: Satışlar tahsilata eşit alınmıştır; alacak ve avans değişimleri dikkate alınmamıştır.'
      C: '1.180: Yalnızca avans azalışı (20) düşülmüş, alacak artışı (60) unutulmuştur.'
      D: '1.140: Yalnızca alacak artışı (60) düşülmüş, avans azalışı (20) unutulmuştur.'
    hesap_adimlari:
    - 'Alacaklardaki artış: 160 − 100 = 60 (tahsil edilmemiş satış)'
    - 'Avanslardaki azalış: 30 − 10 = 20 (önceden tahsil edilmiş satış)'
    - 'Nakit giriş: 1.200 − 60 − 20 = 1.120'
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 14 (a)
    alinti: Mal satışından ve hizmet sunumundan elde edilen nakit tahsilatlar,
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 19 (b)(i)
    alinti: Stoklarda ve esas faaliyetlerle ilgili alacak ve borçlarda dönem içinde meydana gelen değişimler,
  dogrulama:
    python: 'sonuc = 1200 - (160 - 100) - (30 - 10)

      '
  gecerlilik:
    baslangic: '2018-06-06'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden''deki ''satışlarda alacak ile ilgili borçlardaki değişimlerin etkisiyle (par.
      19/b ve 20/a)'' → ''doğrudan yöntemde satışların, esas faaliyetlerle ilgili alacak ve borçlardaki değişimlere
      göre düzeltilmesiyle (par. 19/b-i)''; kaynak par. 20(a) (dolaylı yöntem) → par. 19(b)(i) (aynı metin, doğrudan
      yöntem); zorluk 1 → 2 (alacak ve avans değişiminin birlikte ve doğru yönde uygulanması gerekir).'
    neden: 'G6: ifade bozuktu ve dolaylı yöntem paragrafı doğrudan tahsilat hesabına kaynak gösterilmişti.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v2
    kapilar:
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: E (güven 5) Tahsilat = net satış 1.200 - alacak artışı 60 - avans azalışı 20 (önceden
          tahsil edilen avans satışa mahsup) = 1.120.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Anahtar E: 1.200 − 60 (alacak artışı) + (10 − 30) (avans azalışı) = 1.120. A 1.280, B 1.200, C 1.180,
          D 1.140 kesin yanlış. Düzeltme: bozuk ifade ve paragraf atfı (par. 19/b-i) düzeltildi; zorluk 2.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: TMS 7 par. 14(a) ve 19(b)(i) alıntıları birebir; dogrulama.python 1.120 ile aynı.
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday doğru (E, güven 3)
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
