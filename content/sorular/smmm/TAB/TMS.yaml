- id: SMMM-TAB-TMS-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: TMS
  kazanim: TMS 1'e göre dönen varlık sınıflandırma kıstasları
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: TMS 1 Finansal Tabloların Sunuluşu Standardına göre aşağıdakilerden hangisi, bir varlığın dönen varlık olarak
    sınıflandırılması için aranan kıstaslardan biri **değildir**?
  secenekler:
    A: İşletmenin varlığı normal faaliyet döngüsü içinde realize etmeyi beklemesi ya da satmayı veya tüketmeyi amaçlaması
    B: İşletmenin varlığı esas olarak ticari amaçla elde tutması
    C: İşletmenin varlığı raporlama döneminden sonraki on iki ay içinde realize etmeyi beklemesi
    D: Kullanımı en az on iki ay boyunca sınırlandırılmamış nakit veya nakit benzeri bir varlık olması
    E: İşletmenin varlığı edinim tarihinden itibaren on iki ay içinde realize etmeyi beklemesi
  dogru: E
  aciklama:
    dogru_neden: 'TMS 1 md. 66''ya göre on iki aylık süre, varlığın edinim tarihinden değil raporlama döneminden
      sonra başlar: "İşletmenin varlığı raporlama döneminden sonraki on iki ay içinde realize etmeyi beklemesi".
      Edinim tarihini esas alan bir kıstas Standartta yer almaz; bu nedenle E şıkkı dönen varlık kıstaslarından
      biri değildir.'
    celdiriciler:
      A: TMS 1 md. 66(a)'da yer alan normal faaliyet döngüsü kıstasıdır.
      B: TMS 1 md. 66(b)'de yer alan ticari amaçla elde tutma kıstasıdır.
      C: TMS 1 md. 66(c)'de yer alan, raporlama döneminden sonraki on iki ay içinde realize edilme kıstasıdır.
      D: TMS 1 md. 66(d)'de yer alan, kullanımı raporlama döneminden sonraki en az on iki ay sınırlandırılmamış
        nakit veya nakit benzeri kıstasıdır.
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: md. 66 (a)–(c)
    alinti: 'Bir varlık aşağıdaki kıstaslardan herhangi birini karşıladığında, dönen varlık olarak sınıflandırılır:
      (a) İşletmenin varlığı normal faaliyet döngüsü içinde realize etmeyi beklemesi ya da satmayı veya tüketmeyi
      amaçlaması, (b) İşletmenin varlığı esas olarak ticari amaçla elde tutması, (c) İşletmenin varlığı raporlama
      döneminden sonraki on iki ay içinde realize etmeyi beklemesi veya'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: md. 66 (d)
    alinti: (d) Raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü yerine getirmek amacıyla kullanılmasının
      ya da takas edilmesinin sınırlandırılmamış olması koşuluyla, varlığın nakit veya nakit benzeri olması (TMS
      7’de tanımlanan şekilde).
  gecerlilik:
    baslangic: '2026-10-03'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
