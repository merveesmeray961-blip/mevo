- id: SMMM-TAB-TMS-0001
  sinav: smmm
  bolum:
  - YET
  - SGS
  ders: TAB
  unite: Finansal Tablolar ve Analizi
  konu: TMS
  kazanim: TMS 1'e göre dönen varlık sınıflandırma kıstasları
  tip: bilgi
  zorluk: 2
  soru_bicimi: olumsuz
  kok: TMS 1 Finansal Tabloların Sunuluşu Standardına göre aşağıdakilerden hangisi, bir varlığın dönen varlık olarak
    sınıflandırılması için aranan kıstaslardan biri **değildir**?
  secenekler:
    A: İşletmenin varlığı normal faaliyet döngüsü içinde realize etmeyi beklemesi ya da satmayı veya tüketmeyi amaçlaması
    B: İşletmenin varlığı esas olarak ticari amaçla elde tutması
    C: İşletmenin varlığı raporlama döneminden sonraki on iki ay içinde realize etmeyi beklemesi
    D: Varlığın, raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü yerine getirmek amacıyla kullanılmasının
      ya da takas edilmesinin sınırlandırılmamış olması koşuluyla, nakit veya nakit benzeri olması
    E: İşletmenin varlığı edinim tarihinden itibaren on iki ay içinde realize etmeyi beklemesi
  dogru: E
  aciklama:
    dogru_neden: 'TMS 1 par. 66''ya göre on iki aylık süre, varlığın edinim tarihinden değil raporlama döneminden
      sonra başlar: "İşletmenin varlığı raporlama döneminden sonraki on iki ay içinde realize etmeyi beklemesi".
      Edinim tarihini esas alan bir kıstas Standartta yer almaz; bu nedenle E şıkkı dönen varlık kıstaslarından
      biri değildir.'
    celdiriciler:
      A: TMS 1 par. 66(a)'da yer alan normal faaliyet döngüsü kıstasıdır.
      B: TMS 1 par. 66(b)'de yer alan ticari amaçla elde tutma kıstasıdır.
      C: TMS 1 par. 66(c)'de yer alan, raporlama döneminden sonraki on iki ay içinde realize edilme kıstasıdır.
      D: 'TMS 1 par. 66(d)''de yer alan kıstastır: raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü
        yerine getirmek amacıyla kullanılmasının ya da takas edilmesinin sınırlandırılmamış olması koşuluyla varlığın
        nakit veya nakit benzeri olması (TMS 7''de tanımlanan şekilde).'
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 66 (a)–(c)
    alinti: 'Bir varlık aşağıdaki kıstaslardan herhangi birini karşıladığında, dönen varlık olarak sınıflandırılır:
      (a) İşletmenin varlığı normal faaliyet döngüsü içinde realize etmeyi beklemesi ya da satmayı veya tüketmeyi
      amaçlaması, (b) İşletmenin varlığı esas olarak ticari amaçla elde tutması, (c) İşletmenin varlığı raporlama
      döneminden sonraki on iki ay içinde realize etmeyi beklemesi veya'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 66 (d)
    alinti: (d) Raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü yerine getirmek amacıyla kullanılmasının
      ya da takas edilmesinin sınırlandırılmamış olması koşuluyla, varlığın nakit veya nakit benzeri olması (TMS
      7’de tanımlanan şekilde).
  gecerlilik:
    baslangic: '2018-05-24'
    bitis: '2026-12-31'
    yila_bagli_tutar: false
  durum: taslak
  surum: 4
  gecmis:
  - tarih: '2026-10-03'
    kim: duzeltici
    ne: D şıkkına TMS 1 md. 66(d)'deki 'raporlama döneminden sonraki' başlangıç noktası eklendi; şık doğru bir kıstas
      olarak kalıyor (çeldirici), açıklama değişmedi.
    neden: 'G5 (küçük): D şıkkı md. 66(d)''yi başlangıç noktası olmadan aktarıyordu; E''nin tuzağı da bu başlangıç
      noktası olduğundan dikkatli aday D''de takılabilirdi.'
  - tarih: '2026-10-03'
    kim: rotus
    ne: TMS 1 atıflarında 'md.' yerine 'par.' kullanıldı; gecerlilik.baslangic TMS 1'in RG'de yeniden yayım tarihine
      (2018-05-24) çekildi.
    neden: Terim tutarlılığı; baslangic soru üretim tarihiydi.
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: 'gecerlilik.bitis 2026-12-31 yapıldı: TFRS 18 par. C1 ve C8 uyarınca TMS 1, 1 Ocak 2027 ve sonrasında başlayan
      yıllık raporlama dönemlerinden itibaren yürürlükten kalkıyor. TFRS 18 sürümü yazılmadı (uzman görüşüne bağlı,
      UZMAN_INCELEME.md §3-1). D şıkkı ve açıklaması TMS 1 par. 66(d) ifadesine tam uygun yazıldı.'
    neden: Bağımsız hakem bulgusu (3 Ekim 2026, no. 8) ve DUZELTME_LISTESI.md.
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
