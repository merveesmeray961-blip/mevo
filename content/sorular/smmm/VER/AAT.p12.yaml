- id: SMMM-VER-AAT-0053
  sinav: smmm
  bolum: &id001
  - YET
  ders: VER
  unite: Amme alacaklarının tahsili (6183)
  konu: AAT
  kazanim: teminat türleri ve değerlemesi
  tip: hesaplama
  zorluk: 2
  kok: Amme borçlusu Z, 6183 sayılı Kanunun 10 uncu maddesinin 4 numaralı bendi uyarınca Hükümetçe belli edilen millî esham
    ve tahvilatı teminat olarak göstermiştir. Teminatın kabul edilmesine en yakın borsa cetvellerine göre bu senetlerin toplam
    değeri 300.000 TL’dir. Teminat olarak kabul edilecek değer kaç TL’dir?
  secenekler:
    A: 45.000 TL
    B: 255.000 TL
    C: 270.000 TL
    D: 300.000 TL
    E: 345.000 TL
  dogru: B
  aciklama:
    dogru_neden: '6183 sayılı Kanunun 10 uncu maddesinin 4 numaralı bendine göre Hükümetçe belli edilecek millî esham ve tahvilat,
      teminatın kabul edilmesine en yakın borsa cetvelleri üzerinden yüzde 15 noksaniyle değerlendirilir: 300.000 × (1 − 0,15)
      = 255.000 TL. Püf noktaları: Yüzde 15’lik tutar teminat değeri değil, düşülecek kısımdır; bu nedenle cevap borsa değerinin
      yüzde 85’idir.'
    celdiriciler:
      A: 45.000 TL, borsa değerinin yüzde 15’idir; Kanun bu tutarı teminat değeri olarak değil, düşülecek noksaniyet olarak
        öngörmüştür.
      C: 270.000 TL, yüzde 10 noksaniyle bulunur; Kanundaki noksaniyet oranı yüzde 15’tir.
      D: 300.000 TL borsa değeridir; millî esham ve tahvilat değerlenirken borsa değerinden indirim yapılır.
      E: 345.000 TL, borsa değerinin yüzde 15 fazlasıdır; Kanun artırım değil, noksaniyet öngörmüştür.
    hesap_adimlari:
    - Noksaniyet oranı = %15
    - Teminat değeri = 300.000 × (1 − 0,15)
    - = 255.000 TL
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 10/4
    alinti: 4. Hükümetçe belli edilecek Milli esham ve tahvilat "Bu esham ve tahvilat, teminatın kabul edilmesine en yakın
      borsa cetvelleri üzerinden % 15 noksaniyle değerlendirilir.
  gecerlilik:
    baslangic: '1953-07-28'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 300000 * (1 - 0.15)
