    2026’da başlamıştır. B’nin aşağıdaki bağışlarından hangisi, 6183 sayılı Kanunun 27 nci maddesi uyarınca hükümsüzdür?
  secenekler:
    A: 2 Ocak 2022’de yaptığı bağış
    B: 18 Mart 2023’te yaptığı bağış
    C: 30 Nisan 2024’te yaptığı bağış
    D: 11 Mayıs 2024’te yaptığı bağış
    E: 25 Haziran 2025’te yaptığı bağış
  dogru: E
  aciklama:
