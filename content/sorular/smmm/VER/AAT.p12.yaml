- id: SMMM-VER-AAT-0071
  sinav: smmm
  bolum: *id002
  ders: VER
  unite: Amme alacaklarının tahsili (6183)
  konu: AAT
  kazanim: kısmen haczedilebilen gelirler
  tip: uygulama
  zorluk: 2
  kok: Aylık net maaşı 60.000 TL olan (asgari ücretin çok üzerinde geliri bulunan) bir amme borçlusunun maaşı 6183 sayılı
    Kanunun 71 inci maddesi uyarınca haczedilecektir. Maaştan haczolunabilecek tutar en az ve en çok kaç TL olabilir?
  secenekler:
    A: En az 6.000 TL, en çok 12.000 TL
    B: En az 12.000 TL, en çok 15.000 TL
    C: En az 15.000 TL, en çok 20.000 TL
    D: En az 20.000 TL, en çok 30.000 TL
    E: En az 30.000 TL, en çok 40.000 TL
  dogru: C
  aciklama:
    dogru_neden: '71 inci maddeye göre aylıklar, her çeşit ücretler gibi gelirler kısmen haczolunabilir; haczolunacak miktar
      bunların üçte birinden çok, dörtte birinden az olamaz. En az 60.000 / 4 = 15.000 TL, en çok 60.000 / 3 = 20.000 TL haczedilebilir.
      Püf noktaları: Asgari ücreti aşmayan aylık gelirlerin onda birinden fazlası haczolunamaz; burada gelir bunu aştığı için
      dörtte bir–üçte bir sınırı uygulanır.'
    celdiriciler:
      A: 6.000 TL onda bir, 12.000 TL beşte bir oranlarını gösterir; onda bir sınırı yalnızca asgari ücreti aşmayan aylık
        gelirler içindir.
      B: 12.000 TL (beşte bir) alt sınırı yanlış, 15.000 TL (dörtte bir) üst sınırı yanlıştır; sınırlar dörtte bir ile üçte
        bir arasındadır.
      D: 20.000 TL (üçte bir) alt sınır değil üst sınırdır; 30.000 TL ise yarısıdır ve Kanunda yer almaz.
      E: 30.000 TL yarı, 40.000 TL ise üçte iki oranını gösterir; Kanun üçte biri üst sınır kabul eder.
    hesap_adimlari:
    - Alt sınır (dörtte bir) = 60.000 / 4 = 15.000
    - Üst sınır (üçte bir) = 60.000 / 3 = 20.000
