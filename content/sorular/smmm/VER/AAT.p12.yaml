  kok: Vadesinde ödenmeyen 100.000 TL tutarındaki bir amme alacağı için 6183 sayılı Kanunun 51 inci maddesine göre aylık gecikme
    zammı oranı %3,7 olarak uygulanmaktadır. Borç, vade tarihinden 1 ay 15 gün sonra ödenirse (ay kesirlerine isabet eden
    zam, aylık oranın 30’a bölünmesiyle günlük hesaplanacaktır) gecikme zammı kaç TL olur?
  secenekler:
    A: 3.700 TL
    B: 5.550 TL
    C: 6.000 TL
    D: 7.400 TL
    E: 11.100 TL
  dogru: B
  aciklama:
    dogru_neden: '51 inci maddeye göre ödeme müddeti içinde ödenmeyen kısma vadenin bitim tarihinden itibaren her ay için
      ayrı ayrı belirlenen oranda gecikme zammı uygulanır ve ay kesirlerine isabet eden zam günlük hesap edilir. Bir tam ay
      için 100.000 × %3,7 = 3.700 TL; 15 günlük kesir için 3.700 × 15 / 30 = 1.850 TL; toplam 5.550 TL’dir. Püf noktaları:
      Ay kesrini tam ay saymayın; günlük zam aylık zammın 30’da biridir.'
