      veya ödeme müddetinin başlamasından sonra yapılan bağışlamalar ve ivazsız tasarruflar hükümsüzdür. Ödeme süresi 20 Mayıs
      2026’da başladığından dönem 20 Mayıs 2024’ten itibaren işler; yalnızca 25 Haziran 2025 tarihli bağış bu döneme girer.
      Püf noktaları: Önce iki yıl geriye gidin (20 Mayıs 2024), sonra tarihleri bu sınıra göre ayırın; sınırdan önceki bağışlar
      bu madde kapsamında değildir.'
    celdiriciler:
      A: Bu tarih, ödeme süresinin başladığı tarihten geriye doğru iki yıllık dönemin (20 Mayıs 2024) çok öncesindedir.
      B: 18 Mart 2023, iki yıllık dönem başlangıcı olan 20 Mayıs 2024’ten önce olduğundan 27 nci madde kapsamına girmez.
      C: 30 Nisan 2024 dönem başlangıcından yaklaşık üç hafta önce olduğundan hükümsüz sayılan bağışlar arasında değildir.
      D: 11 Mayıs 2024, 20 Mayıs 2024’ten dokuz gün önce olduğundan iki yıllık geriye dönük süreye girmez.
