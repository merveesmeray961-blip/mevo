        pay oranına göre belirlenir.
      B: 200.000 TL şirketin toplam sermayesidir; sorumluluk bu tutarla sınırlı değildir.
      C: 300.000 TL borcun yarısıdır; B’nin payı yüzde 75 olduğundan yarısı değil dörtte üçü sorumludur.
      E: 600.000 TL borcun tamamıdır; limited şirket ortakları yalnızca sermaye hisseleri oranında sorumludur.
    hesap_adimlari:
    - B’nin pay oranı = 150.000 / 200.000 = %75
    - Sorumlu olunan tutar = 600.000 × 0,75
    - = 450.000 TL
