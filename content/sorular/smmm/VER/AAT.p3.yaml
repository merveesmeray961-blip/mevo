  kok: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun'a göre, vadesi 20 Haziran 2021 olan bir vergi
    borcu (amme alacağı) için zamanaşımını kesen bir işlem yapılmamış ve zamanaşımının işlememesi sonucunu doğuran
    bir durum da gerçekleşmemiştir. Bu alacağın tahsil zamanaşımı süresi hangi tarihte dolar?
  secenekler:
    A: 31 Aralık 2025
    B: 20 Haziran 2026
    C: 31 Aralık 2026
    D: 31 Aralık 2027
    E: 31 Aralık 2031
  dogru: C
  aciklama:
    dogru_neden: 6183 sayılı Kanun md. 102'ye göre amme alacağı, vadesinin rastladığı takvim yılını takip eden takvim
      yılı başından itibaren 5 yıl içinde tahsil edilmezse zamanaşımına uğrar. Vade 2021 yılına rastladığından süre
      1 Ocak 2022'de başlar ve 31 Aralık 2026'da dolar.
    celdiriciler:
      A: Süre, vadenin rastladığı yılın (2021) başından değil, takip eden yılın (2022) başından işlemeye başlar;
        31 Aralık 2025 bir yıl erken bir tarihtir.
      B: 5 yıl, vade gününden itibaren değil, vadenin rastladığı takvim yılını takip eden takvim yılı başından itibaren
        sayılır.
      D: Süre, takip eden yılın (2022) sonundan değil başından itibaren işler; 31 Aralık 2027 bir yıl geç bir tarihtir.
      E: Kanundaki tahsil zamanaşımı süresi 10 değil, 5 yıldır.
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 102/1
    alinti: Amme alacağı, vadesinin rasladığı takvim yılını takip eden takvim yılı başından itibaren 5 yıl içinde
      tahsil edilmezse zamanaşımına uğrar.
