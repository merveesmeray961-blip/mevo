- id: SMMM-VER-AAT-0004
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Amme alacaklarının tahsili (6183)
  konu: AAT
  kazanim: ödeme emri
  tip: uygulama
  zorluk: 3
  kok: Bir vergi borcu için 5 Eylül 2026 tarihinde ödeme emri tebliğ edilen Bay (M), borcun 20.000 TL'lik kısmını
    daha önce ödediğini ve kalan borcun bir kısmının zamanaşımına uğradığını ileri sürmektedir. 6183 sayılı Kanuna
    göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: İtiraz için 7 gün süresi vardır ve yalnız borcun tamamına itiraz edilebilir.
    B: Tebliğden itibaren 15 gün içinde itiraz edebilir; itiraz edilen kısmın cihet ve miktarını açıkça göstermelidir.
    C: İtiraz yalnız ödeme emrinin tebliğinden 30 gün sonra yapılabilir.
    D: Ödeme emrine karşı zamanaşımı iddiası ileri sürülemez.
    E: Kısmi itirazda miktarın açıkça gösterilmesine gerek yoktur; yalnız sözlü bildirim yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: '6183 md. 58''e göre ödeme emrine karşı borcun olmadığı, kısmen ödendiği veya zamanaşımına uğradığı
      iddiaları tebliğden itibaren 15 gün içinde ileri sürülebilir. Borcun bir kısmına itiraz eden borçlu, o kısmın
      cihet ve miktarını açıkça göstermek zorundadır. Püf noktaları: 55 inci maddedeki ödeme emri süresi ile 58
      inci maddedeki itiraz süresi aynı 15 günlük süre olsa da işlevleri farklıdır.'
    celdiriciler:
      A: Kanundaki itiraz süresi 15 gündür ve kısmi itiraz mümkündür.
      C: İtiraz süresi 30 gün değil 15 gündür.
      D: Zamanaşımına uğrama, md. 58'de açıkça sayılan itiraz sebeplerindendir.
      E: Kısmi itirazda cihet ve miktarın açıkça gösterilmesi zorunludur; aksi halde itiraz edilmemiş sayılır.
