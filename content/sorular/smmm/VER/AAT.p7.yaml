      sayar; sebeplerden biri mevcutsa ihtiyati haciz hiçbir müddetle bağlı olmaksızın derhal tatbik olunur.
    celdiriciler:
      B: Md. 13, ödeme emri ve süresinin dolmasını beklemeden, sebeplerden biri varken derhal uygulamayı öngörür.
      C: Md. 13'te ihtiyati haciz için alacağın kesinleşmesi veya takibin başlaması ayrıca şart koşulmamıştır.
      D: Kanun, ihtiyati haczi alacaklı amme idaresinin mahalli en büyük memurunun kararına bağlar; mahkeme kararı
        aranmaz.
      E: Belli ikametgâhın bulunmaması md. 13/2'de doğrudan ihtiyati haciz sebebi olarak sayılmıştır.
