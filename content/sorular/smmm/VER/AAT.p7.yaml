    madde: md. 55
    alinti: 'Madde 55 – Amme alacağını vadesinde ödemiyenlere, 15 gün içinde borçlarını

      ödemeleri veya mal bildiriminde bulunmaları lüzumu bir “ödeme emri” ile tebliğ olunur.'
