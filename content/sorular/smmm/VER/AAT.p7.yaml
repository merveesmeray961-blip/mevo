  kok: 6183 sayılı Kanuna göre, amme borçlusunun belli bir ikametgâhının bulunmadığı tespit edilmiştir. Bu durumda
    ihtiyati haciz bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: 13 üncü maddedeki sebeplerden biri mevcut olduğundan ihtiyati haciz derhal uygulanabilir.
    B: İhtiyati haciz ancak ödeme emrinin tebliğinden ve ödeme süresinin dolmasından sonra uygulanabilir.
    C: İhtiyati haciz için önce amme alacağının kesinleşmesi ve takibin başlaması zorunludur.
    D: İhtiyati haciz yalnız mahkeme kararıyla ve borçlunun savunması alındıktan sonra uygulanabilir.
    E: Belli ikametgâhın bulunmaması yalnız teminat istenmesini gerektirir, haciz sebebi oluşturmaz.
