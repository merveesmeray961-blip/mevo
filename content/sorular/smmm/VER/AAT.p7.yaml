      sayar; bu sebeplerden biri mevcutsa ihtiyati haciz derhal tatbik olunur.
    celdiriciler:
      B: Madde 13, ödeme emrinden önce de ihtiyati haciz uygulanabilecek sebepleri düzenler.
      C: İhtiyati haciz için bu maddede ayrıca borcun kesinleşmesi şartı öngörülmemiştir.
      D: Kanun, ihtiyati haczin alacaklı amme idaresinin mahalli en büyük memurunun kararıyla uygulanmasını düzenler.
      E: Belli ikametgâhın bulunmaması, 13 üncü maddede doğrudan ihtiyati haciz sebebidir.
