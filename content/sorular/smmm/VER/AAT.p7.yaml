    A: İhtiyati haciz, Kanunun 13 üncü maddesindeki sebeplerden biri mevcut olduğundan derhal uygulanabilir.
    B: İhtiyati haciz ancak ödeme emrinin tebliğinden sonra uygulanabilir.
    C: İhtiyati haciz için önce borcun kesinleşmesi zorunludur.
    D: İhtiyati haciz yalnız mahkeme kararıyla uygulanabilir.
