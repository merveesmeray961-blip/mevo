- id: SMMM-VER-AAT-0001
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: AAT
  kazanim: Haczi caiz olmayan mallar (6183 md. 70, 71)
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun'a göre, amme borçlusu Bay (H)'ye ait aşağıdaki
    mal, alacak ve gelirlerden hangisi **haczedilemez**?
  secenekler:
    A: Kiraya verdiği dükkânı
    B: Sahibi olduğu, borsada işlem gören hisse senetleri
    C: Bankadaki vadeli mevduat hesabından doğan alacağı
    D: Asgari ücretin üzerinde olan aylık ücretinin dörtte biri
    E: Kendisinin ve ailesinin iki aylık yiyecek ve yakacağı
  dogru: E
  aciklama:
    dogru_neden: 6183 md. 70/6'ya göre borçlu ve ailesinin iki aylık yiyecek ve yakacakları haczedilemeyecek mallar
      arasındadır.
    celdiriciler:
      A: Md. 62 uyarınca borçlunun gayrimenkullerinden amme alacağına yetecek miktar haczolunur; kiraya verilen
        dükkân md. 70'te sayılmamıştır.
      B: Md. 62 borçlunun menkul mallarının haczolunabileceğini öngörür; hisse senetleri md. 70'te sayılmamıştır.
      C: Md. 62 borçlunun alacak ve haklarının da haczolunabileceğini öngörür; mevduat alacağı md. 70'te sayılmamıştır.
      D: Md. 71'e göre ücretler kısmen haczolunabilir ve haczolunacak miktar dörtte birden az, üçte birden çok olamaz;
        aylık ücret asgari ücreti aştığından onda bir sınırı uygulanmaz.
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 70/6
    alinti: 6. Borçlu ve ailesinin iki aylık yiyecek ve yakacakları ile;
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 62/1
    alinti: Borçlunun, mal bildiriminde gösterilen veya tahsil dairesince tesbit edilen borçlu veya üçüncü şahıslar
      elindeki menkul malları ile gayrimenkullerinden, alacak ve haklarından amme alacağına yetecek miktarı tahsil
      dairesince haczolunur.
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 71
    alinti: Aylıklar, ödenekler, her çeşit ücretler, intifa hakları ve hasılatı, ilama bağlı olmayan nafakalar,
      emeklilik aylıkları, sigorta ve emeklilik sandıkları tarafından bağlanan gelirler kısmen haczolunabilir. Ancak
      haczolunacak miktar bunların üçte birinden çok dörtte birinden az olamaz. Asgari ücreti aşmayan aylık gelirlerin
      onda birinden fazlası haczolunamaz.
