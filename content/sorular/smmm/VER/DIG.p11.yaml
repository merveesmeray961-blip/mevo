- id: SMMM-VER-DIG-0080
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: ÖTV
  konu: DIG
  kazanim: MTV istisnaları
  tip: kavrama
  zorluk: 2
  kok: 'Aşağıdaki durumlar ile Motorlu Taşıtlar Vergisi Kanunu md.4 kapsamındaki istisna türleri eşleştirildiğinde
    doğru eşleştirme hangisidir?


    I. Engellilik oranı %90 ve üzeri olan kişinin adına kayıtlı taşıt

    II. Diğer malûl ve engellinin durumuna uygun özel tertibatlı taşıtı

    III. Türkiye''deki yabancı devlet elçiliğine ait taşıt

    IV. Tasfiyesi TMSF eliyle yürütülen müflis bankanın iflas idaresine ait taşıt


    a. Yabancı devlet diplomatik istisnası

    b. Malûl ve engelli istisnası

    c. TMSF kapsamındaki banka istisnası'
  secenekler:
    A: I-b, II-b, III-a, IV-c
    B: I-a, II-b, III-c, IV-b
    C: I-b, II-a, III-b, IV-c
    D: I-c, II-b, III-a, IV-b
    E: I-a, II-c, III-b, IV-c
  dogru: A
  aciklama:
    dogru_neden: I ve II md.4/c'deki malûl ve engelli istisnasına; III md.4/b'deki yabancı diplomatik istisnaya;
      IV md.4/d'deki TMSF kapsamındaki banka istisnasına girer.
    celdiriciler:
      B: I'i diplomatik, IV'ü malûl-engelli istisnasına kaydırmaktadır.
      C: II ve III için istisna türlerini karıştırmaktadır.
      D: I'i TMSF istisnasına bağlamaktadır.
      E: I'i diplomatik, II'yi TMSF istisnasına bağlamaktadır.
