      II-6, III-5, IV-7'dir.
    celdiriciler:
      A: II'yi md. 7'ye, III'ü md. 6'ya bağlamaktadır; diplomatik istisna md. 6, gümrüksüz satış md. 5/2'dir.
      B: İhracat teslimini md. 6'ya, diplomatik istisnayı md. 5'e bağlamaktadır; ikisi ters verilmiştir.
      C: III'ü md. 7'ye, IV'ü md. 5'e bağlamaktadır; gümrüksüz satış md. 5/2, kamu kuruluşları md. 7'dedir.
      D: İhracat teslimini md. 7'ye bağlamaktadır; ayrıca gümrüksüz satış md. 5/2'dedir, kamu kuruluşları md. 7'dedir.
