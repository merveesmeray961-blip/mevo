      \ adlarına kayıtlı taşıtlar ile diğer malûl ve engellilerin, bu durumlarına uygun\nhale getirilmiş özel tertibatlı\
      \ taşıtlar.10\n       d) (Ek: 12/12/2003-5020/7 md.)18.6.1999 tarihli ve 4389 sayılı Bankalar Kanunu\nhükümlerine\
      \ göre temettü hariç ortaklık hakları ile yönetim ve denetimleri veya hisseleri\nkısmen veya tamamen Tasarruf\
      \ Mevduatı Sigorta Fonuna intikal eden bankalara, tasfiyeleri\nTasarruf Mevduatı Sig"
