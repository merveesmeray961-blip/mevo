  kok: '4760 sayılı Özel Tüketim Vergisi Kanunu''nda aşağıdaki işlemlere ilişkin istisnaların düzenlendiği madde
    numaraları I''den IV''e sırasıyla verildiğinde doğru eşleştirme hangisidir?


    I. Ekli listelerdeki malların ihracat teslimleri

    II. (I), (II) ve (III) sayılı listedeki malların diplomatik temsilciliklerce kendi ihtiyaçları için ilk iktisabı,
    ithali veya bunlara teslimi

    III. (III) ve (IV) sayılı listedeki malların gümrüksüz satış mağazalarında satılmak üzere bu mağazalara veya
    depolarına teslimi

    IV. (I) sayılı listedeki malların Milli Savunma Bakanlığı gibi belirli kuruluşların ihtiyacı için teslimi'
  secenekler:
    A: I-5, II-7, III-6, IV-5
    B: I-6, II-5, III-7, IV-6
    C: I-5, II-6, III-7, IV-5
    D: I-7, II-6, III-5, IV-7
    E: I-5, II-6, III-5, IV-7
  dogru: E
  aciklama:
    dogru_neden: İhracat teslimleri md. 5/1'de, diplomatik istisna md. 6'da düzenlenmiştir. (III) ve (IV) sayılı
