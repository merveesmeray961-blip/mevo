- id: SMMM-VER-DIG-0002
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: DIG
  kazanim: 'Veraset ve intikal vergisi beyanname verme süreleri (md. 9): ölümün yabancı memlekette gerçekleşmesi'
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Bay (K), 2026 yılında Almanya'da vefat etmiştir. Mirasçılarından eşi Türkiye'de, oğlu vefat tarihinde Almanya'da
    ve kızı Fransa'da bulunmaktadır. 7338 sayılı Veraset ve İntikal Vergisi Kanunu'na göre bu mirasçıların, veraset
    yoluyla intikal eden mallara ilişkin beyannameyi ölüm tarihini takip eden hangi süre içinde vermeleri gerekir?
  secenekler:
    A: 'Eş: 6 ay, oğul: 4 ay, kız: 8 ay'
    B: 'Eş: 4 ay, oğul: 6 ay, kız: 8 ay'
    C: 'Eş: 6 ay, oğul: 6 ay, kız: 6 ay'
    D: 'Eş: 4 ay, oğul: 4 ay, kız: 6 ay'
    E: 'Eş: 6 ay, oğul: 4 ay, kız: 4 ay'
  dogru: A
  aciklama:
    dogru_neden: 7338 sayılı Kanun md. 9/1-b'ye göre ölüm yabancı bir memlekette meydana gelmişse beyanname süresi,
      mükelleflerin Türkiye'de bulunması hâlinde ölüm tarihini takip eden 6 ay; mükelleflerin müteveffanın bulunduğu
      memlekette olması hâlinde 4 ay; müteveffanın bulunduğu yerin dışında başka bir yabancı memlekette olması hâlinde
      8 aydır. Buna göre Türkiye'deki eş 6 ay, Almanya'daki oğul 4 ay, Fransa'daki kız 8 ay içinde beyanname verir.
    celdiriciler:
      B: 4 ay, ölümün Türkiye'de olması ve mükellefin Türkiye'de bulunması durumundaki süredir (md. 9/1-a); ölüm
        yabancı memlekette olduğundan Türkiye'deki mirasçı için süre 6 aydır, Almanya'daki oğul için ise 4 aydır.
      C: Kanun mükellefin bulunduğu yere göre farklı süreler öngörür; üç mirasçı için aynı 6 aylık süre uygulanmaz.
      D: Fransa'daki kız, müteveffanın bulunduğu yerin dışında başka bir yabancı memlekette olduğundan 6 ay değil
        8 ay süreye sahiptir; Türkiye'deki eşin süresi de 4 ay değil 6 aydır.
      E: Fransa, müteveffanın öldüğü memleket (Almanya) olmadığından kız için 4 ay değil, müteveffanın bulunduğu
        yerin dışındaki yabancı memleket için öngörülen 8 ay uygulanır.
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 9/1-b
    alinti: Ölüm yabancı bir memlekette vukubulmuş ise mükelleflerin Türkiye'de bulunmaları halinde ölüm tarihini
      takibeden altı ay içinde, mükellefler müteveffanın bulunduğu memlekette oldukları takdirde ölüm tarihini takibeden
      dört ay içinde, mükellefler müteveffanın bulunduğu yerin dışında başka bir yabancı memlekette oldukları takdirde
      de ölüm tarihini takibeden sekiz ay içinde;
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 9/1-a
    alinti: Ölüm Türkiye'de vukubulmuş ise mükelleflerin Türkiye'de bulunmaları halinde ölüm tarihini takibeden
      dört ay içinde, mükelleflerin yabancı bir memlekette bulunmaları halinde ölüm tarihini takibeden altı ay içinde;
