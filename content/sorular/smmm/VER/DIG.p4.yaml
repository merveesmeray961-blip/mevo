- id: SMMM-VER-DIG-0003
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: DIG
  kazanim: 'Motorlu taşıtlar vergisi: mükellefiyetin başlaması (ilk tescil ve devir) ve ilk tescilde verginin ödenme
    zamanı (md. 7, 9)'
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Hesap dönemi takvim yılı olan (Ö) A.Ş., 2026 yılında Karayolları Trafik Kanunu uyarınca aşağıdaki taşıtları
    adına kayıt ve tescil ettirmiştir (taşıtların yıllık motorlu taşıtlar vergisi tutarları ve tescil tarihleri
    verilmiştir; taşıtlar 197 sayılı Kanunun (I) veya (II) sayılı tarifesine girmekte, yıl içinde vergi tutarlarında
    değişiklik olmamaktadır):


    - 10 Mart 2026''da ilk defa kayıt ve tescil edilen otomobil: yıllık vergi 24.000 TL,


    - 12 Ağustos 2026''da ilk defa kayıt ve tescil edilen kamyonet: yıllık vergi 18.000 TL,


    - 8 Nisan 2026''da, önceki malik adına kayıtlı iken devir ve temlik sebebiyle şirket adına tescil edilen ikinci
    el otomobil: yıllık vergi 20.000 TL.


    197 sayılı Motorlu Taşıtlar Vergisi Kanunu''na göre (Ö) A.Ş.''nin bu üç taşıt için ilgili kayıt ve tescil tarihinden
    itibaren bir ay içinde ödemesi gereken toplam motorlu taşıtlar vergisi kaç TL''dir?'
  secenekler:
    A: '42.000'
    B: '33.000'
    C: '31.000'
    D: '30.000'
    E: '21.000'
  dogru: E
  aciklama:
    dogru_neden: 'MTVK md. 9''a göre yıl içinde ilk defa kayıt ve tescil edilen taşıtlarda vergi yıllık olarak tahakkuk
      eder; tahakkuk eden verginin taksit süresi geçmiş olan kısmı kayıt ve tescil tarihinden itibaren bir ay içinde
      ödenir. Vergi Ocak ve Temmuz aylarında iki eşit taksitte ödendiğinden: (1) Mart tescilinde Ocak taksiti geçmiştir,
      24.000 / 2 = 12.000 TL bir ay içinde ödenir (Temmuz taksiti Temmuz''da ödenir). (2) Ağustos tescilinde ilk
      altı aylık dönem geçtiğinden yalnızca ikinci altı aylık döneme ilişkin vergi (18.000 / 2 = 9.000 TL) tahakkuk
      eder; Temmuz taksidinin süresi geçmiş olduğundan bu tutar da tescilden itibaren bir ay içinde ödenir. (3)
      Md. 7/b''ye göre devir ve temlik sebebiyle yapılan tescil takvim yılının ilk altı ayında yapılmışsa yeni malikin
      mükellefiyeti takip eden son altı aylık dönemin başından (1 Temmuz) itibaren dikkate alınır; bu nedenle Nisan''daki
      devirde tescilden itibaren bir ay içinde ödenecek vergi yoktur. Toplam 12.000 + 9.000 + 0 = 21.000 TL.


      Püf noktaları: Üç taşıtın üçü de farklı bir kurala bağlanır. İlk altı ayda ilk kez tescil edilen taşıtta vergi
      yıllık tahakkuk eder ama tescilden itibaren bir ay içinde yalnızca taksit süresi geçmiş yarısı ödenir (md.
      9). Temmuz''dan sonra ilk kez tescil edilen taşıtta ise yalnızca ikinci altı aya ilişkin yarı vergi tahakkuk
      eder. Devir yoluyla edinilen taşıtta mükellefiyet md. 7/b gereği devir ilk altı ayda olsa bile Temmuz başında
      başlar; bu yüzden ''tescilden itibaren bir ay içinde'' ödenecek tutar yoktur. Kökteki yıllık vergi tutarlarının
      hepsini toplamak, hazırlıksız adayların yaptığı klasik hatadır.'
    celdiriciler:
      A: '42.000: Her iki ilk tescilde de yıllık verginin tamamı (24.000 + 18.000) bir ay içinde ödenecekmiş gibi
        alınmıştır. Oysa yıllık tahakkuk eden verginin yalnızca taksit süresi geçmiş kısmı bir ay içinde ödenir.'
      B: '33.000: Mart tescilinde yıllık verginin tamamı (24.000) alınmış, Ağustos tescili doğru (9.000) hesaplanmıştır.
        Mart tescilinde Temmuz taksidinin süresi henüz gelmemiştir.'
      C: '31.000: Devralınan ikinci el otomobilin ikinci altı aylık vergisi (20.000 / 2 = 10.000) de eklenmiştir.
        Ancak yeni malikin mükellefiyeti Temmuz başından başlar ve vergi Temmuz taksidinde ödenir; tescilden itibaren
        bir ay içinde ödenecek vergi yoktur.'
      D: '30.000: Mart tescilinde yalnızca Ocak taksiti (12.000) doğru bulunmuş, ancak Ağustos tescilinde yıllık
        verginin tamamı (18.000) alınmıştır. Ağustos''ta yalnızca ikinci altı aylık döneme ilişkin vergi tahakkuk
        eder.'
    hesap_adimlari:
    - 'Mart tescili: taksit süresi geçmiş kısım (Ocak) = 24.000 / 2 = 12.000 TL'
    - 'Ağustos tescili: yalnız ikinci altı aylık dönem vergisi = 18.000 / 2 = 9.000 TL'
    - 'Nisan devri: yeni malikin mükellefiyeti 1 Temmuz''dan başlar; bir ay içinde ödenecek vergi = 0'
    - 'Toplam: 12.000 + 9.000 + 0 = 21.000 TL'
  kaynaklar:
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 7 (a) bendi
    alinti: Takvim yılının ilk altı ayı içinde yeni kayıt ve tescil edilen taşıtlarda kayıt ve tescilin yapıldığı
      takvim yılı başından, son altı ayı içinde yeni kayıt ve tescil edilen taşıtlarda ise, son altı aylık dönemin
      başından itibaren,
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 7 (b) bendi
    alinti: Kayıt ve tescilli olup da devir ve temlik sebebiyle kayıt ve tescil yapılan taşıtlarda değişiklik, takvim
      yılının ilk altı ayında yapılmış ise takip eden son altı aylık dönemin başından; son altı ayında yapılmış
      ise takip eden takvim yılı başından itibaren, Nazara alınır.
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 9/4
    alinti: Motorlu taşıtlar vergisi her yıl Ocak ve Temmuz aylarında iki eşit taksitte ödenir.
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 9 (ilk tescil)
    alinti: yıl içinde ilk defa kayıt ve tescillerinin yapılması halinde vergi, yıllık olarak tahakkuk eder. Tahakkuk
      eden verginin taksit süresi geçmiş olan kısmı kayıt ve tescilin yapıldığı tarihten itibaren bir ay içinde
      ödenir. Şu kadar ki, ilk altı aylık dönem geçtikten sonra yapılacak kayıt ve tescil işlemlerinde, sadece ikinci
      altı aylık döneme ilişkin vergi tahakkuk eder ve ödenir.
  gecerlilik:
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  gecmis:
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'hakem 2026-10-04: dogru_neden (2)''ye Ağustos tescilindeki 9.000 TL''nin de Temmuz taksit süresi geçtiği
      için bir ay içinde ödendiği eklendi; B çeldiricisinde ''taksitinin'' → ''taksidinin''; kaynak atfı ''md. 9/3''
      → ''md. 9/4'' (taksit cümlesi md. 9''un dördüncü fıkrasıdır). Anahtar değişmedi (E).'
    neden: 'G6: md. 9''da 1. fıkra tahakkuk, 2. tebliğ, 3. vergi dairesi yetkisi, 4. Ocak/Temmuz taksitleri; ''bir
      ay içinde ödenir'' sonucunun Ağustos tescili için gerekçesi açık yazılmamıştı.'
  uretim:
