      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'kör çözücü: E (güven 5) MTVK 9: yıl içinde ilk kayıt/tescilde vergi yıllık tahakkuk eder, taksit süresi
          geçen kısım 1 ay içinde ödenir; ilk altı ay geçtikten sonraki tescilde yalnız 2. altı aylık dönem. Otomobil
          (10 Mart): Ocak taksiti 12.000; kamyonet (12 Ağustos): 2. dönem 9.000; ikinci el devirde (Nisan, Ocak/Temmuz
          dışı) ödeme yok. Toplam 21.000.'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'Düzeltildikten sonra geçti: MTVK md. 9 (ilk tescil fıkrası) metni açık — Mart ilk tescili: yıllık
          tahakkuk, taksit süresi geçmiş Ocak yarısı 12.000 bir ay içinde; Ağustos ilk tescili: yalnız ikinci yarı
          9.000, Temmuz taksidi geçtiğinden bir ay içinde; Nisan devri: md. 7/b''ye göre yeni malik için mükellefiyet
          1 Temmuz''dan, md. 9 son fıkrası yalnız Ocak/Temmuz devirlerinde önceden ödeme ister → 0. Toplam 21.000
          (E). A 42.000, B 33.000, C 31.000, D 30.000 bağımsız hesaplandı, hepsi kesin yanlış. Yorum tartışmalı
          değil; kaynağın lafzına dayanıyor. baslangic 2018-01-01: ilk tescil fıkrasının güncel hâli 7061/24 ile
          1/1/2018''de yürürlüğe girdi. Zorluk 3 makul.'
      G6:
        sonuc: gecti
