- id: SMMM-VER-DIG-0005
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: ÖTV
  konu: DIG
  kazanim: damga vergisi genel hükümleri
  tip: hesaplama
  zorluk: 3
  kok: Bir kâğıtta birbirinden tamamen ayrı iki işlem bulunduğu; işlemlerden birinin maktu, diğerinin nispi damga vergisine
    tabi olduğu ve kâğıdın üç nüsha düzenlendiği varsayılmaktadır. Damga Vergisi Kanununa göre bu kâğıt için kaç ayrı vergi
    uygulaması doğar?
  secenekler:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
    E: '6'
  dogru: C
  aciklama:
    dogru_neden: 'DVK md. 5''e göre maktu vergiye tabi kâğıdın üç nüshasının her biri ayrı ayrı vergilendirilir; nispi vergiye
      tabi kâğıdın yalnız bir nüshası vergilendirilir. Md. 6''ya göre birbirinden tamamen ayrı iki işlemden her biri ayrı
      ayrı vergilendirilir. Böylece 3 + 1 = 4 ayrı vergi uygulaması vardır. Püf noktaları: Önce işlem sayısı, sonra her işlem
      için nüsha kuralı uygulanmalı; nispi vergide üç nüshanın tamamının vergilendirileceği varsayımı hatalıdır.'
    celdiriciler:
      A: 2, yalnız işlem sayısını dikkate alır ve maktu işlemin üç nüshasını gözden kaçırır.
      B: 3, yalnız maktu işlemin üç nüshasını dikkate alır; nispi işlem için bir nüsha vergisini dışarıda bırakır.
      D: 5, nispi işlem için de üç nüsha vergisi uygulayıp toplamı iki artırır.
      E: 6, iki işlemin her birinde üç nüshanın tamamını vergilendirir; nispi işlem için tek nüsha kuralını gözden kaçırır.
    hesap_adimlari:
    - 'Maktu işlem: 3 nüsha = 3 uygulama'
    - 'Nispi işlem: 1 nüsha = 1 uygulama'
    - Toplam = 4 uygulama
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 5
    alinti: 'Madde 5 – (Değişik birinci cümle: 15/7/2016-6728/23 md.) Bir nüshadan fazla

      olarak düzenlenen kâğıtlardan, maktu vergiye tabi olanların her bir nüshası ayrı ayrı aynı

      miktarda; nispi vergiye tabi olanların ise sadece bir nüshası damga vergisine tabidir.'
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 6
    alinti: 'Madde 6 – Bir kağıtta biribirinden tamamen ayrı birden fazla akit ve işlem bulunduğu

      takdirde bunların herbirinden ayrı ayrı vergi alınır.'
