  aciklama:
    dogru_neden: 'MTVK md. 4/a, Türkiye Kızılay Derneği adına kayıt ve tescilli taşıtları; md. 4/c ise engellilik oranı %90
      ve daha fazla olan malûl ve engellilerin adlarına kayıtlı taşıtlarını vergiden istisna eder. Püf noktaları: %90 eşiği,
      md. 4/c''deki ilk grupta ayrıca özel tertibat şartı aranmasını gerektirmez; özel tertibat şartı diğer malûl ve engelliler
      için düzenlenmiştir.'
    celdiriciler:
      A: II numaralı taşıt da %90 eşiğini sağladığından istisnadır.
      B: I numaralı taşıt Kızılay adına kayıtlı olduğundan md. 4/a kapsamındadır.
      C: Her iki taşıt da md. 4'te açıkça sayılan istisna gruplarındadır.
      E: '%90 ve üzeri engellilik için md. 4/c''de adlarına kayıtlı taşıt istisnası ayrıca özel tertibat şartına bağlanmamıştır;
        özel tertibat şartı diğer malûl ve engelliler için geçerlidir.'
