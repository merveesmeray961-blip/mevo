    Derneği adına kayıtlı bir taşıt, (II) engellilik oranı %90 olan bir gerçek kişi adına kayıtlı taşıt. MTVK md. 4''e göre
    bu iki taşıtın durumu nedir?'
  secenekler:
    A: Yalnız I istisnadır.
    B: Yalnız II istisnadır.
    C: İkisi de vergilidir.
    D: İkisi de istisnadır.
    E: I istisna, II yalnız özel tertibatlıysa istisnadır.
