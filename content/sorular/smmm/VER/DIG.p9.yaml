    dogru_neden: DVK md. 5'e göre bir nüshadan fazla düzenlenen nispi vergiye tabi kâğıtlardan yalnız bir nüsha damga vergisine
      tabidir.
    celdiriciler:
      A: Maktu vergide her nüsha ayrı ayrı aynı miktarda vergiye tabidir.
      C: Nispi vergide dört nüsha değil yalnız bir nüsha vergilendirilir.
      D: Maktu vergiye tabi kâğıtların nüshaları da vergilidir.
