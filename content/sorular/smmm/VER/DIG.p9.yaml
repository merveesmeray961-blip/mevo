  - YET
  ders: VER
  unite: ÖTV
  konu: DIG
  kazanim: ÖTV listeleri ve istisnalar
  tip: kavrama
  zorluk: 3
  kok: 4760 sayılı Özel Tüketim Vergisi Kanununda ekli listeler ile istisna hükümleri birlikte değerlendirildiğinde aşağıdaki
    eşleştirmelerden hangisi doğrudur?
  secenekler:
    A: (I) sayılı listedeki malların Millî Savunma Bakanlığının ihtiyacı için bu kuruluşa teslimi — istisna kapsamındadır.
    B: (IV) sayılı listedeki bir malın yabancı devletin Türkiye'deki diplomatik temsilciliğince kendi ihtiyacı için ilk iktisabı
      — diplomatik istisna kapsamındadır.
    C: (II) sayılı listedeki kayıt ve tescile tabi bir aracın yurt içinden serbest bölgeye teslimi — ihracat istisnası kapsamındadır.
    D: (II) sayılı listedeki bir malın gümrüksüz satış mağazasına teslimi — md. 5/2'deki istisna kapsamındadır.
    E: (I) sayılı listedeki bir malın Türkiye'deki sıradan bir alıcıya teslimi — ihracat istisnası kapsamındadır.
  dogru: A
  aciklama:
    dogru_neden: ÖTVK md. 7/1-a, (I) sayılı listedeki malların Millî Savunma Bakanlığı ve sayılan diğer kuruluşların ihtiyacı
      için teslimini istisna eder. Diğer seçeneklerde ya istisnanın kapsamadığı liste kullanılmış ya da ihracat/diplomatik
      istisnanın şartları yanlış genişletilmiştir.
    celdiriciler:
      B: Diplomatik istisna md. 6'da (I), (II) ve (III) sayılı listelerdeki mallarla sınırlıdır; (IV) sayılı liste yoktur.
      C: ÖTVK md. 5/1-b, yurt içinden serbest bölgelere yapılan teslimlerin ihracat sayılmadığını açıkça belirtir.
      D: Gümrüksüz satış mağazası istisnası md. 5/2'de (III) ve (IV) sayılı listedeki mallar için düzenlenmiştir.
      E: İhracat istisnası için teslimin yurt dışındaki müşteriye yapılması ve malın gümrük bölgesinden çıkması gerekir; sıradan
        yurt içi teslim yeterli değildir.
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/1-b
    alinti: "        a) Teslim yurt dışındaki bir müşteriye yapılmalıdır. Yurt dışındaki müşteri tabiri;\nikametgâhı, işyeri,\
      \ kanuni ve iş merkezleri yurt dışında olan alıcılar ile yurt içinde bulunan bir\nişletmenin, yurt dışında faaliyet\
      \ gösteren şubelerini ifade eder.\n        b) Teslim konusu mal, Türkiye Cumhuriyeti Gümrük Bölgesinden çıkmış olmalıdır.\n\
      Malın ihraç edilmeden önce yurt dışındaki alıcı adına hareket edenlere veya bizzat alıcıya\nişlenmek ya da herhangi\
      \ bir şekilde değerlendirilmek üzere yurt içinde teslimi ile yurt içinden\nserbest bölgelere yapılan teslimler ihracat\
      \ sayılmaz.3"
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 6
    alinti: '        Madde 6 – Bu Kanuna ekli (I), (II) ve (III) sayılı listelerde yer alan malların, karşılıklı

      olmak kaydıyla yabancı devletlerin Türkiye’deki diplomatik temsilcilikleri, konsoloslukları ve

      uluslararası anlaşmalarla vergi muafiyeti tanınan uluslararası kuruluşlar ve bunların diplomatik

      haklara sahip mensupları tarafından kendi ihtiyaçları için ilk iktisabı, ithali veya bunlara teslimi'
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/2
    alinti: "        2. (Değişik: 29/3/2018-7104/24 md.) Bu Kanuna ekli (III) ve (IV) sayılı listelerdeki\nmalların, 4458\
      \ sayılı Gümrük Kanununun 95 inci maddesinin (1) numaralı fıkrasına göre\nfaaliyette bulunan gümrüksüz satış mağazalarında\
      \ satılmak üzere bu mağazalara veya bunların\n\n3\n 27/12/2023 tarihli ve 7491 sayılı Kanunun 44 üncü maddesi ile bu\
      \ bende “teslimi” ibaresinden sonra\ngelmek üzere “ile yurt içinden serbest bölgelere yapılan teslimler” ibaresi eklenmiştir.\n\
      \ndepolarına teslimi vergiden müstesnadır.4"
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 7/1-a
    alinti: "         1. (I) sayılı listede yer alan malların;\n         a) Milli Savunma Bakanlığı, Jandarma Genel Komutanlığı,\
      \ Sahil Güvenlik Komutanlığı ve\nMilli İstihbarat Teşkilâtının ihtiyacı için bu kuruluşlara veya bunların gerek göstermeleri\
      \ üzerine ve\nişlemlerin bu kuruluşlar adına yapılması koşuluyla akaryakıt ikmalini yapanlara teslimi,\n         b)\
      \ 6326 sayılı Petrol Kanunu hükümlerine göre petrol arama ve istihsal faaliyetlerinde\nkullanılmak üzere bu faaliyetleri\
      \ yapanlara teslimi,"
