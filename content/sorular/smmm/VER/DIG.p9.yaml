    eşleştirmelerden hangisi doğrudur?
  secenekler:
    A: Diğer suretle intikal → hukuken iktisap tarihinden itibaren iki ay; yarışma/çekiliş → takip eden ayın 15'i.
    B: Diğer suretle intikal → hukuken iktisap tarihinden itibaren üç ay; yarışma/çekiliş → müsabaka günü.
