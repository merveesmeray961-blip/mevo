- id: SMMM-VER-DIG-0077
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: ÖTV
  konu: DIG
  kazanim: damga vergisi genel hükümleri
  tip: uygulama
  zorluk: 3
  kok: Bir sözleşmenin iki nüshası düzenlenmiştir. Aynı kâğıtta birbirinden tamamen ayrı iki işlem yer almakta; işlemlerden
    biri nispi, diğeri maktu vergiye tabidir. Damga Vergisi Kanunu’na göre aşağıdaki eşleştirmelerden hangisi doğrudur?
  secenekler:
    A: Nispi vergi her nüshadan, maktu vergi yalnız bir nüshadan alınır; işlemler tek sayılır.
    B: Nispi vergide yalnız bir nüsha vergilenir; maktu vergide her nüsha ayrı vergilenir ve tamamen ayrı işlemlerden ayrı
      ayrı vergi alınır.
    C: İki nüsha da her durumda vergiden istisnadır.
    D: Yalnız imza atanlardan biri vergi mükellefi olur ve diğer işlem vergilenmez.
    E: Bir kâğıtta birden fazla işlem varsa yalnız en düşük vergi alınır.
  dogru: B
  aciklama:
    dogru_neden: 'DVK md. 5’e göre birden fazla nüshada maktu vergiye tabi her nüsha ayrı ayrı, nispi vergiye tabi kâğıdın
      ise yalnız bir nüshası vergilenir. Md. 6, tamamen ayrı işlemlerden ayrı ayrı vergi alınacağını belirtir. Püf noktaları:
      nüsha kuralı ile birden fazla işlem kuralını birlikte uygulayın.'
    celdiriciler:
      A: Nispi ve maktu nüsha kuralları ters yazılmıştır.
      C: Nüsha düzenlenmesi kendiliğinden istisna doğurmaz.
      D: Genel mükellefiyet imza edenlere aittir; ikinci işlem de değerlendirilir.
      E: Tamamen ayrı işlemlerde en yüksek vergi kuralı uygulanmaz.
