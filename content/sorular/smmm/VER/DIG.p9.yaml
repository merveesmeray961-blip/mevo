  secenekler:
    A: Maktu vergiye tabi kâğıt, dört nüsha — yalnız bir nüsha vergili.
    B: Nispi vergiye tabi kâğıt, dört nüsha — yalnız bir nüsha vergili.
    C: Nispi vergiye tabi kâğıt, dört nüsha — dört nüsha da vergili.
    D: Maktu vergiye tabi kâğıt, dört nüsha — hiçbir nüsha vergili değil.
    E: Nispi vergiye tabi kâğıt, dört nüsha — iki nüsha vergili.
