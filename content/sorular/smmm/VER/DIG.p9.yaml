      itibaren başlamasını; yanan veya tamamen kullanılmaz hâle gelen binalarda ise olayın vuku bulduğu tarihi takip eden
      taksitten itibaren sona ermesini düzenler.
    celdiriciler:
      A: Başlangıçta takip eden bütçe yılı, sona ermede ise takip eden taksit esas alınır; iki olayın günü esas alınmaz.
      C: Sona erme bütçe yılına değil takip eden taksite bağlanmıştır.
      D: Takdir işlemi gereken hâl, dört yıl beklemeyi değil takdir işleminin yapıldığı tarihi esas alır; yanma hâlinde de
        takip eden taksit uygulanır.
      E: Muafiyet şartının kazanılması da md. 9'da sona erme sebebi olarak sayılmıştır.
