  soru_bicimi: olumsuz
  kok: 488 sayılı Damga Vergisi Kanunu'nun genel hükümleriyle ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Bir nüshadan fazla düzenlenen ve nispi vergiye tabi olan kâğıtların her bir nüshası ayrı ayrı damga vergisine
      tabidir.
    B: Damga vergisinin mükellefi kâğıtları imza edenlerdir.
    C: Kâğıtlara konulan imzanın birden fazla olması, kural olarak verginin tekerrürünü gerektirmez.
    D: Cezai şart gibi bir sözleşmenin müeyyidesi niteliğindeki taahhütlerden, başlı başına bir sözleşmeye konu
      olmadıkça damga vergisi alınmaz.
    E: Resmî dairelere bağlı olup ayrı tüzel kişiliği bulunan iktisadi işletmeler, Kanun'un uygulamasında resmî
      daire sayılmaz.
  dogru: A
  aciklama:
    dogru_neden: DVK md. 5'e göre bir nüshadan fazla düzenlenen kâğıtlardan maktu vergiye tabi olanların her nüshası
      ayrı ayrı vergilendirilir; nispi vergiye tabi olanların ise yalnız bir nüshası damga vergisine tabidir.
    celdiriciler:
      B: Doğrudur; md. 3/1 hükmüdür.
      C: Doğrudur; md. 7/1 hükmüdür (maktu vergiye tabi makbuz ve ibra senetleri gibi istisnai durumlar saklıdır).
      D: Doğrudur; md. 6/4 pey akçesi, cayma tazminatı, cezai şart gibi taahhütlerden ayrıca vergi alınmayacağını
        öngörür.
      E: Doğrudur; md. 8/2 hükmüdür.
