- id: SMMM-VER-GVK-0114
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Gelir vergisi
  konu: GVK
  kazanim: gelir unsurları ve istisnalar (md.18; md.21)
  tip: uygulama
  zorluk: 3
  kok: İkametgahı yurt dışında bulunan ve Türkiye'de özel bir iş yeri açarak ticaret yapan yabancı uyruklu X, 2026 takvim
    yılında Türkiye'de toplam yedi ay kalmış; bu süre içinde iki kez birer haftalığına yurt dışına çıkmıştır. X'in başka bir
    statü gerektiren geçici görev, tahsil, tedavi veya seyahat amacı yoktur. 193 sayılı Gelir Vergisi Kanunu'na göre X bakımından
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yurt dışına çıkışlar nedeniyle oturma kesintiye uğramıştır; bu nedenle X Türkiye'de yerleşmiş sayılmaz.
    B: X, ikametgahı yurt dışında olduğundan her hâlde dar mükelleftir.
    C: X, ancak sekiz ay kalırsa yerleşmiş sayılır.
    D: X, Türkiye'de yerleşmiş sayılmaz; çünkü yabancı uyrukludur.
    E: Geçici ayrılmalar oturmayı kesmediğinden X yerleşmiş sayılır ve tam mükelleftir.
  dogru: E
  aciklama:
    dogru_neden: '193 sayılı Kanun md. 4/2 uyarınca bir takvim yılı içinde Türkiye''de devamlı olarak altı aydan fazla oturanlar
      Türkiye''de yerleşmiş sayılır ve geçici ayrılmalar Türkiye''de oturma süresini kesmez. X yedi ay kaldığından ve md.
      5''teki istisnalardan birine girmediğinden yerleşmiş sayılır, bu nedenle md. 3 uyarınca tam mükelleftir. Püf noktaları:
      İkametgah ayrı bir ölçüdür (md. 4/1); altı aydan fazla oturma ise ikinci ve bağımsız ölçüdür. Kısa yurt dışı seyahatleri
      süreyi bölmez; ancak md. 5''teki geçici görev, tahsil, tedavi, istirahat veya seyahat gibi istisnaları ayrıca kontrol
      edin.'
    celdiriciler:
      A: Md. 4/2'ye göre geçici ayrılmalar Türkiye'de oturma süresini kesmez.
      B: İkametgah dışında bir takvim yılı içinde Türkiye'de devamlı olarak altı aydan fazla oturmak da yerleşme sayılır.
      C: Kanundaki ölçü altı aydan fazla oturmaktır; sekiz ay şartı yoktur.
      D: Yerleşme ölçüsü uyrukluk değil, ikametgah veya altı aydan fazla devamlı oturmadır.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 4
    alinti: 'Aşağıda yazılı kimseler Türkiye''de yerleşmiş sayılır: 1. İkametgahı Türkiye''de bulunanlar (İkametgah, Kanunu
      Medeninin 19 uncu ve mütaakıp maddelerinde yazılı olan yerlerdir); 2. (Değişik: 19/2/1963-202/2 md.) Bir takvim yılı
