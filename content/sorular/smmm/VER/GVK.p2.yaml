- id: SMMM-VER-GVK-0122
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Gelir vergisi
  konu: GVK
  kazanim: ücret ve kira beyan sınırları
  tip: hesaplama
  zorluk: 3
  kok: Gelir Vergisi mükellefi K, 1 Ocak 2026'da dairesini 2026, 2027 ve 2028 yıllarını kapsayan üç yıllığına kiraya vermiş
    ve üç yılın toplam kirası olan 1.080.000 TL'yi 2026 yılının Ocak ayında peşin tahsil etmiştir. K ayrıca 2025 yılına ait
    olup 2026 Şubat ayında tahsil ettiği 40.000 TL kira alacağı bulunmaktadır; kira bedelleri yıllara eşit dağılmaktadır.
    193 sayılı Gelir Vergisi Kanunu'nun 72 nci maddesine göre K'nın 2026 yılı gayrisafi hasılatı kaç TL'dir?
  secenekler:
    A: '40.000'
    B: '360.000'
    C: '400.000'
    D: 1.080.000
    E: 1.120.000
  dogru: C
  aciklama:
    dogru_neden: '193 sayılı Kanun md. 72 uyarınca gayrisafi hasılat, bir takvim yılı içinde o yıla veya geçmiş yıllara ait
      olarak tahsil edilen kira bedellerinin tutarıdır; gelecek yıllara ait olup peşin tahsil olunan kiralar ise ilgili bulundukları
      yılların hasılatı sayılır. 1.080.000 TL / 3 yıl = 360.000 TL 2026''ya aittir; 2026''da tahsil edilen geçmiş yıl kirası
      40.000 TL de 2026 hasılatına girer: 360.000 + 40.000 = 400.000 TL. Püf noktaları: Peşin tahsilatın yalnızca ilgili yıla
      isabet eden payı o yılın hasılatıdır; geçmiş yıla ait kira ise tahsil edildiği yılın hasılatına katılır.'
    celdiriciler:
      A: Kırk bin TL yalnızca geçmiş yıla ait tahsilattır; 2026'ya ait peşin kira payı da hasılata dahildir.
      B: 360.000 TL yalnızca peşin tahsil edilen kiranın 2026'ya isabet eden kısmıdır; geçmiş yıla ait ve 2026'da tahsil edilen
        40.000 TL de hasılata girer.
      D: Peşin tahsil edilen kiranın tamamı 2026'nın hasılatı sayılmaz; gelecek yıllara ait kısım ilgili yılların hasılatı
        sayılır.
      E: Peşin kiranın tamamı ve geçmiş yıl alacağı toplanamaz; gelecek yıllara ait kısım 2027 ve 2028'in hasılatıdır.
    hesap_adimlari:
    - Peşin tahsil edilen kiranın 2026'ya isabet eden payı = 1.080.000 / 3 = 360.000 TL
    - Geçmiş yıla ait ve 2026'da tahsil edilen kira = 40.000 TL
    - 2026 gayrisafi hasılatı = 360.000 + 40.000 = 400.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
