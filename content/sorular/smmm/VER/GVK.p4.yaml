- id: SMMM-VER-GVK-0004
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: GVK
  kazanim: 'Vergiye uyumlu mükellef indirimi (mük. md. 121): indirim şartları ve gelir vergisi mükelleflerinde ticari
    kazanç oranına göre indirim tutarı'
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Gelir vergisinde gerçek usulde vergilendirilen Bay (F), 2026 yılı gelirlerine ilişkin yıllık beyannamesinde
    ticari kazanç olarak 720.000 TL, gayrimenkul sermaye iradı (safi irat) olarak 480.000 TL beyan etmiştir; toplam
    gelir vergisi matrahı 1.200.000 TL''dir. Başka geliri, indirimi veya mahsup edilecek vergisi bulunmamaktadır.


    193 sayılı Gelir Vergisi Kanunu''nun mükerrer 121. maddesindeki vergiye uyumlu mükellef indirimi bakımından
    Bay (F)''nin durumu şöyledir:


    - Beyannamenin ait olduğu yıl ile önceki iki yıla ait tüm vergi beyannameleri kanuni süresinde verilmiştir.
    Bunlardan 2025 yılı gelir vergisi beyannamesi için, kanuni süresinde verilmesinden sonra, kanuni süre geçtikten
    sonra düzeltme amacıyla ayrıca bir beyanname daha verilmiştir.


    - 2025 yılı için ikmalen tarh edilen ve 2026 yılında kesinleşen vergi (ceza ve fer''i alacaklar dahil), indirimin
    hesaplanacağı beyannamenin ait olduğu yıl için geçerli indirim tutar sınırının %1''ini aşmamaktadır.


    - İlgili beyannameler üzerine tahakkuk eden vergilerin tümü ödenmiştir, vadesi geçmiş borcu bulunmamaktadır
    ve Vergi Usul Kanunu''nun 359. maddesinde sayılan fiilleri işlememiştir.


    - Hesaplanacak indirim tutarı, Kanun''daki azami indirim tutarını aşmamaktadır.


    2026 takvim yılı gelir vergisi tarifesi:


    190.000 TL''ye kadar %15


    400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20


    1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27


    5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35


    5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40


    Buna göre Bay (F)''nin 2026 yılı beyannamesi üzerinden ödeyeceği gelir vergisi kaç TL''dir?'
  secenekler:
    A: '287.375'
    B: '293.425'
    C: '294.655'
    D: '296.450'
    E: '302.500'
  dogru: B
  aciklama:
    dogru_neden: 'Hesaplanan gelir vergisi, 1.200.000 TL matrah için 232.500 + (1.200.000 − 1.000.000) × %35 = 302.500
      TL''dir. GVK mük. md. 121''e göre şartları taşıyan mükelleflerin beyanname üzerinden hesaplanan verginin %5''i
      ödenecek vergiden indirilir; gelir vergisi mükelleflerinde indirim, ticari kazancın toplam matrah içindeki
      oranı (720.000 / 1.200.000 = %60) dikkate alınarak hesaplanan vergi esas alınarak bulunur: 302.500 × %60 ×
      %5 = 9.075 TL. Ödenecek vergi 302.500 − 9.075 = 293.425 TL''dir. Şartlar sağlanmaktadır: kanuni süresinde
      verilmiş beyannameye ilişkin sonradan verilen düzeltme beyannamesi şartı ihlal etmez ve kesinleşen tarhiyat
      azami indirim tutar sınırının %1''ini aşmadığından ikinci şart da ihlal edilmiş sayılmaz.


      Püf noktaları: Soruda üç tuzak vardır. (1) Kanuni süresinde verilmiş bir beyannameye ilişkin sonradan verilen
      düzeltme beyannamesi, mük. md. 121''in 1. bendinde açıkça şartın ihlali sayılmayan hâllerdendir; yani ''geç
      düzeltme verdi, indirimi kaybetti'' diye düşünmeyin. (2) İkmalen tarh edilip kesinleşen vergi, 2. bendin parantezindeki
      %1''lik eşiği aşmadığı için indirimi engellemez. (3) Gelir vergisi mükellefinde indirim tüm vergiye değil,
      ticari kazancın matraha oranına göre bulunan vergiye uygulanır; oranı bulurken gayrimenkul sermaye iradı payda
      kalır. Kökteki azami tutar bilgisi çözüme girmez.'
    celdiriciler:
      A: '287.375: İndirim, ticari kazanç oranı dikkate alınmadan verginin tamamı üzerinden (302.500 × %5 = 15.125)
        hesaplanmıştır. Gelir vergisi mükelleflerinde indirim, ticari kazancın matrah içindeki oranına göre belirlenen
        vergiye uygulanır.'
      C: '294.655: İndirim, yalnızca ticari kazanca tarife uygulanarak ayrı hesaplanan vergi (720.000 için 156.900
        TL) üzerinden bulunmuştur (156.900 × %5 = 7.845). Kanun, toplam vergiyi ticari kazancın toplam matraha oranıyla
        çarpar (302.500 × %60 = 181.500).'
      D: '296.450: Ticari kazanç oranı yanlış alınmıştır; gayrimenkul sermaye iradının oranı olan %40 kullanılmıştır
        (302.500 × %40 × %5 = 6.050).'
      E: '302.500: İndirim hiç uygulanmamıştır. Düzeltme beyannamesinin kanuni süreden sonra verilmesi ve tarhiyatın
        bulunması indirimi ortadan kaldırmaz: Kanun, kanuni süresinde verilen bir beyannameye ilişkin olarak süresinden
        sonra düzeltme amacıyla verilen beyannameleri şartın ihlali saymaz; kesinleşen tarhiyat ise beyannamenin
        ait olduğu yıl için geçerli indirim tutar sınırının %1''ini aşmadıkça şartı bozmaz.'
    hesap_adimlari:
    - 'Gelir vergisi: 232.500 + (1.200.000 − 1.000.000) × %35 = 302.500 TL'
    - 'Ticari kazanç oranı: 720.000 / 1.200.000 = %60'
    - 'İndirim: 302.500 × %60 × %5 = 9.075 TL'
    - 'Ödenecek gelir vergisi: 302.500 − 9.075 = 293.425 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 121/1 (indirim oranı)
    alinti: Ticari, zirai veya mesleki faaliyeti nedeniyle gelir vergisi mükellefi olanlar ile kurumlar vergisi
      mükelleflerinden (finans ve bankacılık sektörlerinde faaliyet gösterenler, sigorta ve reasürans şirketleri
      ile emeklilik şirketleri ve emeklilik yatırım fonları hariç olmak üzere), bu maddenin ikinci fıkrasında belirtilen
      şartları taşıyanların yıllık gelir veya kurumlar vergisi beyannameleri üzerinden hesaplanan verginin %5’i,
      ödenmesi gereken gelir veya kurumlar vergisinden indirilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 121/1 (gelir vergisi mükellefleri)
    alinti: Gelir vergisi mükelleflerinin yararlanacağı indirim tutarı, ticari, zirai veya mesleki faaliyet nedeniyle
      beyan edilen kazançların toplam gelir vergisi matrahı içerisindeki oranı dikkate alınmak suretiyle hesaplanan
      gelir vergisi esas alınarak tespit edilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 121/2, 1. bent
    alinti: İndirimin hesaplanacağı beyannamenin ait olduğu yıl ile bu yıldan önceki son iki yıla ait vergi beyannamelerinin
      kanuni süresinde verilmiş (Kanuni süresinde verilen bir beyannameye ilişkin olarak kanuni süresinden sonra
      düzeltme amacıyla veya pişmanlıkla verilen beyannameler bu şartın ihlali sayılmaz.) olması,
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 121/2, 2. bent
    alinti: (1) numaralı bentte belirtilen süre içerisinde kesinleşmiş olması koşuluyla vergi beyannamelerindeki
      vergi türleri itibarıyla ikmalen, re’sen veya idarece yapılmış bir tarhiyat bulunmaması (Kesinleşen tarhiyatların,
      indirimin hesaplanacağı beyannamenin ait olduğu yıl için geçerli olan, birinci fıkradaki indirim tutar sınırının
      %1’ini aşmaması durumunda bu şart ihlal edilmiş sayılmaz.),
  dogrulama:
    python: 'vergi = 232500 + (1200000 - 1000000) * 0.35

      oran = 720000 / 1200000

      indirim = vergi * oran * 0.05

      sonuc = vergi - indirim

      '
