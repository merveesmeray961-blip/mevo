      için 58.000 TL istisna haddini aştığından istisnadan yararlanamaz. Püf noktaları: Ücrette tek işveren ve 5,3
      milyon TL eşiği, kirada ise 58.000 TL istisna haddi ayrı ayrı uygulanmalıdır.'
    celdiriciler:
      A: A'nın 5.200.000 TL ücreti tek işverenden ve 5.300.000 TL sınırının altında olduğundan beyan edilmez; B
        ise istisna haddini aşmıştır.
      B: B'nin 60.000 TL kira hasılatı 58.000 TL sınırını aştığı için beyanname durumu B bakımından farklıdır.
      C: A, 5.300.000 TL sınırını aşmadığı için beyanname vermez; B ise 58.000 TL istisna haddini aşmıştır.
      D: A için doğru sonuç verilmiştir; ancak B'nin kira hasılatı istisna haddini aştığı için istisnadan yararlanamaz.
