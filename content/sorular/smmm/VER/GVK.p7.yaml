  kok: 2026 yılında beyannamede bildirilecek geliri 1.000.000 TL olan bir mükellefin, Türkiye’de yapılmış ve belgelenmiş
    80.000 TL eğitim ve sağlık harcaması ile kamu yararına çalışan bir derneğe makbuz karşılığı yaptığı 70.000 TL
    bağış bulunmaktadır. Başka bir indirim yoktur. GVK md. 89’daki ilgili üst sınırlar dikkate alındığında toplam
    indirilebilecek tutar kaç TL’dir?
  secenekler:
    A: '50.000'
    B: '100.000'
    C: '120.000'
    D: '130.000'
    E: '150.000'
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 89/2 eğitim ve sağlık harcamalarını beyan edilen gelirin %10’u ile sınırlar: 1.000.000
      x %10 = 100.000 TL olduğundan 80.000 TL’nin tamamı indirilebilir. Md. 89/4 kapsamındaki bağışlar genel olarak
      beyan edilecek gelirin %5’i ile sınırlıdır: 1.000.000 x %5 = 50.000 TL; 70.000 TL bağışın 50.000 TL’si indirilebilir.
      Toplam 130.000 TL’dir. Püf noktaları: İki harcama aynı üst sınıra tabi değildir; %10 ve %5 sınırları ayrı
      uygulanır.'
    celdiriciler:
      A: 50.000 TL yalnız bağış için uygulanabilecek üst sınırdır; eğitim ve sağlık indirimi ayrıca vardır.
      B: 100.000 TL eğitim ve sağlık için hesaplanan üst sınırdır; bağış indirimi de ayrıca değerlendirilir.
      C: 120.000 TL, 80.000 TL harcama ile 40.000 TL bağışın yanlış sınırla alınmasından doğar.
      E: 150.000 TL, 80.000 + 70.000 TL’nin tamamının sınırsız indirildiği yaklaşımdır.
    hesap_adimlari:
    - 'Eğitim ve sağlık üst sınırı: 1.000.000 x %10 = 100.000 TL; indirilecek = 80.000 TL'
    - 'Bağış üst sınırı: 1.000.000 x %5 = 50.000 TL; indirilecek = 50.000 TL'
    - Toplam indirim = 80.000 + 50.000 = 130.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/2
    alinti: '        2. Beyan edilen gelirin % 10’unu aşmaması, Türkiye’de yapılması ve gelir veya

      kurumlar vergisi mükellefiyeti bulunan gerçek veya tüzel kişilerden alınacak belgelerle tevsik

      edilmesi şartıyla, mükellefin kendisi, eşi ve küçük çocuklarına ilişkin olarak yapılan eğitim ve

      sağlık harcamaları (mükerrer 121 inci madde çerçevesinde eğitim ve sağlık harcamaları

      nedeniyle vergi indiriminden yararlanan ücretliler, aynı harcamalarını bu hükümden

      yararlanarak matrahlarından indiremezler).94'
