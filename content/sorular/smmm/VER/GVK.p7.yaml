    A: Bir işletmenin mal satışından elde ettiği hasılat
    B: Bankadaki mevduattan elde edilen faiz
    C: Serbest meslek faaliyeti karşılığı alınan ücret
    D: İşletmenin kendi aracını satmasından doğan ticari kazanç
    E: Meskenin satışından doğan değer artışı kazancı
