- id: SMMM-VER-GVK-0010
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Gelir vergisi
  konu: GVK
  kazanim: indirimler (md.89)
  tip: hesaplama
  zorluk: 2
  kok: 2026 yılında gelir vergisi beyannamesinde bildirilecek geliri 400.000 TL olan bir mükellefin, Türkiye'de
    yaptığı ve usulüne uygun belgelerle tevsik ettiği 50.000 TL eğitim ve sağlık harcaması vardır. Aynı harcamalar
    başka bir vergi indiriminden yararlandırılmamıştır. GVK md. 89/2'ye göre matrahtan indirilebilecek tutar kaç
    TL'dir?
  secenekler:
    A: '10.000'
    B: '20.000'
    C: '30.000'
    D: '40.000'
    E: '50.000'
  dogru: D
  aciklama:
    dogru_neden: GVK md. 89/2, eğitim ve sağlık harcamalarının beyan edilen gelirin %10'unu aşmaması şartını getirir.
      400.000 TL'nin %10'u 40.000 TL olduğundan, 50.000 TL harcamanın en fazla 40.000 TL'si indirilebilir.
    celdiriciler:
      A: 10.000 TL, harcamanın %2,5'ine karşılık gelir; kanundaki üst sınır %10'dur.
      B: 20.000 TL, beyan edilen gelirin %5'idir; izin verilen azami indirim %10'dur.
      C: 30.000 TL, beyan edilen gelirin %7,5'idir; 40.000 TL'lik üst sınırın altında kalır.
      E: 50.000 TL harcamanın tamamıdır; ancak %10'luk sınır nedeniyle yalnız 40.000 TL indirilebilir.
    hesap_adimlari:
    - 400.000 × %10 = 40.000 TL
    - Harcama 50.000 TL olduğundan indirilebilecek tutar 40.000 TL ile sınırlıdır.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/2
