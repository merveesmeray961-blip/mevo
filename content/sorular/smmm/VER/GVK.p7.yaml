    dogru_neden: GVK md. 18, eserlerin neşir, temsil, icra ve teşhir gibi suretlerle değerlendirilmesi karşılığında
      alınan bedel ve ücretlerin istisnaya dahil olduğunu düzenler.
    celdiriciler:
      A: Madde, eserlerin satışı ve hakların devri yanında neşir karşılığı bedelleri de kapsar.
      B: Arızi elde edilme, istisnadan yararlanmaya engel değildir; madde bunu ayrıca belirtir.
      C: İstisna yalnız ücret ödemelerine değil, eserlerin değerlendirilmesinden elde edilen hasılata ilişkindir.
      D: Madde internet ortamını örneklerden biri olarak sayar; istisna yalnız bu ortama bağlı değildir.
