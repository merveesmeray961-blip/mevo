  kok: Bay (L), 2022 yılında satın aldığı bir konutu 2026 yılında elden çıkarmıştır. Konut ivazsız edinilmemiştir
    ve başka bir istisna uygulanmamaktadır. GVK md. 80 bakımından bu işlemden doğan kazancın niteliği aşağıdakilerden
    hangisidir?
  secenekler:
    A: Değer artışı kazancı
    B: Ticari kazanç
    C: Menkul sermaye iradı
    D: Ücret
    E: Zirai kazanç
  dogru: A
  aciklama:
    dogru_neden: GVK mükerrer md. 80/1-6, belirli taşınmazların iktisap tarihinden başlayarak beş yıl içinde elden
      çıkarılmasından doğan kazançları değer artışı kazancı sayar. 2022'den 2026'ya kadar beş yıllık süre dolmadığından
      kökteki kazanç bu kapsamdadır.
    celdiriciler:
      B: Ticari faaliyet niteliği verilmediği için md. 80 kapsamındaki değer artışı kazancı kuralı uygulanır.
      C: Konutun elden çıkarılmasından doğan kazanç, bu şartlarda menkul sermaye iradı değildir.
      D: Ücret, hizmet karşılığı elde edilen gelirdir; konut satış kazancı değildir.
      E: Zirai faaliyetle ilgili bir gelir bulunmadığından zirai kazanç söz konusu değildir.
