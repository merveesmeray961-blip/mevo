  zorluk: 2
  kok: Bir eser sahibi, eserinin neşri karşılığında 2026 yılında bir bedel elde etmiştir. Bu bedelin Gelir Vergisi
    Kanununun 18 inci maddesindeki serbest meslek kazancı istisnası bakımından durumu hangisidir?
  secenekler:
    A: İstisna kapsamına girmez; yalnız satıştan elde edilen bedeller kapsam dışıdır.
    B: İstisna kapsamına girmez; yalnız arızi elde edilen kazançlar kapsam dışıdır.
    C: İstisna yalnız ücret niteliğindeki ödemelere uygulanır.
    D: İstisna yalnız eserlerin internet ortamında yayımlanmasına ilişkin bedellere uygulanır.
    E: Eserin neşri karşılığında alınan bedel istisna kapsamındadır.
