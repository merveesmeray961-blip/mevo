    yıllık beyanname durumu aşağıdakilerden hangisidir?
  secenekler:
    A: A beyanname verir; B vermez.
    B: A ve B beyanname vermez.
    C: A ve B beyanname verir.
    D: A vermez; B kira istisnasından yararlanarak beyanname vermez.
    E: A beyanname vermez; B 58.000 TL istisna haddini aştığı için kira gelirini beyan eder.
  dogru: E
