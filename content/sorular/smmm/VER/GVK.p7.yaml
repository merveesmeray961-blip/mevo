  kok: Aşağıdakilerden hangisi, sahibinin ticari, zirai veya mesleki faaliyeti dışında nakdi sermaye veya para ile
    temsil edilen değerlerden oluşan sermaye dolayısıyla elde edilen menkul sermaye iradına örnektir?
