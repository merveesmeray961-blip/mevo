  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 21
    alinti: 'Madde 21 – (Değişik birinci fıkra: 22/7/1998-4369/27 md.) Binaların mesken olarak

      kiraya verilmesinden bir takvim yılı içinde elde edilen hasılatın 1.500.000.000 lirası (58.000

      TL) Gelir Vergisinden müstesnadır. İstisna haddi üzerinde hasılat elde edilip beyan

