  tip: kavrama
  zorluk: 2
  kok: 2026 yılında Bay (K), meskenini kiraya vererek 60.000 TL konut kira hasılatı elde etmiştir. Başka bir bilgi
    verilmediğine göre bu kira hasılatı için GVK md. 21'deki mesken kira istisnasından yararlanabilir mi?
  secenekler:
    A: Evet; istisna 100.000 TL'ye kadar uygulanır.
    B: Evet; 60.000 TL'nin tamamı istisna kapsamındadır.
    C: Evet; istisna yalnız ticari kazancı olanlara uygulanır.
    D: Hayır; mesken kira hasılatının tamamı her durumda vergilidir.
    E: Hayır; 2026 yılı için 58.000 TL'lik istisna haddinin üzerinde hasılat elde edilmiştir.
  dogru: E
  aciklama:
    dogru_neden: 2026 yılı için kaynak metinde md. 21 istisna haddi 58.000 TL olarak gösterilmiştir. 60.000 TL hasılat
      bu haddi aştığından, yalnız bu nedenle istisnadan yararlanılamaz.
    celdiriciler:
      A: Kaynak metindeki 2026 haddi 100.000 TL değil 58.000 TL'dir.
      B: Hasılat 58.000 TL'yi aştığı için istisna uygulanmaz.
      C: İstisnanın uygulanması ticari kazanç elde edilmesine bağlanmamıştır.
      D: Kira hasılatının tamamının her durumda vergili olduğu sonucu md. 21'deki istisnayı yok sayar.
