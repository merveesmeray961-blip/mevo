      temsil edilen değerlerden oluşan sermaye dolayısıyla elde edilen faiz ve benzeri iratları menkul sermaye iradı
      sayar; mevduat faizini de açıkça bu kapsamda düzenler.
    celdiriciler:
      A: Mal satışından elde edilen hasılat ticari kazanç niteliğindedir.
      C: Serbest meslek faaliyeti karşılığı elde edilen gelir serbest meslek kazancıdır.
      D: İşletmenin ticari faaliyetiyle ilgili satış kazancı menkul sermaye iradı değildir.
      E: Meskenin elden çıkarılmasından doğan kazanç, şartları varsa değer artışı kazancıdır.
