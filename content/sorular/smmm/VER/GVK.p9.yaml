      bağışlanmasında maliyet bedelinin tamamının indirilebilmesine izin verir. Düzenleme ayni bağışı kapsadığından III yanlıştır.
    celdiriciler:
      A: I doğru olmakla birlikte II de doğru olduğundan yalnız I yanıtı eksiktir.
      B: Maliyet bedelinin tamamının indirilebilmesi nedeniyle II doğrudur; I de doğrudur.
      D: III yanlıştır; düzenleme nakit bağış şartı koymaz.
