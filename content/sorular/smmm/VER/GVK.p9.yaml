- id: SMMM-VER-GVK-0092
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Gelir vergisi
  konu: GVK
  kazanim: gelir unsurları ve istisnalar (md.18; md.21)
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef bir yazar, 2026 yılında eserlerinin yayınlanması ve haklarının devri karşılığında GVK md.18 kapsamındaki
    4.900.000 TL hasılat elde etmiştir. Aynı yıl yalnızca meskenini kiraya vermesinden 58.000 TL kira hasılatı elde etmiş
    ve bu yazarın mesleki kazancı nedeniyle yıllık beyanname verme yükümlülüğü bulunduğu kabul edilmiştir. 2026 yılı için
    103 üncü maddedeki dördüncü gelir dilimi tutarının 5.300.000 TL, md.21 mesken kira istisnasının 58.000 TL olduğu dikkate
    alındığında, bu iki gelir bakımından gelir vergisine tabi tutulacak toplam tutar kaç TL'dir?
  secenekler:
    A: '0'
    B: '58.000'
    C: 4.900.000
    D: 4.958.000
    E: 5.300.000
  dogru: B
  aciklama:
    dogru_neden: 4.900.000 TL'lik md.18 kapsamındaki hasılat 5.300.000 TL eşiğini aşmadığından istisnadır. Buna karşılık mesleki
      kazancı yıllık beyanname ile bildirmek zorunda olanlar md.21 mesken kira istisnasından yararlanamaz; 58.000 TL'nin tamamı
      vergilendirilecek tutardır.
    celdiriciler:
      A: Mesleki kazanç nedeniyle md.21 istisnasının kaybedilmesini gözden kaçırmaktadır.
      C: Md.18 kapsamındaki hasılatın tamamını vergilendirilebilir kabul etmektedir.
      D: Her iki tutarı da vergilendirilebilir saymaktadır.
      E: 5.300.000 TL'lik md.18 eşiğini istisna tutarı gibi kullanmaktadır.
    hesap_adimlari:
    - 'Md.18 hasılatı: 4.900.000 TL ≤ 5.300.000 TL → 4.900.000 TL istisna.'
    - 'Md.21: mesleki kazanç nedeniyle yıllık beyanname zorunluluğu → 58.000 TL istisna uygulanmaz.'
    - 'Vergiye tabi toplam: 58.000 TL.'
