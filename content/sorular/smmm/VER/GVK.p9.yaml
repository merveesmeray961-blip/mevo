  kok: 2026 yılı gelir vergisi beyannamesinde bildirilecek geliri 600.000 TL olan bir mükellef, Gıda Bankacılığı faaliyetinde
    bulunan ve kanunda belirtilen şartları taşıyan bir vakfa 35.000 TL tutarında gıda, temizlik ve yakacak maddesi bağışlamıştır.
    Aşağıdaki öncüllerden hangileri doğrudur? I. Bağışlanan maddelerin maliyet bedeli esas alınır. II. Bağışın tamamı indirime
    konu olabilir. III. Bu düzenleme bağışın yalnız nakit olarak yapılmasını gerektirir.
