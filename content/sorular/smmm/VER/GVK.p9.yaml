  secenekler:
    A: Tek işverenden tevkifli ücret 5.300.000 TL'yi aşmıyorsa md.86/1-b'deki beyan etmeme kuralı uygulanabilir; 58.000 TL
      ise mesken kira hasılatının md.21 kapsamındaki istisna tutarıdır.
    B: Tek işverenden ücrette beyan etmeme sınırı 400.000 TL; 58.000 TL ise ücret beyan sınırıdır.
    C: Birden fazla işverenden ücrette yalnız birinci işverenin ücreti dikkate alınır; 58.000 TL her kira için otomatik beyan
      dışı tutardır.
    D: Tek işverenden tevkifli ücret 5.300.000 TL'yi aşsa da md.86/1-b kapsamında hiçbir durumda beyan edilmez; 58.000 TL
      kira için beyan sınırıdır.
    E: Birden fazla işverenden ücretlerde ikinci dilim eşiği yerine 58.000 TL kira istisnası uygulanır.
  dogru: A
  aciklama:
    dogru_neden: 86/1-b tek işverenden tevkifli ücretler için dördüncü gelir dilimindeki tutarı; 58.000 TL ise md.21'de mesken
