      \ üzerinde hasılat elde edenlerden, beyanı gerekip gerekmediğine\n\n\n15\n   Bu fıkrada daha önce 240.000 olarak yer\
      \ alan ve mükerrer 123 üncü madde gereğince yükseltilen\nmaktu had ve tutarlar aynen bırakılmış olup, 31/12/2025 tarihli\
      \ ve 33124 (5. Mükerrer) sayılı Resmî\nGazete'de yayımlanan Hazine ve Maliye Bakanlığının (Gelir İdaresi Başkanlığı)\
      \ Seri No: 332 Gelir\nVergisi Genel Tebliği ile"
