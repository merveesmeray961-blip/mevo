      \ için 367.500 TL), fazlası                         % 35\n        5.300.000 TL'den fazlasının 5.300.000 TL'si için 1.737.500\
      \ TL, (ücret\n        gelirler"
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332)'
    madde: 2026 md.21 istisna tutarı
    alinti: 'b) 21 inci maddesinin birinci fıkrasında yer alan mesken kira gelirleri için uygulanan

      istisna tutarı 58.000 TL,'
