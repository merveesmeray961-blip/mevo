  kok: Tam mükellef gerçek kişi Selin'in yıllık beyannamesinde hesaplanan gelir vergisi 120.000 TL'dir. Beyannamede gösterilen
    gelire dahil bir kazançtan yıl içinde 35.000 TL gelir vergisi tevkifatı yapılmıştır. Ayrıca kontrol edilen yabancı kurum
    kârı nedeniyle yapılan ve bu kazanca isabet eden 20.000 TL'lik gelir vergisi tevkifatı bulunmaktadır. Bu iki tutarın mahsup
