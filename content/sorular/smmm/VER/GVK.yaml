- id: SMMM-VER-GVK-0001
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: GVK
  kazanim: Mesken kira geliri istisnası, götürü gider ve ücretin beyanı
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Ticari, zirai veya mesleki kazancı bulunmayan Bay (A), 2026 yılında:

    - Tek işverenden, tamamı tevkif suretiyle vergilendirilmiş 1.600.000 TL brüt ücret almış,

    - Sahibi olduğu bir daireyi konut olarak kiraya vererek 600.000 TL kira tahsil etmiştir (kiracı gerçek kişidir;
    kira üzerinden vergi kesintisi yapılmamıştır).

    Bay (A) kira geliri için götürü gider usulünü seçmiştir; başka geliri ve indirimi bulunmamaktadır. 2026 yılı
    için mesken kira geliri istisna tutarı 58.000 TL''dir.

    2026 takvim yılı gelir vergisi tarifesi:

    190.000 TL''ye kadar %15

    400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20

    1.000.000 TL''nin 400.000 TL''si için 70.500 TL (ücret gelirlerinde 1.500.000 TL''nin 400.000 TL''si için 70.500
    TL), fazlası %27

    5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL (ücret gelirlerinde 5.300.000 TL''nin 1.500.000 TL''si için
    367.500 TL), fazlası %35

    5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL (ücret gelirlerinde 1.697.500 TL), fazlası %40

    Buna göre Bay (A)''nın 2026 yılı gelirleri için vereceği yıllık beyannamede hesaplanan gelir vergisi kaç TL''dir?'
  secenekler:
    A: '84.540'
    B: '86.889'
    C: '92.500'
    D: '100.200'
    E: '124.500'
  dogru: D
  aciklama:
    dogru_neden: 'Tek işverenden alınan ve tevkif yoluyla vergilendirilen ücret, tarifenin dördüncü dilim tutarını
      (5.300.000 TL) aşmadığından GVK md. 86/1-b uyarınca beyannameye dahil edilmez. Ancak GVK md. 21/2''ye göre
      ücret ve gayrimenkul sermaye iradı gibi gelirlerin gayrisafi tutarları toplamı tarifenin üçüncü diliminde
      ücret gelirleri için yer alan tutarı (1.500.000 TL) aşanlar mesken kira istisnasından yararlanamaz; yalnız
      ücret bile 1.600.000 TL olduğundan istisna uygulanmaz. Götürü gider (md. 74): 600.000 × %15 = 90.000 TL; matrah
      510.000 TL. Vergi = 70.500 + (510.000 − 400.000) × %27 = 100.200 TL. Bu soru zor düzeydedir; kullanılan teknikler:
      çok adımlı hesap (beyana dahil edilmeyen ücret bile md. 21/2 sınırını aşarak istisnayı düşürür), madde birleştirme
      (GVK md. 21/2, 74, 86/1-b ve 332 Seri No.lu Tebliğ birlikte okunur), gereksiz veri (kökte verilen 58.000 TL
      istisna tutarı çözüme girmez) ve tipik hata çeldiricileri. Tuzak: beyana dahil edilmeyen ücretin istisna sınırının
      kontrolünde de dikkate alınmayacağını sanmak; md. 21/2 gayrisafi tutarları ''beyanı gerekip gerekmediğine
      bakılmaksızın'' toplar.'
    celdiriciler:
      A: İstisna uygulanmış ve götürü gider brüt hasılattan hesaplanıp istisna ayrıca düşülmüştür (600.000 − 90.000
        − 58.000 = 452.000); ücret toplamı sınırı aştığından istisna uygulanamaz.
      B: 58.000 TL istisna uygulanmıştır ((600.000 − 58.000) × %85 = 460.700); md. 21/2'deki 1.500.000 TL sınırı
        aşıldığından istisnadan yararlanılamaz.
      C: 'Matrah doğru (510.000 TL) bulunmuş, ancak ikinci dilim formülü (28.500 TL + 190.000 TL''yi aşan kısım
        × %20) matrahın tamamına uygulanmıştır: 28.500 + 320.000 × %20 = 92.500 TL. 400.000 TL''yi aşan kısım %27
        dilimine girer.'
      E: Götürü gider indirilmemiştir (matrah 600.000 TL); md. 74 hasılatın %15'inin götürü gider olarak indirilmesine
        izin verir.
    hesap_adimlari:
    - 'Ücret: tek işveren, tevkif edilmiş, 1.600.000 ≤ 5.300.000 → beyana dahil edilmez (md. 86/1-b)'
    - 'İstisna kontrolü: ücret + kira gayrisafi toplamı 2.200.000 > 1.500.000 → istisna yok (md. 21/2)'
    - 'Götürü gider: 600.000 × %15 = 90.000 TL; matrah = 510.000 TL'
    - 'Vergi: 70.500 + (510.000 − 400.000) × %27 = 70.500 + 29.700 = 100.200 TL'
  kaynaklar:
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332), RG 31.12.2025, 33124 (5. Mük.)'
    madde: md. 3/3 (2026 tarifesi)
    alinti: 190.000 TL'ye kadar % 15 400.000 TL'nin 190.000 TL'si için 28.500 TL, fazlası % 20 1.000.000 TL'nin
      400.000 TL'si için 70.500 TL, (ücret gelirlerinde 1.500.000 TL'nin 400.000 TL'si için 70.500 TL), fazlası
      % 27 5.300.000 TL'nin 1.000.000 TL'si için 232.500 TL, (ücret gelirlerinde 5.300.000 TL'nin 1.500.000 TL'si
      için 367.500 TL), fazlası % 35
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332), RG 31.12.2025, 33124 (5. Mük.)'
    madde: md. 3/2-b
    alinti: b) 21 inci maddesinin birinci fıkrasında yer alan mesken kira gelirleri için uygulanan istisna tutarı
      58.000 TL,
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 21/2
    alinti: Ticari, zirai veya mesleki kazancının yıllık beyanname ile bildirmek mecburiyetinde olanlar ile istisna
      haddinin üzerinde hasılat elde edenlerden, beyanı gerekip gerekmediğine bakılmaksızın ayrı ayrı veya birlikte
      elde ettiği ücret, menkul sermaye iradı, gayrimenkul sermaye iradı ile diğer kazanç ve iratlarının gayri safi
      tutarları toplamı 103 üncü maddede yazılı tarifenin üçüncü diliminde ücret gelirleri için yer alan tutarı
      aşanlar bu istisnadan faydalanmazlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 74
    alinti: Mükellefler (hakları kiraya verenler hariç) diledikleri takdirde yukarıda yazılı giderlere karşılık
      olmak üzere hasılatlarından % 15'ini götürü olarak indirebilirler.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 86/1-b
    alinti: b) (Değişik:5/12/2019-7194/15 md.) Tek işverenden alınmış ve tevkif suretiyle vergilendirilmiş 103 üncü
      maddede yazılı tarifenin dördüncü gelir diliminde yer alan tutarı aşmayan ücretler
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: C çeldirici açıklaması 92.500'ün gerçek hata yoluna (ikinci dilim formülünün matrahın tamamına uygulanması)
      göre düzeltildi; zorluk 2 → 3; dogru_neden'e kullanılan zor soru teknikleri ve tuzak eklendi. gecerlilik.baslangic
      2026-01-01 olarak korundu (2026 tarifesi, 332 Seri No.lu Tebliğ).
    neden: 'G5 (küçük): C açıklaması ''tamamı %20'' diyordu (düz %20 → 102.000 çıkar); soru çok adımlı hesap, madde
      birleştirme ve gereksiz veri içeriyor, GZ''de ortalama aday yanıldı (güven 1).'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
  dogrulama:
    python: "def gv(m):\n    if m <= 190000: return m * 15 / 100\n    if m <= 400000: return 28500 + (m - 190000)\
      \ * 20 / 100\n    if m <= 1000000: return 70500 + (m - 400000) * 27 / 100\n    if m <= 5300000: return 232500\
      \ + (m - 1000000) * 35 / 100\n    return 1737500 + (m - 5300000) * 40 / 100\nucret = 1600000\nkira = 600000\n\
      istisna = 0 if ucret + kira > 1500000 else 58000\nmatrah = (kira - istisna) * 85 / 100\nsonuc = gv(matrah)"
- id: SMMM-VER-GVK-0002
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: GVK
  kazanim: Beyan edilen gelirden yapılacak indirimler (md. 89)
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: 193 sayılı Gelir Vergisi Kanunu'nun 89. maddesine göre yıllık beyannamede bildirilen gelirden yapılacak indirimlerle
    ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Mükellefin kendisi, eşi ve küçük çocuklarına ilişkin eğitim ve sağlık harcamaları; beyan edilen gelirin %10'unu
      aşmamak, Türkiye'de yapılmak ve belgelerle tevsik edilmek şartıyla indirilebilir.
    B: Kamu yararına çalışan derneklere makbuz karşılığında yapılan bağışlar, kalkınmada öncelikli yöreler dışında,
      beyan edilecek gelirin %5'ini aşmamak üzere indirilebilir.
    C: Cumhurbaşkanınca başlatılan yardım kampanyalarına makbuz karşılığı yapılan ayni ve nakdî bağışların tamamı
      indirilebilir.
    D: Mükellefin şahsına, eşine ve küçük çocuklarına ait hayat sigortalarına ödenen primlerin %50'si, Kanun'daki
      sınırlar dahilinde indirilebilir.
    E: Kanunda belirtilen kapsamda profesyonel spor dallarına yapılan sponsorluk harcamalarının tamamı indirilebilir.
  dogru: E
  aciklama:
    dogru_neden: GVK md. 89/8'e göre 3289 ve 3813 sayılı Kanunlar kapsamında yapılan sponsorluk harcamalarının amatör
      spor dalları için tamamı, profesyonel spor dalları için ise yalnız %50'si indirilebilir. Profesyonel spor
      dallarında tamamının indirilebileceği ifadesi yanlıştır.
    celdiriciler:
      A: Doğrudur; md. 89/2'deki %10 sınırı ve Türkiye'de yapılma ile tevsik şartlarını yansıtır.
      B: Doğrudur; md. 89/4 kamu yararına çalışan derneklere yapılan bağışlarda %5 (kalkınmada öncelikli yörelerde
        %10) sınırı öngörür.
      C: Doğrudur; md. 89/10 bu bağışların tamamının indirilebileceğini hükme bağlar.
      D: Doğrudur; md. 89/1 hayat sigortası primlerinin %50'sinin, beyan edilen gelirin %15'i ve asgari ücretin
        yıllık tutarı sınırları içinde indirilmesine izin verir.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/8
    alinti: 8. 3289 sayılı Gençlik ve Spor Genel Müdürlüğünün Teşkilat ve Görevleri Hakkında Kanun ile 17.6.1992
      tarihli ve 3813 sayılı Türkiye Futbol Federasyonu Kuruluş ve Görevleri Hakkında Kanun kapsamında yapılan sponsorluk
      harcamalarının; amatör spor dalları için tamamı, profesyonel spor dalları için % 50'si.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/2
    alinti: 2. Beyan edilen gelirin % 10'unu aşmaması, Türkiye'de yapılması ve gelir veya kurumlar vergisi mükellefiyeti
      bulunan gerçek veya tüzel kişilerden alınacak belgelerle tevsik edilmesi şartıyla, mükellefin kendisi, eşi
      ve küçük çocuklarına ilişkin olarak yapılan eğitim ve sağlık harcamaları
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/4
    alinti: kamu yararına çalışan dernekler ve Cumhurbaşkanınca vergi muafiyeti tanınan vakıflara yıllık toplamı
      beyan edilecek gelirin % 5'ini (kalkınmada öncelikli yöreler için % 10'unu) aşmamak üzere, makbuz karşılığında
      yapılan bağış ve yardımlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/10
    alinti: Cumhurbaşkanınca başlatılan yardım kampanyalarına makbuz karşılığı yapılan ayni ve nakdî bağışların
      tamamı.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1
    alinti: Beyan edilen gelirin %15'ini ve asgari ücretin yıllık tutarını aşmamak şartıyla
  gecerlilik:
    baslangic: '2018-07-09'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: gecerlilik.baslangic 2026-01-01 → 2018-07-09 (md. 89/4 ve 89/10'daki 'Cumhurbaşkanınca' ibarelerini getiren
      700 s. KHK'nin yürürlüğü; GVK yürürlük tablosuyla doğrulandı).
    neden: 'Rötuş talimatı §3: belirsiz 2026-01-01 başlangıcı dayanılan hükmün son değişiklik/yürürlük tarihiyle
      değiştirildi.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
- id: SMMM-VER-GVK-0003
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: GVK
  kazanim: Değer artışı kazancı (mükerrer md. 80)
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Ticari, zirai veya mesleki faaliyeti bulunmayan Bayan (B)'nin 2026 yılında gerçekleştirdiği aşağıdaki işlemlerden
    hangisinden doğan kazanç, 193 sayılı Gelir Vergisi Kanunu'nun mükerrer 80. maddesine göre değer artışı kazancı
    sayılır?
  secenekler:
    A: 2024 yılında satın aldığı, tam mükellef bir limited şirketteki ortaklık payını satması
    B: 2019 yılında satın aldığı konutu satması
    C: 2022 yılında satın aldığı, borsada işlem görmeyen tam mükellef bir anonim şirkete ait hisse senetlerini satması
    D: 2023 yılında babasından miras yoluyla intikal eden arsayı satması
    E: Yazarı olduğu romanın telif hakkını bir yayınevine devretmesi
  dogru: A
  aciklama:
    dogru_neden: 'Mükerrer md. 80/4''e göre ortaklık haklarının veya hisselerinin elden çıkarılmasından doğan kazançlar,
      elde tutma süresine bakılmaksızın değer artışı kazancıdır. İki yıllık süre ayrıcalığı (80/1) yalnız tam mükellef
      kurumlara ait hisse senetleri için geçerlidir. Limited şirketteki ortaklık payı (esas sermaye payı) hisse
      senedi değildir: TTK md. 593/2''ye göre limited şirkette esas sermaye pay senetleri yalnız ispat aracı şeklinde
      veya nama yazılı olarak düzenlenir. GVK da hisse senetlerini (80/1) ortaklık hakları veya hisselerinden (80/4)
      ayrı saymıştır; bu nedenle limited şirket payının satışı 80/1''deki ayrıcalıktan yararlanamaz ve 80/4 uyarınca
      değer artışı kazancı doğurur.'
    celdiriciler:
      B: Mükerrer md. 80/6'ya göre gayrimenkuller yalnız iktisap tarihinden başlayarak beş yıl içinde elden çıkarılırsa
        değer artışı kazancı doğar; 2019'da alınan konut 2026'da satıldığından süre geçmiştir.
      C: Mükerrer md. 80/1 tam mükellef kurumlara ait olup iki yıldan fazla elde tutulan hisse senetlerini kapsam
        dışında bırakır.
      D: Mükerrer md. 80/6 ivazsız olarak (miras yoluyla) iktisap edilen gayrimenkullerin satışını kapsam dışında
        bırakır.
      E: Mükerrer md. 80/3 yalnız müellif, mucit ve kanuni mirasçıları dışında kalanların telif hakkı devrini kapsar;
        eser sahibinin devri değer artışı kazancı değildir.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 80/1
    alinti: '1. (Değişik: 30/12/2004-5281/27 md.) İvazsız olarak iktisap edilenler ile tam mükellef kurumlara ait
      olan ve iki yıldan fazla süreyle elde tutulan hisse senetleri hariç, menkul kıymetlerin veya diğer sermaye
      piyasası araçlarının elden çıkarılmasından sağlanan kazançlar.'
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 80/3, 80/4
    alinti: 3. Telif haklarının ve ihtira beratlarının müellifleri, mucitleri ve bunların kanunî mirasçıları dışında
      kalan kimseler tarafından elden çıkarılmasından doğan kazançlar. 4. Ortaklık haklarının veya hisselerinin
      elden çıkarılmasından doğan kazançlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 80/6
    alinti: 6. İktisap şekli ne olursa olsun (ivazsız olarak iktisap edilenler hariç) 70 inci maddenin birinci fıkrasının
      (1), (2), (4) ve (7) numaralı bentlerinde yazılı mal (gerçek usulde vergiye tâbi çiftçilerin ziraî istihsalde
      kullandıkları gayrimenkuller dahil) ve hakların, iktisap tarihinden başlayarak beş yıl içinde elden çıkarılmasından
      doğan kazançlar
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 593/2
    alinti: (2) Esas sermaye pay senetleri ispat aracı şeklinde veya nama yazılı olarak düzenlenir.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 2
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: dogru_neden'deki 'limited şirket ortaklık payı hisse senedi değildir' gerekçesi TTK md. 593/2'ye dayandırıldı
      ve kaynaklara TTK md. 593/2 alıntısı eklendi; gecerlilik.baslangic 2026-01-01 → 2012-07-01 (TTK 6102'nin yürürlüğü;
      GVK mük. 80'in son değişikliği 5615 s. K. ile 4/4/2007).
    neden: 'G6 (küçük): gerekçe GVK metninde açıkça yer almıyordu, TTK 593/2 alıntısı önerildi; §3 başlangıç tarihi.
      G5 (küçük) A şıkkındaki elde tutma süresi belirsizliği uygulanmadı: doğru hükümde (mük. 80/4) süre şartı yoktur,
      belirsizlik yalnız hükmü yanlış bilen adayı etkileyen bir tuzaktır.'
