    kim: hakem
    ne: 'hakem 2026-10-04: kökteki ''(EH) Ltd. Şti.''nden tahsil edilecek tutar'' → ''ilgili imalatçıdan gecikme
      zammıyla birlikte tahsil edilecek vergi tutarı''; dogru_neden''e tahsilatın imalatçıdan yapıldığı (GUT II/A-8.7)
      eklendi; GUT kaynağı eklendi; gecerlilik.baslangic 2003-04-09 → 2003-05-01 (4842/21''in yürürlüğü: 24/4/2003''ü
      izleyen ay başı). Anahtar değişmedi (B).'
    neden: 'G5/G6: KDVK 11/1-c tahsil edilecek kişiyi belirtmez; KDV GUT II/A-8.7 tecil edilen verginin imalatçıdan
      tahsil olunacağını açıkça söyler; kök yanlış mükellefi gösteriyordu. 4842 sayılı Kanun md. 21 kabul tarihi
      9/4/2003, yürürlüğü 1/5/2003.'
