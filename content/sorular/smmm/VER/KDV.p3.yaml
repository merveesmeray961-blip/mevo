- id: SMMM-VER-KDV-0003
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: KDV
  kazanim: 'İhraç kaydıyla teslim: KDV''nin ihracatçı tarafından ödenmemesi, tecil, terkin ve ihraç süresi (md.
    11/1-c)'
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'İhracatçı (EH) Ltd. Şti., 2026 yılında imalatçılardan ihraç kaydıyla üç ayrı mal teslimi almış ve 3065 sayılı
    KDV Kanunu''nun 11/1-c maddesi uyarınca bu teslimlere ilişkin KDV''yi ödememiştir (KDV oranı %20''dir). Teslimlere
    ve malların ihraç tarihlerine ilişkin bilgiler şöyledir:

    - 14 Mart 2026 tarihli teslim, KDV hariç bedel 400.000 TL; mallar 20 Mayıs 2026''da ihraç edilmiştir.

    - 20 Nisan 2026 tarihli teslim, KDV hariç bedel 300.000 TL; mallar 5 Ağustos 2026''da ihraç edilmiştir.

    - 8 Mayıs 2026 tarihli teslim, KDV hariç bedel 200.000 TL; mallar 28 Ağustos 2026''da ihraç edilmiştir.

    Mücbir sebep veya beklenmedik bir durum bulunmamaktadır.


    Buna göre, bu teslimler nedeniyle tecil edilen KDV''den, mallar süresinde ihraç edilmediği için terkin edilemeyip
    ilgili imalatçıdan gecikme zammıyla birlikte tahsil edilecek vergi tutarı (gecikme zammı hariç) kaç TL''dir?'
  secenekler:
    A: '0'
    B: '60.000'
    C: '100.000'
    D: '180.000'
    E: '300.000'
  dogru: B
  aciklama:
    dogru_neden: 'KDV Kanunu md. 11/1-c''ye göre ihraç edilmek şartıyla imalatçılar tarafından ihracatçıya teslim
      edilen mallara ait KDV ihracatçılar tarafından ödenmez; vergi dairesince tarh ve tahakkuk ettirilerek tecil
      edilir. Malların, ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay içinde ihraç edilmesi hâlinde
      tecil edilen vergi terkin olunur; aksi hâlde teslim mahiyet itibarıyla yurt içi teslime dönüşür ve tecil edilen
      vergi gecikme zammıyla birlikte imalatçıdan tahsil edilir (KDV GUT II/A-8.7; imalatçı ödediği vergi için ihracatçıya
      rücu edebilir). Süreler: 14 Mart teslimi için 1 Nisan–30 Haziran (ihraç 20 Mayıs: süresinde); 20 Nisan teslimi
      için 1 Mayıs–31 Temmuz (ihraç 5 Ağustos: süresinden sonra); 8 Mayıs teslimi için 1 Haziran–31 Ağustos (ihraç
      28 Ağustos: süresinde). Yalnızca ikinci teslimin KDV''si tahsil edilir: 300.000 × %20 = 60.000 TL.


      Püf noktaları: Üç aylık süre teslim gününden değil, teslim tarihini takip eden ayın başından itibaren işler;
      bu yüzden her teslim için süre, teslimin yapıldığı ayı takip eden aydan başlar ve üçüncü ayın sonunda biter.
      Üç teslimin tarihlerini ayrı ayrı sınamak gerekir; ilk teslimdeki ihraç, hangi yöntemle sayılırsa sayılsın
      süresindedir ve gereksiz veridir.'
    celdiriciler:
      A: '0: üç aylık süre teslim ayını takip eden ayın sonundan başlatılmıştır; bu durumda tüm ihracatlar süresinde
        sayılırdı. Kanun süreyi ay başından başlatır.'
      C: '100.000: üç aylık süre teslim gününden itibaren sayılmıştır; bu durumda 2. ve 3. teslimlerin KDV''si (60.000
        + 40.000) tahsil edilirdi. Oysa süre teslim tarihini takip eden ay başından başlar ve 3. teslimin ihracı
        süresindedir.'
      D: '180.000: tecil edilen KDV''nin tamamı (80.000 + 60.000 + 40.000) tahsil edilmiştir; oysa 1. ve 3. teslimlerdeki
        mallar süresinde ihraç edilmiş, bu teslimlerin KDV''si terkin edilir.'
      E: '300.000: 2. teslimin KDV hariç bedeli KDV tutarı sanılmıştır; tahsil edilecek olan %20 KDV''dir (60.000
        TL).'
    hesap_adimlari:
    - 'Teslim 1 (14 Mart): süre 1 Nisan – 30 Haziran; ihraç 20 Mayıs → süresinde, KDV terkin'
    - 'Teslim 2 (20 Nisan): süre 1 Mayıs – 31 Temmuz; ihraç 5 Ağustos → süresinden sonra, KDV tahsil edilir'
    - 'Teslim 3 (8 Mayıs): süre 1 Haziran – 31 Ağustos; ihraç 28 Ağustos → süresinde, KDV terkin'
    - 'Tahsil edilecek KDV: 300.000 × 0,20 = 60.000 TL'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c (ödenmemesi ve tecil)
    alinti: İhraç edilmek şartıyla imalatçılar tarafından kendilerine teslim edilen mallara ait katma değer vergisi,
      ihracatçılar tarafından ödenmez. Mükelleflerce tahsil edilmeyen ancak ilgili dönem beyannamesinde beyan edilecek
      olan bu vergi, vergi dairesince tarh ve tahakkuk ettirilerek tecil olunur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c (terkin)
    alinti: Söz konusu malların, ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay içinde ihraç edilmesi
      halinde, tecil edilen vergi terkin olunur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c (ihracatın gerçekleşmemesi)
    alinti: İhracatın yukarıdaki şartlara uygun olarak gerçekleştirilmemesi halinde, tecil olunan vergi tahakkuk
      ettirildiği tarihten itibaren 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesine
      göre belirlenen gecikme zammıyla birlikte tahsil olunur.
  - mevzuat: Katma Değer Vergisi Genel Uygulama Tebliği
    madde: Bölüm II/A-8.7 (İhracatın Gerçekleşmemesi Hali)
    alinti: Bu durumda, ihraç kaydıyla teslim bedeli üzerinden hesaplanan ve tecil olunan vergi tahakkuk ettirildiği
      tarihten itibaren 6183 sayılı Kanunun 51 inci maddesine göre belirlenen gecikme zammıyla birlikte imalatçıdan
      tahsil olunur.
  dogrulama:
    python: 'sonuc = 300000 * 0.20

      '
