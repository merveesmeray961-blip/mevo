- id: SMMM-VER-KDV-0004
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: KDV
  kazanim: 'İndirilecek KDV: indirilemeyecek vergiler (md. 30/b, 30/d), ithalde ödenen KDV ve devreden KDV ile ödenecek
    verginin hesabı'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Yalnızca ticari mal alım-satımı yapan (Z) Ltd. Şti.''nin 2026 yılı Mart ayına ilişkin KDV bilgileri aşağıdadır
    (KDV oranı %20''dir; tüm belgeler usulüne uygun olup Mart döneminde kanuni defterlere kaydedilmiştir):


    - Mart ayında yapılan vergiye tabi satışlar üzerinden hesaplanan KDV: 480.000 TL,


    - Ticari mal alışlarına ilişkin faturalarda gösterilen KDV: 250.000 TL,


    - Genel müdürün kullanımına tahsis edilen binek otomobilin alış faturasında gösterilen KDV: 90.000 TL (şirket,
    binek otomobil kiralama veya işletme faaliyetinde bulunmamaktadır),


    - Esas faaliyet konusu ile ilgili bulunmayan ve işletme kayıtlarında yer alan motorlu yatın bakım-onarım faturasında
    gösterilen KDV: 12.000 TL,


    - İthal edilen ticari mallar için gümrükte ödenen KDV: 60.000 TL,


    - Önceki dönemlerden devreden KDV: 40.000 TL.


    Buna göre (Z) Ltd. Şti.''nin Mart 2026 dönemi için ödeyeceği KDV kaç TL''dir?'
  secenekler:
    A: '28.000'
    B: '40.000'
    C: '118.000'
    D: '130.000'
    E: '170.000'
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 29 uyarınca mükellef, faaliyetleriyle ilgili olarak kendisine yapılan teslim ve hizmetlere
      ait faturalarda gösterilen KDV'yi ve ithalde ödenen KDV'yi hesaplanan KDV'den indirir; indirilemeyen fark
      sonraki döneme devreder. Md. 30'a göre ise işletmelere ait binek otomobillerin alış vesikalarındaki KDV (faaliyeti
      binek oto kiralama/işletme olanlar hariç) ve kurumlar vergisi bakımından kazancın tespitinde indirimi kabul
      edilmeyen giderler dolayısıyla ödenen KDV indirilemez; KVK md. 11/1-f uyarınca esas faaliyet konusuyla ilgisi
      bulunmayan, işletmede kayıtlı motorlu deniz taşıtlarının giderleri KKEG'dir. İndirilecek KDV 250.000 + 60.000
      + 40.000 = 350.000 TL; ödenecek KDV 480.000 − 350.000 = 130.000 TL'dir.
    celdiriciler:
      A: '28.000: Binek otomobil ve yat giderlerine ait KDV de indirim konusu yapılmıştır (480.000 − 452.000). Md.
        30/b ve 30/d bu vergilerin indirilmesine izin vermez.'
      B: '40.000: Yat gideri KDV''si doğru ayıklanmış, ancak binek otomobil KDV''si (90.000) indirim konusu yapılmıştır.
        Faaliyeti binek oto kiralamak veya işletmek olmayan işletmelerde md. 30/b indirimi engeller.'
      C: '118.000: Binek otomobil KDV''si doğru ayıklanmış, ancak yat gideri KDV''si (12.000) indirilmiştir. KKEG
        sayılan giderlere ait KDV md. 30/d uyarınca indirilemez.'
      E: '170.000: Önceki dönemden devreden KDV (40.000) indirim kalemlerine eklenmemiştir. Md. 29/2 uyarınca devreden
        KDV sonraki dönemde indirim konusu yapılır.'
    hesap_adimlari:
    - 'Binek otomobil KDV''si (md. 30/b): indirilemez; yat gideri KDV''si (md. 30/d, KVK 11/1-f): indirilemez'
    - 'İndirilecek KDV: 250.000 (ticari mal) + 60.000 (ithalat) + 40.000 (devreden) = 350.000 TL'
    - 'Ödenecek KDV: 480.000 − 350.000 = 130.000 TL'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/1-a
    alinti: Kendilerine yapılan teslim ve hizmetler dolayısıyla hesaplanarak düzenlenen fatura ve benzeri vesikalarda
      gösterilen katma değer vergisi,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/1-b
    alinti: İthal olunan mal ve hizmetler dolayısıyla ödenen katma değer vergisi,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/2
    alinti: aradaki fark sonraki dönemlere devrolunur
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 30/b
    alinti: Faaliyetleri kısmen veya tamamen binek otomobillerinin kiralanması veya çeşitli şekillerde işletilmesi
      olanların bu amaçla kullandıkları hariç olmak üzere işletmelere ait binek otomobillerinin alış vesikalarında
      gösterilen katma değer vergisi,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 30/d
    alinti: Gelir ve Kurumlar Vergisi kanunlarına göre kazancın tespitinde indirimi kabul edilmeyen giderler dolayısıyla
      ödenen katma değer vergisi.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-f
    alinti: Kiralama yoluyla edinilen veya işletmede kayıtlı olan; yat, kotra, tekne, sürat teknesi gibi motorlu
      deniz taşıtları ile uçak, helikopter gibi hava taşıtlarından işletmenin esas faaliyet konusu ile ilgili olmayanların
      giderleri ve amortismanları.
  dogrulama:
    python: 'indirilecek = 250000 + 60000 + 40000

      sonuc = 480000 - indirilecek

      '
