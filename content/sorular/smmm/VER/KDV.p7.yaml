- id: SMMM-VER-KDV-0007
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Katma değer vergisi
  konu: KDV
  kazanim: ihraç kaydıyla teslim
  tip: uygulama
  zorluk: 3
  kok: İmalatçı, ihraç edilmek şartıyla bir malı ihracatçıya 10 Ocak 2026'da teslim etmiştir. İhracatçı malı üç
    aylık süre içinde ihraç edememiş; ancak mücbir sebep nedeniyle, üç aylık sürenin dolduğu tarihten itibaren 10
    gün içinde ek süre talebinde bulunmuştur. KDVK md. 11/1-c'ye göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Başvuru 15 günlük süre içinde olduğundan üç aya kadar ek süre verilebilir.
    B: Üç aylık sürenin dolmasıyla ek süre talep hakkı kesin olarak sona ermiştir.
    C: Ek süre yalnız teslim tarihinden itibaren 15 gün içinde istenebilir.
    D: Mücbir sebep ek süreyi etkileyemez; tecil edilen vergi derhal kesinleşir.
    E: Ek süre yalnız bir ay olabilir.
  dogru: A
  aciklama:
    dogru_neden: 'KDVK md. 11/1-c, mücbir sebepler veya beklenmedik durumlar nedeniyle üç ay içinde ihracat yapılamazsa,
      üç aylık sürenin dolduğu tarihten itibaren 15 gün içinde başvuran ihracatçıya üç aya kadar ek süre verilebileceğini
      düzenler. Başvuru 10 gün içinde olduğundan şart sağlanmıştır. Püf noktaları: Ek süre için hem üç aylık sürenin
      mücbir sebeple aşılamaması hem de başvurunun bu sürenin bitiminden itibaren 15 gün içinde yapılması gerekir.'
    celdiriciler:
      B: Kanun, 15 günlük başvuru süresi içinde talep edilmesi halinde ek süre imkânı tanır.
      C: 15 günlük süre teslim tarihinden değil, üç aylık sürenin dolduğu tarihten itibaren başlar.
      D: Mücbir sebep, kanunda açıkça ek süre düzenlemesinin şartlarından biridir.
      E: Ek süre üç aya kadar olabilir; bir ayla sınırlı değildir.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: 'Söz konusu malların, ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay

      içinde ihraç edilmesi halinde, tecil edilen vergi terkin olunur.'
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: 'İhracatın mücbir sebepler veya beklenmedik durumlar

      nedeniyle üç ay içinde gerçekleştirilememesi halinde, en geç üç aylık sürenin dolduğu tarihten

      itibaren onbeş gün içinde başvuran ihracatçılara, Maliye Bakanlığınca veya Bakanlığın uygun

      görmesi halinde vergi dairelerince üç aya kadar ek süre verilebilir.'
