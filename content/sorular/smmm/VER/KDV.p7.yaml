- id: SMMM-VER-KDV-0009
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Katma değer vergisi
  konu: KDV
  kazanim: indirim ve düzeltme
  tip: kavrama
  zorluk: 2
  kok: Bir mal satışı nedeniyle düzenlenen faturadaki KDV, malın tesliminden sonra malların iade edilmesi sebebiyle
    matrahın değişmesi üzerine düzeltilecektir. 3065 sayılı Kanuna göre düzeltmenin hangi dönemde yapılması gerekir?
  secenekler:
    A: İlk fatura düzenlendiği dönemden bağımsız olarak yıl sonunda
    B: İadenin gerçekleştiği dönemi izleyen ikinci vergilendirme döneminde
    C: Yalnızca vergi incelemesi sonucunda
    D: Değişikliğin mahiyetine uygun şekilde değişikliğin vukubulduğu dönem içinde
    E: Bir sonraki takvim yılının ilk döneminde
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 35, malların iade edilmesi veya işlemde benzeri nedenlerle matrahta değişiklik olduğunda,
      verginin değişikliğin mahiyetine uygun şekilde değişikliğin vuku bulduğu dönem içinde düzeltilmesini öngörür.
    celdiriciler:
      A: Kanun yıl sonu düzeltmesi değil, değişikliğin gerçekleştiği dönemde düzeltme öngörür.
      B: İki dönem bekleme şartı yoktur.
      C: Düzeltme hakkı yalnız vergi incelemesine bağlanmamıştır.
      E: Bir sonraki yılın ilk dönemi için genel bir kural yoktur; değişiklik dönemi esas alınır.
