  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Katma değer vergisi
  konu: KDV
  kazanim: verginin konusu ve Türkiye'de yapılma
  tip: uygulama
  zorluk: 3
  kok: Türkiye'de yerleşik bir danışmanlık işletmesi, hizmetin fiilen Almanya'da verilmesini sağlamakta; ancak danışmanlık
    hizmetinden Türkiye'deki bir müşterinin Türkiye'de faydalanması kararlaştırılmaktadır. 3065 sayılı Kanuna göre
    bu hizmet bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Hizmet yurt dışında yapıldığı için hiçbir şekilde KDV kapsamına girmez.
    B: Hizmetten Türkiye'de faydalanılması tek başına yeterli değildir; yalnız hizmetin Türkiye'de yapılması aranır.
    C: Hizmetten Türkiye'de faydalanıldığı için işlem Türkiye'de yapılmış sayılır ve KDV'nin konusuna girer.
    D: Yalnız danışmanlık işletmesinin kanuni merkezi Türkiye'de olduğu için işlem KDV'nin konusuna girer.
    E: Hizmetin müşterisi Türkiye'de olsa bile hizmetin yurt dışında yapılması nedeniyle işlem otomatik olarak ihracat
      istisnasına girer.
  dogru: C
  aciklama:
    dogru_neden: KDVK md. 1 Türkiye'de yapılan ticari faaliyet çerçevesindeki hizmetleri KDV'ye tabi tutar; md.
      6/b ise hizmetin Türkiye'de yapılmasını veya hizmetten Türkiye'de faydalanılmasını Türkiye'de yapılma ölçütü
      olarak kabul eder.
    celdiriciler:
      A: Hizmetin yurt dışında yapılması tek başına yeterli değildir; Türkiye'de faydalanma da md. 6/b kapsamındadır.
      B: 'Kanun iki alternatif ölçüt öngörür: Türkiye''de yapılma veya Türkiye''de faydalanma.'
      D: Kanuni merkezin Türkiye'de bulunması md. 6/b'deki hizmet ölçütü değildir.
      E: İşlemin Türkiye'de yapılmış sayılması ile ihracat istisnasının şartları aynı şey değildir; bu kökte Türkiye'de
        faydalanma vardır.
  kaynaklar:
