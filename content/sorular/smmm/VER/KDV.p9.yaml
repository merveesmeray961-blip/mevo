    dogru_neden: Cari dönem farkı 260.000 - 220.000 = 40.000 TL'dir. Önceki 70.000 TL devreden KDV bu farka eklenerek
      110.000 TL sonraki döneme devreder; genel kuralda indirimli teslimlere ilişkin özel iade halleri saklı olmak
      üzere devreden fark iade edilmez.
    celdiriciler:
      A: Devreden önceki dönem bakiyesini hesaba katmaz.
      C: Genel kuraldaki iade edilmez sonucunu dışarıda bırakır.
      D: Cari dönem farkını hesaba katmaz.
      E: Hem cari dönem farkını hem önceki dönem devrini göz ardı eder.
    hesap_adimlari:
    - Cari dönem farkı = 260.000 - 220.000 = 40.000 TL.
    - Toplam devreden = 70.000 + 40.000 = 110.000 TL.
