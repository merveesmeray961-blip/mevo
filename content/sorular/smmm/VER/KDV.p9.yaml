  kok: 'Bir işletmenin önceki dönemden devreden KDV''si 70.000 TL''dir. Cari dönemde hesaplanan KDV 220.000 TL, indirilecek
    KDV ise 260.000 TL''dir. Başka bir iade hakkı doğuran işlem bulunmadığına göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Cari dönemde indirilecek KDV ile hesaplanan KDV arasındaki fark 40.000 TL''dir.

    II. Cari dönem sonunda toplam 110.000 TL KDV sonraki döneme devreder.

    III. Bu 110.000 TL, genel kural olarak iade edilmez.'
  secenekler:
    A: Yalnız I
    B: I, II ve III
    C: I ve II
    D: II ve III
    E: Yalnız III
  dogru: B
  aciklama:
    dogru_neden: Cari dönem farkı 260.000 - 220.000 = 40.000 TL'dir. Önceki 70.000 TL devreden KDV bu farka eklenerek 110.000
      TL sonraki döneme devreder; genel kuralda indirimli teslimlere ilişkin özel iade halleri saklı olmak üzere devreden
      fark iade edilmez.
    celdiriciler:
      A: Devreden önceki dönem bakiyesini hesaba katmaz.
      C: Genel kuraldaki iade edilmez sonucunu dışarıda bırakır.
      D: Cari dönem farkını hesaba katmaz.
      E: Hem cari dönem farkını hem önceki dönem devrini göz ardı eder.
    hesap_adimlari:
    - Cari dönem farkı = 260.000 - 220.000 = 40.000 TL.
    - Toplam devreden = 70.000 + 40.000 = 110.000 TL.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/2
