  tip: hesaplama
  zorluk: 3
  kok: Bir dönemde hesaplanan KDV 185.000 TL, indirilecek KDV 240.000 TL’dir. Önceki dönemden devreden KDV 35.000
    TL’dir ve iade hakkı doğuran özel bir işlem yoktur. I. Dönem farkı 55.000 TL’dir. II. Dönem sonu devreden KDV
    90.000 TL’dir. III. Devreden tutar, bu nedenle nakden iade edilir. Hangileri doğrudur?
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'İndirilecek KDV ile hesaplanan KDV arasındaki fark 240.000 − 185.000 = 55.000 TL’dir. Önceki devreden
      35.000 TL eklenince 90.000 TL devreden KDV olur; özel iade durumu yoksa otomatik nakit iade doğmaz. Püf noktaları:
      devreden KDV, nakit iade ile aynı şey değildir.'
    celdiriciler:
      A: I doğrudur ancak II de doğrudur.
      B: II doğrudur ancak I de doğrudur.
      D: III yanlıştır.
      E: III yanlış olduğundan tümü doğru değildir.
