  kok: 'Bir işletmenin önceki dönemden devreden KDV''si 70.000 TL''dir. Cari dönemde hesaplanan KDV 220.000 TL,
    indirilecek KDV ise 260.000 TL''dir. Başka bir iade hakkı doğuran işlem bulunmadığına göre aşağıdaki öncüllerden
    hangileri doğrudur?


    I. Cari dönemde indirilecek KDV ile hesaplanan KDV arasındaki fark 40.000 TL''dir.

    II. Cari dönem sonunda toplam 110.000 TL KDV sonraki döneme devreder.

    III. Bu 110.000 TL, genel kural olarak iade edilmez.'
