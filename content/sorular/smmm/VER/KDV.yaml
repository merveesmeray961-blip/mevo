- id: SMMM-VER-KDV-0001
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: KDV
  kazanim: İndirim, düzeltme (iade) ve devreden KDV ile ödenecek verginin hesabı
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: '(S) Ltd. Şti.''nin Mart 2026 vergilendirme dönemine ilişkin bilgiler aşağıdadır (tutarlar KDV hariçtir):

    - %20 oranlı mal teslimleri: 2.000.000 TL

    - %10 oranlı mal teslimleri: 500.000 TL

    - Şubat 2026''da %20 KDV ile satılıp Mart 2026''da müşteriden iade alınan malın bedeli: 100.000 TL (mal fiilen
    işletmeye girmiş; giriş, defter kayıtları ve beyannamede gösterilmiştir)

    - Faaliyetle ilgili mal ve hizmet alışlarına ait, Mart döneminde kayda alınan faturalardaki KDV: 300.000 TL

    - Binek otomobil kiralama veya işletme faaliyeti bulunmayan şirketin, işletmede kullanmak üzere satın aldığı
    binek otomobilin faturasında gösterilen KDV: 40.000 TL

    - Şubat 2026 döneminden devreden KDV: 60.000 TL

    Buna göre şirketin Mart 2026 dönemi için ödemesi gereken KDV kaç TL''dir?'
  secenekler:
    A: '30.000'
    B: '70.000'
    C: '90.000'
    D: '120.000'
    E: '130.000'
  dogru: B
  aciklama:
    dogru_neden: 'Hesaplanan KDV: 2.000.000 × %20 + 500.000 × %10 = 450.000 TL. İade alınan mal için KDVK md. 35
      uyarınca satıcı, daha önce borçlandığı 20.000 TL''yi değişikliğin olduğu dönemde düzeltir (indirim olarak).
      Md. 29/1-a''ya göre faturalardaki 300.000 TL indirilir; binek otomobil KDV''si md. 30/b uyarınca indirilemez.
      Devreden 60.000 TL de indirilir. Ödenecek KDV = 450.000 − (300.000 + 20.000 + 60.000) = 70.000 TL.'
    celdiriciler:
      A: Binek otomobil KDV'si (40.000 TL) indirilmiştir; md. 30/b bu vergiyi indirilemeyenler arasında sayar.
      C: İade alınan mal için md. 35'teki düzeltme (20.000 TL) yapılmamıştır.
      D: '%10 oranlı teslimlere %20 uygulanmıştır (hesaplanan KDV 500.000 TL bulunmuştur).'
      E: Önceki dönemden devreden 60.000 TL KDV indirime dahil edilmemiştir.
    hesap_adimlari:
    - 'Hesaplanan KDV: 2.000.000 × %20 = 400.000; 500.000 × %10 = 50.000; toplam 450.000 TL'
    - 'İade düzeltmesi (md. 35): 100.000 × %20 = 20.000 TL'
    - 'İndirilecek KDV: 300.000 (binek otomobil KDV''si 40.000 TL hariç, md. 30/b)'
    - 'Toplam indirim: 300.000 + 20.000 + 60.000 (devreden) = 380.000 TL'
    - 'Ödenecek KDV: 450.000 − 380.000 = 70.000 TL'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/1-a
    alinti: '1. Mükellefler, yaptıkları vergiye tabi işlemler üzerinden hesaplanan katma değer vergisinden, bu Kanunda
      aksine hüküm olmadıkça, faaliyetlerine ilişkin olarak aşağıdaki vergileri indirebilirler: a) Kendilerine yapılan
      teslim ve hizmetler dolayısıyla hesaplanarak düzenlenen fatura ve benzeri vesikalarda gösterilen katma değer
      vergisi,'
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 30/b
    alinti: 'b) (Değişik : 3/6/1986 - 3297/10 md.) Faaliyetleri kısmen veya tamamen binek otomobillerinin kiralanması
      veya çeşitli şekillerde işletilmesi olanların bu amaçla kullandıkları hariç olmak üzere işletmelere ait binek
      otomobillerinin alış vesikalarında gösterilen katma değer vergisi,'
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 35
    alinti: Malların iade edilmesi, işlemin gerçekleşmemesi, işlemden vazgeçilmesi veya sair sebeplerle matrahta
      değişiklik vukubulduğu hallerde, vergiye tabi işlemleri yapmış olan mükellef bunlar için borçlandığı vergiyi
      bu işlemlere muhatap olan mükellef ise indirme hakkı bulunan vergiyi değişikliğin mahiyetine uygun şekilde
      ve değişikliğin vukubulduğu dönem içinde düzeltilir.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 29/2
    alinti: Bir vergilendirme döneminde indirilecek katma değer vergisi toplamı, mükellefin vergiye tâbi işlemleri
      dolayısıyla hesaplanan katma değer vergisi toplamından fazla olduğu takdirde, aradaki fark sonraki dönemlere
      devrolunur ve iade edilmez.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 5)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-03'
        not: '(küçük) Zorluk 2: dört ayrı kalem (oran, md. 35 iade düzeltmesi, md. 30/b, devreden) ve her biri ayrı
          bir hatadan türeyen çeldiriciler var. 3''e yakın; GZ ölçümüne bırakılabilir.'
      G6:
        sonuc: gecti
        tarih: '2026-10-03'
        not: (küçük) dogru_neden'deki '(indirim olarak)' nitelemesi KDVK md. 35'te yok; metin yalnız 'borçlandığı
          vergiyi ... düzeltilir' der. Beyannamede indirim satırında gösterilmesi uygulama kuralıdır, sonucu değiştirmiyor.
      G2:
        sonuc: gecti
        tarih: '2026-10-03'
      G4:
        sonuc: gecti
        tarih: '2026-10-03'
      G7:
        sonuc: gecti
        tarih: '2026-10-03'
  dogrulama:
    python: 'hesaplanan = 2000000 * 20 / 100 + 500000 * 10 / 100

      iade_duzeltme = 100000 * 20 / 100

      indirilecek = 300000  # binek oto KDV''si indirilemez

      devreden = 60000

      sonuc = hesaplanan - iade_duzeltme - indirilecek - devreden'
- id: SMMM-VER-KDV-0002
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: KDV
  kazanim: Vergiyi doğuran olay (md. 10)
  tip: bilgi
  zorluk: 1
  soru_bicimi: olumsuz
  kok: 3065 sayılı Katma Değer Vergisi Kanunu'na göre aşağıdaki işlem ve vergiyi doğuran olay eşleştirmelerinden
    hangisi **yanlıştır**?
  secenekler:
    A: Malın tesliminden önce fatura düzenlenmesi – Faturada gösterilen miktarla sınırlı olmak üzere faturanın düzenlenmesi
    B: Kısım kısım mal teslimi yapılmasının mutat olması – Her bir kısmın teslimi
    C: Malın alıcıya gönderilmesi – Malın nakliyesine başlanması veya nakliyeci ya da sürücüye tevdii
    D: Elektrik, su ve gaz dağıtımı – Bedellerin tahakkuk ettirilmesi
    E: Komisyoncu vasıtasıyla yapılan satış – Malların komisyoncuya teslimi
  dogru: E
  aciklama:
    dogru_neden: KDVK md. 10/d'ye göre komisyoncular vasıtasıyla veya konsinyasyon suretiyle yapılan satışlarda
      vergiyi doğuran olay, malların alıcıya teslimiyle meydana gelir; malların komisyoncuya teslimiyle değil.
    celdiriciler:
      A: Doğrudur; md. 10/b'de aynen yer alır.
      B: Doğrudur; md. 10/c kısım kısım teslimlerde her bir kısmın teslimini esas alır.
      C: Doğrudur; md. 10/e'de aynen yer alır.
      D: Doğrudur; md. 10/g enerji dağıtım ve kullanımlarında bedellerin tahakkuk ettirilmesini esas alır.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10/b, c, d
    alinti: b) Malın tesliminden veya hizmetin yapılmasından önce fatura veya benzeri belgeler verilmesi hallerinde,
      bu belgelerde gösterilen miktarla sınırlı olmak üzere fatura veya benzeri belgelerin düzenlenmesi, c) Kısım
      kısım mal teslimi veya hizmet yapılması mutad olan veya bu hususlarda mutabık kalınan hallerde, her bir kısmın
      teslimi veya bir kısım hizmetin yapılması, d) Komisyoncular vasıtasıyla veya konsinyasyon suretiyle yapılan
      satışlarda, malların alıcıya teslimi,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10/e
    alinti: e) Malın alıcıya veya onun adına hareket edenlere gönderilmesi halinde, malın nakliyesine başlanması
      veya nakliyeci veya sürücüye tevdii,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10/g
    alinti: g) Su, elektrik, gaz, ısıtma, soğutma ve benzeri enerji dağıtım veya kullanımlarında bunların bedellerinin
      tahakkuk ettirilmesi,
