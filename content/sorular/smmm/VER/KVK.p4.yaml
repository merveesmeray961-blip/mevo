- id: SMMM-VER-KVK-0004
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: KVK
  kazanim: 'Finansman gider kısıtlaması (md. 11/1-i): aşan yabancı kaynağa isabet eden finansman giderinin %10''u;
    yatırım maliyetine eklenenler ve kullanıma bağlı olmayan giderler'
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Bilanço esasına göre defter tutan ve kredi kuruluşu, finansal kuruluş, finansal kiralama, faktoring veya
    finansman şirketi olmayan (Ç) A.Ş.''nin 31.12.2026 tarihli ve finansman gider kısıtlaması öncesi bilançosunda
    yabancı kaynaklar toplamı 6.000.000 TL, öz kaynaklar toplamı 4.500.000 TL''dir. Şirketin 2026 hesap döneminde,
    tamamı 1/1/2013 tarihinden sonra kullanılan yabancı kaynaklara ilişkin katlandığı gider ve maliyet unsurları
    şunlardır:


    - Banka kredisi faizi: 500.000 TL (bunun 100.000 TL''si, devam eden bir yatırımın maliyetine eklenmiştir),


    - Yabancı para kredinin kur farkı gideri: 200.000 TL (yatırımın maliyetine eklenmemiştir),


    - Teminat mektubu komisyonu: 40.000 TL (herhangi bir yabancı kaynağın kullanımına bağlı olmaksızın ödenmiştir).


    Finansman gider kısıtlamasında Cumhurbaşkanı Kararı ile belirlenen %10 oranı uygulanacak; aşan kısma isabet
    eden finansman gideri, Kurumlar Vergisi Genel Tebliği''ndeki yönteme göre "finansman gideri × aşan kısım / toplam
    yabancı kaynak" formülüyle bulunacaktır.


    Buna göre (Ç) A.Ş.''nin 2026 yılı kurum kazancının tespitinde kanunen kabul edilmeyen gider olarak dikkate alacağı
    tutar kaç TL''dir?'
  secenekler:
    A: '15.000'
    B: '16.000'
    C: '17.500'
    D: '20.000'
    E: '60.000'
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 11/1-i uyarınca yabancı kaynakları öz kaynaklarını aşan işletmelerde, aşan kısma münhasır
      olmak üzere, yatırımın maliyetine eklenenler hariç, yabancı kaynaklara ilişkin faiz, kur farkı ve benzeri
      gider ve maliyet unsurlarının %10''u (Cumhurbaşkanı Kararı 3490) kurum kazancının tespitinde indirilemez.
      Yabancı kaynaklar (6.000.000) öz kaynakları (4.500.000) 1.500.000 TL aşmaktadır; aşan kısım yabancı kaynakların
      %25''idir. Kısıtlamaya konu gider 600.000 TL''dir: faizin yatırıma eklenen 100.000 TL''si ile yabancı kaynağın
      kullanım süresine bağlı olmayan teminat mektubu komisyonu kapsam dışıdır. Aşan kısma isabet eden gider 600.000
      × %25 = 150.000 TL, bunun %10''u olan 15.000 TL KKEG''dir.'
    celdiriciler:
      B: '16.000: Teminat mektubu komisyonu da kısıtlamaya konu edilmiştir (640.000 × %25 × %10). Oysa Tebliğ''e
        göre yabancı kaynağın kullanım süresine bağlı olmayan teminat mektubu komisyonu gibi giderler kısıtlamaya
        konu değildir.'
      C: '17.500: Yatırımın maliyetine eklenen 100.000 TL''lik faiz de dahil edilmiştir (700.000 × %25 × %10). Kanun
        yatırımın maliyetine eklenenleri kapsam dışı bırakır.'
      D: '20.000: Aşan kısım oranı öz kaynağa göre hesaplanmıştır (1.500.000 / 4.500.000 = 1/3; 600.000 / 3 × %10).
        Tebliğ''deki formülde payda toplam yabancı kaynaktır.'
      E: '60.000: Aşan kısma isabet eden pay hesaplanmadan kısıtlamaya konu giderin tamamının %10''u alınmıştır
        (600.000 × %10). Kısıtlama yalnızca aşan kısma ilişkindir.'
    hesap_adimlari:
    - 'Aşan kısım: 6.000.000 − 4.500.000 = 1.500.000 TL; aşan kısım / yabancı kaynak = 1.500.000 / 6.000.000 = %25'
    - 'Kısıtlamaya konu gider: (500.000 − 100.000) + 200.000 = 600.000 TL (teminat mektubu komisyonu kapsam dışı)'
    - 'Aşan kısma isabet eden gider: 600.000 × %25 = 150.000 TL'
    - 'KKEG: 150.000 × %10 = 15.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-i
    alinti: Kredi kuruluşları, finansal kuruluşlar, finansal kiralama, faktoring ve finansman şirketleri dışında,
      kullanılan yabancı kaynakları öz kaynaklarını aşan işletmelerde, aşan kısma münhasır olmak üzere, yatırımın
      maliyetine eklenenler hariç, işletmede kullanılan yabancı kaynaklara ilişkin faiz, komisyon, vade farkı, kâr
      payı, kur farkı ve benzeri adlar altında yapılan gider ve maliyet unsurları toplamının %10’unu aşmamak üzere
      Cumhurbaşkanınca kararlaştırılan kısmı.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 11.13 (yatırımın maliyetine eklenenler)
    alinti: Ayrıca, öz kaynak tutarını aşan yabancı kaynaklara ilişkin olarak faiz, komisyon, vade farkı, kâr payı,
      kur farkı ve benzeri adlar altında yapılan gider ve maliyet unsurlarından, yatırımın maliyetine eklenmiş olan
      yabancı kaynaklardan doğan gider ve maliyet unsurları ise %10’luk bu kısıtlamaya tabi tutulmayacaktır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 11.13.4 (kullanıma bağlı olmayan giderler)
    alinti: Teminat mektubu komisyonları, tahvil ihracı ile ilgili olarak yapılan baskı ve benzeri giderler ile
      ipotek masrafları gibi herhangi bir yabancı kaynak kullanımına bağlı olmaksızın yapılan giderlerin gider kısıtlamasına
      konu edilmesi söz konusu değildir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 11.13.4, Örnek 1 (hesap yöntemi)
    alinti: 'Aşan kısma isabet eden finansman gideri : Finansman gideri x (Aşan kısım / Toplam yabancı kaynak)'
  dogrulama:
    python: 'konu_gider = (500000 - 100000) + 200000

      oran = (6000000 - 4500000) / 6000000

      sonuc = konu_gider * oran * 0.10

      '
