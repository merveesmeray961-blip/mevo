- id: SMMM-VER-KVK-0009
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: finansman gider kısıtlaması
  tip: hesaplama
  zorluk: 2
  kok: Tam mükellef (C) A.Ş.'nin dönem sonu öz kaynakları 600.000 TL, yabancı kaynakları 900.000 TL ve yatırım maliyetine
    eklenmeyen toplam finansman giderleri 90.000 TL'dir. Şirket finansal kuruluş değildir. 2026 yılı için finansman
    gider kısıtlaması kapsamında KKEG tutarı kaç TL'dir?
  secenekler:
    A: '1.500'
    B: '2.000'
    C: '2.500'
    D: '3.000'
    E: '9.000'
  dogru: D
  aciklama:
    dogru_neden: Yabancı kaynaklar öz kaynakları 300.000 TL aşmaktadır. Aşan kısmın toplam yabancı kaynağa oranı
      300.000/900.000 = 1/3'tür. 90.000 TL finansman giderinin aşan kısma isabet eden tutarı 30.000 TL, bunun %10'u
      ise 3.000 TL KKEG'dir.
    celdiriciler:
      A: 1.500 TL, aşan kısma isabet eden giderin %5'i alınarak bulunur; oran %10'dur.
      B: 2.000 TL, 90.000 TL'nin yaklaşık %2,22'sinin kısıtlanmasıyla elde edilir; aşan kısım oranı 1/3'tür.
      C: 2.500 TL, finansman giderinin yanlış bir baz üzerinden %10'una yakın alınmasıyla bulunur.
      E: 9.000 TL, toplam finansman giderinin tamamının %10'unu KKEG kabul eder; oysa yalnız aşan kısma isabet eden
        giderin %10'u dikkate alınır.
    hesap_adimlari:
    - Aşan kısım = 900.000 - 600.000 = 300.000 TL
    - Aşan kısma isabet eden finansman gideri = 90.000 × (300.000 / 900.000) = 30.000 TL
    - KKEG = 30.000 × %10 = 3.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-i
    alinti: 'i) (Ek: 31/5/2012-6322/37 md.) Kredi kuruluşları, finansal kuruluşlar, finansal

      kiralama, faktoring ve finansman şirketleri dışında, kullanılan yabancı kaynakları öz

      kaynaklarını aşan işletmelerde, aşan kısma münhasır olmak üzere, yatırımın maliyetine

      eklenenler hariç, işletmede kullanılan yabancı kaynaklara ilişkin faiz, komisyon, vade farkı,

      kâr payı, kur farkı ve benzeri adlar altında yapılan gider ve maliyet unsurları toplamının

      %10’unu aşmamak üzere Cumhurbaşkanınca kararlaştırılan kısmı.'
  - mevzuat: Kurumlar Vergisi Genel Tebliği Seri No. 1
    madde: 11.13.2 Örnek 1
    alinti: "Aşan kısma isabet eden finansman gideri             : Finansman gideri x (Aşan kısım / Toplam\n   \
      \                                                 yabancı kaynak)\n                                      \
      \            : 100.000 TL x (200.000 TL / 1.000.000 TL)\n                                                \
      \  : 100.000 TL x %20\n                                                  : 20.000 TL\n        Yabancı kaynağın\
      \ öz kaynak tutarını aşan kısmına isabet eden finansman giderinin %10’luk\nkısmı olan (20.000 TL x %10=) 2.000\
      \ TL kurum kazancının tespitinde KKEG olarak dikkate alınacaktır."
  gecerlilik:
    baslangic: '2021-01-01'
    bitis: null
    yila_bagli_tutar: false
