  aciklama:
    dogru_neden: 'Kurumlar vergisi ile örtülü sermaye üzerinden ödenen faiz indirilemez. Finansman gider kısıtlamasında
      yatırım maliyetine eklenen 100.000 TL dışındaki 500.000 TL’nin %10’u, yani 50.000 TL, indirimi kabul edilmeyen
      kısımdır. Toplam KKEG 1.200.000 + 400.000 + 50.000 = 1.650.000 TL’dir. Püf noktaları: Finansman gider kısıtlamasında
      yatırım maliyetine eklenen kısım dışarıda bırakılır; ayrıca örtülü sermaye faizi ve hesaplanan kurumlar vergisi
      ayrı KKEG kalemleridir.'
