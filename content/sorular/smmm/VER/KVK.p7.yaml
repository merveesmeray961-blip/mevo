- id: SMMM-VER-KVK-0026
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: örtülü sermaye
  tip: uygulama
  zorluk: 2
  kok: Bir kurumun hesap dönemi başındaki öz sermayesi 4.000.000 TL'dir. Ortaklarından doğrudan temin ettiği borçların
    hesap dönemi içinde ulaştığı en yüksek tutar 14.000.000 TL'dir. Başka bir borçlanma bulunmadığı varsayımıyla,
    5520 sayılı Kanun'a göre örtülü sermaye sayılacak kısım kaç TL'dir?
  secenekler:
    A: 1.000.000
    B: 2.000.000
    C: 4.000.000
    D: 10.000.000
    E: 12.000.000
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 12/1''e göre ortaklardan doğrudan veya dolaylı temin edilen borçların hesap dönemi içinde
      herhangi bir tarihte öz sermayenin üç katını aşan kısmı örtülü sermayedir. 4.000.000 × 3 = 12.000.000 TL;
      14.000.000 - 12.000.000 = 2.000.000 TL''dir. Püf noktaları: Sınır öz sermayenin üç katıdır; borcun tamamı
      değil, aşan kısım örtülü sermayedir.'
