    - Kurumlar vergisi KKEG = 1.200.000 TL
    - Örtülü sermaye faizi KKEG = 400.000 TL
    - Kısıtlamaya tabi finansman gideri = 600.000 - 100.000 = 500.000 TL
    - Kısıtlanan kısım = 500.000 x %10 = 50.000 TL
    - Toplam KKEG = 1.200.000 + 400.000 + 50.000 = 1.650.000 TL
