- id: SMMM-VER-KVK-0064
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: istisnalar (iştirak kazancı)
  tip: uygulama
  zorluk: 3
  kok: Türkiye'de tam mükellef (A) A.Ş., kanunî ve iş merkezi Türkiye'de bulunmayan bir anonim şirketin ödenmiş
    sermayesinin %12'sine bir yıl süreyle sahiptir. Yurt dışı iştirak kazancının tabi olduğu ülkedeki toplam gelir
    ve kurumlar vergisi benzeri vergi yükü %15'tir ve kazanç, ilgili kurumlar vergisi beyannamesinin verilmesi gereken
    tarihe kadar Türkiye'ye transfer edilmiştir. Kanundaki özel inşaat/onarım şirketi istisnası bulunmadığı varsayımıyla
    yurt dışı iştirak kazancı istisnasının temel şartları sağlanmış mıdır?
  secenekler:
    A: Evet, verilen dört şart sağlanmıştır.
    B: Hayır, pay oranı %50 olmalıdır.
    C: Hayır, payın en az iki yıl tutulması gerekir.
    D: Hayır, vergi yükü en az %25 olmalıdır.
    E: Hayır, kazanç Türkiye'ye hiç transfer edilmemelidir.
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 5/1-b, yurt dışı iştirak kazancı için en az %10 iştirak, kazancın elde edildiği tarih
      itibarıyla kesintisiz en az bir yıl elde tutma, genel durumda en az %15 vergi yükü ve ilgili beyannamenin
      verilmesi gereken tarihe kadar Türkiye''ye transfer şartlarını öngörür. Olayda dört şart da sağlanmıştır.
      Püf noktaları: %50 oranı, kanundaki özel %50 istisna oranı paragrafıyla ilgilidir; temel istisna şartı %10''dur.'
    celdiriciler:
      B: Temel şart en az %10 paydır; %50 oranı ayrı bir paragraftaki %50 istisna oranıyla ilgilidir.
      C: Temel elde tutma süresi en az bir tam yıldır.
      D: Genel vergi yükü şartı en az %15'tir; %25 şartı yoktur.
      E: Kazancın ilgili beyanname tarihine kadar Türkiye'ye transfer edilmesi şarttır; 'hiç transfer edilmemesi'
        yanlış yöndür.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b
    alinti: "         1) İştirak payını elinde tutan şirketin, yurt dışı iştirakin ödenmiş sermayesinin en az %\n\
      10’una sahip olması,\n         2) Kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz olarak\
      \ en az bir yıl\nsüreyle elde tutulması (Rüçhan hakkı kullanılmak suretiyle veya yurt dışı iştirakin iç\n\
      kaynaklarından yapılan sermaye artırımları nedeniyle elde edilen iştirak payları için sahip\nolunan eski iştirak\
      \ paylarının elde edilme tarihi esas alınır.),"
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b/3-4
    alinti: '         3) Yurt dışı iştirak kazancının kâr payı dağıtımına kaynak olan kazançlar üzerinden

      ödenen vergiler dahil iştirak edilen kurumun faaliyette bulunduğu ülke vergi kanunları

      uyarınca en az % 15 oranında gelir ve kurumlar vergisi benzeri toplam vergi yükü taşıması;'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b
    alinti: '         4) İştirak kazancının, elde edildiği hesap dönemine ilişkin kurumlar vergisi

      beyannamesinin verilmesi gereken tarihe kadar Türkiye’ye transfer edilmesi.'
