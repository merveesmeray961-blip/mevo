  kok: Bir kurumun 2026 hesap döneminde 1.000.000 TL kurum kazancı vardır. Bu kazancın 200.000 TL’lik kısmı KVK
    md. 32/C kapsamında asgari kurumlar vergisi hesabında düşülebilen bir istisna kazançtır. 32 ve 32/A hükümlerine
    göre hesaplanan normal kurumlar vergisi 70.000 TL’dir ve başka indirim veya istisna yoktur. Ödenecek yurt içi
    asgari kurumlar vergisi kaç TL’dir?
  secenekler:
    A: '70.000'
    B: '80.000'
    C: '100.000'
    D: '170.000'
    E: '200.000'
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 32/C’ye göre normal kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının
      %10’undan az olamaz; ancak ikinci fıkradaki kapsamda düşülebilen 200.000 TL istisna kazancı asgari vergi matrahından
      çıkarılır. Asgari matrah 800.000 TL, asgari vergi 80.000 TL olur. Normal vergi 70.000 TL olduğundan ödenecek
      asgari vergi 80.000 TL’dir. Püf noktaları: %10 oranı doğrudan 1.000.000 TL’nin tamamına değil, md. 32/C’de
      sayılan istisna düşüldükten sonraki 800.000 TL’ye uygulanır.'
    celdiriciler:
      A: 70.000 TL normal kurumlar vergisidir; asgari vergi hesabı 80.000 TL’dir.
      C: 100.000 TL, 1.000.000 TL’nin %10’unun istisna düşülmeden alınmasıyla bulunur; md. 32/C/2 kapsamındaki 200.000
        TL düşülmelidir.
      D: 170.000 TL, normal vergi ile asgari verginin toplanmasıdır; ikisi birlikte ödenmez.
      E: 200.000 TL istisna tutarıdır; asgari vergi değildir.
    hesap_adimlari:
    - 'Asgari vergi matrahı: 1.000.000 - 200.000 = 800.000 TL'
    - 'Asgari kurumlar vergisi: 800.000 x %10 = 80.000 TL'
    - '70.000 TL normal vergi ile karşılaştırılır: 80.000 TL daha yüksek olduğundan ödenecek tutar 80.000 TL'
