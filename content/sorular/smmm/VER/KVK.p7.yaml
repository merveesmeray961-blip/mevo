        dışarıda bırakılmamıştır.
      B: Örtülü sermaye faizi KKEG’ye eklenmemiştir.
      D: Finansman giderinin tamamı KKEG kabul edilerek fazla tutar eklenmiştir.
      E: Kurumlar vergisi ve örtülü sermaye faizi yanında finansman giderinin tamamı KKEG kabul edilmiştir.
