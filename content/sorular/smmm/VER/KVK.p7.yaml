      kabul edilerek 500.000 × %10 = 50.000 TL KKEG’dir. Püf noktaları: Önce yabancı kaynak–öz kaynak farkını ve
      kapsamı, sonra %10’luk kısıtlamayı uygulamalısın; yatırım maliyetine eklenen giderler bu hesapta dikkate alınmaz.'
    celdiriciler:
      B: '150.000 TL: %30 oranı uygulanmıştır; kaynakta finansman gider kısıtlaması için %10 oranı esas alınmaktadır.'
      C: '250.000 TL: Finansman giderinin yarısı KKEG kabul edilmiştir; kaynakta böyle bir %50 oranı yoktur.'
      D: '300.000 TL: Aşan yabancı kaynak tutarı doğrudan KKEG kabul edilmiştir; oysa gider tutarının %10’u dikkate
        alınır.'
      E: '500.000 TL: Finansman giderinin tamamı KKEG kabul edilmiştir; kaynakta yalnızca belirlenen kısmın indiriminin
        kabul edilmeyeceği düzenlenmiştir.'
    hesap_adimlari:
    - 'Yabancı kaynakların öz kaynakları aşan kısmı: 12.000.000 - 9.000.000 = 3.000.000 TL.'
    - Kökte verilen finansman gideri bu aşan kısma ilişkin olduğundan kısıtlamaya tabi gider = 500.000 TL.
    - KKEG = 500.000 × %10 = 50.000 TL.
