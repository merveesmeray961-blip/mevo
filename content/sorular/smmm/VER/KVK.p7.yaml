- id: SMMM-VER-KVK-0007
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: KKEG
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (B) A.Ş.'nin 2026 hesap dönemi ticari bilanço kârı 1.000.000 TL'dir. Bu kârın içinde; 20.000
    TL öz sermaye üzerinden hesaplanan faiz, 30.000 TL vergi cezası, işletmenin esas faaliyet konusu ile ilgili
    olmayan bir yata ait 40.000 TL amortisman ve 50.000 TL sözleşmede ceza şartı olarak konulmuş bir tazminat gideri
    bulunmaktadır. Başka bir düzeltme yoktur. Kurumlar vergisi matrahının tespitinde KKEG olarak dikkate alınacak
    toplam tutar kaç TL'dir?
  secenekler:
    A: '40.000'
    B: '50.000'
    C: '90.000'
    D: '110.000'
    E: '140.000'
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 11/1-a uyarınca öz sermaye üzerinden hesaplanan faiz, md. 11/1-d uyarınca vergi cezaları
      ve md. 11/1-f uyarınca esas faaliyetle ilgili olmayan yata ait amortisman KKEG''dir. Buna karşılık md. 11/1-g''de
      sözleşmelerde ceza şartı olarak konulan tazminatlar açıkça istisna edildiğinden 50.000 TL eklenmez. KKEG:
      20.000 + 30.000 + 40.000 = 90.000 TL. Püf noktaları: Sözleşmesel ceza şartı ile suçtan doğan tazminatı ayırmak
      gerekir; her tazminat otomatik olarak KKEG değildir.'
    celdiriciler:
      A: 40.000 TL, yalnız esas faaliyetle ilgili olmayan yat amortismanını dikkate alır; öz sermaye faizi ve vergi
        cezası da KKEG'dir.
      B: 50.000 TL, sözleşmesel ceza şartı tazminatını KKEG kabul eden ters yaklaşımdır; bu gider md. 11/1-g kapsamında
        hariçtir.
      D: 110.000 TL, 50.000 TL'lik sözleşmesel ceza şartı tazminatının da KKEG sayılmasından kaynaklanır; md. 11/1-g
        bu gideri hariç tutar.
      E: 140.000 TL, dört kalemin tamamının KKEG kabul edilmesiyle bulunur; sözleşmesel ceza şartı istisnası gözden
        kaçırılmıştır.
    hesap_adimlari:
    - 'Öz sermaye faizi: 20.000 TL'
    - 'Vergi cezası: 30.000 TL'
    - 'Esas faaliyet dışı yat amortismanı: 40.000 TL'
    - 'Sözleşmesel ceza şartı tazminatı: 0 TL KKEG'
    - 'Toplam KKEG: 90.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-a
    alinti: a) Öz sermaye üzerinden ödenen veya hesaplanan faizler.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-d
    alinti: 'd) Bu Kanuna göre hesaplanan kurumlar vergisi ile her türlü para cezaları, vergi

      cezaları, 21/7/1953 tarihli ve 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun

      hükümlerine göre ödenen cezalar, gecikme zamları ve faizler ile Vergi Usul Kanunu

      hükümlerine göre ödenen gecikme faizleri.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-f
    alinti: 'f) Kiralama yoluyla edinilen veya işletmede kayıtlı olan; yat, kotra, tekne, sürat

      teknesi gibi motorlu deniz taşıtları ile uçak, helikopter gibi hava taşıtlarından işletmenin esas

      faaliyet konusu ile ilgili olmayanların giderleri ve amortismanları.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-g
    alinti: 'g) Sözleşmelerde ceza şartı olarak konulan tazminatlar hariç olmak üzere kurumun

      kendisinin, ortaklarının, yöneticilerinin ve çalışanlarının suçlarından doğan maddî ve manevî

      zarar tazminat giderleri.'
  gecerlilik:
