  kazanim: yurt içi asgari KV
  tip: hesaplama
  zorluk: 2
  kok: 2026 hesap döneminde (D) A.Ş.'nin hesap dönemi sonundaki ticari bilanço kârı 2.000.000 TL, kanunen kabul
    edilmeyen giderleri 200.000 TL ve yurt içi asgari kurumlar vergisi hesaplanırken düşülmesine izin verilen istisna
    ve indirimlerin toplamı 400.000 TL'dir. Başka bir indirim veya mahsup bulunmamaktadır. KVK md. 32/C'ye göre
    hesaplanacak yurt içi asgari kurumlar vergisinin alt sınırı kaç TL'dir?
  secenekler:
    A: '180.000'
    B: '200.000'
    C: '220.000'
    D: '400.000'
    E: '450.000'
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 32/C/6''ya göre indirim ve istisnalar düşülmeden önceki kurum kazancı ticari bilanço kârına
      KKEG eklenerek bulunur: 2.000.000 + 200.000 = 2.200.000 TL. İzin verilen 400.000 TL istisna ve indirim düşüldüğünde
      1.800.000 TL kalır; bunun %10''u 180.000 TL''dir. Püf noktaları: Asgari vergi hesabında önce KKEG eklenerek
      başlangıç kazancı bulunmalı, sonra md. 32/C''de sayılan indirim ve istisnalar dikkate alınmalıdır.'
    celdiriciler:
      B: 200.000 TL, KKEG eklenmiş 2.200.000 TL'nin %10'u alınarak istisna ve indirimler düşülmeden bulunur.
      C: 220.000 TL, yalnız ticari bilanço kârına KKEG eklenmesiyle oluşan 2.200.000 TL'nin %10'udur; 400.000 TL'lik
        izin verilen indirim unutulmuştur.
      D: 400.000 TL, indirilecek istisna ve indirim tutarını vergi olarak kabul eder; oysa bu tutar matrahtan düşülür.
      E: 450.000 TL, 1.800.000 TL'ye %25 oran uygulanmasıyla bulunur; soru asgari verginin %10 alt sınırını sormaktadır.
    hesap_adimlari:
    - Ticari bilanço kârı + KKEG = 2.000.000 + 200.000 = 2.200.000 TL
    - İzin verilen istisna ve indirimler sonrası = 2.200.000 - 400.000 = 1.800.000 TL
    - '%10 alt sınır = 180.000 TL'
