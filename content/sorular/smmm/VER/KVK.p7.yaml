    madde: md. 32/C/1
    alinti: '(1) 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi,

      indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz.'
