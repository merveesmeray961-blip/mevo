  kok: (R) A.Ş.’nin 2026 hesap döneminde 1.200.000 TL tutarında kurumlar vergisi, 400.000 TL tutarında örtülü sermaye
    üzerinden faiz gideri ve yabancı kaynakların öz kaynakları aşan kısmına ilişkin 600.000 TL finansman gideri
    bulunmaktadır. Finansman giderinin 100.000 TL’si yatırım maliyetine eklenmiştir. 5520 sayılı Kurumlar Vergisi
    Kanunu ve finansman gider kısıtlamasına ilişkin düzenlemelere göre kurum kazancının tespitinde kanunen kabul
    edilmeyen gider olarak dikkate alınacak toplam tutar kaç TL’dir?
  secenekler:
