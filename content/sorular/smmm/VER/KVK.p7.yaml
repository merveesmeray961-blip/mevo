  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: istisnalar (iştirak kazancı)
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (A) A.Ş., kanuni ve iş merkezi Türkiye'de bulunmayan bir yabancı limited şirketin ödenmiş sermayesinin
    %60'ına 2026 yılında sahip olmuştur. A.Ş., iştirak payını yalnızca 4 ay elde tutmuş, yabancı iştirakin vergi
    yükü %8 olmuş ve 300.000 TL kâr payı kazancını, ilgili hesap dönemine ilişkin kurumlar vergisi beyannamesinin
    verilmesi gereken tarihe kadar Türkiye'ye transfer etmiştir. Diğer şartların sağlanmadığı varsayımıyla, KVK
    md. 5/1-b uyarınca istisna edilecek kâr payı kaç TL'dir?
  secenekler:
    A: '0'
    B: '30.000'
    C: '60.000'
    D: '150.000'
    E: '300.000'
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 5/1-b''nin özel paragrafında, yabancı anonim veya limited şirketin ödenmiş sermayesinin
      en az %50''sine sahip olunması ve kâr payının beyanname verme tarihine kadar Türkiye''ye transfer edilmesi
      halinde diğer şartlar aranmaksızın istisna oranının %50 uygulanacağı düzenlenmiştir. 300.000 TL''nin %50''si
      150.000 TL''dir. Püf noktaları: Olağan yurt dışı iştirak şartları ile %50 özel istisna kuralı birbirine karıştırılmamalı;
      burada %60 iştirak ve zamanında transfer, diğer şartların yerine aranabilecek özel kuralı tetikler.'
    celdiriciler:
      A: 0 TL, genel şartların sağlanmadığı varsayımından hareket eder; ancak %50 iştirak ve zamanında transfer
        özel kural için yeterlidir.
      B: 30.000 TL, %10 istisna gibi bir oran uygulanmasıyla bulunur; özel kuraldaki oran %50'dir.
      C: 60.000 TL, %20 istisna gibi bir oran uygulanmasıyla bulunur; özel kuraldaki oran %50'dir.
      E: 300.000 TL'nin tamamı istisna değildir; özel paragraf yalnızca %50 istisna oranı tanır.
    hesap_adimlari:
    - 300.000 × 0,50 = 150.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b
    alinti: '(Ek paragraf:27/12/2023-7491/58 md.) Kanunî ve iş merkezi Türkiye’de

      bulunmayan anonim ve limited şirket niteliğindeki yabancı kurumların sermayesine iştirak

      eden kurumların, bu iştiraklerinden elde ettikleri iştirak kazançları için istisna oranı, iştirak

      payını elinde tutan şirketin yurt dışı iştirakin ödenmiş sermayesinin en az %50’sine sahip

      olması ve kazancın elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin

      verilmesi gereken tarihe kadar Türkiye’ye transfer edilmesi şartıyla, bu bentte belirtilen diğer

      şartların sağlanması koşulu aranmaksızın %50 olarak uygulanır.'
