  konu: KVK
  kazanim: tasfiye
  tip: uygulama
  zorluk: 3
  kok: Bir kurumun tasfiye sürecindeki vergisel işlemleri için aşağıdaki sıralamalardan hangisi Kanun hükümlerine
    uygundur?
  secenekler:
    A: Genel kurul kararının tesciliyle tasfiyenin başlaması → bağımsız tasfiye dönemlerinin oluşması → tasfiyenin
      sona erdiği döneme ilişkin beyannamenin 30 gün içinde verilmesi → beyannameyle birlikte tasfiye işlemlerinin
      incelenmesinin istenmesi.
    B: Genel kurul kararının tescili → tasfiye işlemlerinin incelenmesinin istenmesi → bağımsız tasfiye dönemlerinin
      oluşması → son beyannamenin 30 gün içinde verilmesi.
    C: Tasfiye beyannamesinin 30 gün içinde verilmesi → genel kurul kararının tescili → bağımsız tasfiye dönemleri
      → inceleme talebi.
    D: Bağımsız tasfiye dönemleri → genel kurul kararının tescili → inceleme talebi → son beyannamenin 30 gün içinde
      verilmesi.
    E: Genel kurul kararının tescili → son beyannamenin verilmesi → bağımsız tasfiye dönemleri → inceleme talebi.
  dogru: A
  aciklama:
    dogru_neden: Tasfiye genel kurul kararının tesciliyle başlar; tasfiye dönemleri bağımsız dönemler olarak oluşur.
      Son tasfiye beyannamesi tasfiyenin sonuçlandığı tarihten itibaren 30 gün içinde verilir ve beyannameyle birlikte
      inceleme talep edilir.
    celdiriciler:
      B: İnceleme talebi son tasfiye beyannamesiyle birlikte yapılır; sıralama erkendir.
      C: Beyanname tasfiyenin başlamasından önce verilmez.
      D: Tasfiye dönemleri tasfiyenin başlangıcından sonra oluşur.
      E: Son beyannamenin verilmesi bağımsız dönemlerin oluşmasından önce gelmez.
