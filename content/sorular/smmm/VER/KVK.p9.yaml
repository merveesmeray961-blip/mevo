      \ Tam mükellefiyete tabi başka bir kurumun kârına katılma imkânı veren kurucu\nsenetleri ile diğer intifa senetlerinden\
      \ elde ettikleri kâr payları,\n        3) Tam mükellefiyete tabi girişim sermayesi yatırım fonu katılma payları ile\
      \ girişim\nsermayesi yatırım ortaklıklarının hisse senetlerinden elde ettikleri kâr "
