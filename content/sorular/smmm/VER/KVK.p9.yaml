      kazancın tamamının istisna edildiğini söylemek yanlıştır.
    celdiriciler:
      A: Tam mükellef kurum iştirak kazancı istisnasını doğru belirtir.
      B: Yurt dışı iştirak için %10 ve bir yıl şartlarını doğru verir.
      C: Transfer şartını doğru verir.
      E: Kanundaki %50 sahiplik halinde %50 istisna kuralını doğru verir.
