  secenekler:
    A: Tam mükellef başka bir kuruma sermaye iştirakinden elde edilen kazançlar kurumlar vergisinden istisnadır.
    B: Yurt dışındaki anonim veya limited şirkete en az %10 iştirak ve en az bir yıl elde tutma, ayrıca kanundaki diğer şartların
      sağlanması halinde iştirak kazancı istisnası uygulanabilir.
    C: Yurt dışı iştirak kazancının, ilgili hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi gereken tarihe
      kadar Türkiye'ye transfer edilmesi şartı, md.5/1-b'deki genel şartlardan biridir.
    D: Yurt dışı iştirakte en az %50 pay sahibi olunması ve kazancın beyanname verme tarihine kadar Türkiye'ye transfer edilmesi
      halinde iştirak kazancının tamamı istisna edilir.
    E: Yurt dışı iştiraklerde %50 sahiplik ve zamanında transfer koşulları sağlanırsa, md.5/1-b'deki diğer şartlar aranmaksızın
      istisna oranı %50 olarak uygulanabilir.
  dogru: D
