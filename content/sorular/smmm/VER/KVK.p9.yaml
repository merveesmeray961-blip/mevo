- id: SMMM-VER-KVK-0077
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: tasfiye
  tip: hesaplama
  zorluk: 1
  kok: Tasfiye halindeki (R) A.Ş.'nin bir tasfiye döneminin başındaki öz sermayesi 1.000.000 TL, dönem sonundaki öz sermayesi
    1.350.000 TL'dir. Tasfiye sırasında ortaklara 100.000 TL avans ödenmiş, ortaklar mevcut sermayeye ilave olarak 200.000
    TL ödeme yapmış ve tasfiye döneminde 50.000 TL vergiden istisna edilmiş kazanç elde edilmiştir. Başka bir düzeltme bulunmadığına
    göre tasfiye kârı kaç TL'dir?
  secenekler:
    A: 100.000 TL
    B: 150.000 TL
    C: 250.000 TL
    D: 200.000 TL
    E: 300.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Tasfiye kârı 200.000 TL''dir. Tasfiye kârı, dönem sonu servet değerine ortaklara yapılan ödemelerin eklenmesi
      ve dönem başı servet değerine ortakların ilave ödemeleri ile istisna edilmiş kazançların eklenmesiyle bulunan farktır:
      (1.350.000 + 100.000) - (1.000.000 + 200.000 + 50.000) = 200.000 TL.'
    celdiriciler:
