  konu: KVK
  kazanim: mükellefiyet (tam/dar)
  tip: uygulama
  zorluk: 3
  kok: 'Kanunî ve iş merkezleri Türkiye dışında bulunan iki yabancı kurumun Türkiye''deki faaliyetleri aşağıdaki gibidir:
    (I) (A) Kurumu, Türkiye''de satın aldığı malları Türkiye''de satmadan doğrudan başka ülkeye gönderiyor ve satış sözleşmesini
    yurt dışında yapıyor. (II) (B) Kurumu, Türkiye''deki malları Türkiye''de satıyor. KVK''nın tam/dar mükellefiyet ve Türkiye''de
    elde edilme hükümleri bakımından aşağıdaki karşılaştırmalardan hangisi doğrudur?'
  secenekler:
    A: Her iki kurum da tam mükelleftir; çünkü Türkiye'den mal satın almaları yeterlidir.
    B: (A) Kurumunun kazancı Türkiye'de elde edilmiş sayılmaz; (B) Kurumunun Türkiye'de yaptığı satıştan doğan kazanç Türkiye'de
      elde edilmiş sayılır.
    C: (A) Kurumunun kazancı Türkiye'de elde edilmiş sayılır; (B) Kurumunun kazancı Türkiye'de elde edilmiş sayılmaz.
    D: Her iki kurumun kazancı da Türkiye'de elde edilmiş sayılmaz; dar mükellef kurumların ticari kazançları Türkiye'de vergilendirilemez.
    E: (A) Kurumunun tam mükellef olması için kanunî merkezinin Türkiye dışında bulunması yeterlidir; (B) Kurumu otomatik
      olarak tam mükelleftir.
  dogru: B
  aciklama:
    dogru_neden: Kanunî ve iş merkezlerinin her ikisi Türkiye dışında bulunan kurumlar dar mükelleftir. Türkiye'de satın alınan
      malların Türkiye'de satılmadan yabancı ülkeye gönderilmesinden doğan kazanç Türkiye'de elde edilmiş sayılmaz; buna karşılık
      Türkiye'de yapılan satış, md. 3/3-a'daki satışın Türkiye'de sayılmasına ilişkin şartlardan biriyle Türkiye'de elde edilme
      sonucunu doğurur.
    celdiriciler:
      A: İki merkezin de Türkiye dışında olması dar mükellefiyet doğurur; satın alma tek başına tam mükellefiyet yaratmaz.
      C: İlk olay için kanundaki özel istisna tersine çevrilmiştir; ikinci olayda Türkiye'de satış vardır.
      D: Dar mükellef kurumların Türkiye'de elde ettikleri kazançlar vergilendirilir.
      E: Tam mükellefiyet için kanunî veya iş merkezinin Türkiye'de bulunması gerekir.
