    madde: md. 9/1-a
    alinti: 'Kanunun 20 nci maddesinin birinci fıkrası çerçevesinde devralınan kurumların devir tarihi itibarıyla öz sermaye
      tutarını geçmeyen zararları ile 20 nci maddenin ikinci fıkrası kapsamında gerçekleştirilen tam bölünme işlemi sonucu
      bölünen kurumdaki öz sermayesinin devralınan tutarını geçmeyen ve devralınan kıymetle orantılı zararların indirilmesinde
