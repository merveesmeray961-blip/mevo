      \ Türkiye'de bulunanlar, gerek Türkiye içinde gerekse Türkiye dışında\nelde ettikleri kazançların tamamı üzerinden\
      \ vergilendirilirler.\n        (2) Dar mükellefiyet: Kanunun 1 inci maddesinde sayılı kurumlardan kanunî ve\
      \ iş\nmerkezlerinin her ikisi de Türkiye'de bulunmayanlar, sadece Türkiye'de elde ettikleri\nkazançları üzerinden\
      \ vergilendirilirler.\n        (3) Dar mükellefiyette kurum kazancı, aşağıdaki kazanç ve iratlardan oluşur:\n\
      \        a) 4/1/1961 tarihli ve 213 sayılı Vergi U"
