- id: SMMM-VER-KVK-0099
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: örtülü sermaye
  tip: hesaplama
  zorluk: 2
  kok: Tam mükellef (M) A.Ş.'nin hesap dönemi başındaki öz sermayesi 2.000.000 TL'dir. Şirket, ortağından 5.000.000
    TL borç; ortakla ilişkili bir banka niteliğindeki kredi kurumundan da 6.000.000 TL borç temin etmiştir. Kredi
    kurumundan alınan borcun KVK md. 12/2 gereğince %50'si dikkate alınacaktır. Borçların tamamı işletmede kullanılmaktadır.
    Buna göre hesap dönemi içinde örtülü sermaye sayılacak borç kısmı kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 1.000.000 TL
    C: 2.000.000 TL
    D: 3.000.000 TL
    E: 4.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: Öz sermayenin üç katı 6.000.000 TL'dir. Ortağın borcu 5.000.000 TL, kredi kurumundan alınan 6.000.000
      TL'nin %50'si ise 3.000.000 TL dikkate alınır. Toplam dikkate alınan borç 8.000.000 TL olduğundan 6.000.000
      TL'yi aşan 2.000.000 TL örtülü sermayedir.
    celdiriciler:
      A: Dikkate alınan toplam borç 8.000.000 TL olduğundan örtülü sermaye sıfır değildir.
      B: 1.000.000 TL, 8.000.000 TL ile 6.000.000 TL arasındaki fark değildir; fark 2.000.000 TL'dir.
      D: 3.000.000 TL yalnız kredi kurumundan alınan borcun dikkate alınan kısmıdır; örtülü sermaye tutarı değildir.
      E: 4.000.000 TL, %50 dikkate alma kuralı ve üç kat sınırı birlikte uygulanınca çıkmaz.
    hesap_adimlari:
    - Öz sermayenin üç katı = 2.000.000 × 3 = 6.000.000 TL.
    - Kredi kurumundan alınan 6.000.000 TL'nin %50'si = 3.000.000 TL dikkate alınır.
    - Toplam dikkate alınan borç = 5.000.000 + 3.000.000 = 8.000.000 TL.
    - Örtülü sermaye = 8.000.000 - 6.000.000 = 2.000.000 TL.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1
    alinti: '        MADDE 12- (1) Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden

      doğrudan veya dolaylı olarak temin ederek işletmede kullandıkları borçların, hesap dönemi

      içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı, ilgili hesap dönemi

      için örtülü sermaye sayılır.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/2
    alinti: '         (2) Yukarıda belirtilen karşılaştırma sırasında, sadece ilişkili şirketlere finansman

      temin eden kredi şirketlerinden yapılan borçlanmalar hariç olmak üzere, ana faaliyet

      konusuna uygun olarak faaliyette bulunan ve ortak veya ortakla ilişkili kişi sayılan banka veya

      benzeri kredi kurumlarından yapılan borçlanmalar % 50 oranında dikkate alınır.'
