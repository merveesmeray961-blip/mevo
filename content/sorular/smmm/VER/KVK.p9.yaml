- id: SMMM-VER-KVK-0068
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: örtülü sermaye
  tip: hesaplama
  zorluk: 3
  kok: (P) A.Ş.'nin hesap dönemi başındaki öz sermayesi 4.000.000 TL'dir. Şirket, ortağından 9.000.000 TL, ortakla
    ilişkili bir kişiden 5.000.000 TL borç kullanmıştır. Ayrıca ana faaliyet konusuna uygun faaliyet gösteren bir
    bankadan 4.000.000 TL borçlanmıştır. KVK md. 12/2'deki banka borçlanmalarının %50 dikkate alınması kuralı uygulanacaktır.
    Örtülü sermaye sayılacak borç tutarı kaç TL'dir?
  secenekler:
    A: 2.000.000 TL
    B: 4.000.000 TL
    C: 6.000.000 TL
    D: 8.000.000 TL
    E: 10.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Ortak ve ilişkili kişi borcu 14.000.000 TL''dir. Bankadan alınan 4.000.000 TL borçlanma %50 dikkate
      alınarak 2.000.000 TL sayılır; toplam 16.000.000 TL dikkate alınır. Öz sermayenin üç katı 12.000.000 TL olduğundan
      aşan 4.000.000 TL örtülü sermayedir. Püf noktaları: Banka borcunun tamamı değil yarısı karşılaştırmaya dahil
      edilir; önce bu düzeltme yapılmalı, sonra üç kat sınırı uygulanmalıdır.'
    celdiriciler:
      A: Örtülü sermaye, aşan tutardır; 12.000.000 TL sınır ile 16.000.000 TL dikkate alınan borç arasındaki fark
        4.000.000 TL'dir.
      C: 6.000.000 TL, banka borcunun %50'si dikkate alındıktan sonra yanlış bir sınır farkına dayanır.
      D: 8.000.000 TL, üç kat sınırının yanlış uygulanmasına dayanır.
      E: 10.000.000 TL, banka borcunun etkisini veya üç kat sınırını yanlış hesaba katar.
    hesap_adimlari:
    - Ortak + ilişkili kişi borcu = 9.000.000 + 5.000.000 = 14.000.000 TL
    - Banka borcunun dikkate alınan kısmı = 4.000.000 × %50 = 2.000.000 TL
    - Toplam dikkate alınan borç = 16.000.000 TL
    - Öz sermayenin üç katı = 4.000.000 × 3 = 12.000.000 TL
    - Örtülü sermaye = 16.000.000 - 12.000.000 = 4.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1
    alinti: Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden doğrudan veya dolaylı olarak temin
      ederek işletmede kullandıkları borçların, hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin
      üç katını aşan kısmı, ilgili hesap dönemi için örtülü sermaye sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/2
    alinti: Yukarıda belirtilen karşılaştırma sırasında, sadece ilişkili şirketlere finansman temin eden kredi şirketlerinden
      yapılan borçlanmalar hariç olmak üzere, ana faaliyet konusuna uygun olarak faaliyette bulunan ve ortak veya
      ortakla ilişkili kişi sayılan banka veya benzeri kredi kurumlarından yapılan borçlanmalar % 50 oranında dikkate
      alınır.
