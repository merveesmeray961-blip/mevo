  tip: hesaplama
  zorluk: 2
  kok: (M) A.Ş., başka bir şirketi 2026 yılında devir yoluyla devralmıştır. Devralınan şirketin devir tarihi itibarıyla öz
    sermayesi 600.000 TL, geçmiş yıllardan devreden zararı 750.000 TL'dir. KVK md. 9'da belirtilen diğer özel şartların tamamının
    sağlandığı varsayılmaktadır. Devralınan şirket zararının en fazla kaç TL'si devralan kurum tarafından indirilebilir?
  secenekler:
    A: 150.000 TL
    B: 600.000 TL
    C: 750.000 TL
    D: 1.350.000 TL
    E: Hiçbiri
  dogru: B
  aciklama:
    dogru_neden: Devir yoluyla devralınan kurumun zararlarında KVK md. 9, devir tarihi itibarıyla öz sermaye tutarını aşmayan
      kısmın indirimine izin verir. 750.000 TL zarar karşısında 600.000 TL öz sermaye bulunduğundan indirilebilecek azami
      tutar 600.000 TL'dir.
    celdiriciler:
      A: 750.000 - 600.000 = 150.000 TL kalan zarar, indirilebilecek tutar değildir; sınır öz sermaye tutarıdır.
      C: 750.000 TL zarar öz sermayeyi aştığı için tamamı indirilemez.
      D: Öz sermaye ile zarar toplanmaz; indirim üst sınırı 600.000 TL'dir.
      E: Diğer özel şartların sağlandığı varsayıldığından indirim tamamen dışlanmaz.
    hesap_adimlari:
    - 'Devralınan zarar: 750.000 TL'
    - 'Devir tarihi öz sermayesi: 600.000 TL'
    - İndirilebilecek azami zarar = min(750.000, 600.000) = 600.000 TL
