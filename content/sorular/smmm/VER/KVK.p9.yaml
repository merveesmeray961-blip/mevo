      \ iştirak eden kurumların, bu iştiraklerinden elde ettikleri aşağıdaki\nşartları taşıyan iştirak kazançları;\n     \
      \    1) İştirak payını elinde tutan şirketin, yurt dışı iştirakin ödenmiş sermayesinin en az %\n10’una sahip olması,\n\
      \         2) Kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz olarak en az bir yıl\nsüreyle elde tutulması\
      \ (Rüçhan hakkı kullanılmak suretiyle veya yurt dışı iştirakin iç\nkaynaklarından yapılan sermaye artırımları nedeniyle\
