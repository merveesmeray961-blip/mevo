    alinti: 'finansal kuruluşlar, finansal kiralama, faktoring ve finansman şirketleri dışında, kullanılan yabancı

      kaynakları öz kaynaklarını aşan işletmelerde, aşan kısma münhasır olmak üzere, yatırımın maliyetine

