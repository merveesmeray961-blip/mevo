    alinti: "de veya bu\ntemsilciler vasıtasıyla yapılan işlerden elde edilen ticarî kazançlar (Bu şartları taşısalar\
      \ bile\nkurumların ihraç edilmek üzere Türkiye'de satın aldıkları malları Türkiye'de satmaksızın\nyabancı\
