    madde: md. 3/2
    alinti: '        (2) Dar mükellefiyet: Kanunun 1 inci maddesinde sayılı kurumlardan kanunî ve iş

      merkezlerinin her ikisi de Türkiye''de bulunmayanlar, sadece Türkiye''de elde ettikleri

