    dogru_neden: KV Genel Tebliği Seri No. 1, yatırımın maliyetine eklenen giderleri kapsam dışında bırakmakta;
      yabancı kaynak kullanım süresine bağlı olmayan kredi sözleşmesi damga vergisinin kısıtlamaya tabi olmadığını
      açıklamakta ve düzenlemenin bilanço esasına tabi mükellefler için geçerli olduğunu belirtmektedir.
    celdiriciler:
      A: I doğru olmakla birlikte II ve III de doğru olduğundan eksiktir.
