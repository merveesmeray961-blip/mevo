    doğrudur?
  secenekler:
    A: Sermaye unsurları — azaltılan tutar içindeki payları, nakdî/aynî sermaye ile diğer sermayeye eklenen unsurların
      toplam sermayeye oranı esas alınarak belirlenir.
    B: Beş tam yıl geçtikten sonra — azaltımın tamamı vergiye tabi öz sermaye kalemlerinden yapılmış sayılır.
    C: Sermaye azaltımı — beş yıl geçtikten sonra yapılsa bile birinci fıkranın (a) bendindeki unsurlardan yapılmış
      sayılır.
    D: Oran hesabı — yalnız nakdî sermaye dikkate alınarak yapılır.
    E: Vergilendirme — beş tam yıl geçtikten sonra yapılan azaltımda sermaye unsurlarının niteliği dikkate alınmaz.
  dogru: A
  aciklama:
