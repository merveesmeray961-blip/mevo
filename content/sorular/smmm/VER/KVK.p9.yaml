    madde: md. 3/3-a
    alinti: "de veya bu\ntemsilciler vasıtasıyla yapılan işlerden elde edilen ticarî kazançlar (Bu şartları taşısalar bile\n\
      kurumların ihraç edilmek üzere Türkiye'de satın aldıkları malları Türkiye'de satmaksızın\nyabancı ülkelere göndermelerinden\
