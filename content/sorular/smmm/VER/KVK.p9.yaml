      unsurlarının, nakdî veya ayni sermaye ile sermayeye eklenen diğer unsurların toplam sermayeye oranlanmasıyla
      tespit edileceğini düzenler.
    celdiriciler:
      B: Otomatik olarak yalnız (a) bendindeki unsurlara tahsis kuralı beş yıl dolmadan yapılan azaltıma ilişkindir.
      C: Sadece (a) bendine ilişkin kabul, beş yıl dolmadan yapılan azaltımın özel kuralıdır.
      D: Oran hesabında nakdî ve ayni sermaye ile diğer unsurlar birlikte dikkate alınır.
      E: Kanun sermaye unsurlarının niteliğine göre oranlama ve vergi kesintisi sonuçlarını öngörür.
