      giderlerden kredi faizleri üzerinden hesaplanan banka ve sigorta muameleleri vergisi gibi bir yabancı

      kaynağın işletmede kullanım süresine bağlı olarak doğanların ise finansman gider kısıtlaması

      uygulamasına konu edileceği açıktır.'
