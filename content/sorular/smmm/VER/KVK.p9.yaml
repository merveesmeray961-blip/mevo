      B: (b) bendini ilk sıraya alır; Kanun (a) ile başlar.
      D: (c)'yi (b)'den önce getirir ve Kanunda bulunmayan nakdî sermaye önceliği kurar.
      E: Hem sıralamayı hem de öncelik kuralını yanlış kurar.
