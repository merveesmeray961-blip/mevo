  - YET
  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: mükellefiyet (tam/dar)
  tip: kavrama
  zorluk: 3
  kok: 'Aşağıdaki üç kurum durumu dikkate alınmıştır:


    I. Kanunî merkezi Türkiye''de, iş merkezi Almanya''da bulunan kurum.

    II. Kanunî ve iş merkezi Türkiye dışında bulunan, Türkiye''de işyeri aracılığıyla yerel satış yapan kurum.

    III. Kanunî ve iş merkezi Türkiye dışında bulunan, Türkiye''den satın aldığı malları Türkiye''de satmaksızın yabancı ülkelere
    gönderen kurum.


    Bu durumlar için KVK bakımından hangi değerlendirme doğrudur?'
  secenekler:
    A: I dar, II dar, III Türkiye'de elde edilmiş sayılır.
    B: I tam, II tam, III Türkiye'de elde edilmiş sayılır.
    C: I dar, II tam, III Türkiye'de elde edilmiş sayılmaz.
    D: I tam, II dar, III Türkiye'de elde edilmiş sayılmaz.
    E: I tam, II dar, III Türkiye'de elde edilmiş sayılır.
  dogru: D
  aciklama:
    dogru_neden: Kanunî veya iş merkezinden birinin Türkiye'de bulunması tam mükellefiyet doğurur. Her ikisi Türkiye dışında
      olan kurum dar mükelleftir; ancak Türkiye'den ihraç edilmek üzere satın alınan malların Türkiye'de satılmaksızın gönderilmesinden
      doğan kazanç Türkiye'de elde edilmiş sayılmaz.
    celdiriciler:
      A: I'in kanunî merkezinin Türkiye'de olmasını göz ardı eder.
      B: II'yi tam mükellef kabul eder ve III'ü Türkiye kaynaklı sayar.
      C: I'i dar mükellef kabul eder.
      E: III bakımından kanundaki özel ihracat-satış istisnasını göz ardı eder.
