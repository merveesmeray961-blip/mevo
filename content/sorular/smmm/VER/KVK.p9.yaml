  ders: VER
  unite: Kurumlar vergisi
  konu: KVK
  kazanim: yurt içi asgari KV
  tip: hesaplama
  zorluk: 2
  kok: (T) A.Ş.'nin 2026 hesap döneminde ticari bilanço kârı 2.000.000 TL, KKEG'si 200.000 TL'dir. Bu kazancın 1.500.000 TL'si,
    KVK md.5/1-e şartları sağlanan iştirak hissesi satış kazancının istisna edilen kısmıdır. Başka indirim/istisna ve indirimli
    oran yoktur. Kurumlar vergisi oranı %25 kabul edilirse, normal kurumlar vergisi ile yurt içi asgari kurumlar vergisinden
    yüksek olan hangisidir?
  secenekler:
    A: Normal KV 175.000 TL; asgari KV 220.000 TL; ödenecek 220.000 TL
    B: Normal KV 125.000 TL; asgari KV 200.000 TL; ödenecek 200.000 TL
    C: Normal KV 500.000 TL; asgari KV 220.000 TL; ödenecek 500.000 TL
    D: Normal KV 175.000 TL; asgari KV 70.000 TL; ödenecek 175.000 TL
    E: Normal KV 50.000 TL; asgari KV 220.000 TL; ödenecek 220.000 TL
  dogru: A
  aciklama:
    dogru_neden: Önceki kurum kazancı 2.000.000 + 200.000 = 2.200.000 TL'dir. 5/e istisnası 32/C/2-a'da sayılmadığı için asgari
      vergi hesabında düşülmez ve asgari vergi 220.000 TL olur. Normal matrah 2.200.000 - 1.500.000 = 700.000 TL; %25 = 175.000
      TL. Yüksek olan 220.000 TL'dir.
    celdiriciler:
      B: Normal vergi matrahı 700.000 TL'dir; 125.000 TL değildir.
      C: Normal vergi istisna sonrası 700.000 TL matrahtan hesaplanır.
      D: Asgari vergi 220.000 TL'dir; 70.000 TL değildir.
      E: Normal KV %25 ile 175.000 TL'dir.
    hesap_adimlari:
    - 2.000.000+200.000=2.200.000 TL asgari matrah.
    - 2.200.000 x %10=220.000 TL asgari KV.
    - 2.200.000-1.500.000=700.000 TL normal matrah.
