    vergisinden istisna edilen bir kazançla ilgili değildir; zararın ilgili ülkedeki vergi matrahına ilişkin raporu
    yetkili denetim kuruluşunca hazırlanmış, raporun aslı ve tercümesi Türkiye'deki ilgili vergi dairesine ibraz
    edilmiş ve aynı zarar yabancı ülkede mahsup edilmemiş veya gider yazılmamıştır. Diğer şartların sağlandığı varsayımıyla
    2026 kurumlar vergisi matrahı kaç TL'dir?
