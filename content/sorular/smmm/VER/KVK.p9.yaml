      \ hesap dönemi yerine tasfiye dönemi geçerli olur.\n        a) Tasfiye, kurumun tasfiyeye girmesine ilişkin\
      \ genel kurul kararının tescil edildiği\ntarihte başlar ve tasfiye kararının tescil edildiği tarihte sona\
      \ erer. Başlangıç tarihinden aynı\ntakvim yılı sonuna kadar olan dönem ile bu dönemden sonraki her takvim\
      \ yılı ve tasfiyenin\nsona erdiği dönem için ilgili takvim yılı başından tasfiyenin bitiş tarihine kadar olan\
      \ dönem\nbağımsız bir tasfiye dönemi sayılır.\n        b) Tasfiy"
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/2 ve 17/8
    alinti: "(2) Tasfiye beyannameleri: Tasfiye beyannameleri, tasfiye memurları tarafından\ntasfiye dönemlerinin\
      \ sonundan itibaren Kanunun 14 üncü maddesinde yazılı sürelerde;\ntasfiyenin sona erdiği döneme ilişkin tasfiye\
      \ beyannamesi ise tasfiyenin sonuçlandığı tarihten\nitibaren otuz gün içinde kurumun bağlı olduğu vergi dairesine\
      \ verilir.\n         (3) Bu madde gereğince verilecek olan beyannamelere, bilânço ve gelir tablosu ile\ntasfiye\
      \ bilânçosuna göre ortaklara dağıtılan paralar ve diğer değerlerin ayrıntılı bir listesi\neklenir.\n     \
      \    (4) Tasfiye kârı: Tasfiye halindeki kurumların vergi matrahı tasfiy"
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/8
    alinti: '(8) Tasfiye işlemlerinin incelenmesi: Tasfiye beyannamesinin verilmesiyle birlikte

      tasfiye memurları, işlemlerinin vergi kanunları yönünden incelenmesini bir dilekçe ile isterler.

