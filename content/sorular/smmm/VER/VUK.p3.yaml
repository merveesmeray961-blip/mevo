- id: SMMM-VER-VUK-0003
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: VUK
  kazanim: 'Binek otomobilde amortisman: aktife girilen dönemde ay esası (VUK md. 320) ve gider yazılabilecek tutar
    sınırı (GVK md. 40/7)'
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Ticari kazancı bilanço esasına göre tespit edilen Bay (N), faaliyet konusu binek otomobil kiralamak veya
    işletmek olmadığı hâlde, 12 Ekim 2026 tarihinde ikinci el bir binek otomobili, amortismana tabi tutarı 3.250.000
    TL olarak iktisap etmiş ve aynı tarihte işletme aktifine kaydetmiştir. Hazine ve Maliye Bakanlığınca ilan edilen
    faydalı ömür 5 yıl (normal amortisman oranı %20) olup Bay (N) bu orana göre normal amortisman yöntemini uygulamakta,
    amortisman süresini kısaltma veya uzatma yönünde bir tercih kullanmamaktadır. Binek otomobile ilişkin giderlerin
    en fazla %70''inin indirilebileceği yönündeki sınırlama bu soruda dikkate alınmayacaktır.


    Buna göre 2026 yılı ticari kazancının tespitinde bu otomobil için en fazla kaç TL amortisman gider yazılabilir?'
  secenekler:
    A: '650.000'
    B: '520.000'
    C: '162.500'
    D: '130.000'
    E: '32.500'
  dogru: D
  aciklama:
    dogru_neden: 'Üç adımda çözülür. (1) VUK md. 320/2''ye göre işletmeye ait binek otomobillerin aktife girdiği
      hesap dönemi için ay kesri tam ay sayılarak kalan ay süresi kadar amortisman ayrılır: 12 Ekim 2026''dan itibaren
      Ekim, Kasım ve Aralık = 3 ay. (2) Ayrılan amortisman: 3.250.000 × %20 × 3/12 = 162.500 TL. (3) GVK md. 40/7''ye
      göre ikinci el olarak iktisap edilen binek otomobilde amortismana tabi tutar 2.600.000 TL''yi (iktisap tarihinde
      yürürlükteki tutar) aşıyorsa, ayrılan amortismanın en fazla bu tutara isabet eden kısmı gider yazılabilir:
      2.600.000 × %20 × 3/12 = 130.000 TL (162.500 × 2.600.000 ÷ 3.250.000 ile aynı sonuç).


      Püf noktaları: İki hüküm birlikte okunur: VUK md. 320/2 binek otomobil için ilk yıl amortismanını ay esasına
      (ay kesri tam ay) bağlar; GVK md. 40/7 ise gider yazılabilecek kısmı sınırlar. Sınır tutarı iktisap tarihinde
      yürürlükte olan tutardır. Tuzaklar: tam yıl amortisman ayırmak; sınırı unutmak; sınırı aşan kısmı (kanunen
      kabul edilmeyen tutarı) cevap sanmak.'
    celdiriciler:
      A: '650.000: tam yıl amortismanı (3.250.000 × %20) alınmış, hem ay esası hem tutar sınırı uygulanmamıştır.'
      B: '520.000: tutar sınırı uygulanmış (2.600.000 × %20) ancak aktife girilen dönem için ay esası dikkate alınmamıştır.'
      C: '162.500: ay esası uygulanmış ancak GVK md. 40/7''deki 2.600.000 TL sınırı unutulmuştur.'
      E: '32.500: sınırı aşan ve gider yazılamayan (kanunen kabul edilmeyen) amortisman tutarıdır; gider yazılabilecek
        tutar değildir.'
    hesap_adimlari:
    - 'İlk yıl amortisman süresi: Ekim, Kasım, Aralık (ay kesri tam ay) = 3 ay'
    - 'Ayrılan amortisman: 3.250.000 × 0,20 × 3/12 = 162.500 TL'
    - 'Sınır (ikinci el): 2.600.000 TL; gider yazılabilecek: 2.600.000 × 0,20 × 3/12 = 130.000 TL'
    - 'Kanunen kabul edilmeyen kısım: 162.500 − 130.000 = 32.500 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 320/2
    alinti: Faaliyetleri kısmen veya tamamen binek otomobillerinin kiralanması veya çeşitli şekillerde işletilmesi
      olanların bu amaçla kullandıkları binek otomobilleri hariç olmak üzere, işletmelere ait binek otomobillerinin
      aktife girdiği hesap dönemi için ay kesri tam ay sayılmak suretiyle kalan ay süresi kadar amortisman ayrılır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 40/7 (tutar sınırı)
    alinti: özel tüketim vergisi ve katma değer vergisi hariç ilk iktisap bedeli 135.000 Türk lirasını (1.380.000
      TL) , söz konusu vergilerin maliyet bedeline eklendiği veya binek otomobilin ikinci el olarak iktisap edildiği
      hâllerde, amortismana tabi tutarı 250.000 Türk lirasını (2.600.000 TL) aşan binek otomobillerinin her birine
      ilişkin ayrılan amortismanın en fazla bu tutarlara isabet eden kısmı gider yazılabilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 40/7 (iktisap tarihi)
    alinti: Bu hükmün uygulanmasında binek otomobilin iktisap edildiği tarihte yürürlükte olan tutar dikkate alınır.
  - mevzuat: '193 sayılı Gelir Vergisi Kanunu Genel Tebliği (Seri No: 332)'
    madde: 2026 takvim yılı tutarları (md. 40/7)
    alinti: vergilerin maliyet bedeline eklendiği veya binek otomobilin ikinci el olarak iktisap edildiği hallerde
      2.600.000 TL
  dogrulama:
    python: 'sonuc = 2600000 * 0.20 * 3 / 12

