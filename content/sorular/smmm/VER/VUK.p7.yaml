      A: Beyanname verilmemiş olması tek başına engel değildir; md. 371/3 tam tersine 15 günlük süre içinde verilmesini öngörür.
      B: Kökte vergi incelemesine başlanmadan önce haber verilmiştir; bu nedenle md. 371/2’deki zaman şartı sağlanmaktadır.
      C: Ödeme süresi geçmiş vergi için gecikme zammıyla birlikte 15 gün içinde ödeme şartı vardır.
      D: İhbar bulunmaması yalnızca şartlardan biridir; diğer beyan ve ödeme şartları da aranır.
