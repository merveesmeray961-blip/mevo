  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: zamanaşımı
  tip: uygulama
  zorluk: 2
  kok: Bir verginin doğduğu takvim yılı 2021’dir. Vergi dairesi 1 Temmuz 2025’te matrah takdiri için takdir komisyonuna başvurmuş
    ve komisyon kararı 1 Kasım 2025’te vergi dairesine tevdi edilmiştir. Başka bir durdurucu veya uzatıcı durum bulunmamaktadır.
    213 sayılı Vergi Usul Kanunu’na göre bu vergi için tarh ve tebliğ zamanaşımının son günü hangi tarihtir?
  secenekler:
    A: 31 Aralık 2026
    B: 31 Ocak 2027
    C: 30 Nisan 2027
    D: 31 Mayıs 2027
    E: 31 Aralık 2027
  dogru: C
  aciklama:
    dogru_neden: 'Tarh zamanaşımı 1 Ocak 2022’de başlar ve normal olarak 31 Aralık 2026’da sona erer. 1 Temmuz 2025’te yapılan
      takdir komisyonuna başvuru zamanaşımını durdurur; 1 Kasım 2025’te kararın vergi dairesine tevdiini takip eden gün süre
      yeniden işlemeye başlar. Yaklaşık dört aylık işlemeyen süre sonuna eklenerek son gün 30 Nisan 2027 olur. Püf noktaları:
      Durdurma süresi bir yıldan fazla olamaz; burada fiilen yaklaşık dört aylık süre kullanılmıştır.'
    celdiriciler:
      A: Durdurulan süre hiç dikkate alınmamıştır.
      B: Durdurma süresi bir ay değil, 1 Temmuz-1 Kasım 2025 arasındaki yaklaşık dört aydır.
      D: Durdurma süresi yaklaşık dört ay olduğundan 31 Mayıs 2027 bir ay geçtir.
      E: Bir yıllık azami durma sınırı uygulanmadan beş yıllık süreye iki yıl eklenemez.
    hesap_adimlari:
    - Normal zamanaşımı sonu = 31 Aralık 2026
    - 1 Temmuz-1 Kasım 2025 arasındaki işlemeyen süre yaklaşık 4 aydır.
    - Normal sona yaklaşık 4 ay eklenerek = 30 Nisan 2027
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114
    alinti: Madde 114 – Vergi alacağının doğduğu takvim yılını takip eden yılın başından
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114/2
    alinti: 'dairesince matrah takdiri için takdir komisyonuna başvurulması, zamanaşımını durdurur.

      Duran zamanaşımı mezkûr komisyon kararının vergi dairesine tevdiini takip eden günden

      itibaren kaldığı yerden işlemeye devam eder. Ancak işlemeyen süre her hâl ve takdirde bir'
