- id: SMMM-VER-VUK-0043
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: emsal bedel
  tip: uygulama
  zorluk: 2
  kok: Gerçek bedeli bulunmayan bir mal için emsal bedeli belirlenirken aynı cins ve nevideki mallardan değerlemenin yapılacağı
    ayda satışlar yapılmıştır. Aylık satış miktarı, emsal bedeli tayin edilecek malın miktarının %25'inden az değildir. VUK
    md. 267'ye göre hangi yöntem uygulanır?
  secenekler:
    A: Takdir komisyonu yöntemi
    B: Maliyet bedeline %10 ekleme
    C: Ortalama fiyat esası
    D: Rayiç bedel yöntemi
    E: Mukayyet değer
  dogru: C
  aciklama:
    dogru_neden: VUK md. 267'de birinci sıra olan ortalama fiyat esası, aynı cins ve nevideki mallardan değerleme ayı veya
      önceki iki ayda satış yapılmışsa ve aylık satış miktarı emsal bedeli tayin edilecek malın miktarının %25'inden az değilse
      uygulanır. Olay bu şartları taşımaktadır.
    celdiriciler:
      A: Takdir komisyonu yöntemi, birinci sıradaki ortalama fiyat şartları mevcutken uygulanacak ilk yöntem değildir.
      B: '%10 ekleme ikinci sıradaki perakende maliyet bedeli esasıyla ilgilidir; olayda birinci sıra şartları sağlanmıştır.'
      D: Rayiç bedel VUK md. 261'de ölçü olarak bulunmakla birlikte md. 267'nin verilen olayındaki ilk sıra yöntemi değildir.
      E: Mukayyet değer bu olay için md. 267'nin birinci sıra yöntemi değildir.
