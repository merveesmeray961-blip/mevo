  kok: (K) Ltd. beyana dayanan bir vergiye ilişkin hiç vermediği beyannamesini pişmanlık hükümlerinden yararlanarak vermek
    istemektedir. Şirket, ilgili vergi türü bakımından henüz incelemeye başlanmadığını ve takdir komisyonuna sevk yapılmadığını
    düşünmektedir. Ancak aynı olay daha önce bir muhbir tarafından yetkili makama dilekçe ile bildirilmiş ve dilekçe resmî
    kayıtlara geçirilmiştir. Şirketin pişmanlık hükümlerinden yararlanması bakımından aşağıdakilerden hangisi doğrudur?
