  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: emsal bedel
  tip: uygulama
  zorluk: 2
  kok: Bir işletme, gerçek bedeli bilinmeyen ve maliyet bedeli 800.000 TL olan bir malı değerleme gününde toptan satışa konu
    edecektir. Aynı cins ve nevideki malların değerleme ayındaki ve önceki iki aydaki satış miktarları, emsal bedeli belirlenecek
    malın miktarının %20’sinin altında kalmaktadır. 213 sayılı Vergi Usul Kanunu’na göre emsal bedelinin mükellef tarafından
    belirlenmesinde hangi tutar esas alınmalıdır?
  secenekler:
    A: 800.000 TL
    B: 820.000 TL
    C: 840.000 TL
    D: 880.000 TL
    E: 920.000 TL
  dogru: C
  aciklama:
    dogru_neden: Birinci sıranın uygulanması için aylık satış miktarının emsal bedeli tayin olunacak malın miktarına nazaran
      %25’ten az olmaması şarttır. Kökte bu eşik sağlanmadığından ikinci sıra uygulanır; maliyet bedeline toptan satışlar
      için %5 eklenir. 800.000 x 1,05 = 840.000 TL.
    celdiriciler:
      A: Maliyet bedeli doğrudan emsal bedeli kabul edilmiştir; ikinci sırada toptan satış için %5 eklenir.
      B: Maliyete %2,5 eklenmiştir; kanundaki toptan satış oranı %5’tir.
      D: Maliyete %10 eklenmiştir; %10 perakende satışlar içindir.
      E: Maliyete %15 eklenmiştir; ikinci sıradaki oran %5’tir.
    hesap_adimlari:
    - Birinci sıra uygulanamaz; satış miktarı %25 eşiğinin altındadır.
    - 'İkinci sıra: 800.000 x %5 = 40.000 TL'
    - Emsal bedeli = 800.000 + 40.000 = 840.000 TL
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 267
    alinti: "Emsal bedeli sıra ile, aşağıdaki esaslara göre tayin olunur:\n         Birinci sıra: (Ortalama fiyat esası) aynı\
      \ cins ve nevideki mallardan sıra ile\ndeğerlemenin yapılacağı ayda veya bir evvelki veya bir daha evvelki aylarda satış\
      \ yapılmışsa,\nemsal bedeli bu satışların miktar ve tutarına göre mükellef tarafından çıkarılacak olan\n\"Ortalama satış\
      \ fiyatı\" ile hesaplanır. Bu esasın uygulanması için, aylık satış miktarının, emsal\nbedeli tayin olunacak her bir\
      \ malın miktarına nazaran % 25 ten az olmaması şarttır."
