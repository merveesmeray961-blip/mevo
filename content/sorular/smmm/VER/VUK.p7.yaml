      verginin gecikme zammıyla birlikte 15 gün içinde ödenmesi gerekir. Kökte bu şartların tamamı sağlanmıştır. Püf noktaları:
      Tek bir şartın sağlanması yetmez; pişmanlıkta zamanlama, ihbar, beyan ve ödeme şartlarını birlikte kontrol etmelisin.'
