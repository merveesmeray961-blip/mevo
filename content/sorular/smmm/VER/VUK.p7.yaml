- id: SMMM-VER-VUK-0007
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: pişmanlık ve ıslah
  tip: uygulama
  zorluk: 3
  kok: Bir mükellef, beyanname vermediğini kendiliğinden vergi dairesine bildirmiştir. Bildirim tarihinde ilgili vergi türü
    hakkında vergi incelemesine başlanmamış ve olay takdir komisyonuna intikal ettirilmemiştir. Mükellef, eksik beyannamesini
    bildirimden itibaren 10 gün içinde vermiştir. Başka bir engel bulunmadığı varsayımıyla VUK md. 371 bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Pişmanlık hükümleri kesinlikle uygulanamaz; beyanname hiç verilmemiştir.
    B: Pişmanlık için mutlaka 30 günlük süre içinde başvuru gerekir.
    C: Pişmanlık yalnız vergi incelemesi başladıktan sonra uygulanabilir.
    D: Pişmanlık için eksik beyanın bir yıl içinde düzeltilmesi yeterlidir.
    E: Beyanname 15 günlük süre içinde verilmiş olduğundan, diğer şartlar da sağlanıyorsa vergi ziyaı cezası kesilmez.
  dogru: E
  aciklama:
    dogru_neden: 'VUK md. 371, hiç verilmemiş beyannamenin haber verme dilekçesinin verildiği tarihten başlayarak 15 gün içinde
      verilmesini şart koşar; ayrıca haber verme, inceleme veya takdir komisyonuna sevkten önce olmalıdır. Kökte 10 günlük
      süre ve inceleme/takdir engelinin bulunmaması şartları sağlanmıştır. Püf noktaları: Pişmanlıkta yalnız beyanname verme
      süresine değil, bildirimin inceleme veya takdir sürecinden önce yapılmasına da bakılmalıdır.'
    celdiriciler:
      A: Md. 371, hiç verilmemiş beyannamelerin 15 gün içinde verilmesine açıkça izin verir.
      B: Kanundaki süre 30 değil 15 gündür.
      C: Kanun, inceleme başlamadan veya takdir komisyonuna sevkten önce bildirim yapılmasını arar.
      D: Kanunda bir yıllık düzeltme süresi değil 15 günlük beyanname verme şartı düzenlenmiştir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 371/1
    alinti: 'Beyana dayanan vergilerde vergi ziyaı cezasını gerektiren fiilleri işleyen mükelleflerle

      bunların işlenişine iştirak eden diğer kişilerin kanuna aykırı hareketlerini ilgili makamlara

      kendiliğinden dilekçe ile haber vermesi hâlinde, haklarında aşağıda yazılı kayıt ve şartlarla

      vergi ziyaı cezası kesilmez.'
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 371/3
    alinti: '3. Hiç verilmemiş olan vergi beyannamelerinin mükellefin haber verme dilekçesinin

      verildiği tarihten başlayarak onbeş gün içinde tevdi olunması.'
