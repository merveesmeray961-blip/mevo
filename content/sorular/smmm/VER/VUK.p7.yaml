  kok: 2022 takvim yılında doğan bir vergi alacağı için tarh ve tebliğ süresi içinde takdir komisyonuna başvurulmuş ve takdir
    komisyonunda geçen süre zamanaşımını tam bir yıl durdurmuştur. Başka bir durdurucu veya kesici işlem yoktur. Verginin
    tarh ve tebliğ zamanaşımı hangi tarihte sona erer?
  secenekler:
    A: 31 Aralık 2026
    B: 31 Aralık 2027
    C: 31 Aralık 2028
    D: 31 Aralık 2029
    E: 31 Aralık 2030
  dogru: C
  aciklama:
    dogru_neden: VUK md. 114/1’e göre süre, vergi alacağının doğduğu takvim yılını takip eden yılın başından başlayarak beş
      yıldır; 2022 doğumlu vergi için normal bitiş 31 Aralık 2027’dir. Takdir komisyonuna başvuru zamanaşımını durdurur ve
      kökte bu durmanın tam bir yıl sürdüğü belirtilmiştir. Bu nedenle süre bir yıl uzayarak 31 Aralık 2028’de sona erer.
    celdiriciler:
      A: 2022 doğumlu vergi için beş yıllık sürenin başlangıcı 2023’tür; bir yıllık durma da dikkate alındığında bu tarih
        erkendir.
