    A: Pişmanlık uygulanamaz; beyanname hiç verilmemiştir.
    B: Pişmanlık uygulanamaz; vergi incelemesine başlanmış sayılır.
    C: Pişmanlık uygulanır; ancak beyanname 15 gün içinde verilse bile ödeme şartı aranmaz.
    D: Pişmanlık uygulanır; ancak yalnızca ihbar bulunmadığı için vergi ziyaı cezası kesilmez.
    E: Pişmanlık uygulanır; beyannamenin 15 gün içinde verilmesi ve gerekli ödemenin 15 gün içinde yapılması şartları sağlanmıştır.
