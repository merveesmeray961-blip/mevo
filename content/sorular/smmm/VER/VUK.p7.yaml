  aciklama:
    dogru_neden: 'VUK md. 371’de pişmanlık için mükellefin haber verdiği tarihten önce bir muhbir tarafından aynı hususta
      yetkili makama dilekçe ile veya tutanakla bildirim yapılmamış olması şartı vardır. Olay daha önce muhbir tarafından
      resmî kayda geçirilmiştir; bu nedenle pişmanlık şartı sağlanmaz. Püf noktaları: İnceleme veya takdir komisyonu aşamasına
      gelinmemiş olması tek başına yeterli değildir; önceki muhbir bildirimi de bağımsız bir şarttır.'
    celdiriciler:
      B: İnceleme başlamamış olması şartlardan yalnız biridir; önceki muhbir bildirimi şartı ayrıca ihlal edilmiştir.
      C: Kanundaki süre 30 gün değil, hiç verilmemiş beyanname için 15 gündür; ayrıca burada daha temel bir şart ihlal edilmiştir.
      D: Muhbir bildiriminin bulunmaması açıkça bir şarttır; dolayısıyla bildirimin varlığı pişmanlığı etkiler.
      E: Kanunda böyle bir mahkeme kararı şartı yoktur.
