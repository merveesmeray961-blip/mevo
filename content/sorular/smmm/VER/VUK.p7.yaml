      B: Sadece ödeme yapılması yeterli değildir; md. 371’deki şartların birlikte sağlanması gerekir.
      C: Kanunda bu durumda başvuruyu sonradan yapmaya imkân veren bir otuz günlük düzeltme süresi düzenlenmemiştir.
      E: Hüküm mükelleflerle birlikte fiile iştirak eden diğer kişileri de kapsar; yalnız tüzel kişilerle sınırlı değildir.
