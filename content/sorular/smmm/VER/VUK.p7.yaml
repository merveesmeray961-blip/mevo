    celdiriciler:
      A: Muhasebe kayıtlarındaki hesap değeri mukayyet değerdir.
      C: Üzerinde yazılı değer itibari değerdir.
      D: Değerleme günündeki normal alım satım değeri rayiç bedeldir.
      E: İktisapla ilgili ödeme ve giderlerin toplamı maliyet bedelinin tanımıdır.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 267
    alinti: 'Madde 267 – Emsal bedeli, gerçek bedeli olmıyan, veya bilinmiyen veyahut doğru

