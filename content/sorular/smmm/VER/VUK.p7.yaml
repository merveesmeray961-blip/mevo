- id: SMMM-VER-VUK-0006
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: vergi ziyaı ve kaçakçılık
  tip: kavrama
  zorluk: 2
  kok: Bir mükellef, vergi matrahını azaltmak amacıyla muhteviyatı itibarıyla yanıltıcı belge kullanmış ve bu fiil nedeniyle
    100.000 TL vergi ziyaına sebep olmuştur. VUK'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnız 100.000 TL vergi ziyaı cezası uygulanır; ayrıca hapis cezası söz konusu olmaz.
    B: Vergi ziyaı cezası yarım kat uygulanır ve hapis cezası doğmaz.
    C: Vergi ziyaı cezası üç kat olarak uygulanır; ayrıca 359 uncu madde kapsamındaki hapis cezası hükümleri gündeme gelir.
    D: Vergi ziyaı cezası iki kat uygulanır; hapis cezası yalnız sahte belge düzenleyene verilir.
    E: Vergi ziyaı cezası beş kat uygulanır; 359 uncu madde yalnız defter gizlemeyi kapsar.
  dogru: C
  aciklama:
    dogru_neden: VUK md. 344'e göre 359 uncu maddede yazılı fiillerle vergi ziyaına sebebiyet verilirse vergi ziyaı cezası
      üç kat uygulanır. Md. 359/a-2, muhteviyatı itibarıyla yanıltıcı belge düzenleyen veya kullananlar için hapis cezası
      öngörür.
    celdiriciler:
      A: 359 kapsamındaki fiiller vergi ziyaı cezasının ayrıca uygulanmasına engel değildir.
      B: Üç kat kuralı, 359 uncu madde fiilleriyle vergi ziyaı doğması halinde uygulanır.
      D: Kanun iki kat değil üç kat ceza öngörür; hapis hükümleri belgeyi kullananı da kapsar.
      E: Beş kat oranı yoktur ve 359 yalnız defter gizlemeyle sınırlı değildir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/2
    alinti: 'Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet verilmesi halinde bu ceza üç

      kat, bu fiillere iştirak edenlere ise bir kat olarak uygulanır.'
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/a-2
    alinti: "2) Defter, kayıt ve belgeleri tahrif edenler veya gizleyenler veya muhteviyatı itibariyle\nyanıltıcı belge düzenleyenler\
      \ veya bu belgeleri kullananlar,\n        Hakkında on sekiz aydan beş yıla kadar hapis cezasına hükmolunur."
