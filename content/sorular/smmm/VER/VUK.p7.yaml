    A: Muhbir bildirimi bulunduğu için pişmanlık hükümlerinden yararlanamaz.
    B: İnceleme başlamadığı için her durumda pişmanlık hükümlerinden yararlanabilir.
    C: Yalnızca beyannamenin 30 gün içinde verilmesi halinde yararlanabilir.
    D: Muhbir bildirimi yalnız vergi cezasını etkiler, pişmanlığı engellemez.
    E: Pişmanlık için muhbirin bildiriminden sonra ayrıca vergi mahkemesi kararı gerekir.
