    madde: md. 267/ikinci sıra
    alinti: 'İkinci sıra: (Maliyet bedeli esası) Emsal bedeli belli edilecek malın, maliyet bedeli

      bilinir veya çıkarılması mümkün olursa, bu takdirde mükellef bu maliyet bedeline, toptan

