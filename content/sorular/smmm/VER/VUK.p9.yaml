  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: emsal bedel
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme, gerçek bedeli doğru olarak tespit edilemeyen aynı cins ve neviden 40 adet malı değerleme ayında emsal
    bedelle değerleyecektir. Değerleme ayında 10 adet mal toplam 12.000 TL’ye, bir önceki ayda 20 adet mal toplam 20.000 TL’ye,
    iki ay önce 10 adet mal toplam 11.000 TL’ye satılmıştır. Aylık satış miktarları, emsal bedeli belirlenecek 40 adet mala
    göre gerekli %25 eşiğini sağlamaktadır. VUK md. 267’ye göre emsal bedel toplamı kaç TL’dir?
  secenekler:
    A: 40.000 TL
    B: 41.000 TL
    C: 42.000 TL
    D: 43.000 TL
    E: 44.000 TL
  dogru: D
  aciklama:
    dogru_neden: Birinci sıra olan ortalama fiyat esasında, ilgili aylardaki satışların toplam tutarı toplam satış miktarına
      bölünür. Üç ayın toplam satış tutarı 43.000 TL, toplam miktarı 40 adettir; birim emsal bedel 1.075 TL, 40 adet için
      toplam 43.000 TL’dir.
    celdiriciler:
      A: Toplam satış tutarı zaten 43.000 TL’dir; 40.000 TL eksik hesaplamadır.
      B: 41.000 TL üç ay satış toplamı değildir.
      C: 42.000 TL satışların toplam tutarı değildir.
      E: 44.000 TL, kaynak verilerden çıkan bir toplam değildir.
    hesap_adimlari:
    - 'Değerleme ayı satış tutarı: 12.000 TL.'
    - 'Önceki ay satış tutarı: 20.000 TL.'
    - 'İki ay önce satış tutarı: 11.000 TL.'
    - 'Toplam satış tutarı: 43.000 TL; toplam miktar: 40 adet.'
    - 'Ortalama birim fiyat: 43.000 / 40 = 1.075 TL.'
    - '40 adet için emsal bedel: 40 × 1.075 = 43.000 TL.'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 267/1
    alinti: '         Birinci sıra: (Ortalama fiyat esası) aynı cins ve nevideki mallardan sıra ile

      değerlemenin yapılacağı ayda veya bir evvelki veya bir daha evvelki aylarda satış yapılmışsa,

      emsal bedeli bu satışların miktar ve tutarına göre mükellef tarafından çıkarılacak olan

      "Ortalama satış fiyatı" ile hesaplanır. Bu esasın uygulanması için, aylık satış miktarının, emsal

      bedeli tayin olunacak her bir malın miktarına nazaran % 25 ten az olmaması şarttır.'
