  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: izaha davet
  tip: kavrama
  zorluk: 2
  kok: Vergi incelemesine başlanılmadan önce yapılan ön tespit üzerine mükellefe izaha davet yazısı 4 Ağustos 2026'da tebliğ
    edilmiştir. Mükellef, davet konusu tespitle sınırlı izahını 20 Ağustos'ta vermiş; idare izahı yeterli bulmamıştır. Değerlendirme
    yazısı 10 Eylül'de tebliğ edilmiştir. VUK md. 370'e göre mükellefin bundan sonraki düzeltme ve ödeme işlemleri için temel
    süre aşağıdakilerden hangisidir?
  secenekler:
    A: Değerlendirme yazısının tebliğinden itibaren 15 gün.
    B: İzaha davet yazısının tebliğinden itibaren 15 gün.
    C: Değerlendirme yazısının tebliğinden itibaren 30 gün.
    D: İzaha davet yazısının tebliğinden itibaren 30 gün.
    E: İzaha davet süreci sonunda ayrıca süre verilmez.
  dogru: C
  aciklama:
    dogru_neden: VUK md. 370/2, izahın yeterli bulunmaması hâlinde değerlendirme sonucunu içeren yazının tebliğ edildiği tarihten
      itibaren otuz gün içinde beyannamenin verilmesi/düzeltilmesi ve ödeme süresi geçmiş vergilerin ödenmesi sürecini düzenler.
      Bu nedenle başlangıç tarihi 10 Eylül, süre 30 gündür.
    celdiriciler:
      A: Kanundaki süre 30 gündür, 15 gün değildir.
      B: İlk 30 günlük süre izaha davet yazısından itibaren izah için kullanılır; burada sorulan sonraki düzeltme süresi değerlendirme
        yazısından başlar.
      D: 30 günlük süre bu aşamada izaha davet yazısından değil değerlendirme sonucundan başlar.
      E: Md. 370/2, yeterli bulunmayan izah sonrasında açıkça 30 günlük bir süre öngörür.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/2
