- id: SMMM-VER-VUK-0044
  sinav: smmm
  bolum:
  - YET
  ders: VER
  unite: Vergi usul
  konu: VUK
  kazanim: vergi ziyaı ve kaçakçılık
  tip: bilgi
  zorluk: 1
  kok: 'Bir mükellefin 2026 yılında vergi ziyaına neden olan üç ayrı fiili vardır: I. Vergi Usul Kanunu''ndaki ödevin eksik
    yerine getirilmesi nedeniyle 100.000 TL vergi ziyaı, II. muhteviyatı itibarıyla yanıltıcı belge kullanılması nedeniyle
    100.000 TL vergi ziyaı, III. II numaralı fiile iştirak eden kişinin 100.000 TL vergi ziyaına katkısı. VUK md. 344''e göre
    hangi öncül doğrudur?'
  secenekler:
    A: I için 100.000 TL, II için 300.000 TL, III için 100.000 TL vergi ziyaı cezası uygulanır.
    B: I, II ve III için ayrı ayrı 300.000 TL ceza uygulanır.
    C: I ve II için 100.000 TL, III için 300.000 TL uygulanır.
    D: I için 50.000 TL, II için 300.000 TL, III için 50.000 TL uygulanır.
    E: Üçünün de cezası 100.000 TL'dir.
  dogru: A
  aciklama:
    dogru_neden: VUK md. 344'te genel vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır; 359 uncu maddede yazılı fiillerle
      sebebiyet verilirse üç kat, bu fiillere iştirak edenlere ise bir kat uygulanır. Bu nedenle I 100.000 TL, II 300.000
      TL ve III 100.000 TL'dir.
    celdiriciler:
      B: 359 fiili işleyen mükellef için üç kat, iştirak eden için ise bir kat uygulanır; üçü de üç kat değildir.
      C: II için üç kat uygulanması gerekir; I genel bir kat, III iştirak eden için bir kattır.
      D: '%50 oranı, kanuni süresinden sonra verilen bazı beyannameler için özel kuraldır; I-III olaylarına bu şekilde uygulanmaz.'
      E: II numaralı fiil 359 kapsamındaysa ceza bir kat değil üç kattır.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında ziyaa
      uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir. Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet
      verilmesi halinde bu ceza üç kat, bu fiillere iştirak edenlere ise bir kat olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/a-2
    alinti: Defter, kayıt ve belgeleri tahrif edenler veya gizleyenler veya muhteviyatı itibariyle yanıltıcı belge düzenleyenler
      veya bu belgeleri kullananlar,
