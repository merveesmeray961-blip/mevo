- id: SMMM-VER-VUK-0001
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: VUK
  kazanim: Tarh zamanaşımı ve takdir komisyonuna başvurunun zamanaşımını durdurması
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Ticari kazanç sahibi Bay (T)''nin 2020 takvim yılına ait gelir vergisi alacağı 2020 yılında doğmuştur. Vergi
    dairesi, zamanaşımı süresinin dolmasına üç ay kala, 1 Ekim 2025 tarihinde matrah takdiri için takdir komisyonuna
    başvurmuştur. Takdir komisyonu kararı 30 Kasım 2026 tarihinde vergi dairesine tevdi edilmiştir.

    213 sayılı Vergi Usul Kanunu''na göre bu vergi en geç hangi tarihe kadar tarh edilip mükellefe tebliğ edilmelidir?'
  secenekler:
    A: 31.12.2025
    B: 01.10.2026
    C: 31.12.2026
    D: 28.02.2027
    E: 31.12.2030
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 114/1''e göre 2020''de doğan vergi alacağı için zamanaşımı 1.1.2021''de başlar ve normalde
      31.12.2025''te dolar. Md. 114/2 uyarınca takdir komisyonuna başvuru zamanaşımını durdurur; duran zamanaşımı
      kararın tevdiini izleyen günden itibaren kaldığı yerden işler, ancak işlemeyen süre her hâlükârda bir yılı
      aşamaz. Komisyon kararı başvurudan yaklaşık 14 ay sonra (1.10.2025 – 30.11.2026) tevdi edildiğinden işlemeyen
      süre bir yılla sınırlıdır: durma 1.10.2025''te başlar ve 1.10.2026''da biter. İşlemeyen süre en fazla bir
      yıl olduğundan zamanaşımının normal bitiş tarihi bir yıl ertelenir: 31.12.2025 + 1 yıl = 31.12.2026. Karar
      bir yıllık sınırdan sonra (30.11.2026) tevdi edildiğinden zamanaşımı 1.10.2026''da kaldığı yerden kendiliğinden
      işlemeye başlamıştır; tevdi tarihi sonucu değiştirmez.'
    celdiriciler:
      A: Takdir komisyonuna başvurunun durdurucu etkisi dikkate alınmamıştır (md. 114/2).
      B: Bir yıllık durma süresinin sona erdiği tarihtir; zamanaşımının normal bitiş tarihine (31.12.2025) durmanın
        bir yıllık üst sınırı eklenmemiştir.
      D: Bir yıllık üst sınır göz ardı edilip kalan üç aylık süre kararın tevdiinden sonra işletilmiştir (30.11.2026
        + 3 ay = 28.02.2027); md. 114/2 işlemeyen sürenin bir yılı aşamayacağını öngörür.
      E: Başvuru zamanaşımını kesen bir işlem gibi değerlendirilip süre yeniden başlatılmıştır; md. 114/2 kesilme
        değil durma öngörür.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114/1
    alinti: Vergi alacağının doğduğu takvim yılını takip eden yılın başından başlıyarak beş yıl içinde tarh ve mükellefe
      tebliğ edilmiyen vergiler zamanaşımına uğrar.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114/2
    alinti: Şu kadar ki, vergi dairesince matrah takdiri için takdir komisyonuna başvurulması, zamanaşımını durdurur.
      Duran zamanaşımı mezkûr komisyon kararının vergi dairesine tevdiini takip eden günden itibaren kaldığı yerden
      işlemeye devam eder. Ancak işlemeyen süre her hâl ve takdirde bir yıldan fazla olamaz.
  gecerlilik:
    baslangic: '2010-08-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: dogru_neden'deki '18 ay sonra' ifadesi 'yaklaşık 18,5 ay sonra (1.10.2025 – 15.4.2027)' olarak düzeltildi
      ve durma süresinin başlangıç/bitiş tarihleri yazıldı; gecerlilik.baslangic 2026-01-01 → 2010-08-01 (md. 114/2'yi
      yeniden düzenleyen 6009 s. K.'nin yayımı).
    neden: 'G5 (küçük): 1.10.2025 – 15.4.2027 arası 18 değil yaklaşık 18,5 aydır; §3 başlangıç tarihi.'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: Komisyon kararının tevdi tarihi 15 Nisan 2027'den 30 Kasım 2026'ya çekildi (zamanaşımı dolduktan sonra gelen
      karar soruyu boşa düşürüyordu); D şıkkı 15.07.2027'den 28.02.2027'ye güncellendi; gerekçe '31.12.2025 + 1
      yıl = 31.12.2026' biçiminde yeniden yazıldı. Doğru cevap (C 31.12.2026) değişmedi.
    neden: 'Bağımsız hakem bulgusu (3 Ekim 2026, no. 18): tevdi tarihi zamanaşımından sonraydı; ''kalan üç ay''
      ifadesi ay esasıyla 1.1.2027 de verebiliyordu.'
  - tarih: '2026-10-04'
    kim: hakem
    ne: 'dogru_neden''in son cümlesi netleştirildi: karar bir yıllık sınırdan sonra tevdi edildiğinden zamanaşımı
      1.10.2026''da yeniden işlemeye başlar.'
    neden: 'hakem 2026-10-04: ''Karar bu tarihten önce tevdi edilmiş olsa da'' cümlesi belirsizdi.'
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
      G3:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'tek kör çözücü (bütçe nedeniyle): C (güven 4)'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: Yeni tevdi 30.11.2026 zamanaşımından (31.12.2026) önce; 1 yıllık sınırla C tek cevap; D = 30.11.2026
          + 3 ay = 28.02.2027 tutarlı. Hakem: tevdi tarihi cümlesi netleştirildi.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: VUK md. 114/1-2 alıntıları birebir.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-04'
        not: ortalama aday yanlış (D, güven 2)
- id: SMMM-VER-VUK-0002
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: VUK
  kazanim: Vergi ziyaı cezası, ıttıla dışı faaliyette artırım ve md. 376 indirimi
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Vergi kanunlarına göre mükellefiyet tesis ettirmesi gerektiği hâlde bu zorunluluğa uymayan ve vergi dairesinin
    ıttılaı dışında ticari faaliyette bulunan Bay (R) adına, 2025 takvim yılına ait faaliyeti nedeniyle 2026 yılında
    400.000 TL gelir vergisi resen tarh edilmiş ve vergi ziyaı cezası kesilmiştir. Vergi ziyaına 213 sayılı Vergi
    Usul Kanunu''nun 359. maddesinde yazılı fiillerle sebebiyet verilmemiştir.

    Bay (R), ihbarnamenin tebliğinden itibaren otuz gün içinde vergi dairesine başvurarak vergiyi ve indirimli cezayı
    vadesinde ödeyeceğini bildirmiş ve vadesinde ödemiştir. Dava açmamıştır.

    Buna göre Bay (R)''nin ödeyeceği vergi ziyaı cezası kaç TL''dir?'
  secenekler:
    A: '200.000'
    B: '300.000'
    C: '400.000'
    D: '600.000'
    E: '900.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 344/1''e göre vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır (400.000 TL). Md.
      344''e 7524 sayılı Kanunla eklenen fıkraya göre mükellefiyet tesis ettirilmeksizin vergi dairesinin ıttılaı
      dışında ticari faaliyette bulunularak vergi ziyaına sebebiyet verilmesi hâlinde ceza %50 artırılır: 400.000
      × 1,5 = 600.000 TL. Md. 376/1 uyarınca otuz gün içinde başvurup vadesinde ödeyen mükellefin cezasının yarısı
      indirilir: 600.000 × %50 = 300.000 TL.


      Püf noktaları: md. 344/1, md. 344''e 7524 sayılı Kanunla eklenen fıkra ve md. 376/1 birlikte uygulanır; sıra
      önemlidir: önce %50 artırım, sonra indirim. Tuzaklar: md. 376 indirimini artırımdan önceki temel cezaya uygulamak
      ya da %50 artırımı unutmak; indirim, "kesilen cezanın yarısı" olarak artırılmış cezaya uygulanır.'
    celdiriciler:
      A: '%50 artırım uygulanmadan indirim yapılmıştır (400.000 × %50); ıttıla dışı faaliyet nedeniyle ceza önce
        %50 artırılır.'
      C: Ne %50 artırım ne de md. 376 indirimi uygulanmıştır; yalnız bir kat ceza hesaplanmıştır.
      D: Artırılmış ceza bulunmuş, ancak md. 376/1'deki yarı oranındaki indirim uygulanmamıştır.
      E: Ceza üç kat esas alınmıştır (400.000 × 3 × 1,5 × ½ = 900.000); üç kat ceza yalnız 359. maddedeki fiillerle
        vergi ziyaına sebebiyet verilmesi hâlinde uygulanır.
    hesap_adimlari:
    - 'Temel ceza (md. 344/1): 400.000 × 1 = 400.000 TL'
    - 'Ittıla dışı faaliyet artırımı (%50): 400.000 × 1,5 = 600.000 TL'
    - 'Md. 376/1 indirimi (yarısı): 600.000 × %50 = 300.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1-2
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında
      ziyaa uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir. Vergi ziyaına 359 uncu maddede yazılı
      fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak edenlere ise bir kat olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344 (7524 ile eklenen fıkra)
    alinti: Vergi kanunlarına göre mükellefiyet tesis ettirilmesi gerektiği halde bu zorunluluğa uyulmaksızın vergi
      dairesinin ıttılaı dışında ticari, zirai veya mesleki faaliyette bulunmak suretiyle vergi ziyaına sebebiyet
      verilmesi durumunda, birinci, ikinci ve üçüncü fıkralara göre kesilecek vergi ziyaı cezası yüzde elli artırılarak
      uygulanır. Aynı vergi türü ve dönemine ilişkin daha sonra yapılacak tarhiyatlar nedeniyle kesilecek vergi
      ziyaı cezalarına da aynı artırım hükmü tatbik edilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 376/1
    alinti: 1. İkmalen, resen veya idarece tarh edilen vergiyi veya vergi farkını ve vergi ziyaı, usulsüzlük ve
      özel usulsüzlük cezalarının yarısını ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi
      dairesine başvurarak vadesinde veya 6183 sayılı Kanunda belirtilen türden teminat göstererek vadenin bitmesinden
      itibaren üç ay içinde ödeyeceğini bildirirse kesilen cezanın yarısı,
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 3
  gecmis:
  - tarih: '2026-10-03'
    kim: rotus
    ne: 'dogru_neden''e kullanılan zor soru teknikleri ve tuzak eklendi; md. 344 ek fıkra alıntısına fıkranın son
      cümlesi eklendi; gecerlilik.baslangic 2026-01-01 → 2024-08-02 (7524 s. K.''nin yayımı: md. 344 ek fıkra ve
      376/1-2''nin mülgası).'
    neden: 'G5 (küçük): teknikler ve tuzak adlandırılmamıştı; G6 (küçük): alıntı fıkranın son cümlesini içermiyordu;
      §3 başlangıç tarihi. Zorluk 3 korundu: GZ''de ortalama aday yüksek güvenle yanıldı (güven 4).'
  - tarih: '2026-10-04'
    kim: duzeltici
    ne: E çeldiricisine hesap yolu açıkça yazıldı (400.000 × 3 × 1,5 × ½ = 900.000); teknik not 'Püf noktaları:'
      biçimine getirildi.
    neden: Bağımsız hakem bulgusu (3 Ekim 2026, no. 19).
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-04'
      G4:
        sonuc: gecti
        tarih: '2026-10-04'
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-04'
      G3:
        sonuc: gecti
        not: 'A: B (güven 5); B: B (güven 4)'
        tarih: '2026-10-03'
      G5:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: E çeldirici hesabı 400.000×3×1,5×½ = 900.000 doğru; B 300.000 tek cevap.'
      G6:
        sonuc: gecti
        tarih: '2026-10-04'
        not: 'hakem: Kaynak alıntıları değişmedi; açıklamadaki iddialar mevcut alıntılarla destekli.'
      GZ:
        sonuc: gecti
        tarih: '2026-10-03'
        not: ortalama aday doğru (güven 2)
  dogrulama:
    python: 'vergi = 400000

      ceza = vergi * 1 * 150 / 100

      sonuc = ceza / 2'
