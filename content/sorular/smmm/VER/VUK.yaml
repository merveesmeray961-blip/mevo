- id: SMMM-VER-VUK-0001
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: VUK
  kazanim: Tarh zamanaşımı ve takdir komisyonuna başvurunun zamanaşımını durdurması
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: 'Ticari kazanç sahibi Bay (T)''nin 2020 takvim yılına ait gelir vergisi alacağı 2020 yılında doğmuştur. Vergi
    dairesi, zamanaşımı süresinin dolmasına üç ay kala, 1 Ekim 2025 tarihinde matrah takdiri için takdir komisyonuna
    başvurmuştur. Takdir komisyonu kararı 15 Nisan 2027 tarihinde vergi dairesine tevdi edilmiştir.

    213 sayılı Vergi Usul Kanunu''na göre bu vergi en geç hangi tarihe kadar tarh edilip mükellefe tebliğ edilmelidir?'
  secenekler:
    A: 31.12.2025
    B: 01.10.2026
    C: 31.12.2026
    D: 15.07.2027
    E: 31.12.2030
  dogru: C
  aciklama:
    dogru_neden: VUK md. 114/1'e göre 2020'de doğan vergi alacağı için zamanaşımı 1.1.2021'de başlar ve normalde
      31.12.2025'te dolar. Md. 114/2 uyarınca takdir komisyonuna başvuru zamanaşımını durdurur; duran zamanaşımı
      kararın tevdiini izleyen günden itibaren kaldığı yerden işler, ancak işlemeyen süre her hâlükârda bir yılı
      aşamaz. Komisyon kararı 18 ay sonra tevdi edildiğinden durma süresi bir yıl ile sınırlıdır; zamanaşımı süresi
      bir yıl uzayarak 31.12.2026'da dolar.
    celdiriciler:
      A: Takdir komisyonuna başvurunun durdurucu etkisi dikkate alınmamıştır (md. 114/2).
      B: Bir yıllık durma süresinin sona erdiği tarihtir; zamanaşımı bu tarihten sonra kalan üç aylık süre kadar
        daha işler.
      D: Bir yıllık üst sınır göz ardı edilip kalan üç aylık süre tevdiden sonra işletilmiştir; md. 114/2 işlemeyen
        sürenin bir yılı aşamayacağını öngörür.
      E: Başvuru zamanaşımını kesen bir işlem gibi değerlendirilip süre yeniden başlatılmıştır; md. 114/2 kesilme
        değil durma öngörür.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114/1, 2
    alinti: Vergi alacağının doğduğu takvim yılını takip eden yılın başından başlıyarak beş yıl içinde tarh ve mükellefe
      tebliğ edilmiyen vergiler zamanaşımına uğrar.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 114/2
    alinti: Şu kadar ki, vergi dairesince matrah takdiri için takdir komisyonuna başvurulması, zamanaşımını durdurur.
      Duran zamanaşımı mezkûr komisyon kararının vergi dairesine tevdiini takip eden günden itibaren kaldığı yerden
      işlemeye devam eder. Ancak işlemeyen süre her hâl ve takdirde bir yıldan fazla olamaz.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
- id: SMMM-VER-VUK-0002
  sinav: smmm
  bolum:
  - YET
  ders: VER
  konu: VUK
  kazanim: Vergi ziyaı cezası, ıttıla dışı faaliyette artırım ve md. 376 indirimi
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Vergi kanunlarına göre mükellefiyet tesis ettirmesi gerektiği hâlde bu zorunluluğa uymayan ve vergi dairesinin
    ıttılaı dışında ticari faaliyette bulunan Bay (R) adına, 2025 takvim yılına ait faaliyeti nedeniyle 2026 yılında
    400.000 TL gelir vergisi resen tarh edilmiş ve vergi ziyaı cezası kesilmiştir. Vergi ziyaına 213 sayılı Vergi
    Usul Kanunu''nun 359. maddesinde yazılı fiillerle sebebiyet verilmemiştir.

    Bay (R), ihbarnamenin tebliğinden itibaren otuz gün içinde vergi dairesine başvurarak vergiyi ve indirimli cezayı
    vadesinde ödeyeceğini bildirmiş ve vadesinde ödemiştir. Dava açmamıştır.

    Buna göre Bay (R)''nin ödeyeceği vergi ziyaı cezası kaç TL''dir?'
  secenekler:
    A: '200.000'
    B: '300.000'
    C: '400.000'
    D: '600.000'
    E: '900.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 344/1''e göre vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır (400.000 TL). Md.
      344''e 7524 sayılı Kanunla eklenen fıkraya göre mükellefiyet tesis ettirilmeksizin vergi dairesinin ıttılaı
      dışında ticari faaliyette bulunularak vergi ziyaına sebebiyet verilmesi hâlinde ceza %50 artırılır: 400.000
      × 1,5 = 600.000 TL. Md. 376/1 uyarınca otuz gün içinde başvurup vadesinde ödeyen mükellefin cezasının yarısı
      indirilir: 600.000 × %50 = 300.000 TL.'
    celdiriciler:
      A: '%50 artırım uygulanmadan indirim yapılmıştır (400.000 × %50); ıttıla dışı faaliyet nedeniyle ceza önce
        %50 artırılır.'
      C: Ne %50 artırım ne de md. 376 indirimi uygulanmıştır; yalnız bir kat ceza hesaplanmıştır.
      D: Artırılmış ceza bulunmuş, ancak md. 376/1'deki yarı oranındaki indirim uygulanmamıştır.
      E: Ceza üç kat esas alınmıştır; üç kat ceza yalnız 359. maddedeki fiillerle vergi ziyaına sebebiyet verilmesi
        hâlinde uygulanır.
    hesap_adimlari:
    - 'Temel ceza (md. 344/1): 400.000 × 1 = 400.000 TL'
    - 'Ittıla dışı faaliyet artırımı (%50): 400.000 × 1,5 = 600.000 TL'
    - 'Md. 376/1 indirimi (yarısı): 600.000 × %50 = 300.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1, 2
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında
      ziyaa uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir. Vergi ziyaına 359 uncu maddede yazılı
      fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak edenlere ise bir kat olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344 (7524 ile eklenen fıkra)
    alinti: Vergi kanunlarına göre mükellefiyet tesis ettirilmesi gerektiği halde bu zorunluluğa uyulmaksızın vergi
      dairesinin ıttılaı dışında ticari, zirai veya mesleki faaliyette bulunmak suretiyle vergi ziyaına sebebiyet
      verilmesi durumunda, birinci, ikinci ve üçüncü fıkralara göre kesilecek vergi ziyaı cezası yüzde elli artırılarak
      uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 376/1
    alinti: 1. İkmalen, resen veya idarece tarh edilen vergiyi veya vergi farkını ve vergi ziyaı, usulsüzlük ve
      özel usulsüzlük cezalarının yarısını ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi
      dairesine başvurarak vadesinde veya 6183 sayılı Kanunda belirtilen türden teminat göstererek vadenin bitmesinden
      itibaren üç ay içinde ödeyeceğini bildirirse kesilen cezanın yarısı,
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude
    istem_surumu: uretim.md v1
  dogrulama:
    python: 'vergi = 400000

      ceza = vergi * 1 * 150 / 100

      sonuc = ceza / 2'
