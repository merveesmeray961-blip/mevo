- id: YMM-DRM-BDS-0042
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 3
  kok: 'Bağımsız denetçinin üç ayrı şirketin denetiminde işletmenin sürekliliğine ilişkin ulaştığı sonuçlar şunlardır:

    (X) Finansal tablolar işletmenin sürekliliği esasına göre hazırlanmıştır; ancak denetçinin yargısına göre bu esasın kullanılması
    uygun değildir.

    (Y) Süreklilik esasının kullanılması uygundur; önemli bir belirsizlik mevcuttur ve bu belirsizlik finansal tablolarda
    yeterince açıklanmıştır.

    (Z) Ciddi şüphe oluşturabilecek olay ve şartlar belirlenmiş, ancak elde edilen kanıtlara göre önemli bir belirsizlik bulunmadığı
    sonucuna varılmıştır; bu olay ve şartlara ilişkin açıklamalar yeterlidir.

    BDS 570 uyarınca raporlama sonuçlarının doğru eşleştirildiği seçenek hangisidir?'
  secenekler:
    A: 'X: Görüş vermekten kaçınma — Y: Olumlu görüş ve Dikkat Çekilen Hususlar paragrafı — Z: Olumlu görüş'
    B: 'X: Olumsuz görüş — Y: Sınırlı olumlu görüş — Z: Olumlu görüş ve önemli belirsizlik bölümü'
    C: 'X: Olumsuz görüş — Y: Olumlu görüş ve Dikkat Çekilen Hususlar paragrafı — Z: Olumlu görüş'
    D: 'X: Olumsuz görüş — Y: Olumlu görüş ve önemli belirsizlik bölümü — Z: Olumlu görüş'
    E: 'X: Sınırlı olumlu görüş — Y: Olumlu görüş ve önemli belirsizlik bölümü — Z: Olumlu görüş'
  dogru: D
  aciklama:
    dogru_neden: 'X: BDS 570 par. 21''e göre finansal tablolar süreklilik esasına göre hazırlanmış, ancak bu esasın kullanılması
      uygun değilse denetçi olumsuz görüş verir. Y: Par. 22''ye göre önemli belirsizlik yeterince açıklanmışsa denetçi olumlu
      görüş verir ve raporda “İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik” başlıklı ayrı bir bölüme yer verir. Z:
      Önemli belirsizlik bulunmadığı için ayrı bölüm gerekmez; par. 20 uyarınca açıklamaların yeterliliği değerlendirilir,
      açıklamalar yeterli olduğundan olumlu görüş verilir. Püf noktaları: Önemli belirsizlik yeterince açıklanmışsa bu, Dikkat
      Çekilen Hususlar paragrafıyla değil, kendine özgü başlıklı ayrı bölümle raporlanır. Olay ve şart bulunması ile önemli
      belirsizlik bulunması aynı şey değildir; ayrı bölüm yalnız ikincisinde gerekir.'
    celdiriciler:
      A: Süreklilik esasının kullanılmasının uygun olmaması kanıt eksikliği değil, önemli ve yaygın bir yanlışlıktır; par.
        21 olumsuz görüşü öngörür. Y için de Dikkat Çekilen Hususlar paragrafı değil, ayrı önemli belirsizlik bölümü kullanılır.
      B: Y'de açıklama yeterli olduğundan görüş değiştirilmez; sınırlı olumlu görüş, açıklamanın yetersiz olduğu durum için
        (par. 23) söz konusudur. Z'de önemli belirsizlik bulunmadığından bu bölüme yer verilmez.
      C: X ve Z doğru eşleştirilmiştir; ancak Y'deki yeterince açıklanmış önemli belirsizlik, par. 22 uyarınca “İşletmenin
        Sürekliliğiyle İlgili Önemli Belirsizlik” başlıklı ayrı bölümle raporlanır.
      E: Par. 21, süreklilik esasının uygun olmaması durumunda sınırlı olumlu görüş değil, olumsuz görüş verilmesini öngörür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 21
    alinti: Finansal tabloların işletmenin sürekliliği esasına göre hazırlanmış olması ancak yönetimin işletmenin sürekliliği
      esasını kullanmasının denetçinin yargısına göre uygun olmaması durumunda denetçi olumsuz görüş verir
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 22
    alinti: Finansal tablolardaki önemli belirsizliğe ilişkin yeterli açıklamanın yapılması durumunda denetçi, olumlu görüş
      verir ve aşağıdaki amaçlarla denetçi raporunda … Sürekliliğiyle İlgili Önemli Belirsizlik” başlığı altında ayrı bir
      bölüme yer verir
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 20
    alinti: elde ettiği denetim kanıtlarına dayanarak önemli belirsizliğin mevcut olmadığı sonucuna varması hâlinde denetçi,
