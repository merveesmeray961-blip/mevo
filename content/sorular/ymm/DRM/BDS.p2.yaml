- id: YMM-DRM-BDS-0041
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Batı Enerji A.Ş.nin denetiminde iki konuda şu sonuçlara ulaşmıştır:

    (1) İşletmenin tek hasılat kaynağı, uzun süreli sözleşmeyle kiraya verdiği tek bir binadan elde ettiği sabit kira geliridir.
    Denetçi, hasılatın finansal tablolara alınmasında hile riski bulunduğu varsayımının bu denetimde geçerli olmadığı sonucuna
    varmıştır.

    (2) Yönetimin hedef kâr baskısı nedeniyle stok değer düşüklüğü tahmininde hile kaynaklı önemli yanlışlık riski belirlemiştir.
    Denetçi bu riske, kontrollere güvenmeksizin yalnızca maddi doğrulama prosedürleriyle karşılık vermeyi planlamaktadır.

    BDS 240 ve BDS 330 birlikte dikkate alındığında aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: (1)'deki varsayım hiçbir koşulda çürütülemeyeceğinden kira hasılatı ciddi risk olarak ele alınmalı; (2)'de analitik
      prosedürler yeterlidir.
    B: (1)'de gerekçelerin belgelenmesi gerekmez; (2)'deki risk, kontrollere güvenilmeyeceği için ciddi risk olarak ele alınmaz.
    C: (1)'de varsayımın geçersizliğinin gerekçeleri çalışma kâğıtlarına alınır; (2)'deki risk ciddi risktir ve prosedürler
      detay testi içerir.
    D: (1)'de gerekçeler yalnızca üst yönetimden sorumlu olanlara yazılı bildirilir; (2)'deki risk ciddi risk sayılır ve analitik
      prosedürler yeterlidir.
    E: (1)'de gerekçeler belgelenir; (2)'deki risk ciddi risk sayılır, ancak kontroller önceki yıl test edildiyse yalnız analitik
      prosedürler yeterlidir.
  dogru: C
  aciklama:
    dogru_neden: '(1) BDS 240 A31''e göre hasılatta hile riski varsayımının aksi ispat edilebilir; tek bir mülkten elde edilen
      kira hasılatı bunun örneğidir. Par. 48''e göre denetçi bu sonuca vardığında gerekçelerini çalışma kâğıtlarına dâhil
      eder. (2) Par. 28''e göre hile kaynaklı önemli yanlışlık riski “ciddi risk” olarak ele alınır; BDS 330 par. 21''e göre
      ciddi riske yalnızca maddi doğrulama prosedürleriyle karşılık verilecekse bu prosedürler detay testlerini de içerir.
      Püf noktaları: Hasılat karinesi çürütülebilir bir varsayımdır ama çürütülmesi belgelendirme yükü doğurur. Hile riski
      kontrollere güvenilip güvenilmemesinden bağımsız olarak ciddi risktir; yalnız maddi doğrulamayla yanıt verilecekse analitik
      prosedür tek başına yetmez, detay testi şarttır.'
    celdiriciler:
      A: A31 varsayımın aksinin ispat edilebileceğini açıkça belirtir; ayrıca ciddi riske yalnız maddi doğrulamayla yanıt
        verilirken detay testi zorunludur.
      B: Par. 48 gerekçelerin belgelenmesini zorunlu kılar; par. 28'e göre hile kaynaklı risk, denetim yaklaşımından bağımsız
        olarak ciddi risk olarak ele alınır.
      D: Par. 48'deki yükümlülük çalışma kâğıtlarına dâhil etmedir; ayrıca BDS 330 par. 21 uyarınca analitik prosedürler tek
        başına yeterli değildir.
      E: Senaryoda kontrollere güvenilmemektedir; yalnız maddi doğrulama yapılacaksa par. 21 gereği detay testi şarttır. Kaldı
        ki ciddi riske ilişkin kontrollere güvenilecekse bunlar par. 15 gereği cari dönemde test edilir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 28, par. 48, A31
    alinti: Denetçi, hile kaynaklı “önemli yanlışlık” riski olarak değerlendirdiği riskleri “ciddi riskler” olarak ele alır
      … bulunduğu varsayımının yürütülen denetimde geçerli olmadığı sonucuna ulaşması hâlinde denetçi, bunun gerekçelerini
      çalışma kâğıtlarına dâhil eder. … Kiraya verilen tek bir mülkten elde edilen kira hasılatı bu duruma örnek olarak verilebilir.
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 21
    alinti: Ciddi riske karşı yalnızca maddi doğrulama prosedürlerinin uygulanacak olması hâlinde, bu prosedürler detay testlerini
      de içerir
