- id: YMM-DRM-BDS-0040
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Doğu Lojistik A.Ş.nin 2025 yılı denetimi için aşağıdaki planlamayı yapmıştır:

    I. Yakıt alımlarındaki onay kontrolü 2024 denetiminde test edilmiştir. 2025''te bu kontrolde değişiklik olmadığı yalnızca
    muhasebe müdürünün sorgulanmasıyla teyit edilmiş ve kontrol yeniden test edilmeden 2024 kanıtına güvenilecektir.

    II. Ciddi risk olarak belirlenen hakediş hasılatına ilişkin kontrollere güvenilecektir; bu kontroller 2024''te test edildiği
    ve değişmediği için 2025''te yeniden test edilmeyecektir.

    III. Ticari alacaklara uygulanan maddi doğrulama prosedürlerinde yanlışlık bulunmazsa, alacaklarla ilgili kontrollerin
    etkin işlediği sonucuna varılacaktır.

    IV. Önemli yanlışlık riski düşük değerlendirilen, ancak tutarı önemli olan peşin ödenmiş giderler bakiyesine de maddi
    doğrulama prosedürü uygulanacaktır.

    V. Bordro onay kontrolü 2023''te test edilmiş; 2024 ve 2025''te değişiklik olmadığı sorgulamayla birlikte belge tetkikiyle
    doğrulanarak önceki kanıta güvenilmiş, kontrolün 2026''da yeniden test edilmesi planlanmıştır. Bazı diğer kontroller ise
    her yıl test edilmektedir.

    Bu planlama unsurlarından hangileri BDS 330 ile uyumludur?'
  secenekler:
    A: Yalnız IV
    B: I ve IV
    C: III ve V
    D: I, IV ve V
    E: IV ve V
  dogru: E
  aciklama:
    dogru_neden: 'IV: BDS 330 par. 18''e göre denetçi, değerlendirilen riskten bağımsız olarak her önemli işlem sınıfı, hesap
      bakiyesi ve açıklama için maddi doğrulama prosedürü uygular. V: Par. 14''e göre değişiklik olmadığına ilişkin kanıt
      sorgulamayla birlikte gözlem veya tetkikle elde edilmişse önceki kanıt kullanılabilir; kontrol en az her üç denetimden
      birinde test edilir (2023 testi 2023-2024-2025 denetimlerini karşılar, 2026''da yeniden test gerekir) ve bazı kontroller
      her denetimde test edilir. Püf noktaları: Önceki yıl kanıtına güvenmek için “değişiklik yok” bilgisinin yalnız sorgulamayla
      değil, gözlem veya tetkikle desteklenmesi gerekir; ciddi riske yönelik kontrollerde ise önceki yıl kanıtı hiç kullanılamaz,
      mutlaka cari dönemde test edilir. Maddi doğrulamada hata çıkmaması kontrolün etkinliğini kanıtlamaz.'
    celdiriciler:
      A: 'V de uyumludur: önceki kanıt, değişikliğin olmadığı sorgulama ve tetkikle doğrulanarak ve üç denetimde bir test
        kuralına uyularak kullanılmıştır.'
      B: 'I uyumlu değildir: par. 14 değişiklik olmadığına ilişkin kanıtın sorgulamayla birlikte gözlem veya tetkik yapılarak
        elde edilmesini arar; yalnız sorgulama yetmez.'
      C: 'III uyumlu değildir: par. 16''ya göre maddi doğrulama prosedürleri sonucunda yanlışlık tespit edilmemesi, kontrollerin
        etkin olduğuna dair denetim kanıtı sağlamaz.'
      D: I'de yalnız sorgulamaya dayanıldığı için par. 14 karşılanmamıştır; ayrıca II'deki gibi ciddi riske ilişkin kontrollerde
        önceki yıl kanıtı par. 15 gereği hiç kullanılamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 14
    alinti: Denetçi, söz konusu belirli kontrollere ilişkin anlayışını doğrulamak amacıyla, sorgulamayla birlikte gözlem veya
      tetkik yaparak bu kanıtları elde eder … Bu tür değişikliklerin söz konusu olmaması durumunda denetçi, en az her üç denetimden
      birinde kontrolleri test eder.
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 15, 16
    alinti: Denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik güvenmek istiyorsa, bu kontrolleri cari dönemde test
      eder. … Ancak maddi doğrulama prosedürleri sonucunda yanlışlık tespit edilmemiş olması, test edilen yönetim beyanlarına
      ilişkin kontrollerin, etkin olduğuna dair denetim kanıtı sağlamaz
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 18
    alinti: Denetçi, “önemli yanlışlık” riski olarak değerlendirilen risklerden bağımsız olarak, her bir önemli işlem sınıfı,
      hesap bakiyesi ve açıklama için maddi doğrulama prosedürleri tasarlar ve uygular
