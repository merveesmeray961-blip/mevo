- id: YMM-DRM-BDS-0035
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 1
  kok: Finansal tablo tarihi 31.12.2025 olan Ayaz Kimya A.Ş.nin yönetimi, işletmenin sürekliliğini devam ettirme kabiliyetine
    ilişkin değerlendirmesini yalnızca 30.09.2026 tarihine kadar olan dönem için yapmıştır. Mevzuatta daha uzun bir değerlendirme
    dönemi öngörülmemiştir. BDS 570 “İşletmenin Sürekliliği” uyarınca denetçinin bu durumdaki yükümlülüğü aşağıdakilerden
    hangisidir?
  secenekler:
    A: Yönetimin değerlendirmede kullandığı dönemi aynen esas alır; dönemin uzunluğu yönetimin muhakemesine bırakılmıştır.
    B: Yönetimden değerlendirmeyi en az 31.12.2026 tarihine kadar olan dönemi kapsayacak şekilde genişletmesini talep eder.
    C: Yönetimden değerlendirmeyi denetçi raporu tarihinden itibaren en az on iki ayı kapsayacak şekilde genişletmesini talep
      eder.
    D: Değerlendirme dokuz ayı kapsadığından ek bir talepte bulunmaz; yalnızca sonraki döneme ilişkin bilgileri sorgular.
    E: Yönetimin değerlendirmesini dikkate almaksızın on iki aylık nakit akış tahminini bizzat hazırlar ve buna dayanır.
  dogru: B
  aciklama:
    dogru_neden: BDS 570 par. 13 uyarınca yönetimin değerlendirmesi finansal tablo tarihinden itibaren on iki aydan kısa bir
      dönemi kapsıyorsa denetçi, yönetimden değerlendirmeyi finansal tablo tarihinden itibaren en az on iki aylık dönemi kapsayacak
      şekilde genişletmesini talep eder. Finansal tablo tarihi 31.12.2025 olduğundan değerlendirme en az 31.12.2026 tarihine
      kadar uzatılmalıdır.
    celdiriciler:
      A: Yönetimin kullandığı dönemin dikkate alınması kuralı, bu dönemin on iki aydan kısa olmaması koşuluyla geçerlidir;
        dönem kısa ise denetçi genişletme talep eder.
      C: On iki aylık sürenin başlangıcı denetçi raporu tarihi değil, finansal tablo tarihidir.
      D: Yönetimin değerlendirdiği dönemden sonrası için sorgulama (par. 15) ayrı bir yükümlülüktür; on iki aydan kısa değerlendirmenin
        genişletilmesi talebinin yerine geçmez.
      E: Değerlendirmeyi yapmak yönetimin sorumluluğudur; denetçi yönetimin değerlendirmesini inceler, onun yerine kendi tahminini
        hazırlamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 13
    alinti: …tabloların tarihinden itibaren on iki aydan daha kısa bir süreyi kapsaması durumunda denetçi, yönetimden yaptığı
      değerlendirmeyi finansal tablo tarihinden itibaren en az on iki aylık dönemi kapsayacak şekilde genişletmesini talep
      eder
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi DRM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
