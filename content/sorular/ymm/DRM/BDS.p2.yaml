- id: YMM-DRM-BDS-0037
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: uygulama
  zorluk: 2
  kok: Denetçi, Ege Gıda A.Ş.nin finansal tablolar açısından önemli tutardaki stoklarının 31.12.2025 tarihli fiziki sayımına
    katılmayı planlamıştır. Sayım günü bölgede yaşanan ani sel nedeniyle depoya giden yollar kapanmış ve denetçi sayıma katılamamıştır;
    işletme sayımı kendi personeliyle yapmış ve sonuçları kayıtlara almıştır. Depoya birkaç gün içinde yeniden ulaşılabileceği
    anlaşılmaktadır. BDS 501 uyarınca denetçinin yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Sayıma katılımın mümkün olmadığı kabul edilerek doğrudan alternatif denetim prosedürlerine geçilir ve sonuç değerlendirilir.
    B: Kapsam sınırlaması doğduğundan, ek prosedür uygulanmadan sınırlı olumlu görüş verilir.
    C: Yönetimden sayım sonuçlarının doğruluğuna ilişkin yazılı beyan alınarak yetinilir.
    D: Stoklar önemli olmakla birlikte yaygın etkili olmadığından analitik prosedürlerle yetinilir.
    E: Bazı sayımlar başka bir tarihte yapılır veya gözlemlenir; aradaki işlemlere prosedür uygulanır.
  dogru: E
  aciklama:
    dogru_neden: BDS 501 par. 6'ya göre denetçi öngörülemeyen durumlardan dolayı fiziki stok sayımına katılamazsa bazı fiziki
      sayımları başka bir tarihte yapar veya gözlemler ve daha önceki sayım ile bu sayım arasında gerçekleşen işlemlere denetim
      prosedürlerini uygular. Sel, öngörülemeyen bir durumdur ve depoya kısa sürede yeniden ulaşılabilecektir; dolayısıyla
      katılım “mümkün olmayan” bir durum söz konusu değildir.
    celdiriciler:
      A: Alternatif prosedürler, katılımın hiç mümkün olmadığı durumlara ilişkin par. 7 yoludur; öngörülemeyen bir engel hâlinde
        önce par. 6'daki başka tarihte sayım yolu izlenir.
      B: Olumlu görüş dışında görüş, ancak yeterli ve uygun kanıt elde edilemezse gündeme gelir (par. 7, BDS 705); bu aşamada
        kanıt elde etme imkânı tükenmemiştir.
      C: Yazılı beyan, fiziki sayıma katılımla elde edilecek mevcudiyet ve durum kanıtının yerine geçmez.
      D: Stoklar önemli olduğunda par. 4 mümkün olan hâllerde fiziki sayıma katılımı zorunlu kılar; “yaygınlık” bu yükümlülüğün
        değil görüş türünün ölçütüdür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 501 Denetim Kanıtları - Seçilmiş Kalemlere İlişkin Özel Hususlar
    madde: par. 6
    alinti: Öngörülemeyen durumlardan dolayı fiziki stok sayımına katılamaması durumunda denetçi, bazı fiziki sayımları başka
      bir tarihte yapar veya gözlemler ve daha önceki sayım ile bu sayım arasında gerçekleşen işlemlere denetim prosedürlerini
      uygular.
  - mevzuat: BDS 501 Denetim Kanıtları - Seçilmiş Kalemlere İlişkin Özel Hususlar
    madde: par. 7
    alinti: Fiziki stok sayımına katılım mümkün değilse denetçi, stokların mevcudiyeti ve durumuyla ilgili yeterli ve uygun
      denetim kanıtı elde etmek için alternatif denetim prosedürleri uygular.
