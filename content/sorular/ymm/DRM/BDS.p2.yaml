- id: YMM-DRM-BDS-0039
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 2
  kok: Denetçi, Marmara Tekstil A.Ş.nin denetiminde, üst düzey yönetici konumundaki satış direktörünün talimatıyla kaydedilmiş
    ve önemlilik düzeyinin çok altında kalan fiktif bir masraf kaydı tespit etmiştir. Denetçinin, bu yanlışlığın hileden kaynaklandığına
    inanmasını gerektiren gerekçeleri vardır. BDS 240 uyarınca denetçinin bu durumdaki yaklaşımına ilişkin aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Hile risklerine ilişkin değerlendirmesini ve prosedürlerini yeniden ele alır; önceki kanıtların güvenilirliğini muvazaa
      ihtimaliyle birlikte değerlendirir.
    B: Yanlışlık önemlilik düzeyinin çok altında kaldığından, düzeltilmemiş yanlışlıklar listesine alınması dışında herhangi
      bir ek değerlendirme yapılmasına gerek yoktur.
    C: Hileye üst düzey bir yöneticinin karışmış olması, tutarına bakılmaksızın denetçinin finansal tablolara ilişkin görüş
      vermekten kaçınmasını gerektirir.
    D: Hilenin münferit bir vaka olduğu kabul edilerek yalnızca masraf hesaplarına ilişkin detay testlerinin kapsamı genişletilir
      ve denetime devam edilir.
    E: Denetçi önce hilenin gerçekleşip gerçekleşmediğine dair hukuki bir hüküm oluşturur; denetimin devamına bu hükmün sonucuna
      göre karar verir.
  dogru: A
  aciklama:
    dogru_neden: BDS 240 par. 37'ye göre denetçi, önemli ya da önemsiz bir yanlışlığın hileden kaynaklandığına ve hileye yönetimin
      (özellikle üst düzey yöneticilerin) dâhil olduğuna inanmasını gerektiren bir gerekçe varsa hile kaynaklı risk değerlendirmesini
      ve buna karşılık veren prosedürlerin niteliğini, zamanlamasını ve kapsamını yeniden değerlendirir; önceki kanıtların
      güvenilirliğini yeniden değerlendirirken muhtemel muvazaalı işlemi de mütalaa eder.
    celdiriciler:
      B: Par. 37 açıkça “önemli ya da önemsiz” yanlışlıktan söz eder; yönetimin dâhil olduğu hilede tutarın küçüklüğü yeniden
        değerlendirme yükümlülüğünü kaldırmaz.
      C: Görüş türü, yanlışlığın ve kanıt eksikliğinin önemi ve yaygınlığına göre belirlenir; yönetimin hileye karışması tek
        başına görüş vermekten kaçınmayı gerektirmez.
      D: Par. 36'ya göre hile göstergesi varsa denetçi, gerçekleşmiş bir hilenin münferit bir vaka olma ihtimalinin düşük
        olduğunu kabul eder; etkileri denetimin tüm aşamaları için değerlendirilir.
      E: BDS 240 par. 3'e göre denetçi hilenin gerçekten olup olmadığına dair yasal bir hüküm veremez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 37
    alinti: Denetçinin, önemli ya da önemsiz bir yanlışlık belirlemesi ve bunun hileden kaynaklandığına veya kaynaklanabileceğine
      ve bu hileye yönetimin de (özellikle üst düzey yöneticilerin) dâhil olduğuna inanmasını gerektirecek bir gerekçesinin
      bulunması durumunda denetçi; hile kaynaklı “önemli yanlışlık” risklerine ilişkin yaptığı değerlendirmeyi ve bunun risk
      olduğu değerlendirilen hususlara karşılık veren denetim prosedürlerine (prosedürlerin niteliğine, zamanlamasına ve kapsamına)
      olan etkilerini yeniden değerlendirir.
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 36, par. 3
    alinti: gerçekleşmiş bir hilenin münferit bir vaka olma ihtimalinin düşük olduğunu kabul ederek … hilenin gerçekten olup
      olmadığına dair yasal bir hüküm veremez
