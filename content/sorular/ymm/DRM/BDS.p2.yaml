- id: YMM-DRM-BDS-0036
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: bilgi
  zorluk: 1
  kok: BDS 505 “Dış Teyitler” uyarınca denetçinin, yönetim beyanı düzeyinde değerlendirilmiş önemli yanlışlık risklerini ele
    almak üzere olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanabilmesi için bir arada bulunması
    gereken şartlardan biri aşağıdakilerden hangisidir?
  secenekler:
    A: Önemli yanlışlık riskinin orta düzeyde değerlendirilmiş olması
    B: Anakitlenin az sayıda ve tutarı yüksek hesap bakiyelerinden oluşması
    C: Beklenen istisna oranının düşük olması
    D: Olumsuz teyit taleplerinin olumlu teyit talepleriyle birlikte gönderilmesi
    E: İlgili kontrollerin yalnızca tasarımının değerlendirilmiş olması
  dogru: C
  aciklama:
    dogru_neden: 'BDS 505 par. 15, olumsuz teyitlerin tek başına maddi doğrulama prosedürü olarak kullanılabilmesi için dört
      şartın tümünün bulunmasını arar: önemli yanlışlık riskinin düşük değerlendirilmesi ve kontrollerin işleyiş etkinliğine
      ilişkin yeterli ve uygun kanıt elde edilmesi; anakitlenin çok sayıda küçük ve aynı türden kalemden oluşması; beklenen
      istisna oranının düşük olması; talepleri alanların bunları göz ardı etmesine yol açacak durumlardan denetçinin haberdar
      olmaması. C seçeneği bu şartlardan biridir.'
    celdiriciler:
      A: Standart, riskin “düşük” olarak değerlendirilmesini arar; orta düzey risk bu şartı karşılamaz.
      B: 'Şart bunun tersidir: anakitle çok sayıda küçük ve aynı türden hesap bakiyesi, işlem veya kalemden oluşmalıdır.'
      D: Par. 15'teki şartlar arasında olumlu teyitlerle birlikte gönderim yoktur; hüküm, olumsuz teyidin tek başına kullanılabileceği
        durumu düzenler.
      E: Tasarımın değerlendirilmesi yetmez; kontrollerin işleyiş etkinliğine ilişkin yeterli ve uygun denetim kanıtı elde
        edilmiş olmalıdır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 15
    alinti: Denetçinin “önemli yanlışlık” riskini düşük olarak değerlendirmiş ve yönetim beyanıyla ilgili kontrollerin işleyiş
      etkinliğine ilişkin yeterli ve uygun denetim kanıtı elde etmiş olması, Olumsuz teyit prosedürlerine konu olan kalemlerin
      yer aldığı anakitlenin çok sayıda küçük ve aynı türden hesap bakiyesi, işlem veya diğer kalemlerden oluşması, Beklenen
      istisna oranının düşük olması
