- id: YMM-DRM-BDS-0038
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: kavrama
  zorluk: 2
  kok: 'BDS 200 kapsamında denetim riskinin bileşenlerine ilişkin aşağıdaki ifadeleri değerlendiriniz.

    I. Yapısal risk ve kontrol riski işletmenin riskleridir ve finansal tabloların denetiminden bağımsızdır.

    II. Belirli bir denetim riski düzeyinde, değerlendirilen önemli yanlışlık riskleri yükseldikçe kabul edilebilir tespit
    edememe riski de yükselir.

    III. BDS 315, müteakip denetim prosedürlerine dayanak sağlamak amacıyla yönetim beyanı düzeyinde yapısal riskin kontrol
    riskinden ayrı olarak değerlendirilmesini zorunlu kılar.

    IV. İyi tasarlanmış ve etkin uygulanan kontroller kontrol riskini tamamen ortadan kaldırabilir.

    V. Yeterli planlama ve mesleki şüphecilikle tespit edememe riski sıfıra indirilebilir.

    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: II ve IV
    C: III ve V
    D: I ve III
    E: I, III ve V
  dogru: D
  aciklama:
    dogru_neden: 'I: BDS 200 A40''a göre yapısal risk ve kontrol riski işletmenin riskleridir ve denetimden bağımsızdır. III:
      A44''e göre BDS 315, yönetim beyanı düzeyinde yapısal riskin kontrol riskinden ayrı değerlendirilmesini zorunlu kılar.
      II, IV ve V yanlıştır.'
    celdiriciler:
      A: 'II yanlıştır: A47''ye göre önemli yanlışlık riski ile kabul edilebilir tespit edememe riski arasında ters yönlü
        ilişki vardır; risk yükseldikçe kabul edilebilir tespit edememe riski düşer.'
      B: II ters ilişkiyi doğru yönde vermez; IV de yanlıştır, çünkü A43'e göre kontrollerin yapısal kısıtlamaları nedeniyle
        belirli bir kontrol riski her zaman olacaktır.
      C: 'III doğru olmakla birlikte V yanlıştır: A49''a göre tespit edememe riski ortadan kaldırılamaz, sadece azaltılabilir.'
      E: I ve III doğrudur, ancak V yanlış olduğundan bu seçenek de yanlıştır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları
    madde: A40
    alinti: Yapısal risk ve kontrol riski işletmenin riskleridir. Söz konusu riskler finansal tabloların denetiminden bağımsızdır.
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları
    madde: A43, A44
    alinti: Bu sebeple, belirli bir kontrol riski her zaman olacaktır. … amacıyla yapısal riski kontrol riskinden ayrı olarak
      değerlendirmesini zorunlu kılar.
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları
    madde: A47, A49
    alinti: Örneğin, denetçiye göre “önemli yanlışlık” riskleri ne kadar yüksekse, kabul edilebilir tespit edememe riski o
      kadar düşük bir düzeyde olacaktır. … Ancak denetimin yapısal kısıtlamaları sebebiyle tespit edememe riski ortadan kaldırılamaz,
      sadece azaltılabilir.
