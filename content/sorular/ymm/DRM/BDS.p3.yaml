- id: YMM-DRM-BDS-0075
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: kavrama
  zorluk: 2
  kok: 'BDS 510 “İlk Bağımsız Denetimler – Açılış Bakiyeleri” uyarınca denetim sonuçları ve raporlamaya ilişkin aşağıdaki
    öncüllerden hangileri doğrudur?


    I. Açılış bakiyelerine ilişkin yeterli ve uygun denetim kanıtı elde edemeyen denetçi, BDS 705 uyarınca sınırlı olumlu
    görüş verir veya finansal tablolara ilişkin görüş vermekten kaçınır.

    II. Açılış bakiyelerinin cari dönem finansal tablolarını önemli derecede etkileyen bir yanlışlık içerdiği ve bu yanlışlığın
    etkisinin uygun şekilde muhasebeleştirilmediği ya da yeterli sunulmadığı sonucuna varan denetçi yalnızca olumsuz görüş
    verir.

    III. Önceki denetçinin olumlu görüş dışındaki görüşünün cari döneme ait finansal tablolar açısından ilgili ve önemli olması
    hâlinde denetçi, BDS 705 ve BDS 710 uyarınca cari dönem finansal tablolarına ilişkin olumlu görüş dışında bir görüş verir.

    IV. Muhasebe politikalarının açılış bakiyelerine ilişkin cari dönemde tutarlı uygulanmadığı sonucuna varan denetçi olumlu
    görüş verir ve bu hususu yalnızca üst yönetimden sorumlu olanlara bildirir.'
  secenekler:
    A: I ve III
    B: I ve IV
    C: II ve III
    D: II ve IV
    E: III ve IV
  dogru: A
  aciklama:
    dogru_neden: BDS 510 par. 10’a göre açılış bakiyelerine ilişkin yeterli ve uygun kanıt elde edilemezse denetçi sınırlı
      olumlu görüş verir veya görüş vermekten kaçınır (I doğru). Par. 13’e göre önceki denetçinin olumlu görüş dışındaki görüşü
      cari döneme ilişkin ilgili ve önemliyse denetçi BDS 705 ve BDS 710 uyarınca olumlu görüş dışında bir görüş verir (III
      doğru). Par. 11’e göre önemli yanlışlık durumunda sınırlı olumlu veya olumsuz görüş verilir (II yanlış); par. 12’ye
      göre tutarsız politika uygulamasında da sınırlı olumlu veya olumsuz görüş verilir (IV yanlış).
    celdiriciler:
      B: 'IV yanlıştır: par. 12 tutarsız uygulamada BDS 705 uyarınca sınırlı olumlu veya olumsuz görüş ister; I doğrudur.'
      C: 'II yanlıştır: par. 11 yalnızca olumsuz görüşü değil, sınırlı olumlu veya olumsuz görüşten birini öngörür; III doğrudur.'
      D: II ve IV yanlıştır; par. 11 ve par. 12 sınırlı olumlu veya olumsuz görüş verilmesini ister.
      E: IV yanlıştır (par. 12); III doğrudur ancak I de doğru olduğundan birleşim eksiktir.
