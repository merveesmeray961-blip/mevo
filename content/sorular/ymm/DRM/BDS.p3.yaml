  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 1
  kok: Bir perakende şirketinin bağımsız denetiminde denetçi, depo çalışanlarının mal çaldığına ilişkin küçük tutarlı bulgulara
    ulaşmıştır. Denetçi, varlıkların kötüye kullanılmasından kaynaklanan hilenin yalnızca çalışanlardan kaynaklanabileceğini
    ve yönetimin böyle bir hileyle ilgisinin bulunamayacağını varsaymak istemektedir. BDS 240’a göre bu varsayım hakkında
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Varlıkların kötüye kullanılması yalnızca çalışanlarca yapılabilir; yönetim bu hile türünün tarafı olamayacağından denetçinin
      varsayımı uygundur ve ek değerlendirme gerekmez.
    B: Varlıkların kötüye kullanılması kasıtlı yanlışlık sayılmadığından bu tür bulgular BDS 240 kapsamının dışında kalır
      ve bu varsayıma hiç gerek yoktur.
    C: Varlıkların kötüye kullanılması çoğunlukla çalışanlarca küçük tutarlarla yapılsa da, hileyi daha kolay gizleyebilecek
      yönetimce de yapılabilir; varsayım yapılamaz.
    D: Yönetimin varlıkları kötüye kullanması çalışanlarınkine göre daha kolay tespit edildiğinden, denetçi bu riski yalnızca
      çalışan düzeyinde değerlendirebilir.
    E: Kötüye kullanılan tutar küçük olduğunda eylem hile sayılmaz; hilenin varlığı için tutarın önemlilik düzeyini aşması
      gerekir, aksi hâlde BDS 240 uygulanmaz.
  dogru: C
  aciklama:
    dogru_neden: BDS 240 A5’e göre varlıkların kötüye kullanılması çoğunlukla çalışanlarca nispeten küçük ve önemsiz miktarlarda
      gerçekleştirilir; ancak bu eylemi tespit edilmesi zor yöntemlerle daha kolay gizleyebilecek olan işletme yönetimi tarafından
      da gerçekleştirilebilir. Dolayısıyla yalnızca çalışan eylemlerinin söz konusu olduğu varsayımı yapılamaz.
    celdiriciler:
      A: Yönetim de varlıkları kötüye kullanabilir; üstelik tespit edilmesi zor yöntemlerle hileyi daha kolay gizleyebilir
        (A5).
      B: Varlıkların kötüye kullanılması, hileli finansal raporlama ile birlikte denetçiyi ilgilendiren iki kasıtlı yanlışlık
        türünden biridir (par. 3).
      D: Yönetim, tespit edilmesi zor yöntemlerle eylemi daha kolay örtbas edebilir; tespit kolaylığı yönetim lehine değil
        aleyhinedir.
      E: Hata ile hileyi ayıran unsur tutar değil, eylemin kasıtlı yapılıp yapılmadığıdır (par. 2).
