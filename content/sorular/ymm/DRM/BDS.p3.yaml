  kok: 'BDS 530 “Bağımsız Denetimde Örnekleme” uyarınca örneklemde belirlenen sapma ve yanlışlıkların ele alınmasına ilişkin
    aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi, örneklemde tespit edilen bir sapma veya yanlışlığı anomali olarak değerlendirirse, ilave prosedür uygulamasına
    gerek kalmaksızın bunun anakitleyi temsil etmediğini kabul eder.

    II. Denetçi, detay testleri için örneklemde bulduğu yanlışlıkları kullanarak anakitlenin geneli için bir öngörüde bulunur.

    III. Denetçi, belirlediği sapma veya yanlışlıkların yalnızca niteliğini araştırır; sebebini ve denetimin diğer alanları
    üzerindeki muhtemel etkilerini değerlendirmesi gerekmez.

    IV. Denetçinin tasarlanmış denetim prosedürlerini veya uygun alternatif prosedürleri seçilen bir kalem üzerinde uygulayamaması
    hâlinde söz konusu kalem, kontrol testleri açısından öngörülen kontrolden bir sapma, detay testleri açısından ise bir
    yanlışlık olarak kabul edilir.'
  secenekler:
    A: I ve III
    B: I ve IV
    C: II ve III
    D: II ve IV
    E: III ve IV
  dogru: D
  aciklama:
    dogru_neden: BDS 530 par. 14’e göre detay testlerinde bulunan yanlışlıklar anakitle için öngörüde bulunmakta kullanılır
      (II doğru). Par. 11’e göre prosedürü uygulanamayan kalem, kontrol testlerinde sapma, detay testlerinde yanlışlık sayılır
      (IV doğru). Par. 13’e göre anomali değerlendirmesi için ilave prosedürlerle yüksek kesinlikte kanaat oluşturulması gerekir
      (I yanlış). Par. 12’ye göre sapma veya yanlışlığın nitelik ve sebebi araştırılır ve prosedürün amacı ile denetimin diğer
      alanlarına etkisi değerlendirilir (III yanlış).
    celdiriciler:
      A: I ve III yanlıştır; par. 13 ve par. 12 bu ifadelerle çelişir.
      B: 'I yanlıştır: anomali kabulü için ilave prosedürlerle yüksek kesinlikte kanaat gerekir (par. 13); IV doğrudur ancak
        II de doğrudur.'
      C: 'III yanlıştır: par. 12 nitelik ve sebebin araştırılmasını ve etkilerin değerlendirilmesini ister; II doğrudur.'
      E: III yanlıştır (par. 12); IV doğrudur ancak II de doğru olduğundan birleşim eksiktir.
