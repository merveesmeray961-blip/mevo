  kok: Denetçi Hakan Özer, Çınar Perakende A.Ş.’nin denetiminde finansal tablolar düzeyinde ve ayrıca hasılat hesaplarına
    ilişkin yönetim beyanı düzeyinde hile kaynaklı önemli yanlışlık riskleri değerlendirmiştir. BDS 240’a göre bu riskler
    karşısında denetçinin yapması gerekenleri doğru biçimde birleştiren seçenek aşağıdakilerden hangisidir?
  secenekler:
    A: Finansal tablo düzeyindeki riskler için personeli iş yükünün eşit dağılımına göre görevlendirir, prosedürleri öngörülebilir
      kılmak üzere yönetime önceden bildirir; beyan düzeyi için ayrıca prosedür tasarlamaz.
    B: Personeli hile riski değerlendirmesini ve kişilerin bilgi, beceri ve kabiliyetlerini dikkate alarak görevlendirir,
      prosedürlere öngörülemezlik katar; beyan düzeyi risklere müteakip prosedürlerle karşılık verir.
    C: Finansal tablo düzeyindeki riskler için yalnızca genel işleri uygular; beyan düzeyindeki riskler için müteakip prosedür
      tasarlanması ancak genel işler yetersiz kalırsa gündeme gelir.
    D: Muhasebe politikalarının seçimini yalnızca yönetimin sorumluluğunda sayar, bunların kazanç yönetimi göstergesi olup
      olmadığını değerlendirmez; öngörülemezlik unsurunu yalnızca beyan düzeyi prosedürlerine uygular.
    E: Genel işleri belirlerken kişilerin bilgi, beceri ve kabiliyetlerini dikkate alır; beyan düzeyindeki hasılat riskleri
      için yalnızca yönetimden yazılı beyan alır ve müteakip prosedür tasarlamaz.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 240 par. 30’a göre finansal tablo düzeyindeki hile riskleri için genel işler belirlenirken denetçi;
      personeli hile riski değerlendirmesini ve kişilerin bilgi, beceri ve kabiliyetlerini dikkate alarak görevlendirir, yönlendirir
      ve gözetir, muhasebe politikaları seçimi ve uygulamasının kazanç yönetiminden kaynaklanan hileli finansal raporlamanın
      göstergesi olup olmadığını değerlendirir ve prosedürlerin seçimine öngörülemezlik unsurunu dâhil eder. Par. 31’e göre
      beyan düzeyindeki hile riskleri için niteliği, zamanlaması ve kapsamıyla karşılık veren müteakip prosedürler ayrıca
      tasarlanır ve uygulanır. Püf noktaları: (1) Genel işler (par. 29-30) ile beyan düzeyi prosedürleri (par. 31) birbirinin
      alternatifi değil tamamlayıcısıdır; (2) öngörülemezlik, prosedürlerin öngörülebilir kılınması değil tersidir.'
    celdiriciler:
      A: Par. 30 öngörülemezlik unsurunu ister; prosedürlerin yönetime önceden bildirilmesi bunu ortadan kaldırır. Par. 31
        beyan düzeyi prosedürlerini ayrıca ister.
      C: Par. 31 beyan düzeyindeki hile risklerine karşı müteakip prosedürlerin tasarlanmasını genel işlerin yetersizliğine
        bağlamaz.
      D: Par. 30 muhasebe politikalarının kazanç yönetimi göstergesi olup olmadığının değerlendirilmesini ve öngörülemezliğin
        prosedürlerin seçimine dâhil edilmesini ister.
      E: Par. 31 beyan düzeyindeki hile riskleri için niteliği, zamanlaması ve kapsamıyla karşılık veren müteakip denetim
        prosedürleri tasarlanıp uygulanmasını ister; yazılı beyan bunların yerine geçmez.
