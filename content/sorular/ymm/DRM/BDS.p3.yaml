    birini yapmıştır. BDS 200 ve BDS 315 hükümlerine göre bu açıklamalardan hangisi doğrudur?
  secenekler:
    A: Mesleki şüphecilik ve muhakeme denetimin planlanmasında ve yürütülmesinde sürdürülür; ancak müzakere kilit ekip üyeleriyle
      sınırlıdır ve sorumlu denetçinin katılımı gerekmez.
    B: Mesleki muhakeme planlamada ve yürütmede kullanılır; mesleki şüphecilik ise yönetimin geçmişteki dürüstlüğü olumluysa
      planlama aşamasında gevşetilebilir. Müzakere sorumlu denetçi ve kilit ekip üyeleriyle yapılır.
    C: Mesleki şüphecilik denetimin yürütülmesinde sürdürülür, planlamada ise yönetim beyanları esas alınır; müzakere sorumlu
      denetçi ve kilit ekip üyeleriyle yapılır ve finansal tabloların önemli yanlışlıklara açıklığını kapsar.
    D: Mesleki şüphecilik ve muhakeme denetimin planlanmasında ve yürütülmesinde sürdürülür; müzakere hile risklerine yoğunlaşır,
      finansal tabloların hata kaynaklı yanlışlıklara açıklığı kapsam dışı kalır.
    E: Mesleki şüphecilik ve muhakeme denetimin planlanmasında ve yürütülmesinde sürdürülür; sorumlu denetçi ve kilit ekip
      üyeleri finansal tabloların önemli yanlışlıklara açıklığını müzakere eder.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 200 par. 15’e göre denetçi, finansal tabloların önemli ölçüde yanlışlık içermesine sebep olan şartların
      bulunabileceğini kabul ederek denetimi mesleki şüphecilik içinde planlar ve yürütür; par. 16’ya göre de mesleki muhakemesini
      denetimin planlanması ve yürütülmesinde kullanır. BDS 315 par. 17’ye göre sorumlu denetçi ve denetim ekibinin diğer
      kilit üyeleri, finansal tabloların önemli yanlışlıklara açıklığı konusunda müzakerede bulunur. Püf noktaları: (1) Şüphecilik
      ve muhakeme belirli bir aşamayla sınırlı değildir; (2) müzakere, yönetimin görüşüne bağlı olmaksızın yapılan bir risk
      değerlendirme çalışmasıdır.'
    celdiriciler:
      A: BDS 315 par. 17 müzakereyi sorumlu denetçi ve denetim ekibinin diğer kilit üyeleri için öngörür.
      B: BDS 200 par. 15 şüpheciliği geçmiş tecrübeye bakılmaksızın planlamada ve yürütmede sürdürmeyi ister; geçmişteki dürüstlük
        şüpheciliği gevşetmeyi haklı kılmaz.
      C: BDS 200 par. 15 mesleki şüpheciliğin planlamada da sürdürülmesini ister; planlamada yönetim beyanlarının esas alınması
        hükme aykırıdır.
      D: BDS 315 par. 17 müzakerenin finansal tabloların önemli yanlışlıklara olan açıklığına ilişkin olmasını ister; hata
        kaynaklı yanlışlıklar kapsam dışı bırakılmaz.
