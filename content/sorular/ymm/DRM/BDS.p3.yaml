    240’a göre denetçinin, hilenin yetkili bir kuruma rapor edilmesi bakımından yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Hile henüz şüphe aşamasında olduğundan raporlama konusunu değerlendirmez; hile kesinleşinceye ve yönetimce kabul edilinceye
      kadar bildirimde bulunmadan bekler.
    B: Hileden şüphelendiği anda, mevzuat veya etik hükümlerin durumu zorunlu kılıp kılmadığına bakmaksızın ve gecikmeksizin
      yetkili bir kuruma rapor eder.
    C: Raporlama kararını yönetimin yazılı onayını aldıktan sonra verir; çünkü gizlilik yükümlülüğü yetkili kuruma yapılacak
      her bildirimi engeller.
    D: Mevzuat veya etik hükümlerin yetkili kuruma rapor etmeyi zorunlu kılıp kılmadığına ya da uygunluğu hakkında sorumluluk
      yükleyip yüklemediğine karar verir.
    E: Yetkili kuruma rapor etme yükümlülüğü, üst yönetimden sorumlu olanlara yapılan bildirimin sonuçsuz kalması ve hilenin
      kesinleşmesi hâlinde doğar.
  dogru: D
