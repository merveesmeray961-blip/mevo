- id: YMM-DRM-BDS-0054
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 3
  kok: Denetçi Nihan Kurt, Delta Mobilya A.Ş.’nin 2025 yılı denetiminde, işletmenin tüm satışlarının peşin tahsil edilen,
    tek tür ve basit perakende işlemlerinden oluştuğunu belirleyerek hasılatın finansal tablolara alınmasında hile kaynaklı
    önemli yanlışlık riski bulunduğu varsayımının bu denetimde geçerli olmadığı sonucuna varmıştır. Denetçi ayrıca stok değerlemesine
    ilişkin yönetim beyanı düzeyinde hile kaynaklı bir önemli yanlışlık riski belirlemiştir. BDS 240’a göre denetçinin yapması
    gerekenler aşağıdakilerden hangisidir?
  secenekler:
    A: Varsayımın geçerli olmadığı sonucunu belgelemesi gerekmez, çünkü hasılata ilişkin varsayım üst yönetimden sorumlu olanlarla
      müzakere edilir; stok değerleme riskini ciddi risk sayar ve ilgili kontrollerin tasarımını değerlendirir.
    B: Varsayımın geçerli olmadığı sonucunun gerekçelerini çalışma kâğıtlarına dâhil eder; stok değerleme riskini önemlilik
      düzeyini aşmadıkça ciddi risk olarak ele almaz ve ilgili kontrollerin belirlenmesine ya da tasarımının değerlendirilmesine
      gerek duymaz.
    C: Hasılattaki hile riski varsayımını hiçbir durumda bırakamaz ve hasılatı ciddi risk olarak ele alır; stok değerleme
      riskini ise yalnızca genel işlerle karşılar, bu riski ele alan kontrolleri belirlemez ve tasarımlarını değerlendirmez.
    D: Varsayımın geçerli olmadığı sonucunun gerekçelerini yalnızca yönetime yazılı olarak bildirir; stok değerleme riskini
      ciddi risk olarak ele alır, ancak kontrollerin tasarımını değerlendirmeksizin maddi doğrulama prosedürlerine geçer.
    E: Varsayımın geçerli olmadığı sonucunun gerekçelerini çalışma kâğıtlarına dâhil eder; stok değerleme riskini ciddi risk
      sayar ve henüz yapılmadıysa ilgili kontrolleri belirler, tasarımını değerlendirir, uygulanıp uygulanmadığını belirler.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 240 par. 27’ye göre denetçi hasılatın finansal tablolara alınmasında hile riskleri bulunduğu varsayımıyla
      hareket eder; par. 48’e göre bu varsayımın yürütülen denetimde geçerli olmadığı sonucuna ulaşırsa bunun gerekçelerini
      çalışma kâğıtlarına dâhil eder. Par. 28’e göre hile kaynaklı önemli yanlışlık riski olarak değerlendirilen her risk
      ciddi risk olarak ele alınır; henüz yapılmadıysa bu riskleri ele alan işletme kontrolleri belirlenir, tasarımları değerlendirilir
      ve uygulanıp uygulanmadıkları belirlenir. Püf noktaları: (1) Hasılat varsayımı bırakılabilir, ancak gerekçe belgelenmek
      zorundadır; (2) hile kaynaklı her risk büyüklüğünden bağımsız olarak ciddi risktir ve ilgili kontrollerin belirlenmesi,
      tasarımının değerlendirilmesi ve uygulanıp uygulanmadığının belirlenmesi gerekir.'
    celdiriciler:
      A: Par. 48 varsayımın geçerli olmadığı sonucunun gerekçelerinin çalışma kâğıtlarına dâhil edilmesini ister; müzakere
        ile sınırlı değildir.
      B: Par. 28 hile kaynaklı her riski büyüklüğüne bakmaksızın ciddi risk sayar ve ilgili kontrollerin belirlenmesini ister.
      C: Par. 27 ve 48 varsayımın geçerli olmadığı sonucuna ulaşılabileceğini öngörür; par. 28 ise hile riskini ele alan kontrollerin
        belirlenmesini ister.
      D: Par. 48 gerekçelerin çalışma kâğıtlarına dâhil edilmesini ister; par. 28 kontrollerin tasarımının değerlendirilmesini
        zorunlu kılar.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 48
    alinti: Hasılatın finansal tablolara alınmasıyla ilgili hile kaynaklı “önemli yanlışlık” riskinin bulunduğu varsayımının
      yürütülen denetimde geçerli olmadığı sonucuna ulaşması hâlinde denetçi, bunun gerekçelerini çalışma kâğıtlarına dâhil
      eder
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 28
    alinti: Denetçi, hile kaynaklı “önemli yanlışlık” riski olarak değerlendirdiği riskleri “ciddi riskler” olarak ele alır
