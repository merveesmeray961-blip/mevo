- id: YMM-DRM-BDS-0087
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: uygulama
  zorluk: 2
  kok: Bağımsız denetçi, yürüttüğü denetimde ilgili bir BDS’de belirtilen bir amaca ulaşamamıştır. BDS 200 uyarınca denetçinin
    yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Amaca ulaşılamaması genel amaçlara ulaşmayı engellediğinden, mevzuatta çekilme imkânı bulunsa bile doğrudan görüş vermekten
      kaçınır.
    B: Diğer BDS’lerin amaçlarına ulaşıldığı sürece ilgili amaca ulaşılamamasının sonucu olmayacağından belgelendirme yapmaz
      ve denetime olağan biçimde devam eder.
    C: Durumu çalışma kâğıtlarında belgelendirmek yerine, yalnızca üst yönetimden sorumlu olanlara yazılı olarak bildirmekle
      yetinerek denetime devam eder.
    D: Yönetimden yazılı beyan alarak amaca ulaşılmış sayar, durumu önemli bir husus olarak belgelendirmeden ve diğer prosedürlere
      gerek duymadan olumlu görüş bildirir.
    E: Bu durumun genel amaçlarına ulaşmasını engelleyip engellemediğini, olumlu dışında görüş vermeyi ya da çekilmeyi gerektirip
      gerektirmediğini değerlendirir.
  dogru: E
  aciklama:
    dogru_neden: BDS 200 par. 24’e göre ilgili BDS’de belirtilen bir amaca ulaşılamaması hâlinde denetçi, bu durumun genel
      amaçlarına ulaşmasını engelleyip engellemediğini ve dolayısıyla olumlu dışında bir görüş vermesini veya (mevzuata göre
      çekilmenin mümkün olması şartıyla) denetimden çekilmesini gerektirip gerektirmediğini değerlendirir. Amaca ulaşılamaması
      ayrıca BDS 230 uyarınca belgelendirilmesi gereken önemli bir durumun varlığına işaret eder.
    celdiriciler:
      A: Par. 24 otomatik bir sonuç öngörmez; durumun genel amaçlara ulaşmayı engelleyip engellemediği değerlendirilir.
      B: Amaca ulaşılamaması belgelendirilmesi gereken önemli bir durumdur ve genel amaçlar üzerindeki etkisi değerlendirilir.
      C: Bildirim tek başına yeterli değildir; durum BDS 230 uyarınca belgelendirilmelidir.
