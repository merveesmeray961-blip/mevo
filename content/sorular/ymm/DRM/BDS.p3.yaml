    dogru_neden: BDS 580 par. 20’ye göre yönetimin 10 ve 11 inci paragraflar uyarınca sunulması gereken yazılı beyanları sunmaması
      hâlinde denetçi görüş vermekten kaçınır (I doğru). Aynı paragraf, yönetimin dürüstlüğü konusunda yeterli şüphe bulunması
      ve zorunlu beyanların güvenilir olmadığı sonucuna varılması hâlinde de görüş vermekten kaçınmayı öngörür; sınırlı olumlu
      görüş değil (II yanlış). Par. 15’e göre yazılı beyanlar denetçiye hitaben yazılmış bir beyan mektubu şeklindedir (III
      doğru).
    celdiriciler:
      A: III de doğrudur; birleşim eksiktir.
      B: II yanlıştır; dürüstlük şüphesi hâlinde de görüş vermekten kaçınılır.
      C: II yanlıştır; I doğru olsa da II’nin sonucu sınırlı olumlu görüş değildir.
      E: II yanlıştır; I ve III doğrudur.
