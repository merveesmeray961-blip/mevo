    dogru_neden: BDS 550 par. 22’ye göre önceden belirlenmemiş ilişkili taraf bulunduğunda çerçevede ilişkili taraf hükümleri
      varsa denetçi yönetimden yeni belirlenen taraflarla yapılan tüm işlemlerin belirlenmesini talep eder (II doğru). Par.
      24’e göre piyasa şartlarına eşdeğerlik beyanı varsa bu beyan için yeterli ve uygun kanıt elde edilir (IV doğru). Par.
      22 bilgilerin derhâl ekibe iletilmesini ister (I yanlış). Par. 23 varsa sözleşme veya anlaşmaların tetkikini ister (III
      yanlış).
    celdiriciler:
      A: 'I yanlıştır: par. 22 bilgilerin derhâl denetim ekibine iletilmesini ister; II doğrudur.'
      B: I ve III yanlıştır.
      C: I yanlıştır (par. 22); IV doğrudur.
      D: 'III yanlıştır: par. 23 sözleşme veya anlaşmaların tetkikini de ister; II doğrudur.'
