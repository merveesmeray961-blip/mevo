  kok: Bağımsız denetçi, Altın Gıda A.Ş.’nin denetiminde yönetimden alacağı yazılı beyan mektubunun içeriğini planlamaktadır.
    BDS 240’a göre denetçinin yönetimden ve uygun hâllerde üst yönetimden sorumlu olanlardan almakla yükümlü olduğu yazılı
    beyan aşağıdakilerden hangisidir?
  secenekler:
