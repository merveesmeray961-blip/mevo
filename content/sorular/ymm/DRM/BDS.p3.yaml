    A: tutarı – bağımsız denetime tabi tutulabilmesi
    B: süresi – gerçeğe uygun biçimde sunulması
    C: büyüklüğü – yanıltıcı bir nitelik taşımaması
    D: büyüklüğü – gerçeğe uygun biçimde sunulması
    E: olasılığı – önemlilik düzeyini aşmaması
  dogru: C
  aciklama:
    dogru_neden: BDS 570 par. 18’e göre bir belirsizliğin muhtemel etkisinin büyüklüğü ve gerçekleşme ihtimali, denetçinin
      muhakemesine göre belirsizliğin niteliği ve etkilerine ilişkin uygun açıklamaları gerektirirse önemli belirsizlik söz
      konusudur. Açıklamalar, gerçeğe uygun sunuma dayalı bir çerçevede finansal tabloların gerçeğe uygun sunumu, bir uygunluk
      çerçevesinde ise finansal tabloların yanıltıcı olmaması bakımından aranır. Soruda uygunluk çerçevesi verildiğinden doğru
      ifade “yanıltıcı olmaması”dır.
