- id: YMM-DRM-BDS-0063
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: uygulama
  zorluk: 2
  kok: 'Denetçi, Doğa Süt Ürünleri A.Ş.’nin hasılat hesabına ilişkin analitik maddi doğrulama prosedürü tasarlamaktadır. BDS
    520’ye göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi, analitik maddi doğrulama prosedürlerinin ilgili yönetim beyanları için uygunluğuna, varsa detay testleriyle
    birlikte değerlendirilmiş önemli yanlışlık risklerini dikkate alarak karar verir.

    II. Denetçi, beklentisinin dayanağı olan verilerin güvenilirliğini, mevcut bilgilerin kaynağını, karşılaştırılabilirliğini,
    niteliğini ve ihtiyaca uygunluğunu ile bu bilgilerin hazırlanma süreci üzerindeki kontrolleri dikkate alarak değerlendirir.

    III. Denetçi, kayıtlı tutarlara ilişkin geliştirdiği beklentinin önemli bir yanlışlığı belirlemek için yeterince kesin
    olup olmadığını değerlendirmez; böyle bir değerlendirme yalnızca detay testlerinde yapılır.'
