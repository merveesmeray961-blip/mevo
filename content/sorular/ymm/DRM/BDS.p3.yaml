- id: YMM-DRM-BDS-0047
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: uygulama
  zorluk: 3
  kok: Denetçi Murat Çelik, sekiz yıldır denetlediği Tuna Gıda A.Ş.’nin 2025 yılı denetimini planlarken, önceki denetimlerde
    edindiği işletme bilgisinin ve geçen yıl uyguladığı prosedürlerin sonuçlarının cari yıl için de aynen geçerli olduğunu
    varsaymakta; bu bilgileri yeniden değerlendirmeksizin denetim kanıtı olarak kullanmayı düşünmektedir. BDS 200, BDS 315
    ve BDS 330 hükümleri birlikte dikkate alındığında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Önceki denetimlerden elde edilen bilgiler, işletmede değişiklik olduğuna dair bir bildirim yapılmadığı sürece cari
      denetimde ayrıca değerlendirilmeksizin kanıt olarak kullanılabilir.
    B: Bilgileri kullanmayı düşünen denetçi, bunların cari denetim için hâlen ihtiyaca uygun ve güvenilir olup olmadığını
      değerlendirir; kontrollere ilişkin önceki kanıt ek koşullara bağlıdır.
    C: Önceki denetimlerden elde edilen bilgilerin kullanılabilmesi için yönetimin bu bilgilerin hâlen geçerli olduğuna ilişkin
      yazılı beyanı alınır; denetçinin ayrıca bir değerlendirme yapması gerekmez.
    D: Bilgilerin kullanılabilmesi için aynı denetim ekibi tarafından edinilmiş olması ve sekiz yılı aşmayan bir sürede toplanmış
      bulunması yeterlidir, ayrıca değerlendirme gerekmez.
    E: Önceki denetimlerde edinilen bilgiler risk değerlendirmesinde kullanılabilir; kontrol kanıtı olarak önceki sonuçlara
      güvenmek için yönetimin kontrollerde değişiklik olmadığını yazılı beyan etmesi yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 315 par. 16’ya göre denetçi, işletmeyle ilgili önceki deneyimlerinden ve önceki denetimlerde uyguladığı
      prosedürlerden elde ettiği bilgileri kullanmayı düşünüyorsa, bunların denetim kanıtı olarak cari denetim için hâlen
      ihtiyaca uygun ve güvenilir olup olmadıklarını değerlendirir. Kontrollerin işleyiş etkinliğine ilişkin önceki denetim
      kanıtlarının kullanımı ise BDS 330 par. 13-14’te ayrıca koşullara bağlanmıştır (değişiklik olup olmadığına dair kanıt,
      en az her üç denetimden birinde test). Böylece kanıt, denetim riskini kabul edilebilir düşük seviyeye indirecek yeterli
      ve uygun nitelikte kalır (BDS 200 par. 17). Püf noktaları: (1) Önceki bilgi yasak değildir, ancak otomatik de geçerli
      sayılmaz; (2) kontrollere ilişkin önceki kanıt için BDS 330’un ek koşulları aranır.'
    celdiriciler:
      A: Par. 16 değerlendirmeyi, işletmeden değişiklik bildirimi gelmesi şartına bağlamaz; bilgilerin hâlen ihtiyaca uygun
        ve güvenilir olup olmadığı her hâlde değerlendirilir.
      C: Par. 16 yönetim beyanını değil, denetçinin bilgilerin cari denetim için hâlen ihtiyaca uygun ve güvenilir olup olmadığını
        değerlendirmesini ister.
      D: Aynı ekip tarafından edinilme veya sekiz yıllık süre gibi ölçütler standartta yer almaz; belirleyici olan cari denetim
        için ihtiyaca uygunluk ve güvenilirliktir.
      E: BDS 330 par. 13-14 uyarınca önceki kontrol kanıtlarına dayanmak için değişiklik olup olmadığına ilişkin kanıt sorgulamayla
        birlikte gözlem veya tetkikle elde edilir; yazılı beyan yeterli değildir.
  kaynaklar:
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: par. 16
    alinti: İşletmeyle ilgili önceki deneyimlerinden ve önceki denetimlerde uyguladığı denetim prosedürlerinden elde ettiği
      bilgileri kullanmayı düşünmesi durumunda denetçi, bu tür bilgilerin denetim kanıtı olarak cari denetim için hâlen ihtiyaca
      uygun ve güvenilir olup olmadıklarını değerlendirir
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 14
    alinti: sorgulamayla birlikte gözlem veya tetkik yaparak bu kanıtları elde eder
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: par. 17
    alinti: Denetçi makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir seviyeye indirmek amacıyla yeterli
      ve uygun denetim kanıtı elde eder
