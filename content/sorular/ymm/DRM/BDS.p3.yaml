- id: YMM-DRM-BDS-0049
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Ege Gıda Dağıtım A.Ş.’nin finansal tablolar açısından önemli tutardaki stoklarının denetimini ve sonraki
    olaylara ilişkin prosedürlerini planlamaktadır. BDS 501 ve BDS 560’a göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Fiziki sayıma katılımın mümkün olduğu hâllerde denetçi, yönetimin sayım talimat ve prosedürlerini değerlendirmek, bu
    prosedürlerin uygulanmasını gözlemlemek, stokları tetkik etmek ve test sayımları yapmak için sayıma katılır.

    II. Fiziki sayım finansal tablo tarihinden farklı bir tarihte yapılmışsa denetçi, sayım tarihi ile finansal tablo tarihi
    arasında stoklarda meydana gelen değişikliklerin uygun kaydedilip kaydedilmediğine ilişkin kanıt elde etmek için, katılıma
    ilişkin prosedürlere ek olarak denetim prosedürleri uygular.

    III. Üçüncü bir tarafın emanetinde ve kontrolü altında bulunan stoklar önemliyse denetçi, üçüncü taraftan teyit talep
    etme veya tetkik ya da uygun diğer prosedürleri uygulama seçeneklerinden birini ya da her ikisini gerçekleştirerek kanıt
    elde eder.

    IV. Denetçi, finansal tabloların tarihi ile denetçi raporu tarihi arasında gerçekleşen olaylara ilişkin prosedürleri,
    daha önce uyguladığı prosedürlerin ikna edici sonuçlar sağladığı konularda da yenilemek zorundadır.'
  secenekler:
    A: I, II ve III
    B: I ve II
    C: II, III ve IV
    D: I, III ve IV
    E: II ve IV
  dogru: A
  aciklama:
    dogru_neden: 'I doğrudur (BDS 501 par. 4: katılımın dört unsuru). II doğrudur (par. 5: farklı tarihte yapılan sayımda
      değişikliklere ilişkin ek prosedürler). III doğrudur (par. 8: teyit talebi, tetkik veya her ikisi). IV yanlıştır: BDS
      560 par. 6’ya göre denetçinin, daha önce uyguladığı prosedürlerin ikna edici sonuçlar sağladığı konulara ilişkin ilave
      prosedür uygulaması beklenmez. Püf noktaları: (1) Üçüncü taraf emanetindeki stok için seçenekler birbirini dışlamaz,
      biri veya her ikisi uygulanır; (2) sonraki olay prosedürlerinde ikna edici sonuç alınmış konular yeniden yapılmaz.'
    celdiriciler:
      B: III de doğrudur (par. 8); bu birleşim eksiktir.
      C: IV yanlıştır (BDS 560 par. 6); bu birleşim yanlış öncül içerir ve I’i dışarıda bırakır.
      D: IV yanlış olduğundan bu birleşim hatalıdır; ayrıca II doğru öncüldür.
      E: IV yanlış olduğundan bu birleşim hatalıdır; I ve III doğru öncüllerdir.
  kaynaklar:
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtları – Belirli Kalemler İçin Dikkate Alınması Gereken Özel Hususlar
    madde: par. 4
    alinti: Stokların finansal tablolar açısından önemli olması durumunda denetçi, aşağıdakileri gerçekleştirmek suretiyle
      stokların mevcudiyeti ve durumuna ilişkin yeterli ve uygun denetim kanıtı elde eder
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtları – Belirli Kalemler İçin Dikkate Alınması Gereken Özel Hususlar
    madde: par. 5
    alinti: Fiziki stok sayımının finansal tablo tarihinden farklı bir tarihte yapılması durumunda denetçi, sayım tarihi ile
      finansal tablo tarihi arasında stoklarda meydana gelen değişikliklerin uygun olarak kaydedilip kaydedilmediğine ilişkin
      denetim kanıtı elde etmek için
  - mevzuat: BDS 501 Bağımsız Denetim Kanıtları – Belirli Kalemler İçin Dikkate Alınması Gereken Özel Hususlar
    madde: par. 8
    alinti: Üçüncü bir tarafın emanetinde ve kontrolü altında bulunan stokların finansal tablolar açısından önemli olması
      durumunda denetçi
  - mevzuat: BDS 560 Bilanço Tarihinden Sonraki Olaylar
    madde: par. 6
    alinti: Ancak denetçinin, daha önce uyguladığı denetim prosedürlerinin ikna edici (tatmin edici) sonuçlar sağladığı konulara
      ilişkin ilâve denetim prosedürleri uygulaması beklenmez
