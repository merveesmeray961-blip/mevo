      ciddi şüphe oluşturabilecek olay veya şartlarla ilgili denetim kanıtlarına karşı dikkatli olur. Par. 16’ya göre bu tür
      olay veya şartların belirlenmesi hâlinde denetçi, önemli bir belirsizliğin mevcut olup olmadığına karar vermek için
      ilave denetim prosedürleri uygulayarak yeterli ve uygun denetim kanıtı elde eder.
    celdiriciler:
      A: Par. 11 dikkatin denetim boyunca sürdürülmesini ister; planlama aşamasındaki sonuç sonraki kanıtları dışlamaz.
