- id: YMM-DRM-BDS-0070
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: bilgi
  zorluk: 2
  kok: 'BDS 570 uyarınca, finansal tabloların tarihinden sonra yönetim veya üst yönetimden sorumlu olanlar tarafından finansal
    tabloların onaylanmasında uzun süreli bir gecikme yaşanırsa denetçi, gecikmenin sebepleri hakkında ______ yapar. Gecikmenin,
    işletmenin sürekliliği hakkında yapılan değerlendirmeyle ilgili olay veya şartlarla ilgili olabileceği kanaatine varırsa
    denetçi, gerekli ilave denetim prosedürlerini uygulamanın yanı sıra bu gecikmenin ______ üzerindeki etkisini değerlendirir.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: yazılı beyan talebi – denetçi raporunun tarihine ilişkin kararı
    B: dış teyit talebi – yönetimin sürekliliği esasını kullanma niyeti
    C: sorgulama – önemli belirsizliğin mevcudiyetine ilişkin varacağı sonuç
    D: sorgulama – yönetimin değerlendirme döneminin uzunluğuna ilişkin kararı
    E: tetkik – finansal tabloların hazırlanmasında kullanılan muhasebe politikaları
  dogru: C
  aciklama:
    dogru_neden: BDS 570 par. 26’ya göre finansal tabloların onaylanmasında uzun süreli gecikme yaşanırsa denetçi gecikmenin
      sebepleri hakkında sorgulama yapar. Gecikmenin sürekliliğe ilişkin değerlendirmeyle ilgili olay veya şartlarla ilgili
      olabileceği kanaatine varırsa denetçi, par. 16’daki ilave denetim prosedürlerini uygulamanın yanı sıra gecikmenin, önemli
      belirsizliğin mevcudiyetine ilişkin varacağı sonuç üzerindeki etkisini değerlendirir (par. 18).
    celdiriciler:
      A: Standart gecikmenin sebepleri için yazılı beyan talep etmeyi değil sorgulama yapmayı öngörür; etki de rapor tarihine
        değil önemli belirsizlik sonucuna ilişkin değerlendirilir.
      B: Gecikmenin sebepleri dış teyit yoluyla değil sorgulama yoluyla araştırılır; değerlendirilen etki yönetimin niyetine
        değil önemli belirsizliğe ilişkin sonuca yöneliktir.
      D: İlk boşluk doğrudur; ancak gecikmenin etkisi, yönetimin değerlendirme dönemine değil, denetçinin önemli belirsizliğin
        mevcudiyetine ilişkin varacağı sonuca yönelik olarak değerlendirilir.
      E: Gecikme tetkikle değil sorgulamayla araştırılır; etki muhasebe politikaları üzerinde değil önemli belirsizlik sonucu
        üzerinde değerlendirilir.
