  kok: Denetçi Kadir Sönmez, on iki yıldır denetlediği Yıldırım Gıda A.Ş.’nin yönetiminin bugüne kadar hiçbir konuda doğruluk
    ve dürüstlük sorunu yaşatmadığını belirtmekte ve bu nedenle 2025 yılı denetiminde mesleki şüpheciliğin düzeyini düşürmeyi
    düşünmektedir. BDS 240’a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yönetimin geçmişteki doğruluğu şüpheciliğin düzeyini belirler; on iki yıllık sorunsuz geçmiş, şüpheciliğin hile riski
      belirlenene kadar askıya alınmasını haklı kılar.
    B: Denetçi, yönetimin doğruluk ve dürüstlüğüne ilişkin geçmiş tecrübesine bakmaksızın, hile kaynaklı yanlışlık olabileceği
      ihtimalinin bilinciyle denetim boyunca şüpheciliğini sürdürür.
    C: Mesleki şüphecilik, yönetimin geçmiş tecrübesi olumluysa denetim süresince gevşetilebilir; ancak bu gevşetme gerekçeleriyle
      birlikte çalışma kâğıtlarında belgelenir.
    D: Denetçi, geçmiş tecrübesi olumlu olduğunda şüpheciliği korur; ancak hile kaynaklı yanlışlık ihtimalini yalnızca yeni
      müşterilerin denetiminde dikkate almak zorundadır.
    E: Mesleki şüphecilik denetimin planlanmasında sürdürülür; yürütme aşamasında ise yönetimin geçmişteki davranışı esas
      alınır ve şüpheciliğin düzeyi buna göre azaltılır.
  dogru: B
  aciklama:
    dogru_neden: BDS 240 par. 13’e göre denetçi, yönetimin ve üst yönetimden sorumlu olanların doğruluk ve dürüstlükleri hakkındaki
      geçmiş tecrübesine bakmaksızın, hile kaynaklı önemli bir yanlışlık olabileceği ihtimalinin bilinciyle denetim boyunca
      mesleki şüpheciliğini sürdürür. Sorunsuz geçmiş şüpheciliği azaltmayı haklı kılmaz.
    celdiriciler:
      A: Par. 13 şüpheciliği geçmiş tecrübeye bağlamaz.
      C: Par. 13 geçmiş tecrübeye bakılmaksızın şüpheciliğin denetim boyunca sürdürülmesini ister; gevşetmeyi belgelemek bu
        yükümlülüğü ortadan kaldırmaz.
      D: Par. 13 hile ihtimalinin bilincini yalnızca yeni müşterilerle sınırlamaz.
