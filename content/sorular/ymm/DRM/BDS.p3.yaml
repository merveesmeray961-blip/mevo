    B: kredi sözleşmesinin yenilenmemesini ilave prosedür uygulamaksızın doğrudan önemli belirsizlik sayarak olumlu görüş
      dışında bir görüş verir
    C: yazıyı finansal tablo dipnotunda açıklanacak bir husus olarak not eder ve bunun dışında herhangi bir ilave denetim
      prosedürü uygulamaz
    D: yönetimin değerlendirmesini incelemenin planlama aşamasıyla sınırlı olduğunu kabul eder; denetimin sonraki aşamalarında
      yeni bir prosedür uygulamaz
    E: önemli belirsizlik bulunup bulunmadığına karar vermek için yönetimin planlarını değerlendirmek dâhil ilave prosedürler
      uygular ve kanıt elde eder
