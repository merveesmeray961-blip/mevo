- id: YMM-DRM-BDS-0107
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  tip: bilgi
  zorluk: 1
  kok: BDS 330’a göre denetim prosedürlerinin uygulanma zamanına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: “Önemli yanlışlık” riski yükseldikçe maddi doğrulama prosedürlerinin dönem sonuna yakın veya dönem sonunda uygulanması
      daha etkin olabilir.
    B: Denetim prosedürlerinin önceden bildirilmeden veya tahmin edilemeyen zamanlarda uygulanması, özellikle hile risklerine
      karşı daha uygundur.
    C: “Önemli yanlışlık” riski ne kadar yüksekse, denetçinin prosedürleri ara dönemde uygulayıp sonuçları dönem sonuna teşmil
      etmesi o kadar etkin olur.
    D: Prosedürlerin dönem sonundan önce uygulanması, önemli hususların erken safhada tespit edilip yönetimin yardımıyla çözülmesine
      yardımcı olabilir.
    E: Finansal tabloların dayanağı muhasebe kayıtlarıyla uygunluğunun veya mutabakatının sağlanması gibi bazı prosedürler
      yalnızca dönem sonunda veya sonrasında uygulanabilir.
  dogru: C
  aciklama:
    dogru_neden: BDS 330 A11’e göre risk yükseldikçe maddi doğrulama prosedürlerinin dönem sonuna yakın uygulanması ve tahmin
      edilemeyen zamanlarda denetim yapılması daha etkindir; özellikle kasıtlı yanlışlık veya manipülasyon riskinde denetçi,
      ara dönem sonuçlarının dönem sonuna teşmil edilmesine yönelik prosedürlerin etkin olmayacağına karar verebilir. Dolayısıyla
      ifade tersini söylediği için yanlıştır.
    celdiriciler:
      A: Doğru ifadedir; risk arttıkça dönem sonuna yakın uygulama daha etkin olabilir (A11).
      B: Doğru ifadedir; önceden bildirilmeyen prosedürler hile risklerinde daha uygundur (A11).
      D: Doğru ifadedir; erken uygulama önemli hususların erken tespitine yardımcı olabilir (A12).
      E: Doğru ifadedir; bazı prosedürler ancak dönem sonunda veya sonrasında uygulanabilir (A13).
  kaynaklar:
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. A11
    alinti: ara dönem denetim sonuçlarının dönem sonuna teşmil edilmesine yönelik denetim prosedürlerinin etkin olmayacağına
