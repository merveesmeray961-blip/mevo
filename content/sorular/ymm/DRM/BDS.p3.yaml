      dâhil olduğu bir hileden şüphelenen denetçi bu şüphelerini üst yönetimden sorumlu olanlara bildirir ve bu kişilerle
      denetimin tamamlanması için gerekli prosedürlerin niteliğini, zamanlamasını ve kapsamını müzakere eder; bu müzakerelerin
