    A.Ş.’nin denetiminde bağımsız denetçi, yönetimin dâhil olduğu bir hileden şüphelenmiştir. Mevzuat bu konuda iletişim kurulmasını
    yasaklamamaktadır. BDS 240’a göre denetçinin yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Şüphesini yönetimin uygun kademesindeki kişilere zamanında bildirir; hileye yönetim dâhil olsa bile üst yönetimden
      sorumlu olanlarla ayrıca iletişim kurması gerekmez.
    B: Şüphelerini üst yönetimden sorumlu olanlara bildirir; denetimin tamamlanması için gerekli prosedürlerin niteliğini,
      zamanlamasını ve kapsamını bu kişilerle müzakere eder.
    C: Şüphe kesinleşinceye kadar bildirimde bulunmaz; yeterli kanıt elde edildiğinde bulguyu denetçi raporunda açıklayarak
      yükümlülüğünü yerine getirmiş olur.
    D: Üst yönetimden sorumlu olanlara bildirir; ancak denetim prosedürlerinin niteliği ve kapsamına ilişkin müzakere denetçinin
      takdirinde olup mevzuat yasaklamasa da zorunlu değildir.
    E: Şüphesini önce denetim ekibi içinde müzakere eder; üst yönetimden sorumlu olanlara denetim tamamlandıktan ve rapor
      tarihinden sonra bildirir.
