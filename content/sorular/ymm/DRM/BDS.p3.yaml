- id: YMM-DRM-BDS-0046
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 3
  kok: 'BDS 570 uyarınca risk değerlendirme prosedürlerini uygulayan denetçi, yönetimin işletmenin sürekliliğini devam ettirme
    kabiliyetine ilişkin henüz bir değerlendirme yapmadığını belirlemiştir. Bu durumda denetçi, işletmenin sürekliliği esasının
    amaçlanan kullanımı hakkında yönetimle müzakerede bulunur ve ______.


    Boşluğa aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: ciddi şüphe oluşturabilecek olay veya şartlar bulunup bulunmadığını kendisi araştırır; belirlenirse yönetimden talepte
      bulunmaksızın değerlendirmeyi kendisi hazırlayarak yönetime sunar
    B: ciddi şüphe oluşturabilecek olay veya şartlar bulunup bulunmadığı konusunda yönetimi sorgular; belirlenirse yönetimden
      yazılı beyan almakla yetinir ve başka ilave prosedür uygulamaz
    C: ciddi şüphe oluşturabilecek olay veya şartlar bulunup bulunmadığı konusunda yönetimi sorgular; belirlenirse yönetimden
      bu değerlendirmenin yapılmasını talep eder ve ilave denetim prosedürlerine geçer
    D: ciddi şüphe oluşturabilecek olay veya şartlar bulunup bulunmadığı konusunda yönetimi sorgular; belirlenirse yönetimin
      sözlü açıklamalarına dayanarak önemli belirsizlik bulunmadığı sonucuna varır
    E: ciddi şüphe oluşturabilecek olay veya şartlar bulunup bulunmadığı konusunda yönetimi sorgular; belirlenirse değerlendirmenin
      yapılmasını doğrudan üst yönetimden sorumlu olanlardan talep eder
  dogru: C
  aciklama:
    dogru_neden: 'BDS 570 par. 10’a göre sürekliliğe ilişkin değerlendirmenin henüz yapılmamış olması durumunda denetçi, sürekliliği
      esasının amaçlanan kullanımı hakkında yönetimle müzakerede bulunur ve ciddi şüphe oluşturabilecek olay veya şartların
      mevcut olup olmadığı konusunda yönetimi sorgular. Par. 16(a)’ya göre ciddi şüphe oluşturabilecek olay veya şartlar belirlenmesi
      hâlinde ve yönetimce değerlendirme yapılmamışsa, ilave denetim prosedürleri kapsamında yönetimden bu değerlendirmenin
      yapılması talep edilir. Püf noktaları: (1) Değerlendirmeyi yapmak yönetimin sorumluluğudur, denetçi onun yerine geçmez;
      (2) olay veya şart belirlenmesi doğrudan görüş türünü değil, ilave prosedür yükümlülüğünü doğurur.'
    celdiriciler:
      A: Değerlendirmeyi yapmak yönetimin sorumluluğundadır; par. 10 yönetimle müzakere ve sorgulamayı, par. 16(a) ise yönetimden
        değerlendirme talep edilmesini öngörür, denetçi yönetimin yerine geçmez.
      B: Yönetimden yazılı beyan almak tek başına yeterli değildir; olay veya şart belirlenirse par. 16 uyarınca ilave prosedürler
        uygulanır ve yönetimden değerlendirmenin yapılması talep edilir.
      D: Yönetimin sözlü açıklaması önemli belirsizlik bulunmadığı sonucuna varmak için yeterli kanıt değildir; par. 16 ilave
        denetim prosedürlerini gerektirir.
      E: Par. 16(a) değerlendirmenin yönetimden talep edilmesini öngörür; bu talebin doğrudan üst yönetimden sorumlu olanlara
        yöneltilmesi hükümde yer almaz.
  kaynaklar:
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 10
    alinti: Bu değerlendirmenin henüz yapılmamış olması durumunda denetçi, işletmenin sürekliliği esasının amaçlanan kullanımı
      hakkında yönetimle müzakerede bulunur ve işletmenin sürekliliğini devam ettirme kabiliyetine ilişkin -tek başına veya
      toplu olarak- ciddi şüphe oluşturabilecek olay veya şartların mevcut olup olmadığı konusunda yönetimi sorgular
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. 16(a)
    alinti: Yönetimce işletmenin sürekliliğini devam ettirme kabiliyetine ilişkin bir değerlendirme yapılmamış olması durumunda,
      yönetimden bu değerlendirmenin yapılmasının talep edilmesi
