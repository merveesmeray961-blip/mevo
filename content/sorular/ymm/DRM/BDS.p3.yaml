- id: YMM-DRM-BDS-0050
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 3
  kok: Denetçi Tolga Bilgin, iç denetim fonksiyonu bulunan Anka Enerji A.Ş.’nin denetiminde hile riskleriyle ilgili sorgulama
    prosedürlerini planlamaktadır. Şirketin üst yönetimden sorumlu olanları denetim komitesi ve yönetim kurulu üyelerinden
    oluşmakta; bu kişilerin hiçbiri işletme yönetiminde icrai nitelikte görev üstlenmemektedir. BDS 240’a göre denetçinin
    sorgulamalara ilişkin yapması gerekenler aşağıdakilerden hangisidir?
  secenekler:
    A: Üst yönetimden sorumlu olanlar icrai görev üstlenmediğinden hile konusunda bu kişileri sorgulamaz; sorgulamayı yönetime
      ve iç denetim fonksiyonuna yöneltir.
    B: İç denetim fonksiyonu bulunduğundan hile risklerine ilişkin sorgulamayı iç denetime yöneltir; yönetimin sorgulanması
      iç denetimden alınan cevaplar tutarsızsa gerekir.
    C: Yönetimi, iç denetim fonksiyonundaki uygun kişileri ve üst yönetimden sorumlu olanları sorgular; sorgulamalar yönetimin
      cevaplarının doğrulanmasına da hizmet eder.
    D: Yönetimi ve iç denetim fonksiyonunu sorgular; üst yönetimden sorumlu olanları ise yalnızca yönetimin cevaplarında tutarsızlık
      saptandığında sorgular.
    E: Yönetimin sorgulanmasını iç denetim fonksiyonunun sorgulanmasıyla birleştirerek tek görüşmeyle yapar; üst yönetimden
      sorumlu olanları sorgulamak yerine onlardan yazılı beyan alır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 240 par. 18-19 denetçinin hile risklerine ve bilinen, şüphelenilen veya iddia edilen hilelere ilişkin
      olarak yönetimi, par. 20 ise iç denetim fonksiyonu bulunan işletmelerde bu fonksiyondaki uygun kişileri sorgulamasını
      gerektirir. Üst yönetimden sorumlu olanların tamamı icrai görev üstlenmiyorsa denetçi, par. 21 uyarınca bu kişilerin
      gözetimini anlar, par. 22 uyarınca hile hakkındaki bilgileri sorgular ve bu sorgulamalar yönetimin cevaplarının doğrulanması
      için kullanılır. Püf noktaları: (1) Üç grup (yönetim, iç denetim, icrai olmayan üst yönetimden sorumlular) birbirinin
      yerine geçmez; (2) üst yönetimden sorumlu olanların sorgulanması cevapların tutarsızlığına bağlı değildir.'
    celdiriciler:
      A: Par. 22, üst yönetimden sorumlu olanların tamamının icrai görev üstlenmediği durumda bu kişilerin sorgulanmasını
        ister.
      B: Par. 19 yönetimin, par. 20 iç denetim fonksiyonundaki uygun kişilerin sorgulanmasını ayrı ayrı ister; biri diğerinin
        yerine geçmez.
      D: Par. 22 üst yönetimden sorumlu olanların hile konusunda sorgulanmasını yönetimin cevaplarındaki tutarsızlığa bağlamaz.
      E: Yönetimin, iç denetimin ve üst yönetimden sorumlu olanların sorgulanması ayrı yükümlülüklerdir; yazılı beyan alınması
        sorgulamanın yerine geçmez.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 20
    alinti: İç denetim fonksiyonu bulunan işletmelerde denetçi, işletmeyi etkileyen gerçekleşmiş, şüphelenilen veya iddia
      edilen herhangi bir hile hakkında bilgilerinin olup olmadığını belirlemek ve hile riskleri hakkında görüşlerini almak
      amacıyla iç denetim fonksiyonunda yer alan uygun kişileri sorgular
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 19
