  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: uygulama
  zorluk: 3
  kok: Denetçi Gül Tekin, Mercan Elektrik A.Ş.’nin ticari alacaklarına ilişkin müşteri teyit yanıtlarında, bir müşterinin
    bildirdiği bakiyenin işletmenin yardımcı defterindeki bakiyeden farklı olduğunu belirlemiştir. BDS 200 ve BDS 500’e göre
    denetçinin yapması gerekenler aşağıdakilerden hangisidir?
  secenekler:
    A: Teyit yanıtı dış kaynaktan geldiğinden yardımcı defter bilgisini yok sayar; başka bir prosedür uygulamaksızın farkı
      yönetime bildirmekle yetinir.
    B: Yardımcı defter işletme kayıtlarına dayandığından teyit yanıtını güvenilmez kabul eder ve yanıtı denetim kanıtı olarak
      değerlendirme dışında bırakır.
    C: Tutarsızlığı çözmek için prosedürlerde yapılacak değişiklik veya eklemelere karar verir ve sorunun denetimin diğer
      yönlerine etkisini değerlendirir.
    D: Fark önemlilik düzeyinin altında kalıyorsa tutarsızlığı araştırmaz; prosedürlerde değişiklik yapılması ancak fark önemlilik
      düzeyini aştığında gündeme gelir.
    E: Tutarsızlığı yalnızca iki kaynağın da dış kaynak olması hâlinde dikkate alır; kaynaklardan biri işletme içiyse işletme
      içi kaynağı esas alır.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 500 par. 11’e göre bir kaynaktan elde edilen kanıtın başka bir kaynaktan elde edilen kanıtla tutarsız
      olması hâlinde denetçi, sorunun çözülmesi için prosedürlerde ne tür değişiklikler veya eklemeler yapılacağına karar
      verir ve bu sorunların varsa denetimin diğer yönleri üzerindeki etkisini mütalaa eder. Bu, BDS 200 par. 17’deki yeterli
      ve uygun kanıtla denetim riskini kabul edilebilir düşük seviyeye indirme amacının gereğidir. Püf noktaları: (1) Par.
      11 tutarsızlığın giderilmesi için önemlilik eşiği beklemez; (2) hangi kaynağın üstün sayılacağına ilişkin mekanik bir
      kural yoktur, çözüm prosedürlerin değiştirilmesiyle aranır.'
    celdiriciler:
      A: Par. 11 tutarsızlığın yok sayılmasına değil, çözülmesine yönelik prosedür değişikliği veya eklemesine karar verilmesini
        ister.
      B: Par. 11 tutarsız kanıtı kanıt dışı bırakmayı değil, sorunu çözecek ek prosedürleri öngörür.
      D: Par. 11 tutarsızlık için önemlilik eşiği aramaz.
      E: Standartta kaynakların dış veya işletme içi olmasına göre mekanik bir üstünlük kuralı yoktur.
