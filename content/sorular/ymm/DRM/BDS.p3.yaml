  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: bilgi
  zorluk: 2
  kok: 'BDS 570 uyarınca, üst yönetimden sorumlu olanların tamamının işletme yönetiminde icrai nitelikte görev üstlenmediği
    durumlarda denetçi, işletmenin sürekliliğini devam ettirme kabiliyetine ilişkin ciddi şüphe oluşturabileceğini belirlediği
    olay veya şartlar hakkında ______ iletişim kurar. Bu iletişim, söz konusu olay veya şartların ______ oluşturup oluşturmadığını
    da içerir.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: yalnızca işletme yönetimiyle – ciddi bir iç kontrol eksikliği
    B: üst yönetimden sorumlu olanlarla – önemli bir belirsizlik
    C: iç denetim fonksiyonundaki kişilerle – önemli bir belirsizlik
    D: düzenleyici kurumlarla – denetim kapsamında bir sınırlama
    E: üst yönetimden sorumlu olanlarla – hile kaynaklı bir risk
  dogru: B
  aciklama:
    dogru_neden: BDS 570 par. 25’e göre üst yönetimden sorumlu olanların tamamının icrai görev üstlenmediği durumlarda denetçi,
      sürekliliğe ilişkin ciddi şüphe oluşturabileceğini belirlediği olay veya şartlar hakkında üst yönetimden sorumlu olanlarla
      iletişim kurar. İletişim; olay veya şartların önemli bir belirsizlik oluşturup oluşturmadığını, yönetimin sürekliliği
      esasını kullanmasının uygunluğunu, ilgili açıklamaların yeterliliğini ve varsa denetçi raporu üzerindeki etkileri içerir.
    celdiriciler:
      A: Par. 25 iletişimin muhatabını üst yönetimden sorumlu olanlar olarak belirler; iletişimin konusu da ciddi risk değil
        önemli belirsizliktir.
      C: Par. 25’te iletişim muhatabı iç denetim fonksiyonu değil, üst yönetimden sorumlu olanlardır.
      D: Par. 25 düzenleyici kurumlarla iletişim öngörmez; iletişim konusu da kapsam sınırlaması değildir.
      E: İlk boşluk doğrudur; ancak iletişimin kapsamındaki husus hile riski değil, olay veya şartların önemli belirsizlik
        oluşturup oluşturmadığıdır.
