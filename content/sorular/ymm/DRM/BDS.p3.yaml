- id: YMM-DRM-BDS-0089
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: kavrama
  zorluk: 2
  kok: 'BDS 560 “Bilanço Tarihinden Sonraki Olaylar” uyarınca denetçinin finansal tabloların yayımlanmasından sonra haberdar
    olduğu durumlara ilişkin aşağıdaki öncüllerden hangileri doğrudur?


    I. Yönetimin yayımlanmış finansal tablolarda değişiklik yapması hâlinde denetçi, daha önce yayımlanmış tabloların ve denetçi
    raporunun ulaştığı kişilerin değişiklikten haberdar edildiğinden emin olmak üzere yönetimin aldığı tedbirleri gözden geçirir.

    II. Finansal tabloların yayımlanmasından sonra, denetçi raporu tarihinde haberdar olsaydı raporunu değiştirmesine sebep
    olabilecek bir durumdan haberdar olan denetçi, yayımlanmış tablolarla ilgili hiçbir yükümlülüğü bulunmadığından konuyu
    yönetimle müzakere etmek zorunda değildir.

    III. Denetçinin finansal tablolarda değişiklik yapılmasını gerekli görmesine karşın yönetimin değişiklik yapmaması ve
    tabloların ulaştığı kişileri haberdar etmemesi hâlinde denetçi, gelecekte denetçi raporuna güvenilmesini engellemeye yönelik
    uygun adımları atacağını yönetime bildirir.

    IV. Yönetimin finansal tablolarda değişiklik yaptığı durumda denetçi, yeni veya değiştirilmiş denetçi raporuna Dikkat
    Çekilen Hususlar paragrafı veya Diğer Hususlar paragrafı koymaz.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I ve IV
    D: II ve III
    E: II ve IV
  dogru: B
  aciklama:
    dogru_neden: BDS 560 par. 15’e göre yönetim yayımlanmış tablolarda değişiklik yaparsa denetçi, tabloların ve raporun ulaştığı
      kişilerin haberdar edildiğinden emin olmak üzere yönetimin tedbirlerini gözden geçirir (I doğru). Par. 17’ye göre yönetim
      değişiklik yapmaz ve ilgili kişileri haberdar etmezse denetçi, gelecekte rapora güvenilmesini engellemeye yönelik adımları
      atacağını yönetime ve (uygunsa) üst yönetimden sorumlu olanlara bildirir (III doğru). Par. 14’e göre yayımdan sonra
      rapor tarihinde haberdar olsaydı raporunu değiştirmesine sebep olabilecek bir durumdan haberdar olan denetçi, konuyu
      yönetimle müzakere eder, değişiklik gerekip gerekmediğine karar verir ve yönetimi sorgular (II yanlış). Par. 16’ya göre
      yeni veya değiştirilmiş raporda Dikkat Çekilen Hususlar veya Diğer Hususlar paragrafına yer verilir (IV yanlış).
    celdiriciler:
      A: 'II yanlıştır: par. 14 bu durumda konunun yönetimle müzakere edilmesini ister; I doğrudur.'
      C: 'IV yanlıştır: par. 16 ilgili paragrafa yer verilmesini ister; I doğrudur.'
      D: II yanlıştır (par. 14); III doğrudur ancak I de doğru olduğundan birleşim eksiktir.
      E: II ve IV yanlıştır; I ve III doğrudur.
  kaynaklar:
  - mevzuat: BDS 560 Bilanço Tarihinden Sonraki Olaylar
    madde: par. 14
    alinti: Finansal tabloların yayımlanmasından sonra denetçinin, bu finansal tablolarla ilgili herhangi bir denetim prosedürünü
      uygulama yükümlülüğü bulunmaz
  - mevzuat: BDS 560 Bilanço Tarihinden Sonraki Olaylar
    madde: par. 15
    alinti: Daha önceden yayımlanmış finansal tabloların ve bunlara ilişkin denetçi raporunun ulaştığı kişilerin söz konusu
      değişiklikten haberdar edildiğinden emin olmak üzere yönetim tarafından alınan tedbirleri gözden geçirir
  - mevzuat: BDS 560 Bilanço Tarihinden Sonraki Olaylar
    madde: par. 16
    alinti: Denetçi, yeni veya değiştirilmiş denetçi raporunda; Dikkat Çekilen Hususlar paragrafı veya Diğer Hususlar paragrafına
