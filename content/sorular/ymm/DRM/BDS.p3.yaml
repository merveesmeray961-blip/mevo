      kabul ettiklerine; hile riski değerlendirmesinin sonuçlarını açıkladıklarına; yönetimin, iç kontrolde önemli görevleri
      bulunan çalışanların veya hile yapabilecek konumdaki diğer kişilerin dâhil olduğu hileler ile çalışanlar, düzenleyiciler
      veya başkalarınca bildirilen hile iddialarına ilişkin bildiklerini açıkladıklarına dair yazılı beyan alır.
