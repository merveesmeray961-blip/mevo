      çıkarmaktadır.
    B: Hükmün uygulanması, denetim ücretinin ilk öngörülen tutardan yüksek gerçekleşmesine ve denetimin daha uzun sürmesine
      yol açacaktır.
    C: Hükmün zorunlu kıldığı belirli bir prosedür, denetimin yürütüldüğü şartlarda hükmün amacına ulaşmada yetersiz kalmaktadır.
    D: Hüküm özel bir prosedür içermemekte, genel bir amaca ilişkin olmakta ve denetçi bu hükmü denetimde gereksiz bulmaktadır.
    E: Denetim süresinin kısıtlı olması nedeniyle hükmün zorunlu kıldığı prosedürün uygulanması güçleşmiş, ancak imkânsız
      olmamıştır.
