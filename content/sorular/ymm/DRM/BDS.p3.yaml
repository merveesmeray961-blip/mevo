  kok: Bağımsız denetçi, Kuzey Enerji A.Ş.’nin denetiminde, hile kaynaklı olduğundan şüphelendiği bir yanlışlık nedeniyle
    denetime devam etme imkânının sorgulanmasına yol açan istisnai bir durumla karşılaşmıştır. Yürürlükteki mevzuat denetimden
    çekilmeye izin vermektedir. BDS 240’a göre denetçinin yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Hile henüz şüphe düzeyinde olduğundan denetime olağan biçimde devam eder; çekilme veya yetkili kuruma rapor etme konusunu
      hile kesinleştiğinde değerlendirir.
    B: Yönetimle ve üst yönetimden sorumlu olanlarla müzakere etmeden denetimden çekilir; çekilme gerekçelerini denetçinin
      seçimini yapan kişilere bildirir.
    C: Mesleki ve yasal sorumluluklarını belirler, çekilmenin uygunluğunu mütalaa eder; çekilirse bunu ve gerekçelerini yöneticilerle
      ve üst yönetimden sorumlu olanlarla müzakere eder.
    D: Çekilme kararını, yönetimle ve üst yönetimden sorumlu olanlarla müzakere etmeden önce düzenleyici kuruma bildirir;
      ardından yönetimle ayrıca müzakereye gerek duymaz.
    E: Çekilme kararını denetim sözleşmesindeki ücret ve süre koşullarına göre verir; mesleki ve yasal sorumluluklarını belirlemesi
      veya rapor etme yükümlülüğünü değerlendirmesi gerekmez.
  dogru: C
  aciklama:
    dogru_neden: BDS 240 par. 39’a göre denetçi, seçimini yapan kişi ya da kişilere veya düzenleyici kurumlara durumu rapor
      etme zorunluluğunun bulunup bulunmadığı dâhil mesleki ve yasal sorumluluklarını belirler; mevzuatın izin vermesi hâlinde
      denetimden çekilmenin uygun olup olmadığını mütalaa eder; çekilmesi hâlinde uygun kademedeki yöneticilerle ve üst yönetimden
      sorumlu olanlarla çekilmesini ve gerekçelerini müzakere eder ve rapor etme yükümlülüğünün bulunup bulunmadığına karar
      verir.
    celdiriciler:
      A: Par. 39 hile kaynaklı olduğundan şüphelenilen yanlışlık nedeniyle istisnai durumla karşılaşan denetçiden de sorumluluklarını
        belirlemesini ister; kesinleşme beklenmez.
      B: Par. 39 çekilmenin ve gerekçelerinin uygun kademedeki yöneticilerle ve üst yönetimden sorumlu olanlarla müzakere
        edilmesini ister.
      D: Standart önce müzakereyi, ardından rapor etme yükümlülüğünün bulunup bulunmadığına karar verilmesini öngörür.
      E: Çekilme ücret koşullarına değil, mesleki ve yasal sorumluluklar çerçevesinde değerlendirilir.
