- id: YMM-DRM-BDS-0105
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 1
  kok: 'Yönetim, işletmenin sürekliliği esasının kullanılmasının uygun olmadığı sonucuna varıp finansal tabloları tasfiye
    esasına göre hazırlamıştır. Denetçi bu esasın içinde bulunulan şartlarda kabul edilebilir bir muhasebe esası olduğuna
    karar vermiştir ve finansal tablolarda esasa ilişkin yeterli açıklama bulunmaktadır. BDS 570’e göre denetçi ______ görüş
    bildirebilir; kullanıcıların dikkatini kullanılan alternatif esasa çekmek için BDS 706’ya uygun olarak raporuna ______
    paragrafı eklemeyi uygun veya gerekli görebilir.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: sınırlı olumlu – Dikkat Çekilen Hususlar
    B: olumlu – Kilit Denetim Konuları
    C: olumsuz – Dikkat Çekilen Hususlar
    D: görüş vermekten kaçınma – Diğer Hususlar
    E: olumlu – Dikkat Çekilen Hususlar
  dogru: E
  aciklama:
    dogru_neden: BDS 570 A27’ye göre sürekliliği esasının uygun olmadığı durumda yönetim tasfiye esası gibi başka bir esası
      kullanabilir; denetçi, esasın kabul edilebilir olduğuna karar vermesi ve yeterli açıklamanın bulunması şartıyla olumlu
      görüş bildirebilir ve kullanıcıların dikkatini alternatif esasa çekmek için BDS 706’ya uygun olarak Dikkat Çekilen Hususlar
      paragrafı ekleyebilir.
    celdiriciler:
      A: Esas kabul edilebilir ve açıklama yeterli olduğundan sınırlı olumlu görüşü gerektiren bir sebep yoktur.
      B: Kilit denetim konuları BDS 701’in konusudur; BDS 706’ya uygun olarak eklenebilecek paragraflar Dikkat Çekilen Hususlar
        ve Diğer Hususlar paragraflarıdır.
      C: Olumsuz görüş, finansal tabloların sürekliliği esasına göre hazırlandığı ancak bu esasın uygun olmadığı durumdadır
        (par. 21); burada tablolar zaten tasfiye esasına göre hazırlanmıştır.
      D: Yeterli ve uygun kanıt elde edilmiş olduğundan görüş vermekten kaçınmayı gerektiren bir durum yoktur.
  kaynaklar:
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. A27
    alinti: Denetçi, söz konusu finansal tabloların hazırlandığı esasa ilişkin yeterli açıklamanın (bu tablolarda) bulunması
      şartıyla bu finansal tablolar hakkında olumlu görüş bildirebilir
  - mevzuat: BDS 570 İşletmenin Sürekliliği
    madde: par. A27
    alinti: Dikkat Çekilen Hususlar paragrafı eklemeyi uygun veya gerekli görebilir
