  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi
    madde: par. 18
    alinti: sorumlu denetçi hangi konuların söz konusu üyelere bildirileceğine karar verir
  - mevzuat: BDS 550 İlişkili Taraflar
    madde: par. 12
