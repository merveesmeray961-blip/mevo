  kok: 'BDS 505 “Dış Teyitler” uyarınca dış teyit prosedürlerinin sonuçlarına ilişkin aşağıdaki öncüllerden hangileri doğrudur?


    I. Teyit mektubuna yanıt verilmeyen her bir durumda denetçi, ihtiyaca uygun ve güvenilir denetim kanıtı elde etmek için
    alternatif denetim prosedürleri uygular.

    II. Denetçi, yeterli ve uygun kanıt elde etmek için olumlu bir teyit yanıtının gerekli olduğuna karar vermişse, yanıt
    alınamaması hâlinde de alternatif prosedürler ihtiyaç duyulan kanıtı sağlar.

    III. Denetçi, teyit yanıtlarındaki istisnaları, yanlışlık göstergesi olup olmadıklarına karar vermek amacıyla araştırır.

    IV. Denetçi, dış teyit sonuçlarını değerlendirirken ihtiyaca uygun ve güvenilir kanıt sağlandığını kabul eder; ilave kanıt
    gerekip gerekmediğini değerlendirmesi gerekmez.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I ve IV
    D: II ve III
    E: II ve IV
  dogru: B
  aciklama:
    dogru_neden: BDS 505 par. 12’ye göre yanıt verilmeyen her teyit mektubu için alternatif denetim prosedürleri uygulanır
      (I doğru). Par. 14’e göre istisnalar yanlışlık göstergesi olup olmadıklarına karar vermek amacıyla araştırılır (III
      doğru). Par. 13’e göre olumlu teyit yanıtının gerekli olduğu hâllerde alternatif prosedürler ihtiyaç duyulan kanıtı
      sağlayamaz (II yanlış). Par. 16’ya göre denetçi sonuçların ihtiyaca uygun ve güvenilir kanıt sağlayıp sağlamadığını
      veya ilave kanıt gerekip gerekmediğini değerlendirir (IV yanlış).
    celdiriciler:
      A: 'II yanlıştır: olumlu teyit yanıtının gerekli olduğu durumda alternatif prosedürler ihtiyaç duyulan kanıtı sağlayamaz
        (par. 13); III de doğrudur.'
      C: 'IV yanlıştır: par. 16 sonuçların kanıt sağlayıp sağlamadığının ve ilave kanıt gerekip gerekmediğinin değerlendirilmesini
        ister; III de doğrudur.'
      D: II yanlıştır (par. 13); III doğrudur ancak I de doğru olduğundan birleşim eksiktir.
