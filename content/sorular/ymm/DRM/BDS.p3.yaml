- id: YMM-DRM-BDS-0057
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  tip: uygulama
  zorluk: 3
  kok: Denetim ekibi, Pamuk Tekstil A.Ş.’nin denetimine ilişkin risk değerlendirmesi kapsamında müzakere toplantısı yapmış;
    ekibin iki yeni üyesi toplantıya katılamamıştır. BDS 315, BDS 240 ve BDS 550 hükümleri birlikte dikkate alındığında bu
    müzakereye ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Müzakere, yönetimin ve üst yönetimden sorumluların dürüst olduğuna ilişkin ekip kanaati olumluysa, tabloların hile
      kaynaklı yanlışlıklara açıklığı konusunu kapsam dışı bırakabilir.
    B: Müzakereye katılmayan denetim ekibi üyelerinin bulunması durumunda, bu üyelere hangi konuların bildirileceğine sorumlu
      denetçi karar verir; bu karar ekip üyelerine bırakılmaz.
    C: Sorumlu denetçi ve kilit ekip üyeleri, finansal raporlama çerçevesinin işletmenin durum ve gerçeklerine uygulanması
      ile finansal tabloların önemli yanlışlıklara açıklığını müzakere eder.
    D: Müzakerede, hilenin nasıl meydana gelebileceği dâhil, finansal tabloların nasıl ve nerede hile kaynaklı önemli yanlışlıklara
      açık olabileceği konusuna özel önem verilir.
    E: Müzakere, finansal tabloların ilişkili taraf ilişkileri ve işlemlerinden doğabilecek hile veya hata kaynaklı önemli
      yanlışlıklara açıklığının özel olarak değerlendirilmesini de içerir.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 240 par. 16’ya göre müzakere, denetim ekibi üyelerinin yönetimin veya üst yönetimden sorumlu olanların
      doğru ve dürüst olduğuna ilişkin kanaatlerinden bağımsız olarak yapılır; dolayısıyla olumlu kanaat hile açıklığı konusunu
      kapsam dışı bırakma gerekçesi olamaz. Diğer ifadeler BDS 315 par. 18 ve 17, BDS 240 par. 16 ve BDS 550 par. 12’de yer
      alır. Püf noktaları: (1) Müzakereye katılmayanlara aktarılacak konuları sorumlu denetçi belirler; (2) ilişkili taraflardan
      doğan hata ve hile açıklığı da müzakerenin özel olarak değerlendirilen konusudur.'
    celdiriciler:
      B: Doğru ifadedir; BDS 315 par. 18 bu kararı sorumlu denetçiye verir.
      C: Doğru ifadedir; BDS 315 par. 17 müzakerenin kapsamını bu iki konu olarak belirler.
      D: Doğru ifadedir; BDS 240 par. 16 hileye özel önem verilmesini ister.
      E: Doğru ifadedir; BDS 550 par. 12 ilişkili taraflardan doğan açıklığın özel olarak değerlendirilmesini müzakereye dâhil
        eder.
  kaynaklar:
