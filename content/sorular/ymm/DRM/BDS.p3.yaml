- id: YMM-DRM-BDS-0058
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Yeni Çağ Medya A.Ş.’nin ilk kez yürüteceği bağımsız denetiminde açılış bakiyelerine ilişkin prosedürlerini
    ve ilişkili taraflarla ilgili risk değerlendirmesini planlamaktadır. Önceki dönem finansal tabloları bir önceki denetçi
    tarafından denetlenmiştir. BDS 510 ve BDS 550’ye göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi, açılış bakiyeleriyle ilgili bilgi almak amacıyla, varsa açıklamalar dâhil en son finansal tabloları ve bu
    tablolara ilişkin önceki denetçinin raporunu okur.

    II. Açılış bakiyelerinde yansıtılan muhasebe politikalarının cari dönem finansal tablolarında tutarlı uygulanıp uygulanmadığına
    ilişkin kanıt elde edilmesi, yalnızca işletmenin muhasebe politikasını değiştirdiği durumlarda gereklidir.

    III. Önceki denetçinin görüşü olumlu görüş dışında bir görüşse denetçi, bu görüşe sebep olan hususun etkisini cari dönem
    finansal tablolarındaki önemli yanlışlık risklerinin değerlendirilmesi sırasında mütalaa eder.

    IV. Denetçi, işletmenin olağan iş akışı dışında gerçekleşen belirlenmiş önemli ilişkili taraf işlemlerini, ciddi risk
    doğurmayan işlemler olarak değerlendirir.'
  secenekler:
    A: Yalnız I
    B: II ve IV
    C: I ve III
    D: I, III ve IV
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'I doğrudur (BDS 510 par. 5). II yanlıştır: par. 8’e göre denetçi, açılış bakiyelerinde yansıtılan muhasebe
      politikalarının cari dönemde tutarlı uygulanıp uygulanmadığı veya politika değişikliklerinin uygun biçimde yapılıp yapılmadığı
      konusunda her durumda yeterli ve uygun kanıt elde eder. III doğrudur (par. 9). IV yanlıştır: BDS 550 par. 18’e göre
      olağan iş akışı dışında gerçekleşen belirlenmiş önemli ilişkili taraf işlemleri, önemli risklere yol açan işlemler olarak
      değerlendirilir. Püf noktaları: (1) Politika tutarlılığına ilişkin kanıt koşulsuzdur; (2) ilişkili taraflarla olağan
      dışı işlemler ciddi risk yönünde değerlendirilir.'
    celdiriciler:
      A: III de doğru olduğundan bu birleşim eksiktir.
      B: II ve IV yanlıştır; bu birleşim iki yanlış öncülden oluşur ve doğru öncülleri dışarıda bırakır.
      D: IV yanlış olduğundan bu birleşim hatalıdır (BDS 550 par. 18).
      E: II yanlış olduğundan bu birleşim hatalıdır (BDS 510 par. 8).
  kaynaklar:
  - mevzuat: BDS 510 İlk Bağımsız Denetimler – Açılış Bakiyeleri
    madde: par. 5
    alinti: Denetçi, açılış bakiyeleriyle ilgili bilgi almak amacıyla, -varsa- açıklamalar dâhil, en son finansal tabloları
      ve bu tablolara ilişkin önceki denetçinin raporunu okur
  - mevzuat: BDS 510 İlk Bağımsız Denetimler – Açılış Bakiyeleri
    madde: par. 8
    alinti: Denetçi, açılış bakiyelerinde yansıtılan muhasebe politikalarının cari dönem finansal tablolarında tutarlı bir
      şekilde uygulanıp uygulanmadığı
  - mevzuat: BDS 510 İlk Bağımsız Denetimler – Açılış Bakiyeleri
    madde: par. 9
    alinti: denetçi, bu görüşe sebep olan hususun etkisini
  - mevzuat: BDS 550 İlişkili Taraflar
    madde: par. 18
    alinti: işletmenin olağan iş akışı dışında gerçekleşen belirlenmiş önemli ilişkili taraf işlemlerini, önemli risklere
      yol açan işlemler olarak değerlendirir
  gecerlilik:
    baslangic: '2023-12-31'
