- id: YMM-DRM-BDS-0048
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  tip: uygulama
  zorluk: 3
  kok: Denetçi Okan Yıldız, Doruk Elektronik A.Ş.’nin 2025 yılı denetiminde, güvenmeyi planladığı bazı kontrollerin işleyiş
    etkinliğine ilişkin 2024 denetiminde elde ettiği kanıtları kullanmayı düşünmektedir. BDS 330’a göre önceki denetimlerden
    elde edilen kanıtların kullanımına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Kullanımın uygun olup olmadığına ve yeniden test süresine karar verirken genel BT kontrollerinin etkinliği ile kontrolün
      manuel veya otomatik olması gibi özelliklerinden doğan riskler dikkate alınır.
    B: Önceki denetimden itibaren kontrollerde önemli değişiklik olup olmadığına ilişkin kanıt, kontrol anlayışını doğrulamak
      için sorgulamayla birlikte gözlem veya tetkikle elde edilir.
    C: Önceki denetime ait kanıtların ihtiyaca uygunluğunun devamını etkileyen değişiklikler meydana gelmişse, ilgili kontroller
      cari denetimde mutlaka yeniden test edilir.
    D: Önceki denetime ait kanıtların uygunluğunu etkileyen değişiklikler söz konusu değilse kontroller en az her üç denetimden
      birinde test edilir; bazı kontroller ise her denetimde test edilir.
    E: Ciddi risk olduğuna karar verilen bir riske yönelik güvenilmek istenen kontrol, önceki denetimde etkin bulunmuş ve
      bir değişiklik olmamışsa, cari dönemde yeniden test edilmeksizin güvenilebilir.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 330 par. 15’e göre denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik güvenmek istiyorsa bu
      kontrolleri cari dönemde test eder; önceki denetim kanıtına dayanma imkânı bu kontroller için yoktur. Diğer ifadeler
      par. 13 ve 14’te yer alır. Püf noktaları: (1) Önceki denetim kanıtına dayanmanın genel kuralı (değişiklik yoksa en az
      her üç denetimden birinde test) ciddi risk kontrollerinde geçerli değildir; (2) değişiklik varsa süre beklenmeden cari
      denetimde test gerekir.'
    celdiriciler:
      A: Doğru ifadedir; par. 13 bu etkenleri (BT kontrolleri, kontrolün özelliklerinden kaynaklanan riskler) dikkate alınacak
        hususlar arasında sayar.
      B: Doğru ifadedir; par. 14 değişiklik olup olmadığına dair kanıtın sorgulamayla birlikte gözlem veya tetkikle elde edilmesini
        ister.
      C: Doğru ifadedir; par. 14’e göre ihtiyaca uygunluğu etkileyen değişiklik varsa kontroller cari denetimde test edilir.
      D: Doğru ifadedir; par. 14’e göre değişiklik yoksa en az her üç denetimden birinde test yapılır ve bazı kontroller her
        denetimde test edilir.
  kaynaklar:
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 15
    alinti: Denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik güvenmek istiyorsa, bu kontrolleri cari dönemde test
      eder
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 14
    alinti: Bu tür değişikliklerin söz konusu olmaması durumunda denetçi, en az her üç denetimden birinde kontrolleri test
      eder
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 14
    alinti: Denetçi, önceki denetime ait denetim kanıtlarının ihtiyaca uygunluğunun devam etmesini etkileyen değişiklikler
      meydana gelmesi durumunda cari denetimde kontrolleri test eder
