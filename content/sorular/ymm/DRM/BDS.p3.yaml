  kok: 'Denetçi, BDS 570 uyarınca planlama aşamasında yönetimin ön değerlendirmesinde ciddi şüphe oluşturabilecek bir olay
    veya şart bulunmadığını belirlemiştir. Denetimin ilerleyen aşamasında, işletmenin ana kredi sözleşmesinin vadesinde yenilenmeyeceğini
    bildiren bir banka yazısı denetçinin eline geçmiştir. Bu durumda denetçi, denetim boyunca bu tür kanıtlara karşı dikkatli
    olur ve ______.


    Boşluğa aşağıdakilerden hangisi gelmelidir?'
