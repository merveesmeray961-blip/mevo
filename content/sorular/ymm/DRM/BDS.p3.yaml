  kok: 'Finansal tablolarını bir uygunluk çerçevesine göre hazırlayan bir işletmenin denetiminde, sürekliliğe ilişkin ciddi
    şüphe oluşturabilecek bir belirsizlik söz konusudur. BDS 570’e göre bir belirsizliğin muhtemel etkisinin ______ ve gerçekleşme
    ihtimali, denetçinin muhakemesine göre belirsizliğin niteliği ve etkilerine ilişkin uygun açıklamaları gerektiriyorsa
    önemli bir belirsizlik söz konusudur. Bu çerçevede söz konusu açıklamalar, finansal tabloların ______ için aranır.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
