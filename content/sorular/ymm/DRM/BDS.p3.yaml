    I. Denetçi bir denetim örneklemini tasarlarken, denetim prosedürünün amacını ve örneklemin seçileceği anakitlenin özelliklerini
    mütalaa eder.

    II. Denetçi, örnekleme riskini kabul edilebilir düşük bir seviyeye indirmeye yetecek bir örneklem büyüklüğüne karar verir.

    III. Denetçi örneklemde yer alacak kalemleri, anakitledeki her bir örnekleme biriminin seçilme şansı olacak şekilde seçer.

    IV. Denetim prosedürü seçilen bir kaleme uygulanamıyorsa denetçi, prosedürü başka bir kalem üzerinde uygulamaz; kalemi
    örneklemden çıkarır ve örneklem büyüklüğünü buna göre azaltır.'
