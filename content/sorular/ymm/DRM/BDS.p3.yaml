- id: YMM-DRM-BDS-0044
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 315 ve 330 risk değerlendirmesi ve yanıtlar
  tip: uygulama
  zorluk: 3
  kok: Denetçi Ayşe Kaya, Kıyı Gıda A.Ş.’nin satış ve tahsilat süreçlerindeki kontrollere güvenmeyi planlamış ve bu kontrollerin
    işleyiş etkinliğine ilişkin kanıtı 30 Eylül 2025 tarihinde sona eren ara dönemde elde etmiştir. BDS 330’a göre denetçinin
    kontrol testlerine ilişkin yaptığı veya yapması gerekenler bakımından aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Kontrollerin dönem boyunca ilgili zamanlarda nasıl uygulandığına, tutarlılığına ve kimler veya hangi araçlarla uygulandığına
      ilişkin kanıt için sorgulamayla birlikte diğer prosedürleri de uygular.
    B: Maddi doğrulama prosedürleri sonucunda hiçbir yanlışlık tespit edilmemişse, bu durum test edilen yönetim beyanlarına
      ilişkin kontrollerin etkin işlediğine dair denetim kanıtı sağlar.
    C: Ara dönemden sonra bu kontrollerde meydana gelen önemli değişiklikler hakkında kanıt toplar ve ara dönemden sonra kalan
      dönem için toplanması gereken ilave kanıtları belirler.
    D: Güvenmek istediği kontrolleri, güvenmeyi planladığı belirli bir zaman için veya dönem boyunca test eder; bu seçimde
      elde etmeyi beklediği güvenceyi dikkate alır.
    E: Güvenmeyi düşündüğü kontrollerde sapma tespit ederse özel sorgulama yapar; ilave kontrol testlerinin veya maddi doğrulama
      prosedürleriyle yanıt vermenin gerekip gerekmediğine karar verir.
  dogru: B
  aciklama:
    dogru_neden: 'BDS 330 par. 16’ya göre maddi doğrulama prosedürleri sonucunda yanlışlık tespit edilmemiş olması, test edilen
      yönetim beyanlarına ilişkin kontrollerin etkin olduğuna dair denetim kanıtı sağlamaz; tersine tespit edilen yanlışlıklar
      kontrollerin etkin işlemediğine işaret edebilir. Diğer ifadeler sırasıyla par. 10, 12, 11 ve 17’de yer alan yükümlülüklerdir.
      Püf noktaları: (1) Yanlışlığın bulunmaması kontrol etkinliğinin kanıtı değildir, bulunması ise kontrol zayıflığının
      göstergesi olabilir; (2) ara dönem kanıtı kullanıldığında kalan döneme ilişkin ilave kanıt ve değişikliklere ilişkin
      kanıt şarttır.'
    celdiriciler:
      A: Doğru ifadedir; par. 10 kontrol testlerinde sorgulamayla birlikte diğer prosedürleri ve bu üç hususa ilişkin kanıtı
        öngörür.
      C: Doğru ifadedir; par. 12 ara dönem kanıtı için değişikliklere ilişkin kanıt toplanmasını ve kalan dönem için ilave
        kanıtların belirlenmesini ister.
      D: Doğru ifadedir; par. 11 güvenilen kontrollerin güvenmeyi planlanan zaman veya dönem için test edilmesini ister.
      E: Doğru ifadedir; par. 17 sapma durumunda özel sorgulama ve bu üç seçenek arasında karar verilmesini öngörür.
  kaynaklar:
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 16
    alinti: Ancak maddi doğrulama prosedürleri sonucunda yanlışlık tespit edilmemiş olması, test edilen yönetim beyanlarına
      ilişkin kontrollerin, etkin olduğuna dair denetim kanıtı sağlamaz
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 12
    alinti: Ara dönemden sonra bu kontrollerde meydana gelen önemli değişiklikler hakkında denetim kanıtı toplar
  - mevzuat: BDS 330 Bağımsız Denetçinin Risk Olarak Değerlendirilmiş Hususlara Karşı Yapacağı İşler
    madde: par. 17
    alinti: Güvenmeyi düşündüğü kontrollerde sapmalar tespit etmesi hâlinde denetçi, bu hususları ve muhtemel sonuçlarını
      anlamak üzere özel sorgulamalar yapar
