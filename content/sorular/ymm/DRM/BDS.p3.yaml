- id: YMM-DRM-BDS-0104
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: kavrama
  zorluk: 1
  kok: Denetçi, Doğa Market A.Ş.’nin denetiminde mağaza müdürünün kasa tahsilatlarını zimmetine geçirdiğine dair güçlü kanıtlar
    elde etmiştir. BDS 240’a göre denetçinin bu durumdaki konumu hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Denetçi, eylemin hile olduğuna dair yasal hüküm verir ve bu hükmü raporunda kesin bir sonuç olarak belirterek açıklar.
    B: Denetçi hilenin varlığından şüphelenebilir veya ender durumlarda tespit edebilir; ancak hilenin gerçekten olup olmadığına
      hüküm veremez.
    C: Hile çok geniş bir hukuki kavram olduğundan, bu tür bir eylem BDS’lerin amaçları açısından denetçiyi hiçbir şekilde
      ilgilendirmez ve araştırılmaz.
    D: Hata ile hileyi ayıran unsur tutarın büyüklüğüdür; tutar önemlilik düzeyinin altında kaldığı için eylem hile değil
      hata sayılır.
    E: Hile yalnızca yönetim tarafından yapılan kasıtlı eylemleri kapsar; çalışanların eylemleri BDS 240 bakımından hile sayılmaz.
  dogru: B
  aciklama:
    dogru_neden: BDS 240 par. 3’e göre denetçi, hilenin varlığından şüphelenebilir veya ender durumlarda hilenin varlığını
      tespit edebilir; ancak hilenin gerçekten olup olmadığına dair yasal bir hüküm veremez. Hata ile hileyi ayıran unsur
      kasıttır (par. 2) ve hile tanımına çalışanların eylemleri de girer (par. 12).
    celdiriciler:
      A: Denetçi, hilenin gerçekten olup olmadığına dair yasal bir hüküm veremez (par. 3).
      C: Denetçi, finansal tablolarda önemli bir yanlışlığa sebep olan hileyle ilgilenir (par. 3).
      D: Hata ile hileyi ayıran unsur eylemin kasıtlı yapılıp yapılmadığıdır (par. 2).
      E: Hile tanımı yönetimin yanı sıra çalışanları ve üçüncü tarafları da kapsar (par. 12).
