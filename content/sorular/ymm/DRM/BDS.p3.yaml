- id: YMM-DRM-BDS-0082
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: bilgi
  zorluk: 2
  kok: 'Denetçi, yönetimin işletmenin sürekliliği esasını kullanmasının uygun olduğu, ancak önemli bir belirsizliğin mevcut
    olduğu sonucuna varmıştır. BDS 570 uyarınca denetçi bu durumda finansal tablolarda; ciddi şüphe oluşturabilecek temel
    olay veya şartlar ile yönetimin bunları ele almaya ilişkin planlarının ______ açıklanıp açıklanmadığını ve önemli belirsizliğin
    mevcut olduğunun, dolayısıyla işletmenin olağan iş akışı içinde ______ mümkün olmayabileceğinin açık bir şekilde açıklanıp
    açıklanmadığını belirler.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: kısaca – varlıklarını yeniden değerlemesinin ve yükümlülüklerini ertelemesinin
    B: yeterince – faaliyetlerini sona erdirmesinin ve varlıklarını tasfiye etmesinin
    C: ayrıntılı biçimde – sermayesini artırmasının ve borçlarını yeniden yapılandırmasının
    D: yeterince – varlıklarından fayda sağlamasının ve yükümlülüklerini yerine getirmesinin
    E: eksiksiz ve ayrıntılı biçimde – temettü dağıtmasının ve yeni finansman bulmasının
  dogru: D
  aciklama:
    dogru_neden: BDS 570 par. 19’a göre denetçi, önemli belirsizliğin mevcut olduğu hâlde sürekliliği esasının kullanılmasını
      uygun bulursa finansal tablolarda (a) ciddi şüphe oluşturabilecek temel olay veya şartlar ile yönetimin planlarının
      yeterince açıklanıp açıklanmadığını ve (b) önemli belirsizliğin mevcut olduğunun, dolayısıyla işletmenin olağan iş akışı
      içinde varlıklarından fayda sağlamasının ve yükümlülüklerini yerine getirmesinin mümkün olmayabileceğinin açık bir şekilde
      açıklanıp açıklanmadığını belirler.
    celdiriciler:
      A: Standart açıklamaların yeterince yapılıp yapılmadığını arar; olağan iş akışında varlıklardan fayda sağlama ve yükümlülükleri
        yerine getirme ifadesi yeniden değerleme veya erteleme değildir.
      B: İlk boşluk doğrudur; ancak par. 19(b) işletmenin faaliyetlerini sona erdirmesini veya tasfiyeyi değil, varlıklarından
        fayda sağlamasının ve yükümlülüklerini yerine getirmesinin mümkün olmayabileceğini ifade eder.
      C: Ölçüt ayrıntı düzeyi değil, açıklamaların yeterliliğidir; ikinci boşluk da sermaye artırımı veya yeniden yapılandırmayı
        değil varlıklardan fayda sağlama ve yükümlülükleri yerine getirmeyi kapsar.
