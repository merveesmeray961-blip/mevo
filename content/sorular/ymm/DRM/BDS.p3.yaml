      yetkili bir kuruma rapor etmesini zorunlu kılıp kılmadığına ve içinde bulunulan şartlarda yetkili bir kuruma rapor edilmesinin
      uygun olup olmadığı konusunda sorumluluk yükleyip yüklemediğine karar verir.
    celdiriciler:
      A: Par. 44 hile tespit eden veya hileden şüphelenen denetçi için geçerlidir; kesinleşme beklenmez.
      B: Par. 44 doğrudan rapor etmeyi değil, mevzuat veya etik hükümlerin rapor etmeyi zorunlu kılıp kılmadığına karar verilmesini
        ister.
      C: Standart yönetimin onayını şart koşmaz; karar mevzuat ve etik hükümlerin değerlendirilmesine dayanır.
