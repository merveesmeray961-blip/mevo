- id: YMM-DRM-BDS-0043
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: uygulama
  zorluk: 3
  kok: Denetçi Selin Arda, Bora Mensucat A.Ş.’nin 2025 yılı finansal tablolarının denetimini yürütürken işletmenin finansal
    tablolarında muhasebe tahminlerinin yer aldığını belirlemiştir. Denetim ekibinin kıdemli üyesi, “Muhasebe tahminlerine
    ilişkin BDS 540 bizim denetimimizle ilgili sayılmaz; ayrıca uygulama ve diğer açıklayıcı hükümler bölümü bağlayıcı olmadığından
    yalnızca numaralı ana hükümleri okumamız yeterlidir” demiştir. BDS 200 hükümleri çerçevesinde aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: BDS 540’ın ilgili sayılması için denetim sözleşmesinde bu standarda açıkça atıf yapılmış olması gerekir; atıf yoksa
      denetçi standardın hükümleriyle bağlı değildir.
    B: BDS 540 ilgili sayılır; ancak denetçinin standardın amaçlarını anlaması için yalnızca ana hükümleri bilmesi yeterlidir,
      açıklayıcı hükümler ve uygulama bölümü bilgi niteliğindedir.
    C: Denetçi, ilgili standartlardan hangilerine uyacağını mesleki muhakemesine göre seçer; muhasebe tahminlerine ilişkin
      standardı uygulamamak da bu seçimin kapsamındadır.
    D: Muhasebe tahminlerine ilişkin şart mevcut olduğundan BDS 540 yürütülen denetimle ilgili kabul edilir; denetçi açıklayıcı
      hükümler ve uygulama bölümü dâhil standardın tamamına vâkıf olmalıdır.
    E: BDS 540 yalnızca tahminlerin finansal tablolar açısından önemli çıkması hâlinde ilgili hâle gelir; önemlilik değerlendirmesi
      tamamlanıncaya kadar standardın hükümlerine uyma yükümlülüğü doğmaz.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 200 par. 18’e göre denetçi denetimle ilgili tüm BDS’lere uyar ve yürürlükteki bir BDS’nin ele aldığı
      şartlar mevcutsa o BDS yürütülen denetimle ilgili kabul edilir; finansal tablolarda muhasebe tahminleri bulunduğundan
      BDS 540 ilgilidir. Par. 19’a göre denetçinin bir BDS’nin amaçlarını anlaması ve hükümlerini uygun biçimde yerine getirebilmesi
      için açıklayıcı hükümler ve uygulama bölümü dâhil BDS’nin tamamına vâkıf olması gerekir. Püf noktaları: (1) İlgililik,
      sözleşmede atıf yapılmasına veya denetçinin tercihine değil, standardın ele aldığı şartın varlığına bağlıdır; (2) “yalnızca
      ana hükümler yeterli” yaklaşımı par. 19 ile çelişir.'
    celdiriciler:
      A: Par. 18 ilgililiği standardın ele aldığı şartın mevcudiyetine bağlar; sözleşmede atıf aranmaz.
      B: Par. 19 açıklayıcı hükümler ve uygulama bölümü dâhil standardın tamamına vâkıf olmayı şart koşar.
      C: Par. 18’e göre denetçi denetimle ilgili tüm BDS’lere uyar; hangi standartlara uyacağını seçme serbestisi yoktur.
      E: Par. 18’de ilgililik için önemlilik koşulu aranmaz; şart mevcutsa standart ilgili kabul edilir.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: par. 18
    alinti: Denetçi, denetimle ilgili tüm BDS’lere uyar. Yürürlükte olan bir BDS’nin ele aldığı şartlar mevcut ise, söz konusu
      BDS’nin yürütülen denetimle ilgili olduğu kabul edilir
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: par. 19
    alinti: açıklayıcı hükümler ve uygulama bölümü dâhil, BDS’nin tamamına vâkıf olması gerekir
