- id: YMM-DRM-BDS-0045
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 3
  kok: Denetçi Ece Polat, Mavi Kablo A.Ş.’nin denetiminde satış faturalarını incelerken bir ihracat faturasına ekli sevk belgesindeki
    imzanın, aynı sevk belgesinin diğer sayfalarındaki imzadan farklı göründüğünü fark etmiştir. Muhasebe müdürü, faturanın
    depo çıkışıyla aynı gün düzenlendiğini ilk görüşmede, aradan birkaç gün geçtiğini ise ikinci görüşmede belirtmiştir. Denetçi,
    bu belge dışındaki hiçbir kayıt ve belgede aksini düşündüren bir bulguyla karşılaşmamıştır. BDS 240’a göre denetçinin
    yaklaşımı aşağıdakilerden hangisi olmalıdır?
  secenekler:
    A: Aksini düşündüren bulgu yoksa belgeleri gerçek kabul etmeyi sürdürür; imza farklılığı sahtelik inancı yaratırsa araştırmayı
      derinleştirir, tutarsız cevapları da araştırır.
    B: Belgelerin gerçekliğini değerlendirme konusunda eğitimli olmadığından tüm kayıt ve belgeleri baştan gerçek kabul etmez;
      her belge için bağımsız bir doğrulama yapmak zorundadır.
    C: Aksini düşündüren gerekçe bulunmadığından belgeleri ve cevapları gerçek kabul etmeyi sürdürür; tutarsızlığı not etmekle
      yetinir, denetim sonunda üst yönetimden sorumlulara bildirir.
    D: Muhasebe müdürünün ikinci cevabı daha sonra verildiğinden bu cevabı esas alır; ilk cevaptaki tutarsızlığı araştırması
      gerekmez, ancak imza farklılığını araştırır.
    E: Kayıt ve belgelerin gerçekliğini yalnızca belgeyi düzenleyen birimin yazılı teyidiyle kabul edebilir; imza farklılığı
      tek başına araştırma gerektirmez, tutarsız cevaplar ise önemsizdir.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 240 par. 14’e göre denetçi, aksini düşünmesini gerektiren bir gerekçe olmadığı sürece kayıt ve belgelerin
      gerçek olduğunu kabul edebilir; ancak tespitler bir belgenin gerçek olmayabileceğine veya bilgilerin tahrif edilmiş
      olabileceğine inanmasına yol açarsa araştırmalarını derinleştirir. Par. 15’e göre yönetimin sorgulanması sırasında alınan
      cevaplar tutarsızsa denetçi bu tutarsızlıkları araştırır. Püf noktaları: (1) Varsayılan kabul, belgeye ilişkin şüphe
      doğduğunda derinleştirilmiş araştırmaya dönüşür; (2) tutarsız cevapların araştırılması belge şüphesinden bağımsız ayrı
      bir yükümlülüktür.'
    celdiriciler:
      B: Par. 14 denetçiye, aksini düşünmesini gerektiren gerekçe yoksa belgeleri gerçek kabul etme imkânı tanır; her belge
        için bağımsız doğrulama zorunluluğu getirmez.
      C: Belgeye ilişkin şüphe doğduğunda araştırmanın derinleştirilmesi (par. 14) ve tutarsız cevapların araştırılması (par.
        15) gerekir; not edip bildirmek yeterli değildir.
      D: Par. 15 tutarsızlıkların araştırılmasını ister; sonraki cevabın esas alınması bu yükümlülüğü ortadan kaldırmaz.
      E: Par. 14’te belgelerin gerçekliği için düzenleyen birimin teyidi koşulu yoktur; tespit belge şüphesi doğuruyorsa araştırma
        derinleştirilir.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 14
    alinti: Denetçi, aksini düşünmesini gerektiren bir gerekçe olmadığı sürece kayıt ve belgelerin gerçek olduğunu kabul edebilir
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 14
    alinti: araştırmalarını derinleştirir
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 15
    alinti: Yönetim veya üst yönetimden sorumlu olanların sorgulanması sırasında alınan cevapların tutarsız olması hâlinde
      denetçi, bu tutarsızlıkları araştırır
