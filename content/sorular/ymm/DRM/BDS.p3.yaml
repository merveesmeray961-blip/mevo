  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 240 hile
  tip: uygulama
  zorluk: 2
  kok: Bağımsız denetçi, Çınar Tekstil A.Ş.’nin denetiminde satın alma biriminde çalışan bir personelin sahte tedarikçi faturalarıyla
    küçük tutarlı ödemeler yaptırdığını belirlemiştir. Yönetimin olaya karıştığına dair bir gerekçe yoktur ve tutar önemlilik
    düzeyinin çok altındadır; ancak denetçi yanlışlığın hile göstergesi olduğu sonucuna varmıştır. BDS 240’a göre denetçinin
    yaklaşımı aşağıdakilerden hangisidir?
  secenekler:
    A: Tutar önemlilik düzeyinin çok altında ve yönetim olaya karışmadığı için olayı münferit kabul eder; etkiyi ilgili satın
      alma hesaplarıyla sınırlı değerlendirir.
    B: Yanlışlığı yalnızca üst yönetimden sorumlu olanlara bildirmekle yetinir; denetim prosedürlerinin kapsamında herhangi
      bir değişiklik yapmaz.
    C: Yanlışlığın etkilerini, yönetimin beyanlarının güvenilirliği hariç, risk değerlendirmesi aşamasında değerlendirir ve
      sonraki aşamalara taşımaz.
    D: Yanlışlık düzeltildiği takdirde hile riski değerlendirmesini değiştirmez; yönetimden yazılı beyan alarak denetimi planlandığı
      biçimde sürdürür.
    E: Münferit olma ihtimalinin düşük olduğunu kabul ederek, yönetimin beyanlarının güvenilirliği dâhil etkileri denetimin
      tüm aşamaları için değerlendirir.
  dogru: E
  aciklama:
    dogru_neden: BDS 240 par. 36’ya göre yanlışlık belirleyen denetçi, bunun hile göstergesi olup olmadığını değerlendirir;
      gösterge varsa gerçekleşmiş hilenin münferit bir vaka olma ihtimalinin düşük olduğunu kabul ederek, başta yönetimin
      beyan ve açıklamalarının güvenilirliği olmak üzere denetimin tüm aşamalarına ilişkin etkileri değerlendirir. Tutarın
      küçük olması veya yönetimin karışmaması bu değerlendirmeyi ortadan kaldırmaz.
    celdiriciler:
      A: Par. 36 hilenin münferit olma ihtimalinin düşük olduğunu kabul etmeyi ister; etki yalnızca ilgili hesaplarla sınırlandırılmaz.
      B: Par. 36 etkilerin denetimin tüm aşamaları için değerlendirilmesini ister; bildirimle yetinmek yeterli değildir.
      C: Etkiler yönetimin beyanlarının güvenilirliği dâhil denetimin tüm aşamaları için değerlendirilir; risk değerlendirmesiyle
        sınırlı değildir.
      D: Düzeltme tek başına hile riski değerlendirmesinin korunması için yeterli değildir; etkiler yeniden değerlendirilir.
