- id: YMM-DRM-BDS-0051
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 3
  kok: 'Finansal tablo tarihi 30.06.2026 olan Orman Ürünleri A.Ş.’nin yönetimi, işletmenin sürekliliğini devam ettirme kabiliyetini
    finansal tablo tarihinden itibaren on beş aylık bir dönem için değerlendirmiştir; mevzuatta daha uzun bir değerlendirme
    dönemi öngörülmemiştir. BDS 570’e göre denetçi, yönetimin değerlendirmesini incelerken değerlendirme dönemini genişletme
    talebinde bulunmaz; ancak ______.


    Boşluğa aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: yönetimin değerlendirdiği dönemden sonrası için sürekliliğe ilişkin herhangi bir sorgulama yapma yükümlülüğü bulunmadığını
      kabul eder
    B: yönetimin değerlendirmesini finansal tablo tarihinden itibaren on iki aylık dönemin ötesine geçirmemesini talep eder,
      ek sorgulama yapmaz
    C: değerlendirmeyi finansal tablo tarihinden itibaren en az yirmi dört aylık dönemi kapsayacak şekilde genişletmesini
      şart koşar
    D: yönetimin değerlendirdiği dönemden sonrası için, ciddi şüphe oluşturabilecek olay veya şartlara ilişkin bildiği hususlarda
      yönetimi sorgular
    E: yönetimin değerlendirdiği dönemden sonrasına ilişkin sorgulamayı yalnızca finansal tablo tarihinden sonra bir olay
      gerçekleşmişse yapar
  dogru: D
  aciklama:
    dogru_neden: 'BDS 570 par. 13’e göre yönetimin değerlendirmesi finansal tablo tarihinden itibaren on iki aydan kısa bir
      süreyi kapsıyorsa denetçi, değerlendirmenin en az on iki aylık dönemi kapsayacak şekilde genişletilmesini talep eder;
      on beş aylık değerlendirme bu sınırın altında kalmadığından genişletme talebi doğmaz. Par. 15’e göre denetçi ayrıca
      yönetimin değerlendirdiği dönemden sonrası için ciddi şüphe oluşturabilecek olay veya şartlarla ilgili sahip olduğu
      bilgiler hakkında yönetimi sorgular. Püf noktaları: (1) On iki ay, genişletme talebi için asgari eşiktir, azami bir
      sınır değildir; (2) dönem sonrası sorgulaması, değerlendirme dönemi uzun da olsa ayrıca yapılır.'
    celdiriciler:
      A: Par. 15 değerlendirilen dönemin uzunluğundan bağımsız olarak dönem sonrası için yönetimin sorgulanmasını ister.
      B: Par. 13 en az on iki aylık bir dönemi arar; daha uzun bir değerlendirmenin kısaltılması talep edilmez.
      C: Par. 13’te yirmi dört aylık bir dönem yoktur; on iki aydan kısa değerlendirmeler on iki aya genişletilir.
      E: Par. 15 sorgulamayı finansal tablo tarihinden sonra olay gerçekleşmesi şartına bağlamaz.
  kaynaklar:
