      şansı). IV yanlıştır: par. 10’a göre denetim prosedürünün seçilen kaleme uygulanamaması durumunda denetçi, prosedürü
      bu kalemin yerini alan başka bir kalem üzerinde uygular.'
    celdiriciler:
      A: III de doğrudur (par. 8); bu birleşim eksiktir.
      B: IV yanlıştır (par. 10); ayrıca I ve III doğrudur.
      C: IV yanlıştır (par. 10); bu birleşim yanlış öncül içerir ve III’ü dışarıda bırakır.
      D: I de doğru öncüldür (par. 6); bu birleşim eksiktir.
