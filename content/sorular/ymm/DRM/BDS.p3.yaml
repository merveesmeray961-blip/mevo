  kok: 'BDS 550 “İlişkili Taraflar” uyarınca yönetim tarafından önceden belirlenmemiş veya açıklanmamış ilişkili taraflar
    ile ilişkili taraf işlemlerine ilişkin aşağıdaki öncüllerden hangileri doğrudur?


    I. Önceden belirlenmemiş ilişkili taraf ilişkilerinin mevcut olduğunu belirleyen denetçi, ilgili bilgileri denetim ekibinin
    diğer üyelerine denetimin sonunda iletir.

    II. Geçerli finansal raporlama çerçevesinde ilişkili taraf hükümleri bulunuyorsa, önceden belirlenmemiş ilişkili taraflar
    belirleyen denetçi, yönetimden yeni belirlenen ilişkili taraflarla gerçekleştirilmiş tüm işlemleri belirlemesini talep
    eder.

    III. Olağan iş akışı dışında gerçekleşen belirlenmiş önemli ilişkili taraf işlemlerinde denetçi, yönetimin açıkladığı
    ticari gerekçeyi kayda alır; ilişkilerin temelini oluşturan sözleşmeleri tetkik etmesi gerekmez.

    IV. Yönetimin, bir ilişkili taraf işleminin piyasa şartlarında gerçekleşen işlemlerle eşdeğer şartlarda yapıldığı anlamına
    gelecek bir beyanda bulunması hâlinde denetçi, bu beyanla ilgili yeterli ve uygun denetim kanıtı elde eder.'
