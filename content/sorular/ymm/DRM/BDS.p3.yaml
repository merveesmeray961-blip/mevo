- id: YMM-DRM-BDS-0053
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 500 serisi denetim kanıtı
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Sahil Ticaret A.Ş.’nin denetiminde dış teyit prosedürlerini ve muhasebe tahminlerini incelemektedir. BDS
    505 ve BDS 540’a göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi, önceki dönem muhasebe tahminlerinin sonuçlarını gözden geçirirken amacı, tahminlerin yapıldığı zamanda mevcut
    bilgilere dayandığında uygun olan önceki dönem yargıları hakkında şüphe oluşturmaktır.

    II. Yönetimin denetçinin teyit talebi göndermesine izin vermemesi hâlinde denetçi, yönetimin gerekçelerini sorgular ve
    gerekçelerin geçerliliği ile uygunluğu konusunda kanıt elde etmeye çalışır; ayrıca ihtiyaca uygun ve güvenilir kanıt elde
    etmek için alternatif prosedürler uygular.

    III. Denetçi, dış teyit talepleri üzerinde kontrol sahibi olmak ve bu kontrolü muhafaza etmek zorundadır; teyit edilecek
    bilgilere ve teyit edecek uygun tarafa karar verilmesi bu kontrolün kapsamındadır.

    IV. Bir teyit talebine verilen yanıtın güvenilir olmadığına karar verilmesi hâlinde denetçi, bu durumun hile riski dâhil
    ilgili önemli yanlışlık risklerinin değerlendirilmesi ile diğer prosedürlerin niteliği, zamanlaması ve kapsamı üzerindeki
    etkilerini değerlendirir.'
  secenekler:
    A: Yalnız II
    B: I ve III
    C: I, II ve IV
    D: II, III ve IV
    E: I, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'I yanlıştır: BDS 540 par. 14’e göre önceki muhasebe tahminlerinin gözden geçirilmesinde amaç, tahminler
      yapıldığı zamanda mevcut bilgilere dayandığında uygun olan önceki yargılar hakkında şüphe oluşturmak değildir. II doğrudur
      (BDS 505 par. 8). III doğrudur (par. 7). IV doğrudur (par. 11). Püf noktaları: (1) Önceki tahminlerin gözden geçirilmesi,
      yönetimin yargılarını yeniden sorgulamak için değil cari risklerin belirlenmesine yardım için yapılır; (2) yanıtın güvenilmez
      bulunması, yalnızca o teyit için değil, hile riski dâhil risk değerlendirmesi ve diğer prosedürler için de sonuç doğurur.'
    celdiriciler:
      A: III ve IV de doğru olduğundan bu birleşim eksiktir.
      B: I yanlıştır; ayrıca II ve IV doğru öncüllerdir.
      C: I yanlış olduğundan I’i içeren hiçbir birleşim doğru olamaz.
      E: I yanlış olduğundan I’i içeren hiçbir birleşim doğru olamaz; II doğru öncüldür.
  kaynaklar:
  - mevzuat: BDS 540 Muhasebe Tahminlerinin ve İlgili Açıklamaların Bağımsız Denetimi
    madde: par. 14
    alinti: Gözden geçirme faaliyetinde amaç, tahminlerin yapıldığı zamanda mevcut olan bilgilere dayandığında uygun olan
      önceki dönem muhasebe tahminlerine ilişkin varılmış yargılar hakkında şüphe oluşturmak değildir
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 8
    alinti: İzin vermeme kararıyla ilgili olarak yönetimin gerekçelerine ilişkin sorgulama yapar ve bu gerekçelerin geçerliliği
      ve uygunluğu konusunda denetim kanıtı elde etmeye çalışır
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 7
    alinti: dış teyit talepleri üzerinde, aşağıdakiler dâhil olmak üzere kontrol sahibi olmak ve bu kontrolü muhafaza etmek
      zorundadır
  - mevzuat: BDS 505 Dış Teyitler
