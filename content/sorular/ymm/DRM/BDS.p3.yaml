    I. Yönetimin, finansal tabloları hazırlama sorumluluğunu yerine getirdiğine ve ilgili tüm bilgileri sağladığına ilişkin
    zorunlu yazılı beyanları sunmaması hâlinde denetçi, BDS 705 uyarınca finansal tablolara ilişkin görüş vermekten kaçınır.

    II. Yönetimin dürüstlüğü konusunda yeterli şüphe bulunduğu ve zorunlu yazılı beyanların güvenilir olmadığı sonucuna varan
    denetçi, sınırlı olumlu görüş verir.

    III. Yazılı beyanlar, denetçiye hitaben yazılmış bir beyan mektubu şeklindedir.'
