- id: YMM-DRM-BDS-0052
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 200 genel ilkeler
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi Ahmet Güler, Kuzey Otomotiv A.Ş.’nin denetiminde iki hesabı birlikte planlamaktadır: yönetim beyanı düzeyinde
    “önemli yanlışlık” riskini yüksek değerlendirdiği ticari alacaklar ile riskini düşük değerlendirdiği peşin ödenmiş giderler.
    BDS 200 ve BDS 330’a göre denetçinin kanıt elde etme yaklaşımına ilişkin aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Her iki hesapta da denetim riskini kabul edilebilir düşük seviyeye indirecek yeterli ve uygun kanıt elde eder; riski
      yüksek olan ticari alacaklarda daha ikna edici kanıt arar.
    B: Peşin ödenmiş giderlerin riski düşük değerlendirildiğinden bu hesapta kanıt elde etmesi gerekmez; ikna edici kanıt
      yalnızca riski yüksek olan ticari alacaklar için aranır.
    C: Her iki hesapta da yeterli ve uygun kanıt elde eder; ancak risk düzeyi kanıtın ikna ediciliğini değil, yalnızca kanıt
      toplama işlemlerinin zamanlamasını etkiler.
    D: Her iki hesapta da yeterli ve uygun kanıt elde eder; riski yüksek ticari alacaklarda mutlak güvence sağlamak üzere
      denetim riskini sıfıra indirene kadar kanıt toplamayı sürdürür.
    E: Her iki hesapta da yeterli ve uygun kanıt elde eder; riski yüksek ticari alacaklarda kanıtın ikna edici olması aranmaz,
      kanıtın miktarını artırması yeterlidir.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 200 par. 17 uyarınca denetçi, makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir
      seviyeye indirmek amacıyla yeterli ve uygun denetim kanıtı elde eder; bu, hesabın risk düzeyinden bağımsız bir yükümlülüktür.
      BDS 330 par. 7(b)’ye göre değerlendirilen risk düzeyi ne kadar yüksekse o kadar fazla ikna edici kanıt elde edilir.
      Püf noktaları: (1) Makul güvence mutlak değil, yüksek ama sınırlı bir güvencedir; hedef sıfır risk değildir; (2) risk
      düzeyi kanıtın ikna ediciliğini artırır, azaltmaz.'
    celdiriciler:
      B: Makul güvence, riski düşük hesaplarda da yeterli ve uygun kanıt elde edilmesini gerektirir (BDS 200 par. 17).
      C: 'BDS 330 par. 7(b): değerlendirilen risk düzeyi yükseldikçe daha ikna edici kanıt elde edilir; etki yalnızca zamanlamayla
        sınırlı değildir.'
      D: Makul güvence mutlak güvence değildir; denetim riski sıfıra değil kabul edilebilir düşük seviyeye indirilir (BDS
        200 par. 17).
      E: BDS 330 par. 7(b) kanıtın ikna ediciliğinin artmasını ister; yalnızca miktarın artırılması yeterli değildir.
  kaynaklar:
  - mevzuat: BDS 200 Bağımsız Denetçinin Genel Amaçları ve Bağımsız Denetimin Bağımsız Denetim Standartlarına Uygun Olarak
      Yürütülmesi
    madde: par. 17
    alinti: Denetçi makul güvence sağlamak için denetim riskini kabul edilebilir düşük bir seviyeye indirmek amacıyla yeterli
