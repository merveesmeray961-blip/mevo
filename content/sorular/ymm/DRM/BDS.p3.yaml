- id: YMM-DRM-BDS-0055
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Bağımsız denetim standartları
  konu: BDS
  kazanim: BDS 570 işletmenin sürekliliği
  tip: uygulama
  zorluk: 3
  kok: 'Çınar Gıda A.Ş.’nin denetiminde denetçi, yönetimin sürekliliğe ilişkin değerlendirmesinin denetim sonucunda haberdar
    olduğu ilgili tüm bilgileri içerip içermediğini mütalaa etmiştir. Ciddi şüphe oluşturabilecek olay veya şartlar belirlenmiş;
    işletme, yönetimin geleceğe yönelik planlarının değerlendirilmesinde önemli bir unsur olan bir nakit akış tahmini hazırlamıştır.
    Denetçi bu tahmine ilişkin analizde, tahminin hazırlanması için üretilen temel verilerin güvenilirliğini değerlendirir
    ve ______.


    Boşluğa aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: tahmindeki varsayımların yönetimin planlarıyla tutarlı olup olmadığını inceler; varsayımlar için yeterli dayanak bulunup
      bulunmadığına karar vermesi gerekmez
    B: tahminin temelini oluşturan varsayımlar için yeterli dayanak (destek) bulunup bulunmadığına, yönetimin görüşüne bağlı
      kalmaksızın kendisi karar verir
    C: tahminin temelini oluşturan varsayımlar için yeterli dayanak bulunup bulunmadığına karar verilmesini yönetimden ister
      ve bu karara dayanarak ilave inceleme yapmaz
    D: varsayımların gerçekleşme olasılığını hesaplayan kendi nakit akış tahminini hazırlar ve denetim sonucunu yönetimin
      tahmininin yerine buna dayandırır
    E: tahminin önceki dönemlerde aynı yöntemle hazırlanıp hazırlanmadığını inceler; yöntem tutarlıysa varsayımlar için ayrıca
      dayanak araştırmasına gerek görmez
  dogru: B
  aciklama:
    dogru_neden: 'BDS 570 par. 16’ya göre işletmenin hazırladığı nakit akış tahminine ilişkin analiz, yönetimin planlarının
      değerlendirilmesinde önemli bir unsursa denetçi, tahminin hazırlanması için üretilen temel verilerin güvenilirliğini
      değerlendirir ve tahminin temelini oluşturan varsayımlar için yeterli dayanak (destek) olup olmadığına karar verir.
      Par. 14 uyarınca yönetimin değerlendirmesinin denetçinin haberdar olduğu ilgili tüm bilgileri içerip içermediği de ayrıca
      mütalaa edilir. Püf noktaları: (1) Hem verilerin güvenilirliği hem varsayımların dayanağı değerlendirilir, ikisinden
      biri yeterli değildir; (2) denetçi yönetimin tahmininin yerine kendi tahminini koymaz, yönetimin tahminini değerlendirir.'
    celdiriciler:
      A: Par. 16 varsayımların tutarlılığıyla yetinmez; varsayımlar için yeterli dayanak (destek) bulunup bulunmadığına denetçinin
        karar vermesini ister.
      C: Varsayımlar için yeterli dayanak bulunup bulunmadığına karar vermek denetçinin yükümlülüğüdür; yönetimin kararına
        dayanmak par. 16’nın öngördüğü prosedür değildir.
      D: Standart, denetçinin yönetimin tahmininin yerine kendi tahminini koymasını değil, yönetimin tahminini değerlendirmesini
        ister.
      E: Yöntem tutarlılığı varsayımlar için dayanak değerlendirmesinin yerini almaz; par. 16 dayanak bulunup bulunmadığına
        karar verilmesini ister.
