  kok: Bağımsız denetçi Elif Aras, Vadi Gıda A.Ş.’nin denetiminde dış teyit prosedürlerini uygulamıştır. Yönetim, denetçinin
    göndermek istediği tüm teyit taleplerine izin vermiştir. Denetçi, BDS 505’in “yönetimin denetçinin teyit talebi göndermesine
    izin vermemesi durumunda” uygulanacak hükümlerini bu denetimde uygulamamıştır. BDS 200’e göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Dış teyit prosedürleri uygulandığından BDS 505’in tüm hükümlerine, hükmün şartı gerçekleşmese de, uyulması zorunludur.
    B: Hüküm bir şarta bağlıdır ve bu şart mevcut olmadığından denetçinin söz konusu hükme uyma yükümlülüğü doğmamıştır.
    C: Denetçi, şartın gerçekleşmemesine rağmen hükmü ancak yönetimin yazılı onayıyla uygulamadan bırakabilir.
    D: Denetçi söz konusu hükmü uygulamadığı için raporunda denetimin BDS’lere uygun yürütüldüğünü belirtemez.
    E: Denetçi hükmü uygulamadığından, hükmün amacına ulaşmak için alternatif denetim prosedürleri uygulamak zorundadır.
  dogru: B
  aciklama:
    dogru_neden: BDS 200 par. 22’ye göre denetçi, bir BDS’nin tüm hükümlerine uyar; ancak (a) BDS’nin tamamı denetimle ilgili
      değilse veya (b) hüküm bir şarta bağlı olup bu şart mevcut değilse uyma yükümlülüğü doğmaz. BDS 505 par. 8’deki hükümler,
      yönetimin teyit talebi göndermesine izin vermemesi şartına bağlıdır; şart gerçekleşmediğinden hüküm uygulanmaz.
    celdiriciler:
      A: Par. 22(b) şartı mevcut olmayan şarta bağlı hükümleri kapsam dışı bırakır; BDS’nin geri kalan ilgili hükümlerine
        uyulur.
      C: Şart mevcut değilse yönetimin onayına gerek yoktur; yükümlülük zaten doğmamıştır.
      D: Şartı gerçekleşmeyen hükme uyulmaması, par. 20 anlamında bir uyumsuzluk oluşturmaz; rapor ifadesi engellenmez.
