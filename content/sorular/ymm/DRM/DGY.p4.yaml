- id: YMM-DRM-DGY-0002
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: sürekli mesleki geliştirme eğitimi
  tip: hesaplama
  zorluk: 2
  kok: YMM (P), üç yıllık dönemin ilk iki yılında sırasıyla 32 ve 38 kredi almıştır. Üç yıllık asgari toplamı sağlamak
    için üçüncü yılda en az kaç kredi alması gerekir?
  secenekler:
    A: '30'
    B: '40'
    C: '50'
    D: '60'
    E: '120'
  dogru: C
  aciklama:
    dogru_neden: 'Üç yılda en az 120 kredi gerekir: 120 − (32 + 38) = 50. Bu tutar yıllık 30 kredilik alt sınırı
      da karşılar.'
    celdiriciler:
      A: Yalnız yıllık alt sınır dikkate alınmıştır.
      B: Hesap hatasıdır.
      D: Üç yıllık doğrulanabilir eğitim alt sınırıdır.
      E: Önceki yıllarda alınan krediler düşülmemiştir.
    hesap_adimlari:
    - 'Alınan: 32 + 38 = 70'
    - 'Eksik: 120 − 70 = 50'
    - 50 ≥ 30 olduğundan sonuç 50
  kaynaklar:
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11
    alinti: yılda en az 30 kredilik ve her üç yılda en az 120 kredilik sürekli mesleki geliştirme eğitimi alması
  gecerlilik:
    baslangic: '2020-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc=max(30,120-(32+38))
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S3-DGY
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S3_DGY.yaml, satır 2
  - tarih: '2026-10-18'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
  - tarih: '2026-10-24'
    kim: bas-hakem
    ne: sayısal şıklar küçükten büyüğe sıralandı; doğru şık A → C.
