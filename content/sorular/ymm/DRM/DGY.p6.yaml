  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: Büroda çalıştırılabilecek kişiler
  tip: bilgi
  zorluk: 1
  kok: Çalışma Usul ve Esasları Hakkında Yönetmelik'e göre meslek mensuplarının işyerlerinde çalıştırabilecekleri kişilere
    ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Büro yoğunluğuna göre mesleki faaliyetle ilgisi bulunmayan işler için de her nitelikte yardımcı eleman çalıştırılabilir.
    B: Mesleği yapması yetkili mercilerce yasaklananlar, yalnızca yardımcı eleman olarak çalıştırılabilir; ruhsatlı olarak
      çalıştırılamazlar.
    C: Yardımcı eleman ancak mesleki faaliyet için gerekli ölçüde çalıştırılır; öncelik ruhsatlı meslek mensubu veya stajyerindir.
    D: Yanlarında yalnızca stajyer çalıştırabilirler; ruhsatlı bir meslek mensubunu ücretle çalıştırmaları yasaktır ve disiplin
      cezası gerektirir.
    E: Çalıştırılacak kişilerde öncelik, meslek mensubunun birinci derece yakınlarına aittir; yabancı uyruklu personel çalıştırılamaz.
  dogru: C
  aciklama:
    dogru_neden: Yönetmelik md. 22'ye göre meslek mensupları yalnız mesleki faaliyetlerini yapabilmek için gerekli yardımcı
      elemanları çalıştırabilir, mesleği yapması yasaklananları çalıştıramaz ve çalıştırılacak kişilerde öncelik ruhsatlı
      meslek mensubu veya stajyer meslek mensubundadır.
    celdiriciler:
      A: Yardımcı eleman yalnızca mesleki faaliyeti yapmak için gerekli olduğu ölçüde çalıştırılabilir; ilgisiz işler için
        çalıştırma serbestisi yoktur.
      B: Mesleği yapması yetkili mercilerce yasaklananlar yanlarında çalıştırılamaz; yardımcı eleman olarak dahi istihdam
        edilemezler.
      D: Yönetmelik ruhsatlı meslek mensubunun çalıştırılmasını yasaklamaz, aksine çalıştırmada öncelik ruhsatlı meslek mensubu
        ve stajyerdedir.
      E: Öncelik akrabalık ilişkisine değil, ruhsatlı meslek mensubu veya stajyer olma niteliğine bağlıdır; yabancı uyruklu
        personel yasağı da Yönetmelikte yer almaz.
