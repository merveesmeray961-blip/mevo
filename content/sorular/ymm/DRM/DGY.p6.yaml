- id: YMM-DRM-DGY-0020
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: Hizmet akdiyle çalışan meslek mensubunun unvan kullanımı
  tip: kavrama
  zorluk: 3
  kok: 'Ruhsat almış olup mesleki faaliyette bulunmayan ve başka bir kişi veya kuruluşa hizmet akdiyle bağlı çalışan meslek
    mensuplarının mesleki unvan kullanmasına ve yetkilerine ilişkin aşağıdaki öncüllerden hangileri doğrudur?


    I. Mesleğin konusuna giren alanlarda hizmet akdiyle çalışan meslek mensubu, çalıştığı işyerinin unvanını belirtmek koşuluyla
    sahip olduğu mesleki unvanı kullanabilir.

    II. Bu şekilde çalışan meslek mensubu, ilgili mevzuatta belirtilen haller saklı kalmak kaydıyla tasdik yapamaz ve mesleki
    yetkilerini kullanamaz.

    III. Mesleğin konusuna girmeyen bir alanda çalışan meslek mensubu, çalıştığı işyerinin unvanını belirtmek koşuluyla mesleki
    unvanını kullanabilir.

    IV. Ticari faaliyette bulunan meslek mensubunun mesleki unvan kullanması mümkün değildir.'
  secenekler:
    A: I ve II
    B: I, II ve IV
    C: I, III ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Çalışma Usul ve Esasları Yönetmeliği md. 61''e göre mesleğin konusuna giren alanlarda hizmet akdiyle çalışan
      meslek mensubu işyeri unvanını belirtmek koşuluyla mesleki unvanını kullanabilir (I), ancak saklı haller dışında tasdik
      yapamaz ve yetkilerini kullanamaz (II); mesleğin konusuna girmeyen alanda çalışan veya ticari faaliyette bulunan meslek
      mensubunun mesleki unvan kullanması mümkün değildir (III yanlış, IV doğru). Püf noktaları: Unvan kullanma izni yalnızca
      mesleğin konusuna giren alanlar için tanınmıştır; ''işyeri unvanını belirtme'' koşulu bu alanın dışına taşınamaz. Unvan
      kullanabilmek ile tasdik yapabilmek ayrı kavramlardır.'
    celdiriciler:
      A: IV de doğru olduğundan yalnızca I ve II ile sınırlı kalan kombinasyon eksiktir.
