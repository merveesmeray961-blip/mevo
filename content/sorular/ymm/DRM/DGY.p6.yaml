- id: YMM-DRM-DGY-0022
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: Tarifeye uyma ve ücretin yüzde oranıyla belirlenmesi
  tip: kavrama
  zorluk: 2
  kok: 'Ücretlerin Esasları Hakkında Yönetmelik''e göre tarifeler ve tarifeye uyma yükümlülüğü ile ilgili aşağıdaki öncüllerden
    hangileri doğrudur?


    I. Tarifelerde ücret hiçbir koşulda yüzde oranı biçiminde belirlenemez.

    II. Tarifedeki asgari miktarın altında kalan ücretle çalışmak yasaktır ve aksine hareket disiplin cezasını gerektirir.

    III. Meslek mensubu, tarifedeki belgeleri düzenlemek ve işleri yapmakla ücretin tümünü hak eder.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: Yönetmelik md. 11'e göre tarifedeki asgari miktar altında ücretle çalışmak yasaktır ve disiplin cezasını
      gerektirir (II doğru). Md. 12'ye göre meslek mensubu, tarifedeki belgeleri düzenlemek ve işleri yapmakla ücretin tümünü
      hak eder (III doğru). Md. 9'a göre yüzde oranı biçiminde ücret belirleme genel ilke olarak yasaktır; ancak hizmetin
      özelliğine göre tarifedeki ücret işin yüzdesi olarak belirlenebilir, dolayısıyla 'hiçbir koşulda' diyen I yanlıştır.
    celdiriciler:
      A: 'I yanlıştır: ''genel ilke'' yüzde oranı yasağıdır, ancak hizmetin özelliğine göre işin yüzdesi olarak belirleme
        mümkündür; II ve III ise doğrudur.'
      B: II doğrudur ancak III de doğru olduğundan 'yalnız II' eksik bir kombinasyondur.
      C: I yanlış olduğu için kombinasyon geçersizdir; III doğru olduğu hâlde dışarıda bırakılmıştır.
      E: I yanlıştır; yüzde oranı yasağı mutlak değil, genel ilkedir ve hizmetin özelliğine göre istisnası vardır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 9/2
    alinti: Tarifelerde genel ilke olarak yüzde oranı biçiminde ücret belirlenemez. Ancak, hizmetin özelliğine göre tarifelerdeki
      ücret, işin yüzdesi olarak belirlenebilir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 11
    alinti: Tarifedeki asgari miktar altında kalan ücretle çalışmak yasak olup; aksine hareket disiplin cezasını gerektirir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 12/3
    alinti: Meslek mensubu, tarifedeki belgeleri düzenlemek ve işleri yapmakla, ücretin tümünü hak eder.
