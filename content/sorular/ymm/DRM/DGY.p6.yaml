- id: YMM-DRM-DGY-0016
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: SMGE diğer faaliyetlerin kredi değeri
  tip: hesaplama
  zorluk: 3
  kok: 'Çalışanlar listesine kayıtlı yeminli mali müşavir Orhan Ersoy, 2025 yılında sürekli mesleki geliştirme eğitimi kapsamında
    aşağıdaki diğer faaliyetleri gerçekleştirmiştir:


    - Odanın düzenlediği ve Yönetmelikte sayılan programlar kapsamında yer alan üç seminere dinleyici olarak katılmıştır.

    - Odanın düzenlediği bir panelde konuşmacı olarak yer almıştır.

    - Akredite olmuş bir kurumun düzenlediği dört kursa katılmıştır.

    - Akredite olmuş meslekle ilgili bir teknik komitede görev almıştır.

    - Bir stajyere on ay boyunca mentorluk yapmıştır.

    - Mesleğin icrası için mevzuatta belge alma zorunluluğu bulunan ve eğitim konularıyla ilgili bir belgeyi, eğitim ve sınav
    sonucunda almıştır.


    Diğer faaliyetler için öngörülen üç yıllık üst sınırın aşılmadığı varsayıldığına göre bu faaliyetlerden 2025 yılında kaç
    kredi elde edilir?'
  secenekler:
    A: '32'
    B: '35'
    C: '36'
    D: '37'
    E: '40'
  dogru: D
  aciklama:
    dogru_neden: 'Yönetmelik md. 13''e göre: Oda semineri katılımı 3 × 3 = 9; Oda panelinde konuşmacılık 5; akredite kurum
      kursları 4 × 2 = 8; akredite teknik komite görevi 3; mentorluk ayda 1 kredi olmakla birlikte yıllık en çok 7; belge
      için 5. Toplam 9 + 5 + 8 + 3 + 7 + 5 = 37. Püf noktaları: Oda/Birlik etkinliğiyle akredite kurum etkinliğinin kredi
      değerleri farklıdır (3-5 ve 2-3); mentorluk on ay yapılsa bile yıllık sınır 7''dir; belge kredisi sınav sonucunda verilen
      belge içindir ve unutulmamalıdır.'
    celdiriciler:
      A: '32: Belge için elde edilen 5 kredi hesaba katılmamıştır; md. 13/1-g gereği sınav sonucunda verilen belge 5 kredi
        sağlar.'
      B: '35: Odanın panelindeki konuşmacılık 5 yerine 3 kredi sayılmıştır; 3 kredi akredite kuruluşlar için geçerlidir, Oda/Birlik
        etkinliğinde konuşmacılık 5 kredidir.'
      C: '36: Oda ve akredite kurum etkinliklerinin değerleri yer değiştirilmiştir (Oda semineri 2, akredite kurs 3, konuşmacılık
        3 sayılmıştır); doğrusu Oda için 3/5, akredite kurum için 2/3''tür.'
      E: '40: Mentorluk 10 ay × 1 = 10 kredi olarak alınmıştır; md. 13/1-d mentorluk kredisinin her yıl için 7''yi geçemeyeceğini
        öngörür.'
    hesap_adimlari:
    - 'Oda seminerleri: 3 × 3 = 9; Oda paneli konuşmacılığı: 5'
    - 'Akredite kurs: 4 × 2 = 8; akredite komite: 3'
    - 'Mentorluk: min(10 × 1; 7) = 7'
    - 'Belge: 5'
    - 'Toplam: 9 + 5 + 8 + 3 + 7 + 5 = 37'
  kaynaklar:
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-b
    alinti: benzeri etkinliklere katılım 3 kredi;
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-b
    alinti: bildiri sunma ile toplantı moderatörlüğü 5 kredi olarak değerlendirilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-c
    alinti: katılım 2 kredi; bunlara konuşmacı olarak katılma ya da bildiri sunma ile toplantı moderatörlüğü 3 kredi olarak
      değerlendirilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-ç
    alinti: katılım ve bunlarda görev alma 3 kredi olarak değerlendirilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-d
    alinti: d) Stajyer mentorluğu yapanlar mentorluk yaptıkları her ay için 1 kredi kazanırlar. Bu şekilde elde edilen krediler
      her yıl için 7 krediyi geçemez.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-g
    alinti: ve bir eğitim ve/veya sınav sonucunda verilen her bir belge için 5 kredi elde edilir.
  gecerlilik: &id001
    baslangic: '2023-03-29'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oda = 3*3 + 5

      akredite = 4*2 + 3

      mentor = min(10*1, 7)

      belge = 5

      sonuc = oda + akredite + mentor + belge'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim DRM_DGY_20261105_3.yaml, satır None
- id: YMM-DRM-DGY-0017
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: SMGE eğitim sertifikası
  tip: kavrama
  zorluk: 2
  kok: 'Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği''nde düzenlenen eğitim sertifikasına ilişkin aşağıdaki öncüllerden
    hangileri doğrudur?


    I. Sertifika, her bir üç yıllık eğitim süreci için ilk yılın tamamlanmasından itibaren meslek mensubunun kayıtlı olduğu
    oda tarafından verilir.

    II. Sertifikalar numara içerecek şekilde oda yönetim kurullarınca hazırlanır ve SÜRGEM''e gönderilir.

    III. Sertifikanın meslek ruhsatı ile birlikte işyerinde asılması, meslek mensubunun takdirine bırakılmış ihtiyari bir
    uygulamadır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: 'Yönetmelik md. 15/1''e göre sertifika her üç yıllık süreç için ilk yılın tamamlanmasından itibaren kayıtlı
      olunan oda tarafından verilir. Sertifikayı numaralı olarak hazırlayıp dijital ortamda Odalara gönderen SÜRGEM''dir;
      sertifikanın ruhsatla birlikte işyerinde asılması ise zorunludur. Püf noktaları: Hazırlayan merci (SÜRGEM) ile veren
      merci (Oda) farklıdır; her yılın kredisi SÜRGEM tarafından belirtilir ve ilgili yıl Oda tarafından vize edilir.'
    celdiriciler:
      B: 'II yanlıştır: Sertifikaları numara içerecek şekilde hazırlayan ve dijital ortamda Odalara gönderen SÜRGEM''dir;
        yön, Odadan SÜRGEM''e değil SÜRGEM''den Odalara doğrudur.'
      C: II yanlış olduğu için 'I ve II' kombinasyonu doğru değildir.
      D: II ve III'ün her ikisi de yanlıştır; III'te sertifikanın asılması zorunludur, ihtiyari değildir.
      E: Yalnız I doğru olduğundan üç öncülün birlikte doğru olduğu söylenemez; II ve III yanlıştır.
