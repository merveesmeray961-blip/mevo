    alinti: SÜRGEM tarafından numara içerecek şekilde hazırlanır
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 15/4
    alinti: meslek ruhsatı ile birlikte işyerlerinin görülebilecek yerlerinde asılı bulundurulması
