    alinti: ilk yılın tamamlanmasından itibaren kayıtlı oldukları oda tarafından “Eğitim Sertifikası” verilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
