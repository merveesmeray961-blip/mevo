- id: YMM-DRM-DGY-0021
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: İş sahibince işin devri ve muvafakat süresi
  tip: uygulama
  zorluk: 3
  kok: Çelik Lojistik A.Ş., zorunlu bir durum nedeniyle yıllık 120.000 TL ücretle sözleşme yaptığı yeminli mali müşavir Kerem
    Ulaş'ın faaliyetine ikinci bir meslek mensubunu da katmak istemiş ve bu isteğini yazılı olarak 5 Ekim 2026 Pazartesi günü
    Kerem Ulaş'a bildirmiştir. Kerem Ulaş, 20 Ekim 2026 Salı gününe kadar bu yazıya hiçbir cevap vermemiştir. Ücretlerin Esasları
    Hakkında Yönetmelik'e göre bu durumda aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Süre cevapsız geçtiğinden sözleşme sona ermiş sayılır ve şirket başka bir meslek mensubuyla yeni sözleşme yapabilir.
    B: Cevapsızlık örtülü muvafakat sayılır; ikinci meslek mensubu işe katılır ve 120.000 TL ücret iki meslek mensubu arasında
      paylaştırılır.
    C: Sözleşme sürer; şirket, muvafakat alınıncaya kadar süre sınırı olmaksızın ikinci meslek mensubuyla çalışamaz.
    D: Sözleşme kendiliğinden sona ermez; şirket yalnızca bir hafta önceden yazılı bildirimde bulunarak sözleşmeyi feshedebilir
      ve ücretin tamamını ödemekle yükümlü kalır.
    E: Sözleşme sona ermiş sayılır; ancak şirketin başka bir meslek mensubuyla yeni sözleşme yapabilmesi için odanın onayı
      gerekir.
  dogru: A
  aciklama:
    dogru_neden: 'Yönetmelik md. 19''a göre iş sahibi, zorunlu durumlarda faaliyete başka meslek mensubunu katmak isterse
      sözleşme yaptığı meslek mensubunun olurunu almak zorundadır. Muvafakat yazılı istemden itibaren bir hafta içinde verilmezse
      ya da bu süre cevapsız geçerse sözleşme sona ermiş sayılır ve iş sahibi başka bir meslek mensubuyla yeni bir sözleşme
      yapabilir. Bir hafta, 5 Ekim 2026 yazılı isteminden itibaren 12 Ekim 2026''da dolmuş, 20 Ekim''e kadar cevap gelmemiştir.
      Püf noktaları: Ücret tutarı sonucu etkilemez; sessizlik muvafakat değil sözleşmenin sona ermesi sonucunu doğurur. Bir
      hafta önceden yazılı bildirimle fesih ise meslek mensubunun sözleşme şartlarına uymaması hâline ilişkindir.'
    celdiriciler:
      B: Sessiz kalma muvafakat sayılmaz; aksine süre cevapsız geçerse sözleşme sona ermiş sayılır. Ücretin azaltılması veya
        paylaşılması da gündeme gelmez.
      C: Yönetmelik muvafakat için bir hafta gibi kesin bir süre öngörür ve sürenin cevapsız geçmesi hâlinde sözleşmenin sona
        ermiş sayılacağını belirtir; süresiz bekleme yoktur.
      D: Bir hafta önceden yazılı bildirimle fesih, meslek mensubunun sözleşme şartlarına uymaması hâline ilişkindir; burada
        sözleşme sürenin cevapsız geçmesiyle zaten sona ermiş sayılır.
      E: Yönetmelik yeni sözleşme için odanın onayını aramaz; sözleşme sona erince iş sahibi başka bir meslek mensubuyla yeni
        sözleşme yapabilir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 19/2
    alinti: ya da bu süre cevapsız geçerse, sözleşme sona ermiş sayılır ve iş sahibi, başka bir meslek mensubu ile yeni bir
      sözleşme yapabilir.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 19/1
    alinti: iş sahibi, sözleşmedeki ücretin azaltılmasını ya da yeni meslek mensubu ile paylaşılmasını isteyemez.
  - mevzuat: Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik
    madde: md. 19/3
    alinti: bir hafta önceden yazılı olarak haber verilerek sözleşme fesh edilir ve iş başka bir meslek mensubuna devredilir.
