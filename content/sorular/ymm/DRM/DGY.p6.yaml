- id: YMM-DRM-DGY-0018
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek mensubunun diğer yükümlülükleri
  konu: DGY
  kazanim: SMGE sonradan kapsama dahil olma
  tip: uygulama
  zorluk: 2
  kok: Serbest muhasebeci mali müşavir Ayça Demirtaş, 2019 yılında ruhsat almış; ancak 2026 yılının Mart ayına kadar mesleki
    faaliyette bulunmamış ve sürekli mesleki geliştirme eğitimi yükümlülüğü bulunmayan meslek mensupları arasında yer almıştır.
    Ayça Demirtaş, 1 Nisan 2026'da büro açarak çalışanlar listesine yazılmış ve zorunlu eğitim kapsamındaki faaliyetlere başlamıştır.
    Bu durumda eğitim yükümlülüğüne ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yükümlülüğü 2027 yılının ilk günü başlar; 2026 yılı için hiçbir kredi şartı aranmaz ve geriye dönük eksik hesaplanmaz.
    B: 2026 yılı için de en az 30 kredi almak zorundadır; aksi hâlde yıl sonunda yükümlülüğünü tamamlamamış sayılır.
    C: 2026 yılına ilişkin yükümlülüğünü yalnızca 2026 yıl sonuna kadar tamamlayabilir; ilk yıl için 30 kredi şartı aranmaz.
    D: Yükümlülüğü 2026'da başlar; 2026'ya ilişkin eksik kredilerini 2027 yıl sonuna kadar tamamlaması yeterlidir, 30 kredi
      şartı aranmaz.
    E: Yükümlülüğü 2026'da başlar; 30 kredi şartı aranmaz, ancak 2026'ya ilişkin yükümlülük 2028 yıl sonuna kadar tamamlanmalıdır.
  dogru: E
  aciklama:
    dogru_neden: Yönetmelik md. 24/2'ye göre ruhsatlı olmasına rağmen çalışmayan meslek mensubunun eğitim yükümlülüğü, zorunlu
      eğitim kapsamındaki faaliyetlere başladığı yıl başlar; ilk yıl için en az 30 kredi şartı aranmaz, ancak işe başlanan
      yıla ilişkin yükümlülük takip eden iki yılda tamamlanmalıdır (2027 ve 2028).
    celdiriciler:
      A: Yükümlülük faaliyete başlanılan yılda, yani 2026'da başlar; izleyen yılın ilk gününe ertelenmez.
      B: İlk yıl için en az 30 kredi alma şartı aranmaz.
      C: İşe başlanan yıla ilişkin yükümlülük, takip eden iki yılda tamamlanabilir; yalnızca başlangıç yılıyla sınırlı değildir.
      D: Takip eden iki yıl 2027 ve 2028'dir; tamamlama süresi 2027 yıl sonunda değil 2028 yıl sonunda dolar.
  kaynaklar:
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 24/2
    alinti: faaliyete başladıkları yıl başlar.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 24/2
    alinti: ilk yıl için en az 30 kredi alma şartı aranmaz.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 24/2
    alinti: işe başladıkları yıla ilişkin eğitim yükümlülüklerini takip eden iki yılda tamamlamaları şarttır.
