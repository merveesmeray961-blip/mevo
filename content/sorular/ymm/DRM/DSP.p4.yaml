  tip: uygulama
  zorluk: 3
  kok: YMM (R), 2024 ve 2025 yıllarında iki ayrı kınama cezası almış; ilk ceza kesinleşip kendisine bildirilmiş,
    ikinci ceza ise itiraz üzerine henüz kesinleşmemiştir. (R) 2026'da yeniden kınamayı gerektiren bir eylemde bulunmuştur.
    Bu eylem için verilecek ceza konusunda doğru değerlendirme hangisidir?
  secenekler:
    A: Tekrarlama hükmü uygulanamaz; eylem kınama gerektirir.
    B: Üç yılda üçüncü kınama olduğundan geçici alıkoyma zorunludur.
    C: Tekrarlama nedeniyle doğrudan meslekten çıkarma verilir.
    D: Yeminli sıfatını kaldırma cezası verilir.
    E: İkinci ceza kesinleşmediğinden yeni eylem için ceza verilemez.
  dogru: A
  aciklama:
    dogru_neden: 'Üç yılda üçüncü kez kınama gerektiren eylem geçici alıkoymayı gerektirir (md. 7/a); ancak tekrarlama
      hâllerinin uygulanması için ilk iki cezanın kesinleşip ilgiliye bildirilmiş olması şarttır (md. 11). Bu şart
      sağlanmadığından eylem kendi niteliğine göre kınama gerektirir. Püf noktaları: tekrarlamada kesinleşme ve
      bildirim şartı aranır.'
    celdiriciler:
      B: Kesinleşme ve bildirim şartı sağlanmamıştır.
      C: Meslekten çıkarma bu fiil için öngörülmemiştir.
      D: Yeminli sıfatını kaldırma, tasdik yetkisinin gerçeğe aykırı kullanılmasının tekerrürüne bağlıdır.
      E: Önceki cezanın kesinleşmemesi yeni eylem için ceza verilmesine engel değildir.
