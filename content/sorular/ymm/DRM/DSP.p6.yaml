- id: YMM-DRM-DSP-0024
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Bildirim (tebligat) usulü
  tip: uygulama
  zorluk: 3
  kok: Aynı takvim yılı içinde yeminli mali müşavir Tolga Işık hakkında altı ayrı disiplin soruşturması açılmıştır. Tolga
    Işık’ın odaya bildirdiği adres doğrudur ve tebligat bu adreste alınabilmektedir; odaya kayıtlı elektronik posta adresi
    bildirmemiştir. Yedinci dosyada yapılacak bildirim için Disiplin Yönetmeliği’ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Adres doğru olduğundan bildirim yalnızca bildirilen adrese posta, kurye, memur veya noter aracılığıyla yapılabilir
    B: Oda e-Birlik yazılımı aracılığıyla bildirim gönderir; 15 gün içinde ilan tahtasına duyuru asılır, 10 iş günü ilan edilir
      ve ilanın indirilmesinden 15 gün sonra bildirim yapılmış sayılır
    C: Oda e-Birlik yazılımı aracılığıyla bildirim gönderir; 7 gün içinde duyuru asılır ve 5 iş günü ilan edilir; ilanın indirilmesinden
      itibaren 5 gün içinde başvurulmazsa bildirim yapılmış sayılır
    D: Oda e-Birlik yazılımı aracılığıyla bildirim gönderir; 7 gün içinde ilan tahtasına duyuru asılır ve 5 iş günü ilan edilir;
      ilanın asıldığı günden itibaren 5 gün içinde başvurulmazsa bildirim yapılmış sayılır
    E: Bildirim yapılamaz; çünkü kayıtlı elektronik posta adresi bulunmayan meslek mensubuna e-Birlik üzerinden bildirim gönderilemez
      ve soruşturma bu nedenle durur
  dogru: C
  aciklama:
    dogru_neden: 'Md. 34’e göre aynı yıl içinde açılmış beşten fazla disiplin soruşturması bulunan meslek mensubuna, adresi
      geçerli olsa bile, tüm bildirimler ikinci fıkradaki usule göre yapılır: e-Birlik bildirimi (ve varsa SMS), 7 gün içinde
      ilan tahtasına duyuru ve 5 iş günü ilan, ilanın **askıdan indirilmesinden** itibaren 5 gün içinde başvurulmazsa bildirimin
      yapılmış sayılması. Püf noktaları: (1) “Beşten fazla” eşiği: altı soruşturma bu eşiği aşar, adresin doğru olması sonucu
      değiştirmez; (2) 5 günlük sürenin başlangıcı ilanın asıldığı gün değil askıdan indirildiği gündür; (3) sayılar (7 gün,
      5 iş günü, 5 gün) birbirine karıştırılmamalıdır.'
    celdiriciler:
      A: Beşten fazla soruşturma bulunduğundan adres doğru olsa bile tüm bildirimler e-Birlik ve ilan usulüyle yapılır; posta
        ile bildirim zorunlu değildir.
      B: 'Süreler yanlıştır: duyuru 7 gün içinde asılır, ilan 5 iş günü sürer ve başvuru süresi 5 gündür; 15 gün, 10 iş günü
        ve 15 gün yönetmelikte yer almaz.'
      D: 5 günlük başvuru süresi ilanın asıldığı günden değil, askıdan indirilmesinden itibaren işler; bu seçenek başlangıç
        anını yanlış verir.
      E: Elektronik posta adresinin bulunmaması bildirimi engellemez; tam tersine bu hâlde e-Birlik yazılımı üzerinden bildirim
        yapılır ve soruşturma durmaz.
  kaynaklar:
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 34/last
    alinti: Bir meslek mensubu hakkında aynı yıl içerisinde açılmış beşten fazla disiplin soruşturması var ise o meslek mensubuna
      bu Yönetmelik hükümleri uyarınca yapılacak tüm tebligatlar ikinci fıkra hükümlerine göre yapılır.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 34/2-b
    alinti: b) (a) bendinde belirtilen işlemin yapılmasını takip eden 7 gün içerisinde odanın ilan tahtasına ilgiliye e-Birlik
      sisteminden bildirim gönderildiğine dair bir duyuru asılır ve 5 iş günü süreyle ilan edilir.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 34/2-c
    alinti: c) İlgili, ilanın askıdan indirilmesinden itibaren 5 gün içerisinde bildirimi almak için odaya başvurmamış ise
