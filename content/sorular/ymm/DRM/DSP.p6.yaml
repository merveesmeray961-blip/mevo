- id: YMM-DRM-DSP-0020
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Tedbir niteliğinde geçici mesleki faaliyetten alıkoyma
  tip: kavrama
  zorluk: 2
  kok: Disiplin Yönetmeliği’ne göre **tedbir niteliğinde** geçici olarak mesleki faaliyetten alıkoymaya ilişkin aşağıdaki
    öncüllerden hangileri doğrudur? I. Ceza soruşturması sırasında Cumhuriyet savcılığının talebi üzerine oda disiplin kurulu
    kararıyla uygulanabilir. II. Disiplin kurullarının tedbir kararlarına karşı ilgililer idari yargı mercilerine başvurabilir.
    III. Tedbir uygulanan dosyalar yönetim ve disiplin kurullarınca öncelikle incelenip karara bağlanır. IV. Tedbir yalnızca
    meslekten çıkarma cezasını gerektiren eylemler için uygulanabilir.
  secenekler:
    A: I, II ve III
    B: I ve II
    C: II, III ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: Md. 30’a göre geçici alıkoyma veya meslekten çıkarma cezasını gerektirecek nitelikte bir eylem nedeniyle
      soruşturma ya da kovuşturma yapılan meslek mensubu, son karar verilene kadar tedbir olarak alıkonulabilir; ceza soruşturmasında
      savcılık talebiyle oda disiplin kurulu kararıyla uygulanabilir (I). Tedbir kararları kesindir ancak idari yargıya başvurulabilir
      (II) ve tedbirli dosyalar öncelikle karara bağlanır (III). Tedbir yalnızca meslekten çıkarma gerektiren eylemlerle sınırlı
      değildir; geçici alıkoyma gerektiren eylemler de kapsamdadır (IV yanlış).
    celdiriciler:
      B: III numaralı öncül de doğrudur; 2026 değişikliğiyle tedbir uygulanan dosyaların yönetim ve disiplin kurullarınca
        öncelikle karara bağlanması öngörülmüştür.
      C: IV numaralı öncül yanlıştır; tedbir, geçici olarak mesleki faaliyetten alıkoyma veya meslekten çıkarma cezasını gerektirecek
        nitelikteki eylemler için uygulanır. Ayrıca I numaralı öncül de doğrudur ve bu seçenekte yer almamaktadır.
      D: II numaralı öncül doğrudur ve seçenekte yer almamaktadır; IV numaralı öncül ise yanlıştır, tedbir yalnızca meslekten
        çıkarma gerektiren eylemlerle sınırlı değildir.
      E: IV numaralı öncül yanlıştır; tedbir yalnızca meslekten çıkarma cezası gerektiren eylemlerle sınırlı olmadığından
        dört öncülün birden doğru olduğu söylenemez.
  kaynaklar:
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 30/3
    alinti: ilgili oda yönetim kurulunun isteği ve bu isteğin disiplin kurulunca uygun görülmesi veya disiplin kurulunun gerekli
      gördüğü hallerde, son karar verilene kadar, tedbir niteliğinde geçici olarak mesleki faaliyetten alıkonulabilir.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 30/3
    alinti: Ceza soruşturması sırasında da, Cumhuriyet savcılığının talebi veya oda yönetim kurulu-nun Cumhuriyet savcılığından
      isteyeceği bilgi üzerine oda disiplin kurulu kararıyla bu tedbir uygulanabilir.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 30/3
    alinti: Disiplin kurullarının tedbir niteliğinde geçici olarak mesleki faaliyetten alıkoymaya ilişkin kararları kesindir.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 30/3
    alinti: Tedbir uygulanan dosyalar yönetim ve disiplin kurullarınca öncelikle incelenip karara bağlanır.
