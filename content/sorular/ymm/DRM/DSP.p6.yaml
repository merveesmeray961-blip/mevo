- id: YMM-DRM-DSP-0019
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Disiplin soruşturmasının açılması
  tip: kavrama
  zorluk: 2
  kok: Disiplin Yönetmeliği’ne göre meslek mensupları hakkında disiplin soruşturması yapılmasına ilişkin aşağıdaki öncüllerden
    hangileri doğrudur? I. Hükümlülükle sonuçlanan bir ceza davasının sonucunun odaya ulaşması soruşturma yapılmasını gerektiren
    hâllerden biridir. II. Hazine ve Maliye Bakanlığının soruşturma istemi, meslek mensubu hakkındaki iddiaları içeren bir
    rapora veya yazıya dayanarak yapılır. III. Soruşturma sonunda disiplin kovuşturması açılıp açılmayacağına disiplin kurulu
    karar verir.
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ile III
    D: I ile II
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: Md. 15’e göre disiplin soruşturması, ilgilinin ihbar veya şikâyeti, oda ve Birlik kurullarının istemi, Bakanlık
      veya diğer kamu kurumlarının istemi ya da hükümlülükle sonuçlanan ceza davası sonucunun odaya ulaşması üzerine yapılır;
      Bakanlık istemi iddiaları içeren rapora veya yazıya dayanır (I ve II doğru). Soruşturma sonucunda kovuşturma açılıp
      açılmayacağına disiplin kurulu değil oda yönetim kurulu karar verir (III yanlış).
    celdiriciler:
      A: II numaralı öncül de doğrudur; Bakanlık istemi rapor veya yazıya dayanır. Bu nedenle yalnız I demek eksiktir.
      B: I numaralı öncül de doğrudur; hükümlülükle sonuçlanan ceza davasının sonucunun odaya ulaşması soruşturma sebeplerinden
        biridir.
      C: III numaralı öncül yanlıştır; kovuşturma açılıp açılmayacağına oda yönetim kurulu karar verir, disiplin kurulu ise
        kovuşturmayı yapar.
      E: III numaralı öncül yanlıştır; kovuşturma açma veya açmama kararı disiplin kuruluna değil oda yönetim kuruluna aittir.
  kaynaklar:
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 15/1
    alinti: Meslek mensupları hakkında disiplin kovuşturması açılması gerekip gerekmediğini anlamak amacıyla oda yönetim kurulunca
      disiplin soruşturması yaptırılır. Bu soruşturma sonucunda, disiplin kovuşturması açılmasına ya da açılmamasına oda yönetim
      kurulunca karar verilir.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 15/2
    alinti: e) Hükümlülükle sonuçlanan bir ceza davasının sonucunun odaya
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 15/3
    alinti: (d) bendi uyarınca yapılacak istem ise meslek mensubu hakkındaki iddiaları içeren bir rapora veya yazıya dayanarak
      yapılır.
