  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Meslekten ayrılma, ölüm ve soruşturma
  tip: kavrama
  zorluk: 1
  kok: Disiplin Yönetmeliği’ne göre aşağıdaki yeminli mali müşavirlerden hangisi hakkında **disiplin soruşturması yürütülebilir**?
  secenekler:
    A: Hakkında soruşturma sürerken vefat eden YMM Oğuz
    B: Eylemi sırasında odaya kayıtlı olup sonradan kaydını sildirerek meslekten ayrılan YMM Selin
    C: Hakkında soruşturma açılmadan önce akıl sağlığını sürekli kaybettiği raporla belgelenen YMM Tuncay
    D: Hakkında kovuşturma sürerken akıl sağlığını sürekli kaybettiği raporla belgelenen YMM Gülşen
    E: Soruşturma açılmadan önce vefat eden YMM Rıza
  dogru: B
  aciklama:
    dogru_neden: Disiplin Yönetmeliği md. 14’e göre meslekten ayrılma ve odadan kaydın silinmesi, mesleği ifa sırasındaki
      eylem ve davranışlar nedeniyle soruşturma ve kovuşturma yapılmasına veya ceza verilmesine engel değildir. Ölüm veya
      akıl sağlığının sürekli kaybı hâllerinde ise soruşturma açılmaz, açılmış olan soruşturma veya kovuşturma sonlandırılır.
    celdiriciler:
      A: Ölüm hâlinde açılmış olan soruşturma veya kovuşturma sonlandırılır; soruşturmanın sürmesi bu sonucu değiştirmez.
      C: Akıl sağlığının sürekli kaybı hâlinde soruşturma açılmaz.
      D: Akıl sağlığının sürekli kaybı hâlinde açılmış kovuşturma da sonlandırılır; kovuşturma aşamasında olması istisna oluşturmaz.
      E: Ölen meslek mensubu hakkında soruşturma açılmaz; ölüm kişisel sorumluluğu ortadan kaldırdığı için ilk aşamada işlem
        yapılamaz.
  kaynaklar:
