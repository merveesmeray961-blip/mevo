- id: YMM-DRM-DSP-0016
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Yeminli sıfatını kaldırma cezası
  tip: bilgi
  zorluk: 1
  kok: Disiplin Yönetmeliği’ne göre yeminli mali müşavire **yeminli sıfatını kaldırma** cezası verilebilmesi için aşağıdakilerden
    hangisinin gerçekleşmesi gerekir?
  secenekler:
    A: Tasdik raporunda kasıt bulunmaksızın bir kez hata yapıldığının oda disiplin kurulunca tespit edilmesi
    B: Üç yıllık dönem içinde üçüncü kez kınama cezası gerektiren eylemin yinelenmesi
    C: Tasdike ilişkin kurallara mükerreren kasten aykırı davranıldığının mahkeme kararıyla kesinleşmesi
    D: Bakanlığın tasdik raporunu yetersiz bularak oda yönetim kuruluna bildirimde bulunması
    E: Oda aidat borcunun iki kez yazı ile istenmesine rağmen haklı neden olmadan ödenmemesi
  dogru: C
  aciklama:
    dogru_neden: Disiplin Yönetmeliği md. 8’e göre yeminli mali müşavirlerin tasdike ilişkin ilke, kural ve standartlara mükerreren
      kasten aykırı davrandıklarının veya tasdik yetkilerini mükerreren kasten gerçeğe aykırı kullandıklarının anlaşılması
      ve bu durumun mahkeme kararıyla kesinleşmesi hâlinde yeminli sıfatı kaldırılır ve mühür geri alınır.
    celdiriciler:
      A: Kasıt olmaksızın gerekli özen gösterilmeden tasdik yapılması md. 6/1-n uyarınca kınama cezası gerektirir; yeminli
        sıfatını kaldırma için kasıt ve mükerrerlik ile mahkeme kararı aranır.
      B: Üç yıl içinde üçüncü kez kınama gerektiren eylem md. 7/1-a uyarınca geçici olarak mesleki faaliyetten alıkoyma cezasını
        doğurur, yeminli sıfatının kaldırılmasını değil.
      D: Bakanlığın raporu yetersiz bulması tek başına bir disiplin cezası sebebi değildir; yeminli sıfatın kaldırılması mahkeme
        kararıyla kesinleşen mükerrer kasıtlı ihlale bağlıdır.
      E: Aidat borcunun iki yazılı istemeye rağmen ödenmemesi md. 5/1-h uyarınca uyarma cezası gerektirir.
  kaynaklar:
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 8
    alinti: kasten aykırı davrandıklarının veya tasdik yetkilerini mükerreren kasten gerçeğe aykırı olarak kullandıklarının
      anlaşılması ve bu durumun mahkeme kararı ile kesinleşmesi halinde, Yeminli sıfatını kaldırma
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 8
    alinti: verilir ve mühürü geri alınır.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 6/1-n
    alinti: Meslek mensuplarınca, kasıt olmaksızın gerekli özen ve titizlik
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 7/1-a
    alinti: 'Üç yıllık bir dönem içinde (Ek ibare: RG-07/10/2023-32332) üçüncü kez kınama cezası gerektiren herhangi bir hâl
      ve eylemin yinelenmesi.'
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 5/1-h
    alinti: En az iki kez yazı ile istenmesine rağmen, oda aidat borçlarının haklı gerekçe olmaksızın ödenmemesi
