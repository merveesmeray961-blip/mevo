- id: YMM-DRM-DSP-0017
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: İhbar ve şikâyet usulü
  tip: bilgi
  zorluk: 1
  kok: Disiplin Yönetmeliği’ne göre **sözlü** ihbar veya şikâyetle ilgili aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Başvuranın kimliği, adresi, ihbar konusu, maddi olaylar ve ihbar günü; oda veya Birlik kurulu başkanı ya da üyelerinden
      biri ile ihbarcının imzalayacağı bir tutanakta gösterilir
    B: Sözlü ihbar yalnızca Birlik kurullarına yapılabilir; odalara ancak yazılı dilekçe ile ihbarda bulunulabilir
    C: Sözlü ihbarda ihbar olunan meslek mensubunun kimliğinin belirtilmesi zorunlu olmayıp ihbarın konusunun anlatılması
      yeterlidir; bu nedenle tutanakta maddi olaylara yer verilmesi gerekmez
    D: Sözlü ihbar tutanağını yalnızca oda disiplin kurulu başkanı düzenleyebilir ve tutanağın ihbarcıya imzalatılması gerekmez
    E: Birlik kurullarına yapılan sözlü ihbar ve şikâyetler gerekli görülürse 60 gün içinde ilgili odaya gönderilir ve ihbarcının
      ayrıca yazılı onayı aranır
  dogru: A
  aciklama:
    dogru_neden: Disiplin Yönetmeliği md. 17’ye göre ihbar veya şikâyet sözlü ya da yazılı yapılabilir. Sözlü başvuruda başvuranın
      açık kimliği ve adresi, ihbar olunan meslek mensubunun kimliği, konu, maddi olaylar ve ihbar günü zorunlu olarak belirtilir
      ve bu hususlar oda veya Birlik kurulları başkanları ya da üyelerinden biri ile ihbarcının imzalayacağı tutanakta gösterilir.
    celdiriciler:
      B: Madde 17’ye göre sözlü ihbar, “oda veya birlik kurullarına başvurarak” yapılabilir; sözlü ihbarın yalnızca Birlik
        kurullarına yapılabileceği yönünde bir sınırlama yoktur.
      C: İhbar olunan meslek mensubunun kimliği, sözlü ve yazılı her iki ihbar türünde de belirtilmesi zorunlu hususlar arasındadır.
      D: Tutanak, oda veya Birlik kurulları başkanları ya da kurul üyelerinden biri ile ihbarcı tarafından imzalanır; yetki
        yalnızca disiplin kurulu başkanına ait değildir ve ihbarcının imzası da aranır.
      E: Birlik kurullarına yapılan ihbar ve şikâyetler gerekli görülürse 30 gün içinde ilgili odaya gönderilir; 60 gün söz
        konusu değildir.
  kaynaklar:
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 17/1
    alinti: Her iki durumda da başvuran kişinin açık kimliği ve adresi, ihbar veya şikayet olunan meslek mensubunun kimliği,
      ihbar veya şikayet konusu, maddi olaylar ve ihbar gününün belirtilmesi zorunludur.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 17/2
    alinti: Sözlü ihbar veya şikayette aynı hususlar oda veya birlik kurulları başkanları veya kurul üyelerinden biri ile
      ihbar veya şikayette bulunan kişi tarafından imzala
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 17/3
    alinti: 30 gün içinde ilgili odaya gönderilir.
