    alinti: soruşturma açılmaz, açılmış olan soruşturma veya kovuşturma sonlandırılır.
  - mevzuat: SMMM ve YMM Kanunu Disiplin Yönetmeliği
    madde: md. 14/5
    alinti: mesleği ifa sırasındaki eylem ve davranışlarından dolayı disiplin
