  ders: DRM
  unite: Disiplin ve çalışma usul ve esasları
  konu: DSP
  kazanim: Meslek şirketlerinin başka ilde şube açması
  tip: kavrama
  zorluk: 3
  kok: Çalışma Usul ve Esasları Hakkında Yönetmelik’e göre, Türk Ticaret Kanunu’na göre kurulmuş bir meslek şirketinin **başka
    bir ilde şube açmasına** ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Şube, o ildeki meslek odasının çalışanlar listesine kayıtlı, şirketi temsil ve ilzama yetkili bir ortağın görevlendirilmesiyle
      açılabilir; bu ortağın şubenin bulunduğu ilde ikamet etmesi de gerekir
    B: Şube, o ildeki meslek odasının çalışanlar listesine kayıtlı olan ve ortak olması gerekmeyen herhangi bir meslek mensubunun
      görevlendirilmesiyle açılabilir; şubenin bulunduğu ilde ikamet etme koşulu da aranmaz ve Birlik onayı gerekmez
    C: Şubeden sorumlu ortağın şubenin bulunduğu ilde ikamet etmesi şart olmayıp şirket merkezinin bulunduğu ilde ikamet etmesi
      yeterlidir
    D: Şirketin başka ilde şube açabilmesi için yalnızca Birlik Yönetim Kurulundan izin alması yeterlidir; sorumlu ortak görevlendirilmesi
      aranmaz
    E: Şirketin ortağı olan meslek mensupları, şubenin bulunduğu ilde ayrıca kendi adlarına bağımsız birer büro edinebilir
  dogru: A
  aciklama:
    dogru_neden: 'Md. 14’e göre bir şirketin başka ilde şube açabilmesi, o ildeki ilgili meslek odasının çalışanlar listesine
      kayıtlı, şirketi temsil ve ilzama yetkili bir ortağın görevlendirilmesi hâlinde mümkündür; şubeden sorumlu ortağın şubenin
