- id: YMM-DRM-KGK-0029
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: KGK ve kamu gözetimi
  konu: KGK
  kazanim: kalite güvence
  tip: uygulama
  zorluk: 2
  kok: Yalnızca kamu yararını ilgilendiren kuruluş (KAYİK) niteliğinde olmayan şirketleri denetleyen Beta Bağımsız Denetim
    A.Ş., ilk denetim sözleşmesini 15.05.2019 tarihinde imzalamıştır. Kurumca bu kuruluş nezdinde yapılan ilk kalite güvence
    sistemi incelemesine ilişkin Kurul kararı 10.11.2024 tarihlidir. 660 sayılı KHK ve Bağımsız Denetim Yönetmeliği'ne göre
    Beta'nın bir sonraki planlı incelemesi en geç hangi tarihe kadar yapılmalıdır?
  secenekler:
    A: 15.05.2025
    B: 31.12.2027
    C: 10.11.2030
    D: 31.12.2030
    E: 31.12.2031
  dogru: D
  aciklama:
    dogru_neden: KHK md. 25/1 ve BDY md. 38/3'e göre incelemeler ilk denetim sözleşmesinin imza tarihinden itibaren, KAYİK
      denetleyen kuruluşlar için asgari üç yılda bir, diğerleri için asgari altı yılda bir yapılır. İzleyen incelemelerde
      süre, önceki incelemeye ilişkin Kurul kararını takip eden takvim yılından itibaren yeniden başlar. Kurul kararı 2024'te
      verildiğinden süre 01.01.2025'te başlar. Beta KAYİK denetlemediği için altı yıllık süre 2025–2030 takvim yıllarını kapsar
      ve 31.12.2030'da dolar.
    celdiriciler:
      A: İlk sözleşme tarihine altı yıl eklenmiştir; ilk süreden sonraki incelemelerde süre önceki inceleme kararını izleyen
        takvim yılından başlar.
      B: Üç yıllık süre yalnız KAYİK denetleyen kuruluşlara uygulanır; Beta KAYİK denetlememektedir.
      C: Süre Kurul kararı tarihinden değil, kararı takip eden takvim yılının başından itibaren yeniden başlar.
      E: Kararı takip eden takvim yılı (2025) sürenin ilk yılıdır; altı yıllık süre 2030 yılı sonunda dolar.
    hesap_adimlari: []
  kaynaklar:
