  kok: 'Gamma Bağımsız Denetim A.Ş., Z A.Ş.''nin bağımsız denetimini yürütmektedir. Aşağıdaki hizmetlerden hangilerinin Z
    A.Ş.''ye verilmesi Bağımsız Denetim Yönetmeliği''nin 22 nci maddesinin beşinci fıkrasına aykırıdır?


    I. Gamma''nın YMM ortağının, Z A.Ş.''nin kurumlar vergisi beyannamesini 3568 sayılı Kanun çerçevesinde tasdik etmesi

    II. Gamma ile aynı denetim ağındaki danışmanlık şirketinin Z A.Ş.''ye kurumsal kaynak planlaması (ERP) danışmanlığı vermesi

    III. Gamma kadrosundaki bir denetçinin Z A.Ş.''ye vergi danışmanlığı hizmeti vermesi

    IV. Gamma''nın kilit yöneticisinin Z A.Ş.''nin muhasebe kayıtlarını tutması'
  secenekler:
    A: I ve II
    B: II ve IV
    C: III ve IV
    D: I, II ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: BDY md. 22/5'e göre denetim kuruluşu ve denetçiler denetlenen işletmeye 3568 sayılı Kanun çerçevesinde tasdik,
      vergi danışmanlığı ve vergi denetimi dışında danışmanlık veya başka bir hizmet veremez. Bunu denetim ağındakiler, ilişkili
      denetim kuruluşu ve diğer işletmeleri aracılığıyla da yapamaz. Gerçek kişi ortakların, denetçilerin ve kilit yöneticilerin
      verdiği hizmetler de bu kapsamdadır. I (tasdik) ve III (vergi danışmanlığı) istisna kapsamındadır. Ağ şirketi üzerinden
      verilen ERP danışmanlığı (II) ve kilit yöneticinin muhasebe kayıtlarını tutması (IV) yasaktır.
    celdiriciler:
      A: 3568 sayılı Kanun çerçevesindeki tasdik (I) açıkça istisnadır. Kilit yöneticinin verdiği muhasebe hizmetinin (IV)
        yasak olduğu atlanmıştır.
      C: Vergi danışmanlığı (III) istisnalar arasındadır. Ağ şirketi aracılığıyla verilen danışmanlığın (II) da yasak olduğu
        atlanmıştır.
      D: Tasdik hizmeti (I) md. 22/5'te açıkça izin verilen hizmetlerdendir.
      E: Denetçinin verdiği vergi danışmanlığı (III) istisna kapsamındadır.
    hesap_adimlari: []
  kaynaklar:
