- id: YMM-DRM-KGK-0030
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: KGK ve kamu gözetimi
  konu: KGK
  kazanim: denetçi bağımsızlığı ve rotasyon
  tip: hesaplama
  zorluk: 2
  kok: Denetçi Aylin Hanım, kamu yararını ilgilendiren kuruluş niteliğinde olmayan X A.Ş.'nin bağımsız denetiminde 2016–2018
    hesap dönemlerinde A Denetim A.Ş.'nin, 2019–2022 hesap dönemlerinde ise B Denetim A.Ş.'nin denetim ekibinde görev almıştır.
    A ile B aynı denetim ağında değildir ve aralarında ilişki yoktur. Aylin Hanım 2023 ve sonraki hesap dönemlerinde X A.Ş.'nin
    denetiminde yer almamıştır. Sürelerin hesap dönemi (takvim yılı) esasına göre hesaplandığı ve yalnız Bağımsız Denetim
    Yönetmeliği'nin dikkate alındığı varsayıldığında, Aylin Hanım X A.Ş.'nin en erken hangi yıla ait hesap döneminin denetiminde
    yeniden görev alabilir?
  secenekler:
    A: '2023'
    B: '2025'
    C: '2026'
    D: '2027'
    E: '2028'
  dogru: C
  aciklama:
    dogru_neden: BDY md. 26/1-ç'ye göre denetçiler, son on yılda yedi yıl denetim çalışmasını yürüttükleri aynı işletmeye
      ilişkin denetimleri üç yıl geçmedikçe üstlenemez. md. 26/2'ye göre çalıştığı denetim kuruluşuna bakılmaksızın denetçinin
      aynı işletmenin denetiminde geçirdiği süreler birlikte dikkate alınır. Aylin Hanım 2016–2022 arasında (3 + 4 =) 7 yıl
      görev yapmıştır. 2023, 2024 ve 2025 hesap dönemlerini kapsayan üç yıl geçmeden görev alamaz. En erken 2026 hesap döneminde
      görev alabilir.
    celdiriciler:
      A: Süreler kuruluş bazında ayrı ayrı sayılmıştır (3 ve 4 yıl). Oysa md. 26/2 denetçinin farklı kuruluşlarda aynı işletmede
        geçirdiği süreleri birleştirir.
      B: Bekleme süresi iki yıl alınmıştır; Yönetmelik üç yıl öngörür.
      D: Üç yıllık bekleme süresi 2024'ten başlatılmıştır. Oysa son görev 2022 hesap dönemindedir; bekleme 2023–2025 dönemlerini
        kapsar.
      E: Beş yıllık bir bekleme süresi uygulanmıştır; Bağımsız Denetim Yönetmeliği md. 26/1-ç üç yıl öngörür.
    hesap_adimlari:
    - 'Toplam süre: 2016–2018 (3 yıl) + 2019–2022 (4 yıl) = 7 yıl (son on yılda)'
    - 'Üç yıllık bekleme: 2023, 2024, 2025 hesap dönemleri'
    - 'En erken dönem: 2022 + 3 + 1 = 2026'
  kaynaklar:
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 26/1-ç
    alinti: Üç yıl geçmedikçe; denetim kuruluşları ve denetim üstlenen bağımsız denetçiler ile denetim çalışması yürüttükleri
      işletmelerin denetiminde görev alan denetçileri, son on yılda yedi yıl denetim çalışmasını yürüttükleri aynı işletmeye
      ilişkin denetimleri.
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 26/2
    alinti: Çalıştığı denetim kuruluşuna veya denetim üstlenen bağımsız denetçiye bakılmaksızın, denetçinin aynı işletmenin
      denetiminde geçirdiği süreler birlikte dikkate alınır.
  gecerlilik:
    baslangic: '2022-12-17'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'son_donem = 2022

      toplam = (2018 - 2016 + 1) + (2022 - 2019 + 1)

      sonuc = son_donem + 3 + 1 if toplam >= 7 else son_donem + 1'
