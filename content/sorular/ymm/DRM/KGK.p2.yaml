      olması ve bir bağımsız denetim kuruluşu ile doğrudan veya dolaylı ortaklık ilişkisinin olmaması zorunludur. B'deki kişi
      iki yıl önceye kadar yönetim kurulu üyesidir; son üç yıl şartını sağlamaz.
    celdiriciler:
