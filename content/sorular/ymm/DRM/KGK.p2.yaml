- id: YMM-DRM-KGK-0034
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: KGK ve kamu gözetimi
  konu: KGK
  kazanim: bağımsız denetim yönetmeliği
  tip: hesaplama
  zorluk: 3
  kok: 'Murat Bey''e ilişkin bilgiler şöyledir:

    - İşletme fakültesindeki dört yıllık lisans eğitimini 2011 yılında tamamlamıştır; bu süre başka bir faaliyetle çakışmamaktadır.

    - 01.01.2012 tarihinde 3568 sayılı Kanun uyarınca stajına başlamıştır. 2012–2013 yıllarında, stajıyla eş zamanlı olarak
    işletme alanında iki yıllık yüksek lisans eğitimi almıştır.

    - SMMM ruhsatını aldıktan sonra 01.01.2017–31.12.2018 döneminde (2 yıl) mesleki faaliyetlerine ara vermiş ve bu sürede
    kamu kurum veya kuruluşunda çalışmamıştır. 01.01.2019''dan bu yana kesintisiz olarak mesleki faaliyette bulunmaktadır.


    Bağımsız Denetim Yönetmeliği''nin 15 inci maddesine göre Murat Bey''in 01.01.2026 itibarıyla dikkate alınacak mesleki
    tecrübe süresi kaç yıldır?'
  secenekler:
    A: '13'
    B: '16'
    C: '17'
    D: '18'
    E: '19'
  dogru: C
  aciklama:
    dogru_neden: 'BDY md. 15/3''e göre mesleki tecrübe hesabında 3568 sayılı Kanun kapsamındaki mesleki faaliyetler ile staj
      süreleri dikkate alınır ve faaliyete başlama tarihi esas alınır. Kamu kurumlarında geçen süreler hariç, bir yıldan fazla
      süreyle ara verilmesi halinde ara verilen fazla süreler dikkate alınmaz. Dört yılı aşmamak ve faaliyetlerle aynı tarihlere
      denk gelen süreler mükerrer sayılmamak şartıyla lisans ve lisansüstü eğitim süreleri eklenir. 01.01.2012–01.01.2026
      arası 14 yıldır. İki yıllık aranın bir yılı aşan kısmı (1 yıl) düşülür: 13 yıl. Çakışmayan lisans süresi (4 yıl) eklenir;
      yüksek lisans stajla çakıştığından ayrıca sayılmaz: 13 + 4 = 17 yıl. Püf noktaları: Aranın tamamı değil yalnız bir yılı
      aşan kısmı düşülür. Eğitim süresi ilavesinde hem dört yıl tavanı hem de çakışan sürelerin mükerrer sayılmaması kuralı
      birlikte uygulanır.'
    celdiriciler:
      A: 'Lisans eğitim süresinin (4 yıl) eklenmesi unutulmuştur: 14 − 1 = 13.'
      B: İki yıllık aranın tamamı düşülmüştür (14 − 2 + 4 = 16). Oysa yalnız bir yılı aşan kısım dikkate alınmaz.
      D: Ara hiç düşülmemiştir (14 + 4 = 18). Bir yılı aşan ara süresi hesaba katılmaz.
      E: Stajla çakışan yüksek lisans süresi de eklenmiştir (13 + 4 + 2 = 19). Çakışan süreler mükerrer sayılmaz; ayrıca eğitim
        ilavesi dört yılı aşamaz.
    hesap_adimlari:
    - 'Başlangıçtan bu yana geçen süre: 2026 − 2012 = 14 yıl'
    - 'Aranın bir yılı aşan kısmı: 2 − 1 = 1 yıl düşülür → 13 yıl'
    - 'Eğitim ilavesi: lisans 4 yıl (çakışma yok); yüksek lisans stajla çakıştığından 0 → en çok 4 yıl'
    - 'Toplam: 13 + 4 = 17 yıl'
  kaynaklar:
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 15/3
    alinti: Bu sürenin hesabında bu fıkrada belirtilen faaliyetlere başlama tarihi esas alınır ve kamu kurum ve kuruluşlarında
      geçirilen süreler hariç olmak üzere, bir yıldan fazla süreyle bu faaliyetlere ara verilmesi durumunda ara verilen fazla
      süreler dikkate alınmaz.
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 15/3
    alinti: Dört yılı aşmamak ve bu fıkradaki faaliyet ve hizmetlerle aynı tarihlere denk gelen süreler mükerreren sayılmamak
      şartıyla 14 üncü maddenin birinci fıkrasının (a) bendinde belirtilen alanlardaki lisans ve lisansüstü eğitim süreleri
      bu süreye ilave edilir.
