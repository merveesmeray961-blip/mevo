      C: Ortaklık ilişkisi beş yıl önce sona ermiştir; son üç yılda ortaklık ilişkisi yoktur.
      D: Dört yıllık yükseköğrenim md. 4/2'de aranan bir şarttır; öğretim üyeliği atanmaya engel değildir.
      E: Banka iç denetim birimindeki müfettişlik, md. 4/4'te sayılan bağımsız denetim faaliyeti, bağımsız denetim kuruluşunda
