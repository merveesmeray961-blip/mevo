    tam zamanlı istihdam edilen denetçi ortaklara aittir.

    - Şirket kadrosunda, 28 inci maddedeki şartları sağlayan iki sorumlu denetçi vardır.

    - Beş kişilik yönetim kurulunun tamamı meslek mensubudur; bunlardan dördü şirket kadrosundaki denetçilerdir.


    Bağımsız Denetim Yönetmeliği''nin 13 üncü maddesine göre, yukarıdaki bilgiler itibarıyla hangi yetkilendirme şartı sağlanmamaktadır?'
