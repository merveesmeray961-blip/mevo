  kok: Bağımsız Denetçi Belgesine sahip, kendi adına denetim üstlenmesi Kurumca onaylanmış ve KAYİK denetimleri için aranan
    sorumlu denetçi şartlarını da taşıyan YMM Leyla Hanım, kamu yararını ilgilendiren kuruluş (KAYİK) niteliğindeki bir sigorta
    şirketinin bağımsız denetimini üstlenmek istemektedir. 660 sayılı KHK'ye göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Üstlenebilir; denetim üstlenen bağımsız denetçi olarak sorumlu denetçi şartlarını taşıması yeterlidir.
    B: Üstlenebilir; ancak sigorta sektörünü düzenleyen kuruluşun olumlu görüşünü alması gerekir.
    C: Üstlenebilir; ancak kuracağı denetim ekibinin en az üç denetçiden oluşması gerekir.
    D: Üstlenemez; KAYİK'lerde denetim yalnızca bağımsız denetim kuruluşları tarafından yapılır.
    E: Üstlenemez; KAYİK'lerin denetimi yalnızca Kurumun kendi meslek personeli eliyle yürütülür.
  dogru: D
  aciklama:
    dogru_neden: 660 sayılı KHK md. 23/1'e göre kamu yararını ilgilendiren kuruluşlarda denetim sadece bağımsız denetim kuruluşları
      tarafından yapılır. md. 2/1-ğ sigorta şirketlerini KAYİK olarak sayar. Denetim üstlenen bağımsız denetçi olarak onay
      almış olmak ve sorumlu denetçi şartlarını taşımak bu sınırlamayı kaldırmaz.
    celdiriciler:
      A: Sorumlu denetçi şartları, denetimin kim tarafından üstlenilebileceğine ilişkin md. 23/1 sınırlamasını ortadan kaldırmaz.
      B: Sektör kuruluşunun görüşü md. 23/2 uyarınca denetim kuruluşlarının yetkilendirilmesi sürecinde alınır; bireysel denetçiye
        KAYİK denetimi yetkisi vermez.
      C: En az üç denetçili ekip şartı (BDY md. 27) her denetim için aranır; KAYİK denetimini bireysel denetçiye açmaz.
      E: Kurumun kendi personeliyle yaptığı faaliyet kalite güvence incelemesidir (md. 25); KAYİK'lerin bağımsız denetimi
        bağımsız denetim kuruluşlarınca yapılır.
