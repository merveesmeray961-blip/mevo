  kok: 'Delta Bağımsız Denetim A.Ş.''nin Y A.Ş. denetimine ilişkin aşağıdaki durumlardan hangileri, Bağımsız Denetim Yönetmeliği''nin
    22 nci maddesinin üçüncü fıkrasında bağımsızlığı zedeleyen veya ortadan kaldıran durumlar olarak açıkça sayılanlar arasındadır?


    I. Sorumlu denetçinin boşanmış eşinin Y A.Ş.''de kilit yönetici olarak çalışması

    II. Denetim ekibindeki bir denetçinin, Y A.Ş. ile ilişkili bir bankadan piyasa koşullarında olağan bir konut kredisi kullanması

