      boşanmış olsalar dahi eşleri ile 3. dereceye kadar kan ve kayın hısımlarının denetlenen işletme ile menfaat, ortaklık,
      kilit yönetici sıfatıyla iş veya olağan ekonomik ilişkiler dışında borç-alacak ilişkisini sayar (I). (b) bendi geçmiş
      yıllar denetim ücretinin geçerli neden olmaksızın ödenmemesini (III), (c) bendi denetim ücretinin denetlenen işletmeye
      sunulan denetim dışı diğer hizmetler dikkate alınarak belirlenmesini (IV) sayar. II olağan ekonomik ilişkidir; V ise
      3. dereceyi aşan bir hısımlıktır. Püf noktaları: Vergi danışmanlığının verilebilir olması (md. 22/5), ücretin bu hizmete
      göre belirlenmesini meşru kılmaz. Borç-alacak ilişkisinde ölçüt ilişkinin olağan ekonomik ilişki olup olmamasıdır.'
    celdiriciler:
      B: Denetim ücretinin denetim dışı hizmetler dikkate alınarak belirlenmesi (IV) md. 22/3-c'de açıkça sayılmıştır.
      C: II olağan ekonomik ilişkidir, V ise 3. dereceyi aşan hısımlıktır; ikisi de sayılan durumlar arasında değildir. I
