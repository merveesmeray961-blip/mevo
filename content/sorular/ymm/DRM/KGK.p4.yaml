      A: Sorumlu denetçi için öngörülen beş yıllık ara uygulanmıştır.
      B: Üç yıllık ara verme süresinin son yılıdır.
      C: Dört yıllık ara uygulanmıştır; kanunda böyle bir süre yoktur.
      D: Diğer kilit denetçiler için öngörülen iki yıllık ara uygulanmıştır, üstelik bir yıl eksik sayılmıştır.
