- id: YMM-DRM-KGK-0045
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: KGK ve kamu gözetimi
  konu: KGK
  kazanim: Şeffaflık raporu (BDY md. 36)
  tip: kavrama
  zorluk: 2
  kok: Bağımsız Denetim Yönetmeliği'ne göre KAYİK denetimi yapan denetim kuruluşlarının yıllık şeffaflık raporuna ilişkin
    aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Rapor, denetim kuruluşunun yönetim organı başkanı tarafından imzalanır.
    B: Raporun güncellenmesi hâlinde, orijinal hali ve güncellenmiş halleri ayrı ayrı beş yıl süreyle kamunun erişimine açık
      tutulur.
    C: KAYİK denetimine ilişkin listelerde yer almakla birlikte takvim yılı içinde KAYİK denetimi yapmayan kuruluş, bu durumu
      internet sitesinin şeffaflık raporlarıyla ilgili bölümünde açıklar.
    D: Kişisel güvenliğe ilişkin önemli ve etkin bir tehdit varsa ve talep edilirse, Kurumun onayıyla, önceki yıl denetim
      hizmeti verilen KAYİK listesinde ilgili işletme bilgilerine yer verilmeyebilir.
    E: Rapor yalnızca Kuruma bildirilir; denetim kuruluşunun kendi internet sitesinde yayımlanması zorunlu değildir.
  dogru: E
  aciklama:
    dogru_neden: BDY md. 36/1'e göre denetim kuruluşları yıllık şeffaflık raporunu hem Kuruma bildirir hem de kendi internet
      sitelerinde yayımlar. E şıkkındaki yayımlama zorunluluğunun bulunmadığı ifadesi bu nedenle yanlıştır.
    celdiriciler:
      A: 'Doğru ifadedir: md. 36/2 raporun yönetim organı başkanı tarafından imzalanacağını söyler.'
      B: 'Doğru ifadedir: md. 36/5 raporun orijinal ve güncellenmiş hallerinin ayrı ayrı beş yıl kamuya açık tutulmasını öngörür.'
      C: 'Doğru ifadedir: md. 36/4 listelerde yer alıp o yıl KAYİK denetimi yapmayan kuruluşa bu açıklamayı yükler.'
      D: 'Doğru ifadedir: md. 36/3, kişisel güvenlik tehdidi hâlinde Kurum onayıyla (f) bendi açıklamasında işletme bilgilerinin
        yer almamasına izin verir.'
  kaynaklar:
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 36/1
    alinti: yıllık şeffaflık raporunu Kuruma bildirir ve kendi internet sitelerinde yayımlar.
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 36/2
    alinti: Bu rapor denetim kuruluşunun yönetim organı başkanı tarafından imzalanır
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 36/3
    alinti: Kişisel güvenliğe ilişkin önemli ve etkin bir tehdidin var olması ve buna talep olması halinde Kurumun onayıyla
      ikinci fıkranın (f) bendine ilişkin açıklamada ilgili denetlenen işletme bilgilerine yer verilmeyebilir.
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 36/4
    alinti: KAYİK denetimine ilişkin listelerde yer almakla birlikte bir takvim yılı içerisinde KAYİK denetimi yapmayan denetim
      kuruluşları bu durumu internet sitelerinin şeffaflık raporlarıyla ilgili bölümünde açıklar.
