- id: YMM-DRM-KGK-0043
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: KGK ve kamu gözetimi
  konu: KGK
  kazanim: Denetçilerin sürekli eğitim yükümlülüğünün başlangıcı (BDY md. 25)
  tip: uygulama
  zorluk: 3
  kok: Denetçi Sevgi Korkmaz, Bağımsız Denetçi Belgesi ile 15.03.2024'te yetkilendirilmiş; yetkilendirmesi Kurum internet
    sitesinde 22.03.2024'te ilan edilmiş ve sicile tescili 14.10.2025'te yapılmıştır. Bağımsız Denetim Yönetmeliği'ne göre
    Sevgi Korkmaz'ın sürekli eğitim yükümlülüğünün başlangıç tarihi ile yetkilendirildiği tarih ve tescil tarihi arasındaki
    süre bakımından Kurumca ilave yükümlülük getirilip getirilemeyeceği aşağıdakilerden hangisinde doğru olarak verilmiştir?
  secenekler:
    A: 1 Ocak 2026; ilave yükümlülük getirilemez.
    B: 1 Ocak 2027; ilave yükümlülük getirilemez.
    C: 1 Ocak 2027; ilave yükümlülük getirilebilir.
    D: 1 Ocak 2028; ilave yükümlülük getirilemez.
    E: 1 Ocak 2028; ilave yükümlülük getirilebilir.
  dogru: B
  aciklama:
    dogru_neden: 'Yükümlülük, denetçinin **sicile tescil edildiği tarihi izleyen ikinci takvim yılının başından** itibaren
      başlar. Tescil 14.10.2025''te olduğundan izleyen birinci takvim yılı 2026, ikinci takvim yılı 2027''dir; başlangıç 1
      Ocak 2027''dir. İlave yükümlülük ise yalnızca yetkilendirildiği tarih ile tescil tarihi arasında **iki yıl ve daha fazla**
      süre bulunanlar için getirilebilir; 15.03.2024 ile 14.10.2025 arası yaklaşık 1 yıl 7 aydır, dolayısıyla getirilemez.
      Püf noktaları: Başlangıç için yetkilendirme veya ilan tarihi değil, tescil tarihi esas alınır; "izleyen ikinci takvim
      yılı" tescil yılının değil, ondan sonraki ikinci yılın başıdır; gereksiz veri olan ilan tarihi sonucu etkilemez.'
    celdiriciler:
      A: Tescil yılını izleyen ilk takvim yılı (2026) esas alınmıştır; md. 25/2 izleyen ikinci takvim yılını arar.
      C: Başlangıç tarihi doğrudur; ancak yetkilendirme ile tescil arasında iki yıldan kısa süre bulunduğundan ilave yükümlülük
        getirilemez.
      D: Başlangıç, tescil yılını izleyen ikinci yıl yerine üçüncü yıl olarak alınmıştır; doğru başlangıç 1 Ocak 2027'dir.
      E: Hem başlangıç tarihi yanlış (2028) hem de iki yıllık eşik aşılmadığı için ilave yükümlülük getirilmesi mümkün değildir.
  kaynaklar:
  - mevzuat: Bağımsız Denetim Yönetmeliği
    madde: md. 25/2
    alinti: Sürekli eğitim yükümlülüğü denetçinin sicile tescil edildiği tarihi izleyen ikinci takvim yılının başından itibaren
      başlar. Yetkilendirildiği tarih ile tescil tarihi arasında iki yıl ve daha fazla süre bulunanlar için ilave yükümlülükler
      getirilebilir.
