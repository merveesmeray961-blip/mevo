  konu: KGK
  kazanim: Denetim ekipleri ve unvanlar (BDY md. 27)
  tip: kavrama
  zorluk: 2
  kok: Altay Bağımsız Denetim A.Ş., bir işletmenin denetimi için denetim ekibi oluşturmakta ve denetçilerine unvan vermektedir.
    Bağımsız Denetim Yönetmeliği'ne göre aşağıdaki uygulamalardan hangisi uygundur?
  secenekler:
    A: Denetçilikte yedi yılını doldurmuş bir denetçiye kıdemli denetçi unvanının verilmesi
    B: Denetçilikte altı yılını henüz doldurmamış, beş yıl on bir ay kıdemi bulunan bir denetçiye kıdemli denetçi unvanının
      verilmesi
    C: Denetçilikte dokuz yılını doldurmuş bir denetçiye başdenetçi unvanının verilmesi
    D: İki denetçi ile bir denetçi yardımcısından oluşan üç kişilik bir denetim ekibinin kurulması
    E: Ekibe katılan bilgi sistemleri uzmanının asgari denetçi sayısı hesabında dikkate alınması
  dogru: A
  aciklama:
    dogru_neden: BDY md. 27/5'e göre denetçilikte altı yılını doldurmayanlara kıdemli denetçi, on yılını doldurmayanlara başdenetçi
      unvanı verilemez. Yedi yılını doldurmuş denetçiye kıdemli denetçi unvanı verilebilir.
    celdiriciler:
      B: Altı yılını doldurmayanlara kıdemli denetçi unvanı verilemez; beş yıl on bir ay bu eşiğin altındadır.
      C: Başdenetçi unvanı için on yıl doldurulmuş olmalıdır; dokuz yıllık kıdem yeterli değildir.
      D: Denetim ekipleri üç denetçiden az olamaz; denetçi yardımcısı denetçi olarak görevlendirilmeksizin ekipte yer alabilir
        ancak denetçi sayısına eklenemez.
      E: Bilgi sistemleri uzmanları ve denetime yardımcı kişiler asgari denetçi sayısı hesabında dikkate alınmaz (md. 27/3).
  kaynaklar:
  - mevzuat: Bağımsız Denetim Yönetmeliği
