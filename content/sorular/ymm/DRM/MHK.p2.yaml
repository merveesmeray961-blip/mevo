- id: YMM-DRM-MHK-0040
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: ücret tarifesi
  tip: hesaplama
  zorluk: 3
  kok: 'İstanbul''da faaliyet gösteren ve gelir vergisi mükellefi olan akaryakıt bayii Bay (K), yıllık gelir vergisi beyannamesinin
    tasdiki için 2026 yılında bir yeminli mali müşavir ile sözleşme imzalamıştır. Ücrete esas alınacak (önceki yıl) gelir
    tablosuna göre (K)''nın brüt satışları 152.000.000 TL, net satışları 140.000.000 TL''dir. 2026 yılı YMM tasdik ücret tarifesine
    ilişkin bilgiler şöyledir:

    - Yıllık gelir ve kurumlar vergisi beyanname tasdiki: net satışların 143.103.449 TL''ye kadar olan kısmı için binde 2
    (üst dilimler bu soruda gerekmemektedir).

    - Bu suretle hesaplanacak ücret, kurumlar vergisi mükellefleri için 186.036 TL''den, gelir vergisi mükellefleri için 168.878
    TL''den az olamaz.

    - Gelir vergisi beyanname tasdiklerinde nispi ücretlere %10 indirim uygulanır.

    - Akaryakıt bayilerinde hasılat %50 olarak dikkate alınır.


    Taraflar tarifede ''uygulanabilir'' şeklinde düzenlenen isteğe bağlı indirimlerin hiçbirini uygulamamıştır. Buna göre
    bu iş için kararlaştırılabilecek asgari tasdik ücreti kaç TL''dir?'
  secenekler:
    A: '126.000'
    B: '168.878'
    C: '186.036'
    D: '252.000'
    E: '280.000'
  dogru: B
  aciklama:
    dogru_neden: 'Ücrete esas tutar net satışlardır (brüt satışlar değil). Akaryakıt bayii olduğundan hasılat %50 dikkate
      alınır: 140.000.000 × %50 = 70.000.000 TL. Nispi ücret: 70.000.000 × binde 2 = 140.000 TL. Gelir vergisi tasdikinde
      %10 indirim: 140.000 × 0,90 = 126.000 TL. Bulunan tutar gelir vergisi mükellefleri için asgari ücret olan 168.878 TL''nin
      altında kaldığından asgari tasdik ücreti 168.878 TL''dir. Püf noktaları: İndirimler uygulandıktan sonra bulunan ücret
      mükellef türüne göre belirlenen asgari tutarla karşılaştırılmalıdır. Kurumlar vergisi asgarisi (186.036 TL) gelir vergisi
      mükellefine uygulanmaz. Brüt satış verisi çözümde kullanılmaz.'
    celdiriciler:
      A: 126.000 TL indirimli nispi ücrettir; gelir vergisi mükellefleri için öngörülen 168.878 TL'lik alt sınır uygulanmamıştır.
      C: 186.036 TL kurumlar vergisi mükelleflerine ilişkin alt sınırdır; (K) gelir vergisi mükellefidir.
      D: 'Akaryakıt bayilerinde hasılatın %50 dikkate alınacağı unutulmuştur: 140.000.000 × binde 2 × 0,90 = 252.000.'
      E: 'Hem hasılat indirimi hem de gelir vergisi tasdikine özgü %10 indirim unutulmuştur: 140.000.000 × binde 2 = 280.000.'
    hesap_adimlari:
    - 'Ücrete esas hasılat: 140.000.000 × 0,50 = 70.000.000 TL (akaryakıt bayii)'
    - 'Nispi ücret: 70.000.000 × 0,002 = 140.000 TL'
    - 'Gelir vergisi tasdik indirimi: 140.000 × 0,90 = 126.000 TL'
    - 'Asgari ücret karşılaştırması: max(126.000; 168.878) = 168.878 TL'
  kaynaklar:
  - mevzuat: '2026 Yılı SM, SMMM ve YMM Asgari Ücret Tarifesi (Ek: YMM Tasdik İşlemleri)'
    madde: YMM tasdik tarifesi I-1
    alinti: Gelir Vergisi beyanname tasdiklerinde tarifedeki nisbi ücretler için %10 indirim uygulanır.
  - mevzuat: '2026 Yılı SM, SMMM ve YMM Asgari Ücret Tarifesi (Ek: YMM Tasdik İşlemleri)'
    madde: YMM tasdik tarifesi I-1
    alinti: Bu suretle hesaplanacak ücret, Kurumlar Vergisi mükellefleri için 186.036 TL’den, Gelir Vergisi mükellefleri için
      168.878 TL'den az
  - mevzuat: '2026 Yılı SM, SMMM ve YMM Asgari Ücret Tarifesi (Ek: YMM Tasdik İşlemleri)'
    madde: Notlar 12-A
    alinti: Tasdik ücretleri; döviz alım-satım işi ile uğraşan şirketler, akaryakıt bayileri, tütün mamulleri imalatçıları
      ve dağıtıcıları
  - mevzuat: '2026 Yılı SM, SMMM ve YMM Asgari Ücret Tarifesi (Ek: YMM Tasdik İşlemleri)'
