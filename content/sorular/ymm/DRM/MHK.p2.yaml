      Kanun kapsamındaki işleri yürütülmemek şartıyla yönetim kurulu üyeliği ile bilirkişilik meslekle bağdaşmayan iş sayılmaz
      (I, IV). md. 45/4''e göre ortaklık bürosu ve şirketlerde yapılan faaliyetler ticari faaliyet sayılmaz (II). Disiplin
      Yönetmeliği md. 7/1-b (unvanla hizmet sözleşmesiyle bağımlı çalışma) ve md. 7/1-e (ticari faaliyet yasağına uyulmaması)
