- id: YMM-DRM-MHK-0035
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: 3568 sayılı Kanun YMM şartları ve yasaklar
  tip: uygulama
  zorluk: 2
  kok: 'Yeminli mali müşavir Ece Hanım''ın üstlenmeyi düşündüğü aşağıdaki işlerden hangileri 3568 sayılı Kanun''un 45 inci
    maddesinin ikinci fıkrasındaki yasak kapsamına girer?


    I. Dört yıl önce boşandığı eşinin tek ortağı olduğu limited şirketin kurumlar vergisi beyannamesinin tasdiki

    II. Dayısının oğlunun (kan hısımlığında 4. derece) ortağı olduğu anonim şirketin KDV iadesine ilişkin tasdik

    III. Eşinin kız kardeşinin (kayın hısımlığında 2. derece) ortağı olduğu kollektif şirketin tam tasdik işi

    IV. Ece Hanım ile hiçbir akrabalık bağı bulunmayan kişilere ait bir şirketin, defterlerini Ece Hanım''ın yeğeni (kan hısımlığında
    3. derece) olan bir SMMM''nin tuttuğu ve beyannamesini imzaladığı kurumlar vergisi beyannamesinin tasdiki'
  secenekler:
    A: I ve II
    B: II ve IV
    C: I ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: md. 45/2'ye göre YMM; eşi (boşanmış dahi olsa), usul ve füruundan biri ve 3. dereceye kadar (bu derece dâhil)
      kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamaz. Ayrıca bu yakınlıktaki akrabası
      olan SMMM'lerin baktığı işleri tasdik edemez. I (boşanmış eş) ve III (kayın hısımlığında 2. derece) birinci yasak kapsamındadır.
      IV'te şirket sahipleri akraba değildir, ancak işi 3. derece kan hısımı SMMM yürüttüğü için ikinci yasak uygulanır. II'de
      4. derece hısımlık sınırı aşar, yasak yoktur.
    celdiriciler:
      A: II yasak kapsamında değildir (4. derece). Akraba SMMM'nin baktığı işi tasdik yasağına giren IV ve kayın hısımlığındaki
        III ise atlanmıştır.
      B: II yasak kapsamında değildir. Boşanmış eşe ilişkin I ile kayın hısımına ilişkin III'ün yasak kapsamında olduğu gözden
        kaçırılmıştır.
      C: Firma sahiplerine ilişkin yasak doğru uygulanmış, ancak akraba SMMM'nin baktığı işlerin tasdik edilemeyeceğine ilişkin
        ikinci yasak (IV) atlanmıştır.
      E: Yasak 3. derece dâhil hısımlarla sınırlıdır; 4. derece kan hısımı olan dayı oğluna ilişkin II kapsam dışıdır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 45/2
    alinti: Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil)
      kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar,
