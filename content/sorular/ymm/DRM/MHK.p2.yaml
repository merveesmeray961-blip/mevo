  kok: 'Bir yeminli mali müşavirler odasının çalışanlar listesinde kayıtlı YMM Tarık Bey''in aşağıdaki faaliyetleri değerlendirilmektedir:


    I. Bir kamu iktisadi kuruluşunda, kuruluşun 3568 sayılı Kanun kapsamındaki işlerini yürütmemek koşuluyla yönetim kurulu
    üyeliği

    II. İki yeminli mali müşavirle birlikte kurduğu yeminli mali müşavirlik şirketinde ortaklık

    III. Bir anonim şirkette, YMM unvanıyla ve Kanun''un 2 nci maddesinde yazılı işleri yürütmek üzere hizmet sözleşmesiyle
    tam zamanlı çalışma

    IV. Asliye ticaret mahkemesince verilen bilirkişilik görevi

    V. Kendi adına tacir olarak bir akaryakıt istasyonu işletme


    Buna göre 3568 sayılı Kanun''un 45 inci maddesine aykırı olan faaliyetler ile Disiplin Yönetmeliği''nde bu aykırılıklar
    için öngörülen disiplin cezası aşağıdakilerin hangisinde birlikte doğru verilmiştir?'
  secenekler:
