- id: YMM-DRM-MHK-0032
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: YMM odaları ve TÜRMOB
  tip: bilgi
  zorluk: 1
  kok: 3568 sayılı Kanun'a göre, bir yeminli mali müşavir hakkında oda disiplin kurulunca verilen geçici olarak mesleki faaliyetten
    alıkoyma kararına karşı başvurulacak itiraz yolu bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Karar, tebliğ tarihinden itibaren 15 gün içinde Birlik Disiplin Kuruluna itiraz edilebilir.
    B: Karar, tebliğ tarihinden itibaren 30 gün içinde Birlik Yönetim Kuruluna itiraz edilebilir.
    C: Karar, tebliğ tarihinden itibaren 30 gün içinde Birlik Disiplin Kuruluna itiraz edilebilir.
    D: Karar, tebliğ tarihinden itibaren 30 gün içinde Hazine ve Maliye Bakanlığına itiraz edilebilir.
    E: Karar, tebliğ tarihinden itibaren 60 gün içinde doğrudan idare mahkemesinde dava edilebilir.
  dogru: C
  aciklama:
    dogru_neden: 3568 sayılı Kanun md. 25'in son fıkrasına göre oda disiplin kurulunun kararlarına karşı tebliğ tarihinden
      itibaren otuz gün içinde Birlik Disiplin Kuruluna itiraz edilebilir (Disiplin Yönetmeliği md. 28 de aynı süreyi öngörür).
      Birlik Disiplin Kurulunun itirazın reddine ilişkin kararları Bakanlığın tasdiki ile kesinleşir ve ancak bundan sonra
      idari yargı yoluna gidilir (md. 38).
    celdiriciler:
      A: 15 günlük süre, yönetim kurulu toplantılarına üç kez özürsüz katılmadığı için istifa etmiş sayılan oda yönetim kurulu
        üyesinin Birliğe itiraz süresidir (md. 24); disiplin kararlarında süre 30 gündür.
      B: Süre doğru, merci yanlıştır; disiplin kararlarına itiraz Birlik Yönetim Kuruluna değil Birlik Disiplin Kuruluna yapılır.
      D: Bakanlık itiraz mercii değildir; yalnız Birlik Disiplin Kurulunun itirazın reddine ilişkin kararlarını tasdik ederek
        kesinleştirir (md. 38).
      E: Oda disiplin kurulu kararı önce Birlik Disiplin Kurulunda itiraz yoluyla incelenir; idari yargı yolu kesinleşen karara
        karşı açıktır, oda kararına karşı doğrudan dava yolu öngörülmemiştir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 25/son
    alinti: Oda Disiplin Kurulunun kararlarına karşı tebliğ tarihinden itibaren otuz gün içinde Birlik Disiplin Kuruluna itiraz
      edilebilir.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 38/4
    alinti: Birlik Disiplin Kurulunun itirazların reddine ait kararları Maliye Bakanlığının tasdiki ile kesinleşir.
  gecerlilik:
