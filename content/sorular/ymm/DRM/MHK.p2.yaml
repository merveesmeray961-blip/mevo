    B: III ve V – Kınama
    C: I, III ve V – Geçici olarak mesleki faaliyetten alıkoyma
    D: Yalnız III – Geçici olarak mesleki faaliyetten alıkoyma
    E: II, III ve V – Kınama
  dogru: A
