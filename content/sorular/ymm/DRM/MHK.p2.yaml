- id: YMM-DRM-MHK-0036
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: disiplin cezaları
  tip: kavrama
  zorluk: 2
  kok: 3568 sayılı Kanun'un 48 inci maddesine göre aşağıdaki fiil – disiplin cezası eşleştirmelerinden hangisi **yanlıştır**?
  secenekler:
    A: Mesleki kurallara aykırı fiilde ilk kez bulunan meslek mensubu – Uyarma
    B: Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan meslek mensubu – Kınama
    C: Tasdik yetkisini gerçeğe aykırı kullandığı Bakanlıkça ilk defa tespit edilip rapora bağlanan YMM – Geçici olarak mesleki
      faaliyetten alıkoyma
    D: Gerçeğe aykırı tasdiki tekerrür eden ve bu durumu mahkeme kararıyla kesinleşen YMM – Yeminli sıfatını kaldırma
    E: Mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubu – Meslekten
      çıkarma
  dogru: B
  aciklama:
    dogru_neden: md. 48'e göre görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu yapan ya da mesleğin
      genel prensiplerine aykırı harekette bulunan meslek mensuplarına kınama değil geçici olarak mesleki faaliyetten alıkoyma
      cezası uygulanır. Kınama, mesleki kurallara aykırı fiilin tekrarında uygulanır.
    celdiriciler:
      A: 'Doğrudur: mesleki kurallara, mesleğin vakar ve onuruna aykırı fiillerde ilk defasında uyarma, tekrarında kınama
        uygulanır.'
      C: 'Doğrudur: tasdik yetkisinin gerçeğe aykırı kullanıldığının Bakanlıkça ilk defa tespit edilip rapora bağlanması alıkoyma
        cezasını gerektirir.'
      D: 'Doğrudur: bu husus tekerrür eder ve mahkeme kararıyla kesinleşirse yeminli sıfatını kaldırma cezası verilir.'
      E: 'Doğrudur: mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşenlere meslekten
        çıkarma cezası verilir.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 48
    alinti: Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan
      mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma
      cezası uygulanır.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 48
    alinti: Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan
      yeminli mali müşavirler hakkında geçici olarak mesleki faaliyetten alıkoyma, bu husus tekerrür edip bunun mahkeme kararıyla
      kesinleşmesi halinde de yeminli sıfatını kaldırma cezası verilir.
  gecerlilik:
