- id: YMM-DRM-MHK-0033
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: haksız rekabet ve reklam yasağı
  tip: bilgi
  zorluk: 1
  kok: SMMM ve YMM Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre meslek mensuplarının internet
    uygulamalarına ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Bağlı oldukları odanın önceden vereceği yazılı onay olmaksızın internet ortamında kendilerini ifade edemezler.
    B: Oda yönetim kuruluna bildirmek koşuluyla .com veya .com.tr uzantılı internet sitesi de kurabilirler.
    C: Arama motoru kaydında adları ve bulundukları şehrin yanında sundukları hizmet türlerini anahtar kelime yapabilirler.
    D: İş sağlama amacı taşısa da kullanıcıları kendi sitelerine yönlendiren internet kısa yolları kullanabilirler.
    E: Mesleki faaliyetlerini internet üzerinden sürdürmek için yalnız meslekiunvanı.tr uzantılı site kurabilirler.
  dogru: E
  aciklama:
    dogru_neden: Yönetmeliğin 22 nci maddesinin ikinci fıkrasına göre meslek mensupları, mesleki faaliyetlerini internet üzerinden
      sürdürmek, iş sahiplerini bilgilendirmek ve mesleki yayınlarını yayımlamak amacıyla yalnızca meslekiunvanı.tr uzantılı
      internet sitesi kurabilir.
    celdiriciler:
      A: md. 22/1'e göre meslek mensupları bağlı oldukları odaya bilgi vererek kendilerini ifade etme hakkına sahiptir; önceden
        yazılı onay şartı yoktur.
      B: md. 22/2 uzantıyı 'yalnızca' meslekiunvanı.tr olarak sınırlar; odaya bildirim başka uzantıyı serbest bırakmaz.
      C: md. 22/3-b'ye göre anahtar kelime olarak ad, soyad, büro/ortaklık/şirket unvanı, şehir ve kayıtlı olunan oda dışında
        tanıtım amaçlı ibare kullanılamaz; hizmet türleri bu listede yoktur.
      D: md. 22/3-c iş sağlama amacına yönelik ve haksız rekabete yol açacak yönlendirme kısa yollarını açıkça yasaklar.
    hesap_adimlari: []
