- id: YMM-DRM-MHK-0039
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: disiplin cezaları
  tip: uygulama
  zorluk: 3
  kok: 'Yeminli mali müşavir Selim Bey hakkında aşağıdaki bilgiler bulunmaktadır:

    - 05.01.2024 tarihli eylemi nedeniyle verilen uyarma cezası kesinleşmiş ve 15.04.2024 tarihinde kendisine bildirilmiştir.

    - 01.09.2024 tarihli başka bir eylemi nedeniyle verilen uyarma cezası kesinleşmiş ve 10.02.2025 tarihinde kendisine bildirilmiştir.

    - 20.03.2026 tarihinde, adres değişikliğini süresinde bildirmemek şeklinde ve tek başına uyarma cezasını gerektiren yeni
    bir eylemde bulunmuştur.


    SMMM ve YMM Kanunu Disiplin Yönetmeliği''ne göre oda disiplin kurulunun bu son eylem için verebileceği ceza bakımından
    aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Esas ceza uyarmadır; önceki cezalar farklı eylemlere ilişkin olduğundan yinelenme hükmü uygulanmaz.
    B: Esas ceza geçici olarak mesleki faaliyetten alıkoymadır; çünkü üç yıl içinde üçüncü disiplin suçu işlenmiştir.
    C: Esas ceza kınamadır; uyarma cezası takdiren kaldırılamayacağından kurul bu cezayı hafifletemez.
    D: Esas ceza kınamadır; kurul gerekçesini belirterek uyarma ya da geçici alıkoyma cezası verebilir.
    E: Esas ceza kınamadır; kurul cezayı yalnız ağırlaştırabilir, hafifletme yetkisi Birlik Disiplin Kuruluna aittir.
  dogru: D
  aciklama:
    dogru_neden: 'Yönetmelik md. 6/1-a''ya göre üç yıllık bir dönem içinde üçüncü kez uyarma cezası gerektiren herhangi bir
      eylemin yinelenmesi kınama cezasını gerektirir. md. 11/3''e göre bunun için ilk iki cezanın kesinleşip ilgiliye bildirilmesi
      ve buna rağmen süre içinde yeni eylemin işlenmesi gerekir. Her iki uyarma da kesinleşip bildirilmiş, yeni eylem ilk
      eylemden itibaren üç yıl içinde işlenmiştir. Esas ceza kınamadır. md. 11/1''e göre disiplin kurulları gerekçesini kararda
      belirterek bir derece ağır (geçici olarak mesleki faaliyetten alıkoyma) veya bir derece hafif (uyarma) ceza verebilir.
      Yalnız uyarma cezası bir derece hafifletilerek ortadan kaldırılamaz. Püf noktaları: ''Herhangi bir eylem'' ifadesi nedeniyle
      eylemlerin aynı türden olması gerekmez. Uyarmanın kaldırılamaması yasağı, kınamanın uyarmaya indirilmesini engellemez;
      yalnız uyarmanın ''cezasızlığa'' indirilmesini engeller.'
    celdiriciler:
      A: md. 6/1-a 'herhangi bir eylemin yinelenmesi' ifadesini kullanır; eylemlerin aynı olması aranmaz, üçüncü uyarmalık
        eylem kınamayı gerektirir.
      B: Üç yıl içinde üçüncü kez kınama gerektiren eylem alıkoymayı gerektirir (md. 7/1-a). Burada önceki cezalar uyarmadır;
        esas ceza kınamadır, alıkoyma ancak bir derece ağır takdirle verilebilir.
      C: md. 11/1'deki yasak yalnız uyarma cezasının hafifletilerek ortadan kaldırılmasına ilişkindir; kınamadan uyarmaya
        inilmesi mümkündür.
      E: md. 11/1 bir derece ağır veya hafif ceza takdir yetkisini oda ve Birlik disiplin kurullarına birlikte tanır; hafifletme
        yalnız Birliğe ait değildir.
    hesap_adimlari: []
