- id: YMM-DRM-MHK-0034
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: 3568 sayılı Kanun YMM şartları ve yasaklar
  tip: uygulama
  zorluk: 2
  kok: Vergi müfettişi Deniz Bey, vergi inceleme yetkisini 01.09.2016 tarihinde almış ve o tarihten Ekim 2026'ya kadar kesintisiz
    olarak vergi inceleme yetkisiyle kamu kurumunda görev yapmıştır. Mesleki yeterlilik sınavını 2019 yılında kazanmış, yeminli
    mali müşavirlik sınavını ise 2022 yılında vermiştir. Deniz Bey serbest muhasebeci mali müşavirlik sınavına hiç girmemiştir.
    Ekim 2026'da kamu görevinden ayrılarak yeminli mali müşavir ruhsatı için başvuran Deniz Bey hakkında 3568 sayılı Kanun'a
    göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Ruhsat alabilir; yetkiyi aldığı tarihten beri kamuda geçen süresi SMMM'lik sayılır ve on yıl dolmuştur.
    B: Ruhsat alamaz; on yıllık süre, mesleki yeterlilik sınavını kazandığı 2019 yılından itibaren hesaplanır.
    C: Ruhsat alamaz; SMMM sınavını kazanmadığı için verdiği yeminli mali müşavirlik sınavı geçerli sayılmaz.
    D: Ruhsat alamaz; on yıllık süre, yeminli mali müşavirlik sınavını verdiği 2022 yılından itibaren işlemeye başlar.
    E: Ruhsat alabilir; ancak ruhsattan önce ayrıca Temel Eğitim ve Staj Merkezinde üç yıllık staj yapması gerekir.
  dogru: A
  aciklama:
    dogru_neden: md. 9/1-a'ya göre YMM olabilmek için en az 10 yıl SMMM'lik yapmış olmak gerekir. md. 9/2 uyarınca vergi inceleme
      yetkisi almış olanların bu yetkiyi aldıkları tarihten itibaren kamu kurum ve kuruluşlarında geçen hizmet süreleri SMMM'likte
      geçmiş süre sayılır. Yeterlilik sınavını kazandığı için sonraki süreleri de dışlanmaz. 01.09.2016'dan Ekim 2026'ya kadar
      10 yıl dolmuştur. Bu kişiler yeterlilik sınavını kazandıkları tarihten sonra açılan YMM sınavlarına girebilir (md. 9/son),
      ruhsat için yalnız (a) bendindeki süreyi tamamlamaları gerekir; SMMM sınavını kazanmış olma şartı da aranmaz (md. 5/A-c
      ikinci paragraf).
    celdiriciler:
      B: Süre, yeterlilik sınavı tarihinden değil vergi inceleme yetkisinin alındığı tarihten itibaren sayılır. Yeterlilik
        sınavı tarihi, sınava katılabilme bakımından önem taşır.
      C: md. 5/A-c ikinci paragrafı, vergi inceleme yetkisi alıp yeterlilik sınavını kazandıktan sonra YMM sınavını verenlerde
        SMMM sınavını kazanma şartını aramaz.
      D: Bu kişiler yeterlilik sınavını kazandıkları tarihten itibaren açılan YMM sınavlarına girebilir. On yıllık süre YMM
        sınavı tarihinden başlamaz; inceleme yetkisinin alındığı tarihten itibaren hesaplanır.
      E: Kanun'un 6 ncı maddesindeki staj, SMMM'liğe giriş içindir. md. 9'da YMM ruhsatı için ayrıca staj şartı öngörülmemiştir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 9/2
    alinti: kanunları uyarınca vergi inceleme yetkisi almış olanların, bu yetkiyi aldıkları tarihten itibaren kamu kurum ve
      kuruluşlarında geçen hizmet süreleri
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 9/son
    alinti: Kanunları uyarınca vergi inceleme yetkisini almış ve mesleki yeterlilik sınavını vermiş olanlar, yeterlilik sınavını
