  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: disiplin cezaları
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Kaan Bey, disiplin cezasını gerektiren ve ayrıca suç teşkil etmeyen bir eylemi 10.03.2021 tarihinde
    işlemiştir. Bu eyleme ilişkin şikâyet dilekçesi 05.02.2026 tarihinde ilgili oda kayıtlarına girmiştir. Kaan Bey 15.03.2026
    tarihinde meslekten ayrılarak odadan kaydını sildirmiştir. Oda yönetim kurulu ise 20.04.2026 tarihinde disiplin soruşturması
    yapılmasına karar vermiştir. SMMM ve YMM Kanunu Disiplin Yönetmeliği'ne göre bu durumla ilgili aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Beş yıllık süre 10.03.2026'da dolduğundan ve soruşturma kararı bu tarihten sonra alındığından soruşturma yapılamaz.
    B: Zamanaşımı ancak yönetim kurulunun soruşturma kararıyla durur; karar beş yıl dolduktan sonra alındığından soruşturma
      yapılamaz.
    C: Zamanaşımı şikâyetin oda kayıtlarına girdiği tarihte durmuştur; odadan kaydın silinmesi de soruşturmaya engel değildir.
    D: Zamanaşımı şikâyetin oda kayıtlarına girdiği tarihte durmuştur; ancak kaydı silindiğinden soruşturma açılamaz.
    E: Disiplin soruşturması zamanaşımı üç yıl olduğundan süre 2024 yılında dolmuş, soruşturma yapılamaz.
  dogru: C
  aciklama:
    dogru_neden: 'Disiplin Yönetmeliği md. 14/2''ye göre disiplin cezasını gerektiren eylemin işlenmesinden itibaren beş yıl
      geçmişse soruşturma yapılamaz. Ancak şikâyet dilekçesinin oda kayıtlarına girdiği tarihten itibaren zamanaşımı durur.
      Eylem 10.03.2021''de işlenmiş, şikâyet beş yıl dolmadan (05.02.2026) oda kayıtlarına girmiştir. Bu nedenle zamanaşımı
      o tarihte durmuştur. Soruşturma kararının 10.03.2026''dan sonra alınması sonucu değiştirmez. md. 14/son''a göre meslekten
      ayrılma ve odadan kaydın silinmesi, mesleğin ifası sırasındaki eylemler nedeniyle soruşturma yapılmasına ve ceza verilmesine
      engel değildir. Püf noktaları: Zamanaşımını durduran işlem soruşturma kararı değil, şikâyetin oda kayıtlarına girmesidir.
      Soruşturmayı sona erdiren haller ise yalnız ölüm ve akıl sağlığının sürekli kaybıdır; kaydın silinmesi bunlardan biri
      değildir.'
    celdiriciler:
      A: Zamanaşımının şikâyetin oda kayıtlarına girmesiyle durduğu gözden kaçırılmıştır; şikâyet beş yıl dolmadan girmiştir.
      B: Yönetmelik durma anını yönetim kurulu kararına değil şikâyet dilekçesinin oda kayıtlarına girdiği tarihe bağlar.
      D: md. 14/son'a göre meslekten ayrılma ve kaydın silinmesi disiplin soruşturmasına ve ceza verilmesine engel değildir;
        soruşturmayı sonlandıran haller ölüm ve akıl sağlığının sürekli kaybıdır.
      E: Disiplin soruşturmasında zamanaşımı beş yıldır; üç yıllık dönem tekerrür (cezanın ağırlaştırılması) hükümlerinde
        geçer.
