  kok: 3568 sayılı Kanun’a göre Oda Genel Kurulunun toplanması, çalışması ve görevleriyle ilgili aşağıdaki ifadelerden hangisi
    **yanlıştır**?
  secenekler:
    A: Genel Kurul, üç yılda bir Mayıs ayının içinde, bütçeyi ve gündemdeki diğer maddeleri görüşmek ve gereken seçimleri
      yapmak üzere toplanır.
    B: Üyelerin beşte birinin yazılı talebi üzerine Oda Yönetim Kurulu Başkanı, Genel Kurulu en geç 15 gün içinde toplantıya
      çağırmak zorundadır.
    C: Genel Kurul, Yönetim Kurulunu ibra eder ve gerektiğinde sorumlu görülenler hakkında disiplin soruşturmasına karar verebilir.
    D: Genel Kurul başkanlık divanına, Oda Yönetim Kurulu Başkanı ile Yönetim Kurulu ve Denetleme Kurulu üyeleri serbestçe
      seçilebilir.
    E: Genel Kurul toplantısında ilk iş olarak bir başkan, bir başkanvekili ve iki katipten kurulu bir başkanlık divanı seçilir.
  dogru: D
  aciklama:
    dogru_neden: 'Kanun md. 20’ye göre Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık divanına
      seçilemezler. Diğer şıklardaki ifadeler md. 19 ve 20 ile uyumludur. Püf noktaları: Sorudaki yanlış, toplantı sayıları
      ya da oranlarda değil, divanın kimlerden oluşabileceğindedir; beşte bir ve 15 gün ile üç yılda bir Mayıs ayı kalıplarının
      doğru olduğu bilinmelidir.'
    celdiriciler:
      A: Doğru; md. 20/1 Genel Kurulun üç yılda bir Mayıs ayının içinde toplanacağını belirtir.
      B: Doğru; md. 20/3 üyelerin beşte birinin yazılı talebinde en geç 15 gün içinde toplantıya çağırma zorunluluğu getirir.
      C: Doğru; md. 19/g Genel Kurula Yönetim Kurulunu ibra etme ve gerektiğinde disiplin soruşturmasına karar verme görevi
        verir.
      E: Doğru; md. 20 başkanlık divanının bir başkan, bir başkanvekili ve iki katipten oluşacağını belirtir.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 20/8
    alinti: Oda Yönetim Kurulu Başkanı, yönetim ve denetleme kurulu üyeleri başkanlık divanına seçilemezler.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
