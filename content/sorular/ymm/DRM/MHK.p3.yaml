  kok: 'Disiplin Yönetmeliği’ne göre disiplin soruşturması ve kovuşturmasına ilişkin sürelerle ilgili aşağıdaki öncüllerden
    hangileri doğrudur?


    I. İlgili oda yönetim kurulu, ivedi durumlar hariç olmak üzere, ihbar, şikâyet veya istem konusunun bildirilmesinden itibaren
    en geç iki ay içinde konuyu incelemek zorundadır.

    II. Oda yönetim kurulu, disiplin soruşturmasını ihbar, şikâyet veya istek tarihinden itibaren en geç bir yıl içinde sonuçlandırır.

    III. Oda disiplin kurulu, kovuşturmayı yönetim kurulu kararından itibaren en geç bir yıl içinde sonuçlandırmak zorundadır;
    ceza davasının sonucunun beklenmesini gerektiren haller saklıdır.

    IV. Disiplin kovuşturmasına yer olmadığına ilişkin oda yönetim kurulu kararı, soruşturma sonucu verilecek karar tarihinden
    itibaren en geç üç ay içinde yazılı olarak bildirilir.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 18’e göre ilk inceleme süresi iki aydır (I doğru). Md. 19’a göre soruşturma ihbar, şikâyet veya istek
      tarihinden itibaren en geç altı ay içinde sonuçlandırılır; bir yıl yanlıştır (II yanlış). Md. 23’e göre oda disiplin
      kurulu kovuşturmayı yönetim kurulu kararından itibaren en geç bir yıl içinde sonuçlandırır (III doğru). Md. 20’ye göre
      kovuşturmaya yer olmadığına ilişkin karar, soruşturma sonucu verilecek karar tarihinden itibaren en geç üç ay içinde
      bildirilir (IV doğru). Püf noktaları: Altı aylık süre soruşturma aşamasına, bir yıllık süre ise disiplin kurulundaki
      kovuşturma aşamasına aittir; iki ay yalnızca yönetim kurulunun ilk incelemesi içindir.'
    celdiriciler:
      A: II yanlıştır; soruşturma süresi altı aydır. Ayrıca III ve IV de doğru olduğundan birleşim eksiktir.
      B: II yanlıştır; ancak IV de doğru olduğundan birleşim eksiktir.
      D: I de doğrudur ve II yanlıştır; bu birleşim I’i dışarıda bırakıp yanlış öncül olan II’yi içerir.
      E: II’deki bir yıllık süre yanlıştır; soruşturma süresi altı aydır.
