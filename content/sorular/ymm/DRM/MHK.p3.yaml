  aciklama:
    dogru_neden: 'Not 11’e göre münhasıran yıl içinde işe başlayan mükelleflerde gelir ve kurumlar vergisi beyannamesi tasdik
      ücretinde ay kesirleri tam sayılarak kıst uygulanır; 10 Mayıs’ta başlayan mükellef için Mayıs dahil 8 ay esas alınır.
      Not 6’ya göre hizmetin yapıldığı yılın tarifesi esastır; Not 8’e göre 01/01/2026’dan önce 2026 yılında yapılacak hizmetler
      için düzenlenen sözleşmelerdeki ücret, 2026 tarifesinde belirlenen ücretten düşük olamaz. Tarifeye göre kıst ücret 300.000
      x 8 / 12 = 200.000 TL, sözleşmedeki kıst ücret ise 240.000 x 8 / 12 = 160.000 TL’dir; alınabilecek en az ücret 200.000
      TL’dir. Püf noktaları: Kıst hesabında Mayıs ayı kesir olsa da tam ay sayılır; sözleşmedeki daha düşük tutar tarife ücretine
      yükseltilmek zorundadır.'
    celdiriciler:
      A: Yarım yıl (6 ay) esas alınmıştır (300.000 x 6 / 12); oysa Mayıs dahil 8 ay (Mayıs-Aralık) hesaplanır.
      B: Sözleşmedeki tutar esas alınmıştır (240.000 x 8 / 12); oysa 2026 tarifesinden düşük ücret kabul edilemez (Not 8).
      C: 7 ay esas alınmıştır; Mayıs ayının kesri sayılmamış, Haziran-Aralık hesaplanmıştır (300.000 x 7 / 12).
      E: Kıst uygulanmamış, tam yıl ücreti alınmıştır; oysa yıl içinde işe başlayan mükellefte kıst uygulanır (Not 11).
