  kok: Ücret esasında en çok %15 indirim uygulanabilen 2. grup ilde faaliyet gösteren Sera Gıda A.Ş.’nin muhasebesi serbest
    muhasebeci mali müşavir tarafından tutulmakta ve beyannameleri onun tarafından düzenlenip imzalanmaktadır. Ayrıca yeminli
    mali müşavir bu kuruluşa, Gelir ve Kurumlar Vergisi Beyannamesi tasdiki dışında, birden fazla tasdik hizmeti de vermektedir.
    Tarifeye göre hesaplanan toplam nispi tasdik ücreti 400.000 TL’dir ve bu tutarın tamamı Gelir ve Kurumlar Vergisi Beyannamesi
    tasdiki dışındaki hizmetlere ilişkindir. Grup şirketi indirimi söz konusu değildir; indirimli tutarlar tarifedeki asgari
    maktu ücretin altına düşmemektedir ve başka bir indirim yoktur. 2026 Yılı Asgari Ücret Tarifesi notlarındaki indirimlerden
    uygulanabilecek en yüksek indirimler uygulandığında alınabilecek en az nispi tasdik ücreti ______ TL olur.
  secenekler:
    A: 176.800 TL
    B: 200.000 TL
    C: 221.000 TL
    D: 260.000 TL
    E: 272.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Not 12-B’ye göre önce ücret esasında il grubuna göre indirim (2. grup ilde en çok %15) uygulanır, ardından
      yalnızca nispi tasdik ücretlerinde sırasıyla (a) SM/SMMM’nin muhasebe tutması (%20) ve (b) birden fazla tasdik ve denetim
      hizmeti (%35) indirimleri uygulanabilir; (a) ve (b) indirimlerinden yalnızca biri uygulanabildiğinden en yüksek olan
      %35 seçilir. 400.000 x 0,85 = 340.000 TL; 340.000 x 0,65 = 221.000 TL. Püf noktaları: (a) ve (b) indirimleri toplanmaz
      ve birlikte uygulanmaz; il indirimi önce uygulanır, ikinci indirim indirilmiş tutar üzerinden hesaplanır.'
    celdiriciler:
      A: İl indirimi sonrası hem %20 hem %35 indirim ardışık uygulanmıştır (400.000 x 0,85 x 0,80 x 0,65); oysa (a) ve (b)
        bentlerinden yalnızca biri uygulanabilir.
      B: İndirim oranları toplanmıştır (%15 + %35 = %50); oysa il indirimi uygulandıktan sonra ikinci indirim indirilmiş tutar
        üzerinden hesaplanır.
      D: İl grubu indirimi (%15) unutulmuş, yalnızca %35 uygulanmıştır (400.000 x 0,65).
      E: İl indirimi sonrası %35 yerine daha düşük olan %20 uygulanmıştır (340.000 x 0,80); oysa uygulanabilecek en yüksek
        indirim %35’tir.
    hesap_adimlari:
    - 'İl grubu indirimi: 400.000 x (100 - 15) / 100 = 340.000 TL'
    - (a) %20 ve (b) %35 indirimlerinden yalnızca biri uygulanabilir; en yüksek %35 seçilir
    - 340.000 x (100 - 35) / 100 = 221.000 TL
