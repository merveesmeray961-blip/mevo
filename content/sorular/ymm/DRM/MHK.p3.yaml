  aciklama:
    dogru_neden: 'Md. 9/a yeminli mali müşavir olabilmek için en az 10 yıl serbest muhasebeci mali müşavirlik yapmış olmayı
      arar. Md. 9/2’ye göre serbest muhasebeci mali müşavirlerden bir işyerine bağlı olarak çalışanların bu işyerlerinde geçen
      hizmet süreleri ile hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi ve siyasal bilimler dallarında
      öğretim üyeliği veya görevliliği yapmış olanların bu hizmetlerinde geçen süreler serbest muhasebeci mali müşavirlikte
      geçmiş süre sayılır. Dolayısıyla 4 + 3 + 1 = 8 yıl dikkate alınır; mühendislik fakültesindeki görevlilik sayılmaz. Gereken
      ek süre 10 - 8 = 2 yıldır. Püf noktaları: Öğretim hizmetinin sayılması için dalın Kanun’da sayılanlar arasında olması
      gerekir; bağımlı çalışma süresi de aynı kapsamda dikkate alınır.'
