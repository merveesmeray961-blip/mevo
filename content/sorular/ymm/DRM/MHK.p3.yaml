- id: YMM-DRM-MHK-0046
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: 3568 sayılı Kanun YMM şartları ve yasaklar
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Derya, müşterisi Ay Metal A.Ş.’nin defter ve belgelerini incelerken şirketin sahte fatura kullandığını
    öğrenmiştir. Daha sonra konuyla ilgili yürütülen ceza soruşturmasında savcılık tarafından tanık olarak dinlenmiş ve bildiklerini
    anlatmıştır. Derya ayrıca çeşitli kanunlarla muhbirlere tanınan ödül niteliğindeki hak ve menfaatlerden yararlanmak istemektedir.
    3568 sayılı Kanun’un meslek sırlarına ilişkin hükmüne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Tanık olarak beyanda bulunması sırrın ifşası sayıldığından, müşterisinin yazılı izni olmaksızın bildiklerini anlatamaz;
      muhbirlere tanınan haklardan yararlanabilir.
    B: Tanıklık sırrın ifşası sayılmaz; suç teşkil eden hâllerin yetkili mercilere duyurulması ise kendi takdirindedir ve
      muhbirlere tanınan haklardan yararlanamaz.
    C: Tanıklık sırrın ifşası sayılmaz; suç teşkil eden hâlleri duyurmak zorundadır ve ayrıca muhbirlere tanınan hak ve menfaatlerden
      de yararlanabilir.
    D: Suç teşkil eden hâlleri yetkili mercilere duyurmak isteğe bağlıdır; tanık olarak dinlenmesi halinde dahi sır saklama
      yükümlülüğü aynen sürer.
    E: Tanıklık sırrın ifşası sayılmaz; suç teşkil eden hâlleri yetkili mercilere duyurmak zorundadır, ancak muhbirlere tanınan
      hak ve menfaatlerden yararlanamaz.
  dogru: E
  aciklama:
    dogru_neden: 'Kanun md. 43’e göre meslek mensupları işleri dolayısıyla öğrendikleri bilgi ve sırları ifşa edemez ve muhbirlere
      tanınan hak ve menfaatlerden faydalanamaz; ancak suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir.
      Adli veya idari her türlü inceleme veya soruşturma sır yasağının dışındadır ve tanıklık sırrın ifşası sayılmaz. Püf
      noktaları: Duyurma yükümlülüğü ile muhbir haklarından yararlanma yasağı aynı maddede birlikte yer alır; ikisini ayrı
      değerlendirmek yanılgıya götürür.'
    celdiriciler:
      A: Tanıklık sırrın ifşası sayılmaz (md. 43/4) ve meslek mensubu muhbirlik haklarından yararlanamaz.
      B: Suç teşkil eden hallerin yetkili mercilere duyurulması takdire bağlı değil, mecburidir.
      C: Meslek mensubu muhbirlere tanınan hak ve menfaatlerden faydalanamaz.
      D: Suç teşkil eden hallerin duyurulması mecburidir ve adli soruşturma sır yasağının dışındadır; tanıklık sırrın ifşası
