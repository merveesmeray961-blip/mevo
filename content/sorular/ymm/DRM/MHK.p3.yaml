  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: haksız rekabet ve reklam yasağı
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Selim Tan, yeni açtığı bürosu için tabela ve kartvizit hazırlatacaktır. Haksız Rekabet ve Reklam
    Yasağı Yönetmeliği’ne göre aşağıdaki uygulamalardan hangisi yapılabilir?
  secenekler:
    A: Tabelada oda amblemi, meslek unvanı, ad ve soyadı ile e-posta adresine; kartvizitte sicil ve ruhsat numarasına yer
      vermek.
    B: Tabelada ad ve unvanın yanında büronun faaliyet alanını belirten “Vergi Planlama ve Denetim Danışmanlığı” ifadesine
      yer vermek.
    C: Kartvizitte meslek unvanı ve adresin yanında, daha önce Oda Yönetim Kurulu üyeliği yaptığını belirten bir ibareye yer
      vermek.
    D: Tabelada meslek unvanı ve adın yanında, büronun adını İngilizce olarak gösteren bir tanıtım ifadesine de yer vermek.
    E: Kartvizitin arka yüzüne, büronun hizmet verdiği önemli müşterilerin adlarını ve çalıştığı sektörleri yazdırmak.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 14/1 tabelada oda ve Birlik amblemi, meslek unvanı ile ad ve soyad, akademik unvan, adres, telefon,
      internet ve e-posta adresinin yer alabileceğini; bunların dışında unvan, deyim, yabancı dilde ifade, resim vb. yer verilemeyeceğini
      belirtir. Md. 15/2 kartvizitte sicil numarası ve ruhsat numarasının yer alabileceğini düzenler. Püf noktaları: Geçmiş
      oda/Birlik görevleri kartvizitte kullanılamaz (md. 15/5) ve kartvizitte ad-unvanı belirtme amacını aşan hiçbir yazı
      yer alamaz (md. 15/6).'
    celdiriciler:
      B: Tabelada bu Yönetmelikte belirlenenlerin dışında unvan ve deyime yer verilemez; faaliyet alanı ifadesi yasaktır.
      C: Odalar ve Birlik organlarında geçmişte görev alan meslek mensupları bu unvanlarını kullanamazlar (md. 15/5).
      D: Tabelada yabancı dillerde yazılmış ifadelere yer verilemez (md. 14/1).
      E: Kartvizitte ad ve unvanı belirtme amacını aşan hiçbir yazı yer alamaz (md. 15/6); müşteri adları reklam niteliği
        taşır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 14/1
    alinti: Tabelada bu Yönetmelikte belirlenenlerin dışında unvan, deyim, yabancı dillerde yazılmış ifadeler ile sair şekiller,
      işaret, resim, fotoğraf ve benzerlerine yer verilemez.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 15/2
    alinti: ruhsat numarası, vergi dairesi ve vergi sicil numarası yer alabilir.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
