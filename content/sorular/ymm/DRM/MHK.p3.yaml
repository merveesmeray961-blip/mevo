- id: YMM-DRM-MHK-0054
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: haksız rekabet ve reklam yasağı
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Kaan Sevinç, mesleki konularda kendi adına bir kitap yazmayı, kitabı kendisi bastırıp satmayı
    ve ayrıca verdiği hizmetin adıyla marka tescili yaptırmayı planlamaktadır. Kaan Sevinç, Sevinç YMM Ortaklığı’nda çalışmaktadır
    ve akademik unvanı da bulunmaktadır. Haksız Rekabet ve Reklam Yasağı Yönetmeliği’ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kitapta büro unvanını da kullanabilir; kitabı bastırıp satması yayıncılık sayıldığından yasaktır, marka tescili yaptıramaz.
    B: Kitapta yalnızca mesleki unvanını kullanabilir, akademik unvanını kullanamaz; kitabı bastırıp satabilir, marka tescili
      de yaptırabilir.
    C: Kitapta mesleki ve akademik unvanını kullanabilir, kitabı bastırıp satabilir; büro unvanını kullanamaz, hizmetini marka
      olarak tescil ettiremez.
    D: Kitapta mesleki ve akademik unvanını kullanabilir; kitabı bastırması yayıncılık sayıldığından yasaktır, hizmetin markası
      ise büro unvanıyla tescil edilebilir.
    E: Kitapta büro unvanını da kullanabilir ve kitabı kendisi bastırıp satabilir; ancak hizmetini marka olarak tescil ettiremez.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 19/1’e göre meslek mensupları mesleki konulardaki kitap ve makalelerde mesleki ve akademik unvanlarını
      kullanabilir, ancak çalıştıkları büro, şirket veya kurumun ad veya unvanını kullanamaz. Md. 19/2’ye göre meslek mensupları
      yayıncılık yapamaz; fakat kendi yazdıkları kitapları bastırıp satmaları yayıncılık faaliyeti sayılmaz. Md. 16’ya göre
      serbest muhasebeci mali müşavirlik ve yeminli mali müşavirlik hizmeti hiçbir sıfat altında marka olarak tescil ettirilemez.
      Püf noktaları: Kitapta unvan kullanımı (mesleki ve akademik: serbest; büro unvanı: yasak), basıp satma (yayıncılık sayılmaz)
      ve marka tescili (yasak) birbirinden bağımsız üç ayrı kuraldır.'
    celdiriciler:
      A: Çalışılan büronun ad veya unvanı kitapta kullanılamaz (md. 19/1); kendi yazdığı kitabı bastırıp satmak ise yayıncılık
        faaliyeti sayılmaz (md. 19/2).
      B: Mesleki ve akademik unvanlar birlikte kullanılabilir (md. 19/1); hizmet hiçbir sıfat altında marka olarak tescil
        ettirilemez (md. 16).
      D: Kitabı bastırıp satmak yayıncılık sayılmaz (md. 19/2) ve hizmet marka olarak tescil ettirilemez (md. 16).
      E: Marka tescili yasağı doğrudur; ancak çalışılan büronun ad veya unvanı kitapta kullanılamaz (md. 19/1).
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 19/1
    alinti: mesleki ve akademik unvanlarını kullanabilir ancak, çalıştığı büro, şirket veya kurumun ad veya unvanını kullanamaz.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
      Yönetmeliği
    madde: md. 19/2
    alinti: yazdıkları kitapları bastırıp satmaları yayıncılık faaliyeti sayılmaz.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı
