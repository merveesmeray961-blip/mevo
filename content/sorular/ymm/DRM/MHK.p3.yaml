  kok: Kurumlar vergisi mükellefi Delta Ltd. Şti., 10 Mayıs 2026 tarihinde faaliyete başlamıştır. Şirket ile yeminli mali
    müşavir arasında Aralık 2025’te imzalanan sözleşmede, 2026 yılı kurumlar vergisi beyannamesi tasdik ücreti, tam yıl için
    240.000 TL kabul edilerek ay kesirleri tam sayılmak suretiyle kıst esasına göre belirlenmiştir. 2026 Yılı Asgari Ücret
    Tarifesi’ne göre aynı hizmet için tam yıl tasdik ücreti 300.000 TL’dir; başka bir indirim ya da alt sınır söz konusu değildir.
    Tarife notlarına göre 2026 yılında yapılacak bu hizmet için alınabilecek en az ücret ______ TL’dir.
