- id: YMM-DRM-MHK-0053
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: disiplin cezaları
  tip: uygulama
  zorluk: 3
  kok: 'Aşağıdaki eylemlerden hangileri, Disiplin Yönetmeliği’ne göre ilk defa işlendiklerinde (tekerrür ve takdir hakkı dikkate
    alınmaksızın) doğrudan geçici olarak mesleki faaliyetten alıkoyma cezasını gerektirir?


    I. Meslek mensubunun, meslek mensubu olmayan bir kişiyle Kanun ve yönetmelik hükümlerine aykırı olarak işbirliği yapması

    II. Meslek mensubunun, kasıt olmaksızın gerekli özen ve titizliği göstermeden, yasal düzenlemelere aykırı olarak beyanname
    imzalaması

    III. Meslek mensubunun ticari faaliyet yasağına uymaması

    IV. Meslek mensubunun, başka bir meslek mensubunun ad ve unvanını kullanarak beyanname düzenleyip imzalaması'
  secenekler:
    A: I ve III
    B: I ve IV
    C: II ve III
    D: II, III ve IV
    E: I, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'Md. 7/c meslek mensubu olmayan veya mesleği yapması yasaklanmış kişilerle Kanun ve yönetmelik hükümlerine
      aykırı işbirliğini, md. 7/e ticari faaliyet yasağına uyulmamasını alıkoyma cezası gerektiren haller arasında sayar (I
      ve III doğru). Kasıt olmaksızın özen gösterilmeden beyanname imzalanması md. 6/n uyarınca kınama cezası gerektirir (II
      alıkoyma değildir). Başka meslek mensubunun ad ve unvanı kullanılarak beyanname düzenlenmesi ve imzalanması ise md.
      9/e uyarınca meslekten çıkarma cezası gerektirir (IV alıkoyma değildir). Püf noktaları: Aynı beyanname imzalama konusunda
      kasıt yoksa kınama (6/n), kasıt varsa alıkoyma (7/f), ad ve unvan kullanımı varsa meslekten çıkarma (9/e) söz konusudur.'
    celdiriciler:
      B: IV meslekten çıkarma cezasını gerektirir (md. 9/e); III ise alıkoyma gerektirdiğinden birleşimde eksiktir.
      C: II kasıt olmaksızın özensizlik olduğundan kınama cezası gerektirir (md. 6/n); I ise alıkoyma gerektirdiğinden birleşimde
        eksiktir.
      D: II kınama (md. 6/n), IV meslekten çıkarma (md. 9/e) gerektirir; ikisi de alıkoyma değildir.
      E: IV meslekten çıkarma cezasını gerektirir (md. 9/e), alıkoyma değildir.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 7/c
    alinti: Kanun ve yönetmelik hükümlerine aykırı olarak işbirliği yapılması.
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
