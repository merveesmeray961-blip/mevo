- id: YMM-DRM-MHK-0050
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: ücret tarifesi
  tip: hesaplama
  zorluk: 3
  kok: Yeminli mali müşavir Cansu Eren ile Orhun Metal A.Ş. arasında 2026 yılı için sürekli denetim ve tasdik sözleşmesi bulunmaktadır;
    sözleşmedeki yıllık sürekli denetim ve tasdik ücreti 480.000 TL’dir. Orhun Metal A.Ş.’nin kredilere ilişkin tasdik işlemleri
    için 2026 Yılı Asgari Ücret Tarifesi’ne göre bulunan ücret 300.000 TL’dir. Başka hiçbir indirim söz konusu değildir ve
    indirim sonrası tutar tarifedeki asgari ücretin altına düşmemektedir. Tarife notlarındaki ilgili indirim uygulandığında
    kredilere ilişkin tasdik işlemleri için alınabilecek en az ücret ______ TL olur.
  secenekler:
    A: 150.000 TL
    B: 180.000 TL
    C: 225.000 TL
    D: 300.000 TL
    E: 360.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Tarife Not 12-C’ye göre yeminli mali müşavir ile sürekli denetim ve tasdik sözleşmesi bulunan mükelleflerin
      kredilere ilişkin tasdik işlemlerinde %50 indirim uygulanır; ancak uygulanan indirim tutarı yıllık sürekli denetim ve
      tasdik ücretinin %25’ini geçemez. %50 indirim 300.000 x %50 = 150.000 TL eder; tavan 480.000 x %25 = 120.000 TL olduğundan
      indirim 120.000 TL ile sınırlıdır. Alınabilecek en az ücret 300.000 - 120.000 = 180.000 TL’dir. Püf noktaları: Tavan,
      kredi tasdik ücretinin değil yıllık sürekli denetim ve tasdik ücretinin %25’idir; %50 indirim tutarı tavanı aşıyorsa
      tavan geçerlidir.'
    celdiriciler:
      A: Kredi tasdik ücretine yalnızca %50 indirim uygulanıp (300.000 - 150.000) tavan kuralı gözetilmemiştir.
      C: Tavan yanlışlıkla kredi tasdik ücretinin %25’i (75.000 TL) alınmış, 300.000 - 75.000 = 225.000 TL bulunmuştur.
      D: İndirim hiç uygulanmamıştır; oysa sürekli denetim ve tasdik sözleşmesi bulunan mükellefin kredi tasdiklerinde indirim
        yapılır.
      E: Yıllık sürekli denetim ve tasdik ücretinin %25’i (120.000 TL) değil, %75’i alınıp 480.000 x %75 = 360.000 TL bulunmuştur.
    hesap_adimlari:
    - 'Kredi tasdik ücretine %50 indirim: 300.000 x 50 / 100 = 150.000 TL'
    - 'İndirim tavanı: 480.000 x 25 / 100 = 120.000 TL'
    - Uygulanacak indirim = min(150.000; 120.000) = 120.000 TL
    - Alınabilecek en az ücret = 300.000 - 120.000 = 180.000 TL
  kaynaklar:
  - mevzuat: 2026 Yılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Asgari Ücret Tarifesi
    madde: Not 12-C
    alinti: Yeminli mali müşavir ile sürekli denetim ve tasdik sözleşmesi bulunan mükelleflerin kredilere ilişkin tasdik işlemlerinde
      %50 indirim uygulanır.
  - mevzuat: 2026 Yılı Serbest Muhasebecilik, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Asgari Ücret Tarifesi
    madde: Not 12-C
    alinti: Uygulanan indirim tutarı, yıllık sürekli denetim ve tasdik ücretinin %25’ini geçemez.
