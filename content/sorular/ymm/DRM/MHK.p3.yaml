- id: YMM-DRM-MHK-0044
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: disiplin cezaları
  tip: kavrama
  zorluk: 3
  kok: 'Aşağıdaki eylemlerden hangileri, Disiplin Yönetmeliği’ne göre ilk defa işlendiğinde (başka bir disiplin cezası bulunmaksızın
    ve takdir hakkı kullanılmaksızın) doğrudan kınama cezasını gerektirir?


    I. Mevzuata aykırı tabela kullanılması

    II. Yeminli mali müşavirce, kendi defterleri hariç, defter tutulması

    III. Asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Disiplin Yönetmeliği md. 5/e’ye göre mevzuata aykırı tabela kullanılması uyarma cezası gerektirir (I kınama
      değildir). Md. 6/j (yeminli mali müşavirin kendi defterleri hariç defter tutması) ve md. 6/g (asgari ücret tarifesindeki
      ücretlerin altında iş kabulü) kınama cezası hallerindendir. Püf noktaları: Benzer görünen tabela ve reklam yasağı eylemleri
      farklı ağırlıktadır; tabela ihlali uyarma, reklam yasağı ihlali (md. 6/f) kınama kapsamındadır.'
    celdiriciler:
      A: I kınama değil uyarma gerektirir; II ve III kınama gerektirdiğinden yalnız I doğru olamaz.
      B: III de md. 6/g gereği kınama cezası gerektirir; bu nedenle yalnız II eksiktir.
      C: I uyarma cezası gerektirir; II ise kınama kapsamında olduğundan bu birleşim hatalıdır.
      E: I uyarma (md. 5/e) kapsamındadır; bu nedenle üçünün birden kınama gerektirdiği söylenemez.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 5/e
    alinti: Mevzuata aykırı tabela kullanılması
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/j
    alinti: Yeminli Mali Müşavirlerce, kendi defterleri hariç, defter tutulması,
  - mevzuat: Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği
    madde: md. 6/g
    alinti: Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi,
