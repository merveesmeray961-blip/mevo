    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'kredi = 300000

      yillik = 480000

      indirim = kredi * 50 // 100

      tavan = yillik * 25 // 100

      indirim = min(indirim, tavan)

      sonuc = kredi - indirim'
