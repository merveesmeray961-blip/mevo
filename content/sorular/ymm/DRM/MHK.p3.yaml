    inceleme yetkisi bulunmamaktadır ve aşağıdaki hizmet dönemleri birbiriyle çakışmamaktadır: kendi adına serbest muhasebeci
    mali müşavirlik 4 yıl; bir serbest muhasebeci mali müşavire bağlı olarak o işyerinde çalışma 3 yıl; bir üniversitenin
    muhasebe alanında öğretim görevliliği 1 yıl; bir üniversitenin mühendislik fakültesinde öğretim görevliliği 2 yıl. Hakan
    Dinç’in 3568 sayılı Kanun’un yeminli mali müşavir olabilmek için aradığı 10 yıllık süreyi tamamlayabilmesi için bundan
    sonra serbest muhasebeci mali müşavirlik olarak en az kaç yıl daha çalışması gerekir?'
