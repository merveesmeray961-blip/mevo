- id: YMM-DRM-MHK-0042
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Meslek hukuku ve disiplin
  konu: MHK
  kazanim: 3568 sayılı Kanun YMM şartları ve yasaklar
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavirler Aylin, Burak ve Cenk, 3568 sayılı Kanun’un 45. maddesi çerçevesinde bir yeminli mali müşavirlik
    ortaklık şirketi kurarak çalışmalarını birleştirmiştir. Şirket bünyesinde yalnızca Burak’ın yürüttüğü bir işte, tasdik
    raporuna konu belgelerde kasıtlı gerçeğe aykırılık yapıldığı ve bu fiilin suç oluşturduğu tespit edilmiştir. Aylin ve
    Cenk bu işin yürütülmesinde hiçbir görev almamıştır. Kanun’a göre aşağıdaki sonuçlardan hangisi doğrudur?
  secenekler:
    A: Faaliyetler ticari faaliyet sayıldığından yasak ihlal edilmiştir; cezai sorumluluk üç ortak arasında eşit paylaştırılır.
    B: Şirket bünyesindeki faaliyetler ticari faaliyet sayılmaz; cezai sorumluluk, bu işi fiilen yapan Burak’a aittir.
    C: Faaliyetler ticari faaliyet sayılmaz; ancak cezai sorumluluk, şirket ortaklarının tamamına müteselsilen yüklenir.
    D: Ortaklık şirketi kurmak Bakanlık iznine bağlı olduğundan yasak ihlal edilmiştir; cezai sorumluluk Burak’a aittir.
    E: Faaliyetler ticari faaliyet sayılmaz; cezai sorumluluk, şirket ortaklarının sermaye payları oranında paylaştırılır.
  dogru: B
  aciklama:
    dogru_neden: 'Kanun md. 45/4’e göre meslek mensupları çalışmalarını ortaklık bürosu veya şirket şeklinde birleştirebilir;
      bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz (ticari faaliyet yasağı ihlal edilmez). Şirket şeklinde çalışılması
      halinde yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna, yani Burak’a aittir. Püf noktaları: Ortaklık
      yapısı cezai sorumluluğu ortaklara yaymaz; sorumluluğu belirleyen, işi fiilen yapan kişidir.'
    celdiriciler:
      A: Ortaklık bürosunda yapılan faaliyet ticari faaliyet sayılmaz ve cezai sorumluluk eşit paylaştırılmaz.
      C: Cezai sorumluluk ortaklara müteselsilen yüklenmez; işi yapan meslek mensubuna aittir.
      D: Ortaklık şirketi kurmak için Bakanlık izni aranmaz; Kanun birden çok meslek mensubunun ortaklık bürosu veya şirket
        şeklinde birleşmesine izin verir.
      E: Kanun cezai sorumluluğun sermaye payına göre paylaşılmasını öngörmez; sorumluluk işi yapana aittir.
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 45/4
    alinti: Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz.
