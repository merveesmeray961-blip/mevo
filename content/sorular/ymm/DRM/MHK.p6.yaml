- id: YMM-DRM-MHK-0068
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: 3568 sayılı Kanun odalar ve TÜRMOB
  konu: MHK
  kazanim: Odaların gelirleri (giriş ücreti, şube ve indirim)
  tip: hesaplama
  zorluk: 3
  kok: 'Bir yeminli mali müşavirler odasına aynı gün aşağıdaki kayıt başvuruları yapılmıştır: (1) mesleğini serbest yürüten
    YMM Ayşe; (2) kamu kurumunda çalışan YMM Berk; (3) çalışanlar listesine kaydedilecek bir YMM ortaklık şirketi ve bu şirketin
    bir şubesi. Odanın giriş (kayıt) ücretinin hesabında memur maaşı taban aylığı katsayısı 12 TL kabul edildiğine göre, odanın
    bu kayıtlardan tahsil edeceği toplam giriş ücreti kaç TL''dir?'
  secenekler:
    A: '5.400'
    B: '9.000'
    C: '10.800'
    D: '12.600'
    E: '14.400'
  dogru: D
  aciklama:
    dogru_neden: 'Yönetmelik md. 16/a''ya göre giriş ücreti, memur maaşı taban aylığı katsayısının 300 katıdır: 300 × 12 =
      3.600 TL. Bu ücret her üyeden, ayrıca çalışanlar listesine kaydedilecek ortaklık büroları ve şirketler ile bunların
      şubelerinden kayıt anında bir kere alınır. Kanun md. 16 ek fıkrasına göre kamu kurum ve kuruluşlarında çalışanlar yüzde
      elli indirimli öder. Ayşe 3.600 + Berk 1.800 + şirket 3.600 + şube 3.600 = 12.600 TL. Püf noktaları: (1) Şube ayrı bir
      kayıt ücretine tabidir. (2) İndirim yalnızca kamu kurumunda çalışan veya mesleği fiilen icra etmeyen meslek mensubuna
      uygulanır, şirket ve şubesine uygulanmaz.'
    celdiriciler:
      A: Yalnızca iki gerçek kişiyi saymak (3.600 + 1.800) şirket ve şubesinin giriş ücretine tabi olduğunu gözden kaçırmaktır.
      B: Şubeyi ayrı kayıt saymamak (3.600 + 1.800 + 3.600) hatasıdır; şubelerden de kayıt anında giriş ücreti alınır.
      C: İndirimi şirketin şubesine de uygulamak (3.600 + 1.800 + 3.600 + 1.800) hatasıdır; yüzde elli indirim yalnızca kamuda
        çalışan veya mesleği fiilen icra etmeyen meslek mensuplarına tanınmıştır.
      E: Dört kaydın tamamını tam ücretle saymak (4 × 3.600) kamu kurumunda çalışan Berk'in yüzde elli indiriminden yararlanacağını
        unutmaktır.
    hesap_adimlari:
    - Giriş ücreti = 300 × 12 = 3.600 TL
    - Ayşe 3.600; Berk 3.600 × 0,5 = 1.800; şirket 3.600; şube 3.600
    - Toplam = 12.600 TL
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirler Odaları Yönetmeliği
    madde: md. 16/a
    alinti: Odaya kaydolan her üyeden ve Oda çalışanlar listesine kaydedilecek ortaklık büroları ve şirketler ile bunların
      şubelerinden kayıt anında bir kere alınır. Kayıt ücreti miktarı memur maaşı taban aylığı katsayısının 300 rakamı ile
      çarpımı sonucu bulunacak tutardır.
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 16 (ek fıkra)
    alinti: Meslek mensuplarından kamu kurum ve kuruluşlarında çalışanlar ile mesleği fiilen icra etmeyenler, odaya giriş
      ücreti ve yıllık üye aidatlarını yüzde elli indirimli olarak öderler.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'katsayi = 12

      ucret = 300 * katsayi

      ayse = ucret

      berk = ucret / 2

      sirket = ucret

      sube = ucret

      sonuc = ayse + berk + sirket + sube'
  durum: kontrolde
  surum: 1
