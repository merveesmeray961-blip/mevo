  kok: Yeminli mali müşavirler odalarının faaliyetten men edilmesine ilişkin aşağıdaki öncüllerden hangileri doğrudur? I.
    Milli güvenliğin ve kamu düzeninin gerektirdiği hallerde gecikmede sakınca varsa oda, vali tarafından faaliyetten men
    edilebilir. II. Faaliyetten men kararı, yirmi dört saat içinde görevli hâkimin onayına sunulur. III. Hâkim kararını kırk
    sekiz saat içinde açıklamazsa idari karar kendiliğinden yürürlükten kalkar. IV. Faaliyetten men kararı Bakanlığın onayı
    ile kesinleşir.
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I, III ve IV
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: Yönetmelik md. 24'e (Kanun md. 15) göre kamu düzeninin gerektirdiği ve gecikmede sakınca bulunan hallerde
