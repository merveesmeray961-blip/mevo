      A: Yalnız I demek, hâkim onayı ve kendiliğinden kalkma kurallarını (II ve III) dışarıda bırakır.
      B: 'III de doğrudur: hâkim 48 saat içinde karar açıklamazsa men kararı kendiliğinden ortadan kalkar.'
      C: 'I de doğrudur: faaliyetten men yetkisi, belirtilen şartlarda vali tarafındandır.'
      D: 'IV yanlıştır: men kararının onay mercii Bakanlık değil, görevli hâkimdir; ayrıca II de doğru bir öncüldür ve seçenekte
        yer almamıştır.'
