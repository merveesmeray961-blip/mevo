- id: YMM-DRM-MHK-0065
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: 3568 sayılı Kanun odalar ve TÜRMOB
  konu: MHK
  kazanim: Oda Yönetim Kurulunun oluşumu (üye sayısına göre asıl-yedek üye sayısı)
  tip: hesaplama
  zorluk: 2
  kok: Kayıtlı üye sayıları 999, 1.000, 5.000 ve 5.001 olan dört yeminli mali müşavirler odasının Yönetim Kurulu asıl üyelerinin
    toplam sayısı kaçtır?
  secenekler:
    A: '26'
    B: '28'
    C: '30'
    D: '36'
    E: '56'
  dogru: B
  aciklama:
    dogru_neden: '3568 sayılı Kanun md. 21''e göre üye sayısı binin altında olan odalarda 5, bin ilâ beşbin arasında olan
      odalarda 7, beşbini aşan odalarda 9 asıl üye bulunur. 999 üyeli oda 5, 1.000 ve 5.000 üyeli odalar (iki sınır değer
      de "bin ilâ beşbin arasında" kademesindedir) 7''şer, 5.001 üyeli oda 9 asıl üye seçer: 5 + 7 + 7 + 9 = 28.'
    celdiriciler:
      A: 1.000 üyeli odayı "binin altında" kademesine alıp 5 asıl üye saymak (5+5+7+9) hatasıdır; "bin ilâ beşbin arasında"
        ifadesi 1.000'i kapsar.
      C: 5.000 üyeli odayı "beşbini aşan" kademesine koymak (5+7+9+9) hatasıdır; 5.000 beşbini aşmaz, aşan ilk sayı 5.001'dir.
      D: Dört odaya da en üst kademe olan 9 asıl üyeyi yazmak (4×9) kademeleri hiç dikkate almamaktır.
      E: 56, asıl ve yedek üyelerin birlikte toplamıdır (10+14+14+18); soru yalnız asıl üyeleri sorar.
    hesap_adimlari:
    - 999 → 5
    - 1.000 → 7
    - 5.000 → 7
    - 5.001 → 9
    - Toplam = 5+7+7+9 = 28
  kaynaklar:
  - mevzuat: 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu
    madde: md. 21/1
    alinti: Yönetim Kurulu, Genel Kurulca kendi üyeleri arasından üç yıl için seçilen, üye sayısı binin altında olan odalarda
      beş asıl ve beş yedek, üye sayısı bin ilâ beşbin arasında olan odalarda yedi asıl ve yedi yedek, üye sayısı beşbini
      aşan odalarda ise dokuz asıl ve dokuz yedek üyeden oluşur.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "toplam = 0\nfor n in [999, 1000, 5000, 5001]:\n    if n < 1000:\n        a = 5\n    elif n <= 5000:\n       \
      \ a = 7\n    else:\n        a = 9\n    toplam = toplam + a\nsonuc = toplam"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
