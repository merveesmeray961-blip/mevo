- id: YMM-DRM-RAP-0042
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 3
  kok: 'Payları borsada işlem gören Yıldız Kablo A.Ş.nin denetiminde denetçi aşağıdaki hususları belirlemiştir:

    (1) İşletmenin sürekliliğine ilişkin önemli bir belirsizlik bulunmakta olup finansal tablolarda yeterince açıklanmıştır.

    (2) Yatırım amaçlı gayrimenkullerin değerlemesindeki önemli ancak yaygın olmayan bir yanlışlık nedeniyle sınırlı olumlu
    görüş verilecektir.

    (3) Karmaşık bayi iskonto sözleşmeleri nedeniyle hasılatın muhasebeleştirilmesi, denetimde en çok önem arz eden konu olarak
    belirlenmiştir.

    (4) Bilanço tarihinden sonra fabrikada çıkan yangın finansal tablolarda uygun şekilde açıklanmıştır; kullanıcılar açısından
    temel öneme sahiptir ve kilit denetim konusu olarak belirlenmemiştir.

    Denetçi raporuna ilişkin aşağıdaki ifadeleri değerlendiriniz.

    I. (1), “İşletmenin Sürekliliğiyle İlgili Önemli Belirsizlik” bölümünde raporlanır; Kilit Denetim Konuları bölümünde bu
    bölüme atıfta bulunulur.

    II. (2), niteliği itibarıyla kilit denetim konusu olduğundan Kilit Denetim Konuları bölümünde ayrıntılı olarak açıklanır.

    III. (3), Kilit Denetim Konuları bölümünde, kilit denetim konusu olarak belirlenme sebebi ve denetimde nasıl ele alındığı
    açıklanarak yer alır.

    IV. (4) için rapora Diğer Hususlar paragrafı eklenir.

    V. (4) için eklenen paragrafta, bu hususun denetçi görüşünü değiştirmediği belirtilir.

    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, III ve V
    B: I ve III
    C: II, III ve IV
    D: I, II ve V
    E: III, IV ve V
  dogru: A
  aciklama:
    dogru_neden: 'I: BDS 701 par. 15''e göre önemli belirsizlik ve olumlu görüş dışında görüşe yol açan konu nitelikleri itibarıyla
      kilit denetim konusudur; ancak Kilit Denetim Konuları bölümünde açıklanmaz, ilgili BDS''ye göre raporlanır ve bu bölümde
      ilgili bölüme atıf yapılır. Önemli belirsizlik BDS 570 par. 22 uyarınca ayrı bölümde raporlanır. III: Par. 13''e göre
      her kilit denetim konusunun açıklaması, belirlenme sebebini ve denetimde nasıl ele alındığını içerir. V: (4) finansal
      tablolarda açıklanmış, temel öneme sahip ve kilit denetim konusu olmayan bir husus olduğundan BDS 706 par. 8 uyarınca
      Dikkat Çekilen Hususlar paragrafının konusudur; par. 9(c) uyarınca bu paragrafta hususun görüşü değiştirmediği belirtilir.
      Püf noktaları: Sınırlı görüşe yol açan konu ile önemli belirsizlik “nitelikleri itibarıyla” kilit denetim konusudur,
      fakat KDK bölümünde anlatılmaz; yalnızca atıf yapılır. Finansal tablolarda açıklanmış husus Dikkat Çekilen Hususlar,
      tablolarda olmayan husus Diğer Hususlar paragrafının konusudur.'
    celdiriciler:
      B: 'I ve III doğrudur; ancak V de doğrudur: Dikkat Çekilen Hususlar paragrafında hususun denetçi görüşünü değiştirmediği
        belirtilir (BDS 706 par. 9(c)).'
      C: 'II yanlıştır: BDS 701 par. 12 ve 15''e göre sınırlı görüşe yol açan konu KDK bölümünde açıklanmaz, Sınırlı Olumlu
        Görüşün Dayanağı bölümüne atıf yapılır. IV yanlıştır: finansal tablolarda açıklanmış husus Diğer Hususlar değil, Dikkat
        Çekilen Hususlar paragrafının konusudur.'
      D: II yanlıştır; görüşe yol açan konunun KDK bölümünde açıklanması, kilit denetim konularının olumlu dışı görüşün yerine
        geçmemesi ilkesine (par. 12) aykırıdır. Ayrıca III doğru olduğu hâlde seçenekte yoktur.
      E: 'IV yanlıştır: Diğer Hususlar paragrafı finansal tablolarda sunulan veya açıklananlar dışındaki hususlar içindir
        (BDS 706 par. 10); yangın tablolarda açıklanmıştır. Ayrıca I doğru olduğu hâlde seçenekte yoktur.'
    hesap_adimlari: []
