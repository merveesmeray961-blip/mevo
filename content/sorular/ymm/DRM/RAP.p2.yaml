- id: YMM-DRM-RAP-0038
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: uygulama
  zorluk: 2
  kok: Denetçi, Lale Mobilya A.Ş. ile denetim sözleşmesini kabul ettikten sonra yönetimin, yurt dışı şubesinin kayıtlarına
    erişimini engellediğini fark etmiştir. Bu sınırlamanın görüş vermekten kaçınmaya yol açması muhtemeldir. Üst yönetimden
    sorumlu olanların tamamı işletme yönetiminde icrai görev üstlenmemektedir. BDS 705'e göre denetçinin izleyeceği sıralama
    aşağıdakilerden hangisinde doğru verilmiştir?
  secenekler:
    A: Doğrudan görüş vermekten kaçınır → sınırlamayı Görüş Vermekten Kaçınmanın Dayanağı bölümünde açıklar → üst yönetimden
      sorumlu olanlara rapor sonrasında bilgi verir.
    B: Sınırlamanın kaldırılmasını talep eder → reddedilirse alternatif prosedür denemeden sınırlı olumlu görüş verir → durumu
      Görüşün Dayanağı bölümünde açıklar.
    C: Sınırlamayı doğrudan düzenleyici kuruma bildirir → kurumun talimatını bekler → talimata göre görüş vermekten kaçınır
      veya denetimden çekilir.
    D: Kaldırılmasını ister → reddedilirse üst yönetimden sorumlulara iletir, alternatif prosedürleri değerlendirir → yaygınsa
      mümkünse çekilir, değilse görüşten kaçınır.
    E: Kaldırılmasını talep eder → reddedilirse üst yönetimden sorumlu olanlara iletir → etki yaygın olabilecekse önce görüş
      vermekten kaçınır, bu mümkün değilse denetimden çekilir.
  dogru: D
  aciklama:
    dogru_neden: BDS 705 par. 11'e göre denetçi önce yönetimden sınırlamayı kaldırmasını talep eder. Par. 12'ye göre yönetim
      reddederse konuyu üst yönetimden sorumlu olanlara iletir ve alternatif prosedürlerin mümkün olup olmadığına karar verir.
      Par. 13'e göre yeterli ve uygun kanıt elde edilemez ve olası etkiler önemli ve yaygın olabilecekse, mevzuatın izin vermesi
      ve uygulanabilir olması durumunda denetimden çekilir; çekilme mümkün veya uygulanabilir değilse görüş vermekten kaçınır.
    celdiriciler:
      A: Standart, sınırlamanın kaldırılması talebi ve üst yönetimden sorumlu olanlara iletme adımlarını rapordan önce öngörür;
        doğrudan görüş vermekten kaçınma bu adımları atlar.
      B: Par. 12 alternatif prosedürlerin mümkün olup olmadığına karar verilmesini ister; ayrıca olayda olası etkinin yaygın
        olabileceği belirtildiğinden sınırlı olumlu görüş durumun ciddiyetini yansıtmaz.
      C: Par. 11-13'teki ilk muhatap yönetim, ardından üst yönetimden sorumlu olanlardır; görüş türü denetçinin kendi kararıdır,
        düzenleyici kurum talimatına bağlı değildir.
      E: 'Sıra terstir: par. 13(b)''ye göre öncelik, mevzuat izin veriyor ve uygulanabiliyorsa denetimden çekilmedir; çekilme
        mümkün değilse görüş vermekten kaçınılır. Ayrıca alternatif prosedür değerlendirmesi atlanmıştır.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 11-12
    alinti: denetimin kapsamını sınırladığının farkına varırsa, yönetimden söz konusu sınırlamayı kaldırmasını talep eder.
      … konuyu üst yönetimden sorumlu olanlara iletir ve yeterli ve uygun denetim kanıtı elde etmek için alternatif prosedürleri
      uygulamanın mümkün olup olmadığına karar verir.
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 13(b)
    alinti: Mevzuatın izin vermesi ve uygulanabilir olması durumunda, denetimden çekilir … Denetçi raporu düzenlenmeden önce
      denetçinin denetimden çekilmesinin mümkün veya uygulanabilir olmadığı durumda, finansal tablolara ilişkin görüş vermekten
      kaçınır
  gecerlilik:
