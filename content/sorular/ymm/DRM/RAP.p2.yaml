- id: YMM-DRM-RAP-0041
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: uygulama
  zorluk: 3
  kok: '6102 sayılı TTK uyarınca denetime tabi Akın Enerji A.Ş.nin denetiminde denetçi, yeterli ve uygun denetim kanıtı elde
    edemediği ve olası etkilerin önemli ve yaygın olabileceği sonucuna vardığı için finansal tablolara ilişkin görüş vermekten
    kaçınmaya karar vermiştir. Denetçi ayrıca, tek başına sınırlı olumlu görüş gerektirecek nitelikte bir kıdem tazminatı
    karşılığı yanlışlığından haberdardır. Yönetim kurulu yıllık faaliyet raporu için ayrı bir raporlama yapılmamaktadır. Bu
    denetçi raporuna ilişkin aşağıdaki ifadeleri değerlendiriniz.

    I. Kilit Denetim Konuları bölümüne yer verilmez.

    II. Yönetim kurulu yıllık faaliyet raporuna ilişkin olumlu görüş verilebilir.

    III. Yeterli kanıt elde edilebilen maddi duran varlıklar kalemine ilişkin aynı raporda ayrıca olumlu görüş verilebilir.

    IV. Kıdem tazminatı yanlışlığının sebepleri ve etkileri, Görüş Vermekten Kaçınmanın Dayanağı bölümünde açıklanır.

    V. Elde edilen denetim kanıtlarının, görüşe dayanak oluşturacak yeterlilikte ve uygunlukta olduğuna dair açıklamaya yer
    verilir.

    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, II ve IV
    B: II ve III
    C: I ve IV
    D: I, IV ve V
    E: III, IV ve V
  dogru: C
  aciklama:
    dogru_neden: 'I: BDS 705 par. 29T''ye göre TTK denetimlerinde görüş vermekten kaçınılırsa Kilit Denetim Konuları bölümüne
      yer verilmez. IV: Par. 27''ye göre denetçi görüş vermekten kaçınmış olsa dahi, haberdar olduğu ve olumlu görüş dışında
      görüş gerektirecek diğer hususların sebep ve etkilerini dayanak bölümünde açıklar. Püf noktaları: Görüş vermekten kaçınma
      hâlinde par. 29T faaliyet raporuna ilişkin görüşten de kaçınılmasını ister; par. 15 aynı raporda tek bir kaleme olumlu
      görüş verilmesini (parça parça görüş) yasaklar; par. 26 ise kanıtların yeterli ve uygun olduğuna dair cümleyi rapordan
      çıkarır. Kaçınma kararı, diğer olumsuz bulguları açıklama yükümlülüğünü kaldırmaz.'
    celdiriciler:
      A: 'II yanlıştır: par. 29T''ye göre görüş vermekten kaçınıldığında denetçi yönetim kurulunun yıllık faaliyet raporuna
        ilişkin de görüş vermekten kaçınır.'
      B: 'II yanlış olduğu gibi III de yanlıştır: par. 15 görüş vermekten kaçınma hâlinde tek bir finansal tablo unsuruna,
        hesabına veya kalemine ilişkin olumlu görüşe yer verilmesini yasaklar.'
      D: 'V yanlıştır: par. 26''ya göre görüş vermekten kaçınıldığında, elde edilen kanıtların görüşe yeterli ve uygun dayanak
        oluşturup oluşturmadığına ilişkin açıklamaya yer verilmez.'
      E: III ve V yanlıştır (par. 15 ve 26); I ise doğru olduğu hâlde bu seçenekte yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 29T
    alinti: 6102 sayılı Türk Ticaret Kanunu (TTK) uyarınca yapılan bağımsız denetimlerde, finansal tablolara ilişkin görüş
      vermekten kaçınması durumunda denetçi, raporunda Kilit Denetim Konuları bölümüne yer vermez ve yönetim kurulunun yıllık
      faaliyet raporuna ilişkin de görüş vermekten kaçınır.
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 15
    alinti: Denetçinin, bir bütün olarak finansal tablolara ilişkin olumsuz görüş vermeyi veya görüş vermekten kaçınmayı gerekli
      görmesi durumunda, denetçi raporunda, aynı finansal raporlama … çerçevesi bakımından tek bir finansal tabloya veya finansal
      tablonun bir veya daha fazla belirli unsuruna, hesabına veya kalemine ilişkin olumlu görüş yer almaz.
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 26-27
    alinti: Elde edilen denetim kanıtlarının, denetçi görüşünün oluşturulması için yeterli ve uygun bir dayanak oluşturup
      oluşturmadığı hakkında bir açıklama. … Denetçi, finansal tablolara ilişkin olumsuz görüş vermiş veya görüş vermekten
      kaçınmış olsa dahi, kendisinin haberdar olduğu ve olumlu görüş dışında bir görüş verilmesini gerektirecek diğer hususların
      sebeplerini ve etkilerini Görüşün Dayanağı bölümünde açıklar
