- id: YMM-DRM-RAP-0037
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: bilgi
  zorluk: 1
  kok: BDS 700 “Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama” uyarınca, payları borsada işlem görmeyen bir şirketin
    bağımsız denetçi raporunda sorumlu denetçinin adına yer verilmesine ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Ad yalnızca borsada işlem gören işletmelerin raporlarında zorunlu olup diğer raporlarda isteğe bağlıdır.
    B: Ad tüm raporlarda zorunludur; önemli ve etkin bir güvenlik tehdidi varsa Kurumun izniyle açıklanmayabilir.
    C: Ad tüm raporlarda zorunludur ve kişisel güvenlik tehdidi dâhil hiçbir gerekçeyle raporda açıklanmaması mümkün değildir.
    D: Ad tüm raporlarda zorunludur; önemli bir güvenlik tehdidi varsa üst yönetimden sorumlu olanların onayıyla açıklanmayabilir.
    E: Ad zorunlu değildir; denetim kuruluşunun unvanı, adresi ve imzasının raporda yer alması yeterlidir.
  dogru: B
  aciklama:
    dogru_neden: BDS 700 par. 46T uyarınca tüm bağımsız denetim raporlarında sorumlu denetçinin adının yer alması zorunludur;
      ancak kişisel güvenliğe yönelik önemli ve etkin bir tehdidin bulunması hâlinde Kurumdan (KGK) izin alınması şartıyla
      ad açıklanmayabilir.
    celdiriciler:
      A: Par. 46 yalnız borsada işlem gören işletmeleri anar; Türkiye'ye özgü par. 46T ise zorunluluğu tüm bağımsız denetim
        raporlarına genişletir.
      C: Par. 46T, kişisel güvenliğe yönelik önemli ve etkin tehdit hâlinde Kurum izniyle adın açıklanmamasına imkân tanır.
      D: Par. 46'da istisnai durum üst yönetimden sorumlu olanlarla müzakere edilir; ancak par. 46T'ye göre adın açıklanmaması
        için gereken şart Kurumdan izin alınmasıdır.
      E: Sorumlu denetçinin adı par. 46T ile tüm raporlarda zorunlu unsur hâline getirilmiştir; kuruluşun unvanı ve imzası
        bunun yerine geçmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 46T
    alinti: Tüm bağımsız denetim raporlarında sorumlu denetçinin adının yer alması zorunludur. Ancak kişisel güvenliğe yönelik
