- id: YMM-DRM-RAP-0040
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: tasdik raporu türleri
  tip: bilgi
  zorluk: 2
  kok: SMMM ve YMM'lerin Çalışma Usul ve Esasları Hakkında Yönetmelik ile YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları,
    Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik hükümlerine göre denetim ve tasdik raporlarıyla ilgili aşağıdaki ifadelerden
    hangisi **yanlıştır**?
  secenekler:
    A: “İlgili mevzuata uygundur” ibaresi, serbest muhasebeci mali müşavirlerin düzenlediği denetim raporlarında da kullanılabilir.
    B: Şartlı denetim raporu, meslek mensubunun denetim sırasında karşılaştığı kapsam sınırlamaları ile denetlenmesini istediği
      halleri içerir.
    C: Mali tabloların tasdikinin sürekli denetleme sonucunda mı yoksa dönem sonrası denetim sonucunda mı yapıldığı tasdik
      raporunda açıkça belirtilir.
    D: YMM'lerce 3 örnek olarak düzenlenen tasdik raporlarının 2 örneği ilgili firma, kurum ve kuruluşların yetkililerine
      teslim edilir.
    E: Olumsuz rapor, meslek mensubunun incelenen yerlerin ve kuruluşların gerçek durumunu yansıtmadığı kanaatine varması
      sonucu düzenlenir.
  dogru: A
  aciklama:
    dogru_neden: Çalışma Usul ve Esasları Yönetmeliği md. 60'a göre serbest muhasebeci mali müşavirlerce düzenlenen raporlar
      ile YMM'lerce tasdiki ihtiva etmeyen raporlarda “ilgili mevzuata uygundur” ibaresi kullanılmaz; bunun yerine ilgili
      mevzuat hükümleri açıkça yazılır. Bu ibare yalnızca YMM'lerce tasdiki ihtiva eden raporlarda kullanılır.
    celdiriciler:
      B: 'Doğrudur: md. 59/b şartlı denetim raporunu bu şekilde tanımlar.'
