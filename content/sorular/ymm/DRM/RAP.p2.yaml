- id: YMM-DRM-RAP-0039
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: uygulama
  zorluk: 2
  kok: BDS 701'in uygulandığı bir denetimde denetçi, finansal tablolarda uygun şekilde açıklanmış ve kullanıcıların finansal
    tabloları anlaması açısından temel öneme sahip olan büyük bir davayı kilit denetim konusu olarak belirlemiştir. Denetçi
    ayrıca, önceki dönem finansal tablolarının başka bir denetçi tarafından denetlendiğini raporunda belirtmeyi gerekli görmektedir;
    mevzuatta buna ilişkin bir yasak yoktur ve bu husus kilit denetim konusu olarak belirlenmemiştir. BDS 706 uyarınca bu
    iki hususun raporlanmasına ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Dava Dikkat Çekilen Hususlar paragrafında, önceki denetçi hususu Diğer Hususlar paragrafında yer alır.
    B: Dava hem Kilit Denetim Konuları bölümünde hem Dikkat Çekilen Hususlar paragrafında, önceki denetçi hususu Dikkat Çekilen
      Hususlar paragrafında yer alır.
    C: Dava Kilit Denetim Konuları bölümünde, önceki denetçi hususu da Kilit Denetim Konuları bölümünde ayrı bir alt başlıkla
      yer alır.
    D: Dava Dikkat Çekilen Hususlar paragrafında, önceki denetçi hususu Görüşün Dayanağı bölümünde yer alır.
    E: Dava Kilit Denetim Konuları bölümünde açıklanır; önceki denetçi hususu ise Diğer Hususlar paragrafında yer alır.
  dogru: E
  aciklama:
    dogru_neden: BDS 706 par. 8(b)'ye göre Dikkat Çekilen Hususlar paragrafı, BDS 701'in uygulandığı durumlarda ancak husus
      kilit denetim konusu olarak belirlenmemişse eklenir; dava kilit denetim konusu olarak belirlendiğinden Kilit Denetim
      Konuları bölümünde açıklanır. Önceki dönemi başka denetçinin denetlemesi finansal tablolarda sunulan bir husus değildir;
      kullanıcıların denetimi veya denetçi raporunu anlamasıyla ilgilidir. Mevzuatla yasaklanmadığı ve kilit denetim konusu
      olmadığı için par. 10 uyarınca Diğer Hususlar paragrafında yer alır.
    celdiriciler:
      A: Kilit denetim konusu olarak belirlenen husus için par. 8(b) gereği ayrıca Dikkat Çekilen Hususlar paragrafı eklenmez.
      B: Aynı husus hem kilit denetim konusu hem Dikkat Çekilen Hususlar paragrafı olamaz; ayrıca Dikkat Çekilen Hususlar
        paragrafı yalnızca finansal tablolarda sunulan veya açıklanan bilgilere atıfta bulunur (par. 9(b)).
      C: Önceki denetçi hususu kilit denetim konusu olarak belirlenmemiştir; finansal tablolar dışındaki bu tür bir husus
        Diğer Hususlar paragrafının konusudur.
      D: Dava için A'daki hata geçerlidir; Görüşün Dayanağı bölümü ise görüşün dayanağına ilişkin unsurları içerir, Diğer
        Hususlar paragrafının yerine kullanılmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. 8(b)
    alinti: BDS 701’in uygulandığı durumlarda, bu hususun denetçi raporunda bildirilecek bir kilit denetim konusu olarak belirlenmemiş
      olması
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
