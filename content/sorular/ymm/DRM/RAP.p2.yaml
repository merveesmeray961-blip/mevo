- id: YMM-DRM-RAP-0043
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: tasdik raporu türleri
  tip: uygulama
  zorluk: 3
  kok: Meslek sicil numarası 1452 olan YMM Selin Kaya 2019 yılında mesleki faaliyete başlamış, 14.03.2025 tarihinde faaliyetten
    ayrılmıştır. Ayrıldığı tarihe kadar kendi imza ve mührüyle düzenlediği son tasdik raporunun genel sayısı 412, 2025 yılına
    ait özel sayısı 9'dur. Kaya, bağlı olduğu odaya bildirerek 05.01.2026 tarihinde yeniden faaliyete başlamış ve 2026 yılında
    iki tasdik raporu düzenlemiştir. Tasdik Yönetmeliği md. 19'a göre Kaya'nın 2026 yılında düzenleyeceği üçüncü tasdik raporunun
    sayısı aşağıdakilerden hangisidir?
  secenekler:
    A: YMM 1452/3/415
    B: YMM 1452/415/3
    C: YMM 1452/3/3
    D: YMM 1452/415/12
    E: YMM 415/1452/3
  dogru: B
  aciklama:
    dogru_neden: 'Tasdik Yönetmeliği md. 19''a göre raporlara meslek sicil numarasıyla birlikte genel ve özel olmak üzere
      iki sayı verilir; sıralama önce meslek sicil numarası, sonra genel sayı, sonra özel sayıdır ve başa “YMM” rumuzu konur.
      Faaliyetten ayrılıp yeniden başlayanlar genel sayıya ayrıldıkları tarihteki son sayıdan devam eder: 2026''daki raporlar
      413, 414 ve 415 genel sayısını alır. Özel sayı her takvim yılı başında yeniden başlar: 2026''nın üçüncü raporu 3''tür.
      Sonuç: YMM 1452/415/3. Püf noktaları: Genel sayı meslekten ayrılıp dönülse de sıfırlanmaz, kaldığı yerden sürer; özel
      sayı ise yalnızca yıl değişince sıfırlanır. 2025''teki özel sayı (9) 2026''ya taşınmaz.'
    celdiriciler:
      A: 'Sayılar doğru, sıra yanlıştır: genel sayı özel sayıdan önce gelir.'
      C: Genel sayı yeniden başlatılmıştır; oysa faaliyete yeniden başlayanlar genel sayıya ayrıldıkları tarihteki son sayıdan
        devam eder.
      D: Özel sayı 2025'ten devam ettirilmiştir (9+3); özel sayı her takvim yılı başında yeniden başlar.
      E: Sıralamada önce meslek sicil numarası gelir; genel sayı sicil numarasından sonra yazılır.
    hesap_adimlari:
    - 'Genel sayı: 412 + 3 = 415'
    - 'Özel sayı (2026 yılı içinde yeniden başlar): 3'
    - 'Sıra: YMM + sicil no + genel sayı + özel sayı → YMM 1452/415/3'
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 19
    alinti: Mesleki faaliyetten ayrılıp, sonra bağlı oldukları odalara tekrar faaliyete başlayacaklarını bildirip faaliyete
      başlayanlar, genel sayıya, mesleki faaliyetten … ayrıldıkları tarihteki son sayıdan itibaren devam ederler. Özel sayı
      ise, her takvim yılı başında yeniden başlar ve yıl sonuna kadar devam eder. Tasdik raporlarına sayı verilmesinde, önce
      meslek sicil numarası, sonra genel sayı ve daha sonra özel sayı kullanılır.
