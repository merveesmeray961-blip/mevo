- id: YMM-DRM-RAP-0036
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: bilgi
  zorluk: 1
  kok: 6102 sayılı Türk Ticaret Kanunu uyarınca bağımsız denetime tabi olan ve payları borsada işlem görmeyen Çınar Lojistik
    A.Ş.nin 2025 yılı finansal tablolarının denetiminde, kilit denetim konularının denetçi raporunda bildirilmesine ilişkin
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Borsada işlem görmediği için bildirim zorunlu değildir; denetçi isterse bildirebilir.
    B: Yalnızca kamu yararını ilgilendiren kuruluş niteliğindeki şirketlerde bildirilir.
    C: TTK uyarınca denetime tabi tüm şirketlerde BDS 701'e uygun olarak bildirilir.
    D: Yalnızca olumlu görüş dışında bir görüş verildiğinde bildirilir.
    E: Yalnızca genel kurulun talep etmesi hâlinde raporda bildirilir.
  dogru: C
  aciklama:
    dogru_neden: BDS 700 par. 30T (ve BDS 701 par. 5T) uyarınca 6102 sayılı TTK kapsamında yapılan bağımsız denetimlerde denetçi,
      denetime tabi tüm şirketlerin finansal tablolarının denetiminde kilit denetim konularını raporunda BDS 701'e uygun olarak
      bildirir. Payların borsada işlem görüp görmemesi bu yükümlülüğü değiştirmez.
    celdiriciler:
      A: Bu, BDS 700 par. 30-31'deki genel kuraldır (borsada işlem görenlerde zorunlu, diğerlerinde isteğe bağlı); Türkiye'ye
        özgü par. 30T TTK denetimlerinde tüm şirketler için zorunluluk getirir.
      B: Par. 30T, kamu yararını ilgilendiren kuruluş ayrımı yapmaz; TTK uyarınca denetime tabi tüm şirketleri kapsar.
      D: Tersine, olumlu görüş dışında görüşe yol açan konu Kilit Denetim Konuları bölümünde bildirilmez (BDS 701 par. 12);
        görüş vermekten kaçınıldığında ise bu bölüme hiç yer verilmez.
      E: Bildirim yükümlülüğü standarttan doğar; genel kurulun talebine bağlı değildir.
    hesap_adimlari: []
  kaynaklar:
