- id: YMM-DRM-RAP-0069
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 2
  kok: 'Borsada işlem gören Mavi Tekstil A.Ş.’nin denetiminde denetçi, üst yönetimden sorumlu olanlara bildirilen ve azami
    düzeyde dikkat gerektiren on iki konu belirlemiştir ve bunların tamamını kilit denetim konusu olarak bildirmeyi düşünmektedir.


    BDS 701’e göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Raporda bildirilebilecek kilit denetim konusu sayısı BDS 701’de en fazla beşle sınırlandırılmıştır; fazla konular yalnızca
      Diğer Hususlar paragrafında bildirilebilir.
    B: Azami düzeyde dikkat gerektiren konuların tamamı kilit denetim konusu sayıldığından, hangilerinin ve kaçının bildirileceği
      denetçinin mesleki muhakemesine bırakılmamıştır.
    C: Kilit denetim konusu sayısı yalnızca işletmenin büyüklüğüne bağlıdır; faaliyetlerin niteliği, işletmenin çevresi ve
      denetimin durum ve gerçekleri sayıyı hiçbir şekilde etkilemez.
    D: Çok sayıda konunun kilit denetim konusu olarak bildirilmesi hedef kullanıcılara daha fazla şeffaflık sağladığından,
      denetçiden beklenen yaklaşım budur ve bir sınır aranmaz.
    E: Konu sayısı arttıkça her bir konunun tanımı karşılayıp karşılamadığı yeniden değerlendirilebilir; çok fazla kilit denetim
      konusu, en çok önem arz etme düşüncesine aykırı olabilir.
  dogru: E
  aciklama:
    dogru_neden: A30’a göre hangilerinin ve kaçının cari dönemde en çok önem arz ettiğinin belirlenmesi mesleki muhakeme konusudur;
      kilit denetim konusu sayısı işletmenin büyüklüğünden ve karmaşıklığından, faaliyetleri ile çevresinin niteliğinden ve
      denetimin durum ve gerçeklerinden etkilenebilir. Başlangıçta belirlenen konu sayısı arttıkça her birinin tanımı karşılayıp
      karşılamadığını yeniden değerlendirme ihtiyacı doğabilir ve çok fazla sayıda kilit denetim konusu bunların en çok önem
      arz eden konular olduğu düşüncesine aykırılık teşkil edebilir.
    celdiriciler:
      A: BDS 701 kilit denetim konusu sayısına sayısal bir üst sınır koymaz; sayı işletmeye ve denetime göre değişir (A30).
      B: A30’a göre hangilerinin ve kaçının en çok önem arz ettiğinin belirlenmesi mesleki muhakeme konusudur (par. 10).
      C: A30 sayıyı işletmenin büyüklüğü ve karmaşıklığı yanında faaliyetleri ile çevresinin niteliğinin ve denetimin durum
        ve gerçeklerinin de etkileyebileceğini belirtir.
      D: A30’a göre kilit denetim konularının çok fazla olması, bunların denetimde en çok önem arz eden konular olduğu düşüncesine
        aykırılık teşkil edebilir.
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A30
    alinti: Denetçi raporunda yer alacak kilit denetim konularının sayısı, işletmenin büyüklüğünden ve karmaşıklığından, faaliyetleri
      ile çevresinin niteliğinden ve denetimin durum ve gerçeklerinden etkilenebilir.
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A30
    alinti: Kilit denetim konularının çok fazla olması, bunların denetimde en çok önem arz eden konular olduğu düşüncesine
      aykırılık teşkil edebilir.
