  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 2
  kok: 'Borsada işlem gören Deniz Enerji A.Ş.’nin denetçisi, yüksek tahmin belirsizliği içeren bir muhasebe tahminini kilit
    denetim konusu olarak belirlemiş ve bu tahmin için faydalandığı uzman hakkında da bilgi vermeyi düşünmektedir. Denetçi,
    kilit denetim konusuna ilişkin açıklamada kullanacağı ifadeleri belirlemektedir.


    BDS 701’e göre denetçinin yaklaşımı aşağıdakilerden hangisi olmalıdır?'
  secenekler:
    A: Aynı sektördeki birçok işletmede benzer konular kilit denetim konusu olduğundan, açıklamada zamanla standartlaşmış
      bir anlatım kullanmayı tercih eder.
    B: Faydalandığı uzmana atıf yapmaz; çünkü uzmana atıf yapılması denetçinin görüş bildirme sorumluluğunu azaltır ve BDS
      620 ile tutarsızlık yaratır.
    C: Uygulanan prosedürlerin sonuçlarına işaret etmekten kaçınır; çünkü sonuca işaret edilmesi BDS 701’e göre kilit denetim
      konusunun açıklanmasında kullanılamaz.
    D: Konunun uygun bir şekilde çözüme kavuşturulmadığını belirten ifadeler kullanarak kullanıcıyı uyarır; çünkü bu yaklaşım
      konunun önemini daha iyi vurgular.
    E: İfadeleri genelleyici anlatımdan kaçınarak seçer, konuyu işletmenin şartlarıyla doğrudan ilişkilendirir ve gerekirse
      uzmana atıfta bulunabilir.
  dogru: E
  aciklama:
    dogru_neden: 'A47’ye göre kilit denetim konusuna ilişkin açıklamada ifadeler özenle seçilir: konunun uygun biçimde çözüme
      kavuşturulmadığı ima edilmez, genelleyici veya standartlaştırılmış anlatımdan kaçınılır ve konu işletmenin şartlarıyla
      doğrudan ilişkilendirilir. A49’a göre faydalanılan uzmana atıf, görüş sorumluluğunu azaltmaz ve BDS 620 ile tutarsız
      değildir; A51’e göre prosedürlerin sonucuna işaret edilebilir.'
    celdiriciler:
      A: A47’ye göre genelleyici veya standartlaştırılmış anlatımdan kaçınılır ve konu işletmenin içinde bulunduğu şartlarla
        doğrudan ilişkilendirilir.
      B: A49’a göre uzmana atıfta bulunulması denetçinin görüş bildirme sorumluluğunu azaltmaz ve BDS 620 ile tutarsız değildir.
      C: A51’e göre prosedürlerin sonuçlarına işaret edilebilir; önemli olan ayrı bir görüş bildirilmiş izlenimi yaratılmamasıdır.
      D: A47’ye göre konunun uygun bir şekilde çözüme kavuşturulmadığı ima edilmemelidir.
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A47
    alinti: Genelleyici veya standartlaştırılmış bir anlatımdan kaçınılması ve konunun işletmenin içinde bulunduğu şartlarla
      doğrudan ilişkilendirilmesi gerekir.
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A47
    alinti: denetçi tarafından ilgili konunun uygun bir şekilde çözüme kavuşturulmadığının ima edilmemesi gerekir
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A49
    alinti: Denetçinin faydalandığı uzmana bu şekilde atıfta bulunulması, denetçinin finansal tablolara ilişkin görüş bildirme
      sorumluluğunu azaltmaz
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
