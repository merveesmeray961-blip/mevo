- id: YMM-DRM-RAP-0071
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 2
  kok: 'Çelik Makina A.Ş.’nin finansal tablolarını denetleyen denetçi, finansal tabloları oluşturan bütün tabloların ve açıklamaların
    hazırlandığına yetkili kişilerin 10 Mart 2026’da karar verdiğini, bu kişilerin finansal tablolara ilişkin sorumluluklarını
    üstlendiklerini ise 12 Mart 2026’da beyan ettiğini belirlemiştir. Denetçi, görüşüne dayanak oluşturan yeterli ve uygun
    denetim kanıtını, bu iki hususa ilişkin kanıtlar dâhil, 16 Mart 2026’da elde etmiştir. İşletme ortaklarının finansal tablolar
    üzerindeki nihai onayı ise 30 Mart 2026’da verilecektir.


    BDS 700’e göre denetçi raporunun tarihi bakımından aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Rapor tarihi, ortakların nihai onayının verileceği 30 Mart 2026’dan önce olamaz; denetçi bu onayı bekleyerek yeterli
      ve uygun kanıt elde ettiği sonucuna varır.
    B: Rapor tarihi 16 Mart 2026’dan önce olamaz; ortakların 30 Mart 2026’daki nihai onayı, yeterli ve uygun kanıtın elde
      edildiği sonucuna varılması için gerekli değildir.
    C: Rapor, sorumluluk beyanının yapıldığı 12 Mart 2026 tarihini taşıyabilir; çünkü rapor tarihi bakımından yalnızca yetkili
      kişilerin beyanı aranır, kanıtın elde edildiği tarih dikkate alınmaz.
    D: Rapor tarihi, tabloların hazırlandığına karar verilen 10 Mart 2026 tarihine göre belirlenir; bu tarihten sonra elde
      edilen kanıtlar rapor tarihini etkilemez.
    E: Rapor tarihi, tabloların hazırlandığına dair kanıtın elde edildiği tarihten önce olamaz; ancak sorumluluk beyanına
      ilişkin kanıt rapor tarihi bakımından aranmaz.
  dogru: B
  aciklama:
    dogru_neden: Par. 49’a göre rapor tarihi, tabloların ve açıklamaların hazırlandığına ve yetkili kişilerin sorumluluklarını
      üstlendiklerini beyan ettiklerine ilişkin kanıtlar dâhil, görüşe dayanak oluşturan yeterli ve uygun denetim kanıtının
      elde edildiği tarihten (16 Mart 2026) önce olamaz. A70’e göre işletme ortaklarının nihai onayı denetçinin bu sonuca
      varması için gerekli değildir; dolayısıyla 30 Mart 2026’ya kadar beklenmez. B doğrudur.
    celdiriciler:
      A: A70’e göre işletme ortakları tarafından nihai onayın verilmesi, denetçinin yeterli ve uygun denetim kanıtının elde
