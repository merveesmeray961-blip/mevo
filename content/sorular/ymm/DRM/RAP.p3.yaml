  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 3
  kok: '6102 sayılı Türk Ticaret Kanunu uyarınca bağımsız denetime tabi olan, payları borsada işlem görmeyen Çam Yapı A.Ş.’nin
    2025 yılı finansal tablolarını denetleyen denetçi, finansal tabloların geçerli finansal raporlama çerçevesine uygun hazırlandığı
    sonucuna varmış ve olumlu görüş vermeye karar vermiştir. Sorumlu denetçinin adının raporda açıklanması hâlinde kişisel
    güvenliğe yönelik önemli ve etkin bir tehdit doğacağı anlaşılmış ve bu nedenle Kurumdan izin alınmıştır.


    BDS 700’e göre bu denetçi raporuna ilişkin aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Payları borsada işlem görmediğinden kilit denetim konularının bildirilmesi zorunlu değildir; sorumlu denetçinin adı
      ise izin alınmış olsa da açıklanır.
    B: Kilit denetim konuları bildirilir; ancak sorumlu denetçinin adı, tehdit üst yönetimden sorumlu olanlarla müzakere edilse
      bile mutlaka açıklanır.
    C: Kilit denetim konuları BDS 701’e uygun olarak raporda bildirilir; Kurumdan izin alınmış olduğundan sorumlu denetçinin
      adı raporda açıklanmayabilir.
    D: Kilit denetim konularının bildirilmesi denetçinin takdirine bağlıdır; Kurumdan izin alınmış olduğundan sorumlu denetçinin
      adı açıklanmayabilir.
    E: Kilit denetim konularının bildirilmesi zorunlu değildir; sorumlu denetçinin adı ise yalnızca üst yönetimden sorumlu
      olanlarla müzakere edilirse açıklanmayabilir.
  dogru: C
  aciklama:
    dogru_neden: 'Par. 30T’ye göre 6102 sayılı TTK uyarınca yapılan bağımsız denetimlerde denetçi, denetime tabi tüm şirketlerin
      (borsada işlem görmeyenler dâhil) finansal tablolarının denetiminde kilit denetim konularını BDS 701’e uygun olarak
      bildirir. Par. 46T’ye göre tüm bağımsız denetim raporlarında sorumlu denetçinin adının yer alması zorunludur; ancak
      kişisel güvenliğe yönelik önemli ve etkin bir tehdit varsa Kurumdan izin almak şartıyla ad açıklanmayabilir. Kökte izin
      alındığı belirtildiğinden C doğrudur. Püf noktaları: Par. 30 (borsada işlem gören işletmeler) ile par. 30T (TTK’ya tabi
      tüm şirketler) arasındaki kapsam farkı ve par. 46’daki üst yönetimle müzakere ile par. 46T’deki Kurum izni arasındaki
      fark; T kodlu paragraflar Türkiye uygulamasındaki ilave yükümlülükleri gösterir.'
    celdiriciler:
      A: 6102 sayılı TTK uyarınca yapılan denetimlerde tüm şirketler için kilit denetim konuları bildirilir (par. 30T); ayrıca
        izin alındığında ad açıklanmayabilir (par. 46T).
      B: Kurumdan izin alınmışsa (par. 46T) ad açıklanmayabilir; üst yönetimle müzakere ise par. 46’daki uluslararası hükümdür,
        Türkiye’de Kurum izni aranır.
      D: Par. 31’deki takdir yetkisi, bildirimin mevzuatla zorunlu olmadığı diğer denetimler içindir; TTK denetimlerinde bildirim
        par. 30T ile zorunludur.
      E: TTK denetimlerinde kilit denetim konuları zorunludur (par. 30T) ve ad için müzakere değil Kurumdan izin şartı aranır
        (par. 46T).
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 30T
    alinti: 6102 sayılı Türk Ticaret Kanunu uyarınca yapılan bağımsız denetimlerde denetçi, denetime tabi tüm şirketlerin
      finansal tablolarının denetiminde, kilit denetim konularını raporunda BDS 701’e uygun olarak bildirir.
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
