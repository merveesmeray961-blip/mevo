- id: YMM-DRM-RAP-0047
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: tasdik raporu türleri
  tip: bilgi
  zorluk: 3
  kok: 'Tasdik Yönetmeliği’ne göre tasdik raporları, Yönetmeliğin 7 nci maddesi ile tasdik kapsamına alınan konular itibarıyla
    çeşitlendirilir. Bu maddeye göre Amme Alacaklarının Tahsil Usulü Hakkında Kanun yönünden, 6183 sayılı Kanunun ______ maddesi
    gereğince borcunun tecilini talep eden mükelleflerin dolduracakları formlar ile ______ maddesi gereğince verilen terkin
    beyanlarının incelenmesi tasdik konusudur. Veraset ve intikal vergisi yönünden ise 7338 sayılı Kanunun ______ maddesinin
    (a) bendi uyarınca yapılmakta olan servet incelemelerine konu bilançolar tasdik konusudur.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: 105 – 48 – 10
    B: 48 – 105 – 10
    C: 48 – 10 – 105
    D: 10 – 48 – 105
    E: 105 – 10 – 48
  dogru: B
  aciklama:
    dogru_neden: 'Yönetmelik md. 7/E’ye göre 6183 sayılı Kanunun 48 inci maddesi gereğince borcunun tecilini talep eden mükelleflerin
      dolduracakları formlar ve 105 inci maddesi gereğince verilen terkin beyanlarının incelenmesi ve tasdiki tasdik konusudur;
      md. 7/D’ye göre 7338 sayılı Kanunun 10 uncu maddesinin (a) bendi uyarınca yapılmakta olan servet incelemelerine konu
      bilançolar da tasdik konusudur. Püf noktaları: (1) Üç sayı aynıdır, yalnızca yerleri farklıdır; kanun numarasıyla madde
      numarasını karıştırmayın. (2) Tecil (6183 md. 48) ile terkin (md. 105) aynı alt başlıkta (md. 7/E), servet incelemesi
      ise veraset ve intikal vergisi başlığındadır (md. 7/D).'
    celdiriciler:
      A: Tecil talebi 6183 sayılı Kanunun 48, terkin beyanı ise 105 inci maddesine dayanır; sıralama ters verilmiştir.
      C: Terkin beyanı 105 inci madde, servet incelemesine ilişkin 7338 sayılı Kanun hükmü ise 10 uncu maddenin (a) bendidir;
        son iki sayı yer değiştirmiştir.
      D: Sayılar doğru olmakla birlikte yerleri yanlıştır; tecil 48, terkin 105, servet incelemesi 10 uncu maddeye aittir.
      E: Tecil 48, terkin 105, servet incelemesi 7338 sayılı Kanunun 10 uncu maddesine ilişkindir; bu sıralama üç boşluğun
        hiçbirine uymaz.
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 7/E
    alinti: 6183 sayılı Kanunun 48 inci maddesi gereğince borcunun tecilini
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
