- id: YMM-DRM-RAP-0051
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: tasdik raporu türleri
  tip: bilgi
  zorluk: 3
  kok: 'Yeminli mali müşavir Deniz Aras, bir şirketin mali tablolarının tasdikini tabloların kapsadığı dönemin başından itibaren
    yürüttüğü çalışma sonucunda gerçekleştirmiştir. Tasdik Yönetmeliği’ne göre bu tür bir tasdik ______ sonucunda yapılır;
    denetimin hangi duruma göre yapıldığı ______ açıkça belirtilir. Ayrıca bu tür tasdik raporlarında mali tablo ve raporlar
    üzerinde doğrudan veya dolaylı etkisi olan veya olması muhtemel her türlü ______ belirtilir.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: sürekli denetleme – tasdik sözleşmesinde – mevzuat aykırılıkları
    B: yıl sonu denetimi – tasdik raporunda – mevzuat aykırılıkları
    C: sürekli denetleme – tasdik raporunda – muhasebe hataları
    D: sürekli denetleme – tasdik raporunda – mevzuat aykırılıkları
    E: sürekli denetleme – Bakanlığa bildirimde – mevzuat aykırılıkları
  dogru: D
  aciklama:
    dogru_neden: 'Yönetmelik md. 8’e göre mali tabloların tasdiki dönemin başından itibaren sürekli denetleme sonucunda yapılabilir
      ve denetimin hangi duruma göre yapıldığı tasdik raporunda açıkça belirtilir. Md. 19’a göre sürekli denetlemeyi gerektiren
      tasdik raporlarında mali tablo ve raporlar üzerinde doğrudan veya dolaylı etkisi olan veya olması muhtemel her türlü
      mevzuat aykırılıkları ve mali tabloların genel kabul görmüş muhasebe ilkelerine uygun hazırlanıp hazırlanmadığı belirtilir.
      Püf noktaları: (1) Dönem başından itibaren yapılan çalışma “sürekli denetleme”, dönem kapandıktan sonra yapılan çalışma
      “denetim”dir; hangisinin uygulandığı tasdik raporunda belirtilir (md. 8). (2) Mevzuat aykırılıklarının raporda belirtilmesi
      yükümlülüğü sürekli denetlemeyi gerektiren raporlar için md. 19’da ayrıca öngörülmüştür.'
    celdiriciler:
      A: Denetimin hangi duruma göre yapıldığı sözleşmede değil, tasdik raporunda açıkça belirtilir (md. 8).
      B: Dönemin başından itibaren yapılan çalışma “sürekli denetleme”dir; yıl sonu denetimi dönemin kapanmasından sonra yapılan
        denetimdir (md. 8).
      C: Raporda belirtilmesi gereken unsur muhasebe hataları değil, mevzuat aykırılıklarıdır (md. 19).
      E: Denetimin hangi duruma göre yapıldığı Bakanlığa bildirimde değil, tasdik raporunda belirtilir (md. 8).
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 8
    alinti: Denetimin hangi duruma göre yapıldığı tasdik raporunda açıkça belirtilir.
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 19
