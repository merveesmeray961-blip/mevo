    C: geçici vergi bildirimleri – servet incelemelerine konu bilançolar
    D: damga vergisi beyannameleri – terkin beyanlarının incelenmesi
    E: döviz kazandırıcı işlemlerde vergi istisnası – stok değerlemesi
