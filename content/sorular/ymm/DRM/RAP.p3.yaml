- id: YMM-DRM-RAP-0049
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: uygulama
  zorluk: 3
  kok: 'Bir denetçi, borsada işlem gören Doğa Enerji A.Ş.’nin denetim raporuna, kullanıcıların denetimi, denetçinin sorumluluklarını
    veya denetçi raporunu anlamalarıyla ilgili olduğunu düşündüğü ve finansal tablolarda sunulan veya açıklananlar dışında
    kalan bir husus için Diğer Hususlar paragrafı eklemeyi planlamaktadır. BDS 706’ya göre aşağıdaki öncüllerden hangileri
    doğrudur?


    I. Paragraf, mevzuatla yasaklanmamış olması ve hususun kilit denetim konusu olarak belirlenmemiş olması şartıyla eklenebilir.

    II. Paragraf, yönetim tarafından finansal tablolarda sunulması gereken ancak sunulmamış bilgileri içerebilir.

    III. Paragraf, mevzuat veya mesleki standartların (örneğin sır saklamaya ilişkin etik standartların) denetçi tarafından
    açıklanmasını yasakladığı bilgileri de içerebilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: A
  aciklama:
    dogru_neden: 'BDS 706 par. 10’a göre Diğer Hususlar paragrafı, mevzuatla yasaklanmamış olması ve BDS 701’in uygulandığı
      durumlarda hususun kilit denetim konusu olarak belirlenmemiş olması şartıyla eklenir (I doğru). A15’e göre paragraf,
      yönetim tarafından sunulması gereken bilgileri (II) ve mevzuat veya mesleki standartların açıklanmasını yasakladığı
      bilgileri (III) içermez; II ve III yanlıştır. Püf noktaları: (1) Diğer Hususlar paragrafının iki ön koşulu vardır: mevzuatla
      yasaklanmamış olma ve (BDS 701 uygulanıyorsa) kilit denetim konusu olmama (par. 10). (2) Paragrafın içeriği sınırlıdır:
      yönetimce sunulması gereken ve açıklanması yasaklanmış bilgiler içermez (A15).'
    celdiriciler:
      B: III yanlıştır; paragraf açıklanması yasaklanmış bilgileri içermez (A15), I ise doğrudur.
      C: II yanlıştır; paragraf yönetim tarafından sunulması gereken bilgileri içermez (A15).
      D: III yanlıştır; paragraf, açıklanması mevzuat veya etik standartlarla yasaklanmış bilgileri içeremez (A15).
      E: II ve III birlikte yanlıştır; I ise doğrudur.
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. 10
    alinti: Mevzuatla yasaklanmamış olması
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. A15
    alinti: Diğer Hususlar paragrafı, yönetim tarafından sunulması gereken bilgileri içermez.
