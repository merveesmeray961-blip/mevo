      konuları sayar; bunlar arasında (b) döviz kazandırıcı işlemlerde vergi istisnası ve (d) stok değerlemesi yer alır. Diğer
      seçeneklerdeki öğelerden en az biri başka bir başlığa aittir.
    celdiriciler:
      A: İkinci boşluk yanlıştır; 6183 sayılı Kanunun 105 inci maddesi uyarınca verilen terkin beyanları Amme Alacakları başlığında
        (md. 7/E-b) sayılmıştır.
      B: Birinci boşluk yanlıştır; iade hakkı doğuran işlem ve belgeler Katma Değer Vergisi başlığında (md. 7/C-b) sayılmıştır.
      C: Her iki boşluk da yanlıştır; geçici vergi bildirimleri Gelir ve Kurumlar Vergisi (md. 7/A-d, B-d), servet incelemelerine
        konu bilançolar Veraset ve İntikal Vergisi (md. 7/D-a) başlığındadır.
      D: Her iki boşluk da yanlıştır; damga vergisi beyannameleri md. 7/F-a’da, terkin beyanlarının incelenmesi md. 7/E-b’de
        sayılmıştır.
