- id: YMM-DRM-RAP-0045
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: uygulama
  zorluk: 3
  kok: BDS 705’e göre finansal tablolarda önemli yanlışlıkların ortaya çıkabileceği durumlara ilişkin aşağıdaki ifadelerden
    hangisi **yanlıştır**?
  secenekler:
    A: Gerçeğe uygun sunum için gereken, çerçevenin özellikle zorunlu kıldığının dışındaki ilâve açıklamalara yer verilmemesi,
      açıklamaların uygunluğu veya yeterliliği bakımından önemli yanlışlık doğurmaz.
    B: Seçilen muhasebe politikalarının geçerli finansal raporlama çerçevesiyle tutarlı olmaması, seçilen politikaların uygunluğu
      bakımından önemli yanlışlık doğurabilir.
    C: Bir işletmenin önemli muhasebe politikalarına ilişkin seçimini değiştirmesi ancak çerçevenin değişikliğin uygulanması
      ve açıklanmasına ilişkin hükümlerine uymaması önemli yanlışlık doğurabilir.
    D: Seçilen muhasebe politikalarının benzer işlem ve olaylara veya dönemler arasında tutarlı biçimde uygulanmaması, politikaların
      uygulanması bakımından önemli yanlışlık doğurabilir.
    E: Finansal tablolardaki önemli bir yanlışlık; seçilen muhasebe politikalarının uygunluğu, bu politikaların uygulanması
      veya açıklamaların uygunluğu ya da yeterliliği ile ilgili olarak ortaya çıkabilir.
  dogru: A
  aciklama:
    dogru_neden: 'A7’ye göre finansal tablolarda gerçeğe uygun sunumun sağlanması için gereken, geçerli finansal raporlama
      çerçevesinin özellikle zorunlu kıldığının dışında ilâve açıklamalara yer verilmemesi de açıklamaların uygunluğu veya
      yeterliliği bakımından önemli yanlışlık doğurabilir. A ifadesi bunun tersini söylediğinden yanlıştır; diğer ifadeler
      A3-A6’ya uygundur. Püf noktaları: (1) Soru yanlış ifadeyi istemektedir; yanlış ifade, çerçevenin yalnızca zorunlu kıldığı
      açıklamaların önemli yanlışlık kaynağı olabileceğini ima eder. (2) Önemli yanlışlık; politikaların seçiminin uygunluğu
      (A4-A5), politikaların uygulanması (A6) ve açıklamaların uygunluğu veya yeterliliği (A7) olmak üzere üç alanda ortaya
      çıkabilir (A3).'
    celdiriciler:
      B: Doğru ifadedir; A4’e uygundur.
      C: Doğru ifadedir; A5’e uygundur.
      D: Doğru ifadedir; A6’ya uygundur.
      E: Doğru ifadedir; A3’e uygundur.
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A7
    alinti: özellikle zorunlu kıldığının dışında ilâve açıklamalara yer verilmediği durumlarda
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A4
    alinti: Seçilen muhasebe politikalarının geçerli finansal raporlama çerçevesiyle tutarlı olmadığı durumlarda
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A5
    alinti: Bir işletme, önemli muhasebe politikalarına ilişkin seçimini değiştirdiğinde ancak söz konusu hükümlere uygunluk
      sağlamadığında, finansal tablolarda önemli bir yanlışlık ortaya çıkabilir
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
