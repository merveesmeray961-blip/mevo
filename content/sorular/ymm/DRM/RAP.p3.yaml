      B: Atıf tek başına yeterli değildir; par. 13 sebebin ve denetimdeki ele alınış biçiminin açıklanmasını ister.
      C: Üst yönetimden sorumlu olanlara bildirim ayrı bir yükümlülüktür (par. 17); raporlama yükümlülüğünün yerine geçmez.
