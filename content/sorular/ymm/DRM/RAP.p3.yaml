  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 2
  kok: Payları borsada işlem gören Taş Madencilik A.Ş.’nin finansal tablolarını BDS 701 kapsamında denetleyen denetçi, denetimin
    durum ve gerçeklerine bağlı olarak raporunda bildirilecek kilit denetim konusu bulunmadığı sonucuna varmıştır. BDS 701’e
    göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Raporuna Kilit Denetim Konuları bölümünü hiç koymaz; bu kararı üst yönetimden sorumlu olanlara bildirmesi de gerekmez
      ve ayrıca açıklama yapmaz.
    B: Denetimde en çok önem arz eden konulardan en az birini, bildirilecek konu bulunmasa bile kilit denetim konusu olarak
      raporunda göstermek ve açıklamak zorundadır.
    C: Raporunda bu durumu belirtmez; ancak bu kararını Kuruma bildirip onay almak ve onay gelmeden raporunu vermemek zorundadır,
      ayrıca gerekçe yazar.
    D: Raporunda “Kilit Denetim Konuları” başlığı altında bu durumun etkisine yönelik açıklamaya yer verir ve kararını üst
      yönetimden sorumlu olanlara bildirir.
    E: Raporunda yalnızca sınırlı olumlu görüşün dayanağını açıklar ve üst yönetimden sorumlu olanlara herhangi bir bildirimde
      bulunmaz.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 701 par. 16’ya göre bildirilecek kilit denetim konusu bulunmadığına karar veren denetçi, “Kilit Denetim
      Konuları” başlığı altında bu durumun etkisine yönelik bir açıklamaya yer verir; par. 17’ye göre bu kararı üst yönetimden
      sorumlu olanlara da bildirir. Püf noktası: iki yükümlülük birlikte aranır, yalnızca biri yetmez; kilit denetim konusu
      uydurmak da gerekmez.'
    celdiriciler:
      A: Başlık altında açıklama gerekir ve karar üst yönetimden sorumlu olanlara bildirilir.
      B: Bildirilecek konu yoksa konu seçilmesi zorunlu değildir; durumun etkisi açıklanır.
      C: Kurum onayı aranmaz; karar üst yönetimden sorumlu olanlara bildirilir.
      E: Sınırlı olumlu görüşün dayanağı ayrı bir konudur; burada gereken, kilit denetim konusu bulunmadığının açıklanması
        ve bildirimdir.
