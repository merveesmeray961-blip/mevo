      Hususlar paragrafını gerektiren hükümler olarak sayar. BDS 710 yalnızca Ek 2’de, BDS 210 ise yalnızca Ek 1’de yer aldığından
      II ve IV yanlıştır.
    celdiriciler:
      A: II yanlıştır; BDS 710 Ek 2’de (Diğer Hususlar) yer alır.
      B: II ve IV yanlıştır (BDS 710 Ek 2’de, BDS 210 Ek 1’dedir).
      C: IV yanlıştır; BDS 210 19(b) Ek 1’de yer alır.
      E: IV yanlıştır; BDS 210 19(b) Ek 2’de değil Ek 1’de yer alır.
