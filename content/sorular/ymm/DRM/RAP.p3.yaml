    bölümü hazırlamaktadır.


    BDS 700’ün Görüşün Dayanağı bölümüne ilişkin hükümlerine göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Bölüm, Görüş bölümünün hemen ardından yer alır; denetimin BDS’lere uygun yürütüldüğü belirtilir ve denetçinin sorumluluklarının
      açıklandığı bölüme atıfta bulunulur.
    B: Bölüm raporun sonunda yer alır; denetimin BDS’lere uygun yürütüldüğüne ilişkin açıklama bu bölümde değil, yalnızca
      Görüş bölümünde belirtilir.
    C: Bölüm, denetçinin sorumluluklarının açıklandığı bölüme atıfta bulunmaz; denetçinin sorumlulukları yalnızca Görüş bölümü
      içinde açıklanır ve ayrıca bir bölüm gerekmez.
    D: Elde edilen kanıtların görüşe dayanak oluşturmak için yeterli ve uygun olduğu kanaatine varıp varmadığı yalnızca olumlu
      görüş dışında görüş verildiğinde belirtilir.
    E: Bölümde etik hükümlerin kaynağına atıf yapılmaz; denetçi yalnızca bağımsız olduğunu belirtir ve etiğe ilişkin diğer
      sorumluluklarını yerine getirdiğini açıklamaz.
  dogru: A
  aciklama:
    dogru_neden: Par. 28’e göre denetçi raporunda Görüş bölümünün hemen ardından “Görüşün Dayanağı” başlıklı bir bölüm yer
      alır; bu bölümde denetimin BDS’lere uygun yürütüldüğü belirtilir, denetçinin BDS’ler kapsamındaki sorumluluklarının
      açıklandığı bölüme atıfta bulunulur, etik hükümler uyarınca bağımsızlık ve etiğe ilişkin diğer sorumlulukların yerine
      getirildiği açıklanır ve elde edilen kanıtların görüşe dayanak oluşturmak için yeterli ve uygun olup olmadığı belirtilir.
    celdiriciler:
      B: Görüşün Dayanağı bölümü Görüş bölümünün hemen ardından gelir ve BDS’lere uygunluk açıklaması bu bölümde yapılır (par.
        28).
      C: Par. 28(b) bu bölümde sorumlulukların açıklandığı bölüme atıfta bulunulmasını zorunlu kılar.
      D: Par. 28’e göre bu kanaat her raporda belirtilir; olumlu görüş dışında görüşte yalnızca ifade BDS 705 par. 25 uyarınca
        değiştirilir.
      E: Par. 28(c)(i) etik hükümlerin kaynağına atıfta bulunulmasını, etiğe ilişkin diğer sorumlulukların yerine getirildiğinin
        açıklanmasını zorunlu kılar.
