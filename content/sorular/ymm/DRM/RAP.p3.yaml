- id: YMM-DRM-RAP-0054
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: uygulama
  zorluk: 3
  kok: 'Bir denetçi, borsada işlem görmeyen Güneş Enerji A.Ş.’nin denetim raporuna, kullanıcıların denetimi, denetçinin sorumluluklarını
    veya denetçi raporunu anlamaları açısından ilgili olan birden fazla konu için Diğer Hususlar paragrafı eklemiştir. BDS
    706’ya göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi, bu paragraf için “Diğer Hususlar” başlığından başka bir başlık kullanamaz.

    II. Birden fazla konu bulunması durumunda denetçinin her bir konuya ilişkin ayrı bir alt başlık kullanması faydalı olabilir.

    III. Ek 3’teki örnek, kilit denetim konularının bildirilmediği ve yalnızca Dikkat Çekilen Hususlar paragrafının yer aldığı
    bir raporu göstermektedir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: B
  aciklama:
    dogru_neden: 'BDS 706 par. 11’e göre denetçi “Diğer Hususlar” ya da uygun başka bir başlık altında ayrı bir bölüm oluşturur;
      I yanlıştır. A11’e göre çok sayıda konu bulunduğunda her bir konu için ayrı alt başlık kullanılması faydalı olabilir;
      II doğrudur. A17’ye göre Ek 3’teki örnek, tamamına aynı raporda yer verildiğinde Kilit Denetim Konuları bölümü, Dikkat
      Çekilen Hususlar paragrafı ve Diğer Hususlar paragrafı arasındaki ilişkiyi gösterir; kilit denetim konularının bildirilmediği
      örnek Ek 4’tür. III yanlıştır. Püf noktaları: (1) Diğer Hususlar paragrafında “Diğer Hususlar” başlığı zorunlu değildir;
      uygun başka başlık kullanılabilir (par. 11). (2) Ek 3 üç bölümün birlikte yer aldığı örnektir; kilit denetim konularının
      bildirilmediği örnek Ek 4’tür (A17).'
    celdiriciler:
      A: I yanlıştır; par. 11 “Diğer Hususlar” ya da uygun başka bir başlığa izin verir.
      C: I yanlıştır; uygun başka bir başlık kullanılabilir (par. 11).
      D: I ve III yanlıştır; II doğru olduğundan bu birleşim hatalıdır.
      E: III yanlıştır; Ek 3 üç bölümün aynı raporda ilişkisini gösterir (A17).
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. 11
    alinti: ya da uygun başka bir başlık altında ayrı bir bölüm oluşturmak suretiyle
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. A11
    alinti: denetçinin her bir konuya ilişkin ayrı bir alt başlık kullanması faydalı olabilir
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. A17
    alinti: Kilit Denetim Konuları bölümü, Dikkat Çekilen Hususlar paragrafı ve Diğer Hususlar paragrafı arasındaki ilişki
      gösterilmektedir
