  kok: BDS 705’in Görüşün Dayanağı bölümüne ve görüş vermekten kaçınan denetçinin sorumluluklar bölümüne ilişkin açıklayıcı
    hükümlerine göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Stokların olduğundan fazla gösterilmesinde denetçi, Görüşün Dayanağı bölümünde vergi öncesi kâr, net kâr ve özkaynak
      üzerindeki etkilerin tutarını gösterebilir.
    B: Finansal tablolarda ihmal edilen bilgilerin Görüşün Dayanağı bölümünde açıklanması, yönetimin açıklamaları hazırlamamış
      olması hâlinde mümkün değildir.
    C: Denetçi, ihmal edilen açıklamaların rapora nispeten aşırı derecede fazla olduğuna muhakemesiyle karar verirse bunları
      Görüşün Dayanağı bölümünde veremeyebilir.
    D: Görüş vermekten kaçınan denetçi, sorumluluklar bölümünde BDS 700’ün 28(a) paragrafındaki açıklamayı, sorumluluk kapsamını
      değiştirmeden aynen korur.
    E: Görüş vermekten kaçınan denetçi, sorumluluklar bölümünde bağımsızlığa ve diğer etik yükümlülüklere ilişkin 28(c) paragrafındaki
      açıklamaya yer verir.
  dogru: D
  aciklama:
    dogru_neden: 'A25’e göre görüş vermekten kaçınan denetçi, BDS 700’ün 28(a) paragrafında zorunlu kılınan açıklamayı, denetçinin
      sorumluluğunun finansal tabloların denetiminin BDS’lere uygun olarak yürütülmesi olduğunu ifade edecek şekilde değiştirir;
      aynen korumaz. D bu nedenle yanlıştır; diğer ifadeler A22, A23 ve A25’e uygundur. Püf noktaları: (1) Soru yanlış ifadeyi
      istemektedir; yanlış ifade, görüş vermekten kaçınmada 28(a) açıklamasının değişmeden kalacağını söyler. (2) Görüş vermekten
      kaçınan denetçi 28(a) açıklamasını değiştirir ve 28(c) bağımsızlık-etik açıklamasını korur (A25); ihmal edilen açıklamaların
      bölümde verilememesi ise yalnızca A23’teki iki durumda söz konusudur.'
    celdiriciler:
      A: Doğru ifadedir; A22’ye uygundur.
      B: Doğru ifadedir; A23’e uygundur.
      C: Doğru ifadedir; A23’e uygundur.
      E: Doğru ifadedir; A25’e uygundur.
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A25
    alinti: Bu açıklama, denetçinin sorumluluğunun, işletmenin finansal tablolarının denetiminin BDS’lere uygun olarak yürütülmesi
      olduğunu ifade edecek şekilde değiştirilir
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A22
    alinti: stokların olduğundan fazla gösterilmesi durumunda gelir vergisi, vergi öncesi kâr, net kâr ve özkaynak üzerindeki
      etkilerin tutarı gösterilebilir
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A23
    alinti: Yönetimin açıklamaları hazırlamamış olması veya açıklamaların başka bir sebeple denetçinin kullanımına sunulmamış
