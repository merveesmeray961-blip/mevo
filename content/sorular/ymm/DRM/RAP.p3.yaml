- id: YMM-DRM-RAP-0044
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 3
  kok: Borsada işlem görmeyen Yıldız Kimya A.Ş.’nin finansal tabloları ile birlikte, geçerli finansal raporlama çerçevesinin
    zorunlu kılmadığı ve yönetimin ihtiyari olarak hazırladığı ilâve bir bölüm kârlılık listesi sunulmuştur. Denetçi, bu listenin
    niteliği ve sunulma şekli itibarıyla finansal tabloların ayrılmaz bir parçası olmadığı sonucuna varmıştır. Ancak liste,
    finansal tablo dipnotlarının arasına karışık biçimde yerleştirilmiş ve denetlenmiş bilgilerden yeterli ve açık biçimde
    ayırt edilememektedir. Denetçi yönetimden sunum şeklinin değiştirilmesini talep etmiş, yönetim bu değişikliği yapmayı
    reddetmiştir. BDS 700’e göre denetçi aşağıdakilerden hangisini yapar?
  secenekler:
    A: Görüşünü sınırlı olumlu hâle getirir; çünkü yönetimin sunumu değiştirmeyi reddetmesi bir kapsam sınırlaması sayılır.
    B: Listeyi denetçi görüşü kapsamına dâhil eder ve içindeki bilgileri de denetlenmiş sayarak olumlu görüş verir.
    C: Talebi yönetime iletmesi yeterlidir; talep reddedilse bile raporunda ilâve bilgilere ilişkin ayrıca bir açıklama yapmaz.
    D: Söz konusu ilâve bilgileri belirler ve bu bilgilerin denetlenmemiş olduğunu denetçi raporunda açıklar.
    E: Raporunu vermekten vazgeçer ve ilâve bilgilerin ayrışmaması nedeniyle denetim sözleşmesinden çekilir.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 700 par. 54’e göre ilâve bilgiler finansal tabloların ayrılmaz bir parçası olarak dikkate alınmıyor
      ve denetlenen finansal tablolardan yeterli ve açık biçimde ayırt edilemiyorsa denetçi yönetimden sunumun değiştirilmesini
      talep eder; yönetim reddederse denetçi söz konusu ilâve bilgileri belirler ve bunların denetlenmemiş olduğunu raporunda
      açıklar. Finansal tabloların ayrılmaz bir parçası olsalardı görüş kapsamına dâhil edilirlerdi (par. 53). Püf noktaları:
      (1) İlâve bilginin finansal tabloların ayrılmaz parçası olup olmadığı denetçinin mesleki muhakemesine bağlıdır; ayrılmaz
      parça ise görüş kapsamına girer (par. 53). (2) Ayrılmaz parça değilse ve ayırt edilemiyorsa önce yönetimden değişiklik
      talep edilir; ret hâlinde çözüm raporda belirleme ve açıklamadır, görüş türü kendiliğinden değişmez (par. 54).'
    celdiriciler:
      A: BDS 700 par. 54 bu durumda görüş türünün değişmesini değil, ilâve bilgilerin belirlenip denetlenmemiş olduğunun raporda
        açıklanmasını öngörür.
      B: Görüş kapsamına dâhil edilme, ilâve bilgilerin finansal tabloların ayrılmaz bir parçası olması durumuna ilişkindir
        (par. 53); burada ayrılmaz parça değildir.
      C: Yönetimin reddetmesi hâlinde denetçinin ilâve bilgileri belirleyip denetlenmemiş olduğunu raporunda açıklaması gerekir
        (par. 54).
      E: Standart çekilmeyi öngörmez; ayrışmayan ilâve bilgilerin belirlenip denetlenmemiş olarak raporda açıklanması yeterli
        yanıttır (par. 54).
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 54
    alinti: denetçi söz konusu ilâve bilgileri belirler ve bu bilgilerin denetlenmemiş olduğunu denetçi raporunda açıklar
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 53
    alinti: Finansal tabloların ayrılmaz bir parçası olmaları durumunda, ilâve bilgiler denetçi görüşü kapsamına dâhil edilir.
