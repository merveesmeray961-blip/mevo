  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: tasdik raporu türleri
  tip: uygulama
  zorluk: 3
  kok: 'Yeminli mali müşavir Kerem, bir vakfın muafiyet tanınmasına ilişkin işlemleri için tasdik raporu düzenlemeyi planlamaktadır.
    Tasdik Yönetmeliği’ne göre dernek, tesis, vakıf ve kooperatiflere muafiyet tanınması ______ yönünden tasdiki yapılabilecek
    konulardandır; ancak bu konunun tasdikine ilişkin olarak Bakanlıkça ______ çıkartılmadıkça yeminli mali müşavirler bu
    konuyla ilgili tasdik işlemi yapamazlar. Tasdik konu ve kapsamı itibariyle düzenlenecek raporlarda yer alacak asgari konular
    ve rapor disposizyonları ise ______ belirlenir.


    Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?'
  secenekler:
    A: gelir vergisi ve kurumlar vergisi ile ilgili işlemler – tebliğ – Bakanlıkça çıkartılacak tebliğlerle
    B: mali mevzuatta yer alan teşvik, indirim, istisna ve muafiyetler – genelge – ilgili Oda yönetim kurulu kararlarıyla
    C: kurumlar vergisi ve katma değer vergisi işlemleri – tebliğ – Birlik tarafından yayımlanacak rehberle
    D: mali mevzuatta yer alan teşvik, indirim, istisna ve muafiyetler – tebliğ – Bakanlıkça çıkartılacak tebliğlerle
    E: mali mevzuatta yer alan teşvik, indirim, istisna ve muafiyetler – tebliğ – yeminli mali müşavirin hazırlayacağı dispozisyonla
  dogru: D
  aciklama:
    dogru_neden: 'Md. 7/G-f dernek, tesis, vakıf ve kooperatiflere muafiyet tanınmasını “mali mevzuatta yer alan teşvik, indirim,
      istisna ve muafiyetler” başlığı altında tasdik konusu sayar. Md. 7’nin son fıkrasına göre bu konu ve belgelerin tasdikine
      ilişkin olarak Bakanlıkça tebliğ çıkartılmadıkça yeminli mali müşavirler tasdik işlemi yapamazlar. Md. 19’a göre tasdik
      konu ve kapsamı itibariyle düzenlenecek raporlarda yer alacak asgari konular ve rapor disposizyonları, Bakanlıkça çıkartılacak
      tebliğlerde belirlenir. Püf noktaları: Bir konunun md. 7’de sayılmış olması tek başına tasdik yetkisi vermez, tebliğ
      şartı aranır; aynı tebliğ aynı zamanda rapor dispozisyonunu belirler (md. 7 son fıkralar ile md. 19 birlikte okunur).'
    celdiriciler:
      A: Dernek, tesis, vakıf ve kooperatiflere muafiyet tanınması gelir vergisi başlığında değil, mali mevzuatta yer alan
        teşvik, indirim, istisna ve muafiyetler başlığındadır (md. 7/G-f).
      B: Md. 7 sonunda aranan işlem Bakanlıkça çıkartılacak tebliğdir; asgari konular ve dispozisyonlar md. 19’a göre Oda
        kararıyla değil tebliğlerle belirlenir.
      C: Muafiyet tanınması kurumlar vergisi başlığında sayılmamıştır; rapor dispozisyonlarını Birlik rehberi değil Bakanlık
        tebliğleri belirler (md. 19).
      E: Md. 19’a göre asgari konular ve rapor disposizyonları tasdike tabi tutulan konuyla ilgili olarak Bakanlıkça çıkartılacak
        tebliğlerde belirlenir.
