  kok: Payları borsada işlem gören Mercan Çelik A.Ş.’nin denetiminde BDS 701 uygulanmaktadır. Denetçi, bir kilit denetim konusunun
    kamuya açıklanmasının doğuracağı olumsuz sonuçların kamu yararını aşacağının makul şekilde beklendiği oldukça istisnai
    bir durumda olduğunu düşünmektedir; ancak işletme bu konu hakkında kamuya bilgi açıklaması yapmıştır. Mevzuat konunun
    kamuya açıklanmasını yasaklamamaktadır. BDS 701’e göre denetçi bu konuyu nasıl raporlar?
  secenekler:
    A: Kamu yararı değerlendirmesi kendi muhakemesine bağlı olduğundan konuyu raporunda bildirmemeye karar verebilir.
    B: Konuyu raporunda açıklamaz; yalnızca finansal tablolardaki ilgili açıklamaya atıfta bulunmakla yetinir.
    C: Konuyu yalnızca üst yönetimden sorumlu olanlara bildirir ve raporunda kilit denetim konusu olarak göstermez.
    D: Konuyu Kilit Denetim Konuları bölümü yerine Diğer Hususlar paragrafında kısaca belirtmekle yükümlüdür.
    E: Konuyu, nedenini ve denetimde nasıl ele alındığını belirterek Kilit Denetim Konuları bölümünde açıklar.
  dogru: E
  aciklama:
    dogru_neden: BDS 701 par. 14’e göre mevzuatın izin vermediği veya kamuya açıklamanın olumsuz sonuçlarının kamu yararını
      aşacağının makul şekilde beklendiği oldukça istisnai durumlarda konunun raporda bildirilmemesine karar verilebilir;
      ancak işletmenin konu hakkında kamuya bilgi açıklaması halinde bu istisna uygulanmaz. Bu durumda par. 13 uyarınca konu,
      kilit denetim konusu olarak belirlenme sebebi ve denetimde nasıl ele alındığı belirtilerek açıklanır.
    celdiriciler:
      A: İstisna, işletmenin konuyu kamuya açıklamadığı durumlara özgüdür; kamuya açıklama yapılmışsa denetçi muhakemesiyle
