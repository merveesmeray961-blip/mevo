      zorunlu kılınan iki unsura yer verilmez: denetçinin sorumluluklarının açıklandığı bölüme atıf ve elde edilen denetim
      kanıtlarının görüşe dayanak oluşturmak için yeterli ve uygun olup olmadığına ilişkin açıklama. B şıkkı bunun tersini
      söylediğinden yanlıştır.'
