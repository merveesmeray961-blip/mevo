  kok: BDS 705’e göre denetçinin yeterli ve uygun denetim kanıtı elde edememesinin (denetimin kapsamının sınırlanmasının)
    nedenlerine ve bu duruma ilişkin örneklere dair aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Yeterli ve uygun denetim kanıtı elde edilememesi, işletmenin kontrolü dışındaki durumlardan veya yönetim tarafından
      getirilen kısıtlamalardan kaynaklanabilir.
    B: Görevlendirmenin zamanlaması nedeniyle fiziki stok sayımının gözlemlenememesi, denetçinin çalışmasının niteliği veya
      zamanlamasıyla ilgili bir durum örneğidir.
    C: Yönetimin denetçinin belirli hesap bakiyelerine ilişkin dış teyit taleplerini engellemesi, yönetim tarafından getirilen
      bir sınırlamaya örnektir.
