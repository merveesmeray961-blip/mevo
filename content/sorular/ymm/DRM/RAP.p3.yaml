      alındığı bölümde de yer verilebilir. Par. 45’e göre ayrı bölüm varsa BDS unsurları “Finansal Tabloların Bağımsız Denetimi”
      başlığı altında yer alır ve diğer yükümlülükler bölümü bu bölümden sonra gelir.
