      durumlarda, belirli bir prosedürün uygulanamaması denetimin kapsamı üzerinde bir sınırlama teşkil etmez. D bu nedenle
      yanlıştır; diğer ifadeler A8, A10, A11 ve A12’ye uygundur.
    celdiriciler:
      A: Doğru ifadedir; A8’e uygundur.
      B: Doğru ifadedir; A11’e uygundur.
      C: Doğru ifadedir; A12’ye uygundur.
      E: Doğru ifadedir; A10’a uygundur.
