  kok: BDS 705’e göre sınırlı olumlu görüş ve olumsuz görüşün ifade edilmesine ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Finansal tablolardaki önemli bir yanlışlıktan dolayı sınırlı olumlu görüş veren denetçi, Sınırlı Olumlu Görüşün Dayanağı
      bölümünde belirtilen hususun etkileri hariç olmak üzere tabloların gerçeğe uygun sunulduğunu belirtir.
    B: Yeterli ve uygun kanıt elde edilememesi nedeniyle sınırlı olumlu görüş veren denetçi, Görüş bölümünde sınırlı olumlu
      görüşü “yukarıdaki açıklama ile” veya “…’e bağlı olarak” ifadeleriyle bağlayabilir.
    C: Yeterli ve uygun kanıt elde edilememesi nedeniyle sınırlı olumlu görüş veren denetçi, görüşünde uygun olarak “… hususunun
      (veya hususlarının) muhtemel etkileri hariç olmak üzere…” ifadesini kullanır.
    D: Olumsuz görüş veren denetçi, uygunluk çerçevesi uyarınca raporlama yapılması durumunda finansal tabloların tüm önemli
      yönleriyle ilgili çerçeveye uygun hazırlanmamış olduğunu belirtir.
    E: Olumsuz görüş veren denetçi, gerçeğe uygun sunum çerçevesi uyarınca raporlama yapılması durumunda finansal tabloların
      gerçeğe uygun bir biçimde sunmadığını (veya doğru ve gerçeğe uygun bir görünüm sağlamadığını) belirtir.
  dogru: B
  aciklama:
    dogru_neden: Par. 17’ye göre yeterli ve uygun kanıt elde edilememesi nedeniyle olumlu görüş dışında görüş verilirse denetçi
      “… hususunun muhtemel etkileri hariç olmak üzere…” ifadesini kullanır. A20’ye göre ise sınırlı olumlu görüşte “yukarıdaki
      açıklama ile” veya “…’e bağlı olarak” gibi ifadelerin kullanılması uygun olmaz; çünkü bu ifadeler yeterince açık veya
      kuvvetli değildir. B bu nedenle yanlıştır; diğer ifadeler par. 17 ve 18’e uygundur.
    celdiriciler:
      A: Doğru ifadedir; par. 17’ye uygundur.
      C: Doğru ifadedir; par. 17’nin son fıkrası bunu öngörür.
      D: Doğru ifadedir; par. 18(b)’ye uygundur.
      E: Doğru ifadedir; par. 18(a)’ya uygundur.
