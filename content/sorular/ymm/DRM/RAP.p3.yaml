  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 3
  kok: 'Denetçi, Işık Plastik A.Ş.’nin Türkiye Muhasebe Standartlarına (gerçeğe uygun sunum çerçevesi) uygun olarak hazırlanan
    finansal tablolarının denetiminde, tabloların TMS hükümlerine uygun hazırlandığını, ancak yönetimin gerçeğe uygun sunum
    için gerekli olan ilâve açıklamaları yapmaması nedeniyle gerçeğe uygun sunumun sağlanmadığını tespit etmiştir.


    BDS 700’e göre denetçinin izleyeceği yol aşağıdakilerden hangisidir?'
  secenekler:
    A: Tablolar TMS hükümlerine uygun hazırlandığından gerçeğe uygun sunum değerlendirmesi gerekmez; hususu yönetimle müzakere
      etmeksizin olumlu görüş verir.
    B: Hususu yönetimle müzakere eder; çerçeve hükümlerine ve hususun çözümüne bağlı olarak BDS 705 uyarınca olumlu görüş
      dışında görüş gerekip gerekmediğine karar verir.
    C: Hususu yönetimle müzakere etmeksizin, gerçeğe uygun sunumun sağlanamaması nedeniyle doğrudan olumsuz görüş vererek
      konuyu Görüşün Dayanağı bölümünde açıklar.
    D: Hususu yönetimle müzakere eder; yönetim ilâve açıklamaları eklese bile çerçeve hükümlerine uyulduğundan denetçi yine
      de olumlu görüş dışında bir görüş vermek zorundadır.
    E: Hususu yönetimle müzakere eder; çözülemezse olumlu görüşünü sürdürür ve konuyu yalnızca Dikkat Çekilen Hususlar paragrafı
      ile kullanıcılara bildirir.
  dogru: B
  aciklama:
    dogru_neden: 'Par. 14’e göre finansal tabloların gerçeğe uygun sunum çerçevesine göre hazırlandığı durumda denetçi, tabloların
      gerçeğe uygun sunum sağlayıp sağlamadığını da değerlendirir. Par. 18’e göre gerçeğe uygun sunum çerçevesinin hükümlerine
      uygun hazırlanmış tablolar gerçeğe uygun sunumu sağlamıyorsa denetçi hususu yönetimle müzakere eder ve çerçeve hükümlerine
      ve hususun çözümüne bağlı olarak BDS 705 uyarınca olumlu görüş dışında görüş verilmesinin gerekip gerekmediğine karar
      verir. A16’ya göre çözüm, yönetimin ilâve açıklamalar yapması veya çok istisnai durumda çerçevedeki bir hükümden sapmasıdır.
      Püf noktaları: Par. 18 (gerçeğe uygun sunum çerçevesi: müzakere ve BDS 705’e göre karar) ile par. 19 (uygunluk çerçevesi:
      değerlendirme zorunlu değil, yalnızca çok istisnai yanıltıcılıkta müzakere) farkı; Dikkat Çekilen Hususlar paragrafı
      hiçbir zaman olumlu görüş dışındaki görüşün yerine geçmez.'
    celdiriciler:
      A: Gerçeğe uygun sunum çerçevesinde denetçi, tabloların gerçeğe uygun sunumu sağlayıp sağlamadığını değerlendirmek zorundadır
        (par. 14); zorunlu olmama durumu uygunluk çerçevesine özgüdür (par. 19).
      C: Par. 18 önce yönetimle müzakereyi ve hususun çözümüne göre karar verilmesini öngörür; doğrudan olumsuz görüş verilmez.
      D: Hususun nasıl çözüldüğü kararı etkiler; ilâve açıklamalar yapılarak gerçeğe uygun sunum sağlanırsa olumlu görüş dışında
        görüş gerekmeyebilir (par. 18, A16).
      E: Dikkat Çekilen Hususlar paragrafı, BDS 705 uyarınca gerekli olan olumlu görüş dışındaki görüşün yerini almaz.
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 18
    alinti: bu hususu yönetimle müzakere eder ve ilgili geçerli finansal raporlama çerçevesi hükümlerine ve söz konusu hususun
      ne şekilde çözüldüğüne bağlı olarak, BDS 705 uyarınca, raporunda olumlu görüş dışında bir görüş verilmesinin gerekip
