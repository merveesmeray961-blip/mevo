    alinti: Yeterli ve uygun denetim kanıtı elde edilemediği için olumlu görüş dışında bir görüş vermesi durumunda denetçi,
      verdiği görüşte, bu duruma uygun olarak “… hususunun (veya hususlarının) muhtemel etkileri hariç olmak üzere…” ifadesini
