  kok: 'Tasdik Yönetmeliği’nin 7. maddesinde mali mevzuatta yer alan teşvik, indirim, istisna ve muafiyetler yönünden tasdiki
    yapılabilecek konular arasında ______ ile ______ sayılmıştır.


