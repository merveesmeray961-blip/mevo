  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: kavrama
  zorluk: 2
  kok: 'BDS 706’nın Ek 3 ve Ek 4’te yer alan örnek denetçi raporlarına göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Ek 3’teki örnekte bilânço tarihinden sonra meydana gelen yangına ilişkin Dikkat Çekilen Hususlar paragrafı, Kilit Denetim
    Konuları bölümünün öncesinde yer almıştır.

    II. Ek 3’teki örnekte önceki dönem finansal tablolarının başka bir bağımsız denetçi tarafından denetlenmiş olması, Diğer
    Hususlar paragrafında bildirilmiştir.

    III. Ek 4’teki örnekte (sınırlı olumlu görüş), Dikkat Çekilen Hususlar paragrafı Sınırlı Olumlu Görüşün Dayanağı bölümünün
    öncesinde yer almıştır.

    IV. Ek 3’teki örnekte Diğer Hususlar paragrafı, Kilit Denetim Konuları bölümünden sonra ve Yönetimin ve Üst Yönetimden
    Sorumlu Olanların Finansal Tablolara İlişkin Sorumlulukları bölümünden önce yer almıştır.'
  secenekler:
    A: I ve III
    B: II ve III
    C: I, II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: I, II ve IV doğrudur. Ek 3’teki örnek rapor sırasıyla Görüş, Görüşün Dayanağı, Dikkat Çekilen Hususlar, Kilit
      Denetim Konuları, Diğer Hususlar, Yönetimin ve Üst Yönetimden Sorumlu Olanların Sorumlulukları bölümlerinden oluşur;
      yangın olayı Dikkat Çekilen Hususlar paragrafıyla (KDK öncesinde), önceki denetçiye ilişkin bilgi ise Diğer Hususlar
      paragrafıyla bildirilmiştir. Ek 4’teki örnekte ise sıra Sınırlı Olumlu Görüş, Sınırlı Olumlu Görüşün Dayanağı, Dikkat
      Çekilen Hususlar şeklindedir; bu nedenle III yanlıştır.
    celdiriciler:
      A: III yanlıştır (Ek 4’te DÇH paragrafı Sınırlı Olumlu Görüşün Dayanağı bölümünden sonra gelir); II ve IV doğrudur.
      B: III yanlıştır; I ve IV doğrudur.
      D: III yanlıştır; II doğrudur.
      E: III yanlıştır; I doğrudur.
