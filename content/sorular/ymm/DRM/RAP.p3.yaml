      yer verir.
    D: Sınırlı olumlu veya olumsuz görüşte, kanıtların yeterliliğine ilişkin açıklama görüş türüne göre “sınırlı olumlu” ya
      da “olumsuz” ifadesini içerir.
    E: Finansal tablolardaki önemli bir yanlışlık nedeniyle olumsuz görüş veren denetçi, Görüşün Dayanağı bölümünün başlığını
      “Olumsuz Görüşün Dayanağı” olarak değiştirir.
