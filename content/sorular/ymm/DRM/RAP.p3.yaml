- id: YMM-DRM-RAP-0060
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 3
  kok: 'Borsada işlem gören Demir Lojistik A.Ş.’nin denetiminde denetçi, hasılatın muhasebeleştirilmesindeki hile riskini
    ve yönetimin kontrolleri ihlal etme riskini ciddi risk olarak belirlemiş ve bunları üst yönetimden sorumlu olanlara bildirmiştir.
    Denetçi, bu risklerin niteliği gereği standart prosedürlerle ele alınabildiğini, dolayısıyla denetimde azami düzeyde dikkatini
    gerektirmediğini değerlendirmiştir.


    BDS 701’e göre denetçinin bu iki risk bakımından yapması gereken aşağıdakilerden hangisidir?'
  secenekler:
    A: Ciddi risk olarak belirlenen her konu, üst yönetimden sorumlu olanlara bildirildiği için kilit denetim konusudur ve
      denetçi raporunda mutlaka açıklanmalıdır.
    B: Ciddi risk olmaları bu konuların kendiliğinden kilit denetim konusu olduğunu göstermez; azami düzeyde dikkat gerektirmedikleri
      için denetçi bunları kilit denetim konusu olarak değerlendirmeyebilir.
    C: Hasılattaki hile riski BDS 240 gereği ciddi risk sayıldığından kilit denetim konusu olarak bildirilmek zorundadır;
      yalnızca yönetimin kontrolleri ihlal riski bu değerlendirmenin dışında bırakılabilir.
    D: Üst yönetimden sorumlu olanlara bildirilmiş olmaları yeterlidir; denetçi bu konuları açıklama yapmaksızın yalnızca
      başlık olarak kilit denetim konuları bölümüne yazar.
    E: Kilit denetim konuları yalnızca önceki dönem denetçi raporundaki konular esas alınarak belirlenir; cari dönemde belirlenen
      ciddi riskler bu belirlemede dikkate alınmaz.
  dogru: B
  aciklama:
    dogru_neden: 'Par. 9’a göre denetçi, üst yönetimden sorumlu olanlara bildirilen konular arasından azami düzeyde dikkat
      gerektirenleri belirlerken ciddi riskli alanları da göz önünde bulundurur; par. 10’a göre bunlar arasından cari dönem
      denetiminde en çok önem arz edenler kilit denetim konularını oluşturur. A17, ölçütlerin zorunlu kılınmasının ilgili
      konuların her zaman kilit denetim konusu olduğunu göstermediğini; A21 ise hasılattaki hile riski ve yönetimin kontrolleri
      ihlal riskinin ciddi risk sayılmasına rağmen niteliklerine bağlı olarak azami dikkat gerektirmeyebileceğini ve kilit
      denetim konusu olarak değerlendirilmeyebileceğini belirtir. Püf noktaları: İki aşamalı eleme (par. 9 ile üst yönetime
      bildirilen konulardan azami dikkat gerektirenlerin belirlenmesi, par. 10 ile en çok önem arz edenlerin seçilmesi); ciddi
      risk kavramı BDS 315/240’tan gelir ancak kilit denetim konusu olma ölçütü azami dikkat ve en çok önem arz etmedir.'
    celdiriciler:
      A: Ciddi risk, kilit denetim konusu belirlemede dikkate alınan bir ölçüttür (par. 9(a)); ancak yalnızca denetçinin muhakemesine
        göre en çok önem arz edenler kilit denetim konusu olur (par. 10, A17).
      C: A21 her iki riskin de ciddi risk sayılmasına rağmen azami düzeyde dikkat gerektirmeyebileceğini ve kilit denetim
        konusu olarak değerlendirilmeyebileceğini belirtir.
      D: Kilit denetim konusu olarak belirlenen her konunun neden en çok önem arz ettiği ve denetimde nasıl ele alındığı açıklanır
        (par. 13); ayrıca bildirilmiş olmak tek başına kilit denetim konusu yapmaz.
      E: Belirleme cari döneme ait finansal tabloların denetimine ilişkindir; ciddi riskler par. 9(a)’da açıkça dikkate alınacak
        ölçütler arasındadır.
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 10
    alinti: Denetçi, 9 uncu paragrafa göre belirlenen konulardan hangilerinin cari döneme ait finansal tabloların denetiminde
      en çok önem arz ettiğini belirler ve bunlar kilit denetim konularını oluşturur
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A17
    alinti: Bu ölçütlerin zorunlu kılınması, bunlarla ilgili konuların her zaman kilit denetim konuları olduğunu göstermez.
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
