- id: YMM-DRM-RAP-0084
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 2
  kok: 'Borsada işlem gören Akdeniz Madencilik A.Ş.’nin denetimini planlayan denetçi, kilit denetim konularına ilişkin üst
    yönetimden sorumlu olanlarla iletişimini nasıl kuracağını değerlendirmektedir.


    BDS 701’e göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Kilit denetim konularına ilişkin iletişim rapor düzenlenmeden hemen önce yapılır; planlama aşamasında ilk izlenimlerin
      iletilmesi BDS 701’e uygun değildir.
    B: Planlanan kapsam ve zamanlama müzakere edilirken ilk izlenimlerini iletebilir; bulguları iletirken bu konuları daha
      fazla müzakere edebilir.
    C: Raporun taslağı üst yönetimden sorumlu olanlara sunulmaz; taslağın paylaşılması kilit denetim konularının belirlenmesinin
      bağımsızlığını zedeler.
    D: Raporda bildirilmemesine karar verilen kilit denetim konuları, üst yönetimden sorumlu olanlarla kurulan iletişimin
      kapsamı dışında tutulur.
    E: Bildirilecek kilit denetim konusu bulunmadığına karar veren denetçi, bu kararını kaliteyi gözden geçiren kişiyle müzakere
      ederek yeniden değerlendirmez.
  dogru: B
  aciklama:
    dogru_neden: A60’a göre kilit denetim konuları hakkındaki iletişim için uygun zamanlama denetimin şartlarına göre değişir;
      ancak planlanan kapsam ve zamanlama müzakere edilirken ilk izlenimler iletilebilir ve denetim bulguları iletilirken
      bu konular daha fazla müzakere edilebilir. A61 rapor taslağının sunulabileceğini, A62 bildirilmeyen konuların da iletişim
      kapsamında olduğunu, A63 ise kilit denetim konusu bulunmadığı kararının kaliteyi gözden geçiren kişiyle müzakere edilerek
      yeniden değerlendirilebileceğini belirtir.
    celdiriciler:
      A: A60’a göre planlanan kapsam ve zamanlama müzakere edilirken ilk izlenimler iletilebilir; iletişimin zamanlaması denetimin
        şartlarına göre değişir.
      C: A61’e göre denetçi, raporunun bir taslağını sunmanın müzakereleri kolaylaştırmak bakımından yararlı olacağını düşünebilir.
      D: A62’ye göre iletişim, kilit denetim konusu olarak belirlenen bir konunun raporda bildirilmemesine karar verilen istisnai
        durumları da ele alır.
      E: A63’e göre bu müzakereler, denetçinin kilit denetim konusu bulunmadığına ilişkin kararını yeniden değerlendirmesini
        sağlayabilir.
  kaynaklar:
