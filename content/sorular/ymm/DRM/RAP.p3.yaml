      kapsamında sınırlama sayılır.
    E: İşletmenin muhasebe kayıtlarının tamamen tahrip olmuş olması, denetçinin yeterli kanıt elde edememesine yol açan, işletmenin
      kontrolü dışındaki bir duruma örnektir.
  dogru: D
