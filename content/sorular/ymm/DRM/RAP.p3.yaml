  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: bilgi
  zorluk: 2
  kok: 'BDS 706’ya göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Denetçi raporuna Dikkat Çekilen Hususlar paragrafı eklediğinde, bu paragrafa “Dikkat Çekilen Hususlar” ifadesini içeren
    uygun bir başlık altında ayrı bir bölüm olarak yer verir.

    II. Diğer Hususlar paragrafı, finansal tablolarda sunulan veya açıklanan bir hususa atıfta bulunan paragraftır.

    III. Denetçi, raporuna Dikkat Çekilen Hususlar paragrafı veya Diğer Hususlar paragrafı eklemeyi düşünüyorsa, bu düşüncesini
    ve önerilen metni üst yönetimden sorumlu olanlara bildirir.

    IV. Dikkat çekilen husus, denetçinin finansal tablolara ilişkin görüşünün değiştirilmesini gerektirir.'
  secenekler:
    A: I ve III
    B: Yalnız I
    C: I, II ve III
    D: II ve IV
    E: III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'Par. 9(a)’ya göre Dikkat Çekilen Hususlar paragrafı uygun başlık altında ayrı bölümdür (I doğru); par. 12’ye
      göre bu paragrafı eklemeyi düşünen denetçi düşüncesini ve önerilen metni üst yönetimden sorumlu olanlara bildirir (III
      doğru). Diğer Hususlar paragrafı finansal tablolarda sunulan veya açıklananlar dışındaki bir hususa atıfta bulunur (II
      yanlış); dikkat çekilen husus denetçi görüşünü değiştirmez (IV yanlış). Püf noktası: Dikkat Çekilen Hususlar finansal
      tablolardaki, Diğer Hususlar ise finansal tablolar dışındaki konuya ilişkindir.'
    celdiriciler:
      B: III de doğrudur.
      C: 'II yanlıştır: Diğer Hususlar paragrafı finansal tablolar dışındaki hususa atıfta bulunur.'
      D: II ve IV yanlıştır; I ve III doğrudur.
      E: IV yanlıştır; I de doğrudur.
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
    madde: par. 9
    alinti: ifadesini içeren uygun bir başlık altında ayrı bir bölüm oluşturarak denetçi raporunda yer verir.
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Dikkat Çekilen Hususlar Paragrafları ve Diğer Hususlar Paragrafları
