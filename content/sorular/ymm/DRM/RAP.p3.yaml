- id: YMM-DRM-RAP-0059
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: uygulama
  zorluk: 3
  kok: 'Borsada işlem gören Taşkın Enerji A.Ş.’nin 31.12.2025 tarihli finansal tablolarını denetleyen denetçi, raporunda Kilit
    Denetim Konuları bölümüne yer verecektir. Finansal tablolar ile denetçi raporu tarihi arasında üretim tesisinde çıkan
    ve finansal tablolarda açıklanan yangını denetçi, kullanıcıların finansal tabloları anlaması açısından temel öneme sahip,
    ancak azami düzeyde dikkat gerektirmeyen bir husus olarak değerlendirmiş ve kilit denetim konusu olarak belirlememiştir.
    Denetçi ayrıca, raporuna Diğer Hususlar paragrafı da eklemeyi gerekli görmektedir.


    BDS 706’ya göre aşağıdaki öncüllerden hangileri doğrudur?


    I. Finansal tabloların tarihi ile denetçi raporu tarihi arasında gerçekleşen bu önemli olaya, Dikkat Çekilen Hususlar
    paragrafı ile dikkat çekilebilir.

    II. Dikkat Çekilen Hususlar paragrafının Kilit Denetim Konuları bölümünün öncesinde mi yoksa sonrasında mı yer alacağı,
    denetçinin bu paragraftaki bilgilerin nispi önemi hakkındaki yargısına dayanır.

    III. Diğer Hususlar paragrafını Kilit Denetim Konuları bölümünde açıklanan münferit konulardan ayırmak için “Diğer Hususlar”
    başlığı yerine, paragrafın içeriği hakkında bilgi veren “Diğer Hususlar-Denetimin Kapsamı” gibi bir başlık kullanılabilir.

    IV. Dikkat Çekilen Hususlar paragrafının raporda bulunacağı yer sabittir; paragraf her durumda Kilit Denetim Konuları
    bölümünün öncesinde yer almak zorundadır.'
  secenekler:
    A: I ve II
    B: I, II ve IV
    C: II, III ve IV
    D: I ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'I, II ve III doğrudur. I: Bilânço tarihinden sonraki önemli olay, Dikkat Çekilen Hususlar paragrafının eklenebileceği
      durumlara örnektir (A5); olay kilit denetim konusu da olmadığından paragraf eklenebilir. II ve III: Dikkat Çekilen Hususlar
      ve Diğer Hususlar paragraflarının raporda bulunacağı yer ve başlıkları, denetçinin bilgilerin nispi önemine ilişkin
      yargısına bağlıdır (A16). IV yanlıştır; paragrafın yeri sabit değildir, kilit denetim konuları bölümünün öncesinde de
      sonrasında da yer alabilir. Püf noktaları: Paragrafın yerine ilişkin yargı hem Dikkat Çekilen Hususlar hem Diğer Hususlar
      paragrafı için denetçiye bırakılmıştır; Diğer Hususlar için başlık farklılaştırma örneği (Denetimin Kapsamı) yalnızca
      kilit denetim konuları bölümünün bulunduğu raporlarda anlam kazanır.'
    celdiriciler:
      A: III de doğrudur (A16); Diğer Hususlar paragrafı için içeriği yansıtan başlık kullanılabilir.
      B: IV yanlıştır; paragrafın yeri sabit değildir, III ise doğrudur.
      C: I doğrudur (A5); IV yanlıştır.
      D: II de doğrudur (A16); yerin belirlenmesi denetçinin nispi önem yargısına bağlıdır.
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar Paragrafları
    madde: par. A5
    alinti: Finansal tabloların tarihi ile denetçi raporu tarihi arasında gerçekleşen bilânço tarihinden sonraki önemli bir
      olay
