    dogru_neden: Par. 11’e göre denetçi, her bir kilit denetim konusunu “Kilit Denetim Konuları” başlığı altında raporunun
      ayrı bir bölümünde uygun bir alt başlık kullanarak açıklar; A32 ise bölümdeki konuların hangi sırayla sunulacağını mesleki
      muhakemeye bırakır (nispi önem veya finansal tablolardaki açıklanma sırası) ve alt başlığın amacının konular arasında
      net ayrım olduğunu belirtir. Bu nedenle C doğrudur.
    celdiriciler:
      A: Konular ayrı bir bölümde ve uygun alt başlıklarla açıklanır (par. 11); sıralama zorunlu olarak açıklanma sırasına
        göre değil, mesleki muhakemeye göre belirlenir (A32).
      B: Par. 11, her bir kilit denetim konusunun uygun bir alt başlıkla açıklanmasını zorunlu kılar; A32’ye göre amaç konular
        arasında daha net ayrım yapılmasıdır.
      D: A32’ye göre sıralama mesleki muhakeme konusudur; konular nispi önemine bağlı olarak veya finansal tablolarda açıklanma
        sırasına uygun biçimde sıralanabilir.
      E: Par. 11’e göre bölümün giriş cümlesi, denetçinin bu konular hakkında ayrı bir görüş vermediğini belirtir.
