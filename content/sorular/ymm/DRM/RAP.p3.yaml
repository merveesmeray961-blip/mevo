  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: kavrama
  zorluk: 2
  kok: BDS 705’te “yaygın” teriminin tanımına ve denetçinin muhakemesine göre finansal tablolar üzerindeki yaygın etkilere
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Etkiler finansal tabloların yalnızca belirli bir kalemiyle sınırlı olsa bile, o kalemin tutarı ne olursa olsun, her
      durumda yaygın etki sayılır.
    B: Etkilerin finansal tabloların belirli unsurları, hesapları veya kalemleriyle sınırlı olmaması, etkinin yaygın sayılmasını
      sağlayan hâllerden biridir.
    C: Etkiler belirli unsurlarla sınırlı olsa bile finansal tabloların önemli bir bölümünü temsil ediyorsa veya temsil edebiliyorsa
      yaygın sayılır.
    D: Açıklamalara ilişkin olarak, kullanıcıların finansal tabloları anlaması açısından temel teşkil eden etkiler de yaygın
      etki olarak sayılır.
    E: Yaygın terimi, yanlışlıkların etkileri yanında, kanıt elde edilemediği için tespit edilememiş yanlışlıkların muhtemel
      etkilerini tanımlamak için de kullanılır.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 705 par. 5’te yaygınlık, denetçinin muhakemesine göre üç hâlde sayılır: etkilerin belirli unsur, hesap
      veya kalemlerle sınırlı olmaması; sınırlı olmaları durumunda finansal tabloların önemli bir bölümünü temsil etmeleri
      veya edebilmeleri; açıklamalarda kullanıcıların finansal tabloları anlaması açısından temel teşkil etmeleri. Belirli
      bir kalemle sınırlı etkinin, önemli bir bölümü temsil etmesi koşulu aranmaksızın ‘her durumda’ yaygın sayıldığını söyleyen
      A bu nedenle yanlıştır.'
    celdiriciler:
      B: Doğru ifadedir; tanımın (i) bendi bunu öngörür.
      C: Doğru ifadedir; tanımın (ii) bendi bunu öngörür.
      D: Doğru ifadedir; tanımın (iii) bendi bunu öngörür.
      E: Doğru ifadedir; tanım bu iki etkiyi birlikte kapsar.
