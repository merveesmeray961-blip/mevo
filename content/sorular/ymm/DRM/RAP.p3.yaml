- id: YMM-DRM-RAP-0074
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 2
  kok: 'Borsada işlem gören Kuzey Perakende A.Ş.’nin denetiminde, dönem boyunca hasılatın muhasebeleştirilmesini etkileyen
    yeni bir bilgi teknolojileri (BT) sistemi uygulamaya alınmıştır. Denetçi, bu değişikliğin genel denetim stratejisini önemli
    ölçüde etkilediğini ve ciddi riskle ilgili olduğunu değerlendirmiş, konuyu üst yönetimden sorumlu olanlara bildirmiştir;
    değişiklik finansal tablolarda ayrıca açıklanmamıştır.


    BDS 701’e göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Finansal tablolarda açıklanmayan bir konu azami dikkat gerektiren alan sayılamayacağından, bu değişiklik kilit denetim
      konusu olarak değerlendirilemez.
    B: Azami dikkat gerektiren alanlar planlama aşamasında belirlenir; denetim sırasında elde edilen kanıtlar ve denetimin
      sonuçları bu belirlemeyi değiştirmez.
    C: Denetçi bu değişikliği azami dikkat gerektiren alan saydığına göre, en çok önem arz edip etmediğini ayrıca değerlendirmeden
      kilit denetim konusu olarak bildirir.
    D: Değişiklik finansal tablolarda açıklanmamış olsa da azami dikkat gerektiren alan sayılabilir; cari dönemde en çok önem
      arz ediyorsa kilit denetim konusudur.
    E: Denetim sırasında kontrollerin etkin işlemediğine ilişkin kanıt elde edilmesi, bir alanın azami dikkat gerektiren alan
      olarak belirlenmesini etkilemez.
  dogru: D
  aciklama:
    dogru_neden: A18’e göre yürütülen denetimle ilgili fakat finansal tablolarda açıklanması gerekmeyen konular da, özellikle
      genel denetim stratejisine önemli etki etmesi veya ciddi riskle ilgili olması durumunda (örneğin hasılatı etkileyen
      sistem değişiklikleri) azami dikkat gerektiren alan olabilir. Par. 10 ve A17 uyarınca bu konulardan yalnızca cari dönemde
      en çok önem arz edenler kilit denetim konusudur. D doğrudur.
    celdiriciler:
      A: A18’e göre yürütülen denetimle ilgili fakat finansal tablolarda açıklanması gerekmeyen konular da azami dikkat gerektiren
        alan olabilir ve kilit denetim konusu olarak belirlenebilir.
      B: A16’ya göre kilit denetim konularının belirlenmesi, denetim süresince elde edilen kanıtlara ve denetimin sonuçlarına
        dayanır.
      C: Par. 10 ve A17’ye göre azami dikkat gerektiren her konu kilit denetim konusu olmaz; yalnızca cari dönem denetiminde
        en çok önem arz edenler kilit denetim konusudur.
      E: A22’ye göre denetim sırasında kontrollerin etkin işlemediğine ilişkin kanıt elde edilmesi, alanın azami dikkat gerektiren
        bir alan olarak belirlenmesine sebep olabilir.
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A18
    alinti: dönem boyunca yeni bir bilgi teknolojileri (BT) sisteminin uygulanması (veya mevcut BT sistemindeki ciddi değişiklikler)
      gibi bir değişiklik, denetçinin azami düzeyde dikkat ettiği bir alan olabilir
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A16
    alinti: denetçinin kilit denetim konularını belirlemesi, denetim süresince elde edilen denetim kanıtlarına veya denetimin
      sonuçlarına dayanır
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. A22
    alinti: söz konusu alanın denetçinin azami düzeyde dikkat etmesini gerektiren bir alan olarak belirlenmesine sebep olabilir
