    madde: par. 12
    alinti: konuyu üst yönetimden sorumlu olanlara iletir ve yeterli ve uygun denetim kanıtı elde etmek için alternatif prosedürleri
      uygulamanın mümkün olup olmadığına karar verir.
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 13(b)
    alinti: Mevzuatın izin vermesi ve uygulanabilir olması durumunda, denetimden çekilir
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. 14
    alinti: denetimden çekilmeden önce, denetim sırasında belirlenen ve olumlu görüş dışında bir görüş verilmesine sebep olan
