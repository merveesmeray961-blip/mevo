  kok: 'Borsada işlem gören Tuna Gıda A.Ş.’nin denetiminde denetçi, üç kilit denetim konusu belirlemiş ve bunların denetçi
    raporunda sunuluşunu planlamaktadır.


    BDS 701’e göre denetçinin aşağıdaki yaklaşımlarından hangisi uygundur?'
  secenekler:
    A: Konuları Görüşün Dayanağı bölümünün içinde sunar; ayrı bölüm açmaz, alt başlık kullanmaz ve sıralamayı mutlaka finansal
      tablolardaki açıklanma sırasına göre yapar.
    B: Konuları ayrı bir bölümde açıklar; ancak konular arasındaki ayrımı sağlamak üzere alt başlık kullanmak yerine tüm konuları
      tek bir akıcı metin içinde sunar ve sıralamaz.
    C: Konuları ayrı bir “Kilit Denetim Konuları” bölümünde, her birini uygun alt başlıkla açıklar; sıralamayı nispi önem
      veya finansal tablolardaki açıklanma sırasına göre yapabilir.
    D: Konuları ayrı bir bölümde açıklar; ancak sıralamayı yalnızca denetçinin muhakemesine göre nispi önemine bağlı olarak
      yapabilir, finansal tablolardaki sıraya göre sunamaz.
    E: Konuları ayrı bir bölümde açıklar; bölümün giriş cümlesinde ise denetçinin bu konular hakkında ayrı bir görüş verip
      vermediğine ilişkin hiçbir belirleme yapmaz ve bunu gereksiz görür.
  dogru: C
