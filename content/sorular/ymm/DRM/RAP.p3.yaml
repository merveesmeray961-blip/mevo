  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: kavrama
  zorluk: 2
  kok: 'BDS 706’nın kapsamı, amacı ve diğer standartlarla ilişkisine dair aşağıdaki öncüllerden hangileri doğrudur?


    I. BDS 706, finansal tablolara ilişkin bir görüş oluşturmuş olan denetçinin, gerekli görmesi hâlinde raporuna açık ve
    net ilâve bildirimler dâhil ederek kullanıcıların dikkatini çekmesine ilişkindir.

    II. Dikkat Çekilen Hususlar paragrafı, BDS 705 uyarınca olumlu görüş dışında bir görüş verilmesini gerektiren bir hususun
    kullanıcıların dikkatine sunulması için de kullanılabilir.

    III. Denetçinin raporunda Kilit Denetim Konuları bölümüne yer vermesi durumunda, kilit denetim konuları ile BDS 706’ya
    uygun ilâve bildirimler arasındaki ilişki BDS 706’da ele alınır.

    IV. İşletmenin sürekliliğinin ve diğer bilgilerin denetçi raporunda bildirilmesine ilişkin hükümler sırasıyla BDS 570
    ve BDS 720’de yer alır.'
  secenekler:
    A: Yalnız I
    B: I ve III
    C: II ve IV
    D: II, III ve IV
    E: I, III ve IV
  dogru: E
  aciklama:
    dogru_neden: I, III ve IV doğrudur. Par. 6’ya göre amaç, finansal tablolara ilişkin bir görüş oluşturmuş olan denetçinin
      gerekli ise raporuna açık ve net ilâve bildirimler dâhil ederek kullanıcıların dikkatini çekmektir (I). Par. 2’ye göre
      Kilit Denetim Konuları ile BDS 706 kapsamındaki ilâve bildirimler arasındaki ilişki bu standartta ele alınır (III).
      Par. 3’e göre sürekliliğe ve diğer bilgilere ilişkin raporlama hükümleri sırasıyla BDS 570 ve BDS 720’dedir (IV). II
      yanlıştır; par. 8(a)’ya göre Dikkat Çekilen Hususlar paragrafı, yalnızca BDS 705 uyarınca olumlu görüş dışında görüş
      verilmesini gerektirmeyen hususlar için eklenir.
    celdiriciler:
      A: III ve IV de doğrudur; par. 2 ve 3’e uygundur.
      B: IV de doğrudur; par. 3’e göre süreklilik ve diğer bilgilere ilişkin hükümler BDS 570 ve BDS 720’dedir.
      C: II yanlıştır; par. 8(a)’ya göre olumlu görüş dışında görüş gerektiren bir husus için Dikkat Çekilen Hususlar paragrafı
        eklenmez. I ve III de doğrudur.
      D: II yanlıştır; I de doğrudur.
