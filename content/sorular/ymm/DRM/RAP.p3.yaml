- id: YMM-DRM-RAP-0081
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 2
  kok: 'Bir denetçi, bir işletmenin finansal tablolarının denetimiyle birlikte işletmenin iç kontrolünün etkinliğine ilişkin
    bir görüş verme sorumluluğunu da üstlenmiştir.


    BDS 700’e göre denetçi raporunun Bağımsız Denetçinin Finansal Tabloların Bağımsız Denetimine İlişkin Sorumlulukları bölümünde
    iç kontrole ilişkin ifade bakımından aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: İç kontrol değerlendirmesinin işletmenin iç kontrolünün etkinliğine ilişkin görüş verme amacı taşımadığı yönündeki
      ifade denetçi tarafından rapordan çıkarılır.
    B: İç kontrolü yalnızca duruma uygun denetim prosedürlerini tasarlamak amacıyla değerlendirdiğini belirten ifade, görüş
      verme sorumluluğu bulunsa da raporda aynen korunur.
    C: İç kontrolün etkinliğine ilişkin görüş verme sorumluluğunun bulunması raporda belirtilmez; iç kontrole ilişkin ifade
      olduğu gibi bırakılır.
    D: Denetçi, bu durumda hile kaynaklı önemli bir yanlışlığı tespit edememe riskinin hata kaynaklı yanlışlığı tespit edememe
      riskinden daha düşük olduğunu belirtir.
    E: İç kontrole ilişkin amaç dışlayıcı ifade, yalnızca borsada işlem gören işletmelerin denetiminde rapordan çıkarılır;
      diğer işletmelerde aynen korunur.
  dogru: A
  aciklama:
    dogru_neden: Par. 39(b)(ii)’ye göre denetçi iç kontrolü, etkinliğine ilişkin görüş bildirme amacıyla değil duruma uygun
      denetim prosedürlerini tasarlamak amacıyla değerlendirdiğini belirtir. Denetçinin finansal tabloların denetimiyle birlikte
      iç kontrolün etkinliğine ilişkin bir görüş verme sorumluluğunun da bulunduğu durumlarda bu amaç dışlayıcı ifade denetçi
      tarafından rapordan çıkarılır.
    celdiriciler:
      B: Par. 39(b)(ii)’ye göre iç kontrolün etkinliğine ilişkin görüş verme sorumluluğu da varsa, bu amaç dışlayıcı ifade
        rapordan çıkarılır.
      C: Bu durumda ifade rapordan çıkarılır; böylece iç kontrole ilişkin değerlendirmenin görüş amacı taşımadığı izlenimi
        önlenir.
      D: Par. 39(b)(i)’ye göre hile kaynaklı önemli bir yanlışlığı tespit edememe riski, hata kaynaklı olandan daha yüksektir.
      E: Par. 39(b)(ii) çıkarma hükmünü işletmenin türüne bağlamaz; görüş verme sorumluluğunun bulunduğu her durumda ifade
        rapordan çıkarılır.
  kaynaklar:
