  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 700 olumlu görüş
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, gerçeğe uygun sunum çerçevesine göre hazırlanan Çınar Gıda A.Ş.’nin finansal tablolarının denetimini tamamlamıştır.
    Finansal tabloları hazırlayan ve iç kontrolden sorumlu olan kişiler şirket yönetimidir; finansal raporlama sürecinin gözetiminden
    ise bunlardan farklı kişilerden oluşan denetim komitesi sorumludur. BDS 700’e göre denetçi raporunun “Yönetimin Finansal
    Tablolara İlişkin Sorumlulukları” bölümü hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bölümde yalnızca yönetimin sorumlulukları yer alır; finansal raporlama sürecinin gözetiminden sorumlu olanlara ne başlıkta
      ne de bölüm içeriğinde atıf yapılır.
    B: Raporda “yönetim” sözcüğünün özellikle ve mutlaka kullanılması zorunludur; mevzuata uygun başka bir terim kullanılması
      bu zorunluluğu karşılamaz.
    C: Bölümde yalnızca finansal tabloların hazırlanması ve iç kontrol sorumluluğu belirtilir; işletmenin sürekliliğinin değerlendirilmesine
      ilişkin sorumluluğa yer verilmez.
    D: Gerçeğe uygun sunum çerçevesinde sorumluluk yalnızca “finansal tabloların hazırlanması” olarak ifade edilir; “gerçeğe
      uygun sunum” ifadesine yer verilmez.
    E: Gözetimden sorumlu olanlar bölümde ayrıca belirtilir ve başlıkta Üst Yönetimden Sorumlu Olanlara veya mevzuatın uygun
      gördüğü başka bir terime de atıfta bulunulur.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 700 par. 35’e göre finansal raporlama sürecinin gözetiminden sorumlu olanlar ile par. 34’teki sorumlulukları
      yerine getirenler farklı kişilerse, denetçi raporunun bu bölümünde ayrıca gözetimden sorumlu olanlar belirtilir ve bölüm
      başlığında aynı zamanda “Üst Yönetimden Sorumlu Olanlar”a veya mevzuatın bunlar için uygun gördüğü başka bir terime
      atıfta bulunulur. Püf noktaları: (1) Hazırlayanlar ile gözetimden sorumlular farklı kişilerse hem bölüm içeriğinde hem
      başlıkta gözetimden sorumlulara yer verilir (par. 35). (2) “Yönetim” sözcüğü zorunlu değildir (par. 33); sürekliliğin
      değerlendirilmesi sorumluluğu bölüme dâhildir (par. 34) ve gerçeğe uygun sunum çerçevesinde sorumluluk ifadesi buna
      göre kurulur (par. 36).'
    celdiriciler:
      A: Hazırlayanlar ile gözetimden sorumlu olanlar farklı kişilerse gözetimden sorumlu olanlar bölümde belirtilir ve başlıkta
        atıf yapılır (par. 35).
      B: Denetçi raporunda “yönetime” özellikle atıfta bulunulması gerekli değildir; mevzuata uygun bir terim kullanılması
        gerekir (par. 33).
      C: Bölümde işletmenin sürekliliğini devam ettirme kabiliyetinin değerlendirilmesine ve gerektiğinde ilgili hususların
        açıklanmasına ilişkin sorumluluk da belirtilir (par. 34).
      D: Gerçeğe uygun sunum çerçevesinde “finansal tabloların hazırlanması ve gerçeğe uygun bir biçimde sunumuna” veya “doğru
        ve gerçeğe uygun bir görünüm sağlayan finansal tabloların hazırlanmasına” ilişkin sorumluluğa atıf yapılır (par. 36).
  kaynaklar:
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 35
    alinti: denetçi raporunun bu bölümünde ayrıca finansal raporlama sürecinin gözetiminden sorumlu olanlar belirtilir
  - mevzuat: BDS 700 Finansal Tablolara İlişkin Görüş Oluşturma ve Raporlama
    madde: par. 33
    alinti: ancak mevzuata uygun bir terimin kullanılması gerekir
