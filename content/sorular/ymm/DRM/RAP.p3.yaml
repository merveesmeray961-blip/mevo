- id: YMM-DRM-RAP-0053
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: uygulama
  zorluk: 3
  kok: Bir denetçi, borsada işlem görmeyen bir işletmenin denetiminde, denetimin büyük ölçüde tamamlandığı bir aşamada yönetimin
    getirdiği kapsam sınırlaması sebebiyle yeterli ve uygun kanıt elde edememiş ve sınırlamanın olası etkilerinin önemli ve
    yaygın olduğu sonucuna varmıştır. BDS 705’e göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Denetçi, mevzuatla aksi öngörülmedikçe raporunda BDS 701 uyarınca Kilit Denetim Konuları bölümüne veya BDS 720 uyarınca
      Diğer Bilgiler bölümüne yer vermez.
    B: TTK uyarınca yapılan bağımsız denetimlerde görüş vermekten kaçınan denetçi, yönetim kurulunun yıllık faaliyet raporuna
      ilişkin de görüş vermekten kaçınır.
    C: Denetim büyük ölçüde tamamlanmış olsa dahi denetçi denetimden çekilmek zorundadır; denetimi tamamlayıp görüş vermekten
      kaçınmaya ve sebebi raporda açıklamaya karar veremez.
    D: Mevzuatın denetçinin denetime devam etmesini gerektirdiği bazı özel durumlarda, örneğin kamu sektörü işletmelerinde
      atanmış denetçiler için, denetimden çekilmek mümkün olmayabilir.
    E: Görüş vermekten kaçınılan raporda kilit denetim konularının ayrıca yer alması, bir bütün olarak finansal tablolar hakkında
      verilen görüş açısından tutarsızlık oluşturur.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 705 A13’e göre denetimin büyük ölçüde tamamlandığı durumlarda denetçi, denetimden çekilmeden önce mümkün
      olduğu ölçüde denetimi tamamlamaya, görüş vermekten kaçınmaya ve kapsam sınırlamasını Görüş Vermekten Kaçınmanın Dayanağı
      bölümünde açıklamaya karar verebilir. Dolayısıyla çekilme zorunluluğunu ileri süren ifade yanlıştır. Püf noktaları:
      (1) Yanlış ifade “çekilme zorunluluğu”nu ileri sürendir; denetim büyük ölçüde tamamlanmışsa denetçi tamamlayıp görüş
      vermekten kaçınmaya karar verebilir (A13), çekilme ise mevzuat izin verdiğinde ve uygulanabilir olduğunda söz konusudur
      (par. 13, A14). (2) Görüş vermekten kaçınılan raporda KDK ve Diğer Bilgiler bölümleri yer almaz (par. 29, 29T, A26).'
    celdiriciler:
      A: Doğru ifadedir; görüş vermekten kaçınan denetçi bu bölümlere yer vermez (par. 29).
      B: Doğru ifadedir (par. 29T).
      D: Doğru ifadedir (A14).
      E: Doğru ifadedir (A26).
  kaynaklar:
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
    madde: par. A13
    alinti: denetimden çekilmeden önce, mümkün olduğu ölçüde denetimi tamamlamaya, görüş vermekten kaçınmaya
  - mevzuat: BDS 705 Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi
