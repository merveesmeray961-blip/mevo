- id: YMM-DRM-RAP-0046
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 3
  kok: Borsada işlem gören Kuzey Metal A.Ş.’nin denetiminde denetçi iki husus belirlemiştir. Birincisi, yönetimin kapsam sınırlaması
    nedeniyle yeterli ve uygun kanıt elde edilememesi sonucu sınırlı olumlu görüş verilmesine sebep olan stok sayımıdır. İkincisi,
    denetimde en çok önem arz eden konular arasından seçilen ve kilit denetim konusu olarak belirlenen yatırım amaçlı gayrimenkul
    değerlemesidir. BDS 701’e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Stok konusu da kilit denetim konusu niteliğinde olduğundan, sınırlı olumlu görüşün dayanağına ek olarak Kilit Denetim
      Konuları bölümünde ayrıntılı biçimde açıklanır.
    B: Gayrimenkul değerlemesine ilişkin açıklama yalnızca denetimde konunun nasıl ele alındığını içerir; konunun kilit denetim
      konusu olarak belirlenme sebebini açıklamak gerekmez.
    C: Gayrimenkul değerlemesine ilişkin açıklama finansal tablolardaki ilgili açıklamaya atıf içermemelidir; çünkü konu denetçi
      raporunda tamamen bağımsız ve kendi içinde bütün olarak anlatılır.
    D: Sınırlı olumlu görüş verildiği için gayrimenkul değerlemesi de kilit denetim konusu olarak bildirilemez ve denetçi
      Kilit Denetim Konuları bölümünü raporundan çıkarır.
    E: Stok konusu bu bölümde bildirilmez; gayrimenkul değerlemesine ilişkin açıklama ise konunun kilit denetim konusu olarak
      belirlenme sebebini ve denetimde nasıl ele alındığını içerir.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 701 par. 12’ye göre BDS 705 uyarınca olumlu görüş dışında görüş vermesine sebep olan konuyu denetçi
      Kilit Denetim Konuları bölümünde bildirmez; stok sayımı bu nedenle bölüm dışında kalır. Bildirilen her kilit denetim
      konusuna ilişkin açıklama ise, varsa finansal tablolardaki ilgili açıklamaya atıf ile konunun kilit denetim konusu olarak
      belirlenme sebebini ve denetimde nasıl ele alındığını içerir (par. 13). Püf noktaları: (1) Olumlu görüş dışında görüşe
      sebep olan konu, niteliği itibarıyla kilit denetim konusu olsa da Kilit Denetim Konuları bölümünde bildirilmez; diğer
      konular bildirilmeye devam eder (par. 12). (2) Bildirilen her konu için hem belirlenme sebebi hem de denetimde ele alınış
      biçimi yazılır (par. 13).'
    celdiriciler:
      A: Olumlu görüş dışında bir görüşün verilmesine sebep olan konu Kilit Denetim Konuları bölümünde bildirilmez (par. 12).
      B: Açıklama hem belirlenme sebebini hem de denetimde konunun nasıl ele alındığını içermelidir (par. 13).
      C: Açıklama, varsa, finansal tablolardaki ilgili açıklamaya (açıklamalara) atıf içerir (par. 13).
      D: Sınırlı olumlu görüş verilmesi tek başına diğer konuların kilit denetim konusu olarak bildirilmesine engel değildir;
        yalnızca görüşe sebep olan konu bölümde bildirilmez.
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 12
    alinti: bu görüşün verilmesine sebep olan konuyu raporunun Kilit Denetim Konuları bölümünde bildirmez
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 13
    alinti: Konunun denetimde en çok önem arz eden konu olarak değerlendirilmesinin yani kilit denetim konusu olarak belirlenmesinin
      sebebi
