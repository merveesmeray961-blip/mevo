- id: YMM-DRM-RAP-0068
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 706 dikkat çekme ve diğer hususlar
  tip: kavrama
  zorluk: 2
  kok: 'BDS 706’ya göre Dikkat Çekilen Hususlar ve Diğer Hususlar paragraflarının denetçi raporundaki yerine ilişkin aşağıdaki
    öncüllerden hangileri doğrudur?


    I. Dikkat Çekilen Hususlar paragrafı geçerli finansal raporlama çerçevesiyle ilgiliyse denetçi, verdiği görüşün oluşmasını
    sağlayan bağlamı iletmek amacıyla bu paragrafa Görüşün Dayanağı bölümünün hemen ardından yer vermeyi gerekli görebilir.

    II. Kullanıcıların dikkatini raporda ele alınan Diğer Raporlama Sorumluluklarıyla ilgili bir hususa çekmek amacıyla eklenen
    Diğer Hususlar paragrafı, “Mevzuattan Kaynaklanan Diğer Yükümlülükler” bölümüne dâhil edilebilir.

    III. Diğer Hususlar paragrafı denetçinin tüm sorumluluklarıyla ilgili olduğunda, her durumda Finansal Tabloların Bağımsız
    Denetimi bölümünden önce yer almak zorundadır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: I ve II
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: 'I ve II doğrudur. A16’ya göre paragrafların raporda bulunacağı yer, aktarılacak bilginin niteliğine ve diğer
      unsurlara kıyasla nispi önemine ilişkin denetçi yargısına bağlıdır: çerçeveyle ilgili Dikkat Çekilen Hususlar paragrafı
      Görüşün Dayanağı bölümünün hemen ardından yer alabilir (I); diğer raporlama sorumluluklarıyla ilgili Diğer Hususlar
      paragrafı Mevzuattan Kaynaklanan Diğer Yükümlülükler bölümüne dâhil edilebilir (II). III yanlıştır; denetçinin tüm sorumluluklarıyla
      ilgili Diğer Hususlar paragrafı, Finansal Tabloların Bağımsız Denetimi ve Mevzuattan Kaynaklanan Diğer Yükümlülükler
      bölümlerinin ardından ayrı bir bölüm olarak eklenebilir.'
    celdiriciler:
      A: II de doğrudur; Diğer Hususlar paragrafı Mevzuattan Kaynaklanan Diğer Yükümlülükler bölümüne dâhil edilebilir.
      B: I de doğrudur; çerçeveyle ilgili Dikkat Çekilen Hususlar paragrafı Görüşün Dayanağı bölümünün hemen ardından yer
        alabilir.
      C: III yanlıştır; paragrafın yeri ‘her durumda’ sabit olmayıp bu durumda ayrı bir bölüm olarak bölümlerin ardından eklenebilir.
      E: III yanlıştır ve I de doğrudur.
  kaynaklar:
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar Paragrafları
    madde: par. A16
    alinti: bu paragrafa Görüşün Dayanağı bölümünün hemen ardından yer vermeyi gerekli görebilir
  - mevzuat: BDS 706 Bağımsız Denetçi Raporunda Yer Alan Dikkat Çekilen Hususlar ve Diğer Hususlar Paragrafları
