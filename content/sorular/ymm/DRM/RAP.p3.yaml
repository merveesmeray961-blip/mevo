- id: YMM-DRM-RAP-0058
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 705 olumlu dışı görüş
  tip: kavrama
  zorluk: 3
  kok: 'Denetçi, Ege Metal A.Ş. ile bağımsız denetim sözleşmesini kabul ettikten sonra, yönetimin yurt dışındaki bağlı ortaklığın
    kayıtlarına erişimi engelleyerek denetimin kapsamını sınırladığını ve bunun sınırlı olumlu görüş verilmesine veya görüş
    vermekten kaçınılmasına yol açacağını fark etmiş, yönetimden sınırlamanın kaldırılmasını talep etmiştir. Yönetim sınırlamayı
    kaldırmayı reddetmiştir. Üst yönetimden sorumlu olanların tamamı işletme yönetiminde icrai nitelikte görev üstlenmemektedir.


    BDS 705 ve BDS 706’ya göre denetçinin bundan sonra izleyeceği yola ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?'
  secenekler:
    A: Üst yönetimden sorumlu olanların tamamı icrai görev üstlenmediğinden denetçi, konuyu bu kişilere iletmeden, kanıt için
      alternatif prosedürlerin uygulanıp uygulanamayacağına doğrudan karar verir.
    B: Denetçi, konuyu üst yönetimden sorumlu olanlara iletir; ardından yeterli ve uygun denetim kanıtı elde etmek için alternatif
      prosedürleri uygulamanın mümkün olup olmadığına karar verir.
    C: Muhtemel etkiler önemli ve yaygın olabilecekse ve mevzuat izin verip çekilme uygulanabiliyorsa denetçi çekilir; çekilmeden
      önce görüş dışına yol açan hususları üst yönetimden sorumlu olanlara iletir.
    D: Muhtemel etkiler önemli ve yaygın olabilecekse ve rapor düzenlenmeden önce denetimden çekilmek mümkün veya uygulanabilir
      değilse denetçi, finansal tablolara ilişkin görüş vermekten kaçınır.
    E: Yaygın etkiye rağmen çekilme imkânı bulunmayan ender durumlarda denetçi, çekilmemesinin neden mümkün olmadığını açıklamak
      üzere raporuna Diğer Hususlar paragrafı eklemeyi gerekli görebilir.
  dogru: A
  aciklama:
    dogru_neden: 'Par. 12’ye göre yönetim sınırlamayı kaldırmayı reddettiğinde denetçi (üst yönetimden sorumlu olanların tamamı
      icrai görev üstlenmiyorsa) konuyu üst yönetimden sorumlu olanlara iletir ve ardından alternatif prosedürlerin mümkün
      olup olmadığına karar verir; iletmeden alternatif prosedüre geçmek bu sıralamaya aykırıdır. Par. 13 ve 14 çekilme/görüş
      vermekten kaçınma sonuçlarını, BDS 706 A10 ise çekilmenin mümkün olmadığı ender durumda Diğer Hususlar paragrafını düzenler.
      Püf noktaları: Sıralama talep (par. 11), iletim ve alternatif prosedür (par. 12), sonuç (par. 13-14) şeklindedir; çekilme
      ancak mevzuat izin veriyor ve uygulanabiliyorsa mümkündür, aksi hâlde görüş vermekten kaçınılır; çekilme imkânı olmayan
      ender durumda BDS 706 A10 gereği Diğer Hususlar paragrafı gündeme gelir.'
    celdiriciler:
      B: Par. 12’ye göre denetçi önce konuyu üst yönetimden sorumlu olanlara iletir, ardından alternatif prosedürlerin mümkün
        olup olmadığına karar verir; ifade doğrudur.
      C: Par. 13(b)(i) ve par. 14 bunu aynen öngörür; ifade doğrudur.
      D: Par. 13(b)(ii)’ye göre çekilmenin mümkün olmadığı durumda denetçi görüş vermekten kaçınır; ifade doğrudur.
      E: BDS 705 A14 ve BDS 706 A10 bunu öngörür; ifade doğrudur.
  kaynaklar:
