- id: YMM-DRM-RAP-0050
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 3
  kok: Denetçi, borsada işlem gören Doğu Enerji A.Ş.’nin denetiminde, henüz kamuya duyurulmamış ve devam eden bir şirket birleşmesi
    müzakeresine ilişkin değerleme konusunu kilit denetim konusu olarak belirlemiştir. Mevzuat bu konunun kamuya açıklanmasını
    yasaklamamaktadır. Denetçi, konunun raporda bildirilmesinin müzakereyi bozarak işletmeye ağır zarar vereceğini ve bu olumsuz
    sonucun açıklamanın doğuracağı kamu yararını aşacağının makul şekilde beklendiğini düşünmektedir. İşletme konu hakkında
    kamuya hiçbir bilgi açıklamamıştır. BDS 701’e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Mevzuat konunun açıklanmasını yasaklamadığı sürece denetçi her kilit denetim konusunu raporunda açıklamak zorundadır;
      olumsuz sonuçlar ve kamu yararı karşılaştırması hiçbir koşulda dikkate alınmaz.
    B: Denetçi, olumsuz sonuçların kamu yararını aşıp aşmadığına bakılmaksızın, işletmenin talebi üzerine konuyu raporunda
      bildirmeyebilir ve bu talebi gerekçesiz kabul eder; ayrıca açıklama yapmaz.
    C: Denetçi, bu istisnai durumda konuyu raporunda bildirmeyebilir ancak belirlediği kilit denetim konusunu üst yönetimden
      sorumlu olanlara bildirir; işletme kamuya bilgi açıklasaydı bu hüküm uygulanmazdı.
    D: Denetçi konuyu raporunda bildirmemeye karar verirse konuyu üst yönetimden sorumlu olanlara da bildirmek zorunda değildir;
      çünkü bu bildirim yalnızca raporda yer alan konular için yapılır.
    E: Bildirmeme istisnası yalnızca mevzuatın açıklamaya izin vermediği durumlarda geçerlidir; olumsuz sonuçlar nedeniyle
      bildirmeme kararı hiçbir hâlde verilemez ve kamu yararı değerlendirilmez.
  dogru: C
  aciklama:
    dogru_neden: 'BDS 701 par. 14’e göre denetçi, mevzuatın açıklamaya izin vermemesi veya açıklamanın olumsuz sonuçlarının
      kamu yararını aşacağının makul şekilde beklendiği oldukça istisnai durumlar hariç her kilit denetim konusunu raporunda
      açıklar. Burada ikinci istisna oluşmuştur; ancak işletme konu hakkında kamuya bilgi açıklasaydı bu hüküm uygulanmazdı.
      Par. 17’ye göre denetçi, kilit denetim konusu olarak belirlediği hususları üst yönetimden sorumlu olanlara bildirir.
      Püf noktaları: (1) Bildirmeme istisnası iki dayanağa sahiptir ve ikincisi “oldukça istisnai” olup kamu yararıyla karşılaştırmaya
      dayanır; işletme kamuya bilgi açıkladıysa uygulanmaz (par. 14). (2) Raporda bildirilmeyen konu da kilit denetim konusu
      olarak belirlenmişse üst yönetimden sorumlu olanlara bildirilir (par. 17).'
    celdiriciler:
      A: Açıklamanın olumsuz sonuçlarının kamu yararını aşacağının makul şekilde beklendiği oldukça istisnai durumlarda denetçi
        konuyu bildirmemeye karar verebilir (par. 14).
      B: Bildirmeme kararının dayanağı işletmenin talebi değildir; yalnızca mevzuatın açıklamaya izin vermemesi veya olumsuz
        sonuçların kamu yararını aşacağının makul beklenmesi bu sonucu doğurur.
      D: Denetçi, kilit denetim konusu olarak belirlediği hususları üst yönetimden sorumlu olanlara bildirir; raporda bildirilmemesi
        bu bildirimi ortadan kaldırmaz (par. 17).
      E: 'İstisna iki durumu kapsar: mevzuatın açıklamaya izin vermemesi ve olumsuz sonuçların kamu yararını aşacağının makul
        beklendiği oldukça istisnai durumlar (par. 14).'
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 14
    alinti: Mevzuatın konunun kamuya açıklanmasına izin vermemesi
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 14
    alinti: oldukça istisnai durumlarda, denetçinin ilgili hususun denetçi raporunda bildirilmemesine karar vermesi
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 14
    alinti: İşletmenin konu hakkında kamuya bilgi açıklaması hâlinde, bu hüküm uygulanmaz.
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 17
    alinti: üst yönetimden sorumlu olanlara bildirir
