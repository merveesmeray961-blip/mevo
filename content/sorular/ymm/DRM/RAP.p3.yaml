- id: YMM-DRM-RAP-0055
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: Denetim ve tasdik raporlaması
  konu: RAP
  kazanim: BDS 701 kilit denetim konuları
  tip: uygulama
  zorluk: 3
  kok: Borsada işlem gören Batı Lojistik A.Ş.’nin denetiminde denetçi, BDS 570 uyarınca işletmenin sürekliliğini devam ettirme
    kabiliyetine ilişkin ciddi şüphe oluşturabilecek olay ve şartlarla ilgili önemli bir belirsizliğin mevcut olduğu, ancak
    bunun finansal tablolarda yeterince açıklandığı sonucuna varmış, olumlu görüş vermiş ve raporunda “İşletmenin Sürekliliğiyle
    İlgili Önemli Belirsizlik” bölümüne yer vermiştir. Denetçi, bunun dışında bildirilecek başka bir kilit denetim konusu
    bulunmadığına karar vermiştir. BDS 701’e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Sürekliliğe ilişkin önemli belirsizlik kilit denetim konusu olduğundan, belirlenme sebebi ve denetimde nasıl ele alındığıyla
      birlikte Kilit Denetim Konuları bölümünde ayrıntılı açıklanır.
    B: Bildirilecek kilit denetim konusu bulunmadığından Kilit Denetim Konuları bölümü raporda hiç yer almaz ve bu durumun
      üst yönetimden sorumlu olanlara bildirilmesi gerekmez.
    C: Denetçi, bildirilecek kilit denetim konusu bulunmadığına ilişkin kararını Kuruma bildirir; üst yönetimden sorumlu olanlara
      ayrıca bildirim yapması gerekmez ve rapora açıklama eklemez.
    D: Denetçi, Kilit Denetim Konuları başlığı altında bu durumun etkisine yönelik açıklamaya ve sürekliliğe ilişkin bölüme
      atfa yer verir; kararını üst yönetimden sorumlu olanlara da bildirir.
    E: Kilit Denetim Konuları bölümünde yalnızca bildirilecek konu bulunmadığı belirtilir; sürekliliğe ilişkin bölüme atıf
      yapılmaz ve ayrıca açıklama gerekmez.
  dogru: D
  aciklama:
    dogru_neden: 'BDS 701 par. 15’e göre sürekliliğe ilişkin önemli belirsizlik nitelikleri itibarıyla kilit denetim konusu
      olmakla birlikte Kilit Denetim Konuları bölümünde açıklanmaz; denetçi bu konuyu geçerli BDS’ye uygun raporlar ve bölümde
      ilgili bölüme atıf yapar. Bildirilecek başka kilit denetim konusu yoksa denetçi, bu durumun etkisine yönelik bir açıklamaya
      yer verir (par. 16) ve bu kararını üst yönetimden sorumlu olanlara bildirir (par. 17). Püf noktaları: (1) Sürekliliğe
      ilişkin önemli belirsizlik nitelik itibarıyla kilit denetim konusudur ama bu bölümde açıklanmaz; yalnızca ilgili bölüme
      atıf yapılır (par. 15). (2) Bildirilecek başka kilit denetim konusu yoksa bölüm kaldırılmaz; etkiye yönelik açıklama
      yapılır (par. 16) ve karar üst yönetimden sorumlu olanlara bildirilir (par. 17).'
    celdiriciler:
      A: Sürekliliğe ilişkin önemli belirsizlik nitelikleri itibarıyla kilit denetim konusudur; ancak bu bölümde açıklanmaz
        ve 13-14 üncü paragraflar uygulanmaz (par. 15).
      B: Bu durumda denetçi, bölüm başlığı altında bu durumun etkisine yönelik açıklamaya yer verir (par. 16) ve kararını
        üst yönetimden sorumlu olanlara bildirir (par. 17).
      C: BDS 701 par. 17 bildirimi Kuruma değil, üst yönetimden sorumlu olanlara yapılmasını öngörür.
      E: Denetçi, Kilit Denetim Konuları bölümünde sürekliliğe ilişkin önemli belirsizlik bölümüne atıfta bulunur (par. 15).
  kaynaklar:
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 15
    alinti: Kilit Denetim Konuları bölümünde Sınırlı Olumlu (veya Olumsuz) Görüşün Dayanağı veya İşletmenin Sürekliliğiyle
      İlgili Önemli Belirsizlik bölümüne (bölümlerine) atıfta bulunur
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 16
    alinti: “Kilit Denetim Konuları” başlığı altında bu durumun etkisine yönelik bir açıklamaya yer verir
  - mevzuat: BDS 701 Kilit Denetim Konularının Bağımsız Denetçi Raporunda Bildirilmesi
    madde: par. 17
    alinti: raporunda bildirilecek kilit denetim konusu bulunmadığına ilişkin kararını, üst yönetimden sorumlu olanlara bildirir
