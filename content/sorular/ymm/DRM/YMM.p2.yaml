- id: YMM-DRM-YMM-0030
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tam tasdik
  tip: bilgi
  zorluk: 1
  kok: Hesap dönemi takvim yılı olan Tuna Tekstil A.Ş., 2026 hesap dönemine ait yıllık kurumlar vergisi beyannamesi ve ekli
    mali tablolarının tasdiki (tam tasdik) için bir yeminli mali müşavirle sözleşme yapacaktır. Tasdik Yönetmeliği uyarınca
    bu tasdik sözleşmesinin en geç hangi tarihe kadar düzenlenmesi gerekir?
  secenekler:
    A: 31.12.2025
    B: 15.01.2026
    C: 31.01.2026
    D: 31.03.2026
    E: 31.12.2026
  dogru: C
  aciklama:
    dogru_neden: Tasdik Yönetmeliği md. 10'un son fıkrasına göre md. 7/A-a (yıllık gelir vergisi beyannameleri) ve 7/B-a (yıllık
      kurumlar vergisi beyannameleri ve ekli mali tablolar) kapsamındaki belgelerin tasdikine ilişkin sözleşmeler ilgili vergilendirme
      döneminin ilk ayı içinde düzenlenir. 2026 vergilendirme döneminin ilk ayı Ocak 2026 olduğundan son gün 31.01.2026'dır.
    celdiriciler:
      A: Hesap döneminin başına kadar yapılması gereken, tasdiki zorunlu tutulan kişilerin seçtikleri YMM'yi Birliğe bildirmesidir
        (md. 9); tam tasdik sözleşmesinin süresi dönemin ilk ayıdır.
      B: 15 günlük süre, sözleşme örneğinin sözleşme tarihinden itibaren Bakanlığa gönderilmesine ilişkindir (md. 10/1), sözleşmenin
        düzenlenme süresi değildir.
      D: Yönetmelikte üç aylık süre, sürekli denetimlerde beyan ayından önceki üç ay içinde sözleşmenin feshedilememesine
        ilişkindir; düzenleme süresi bir aydır.
      E: Sözleşme dönem sonuna kadar değil, vergilendirme döneminin ilk ayı içinde düzenlenmelidir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 10 (son fıkra)
    alinti: Bu Yönetmeliğin 7/A-a ve 7/B-a maddelerinde belirtilen belgelerin tasdikine ilişkin sözleşmeler ilgili vergilendirme
      döneminin ilk ayı içinde düzenlenir.
