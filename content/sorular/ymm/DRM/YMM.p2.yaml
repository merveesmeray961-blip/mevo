    B: I, II ve V
    C: II, III ve IV
    D: I, IV ve V
    E: III ve V
  dogru: B
  aciklama:
    dogru_neden: 'KDV GUT (IV/A-5.6) uyarınca artırımlı teminat, nakden iadesi talep edilen tutarın %120''si (İTUS sertifikası
      sahipleri için %60''ı) oranında verilir ve iade beş iş günü içinde yapılır. I: 4.000.000 × %120 = 4.800.000 TL, doğru.
      II: 4.000.000 × %60 = 2.400.000 TL, doğru. V: YMM raporu altı ay içinde verilmezse iade talebi sürenin sonunda ivedilikle
      incelemeye sevk edilir, doğru. Püf noktaları: Genel teminatta baz “sınırı aşan kısım”dır; artırımlı teminatta ise baz,
      nakden iadesi talep edilen tutarın tamamıdır. Eksikliklerin giderilmesi için verilen 30 + 30 günlük süreler, teminatın
      iki ay içinde iadesi süresine sayılmaz.'
    celdiriciler:
      A: I ve II doğrudur; ancak V de doğrudur (altı ay içinde rapor verilmezse ivedilikle incelemeye sevk).
      C: 'III yanlıştır: artırımlı teminat nakden iadesi talep edilen tutar üzerinden hesaplanır. IV yanlıştır: eksiklik için
        verilen süreler iki aylık sürenin hesabında dikkate alınmaz.'
      D: IV yanlıştır; Tebliğ mükellefe verilen bu sürelerin iki aylık sürenin hesabında dikkate alınmayacağını belirtir.
      E: III yanlıştır; ayrıca I ve II doğru olduğu hâlde bu seçenekte yer almamaktadır.
    hesap_adimlari:
    - 'Kuzey: 4.000.000 × 1,20 = 4.800.000 TL'
    - 'Güney (İTUS): 4.000.000 × 0,60 = 2.400.000 TL'
  kaynaklar:
