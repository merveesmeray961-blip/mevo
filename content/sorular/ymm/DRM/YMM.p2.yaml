- id: YMM-DRM-YMM-0031
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tasdik raporlarının süresi ve ibrazı
  tip: bilgi
  zorluk: 1
  kok: VUK mükerrer 227. madde uyarınca yararlanılması yeminli mali müşavir tasdik raporu ibrazı şartına bağlanan bir istisnada,
    tasdik raporunu zamanında ibraz etmeyen mükellefe ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Mükellefe tebliğ edilmek şartıyla 15 günlük bir mühlet verilir; bu sürede de ibraz edilmezse vergi matrahı takdir komisyonunca
      belirlenir.
    B: Mükellefe tebliğ edilmek şartıyla 60 günlük bir mühlet verilir; bu sürede de rapor ibraz edilmezse tasdike konu haktan
      yararlanılamaz.
    C: Tebliğe gerek olmaksızın ibraz süresinin bitiminden itibaren 30 günlük bir mühlet kendiliğinden işlemeye başlar ve
      hak korunur.
    D: Bakanlık, mükellefin her talebinde ibraz süresini iki aya kadar uzatır; uzatılan sürede de ibraz edilmezse hak kaybı
      doğar.
    E: Mühlet verilmez; rapor süresinde ibraz edilmezse mükellef tasdike konu haktan kesin olarak yararlanamaz.
  dogru: B
  aciklama:
    dogru_neden: VUK mükerrer 227. maddenin üçüncü fıkrasına göre tasdik raporunun zamanında ibrazı şarttır; ancak 7338 sayılı
      Kanunla eklenen cümle uyarınca rapor zamanında ibraz edilmezse mükellefe tebliğ edilmek şartıyla 60 günlük mühlet verilir.
      Bu süre içinde de ibraz edilmezse mükellef tasdike konu haktan yararlanamaz.
    celdiriciler:
      A: 15 günden az olmamak üzere verilen mühlet, VUK md. 30'daki takdir sebeplerinden birine ilişkin bilgi verme mühletidir;
        mükerrer 227'deki mühlet 60 gündür.
      C: Mühlet tebliğ şartına bağlıdır ve süresi 60 gündür.
      D: Bakanlığın iki aya kadar uzatma yetkisi genel bir yetkidir (ibraz süresinin uzatılması); mükellefe tebliğle verilen
        60 günlük mühletle karıştırılmamalıdır.
      E: Bu, 7338 sayılı Kanun öncesindeki düzenlemedir; 26.10.2021'den itibaren mükellefe 60 günlük mühlet verilmektedir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. md. 227/3
    alinti: Şu kadar ki, tasdik raporunun zamanında ibraz edilmemesi halinde, mükellefe tebliğ edilmek şartı ile 60 günlük
      bir mühlet verilir. … süre içinde de ibraz edilmemesi halinde mükellefler tasdike konu haktan yararlanamazlar. Ancak,
      Maliye Bakanlığı tasdik raporlarının ibraz süresini iki aya kadar uzatmaya yetkilidir
