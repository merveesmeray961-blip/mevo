- id: YMM-DRM-YMM-0032
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: KDV iade tasdiki
  tip: uygulama
  zorluk: 2
  kok: Kuzey İhracat A.Ş., YMM KDV İadesi Tasdik Raporuyla talep edeceği nakden iadeyi, rapor henüz düzenlenmeden genel esaslara
    göre teminat göstererek almıştır (artırımlı teminat uygulaması söz konusu değildir). İade 10.03.2026 tarihinde yapılmıştır.
    KDV Genel Uygulama Tebliği'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Rapor 10.09.2026'ya kadar verilmez ve ek süre istenmezse iade incelemeye sevk edilir; teminat vergi inceleme raporuna
      göre çözülür.
    B: Rapor 10.06.2026'ya kadar ibraz edilmezse teminat paraya çevrilerek iade edilen tutar gecikme faiziyle birlikte mükelleften
      aranır.
    C: Rapor altı ay içinde ibraz edilmezse teminat, inceleme yapılmaksızın kendiliğinden hazineye irat kaydedilir ve iade
      kesinleşmiş sayılır.
    D: Mazereti haklı görülen mükellefe vergi dairesince VUK md. 17 uyarınca bir yıl ek süre verilebilir; bu sürede de rapor
      verilmezse teminat çözülür.
    E: Teminat, sınırı aşan kısım için değil, nakden iadesi talep edilen tutarın tamamı için verilmiş olmalıdır; rapor süresi
      ise üç aydır.
  dogru: A
  aciklama:
    dogru_neden: KDV GUT (IV/A-4.1) uyarınca YMM raporu ile iade talep edip teminat karşılığı iade alan mükellef, iadenin
      yapıldığı tarihten itibaren altı ay içinde raporu ibraz etmezse teminat vergi inceleme raporu sonucuna göre çözülür.
      Altı ay içinde rapor verilmemesi ve ek süre talep edilmemesi hâlinde teminat karşılığı yapılan iade incelemeye sevk
      edilir. 10.03.2026 + 6 ay = 10.09.2026.
    celdiriciler:
      B: Rapor süresi üç ay değil altı aydır; süresinde rapor verilmemesinin sonucu da incelemeye sevk ve teminatın inceleme
        raporuna göre çözülmesidir.
      C: Teminat kendiliğinden irat kaydedilmez; iade incelemeye sevk edilir ve teminat vergi inceleme raporu sonucuna göre
        çözülür.
      D: Haklı mazeret hâlinde VUK md. 17 uyarınca verilebilecek ek süre bir yıl değil altı aydır.
      E: Genel esaslara göre teminat (IV/A3-3) bölümündeki sınırı aşan kısmın tamamı için verilir; talep edilen tutarın %120'si
        oranında teminat artırımlı teminat uygulamasına özgüdür. Rapor süresi de altı aydır.
    hesap_adimlari:
    - İade tarihi 10.03.2026 + 6 ay = 10.09.2026
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A-4.1
    alinti: YMM raporu ile iade talebinde bulunan mükelleflerin, teminat karşılığı iadenin yapıldığı tarihten itibaren altı
      ay içinde bu iade ile ilgili YMM raporunu ibraz etmemesi halinde, söz konusu teminat vergi inceleme raporu sonucuna
      göre çözülür.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A-4.1
    alinti: 213 sayılı Kanunun 17 nci maddesi uyarınca vergi dairesince altı ay ek süre verilebilir.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A-5.3
    alinti: bölümünde belirlenen sınırı aşan kısmının tamamı için teminat verilir.
