      yaptırılmışsa bu kısmi incelemeden doğan sorumluluk incelemeyi yapan YMM''ye aittir. II: 3568 sayılı Kanun md. 12''ye
      göre sorumluluk raporu yazılabilmesi için YMM''nin yazılı savunması istenir; tebliğden itibaren otuz gün içinde savunma
      yapılmazsa savunma hakkından vazgeçilmiş sayılır. V: Md. 20''ye göre sorumluluğun yerine getirilmesinde Borçlar Kanununun
      “Tam Teselsül” hükümleri uygulanır. Püf noktaları: Mali sorumluluk ile disiplin sorumluluğu “ayrı ayrı müstakil” raporlarla
      tespit edilir. YMM''nin müşterek ve müteselsil sorumluluğu her zaman “tasdikin kapsamı ile sınırlı”dır. Başka ildeki
      meslektaşa yaptırılan kısmi incelemede sorumluluk o meslektaşa geçer.'
    celdiriciler:
      B: I ve V doğrudur; ancak II de 3568 sayılı Kanun md. 12'de aynen düzenlenmiştir.
      C: 'III yanlıştır: md. 12''ye göre mali sorumluluk ile disiplin sorumluluğu ayrı ayrı müstakil bir raporla tespit edilir.
        IV yanlıştır: sorumluluk tasdikin kapsamı ile sınırlıdır.'
      D: III yanlıştır (ayrı ayrı müstakil rapor); ayrıca II doğru olduğu hâlde bu seçenekte yer almamaktadır.
      E: 'IV yanlıştır: YMM, tasdikin kapsamı ile sınırlı olmak üzere ziyaa uğratılan vergilerden ve kesilecek cezalardan
