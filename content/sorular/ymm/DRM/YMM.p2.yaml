  kok: 'YMM Ayşe Demir, İstanbul''daki Delta A.Ş.nin tam tasdik raporunu düzenlemiştir. Raporun hazırlanması sırasında şirketin
    İzmir''deki şubesine ilişkin inceleme ve bilgi toplama işi, İzmir''de bulunan YMM Kemal Ak''a yaptırılmıştır. Sonradan
    yapılan vergi incelemesinde, tasdik kapsamındaki İzmir şubesi işlemlerinden kaynaklanan vergi ziyaı tespit edilmiştir.
    3568 sayılı Kanun md. 12 ve Tasdik Yönetmeliği md. 20''ye göre aşağıdaki ifadeleri değerlendiriniz.

    I. İzmir şubesine ilişkin kısmi incelemeden doğan sorumluluk YMM Kemal Ak''a aittir.

    II. YMM hakkında sorumluluk raporu yazılabilmesi için yazılı savunması istenir; savunma isteme yazısının tebliğinden itibaren
    otuz gün içinde savunma yapılmazsa savunma hakkından vazgeçilmiş sayılır.

    III. YMM''nin tasdikten doğan mali sorumluluğu ile disiplin sorumluluğu tek bir raporla birlikte tespit edilir.

    IV. YMM, tasdik kapsamıyla sınırlı olmaksızın mükellefin o döneme ait tüm vergi borçlarından müteselsilen sorumludur.

    V. Sorumluluğun yerine getirilmesinde Borçlar Kanununun “Tam Teselsül” hükümleri uygulanır.

    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, II ve V
    B: I ve V
    C: II, III ve IV
    D: I, III ve V
