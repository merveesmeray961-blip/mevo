- id: YMM-DRM-YMM-0034
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tasdik sözleşmesi ve bildirim
  tip: uygulama
  zorluk: 2
  kok: Tasdik Yönetmeliği md. 9 uyarınca hesap dönemine ilişkin mali tablolarını ve beyannamelerini tasdik ettirmek zorunda
    olan bir aracı kurum, hesap dönemi takvim yılı olan 2026 dönemi için seçtiği yeminli mali müşaviri 20.01.2026 tarihinde
    Birliğe bildirmiştir. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bildirim süresinde yapılmıştır; sözleşme örneği sözleşme tarihinden itibaren 15 gün içinde Bakanlığa gönderilmelidir.
    B: Bildirim, vergilendirme döneminin ilk ayı içinde yapıldığından geçerlidir ve seçim kesinleşmiştir.
    C: Kurum YMM seçmemiş sayılır ve seçim Hazine ve Maliye Bakanlığınca resen yapılarak kuruma bildirilir.
    D: Tasdik zorunluluğu yalnız bankalar ve sigorta şirketleri için geçerli olduğundan aracı kurum için bildirim şartı yoktur.
    E: Kurum YMM seçmemiş sayılır; seçim Birlik tarafından ilgili Odaya yaptırılır ve ilgililere bildirilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 9'a göre aracı kurumlar hesap dönemlerine ilişkin mali tablolarını ve beyannamelerini tasdik ettirmek
      zorundadır. YMM seçmek zorunda olanlar, tasdiki zorunlu mali tabloların ilgili olduğu hesap döneminin başına (01.01.2026)
      kadar seçtikleri YMM'yi Birliğe bildirmezlerse YMM seçmemiş sayılır; bu durumda seçim Birlik tarafından ilgili Odaya
      yaptırılır ve ilgililere bildirilir.
    celdiriciler:
      A: Birliğe bildirim süresi hesap döneminin başına kadardır; 20.01.2026 tarihli bildirim süresinden sonradır.
      B: Vergilendirme döneminin ilk ayı, tam tasdik sözleşmesinin düzenlenme süresidir (md. 10); zorunlu tasdikte YMM'nin
        Birliğe bildirimi dönem başına kadar yapılmalıdır.
      C: Seçmemiş sayılma sonucu doğrudur; ancak seçimi Bakanlık değil, Birlik ilgili Odaya yaptırır.
      D: Md. 9 bankalar ve sigorta şirketlerinin yanında aracı kurumları da açıkça sayar.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 9
    alinti: Mali tablolarının tasdiki zorunlu tutulan gerçek veya tüzel kişilerin yeminli mali müşaviri herhangi bir nedenle
