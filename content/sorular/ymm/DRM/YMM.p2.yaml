- id: YMM-DRM-YMM-0035
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tasdik raporlarının süresi ve ibrazı
  tip: hesaplama
  zorluk: 3
  kok: 'Aşağıdaki iki mükellef, yararlanılması yeminli mali müşavir tasdik raporu ibrazı şartına bağlanan haklarına ilişkin
    tasdik raporlarını VUK mükerrer 227. maddede öngörülen sürede ibraz etmemiştir:

    • (K) A.Ş.: Yararlanılması rapor ibrazı şartına bağlanan tutar 6.400.000 TL''dir. Rapor, mükellefe tebliğ edilen 60 günlük
    mühletin 40. gününde ibraz edilmiştir.

    • (L) A.Ş.: Yararlanılması rapor ibrazı şartına bağlanan tutar 96.000.000 TL''dir. Rapor, tebliğ edilen 60 günlük mühlet
    içinde de ibraz edilmemiştir.

    VUK md. 353/11 uyarınca ceza oranı %5, 2026 yılı için alt sınır 400.000 TL ve üst sınır 4.000.000 TL olduğuna göre, iki
    mükellef adına kesilecek özel usulsüzlük cezalarının toplamı kaç TL''dir?'
  secenekler:
    A: 4.000.000
    B: 4.320.000
    C: 4.400.000
    D: 5.120.000
    E: 5.200.000
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 353/11''e göre ceza, raporun mükerrer 227. maddenin üçüncü fıkrasının birinci cümlesinde belirtilen
      sürede (zamanında) ibraz edilmemesi durumunda kesilir; 60 günlük mühlet içinde ibraz hak kaybını önler ama cezayı ortadan
      kaldırmaz. (K): 6.400.000 × %5 = 320.000 TL; alt sınırın altında kaldığından 400.000 TL. (L): 96.000.000 × %5 = 4.800.000
      TL; üst sınırı aştığından 4.000.000 TL (L ayrıca tasdike konu haktan yararlanamaz). Toplam: 400.000 + 4.000.000 = 4.400.000
      TL. Püf noktaları: Mühlet içinde ibraz yalnızca hakkı kurtarır; ceza, raporun asıl süresinde verilmemesine bağlanmıştır.
      Her mükellef için %5''lik tutarı ayrı ayrı alt ve üst sınırla karşılaştırmayı unutmayın.'
    celdiriciler:
      A: Mühlet içinde ibraz eden (K) için ceza kesilmeyeceği varsayılmıştır; oysa ceza zamanında ibraz edilmemeye bağlıdır.
      B: (K) için alt sınır uygulanmamış, 320.000 TL esas alınmıştır.
      D: Alt ve üst sınırların hiçbiri uygulanmamıştır (320.000 + 4.800.000).
      E: (L) için üst sınır uygulanmamıştır (400.000 + 4.800.000).
    hesap_adimlari:
    - '(K): 6.400.000 × 0,05 = 320.000 < 400.000 → 400.000'
    - '(L): 96.000.000 × 0,05 = 4.800.000 > 4.000.000 → 4.000.000'
    - 'Toplam: 400.000 + 4.000.000 = 4.400.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 353/11
    alinti: Bu Kanunun mükerrer 227 nci maddesi uyarınca tasdik kapsamına alınan konularda yeminli mali müşavir tasdik raporunun
      aynı maddenin üçüncü fıkrasının birinci cümlesinde belirtilen sürede ibraz edilmemesi durumunda, tasdik raporu ibraz
      şartı getirilen mükellef adına 50.000 (400.000) Türk lirasından az ve 500.000 (4.000.000) Türk lirasından fazla olmamak
      üzere, yararlanılması tasdik raporunun ibrazı şartına bağlanan tutarın %5’i nispetinde özel usulsüzlük cezası kesilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
