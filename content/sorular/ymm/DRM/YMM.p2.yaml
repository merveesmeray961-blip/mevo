  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tasdik sözleşmesi ve bildirim
  tip: uygulama
  zorluk: 2
  kok: Takvim yılı hesap dönemine tabi Mavi Lojistik A.Ş. ile YMM Ahmet Er arasında, 2026 yılını kapsayan ve sürekli denetimi
    içeren tam tasdik sözleşmesi bulunmaktadır. Şirket 2026 yılı kurumlar vergisi beyannamesini Nisan 2027'de verecektir.
    Şirketin mali tablolarının tasdiki mevzuat gereği zorunlu değildir. Tasdik Yönetmeliği md. 10'a göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Sözleşme, yazılı gerekçe gösterilmek şartıyla 20.02.2027 tarihinde feshedilebilir; fesih 15 gün içinde Bakanlığa bildirilir.
    B: Sözleşme 15.11.2026'da feshedilirse şirket bir ay içinde başka bir YMM ile sözleşme yapmak zorundadır.
    C: Sözleşme, beyannamenin verileceği aydan önceki altı ay içinde, yani Kasım 2026'dan itibaren feshedilemez.
    D: Sözleşme 15.11.2026'da yazılı gerekçeyle feshedilebilir; fesih en geç 15 gün içinde Bakanlığa bildirilir.
    E: Sözleşme feshedilirse YMM'nin çalışma notlarını yerine geçecek meslektaşına devretme yükümlülüğü yoktur.
  dogru: D
  aciklama:
    dogru_neden: Md. 10'a göre tasdik sözleşmesi yazılı gerekçe gösterilmek şartıyla taraflarca her zaman feshedilebilir;
      feshedilen sözleşmeler fesih tarihinden itibaren en geç 15 gün içinde Bakanlığa bildirilir. Sürekli denetimlerde fesih
      yasağı yalnızca beyanname ve ekli mali tabloların beyan edileceği aydan önceki üç ay (Ocak, Şubat, Mart 2027) için geçerlidir;
      Kasım 2026 bu dönemin dışındadır.
    celdiriciler:
      A: 20.02.2027, beyan ayı olan Nisan 2027'den önceki üç ay içindedir; sürekli denetimlerde bu dönemde sözleşme feshedilemez.
      B: Bir ay içinde yeni YMM ile sözleşme yapma zorunluluğu yalnızca yıllık mali tablolarının tasdiki zorunlu tutulan işletmeler
        içindir; şirket bu kapsamda değildir.
      C: Fesih yasağı altı ay değil, beyan ayından önceki üç aydır.
      E: Md. 10'a göre fesih hâlinde YMM, çalışma notlarını ve gerekli tüm bilgileri yerine geçecek YMM'ye devretmek zorundadır.
    hesap_adimlari:
    - 'Beyan ayı: Nisan 2027 → fesih yasağı: Ocak-Şubat-Mart 2027'
    - 15.11.2026 yasak dönem dışında; 20.02.2027 yasak dönem içinde
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 10
    alinti: Tasdik sözleşmesi, yazılı gerekçe göstermek şartıyla taraflarca her zaman feshedilebilir. Feshedilen sözleşmeler,
      fesih tarihinden itibaren en geç 15 gün içinde Bakanlığa bildirilir. Sürekli denetimlerde yıllık beyannamelerin ve buna
      ekli mali tabloların beyan edileceği aydan önceki üç ay içinde tasdik sözleşmesi feshedilemez.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 10
    alinti: Yıllık mali tablolarının tasdiki zorunlu tutulan işletmelerin, tasdik sözleşmesinin feshi halinde; bu işletmeler
