  tip: uygulama
  zorluk: 3
  kok: 'İTUS sertifikası bulunmayan Kuzey A.Ş. ile İTUS sertifikası sahibi Güney A.Ş., Tebliğin (IV/A3-3) bölümünde belirlenen
    sınırı aşan ve işlem türü itibarıyla YMM KDV İadesi Tasdik Raporuyla talep edilecek 4.000.000''er TL tutarındaki nakden
    iade taleplerinde artırımlı teminat uygulamasından yararlanmak istemektedir. Her iki şirket de (IV/A2) bölümündeki usul
    ve esaslara tabi değildir ve YMM raporu dışındaki tüm belgeleri tamamlamıştır. KDV Genel Uygulama Tebliği''ne göre aşağıdaki
    ifadeleri değerlendiriniz.

    I. Kuzey A.Ş. 4.800.000 TL tutarında banka teminat mektubu verirse iade beş iş günü içinde gerçekleştirilir.

    II. Güney A.Ş.nin vermesi gereken teminat tutarı 2.400.000 TL''dir.

    III. Artırımlı teminat tutarı, talep edilen iadenin (IV/A3-3) bölümündeki sınırı aşan kısmı esas alınarak hesaplanır.

    IV. YMM raporu ibraz edildikten sonra yapılan kontrollerde eksiklik bulunursa mükellefe verilen 30''ar günlük süreler,
    teminatın iadesine ilişkin iki aylık sürenin hesabına dâhil edilir.

    V. YMM raporu iadenin yapıldığı tarihten itibaren altı ay içinde verilmezse iade talebi sürenin sonunda ivedilikle incelemeye
    sevk edilir.

    Yukarıdaki ifadelerden hangileri doğrudur?'
