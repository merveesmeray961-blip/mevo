      savunmasını temin edecek şekilde yapılan denetim çalışmalarının tüm safhalarını ve sorumluluk safhalarını göstermelidir.
      Püf noktaları: mülkiyet işletmede değil YMM’dedir; çalışma kâğıdı yalnız sonuç değil, kullanılan yöntem, test ve sembollerin
      anlamını da göstermeli, başlıkta hazırlayan YMM’nin ad-paraf ve hazırlama tarihi bulunmalıdır; savunma işlevi için süreç
      bütünüyle izlenebilir olmalıdır.'
    celdiriciler:
      A: Md. 17 çalışma kâğıtlarının mülkiyetini yeminli mali müşavire verir; saklama ve ibraz yükümlülüğü de ona aittir.
      B: Md. 17/a başlıkta denetlenen müşteri, dönem, çalışma kağıdının konusu, hazırlayan yeminli mali müşavirin ad ve paraflarının
        ve hazırlama tarihinin bulunmasını ister.
      C: Md. 17 çalışma kağıtlarının denetleme yöntem ve tekniklerini, uygulanan testleri ve puantaj işaretleri ile sembollerin
        anlamlarını açıkça göstermesini ister; bunlar ayrı dosyaya bırakılmaz.
      E: Mülkiyet tasdiki isteyen mercie değil, yeminli mali müşavire aittir (md. 17); kâğıtlar mercie teslim edilmez, yetkili
        mercilere istenildiğinde ibraz edilir.
