    yapmıştır:


    (1) Kayıtlarda yer alan hususları, ilgili üçüncü şahıslar nezdindeki defter ve belgeler üzerinde araştırarak tespit etmiştir.

    (2) Muhasebe kayıtları ve belgeler konusunda gerekli açıklığın bulunmadığı bir işlemle ilgili olarak ilgililerden bilgi
    almış ve alınan bilgileri tutanakla tespit etmiştir.

    (3) Toptan aktarmaların kontrolünü yapmış, kayıt ve belge üzerindeki aritmetik işlemlerin doğruluğunu araştırmıştır.

    (4) Cari yıl hesaplarını, önceki yıl sonuçları ve sektör ortalamasıyla oran ve trend analizi yaparak karşılaştırmıştır.


    Bu işlemlerin Tasdik Yönetmeliği’nde sayılan denetim teknikleri bakımından sırasıyla adlandırılması aşağıdakilerden hangisidir?'
  secenekler:
    A: Belge incelemesi – Bilgi toplama – Karşılaştırma ve puantaj – Analitik inceleme
    B: Doğrulama – Belge incelemesi – Analitik inceleme – Karşılaştırma ve puantaj
    C: Belge incelemesi – Doğrulama – Analitik inceleme – Karşılaştırma ve puantaj
    D: Doğrulama – Bilgi toplama – Analitik inceleme – Karşılaştırma ve puantaj
    E: Doğrulama – Bilgi toplama – Karşılaştırma ve puantaj – Analitik inceleme
  dogru: E
  aciklama:
    dogru_neden: 'Md. 15’e göre (1) kayıtlarda yer alan hususların ilgili üçüncü şahıslar nezdindeki defter ve belgeler üzerinde
      araştırılarak tespit yapılması doğrulama; (2) kayıtlar ve belgeler konusunda açıklığın olmadığı hallerde ilgililerden
      bilgi alınması ve bilgilerin tutanakla tespiti bilgi toplama; (3) toptan aktarmaların kontrolü ile kayıt ve belge üzerindeki
      aritmetik işlemlerin doğruluğunun araştırılması karşılaştırma ve puantaj; (4) cari yıl hesaplarının önceki yıl, bütçe
      veya sektör ortalamasıyla oran ve trend analizi gibi yöntemlerle karşılaştırılması analitik incelemedir. Püf noktaları:
      üçüncü şahıs defterlerine gidilmesi doğrulamanın, tutanakla bilgi tespiti bilgi toplamanın ayırt edici unsurudur; aritmetik
      işlem kontrolü belge incelemesi değil karşılaştırma ve puantajın tanımındadır; oran ve trend analizi analitik incelemeyi
      belirler.'
    celdiriciler:
      A: (1) belge incelemesi değil doğrulamadır; belge incelemesi, kayıtların belgelere dayandırıldığının ve belgelerin gerçeği
        yansıtıp yansıtmadığının araştırılmasıdır.
      B: (2) belge incelemesi değil bilgi toplamadır; ayrıca (3) karşılaştırma ve puantaj, (4) ise analitik incelemedir. Son
        iki teknik yer değiştirmiştir.
      C: (1) belge incelemesi değil, üçüncü şahıs nezdindeki araştırma niteliğinde doğrulamadır; (2) bilgi toplama, (3) karşılaştırma
        ve puantaj, (4) analitik incelemedir.
      D: (3) ile (4) yer değiştirmiştir; toptan aktarma ve aritmetik kontrol karşılaştırma ve puantaj, oran ve trend analizi
        ise analitik incelemedir.
