      tasdiki ihtiva etmeyen raporlarda “ilgili mevzuata uygundur” ibaresi kullanılmaz, onun yerine ilgili mevzuat hükümleri
      açıkça yazılır; bu ibare ancak tasdiki ihtiva eden YMM raporlarında kullanılabilir. Tasdik Yönetmeliği md. 19’a göre
      YMM ayrıca, bir bütün olarak ele alınan mali tabloların gerçeğe uygunluğu ve doğruluğu hakkındaki kanaatini ve beyanların
