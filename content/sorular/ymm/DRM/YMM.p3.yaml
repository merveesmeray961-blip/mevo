- id: YMM-DRM-YMM-0040
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tasdik sözleşmesi ve bildirim
  tip: uygulama
  zorluk: 3
  kok: 'Yeminli mali müşavirlerin yaptığı denetim ve tasdik sözleşmelerine ilişkin aşağıdaki öncüllerden hangileri doğrudur?


    I. Çalışma Usul ve Esasları Yönetmeliği’ne göre sözleşmenin yapıldığı tarih ile sözleşmede yer alan ve Birlikçe lüzum
    görülen hususlar, bağlı olunan odalara bilgi formu ile bir ay içinde bildirilir.

    II. Tasdik Yönetmeliği’ne göre tasdik sözleşmesinin bir örneği, sözleşme tarihinden itibaren bir ay içinde yeminli mali
    müşavirce Bakanlığa gönderilir.

    III. Çalışma Usul ve Esasları Yönetmeliği’ne göre denetimin tasdik işlemine bağlı olup olmadığı denetime başlamadan önce
    tespit edilir ve sözleşmede açık olarak belirtilir.

    IV. Tasdik Yönetmeliği’ne göre yıllık gelir vergisi ve kurumlar vergisi beyannameleri ile ekli mali tabloların tasdikine
    ilişkin sözleşmeler, ilgili vergilendirme döneminin son ayı içinde düzenlenir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve IV
    D: I ve III
    E: III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Çalışma Usul ve Esasları Yönetmeliği md. 51’e göre sözleşmenin yapıldığı tarih ile Birlikçe lüzum görülen
      hususlar odalara bilgi formu ile bir ay içinde bildirilir (I doğru) ve denetimin tasdik işlemine bağlı olup olmadığı
      denetime başlamadan önce tespit edilerek sözleşmede açıkça belirtilir (III doğru). Tasdik Yönetmeliği md. 10’a göre
      sözleşme örneği Bakanlığa sözleşme tarihinden itibaren 15 gün içinde gönderilir; bir ay değildir (II yanlış). Aynı maddeye
      göre yıllık gelir ve kurumlar vergisi beyannameleri ile ekli mali tabloların tasdikine ilişkin sözleşmeler ilgili vergilendirme
      döneminin son ayında değil, ilk ayı içinde düzenlenir (IV yanlış). Püf noktaları: bir ay süresi odaya yapılan bilgi
      formu bildirimine, 15 gün süresi Bakanlığa gönderilen sözleşme örneğine aittir; iki bildirim farklı yönetmeliklerden
      ve farklı muhataplara yöneliktir. Sözleşmenin düzenlenme zamanı (vergilendirme döneminin ilk ayı) ise bu bildirim sürelerinden
      ayrı bir kuraldır.'
    celdiriciler:
      A: III de doğru olduğundan yalnız I demek eksiktir.
      B: II yanlıştır; Bakanlığa gönderme süresi bir ay değil, 15 gündür.
      C: II ve IV yanlıştır; ikisi de doğru öncül değildir (IV’te sözleşmeler dönemin son ayında değil, ilk ayı içinde düzenlenir).
      E: IV yanlıştır; ilgili sözleşmeler vergilendirme döneminin son ayı değil, ilk ayı içinde düzenlenir. I de doğru olduğundan
        birleşim eksik ve hatalıdır.
  kaynaklar:
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 51
    alinti: bağlı oldukları odalara bilgi formu ile bir ay içinde bildirilir.
  - mevzuat: Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik
    madde: md. 51
    alinti: Yeminli mali müşavirlerce sözleşmelerde denetimin tasdik işlemine bağlı olup olmadığı denetime başlamadan önce
      tespit edilir ve her husus sözleşmede açık olarak belirtilir.
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 10
    alinti: sözleşme tarihinden itibaren 15 gün içinde bir örneğinin yeminli mali müşavirlerce Bakanlığa gönderilmesi zorunludur
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 10
    alinti: döneminin ilk ayı içinde düzenlenir
