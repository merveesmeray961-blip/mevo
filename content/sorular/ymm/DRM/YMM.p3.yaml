  kok: Yeminli mali müşavir Hakan Demir, tasdikten doğan sorumluluğunun ileride sorgulanması ihtimaline karşı tam tasdik çalışmasının
    çalışma kâğıtlarını düzenlemektedir. Tasdik Yönetmeliği ile Çalışma Usul ve Esasları Yönetmeliği’ne göre çalışma kâğıtlarına
    ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Çalışma kâğıtlarının mülkiyeti denetlenen işletmeye aittir; bunlar düzenlenmelerini izleyen yıldan itibaren 10 yıl
      süreyle işletmece saklanır ve mercilere ibraz edilir.
    B: Çalışma kâğıdının başlığında denetlenen müşteri, denetim dönemi, kâğıdın konusu ve hazırlama tarihi yer alır; hazırlayan
      yeminli mali müşavirin ad ve parafı başlıkta aranmaz.
    C: Çalışma kâğıtları denetim sonuçlarını göstermelidir; denetleme yöntem ve teknikleri ile puantaj işaretlerinin anlamı
      ise çalışma kâğıdında değil, ayrı bir yazışma dosyasında açıklanır.
    D: Çalışma kâğıtlarının mülkiyeti yeminli mali müşavire aittir; bunlar, ileride savunmasını temin edecek şekilde denetimin
      tüm safhalarını ve sorumluluk safhalarını göstermelidir.
    E: Çalışma kâğıtları ileride savunmayı temin etmek üzere denetim çalışmalarının tüm safhalarını göstermelidir; ancak mülkiyetleri
      tasdiki isteyen mercie ait olup yeminli mali müşavir bunları o mercie teslim eder.
  dogru: D
