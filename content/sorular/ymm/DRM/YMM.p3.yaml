      ışığında denetim ücretini, denetimin kapsamını ve planlamasını tespit ederler (III doğru). Md. 53’e göre denetimin zaman
      sürecini, görevlendirilecek eleman sayısını ve iş bölümünü, denetimde ağırlık verilecek hususları içeren yazılı denetleme
      programı yetkili meslek mensubunca hazırlanır ve çalışma dosyası açılarak denetime başlanır (II doğru). Püf noktaları:
