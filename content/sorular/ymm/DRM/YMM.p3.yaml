- id: YMM-DRM-YMM-0041
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: YMM'nin sorumluluğu (VUK md.227)
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Ece Alkan, Uğur Kimya A.Ş.’nin yıllık kurumlar vergisi beyannamesine ve ekli mali tablolarına
    ilişkin tasdik raporunu düzenlemiş ve tasdikin kapsamını raporunda açıkça belirtmiştir. Sonradan, tasdik kapsamındaki
    gider belgelerinin gerçeği yansıtmadığı ve bu nedenle vergi ziyaına uğratıldığı, işletme yönetiminin hileli davrandığı
    ve Ece Alkan’ın incelemeyi hata ve hileleri ortaya çıkaracak biçimde planlamadığı anlaşılmıştır. Ece Alkan’ın sorumluluğuna
    ilişkin Tasdik Yönetmeliği’ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Hata ve hilelerin ortaya çıkarılması konusundaki temel sorumluluk yalnızca işletme yönetimine ait olduğundan Ece Alkan,
      ziyaa uğratılan vergi ve kesilecek cezalardan sorumlu tutulamaz.
    B: Ece Alkan, yalnızca ziyaa uğratılan vergiden mükellefle birlikte sorumludur; planlama kusuru bulunsa dahi kesilecek
      cezalar bakımından herhangi bir sorumluluğu doğmaz.
    C: Temel sorumluluk kendisine de ait olduğundan Ece Alkan, tasdik kapsamıyla sınırlı olmak üzere ziyaa uğratılan vergi
      ve kesilecek cezalardan mükellefle müteselsilen sorumludur.
    D: Planlama kusuru kapsam sınırını ortadan kaldırdığından Ece Alkan, mükellefin tasdik kapsamı dışında kalan dönemlere
      ilişkin vergi ve cezalardan da mükellefle birlikte sorumlu olur.
    E: Ece Alkan’ın sorumluluğu kusuru oranında belirlenir; mükellefle müteselsil sorumluluk doğmaz, tam teselsül hükümleri
      yalnızca birden fazla YMM bulunduğunda uygulanır.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 16’ya göre hata ve hilelerin önlenmesi veya ortaya çıkarılması konusundaki temel sorumluluk işletme
      yönetimi ve yeminli mali müşavire aittir; yeminli mali müşavir önemli etkileri olabilecek hata ve hileleri düzeltecek
      veya ortaya çıkaracak şekilde planlamak ve yürütmekle yükümlüdür. Md. 20’ye göre tasdik raporu düzenleyen yeminli mali
      müşavir tasdik kapsamı ile sınırlı olmak üzere tasdikin doğruluğundan sorumludur; konu ve belgelerin gerçeği yansıtmaması
      halinde ziyaa uğratılan vergi ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumludur. Püf
      noktaları: yönetimin hilesi YMM’yi sorumluluktan kurtarmaz; planlama kusuru sorumluluğun kapsamını genişletmez, kapsam
      sınırı korunur; sorumluluk hem vergiyi hem cezayı içerir.'
    celdiriciler:
      A: Temel sorumluluk yalnız yönetime değil, yönetim ile yeminli mali müşavire birlikte aittir (md. 16); yönetimin hilesi
        YMM’yi sorumluluktan kurtarmaz.
      B: Md. 20 sorumluluğu ziyaa uğratılan vergilerle birlikte kesilecek cezaları da kapsar; cezalar mükellefe bırakılmamıştır.
      D: Md. 20 sorumluluğu tasdik kapsamı ile sınırlı tutar; planlama kusuru bu sınırı genişletmez.
      E: Md. 20 mükellefle müştereken ve müteselsilen sorumluluğu öngörür ve Borçlar Kanununun tam teselsül hükümlerinin uygulanacağını
        belirtir; kusur oranına göre paylaşım öngörülmemiştir.
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
