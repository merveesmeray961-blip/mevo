- id: YMM-DRM-YMM-0039
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: KDV iade tasdiki
  tip: uygulama
  zorluk: 3
  kok: 'Yeminli mali müşavir Orhan Kaya, bir ihracatçı şirketin KDV iadesine dayanak tasdik çalışmasında iki husus belirlemiştir:
    (1) iade hesabında, tasdik konusu belgelerin doğruluğunu olumsuz etkileyebilecek bir hesaplama hatası, (2) iade talebine
    konu işlemlerden birinde sahte belgeye dayanan ve suç teşkil eden hileli bir durum. Orhan Kaya’nın bu hususlara ilişkin
    yapması gerekenler bakımından Tasdik Yönetmeliği ile Çalışma Usul ve Esasları Yönetmeliği’ne göre aşağıdakilerden hangisi
    **yanlıştır**?'
  secenekler:
    A: Hesaplama hatasını, düzeltme önerisiyle birlikte işletme yönetimine bildirerek düzeltilmesini talep eder.
    B: İşletme yönetimi hesaplama hatasını düzeltirse, hatayla ilgili tasdik konusu belgeler imza ve mühürle tasdik edilir.
    C: Hileli bir durumun tespiti halinde, tasdik konusu belgelerle ilgili durumu bir raporla ilgili mercilere bildirmekle
      yükümlüdür.
    D: Suç teşkil eden hileli durumun, adli yargıya intikali gerekli hallerde yetkili mercilere duyurulması mecburidir.
    E: Yönetim hatayı düzeltmiş olsa dahi, hataya ilişkin durumu ayrıca bir raporla ilgili mercilere bildirmek zorundadır.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 16’ya göre hata ve hileler düzeltme önerisiyle birlikte işletme yönetimine bildirilir; yönetim bunları
      düzeltirse tasdik konusu belgeler tasdik edilir. Hataların düzeltilmesi istendiği halde düzeltilmez ise veya hileli
      bir durumun tespiti halinde durum bir raporla ilgili mercilere bildirilir. Çalışma Usul ve Esasları Yönetmeliği md.
      57’ye göre adli yargıya intikali gerekli olan ve suç teşkil eden hallerin yetkili mercilere duyurulması mecburidir.
      E şıkkı, düzeltilen hata için de rapor bildirimi aradığından yanlıştır. Püf noktaları: rapor bildirimi iki hâlde gündeme
      gelir (düzeltilmeyen hata, tespit edilen hile); düzeltilen hata tasdike engel olmaz; suç teşkil eden haller için ayrıca
      duyuru yükümlülüğü vardır.'
    celdiriciler:
      A: Doğru ifade; md. 16 hata ve hilelerin düzeltme önerisiyle birlikte işletme yönetimine bildirilmesini öngörür.
      B: Doğru ifade; md. 16’ya göre yönetimin düzeltmesi halinde tasdik konusu belgeler tasdik edilir.
      C: Doğru ifade; md. 16’ya göre hileli bir durumun tespiti halinde durum bir raporla ilgili mercilere bildirilir.
      D: Doğru ifade; Çalışma Usul ve Esasları Yönetmeliği md. 57 suç teşkil eden hallerin yetkili mercilere duyurulmasını
        mecburi kılar.
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 16
    alinti: İşletme yönetiminin bunları düzeltmesi halinde tasdik konusu belgeler tasdik edilir.
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 16
    alinti: Hataların düzeltilmesi istendiği halde, düzeltilmez ise veya hileli bir durumun
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
