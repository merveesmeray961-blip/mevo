    B: İbare her iki raporda da serbestçe kullanılabilir; mali tabloların gerçeğe uygunluğuna ilişkin kanaat bildirme yükümlülüğü
      ise yalnızca tasdiki ihtiva etmeyen Ali Er’in raporunda aranır.
