      sayılır, geçerli sayılmaz (III yanlış). Püf noktaları: bildirimin sonradan tamamlanabilmesi gibi bir imkân yoktur, eksik
      belgeli bildirim hiç yapılmamış sayılır; sözleşme içeriği ile bildirimin eki ayrı kaynaklardan gelen iki ayrı koşuldur.'
