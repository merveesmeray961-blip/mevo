      Kapsam dışındaki kurumlar vergisi hatası bu sorumluluğa girmez. Püf noktaları: sorumluluğun sınırı tasdik kapsamıdır;
      kapsam içinde ise vergi ve ceza birlikte sorumluluk konusudur; tam teselsül hükümleri uygulandığından kusur oranına
      göre pay ayrımı yapılmaz.'
