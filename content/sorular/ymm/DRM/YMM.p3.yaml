- id: YMM-DRM-YMM-0038
  sinav: ymm
  bolum:
  - YMM
  ders: DRM
  unite: YMM tasdik esasları
  konu: YMM
  kazanim: tam tasdik
  tip: uygulama
  zorluk: 3
  kok: Yeminli mali müşavir Gül Ersoy, Yıldız Plastik A.Ş.’nin 2026 hesap dönemine ilişkin mali tablolarının tasdiki (tam
    tasdik) görevini üstlenmeyi değerlendirmektedir. İşletmenin önceki dönem tasdikini başka bir yeminli mali müşavir yürütmüştür.
    Gül Ersoy’un görevi üstlenme aşamasından çalışmanın planlanmasına kadar Tasdik Yönetmeliği’ne göre izlemesi gereken yola
    ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Risk araştırması yapmak zorunda değildir; ancak önceki yeminli mali müşavirle görüşerek bilgi toplaması zorunludur
      ve çalışma planını yazılı hazırlar.
    B: Üstleneceği işin riskini tespit etmek için araştırma yapar, önceki meslek mensubuyla görüşerek bilgi toplayabilir ve
      planlamada yazılı çalışma planı hazırlar.
    C: Riski tespit etmek zorundadır; önceki meslek mensubuyla görüşerek bilgi toplaması yasaktır ve çalışma planı tasdik
      raporu düzenlenirken hazırlanır.
    D: Riski tespit eder ve önceki meslek mensubuyla görüşebilir; ancak planlama sözlü yapılabilir ve işletme personeli arasındaki
      koordinasyon plan kapsamında yer almaz.
    E: Görevi ücret düzeyini esas alarak kabul eder; risk araştırması yapması ve önceki meslek mensubuyla görüşmesi gerekmez,
      çalışma planı ise yazılı hazırlanır.
  dogru: B
  aciklama:
    dogru_neden: 'Md. 6’ya göre görevi üstlenecek yeminli mali müşavir, tasdik işleminin kendisine getirebileceği riski tespit
      etmek ve tasdik kapsam ve programını belirlemek amacıyla gerekli araştırmaları yapmak zorundadır; daha önce tasdik talebini
      karşılayan meslek mensubundan görüşme yapmak suretiyle bilgi toplayabilir. Md. 13’e göre planlama, araştırmalar, önceki
      çalışma kâğıtlarının gözden geçirilmesi, muhasebe politikasının incelenmesi, personelin belirlenmesi ve koordinasyon
      ile yazılı tasdik çalışma planının hazırlanmasını kapsar. Püf noktaları: önceki meslek mensubuyla görüşme bir yükümlülük
      değil imkândır (“toplayabilir”), risk araştırması ise zorunluluktur; çalışma planı yazılı olur ve personel koordinasyonu
      planlamanın parçasıdır; ücret ise md. 6 gereği seçimde belirleyici olmaması gereken bir ölçüttür.'
    celdiriciler:
      A: Önceki meslek mensubuyla görüşmek zorunlu değil, bir imkândır; risk araştırması ise zorunludur. İki unsur da tersine
        çevrilmiştir.
      C: Görüşme yasak değil, mümkündür; plan ise tasdik raporu aşamasında değil, çalışmanın yürütülmesinden önce, planlama
        kapsamında yazılı hazırlanır.
      D: Planın yazılı hazırlanması md. 13/e gereğidir ve işletme personelinin belirlenmesi ile aralarında koordinasyonun
        sağlanması md. 13/d gereği planlama kapsamındadır.
      E: Md. 6, tasdik hizmeti alanın ücret faktöründen ziyade uzmanlık ve deneyimi esas almasını öngörür; yeminli mali müşavirin
        risk araştırması yapması ise zorunludur.
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 6
    alinti: tasdik kapsam ve programını belirlemek amacıyla gerekli araştırmalar yapmak zorundadırlar
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 6
    alinti: meslek mensubundan görüşme yapmak suretiyle bilgi
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
