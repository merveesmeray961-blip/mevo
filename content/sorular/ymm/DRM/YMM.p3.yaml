      B: III yanlıştır; belgesiz bildirimler verilmemiş sayılır.
      D: III yanlıştır; I doğru olsa da bu birleşim hatalıdır ve II doğru olduğu halde dışarıda bırakılmıştır.
      E: III yanlış olduğundan II ile birlikte doğru sayılamaz; I de doğrudur.
