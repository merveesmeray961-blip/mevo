      edileceği merciler esas alınarak belirlenir. Md. 4’e göre bu Yönetmelik çerçevesinde tasdik edilmiş konu ve belgeler
      kamu idaresinin yetkililerince tasdikin kapsamı ölçüsünde incelenmiş olarak kabul edilir; çeşitli kanunlarla kamu idaresine
      tanınan inceleme ve teftiş yetkileri ise saklıdır. Püf noktaları: ölçüt belgelerin ibraz edileceği mercilerdir; tasdikin
      etkisi kapsamla sınırlıdır ve kamu idaresinin inceleme ve teftiş yetkisini ortadan kaldırmaz.'
