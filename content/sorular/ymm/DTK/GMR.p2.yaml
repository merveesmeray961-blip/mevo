- id: YMM-DTK-GMR-0047
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük vergisi ve gümrük kıymeti
  tip: hesaplama
  zorluk: 2
  kok: '(M) A.Ş., ilişkisiz bir yabancı satıcıdan aldığı makineyi ithal etmiştir. Veriler şöyledir:

    - Faturadaki mal bedeli (satıcı ülkede yüklemeye kadar; navlun ve sigorta hariç): 50.000 USD

    - Mersin Limanı''na kadar navlun: 3.000 USD; Mersin Limanı''na kadar sigorta: 1.000 USD

    - Alıcının üstlendiği, fiyata dahil olmayan ambalaj bedeli (işçilik dahil): 1.500 USD

    - İthalatçının yurt dışındaki satın alma temsilcisine ödediği komisyon: 500 USD

    - Mersin Limanı''ndan fabrikaya nakliye: 2.000 USD

    Tüm giderler faturada fiyattan ayrı gösterilmiştir. T.C. Merkez Bankası döviz satış kuru: sipariş tarihinde 1 USD = 30
    TL, serbest dolaşıma giriş beyannamesinin tescil tarihinde 1 USD = 40 TL, ödeme tarihinde 1 USD = 42 TL''dir. Başka ilave
    veya indirim unsuru yoktur.

    Buna göre makinenin gümrük kıymeti kaç TL''dir?

    '
  secenekler:
    A: 2.200.000
    B: 2.220.000
    C: 2.240.000
    D: 2.300.000
    E: 2.331.000
  dogru: B
  aciklama:
    dogru_neden: 'Gümrük kıymeti = mal bedeli 50.000 + giriş limanına kadar navlun 3.000 + sigorta 1.000 + alıcının üstlendiği
      ambalaj 1.500 = 55.500 USD. Satın alma komisyonu (md. 28/e) ve giriş yerinden sonraki nakliye (md. 28/a) dahil edilmez.
      Döviz, gümrük yükümlülüğünün başladığı tarih olan beyannamenin tescil tarihindeki (md. 181/1) TCMB döviz satış kuruyla
      çevrilir (md. 30): 55.500 × 40 = 2.220.000 TL.'
    celdiriciler:
      A: 'Alıcının üstlendiği ambalaj bedeli (md. 27/1-a-iii) kıymete eklenmemiştir: 55.000 × 40 = 2.200.000 TL.'
      C: 'Kıymete dahil edilmeyen satın alma komisyonu eklenmiştir: 56.000 × 40 = 2.240.000 TL.'
      D: 'Giriş limanından sonraki 2.000 USD iç nakliye eklenmiştir: 57.500 × 40 = 2.300.000 TL.'
      E: 'Tescil tarihi yerine ödeme tarihindeki kur kullanılmıştır: 55.500 × 42 = 2.331.000 TL.'
    hesap_adimlari:
    - 'İlaveler: 50.000 + 3.000 + 1.000 + 1.500 = 55.500 USD'
    - 'Dahil edilmeyenler: satın alma komisyonu 500 USD, iç nakliye 2.000 USD'
    - 'Kur: tescil tarihi (yükümlülüğün başladığı tarih) 40 TL'
    - 55.500 × 40 = 2.220.000 TL
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 30
    alinti: Fatura veya diğer belgelerde yazılı yabancı paralar, gümrük yükümlülüğünün başladığı tarihte yürürlükte olan T.C.
      Merkez Bankası döviz satış kurları üzerinden Türk Lirasına çevrilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 27/1-(e)
    alinti: ithal eşyası için Türkiye’deki giriş liman veya yerine kadar yapılan nakliye ve sigorta giderleri
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 181/1
    alinti: için verilecek gümrük beyannamesinin tescil tarihinde başlar.
  gecerlilik:
    baslangic: '2009-07-07'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (50000 + 3000 + 1000 + 1500) * 40
