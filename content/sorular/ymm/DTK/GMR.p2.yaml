- id: YMM-DTK-GMR-0050
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük vergisi ve gümrük kıymeti
  tip: hesaplama
  zorluk: 3
  kok: '(T) Ltd. Şti.''nin ithal ettiği eşyaya ilişkin veriler (TL) şöyledir:

    - Gümrük kıymeti (fiilen ödenen fiyat ile giriş limanına kadar navlun ve sigorta): 440.000

    - Gümrük vergisi oranı: %10

    - İthalat sırasında ödenen, gümrük vergisi dışındaki diğer vergi, resim ve harçlar: 6.000

    - Beyannamenin tescilinden önce yapılan, gümrük kıymetine dahil olmayan ve hiçbir aşamada KDV''ye tabi tutulmamış diğer
    gider: 10.000

    - Beyannamenin tescilinden önce Türkiye''de alınan ve KDV hesaplanarak faturalandırılmış liman hizmeti bedeli (KDV hariç):
    8.000

    - Tescilden sonra limandan depoya yapılan nakliye bedeli: 5.000

    KDV oranı %20''dir. 3065 sayılı KDV Kanunu''na göre bu ithalatta ödenecek KDV kaç TL''dir?

    '
  secenekler:
    A: '96.800'
    B: '98.000'
    C: '98.800'
    D: '100.000'
    E: '101.600'
  dogru: D
  aciklama:
    dogru_neden: 'KDVK md. 21''e göre ithalatta matrah; gümrük vergisine esas kıymet (440.000) + ithalat sırasında ödenen
      her türlü vergi, resim, harç (gümrük vergisi 44.000 + diğer 6.000) + tescil tarihine kadar yapılan diğer giderlerden
      vergilendirilmeyenler (10.000) toplamıdır: 500.000 TL. KDV = 500.000 × %20 = 100.000 TL. Püf noktaları: 21/(c) bendi
      yalnız tescile kadar yapılan ve KDV''ye tabi tutulmamış giderleri matraha katar; KDV''li faturalanmış liman hizmeti
      ayrıca vergilendirildiği için, tescilden sonraki iç nakliye ise süre şartını karşılamadığı için matraha girmez. Gümrük
      vergisi de ''ithalat sırasında ödenen vergi'' olarak matraha eklenir.'
    celdiriciler:
      A: Yalnız gümrük kıymeti ve gümrük vergisi alınmıştır (484.000 × %20); diğer vergi-harç ile vergilendirilmemiş gider
        unutulmuştur.
      B: Tescilden önce yapılan ve vergilendirilmemiş 10.000 TL gider matraha katılmamıştır (490.000 × %20).
      C: Gümrük vergisi dışındaki 6.000 TL vergi, resim ve harç matraha katılmamıştır (494.000 × %20).
      E: KDV hesaplanarak faturalandırılmış 8.000 TL liman hizmeti de matraha eklenmiştir (508.000 × %20); bu gider zaten
        vergilendirildiğinden 21/(c) kapsamına girmez.
    hesap_adimlari:
    - 'Gümrük vergisi: 440.000 × %10 = 44.000'
    - 'Matrah: 440.000 + 44.000 + 6.000 + 10.000 = 500.000'
    - Liman hizmeti (KDV'li faturalı) ve tescil sonrası nakliye hariç
    - 'KDV: 500.000 × %20 = 100.000'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21/(b)-(c)
    alinti: b) İthalat sırasında ödenen her türlü vergi, resim, harç ve paylar, c) Gümrük beyannamesinin tescil tarihine kadar
      yapılan diğer giderler ve ödemelerden vergilendirilmeyenler ile mal bedeli üzerinden hesaplanan fiyat farkı, kur farkı
      gibi ödemeler.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21/(a)
    alinti: a) İthal edilen malın gümrük vergisi tarhına esas olan kıymeti,
