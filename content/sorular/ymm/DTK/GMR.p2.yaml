  kok: 4458 sayılı Gümrük Kanunu'na göre yapılan bir ithalatta aşağıdaki giderlerin tamamı alıcı tarafından üstlenilmiş, fiilen
    ödenen fiyata dahil edilmemiş ve faturada fiyattan ayrı olarak gösterilmiştir. Bu giderlerden hangisi, gümrük kıymetinin
    belirlenmesinde fiilen ödenen fiyata ilave edilir?
  secenekler:
    A: Satıcının aracısına ödenen, satın alma komisyonu niteliği taşımayan komisyon ve tellaliye
    B: Eşyanın Türkiye'deki giriş limanına varışından sonra fabrikaya kadar yapılan nakliye ve sigorta gideri
    C: Makinenin ithalattan sonra fabrikada kurulması ve montajı için yapılan ödeme
    D: İthalatçının, eşyanın yurt dışında satın alınmasında kendisini temsil eden acentesine ödediği ücret
    E: Yazılı finansman anlaşmasına dayanan ve piyasa oranını aşmayan vadeli alım faizi
  dogru: A
  aciklama:
    dogru_neden: Kanun'un 27/1-(a)-(i) bendine göre satın alma komisyonları dışındaki komisyonlar ve tellaliyenin, fiyata
      dahil edilmemiş ancak alıcı tarafından üstlenilen bölümü fiilen ödenen fiyata ilave edilir. Satıcı tarafında çalışan
      aracıya ödenen komisyon bu niteliktedir.
    celdiriciler:
      B: 'Md. 28/(a): giriş yerine varıştan sonra yapılan nakliye ve sigorta giderleri, fiyattan ayırt edilebilmeleri koşuluyla
        gümrük kıymetine dahil edilmez; ilave edilen nakliye-sigorta yalnız giriş yerine kadar olanıdır (md. 27/1-e).'
      C: 'Md. 28/(b): makine ve teçhizat için ithalattan sonra yapılan kurma ve montaj giderleri gümrük kıymetine dahil edilmez.'
      D: 'Md. 27/4 ve 28/(e): ithalatçının yurt dışındaki temsilcisine satın alma hizmeti karşılığında ödediği ücret satın
        alma komisyonudur ve kıymete dahil edilmez.'
      E: 'Md. 28/(c): yazılı finansman anlaşması uyarınca alıcının üstlendiği faiz, beyan edilen fiyattan satış ve piyasa
        oranını aşmama şartlarıyla kıymete dahil edilmez.'
  kaynaklar:
