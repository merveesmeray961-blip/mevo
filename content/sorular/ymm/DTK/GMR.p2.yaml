  kok: '4458 sayılı Gümrük Kanunu''ndaki tanımlar dikkate alındığında, aşağıdakilerden hangileri "eşyanın gümrükçe onaylanmış
    bir işlem veya kullanıma tabi tutulması" kapsamında olmakla birlikte bir **gümrük rejimi değildir**?

    I. Eşyanın serbest bölgeye girmesi

    II. Gümrük kontrolü altında işleme

    III. Eşyanın gümrüğe terk edilmesi

    IV. Eşyanın Türkiye Gümrük Bölgesi dışına yeniden ihracı

    V. Geçici ithalat

    '
  secenekler:
    A: I ve III
    B: I, III ve IV
    C: II, IV ve V
    D: I, II, III ve IV
    E: III, IV ve V
  dogru: B
  aciklama:
    dogru_neden: Md. 3/14'e göre gümrükçe onaylanmış işlem veya kullanım; bir gümrük rejimine tabi tutma, serbest bölgeye
      giriş, yeniden ihraç, imha ve gümrüğe terktir. Md. 3/15'te sayılan sekiz gümrük rejimi ise serbest dolaşıma giriş, transit,
      antrepo, dahilde işleme, gümrük kontrolü altında işleme, geçici ithalat, hariçte işleme ve ihracattır. Serbest bölgeye
      giriş (I), gümrüğe terk (III) ve yeniden ihraç (IV) rejim değildir.
    celdiriciler:
      A: Yeniden ihraç (IV), ihracat rejimiyle karıştırılmıştır; yeniden ihraç md. 3/15'te sayılan rejimler arasında değildir,
        md. 3/14-(c)'de ayrıca sayılan bir onaylanmış işlemdir.
      C: Gümrük kontrolü altında işleme (II) ve geçici ithalat (V) md. 3/15'te sayılan gümrük rejimleridir.
      D: Gümrük kontrolü altında işleme (II) bir gümrük rejimidir.
      E: Geçici ithalat (V) bir gümrük rejimidir; serbest bölgeye giriş (I) ise rejim değildir ve listede yer almalıdır.
  kaynaklar:
