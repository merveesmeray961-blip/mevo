      verilecek vergiler için vergilerin tebliğinden itibaren bir yıl içinde başvurulması gerekir (md. 213/4). Tebliğ 03.02.2025,
      süre sonu 03.02.2026''dır; 16.03.2026 tarihli başvuru süre geçtikten sonradır ve mücbir sebep yoktur. Püf noktaları:
      Vergiler kanunen doğru ödendiği için üç yıllık süre öngören md. 211 (kanunen ödenmemesi gereken vergiler) değil, sözleşmeye
