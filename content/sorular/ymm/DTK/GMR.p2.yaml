  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük borcu
  tip: uygulama
  zorluk: 3
  kok: '(K) A.Ş.''nin 14.05.2023 tarihinde tescil edilen serbest dolaşıma giriş beyannamesi kapsamındaki eşya teslim alınmıştır.
    Gümrük idaresi, eşyanın tesliminden sonra yaptığı kontrolde beyan sahibinin hatalı beyanı nedeniyle gümrük vergisinin
    noksan alındığını tespit etmiş ve ek tahakkuku 10.04.2026 tarihinde yükümlüye tebliğ etmiştir. Olayla ilgili açılmış herhangi
    bir dava veya ceza davası yoktur.

    4458 sayılı Gümrük Kanunu''na göre aşağıdaki ifadelerden hangileri doğrudur?

    I. Tebligat, Kanun''da öngörülen süre içinde yapılmıştır.

    II. Noksan alınan vergiye, beyannamenin tescil tarihinden ek tahakkukun tebliğ tarihine kadar geçen süre için faiz uygulanır.

    III. Yükümlünün tebliğ edilen vergilere karşı gümrük idaresi nezdinde itiraz etmesi ödeme süresini keser.

    IV. Yükümlü, ödeme süresi bitmeden yazılı istemde bulunur ve teminat verirse ödeme süresi otuz gün daha uzatılabilir;
    uzatılan süre için gecikme zammı uygulanır.

    '
  secenekler:
    A: I ve II
    B: II ve IV
    C: I ve III
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I: Gümrük yükümlülüğü beyannamenin tescil tarihinde (14.05.2023) başlar (md. 181/1); noksan alınan vergilere
      ilişkin tebligat bu tarihten itibaren üç yıl içinde, yani 14.05.2026''ya kadar yapılmalıdır (md. 197/2). 10.04.2026
      tarihli tebligat süresindedir. III: Md. 198/2''ye göre gümrük idaresi nezdinde itiraz ödeme süresini keser; süre karar
      tebliğinden itibaren yeniden başlar. Püf noktaları: Faizin bitiş anı tebliğ değil vergilerin kesinleştiği tarihtir (md.
      193/3); ödeme süresinin uzatılmasında alınan bedel gecikme zammı değil tecil faizidir (md. 198/1). Üç yıllık süre tespit
      tarihinden değil, yükümlülüğün doğduğu tarihten işler.'
    celdiriciler:
      A: 'II yanlıştır: md. 193/3''e göre faiz, yükümlülüğün başladığı tarih ile vergilerin kesinleştiği tarih arasındaki
        süre için uygulanır; tebliğ tarihi faizin bitiş anı değildir. III ise doğru olduğu halde dışarıda bırakılmıştır.'
      B: II (faizin bitiş anı kesinleşme tarihidir) ve IV (uzatılan süre için tecil faizi alınır) yanlıştır; doğru olan I
        ve III dışarıda bırakılmıştır.
      D: 'IV yanlıştır: md. 198/1''e göre süre uzatılabilir, ancak uzatılan süre için 6183 sayılı Kanun''un 48. maddesine
        göre tecil faizi alınır; gecikme zammı uygulanmaz.'
      E: II ve IV yanlıştır; ayrıca süresinde yapılan tebligata ilişkin I dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 197/2
    alinti: Yapılan denetlemeler sonucunda hiç alınmadığı veya noksan alındığı belirlenen veya 1 inci fıkrada belirtilen şekilde
      tebliğ edilemeyen gümrük vergilerine ilişkin tebliğat gümrük yükümlülüğünün doğduğu tarihten itibaren üç yıl içinde
      yapılır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 193/3
    alinti: gümrük yükümlülüğünün başladığı tarih ile vergilerin kesinleştiği tarih arasındaki süre için 6183 sayılı Amme
      Alacaklarının Tahsil Usulü Hakkında Kanunun 51 inci maddesine göre tespit edilen gecikme zammı oranında faiz uygulanır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 198/1-2
    alinti: Uzatılan süre için 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanunun 48 inci maddesine göre tecil faizi
