    C: Geri verme yapılsa dahi makineler serbest dolaşımdaki eşya statüsünü korumaya devam eder.
    D: Makineler ilk kullanıma tabi tutulduğundan, geri verme talebi hiçbir koşulda dikkate alınamaz.
