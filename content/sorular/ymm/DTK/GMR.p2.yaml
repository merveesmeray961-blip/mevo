  kok: '4458 sayılı Gümrük Kanunu''na göre tescil edilmiş gümrük beyannamesinin düzeltilmesi ve iptaline ilişkin aşağıdaki
    ifadelerden hangileri doğrudur?

    I. Beyan sahibine eşyanın muayene edileceği bildirildikten sonra, beyannamedeki bilgilerin beyan sahibinin talebiyle düzeltilmesine
    izin verilmez.

    II. Eşyanın muayene edileceğinin beyan sahibine bildirildiği hallerde, beyannamenin iptaline ilişkin talep muayenenin
    sonucu alınmadan kabul edilmez.

    III. Beyannamenin tescilinden sonra eşyada meydana gelen bozulmalar oranında ithalat vergilerinden indirim yapılır.

    IV. Beyannamenin iptal edilmesi halinde, o beyana ilişkin yürürlükteki cezai hükümler uygulanmaz.

    '
  secenekler:
    A: I ve III
    B: II ve IV
    C: I, II ve IV
    D: I ve II
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Md. 63/(a): beyan sahibine muayene bildirildikten sonra beyannamede düzeltme yapılmasına izin verilmez (I
      doğru). Md. 64/1, ikinci paragraf: muayene bildirilmişse iptal talebi muayene sonucu alınmadan kabul edilmez (II doğru).'
    celdiriciler:
      A: 'III yanlıştır: md. 64/3''e göre tescilden sonra eşyanın niteliklerindeki değişiklik veya bozulmalar nedeniyle ithalat
        vergilerinden indirim yapılmaz; yalnız ilk madde olarak beyan gibi özel imkânlar tanınır.'
      B: 'IV yanlıştır: md. 64/5''e göre beyannamenin iptali, yürürlükteki cezai hükümlerin uygulanmasına engel oluşturmaz.
        I de doğru olduğu halde dışarıda bırakılmıştır.'
      C: IV yanlıştır; iptal cezai hükümlerin uygulanmasını engellemez (md. 64/5).
      E: III ve IV yanlıştır (md. 64/3 ve 64/5); doğru olan I ise dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 64/1
    alinti: Ancak, gümrük idarelerince beyan sahibine eşyanın muayene edileceğinin bildirilmiş olduğu hallerde, muayenenin
