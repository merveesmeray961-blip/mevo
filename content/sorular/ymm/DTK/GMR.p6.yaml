- id: YMM-DTK-GMR-0112
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: antrepodaki eşya için işlem tayini (md. 70)
  tip: kavrama
  zorluk: 3
  kok: Genel antrepoda bulunan serbest dolaşımda olmayan eşya için, (S) A.Ş. 20/10/2026 tarihinde serbest dolaşıma giriş yönünde
    gümrükçe onaylanmış bir işlem tayin edilmesine ilişkin beyanname vermiş ve beyanname aynı tarihte tescil edilmiştir. Şirket,
    gerekli belgeleri tamamlamamıştır. 4458 sayılı Kanun'un 70. maddesine göre, gümrük işlemlerinin tamamlanma süresi ve süre
    içinde tamamlanamamasının sonucu bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Süre, özet beyan tarihinden itibaren denizyolunda 45 gündür; tamamlanamayan eşya doğrudan serbest dolaşıma girmiş sayılır
      ve vergileri ek tahakkukla alınır.
    B: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa idare antrepo rejimini ek süre vermeden otomatik olarak
      uzatır ve eşya antrepoda kalır.
    C: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa eşya muayene edilir, durum tutanağa bağlanır ve eşya tasfiye
      hükümlerine göre tasfiye edilir.
    D: Süre, tescil tarihinden itibaren yirmi gündür; tamamlanamazsa yalnız idari para cezası uygulanır ve eşya yeniden antrepoya
      alınır.
    E: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa eşya muayene edilmeksizin imha edilir ve masraflar tahsil
      edilmez.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 70/2''ye göre gümrük antrepolarında bulunan eşya için gümrükçe onaylanmış işlem veya kullanım tayin
      edilmesine ilişkin beyanname verilirse işlemlerin beyannamenin tescil tarihinden itibaren otuz gün içinde bitirilmesi
      gerekir; bitirilemeyen eşya hakkında md. 70/1 uygulanır: eşya muayene edilir, tespitler tutanağa bağlanır ve eşya 177-180.
      maddelere göre tasfiye edilir. Püf noktaları: md. 46''daki 45/20 günlük özet beyan süreleri antrepodaki eşya için geçerli
      değildir; antrepo için süre tescil tarihinden başlayan otuz gündür. Süre dolması eşyayı kendiliğinden serbest dolaşıma
      sokmaz.'
    celdiriciler:
      A: Antrepodaki eşya için süre, beyannamenin tescil tarihinden itibaren otuz gündür; süre sonunda eşya kendiliğinden
        serbest dolaşıma girmiş sayılmaz.
      B: Süre içinde bitirilemeyen eşyaya md. 70/1 uygulanır; muayene, tutanak ve tasfiye söz konusudur.
      D: Süre yirmi gün değil otuz gündür; sonuç yalnız para cezası olmayıp muayene, tutanak ve tasfiyedir.
      E: Md. 70/1 muayene edilmesini ve eşyanın tasfiye hükümlerine göre tasfiyesini öngörür; imha ve masraf konusu bu değildir.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 70/2
    alinti: Gümrük antrepolarında bulunan eşya için, gümrükçe onaylanmış bir işlem veya kullanım tayin edilmesine ilişkin
