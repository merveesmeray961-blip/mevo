- id: YMM-DTK-GMR-0099
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük mevzuatının uygulanmasına ilişkin kararlar (md. 7)
  tip: kavrama
  zorluk: 3
  kok: Bir gümrük idaresi (Y) Ltd. Şti.'nin lehine bir karar vermiştir. Sonradan kararın eksik bilgiye dayandığı anlaşılmıştır;
    ancak (Y) Ltd. Şti. bu eksikliği bilmemekte ve koşullar itibarıyla bilmesi de gerekmemektedir. Kararda öngörülen yükümlülükler
    yerine getirilmiş, karara esas koşulların hiçbiri ortadan kalkmamıştır. 4458 sayılı Kanun'un 7. maddesine göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Md. 7/1'deki hâller bir arada bulunmadığından karar iptal edilemez; md. 7/2'deki hâllerden de hiçbiri gerçekleşmediğinden
      karar değiştirilemez veya iptal edilemez.
    B: Kararın eksik bilgiye dayanması tek başına yeterlidir; karar md. 7/1 uyarınca iptal edilir ve iptal, karar tarihinden
      itibaren yürürlüğe girer.
    C: Başvuru sahibi eksikliği bilmese de bilmesi gerekenlerden sayıldığından karar md. 7/1 uyarınca iptal edilir; iptal
      tebliğ tarihinde yürürlüğe girer.
    D: Karar iptal edilemez; ancak md. 7/2 uyarınca idare tarafından yalnızca değiştirilebilir, çünkü değiştirme için tek
      bir hâl yeterlidir.
    E: Eksik bilgiye dayanan lehe karar idarece her zaman geri alınabilir; yalnızca geri almanın muhataba tebliğ edilmesi
      şarttır.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 7/1''e göre lehe karar; (a) kararın yanlış veya eksik bilgiye dayanması, (b) başvuru sahibinin bunu
      bilmesi veya bilmesi gereken durumda olması ve (c) doğru bilgiyle kararın verilmesinin mümkün olmaması hâllerinin BİR
      ARADA bulunması durumunda iptal edilir. Soruda (b) yoktur. Md. 7/2 ise ayrı iki hâl sayar: karara esas koşulun gerçekleşmemesi/gerçekleşemez
      olması veya kararda öngörülen yükümlülüğe uyulmaması. Bunlar da bulunmadığından karar ne iptal ne de değiştirilebilir.
      Püf noktaları: 1. fıkradaki hâller ''ve'' mantığıyla (hepsi birlikte), 2. fıkradakiler ''veya'' mantığıyla (biri yeterli)
      işler; ikisini karıştırmayın. İptalin yürürlük tarihi de fıkraya göre değişir (1. fıkra: karar tarihi; 2. fıkra: tebliğ
      tarihi).'
    celdiriciler:
      B: Md. 7/1 iptal için (a), (b) ve (c) hâllerinin bir arada bulunmasını arar; yalnız (a) yeterli değildir.
      C: Soruda başvuru sahibinin bilmesi gerekmediği belirtilmiştir; (b) bendi gerçekleşmemiştir. Ayrıca md. 7/1'e göre iptal,
        iptal kararının verildiği tarihte yürürlüğe girer.
      D: Md. 7/2'deki hâllerden biri (koşulun gerçekleşmemesi veya yükümlülüğe uyulmaması) bulunmadıkça değiştirme de yapılamaz;
        soruda ikisi de gerçekleşmemiştir.
      E: Kanun, lehe kararın iptalini sıkı şartlara bağlamıştır; her zaman geri alma yetkisi tanınmamıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/1
    alinti: Gümrük idaresinin ilgilinin lehine olan kararları aşağıdaki hallerin bir arada bulunması durumunda iptal edilir.
      a) Kararın yanlış veya eksik bilgilere dayanılarak verilmesi halinde, b) Başvuru sahibinin bu yanlışlık veya eksikliği
      bilmesi veya bilmesi gerektiği hallerde, c) Kararın doğru veya tam bilgilere dayanılarak verilmesinin mümkün olmamasının
      tespiti halinde.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/2
    alinti: 2. Aşağıdaki hallerde ise ilgilinin lehine olan karar değiştirilir veya iptal edilebilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/2 (a)-(b)
    alinti: a) Karara esas teşkil eden bir veya birden fazla koşulun gerçekleşmemiş veya gerçekleşemez olması, b) Lehine olan
      bir kararda öngörülen bir yükümlülüğe ilgilinin uymaması halinde.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/4
    alinti: 1 inci fıkra hükümlerine göre kararın iptal işlemi iptal kararının verildiği tarihten, 2 nci fıkra hükümlerine
      göre verilen iptal veya değiştirme kararı tebliğ tarihinden itibaren yürürlüğe girer.
