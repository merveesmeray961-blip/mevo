- id: YMM-DTK-GMR-0100
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük mevzuatında sürelerin hesabı (md. 14)
  tip: uygulama
  zorluk: 3
  kok: (K) A.Ş.'ye, gümrük idaresince verilen ve 4458 sayılı Kanun'a göre uzatılamayan bir belge ibraz süresi "bir ay" olarak
    bildirilmiş; süre 31/3/2026 Salı günü başlamıştır. Nisan ayı 30 gündür; 1 Mayıs resmî tatil günüdür. Bu süre, Kanun'un
    14. maddesine göre hangi tarihte sona erer?
  secenekler:
    A: 29/4/2026 tarihinin mesai saati bitiminde
    B: 30/4/2026 tarihinin mesai saati bitiminde
    C: 1/5/2026 tarihinin mesai saati bitiminde
    D: 4/5/2026 tarihinin mesai saati bitiminde
    E: 31/5/2026 tarihinin mesai saati bitiminde
  dogru: B
  aciklama:
    dogru_neden: 'Md. 14/2''ye göre ay olarak belirlenen süre, başladığı güne son ayda tekabül eden günün mesai saati bitiminde
      sona erer; sürenin bittiği ayda tekabül eden gün yoksa süre o ayın son gününün mesai saati bitiminde sona erer. 31 Mart''a
      karşılık gelen gün Nisan''da bulunmadığından süre Nisan''ın son günü olan 30/4/2026''nın mesai bitiminde sona erer.
      Bu tarih resmî tatile rastlamadığından md. 14/1''deki ''ilk iş günü'' kuralı devreye girmez. Püf noktaları: önce ay
      hesabını (tekabül eden gün yoksa ayın son günü) yapın, sonra bitiş gününün tatil olup olmadığına bakın; 1 Mayıs''a kaydırmak
      yanlıştır.'
    celdiriciler:
      A: Süre bir gün erken bitirilmiştir; ay süresinde son ayda tekabül eden günün (yoksa ayın son gününün) mesai bitimi
        esas alınır.
      C: Nisan'da tekabül eden gün olmadığında süre ayın son gününde (30 Nisan) biter; bir sonraki aya taşmaz.
      D: Süre 30/4/2026'da bittiğinden 1 Mayıs tatili sonucu değiştirmez; ilk iş günü kuralı yalnız bitim tarihi tatile rastlarsa
        uygulanır.
      E: Süre ay sonuna değil, başladığı güne tekabül eden güne göre belirlenir; Mayıs ayına geçilmez.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 14/1
    alinti: Süre, tarih veya vadelerin bitim tarihinin resmi tatil gününe rastlaması halinde, bu süreler ilk işgününün resmi
      çalışma saatleri sonunda biter.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 14/2
    alinti: Süre hafta veya ay olarak belli edilmiş ise; başladığı güne son hafta veya ayda tekabül eden günün mesai saati
