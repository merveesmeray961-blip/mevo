      D: Tavanlarda sona erme Cumhurbaşkanı Kararı ile olur; kotalarda ise hacim sınırı belirleyicidir.
      E: Tarife tavanlarında sona erme hacim sınırına değil, Cumhurbaşkanı Kararına bağlanmıştır.
