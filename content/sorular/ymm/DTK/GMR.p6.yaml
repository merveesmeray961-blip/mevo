- id: YMM-DTK-GMR-0103
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: eşyanın Türkiye Gümrük Bölgesine getirilmesi (md. 37)
  tip: kavrama
  zorluk: 2
  kok: Türkiye Gümrük Bölgesine getirilen eşyanın gümrük idaresine götürülmesine ilişkin 4458 sayılı Kanun md. 37 hükümleri
    bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Varış yeri Türk limanı olmasa da karasularından geçen gemideki eşya, kural olarak belirlenen gümrük idaresine götürülmek
      zorundadır.
    B: Deniz veya havayoluyla gelen eşya hiçbir hâlde doğrudan serbest bölgeye götürülemez; önce gümrük idaresine uğramak
      zorundadır.
    C: Varış yeri bir Türk limanı veya havalimanı olmaksızın Türkiye karasularını ya da hava sahasını geçen gemi veya hava
      araçlarındaki eşyaya götürme yükümlülüğü uygulanmaz.
    D: Yolcu, sınır ahalisi ve posta eşyası için özel hüküm getirme yetkisi Cumhurbaşkanına aittir.
    E: Eşyanın gümrük bölgesine getirildikten sonra aktarılması hâlinde nakliyeden sorumlu olanlar bu hükümlere tabi değildir.
  dogru: C
