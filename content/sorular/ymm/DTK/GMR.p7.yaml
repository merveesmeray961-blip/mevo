  tip: uygulama
  zorluk: 2
  kok: 'Türkiye''de yerleşik (B) A.Ş.''nin serbest dolaşıma giriş beyannamesi 18.04.2026 tarihinde tescil edilmiştir.
    Eşya başka bir rejime tabi tutulmamış ve nihai kullanım nedeniyle indirimli vergi uygulanmamıştır.


    4458 sayılı Gümrük Kanunu md. 13''e göre beyannameye ilişkin belgelerin gümrük kontrolü amacıyla saklanma süresi
    hangi tarihte sona erer?

    '
  secenekler:
    A: 31.12.2031
    B: 18.04.2031
    C: 31.12.2030
    D: 18.04.2032
    E: 31.12.2032
  dogru: A
  aciklama:
    dogru_neden: Md. 13'e göre ilgili kişiler gümrük kontrolü amacıyla belgeleri beş yıl süre ile saklar. Serbest
      dolaşıma girmek üzere beyan edilen eşya için süre, serbest dolaşıma giriş beyanlarına ilişkin belgelerin tescil
      edildiği yılın sonundan itibaren işlemeye başlar. Tescil yılı 2026 olduğundan başlangıç 31.12.2026 olup süre
      31.12.2031'de sona erer.
    celdiriciler:
      B: Beş yıl tescil tarihine eklenmiştir; kanun süreyi tescil tarihinden değil, tescil edildiği yılın sonundan
        başlatır.
      C: Beş yıllık süre tescil yılının sonundan değil, tescil yılından önceki yıl sonundan başlatılmıştır; süre
        tescil edildiği yılın sonundan itibaren işlemeye başlar.
      D: Tescil tarihine beş yıl eklenmiş ve bir yıl daha ilave edilmiştir; sürenin başlangıcı tescil yılının sonudur.
      E: Altı yıl hesaplanmıştır; saklama süresi beş yıldır ve tescil yılının sonundan itibaren başlar.
    hesap_adimlari:
    - Başlangıç = tescil yılının sonu = 31.12.2026
    - Bitiş = 31.12.2026 + 5 yıl = 31.12.2031
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 13/1
    alinti: İlgili kişiler, 11 inci maddede belirtilen belge ve bilgileri gümrük kontrolü amacıyla beş yıl süre
      ile saklamak zorundadırlar.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 13/2-a
    alinti: (b) bendinde öngörülen haller dışında, serbest dolaşıma girmek veya ihraç edilmek üzere beyan edilen
      eşya ile ilgili olarak, serbest dolaşıma giriş veya ihracat beyanlarına ilişkin belgelerin tescil edildiği
      yılın;
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 13 son
    alinti: Sonundan itibaren işlemeye başlar.
