    I. Gümrük idareleri dışındaki yetkili kurumlar tarafından gerçekleştirilecek kontroller, 5607 sayılı Kanunun
    19 uncu maddesi hükümleri saklı kalmak kaydıyla gümrük idarelerinin koordinasyonunda ve mümkün olduğu ölçüde
    aynı yer ve zamanda yapılır.


    II. Gümrük kontrolleri, ani ve rastgele yapılanlar dahil olmak üzere her durumda yalnızca risk analizine dayanılarak
    yapılır.


    III. Gizli bilgilerin diğer ülkelerin gümrük idarelerine iletilmesine Müsteşarlık kararıyla her zaman izin verilebilir.


    IV. Gümrük işlemleri ile sınırlı olmak kaydıyla kendilerinden bilgi istenilen kişiler, özel kanunlarda yazılı
    gizlilik hükümlerini ileri sürerek bilgi vermekten kaçınamazlar.

    '
