- id: YMM-DTK-GMR-0119
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: lehe kararların iptali ve değiştirilmesi (md. 7)
  tip: kavrama
  zorluk: 3
  kok: 4458 sayılı Gümrük Kanunu md. 7'ye göre gümrük idaresinin ilgilinin lehine olan kararlarının iptali veya
    değiştirilmesine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kararın yanlış veya eksik bilgiye dayanması tek başına yeterli olup, başvuru sahibinin bunu bilmesi veya
      doğru bilgiyle kararın verilememesi gibi diğer koşulların birlikte aranması gerekmez.
    B: Yanlış veya eksik bilgiye dayanma, başvuru sahibinin bunu bilmesi (veya bilmesi gerekmesi) ve doğru bilgiyle
      kararın verilememesi hâlleri bir arada bulunduğunda lehe karar iptal edilir.
    C: Karara esas teşkil eden koşulun gerçekleşmemesi hâlinde karar mutlaka iptal edilmek zorundadır; karar değiştirilemez
      ve idarenin takdir yetkisi yoktur.
    D: Kararın iptali muhatabına tebliğ edilmez; iptal, Resmî Gazetede ilan edildiği tarihte yürürlüğe girer ve
      ayrıca tebliğ aranmaz.
    E: Md. 7/2'ye göre verilen iptal veya değiştirme kararı, kararın verildiği tarihten itibaren yürürlüğe girer;
      tebliğ tarihi dikkate alınmaz.
  dogru: B
  aciklama:
    dogru_neden: 'Md. 7/1''e göre ilgilinin lehine olan kararlar; (a) kararın yanlış veya eksik bilgilere dayanılarak
      verilmesi, (b) başvuru sahibinin bu yanlışlık veya eksikliği bilmesi veya bilmesi gerekmesi ve (c) kararın
      doğru veya tam bilgilere dayanılarak verilmesinin mümkün olmamasının tespiti hâllerinin bir arada bulunması
      durumunda iptal edilir. Md. 7/2 hâllerinde (karara esas koşulun gerçekleşmemesi, yükümlülüğe uyulmaması) karar
      değiştirilir veya iptal edilebilir. Md. 7/3: iptal muhatabına tebliğ edilir. Md. 7/4: 1 inci fıkraya göre
      iptal, iptal kararının verildiği tarihten; 2 nci fıkraya göre verilen iptal veya değiştirme kararı tebliğ
      tarihinden itibaren yürürlüğe girer. Püf noktaları: ''1. fıkra = hepsi bir arada = karar tarihi'', ''2. fıkra
      = ayrı ayrı = tebliğ tarihi''.'
    celdiriciler:
      A: 'Yanlıştır: md. 7/1''de sayılan üç hâlin bir arada bulunması gerekir.'
      C: 'Yanlıştır: bu hâllerde karar değiştirilir veya iptal edilebilir (md. 7/2).'
      D: 'Yanlıştır: kararın iptali muhatabına tebliğ edilir (md. 7/3).'
      E: 'Yanlıştır: 2 nci fıkraya göre verilen iptal veya değiştirme kararı tebliğ tarihinden itibaren yürürlüğe
        girer; kararın verildiği tarih 1 inci fıkradaki iptal içindir.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 7/1
    alinti: Gümrük idaresinin ilgilinin lehine olan kararları aşağıdaki hallerin bir arada bulunması durumunda iptal
      edilir. a) Kararın yanlış veya eksik bilgilere dayanılarak verilmesi halinde, b) Başvuru sahibinin bu yanlışlık
      veya eksikliği bilmesi veya bilmesi gerektiği hallerde, c) Kararın doğru veya tam bilgilere dayanılarak verilmesinin
      mümkün olmamasının tespiti halinde.
