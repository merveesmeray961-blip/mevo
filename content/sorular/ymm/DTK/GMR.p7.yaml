- id: YMM-DTK-GMR-0118
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük mevzuatının uygulanmasına ilişkin karar talepleri (md. 6)
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu md. 6''ya göre gümrük mevzuatının uygulanmasına ilişkin karar verilmesi talepleriyle
    ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Karar alınması talebinin yazılı olarak yapılması gerekir.


    II. Gümrük idareleri, başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde karar alır; bu sürenin
    aşılması hâlinde süre dolmadan önce başvuru sahibine gerekçe ve ek süre bildirilir.


    III. Başvurunun reddine ilişkin kararlar gerekçesiz verilebilir ve bu kararlara karşı itiraz yolu kapalıdır.


    IV. Verilen kararlar başvuru sahibine yalnızca sözlü olarak bildirilir.

    '
  secenekler:
    A: I
    B: II ve III
    C: I ve II
    D: I, II ve IV
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'Md. 6/2: karar alınması talebi yazılı yapılır (I doğru); gümrük idareleri başvurunun ulaştığı
      tarihten itibaren otuz gün içinde karar alır, bu süreye uyulması mümkün değilse süre aşılabilir ancak süre
      dolmadan önce başvuru sahibine gerekçeler ve ek süre bildirilir (II doğru). Md. 6/3: ret ve aleyhe kararlar
      itiraz yolu açık olmak üzere gerekçeli alınır (III yanlış). Md. 6/2: kararlar başvuru sahibine yazılı olarak
      tebliğ edilir (IV yanlış).'
    celdiriciler:
      A: II de doğrudur; otuz günlük süre ve süre aşımında bilgi verme yükümlülüğü md. 6/2'de düzenlenmiştir.
      B: 'III yanlıştır: reddedici veya aleyhe kararlar itiraz yolu açık olmak üzere gerekçeli alınır. Ayrıca yazılı
        talep koşulunu içeren I şıkta yoktur.'
      D: 'IV yanlıştır: verilen kararlar başvuru sahibine yazılı olarak tebliğ edilir.'
      E: 'III yanlıştır: ret ve aleyhe kararlar gerekçeli alınır ve itiraz yolu açıktır.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 6/2
    alinti: Karar alınması talebinin yazılı olarak yapılması gerekir. Gümrük idareleri, söz konusu talebe ilişkin
      başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde karar alırlar. Verilen kararlar başvuru
      sahibine yazılı olarak tebliğ edilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 6/2
    alinti: Ancak, gümrük idareleri tarafından bu süreye uyulması mümkün değilse; belirtilen süre aşılabilir. Bu
      durumda, söz konusu idareler, yukarıda belirlenen sürenin dolmasından önce başvuru sahibine süre aşımını haklı
      kılan gerekçeler ile talep hakkında karar vermek için gerekli gördükleri ek süreyi de belirterek bilgi verirler.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 6/3
