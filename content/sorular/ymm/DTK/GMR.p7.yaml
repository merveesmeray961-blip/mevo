      C: 'III yanlıştır: gizli bilgilerin diğer ülkelere iletilmesine sadece uluslararası bir anlaşma çerçevesinde
        izin verilebilir.'
      E: II yanlıştır; ani ve rastgele kontroller risk analizi şartının dışındadır.
