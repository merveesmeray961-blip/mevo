- id: YMM-DTK-GMR-0117
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: 'sürelerin hesabı: ay esaslı süre ve resmî tatil (md. 14)'
  tip: uygulama
  zorluk: 3
  kok: 'Gümrük Kanununa göre üç ay olarak belirlenmiş ve aksine özel bir hüküm bulunmayan bir süre 30.11.2026 (Pazartesi)
    tarihinde başlamıştır. Cumartesi ve Pazar günleri resmî tatildir; başka bir resmî tatil yoktur.


    Bu sürenin sona ereceği gün aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 26.02.2027
    B: 28.02.2027
    C: 01.03.2027
    D: 02.03.2027
    E: 30.03.2027
  dogru: C
  aciklama:
    dogru_neden: 'Md. 14/2''ye göre ay olarak belirlenen süre, başladığı güne son ayda tekabül eden günün mesai
      saati bitiminde sona erer; sürenin bittiği ayda tekabül eden bir gün yoksa süre o ayın son gününün mesai saati
      bitiminde sona erer. 30.11.2026 + 3 ay = Şubat 2027; Şubat''ta 30. gün olmadığından süre 28.02.2027''de bitecektir.
      Ancak 28.02.2027 Pazar (resmî tatil) olduğundan md. 14/1''e göre süre ilk iş gününün (01.03.2027 Pazartesi)
      resmî çalışma saatleri sonunda biter. Püf noktaları: Önce ay kuralı (olmayan gün → ayın son günü), sonra tatil
      kuralı (ilk iş günü) uygulanır; sıra değişirse yanlış sonuç çıkar.'
    celdiriciler:
      A: Süre bitim günü resmî tatile rastladığı için önceki iş gününe çekilmiştir; kanun bir sonraki (ilk) iş gününü
        esas alır.
      B: Şubat ayında 30. gün olmadığı için ayın son günü alınmış, ancak bu günün Pazar (resmî tatil) olduğu dikkate
        alınmamıştır.
      D: Bir sonraki iş gününün 'resmî çalışma saatleri sonunda' bittiği kuralı yerine bir gün fazla eklenmiştir;
        ilk iş günü 01.03.2027'dir.
      E: Süre 4 ay olarak hesaplanmıştır; kanundaki süre üç aydır.
    hesap_adimlari:
    - 30.11.2026 + 3 ay → Şubat 2027; 30. gün yok → 28.02.2027
    - 28.02.2027 Pazar (resmî tatil) → ilk iş günü 01.03.2027 (Pazartesi)
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 14/1
    alinti: Süre, tarih veya vadelerin bitim tarihinin resmi tatil gününe rastlaması halinde, bu süreler ilk işgününün
      resmi çalışma saatleri sonunda biter.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 14/2
    alinti: Süre hafta veya ay olarak belli edilmiş ise; başladığı güne son hafta veya ayda tekabül eden günün mesai
      saati bitiminde sona erer. Sürenin bittiği ayda tekabül eden bir gün yoksa süre o ayın son gününün mesai saati
