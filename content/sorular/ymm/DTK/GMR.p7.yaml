  kok: '4458 sayılı Gümrük Kanunu md. 5''e göre gümrük idarelerindeki işlerde temsile ilişkin aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Transit taşımacılık yapan veya arızi olarak beyanda bulunan kişiler dahil olmak üzere, temsilcinin Türkiye
