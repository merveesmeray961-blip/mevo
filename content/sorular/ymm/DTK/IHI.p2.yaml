- id: YMM-DTK-IHI-0011
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: İhracat ve ithalat işlemleri
  konu: IHI
  kazanim: teslim şekilleri (Incoterms) ve ödeme yöntemleri
  tip: hesaplama
  zorluk: 2
  kok: '(E) A.Ş., Almanya''dan satın aldığı eşyayı FOB Hamburg teslim şekliyle ithal etmiştir. Sözleşmedeki mal bedeli, eşyanın
    Hamburg''da gemiye yüklenmesine kadar olan giderleri kapsayan 80.000 Avro''dur; Türkiye''deki giriş limanına kadar navlun
    (6.000 Avro) ve sigorta (1.000 Avro) alıcı tarafından ayrıca ödenmiştir. Beyannamenin tescil tarihinde 1 Avro = 40 TL''dir.
    Gümrük vergisi oranı %10''dur; eşya başka bir gümrük vergisine tabi değildir.

    4458 sayılı Gümrük Kanunu''ndaki tanıma göre eşyanın "gümrüklenmiş değeri" kaç TL''dir?

    '
  secenekler:
    A: 3.480.000
    B: 3.520.000
    C: 3.784.000
    D: 3.800.000
    E: 3.828.000
  dogru: E
  aciklama:
    dogru_neden: 'Md. 3/26''ya göre ithal eşyasının gümrüklenmiş değeri, eşyanın CIF kıymeti ile gümrük vergileri toplamıdır.
      FOB bedele giriş limanına kadar navlun ve sigorta eklenerek CIF kıymet bulunur: (80.000 + 6.000 + 1.000) × 40 = 3.480.000
      TL. Gümrük vergisi 3.480.000 × %10 = 348.000 TL. Gümrüklenmiş değer = 3.828.000 TL.'
    celdiriciler:
      A: Yalnız CIF kıymet alınmış, gümrük vergisi eklenmemiştir.
      B: 'CIF yerine FOB bedel esas alınmıştır: 3.200.000 + 320.000; ithal eşyasında CIF kıymet kullanılır.'
      C: 'Sigorta bedeli CIF kıymete eklenmemiştir: 3.440.000 + 344.000.'
      D: 'CIF kıymete, FOB bedel üzerinden hesaplanan vergi eklenmiştir: 3.480.000 + 320.000; vergi CIF esaslı gümrük kıymeti
        üzerinden hesaplanır.'
    hesap_adimlari:
    - 'CIF: (80.000 + 6.000 + 1.000) × 40 = 3.480.000 TL'
    - 'Gümrük vergisi: 3.480.000 × %10 = 348.000 TL'
    - 'Gümrüklenmiş değer: 3.480.000 + 348.000 = 3.828.000 TL'
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 3/26
    alinti: ithal eşyası için eşyanın CIF kıymeti ile gümrük vergileri toplamını, ihraç eşyası için FOB kıymeti ile gümrük
      vergileri toplamını;
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 27/1-(e)
    alinti: ithal eşyası için Türkiye’deki giriş liman veya yerine kadar yapılan nakliye ve sigorta giderleri
  gecerlilik:
    baslangic: '2013-04-04'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'cif = (80000 + 6000 + 1000) * 40

      sonuc = cif + cif * 10 // 100'
