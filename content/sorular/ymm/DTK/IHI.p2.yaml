  zorluk: 1
  kok: 3065 sayılı KDV Kanunu'nun 12. maddesine göre aşağıdaki işlemlerden hangisi ihracat teslimi **sayılmaz**?
  secenekler:
    A: Yurt dışındaki alıcıya satılan malın, ihraçtan önce alıcı adına hareket eden yurt içindeki bir firmaca işlenerek yurt
      dışına çıkarılması
    B: Serbest bölgede faaliyet gösteren bir alıcıya satılan malın Türkiye Gümrük Bölgesinden çıkarak serbest bölgeye ulaşması
    C: Gümrüksüz satış mağazalarında satılmak üzere malın, Gümrük Kanunu'na göre faaliyet gösteren bu mağazaların deposuna
      konulması
    D: Tüm merkez ve faaliyetleri Türkiye'de bulunan bir alıcıya satılan malın, alıcının talimatıyla yurt dışındaki bir depoya
      gönderilmesi
    E: Malın yetkili gümrük antreposu işleticisine tevdi edilerek yetkili gümrük antreposuna konulması
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 12/1'e göre ihracat teslimi için hem (a) teslimin yurt dışındaki bir müşteriye, serbest bölgedeki
      alıcıya, gümrüksüz satış mağazasına veya yetkili antrepo işleticisine yapılması hem de (b) malın gümrük bölgesinden
      çıkarak dış ülkeye veya serbest bölgeye ulaşması (ya da ilgili mağaza veya antrepoya konulması) gerekir. Md. 12/2'ye
      göre yurt dışındaki müşteri; ikametgâhı, işyeri, kanuni ve iş merkezi yurt dışında olan alıcıdır. D'de mal yurt dışına
      çıksa da alıcı yurt içindedir; (a) şartı gerçekleşmemiştir.
    celdiriciler:
      A: 'Md. 12/1-(b) son cümle: malın ihraçtan önce yurt dışındaki alıcı adına hareket eden yurt içindeki firmalarca işlenmesi
        durumu değiştirmez; ihracat teslimidir.'
      B: 'Md. 12/1-(a)-(b): serbest bölgedeki alıcıya yapılan ve mal serbest bölgeye ulaşan teslim ihracat teslimidir.'
      C: 'Md. 12/1-(a)-(b): Gümrük Kanunu md. 95/1''e göre faaliyet gösteren gümrüksüz satış mağazalarına veya depolarına
        yapılan teslim ihracat teslimi sayılır.'
      E: 'Md. 12/1-(a)-(b): malların yetkili gümrük antreposu işleticisine tevdi edilip yetkili gümrük antreposuna konulması
        ihracat teslimi sayılır.'
  kaynaklar:
