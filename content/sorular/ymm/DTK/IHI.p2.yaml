  tip: bilgi
  zorluk: 1
  kok: '3065 sayılı KDV Kanunu''na göre ihraç edilmek şartıyla imalatçılar tarafından ihracatçılara teslim edilen mallara
    ait KDV ihracatçılarca ödenmez; vergi tarh ve tahakkuk ettirilerek tecil olunur. Malların ihracatçıya teslim tarihini
    takip eden ay başından itibaren **(i)** içinde ihraç edilmesi halinde tecil edilen vergi terkin olunur. İhracatın mücbir
    sebepler veya beklenmedik durumlar nedeniyle bu süre içinde gerçekleştirilememesi halinde, en geç sürenin dolduğu tarihten
    itibaren **(ii)** içinde başvuran ihracatçılara **(iii)** kadar ek süre verilebilir.

    Boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?

    '
  secenekler:
    A: altı ay – on beş gün – altı aya
    B: üç ay – otuz gün – üç aya
    C: üç ay – on beş gün – üç aya
    D: altı ay – otuz gün – üç aya
    E: üç ay – otuz gün – altı aya
  dogru: C
  aciklama:
    dogru_neden: 'KDVK md. 11/1-(c): mallar ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay içinde ihraç
      edilirse tecil edilen vergi terkin olunur; mücbir sebep veya beklenmedik durumlarda üç aylık sürenin dolduğu tarihten
      itibaren on beş gün içinde başvuran ihracatçılara üç aya kadar ek süre verilebilir.'
    celdiriciler:
      A: Ana süre altı ay değil üç aydır; ek süre de altı aya değil üç aya kadardır.
      B: Ek süre başvurusu otuz gün değil, üç aylık sürenin dolduğu tarihten itibaren on beş gün içinde yapılır.
      D: Ana süre üç aydır; başvuru süresi on beş gündür.
      E: Başvuru süresi on beş gün, ek süre üç aya kadardır.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-(c)
    alinti: Söz konusu malların, ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay içinde ihraç edilmesi halinde,
      tecil edilen vergi terkin olunur.
