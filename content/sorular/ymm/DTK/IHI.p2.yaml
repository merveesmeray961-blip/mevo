    şöyledir:

    - 2022: 5 milyon USD

    - 2023: 2 milyon USD

    - 2024: 3 milyon USD

    - 2025: 4 milyon USD

    Mali yıl takvim yılıdır ve 2025 hesap dönemi kapanmıştır. Şirket, Haziran 2026''da yurt içindeki bir bankadan, 32 Sayılı
    Karar''ın 17/A maddesinin üçüncü fıkrasında sayılan istisnai hallerin hiçbirine girmeyen genel amaçlı bir döviz kredisi
    kullanmak istemektedir. Kullanım tarihinde şirketin kredi bakiyesi 7 milyon USD''dir.

    Buna göre şirketin bu tarihte kullanabileceği azami döviz kredisi tutarı kaç milyon USD''dir?

    '
  secenekler:
    A: '2'
    B: '4'
    C: '7'
    D: '8'
    E: '9'
  dogru: A
  aciklama:
    dogru_neden: 'Md. 17/A-4-(a): kullanım tarihinde kredi bakiyesi 15 milyon USD''nin altında olan döviz gelirli yerleşik
      kişilerde, kullanılmak istenen kredi ile mevcut kredi bakiyesi toplamı son üç mali yılın döviz gelirleri toplamını aşamaz.
      Son üç mali yıl 2023-2025''tir: 2 + 3 + 4 = 9 milyon USD. Azami kredi = 9 − 7 = 2 milyon USD. Püf noktaları: 2022 geliri
      son üç mali yıl dışındadır (gereksiz veri). 15 milyon USD bir kredi tavanı değil, sınırlamanın uygulanıp uygulanmayacağını
      belirleyen bakiye eşiğidir; bakiye bu eşiğin altında olduğu için formül uygulanır.'
    celdiriciler:
      B: Yalnız son mali yılın (2025) döviz geliri esas alınmış ve bakiye düşülmemiştir; Karar son üç mali yılın toplamını
        esas alır.
      C: '2022 geliri de toplama katılmıştır: (5 + 2 + 3 + 4) − 7 = 7; Karar yalnız son üç mali yılı (2023-2025) esas alır.'
      D: 15 milyon USD eşiği kredi tavanı sanılarak 15 − 7 = 8 bulunmuştur; eşik yalnız sınırlamanın uygulanacağı bakiye düzeyini
        gösterir.
      E: Mevcut kredi bakiyesi düşülmemiştir; Karar yeni kredi ile mevcut bakiyenin toplamını sınırlar.
    hesap_adimlari:
    - Bakiye 7 milyon USD < 15 milyon USD → md. 17/A-4-(a) uygulanır
    - 'Son üç mali yıl döviz geliri: 2 + 3 + 4 = 9 milyon USD'
    - Yeni kredi + 7 ≤ 9 → azami 2 milyon USD
