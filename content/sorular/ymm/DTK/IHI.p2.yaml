- id: YMM-DTK-IHI-0010
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: İhracat ve ithalat işlemleri
  konu: IHI
  kazanim: ithalat işlemleri
  tip: uygulama
  zorluk: 2
  kok: '(D) A.Ş., serbest dolaşımdaki makinesini 10.05.2024 tarihinde ihraç etmiş ve bu ihracatta KDV Kanunu''nun 11. maddesindeki
    ihracat istisnasından yararlanmıştır. Alıcının sözleşmeyi feshetmesi üzerine makine, ihracı sırasındaki ayniyeti değişmeden
    ve yurt dışında hiçbir işleme tabi tutulmadan 20.03.2026 tarihinde Türkiye''ye geri getirilmiştir. İhracat hariçte işleme
    rejimi kapsamında yapılmamıştır ve makinenin ihracı bir dış ticaret önlemine konu değildir.

    4458 sayılı Gümrük Kanunu ve 3065 sayılı KDV Kanunu''na göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: İhracından itibaren üç yıl geçmeden geri geldiği için, beyan sahibinin talebi aranmaksızın ithalat vergilerinden kendiliğinden
      muaftır.
    B: Talep üzerine ithalat vergilerinden muaf tutulur; ithalde KDV istisnası için ihracatta yararlanılan istisna tutarı
      ödenmeli veya teminata bağlanmalıdır.
    C: Talep üzerine ithalat vergilerinden muaf tutulur; ithalde KDV istisnası ise ihracatta yararlanılan istisna tutarı ödenmeksizin,
      ek şart aranmadan uygulanır.
    D: Geri gelen eşya muafiyeti yalnız hariçte işleme rejimi kapsamında ihraç edilen eşyaya tanındığından makine ithalat
      vergilerine tabidir.
    E: Muafiyet için eşyanın ihracından itibaren bir yıl içinde yeniden serbest dolaşıma girmesi gerektiğinden makine ithalat
      vergilerine tabidir.
  dogru: B
  aciklama:
    dogru_neden: 'Gümrük Kanunu md. 168/1: serbest dolaşımdaki eşya ihraç edildikten sonra üç yıl içinde yeniden serbest dolaşıma
      girerse, beyan sahibinin talebi üzerine ithalat vergilerinden muaf tutulur; md. 169''a göre ayniyetin değişmemiş olması
      gerekir. KDVK md. 16/1-(b): ihracat istisnasından yararlanılarak ihraç edilip Gümrük Kanunu md. 168-170''e göre geri
      gelen eşyanın ithalat istisnasından faydalanabilmesi için ihracat istisnasından faydalanılan miktarın gümrük idaresine
      ödenmesi veya bu miktar kadar teminat gösterilmesi şarttır.'
    celdiriciler:
      A: Süre doğru olsa da muafiyet md. 168/1'e göre beyan sahibinin talebine bağlıdır; kendiliğinden uygulanmaz.
      C: Gümrük vergisi yönü doğru; ancak KDVK md. 16/1-(b) parantez içi hükmü, ihracat istisnasından yararlanmış eşya için
        ödeme veya teminat şartı getirir.
      D: 'Ters yöndedir: md. 168/2-(a) muafiyeti, aynen ihraç edildiği durumda olma hali hariç, hariçte işleme rejimi çerçevesinde
        ihraç edilen eşyaya tanımaz.'
      E: Md. 168/1'deki süre üç yıldır; 22 aylık süre bu sınırın içindedir.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 168/1
    alinti: noktasından ihraç edildikten sonra üç yıl içinde yeniden serbest dolaşıma girmesi halinde ve beyan sahibinin talebi
      üzerine, ithalat vergilerinden muaf tutulur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 16/1-(b)
    alinti: bu eşyayla ilgili olarak ihracat istisnasından faydalanılan miktarın gümrük idarelerine ödenmesi veya bu miktar
      kadar teminat gösterilmesi şarttır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 169
    alinti: 168 inci maddede belirtilen ithalat vergilerinden muafiyet, geri gelen eşyanın ihracı sırasındaki ayniyeti değişmeden
      yeniden ithali halinde tanınır.
