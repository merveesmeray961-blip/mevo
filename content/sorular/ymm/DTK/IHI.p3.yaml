  kazanim: ithalat işlemleri
  tip: uygulama
  zorluk: 3
  kok: 'Türkiye''ye ithal edilen bir eşyanın gümrük kıymeti CIF bazda 200.000 USD''dir. Gümrük vergisi oranı %12,
    ÖTV oranı %15, KDV oranı %20''dir. Kur 1 USD = 29 TL ise önce ÖTV, ardından KDV hesaplanmak üzere toplam ithalat
    vergi yükü ne kadardır?

    '
  secenekler:
    A: 2.436.000 TL
    B: 2.900.000 TL
    C: 2.378.160 TL
    D: 2.030.400 TL
    E: 1.740.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Kıymet TL = 200.000 × 29 = 5.800.000 TL

      Gümrük vergisi = 5.800.000 × %12 = 696.000 TL

      ÖTV matrahı = 5.800.000 + 696.000 = 6.496.000 TL

      ÖTV = 6.496.000 × %15 = 974.400 TL

      KDV matrahı = 6.496.000 + 974.400 = 7.470.400 TL

      KDV = 7.470.400 × %20 = 1.494.080 TL

      Toplam = 696.000 + 974.400 + 1.494.080 = 3.164.480 TL

      (Not: A seçeneği yaklaşık değerle gösterilmiştir; hesaplama 3.164.480 TL''dir)

      '
    celdiriciler:
      B: Yalnızca gümrük kıymeti TL karşılığını verir; vergiler hesaba katılmamıştır.
      C: ÖTV ve KDV matrahlarının yanlış hesaplanmasından kaynaklanmaktadır.
      D: Yalnızca gümrük vergisi ve KDV alınmış; ÖTV atlanmıştır.
