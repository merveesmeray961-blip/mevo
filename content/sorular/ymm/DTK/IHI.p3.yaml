  kazanim: ithalat işlemleri
  tip: uygulama
  zorluk: 3
  kok: 'Bir firma Almanya''dan 100.000 EUR değerinde makine ithal etmektedir. Gümrük vergisi oranı %5, KDV oranı
    %20, ÖTV uygulanmamaktadır. Kur 1 EUR = 30 TL olduğuna göre toplam ithalat vergisi yükü ne kadardır?

    '
  secenekler:
    A: 150.000 TL
    B: 750.000 TL
    C: 780.000 TL
    D: 750.000 TL gümrük vergisi + KDV
    E: 600.000 TL yalnızca KDV
  dogru: C
  aciklama:
    dogru_neden: 'Gümrük kıymeti = 100.000 EUR × 30 = 3.000.000 TL

      Gümrük vergisi = 3.000.000 × %5 = 150.000 TL

      KDV matrahı = 3.000.000 + 150.000 = 3.150.000 TL

      KDV = 3.150.000 × %20 = 630.000 TL

      Toplam vergi = 150.000 + 630.000 = 780.000 TL

      '
    celdiriciler:
      A: Yalnızca gümrük vergisi hesaplanmış; KDV dahil edilmemiştir.
      B: 750.000 TL yanlış hesaplama sonucudur; KDV matrahı gümrük kıymetidir ancak gümrük vergisi de eklenmesi
        gerekir.
      D: Seçenek ifadesi hatalı; doğru cevap C'dir.
      E: Yalnızca KDV hesaplanmış; gümrük vergisi ihmal edilmiştir.
