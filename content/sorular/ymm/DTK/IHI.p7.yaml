  - YMM
  ders: DTK
  unite: İhracat ve ithalat işlemleri
  konu: IHI
  kazanim: alıcısı tarafından kabul edilmeyen mallar (md. 14)
  tip: kavrama
  zorluk: 2
  kok: 'İhracat Yönetmeliği md. 14''e göre alıcısı tarafından kabul edilmeyen mallara ilişkin aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Aynı bedel ve şartlarla mal ihracına ilişkin talepler, yalnızca İhracatçı Birlikleri Genel Sekreterliğince
    sonuçlandırılır.


    II. Başka bedel ve şartlarla aynı veya farklı alıcılara satışa ilişkin talepler, yeni satış sözleşmesine ait
    İhracatçı Birlikleri Genel Sekreterliğince onaylı faturanın ibrazından sonra gümrük idarelerince sonuçlandırılır.


    III. Bozulabilir nitelikteki malların talepleri, İhracatçı Birlikleri Genel Sekreterliği veya daha sonra bilgi
    verilmek kaydıyla Bakanlık yurt dışı teşkilatınca sonuçlandırılır.


    IV. Gümrük idarelerince sonuçlandırılan talepler yalnızca ilgili İhracatçı Birlikleri Genel Sekreterliğine bildirilir;
    mükellefin bağlı bulunduğu vergi dairesine bildirim yapılmaz.

    '
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve IV
    D: II ve III
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Md. 14/1: aynı bedel ve şartlarla ihracat talepleri, giriş ve çıkışta ayniyet tespit edilerek
      gümrük idarelerince sonuçlandırılır (I yanlış). Md. 14/2: başka bedel ve şartlarla satış talepleri, yeni satış
      sözleşmesine ait birlikçe onaylı faturanın ibrazından sonra gümrük idarelerince sonuçlandırılır (II doğru).
      Md. 14/4: bozulabilir mallarda talepler Birlik veya, Birliğe bilgi vermek kaydıyla, Bakanlık yurt dışı teşkilatınca
      sonuçlandırılır (III doğru). Md. 14/3: sonuçlandırılan talepler ilgili Birliğe ve mükellefin bağlı bulunduğu
      vergi dairesine bildirilir (IV yanlış).'
    celdiriciler:
      A: 'I yanlıştır: aynı bedel ve şartlarla ihracat talepleri giriş ve çıkışta ayniyet tespit edilerek gümrük
        idarelerince sonuçlandırılır. III de doğru olduğu hâlde şıkta yoktur.'
      B: Her iki ifade de yanlıştır (aynı bedelli talepler gümrük idarelerince sonuçlandırılır; sonuçlanan talepler
        vergi dairesine de bildirilir).
      C: 'IV yanlıştır: sonuçlandırılan talepler İhracatçı Birlikleri Genel Sekreterliğine ve mükellefin bağlı bulunduğu
        vergi dairesine bildirilir. III de doğru olduğu hâlde şıkta yoktur.'
      E: IV yanlıştır; vergi dairesine de bildirim yapılır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: İhracat Yönetmeliği
    madde: md. 14/1
    alinti: Alıcısı tarafından kabul edilmeyen mallar karşılığında aynı bedel ve şartlarla mal ihracına ilişkin
      talepler, durumu gösterir belgelere istinaden gümrük mevzuatı çerçevesinde giriş ve çıkışta ayniyeti tespit
      edilmek suretiyle gümrük idarelerince sonuçlandırılır.
  - mevzuat: İhracat Yönetmeliği
    madde: md. 14/2
    alinti: Alıcısı tarafından kabul edilmeyen malların başka bedel ve şartlarla aynı veya farklı alıcılara satışına
