      onaylı faturanın ibrazından sonra gümrük idarelerince sonuçlandırılır.
  - mevzuat: İhracat Yönetmeliği
    madde: md. 14/3
    alinti: Gümrük idarelerince sonuçlandırılan talepler ilgili İhracatçı Birlikleri Genel Sekreterliğine ve mükellefin
      bağlı bulunduğu vergi dairesine bildirilir.
  - mevzuat: İhracat Yönetmeliği
