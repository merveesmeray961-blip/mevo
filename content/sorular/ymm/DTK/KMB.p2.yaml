- id: YMM-DTK-KMB-0042
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: döviz ve kıymet ithali ve ihracı
  tip: uygulama
  zorluk: 1
  kok: 'Türkiye''de yerleşik Bayan T, yurt dışına çıkarken beraberinde kendisine ait, ticari amaç taşımayan ve toplam değeri
    18.000 ABD doları olan altın ziynet eşyası götürmek istemektedir. Eşyanın bir kısmını daha önce yurt dışından getirmiş,
    ancak Türkiye''ye girişte beyan etmemiştir.

    Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''a göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Değer 25.000 ABD dolarını aşmadığından ziynet eşyası, yolcunun kendisine ait olması koşuluyla başka bir şart aranmaksızın
      çıkarılabilir.
    B: Ziynet eşyası efektif gibi değerlendirilir; 10.000 avro eşitini aşan kısmın çıkarılması Bakanlıkça belirlenecek esaslara
      tabidir.
    C: Değer 15.000 ABD dolarını aştığından eşyanın çıkarılması, Türkiye'de satın alındığının tevsik edilmesi şartına bağlıdır.
    D: 15.000 ABD dolarını aşan 3.000 ABD dolarlık kısım hiçbir koşulda çıkarılamaz; yolcu yalnız 15.000 ABD dolarlık kısmı
      götürebilir.
    E: Girişte beyan edilmemiş ziynet eşyası, değeri ne olursa olsun yurt dışına çıkarılamaz; sonradan tevsik kabul edilmez.
  dogru: C
  aciklama:
    dogru_neden: Karar md. 7/5'e göre yolcular kendilerine ait, ticari amaç taşımayan ve değeri 15.000 ABD dolarını aşmayan
      ziynet eşyasını yurt dışına çıkarabilir. Daha fazla değerdeki ziynet eşyasının çıkarılması girişte beyan edilmiş olmasına
      veya Türkiye'de satın alındığını tevsik etme şartına bağlıdır. Bayan T girişte beyanda bulunmadığından ancak Türkiye'de
      satın alındığını tevsik ederek eşyayı çıkarabilir.
    celdiriciler:
      A: Ziynet eşyası için sınır 25.000 değil 15.000 ABD dolarıdır; 18.000 ABD doları sınırı aşar.
      B: 10.000 avro sınırı md. 4/(f)'de efektif (yabancı banknot) için öngörülmüştür; ziynet eşyası md. 7/5'e tabidir.
      D: Karar sınırı aşan ziynet eşyasının çıkarılmasını yasaklamaz; girişte beyan veya Türkiye'de satın alındığının tevsiki
        şartına bağlar.
      E: Girişte beyan şartı seçimlik şartlardan yalnız biridir; Türkiye'de satın alındığının tevsiki de yeterlidir.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 7/5
    alinti: Yolcular, beraberlerindeki kendilerine ait değeri 15.000 ABD dolarını aşmayan ve ticari amaç taşımayan ziynet
      eşyası niteliğinde kıymetli madenlerden ve taşlardan yapılmış eşyaları yurda getirebilirler ve yurtdışına çıkarabilirler.
      Daha fazla değerdeki ziynet eşyalarının yurtdışına çıkarılması, girişte beyan edilmiş olmasına veya Türkiye'de satın
      alındığını tevsik etme şartına bağlıdır.
