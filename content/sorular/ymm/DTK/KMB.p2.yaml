  kok: 'Hazine ve Maliye Bakanlığı, Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''ın 8 inci maddesindeki yetkisine
    dayanarak yayımladığı tebliğle, belirli ihracat bedellerinin belirli bir süre içinde yurda getirilmesini zorunlu tutmuştur.
    İhracatçı (Ç) A.Ş.''nin bu kapsamdaki ihracat bedeli, alıcının ülkesinde çıkan savaş nedeniyle süresinde yurda getirilememiştir.

    Karar''a göre aşağıdaki ifadelerden hangileri doğrudur?

    I. Bakanlık, haklı ve mücbir sebeplerin varlığı hâlinde döviz getirme süresini uzatabilir; döviz getirme zorunluluğunu
    kısmen veya tamamen kaldırabilir.

    II. Bakanlığın bu tebliğle yaptığı düzenlemeye aykırılık, 1567 sayılı Türk Parasının Kıymetini Koruma Hakkında Kanun''a
    muhalefet sayılır.

    III. Kambiyo denetiminde Karar''a aykırılık tespit edilen kişiler hakkında Vergi Usul Kanunu''nun arama hükümleri uygulanır.

    IV. Bakanlık, denetim kapsamındaki kişinin müteakip işlemlerini teminata bağlayabilir ve gerektiğinde bu teminatı kısmen
    veya tamamen Hazine''ye gelir yazabilir.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'I: md. 20/1, Bakanlığa haklı ve mücbir sebeplerin varlığı hâlinde döviz getirme sürelerini uzatma ve döviz
      getirme zorunluluğunu kısmen veya tamamen kaldırma yetkisi verir. II: md. 1/2''ye göre Karar''a ve Karar''ın uygulanması
      amacıyla yayımlanan yönetmelik, tebliğ ve genelgelere muhalefet, 1567 sayılı Kanun''a muhalefet sayılır. IV: md. 21''e
      göre Bakanlık müteakip işlemleri teminata bağlamaya ve gerektiğinde teminatları kısmen veya tamamen Hazine''ye gelir
      yazmaya yetkilidir.'
    celdiriciler:
      A: IV de doğrudur; md. 21 Bakanlığa teminat ve gelir kaydetme yetkisi verir.
      B: 'III yanlıştır: md. 21''e göre aykırılık tespit edilenler hakkında Vergi Usul Kanunu''nun değil, Ceza Muhakemeleri
        Usulü Kanunu''nun zabıt ve aramaya dair hükümleri uygulanır; ayrıca doğru olan II ve IV dışarıda bırakılmıştır.'
      C: I de doğrudur; süre uzatma ve zorunluluğu kaldırma yetkisi md. 20/1 ile Bakanlığa verilmiştir.
      E: III yanlıştır; denetimde uygulanan usul hükümleri Ceza Muhakemeleri Usulü Kanunu'na aittir.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 20/1
    alinti: haklı ve mücbir sebeplerin varlığı halinde döviz getirme sürelerini uzatmaya ve döviz getirme zorunluluğunu kısmen
      veya tamamen kaldırmaya, bu Kararda öngörülen miktarları değiştirmeye ve miktar belirlemeye yetkilidir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 1/2
    alinti: Bu Karara ve bu Kararın uygulanması amacıyla yayımlanacak yönetmelik, tebliğ ve genelgelere muhalefet, 20/2/1930
      tarihli ve 1567 sayılı Türk Parasının Kıymetini Koruma Hakkında Kanun ile ek ve tadillerine muhalefet sayılır.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 21
    alinti: işlemlerinde Karara aykırılıklar tesbit edilenler hakkında Ceza Muhakemeleri Usulü Kanunu'nun zabıt ve aramaya
      dair hükümleri uygulanır.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 21
    alinti: Bakanlık, bu kişilerin faaliyetlerini kısmen veya tamamen, geçici veya sürekli olarak durdurmaya veya müteakip
      işlemleri teminata bağlamaya, gerektiğinde bu teminatları kısmen veya tamamen Hazine'ye gelir yazmaya veya haklı ve
      mücbir sebeplerin mevcudiyeti halinde teminatı kaldırmaya yetkilidir.
