- id: YMM-DTK-KMB-0048
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: sermaye hareketleri
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik (K) A.Ş.''nin son üç mali yılda döviz geliri yoktur ve muhtemel döviz geliri de tevsik edememektedir.
    Kullanım tarihinde şirketin kredi bakiyesi 4 milyon ABD dolarıdır. Şirket; kamu kuruluşu veya finansal kuruluş değildir,
    yatırım teşvik belgesi, makine-cihaz finansmanı, ihale, savunma sanayii veya kamu özel işbirliği projesi bulunmamaktadır
    ve Bakanlıkça belirlenen esaslar kapsamında özel bir durumu yoktur.

    Şirket, yurt içindeki (X) Bankası''ndan, Karar''ın 17/A maddesinin üçüncü fıkrasının (d) bendine dayanarak döviz kredisi
    kullanmak istemektedir. (X) Bankası lehine rehnedilen teminatlar şunlardır:

    - (X) Bankası İstanbul şubesindeki 900.000 ABD doları vadeli döviz mevduatı

    - (X) Bankası Ankara şubesinde tutulan, Almanya Federal Hükümeti''nce ihraç edilmiş avro cinsinden tahvil: 700.000 ABD
    doları karşılığı

    - (X) Bankası İzmir şubesinde tutulan, ABD Hazinesi''nce ihraç edilmiş ABD doları cinsinden tahvil: 400.000 ABD doları

    - (X) Bankası İstanbul şubesinde tutulan, Türkiye''de yerleşik özel bir holding şirketinin ihraç ettiği ABD doları cinsinden
    eurobond: 600.000 ABD doları

    - (X) Bankası Londra şubesindeki 800.000 ABD doları mevduat

    Almanya ve ABD, OECD üyesidir. Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''a göre şirketin bu kapsamda kullanabileceği
    azami döviz kredisi kaç ABD dolarıdır?

    '
  secenekler:
    A: '900.000'
    B: 2.000.000
    C: 2.600.000
    D: 2.800.000
    E: 3.400.000
  dogru: B
  aciklama:
    dogru_neden: 'Md. 17/A-3''e göre döviz geliri olmayan yerleşik kişiler yurt içinden döviz kredisi temin edemez; kredi
      bakiyesi 15 milyon ABD dolarının altında olduğundan (b) bendi de uygulanmaz. (d) bendine göre bankaların Türkiye''deki
      şubelerinde teminat olarak bulundurulan döviz ve/veya OECD üyesi ülkelerin merkezi yönetimleri ile merkez bankalarınca
      ya da bunların kefaletiyle ihraç edilen yabancı para menkul kıymet tutarını geçmemek üzere kredi kullanılabilir. Sayılacak
      teminatlar: İstanbul şubesindeki döviz mevduatı 900.000 + Alman federal tahvili 700.000 + ABD Hazine tahvili 400.000
      = 2.000.000 ABD doları. Püf noktaları: Teminatın ''yabancı para'' olması yetmez; menkul kıymetin ihraççısı OECD üyesi
      bir ülkenin merkezi yönetimi veya merkez bankası olmalıdır (özel şirket eurobondu sayılmaz). Teminat bankanın Türkiye''deki
      şubelerinde bulunmalıdır; yurt dışı şubedeki mevduat sınıra eklenmez. Kredi bakiyesi bilgisi yalnız (b) bendinin uygulanmadığını
      göstermek içindir.'
    celdiriciler:
      A: Yalnız nakit döviz mevduatı dikkate alınmıştır; OECD üyesi ülkelerin merkezi yönetimlerince ihraç edilen yabancı
        para menkul kıymetler de (d) bendinde sayılmıştır.
      C: Özel holding eurobondu (600.000) da eklenmiştir; (d) bendi yalnız OECD üyesi ülkelerin merkezi yönetimleri ve merkez
        bankalarınca ya da bunların kefaletiyle ihraç edilen menkul kıymetleri kapsar.
      D: Londra şubesindeki mevduat (800.000) da eklenmiştir; (d) bendi bankaların Türkiye'deki şubelerinde bulundurulan teminatı
