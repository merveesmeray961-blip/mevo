    C: I ve III
    D: II ve IV
    E: I, II ve IV
  dogru: A
  aciklama:
    dogru_neden: 'Md. 4/(g) yasağı yalnız Türkiye''de yerleşik kişilerin kendi aralarındaki sözleşmelere uygulanır. I''de
      alıcı dışarıda yerleşik olduğundan (md. 2/c) yasak kapsamı dışındadır. II''de Bay C, md. 2/(b) uyarınca yurt dışında
      işçi olarak çalışan Türk vatandaşı olarak Türkiye''de yerleşik sayılır; gayrimenkul satışı yasak kapsamındadır. III
      taşıt kiralama, IV ise hizmet sözleşmesidir; IV''teki kura göre güncelleme bedeli dövize endeksli hâle getirir. Püf
      noktaları: ''Yurt dışında yaşıyor'' diye yerleşik sayılmayacağını düşünmeyin; yurt dışında işçi, serbest meslek ve müstakil
      iş sahibi Türk vatandaşları Karar''a göre Türkiye''de yerleşiktir. Bedelin Türk lirası yazılması da yeterli değildir;
      kura bağlanması dövize endekslemedir.'
    celdiriciler:
      B: 'II yasaktır: Bay C, md. 2/(b) uyarınca Türkiye''de yerleşik kişidir; yerleşikler arası gayrimenkul satışında bedel
        döviz cinsinden kararlaştırılamaz.'
      C: 'III yasaktır: md. 4/(g) taşıt kiralamayı da açıkça kapsar.'
      D: Hem II hem IV yasaktır; serbest olan I dışarıda bırakılmıştır.
      E: II ve IV yasak kapsamındadır; IV'te bedel Türk lirası yazılsa da kura bağlanarak dövize endekslenmiştir.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
