  kok: 'Türkiye''de yerleşik (A) A.Ş.''nin 2026 yılında yapacağı aşağıdaki sözleşmeler bakımından, Bakanlıkça belirlenen istisnai
    hallerin hiçbirinin uygulanmadığı varsayılacaktır.

    I. Türkiye''de kanuni yerleşim yeri bulunmayan Alman (B) GmbH''ye yapılacak makine satışına ilişkin sözleşme

    II. Almanya''da işçi olarak çalışan Türk vatandaşı Bay C''ye, şirkete ait İzmir''deki bir konutun satışına ilişkin sözleşme

    III. Türkiye''de yerleşik (D) Filo Kiralama A.Ş.''den servis aracı kiralanmasına ilişkin sözleşme

    IV. Türkiye''de yerleşik (E) Yazılım Ltd. Şti. ile yapılan ve bedelin Türk lirası olarak belirlenip her ödeme günündeki
    ABD doları kuruna göre güncelleneceği hizmet sözleşmesi

    Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''a göre bu sözleşmelerden hangilerinde bedel döviz cinsinden veya
    dövize endeksli olarak kararlaştırılabilir?

    '
