- id: YMM-DTK-KMB-0041
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: sermaye hareketleri
  tip: uygulama
  zorluk: 1
  kok: 'Türkiye''de yerleşik (S) A.Ş., Gürcistan''da ticari faaliyette bulunmak üzere %100 iştiraki olacak bir şirket kuracaktır.
    Sermaye taahhüdünün bir kısmını 200.000 ABD doları nakit olarak, kalanını ise kendi mülkiyetindeki bir iş makinesini ayni
    sermaye olarak koyarak yerine getirecektir.

    Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''a göre bu sermaye ihracına ilişkin aşağıdaki ifadelerden hangisi
    doğrudur?

    '
  secenekler:
    A: Nakit bankalar, makine gümrük mevzuatı yoluyla serbestçe ihraç edilir; bankalar ve gümrük idareleri 30 gün içinde Bakanlığa
      ve Ticaret Bakanlığına bildirir.
    B: Nakdi ve ayni sermaye ihracı Bakanlığın önceden vereceği izne bağlıdır; izin başvurusu, ilgili banka ve gümrük idaresi
      aracılığıyla işlem tarihinden önce yapılır.
    C: Nakdi sermaye bankalar aracılığıyla serbestçe ihraç edilir; makinenin ihracında ise şirket, işlem tarihinden itibaren
      30 gün içinde Merkez Bankasına bildirimde bulunur.
    D: Nakdi sermaye bankalar veya yetkili müesseseler aracılığıyla transfer edilir; bildirim yükümlülüğü 50.000 ABD dolarını
      aşan nakdi transferle sınırlıdır.
    E: Makinenin ihracı gümrük mevzuatına göre serbesttir; nakdi sermayenin transferi ise Dış Finansman Numarası alınmasından
      sonra bankalar aracılığıyla yapılır.
  dogru: A
  aciklama:
    dogru_neden: Karar md. 13/1'e göre Türkiye'de yerleşik kişilerin yurt dışında yatırım veya ticari faaliyet amacıyla şirket
      kurmaları için nakdi sermayeyi bankalar aracılığıyla, ayni sermayeyi gümrük mevzuatı hükümleri çerçevesinde ihraç etmeleri
      serbesttir. Md. 13/3'e göre bankalar ve gümrük idareleri sermaye ihraç eden yerleşik kişileri her bir işlem tarihinden
      itibaren 30 gün içinde Bakanlığa (Hazine ve Maliye Bakanlığı) ve Ticaret Bakanlığına bildirir.
    celdiriciler:
      B: Yurt dışına sermaye ihracı izne bağlı değildir; md. 13/1 işlemi serbest bırakmıştır.
      C: Bildirim yükümlüsü şirket değil, bankalar ve gümrük idareleridir; bildirim Merkez Bankasına değil Bakanlığa ve Ticaret
        Bakanlığına yapılır.
      D: Nakdi sermaye yalnız bankalar aracılığıyla ihraç edilir; 50.000 ABD doları eşiği, md. 4/(e)'deki ithalat, ihracat
        ve görünmeyen işlemler dışındaki transferlerin bildirimine ilişkindir, sermaye ihracında her işlem bildirilir.
      E: Dış Finansman Numarası, md. 17/9'da belirli kamu kuruluşlarının yurt dışından sağladığı uzun vadeli kredilere ilişkindir;
        sermaye ihracıyla ilgisi yoktur.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 13/1
    alinti: Türkiye'de yerleşik kişilerin, yurt dışında yatırım yapmak veya ticari faaliyette bulunmak amacıyla şirket kurmaları,
      ortaklığa katılmaları ve şube açmaları için, nakdi sermayeyi bankalar aracılığıyla, ayni sermayeyi ise gümrük mevzuatı
      hükümleri çerçevesinde ihraç etmeleri serbesttir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 13/3
    alinti: Bankalar ve gümrük idareleri yurt dışında yatırım veya ticari faaliyette bulunmak üzere sermaye ihraç eden Türkiye'de
      yerleşik kişileri, her bir işlem tarihinden itibaren 30 gün içinde Bakanlığa ve Ticaret Bakanlığına bildirirler.
