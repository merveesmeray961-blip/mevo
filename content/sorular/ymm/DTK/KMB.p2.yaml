    alinti: Türkiye'de yerleşik kişilerin, Bakanlıkça belirlenen haller dışında, kendi aralarındaki menkul ve gayrimenkul
      alım satım, taşıt ve finansal kiralama dâhil her türlü menkul ve gayrimenkul kiralama, leasing ile iş, hizmet ve eser
      sözleşmelerinde sözleşme bedeli ve bu sözleşmelerden kaynaklanan diğer ödeme yükümlülükleri döviz cinsinden veya dövize
