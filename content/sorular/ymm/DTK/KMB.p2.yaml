  kok: 'Türkiye''de yerleşik (P) A.Ş., Almanya''daki iştirakinin bir Alman bankasından kullanacağı kredi için 24.03.2026 (Salı)
    tarihinde Alman bankasına hitaben kefalet vermiştir. Kefalet bedeli için yurt dışına herhangi bir ödeme ya da transfer
    yapılmamıştır. 23 Nisan 2026 Perşembe günü resmî tatildir.

    Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar''a göre bu kefalete ilişkin Bakanlığa bilgi verme yükümlüsü ve bu
    yükümlülüğün son günü hangisidir?

    '
  secenekler:
    A: Kefalete aracılık eden banka; 23.04.2026 günü sonuna kadar
    B: (P) A.Ş.; 22.04.2026 günü çalışma saati sonuna kadar
    C: (P) A.Ş.; 24.04.2026 günü çalışma saati sonuna kadar
    D: Kefalete aracılık eden banka; 24.04.2026 günü çalışma saati sonuna kadar
    E: (P) A.Ş.; 23.04.2026 günü sonuna kadar
  dogru: C
  aciklama:
    dogru_neden: Md. 18/1'e göre yerleşik kişilerin dışarıda yerleşik kişiler lehine dışarıda yerleşik kişileri muhatap kefalet
      vermeleri serbesttir. Md. 18/5'e göre bankalar yalnız yurt dışına ödenen teminat mektubu, garanti ve kefalet bedelleri
      hakkında transfer tarihinden itibaren bilgi verir; bunların dışındaki yerleşik kişiler ise dışarıda yerleşik kişilere
      hitaben verdikleri kefaletler için düzenleme tarihinden itibaren 30 gün içinde Bakanlığa bilgi verir. Md. 22'ye göre
      işlemin yapıldığı gün (24.03.2026) hesaba katılmaz; 30. gün 23.04.2026'dır. Son gün resmî tatile rastladığından süre,
      tatili izleyen ilk iş günü olan 24.04.2026 Cuma günü çalışma saati sonunda biter.
    celdiriciler:
      A: Ödeme veya transfer olmadığından bankanın bildirim yükümlülüğü doğmaz; ayrıca son günün resmî tatile rastlaması dikkate
        alınmamıştır.
      B: İşlemin yapıldığı gün de sayılmıştır; md. 22'ye göre işlem günü hesaba katılmaz.
      D: Süre doğru hesaplanmıştır; ancak transfer yapılmayan kefalette bilgi verme yükümlüsü kefaleti veren (P) A.Ş.'dir.
      E: Yükümlü doğrudur; ancak 30. gün resmî tatile rastladığından süre izleyen ilk iş gününün çalışma saati sonuna uzar.
    hesap_adimlari:
    - İşlem günü 24.03.2026 sayılmaz; 1. gün 25.03.2026
    - '30. gün: 23.04.2026 (Perşembe, resmî tatil)'
    - Süre, tatili izleyen ilk iş günü 24.04.2026 Cuma çalışma saati sonunda biter
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 18/1
    alinti: Türkiye'de yerleşik kişilerin; yurt dışından gayri nakdi kredi, garanti ve kefalet sağlamaları ile Türkiye'de
      ve dışarıda yerleşik kişiler lehine dışarıda yerleşik kişileri muhatap teminat mektubu düzenlemeleri, garanti ve kefalet
      vermeleri serbesttir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 18/5
    alinti: Bankalar (...), yurt dışına ödenen teminat mektubu, garanti ve kefalet bedelleri hakkında transfer tarihinden
      itibaren, bunların dışındaki Türkiye'de yerleşik kişiler ise, dışarıda yerleşik kişilere hitaben verdikleri garanti
      ve kefaletlerle ilgili olarak düzenleme tarihinden itibaren 30 gün içinde Bakanlığa bilgi verirler.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 22
    alinti: hak doğurucu ve hak düşürücü ve uyulmaması aykırılık oluşturan sürelerin hesaplanmasında, işlemin yapıldığı gün
      hesaba katılmaz. Ancak, hesaplanacak sürelerin son günü resmi tatile rastlarsa, süreler resmi tatili izleyen ilk iş
      gününün çalışma saati sonunda biter.
