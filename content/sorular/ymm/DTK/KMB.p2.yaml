  kok: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar'ın sermaye hareketlerine ilişkin hükümleri bakımından aşağıdaki
    ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Yabancı yatırımcının Türkiye'deki faaliyetinden doğan net kâr ve temettü bankalar aracılığıyla yurt dışına serbestçe
      transfer edilebilir.
    B: Dışarıda yerleşik bir kişinin Türkiye'de sahip olduğu konutun kira gelirleri ve satış bedeli bankalar vasıtasıyla transfer
      ettirilebilir.
    C: Türkiye'de yerleşik bir kişinin yurt dışında konut satın almak için bankalar vasıtasıyla döviz veya Türk parası transfer
      ettirmesi serbesttir.
    D: Türkiye'de yerleşik özel bir tüzel kişinin ihraç edeceği sermaye piyasası araçlarının yurt dışında satışı, SPK'ya kaydettirilmesi
      koşuluyla serbesttir.
    E: Yurt dışı piyasalarda işlem gören menkul kıymetlerin alımı serbesttir; alış bedeli bankalar veya yetkili müesseseler
      aracılığıyla transfer edilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 15/4-(ii)'ye göre Türkiye'de yerleşik kişiler yurt dışındaki mali piyasalarda işlem gören menkul kıymetleri
      bankalar ve yetkili aracı kurumlar vasıtasıyla satın alabilir; alış bedellerinin yurt dışına transferi ise bankalar
      aracılığıyla yapılır. Yetkili müesseseler bu transferi yapamaz; bu nedenle E yanlıştır.
    celdiriciler:
      A: 'Doğrudur: md. 12/2 net kâr ve temettünün bankalar aracılığıyla serbestçe transferine izin verir.'
      B: 'Doğrudur: md. 16/1 dışarıda yerleşik kişilerin gayrimenkul gelirleri ve satış bedellerinin bankalar vasıtasıyla
        transferini serbest bırakır.'
      C: 'Doğrudur: md. 16/2 yurt dışında gayrimenkul alımı için bankalar vasıtasıyla döviz ve Türk parası transferini serbest
        bırakır.'
      D: 'Doğrudur: md. 15/2 kamu kurum ve kuruluşları hariç yerleşik tüzel kişilerin sermaye piyasası araçlarının SPK kaydı
        koşuluyla yurt dışında satışını serbest bırakır; soru özel tüzel kişiye ilişkindir.'
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 15/4-(ii)
    alinti: Türkiye'de yerleşik kişilerin; bankalar ve sermaye piyasası mevzuatına göre yetkili bulunan aracı kurumlar vasıtasıyla
      yurt dışındaki mali piyasalarda işlem gören menkul kıymetleri ve diğer sermaye piyasası araçlarını satın almaları, satmaları
      ve bu kıymetlerin alış bedellerini bankalar aracılığı ile yurt dışına transfer ettirmeleri, serbesttir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 12/2
    alinti: Yabancı yatırımcıların Türkiye’deki faaliyet ve işlemlerinden doğan net kar, temettü, satış, tasfiye ve tazminat
      bedelleri, lisans, yönetim ve benzeri anlaşmalar karşılığında ödenecek meblağlar bankalar aracılığıyla yurt dışına serbestçe
      transfer edilebilir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 15/2
    alinti: Kamu kurum ve kuruluşları hariç olmak üzere, Türkiye’de yerleşik tüzel kişilerce ihraç veya halka arz olunacak
      sermaye piyasası araçlarının, sermaye piyasası mevzuatı çerçevesinde Sermaye Piyasası Kuruluna kaydettirilmesi koşuluyla
      yurt dışında satışı serbesttir.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 16
    alinti: Dışarıda yerleşik kişilerin Türkiye’de satın aldıkları veya sahip oldukları gayrimenkul ve gayrimenkule bağlı
      ayni hakların gelirleri ve satış bedellerinin bankalar vasıtasıyla transfer ettirilmesi serbesttir. (2) Türkiye’de yerleşik
      kişilerce yurtdışında gayrimenkul ve gayrimenkule bağlı ayni hakların satın alınması amacıyla bankalar vasıtasıyla yurtdışına
      döviz ve Türk parası transfer ettirilmesi serbesttir.
