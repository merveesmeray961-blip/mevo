- id: YMM-DTK-KMB-0114
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: yetkili müessese bloke hesabına haciz konulması hâlinde izlenecek usul (Tebliğ 2018-32/45 md. 14/2)
  tip: kavrama
  zorluk: 2
  kok: Bir yetkili müessesenin Bakanlık adına kamu sermayeli bankada bloke olarak izlenen tutarı haciz işlemine konu edilmiştir.
    Tebliğ 2018-32/45'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bakanlık, haczin kaldırılması için yetkili müesseseye 30 gün süre verir ve süre sonunda hesaptaki tutarı doğrudan alacaklıya
      öder.
    B: Bakanlıkça haczin kaldırılması için 90 günlük süre verilir; haciz sürdükçe tutarlar ödenmez, teminat mektubu iade edilmez.
    C: Haciz, bloke hesap bakımından hüküm doğurmaz; hesap doğrudan ve süre aranmaksızın yetkili müesseseye serbest bırakılır.
    D: Yetkili müessesenin faaliyet izni, haczin uygulandığı tarihte herhangi bir işleme gerek kalmaksızın kendiliğinden sona
      erer.
    E: Haciz konulmuşsa bloke hesap derhâl kapatılır ve hesaptaki tutar faiziyle birlikte yetkili müesseseye ödenir.
  dogru: B
  aciklama:
    dogru_neden: 'Md. 14/2: bloke tutarların veya teminat mektubunun haciz, icra takibi ya da ihtiyati tedbire konu edilmesi
