- id: YMM-DTK-KMB-0112
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: bankaların altın, gümüş ve platin kredisi kullandırabileceği kişiler (Tebliğ 2008-32/35 md. 8)
  tip: kavrama
  zorluk: 3
  kok: Tebliğ 2008-32/35 uyarınca bankaların altın, gümüş veya platin kredisi kullandırmasına ilişkin aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Kredi yalnızca Türkiye'de yerleşik gerçek kişilere kullandırılabilir; yurt dışında yerleşik kişilere hiçbir şekilde
      kullandırılamaz.
    B: Kredi, teminat olarak depo hesabı bulunması şartı aranmaksızın herkese kullandırılabilir.
    C: Kredi yalnızca ihracat yapan imalatçılara kullandırılabilir ve her durumda döviz olarak ödenir.
    D: Yurt dışında yerleşik müşteriye yalnızca Türk Lirası, Türkiye'de yerleşik müşteriye ise Türk Lirası veya döviz olarak
      ödeme yapılır.
    E: Kredi, kıymetli maden üreticisi/tacirlerine ve teminat tutarı ile sınırlı olmak üzere diğer kişilere kullandırılabilir.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 8/1 iki grup kişiyi sayar: (a) kıymetli maden üretimi veya ticaretiyle iştigal eden Türkiye''de veya
      yurt dışında yerleşik kişiler; (c) teminat olarak alacakları, Türkiye''deki şubelerinde bulundurulan kıymetli maden
      depo hesabı ve/veya altına dayalı sermaye piyasası aracı tutarını geçmemek üzere Türkiye''de veya yurt dışında yerleşik
      kişiler. Ödemede Türkiye''de yerleşik müşteriye Türk Lirası, yurt dışında yerleşik müşteriye Türk Lirası veya döviz
      esastır. Püf noktaları: teminat, krediyi (c) bendi için sınırlayan tutardır; ödeme para birimi yerleşiklik durumuna
      göre değişir.'
    celdiriciler:
      A: Md. 8/1 (a) ve (c) bentleri yurt dışında yerleşik kişileri de kapsar.
      B: Kredi herkese kullandırılamaz; md. 8/1 yalnızca (a) ve (c) bentlerindeki kişileri sayar ve (c) bendinde teminat tutarı
        üst sınırdır.
      C: Kredi kullanıcıları md. 8/1'de belirtilen kişilerle sınırlıdır ve para birimi yerleşikliğe göre belirlenir; ihracatçı
        şartı yoktur.
      D: 'Ödeme biçimi ters yazılmıştır: Türkiye''de yerleşik müşteriye Türk Lirası, yurt dışında yerleşik müşteriye Türk
        Lirası veya döviz ödenir.'
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/35)
    madde: md. 8/1-a
    alinti: Kıymetli maden üretimi veya ticareti ile iştigal eden Türkiye'de veya yurt dışında yerleşik kişilere,
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/35)
    madde: md. 8/1-c
    alinti: Türkiye’de veya yurtdışında yerleşik kişilere teminat olarak alacakları Türkiye’deki şubelerinde bulundurulan
      kıymetli maden depo hesabı ve/veya altına dayalı sermaye piyasası aracı tutarını geçmemek üzere,
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/35)
    madde: md. 8/1
    alinti: Türkiye’de yerleşik müşteriye Türk Lirası, yurt dışında yerleşik müşteriye ise Türk Lirası veya döviz olarak ödenmesi
      suretiyle;
