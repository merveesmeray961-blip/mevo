- id: YMM-DTK-KMB-0113
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: A grubu yetkili müessesenin şube açabileceği faaliyet bölgeleri ve ilave sermaye/bloke (Tebliğ 2018-32/45 md. 11,
    12)
  tip: hesaplama
  zorluk: 3
  kok: Merkezi 2 numaralı faaliyet bölgesinde bulunan A grubu bir yetkili müessese, 1, 2, 3 ve 4 numaralı faaliyet bölgelerinin
    her birinde birer şube açmak istemektedir. Tebliğ 2018-32/45'e göre şube izni verilebilecek bölgeler, bunlar için gerekli
    toplam ilave ödenmiş sermaye ve şubeler için bloke edilecek (veya teminat mektubuyla karşılanacak) toplam tutar aşağıdakilerden
    hangisinde doğru verilmiştir?
  secenekler:
    A: 1, 2, 3 ve 4 numaralı bölgeler; 12.000.000 TL ilave sermaye; 1.200.000 TL bloke.
    B: Yalnızca 2 numaralı bölge; 3.000.000 TL ilave sermaye; 300.000 TL bloke.
    C: 3 ve 4 numaralı bölgeler; 6.000.000 TL ilave sermaye; 600.000 TL bloke.
    D: 2, 3 ve 4 numaralı bölgeler; 9.000.000 TL ilave sermaye; 900.000 TL bloke.
    E: 2, 3 ve 4 numaralı bölgeler; 9.000.000 TL ilave sermaye; 450.000 TL bloke.
  dogru: D
  aciklama:
    dogru_neden: 'Md. 11/3-b: merkezi 2 numaralı bölgede bulunan A grubu müessese yalnızca 2, 3 ve 4 numaralı bölgelerde şube
      açabilir; 1 numaralı bölgede açamaz. Md. 12/2-a: her şube için ödenmiş sermayeye 3 milyon TL ilave edilir (3 × 3.000.000
      = 9.000.000 TL); md. 12/2-b: bu ilave sermayenin onda biri bloke edilir/teminat mektubu alınır (900.000 TL). Püf noktaları:
      bölge kısıtı yalnızca daha düşük numaralı bölgeleri dışarıda bırakır; bloke tutar ilave sermayenin %10''udur, %5''i
      değil.'
    celdiriciler:
      A: 1 numaralı bölgede şube açılamaz; bu nedenle dört değil üç şube söz konusudur.
      B: Merkezin bulunduğu bölge dâhil 2, 3 ve 4 numaralı bölgelerde şube açılabilir.
      C: 2 numaralı bölge de izinli bölgelerdendir; 3 ve 4 ile sınırlama 3 numaralı bölge merkezleri için geçerlidir.
      E: Bloke tutar ilave sermayenin onda biridir (900.000 TL), yarısı değil.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2018-32/45)
    madde: md. 11/3-b
    alinti: Merkezi 2 numaralı faaliyet bölgesinde bulunan A grubu yetkili müesseseler yalnızca 2, 3 ve 4 numaralı faaliyet
      bölgelerinde şube açabilirler.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2018-32/45)
    madde: md. 12/2-a
    alinti: Her bir şube için 6 ncı maddenin birinci fıkrasının (ç) bendinde belirtilen ödenmiş sermayeye (Değişik ibare:RG-12/10/2021-31626)
      3 milyon Türk Lirası ilave edildiğine ilişkin Türkiye Ticaret Sicili Gazetesi’nin bir nüshası ve artırılansermayenin
      tamamının ödendiğini gösterir bankadan alınacak belge,
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2018-32/45)
    madde: md. 12/2-b
    alinti: Her bir şube için şirket adına 14 üncü madde hükümleri kapsamında, bu fıkranın (a) bendinde yer alan ilave ödenmiş
      sermaye miktarının onda birine karşılık gelen tutarın kamu sermayeli bankalardan birine yatırıldığını tevsik eden belge
      veya kamu/özel sermayeli bankalardan alınacak aynı tutarda teminat mektubu
  gecerlilik:
    baslangic: '2021-10-12'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'izinli = [b for b in (1, 2, 3, 4) if b >= 2]

      sube = len(izinli)

      ilave = sube * 3000000

      bloke = ilave // 10

      sonuc = {"bolgeler": izinli, "ilave": ilave, "bloke": bloke}

      '
