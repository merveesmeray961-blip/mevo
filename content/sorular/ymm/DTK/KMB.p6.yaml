      (altın 1000/1000, diğerleri 100/100) hesabın açılış saflığından farklıdır.'
    celdiriciler:
      A: Altın için asgari saflık 995/1000'dir; 999/1000 yalnızca tercih edilebilecek daha yüksek saflıktır, şart değildir.
      B: 'Oranlar ters yazılmıştır: gümüş 99,9/100, platin 99,95/100''dür.'
      D: Platin 99,95/100 saflık ister; 995/1000 altın içindir.
      E: Md. 4/1 üç maden için de asgari saflık öngörür.
