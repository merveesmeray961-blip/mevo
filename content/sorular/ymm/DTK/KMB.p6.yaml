  tip: bilgi
  zorluk: 2
  kok: Bankalarca açılacak altın, gümüş ve platin depo hesaplarına ilişkin Tebliğ 2008-32/35 hükümlerine göre aşağıdakilerden
    hangisi doğrudur?
