    B: Altın için en az 995/1000 saflık aranır; ancak gümüş için en az 99,95/100, platin için en az 99,9/100 saflık şarttır.
    C: Depo hesapları en az 995/1000 saflıkta altın, 99,9/100 saflıkta gümüş ve 99,95/100 saflıkta platinin teslimi veya bankaca
      satışı suretiyle açılır.
    D: Altın ve platin için aranan asgari saflık aynı olup 995/1000'dir; yalnızca gümüş için 99,9/100 saflık aranır.
    E: Saflık şartı yalnızca altın için (995/1000) aranır; gümüş ve platin depo hesapları saflık şartı olmaksızın bankaca
      açılabilir.
