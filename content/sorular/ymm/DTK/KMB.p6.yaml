- id: YMM-DTK-KMB-0111
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: yurt dışı kıymetli maden kredisiyle yurda sokulan madenin Borsa İstanbul'a tesliminde süre (Tebliğ 2008-32/35 md.
    11/2)
  tip: hesaplama
  zorluk: 3
  kok: Bir kıymetli madenler aracı kuruluşu, yurt dışından sağladığı altın kredisi yoluyla yurda sokulan işlenmemiş altını
    **05.11.2026 (Perşembe)** günü yurda sokmuştur. Cumartesi ve Pazar günleri tatildir, başka tatil yoktur. Tebliğ 2008-32/35'e
    göre bu altının Borsa İstanbul A.Ş.'ye teslim edilmesi gereken son gün hangisidir?
  secenekler:
    A: 10.11.2026
    B: 09.11.2026
    C: 08.11.2026
    D: 11.11.2026
    E: 12.11.2026
  dogru: A
  aciklama:
    dogru_neden: 'Md. 11/2''ye göre kredi yoluyla yurda sokulan işlenmemiş kıymetli madenlerin üç iş günü içinde Borsa İstanbul
      A.Ş.''ye teslimi ve Borsa Yönetim Kurulu''nun belirleyeceği piyasalarda işlem görmesi zorunludur. 32 sayılı Karar md.
      22''ye göre işlemin yapıldığı gün hesaba katılmaz: 06.11 Cuma (1), 09.11 Pazartesi (2), 10.11 Salı (3). Püf noktaları:
      süre takvim günü değil iş günüdür; Cumartesi ve Pazar sayılmaz ve yurda sokulduğu günün kendisi birinci gün sayılmaz.'
    celdiriciler:
      B: Yurda sokulduğu günü birinci gün sayarak bulunan tarihtir; işlem günü hesaba katılmaz.
      C: Üç takvim günü sonrasına denk gelen tarihtir (08.11.2026 Pazar); süre iş günü olarak belirlenmiştir.
      D: Dört iş gününe karşılık gelir; süre üç iş günüdür.
      E: Beş iş gününe karşılık gelir; süre üç iş günüdür.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/35)
    madde: md. 11/2
    alinti: Söz konusu krediler yoluyla yurda sokulan işlenmemiş kıymetli madenlerin üç iş günü içinde (Değişik ibare:RG-7/9/2018-30528)
      Borsa İstanbul A.Ş.’ye teslimi ve Borsa Yönetim Kurulu’nun belirleyeceği piyasalarda işlem görmesi zorunludur.
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 22
    alinti: Ancak, hesaplanacak sürelerin son günü resmi tatile rastlarsa, süreler resmi tatili izleyen ilk iş gününün çalışma
      saati sonunda biter.
  gecerlilik:
    baslangic: '2018-09-07'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "gunler = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\ndef hafta_gunu(y, m, d):\n    t = [0, 3, 2, 5, 0,\
      \ 3, 5, 1, 4, 6, 2, 4]\n    if m < 3:\n        y = y - 1\n    return (y + y // 4 - y // 100 + y // 400 + t[m - 1] +\
      \ d) % 7\ny, m, d = 2026, 11, 5\nsayac = 0\nwhile sayac < 3:\n    d = d + 1\n    if d > gunler[m - 1]:\n        d =\
      \ 1\n        m = m + 1\n    if hafta_gunu(y, m, d) not in (0, 6):\n        sayac = sayac + 1\nsonuc = (y, m, d)\n"
  durum: kontrolde
