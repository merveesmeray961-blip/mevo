- id: YMM-DTK-KMB-0120
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: yurt içi döviz kredisi kullanım sınırı (md. 17/A)
  tip: hesaplama
  zorluk: 3
  kok: 'Döviz geliri bulunan ve 32 sayılı Karar md. 17/A''daki istisnalardan hiçbirinden yararlanmayan (S) A.Ş., yurt içinde
    bir bankadan döviz kredisi kullanacaktır. Şirketin son dört mali yıldaki döviz gelirleri sırasıyla (en eski yıldan en
    yeni yıla) 1.000.000, 1.200.000, 1.800.000 ve 2.000.000 ABD dolarıdır. Kullanım tarihinde şirketin toplam döviz kredi
    bakiyesi 2.500.000 ABD dolarıdır.


    Şirketin bu kullanımda yeni olarak çekebileceği azami döviz kredisi tutarı kaç ABD dolarıdır?

    '
  secenekler:
    A: 1.300.000 ABD Doları
    B: 2.500.000 ABD Doları
    C: 3.500.000 ABD Doları
    D: 5.000.000 ABD Doları
    E: 12.500.000 ABD Doları
  dogru: B
  aciklama:
    dogru_neden: 'Kredi bakiyesi 15 milyon ABD dolarının altında olduğundan md. 17/A(4)-(a) uygulanır: kullanılmak istenen
      kredi tutarı ile mevcut kredi bakiyesinin toplamı son üç mali yılın döviz gelirleri toplamını aşamaz. Son üç yılın geliri
      = 1.200.000 + 1.800.000 + 2.000.000 = 5.000.000; yeni kredi ≤ 5.000.000 − 2.500.000 = 2.500.000 ABD doları. Püf noktaları:
      Eski dördüncü yıl hesaba girmez; sınır yeni kredi ile mevcut bakiyenin toplamına uygulanır. Bankalar bu uygunluğu kontrol
      etmekle yükümlüdür.'
    celdiriciler:
      A: Yalnızca son iki mali yılın döviz gelirleri (3.800.000) esas alınmıştır; kanun son üç mali yılı arar.
      C: Dört yıllık döviz geliri toplamı (6.000.000) esas alınmıştır; oysa yalnızca son üç mali yılın gelirleri sayılır.
      D: Mevcut kredi bakiyesi düşülmemiştir; md. 17/A(4)-(a) kullanılmak istenen kredi ile mevcut bakiyenin toplamını sınırlar.
      E: 15 milyon ABD doları eşiği ile mevcut bakiye arasındaki fark alınmıştır; 15 milyon doların altında kalan bakiyelerde
        sınır son üç yılın döviz gelirleri toplamıdır.
    hesap_adimlari:
    - Son üç mali yılın döviz geliri = 1.200.000 + 1.800.000 + 2.000.000 = 5.000.000 ABD doları
    - Yeni kredi ≤ 5.000.000 − 2.500.000 = 2.500.000 ABD doları
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 17/A-4-a
    alinti: (4) Döviz geliri olan Türkiye'de yerleşik kişilerin yurt içinden kullanacakları döviz kredilerinde; a) Kullanım
      tarihinde, krediyi kullananın kredi bakiyesinin 15 milyon ABD dolarının altında olması durumunda, kullanılmak istenen
      kredi tutarı ile mevcut kredi bakiyesi toplamı son üç mali yılın döviz gelirleri toplamını aşamaz.
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
    madde: md. 11/5-a
    alinti: a) Kullanım tarihinde, krediyi kullananın kredi bakiyesinin 15 milyon ABD Dolarının altında olması durumunda,
      kullanılmak istenen kredi tutarı ile mevcut kredi bakiyesi toplamı son üç mali yılın döviz gelirleri toplamını aşamaz.
  gecerlilik:
    baslangic: '2018-01-25'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'gelirler = [1000000, 1200000, 1800000, 2000000]

      son3 = sum(gelirler[-3:])

      bakiye = 2500000

      sonuc = son3 - bakiye'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kaynakla doğrulandı; tek doğru şık, açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_DTK/DTK_KMB_20261111_1.yaml#2
  - tarih: '2026-11-11'
