- id: YMM-DTK-KMB-0119
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: yolcu beraberi döviz ve Türk parası çıkışı
  tip: uygulama
  zorluk: 2
  kok: 'Türkiye''de yerleşik Bay (L), yurt dışına çıkarken beraberinde 12.000 Avro tutarında efektif ile 150.000 TL tutarında
    Türk parası götürmek istemektedir. Efektif döviz için 10.000 Avro, Türk parası için 185.000 TL eşiklerinin geçerli olduğu
    bir dönemde (2026) 32 sayılı Karar ve Tebliğ 2008-32/34''e göre aşağıdaki ifadelerden hangileri doğrudur?


    I. 12.000 Avro''luk döviz çıkışı için gümrük idarelerine, Ticaret Bakanlığı tarafından yayımlanan nakit beyan formu ile
    beyanda bulunulması gerekir.


    II. 150.000 TL''lik Türk parası çıkışı için de nakit beyan formuyla beyanda bulunulması zorunludur.


    III. Döviz çıkışında beyanda bulunulmaması veya yanlış ya da yanıltıcı beyanda bulunulduğunun tespiti hâlinde değerler
    gümrük idaresince muhafaza altına alınır ve durum şüpheli kabul edilerek Mali Suçları Araştırma Kurulu Başkanlığına bildirilir.


    IV. Bay (L), 185.000 TL''yi aşan Türk parasının yurt dışına çıkarılmasının Bakanlıkça belirlenecek esaslar dahilinde yapılacağını
    dikkate almalıdır.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Tebliğ 2008-32/34 md. 4/2''ye göre yolcu beraberi 10.000 Avro veya eşitini aşan döviz çıkışlarında nakit
      beyan formuyla beyanda bulunulur (I doğru; 12.000 Avro eşiği aşar). Md. 4/3''e göre beyanda bulunulmaması veya yanlış/yanıltıcı
      beyan hâlinde değerler muhafaza altına alınır, durum şüpheli kabul edilip MASAK''a bildirilir (III doğru). 32 sayılı
      Karar md. 3/d: 185.000 TL''yi aşan Türk parasının yurt dışına çıkarılması Bakanlıkça belirlenecek esaslar dahilinde
      yapılır (IV doğru). 150.000 TL bu eşiğin altında olduğundan II yanlıştır. Püf noktaları: Eşikler ''aşan'' ifadesiyle
      aranır; döviz için 10.000 Avro, Türk parası için 185.000 TL ayrı ayrı değerlendirilir.'
    celdiriciler:
      A: 'II yanlıştır: 150.000 TL, 185.000 TL eşiğini aşmadığından Türk parası için beyan zorunluluğu doğmaz. III ve IV de
        doğru olduğu hâlde şıkta yoktur.'
      B: IV de doğrudur; 185.000 TL'yi aşan Türk parası çıkışı Bakanlıkça belirlenecek esaslara tabidir (md. 3/d), bu cümle
        eksik bırakılmıştır.
      D: II yanlıştır (eşik aşılmamıştır) ve 12.000 Avro'luk çıkış için beyan zorunluluğunu içeren I bu şıkta yoktur.
      E: II yanlıştır; 150.000 TL, 185.000 TL eşiğinin altındadır. Ayrıca muhafaza altına alma ve MASAK'a bildirimi içeren
        III doğru olduğu hâlde şıkta yoktur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 3/d
    alinti: 'd) (Ek: 11.06.2015 - 2015/7603 - BKK/1. md.) 185.000 TL’yi aşan Türk parasının yurt dışına çıkarılması Bakanlıkça
      belirlenecek esaslar dahilinde yapılır.'
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 4/f
    alinti: 'f) (Değişik: 11.06.2015 - 2015/7603 - BKK/2. md.) 10.000 Avro veya eşitini aşan efektifin yurt dışına çıkarılması
      Bakanlıkça belirlenecek esaslar dahilinde yapılır.'
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
    madde: md. 4/2
    alinti: Yolcu beraberi yapılan 10.000 Avro veya eşitini aşan döviz çıkışlarında gümrük idarelerine
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
    madde: md. 4/3
    alinti: Yolcu beraberi yapılan 10.000 Avro veya eşitini aşan döviz çıkışlarında beyanda bulunulmaması veya yanlış ya da
      yanıltıcı beyanda bulunulduğunun tespiti halinde söz konusu değerler gümrük idaresince muhafaza altına alınır ve durum
      şüpheli kabul edilerek Mali Suçları Araştırma Kurulu Başkanlığına bildirilir. Ayrıca, gümrük idarelerince Türk Parasının
      Kıymetini Koruma Hakkında Kanunun 3 üncü maddesinin birinci fıkrası uyarınca işlem yapılabilmesini teminen Cumhuriyet
      Savcılıklarına bildirimde bulunulur.
