- id: YMM-DTK-KMB-0121
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: krediler ve kredi kartı (Tebliğ 2008-32/34 md. 11)
  tip: kavrama
  zorluk: 2
  kok: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/34) md. 11''e göre aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Bankalar, Türkiye''de yerleşik kişilere kredi kartlarını yurt dışındaki harcamaları için 50.000 dolarlık limit içerisinde
    rotatif kullandırabilir; limit üzerinde oluşan depasmanın 30 gün içinde kapatılması gerekir.


    II. Yurt dışından temin edilen kredilerin kullanımı için borçlu, kredi sözleşmesi ile birlikte kullanıma aracılık eden
    bankaya başvurmalıdır.


    III. Döviz kredilerinin alınma ve verilmesinde lehte ve aleyhte doğacak kur farkları bankalara aittir.


    IV. Türkiye''de yerleşik kişilerce yurt dışında pay sahibi olunan ortaklıklara, yurt dışındaki ana şirkete ve grup şirketlerine
    döviz veya Türk Lirası kredi açılabilir.

    '
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 11/10: bankalar, yerleşik kişilere kredi kartlarını yurt dışı harcamaları için 50.000 dolarlık limitte
      rotatif kullandırabilir; limit üzerindeki depasman 30 günde kapatılmalıdır (I). Md. 11/2: yurt dışından kredi kullanımı
      için borçlu, sözleşmeyle birlikte aracı bankaya başvurur (II). Md. 11/4: kur farkları ilgililere aittir (III yanlış).
      Md. 11/12: yurt dışındaki pay sahibi olunan ortaklıklara, ana şirkete ve grup şirketlerine kredi açılabilir (IV).'
    celdiriciler:
      A: IV de doğrudur; yurt dışındaki pay sahibi olunan ortaklıklara kredi açılabilir (md. 11/12).
      B: III yanlıştır; md. 11/4'e göre kur farkları ilgililere aittir. Ayrıca I ve IV doğru olduğu hâlde şıkta yoktur.
      D: 'III yanlıştır: kur farkları bankaya değil ilgililere aittir. II de doğru olduğu hâlde şıkta yoktur.'
      E: III yanlıştır (kur farkları ilgililere aittir) ve kredi kartı limitine ilişkin I bu şıkta yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
