- id: YMM-DTK-KMB-0127
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: ihracat bedelini yurda getirmeme cezası (1567 md. 3)
  tip: kavrama
  zorluk: 3
  kok: '1567 sayılı Kanun md. 3''e göre, ihracat alacağını Karar''da tayin edilen süre içinde yurda getirmeyenlere ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Yurda getirmekle yükümlü oldukları kıymetlerin rayiç bedelinin yüzde beşi kadar idari para cezası verilir.


    II. İdari para cezasına ilişkin karar kesinleşinceye kadar alacağını yurda getirenlere, birinci fıkra hükmüne göre idari
    para cezası verilir; ancak bu ceza yurda getirilmesi gereken paranın yüzde ikibuçuğundan fazla olamaz.


    III. Kabahatin konusunu yabancı para oluşturuyorsa ceza hesabında ödeme tarihindeki Merkez Bankası döviz alış kuru esas
    alınır.


    IV. Kabahat bir tüzel kişinin yararına işlenmişse yalnızca tüzel kişiye ceza verilir, fiili işleyen gerçek kişiye verilmez.

    '
  secenekler:
    A: I ve III
    B: I ve II
    C: II ve III
    D: I, II ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Md. 3''e göre süresinde yurda getirmeyenlere kıymetin rayiç bedelinin %5''i kadar idari para cezası verilir
      (I); karar kesinleşinceye kadar getirenlere birinci fıkra hükmüne göre ceza verilir, ancak bu ceza yurda getirilmesi
      gereken paranın %2,5''inden fazla olamaz (II). Yabancı para söz konusu olduğunda fiilin işlendiği tarihteki TCMB döviz
      satış kuru esas alınır (III yanlış). Kabahatin tüzel kişinin yararına işlenmesi hâlinde tüzel kişiye de aynı miktarda
      ceza verilir (IV yanlış). Püf noktaları: ''Alış-satış kuru'' ve ''ödeme-fiil tarihi'' ikililerini karıştırmayın.'
    celdiriciler:
      A: 'III yanlıştır: fiilin işlendiği tarih itibarıyla Merkez Bankasının döviz satış kuru esas alınır. Doğru olan II de
        eksiktir.'
      C: III yanlıştır (fiil tarihindeki döviz satış kuru) ve doğru olan I bu şıkta yoktur.
      D: 'IV yanlıştır: tüzel kişinin yararına işlenmesi hâlinde ilgili tüzel kişiye de aynı miktarda idari para cezası verilir;
        bu, gerçek kişiye ceza verilmeyeceği anlamına gelmez.'
      E: III ve IV yanlıştır; ayrıca I doğru olduğu hâlde şıkta yer almamaktadır.
    hesap_adimlari: []
