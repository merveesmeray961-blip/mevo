    faaliyetini, izin almaksızın bir iş yerinde yürütürken ilk kez tespit edilmiştir. İş yeri başka faaliyetlerde de bulunmakta
    olup yalnızca izinli faaliyet yapmak maksadıyla açılmış değildir.


    1567 sayılı Kanun''un 3. maddesine göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Şirkete 3.000 TL'den 25.000 TL'ye kadar idari para cezası verilir; iş yerindeki faaliyetler durdurulmaz.
    B: Şirkete 50.000 TL'den 250.000 TL'ye kadar idari para cezası verilir ve ceza üst sınırdan uygulanır.
    C: Şirkete 50.000 TL'den 250.000 TL'ye kadar idari para cezası verilir ve iş yerindeki faaliyetler bir aydan altı aya
      kadar durdurulur.
    D: Şirkete rayiç bedelin yarısından iki katına kadar idari para cezası verilir ve iş yeri sürekli kapatılır.
    E: Şirkete 50.000 TL'den 250.000 TL'ye kadar idari para cezası verilir ve iş yerindeki tüm faaliyetler bir ay süreyle
      durdurulur.
  dogru: E
  aciklama:
    dogru_neden: '1567 sayılı Kanun md. 3''ün yetkisiz faaliyete ilişkin fıkrasına göre izin veya yetki belgesi almaksızın
      yetkisiz faaliyette bulunanlara 50.000 TL''den 250.000 TL''ye kadar idari para cezası verilir ve yetkisiz faaliyetin
      gerçekleştirildiği iş yerindeki tüm faaliyetler bir ay süreyle durdurulur. Tekerrür (kararın kesinleşmesini izleyen
      beş yıl) veya iş yerinin sadece yetkisiz faaliyet için açılmış olması hâllerinde ceza üst sınırdan uygulanır; ikinci
      hâlde faaliyetler sürekli durdurulur. Püf noktaları: Durdurma süresi sabittir: ''bir ay süreyle''. Üst sınırdan ceza
      tekerrürde ve iş yerinin yalnızca yetkisiz faaliyet için açıldığı hâlde uygulanır; ikinci hâlde faaliyetler sürekli
      durdurulur.'
    celdiriciler:
      A: Bu aralık, Cumhurbaşkanının genel ve düzenleyici işlemlerindeki yükümlülüklere aykırılığa ilişkin birinci fıkradadır;
        yetkisiz faaliyet için 50.000 – 250.000 TL aralığı ve faaliyetin durdurulması öngörülmüştür.
      B: Üst sınırdan uygulama, kararın kesinleştiği tarihi izleyen beş yıl içinde tekerrür veya iş yerinin yalnızca yetkisiz
        faaliyet için açıldığının anlaşılması hâllerine özgüdür; olayda ilk tespit vardır ve iş yeri başka faaliyetler de
        yürütmektedir.
      C: Kanunda 'bir aydan altı aya kadar' şeklinde bir süre aralığı yoktur; md. 3'e göre iş yerindeki tüm faaliyetler 'bir
        ay süreyle' durdurulur.
      D: Bu ceza aralığı kıymetli eşyanın izinsiz çıkarılması veya sokulması fiiline ilişkindir; ayrıca sürekli durdurma yalnızca
        iş yerinin sadece yetkisiz faaliyet maksadıyla açıldığının anlaşıldığı hâlde söz konusudur.
