- id: YMM-DTK-KMB-0122
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Kambiyo mevzuatı
  konu: KMB
  kazanim: kamu kuruluşlarının dış kredi bildirimleri (DFN)
  tip: uygulama
  zorluk: 3
  kok: 'Hazine ve Maliye Bakanlığının geri ödeme garantisi bulunmayan bir büyükşehir belediyesi, yurt dışından 18 ay vadeli
    bir kredi için kredi anlaşmasını 01.06.2026 tarihinde imzalamıştır (ithalatta vadeli ödeme şekli söz konusu değildir).
    Kredinin ilk kullanımı 14.07.2026 tarihinde gerçekleşmiştir. Kredi Bilgi Formu ve Kredi İzleme Formu''nun (Tebliğ 2008-32/34
    md. 12 uyarınca) Dış Finansman Numarası alınması ve kullanımın bildirilmesi için en geç gönderilmesi gereken tarihler
    sırasıyla hangisidir? (Gün sayımında tatiller dikkate alınmayacak; süreler son günü dahil bu tarihlere kadar kabul edilecektir.)

    '
  secenekler:
    A: 01.07.2026 ve 24.07.2026
    B: 01.07.2026 ve 13.08.2026
    C: 11.06.2026 ve 24.07.2026
    D: 01.09.2026 ve 24.07.2026
    E: 11.06.2026 ve 13.08.2026
  dogru: A
  aciklama:
    dogru_neden: 'Tebliğ md. 12/1: Hazine geri ödeme garantisi olmaksızın dış kredi anlaşması yapan büyükşehir belediyeleri,
      bir yıldan uzun vadeli kredi anlaşmalarını Kredi Bilgi Formu ve Kredi İzleme Formu ile birlikte DFN alınması için anlaşma
      tarihinden itibaren 30 gün içinde gönderir: 01.06.2026 + 30 gün = 01.07.2026. Kullanım, anapara geri ödemesi, faiz ve
      diğer ödeme bilgileri gerçekleşme tarihinden itibaren 10 gün içinde gönderilir: 14.07.2026 + 10 gün = 24.07.2026. Püf
      noktaları: İki süre farklıdır (30 gün – 10 gün); vade bir yıldan (365 gün) uzunsa kapsama girilir.'
    celdiriciler:
      B: Kullanım bilgileri için süre 30 gün değil, gerçekleşme tarihinden itibaren 10 gündür.
      C: DFN için gönderme süresi anlaşma tarihinden itibaren 10 gün değil, 30 gündür.
      D: Anlaşma bildirimi için üç aylık süre yoktur; süre anlaşma tarihinden itibaren 30 gündür.
      E: 'Süreler ters eşleştirilmiştir: anlaşma bildirimi 30 gün, kullanım bildirimi 10 gündür.'
    hesap_adimlari:
    - Anlaşma tarihi 01.06.2026 + 30 gün = 01.07.2026
    - Kullanım tarihi 14.07.2026 + 10 gün = 24.07.2026
  kaynaklar:
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
    madde: md. 12/1
    alinti: bu Tebliğ’in eki Ek:2’de yer alan Kredi Bilgi Formu ve Ek:3’de yer alan Kredi İzleme Formu ile birlikte, Dış Finansman
      Numarası (DFN) alınmasını teminen, anlaşma tarihinden itibaren 30 gün içinde
