    alinti: Türkiye’de yerleşik kişilerce yurt dışından temin edilen kredilerin kullanımı için borçlunun, kredinin vadesi,
      faiz oranı ve benzeri bilgileri içeren kredi sözleşmesi ile birlikte kullanıma aracılık eden bankaya başvurması gereklidir.
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
    madde: md. 11/4
    alinti: Döviz kredilerinin alınma ve verilmesinde lehte ve aleyhte doğacak kur farkları ilgililere aittir.
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
