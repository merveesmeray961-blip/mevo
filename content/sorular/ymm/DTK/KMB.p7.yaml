  tip: kavrama
  zorluk: 3
  kok: 'Tebliğ 2018-32/48 md. 9''a göre ihracat bedelinin yurda getirilememesine neden olan mücbir sebep hallerinin belgelendirilmesine
    ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. İhracatçı veya ithalatçı firmanın iflası ile ihtilaf nedeniyle dava açılması veya tahkime başvurulması hâlleri yetkili
    mercilerden alınan belgelerle tevsik edilir.


    II. Malların kaybı, hasara uğraması veya imha edilmesi hâli sigorta şirketlerinden, uluslararası gözetim şirketlerinden
    veya ilgili ülke resmi makamlarından alınan belgelerle tevsik edilir.


    III. Tabii afet hâli, ithalatçının bulunduğu memleketin resmi makamlarından veya mahalli odaca tasdik edilmiş olmak kaydıyla
    alıcı ya da ithalatçı firmadan alınan belgelerle tevsik edilebilir.


    IV. Mücbir sebep hallerine ilişkin yurt dışından temin edilen belgelerin onaylanması gerekmez.

    '
  secenekler:
    A: I ve II
    B: I, II ve III
    C: II ve IV
    D: I ve III
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Md. 9/1''e göre (a) ve (e) hâlleri (iflas, dava/tahkim vb.) yetkili mercilerden; (b) ve (ç) hâlleri ithalatçının
      bulunduğu memleketin resmi makamlarından veya mahalli odaca tasdik edilmiş alıcı ya da ithalatçı firmadan (harp ve abluka
      hâli hariç); (d) hâli sigorta şirketlerinden, uluslararası gözetim şirketlerinden veya ilgili ülke resmi makamlarından
      alınan belgelerle tevsik edilir (I, II, III doğru). Md. 9/2''ye göre yurt dışından temin edilen belgelerin dış temsilciliklerimizce
      veya Lahey Sözleşmesi hükümlerine göre onaylanması gerekir (IV yanlış). Püf noktaları: Belgeyi düzenleyecek merci mücbir
      sebebin türüne göre değişir; yurt dışından temin edilen belgeler ayrıca onay şartına tabidir.'
    celdiriciler:
      A: III de doğrudur; tabii afet hâli mahalli odaca tasdikli alıcı firma belgesiyle de tevsik edilebilir.
      C: 'IV yanlıştır: yurt dışından temin edilecek belgelerin dış temsilciliklerimizce veya Lahey Sözleşmesi hükümlerine
        göre onaylanmış olması gerekir (md. 9/2). Ayrıca I ve III doğrudur.'
      D: II de doğrudur; mal kaybı, hasar veya imha hâli sigorta şirketi, gözetim şirketi veya resmi makam belgeleriyle tevsik
        edilir.
      E: IV yanlıştır; md. 9/2 yurt dışından temin edilen belgelerin dış temsilciliklerimizce veya Lahey Sözleşmesine göre
        onaylanmasını arar.
    hesap_adimlari: []
