      rotatif kullandırabilirler. Ancak hesap bakiyelerinde $50.000.- lık limit üzerinde oluşacak depasmanın 30 gün içerisinde
      kapatılması gerekir.
  - mevzuat: 'Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (Tebliğ No: 2008-32/34)'
