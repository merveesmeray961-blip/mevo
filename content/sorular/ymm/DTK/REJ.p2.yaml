- id: YMM-DTK-REJ-0045
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: serbest dolaşıma giriş
  tip: uygulama
  zorluk: 2
  kok: '(A) A.Ş.''nin serbest dolaşıma giriş beyannamesi 03.03.2026 tarihinde tescil edilmiştir. Eşyaya uygulanan gümrük vergisi
    oranı (tarımsal mali yük niteliğinde değildir), 04.03.2026 tarihinde yürürlüğe giren bir kararla %12''den %8''e indirilmiştir.
    Vergiler henüz ödenmemiş ve teminata bağlanmamıştır; gümrük işlemleri beyan sahibinden kaynaklanan bir nedenle gecikmemiştir.

    4458 sayılı Gümrük Kanunu''na göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Vergiler, gümrük yükümlülüğünün başladığı tescil tarihindeki %12 oranı üzerinden hesaplanır.
    B: Beyan sahibi, vergiler ödenmeden veya teminata bağlanmadan önce lehe olan %8 oranını isteyebilir.
    C: İndirilmiş %8 oranı, beyan sahibinin talebi aranmaksızın gümrük idaresince kendiliğinden uygulanır.
    D: Lehe oran uygulaması yalnız tarımsal mali yükler için mümkün olduğundan %12 oranı uygulanır.
    E: '%8 oranından ancak vergiler %12 üzerinden ödendikten sonra geri verme yoluyla yararlanılabilir.'
  dogru: B
  aciklama:
    dogru_neden: 'Md. 75/1: tarımsal mali yükler dışındaki ithalat vergisi oranlarının serbest dolaşıma giriş beyannamesinin
      tescilinden sonra, fakat vergilerin ödenmesinden veya teminata bağlanmasından önce indirilmesi halinde beyan sahibi
      lehine olan oranın uygulanmasını isteyebilir. Gecikme beyan sahibinden kaynaklanmadığından md. 75/2''deki engel de yoktur.'
    celdiriciler:
      A: Genel kural (md. 193/1, tescil tarihindeki oran) md. 75/1'deki özel hükümle beyan sahibi lehine istisnaya tabi tutulmuştur.
      C: Md. 75/1 lehe oranın uygulanmasını beyan sahibinin isteğine bağlamıştır; idare kendiliğinden uygulamaz.
      D: 'Ters yöndedir: md. 75/1 tarımsal mali yükleri bu imkânın dışında tutar.'
      E: Lehe oran, vergiler ödenmeden veya teminata bağlanmadan önce talep edilerek uygulanır; önce ödeme yapılması gerekmez,
        ödendikten sonra bu hüküm işlemez.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 75/1
    alinti: Beyan sahibi, tarımsal mali yükler dışında kalan ithalat vergilerinin oranlarının serbest dolaşıma giriş beyannamesinin
      tescil tarihinden sonra, fakat eşyaya ilişkin gümrük vergilerinin ödenmesinden veya teminata bağlanmasından önce indirilmesi
