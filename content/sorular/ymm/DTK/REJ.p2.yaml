  kok: 4458 sayılı Gümrük Kanunu'na göre gümrük antrepo rejimine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Özel antrepoya, işleticinin onay vermesi şartıyla üçüncü kişilere ait eşya da konulabilir.
    B: Eşyanın antrepoda kalış süresi sınırsızdır; idare gerekirse yeni bir işlem için süre belirleyebilir.
    C: Antrepo işletme izni, Türkiye'de temsilci tayin etmeleri şartıyla yurt dışında yerleşik kişilere de verilebilir.
    D: Fuar ve sergilere konulan eşya için antrepo işleticisinden istenen teminat yarı oranda uygulanır.
    E: Antrepo işleticisinin hak ve yükümlülükleri, gümrük idaresinin iznine gerek olmaksızın devredilebilir.
  dogru: B
  aciklama:
    dogru_neden: Md. 101/1'e göre eşyanın antrepo rejimi altında kalış süresi sınırsızdır; ancak gümrük idarelerince gerek
      görülen hallerde gümrükçe onaylanmış yeni bir işlem veya kullanım tayini için süre belirlenebilir.
    celdiriciler:
      A: 'Md. 94/1-(b): özel antrepolar yalnız antrepo işleticisine ait eşyanın konulması amacıyla kurulur; herkesin kullanabildiği
        antrepo genel antrepodur.'
      C: 'Md. 95/3: antrepo işletme izni yalnızca Türkiye''de yerleşik kişilere verilir; temsilci tayini bu şartı karşılamaz.'
      D: 'Md. 98: fuar ve sergilere konulan, ithalat vergilerinden muaf olan veya ihraç edilmek üzere antrepoya konulan eşya
        için teminat hiç aranmaz.'
      E: 'Md. 95/4: işleticinin hak ve yükümlülükleri ancak Gümrük Müsteşarlığının (bugün ilgili Bakanlığın) izniyle başka
        bir kişiye devredilebilir.'
