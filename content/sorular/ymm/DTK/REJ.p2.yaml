    madde: md. 101/1
    alinti: Eşyanın antrepo rejimi altında kalış süresi sınırsızdır. Ancak, gümrük idarelerince gerek görülen hallerde, eşyaya
      gümrükçe onaylanmış yeni bir işlem veya kullanım tayin edilmesi için bir süre belirlenebilir.
