  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 129/2
    alinti: gümrük idareleri vergilerin tümünü teminata bağlamak suretiyle, geçici ithalat rejiminin kullanılmasına izin verebilirler.
