  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: geçici ithalat
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu''na göre geçici ithalat rejimine ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. Özel süreler saklı kalmak üzere, eşyanın geçici ithalat rejimi altında kalma süresi azami yirmi dört aydır.

    II. Kısmi muafiyetle alınacak ithalat vergileri toplamı, faizler hariç, eşyanın rejime tabi tutulduğu tarihte serbest
    dolaşıma girmesi halinde alınacak vergileri aşamaz.

    III. Tam muafiyetle geçici ithal edilen eşya için gümrük yükümlülüğü doğduğunda vergiler, geçici ithalat beyanının yapıldığı
    tarihteki oranlarla hesaplanır.

    IV. İthal eşyasının ayniyet tespiti mümkün değilse, geçici ithalat rejiminin kullanılmasına vergiler teminata bağlansa
    bile izin verilemez.

    '
  secenekler:
    A: I ve III
    B: II ve IV
    C: I, II ve III
    D: II, III ve IV
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: 'Md. 130/2: md. 131''e göre belirlenecek özel süreler saklı kalmak üzere azami süre yirmi dört aydır (I).
      Md. 133/2: kısmi muafiyette alınacak vergiler, faizler hariç, rejime tabi tutulduğu tarihte serbest dolaşıma girseydi
      alınacak vergileri aşamaz (II).'
    celdiriciler:
      A: 'III yanlıştır: md. 134/1''e göre beyan tarihindeki oranlar kural olarak kısmi muafiyette esas alınır; tam muafiyetle
        geçici ithal edilen eşyada yükümlülük doğarsa md. 193''te belirtilen tarihteki (yükümlülüğün başladığı tarih) oran
        ve unsurlar uygulanır.'
      B: 'IV yanlıştır: md. 129/2''ye göre ayniyet önlemlerinin alınmaması rejimin kötüye kullanılmasına yol açmayacaksa,
        vergilerin tümü teminata bağlanarak izin verilebilir. I de dışarıda bırakılmıştır.'
      C: III yanlıştır; tam muafiyette md. 193'teki tarih esas alınır (md. 134/1, ikinci cümle).
      D: III ve IV yanlıştır (md. 134/1 ve 129/2); doğru olan I dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 130/2
    alinti: 131 inci madde uyarınca tespit edilecek özel süreler saklı kalmak üzere, eşyanın geçici ithalat rejimi altında
      kalma süresi azami yirmidört ay olarak belirlenir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 133/2
    alinti: Alınacak ithalat vergileri tutarı, uygulanacak faizler hariç olmak üzere, söz konusu eşyanın geçici ithalat rejimine
      tabi tutulduğu tarihte serbest dolaşıma girmesi halinde alınacak vergileri aşamaz.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 134/1
    alinti: Ancak, tam muafiyet suretiyle geçici ithal edilen eşya ile ilgili olarak gümrük yükümlülüğü doğması halinde, 193
