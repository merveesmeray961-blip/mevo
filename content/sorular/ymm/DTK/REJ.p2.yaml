  zorluk: 1
  kok: '4458 sayılı Gümrük Kanunu''na göre transit rejimine ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. Havayoluyla yapılan transit taşımalarda, yönetmelikle belirlenen haller dışında teminat aranmaz.

    II. Birden fazla transit işlemi için kapsamlı teminat, Müsteşarlık tarafından izin verilmesi halinde kullanılabilir.

    III. Teminattan vazgeçme izni, yüksek risk içerdiği belirlenen eşyanın transit işlemlerinde de uygulanır.

    IV. Transit rejimine tabi eşya, şüphe veya ihbar durumları hariç, varış gümrük idaresine kadar muayene edilmeksizin sevk
    edilir.

    '
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 85/1: transit eşyası için teminat zorunludur, ancak havayolu, boru hattı, demiryolu ve denizyolu taşımalarında
      yönetmelikle belirlenen haller dışında teminat aranmaz (I). Md. 85/2-(b): birden fazla transit işlemi için kapsamlı
      teminat Müsteşarlık izniyle kullanılır (II). Md. 88/1: transit eşya, şüphe veya ihbar hariç, varış gümrük idaresine
      kadar muayene edilmeksizin sevk edilir (IV).'
    celdiriciler:
      A: Eksiktir; IV de doğrudur (md. 88/1).
      B: 'III yanlıştır: md. 85/5''e göre teminattan vazgeçme izni, yüksek risk içerdiği belirlenen eşyanın transit işlemlerinde
        uygulanmaz.'
      D: III yanlıştır (md. 85/5); doğru olan II dışarıda bırakılmıştır.
      E: III yanlıştır (md. 85/5); doğru olan I dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 85/1
    alinti: Transit eşyası için tahakkuk edebilecek gümrük vergilerinin ödenmesini sağlamak üzere teminat verilmesi zorunludur.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 85/5
