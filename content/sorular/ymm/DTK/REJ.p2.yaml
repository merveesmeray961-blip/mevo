  kok: '4458 sayılı Gümrük Kanunu''na göre dahilde işleme rejiminin şartlı muafiyet ve geri ödeme sistemlerine ilişkin aşağıdaki
    ifadelerden hangileri doğrudur?

    I. Şartlı muafiyet sisteminde ithal eşyasının vergileri teminata bağlanır; eşyanın işlem görmüş ürün şeklinde ihracında
    teminat iade edilir.

    II. Geri ödeme sisteminde eşya serbest dolaşıma girer; işlem görmüş ürünlerin ihracında, serbest dolaşıma girişte tahsil
    edilen ithalat vergileri geri verilir.

    III. Serbest dolaşıma giriş beyannamesinin tescili sırasında kota kapsamında tarife önlemi uygulanan eşya geri ödeme sisteminden
    yararlanabilir.

    IV. Geri ödeme sisteminde, işlem görmüş ürünlerin serbest bölgeye konulduğunun belgelendirilmesi halinde de ithalat vergilerinin
    geri verilmesi istenebilir.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: I, III ve IV
  dogru: D
  aciklama:
    dogru_neden: Md. 108/1 şartlı muafiyet sistemini (vergiler teminata bağlanır, ihraçta teminat iade edilir), md. 108/2
      geri ödeme sistemini (serbest dolaşıma girişte tahsil edilen vergiler ihraçta geri verilir) tanımlar. Md. 121/1-(c)'ye
      göre işlem görmüş ürünlerin serbest bölgeye konulduğu belgelendirilerek de geri verme istenebilir.
    celdiriciler:
      A: Eksiktir; IV de doğrudur (md. 121/1-c).
      B: 'III yanlıştır: md. 117/1-(b)''ye göre kota kapsamında tarife önlemleri uygulanan eşya için geri ödeme sistemi uygulanmaz.'
      C: Eksiktir; şartlı muafiyet sistemini doğru tanımlayan I de doğrudur (md. 108/1).
      E: III yanlıştır (md. 117/1-b); doğru olan II dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 108/1
    alinti: Eşyanın işlem görmüş ürünler şeklinde ihracı halinde, teminat iade olunur. Eşyanın bu şekilde dahilde işleme rejiminden
      yararlanmasına şartlı muafiyet sistemi denir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
