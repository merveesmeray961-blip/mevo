  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: dahilde işleme rejimi – geri ödeme sistemi
  tip: uygulama
  zorluk: 2
  kok: Dahilde işleme rejiminin geri ödeme sistemi kapsamında, serbest dolaşıma giriş beyannamesinin tescili sırasında aşağıdaki
    eşyadan hangisi geri ödeme sisteminden yararlanabilir? (Diğer tüm şartlara uyulduğu kabul edilecektir.)
  secenekler:
    A: İthalatı miktar kısıtlamasına tabi olduğundan yıllık limit uygulanan bir kimyasal ürün
    B: Miktar, kota ve lisans kısıtı bulunmayan; işlem görmüş ürününe ihracat iadesi veya vergisi konulmamış bir hammadde
    C: Kota kapsamında tarife önlemi uygulanan indirimli oranlı bir plastik granül
    D: Tarım politikası çerçevesinde ithalat lisansı ibrazını gerektiren işlenmiş bir gıda maddesi
    E: Elde edilecek işlem görmüş ürün için ihracat iadesi bulunan bir ara mal
  dogru: B
  aciklama:
    dogru_neden: Md. 117/1'e göre geri ödeme sisteminden her eşya yararlanabilir. Ancak beyannamenin tescili sırasında ithalat
      miktar kısıtlamasına tabi olan, kota kapsamında tarife önlemi uygulanan, tarım politikası çerçevesinde ithalat veya
      ihracat lisansı ya da sertifikası ibrazı gerektiren ve işlem görmüş ürün için ihracat iadesi veya vergisi bulunan eşya
      için sistem uygulanmaz. B şıkkındaki hammaddede bu engellerin hiçbiri yoktur.
    celdiriciler:
      A: Miktar kısıtlamasına tabi eşya md. 117/1-(a) gereği sistemden yararlanamaz.
      C: Kota kapsamında tarife önlemi uygulanan eşya md. 117/1-(b) gereği sistemden yararlanamaz.
      D: Tarım politikası kapsamında lisans ibrazı gerektiren eşya md. 117/1-(c) gereği sistemden yararlanamaz.
      E: İşlem görmüş ürün için ihracat iadesi bulunması md. 117/1-(d) gereği engeldir.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 117/1
    alinti: 1. Geri ödeme sisteminden her eşya yararlanabilir. Ancak, serbest dolaşıma giriş beyannamesinin tescili sırasında;
