- id: YMM-DTK-REJ-0093
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: dahilde işleme rejimi – geri ödeme sistemi
  tip: kavrama
  zorluk: 2
  kok: 'Dahilde işleme rejimi kapsamında geri ödeme sistemiyle serbest dolaşıma girmiş ithal eşyasından elde edilen işlem
    görmüş ürünlerle ilgili olarak, diğer tüm şartlara uyulmuş olmak kaydıyla aşağıdaki olaylardan hangileri, ithalat vergilerinin
    geri verilmesini veya kaldırılmasını isteme dayanağı oluşturur?


    I. Ürünlerin ihraç edildiğinin belgelendirilmesi


    II. Ürünlerin daha sonra yeniden ihraç edilmek üzere gümrük antrepo rejimine tabi tutulduğunun belgelendirilmesi


    III. Ürünlerin serbest bölgeye konulduğunun belgelendirilmesi


    IV. Ürünlerin Türkiye''de nihai tüketiciye satıldığının belgelendirilmesi'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I, II ve III
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: Md. 121/1'e göre izin hak sahibi; işlem görmüş ürünlerin ihraç edildiğini, daha sonra yeniden ihraç edilmek
      üzere transit, antrepo, geçici ithalat veya şartlı muafiyetli dahilde işleme rejimine tabi tutulduğunu ya da serbest
      bölgeye konulduğunu belgelendirerek vergilerin geri verilmesini isteyebilir. İç piyasada satış bu sayılanlar arasında
      yoktur.
    celdiriciler:
      A: Yalnız ihracı saymak eksiktir; II ve III de md. 121/1'de sayılmıştır.
      B: Serbest bölgeye konulma (III) da md. 121/1-(c) kapsamındadır.
      C: İhracın (I) kendisi md. 121/1-(a) gereği geri ödeme dayanağıdır.
      E: Yurt içi satış md. 121/1'de yer almaz; iç piyasaya satış vergi iadesi doğurmaz.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 121/1
    alinti: 1. İzin hak sahibi, geri ödeme sistemi çerçevesinde serbest dolaşıma giren ithal eşyasından elde edilmiş işlem
      görmüş ürünlerin veya değişmemiş eşyanın; a) İhraç edildiklerini, b) Daha sonra yeniden ihraç edilmek üzere transit
      rejimi, gümrük antrepo rejimi, geçici ithalat rejimi veya şartlı muafiyet sistemine tabi dahilde işleme rejimine tabi
      tutulduğunu, c) Serbest bölgeye konulduğunu, Belgelendirmek ve rejimin uygulanmasına ilişkin diğer tüm şartlara uyulmuş
      olmak kaydıyla, ithalat vergilerinin geri verilmesini veya kaldırılmasını isteyebilir.
