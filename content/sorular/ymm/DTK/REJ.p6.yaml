- id: YMM-DTK-REJ-0091
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: gümrük antrepo rejimi
  tip: kavrama
  zorluk: 1
  kok: Dış ticaretle uğraşan (S) A.Ş.'nin serbest dolaşıma girmemiş bir partisi, genel antrepoda iki yıldır antrepo rejimi
    altındadır. Gümrük idaresi eşyaya yeni bir işlem veya kullanım tayini için herhangi bir süre belirlememiştir. Eşya ihracata
    bağlı önlemlerden yararlanabilecek tarım ürünü değildir. 4458 sayılı Gümrük Kanunu'na göre aşağıdaki değerlendirmelerden
    hangisi doğrudur?
  secenekler:
    A: Antrepo rejiminde kalış süresi en çok iki yıldır; bu süre dolduğu için eşya tasfiyeye tabi tutulur.
    B: Kalış süresi bir yıldır ve gümrük idaresinin izniyle bir yıl daha uzatılabilir; ikinci yıl sonunda rejim sona erer.
    C: Kalış süresi, geçici ithalat rejimindeki gibi azami yirmi dört aydır; bu süre aşıldığı için gümrük borcu doğar.
    D: Süreyi gümrük idaresi belirlemedikçe eşya antrepoda bekletilemez; idarenin süre belirlememesi rejimi sona erdirir.
    E: Kalış süresi sınırsızdır; idare gerek gördüğü hallerde yeni bir işlem veya kullanım tayini için süre belirleyebilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 101/1'e göre eşyanın antrepo rejimi altında kalış süresi sınırsızdır. İdare, gerek gördüğü hallerde yeni
      bir işlem veya kullanım tayini için süre belirleyebilir. Olayda süre belirlenmediğinden iki yıllık bekleme tek başına
      bir sonuç doğurmaz.
    celdiriciler:
      A: Antrepoda kural olarak azami süre yoktur; iki yıl geçmesi tasfiye sebebi değildir.
      B: Bir yıl artı bir yıl şeklinde bir sınır md. 101'de yer almaz.
      C: Yirmi dört ay sınırı geçici ithalat rejimine (md. 130/2) aittir; antrepoya uygulanmaz.
      D: Md. 101'e göre süre belirlenmemesi eşyanın bekletilmesine engel değildir; süre sınırsızdır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 101/1
    alinti: Madde 101 – 1. Eşyanın antrepo rejimi altında kalış süresi sınırsızdır. Ancak, gümrük idarelerince gerek görülen
