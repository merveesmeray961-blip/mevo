      edilmeksizin ve gerektiğinde mühür altına alınarak veya memur eşliğinde sevk edilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 88/2
    alinti: Antrepolardan veya gümrük idarelerince konulmasına izin verilen diğer yerlerden transit rejimi kapsamında taşınan
      eşya, gerek görülmesi halinde muayene edilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
