- id: YMM-DTK-REJ-0102
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: antrepo rejiminde teminat, kalış süresi ve serbest dolaşımdaki eşya (md. 98-101)
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu''nun antrepo rejimine ilişkin hükümlerine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Gümrük idareleri, antrepo işleticisinden hiçbir hâlde teminat istemez; çünkü teminat yalnızca kullanıcıdan aranır.


    II. Eşyanın antrepo rejimi altında kalış süresi sınırsızdır; ancak gümrük idarelerince gerek görülen hâllerde eşyaya gümrükçe
    onaylanmış yeni bir işlem veya kullanım tayin edilmesi için bir süre belirlenebilir.


    III. Teminat alınmış olsa bile gümrük işlemlerine başlanmadan ve bu işlemler bitirilip gümrük idaresinin izni alınmadan
    antrepolardan kısmen veya tamamen eşya çıkartılamaz.


    IV. Ekonomik yönden bir ihtiyaç bulunması ve gümrük gözetiminin olumsuz etkilenmemesi koşuluyla, ihraç amacı dışında serbest
    dolaşımda bulunan eşyanın gümrüklü antrepoya konulmasına Müsteşarlıkça belirlenecek şartlar altında izin verilebilir.

    '
  secenekler:
    A: I, II ve III
    B: II ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Md. 98/1''e göre gümrük idareleri antrepo işleticisinden 96 ncı maddedeki sorumluluklarla ilgili bir teminat
      ister; yalnızca fuar-sergi, ithalat vergisinden muaf veya ihraç edilmek üzere konulan eşya için teminat aranmaz (I yanlış).
      Md. 101/1: antrepo rejimi altında kalış süresi sınırsızdır, gerek görülen hâllerde yeni işlem/kullanım için süre belirlenebilir
      (II doğru). Md. 98/3: teminat alınmış olsa bile izinsiz eşya çıkarılamaz (III doğru). Md. 100: ekonomik ihtiyaç ve gözetimin
      olumsuz etkilenmemesi koşuluyla ihraç amacı dışında serbest dolaşımdaki eşyanın gümrüklü antrepoya konulmasına izin
      verilebilir (IV doğru).'
    celdiriciler:
      A: 'I yanlıştır: gümrük idareleri antrepo işleticisinden 96 ncı maddedeki sorumluluklarla ilgili olarak teminat ister;
        yalnızca sayılan eşya için teminat aranmaz. IV de doğru olduğu hâlde şıkta yoktur.'
      B: IV de doğrudur; serbest dolaşımdaki eşyanın ihraç amacı dışında gümrüklü antrepoya konulması md. 100 uyarınca belirli
        şartlarda mümkündür.
      C: I yanlıştır (işleticiden teminat istenir); sınırsız kalış süresine ilişkin II ise doğru olduğu hâlde şıkta yoktur.
      E: I yanlıştır; antrepo işleticisinden teminat istenmesi kuraldır, istisnası fuar-sergi, ithalat vergisinden muaf veya
        ihraç edilmek üzere konulan eşyadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 98/1
    alinti: gümrük idareleri, antrepo işleticisinden 96 ncı maddede belirtilen sorumluluklarla ilgili olarak yönetmelikle
      belirlenen esaslar çerçevesinde bir teminat ister.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 98/2
    alinti: Ancak, fuar ve sergilere konulan veya ithalat vergilerinden muaf olan yahut ihraç edilmek üzere antrepolara konulan
      eşya için teminat aranmaz.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 98/3
    alinti: Teminat alınmış olsa bile, gümrük işlemlerine başlanmadan ve bu işlemler bitirilip gümrük idaresinin izni alınmadan,
      antrepolardan kısmen veya tamamen eşya çıkartılamaz.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 101/1
    alinti: Eşyanın antrepo rejimi altında kalış süresi sınırsızdır. Ancak, gümrük idarelerince gerek görülen hallerde, eşyaya
      gümrükçe onaylanmış yeni bir işlem veya kullanım tayin edilmesi için bir süre belirlenebilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
