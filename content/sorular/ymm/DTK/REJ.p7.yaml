- id: YMM-DTK-REJ-0101
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: ithalden önce eşdeğer eşyadan elde edilen ürünlerin ihracında teminat (md. 109)
  tip: hesaplama
  zorluk: 3
  kok: 'Dahilde işleme izni sahibi (E) A.Ş., eşdeğer eşya uygulamasından yararlanarak aşağıdaki işlem görmüş ürünleri ihraç
    etmiştir. Ürünlerin hepsi ihracat vergisine tabi eşdeğer eşyadan elde edilmiştir.


    | İhracat | Gümrük kıymeti | İhracat vergisi oranı | İthal eşyasının durumu |

    |---|---|---|---|

    | 1 | 600.000 TL | %5 | Henüz ithal edilmemiştir |

    | 2 | 300.000 TL | %5 | İhracattan önce ithal edilmiş ve rejime tabi tutulmuştur |

    | 3 | 200.000 TL | %10 | Henüz ithal edilmemiştir |


    4458 sayılı Gümrük Kanunu md. 109''a göre izin hak sahibinden alınacak toplam teminat kaç TL''dir?

    '
  secenekler:
    A: 20.000 TL
    B: 30.000 TL
    C: 45.000 TL
    D: 50.000 TL
    E: 65.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Md. 109 son fıkra: henüz ithal edilmemiş eşyanın yerine ihracat vergilerine tabi eşdeğer eşyadan elde edilen
      işlem görmüş ürünlerin ihracı halinde, ithal eşyasının süresi içinde ithal edilmesine karşılık izin hak sahibinden ihracat
      vergileri kadar teminat alınır. Birinci ihracat: 600.000 × %5 = 30.000 TL; üçüncü ihracat: 200.000 × %10 = 20.000 TL.
      İkinci ihracatta ithal eşyası ihracattan önce ithal edildiğinden teminat doğmaz. Toplam teminat 50.000 TL''dir. Püf
      noktaları: Teminat ''henüz ithal edilmemiş'' eşya için alınır; ihracat vergisi tutarı kadardır, ihracat kıymetinin tamamı
      değildir.'
    celdiriciler:
      A: Yalnızca üçüncü ihracat için hesaplanan teminattır (200.000 × %10); birinci ihracat da henüz ithal edilmemiş eşyaya
        ilişkindir.
      B: Yalnızca birinci ihracat için hesaplanan teminattır (600.000 × %5); üçüncü ihracat da henüz ithal edilmemiş eşyaya
        ilişkindir.
      C: Birinci ve ikinci ihracat toplanmıştır; ikinci ihracatta ithal eşyası ihracattan önce ithal edildiğinden teminat
        aranmaz, üçüncü ihracat ise unutulmuştur.
      E: Üç ihracatın tamamı için teminat hesaplanmıştır; ithal eşyası ihracattan önce ithal edilen ikinci ihracat için teminat
        alınmaz.
    hesap_adimlari:
    - '1. ihracat: 600.000 × %5 = 30.000 TL'
    - '2. ihracat: ithal eşyası ihracattan önce ithal edildiğinden teminat yok'
    - '3. ihracat: 200.000 × %10 = 20.000 TL'
    - Toplam teminat = 30.000 + 20.000 = 50.000 TL
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 109 son fıkra
    alinti: Henüz ithal edilmemiş eşyanın yerine ihracat vergilerine tabi eşdeğer eşyadan elde edilen işlem görmüş ürünlerin
      ihracı halinde, ithal eşyasının süresi içinde ithal edilmesine karşılık olarak izin hak sahibinden, ihracat vergileri
      kadar teminat alınır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 109/1
    alinti: İşlem görmüş ürünlerin eşdeğer eşyadan elde edilmesine veya eşdeğer eşyadan elde edilen işlem görmüş ürünlerin
      ithal eşyasının serbest dolaşıma girmesinden önce Türkiye Gümrük Bölgesi dışına ihraç edilmesine izin verilebilir.
  gecerlilik:
    baslangic: '2009-07-07'
    bitis: null
    yila_bagli_tutar: false
