- id: YMM-DTK-REJ-0099
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: transit rejiminde asıl sorumlu ve taşıyıcının yükümlülükleri (md. 86)
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu md. 86''ya göre transit rejimine ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Asıl sorumlu, eşyayı öngörülen süre içerisinde ve ayniyetin tespiti amacıyla alınan önlemlere uymak suretiyle varış
    gümrük idaresine sağlam ve noksansız sunmakla yükümlüdür.


    II. Eşyanın transit rejimine göre taşındığını bilerek kabul eden taşıyıcı veya alıcı da eşyayı varış gümrük idaresine
    sağlam ve noksansız sunmakla yükümlüdür.


    III. 183 ve 184 üncü maddeler kapsamında bir gümrük yükümlülüğü doğduğunda asıl sorumlu, transit rejimine tabi eşya ile
    ilgili olarak gümrük idaresine karşı mali olarak sorumludur.


    IV. 5607 sayılı Kanun uyarınca işlem yapıldığı hâllerde asıl sorumlunun sorumluluğu, fiilin işlenmesinde dahlinin olup
    olmadığına bakılmaksızın doğrudan doğruya tespit edilir.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 86/1: asıl sorumlu, eşyayı süresi içinde, ayniyet tespitine yönelik önlemlere uyarak varış gümrük idaresine
      sağlam ve noksansız sunmakla yükümlüdür (I doğru). Md. 86/2: transit rejimine göre taşındığını bilerek eşyayı kabul
      eden taşıyıcı veya alıcı da aynı yükümlülük altındadır (II doğru). Md. 86/3: 183 ve 184 üncü maddeler kapsamında gümrük
      yükümlülüğü doğduğunda asıl sorumlu gümrük idaresine karşı mali olarak sorumludur (III doğru). Aynı fıkraya göre 5607
      sayılı Kanun uyarınca işlem yapıldığında asıl sorumlunun sorumluluğu belirlenirken fiilin işlenmesinde dahlinin olup
      olmadığı dikkate alınır; bu nedenle IV yanlıştır.'
    celdiriciler:
      A: III de doğrudur; mali sorumluluğa ilişkin md. 86/3 hükmü bu şıkta eksik bırakılmıştır.
      B: II de doğrudur; eşyayı transit rejimine göre taşındığını bilerek kabul eden taşıyıcı veya alıcı da aynı sunma yükümlülüğü
        altındadır (md. 86/2).
      D: 'IV yanlıştır: 5607 sayılı Kanun uyarınca işlem yapılan hâllerde asıl sorumlunun sorumluluğu belirlenirken fiilin
        işlenmesinde dahlinin olup olmadığı dikkate alınır. Ayrıca I bu şıkta yoktur.'
      E: IV yanlıştır; kanun, 5607 sayılı Kanun uygulamasında sorumluluğun belirlenmesinde dahil olma durumunun dikkate alınmasını
        öngörür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 86/1
    alinti: Asıl sorumlu, eşyayı öngörülen süre içerisinde ve gümrük idareleri tarafından eşyanın ayniyetinin tespiti amacıyla
      alınan önlemlere uymak suretiyle, varış gümrük idaresine sağlam ve noksansız olarak sunmak ve transit rejimine ilişkin
      hükümlere uymakla yükümlüdür.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 86/2
    alinti: rejimine göre taşındığını bilerek eşyayı kabul eden taşıyıcı veya alıcı da eşyayı öngörülen süre içerisinde ve
      gümrük idareleri tarafından eşyanın ayniyetinin tespiti amacıyla alınan tedbirlere uymak suretiyle, varış gümrük idaresine
      sağlam ve noksansız olarak sunmakla yükümlüdür.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 86/3
    alinti: 183 ve 184 üncü maddeler kapsamında bir gümrük yükümlülüğü doğduğunda, asıl sorumlu, transit rejimine tabi tutulan
      eşya ile ilgili olarak gümrük idaresine karşı mali olarak sorumludur. 5607 sayılı Kanun uyarınca gümrük idaresince işlem
      yapıldığı hâllerde, asıl sorumlunun sorumluluğunun belirlenmesinde fiilin işlenmesinde dahlinin olup olmadığı hususu
      dikkate alınır.
