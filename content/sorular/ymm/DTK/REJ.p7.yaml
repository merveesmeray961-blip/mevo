  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: antrepo türleri, fuar ve sergiler, işletme izni ve devir (md. 94-95)
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu''nun gümrük antreposu ve işletme iznine ilişkin hükümleri bakımından aşağıdaki ifadelerden
    hangileri doğrudur?


    I. Serbest dolaşımda olmayan eşyanın sergilendiği fuar ve sergiler de antrepo sayılır.


    II. Gümrük antreposu işletme izni yalnızca Türkiye''de yerleşik kişilere verilir.


    III. Antrepo işleticisinin hak ve yükümlülükleri, yetkili makamın izni ile başka bir kişiye devredilebilir.


    IV. Parlayıcı ve patlayıcı eşya, niteliğine bakılmaksızın herhangi bir genel antrepoya konulabilir.

    '
  secenekler:
    A: I ve II
    B: II ve IV
    C: I, II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 94/3: serbest dolaşımda olmayan eşyanın sergilendiği fuar ve sergiler de antrepo sayılır (I doğru).
      Md. 95/3: izin yalnızca Türkiye''de yerleşik kişilere verilir (II doğru). Md. 95/4: antrepo işleticisinin hak ve yükümlülükleri
      izinle başka bir kişiye devredilebilir (III doğru). Md. 94/2: parlayıcı ve patlayıcı veya bir arada bulundukları eşya
      için tehlikeli olan ya da korunmaları özel düzenek ve yapılara gerek gösteren eşya ancak bu niteliklerine uygun genel
      veya özel antrepolara konulabilir (IV yanlış).'
    celdiriciler:
      A: III de doğrudur; antrepo işleticisinin hak ve yükümlülüklerinin izinle devri md. 95/4'te öngörülmüştür.
      B: 'IV yanlıştır: parlayıcı ve patlayıcı eşya ancak bu niteliklerine uygun genel veya özel antrepolara konulabilir.
        I ve III doğru olduğu hâlde şıkta yoktur.'
      D: IV yanlıştır (niteliğine uygun antrepo şartı vardır); ayrıca Türkiye'de yerleşik kişilere izin verilmesine ilişkin
        II şıkta yoktur.
      E: IV yanlıştır; parlayıcı ve patlayıcı eşya için niteliklerine uygun antrepo gerekir.
