  konu: REJ
  kazanim: transit eşyasının muayenesi, aktarma ve mücbir sebep (md. 88, 92)
  tip: kavrama
  zorluk: 2
  kok: 4458 sayılı Gümrük Kanunu hükümlerine göre transit rejimiyle ilgili aşağıdaki ifadelerden hangisi **doğru değildir**?
  secenekler:
    A: Transit rejimine tabi eşya, şüphe veya ihbar durumları hariç olmak üzere, varış gümrük idaresine kadar muayene edilmeksizin
      sevk edilir.
    B: Antrepolardan transit rejimi kapsamında taşınan eşya hiçbir surette muayene edilemez; muayene yalnızca varış gümrük
      idaresinde yapılabilir.
    C: Transit halindeki eşyanın beklenmeyen hâl veya mücbir sebeple telef veya kaybının kanıtlanması halinde gümrük vergileri
      aranmaz.
    D: Seyir halindeki transit taşıtın beklenmeyen hâl veya mücbir sebeple yoluna devam edememesi durumu gecikmeksizin en
      yakın gümrük idaresine bildirilir.
    E: Transit eşyanın seyir sırasında bir taşıttan diğerine aktarılması gümrük idarelerinin gözetimi altında yapılır ve bir
      tutanakla belgelendirilir.
  dogru: B
  aciklama:
    dogru_neden: Md. 88/2'ye göre antrepolardan veya gümrük idarelerince konulmasına izin verilen diğer yerlerden transit
      rejimi kapsamında taşınan eşya, gerek görülmesi halinde muayene edilir; muayene 61 ila 70 inci madde hükümlerine göre
      yapılır ve asıl sorumlu ya da temsilcisi de hazır bulunabilir. Dolayısıyla 'hiçbir surette muayene edilemez' ifadesi
      yanlıştır. Diğer şıklar md. 88/1 ile md. 92/1 ve 92/2 hükümlerini doğru yansıtır.
    celdiriciler:
      A: Doğru bir ifadedir (md. 88/1); soru doğru olmayanı sorduğundan elenir.
      C: Doğru bir ifadedir (md. 92/2); soru doğru olmayanı sorduğundan elenir.
      D: Doğru bir ifadedir (md. 92/1); soru doğru olmayanı sorduğundan elenir.
      E: Doğru bir ifadedir (md. 92/1); soru doğru olmayanı sorduğundan elenir.
