  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: kaçakçılık ve 5607 sayılı Kanun
  tip: bilgi
  zorluk: 1
  kok: Bay (T), yurt dışından getirdiği ve ithali yasak olmayan elektronik eşyayı gümrük kapıları dışından, gümrük
    işlemlerine tabi tutmaksızın ülkeye sokmuştur. Eşya akaryakıt, tütün veya alkollü içki değildir; fiil örgüt
    faaliyeti çerçevesinde işlenmemiştir. 5607 sayılı Kaçakçılıkla Mücadele Kanunu'na göre Bay (T) hakkında uygulanacak
    yaptırım hangi seçenekte doğru verilmiştir?
  secenekler:
    A: Bir yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası; ceza yarısından iki katına kadar artırılır
    B: Bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası; ceza yarı oranında artırılır
    C: İki yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası; ceza üçte birinden yarısına kadar
      artırılır
    D: İki yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası; ceza artırılmaz
    E: Bir yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası; ceza üçte birinden yarısına kadar
      artırılır
  dogru: E
  aciklama:
    dogru_neden: Md. 3/1'e göre eşyayı gümrük işlemlerine tabi tutmaksızın ülkeye sokan kişiye bir yıldan beş yıla
      kadar hapis ve on bin güne kadar adlî para cezası verilir; eşyanın gümrük kapıları dışından sokulması hâlinde
      ceza üçte birinden yarısına kadar artırılır.
    celdiriciler:
      A: Yarısından iki katına kadar artırım, eşyanın akaryakıt, tütün, alkol gibi ürünler olması hâline (md. 3/10)
        özgüdür.
      B: Bir yıldan üç yıla kadar hapis transit eşyasına ilişkin fiillerin (md. 3/3) cezasıdır; yarı oranında artırım
        üç veya daha fazla kişiyle işlenmeye (md. 4/2) ilişkindir.
      C: İki yıldan beş yıla kadar hapis, aldatıcı işlemle vergiyi ödemeden eşya sokmanın (md. 3/2) cezasıdır.
      D: İki yıldan altı yıla kadar hapis ve yirmi bin gün adlî para cezası, ithali yasak eşyaya (md. 3/7) ilişkindir.
