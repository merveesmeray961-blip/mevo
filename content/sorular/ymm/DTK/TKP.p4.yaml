- id: YMM-DTK-TKP-0013
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: ithalatta haksız rekabetin önlenmesi (damping ve sübvansiyon)
  tip: hesaplama
  zorluk: 3
  kok: '(G) A.Ş., damping soruşturması sırasında geçici önlem uygulanan bir malı iki ayrı partide ithal etmiş ve
    geçici önlem kapsamında teminat vermiştir. Soruşturma, dampingli ithalatın maddi zarara neden olduğunun belirlenmesiyle
    sonuçlanmış ve kesin önlem yürürlüğe girmiştir. Partilere ait veriler şöyledir:


    | Parti | Verilen teminat | Kesinleşen dampinge karşı vergi |

    |---|---|---|

    | 1 | 800.000 TL | 1.000.000 TL |

    | 2 | 700.000 TL | 400.000 TL |


    3577 sayılı Kanun''un 14. maddesine göre (G) A.Ş.''nin bu iki parti için kesin olarak yüklendiği dampinge karşı
    vergi toplamı kaç TL''dir?

    '
  secenekler:
    A: 1.200.000
    B: 1.300.000
    C: 1.400.000
    D: 1.500.000
    E: 1.700.000
  dogru: A
  aciklama:
    dogru_neden: 'Md. 14''e göre kesinleşen vergi teminattan yüksekse fark tahsil edilmez; düşükse fark geri ödenir.
      Parti 1''de 800.000 TL''lik teminat kesinleşir, 200.000 TL''lik fark tahsil edilmez. Parti 2''de 400.000 TL
      kesinleşir, 300.000 TL iade edilir. Toplam 800.000 + 400.000 = 1.200.000 TL. Püf noktaları: Kural her parti
      için ayrı uygulanır ve sonuç, her partide teminat ile kesin verginin küçüğüdür; zarar türü maddi zarar olduğundan
      teminatın tahsili için ayrıca Kurul belirlemesi aranmaz.'
    celdiriciler:
      B: Parti 1'deki 200.000 TL fark yanlış yönde iade edilmiş gibi teminattan düşülmüştür (1.500.000 − 200.000).
      C: Parti 1'de teminatı aşan fark da tahsil edilmiştir (1.000.000 + 400.000); Kanun bu farkı tahsil etmez.
      D: Parti 2'deki fazla teminat iade edilmemiştir (800.000 + 700.000).
      E: Hem fark tahsil edilmiş hem fazla teminat iade edilmemiştir (1.000.000 + 700.000).
    hesap_adimlari:
    - 'Parti 1: min(800.000; 1.000.000) = 800.000'
    - 'Parti 2: min(700.000; 400.000) = 400.000; 300.000 iade'
    - Toplam = 1.200.000 TL
