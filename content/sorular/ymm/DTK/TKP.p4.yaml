- id: YMM-DTK-TKP-0006
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: gümrük kanunu muafiyetleri
  tip: uygulama
  zorluk: 2
  kok: 'Aşağıda verilen ve ihracından itibaren iki yıl içinde ayniyeti değişmeden (işlem görmüş ürünlerde ihraç
    edildiği hâliyle) geri gelen eşyadan hangilerine Gümrük Kanunu''nun 168–170. maddelerine göre geri gelen eşya
    muafiyeti uygulanır?


    I. Hariçte işleme rejimi çerçevesinde onarılmak üzere ihraç edilen ve onarılarak geri gelen tezgâh

    II. Hariçte işleme rejimi çerçevesinde ihraç edilen, ancak hiçbir işleme tabi tutulmadan aynen ihraç edildiği
    durumda geri gelen tezgâh

    III. İhracı bir dış ticaret önlemine konu olan ve bu önleme ilişkin istisna şartları belirlenmemiş eşya

    IV. Dahilde işleme rejimi uygulandıktan sonra ihraç edilen ve sonra geri gelen işlem görmüş ürün

    '
  secenekler:
    A: Yalnız I
    B: I ve III
    C: II ve III
    D: II ve IV
    E: I, II ve IV
  dogru: D
  aciklama:
    dogru_neden: Md. 168/2'ye göre muafiyet, aynen ihraç edildiği durumda olması hâli hariç hariçte işleme rejimiyle
      ihraç edilen eşyaya (I) ve ihracı dış ticaret önlemine konu eşyaya (III) tanınmaz. Hariçte işleme eşyası aynen
      ihraç edildiği durumda geri gelirse istisna dışında kalmaz (II). Md. 170 uyarınca 168 ve 169. madde hükümleri
      dahilde işleme sonrasında ihraç edilip geri gelen işlem görmüş ürünlere de uygulanır (IV).
