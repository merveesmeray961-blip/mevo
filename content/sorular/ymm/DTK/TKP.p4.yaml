  kok: (B) A.Ş., ithalatta gözetim uygulamasına tabi bir malı Mart 2026'da ithal etmiştir. Malın CIF bedeli 3.000.000
    TL, gözetim bedeli 5.000.000 TL'dir; aradaki fark tevsik edilemediğinden gümrük beyannamesinde yurt dışı gider
    olarak beyan edilmiştir. Gümrük vergisi oranı %10, KDV oranı %20'dir; başka vergi ve gider yoktur. 7846 sayılı
    Cumhurbaşkanı Kararı ve KDV Genel Uygulama Tebliği'ne göre (B) A.Ş.'nin bu ithalat nedeniyle indirim konusu
    yapabileceği KDV kaç TL'dir?
  secenekler:
    A: '440.000'
    B: '600.000'
    C: '660.000'
    D: '700.000'
    E: 1.100.000
  dogru: C
  aciklama:
    dogru_neden: 'Gümrük vergisi gözetim bedeli üzerinden hesaplanır: 5.000.000 × %10 = 500.000; KDV matrahı 5.500.000,
      KDV 1.100.000 TL. Tevsik edilemeyen 2.000.000 TL ve buna isabet eden 200.000 TL gümrük vergisi nedeniyle ödenen
      KDV (2.200.000 × %20 = 440.000) indirilemez. İndirilebilir KDV: (3.000.000 + 300.000) × %20 = 660.000 TL.'
