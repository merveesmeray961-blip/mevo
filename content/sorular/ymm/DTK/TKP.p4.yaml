  kok: Bay (Y), gümrük kapısından ve gümrük işlemlerine tabi tutmaksızın ülkeye motorin sokmuştur (5607 sayılı Kanun
    md. 3/1). Mahkeme, md. 3/1'deki sınırlar içinde temel hapis cezasını 1 yıl 6 ay olarak belirlemiş; eşyanın akaryakıt
    olması nedeniyle md. 3/10 uyarınca uygulanacak artırımı yarı oranında takdir etmiştir. Başka bir artırım veya
    indirim sebebi yoktur. Buna göre Bay (Y) hakkında hükmedilecek hapis cezası ne kadardır?
  secenekler:
    A: 1 yıl 6 ay
    B: 2 yıl
    C: 2 yıl 3 ay
    D: 3 yıl
    E: 4 yıl 6 ay
  dogru: D
  aciklama:
    dogru_neden: 'Md. 3/10''a göre kaçakçılık konusu eşya akaryakıt ise cezalar yarısından iki katına kadar artırılır,
      ancak bu fıkranın uygulanmasıyla verilecek ceza üç yıldan az olamaz. 1 yıl 6 ay + yarısı (9 ay) = 2 yıl 3
      ay; bu sonuç üç yıllık alt sınırın altında kaldığından ceza 3 yıl olarak belirlenir. Püf noktaları: Artırım
      hesaplandıktan sonra md. 3/10''daki üç yıllık alt sınır ayrıca kontrol edilir. Eşya gümrük kapısından sokulduğu
      için md. 3/1''deki gümrük kapıları dışı artırımı uygulanmaz.'
    celdiriciler:
      A: Akaryakıt nedeniyle yapılması gereken artırım ve alt sınır dikkate alınmamıştır.
      B: Md. 3/1'deki üçte bir artırım uygulanmıştır; eşya gümrük kapısından sokulmuştur ve akaryakıt artırımı md.
        3/10'a göre yapılır.
      C: Yarı oranında artırım doğru hesaplanmış, ancak üç yıllık alt sınır gözden kaçırılmıştır.
      E: İki kat artırım uygulanmıştır; mahkeme artırımı yarı oranında takdir etmiştir.
