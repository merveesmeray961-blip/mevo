      D: Gözetim bedeli üzerinden hesaplanan gümrük vergisinin tamamı indirilebilir matraha katılmıştır (3.500.000
        × %20).
      E: Ödenen KDV'nin tamamı indirilmiştir; gözetim farkına isabet eden KDV'nin indirim hakkı kaldırılmıştır.
    hesap_adimlari:
    - GV = 5.000.000 × 0,10 = 500.000; toplam KDV = 5.500.000 × 0,20 = 1.100.000
    - İndirilemeyen = (2.000.000 + 200.000) × 0,20 = 440.000
    - İndirilebilen = (3.000.000 + 300.000) × 0,20 = 660.000
