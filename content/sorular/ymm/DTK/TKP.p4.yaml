  konu: TKP
  kazanim: gümrük kanunu muafiyetleri
  tip: uygulama
  zorluk: 1
  kok: Serbest dolaşımda bulunan bir makine 10 Mart 2023'te Türkiye Gümrük Bölgesinden kesin ihracat yoluyla ihraç
    edilmiştir. Makine hariçte işleme rejimi kapsamında ihraç edilmemiş, ihracı bir dış ticaret önlemine konu değildir
    ve ayniyeti değişmeden geri getirilecektir; beklenmeyen hal veya mücbir sebep yoktur. Gümrük Kanunu'nun 168.
    maddesine göre makine en geç hangi tarihe kadar yeniden serbest dolaşıma girerse, beyan sahibinin talebi üzerine
    ithalat vergilerinden muaf tutulur?
  secenekler:
    A: 10 Mart 2024
    B: 10 Eylül 2024
    C: 10 Mart 2025
    D: 10 Eylül 2025
    E: 10 Mart 2026
  dogru: E
  aciklama:
    dogru_neden: Geri gelen eşyada muafiyet, eşyanın ihraç edildikten sonra üç yıl içinde ve ayniyeti değişmeden
      yeniden serbest dolaşıma girmesi hâlinde, beyan sahibinin talebiyle uygulanır (md. 168/1, 169). 10 Mart 2023
      + 3 yıl = 10 Mart 2026.
    celdiriciler:
      A: Bir yıllık süre esas alınmıştır; Kanun'daki süre üç yıldır.
      B: Bir buçuk yıllık süre esas alınmıştır.
      C: İki yıllık süre esas alınmıştır.
      D: İki buçuk yıllık süre esas alınmıştır.
