  tip: bilgi
  zorluk: 1
  kok: Gümrük Kanunu'nun 177. maddesine göre tasfiyelik hâle gelen eşyanın tespit ve tahakkuk belgeleri (I) içinde
    tasfiye idaresine intikal ettirilir; tasfiye idaresi, tasfiyeye konu eşyayı (II) içinde teslim almakla mükelleftir.
    Tasfiye edilmesine karar verilen eşya bulunamazsa ithal eşyası için (III) kıymeti ile buna ilişkin gümrük vergileri
    tahsil edilir. Boşluklara sırasıyla aşağıdakilerden hangisi gelmelidir?
  secenekler:
    A: 'I: on beş gün – II: otuz gün – III: FOB'
    B: 'I: otuz gün – II: on beş gün – III: CIF'
    C: 'I: otuz gün – II: otuz gün – III: CIF'
    D: 'I: otuz gün – II: altmış gün – III: FOB'
    E: 'I: altmış gün – II: otuz gün – III: CIF'
  dogru: C
  aciklama:
    dogru_neden: Md. 177/4'e göre tespit ve tahakkuk belgeleri otuz gün içinde tasfiye idaresine intikal ettirilir
      ve tasfiye idaresi eşyayı otuz gün içinde teslim almakla mükelleftir. Md. 177/3'e göre eşya bulunamazsa ithal
      eşyasında CIF, ihraç eşyasında FOB kıymeti ile gümrük vergileri tahsil edilir.
    celdiriciler:
      A: İntikal süresi on beş gün değil otuz gündür; ithal eşyasında kıymet FOB değil CIF'tir.
      B: Tasfiye idaresinin teslim alma süresi de otuz gündür.
      D: Teslim alma süresi altmış gün değildir; FOB ihraç eşyası için kullanılır.
      E: İntikal süresi altmış gün değil otuz gündür.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 177/4
    alinti: Tasfiye idaresi, tasfiyeye konu eşyayı otuz gün içinde teslim almakla mükelleftir.
