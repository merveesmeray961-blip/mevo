    400 avro olan hediyelik eşya

    II. Yerleşim yeri Almanya''da olan Bay (H)''nin İzmir''de kiraladığı konutunda kullanmak üzere getirdiği ev
    eşyası

    III. İstanbul''daki bir ticari fuarda kullanılmak ve tüketilmek üzere getirilen ürünler

