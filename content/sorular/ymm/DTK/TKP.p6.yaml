- id: YMM-DTK-TKP-0020
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: 5607 md. 12 yasak eşyanın geri gönderilmesi
  tip: uygulama
  zorluk: 2
  kok: Yabancı bir ülkeden gelen ve ithali yasak olan eşyanın gümrüğe getirilmesi hâlinde 5607 sayılı Kaçakçılıkla Mücadele
    Kanunu'nun 12. maddesine göre uygulanacak işlemlerle ilgili aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Yükleme veya taşıma belgelerinde belirtilerek getirilen yasak eşya, kaçakçılık suçu sayıldığından soruşturma sonuçlanıncaya
      kadar gümrükte muhafaza altında tutulur.
    B: Toplum ve çevre sağlığı yönünden tehlikeli ve zararlı eşya ile atık maddeler, ancak ilgililer hakkında soruşturma işlemleri
      tamamlandıktan sonra getirildiği ülkeye iade edilir.
    C: Yükleme veya taşıma belgelerinde belirtilen yasak eşya, teminat alınmaksızın yalnızca geldiği yere iade edilebilir,
      başka bir ülkeye sevk edilemez.
    D: Kaçakçılık fiilinin konusunu toplum ve çevre sağlığı yönünden tehlikeli eşya ile atık maddeler oluşturuyorsa, ilgililer
      hakkında soruşturma başlatılmakla birlikte bu eşya derhal getirildiği ülkeye iade edilir.
    E: Belgelerde belirtilen yasak eşya geri gönderilemez; yalnızca gümrük idaresince imha edilir ve ilgililere ceza verilir.
  dogru: D
  aciklama:
    dogru_neden: 'Md. 12/2: Kaçakçılık fiilinin konusunu toplum ve çevre sağlığı yönünden tehlikeli ve zararlı eşya ile atık
      maddelerin oluşturması hâlinde, ilgililer hakkında soruşturma işlemleri başlatılmakla birlikte bu eşya gümrük yetkililerince
      derhal getirildiği ülkeye iade edilir.'
    celdiriciler:
      A: Md. 12/1 belgelerde belirtilerek gelen yasak eşyanın muhafazasını değil, teminat altında iade ve sevkini öngörür.
      B: Md. 12/2 iadenin derhal yapılacağını söyler; soruşturmanın tamamlanması beklenmez.
      C: Md. 12/1 eşyanın teminat altında ve güvenlik tedbirleri alınarak geldiği yere veya diğer bir ülkeye iade ve sevk
        edilebileceğini belirtir.
      E: Belgelerde belirtilen yasak eşya için kanun iade ve sevk yolunu açık tutmuştur; imha zorunlu değildir ve belge beyanı
        tek başına ceza gerektirmez.
  kaynaklar:
