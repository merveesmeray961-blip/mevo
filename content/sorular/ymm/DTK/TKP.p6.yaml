  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: damping ve telafi edici verginin birlikte uygulanamaması
  tip: kavrama
  zorluk: 1
  kok: Bir mal hakkında yürütülen soruşturmada, malın hem dampingli ithal edildiği hem de menşe ülkesince sübvanse edildiği
    belirlenmiştir. Her iki durumun da aynı zararı doğurduğu anlaşıldığına göre, 3577 sayılı İthalatta Haksız Rekabetin Önlenmesi
    Hakkında Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Aynı durumun telafisi için dampinge karşı vergi ile telafi edici vergi birlikte alınır; toplam vergi iki tutarın toplamı
      kadar olur.
    B: Dampinge karşı vergi konulursa sübvansiyon dikkate alınmaz; telafi edici vergi yalnız damping tespit edilemezse uygulanır.
    C: Her iki vergi birlikte uygulanabilir; ancak bunun için malın ithalatının yasaklanmış olması gerekir.
    D: Aynı durumun telafisi için dampinge karşı vergi ve telafi edici vergi birlikte uygulanamaz.
    E: Yalnız telafi edici vergi uygulanabilir; dampinge karşı vergi, sübvansiyonlu mallarda hiçbir şekilde alınamaz.
  dogru: D
  aciklama:
    dogru_neden: Md. 13'e göre soruşturmaya konu mal için hem damping yapılmış hem de sübvansiyon verilmişse, aynı durumun
      telafisi için dampinge karşı vergi ve telafi edici vergi birlikte uygulanamaz. Hangi verginin uygulanacağı soruşturma
      sonucuna göre belirlenir.
    celdiriciler:
      A: Md. 13 iki verginin birlikte uygulanmasını açıkça yasaklar; toplam vergi iki tutarın toplamı olamaz.
      B: Kanunda dampinge karşı verginin önceliğini ya da telafi edici verginin yalnız ikincil kalmasını düzenleyen bir hüküm
        yoktur; yasak, iki verginin birlikte uygulanmasınadır.
      C: Dampinge karşı vergi veya telafi edici vergi konulmuş olması malın ithalatını engellemez; ithalatın yasaklanması
        şartı aranmaz.
      E: Dampinge karşı verginin sübvansiyonlu mallarda alınamayacağına dair bir hüküm yoktur; yasak yalnız iki verginin aynı
        durumun telafisi için birlikte uygulanmasına ilişkindir.
  kaynaklar:
  - mevzuat: 3577 sayılı İthalatta Haksız Rekabetin Önlenmesi Hakkında Kanun
    madde: md. 13
    alinti: Soruşturmaya konu olan mal için hem damping yapılmış olması hem de sübvansiyon verilmiş olması halinde, aynı durumun
      telafisi için dampinge karşı vergi ve telafi edici vergi birlikte uygulanamaz.
  - mevzuat: 3577 sayılı İthalatta Haksız Rekabetin Önlenmesi Hakkında Kanun
    madde: md. 13
    alinti: Dampinge karşı vergi veya telafi edici vergi konulmuş olması, ilgili malın ithalatını engellemez.
