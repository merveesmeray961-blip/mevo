- id: YMM-DTK-TKP-0019
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: 5607 md. 13 taşıt müsaderesi koşulları
  tip: uygulama
  zorluk: 2
  kok: Kaçak eşya taşımasında bilerek kullanılan bir kamyonun müsadere edilebilmesi için 5607 sayılı Kaçakçılıkla Mücadele
    Kanunu'nun 13. maddesinin birinci fıkrasında sayılan koşullardan en az birinin gerçekleşmesi gerekir. Aşağıdaki olaylardan
    hangisinde bu koşullardan biri gerçekleşmiştir?
  secenekler:
    A: Kamyon, daha önce başka bir kaçakçılık fiilinde de kullanılmış ve kayıtlarda şüpheli taşıt olarak işaretlenmiştir.
    B: Kamyonun yükünün büyük bölümü kaçak eşyadan oluşmakta, yasal malların hacim ve miktarı yükün küçük bir kısmını teşkil
      etmektedir.
    C: Kamyonu kullanan kişi, kaçak eşyayı taşımak karşılığında ücret almış ve bu durumu ifade vermiştir.
    D: Kaçak eşyanın değeri, kamyonun kasko değerinden yüksektir ve eşya kamyon kasasının ortasında taşınmaktadır.
    E: Kamyon yabancı plakalıdır, Türkiye’de sicile kayıtlı değildir ve sahibi yurt dışında ikamet etmektedir.
  dogru: B
  aciklama:
    dogru_neden: 'Md. 13/1-(b): Kaçak eşyanın taşıma aracı yüküne göre miktar veya hacim bakımından tamamını veya ağırlıklı
      bölümünü oluşturması, taşıma aracının müsaderesini mümkün kılan koşullardan biridir. Diğer koşullar gizli tertibat ve
      ithali veya ihracı yasak ya da toplum ve çevre sağlığı açısından zararlı madde taşınmasıdır.'
    celdiriciler:
      A: Önceki kullanım md. 10/2 kapsamında alıkoymada önem taşıyabilir; md. 13/1’in müsadere koşulları arasında sayılmamıştır.
      C: Sürücünün ücret alması müsadere koşulu değildir; md. 13/1 yalnız saklama biçimi, yükteki ağırlık veya madde niteliğine
        bakar.
      D: Eşyanın değerinin araçtan yüksek olması ya da kasadaki yeri md. 13/1’de aranan koşullardan değildir.
      E: Taşıtın Türkiye’de sicile kayıtlı olmaması md. 10/2 kapsamında alıkoymaya ve teminata ilişkindir; müsadere koşulu
        değildir.
  kaynaklar:
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 13/1
    alinti: 'Ancak kaçak eşya taşımasında bilerek kullanılan veya kullanılmaya teşebbüs edilen her türlü taşıma aracının müsadere
      edilebilmesi için aşağıdaki koşullardan birinin gerçekleşmesi gerekir:'
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 13/1
    alinti: a) Kaçak eşyanın, suçun işlenmesini kolaylaştıracak veya fiilin ortaya çıkmasını engelleyecek şekilde özel olarak
      hazırlanmış gizli tertibat içerisinde saklanmış veya taşınmış olması. b) Kaçak eşyanın, taşıma aracı yüküne göre miktar
      veya hacim bakımından tamamını veya ağırlıklı bölümünü oluşturması veya naklinin, bu aracın kullanılmasını gerekli kılması.
      c) Taşıma aracındaki kaçak eşyanın, Türkiye’ye girmesi veya Türkiye’den çıkması yasak veya toplum veya çevre sağlığı
      açısından zararlı maddelerden olması.
