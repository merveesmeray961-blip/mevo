    alinti: Gemilerin, botların, diğer deniz taşıtlarının ve hava gemilerinin dış seferlerde kullanacakları yakıt ve yağları
      ile karaya çıkarılmamak şartıyla yurtdışından getirdikleri kumanyaları ithalat vergilerinden muaftır.
