  kok: 4458 sayılı Gümrük Kanunu'nun 176. maddesindeki akaryakıt ve kumanyaya ilişkin hükümlere göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Serbest dolaşımdaki yakıt ve yağlar ile kumanyaların dış sefere çıkan gemi, bot, diğer deniz taşıtları ve hava gemilerine
      verilmesi ihracat hükmündedir.
    B: Gemilerin dış seferlerde kullanacakları yakıt ve yağlar muaftır; ancak hava gemilerinin yakıt ve yağları ithalat vergilerine
      tabidir.
    C: Yurtdışından getirilen kumanyalar, karaya çıkarılması hâlinde de ithalat vergilerinden muaf tutulur.
    D: Antrepoda bulunan ve serbest dolaşıma girmemiş yakıtlar, hiçbir surette dış sefere çıkan taşıtlara verilemez.
    E: Dış seferlerde kullanılan yakıt ve yağların muafiyeti, taşıtın Türk bayrağı taşımasına bağlıdır.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 176/3: Serbest dolaşımda bulunan yakıt ve yağlar ile kumanyaların dış sefere çıkan gemi, bot ve diğer
      deniz taşıtları ile hava gemilerine verilmesi ihracat hükmündedir.'
