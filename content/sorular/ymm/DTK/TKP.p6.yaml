      B: Md. 176/1 gemiler, botlar, diğer deniz taşıtları ve hava gemilerinin dış seferlerde kullanacakları yakıt ve yağlarını
        birlikte muaf tutar.
      C: Kumanyadaki muafiyet karaya çıkarılmamak şartına bağlıdır; karaya çıkarılırsa muafiyet söz konusu olmaz.
      D: Md. 176/2 antrepodaki yakıt, yağ ve kumanyaların transit hükümlerine göre dış seferdeki taşıtlara verilebileceğini
        öngörür.
      E: Kanunda muafiyet için bayrak şartı aranmamıştır; ölçüt dış sefer ve (kumanya için) karaya çıkarılmamasıdır.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
