- id: YMM-DTK-TKP-0018
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: 5607 md. 3 muaf eşyanın amacı dışında kullanımı
  tip: uygulama
  zorluk: 2
  kok: (M) A.Ş., özel bir kanun gereğince gümrük vergilerinden muaf olarak ithal ettiği hasat makinesini, ithal amacı dışında
    bir inşaat şirketine satmıştır. Fiilin daha ağır cezayı gerektiren bir suç oluşturmadığı varsayıldığında, 5607 sayılı
    Kaçakçılıkla Mücadele Kanunu'na göre öngörülen ceza aşağıdakilerden hangisidir?
  secenekler:
    A: Altı aydan iki yıla kadar hapis ve beş bin güne kadar adlî para cezası
    B: Bir yıldan üç yıla kadar hapis ve beş bin güne kadar adlî para cezası
    C: Bir yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası
    D: İki yıldan beş yıla kadar hapis ve on bin güne kadar adlî para cezası
    E: İki yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası
  dogru: A
  aciklama:
    dogru_neden: 'Md. 3/6: Özel kanunları gereğince gümrük vergilerinden kısmen veya tamamen muaf olarak ithal edilen eşyayı
      ithal amacı dışında başka bir kullanıma tahsis eden, satan veya devreden kişi altı aydan iki yıla kadar hapis ve beş
      bin güne kadar adlî para cezası ile cezalandırılır.'
    celdiriciler:
      B: Bir yıldan üç yıla kadar hapis, örneğin transit rejimine aykırı hareket (md. 3/3) veya bilerek satın alma (md. 3/5)
        için öngörülmüştür; muaf eşyanın amacı dışı kullanımı için değildir.
      C: Bir yıldan beş yıla kadar hapis, gümrük işlemlerine tabi tutmaksızın ülkeye sokma (md. 3/1) veya ihracat teşvikinde
        hile (md. 3/9) suçlarının cezasıdır.
      D: İki yıldan beş yıla kadar hapis, aldatıcı işlemlerle vergisiz giriş (md. 3/2) suçunun cezasıdır.
      E: İki yıldan altı yıla kadar hapis ve yirmi bin güne kadar adlî para cezası, ithali yasak eşyayı sokma (md. 3/7) suçunun
        cezasıdır.
  kaynaklar:
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 3/6
    alinti: Özel kanunları gereğince gümrük vergilerinden kısmen veya tamamen muaf olarak ithal edilen eşyayı, ithal amacı
