    alinti: Kesin önlemler, yürürlüğe girme tarihlerinden veya damping veya sübvansiyon incelemesi ile zarar incelemesini
      birlikte kapsayan en son gözden geçirme soruşturmasının sonuçlandığı tarihten itibaren 5 yıl sonra yürürlükten kalkar.
  - mevzuat: İthalatta Haksız Rekabetin Önlenmesi Hakkında Yönetmelik
