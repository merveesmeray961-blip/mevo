        tasfiye olunur.
      C: Doksan gün, alıkonulmayan fakat gümrük idaresine fiilen teslim edilen taşıtın sahibinin, tebligat tarihinden itibaren
        teslim almasına ilişkin süredir (md. 10/3); teminat süresi otuz gündür.
      D: Md. 10/2 teminat tutarını taşıtın değeri kadar olarak belirler.
      E: Md. 10/2 ve 10/3 tasfiye idaresine soruşturma ve kovuşturma sonucu beklenmeksizin derhal tasfiye yetkisi tanır.
    hesap_adimlari: []
