- id: YMM-DTK-TKP-0028
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: etkin pişmanlık (5607 md. 5)
  tip: uygulama
  zorluk: 3
  kok: '5607 sayılı Kaçakçılıkla Mücadele Kanunu md. 3/2''deki suçu (aldatıcı işlemlerle gümrük vergilerini ödemeden eşya
    sokma) işleyen ve bu suçta mükerrer olmayan, suçu bir örgüt faaliyeti çerçevesinde işlememiş Bay (D) hakkında, suç konusu
    eşyanın gümrüklenmiş değeri 750.000 TL olarak tespit edilmiş ve mahkemece 6 yıl hapis cezası belirlenmiştir. Bay (D),
    etkin pişmanlık göstererek Kanun md. 5/2''deki parayı soruşturma evresi sona ermeden Devlet Hazinesine ödemiştir.


    Bay (D)''nin ödemesi gereken tutar ve ceza indirimi sonrasındaki hapis cezası aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 750.000 TL ödenir; hapis cezası 3 yıla iner.
    B: 1.500.000 TL ödenir; hapis cezası 4 yıla iner.
    C: 2.250.000 TL ödenir; hapis cezası 3 yıla iner.
    D: 1.500.000 TL ödenir; hapis cezası 2 yıla iner.
    E: 1.500.000 TL ödenir; hapis cezası 3 yıla iner.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 5/2''ye göre, yedinci fıkrası hariç 3. maddedeki suçlardan birini işleyen kişi, suç konusu eşyanın gümrüklenmiş
      değerinin iki katı kadar parayı Devlet Hazinesine soruşturma evresi sona erinceye kadar öderse cezası yarı oranında,
      kovuşturma evresinde hüküm verilinceye kadar öderse üçte bir oranında indirilir. Ödeme = 2 × 750.000 = 1.500.000 TL;
      ceza = 6 × 1/2 = 3 yıl. Md. 5/3''e göre mükerrerler ve örgüt faaliyeti çerçevesinde işlenen suçlar için bu hüküm uygulanmaz;
      olayda bu engeller yoktur. Püf noktaları: Soruşturmada ''yarı'', kovuşturmada ''üçte bir'' indirim vardır; bu indirim,
      aynı maddedeki ''haber verme'' indiriminden (üçte iki) farklıdır.'
    celdiriciler:
      A: Ödenecek tutar gümrüklenmiş değerin iki katıdır; tek katı yeterli değildir.
      B: Üçte bir oranında indirim (6 yıl → 4 yıl), ödemenin kovuşturma evresinde yapılması hâlinde uygulanır.
      C: Gümrüklenmiş değerin üç katı istenmemektedir; ödeme iki katıdır.
      D: Üçte iki oranında indirim etkin pişmanlığın ödeme yoluyla değil, haber alındıktan sonra fiilin ortaya çıkmasına hizmet
        eden kişi için öngörülen indirim oranıdır (md. 5/1); soruşturma evresindeki ödemede indirim yarıdır.
    hesap_adimlari:
    - Ödenecek tutar = 2 × 750.000 = 1.500.000 TL
    - 'Soruşturma evresinde ödeme: ceza yarı oranında indirilir; 6 yıl × 1/2 = 3 yıl'
  kaynaklar:
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 5/2
    alinti: (2) (Değişik:14/4/2020-7242/62 md.) Yedinci fıkrası hariç, 3 üncü maddede tanımlanan suçlardan birini işlemiş
      olan kişi, etkin pişmanlık göstererek suç konusu eşyanın gümrüklenmiş değerinin iki katı kadar parayı Devlet Hazinesine;
      a) Soruşturma evresi sona erinceye kadar ödediği takdirde, hakkında bu Kanunda tanımlanan kaçakçılık suçlarından dolayı
      verilecek ceza yarı oranında, b) Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, hakkında bu Kanunda
      tanımlanan kaçakçılık suçlarından dolayı verilecek ceza üçte bir oranında,
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 5/3
    alinti: (3) (Ek:14/4/2020-7242/62 md.) İkinci fıkra hükmü, mükerrirler hakkında veya suçun bir örgütün faaliyeti çerçevesinde
      işlenmesi hâlinde uygulanmaz.
  gecerlilik:
