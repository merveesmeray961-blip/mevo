      (II); nihai gözden geçirme soruşturması süresince önlem yürürlükte kalmaya devam eder (III). Md. 34''e göre ara gözden
      geçirme için kesin önlemin yürürlüğe girmesinden itibaren bir yıl geçmiş olması gerekir (IV yanlış). Püf noktaları:
      Ara gözden geçirme = 1 yıl; nihai gözden geçirme başvurusu = bitimden en az 3 ay önce; yürürlük = 5 yıl.'
    celdiriciler:
      A: III de doğrudur; nihai gözden geçirmeye konu önlem soruşturma sonuçlanıncaya kadar yürürlükte kalır.
      B: IV yanlıştır; md. 34'e göre ara gözden geçirme soruşturması için kesin önlemin yürürlüğe girmesinden itibaren bir
        yıl geçmiş olması gerekir.
      C: 'IV yanlıştır: ara gözden geçirme için kesin önlemin yürürlüğe girmesinden itibaren bir yıl geçmesi gerekir. Ayrıca
        I doğru olduğu hâlde şıkta yoktur.'
      D: IV yanlıştır (süre bir yıldır) ve doğru olan II bu şıkta yer almamaktadır.
    hesap_adimlari: []
