    Aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Taşıt, soruşturma ve kovuşturma sonuçlanmadan hiçbir hâlde tasfiye edilemez; sahibi teminat verse de taşıtın iadesi
      mümkün değildir ve taşıt kamu adına muhafaza edilir.
    B: Taşıt, 1.400.000 TL teminatın otuz gün içinde teslim edilmesi hâlinde iade edilir; aksi hâlde soruşturma sonucu beklenmeksizin
      tasfiye olunur.
    C: Teminat süresi alıkoyma tarihinden itibaren doksan gündür; bu süre sonunda taşıt, soruşturma sonucu beklenmeksizin
      tasfiye edilir.
    D: Taşıtın iadesi için teminat olarak taşıt değerinin yarısı yeterlidir; kalan yarı sonradan tahsil edilir.
    E: Taşıt, ancak mahkeme kararıyla satılabilir; idare derhal tasfiye yetkisine sahip değildir ve teminat verilmesi taşıtın
      satışını engellemez.
