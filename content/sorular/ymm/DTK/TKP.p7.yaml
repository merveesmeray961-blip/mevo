- id: YMM-DTK-TKP-0025
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: tasfiye satış bedelinin dağıtımı (md. 180)
  tip: hesaplama
  zorluk: 3
  kok: '(V) A.Ş.''nin, 4458 sayılı Gümrük Kanunu''nun 50. maddesine göre verilen süre içinde gümrükçe onaylanmış bir işlem
    veya kullanım tayini için gerekli işlemlere başlanmayan eşyası (md. 177/1-b) satış suretiyle tasfiye edilmiştir. Satış
    bedelinden ayrılacak kalemler şöyledir:


    | Kalem | Tutar (TL) |

    |---|---|

    | Satış bedeli | 1.200.000 |

    | Hizmet karşılığı alacaklar ve yapılmış masraflar | 60.000 |

    | Gümrük vergileri | 340.000 |

    | Satış için yapılmış masraflar | 40.000 |

    | Para cezaları | 300.000 |


    Gümrük Kanunu md. 180/1 uyarınca bu bedellerin dağıtımından sonra eşya sahipleri adına emanet hesabına alınacak tutar
    kaç TL''dir?

    '
  secenekler:
    A: 160.000 TL
    B: 460.000 TL
    C: 500.000 TL
    D: 760.000 TL
    E: 800.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 180/1''e göre satış bedelinden sırasıyla (a) hizmet karşılığı alacaklar ve yapılmış masraflar, (b) gümrük
      vergileri, (c) satış için yapılmış masraflar, (d) para cezaları ayrılarak hak sahiplerine dağıtılır; artan para eşya
      sahipleri adına emanet hesabına alınır. Emanet = 1.200.000 − 60.000 − 340.000 − 40.000 − 300.000 = 460.000 TL. Emanete
      alındığı tarihten itibaren bir yıl içinde alınmayan para Ticaret Bakanlığı döner sermaye işletmesine irat kaydedilir.
      Püf noktaları: Dört kalemin tamamı düşülür; kalan tutar şirkete değil emanete gider.'
    celdiriciler:
      A: Para cezaları iki kez düşülmüştür; kalemler yalnızca bir kez ayrılır.
      C: Satış için yapılmış masraflar (40.000 TL) dağıtımdan düşülmemiştir.
      D: Para cezaları (300.000 TL) düşülmeden hesaplama yapılmıştır; oysa para cezaları da dağıtım sırasında yer alır.
      E: Gümrük vergileri (340.000 TL) düşülmemiştir; oysa vergiler ikinci sırada ödenir.
    hesap_adimlari:
    - Düşülecek kalemler = 60.000 + 340.000 + 40.000 + 300.000 = 740.000 TL
    - Emanete alınacak tutar = 1.200.000 − 740.000 = 460.000 TL
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 180/1
    alinti: '1. (Değişik: 28/3/2013-6455/5 md.) 177 nci maddenin birinci fıkrasının (b), (e), (f), (g) ve (k) bentlerinde
      ve ikinci fıkrasının (b) bendinde belirtilen eşyanın satış bedelinden sırasıyla; a) Hizmet karşılığı alacaklar ve yapılmış
      masraflar, b) Gümrük vergileri, c) Satış için yapılmış masraflar, d) Para cezaları,'
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 180/1
    alinti: Bu bedellerin dağıtımından sonra artan para olursa, eşya sahipleri adına emanet hesabına alınır. Emanete alındığı
      tarihten itibaren bir yıl içinde alınmayan para ile 177 nci maddenin birinci fıkrasının diğer bentlerinde belirtilen
      eşyanın satış bedelinden bu fıkradaki usule göre yapılacak dağıtımdan sonra kalan para Gümrük ve Ticaret Bakanlığı döner
      sermaye işletmesine irat kaydedilir.
  gecerlilik:
    baslangic: '2013-03-28'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'satis = 1200000

      kalemler = 60000 + 340000 + 40000 + 300000

      sonuc = satis - kalemler'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul; hesap doğrulandı (460.000). Olası şablon benzerliği: MEVCUT içinde md. 50
          / emanet sorusu var, tam metin görülemedi.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_DTK/DTK_TKP_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Kabul; hesap doğrulandı (460.000). Olası şablon benzerliği: MEVCUT içinde md. 50 /
      emanet sorusu var, tam metin görülemedi.'
- id: YMM-DTK-TKP-0026
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: teslim alınmayan ihale eşyası (Tasfiye Yönetmeliği md. 41)
  tip: hesaplama
  zorluk: 3
  kok: 'İhale yoluyla satılan ve bekletilmeyecek eşya niteliği taşımayan bir parti eşyanın ihale bedeli olan 3.200.000 TL,
    alıcı (Z) Ltd. Şti. tarafından süresi içinde ödenmiş; ancak alıcı eşyayı teslim için öngörülen süre içinde teslim almamıştır.
    Tasfiye Yönetmeliği md. 41''e göre hizmet ve giderler karşılığı olarak hesaplanan tutar döner sermayeye gelir kaydedildikten
    sonra emanete alınacak tutar kaç TL''dir?

    '
  secenekler:
    A: 480.000 TL
    B: 2.240.000 TL
    C: 2.720.000 TL
    D: 2.960.000 TL
    E: 3.200.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Md. 41/4: bedeli ödendiği hâlde teslim alınmayan eşyanın satış bedeli üzerinden hizmet ve giderler karşılığı
      olarak hesaplanan %15''i döner sermayeye gelir kaydedilir, kalan tutar emanete alınır. %15 = 3.200.000 × 0,15 = 480.000
      TL; emanet = 3.200.000 − 480.000 = 2.720.000 TL. Emanete alındığı tarihten itibaren bir yıl içinde talep edilmeyen tutar
      döner sermayeye gelir kaydedilir. Püf noktaları: Soruda sorulan ''kalan'' tutardır, %15''lik pay değil.'
    celdiriciler:
      A: Bu tutar döner sermayeye gelir kaydedilen %15'lik paydır; emanete alınacak tutar kalan kısımdır.
      B: Satış bedeli üzerinden %30 kesinti yapılmıştır; yönetmeliğe göre kesinti oranı %15'tir.
      D: Satış bedelinin %7,5'i kesilmiştir; yönetmelikte öngörülen oran %15'tir.
      E: Hiçbir kesinti yapılmamıştır; oysa teslim alınmayan eşyada satış bedelinin %15'i döner sermayeye gelir kaydedilir.
    hesap_adimlari:
    - Döner sermayeye gelir = 3.200.000 × %15 = 480.000 TL
    - Emanete alınacak tutar = 3.200.000 − 480.000 = 2.720.000 TL
  kaynaklar:
  - mevzuat: Tasfiye Yönetmeliği
    madde: md. 41/4
    alinti: Bedeli ödendiği halde teslim alınmayan eşyanın satış bedeli üzerinden hizmet ve giderler karşılığı olarak hesaplanan
      %15’i döner sermayeye gelir kaydedilir, kalan tutar emanete alınır.
  gecerlilik:
    baslangic: '2018-06-03'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bedel = 3200000

      pay = bedel*15//100

      sonuc = bedel - pay'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kaynakla doğrulandı; tek doğru şık, açıklama tutarlı.'
      G6:
        sonuc: bekliyor
