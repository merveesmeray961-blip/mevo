  kok: 'İthalatta Haksız Rekabetin Önlenmesi Hakkında Yönetmelik''e göre kesin önlemlerin yürürlük süresi ve gözden geçirilmesi
    ile ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Kesin önlemler, yürürlüğe girme tarihlerinden veya en son gözden geçirme soruşturmasının sonuçlandığı tarihten itibaren
    5 yıl sonra yürürlükten kalkar.


    II. Önleme konu ürünün yerli üreticileri, yürürlük süresinin sona ermesinden en geç 3 ay önce yeterli delillerle yazılı
    başvuruda bulunarak nihai gözden geçirme soruşturması açılmasını talep edebilir.


    III. Nihai gözden geçirme soruşturması açıldığında, önlem soruşturma sonuçlanıncaya kadar yürürlükte kalmaya devam eder.


    IV. Ara gözden geçirme soruşturması, kesin önlemin yürürlüğe girmesinden itibaren altı ay geçmiş olması kaydıyla açılabilir.

    '
  secenekler:
    A: I ve II
    B: I, II, III ve IV
    C: II, III ve IV
    D: I, III ve IV
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'Md. 35''e göre kesin önlemler yürürlüğe girme tarihlerinden veya en son gözden geçirme soruşturmasının sonuçlandığı
