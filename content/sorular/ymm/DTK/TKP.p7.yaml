- id: YMM-DTK-TKP-0027
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye kaçakçılık muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: ihalenin tamamlanması ve bedelin ödenmesi (Tasfiye Yönetmeliği md. 39-40)
  tip: kavrama
  zorluk: 3
  kok: 'Tasfiye Yönetmeliği''ne göre ihale yoluyla yapılan satışlara ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. En yüksek teklifin ihaleye esas bedelin yüzde yetmiş beşi ve üzerinde olması hâlinde, şartnamenin ve satış kâğıdının
    satış yerinde alıcı tarafından imzalanmasıyla ihale tamamlanmış sayılır.


    II. En yüksek teklifin ihaleye esas bedelin yüzde yetmiş beşinin altında olması hâlinde, teklife ait sonucun teklif sahibine
    tebliğ edilmesiyle ihale tamamlanmış sayılır.


    III. İhale bedelinin, ihalenin tamamlanmasını izleyen yedi gün içinde, bekletilmeyecek eşyada ise üç iş günü içinde ödenmesi
    zorunludur.


    IV. İhale bedelinin süresi içinde ödenmemesi hâlinde satış bozulur ve teminat döner sermayeye gelir kaydedilir.

    '
  secenekler:
    A: I ve II
    B: I, II ve III
    C: I, II ve IV
    D: II, III ve IV
    E: I, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 39: ihale, (a) en yüksek teklifin ihaleye esas bedelin %75 ve üzerinde olması hâlinde şartname ve satış
      kâğıdının imzalanması, (b) %75''in altında olması hâlinde teklif sonucunun teklif sahibine tebliğ edilmesi durumlarından
      birinin gerçekleşmesiyle tamamlanmış sayılır (I ve II doğru). Md. 40/1: ihale bedeli, tamamlanmayı izleyen yedi gün
      içinde, bekletilmeyecek eşyada iki iş günü içinde ödenir; ödenmezse satış bozulur ve teminat döner sermayeye gelir kaydedilir
      (III yanlış, IV doğru). Püf noktaları: Yedi gün – iki iş günü ikilisini ''üç iş günü'' ile karıştırmayın.'
    celdiriciler:
      A: IV de doğrudur; bedel süresinde ödenmezse satış bozulur ve teminat gelir kaydedilir (md. 40/1).
      B: 'III yanlıştır: bekletilmeyecek eşyada ödeme süresi üç iş günü değil iki iş günüdür; ayrıca doğru olan IV bu şıkta
        yoktur.'
      D: III yanlıştır (bekletilmeyecek eşyada süre iki iş günüdür) ve doğru olan I bu şıkta yer almamaktadır.
      E: III yanlıştır; ayrıca II doğru olduğu hâlde şıkta yoktur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Tasfiye Yönetmeliği
    madde: md. 39
    alinti: MADDE 39 – (1) İhale; a) En yüksek teklifin ihaleye esas bedelin yüzde yetmiş beş ve üzerinde olması halinde şartnamenin
      ve satış kağıdının satış yerinde alıcı tarafından imzalanması, b) En yüksek teklifin ihaleye esas bedelin yüzde yetmiş
      beşinin altında olması halinde teklife ait sonucun teklif sahibine tebliğ edilmesi, c) 38 inci maddenin ikinci fıkrasının
      (d) bendi ile 40 ve 41 inci maddelerinde belirtilen hallerde satıştan son çekilenin satış kağıdını ve şartnameyi imzalaması,
      durumlarından herhangi birinin gerçekleşmesi ile tamamlanmış sayılır.
  - mevzuat: Tasfiye Yönetmeliği
    madde: md. 40/1
    alinti: MADDE 40 – (1) İhalenin tamamlanmasını izleyen yedi gün içinde, bekletilmeyecek eşyada iki iş günü içinde ihale
      bedelinin ödenmesi zorunludur. İhale bedelinin bu süre içinde ödenmemesi halinde satış bozularak teminat döner sermayeye
      gelir kaydedilir.
