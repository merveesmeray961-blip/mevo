    alinti: Yürürlük süresinin sona ermesinden en geç 3 ay önce önleme konu olan ürünün yerli üreticileri yeterli delillerle
      birlikte Genel Müdürlüğe yazılı olarak başvurarak bir nihai gözden geçirme soruşturması açılmasını talep edebilirler.
  - mevzuat: İthalatta Haksız Rekabetin Önlenmesi Hakkında Yönetmelik
