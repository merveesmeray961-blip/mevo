  - mevzuat: İthalatta Haksız Rekabetin Önlenmesi Hakkında Yönetmelik
    madde: md. 37
    alinti: İade talebi hakkında yeterli delilleri içeren bir başvuruyu müteakip, 12 ay içerisinde karar verilir. Gerekli
