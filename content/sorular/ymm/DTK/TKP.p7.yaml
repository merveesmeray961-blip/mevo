      hâlinde taşıt iade edilir, aksi takdirde tasfiye idaresi tarafından soruşturma ve kovuşturma sonucu beklenmeksizin derhal
      tasfiye olunur. Md. 10/3''teki doksan günlük süre, alıkonulmayan ancak gümrük idaresine fiilen teslim edilmiş taşıtlara
      ilişkindir. Püf noktaları: 30 gün (teminat) ile 90 gün (tebligattan sonra teslim alma) süreleri farklı durumlara aittir.'
    celdiriciler:
