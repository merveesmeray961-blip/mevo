  konu: TKP
  kazanim: dampinge karşı verginin iadesi (Haksız Rekabet Yönetmeliği md. 37)
  tip: uygulama
  zorluk: 3
  kok: 'Dampinge karşı vergi, ithalatçı (L) A.Ş.''den 14.01.2026 tarihinde tahsil edilmiştir. Şirket, damping marjının azalması
    nedeniyle fazla ödenen verginin iadesi için yeterli delilleri içeren başvurusunu süresi içinde yapmıştır. Başvurunun yapıldığı
    tarih, mevzuattaki başvuru süresinin son gününe denk gelmiştir. Kurul, iade talebi hakkında kararı süre uzatımı yapılmaksızın,
    öngörülen sürenin son gününde vermiştir.


    İade ödemesinin en geç yapılması gereken tarih aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 14.07.2027
    B: 12.10.2027
    C: 14.10.2027
    D: 14.01.2028
    E: 12.04.2028
  dogru: B
  aciklama:
    dogru_neden: 'Md. 37''ye göre iade başvurusu önlemlerin tahsili tarihinden itibaren 6 ay içinde yapılır: 14.01.2026 +
      6 ay = 14.07.2026. Yeterli delilleri içeren başvuruyu müteakip 12 ay içerisinde karar verilir (gerekli hâllerde 18 aya
      kadar uzatılabilir): 14.07.2026 + 12 ay = 14.07.2027. İade kararının verilmesini izleyen 90 gün içinde ödeme yapılır:
      14.07.2027 + 90 gün = 12.10.2027. Püf noktaları: Üç süre birbirine eklenir: 6 ay (başvuru), 12 ay (karar), 90 gün (ödeme).'
    celdiriciler:
      A: Bu tarih kararın verilebileceği son günü gösterir; ödeme, iade kararının verilmesini izleyen 90 gün içinde yapılır.
      C: Karar tarihine üç ay eklenmiştir; mevzuat ödeme için 3 ay değil 90 gün öngörür (14.07.2027 + 90 gün = 12.10.2027).
      D: Bu tarih, süre 18 aya uzatılsaydı karar tarihi olurdu; olayda uzatma yapılmamıştır ve ödeme süresi de eklenmemiştir.
      E: 18 aylık uzatılmış karar süresine 90 gün eklenmiştir; olayda süre uzatımı yoktur.
    hesap_adimlari:
    - Başvuru son günü = 14.01.2026 + 6 ay = 14.07.2026
    - Karar son günü = 14.07.2026 + 12 ay = 14.07.2027
    - Ödeme son günü = 14.07.2027 + 90 gün = 12.10.2027
