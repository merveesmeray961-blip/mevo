  kok: Türkiye'de yerleşik bir danışmanlık şirketinin aşağıdaki hizmetlerinden hangisi, 3065 sayılı KDV Kanunu md. 11 ve 12
    uyarınca hizmet ihracatı olarak katma değer vergisinden istisnadır?
  secenekler:
    A: Merkezi Almanya'da olan bir şirkete, onun Bursa'daki üretim fabrikası için hazırlanan makine yerleşim planı
    B: İstanbul'da yerleşik bir şirkete, onun Hollanda'daki kiralık deposu için hazırlanan ve İstanbul'daki merkezine fatura
      edilen raf projesi
    C: İstanbul merkezli bir şirketin Almanya'da kendi adına müstakilen faaliyet gösteren şubesine, Almanya pazarı için pazar
      araştırması
    D: Merkezi Hollanda'da olan bir şirkete, onun Türkiye'deki bayilerinin personeline Türkiye'de verilen satış eğitimi
    E: Yurt dışında ikamet eden ve Türkiye'de işyeri olmayan bir kişiye, onun Antalya'daki villası için tadilat projesi
  dogru: C
  aciklama:
    dogru_neden: 'Hizmet ihracatı istisnası için iki şart birlikte aranır: hizmet yurt dışındaki bir müşteri için yapılmalı
      ve hizmetten yurt dışında faydalanılmalıdır (md. 12/2). Yurt dışındaki müşteri tanımına, yurt içindeki bir firmanın
      yurt dışında kendi adına müstakilen faaliyet gösteren şubesi de girer. C''de müşteri bu nitelikte bir şubedir ve araştırmadan
      Almanya''da faydalanılmaktadır; iki şart da sağlanmıştır.'
    celdiriciler:
      A: Müşteri yurt dışındadır, ancak hizmetten Bursa'daki fabrikada, yani Türkiye'de faydalanılmaktadır; ikinci şart sağlanmamıştır.
      B: Faydalanma yurt dışında olsa da hizmetin müşterisi İstanbul'daki merkezdir; Hollanda'daki depo, müstakil faaliyet
        gösteren bir şube olarak verilmemiştir. Birinci şart sağlanmamıştır.
      D: Müşteri yurt dışındadır, ancak eğitimden Türkiye'deki bayi ağında faydalanılmaktadır; ikinci şart sağlanmamıştır.
      E: Müşteri yurt dışında ikamet etse de hizmet Türkiye'deki bir taşınmaza ilişkindir; hizmetten Türkiye'de faydalanılmaktadır.
