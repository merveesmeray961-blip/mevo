- id: YMM-DTK-VRG-0028
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: ithalde KDV ve ÖTV
  tip: hesaplama
  zorluk: 2
  kok: 'Kuzey A.Ş., yurt dışından satın aldığı ve gümrük vergisinden muaf olan bir makineyi serbest dolaşıma sokmuştur. İthalata
    ilişkin bilgiler şöyledir: malın FOB bedeli 300.000 TL; Türkiye Gümrük Bölgesine giriş noktasına kadar ödenen navlun 20.000
    TL ve sigorta 5.000 TL; ithalat sırasında ödenen harç ve paylar toplamı 3.000 TL; gümrük beyannamesinin tescilinden sonra
    yapılan ve KDV hesaplanarak faturalandırılan yurt içi nakliye bedeli 12.000 TL. KDV oranı %20''dir. Buna göre ithalde
    ödenecek katma değer vergisi kaç TL''dir?'
  secenekler:
    A: '60.000'
    B: '60.600'
    C: '65.000'
    D: '65.600'
    E: '68.000'
  dogru: D
  aciklama:
    dogru_neden: 'Mal gümrük vergisinden muaf olduğundan KDV matrahının ilk unsuru, sigorta ve navlun dahil (CIF) değerdir
      (md. 21/a): 300.000 + 20.000 + 5.000 = 325.000 TL. İthalat sırasında ödenen harç ve paylar matraha eklenir (md. 21/b):
      325.000 + 3.000 = 328.000 TL. Tescilden sonra yapılan ve ayrıca KDV''ye tabi tutulan yurt içi nakliye, md. 21/c''deki
      ''tescil tarihine kadar yapılan ... vergilendirilmeyenler'' kapsamına girmez. KDV = 328.000 × %20 = 65.600 TL.'
    celdiriciler:
      A: Yalnız FOB bedeli matrah alınmış (300.000 × %20); navlun, sigorta ve harçlar unutulmuştur.
      B: FOB bedeline harçlar eklenmiş (303.000 × %20); gümrük vergisinden muaf malda CIF değerin esas alınacağı gözden kaçırılmıştır.
      C: CIF değer doğru bulunmuş (325.000 × %20), ancak ithalat sırasında ödenen harç ve paylar matraha eklenmemiştir.
      E: Tescilden sonra yapılan ve ayrıca vergilendirilen yurt içi nakliye de matraha katılmıştır (340.000 × %20).
    hesap_adimlari:
    - CIF değer = 300.000 + 20.000 + 5.000 = 325.000 TL
    - Matrah = 325.000 + 3.000 (harç ve paylar) = 328.000 TL
    - Tescil sonrası vergilendirilmiş nakliye (12.000 TL) matraha girmez
    - KDV = 328.000 × 0,20 = 65.600 TL
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21/a-c
    alinti: 'Madde 21 – İthalatta, verginin matrahı aşağıda gösterilen unsurların toplamıdır: a) İthal edilen malın gümrük
      vergisi tarhına esas olan kıymeti, gümrük vergisinin kıymet esasına göre alınmaması veya malın gümrük vergisinden muaf
      olması halinde sigorta ve navlun bedelleri dahil (CIF) değeri, bunun belli olmadığı hallerde malın gümrükçe tespit edilecek
      değeri, b) İthalat sırasında ödenen her türlü vergi, resim, harç ve paylar, c) Gümrük beyannamesinin tescil tarihine
      kadar yapılan diğer giderler ve ödemelerden vergilendirilmeyenler'
  gecerlilik:
    baslangic: '2001-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'cif = 300000 + 20000 + 5000

      matrah = cif + 3000

      sonuc = matrah * 20 // 100'
