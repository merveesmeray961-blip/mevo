  kazanim: ihracat istisnası ve iadesi
  tip: uygulama
  zorluk: 3
  kok: İmalatçı Kaya A.Ş., 18 Şubat 2026 tarihinde ihracatçı Deniz Ltd.'ye KDV Kanunu md. 11/1-c kapsamında ihraç kaydıyla
    mal teslim etmiş; KDV tahsil edilmemiş, ilgili dönem beyannamesinde beyan edilerek tarh ve tahakkuk ettirilen vergi tecil
    edilmiştir. Deniz Ltd., beklenmedik bir durum nedeniyle ihracatı yasal süre içinde gerçekleştiremeyeceğini öngörmektedir.
    Bu olayla ilgili aşağıdaki ifadelerden hangileri doğrudur? I. Ek süre alınmazsa malların en geç 31 Mayıs 2026 tarihine
    kadar ihraç edilmesi gerekir. II. Başvuru üzerine verilebilecek ek süre altı aya kadardır. III. Ek süre için 12 Haziran
    2026 tarihinde yapılan başvuru süresindedir. IV. Mal hiç ihraç edilmez ve bunun nedeni VUK'ta belirtilen mücbir sebeplerden
    biri değilse, tecil edilen vergi tecil faiziyle birlikte tahsil edilir.
  secenekler:
    A: I ve II
    B: II ve IV
    C: III ve IV
    D: I ve III
    E: I, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur: Üç aylık süre, ihracatçıya teslim tarihini takip eden ay başından (1 Mart 2026) itibaren işler
      ve 31 Mayıs 2026''da dolar. III doğrudur: Ek süre başvurusu, üç aylık sürenin dolduğu tarihten itibaren on beş gün içinde,
      yani en geç 15 Haziran 2026''ya kadar yapılabilir. II yanlıştır: Ek süre üç aya kadar verilebilir. IV yanlıştır: Mücbir
      sebep yoksa tecil edilen vergi, tahakkuk ettirildiği tarihten itibaren 6183 sayılı Kanun md. 51''e göre gecikme zammıyla
      tahsil edilir; tecil faizi yalnız VUK''taki mücbir sebepler nedeniyle ihraç edilemeyen mallar için uygulanır. Püf noktaları:
      Üç ay teslim tarihinden değil izleyen ayın başından sayılır. Ek süre başvurusundaki on beş gün, üç aylık sürenin dolduğu
      günden itibaren hesaplanır. Gecikme zammı ile tecil faizi ayrımı mücbir sebebin varlığına bağlıdır; başlangıç tarihleri
      de farklıdır (tahakkuk ↔ tecil).'
    celdiriciler:
      A: II yanlıştır; md. 11/1-c'ye göre ek süre üç aya kadardır, altı ay değildir.
      B: 'Her iki öncül de yanlıştır: ek süre üç aya kadardır; mücbir sebep yoksa gecikme zammı uygulanır.'
      C: III doğru olsa da IV yanlıştır; mücbir sebep bulunmadığından tecil faizi değil gecikme zammı uygulanır.
      E: IV yanlıştır; tecil faizi yalnız VUK'ta belirtilen mücbir sebep hâlinde uygulanır. Diğer durumlarda gecikme zammı
        uygulanır.
    hesap_adimlari:
    - Teslim 18.02.2026 → izleyen ay başı 01.03.2026 → üç ay sonu 31.05.2026
    - 'Ek süre başvurusu: 31.05.2026 + 15 gün = 15.06.2026''ya kadar; 12.06.2026 süresinde'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: Söz konusu malların, ihracatçıya teslim tarihini takip eden ay başından itibaren 3 ay içinde ihraç edilmesi halinde,
      tecil edilen vergi terkin olunur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: İhracatın mücbir sebepler veya beklenmedik durumlar nedeniyle üç ay içinde gerçekleştirilememesi halinde, en geç
      üç aylık sürenin dolduğu tarihten itibaren onbeş gün içinde başvuran ihracatçılara, Maliye Bakanlığınca veya Bakanlığın
      uygun görmesi halinde vergi dairelerince üç aya kadar ek süre verilebilir.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
