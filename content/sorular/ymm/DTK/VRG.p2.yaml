      başlamasıdır; ancak gümrük vergisine tabi olmayan işlemlerde vergiyi doğuran olay gümrük beyannamesinin tescilidir.
      Soruda eşya gümrük vergisine tabi olmadığından olay, beyannamenin tescili ile doğar.
    celdiriciler:
      A: Bentteki eski ifade 'fiili ithalin yapılması' idi; 4369 sayılı Kanunla 'gümrük beyannamesinin tescili' olarak değiştirilmiştir.
        Eşyanın fiziken girişi tek başına vergiyi doğurmaz.
      C: Gümrük vergisi ödeme mükellefiyetinin başlaması, gümrük vergisine tabi ithalat için geçerli genel kuraldır; soruda
        eşya gümrük vergisine tabi değildir.
      D: Eşyanın teslim alınması, yurt içi teslimlerdeki 'malın teslimi' kuralının ithalata yanlış uygulanmasıdır; ithalatta
        md. 10/ı özel hükmü geçerlidir.
      E: Faturanın önceden düzenlenmesi md. 10/b'de teslim ve hizmetler için öngörülmüştür; ithalatta yabancı satıcının faturası
