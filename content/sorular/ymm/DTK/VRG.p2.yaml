  kok: Gerçek usulde KDV mükellefi Ege A.Ş., Mart 2026 döneminde yurt dışındaki bir müşteriye doğrudan mal ihraç etmiştir.
    Şirketin bu ihracatla ilgili yüklendiği ve faturalarda gösterilen KDV 150.000 TL, aynı dönemde yurt içi vergiye tabi işlemleri
    üzerinden hesaplanan KDV ise 60.000 TL'dir. Şirketin başka indirim konusu KDV'si yoktur. 3065 sayılı KDV Kanunu'na göre
    aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Yüklenilen KDV'nin 60.000 TL'lik kısmı Mart 2026 döneminde indirim yoluyla giderilir.
    B: İndirim yoluyla giderilemeyen 90.000 TL, Bakanlıkça tespit edilecek esaslara göre şirkete iade edilir.
    C: İade talebinin en geç 31 Aralık 2028 tarihine kadar yapılması gerekir.
    D: Bakanlık, iadeyi şirketin vergi ve sosyal sigorta prim borçlarına mahsup suretiyle sınırlayabilir.
    E: Mal ihraç kaydıyla alınsaydı, tecil-terkin edilen KDV de md. 32'ye göre iade edilebilirdi.
  dogru: E
  aciklama:
    dogru_neden: KDVK md. 11/1-c'ye göre ihraç kaydıyla teslimde tecil veya terkin edilen vergiler hakkında ihracatçılar bakımından
      md. 32 hükmü uygulanmaz. İhracatçı bu vergiyi hiç ödememiştir; dolayısıyla iade konusu da yapamaz. E ifadesi yanlıştır.
    celdiriciler:
      A: Doğrudur. Md. 32'ye göre istisna kapsamındaki işlemlere ait KDV, vergiye tabi işlemler üzerinden hesaplanan KDV'den
        indirilir; 60.000 TL bu yolla giderilir.
      B: Doğrudur. Hesaplanan verginin indirilecek vergiden az olması halinde indirilemeyen KDV (150.000 − 60.000 = 90.000
        TL) md. 32 uyarınca iade olunur.
      C: Doğrudur. İade talebi, işlemin gerçekleştiği dönemi (Mart 2026) izleyen ikinci takvim yılının sonuna, yani 31.12.2028'e
        kadar yapılmalıdır.
      D: Doğrudur. Md. 32'nin ek fıkrası, Maliye Bakanlığına iadeyi hak sahiplerinin vergi ve sosyal sigorta prim borçlarına
        mahsup suretiyle sınırlama yetkisi verir.
    hesap_adimlari:
    - 'İndirim: 60.000 TL; iade konusu: 150.000 − 60.000 = 90.000 TL'
    - 'Talep süresi: Mart 2026 → izleyen ikinci takvim yılı 2028 → 31.12.2028'
