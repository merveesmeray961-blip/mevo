  kok: Mert A.Ş., ithali belli bir kuruluşun vereceği ve gümrük idaresine ibrazı zorunlu olan uygunluk belgesine bağlı oyuncakları
    serbest dolaşıma giriş rejimi kapsamında beyan etmiş; beyannamede belge alınmış gibi beyanda bulunmuştur. Muayenede bu
    durum gümrük idaresince tespit edilmiştir. Eşyanın gümrüklenmiş değeri 500.000 TL'dir; eşya değersiz, artık veya atık
    madde değildir ve ödenmesi gereken fark gümrük vergisi yoktur. Daha sonra, Bakanlıkça belirlenen süre içinde ilgili kuruluşun
    yaptığı denetimin olumlu sonuçlandığı gümrük idaresine bildirilmiştir. 2026 yılı için Gümrük Kanunu md. 241/1'deki usulsüzlük
    cezası 1.494 TL'dir. Buna göre Mert A.Ş.'ye verilecek idari para cezası kaç TL'dir?
  secenekler:
    A: '1.494'
    B: '50.000'
    C: '100.000'
    D: 1.000.000
    E: 2.000.000
  dogru: A
  aciklama:
    dogru_neden: Belgeye tabi eşyanın belge alınmış gibi beyan edilmesi md. 235/1-c kapsamındadır ve kural olarak gümrüklenmiş
      değerin iki katı idari para cezası gerektirir. Ancak md. 235/1-e'ye göre Bakanlıkça belirlenen süre içinde ilgili kuruluşun
      denetiminin olumlu sonuçlandığı bildirilirse ceza md. 241/1 uyarınca verilir. Bu nedenle ceza, 2026 yılı usulsüzlük
      cezası tutarı olan 1.494 TL'dir.
    celdiriciler:
      B: Gümrüklenmiş değerin onda biri (md. 235/2-b), ihracat rejimindeki belge aykırılığına ilişkindir; olay ithalattadır.
      C: İki kat cezanın yüzde onu (md. 235/6) alınmıştır; oysa aykırılık beyan sahibince bildirilmemiş, idarece tespit edilmiştir.
        Ayrıca 235/1-e hükmü gözden kaçırılmıştır.
      D: Md. 235/1-c'deki iki kat ceza uygulanmış, süre içinde olumlu denetim sonucunu öngören md. 235/1-e istisnası atlanmıştır.
      E: Dört kat ceza (md. 235/1-a), ithali yasaklanmış eşyaya ilişkindir; oyuncakların ithali yasak değil, belgeye bağlıdır.
    hesap_adimlari:
    - 'Kural: md. 235/1-c → 2 × 500.000 = 1.000.000 TL'
    - 'Süre içinde olumlu denetim bildirimi: md. 235/1-e → md. 241/1 usulsüzlük cezası'
    - '2026 tutarı: 1.494 TL'
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 235/1-e
    alinti: e) (Ek:24/10/2019-7190/12 md.) Bakanlıkça belirlenecek süre içerisinde, (c) bendinde belirtilen eşyanın ithalinin
      uygun bulunduğuna ilişkin belge veya bilginin düzenlenmesi veya ilgili kurum veya kuruluş tarafından gerçekleştirilen
