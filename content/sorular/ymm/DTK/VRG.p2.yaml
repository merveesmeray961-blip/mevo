    Nisan 2026 döneminde sorumlu sıfatıyla (2 No.lu KDV beyannamesiyle) 9.000 TL ödenmiştir. Mayıs 2026 döneminde ödenecek
    KDV çıkmamıştır. Ceza ve faiz dikkate alınmayacaktır. 3065 sayılı KDV Kanunu md. 48''e göre gümrük idaresince tahsili
    gereken KDV kaç TL''dir?'
