      vergiler de KDV matrahına girdiğinden (md. 21/b) KDV matrah farkı 200.000 + 20.000 = 220.000 TL, eksik KDV 220.000 ×
      %20 = 44.000 TL''dir. Md. 48''e göre indirim hakkı tanınan işlemlere konu eşyanın serbest dolaşıma girdiği dönem (Mart
      2026) ve sonraki dönemlere ait beyannamelere göre ödenen KDV bu tutardan düşülür; sorumlu sıfatıyla ödenenler hariçtir.
