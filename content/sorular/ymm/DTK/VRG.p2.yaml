  kok: 'Özel hukuk tüzel kişisi Sarp A.Ş.''nin üç ayrı gümrük beyannamesinde aşağıdaki aykırılıklar bulunmuştur. X beyannamesi
    (serbest dolaşıma giriş): Tarife pozisyonu yanlış beyan edilmiştir; beyana göre hesaplanan ithalat vergileri 300.000 TL,
    muayene sonuçlarına göre alınması gereken ithalat vergileri 330.000 TL''dir. Aykırılık muayenede gümrük idaresince tespit
    edilmiştir. Y beyannamesi (serbest dolaşıma giriş): Faturadaki kalemlerin toplanmasında yapılan maddi hesap hatası nedeniyle
    kıymet noksan beyan edilmiştir; vergi farkı 8.000 TL''dir. Aykırılık gümrük idaresince tespit edilmiştir. Z beyannamesi
    (dahilde işleme rejimi): Kıymet noksan beyan edilmiştir; vergi farkı 20.000 TL''dir. Şirket, bu aykırılığı gümrük idaresinin
    tespitinden önce kendisi bildirmiştir. 2026 yılı için Gümrük Kanunu md. 241/1''deki usulsüzlük cezası 1.494 TL''dir. Buna
    göre Gümrük Kanunu md. 234 uyarınca üç beyanname için verilecek para cezalarının toplamı kaç TL''dir?'
  secenekler:
    A: '95.000'
    B: '95.494'
    C: '100.000'
    D: '104.000'
    E: '115.494'
  dogru: B
  aciklama:
    dogru_neden: 'X: Tarife unsurundaki aykırılıkta fark 30.000 TL olup beyana göre hesaplanan vergilerin %5''ini (15.000
      TL) aştığından md. 234/1-a uyarınca farkın üç katı ceza alınır: 90.000 TL. Y: Maddi hesap hatasından doğan noksan kıymet
      beyanında md. 234/1-c uyarınca vergi farkının yarısı alınır: 4.000 TL. Z: Dahilde işleme rejimindeki aykırılıkta md.
      234/2 uyarınca vergi farkının yarısı (10.000 TL) hesaplanır. Aykırılık tespitten önce bildirildiğinden md. 234/3 uyarınca
      ceza yüzde on oranında uygulanır: 1.000 TL. Ancak md. 234/6''ya göre bir ila üçüncü fıkralara göre verilen cezalar md.
      241/1''deki tutardan az olamaz; Z için ceza 1.494 TL olur. Toplam = 90.000 + 4.000 + 1.494 = 95.494 TL. Püf noktaları:
      Her beyanname için önce doğru fıkrayı belirleyin: tarife aykırılığında %5 eşiğine bakılır, maddi hesap hatasında ve
      dahilde işleme rejiminde ceza farkın yarısıdır. Kendiliğinden bildirim indirimi uygulandıktan sonra çıkan tutarı md.
      234/6''daki alt sınırla karşılaştırmayı unutmayın.'
    celdiriciler:
      A: Z için hesaplanan 1.000 TL olduğu gibi alınmış; md. 234/6'daki alt sınır (1.494 TL) uygulanmamıştır.
      C: 'Z''ye dahilde işleme rejimine özgü ''yarısı'' kuralı yerine üç kat uygulanmış, sonra yüzde on alınmıştır (60.000
        × %10 = 6.000): 90.000 + 4.000 + 6.000.'
      D: 'Z''de kendiliğinden bildirim nedeniyle cezanın yüzde on oranında uygulanacağı (md. 234/3) atlanmıştır: 90.000 +
        4.000 + 10.000.'
      E: 'Y''deki maddi hesap hatasına md. 234/1-c yerine üç kat ceza (md. 234/1-b) uygulanmıştır: 90.000 + 24.000 + 1.494.'
    hesap_adimlari:
    - 'X: fark 30.000 > %5 × 300.000 = 15.000 → 3 × 30.000 = 90.000 TL'
    - 'Y: maddi hesap hatası → 8.000 / 2 = 4.000 TL'
    - 'Z: dahilde işleme → 20.000 / 2 = 10.000; tespitten önce bildirim → %10 → 1.000; alt sınır 1.494 → 1.494 TL'
    - Toplam = 90.000 + 4.000 + 1.494 = 95.494 TL
