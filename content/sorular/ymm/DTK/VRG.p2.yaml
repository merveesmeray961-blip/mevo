- id: YMM-DTK-VRG-0032
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: ithalde KDV ve ÖTV
  tip: hesaplama
  zorluk: 3
  kok: Delta A.Ş., kendi işletmesinde kullanmak üzere, ÖTV Kanunu'na ekli (II) sayılı listede yer alan ve Türkiye'de kayıt
    ve tescil edilmemiş bir binek otomobil ithal etmiştir. Gümrük vergisi tarhına esas kıymet (CIF) 1.000.000 TL, gümrük vergisi
    100.000 TL'dir. Gümrük beyannamesinin tescilinden önce geçici depolama yerinde ardiye gideri olarak 50.000 TL ödenmiş
    ve bu ödeme için ayrıca KDV hesaplanmamıştır. Tescilden sonra aracın şirket merkezine taşınması için 25.000 TL + KDV ödenmiştir.
    Bu araç için uygulanacak ÖTV oranının %80, KDV oranının %20 olduğu kabul edilecektir. Başka vergi, harç veya gider yoktur.
    Buna göre ithalde ödenecek KDV kaç TL'dir?
  secenekler:
    A: '230.000'
    B: '390.000'
    C: '396.000'
    D: '406.000'
    E: '414.000'
  dogru: E
  aciklama:
    dogru_neden: 'ÖTVK md. 11/3''e göre (II) sayılı listedeki malların ithalinde ÖTV matrahı, hesaplanacak ÖTV hariç, KDV
      matrahını oluşturan unsurlardan oluşur. KDVK md. 21''e göre bu unsurlar CIF değer (a), ithalat sırasında ödenen vergiler
      (b) ve tescile kadar yapılan vergilendirilmemiş giderlerdir (c). ÖTV matrahı = 1.000.000 + 100.000 + 50.000 = 1.150.000
      TL; ÖTV = 1.150.000 × %80 = 920.000 TL. ÖTV, ithalat sırasında ödenen bir vergi olarak KDV matrahına girer: KDV matrahı
      = 1.150.000 + 920.000 = 2.070.000 TL; KDV = 2.070.000 × %20 = 414.000 TL. Tescilden sonra yapılan ve KDV''ye tabi tutulan
      taşıma gideri her iki matraha da girmez. Püf noktaları: Sıralama önemlidir; önce ÖTV''yi bulun, sonra KDV matrahına
      ekleyin. Ardiye gideri KDV matrahının unsuru olduğu için ÖTV matrahına da girer; ÖTV matrahından yalnız ÖTV''nin kendisi
      çıkarılır. Tescil sonrası taşıma gideri gereksiz veridir.'
    celdiriciler:
      A: ÖTV, KDV matrahına eklenmemiştir (1.150.000 × %20); ithalat sırasında ödenen vergilerin KDV matrahına girdiği (md.
        21/b) unutulmuştur.
      B: ÖTV yalnız CIF değer üzerinden hesaplanmıştır (1.000.000 × %80 = 800.000); gümrük vergisi ve ardiye ÖTV matrahına
        katılmamıştır. KDV = (1.150.000 + 800.000) × %20.
      C: 'Ardiye gideri iki matrahtan da çıkarılmıştır: ÖTV = 1.100.000 × %80 = 880.000; KDV = (1.100.000 + 880.000) × %20.
        Tescile kadar yapılan vergilendirilmemiş gider matraha dahildir.'
      D: 'Ardiye KDV matrahına alınmış, ancak ÖTV matrahına alınmamıştır: ÖTV = 880.000; KDV = (1.150.000 + 880.000) × %20.
        ÖTV matrahı KDV matrahı unsurlarının tamamından oluşur.'
    hesap_adimlari:
    - ÖTV matrahı = 1.000.000 + 100.000 + 50.000 = 1.150.000 TL
    - ÖTV = 1.150.000 × 0,80 = 920.000 TL
    - KDV matrahı = 1.150.000 + 920.000 = 2.070.000 TL
    - KDV = 2.070.000 × 0,20 = 414.000 TL
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 11/3
    alinti: 3. (II), (III) [(B) cetvelindekiler hariç] ve (IV) sayılı listelerdeki mallar için verginin matrahı; bunların
      teslimi, ilk iktisabı ve ithalinde, hesaplanacak özel tüketim vergisi hariç, katma değer vergisi matrahını oluşturan
      unsurlardan teşekkül eder.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21/b-c
    alinti: b) İthalat sırasında ödenen her türlü vergi, resim, harç ve paylar, c) Gümrük beyannamesinin tescil tarihine kadar
      yapılan diğer giderler ve ödemelerden vergilendirilmeyenler
  gecerlilik:
    baslangic: '2006-04-08'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'otv_matrah = 1000000 + 100000 + 50000

      otv = otv_matrah * 80 // 100

      kdv_matrah = otv_matrah + otv

      sonuc = kdv_matrah * 20 // 100'
