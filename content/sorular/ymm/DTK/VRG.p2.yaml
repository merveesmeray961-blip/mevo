  tip: uygulama
  zorluk: 2
  kok: 4760 sayılı ÖTV Kanunu'na ekli (IV) sayılı listede yer alan bir malı imal eden Alfa A.Ş., bu malı Türkiye'deki bir
    serbest bölgede faaliyet gösteren Beta Ltd.'ye satmıştır. Mal, gümrük beyannamesi ile Türkiye Cumhuriyeti gümrük bölgesinden
    çıkarak serbest bölgeye ulaşmıştır. Beta Ltd.'nin ikametgâhı, işyeri, kanuni ve iş merkezi yurt dışında değildir. Alfa
    A.Ş.'nin bu teslimi KDV ve ÖTV bakımından nasıl değerlendirilir?
  secenekler:
    A: KDV bakımından ihracat istisnası uygulanır; ÖTV ise hesaplanır.
    B: KDV bakımından da ÖTV bakımından da ihracat istisnası uygulanır.
    C: KDV hesaplanır; ÖTV bakımından ihracat istisnası uygulanır.
    D: Teslim yurt içi teslim sayılır; hem KDV hem ÖTV hesaplanır.
    E: Vergiyi doğuran olay malın serbest bölgeden yurt dışına çıkışında doğar.
  dogru: A
  aciklama:
    dogru_neden: KDVK md. 12/1-a ve b'ye göre teslimin bir serbest bölgedeki alıcıya yapılması ve malın gümrük bölgesinden
      çıkarak serbest bölgeye vasıl olması ihracat teslimi sayılması için yeterlidir; KDV ihracat istisnası uygulanır. ÖTVK
      md. 5/1-b ise (7491 sayılı Kanunla yapılan ekleme ile) yurt içinden serbest bölgelere yapılan teslimlerin ihracat sayılmayacağını
      açıkça hükme bağlar; ayrıca alıcı ÖTVK md. 5/1-a anlamında yurt dışındaki müşteri de değildir. Bu nedenle ÖTV hesaplanır.
    celdiriciler:
      B: KDV'deki serbest bölge kuralı ÖTV'ye taşınmıştır; ÖTVK md. 5/1-b, yurt içinden serbest bölgelere yapılan teslimleri
        ihracat saymaz.
      C: 'İki kanunun hükümleri ters çevrilmiştir: serbest bölgedeki alıcıya teslim KDV''de ihracat sayılır, ÖTV''de sayılmaz.'
      D: KDVK md. 12/1-a serbest bölgedeki alıcıya yapılan teslimi açıkça ihracat teslimi saydığı için KDV hesaplanmaz.
      E: Alfa A.Ş. bakımından vergiyi doğuran olay kendi teslimiyle gerçekleşir; Beta Ltd.'nin malı daha sonra yurt dışına
        satıp satmaması Alfa'nın teslimini değiştirmez.
    hesap_adimlari: []
  kaynaklar:
