    A: Yalnız I
    B: I ve III
    C: II ve III
    D: I, III ve IV
    E: I, II ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Md. 11/1-b''ye göre ikamet etmeyen yolcuların satın aldıkları malın teslimi anında KDV tahsil edilir ve
      gümrükten çıkışta fatura ibrazıyla iade olunur (I doğru, II yanlış). Taşımacılık faaliyetleri ile fuar, panayır ve sergilere
      katılım nedeniyle ödenen KDV ''karşılıklı olmak kaydıyla'' iade edilir (III doğru, IV yanlış). Püf noktaları: Yolcu
      satışında ''istisna'' değil ''tahsil + iade'' sistemi vardır; yabancılara yönelik iadelerin her ikisi de karşılıklılığa
      bağlıdır.'
    celdiriciler:
      A: III de doğrudur; yabancı taşımacıların taşımacılık faaliyetleri için ödedikleri KDV karşılıklılık kaydıyla iade edilir.
