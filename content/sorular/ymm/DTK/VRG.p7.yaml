- id: YMM-DTK-VRG-0072
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: teminat ve gecikme zammı (md. 207)
  tip: kavrama
  zorluk: 3
  kok: '4458 sayılı Gümrük Kanunu''nun 207. maddesine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Tahakkuk ettirilip tahsili gereken gümrük vergileri için nakdî teminat dışında bir teminat verilmişse, teminatın kabulü
    tarihinden başlamak üzere gecikme zammı tahsil edilir.


    II. Şartlı muafiyet düzenlemesine tabi eşyaya ilişkin gümrük yükümlülüğü doğduğunda, nakdî teminat dışındaki teminat durumunda
    gecikme zammı, şartlı muafiyete ilişkin beyannamenin tescili tarihinden başlar.


    III. Şartlı muafiyet kapsamında indirimli teminattan yararlanılması hâlinde gecikme zammı yalnızca teminatın hiç verilmeyen
    kısmı için uygulanır.

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: 'Md. 207/1''e göre nakdî teminat dışında, (a) tahakkuk ettirilip tahsili gereken vergiler için verilen teminatın
      kabulü, (b) şartlı muafiyete tabi eşyada gümrük yükümlülüğü doğması hâlinde şartlı muafiyet beyannamesinin tescili tarihinden
      başlamak üzere 6183 sayılı Kanun md. 51''e göre gecikme zammı tahsil edilir (I ve II doğru). Md. 207/2''ye göre indirimli
      teminatta gecikme zammı, teminatın nakit verilen kısmı dışında kalan kısım ile teminat verilmeyen kısmın tümü için uygulanır;
      yani nakit dışı teminatlı kısım da gecikme zammına tabidir (III yanlış). Püf noktaları: Gecikme zammından kaçınmanın
      yolu nakdî teminattır; nakit verilen kısım hariç tutulur, diğer kısımlar hariç tutulmaz.'
    celdiriciler:
      A: II de doğrudur; şartlı muafiyette gecikme zammı beyannamenin tescili tarihinden başlar.
      B: I de doğrudur; tahsili gereken vergi için verilen nakdî olmayan teminatın kabulü gecikme zammını başlatır.
      C: 'III yanlıştır: md. 207/2''ye göre gecikme zammı, teminatın nakit verilen kısmı dışında kalan kısım ile hiç teminat
        verilmeyen kısmın tümü için uygulanır.'
      D: III yanlıştır (nakit verilen kısım gecikme zammına tabi olmaz, nakit dışı teminatlı kısım ise tabidir) ve doğru olan
        I eksiktir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 207/1
    alinti: 1. Nakdî teminat dışında, bu Kanuna göre; a) Tahakkuk ettirilip tahsili gereken gümrük vergileri için verilen
      teminatın kabulü, b) Bir şartlı muafiyet düzenlemesine tabi tutulan eşyaya ilişkin gümrük yükümlülüğü doğması halinde,
      şartlı muafiyete ilişkin beyannamenin tescili, tarihinden başlamak üzere, 6183 sayılı Amme Alacaklarının Tahsil Usulü
      Hakkında Kanunun 51 inci maddesine göre tespit edilen gecikme zammı tahsil edilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 207/2
    alinti: 2. Bir şartlı muafiyet düzenlemesi kapsamında eşya için indirimli teminattan faydalanılması durumunda birinci
