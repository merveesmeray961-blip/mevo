- id: YMM-DTK-VRG-0076
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: ithalde eksik ödenen KDV ve düzeltme (KDVK md. 48)
  tip: hesaplama
  zorluk: 3
  kok: 'Gerçek usulde KDV mükellefi (N) A.Ş., indirim hakkı tanınan işlemlere konu bir makineyi 2026 yılı Mart ayında serbest
    dolaşıma sokmuştur. Sonradan yapılan kontrolde ithalde eksik ödendiği anlaşılan KDV tutarı 200.000 TL olarak belirlenmiştir.
    Eşyanın serbest dolaşıma girdiği ay ve sonraki vergilendirme dönemlerine ilişkin olarak şirketin vergi dairesine verdiği
    KDV beyannamelerine göre ödediği KDV toplam 150.000 TL''dir; bu tutarın 80.000 TL''si sorumlu sıfatıyla ödenen KDV''dir.


    3065 sayılı KDV Kanunu''nun 48. maddesine göre gümrük idaresince ithalde şirketten ayrıca tahsil edilecek KDV kaç TL''dir?

    '
  secenekler:
    A: 50.000 TL
    B: 70.000 TL
    C: 120.000 TL
    D: 130.000 TL
    E: 200.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Md. 48''e göre ithalde eksik ödenen KDV''den, eşyanın serbest dolaşıma girdiği tarihin içinde bulunduğu
      veya sonraki dönemlerin beyannamelerine göre ödenen KDV (sorumlu sıfatıyla ödenenler hariç) düşülür. Düşülecek tutar
      = 150.000 − 80.000 = 70.000 TL; tahsil edilecek KDV = 200.000 − 70.000 = 130.000 TL. Püf noktaları: Sorumlu sıfatıyla
      (tevkifat vb.) ödenen KDV mahsup edilmez; ayrıca ''düşülecek'' tutar ile ''tahsil edilecek'' tutarı karıştırmayın.'
    celdiriciler:
      A: 200.000 − 150.000 işlemi yapılmıştır; sorumlu sıfatıyla ödenen 80.000 TL de düşülmüştür, oysa md. 48 bunları düşülecek
        tutarın dışında tutar.
      B: Bu tutar düşülecek KDV'nin kendisidir (150.000 − 80.000); tahsil edilecek tutar değildir.
      C: Yalnızca sorumlu sıfatıyla ödenen 80.000 TL düşülmüştür; oysa sorumlu sıfatıyla ödenenler hariç, beyannamelerle ödenen
        70.000 TL düşülmelidir.
      E: Beyannamelerle ödenen KDV'nin düşülmesi md. 48'in ikinci cümlesi gereğidir; hiç düşülmemesi hatalıdır.
    hesap_adimlari:
    - Düşülecek KDV = 150.000 − 80.000 = 70.000 TL (sorumlu sıfatıyla ödenenler hariç)
    - Tahsil edilecek KDV = 200.000 − 70.000 = 130.000 TL
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 48
    alinti: 'Bu Kanuna göre vergisi ödenmeden veya eksik ödenerek yurda sokulan eşyaların hiç alınmamış veya eksik alınmış
      Katma Değer Vergileri hakkında Gümrük Kanunundaki esaslara göre işlem yapılır.(Ek cümle: 16/7/2004-5228/18 md.) Ancak,
      indirim hakkı tanınan işlemlere konu eşyanın serbest dolaşıma girdiği tarihin içinde bulunduğu veya sonraki vergilendirme
      dönemlerine ilişkin olarak vergi dairesine verilen beyannamelere göre ödenen katma değer vergisi (sorumlu sıfatıyla
      ödenenler hariç), ithalde hiç ödenmemesi veya eksik ödenmesi nedeniyle tahsili gereken katma değer vergisinden düşülür.'
