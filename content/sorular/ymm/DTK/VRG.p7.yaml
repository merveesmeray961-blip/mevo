- id: YMM-DTK-VRG-0071
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: geri verme ve kaldırma başvuru süreleri (md. 211-214)
  tip: bilgi
  zorluk: 2
  kok: 'Gümrük vergilerinin geri verilmesi veya kaldırılmasına ilişkin süreler bakımından 4458 sayılı Gümrük Kanunu''na göre
    aşağıdakilerden hangisi **yanlıştır**?

    '
  secenekler:
    A: Türkiye'nin taraf olduğu uluslararası anlaşmalar çerçevesinde belirlenen hâllerde geri verme veya kaldırma için başvuru
      süresi, tebliğ tarihinden itibaren üç yıldır.
    B: Kontrol ve denetleme sonucunda geri verme veya kaldırma hâllerinden biri tespit edilirse, işlem aynı süre içinde doğrudan
      yapılabilir.
    C: Kanunen ödenmemesi gereken gümrük vergileri, vergilerin yükümlüye tebliği ve ilgilinin üç yıl içinde gümrük idaresine
      müracaatı üzerine geri verilir veya kaldırılır.
    D: Kusurlu eşya nedeniyle geri verme veya kaldırma için tebliğ tarihinden itibaren bir yıl içinde gümrük idaresine müracaat
      edilmesi gerekir.
    E: Gümrük beyannamesinin iptali üzerine vergilerin geri verilmesi istemi, beyannamenin iptali için müracaat edilmesi öngörülen
      süreler içinde yapılmalıdır.
  dogru: A
  aciklama:
    dogru_neden: Md. 214'e göre uluslararası anlaşmalara dayanan geri verme veya kaldırma işlemleri, vergilerin yükümlüye
      tebliği tarihinden itibaren **bir yıl** içinde ilgili gümrük idaresine başvurulması üzerine yapılır; üç yıl değil. Üç
      yıllık süre md. 211/2'deki kanunen ödenmemesi gereken vergilere özgüdür.
    celdiriciler:
      B: 'Doğrudur: md. 211/2''nin ikinci paragrafı idarenin re''sen işlem yapmasına imkân tanır.'
      C: 'Doğrudur: md. 211/2 üç yıllık süreyi öngörür.'
      D: 'Doğrudur: md. 213/4 bir yıllık süreyi öngörür.'
      E: 'Doğrudur: md. 212 bu istemi beyanname iptaline ilişkin sürelere bağlar.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 211/2
    alinti: 2. Kanunen ödenmemeleri gereken gümrük vergileri, söz konusu vergilerin yükümlüye tebliğ edilmesi ve ilgilinin
      üç yıl içinde gümrük idaresine müracaatı üzerine geri verilir veya kaldırılır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 214
    alinti: Bu maddede belirlenen geri verme ve kaldırma işlemleri, gümrük vergilerinin yükümlüye tebliği tarihinden itibaren
      bir yıl içinde ilgili gümrük idaresine başvurulması üzerine yapılır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 212
    alinti: Bir gümrük beyannamesine dayanılarak ödenmiş olan gümrük vergileri bu beyannamenin iptal edilmesi üzerine ilgilinin
      talebiyle geri verilir.
