- id: YMM-DTK-VRG-0070
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: geri verme kararının uygulanmaması ve faiz (md. 216)
  tip: uygulama
  zorluk: 3
  kok: '(M) A.Ş. lehine verilen gümrük vergisi geri verme kararı 12.03.2026 tarihinde şirkete tebliğ edilmiştir. İdare kararı
    uygulamamış, geri verilecek tutar şirkete ancak 20.09.2026 tarihinde ödenmiştir. Şirket, faiz ödenmesini yazılı olarak
    talep etmiştir.


    4458 sayılı Gümrük Kanunu''nun 216. maddesine göre aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: Faiz, tebliğ tarihi olan 12.03.2026 ile ödeme tarihi olan 20.09.2026 arasındaki süre için, geri verilecek tutar üzerinden
      ve aynı dönemdeki kanuni faiz oranında hesaplanır.
    B: Faiz yalnızca dört aylık sürenin dolduğu 12.07.2026 ile ödeme tarihi olan 20.09.2026 arasındaki süre için hesaplanır.
    C: Faiz, 6183 sayılı Kanun'a göre belirlenen tecil faizi oranında hesaplanır.
    D: Faiz, ilgilinin ayrıca talebi aranmaksızın idarece kendiliğinden hesaplanıp geri verme tutarıyla birlikte ödenir.
    E: Kararın uygulanması için tanınan süre üç aydır; bu süre 12.06.2026'da dolduğundan faiz 12.06.2026 tarihinden işlemeye
      başlar ve ödeme tarihine kadar geri verilecek tutar üzerinden hesaplanır.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 216/2''ye göre geri verme kararının tebliğ edildiği tarihten itibaren dört ay içinde idarece uygulanmazsa,
      ilgilinin talebi üzerine tebliğ tarihinden ödemenin yapıldığı tarihe kadar geçen süre için, geri verilecek tutar üzerinden
      aynı dönemde kanuni faiz oranında hesaplanan faiz ödenir. Olayda karar dört ay içinde (12.07.2026''ya kadar) uygulanmamış
      ve şirket talepte bulunmuştur; faiz 12.03.2026 – 20.09.2026 dönemi için hesaplanır. Püf noktaları: Dört ay yalnızca
      ''uygulanmama'' şartıdır, faiz tebliğ tarihinden işler; faiz oranı tecil faizi değil kanuni faizdir; faiz kendiliğinden
      değil talep üzerine ödenir.'
    celdiriciler:
      B: Dört aylık süre, faizin başlangıç tarihini değil, faiz talep hakkının doğması için beklenecek süreyi gösterir. Md.
        216/2 faizi tebliğ tarihinden ödeme tarihine kadar geçen tüm süre için öngörür.
      C: Md. 216, 7451 sayılı Kanunla değiştirilerek tecil faizi yerine kanuni faiz oranını esas almıştır.
      D: Md. 216/2, faizin 'ilgilinin talebi üzerine' ödeneceğini belirtir; kendiliğinden ödeme öngörülmemiştir.
      E: Üç ay, maddenin eski halindeki süredir; 7451 sayılı Kanunla süre dört aya çıkarılmıştır. Üstelik faiz süre sonundan
        değil tebliğ tarihinden başlar.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 216/2
    alinti: 2. Geri verme kararının tebliğ edildiği tarihten itibaren dört ay içerisinde idarece söz konusu kararın uygulanmaması
      hâlinde, ilgilinin talebi üzerine, tebliğ tarihinden ödemenin yapıldığı tarihe kadar geçen süre için geri verilecek
      tutar üzerinden, aynı dönemde kanuni faiz oranında hesaplanan faiz ödenir.
