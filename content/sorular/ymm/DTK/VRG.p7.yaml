- id: YMM-DTK-VRG-0069
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: kusurlu eşyada ithalat vergilerinin geri verilmesi (md. 213)
  tip: kavrama
  zorluk: 3
  kok: '4458 sayılı Gümrük Kanunu''nun 213. maddesine göre, tescil tarihi itibarıyla kusurlu olduğu veya ithaline esas sözleşme
    hükümlerine aykırı olduğu gerekçesiyle ithalatçı tarafından kabul edilmeyen eşyaya ilişkin ithalat vergilerinin geri verilmesi
    veya kaldırılması konusunda aşağıdaki ifadelerden hangileri doğrudur?


    I. Eşyanın, kusurlu veya sözleşmeye aykırı olduğunun tespiti için gerekli olan ilk kullanım dışında kullanılmamış olması
    gerekir.


    II. Gümrük idaresi, ilgilinin talebi üzerine eşyanın ihracı yerine imhasına izin verebilir.


    III. Geri verme veya kaldırma başvurusunun, vergilerin yükümlüye tebliği tarihinden itibaren üç yıl içinde yapılması gerekir.


    IV. Beyandan önce denenmek üzere geçici olarak teslim edilen eşyada, kusurun deneme sırasında anlaşılamadığı kanıtlanmadıkça
    vergiler geri verilmez.

    '
  secenekler:
    A: I ve III
    B: II ve III
    C: I, II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 213/2''ye göre vergilerin geri verilmesi veya kaldırılması, eşyanın kusurun tespiti için gerekli ilk
      kullanım dışında kullanılmamış olması ve Türkiye Gümrük Bölgesi dışına ihraç edilmesi koşullarına bağlıdır (I); gümrük
      idaresi ilgilinin talebi üzerine ihraç yerine imha, yeniden ihraç amacıyla transit veya antrepo rejimine tabi tutma
      ya da serbest bölgeye koyma izni verebilir (II). Md. 213/3''e göre beyandan önce denenmek üzere geçici teslim edilen
      eşyada, kusurun deneme sırasında anlaşılamadığı kanıtlanmadıkça vergiler geri verilmez (IV). III yanlıştır; md. 213/4
      başvuru için tebliğ tarihinden itibaren bir yıl öngörür. Püf noktaları: Üç yıllık süre md. 211/2''deki ''kanunen ödenmemesi
      gereken vergiler'' için, bir yıllık süre ise md. 213/4 ve md. 214 için geçerlidir; bu iki süreyi karıştırmayın.'
    celdiriciler:
      A: 'III yanlıştır: md. 213/4 başvuru süresini üç yıl değil, tebliğ tarihinden itibaren bir yıl olarak belirler (üç yıl,
        md. 211/2''deki kanunen ödenmemesi gereken vergilere ilişkin süredir). II ve IV''ün doğru olduğu da göz ardı edilmiştir.'
      B: III yanlıştır; bu şıkta ayrıca doğru olan I ve IV dışarıda bırakılmıştır.
      D: 'III yanlıştır: başvuru süresi md. 213/4''e göre bir yıldır. Doğru olan II de eksik bırakılmıştır.'
      E: III yanlıştır (süre bir yıldır) ve doğru olan I bu şıkta yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 213/2
    alinti: Bu tür eşyaya ilişkin ithalat vergilerinin geri verilmesi veya kaldırılması, kusurlu veya sözleşme hükümlerine
      aykırı olduklarının tespiti için gerekli olan ilk kullanım dışında eşyanın kullanılmamış olması ve eşyanın Türkiye Gümrük
      Bölgesi dışına ihraç edilmesi koşullarına bağlıdır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 213/2
    alinti: Gümrük idareleri, ilgilinin talebi üzerine, eşyanın ihracı yerine; imhasına, yeniden ihraç amacıyla transit veya
      gümrük antrepo rejimine tabi tutulmasına veya serbest bölgeye konulmasına izin verirler. Sözkonusu işlem veya kullanımlardan
      birine tabi tutulan eşya, serbest dolaşımda olmayan eşya olarak değerlendirilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 213/3
    alinti: Gümrük beyanından önce denenmek üzere geçici olarak teslim edilen eşyanın vergileri, eşyanın kusurlu veya sözleşme
      hükümlerine aykırı olduğu hususlarının deneme sırasında anlaşılamadığı kanıtlanmadıkça geri verilmez veya kaldırılmaz.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 213/4
    alinti: yükümlüye tebliği tarihinden itibaren bir yıl içerisinde gümrük idaresine müracaat edilmesi gerekir.
