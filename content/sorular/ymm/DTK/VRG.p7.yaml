  kok: '3065 sayılı KDV Kanunu''nun 11. maddesinin birinci fıkrasının (b) bendine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Türkiye''de ikamet etmeyen yolcuların satın alarak Türkiye dışına götürdükleri malların teslimi anında KDV tahsil edilir;
    malın gümrükten çıkışı anında fatura veya belgenin ibrazı hâlinde tahsil edilen KDV iade olunur.


    II. Türkiye''de ikamet etmeyen yolculara yapılan teslimlerde, satış anında KDV hiç tahsil edilmeksizin istisna uygulanır.


    III. Türkiye''de ikametgahı, işyeri, kanuni ve iş merkezi bulunmayanların taşımacılık faaliyetlerine ilişkin satın aldıkları
    mal ve hizmetler nedeniyle ödedikleri KDV, karşılıklı olmak kaydıyla iade edilir.


    IV. Türkiye''de ikametgahı bulunmayanların fuar, panayır ve sergilere katılımları dolayısıyla ödedikleri KDV, karşılıklılık
    şartı aranmaksızın iade edilir.

    '
