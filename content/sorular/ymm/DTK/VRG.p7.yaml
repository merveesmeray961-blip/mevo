- id: YMM-DTK-VRG-0075
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Dış ticaretin vergisel boyutu
  konu: VRG
  kazanim: geri gelen eşyada ithalat istisnası (KDVK md. 16)
  tip: uygulama
  zorluk: 3
  kok: 'Türkiye''de yerleşik bir KDV mükellefi, 3065 sayılı Kanun''un 11. maddesindeki ihracat istisnasından yararlanarak
    ihraç ettiği bir makineyi, 4458 sayılı Gümrük Kanunu''nun 168, 169 ve 170. maddelerinde belirtilen şekilde geri getirmiştir.
    Makine yurt dışında yapılan bir işlem sonucunda değer kazanmıştır.


    KDV Kanunu''nun 16. maddesine göre ithalde KDV bakımından aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: İstisna, ihracat istisnasından faydalanılan miktarın ödenmesi veya teminat gösterilmesi şartıyla uygulanır; eşyanın
      kazandığı değer farkı istisnaya dahil değildir.
    B: İhracat istisnasından yararlanılmış eşya geri geldiğinde ithalat istisnası hiçbir hâlde uygulanamaz.
    C: İthalat istisnası hiçbir ek şart aranmaksızın uygulanır ve makinenin yurt dışında kazandığı değer farkı da istisnaya
      dahildir.
    D: İstisna, ihracat istisnasından faydalanılan miktar ödenmeksizin uygulanır; yalnızca değer farkı için teminat gösterilir.
    E: İstisna ödeme veya teminat şartıyla uygulanır; değer farkı, yalnızca eşyanın asli kısmına ilave yapılması hâlinde istisna
      dışında kalır, dışarıda işlem görmesi hâlinde ise istisnaya dahildir.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 16/1-b: KDV''nin 11. maddesindeki ihracat istisnasından yararlanarak ihraç edilen ve Gümrük Kanunu md.
      168-170''te belirtildiği şekilde geri gelen eşyanın ithalat istisnasından faydalanabilmesi için, ihracat istisnasından
      faydalanılan miktarın gümrük idarelerine ödenmesi veya bu miktar kadar teminat gösterilmesi şarttır. Md. 16/2''ye göre
      geri gelen eşyanın dışarıda bir işleme tabi tutulması veya asli kısmına ilave yapılması hâlinde kazandığı değer farkı
      istisnaya dahil değildir; bu fark üzerinden KDV hesaplanır. Püf noktaları: İstisna ''koşullu'' ve ''kısmidir''; ödeme/teminat
      şartı ihracat istisnası miktarına, değer farkı hükmü ise matraha ilişkindir.'
    celdiriciler:
      B: Md. 16/1-b, bu eşyanın ithalat istisnasından faydalanabilmesi için ödeme veya teminat şartını öngörür; istisna tümüyle
        kapalı değildir.
      C: Hem ek şart (ödeme veya teminat) hem de değer farkının istisna dışında kalması hükmü göz ardı edilmiştir.
      D: Md. 16/1-b'de ödeme/teminat şartı değer farkına değil, ihracat istisnasından faydalanılan miktara ilişkindir.
      E: Md. 16/2'ye göre eşyanın dışarıda bir işleme tabi tutulması veya asli kısmına ilave yapılması hâllerinin her ikisinde
        de kazanılan değer farkı istisna dışındadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 16/1-b
    alinti: (Bu Kanunun 11 inci maddesinde düzenlenen ihracat istisnasından yararlanarak ihraç olunan ancak, Gümrük Kanununun
      168,169 ve 170 inci maddelerinde belirtildiği şekilde geri gelen eşyanın ithalat istisnasından faydalanabilmesi için,
      bu eşyayla ilgili olarak ihracat istisnasından faydalanılan miktarın gümrük idarelerine ödenmesi veya bu miktar kadar
      teminat gösterilmesi şarttır.)
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 16/2
    alinti: '2) (Değişik: 27/1/2000-4503/1 md.) Gümrük Kanununa göre geri gelen eşyanın dışarıda bir işleme tabi tutulması
      veya asli kısmına bir ilave yapılması halinde eşyanın kazandığı değer farkı istisnaya dahil değildir.'
