  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: kâr payı politikası
  tip: hesaplama
  zorluk: 2
  kok: Artık (kalıntı) kâr payı politikası izleyen bir şirketin dönem net kârı 2.000.000 TL, gelecek yıl için onaylanan yatırım
    bütçesi 2.500.000 TL'dir. Şirketin hedef sermaye yapısı %40 borç ve %60 özkaynaktır; yeni pay ihracı düşünülmemektedir.
    Şirketin bu dönem dağıtacağı kâr payı tutarı kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 500.000 TL
    C: 800.000 TL
    D: 1.000.000 TL
    E: 1.200.000 TL
  dogru: B
  aciklama:
    dogru_neden: Artık politikada önce yatırım bütçesinin özkaynakla finanse edilecek kısmı alıkonulur, kalan kâr dağıtılır.
      Özkaynak ihtiyacı = 2.500.000 × %60 = 1.500.000 TL; dağıtılacak kâr payı = 2.000.000 − 1.500.000 = 500.000 TL (dağıtım
      oranı %25).
    celdiriciler:
      A: Yatırım bütçesinin tamamı özkaynakla finanse edilecekmiş gibi düşünülmüş; bütçe kârı aştığı için dağıtım yapılmayacağı
        sonucuna varılmıştır. Hedef yapı gereği bütçenin %40'ı borçla karşılanır.
      C: Kârın hedef borç oranı kadarı (%40) dağıtılmıştır; dağıtım oranı sermaye yapısı oranlarından türetilmez.
      D: 'Özkaynak ihtiyacı borç oranıyla hesaplanmıştır: 2.500.000 × %40 = 1.000.000 TL alıkonulmuş, 1.000.000 TL dağıtılmıştır.'
      E: Kârın hedef özkaynak oranı kadarı (%60) dağıtılmıştır; yatırım bütçesi hesaba katılmamıştır.
    hesap_adimlari:
    - 'Özkaynak ihtiyacı: 2.500.000 × 0,60 = 1.500.000 TL'
    - 'Kâr payı: 2.000.000 − 1.500.000 = 500.000 TL'
