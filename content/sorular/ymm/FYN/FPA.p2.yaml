- id: YMM-FYN-FPA-0061
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: nakit bütçesi
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin satış tahminleri ocak 400.000 TL, şubat 500.000 TL, mart 600.000 TL, nisan 700.000 TL'dir. Satışların
    %30'u satış ayında, %60'ı izleyen ayda, %10'u satıştan iki ay sonra tahsil edilmekte; tahsil edilemeyen alacak oluşmamaktadır.
    Her ay, izleyen ayın satışlarının %60'ı tutarında mal alınmakta ve alımlar alım ayını izleyen ayda ödenmektedir. Mart
    ayında ayrıca 80.000 TL ücret ve 10.000 TL faiz ödenecek, 20.000 TL amortisman ayrılacaktır. 1 Mart itibarıyla nakit mevcudu
    50.000 TL'dir; işletmenin bulundurmak istediği asgari nakit tutarı 40.000 TL'dir. Başka nakit giriş veya çıkışı yoktur.
    Mart sonu nakit mevcudu kaç TL olur?
  secenekler:
    A: 60.000 TL
    B: 80.000 TL
    C: 100.000 TL
    D: 120.000 TL
    E: 130.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Mart tahsilatı: martın %30''u (180.000) + şubatın %60''ı (300.000) + ocağın %10''u (40.000) = 520.000 TL.
      Mart ödemesi şubatta yapılan alımdır; şubat alımı mart satışlarının %60''ıdır: 360.000 TL. Diğer nakit çıkışları ücret
      80.000 ve faiz 10.000 TL''dir; amortisman nakit çıkışı değildir. Mart sonu nakit: 50.000 + 520.000 − 360.000 − 80.000
      − 10.000 = 120.000 TL. Püf noktaları: Alım tutarı izleyen ayın satışına, ödemesi ise alımı izleyen aya bağlıdır; bu
      iki gecikme birlikte, mart ödemesinin mart satışlarına dayandığı sonucunu verir. Asgari nakit tutarı yalnız finansman
      ihtiyacı ya da fazlası sorulduğunda kullanılır.'
    celdiriciler:
      A: 'Mart ödemesi olarak mart alımı (nisan satışlarının %60''ı = 420.000 TL) alınmıştır: 50.000 + 520.000 − 420.000 −
        90.000.'
      B: 'Dönem sonu nakit mevcudu yerine asgari nakit üzerindeki fazla bulunmuştur: 120.000 − 40.000.'
      C: Nakit çıkışı olmayan amortisman (20.000 TL) ödemelere eklenmiştir.
      E: 'Tahsilat yüzdeleri kaydırılmış, şubat satışının %70''i mart ayında tahsil edilmiş sayılmıştır: 180.000 + 350.000
        = 530.000 TL.'
    hesap_adimlari:
    - 'Tahsilat: 0,3 × 600.000 + 0,6 × 500.000 + 0,1 × 400.000 = 520.000 TL'
    - 'Ödeme (şubat alımı): 0,6 × 600.000 = 360.000 TL'
    - 'Diğer ödemeler: 80.000 + 10.000 = 90.000 TL'
    - 'Mart sonu nakit: 50.000 + 520.000 − 360.000 − 90.000 = 120.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — nakit bütçesi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ocak = 400000

      subat = 500000

      mart = 600000

      tahsilat = 0.3 * mart + 0.6 * subat + 0.1 * ocak

      odeme = 0.6 * mart

      sonuc = 50000 + tahsilat - odeme - 80000 - 10000'
