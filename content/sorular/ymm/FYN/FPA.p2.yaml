- id: YMM-FYN-FPA-0063
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: birleşme ve satın alma değerlemesi
  tip: hesaplama
  zorluk: 3
  kok: A A.Ş.'nin yıllık net kârı 12 milyon TL, pay sayısı 4 milyon, pay fiyatı 36 TL'dir. B A.Ş.'nin net kârı 4 milyon TL,
    pay sayısı 2 milyon, pay fiyatı 18 TL'dir. A, B'yi kendi payları karşılığında (pay değişimiyle, A payı 36 TL'den değerlenerek)
    devralacaktır. Birleşmenin yıllık net kâra 2 milyon TL sinerji katması beklenmekte, başka bir değişiklik olmayacağı varsayılmaktadır.
    A'nın birleşme sonrası pay başına kazancının birleşme öncesindeki düzeyin altına düşmemesi için B'nin her payına en fazla
    kaç TL değer biçilebilir?
  secenekler:
    A: 18 TL
    B: 24 TL
    C: 27 TL
    D: 30 TL
    E: 36 TL
  dogru: E
  aciklama:
    dogru_neden: 'A''nın birleşme öncesi PBK''sı 12 / 4 = 3 TL''dir. Birleşme sonrası net kâr 12 + 4 + 2 = 18 milyon TL olur.
      PBK''nın 3 TL''de kalması için toplam pay sayısı en fazla 18 / 3 = 6 milyon olabilir; yani B ortaklarına en fazla 2
      milyon yeni pay verilebilir. Bu, B''nin her payı için 1 A payı (değişim oranı 1), yani 1 × 36 = 36 TL değer demektir.
      Püf noktaları: Soru ölçüt olarak PBK sulanmasını kullanmaktadır; sinerji dahil birleşik kâr üzerinden azami pay sayısı
      bulunur, sonra değişim oranı A''nın pay fiyatıyla TL''ye çevrilir. PBK''yı sulandırmayan bir fiyat, değer açısından
      A ortakları için mutlaka kazançlı değildir (değer ölçütüyle sınır 30 TL''dir).'
    celdiriciler:
      A: B'nin piyasa fiyatıdır; devralma priminin PBK üzerindeki etkisi hiç hesaplanmamıştır.
      B: 'Sinerji ihmal edilmiştir: (12 + 4) / 3 = 5,33 milyon pay → 1,33 milyon yeni pay → değişim oranı 2/3 → 24 TL.'
      C: 'Sinerji B''nin fiyat/kazanç oranıyla (9) değerlenmiş ve piyasa fiyatına eklenmiştir: 18 + 1 × 9 = 27 TL.'
      D: 'PBK ölçütü yerine değer ölçütü uygulanmıştır: B''nin piyasa değeri (36 milyon) + sinerjinin A''nın F/K''sıyla değeri
        (2 × 12 = 24 milyon) = 60 milyon / 2 milyon pay = 30 TL.'
    hesap_adimlari:
    - 'A''nın PBK''sı: 12 / 4 = 3 TL'
    - 'Birleşik net kâr: 12 + 4 + 2 = 18 milyon TL'
    - 'Azami toplam pay: 18 / 3 = 6 milyon → yeni pay 2 milyon'
    - 'Değişim oranı: 2 / 2 = 1 → 1 × 36 = 36 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — birleşme ve satın alma (pay değişimi ve PBK etkisi)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'pbk = 12.0 / 4.0

      kar = 12.0 + 4.0 + 2.0

      yeni_pay = kar / pbk - 4.0

      oran = yeni_pay / 2.0

      sonuc = round(oran * 36, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
