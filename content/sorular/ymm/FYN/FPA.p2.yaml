- id: YMM-FYN-FPA-0064
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: oran analizi ve DuPont
  tip: uygulama
  zorluk: 3
  kok: Bir işletmenin dönen varlıkları yalnız hazır değerler (60.000 TL), ticari alacaklar (100.000 TL) ve stoklardan (240.000
    TL) oluşmaktadır; kısa vadeli yabancı kaynakları 200.000 TL'dir. Asit-test oranı (dönen varlıklar − stoklar) / kısa vadeli
    yabancı kaynaklar olarak hesaplanmaktadır. Aşağıdaki işlemlerden hangisi tek başına gerçekleştiğinde cari oranı düşürürken
    asit-test oranını yükseltir?
  secenekler:
    A: 100.000 TL kısa vadeli banka kredisi alınıp kasada tutulması
    B: 40.000 TL tutarındaki ticari borcun kasadaki nakitten ödenmesi
    C: 60.000 TL tutarında ticari malın veresiye (kredili) satın alınması
    D: Maliyeti 50.000 TL olan stokun 50.000 TL'ye peşin satılması
    E: 80.000 TL uzun vadeli banka kredisi alınıp kasada tutulması
  dogru: A
  aciklama:
