- id: YMM-FYN-FPA-0059
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: kaldıraç dereceleri (faaliyet; finansal; birleşik)
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin yıllık verileri şöyledir: satışlar 1.200.000 TL, değişken giderler 600.000 TL, sabit faaliyet giderleri
    400.000 TL, faiz gideri 40.000 TL, imtiyazlı paylara ödenen yıllık kâr payı 32.000 TL. Kurumlar vergisi oranı %20''dir;
    imtiyazlı kâr payı vergi sonrası kârdan ödenmektedir. Diğer koşullar sabitken satışlar %10 artarsa adi pay başına kazanç
    yüzde kaç artar?'
  secenekler:
    A: '%30'
    B: '%37,5'
    C: '%46,875'
    D: '%50'
    E: '%100'
  dogru: D
  aciklama:
    dogru_neden: 'FVÖK = 1.200.000 − 600.000 − 400.000 = 200.000 TL. Faaliyet kaldıraç derecesi = katkı payı / FVÖK = 600.000
      / 200.000 = 3. İmtiyazlı kâr payının vergi öncesi karşılığı 32.000 / (1 − 0,20) = 40.000 TL''dir. Finansal kaldıraç
      derecesi = 200.000 / (200.000 − 40.000 − 40.000) = 5/3. Birleşik kaldıraç = 3 × 5/3 = 5; pay başına kazanç %10 × 5 =
      %50 artar. (Kontrol: adi paylara kalan kâr 96.000 TL''den 144.000 TL''ye çıkar.) Püf noktaları: İmtiyazlı kâr payı vergiden
      sonra ödendiğinden finansal kaldıraç paydasında (1 − t) ile bölünerek vergi öncesine çevrilir. Faaliyet kaldıracı satış/FVÖK
      ile değil katkı payı/FVÖK ile hesaplanır.'
    celdiriciler:
      A: Yalnız faaliyet kaldıracı (3) uygulanmış; finansal kaldıracın pay başına kazanca etkisi unutulmuştur.
      B: 'İmtiyazlı kâr payı ihmal edilmiştir: FKD = 200.000 / 160.000 = 1,25; BKD = 3,75.'
      C: 'İmtiyazlı kâr payı vergi öncesine çevrilmeden düşülmüştür: FKD = 200.000 / 128.000 = 1,5625; BKD = 4,6875.'
      E: 'Faaliyet kaldıracı satışlar / FVÖK (1.200.000 / 200.000 = 6) olarak hesaplanmıştır: 6 × 5/3 = 10.'
    hesap_adimlari:
    - FVÖK = 200.000 TL; FKD = 600.000 / 200.000 = 3
    - 'İmtiyazlı kâr payı vergi öncesi: 32.000 / 0,8 = 40.000 TL'
    - FinKD = 200.000 / (200.000 − 40.000 − 40.000) = 5/3
    - BKD = 5 → PBK değişimi = 5 × %10 = %50
  kaynaklar:
  - mevzuat: Genel bilgi — faaliyet, finansal ve birleşik kaldıraç
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 's = 1200000.0

      fvok = s - 600000 - 400000

      fkd = (s - 600000) / fvok

      imt = 32000 / (1 - 0.20)

      finkd = fvok / (fvok - 40000 - imt)

      sonuc = round(fkd * finkd * 10, 3)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, satır 15
- id: YMM-FYN-FPA-0060
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: oran analizi ve DuPont
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin net kâr marjı %5, aktif devir hızı 2, özkaynak çarpanı (toplam aktif / özkaynak) 2'dir; kârın %40'ını
    kâr payı olarak dağıtmaktadır. Özkaynak kârlılığı dönem başı özkaynak üzerinden hesaplanmakta ve sürdürülebilir büyüme
    oranı = özkaynak kârlılığı × kârın alıkonulan oranı formülüyle bulunmaktadır. İşletme yeni pay ihraç etmeden, net kâr
    marjını, aktif devir hızını ve kâr dağıtım oranını değiştirmeden sürdürülebilir büyüme oranını %18'e çıkarmak istemektedir.
    Bunun için borç/özkaynak oranı kaç olmalıdır?
  secenekler:
    A: 0,8
    B: 1,0
    C: 2,0
    D: 3,0
    E: 3,5
  dogru: C
  aciklama:
    dogru_neden: 'Alıkonulan oran 1 − 0,40 = 0,60''tır. %18 büyüme için gerekli özkaynak kârlılığı 18 / 0,60 = %30''dur. DuPont''a
      göre ÖK kârlılığı = net kâr marjı × aktif devir hızı × özkaynak çarpanı → 30 = 5 × 2 × ÖÇ → ÖÇ = 3. Özkaynak çarpanı
      = 1 + borç/özkaynak olduğundan borç/özkaynak = 3 − 1 = 2,0. (Mevcut durumda ÖK kârlılığı %20, büyüme %12, borç/özkaynak
      1,0''dır.) Püf noktaları: Önce büyüme hedefinden gerekli ÖK kârlılığına (alıkonulan oranla bölerek), sonra DuPont ile
      özkaynak çarpanına geri gidin. Özkaynak çarpanı borç/özkaynak oranı değildir; aradaki fark 1''dir.'
    celdiriciler:
      A: 'Alıkonulan oran dikkate alınmadan hedef büyüme oranı ÖK kârlılığı sayılmıştır: 18 / 10 = 1,8 → borç/özkaynak 0,8.'
      B: Mevcut sermaye yapısıdır (özkaynak çarpanı 2 → borç/özkaynak 1); bu yapıyla sürdürülebilir büyüme %12'de kalır.
      D: Gerekli özkaynak çarpanı (3) doğrudan borç/özkaynak oranı sanılmıştır.
      E: 'Alıkonulan oran yerine dağıtım oranı (0,40) kullanılmıştır: ÖK kârlılığı 18 / 0,40 = %45 → ÖÇ = 4,5 → borç/özkaynak
        3,5.'
    hesap_adimlari:
    - 'Alıkonulan oran: 0,60'
    - 'Gerekli ÖK kârlılığı: 18 / 0,60 = %30'
    - ÖÇ = 30 / (5 × 2) = 3
    - Borç/özkaynak = 3 − 1 = 2,0
  kaynaklar:
  - mevzuat: Genel bilgi — DuPont analizi ve sürdürülebilir büyüme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'marj = 5.0

      devir = 2.0

      b = 1 - 0.40

      roe = 18.0 / b

      ec = roe / (marj * devir)

      sonuc = round(ec - 1, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
