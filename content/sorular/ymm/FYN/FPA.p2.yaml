- id: YMM-FYN-FPA-0065
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: kaldıraç dereceleri (faaliyet; finansal; birleşik)
  tip: hesaplama
  zorluk: 2
  kok: Tek ürün üreten bir işletmenin ürününün birim satış fiyatı 125 TL, birim değişken maliyeti 75 TL'dir. İşletmenin başabaş
    satış miktarı 8.000 birim olup bu yıl 10.000 birim satış yapmıştır. Fiyat, birim değişken maliyet ve sabit giderler değişmeden
    gelecek yıl satış miktarı %6 artarsa faiz ve vergi öncesi kâr (FVÖK) kaç TL olur?
  secenekler:
    A: 101.200 TL
    B: 106.000 TL
    C: 107.500 TL
    D: 124.000 TL
    E: 130.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'Birim katkı payı 125 − 75 = 50 TL; sabit giderler 8.000 × 50 = 400.000 TL. Bu yılki FVÖK = (10.000 − 8.000)
      × 50 = 100.000 TL. Faaliyet kaldıraç derecesi = Q / (Q − Qbaşabaş) = 10.000 / 2.000 = 5; FVÖK %6 × 5 = %30 artarak 130.000
      TL olur. (Doğrudan: 10.600 birimde FVÖK = 2.600 × 50 = 130.000 TL.)'
    celdiriciler:
      A: 'Kaldıraç derecesi ters kurulmuştur: (Q − Qbaşabaş) / Q = 0,2 → FVÖK %1,2 artar.'
      B: FVÖK'ün satışlarla aynı oranda (%6) arttığı varsayılmış, faaliyet kaldıracı göz ardı edilmiştir.
      C: Kaldıraç derecesi Q / Qbaşabaş = 10.000 / 8.000 = 1,25 alınmıştır → %7,5 artış.
      D: Kaldıraç derecesi Qbaşabaş / (Q − Qbaşabaş) = 8.000 / 2.000 = 4 alınmıştır → %24 artış.
    hesap_adimlari:
    - Birim katkı payı 50 TL; sabit gider 400.000 TL
    - 'Mevcut FVÖK: 2.000 × 50 = 100.000 TL'
    - FKD = 10.000 / 2.000 = 5 → FVÖK artışı %30
    - 'Yeni FVÖK: 130.000 TL'
