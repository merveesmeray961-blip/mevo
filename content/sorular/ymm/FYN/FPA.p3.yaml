- id: YMM-FYN-FPA-0067
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal planlama analiz ve kâr dağıtımı
  konu: FPA
  kazanim: kaldıraç dereceleri (faaliyet, finansal, birleşik)
  tip: uygulama
  zorluk: 2
  kok: 'Bir şirketin katkı payı 800.000 TL, faaliyet kârı (FVÖK) 400.000 TL

    ve faiz gideri 100.000 TL''dir.

    Aşağıdakilerden hangisi bu şirket için doğrudur?

    '
  secenekler:
    A: DOL = 1,5 ve DFL = 1,33
    B: DOL = 2,0 ve DFL = 1,33
    C: DOL = 2,0 ve DFL = 1,25
    D: DOL = 1,5 ve DFL = 1,25
    E: DOL = 2,0 ve DFL = 2,0
  dogru: B
  aciklama:
    dogru_neden: 'DOL = Katkı payı / FVÖK = 800.000 / 400.000 = 2,0 DFL = FVÖK / (FVÖK − Faiz) = 400.000 / (400.000 − 100.000)
      = 400.000 / 300.000 ≈ 1,33

      '
    celdiriciler:
      A: DOL formülü yanlış uygulanmış; doğrusu 2,0.
      C: DFL paydası yanlış; 400.000 − 100.000 = 300.000 → 1,33 çıkmalı.
      D: DOL ve DFL her ikisi yanlış.
      E: DFL 2,0 değil; faiz gideri ile FVÖK arasındaki fark 300.000 TL'dir.
