  konu: FPA
  kazanim: bedelsiz sermaye artırımı teorik fiyatı
  tip: hesaplama
  zorluk: 1
  kok: Piyasa fiyatı 50 TL olan bir paya sahip şirket, ortaklarına her 100 paya karşılık 25 adet bedelsiz pay vermektedir.
    Başka bir bilgi yoksa bedelsiz artırım sonrası payın teorik fiyatı kaç TL'dir?
  secenekler:
    A: 40,00 TL
    B: 50,00 TL
    C: 62,50 TL
    D: 66,67 TL
    E: 75,00 TL
  dogru: A
  aciklama:
    dogru_neden: Bedelsiz artırımda şirkete nakit girmez; toplam değer sabit kalır, pay sayısı 1 + 0,25 kat artar. Teorik
      fiyat = 50 / 1,25 = 40,00 TL.
    celdiriciler:
      B: Fiyatın değişmediği varsayılmış; pay sayısı arttığı için fiyat düşer.
      C: Fiyat artış oranıyla çarpılmış; pay sayısı artınca fiyat yükselmez, düşer.
      D: Fiyat (1 − oran)'a bölünmüş; doğru payda 1 + oran'dır.
      E: Oran TL olarak fiyata eklenmiş; birimler uyuşmaz, fiyat yüzde olarak ölçeklenir ve düşer.
    hesap_adimlari:
    - Toplam değer sabit
    - Yeni fiyat = eski fiyat / (1 + oran)
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — bedelsiz sermaye artırımı teorik fiyatı
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fiyat, oran = 50, 25

      sonuc = fiyat / (1 + oran / 100)

      yanlis = {"a": fiyat, "b": fiyat / (1 - oran / 100), "c": fiyat * (1 + oran / 100), "d": fiyat + oran}

      '
