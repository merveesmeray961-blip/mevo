- id: YMM-FYN-ISY-0056
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: nakit ve stok yönetimi (EOQ)
  tip: uygulama
  zorluk: 3
  kok: 'Bir işletme nakit yönetiminde Miller-Orr modelini kullanmaktadır. Yönetimin belirlediği alt nakit sınırı 20.000 TL''dir.
    Menkul kıymet alım ya da satımının işlem başına sabit maliyeti 100 TL, günlük net nakit akışlarının varyansı 4.000.000
    TL² (standart sapma 2.000 TL), günlük faiz oranı %0,03''tür. Model: dönüş noktası Z = L + [3Fσ² / (4i)]^(1/3), üst sınır
    H = 3Z − 2L.


    I. Dönüş (hedef) nakit düzeyi 30.000 TL''dir.

    II. Nakit bakiyesi üst sınıra ulaştığında 20.000 TL''lik menkul kıymet satın alınır.

    III. Nakit bakiyesi alt sınıra düştüğünde 30.000 TL''lik menkul kıymet satılır.

    IV. Diğer koşullar sabitken günlük nakit akışlarının varyansı artarsa alt ve üst sınır arasındaki fark genişler.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: '3Fσ² / (4i) = 3 × 100 × 4.000.000 / (4 × 0,0003) = 1.200.000.000 / 0,0012 = 10¹²; küp kökü 10.000 TL''dir.
      Z = 20.000 + 10.000 = 30.000 TL (I doğru). H = 3 × 30.000 − 2 × 20.000 = 50.000 TL; bakiye 50.000 TL''ye ulaşınca dönüş
      noktasına inmek için 50.000 − 30.000 = 20.000 TL''lik menkul kıymet alınır (II doğru). Alt sınırda bakiye dönüş noktasına
      çıkarılır; satılacak menkul kıymet 30.000 − 20.000 = 10.000 TL''dir (III yanlış). Aralık 3 × [3Fσ²/(4i)]^(1/3) olduğundan
      varyans arttıkça genişler (IV doğru). Püf noktaları: Sınırlara ulaşıldığında bakiye sıfıra ya da sınırın kendisine değil,
      her iki durumda da dönüş noktasına (Z) getirilir; alım ve satım tutarları bu nedenle farklıdır (H − Z = 20.000, Z −
      L = 10.000).'
    celdiriciler:
      A: 'IV de doğrudur: nakit akışlarındaki oynaklık arttıkça model daha geniş bir kontrol aralığı öngörür.'
      B: III yanlıştır; alt sınırda bakiye dönüş noktasına çıkarılır, satış tutarı 10.000 TL'dir. II'nin doğru olduğu da gözden
        kaçmıştır.
      C: I de doğrudur; dönüş noktası alt sınıra 10.000 TL eklenerek 30.000 TL bulunur.
      D: III yanlıştır, II doğrudur; üst sınırdaki alım (20.000 TL) ile alt sınırdaki satım (10.000 TL) tutarları karıştırılmıştır.
