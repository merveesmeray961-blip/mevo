  kok: Bir işletmenin yıllık satışları 7.200.000 TL, satışların maliyeti 5.400.000 TL'dir. Stokta kalma süresi ve ticari borç
    ödeme süresi satışların maliyeti, alacak tahsil süresi ise satışlar üzerinden hesaplanmaktadır; yıl 360 gün kabul edilmektedir.
    İşletme yeni bir uygulamayla stokta kalma süresini 60 günden 40 güne, alacak tahsil süresini 45 günden 40 güne indirecek;
    tedarikçilerle anlaşarak ticari borç ödeme süresini 30 günden 45 güne çıkaracaktır. Satışlar ve satışların maliyeti değişmeyecektir.
