        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, satır 3
- id: YMM-FYN-ISY-0053
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: alacak yönetimi ve kredi politikası
  tip: hesaplama
  zorluk: 3
  kok: Yıllık kredili satışları 7.200.000 TL olan bir işletmenin müşterilerinin tamamı faturayı 60. günde ödemekte, şüpheli
    alacaklar satışların %1'i kadar gerçekleşmektedir. İşletme "2/10, net 60" koşuluna geçmeyi değerlendirmektedir. Bu durumda
    müşterilerin (satış tutarı itibarıyla) yarısının %2 iskontodan yararlanarak 10. günde, diğer yarısının yine 60. günde
    ödeme yapacağı ve şüpheli alacak oranının %0,5'e düşeceği tahmin edilmektedir. Satış tutarı değişmeyecektir. Alacaklara
    bağlanan fonun yıllık fırsat maliyeti, alacakların satış tutarı üzerinden %20'dir; yıl 360 gün kabul edilmektedir. Yeni
    koşula geçişin işletmeye yıllık net etkisi kaç TL'dir?
  secenekler:
    A: 28.000 TL
    B: 64.000 TL
    C: 100.000 TL
    D: 136.000 TL
    E: 164.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Ortalama tahsil süresi 0,5 × 10 + 0,5 × 60 = 35 güne iner. Ortalama alacak 7.200.000 / 360 × 60 = 1.200.000
      TL''den 7.200.000 / 360 × 35 = 700.000 TL''ye düşer; serbest kalan 500.000 TL''nin fırsat maliyeti tasarrufu 500.000
      × %20 = 100.000 TL''dir. Şüpheli alacak tasarrufu 7.200.000 × (%1 − %0,5) = 36.000 TL''dir. İskonto maliyeti 7.200.000
      × %50 × %2 = 72.000 TL''dir. Net etki: 100.000 + 36.000 − 72.000 = +64.000 TL. Püf noktaları: İskonto yalnız iskontodan
      yararlanan satışlar üzerinden hesaplanır; yeni ortalama tahsil süresi iki grubun ağırlıklı ortalamasıdır (10 gün değil
      35 gün). Üç kalemin (alacak fonu, şüpheli alacak, iskonto) birlikte değerlendirilmesi gerekir.'
    celdiriciler:
      A: 'Şüpheli alacaklardaki 36.000 TL''lik azalış hesaba katılmamıştır: 100.000 − 72.000.'
      C: Yalnız alacak fonundaki tasarruf alınmış; şüpheli alacak tasarrufu ve iskonto maliyeti birlikte unutulmuştur.
      D: 'İskonto maliyeti (72.000 TL) düşülmemiştir: 100.000 + 36.000.'
      E: 'Tüm müşterilerin 10. günde ödeyeceği varsayılarak alacak 200.000 TL''ye indirilmiş (1.000.000 × %20 = 200.000 TL
        tasarruf), iskonto ise yarı satış üzerinden alınmıştır: 200.000 + 36.000 − 72.000.'
    hesap_adimlari:
    - 'Yeni ortalama tahsil süresi: 0,5 × 10 + 0,5 × 60 = 35 gün'
    - 'Alacak azalışı: 20.000 × (60 − 35) = 500.000 TL → fırsat maliyeti tasarrufu 100.000 TL'
    - 'Şüpheli alacak tasarrufu: 7.200.000 × %0,5 = 36.000 TL'
    - 'İskonto maliyeti: 3.600.000 × %2 = 72.000 TL'
    - 'Net etki: 100.000 + 36.000 − 72.000 = 64.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — alacak yönetimi (nakit iskontosu politikası)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'satis = 7200000

      gunluk = satis / 360

      ats = 0.5 * 10 + 0.5 * 60

      alacak_tasarruf = (60 - ats) * gunluk * 0.20

      supheli = satis * (0.01 - 0.005)

      iskonto = satis * 0.5 * 0.02

      sonuc = round(alacak_tasarruf + supheli - iskonto, 2)'
