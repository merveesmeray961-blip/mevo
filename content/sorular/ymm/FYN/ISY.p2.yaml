      100.000 TL'si kısa vadeli krediyle finanse edilmektedir; bu atak (agresif) politikadır. Mevsimsel ihtiyaç sıfır olduğunda
      dahi 100.000 TL, en yoğun dönemde 100.000 + 400.000 = 500.000 TL kısa vadeli kredi kullanılır.
    celdiriciler:
      B: Vade uyumu için uzun vadeli kaynakların duran varlıkları değil, duran varlıklar ile sürekli dönen varlıkların toplamını
        (1.200.000 TL) karşılaması gerekir.
      C: Fon fazlası ancak uzun vadeli kaynaklar sürekli ihtiyacı aşarsa doğar; burada uzun vadeli kaynak 100.000 TL eksiktir.
      D: Sürekli varlıkların finanse edilmeyen 100.000 TL'lik kısmı unutulmuştur; en yoğun dönemde kredi 500.000 TL'dir ve
        dip dönemde de 100.000 TL kredi kalır.
      E: Atak politikada beklenen kârlılık yüksektir; ancak likidite düşer ve kısa vadeli borcun yenilenmesi (faiz ve yenileme)
        riski artar.
