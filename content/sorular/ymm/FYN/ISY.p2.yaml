- id: YMM-FYN-ISY-0050
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: kısa vadeli finansman
  tip: hesaplama
  zorluk: 2
  kok: Bir işletme bankadan bir yıl vadeli, 1.000.000 TL nominal tutarlı kredi kullanacaktır. Yıllık faiz oranı %15'tir ve
    faiz kredi kullandırılırken peşin olarak kesilmektedir (iskontolu kredi). Banka ayrıca kredi süresince nominal tutarın
    %10'unun faizsiz bir hesapta bloke tutulmasını (telafi edici bakiye) şart koşmaktadır. İşletmenin bu bankada başka mevduatı
    yoktur. Kredinin yıllık efektif maliyeti yüzde kaçtır?
  secenekler:
    A: '%15'
    B: '%16,67'
    C: '%17,65'
    D: '%20'
    E: '%25'
  dogru: D
  aciklama:
    dogru_neden: 'İşletmenin fiilen kullanabildiği tutar, nominal tutardan peşin faiz (150.000 TL) ve bloke bakiye (100.000
      TL) düşülerek bulunur: 1.000.000 − 150.000 − 100.000 = 750.000 TL. Bu tutar için katlanılan faiz 150.000 TL olduğundan
      efektif maliyet 150.000 / 750.000 = %20''dir.'
    celdiriciler:
      A: Nominal faiz oranıdır; peşin faiz kesintisi ve bloke bakiyenin kullanılabilir fonu azaltması dikkate alınmamıştır.
      B: 'Yalnız bloke bakiye dikkate alınmış, peşin faiz kesintisi unutulmuştur: 150.000 / 900.000.'
      C: 'Yalnız peşin faiz kesintisi dikkate alınmış, bloke bakiye unutulmuştur: 150.000 / 850.000.'
      E: 'Bloke bakiye faiz gibi bir maliyet kalemi sayılmış ve nominal tutara bölünmüştür: (150.000 + 100.000) / 1.000.000.'
    hesap_adimlari:
    - 'Peşin faiz: 1.000.000 × %15 = 150.000 TL'
    - 'Bloke bakiye: 1.000.000 × %10 = 100.000 TL'
    - 'Kullanılabilir fon: 1.000.000 − 150.000 − 100.000 = 750.000 TL'
    - 'Efektif maliyet: 150.000 / 750.000 = %20'
  kaynaklar:
  - mevzuat: Genel bilgi — kısa vadeli finansman (iskontolu kredi, telafi edici bakiye)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'nominal = 1000000

      faiz = nominal * 0.15

      bloke = nominal * 0.10

      kullanilabilir = nominal - faiz - bloke

      sonuc = round(faiz / kullanilabilir * 100, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, satır 1
- id: YMM-FYN-ISY-0051
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: kısa vadeli finansman
  tip: hesaplama
  zorluk: 3
  kok: 'Bir tedarikçi "4/10, net 40" koşuluyla satış yapmaktadır: fatura 10 gün içinde ödenirse %4 iskonto uygulanmakta, aksi
    hâlde tutarın tamamı 40. günde ödenmektedir. Alıcı işletme iskontodan yararlanmadığında faturayı fiilen 70. günde ödemekte,
    tedarikçi bu gecikme için faiz, ceza veya başka bir ek bedel uygulamamaktadır. Yıl 360 gün kabul edilmekte ve maliyet
    basit faiz esasıyla (bileşik etki dikkate alınmadan) hesaplanmaktadır. Bu alıcı için iskontodan yararlanmamanın yıllık
    maliyeti yüzde kaçtır?'
  secenekler:
    A: '%21,43'
    B: '%24'
    C: '%25'
    D: '%48'
    E: '%50'
  dogru: C
  aciklama:
    dogru_neden: 'İskontodan vazgeçen alıcı, faturanın %96''sını 10. günde ödemek yerine tamamını 70. günde öder; yani 96
      TL''lik bir kredi için 60 gün süreyle 4 TL bedel öder. Yıllık maliyet = 4/96 × 360/(70 − 10) = (1/24) × 6 = %25. Püf
      noktaları: Kredi süresi ödemenin fiilen yapıldığı gün ile iskonto süresinin son günü arasındaki farktır (70 − 10 = 60
      gün); sözleşmedeki 40. gün değil. Ayrıca bedel faturanın tamamına değil, iskontolu tutara (%96) oranlanır.'
    celdiriciler:
      A: 'Gün farkı yerine ödemenin yapıldığı gün (70) kullanılmıştır: 4/96 × 360/70; oysa ilk 10 gün iskontolu ödemede de
        kredi niteliğindedir.'
      B: 'İskonto oranı iskontolu tutara değil fatura tutarına oranlanmıştır: %4 × 360/60.'
      D: 'Hem vade olarak sözleşmedeki 40. gün alınmış hem de iskonto fatura tutarına oranlanmıştır: %4 × 360/30.'
      E: 'Sözleşmedeki net vade (40. gün) esas alınmıştır: 4/96 × 360/30. Alıcı ödemeyi 70. güne erteleyebildiği için kredi
        süresi 60 gündür.'
    hesap_adimlari:
    - 'Dönemsel maliyet: 4 / 96 = 1/24'
    - 'Kredi süresi: 70 − 10 = 60 gün'
    - 'Yıldaki dönem sayısı: 360 / 60 = 6'
    - 'Yıllık maliyet: (1/24) × 6 = %25'
  kaynaklar:
  - mevzuat: Genel bilgi — kısa vadeli finansman (ticari kredi, nakit iskontosu)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'iskonto = 4.0

      sure = 70 - 10

      sonuc = round(iskonto / (100 - iskonto) * 360 / sure * 100, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
