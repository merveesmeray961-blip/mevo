      (nakit dönüşüm süresi 75 günden 35 güne iner). Püf noktaları: Gün farkları her kalemin kendi tabanıyla (stok ve borç
      için SMM, alacak için satışlar) çarpılmalıdır; nakit dönüşüm süresindeki 40 günlük azalışı tek bir tabanla çarpmak yanlış
      sonuç verir. Borç süresinin uzaması fon ihtiyacını azaltır, artırmaz.'
    celdiriciler:
      A: 'Ticari borç süresinin uzaması fon ihtiyacını artırıyormuş gibi ters işaretle alınmıştır: 300.000 + 100.000 − 225.000.'
      B: Ticari borç ödeme süresindeki uzamanın sağladığı 225.000 TL'lik fon hesaba katılmamıştır.
      C: 'Nakit dönüşüm süresindeki 40 günlük azalışın tamamı günlük satışların maliyetiyle çarpılmıştır: 40 × 15.000.'
      E: 'Nakit dönüşüm süresindeki 40 günlük azalışın tamamı günlük satışlarla çarpılmıştır: 40 × 20.000.'
