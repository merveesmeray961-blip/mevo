        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-2.yaml, satır 2
- id: YMM-FYN-ISY-0052
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: nakit ve stok yönetimi (EOQ)
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin yıllık hammadde ihtiyacı 3.600 birim, birim alış fiyatı 20 TL, sipariş başına maliyeti 50 TL'dir. Yıllık
    stok bulundurma maliyeti birim alış fiyatının %20'sidir. İşletme şu an ekonomik sipariş miktarıyla (EOQ) sipariş vermektedir.
    Tedarikçi, sipariş başına en az 900 birim alınması hâlinde birim fiyatta %1 indirim önermektedir. Talep yıl boyunca düzenlidir,
    güvenlik stoku tutulmamaktadır ve ortalama stok sipariş miktarının yarısıdır. Teklif kabul edilip her seferinde 900 birim
    sipariş verilirse, alış bedeli dâhil toplam yıllık stok maliyetindeki değişim kaç TL olur? (− azalış, + artış)
  secenekler:
    A: −1.120 TL
    B: −720 TL
    C: +62 TL
    D: +80 TL
    E: +1.244 TL
  dogru: C
  aciklama:
    dogru_neden: 'Mevcut durumda birim bulundurma maliyeti 20 × %20 = 4 TL, EOQ = √(2 × 3.600 × 50 / 4) = √90.000 = 300 birimdir.
      Toplam maliyet: alış 72.000 + sipariş (12 × 50) 600 + bulundurma (150 × 4) 600 = 73.200 TL. Teklifte birim fiyat 19,80
      TL, bulundurma maliyeti 19,80 × %20 = 3,96 TL olur. Toplam: alış 71.280 + sipariş (4 × 50) 200 + bulundurma (450 × 3,96)
      1.782 = 73.262 TL. Toplam maliyet 62 TL artar; teklif kabul edilmemelidir. Püf noktaları: Bulundurma maliyeti fiyatın
      yüzdesi olarak verildiğinden indirimle birlikte birim bulundurma maliyeti de düşer (4 TL değil 3,96 TL). Bulundurma
      maliyeti sipariş miktarı üzerinden değil, ortalama stok (Q/2) üzerinden hesaplanır.'
    celdiriciler:
      A: Alış bedelindeki 720 TL ve sipariş maliyetindeki 400 TL azalış alınmış; ortalama stoğun 150 birimden 450 birime çıkmasıyla
        artan bulundurma maliyeti ihmal edilmiştir.
      B: Yalnız alış bedelindeki indirim (3.600 × 0,20) dikkate alınmış; sipariş ve bulundurma maliyetlerindeki değişim unutulmuştur.
      D: İndirimden sonra da birim bulundurma maliyeti 4 TL alınmıştır (450 × 4 = 1.800 TL); fiyatın %20'si olan bulundurma
        maliyeti 3,96 TL'ye düşer.
      E: Bulundurma maliyeti her iki politikada ortalama stok yerine sipariş miktarının tamamı üzerinden hesaplanmıştır (300
        × 4 ve 900 × 3,96).
    hesap_adimlari:
    - EOQ = √(2 × 3.600 × 50 / 4) = 300 birim
    - 'Mevcut toplam: 72.000 + 600 + 600 = 73.200 TL'
    - Yeni fiyat 19,80 TL; bulundurma 3,96 TL/birim
    - 'Yeni toplam: 71.280 + 200 + 450 × 3,96 (1.782) = 73.262 TL'
    - 'Değişim: 73.262 − 73.200 = +62 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — stok yönetimi (EOQ, miktar indirimi)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'D = 3600

      S = 50

      f = 20.0

      H = f * 0.20

      q = (2 * D * S / H) ** 0.5

      mevcut = D * f + D / q * S + q / 2 * H

      f2 = f * 0.99

      H2 = f2 * 0.20

      q2 = 900

      yeni = D * f2 + D / q2 * S + q2 / 2 * H2

      sonuc = round(yeni - mevcut, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
