  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: kısa vadeli finansman
  tip: uygulama
  zorluk: 2
  kok: Bir işletmenin duran varlıkları 900.000 TL, yıl boyunca sürekli olarak elde tutması gereken dönen varlıkları 300.000
    TL'dir. Mevsimsel dönen varlık ihtiyacı yıl içinde 0 ile 400.000 TL arasında değişmektedir. İşletmenin uzun vadeli kaynakları
    (özkaynak ve uzun vadeli borç) yıl boyunca 1.100.000 TL'dir; kalan ihtiyaç kısa vadeli banka kredisiyle karşılanmaktadır.
    Bu işletmenin varlık finansmanı politikasıyla ilgili aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Atak politika izlenir; mevsimsel ihtiyacın sıfır olduğu dönemde bile 100.000 TL kısa vadeli kredi kullanılır.
    B: Vade uyumu politikası izlenir; uzun vadeli kaynaklar duran varlıkların tamamını karşıladığı için kısa vadeli kredi
      yalnız mevsimsel ihtiyaçta kullanılır.
    C: Muhafazakâr politika izlenir; mevsimsel ihtiyacın sıfır olduğu dönemde 200.000 TL fon fazlası kısa vadeli menkul kıymetlere
      yatırılır.
    D: Atak politika izlenir; kısa vadeli kredi ihtiyacı en yoğun dönemde 400.000 TL'ye ulaşır, dip dönemde ise sıfıra iner.
    E: Atak politika izlenir; muhafazakâr politikaya göre beklenen kârlılığı ve likiditesi yüksek, yenileme riski düşüktür.
