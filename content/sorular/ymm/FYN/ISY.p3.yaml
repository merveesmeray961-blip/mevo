  ders: FYN
  unite: İşletme sermayesi yönetimi
  konu: ISY
  kazanim: Kısa vadeli finansman
  tip: uygulama
  zorluk: 2
  kok: 'XYZ Ltd., 90 günlük vadeye sahip 500.000 TL''lik bir banka kredisini yıllık %18 faiz oranıyla kullanmaktadır.

    Buna göre aşağıdaki ifadelerden hangisi doğrudur?

    '
  secenekler:
    A: Ödenecek faiz tutarı 22.500 TL'dir.
    B: Ödenecek faiz tutarı 90.000 TL'dir.
    C: Efektif yıllık maliyet tam olarak %18'dir.
    D: Faiz vade başında peşin alınırsa efektif maliyet %18'den düşük olur.
    E: 90 günlük faiz tutarı 45.000 TL'dir.
  dogru: A
  aciklama:
    dogru_neden: Faiz = 500.000 × 0,18 × (90/360) = 500.000 × 0,045 = 22.500 TL.
    celdiriciler:
      B: Yıllık faiz tutarına karşılık gelir; vade dikkate alınmamış.
      C: Efektif yıllık maliyet, bileşik hesap nedeniyle nominal %18'den farklılaşır.
      D: Faizin peşin alınması (iskonto yöntemi) kullanılabilir fonu düşüreceğinden efektif maliyeti artırır, azaltmaz.
