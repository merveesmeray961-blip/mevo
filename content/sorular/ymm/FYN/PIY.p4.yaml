    C: I izleme maliyeti, II kalıntı kayıp, III bağlama maliyeti
    D: I kalıntı kayıp, II bağlama maliyeti, III izleme maliyeti
    E: I bağlama maliyeti, II kalıntı kayıp, III izleme maliyeti
