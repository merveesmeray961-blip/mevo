- id: YMM-FYN-PIY-0009
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: swap ve kredi temerrüt swabı
  tip: hesaplama
  zorluk: 3
  kok: 'X ve Y şirketlerinin 50.000.000 TL tutarında 3 yıl vadeli borçlanma maliyetleri aşağıdadır:

    | Şirket | Sabit faiz | Değişken faiz |

    |---|---|---|

    | X | %32 | TLREF + %1,5 |

    | Y | %36 | TLREF + %2,5 |

    X değişken, Y sabit faizli borçlanmak istemektedir. Taraflar karşılaştırmalı üstünlüklerine göre borçlanıp aracı banka
    üzerinden faiz swapı yapacaktır. Toplam kazancın 1 puanı aracı bankaya kalacak, geri kalanı X ile Y arasında eşit paylaşılacaktır.
    Swap sonrasında Y''nin katlandığı net sabit borçlanma maliyeti yüzde kaçtır?

    '
  secenekler:
    A: '%33'
    B: '%34'
    C: '%34,5'
    D: '%35'
    E: '%36'
  dogru: D
  aciklama:
    dogru_neden: 'Sabit piyasada fark 4 puan, değişken piyasada 1 puandır; X''in karşılaştırmalı üstünlüğü sabit, Y''ninki
      değişken piyasadadır. Swapsız toplam maliyet: X değişken (TLREF + 1,5) + Y sabit (36) = TLREF + 37,5. Swaplı: X sabit
      (32) + Y değişken (TLREF + 2,5) = TLREF + 34,5. Toplam kazanç 3 puan; banka 1 puan alır, kalan 2 puan eşit bölününce
      her şirket 1 puan kazanır. Y''nin net maliyeti 36 − 1 = %35''tir. Püf noktaları: Toplam kazanç, iki piyasadaki farkların
      farkıdır (4 − 1); önce aracının payını düş, sonra kalanı paylaştır. Y''nin kazancı kendi sabit piyasa maliyetinden düşülür.'
    celdiriciler:
      A: Toplam kazancın (3 puan) tamamı Y'ye verilmiştir.
      B: Banka payı düşülmeden kazanç eşit bölünmüş ve Y'ye 2 puan verilmiştir.
      C: Banka payı dikkate alınmadan her tarafa 1,5 puan kazanç verilmiştir.
      E: Swap kazancı hiç dikkate alınmamıştır.
    hesap_adimlari:
    - Kazanç = (36 − 32) − (2,5 − 1,5) = 3 puan
    - Banka = 1; taraflara = 2 → her biri 1
    - Y net = 36 − 1 = %35
  kaynaklar:
