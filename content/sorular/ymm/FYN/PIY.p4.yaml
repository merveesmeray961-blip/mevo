- id: YMM-FYN-PIY-0007
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: kur riski ve korunma
  tip: hesaplama
  zorluk: 3
  kok: İthalatçı (B) AŞ, 3 ay sonra 200.000 USD ödeyecektir. Kur riskine karşı kullanım fiyatı 43,00 TL olan Avrupa tipi bir
    USD alım opsiyonu satın almış ve USD başına 0,60 TL primi peşin ödemiştir (primin zaman değeri ihmal edilecektir). Vadede
    spot kurun 44,50 TL olması ve 42,00 TL olması durumlarında, şirketin ithalat borcu için katlanacağı prim dahil toplam
    TL tutarı sırasıyla hangisidir?
  secenekler:
    A: 44,50'de 8.720.000 TL; 42,00'de 8.520.000 TL
    B: 44,50'de 8.600.000 TL; 42,00'de 8.400.000 TL
    C: 44,50'de 8.720.000 TL; 42,00'de 8.720.000 TL
    D: 44,50'de 9.020.000 TL; 42,00'de 8.520.000 TL
    E: 44,50'de 8.720.000 TL; 42,00'de 8.280.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Prim = 200.000 × 0,60 = 120.000 TL. Spot 44,50 > 43,00 olduğunda opsiyon kullanılır: 200.000 × 43,00 + 120.000
      = 8.720.000 TL. Spot 42,00 < 43,00 olduğunda opsiyon kullanılmaz, döviz spottan alınır: 200.000 × 42,00 + 120.000 =
      8.520.000 TL. Püf noktaları: Alım opsiyonu ithalatçının maliyetine bir tavan (43,60 TL/USD) koyar, kur düşerse avantajdan
      yararlanmasına izin verir; her senaryoda kullanım kararını ayrı ver ve primi iki senaryoda da maliyete ekle.'
    celdiriciler:
      B: Peşin ödenen prim maliyete eklenmemiştir.
      C: Spot kur kullanım fiyatının altındayken opsiyon kullanılmaz; döviz spottan daha ucuza alınır.
      D: Spot kur kullanım fiyatını aştığında opsiyon kullanılmalıdır; 44,50'den alım yapılmaz.
      E: Prim gelir gibi düşülmüştür; alıcı primi öder.
    hesap_adimlari:
    - Prim = 200.000 × 0,60 = 120.000
    - '44,50: kullanılır → 8.600.000 + 120.000 = 8.720.000'
    - '42,00: kullanılmaz → 8.400.000 + 120.000 = 8.520.000'
  kaynaklar:
  - mevzuat: Genel bilgi — Kur riski ve korunma yöntemleri
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'prim = 200000 * 0.60

      k1 = 200000 * min(44.50, 43.00) + prim

      k2 = 200000 * min(42.00, 43.00) + prim

      sonuc = k2'
    secenek_sayisi_bekleniyor: false
  durum: taslak
  surum: 1
