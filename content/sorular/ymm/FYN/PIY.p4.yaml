- id: YMM-FYN-PIY-0003
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: vadeli işlem ve opsiyon
  tip: hesaplama
  zorluk: 2
  kok: Spot EUR/TL kuru 48,00'dir. Yıllık basit faiz oranları TL için %40, EUR için %2'dir. Faiz paritesinin geçerli olduğu
    varsayımıyla 6 ay vadeli EUR/TL forward kuru kaçtır? (Sonuç iki ondalığa yuvarlanacaktır.)
  secenekler:
    A: 40,40
    B: 57,03
    C: 57,12
    D: 57,60
    E: 65,88
  dogru: B
  aciklama:
    dogru_neden: Faiz paritesine göre F = S × (1 + i_TL × t) / (1 + i_EUR × t) = 48,00 × (1 + 0,40 × 0,5) / (1 + 0,02 × 0,5)
      = 48,00 × 1,20 / 1,01 = 57,03.
    celdiriciler:
      A: Faiz oranları ters yerleştirilmiştir (48 × 1,01 / 1,20).
      C: Faiz farkı yaklaşımı kullanılmıştır (48 × 1,19); parite formülü bölme ister.
      D: EUR faizi dikkate alınmamıştır (48 × 1,20).
      E: Yıllık faiz oranları vade (6 ay) dikkate alınmadan uygulanmıştır (48 × 1,40 / 1,02).
    hesap_adimlari:
    - TL faktörü = 1 + 0,40 × 6/12 = 1,20
    - EUR faktörü = 1 + 0,02 × 6/12 = 1,01
    - F = 48 × 1,20 / 1,01 = 57,03
  kaynaklar:
  - mevzuat: Genel bilgi — Vadeli işlem, forward ve opsiyon sözleşmeleri
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = round(48 * (1 + 0.40 * 0.5) / (1 + 0.02 * 0.5), 2)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
