- id: YMM-FYN-PIY-0010
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: swap ve kredi temerrüt swabı
  tip: hesaplama
  zorluk: 3
  kok: Bir yatırım fonu, elindeki 20.000.000 USD nominal değerli şirket tahvilinin kredi riskine karşı 2 yıl vadeli kredi
    temerrüt swabı (CDS) almıştır. CDS primi yıllık 300 baz puan olup üçer aylık dönemler sonunda eşit taksitlerle ödenmektedir.
    İhraççı, sözleşmenin 15. ayının sonunda (o döneme ait prim ödendikten hemen sonra) temerrüde düşmüş; tahvilin geri kazanım
    oranı %35 olarak belirlenmiş ve sözleşme sona ermiştir. Koruma satıcısının sözleşme süresince net nakit çıkışı kaç USD'dir?
  secenekler:
    A: 7.000.000 USD
    B: 12.100.000 USD
    C: 12.250.000 USD
    D: 12.400.000 USD
    E: 13.000.000 USD
  dogru: C
  aciklama:
    dogru_neden: 'Üç aylık prim = 20.000.000 × %3 / 4 = 150.000 USD; 15 ayda 5 taksit tahsil edilmiştir: 750.000 USD. Temerrütte
      koruma satıcısı kaybı karşılar: 20.000.000 × (1 − 0,35) = 13.000.000 USD. Net nakit çıkışı = 13.000.000 − 750.000 =
      12.250.000 USD. Püf noktaları: Koruma satıcısı geri kazanılan kısmı değil kaybı öder; prim ise temerrüde kadar geçen
      dönem sayısı kadar tahsil edilir. 15 ay = 5 çeyrek dönemdir.'
    celdiriciler:
      A: 7.000.000 USD geri kazanım tutarıdır; satıcı kaybı (%65) öder.
      B: Prim 6 taksit (18 ay) üzerinden hesaplanmıştır.
      D: Prim yalnız bir yıllık (4 taksit) hesaplanmıştır.
      E: Tahsil edilen primler satıcının ödemesinden düşülmemiştir.
    hesap_adimlari:
    - Çeyrek prim = 20.000.000 × 0,03 / 4 = 150.000
    - Tahsil edilen prim = 5 × 150.000 = 750.000
    - Temerrüt ödemesi = 20.000.000 × 0,65 = 13.000.000
    - Net = 12.250.000
  kaynaklar:
  - mevzuat: Genel bilgi — Faiz swapı ve kredi temerrüt swabı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'prim = 20000000 * 0.03 / 4

      sonuc = 20000000 * (1 - 0.35) - 5 * prim'
