- id: YMM-FYN-PIY-0016
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: açığa satılan alım opsiyonu sonucu
  tip: hesaplama
  zorluk: 2
  kok: Bir yatırımcı, kullanım fiyatı 80 TL olan Avrupa tipi bir alım opsiyonunu 6 TL prim alarak yazmıştır (satmıştır). Vade
    sonunda dayanak varlığın fiyatı 95 TL olursa yatırımcının opsiyon pozisyonundan elde ettiği net kâr (+) veya zarar (−)
    kaç TL'dir (opsiyon bir birim dayanak varlığa ilişkindir)?
  secenekler:
    A: '-21'
    B: '-15'
    C: '-9'
    D: '6'
    E: '9'
  dogru: C
  aciklama:
    dogru_neden: Opsiyon yazan, primi tahsil eder; alıcı opsiyonu kullandığı için S − K = 15 TL öder. Net sonuç = 6 − 15 =
      -9 TL.
    celdiriciler:
      A: Prim, ödenen tutara eklenmiş; prim yazan açısından gelirdir ve zararı azaltır.
      B: Alınan prim hesaba katılmamış.
      D: Opsiyon kullanıldığı için sadece primi cebe atma varsayılmış; alıcı fiyat kullanım fiyatının üzerindedir ve opsiyonu
        kullanır.
      E: İşaret ters çevrilmiş; bu, alım opsiyonunu satın alan tarafın sonucudur.
    hesap_adimlari:
    - 'Yazan: prim − max(S − K, 0)'
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — açığa satılan alım opsiyonu sonucu
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'k, prim, s = 80, 6, 95

      sonuc = prim - max(s - k, 0)

      yanlis = {"a": -(s - k + prim), "b": -(s - k), "c": prim, "d": -sonuc}

      '
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim FYN_PIY_20261105_1.yaml, satır None
- id: YMM-FYN-PIY-0017
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: vadeli işlemlerde teminat tamamlama çağrısı
  tip: hesaplama
  zorluk: 3
  kok: Bir yatırımcı, her biri 100 birimlik 5 adet vadeli işlem sözleşmesi almıştır (uzun pozisyon) ve sözleşme başına 4.000
    TL başlangıç teminatı yatırmıştır. Sözleşme başına koruma (idame) teminatı 3.000 TL'dir. Alış fiyatı birim başına 200
    TL iken ardışık iki gün sonunda uzlaşma fiyatları 192 TL ve 188 TL olmuştur. Teminat hesabı koruma düzeyinin altına düşerse
    başlangıç düzeyine tamamlanması istenmektedir. İkinci günün sonunda yatırılması istenen ilave teminat kaç TL'dir? (Sözleşmeler
    hesabın tamamı üzerinden değerlenir, faiz gelirleri yoksayılır.)
  secenekler:
    A: '1.000'
    B: '2.000'
    C: '4.000'
    D: '6.000'
    E: '8.000'
  dogru: D
  aciklama:
    dogru_neden: 'Başlangıç hesabı = 4.000 × 5 = 20.000 TL; koruma düzeyi 15.000 TL. 1. gün kaybı = (200 − 192) × 100 × 5
      = 4.000 TL → hesap 16.000 TL (koruma düzeyinin üstünde, çağrı yok). 2. gün kaybı = (192 − 188) × 100 × 5 = 2.000 TL
      → hesap 14.000 TL < 15.000 TL → başlangıç düzeyine tamamlama: 20.000 − 14.000 = 6.000 TL. Püf noktaları: (1) çağrı eşiği
      koruma düzeyidir, ama tamamlama başlangıç düzeyine yapılır; (2) tüm sözleşmelerin toplamı alınır; (3) ilk gün çağrı
      olmadığı için kayıp birikir.'
    celdiriciler:
      A: Koruma düzeyine tamamlanmış; teminat çağrısında hesap başlangıç düzeyine getirilir.
      B: Yalnızca ikinci günün kaybıdır; hesabın birikmiş bakiyesi dikkate alınmamıştır.
      C: Yalnızca ilk günün kaybıdır; ilk gün çağrı yoktur ve ikinci günün kaybı hesaba katılmamıştır.
      E: Sözleşme başına başlangıç teminatı gün sayısıyla çarpılmış; tamamlama tutarı hesap bakiyesindeki eksiklikle belirlenir.
    hesap_adimlari:
    - Eşik koruma, tamamlama başlangıç
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — vadeli işlemlerde teminat tamamlama çağrısı
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'b, adet, ilk, idame = 100, 5, 4000, 3000

      f0, f1, f2 = 200, 192, 188

      hesap0 = ilk * adet

      hesap1 = hesap0 + (f1 - f0) * b * adet

      cagri1 = (ilk * adet - hesap1) if hesap1 < idame * adet else 0

      hesap1b = hesap1 + cagri1

      hesap2 = hesap1b + (f2 - f1) * b * adet

      sonuc = (ilk * adet - hesap2) if hesap2 < idame * adet else 0

      yanlis = {"a": idame * adet - hesap2, "b": (f1 - f2) * b * adet, "c": (f0 - f1) * b * adet, "d": 2 * ilk * 1}

      '
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim FYN_PIY_20261105_1.yaml, satır None
- id: YMM-FYN-PIY-0018
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: put-call paritesi
  tip: hesaplama
  zorluk: 3
  kok: 'Aynı dayanak varlık, kullanım fiyatı ve vadeye (1 yıl) sahip Avrupa tipi opsiyonlar için: alım opsiyonu primi 12 TL,
    dayanak varlığın spot fiyatı 70 TL, kullanım fiyatı 100 TL ve yıllık risksiz faiz %25''dir. Dayanak varlık yıl içinde
    temettü ödememektedir. Put-call paritesine göre satım opsiyonunun (put) primi kaç TL''dir? Dayanak varlığın yıllık oynaklığı
    %40''dır.'
  secenekler:
    A: '2'
    B: '22'
    C: '42'
    D: '58'
    E: '88'
  dogru: B
  aciklama:
    dogru_neden: 'Parite: C + K/(1 + r) = P + S → P = C − S + K/(1 + r) = 12 − 70 + 100/1,25 = 22 TL. Püf noktaları: (1) kullanım
      fiyatı iskonto edilir; (2) oynaklık verisi pariteyi etkilemez; (3) işaretlere dikkat: put = call − spot + PV(K).'
    celdiriciler:
      A: İşaretler ters kurulmuş (C + S − PV(K)).
      C: Kullanım fiyatı bugünkü değere çevrilmemiş.
      D: Basit fark; paritede iskonto edilmiş kullanım fiyatı yoktur.
      E: Kullanım fiyatından alım primi çıkarılmış; parite bu ilişkiyi kurmaz.
    hesap_adimlari:
    - P = C − S + K/(1+r)
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — put-call paritesi
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'c, s, k, r, vol = 12, 70, 100, 0.25, 0.40

      sonuc = c - s + k / (1 + r)

      yanlis = {"a": c - s + k, "b": c + s - k / (1 + r), "c": s - c, "d": k - c}

      '
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim FYN_PIY_20261105_1.yaml, satır None
