- id: YMM-FYN-PIY-0020
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Finansal piyasalar ve türev ürünler
  konu: PIY
  kazanim: FRA uzlaşma tutarı
  tip: hesaplama
  zorluk: 3
  kok: Bir şirket 180 gün (3x9 FRA) vadeli sözleşmede sabit oran %30 üzerinden alıcı konumundadır. Nominal tutar 10.000.000
    TL, yıl 360 gün kabul edilir. Uzlaşma tarihinde referans faiz %40 olarak belirlenmiş ve uzlaşma tutarı dönem başında,
    fark iskonto edilerek ödenmektedir. Şirketin tahsil edeceği uzlaşma tutarı kaç TL'dir? (Şirketin mevcut kredisinin faizi
    %35 olup uzlaşma tutarına etkisi yoktur.)
  secenekler:
    A: '416.667'
    B: '434.783'
    C: '500.000'
    D: '833.333'
    E: 1.000.000
  dogru: A
  aciklama:
    dogru_neden: 'FRA alıcısı referans oran FRA oranından yüksekse alacaklıdır. Uzlaşma = N × (R_ref − R_FRA) × (gün/360)
      / (1 + R_ref × gün/360) = 10.000.000 × 0,10 × 0,5 / (1 + 0,4 × 0,5) = 416.666,6667 TL. Püf noktaları: (1) iskonto referans
      oranla yapılır; (2) gün sayısı 360''a bölünür; (3) mevcut kredi faizi uzlaşmayı etkilemez.'
    celdiriciler:
      B: İskonto FRA oranı ile yapılmış; iskonto referans oranla yapılmalıdır.
      C: Dönem sonu faiz farkı iskonto edilmeden verilmiş; uzlaşma dönem başında yapıldığından iskonto gerekir.
      D: Gün sayısı çarpanı unutulmuş; fark yıllık değil dönemlik faizdir.
      E: Yıllık fark nominal tutarla çarpılmış; ne gün sayısı ne iskonto uygulanmıştır.
    hesap_adimlari:
    - N×(Rref−Rfra)×d/(1+Rref×d)
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — FRA uzlaşma tutarı
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'gun, fra, nt, ref, kr = 180, 0.30, 10000000, 0.40, 0.35

      d = gun / 360

      sonuc = nt * (ref - fra) * d / (1 + ref * d)

      yanlis = {"a": nt * (ref - fra) * d, "b": nt * (ref - fra) * d / (1 + fra * d), "c": nt * (ref - fra) / (1 + ref * d),
      "d": nt * (ref - fra)}

      '
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
