- id: YMM-FYN-RGT-0047
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: sistematik ve sistematik olmayan risk
  tip: hesaplama
  zorluk: 3
  kok: Bir payın getirisinin standart sapması %30, piyasa portföyünün standart sapması %20'dir. Payın getirisi ile piyasa
    getirisi arasındaki korelasyon katsayısı 0,8'dir. Tek endeks modeline göre payın toplam varyansı, sistematik varyans (β²
    × σm²) ile sistematik olmayan varyansın toplamıdır. Payın toplam varyansının yüzde kaçı çeşitlendirmeyle giderilebilecek
    riskten oluşmaktadır?
  secenekler:
    A: '%6'
    B: '%20'
    C: '%36'
    D: '%64'
    E: '%80'
  dogru: C
  aciklama:
    dogru_neden: 'Beta = ρ × σi / σm = 0,8 × 30 / 20 = 1,2. Sistematik varyans = 1,2² × 20² = 1,44 × 400 = 576; toplam varyans
      = 30² = 900. Sistematik olmayan (çeşitlendirilebilir) varyans = 900 − 576 = 324; oranı 324 / 900 = %36. Aynı sonuç 1
      − ρ² = 1 − 0,64 ile de bulunur. Püf noktaları: Risk ayrıştırması standart sapmalarla değil varyanslarla yapılır; standart
      sapmaları çıkararak (30 − 24) ya da oranlayarak (24/30) bulunan sonuçlar yanlıştır. Çeşitlendirilebilir pay, piyasa
      tarafından açıklanamayan kısımdır (1 − R²).'
    celdiriciler:
      A: 'Standart sapmalar doğrudan çıkarılmıştır: 30 − β × σm = 30 − 24 = 6 puan.'
      B: Sistematik standart sapmanın toplam standart sapmaya oranı (24/30 = 0,8) birden çıkarılmıştır; ayrıştırma varyansla
        yapılmalıdır.
      D: Sistematik (çeşitlendirilemeyen) riskin toplam varyans içindeki payıdır (ρ² = 0,64); soru giderilebilen kısmı sormaktadır.
      E: Korelasyon katsayısı (0,8) varyans payı gibi yorumlanmıştır.
    hesap_adimlari:
    - β = 0,8 × 30 / 20 = 1,2
    - Sistematik varyans = 1,44 × 400 = 576
    - Toplam varyans = 900
    - Sistematik olmayan varyans = 324 → 324 / 900 = %36
  kaynaklar:
  - mevzuat: Genel bilgi — sistematik ve sistematik olmayan risk
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'rho = 0.8

      si = 30.0

      sm = 20.0

      beta = rho * si / sm

      sis = beta ** 2 * sm ** 2

      top = si ** 2

      sonuc = round((top - sis) / top * 100, 2)'
