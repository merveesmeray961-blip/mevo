  konu: RGT
  kazanim: sistematik ve sistematik olmayan risk
  tip: kavrama
  zorluk: 3
  kok: 'Risksiz faiz oranı %8, piyasa portföyünün beklenen getirisi %16''dır. Analistin dört pay için tahminleri şöyledir:


    | Pay | Beta | Standart sapma | Analistin beklediği getiri |

    |---|---|---|---|

    | K | 1,5 | %30 | %22 |

    | L | 0,5 | %25 | %11 |

    | M | 1,0 | %20 | %16 |

    | N | 0,8 | %45 | %14,4 |


    Menkul kıymet piyasa doğrusu (SML) ve CAPM çerçevesinde aşağıdaki ifadelerden hangisi **yanlıştır**?'
  secenekler:
    A: N'nin toplam riski en yüksek olduğundan, dengede beklenen getirisi dört pay içinde en yüksek olmalıdır.
    B: K, SML'nin üzerinde yer alır; gerekli getirisi %20 olduğundan 2 puan pozitif alfa ile düşük fiyatlanmıştır.
    C: L'nin gerekli getirisi %12'dir; beklenen getirisi bunun altında kaldığından aşırı fiyatlanmıştır.
    D: K ve L'den eşit ağırlıklı portföyün betası 1'dir ve beklenen getirisi M'ninkinden 0,5 puan fazladır.
