- id: YMM-FYN-RGT-0044
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: portföy çeşitlendirmesi
  tip: uygulama
  zorluk: 3
  kok: 'Bir yatırımcı eşit ağırlıklı portföyler oluşturmaktadır. Portföye alınabilecek payların her birinin getiri varyansı
    0,09 (standart sapma %30), her pay çifti arasındaki kovaryans 0,03''tür. n paydan oluşan eşit ağırlıklı portföyün varyansı
    σp² = σ²/n + (1 − 1/n) × Kov formülüyle hesaplanmaktadır.


    I. Altı paydan oluşan eşit ağırlıklı portföyün standart sapması %20''dir.

    II. Pay sayısı ne kadar artırılırsa artırılsın portföy varyansı 0,03''ün altına inmez.

    III. Portföy varyansındaki 0,03''lük kısım, pay sayısı artırılarak giderilebilen (sistematik olmayan) riski gösterir.

    IV. Pay sayısı 6''dan 12''ye çıkarıldığında portföy varyansı yarıya iner.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve IV
    E: I, II ve IV
  dogru: B
  aciklama:
    dogru_neden: 'n = 6 için σp² = 0,09/6 + (5/6) × 0,03 = 0,015 + 0,025 = 0,04; σp = %20 (I doğru). n sonsuza giderken σ²/n
      sıfıra, (1 − 1/n) ise 1''e yaklaşır; varyans ortalama kovaryans olan 0,03''e iner ama altına düşmez (II doğru). Bu 0,03''lük
      kısım çeşitlendirmeyle giderilemeyen sistematik (piyasa) riskidir (III yanlış). n = 12 için σp² = 0,0075 + (11/12) ×
      0,03 = 0,0075 + 0,0275 = 0,035''tir; 0,04''ün yarısı değildir (IV yanlış). Püf noktaları: Çeşitlendirme yalnız paylara
      özgü varyans terimini (σ²/n) küçültür; kovaryans terimi pay sayısıyla birlikte azalmaz, tersine ağırlığı 1''e yaklaşır.
      Bu nedenle pay sayısını iki katına çıkarmak varyansı yarıya indirmez.'
    celdiriciler:
      A: 'II de doğrudur: çok sayıda payda portföy varyansı ortalama kovaryansa (0,03) yakınsar ve bunun altına inemez.'
      C: III yanlıştır; 0,03'lük alt sınır çeşitlendirmeyle giderilemeyen sistematik riski gösterir.
      D: 'I doğrudur (σp = %20), IV yanlıştır: n = 12''de varyans 0,035''tir; yalnız σ²/n terimi yarıya iner.'
      E: IV yanlıştır; kovaryans terimi (1 − 1/n) × 0,03 pay sayısı arttıkça büyüdüğünden varyans yarıya inmez (0,04 → 0,035).
  kaynaklar:
  - mevzuat: Genel bilgi — portföy çeşitlendirmesi
    madde: '-'
