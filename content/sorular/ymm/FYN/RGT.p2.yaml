    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
