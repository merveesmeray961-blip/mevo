  - YMM
  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: beklenen getiri ve varyans
  tip: hesaplama
  zorluk: 2
  kok: Piyasa portföyünün beklenen getirisi %20, standart sapması %25'tir. Bir yatırımcı risksiz faiz oranı olan %10'dan borçlanıp
    borç ve öz kaynağını piyasa portföyüne yatırarak portföyünün beklenen getirisini %25'e çıkarmak istemektedir. Risksiz
    varlığın getirisinin standart sapması sıfırdır. Bu portföyün standart sapması yüzde kaç olur?
  secenekler:
    A: '%25'
    B: '%31,25'
    C: '%32,5'
    D: '%37,5'
    E: '%62,5'
  dogru: D
  aciklama:
    dogru_neden: 'Piyasa portföyüne yatırılan oran w olsun: 25 = w × 20 + (1 − w) × 10 → 25 = 10 + 10w → w = 1,5. Yatırımcı
      öz kaynağının yarısı kadar borçlanır. Risksiz varlığın varyansı ve piyasayla kovaryansı sıfır olduğundan σp = w × σm
      = 1,5 × 25 = %37,5.'
    celdiriciler:
      A: Piyasa portföyünün kendi standart sapmasıdır; kaldıraç kullanımının riski artırdığı dikkate alınmamıştır.
      B: 'Ağırlık, borçlanma maliyeti göz ardı edilerek 25 / 20 = 1,25 bulunmuştur: 1,25 × 25.'
      C: 'Beklenen getiri formülü riske uygulanmış, risksiz faiz standart sapmadan düşülmüştür: 1,5 × 25 − 0,5 × 10.'
      E: Ağırlık 25 / (20 − 10) = 2,5 olarak hesaplanmıştır; risksiz faiz eşitliğin sol tarafından düşülmemiştir.
    hesap_adimlari:
    - 25 = 10 + w × (20 − 10) → w = 1,5
    - σp = 1,5 × 25 = %37,5
