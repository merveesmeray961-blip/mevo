- id: YMM-FYN-RGT-0043
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: sistematik ve sistematik olmayan risk
  tip: hesaplama
  zorluk: 2
  kok: 'Bir yatırımcının 1.000.000 TL''lik portföyü üç paydan oluşmaktadır: X payına 200.000 TL (beta 1,5), Y payına 300.000
    TL (beta 0,8), Z payına 500.000 TL (beta 1,2) yatırılmıştır. Risksiz faiz oranı %10, piyasa portföyünün beklenen getirisi
    %20''dir. Sermaye varlıklarını fiyatlama modeline (CAPM) göre portföyün gerekli getiri oranı yüzde kaçtır?'
  secenekler:
    A: '%11,40'
    B: '%21,40'
    C: '%21,67'
    D: '%22,80'
    E: '%32,80'
  dogru: B
  aciklama:
    dogru_neden: 'Portföy betası, payların piyasa değeri ağırlıklarıyla ağırlıklı ortalamasıdır: 0,2 × 1,5 + 0,3 × 0,8 + 0,5
      × 1,2 = 0,30 + 0,24 + 0,60 = 1,14. CAPM''e göre gerekli getiri = 10 + 1,14 × (20 − 10) = 10 + 11,4 = %21,40.'
    celdiriciler:
      A: Yalnız risk primi (1,14 × 10) bulunmuş, risksiz faiz oranı eklenmemiştir.
      C: 'Beta, yatırım tutarlarıyla ağırlıklandırılmadan basit ortalama (3,5 / 3 ≈ 1,167) olarak alınmıştır: 10 + 1,167 ×
        10.'
      D: 'Beta, risk primi yerine piyasa getirisinin tamamıyla çarpılmıştır: 1,14 × 20.'
      E: 'Risksiz faiz oranına, beta ile piyasa getirisinin (risk primi değil) çarpımı eklenmiştir: 10 + 1,14 × 20.'
    hesap_adimlari:
    - 'Ağırlıklar: 0,2 / 0,3 / 0,5'
    - 'Portföy betası: 0,30 + 0,24 + 0,60 = 1,14'
    - 'Risk primi: 20 − 10 = 10 puan'
    - 'Gerekli getiri: 10 + 1,14 × 10 = %21,40'
  kaynaklar:
  - mevzuat: Genel bilgi — sistematik risk, beta ve CAPM
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "tutar = [200000, 300000, 500000]\nbeta = [1.5, 0.8, 1.2]\ntoplam = 0\nfor t in tutar:\n    toplam += t\nbp =\
      \ 0\nfor i in range(3):\n    bp += tutar[i] / toplam * beta[i]\nsonuc = round(10 + bp * (20 - 10), 2)"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
