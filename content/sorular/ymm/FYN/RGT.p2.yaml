- id: YMM-FYN-RGT-0045
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: portföy çeşitlendirmesi
  tip: hesaplama
  zorluk: 3
  kok: A payının beklenen getirisi %10, standart sapması %20; B payının beklenen getirisi %18, standart sapması %40'tır. İki
    pay arasındaki korelasyon katsayısı 0,25'tir. Yalnız bu iki paydan, açığa satış yapılmadan oluşturulabilecek en düşük
    varyanslı (minimum varyans) portföyün beklenen getirisi yüzde kaçtır?
  secenekler:
    A: '%11'
    B: '%11,6'
    C: '%12,67'
    D: '%14'
    E: '%17'
  dogru: A
  aciklama:
    dogru_neden: 'Kovaryans = 0,25 × 20 × 40 = 200 (%² cinsinden). Minimum varyans portföyünde A''nın ağırlığı wA = (σB² −
      Kov) / (σA² + σB² − 2Kov) = (1.600 − 200) / (400 + 1.600 − 400) = 1.400 / 1.600 = 0,875; B''nin ağırlığı 0,125''tir.
      Beklenen getiri = 0,875 × 10 + 0,125 × 18 = 8,75 + 2,25 = %11. Püf noktaları: Ağırlık formülünde kovaryans hem payda
      hem paydada yer alır; korelasyonu sıfır sayarsanız (wA = 0,8) sonuç değişir. Minimum varyans portföyü, düşük riskli
      paya ağırlık verse de riskli payı tamamen dışlamaz; korelasyon 1''den küçük olduğu için küçük bir B payı riski daha
      da düşürür.'
    celdiriciler:
      B: 'Korelasyon sıfır varsayılarak ağırlık bulunmuştur: wA = 1.600 / 2.000 = 0,8 → 0,8 × 10 + 0,2 × 18 = %11,6.'
      C: 'Ağırlıklar standart sapmayla ters orantılı alınmıştır (wA = 2/3, wB = 1/3): 6,67 + 6 = %12,67.'
      D: 'Eşit ağırlıklı portföyün beklenen getirisidir: (10 + 18) / 2.'
      E: 'Ağırlıklar ters çevrilmiştir (wA = 0,125, wB = 0,875): 1,25 + 15,75 = %17.'
    hesap_adimlari:
    - Kov = 0,25 × 20 × 40 = 200
    - wA = (1.600 − 200) / (400 + 1.600 − 400) = 0,875
    - wB = 0,125
    - E(Rp) = 0,875 × 10 + 0,125 × 18 = %11
  kaynaklar:
  - mevzuat: Genel bilgi — portföy çeşitlendirmesi (minimum varyans portföyü)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'sa = 20.0

      sb = 40.0

      kov = 0.25 * sa * sb

      wa = (sb ** 2 - kov) / (sa ** 2 + sb ** 2 - 2 * kov)

      sonuc = round(wa * 10 + (1 - wa) * 18, 2)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 3)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
