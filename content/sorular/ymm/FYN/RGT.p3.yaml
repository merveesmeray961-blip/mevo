  ders: FYN
  unite: Risk getiri ve portföy
  konu: RGT
  kazanim: Sistematik ve sistematik olmayan risk
  tip: uygulama
  zorluk: 3
  kok: 'Bir analist, belirli bir hisse senedinin getirisini piyasa getirisine regrese etmiş ve beta katsayısını
    1,5 olarak hesaplamıştır.

    Bu bilgiye dayanarak aşağıdakilerden hangisi söylenebilir?

    '
  secenekler:
    A: Bu hisse senedi piyasadan %50 daha az değişkendir.
    B: Piyasa %10 artarsa bu hisse %10 artar.
    C: Bu hisse senedinin sistematik olmayan riski ortadan kalkmıştır.
    D: Piyasa %10 düşerse bu hisse yaklaşık %15 düşer.
    E: Bu hisse senedinin beklenen getirisi risksiz faiz oranına eşittir.
  dogru: D
  aciklama:
    dogru_neden: Beta = 1,5 ise piyasa getirisindeki %1'lik değişim hisse senedinde yaklaşık %1,5'lik değişime yol
      açar. Piyasa %10 düşerse hisse yaklaşık 10 × 1,5 = %15 düşer.
    celdiriciler:
      A: Beta > 1 hissenin piyasadan DAHA değişken olduğunu gösterir; daha az değil.
      B: Beta = 1 olsaydı bu doğru olurdu; 1,5 ile piyasanın 1,5 katı hareket beklenir.
      C: Beta regresyonu yalnızca sistematik riski ölçer; sistematik olmayan riskin sıfırlandığını göstermez.
      E: CAPM'e göre beklenen getiri risksiz oran + beta × piyasa risk primidir; risksiz orana eşit değil.
