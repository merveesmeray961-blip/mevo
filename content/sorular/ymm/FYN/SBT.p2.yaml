  kok: Bir işletme, iki yıl sürecek bir proje için 150.000 TL'lik makine alacaktır; makine iki yılda normal amortismanla itfa
    edilecek, hurda değeri sıfırdır. Proje her yıl 250.000 TL nakit satış tahsilatı ve 100.000 TL nakit faaliyet gideri doğuracaktır.
    Geçen yıl bu proje için 15.000 TL pazar araştırması ödemesi yapılmıştır. Proje, şu anda kiraya verilen ve her yıl sonunda
    vergi sonrası 10.000 TL kira geliri sağlayan bir depoda yürütülecek; proje süresince depo kiraya verilemeyecektir. Kurumlar
    vergisi oranı %20, sermaye maliyeti %25'tir [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64]. İşletmenin diğer faaliyetleri kârlıdır.
    Projenin net bugünkü değeri kaç TL'dir?
  secenekler:
