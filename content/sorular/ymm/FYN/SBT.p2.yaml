- id: YMM-FYN-SBT-0070
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: karlılık endeksi
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin bu yılki yatırım bütçesi 600.000 TL ile sınırlıdır. Birbirinden bağımsız ve **bölünemez** dört proje
    vardır: P1 (ilk yatırım 300.000 TL, NBD 120.000 TL), P2 (ilk yatırım 200.000 TL, NBD 70.000 TL), P3 (ilk yatırım 400.000
    TL, NBD 132.000 TL), P4 (ilk yatırım 200.000 TL, NBD 64.000 TL). Bütçeden kullanılmayan tutarın NBD''si sıfırdır ve kısıt
    yalnız bu yıl için geçerlidir. Toplam NBD''yi en yüksek kılan proje seti seçildiğinde toplam NBD kaç TL olur?'
  secenekler:
    A: 190.000 TL
    B: 196.000 TL
    C: 202.000 TL
    D: 223.000 TL
    E: 252.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Bütçeye sığan kombinasyonlar: P1+P2 (500.000) → 190.000; P1+P4 (500.000) → 184.000; P2+P3 (600.000) → 202.000;
      P3+P4 (600.000) → 196.000; P2+P4 (400.000) → 134.000. En yüksek toplam NBD P2+P3 ile 202.000 TL''dir. Püf noktaları:
      Karlılık endeksi sıralaması (P1 1,40; P2 1,35; P3 1,33; P4 1,32) bölünebilir projelerde en iyi sonucu verir; projeler
      bölünemezse bütçenin bir kısmı boşta kalabileceğinden bütçeye sığan kombinasyonlar tek tek karşılaştırılmalıdır.'
    celdiriciler:
      A: KE sıralamasıyla P1 ve P2 seçilmiş, 100.000 TL boşta kalmıştır; P2+P3 kombinasyonu daha yüksek NBD sağlar.
      B: P3+P4 kombinasyonudur; P2'nin NBD'si P4'ünkünden yüksek olduğundan P2+P3 daha iyidir.
      D: 'Projeler bölünebilirmiş gibi P1, P2 ve P3''ün dörtte biri alınmıştır: 120.000 + 70.000 + 132.000 / 4 = 223.000 TL;
        projeler bölünemez.'
      E: En yüksek NBD'li iki proje (P1+P3) seçilmiştir; toplam yatırım 700.000 TL ile bütçeyi aşar.
    hesap_adimlari:
    - 'KE: P1 1,40; P2 1,35; P3 1,33; P4 1,32'
    - 'Bütçeye sığan kombinasyonların NBD''leri: 190.000; 184.000; 202.000; 196.000; 134.000'
    - 'En yüksek: P2 + P3 = 202.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — karlılık endeksi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "p = [(300000,120000),(200000,70000),(400000,132000),(200000,64000)]\nbest = 0\nfor m in range(16):\n    y = sum(p[i][0]\
      \ for i in range(4) if m>>i & 1)\n    n = sum(p[i][1] for i in range(4) if m>>i & 1)\n    if y <= 600000 and n > best:\n\
      \        best = n\nsonuc = best"
  durum: kontrolde
