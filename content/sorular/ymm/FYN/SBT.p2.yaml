- id: YMM-FYN-SBT-0068
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: iç verim oranı
  tip: uygulama
  zorluk: 3
  kok: 'Bir projenin nakit akışları şöyledir: bugün −100.000 TL, 1. yıl sonu +230.000 TL, 2. yıl sonu −132.000 TL (proje sonunda
    yapılacak zorunlu saha düzenleme harcaması). Bu projeyle ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Projenin iki iç verim oranı vardır: %10 ve %20.

    II. Sermaye maliyeti %5 ise, her iki iç verim oranı da sermaye maliyetinden yüksek olduğundan proje kabul edilmelidir.

    III. Sermaye maliyeti %15 ise projenin net bugünkü değeri pozitiftir.

    IV. Bu projede kabul/ret kararı iç verim oranına göre değil net bugünkü değere göre verilmelidir.'
  secenekler:
    A: I, III ve IV
    B: Yalnız I
    C: I ve II
    D: II ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'NBD = 0 koşulu x = 1 + r için −100.000x² + 230.000x − 132.000 = 0, yani 100x² − 230x + 132 = 0 verir; kökler
      x = (230 ± 10) / 200 → 1,10 ve 1,20 (I doğru). NBD fonksiyonu yalnız iki kök arasında pozitiftir. %15''te: 230.000 /
      1,15 = 200.000; 132.000 / 1,3225 ≈ 99.811; NBD ≈ +189 TL (III doğru). %5''te: 219.048 − 119.728 − 100.000 ≈ −680 TL;
      NBD negatif olduğundan proje reddedilir (II yanlış). Nakit akışlarının işareti iki kez değiştiğinden İVO kuralı güvenilir
      değildir; karar NBD''ye göre verilir (IV doğru). Püf noktaları: Olağan dışı nakit akışında (−, +, −) ''İVO > sermaye
      maliyeti ise kabul'' kuralı çöker; düşük sermaye maliyetinde gelecekteki büyük çıkışın bugünkü değeri ağırlaşır ve NBD
      negatife döner.'
    celdiriciler:
      B: III ve IV de doğrudur.
      C: 'II yanlıştır: %5 sermaye maliyetinde NBD yaklaşık −680 TL''dir.'
      D: II yanlıştır; I doğrudur.
      E: II yanlıştır; iki İVO'nun da sermaye maliyetinden yüksek olması kabul için yeterli değildir.
    hesap_adimlari:
    - 100x² − 230x + 132 = 0 → x = 1,10 ve 1,20
    - '%15: −100.000 + 200.000 − 99.811 ≈ +189'
    - '%5: −100.000 + 219.048 − 119.728 ≈ −680'
