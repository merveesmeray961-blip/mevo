- id: YMM-FYN-SBT-0066
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: geri ödeme süresi
  tip: hesaplama
  zorluk: 2
  kok: Bir projenin ilk yatırım tutarı 100.000 TL'dir. Projeden yıl sonlarında 1. yıl 50.000 TL, 2. yıl 62.500 TL, 3. yıl
    78.125 TL net nakit girişi beklenmektedir. Sermaye maliyeti %25'tir [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512].
    Kesirli yıl hesabında nakit girişlerinin yıl içine düzenli dağıldığı varsayılmaktadır. Projenin **iskontolu** geri ödeme
    süresi kaç yıldır?
  secenekler:
    A: 1,80 yıl
    B: 2,16 yıl
    C: 2,26 yıl
    D: 2,50 yıl
    E: 3,00 yıl
  dogru: D
  aciklama:
    dogru_neden: 'Nakit girişlerinin bugünkü değerleri: 50.000 × 0,80 = 40.000; 62.500 × 0,64 = 40.000; 78.125 × 0,512 = 40.000
      TL. Kümülatif: 1. yıl 40.000, 2. yıl 80.000 TL. Kalan 20.000 TL, 3. yılın iskontolu girişinin (40.000 TL) yarısıdır:
      2 + 20.000 / 40.000 = 2,50 yıl.'
    celdiriciler:
      A: 'İskontosuz (basit) geri ödeme süresidir: 50.000 + 50.000 / 62.500 = 1,80 yıl.'
      B: 'Her nakit girişi yalnız bir dönem iskontolanmıştır (40.000; 50.000; 62.500): 2 + 10.000 / 62.500 = 2,16 yıl.'
      C: 'Kalan tutar 3. yılın iskontosuz girişine bölünmüştür: 2 + 20.000 / 78.125 ≈ 2,26 yıl.'
      E: Kesirli yıl hesaplanmadan yatırımın tamamen karşılandığı yıl sonu alınmıştır.
    hesap_adimlari:
    - 'İskontolu girişler: 40.000; 40.000; 40.000'
    - '2 yıl sonunda kümülatif: 80.000; kalan 20.000'
    - 20.000 / 40.000 = 0,5 → 2,50 yıl
  kaynaklar:
  - mevzuat: Genel bilgi — geri ödeme süresi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'pv = [50000/1.25, 62500/1.25**2, 78125/1.25**3]

      kalan = 100000 - pv[0] - pv[1]

      sonuc = round(2 + kalan/pv[2], 2)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
