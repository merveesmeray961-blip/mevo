- id: YMM-FYN-SBT-0067
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: karlılık endeksi
  tip: uygulama
  zorluk: 2
  kok: 'Sermaye kısıtı bulunmayan bir işletme, birbirini dışlayan (yalnız biri seçilebilecek) iki proje arasında seçim yapacaktır.
    Sermaye maliyetiyle hesaplanan veriler şöyledir: X projesinin ilk yatırımı 100.000 TL, nakit girişlerinin bugünkü değeri
    150.000 TL; Y projesinin ilk yatırımı 400.000 TL, nakit girişlerinin bugünkü değeri 520.000 TL''dir. Bu durumda aşağıdakilerden
    hangisi doğrudur?'
  secenekler:
    A: X seçilmelidir; çünkü karlılık endeksi (1,50) Y'ninkinden (1,30) yüksektir.
    B: İki projenin de karlılık endeksi 1'den büyük olduğundan ikisi birlikte kabul edilmelidir.
    C: X'ten Y'ye geçişin artımsal karlılık endeksi 1'in altında kaldığından X seçilmelidir.
    D: Projelerin ölçekleri farklı olduğundan seçim NBD yerine iç verim oranına göre yapılmalıdır.
    E: Y seçilmelidir; çünkü NBD'si (120.000 TL) X'inkinden (50.000 TL) yüksektir.
  dogru: E
  aciklama:
    dogru_neden: 'NBD: X = 150.000 − 100.000 = 50.000 TL; Y = 520.000 − 400.000 = 120.000 TL. Sermaye kısıtı yokken birbirini
      dışlayan projelerde amaç firma değerini en çok artırmaktır; bu da NBD''si yüksek olan Y''dir. Karlılık endeksi oransal
      bir ölçü olduğundan ölçek farkını yansıtmaz.'
    celdiriciler:
      A: KE sıralaması (X 1,50 > Y 1,30) ölçek farkı nedeniyle NBD sıralamasıyla çelişir; sermaye kısıtı yokken NBD esas alınır.
      B: Projeler birbirini dışladığından ikisi birlikte kabul edilemez.
      C: Artımsal yatırım 300.000 TL, artımsal bugünkü değer 370.000 TL'dir; artımsal KE ≈ 1,23 > 1 ve artımsal NBD 70.000
        TL olduğundan Y'ye geçiş değer yaratır.
      D: İç verim oranı da oransal bir ölçüdür ve ölçek sorunundan etkilenir; birbirini dışlayan projelerde doğru ölçüt NBD'dir.
    hesap_adimlari:
    - NBD X = 50.000; KE X = 1,50
    - NBD Y = 120.000; KE Y = 1,30
    - 'Artımsal: 370.000 / 300.000 ≈ 1,23'
  kaynaklar:
  - mevzuat: Genel bilgi — karlılık endeksi
    madde: '-'
