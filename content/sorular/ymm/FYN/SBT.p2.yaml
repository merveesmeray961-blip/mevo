- id: YMM-FYN-SBT-0069
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: yatırım projelerinde nakit akışı tahmini
  tip: hesaplama
  zorluk: 3
  kok: Üç yıl sürecek bir proje için 400.000 TL'ye alınan makine, vergi açısından dört yılda normal (eşit tutarlı) amortismana
    tabidir ve hurda değeri sıfır kabul edilmektedir. Proje 3. yılın sonunda sona erecek ve makine bu tarihte 160.000 TL'ye
    satılacaktır. Proje başında yatırılan 50.000 TL net işletme sermayesi proje sonunda tamamen geri kazanılacaktır. 3. yılda
    nakit satış tahsilatı 600.000 TL, nakit faaliyet giderleri 350.000 TL'dir. Kurumlar vergisi oranı %20'dir ve işletmenin
    diğer faaliyetleri kârlıdır. Projenin 3. yıl sonundaki toplam net nakit akışı kaç TL'dir?
  secenekler:
    A: 368.000 TL
    B: 398.000 TL
    C: 418.000 TL
    D: 430.000 TL
    E: 442.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Yıllık amortisman 400.000 / 4 = 100.000 TL. Faaliyet nakit akışı = (600.000 − 350.000 − 100.000) × 0,80
      + 100.000 = 220.000 TL. 3. yıl sonunda defter değeri 400.000 − 300.000 = 100.000 TL; satış kazancı 60.000 TL, vergisi
      12.000 TL; vergi sonrası satış hasılatı 148.000 TL. İşletme sermayesi geri kazanımı 50.000 TL. Toplam = 220.000 + 148.000
      + 50.000 = 418.000 TL. Püf noktaları: Amortisman proje ömrüne (3 yıl) göre değil vergi ömrüne (4 yıl) göre hesaplanır;
      vergi yalnız satış bedelinin defter değerini aşan kısmına (60.000 TL) uygulanır. Son yıl akışı faaliyet akışı, vergi
      sonrası hurda ve işletme sermayesi geri dönüşünden oluşur.'
    celdiriciler:
      A: 'Net işletme sermayesinin geri kazanımı unutulmuştur: 220.000 + 148.000.'
      B: 'Satış bedelinin tamamı vergilendirilmiştir (160.000 × 0,80 = 128.000): 220.000 + 128.000 + 50.000.'
      D: 'Satış kazancının vergisi ihmal edilmiştir: 220.000 + 160.000 + 50.000.'
      E: 'Satış kazancı vergisi ters yönde (vergi tasarrufu gibi) eklenmiştir: 220.000 + 172.000 + 50.000.'
    hesap_adimlari:
    - 'Amortisman: 100.000 TL/yıl'
    - 'Faaliyet nakit akışı: 150.000 × 0,80 + 100.000 = 220.000'
    - Defter değeri 100.000; kazanç 60.000; vergi 12.000; net hurda 148.000
    - 'İşletme sermayesi geri dönüşü: 50.000'
    - 'Toplam: 418.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — yatırım projelerinde nakit akışı tahmini
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'amort = 400000/4

      fna = (600000-350000-amort)*0.8 + amort

      dd = 400000 - 3*amort

      hurda = 160000 - (160000-dd)*0.2

      sonuc = fna + hurda + 50000'
  durum: kontrolde
  surum: 1
