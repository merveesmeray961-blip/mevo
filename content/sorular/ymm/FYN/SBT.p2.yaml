    dogru_neden: 'Amortisman 75.000 TL/yıl. Faaliyet nakit akışı = (250.000 − 100.000) × 0,80 + 75.000 × 0,20 = 120.000 +
      15.000 = 135.000 TL. Vazgeçilen vergi sonrası kira geliri (fırsat maliyeti) düşülür: 135.000 − 10.000 = 125.000 TL.
      Bugünkü değer = 125.000 × (0,80 + 0,64) = 180.000 TL; NBD = 180.000 − 150.000 = 30.000 TL. Geçen yıl ödenen pazar araştırması
      batık maliyettir, karara katılmaz. Püf noktaları: Artımsal nakit akışına fırsat maliyeti girer, batık maliyet girmez;
      amortisman nakit çıkışı değildir, yalnız vergi kalkanı (75.000 × %20) kadar etkisi vardır.'
    celdiriciler:
