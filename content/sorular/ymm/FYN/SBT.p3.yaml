  aciklama:
    dogru_neden: 'I: 1+2. yıl kümülatif = 220.000 < 300.000; 3. yılda da 90.000 eklenince 310.000 > 300.000. Geri
      ödeme 3. yılda tamamlanır, dolayısıyla GÖS 3 yılı aşmaz — I yanlış görünse de hesap: 300.000-220.000=80.000
      kalan, 3. yılda 90.000 akışla 80.000/90.000≈0,89 yıl. GÖS=2,89 yıl; 3 yılı aşmıyor. Durum: I yanlış. II: 100.000+120.000=220.000
      — DOĞRU. III: 3. yılda yalnızca 80.000 TL gerekir (90.000''in tamamı değil) — DOĞRU. Sonuç: II ve III doğru
      → D. [Düzeltme: dogru: D]'
