      3. yılın sonunda tam olarak karşılanmaktadır (200.000 + 100.000 = 300.000; 3. yılda gereken 100.000 TL, o
      yılın 150.000 TL akışının içinde karşılanır: 100/150 × 12 ≈ 8 ay → ancak tam karşılanma 3. yıl içinde gerçekleşir).
