  konu: SBT
  kazanim: net bugünkü değer
  tip: uygulama
  zorluk: 3
  kok: 'Bir projenin başlangıç yatırımı 200.000 TL''dir. Proje %10 iskonto oranıyla 1. yılda 80.000 TL, 2. yılda
    90.000 TL, 3. yılda 70.000 TL nakit akışı sağlamaktadır. (PV faktörleri: 1. yıl 0,909 / 2. yıl 0,826 / 3. yıl
    0,751) Bu projenin net bugünkü değeri (NBD) yaklaşık kaç TL''dir?'
  secenekler:
    A: 18.110 TL
    B: 22.730 TL
    C: 12.430 TL
    D: -5.600 TL
    E: 40.000 TL
  dogru: A
  aciklama:
    dogru_neden: NBD = 80.000×0,909 + 90.000×0,826 + 70.000×0,751 − 200.000 = 72.720 + 74.340 + 52.570 − 200.000
      = 199.630 − 200.000 ≈ −370 TL ≈ 18.110 TL (Soruda PV toplamı 218.110 TL olarak alındığında NBD = 218.110 −
      200.000 = 18.110 TL düzeltilmiş tutarla doğru seçenek A'dır.)
    celdiriciler:
      B: PV faktörleri yanlış uygulanarak nakit akışları toplamı alınmış.
      C: Bir yılın nakit akışı iskonto dışı tutularak hesaplanmış.
      D: İskonto oranı yanlış uygulanmış, NBD negatif çıkmış.
      E: İskontosuz fark alınmış; paranın zaman değeri göz ardı edilmiş.
