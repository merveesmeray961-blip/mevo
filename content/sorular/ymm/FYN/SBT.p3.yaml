- id: YMM-FYN-SBT-0073
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye bütçelemesi
  konu: SBT
  kazanim: net bugünkü değer
  tip: uygulama
  zorluk: 3
  kok: 'Bir şirket, başlangıç yatırımı 500.000 TL olan bir projeyi değerlendirmektedir. Projenin 4 yıl boyunca sağlayacağı
    yıllık net nakit akışları sırasıyla 180.000 TL, 200.000 TL, 160.000 TL ve 140.000 TL''dir. Şirketin sermaye
    maliyeti (iskonto oranı) %12''dir. Aşağıdaki iskonto faktörlerini kullanınız: PVF(%12,1)=0,8929 ; PVF(%12,2)=0,7972
    ; PVF(%12,3)=0,7118 ; PVF(%12,4)=0,6355. Bu projenin net bugünkü değeri (NBD) aşağıdakilerden hangisidir?

    '
  secenekler:
    A: +23.020 TL
    B: +32.700 TL
    C: –12.680 TL
    D: +8.316 TL
    E: –28.000 TL
  dogru: A
  aciklama:
    dogru_neden: "NBD = –500.000\n      + 180.000×0,8929\n      + 200.000×0,7972\n      + 160.000×0,7118\n     \
      \ + 140.000×0,6355\n    = –500.000 + 160.722 + 159.440 + 113.888 + 88.970\n    = –500.000 + 523.020 = +23.020\
      \ TL.\nNBD > 0 olduğundan proje kabul edilir.\n"
    celdiriciler:
      B: +32.700 TL nakit akışlarının iskontosuz toplamından 500.000 çıkarılarak elde edilen hatalı sonuca yakındır.
      C: –12.680 TL yanlış iskonto faktörü uygulaması veya nakit akışı hatalarından kaynaklanır.
      D: +8.316 TL farklı iskonto oranı (örn. %14) kullanımının ürünüdür.
      E: –28.000 TL nakit akışlarının eksik veya hatalı iskontolama sonucudur.
