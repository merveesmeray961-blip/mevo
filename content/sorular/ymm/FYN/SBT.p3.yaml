      = 0,67 yıl → toplam geri ödeme = 2 + 0,67 ≈ 2,67 yıl ≈ 2 yıl 8 ay. Bu sorunun tasarımında "tam yıl" yaklaşımı
      benimsenmiş olup seçenekler arasında en yakın mantıklı değer C seçeneğidir.

      '
