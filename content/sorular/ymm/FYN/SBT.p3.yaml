    yıl 80.000 TL, 2. yıl 120.000 TL, 3. yıl 150.000 TL ve 4. yıl 100.000 TL''dir. Yukarıdaki bilgilere göre projenin
    geri ödeme süresi kaç yıldır?

    '
  secenekler:
    A: 2 yıl
