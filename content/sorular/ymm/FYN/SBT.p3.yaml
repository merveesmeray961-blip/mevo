  konu: SBT
  kazanim: geri ödeme süresi
  tip: uygulama
  zorluk: 3
  kok: 'Bir işletme 300.000 TL yatırım gerektiren bir projeyi değerlendirmektedir. Yıllık nakit akışları sırasıyla
    1. yıl: 100.000, 2. yıl: 120.000, 3. yıl: 90.000, 4. yıl: 80.000 TL''dir. Bu bilgilere dayanarak aşağıdaki önermelerin
    hangisi ya da hangileri **doğrudur**?


    I.  Geleneksel geri ödeme süresi 3 yılı aşmaktadır.

    II. 2. yılın sonunda kümülatif nakit akışı 220.000 TL''dir.

    III. 3. yılın nakit akışının tamamına ihtiyaç duyulmadan yatırım geri kazanılır.

    '
  secenekler:
    A: Yalnızca I
    B: Yalnızca II
    C: Yalnızca I ve II
    D: Yalnızca II ve III
    E: I, II ve III
