  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: optimal sermaye yapısı
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin hedef sermaye yapısında borcun ağırlığı %40, özkaynağın ağırlığı %60'tır. Vergi öncesi borç maliyeti
    %8, özkaynak maliyeti %14 ve kurumlar vergisi oranı %25 ise ağırlıklı ortalama sermaye maliyeti kaçtır?
  secenekler:
    A: '%9,6'
    B: '%10,0'
    C: '%10,8'
    D: '%11,2'
    E: '%12,0'
  dogru: C
  aciklama:
    dogru_neden: 'Vergi sonrası borç maliyeti %8×(1−0,25)=%6''dır. Ağırlıklı maliyet %40×%6 + %60×%14 = %10,8 olur. Püf noktaları:
      Borç maliyetinde vergi kalkanını uygulayın; özkaynak maliyetine aynı vergi indirimi uygulanmaz.'
    celdiriciler:
      A: Vergi sonrası borç maliyetini hesaba katmadan veya ağırlıkları yanlış uygulayarak bulunabilir; verilen değerlerle
        sonuç %9,6 değildir.
      B: Borç ve özkaynak maliyetlerinin ağırlıklı toplamı verilen oranlarla %10,0 çıkmaz.
      D: Borç maliyetini vergi sonrası indirgeme ve ağırlıklandırma doğru yapıldığında %11,2 elde edilmez.
      E: Vergi sonrası borç maliyetini dikkate almayan veya ağırlıkları toplamayan bir sonuçtur.
    hesap_adimlari:
    - 'Vergi sonrası borç maliyeti: %8 × (1−%25) = %6'
    - 'Borç katkısı: %40 × %6 = %2,4'
    - 'Özkaynak katkısı: %60 × %14 = %8,4'
    - WACC = %2,4 + %8,4 = %10,8
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — optimal sermaye yapısı
    madde: '-'
    alinti: ''
