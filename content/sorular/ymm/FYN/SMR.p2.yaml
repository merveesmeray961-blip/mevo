      anahtar kaynaksız hesapla doğrulandı'
- id: YMM-FYN-SMR-0059
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: finansal kaldıraç
  tip: hesaplama
  zorluk: 3
  kok: M A.Ş.'nin birleşik kaldıraç derecesi 6, faaliyet kaldıraç derecesi 2'dir. Şirketin faiz ve vergi öncesi
    kârı (FVÖK) 300.000 TL'dir. Şirket ayrıca imtiyazlı pay sahiplerine yılda 24.000 TL kâr payı ödemektedir; imtiyazlı
    kâr payı vergi sonrası kârdan ödenir ve vergi matrahından indirilemez. Kurumlar vergisi oranı %20 varsayılmıştır.
    Buna göre şirketin yıllık faiz gideri kaç TL'dir?
  secenekler:
    A: 170.000 TL
    B: 176.000 TL
    C: 195.000 TL
    D: 200.000 TL
    E: 220.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Birleşik kaldıraç = faaliyet kaldıracı × finansal kaldıraç olduğundan FKD = 6 / 2 = 3. İmtiyazlı
      kâr payı vergi sonrası ödendiğinden vergi öncesi karşılığı 24.000 / (1 − 0,20) = 30.000 TL''dir. FKD = FVÖK
      / [FVÖK − Faiz − 30.000] → 3 = 300.000 / (300.000 − Faiz − 30.000) → 300.000 − Faiz − 30.000 = 100.000 → Faiz
      = 170.000 TL. Püf noktaları: Kaldıraç dereceleri toplanmaz ya da çıkarılmaz, çarpılır; imtiyazlı kâr payı
      FKD formülüne vergi öncesi tutara çevrilerek girer.'
    celdiriciler:
      B: 'İmtiyazlı kâr payı vergi öncesine çevrilmeden (24.000) düşülmüştür: 300.000 − 100.000 − 24.000.'
      C: 'FKD, BKD − FKD = 6 − 2 = 4 alınmıştır: 300.000 / 4 = 75.000; Faiz = 300.000 − 75.000 − 30.000.'
      D: 'İmtiyazlı kâr payı hiç dikkate alınmamıştır: 300.000 − 100.000.'
      E: 'FKD, birleşik kaldıraç derecesine (6) eşit alınmıştır: 300.000 / 6 = 50.000; Faiz = 300.000 − 50.000 −
        30.000.'
    hesap_adimlari:
    - FKD = 6 / 2 = 3
    - 'Vergi öncesi imtiyazlı kâr payı: 24.000 / 0,8 = 30.000'
    - FVÖK − Faiz − 30.000 = 300.000 / 3 = 100.000
    - Faiz = 170.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — finansal kaldıraç
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fkd = 6/2

      sonuc = round(300000 - 300000/fkd - 24000/(1-0.2), 2)'
