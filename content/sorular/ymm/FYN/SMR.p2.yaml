  kok: R A.Ş.'nin hedef sermaye yapısı %50 borç, %50 özkaynaktır. Şirketin bu yıl yatırıma ayırabileceği dağıtılmamış
    kârı 300.000 TL'dir; özkaynak ihtiyacı bu tutarı aşarsa yeni pay ihraç edilecektir. Pay fiyatı 40 TL, gelecek
