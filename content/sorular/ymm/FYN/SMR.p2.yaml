- id: YMM-FYN-SMR-0056
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: ağırlıklı ortalama sermaye maliyeti
  tip: hesaplama
  zorluk: 2
  kok: Z A.Ş.'nin 10.000 adet payı borsada 60 TL'den işlem görmektedir; pay başına defter değeri 20 TL'dir. Şirketin
    tek borcu 400.000 TL tutarındaki banka kredisidir ve kredinin piyasa değeri defter değerine eşittir. Özkaynak
    maliyeti %20, kredinin vergi öncesi maliyeti %15, kurumlar vergisi oranı %20 varsayılmıştır. Piyasa değeri ağırlıklarıyla
    hesaplanan ağırlıklı ortalama sermaye maliyeti (AOSM) yüzde kaçtır?
  secenekler:
    A: '%14,67'
    B: '%15,20'
    C: '%16,00'
    D: '%16,80'
    E: '%18,00'
  dogru: D
  aciklama:
    dogru_neden: Özkaynağın piyasa değeri 10.000 × 60 = 600.000 TL, borç 400.000 TL; toplam 1.000.000 TL. Ağırlıklar
      %60 özkaynak, %40 borç. Vergi sonrası borç maliyeti 15 × (1 − 0,20) = %12. AOSM = 0,60 × 20 + 0,40 × 12 =
      12 + 4,8 = %16,80.
    celdiriciler:
      A: 'Defter değeri ağırlıkları kullanılmıştır (özkaynak 200.000, borç 400.000): 1/3 × 20 + 2/3 × 12 = %14,67.'
      B: 'Ağırlıklar ters eşleştirilmiştir: 0,40 × 20 + 0,60 × 12 = %15,20.'
      C: 'Ağırlıklandırma yapılmadan basit ortalama alınmıştır: (20 + 12) / 2 = %16.'
      E: 'Borcun vergi kalkanı ihmal edilmiştir: 0,60 × 20 + 0,40 × 15 = %18.'
    hesap_adimlari:
    - 'Özkaynak PD: 600.000; borç: 400.000'
    - kd(1 − t) = %12
    - AOSM = 12 + 4,8 = %16,80
  kaynaklar:
  - mevzuat: Genel bilgi — ağırlıklı ortalama sermaye maliyeti
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'e = 10000*60

      d = 400000

      sonuc = round((e*20 + d*15*0.8)/(e+d), 2)'
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R2: oran güncel değil (2026''da %25); hesap %20''ye göre kurgulandığından kökte varsayım
          belirtildi, anahtar kaynaksız hesapla doğrulandı'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-1.yaml, satır 15
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
  - tarih: '2026-10-18'
    kim: hakem
    ne: düzeltildi
    neden: 'R2: oran güncel değil (2026''da %25); hesap %20''ye göre kurgulandığından kökte varsayım belirtildi,
      anahtar kaynaksız hesapla doğrulandı'
- id: YMM-FYN-SMR-0057
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: optimal sermaye yapısı
  tip: kavrama
  zorluk: 2
  kok: Sermaye yapısı teorileriyle ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Vergisiz Modigliani-Miller yaklaşımına göre, faaliyet riski ve nakit akışları aynı olan borçlu ve borçsuz
      firmaların değerleri eşittir.
    B: Vergisiz Modigliani-Miller yaklaşımına göre borç oranı arttıkça özkaynak maliyeti yükselir, AOSM ise değişmez.
    C: Kurumlar vergisinin dikkate alındığı Modigliani-Miller yaklaşımında borçlu firmanın değeri, borçsuz firmanın
      değerine faiz vergi kalkanının bugünkü değeri eklenerek bulunur.
    D: Dengeleme (trade-off) teorisine göre optimal borç düzeyi, ek borcun vergi kalkanı faydasının beklenen finansal
      sıkıntı maliyetlerindeki artışa eşitlendiği noktadır.
    E: Finansman hiyerarşisi (pecking order) teorisine göre işletmeler dış kaynağa gerektiğinde önce yeni pay ihracına,
      ardından borçlanmaya başvurur.
  dogru: E
  aciklama:
    dogru_neden: Finansman hiyerarşisi teorisine göre bilgi asimetrisi nedeniyle işletmeler önce iç kaynakları (dağıtılmamış
      kârlar), dış kaynak gerekirse önce borcu, en son yeni pay ihracını kullanır. Yeni pay ihracı, yöneticilerin
      payın aşırı değerli olduğunu düşündüğü sinyalini verdiğinden en son tercihtir. E'deki sıralama terstir.
    celdiriciler:
      A: 'Doğrudur: vergisiz MM''nin I. önermesine göre firma değeri sermaye yapısından bağımsızdır.'
      B: 'Doğrudur: vergisiz MM''nin II. önermesine göre özkaynak maliyeti borç/özkaynak oranıyla doğrusal artar;
        ucuz borcun faydası bu artışla tam olarak dengelendiğinden AOSM sabit kalır.'
      C: 'Doğrudur: vergili MM''de VL = VU + vergi kalkanının bugünkü değeri (süresiz borçta t × B).'
      D: 'Doğrudur: dengeleme teorisinde optimal nokta, marjinal vergi kalkanı faydası ile marjinal beklenen finansal
        sıkıntı maliyetinin eşitlendiği borç düzeyidir.'
