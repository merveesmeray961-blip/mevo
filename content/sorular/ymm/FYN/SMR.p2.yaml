  aciklama:
    dogru_neden: 'Dağıtılmamış kâr maliyeti = 4 / 40 + %10 = %20. Yeni pay maliyeti = 4 / [40 × (1 − 0,20)] + %10
      = 4 / 32 + %10 = %22,5. Kırılma noktası = 300.000 / 0,50 = 600.000 TL; 800.000 TL''lik bütçe bu noktayı aştığından
      son liranın özkaynak kısmı yeni pay ihracıyla karşılanır. Marjinal AOSM = 0,5 × 15 × 0,8 + 0,5 × 22,5 = 6
      + 11,25 = %17,25. Püf noktaları: Kırılma noktası, dağıtılmamış kârın özkaynak ağırlığına bölünmesiyle bulunur
      (300.000 TL değil 600.000 TL). Bütçe kırılma noktasını aştığında marjinal maliyet yeni pay maliyetiyle hesaplanır;
      iki dilimin ortalaması alınmaz.'
    celdiriciler:
      A: 'Kırılma noktası dikkate alınmamış, özkaynağın tamamı dağıtılmamış kâr maliyetiyle (%20) hesaplanmıştır:
        6 + 10 = %16. Bu oran yalnız ilk 600.000 TL için geçerlidir.'
      C: 'Borcun vergi kalkanı ihmal edilmiştir: 0,5 × 15 + 0,5 × 22,5 = %18,75.'
      D: Dağıtılmamış kârın maliyetidir; borç bileşeni ve yeni pay ihracı dikkate alınmamıştır.
      E: Yeni pay ihracının maliyetidir; sermaye maliyeti borç bileşeniyle birlikte ağırlıklandırılmamıştır.
    hesap_adimlari:
    - ke (dağıtılmamış kâr) = %20
    - ke (yeni pay) = 4/32 + 10 = %22,5
    - Kırılma noktası = 300.000 / 0,5 = 600.000 < 800.000
    - Marjinal AOSM = 6 + 11,25 = %17,25
