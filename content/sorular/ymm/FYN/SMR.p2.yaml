    pay fiyatının %20'sidir. Borcun vergi öncesi maliyeti %15'tir ve tutardan bağımsızdır; kurumlar vergisi oranı
    %20 varsayılmıştır. Şirket hedef sermaye yapısına uygun olarak toplam 800.000 TL'lik yatırım yaparsa, bu bütçenin
    son lirasının (marjinal) sermaye maliyeti yüzde kaçtır?
