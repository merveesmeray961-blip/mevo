  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: optimal sermaye yapısı
  tip: uygulama
  zorluk: 3
  kok: 'Tamamı özkaynakla finanse edilen ve 100.000 adet payı bulunan N A.Ş., 1.000.000 TL''lik yeni yatırımı için
    iki finansman seçeneğini değerlendirmektedir: (1) pay başına 20 TL''den 50.000 adet yeni pay ihracı, (2) yıllık
    %15 faizli 1.000.000 TL kredi. Kurumlar vergisi oranı %20 varsayılmıştır; ihraç maliyeti ve imtiyazlı pay yoktur.
    Buna göre aşağıdaki ifadelerden hangileri doğrudur?


    I. İki seçenekte hisse başına kârı (HBK) eşitleyen FVÖK 450.000 TL''dir.

    II. Bu FVÖK düzeyinde her iki seçenekte HBK 2,40 TL''dir.

    III. Beklenen FVÖK 600.000 TL ise kredi seçeneği daha yüksek HBK sağlar.

    IV. Kurumlar vergisi oranı %25 olsaydı, HBK''yı eşitleyen FVÖK düzeyi daha düşük olurdu.'
  secenekler:
    A: I ve II
    B: II ve IV
    C: I, III ve IV
    D: I ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'Kayıtsızlık noktası: FVÖK × 0,8 / 150.000 = (FVÖK − 150.000) × 0,8 / 100.000 → 100.000 × FVÖK
      = 150.000 × FVÖK − 22.500.000.000 → FVÖK = 450.000 TL (I doğru). HBK = 450.000 × 0,8 / 150.000 = 2,40 TL;
      kredi seçeneğinde (450.000 − 150.000) × 0,8 / 100.000 = 2,40 TL (II doğru). FVÖK 600.000 TL''de: pay ihracı
      480.000 / 150.000 = 3,20 TL; kredi 450.000 × 0,8 / 100.000 = 3,60 TL (III doğru). Vergi çarpanı (1 − t) eşitliğin
      iki yanında da bulunduğundan sadeleşir; imtiyazlı pay olmadığında vergi oranı kayıtsızlık FVÖK''ünü değiştirmez
      (IV yanlış). Püf noktaları: FVÖK kayıtsızlık noktasının üzerindeyse borçla finansman HBK''yı artırır; vergi
      oranı yalnız imtiyazlı kâr payı varsa kayıtsızlık noktasını etkiler.'
    celdiriciler:
      A: 'III de doğrudur: 600.000 TL FVÖK kayıtsızlık noktasının üzerinde olduğundan kredi seçeneği 3,60 TL ile
        daha yüksek HBK sağlar.'
      B: IV yanlıştır; I de doğrudur.
      C: 'IV yanlıştır: (1 − t) çarpanı iki tarafta sadeleşir, kayıtsızlık FVÖK''ü vergi oranından bağımsızdır;
        ayrıca II de doğrudur.'
      D: 'II de doğrudur: kayıtsızlık FVÖK''ünde her iki seçenekte HBK 2,40 TL''dir.'
    hesap_adimlari:
    - FVÖK/150.000 = (FVÖK − 150.000)/100.000 → FVÖK = 450.000
    - HBK = 360.000 / 150.000 = 2,40
    - 'FVÖK 600.000: pay 3,20; kredi 3,60'
