- id: YMM-FYN-SMR-0058
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: CAPM ve beta
  tip: hesaplama
  zorluk: 3
  kok: Halka açık olmayan K A.Ş., sermaye maliyetini belirlemek için aynı sektörde faaliyet gösteren halka açık
    L A.Ş.'nin verilerini kullanacaktır. L A.Ş.'nin kaldıraçlı betası 1,4, piyasa değerleriyle borç/özkaynak oranı
    0,5'tir. K A.Ş.'nin hedef sermaye yapısı %50 borç, %50 özkaynaktır ve borcunun vergi öncesi maliyeti %15'tir.
    Risksiz getiri %10, piyasa portföyünün beklenen getirisi %16, her iki şirket için kurumlar vergisi oranı %20
    varsayılmıştır. Betanın βL = βU × [1 + (1 − t) × B/Ö] eşitliğiyle düzeltildiği ve özkaynak maliyetinin CAPM
    ile bulunduğu varsayımıyla K A.Ş.'nin AOSM'si yüzde kaçtır?
  secenekler:
    A: '%14,00'
    B: '%15,20'
    C: '%16,40'
    D: '%17,00'
    E: '%17,90'
  dogru: C
  aciklama:
    dogru_neden: 'L''nin kaldıraçsız betası: βU = 1,4 / [1 + 0,8 × 0,5] = 1,4 / 1,4 = 1,0. K''nın B/Ö oranı 0,50
      / 0,50 = 1; βL = 1,0 × (1 + 0,8 × 1) = 1,8. Özkaynak maliyeti = 10 + 1,8 × (16 − 10) = %20,8. Vergi sonrası
      borç maliyeti = 15 × 0,8 = %12. AOSM = 0,5 × 20,8 + 0,5 × 12 = 10,4 + 6 = %16,40. Püf noktaları: Benzer firmanın
      betası önce kendi borç/özkaynak oranıyla kaldıraçtan arındırılır, sonra hedef firmanın borç/özkaynak oranıyla
      (borç/toplam değer oranıyla değil) yeniden kaldıraçlandırılır; %50 borç ağırlığı B/Ö = 1 demektir.'
    celdiriciler:
      A: 'Kaldıraçsız beta (1,0) doğrudan kullanılmıştır: ke = %16; AOSM = 8 + 6 = %14.'
      B: 'L''nin kaldıraçlı betası (1,4) olduğu gibi kullanılmış ya da yeniden kaldıraçlandırmada B/Ö yerine borç
        ağırlığı (0,5) alınmıştır: ke = %18,4; AOSM = 9,2 + 6 = %15,20.'
      D: 'Yeniden kaldıraçlandırmada (1 − t) çarpanı unutulmuştur: βL = 2,0; ke = %22; AOSM = 11 + 6 = %17.'
      E: 'Borç maliyetinde vergi kalkanı ihmal edilmiştir: 10,4 + 0,5 × 15 = %17,90.'
    hesap_adimlari:
    - βU = 1,4 / 1,4 = 1,0
    - K için B/Ö = 1 → βL = 1,8
    - ke = 10 + 1,8 × 6 = %20,8
    - kd(1 − t) = %12
    - AOSM = 10,4 + 6 = %16,40
  kaynaklar:
  - mevzuat: Genel bilgi — CAPM ve beta
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bu = 1.4/(1 + 0.8*0.5)

      bl = bu*(1 + 0.8*1)

      ke = 10 + bl*(16-10)

      sonuc = round(0.5*ke + 0.5*15*0.8, 2)'
  durum: kontrolde
  surum: 2
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi FYN-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'düzeltme turu: R2: oran güncel değil (2026''da %25); hesap %20''ye göre kurgulandığından kökte varsayım
          belirtildi, anahtar kaynaksız hesapla doğrulandı'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_FYN-1.yaml, satır 17
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
