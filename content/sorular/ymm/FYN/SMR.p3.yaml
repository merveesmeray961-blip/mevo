  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: finansal kaldıraç
  tip: uygulama
  zorluk: 3
  kok: 'Şirket A %20 borç / %80 öz kaynak, Şirket B ise %60 borç / %40 öz kaynak oranıyla finanse edilmektedir. Her iki şirketin
    faiz ve vergi öncesi kârı (FVÖK) eşittir. Yukarıdaki bilgilere göre finansal kaldıraç açısından aşağıdaki yargılardan
    hangisi doğrudur?

    '
  secenekler:
    A: Şirket A daha yüksek finansal kaldıraca sahiptir.
    B: Şirket B'nin faiz giderleri daha düşüktür.
    C: Şirket B finansal kaldıraç etkisinden daha fazla yararlanır.
    D: Eşit FVÖK olduğunda iki şirketin hisse başına kârı da eşittir.
    E: Finansal kaldıraç yalnızca öz kaynak ağırlıklı şirketlerde görülür.
  dogru: C
  aciklama:
    dogru_neden: 'Şirket B daha fazla borç kullandığından faiz giderleri daha yüksektir; ancak aynı zamanda finansal kaldıraç
      etkisi de daha güçlüdür. FVÖK arttığında Şirket B''nin hisse başına kârındaki artış orantısal olarak Şirket A''dan daha
      büyük olur; bu finansal kaldıraç etkisidir.

      '
    celdiriciler:
      A: Daha yüksek borç oranıyla Şirket B daha yüksek finansal kaldıraca sahiptir.
      B: Daha fazla borcu olan Şirket B'nin faiz giderleri daha yüksektir.
      D: Şirket B daha fazla faiz ödediğinden HBK'ları farklıdır; eşit olamaz.
      E: Finansal kaldıraç borç kullanan şirketlerde ortaya çıkar; öz kaynak ağırlıklıda değil.
