    A: AOSM = 0,5 × %7 + 0,5 × %16 = %11,5 olmalıydı; verilen %12 hatalıdır.
    B: Optimal sermaye yapısı AOSM'yi maksimize etmeyi hedefler.
    C: Borç oranını artırmak her zaman AOSM'yi düşürür.
    D: Öz sermaye maliyeti borç maliyetinden düşük olduğu için borç kullanımı avantajlıdır.
    E: Vergi sonrası borç maliyeti vergi kalkanının varlığını gösterir.
