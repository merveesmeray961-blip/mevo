- id: YMM-FYN-SMR-0065
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: CAPM ve beta
  tip: uygulama
  zorluk: 2
  kok: 'Sermaye varlıklarını fiyatlama modeline (CAPM) göre bir hisse senedinin beklenen getirisi nasıl hesaplanır?

    '
  secenekler:
    A: Risksiz faiz oranı + (Beta × Piyasa risk primi)
    B: Beta / (Risksiz faiz oranı + Piyasa getirisi)
    C: Risksiz faiz oranı × Beta + Piyasa getirisi
    D: Piyasa getirisi − Beta × Risksiz faiz oranı
    E: Beta × Piyasa getirisi − Risksiz faiz oranı
  dogru: A
  aciklama:
    dogru_neden: 'CAPM formülü: E(Ri) = Rf + βi × (Rm − Rf). Risksiz faiz oranına, betanın piyasa risk primiyle çarpımı eklenerek
      beklenen getiri bulunur.

      '
    celdiriciler:
      B: Beta payda değil, çarpan konumundadır; formül toplama değil çarpma-toplama işlemi içerir.
      C: Risksiz oran, betayla çarpılmaz; piyasa risk primi (Rm−Rf) betayla çarpılır.
      D: Risksiz oran çıkarılmaz, eklenir; işlem sırası ve işaret yanlıştır.
      E: Piyasa getirisinin tamamı betayla çarpılmaz; sadece piyasa risk primi çarpılır.
