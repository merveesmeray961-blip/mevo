    dogru_neden: 'Borç faiz ödemeleri vergiden düşülebildiği için vergi sonrası borç maliyeti brüt faiz oranından düşüktür;
      bu, vergi kalkanı (tax shield) etkisinin göstergesidir.

      '
    celdiriciler:
      A: 0,5×%7 + 0,5×%16 = %11,5; fark yuvarlama ya da piyasa değeri ağırlıklarından kaynaklanabilir; hata iddiası yanlıştır.
