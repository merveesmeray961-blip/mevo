- id: YMM-FYN-SMR-0063
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Sermaye maliyeti ve sermaye yapısı
  konu: SMR
  kazanim: ağırlıklı ortalama sermaye maliyeti
  tip: uygulama
  zorluk: 3
  kok: 'Bir işletmenin sermaye yapısı %40 borç ve %60 öz kaynaktan oluşmaktadır. Borcun vergi öncesi maliyeti %12, kurumlar
    vergisi oranı %20 ve öz kaynak maliyeti %18''dir. Buna göre işletmenin ağırlıklı ortalama sermaye maliyeti (AOSM/WACC)
    nedir?

    '
  secenekler:
    A: '%12,96'
    B: '%14,64'
    C: '%13,44'
    D: '%15,60'
    E: '%11,52'
  dogru: B
  aciklama:
    dogru_neden: 'WACC = (Borç ağırlığı × Borç maliyeti × (1 − Vergi)) + (Öz kaynak ağırlığı × Öz kaynak maliyeti) = 0,40
      × 0,12 × (1 − 0,20) + 0,60 × 0,18 = 0,40 × 0,096 + 0,60 × 0,18 = 0,0384 + 0,1080 = 0,1464 → %14,64. Borcun vergi sonrası
      maliyeti %12 × 0,80 = %9,6 olarak hesaplanır; öz kaynak maliyeti ise %18 olarak verilmiştir. Ağırlıklı ortalama bu değerleri
      birleştirir.

      '
    celdiriciler:
      A: Vergi kalkanı gözetilmeden borç maliyeti %12 olarak kullanıldığında bulunan hatalı değerdir.
      C: Vergi oranı yanlış uygulandığında çıkan ara değerdir.
      D: Borç ve öz kaynak maliyetleri doğrudan ortalamasına alındığında ulaşılan sonuçtur.
      E: Ağırlıklar ters atanarak hesaplama yapıldığında elde edilen hatalı değerdir.
  kaynaklar:
