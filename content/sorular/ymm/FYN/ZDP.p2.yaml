  kok: Bir işletme, kiraladığı depo için üç yıl boyunca her yılın **başında** 10.000 TL kira ödeyecektir; ilk ödeme bugün
    yapılacaktır. Yıllık iskonto oranı %25'tir [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512]. Kira ödemelerinin
    bugünkü değeri kaç TL'dir?
  secenekler:
    A: 15.616 TL
    B: 19.520 TL
    C: 24.400 TL
    D: 29.520 TL
    E: 38.125 TL
  dogru: C
  aciklama:
    dogru_neden: 'Ödemeler dönem başında yapıldığından bu bir peşin (dönem başı) anüitedir. Bugünkü ödeme iskontolanmaz; ikinci
      ödeme bir, üçüncü ödeme iki dönem iskontolanır: 10.000 × (1 + 0,80 + 0,64) = 24.400 TL. Aynı sonuç, adi anüite değerinin
      (1 + i) ile çarpılmasıyla da bulunur: 19.520 × 1,25 = 24.400 TL.'
    celdiriciler:
      A: Adi anüite değeri (19.520 TL) bir dönem daha iskontolanmıştır (19.520 × 0,80); peşin anüite ertelenmiş anüiteyle
        karıştırılmıştır.
      B: 'Ödemeler yıl sonunda yapılıyormuş gibi adi anüite hesaplanmıştır: 10.000 × (0,80 + 0,64 + 0,512).'
      D: 'Bugünkü ödeme ile üç adet yıl sonu ödemesi birlikte alınmış, yani dört ödeme sayılmıştır: 10.000 + 19.520.'
      E: 'Bugünkü değer yerine adi anüitenin üçüncü yıl sonundaki gelecek değeri bulunmuştur: 10.000 × (1,5625 + 1,25 + 1).'
    hesap_adimlari:
    - '1. ödeme (bugün): 10.000 TL'
    - '2. ödeme: 10.000 × 0,80 = 8.000 TL'
    - '3. ödeme: 10.000 × 0,64 = 6.400 TL'
    - 'Toplam bugünkü değer: 24.400 TL'
