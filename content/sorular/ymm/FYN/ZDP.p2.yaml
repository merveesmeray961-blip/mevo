  zorluk: 2
  kok: Bir bankada yıllık nominal faiz oranı %20 olan bir mevduat hesabıyla ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
    (Faiz, belirtilen dönemlerin sonunda anaparaya eklenmekte; vergi ve kesinti bulunmamaktadır.)
  secenekler:
    A: Faiz altı ayda bir eklenirse bugün yatırılan 10.000 TL iki yıl sonunda 14.400 TL olur.
    B: Faiz altı ayda bir eklenirse efektif yıllık faiz oranı %21 olur.
    C: Faiz üç ayda bir eklenirse efektif yıllık faiz oranı yaklaşık %21,55 olur.
    D: Faiz yılda bir eklenirse iki yıl sonra alınacak 14.400 TL'nin bugünkü değeri 10.000 TL olur.
    E: Faiz ekleme sıklığı arttıkça efektif oran yükselir; ancak her ek sıklığın sağladığı artış giderek küçülür.
  dogru: A
  aciklama:
    dogru_neden: 'Altı ayda bir faiz eklendiğinde dönem faizi %10, iki yılda dönem sayısı 4''tür: 10.000 × (1,10)^4 = 10.000
      × 1,4641 = 14.641 TL. 14.400 TL, faizin yılda bir eklendiği durumdaki tutardır [10.000 × (1,20)^2]. Bu nedenle A yanlıştır.'
    celdiriciler:
      B: 'Doğrudur: (1,10)^2 − 1 = 1,21 − 1 = %21.'
      C: 'Doğrudur: (1,05)^4 = 1,1025^2 = 1,2155; efektif oran yaklaşık %21,55''tir.'
      D: 'Doğrudur: yılda bir eklemede 14.400 / (1,20)^2 = 14.400 / 1,44 = 10.000 TL.'
      E: 'Doğrudur: yıllık %20, altı aylık %21, üç aylık %21,55 örneğinde görüldüğü gibi efektif oran artar, ancak artış azalan
        hızla sürer (üst sınır sürekli bileşik faizdir).'
    hesap_adimlari:
    - 'Altı aylık dönem faizi: %20 / 2 = %10'
    - 'Dönem sayısı: 2 yıl × 2 = 4'
    - 'Gelecek değer: 10.000 × 1,1^4 = 14.641 TL'
