- id: YMM-FYN-ZDP-0057
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: anüite
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme 97.600 TL tutarındaki banka kredisini yıllık %25 bileşik faizle, yıl sonlarında ödenecek üç eşit taksitle
    geri ödeyecektir. Her taksitte önce dönem başındaki kalan anaparanın faizi kapatılmakta, kalan kısım anaparadan düşülmektedir
    [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512]. İkinci taksidin içindeki anapara ödemesi kaç TL'dir?
  secenekler:
    A: 10.000 TL
    B: 18.000 TL
    C: 24.400 TL
    D: 25.600 TL
    E: 32.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'Anüite faktörü: 0,80 + 0,64 + 0,512 = 1,952. Taksit = 97.600 / 1,952 = 50.000 TL. 1. yıl: faiz 97.600 ×
      0,25 = 24.400; anapara 50.000 − 24.400 = 25.600; kalan 72.000 TL. 2. yıl: faiz 72.000 × 0,25 = 18.000; anapara 50.000
      − 18.000 = 32.000 TL. Püf noktaları: Önce taksit tutarı anüite faktörüyle bulunur, sonra ödeme planı satır satır kurulur;
      her taksitte faiz payı azalır, anapara payı artar. Kontrol: 3. yıl kalan 40.000 TL''nin faizi 10.000 TL olup taksit
      50.000 TL''ye tamamlanır.'
    celdiriciler:
      A: Üçüncü taksidin faiz payıdır (40.000 × 0,25).
      B: İkinci taksidin faiz payıdır; soru anapara payını istemektedir.
      C: Birinci taksidin faiz payıdır (97.600 × 0,25).
