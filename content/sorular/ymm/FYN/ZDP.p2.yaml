- id: YMM-FYN-ZDP-0056
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: hisse senedi değerlemesi (Gordon modeli)
  tip: uygulama
  zorluk: 3
  kok: 'Y A.Ş.''nin payı 48 TL''den işlem görmektedir. Şirket az önce pay başına 2 TL kâr payı ödemiştir (D0). Payın gerekli
    getiri oranı %25''tir ve piyasa fiyatının, kâr paylarının süresiz olarak sabit oranda büyüdüğünü varsayan Gordon modeliyle
    bulunan değere eşit olduğu kabul edilmektedir. Buna göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Fiyata yansıyan sabit büyüme oranı %20''dir.

    II. Beklenen kâr payı verimi (D1 / P0) %5''tir.

    III. Varsayımlar değişmezse payın bir yıl sonraki beklenen fiyatı 57,60 TL''dir.

    IV. Son ödenen kâr payının fiyata oranı (D0 / P0) ile büyüme oranının toplamı gerekli getiri oranına eşittir.'
  secenekler:
    A: Yalnız I
    B: I ve IV
    C: II ve III
    D: I, III ve IV
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'P0 = D0 × (1 + g) / (k − g) → 48 × (0,25 − g) = 2 × (1 + g) → 12 − 48g = 2 + 2g → g = 10 / 50 = %20 (I doğru).
      D1 = 2 × 1,20 = 2,40 TL; D1 / P0 = 2,40 / 48 = %5 (II doğru). Sabit büyümede fiyat da g oranında artar: P1 = 48 × 1,20
      = 57,60 TL ya da P1 = D2 / (k − g) = 2,88 / 0,05 = 57,60 TL (III doğru). Gerekli getiri D1 / P0 + g = %5 + %20 = %25''tir;
      D0 / P0 + g = %4,17 + %20 = %24,17 olup %25''e eşit değildir (IV yanlış). Püf noktaları: Büyüme oranını çözerken pay
      kısmında D0 değil D1 = D0(1 + g) yer alır; bilinmeyen g hem payda hem paydada bulunduğundan denklem doğrusal olarak
      çözülür. Getiri ayrıştırmasında kâr payı verimi daima beklenen kâr payıyla (D1) hesaplanır.'
    celdiriciler:
      A: II ve III de doğrudur; kâr payı verimi %5 ve bir yıl sonraki fiyat 57,60 TL'dir.
      B: 'IV yanlıştır: kâr payı verimi D0 ile değil D1 ile hesaplanır (D0 / P0 + g = %24,17).'
      C: I de doğrudur; ima edilen büyüme oranı %20'dir.
      D: IV yanlış, II doğrudur.
    hesap_adimlari:
    - 48(0,25 − g) = 2(1 + g) → g = %20
    - D1 = 2,40; D1/P0 = %5
    - P1 = 48 × 1,20 = 57,60
    - D0/P0 + g = %24,17 ≠ %25
