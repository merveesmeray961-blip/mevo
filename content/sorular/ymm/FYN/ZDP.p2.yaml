  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: hisse senedi değerlemesi (Gordon modeli)
  tip: hesaplama
  zorluk: 3
  kok: X A.Ş. az önce pay başına 4 TL kâr payı dağıtmıştır (D0). Kâr payının önümüzdeki iki yıl her yıl %25 artması, üçüncü
    yıldan itibaren ise süresiz olarak her yıl %5 sabit oranda büyümesi beklenmektedir. Kâr payları yıl sonlarında ödenmekte
    olup payın gerekli getiri oranı %25'tir [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64; (1,25)^−3 = 0,512]. Bu verilere göre payın
    bugünkü değeri kaç TL'dir?
  secenekler:
    A: 21,00 TL
    B: 24,80 TL
    C: 28,00 TL
    D: 29,00 TL
    E: 40,81 TL
  dogru: D
  aciklama:
    dogru_neden: 'D1 = 4 × 1,25 = 5 TL; D2 = 5 × 1,25 = 6,25 TL; D3 = 6,25 × 1,05 = 6,5625 TL. Sabit büyüme dönemi Gordon
      modeliyle 2. yıl sonuna değerlenir: P2 = D3 / (k − g) = 6,5625 / (0,25 − 0,05) = 32,8125 TL. Bugünkü değer: 5 × 0,80
      + 6,25 × 0,64 + 32,8125 × 0,64 = 4 + 4 + 21 = 29 TL. Püf noktaları: Gordon modeli, formüldeki kâr payından bir dönem
      önceki tarihin değerini verir; D3 kullanıldığı için bulunan değer 2. yıl sonuna aittir ve iki dönem iskontolanır. Hızlı
      büyüme oranı gerekli getiriye eşit olduğundan ilk iki kâr payının her birinin bugünkü değeri D0''a (4 TL) eşittir.'
    celdiriciler:
      A: 'Hızlı büyüme dönemi göz ardı edilip tek aşamalı Gordon modeli uygulanmıştır: 4 × 1,05 / 0,20 = 21 TL.'
      B: 'Uç değer (32,8125 TL) üç dönem iskontolanmıştır: 32,8125 × 0,512 = 16,80; 4 + 4 + 16,80 = 24,80 TL.'
      C: 'Uç değer hesaplanırken D3 yerine D2 kullanılmıştır: 6,25 / 0,20 = 31,25; 31,25 × 0,64 = 20; 4 + 4 + 20 = 28 TL.'
      E: 'Uç değer iskontolanmadan eklenmiştir: 4 + 4 + 32,8125 = 40,81 TL.'
    hesap_adimlari:
    - D1 = 5; D2 = 6,25; D3 = 6,5625
    - P2 = 6,5625 / 0,20 = 32,8125
    - BD(D1) = 4; BD(D2) = 4; BD(P2) = 21
    - P0 = 29 TL
  kaynaklar:
  - mevzuat: Genel bilgi — hisse senedi değerlemesi (Gordon modeli)
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'd1=4*1.25

      d2=d1*1.25

      d3=d2*1.05

      p2=d3/(0.25-0.05)

      sonuc = round(d1/1.25 + (d2+p2)/1.25**2, 2)'
  durum: kontrolde
  surum: 1
