- id: YMM-FYN-ZDP-0055
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: tahvil değerlemesi
  tip: hesaplama
  zorluk: 3
  kok: Nominal değeri 1.000 TL, yıllık kupon oranı %30 olan ve vadesine iki yıl kalan bir tahvilin kuponları yıl sonlarında
    ödenmektedir. Bugün piyasa getirisi %25'tir. Bir yatırımcı tahvili bugün piyasa fiyatından almış; bir yıl sonra kuponu
    tahsil ettikten hemen sonra, o tarihte piyasa getirisi %30'a yükselmiş olduğundan bu getiriye göre oluşan fiyattan satmıştır
    [(1,25)^−1 = 0,80; (1,25)^−2 = 0,64]. İşlem maliyeti ve vergi yoktur. Yatırımcının bir yıllık elde tutmadan sağladığı
    toplam getiri (kupon geliri ile alış-satış fiyatı farkının toplamı) kaç TL'dir?
  secenekler:
    A: −72 TL
    B: 228 TL
    C: 268 TL
    D: 300 TL
    E: 340 TL
  dogru: B
  aciklama:
    dogru_neden: 'Alış fiyatı: 300 × 0,80 + 1.300 × 0,64 = 240 + 832 = 1.072 TL. Bir yıl sonra vadeye bir yıl kalmıştır ve
      getiri %30''dur: satış fiyatı = 1.300 / 1,30 = 1.000 TL. Toplam getiri = 300 (kupon) + 1.000 − 1.072 = 228 TL. Püf noktaları:
      Satış tarihindeki fiyat yeni piyasa getirisiyle bulunur; kupon oranı piyasa getirisine eşitlendiği için tahvil nominal
      değerden işlem görür. Faizin yükselmesi 72 TL sermaye kaybı doğurur ve kupon gelirinin bir kısmını siler.'
    celdiriciler:
      A: 'Kupon geliri unutulup yalnız fiyat farkı alınmıştır: 1.000 − 1.072 = −72 TL.'
      C: 'Satış fiyatı, piyasa getirisi %25''te kalmış gibi hesaplanmıştır: 1.300 × 0,80 = 1.040; 300 + 1.040 − 1.072 = 268
        TL.'
      D: Yalnız kupon geliri dikkate alınmış, fiyat değişimi ihmal edilmiştir.
      E: 'Alış fiyatı nominal değer (1.000 TL), satış fiyatı ise %25 getiriyle (1.040 TL) alınmıştır: 300 + 1.040 − 1.000
        = 340 TL.'
    hesap_adimlari:
    - 'Alış fiyatı: 300 × 0,80 + 1.300 × 0,64 = 1.072 TL'
    - 'Satış fiyatı: 1.300 / 1,30 = 1.000 TL'
    - 'Toplam getiri: 300 + (1.000 − 1.072) = 228 TL'
