- id: YMM-FYN-ZDP-0060
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: anüite
  tip: uygulama
  zorluk: 3
  kok: 'Anüite (eşit taksitli ödeme serisi) kavramı ve özellikleri ile ilgili aşağıdakilerden hangisi **YANLIŞTIR?**

    '
  secenekler:
    A: Dönemsel ödemelerin eşit tutarda olması anüitenin temel koşuludur.
    B: Anüitenin bugünkü değeri, her dönem ödemenin tek tek iskonto edilip toplanmasına eşdeğer sonuç verir.
    C: Sonsuza kadar devam eden sabit ödemeli anüiteye perpetüite (sürekli anüite) adı verilir ve bugünkü değeri
      C/r formülüyle hesaplanır.
    D: Anüitenin gelecek değeri, birikim faktörlerinin toplamı ile taksit miktarının çarpımına eşittir.
    E: Dönem başında yapılan ödemeleri kapsayan anüiteye adi anüite (ordinary annuity) denir ve dönem sonu anüiteye
      göre bugünkü değeri daha yüksektir.
  dogru: E
  aciklama:
    dogru_neden: 'Dönem BAŞINDA yapılan ödemeleri kapsayan anüiteye "anüite-dü" (annuity due) denir; "adi anüite"
      (ordinary annuity) ise dönem SONUNDA yapılan ödemeleri ifade eder. E şıkkında bu iki kavram birbiriyle karıştırılmıştır;
      dolayısıyla ifade yanlıştır. Anüite-dü''nün bugünkü değerinin adi anüiteden yüksek olduğu kısmı doğru olsa
      da tanım hatalı olduğu için şık yanlış sayılır.

      '
    celdiriciler:
      A: Eşit taksit koşulu doğrudur; farklı tutarlar anüite oluşturmaz.
      B: Bugünkü değer hesabı tek tek iskontolama yöntemiyle tutarlıdır; bu ifade doğrudur.
      C: Perpetüite tanımı ve C/r formülü doğrudur.
      D: Gelecek değer = C × [(1+r)^n – 1]/r formülü bu ifadeyle örtüşür; doğrudur.
  kaynaklar:
