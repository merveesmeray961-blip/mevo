  kok: 'Bir şirketin hisse senedi, yakın zamanda hisse başına 3 TL temettü ödemiştir. Temettülerin yıllık %5 oranında
    büyümesi beklenmekte ve yatırımcıların beklenen getiri oranı yıllık %13''tür. Gordon büyüme modeline göre bu
    hisse senedinin bugünkü teorik değeri aşağıdakilerden hangisidir?

    '
  secenekler:
    A: 23,08 TL
    B: 25,00 TL
    C: 31,50 TL
    D: 37,50 TL
    E: 39,38 TL
  dogru: E
  aciklama:
    dogru_neden: 'Gordon modeli: P₀ = D₁ / (r – g). D₁ = 3 × 1,05 = 3,15 TL. P₀ = 3,15 / (0,13 – 0,05) = 3,15 /
      0,08 = 39,375 ≈ 39,38 TL.

      '
    celdiriciler:
      A: 23,08 TL = 3 / 0,13 hatalı hesaplamadır; büyüme dikkate alınmamış, D₀ kullanılmıştır.
      B: 25,00 TL = 3 / (0,13 – 0,01) farklı bir büyüme oranı varsayımıyla elde edilir.
      C: 31,50 TL = 3,15 / 0,10 farklı bir iskonto oranı kullanımından kaynaklanır.
      D: 37,50 TL = 3 / 0,08 hesaplamasıdır; D₁ yerine D₀ kullanılmış, büyüme paydada uygulanmamıştır.
