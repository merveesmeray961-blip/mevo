- id: YMM-FYN-ZDP-0059
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve değerleme
  konu: ZDP
  kazanim: bugünkü ve gelecek değer
  tip: uygulama
  zorluk: 3
  kok: 'Bir yatırımcı bugün bankaya 50.000 TL yatırmaktadır. Banka yıllık %12 faiz uygulamakta olup faiz her ay
    bileşik olarak hesaplanmaktadır. Bu yatırımcının 2 yıl sonra hesabındaki tutarın bugünkü 50.000 TL''lik anaparaya
    oranı (birikim faktörü) aşağıdakilerden hangisidir? (Not: (1 + 0,01)^24 ≈ 1,2697)

    '
  secenekler:
    A: 1,1200
    B: 1,2544
    C: 1,2697
    D: 1,3000
    E: 1,2400
  dogru: C
  aciklama:
    dogru_neden: 'Aylık faiz oranı = %12/12 = %1. 2 yılda 24 dönem vardır. Birikim faktörü = (1+0,01)^24 ≈ 1,2697.
      Aylık bileşik faizde anaparanın katlanacağı oran bu şekilde hesaplanır.

      '
    celdiriciler:
      A: 1,1200 = (1+0,12)^1 formülüdür; 1 yıllık basit bileşik faiz sonucunu verir.
      B: 1,2544 = (1+0,12)^2 formülüdür; yıllık bileşik (aylık değil) varsayımıyla hesaplanmış değerdir.
      D: 1,3000 arbitrer bir değerdir; doğru formülden elde edilmez.
      E: 1,2400 = 1 + 2×0,12 basit faiz formülüdür; bileşik etkiyi yansıtmaz.
  kaynaklar:
  - mevzuat: Genel bilgi — Paranın zaman değeri ve değerleme
