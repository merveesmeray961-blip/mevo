    istem_surumu: uretici paketi YMM-FYN-G01
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-13'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-13'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: kaldi
        tarih: '2026-10-13'
        not: Kökteki not ((1,01)^24≈1,2697) cevabı doğrudan veriyor
      G6:
        sonuc: bekliyor
