  kok: Hesap dönemi takvim yılı olan (N) AŞ, 2026 yılında nakdi sermayeyle yeni kurulmuş ve aynı yıl faaliyete başlamıştır.
    (N) AŞ kurumlar vergisinden muaf değildir ve hasılat esasına göre vergilendirilmemektedir. Buna göre 5520 sayılı Kanun'un
