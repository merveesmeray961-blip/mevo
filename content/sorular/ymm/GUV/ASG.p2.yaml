- id: YMM-GUV-ASG-0009
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yurt içi asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 2
  kok: 'Hesap dönemi takvim yılı olan ve 2010 yılından beri faaliyette bulunan (O) AŞ''nin 2026 yılına ilişkin bilgileri şöyledir:


    - Ticari bilanço kârı: 8.000.000 TL

    - Kanunen kabul edilmeyen giderler: 1.000.000 TL (amatör spor dalı için yapılan 500.000 TL sponsorluk harcaması dahil)

    - Tam mükellef bir AŞ''den alınan ve 5/1-(a) kapsamında istisna olan kâr payı: 2.000.000 TL

    - Beyannamede indirilecek geçmiş yıl zararı: 4.000.000 TL

    - KVK 10/1-(b) kapsamında indirilecek sponsorluk harcaması: 500.000 TL


    Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur; şirket indirimli kurumlar vergisi oranından
    yararlanmamaktadır. Buna göre (O) AŞ''nin 2026 yılı için hesaplanan kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '250.000'
    B: '300.000'
    C: '625.000'
    D: '650.000'
    E: '700.000'
  dogru: E
  aciklama:
    dogru_neden: 'Genel hesap: 8.000.000 + 1.000.000 − 2.000.000 − 4.000.000 − 500.000 = 2.500.000 TL; × %25 = 625.000 TL.
      Asgari hesap: indirim ve istisnalar öncesi kurum kazancı 9.000.000 TL''den yalnız 32/C-2''de sayılan kalemler düşülür;
      5/1-(a) istisnası düşülür, geçmiş yıl zararı ve 10/1-(b) sponsorluk indirimi düşülmez: (9.000.000 − 2.000.000) × %10
      = 700.000 TL. Asgari vergi daha yüksek olduğundan hesaplanan kurumlar vergisi 700.000 TL''dir.'
    celdiriciler:
      A: Asgari vergi matrahından geçmiş yıl zararı ve sponsorluk indirimi de düşülmüştür; ikisi de düşülemez.
      B: Asgari vergi matrahından geçmiş yıl zararı düşülmüştür; Tebliğe göre zarar asgari vergi matrahından düşülmez.
      C: Yalnız genel hesap yapılmış, 32/C'deki asgari vergi karşılaştırması ihmal edilmiştir.
      D: Sponsorluk indirimi asgari vergi matrahından düşülmüştür; 10/1-(b) indirimi 32/C-2'de sayılmamıştır.
    hesap_adimlari:
    - Kurum kazancı = 9.000.000 TL
    - Genel matrah = 9.000.000 − 2.000.000 − 4.000.000 − 500.000 = 2.500.000; KV = 625.000 TL
    - Asgari matrah = 9.000.000 − 2.000.000 = 7.000.000; asgari KV = 700.000 TL
    - Hesaplanan KV = 700.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-1, 2-(a), (b)
    alinti: '(1) 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden
      önceki kurum kazancının %10’undan az olamaz. (2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen
      kurum kazancından aşağıdaki istisna ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j)
      ve (k) bentleri ile sahip oldukları taşınmazlardan elde edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar,
      b) 10 uncu maddenin birinci fıkrasının; (g), (h), (i) ve (j) bentleri kapsamındaki indirimler,'
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.4
    alinti: Beyannamelerde indirim konusu yapılan geçmiş yıl zararları asgari kurumlar vergisi matrahından düşülmeyecek ve
      asgari kurumlar vergisinin hesaplanmasında dikkate alınacaktır.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kk = 8000000 + 1000000

      kv = (kk - 2000000 - 4000000 - 500000) * 25 // 100

      asg = (kk - 2000000) * 10 // 100

      sonuc = max(kv, asg)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_GUV-2.yaml, satır 19
