- id: YMM-GUV-ASG-0011
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yurt içi asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 2
  kok: (İ) AŞ'nin 2026 yılında yurt dışında yaptığı inşaat işlerinden elde ettiği ve KVK 5/1-(h) kapsamında kurumlar vergisinden
    istisna edilen kazancı 1.500.000 TL'dir. Bu kazanç üzerinden ilgili ülkede 90.000 TL vergi ödenmiştir. Yurt içi asgari
    kurumlar vergisi oranı %10'dur. Buna göre bu kazancın, (İ) AŞ'nin 2026 yılı yurt içi asgari kurumlar vergisi hesaplamasında
    kurum kazancından düşülemeyecek, yani asgari vergi matrahında kalacak kısmı kaç TL'dir?
  secenekler:
    A: '0'
    B: '600.000'
    C: '900.000'
    D: 1.410.000
    E: 1.500.000
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğe göre %10 ve üzeri vergi yükü taşıyan yurt dışı kaynaklı istisna kazançlar asgari vergi hesaplamasında
      düşülür; %10 vergi yükü taşımayanların ise taşıdığı vergi yüküne isabet eden kısmı düşülebilir. Vergi yükü 90.000 /
      1.500.000 = %6''dır. Vergiye isabet eden kazanç: 90.000 / 0,10 = 900.000 TL düşülür; kalan 1.500.000 − 900.000 = 600.000
      TL asgari vergi matrahında kalır.'
    celdiriciler:
      A: Vergi yükü %10'un altında olduğundan kazancın tamamı düşülemez; yalnız 900.000 TL'lik kısım düşülür.
      C: 900.000 TL düşülebilecek kısımdır; soru matrahta kalacak kısmı sormaktadır.
      D: Yurt dışında ödenen vergi kazançtan düşülmüştür; vergiye isabet eden kazanç, vergi / %10 formülüyle bulunur.
      E: Tebliğ, %10 vergi yükü taşımayan yurt dışı kaynaklı istisna kazançlarda vergi yüküne isabet eden kısmın düşülmesine
        izin verir.
    hesap_adimlari:
    - Vergi yükü = 90.000 / 1.500.000 = %6 < %10
    - Düşülebilecek kısım = 90.000 / 0,10 = 900.000 TL
    - Matrahta kalan = 1.500.000 − 900.000 = 600.000 TL
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.6, Örnek 8
    alinti: Bu kapsamda, %10 ve üzeri vergi yükü taşıyan yurt dışı kaynaklı istisna kazançlar üzerinden halihazırda %10 vergi
      hesaplanmış olduğundan, asgari vergi hesaplamasında bu istisna kazançların düşülmesi gerekmektedir. Öte yandan, %10
      vergi yükü taşımayan yurt dışı kaynaklı istisna kazançların ise, taşıdığı vergi yüküne isabet eden kazanç kısmı asgari
      vergi matrahından düşülebilecektir.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1500000 - round(90000 / 0.10)
