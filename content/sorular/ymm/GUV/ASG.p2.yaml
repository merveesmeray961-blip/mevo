- id: YMM-GUV-ASG-0008
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: uygulama kapsamı ve istisnalar
  tip: uygulama
  zorluk: 1
  kok: 'Nihai ana işletmesi Türkiye''de bulunan ve hesap dönemi takvim yılı olan (Ç) çok uluslu işletme grubunun konsolide
    finansal tablolarındaki yıllık konsolide hasılatı (milyon avro karşılığı Türk lirası) şöyledir: 2022: 760; 2023: 700;
    2024: 740; 2025: 770; 2026: 690. Grubun 2026 hesap dönemi bakımından yerel ve küresel asgari tamamlayıcı kurumlar vergisinin
    kapsamına girip girmediğine ilişkin aşağıdaki ifadelerden hangisi doğrudur?'
  secenekler:
    A: Kapsama girmez; çünkü gelirin raporlandığı 2026 hesap dönemindeki hasılat sınırın altındadır.
    B: Kapsama girmez; çünkü sınırın birbirini izleyen iki hesap döneminde aşılmış olması gerekir.
    C: Kapsama girer; çünkü önceki dört hesap döneminin en az ikisinde sınır aşılmıştır.
    D: Kapsama girmez; çünkü önceki dört hesap döneminin ortalama hasılatı sınırın altındadır.
    E: Kapsama girmez; çünkü 2022 hesap dönemi, 2026 için dikkate alınacak dönemlerin dışında kalır.
  dogru: C
  aciklama:
    dogru_neden: Ek 1. maddeye göre nihai ana işletmenin konsolide hasılatı, gelirin raporlandığı hesap döneminden önceki
      dört hesap döneminin en az ikisinde 750 milyon avro karşılığı Türk lirasını geçen grupların bağlı işletmeleri vergiye
      tabidir. 2026 için dikkate alınacak dönemler 2022–2025'tir; sınır 2022 (760) ve 2025 (770) dönemlerinde aşıldığından
      grup kapsama girer. Cari dönem (2026) hasılatı bu hesaplamaya dahil edilmez.
    celdiriciler:
      A: Tebliğe göre gelirin raporlandığı cari dönemin hasılatı hesaplamaya dahil edilmez; düşük olması sonucu değiştirmez.
      B: Kanun ardışıklık aramaz; önceki dört dönemin herhangi ikisinde sınırın aşılması yeterlidir.
      D: Ölçüt ortalama hasılat değil, önceki dört dönemin en az ikisinde sınırın aşılmasıdır.
      E: 2026'dan önceki dört hesap dönemi 2022, 2023, 2024 ve 2025'tir; 2022 bu dönemler içindedir.
  kaynaklar:
