  kok: 'Hesap dönemi takvim yılı olan ve uzun süredir faaliyette bulunan (F) AŞ''nin 2026 yılı bilgileri şöyledir:


    - Ticari bilanço kârı: 10.000.000 TL

    - Kanunen kabul edilmeyen giderler: 500.000 TL

    - Tam mükellef kurumlardan alınan kâr payları (5/1-a): 1.500.000 TL

    - İki tam yıldan fazla aktifte bulunan iştirak hisselerinin satış kazancı: 2.000.000 TL (5/1-(e) şartları sağlanmış olup
    %75 istisna uygulanacaktır)

    - Beyannamede indirilecek geçmiş yıl zararı: 4.000.000 TL

    - Kurumlar vergisi matrahının 2.000.000 TL''si münhasıran ihracattan elde edilen ve KVK 32/7 uyarınca 5 puan indirimli
    orana tabi kazançtır.


    Genel kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Buna göre (F) AŞ''nin 2026 yılı için
    hesaplanan kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '650.000'
    B: '750.000'
    C: '775.000'
    D: '800.000'
    E: '900.000'
  dogru: D
  aciklama:
    dogru_neden: 'Genel hesap: kurum kazancı 10.500.000; matrah = 10.500.000 − 1.500.000 − 1.500.000 (2.000.000 × %75) − 4.000.000
      = 3.500.000 TL. Vergi = 2.000.000 × %20 + 1.500.000 × %25 = 400.000 + 375.000 = 775.000 TL. Asgari hesap: yalnız 5/1-(a)
      istisnası düşülür; 5/1-(e) istisnası ve geçmiş yıl zararı düşülmez: 9.000.000 × %10 = 900.000 TL. 32/C-3 uyarınca ihracat
      indirimi nedeniyle alınmayan vergi (2.000.000 × %5 = 100.000 TL) indirilir: 800.000 TL. 800.000 > 775.000 olduğundan
      hesaplanan kurumlar vergisi 800.000 TL''dir. Püf noktaları: Asgari matrahta iştirak kazancı düşülür ama iştirak hissesi
      satış istisnası ve zarar düşülmez; ihracat indirimi nedeniyle alınmayan vergi ise asgari vergiden ayrıca indirilir.'
    celdiriciler:
      A: 5/1-(e) istisnası da asgari matrahtan düşülmüştür (7.500.000 × %10 − 100.000); bu istisna 32/C-2'de sayılmamıştır.
      B: 5/1-(e) istisnası düşülmüş ve ihracat nedeniyle alınmayan vergi indirilmemiştir; iki hata birlikte yapılmıştır.
      C: Yalnız genel hesap yapılmış, asgari vergi karşılaştırması ihmal edilmiştir.
      E: İhracat indirimi nedeniyle alınmayan 100.000 TL vergi, 32/C-3 uyarınca asgari vergiden indirilmelidir.
    hesap_adimlari:
    - Kurum kazancı = 10.500.000 TL
    - KV matrahı = 10.500.000 − 1.500.000 − 1.500.000 − 4.000.000 = 3.500.000 TL
    - KV = 2.000.000 × %20 + 1.500.000 × %25 = 775.000 TL
    - Asgari = (10.500.000 − 1.500.000) × %10 = 900.000 − 100.000 = 800.000 TL
    - Hesaplanan KV = 800.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-2-(a)
    alinti: '(2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna
      ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları
      taşınmazlardan elde edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar,'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-3
    alinti: (3) Birinci fıkra kapsamında hesaplanan yurt içi asgari kurumlar vergisinden, 32 nci maddenin altıncı, yedinci
      ve sekizinci fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan vergi ile bu maddenin yürürlüğe girdiği
      tarihten önce Sanayi ve Teknoloji Bakanlığından alınmış olan teşvik belgelerindeki yatırıma katkı tutarlarının kullanılması
      nedeniyle 32/A maddesi hükmüne istinaden ilgili hesap döneminde alınmayan vergi indirilir ve ödenmesi gereken yurt içi
      asgari kurumlar vergisi belirlenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/7
    alinti: (7) (Ek:19/1/2022-7351/15 md.) İhracat yapan kurumların münhasıran ihracattan elde ettikleri kazançlarına kurumlar
      vergisi oranı 5 puan indirimli uygulanır.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kk = 10000000 + 500000

      matrah = kk - 1500000 - 2000000*75//100 - 4000000

      kv = 2000000*20//100 + (matrah - 2000000)*25//100

      asg = (kk - 1500000)*10//100 - 2000000*5//100

      sonuc = max(kv, asg)'
