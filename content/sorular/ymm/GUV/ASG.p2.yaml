- id: YMM-GUV-ASG-0013
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yerel ve küresel asgari tamamlayıcı vergi
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik nihai ana işletmesi küresel asgari tamamlayıcı kurumlar vergisi (küresel ATV) mükellefi olan
    (Ö) çok uluslu işletme grubunun (X) ülkesindeki bağlı işletmelerine ait 2026 hesap dönemi (takvim yılı) verileri şöyledir
    (avro):


    - (X1) bağlı işletmesinin işletme bazlı kazancı: 12.680.000

    - (X2) bağlı işletmesinin işletme bazlı zararı: 1.000.000

    - Ülkedeki bağlı işletmelerin düzeltilmiş kapsanan vergileri toplamı: 934.400

    - Bağlı işletmelerin çalışanlarının yıllık toplam brüt ücretleri: 10.000.000

    - Bağlı işletmelerin maddi duran varlıklarının net defter değeri: 10.000.000

    - (X) ülkesinde 2026 dönemi için hesaplanan nitelikli yerel asgari tamamlayıcı kurumlar vergisi: 300.000


    Grup, reel ekonomik faaliyete dayalı (REF) kazanç indirimini uygulamaktadır. KVK geçici 17. maddesine göre bu indirimde
    2024 hesap dönemi için brüt ücretlerin %9,8''i, maddi duran varlıkların net defter değerinin %7,8''i dikkate alınmakta,
    bu oranlar sonraki dönemlerde maddede belirtilen şekilde azaltılmaktadır. De Minimis ve geçiş dönemi güvenli liman koşulları
    sağlanmamaktadır; ek cari dönem vergisi yoktur. Buna göre (X) ülkesi için 2026 hesap döneminde hesaplanacak küresel ATV
    kaç avrodur?'
  secenekler:
    A: '394.400'
    B: '400.000'
    C: '447.600'
    D: '500.000'
    E: '700.000'
  dogru: B
  aciklama:
    dogru_neden: 'Net ülkesel bazlı kazanç = 12.680.000 − 1.000.000 = 11.680.000. Vergi yükü = 934.400 / 11.680.000 = %8;
      küresel ATV oranı = %15 − %8 = %7. Geçici 17/1-(a) uyarınca 2024 oranları izleyen dört dönem boyunca her yıl 0,2 puan
      azalır; 2026 için brüt ücretlerde %9,4, maddi duran varlıklarda %7,4 uygulanır. REF indirimi = 10.000.000 × %9,4 + 10.000.000
      × %7,4 = 940.000 + 740.000 = 1.680.000. Matrah = 11.680.000 − 1.680.000 = 10.000.000; vergi = 10.000.000 × %7 = 700.000.
      Nitelikli yerel ATV indirilir (ek 6/4): 700.000 − 300.000 = 400.000 avro. Püf noktaları: Oran, %15 ile vergi yükü arasındaki
      farktır; REF oranlarında 2026 için iki yıllık azaltma uygulanır ve nitelikli yerel ATV hesaplanan küresel ATV''den düşülür.'
    celdiriciler:
      A: 2024 oranları (%9,8 ve %7,8) azaltılmadan uygulanmıştır; 2026 için %9,4 ve %7,4 kullanılmalıdır.
      C: Ek 6/3'teki kalıcı %5 oranları kullanılmıştır; 2026 hesap döneminde geçici 17. madde oranları geçerlidir.
      D: Vergi yükü (%8) küresel ATV oranı gibi uygulanmıştır; oran %15 ile vergi yükü arasındaki farktır (%7).
      E: Nitelikli yerel ATV (300.000) küresel ATV'den indirilmemiştir.
    hesap_adimlari:
    - Net ülkesel bazlı kazanç = 11.680.000 avro
    - Vergi yükü = 934.400 / 11.680.000 = %8 → ATV oranı %7
    - '2026 REF oranları: ücret %9,4, MDV %7,4 → REF = 1.680.000 avro'
    - Matrah = 10.000.000; vergi = 700.000 avro
    - 'Nitelikli yerel ATV mahsubu: 700.000 − 300.000 = 400.000 avro'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 6/1-2
    alinti: EK MADDE 6- (Ek:28/7/2024-7524/42 md.) (1) Asgari kurumlar vergisi oranı %15’tir. (2) Asgari kurumlar vergisi
      oranı ile ek 5 inci maddenin onbirinci fıkrasına göre tespit edilen oran arasındaki fark, küresel asgari tamamlayıcı
      kurumlar vergisi oranıdır. Ülkesel bazlı vergi yükünün asgari kurumlar vergisi oranını aşması halinde ise küresel asgari
      tamamlayıcı kurumlar vergisi hesaplanmaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 6/4
    alinti: (4) Bir ülke için küresel asgari tamamlayıcı kurumlar vergisi, küresel asgari tamamlayıcı kurumlar vergisi oranının,
      küresel asgari tamamlayıcı kurumlar vergisi matrahına uygulanması suretiyle tespit edilir. Şu kadar ki, ilgili ülkeye
      ilişkin hesaplanan küresel asgari tamamlayıcı kurumlar vergisine varsa; ek cari dönem asgari tamamlayıcı kurumlar vergisi
      ilave edilir, nitelikli yerel asgari tamamlayıcı kurumlar vergisi ise bu vergiden indirilir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 17/1-(a)
    alinti: a) Ek 6 ncı maddenin üçüncü fıkrasının uygulamasında, 2024 hesap dönemi için maddi duran varlıkların net defter
      değerinin %7,8’i, bağlı işletmelerin çalışanlarının brüt ücretlerinin %9,8’i dikkate alınır. Bu oranlar; takip eden
      dört hesap dönemi boyunca %0,2, 2029 hesap döneminden itibaren dört hesap dönemi boyunca da her hesap dönemi için bağlı
      işletmelerinin çalışanlarının brüt ücretleri için %0,8, maddi duran varlıklar için ise %0,4 azaltılarak uygulanır.
  - mevzuat: Yerel ve Küresel Asgari Tamamlayıcı Kurumlar Vergisi Uygulama Genel Tebliği
    madde: bölüm 12.1
    alinti: Örneğin, bir çok uluslu işletme grubunun 1/1/2026 tarihinde başlayan hesap döneminde ilk kez ATV’ye tabi olması
      durumunda, ilgili hesap dönemi için REF kazanç indirimi tutarının hesaplanmasında, çalışanların brüt ücret giderlerinin
      %9,4’ü dikkate alınır.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'net = 12680000 - 1000000

      yuk = 934400 / net

      oran = 0.15 - yuk

      ref = 10000000 * 0.094 + 10000000 * 0.074

      sonuc = round((net - ref) * oran - 300000)'
