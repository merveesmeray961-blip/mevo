- id: YMM-GUV-ASG-0014
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: uygulama kapsamı ve istisnalar
  tip: bilgi
  zorluk: 3
  kok: '5520 sayılı Kanun''un Beşinci Kısmında düzenlenen yerel ve küresel asgari tamamlayıcı kurumlar vergisine (ATV) ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. 2024 hesap dönemi ve ilk kez beyanname verilecek dönem dışında küresel ATV, hesap döneminin kapandığı ayı izleyen on
    beşinci ayın son gününe kadar beyan edilir ve ödenir.

    II. Yerel ATV, hesap döneminin kapandığı ayı izleyen on sekizinci ayın son gününe kadar beyan edilir ve ödenir.

    III. Bağlı işletmelerin uluslararası deniz taşımacılığıyla bağlantılı belirli faaliyetlerden elde ettikleri kazançlar,
    bu kazançlar toplamının uluslararası deniz taşımacılığı kazançları toplamının %50''sini geçmemesi şartıyla ayrıca istisnadır.

    IV. Kâr amacı gütmeyen kuruluşlar gibi muaf işletmelerin hasılatları, 750 milyon avroluk konsolide hasılat sınırının hesabında
    dikkate alınmaz.

    V. Muafiyetten vazgeçme, küresel ATV bilgi beyannamesini veren bağlı işletmenin talebiyle yapılabilir ve bu durumda en
    az beş hesap dönemi boyunca muafiyetten vazgeçilmiş sayılır.'
  secenekler:
    A: I ve III
    B: II ve IV
    C: II, III ve IV
    D: I, III ve V
    E: I, II, III ve V
  dogru: D
  aciklama:
    dogru_neden: 'Ek 8/4''e göre küresel ATV hesap döneminin kapandığı ayı izleyen on beşinci ayın son gününe kadar beyan
      edilip ödenir; geçici 17/1-(b) ile 2024 dönemi ve ilk kez beyanname verecekler için bu süre on sekizinci aydır (I doğru).
      Ek 3/7''deki bağlantılı faaliyet istisnası %50 sınırına bağlıdır (III doğru). Ek 3/4''e göre muafiyetten vazgeçme bilgi
      beyannamesini veren bağlı işletmenin talebiyle yapılabilir ve en az beş hesap dönemi geçerlidir (V doğru). Yerel ATV
      ise hesap döneminin kapandığı ayı izleyen on ikinci ayda beyan edilip ödenir (II yanlış). Ek 3/3''e göre muaf olanların
      hasılatları konsolide hasılatın hesabında dikkate alınır (IV yanlış). Püf noktaları: Yerel ATV için 12, küresel ATV
      için 15, geçiş döneminde 18 ay; muafiyet vergiden kurtarır ama hasılat sınırının hesabından çıkarmaz.'
    celdiriciler:
      A: V de doğrudur; ek 3/4 uyarınca vazgeçme en az beş hesap dönemi için geçerlidir.
      B: 'II ve IV yanlıştır: yerel ATV on ikinci ayda beyan edilir; muafların hasılatı sınır hesabına dahildir.'
      C: II ve IV yanlıştır; doğru olan I ve V bu seçenekte yer almamaktadır.
      E: II yanlıştır; on sekiz aylık süre yerel ATV'ye değil, geçiş döneminde küresel ATV beyanına ilişkindir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 8/4
    alinti: (4) Hesaplanan vergi, hesap döneminin kapandığı ayı izleyen on beşinci ayın son gününe kadar beyan edilir ve ödenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 10/3
    alinti: (3) Hesaplanan vergi, hesap döneminin kapandığı ayı izleyen on ikinci ayın birinci gününden son gününe kadar beyan
      edilir ve ödenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 3/3
    alinti: (3) Birinci ve ikinci fıkra kapsamında yerel ve küresel asgari tamamlayıcı kurumlar vergisinden muaf olanların
      hasılatları, ek 1 inci madde kapsamındaki yıllık konsolide hasılatın hesabında dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 3/4
    alinti: (4) Yerel ve küresel asgari tamamlayıcı kurumlar vergisinden muaf olanlar diledikleri takdirde bu madde kapsamındaki
      muafiyet hükümlerinden vazgeçebilirler. Şu kadar ki, isteğe bağlı muafiyet hükümlerinden küresel asgari tamamlayıcı
      kurumlar vergisi bilgi beyannamesini veren bağlı işletmelerin talebiyle vazgeçilebilir ve bu durumda en az beş hesap
      dönemi boyunca muafiyetten vazgeçilmiş sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: ek md. 3/7
    alinti: '(7) Bir ülkede bulunan bağlı işletmelerin uluslararası deniz taşımacılığı faaliyetiyle bağlantılı olarak gerçekleştirdiği
      aşağıdaki faaliyetlerden elde ettikleri kazançlar da bu kazançlar toplamının, bu bağlı işletmelerin uluslararası deniz
      taşımacılığından elde ettikleri kazançların toplamının %50’sini geçmemesi şartıyla, yerel ve küresel asgari tamamlayıcı
      kurumlar vergisinden ayrıca istisnadır:'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
