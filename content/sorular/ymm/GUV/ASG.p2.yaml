      ve 2028 dönemlerinde asgari vergi uygulanmaz; ilk uygulama 2029 hesap dönemidir.'
    celdiriciler:
      A: İlk defa faaliyete başlayan kurumlar için üç hesap dönemi boyunca asgari vergi uygulanmaz.
      B: Muafiyet yalnız faaliyete başlanılan dönemle sınırlı değildir; üç hesap dönemini kapsar.
      C: Üç dönemlik süre faaliyete başlanılan 2026 dönemi dahil sayılır; 2028 de muafiyet kapsamındadır.
      E: Süre faaliyete başlanılan hesap döneminden itibaren işler; izleyen yıldan başlatılamaz.
