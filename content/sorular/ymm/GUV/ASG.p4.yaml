- id: YMM-GUV-ASG-0015
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yurt içi asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 2
  kok: Hesap dönemi takvim yılı olan ve 2012'den beri faaliyette bulunan (Z) A.Ş.'nin 2026 yılı ticari bilanço zararı 2.000.000
    TL, kanunen kabul edilmeyen giderleri 3.000.000 TL'dir. Şirketin beyannamede indirebileceği 1.000.000 TL geçmiş yıl zararı
    vardır; başka indirim, istisna veya indirimli oran uygulaması yoktur. Kurumlar vergisi oranı %25, yurt içi asgari kurumlar
    vergisi oranı %10'dur. Buna göre (Z) A.Ş.'nin 2026 yılı için hesaplanan kurumlar vergisi kaç TL'dir?
  secenekler:
    A: '0'
    B: '100.000'
    C: '250.000'
    D: '300.000'
    E: '500.000'
  dogru: B
  aciklama:
    dogru_neden: 'Kurumlar vergisi matrahı: −2.000.000 + 3.000.000 − 1.000.000 = 0; beyana göre vergi 0''dır. İndirim ve istisnalar
      düşülmeden önceki kurum kazancı ticari bilanço kârı veya zararına KKEG eklenerek bulunur ve sonuç sıfırdan büyükse asgari
      vergi hesaplanır: −2.000.000 + 3.000.000 = 1.000.000; geçmiş yıl zararı bu tutardan düşülmez. Asgari vergi 1.000.000
      × %10 = 100.000 TL olup hesaplanan vergiden yüksek olduğundan hesaplanan kurumlar vergisi 100.000 TL''dir.'
    celdiriciler:
      A: Ticari bilanço zararı bulunsa da zarar ile KKEG toplamı sıfırdan büyük olduğundan asgari vergi hesaplanır.
      C: Geçmiş yıl zararı düşülmeden %25 oranı uygulanmıştır.
      D: Ticari bilanço zararı dikkate alınmadan yalnız KKEG'ye %10 uygulanmıştır.
      E: Ticari bilanço zararı işaret hatasıyla KKEG'ye eklenmiştir (5.000.000 × %10).
    hesap_adimlari:
    - KV matrahı = −2.000.000 + 3.000.000 − 1.000.000 = 0 → KV 0
    - Asgari matrah = −2.000.000 + 3.000.000 = 1.000.000 (GYZ düşülmez)
    - Asgari vergi = 100.000 > 0 → hesaplanan KV = 100.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/1
    alinti: indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz.
  - mevzuat: Kurumlar Vergisi Genel Tebliği (Seri No 1) — Seri No 23 değişikliği
    madde: bölüm 32.5.4
    alinti: sıfırdan büyük olduğu durumlarda asgari kurumlar vergisi hesaplaması yapılacaktır.
  - mevzuat: Kurumlar Vergisi Genel Tebliği (Seri No 1) — Seri No 23 değişikliği
    madde: bölüm 32.5.4
    alinti: Beyannamelerde indirim konusu yapılan geçmiş yıl zararları asgari kurumlar vergisi
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kv = max(-2000000 + 3000000 - 1000000, 0) * 25 / 100

      asgari = max(-2000000 + 3000000, 0) * 10 / 100

      sonuc = max(kv, asgari)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S4
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_S4.yaml, satır 63
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-GUV-ASG-0016
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yurt içi asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan ve uzun süredir faaliyette bulunan (H) A.Ş.''nin 2026 yılı bilgileri şöyledir:


    - Ticari bilanço kârı: 6.000.000 TL (kanunen kabul edilmeyen gider yoktur)

    - Kâra dahil, KVK md. 5/1-h kapsamında istisna edilen yurt dışı inşaat kazancı: 2.000.000 TL (bu kazanç için yurt dışında
    100.000 TL kurumlar vergisi ödenmiştir)

    - Kâra dahil, KVK md. 5/1-b kapsamında istisna edilen yurt dışı iştirak kazancı: 1.000.000 TL (kazancın yurt dışında taşıdığı
    vergi yükü %15''tir)

    - Kâra dahil, tam mükellef bir kurumdan alınan iştirak kazancı (md. 5/1-a): 500.000 TL

    - Beyannamede indirilecek geçmiş yıl zararı: 2.000.000 TL


    Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur; indirimli oran uygulaması yoktur. Kurumlar
    Vergisi Genel Tebliği''ndeki açıklamalara göre (H) A.Ş.''nin 2026 yılı için hesaplanan kurumlar vergisi kaç TL''dir?

    '
  secenekler:
    A: '125.000'
    B: '250.000'
    C: '350.000'
    D: '450.000'
    E: '550.000'
  dogru: C
  aciklama:
    dogru_neden: 'KV matrahı: 6.000.000 − 2.000.000 − 1.000.000 − 500.000 − 2.000.000 = 500.000; KV 125.000 TL. Asgari matrahtan
      md. 5/1-a kazancı düşülür. Yurt dışı kaynaklı istisnalardan en az %10 vergi yükü taşıyan yurt dışı iştirak kazancının
      tamamı (1.000.000), %10''dan az yük taşıyan inşaat kazancının ise taşıdığı vergi yüküne isabet eden kısmı (100.000 /
      0,10 = 1.000.000) düşülür. Asgari matrah: 6.000.000 − 500.000 − 1.000.000 − 1.000.000 = 3.500.000; asgari vergi 350.000
      TL > 125.000 TL olduğundan hesaplanan kurumlar vergisi 350.000 TL''dir. Püf noktaları: Geçmiş yıl zararı asgari matrahtan
      düşülmez; düşük vergili yurt dışı kazançta düşülecek kısım ödenen verginin %10''a bölünmesiyle bulunur.'
    celdiriciler:
      A: Asgari vergi karşılaştırması yapılmamıştır.
      B: Yurt dışı inşaat kazancının tamamı asgari matrahtan düşülmüştür (2.500.000 × %10); %10'dan az yük taşıyan kazancın
        yalnız isabet eden kısmı düşülür.
      D: Yurt dışı inşaat kazancının hiçbir kısmı düşülmemiştir (4.500.000 × %10).
      E: Yurt dışı kaynaklı istisnaların hiçbiri düşülmemiştir (5.500.000 × %10).
    hesap_adimlari:
    - KV = (6.000.000 − 2.000.000 − 1.000.000 − 500.000 − 2.000.000) × 0,25 = 125.000
    - İnşaat kazancında düşülecek = 100.000 / 0,10 = 1.000.000
    - Asgari matrah = 6.000.000 − 500.000 − 1.000.000 − 1.000.000 = 3.500.000
    - Asgari vergi = 350.000 → hesaplanan KV = 350.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-a
    alinti: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları
  - mevzuat: Kurumlar Vergisi Genel Tebliği (Seri No 1) — Seri No 23 değişikliği
    madde: bölüm 32.5.6, Örnek 8
    alinti: istisna kazançların ise, taşıdığı vergi yüküne isabet eden kazanç kısmı asgari vergi matrahından
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kv = (6000000 - 2000000 - 1000000 - 500000 - 2000000) * 25 / 100

      asgari = (6000000 - 500000 - 1000000 - 100000 / 0.10) * 10 / 100

      sonuc = max(kv, asgari)'
