      C: Yüzde (%22,5) doğru bulunmuş, ancak 80 milyon TL yerine 100 milyon TL'ye uygulanmıştır; gelirin dahil edilmesi esası
        kapsamında alınan 20 milyon TL düşülmelidir.
      D: İki oranın %50 ağırlık uygulanmadan toplamı (%25 + %20 = %45) 80 milyon TL'ye uygulanmıştır.
      E: İki oranın ağırlıksız toplamı (%45) 100 milyon TL'ye uygulanmıştır; hem ağırlık hem de düşülecek tutar yanlıştır.
    hesap_adimlari:
