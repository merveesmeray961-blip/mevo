  konu: ASG
  kazanim: yetersiz vergilendirilen ödemeler esası (UTPR) yüzdesi
  tip: hesaplama
  zorluk: 2
  kok: 'Nihai ana işletmesi, nitelikli gelirin dahil edilmesi esasını kısmen uygulayan bir ülkede yerleşik olan (Z) çok uluslu
    işletme grubu için 2026 hesap döneminde hesaplanan toplam küresel asgari tamamlayıcı kurumlar vergisi 100 milyon TL''dir.
    Bu verginin 20 milyon TL''si gelirin dahil edilmesi esası kapsamında nihai ana işletmenin ülkesinde alınmıştır.


    Nitelikli yetersiz vergilendirilen ödemeler esasının uygulandığı tüm ülkelerdeki yerleşik bağlı işletmelerin toplam işçi
    sayısı 1.200, maddi duran varlıklarının toplam değeri 2.500 milyon TL''dir. Bunlardan Türkiye''de yerleşik bağlı işletmelerin
    toplam işçi sayısı 300, maddi duran varlıklarının toplam değeri 500 milyon TL''dir. Yatırım işletmesi ve şeffaf işletme
    bulunmamaktadır.


    Buna göre Türkiye''de yerleşik bağlı işletmelerin yetersiz vergilendirilen ödemeler esası kapsamında ödemekle sorumlu
    olduğu vergi kaç TL''dir?'
  secenekler:
    A: 18.000.000 TL
    B: 20.000.000 TL
    C: 22.500.000 TL
    D: 36.000.000 TL
    E: 45.000.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Ek 7/7 uyarınca gelirin dahil edilmesi esası kapsamında vergi alınmışsa UTPR kapsamında hesaplanan vergi,
      küresel ATV ile bu esas kapsamında alınan verginin farkıdır: 100 − 20 = 80 milyon TL. Ek 7/8 uyarınca UTPR yüzdesi,
      Türkiye''deki işçi sayısı oranının %50''si ile maddi duran varlık değeri oranının %50''sinin toplamıdır: (300 / 1.200)
      × %50 + (500 / 2.500) × %50 = %12,5 + %10 = %22,5. Türkiye''nin payı 80 × %22,5 = 18 milyon TL''dir. Püf noktaları:
      Önce gelirin dahil edilmesi esasıyla alınan vergiyi düşün, sonra yüzdeyi uygula. Yüzde, iki oranın toplamı değil, her
      birinin yarısının toplamıdır.'
    celdiriciler:
