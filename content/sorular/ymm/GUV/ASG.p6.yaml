- id: YMM-GUV-ASG-0023
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yurt içi asgari kurumlar vergisinde düşülebilen indirimler (10/1-i)
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan ve 2018 yılından beri faaliyette bulunan, banka veya finans kuruluşu olmayan (K) A.Ş.''nin
    2026 yılı bilgileri şöyledir:


    - Ticari bilanço kârı: 38.000.000 TL

    - Kanunen kabul edilmeyen giderler: 2.000.000 TL

    - Yurt dışından satın alınan malların Türkiye''ye getirilmeksizin yurt dışında satılmasından sağlanan kazanç: 10.000.000
    TL (ticari bilanço kârına dahildir; KVK md. 10/1-(i) indirimi kazancın %95''i oranında yapılmıştır)

    - KVK md. 5/1-(e) kapsamında beyannamede istisna olarak indirilen tutar: 5.000.000 TL

    - Beyannamede indirilen geçmiş yıl zararı: 14.000.000 TL


    Genel kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Şirketin başka istisna, indirim veya
    indirimli oran uygulaması yoktur. Buna göre (K) A.Ş.''nin 2026 hesap dönemi için hesaplanan kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: 1.150.000 TL
    B: 2.875.000 TL
    C: 3.000.000 TL
    D: 3.050.000 TL
    E: 4.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10''undan az olamaz
      (KVK md. 32/C-1). Kurum kazancı 38.000.000 + 2.000.000 = 40.000.000 TL''dir. Asgari vergi matrahında KVK md. 10/1-(i)
      indirimi (10.000.000 × %95 = 9.500.000 TL) düşülür; 5/1-(e) istisnası ve geçmiş yıl zararı düşülmez. Asgari vergi matrahı
      40.000.000 − 9.500.000 = 30.500.000 TL, asgari vergi 3.050.000 TL''dir. Genel hesapta matrah 40.000.000 − 9.500.000
      − 5.000.000 − 14.000.000 = 11.500.000 TL, vergi 2.875.000 TL''dir. Asgari vergi daha yüksek olduğundan hesaplanan kurumlar
      vergisi 3.050.000 TL olur. Püf noktaları: Asgari vergide hangi istisna ve indirimin düşüleceği tek tek sayılmıştır;
      10/1-(i) ve (j) bentleri düşülebilirken 5/1-(e) ve geçmiş yıl zararı düşülemez. İndirim, kazancın tamamı değil %95''i
      kadardır; genel hesaptaki tutarı ile asgari hesaptaki tutarı karıştırmayın.'
    celdiriciler:
      A: Geçmiş yıl zararı ve 5/1-(e) istisnası ile 10/1-(i) indirimi düşüldükten sonraki genel matrahın (11.500.000 TL) %10'udur;
        asgari vergide geçmiş yıl zararı ve 5/1-(e) istisnası düşülmez.
      B: Genel hesaplanan vergidir (11.500.000 × %25); asgari vergi bundan yüksek olduğundan hesaplanan vergi olarak asgari
        tutar esas alınır.
      C: 10/1-(i) indirimi kazancın %100'ü (10.000.000 TL) alınarak bulunmuştur; indirim oranı %95'tir.
      E: Hiçbir indirim düşülmeden kurum kazancının %10'udur; oysa 10/1-(i) indirimi asgari vergi matrahından düşülür.
    hesap_adimlari:
    - Kurum kazancı = 38.000.000 + 2.000.000 = 40.000.000
    - 10/1-(i) indirimi = 10.000.000 × %95 = 9.500.000
    - Asgari matrah = 40.000.000 − 9.500.000 = 30.500.000; asgari vergi = 3.050.000
    - Genel matrah = 40.000.000 − 9.500.000 − 5.000.000 − 14.000.000 = 11.500.000; vergi = 2.875.000
    - Hesaplanan KV = max(2.875.000; 3.050.000) = 3.050.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-(i)
    alinti: Yurt dışından satın alınan malların Türkiye’ye getirilmeksizin yurt dışında satılmasından veya yurt dışında gerçekleşen
      mal alım satımlarına aracılık edilmesinden sağlanan kazançların %95’i
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.5
    alinti: ç) (Ek:RG-4/7/2026-33300) Kurumların, yurt dışından satın alınan malları Türkiye’ye getirmeksizin yurt dışında
      satmalarından veya yurt dışında gerçekleşen mal alım satımlarına aracılık etmelerinden sağladıkları kazançlarda indirim
      (5520 sayılı Kanun madde 10/1-i),
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.6
    alinti: ç) Taşınmaz, iştirak hisseleri ve fon satış kazancı istisnası (5520 sayılı Kanun madde 5/1-e)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'kk = 38000000 + 2000000

      ind = 10000000*95/100

      genel = (kk - ind - 5000000 - 14000000)*25/100

      asgari = (kk - ind)*10/100

      sonuc = max(genel, asgari)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim GUV_ASG_20261105_1.yaml, satır None
- id: YMM-GUV-ASG-0024
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: yatırıma katkı tutarının asgari vergiden indirilmesi
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan ve uzun süredir faaliyette bulunan (L) A.Ş.''nin 2026 yılı bilgileri şöyledir:


    - Ticari bilanço kârı: 10.000.000 TL

    - Kanunen kabul edilmeyen giderler: 2.000.000 TL

    - Beyannamede indirilen geçmiş yıl zararı: 8.000.000 TL

    - KVK md. 10/1-(c) kapsamında bağış indirimi: 500.000 TL

    - 2025 yılında Sanayi ve Teknoloji Bakanlığından alınan yatırım teşvik belgesi kapsamında, belgeye göre %5 indirimli orana
    tabi kazanç: 3.000.000 TL


    Genel kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Şirketin 2/8/2024 tarihinden önce alınmış
    başka bir teşvik belgesi yoktur. Buna göre (L) A.Ş.''nin 2026 hesap dönemi için hesaplanan kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: 275.000 TL
    B: 600.000 TL
    C: 1.200.000 TL
    D: 1.475.000 TL
    E: 1.800.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Kurum kazancı 10.000.000 + 2.000.000 = 12.000.000 TL''dir. Beyana göre kurumlar vergisi matrahı 12.000.000
      − 8.000.000 − 500.000 = 3.500.000 TL; vergi 3.000.000 × %5 + 500.000 × %25 = 275.000 TL''dir. Asgari vergi matrahında
      geçmiş yıl zararı ve bağış indirimi düşülmediğinden matrah 12.000.000 TL, asgari vergi 1.200.000 TL''dir. Asgari vergiden
      yalnız 32/C maddesinin yürürlüğe girdiği 2/8/2024 tarihinden önce alınmış teşvik belgelerindeki yatırıma katkı tutarının
      kullanılması nedeniyle alınmayan vergi indirilebilir; 2/8/2024 tarihinden sonra (bu tarih dahil) alınan belgeye göre
      alınmayan vergi (3.000.000 × %20 = 600.000 TL) düşülemez. Dolayısıyla asgari vergi 1.200.000 TL kalır ve beyana göre
      hesaplanan 275.000 TL''yi aştığından hesaplanan kurumlar vergisi 1.200.000 TL olur. Püf noktaları: Belgenin alınma tarihine
      bakın; 2/8/2024 öncesi ise alınmayan vergi düşülür, sonrası ise düşülmez. Geçmiş yıl zararı ve bağış indirimi yalnız
      genel hesabı etkiler, asgari matrahı etkilemez.'
    celdiriciler:
      A: Yalnız beyana göre hesaplanan vergidir; asgari vergi karşılaştırması yapılmamıştır.
      B: Asgari vergiden 600.000 TL belge nedeniyle alınmayan vergi düşülmüştür; belge 2/8/2024 sonrasında alındığından bu
        indirim yapılamaz.
      D: Beyana göre hesaplanan vergi ile asgari vergi toplanmıştır; asgari vergi toplamaya değil, karşılaştırmaya konu edilir.
      E: Asgari vergiye belge nedeniyle alınmayan 600.000 TL ayrıca eklenmiştir; böyle bir ekleme yoktur.
    hesap_adimlari:
    - Kurum kazancı = 12.000.000
    - KV matrahı = 12.000.000 − 8.000.000 − 500.000 = 3.500.000
    - Hesaplanan KV = 3.000.000 × %5 + 500.000 × %25 = 275.000
    - Asgari vergi = 12.000.000 × %10 = 1.200.000 (yeni belge nedeniyle alınmayan 600.000 düşülmez)
    - Hesaplanan KV = max(275.000; 1.200.000) = 1.200.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-3
    alinti: (3) Birinci fıkra kapsamında hesaplanan yurt içi asgari kurumlar vergisinden, 32 nci maddenin altıncı, yedinci
      ve sekizinci fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan vergi ile bu maddenin yürürlüğe girdiği
      tarihten önce Sanayi ve Teknoloji Bakanlığından alınmış olan teşvik belgelerindeki yatırıma katkı tutarlarının kullanılması
      nedeniyle 32/A maddesi hükmüne istinaden ilgili hesap döneminde alınmayan vergi indirilir ve ödenmesi gereken yurt içi
      asgari kurumlar vergisi belirlenir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.4
    alinti: 2/8/2024 tarihinden sonra (bu tarih dahil) yeni alınan teşvik belgeleri kapsamında yatırıma katkı tutarlarının
      kullanılması nedeniyle Kurumlar Vergisi Kanununun 32/A maddesi hükmüne istinaden ilgili hesap döneminde alınmayan vergi,
      hesaplanan asgari vergiden düşülemeyecektir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 32.5.4
    alinti: Beyannamelerde indirim konusu yapılan geçmiş yıl zararları asgari kurumlar vergisi matrahından düşülmeyecek ve
      asgari kurumlar vergisinin hesaplanmasında dikkate alınacaktır.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'kk = 10000000 + 2000000

      matrah = kk - 8000000 - 500000

      kv = 3000000*5/100 + (matrah - 3000000)*25/100

      asgari = kk*10/100

      sonuc = max(kv, asgari)'
  durum: taslak
  surum: 1
