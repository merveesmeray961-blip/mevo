- id: YMM-GUV-ASG-0026
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: küresel ATV tutarının hesabı
  tip: hesaplama
  zorluk: 3
  kok: 'Bir çok uluslu işletme grubunun (P) ülkesindeki bağlı işletmelerine ilişkin 2026 hesap dönemi bilgileri şöyledir:


    - Net ülkesel bazlı kazanç: 500 milyon TL

    - Düzeltilmiş kapsanan vergiler: 50 milyon TL

    - Çalışanların yıllık toplam brüt ücretleri: 200 milyon TL

    - Maddi duran varlıkların net defter değeri: 600 milyon TL

    - Bu ülke için hesaplanan ek cari dönem asgari tamamlayıcı kurumlar vergisi: 3 milyon TL

    - Bu ülkede ödenen nitelikli yerel asgari tamamlayıcı kurumlar vergisi: 4 milyon TL


    Asgari kurumlar vergisi oranı %15''tir. (P) ülkesi güvenli liman olarak belirlenmemiştir ve ek 6 ncı maddenin sekizinci
    ve onuncu fıkralarındaki sıfır kabul edilme koşulları gerçekleşmemiştir. Buna göre bu ülke için hesaplanacak küresel asgari
    tamamlayıcı kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: 19.000.000 TL
    B: 22.000.000 TL
    C: 24.000.000 TL
    D: 26.000.000 TL
    E: 27.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Ülkesel bazlı vergi yükü 50 / 500 = %10 olduğundan küresel ATV oranı %15 − %10 = %5''tir (Ek 6/2). Matrah,
      net ülkesel bazlı kazançtan ücretlerin %5''i (10 milyon TL) ile maddi duran varlıkların net defter değerinin %5''inin
      (30 milyon TL) indirilmesiyle 500 − 40 = 460 milyon TL bulunur (Ek 6/3). Vergi 460 × %5 = 23 milyon TL''dir. Ek 6/4
      uyarınca hesaplanan vergiye ek cari dönem ATV (3 milyon TL) ilave edilir, nitelikli yerel ATV (4 milyon TL) ise bu vergiden
      indirilir: 23 + 3 − 4 = 22 milyon TL. Püf noktaları: Yerel ATV vergiden indirilir, ek cari dönem ATV ise vergiye eklenir;
      işaretleri karıştırmayın. Ücret ve maddi duran varlık indirimi matrahtan yapılır, vergiden değil.'
    celdiriciler:
      A: Ek cari dönem ATV hesaba katılmamış, yalnız nitelikli yerel ATV indirilmiştir (23 − 4).
      C: Ücret ve maddi duran varlık indirimi yapılmamıştır (500 × %5 = 25; 25 + 3 − 4).
      D: Nitelikli yerel ATV vergiden indirilmemiştir (23 + 3); Ek 6/4 bunun indirilmesini öngörür.
      E: Nitelikli yerel ATV vergiye eklenmiştir (23 + 4); bu vergi indirim kalemidir, ek cari dönem ATV ise ayrıca eklenir.
    hesap_adimlari:
    - Vergi yükü = 50 / 500 = %10; oran = %15 − %10 = %5
    - Matrah = 500 − (200 × %5 + 600 × %5) = 460
    - Vergi = 460 × %5 = 23
    - 'Ek 6/4: 23 + 3 (ek cari dönem) − 4 (nitelikli yerel ATV) = 22 milyon TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Ek md. 6/2
    alinti: (2) Asgari kurumlar vergisi oranı ile ek 5 inci maddenin onbirinci fıkrasına göre tespit edilen oran arasındaki
      fark, küresel asgari tamamlayıcı kurumlar vergisi oranıdır. Ülkesel bazlı vergi yükünün asgari kurumlar vergisi oranını
      aşması halinde ise küresel asgari tamamlayıcı kurumlar vergisi hesaplanmaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
