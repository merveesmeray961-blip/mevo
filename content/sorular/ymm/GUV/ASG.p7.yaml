- id: YMM-GUV-ASG-0031
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: ülkesel bazlı de minimis istisnası
  tip: uygulama
  zorluk: 3
  kok: 'Çok uluslu işletme gruplarının ülkelerdeki bağlı işletmelerine ilişkin, raporlama dönemi (2026) ve önceki iki hesap
    dönemi verileri aşağıda (milyon avro karşılığı TL olarak) verilmiştir. Bu ülkelerde yatırım işletmesi veya devletsiz bağlı
    işletme bulunmamaktadır.


    | Ülke | Hasılat (2024 / 2025 / 2026) | Kazanç (2024 / 2025 / 2026) |

    |---|---|---|

    | (K) | 6 / 9 / 12 | 1,2 / 0,9 / 0,6 |

    | (L) | 8 / 12 / 16 | 0,3 / 0,3 / 0,3 |

    | (M) | 7 / 8 / 9 | 1,5 / 1,2 / 1,5 |

    | (N) | 14 / 11 / 5 | 0,9 / 0,6 / 0,3 |

    | (O) | 3 / 4 / 5 | 2,4 / 0,3 / 0,3 |


    Küresel ATV''nin, 2026 hesap dönemi için sıfır kabul edilebilmesi (Ek 6/8) bakımından hangi ülke şartları sağlamaktadır?'
  secenekler:
    A: (K)
    B: (L)
    C: (M)
    D: (N)
    E: (O)
  dogru: A
  aciklama:
    dogru_neden: 'Ek 6/8''e göre ülkesel bazlı yıllık ortalama hasılat 10 milyon avro karşılığı TL''den ve ortalama kazanç
      1 milyon avro karşılığı TL''den az ise vergi sıfır kabul edilebilir; ortalamalar raporlama dönemi ile önceki iki dönemin
      ortalamasıdır. (K): hasılat (6+9+12)/3 = 9; kazanç (1,2+0,9+0,6)/3 = 0,9 → şartlar sağlanır. Diğerlerinde en az bir
      ortalama sınırı karşılamaz. Püf noktaları: tek yılın verisine değil, raporlama dönemi dahil üç dönemin ortalamasına
      bakın; ''az olma'' şartı sınır değerin kendisini kapsamaz (N ve O ülkeleri).'
    celdiriciler:
      B: Ortalama hasılat 12 milyon avro karşılığı TL olup sınırı aşar; kazanç şartı sağlansa da hasılat şartı sağlanmaz.
      C: Ortalama hasılat (8) sınırın altındadır ancak ortalama kazanç 1,4 milyon avro karşılığı TL olup 1 milyon sınırının
        altında değildir.
      D: Yalnızca 2026 verisine bakılırsa şartlar sağlanır gibi görünür; oysa ortalama hasılat 10 milyon avro karşılığı TL'dir
        ve 'az olma' şartı sağlanmaz.
      E: Ortalama hasılat (4) sınırın altındadır; ancak ortalama kazanç tam 1,0 milyon avro karşılığı TL'dir ve 'az olma'
        şartı sağlanmaz.
    hesap_adimlari:
    - '(K): hasılat (6+9+12)/3 = 9; kazanç (1,2+0,9+0,6)/3 = 0,9 → şartlar sağlanır'
    - '(L): hasılat 12 ≥ 10; (M): kazanç 1,4 ≥ 1; (N): hasılat 10 ≥ 10; (O): kazanç 1,0 ≥ 1'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Ek md. 6/8
    alinti: (8) Çok uluslu işletme grubunun; ülkesel bazlı yıllık ortalama hasılatı 10 milyon avro karşılığı Türk lirasından
      ve ülkesel bazlı yıllık ortalama kazancı 1 milyon avro karşılığı Türk lirasından az ise bu ülkede bulunan bağlı işletmelerin
      küresel asgari tamamlayıcı kurumlar vergisi, ilgili hesap dönemi için sıfır olarak kabul edilebilir.
  gecerlilik:
    baslangic: '2024-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'v={''K'':([6,9,12],[1.2,0.9,0.6]),''L'':([8,12,16],[0.3,0.3,0.3]),''M'':([7,8,9],[1.5,1.2,1.5]),''N'':([14,11,5],[0.9,0.6,0.3]),''O'':([3,4,5],[2.4,0.3,0.3])}

      sonuc=[k for k,(h,c) in v.items() if sum(h)/3<10 and round(sum(c)/3,6)<1]'
