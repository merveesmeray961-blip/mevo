      D: Pay, (A)'nın (B)'ye oranı olan 45/75 = %60 üzerinden bulunmuştur; payda ülkesel bazlı kazanç toplamı olmalıdır.
      E: Ülke vergisinin tamamı (A) A.Ş.'ye yüklenmiştir; oysa vergi ülkedeki bağlı işletmeler arasında paylaştırılır.
    hesap_adimlari:
    - Ülkesel bazlı kazanç = 45.000.000 + 75.000.000 + 30.000.000 = 150.000.000 TL
    - Oran = 45.000.000 / 150.000.000 = %30
    - Vergi = 4.800.000 × %30 = 1.440.000 TL
  kaynaklar:
