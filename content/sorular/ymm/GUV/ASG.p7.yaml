  tip: uygulama
  zorluk: 3
  kok: Hesap dönemi 1/1/2026–31/12/2026 olan bir çok uluslu işletme grubunun Türkiye'de yerleşik bağlı işletmesi (T) A.Ş.,
    2026 hesap dönemine ilişkin küresel asgari tamamlayıcı kurumlar vergisini ve yerel asgari tamamlayıcı kurumlar vergisini
    beyan edip ödeyeceği süreleri belirlemek istemektedir. (T) A.Ş. için bu sürelere ilişkin aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Küresel ATV 30/4/2027 tarihine kadar, yerel ATV 1/4/2027–30/4/2027 arasında beyan edilir ve ödenir.
    B: Küresel ATV 31/12/2027 tarihine kadar, yerel ATV 31/3/2028 tarihine kadar beyan edilir ve ödenir.
    C: Küresel ATV 31/3/2028 tarihine kadar, yerel ATV ise 1/12/2027–31/12/2027 tarihleri arasında beyan edilir ve ödenir.
    D: Küresel ATV ve yerel ATV için süre 31/12/2027 tarihinde sona erer; ikisinde de hesap döneminin kapandığı ayı izleyen
      on ikinci ay esas alınır.
    E: Küresel ATV ve yerel ATV için süre 31/3/2028 tarihinde sona erer; ikisinde de on beşinci ay esas alınır.
  dogru: C
  aciklama:
    dogru_neden: 'Küresel ATV, hesap döneminin kapandığı ayı izleyen on beşinci ayın son gününe kadar beyan edilir ve ödenir
      (Ek md. 8/4). Hesap dönemi Aralık 2026''da kapandığından süre 31/3/2028''de sona erer. Yerel ATV ise hesap döneminin
      kapandığı ayı izleyen on ikinci ayın birinci gününden son gününe kadar beyan edilir ve ödenir (Ek md. 10/3); bu aralık
      1/12/2027–31/12/2027''dir. Püf noktaları: küresel ATV''de tek bir son gün ve 15 ay, yerel ATV''de ise bir tarih aralığı
      ve 12 ay vardır; ikisini birbirine karıştırmayın.'
    celdiriciler:
      A: Bu süreler kurumlar vergisi beyannamesinin verilme zamanına aittir; ATV beyanı için Ek 8 ve Ek 10'da kurumlar vergisinden
        ayrı, daha uzun süreler öngörülmüştür.
      B: 'Süreler ters yazılmıştır: küresel ATV''nin süresi on beşinci ayın sonuna kadar olup yerel ATV için on ikinci ay
        öngörülmüştür.'
      D: Küresel ATV için on iki değil on beş ay esas alınır; yerel ATV'de ise bir son gün değil, on ikinci ayın birinci gününden
        son gününe kadar uzanan bir aralık söz konusudur.
      E: Yerel ATV için on beşinci ay değil, hesap döneminin kapandığı ayı izleyen on ikinci ay esas alınır.
