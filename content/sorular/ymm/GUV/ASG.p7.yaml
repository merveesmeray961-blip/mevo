- id: YMM-GUV-ASG-0029
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: küresel ATV matrahı ve ülke vergisi hesabı
  tip: hesaplama
  zorluk: 3
  kok: 'Çok uluslu işletme grubunun (X) ülkesindeki bağlı işletmelerine ilişkin 2026 hesap dönemi bilgileri şöyledir:


    - Net ülkesel bazlı kazanç toplamı: 100.000.000 TL

    - Bağlı işletmelerin çalışanlarının yıllık toplam brüt ücretleri: 40.000.000 TL

    - Bağlı işletmelerin maddi duran varlıklarının net defter değeri: 60.000.000 TL

    - Ülkesel bazlı vergi yükü: %9

    - Geçmiş hesap dönemlerine ilişkin ek cari dönem asgari tamamlayıcı kurumlar vergisi: 300.000 TL

    - Ödenmiş nitelikli yerel asgari tamamlayıcı kurumlar vergisi: 1.000.000 TL


    5520 sayılı Kanun''un Ek 6. maddesine göre (X) ülkesi için hesaplanacak küresel asgari tamamlayıcı kurumlar vergisi kaç
    TL''dir?'
  secenekler:
    A: 4.700.000 TL
    B: 5.000.000 TL
    C: 5.300.000 TL
    D: 5.700.000 TL
    E: 6.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Matrah = 100.000.000 − (%5 × 40.000.000) − (%5 × 60.000.000) = 95.000.000 TL (Ek 6/3). Küresel ATV oranı
      = %15 − %9 = %6 (Ek 6/1-2). Vergi = 95.000.000 × %6 = 5.700.000 TL; buna ek cari dönem vergi eklenir, nitelikli yerel
      ATV indirilir (Ek 6/4): 5.700.000 + 300.000 − 1.000.000 = 5.000.000 TL. Püf noktaları: çalışan ücreti ve maddi duran
      varlık indirimleri matrahtan düşülür; ek cari dönem vergi eklenir, yerel ATV ise vergiden indirilir.'
    celdiriciler:
      A: Matrah doğru bulunmuş, ek cari dönem vergi eklenmemiştir; Ek 6/4 uyarınca hesaplanan vergiye varsa ek cari dönem
        vergi ilave edilir.
      C: Çalışan ücreti ve maddi duran varlık indirimleri (%5'er) dikkate alınmamış, matrah 100.000.000 TL kabul edilmiştir;
        oysa Ek 6/3 bu iki indirimi öngörür.
      D: Yalnızca %6 oran 95.000.000 TL matraha uygulanmış; ek cari dönem vergi eklenmemiş ve nitelikli yerel ATV indirilmemiştir.
      E: Ek cari dönem vergi eklenmiş, ancak ödenen nitelikli yerel ATV vergiden indirilmemiştir; Ek 6/4 bu indirimi açıkça
        öngörür.
    hesap_adimlari:
    - Matrah = 100.000.000 − 2.000.000 − 3.000.000 = 95.000.000 TL
    - Oran = %15 − %9 = %6; vergi = 95.000.000 × %6 = 5.700.000 TL
    - 5.700.000 + 300.000 − 1.000.000 = 5.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Ek md. 6/3
    alinti: (3) Küresel asgari tamamlayıcı kurumlar vergisi, küresel asgari tamamlayıcı kurumlar vergisi matrahı üzerinden
      hesaplanır. Küresel asgari tamamlayıcı kurumlar vergisi matrahı ise net ülkesel bazlı kazanç toplamından; o ülkede bulunan
      bağlı işletmelerin çalışanlarının yıllık toplam brüt ücretlerinin %5’i ile maddi duran varlıklarının net defter değerinin
      %5’inin indirilmesi suretiyle tespit olunur.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Ek md. 6/4
    alinti: Şu kadar ki, ilgili ülkeye ilişkin hesaplanan küresel asgari tamamlayıcı kurumlar vergisine varsa; ek cari dönem
      asgari tamamlayıcı kurumlar vergisi ilave edilir, nitelikli yerel asgari tamamlayıcı kurumlar vergisi ise bu vergiden
      indirilir.
  gecerlilik:
    baslangic: '2024-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'matrah = 100000000 - 0.05*40000000 - 0.05*60000000

      oran = 0.15 - 0.09

      sonuc = round(matrah*oran + 300000 - 1000000)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kabul; hesap doğrulandı (95.000.000 x %6 + 300.000 - 1.000.000 = 5.000.000). Olası
          şablon benzerliği: MEVCUT içinde (P) ülkesi sorusu var, tam metin görülemedi.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_GUV/GUV_ASG_20261111_1.yaml#2
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Kabul; hesap doğrulandı (95.000.000 x %6 + 300.000 - 1.000.000 = 5.000.000). Olası
      şablon benzerliği: MEVCUT içinde (P) ülkesi sorusu var, tam metin görülemedi.'
- id: YMM-GUV-ASG-0030
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Asgari ve küresel asgari kurumlar vergisi
  konu: ASG
  kazanim: bağlı işletme bazında küresel ATV tespiti
  tip: hesaplama
  zorluk: 2
  kok: '(X) ülkesinde bulunan çok uluslu işletme grubunun üç bağlı işletmesinin 2026 işletme bazlı kazançları şöyledir: (A)
    A.Ş. 45.000.000 TL, (B) A.Ş. 75.000.000 TL, (C) A.Ş. 30.000.000 TL. Bu ülke için Ek 6/4 uyarınca hesaplanan küresel asgari
    tamamlayıcı kurumlar vergisi 4.800.000 TL olduğuna göre, (A) A.Ş.''nin küresel asgari tamamlayıcı kurumlar vergisi kaç
    TL''dir?'
  secenekler:
    A: 1.440.000 TL
    B: 1.600.000 TL
    C: 1.800.000 TL
    D: 2.880.000 TL
    E: 4.800.000 TL
  dogru: A
  aciklama:
    dogru_neden: Bir bağlı işletmenin küresel ATV'si, işletme bazlı kazancının ülkesel bazlı kazanca bölünmesiyle bulunan
      oranın ülke için hesaplanan vergiyle çarpılması sonucu bulunur (Ek 6/5). Ülkesel bazlı kazanç = 45 + 75 + 30 = 150.000.000
      TL; oran = 45/150 = %30; (A) A.Ş.'nin vergisi = 4.800.000 × %30 = 1.440.000 TL.
    celdiriciler:
      B: Vergi üç işletme arasında eşit bölünmüştür; Ek 6/5 eşit bölüşüm değil, kazanç oranına göre tahsis öngörür.
