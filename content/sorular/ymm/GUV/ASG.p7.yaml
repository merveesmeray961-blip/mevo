      işçi sayısına bölünmesiyle bulunan tutarın %50’si ile Türkiye’de yerleşik bağlı işletmelerin toplam maddi duran varlık
      değerinin, nitelikli yetersiz vergilendirilen ödemeler esasının uygulandığı tüm ülkelerdeki yerleşik bağlı işletmelerin
      toplam maddi duran varlık değerine bölünmesiyle bulunan tutarın %50’sinin toplamıdır.
