  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik olmayan nihai ana işletmenin bulunduğu ülkede nitelikli gelirin dahil edilmesi esası uygulanmadığı
    için Türkiye''deki bağlı işletmeler yetersiz vergilendirilen ödemeler esası kapsamında mükellef olmuştur. 2026 hesap dönemi
    verileri şöyledir:


    - Grubun yetersiz vergilendirilen ödemeler esasına göre hesaplanan toplam vergisi: 12.000.000 TL

    - Türkiye''deki bağlı işletmelerin toplam işçi sayısı: 150; nitelikli yetersiz vergilendirilen ödemeler esasının uygulandığı
    tüm ülkelerdeki toplam işçi sayısı: 1.000

    - Türkiye''deki bağlı işletmelerin toplam maddi duran varlık değeri: 400 milyon TL; aynı ülkelerdeki toplam maddi duran
    varlık değeri: 2.000 milyon TL

    - Grubun konsolide hasılatı: 40 milyar TL (yatırım işletmesi ve şeffaf işletme **yoktur**)


    Ek 7/8''deki yüzdeye göre Türkiye''deki bağlı işletmelerin ödemekle sorumlu olduğu vergi kaç TL''dir?'
  secenekler:
    A: 1.050.000 TL
    B: 1.800.000 TL
    C: 2.100.000 TL
    D: 2.400.000 TL
    E: 4.200.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Yetersiz vergilendirilen ödemeler esası yüzdesi, işçi sayısı oranının %50''si ile maddi duran varlık değeri
      oranının %50''sinin toplamıdır (Ek 7/8): (150/1.000) × %50 = %7,5 ve (400/2.000) × %50 = %10; toplam %17,5. Türkiye''deki
      bağlı işletmelerin sorumlu olduğu vergi 12.000.000 × %17,5 = 2.100.000 TL''dir (Ek 7/6). Hasılat bilgisi çözümde kullanılmaz.
      Püf noktaları: yüzdeyi iki oranın toplamı değil, her birinin yarısının toplamı olarak hesaplayın; gereksiz veriyi (hasılat)
      dışarıda bırakın.'
    celdiriciler:
      A: Bulunan %17,5'lik yüzde ikinci kez %50 ile çarpılmıştır; iki oranın %50'şer ağırlıkla toplanması zaten yüzdeyi vermektedir.
      B: Yalnızca işçi sayısı oranı (%15) esas alınmıştır; maddi duran varlık oranı da %50 ağırlıkla yüzdeye dahil edilmelidir.
      D: Yalnızca maddi duran varlık oranı (%20) esas alınmıştır; işçi sayısı oranı da %50 ağırlıkla yüzdeye dahil edilmelidir.
      E: İki oran %50 ile ağırlıklandırılmadan toplanmıştır (%15 + %20 = %35); Ek 7/8 her bir oranın yarısını alır.
    hesap_adimlari:
    - 'İşçi oranı: 150/1.000 = %15; ağırlıklı: %7,5'
    - 'Maddi duran varlık oranı: 400/2.000 = %20; ağırlıklı: %10'
    - Yüzde = %17,5; vergi = 12.000.000 × %17,5 = 2.100.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Ek md. 7/8
    alinti: (8) Yetersiz vergilendirilen ödemeler esası yüzdesi; Türkiye’de yerleşik bağlı işletmelerin toplam işçi sayısının,
