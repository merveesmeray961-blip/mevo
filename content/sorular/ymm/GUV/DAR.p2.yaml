    dogru_neden: 'Serbest meslek kazancı (md. 30/1-b): vergi ödemeyi yapan tarafından üstlenildiğinden kesinti,
      fiilen ödenen tutar ile üstlenilen verginin toplamı üzerinden hesaplanır (md. 30/11): brüt = 800.000 / 0,80
      = 1.000.000 TL; kesinti 200.000 TL. Dar mükellef kuruma dağıtılan kâr payı (md. 30/3): 2.000.000 × %15 = 300.000
      TL. Kârın sermayeye eklenmesi kâr dağıtımı sayılmaz; makine bedeli md. 30''da sayılan kazanç ve iratlardan
      değildir ve Almanya 30/7 kapsamında olmadığından kesinti yoktur. Toplam: 200.000 + 300.000 = 500.000 TL. Püf
      noktaları: Üstlenilen vergide matrah net tutar değil brüt tutardır; sermayeye ekleme ve emsal bedelli mal
      alımı kesinti doğurmaz.'
