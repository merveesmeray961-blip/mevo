  kok: 5520 sayılı Kanun'un 30. maddesinin yedinci fıkrası uyarınca Cumhurbaşkanınca ilan edilen bir ülkeyle ilgili
    olarak tam mükellef (A) AŞ tarafından yapılan aşağıdaki ödemelerden hangisi üzerinden bu fıkra uyarınca vergi
    kesintisi **yapılmaz**?
  secenekler:
    A: Söz konusu ülkede yerleşik ve münhasıran grup şirketlerine finansman sağlayan bir şirketten alınan kredinin
      faizi
    B: Söz konusu ülkede yerleşik bir şirkete, kapsam dışındaki bir ülkenin bankası üzerinden ödenen danışmanlık
