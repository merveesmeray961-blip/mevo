- id: YMM-GUV-DAR-0019
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: çifte vergilendirmeyi önleme anlaşmaları
  tip: kavrama
  zorluk: 3
  kok: '5520 sayılı Kanun''un 7. maddesindeki kontrol edilen yabancı kurum (KYK) kazancı uygulamasına ilişkin aşağıdaki
    ifadelerden hangileri doğrudur?


    I. Yürürlükteki çifte vergilendirmeyi önleme anlaşmaları, Türkiye''nin KYK hükümlerine göre kendi mukimi kurumları
    vergilendirme hakkını sınırlandırmaz.

    II. KYK''nın zararları, ona iştirak eden tam mükellef kurumun kazancının tespitinde hissesi oranında indirilebilir.

    III. Türkiye''de KYK kazancı olarak vergilendirilmiş kâr sonradan dağıtıldığında, kâr payının daha önce vergilendirilmiş
    kısmı ayrıca vergilendirilmez; aşan kısım vergilendirilir.

    IV. KYK''nın, bulunduğu ülke dışındaki ülkelerde ödediği gelir ve kurumlar vergisi benzeri vergiler de Türkiye''de
    hesaplanan kurumlar vergisinden mahsup edilebilir.

    V. İştirak payının tamamı, yurt dışı iştirakin hesap dönemi kapanmadan önce muvazaasız olarak elden çıkarılmışsa
    o iştirak hakkında KYK hükümleri uygulanmaz.'
  secenekler:
    A: I, II ve III
    B: I, III ve V
    C: II, IV ve V
    D: I, III, IV ve V
    E: III ve V
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğe göre yürürlükteki anlaşmalar Türkiye''nin KYK hükümlerine göre kendi mukimlerini vergileme
      hakkını sınırlandırmaz (I doğru). KVK 7/5 ve Tebliğe göre daha önce Türkiye''de vergilenmiş kazancın dağıtılmasında
      yalnız vergilenmemiş kısım vergiye tabidir (III doğru). İştirak payının tamamının hesap dönemi kapanmadan
      muvazaasız elden çıkarılması hâlinde madde uygulanmaz (V doğru). KYK zararları iştirak eden kurumun kazancının
      tespitinde dikkate alınamaz (II yanlış); KYK''nın kendi ülkesi dışındaki ülkelerde ödediği vergiler mahsup
      edilemez (IV yanlış). Püf noktaları: KYK uygulaması yalnız kazançları kapsar, zararlar aktarılmaz; mahsup
      da yalnız KYK''nın bulunduğu ülkede ödediği vergilerle sınırlıdır; anlaşmalar ise bu uygulamayı engellemez.'
    celdiriciler:
      A: II yanlıştır; Tebliğe göre KYK zararlarının tam mükellef kurumun kazancının tespitinde dikkate alınması
        mümkün değildir.
      C: II ve IV yanlıştır; I ise Tebliğin açık ifadesiyle doğrudur.
      D: IV yanlıştır; KYK'nın bulunduğu ülke dışındaki ülkelerde ödediği vergilerin mahsubu mümkün değildir.
      E: I de doğrudur; anlaşmalar Türkiye'nin KYK hükümlerine göre kendi mukimlerini vergilemesini sınırlandırmaz.
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 7.6
    alinti: Yürürlükte bulunan çifte vergilendirmeyi önleme anlaşmaları, Türkiye’nin Kurumlar Vergisi Kanununun
      7 inci maddesinde yer alan “Kontrol edilen yabancı kurum kazancı” hükümlerine göre kendi mukimlerini vergileme
      hakkını sınırlandırmamaktadır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 7.3
    alinti: Öte yandan, kontrol edilen yabancı kurumun zararlarının söz konusu kuruma iştirak eden tam mükellef
      kurumların kazançlarının tespitinde dikkate alınabilmesi mümkün bulunmamaktadır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 7.4
    alinti: Ancak, kontrol edilen yabancı kurumun bulunduğu ülke dışındaki ülkelerde ödemiş olduğu gelir ve kurumlar
      vergisi benzeri vergilerin, söz konusu kurumun Türkiye’de vergilendirilecek kazancı üzerinden hesaplanan kurumlar
      vergisinden mahsup edilmesi mümkün bulunmamaktadır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
