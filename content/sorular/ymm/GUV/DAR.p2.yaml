    E: Söz konusu ülke mevzuatına göre finansman sağlamaya yetkili ve orada mukim bir bankadan alınan kredinin faizi
  dogru: E
  aciklama:
    dogru_neden: KVK 30/7-(b) uyarınca yurt dışındaki finans kuruluşlarından temin edilen borçlanmalara ilişkin
