- id: YMM-GUV-DAR-0012
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: dar mükellef kurumların vergilendirilmesi
  tip: hesaplama
  zorluk: 1
  kok: Türkiye'de daimi temsilci aracılığıyla faaliyet gösteren dar mükellef yabancı hava yolu şirketi (H) Airlines,
    2026 yılında Türkiye'deki havalimanlarından yurt dışındaki varış noktalarına yaptığı yolcu ve yük taşımaları
    karşılığında, bilet bedeliyle birlikte alınan gider karşılıkları dahil 40.000.000 TL hasılat elde etmiştir.
    (H) Airlines'ın bu hasılata ilişkin vergiye matrah olacak kurum kazancı kaç TL'dir?
  secenekler:
    A: 2.000.000
    B: 4.800.000
    C: 6.000.000
    D: 8.000.000
    E: 10.000.000
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 23''e göre yabancı ulaştırma kurumlarının vergiye matrah olacak kurum kazancı, Türkiye''de
      elde edilmiş sayılan hasılata ortalama emsal oranları uygulanarak bulunur. Türkiye''deki yükleme yerinden
      yurt dışına yapılan hava taşımacılığında alınan tutarlar Türkiye''de elde edilmiş hasılattır ve hava taşımacılığında
      oran %5''tir: 40.000.000 × %5 = 2.000.000 TL.'
    celdiriciler:
      B: '%12 kara taşımacılığına ait ortalama emsal oranıdır.'
      C: '%15 deniz taşımacılığına ait ortalama emsal oranıdır.'
      D: Hasılata emsal oranı yerine eski kurumlar vergisi oranı (%20) uygulanmış gibi hesaplanmıştır.
      E: Hasılata kurumlar vergisi oranı (%25) uygulanmıştır; matrah emsal oranıyla bulunur, vergi oranı bu matraha
        ayrıca uygulanır.
    hesap_adimlari:
    - Hava taşımacılığı ortalama emsal oranı %5
    - Kurum kazancı = 40.000.000 × %5 = 2.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/1-2
    alinti: MADDE 23- (1) Yabancı ulaştırma kurumlarının vergiye matrah olacak kurum kazancı, hasılata ortalama
      emsal oranlarının uygulanması suretiyle hesaplanır. (2) Ortalama emsal oranları, Türkiye’de daimî veya arızî
      olarak çalışan bütün kurumlar için; a) Kara taşımacılığında % 12, b) Deniz taşımacılığında % 15, c) Hava taşımacılığında
      % 5,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/3-(b)
    alinti: b) Türkiye’deki yükleme limanlarından yabancı ülkelerdeki varış limanlarına veya diğer bir kurumun gemisine
      aktarma yapılacak yabancı limana kadar gerçekleşen deniz ve hava taşımacılığında, bilet bedeli ile birlikte
      alınan gider karşılıkları dahil olmak üzere yolcu, yük ve bagaj taşıma ücreti olarak her ne adla olursa olsun
      aldıkları tutarlar.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 40000000 * 5 // 100
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-2
    kapilar:
      G2:
        sonuc: gecti
