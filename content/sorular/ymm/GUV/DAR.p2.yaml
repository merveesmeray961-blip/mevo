- id: YMM-GUV-DAR-0017
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: kontrol edilen yabancı kurum
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (A) AŞ, (S) ülkesinde kurulu (B) Ltd.''nin sermayesinin %80''ine; (B) Ltd. de (T) ülkesinde
    kurulu (C) Ltd.''nin sermayesinin %50''sine sahiptir. Türkiye''de tam mükellef gerçek kişi (D), (C) Ltd.''nin
    sermayesinin %15''ine doğrudan sahiptir; (A) AŞ ile (D) arasında ilişki yoktur. Oranlar 2026 yılı boyunca değişmemiştir
    ve şirketlerin hesap dönemi takvim yılıdır. Kâr payı ve oy hakları sermaye paylarıyla orantılıdır. (C) Ltd.''nin
    2026 yılı verileri (ABD Doları) şöyledir:


    - Toplam gayrisafi hasılat 2.000.000: faaliyetiyle orantılı sermaye, organizasyon ve personelle yürütülen ticari
    faaliyet hasılatı 1.200.000; faiz geliri 500.000; kira geliri 300.000

    - Vergi öncesi kurum kazancı 1.000.000 (gider kabul edilmeyen gider, istisna ve geçmiş yıl zararı yoktur)

    - (T) ülkesinde tahakkuk eden ve ödenen kurumlar vergisi 50.000


    (C) Ltd. 2026 yılında kâr dağıtmamıştır. Buna göre (A) AŞ''nin 2026 yılı kurumlar vergisi matrahına KVK md.
    7 uyarınca dahil edilecek tutar kaç ABD Doları''dır?'
  secenekler:
    A: '0'
    B: '380.000'
    C: '400.000'
    D: '500.000'
    E: '550.000'
  dogru: C
  aciklama:
    dogru_neden: 'Kontrol: (A) AŞ''nin (C)''ye dolaylı payı %80 × %50 = %40''tır; tam mükellef gerçek kişi (D)''nin
      %15''lik payı ile birlikte %55 olup %50 eşiği aşılır. Pasif gelir oranı (500.000 + 300.000) / 2.000.000 =
      %40 ≥ %25. Vergi yükü 50.000 / (950.000 + 50.000) = %5 < %10. Hasılat eşiği de aşılmıştır. Tebliğe göre matraha
      dahil edilecek tutar, vergi öncesi kurum kazancının iştirak oranına isabet eden kısmıdır ve gerçek kişinin
      payı kontrol tespitinde dikkate alınsa da yalnız tam mükellef kurumun payı vergilenir: 1.000.000 × %40 = 400.000
      ABD Doları. (T)''de ödenen verginin isabet eden kısmı (20.000) md. 33/2''ye göre mahsup edilebilir. Püf noktaları:
      Dolaylı paylar çarpılarak bulunur ve %50 eşiği tam mükellef gerçek kişi ile kurumun payları birlikte değerlendirilerek
      aranır; matraha ise yalnız kurumun kendi payı ve vergi öncesi kazanç girer.'
    celdiriciler:
      A: (A) AŞ'nin tek başına %40 payı eşiğin altında kalsa da tam mükellef gerçek kişinin payı ile birlikte %55'e
        ulaşıldığından kontrol vardır.
      B: Vergi sonrası kazanç esas alınmıştır; Tebliğe göre vergi öncesi kurum kazancı dikkate alınır.
      D: (B) Ltd.'nin (C)'deki %50 payı kullanılmıştır; (A) AŞ'nin dolaylı payı %80 × %50 = %40'tır.
      E: Gerçek kişi (D)'nin payı da eklenmiştir; gerçek kişinin payı yalnız kontrol tespitinde dikkate alınır,
        kurumun matrahına girmez.
    hesap_adimlari:
    - Dolaylı pay = %80 × %50 = %40; (D) ile birlikte %55 ≥ %50
    - Pasif gelir = 800.000 / 2.000.000 = %40 ≥ %25
    - Vergi yükü = 50.000 / 1.000.000 = %5 < %10
    - Matraha dahil = 1.000.000 × %40 = 400.000 ABD Doları
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 7/1-(a), (b)
    alinti: a) İştirakin toplam gayrisafî hasılatının % 25 veya fazlasının faaliyet ile orantılı sermaye, organizasyon
      ve eleman istihdamı suretiyle yürütülen ticarî, ziraî veya serbest meslek faaliyeti dışındaki faiz, kâr payı,
      kira, lisans ücreti, menkul kıymet satış geliri gibi 18 2/7/2018 tarihli ve 700 sayılı KHK’nin 173 üncü maddesiyle,
      bu fıkrada yer alan “Bakanlar Kurulu” ibaresi “Cumhurbaşkanı” şeklinde değiştirilmiştir. pasif nitelikli gelirlerden
      oluşması. b) Yurt dışındaki iştirakin ticarî bilânço kârı üzerinden % 10’dan az oranda gelir ve kurumlar vergisi
      benzeri toplam vergi yükü taşıması.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 7.3
    alinti: Madde kapsamına giren kontrol edilen yabancı kurumların Türkiye’de vergiye tabi tutulacak kazancı, zarar
      mahsubu dahil giderler düşüldükten istisnalar düşülmeden önceki, vergi öncesi kurum kazançları olacaktır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 7.3
    alinti: Bununla birlikte; söz konusu gerçek kişilerin kontrol edilen yabancı kurum üzerinden elde edecekleri
      kazançlar, bu madde kapsamında değerlendirilmeyecek, sadece tam mükellef kurum tarafından elde edilen kazançlar
      bu madde kapsamında kurumlar vergisine tabi tutulacaktır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'pay = 0.80 * 0.50

      kontrol = pay + 0.15

      pasif = (500000 + 300000) / 2000000

      yuk = 50000 / (950000 + 50000)

      assert kontrol >= 0.5 and pasif >= 0.25 and yuk < 0.10

      sonuc = round(1000000 * pay)'
