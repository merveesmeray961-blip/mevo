- id: YMM-GUV-DAR-0014
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: KVK md.30 tevkifat
  tip: hesaplama
  zorluk: 2
  kok: Türkiye'deki şubesi aracılığıyla faaliyet gösteren dar mükellef (G) GmbH'nin 2026 hesap dönemine ilişkin
    indirim ve istisnalar düşülmeden önceki kurum kazancı 3.000.000 TL'dir. Bu tutarın 1.000.000 TL'si, şube faaliyeti
    kapsamında tam mükellef bir AŞ'den alınan ve iştirak kazançları istisnasına konu edilen kâr payıdır. Şubenin
    başka indirim ve istisnası yoktur; kurumlar vergisi oranı %25'tir. Şube, hesaplanan kurumlar vergisi düşüldükten
    sonra kalan tutarın tamamını 2027 yılında ana merkeze aktarmıştır. KVK md. 30/6 kapsamındaki kesinti oranı %15
    olduğuna göre, aktarım nedeniyle yapılacak vergi kesintisi kaç TL'dir?
  secenekler:
    A: '0'
    B: '225.000'
    C: '300.000'
    D: '375.000'
    E: '450.000'
  dogru: D
  aciklama:
    dogru_neden: 'Tebliğe göre iştirak kazançları istisnasında kâr payını alan kurumun tam veya dar mükellef olmasının
      önemi yoktur; matrah 3.000.000 − 1.000.000 = 2.000.000 TL, hesaplanan kurumlar vergisi 500.000 TL''dir. KVK
      30/6''ya göre kesinti, indirim ve istisnalar düşülmeden önceki kurum kazancından hesaplanan kurumlar vergisi
      düşüldükten sonra kalan kısımdan ana merkeze aktarılan tutar üzerinden yapılır: (3.000.000 − 500.000) × %15
      = 2.500.000 × %15 = 375.000 TL.'
    celdiriciler:
      A: Ana merkeze aktarılan kazanç üzerinden kurum bünyesinde %15 kesinti yapılması KVK 30/6'nın açık hükmüdür.
      B: Kesinti matrahı vergi sonrası matraha (2.000.000 − 500.000) göre bulunmuştur; oysa istisna düşülmeden önceki
        kazanç esas alınır.
      C: Kesinti kurumlar vergisi matrahına (2.000.000) uygulanmıştır; hesaplanan vergi düşülmeli, istisna ise düşülmemelidir.
      E: Hesaplanan kurumlar vergisi düşülmeden 3.000.000 TL'ye kesinti uygulanmıştır.
    hesap_adimlari:
    - Matrah = 3.000.000 − 1.000.000 = 2.000.000 TL; KV = 500.000 TL
    - Aktarılan tutar = 3.000.000 − 500.000 = 2.500.000 TL
    - Kesinti = 2.500.000 × %15 = 375.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/6
    alinti: (6) Yıllık veya özel beyanname veren dar mükellef kurumların, indirim ve istisnalar düşülmeden önceki
      kurum kazancından, hesaplanan kurumlar vergisi düşüldükten sonra kalan kısımdan ana merkeze aktardıkları tutar
      üzerinden, kurum bünyesinde % 15 oranında kurumlar vergisi kesintisi yapılır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.1
    alinti: Kâr payını alan kurumun tam veya dar mükellefiyete tabi olmasının istisnanın uygulanmasında bir önemi
      bulunmamaktadır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kv = (3000000 - 1000000) * 25 // 100

      sonuc = (3000000 - kv) * 15 // 100'
