    ülkelerden değildir; çifte vergilendirmeyi önleme anlaşması hükümleri dikkate alınmayacaktır):


    - (G) GmbH''nin Türkiye''de verdiği mühendislik danışmanlığı karşılığında, (G) GmbH''ye net 800.000 TL ödenmesi
    kararlaştırılmış ve kesilmesi gereken vergiyi (A) AŞ üstlenmiştir.

    - (G) GmbH''nin ortağı olduğu (A) AŞ, (G) GmbH''ye brüt 2.000.000 TL kâr payını nakden ödemiştir.

    - (A) AŞ, 2025 kârından 1.000.000 TL''yi sermayesine eklemiş; (G) GmbH''ye bu nedenle bedelsiz pay verilmiştir.

    - (G) GmbH''den emsaline uygun bedelle 3.000.000 TL''ye makine satın alınmıştır.


    Kesinti oranları serbest meslek kazançları için %20, kâr payları için %15''tir. (A) AŞ''nin bu işlemler nedeniyle
    KVK md. 30 uyarınca yapması gereken toplam vergi kesintisi kaç TL''dir?'
  secenekler:
    A: '160.000'
