      B: Kâr payı kesintisi unutulmuştur; tam mükellef kurumların dar mükellef kurumlara dağıttığı kâr payları md.
        30/3 uyarınca kesintiye tabidir.
      C: Serbest meslek ödemesi kesinti dışı sayılmıştır; iş yeri olmasa da Türkiye'de elde edilen serbest meslek
        kazancı md. 30/1-(b) kapsamındadır.
      D: Serbest meslek kesintisi net tutar (800.000) üzerinden hesaplanmıştır; vergi üstlenildiğinden brüt tutar
        (1.000.000) esas alınır.
    hesap_adimlari:
    - 'Serbest meslek: brüt = 800.000 / 0,80 = 1.000.000 TL; kesinti = 200.000 TL'
    - 'Kâr payı: 2.000.000 × %15 = 300.000 TL'
    - 'Sermayeye ekleme ve makine bedeli: kesinti yok'
    - Toplam = 500.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/1-(b)
    alinti: 'MADDE 30- (1) Dar mükellefiyete tâbi kurumların aşağıdaki kazanç ve iratları üzerinden, bu kazanç ve
      iratları avanslar da dahil olmak üzere nakden veya hesaben ödeyen veya tahakkuk ettirenler tarafından % 15
      oranında kurumlar vergisi kesintisi yapılır: a) Gelir Vergisi Kanununda belirtilen esaslara göre birden fazla
      takvim yılına yaygın inşaat ve onarım işleri ile uğraşan kurumlara bu işleri ile ilgili olarak yapılan ak
      ediş ödemeleri. b) Serbest meslek kazançları.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/3
    alinti: (3) Tam mükellef kurumlar tarafından, Türkiye’de bir iş yeri veya daimî temsilci aracılığıyla kâr payı
      elde edenler hariç olmak üzere dar mükellef kurumlara veya kurumlar vergisinden muaf olan dar mükelleflere
      dağıtılan (Kârın sermayeye eklenmesi kâr dağıtımı sayılmaz.)
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
