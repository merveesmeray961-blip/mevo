  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: dar mükellef kurumların vergilendirilmesi
  tip: uygulama
  zorluk: 2
  kok: Türkiye'de iş yeri ve daimi temsilcisi bulunmayan (L) SA, 2018 yılında satın aldığı Antalya'daki bir villayı
    12/3/2026 tarihinde İstanbul'da yaşayan bir gerçek kişiye satarak kazanç elde etmiştir. (L) SA'nın Türkiye'de
    başka bir kazancı yoktur. Bu kazancın vergilendirilmesine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kazanç, elde edildiği tarihten itibaren 15 gün içinde taşınmazın bulunduğu yerin vergi dairesine özel beyanname
      ile bildirilir.
    B: Taşınmaz edinildiği tarihten itibaren beş yıldan fazla elde tutulduğundan elde edilen kazanç vergiye tabi
      değildir.
    C: Kazanç, hesap döneminin kapandığı ayı izleyen dördüncü ayda verilecek yıllık kurumlar vergisi beyannamesine
      dahil edilerek bildirilir.
    D: Vergi, alıcı gerçek kişi tarafından KVK md. 30 uyarınca kesilerek muhtasar beyanname ile vergi dairesine
      bildirilir.
    E: Kazanç, elde edildiği tarihten itibaren 15 gün içinde alıcının bağlı olduğu vergi dairesine özel beyanname
      ile bildirilir.
  dogru: A
  aciklama:
    dogru_neden: Dar mükellef kurumun vergiye tabi kazancı GVK'da yazılı diğer kazanç ve iratlardan ibaret olduğundan,
      kazanç elde edilme tarihinden itibaren 15 gün içinde özel beyanname ile bildirilir (KVK md. 26/1). Taşınmazların
      elden çıkarılmasından doğan diğer kazanç ve iratlarda beyanname, taşınmazın bulunduğu yerin vergi dairesine
      verilir (md. 27/1-a). Md. 26/2 uyarınca GVK'daki vergilendirmeme hususundaki istisna, kayıt, şart ve sürelere
      ait sınırlamalar dikkate alınmadığından, beş yıllık elde tutma süresinin dolmuş olması kazancı vergi dışı
      bırakmaz.
    celdiriciler:
      B: KVK 26/2 gereği GVK'daki süreye bağlı vergilendirmeme sınırlamaları dar mükellef kurumlarda dikkate alınmaz.
      C: Kazancın diğer kazanç ve iratlardan ibaret olması hâlinde yıllık değil, 15 gün içinde özel beyan esastır.
      D: Taşınmaz satış kazancı KVK md. 30'da sayılan kesintiye tabi kazanç ve iratlar arasında değildir; vergileme
        özel beyanla yapılır.
      E: Özel beyannamenin verileceği yer, taşınmazlarda alıcının değil taşınmazın bulunduğu yerin vergi dairesidir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 26/1
    alinti: MADDE 26- (1) Dar mükellefiyete tâbi olan yabancı kurumların vergiye tâbi kazancının Gelir Vergisi Kanununda
      yazılı diğer kazanç ve iratlardan (telif, imtiyaz, ihtira, işletme, ticaret unvanı, marka ve benzeri gayrimaddî
      hakların satışı, devir ve temliki karşılığında alınan bedeller hariç) ibaret bulunması halinde, yabancı kurum
      veya Türkiye’de adına hareket eden kimse, bu kazançları elde edilme tarihinden itibaren onbeş gün içinde Kanunun
      27 nci maddesinde belirtilen vergi dairesine beyanname ile bildirmek zorundadır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 26/2
    alinti: (2) Diğer kazanç ve iratlara ilişkin olarak Türkiye’ye bizzat getirilen nakdî veya aynî sermaye karşılığında
      elde edilen menkul kıymetler ile iştirak hisselerinin elden çıkarılması sırasında oluşan kur farkı kazancına
