  tip: uygulama
  zorluk: 2
  kok: Tam mükellef (A) A.Ş.'nin Almanya'daki şubesinin 2026 yılı kazancı 2.000.000 TL'dir; kazanç Türkiye'de genel sonuç
    hesaplarına intikal ettirilmiş ve yurt dışı şube kazancı istisnasının şartları sağlanmamıştır. Şube kazancı için Almanya'da
    ödenen 600.000 TL kurumlar vergisi benzeri vergi, Türk konsolosluğunca tasdik edilmiş belgelerle tevsik edilmiştir. Kurumlar
    vergisi oranı %25'tir. KVK md. 33'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Almanya'da ödenen 600.000 TL'nin tamamı 2026 yılı kurumlar vergisinden mahsup edilir.
    B: 500.000 TL mahsup edilir; mahsup edilemeyen 100.000 TL, talep hâlinde nakden iade edilir.
    C: 500.000 TL mahsup edilir; kalan 100.000 TL 2026 yılı kurum kazancının tespitinde gider yazılır.
    D: 500.000 TL mahsup edilir; kalan 100.000 TL izleyen üçüncü hesap dönemi sonuna kadar indirim konusu yapılabilir.
    E: 500.000 TL mahsup edilir; kalan 100.000 TL izleyen beşinci hesap dönemi sonuna kadar indirim konusu yapılabilir.
  dogru: D
  aciklama:
    dogru_neden: 'Mahsup edilebilecek tutar, yurt dışı kazanca md. 32''deki oran uygulanarak bulunan tutarı aşamaz: 2.000.000
      × %25 = 500.000 TL. Bu sınır dahilinde ilgili dönemde indirilemeyen vergiler, izleyen üçüncü hesap dönemi sonuna kadar
      indirilebilir (md. 33/4); kalan 100.000 TL bu süre içinde indirilebilir.'
    celdiriciler:
      A: Mahsup, yurt dışı kazanca Türkiye oranı uygulanarak bulunan tutarla (500.000 TL) sınırlıdır.
      B: Kanun sınırı aşan yurt dışı vergi için iade öngörmez.
      C: Mahsup edilemeyen yurt dışı vergi gider olarak değil, sonraki dönemlerde mahsup yoluyla dikkate alınır.
      E: Süre izleyen üçüncü hesap dönemi sonudur.
  kaynaklar:
