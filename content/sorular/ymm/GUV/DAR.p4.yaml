- id: YMM-GUV-DAR-0022
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: çifte vergilendirmeyi önleme anlaşmaları
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (A) A.Ş., yurt dışında kurulu (Y) Ltd.''nin sermayesinin %40''ına sahiptir. (Y) Ltd.''nin 2025 yılı kazancı
    1.000.000 TL karşılığıdır; (Y) bu kazanç üzerinden bulunduğu ülkede 200.000 TL karşılığı kurumlar vergisi ödemiş ve kalan
    800.000 TL''nin tamamını 2026 yılında dağıtmıştır. (A) A.Ş.''ye düşen 320.000 TL''lik kâr payından (Y)''nin ülkesinde
    %5 oranında (16.000 TL) vergi kesilmiştir. Bu kâr payı için KVK md. 5/1-b''deki istisnanın şartları sağlanmamaktadır.
    Yurt dışında ödenen bütün vergiler usulüne uygun tasdikli belgelerle tevsik edilmiştir; kurumlar vergisi oranı %25''tir.


    KVK md. 33''e göre (A) A.Ş.''nin bu kâr payı nedeniyle Türkiye''de ödeyeceği kurumlar vergisi kaç TL''dir?

    '
  secenekler:
    A: '0'
    B: '4.000'
    C: '64.000'
    D: '80.000'
    E: '84.000'
  dogru: B
  aciklama:
    dogru_neden: 'Sermayesinin %25''ine sahip olunan yurt dışı iştirakten alınan kâr payında, kâr payına kaynak kazanç üzerinden
      ödenen vergilerin kâr payına isabet eden kısmı (200.000 × %40 = 80.000) da mahsup edilebilir; bu durumda kazanca ilave
      edilen kâr payı yurt dışında ödenen vergiler dahil dikkate alınır (md. 33/3): 320.000 + 80.000 = 400.000. Hesaplanan
      vergi 400.000 × %25 = 100.000; mahsup: kâr payından kesilen 16.000 + dolaylı 80.000 = 96.000 (sınır 100.000). Ödenecek:
      100.000 − 96.000 = 4.000 TL. Püf noktaları: Dolaylı mahsupta kâr payı brüte (vergi dahil tutara) çıkarılır; sınır bu
      brüt tutara Türkiye oranı uygulanarak bulunur.'
    celdiriciler:
      A: Kâr payı brüte çıkarılmadan dolaylı vergi de mahsup edilmiş, vergi sıfırlanmıştır (80.000 − 96.000).
      C: Kâr payı brüte çıkarılmamış ve yalnız doğrudan kesinti mahsup edilmiştir (80.000 − 16.000).
      D: Kâr payı brüte çıkarılmamış ve hiçbir mahsup yapılmamıştır.
      E: Kâr payı brüte çıkarılmış, ancak dolaylı vergi mahsup edilmemiştir (100.000 − 16.000).
    hesap_adimlari:
    - Dolaylı vergi payı = 200.000 × 0,40 = 80.000
    - Matraha giren = 320.000 + 80.000 = 400.000
    - KV = 400.000 × 0,25 = 100.000
    - Mahsup = 16.000 + 80.000 = 96.000 ≤ 100.000
    - Ödenecek = 4.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: isabet eden kısmı mahsup edilebilir. Kazanca ilave edilen kâr payı, bu kazançlar üzerinden yurt
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: dışında ödenen gelir ve kurumlar vergisi benzeri vergiler dahil edilmek suretiyle dikkate alınır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dolayli = 200000 * 40 / 100

      matrah = 320000 + dolayli

      kv = matrah * 25 / 100

      mahsup = min(16000 + dolayli, kv)

      sonuc = kv - mahsup'
