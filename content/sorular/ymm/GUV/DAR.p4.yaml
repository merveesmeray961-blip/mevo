      kazancının tam mükellef hükümleriyle tespit edilmesi mükellefiyet türünü değiştirmez (III yanlış). İhraç amacıyla alınan
      malların Türkiye'de satılmaksızın yurt dışına gönderilmesinden doğan kazanç Türkiye'de elde edilmiş sayılmaz; ancak
      Türkiye'de satmak, satış sözleşmesinin Türkiye'de yapılmasını da kapsadığından (W)'nin kazancı Türkiye'de elde edilmiştir
      (md. 3/3-a; IV yanlış).
    celdiriciler:
      B: III yanlıştır; (Y) de tam mükelleftir.
      C: IV yanlıştır; (X) de tam mükelleftir.
      D: Sözleşme Türkiye'de yapıldığından satış Türkiye'de yapılmış sayılır; IV yanlıştır.
      E: III ve IV yanlıştır; (Y) tam mükelleftir.
