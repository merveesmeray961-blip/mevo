  kok: 'Aşağıdaki kurumlarla ilgili ifadelerden hangileri 5520 sayılı Kurumlar Vergisi Kanunu''na göre doğrudur?


    I. Kuruluş sözleşmesinde gösterilen merkezi Hollanda''da olan, ancak işlemleri fiilen İstanbul''da toplanan ve buradan
    yönetilen (X) B.V. tam mükelleftir.

    II. Kanuni merkezi İstanbul''da olan, ancak işlemleri fiilen Londra''dan yönetilen (Y) A.Ş. tam mükelleftir.

    III. Kanuni ve iş merkezi Almanya''da olan (Z) GmbH, İzmir''deki şubesinin kazancı tam mükellef kurumlara ilişkin hükümlere
    göre tespit edildiğinden tam mükellef sayılır.

    IV. Kanuni ve iş merkezi Fransa''da olan (W) SA''nın İzmir''deki iş yeri aracılığıyla ihraç amacıyla Türkiye''de satın
    aldığı malları yurt dışındaki bir alıcıya satması hâlinde, satış sözleşmesi İzmir''de imzalanmış olsa da bu kazanç Türkiye''de
    elde edilmiş sayılmaz.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: I, III ve IV
  dogru: A
  aciklama:
    dogru_neden: Kanuni veya iş merkezinden birinin Türkiye'de bulunması tam mükellefiyet için yeterlidir (md. 3/1); bu nedenle
