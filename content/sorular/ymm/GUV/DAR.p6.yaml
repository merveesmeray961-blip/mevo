- id: YMM-GUV-DAR-0029
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: internet reklam hizmetlerine aracılıkta vergi kesintisi
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (M) A.Ş., reklam verenlerin internet ortamında reklam hizmeti almasına aracılık etmektedir. (M) A.Ş.,
    2026 yılında bir reklam verenden bu hizmet için KDV hariç 2.400.000 TL tahsil etmiş; 400.000 TL'lik kendi aracılık komisyonunu
    alıkoyarak kalan 2.000.000 TL'yi, reklam hizmetini veren ve Türkiye'de iş yeri veya daimî temsilcisi bulunmayan dar mükellef
    (L) Ltd.'ye ödemiştir. Bu ödemeler için uygulanacak vergi kesintisi oranı %15'tir. Buna göre (M) A.Ş.'nin (L) Ltd.'ye
    yaptığı ödeme nedeniyle yapması gereken vergi kesintisi aşağıdakilerden hangisidir?
  secenekler:
    A: 60.000 TL
    B: 300.000 TL
    C: 360.000 TL
    D: 400.000 TL
    E: 600.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 30/1-(d) uyarınca VUK md. 11/7 kapsamındaki ödemelerden dar mükellefler adına vergi kesintisi yapılır.
      Tebliğ bölüm 30.4.11.1.1''e göre hizmete aracılık eden tam mükellef kurum, tahsil ettiği bedelleri internet ortamında
      reklam hizmeti veren asıl hizmet sunucusu dar mükellef kuruma öderken ödeme üzerinden %15 kesinti yapmak zorundadır.
      Kesinti matrahı (L) Ltd.''ye ödenen 2.000.000 TL''dir: 2.000.000 × %15 = 300.000 TL. Püf noktaları: Matrah, müşteriden
      tahsil edilen tutar (2.400.000 TL) değil, dar mükellef hizmet sunucuya yapılan ödemedir. (M) A.Ş.''nin kendi komisyonu
      tam mükellef olarak kendisine ait olup kesintiye konu değildir.'
    celdiriciler:
      A: 400.000 TL komisyon tutarı üzerinden %15 hesaplanmıştır; kesinti matrahı komisyon değil, dar mükellefe yapılan ödemedir.
      C: Müşteriden tahsil edilen 2.400.000 TL üzerinden hesaplanmıştır; (M) A.Ş.'nin kendi komisyonu dar mükellefe ödenmediğinden
        matrahta yer almaz.
      D: 2.000.000 TL üzerinden %20 oranıyla hesaplanmıştır; soruda uygulanacak oran %15'tir.
      E: 2.000.000 TL üzerinden %30 oranıyla hesaplanmıştır; %30, md. 30/7 kapsamındaki ödemeler için geçerlidir ve burada
        uygulanmaz.
    hesap_adimlari:
    - Matrah = asıl hizmet sunucuya yapılan ödeme = 2.400.000 − 400.000 = 2.000.000 TL
    - Kesinti = 2.000.000 × %15 = 300.000 TL
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 30.4.11.1.1
    alinti: Ancak, hizmete aracılık eden tam mükellef kurum tarafından, internet ortamında verilen reklam hizmetlerine ilişkin
      tahsil edilen bedellerin, internet ortamında reklam hizmeti veren asıl hizmet sunucusu dar mükellef kuruma ödenmesinde,
      bu ödemeler üzerinden hizmete aracılık eden tam mükellef kurum tarafından %15 oranında vergi kesintisi yapılması gerekmektedir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/1-(d)
