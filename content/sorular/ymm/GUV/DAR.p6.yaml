    KVK md. 30 uyarınca kesinti yoluyla ödenen aşağıdaki gelirlerden bazılarını göstermek üzere yıllık kurumlar vergisi beyannamesi
    vermeyi tercih etmiştir. (Z) Ltd.'nin bu beyannameye dahil etmek zorunda olduğu gelir aşağıdakilerden hangisidir?
  secenekler:
    A: Türkiye'de yürüttüğü serbest meslek faaliyetinden elde ettiği kazanç
    B: Türkiye'deki bir taşınmazı kiralamaktan elde ettiği gayrimenkul sermaye iradı
    C: Tam mükellef bir anonim şirketten elde ettiği hisse senedi kâr payı
    D: Tam mükellef bir limited şirketin ortağı sıfatıyla elde ettiği kâr payı
    E: Türkiye'deki bir bankada tuttuğu vadeli hesaptan elde ettiği mevduat faizi
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 30/9''a göre ticari ve zirai kazançlar hariç, vergisi md. 30 uyarınca kesinti yoluyla alınan kazanç
      ve iratlar için beyanname verilmesi veya bu gelirlerin verilecek beyannamelere dahil edilmesi ihtiyaridir. İstisnası,
      GVK md. 75/2''nin (5), (7) ve (14) numaralı bentlerindeki menkul sermaye iratları ile fon katılma belgeleri ve yatırım
      ortaklığı hisse senetlerinden elde edilen kâr paylarıdır; bunların beyannameye dahil edilmesi zorunludur. Bankadaki
      vadeli hesaptan elde edilen mevduat faizi GVK md. 75/2-(7) kapsamında olduğundan zorunlu dahil edilir. Püf noktaları:
      ''Kesintiyle vergilenen her gelir ihtiyaridir'' kuralını ezberlemek yetmez; istisnayı oluşturan bentleri (5, 7, 14)
      bilmek gerekir. Hisse senedi veya limited şirket kâr payı (bent 1 ve 2) ile serbest meslek ve gayrimenkul sermaye iradı
      bu istisnaya girmez.'
    celdiriciler:
      A: Serbest meslek kazancı md. 30/1-(b) kapsamında kesintiye tabidir ve bu gelirin beyana dahil edilmesi ihtiyaridir.
      B: Gayrimenkul sermaye iradı md. 30/1-(c) kapsamında kesintiye tabidir ve beyana dahil edilmesi ihtiyaridir.
      C: Hisse senedi kâr payı GVK md. 75/2-(1) kapsamındadır; zorunlu dahil edilen bentler (5), (7) ve (14) arasında yer
        almaz, bu nedenle ihtiyaridir.
      D: Limited şirket ortağının kâr payı GVK md. 75/2-(2) kapsamındadır; zorunlu dahil edilen bentler arasında yer almaz,
        bu nedenle ihtiyaridir.
  kaynaklar:
