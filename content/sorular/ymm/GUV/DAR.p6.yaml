- id: YMM-GUV-DAR-0027
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: dar mükellefiyette kurum kazancının tespiti
  tip: kavrama
  zorluk: 2
  kok: 'Kanuni ve iş merkezi yurt dışında bulunan ve Türkiye''de şubesi (iş yeri) aracılığıyla ticari faaliyette bulunan dar
    mükellef (N) SA ile ilgili aşağıdaki ifadelerden hangileri 5520 sayılı Kurumlar Vergisi Kanunu''na göre doğrudur?


    I. Şube vasıtasıyla elde edilen ticari kazancın tespitinde, aksi belirtilmedikçe tam mükellef kurumlar için geçerli hükümler
    uygulanır.


    II. Şubenin yürüttüğü ticari faaliyet kapsamında elde edilen menkul sermaye iradının tespitinde Gelir Vergisi Kanunu''nun
    bu iratların tespitine ilişkin hükümleri uygulanır.


    III. Şubenin ticari faaliyetiyle bağlantısı bulunmayan ve Türkiye''deki bir taşınmazın kiralanmasından elde edilen gayrimenkul
    sermaye iradının tespitinde Gelir Vergisi Kanunu''nun ilgili hükümleri uygulanır.'
  secenekler:
    A: I ve III
    B: Yalnız I
    C: Yalnız II
    D: II ve III
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: KVK md. 22/1 uyarınca dar mükellef kurumların iş yeri vasıtasıyla elde ettiği kazançların tespitinde aksi
      belirtilmedikçe tam mükellef kurumlar için geçerli hükümler uygulanır (I doğru). Md. 22/2'ye göre ticari veya ziraî
      kazançlar dışındaki kazanç ve iratlar için GVK hükümleri uygulanır; ancak bu kazanç ve iratlar Türkiye'de yapılmakta
      olan ticari veya ziraî faaliyet kapsamında elde edilirse kurum kazancı md. 22/1'e göre tespit edilir (II yanlış). Faaliyet
      kapsamı dışındaki kira geliri için GVK hükümleri uygulanır (III doğru).
    celdiriciler:
      B: III de doğrudur; faaliyet kapsamı dışındaki gayrimenkul sermaye iradı GVK hükümlerine göre tespit edilir.
      C: 'II yanlıştır: ticari faaliyet kapsamında elde edilen irat için kurum kazancı md. 22/1''e göre, yani tam mükellef
        hükümlerine göre tespit edilir.'
      D: II yanlıştır; faaliyet kapsamında elde edilen menkul sermaye iradı GVK'ya göre değil, md. 22/1'e göre belirlenir.
        I de doğrudur.
      E: II yanlıştır; md. 22/2'nin 'ancak' ile başlayan cümlesi bu durumu md. 22/1'e yönlendirir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 22/1
    alinti: Dar mükellef kurumların iş yeri veya daimî temsilci vasıtasıyla elde edilen kazançlarının tespitinde, aksi belirtilmediği
      takdirde tam mükellef kurumlar için geçerli olan hükümler uygulanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 22/2
    alinti: (2) Dar mükellefiyete tâbi kurumların ticarî veya ziraî kazançlar dışında kalan kazanç ve iratları hakkında, Gelir
