- id: YMM-GUV-DAR-0026
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: yurt dışı vergi mahsubunda taşıma süresi
  tip: uygulama
  zorluk: 2
  kok: Hesap dönemi takvim yılı olan tam mükellef (A) A.Ş.'nin Gürcistan'daki iş yerine ait 2025 hesap dönemi kazancı olan
    3.000.000 TL, (A) A.Ş.'nin 2026 yılı genel sonuç hesaplarına intikal ettirilmiş ve Türkiye'deki 2026 yılı beyannamesine
    dahil edilmiştir. Bu kazanç üzerinden Gürcistan'da ödenen 600.000 TL kurumlar vergisi, KVK md. 33/4'teki mahsup sınırının
    altında olup belgelerle tevsik edilmiştir. (A) A.Ş.'nin 2026 yılında geçmiş yıl zararı ve istisnalar nedeniyle vergiye
    tabi kurum kazancı kalmadığından bu verginin tamamı mahsup edilememiştir. Buna göre bu verginin, mahsup edilemeyen kısmı
    en geç hangi hesap dönemi sonuna kadar kurumlar vergisinden indirim konusu yapılabilir?
  secenekler:
    A: 2026 hesap dönemi sonuna
    B: 2027 hesap dönemi sonuna
    C: 2028 hesap dönemi sonuna
    D: 2029 hesap dönemi sonuna
    E: 2030 hesap dönemi sonuna
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 33/4 uyarınca sınır dahilinde kalan ve ilgili kazancın Türkiye''de genel sonuç hesaplarına intikal
      ettirildiği hesap döneminde indirilemeyen yurt dışı vergiler, bu dönemi izleyen üçüncü hesap dönemi sonuna kadar indirim
      konusu yapılabilir. Kazanç 2026 hesap döneminde genel sonuç hesaplarına intikal ettirildiğinden süre 2026''dan başlar
      ve 2029 hesap dönemi sonunda biter. Püf noktaları: Sürenin başlangıcı kazancın elde edildiği yıl (2025) değil, genel
      sonuç hesaplarına intikal ettirildiği yıldır (2026). Üç dönem ''izleyen'' dönemlerden sayılır: 2027, 2028 ve 2029.'
    celdiriciler:
      A: Taşıma hakkı yalnız cari dönemle sınırlı değildir; izleyen üç hesap dönemi boyunca kullanılabilir.
      B: Bu tarih, yalnızca bir sonraki dönemi gösterir; kanun izleyen üçüncü hesap dönemi sonunu öngörür.
      C: Bu tarih, süreyi kazancın elde edildiği 2025 yılından başlatmaktadır; oysa başlangıç intikal dönemi olan 2026'dır.
      E: Süre, intikal dönemini izleyen üçüncü hesap dönemi sonunda (2029) biter; bir dönem daha eklenemez.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/4
    alinti: Bu sınır dahilinde, ilgili bulunduğu kazancın Türkiye’de genel sonuç hesaplarına intikal ettirildiği hesap döneminde
      tamamen veya kısmen indirilemeyen vergiler, bu dönemi izleyen üçüncü hesap dönemi sonuna kadar indirim konusu yapılabilir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 33.2
    alinti: Aşağıda yer alan sınırlamalar asıl olmak kaydıyla, zarar mahsubu veya istisnalar sonucu ilgili yılda Türkiye’de
      vergiye tabi kurum kazancının oluşmaması nedeniyle, Türkiye’deki beyannamelere dahil edilen yurt dışı kazançlar üzerinden
      mahallinde ödenen vergilerin kısmen veya tamamen mahsubuna imkan bulunmazsa, bu mahsup hakkı izleyen üçüncü hesap dönemi
      sonuna kadar kullanılabilecektir.
