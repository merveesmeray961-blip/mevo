  tip: kavrama
  zorluk: 3
  kok: Tam mükellef (M) A.Ş., yurt dışı kazancına ilişkin olarak yabancı ülkede ödenen vergileri gösterir belgeleri tarhiyat
    sırasında ibraz edememiştir. 5520 sayılı Kanun'un 33. maddesine göre bu durumda aşağıdakilerden hangisi **doğrudur**?
  secenekler:
    A: Belgeler tarhiyat sırasında ibraz edilemediği için yurt dışı vergi mahsup hakkı tamamen kaybolur; belgeler daha sonra
      ibraz edilse bile mahsup hakkı yeniden doğmaz ve tarhiyat, mücbir sebep bulunsa bile hiçbir değişikliğe uğramadan aynen
      kesinleşir.
    B: Yabancı ülkede ödenen vergi, kurumlar vergisi oranını aşmamak şartıyla o ülkenin oranından hesaplanır, tarhiyatın bu
      tutara isabet eden kısmı ertelenir; belgeler tarhtan itibaren en geç bir yılda ibraz edilirse tarhiyat düzeltilir.
    C: Tarhiyatın tamamı süresiz olarak ertelenir; belgeler mükellef tarafından istenildiği zaman ibraz edilebilir ve ibraz
      ne zaman yapılırsa yapılsın tarhiyat, belgelerde yazılı kesin tutara göre her zaman düzeltilir.
    D: Yabancı ülkede ödenen vergi o ülkenin oranından hesaplanıp tarhiyat ertelenir; ancak belgeler tarh tarihinden itibaren
      en geç altı ay içinde ibraz edilirse tarhiyat belgelerdeki kesin tutara göre düzeltilir, bu süre geçtikten sonra düzeltme
      yapılmaz.
    E: Mücbir sebep olmaksızın belgelerin süre içinde ibraz edilmemesi halinde ertelenen vergiler için ayrıca vergi ziyaı
      cezası ve Vergi Usul Kanunu'na göre gecikme faizi hesaplanır.
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 33/7''ye göre belgelerin tarhiyat sırasında ibraz edilememesi halinde yabancı ülkede ödenen veya
      ödenecek vergi, 32. maddedeki oranı aşmamak şartıyla o ülkedeki oran üzerinden hesaplanır, tarhiyatın bu tutara isabet
      eden kısmı ertelenir ve belgeler tarhtan itibaren en geç bir yıl içinde ibraz edilirse tarhiyat kesin tutara göre düzeltilir.
      Mücbir sebep olmaksızın belgeler süresinde ibraz edilmezse ertelenen vergiler için 6183 sayılı Kanun hükümlerine göre
      gecikme zammı hesaplanır (md. 33/8). Püf noktaları: süre bir yıldır; ceza değil gecikme zammı söz konusudur.'
    celdiriciler:
      A: Kanun mahsup hakkını tamamen kaybettirmez; belgelerin sonradan ibrazına imkân tanıyarak ilgili tutara isabet eden
        tarhiyatı ertelemektedir.
      C: Erteleme yalnızca yabancı ülke oranı üzerinden hesaplanan tutara isabet eden tarhiyat için söz konusudur ve belgelerin
        ibrazı için en geç bir yıllık süre vardır.
      D: Belgelerin ibraz süresi altı ay değil, tarh tarihinden itibaren en geç bir yıldır.
      E: Ertelenen vergiler için hesaplanacak olan, VUK gecikme faizi değil, 6183 sayılı Kanun hükümlerine göre gecikme zammıdır.
