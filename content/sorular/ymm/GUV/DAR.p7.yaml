- id: YMM-GUV-DAR-0034
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: yurt dışı kâr payı üzerinden ödenen vergilerin mahsubu ve devri
  tip: uygulama
  zorluk: 3
  kok: Hesap dönemi takvim yılı olan tam mükellef (K) A.Ş., 2026 yılında Almanya'da kurulu (Z) GmbH'nin sermayesinin %30'unu
    satın almış ve 8 ay sonra (Z) GmbH'den net 600.000 TL kâr payı tahsil etmiştir. Kâr payına kaynak olan kazançlar üzerinden
    Almanya'da ödenen gelir ve kurumlar vergisi benzeri vergilerin bu kâr payına isabet eden kısmı 400.000 TL'dir; gerekli
    belgeler sunulmuştur. (K) A.Ş.'nin iştirak kazancı istisnası şartlarını sağlamadığı, kurumlar vergisi oranının %25 olduğu
    ve başka kazancı bulunmadığı kabul edildiğine göre, bu kâr payı nedeniyle (K) A.Ş.'nin 2026 yılında ödeyeceği kurumlar
    vergisi ve izleyen hesap dönemlerinde indirilebilecek yurt dışı vergi tutarı sırasıyla aşağıdakilerden hangisidir?
  secenekler:
    A: 0 TL ödenir; 250.000 TL sonraki dönemlerde indirim konusu yapılabilir.
    B: 0 TL ödenir; 150.000 TL sonraki yıllarda indirilebilir.
    C: 0 TL ödenir; 150.000 TL işletmeye nakden iade edilir.
    D: 150.000 TL ödenir; kalan yurt dışı vergi devredilemez.
    E: 250.000 TL ödenir; yurt dışı vergi mahsup edilemez.
  dogru: B
  aciklama:
    dogru_neden: 'Kazanca ilave edilen kâr payı, yurt dışında ödenen vergiler dahil edilerek bulunur: 600.000 + 400.000 =
      1.000.000 TL (md. 33/3). Hesaplanan kurumlar vergisi 1.000.000 × %25 = 250.000 TL''dir. Mahsup edilecek vergi, yurt
      dışı kazanca %25 oranının uygulanmasıyla bulunan tutarı (250.000 TL) aşamaz (md. 33/4); dolayısıyla 250.000 TL mahsup
      edilir ve ödenecek vergi 0 TL olur. Mahsup edilemeyen 400.000 − 250.000 = 150.000 TL, ilgili dönemi izleyen üçüncü hesap
      dönemi sonuna kadar indirim konusu yapılabilir. Püf noktaları: kâr payını brütleştirmeyi unutmayın; mahsup sınırı brüt
      kâr payı üzerinden hesaplanır.'
    celdiriciler:
      A: Kâr payı brüt tutar yerine net 600.000 TL üzerinden kazanca ilave edilmiş, bu nedenle devreden tutar 250.000 TL bulunmuştur;
        oysa yurt dışında ödenen vergiler kâr payına dahil edilir.
      C: Mahsup edilemeyen yurt dışı vergi iade edilmez; ilgili dönemi izleyen üçüncü hesap dönemi sonuna kadar indirim konusu
        yapılabilir.
      D: Mahsup, brüt kâr payına %25 oranı uygulanarak bulunan 250.000 TL'ye kadar yapılabilir; ayrıca fazla kalan vergi devredilebilir.
      E: Sermayenin %25'ine sahip olunan yurt dışı iştirakten elde edilen kâr payları için ödenen yurt dışı vergilerin mahsubu
        mümkündür; kâr payı 8 ay elde tutulmuş olsa da mahsup hakkı doğar.
    hesap_adimlari:
    - Brüt kâr payı = 600.000 + 400.000 = 1.000.000 TL
    - Hesaplanan kurumlar vergisi = 1.000.000 × %25 = 250.000 TL; mahsup sınırı = 250.000 TL
    - Mahsup = min(400.000; 250.000) = 250.000 TL; ödenecek vergi = 0 TL
    - Devreden yurt dışı vergi = 400.000 − 250.000 = 150.000 TL (izleyen üçüncü hesap dönemi sonuna kadar)
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: (3) Tam mükellef kurumların doğrudan veya dolaylı olarak sermayesi veya oy hakkının % 25’ine sahip olduğu yurt
      dışı iştiraklerinden elde ettikleri kâr payları üzerinden Türkiye’de ödenecek kurumlar vergisinden, iştiraklerin bulunduğu
      ülkelerdeki kâr payı dağıtımına kaynak oluşturan kazançlar üzerinden ödenen gelir ve kurumlar vergisi benzeri vergilerin
      kâr payı tutarına
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: Kazanca ilave edilen kâr payı, bu kazançlar üzerinden yurt dışında ödenen gelir ve kurumlar vergisi benzeri vergiler
      dahil edilmek suretiyle dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/4
    alinti: (4) Yurt dışı kazançlar üzerinden Türkiye’de tarh olunacak vergilere mahsup edilebilecek tutar, hiç bir surette
      yurt dışında elde edilen kazançlara Kanunun 32 nci maddesinde belirtilen kurumlar vergisi oranının uygulanmasıyla bulunacak
      tutardan fazla olamaz. Bu sınır dahilinde, ilgili bulunduğu kazancın Türkiye’de genel sonuç hesaplarına intikal ettirildiği
