    madde: md. 25/5
    alinti: (5) Beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın birinci gününden yirmibeşinci günü akşamına
      kadar, tarhiyatın muhatabının Türkiye’yi terk etmesi halinde ise ülkeyi terk etmesinden önceki onbeş gün içinde verilir.
