    C: Yabancı firmanın mağaza veya depolarında onun hesabına konsinye satmak üzere devamlı mal bulunduran kişi
    D: Hizmet veya vekâlet akdi ile bağlı olmaksızın, bağımsız çalışarak yalnızca bir kez ticari muamele yapan aracı
    E: Yabancı firmanın ürünlerini yalnızca fuarlarda tanıtan, ticari muamele yapma yetkisi bulunmayan geçici personeli
