- id: YMM-GUV-DAR-0036
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: dar mükellefiyette beyan ve ödeme süreleri
  tip: kavrama
  zorluk: 3
  kok: 'Dar mükellefiyete tâbi kurumların kurumlar vergisinin beyanı ve ödenmesine ilişkin aşağıdaki ifadelerden hangileri
    **doğrudur**?


    I. Yıllık beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın birinci gününden yirmibeşinci günü akşamına kadar
    verilir.

    II. Yıllık beyanname ile bildirilen kurumlar vergisi, beyannamenin verildiği ayın sonuna kadar ödenir.

    III. Muhtasar beyanname ile bildirilen kesintiler, beyannamenin verildiği ayı izleyen ayın yirmialtıncı günü akşamına
    kadar ödenir.

    IV. Özel beyannameyle bildirilen vergiler, beyanname verme süresinin bitiminden itibaren bir ay içinde ödenir.'
  secenekler:
    A: I ve III
    B: II ve IV
    C: III ve IV
    D: I ve II
    E: I, II ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Yıllık beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın 1''inden 25''inci günü akşamına kadar
      verilir (md. 25/5); yıllık beyannameyle bildirilen vergi beyannamenin verildiği ayın sonuna kadar ödenir (md. 29/1-a).
      Muhtasar beyannameyle bildirilen vergi beyannamenin verildiği ayın yirmialtıncı günü akşamına, özel beyannameyle bildirilen
      vergi ise beyanname verme süresi içinde ödenir (md. 29/1-b ve c). Dolayısıyla I ve II doğru, III ve IV yanlıştır. Püf
      noktaları: ödeme süreleri ''izleyen ay'' ifadesiyle değil, beyannamenin verildiği ayla ilişkilendirilmiştir.'
    celdiriciler:
      A: 'III numaralı ifade yanlıştır: muhtasar beyannameyle bildirilen vergi, beyannamenin verildiği ayın yirmialtıncı günü
        akşamına kadar ödenir; izleyen aya sarkan bir süre yoktur.'
      B: 'IV numaralı ifade yanlıştır: özel beyannameyle bildirilen vergiler, beyanname verme süresi içinde ödenir; bir aylık
        ek süre tanınmamıştır.'
      C: İki ifade de yanlıştır; muhtasar beyanname için beyan ayının 26'ncı günü, özel beyanname için beyanname verme süresi
        esastır.
      E: IV numaralı ifade yanlıştır; özel beyannameyle bildirilen vergiler ayrıca bir aylık süre tanınmaksızın beyanname
        verme süresi içinde ödenir.
  kaynaklar:
