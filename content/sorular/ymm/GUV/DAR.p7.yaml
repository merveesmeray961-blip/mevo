        ödenmesi' halinin dışında bırakılmıştır.
      B: Bir kimsenin birkaç kişiyi aynı zamanda temsil etmesi daimî temsilcilik vasfını değiştirmez; temsil edilenlerin her
        biri bakımından daimî temsilcilik sürebilir.
      D: Daimî temsilci, hizmet veya vekâlet akdiyle temsil edilene bağlı olan kişidir; bu tür bağımsız ve tek seferlik aracı,
        sayılan hallerden hiçbirine girmez.
      E: Kanunda sayılan üç haldeki unsurlardan hiçbirini taşımaz; yetkisiz ve geçici tanıtım personeli kendiliğinden daimî
        temsilci sayılmaz.
  kaynaklar:
