- id: YMM-GUV-DAR-0033
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: dar mükellefiyette özel beyan zamanı ve beyanname verilecek yer
  tip: uygulama
  zorluk: 3
  kok: Kanuni ve iş merkezi Yunanistan'da bulunan, Türkiye'de iş yeri, daimî temsilcisi ve temsilcisi olmayan (Y) Denizcilik
    S.A., Türkiye ile Mısır arasında arızî olarak yaptığı bir taşımacılık faaliyetinde yükü 6/7/2026 tarihinde İzmir limanında
    gemiye almış ve bu taşımadan kazanç elde etmiştir. Taşıma sözleşmesi Atina'da imzalanmış, navlun bedeli İstanbul'daki
    bir bankadan ödenmiştir. Bu kazançla ilgili kurumlar vergisi beyannamesinin verilme zamanı ve verileceği yer bakımından
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Beyanname 6/7/2026 tarihinden itibaren on beş gün içinde, yükün gemiye alındığı yer olan İzmir'deki vergi dairesine
      verilir.
    B: Beyanname 6/7/2026 tarihinden itibaren on beş gün içinde, navlun ödemesinin yapıldığı İstanbul'daki vergi dairesine
      verilir.
    C: Beyanname 2027 yılı Nisan ayının 1'inden 25'inci günü akşamına kadar, İzmir'deki vergi dairesine verilir.
    D: Beyanname 6/7/2026 tarihinden itibaren bir ay içinde, taşıma sözleşmesinin imzalandığı yer olan Atina'daki Türk konsolosluğu
      aracılığıyla verilir.
    E: Beyanname 21/7/2026 tarihine kadar, Maliye Bakanlığınca belirlenecek herhangi bir vergi dairesine verilir.
  dogru: A
  aciklama:
    dogru_neden: 'Dar mükellefiyete tabi yabancı kurumun vergiye tabi kazancı GVK''daki diğer kazanç ve iratlardan ibaret
      ise kazançlar elde edilme tarihinden itibaren on beş gün içinde beyan edilir (md. 26/1). Arızî olarak Türkiye ile yabancı
      ülkeler arasında yapılan taşımacılıkta beyanname, yolcu veya yükün taşıta alındığı yerin vergi dairesine verilir (md.
      27/1-d). Yük İzmir''de alındığından beyanname İzmir''deki vergi dairesine, 6/7/2026 + 15 gün = 21/7/2026''ya kadar verilir.
      Püf noktaları: sözleşme yeri ve ödeme yeri, taşımacılıkta yer ölçütü değildir; yıllık beyan süresi (Nisan) bu hallerde
      uygulanmaz.'
    celdiriciler:
      B: Ödemenin yapıldığı yer, taşımacılık dışındaki bazı gelirler (ör. terk edilen işlerle ilgili kazançlar) için esastır;
        arızî taşımacılıkta yer ölçütü yolcu veya yükün taşıta alındığı yerdir.
      C: Yıllık beyan süresi yıllık beyan esasında vergilendirilen mükellefler içindir; özel beyan zamanı tayin olunan gelirlerde
        kazancın elde edilmesinden itibaren on beş gün içinde beyan zorunludur.
      D: Beyanname bir ay içinde değil on beş gün içinde verilir ve sözleşmenin imza yerine göre belirlenen bir yer ölçütü
        yoktur; beyan Türkiye'deki ilgili vergi dairesine yapılır.
      E: Süre doğru bulunmuş olsa da yer ölçütü yanlıştır; taşımacılık kazançlarında beyannamenin verileceği yer kanunda yükün
        taşıta alındığı yer olarak belirlenmiştir ve Bakanlık belirlemesi yalnızca diğer hallerde söz konusudur.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 26/1
    alinti: MADDE 26- (1) Dar mükellefiyete tâbi olan yabancı kurumların vergiye tâbi kazancının Gelir Vergisi Kanununda yazılı
      diğer kazanç ve iratlardan (telif, imtiyaz, ihtira, işletme, ticaret unvanı, marka ve benzeri gayrimaddî hakların satışı,
      devir ve temliki karşılığında alınan bedeller hariç) ibaret bulunması halinde, yabancı kurum veya Türkiye’de adına hareket
      eden kimse, bu kazançları elde edilme tarihinden itibaren onbeş gün içinde Kanunun 27 nci maddesinde belirtilen vergi
      dairesine beyanname ile bildirmek zorundadır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 27/1-d
    alinti: d) Arızî olarak Türkiye ile yabancı ülkeler arasında yapılan taşımacılık faaliyetlerinden elde edilen kazançlarda
      yolcu veya yükün taşıta alındığı,
