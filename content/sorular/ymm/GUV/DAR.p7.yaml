  konu: DAR
  kazanim: dar mükellefiyette kesinti ve geçici vergi mahsubu
  tip: hesaplama
  zorluk: 3
  kok: Türkiye'deki şubesi (iş yeri) aracılığıyla ticari faaliyette bulunan, hesap dönemi takvim yılı olan dar mükellef (G)
    GmbH'nin 2026 yıllık kurumlar vergisi beyannamesi üzerinden hesaplanan kurumlar vergisi 1.200.000 TL'dir. Şube, 2026 yılı
    geçici vergi dönemleri için toplam 900.000 TL geçici vergi tahakkuk ettirmiş, bunun 700.000 TL'sini ödemiş, 200.000 TL'sini
    ödememiştir. Ayrıca beyannamede gösterilen banka mevduat faizlerinden 5520 sayılı Kanun'un 15. maddesinin birinci fıkrası
    uyarınca kaynağında kesilen vergi 100.000 TL olup bu tutar geçici vergi beyannamelerinde mahsup edilmemiştir. Yıllık beyanname
    üzerinden şubenin ödeyeceği kurumlar vergisi kaç TL'dir?
  secenekler:
    A: 200.000 TL
    B: 300.000 TL
    C: 400.000 TL
    D: 500.000 TL
    E: 1.100.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Beyannamede gösterilen kazançlardan KVK md. 15/1 ve md. 30/1-2 uyarınca kaynağında kesilmiş vergiler, hesaplanan
      kurumlar vergisinden mahsup edilir (md. 34/1). Tahakkuk ettirilen geçici verginin ise yalnızca ödenen kısmı mahsup edilir
      (md. 34/4). Ödenecek vergi = 1.200.000 − 700.000 − 100.000 = 400.000 TL. Ödenmeyen 200.000 TL geçici vergi mahsup konusu
      olmaz. Püf noktaları: geçici vergide ''tahakkuk'' değil ''ödenen'' tutar esastır.'
    celdiriciler:
      A: Tahakkuk eden geçici verginin ödenmeyen 200.000 TL'lik kısmı da mahsup edilmiştir; yıllık beyanda yalnızca ödenen
        kısım mahsup edilir.
      B: Kaynağında kesilen 100.000 TL mahsup edilmemiştir ve geçici verginin tahakkuk eden 900.000 TL'sinin tamamı düşülmüştür;
        her iki yaklaşım da yanlıştır.
      D: Yalnızca ödenen geçici vergi (700.000 TL) mahsup edilmiş, beyannamede gösterilen kazançlardan kesilmiş 100.000 TL'lik
        vergi unutulmuştur.
      E: Ödenen geçici vergi hiç mahsup edilmemiş, yalnızca kesinti düşülmüştür; oysa geçici verginin ödenen kısmı yıllık
        beyanname üzerinden hesaplanan vergiden mahsup edilir.
    hesap_adimlari:
    - Mahsup edilecek geçici vergi = yalnızca ödenen kısım = 700.000 TL
    - Mahsup edilecek kaynakta kesilen vergi = 100.000 TL
    - Ödenecek vergi = 1.200.000 − 700.000 − 100.000 = 400.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 34/1
    alinti: MADDE 34- (1) Beyannamede gösterilen kazançlardan, Kanunun 15 inci maddesinin birinci fıkrasına ve 30 uncu maddesinin
      birinci ve ikinci fıkralarına göre kaynağında kesilmiş olan vergiler (hayat sigorta şirketlerinde matematik karşılıkların
      yatırıma yönlendirilmesinden elde edilen kazanç ve iratlar üzerinden yapılan kesintiler dahil), beyanname üzerinden
      hesaplanan kurumlar vergisinden mahsup edilir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 34/4
    alinti: İlgili hesap dönemine ilişkin tahakkuk ettirilen geçici verginin sadece ödenen kısmı yıllık kurumlar vergisi beyannamesi
      üzerinden hesaplanan kurumlar vergisinden mahsup edilir.
