- id: YMM-GUV-DAR-0031
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Dar mükellefiyet ve uluslararası vergilendirme
  konu: DAR
  kazanim: yabancı memleketlerde ödenen vergilerin mahsubu (gelir vergisi)
  tip: hesaplama
  zorluk: 3
  kok: Türkiye'de yerleşmiş (tam mükellef) Bay (Y)'nin 2026 yılı gelirleri toplamı 3.000.000 TL olup bunun 2.000.000 TL'si
    Türkiye'de, 1.000.000 TL'si Almanya'daki gayrimenkul sermaye iradından elde edilmiştir. Yıllık beyanname üzerinden hesaplanan
    gelir vergisi 900.000 TL'dir. Almanya'da bu iradın gelirine isabet eden ve gelir üzerinden alınan şahsi vergi 400.000
    TL olarak ödenmiş, ödeme gerekli resmî belgelerle tevsik edilmiştir. Başka mahsup edilecek vergi yoktur. Bay (Y) beyanname
    üzerinden kaç TL gelir vergisi ödeyecektir?
  secenekler:
    A: 300.000 TL
    B: 450.000 TL
    C: 500.000 TL
    D: 600.000 TL
    E: 900.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 123''e göre yabancı memlekette ödenen vergi, Türkiye''de tarh edilen gelir vergisinin yabancı kazanca
      isabet eden kısmından indirilir; bu kısım, yabancı kazancın gelire oranı üzerinden bulunur. İsabet eden vergi = 900.000
      × (1.000.000/3.000.000) = 300.000 TL. Yurt dışında ödenen 400.000 TL bu tutarı aştığından indirilecek miktar 300.000
      TL''dir; fark dikkate alınmaz. Ödenecek vergi = 900.000 − 300.000 = 600.000 TL. Püf noktaları: mahsup sınırı, hesaplanan
      verginin yabancı kazanca düşen payıdır; fazla kısım ne iade edilir ne devreder.'
    celdiriciler:
      A: Yabancı kaynaklı gelirin gelire oranı yanlışlıkla Türkiye gelirine göre (2/3) alınmış, böylece Türkiye'de indirilebilecek
        kısım 600.000 TL sayılmıştır.
      B: Yabancı kazancın gelire oranı yerine Türkiye kazancına oranı (1/2) esas alınmış, isabet eden vergi 450.000 TL bulunmuştur.
      C: Yurt dışında ödenen 400.000 TL'nin tamamı indirilmiştir; oysa indirilecek tutar yabancı gelire isabet eden vergi
        kısmını (300.000 TL) aşamaz.
      E: Yurt dışında ödenen vergi hiç dikkate alınmamıştır; GVK md. 123 tam mükelleflerin yabancı ülkede ödedikleri benzeri
        vergilerin indirilmesini öngörür.
    hesap_adimlari:
    - Yabancı kazancın gelire oranı = 1.000.000 / 3.000.000 = 1/3
    - Gelir vergisinin yabancı kazanca isabet eden kısmı = 900.000 × 1/3 = 300.000 TL
    - İndirilecek tutar = min(400.000; 300.000) = 300.000 TL
    - Ödenecek gelir vergisi = 900.000 − 300.000 = 600.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 123
    alinti: Madde 123 – Tam mükellefiyete tabi mükelleflerin yabancı memleketlerde elde ettikleri kazanç ve iratlardan mahallinde
      ödedikleri benzeri vergiler, Türkiye'de tarh edilen Gelir Vergisinin yabancı memleketlerde elde edilen kazanç ve iratlara
      isabet eden kısmından indirilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 123
    alinti: Birinci fıkra hükmünce indirilecek miktar Gelir Vergisinin yabancı memleketlerde elde edilen kazanç ve iratlara
      isabet eden kısmından fazla olduğu takdirde, aradaki fark nazara alınmaz.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 123
    alinti: Gelir Vergisinin yabancı memlekette elde edilen kazanç ve iratlara isabet eden kısmı, bunların gelire olan nispeti
      üzerinden hesaplanır.
  gecerlilik:
    baslangic: '1961-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'isabet = 900000*(1000000/3000000)

      sonuc = round(900000 - min(400000, isabet))'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
