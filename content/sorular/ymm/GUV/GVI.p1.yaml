- id: YMM-GUV-GVI-0001
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: muafiyet ve istisnalar
  tip: kavrama
  zorluk: 2
  kok: 'I. Muafiyet mükellefiyetin kişi bakımından kapsamıyla ilgilidir.

    II. İstisna, belirli bir kazanç veya iradı vergi dışında bırakabilir.

    III. Her istisna, mükellefin tüm gelirlerini vergiden çıkarır.

    GVK sistematiği bakımından hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: I ve II ayrımı doğrudur; istisna belirli gelir unsuruna ilişkin olabilir, bütün gelirleri kendiliğinden kapsamaz.
    celdiriciler:
      A: II de doğrudur.
      B: I de doğrudur.
      D: III yanlıştır.
      E: III yanlıştır.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 6
    alinti: "Türkiyede yerleşmiş olmayan gerçek kişiler sadece Türkiye'de elde ettikleri kazanç ve\niratlar üzerinden vergilendirilirler.\n\
      \n        Kazanç veya iradın Türkiye'de elde edilmesi:\n        Madde 7 – (Değişik: 27/3/1969-1137/1 md.) Da"
  gecerlilik:
    baslangic: '1961-01-06'
    bitis: null
    yila_bagli_tutar: false
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: coklu'
    istem_surumu: uretici paketi toplu-2026-10-07
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: kaldi
        tarih: '2026-10-11'
        not: III bariz yanlış ('her istisna tüm gelirleri'); kavramsal düzey çok basit
