      ikametgâhı ve vergi mükellefiyeti bulunmayan kişilerin Türkiye dışında elde ettiği kazanç ve iratlar yirmi yıl boyunca
      istisnadır. Bu süre içinde Türkiye''de yalnızca gayrimenkul sermaye iradı, menkul sermaye iradı veya değer artışı kazancı
      nedeniyle mükellefiyet bulunması istisnaya engel değildir (I doğru). İstisna kapsamındaki gelirler yıllık beyannameye
      dahil edilmez (IV doğru). Püf noktaları: İstisna yalnız Türkiye dışında elde edilen gelirleri kapsar; Türkiye''deki
      kira geliri genel hükümlere göre vergilenir. ''Son üç yılda mükellefiyet olmaması'' şartının istisnası olan ikinci fıkrayı
      ve yabancı vergilerin mahsup yasağını birlikte değerlendirin.'
