      Püf noktaları: Banu''nun toplam ücreti 5.300.000 TL''nin altında olsa da iki şartın birlikte sağlanması gerekir; ikinci
      ve sonraki işverenden alınanlar 400.000 TL''yi aşınca beyan zorunludur. Derya için 22.000 TL''lik sınır değil, mesken
      istisnası esas alınır; 22.000 TL sınırı yalnız tevkifata ve istisnaya konu olmayan iratlar içindir.'
