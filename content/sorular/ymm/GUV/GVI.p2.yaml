    alinti: Yıllık beyannamede gösterilen gelire dahil kazanç ve iratlardan bu Kanuna göre kesilmiş bulunan vergiler, beyanname
      üzerinden hesaplanan Gelir Vergisine mahsubedilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
