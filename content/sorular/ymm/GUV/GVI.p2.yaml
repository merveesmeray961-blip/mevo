- id: YMM-GUV-GVI-0010
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: gelirin toplanması ve indirimler
  tip: hesaplama
  zorluk: 2
  kok: 'Serbest meslek erbabı Okan Bey''in 2026 yılı için beyan ettiği gelir 1.000.000 TL''dir; geçmiş yıl zararı yoktur.
    Okan Bey 2026 yılında aşağıdaki ödemeleri yapmış ve belgelendirmiştir:


    - Kendisi ve küçük çocuğu için Türkiye''de yapılan ve gelir vergisi mükelleflerinden alınan belgelerle tevsik edilen eğitim
    ve sağlık harcamaları: 90.000 TL

    - Eşinin yurt dışındaki bir klinikte yaptırdığı tedavinin bedeli: 30.000 TL

    - Kamu yararına çalışan bir derneğe makbuz karşılığı nakdi bağış: 70.000 TL

    - Türkiye Kızılay Derneğine makbuz karşılığı nakdi bağış: 30.000 TL


    Oransal sınırlar 1.000.000 TL''lik beyan edilen gelir üzerinden hesaplanacaktır. Buna göre Okan Bey''in 2026 yılı gelir
    vergisi matrahı kaç TL''dir?'
  secenekler:
    A: '780.000'
    B: '810.000'
    C: '820.000'
    D: '830.000'
    E: '860.000'
  dogru: D
  aciklama:
    dogru_neden: 'Eğitim ve sağlık harcamaları Türkiye''de yapılması şartıyla beyan edilen gelirin %10''unu (100.000 TL) aşmamak
      üzere indirilir; yurt dışındaki tedavi bedeli indirilemez, Türkiye''deki 90.000 TL sınırın altındadır. Kamu yararına
      çalışan derneğe bağış %5 ile (50.000 TL) sınırlıdır. Türkiye Kızılay Derneğine yapılan nakdi bağışın tamamı indirilir
      (md.89/1-11). İndirimler: 90.000 + 50.000 + 30.000 = 170.000 TL; matrah = 1.000.000 − 170.000 = 830.000 TL.'
    celdiriciler:
      A: 'Hiçbir sınır ve şart uygulanmamıştır: 1.000.000 − (90.000 + 30.000 + 70.000 + 30.000) = 780.000.'
      B: 'Dernek bağışına %5 sınırı uygulanmamıştır: 1.000.000 − (90.000 + 70.000 + 30.000) = 810.000.'
      C: 'Yurt dışındaki tedavi bedeli de indirilmiş ve %10 sınırı uygulanmıştır: 1.000.000 − (100.000 + 50.000 + 30.000)
        = 820.000.'
      E: 'Kızılay bağışı da %5 sınırına dahil edilmiştir: 1.000.000 − (90.000 + 50.000) = 860.000.'
    hesap_adimlari:
    - 'Eğitim-sağlık: yalnız Türkiye''deki 90.000 TL; sınır 1.000.000 × %10 = 100.000 TL → 90.000 TL'
    - 'Kamu yararına dernek: 70.000 TL; sınır 1.000.000 × %5 = 50.000 TL → 50.000 TL'
    - 'Kızılay nakdi bağış: tamamı 30.000 TL'
    - 'Matrah: 1.000.000 − (90.000 + 50.000 + 30.000) = 830.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-2
    alinti: 2. Beyan edilen gelirin % 10’unu aşmaması, Türkiye’de yapılması ve gelir veya kurumlar vergisi mükellefiyeti bulunan
      gerçek veya tüzel kişilerden alınacak belgelerle tevsik edilmesi şartıyla, mükellefin kendisi, eşi ve küçük çocuklarına
      ilişkin olarak yapılan eğitim ve sağlık harcamaları
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-4
    alinti: 4. Genel ve özel bütçeli kamu idareleri, il özel idareleri, belediyeler, köyler ile kamu yararına çalışan dernekler
      ve Cumhurbaşkanınca vergi muafiyeti tanınan vakıflara yıllık toplamı beyan edilecek gelirin % 5’ini (kalkınmada öncelikli
      yöreler için % 10’unu) aşmamak üzere, makbuz karşılığında yapılan bağış ve yardımlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-11
    alinti: İktisadi işletmeleri hariç, Darülacezeye, Türkiye Kızılay Derneğine ve Türkiye Yeşilay Cemiyetine makbuz karşılığı
      yapılan nakdi bağış ve yardımların tamamı.
  gecerlilik:
    baslangic: '2009-07-03'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'gelir = 1000000

      egitim = min(90000, gelir * 0.10)

      dernek = min(70000, gelir * 0.05)

      kizilay = 30000

      sonuc = gelir - egitim - dernek - kizilay'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-1
    kapilar:
      G2:
