    İstanbul''daki dairesini kiraya verdiği için 2023–2025 yıllarında Türkiye''de gayrimenkul sermaye iradı nedeniyle mükellefiyeti
    bulunmuştur. Mark, Mart 2026''da ikametgâhını İstanbul''a taşımış ve Türkiye''de yerleşmiş sayılmıştır. Mark''ın 2026
    yılı gelirleri ile ilgili olarak GVK mükerrer 20/D maddesi bakımından aşağıdaki ifadelerden hangileri doğrudur?


    I. Londra''daki dairesinden elde ettiği kira geliri istisna kapsamındadır; daha önce Türkiye''de gayrimenkul sermaye iradı
    nedeniyle mükellefiyetinin bulunması istisnaya engel değildir.

    II. İstanbul''daki dairesinden elde ettiği kira geliri de yirmi yıl boyunca istisna kapsamındadır.

    III. Londra''daki kira geliri için İngiltere''de ödediği vergiyi, Türkiye''de tarh edilen gelir vergisinden mahsup edebilir.

    IV. İstanbul''daki kira geliri için yıllık beyanname verdiğinde, Londra''daki kira gelirini bu beyannameye dahil etmez.'
