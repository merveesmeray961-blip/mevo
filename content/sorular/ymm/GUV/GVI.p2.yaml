- id: YMM-GUV-GVI-0012
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: vergi tarifesi
  tip: hesaplama
  zorluk: 3
  kok: 'Ticari kazancını bilanço esasına göre tespit eden Murat Bey''in 2026 yılına ilişkin bilgileri şöyledir:


    - Ticari kazanç: 900.000 TL

    - Ticari işletmesine dahil olmayan ve bir şirkete kiraladığı işyerinden tahsil ettiği brüt kira: 400.000 TL (kiracı şirketin
    yaptığı tevkifat 80.000 TL; Murat Bey götürü gider usulünü seçmiştir)

    - İşletmesine dahil olmayan limited şirket ortaklık payının satışından doğan zarar: 50.000 TL

    - Kamu yararına çalışan bir derneğe makbuz karşılığı yaptığı nakdi bağış: 80.000 TL

    - 2026 yılı dönemleri için tahakkuk ettirilip ödenen geçici vergi: 90.000 TL


    2026 yılı gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için
    28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si
    için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL, fazlası %40. Murat Bey''in
    geçmiş yıl zararı yoktur ve mükerrer 121. maddedeki vergi indiriminden yararlanmamaktadır. Buna göre Murat Bey''in 2026
    yılı yıllık beyannamesi üzerinden ödemesi gereken gelir vergisi kaç TL''dir?'
  secenekler:
    A: '108.175'
    B: '118.500'
    C: '124.800'
    D: '144.750'
    E: '204.800'
  dogru: C
  aciklama:
    dogru_neden: 'Gayrimenkul sermaye iradı: 400.000 − %15 götürü gider = 340.000 TL. Ortaklık payı satış zararı md.80''deki
      diğer kazanç ve iratlardan doğduğundan diğer gelirlerden mahsup edilemez (md.88). Beyan edilen gelir: 900.000 + 340.000
      = 1.240.000 TL. Bağış indirimi %5 ile sınırlıdır: 62.000 TL. Matrah: 1.178.000 TL. Hesaplanan vergi: 232.500 + (178.000
      × %35) = 294.800 TL. Kiracının yaptığı tevkifat (md.121) ve ödenen geçici vergi (mük. md.120) mahsup edilir: 294.800
      − 80.000 − 90.000 = 124.800 TL. Püf noktaları: Değer artışı zararını ticari kazançtan düşmek en sık yapılan hatadır;
      md.88 parantez içi hükmüne dikkat edin. Bağış sınırını zarar düşülmemiş beyan edilen gelir üzerinden hesaplayın ve ücret
      dışı gelir tarifesini kullanın.'
    celdiriciler:
      A: 'Değer artışı zararı diğer gelirlerden mahsup edilmiştir: gelir 1.190.000, bağış 59.500, matrah 1.130.500, vergi
        278.175; ödenecek 108.175.'
      B: 'Bağışın tamamı indirilmiştir: matrah 1.160.000, vergi 288.500; ödenecek 118.500.'
      D: 'Götürü gider indirilmemiştir: gelir 1.300.000, bağış 65.000, matrah 1.235.000, vergi 314.750; ödenecek 144.750.'
      E: 'Kira üzerinden yapılan 80.000 TL tevkifat mahsup edilmemiştir: 294.800 − 90.000 = 204.800.'
    hesap_adimlari:
    - 'GMSİ safi: 400.000 − 60.000 = 340.000 TL'
    - 'Değer artışı zararı: mahsup edilmez (md.88)'
    - 'Beyan edilen gelir: 900.000 + 340.000 = 1.240.000 TL'
    - 'Bağış sınırı: 1.240.000 × %5 = 62.000 TL'
    - 'Matrah: 1.240.000 − 62.000 = 1.178.000 TL'
    - 'Vergi: 232.500 + (1.178.000 − 1.000.000) × %35 = 294.800 TL'
    - 'Ödenecek: 294.800 − 80.000 − 90.000 = 124.800 TL'
  kaynaklar:
