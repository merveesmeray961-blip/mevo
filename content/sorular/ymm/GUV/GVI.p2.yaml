    dogru_neden: Md.94'ün birinci fıkrası, ticaret ve serbest meslek erbabından yalnızca 'gerçek gelirlerini beyan etmeye
      mecbur olanları' tevkifat sorumlusu saymıştır. Kazancı basit usulde tespit edilen ticaret erbabı gerçek usulde vergilendirilmediğinden
      bu kapsamda değildir.
    celdiriciler:
      A: Dernek ve vakıfların iktisadi işletmeleri maddede tevkifat sorumluları arasında açıkça sayılmıştır.
      B: Zirai kazancını bilanço veya zirai işletme hesabı esasına göre tespit eden çiftçiler tevkifat sorumlusudur.
      D: İşletme hesabı esasına göre defter tutan tüccar da gerçek usulde vergilendirilir ve gerçek gelirini beyan etmeye
        mecburdur.
      E: İş ortaklıkları md.94'te tevkifat sorumluları arasında sayılmıştır.
