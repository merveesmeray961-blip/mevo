- id: YMM-GUV-GVI-0008
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: muafiyet ve istisnalar
  tip: hesaplama
  zorluk: 2
  kok: 'Türkiye''de yerleşik Serap Hanım''ın 2026 yılında elde ettiği gelirler şunlardır:


    - Tek işverenden aldığı ve tamamı tevkif suretiyle vergilendirilmiş brüt ücret: 1.300.000 TL

    - Konut olarak kiraya verdiği dairesinden 2026 yılında tahsil ettiği kira: 300.000 TL


    Serap Hanım kira geliri için götürü gider usulünü seçmiştir. 2026 yılı için mesken kira geliri istisnası 58.000 TL; 103.
    madde tarifesinin üçüncü gelir diliminde ücret gelirleri için yer alan tutar 1.500.000 TL''dir. Buna göre Serap Hanım''ın
    yıllık beyannameyle beyan edeceği gayrimenkul sermaye iradının safi tutarı kaç TL''dir?'
  secenekler:
    A: '197.000'
    B: '205.700'
    C: '242.000'
    D: '255.000'
    E: '300.000'
  dogru: D
  aciklama:
    dogru_neden: Mesken kira hasılatı istisna haddini (58.000 TL) aştığından ve ücret ile kira gelirinin gayrisafi toplamı
      (1.300.000 + 300.000 = 1.600.000 TL) tarifenin üçüncü diliminde ücret gelirleri için yer alan 1.500.000 TL'yi aştığından
      Serap Hanım mesken istisnasından yararlanamaz (md.21/2). Ücretin beyan dışı olması bu karşılaştırmayı etkilemez; madde
      'beyanı gerekip gerekmediğine bakılmaksızın' gayrisafi tutarları esas alır. Safi irat = 300.000 − (300.000 × %15) =
      255.000 TL.
    celdiriciler:
      A: 'İstisna yanlışlıkla uygulanmış ve götürü gider brüt hasılat üzerinden düşülmüştür: 300.000 − 58.000 − 45.000 = 197.000.'
      B: 'İstisna yanlışlıkla uygulanmış, götürü gider istisna sonrası hasılat üzerinden hesaplanmıştır: 242.000 × %85 = 205.700.'
      C: 'İstisna uygulanmış, götürü gider indirilmemiştir: 300.000 − 58.000 = 242.000.'
      E: 'Götürü gider indirimi yapılmamıştır: 300.000.'
    hesap_adimlari:
    - 'Gayrisafi toplam: 1.300.000 + 300.000 = 1.600.000 TL > 1.500.000 TL → istisna uygulanmaz'
    - 'Götürü gider: 300.000 × %15 = 45.000 TL'
    - 'Safi irat: 300.000 − 45.000 = 255.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 21/2
    alinti: bakılmaksızın ayrı ayrı veya birlikte elde ettiği ücret, menkul sermaye iradı, gayrimenkul sermaye iradı ile diğer
      kazanç ve iratlarının gayri safi tutarları toplamı 103 üncü maddede yazılı tarifenin üçüncü diliminde ücret gelirleri
      için yer alan tutarı aşanlar bu istisnadan faydalanmazlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 74/3
    alinti: Mükellefler (hakları kiraya verenler hariç) diledikleri takdirde yukarıda yazılı giderlere karşılık olmak üzere
      hasılatlarından % 15'ini götürü olarak indirebilirler. Götürü gider usulünü kabul edenler iki yıl geçmedikçe bu usulden
      dönemezler.
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332)'
    madde: md. 3/2-b
    alinti: b) 21 inci maddesinin birinci fıkrasında yer alan mesken kira gelirleri için uygulanan istisna tutarı 58.000 TL,
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'ucret = 1300000

      kira = 300000

      istisna = 0 if ucret + kira > 1500000 else 58000

      matrah = kira - istisna

      sonuc = matrah - matrah * 0.15'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_GUV-1.yaml, satır 11
- id: YMM-GUV-GVI-0009
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: muafiyet ve istisnalar
  tip: kavrama
  zorluk: 2
  kok: 'Roman yazarı Ece Hanım, eserlerinin yayın haklarını yayınevlerine devretmesi karşılığında bedel almaktadır. GVK md.18''deki
    serbest meslek kazançları istisnası bakımından aşağıdaki ifadelerden hangileri doğrudur?


    I. İstisna kapsamındaki bu ödemeler üzerinden yayınevlerinin 94. madde uyarınca tevkifat yapma yükümlülüğü ortadan kalkmaz.

    II. Ece Hanım''ın bu madde kapsamındaki kazançları toplamı, 103. maddedeki tarifenin dördüncü gelir diliminde yer alan
    tutarı aşarsa istisnadan yararlanamaz.

    III. Ece Hanım''ın yalnızca bir roman yazmış olması, yani hasılatın arızi olarak elde edilmesi istisnanın uygulanmasına
    engeldir.

    IV. Ece Hanım''dan romanın telif hakkını satın alan Murat Bey''in bu hakkı başka birine satmasından elde ettiği kazanç
    da bu istisna kapsamındadır.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'I doğrudur: md.18''e göre istisnanın 94. madde uyarınca tevkif suretiyle ödenecek vergiye şümulü yoktur.
      II doğrudur: bu madde kapsamındaki kazançları toplamı tarifenin dördüncü gelir diliminde yer alan tutarı aşanlar istisnadan
      yararlanamaz.'
    celdiriciler:
      B: 'III yanlıştır: kazancın arızi olarak elde edilmesi istisnanın uygulanmasına engel değildir.'
      C: 'IV yanlıştır: istisna müellif, mucit ve kanuni mirasçılarına özgüdür; telif hakkını satın alan üçüncü kişinin bu
        hakkı elden çıkarmasından doğan kazanç değer artışı kazancıdır (mük. md.80/1-3).'
      D: IV yanlıştır; hakkı satın alan kişi müellif olmadığından istisnadan yararlanamaz.
      E: III ve IV yanlış, I ise doğrudur; istisna tevkifatı kapsamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 18/3-4
    alinti: Yukarıda yazılı kazançların arızi olarak elde edilmesi istisna hükmünün uygulanmasına engel teşkil etmez. Serbest
      meslek kazançları istisnasının, bu Kanunun 94 üncü maddesi uyarınca tevkif suretiyle ödenecek vergiye şümulü yoktur.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 18/5
