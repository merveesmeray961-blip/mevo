  kok: 193 sayılı Gelir Vergisi Kanunu'nun 94. maddesine göre, serbest meslek erbabına yaptığı ödemeler üzerinden gelir vergisi
    tevkifatı yapmakla yükümlü **olmayan** aşağıdakilerden hangisidir?
  secenekler:
    A: Bir derneğe ait iktisadi işletme
    B: Zirai kazancını bilanço esasına göre tespit eden çiftçi
    C: Kazancı basit usulde tespit edilen ticaret erbabı
    D: İşletme hesabı esasına göre defter tutan tüccar
    E: İki şirketin bir inşaat işi için kurduğu iş ortaklığı
