  kok: 'Türkiye''de yerleşik dört kişinin 2026 yılında elde ettiği gelirler aşağıda verilmiştir. Kişilerin başka geliri yoktur
    ve tevkifata tabi gelirlerde tevkifat eksiksiz yapılmıştır. 2026 tarifesinde ikinci gelir diliminde yer alan tutar 400.000
    TL, dördüncü gelir diliminde yer alan tutar 5.300.000 TL''dir; mesken kira istisnası 58.000 TL, tevkifata ve istisnaya
    konu olmayan menkul ve gayrimenkul sermaye iratlarına ilişkin beyan sınırı 22.000 TL''dir.


    I. Ahmet: Tek işverenden brüt 4.800.000 TL ücret

    II. Banu: Birinci işverenden brüt 3.000.000 TL, ikinci işverenden brüt 450.000 TL ücret

    III. Cem: Bir şirkete kiraladığı işyerinden brüt 380.000 TL kira

    IV. Derya: Konut olarak kiraya verdiği daireden 50.000 TL kira


