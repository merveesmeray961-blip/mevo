    42 kapsamındaki yıllara yaygın inşaat işlerinden doğan kazançlar hariç) şöyledir:


    | Dönem | Kümülatif matrah |

    |---|---|

    | Ocak–Mart | 600.000 TL |

    | Ocak–Haziran | 400.000 TL |

    | Ocak–Eylül | 1.200.000 TL |


    Birinci dönem için 90.000 TL geçici vergi ödenmiş, ikinci dönemde ödenecek geçici vergi çıkmamıştır. Temmuz–Eylül döneminde
