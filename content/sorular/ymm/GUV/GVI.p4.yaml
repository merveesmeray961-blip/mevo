  tip: hesaplama
  zorluk: 2
  kok: '(A) A.Ş.''nin Mart 2026''da yaptığı ödemeler şöyledir:


    - Serbest avukat Bay (L)''ye net 80.000 TL vekâlet ücreti ödenmiş, kesilmesi gereken vergiyi şirket üstlenmiştir.

    - İşyeri olarak kiraladığı dükkânın sahibi gerçek kişi Bayan (M)''ye net 40.000 TL kira ödenmiş, kesilmesi gereken vergiyi
    şirket üstlenmiştir.

    - Tam mükellef gerçek kişi ortaklarına nakden 200.000 TL brüt kâr payı dağıtılmıştır.

    - 2025 yılı kârından 400.000 TL sermayeye eklenmiştir.


    Tevkifat oranları serbest meslek ödemelerinde ve kira ödemelerinde %20, kâr paylarında %15''tir. GVK md. 94 ve 96''ya
    göre (A) A.Ş.''nin Mart 2026 dönemi için yapacağı toplam gelir vergisi tevkifatı kaç TL''dir?

    '
  secenekler:
    A: '54.000'
    B: '56.000'
    C: '60.000'
    D: '70.000'
    E: '120.000'
  dogru: C
  aciklama:
    dogru_neden: 'Vergi üstlenildiğinde tevkifat, ödenen net tutar ile üstlenilen verginin toplamı üzerinden hesaplanır (md.
      96): avukatlık brüt 80.000 / 0,80 = 100.000, kesinti 20.000; kira brüt 40.000 / 0,80 = 50.000, kesinti 10.000. Kâr payı
      kesintisi 200.000 × %15 = 30.000. Kârın sermayeye eklenmesi kâr dağıtımı sayılmaz. Toplam: 20.000 + 10.000 + 30.000
      = 60.000 TL.'
    celdiriciler:
      A: Avukatlık ve kira kesintileri net tutar üzerinden hesaplanmıştır (16.000 + 8.000 + 30.000).
      B: Avukatlık ödemesinde net tutar esas alınmıştır (16.000 + 10.000 + 30.000).
      D: Kâr payına %20 oranı uygulanmıştır.
      E: Sermayeye eklenen kâr da kâr dağıtımı sayılmıştır (60.000 + 400.000 × %15).
    hesap_adimlari:
    - 'Avukat: 80.000 / 0,80 = 100.000 → 20.000'
    - 'Kira: 40.000 / 0,80 = 50.000 → 10.000'
    - 'Kâr payı: 200.000 × 0,15 = 30.000'
    - 'Sermayeye ekleme: 0'
    - Toplam = 60.000 TL
