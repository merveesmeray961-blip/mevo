- id: YMM-GUV-GVI-0064
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: vergi tarifesi
  tip: hesaplama
  zorluk: 2
  kok: 'Bayan (S)''nin 2026 yılındaki tek geliri iki ayrı işverenden aldığı ücretlerdir; ikinci işverenden alınan ücret beyan
    sınırını aştığından yıllık beyanname vermek zorundadır. Beyan edilen ücretlerin vergi matrahı 2.000.000 TL''dir.


    2026 yılı gelir vergisi tarifesinde (332 Seri No.lu GV Genel Tebliği) ücret gelirleri için: 1.500.000 TL''nin 400.000
    TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.500.000 TL''si için 367.500 TL, fazlası %35''tir. Ücret dışı gelirler
    için ise 5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35''tir.


    Buna göre Bayan (S)''nin 2026 yılı için yıllık beyanname üzerinden hesaplanan gelir vergisi (tevkifat mahsubundan önce)
    kaç TL''dir?

    '
  secenekler:
    A: '502.500'
    B: '542.500'
    C: '582.500'
    D: '700.000'
    E: '717.500'
  dogru: B
  aciklama:
    dogru_neden: 'Matrah yalnız ücretten oluştuğundan tarifenin ücret gelirlerine ilişkin dilimleri uygulanır: 367.500 + (2.000.000
      − 1.500.000) × %35 = 367.500 + 175.000 = 542.500 TL.'
    celdiriciler:
      A: 400.000 TL'yi aşan kısmın tamamına %27 uygulanmıştır (70.500 + 1.600.000 × %27); %27 dilimi ücretlerde 1.500.000
        TL'de biter.
      C: Ücret dışı gelirlere ait dilim kullanılmıştır (232.500 + 1.000.000 × %35).
      D: Matrahın tamamına %35 uygulanmıştır.
      E: Ücret dilimindeki 367.500 TL'lik tutar, ücret dışı dilimin 1.000.000 TL'lik sınırıyla birleştirilmiştir (367.500
        + 1.000.000 × %35).
    hesap_adimlari:
    - 'Ücret tarifesi: 1.500.000 TL''ye kadar 367.500 TL'
    - Aşan 500.000 × %35 = 175.000
    - Vergi = 542.500 TL
  kaynaklar:
  - mevzuat: Gelir Vergisi Genel Tebliği (Seri No 332)
    madde: md. 3/3
    alinti: TL'nin 1.500.000 TL'si için 367.500 TL), fazlası
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = 367500 + (2000000 - 1500000) * 35 / 100
  durum: taslak
