- id: YMM-GUV-GVI-0065
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: gelirin toplanması ve indirimler
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik Bay (T)''nin 2026 yılına ilişkin bilgileri şöyledir:


    - İşletme hesabı esasında defter tuttuğu ticari faaliyetinden zarar: 200.000 TL

    - İşyeri olarak kiraya verdiği dükkândan beyan edilecek safi gayrimenkul sermaye iradı: 900.000 TL

    - İktisabından itibaren iki yıl içinde sattığı arsadan doğan değer artışı zararı: 50.000 TL

    - Kendisi ve küçük çocukları için Türkiye''de yaptığı ve gelir vergisi mükelleflerinden alınan belgelerle tevsik edilen
    eğitim ve sağlık harcamaları: 120.000 TL

    - Kamu yararına çalışan bir derneğe makbuz karşılığı yaptığı bağış: 50.000 TL (kalkınmada öncelikli yöre değildir)


    Önceki yıllardan devreden zarar yoktur. GVK md. 88 ve 89''a göre Bay (T)''nin 2026 yılı gelir vergisi matrahı kaç TL''dir?

    '
  secenekler:
    A: '530.000'
    B: '552.500'
    C: '595.000'
    D: '700.000'
    E: '765.000'
  dogru: C
  aciklama:
    dogru_neden: 'Ticari zarar diğer kaynakların kazancından mahsup edilir; diğer kazanç ve iratlardan (değer artışı) doğan
      zarar mahsup edilemez (md. 88). Beyan edilen gelir: 900.000 − 200.000 = 700.000 TL. Eğitim ve sağlık harcamaları beyan
      edilen gelirin %10''u (70.000 TL) ile, kamu yararına çalışan derneğe bağış %5''i (35.000 TL) ile sınırlıdır (md. 89/2,
      4). Matrah: 700.000 − 70.000 − 35.000 = 595.000 TL. Püf noktaları: Önce zarar mahsubu yapılıp beyan edilen gelir bulunur,
      sınırlar bu tutara uygulanır; değer artışı zararı hiçbir hesaba girmez.'
    celdiriciler:
      A: Eğitim-sağlık ve bağış tutarları sınırlanmadan indirilmiştir (700.000 − 120.000 − 50.000).
      B: Değer artışı zararı da mahsup edilmiş, sınırlar 650.000 TL'ye uygulanmıştır (650.000 − 65.000 − 32.500).
      D: Md. 89 indirimleri hiç yapılmamıştır.
      E: Ticari zarar mahsup edilmemiş, sınırlar 900.000 TL'ye uygulanmıştır (900.000 − 90.000 − 45.000).
    hesap_adimlari:
    - Beyan edilen gelir = 900.000 − 200.000 = 700.000 (değer artışı zararı mahsup edilmez)
    - Eğitim-sağlık sınırı = 70.000 → 70.000 indirilir
    - Bağış sınırı = 35.000 → 35.000 indirilir
    - Matrah = 700.000 − 105.000 = 595.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 88
    alinti: inci maddede yazılı diğer kazanç ve iratlardan doğanlar hariç) diğer kaynakların kazanç ve
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/2
    alinti: Beyan edilen gelirin % 10’unu aşmaması, Türkiye’de yapılması ve gelir veya
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/4
    alinti: toplamı beyan edilecek gelirin % 5’ini (kalkınmada öncelikli yöreler için % 10’unu) aşmamak
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'gelir = 900000 - 200000

      es = min(120000, gelir * 10 / 100)

      bagis = min(50000, gelir * 5 / 100)

      sonuc = gelir - es - bagis'
  durum: taslak
