  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: muafiyet ve istisnalar
  tip: hesaplama
  zorluk: 3
  kok: '(B) Ltd. Şti.''nde çalışan Bay (Ç)''nin Nisan 2026''daki durumu şöyledir:


    - Bay (Ç) Nisan ayında 22 gün fiilen çalışmıştır. İşyerinde yemek verilmemekte, işveren her gün için (çalışılmayan 8 gün
    dahil 30 gün) yemek kartına 400 TL yüklemektedir.

    - İşveren taşıma hizmeti vermemekte; Bay (Ç)''nin çalıştığı 22 gün için toplu taşıma kartına günlük 200 TL yüklemektedir.


    2026 yılı için GVK md. 23/8''deki günlük yemek bedeli istisnası 300 TL, md. 23/10''daki günlük ulaşım bedeli istisnası
    158 TL''dir. Buna göre bu ödemelerden Bay (Ç)''nin Nisan 2026 ücretine eklenerek vergilendirilecek tutar toplamı kaç TL''dir?

    '
  secenekler:
    A: '3.124'
    B: '3.924'
    C: '5.400'
    D: '6.324'
    E: '16.400'
  dogru: D
  aciklama:
    dogru_neden: 'Yemek istisnası yalnız çalışılan günler için günlük 300 TL''ye kadar uygulanır; aşan kısım ve diğer menfaatler
      ücrettir. Çalışılan 22 gün: (400 − 300) × 22 = 2.200; çalışılmayan 8 gün: 8 × 400 = 3.200. Ulaşım istisnası çalışılan
      günler için günlük 158 TL''dir: (200 − 158) × 22 = 924. Toplam: 2.200 + 3.200 + 924 = 6.324 TL. Püf noktaları: İstisna
      ''çalışılan günlere ait'' bedelle sınırlıdır; çalışılmayan günlere yüklenen tutarın tamamı ücrettir. Yemek ve ulaşım
      istisnaları ayrı ayrı hesaplanır.'
    celdiriciler:
      A: Çalışılmayan 8 gün için yüklenen yemek bedeli ücrete eklenmemiştir.
      B: Yemek istisnası 30 günün tamamına uygulanmıştır (30 × 100 + 924).
      C: Ulaşım bedelinin istisnayı aşan kısmı (924 TL) eklenmemiştir.
      E: İstisnalar hiç uygulanmamıştır (12.000 + 4.400).
    hesap_adimlari:
    - Yemek (çalışılan) = 22 × 100 = 2.200
    - Yemek (çalışılmayan) = 8 × 400 = 3.200
    - Ulaşım = 22 × 42 = 924
    - Toplam = 6.324 TL
