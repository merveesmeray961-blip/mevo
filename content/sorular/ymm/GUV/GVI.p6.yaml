- id: YMM-GUV-GVI-0072
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: genç girişimci istisnasının şartları
  tip: kavrama
  zorluk: 3
  kok: 'Aşağıdaki kişilerin tamamı 2026 yılında ilk defa gelir vergisi mükellefiyeti tesis ettirmiş tam mükellef gerçek kişilerdir;
    işe başlamalarını kanuni süresi içinde bildirmişler ve işlerinde bilfiil çalışmaktadırlar. Yaşlar mükellefiyet başlangıç
    tarihi itibarıyla verilmiştir. Bunlardan hangisi GVK mükerrer md. 20''deki genç girişimci kazanç istisnasından yararlanabilir?

    '
  secenekler:
    A: 27 yaşındaki (K), babasının vefatı üzerine babasının mimarlık ofisinin faaliyetini devralmıştır.
    B: 26 yaşındaki (L), annesinin emekli olması üzerine annesine ait faaliyetini sürdüren eczaneyi devralmıştır.
    C: 28 yaşındaki (M), faaliyetine devam eden bir diş hekimi muayenehanesine sonradan ortak olmuştur.
    D: 30 yaşındaki (N), ticari faaliyetine 2026 yılında başlamış ve hiçbir faaliyeti devralmamıştır.
    E: 25 yaşındaki (O), 31 yaşındaki bir kişiyle kurduğu adi ortaklık bünyesinde ticari faaliyette bulunmaktadır.
  dogru: A
  aciklama:
    dogru_neden: 'Mükerrer md. 20, faaliyetin eş veya üçüncü dereceye kadar (bu derece dâhil) kan veya kayın hısımlarından
      devralınmamasını şart koşar; ancak ölüm nedeniyle faaliyetin eş ve çocuklar tarafından devralınması hâli bu şartın dışındadır.
      (K) 27 yaşındadır ve babasının vefatı nedeniyle faaliyeti devralan çocuktur; diğer şartlar da sağlandığından istisnadan
      yararlanır.


      Püf noktaları: "Devralma yasağı" ölüm hâlinde eş ve çocuklar için işlemez. Yakınından yaşarken devralma (anne-baba emekliliği
      gibi), sonradan ortak olma, yaş sınırını (29) aşma ve adi ortaklıkta ortaklardan birinin şartları taşımaması istisnayı
      ortadan kaldırır.

      '
    celdiriciler:
      B: Annesinden ölüm dışında bir nedenle (emeklilik) devralma, ölüm hâli istisnası kapsamında değildir; birinci derece
        kan hısmından devralınmıştır, istisna uygulanmaz.
      C: Mevcut bir mesleki faaliyete sonradan ortak olunması 5. şarta aykırıdır; istisna uygulanmaz.
      D: Mükellefiyet başlangıcı itibarıyla yirmi dokuz yaşını doldurmamış olmak gerekir; 30 yaşındaki kişi yaş şartını sağlamaz.
      E: Adi ortaklıkta tüm ortakların işe başlama tarihi itibarıyla şartları taşıması gerekir; ortaklardan birinin 31 yaşında
        olması nedeniyle istisna uygulanmaz.
  kaynaklar:
