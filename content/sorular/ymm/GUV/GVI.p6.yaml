  tip: uygulama
  zorluk: 1
  kok: 'Türkiye''de yerleşik (M), 2022 yılında on dört yıl süreli bir tek primli yıllık gelir sigortası sözleşmesi yapmıştır.
    (M), vefat, maluliyet veya tasfiye gibi zorunlu bir neden bulunmaksızın 2026 yılında sözleşmeden ayrılmıştır. Ayrılma
    tarihinde yapılan ödemenin içerdiği irat tutarı, GVK md. 75 hükümlerine göre 200.000 TL olarak tespit edilmiştir. Bu ödeme
    üzerinden GVK md. 22/1 uyarınca yapılması gereken gelir vergisi tevkifatı kaç TL''dir? (Tevkifat oranı olarak 2009/14592
    sayılı Bakanlar Kurulu Kararının ilgili bendindeki oran esas alınacaktır.)

    '
  secenekler:
    A: 0 TL
    B: 10.000 TL
    C: 20.000 TL
    D: 30.000 TL
    E: 40.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Sigorta süresi en az on yıl olan tek primli yıllık gelir sigortalarından yapılan ödemeler gelir vergisinden
      müstesnadır. Ancak vefat, maluliyet veya tasfiye gibi zorunlu nedenler olmaksızın on yıl tamamlanmadan ayrılan kişinin
      ayrılma tarihinde alacağı ödemenin içerdiği irat tutarı üzerinden md. 94/1(15)-(a) alt bendine göre tevkifat yapılır.
      Bu alt bentteki oran %15''tir: 200.000 × %15 = 30.000 TL.

      '
    celdiriciler:
      A: Ayrılma zorunlu bir nedene dayanmadığından tevkifat yapılmaması söz konusu değildir; istisna on yıl dolmadan ayrılma
        hâlinde irat tutarı üzerinden tevkifata dönüşür.
      B: '%5 oranı md. 94/1(15)-(c) alt bendine ilişkindir; bu ödemede (a) alt bendi uygulanır.'
      C: '%10 oranı md. 94/1(15)-(b) alt bendine ilişkindir; bu ödemede (a) alt bendi uygulanır.'
      E: '%20 oranı bu ödeme için öngörülmemiştir; (a) alt bendinde oran %15''tir.'
    hesap_adimlari:
    - Tevkifat matrahı = ödemenin içerdiği irat tutarı = 200.000
    - Oran (md. 94/1-15-a) = %15
    - Tevkifat = 200.000 × 0,15 = 30.000
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 22/1
    alinti: vefat, maluliyet veya tasfiye gibi zorunlu nedenler hariç olmak üzere, on yıl tamamlanmadan tek primli yıllık
      gelir sigortalarından ayrılmaları hâlinde, ayrılma tarihinde yapılan ödemelerin içerdiği irat tutarı üzerinden, 94 üncü
      maddenin birinci fıkrasının (15) numaralı bendinin (a) alt bendine göre tevkifat yapılır.
