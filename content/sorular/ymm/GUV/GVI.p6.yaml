- id: YMM-GUV-GVI-0073
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: kâr payı istisnası (md. 22/3 ve 22/4)
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik ve başka geliri bulunmayan (Z), 2026 yılında aşağıdaki kâr paylarını elde etmiş olup yıllık beyanname
    verecektir. Yıllık beyannamenin verilmesi gereken son gün 25/3/2027''dir. Tutarlar brüt kâr payının TL karşılığıdır. GVK
    md. 22''deki istisna oranlarının Cumhurbaşkanı kararıyla değiştirilmediği kabul edilecektir.


    | Kâr payını dağıtan kurum | (Z)''nin ödenmiş sermayedeki payı | Brüt kâr payı (TL) | Not |

    |---|---|---|---|

    | (P) GmbH (kanuni ve iş merkezi Almanya''da, limited şirket) | %60 | 400.000 | Tamamı 20/3/2027''de Türkiye''ye transfer
    edilmiştir |

    | (R) Ltd. (kanuni ve iş merkezi İngiltere''de) | %40 | 300.000 | Tamamı 10/3/2027''de Türkiye''ye transfer edilmiştir
    |

    | (S) A.Ş. (tam mükellef kurum) | %5 | 100.000 | Dağıtım Türkiye''de yapılmıştır |

    | (V) Ltd. (kanuni ve iş merkezi Gürcistan''da) | %70 | 500.000 | Tamamı 10/4/2027''de Türkiye''ye transfer edilmiştir
    |


    Buna göre (Z)''nin yıllık beyannamesinde vergiye tabi gelir olarak gösterilecek kâr payı toplamı kaç TL''dir?

    '
  secenekler:
    A: 800.000 TL
    B: 900.000 TL
    C: 1.050.000 TL
    D: 1.100.000 TL
    E: 1.300.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Tam mükellef kurumlardan elde edilen kâr paylarının yarısı gelir vergisinden müstesnadır (md. 22/3). Kanuni
      ve iş merkezi Türkiye''de bulunmayan anonim ve limited şirket niteliğindeki kurumlardan elde edilen kâr paylarının yarısı
      ise ancak (i) ödenmiş sermayenin en az %50''sine sahip olunması ve (ii) kâr payının elde edildiği yıla ilişkin yıllık
      beyanname verme tarihine kadar (25/3/2027) Türkiye''ye transfer edilmesi şartlarıyla istisnadır (md. 22/4).


      - (P) GmbH: %60 ve süresinde transfer → yarısı istisna; vergiye tabi 200.000 TL.

      - (R) Ltd.: %40 (<%50) → istisna yok; 300.000 TL.

      - (S) A.Ş.: md. 22/3 → yarısı istisna; 50.000 TL.

      - (V) Ltd.: %70 ancak transfer 25/3/2027''den sonra (10/4/2027) → istisna yok; 500.000 TL.


      Toplam = 200.000 + 300.000 + 50.000 + 500.000 = 1.050.000 TL.


      Püf noktaları: Yurt dışı kâr payında hem %50 sermaye payı hem de beyan tarihine kadar transfer şartı birlikte aranır;
      ikisinden biri eksikse istisna hiç uygulanmaz. Yurt içi kâr payında ise bu şartlar yoktur.

      '
    celdiriciler:
      A: (V) Ltd.'nin kâr payının transfer süresi geçmiş olsa da yarısının istisna edildiği varsayılmıştır (250.000 TL), oysa
        süre geçtiğinden istisna uygulanmaz.
      B: (R) Ltd. kâr payının yarısı istisna edilmiştir (150.000 TL); oysa %40'lık pay %50 şartını sağlamaz.
      D: (S) A.Ş. kâr payının istisnası unutulmuştur (100.000 TL tam alınmıştır); oysa tam mükellef kurumdan alınan kâr payının
        yarısı md. 22/3 gereği istisnadır.
      E: Tüm kâr payları istisnasız toplanmıştır; oysa (P) GmbH ve (S) A.Ş. kâr paylarının yarısı istisnadır.
    hesap_adimlari:
    - '(P) GmbH: 400.000 × 1/2 = 200.000 vergiye tabi'
    - '(R) Ltd.: %40 < %50 → 300.000 vergiye tabi'
    - '(S) A.Ş.: 100.000 × 1/2 = 50.000 vergiye tabi'
    - '(V) Ltd.: transfer geç → 500.000 vergiye tabi'
    - Toplam = 1.050.000
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 22/4
    alinti: Kanuni ve iş merkezi Türkiye’de bulunmayan anonim ve limited şirket niteliğindeki kurumlardan elde edilen, 75
      inci maddenin ikinci fıkrasının (1), (2) ve (3) numaralı bentlerinde yazılı kâr paylarının yarısı, bu kurumların ödenmiş
      sermayesinin en az %50’sine sahip olunması ve kâr payının elde edildiği takvim yılına ilişkin yıllık gelir vergisi beyannamesinin
      verilmesi gereken tarihe kadar Türkiye’ye transfer edilmesi şartıyla gelir vergisinden müstesnadır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 22/3
    alinti: Tam mükellef kurumlardan elde edilen, 75 inci maddenin ikinci fıkrasının (1), (2) ve (3) numaralı bentlerinde
      yazılı kâr paylarının yarısı gelir vergisinden müstesnadır.
  gecerlilik: *id001
  dogrulama:
    python: 'p = 400000 * 0.5

      r = 300000

