- id: YMM-GUV-GVI-0071
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: taksi plakası satış kazancında istisna
  tip: kavrama
  zorluk: 3
  kok: '7587 sayılı Kanunla 193 sayılı Gelir Vergisi Kanununa eklenen geçici 94. madde 1/7/2026 tarihinde yürürlüğe girmiştir.
    Taksi, dolmuş, minibüs ve umum servis araçlarına ait ticari plakaların elden çıkarılmasından doğan kazançlara ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Ticari kazancı gerçek usulde vergilendirilen (A), 2023 yılında satın aldığı taksi plakasını 15/10/2026''da satmıştır;
    bu satıştan doğan kazanç gelir vergisinden müstesnadır.


    II. Ticari kazancı gerçek usulde vergilendirilen (B), taksi plakasını 12/8/2026''da satın almış ve 20/12/2026''da satmıştır;
    bu satıştan doğan kazanç gelir vergisinden müstesnadır.


    III. Ticari faaliyeti bulunmayan (C), 2025 yılında satın aldığı ticari plakayı 2026 yılında satmıştır; bu satıştan doğan
    kazancın tamamı gelir vergisinden müstesnadır.

    '
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: II ve III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'I doğrudur: Geçici md. 94, ticari kazancı gerçek usulde vergilendirilen mükelleflerin yürürlük tarihinden
      (1/7/2026) önce sahip oldukları ticari plakaları elden çıkarmalarından doğan kazançları gelir vergisinden müstesna kılar.
      (A) plakayı 2023''te iktisap ettiğinden ve satışı yürürlükten sonra yaptığından istisnadan yararlanır.


      II yanlıştır: (B) plakayı yürürlük tarihinden sonra (12/8/2026) satın almıştır; yani madde yürürlüğe girdiği tarihte
      plakaya sahip değildir.


      III doğrudur: Mükerrer md. 80/3 uyarınca ticari plakaların elden çıkarılmasından doğan kazançların tamamı gelir vergisinden
      müstesnadır. Beş yıllık elde tutma süresi veya 150.000 TL sınırı ticari plaka kazancı bakımından aranmaz; plaka iktisap
      tarihinden itibaren beş yıl içinde satılsa da kazanç vergilenmez.


      Püf noktaları: Geçici md. 94 yalnızca ticari kazancı gerçek usulde vergilenenler için ve yürürlük tarihinden önce sahip
      olunan plakalar içindir; ticari faaliyeti olmayan kişi için ise mükerrer md. 80/3 zaten tüm kazancı istisna eder. "Önce
      iktisap" şartına dikkat edin.

      '
    celdiriciler:
      A: II doğrudur ifadesi eksiktir; (B) plakayı yürürlük tarihinden sonra satın aldığından II yanlış, III ise doğrudur;
        bu şık III'ü dışarıda bırakmaktadır.
      B: 'III doğrudur ancak I de doğrudur: (A), plakaya yürürlük tarihinden önce sahip olduğundan geçici md. 94 istisnasından
        yararlanır; bu şık I''i dışarıda bırakmaktadır.'
      C: 'II yanlıştır: yürürlük tarihinden sonra satın alınan plaka için geçici md. 94 istisnası uygulanmaz; ayrıca III doğru
        olduğundan eksik de kalmaktadır.'
      D: II yanlıştır; yürürlük tarihinden sonra iktisap edilen plakanın satışı geçici md. 94 kapsamında değildir. I ise doğru
        olduğu hâlde bu şıkta yer almamıştır.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: geçici md. 94
    alinti: Ticari kazancı gerçek usulde vergilendirilen gelir vergisi mükelleflerinin bu maddenin yürürlüğe girdiği tarihten
      önce sahip oldukları taksi, dolmuş, minibüs ve umum servis araçlarına ait ticari plakalarını elden çıkarmalarından doğan
      kazançlar gelir vergisinden müstesnadır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 80/3
    alinti: Taksi, dolmuş, minibüs ve umum servis araçlarına ait ticari plakaların elden çıkarılmasından doğan kazançların
      tamamı ile bir takvim yılında elde edilen değer artışı kazancının, menkul kıymet ve diğer sermaye piyasası
