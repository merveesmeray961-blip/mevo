  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: ücret istisnaları (md. 23/17)
  tip: hesaplama
  zorluk: 2
  kok: 'Kanuni ve iş merkezi Türkiye''de bulunan, kamu kuruluşu niteliği taşımayan (H) Havayolları A.Ş., Mayıs 2026''da aşağıdaki
    hizmet erbabına ücret ödemiştir. Tutarlar aylık ücretin gerçek safi değeridir. GVK md. 23/17''deki oranın Cumhurbaşkanı
    kararıyla değiştirilmediği kabul edilecektir.


    | Kişi | Görev | Aylık ücret (TL) |

    |---|---|---|

    | (A) | Uçuş maksadıyla görevlendirilen, hava aracının sevk ve idaresiyle görevli pilot | 300.000 |

    | (B) | Uçuş esnasında uçak içinde hizmet veren, yetkili sivil havacılık otoritesince sertifikalandırılmış kabin memuru
    | 100.000 |

    | (C) | Yer operasyon müdürü (uçuş maksadıyla görevlendirilmemiştir) | 150.000 |


    Md. 23/17 istisnası uygulandıktan sonra bu üç kişi için ücret olarak vergiye tabi toplam tutar kaç TL''dir?

    '
  secenekler:
    A: 120.000 TL
    B: 270.000 TL
    C: 340.000 TL
    D: 480.000 TL
    E: 550.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 23/17 uyarınca uçuş maksadıyla görevlendirilen pilotlara ve uçak içinde hizmet veren sertifikalı kabin
      memurlarına ödenen aylık ücretin gerçek safi değerinin %70''i gelir vergisinden istisnadır. Yer operasyon müdürü bu
      kapsamda değildir.


      (A): 300.000 × %30 = 90.000; (B): 100.000 × %30 = 30.000; (C): 150.000 (istisna yok). Toplam vergiye tabi ücret = 90.000
      + 30.000 + 150.000 = 270.000 TL.

      '
    celdiriciler:
      A: Yer operasyon müdürünün (C) ücreti dışarıda bırakılmıştır (90.000 + 30.000); oysa (C)'nin 150.000 TL'si istisna kapsamında
        olmadığından vergiye tabidir.
      C: Yalnızca pilota istisna uygulanmış (550.000 − 210.000); kabin memuru da istisna kapsamındadır.
      D: Yalnızca kabin memuruna istisna uygulanmış (550.000 − 70.000); pilot da istisna kapsamındadır.
      E: Hiçbir istisna uygulanmamıştır; oysa pilot ve kabin memuru ücretlerinin %70'i istisnadır.
    hesap_adimlari:
    - '(A) vergiye tabi: 300.000 × 0,30 = 90.000'
    - '(B) vergiye tabi: 100.000 × 0,30 = 30.000'
    - '(C) vergiye tabi: 150.000'
    - Toplam = 270.000
