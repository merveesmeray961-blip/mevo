  tip: hesaplama
  zorluk: 3
  kok: 'Çalışma gücünün asgarî %60''ını kaybetmiş (ikinci derece engelli) serbest meslek erbabı Bay (S)''nin 2026 yılı beyan
    edilen serbest meslek kazancı 900.000 TL''dir; başka geliri ve başka indirimi yoktur. 2026 yılı için GVK md. 31''deki
    engellilik indirimi tutarları (birinci derece 12.000 TL, ikinci derece 7.000 TL, üçüncü derece 3.000 TL; aylık) ve 103.
    maddedeki tarife esas alınarak Bay (S)''nin 2026 yılı gelir vergisi (ücret dışı tarife) kaç TL''dir?


    Tarife (2026): 190.000 TL''ye kadar %15; 400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000 TL''nin
    400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000 TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35.'
  secenekler:
    A: 166.620 TL
    B: 182.820 TL
    C: 195.780 TL
    D: 203.610 TL
    E: 205.500 TL
  dogru: B
  aciklama:
    dogru_neden: 'GVK md. 89/3 uyarınca serbest meslek faaliyetinde bulunan engelliler, beyan edilen gelirlerinden 31. maddedeki
      esaslara göre hesaplanan yıllık indirimi düşebilir; ikinci derece engelli için aylık 7.000 TL olduğundan yıllık indirim
      7.000 × 12 = 84.000 TL''dir. Matrah = 900.000 − 84.000 = 816.000 TL. Vergi = 70.500 + (816.000 − 400.000) × %27 = 70.500
      + 112.320 = 182.820 TL. Püf noktaları: aylık engellilik tutarını 12 ile çarpmayı unutmayın; derece, çalışma gücü kaybı
      oranına göre belirlenir (%60 = ikinci derece).'
