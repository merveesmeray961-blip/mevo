      fazla ise bu işyerlerinden herhangi birisinin bulunduğu yer vergi dairesine verilir; takvim yılı içinde memleketi terk
      edenlerin beyannameleri ise memleketi terke takaddüm eden 15 gün içinde verilir. Bay (H) Eylül 2026''da Türkiye''yi
      terk edeceğinden beyanname terkten önceki 15 gün içinde Antalya veya Muğla''daki vergi dairelerinden birine verilir.
      Püf noktaları: genel Mart süresi, yılı içinde ayrılan mükellefe uygulanmaz; 4 aylık süre ölüm halidir.'
    celdiriciler:
      A: Takvim yılı içinde memleketi terk edenler için genel beyan süresi geçerli değildir; beyanname memleketi terke takaddüm
        eden 15 gün içinde verilir.
      B: İşyeri birden fazla ise bu işyerlerinden herhangi birisinin bulunduğu yer vergi dairesine verilebilir; yalnızca ilk
        işyeri esas alınmaz.
      D: Dört aylık süre ölüm halinde mirasçılar için öngörülmüştür; memleketi terk edenler terke takaddüm eden 15 gün içinde
        beyanname verir.
      E: Terke takaddüm eden 15 gün, terkten önceki süredir; ayrıca dar mükellefiyette beyanname Türkiye'deki işyerinin bulunduğu
        yer vergi dairesine verilir.
