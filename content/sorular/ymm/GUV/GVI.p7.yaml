  kok: Türkiye'de yerleşmiş olmayan Alman uyruklu Bay (H), Türkiye'de Antalya ve Muğla'da iki ayrı işyeri bulundurarak ticari
    faaliyette bulunmaktadır; Türkiye'de vergi muhatabı yoktur. Bay (H), 2026 yılının Eylül ayında faaliyetini sona erdirerek
    Türkiye'yi terk edecektir. Bay (H)'nin 2026 yılının başından terk tarihine kadar elde ettiği gelirlere ilişkin yıllık
    gelir vergisi beyannamesinin verilme zamanı ve yeri bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Beyanname, memleketin terkinden sonraki yılın Mart ayının başından yirmibeşinci günü akşamına kadar Antalya veya Muğla
      vergi dairelerinden herhangi birine verilir.
    B: Beyanname, memleketin terkinden önceki 15 gün içinde yalnızca ilk açılan işyerinin bulunduğu yer vergi dairesine verilir.
    C: Beyanname, memleketin terkinden önceki 15 gün içinde Antalya veya Muğla vergi dairelerinden herhangi birine verilir.
    D: Beyanname, memleketin terkinden itibaren 4 ay içinde bağlı olunan herhangi bir vergi dairesine verilir.
    E: Beyanname, memleketin terkinden sonraki 15 gün içinde Bay (H)'nin Almanya'daki ikametgâhının bağlı olduğu yerde verilir.
  dogru: C
  aciklama:
