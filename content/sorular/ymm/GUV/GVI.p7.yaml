        7.000 TL aylık tutar esas alınmalıdır.
      C: Üçüncü derece engellilik indirimi (3.000 TL × 12 = 36.000 TL) uygulanmıştır; çalışma gücünün %60'ını kaybeden ikinci
        derece engelli sayılır.
      D: Aylık 7.000 TL yıllık indirim yerine olduğu gibi düşülmüştür; serbest meslek erbabı için hesaplanan indirim yıllık
        olup aylık tutarın 12 katıdır.
      E: Engellilik indirimi hiç uygulanmamış, 900.000 TL üzerinden tarife işletilmiştir; serbest meslek erbabı engelli, 89/3
        uyarınca bu indirimden yararlanır.
