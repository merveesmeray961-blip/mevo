    madde: Mükerrer md. 120/1
    alinti: Şu kadar ki; 42 nci madde kapsamına giren kazançlar ile noterlik görevini ifa ile mükellef olanların bu işlerden
      sağladıkları kazançlar geçici vergi matrahına dâhil edilmez.
