- id: YMM-GUV-GVI-0078
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: elektronik ticaret ihracatı kazanç indirimi
  tip: uygulama
  zorluk: 3
  kok: 193 sayılı Gelir Vergisi Kanunu'nun 89. maddesinin birinci fıkrasının (16) numaralı bendi, tam mükellef gerçek kişilerin
    Posta İdaresi veya hızlı kargo taşımacılığı yapan şirketler tarafından düzenlenen elektronik ticaret gümrük beyannamesiyle
    gerçekleştirdikleri mal ihracatından elde ettikleri kazancın %50'sinin beyan edilen gelirden indirilmesine imkân tanımaktadır.
    Aşağıdaki tam mükellef gerçek kişilerden hangisi, başka bir şart bakımından eksiği bulunmamak kaydıyla, bu indirimden
    yararlanabilir?
  secenekler:
    A: İhracattan kaynaklanan yıllık hasılatı 350.000 TL olan ve kendisi 5510 sayılı Kanun kapsamında sigortalı sayılmayan
      kişi
    B: İhracattan kaynaklanan yıllık hasılatı 700.000 TL olan, kendisi sigortalı ve hiç işçi çalıştırmayan kişi
    C: İhracattan kaynaklanan yıllık hasılatı 2.000.000 TL olan, kendisi sigortalı ve ortalama iki tam zamanlı işçi çalıştıran
      kişi
    D: İhracattan kaynaklanan yıllık hasılatı 2.600.000 TL olan, kendisi sigortalı ve ortalama üç tam zamanlı işçi çalıştıran
      kişi
    E: İhracattan kaynaklanan yıllık hasılatı 1.500.000 TL olan, kendisi sigortalı ve ortalama iki işçi çalıştıran kişi
  dogru: E
  aciklama:
    dogru_neden: 'GVK md. 89/1-(16) uyarınca indirimden yararlanmak için hasılat dilimine göre şunlar aranır: 400.000 TL''ye
      kadar kendisinin sigortalı olması; 800.000 TL''ye kadar sigortalılık ve ortalama bir işçi; 1.600.000 TL''ye kadar sigortalılık
      ve ortalama iki işçi; 2.400.000 TL''ye kadar sigortalılık ve ortalama üç işçi. 1.500.000 TL hasılatlı kişi 1.600.000
      TL''lik dilimdedir ve iki işçi şartını sağlamaktadır. Püf noktaları: hasılat dilimini önce belirleyin, sonra o dilimin
      işçi sayısını sınayın; 2.400.000 TL üstünde indirim yoktur.'
    celdiriciler:
      A: Yıllık hasılatın düşük olması indirim için yeterli değildir; ilgili yılda mükellefin kendisinin sigortalı olması
        her hasılat diliminde aranan ortak bir şarttır.
      B: 700.000 TL hasılat 800.000 TL'ye kadar olan dilimdedir; bu dilimde sigortalı olmanın yanında ortalama en az bir tam
        zamanlı işçi çalıştırılması da aranır.
      C: 2.000.000 TL hasılat 2.400.000 TL'ye kadar olan dilimdedir; bu dilimde ortalama en az üç tam zamanlı işçi çalıştırılması
        gerekir, iki işçi yeterli değildir.
      D: Hasılat, kanunda öngörülen en yüksek dilim olan 2.400.000 TL'yi aşmaktadır; bu nedenle işçi sayısı ne olursa olsun
        indirimden yararlanılamaz.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-(16)
    alinti: 16. (Ek:11/11/2020-7256/16 md.) Tam mükellef gerçek kişilerin, 27/10/1999 tarihli ve 4458 sayılı Gümrük Kanununun
      225 inci maddesi kapsamında dolaylı temsilci olarak yetkili kılınan Posta İdaresi ya da hızlı kargo taşımacılığı yapan
      şirketler tarafından düzenlenen elektronik ticaret gümrük beyannamesiyle gerçekleştirdikleri mal ihracatı kapsamında
      elde ettikleri kazancın %50’si.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-(16)
    alinti: b) İhracattan kaynaklanan hasılatları toplamı yıllık 800.000 Türk lirasına kadar olanların, ilgili yılda kendilerinin
      sigortalı olması ve en az ortalama bir tam zamanlı ya da eş değer kısmi zamanlı işçi çalıştırması,
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-(16)
    alinti: d) İhracattan kaynaklanan hasılatları toplamı yıllık 2.400.000 Türk lirasına kadar olanların, ilgili yılda kendilerinin
      sigortalı olması ve en az ortalama üç tam zamanlı ya da eş değer kısmi zamanlı işçi çalıştırması, şarttır. (Bu bentte
      geçen sigortalı ibaresi 5510 sayılı Kanun kapsamında sigortalı sayılanları ifade eder.)
  gecerlilik:
    baslangic: '2020-11-11'
