- id: YMM-GUV-GVI-0081
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: yurt dışına hizmet veren işverenlerde ücret üzerinden vergi indirimi
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (E) Yazılım Ltd. Şti., GVK md. 89/1-(13) kapsamındaki faaliyet alanında hizmet vermektedir. 2026 yılında
    bu faaliyetten sağladığı hasılat 10.000.000 TL olup bunun 8.800.000 TL'si yurt dışından elde edilmiş ve faturalar yurt
    dışındaki müşteriler adına düzenlenmiştir. Şirket, münhasıran bu faaliyet için istihdam ettiği ve fiilen bu işleri ifa
    eden 5 hizmet erbabı ile ayrıca 2 destek personeli çalıştırmaktadır. Faaliyetin yapıldığı yılın ocak ayına ait asgari
    ücretin safi tutarı 28.000 TL'dir. GVK md. 33'teki şartların gerçekleştiği ve her çalışan için hesaplanan vergilerin indirim
    tutarından yüksek olduğu kabul edildiğine göre, şirketin bir aylık ücret tevkifatından mahsup edebileceği toplam indirim
    kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 21.000 TL
    C: 28.000 TL
    D: 29.400 TL
    E: 140.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'GVK md. 33''e göre indirim, destek personeli hariç, münhasıran bu faaliyet için istihdam edilen ve fiilen
      işi ifa eden her hizmet erbabı için ocak ayına ait asgari ücretin safi tutarının 103. maddedeki tarifenin birinci gelir
      dilimi oranıyla (%15) çarpılmasıyla bulunur; şart, hasılatın %85''inin yurt dışından elde edilmesi ve faturanın yurt
      dışındaki müşteri adına düzenlenmesidir. Yurt dışı payı 8.800.000/10.000.000 = %88 olduğundan şart sağlanır. İndirim
      = 5 × 28.000 × %15 = 21.000 TL. Püf noktaları: destek personelini saymayın ve oranı ikinci dilimden değil birinci gelir
      diliminden alın.'
    celdiriciler:
      A: Hasılatın %88'i yurt dışından elde edilmiştir; bu oran kanundaki %85 şartını sağladığından indirim hakkı doğmuştur.
      C: İndirim, asgari ücretin safi tutarına birinci gelir dilimi oranı (%15) yerine ikinci dilim oranı (%20) uygulanarak
        bulunmuştur; kanun birinci gelir dilimindeki oranı esas alır.
      D: Destek personeli de hesaba katılmış (7 kişi) olup 7 × 28.000 × %15 bulunmuştur; oysa destek personeli indirim kapsamı
        dışındadır.
      E: Asgari ücretin safi tutarına oran uygulanmadan 5 çalışanın tutarları toplanmıştır; indirim tutarı, asgari ücretin
        safi tutarının birinci gelir dilimi oranıyla çarpılmasıyla bulunur.
    hesap_adimlari:
    - Yurt dışı hasılat oranı = 8.800.000 / 10.000.000 = %88 ≥ %85 (şart sağlanır)
