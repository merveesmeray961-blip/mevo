  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: geçici vergi uygulaması
  tip: kavrama
  zorluk: 3
  kok: '193 sayılı Gelir Vergisi Kanunu''nun mükerrer 120. maddesinde düzenlenen geçici vergiye ilişkin aşağıdaki ifadelerden
    hangileri **doğrudur**?


    I. Ticari kazanç sahipleri ile serbest meslek erbabı, ilgili hesap döneminin üçer aylık dönem kazançları üzerinden geçici
    vergi öder.

    II. Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın ondördüncü günü akşamına kadar beyan edilir ve onyedinci
    günü akşamına kadar ödenir.

    III. 42. madde kapsamına giren yıllara yaygın inşaat ve onarım işlerinden sağlanan kazançlar geçici vergi matrahına dahil
    edilir.

    IV. Yapılan incelemelerde geçmiş dönemlere ait geçici verginin %20''sini aşan tutarda eksik beyan tespit edilmesi halinde
    eksik beyan edilen kısım için re''sen veya ikmalen geçici vergi tarh edilir.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: III ve IV
    E: I, II ve IV
  dogru: A
  aciklama:
    dogru_neden: 'Mükerrer md. 120/1''e göre geçici vergi üçer aylık dönem kazançları üzerinden ödenir ve 42. madde kapsamına
      giren kazançlar geçici vergi matrahına dahil edilmez. Beyan, dönemi izleyen ikinci ayın ondördüncü günü akşamına, ödeme
      onyedinci günü akşamına kadar yapılır. Geçmiş dönemlere ait geçici verginin %10''unu aşan tutarda eksik beyan tespit
      edilirse eksik beyan edilen kısım için re''sen veya ikmalen tarh yapılır. Dolayısıyla yalnızca I ve II doğrudur. Püf
      noktaları: 42. madde kazançları geçici vergi dışındadır; eksik beyan sınırı %10''dur.'
    celdiriciler:
      B: 'III numaralı ifade yanlıştır: 42. madde kapsamına giren kazançlar geçici vergi matrahına dahil edilmez.'
      C: 'IV numaralı ifade yanlıştır: re''sen veya ikmalen tarh için aranan eksik beyan sınırı %20 değil %10''dur.'
      D: Her iki ifade de yanlıştır; 42. madde kazançları matraha dahil edilmez ve eksik beyan sınırı %10'dur.
      E: IV numaralı ifade yanlıştır; geçmiş dönem geçici verginin %10'unu aşan eksik beyan halinde tarh yapılır, %20'sini
        aşan eksik beyan eşiği kanunda yoktur.
