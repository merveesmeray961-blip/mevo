- id: YMM-GUV-GVI-0079
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: hizmet ihracatı kazanç indirimi (2026 oranı)
  tip: hesaplama
  zorluk: 3
  kok: Bilanço esasına göre defter tutan tam mükellef Bay (Y), Türkiye'de yerleşmiş olmayan yurt dışındaki müşterilere, münhasıran
    yurt dışında yararlanılan yazılım hizmeti vermektedir. Faturalar yurt dışındaki müşteri adına düzenlenmiştir. Bay (Y)'nin
    2026 yılında bu faaliyetten elde ettiği kazanç 600.000 TL olup bu kazancın tamamı yıllık gelir vergisi beyannamesinin
    verilmesi gereken tarihe kadar Türkiye'ye transfer edilmiştir. Bay (Y)'nin ayrıca Türkiye'deki müşterilere verdiği hizmetlerden
    elde ettiği 400.000 TL kazancı vardır. 2026 yılı için GVK md. 89/1-(13) kapsamında beyan edilen gelirden indirilecek tutar
    kaç TL'dir? (Başka indirim ve istisna **yoktur**.)
  secenekler:
    A: 300.000 TL
    B: 480.000 TL
    C: 600.000 TL
    D: 800.000 TL
    E: 1.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'GVK md. 89/1-(13), Türkiye''de yerleşmemiş kişilere verilen ve münhasıran yurt dışında yararlanılan yazılım
      gibi hizmetlerin kazancının, beyanname verme tarihine kadar tamamının Türkiye''ye transfer edilmesi ve faturanın yurt
      dışındaki müşteri adına düzenlenmesi şartıyla %80''inin indirilmesini öngörür. 29/4/2026 tarihli 11257 sayılı Cumhurbaşkanı
      Kararı ile bu indirim oranı 1/1/2026''dan itibaren %100 olarak belirlenmiştir. İndirim = 600.000 × %100 = 600.000 TL;
      yurt içi hizmet kazancı (400.000 TL) indirime konu olmaz. Püf noktaları: kanunda yazan oran ile o yıl için Cumhurbaşkanı
      Kararı ile belirlenen oranı ayırt edin; indirim yalnızca yurt dışı hizmet kazancına uygulanır.'
    celdiriciler:
      A: Kazancın %50'si alınmıştır; bu oran kanunun eski metnindeki orandır, 7491 sayılı Kanun ile %80'e çıkarılmış ve 2026
        için Cumhurbaşkanı Kararı ile yeniden belirlenmiştir.
      B: Kanun metnindeki %80 oranı uygulanmıştır; oysa 2026 yılı için Cumhurbaşkanı Kararı ile uygulanacak oran %100 olarak
        belirlenmiştir.
      D: İndirim oranı %80 alınmış ve yurt içi hizmetten doğan 400.000 TL kazanç da tabana katılmıştır; indirim yalnızca yurt
        dışında yararlanılan hizmetin kazancı için geçerlidir.
      E: Yurt içi hizmetlerden elde edilen 400.000 TL kazanç da indirime konu edilmiştir; indirim münhasıran yurt dışında
        yararlanılan hizmetten elde edilen kazanca ilişkindir.
    hesap_adimlari:
    - İndirime konu kazanç = yurt dışına verilen hizmet kazancı = 600.000 TL
    - 2026 için uygulanacak indirim oranı = %100
    - İndirim = 600.000 × %100 = 600.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/1-(13)
    alinti: alanlarında faaliyette bulunan hizmet işletmeleri ile ilgili bakanlığın izni ve denetimine tabi olarak eğitim
      ve sağlık alanında faaliyet gösteren ve Türkiye’de yerleşmiş olmayan kişilere hizmet veren işletmelerin münhasıran bu
      faaliyetlerinden elde ettikleri kazancın, elde edildiği takvim yılına ilişkin yıllık gelir vergisi beyannamesinin verilmesi
      gereken tarihe kadar tamamının Türkiye’ye transfer edilmesi şartıyla, %80’i. Bu indirimden yararlanılabilmesi için fatura
      veya benzeri belgenin yurt dışındaki müşteri adına düzenlenmesi şarttır.
  - mevzuat: 11257 sayılı Cumhurbaşkanı Kararı
    madde: Karar md. 1/2
    alinti: (2) Aynı Kanunun 89 uncu maddesinin birinci fıkrasının (13) numaralı bendi uyarınca uygulanacak indirim oranı,
      %100 olarak belirlenmiştir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = round(600000*1.0)
