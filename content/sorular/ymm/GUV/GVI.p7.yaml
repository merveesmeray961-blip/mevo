- id: YMM-GUV-GVI-0080
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisinde istisna indirim ve beyan
  konu: GVI
  kazanim: yıllık beyannamede indirim sınırlarının uygulanması
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef Bay (P)''nin 2026 yılı için yıllık gelir vergisi beyannamesinde bildireceği gelir 2.000.000 TL''dir.
    Bay (P)''nin yıl içinde yaptığı ve gerekli belgelerle tevsik edilen harcamalar şunlardır:


    - Kendisi, eşi ve küçük çocuklarına ilişkin Türkiye''de yapılan eğitim ve sağlık harcamaları: 350.000 TL

    - Kamu yararına çalışan bir derneğe makbuz karşılığı yapılan nakdi bağış: 130.000 TL (kalkınmada öncelikli yöre kapsamında
    değildir)

    - Darülaceze''ye (iktisadi işletmesi hariç) makbuz karşılığı yapılan nakdi bağış: 40.000 TL


    GVK md. 89 uyarınca bu harcamalar nedeniyle beyan edilen gelirden indirilebilecek toplam tutar kaç TL''dir?'
  secenekler:
    A: 300.000 TL
    B: 340.000 TL
    C: 370.000 TL
    D: 490.000 TL
    E: 520.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Eğitim ve sağlık harcamaları beyan edilen gelirin %10''u ile sınırlıdır (md. 89/2): 2.000.000 × %10 = 200.000
      TL; harcama 350.000 TL olduğundan 200.000 TL indirilir. Kamu yararına çalışan derneklere makbuzlu bağışlar gelirin %5''i
      ile sınırlıdır (md. 89/4): 2.000.000 × %5 = 100.000 TL; 130.000 TL''nin 100.000 TL''si indirilir. Darülaceze''ye (iktisadi
      işletmesi hariç) makbuz karşılığı yapılan nakdi bağışlar tamamen indirilir (md. 89/11): 40.000 TL. Toplam = 200.000
      + 100.000 + 40.000 = 340.000 TL. Püf noktaları: her indirim kaleminin sınırı ayrı hesaplanır; Darülaceze, Kızılay ve
      Yeşilay bağışlarında sınır yoktur.'
    celdiriciler:
      A: Üç harcama kalemi için ayrı ayrı belirlenen sınırlar yerine toplam 520.000 TL'ye tek bir %15 sınırı uygulanmıştır;
        kanun her indirim bendi için ayrı sınır koymuştur.
      C: Eğitim ve sağlık harcamalarına %10 sınırı uygulanmış, ancak dernek bağışına %5 sınırı uygulanmayıp 130.000 TL'nin
        tamamı indirilmiştir.
      D: Dernek bağışına %5 sınırı uygulanmış, ancak eğitim ve sağlık harcamalarının tamamı (350.000 TL) indirilmiştir; bu
        harcamalar gelirin %10'u ile sınırlıdır.
      E: Hiçbir sınır uygulanmamış, tüm harcamalar indirilmiştir; oysa eğitim-sağlık ve dernek bağışı için gelire bağlı sınırlar
        vardır.
    hesap_adimlari:
    - 'Eğitim-sağlık: min(350.000; 2.000.000 × %10 = 200.000) = 200.000 TL'
    - 'Dernek bağışı: min(130.000; 2.000.000 × %5 = 100.000) = 100.000 TL'
    - 'Darülaceze bağışı: sınırsız = 40.000 TL'
    - Toplam indirim = 200.000 + 100.000 + 40.000 = 340.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/2
    alinti: 2. Beyan edilen gelirin % 10’unu aşmaması, Türkiye’de yapılması ve gelir veya kurumlar vergisi mükellefiyeti bulunan
      gerçek veya tüzel kişilerden alınacak belgelerle tevsik edilmesi şartıyla, mükellefin kendisi, eşi ve küçük çocuklarına
      ilişkin olarak yapılan eğitim ve sağlık harcamaları
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/4
    alinti: 4. Genel ve özel bütçeli kamu idareleri, il özel idareleri, belediyeler, köyler ile kamu yararına çalışan dernekler
      ve Cumhurbaşkanınca vergi muafiyeti tanınan vakıflara yıllık toplamı beyan edilecek gelirin % 5’ini (kalkınmada öncelikli
      yöreler için % 10’unu) aşmamak üzere, makbuz karşılığında yapılan bağış ve yardımlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 89/11
    alinti: '11. (Ek: 16/6/2009-5904/3 md.) İktisadi işletmeleri hariç, Darülacezeye, Türkiye Kızılay Derneğine ve Türkiye
      Yeşilay Cemiyetine makbuz karşılığı yapılan nakdi bağış ve yardımların tamamı.'
  gecerlilik:
    baslangic: '2026-04-22'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'gelir=2000000

      sonuc = min(350000,gelir*0.10)+min(130000,gelir*0.05)+40000'
