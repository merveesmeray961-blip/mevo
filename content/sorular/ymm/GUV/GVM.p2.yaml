  konu: GVM
  kazanim: diğer kazanç ve iratlar
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik, ticari, zirai ve mesleki faaliyeti bulunmayan Nihat Bey 2026 yılında aşağıdaki işlemleri yapmıştır:


    - Mart 2023''te 1.000.000 TL''ye satın aldığı arsayı Haziran 2026''da 1.950.000 TL''ye satmış, satış nedeniyle kendisi
    30.000 TL tapu harcı ödemiştir. Arsanın iktisap edildiği aydan satıldığı aya kadar (satış ayı hariç) endeks artış oranı
    %80''dir.

    - 2024 yılında babasından miras yoluyla intikal eden konutu satmış ve bu satıştan 500.000 TL kazanç elde etmiştir.

    - Kiraya verdiği taksi plakasını satmış; bu satıştan değer artışı kazancı niteliğinde 200.000 TL kazanç elde etmiştir.


    2026 yılı için değer artışı kazançlarına ilişkin istisna tutarı 150.000 TL''dir. Buna göre Nihat Bey''in 2026 yılı için
    beyan etmesi gereken değer artışı kazancı kaç TL''dir?'
  secenekler:
    A: '170.000'
    B: '200.000'
    C: '320.000'
    D: '670.000'
    E: '970.000'
  dogru: B
  aciklama:
    dogru_neden: 'Arsa, iktisabından itibaren 5 yıl içinde satıldığından değer artışı kazancı doğar. Endeks artışı %10''un
      üzerinde olduğundan maliyet 1.000.000 × 1,80 = 1.800.000 TL''ye yükseltilir; kazanç 1.950.000 − 1.800.000 − 30.000 =
      120.000 TL''dir. Miras yoluyla (ivazsız) edinilen konutun satışı değer artışı kazancı doğurmaz. Taksi plakasından doğan
      kazancın tamamı istisna dışında tutulduğundan 150.000 TL''lik istisna yalnız arsa kazancına uygulanır ve 120.000 TL''yi
      tamamen karşılar. Beyan edilecek tutar yalnız plaka kazancı olan 200.000 TL''dir. Püf noktaları: İstisna, ticari plaka
      kazancına uygulanmaz; bu nedenle istisnayı toplam kazançtan değil plaka dışındaki kazançtan düşün. Miras gibi ivazsız
      iktisaplarda 5 yıllık süreye bakılmaz.'
    celdiriciler:
      A: 'İstisna, plaka kazancı dahil toplam kazançtan düşülmüştür: (120.000 + 200.000) − 150.000 = 170.000.'
      C: 'İstisna hiç uygulanmamıştır: 120.000 + 200.000 = 320.000.'
      D: 'Mirasla intikal eden konutun satış kazancı da vergiye tabi sayılmıştır: (120.000 + 500.000 − 150.000) + 200.000
        = 670.000.'
      E: 'Maliyet bedeli endekslenmemiştir: (1.950.000 − 1.000.000 − 30.000 − 150.000) + 200.000 = 970.000.'
    hesap_adimlari:
    - 'Endekslenmiş maliyet: 1.000.000 × (1 + 0,80) = 1.800.000 TL (artış %10''un üzerinde)'
    - 'Arsa kazancı: 1.950.000 − 1.800.000 − 30.000 = 120.000 TL'
    - 'Mirasla edinilen konut: ivazsız iktisap, vergilendirilmez'
    - 'İstisna (plaka hariç kazançlara): 120.000 − 150.000 → 0 TL'
    - 'Plaka kazancı (istisna dışı): 200.000 TL'
    - 'Beyan edilecek değer artışı kazancı: 0 + 200.000 = 200.000 TL'
  kaynaklar:
