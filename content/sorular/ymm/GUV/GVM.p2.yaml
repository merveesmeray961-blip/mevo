- id: YMM-GUV-GVM-0015
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: ücret
  tip: hesaplama
  zorluk: 2
  kok: 'Bir işletmede hizmet erbabı olarak çalışan Ayla Hanım''ın Mayıs 2026''da aldığı brüt ücret 100.000 TL''dir. Ayla Hanım
    aynı ay içinde aşağıdaki ödemeleri yapmış ve işverenine belgelemiştir:


    - Kendi adına, merkezi Türkiye''de bulunan bir sigorta şirketinden aldığı hayat sigortası primi: 20.000 TL

    - Küçük çocuğu adına, merkezi Türkiye''de bulunan bir sigorta şirketinden aldığı sağlık sigortası primi: 4.000 TL

    - Kendi adına, merkezi yurt dışında bulunan bir sigorta şirketinden aldığı kaza sigortası primi: 3.000 TL

    - Sendikaya ödediği aidat: 2.000 TL


    Sosyal güvenlik primleri dikkate alınmayacak; yıllık asgari ücret sınırının aşılmadığı ve işverence bireysel emeklilik
    katkı payı ödenmediği varsayılacaktır. Buna göre GVK md.63''e göre Ayla Hanım''ın Mayıs 2026 ücretinin gerçek safi değeri
    kaç TL''dir?'
  secenekler:
    A: '81.000'
    B: '83.000'
    C: '84.000'
    D: '86.000'
    E: '94.000'
  dogru: C
  aciklama:
    dogru_neden: Hayat sigortası primlerinin %50'si (10.000 TL) ile Türkiye'de kâin ve merkezi Türkiye'de bulunan şirketle
      yapılan sağlık sigortası primi (4.000 TL) indirilebilir; toplam 14.000 TL, ücretin %15'i olan 15.000 TL'lik sınırın
      altındadır. Merkezi yurt dışında bulunan şirkete ödenen kaza sigortası primi indirilemez. Tevsik edilen sendika aidatı
      (2.000 TL) ayrıca ve sınırdan bağımsız indirilir. Gerçek safi ücret = 100.000 − 14.000 − 2.000 = 84.000 TL.
    celdiriciler:
      A: 'Yurt dışı şirkete ödenen kaza primi de dahil edilmiş ve %15 sınırı uygulanmamıştır: 100.000 − (10.000 + 4.000 +
        3.000 + 2.000) = 81.000.'
      B: 'Yurt dışı şirkete ödenen kaza primi dahil edilip sigorta primleri 15.000 TL ile sınırlanmıştır: 100.000 − 15.000
        − 2.000 = 83.000.'
      D: 'Sendika aidatı indirilmemiştir: 100.000 − 14.000 = 86.000.'
      E: 'Hayat sigortası priminin hiç indirilemeyeceği düşünülmüştür: 100.000 − 4.000 − 2.000 = 94.000.'
    hesap_adimlari:
    - 'Hayat sigortası primi indirimi: 20.000 × %50 = 10.000 TL'
    - 'Sağlık sigortası primi (Türkiye''de merkezli şirket): 4.000 TL; yurt dışı şirkete ödenen kaza primi: 0'
    - 'Prim sınırı: 100.000 × %15 = 15.000 TL; 14.000 TL < 15.000 TL olduğundan 14.000 TL indirilir'
    - 'Sendika aidatı: 2.000 TL'
    - 'Gerçek safi ücret: 100.000 − 14.000 − 2.000 = 84.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 63/1-3
    alinti: Sigortanın Türkiye’de kâin ve merkezi Türkiye’de bulunan bir emeklilik veya sigorta şirketi nezdinde akdedilmiş
      olması şartıyla; ücretlinin şahsına, eşine ve küçük çocuklarına ait hayat sigortası poliçeleri için hizmet erbabı tarafından
      ödenen primlerin %50’si ile ölüm, kaza, sağlık, hastalık, engellilik, işsizlik, analık, doğum ve tahsil gibi şahıs sigorta
      poliçeleri için hizmet erbabı tarafından ödenen primler (İndirim konusu yapılacak primler toplamı, ödendiği ayda elde
      edilen ücretin %15’ini ve yıllık olarak asgari ücretin yıllık tutarını aşamaz.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 63/1-4
    alinti: Çalışanlar tarafından ilgili kanunlarına göre, sendikalara ödenen aidatlar (Şu kadar ki, aidatın ödendiğinin tevsik
      edilmesi şarttır.),
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'hayat = 20000 * 0.5

      saglik = 4000

      prim = min(hayat + saglik, 100000 * 0.15)

      sonuc = 100000 - prim - 2000'
  durum: taslak
  surum: 1
