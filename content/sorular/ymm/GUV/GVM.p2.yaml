      gayrimenkuller dahil) ve hakların, iktisap tarihinden başlayarak beş yıl içinde elden çıkarılmasından doğan kazançlar
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 80/3
    alinti: Taksi, dolmuş, minibüs ve umum servis araçlarına ait ticari plakaların elden çıkarılmasından doğan kazançların
      tamamı ile bir takvim yılında elde edilen değer artışı kazancının, menkul kıymet ve diğer sermaye piyasası
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 81
    alinti: 'Mal ve hakların elden çıkarılmasında iktisap bedeli, elden çıkarılan mal ve hakların, elden çıkarıldığı ay hariç
      olmak üzere Devlet İstatistik Enstitüsünce belirlenen toptan eşya fiyat endeksindeki artış oranında artırılarak tespit
      edilir. (Ek cümle: 30/12/2004-5281/28 md.) Şu kadar ki, bu endekslemenin yapılabilmesi için artış oranının % 10 veya
