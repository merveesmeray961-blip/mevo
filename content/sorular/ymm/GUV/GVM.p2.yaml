- id: YMM-GUV-GVM-0017
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: serbest meslek kazancı
  tip: hesaplama
  zorluk: 3
  kok: 'Serbest avukat Selim Bey''in 2026 yılına ilişkin bilgileri şöyledir:


    - Müvekkillerden vekâlet ücreti olarak tahsil edilen tutar: 800.000 TL

    - Serbest meslek makbuzu düzenlenmiş ancak yıl sonuna kadar tahsil edilmemiş vekâlet ücreti: 100.000 TL

    - Dava harcı ve bilirkişi ücreti için müvekkillerden alınan ve tamamı bu amaçla harcanan tutar: 30.000 TL

    - Müvekkillerden kırtasiye, ulaşım gibi büro giderlerine karşılık olarak alınan tutar: 20.000 TL

    - Bir müvekkilinden olan 50.000 TL''lik vekâlet ücreti alacağını, kendi borcuna karşılık alacaklısına temlik etmiştir.

    - Mesleki faaliyetle ilgili indirilebilir giderler toplamı: 250.000 TL


    Buna göre Selim Bey''in 2026 yılı serbest meslek kazancı kaç TL''dir?'
  secenekler:
    A: '550.000'
    B: '570.000'
    C: '600.000'
    D: '620.000'
    E: '650.000'
  dogru: D
  aciklama:
    dogru_neden: 'Serbest meslek kazancı tahsil esasına göre tespit edilir (md.67). Tahsil edilen 800.000 TL''ye, müvekkilden
      alınan gider karşılığı 20.000 TL eklenir; alacağın başka bir şahsa temliki tahsil hükmünde olduğundan 50.000 TL de hasılata
      girer. Tahsil edilmemiş 100.000 TL dikkate alınmaz; harç ve bilirkişilik için alınıp tamamen bu amaçla harcanan 30.000
      TL kazanç sayılmaz. Kazanç = 800.000 + 20.000 + 50.000 − 250.000 = 620.000 TL. Püf noktaları: Makbuz düzenlenmesi değil
      tahsil belirleyicidir; temlik ise para eline geçmese de tahsil sayılır. ''Gider karşılığı'' ile ''harç, bilirkişilik
      gibi işler için alınıp tamamen harcanan para'' ayrımına dikkat edin: ilki kazanca eklenir, ikincisi kazanç sayılmaz.'
    celdiriciler:
      A: 'Hem temlik edilen alacak hem gider karşılığı hasılata dahil edilmemiştir: 800.000 − 250.000 = 550.000.'
      B: 'Temlik tahsil hükmünde sayılmamıştır: 800.000 + 20.000 − 250.000 = 570.000.'
      C: 'Gider karşılığı kazanca eklenmemiştir: 800.000 + 50.000 − 250.000 = 600.000.'
      E: 'Harç ve bilirkişilik için alınıp harcanan 30.000 TL de kazanca eklenmiştir: 620.000 + 30.000 = 650.000.'
    hesap_adimlari:
    - 'Tahsil edilen vekâlet ücreti: 800.000 TL (tahsil edilmeyen 100.000 TL dikkate alınmaz)'
    - 'Temlik edilen alacak (tahsil hükmünde): + 50.000 TL'
    - 'Gider karşılığı: + 20.000 TL; harç/bilirkişi için alınıp harcanan 30.000 TL: kazanç sayılmaz'
    - 'Mesleki giderler: − 250.000 TL'
    - 'Serbest meslek kazancı: 800.000 + 50.000 + 20.000 − 250.000 = 620.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 67/1
    alinti: Serbest meslek kazancı bir hesap dönemi içinde serbest meslek faaliyeti karşılığı olarak tahsil edilen para ve
      ayınlar ve diğer suretlerle sağlanan ve para ile temsil edilebilen menfaatlerden bu faaliyet dolayısiyle yapılan giderler
      indirildikten sonra kalan farktır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 67/2, 4
    alinti: Müşteri veya müvekkilinden, serbest meslek faaliyeti ile ilgili olmak üzere para ve ayın şeklinde alınan gider
      karşılıkları kazanca ilave edilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 67/4
    alinti: Vergi, resim, harç, keşif, şahitlik, bilirkişilik ve ekspertiz gibi hususlara harcanmak üzere müşteri veya müvekkilden
      alınan ve tamamen bu hususlara sarf edilen para ve ayınlar kazanç sayılmaz.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 67
    alinti: 2 - Serbest meslek kazancı olarak doğan alacağın başka bir şahsa temliki (Temlikin ivazlı olup olmadığına bakılmaz.İvazlı
      temliklerde ivazın tahsil şartı aranmaz.) veya müşterisine olan borcu ile takası; Tahsil hükmündedir.
  gecerlilik:
    baslangic: '1963-02-28'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'tahsil = 800000

      temlik = 50000

      gider_karsiligi = 20000

      giderler = 250000

      sonuc = tahsil + temlik + gider_karsiligi - giderler'
