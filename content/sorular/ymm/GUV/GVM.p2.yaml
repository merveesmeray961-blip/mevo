- id: YMM-GUV-GVM-0014
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: ticari ve zirai kazanç
  tip: kavrama
  zorluk: 2
  kok: '193 sayılı Gelir Vergisi Kanunu''na göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Satın aldığı araziyi iktisabından 4 yıl sonra parselleyen ve parselleri 7. yılda satan kişinin bu satıştan elde ettiği
    kazanç ticari kazançtır.

    II. Zirai faaliyetle uğraşan bir kollektif şirket çiftçi sayılır ve ortaklarının şirket kârından aldıkları paylar zirai
    kazançtır.

    III. Bir çiftçinin, sınai bir müessese önem ve genişliğinde olmayan ve yalnızca kendi ürettiği domatesleri işleyen salça
    atölyesindeki faaliyeti zirai faaliyete girer.

    IV. Çiftçinin mahsullerini satmak için dükkân açması hâlinde, mahsullerin dükkâna gelinceye kadar geçirdikleri safhalar
    ticari faaliyet sayılır.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'I doğrudur: md.37/6''ya göre arazinin iktisabından itibaren 5 yıl içinde parsellenmesi yeterlidir; satış
      bu süre içinde veya daha sonraki yıllarda yapılabilir. III doğrudur: md.52''ye göre mahsullerin zirai istihsale bağlı
      olarak işlenmesi, işletme sınai müessese önem ve genişliğinde değilse ve yalnız teşebbüsün kendi mahsullerine hasredilmişse
      zirai faaliyettir.'
    celdiriciler:
      A: 'II yanlıştır: kollektif şirketler zirai faaliyetle uğraşsalar dahi çiftçi sayılmaz; ortakların payları şahsi ticari
        kazanç hükmündedir.'
      C: II ve IV yanlıştır; dükkâna gelinceye kadar geçen safhalar zirai faaliyet sahasında kalır.
      D: 'IV yanlıştır: md.52''ye göre mahsullerin dükkân ve mağazaya gelinceye kadar geçirdikleri safhalar zirai faaliyet
        sahasında kalır.'
      E: II ve IV yanlış, I ise doğrudur; parselleme 5 yıl içinde yapıldığından satışın 7. yılda olması ticari kazanç niteliğini
        değiştirmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 37/2-6
    alinti: Satınalınan veya trampa suretiyle iktisap olunan arazinin iktisap tarihinden itibaren 5 yıl içinde parsellenerek
      bu müddet içinde veya daha sonraki yıllarda kısmen veya tamamen satılmasından; elde edilen kazançlar.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 52
    alinti: Mahsullerin değerlendirilmeleri maksadiyle ve zirai istihsale müteferri olarak işlenmesi de zirai faaliyete girer.
      Ancak, bu ameliye, aynı teşebbüsün cüzünü teşkil eden bir işletmede vukua geliyorsa, bu ameliyenin zirai faaliyet sayılabilmesi
      için işletmenin sinai bir müessese ehemmiyet ve genişliğinde olmaması ve faaliyetini, cüz'ün teşkil ettiği teşebbüsün
      mahsullerine hasretmesi şarttır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 52
    alinti: Satışların dükkan ve mağaza açılarak yapılması halinde, mahsullerin dükkan ve mağazaya gelinceye kadar geçirdikleri
      safhalar zirai faaliyet sahasında kalır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 52
    alinti: Kollektif şirketlerle adi veya eshamlı komandit şirketler zirai faaliyetle iştigal etseler dahi çiftçi sayılmazlar.
