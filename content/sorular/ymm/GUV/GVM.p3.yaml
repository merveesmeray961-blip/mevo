      B: Dar mükellefler yalnızca Türkiye'de elde ettikleri gelirler üzerinden beyanname verir.
      D: GVK md. 4'e göre yerleşim yeri esas alınır; salt altı ay kalma kriteri yeterli değildir, o yıl içinde devamlı kalma
