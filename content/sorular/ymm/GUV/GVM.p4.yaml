- id: YMM-GUV-GVM-0065
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: diğer kazanç ve iratlar
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik Bay (D)''nin ticari işletmesine dahil olmayan gayrimenkullerine ilişkin 2026 yılı satışları şöyledir:


    - Mayıs 2022''de 3.000.000 TL''ye satın aldığı dükkânı Haziran 2026''da 9.000.000 TL''ye satmıştır. Satış nedeniyle kendi
    üzerinde kalan tapu harcı ve emlakçı komisyonu toplamı 100.000 TL''dir. Dükkânın alış ayından satış ayına kadar (satış
    ayı hariç) Yİ-ÜFE''deki artış oranı %150''dir.

    - 2024 yılında babasından miras yoluyla intikal eden arsasını Nisan 2026''da 2.000.000 TL''ye satmıştır.

    - Mart 2020''de satın aldığı konutunu Temmuz 2026''da 4.000.000 TL''ye satmıştır.


    2026 yılı için değer artışı kazancı istisnası 150.000 TL''dir. Buna göre Bay (D)''nin 2026 yılı için beyan edeceği değer
    artışı kazancı kaç TL''dir?

    '
  secenekler:
    A: 1.250.000
    B: 1.350.000
    C: 1.400.000
    D: 4.250.000
    E: 5.750.000
  dogru: A
  aciklama:
    dogru_neden: 'Gayrimenkulün ivazlı iktisabından itibaren beş yıl içinde elden çıkarılması değer artışı kazancı doğurur
      (mükerrer md. 80/1-6). Dükkân 4 yıl 1 ay sonra satıldığından kapsamdadır; iktisap bedeli Yİ-ÜFE artışı (%150, %10 şartı
      sağlanmış) oranında artırılır: 3.000.000 × 2,5 = 7.500.000. Safi kazanç: 9.000.000 − 7.500.000 − 100.000 = 1.400.000
      (mükerrer md. 81). İstisna düşülür: 1.400.000 − 150.000 = 1.250.000 TL. Miras yoluyla edinilen arsa ivazsız iktisap
      edildiğinden, konut ise beş yıldan sonra satıldığından değer artışı doğmaz. Püf noktaları: Endeks artışı oran olarak
      verildiğinde maliyet 1 + oran ile çarpılır; satıcı üzerinde kalan giderler ve harçlar indirilir; istisna safi kazanç
      bulunduktan sonra uygulanır.'
    celdiriciler:
      B: Satış giderleri indirilmemiştir (9.000.000 − 7.500.000 − 150.000).
      C: İstisna uygulanmamıştır.
      D: Maliyet artış oranıyla (×1,5) çarpılmıştır; doğru çarpan 1 + 1,5 = 2,5'tir.
      E: Endeksleme yapılmamıştır (9.000.000 − 3.000.000 − 100.000 − 150.000).
    hesap_adimlari:
    - Endekslenmiş maliyet = 3.000.000 × 2,5 = 7.500.000
    - Safi kazanç = 9.000.000 − 7.500.000 − 100.000 = 1.400.000
    - Beyan = 1.400.000 − 150.000 = 1.250.000 TL
    - Miras arsa (ivazsız) ve 6 yıllık konut kapsam dışı
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 80/1-6
    alinti: İktisap şekli ne olursa olsun (ivazsız olarak iktisap edilenler hariç) 70 inci maddenin
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 81
    alinti: giderlerin ve ödenen vergi ve harçların indirilmesi suretiyle bulunur.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 81
    alinti: bu endekslemenin yapılabilmesi için artış oranının % 10 veya üzerinde
  - mevzuat: Gelir Vergisi Genel Tebliği (Seri No 332)
