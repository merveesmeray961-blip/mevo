- id: YMM-GUV-GVM-0063
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: ortaklıkların vergilendirilmesi
  tip: hesaplama
  zorluk: 2
  kok: 'İki gerçek kişi ortağın (A ve B) eşit paylı olduğu (K) Kollektif Şirketi''nin 2026 yılı ticari bilanço kârı 1.500.000
    TL''dir. Kâra ulaşılırken aşağıdaki ödemeler gider yazılmıştır:


    - Şirkette çalışan ortak A''ya ödenen aylıklar toplamı: 300.000 TL

    - Ortak B''nin şirkette çalışan eşine ödenen ücret: 120.000 TL

    - Ortak A''nın şirkete koyduğu sermaye için yürütülen faiz: 80.000 TL

    - Ortak olmayan şirket müdürüne ödenen ücret: 200.000 TL


    Başka bir düzeltme gerektiren işlem yoktur. 193 sayılı Gelir Vergisi Kanunu''na göre ortak A''nın şirketten elde ettiği
    ve şahsi ticari kazanç hükmünde olan payı kaç TL''dir?

    '
  secenekler:
    A: '750.000'
    B: '900.000'
    C: '960.000'
    D: 1.000.000
    E: 1.100.000
  dogru: D
  aciklama:
    dogru_neden: 'Kollektif şirket ortakları md. 41 uygulamasında teşebbüs sahibi sayılır. Teşebbüs sahibine ve eşine ödenen
      ücretler ile işletmeye konulan sermaye için yürütülen faizler gider yazılamaz (md. 41/1-2, 3). Düzeltilmiş kâr: 1.500.000
      + 300.000 + 120.000 + 80.000 = 2.000.000 TL; ortakların payı md. 37 uyarınca şahsi ticari kazanç hükmündedir: 2.000.000
      / 2 = 1.000.000 TL. Ortak olmayan müdüre ödenen ücret gider olarak kalır.'
    celdiriciler:
      A: Kanunen kabul edilmeyen ödemeler kâra eklenmemiştir.
      B: Yalnız ortağa ödenen aylık eklenmiş; eşe ödenen ücret ve sermaye faizi eklenmemiştir.
      C: Sermaye faizi eklenmemiştir.
      E: Ortak olmayan müdürün ücreti de kâra eklenmiştir; bu ödeme gider yazılabilir.
    hesap_adimlari:
    - Eklenecekler = 300.000 + 120.000 + 80.000 = 500.000
    - Düzeltilmiş kâr = 1.500.000 + 500.000 = 2.000.000
    - A'nın payı = 2.000.000 / 2 = 1.000.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 41
    alinti: komandit şirketlerin komandite ortakları teşebbüs sahibi sayılır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 41/1-2
    alinti: 2. Teşebbüs sahibinin kendisine, eşine, küçük çocuklarına işletmeden ödenen aylıklar,
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 41/1-3
    alinti: 3. Teşebbüs sahibinin işletmeye koyduğu sermaye için yürütülecek faizler;
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 37
    alinti: ortakların ortaklık karından aldıkları paylar şahsi ticari kazanç hükmündedir.
  gecerlilik:
    baslangic: '1961-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (1500000 + 300000 + 120000 + 80000) / 2
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S4
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
