    - Arızi olarak yaptığı bir ticari muameleye aracılıktan elde ettiği safi kazanç: 150.000 TL

    - Kiracısı olduğu işyerini tahliye etmesi karşılığında aldığı tazminat: 90.000 TL (Bu tazminatla ilgili belgeli avukatlık
    gideri 20.000 TL''dir.)

    - Yürüttüğü serbest meslek faaliyetini terk etmesi karşılığında aldığı tutar: 60.000 TL

    - Bir kamu ihalesine iştirak etmemesi karşılığında aldığı tutar: 120.000 TL


    Bu kazançlar üzerinden vergi kesintisi yapılmamıştır. 2026 yılı için arızi kazanç istisnası 350.000 TL''dir. GVK md. 82''ye
    göre Bay (K)''nın beyan edeceği arızi kazanç toplamı kaç TL''dir?

    '
  secenekler:
