    B: '70.000'
    C: '120.000'
    D: '180.000'
    E: '400.000'
  dogru: C
  aciklama:
    dogru_neden: 'İstisna (1)–(4) numaralı bentlerdeki kazançlara uygulanır; ihale, artırma ve eksiltmelere iştirak edilmemesi
      ile hiç başlanmamış faaliyete girişilmemesi karşılığı alınanlar istisna dışıdır. Tahliye tazminatında belgeli gider
      indirilir: 90.000 − 20.000 = 70.000. İstisnaya konu kazançlar: 150.000 + 70.000 + 60.000 = 280.000 TL < 350.000 TL olduğundan
      tamamı istisnadır. İhaleye iştirak etmeme karşılığı 120.000 TL istisnadan yararlanamaz ve beyan edilir.'
    celdiriciler:
      A: İstisna ihaleye iştirak etmeme karşılığına da uygulanmıştır (400.000 − 350.000).
      B: Hem tahliye giderini indirmeyip hem istisnayı bütün kazançlara uygulamaktan doğan sonuçtur (420.000 − 350.000).
      D: Faaliyetin terki karşılığı da istisna dışı sayılmıştır; istisna dışı olan hiç girişilmeyen faaliyettir, terk edilen
        faaliyet değildir.
      E: İstisna hiç uygulanmamıştır.
    hesap_adimlari:
    - Tahliye safi = 90.000 − 20.000 = 70.000
    - İstisnaya konu = 150.000 + 70.000 + 60.000 = 280.000 → tamamı istisna
    - İstisna dışı = 120.000
    - Beyan = 120.000 TL
