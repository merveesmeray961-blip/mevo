- id: YMM-GUV-GVM-0064
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: ortaklıkların vergilendirilmesi
  tip: uygulama
  zorluk: 3
  kok: '(M) Adi Komandit Şirketi''nin komandite ortağı Bay (B), komanditer ortağı Bay (A)''dır. Bay (A) şirkette hizmet sözleşmesiyle
    muhasebe müdürü olarak da çalışmaktadır. Şirketin 2026 yılı kârı 2027 Mart ayında dağıtılmıştır. 193 sayılı Gelir Vergisi
    Kanunu''na göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Bay (A)''nın 2026 kârından 2027''de aldığı kâr payı menkul sermaye iradı olup 2026 takvim yılında elde edilmiş sayılır.

    II. Bay (A)''ya muhasebe müdürü olarak ödenen aylıklar şirket kazancının tespitinde gider yazılabilir ve Bay (A) bakımından
    ücrettir.

    III. Bay (B)''nin şirkette çalışan eşine ödenen ücret şirket kazancının tespitinde gider yazılamaz.

    IV. Bay (B)''nin ortaklık kârından aldığı pay, komanditerin payı gibi menkul sermaye iradıdır.

    '
  secenekler:
    A: I ve II
    B: I, II ve III
    C: II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Komanditerlerin kâr payları menkul sermaye iradıdır ve şirket kârının ilişkin bulunduğu takvim yılında elde
      edilmiş sayılır (md. 75/2-2; I). Md. 41''in uygulanmasında yalnız komandite ortaklar teşebbüs sahibi sayıldığından,
      şirkette çalışan komanditere ödenen aylık gider yazılabilir ve onun için ücrettir (II); komandite ortağın eşine ödenen
      ücret ise gider yazılamaz (md. 41/1-2; III). Komandite ortağın ortaklık kârından aldığı pay şahsi ticari kazanç hükmündedir
      (md. 37); IV yanlıştır. Püf noktaları: Aynı şirkette iki ortak türü farklı gelir unsuruna tabidir; md. 41 kısıtlaması
      yalnız teşebbüs sahibi sayılan komandite için geçerlidir. Komanditer kâr payında elde etme zamanı dağıtım yılı değil
      kârın ait olduğu yıldır.'
    celdiriciler:
      A: Komandite ortağın eşine ödenen ücret md. 41/1-2 uyarınca gider yazılamaz; III de doğrudur.
      C: Komandite ortağın payı şahsi ticari kazançtır; I doğrudur.
      D: Komanditer teşebbüs sahibi sayılmadığından II doğrudur; IV yanlıştır.
      E: IV yanlıştır; I doğrudur.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 75/2-2
    alinti: Adi komandit şirketlerde komanditerlerin kar payları, şirket karının ilişkin bulunduğu
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 41
    alinti: komandit şirketlerin komandite ortakları teşebbüs sahibi sayılır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 37
    alinti: ortakların ortaklık karından aldıkları paylar şahsi ticari kazanç hükmündedir.
