    2026 yılının ocak-kasım aylarına ait kiralar nakden tahsil edilmiştir. Aralık ayı kirası ise Bay (L)''nin Bay (K)''ya
    olan 40.000 TL tutarındaki borcu ile takas edilmiştir. Kira sözleşmesi 31/12/2026''da sona ermiş; Bay (K), işyerinin iktisadi
    değerini devamlı surette artıracak şekilde yaptığı ve emsal bedeli 350.000 TL olan tadilat kıymetlerini hiçbir bedel almaksızın
    Bay (L)''ye bırakmıştır. Bay (L)''nin işyeriyle ilgili GVK md. 74 kapsamındaki gerçek giderleri 80.000 TL''dir ve götürü
    gider usulünü uygulamamaktadır. Başka gelir ve gider yoktur.


    Buna göre Bay (L)''nin 2026 yılı gayrimenkul sermaye iradı safi tutarı kaç TL''dir?'
