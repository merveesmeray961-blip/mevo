  konu: GVM
  kazanim: 'değer artışı kazançları: ortaklık payı satışı, endeksleme ve istisna'
  tip: hesaplama
  zorluk: 3
  kok: 'Türkiye''de yerleşik ve tam mükellef Bay (T)''nin ticari, zirai veya mesleki faaliyeti yoktur. Bay (T), 2020 yılında
    sermaye payı olarak 800.000 TL ödeyerek iktisap ettiği (X) Limited Şirketi ortaklık payının tamamını 5/10/2026 tarihinde
    6.000.000 TL bedelle satmıştır. İktisap tarihinden satış ayı hariç olmak üzere toptan eşya fiyat endeksindeki artış oranı
    %150''dir. Satış dolayısıyla yapılan ve satıcının uhdesinde kalan giderler 100.000 TL''dir. GVK mükerrer md. 80 uyarınca
    2026 yılı için değer artışı kazançlarına ilişkin istisna tutarı 150.000 TL''dir. Bay (T)''nin başka bir değer artışı kazancı
    yoktur.


    Buna göre Bay (T)''nin bu satış nedeniyle yıllık beyannameye dahil edeceği değer artışı kazancı kaç TL''dir?'
  secenekler:
    A: 0 TL
    B: 3.750.000 TL
    C: 3.850.000 TL
    D: 3.900.000 TL
    E: 4.950.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Ortaklık haklarının veya hisselerinin elden çıkarılmasından doğan kazançlar değer artışı kazancıdır (mükerrer
      md. 80/4) ve bu bentte beş yıllık süre şartı yoktur. Safi kazanç; elden çıkarma karşılığı, endekslenmiş maliyet bedeli
      ile satıcıda kalan giderler arasındaki farktır. Toptan eşya fiyat endeksindeki artış %10 veya üzerinde olduğundan iktisap
      bedeli artış oranında artırılır: 800.000 × (1 + 1,50) = 2.000.000 TL. Safi kazanç: 6.000.000 − 2.000.000 − 100.000 =
      3.900.000 TL. Limited şirket ortaklık payı menkul kıymet veya sermaye piyasası aracı olmadığından 150.000 TL''lik istisna
      uygulanır: 3.900.000 − 150.000 = 3.750.000 TL. Püf noktaları: (1) Ortaklık payı satışında 5 yıl şartı aranmaz; süre
      şartı mükerrer md. 80/6''daki mal ve haklar içindir. (2) Endeksleme artış oranı %150 ise maliyet 2,5 katına çıkar, 1,5
      katına değil. (3) İstisna, menkul kıymet satışlarında uygulanmaz; limited şirket payında uygulanır.'
    celdiriciler:
      A: Satış 5 yıldan sonra yapıldığı için kazanç doğmadığı düşünülmüştür; oysa ortaklık haklarının elden çıkarılmasında
        beş yıllık süre şartı yoktur (mükerrer md. 80/4).
      C: Satış giderleri (100.000 TL) düşülmemiştir; oysa elden çıkarma dolayısıyla yapılan ve satıcının uhdesinde kalan giderler
        safi kazancın hesabında indirilir.
      D: 150.000 TL'lik istisna uygulanmamıştır; oysa limited şirket ortaklık payı menkul kıymet sayılmadığından istisna bu
        satış için geçerlidir.
      E: Maliyet bedeli endekslenmemiştir (6.000.000 − 800.000 − 100.000 − 150.000); oysa artış oranı %10'un üzerinde olduğundan
        iktisap bedeli endekslenir.
    hesap_adimlari:
    - 'Endekslenmiş maliyet: 800.000 × (1 + 1,50) = 2.000.000 TL'
    - 'Safi kazanç: 6.000.000 − 2.000.000 − 100.000 = 3.900.000 TL'
