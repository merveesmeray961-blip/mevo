  kok: Adi komandit şirketin komanditer ortağı olan Bay (K), şirketin 2025 hesap dönemine ilişkin kârından kendisine düşen
    payı 14/5/2026 tarihinde nakden tahsil etmiştir. 193 sayılı Gelir Vergisi Kanunu'na göre bu kâr payı hangi gelir unsuru
    olarak ve hangi takvim yılında elde edilmiş sayılır?
  secenekler:
    A: Menkul sermaye iradı olarak, kârın ilişkin olduğu 2025 yılında elde edilmiş sayılır.
    B: Menkul sermaye iradı olarak, kâr payının tahsil edildiği 2026 yılında elde edilmiş sayılır.
    C: Ticari kazanç olarak, şirket kârının ilişkin olduğu 2025 yılında elde edilmiş sayılır.
    D: Ticari kazanç olarak, kâr payının tahsil edildiği 2026 yılında elde edilmiş sayılır.
    E: Diğer kazanç ve irat olarak, kâr payının tahsil edildiği 2026 yılında elde edilmiş sayılır.
  dogru: A
  aciklama:
    dogru_neden: GVK md. 75/2'ye göre limited şirket ortaklarının, iş ortaklıkları ortaklarının ve komanditerlerin kâr payları
      iştirak hisselerinden doğan kazanç olarak menkul sermaye iradı sayılır. Aynı bentte adi komandit şirketlerde komanditerlerin
