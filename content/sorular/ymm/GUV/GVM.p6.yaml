    A: 360.000 TL
    B: 400.000 TL
    C: 710.000 TL
    D: 750.000 TL
    E: 830.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Gayrisafi hasılat, takvim yılı içinde nakten veya aynen tahsil edilen kira bedelleridir (md. 72/1). Kira
      olarak doğan alacağın kiracıya olan borçla takası tahsil hükmündedir; dolayısıyla aralık ayı kirası da hasılata girer:
      11 × 40.000 + 40.000 = 480.000 TL. Ayrıca kiracı tarafından gayrimenkulün iktisadi değerini devamlı olarak artıracak
      şekilde ilave edilen kıymetler kira müddetinin sonunda bedelsiz kiralayana devredildiğinde, kiralayan bakımından o tarihte
      aynen tahsil olunmuş addolunur: +350.000 TL. Gayrisafi hasılat 830.000 TL''dir. Gerçek giderler (80.000 TL) düşüldüğünde
      safi irat 750.000 TL olur (md. 71). Püf noktaları: (1) Takas yoluyla kapanan kira da tahsil edilmiş sayılır. (2) Kiracının
      ilave ettiği kıymetlerin bedelsiz devri, devir tarihinde emsal bedelle hasılata girer. (3) Safi irat hasılattan giderler
      düşülerek bulunur.'
