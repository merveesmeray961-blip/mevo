      olan ücretin vergisine uygulanır (I doğru). Md. 31'e göre çalışma gücünün asgari %60'ını kaybetmiş hizmet erbabı ikinci
      derece engelli sayılır (III doğru). Md. 36 son fıkra uyarınca md. 31'deki indirimler dar mükellefiyete tabi kimselere
      şamil değildir (II yanlış). Md. 31'de belirtilen tutarlar aylık tutarlardır ve hizmet erbabının ücretinden indirilir;
      yıllık tutar ve yılın son ayında indirim öngörülmemiştir (IV yanlış).
