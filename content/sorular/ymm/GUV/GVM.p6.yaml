- id: YMM-GUV-GVM-0075
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: 'basit usul: adi ortaklıkta hadlerin toplu aranması ve şahsi işle birleştirme'
  tip: uygulama
  zorluk: 3
  kok: 'Bay (A) ve Bay (B), %50''şer paylı bir adi ortaklık kurarak toptan gıda alım satımı yapmaktadır. Ortaklığın 2026 yılı
    alımları 1.040.000 TL, satışları 1.500.000 TL''dir. Bay (A) ayrıca şahsi adına bir kırtasiye dükkânı işletmekte olup bu
    işin 2026 yılı alımları 700.000 TL, satışları 1.000.000 TL''dir. Bay (B)''nin ortaklık dışında başka bir faaliyeti yoktur.
    Tüm işyerleri ve kişiler basit usulün genel şartlarını ve diğer özel şartlarını taşımaktadır. 2026 yılı için mal alım
    satımı yapanlar bakımından basit usulde yıllık alım hadi 1.200.000 TL, yıllık satış hadi 1.900.000 TL''dir.


    Buna göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Ortaklığın ve şahsi işin hadleri ayrı ayrı aşılmadığından Bay (A), ortaklık ve Bay (B) basit usule tabidir.
    B: Yalnız Bay (A)'nın şahsi işi gerçek usule tabidir; ortaklık ve Bay (B) basit usulde kalmaya devam eder.
    C: Bay (A)'nın şahsi işi gerçek usule, ortaklıktaki payı ise basit usule tabidir; Bay (B) ise basit usulde kalmaya devam
      eder.
    D: Bay (A)'nın şahsi işi basit usulde kalır; yalnızca ortaklık kazancı ve Bay (B)'nin payı gerçek usulde tespit edilir.
    E: Bay (A)'nın şahsi işi ve ortaklıktaki payı gerçek usule tabidir; Bay (B)'nin payı da gerçek usulde tespit edilir.
  dogru: E
  aciklama:
    dogru_neden: 'GVK md. 46/5''e göre aynı işte ortak olarak çalışanlarda iş hacmi ölçüleri toplu olarak aranır; ortaklığın
      kendi hadleri aşılmamıştır (alım 1.040.000, satış 1.500.000 TL). Ancak adi ortaklık hâlinde çalışanlardan aynı zamanda
      şahsi bir işle de uğraşanların hangi usule tabi olacağı, şahsi işine ait ölçülere ortaklıklardan hissesine düşen miktarların
      eklenmesiyle belirlenir. Bay (A) için alım: 700.000 + %50 × 1.040.000 = 1.220.000 TL > 1.200.000 TL olduğundan (satış
      toplamı 1.750.000 TL hadi aşmasa da alım hadi yeterlidir) gerçek usule tabi olur. Ortaklarından birisi gerçek usulde
      vergilendirilen ortaklıklarda diğer ortakların ticari kazancı da gerçek usulde tespit edilir; bu nedenle ortaklık ve
      Bay (B) de gerçek usule geçer. Püf noktaları: (1) Hadlerden yalnız birinin (alım ya da satım) aşılması basit usulü bozar.
      (2) Ortaklığın tek başına hadleri aşmaması, ortağın şahsi işiyle birleşmesini engellemez. (3) Ortaklardan biri gerçek
      usule tabi olunca diğer ortaklar da etkilenir.'
    celdiriciler:
      A: Hadler ortaklık ve şahsi iş için ayrı ayrı değil, Bay (A) bakımından birlikte değerlendirilir; alım toplamı 1.220.000
        TL olup 1.200.000 TL hadi aşmaktadır.
      B: Ortaklarından biri gerçek usule tabi olan ortaklıkta diğer ortakların ticari kazancı da gerçek usulde tespit edilir;
        ortaklık ve Bay (B) basit usulde kalamaz.
      C: Gerçek veya basit usul seçimi mükellef için bütündür; Bay (A) hadlerin aşılması nedeniyle ortaklık payı dahil gerçek
        usulde vergilendirilir.
      D: Bay (A)'nın alım hadi şahsi iş ile ortaklık payı toplanarak aşıldığından şahsi işi basit usulde kalamaz; ayrıca ortaklık
        da gerçek usule geçer.
