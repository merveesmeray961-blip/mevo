- id: YMM-GUV-GVM-0068
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: 'dar mükellefiyet: kazancın Türkiye''de elde edilmesi'
  tip: uygulama
  zorluk: 3
  kok: Türkiye'de yerleşmiş olmayan gerçek kişilere ilişkin aşağıdaki durumlardan hangisinde elde edilen kazanç, 193 sayılı
    Gelir Vergisi Kanunu'nun 7. maddesine göre Türkiye'de elde edilmiş **sayılmaz**? (Çifte vergilendirmeyi önleme anlaşması
    hükümleri dikkate alınmayacaktır.)
  secenekler:
    A: Türkiye'de işyeri bulunan bir yabancı tacirin, bu işyeri aracılığıyla ve işyerinin bulunduğu yerde Türkiye'deki müşterilerine
      yaptığı satışlardan sağladığı ticari kazanç (satışlar işyeri üzerinden yapılmıştır)
    B: Fransa'da yerleşik bir mimarın, Fransa'daki bürosunda hazırladığı proje bedelinin Türkiye'deki bir şirket tarafından
      Türkiye'de ödenmesi sonucunda elde ettiği serbest meslek kazancı
    C: Yurt dışında yerleşik bir kişinin, Türkiye'de bulunan ve ticari işletmesine dahil olmayan dairesini Türkiye'de oturan
      bir kiracıya kiraya vermesinden elde ettiği kira geliri (dairenin Türkiye'de bulunması yeterlidir)
    D: İş merkezi Almanya'da olan ve Türkiye'de işyeri bulunduran bir tacirin, ihraç için Türkiye'de imal ettiği malları Türkiye'de
      satmaksızın (alıcı ve satış akdi Almanya'da) Almanya'ya göndermesinden doğan kazanç
    E: Yurt dışında yerleşik bir kişinin, Türkiye'de kurulu bir bankaya yatırdığı vadeli mevduattan elde ettiği faiz geliri
      (sermaye Türkiye'de yatırılmış olup faiz bu paradan doğmaktadır)
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 7/1''de ticari kazançlarda kazancın Türkiye''de elde edilmiş sayılması için kazanç sahibinin Türkiye''de
      işyerinin olması veya daimi temsilci bulundurması ve kazancın bu yerlerde ya da temsilciler aracılığıyla sağlanması
      aranır. Parantez içi hüküm uyarınca bu şartları taşısalar bile iş merkezi Türkiye''de bulunmayanlardan, ihraç edilmek
      üzere Türkiye''de satın aldıkları veya imal ettikleri malları Türkiye''de satmaksızın yabancı memleketlere gönderenlerin
      bu işlerden doğan kazançları Türkiye''de elde edilmiş sayılmaz. Olayda alıcı ve satıcı Türkiye dışındadır ve satış akdi
      de Almanya''da yapıldığından ''Türkiye''de satma'' söz konusu değildir. Diğer şıklardaki kazançların hepsi md. 7 kapsamında
      Türkiye''de elde edilmiş sayılır. Püf noktaları: (1) Tek kural, ticari kazançtaki parantez içi istisnadır; diğer şıklar
      bu istisnaya girmez. (2) ''Türkiye''de satmak'', alıcı ya da satıcıdan en az birinin Türkiye''de olması veya akdin Türkiye''de
      yapılması demektir; üçü de yurt dışındaysa satış Türkiye''de yapılmış sayılmaz. (3) B şıkkında hizmet yurt dışında ifa
      edilmiştir, ancak ödeme Türkiye''de yapıldığı için hizmet ''Türkiye''de değerlendirilmiş'' olur ve kazanç Türkiye''de
      elde edilmiş sayılır.'
    celdiriciler:
      A: Md. 7/1'e göre Türkiye'de işyeri bulunması ve kazancın bu işyerinde sağlanması, kazancın Türkiye'de elde edilmiş
        sayılması için yeterlidir.
      B: Serbest meslek kazancında faaliyetin Türkiye'de icra edilmesi veya değerlendirilmesi yeterlidir; ödemenin Türkiye'de
        yapılması değerlendirme sayılır (md. 7/4 ve son fıkra).
      C: Gayrimenkulün Türkiye'de bulunması, gayrimenkul sermaye iradının Türkiye'de elde edilmiş sayılması için yeterlidir
        (md. 7/5).
      E: Menkul sermaye iratlarında ölçüt, sermayenin Türkiye'de yatırılmış olmasıdır (md. 7/6); Türkiye'deki banka mevduatı
        bu şartı sağlar.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 7/1 (parantez içi hüküm)
    alinti: '1. (Değişik: 31/12/1981-2574/1 md.) Ticari kazançlarda: Kazanç sahibinin Türkiye''de işyerinin olması veya daimi
      temsilci bulundurması ve kazancın bu yerlerde veya bu temsilciler vasıtasiyle sağlanması (Bu şartları haiz olsalar dahi
      iş merkezi Türkiye''de bulunmayanlardan, ihraç edilmek üzere Türkiye''de satın aldıkları veya imal ettikleri malları
      Türkiye''de satmaksızın yabancı memleketlere gönderenlerin bu işlerden doğan kazançları Türkiye''de elde edilmiş sayılmaz.)'
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 7/1 (son paragraf)
    alinti: Türkiye'de satmaktan maksat, alıcı veya satıcının veya her ikisinin Türkiye'de olması veya satış aktinin Türkiye'de
      yapılmış olmasıdır. İş merkezinden maksat ise, iş bakımından muamelelerin bilfiil toplandığı ve idare edildiği merkezdir.
