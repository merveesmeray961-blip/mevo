- id: YMM-GUV-GVM-0073
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: 'gayrimenkul sermaye iradı: peşin tahsil edilen kiralar ve ölüm hâli'
  tip: hesaplama
  zorluk: 2
  kok: 'Bay (M), ticari işletmesine dahil olmayan iki işyerini kiraya vermiştir. 1/4/2026 tarihinde birinci işyerinin 1/4/2026
    - 31/3/2027 dönemine ait 12 aylık kirası olan 1.200.000 TL''yi peşin ve nakden tahsil etmiştir. İkinci işyerinden ise
    ocak-eylül 2026 aylarında her ay 20.000 TL kira tahsil etmiştir. Bay (M) 30/9/2026 tarihinde vefat etmiştir. Gider ve
    istisnalar dikkate alınmayacaktır.


    Bay (M)''nin ölümü nedeniyle verilecek beyannamede 2026 vergilendirme dönemi gayrisafi hasılatı olarak gösterilecek kira
    tutarı kaç TL''dir?'
  secenekler:
    A: 780.000 TL
    B: 1.080.000 TL
    C: 1.380.000 TL
    D: 1.440.000 TL
    E: 1.680.000 TL
  dogru: C
  aciklama:
    dogru_neden: Gayrimenkul sermaye iradında gayrisafi hasılat, takvim yılı içinde nakten veya aynen tahsil edilen kira bedelleridir
      (md. 72/1). Gelecek yıllara ait peşin kiralar normalde ilgili bulundukları yılların hasılatı sayılır; ancak ölüm ve
      memleketi terk hâllerinde mükellefiyetin kalktığı tarihi takip eden zamanlara ait olmak üzere peşin tahsil olunan kiralar,
      mükellefiyetin kalktığı dönemin hasılatı addolunur (md. 72/4). Vergilendirme dönemi, mükellefiyetin kalktığı tarihe
      kadar olan süreyle sınırlıdır (md. 108/1). Dolayısıyla 1.200.000 TL'nin tamamı 2026 dönemi hasılatıdır. İkinci işyerinden
      tahsil edilen 9 × 20.000 = 180.000 TL eklenince toplam 1.380.000 TL olur.
    celdiriciler:
      A: '780.000 TL = 600.000 + 180.000: peşin kiranın yalnız ölüm tarihine kadar olan 6 aylık kısmı alınmıştır; ölüm sonrasına
        ait kısım da mükellefiyetin kalktığı dönemin hasılatıdır.'
      B: '1.080.000 TL = 900.000 + 180.000: peşin kiranın yalnız 2026 takvim yılına düşen 9 aylık kısmı alınmıştır; ölüm hâlinde
        2027''ye ait kısım da 2026 hasılatına girer.'
      D: '1.440.000 TL: ikinci işyeri için 12 aylık (240.000 TL) kira eklenmiştir; oysa ölüm nedeniyle ekim-aralık aylarında
        kira tahsil edilmemiştir, tahsil edilen yalnız 180.000 TL''dir.'
      E: '1.680.000 TL: ocak-mart 2027''ye ait 300.000 TL ikinci kez eklenmiştir; bu kısım zaten 1.200.000 TL''lik peşin tahsilatın
        içindedir (çifte sayım).'
    hesap_adimlari:
    - 'Peşin kira (tamamı mükellefiyetin kalktığı 2026 dönemi hasılatı): 1.200.000 TL'
    - 'İkinci işyeri: 9 ay × 20.000 = 180.000 TL'
    - 'Toplam: 1.200.000 + 180.000 = 1.380.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 72/4
    alinti: Gelecek yıllara ait olup peşin tahsil olunan kiralar, ilgili bulundukları yılların hasılatı sayılır. Şu kadar
      ki, ölüm ve memleketi terk hallerinde mükellefiyetin kalktığı tarihi takibeden zamanlara ait olmak üzere peşin tahsil
      olunan kiralar, mükellefiyetin kalktığı dönemin hasılatı addolunur.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 108/1
    alinti: 1. Mükellefiyetin takvim yılı içinde kalkması halinde, vergilendirme dönemi, takvim yılı başından mükellefiyetin
      kalkması tarihine kadar geçen süreye inhisar eder;
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 72/1
    alinti: Gayrimenkul sermaye iratlarında, gayrisafi hasılat, 70 inci maddede yazılı mal ve hakların kiraya verilmesinden
      bir takvim yılı içinde o yıla veya geçmiş yıllara ait olarak nakten veya aynen tahsil edilen kira bedellerinin tutarıdır.
