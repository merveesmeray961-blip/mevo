        kiracıya olan borçla takası tahsil hükmündedir.
      E: Gayrisafi hasılat (830.000 TL) esas alınmış, gerçek giderler (80.000 TL) düşülmemiştir; safi irat hasılattan giderler
        düşülerek bulunur.
