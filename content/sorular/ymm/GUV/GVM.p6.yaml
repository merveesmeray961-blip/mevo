      D: 'Hem II hem IV yanlıştır: indirim dar mükelleflere uygulanmaz ve tutarlar md. 31''de aylık olarak belirlenmiştir.'
      E: IV numaralı öncül yanlıştır; indirim tutarları aylıktır. Ayrıca I numaralı doğru öncül seçenekte yer almamıştır.
