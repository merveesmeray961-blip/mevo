- id: YMM-GUV-GVM-0070
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: 'ücret kavramı: ücret sayılan ödemeler'
  tip: kavrama
  zorluk: 2
  kok: '193 sayılı Gelir Vergisi Kanunu''nun 61. maddesine göre aşağıdaki ödemelerden hangileri ücret sayılır?


    I. Hizmet sözleşmesi sona erdikten sonra, işverenle yapılan ikale sözleşmesi kapsamında eski çalışana ödenen iş kaybı
    tazminatı

    II. Mahkemece görevlendirilen bilirkişiye ödenen bilirkişi ücreti

    III. Bir yarışmada jüri üyesi olarak görev alan kişiye ödenen ücret

    IV. Çeşitli şirketlere kendi nam ve hesabına danışmanlık hizmeti veren serbest mali müşavire ödenen danışmanlık bedeli'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve IV
    D: I, III ve IV
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: GVK md. 61/7'ye göre hizmet sözleşmesi sona erdikten sonra karşılıklı sonlandırma veya ikale sözleşmesi kapsamında
      ödenen tazminatlar ve iş kaybı tazminatları ücret sayılır (I). Md. 61/5'e göre bilirkişilere ve her türlü yarışma jürisi
      üyelerine ödenen para, ayın ve menfaatler de ücret sayılır (II ve III). Müşavirlerin (danışmanların) kendi nam ve hesaplarına
      yürüttüğü faaliyet ise iş verene tabi olmaksızın yapıldığından serbest meslek faaliyetidir (md. 65 ve 66/4); ödenen
      bedel ücret değil serbest meslek kazancıdır (IV).
