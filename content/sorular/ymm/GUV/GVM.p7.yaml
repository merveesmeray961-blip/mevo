- id: YMM-GUV-GVM-0088
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: binek otomobil amortismanının gider yazılabilecek kısmı
  tip: hesaplama
  zorluk: 3
  kok: Ticari kazancını bilanço esasına göre tespit eden ve faaliyeti binek otomobil kiralama veya işletme olmayan Bay (N),
    2026 yılında özel tüketim vergisi ve katma değer vergisi hariç ilk iktisap bedeli 2.760.000 TL olan sıfır bir binek otomobil
    satın almış ve işletmesinde kullanmaya başlamıştır. Vergi Usul Kanunu'na göre bu otomobil için ayrılan yıllık normal amortisman
    tutarı (oran %20) hesaplanmıştır. 193 sayılı Kanun'un 40. maddesinin (7) numaralı bendi ve 2026 yılı için geçerli tutarlar
    esas alındığında, 2026 yılı kazancının tespitinde gider yazılabilecek amortisman tutarı kaç TL'dir?
  secenekler:
    A: 138.000 TL
    B: 276.000 TL
    C: 414.000 TL
    D: 552.000 TL
    E: 1.380.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'GVK md. 40/7''ye göre özel tüketim vergisi ve katma değer vergisi hariç ilk iktisap bedeli 1.380.000 TL''yi
      (2026 tutarı) aşan binek otomobillerinde, ayrılan amortismanın en fazla bu tutara isabet eden kısmı gider yazılabilir.
      Normal amortisman = 2.760.000 × %20 = 552.000 TL. Gider yazılabilecek kısım = 552.000 × (1.380.000 / 2.760.000) = 276.000
      TL. Püf noktaları: sınır amortisman tutarına değil, otomobilin ilk iktisap bedeline uygulanır ve amortisman bu orantıyla
      sınırlanır.'
    celdiriciler:
      A: Sınır oranı bir kez daha ikiye bölünmüştür; gider yazılabilecek kısım, normal amortismanın sınır tutarına isabet
        eden oranı kadardır (1.380.000 / 2.760.000 = yarısı).
      C: Sınır tutarı yanlışlıkla 2.070.000 TL gibi alınmış gibi hesaplanmıştır; ilk iktisap bedeli sınırı 1.380.000 TL olduğundan
        orantı yarıdır.
      D: Normal amortismanın tamamı gider yazılmıştır; oysa ilk iktisap bedeli sınırı aştığı için yalnızca sınıra isabet eden
        kısım gider yazılabilir.
      E: Sınır tutarının kendisi doğrudan amortisman gideri sanılmıştır; sınır, amortismana esas ilk iktisap bedeli için geçerlidir.
    hesap_adimlari:
    - Normal amortisman = 2.760.000 × %20 = 552.000 TL
    - Kabul edilen oran = 1.380.000 / 2.760.000 = 0,50
    - Gider yazılabilecek amortisman = 552.000 × 0,50 = 276.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 40/7
    alinti: özel tüketim vergisi ve katma değer vergisi hariç ilk iktisap bedeli 135.000 Türk lirasını (1.380.000 TL) , söz
      konusu vergilerin maliyet bedeline eklendiği veya binek otomobilin ikinci el olarak iktisap edildiği hâllerde, amortismana
      tabi tutarı 250.000 Türk lirasını (2.600.000 TL) aşan binek otomobillerinin her birine ilişkin ayrılan amortismanın
      en fazla bu tutarlara isabet eden kısmı gider yazılabilir.
  gecerlilik:
    baslangic: '2019-12-05'
