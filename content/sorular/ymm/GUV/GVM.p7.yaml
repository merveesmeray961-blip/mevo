- id: YMM-GUV-GVM-0093
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: zirai işletme hesabı esasında kazanç tespiti
  tip: hesaplama
  zorluk: 3
  kok: 'Zirai kazancını işletme hesabı esasına göre tespit eden çiftçi Bay (Z)''nin 2026 yılına ilişkin bilgileri şöyledir:


    - Zirai ürün satış hasılatı (tahsil edilen): 3.500.000 TL

    - Mahsulün hasara uğraması nedeniyle alınan sigorta tazminatı: 150.000 TL

    - Hesap dönemi sonundaki mahsullerin değeri: 400.000 TL

    - Hesap dönemi başındaki mahsullerin değeri: 250.000 TL

    - Tohum, gübre, ilaç ve yem giderleri: 1.200.000 TL

    - İşçi ücretleri: 600.000 TL

    - İşletmeye dahil olup aynı zamanda ailevi ihtiyaçlar için de kullanılan taşıta ilişkin amortisman: 120.000 TL; bu taşıtın
    diğer giderleri: 80.000 TL


    Başka gelir ve gider yoktur. 193 sayılı Kanun''un 55 ila 57. maddelerine göre Bay (Z)''nin 2026 yılı zirai kazancı kaç
    TL''dir?'
  secenekler:
    A: 1.840.000 TL
    B: 1.900.000 TL
    C: 1.990.000 TL
    D: 2.090.000 TL
    E: 2.240.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'GVK md. 55''e göre zirai işletme hesabı esasında kazanç; tahsil edilen veya tahakkuk eden hasılat ile ödenen
      veya borçlanılan giderler arasındaki pozitif farktır; hesap dönemi başındaki mahsullerin değeri giderlere, sonundaki
      mahsullerin değeri hasılata eklenir. Md. 56''ya göre sigorta tazminatları hasılattır; md. 57/11''e göre aynı zamanda
      ailevi ihtiyaçlar için de kullanılan taşıtların amortismanlarının tamamı ile giderlerinin yarısı gider yazılır. Hasılat
      = 3.500.000 + 150.000 + 400.000 = 4.050.000 TL. Gider = 250.000 + 1.200.000 + 600.000 + 120.000 + 40.000 = 2.210.000
      TL. Zirai kazanç = 4.050.000 − 2.210.000 = 1.840.000 TL. Püf noktaları: taşıtta amortisman tam, diğer giderler yarım
      yazılır; dönem başı mahsul değeri gidere, dönem sonu mahsul değeri hasılata eklenir.'
    celdiriciler:
      B: Ailevi ihtiyaçlar için de kullanılan taşıtın amortismanının yarısı gider yazılmıştır; kanun amortismanın tamamının,
        diğer giderlerin ise yarısının gider yazılmasına izin verir.
      C: Ailevi ihtiyaçlarda da kullanılan taşıtın amortismanı ve giderleri hiç gider yazılmamıştır; kanun amortismanın tamamı
        ile giderlerin yarısının indirimini kabul eder.
      D: Dönem başındaki mahsullerin değeri (250.000 TL) giderlere eklenmemiştir; işletme hesabı esasında dönem başı mahsul
        değeri giderlere eklenir.
      E: Hem dönem başı mahsul değeri giderlere eklenmemiş hem de taşıt amortismanı ile giderleri gider yazılmamıştır; her
        iki unsur da kazancı eksik indirmiştir.
    hesap_adimlari:
    - Hasılat = 3.500.000 + 150.000 + 400.000 = 4.050.000 TL
    - Gider = 250.000 + 1.200.000 + 600.000 + 120.000 + %50 × 80.000 = 2.210.000 TL
    - Zirai kazanç = 4.050.000 − 2.210.000 = 1.840.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 55
    alinti: Zirai işletme hesabı esasına göre zirai kazanç, hesap dönemi içinde para ile tahsil edilen veya alacak olarak
      tahakkuk eden hasılat ile, ödenen veya borçlanılan giderler arasındaki müspet farktır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 55
    alinti: Zirai kazancın işletme hesabı esasına göre tespitinde; hesap dönemi başındaki mahsullerin değeri giderlere, hesap
      dönemi sonundaki mahsullerin değeri ise hasılata ilave olunur.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 57/11
    alinti: '11. (Değişik: 4/12/1985-3239/52 md.) İşletmeye dahil olup, aynı zamanda zati veya ailevi ihtiyaçlar için de kullanılan
      taşıtların amortismanlarının tamamı ile giderlerinin yarısı.'
  gecerlilik:
    baslangic: '1985-12-04'
    bitis: null
    yila_bagli_tutar: false
