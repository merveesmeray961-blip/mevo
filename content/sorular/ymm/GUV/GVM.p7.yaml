- id: YMM-GUV-GVM-0087
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: ev imalatı internet satışlarında esnaf muaflığı ve banka tevkifatı
  tip: hesaplama
  zorluk: 3
  kok: Oturduğu evde, ayrı bir iş yeri açmaksızın ve sanayi tipi veya seri üretim yapabilen makine kullanmaksızın imal ettiği
    malları internet ortamında satan Bay (E), 193 sayılı Kanun'un 9. maddesinin (10) numaralı bendi kapsamında esnaf muaflığından
    yararlanmakta, Esnaf Vergi Muafiyeti Belgesi almış, bankada ticari hesap açmış ve tüm hasılatını bu hesap üzerinden tahsil
    etmektedir. 2026 yılında hesaba, Mart ayında 600.000 TL (bu ay içinde bir işçi 12 gün süreyle çalıştırılmıştır), Nisan
    ayında 700.000 TL (bu ay işçi çalıştırılmamıştır) aktarılmıştır. Yıllık hasılat kanundaki sınırı aşmamıştır; Cumhurbaşkanı
    oranları değiştirmemiştir. Bankaların bu iki aktarım üzerinden yapacağı toplam gelir vergisi tevkifatı kaç TL'dir?
  secenekler:
    A: 12.000 TL
    B: 26.000 TL
    C: 28.000 TL
    D: 40.000 TL
    E: 52.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 9(10)''a göre bankalar, ticari hesaplara aktarılan tutarlar üzerinden aktarım tarihi itibarıyla
      %4 (bir ve üzeri işçi çalıştırıldığı durumda %2) oranında gelir vergisi tevkifatı yapar; indirimli oranın uygulanması
      için ilgili ayda bir işçinin en az on gün süreyle çalıştırılması gerekir. Mart: 600.000 × %2 = 12.000 TL; Nisan: 700.000
      × %4 = 28.000 TL; toplam = 40.000 TL. Püf noktaları: işçi şartı her ay ayrı ayrı aranır; Mart''ta işçi 12 gün çalıştığından
      %2, Nisan''da işçi olmadığından %4 uygulanır.'
    celdiriciler:
      A: Yalnızca Mart ayındaki aktarım (%2 oranıyla) dikkate alınmış, Nisan ayındaki aktarım unutulmuştur.
      B: Her iki aktarıma da işçi çalıştırma indirimi (%2) uygulanmıştır; Nisan ayında işçi çalıştırılmadığı için bu aya %4
        uygulanır.
      C: Yalnızca Nisan ayındaki aktarım (%4 oranıyla) dikkate alınmış, Mart ayı aktarımı unutulmuştur.
      E: Her iki aktarıma da %4 uygulanmıştır; Mart ayında bir işçinin en az on gün çalıştırılması nedeniyle bu aya %2 oranı
        uygulanır.
    hesap_adimlari:
    - 'Mart: 600.000 × %2 = 12.000 TL (işçi 12 gün çalıştırıldı)'
    - 'Nisan: 700.000 × %4 = 28.000 TL (işçi yok)'
    - Toplam tevkifat = 40.000 TL
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 9(10)
    alinti: Bankalar, bu bent kapsamında açılan ticari hesaplara aktarılan tutarlar üzerinden, aktarım tarihi itibarıyla %4
      (bir ve üzeri işçi çalıştırıldığı durumda %2) oranında gelir vergisi tevkifatı yapmak
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: Md. 9(10)
    alinti: İstihdama bağlı indirimli oranın uygulanması için ilgili ayda bir işçinin en az on gün süreyle çalıştırılması
      gerekir.
