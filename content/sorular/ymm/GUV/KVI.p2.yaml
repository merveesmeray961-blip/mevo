    madde: geçici md. 16
    alinti: Bu maddenin yürürlüğe girdiği tarihten önce kurumların aktifinde yer alan taşınmazlar için 5 inci maddenin birinci
      fıkrasının (e) bendinin bu maddeyi ihdas eden Kanunla değiştirilmeden önceki hükümleri uygulanır. Şu kadar ki, bu Kanunun
      5 inci maddesinin birinci fıkrasının (e) bendinde yer alan %50 oranı, bu maddenin yürürlüğe girdiği tarihten sonra yapılacak
      taşınmaz satış kazançları için %25 olarak uygulanır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.6.2
