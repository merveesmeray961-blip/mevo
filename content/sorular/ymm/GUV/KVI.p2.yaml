- id: YMM-GUV-KVI-0007
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: emisyon primi
  tip: hesaplama
  zorluk: 1
  kok: (E) AŞ, 2026 yılında yaptığı nakdi sermaye artırımında itibari değeri toplam 2.000.000 TL olan yeni payları 3.200.000
    TL bedelle ihraç etmiştir. Şirket aynı yıl, kısa vadeli alım-satım amacıyla edindiği (F) AŞ paylarını satarak 400.000
    TL kazanç elde etmiştir. 5520 sayılı Kurumlar Vergisi Kanunu'nun 5/1-(ç) bendindeki emisyon primi istisnası kapsamındaki
    tutar kaç TL'dir?
  secenekler:
    A: '0'
    B: '900.000'
    C: 1.200.000
    D: 1.600.000
    E: 3.200.000
  dogru: C
  aciklama:
    dogru_neden: 'KVK 5/1-(ç) uyarınca anonim şirketlerin kuruluşlarında veya sermaye artırımlarında çıkardıkları payların
      bedelinin itibari değeri aşan kısmı kurumlar vergisinden istisnadır: 3.200.000 − 2.000.000 = 1.200.000 TL. Bu istisna
      oranlı değildir; itibari değeri aşan kısmın tamamı istisnadır. Tebliğe göre istisna, şirketin portföyündeki başka şirketlere
      ait payların satışından doğan kazancı kapsamaz; (F) AŞ paylarından elde edilen 400.000 TL bu istisnaya girmez.'
    celdiriciler:
      A: İstisna yalnız kuruluşta değil, sermaye artırımında çıkarılan payların itibari değeri aşan bedeline de uygulanır.
      B: '%75 oranı 5/1-(e) bendindeki satış kazancı istisnasına aittir; emisyon primi kısmi değil tam istisnadır.'
      D: (F) AŞ paylarının satış kazancı emisyon primi değildir; Tebliğe göre portföydeki başka şirket paylarının satışı istisna
        kapsamı dışındadır.
      E: İstisna ihraç bedelinin tamamına değil, yalnız itibari değeri aşan kısmına uygulanır; 2.000.000 TL'lik itibari değer
        sermayedir.
    hesap_adimlari:
    - Emisyon primi = ihraç bedeli − itibari değer = 3.200.000 − 2.000.000 = 1.200.000 TL
    - (F) AŞ paylarının satış kazancı emisyon primi istisnasına girmez
    - İstisna tutarı = 1.200.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(ç)
    alinti: ç) Anonim şirketlerin kuruluşlarında veya sermayelerini artırdıkları sırada çıkardıkları payların bedelinin itibarî
      değeri aşan kısmı.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.4
    alinti: İstisna, anonim şirketlerin portföylerinde bulunan başka şirketlere ait hisse senetlerinin elden çıkarılmasından
      sağlanan kazançları kapsamamaktadır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 3200000 - 2000000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi GUV-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_GUV-2.yaml, satır 1
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-GUV-KVI-0008
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: yurt dışı iştirak ve şube kazançları
  tip: bilgi
  zorluk: 1
  kok: 5520 sayılı Kurumlar Vergisi Kanunu'nun 5/1-(b) bendindeki yurt dışı iştirak kazançları istisnasının şartlarına ilişkin
    aşağıdaki ifadelerden hangisi **yanlıştır**? (Bentte yer alan ve en az %50 iştirak oranına bağlanan özel uygulama dikkate
    alınmayacaktır.)
  secenekler:
    A: İştirak kazancının, elde edildiği yılı izleyen takvim yılının sonuna kadar Türkiye'ye transfer edilmesi yeterlidir.
    B: İştirak edilen yabancı kurumun anonim veya limited şirket niteliğinde olması ve kanuni ve iş merkezinin Türkiye'de
      bulunmaması gerekir.
    C: İştirak payını elinde tutan kurumun, yurt dışı iştirakin ödenmiş sermayesinin en az %10'una sahip olması gerekir.
    D: Rüçhan hakkı kullanılarak edinilen paylarda bir yıllık elde tutma süresi, sahip olunan eski payların edinim tarihinden
      başlatılır.
    E: Esas faaliyet konusu finansman temini olan iştirakte vergi yükünün en az Türkiye'deki kurumlar vergisi oranında olması
      gerekir.
  dogru: A
  aciklama:
    dogru_neden: KVK 5/1-(b)-4 uyarınca iştirak kazancının, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin
      verilmesi gereken tarihe kadar Türkiye'ye transfer edilmesi gerekir. Takvim yılı hesap dönemi olan bir kurum için bu
      tarih, izleyen yılın Nisan ayının 25'idir; izleyen yılın sonuna kadar transfer yeterli değildir. Tebliğe göre bu süre
      içinde transfer edilmeyen kısım, sonradan getirilse de istisnadan yararlanamaz.
    celdiriciler:
      B: Doğru; istisna kanuni ve iş merkezi Türkiye'de bulunmayan anonim veya limited şirket niteliğindeki şirketlere iştirak
        hâlinde uygulanır.
      C: Doğru; 5/1-(b)-1 ödenmiş sermayenin en az %10'una sahip olmayı arar.
      D: Doğru; 5/1-(b)-2'deki parantez içi hükme göre rüçhan hakkı veya iç kaynaklardan sermaye artırımıyla edinilen paylarda
        eski payların edinim tarihi esas alınır.
      E: Doğru; esas faaliyet konusu finansman temini, sigorta veya menkul kıymet yatırımı olan iştiraklerde %15 yerine Türkiye'deki
        kurumlar vergisi oranında vergi yükü aranır.
  kaynaklar:
