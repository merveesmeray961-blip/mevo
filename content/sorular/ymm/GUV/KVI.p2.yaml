    E: 4.800.000
  dogru: B
  aciklama:
    dogru_neden: '7456 sayılı Kanunla 5/1-(e) bendinden taşınmaz satış kazancı istisnası çıkarılmıştır. Ancak KVK geçici 16.
      maddeye göre 15/7/2023''ten önce aktifte yer alan taşınmazlar için eski hükümler uygulanmaya devam eder ve bu tarihten
      sonraki satışlarda istisna oranı %25''tir. Bina 2020''den beri aktifte olduğundan iki tam yıl şartı da sağlanmıştır:
      4.800.000 × %25 = 1.200.000 TL.'
    celdiriciler:
      A: İstisna, 15/7/2023'ten önce aktifte bulunan taşınmazlar için geçici 16. madde ile %25 oranında sürdürülmüştür.
