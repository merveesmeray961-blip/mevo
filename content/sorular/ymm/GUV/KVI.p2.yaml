    madde: md. 5/1-(b)-1, 2
    alinti: 1) İştirak payını elinde tutan şirketin, yurt dışı iştirakin ödenmiş sermayesinin en az % 10’una sahip olması,
      2) Kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz olarak en az bir yıl süreyle elde tutulması (Rüçhan
      hakkı kullanılmak suretiyle veya yurt dışı iştirakin iç kaynaklarından yapılan sermaye artırımları nedeniyle elde edilen
      iştirak payları için sahip olunan eski iştirak paylarının elde edilme tarihi esas alınır.)
