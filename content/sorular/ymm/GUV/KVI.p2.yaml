    - (S) Gayrimenkul Yatırım Ortaklığı AŞ''den 800.000 TL: (S), 2025 yılında kâr dağıtım şartını sağlayamadığı için 5/1-(d)
    istisnasından yararlanamamış ve kazancı üzerinden genel hükümlere göre kurumlar vergisi ödemiştir.

    - Tam mükellef (T) İmalat AŞ''den 400.000 TL

    - 5/1-(d) istisnasından yararlanan ve taşınmaz yatırımı bulunmayan tam mükellef bir menkul kıymetler yatırım ortaklığının
    hisse senetlerinden 300.000 TL


    Buna göre (D) AŞ''nin bu kâr paylarından KVK 5/1-(a) kapsamında iştirak kazançları istisnasına konu edebileceği toplam
