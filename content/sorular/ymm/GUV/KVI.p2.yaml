      TL. Püf noktaları: GYO kâr paylarında belirleyici olan, ortaklığın (d) istisnasından yararlanıp yararlanmadığıdır; yararlanan
      GYO''dan gelen kâr payında yalnız asgari vergiye karşılık gelen oran (%10/%25) istisnaya konu edilir. İstisnadan yararlanamayan
      GYO''nun kâr payı ise ilk bakışta tersine görünse de tamamen istisnadır.'
    celdiriciler:
      A: (S) GYO kâr payı da istisna dışı sayılmıştır; oysa (d) istisnasından yararlanamayan ve vergilenen ortaklığın kâr
        payı iştirak kazancı istisnasına konu edilebilir.
      B: (R) GYO kâr payının tamamı istisna dışı bırakılmıştır; ödenen asgari vergiye isabet eden %10/%25 oranındaki kısım
        istisnaya konu edilebilir.
      D: Menkul kıymetler yatırım ortaklığı kâr payı da eklenmiştir; (d) istisnasından yararlanan ortaklığın kâr payı 5/1-(a)
        son paragrafı gereği istisna dışıdır.
      E: (R) GYO kâr payının tamamı istisna sayılmıştır; ortaklık kazancı genel oranda vergilenmediğinden yalnız 600.000 TL'lik
        kısım istisnaya konu edilir.
    hesap_adimlari:
    - '(R) GYO: (10/25) × 1.500.000 = 600.000 TL istisna'
    - '(S) GYO: (d) istisnasından yararlanamadığından 800.000 TL''nin tamamı istisna'
    - '(T) AŞ: 400.000 TL istisna'
    - 'Menkul kıymetler yatırım ortaklığı: 300.000 TL istisna dışı'
    - Toplam = 600.000 + 800.000 + 400.000 = 1.800.000 TL
