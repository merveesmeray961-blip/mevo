- id: YMM-GUV-KVI-0009
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: iştirak kazançları istisnası
  tip: kavrama
  zorluk: 2
  kok: 'Tam mükellef (A) AŞ''nin 2026 yılında elde ettiği kâr payları aşağıda verilmiştir:


    I. Dört ay önce satın aldığı ve sermayenin %2''sini temsil eden tam mükellef (B) AŞ paylarından aldığı kâr payı

    II. Kanuni ve iş merkezi Hollanda''da bulunan ve sermayesinin %60''ına iki yıldır sahip olduğu (C) BV''den aldığı kâr
    payı

    III. 5/1-(d) bendindeki istisnadan yararlanan tam mükellef bir menkul kıymetler yatırım ortaklığının hisse senetlerinden
    aldığı kâr payı

    IV. Ortağı olduğu tam mükellef (D) AŞ''nin yönetim kurulunda (A) AŞ''yi temsil eden üye vasıtasıyla elde ettiği ve GVK
    md. 75/2-(3) kapsamında bulunan kâr payı


    Bu kâr paylarından hangileri 5520 sayılı Kanun''un 5/1-(a) bendindeki iştirak kazançları istisnası kapsamındadır?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I ve IV
    E: I, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 5/1-(a) istisnası tam mükellef kurumların sermayesine katılımdan elde edilen kâr paylarını kapsar. Tebliğe
      göre iştirak oranı ve elde tutma süresi aranmaz; bu nedenle I istisnadır. Kurumun yönetim kurulundaki temsilcisi vasıtasıyla
      elde edilen kâr payları da (GVK 75/2-3) iştirak kazancı istisnasından yararlanır (IV). Kanuni ve iş merkezi yurt dışında
      bulunan kurumdan alınan kâr payı 5/1-(a) kapsamına girmez (II); bu kâr payı ancak şartları varsa 5/1-(b) kapsamında
      değerlendirilir. Yatırım ortaklıklarının hisse senetlerinden elde edilen kâr payları, (d) bendindeki istisnadan yararlanamayan
      ortaklıklardan elde edilenler dışında istisnadan yararlanamaz (III).
    celdiriciler:
      A: IV'teki kâr payı da Tebliğe göre iştirak kazancı istisnasından yararlanır; yalnız I eksiktir.
      B: II'deki kurum dar mükellef niteliğindedir; bu kâr payı 5/1-(a) değil, şartları varsa 5/1-(b) kapsamında değerlendirilir.
      C: II ve III 5/1-(a) kapsamı dışındadır; I ise oran ve süre şartı aranmadığı için istisnadır.
      E: III'teki ortaklık (d) bendindeki istisnadan yararlandığından, Kanunun açık hükmü gereği kâr payı istisnadan yararlanamaz.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(a) son paragraf
    alinti: Diğer yatırım fonu katılma payları ile yatırım ortaklıklarının hisse senetlerinden elde edilen, (d) bendindeki
      istisnadan yararlanamayan fon ve ortaklıklardan elde edilenler hariç, kâr payları bu istisnadan yararlanamaz.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.1
    alinti: Dar mükellef bir kurumdan, bir başka ifadeyle kanuni ve iş merkezi Türkiye dışında bulunan bir kurumdan kâr payı
      alan kurumlar ise bu bent ile düzenlenen iştirak kazançları istisnasından yararlanamayacaktır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.1
    alinti: İştirak oranına bakılmaksızın tam mükellef kurumlardan elde edilen kâr paylarının tamamı kurumlar vergisinden
      istisna edilecektir. Ayrıca, kâr payını elde eden kurumun tam mükellef kuruma belli bir süre iştirak etme şartı da aranılmamaktadır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.1
    alinti: Dolayısıyla, kurumların başka bir kuruma iştirak etmeleri nedeniyle bu kurumun yönetim kurulunda bulunan temsilcileri
      vasıtasıyla elde etmiş oldukları kâr payları da iştirak kazancı istisnasından yararlanabilecektir.
