    aktifine kaydettiği ve o tarihten beri depo olarak kullandığı binayı Mart 2026'da peşin bedelle satmış ve 4.800.000 TL
    satış kazancı elde etmiştir. Şirket istisnadan azami ölçüde yararlanmak istemekte olup istisna tutarı süresi içinde pasifte
    özel fon hesabına alınmıştır. Buna göre (K) AŞ'nin bu satış nedeniyle kurum kazancından indirebileceği istisna tutarı
    kaç TL'dir?
  secenekler:
    A: '0'
