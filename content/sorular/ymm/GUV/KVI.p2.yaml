- id: YMM-GUV-KVI-0014
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: yurt dışı iştirak ve şube kazançları
  tip: uygulama
  zorluk: 3
  kok: '(A) AŞ, elektronik ürün imalatıyla uğraşan ve kanuni ve iş merkezi (X) ülkesinde bulunan (Z) Ltd.''nin sermayesinin
    %30''una üç yıldır sahiptir. (A) AŞ 2026 yılında (Z) Ltd.''den kâr payı elde etmiş ve bu tutarı süresi içinde Türkiye''ye
    transfer etmiştir. Kâr payının kaynağı olan 2025 yılına ait (Z) Ltd. verileri şöyledir (birim):


    - Ticari bilanço kârı (vergi öncesi): 900

    - (X) ülkesi mevzuatına göre gider olarak kabul edilmeyen giderler: 100

    - (X) ülkesi mevzuatına göre kurumlar vergisinden istisna kazanç: 400

    - (X) ülkesinde kurumlar vergisi oranı: %20


    Kâr payı dağıtımında (X) ülkesinde vergi kesintisi yapılmamıştır. Buna göre bu kâr payının 5520 sayılı Kanun''un 5/1-(b)
    bendindeki vergi yükü şartı bakımından değerlendirilmesi aşağıdakilerden hangisidir? (Bentteki %50 iştirak oranına bağlı
    özel uygulama dikkate alınmayacaktır.)'
  secenekler:
    A: Vergi yükü %12'dir; şart sağlanmadığından istisnadan yararlanılamaz.
    B: Vergi yükü %15,38'dir; şart sağlandığından kâr payı istisnadır.
    C: Vergi yükü %22,22'dir; şart sağlandığından kâr payı istisnadır.
    D: Vergi yükü %20'dir; vergiye tabi matraha göre oran %15'i aştığından kâr payı istisnadır.
    E: Vergi yükü %13,33'tür; şart sağlanmadığından istisnadan yararlanılamaz.
  dogru: E
  aciklama:
    dogru_neden: '(X) ülkesinde vergiye tabi kazanç = 900 + 100 − 400 = 600; vergi = 600 × %20 = 120. Tebliğe göre vergi,
      istisna uygulandıktan sonraki matrah üzerinden hesaplanan vergidir. Dağıtılabilir kurum kazancı = 900 − 120 = 780 (gider
      kabul edilmeyen 100 birim fiilen harcandığından eklenmez). Vergi yükü = 120 / (780 + 120) = 120/900 = %13,33. %15''in
      altında kaldığından kâr payı 5/1-(b) istisnasından yararlanamaz. Püf noktaları: Payda, dağıtılabilir kazanç ile tahakkuk
      eden verginin toplamıdır (burada ticari kâra eşittir); vergiye tabi matrah veya ilgili ülkenin nominal oranı esas alınmaz,
      ülkede yararlanılan istisna fiili yükü düşürür.'
    celdiriciler:
      A: Gider kabul edilmeyen tutar dağıtılabilir kazanca eklenerek payda 1.000 alınmıştır; Tebliğe göre bu giderler eklenmez.
      B: Payda yalnız dağıtılabilir kazanç (780) alınmıştır; doğru payda dağıtılabilir kazanç ile verginin toplamıdır (900).
      C: (X) ülkesindeki istisna yok sayılarak vergi 200 bulunmuştur; vergi yükü fiilen tahakkuk eden vergiye (120) göre hesaplanır.
      D: Vergiye tabi matraha (600) göre oran hesaplanmıştır; vergi yükü dağıtılabilir kazanç ile vergi toplamına göre bulunur.
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.2.1.5
    alinti: Vergi yükü, yurt dışındaki iştirakin bulunduğu ülkede ilgili dönemde tahakkuk eden ve kâr payı dağıtımına kaynak
      olan kazançlar üzerinden ödenen vergiler de dahil olmak üzere, toplam gelir ve kurumlar vergisi benzeri verginin, bu
