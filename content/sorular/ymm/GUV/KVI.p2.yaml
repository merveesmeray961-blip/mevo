  aciklama:
    dogru_neden: 'Tebliğe göre 5/1-(d) istisnasından yararlanan fon ve ortaklıklardan elde edilen kâr payları kural olarak
      iştirak kazancı istisnasına konu edilemez; ancak bunların ödediği asgari kurumlar vergisinin kâr payına isabet eden
      kısmı için, [(asgari vergi oranı / tabi olunan kurumlar vergisi oranı) × kâr payı] kadar tutar istisnaya konu edilebilir:
      (10/25) × 1.500.000 = 600.000 TL. (d) istisnasından yararlanamayan (S) GYO''dan alınan kâr payı, kazanç ortaklık bünyesinde
      vergilendiğinden tamamen istisnadır: 800.000 TL. (T) AŞ kâr payı 400.000 TL istisnadır. (d) istisnasından yararlanan
