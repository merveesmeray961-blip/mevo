      D: '%75 oranı iştirak hisseleri ve benzeri kıymetlerin satışı için geçerlidir; taşınmazlara uygulanmaz.'
      E: Satış kazancının tamamı hiçbir dönemde istisna olmamıştır; kısmi istisna söz konusudur.
    hesap_adimlari:
    - Taşınmaz 15/7/2023'ten önce aktifte → geçici 16. madde uygulanır
    - İki tam yıl aktifte bulundurma şartı sağlanmıştır
    - İstisna = 4.800.000 × %25 = 1.200.000 TL
  kaynaklar:
