- id: YMM-GUV-KVI-0016
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: yurt dışı iştirak ve şube kazançları
  tip: uygulama
  zorluk: 3
  kok: Tam mükellef (A) AŞ, kanuni ve iş merkezi (X) ülkesinde bulunan (B) Ltd.'nin sermayesinin %12'sine iki yıldır sahiptir.
    (B) Ltd. finansman hizmetleri vermektedir; (X) ülkesinde kurumlar vergisi oranı %18'dir. 2026 yılında (B) Ltd. tarafından
    dağıtılan 200.000 TL kar payı Türkiye'ye beyanname tarihinden önce transfer edilmiştir. KVK md. 5/1-b'deki yurt dışı iştirak
    kazançları istisnasına ilişkin aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: İştirak payının kesintisiz en az bir yıl elde tutulması şartı sağlanmıştır.
    B: İştirak payının ödenmiş sermayenin en az %10'una sahip olma şartı sağlanmıştır.
    C: Finansman şirketlerinde vergi yükü Türkiye KV oranına (%25) eşit olmalıdır; %18 bu şartı sağlamaz.
    D: Transfer şartı sağlanmıştır; bu istisna için transfer şartı aranmamaktadır.
    E: Vergi yükü şartının sağlanamaması nedeniyle 200.000 TL kar payı istisnadan yararlanamaz.
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 5/1-b/4 uyarınca yurt dışı iştirak kazancı istisnasında kazancın beyanname verme tarihine kadar
      Türkiye''ye transfer edilmesi şartı aranmaktadır. ''Bu istisna için transfer şartı aranmamaktadır'' ifadesi yanlıştır.
      Püf noktaları: Finansman şirketlerinde vergi yükü eşiği %25 (Türkiye KV oranı) olup (X) ülkesindeki %18 bu eşiği karşılamaz.'
    celdiriciler:
      A: Bir yıl elde tutma şartı iki yıllık tutma ile sağlanmıştır; bu doğrudur.
      B: '%12 pay, %10 asgari eşiği aştığından şart sağlanmıştır; bu doğrudur.'
      C: Finansman şirketlerinde %25 oranı aranır; %18 yeterli değildir; bu doğrudur.
      E: Vergi yükü şartı sağlanmadığından istisna uygulanamaz; bu doğrudur.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Madde 5/1-b/4
    alinti: İştirak kazancının, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi gereken tarihe
      kadar Türkiye'ye transfer edilmesi.
  gecerlilik:
