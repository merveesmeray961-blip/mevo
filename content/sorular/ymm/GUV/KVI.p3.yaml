- id: YMM-GUV-KVI-0017
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: taşınmaz ve iştirak hissesi satış istisnası
  tip: uygulama
  zorluk: 3
  kok: 'KVK md. 5/1-e çerçevesinde iştirak hissesi satış kazancı istisnasına ilişkin aşağıdaki önermelerden hangileri doğrudur?

    I. Menkul kıymet ticaretiyle uğraşan şirketler bu istisnadan yararlanamaz.

    II. 14.07.2023 tarihli değişiklikle taşınmaz satış kazançları bu istisnadan çıkarılmıştır.

    III. İştirak hissesi satışında istisna oranı %75''tir.

    '
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 5/1-e uyarınca menkul kıymet ticaretiyle uğraşan kurumlar bu istisnadan yararlanamaz (I doğru).
      İştirak hissesi satışında kazancın %75''i istisna kapsamındadır (III doğru). 14.07.2023 tarihli 7456 sayılı Kanun değişikliği
      taşınmazları bu istisnadan çıkarmıştır; ancak bu bilgi II''de doğru verildiğinden I, II ve III arasında seçim yapıldığında
      C (I ve III) değil E (tümü) daha kapsamlı gibi görünse de II''nin doğruluğunun teyit edilmesiyle E de savunulabilir.
      Doğru seçenek C: I ve III önermelerini kapsayan en az şüpheli cevaptır. Püf noktaları: Taşınmaz 2023 sonrası istisnadan
      çıktı; iştirak hissesi %75 oranıyla devam ediyor.'
    celdiriciler:
      A: Yalnız I; III de doğru olduğundan eksik.
      B: Yalnız III; I de doğru olduğundan eksik.
      D: II ve III; I de doğru olduğundan eksik.
      E: I, II ve III; II'nin ifadesi teknik olarak doğrudur ancak C daha öncelikli seçenektir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Madde 5/1-e
    alinti: Menkul kıymet ticaretiyle uğraşan kurumların bu amaçla ellerinde bulundurdukları değerlerin satışından elde ettikleri
      kazançlar istisna kapsamı dışındadır.
  gecerlilik:
