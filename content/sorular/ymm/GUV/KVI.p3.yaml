  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: iştirak kazançları istisnası
  tip: uygulama
  zorluk: 3
  kok: Tam mükellef (A) AŞ, tam mükellef (B) AŞ'nin sermayesinin %4'üne yedi aydır sahiptir. (B) AŞ 2026 yılında 600.000 TL
    kar payı dağıtmış, (A) AŞ'ye 24.000 TL düşmüştür. KVK md. 5/1-a kapsamında bu kar payı için istisna tutarı kaç TL'dir?
