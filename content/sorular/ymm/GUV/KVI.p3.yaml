    A: '24.000'
    B: '12.000'
    C: '18.000'
    D: '0'
    E: '600.000'
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 5/1-a uyarınca tam mükellef kurumların tam mükellef başka bir kurumun sermayesine katılımlarından
      elde ettikleri kazançlar kurumlar vergisinden istisnadır. Herhangi bir asgari pay oranı veya elde tutma süresi şartı
      aranmaz. Bu nedenle 24.000 TL''nin tamamı istisna kapsamındadır. Püf noktaları: Md. 5/1-a iştirak kazancı istisnasında
      yurt dışı iştirakteki (md. 5/1-b) koşullar aranmaz.'
    celdiriciler:
      B: 12.000 TL; hatalı olarak %50 oranı uygulanmış gibi hesaplanmıştır.
      C: 18.000 TL; hatalı oran uygulamasından kaynaklanmaktadır.
      D: Sıfır istisna yanlıştır; tam mükellef kurumlar arası kar payının tamamı istisnaya tabidir.
      E: 600.000 TL; (B) AŞ'nin toplam dağıtımı değil, (A) AŞ'ye düşen 24.000 TL istisna konusudur.
