    madde: bölüm 5.11.2
    alinti: Ortaklarla yapılan muamelelerden doğan kazancın, şahsi ve ailevi gıda ve giyecek türü mallara ilişkin olan kısmının
      ayrımında, bu tür mallara ilişkin olarak ortaklarla yapılan iş hacminin, kooperatifin bu kapsama girmeyen işlemlere
      ait iş hacmi de dahil olmak üzere genel iş hacmine oranı esas alınacaktır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(i) üçüncü paragraf
    alinti: Ortaklardan başka kimselerle yapılan işlemlerden doğan kazançlar ile ortaklarla ortaklık statüsü dışında yapılan
      işlemlerden doğan kazançlar hakkında risturnlara ilişkin istisna hükmü uygulanmaz. Bunların genel kazançtan ayrılmasında,
      ortaklarla yapılan iş hacminin genel iş hacmine olan oranı esas alınır.
