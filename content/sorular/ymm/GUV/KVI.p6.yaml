  konu: KVI
  kazanim: tüketim kooperatiflerinde risturn istisnası
  tip: hesaplama
  zorluk: 2
  kok: Tam mükellef bir tüketim kooperatifinin 2026 yılı genel iş hacmi 12.000.000 TL'dir. Bu hacmin 6.000.000 TL'si ortaklara
    kişisel ve ailevi gıda ve giyecek ihtiyaçları için yapılan satışlardan, 2.000.000 TL'si ortaklara satılan elektrikli ev
    aletlerinden, 4.000.000 TL'si ise ortak olmayanlara yapılan satışlardan oluşmaktadır. Kooperatifin 2026 yılı toplam kazancı
    1.800.000 TL'dir. Kazancın iş hacmine orantılı olarak oluştuğu kabul edildiğine göre, KVK md. 5/1-(i) risturn istisnasına
    konu edilebilecek en fazla kazanç tutarı kaç TL'dir?
  secenekler:
    A: 600.000 TL
    B: 900.000 TL
    C: 1.200.000 TL
    D: 1.350.000 TL
    E: 1.800.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Tüketim kooperatiflerinde risturn istisnası, ortakların kişisel ve ailevi gıda ve giyecek ihtiyaçları için
      satın aldıkları mallara ilişkindir. Ortaklarla yapılan işlemlerden doğan kazancın bu mallara ilişkin kısmının ayrımında,
      bu mallara ilişkin ortaklarla yapılan iş hacminin, kooperatifin bu kapsama girmeyen işlemlerine ait iş hacmi de dahil
      genel iş hacmine oranı esas alınır: 6.000.000 / 12.000.000 = %50. İstisnaya konu edilebilecek en fazla kazanç 1.800.000
      × %50 = 900.000 TL''dir.'
    celdiriciler:
      A: 4.000.000 / 12.000.000 oranıdır; ortak olmayanlarla yapılan işlemlerin hacmi esas alınmıştır, oysa bu işlemlerden
        doğan kazanç istisna dışıdır.
      C: 8.000.000 / 12.000.000 oranıdır; elektrikli ev aletleri de dahil edilmiştir, oysa gıda ve giyecek dışındaki mallardan
        sağlanan kazanç vergilendirilir.
      D: Gıda ve giyecek hacmi, genel iş hacmi yerine yalnızca ortaklarla yapılan hacme (6.000.000 / 8.000.000) oranlanmıştır;
        Tebliğ genel iş hacmini esas alır.
      E: Kazancın tamamı alınmıştır; ortak olmayanlarla yapılan işlemler ve gıda-giyecek dışındaki satışlar ayrılmamıştır.
    hesap_adimlari:
    - Gıda ve giyecek ortak satışlarının genel iş hacmine oranı = 6.000.000 / 12.000.000 = %50
    - İstisnaya konu en fazla kazanç = 1.800.000 × %50 = 900.000 TL
  kaynaklar:
