- id: YMM-GUV-KVI-0058
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: yurt dışı iştirak kazançları istisnasında pay oranı, vergi yükü ve transfer şartları
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef, hesap dönemi takvim yılı olan (M) A.Ş. (imalat; bankacılık ve finans sektörü dışında faaliyet göstermektedir),
    2026 yılında aşağıdaki yurt dışı iştiraklerinden kâr payı elde etmiştir. Üç iştirak de kanuni ve iş merkezi Türkiye''de
    bulunmayan, imalat faaliyetinde bulunan anonim şirketlerdir; paylar kâr payının elde edildiği tarihte tabloda gösterilen
    süredir kesintisiz elde tutulmaktadır.


    | İştirak | Pay oranı | Süre | Kâr payı (TL) | Yurt dışı toplam vergi yükü | 2026 beyannamesinin verilmesi gereken tarihe
    kadar Türkiye''ye transfer |

    |---|---|---|---|---|---|

    | (X) | %25 | 4 yıl | 5.000.000 | %10 | Yapıldı |

    | (Y) | %60 | 3 yıl | 2.000.000 | %20 | Yapılmadı |

    | (Z) | %12 | 2 yıl | 3.000.000 | %18 | Yapıldı |


    Buna göre (M) A.Ş.''nin 2026 yılı kurumlar vergisi beyannamesinde yurt dışı iştirak kazançları istisnası kapsamında kurum
    kazancından indirebileceği toplam tutar kaç TL''dir?'
  secenekler:
    A: 3.000.000 TL
    B: 5.500.000 TL
    C: 7.000.000 TL
    D: 8.600.000 TL
    E: 10.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: '(X): %10''luk vergi yükü %15''in altında olduğundan genel şartlar sağlanmaz; ancak 11257 sayılı Cumhurbaşkanı
      Kararı (1/1/2026''dan itibaren) uyarınca ödenmiş sermayenin en az %20''sine sahip olunması ve kazancın beyanname verilme
      tarihine kadar Türkiye''ye transferi hâlinde diğer şartlar aranmaksızın istisna oranı %80''dir: 5.000.000 × %80 = 4.000.000
      TL. (Y): Pay oranı yüksek ve vergi yükü yeterli olsa da transfer şartı sağlanmadığından hiçbir istisna uygulanmaz. (Z):
      %12 pay (≥ %10), 2 yıl (≥ 1 yıl), %18 vergi yükü (≥ %15) ve transfer şartları sağlandığından kâr payının tamamı (3.000.000
      TL) istisnadır. Toplam: 4.000.000 + 3.000.000 = 7.000.000 TL. Püf noktaları: (1) 2026''dan itibaren %50 pay ve %50 oran
      değil, %20 pay ve %80 oran uygulanır. (2) Transfer şartı her iki yolda da zorunludur; (Y)''nin pay oranı ne kadar yüksek
      olursa olsun transfer yapılmadıkça istisna yoktur. (3) %80''lik yolda vergi yükü aranmaz; (X)''in %10 yükü bu yolda
      engel değildir.'
    celdiriciler:
      A: Yalnız (Z)'nin istisnasıdır; (X)'in %20 pay ve transferle %80 istisnadan yararlanabildiği gözden kaçırılmıştır.
      B: (X) için eski %50 oranı uygulanmıştır (2.500.000) ve (Z) eklenmiştir; 2026'dan itibaren oran %80'dir.
      D: (Y) de %80 oranla (1.600.000) eklenmiştir; oysa transfer şartı sağlanmadığından (Y) için istisna yoktur.
      E: Kâr paylarının tamamı istisna sayılmıştır; vergi yükü, pay oranı ve özellikle transfer şartları dikkate alınmamıştır.
    hesap_adimlari:
    - (X) = 5.000.000 × %80 = 4.000.000 TL (pay ≥ %20 ve süresinde transfer)
    - (Y) = 0 TL (transfer yapılmadı)
    - (Z) = 3.000.000 TL (genel şartların tamamı sağlandı)
    - Toplam = 4.000.000 + 0 + 3.000.000 = 7.000.000 TL
  kaynaklar:
  - mevzuat: 11257 sayılı Cumhurbaşkanı Kararı
    madde: madde 2/1
    alinti: MADDE 2- (1) 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanununun 5 inci maddesinin birinci fıkrasının
      (b) bendinin üçüncü paragrafı uyarınca uygulanacak istisna oranı, yurt dışı iştirakin ödenmiş sermayesinin en az %20'sine
      sahip olunması durumunda %80 olarak belirlenmiştir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(b)(4)
    alinti: 4) İştirak kazancının, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi gereken
      tarihe kadar Türkiye’ye transfer edilmesi.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.2.1.6
    alinti: Türkiye’ye bu süre içinde transfer edilmeyen yurt dışı iştirak kazançları, daha sonraki yıllarda Türkiye’ye transfer
      edilse dahi anılan istisnadan yararlanamayacaktır.
