- id: YMM-GUV-KVI-0062
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: iştirak hissesi satış istisnasında rüçhan hakkıyla edinilen hisselerin iktisap tarihi
  tip: hesaplama
  zorluk: 3
  kok: 'İmalat faaliyetinde bulunan, menkul kıymet ticaretiyle uğraşmayan ve holding niteliği taşımayan tam mükellef (K) A.Ş.,
    iştirak amacıyla edindiği (Y) A.Ş. paylarına ilişkin aşağıdaki işlemleri yapmıştır. (Y) A.Ş. payının itibari değeri 10
    TL''dir.


    - 2 Mart 2022: Bedelli olarak 10.000 adet pay, adet başına 10 TL''ye satın alınmıştır.

    - Mart 2025: (K) A.Ş., sahip olduğu paylar nedeniyle rüçhan hakkını kullanarak itibari değeri üzerinden (10 TL) 2.000
    adet yeni pay almıştır.

    - Eylül 2025: (K) A.Ş., rüçhan hakkını kullanarak itibari değerinin üzerinde adet başına 30 TL ödeyerek 1.000 adet yeni
    pay almıştır.


    (K) A.Ş. 20 Kasım 2026''da tüm paylarını (13.000 adet) adet başına 60 TL''den peşin satmıştır. KVK md. 5/1-(e) bendi uyarınca
    uygulanacak istisna oranı 9160 sayılı Cumhurbaşkanı Kararı ile %50''dir; satışa ilişkin diğer şartlar sağlanmıştır. Buna
    göre (K) A.Ş.''nin 2026 yılında bu satıştan doğan kazanç için uygulayabileceği istisna tutarı kaç TL''dir?'
  secenekler:
    A: 250.000 TL
    B: 300.000 TL
    C: 315.000 TL
    D: 450.000 TL
    E: 630.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Rüçhan hakkı kullanılarak itibari değeri üzerinden alınan paylar için iktisap tarihi olarak eski payların
      iktisap tarihi esas alınır; itibari değerden farklı bir bedelle alınan paylarda ise fiilen aktife girdikleri tarih esas
      alınır. Buna göre ilk 10.000 adet (2022) ve Mart 2025''te itibari değerle alınan 2.000 adet iki tam yılı doldurmuştur;
      Eylül 2025''te alınan 1.000 adet ise doldurmamıştır. Kazançlar: 10.000 × (60 − 10) = 500.000; 2.000 × (60 − 10) = 100.000;
      1.000 × (60 − 30) = 30.000 TL. İstisna: (500.000 + 100.000) × %50 = 300.000 TL. Püf noktaları: (1) Rüçhan hakkıyla alınan
      payın tarihi, alış bedeline bakılarak belirlenir: itibari değerle alınmışsa eski tarih, itibari değerin üzerindeyse
      yeni tarih. (2) İki tam yıl şartı sağlanmayan 30.000 TL kazanç vergilendirilir. (3) Güncel istisna oranı %50''dir, %75
      değildir.'
    celdiriciler:
      A: Mart 2025'te itibari değerle alınan paylar da kapsam dışı bırakılmıştır (500.000 × %50); oysa bu paylar için eski
        payların iktisap tarihi esas alınır.
      C: Eylül 2025'te alınan paylar da dahil edilmiştir (630.000 × %50); bu paylar iki tam yılı doldurmamıştır.
      D: İki tam yıl şartını sağlayan kazanca (600.000) %75 oranı uygulanmıştır; 9160 sayılı Karar ile oran %50'dir.
      E: Satış kazancının tamamı (630.000 TL) istisna sayılmıştır; istisna kazancın yalnızca belirli bir oranına uygulanır
        ve iki tam yıl şartı aranır.
    hesap_adimlari:
    - '10.000 adet: 10.000 × (60 − 10) = 500.000 TL (2022 — iki tam yıl sağlandı)'
    - '2.000 adet (itibari değerle rüçhan): 2.000 × (60 − 10) = 100.000 TL (eski payın tarihi — sağlandı)'
    - '1.000 adet (30 TL ile rüçhan): kazanç 30.000 TL (Eylül 2025 — sağlanmadı)'
    - İstisna = (500.000 + 100.000) × %50 = 300.000 TL
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.6.2.3.1.1
    alinti: Kurumların mevcut hisse senetleri dolayısıyla ellerinde bulunan rüçhan hakkı kuponları karşılığında itibari değeriyle
      yeni hisse senedi iktisap etmeleri halinde, yeni iktisap edilen söz konusu hisse senetleri açısından iktisap tarihi
      olarak, eski hisse senetleri ya da iştirak hissesinin iktisap tarihi esas alınacaktır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.6.2.3.1.1
    alinti: Bunun dışında, rüçhan hakkı dolayısıyla itibari değerinden farklı bir değerle hisse senedi iktisap edilmesi durumunda;
      bu hisse senetlerinin iktisap tarihi olarak, eski hisse senetleriyle ilişkilendirilmeksizin, fiilen kurumun aktifine
