- id: YMM-GUV-KVI-0057
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: gayrimenkul yatırım ortaklıklarının kazanç istisnasında kâr dağıtım şartı
  tip: hesaplama
  zorluk: 2
  kok: Hesap dönemi takvim yılı olan (G) Gayrimenkul Yatırım Ortaklığı A.Ş., esas faaliyet konusu itibarıyla gayrimenkul,
    gayrimenkul projeleri ve gayrimenkule dayalı haklardan oluşan portföyü işletmek amacıyla kurulmuştur. Ortaklığın 2026
    hesap döneminde yalnızca taşınmazlardan elde ettiği kazanç 12.000.000 TL'dir. Sermaye piyasası mevzuatına göre belirlenen
    net dağıtılabilir kâr 9.000.000 TL, Vergi Usul Kanunu'na göre tutulan kayıtlara göre tespit edilen kâr ise 6.000.000 TL'dir
    (kanuni yedek akçeler ve avans kâr payları dikkate alınmayacaktır). Buna göre Ortaklığın KVK md. 5/1-(d) bendindeki istisnadan
    yararlanabilmesi için, süresi içinde en az ne kadar tutarı kâr payı olarak dağıtması gerekir?
  secenekler:
    A: 3.000.000 TL
    B: 4.500.000 TL
    C: 6.000.000 TL
    D: 9.000.000 TL
    E: 12.000.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Taşınmaz kazançlarının en az %50''sinin kâr payı olarak dağıtılması şarttır. Dağıtıma esas kâr, sermaye
      piyasası mevzuatına göre belirlenen net dağıtılabilir kârdır; ancak bu tutar VUK kayıtlarına göre tespit edilen kârı
      aşamaz. SPK''ya göre net dağıtılabilir kâr (9.000.000 TL) VUK kârından (6.000.000 TL) yüksek olduğundan 6.000.000 TL
      esas alınır ve tamamı taşınmaz kazancı sayılarak yarısı dağıtılır: 6.000.000 × %50 = 3.000.000 TL.'
    celdiriciler:
      B: 9.000.000 TL'nin yarısıdır; SPK'ya göre net dağıtılabilir kâr, VUK kayıtlarındaki kârı aşamayacağı için esas alınamaz.
      C: 6.000.000 TL, dağıtıma esas kârın kendisidir; dağıtılması gereken tutar bunun yarısıdır.
      D: 9.000.000 TL, SPK'ya göre net dağıtılabilir kârın tamamıdır; hem sınırı aşmakta hem de %50'lik dağıtım oranını göz
        ardı etmektedir.
      E: 12.000.000 TL taşınmaz kazancının tamamıdır; ne VUK sınırı ne de %50 oranı dikkate alınmıştır.
    hesap_adimlari:
    - Dağıtıma esas kâr = min(SPK'ya göre net dağıtılabilir kâr 9.000.000; VUK'a göre kâr 6.000.000) = 6.000.000 TL
    - Dağıtılması gereken tutar = 6.000.000 × %50 = 3.000.000 TL
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 5.5.4
    alinti: Sermaye piyasası mevzuatına göre belirlenen net dağıtılabilir kar esas alınarak kar dağıtımı yapılması gerekmektedir.
      Ancak net dağıtılabilir karın, Vergi Usul Kanununa göre tutulan kayıtlar kapsamında tespit edilen kar tutarını aşmaması
      gerekir. Sermaye piyasası mevzuatına göre belirlenen net dağıtılabilir karın, Vergi Usul Kanununa göre tutulan kayıtlar
      kapsamında tespit edilen kardan daha düşük olması halinde, sermaye piyasası mevzuatına göre belirlenen net dağıtılabilir
      karın dikkate alınacağı tabiidir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-(d) son paragraf
    alinti: Bu istisnadan faydalanılabilmesi için fon ve ortaklıkların (emeklilik yatırım fonları hariç) sahip oldukları taşınmazlardan
      elde ettikleri kazançların en az %50’sinin, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi
      gereken ayı izleyen ikinci ayın sonuna kadar kâr payı olarak dağıtılması şarttır.
  gecerlilik:
    baslangic: '2026-05-24'
    bitis: null
    yila_bagli_tutar: false
    yil: 2026
  dogrulama:
    python: 'esas = min(9000000, 6000000)

      sonuc = esas * 50 / 100

      '
