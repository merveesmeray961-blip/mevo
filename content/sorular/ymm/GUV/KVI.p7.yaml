    madde: Md. 5/B(3)
    alinti: İstisna uygulamasına patent veya faydalı model belgesinin verildiği tarihten itibaren başlanır ve ilgili patent
      veya faydalı model belgesi için sağlanan koruma süresi aşılmamak kaydıyla bu istisnadan yararlanılabilir.
