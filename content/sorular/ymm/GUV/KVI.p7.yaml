      (5/B(4)). Püf noktaları: serbest meslek kazancı ve gayrimenkul sermaye iradındaki kesinti %50 indirimli uygulanır; kesinti
      tamamen kalkmaz.'
    celdiriciler:
      B: İstisna uygulamasının kesinti suretiyle alınan vergilere şümulü yoktur; yalnızca serbest meslek kazançları ile gayrimenkul
        sermaye iratları üzerinden yapılacak kesinti %50 indirimli uygulanır.
      C: Bu madde kapsamında istisnadan yararlanan mükellefler 4691 sayılı Kanun kapsamındaki istisnadan ayrıca yararlanamazlar.
      D: Bu madde gelir vergisi mükellefleri hakkında da uygulanır.
      E: Buluşa ilişkin incelemeli sistem ile patent veya araştırma raporu sonucunda faydalı model belgesi alınması gerekir;
        incelemesiz tescil yetmez.
  kaynaklar:
