- id: YMM-GUV-KVI-0067
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: kooperatiflerin kurumlar vergisi muafiyeti
  tip: bilgi
  zorluk: 3
  kok: 5520 sayılı Kanun'un 4. maddesinin birinci fıkrasının (k) bendinde düzenlenen kooperatif muafiyetine ilişkin aşağıdakilerden
    hangisi **doğrudur**?
  secenekler:
    A: Kooperatiflerin ortak dışı işlemleri nedeniyle kooperatif tüzel kişiliğine bağlı ayrı bir iktisadi işletme oluşmuş
      kabul edilir.
    B: Tüketim ve taşımacılık kooperatifleri de yapı kooperatifleri gibi aynı şartlarla bu muafiyetten yararlanır.
    C: Yapı kooperatiflerinin kendilerine ait arsalarını kat karşılığı vererek her bir hisse için bir konut elde etmeleri
      ortak dışı işlem sayılır.
    D: Kooperatifin tam mükellef başka bir kurumun sermayesine katılımından kazanç elde etmesi muafiyeti ortadan kaldırır.
    E: Yapı kooperatiflerinde yapı ruhsatı ve arsa tapusunun ortaklar adına tescil edilmiş olması aranır.
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 4(1)(k)''ya göre kooperatiflerin ortak dışı işlemleri nedeniyle kooperatif tüzel kişiliğine bağlı
      ayrı bir iktisadi işletme oluşmuş kabul edilir. Tüketim ve taşımacılık kooperatifleri muafiyet kapsamı dışındadır; faaliyetin
      icrasına tahsis edilen ekonomik ömrünü tamamlamış kıymetlerin elden çıkarılması ve kat karşılığı arsa verilmesi ortak
      dışı işlem sayılmaz; iştirak kazancı muafiyeti etkilemez; yapı ruhsatı ve arsa tapusu kooperatif adına tescil edilmelidir.
      Püf noktaları: ortak dışı işlemler iktisadi işletme doğurur, kooperatifin muafiyeti tümden kalkmaz.'
    celdiriciler:
      B: Bu bentte tüketim ve taşımacılık kooperatifleri muafiyet kapsamı dışında tutulmuştur.
      C: Bu işlem ortak dışı işlem sayılmaz; hüküm bu işlemleri açıkça ortak dışı işlem kapsamının dışında tutmuştur.
      D: Kooperatiflerin tam mükellef başka bir kurumun sermayesine katılımlarından kazanç elde etmesinin ve bu kazançların
        ortaklara dağıtılmasının muafiyete etkisi yoktur.
      E: Muafiyet için yapı ruhsatı ve arsa tapusunun ortaklar adına değil, kooperatif tüzel kişiliği adına tescil edilmiş
        olması gerekir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 4(1)-k
    alinti: Tüketim ve taşımacılık kooperatifleri hariç olmak üzere, ana sözleşmelerinde sermaye üzerinden kazanç dağıtılmaması
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 4(1)-k
    alinti: Kooperatiflerin faaliyetin icrasına tahsis ettikleri ve ekonomik ömrünü tamamlamış olan demirbaş, makine, teçhizat,
