- id: YMM-GUV-KVI-0066
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: yabancı fon kazançlarının vergilendirilmesi
  tip: bilgi
  zorluk: 3
  kok: 5520 sayılı Kanun'un 5/A maddesinde düzenlenen yabancı fonların portföy yöneticiliği yapan tam mükellef şirketler aracılığıyla
    elde ettikleri kazançlara ilişkin aşağıdaki ifadelerden hangisi **doğrudur**?
  secenekler:
    A: Aktif büyüklüğünün %51'inden fazlası Türkiye'deki taşınmazlardan oluşan şirketlerin hisse senetlerinden elde edilen
      kazançlar da bu madde kapsamındadır.
    B: Madde kapsamındaki istisna, fonların Türkiye kaynaklı gelirleri üzerinden yapılacak vergi kesintilerini de kapsar.
    C: Transfer fiyatlandırması raporunun süresinde verilmemesi hâlinde portföy yöneticisi fonun daimi temsilcisi sayılmaz.
    D: Fonun katılımcı ve kurucuları arasında tam mükellef kişilerin kazanç payı %10'u aşarsa bildirim yapılır.
    E: Portföy yöneticisi ile ilişkili kişilerin fon kazançları üzerindeki hakkı, hizmet bedelleri düşüldükten sonra %20'den
      fazla olmamalıdır.
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 5/A(1)(ç)''ye göre portföy yöneticiliği yapan şirketin ve ilişkili olduğu kişilerin yabancı fonun
      kazançları üzerinde, sağladığı hizmet mukabilinde hesaplanan bedeller düşüldükten sonra, doğrudan veya dolaylı olarak
      %20''den fazla hak sahibi olmaması şartı aranır. Fonun tam mükellef katılımcı payı %5''i aşarsa bildirim yapılır; istisna
      kesintiye şamil değildir; rapor verilmezse portföy yöneticisi daimi temsilci sayılır. Püf noktaları: %20 hak sahipliği
      sınırı hizmet bedelleri düşüldükten sonra hesaplanır; bildirim eşiği %5''tir.'
    celdiriciler:
      A: Bu tür şirketlerin hisse senetlerinden elde edilen kazançlar madde kapsamına girmez.
      B: Maddede düzenlenen kazanç istisnasının, fonların Türkiye kaynaklı gelirleri üzerinden yapılacak vergi kesintilerine
        şümulü yoktur.
      C: Raporun süresinde verilmemesi durumunda ilgili hesap dönemi için portföy yöneticiliği yapan şirket fonun Türkiye'de
        daimi temsilcisi sayılır.
      D: Bildirim yükümlülüğü, tam mükellef kişi veya kurumların kazanç payının %5'i geçmesi hâlinde doğar.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 5/A(1)-ç
    alinti: ç) Portföy yöneticiliği yapan şirketin ve ilişkili olduğu kişilerin yabancı fonun kazançları üzerinde, sağladığı
      hizmet mukabilinde her ne ad altında olursa olsun hesaplanan bedeller düşüldükten sonra, doğrudan veya dolaylı olarak
      %20’den fazla hak sahibi olmaması.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 5/A(4)
    alinti: fonun katılımcı ve kurucuları arasında doğrudan veya dolaylı olarak tam mükellef gerçek kişi veya kurumların kazanç
      payının %5’i geçmesi durumunda, tam mükellef gerçek kişi veya kurum kurucu veya katılımcılarının tamamı portföy yöneticiliği
      yapan şirket tarafından Maliye Bakanlığı Gelir İdaresi Başkanlığına bildirilir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
