- id: YMM-GUV-KVI-0064
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde istisnalar
  konu: KVI
  kazanim: sınai mülkiyet hakları istisnası
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (P) A.Ş.''nin 2026 yılı ticari bilanço kârı 14.000.000 TL''dir. Bu kârın içinde, Türkiye''de gerçekleştirilen
    Ar-Ge faaliyetleri neticesinde ortaya çıkan ve patent belgesi (patent sahibi (P) A.Ş.''dir) ile koruma altına alınmış
    bir buluşa ilişkin şu kazançlar vardır: buluşun kiralanmasından elde edilen kazanç 3.000.000 TL, buluşun devrinden elde
    edilen kazanç 2.000.000 TL, buluşun Türkiye''deki üretim sürecinde kullanılması sonucu üretilen ürünlerin satışından elde
    edilen kazancın buluşa atfedilen kısmı 5.000.000 TL ve buluşa yönelik hakların ihlali nedeniyle alınan tazminat 1.000.000
    TL. İstisnanın diğer şartları sağlanmış olup Cumhurbaşkanı Kararı ile oranlar değiştirilmemiştir; başka düzeltme, istisna
    veya zarar yoktur. 5520 sayılı Kanun''un 5/B maddesi uyarınca istisna sonrası kurum kazancı kaç TL''dir?'
  secenekler:
    A: 3.000.000 TL
    B: 5.000.000 TL
    C: 7.000.000 TL
    D: 8.500.000 TL
    E: 9.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 5/B(1)''e göre buluşun kiralanması, devri veya satışı, seri üretimi ve üretim sürecinde kullanılması
      sonucu üretilen ürünlerin satışından elde edilen kazançların (buluşa atfedilen kısım) %50''si kurumlar vergisinden müstesnadır;
      istisna hakların ihlali neticesinde elde edilen gelirler ile buluş nedeniyle alınan tazminatlar için de uygulanır. İstisnaya
      konu kazanç = 3.000.000 + 2.000.000 + 5.000.000 + 1.000.000 = 11.000.000 TL; istisna = %50 × 11.000.000 = 5.500.000
      TL; kurum kazancı = 14.000.000 − 5.500.000 = 8.500.000 TL. Püf noktaları: istisna oranı %50''dir; ihlal tazminatı da
      istisna kapsamındadır; ürün satışında yalnızca buluşa atfedilen kısım dikkate alınır.'
    celdiriciler:
      A: İstisna oranı %100 alınmıştır; kanunda sınai mülkiyet haklarından elde edilen kazançların yalnızca %50'si kurumlar
        vergisinden müstesnadır.
      B: Ürün satışına atfedilen kazanç %100, diğerleri %50 oranında istisna edilmiştir; istisna oranı tüm kalemler için %50'dir.
      C: Ticari kârın tamamı %50 oranında istisna edilmiştir; oysa istisna yalnızca buluşa ilişkin sayılan kazanç kalemlerine
        uygulanır.
      E: İhlal nedeniyle alınan tazminat (1.000.000 TL) istisna kapsamına alınmamıştır; kanun, hakkın ihlali ve buluş nedeniyle
        alınan tazminatlar için de istisnayı uygular.
    hesap_adimlari:
    - İstisnaya konu kazanç = 3.000.000 + 2.000.000 + 5.000.000 + 1.000.000 = 11.000.000 TL
    - İstisna = 11.000.000 × %50 = 5.500.000 TL
    - Kurum kazancı = 14.000.000 − 5.500.000 = 8.500.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 5/B(1)
    alinti: Türkiye’de gerçekleştirilen araştırma, geliştirme ve yenilik faaliyetleri ile yazılım faaliyetleri neticesinde
      ortaya çıkan buluşların; a) Kiralanması neticesinde elde edilen kazanç ve iratların, b) Devri veya satışı neticesinde
      elde edilen kazançların, c) Türkiye’de seri üretime tabi tutularak pazarlanmaları hâlinde elde edilen kazançların, ç)
      Türkiye’de gerçekleştirilen üretim sürecinde kullanılması sonucu üretilen ürünlerin satışından elde edilen kazançların
      patentli veya faydalı model belgeli buluşa atfedilen kısmının, % 50’si kurumlar vergisinden müstesnadır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 5/B(1)
    alinti: Bu istisna, buluşa yönelik hakların ihlal edilmesi neticesinde elde edilen gelirler ile buluş nedeniyle alınan
      sigorta veya diğer tazminatlar için de uygulanır.
  gecerlilik:
    baslangic: '2016-07-15'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'istisna = 0.5*(3000000+2000000+5000000+1000000)

      sonuc = round(14000000 - istisna)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Anahtar bağımsız çözümle ve mevzuat/2026 tutarlarıyla doğrulandı; tek doğru şık,
          açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_GUV/GUV_KVI_20261111_1.yaml#1
  - tarih: '2026-11-11'
