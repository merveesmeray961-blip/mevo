      kat karşılığı vererek her bir hisse için bir işyeri veya konut elde etmeleri ortak dışı işlem sayılmaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 4(1)-k
    alinti: Kooperatiflerin ortak dışı işlemleri nedeniyle kooperatif tüzel kişiliğine bağlı ayrı bir iktisadi işletme oluşmuş
      kabul edilir.
