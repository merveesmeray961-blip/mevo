  kok: 5520 sayılı Kanun'un 5/B maddesindeki sınai mülkiyet haklarına ilişkin istisnanın uygulanma esaslarıyla ilgili aşağıdakilerden
    hangisi **doğrudur**?
  secenekler:
    A: Belgenin verildiği tarihten itibaren başlanır ve koruma süresi aşılmamak kaydıyla yararlanılır.
    B: İstisna, kesinti suretiyle alınan vergilere de şamildir; bu nedenle ilgili ödemelerden kesinti yapılmaz.
    C: İstisnadan yararlananlar, 4691 sayılı Kanun kapsamındaki istisnadan da ayrıca yararlanabilir.
    D: İstisna yalnızca kurumlar vergisi mükelleflerine uygulanır; gelir vergisi mükellefleri kapsamda değildir.
    E: Faydalı model belgesi için inceleme yapılmaksızın yapılan tescil yeterlidir.
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 5/B(3)''e göre istisna uygulamasına patent veya faydalı model belgesinin verildiği tarihten itibaren
      başlanır ve ilgili belge için sağlanan koruma süresi aşılmamak kaydıyla yararlanılır. İstisna kesintiye şamil değildir
