  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: kurumlar vergisi mükellefleri
  tip: bilgi
  zorluk: 1
  kok: 5520 sayılı Kurumlar Vergisi Kanunu'nun 2. maddesine göre aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kanunun uygulanmasında sendikalar vakıf, cemaatler ise dernek sayılır.
    B: İş ortaklıkları, ayrıca talep aranmaksızın kuruldukları anda kurumlar vergisi mükellefi olur.
    C: SPK'nın düzenleme ve denetimine tabi fonlar ile bunlara benzer yabancı fonlar sermaye şirketi sayılır.
    D: İktisadi kamu kuruluşlarının tüzel kişiliklerinin bulunmaması mükellefiyetlerini ortadan kaldırır.
    E: Dernek iktisadi işletmesinin kârını kuruluş amacına tahsis etmesi, işletmenin iktisadi niteliğini kaldırır.
  dogru: C
  aciklama:
    dogru_neden: KVK md.2/1'e göre Kanunun uygulanmasında Sermaye Piyasası Kurulunun düzenleme ve denetimine tâbi fonlar ile
      bu fonlara benzer yabancı fonlar sermaye şirketi sayılır.
    celdiriciler:
      A: 'Ters ifade edilmiştir: md.2/5''e göre sendikalar dernek, cemaatler ise vakıf sayılır.'
      B: Md.2/7'ye göre iş ortaklıkları ancak bu şekilde mükellefiyet tesis edilmesini talep ederlerse kurumlar vergisi mükellefi
        olur.
      D: Md.2/6'ya göre tüzel kişiliğin olmaması iktisadi kamu kuruluşlarının mükellefiyetini etkilemez.
      E: Md.2/6'ya göre kârın kuruluş amaçlarına tahsis edilmesi iktisadi niteliği değiştirmez.
    hesap_adimlari: []
