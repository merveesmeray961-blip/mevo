- id: YMM-GUV-KVM-0025
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: kanunen kabul edilmeyen giderler (KVK md.11)
  tip: hesaplama
  zorluk: 2
  kok: '(Z) AŞ''nin Vergi Usul Kanunu''na göre tespit edilmiş öz sermayesi 1/1/2026 itibarıyla 2.000.000 TL, 31/12/2026 itibarıyla
    2.500.000 TL''dir. Şirketin 2026 yılı içinde borçlarının en yüksek olduğu tarihteki durumu şöyledir:


    - %60 oranındaki ortağı (H) Holding''den doğrudan alınan borç: 8.000.000 TL

    - (H) Holding''in %30 oranında ortağı olduğu ve ana faaliyet konusuna uygun olarak faaliyette bulunan (B) Bankası''ndan
    alınan kredi: 2.000.000 TL


    (B) Bankası yalnızca ilişkili şirketlere finansman sağlayan bir kredi şirketi değildir; borçlanmalar gayrinakdi teminata
    dayanmamaktadır. Buna göre 5520 sayılı Kanun''un 12. maddesine göre (Z) AŞ''nin 2026 hesap dönemi için örtülü sermaye
    tutarı kaç TL''dir?'
  secenekler:
    A: 1.500.000
    B: 2.000.000
    C: 2.500.000
    D: 3.000.000
    E: 4.000.000
  dogru: D
  aciklama:
    dogru_neden: 'Öz sermaye, hesap dönemi başındaki öz sermayedir: 2.000.000 TL; sınır üç katı olan 6.000.000 TL''dir. (H)
      Holding''in %10''dan fazla ortağı olduğu banka ortakla ilişkili kişidir; ana faaliyet konusuna uygun faaliyette bulunan
      ilişkili bankadan yapılan borçlanmalar %50 oranında dikkate alınır (1.000.000 TL). Dikkate alınacak borç: 8.000.000
