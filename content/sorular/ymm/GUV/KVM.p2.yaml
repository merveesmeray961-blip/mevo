- id: YMM-GUV-KVM-0023
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: kurumlar vergisi mükellefleri
  tip: uygulama
  zorluk: 2
  kok: 'Aşağıdaki işletmelerin 2026 yılındaki durumları verilmiştir:


    I. Bir belediyeye ait, tüzel kişiliği ve ayrılmış sermayesi bulunmayan, yalnızca maliyetini karşılayacak düzeyde ücret
    alan ve yıl boyu faaliyet gösteren otopark işletmesi

    II. Bir belediyeye ait olup belediye sınırları içinde otobüsle yolcu taşıyan işletme

    III. Bir işçi sendikasına ait, üyelerine ve ziyaretçilere yıl boyu hizmet veren kafeterya

    IV. Bir vakfın yılda bir kez iki gün süreyle düzenlediği ve gelirini burs fonuna aktardığı hayır çarşısı (kermes)


    5520 sayılı Kanun''un mükellefiyet ve muafiyet hükümlerine göre hangilerinin kazancı kurumlar vergisine tabidir?'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve III
    E: I, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'I: Belediyeye ait, faaliyeti devamlı ticari işletme iktisadi kamu kuruluşudur; tüzel kişiliğin, ayrılmış
      sermayenin olmaması ve bedelin yalnız maliyeti karşılaması mükellefiyeti etkilemez (md.2/3, 2/6). III: Kanunun uygulanmasında
      sendikalar dernek sayılır; sendikaya ait, faaliyeti devamlı kafeterya dernek iktisadi işletmesidir (md.2/5).'
    celdiriciler:
      A: II'deki belediye sınırları içinde faaliyette bulunan yolcu taşıma işletmeleri md.4/1-ı uyarınca kurumlar vergisinden
        muaftır.
      C: II muaftır; IV'te faaliyet devamlı olmadığından iktisadi işletme oluşmaz.
      D: II, iktisadi kamu kuruluşu niteliğinde olsa da md.4/1-ı'daki muafiyet kapsamındadır.
      E: IV'te yılda bir kez iki gün süren faaliyet 'devamlılık' şartını taşımaz; dernek veya vakıf iktisadi işletmesi oluşmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 2/3
    alinti: '(3) İktisadî kamu kuruluşları: Devlete, il özel idarelerine, belediyelere, diğer kamu idarelerine ve kuruluşlarına
      ait veya bağlı olup, faaliyetleri devamlı bulunan ve birinci ve ikinci fıkralar dışında kalan ticarî, sınaî ve ziraî
      işletmeler iktisadî kamu kuruluşudur.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 2/5
    alinti: '(5) Dernek veya vakıflara ait iktisadî işletmeler: Dernek veya vakıflara ait veya bağlı olup faaliyetleri devamlı
      bulunan ve bu maddenin birinci ve ikinci fıkraları dışında kalan ticarî, sınaî ve ziraî işletmeler ile benzer nitelikteki
      yabancı işletmeler, dernek veya vakıfların iktisadî işletmeleridir. Bu Kanunun uygulanmasında sendikalar dernek; cemaatler
      ise vakıf sayılır.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 2/6
    alinti: (6) İktisadî kamu kuruluşları ile dernek veya vakıflara ait iktisadî işletmelerin kazanç amacı gütmemeleri, faaliyetlerinin
      kanunla verilmiş görevler arasında bulunması, tüzel kişiliklerinin olmaması, bağımsız muhasebelerinin ve kendilerine
      ayrılmış sermayelerinin veya iş yerlerinin bulunmaması mükellefiyetlerini etkilemez. Mal veya hizmet bedelinin sadece
      maliyeti karşılayacak kadar olması, kâr edilmemesi veya kârın kuruluş amaçlarına tahsis edilmesi bunların iktisadî niteliğini
      değiştirmez.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 4/1-ı-2
    alinti: 2) Belediye sınırları içinde faaliyette bulunan yolcu taşıma işletmeleri,
