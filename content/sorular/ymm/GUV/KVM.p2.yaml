    alinti: '(7) İş ortaklıkları: Yukarıdaki fıkralarda yazılı kurumların kendi aralarında veya şahıs ortaklıkları ya da gerçek
      kişilerle, belli bir işin birlikte yapılmasını ortaklaşa yüklenmek ve kazancını paylaşmak amacıyla kurdukları ortaklıklardan
      bu şekilde mükellefiyet tesis edilmesini talep edenler iş ortaklıklarıdır. Bunların tüzel kişiliklerinin olmaması mükellefiyetlerini
