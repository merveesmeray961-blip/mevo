- id: YMM-GUV-KVM-0024
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: kurum kazancının tespiti
  tip: kavrama
  zorluk: 2
  kok: 'Sermayesi paylara bölünmüş komandit şirket olarak kurulmuş (K) Şirketi''nin 2026 hesap dönemine ilişkin aşağıdaki
    kalemlerden hangileri, 5520 sayılı Kanun''a göre kurum kazancının tespitinde indirim konusu yapılabilir?


    I. Olağan genel kurul toplantısı için yapılan giderler

    II. Komandite ortağa ayrılan kâr payı

    III. Kanunla belirlenmiş bir had bulunmaksızın tahvillerin itibari değerinin altında ihracından doğan zarar

    IV. Esas sözleşme gereğince safi kazançtan ayrılan olağanüstü yedek akçe

    V. Şirketin kuruluşu ve örgütlenmesi için yapılan giderler'
  secenekler:
    A: I, II ve V
    B: I ve V
    C: I, III ve V
    D: II, IV ve V
    E: I, II, III ve V
  dogru: A
  aciklama:
    dogru_neden: KVK md.8/1'e göre kuruluş ve örgütlenme giderleri (b), genel kurul toplantıları için yapılan giderler (c)
      ve sermayesi paylara bölünmüş komandit şirketlerde komandite ortağın kâr payı (ç) kurum kazancının tespitinde ayrıca
      hasılattan indirilebilir.
    celdiriciler:
      B: Komandite ortağın kâr payı da md.8/1-ç uyarınca indirilebilir; II dışarıda bırakılamaz.
      C: III, md.11/1-e uyarınca kabul edilmeyen indirimdir; ayrıca II eksiktir.
      D: IV, md.11/1-ç uyarınca kabul edilmeyen indirimdir; ayrıca I eksiktir.
      E: Menkul kıymetlerin itibari değerinin altında ihracından doğan zararlar md.11/1-e'ye göre indirilemez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 8/1-b, c, ç
    alinti: b) Kuruluş ve örgütlenme giderleri. c) Genel kurul toplantıları için yapılan giderler ile birleşme, devir, bölünme,
      fesih ve tasfiye giderleri. ç) Sermayesi paylara bölünmüş komandit şirketlerde komandite ortağın kâr payı.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-ç
    alinti: ç) Her ne şekilde ve ne isimle olursa olsun ayrılan yedek akçeler (Türk Ticaret Kanununa, kurumların kuruluş kanunlarına,
      Cumhurbaşkanlığı kararnamelerine, tüzüklerine, ana statülerine veya sözleşmelerine göre safî kazançlardan ayırdıkları
      tüm yedek akçeler ile
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-e
    alinti: e) Kanunlarla veya kanunların verdiği yetkiye dayanılarak tespit edilen hadler saklı kalmak kaydıyla, menkul kıymetlerin
      itibarî değerlerinin altında ihracından doğan zararlar ile bu menkul kıymetlere ilişkin olarak ödenen komisyonlar ve
      benzeri her türlü giderler.
