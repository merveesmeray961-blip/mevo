- id: YMM-GUV-KVM-0022
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: kurumlar vergisi mükellefleri
  tip: uygulama
  zorluk: 1
  kok: Esas sözleşmesine göre kanuni merkezi Malta'da bulunan Delta Ltd.'nin yönetim kurulu toplantıları, ticari kararları
    ve muhasebe işlemleri fiilen İzmir'deki ofisinde yürütülmektedir. Delta Ltd. 2026 yılında İzmir'deki faaliyetlerinden
    ve İtalya'daki şubesinden kazanç elde etmiştir. 5520 sayılı Kanun'a göre Delta Ltd.'nin mükellefiyetine ilişkin aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Kanuni merkezi Türkiye dışında olduğundan dar mükelleftir; yalnız İzmir'deki kazancı vergilenir.
    B: Tam mükellefiyet için kanuni ve iş merkezinin birlikte Türkiye'de olması gerektiğinden dar mükelleftir.
    C: Tam mükelleftir; ancak yalnız Türkiye'de elde ettiği kazançlar üzerinden vergilendirilir.
    D: Dar mükelleftir; ancak İzmir'deki işyerine atfedilebilen yurt dışı kazançları da vergilenir.
    E: İş merkezi Türkiye'de olduğundan tam mükelleftir; İzmir ve İtalya kazançlarının tamamı vergilenir.
  dogru: E
  aciklama:
    dogru_neden: Md.3/1'e göre kanuni veya iş merkezi Türkiye'de bulunan kurumlar tam mükelleftir; iki merkezden birinin Türkiye'de
      olması yeterlidir. İş merkezi, işlemlerin fiilen toplandığı ve yönetildiği merkezdir (md.3/6); bu merkez İzmir'dedir.
      Tam mükellef olarak Türkiye içinde ve dışında elde edilen kazançların tamamı vergilendirilir.
    celdiriciler:
      A: Kanuni merkezin yurt dışında olması dar mükellefiyet için yetmez; dar mükellefiyet iki merkezin de Türkiye dışında
        olmasını gerektirir.
      B: Tam mükellefiyet için kanuni 'veya' iş merkezinin Türkiye'de olması yeterlidir.
      C: Tam mükellefiyette vergilendirme Türkiye içi ve dışı kazançların tamamını kapsar.
      D: İş merkezi Türkiye'de olduğundan kurum dar mükellef değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 3/1-2
    alinti: '(1) Tam mükellefiyet: Kanunun 1 inci maddesinde sayılı kurumlardan kanunî veya iş merkezi Türkiye''de bulunanlar,
      gerek Türkiye içinde gerekse Türkiye dışında elde ettikleri kazançların tamamı üzerinden vergilendirilirler. (2) Dar
      mükellefiyet: Kanunun 1 inci maddesinde sayılı kurumlardan kanunî ve iş merkezlerinin her ikisi de Türkiye''de bulunmayanlar,
      sadece Türkiye''de elde ettikleri kazançları üzerinden vergilendirilirler.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 3/6
    alinti: '(6) İş merkezi: İş bakımından işlemlerin fiilen toplandığı ve yönetildiği merkezdir.'
