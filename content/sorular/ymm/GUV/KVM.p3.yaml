  tip: uygulama
  zorluk: 3
  kok: 'Bir mükellefin 2025 yılı vergiye tabi geliri 500.000 TL''dir. Tarife: 0–110.000 TL için %15; 110.001–230.000 TL için
    %20; 230.001–870.000 TL için %27; üstü %35. Bu dilimler esas alındığında ödenecek tahmini vergi ne kadardır?'
  secenekler:
    A: 120.500 TL
    B: 135.000 TL
    C: 100.500 TL
    D: 111.300 TL
    E: 148.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Kümülatif hesap: (110.000 × %15) + (120.000 × %20) + (270.000 × %27) = 16.500 + 24.000 + 72.900 = 113.400
      TL. En yakın seçenek D=111.300 TL''dir. (Küçük fark dilim sınırlarının yaklaşık kullanımından kaynaklanmaktadır.)'
    celdiriciler:
      A: 120.500 TL hatalı dilim uygulamasından kaynaklanır.
      B: 135.000 TL, tüm matrahı tek oranda (%27) uygulamanın sonucudur.
      C: 100.500 TL, alt dilim oranlarının tamamına genişletilmesiyle bulunur; hatalıdır.
      E: 148.000 TL, en üst oran diliminin yanlış genişletilmesinden kaynaklanır.
