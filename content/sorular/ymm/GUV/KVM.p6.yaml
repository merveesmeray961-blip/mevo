- id: YMM-GUV-KVM-0085
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: tasfiye kârının hesaplanması (servet değeri)
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (T) A.Ş.'nin tasfiye dönemi başındaki bilançosunda görülen öz sermayesi 3.000.000 TL'dir. Bu tasfiye döneminde
    ortaklar mevcut sermayeye ilave olarak 200.000 TL ödeme yapmış, 100.000 TL tutarında vergiden istisna edilmiş iştirak
    kazancı elde edilmiş ve ortaklara avans olarak 350.000 TL ödenmiştir. Tasfiye dönemi sonundaki bilançoda öz sermaye 4.300.000
    TL olarak görülmektedir. Başka düzeltme kalemi yoktur. 5520 sayılı Kanun'un 17. maddesine göre bu tasfiye döneminin tasfiye
    kârı kaç TL'dir?
  secenekler:
    A: 650.000 TL
    B: 1.000.000 TL
    C: 1.300.000 TL
    D: 1.350.000 TL
    E: 1.650.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Tasfiye kârı, dönem sonundaki servet değeri ile dönem başındaki servet değeri arasındaki olumlu farktır
      (md. 17/4). Ortaklara yapılan avans ödemeleri dönem sonundaki servet değerine; ortakların ilave sermaye ödemeleri ile
      tasfiye esnasında elde edilen istisna edilmiş kazançlar dönem başındaki servet değerine eklenir. Dönem sonu: 4.300.000
      + 350.000 = 4.650.000 TL; dönem başı: 3.000.000 + 200.000 + 100.000 = 3.300.000 TL; tasfiye kârı 1.350.000 TL''dir.
      Püf noktaları: (1) Avans dönem sonuna, sermaye ilavesi ve istisna kazanç dönem başına eklenir; yönleri karıştırmayın.
      (2) Eklemelerin net etkisi sıfır olmadığında düzeltmesiz fark (1.300.000 TL) yanlış sonuç verir.'
    celdiriciler:
      A: Avansı dönem sonundan düşüp diğer kalemleri dönem başına eklemek (4.300.000 − 350.000 − 3.300.000) bu sonucu verir;
        avans dönem sonuna eklenir.
      B: Avans ödemesini dönem sonuna eklememek (4.300.000 − 3.300.000) bu sonucu verir; hatalıdır.
      C: Hiçbir düzeltme yapmadan öz sermaye farkını almak (4.300.000 − 3.000.000) bu sonucu verir; md. 17/4-(a) düzeltmeleri
        gereklidir.
      E: Sermaye ilavesi ve istisna kazancı dönem başına eklememek (4.650.000 − 3.000.000) bu sonucu verir; hatalıdır.
    hesap_adimlari:
    - 'Dönem sonu servet değeri: 4.300.000 + 350.000 = 4.650.000 TL'
    - 'Dönem başı servet değeri: 3.000.000 + 200.000 + 100.000 = 3.300.000 TL'
    - 'Tasfiye kârı: 4.650.000 − 3.300.000 = 1.350.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/4
    alinti: '(4) Tasfiye kârı: Tasfiye halindeki kurumların vergi matrahı tasfiye kârıdır. Tasfiye kârı, tasfiye döneminin
      sonundaki servet değeri ile tasfiye döneminin başındaki servet değeri arasındaki olumlu farktır.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/4-a
    alinti: 1) Ortaklara veya kurum sahiplerine tasfiye esnasında avans olarak veya diğer şekillerde yapılan her türlü ödemeler
      tasfiyenin sonundaki servet değerine, 2) Mevcut sermayeye ilave olarak ortaklar veya sahipleri tarafından yapılan ödemeler
      ile tasfiye esnasında elde edilen ve vergiden istisna edilmiş olan kazanç ve iratlar tasfiye döneminin başındaki servet
      değerine, eklenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/5
