      indirilir (Tebliğ 8.4). Matrah: 6.000.000 + 500.000 (kabul edilmeyen gider) − 1.200.000 (komandite kâr payı) − 300.000
      (iştirak kazancı istisnası) = 5.000.000 TL; kurumlar vergisi 5.000.000 × %25 = 1.250.000 TL''dir.'
