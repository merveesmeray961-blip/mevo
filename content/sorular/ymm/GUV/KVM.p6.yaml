- id: YMM-GUV-KVM-0086
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: 'transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı: ilişkili kişi oranı, Hazine zararı, düzeltme ve ceza
    indirimi'
  tip: kavrama
  zorluk: 2
  kok: 'Aşağıdaki öncüllerden hangileri 5520 sayılı Kurumlar Vergisi Kanunu''nun 13. maddesindeki transfer fiyatlandırması
    yoluyla örtülü kazanç dağıtımına ilişkin hükümlere uygundur?


    I. İlişkinin doğrudan veya dolaylı olarak ortaklık kanalıyla oluştuğu durumların örtülü kazanç dağıtımı kapsamında sayılması
    için en az %10 oranında ortaklık, oy veya kâr payı hakkının bulunması şartı aranır.


    II. Tam mükellef kurumlar arasında yurt içinde gerçekleştirilen işlemler nedeniyle kazancın örtülü olarak dağıtıldığının
