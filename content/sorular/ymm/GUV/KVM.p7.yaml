  kazanim: kanunen kabul edilmeyen giderler ve kurum kazancı
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (B) A.Ş.''nin 2026 yılı ticari bilanço kârı 20.000.000 TL''dir. Bu kârın hesaplanmasında gider yazılan
    kalemlerden bazıları şunlardır:


    - Her türlü şans ve bahis oyunlarına ait ilan ve reklam giderleri (tamamı 17/4/2026 tarihinden sonra yapılan reklamlara
    aittir): 600.000 TL

    - Alkollü içki ve tütün mamullerine ait ilan ve reklam giderleri: 800.000 TL

    - 5651 sayılı Kanun''un ek 4. maddesi kapsamında hakkında reklam yasağı uygulananlara verilen reklamların giderleri: 250.000
    TL

    - Esas faaliyet konusu ile ilgili olmayan yat için yapılan gider ve amortisman: 350.000 TL


    Cumhurbaşkanı Kararı ile oranlar değiştirilmemiştir; başka düzeltme, istisna, indirim veya zarar yoktur. (B) A.Ş.''nin
    2026 yılı kurum kazancı kaç TL''dir?'
  secenekler:
    A: 21.000.000 TL
    B: 21.200.000 TL
    C: 21.350.000 TL
    D: 21.600.000 TL
    E: 22.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 11(1)''e göre: şans ve bahis oyunları reklam giderleri (k) tamamen, alkollü içki ve tütün mamulü
      reklam giderlerinin %50''si (ı), reklam yasağı uygulananlara verilen reklam giderleri (j) tamamen ve esas faaliyetle
      ilgisiz yat giderleri ile amortismanları (f) tamamen kabul edilmeyen gider olarak kurum kazancına eklenir. KKEG = 600.000
      + 400.000 + 250.000 + 350.000 = 1.600.000 TL; kurum kazancı = 20.000.000 + 1.600.000 = 21.600.000 TL. Püf noktaları:
      alkol ve tütün reklamında yalnızca %50 eklenir; diğer üç kalem tamamen eklenir.'
    celdiriciler:
      A: Şans ve bahis oyunlarına ait reklam giderleri (600.000 TL) kurum kazancına eklenmemiştir; bu giderler 2/4/2026 tarihli
        değişiklikle tamamen indirimi kabul edilmeyen giderler arasına alınmıştır.
      B: Alkollü içki ve tütün mamulü reklam giderlerinin %50'si (400.000 TL) eklenmemiştir; bu giderlerin yarısı kanunen
        kabul edilmeyen gider sayılır.
      C: Reklam yasağı uygulananlara verilen reklam giderleri (250.000 TL) eklenmemiştir; bu giderler de indirim konusu yapılamaz.
      E: Alkollü içki ve tütün reklam giderlerinin tamamı (800.000 TL) eklenmiştir; kanun bu giderlerin yalnızca %50'sinin
        indirimini kabul etmez.
    hesap_adimlari:
    - KKEG = 600.000 (tamamı) + 400.000 (%50 × 800.000) + 250.000 + 350.000 = 1.600.000 TL
    - Kurum kazancı = 20.000.000 + 1.600.000 = 21.600.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 11(1)-f
    alinti: f) Kiralama yoluyla edinilen veya işletmede kayıtlı olan; yat, kotra, tekne, sürat teknesi gibi motorlu deniz
      taşıtları ile uçak, helikopter gibi hava taşıtlarından işletmenin esas faaliyet konusu ile ilgili olmayanların giderleri
      ve amortismanları.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 11(1)-ı
    alinti: ı) Her türlü alkol ve alkollü içkiler ile tütün ve tütün mamullerine ait ilan ve reklam giderlerinin % 50’si.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
