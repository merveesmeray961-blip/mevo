  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: inşaat ve onarım hakedişlerinde vergi kesintisi
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (M) A.Ş., birden fazla takvim yılına yaygın, 193 sayılı Kanun'un 42. maddesi kapsamında demiryolu ve raylı
    sistemler ile gemi inşaat ve onarım işleri dışında kalan bir inşaat işini yüklenen tam mükellef (Y) A.Ş.'ye 2026 yılında
    hakediş ödemesi yapacaktır. Kesilmesi gereken vergiyi (M) A.Ş. üstlenmiş olup (Y) A.Ş.'ye vergi kesintisi yapılmaksızın
    tam 1.900.000 TL ödenecektir (tutarlar KDV hariçtir). 5520 sayılı Kanun'un 15. maddesi ve 9707 sayılı Cumhurbaşkanı Kararı
    uyarınca bu ödemeden kesilecek vergi kaç TL'dir?
  secenekler:
    A: 19.000 TL
    B: 95.000 TL
    C: 99.750 TL
    D: 100.000 TL
    E: 475.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Raylı sistem ve gemi inşaat/onarım işleri dışındaki diğer işlerde kesinti oranı %5''tir (9707 sayılı Karar
      md. 2). Kesilmesi gereken verginin ödemeyi yapan tarafından üstlenilmesi halinde vergi kesintisi, ödenen tutar ile ödemeyi
      yapanın yüklendiği verginin toplamı üzerinden hesaplanır (KVK md. 15(7)). Kesinti = %5 × (1.900.000 + kesinti) ise kesinti
      = 1.900.000 × 0,05 / 0,95 = 100.000 TL. Doğrulama: 1.900.000 + 100.000 = 2.000.000 brüt; %5''i = 100.000 TL. Püf noktaları:
      vergi üstlenildiğinde brüt tutar bulunur (net / 0,95); oran inşaat türüne göre %1 veya %5''tir.'
    celdiriciler:
      A: Raylı sistem ve gemi işlerine uygulanan %1 oranı kullanılmış; bu işler dışındaki inşaat ve onarım işlerinde oran
        %5'tir.
      B: Verginin ödemeyi yapan tarafından üstlenilmesi dikkate alınmamış, %5 oran doğrudan 1.900.000 TL'ye uygulanmıştır.
      C: Net tutarın %5'i alınıp bu tutarın üzerine %5 daha eklenmiştir; üstlenilen verginin kendisi de matraha dahil olduğundan
        doğru hesap brütleştirme yöntemiyle yapılır.
      E: Oran yerine %25'lik kurumlar vergisi oranı uygulanmıştır; bu kesinti kurumlar vergisi oranı değil, 9707 sayılı Karar
        ile belirlenen kesinti oranıdır.
    hesap_adimlari:
    - Oran = %5 (diğer işler)
    - Brüt tutar = 1.900.000 / (1 − 0,05) = 2.000.000 TL
    - Kesinti = 2.000.000 × %5 = 100.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 15(1)-a
    alinti: a) Gelir Vergisi Kanununda belirtilen esaslara göre birden fazla takvim yılına yaygın inşaat ve onarım işleri
      ile uğraşan kurumlara bu işleri ile ilgili olarak yapılan hak ediş ödemeleri.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 15(7)
    alinti: Kesilmesi gereken verginin ödemeyi yapan tarafından üstlenilmesi halinde vergi kesintisi, ödenen tutar ile ödemeyi
      yapanın yüklendiği verginin toplamı üzerinden hesaplanır.
  - mevzuat: 9707 sayılı Cumhurbaşkanı Kararı
    madde: Md. 2
    alinti: c) Diğer işler dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden %5,
