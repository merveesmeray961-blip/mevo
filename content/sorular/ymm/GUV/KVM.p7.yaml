  zorluk: 3
  kok: 5520 sayılı Kanun'un 12. maddesi bakımından aşağıdaki borçlanmalardan hangisi örtülü sermaye hesabında **sayılmaz**?
  secenekler:
    A: Kurumun, ortağının sağladığı gayrinakdî teminat karşılığında üçüncü bir finans kuruluşundan yaptığı borçlanma
    B: Kurumun, ortağı olan gerçek kişiden nakden aldığı ödünç para
    C: Ortağın doğrudan veya dolaylı %30 paya sahip olduğu bir kurumdan alınan nakdi kredi
    D: Ortakla ilişkili kişi sayılan ve yalnızca ilişkili şirketlere finansman temin eden bir kredi şirketinden alınan kredi
    E: Ortakla ilişkili kişi sayılan bir bankadan, ana faaliyet konusuna uygun olarak alınan kredi
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 12(6)(a)''ya göre kurumların ortaklarının veya ortaklarla ilişkili kişilerin sağladığı gayrinakdî
      teminatlar karşılığında üçüncü kişilerden yapılan borçlanmalar örtülü sermaye sayılmaz. Ortaktan doğrudan alınan ödünç,
      ilişkili kurumdan alınan nakdi kredi ve yalnızca ilişkili şirketlere finansman sağlayan kredi şirketinden alınan borç
      örtülü sermaye hesabına girer; ana faaliyet konusuna uygun faaliyet gösteren ilişkili banka borçları ise %50 oranında
      dikkate alınır. Püf noktaları: gayrinakdî teminat (teminat mektubu, kefalet) karşılığı üçüncü kişiden borçlanma hariçtir;
      ilişkili banka borçlarında ise sadece %50 dikkate alma kuralı vardır.'
    celdiriciler:
      B: Ortağın doğrudan şirkete nakden verdiği ödünç, borcun ortaktan doğrudan temin edildiği tipik örtülü sermaye unsurudur
        ve hesaplamaya tam olarak girer.
      C: Ortağın en az %10 oranında ortağı olduğu kurum ortakla ilişkili kişidir; bu kişiden alınan nakdi borçlar örtülü sermaye
        hesabına girer.
      D: Yalnızca ilişkili şirketlere finansman sağlayan kredi şirketlerinden yapılan borçlanmalar bankalara tanınan yüzde
        elli indirimli dikkate almanın dışındadır; tam tutarıyla hesaba girer.
      E: Böyle bir borçlanma kapsam dışında değildir; yalnızca karşılaştırmada %50 oranında dikkate alınır.
  kaynaklar:
