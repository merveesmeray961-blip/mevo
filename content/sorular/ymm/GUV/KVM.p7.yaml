      C: Yurt içi işlemlerde örtülü kazanç dağıtımının kabulü Hazine zararının doğması şartına bağlıdır.
      D: Pişmanlık ve ıslah hükümlerinin uygulanması mümkün ve anlaşma koşulları geçmiş dönemlerde de geçerliyse anlaşma bu
        dönemleri de kapsayabilir.
