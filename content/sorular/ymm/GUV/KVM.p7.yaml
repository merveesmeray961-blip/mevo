      en çok üç yıl kesinlik taşır (md. 13(5)); yurt içi işlemlerde Hazine zararı şarttır (md. 13(7)). Püf noktaları: indirim
      yalnızca belgelendirme tam ve zamanındaysa ve 359. maddedeki fiiller yoksa geçerlidir.'
    celdiriciler:
