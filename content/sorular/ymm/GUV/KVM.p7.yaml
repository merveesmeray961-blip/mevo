- id: YMM-GUV-KVM-0088
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisi mükellefiyeti ve matrah
  konu: KVM
  kazanim: sermayenin tamamlanması için ortaklarca aktarılan tutarlar
  tip: hesaplama
  zorluk: 2
  kok: Tam mükellef (H) A.Ş.'nin 2026 yılı ticari bilanço kârı 9.000.000 TL'dir. Bu kârın içinde, 6102 sayılı Türk Ticaret
    Kanunu'nun 376. maddesi uyarınca sermayenin tamamlanmasına karar verilmesi üzerine ortaklarca şirkete aktarılan ve gelir
    olarak kaydedilen 4.000.000 TL bulunmaktadır; bu tutarın 3.000.000 TL'si zarar sebebiyle karşılıksız kalan kısmı kapatacak
    miktardadır. Ayrıca 2026 yılında gider yazılan ve kanunen kabul edilmeyen giderlerin toplamı 1.200.000 TL'dir. Başka istisna,
    indirim veya zarar yoktur. 5520 sayılı Kanun'a göre (H) A.Ş.'nin 2026 yılı kurum kazancı kaç TL'dir?
  secenekler:
    A: 4.200.000 TL
    B: 4.800.000 TL
    C: 6.000.000 TL
    D: 6.200.000 TL
    E: 7.200.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 6(3) uyarınca TTK md. 376 gereğince sermayenin tamamlanmasına karar verilen şirketin ortakları tarafından,
      zarar sebebiyle karşılıksız kalan kısmı kapatacak miktarda aktarılan tutarlar kurum kazancının tespitinde dikkate alınmaz.
      Aktarılan 4.000.000 TL''nin yalnızca 3.000.000 TL''si bu kapsamdadır; fazlası (1.000.000 TL) kazançta kalır. Kurum kazancı
      = 9.000.000 + 1.200.000 − 3.000.000 = 7.200.000 TL. Püf noktaları: yalnızca zararı kapatacak miktar dışlanır; KKEG kâra
      eklenir.'
    celdiriciler:
      A: Zarar sebebiyle karşılıksız kalan 3.000.000 TL kapatma tutarı iki kez düşülmüştür; kurum kazancından bu tutar yalnızca
        bir defa çıkarılır.
      B: Kanunen kabul edilmeyen giderler kazanca eklenmek yerine kârdan düşülmüştür; KKEG kurum kazancını artırır.
      C: Kabul edilmeyen giderler (1.200.000 TL) kurum kazancına eklenmemiştir; kurum kazancı ticari kârın KKEG ile düzeltilmesi
        suretiyle bulunur.
      D: Ortaklarca aktarılan 4.000.000 TL'nin tamamı dışlanmıştır; kanuna göre yalnızca zarar sebebiyle karşılıksız kalan
        kısmı kapatacak miktar (3.000.000 TL) dikkate alınmaz.
    hesap_adimlari:
    - Ticari kâr = 9.000.000 TL
    - 'KKEG eklenir: + 1.200.000 TL'
    - 'Zararı kapatan aktarım düşülür: − 3.000.000 TL'
    - Kurum kazancı = 7.200.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 6(3)
    alinti: 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun 376 ncı maddesi uyarınca sermayenin tamamlanmasına karar
      verilen şirketin ortakları tarafından zarar sebebiyle karşılıksız kalan kısmı kapatacak miktarda aktarılan tutarlar
      kurum kazancının tespitinde dikkate alınmaz.
  gecerlilik:
    baslangic: '2022-04-08'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 9000000 + 1200000 - 3000000
  durum: kontrolde
  surum: 1
