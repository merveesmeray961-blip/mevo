    madde: Md. 12(6)-a
    alinti: a) Kurumların ortaklarının veya ortaklarla ilişkili kişilerin sağladığı gayrinakdî teminatlar karşılığında üçüncü
      kişilerden yapılan borçlanmalar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 12(2)
    alinti: sadece ilişkili şirketlere finansman temin eden kredi şirketlerinden yapılan borçlanmalar hariç olmak üzere, ana
