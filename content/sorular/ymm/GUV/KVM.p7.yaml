    ifadelerden hangisi **doğrudur**?
  secenekler:
    A: Mükellefin talebi üzerine Maliye Bakanlığı ile anlaşılarak belirlenen yöntem, en çok beş yıl süreyle kesinlik taşır.
    B: Belgelendirme yükümlülükleri yerine getirilmiş olsa bile örtülü kazanç nedeniyle doğan vergi ziyaı cezası indirimsiz
      uygulanır.
    C: Tam mükellef kurumlar arasındaki yurt içi işlemlerde, Hazine zararı doğmasa dahi örtülü kazanç dağıtıldığı kabul edilir.
    D: Mükellefin Bakanlıkla anlaşması, zamanaşımına uğramamış geçmiş vergilendirme dönemlerine hiçbir şekilde uygulanamaz.
    E: Belgeler tam ve zamanında hazırlanmışsa vergi ziyaı cezası, 359. maddedeki fiiller hariç olmak üzere, %50 indirimli
      uygulanır.
  dogru: E
  aciklama:
