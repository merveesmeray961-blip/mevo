- id: YMM-GUV-OZL-0006
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde indirimler teşvikler ve geçici düzenlemeler
  konu: OZL
  kazanim: KVK md.10 indirimleri
  tip: hesap
  zorluk: 3
  kok: (C) A.Ş.'nin 2026 ticari bilanço kârı 6.000.000 TL'dir. Kârın içinde 1.000.000 TL tam mükellef iştirak kazancı vardır;
    mahsup edilecek geçmiş yıl zararı 200.000 TL'dir. Şirket belediyeye 300.000 TL bağış yapmış ve gider yazmıştır. KVK md.
    10/1-c uyarınca indirilebilecek bağış tutarı ne kadardır?
  secenekler:
    A: 240.000 TL
    B: 300.000 TL
    C: 250.000 TL
    D: 290.000 TL
    E: 315.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Tebliğe göre sınır, ticari bilanço kârından iştirak kazancı istisnası ve geçmiş yıl zararı düşüldükten sonraki
      tutarın %5''idir: (6.000.000 − 1.000.000 − 200.000) × %5 = 240.000 TL. Aşan 60.000 TL indirilemez. Püf noktaları: bağış
      KKEG olarak eklenmiş kazanç üzerinden hesap yapılmaz.'
    celdiriciler:
      B: Bağışın tamamı sınır dikkate alınmadan indirilmiştir.
      C: Geçmiş yıl zararı düşülmemiştir.
      D: İştirak kazancı düşülmemiştir.
      E: Bağış KKEG olarak kazanca eklendikten sonraki tutar esas alınmıştır.
    hesap_adimlari:
    - 'Esas tutar: 6.000.000 − 1.000.000 − 200.000 = 4.800.000 TL'
    - 'Sınır: 4.800.000 × %5 = 240.000 TL'
    - 'İndirim: min(300.000; 240.000) = 240.000 TL'
  kaynaklar:
  - mevzuat: Kurumlar Vergisi Genel Tebliği (Seri No 1)
    madde: bölüm 10.3.2.1
    alinti: zarar mahsubu dahil giderler ile iştirak kazançları istisnası düşüldükten sonra, indirim ve istisnalar düşülmeden
      önceki
  gecerlilik:
