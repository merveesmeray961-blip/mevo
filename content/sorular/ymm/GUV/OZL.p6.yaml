      hesaplayın; 32/A''daki "gecikme faizi" ile karıştırmayın, burada kanun "gecikme zammı" der ve ceza kesilmez.'
    celdiriciler:
      A: '%80, aranan %85''in altındadır; şart sağlanmamıştır.'
      B: Kanun vergi ziyaı cezası öngörmez, cezasız tahsil eder.
      C: Kanundaki ifade gecikme zammıdır; gecikme faizi 32/A gibi başka hükümlerde geçer.
      E: Kanunda oranın altında kalan mükellef için kısmi terkin öngörülmemiştir.
