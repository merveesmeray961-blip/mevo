  kok: Serbest bölgede üretim faaliyetinde bulunan (S) A.Ş.'nin 2026 yılında bölgede ürettiği ürünlerin FOB bedeli toplam
    50.000.000 TL'dir; bunun 40.000.000 TL'si yurt dışına ihraç edilmiş, 10.000.000 TL'si Türkiye'ye satılmıştır. Şirket,
    personel ücretleri üzerinden hesaplanan gelir vergisini 3218 sayılı Kanun geçici md. 3 ikinci fıkranın (b) bendi uyarınca
    muhtasar beyannameden indirerek terkin ettirmiştir (Cumhurbaşkanınca kanuni oran değiştirilmemiştir). Buna göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: İhracat oranı %80 olduğundan terkin edilen vergilere dokunulmaz.
    B: İhracat oranı %85'in altında kaldığından vergiler vergi ziyaı cezasıyla birlikte gecikme faiziyle tahsil edilir.
    C: İhracat oranı %85'in altında kaldığından zamanında tahsil edilmeyen vergiler cezasız olarak gecikme faiziyle tahsil
      edilir.
    D: İhracat oranı %85'in altında kaldığından vergiler, ceza kesilmeksizin gecikme zammı da eklenerek tahsil edilir.
    E: İhracat oranı yetersiz olsa da yalnızca ihraç edilen ürünlere isabet eden ücretler için terkin uygulanır.
  dogru: D
