- id: YMM-GUV-OZL-0019
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde indirimler teşvikler ve geçici düzenlemeler
  konu: OZL
  kazanim: 4691 sayılı Kanun geçici md. 2 destek personeli sınırı
  tip: hesaplama
  zorluk: 3
  kok: 'Teknoloji geliştirme bölgesinde faaliyet gösteren (B) A.Ş.''nin 2026 yılında bölgede çalışan personeli şöyledir: 10
    tam zamanlı Ar-Ge ve tasarım personeli ve 4 destek personeli (toplam 14 kişi). Şirket, dört destek personeli için de gelir
    vergisi stopajı teşviki talep etmektedir. Buna göre stopaj teşvikinden yararlanabilecek destek personeli sayısı en fazla
    kaçtır?'
  secenekler:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
    E: '5'
  dogru: B
  aciklama:
    dogru_neden: 'Destek personeli sayısı Ar-Ge ve tasarım personeli sayısının %10''unu aşamaz; toplam personeli on beşe kadar
      olan Bölge firmalarında bu oran %20''dir. Toplam 14 kişi olduğundan 10 × %20 = 2 destek personeli teşvikten yararlanabilir.
      Püf noktaları: Önce toplam personelin 15''i aşıp aşmadığına bakın; eşik altındaysa %10 değil %20 uygulanır. Talep edilen
      destek sayısı (4) sınırı belirlemez, yalnızca üst sınırı aşıp aşmadığınıza bakılır.'
    celdiriciler:
      A: 10 × %10 = 1 sonucu, küçük firmalar için öngörülen %20 oranını gözetmez.
      C: 3 kişi, hiçbir oranla eşleşmez (%30).
      D: 4, talep edilen sayıdır; sınır değildir.
      E: 5, %50 oranına karşılık gelir; kanunda böyle bir oran yoktur.
    hesap_adimlari:
    - Toplam personel = 10 + 4 = 14 ≤ 15, oran %20
    - Sınır = 10 × %20 = 2
  kaynaklar:
  - mevzuat: 4691 sayılı Teknoloji Geliştirme Bölgeleri Kanunu
    madde: geçici md. 2
    alinti: Gelir vergisi stopajı ve sigorta primi işveren hissesine ilişkin teşviklerden yararlanacak olan destek personeli
      sayısı, AR-GE ve tasarım personeli sayısının yüzde onunu aşamaz. (Ek cümle:28/1/2021-7263/7 md.) Toplam personel sayısı
      on beşe kadar olan Bölge firmaları için bu oran yüzde yirmi olarak uygulanır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'toplam = 10 + 4

      oran = 20 if toplam <= 15 else 10

      sonuc = 10 * oran // 100

