- id: YMM-GUV-OZL-0023
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde indirimler teşvikler ve geçici düzenlemeler
  konu: OZL
  kazanim: yatırım teşvik belgesinde diğer vergi borçlarından terkin ve kalan katkı
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (P) A.Ş., Sanayi ve Teknoloji Bakanlığınca düzenlenen yatırım teşvik belgesi kapsamında yatırımını tamamlamıştır
    (yatırım teşvik belgesi bazında fiilen yapılan yatırım harcaması 50.000.000 TL; yatırıma katkı oranı %30). Hak edilen
    yatırıma katkı tutarının 5.000.000 TL'si indirimli kurumlar vergisi yoluyla kullanılmıştır. (P) A.Ş., 5520 sayılı Kanun'un
    32/A maddesinin sekizinci fıkrası uyarınca süresinde talepte bulunarak, kurumlar vergisi dışındaki (ÖTV ve KDV hariç)
    tahakkuk etmiş vergi borçlarının terkinini, kanunen azami olarak istemiştir. Terkin işlemi sonrasında indirimli kurumlar
    vergisi yoluyla yararlanılabilecek kalan yatırıma katkı tutarı kaç TL'dir?
  secenekler:
    A: 1.500.000 TL
    B: 5.000.000 TL
    C: 7.000.000 TL
    D: 8.500.000 TL
    E: 10.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Terkin edilebilecek toplam tutar, yatırım harcamasına katkı oranı uygulanarak bulunan tutarın %10''unu aşamaz:
      50.000.000 × %30 = 15.000.000 TL; %10''u = 1.500.000 TL. Ayrıca terkin talebi, hak edilen katkıdan kullanılanın düşülmesinden
      sonra kalan tutarın yarısını (10.000.000 / 2 = 5.000.000 TL) aşamaz; bağlayıcı sınır 1.500.000 TL''dir. Terkin edilen
      tutarın bir katına isabet eden yatırıma katkı tutarından vazgeçildiği kabul edilir. Kalan katkı = 15.000.000 − 5.000.000
      − 1.500.000 − 1.500.000 = 7.000.000 TL. Püf noktaları: terkin edilen tutar kadar bir de vazgeçilen katkı düşülür (toplam
      2 katı); iki sınırdan küçük olan geçerlidir.'
    celdiriciler:
      A: Bu tutar kalan katkı değil, terkin edilebilecek en fazla vergi tutarıdır; kalan katkı, hak edilen tutardan kullanılan,
        terkin edilen ve vazgeçilen kısımlar düşülerek bulunur.
      B: Terkin tutarı olarak kalan katkının yarısı alınmış; oysa bağlayıcı sınır, yatırım harcamasına katkı oranı uygulanarak
        bulunan tutarın %10'udur ve bu tutar daha düşüktür.
      D: Terkin edilen tutar düşülmüş, fakat bu tutarın bir katına isabet eden ve vazgeçilmiş sayılan yatırıma katkı tutarı
        ayrıca düşülmemiştir.
      E: Yalnızca kullanılan tutar düşülmüş, terkin işlemi hiç dikkate alınmamıştır; oysa terkin edilen tutar ve bunun bir
        katı vazgeçilen katkı olarak kalandan düşer.
    hesap_adimlari:
    - Hak edilen katkı = 50.000.000 × %30 = 15.000.000 TL
    - Terkin sınırı = 15.000.000 × %10 = 1.500.000 TL (yarı sınırı (15.000.000 − 5.000.000)/2 = 5.000.000 TL daha yüksek olduğundan
      1.500.000 TL geçerli)
    - Vazgeçilen katkı = 1.500.000 TL (terkin edilen tutarın bir katı)
    - Kalan katkı = 15.000.000 − 5.000.000 − 1.500.000 − 1.500.000 = 7.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 32/A(8)
    alinti: Yatırım teşvik belgesi bazında yapılan yatırım harcamasına yatırıma katkı oranının uygulanmasıyla belirlenen tutarın
      %10’luk kısmı, kurumlar vergisi beyannamesinin verilmesi gereken ayı takip eden ikinci ayın sonuna kadar talep edilmesi
      şartıyla, özel tüketim vergisi ve katma değer vergisi hariç olmak üzere tahakkuk etmiş diğer vergi borçlarından terkin
      edilmek suretiyle kullanılabilir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 32/A(8)
    alinti: Terkin talebinde bulunulabilecek tutar, hak edilen yatırıma katkı tutarından indirimli kurumlar vergisi yoluyla
      kullanılan yatırıma katkı tutarının düşülmesinden sonra bulunan tutarın yarısından fazla olamaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 32/A(8)
    alinti: Diğer vergi borçlarının terkini suretiyle kullanılan tutarın bir katına isabet eden yatırıma katkı tutarından
      vazgeçildiği kabul edilir
  gecerlilik:
    baslangic: '2021-10-14'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'katki = 50000000*0.30

      terkin = min(katki*0.10, (katki-5000000)/2)

      sonuc = round(katki - 5000000 - terkin - terkin)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Anahtar bağımsız çözümle ve mevzuat/2026 tutarlarıyla doğrulandı; tek doğru şık,
          açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_GUV/GUV_OZL_20261111_1.yaml#1
