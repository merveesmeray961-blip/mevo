- id: YMM-GUV-OZL-0026
  sinav: ymm
  bolum:
  - YMM
  ders: GUV
  unite: Kurumlar vergisinde indirimler teşvikler ve geçici düzenlemeler
  konu: OZL
  kazanim: nakdi sermaye artışı indiriminde karma sermaye artışı hesabı
  tip: hesaplama
  zorluk: 3
  kok: 'Finans, bankacılık veya sigortacılık sektöründe faaliyet göstermeyen, kamu iktisadi teşebbüsü olmayan tam mükellef
    (S) A.Ş., hesap dönemi takvim yılı olmak üzere 2026 yılında Ekim ayında ticaret siciline tescil edilen sermaye artırımını
    gerçekleştirmiş ve artırım tutarları aynı ay içinde ödenmiştir. Artırımın bileşimi şöyledir:


    - Ortakların kendi kaynaklarıyla nakden ödedikleri tutar: 6.000.000 TL

    - Yurt dışından getirilen nakitle karşılanan tutar: 8.000.000 TL

    - Yedek akçelerin sermayeye eklenmesinden kaynaklanan tutar: 4.000.000 TL

    - Ortaklarca kredi kullanılarak nakden ödenen tutar: 2.000.000 TL


    Cumhurbaşkanı Kararı ile oranlar değiştirilmemiştir. Türkiye Cumhuriyet Merkez Bankası tarafından açıklanan ve dikkate
    alınacak ağırlıklı yıllık ortalama ticari kredi faiz oranı %48 olduğuna göre, 5520 sayılı Kanun''un 10/1-ı bendi uyarınca
    2026 hesap dönemi için hesaplanacak nakdi sermaye artışı indirimi kaç TL''dir?'
  secenekler:
    A: 840.000 TL
    B: 1.080.000 TL
    C: 1.200.000 TL
    D: 1.440.000 TL
    E: 4.320.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Yedek akçelerin sermayeye eklenmesinden ve ortaklarca kredi kullanılarak yapılan ödemelerden kaynaklanan
      artışlar hesaba katılmaz (10/1-ı). Hesaba giren nakit: iç kaynak 6.000.000 TL (oran %50), yurt dışından getirilen 8.000.000
      TL (oran %75). Yıllık indirim = 6.000.000 × %48 × %50 + 8.000.000 × %48 × %75 = 1.440.000 + 2.880.000 = 4.320.000 TL.
      Ödeme Ekim ayında yapıldığından ay kesri tam ay sayılarak Ekim–Aralık, yani 3 ay için hesaplanır: 4.320.000 × 3/12 =
      1.080.000 TL. Püf noktaları: yurt dışından getirilen nakit için %75 oranı kullanılır; yedek akçe ve kredili ödemeler
      dışlanır; ödeme ayı tam ay sayılır.'
    celdiriciler:
      A: Yurt dışından getirilen nakit için %75 oranı uygulanmamış, tüm nakit tutar %50 ile hesaplanmıştır.
      C: Ortaklarca kredi kullanılarak ödenen 2.000.000 TL de iç kaynaklı nakit olarak hesaba katılmıştır; kanun bu tutarları
        indirim hesabının dışında tutar.
      D: Ödeme ayı yerine bir sonraki ay esas alınıp süre 4 ay alınmıştır; Ekim ayında ödenen tutar için ay kesri tam ay sayılarak
        Ekim, Kasım ve Aralık, yani 3 ay dikkate alınır.
      E: Süreye göre orantılama yapılmamış, tutar tam yıl için hesaplanmıştır; oysa indirim, ödemenin yapıldığı ay dahil hesap
        döneminin kalan ay süresi kadar hesaplanır.
    hesap_adimlari:
    - 'İç kaynak: 6.000.000 × %48 × %50 = 1.440.000 TL'
    - 'Yurt dışı nakit: 8.000.000 × %48 × %75 = 2.880.000 TL'
    - Yıllık tutar = 4.320.000 TL; Ekim–Aralık = 3 ay
    - İndirim = 4.320.000 × 3/12 = 1.080.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 10/1-ı
    alinti: (Ek ikinci paragraf:14/10/2021-7338/59 md.) Nakdi sermaye artışlarının, yurt dışından getirilen nakitle karşılanan
      kısmı için bu oran %75 olarak uygulanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 10/1-ı
    alinti: Bu bent hükümlerine göre hesaplanacak indirim tutarı, nakdi sermayenin ödendiği ay kesri tam ay sayılmak suretiyle
      hesap döneminin kalan ay süresi kadar hesaplanır. Matrahın yetersiz olması nedeniyle ilgili dönemde indirim konusu yapılamayan
      tutarlar, sonraki hesap dönemlerine devreder.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 10/1-ı
    alinti: birleşme, devir ve bölünme işlemlerine taraf olmalarından veya bilançoda yer alan öz sermaye kalemlerinin sermayeye
      eklenmesinden kaynaklanan ya da ortaklar veya bu Kanunun 12 nci maddesi kapsamında ortaklarla ilişkili olan kişilerce
      kredi kullanılmak veya borç alınmak suretiyle gerçekleştirilen sermaye artırımları, indirim hesaplamasında dikkate alınmaz.
  gecerlilik:
    baslangic: '2021-10-14'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'yillik = 6000000*0.48*0.50 + 8000000*0.48*0.75

      sonuc = round(yillik*3/12)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
