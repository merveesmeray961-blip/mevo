    Cumhurbaşkanı oranları farklılaştırmamıştır; yasal azami artış indiriminden tam yararlanılacaktır). (R) A.Ş.'nin 2026
    yılında indirimler öncesi kurum kazancı 30.000.000 TL'dir. 2027 yılı için VUK'a göre belirlenen yeniden değerleme oranı
    %25 kabul edildiğine göre, 2026'da kazancın yetersizliği nedeniyle indirim konusu yapılamayan ve 2027 hesap dönemine devredilerek
    dikkate alınacak Ar-Ge indirimi tutarı kaç TL'dir?
  secenekler:
    A: 7.500.000 TL
    B: 12.000.000 TL
    C: 15.000.000 TL
    D: 18.000.000 TL
    E: 22.500.000 TL
  dogru: C
  aciklama:
    dogru_neden: '5746 sayılı Kanun md. 3(1) uyarınca Ar-Ge ve yenilik harcamalarının tamamı indirim konusu yapılır; kriterleri
      haiz Ar-Ge merkezlerinde ayrıca bir önceki yıla göre artışın yüzde ellisine kadarı da indirilebilir. Artış = 36.000.000
      − 24.000.000 = 12.000.000 TL; ilave indirim = 6.000.000 TL; toplam indirim = 42.000.000 TL. Kazanç 30.000.000 TL olduğundan
      12.000.000 TL indirilemez ve sonraki döneme devreder; devredilen tutar yeniden değerleme oranı kadar artırılır: 12.000.000
      × 1,25 = 15.000.000 TL. Püf noktaları: artış indirimi artışın yarısıdır; devreden tutar her yıl yeniden değerleme oranıyla
      artırılır.'
