  kok: 5520 sayılı Kanun'un 32/B maddesinde düzenlenen, sermayeye eklenen öz sermaye kalemlerinin sermaye azaltımına konu
    edilmesi hâlinde vergilendirmeye ilişkin aşağıdaki ifadelerden hangisi **doğrudur**?
  secenekler:
    A: Beş tam yıllık süre dolmadan yapılan sermaye azaltımında, azaltımın önce yalnızca kâr dağıtımına bağlı kesintiye tabi
      unsurlardan, sonra hem kurumlar vergisine hem kesintiye tabi unsurlardan yapıldığı kabul edilir.
    B: Geçmiş yıl zararlarının mahsubu suretiyle sermaye azaltılması hâlinde azaltıma konu edilen sermaye unsurları, vergi
      kesintisine de tabi tutulur.
    C: Kurumlar vergisine ve vergi kesintisine tabi sermaye unsurlarında kesinti matrahı, azaltıma konu tutarın tamamıdır;
      hesaplanan kurumlar vergisi kesinti matrahından düşülmez.
    D: Yalnızca kâr dağıtımına bağlı vergi kesintisine tabi tutulacak sermaye unsurları, hem kurumlar vergisine hem vergi
      kesintisine tabi tutulur.
    E: Sermaye azaltımında öncelikle, sermayeye ilave edilen öz sermaye kalemlerinden eklenme tarihi üzerinden beş tam yıl
      geçmemiş olanların işletmeden çekildiği kabul edilir.
  dogru: E
  aciklama:
    dogru_neden: KVK md. 32/B(3)'e göre sermaye azaltımında öncelikli olarak, sermayeye ilave edilen öz sermaye kalemlerinden
      sermayeye eklenme tarihi beş tam yıllık süreyi geçmemiş olanların işletmeden çekildiği kabul edilir. Sıralama (a) kurumlar
      vergisi ve kesinti, (b) yalnızca kesinti, (c) vergilendirilmeyecek unsurlar şeklindedir; kesinti matrahı hesaplanan
      kurumlar vergisi düşüldükten sonra kalan tutardır; zararlarla mahsup suretiyle yapılan azaltımda kesinti yapılmaz.
    celdiriciler:
      A: 'Sıra ters kurulmuştur: azaltım sırasıyla önce hem kurumlar vergisine hem vergi kesintisine tabi unsurlardan, sonra
        yalnızca kesintiye tabi unsurlardan, en son vergilendirilmeyecek sermayeden yapılmış sayılır.'
      B: Zararla mahsup suretiyle yapılan azaltımda sermaye unsurları aynı sıralamayla tespit edilir ancak bu tutarlar üzerinden
        vergi kesintisi yapılmaz.
      C: Kesinti matrahı, hesaplanan kurumlar vergisi düşüldükten sonra kalan tutardır; kesinti bu net tutar üzerinden yapılır.
      D: Bu unsurlar yalnızca vergi kesintisine tabidir; hem kurumlar vergisine hem kesintiye tabi olanlar ayrı bir gruptur.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 32/B(3)
    alinti: Sermaye azaltımında, öncelikli olarak sermayeye ilave edilen öz sermaye kalemlerinden, sermayeye eklenme tarihi
      beş tam yıllık süreyi geçmemiş olanların işletmeden çekildiği kabul edilir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Md. 32/B(4)
    alinti: Kurumlar vergisine ve vergi kesintisine tabi sermaye unsurlarında, kesinti matrahı hesaplanan kurumlar vergisi
