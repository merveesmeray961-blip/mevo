- id: YMM-HSV-DMG-0027
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: istisnalar
  tip: kavrama
  zorluk: 2
  kok: 'Aşağıdaki kâğıtlardan hangileri Damga Vergisi Kanunu’na ekli (2) sayılı tabloda damga vergisinden istisna edilen kâğıtlar
    arasında yer alır?

    I. Bir bankanın müşterisiyle imzaladığı kredi kartı üyelik sözleşmesi

    II. Gerçek usulde ticari kazanç mükellefi bir tacirin işyeri olarak kiraladığı dükkâna ilişkin kira sözleşmesi

    III. Bir faktoring şirketinin müşterisiyle yaptığı faktoring sözleşmesi

    IV. Noterde resmî şekilde düzenlenen gayrimenkul satış vaadi sözleşmesi'
  secenekler:
    A: I ve III
    B: II ve IV
    C: I, II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: Kredi kartı üyelik sözleşmeleri (2) sayılı tablo IV/26, faktoring şirketlerinin müşterileriyle yaptıkları
      faktoring sözleşmeleri IV/20 uyarınca istisnadır. İşyeri kira sözleşmelerinde istisna (IV/32) yalnız gelir vergisinden
      muaf esnaf, muaf serbest meslek erbabı ve basit usul mükellefleri için öngörülmüştür. Resmî şekilde düzenlenen gayrimenkul
      satış vaadi sözleşmeleri ise (2) sayılı tabloda değil, (1) sayılı tablonun I/A-8 bendinde vergiye tabi kâğıt olarak
      yer alır; bunlara uygulanan oranın sıfır olarak belirlenmesi onları istisna kâğıt hâline getirmez.
    celdiriciler:
      B: II gerçek usul mükellefi tacire ait olduğundan istisna dışıdır; IV ise (2) sayılı tabloda değil (1) sayılı tabloda
        yer alır.
      C: II’deki kira sözleşmesi, kiracı basit usul veya muaf mükellef olmadığından istisnadan yararlanamaz.
      D: Satış vaadi sözleşmesine uygulanan oranın sıfır olması, kâğıdın (2) sayılı tabloda istisna olarak sayıldığı anlamına
        gelmez; tablo IV/21’deki istisna yalnız GYO ve gayrimenkul yatırım fonlarının portföylerine ilişkindir.
      E: II ve IV istisna değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: (2) sayılı tablo IV/26
    alinti: Kredi kartı üyelik sözleşmeleri.
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: (2) sayılı tablo IV/20
    alinti: Faktoring şirketlerinin müşterileriyle yaptıkları faktoring sözleşmeleri ile bu sözleşmelere ilişkin olarak düzenlenen
      diğer kâğıtlar.
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: (2) sayılı tablo IV/32
    alinti: Gelir vergisinden muaf esnaf, muaf serbest meslek erbabı ile basit usulde vergilendirilen mükellefler tarafından
      işyeri olarak kullanılmak üzere kiralanan ve iktisadî işletmelere dahil olmayan taşınmazlara ilişkin kira mukavelenameleri
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
