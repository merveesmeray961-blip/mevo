  kok: (Y) Belediyesi temizlik hizmeti alımı için ihaleye çıkmış; ihale 8.000.000 TL teklif veren (Z) Ltd. Şti. üzerinde kalmıştır.
    Belediye encümeni ihale kararını almış, ardından belediye ile (Z) Ltd. Şti. arasında 8.000.000 TL bedelli sözleşme üç
    nüsha olarak imzalanmıştır. 2026 yılında resmî dairelerin her türlü ihale kararları için binde 5,69; resmî dairelerin
    mal ve hizmet alımlarına ilişkin ihalelerde ihaleyi yapan idare ile düzenlenen sözleşmeler için binde 9,48 oranı uygulanmaktadır.
    KDV bu soruda dikkate alınmayacaktır. Damga Vergisi Kanunu’na göre bu işlemler nedeniyle (Z) Ltd. Şti.’nin ödemesi gereken
    damga vergisi toplamı kaç TL’dir?
  secenekler:
