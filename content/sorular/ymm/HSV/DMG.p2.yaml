  kok: '(P) A.Ş. ile (R) A.Ş. arasında 1 Nisan 2026’da tek nüsha olarak imzalanan bir kâğıtta şu hükümler yer almaktadır:

    - (R) A.Ş.’nin (P) A.Ş. için 2.000.000 TL bedelle bir makine imal edip teslim etmesi,

    - Teslimin gecikmesi hâlinde (R) A.Ş.’nin 200.000 TL cezai şart ödemesi,

    - (R) A.Ş.’nin bu sözleşmeden doğan borçları için, sözleşmenin tarafı olmayan Bay (K) ile Bay (L)’nin her birinin 2.000.000
    TL’ye kadar adi kefil olması.

    Mukavelenameler ile kefalet senetleri için uygulanan oran binde 9,48’dir. Damga Vergisi Kanunu’na göre bu kâğıt için ödenecek
    damga vergisi toplamı kaç TL’dir?'
  secenekler:
    A: '18.960'
    B: '37.920'
    C: '39.816'
    D: '56.880'
    E: '58.776'
  dogru: B
  aciklama:
    dogru_neden: 'Asıl sözleşme: 2.000.000 × binde 9,48 = 18.960 TL. Cezai şart, sözleşmenin müeyyidesi niteliğinde olup başlı
      başına bir sözleşmeye konu olmadığından vergilendirilmez (md. 6/4). Kefalet, asıl işlemin taraflarından başka kişilerin
      eklediği akit olduğundan ayrıca vergiye tabidir (md. 6/3); ancak bir kâğıtta birden fazla adi kefalet bulunduğunda yalnız
      birinden vergi alınır: 2.000.000 × binde 9,48 = 18.960 TL. Toplam 37.920 TL. Püf noktaları: Üç ayrı kural sırayla uygulanır:
      üçüncü kişinin eklediği akit ayrıca vergilenir, birden fazla adi kefaletten yalnız biri vergilenir, cezai şart hiç vergilenmez.'
    celdiriciler:
      A: Bağlı akitlerde en yüksek vergiyi gerektiren akit kuralı uygulanmış ve kefalet vergilendirilmemiştir; kefalet, asıl
        işlemin tarafı olmayan kişilerce eklendiğinden ayrıca vergiye tabidir.
      C: Cezai şart da vergilendirilmiştir (200.000 × binde 9,48 = 1.896 TL); sözleşmenin müeyyidesi niteliğindeki cezai şarttan
        vergi alınmaz.
      D: İki adi kefaletin her biri ayrı vergilendirilmiştir; aynı kâğıttaki birden fazla adi kefaletten yalnız biri vergiye
        tabidir.
      E: Hem iki kefalet ayrı ayrı hem de cezai şart vergilendirilmiştir.
    hesap_adimlari:
    - 'Asıl sözleşme: 2.000.000 × 0,00948 = 18.960 TL'
    - 'Cezai şart: vergilendirilmez'
    - 'Adi kefalet (yalnız biri): 2.000.000 × 0,00948 = 18.960 TL'
    - 'Toplam: 37.920 TL'
  kaynaklar:
