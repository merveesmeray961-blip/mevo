    B: '75.840'
    C: '121.360'
    D: '151.680'
    E: '273.040'
  dogru: C
  aciklama:
    dogru_neden: 'Belediye DVK md. 8’e göre resmî dairedir ve md. 3/2 uyarınca resmî dairelerle kişiler arasındaki işlemlere
      ait kâğıtların damga vergisini kişiler öder. Bu nedenle hem ihale kararının hem de sözleşmenin vergisi (Z) Ltd. Şti.’ye
      aittir. İhale kararı: 8.000.000 × binde 5,69 = 45.520 TL; sözleşme: 8.000.000 × binde 9,48 = 75.840 TL. Sözleşme nispi
      vergiye tabi olduğundan md. 5 gereği yalnız bir nüshası vergilendirilir. Toplam 121.360 TL. Püf noktaları: Belediye
      vergiden muaf olduğu için vergi ikiye bölünmez; tamamı kişiye aittir. İhale kararını yalnız idare imzalasa da vergisi
      yükleniciye düşer; nispi vergide nüsha sayısı vergiyi artırmaz.'
    celdiriciler:
      A: Vergi taraflar arasında yarı yarıya paylaştırılmıştır (121.360 / 2); resmî daire ile kişi arasındaki işlemde verginin
        tamamını kişi öder.
      B: Yalnız sözleşme vergisi hesaplanmış, ihale kararının vergisinin idareye ait olduğu varsayılmıştır.
      D: İhale kararına da sözleşme oranı (binde 9,48) uygulanmıştır; ihale kararları binde 5,69 oranına tabidir.
      E: Sözleşmenin her nüshası ayrı vergilendirilmiştir (3 × 75.840 + 45.520); nispi vergide yalnız bir nüsha vergiye tabidir.
