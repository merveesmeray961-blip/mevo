    dogru_neden: 'Tapu harcı emlak vergisi değerinden az olmamak üzere beyan edilen bedel üzerinden alınır; beyan edilen 3.000.000
      TL emlak vergisi değerinin altında kaldığından harç 3.200.000 TL üzerinden ödenmiştir. Gerçek bedel 5.000.000 TL olduğundan
      fark 1.800.000 TL’dir. Harç devir eden ve devir alan için ayrı ayrı alındığından ikmal edilecek harç 1.800.000 × binde
      20 × 2 = 72.000 TL’dir. Md. 63’e göre bu harç için vergi ziyaı cezası bir kat uygulanır: 72.000 TL. Toplam 144.000 TL.
      Püf noktaları: Fark, ödemeye esas alınan 3.200.000 TL’den hesaplanır, beyan edilen 3.000.000 TL’den değil. 7566 sayılı
      Kanunla 19.12.2025’ten itibaren ceza %25’ten bir kata çıkarılmıştır.'
    celdiriciler:
      A: Yalnız bir tarafın ikmal harcı hesaplanmış, ceza unutulmuştur; harç iki taraf için ayrı ayrı alınır ve cezaya tabidir.
      B: İkmal harcı doğru hesaplanmış, ancak vergi ziyaı cezası eklenmemiştir.
      C: Ceza, md. 63’ün değişiklikten önceki hâline göre %25 oranında (18.000 TL) hesaplanmıştır.
      E: Fark, beyan edilen 3.000.000 TL’den hesaplanmıştır; harç zaten 3.200.000 TL üzerinden ödendiğinden aradaki 200.000
        TL için ikmal yapılmaz.
    hesap_adimlari:
    - 'Ödemeye esas matrah: max(3.000.000; 3.200.000) = 3.200.000 TL'
    - 'Fark: 5.000.000 − 3.200.000 = 1.800.000 TL'
    - 'İkmal harcı: 1.800.000 × 0,02 × 2 taraf = 72.000 TL'
    - 'Vergi ziyaı cezası (bir kat): 72.000 TL'
    - 'Toplam: 144.000 TL'
  kaynaklar:
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: md. 63/4
    alinti: Tapuda yapılan işlemden sonra, emlak vergisi değerinden daha düşük bir bedel üzerinden harç ödendiğinin veya beyan
      edilen devir ve iktisap bedelinin gerçek durumu yansıtmadığının tespit edilmesi halinde, aradaki farka isabet eden harç
      ikmalen veya re’sen tarh edilir. Bu suretle tarh edilecek tapu ve kadastro harcı için, 213 sayılı Vergi Usul Kanununda
      yer alan vergi ziyaı cezası bir kat uygulanır.
  - mevzuat: 492 sayılı Harçlar Kanunu
