- id: YMM-HSV-DMG-0024
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: nispi ve maktu vergi
  tip: hesaplama
  zorluk: 1
  kok: (A) Ltd. Şti. ile (B) A.Ş. arasında 2025 yılında imzalanan 4.000.000 TL bedelli hizmet sözleşmesi için 37.920 TL damga
    vergisi ödenmiştir. Mart 2026’da (B) A.Ş., sözleşmenin diğer hükümlerinde hiçbir değişiklik yapılmaksızın sözleşmeden
    doğan hak ve yükümlülüklerini 1.500.000 TL karşılığında (C) A.Ş.’ye devretmiş ve bu amaçla bir devir sözleşmesi düzenlenmiştir.
    Mukavelenameler için uygulanan oran binde 9,48’dir. Damga Vergisi Kanunu’na göre devir sözleşmesi için ödenecek damga
    vergisi kaç TL’dir?
  secenekler:
    A: '0'
    B: '9.480'
    C: '14.220'
    D: '18.960'
    E: '37.920'
  dogru: B
  aciklama:
    dogru_neden: DVK md. 14/2’ye göre belli parayı ihtiva eden mukavelenamelerin devri hâlinde aslından alınan verginin dörtte
      biri alınır. Asıl sözleşme için 37.920 TL ödendiğinden devir sözleşmesinin vergisi 37.920 / 4 = 9.480 TL’dir. Devir
      bedeli (1.500.000 TL) bu hesapta matrah olarak kullanılmaz.
    celdiriciler:
      A: Devre ilişkin kâğıtlar md. 2 uyarınca vergiye tabidir; (2) sayılı tablodaki pay devri istisnası şirket paylarına
        ilişkindir, sözleşme devrine değil.
      C: Devir bedelinin binde 9,48’i (1.500.000 × 0,00948) alınmıştır; kanun devirde asıl vergiyi esas alır.
      D: Asıl verginin yarısı alınmıştır; “yarı nispet” yabancı memleketler arasında düzenlenip Türkiye’de tedavüle çıkarılan
        kâğıtlara ilişkindir.
      E: Asıl verginin tamamı alınmıştır; aynı miktarda vergi sözleşme süresinin uzatılması hâlinde söz konusudur, devirde
        değil.
    hesap_adimlari:
    - 'Asıl sözleşmenin vergisi: 37.920 TL'
    - 'Devirde alınacak vergi: 37.920 × 1/4 = 9.480 TL'
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 14/2
    alinti: Bunların devri halinde aslından alınan verginin dörtte biri alınır.
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 2
    alinti: Vergiye tabi kağıtlar mahiyetinde bulunan veya onların yerini alan mektup ve şerhlerle, bu kağıtların hükümlerinin
      yenilenmesine, uzatılmasına, değiştirilmesine devrine veya bozulmasına ilişkin mektup ve şerhler de Damga Vergisine
      tabidir.
  gecerlilik:
    baslangic: '1964-11-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'asil = 37920

      sonuc = asil / 4'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi HSV-2
    kapilar:
      G2:
        sonuc: gecti
