  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: istisnalar
  tip: uygulama
  zorluk: 1
  kok: Ücretli olarak çalışan Bay (A), arkadaşı Bay (B)’ye 15 Ocak 2026’da 500.000 TL borç vermiş ve taraflar bu ödünç ilişkisini
    gösteren bir sözleşme imzalamıştır. Taraflardan hiçbirinin ticari, zirai veya mesleki faaliyeti yoktur ve işlem böyle
    bir faaliyetle ilgili değildir. Bay (A), 10 Haziran 2026’da bu sözleşmeyi bir işlemde kullanmak üzere notere ibraz etmiştir.
    Damga Vergisi Kanunu’na göre sözleşmenin damga vergisi karşısındaki durumu aşağıdakilerden hangisidir?
  secenekler:
    A: İbraz tarihi olan 10 Haziran 2026 itibarıyla vergiye tabidir; vergiyi ibraz eden Bay (A) öder.
    B: İmzalandığı 15 Ocak 2026 itibarıyla vergiye tabidir ve vergiyi imza eden iki taraf birlikte öder.
    C: Ticari olmayan bir akde ilişkin olduğundan notere ibraz edilse de damga vergisinden istisnadır.
    D: Notere ibraz edildiği tarih itibarıyla vergiye tabi tutulur; vergiyi borçlu sıfatıyla Bay (B) öder.
    E: İmzalandığı tarih itibarıyla vergiye tabidir; notere ibraz sırasında vergi gecikme faiziyle birlikte aranır.
  dogru: A
  aciklama:
    dogru_neden: (2) sayılı tablo IV/34’e göre ticari, zirai veya mesleki faaliyetlere ilişkin olmamak şartıyla gerçek kişiler
      arasında düzenlenen akitlerle ilgili kâğıtlar istisnadır; ancak bu kâğıtlar resmî dairelere veya noterlere ibraz edildiklerinde
      bu tarih itibarıyla vergiye tabi tutulur ve vergi ibraz edenlerce ödenir. Sözleşmeyi notere ibraz eden Bay (A) olduğundan
      vergi 10 Haziran 2026 itibarıyla doğar ve Bay (A) tarafından ödenir.
    celdiriciler:
      B: Düzenlendiği tarihte kâğıt istisna kapsamındadır; vergiyi doğuran an ibraz tarihidir ve mükellef imza edenler değil
        ibraz edendir.
      C: İstisna mutlak değildir; resmî daireye veya notere ibraz hâlinde vergiye tabi tutulur.
      D: Vergi ibraz tarihinde doğar ancak kanun vergiyi borçluya değil ibraz edene yükler.
      E: Düzenleme tarihinde vergi doğmadığından gecikmeden söz edilemez; vergi ibraz tarihi itibarıyla doğar.
    hesap_adimlari: []
  kaynaklar:
