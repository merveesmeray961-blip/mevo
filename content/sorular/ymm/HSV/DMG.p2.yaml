- id: YMM-HSV-DMG-0026
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: nispi ve maktu vergi
  tip: hesaplama
  zorluk: 2
  kok: (K) A.Ş., 1 Mart 2026’da (M) A.Ş.’ye ait bir büro için 3 yıl süreli kira sözleşmesi imzalamıştır. Aylık kira bedeli
    40.000 TL’dir (KDV bu soruda dikkate alınmayacaktır). Sözleşme iki nüsha olarak düzenlenmiş, her iki nüsha da taraflarca
    imzalanmıştır. 2026 yılında kira mukavelenameleri için binde 1,89, diğer mukavelenameler için binde 9,48 oranı uygulanmaktadır.
    Bu sözleşme için ödenecek damga vergisi kaç TL’dir?
  secenekler:
    A: 907,20
    B: 1.814,40
    C: 2.721,60
    D: 5.443,20
    E: 13.651,20
  dogru: C
  aciklama:
    dogru_neden: 'Kira mukavelenamelerinde nispi vergi, (1) sayılı tablo I/A-2 uyarınca mukavele süresine göre kira bedeli
      üzerinden alınır: 40.000 × 36 ay = 1.440.000 TL; 1.440.000 × binde 1,89 = 2.721,60 TL. DVK md. 5’e göre nispi vergiye
      tabi kâğıtların yalnız bir nüshası vergiye tabi olduğundan ikinci nüsha için ayrıca vergi alınmaz.'
    celdiriciler:
      A: Yalnız bir yıllık kira bedeli (480.000 TL) esas alınmıştır; matrah sözleşme süresinin tamamına ait kira bedelidir.
      B: Bir yıllık kira bedeli iki nüsha için ayrı ayrı vergilendirilmiştir; hem süre hem nüsha kuralı yanlış uygulanmıştır.
      D: Matrah doğru, fakat her nüsha ayrı vergilendirilmiştir; nispi vergide yalnız bir nüsha vergiye tabidir.
      E: Kira sözleşmesine genel mukavelename oranı (binde 9,48) uygulanmıştır.
    hesap_adimlari:
    - 'Matrah: 40.000 × 36 = 1.440.000 TL'
    - 'Vergi: 1.440.000 × 0,00189 = 2.721,60 TL'
    - Nispi vergide tek nüsha vergilendirilir.
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 5
    alinti: Bir nüshadan fazla olarak düzenlenen kâğıtlardan, maktu vergiye tabi olanların her bir nüshası ayrı ayrı aynı
      miktarda; nispi vergiye tabi olanların ise sadece bir nüshası damga vergisine tabidir.
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: (1) sayılı tablo I/A-2
  gecerlilik:
    baslangic: '2016-08-09'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'matrah = 40000 * 36

      sonuc = round(matrah * 1.89 / 1000, 2)'
  durum: taslak
  surum: 1
