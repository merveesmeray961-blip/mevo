- id: YMM-HSV-DMG-0067
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: ölüm nedeniyle tazminat davasında peşin harç ve bakiye
  tip: hesaplama
  zorluk: 2
  kok: Ölüm sebebiyle açılan maddi ve manevi tazminat davasında mahkeme 2.000.000 TL tazminata hükmetmiştir. 2026 yılı karar
    ve ilam harcı nispeti binde 68,31'dir. Peşin harcın, hükmedilen değer üzerinden hesaplanan karar ve ilam harcı esas alınarak
    Harçlar Kanunu md. 28'de öngörülen oranla ödendiği varsayıldığında, kararın tebliğinden itibaren bir ay içinde ödenecek
    bakiye karar ve ilam harcı kaç TL'dir?
  secenekler:
    A: '6.831'
    B: '34.155'
    C: '102.465'
    D: '129.789'
    E: '136.620'
  dogru: D
  aciklama:
    dogru_neden: Harçlar Kanunu md. 28/a'ya göre karar ve ilam harçlarının dörtte biri peşin, geri kalanı kararın tebliğinden
      itibaren bir ay içinde ödenir; ancak ölüm ve cismani zarar sebebiyle açılan maddi ve manevi tazminat davalarında peşin
      alınan harcın oranı yirmide bir olarak uygulanır. Karar ve ilam harcı 2.000.000 × 68,31/1.000 = 136.620 TL; peşin harç
      136.620 / 20 = 6.831 TL; bakiye 136.620 − 6.831 = 129.789 TL'dir.
    celdiriciler:
      A: Yalnızca peşin harç (6.831 TL) bakiye sanılmıştır; bakiye, toplam harçtan peşin harç düşülerek bulunur.
      B: Dörtte bir oranı (34.155 TL) uygulanmıştır; ölüm ve cismani zarar tazminat davalarında peşin oran yirmide birdir.
      C: Dörtte üç oranıyla bakiye (102.465 TL) hesaplanmıştır; bu tazminat davalarında peşin oran yirmide bir olduğundan
        bakiye yirmide ondokuzdur.
      E: Toplam karar ve ilam harcı (136.620 TL) bakiye kabul edilmiştir; peşin ödenen kısım düşülmemiştir.
    hesap_adimlari:
    - Karar ve ilam harcı = 2.000.000 × 0,06831 = 136.620 TL
    - Peşin harç = 136.620 / 20 = 6.831 TL
    - Bakiye = 136.620 − 6.831 = 129.789 TL
  kaynaklar:
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: md. 28/a
    alinti: Karar ve ilam harçlarının dörtte biri peşin, geri kalanı kararın tebliğinden itibaren bir ay içinde ödenir. Şu
      kadar ki, ölüm ve cismani zarar sebebiyle açılan maddi ve manevi tazminat davalarında peşin alınan harcın oranı yirmide
      bir olarak uygulanır.
