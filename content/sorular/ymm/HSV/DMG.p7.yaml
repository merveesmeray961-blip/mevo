- id: YMM-HSV-DMG-0070
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: birden fazla nüsha düzenlenen kâğıtlarda damga vergisi
  tip: hesaplama
  zorluk: 2
  kok: Taraflar, belli parayı ihtiva eden 5.000.000 TL tutarlı bir mukaveleyi 3 nüsha olarak düzenleyip imzalamışlardır. 2026
    yılında mukavelelerde uygulanan damga vergisi nispeti binde 9,48'dir. Damga Vergisi Kanunu md. 5'e göre bu mukavele için
    ödenmesi gereken toplam damga vergisi kaç TL'dir?
  secenekler:
    A: '47.400'
    B: '94.800'
    C: '142.200'
    D: '189.600'
    E: '237.000'
  dogru: A
  aciklama:
    dogru_neden: 'Damga Vergisi Kanunu md. 5''e göre bir nüshadan fazla olarak düzenlenen kâğıtlardan maktu vergiye tabi olanların
      her bir nüshası ayrı ayrı aynı miktarda, nispi vergiye tabi olanların ise sadece bir nüshası damga vergisine tabidir.
      Mukavele belli para ihtiva ettiğinden nispi vergiye tabidir: 5.000.000 × 9,48/1.000 = 47.400 TL; üç nüshadan yalnız
      biri vergilendirilir.'
    celdiriciler:
      B: İki nüsha vergilendirilmiştir (94.800 TL); nispi vergide yalnızca bir nüsha vergiye tabidir.
      C: Üç nüshanın tamamı vergilendirilmiştir (142.200 TL); bu kural maktu vergiye tabi kâğıtlar için geçerlidir.
      D: Dört nüsha varmış gibi hesap yapılmıştır (189.600 TL); mukavele üç nüshadır ve zaten yalnız biri vergilenir.
      E: Beş nüsha vergilendirilmiş gibi hesap yapılmıştır (237.000 TL); nüsha sayısı vergiyi çoğaltmaz.
    hesap_adimlari:
    - Mukavele nispi vergiye tabi; yalnız bir nüsha vergilendirilir
