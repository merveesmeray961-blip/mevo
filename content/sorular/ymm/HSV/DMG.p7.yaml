- id: YMM-HSV-DMG-0069
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: intifa hakkından feragatte tapu harcı
  tip: hesaplama
  zorluk: 3
  kok: Kayıtlı değeri (emlak vergisi değeri) 6.000.000 TL olan bir gayrimenkulün intifa hakkı sahibi (İ), intifa hakkından
    kuru mülkiyet sahibi (K) lehine kanuni mirasçılık ilişkisi bulunmaksızın ivazsız feragat etmiştir. 2026 yılında, intifa
    hakkından kuru mülkiyet sahibi lehine ivazsız feragat edilmesinde uygulanan tapu harcı nispeti binde 68,31'dir. Harçlar
    Kanunu'na göre bu feragat nedeniyle alınacak tapu harcı kaç TL'dir?
  secenekler:
    A: '80.000'
    B: '120.000'
    C: '136.620'
    D: '273.240'
    E: '409.860'
  dogru: D
  aciklama:
    dogru_neden: 'Harçlar Kanunu md. 64''e göre çıplak mülkiyet ve intifa haklarına ait harçların hesabında kayıtlı değerin
      üçte biri çıplak mülkiyete, üçte ikisi intifa hakkına ayrılır. (4) sayılı tarifede intifa hakkından kuru mülkiyet sahibi
      lehine ivazsız feragat için kayıtlı değer üzerinden binde 68,31 harç öngörülmüştür. Feragat edilen hak intifadır: 6.000.000
      × 2/3 = 4.000.000 TL; harç 4.000.000 × 68,31/1.000 = 273.240 TL''dir. Püf noktaları: (1) Harcın matrahı tüm kayıtlı
      değer değil, intifa payıdır. (2) Alım-satımdaki binde 20 oranı bu işlemde uygulanmaz. (3) Bağışa benzer işlemlerde oran
      binde 68,31''dir.'
    celdiriciler:
      A: İntifa değerine (4.000.000 TL) alım-satım nispeti olan binde 20 uygulanmıştır (80.000 TL); intifa feragati ivazsız
        olduğundan binde 68,31 uygulanır.
      B: Tüm kayıtlı değere (6.000.000 TL) binde 20 uygulanmıştır (120.000 TL); hem oran hem matrah yanlıştır.
      C: Kayıtlı değerin üçte biri (çıplak mülkiyet payı, 2.000.000 TL) matrah alınmıştır (136.620 TL); intifa payı üçte ikidir.
      E: Tüm kayıtlı değere (6.000.000 TL) binde 68,31 uygulanmıştır (409.860 TL); matrah yalnızca intifa payıdır.
    hesap_adimlari:
    - İntifa payı = 6.000.000 × 2/3 = 4.000.000 TL
    - Harç = 4.000.000 × 68,31/1.000 = 273.240 TL
