- id: YMM-HSV-DMG-0068
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: tapu harcında ikmalen tarh ve vergi ziyaı cezası
  tip: hesaplama
  zorluk: 3
  kok: (A), 2026 yılında (S)'den satın aldığı gayrimenkulün tapuda tescili sırasında 2.000.000 TL bedel üzerinden tapu harcı
    ödemiştir. Sonradan, gayrimenkulün işlem tarihindeki emlak vergisi değerinin 3.000.000 TL olduğu ve harcın emlak vergisi
    değerinden düşük bir bedel üzerinden ödendiği tespit edilmiştir. Gayrimenkul alım-satımında devir eden ve devir alan için
    ayrı ayrı uygulanan 2026 yılı tapu harcı nispeti binde 20'dir. Harçlar Kanunu md. 63'e göre (A)'dan (alıcıdan) bu tespit
    nedeniyle aranacak ek harç ve vergi ziyaı cezası toplamı kaç TL'dir? (Takdir komisyonu kararı **yoktur**; ceza, ikmalen
    tarh edilecek harç için Vergi Usul Kanunu'ndaki vergi ziyaı cezasının uygulanmasıyla bulunacaktır.)
  secenekler:
    A: '20.000'
    B: '25.000'
    C: '40.000'
    D: '60.000'
    E: '80.000'
  dogru: C
  aciklama:
    dogru_neden: 'Harçlar Kanunu md. 63''e göre tapuda yapılan işlemden sonra emlak vergisi değerinden daha düşük bir bedel
      üzerinden harç ödendiği tespit edilirse aradaki farka isabet eden harç ikmalen veya re''sen tarh edilir ve bu harç için
      vergi ziyaı cezası bir kat uygulanır. Fark = 3.000.000 − 2.000.000 = 1.000.000 TL; alıcının ek harcı 1.000.000 × binde
      20 = 20.000 TL; ceza bir kat = 20.000 TL; toplam 40.000 TL''dir. Püf noktaları: (1) Tarife, devir eden ve devir alan
      için ayrı ayrı uygulandığından soruda yalnızca alıcı istenmiştir. (2) Ceza, harç tutarının bir katıdır (yüzde yüz).
      (3) Matrah, ödenen bedelle emlak vergisi değeri arasındaki farktır, tüm değer değildir.'
    celdiriciler:
      A: Yalnızca ikmalen tarh edilen harç (20.000 TL) bulunmuş, vergi ziyaı cezası eklenmemiştir; md. 63 ceza uygulanmasını
        öngörür.
      B: Ceza %25 nispetinde hesaplanmıştır (20.000 + 5.000 = 25.000 TL); md. 63'te ceza artık bir kat uygulanır.
      D: Ceza iki kat alınmıştır (20.000 + 40.000 = 60.000 TL); kanun bir kat öngörür.
      E: Hem alıcı hem satıcı payı birlikte hesaplanmıştır (2 × 40.000 = 80.000 TL); soruda yalnızca alıcıdan aranacak tutar
        sorulmuştur.
    hesap_adimlari:
    - Fark = 3.000.000 − 2.000.000 = 1.000.000 TL
    - Ek harç = 1.000.000 × 20/1.000 = 20.000 TL (alıcı)
    - Vergi ziyaı cezası = 20.000 × 1 = 20.000 TL
    - Toplam = 20.000 + 20.000 = 40.000 TL
  kaynaklar:
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: md. 63
    alinti: Tapuda yapılan işlemden sonra, emlak vergisi değerinden daha düşük bir bedel üzerinden harç ödendiğinin veya beyan
      edilen devir ve iktisap bedelinin gerçek durumu yansıtmadığının tespit edilmesi halinde, aradaki farka isabet eden harç
      ikmalen veya re’sen tarh edilir. Bu suretle tarh edilecek tapu ve kadastro harcı için, 213 sayılı Vergi Usul Kanununda
      yer alan vergi ziyaı cezası bir kat uygulanır.
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: (4) sayılı tarife, I-20/a
    alinti: Gayrimenkullerin ivaz karşılığında veya ölünceye kadar bakma akdine dayanarak yahut trampa hükümlerine göre devir
      ve iktisabında gayrimenkulün emlak vergisi değerinden az olmamak üzere beyan edilen devir ve iktisap bedeli üzerinden
      (cebrî icra ve şüyuun izalesi hallerinde satış bedeli, istimlaklerde takdir edilen bedel üzerinden) devir eden ve devir
      alan için ayrı ayrı,
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'fark=3000000-2000000

      harc=fark*20/1000

      sonuc = harc+harc*1

      '
