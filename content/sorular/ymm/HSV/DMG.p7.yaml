- id: YMM-HSV-DMG-0066
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: davadan feragatte alınacak harç
  tip: hesaplama
  zorluk: 2
  kok: Konusu belli bir değerle ilgili bir davada anlaşmazlık konusu değer 1.500.000 TL'dir. 2026 yılında geçerli karar ve
    ilam harcı nispeti binde 68,31'dir. Davacı, davadan muhakemenin ilk celsesinden sonra yapılan duruşmada feragat etmiştir.
    Harçlar Kanunu'na göre feragat nedeniyle alınacak harç kaç TL'dir? (Harcın hesabında 10 TL'ye kadar olan matrah kesirleri
    bulunmamaktadır.)
  secenekler:
    A: 34.155,00
    B: 68.310,00
    C: 76.848,75
    D: 102.465,00
    E: 136.620,00
  dogru: B
  aciklama:
    dogru_neden: 'Harçlar Kanunu md. 22''ye göre davadan feragat muhakemenin ilk celsesinde olursa karar ve ilam harcının
      üçte biri, daha sonra olursa üçte ikisi alınır. Karar ve ilam harcı: 1.500.000 × 68,31/1.000 = 102.465 TL. İlk celse
      geçtikten sonra feragat edildiğinden alınacak harç 102.465 × 2/3 = 68.310 TL''dir.'
    celdiriciler:
      A: Karar ve ilam harcının üçte biri (34.155 TL) alınmıştır; üçte bir oranı yalnızca ilk celsede yapılan feragat için
        geçerlidir.
      C: Karar ve ilam harcının dörtte üçü (76.848,75 TL) alınmıştır; md. 22 üçte iki oranını öngörür.
      D: Karar ve ilam harcının tamamı (102.465 TL) alınmıştır; feragatte harç oranı indirilir.
      E: Harç iki katına çıkarılmıştır (136.620 TL); feragat halinde harç artırılmaz, azaltılır.
    hesap_adimlari:
    - Karar ve ilam harcı = 1.500.000 × 0,06831 = 102.465 TL
    - 'İlk celseden sonra feragat: harcın üçte ikisi'
    - Alınacak harç = 102.465 × 2/3 = 68.310 TL
  kaynaklar:
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: md. 22
    alinti: Davadan feragat veya davayı kabul veya sulh, muhakemenin ilk celsesinde vuku bulursa, karar ve ilam harcının üçte
      biri, daha sonra olursa üçte ikisi alınır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'harc=1500000*68.31/1000

      sonuc = harc*2/3

      '
  durum: kontrolde
  surum: 1
