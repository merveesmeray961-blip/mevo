    hangisi **yanlıştır**?
  secenekler:
    A: ÖİV, faturada ayrıca gösterilir ve katma değer vergisi matrahına dahil edilmez.
    B: Bir aya ait ÖİV, izleyen ayın on beşinci günü akşamına kadar beyan edilip aynı sürede ödenir.
