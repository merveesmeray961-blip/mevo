  kok: (K) Bankası Eylül 2026'da müşterilerinden 80.000.000 TL karşılığı döviz satın almış, müşterilerine 45.000.000 TL karşılığı
    döviz satmıştır. Kambiyo muameleleri için Kanun'da öngörülen oran uygulanacak ve Cumhurbaşkanı Kararıyla belirlenmiş farklı
    bir oran bulunmadığı kabul edilecektir. 6802 sayılı Kanun'a göre bankanın bu kambiyo muameleleri nedeniyle hesaplayacağı
    banka ve sigorta muameleleri vergisi kaç TL'dir?
