    dogru_neden: Kambiyo alım ve satım muamelelerinde matrah kambiyo satışlarının tutarıdır (md. 31/2); oran matrahın binde
      ikisidir (md. 33/1). 45.000.000 × 2/1000 = 90.000 TL.
    celdiriciler:
      A: Satış ile alış arasındaki fark (35.000.000) matrah alınmıştır; Kanun satış tutarını matrah sayar.
      C: Alış tutarı (80.000.000) matrah alınmıştır.
      D: Alış ve satış toplamı (125.000.000) matrah alınmıştır.
      E: Genel %15 oranı uygulanmıştır; kambiyo muamelelerinde oran binde ikidir.
    hesap_adimlari:
    - Matrah = kambiyo satış tutarı = 45.000.000 TL
    - BSMV = 45.000.000 × 0,002 = 90.000 TL
