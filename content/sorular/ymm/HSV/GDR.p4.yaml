      A: Doğrudur; ÖİV faturada ayrıca gösterilir ve KDV matrahına dahil edilmez.
      B: Doğrudur; ÖİV için 47 ve 48. maddeler uygulanmaz, izleyen ayın on beşinci günü akşamına kadar beyan ve ödeme yapılır.
