  zorluk: 1
  kok: Merkezi Türkiye'de bulunan (B) Bankası ile (S) Sigorta A.Ş.'nin Nisan 2026'da kendi lehlerine aldıkları aşağıdaki paralardan
    hangisi 6802 sayılı Gider Vergileri Kanunu'na göre banka ve sigorta muameleleri vergisine **tabidir**?
  secenekler:
    A: (S) A.Ş.'nin bireysel müşterisine düzenlediği hayat sigortası poliçesindeki prim
    B: (S) A.Ş.'nin biçilmemiş buğday mahsulü için düzenlediği zirai sigorta poliçesindeki prim
    C: (S) A.Ş.'nin bir sanayi şirketinin fabrika binası için düzenlediği yangın sigortası poliçesindeki prim
    D: (B) Bankasının mevzuat gereği Merkez Bankasına yaptığı zorunlu döviz devri dolayısıyla aldığı paralar
    E: (B) Bankasının Ankara şubesinin İzmir şubesine aktardığı fon karşılığında tahakkuk eden faiz
  dogru: C
  aciklama:
    dogru_neden: Sigorta şirketlerinin bütün muameleleri dolayısıyla kendi lehlerine aldıkları paralar BSMV'ye tabidir (md.
      28); md. 29'daki istisnalar arasında yangın sigortası yoktur. Bu nedenle fabrika binası için alınan yangın sigortası
      primi vergiye tabidir; sigortada matrah poliçedeki primdir (md. 31).
    celdiriciler:
      A: Hayat sigortalarında poliçe üzerinden alınan paralar md. 29/i ile istisnadır.
      B: Biçilmemiş veya toplanmamış tarım mahsulleri için yapılan zirai sigortalar md. 29/k ile istisnadır.
      D: Bankaların Merkez Bankasına yaptıkları zorunlu döviz ve efektif devirleri md. 29/o ile istisnadır.
      E: Merkezi Türkiye'de bulunan bankanın kendi şubelerinin birbirleriyle yaptıkları muameleler md. 29/a ile istisnadır.
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 28
    alinti: dolayısıyla kendi lehlerine her ne nam ile olursa olsun nakden veya hesaben aldıkları paralar
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 29/i
    alinti: Emeklilik sözleşmeleri, hayat sigortaları
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 29/o
    alinti: Merkez Bankasına yapacakları zorunlu, döviz ve efektif
