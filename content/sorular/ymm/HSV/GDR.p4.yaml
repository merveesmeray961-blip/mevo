- id: YMM-HSV-GDR-0005
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: değerli kağıtlar
  tip: hesaplama
  zorluk: 2
  kok: (Y) Bankası Mart 2026'da müşterilerine toplam 2.000 adet çek yaprağı satmıştır. Bu yaprakların 300'ü belediyelere,
    200'ü genel bütçeli idarelere verilmiş; kalanı özel sektör müşterilerine satılmıştır. 2026 yılında banka çeklerinin her
    bir yaprağı için uygulanan değerli kâğıt bedeli 95 TL'dir. 210 sayılı Değerli Kağıtlar Kanunu'na göre bankanın Mart 2026
    satışları için mal sandığına ödeyeceği değerli kâğıt bedeli ve son ödeme günü hangi seçenekte doğru verilmiştir?
  secenekler:
    A: 142.500 TL – 7 Nisan 2026
    B: 142.500 TL – 15 Nisan 2026
    C: 161.500 TL – 7 Nisan 2026
    D: 190.000 TL – 7 Nisan 2026
    E: 190.000 TL – 15 Nisan 2026
  dogru: A
  aciklama:
    dogru_neden: 'Çekler bankalarca bastırılıp satılır; genel ve katma bütçeli idareler, il özel idareleri ve belediyelere
      verilen çekler hariç, satılan çeklerin değerli kâğıt bedeli her ayın yedinci günü akşamına kadar mal sandığına ödenir
      (md. 3). Bedele tabi yaprak: 2.000 − 300 − 200 = 1.500; 1.500 × 95 = 142.500 TL; son gün 7 Nisan 2026.'
    celdiriciler:
      B: Tutar doğru, ancak on beşinci gün BSMV beyan süresidir; çek bedeli ayın yedinci günü ödenir.
      C: 'Yalnız belediyelere verilen çekler düşülmüş, genel bütçeli idarelere verilenler de bedele tabi tutulmuştur: 1.700
        × 95.'
      D: 'İstisna kapsamındaki çekler düşülmemiştir: 2.000 × 95.'
      E: Hem istisna düşülmemiş hem ödeme günü yanlış alınmıştır.
    hesap_adimlari:
    - Bedele tabi yaprak = 2.000 − 300 − 200 = 1.500
    - 1.500 × 95 = 142.500 TL
    - 'Son ödeme: izleyen ayın 7''si akşamı = 7 Nisan 2026'
  kaynaklar:
  - mevzuat: 210 sayılı Değerli Kağıtlar Kanunu
    madde: md. 3
    alinti: değerli kâğıt bedelleri, bankalarca her ayın yedinci günü akşamına kadar ilgili mal
  - mevzuat: 210 sayılı Değerli Kağıtlar Kanunu
    madde: md. 3
    alinti: genel ve katma bütçeli idareler, il özel idareleri ve belediyelere verilen çekler hariç
  - mevzuat: 210 sayılı Değerli Kağıtlar Kanunu (Muhasebat Genel Tebliği Sıra No 97)
    madde: Tablo 14
    alinti: Banka Çekleri (her bir çek yaprağı) (95,00)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = (2000 - 300 - 200) * 95
    secenek_sayisi_bekleniyor: false
