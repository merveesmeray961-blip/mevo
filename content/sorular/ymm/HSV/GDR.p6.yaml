- id: YMM-HSV-GDR-0017
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: özel iletişim vergisi, mobil abonelik ilk tesis vergisi
  tip: hesaplama
  zorluk: 2
  kok: (M) Mobil A.Ş., Aralık 2026'da; 1.800 adet sesli iletişim amaçlı mobil telefon aboneliğini, 200 adet genel amaçlı internet
    erişimi için kullanılan veri hattı aboneliğini ve 250 adet yalnızca makineler arası veri aktarımına mahsus ve başka amaçla
    kullanılmayan aboneliği ilk kez tesis etmiştir. Ayrıca 600 abone, başka bir işletmeciden (M)'ye geçiş yapmıştır (operatör
    değişikliği). Bu soruda mobil telefon aboneliğinin ilk tesisinde alınan maktu ÖİV tutarı abonelik başına 700 TL kabul
    edilecektir. (M)'nin bu işlemler nedeniyle ayrıca ödeyeceği ilk tesis ÖİV tutarı kaç TL'dir?
  secenekler:
    A: 1.260.000
    B: 1.400.000
    C: 1.575.000
    D: 1.820.000
    E: 1.995.000
  dogru: B
  aciklama:
    dogru_neden: 6802 sayılı Kanun md. 39/3'e göre mobil telefon aboneliğinin ilk tesisinde ayrıca maktu ÖİV alınır; ancak
      yalnızca makineler arası veri aktarımına mahsus ve sesli, görsel iletişim veya genel amaçlı internet erişimi için kullanılmayan
      abonelikler ile operatör değişiklikleri kapsam dışındadır. Vergiye tabi abonelik sayısı = 1.800 + 200 = 2.000; vergi
      = 2.000 × 700 = 1.400.000 TL.
    celdiriciler:
      A: 200 adet genel amaçlı internet erişimli hat unutulmuştur (1.800 × 700); bu hatlar kapsam dışı bırakılan makineler
        arası hatlardan farklıdır.
      C: Makineler arası veri aktarımına mahsus 250 abonelik de vergiye dahil edilmiştir (2.250 × 700).
      D: 600 operatör değişikliği de vergiye dahil edilmiştir (2.600 × 700); operatör değişikliği ilk tesis sayılmaz.
      E: Tüm abonelikler (2.850) vergilendirilmiştir; hem makineler arası hatlar hem operatör değişiklikleri kapsam dışıdır.
    hesap_adimlari:
    - 'Vergiye tabi abonelik: 1.800 + 200 = 2.000'
    - 'Vergi: 2.000 × 700 = 1.400.000 TL'
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 39/3
    alinti: Mobil telefon aboneliğinin ilk tesisinde (iş ve hizmetlerin merkezi bir sunucu tarafından uzaktan izlenmesi ve
      yürütülmesine yönelik makineler arası veri aktarımına mahsus olan ve bunların yürütülmesi için zorunlu olanlar dışında
      sesli, görsel iletişim veya genel amaçlı internet erişimi için kullanılmayan mobil telefon aboneliğinin ilk tesisi ile
      operatör değişiklikleri hariç)
