  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: banka ve sigorta muameleleri vergisinin mükellefi ve matrahı
  tip: uygulama
  zorluk: 1
  kok: Sigorta aracısı (A) Acentesi, Nisan 2026'da (S) Sigorta A.Ş. adına toplam 5.000.000 TL prim içeren trafik sigortası
    poliçeleri düzenlemiş ve bu poliçeler nedeniyle kendisine 600.000 TL komisyon ödenmiştir. Bu soruda BSMV oranı %5 kabul
    edildiğine göre, bu işlemlere ilişkin BSMV'nin mükellefi ve vergi tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: Acente; matrah 600.000 TL; vergi 30.000 TL
    B: Acente; matrah 5.000.000 TL; vergi 250.000 TL
    C: Sigorta şirketi; matrah 5.000.000 TL; vergi 250.000 TL
    D: Sigorta şirketi; matrah 4.400.000 TL; vergi 220.000 TL
    E: Sigorta şirketi ile acente birlikte; matrah 5.000.000 TL; vergi 250.000 TL
  dogru: C
  aciklama:
    dogru_neden: 6802 sayılı Kanun md. 30'a göre sigorta aracıları tarafından yapılan sigorta işlemlerinde de BSMV mükellefi
      sigorta şirketidir. Md. 31/3'e göre sigorta işlemlerinde matrah poliçedeki prim tutarıdır ve komisyon gibi ödemeler
      indirilemez. Vergi = 5.000.000 × %5 = 250.000 TL.
    celdiriciler:
      A: Mükellef acente değil sigorta şirketidir; ayrıca matrah komisyon tutarı değil prim tutarıdır.
      B: Matrah doğru olmakla birlikte mükellef sigorta aracısı değil sigorta şirketidir.
      D: Mükellef doğru, ancak acente komisyonu matrahtan indirilemez; matrah 5.000.000 TL'dir.
      E: Kanun mükellefi tek olarak sigorta şirketi saymıştır; acente ile müşterek mükellefiyet öngörülmemiştir.
    hesap_adimlari:
    - 'Mükellef: sigorta şirketi'
    - 'Matrah: 5.000.000 TL (komisyon indirilmez)'
    - 'Vergi: 5.000.000 × 0,05 = 250.000 TL'
  kaynaklar:
