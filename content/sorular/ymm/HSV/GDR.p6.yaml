- id: YMM-HSV-GDR-0018
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: dijital hizmet vergisinin kapsamı, matrahı, istisnaları ve gider yazılması
  tip: kavrama
  zorluk: 3
  kok: '7194 sayılı Kanun kapsamındaki dijital hizmet vergisi (DHV) ile ilgili aşağıdaki ifadeler verilmiştir:


    I. DHV, fatura ve fatura yerine geçen belgelerde ayrıca gösterilmez.

    II. DHV mükellefleri, ödedikleri DHV''yi gelir ve kurumlar vergisine esas safi kazancın tespitinde gider olarak indirebilir.

    III. Üzerinden özel iletişim vergisi alınan hizmetlerden elde edilen hasılat DHV''den istisnadır ve muafiyet hadlerinin
    tespitinde dikkate alınmaz.

    IV. Diğer kanunlarda yer alan istisna ve muafiyet hükümleri DHV bakımından da geçerlidir.

    V. DHV matrahının tespitinde verginin konusuna giren hizmetlere ilişkin giderler hasılattan indirilir.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve IV
    C: II, IV ve V
    D: II, III, IV ve V
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: '7194 sayılı Kanun md. 5/2 DHV''nin faturalarda ayrıca gösterilmeyeceğini (I doğru), md. 6/7 DHV''nin safi
      kazancın tespitinde gider olarak indirilebileceğini (II doğru), md. 4/6-b ÖİV alınan hizmetlerden elde edilen hasılatın
      istisna olduğunu ve hadlerin tespitinde dikkate alınmadığını (III doğru) hükme bağlar. Md. 4/7''ye göre DHV istisna
      ve muafiyetleri yalnız bu Kanunda düzenlenir; diğer kanunlardaki hükümler geçersizdir (IV yanlış). Md. 5/2''ye göre
      matrahtan gider ve maliyet indirilmez (V yanlış). Doğru ifadeler I, II ve III''tür.


      Püf noktaları: DHV''de "gider yazılabilir ama matrahtan gider düşülemez" ayrımını kaçırmayın; ÖİV''de ise vergi gider
      yazılamaz. Başka kanundaki istisna bu vergiye taşınmaz.'
    celdiriciler:
      A: Yalnız I doğru değildir; II ve III de doğrudur.
      B: 'IV yanlıştır: DHV istisna ve muafiyetleri yalnız 7194 sayılı Kanunda yer alabilir (md. 4/7).'
      C: 'IV ve V yanlıştır: matrahtan gider, maliyet ve vergi adı altında indirim yapılmaz (md. 5/2) ve diğer kanunlardaki
        istisnalar geçersizdir (md. 4/7).'
      D: IV ve V yanlıştır; ayrıca doğru olan I ifadesi seçenekte yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 7194 sayılı Dijital Hizmet Vergisi Kanunu
    madde: md. 4/7
    alinti: Dijital hizmet vergisine ilişkin istisna ve muafiyetler, ancak bu Kanuna hüküm eklenmek veya bu Kanunda değişiklik
      yapılmak suretiyle düzenlenir. Diğer kanunlarda yer alan istisna veya muafiyet hükümleri bu vergi bakımından geçersizdir.
  - mevzuat: 7194 sayılı Dijital Hizmet Vergisi Kanunu
    madde: md. 5/2
    alinti: Verginin matrahından gider, maliyet ve vergi adı altında indirim yapılmaz. Dijital hizmet vergisi, fatura ve fatura
      yerine geçen belgelerde ayrıca gösterilmez.
  - mevzuat: 7194 sayılı Dijital Hizmet Vergisi Kanunu
    madde: md. 6/7
    alinti: Dijital hizmet vergisi mükelleflerince ödenen dijital hizmet vergisi, bu mükellefler tarafından gelir ve kurumlar
      vergisine esas safi kazancın tespitinde gider olarak indirilebilir.
