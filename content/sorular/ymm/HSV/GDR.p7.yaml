  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: DHV matrahı ve döviz hasılatı
  tip: hesaplama
  zorluk: 2
  kok: Dijital hizmet sağlayıcısı (R), Mart 2026 vergilendirme döneminde verginin konusuna giren hizmetlerden 6.000.000 TL
    tutarında TL hasılat ve 10 Mart 2026'da elde ettiği 100.000 ABD Doları tutarında döviz hasılat elde etmiştir. 10 Mart
    2026 tarihinde TCMB döviz alış kuru 38,00 TL, döviz satış kuru 38,20 TL'dir. Bu hizmetler için aynı dönemde 4.000.000
    TL gider yapılmıştır. 2026 yılında Dijital Hizmet Vergisi oranı %5 olarak uygulanmaktadır. 7194 sayılı Kanun uyarınca
    (R)'nin Mart 2026 dönemi için hesaplanacak DHV tutarı kaç TL'dir?
  secenekler:
    A: '190.000'
    B: '290.000'
    C: '490.000'
    D: '491.000'
    E: '735.000'
  dogru: C
  aciklama:
    dogru_neden: 7194 sayılı Kanun md. 5'e göre matrah, dönemde elde edilen hasılattır; döviz hasılat, elde edildiği tarihteki
      TCMB döviz alış kuru üzerinden Türk parasına çevrilir ve matrahtan gider, maliyet ve vergi adı altında indirim yapılmaz.
      Matrah = 6.000.000 + 100.000 × 38,00 = 9.800.000 TL; DHV = 9.800.000 × %5 = 490.000 TL.
    celdiriciler:
      A: Yalnızca döviz hasılat (3.800.000 TL) esas alınmıştır; TL hasılat da matraha dahildir.
      B: Matrahtan gider düşülmüştür ((9.800.000 − 4.000.000) × %5 = 290.000 TL); md. 5/2 gider indirimine izin vermez.
      D: Döviz satış kuru kullanılmıştır (9.820.000 × %5 = 491.000 TL); kanun döviz alış kurunu esas alır.
      E: 2025 yılına ait %7,5 oran uygulanmıştır (9.800.000 × %7,5 = 735.000 TL); 2026 için oran %5'tir.
    hesap_adimlari:
    - Döviz hasılat = 100.000 × 38,00 = 3.800.000 TL
    - Matrah = 6.000.000 + 3.800.000 = 9.800.000 TL (gider düşülmez)
    - DHV = 9.800.000 × %5 = 490.000 TL
  kaynaklar:
  - mevzuat: 7194 sayılı Kanun (Dijital Hizmet Vergisi)
    madde: md. 5/1
    alinti: Hasılatın döviz ile hesaplanması hâlinde döviz, hasılatın elde edildiği tarihte geçerli olan Türkiye Cumhuriyet
      Merkez Bankası döviz alış kuru üzerinden Türk parasına çevrilir.
  - mevzuat: 7194 sayılı Kanun (Dijital Hizmet Vergisi)
    madde: md. 5/2
    alinti: Verginin matrahından gider, maliyet ve vergi adı altında indirim yapılmaz. Dijital hizmet vergisi, fatura ve fatura
      yerine geçen belgelerde ayrıca gösterilmez.
  - mevzuat: 7194 sayılı Kanun (Dijital Hizmet Vergisi)
    madde: md. 5/3 (dipnot)
    alinti: 10767 sayılı Cumhurbaşkanı Kararının 1 inci maddesiyle bu fıkrada yer alan oran 1/1/2026 tarihinden itibaren %5
      ve 1/1/2027 tarihinden itibaren %2,5 olarak uygulanır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'matrah=6000000+100000*38.00

      sonuc = matrah*0.05

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
