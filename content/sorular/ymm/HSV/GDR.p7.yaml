  kok: Bir sigorta şirketi, teminat süresi 1 Ocak 2026 - 31 Aralık 2026 olan 12 aylık bir poliçe için prim tutarı üzerinden
    12.000 TL BSMV hesaplayarak beyan ve ödemiştir. Poliçe, 1 Nisan 2026'da iptal edilmiştir. Gider Vergileri Kanunu md. 31'e
    göre sigorta şirketi, iptalin gerçekleştiği dönemde hesapladığı BSMV'den en fazla kaç TL indirebilir? (İptal tarihinden
    önceki süre, tam aylar itibarıyla hesaplanacaktır.)
  secenekler:
    A: '3.000'
    B: '6.000'
    C: '8.000'
    D: '9.000'
    E: '12.000'
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 31/5''e göre sigorta şirketleri, iptal ettikleri sigorta muamelelerine ilişkin vergileri yalnızca
      iptal tarihinden sonraki döneme ait olan kısmı için, iptalin gerçekleştiği dönemde hesaplanan BSMV''den indirebilirler.
      İptal 1 Nisan 2026''da yapıldığından Nisan-Aralık dönemi (9 ay) iptal sonrasına aittir: 12.000 × 9/12 = 9.000 TL.'
    celdiriciler:
      A: İptal öncesi geçen 3 ayın vergisi (3.000 TL) alınmıştır; indirilebilecek kısım iptal tarihinden sonraki döneme ait
        kısımdır.
      B: Verginin yarısı (6.000 TL) alınmıştır; iptal sonrası dönem 9 aydır ve oran 9/12'dir.
      C: Nisan ayı da geçmiş sayılarak 8/12 (8.000 TL) hesaplanmıştır; iptal 1 Nisan'da olduğundan Nisan ayı iptal sonrasına
        dahildir.
      E: Poliçe için hesaplanan verginin tamamı (12.000 TL) indirilmiştir; yalnızca iptal tarihinden sonraki döneme ait kısım
        indirilebilir.
    hesap_adimlari:
    - Poliçe için hesaplanan vergi = 12.000 TL
    - 'İptal sonrası dönem: Nisan-Aralık = 9 ay'
    - İndirilecek vergi = 12.000 × 9/12 = 9.000 TL
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 31/5
    alinti: Sigorta şirketleri, iptal ettikleri sigorta muamelelerine ilişkin vergileri (yalnızca iptal tarihinden sonraki
