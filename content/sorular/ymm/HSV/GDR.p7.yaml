- id: YMM-HSV-GDR-0021
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Gider vergileri ve diğer harcama vergileri
  konu: GDR
  kazanim: 'BSMV: bankaların tüketiciye iade ettiği tutarlara ilişkin indirim'
  tip: hesaplama
  zorluk: 2
  kok: Bir banka, Mayıs 2026 döneminde yaptığı işlemler nedeniyle 1.500 TL banka ve sigorta muameleleri vergisi hesaplamıştır.
    Banka, aynı dönemde 6502 sayılı Tüketicinin Korunması Hakkında Kanun gereğince tüketicilere iade ettiği ücret ve komisyon
    tutarlarına ilişkin 2.000 TL tutarında BSMV'yi daha önce beyan edip ödemiştir. Gider Vergileri Kanunu md. 31'e göre Mayıs
    2026 dönemi beyannamesinde sonraki döneme devreden indirilemeyen vergi kaç TL'dir?
  secenekler:
    A: '0'
    B: '500'
    C: '1.500'
    D: '2.000'
    E: '3.500'
  dogru: B
  aciklama:
    dogru_neden: GVK (6802) md. 31/5'e göre bankalar, 6502 sayılı Kanun gereğince tüketicilere iade ettikleri ücret, komisyon
      ve benzeri tutarlara ilişkin vergileri, iadenin gerçekleştiği dönemde hesaplanan BSMV'den indirebilirler; bu dönemde
      indirilemeyen vergiler sonraki dönem beyannamelerinde indirim konusu yapılabilir. Mayıs'ta hesaplanan vergi 1.500 TL
      olduğundan indirilebilecek tutar 1.500 TL'dir; ödenecek vergi sıfır olur ve 2.000 − 1.500 = 500 TL sonraki döneme devreder.
    celdiriciler:
      A: Devreden tutar sıfır alınmıştır; oysa indirim hesaplanan verginin (1.500 TL) üzerindeki 500 TL için o dönemde yapılamaz,
        sonraki döneme devredilir.
      C: Dönemde hesaplanan vergi (1.500 TL) devreden sayılmıştır; indirim konusu yapılan 2.000 TL'den hesaplanan 1.500 TL
        düşülmesi gerekir.
      D: İade edilen tutara ilişkin verginin tamamı (2.000 TL) devreden kabul edilmiştir; indirim bu dönemde hesaplanan vergiye
        kadar yapılabilir.
      E: Hesaplanan vergi ile iade edilen tutara ilişkin vergi toplanmıştır (1.500 + 2.000); indirim, toplama değil çıkarma
        işlemidir.
    hesap_adimlari:
    - İndirilebilecek tutar = min(hesaplanan vergi 1.500; iade edilen tutara ilişkin vergi 2.000) = 1.500 TL
    - Ödenecek BSMV = 1.500 − 1.500 = 0 TL
    - Devreden = 2.000 − 1.500 = 500 TL
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 31/5
    alinti: bankalar ve finansman şirketleri, 7/11/2013 tarihli ve 6502 sayılı Tüketicinin Korunması Hakkında Kanun gereğince
      tüketicilere iade ettikleri ücret, komisyon ve benzeri adlarla tahsil ettikleri tutarlara ilişkin vergileri, iadenin
      gerçekleştiği dönemde hesaplanan banka ve sigorta muameleleri vergisinden indirebilirler.
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 31/5
    alinti: Bu dönemde indirilemeyen vergiler, sonraki dönem beyannamelerinde indirim konusu yapılabilir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'hesaplanan=1500

      iade_vergi=2000

      indirilen=min(hesaplanan,iade_vergi)

      sonuc = iade_vergi-indirilen

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Anahtar bağımsız çözümle ve mevzuat/2026 tutarlarıyla doğrulandı; tek doğru şık,
          açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
