  kok: 3065 sayılı KDV Kanunu’na göre, gümrük vergisine tabi olmayan bir mal ithalatında vergiyi doğuran olay aşağıdakilerden
    hangisiyle meydana gelir?
  secenekler:
    A: Gümrük vergisi ödeme mükellefiyetinin başlamasıyla
    B: Gümrük beyannamesinin tescil edilmesiyle
    C: Malın fiilen ithal edilerek gümrük bölgesine girmesiyle
    D: İthalde alınan vergilerin gümrük idaresince tahakkuk ettirilmesiyle
    E: Malın gümrükten çekilerek ithalatçıya teslim edilmesiyle
  dogru: B
  aciklama:
    dogru_neden: KDVK md. 10/ı uyarınca ithalatta vergiyi doğuran olay, Gümrük Kanunu’na göre gümrük vergisi ödeme mükellefiyetinin
      başlamasıdır; gümrük vergisine tabi olmayan işlemlerde ise gümrük beyannamesinin tescili anında meydana gelir. Soruda
      mal gümrük vergisine tabi olmadığından beyannamenin tescili esas alınır.
    celdiriciler:
      A: Gümrük vergisi ödeme mükellefiyetinin başlaması, gümrük vergisine tabi ithalatta vergiyi doğuran olaydır; soruda
        mal gümrük vergisine tabi değildir.
      C: “Fiili ithal” ölçütü bentte daha önce yer alıyordu; 4369 sayılı Kanunla “gümrük beyannamesinin tescili” olarak değiştirilmiştir.
        Gümrük bölgesine giriş ise (j) bendinde yabancıların uluslararası taşımacılığı için öngörülen ölçüttür.
      D: Bedellerin tahakkuk ettirilmesi, (g) bendinde su, elektrik, gaz gibi enerji dağıtımları için öngörülmüştür; ithalatta
        tahakkuk anı ölçüt değildir.
      E: İthalatta malın ithalatçıya teslimi değil, gümrük işlemindeki an (tescil ya da ödeme mükellefiyetinin başlaması)
        esas alınır.
    hesap_adimlari: []
