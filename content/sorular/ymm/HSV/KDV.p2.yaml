        kadar yapılan giderleri kapsar.
      E: 227.400 TL, tescil öncesi ve sonrası tüm giderlerin matraha eklenmesidir (1.137.000 × %20).
    hesap_adimlari:
    - 'Gümrük kıymeti: 1.000.000 TL'
    - 'İthalat sırasında ödenen vergi, resim, harç ve paylar: 80.000 + 20.000 = 100.000 TL'
    - 'Tescile kadar yapılan vergilendirilmeyen gider (ardiye): 15.000 TL'
    - 'Matrah: 1.115.000 TL; KDV: 1.115.000 × 0,20 = 223.000 TL'
