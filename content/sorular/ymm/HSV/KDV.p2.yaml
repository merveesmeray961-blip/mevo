    B: '223.000'
    C: '225.000'
    D: '225.400'
    E: '227.400'
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 21’e göre ithalatta matrah; gümrük kıymeti, ithalat sırasında ödenen her türlü vergi, resim, harç
      ve paylar ile gümrük beyannamesinin tescil tarihine kadar yapılan diğer giderlerden vergilendirilmeyenlerin toplamıdır.
      Ardiye ücreti istisna kapsamında KDV hesaplanmadan ödendiğinden matraha girer; müşavirlik ücreti üzerinden KDV hesaplandığından
      girmez; tescilden sonraki taşıma ise süre şartını karşılamaz. Matrah = 1.000.000 + 80.000 + 20.000 + 15.000 = 1.115.000
      TL; KDV = 223.000 TL. Püf noktaları: Tescilden önceki giderlerin hepsi değil yalnız “vergilendirilmeyenler” matraha
      girer; Tebliğ, istisna nedeniyle KDV hesaplanmayan ardiye ücretini bu kapsamda örnek verir.'
    celdiriciler:
