  - YMM
  ders: HSV
  unite: KDV konusu mükellefiyet ve vergiyi doğuran olay
  konu: KDV
  kazanim: matrah ve oranlar
  tip: hesaplama
  zorluk: 3
  kok: 'Müteahhit (M) İnşaat A.Ş., KDV mükellefi olmayan ve arsa payını arızi olarak devreden Bay (K) ile arsa payı karşılığı
    inşaat sözleşmesi imzalamıştır. Sözleşme gereği Bay (K)’ya bırakılan 4 konuta ilişkin veriler şöyledir:

    - Konutların arsa payı hariç inşaat maliyeti: 6.000.000 TL

    - Bu konutlara isabet eden genel idare giderleri payı: 400.000 TL

    - Bu konutlara isabet eden arsa payının değeri: 2.000.000 TL

    - Konutların piyasa satış değeri: 9.500.000 TL

    Buna göre (M) İnşaat A.Ş.’nin Bay (K)’ya yaptığı konut teslimine ilişkin KDV matrahı kaç TL’dir?'
  secenekler:
    A: 6.400.000
    B: 6.600.000
    C: 6.720.000
    D: 7.040.000
    E: 9.240.000
  dogru: D
  aciklama:
    dogru_neden: 'KDVK md. 27/6’ya göre arsa karşılığı inşaatta müteahhidin arsa sahibine bıraktığı konutun bedeli, VUK md.
      267/2’deki ikinci sıradaki maliyet bedeli esasına göre belirlenir: maliyet bedeline toptan satışlarda %5, perakende
      satışlarda %10 eklenir. Md. 27/4 gereği genel idare giderlerinden düşen pay maliyete katılır; arsa sahibine kalan konutların
      arsa payı müteahhide devredilmediğinden maliyete eklenmez. Arsa sahibi KDV mükellefi olmadığından teslim perakende niteliğindedir:
      (6.000.000 + 400.000) × 1,10 = 7.040.000 TL. Püf noktaları: Piyasa satış değeri bu hesapta kullanılmaz; arsa sahibinin
      mükellef olup olmaması %5 ile %10 arasındaki seçimi belirler; genel idare gideri payı eklenir, arsa payı eklenmez.'
    celdiriciler:
      A: 6.400.000 TL, maliyete VUK 267/2’deki kâr ilavesi yapılmadan bulunur.
      B: 6.600.000 TL, genel idare gideri payı unutularak 6.000.000 × 1,10 şeklinde hesaplanır; md. 27/4 bu payın katılmasını
        zorunlu kılar.
      C: 6.720.000 TL, %5 (toptan) ilave ile bulunur; KDV mükellefi olmayan arsa sahibine teslim perakende sayılır ve %10
        eklenir.
      E: 9.240.000 TL, arsa payı değerinin de maliyete katılmasıyla (8.400.000 × 1,10) bulunur; arsa sahibine kalan konutların
        arsa payı dikkate alınmaz.
    hesap_adimlari:
    - 'Maliyet bedeli (genel idare gideri payı dahil, arsa payı hariç): 6.000.000 + 400.000 = 6.400.000 TL'
    - Arsa sahibi KDV mükellefi değil → perakende → %10 ilave
    - 'KDV matrahı: 6.400.000 × 1,10 = 7.040.000 TL'
  kaynaklar:
