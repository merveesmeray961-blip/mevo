- id: YMM-HSV-KDV-0035
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV konusu mükellefiyet ve vergiyi doğuran olay
  konu: KDV
  kazanim: matrah ve oranlar
  tip: hesaplama
  zorluk: 2
  kok: İkinci el motorlu kara taşıtı ticareti yetki belgesine sahip (A) Otomotiv Ltd. Şti., KDV mükellefi olmayan Bay (B)’den
    600.000 TL’ye bir ticari araç satın almıştır. Araca yetkili serviste periyodik bakım yaptırılmış ve bu hizmet için 30.000
    TL + 6.000 TL KDV ödenmiştir. Araç, vasfında esaslı bir değişiklik yapılmaksızın KDV hariç 750.000 TL’ye satılmıştır.
    Teslim %20 oranında KDV’ye tabi olduğuna göre, satış nedeniyle hesaplanacak KDV kaç TL’dir?
  secenekler:
    A: '24.000'
    B: '25.000'
    C: '30.000'
    D: '144.000'
    E: '150.000'
  dogru: C
  aciklama:
    dogru_neden: KDVK md. 23/f’ye göre ikinci el motorlu kara taşıtı ticaretiyle iştigal eden mükelleflerce KDV mükellefi
      olmayanlardan alınıp vasfında esaslı değişiklik yapılmadan satılan taşıtlarda matrah, alış bedeli düşüldükten sonra
      kalan tutardır. Periyodik bakım esaslı değişiklik değildir. Matrah 750.000 − 600.000 = 150.000 TL; hesaplanan KDV 150.000
      × %20 = 30.000 TL’dir. Bakım hizmetine ait 6.000 TL KDV ayrıca indirim konusu yapılır; ancak bu, hesaplanan KDV’yi değil
      ödenecek KDV’yi etkiler.
    celdiriciler:
      A: 24.000 TL, bakım bedelinin de matrahtan düşülmesiyle (120.000 × %20) ya da bakım KDV’sinin hesaplanan vergiden mahsup
        edilmesiyle bulunur; özel matrahta yalnız alış bedeli düşülür ve soru hesaplanan KDV’yi sormaktadır.
      B: 25.000 TL, 150.000 TL’lik farkın KDV dahil sanılıp iç yüzdeyle (150.000 × 20/120) ayrıştırılmasıdır; satış bedeli
        KDV hariç verilmiştir.
      D: 144.000 TL, özel matrah uygulanmayıp tam bedel üzerinden hesaplanan vergiden bakım KDV’sinin düşülmesidir; hem matrah
        hem de istenen tutar yanlıştır.
      E: 150.000 TL, periyodik bakımın esaslı değişiklik sayılıp özel matrah uygulanmamasıdır; bakım vasıfta esaslı değişiklik
        oluşturmaz.
    hesap_adimlari:
    - 'Özel matrah: 750.000 − 600.000 = 150.000 TL'
    - 'Hesaplanan KDV: 150.000 × 0,20 = 30.000 TL'
    - Bakım hizmetine ait 6.000 TL KDV indirilecek KDV’dir; hesaplanan tutarı değiştirmez.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 23/f
    alinti: 'f) (Ek: 29/3/2018-7104/6 md.) İkinci el motorlu kara taşıtı veya taşınmaz ticaretiyle iştigal eden mükelleflerce,
      katma değer vergisi mükellefi olmayanlardan (mükellef olanlardan istisna kapsamında yapılan alımlar dâhil) alınarak
      vasfında esaslı değişiklik yapılmaksızın satılan ikinci el motorlu kara taşıtı veya taşınmazların tesliminde matrah,
      alış bedeli düşüldükten sonra kalan tutardır.'
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: III/A-4.9
    alinti: İkinci el motorlu kara taşıtı veya taşınmaz teslimlerinde özel matrah uygulanabilmesi için, araç veya taşınmazın
      basit tadil, bakım ve onarım işlemleri dışında vasfında esaslı değişiklik yapılmaması gerekmektedir.
  gecerlilik:
    baslangic: '2018-06-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (750000 - 600000) * 20 // 100
