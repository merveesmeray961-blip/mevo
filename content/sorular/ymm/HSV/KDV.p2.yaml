  kok: Vergiye tabi bir işlem söz konusu olmadığı hâlde düzenlediği faturada KDV gösteren (S) Ltd. Şti., bu vergiyi beyan
    ederek Hazineye ödemiştir. KDV Kanunu’na göre, bu şekilde yersiz hesaplanıp ödenen verginin (S) Ltd. Şti.’ye iade edilebilmesi
    için aşağıdakilerden hangisi şarttır?
  secenekler:
    A: Alıcının, faturadaki KDV’yi indirim konusu yapmadığını vergi dairesine yazılı olarak bildirmesi
    B: İade talebinin, faturanın düzenlendiği takvim yılı içinde vergi dairesine yapılması
    C: Yalnız işlemle ilgili beyanların düzeltilmesi; verginin alıcıya geri verilmesi aranmaz
    D: Yalnız verginin satıcı tarafından alıcıya geri verilmesi; beyanların düzeltilmesi aranmaz
    E: İşlemle ilgili beyanların düzeltilmesi ve verginin satıcı tarafından alıcıya geri verilmesi
  dogru: E
  aciklama:
