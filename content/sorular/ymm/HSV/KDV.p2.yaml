- id: YMM-HSV-KDV-0036
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV konusu mükellefiyet ve vergiyi doğuran olay
  konu: KDV
  kazanim: verginin konusu ve Türkiye'de yapılma
  tip: uygulama
  zorluk: 2
  kok: 'Aşağıdaki işlemlerden hangileri KDV Kanunu’nun md. 6 ve 7 hükümlerine göre Türkiye’de yapılmış sayılır?

    I. Alman bir firmanın, Hamburg’daki deposunda bulunan malı orada Türk bir alıcıya teslim etmesi

    II. Türkiye’de ikametgâhı, işyeri, kanuni merkezi ve iş merkezi bulunmayan bir mimarlık firmasının yurt dışında çizerek
    Türkiye’de inşa edilecek bir alışveriş merkezi için gönderdiği proje hizmeti

    III. Türk bir nakliye firmasının İstanbul’dan Viyana’ya yaptığı yük taşımasının tamamı

    IV. Türk vatandaşı bir tacirin, Dubai’deki mağazasında bulunan malı orada satıp teslim etmesi

    V. Yabancı uyruklu bir tacirin, İstanbul’daki bir fuarda sergilediği malları fuar alanında satıp teslim etmesi'
  secenekler:
    A: II ve V
    B: I, II ve V
    C: II, III ve V
    D: Yalnız V
    E: II, IV ve V
  dogru: A
  aciklama:
    dogru_neden: KDVK md. 6’ya göre mal teslimlerinde malın teslim anında Türkiye’de bulunması, hizmetlerde ise hizmetin Türkiye’de
      yapılması veya hizmetten Türkiye’de faydalanılması işlemin Türkiye’de yapıldığını gösterir; teslim edenin uyruğu önemsizdir.
      II’de hizmet yurt dışında yapılsa da Türkiye’de faydalanılmaktadır; V’te mal teslim anında Türkiye’dedir. I ve IV’te
      mal teslim anında Türkiye dışındadır. III’te md. 7 gereği yalnız iç parkura isabet eden kısım Türkiye’de yapılmış sayılır;
      taşımanın tamamı sayılmaz.
    celdiriciler:
      B: I’de alıcının Türk olması sonucu değiştirmez; mal teslim anında Türkiye’de değildir.
      C: Uluslararası taşımacılıkta yalnız iç parkura isabet eden kısım Türkiye’de yapılmış sayılır; III taşımanın tamamını
        kapsar.
      D: II’deki hizmetten Türkiye’de faydalanıldığından (md. 6/b) işlem Türkiye’de yapılmış sayılır; iki şartın birlikte
        gerçekleşmesi gerekmez.
      E: Türk vatandaşının Türkiye dışında yaptığı mal teslimi verginin konusuna girmez; ölçüt kişinin uyruğu değil malın
        yeridir.
    hesap_adimlari: []
  kaynaklar:
