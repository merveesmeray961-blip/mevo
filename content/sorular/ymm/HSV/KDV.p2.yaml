    madde: md. 6
    alinti: 'a) Malların teslim anında Türkiye''de bulunmasını, b) (Değişik : 27/1/2000 - 4503/3 md.) Hizmetin Türkiye''de
      yapılmasını veya hizmetten Türkiye''de faydalanılmasını,'
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 7
    alinti: Türkiye ile yabancı ülkeler arasında yapılan taşımacılık ile transit taşıma işlerinde, hizmetin iç parkura isabet
