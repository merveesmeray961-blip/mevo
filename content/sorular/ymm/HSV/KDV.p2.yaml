    madde: md. 27/4
    alinti: 4. Katma değer vergisi uygulaması bakımından emsal bedelin tayininde genel idare giderleri ve genel giderlerden
      mamule düşen hissenin bedele katılması mecburidir.
  - mevzuat: KDV Genel Uygulama Tebliği
