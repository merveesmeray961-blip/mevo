      Fazla veya yersiz hesaplanıp Hazineye ödenen vergi işlemi yapan mükellefe iade edilir; ancak iade için işlemle ilgili
      beyanların düzeltilmesi ve verginin satıcı tarafından alıcıya geri verilmesi birlikte aranır.
    celdiriciler:
      A: Kanun alıcının bildirimini değil, beyanların düzeltilmesini ve verginin alıcıya geri verilmesini şart koşar.
      B: Md. 8/2’de böyle bir başvuru süresi öngörülmemiştir.
      C: İki şarttan yalnız birini içerir; verginin alıcıya geri verilmesi de şarttır.
