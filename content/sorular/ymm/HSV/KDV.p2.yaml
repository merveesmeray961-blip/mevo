    alinti: Ayrıca, arsa sahibine kalacak konut veya işyerlerine ilişkin arsa payının müteahhide devri söz konusu olmadığından,
      arsa sahibine bırakılacak konut veya işyerlerinin maliyet bedelinin tespitinde arsa payı dikkate alınmayacaktır.
  - mevzuat: KDV Genel Uygulama Tebliği
