  konu: KDV
  kazanim: vergiyi doğuran olay
  tip: uygulama
  zorluk: 3
  kok: '3065 sayılı KDV Kanunu''nun vergiyi doğuran olaya ilişkin hükümlerine göre aşağıdaki öncülleri değerlendiriniz.


    I. Bir taşınmazın kira sözleşmesiyle kiraya verilmesinde vergiyi doğuran olay, sözleşmenin imzalandığı andır.

    II. Devamlılık arz eden hizmetlerde her fatura dönemine ilişkin hizmet tamamlandıkça vergiyi doğuran olay gerçekleşir.

    III. İthalatta vergiyi doğuran olay, gümrük beyannamesinin tescil tarihidir.


    Yukarıdakilerden hangileri doğrudur?

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve II
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 'II: KDVK md. 10/b''ye göre devamlı hizmetlerde her fatura dönemine ait vergiyi doğuran olay, o dönem hizmetinin
      tamamlanmasıyla gerçekleşir. III: KDVK md. 10/d uyarınca ithalatta vergiyi doğuran olay gümrük beyannamesinin tescil
      tarihidir. I yanlıştır: kira hizmetlerinde vergiyi doğuran olay kira süresine ait tahakkukla gerçekleşir, sözleşmenin
      imzalanmasıyla değil. Püf noktaları: İthalatta gümrük beyannamesi tescili vergiyi doğuran andır; kira sözleşmesinin
      imzası vergiyi doğurmaz.'
    celdiriciler:
      A: I yanlıştır; kira hizmetlerinde vergiyi doğuran olay sözleşme imzası değil, kira dönemine ait tahakkuktur.
      B: III de doğrudur; sadece II doğrudur demek eksik kalır.
      C: II de doğrudur; sadece III doğrudur demek eksik kalır.
      D: I yanlıştır; sözleşme imzasında vergiyi doğuran olay gerçekleşmez.
