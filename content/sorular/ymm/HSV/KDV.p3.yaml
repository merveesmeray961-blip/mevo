  - YMM
  ders: HSV
  unite: KDV konusu mükellefiyet ve vergiyi doğuran olay
  konu: KDV
  kazanim: verginin konusu ve Türkiye'de yapılma
  tip: kavrama
  zorluk: 3
  kok: '3065 sayılı KDV Kanunu''na göre aşağıdaki işlemlerden hangisi Türkiye''de yapılmış sayılır ve KDV''ye tabidir?

    '
  secenekler:
    A: Türkiye'de mukim olmayan bir yabancı firmanın, yurt dışındaki fabrikasında ürettiği ve hiç Türkiye'ye girmeden Almanya'ya
      gönderdiği makine teslimi.
    B: Türkiye'de ikametgâhı bulunmayan (R) GmbH'nin, Münih'teki ofisinden Türkiye'deki (T) A.Ş.'ye sunduğu yazılım danışmanlığı;
      hizmetten Türkiye'de faydalanılmaktadır.
    C: Türk ihracatçısının Romanya'da mukim müşterisine Romanya'daki deposundan teslim ettiği ve gümrükten geçmeden Romanya
      içinde kalan ürünler.
    D: Türkiye'de işyeri bulunmayan bir Japon firmasının Japonya'da verdiği ve Japonya'daki alıcının kendi tesisinde faydalandığı
      mühendislik hizmeti.
    E: Türkiye'de yerleşik satıcının Türkiye'den Irak'a ihraç ettiği ve gümrük çıkış belgesi tamamlanmış mal teslimleri.
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 6/b uyarınca hizmetlerde ''Türkiye''de yapılma'' kriteri, hizmetin Türkiye''de yapılması veya hizmetten
      Türkiye''de faydalanılmasıdır. (R) GmbH''nin hizmetinden Türkiye''deki (T) A.Ş. yararlanmaktadır; bu nedenle hizmet
      Türkiye''de yapılmış sayılır ve KDV''ye tabidir. Püf noktaları: Hizmetin yurt dışında ifa edilmesi yeterli değildir;
      faydalanma yerinin Türkiye olması Türkiye''de yapılma için yeterlidir.'
    celdiriciler:
      A: Mal teslimleri için Türkiye'de yapılma kriteri md. 6/a uyarınca malın teslim anında Türkiye'de bulunmasıdır; söz
        konusu mal hiç Türkiye'ye girmediğinden işlem Türkiye dışında gerçekleşmiştir.
      C: Romanya'daki depodan yapılan ve Türkiye sınırlarına girmeyen teslimde mal teslim anında Türkiye'de bulunmamaktadır;
        md. 6/a kapsamında Türkiye'de yapılmış sayılmaz.
      D: Hizmetten Japonya'daki alıcının kendi tesisinde faydalanılmaktadır; hizmet Türkiye'de yapılmış sayılmaz.
      E: İhracat istisnası (md. 11) kapsamında olan bu teslimler vergiye tabi olmakla birlikte ihracat istisnası nedeniyle
        %0 oranında vergilendirilir; KDV hesaplanmaz.
