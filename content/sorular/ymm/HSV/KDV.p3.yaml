  kok: '3065 sayılı KDV Kanunu''na göre mükellef ve sorumlulukla ilgili aşağıdaki ifadelerden hangisi **YANLIŞTIR?**

    '
  secenekler:
    A: Türkiye'de ikametgâhı, işyeri, kanuni merkezi ve iş merkezi bulunmayanların Türkiye'deki işlemlerinde vergi, bu işlemlere
      muhatap olan alıcılar tarafından sorumlu sıfatıyla beyan edilip ödenir.
    B: Mükellef, KDV'yi yükleniciye yansıtma hakkına sahip olsa da vergi dairesine karşı sorumlu olan kişi her zaman mükelleftir.
    C: Konsinyasyon suretiyle yapılan satışlarda mükellef, malı konsinyatöre teslim eden kişidir; malın konsinyatör tarafından
      nihai alıcıya satıldığı an vergiyi doğuran olay gerçekleşir.
    D: Sorumlu sıfatıyla KDV beyan etmek zorunda olan alıcı, ödediği bu vergiyi kendi KDV beyannamesinde indirim konusu yapabilir.
    E: Vergi kesintisi yapmakla sorumlu tutulan alıcı, satıcı adına devlet ile satıcı arasına girerek vergiyi doğrudan Hazine'ye
      öder.
  dogru: C
  aciklama:
    dogru_neden: 'Konsinyasyon suretiyle yapılan satışlarda KDVK md. 10/c''ye göre vergiyi doğuran olay, malın konsinyatör
      tarafından nihai alıcıya satıldığı andır; mükellef ise konsinyatördür, malı konsinyatöre teslim eden kişi değildir.
      Bu nedenle C şıkkı yanlıştır. Püf noktaları: Konsinyasyonda vergiyi doğuran olay nihai satış anıdır; mükellefiyet konsinyatöre
      aittir.'
    celdiriciler:
      A: KDVK md. 9/1 uyarınca doğrudur; ikametgâhı, işyeri, kanuni merkezi ve iş merkezi Türkiye'de bulunmayanların işlemlerinde
        sorumluluk alıcıya geçer.
      B: Doğrudur; KDV yansıtma hakkı özel hukuk ilişkisini kapsar, Hazine'ye karşı sorumluluk her zaman mükellefte kalır.
      D: Doğrudur; sorumlu sıfatıyla ödenen KDV md. 29/1 çerçevesinde indirim konusu yapılabilir.
      E: Doğrudur; sorumlu, devlet ile asıl mükellef arasına girerek vergiyi Hazine'ye öder.
