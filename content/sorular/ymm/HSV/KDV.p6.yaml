  kok: 3065 sayılı KDV Kanunu md. 1 ve md. 8'e göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Profesyonel sanatçıların yer aldığı konserlerin tertiplenmesi KDV'ye tabidir ve mükellef, bunları tertipleyenler veya
      gösterenlerdir.
    B: Her türlü şans ve talih oyunlarının tertiplenmesi ve oynanması KDV'ye tabidir ve mükellef, oyunları tertip edenlerdir.
    C: Boru hattı ile hampetrol, gaz ve bunların ürünlerinin taşınması KDV'ye tabi işlemlerdendir.
    D: Bir faaliyetin kanunların veya resmî makamların gösterdiği gerek üzerine yapılması, vergilendirmeye engel olur.
    E: Üniversitelere ait veya bunlarca işletilen müesseselerin ticari nitelikteki teslim ve hizmetleri KDV'ye tabidir.
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 1/son fıkralarına göre faaliyetlerin kanunların veya resmî makamların gösterdiği gerek üzerine yapılması,
      işlemlerin mahiyetini değiştirmez ve vergilendirmeye mani teşkil etmez. Bu nedenle D seçeneği yanlıştır. Diğer seçenekler
      md. 1/3-c, 8/1-g, 1/3-b, 8/1-e, 1/3-e ve 1/3-g hükümleriyle uyumludur.
    celdiriciler:
      A: Md. 1/3-c ve 8/1-g uyarınca doğrudur.
      B: Md. 1/3-b ve 8/1-e uyarınca doğrudur.
      C: Md. 1/3-e uyarınca doğrudur.
      E: Md. 1/3-g uyarınca doğrudur.
    hesap_adimlari: []
