    (R) A.Ş., stoklarındaki ve emsal bedeli de 60.000 TL (KDV hariç) olan bir makineyi (P)'ye vermiştir. Taraflar arasında
    başka bir ödeme yapılmamış, her iki taraf da gerçek usulde KDV mükellefidir ve her iki işlem %20 KDV oranına tabidir.
    Soruda işlemlere ait faturaların usulüne uygun düzenlendiği ve işlemlerin hiçbirinin istisna kapsamında olmadığı kabul
    edilecektir. (P) ve (R) tarafından bu işlemler nedeniyle hesaplanacak toplam KDV kaç TL'dir?
  secenekler:
    A: 0,00
    B: 12.000,00
    C: 24.000,00
    D: 36.000,00
    E: 48.000,00
  dogru: C
  aciklama:
    dogru_neden: 'KDVK md. 4/2''ye göre bir hizmetin karşılığının mal teslimi olması hâlinde bunların her biri ayrı işlemdir
      ve hizmet ile teslim hükümlerine göre ayrı ayrı vergilendirilir. Md. 20/2''ye göre bedel; karşılık olarak sağlanan mal,
      hizmet ve değerlerin toplamıdır. (P) 60.000 TL matrah üzerinden 12.000 TL, (R) de makine teslimi için 60.000 TL matrah
      üzerinden 12.000 TL KDV hesaplar; toplam 24.000 TL''dir. Her taraf kendi hesapladığını beyan eder, diğerinden yüklendiği
      KDV''yi indirim konusu yapar. Püf noktaları: (1) Takas hâlinde işlem “net” edilmez, iki ayrı işlemde iki ayrı KDV hesaplanır.
      (2) Soru “toplam hesaplanan KDV”yi sorduğundan indirimler hesaba katılmaz; ödenecek net KDV''yi sorsaydı her taraf için
      hesaplanan ve indirilecek KDV birbirini götürürdü.'
