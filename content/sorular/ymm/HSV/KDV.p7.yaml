  kok: (X) A.Ş., 2 Mart 2026'da (Y) Ltd. Şti.'ne 100.000 TL + KDV bedelle bir parti malı satmış; (Y) aynı gün bu malı (Z)
    A.Ş.'ne 120.000 TL + KDV bedelle satmıştır. Mal, (X)'in deposundan (Z)'nin deposuna doğrudan sevk edilmiş ve (Y)'nin eline
    hiç geçmemiştir. Üç şirket de gerçek usulde KDV mükellefidir, KDV oranı %20'dir ve (Y)'nin başka işlemi yoktur. Üç işlemde
    de faturalar usulüne uygun düzenlenmiş ve KDV'ler faturalarda ayrıca gösterilmiştir. (Y)'nin bu işlemler nedeniyle Mart
    2026 dönemine ilişkin beyannamesinde ödeyeceği KDV kaç TL'dir?
  secenekler:
    A: 0,00
    B: 4.000,00
    C: 20.000,00
    D: 24.000,00
    E: 44.000,00
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 2/2''ye göre bir mal üzerindeki tasarruf hakkı zincirleme akitle malın el değiştirmeden doğrudan
      sonuncu kişiye devredilmesi hâlinde aradaki safhaların her biri ayrı bir teslimdir. Bu nedenle (Y) hem alıcı hem satıcı
      sıfatıyla KDV mükellefi olur: hesaplanan KDV 120.000 × %20 = 24.000 TL, indirilecek KDV 100.000 × %20 = 20.000 TL, ödenecek
      KDV 4.000 TL''dir.'
    celdiriciler:
      A: Zincirleme akitte aradaki safhaların tek teslim sayıldığı varsayılmıştır; oysa md. 2/2 her safhayı ayrı teslim sayar
        ve (Y) satışı nedeniyle KDV hesaplar.
      C: Yalnızca (X)'in (Y)'ye yaptığı satışa ilişkin KDV (20.000 TL) esas alınmıştır; (Y)'nin kendi satışındaki hesaplanan
        KDV'den indirim yapılmamıştır.
      D: Yalnızca (Y)'nin hesapladığı KDV (24.000 TL) alınmış, (X)'ten yüklenilen 20.000 TL KDV indirim konusu yapılmamıştır.
      E: Yüklenilen ve hesaplanan KDV toplanmıştır (20.000 + 24.000); oysa yüklenilen KDV hesaplanan KDV'den indirilir, toplanmaz.
    hesap_adimlari:
    - (Y)'nin alış bedeli 100.000 TL; yüklenilen KDV = 100.000 × 0,20 = 20.000 TL
    - (Y)'nin satış bedeli 120.000 TL; hesaplanan KDV = 120.000 × 0,20 = 24.000 TL
    - Ödenecek KDV = 24.000 − 20.000 = 4.000 TL
