      B: Takas edilen işlemler tek işlem sayılıp yalnızca bir tarafın KDV'si (12.000 TL) alınmıştır; her iki işlem de ayrı
        ayrı vergilenir.
      D: Üç ayrı işlem varmış gibi 3 × 12.000 = 36.000 TL bulunmuştur; oysa md. 4/2 yalnızca hizmeti ve karşılığındaki mal
        teslimini, yani iki işlemi ayrı vergilendirir.
      E: Her işlem için hem hizmet hem mal bedeli matraha katılmış gibi (2 × 120.000 × %20 = 48.000 TL) hesap yapılmıştır;
        md. 20/2 gereği her işlemin matrahı kendi bedeli olan 60.000 TL'dir.
    hesap_adimlari:
    - '(P)''nin hizmeti: 60.000 × 0,20 = 12.000 TL KDV'
    - '(R)''nin makine teslimi: 60.000 × 0,20 = 12.000 TL KDV'
    - Toplam hesaplanan KDV = 12.000 + 12.000 = 24.000 TL
