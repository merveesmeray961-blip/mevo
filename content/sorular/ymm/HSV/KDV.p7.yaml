- id: YMM-HSV-KDV-0092
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV konusu mükellefiyet ve vergiyi doğuran olay
  konu: KDV
  kazanim: kısım kısım mal teslimi ve vergiyi doğuran olay
  tip: hesaplama
  zorluk: 2
  kok: 'Gerçek usulde aylık KDV mükellefi (T) A.Ş., bir müşterisine sözleşmeye göre mutat olduğu üzere üç kısımda mal teslim
    etmiştir. Birim satış bedeli 1.000 TL + KDV''dir (KDV oranı %20). Teslimler ve faturalar şöyledir:


    | Kısım | Teslim edilen miktar | Teslim tarihi | Fatura tarihi |

    |---|---|---|---|

    | 1. kısım | 300 birim | 25 Nisan 2026 | 5 Mayıs 2026 |

    | 2. kısım | 500 birim | 28 Mayıs 2026 | 5 Haziran 2026 |

    | 3. kısım | 400 birim | 2 Haziran 2026 | 5 Temmuz 2026 |


    Teslimlerden önce düzenlenmiş herhangi bir fatura veya belge yoktur. (T)''nin Mayıs 2026 dönemine ilişkin beyannamesinde
    bu satışlar nedeniyle hesaplanacak KDV kaç TL''dir?'
  secenekler:
    A: 60.000,00
    B: 80.000,00
    C: 100.000,00
    D: 160.000,00
    E: 240.000,00
  dogru: C
  aciklama:
    dogru_neden: 'KDVK md. 10/c''ye göre kısım kısım mal teslimi mutat olan veya bu hususta mutabık kalınan hâllerde vergiyi
      doğuran olay her bir kısmın teslimidir. Teslimden önce fatura düzenlenmediğinden fatura tarihleri vergiyi doğuran olayı
      belirlemez. Mayıs 2026''da yalnızca 2. kısım (28 Mayıs) teslim edilmiştir: 500 × 1.000 = 500.000 TL matrah; KDV = 500.000
      × %20 = 100.000 TL''dir. 1. kısım Nisan, 3. kısım Haziran dönemine aittir.'
    celdiriciler:
      A: Mayıs ayında düzenlenen faturaya (1. kısım, 300 birim) göre hesaplanmıştır (300.000 × %20 = 60.000 TL); oysa fatura
        teslimden sonra düzenlendiğinden vergiyi doğuran olay teslim tarihidir.
      B: 3. kısım (400 birim) Mayıs'a alınmıştır (80.000 TL); 3. kısım 2 Haziran'da teslim edildiğinden Haziran dönemine aittir.
      D: Mayıs ayına 1. ve 2. kısım birlikte alınmıştır (800.000 × %20 = 160.000 TL); 1. kısım 25 Nisan'da teslim edildiğinden
        Nisan dönemine aittir.
      E: Üç kısmın tamamı Mayıs'a alınmıştır (1.200.000 × %20 = 240.000 TL); her kısım kendi teslim döneminde vergilendirilir.
    hesap_adimlari:
    - 'Mayıs 2026''da teslim edilen kısım: 2. kısım, 500 birim'
    - Matrah = 500 × 1.000 = 500.000 TL
    - KDV = 500.000 × 0,20 = 100.000 TL
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
