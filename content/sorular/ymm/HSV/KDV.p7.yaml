    verilmiştir:


    I. Bir vakfın kurup işlettiği müessesenin ticari nitelikteki teslim ve hizmetleri

    II. Amatör sporcuların katıldığı okullar arası bir turnuvanın tertiplenmesi

    III. İzinli olarak tertiplenen bir şans oyununun tertiplenmesi ve oynanması

    IV. Profesyonel sanatçıların yer aldığı bir konserin tertiplenmesi


    Bu işlemlerden hangileri KDV''nin konusuna girer?'
  secenekler:
    A: Yalnız I
    B: I ve IV
    C: II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 1/3-b şans ve talih oyunlarının tertiplenmesi ve oynanmasını (III), md. 1/3-c profesyonel sanatçıların
      yer aldığı gösteri ve konserlerin tertiplenmesini (IV), md. 1/3-g ise dernek ve vakıflar tarafından kurulan veya işletilen
      müesseselerin ticari, sınai, zirai ve mesleki nitelikteki teslim ve hizmetlerini (I) KDV'ye tabi kılar. Md. 1/3-c yalnız
      profesyonel sporcuların katıldığı faaliyetleri kapsadığından amatör sporcuların turnuvası (II) kapsam dışındadır.
    celdiriciler:
      A: Yalnız I ifadesi eksiktir; şans oyunları (md. 1/3-b) ve profesyonel sanatçıların konseri (md. 1/3-c) de KDV'nin konusuna
        girer.
      B: III. ifade unutulmuştur; şans ve talih oyunlarının tertiplenmesi ve oynanması md. 1/3-b uyarınca KDV'ye tabidir.
      C: II kapsam dışıdır (md. 1/3-c yalnız profesyonel sporcuları sayar) ve seçenek kapsama giren I ile IV'ü dışarıda bırakmaktadır.
      E: II. ifade yanlış dahil edilmiştir; amatör sporcuların katıldığı turnuva md. 1/3-c'deki “profesyonel sporcular” şartını
        taşımaz.
