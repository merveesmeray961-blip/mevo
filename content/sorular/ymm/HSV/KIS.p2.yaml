- id: YMM-HSV-KIS-0020
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: indirim (md.29-30)
  tip: uygulama
  zorluk: 2
  kok: '(B) A.Ş.’nin alış belgelerine ilişkin bilgiler aşağıdadır. Her belge, belirtilen tarihte kanuni defterlere kaydedilmiş
    ve KDV aynı dönemin beyannamesinde indirim konusu yapılmıştır.

    I. Vergiyi doğuran olayı Kasım 2025’te gerçekleşen alışa ait fatura, Ocak 2026’da kaydedilmiştir.

    II. Vergiyi doğuran olayı Aralık 2025’te gerçekleşen alışa ait fatura, Aralık 2026’da kaydedilmiştir.

    III. Vergiyi doğuran olayı Aralık 2025’te gerçekleşen alışa ait fatura, Şubat 2027’de kaydedilmiştir.

    IV. Vergiyi doğuran olayı Ocak 2025’te gerçekleşen alışa ait fatura, Kasım 2026’da kaydedilmiştir.

    KDVK md. 29/3’e göre hangi belgelerdeki KDV’nin indirimi yerindedir?'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: KDVK md. 29/3’e göre indirim hakkı, vergiyi doğuran olayın vuku bulduğu takvim yılını takip eden takvim yılı
      aşılmamak şartıyla, belgelerin kanuni defterlere kaydedildiği dönemde kullanılır. I, II ve IV’te vergiyi doğuran olay
      2025’te olup kayıt 2026’dadır; süre aşılmamıştır. IV’te aradan 22 ay geçmesi sonucu değiştirmez; ölçüt ay sayısı değil
      takvim yılıdır. III’te kayıt 2027’de yapıldığından indirim hakkı kullanılamaz.
    celdiriciler:
      A: IV’te vergiyi doğuran olay 2025’te, kayıt izleyen yıl olan 2026’dadır; süre “12 ay” değil “izleyen takvim yılı sonu”dur.
      B: III’te kayıt, vergiyi doğuran olayın yılını izleyen takvim yılını (2026) aştığından indirim yapılamaz.
      C: I’de kayıt izleyen yılın Ocak ayında yapılmıştır ve indirim yerindedir.
      D: III’te süre aşılmıştır; indirim hakkı 2026 sonuyla sınırlıdır.
    hesap_adimlari: []
  kaynaklar:
