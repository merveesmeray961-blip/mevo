- id: YMM-HSV-KIS-0021
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: tevkifat
  tip: hesaplama
  zorluk: 2
  kok: 'KDV mükellefi (K) Ltd. Şti.’nin payları borsada işlem görmemektedir ve şirket KDV Genel Uygulama Tebliği’ndeki belirlenmiş
    alıcılar arasında yer almamaktadır. Şirket Mart 2026’da aşağıdaki hizmetleri satın almıştır:

    - Üretim faaliyetinde çalıştırılmak üzere işgücü temin hizmeti: 400.000 TL + KDV

    - Yönetim danışmanlığı hizmeti: 250.000 TL + KDV

    Hizmetlerin tamamı %20 oranında KDV’ye tabidir ve her işlemin bedeli tevkifat için öngörülen sınırı aşmaktadır. Buna göre
    (K) Ltd. Şti.’nin sorumlu sıfatıyla 2 No.lu KDV Beyannamesi ile beyan edeceği KDV kaç TL’dir?'
  secenekler:
    A: '0'
    B: '40.000'
    C: '45.000'
    D: '72.000'
    E: '130.000'
  dogru: D
  aciklama:
    dogru_neden: 'İşgücü temin hizmetlerinde tevkifat, Tebliğin (I/C-2.1.3.1) bölümündeki hem (a) grubu KDV mükelleflerince
      hem de (b) grubu belirlenmiş alıcılarca 9/10 oranında yapılır. Danışmanlık hizmetlerinde ise tevkifatı yalnız (b) grubu
      belirlenmiş alıcılar yapar. (K) Ltd. Şti. belirlenmiş alıcı olmadığından danışmanlık hizmetinde tevkifat yoktur. Tevkif
      edilecek KDV: 400.000 × %20 × 9/10 = 72.000 TL.'
    celdiriciler:
      A: Kısmi tevkifatın yalnız belirlenmiş alıcılarca yapıldığı varsayımıdır; işgücü temin hizmetinde KDV mükellefleri de
        tevkifat yapar.
      B: 40.000 TL, işgücü temin hizmetine 5/10 oranı uygulanarak bulunur; bu hizmette oran 9/10’dur.
      C: 45.000 TL, danışmanlık hizmetine 9/10 tevkifat uygulayıp işgücü temin hizmetini atlamaktır; uygulama tam tersidir.
      E: 130.000 TL, iki hizmetin KDV’sinin tamamının tevkif edilmesidir; işgücü temininde kısmi (9/10) tevkifat vardır, danışmanlıkta
        ise bu alıcı için tevkifat yoktur.
    hesap_adimlari:
    - 'İşgücü temini KDV’si: 400.000 × 0,20 = 80.000 TL'
    - 'Tevkifat (9/10): 80.000 × 9/10 = 72.000 TL (2 No.lu beyanname)'
    - 'Danışmanlık: alıcı belirlenmiş alıcı olmadığından tevkifat yok; 50.000 TL KDV’yi satıcı 1 No.lu beyannameyle beyan
      eder.'
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: I/C-2.1.3.2.5.1
    alinti: Tebliğin (I/C-2.1.3.1/a ve b) bölümünde sayılanlara, faaliyetlerinin yürütülmesi ile ilgili işlemlerde kullanılan
      işgücünün sağlanması şeklinde verilen hizmetlerde (işgücü temin hizmeti alımlarında), alıcılar tarafından (9/10) oranında
      KDV tevkifatı uygulanır.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: I/C-2.1.3.2.2.1
    alinti: Tebliğin (I/C-2.1.3.1/b) ayırımında sayılanlara karşı ifa edilen etüt, plan-proje, danışmanlık, denetim ve benzeri
      hizmetlerde alıcılar tarafından (9/10) oranında KDV tevkifatı uygulanır.
  gecerlilik:
    baslangic: '2014-05-01'
    bitis: null
    yila_bagli_tutar: false
