  kok: 'İhracatçı (İ) Dış Ticaret A.Ş., imalatçıdan KDVK md. 11/1-c kapsamında ihraç kaydıyla 1.500.000 TL’ye satın aldığı
    malları aynı dönemde 2.000.000 TL’ye ihraç etmiştir. Dönemde başka bir işlemi yoktur. Bu ihracatla ilgili olarak yüklendiği
    KDV şöyledir:

    - Genel imal ve genel idare giderlerinden ihracata isabet eden pay: 55.000 TL

    - İhracatta kullanılan ATİK’lerden ihracata verilebilecek pay: 60.000 TL

    Genel KDV oranı %20’dir ve yüklenilen tutarların tamamı indirim yoluyla giderilememiştir. Buna göre şirketin bu dönemde
    iadesini talep edebileceği azami KDV kaç TL’dir?'
  secenekler:
    A: '55.000'
    B: '100.000'
    C: '115.000'
    D: '300.000'
    E: '400.000'
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğe göre ihraç kaydıyla mal alan ihracatçı, ödemediği KDV’nin iadesini talep edemez; yalnız genel giderler
      ve ATİK’ler nedeniyle yüklendiği KDV için iade isteyebilir. Bu tutar, ihracat bedeli ile ihraç kaydıyla teslim bedeli
      arasındaki farka genel oran uygulanarak bulunan tutarı aşamaz: (2.000.000 − 1.500.000) × %20 = 100.000 TL. Önce genel
      giderlerden isabet eden pay (55.000 TL) dikkate alınır; azami tutara kadar kalan 45.000 TL kadar ATİK KDV’sinden pay
      verilir. Yüklenilen toplam 115.000 TL sınırı aştığından iade 100.000 TL’dir. Püf noktaları: Sınır ihracat bedelinin
      tamamı üzerinden değil, KDV’siz alım bedeli düşülerek hesaplanır; ATİK payı en son sırada verilir ve sınırla kesilir.'
    celdiriciler:
      A: 55.000 TL, ATİK’lerden hiç pay verilmemesidir; genel gider payı azami tutarın altında kaldığından aradaki fark kadar
        ATİK payı verilebilir.
      C: 115.000 TL, yüklenilen KDV’nin tamamıdır; azami iade edilebilir tutar (100.000 TL) aşılamaz.
      D: 300.000 TL, ihraç kaydıyla alıma ait ve ödenmeyen KDV’nin (1.500.000 × %20) iade edileceğini varsaymaktır; ödenmeyen
        vergi iade edilmez.
      E: 400.000 TL, azami tutarın ihracat bedelinin tamamı üzerinden hesaplanmasıdır; ihraç kaydıyla alım bedeli düşülmelidir.
    hesap_adimlari:
    - 'Azami iade: (2.000.000 − 1.500.000) × 0,20 = 100.000 TL'
    - 'Genel gider payı: 55.000 TL'
    - 'ATİK’ten verilebilecek pay: min(60.000; 100.000 − 55.000) = 45.000 TL'
    - 'İade: 55.000 + 45.000 = 100.000 TL'
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-1.3
    alinti: 3065 sayılı Kanunun (11/1-c) ve geçici 17 nci maddeleri kapsamında ihraç kaydıyla mal alan ihracatçının ödemediği
      KDV’yi iade olarak talep etmesi mümkün olmayıp, varsa genel giderler ve ATİK’ler nedeniyle iade talep etmesi mümkündür.
