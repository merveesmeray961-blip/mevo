  kok: (Z) A.Ş., VUK uyarınca belirlenen faydalı ömrü 5 yıl olan bir makineyi 1 Mart 2023’te satın alıp aynı gün kullanmaya
    başlamış ve alımda ödediği 80.000 TL KDV’nin tamamını indirim konusu yapmıştır. Makine 25 Ağustos 2025’te çıkan yangında
    zayi olmuştur; yangın, Bakanlıkça mücbir sebep ilan edilen bir yangın değildir. Buna göre şirketin zayi döneminde “daha
    önce indirim konusu yapılan KDV’nin ilavesi” olarak beyan etmesi gereken tutar kaç TL’dir?
  secenekler:
    A: '0'
    B: '32.000'
    C: '40.000'
    D: '48.000'
    E: '80.000'
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 30/c’ye göre deprem, sel ve mücbir sebep ilan edilen yerlerdeki yangın dışında zayi olan mallara
      ait KDV indirilemez. Ancak amortismana tabi iktisadi kıymet faydalı ömrünü tamamlamadan zayi olursa, yüklenilen KDV’nin
      kullanılan süreye isabet eden kısmı indirilebilir; kalan kısım indirim hesaplarından çıkarılır. Tebliğe göre kullanılan
      sürenin hesabında her 12 ay ile 12 aydan kısa süreler bir yıl sayılır. 1.3.2023–25.8.2025 arası 29 ay 24 gündür; bu
      süre 12 + 12 + kesir şeklinde 3 yıl kabul edilir. Kullanılmayan 2 yıla isabet eden 80.000 × 2/5 = 32.000 TL ilave edilir.
      Püf noktaları: Mücbir sebep ilan edilmemiş yangın 30/c’deki istisnaya girmez. Süre ay ya da gün kıstıyla değil, 12 aylık
      dilimler hâlinde ve kesir yukarı yuvarlanarak hesaplanır.'
    celdiriciler:
      A: Mücbir sebep ilan edilmemiş yangın md. 30/c’deki istisnaya girmez; faydalı ömrü dolmadan zayi olan kıymette kalan
        süreye ilişkin düzeltme yapılır.
      C: 40.000 TL, süreyi aylık kıstla (yaklaşık 30 ay kullanılmış, 30 ay kalmış) hesaplamaktır; Tebliğ 12 aydan kısa süreleri
        tam yıl sayar.
      D: 48.000 TL, yalnız tamamlanmış 2 yılı kullanılmış sayıp 3 yılı kalan kabul etmektir; 12 aydan kısa süre de bir yıl
        sayılır.
      E: 80.000 TL, zayi olan ATİK’in tüm KDV’sinin geri alınmasıdır; kullanılan süreye isabet eden kısım için düzeltme yapılmaz.
    hesap_adimlari:
    - 'Kullanım süresi: 1.3.2023–25.8.2025 = 29 ay 24 gün → 3 yıl (her 12 ay ve kesri bir yıl)'
    - 'Kullanılmayan süre: 5 − 3 = 2 yıl'
    - 'İlave edilecek KDV: 80.000 × 2/5 = 32.000 TL'
