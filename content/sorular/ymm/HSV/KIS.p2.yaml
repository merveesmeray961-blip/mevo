  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: ihracat ve hizmet ihracı istisnası
  tip: uygulama
  zorluk: 2
  kok: 'Türkiye’de yerleşik mükelleflerin aşağıdaki hizmetlerinden hangileri KDVK md. 11/1-a ve 12/2 kapsamında hizmet ihracı
    istisnasına girer?

    I. (M) Mimarlık Ltd. Şti.’nin, Gürcistan’daki bir firmaya Tiflis’te inşa edilecek otelin projesini çizmesi

    II. (A) A.Ş.’nin, Fransa’daki bir firmanın Türkiye’den satın aldığı seramik ürünlerin tedarikine aracılık ederek komisyon
    alması

    III. (B) A.Ş.’nin, Kore’deki bir üreticinin elektronik ürünlerine Türkiye’de alıcı bulması; faturanın Kore firması adına
    düzenlenmesi ve komisyonun döviz olarak Türkiye’ye getirilmesi

    IV. (C) Ltd. Şti.’nin, İstanbul’daki serbest bölgede faaliyet gösteren bir firmaya muhasebe hizmeti vermesi'
  secenekler:
    A: I ve II
    B: I, II ve III
    C: I, II ve IV
    D: Yalnız I
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: Hizmet ihracı için hizmetin yurt dışındaki müşteri için yapılması ve hizmetten yurt dışında faydalanılması
      gerekir. Tebliğe göre faydalanma, hizmetin müşterinin yurt dışındaki faaliyetleriyle ilgili olması demektir. I’de proje
      yurt dışındaki yatırım içindir. II’de aracılık, yabancı firmanın Türkiye’den ithal ettiği (Türkiye’nin ihraç ettiği)
      mallarla ilgilidir; bu nedenle istisnadır. III’te müşteri bulma hizmetinden Türkiye’de faydalanılır; fatura ve dövizin
      yurda getirilmesi sonucu değiştirmez. IV’te Tebliğ, serbest bölgelere verilen hizmetleri hizmet ihracı saymaz.
    celdiriciler:
      B: III’te yabancı firmanın mallarına Türkiye’de müşteri bulunması hizmetinden Türkiye’de faydalanılır; faturanın yabancı
        adına düzenlenmesi yeterli değildir.
      C: Türkiye’den serbest bölgelere verilen hizmetler hizmet ihracı kapsamında değerlendirilmez.
      D: II’deki aracılık, Türkiye’nin ihraç ettiği mallarla ilgili olduğundan hizmet ihracıdır.
      E: III ve IV’te faydalanma şartı veya müşterinin konumu bakımından istisna şartları yoktur.
    hesap_adimlari: []
  kaynaklar:
