- id: YMM-HSV-KIS-0023
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: diğer istisnalar (KDVK md.13-17)
  tip: kavrama
  zorluk: 3
  kok: 'KDVK md. 13’teki istisnalarla ilgili aşağıdaki ifadeleri değerlendiriniz.

    I. (i) bendi kapsamında konut satın alan yabancı uyruklu gerçek kişi konutu teslimden iki yıl sonra satarsa, zamanında
    tahsil edilmeyen vergi tecil faiziyle birlikte tapu işleminden önce elden çıkaran tarafından ödenir.

    II. (m) bendi kapsamında Ar-Ge merkezine teslim edilen yeni makine süresi içinde Ar-Ge faaliyetleri dışında kullanılırsa,
