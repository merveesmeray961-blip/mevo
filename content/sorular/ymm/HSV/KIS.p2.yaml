    Dış Ticaret A.Ş.’ye teslim etmiştir. Mücbir sebep bulunmadığına ve ek süre alınmadığına göre, tecil edilen verginin terkin
    edilebilmesi için malların en geç hangi tarihe kadar ihraç edilmesi gerekir?
