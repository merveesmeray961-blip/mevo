  zorluk: 3
  kok: '3065 sayılı KDV Kanunu md. 11 ve 12''ye göre hizmet ihracı istisnasının uygulanabilmesi için aşağıdaki koşulların
    tamamının sağlanması gerekmektedir. Bu koşullardan hangisi yanlış ifade edilmiştir?

    '
  secenekler:
    A: Hizmet Türkiye'de yurt dışındaki bir müşteri için ifa edilmelidir.
    B: Hizmetten yurt dışında faydalanılmalıdır.
    C: Hizmet bedeli döviz cinsinden alınmalı ve Türkiye'ye getirilmelidir.
    D: Hizmeti sunan mükellefin KDV mükellefi olması şarttır.
    E: Hizmetin faturası yurt dışındaki alıcı adına düzenlenmiş olmalıdır.
  dogru: D
  aciklama:
    dogru_neden: 'Hizmet ihracı istisnasının koşulları md. 11/1-a ve 12/2''de sayılmıştır: hizmet Türkiye''de yurt dışı müşteriye
      ifa edilmeli, hizmetten yurt dışında faydalanılmalı ve bedel dövizle Türkiye''ye getirilmelidir. ''KDV mükellefi olma''
      şartı hizmet ihracı istisnasının kanuni koşulları arasında ayrıca sayılmamıştır; md. 11 istisnanın uygulanmasında ayrıca
      mükellefiyeti ön koşul olarak belirtmez. D şıkkı yanlıştır.'
    celdiriciler:
      A: Doğrudur; hizmet Türkiye'de yurt dışı müşteri için ifa edilmeli koşulu vardır.
      B: Doğrudur; hizmetten yurt dışında faydalanılması şartı md. 12/2'de açıkça yer alır.
      C: Doğrudur; döviz bedelinin Türkiye'ye getirilmesi tebliğ kapsamında koşul olarak aranır.
      E: Doğrudur; faturanın yurt dışındaki alıcı adına düzenlenmesi gerekir.
