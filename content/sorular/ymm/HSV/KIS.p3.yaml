      C: '%0 değil tam istisna (md. 11) uygulanır; ayrıca yüklenilen KDV iade alınabilir.'
      D: Ödeme döneminin farklı olması (Nisan) istisnayı ortadan kaldırmaz; faydalanma yeri belirleyicidir.
