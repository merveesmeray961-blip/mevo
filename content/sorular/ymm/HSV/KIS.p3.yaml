  kok: '(M) Mühendislik A.Ş., Türkiye''de KDV mükellefidir. Şirket, Mart 2026''da Dubai''deki bir müşteri için 50.000 USD
    bedelli mühendislik danışmanlığı hizmeti sunmuş; hizmetten Dubai''de faydalanılmıştır. Hizmet bedelini Nisan 2026''da
