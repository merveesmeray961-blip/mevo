  tip: kavrama
  zorluk: 3
  kok: '3065 sayılı KDV Kanunu md. 29-30 kapsamında KDV indirimine ilişkin aşağıdaki öncülleri değerlendiriniz.


    I. İndirim hakkı, vergiyi doğuran olayın meydana geldiği takvim yılını aşmamak kaydıyla ilgili döneme ait beyanname verme
    süresine kadar kullanılabilir.

    II. Binek otomobilleri alımında ödenen KDV hiçbir durumda indirilemez.

    III. Zayi olan mallara ait KDV, md. 30/c uyarınca indirim konusu yapılamaz.


    Yukarıdakilerden hangileri doğrudur?

    '
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur: KDVK md. 29/3 uyarınca indirim hakkı vergiyi doğuran olayın meydana geldiği takvim yılını aşmamak
      kaydıyla kullanılabilir. III doğrudur: md. 30/c''ye göre deprem, sel gibi afetler ve yangın hariç zayi olan mallara
      ait KDV indirilemez. II yanlıştır: Binek otomobilleri alımında KDV''nin indirilip indirilemeyeceği arabanın kullanım
      amacına göre farklılık gösterir; md. 30/b bazı durumlarda indirimi yasaklar ama ''hiçbir durumda'' ifadesi mutlak değildir.'
    celdiriciler:
      A: III de doğrudur.
      B: I de doğrudur.
      C: II 'hiçbir durumda' ifadesi nedeniyle yanlıştır.
      E: II yanlıştır.
