  kok: 'Aşağıdaki teslimlerden hangileri KDVK md. 13/1-n''deki basılı kitap ve süreli yayın istisnası kapsamındadır?


    I. Sahafın sattığı ikinci el (kullanılmış) roman

    II. 1117 sayılı Kanun hükümlerine göre poşetlenerek satılan dergi

    III. Bir yayınevinin sattığı basılı soru bankası kitabı

    IV. CD ile satılan görüntülü eğitim seti

    V. Kitap şeklinde olmayan yaprak test

    '
  secenekler:
    A: I ve II
    B: I, III ve IV
    C: III ve V
    D: I, III ve V
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: İstisna, ikinci el olanlar dahil basılı kitap ve süreli yayınların her safhadaki tesliminde uygulanır (I);
      soru ve bilgi bankası kitapları kapsamdadır (III). Poşetlenerek satılan yayınlar Kanun gereği istisna dışıdır (II);
      CD veya flash bellekle satılan görüntülü eğitim setleri (IV) ile kitap şeklinde olmayan yaprak testler (V) kitap sayılmaz.
    celdiriciler:
      A: Poşetlenerek satılan yayınlar istisna dışıdır; III kapsamdadır.
      B: Veri taşıyıcıyla satılan eğitim seti basılı kitap değildir.
      C: Yaprak test kitap sayılmaz; I kapsamdadır.
      D: Kitap şeklinde olmayan yaprak testler istisna kapsamında değildir.
