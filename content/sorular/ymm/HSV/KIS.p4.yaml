- id: YMM-HSV-KIS-0075
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: tecil-terkin uygulamaları
  tip: hesaplama
  zorluk: 3
  kok: 'İmalatçı (F) A.Ş.''nin Haziran 2026 dönemine ilişkin bilgileri şöyledir (KDV oranı %20; tutarlar KDV hariç):


    - Yurt içi toptancılara teslimler: 300.000 TL

    - İhracatçı bir firmaya KDVK md. 11/1-c kapsamında ihraç kaydıyla teslimler: 500.000 TL

    - Dönemin toplam indirilecek KDV''si: 140.000 TL (önceki dönemden devreden KDV yoktur)


    İhraç kaydıyla teslim edilen mallar süresi içinde ihraç edilmiştir. KDV Genel Uygulama Tebliği''ne göre ihracatın gerçekleştiği
    dönemde (F) A.Ş.''ye iade edilecek KDV kaç TL''dir?

    '
  secenekler:
    A: '20.000'
    B: '80.000'
    C: '100.000'
    D: '120.000'
    E: '140.000'
  dogru: B
  aciklama:
    dogru_neden: 'Hesaplanan KDV: (300.000 + 500.000) × %20 = 160.000; ödenmesi gereken KDV: 160.000 − 140.000 = 20.000. Tecil
      edilebilir KDV, ihraç kaydıyla teslimlerin KDV''sidir: 500.000 × %20 = 100.000. Ödenmesi gereken tutar bundan az olduğundan
      tecil edilecek KDV 20.000 TL''dir ve dönemde ödeme çıkmaz. Tecil edilemeyen 100.000 − 20.000 = 80.000 TL, ihracat gerçekleştiğinde
      imalatçıya iade edilir. Püf noktaları: Tecil edilecek tutar, ödenmesi gereken KDV ile ihraç kayıtlı teslim KDV''sinden
      küçük olanıdır; iade bu iki tutarın farkıdır, indirilecek KDV''nin tamamı değildir.'
    celdiriciler:
      A: Tecil edilen tutardır; bu tutar ihracatla terkin edilir, iade edilmez.
      C: İhraç kaydıyla teslim KDV'sinin tamamı iade edilecek sanılmıştır; 20.000 TL'si tecil edilmiştir.
      D: İndirilecek KDV'den tecil edilen tutar düşülmüştür (140.000 − 20.000); iade, tecil edilemeyen kısımla sınırlıdır.
      E: İndirilecek KDV'nin tamamı iade edilecek sanılmıştır.
    hesap_adimlari:
    - Hesaplanan = 800.000 × 0,20 = 160.000
    - Ödenmesi gereken = 160.000 − 140.000 = 20.000
    - Tecil edilebilir = 500.000 × 0,20 = 100.000
    - Tecil edilecek = min(20.000; 100.000) = 20.000
    - İade = 100.000 − 20.000 = 80.000 TL
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: Bölüm II/A-8.5
    alinti: Tecil edilecek vergi miktarı, mükellefin ihraç kaydıyla teslimleri nedeniyle hesaplanan vergi tutarından fazla
      olamaz.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: Bölüm II/A-8.5
    alinti: edilemeyen bir kısım varsa, bu kısım imalatçı mükellefe iade edilir.
  gecerlilik:
    baslangic: '2023-07-10'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'odenmesi = (300000 + 500000) * 20 / 100 - 140000

      tecil_edilebilir = 500000 * 20 / 100

      tecil = min(odenmesi, tecil_edilebilir)

      sonuc = tecil_edilebilir - tecil'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S4
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_S4.yaml, satır 71
