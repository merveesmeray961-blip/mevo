- id: YMM-HSV-KIS-0077
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: indirim (md.29-30)
  tip: uygulama
  zorluk: 2
  kok: '(M) A.Ş.''nin Mart 2026 dönemine ilişkin bilgileri şöyledir (KDV oranı %20):


    - Yurt içi satışlar üzerinden hesaplanan KDV: 60.000 TL

    - Belediyeye bedelsiz olarak teslim edilen malların alışında yüklenilen KDV: 30.000 TL (malların emsal bedeli 250.000
    TL''dir)

    - Diğer alışlara ait indirilecek KDV: 40.000 TL


    Önceki dönemden devreden KDV yoktur. KDVK md. 17/2-b, 30/a ve 32''ye göre (M) A.Ş.''nin Mart 2026 beyannamesindeki sonuç
    hangi seçenekte doğru verilmiştir?

    '
  secenekler:
    A: Ödenecek KDV 20.000 TL'dir; bedelsiz teslime ait alış KDV'si indirilemez.
    B: Ödenecek KDV 40.000 TL'dir; bedelsiz teslim emsal bedel üzerinden KDV'ye tabidir.
    C: Sonraki döneme devreden KDV 10.000 TL'dir; bu tutar iade konusu yapılamaz.
    D: İade edilecek KDV 10.000 TL'dir; tutar nakden veya mahsuben iade edilir.
    E: Sonraki döneme devreden KDV 10.000 TL'dir; tutar iki yıl içinde iade istenebilir.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 17/1''de sayılan kurumlara (belediye dahil) bedelsiz yapılan mal teslimleri md. 17/2-b ile istisnadır;
      teslim için KDV hesaplanmaz. Md. 30/a parantezi gereği bu istisnaya ilişkin yüklenilen KDV indirilebilir. İndirim: 30.000
      + 40.000 = 70.000 > hesaplanan 60.000; fark 10.000 TL sonraki döneme devreder. Md. 32''deki iade hakkı md. 11, 13, 14,
      15 ve 17/4-s istisnalarına tanındığından 17/2-b nedeniyle iade yapılmaz.'
    celdiriciler:
      A: Md. 30/a parantezi 17/2-b istisnasında indirim hakkı tanır.
      B: Belediyeye bedelsiz teslim md. 17/2-b ile istisnadır; KDV hesaplanmaz.
      D: 17/2-b, md. 32'deki iade hakkı doğuran istisnalar arasında değildir.
      E: 17/2-b nedeniyle indirilemeyen KDV için md. 32'deki iade süresi işletilemez; iade hakkı yoktur.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 17/2-b
    alinti: fıkrada sayılan kurum ve kuruluşlara bedelsiz olarak yapılan her türlü mal teslimi ve hizmet ifaları
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
