    İzmir'deki (N) Ltd. Şti.'ye yapmıştır. (N), kumaşları kendi tesislerinde (H) GmbH hesabına işledikten sonra gümrük çıkışıyla
    Almanya'ya göndermiş, mallar Almanya'ya ulaşmıştır; ihracat teslimi için aranan diğer şartlar yerine getirilmiştir. (Ö)'nün
    bu teslimi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Teslim yurt içindeki (N)'ye yapıldığından yurt içi teslim sayılır ve %20 KDV hesaplanır.
    B: İşlenme nedeniyle ihracat teslimi niteliği kaybolur; teslim ancak ihracat kayıtlı teslim sayılabilir.
    C: Malın hiç işlenmeden gümrük bölgesinden çıkması ihracat teslimi için zorunludur.
    D: Teslim ihracat teslimi sayılır; ihraç öncesi işlenmesi bu niteliği değiştirmez.
    E: İhracat istisnası ancak (N)'nin kendi adına ihracat yapması hâlinde uygulanır.
  dogru: D
  aciklama:
    dogru_neden: 'Md. 12/1-b: teslim konusu malın ihraç edilmeden önce yurt dışındaki alıcı adına hareket eden yurt içindeki
      firmalar veya bizzat alıcı tarafından işlenmesi veya herhangi bir şekilde değerlendirilmesi, ihracat teslimi niteliğini
      değiştirmez. (N), (H) GmbH adına hareket ettiğinden (Ö)''nün teslimi ihracat teslimidir ve md. 11/1-a uyarınca KDV''den
      müstesnadır.'
    celdiriciler:
      A: Teslimin yurt içindeki aracı firmaya yapılmış olması, alıcı adına hareket ediliyorsa teslimi yurt içi teslim yapmaz.
      B: İşlenme kanunda açıkça ihracat niteliğini değiştirmeyen bir durum olarak sayılmıştır; ayrıca ihracat kayıtlı teslim
        hükmüne gitmeye gerek yoktur.
      C: Kanun, malın ihracat öncesi işlenmesini veya değerlendirilmesini engel saymaz.
      E: İhracatın (N) adına yapılması şartı kanunda yoktur; yurt dışındaki alıcı adına hareket eden firmanın işlemesi yeterlidir.
    hesap_adimlari: []
