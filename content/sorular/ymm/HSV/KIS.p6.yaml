      vergilenir: 1.500.000 × %20 = 300.000 TL. Püf noktaları: (1) Soruda verilen 7.500.000 TL toplam kıymet gereksiz veridir.
      (2) İstisna ya hep ya hiç değil, kıymet artışı bakımından kısmen uygulanır.'
