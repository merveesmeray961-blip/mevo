  konu: KIS
  kazanim: yabancı uyruklu hastalara verilen sağlık hizmeti istisnası
  tip: hesaplama
  zorluk: 2
  kok: 'Sağlık Bakanlığınca izin verilen (S) Hastanesi A.Ş., Türkiye''de yerleşmiş olmayan yabancı uyruklu hastalara Temmuz
    2026''da şu teslim ve hizmetleri yapmıştır (KDV hariç): sağlık kurumu bünyesinde verilen teşhis ve tedavi hizmeti 20.000.000
    TL; tedaviyle birlikte sağlanan kozmetik ürün satışı 800.000 TL; tedaviyle birlikte sağlanan refakatçi konaklaması 600.000
    TL. Bu soruda kozmetik ürünlerde KDV oranı %20, konaklamada %10 kabul edilecektir. (S)''nin bu işlemlerden hesaplayacağı
    KDV kaç TL''dir?'
  secenekler:
    A: '60.000'
    B: '160.000'
    C: '220.000'
    D: '280.000'
    E: 4.220.000
  dogru: C
