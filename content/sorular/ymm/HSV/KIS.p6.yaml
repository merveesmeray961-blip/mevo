- id: YMM-HSV-KIS-0078
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: ihracat kayıtlı teslimde mücbir sebep ve ek süre
  tip: uygulama
  zorluk: 3
  kok: İmalatçı (V) A.Ş., 12 Ekim 2025'te KDVK md. 11/1-c kapsamında ihracatçı (İ) Ltd. Şti.'ye ihraç kaydıyla mal teslim
    etmiş ve KDV tahsil etmemiştir. (İ), mücbir sebep nedeniyle malları kanunda öngörülen üç aylık süre içinde ihraç edememiştir.
    Kanuna göre (İ)'nin ek süre için başvurabileceği son gün ile verilebilecek ek sürenin azami uzunluğu aşağıdakilerden hangisidir?
  secenekler:
    A: 31 Ocak 2026 – bir ay
    B: 31 Ocak 2026 – üç ay
    C: 15 Şubat 2026 – üç ay
    D: 15 Şubat 2026 – altı ay
    E: 1 Mart 2026 – üç ay
  dogru: C
  aciklama:
    dogru_neden: 'Md. 11/1-c uyarınca ihraç kaydıyla teslim edilen mallar, ihracatçıya teslim tarihini takip eden ay başından
      itibaren 3 ay içinde ihraç edilmelidir. Teslim 12 Ekim 2025 olduğundan süre 1 Kasım 2025''te başlar ve 31 Ocak 2026''da
      biter. Mücbir sebep veya beklenmedik durum hâlinde, en geç üç aylık sürenin dolduğu tarihten itibaren onbeş gün içinde
      başvuran ihracatçılara üç aya kadar ek süre verilebilir. Başvuru için son gün 31 Ocak + 15 gün = 15 Şubat 2026''dır;
      ek süre en çok üç aydır. Püf noktaları: (1) Süre teslim tarihinden değil, teslimi izleyen ay başından işler. (2) Onbeş
      günlük süre başvuru içindir, ek süre ise ayrıca üç aya kadardır; ikisini karıştırmayın.'
    celdiriciler:
      A: Başvuru süresi yanlış hesaplanmıştır (onbeş gün eklenmemiştir) ve ek süre üç aya kadar verilebilir; bir ay değildir.
      B: Üç aylık sürenin bittiği gün başvuru için son gün sayılmıştır; kanun bu tarihten itibaren onbeş gün daha tanır.
      D: Ek süre en çok üç aydır; altı ay kanunda yoktur.
      E: Üç aylık süre sonu 1 Mart değil, 31 Ocak 2026'dır; başvuru için tanınan süre onbeş gündür.
    hesap_adimlari:
    - Teslim 12/10/2025 → süre 1/11/2025 – 31/1/2026
    - 'Başvuru: 31/1/2026 + 15 gün = 15/2/2026'
    - 'Ek süre: en çok 3 ay'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: İhraç edilmek şartıyla imalatçılar tarafından kendilerine teslim edilen mallara ait katma değer vergisi, ihracatçılar
      tarafından ödenmez.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 11/1-c
    alinti: İhracatın mücbir sebepler veya beklenmedik durumlar nedeniyle üç ay içinde gerçekleştirilememesi halinde, en geç
      üç aylık sürenin dolduğu tarihten itibaren onbeş gün içinde başvuran ihracatçılara, Maliye Bakanlığınca veya Bakanlığın
      uygun görmesi halinde vergi dairelerince üç aya kadar ek süre verilebilir.
