      deprem, sel veya mücbir sebep ilan edilen yangın dışındaki sebeplerle zayi olan mallara ait KDV indirilemez. Buna karşılık
      md. 11 kapsamındaki ihracat istisnasıyla ilgili alış KDV''si md. 32 gereğince indirilir. İndirilecek KDV = 700.000 +
      120.000 = 820.000 TL; ödenecek KDV = 1.250.000 − 820.000 = 430.000 TL. Püf noktaları: (1) İstisna işlemle ilgili KDV''yi
      sırf istisna diye dışarıda bırakmayın; ihracat md. 32 ile korunur. (2) Hırsızlık, md. 30/c''nin sayılan haller listesinde
      yoktur.'
