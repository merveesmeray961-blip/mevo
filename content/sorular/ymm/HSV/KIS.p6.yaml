  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: ihraç kaydıyla teslimde imalatçıya iade sınırı
  tip: hesaplama
  zorluk: 2
  kok: İmalatçı (G) A.Ş., ihracatçıya ihraç kaydıyla 1.000.000 TL bedelle (KDV hariç) mal teslim etmiş, KDV tahsil etmemiştir;
    ihracat işlemi tamamlanmıştır. KDV oranı %20'dir. Sonradan yapılan 100.000 TL tutarındaki iskonto imalatçı aleyhine matrah
    değişikliği oluşturmuştur. (G)'nin iadesini talep ettiği, yüklenilen KDV'den kaynaklanan bakiye 260.000 TL'dir. Md. 11/1-c'deki
    sınır dikkate alındığında (G)'ye iade edilecek KDV kaç TL'dir?
  secenekler:
    A: '20.000'
    B: '80.000'
    C: '180.000'
    D: '260.000'
    E: 1.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Md. 11/1-c uyarınca ihracatçılara mal teslim eden imalatçılara iade edilecek KDV, ihraç edilen mala ilişkin
      imalatçı satış bedeline göre hesaplanan vergiden imalatçı aleyhine matrahta meydana gelen değişikliğe ilişkin verginin
      düşülmesinden sonra kalan tutardan fazla olamaz. Hesaplanan vergi: 1.000.000 × %20 = 200.000 TL; matrah değişikliğine
      ilişkin vergi: 100.000 × %20 = 20.000 TL; sınır: 180.000 TL. Yüklenilen KDV bakiyesi (260.000 TL) sınırdan büyük olduğundan
      iade 180.000 TL''dir. Püf noktaları: (1) Sınır, yüklenilen KDV''ye değil, imalatçı satış bedeline göre hesaplanan vergiye
      bağlıdır. (2) İskonto gibi matrah azalışları sınırı düşürür.'
    celdiriciler:
      A: Bu tutar yalnızca matrah değişikliğine ilişkin vergidir; sınır hesabında bu vergi hesaplanan vergiden düşülür.
      B: Bu tutar yüklenilen KDV bakiyesi ile sınır arasındaki farktır (260.000 − 180.000); iade edilecek tutar sınırın kendisidir.
      D: Yüklenilen KDV bakiyesinin tamamı iade edilemez; iade sınırı aşamaz.
      E: Satış bedelinin (matrahın) kendisi esas alınmıştır; sınır hesaplanan vergiye göre belirlenir.
    hesap_adimlari:
    - 'Hesaplanan: 1.000.000 × 0,20 = 200.000'
    - 'Matrah değişikliği: 100.000 × 0,20 = 20.000'
    - 'Sınır: 180.000; iade = min(260.000; 180.000) = 180.000'
