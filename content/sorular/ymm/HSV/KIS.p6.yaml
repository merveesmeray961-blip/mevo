    alışları 700.000 TL; mal ihracatıyla (md. 11/1-a) ilgili alışlar 120.000 TL; müdürün kullanımına tahsis edilen binek otomobil
    (şirket binek otomobil kiralama veya işletme faaliyetinde bulunmamaktadır) 180.000 TL; depodan hırsızlık sonucu zayi olan
