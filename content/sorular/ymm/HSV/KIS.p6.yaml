- id: YMM-HSV-KIS-0082
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: md. 13 kapsamındaki ürün, gübre ve OSB istisnaları
  tip: kavrama
  zorluk: 2
  kok: 'KDVK md. 13''teki istisnalarla ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Lisanslı depoculuk mevzuatına göre düzenlenen ürün senetlerinin ürün ihtisas borsaları aracılığıyla ilk teslimi istisnadır.

    II. Kedi-köpek mamaları fenni karma yemler kapsamında istisnaya girer.

    III. Gıda, Tarım ve Hayvancılık Bakanlığı tarafından tescil edilen gübrelerin teslimi istisnadır.

    IV. Organize sanayi bölgelerinin su, kanalizasyon ve arıtma tesislerine ilişkin, bu bölgelere yapılan mal teslimleri ile
    hizmet ifaları istisnadır.'
  secenekler:
    A: I ve III
    B: I, III ve IV
    C: II, III ve IV
    D: Yalnız IV
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'I doğrudur: md. 13/ğ, ürün senetlerinin ürün ihtisas borsaları ve izinli ticaret borsaları aracılığıyla
      ilk teslimini istisna eder. II yanlıştır: md. 13/ı fenni karma yemleri sayarken kedi-köpek mamalarını açıkça hariç tutmuştur.
      III doğrudur: tescilli gübrelerin teslimi md. 13/ı kapsamındadır. IV doğrudur: md. 13/j, OSB''lerin su, kanalizasyon,
      arıtma vb. tesislerine ilişkin mal teslimleri ve hizmet ifalarını istisna eder. Doğru cevap I, III ve IV''tür. Püf noktaları:
      Yem istisnasında parantez içi hariç tutmalara bakın; "her türlü yem" ezberi yanıltır.'
    celdiriciler:
      A: IV de doğrudur; md. 13/j OSB tesislerine ilişkin teslim ve hizmetleri kapsar.
      C: II yanlıştır; kedi-köpek mamaları md. 13/ı'de açıkça hariç tutulmuştur, I de doğrudur.
      D: I ve III de doğru ifadelerdir.
      E: II yanlış olduğu için bu seçenek hatalıdır; ayrıca IV doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 13/ğ
    alinti: 5300 sayılı Tarım Ürünleri Lisanslı Depoculuk Kanununa göre düzenlenen ürün senetlerinin, ürün ihtisas borsaları
      ile Sanayi ve Ticaret Bakanlığından ürün senedi alım-satımı konusunda izin alan ticaret borsaları aracılığıyla ilk teslimi.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 13/ı
    alinti: her türlü fenni karma yemler (kedi-köpek mamaları hariç)
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 13/ı
    alinti: Gıda, Tarım ve Hayvancılık Bakanlığı tarafından tescil edilen gübreler ve gübre üreticilerine
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 13/j
    alinti: Organize sanayi bölgeleri ile küçük sanayi sitelerinin su, kanalizasyon, arıtma, doğalgaz, elektrik, haberleşme,
      yenilenebilir ve diğer enerji tesisleri ile yol yapımına ve küçük sanayi sitelerindeki işyerlerinin inşasına ilişkin,
      bunlara veya bunlar tarafından oluşturulan iktisadi işletmelere yapılan mal teslimleri ile hizmet ifaları
