- id: YMM-HSV-KIS-0098
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: istisnadan vazgeçilemeyen istisnalar
  tip: uygulama
  zorluk: 3
  kok: Aşağıdaki mükelleflerden hiçbiri kamu menfaatine yararlı dernek veya vergi muafiyeti tanınan vakıf değildir. 3065 sayılı
    KDV Kanunu md. 18/2'ye göre, hangisinin yaptığı istisna kapsamındaki teslim veya hizmetler bakımından istisnadan vazgeçme
    (vergiye tabi olmayı talep etme) hükmü uygulanabilir?
  secenekler:
    A: Bir üniversitenin ilim, fen ve güzel sanatları yaymak amacıyla yaptığı teslim ve hizmetleri (md. 17/1-a)
    B: Kamu kurumu niteliğindeki bir meslek kuruluşunun kanunla verilen görev gereği ruhsat, izin ve onay hizmetleri (md.
      17/4-e)
    C: Bir askerî kantinin kuruluş amacına uygun olarak yaptığı teslim ve hizmetleri (md. 17/3-a)
    D: Bir belediyenin işlettiği huzurevinin kuruluş amacına uygun teslim ve hizmetleri (md. 17/2-a)
    E: Yatırım Teşvik Belgesi sahibi mükellefe yapılan, belge kapsamındaki makina ve teçhizat teslimleri (md. 13/1-d)
  dogru: E
  aciklama:
    dogru_neden: 'KDVK md. 18/2 uyarınca md. 17''nin (1) ve (2) numaralı fıkraları ile (3) numaralı fıkranın (a) ve (4) numaralı
      fıkranın (e) bentlerindeki istisnalar bakımından istisnadan vazgeçme hükmü uygulanmaz. A (17/1), B (17/4-e), C (17/3-a)
      ve D (17/2) bu kapsamdadır. Md. 13/1-d''deki yatırım teşvik belgeli makina teslimi bu sayılanlar arasında olmadığından,
      istisnadan vazgeçme md. 18/1''e göre mümkündür. Püf noktaları: (1) Yasak liste sadece md. 17''dedir; md. 11 ve 13 istisnaları
      listede yoktur. (2) Seçeneklerin hepsinde istisna vardır, sorulan istisnanın vazgeçmeye açık olup olmadığıdır. (3) Md.
      17/4''ün tamamı değil, yalnız (e) bendi yasak listededir.'
    celdiriciler:
      A: Md. 17/1'deki kültür ve eğitim amaçlı istisnalar md. 18/2 gereği vazgeçmeye kapalıdır.
      B: Md. 17/4-e istisnası md. 18/2'de adı sayılan bentlerdendir; vazgeçme uygulanmaz.
      C: Md. 17/3-a askerî amaç taşıyan istisna md. 18/2 kapsamındadır; vazgeçme uygulanmaz.
      D: Md. 17/2'deki sosyal amaç taşıyan istisnalar md. 18/2 gereği vazgeçmeye kapalıdır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 18/2
    alinti: Kamu menfaatine yararlı dernekler ve Cumhurbaşkanınca vergi muafiyeti tanınan vakıfların kuruluş amaçlarına uygun
      olarak işletmek veya yönetmek suretiyle ifa ettikleri teslim ve hizmetlere ilişkin istisnalar hariç olmak üzere, 17
      nci maddenin (1) ve (2) numaralı fıkralarıyla (3) numaralı fıkranın (a) ve (4) numaralı fıkranın (e) bentlerinde yazılı
      istisnalar hakkında yukarıdaki (1) numaralı fıkra hükmü uygulanmaz.
