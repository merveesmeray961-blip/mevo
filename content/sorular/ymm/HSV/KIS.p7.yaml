  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: istisnadan vazgeçme
  tip: kavrama
  zorluk: 2
  kok: 3065 sayılı KDV Kanunu md. 18'e göre istisnadan vazgeçmeye ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Vergiden istisna edilmiş işlemleri yapanlar, ilgili vergi dairesine yazılı başvuruda bulunarak belirtecekleri işlem
      türleri için vergiye tabi tutulmalarını talep edebilir.
    B: Talebin, dilekçede belirtilen ve dilekçe tarihinden sonra ifa edilen işlemlerin tamamını kapsaması şarttır.
    C: Vergi mükellefiyeti, talebin yapıldığı tarihten önceki vergilendirme döneminin başından itibaren tesis edilir.
    D: Bu şekilde mükellef olanlar, üç yıl geçmedikçe mükellefiyetten çıkamaz.
    E: Üç yıllık sürenin bitiminden önce çıkma talebinde bulunulmazsa mükellefiyet yeniden üç yıl süre ile uzatılmış sayılır.
  dogru: C
  aciklama:
    dogru_neden: KDVK md. 18/3'e göre vergi mükellefiyeti vergi dairesince talep tarihinden itibaren tesis edilir; geçmişe
      yönelik bir başlangıç yoktur. Bu nedenle C seçeneği yanlıştır. Diğer seçenekler md. 18/1 ve 18/3 hükümlerine uygundur.
    celdiriciler:
      A: Doğrudur; md. 18/1 istisnadan vazgeçmenin vergi dairesine yazılı başvuruyla ve işlem türleri belirtilerek yapılacağını
        öngörür.
      B: Doğrudur; md. 18/1 talebin dilekçede belirtilen ve dilekçe tarihinden sonra ifa edilen işlemlerin tamamını kapsamasını
        şart koşar.
      D: Doğrudur; md. 18/3 istisnadan vazgeçerek mükellef olanların üç yıl geçmedikçe mükellefiyetten çıkamayacağını belirtir.
      E: Doğrudur; md. 18/3 süre bitiminden önce çıkma talebi yapılmazsa mükellefiyetin yeniden üç yıl uzatılmış sayılacağını
        hükme bağlar.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 18/1
    alinti: Vergiden istisna edilmiş işlemleri yapanlar, ilgili vergi dairesine yazılı başvuruda bulunarak, belirtecekleri
      işlem türleri için vergiye tâbi tutulmalarını talep edebilirler. Bu talebin dilekçede belirtilen ve dilekçe tarihinden
      sonra ifa edilen işlemlerin tamamını kapsaması şarttır. Şu kadar ki, mükellefiyetin devam etmekte olan işlemlere şümulü
      yoktur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 18/3
    alinti: İstisnadan vazgeçeceklerin talepleri üzerine, vergi dairesince, vergi mükellefiyetleri talep tarihinden itibaren
      tesis olunur. Bu şekilde mükellef olanlar üç yıl geçmedikçe mükellefiyetten çıkamazlar. Mükellefler üç yıllık sürenin
      bitiminden önce mükellefiyetten çıkma talebinde bulunmadıkları takdirde mükellefiyet yeniden üç yıl süre ile uzatılmış
      sayılır.
