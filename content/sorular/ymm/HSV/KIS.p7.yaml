- id: YMM-HSV-KIS-0099
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: bedelsiz eğitim hizmetlerinde kapasite sınırı
  tip: hesaplama
  zorluk: 2
  kok: Bir özel okul (5580 sayılı Kanun'a tâbi), ilgili dönemdeki kapasitesi 480 öğrenci olduğu halde; bir vakıf üniversitesi
    ise kapasitesi 6.000 öğrenci olduğu halde bedelsiz eğitim ve öğretim hizmeti vermektedir. KDV Kanunu md. 17/2-b uyarınca
    istisna kapsamında verilebilecek bedelsiz eğitim hizmetinin azami öğrenci sayıları toplamı kaç kişidir? (Öğrenci yurtları
    dikkate alınmayacaktır.)
  secenekler:
    A: '648'
    B: '3.048'
    C: '3.240'
    D: '3.480'
    E: '6.480'
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 17/2-b, özel okullarca bedelsiz verilen eğitim ve öğretim hizmetlerinde kapasitenin %10''unu, üniversite
      ve yüksekokullarda ise %50''sini geçmemek üzere verilen hizmetleri istisna eder. Özel okul: 480 × %10 = 48 kişi; üniversite:
      6.000 × %50 = 3.000 kişi; toplam 3.048 kişidir.'
    celdiriciler:
      A: Üniversiteye de %10 oranı uygulanmıştır (48 + 600); üniversitelerde oran %50'dir.
      C: Özel okula da %50 oranı uygulanmıştır (240 + 3.000); özel okullarda sınır %10'dur.
      D: Özel okulun kapasitesinin tamamı (480) alınmıştır; sınır kapasitenin %10'udur.
      E: Her iki kurumun kapasitesinin tamamı (480 + 6.000) toplanmıştır; oysa istisna yalnız kapasitenin belirli yüzdesiyle
        sınırlıdır.
    hesap_adimlari:
    - 'Özel okul: 480 × %10 = 48 kişi'
    - 'Üniversite: 6.000 × %50 = 3.000 kişi'
    - Toplam = 48 + 3.000 = 3.048 kişi
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 17/2-b
    alinti: özel okullarca bedelsiz verilen eğitim, öğretim hizmetlerinde ilgili dönemdeki kapasitelerinin % 10’unu, 24/3/1950
      tarihli ve 5661 sayılı Yüksek Öğrenim Öğrenci Yurtları ve Aşevleri Hakkındaki Kanuna Ek Kanun ile 30/4/1992 tarihli
      ve 3797 sayılı Milli Eğitim Bakanlığının Teşkilat ve Görevleri Hakkında Kanun hükümlerine göre kurulan öğrenci yurtları
      tarafından bedelsiz verilen yurt hizmetlerinde ilgili dönemdeki kapasitelerinin % 10’unu, üniversite ve yüksekokullarda
      ise % 50’sini geçmemek üzere verilen bedelsiz eğitim ve öğretim hizmetleri,
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'okul=480*0.10

      uni=6000*0.50

      sonuc = okul+uni

      '
