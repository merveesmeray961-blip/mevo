- id: YMM-HSV-KIS-0104
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: yatırım teşvik belgeli teslimlerde belgenin gerçekleşmemesi
  tip: uygulama
  zorluk: 3
  kok: Yatırım Teşvik Belgesi sahibi (Y) A.Ş.'ye, belge kapsamındaki bir makina (S) Ltd. Şti. tarafından KDV hesaplanmadan,
    KDVK md. 13/1-d istisnası uygulanarak teslim edilmiştir. Daha sonra yatırım, teşvik belgesinde öngörüldüğü şekilde gerçekleşmemiştir.
    Teslim 2024 yılında yapılmıştır. KDV Kanunu md. 13/1-d'ye göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Vergi alıcıdan ceza ve gecikme faiziyle tahsil edilir; zamanaşımı olayı izleyen takvim yılı başında başlar.
    B: Zamanında alınmayan vergi satıcıdan, gecikme faizi ile birlikte ancak ceza uygulanmaksızın tahsil edilir.
    C: Zamanında alınmayan vergi alıcıdan vergi ziyaı cezası uygulanmaksızın ve gecikme faizi olmaksızın tahsil edilir.
    D: Zamanında alınmayan vergi alıcıdan tahsil edilir; zamanaşımı, teslimin yapıldığı yılın sonunda başlar.
    E: Zamanında alınmayan vergi hem satıcıdan hem alıcıdan müteselsilen aranır; zamanaşımı belge iptal tarihinde başlar.
  dogru: A
  aciklama:
    dogru_neden: 'KDVK md. 13/1-d''ye göre yatırım teşvik belgesinde öngörüldüğü şekilde gerçekleşmemesi halinde zamanında
      alınmayan vergi alıcıdan, vergi ziyaı cezası uygulanarak gecikme faizi ile birlikte tahsil edilir. Zamanında alınmayan
      vergiler ile vergi cezalarında zamanaşımı, verginin tarhini veya cezanın kesilmesini gerektiren durumun meydana geldiği
      tarihi takip eden takvim yılının başından itibaren başlar. Püf noktaları: (1) Muhatap, istisnalı satışı yapan satıcı
      değil alıcıdır. (2) Hem ceza hem gecikme faizi birlikte uygulanır. (3) Zamanaşımı başlangıcı olayı izleyen takvim yılının
      başıdır; teslim yılının sonu ya da belge iptal tarihi değildir.'
    celdiriciler:
      B: Vergi satıcıdan değil alıcıdan aranır ve vergi ziyaı cezası da uygulanır.
      C: Md. 13/1-d vergi ziyaı cezasının uygulanmasını ve gecikme faizini birlikte öngörür; ikisinin de olmaması doğru değildir.
      D: Alıcıdan tahsil doğru olmakla birlikte zamanaşımı olayı izleyen takvim yılının başında başlar; teslim yılı sonu esas
        alınmamıştır.
      E: Kanunda satıcıyla müteselsil sorumluluk ve belge iptal tarihinden zamanaşımı başlangıcı yer almaz; alıcı muhatap
        alınır.
    hesap_adimlari: []
