- id: YMM-HSV-KIS-0101
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: KDV istisnaları ve iade
  konu: KIS
  kazanim: gerçek usulde vergilendirilmeyenlerin teslimleri
  tip: kavrama
  zorluk: 1
  kok: 3065 sayılı KDV Kanunu md. 17/4 kapsamında vergiden istisna edilen teslim ve hizmetler bakımından aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Gerçek usulde vergilendirilen çiftçilerin yaptığı teslimler vergiden istisnadır.
    B: Anonim şirketlerin ticari faaliyetleri çerçevesindeki teslimleri vergiden istisnadır.
    C: Gerçek usulde vergilendirilen serbest meslek erbabının hizmetleri vergiden istisnadır.
    D: Basit usulde tespit edilen mükelleflerin teslim ve hizmetleri vergiden istisnadır.
    E: Gerçek usulde ticari kazanç mükellefi esnafın teslimleri vergiden istisnadır.
  dogru: D
  aciklama:
    dogru_neden: KDVK md. 17/4-a, GVK'ya göre vergiden muaf esnaf ile kazançları basit usulde tespit edilen mükellefler tarafından
      yapılan teslim ve hizmetleri vergiden istisna eder. Md. 17/4-b ise gerçek usulde vergiye tabi olmayan çiftçileri ve
      GVK md. 66'ya göre vergiden muaf serbest meslek erbabını kapsar; gerçek usulde vergilendirilenler istisna dışındadır.
    celdiriciler:
      A: Md. 17/4-b yalnız gerçek usulde vergiye tabi olmayan çiftçileri kapsar; gerçek usulde vergilendirilen çiftçi istisnadan
        yararlanamaz.
      B: Md. 17/4'teki istisnalar gerçek kişi esnaf ve çiftçilere yöneliktir; ticari faaliyette bulunan anonim şirketler için
        böyle bir istisna yoktur.
      C: Md. 17/4-b yalnızca GVK md. 66'ya göre vergiden muaf serbest meslek erbabını kapsar; gerçek usulde vergilendirilen
        serbest meslek erbabı KDV'ye tabidir.
      E: Md. 17/4-a'da gerçek usulde ticari kazanç mükellefi esnaf sayılmamıştır; yalnızca vergiden muaf esnaf ve basit usule
        tabi olanlar istisnadadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 17/4-a
