    ulaşmıştır. Satış bedeli döviz olarak tahsil edilmiş, ihracat beyannamesi usulüne uygun tescil ve kapatılmıştır. Bu işlem
    hakkında KDV Kanunu'na göre aşağıdakilerden hangisi doğrudur?
