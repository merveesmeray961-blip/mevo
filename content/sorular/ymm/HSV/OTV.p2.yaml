- id: YMM-HSV-OTV-0024
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: ÖTV'nin KDV matrahına etkisi
  tip: hesaplama
  zorluk: 2
  kok: İmalatçı (B) A.Ş., (IV) sayılı listede yer alan bir malı yurt içindeki bir alıcıya satmıştır. Faturada; satış bedeli
    50.000 TL, satıcının alıcının gösterdiği yere kadar yaptığı taşıma gideri 2.000 TL, ticari teamüllere uygun iskonto 2.000
    TL ve vade farkı 1.000 TL olarak gösterilmiştir. Malın tabi olduğu ÖTV oranı %20, KDV oranı %20 olarak kabul edilecektir.
    Buna göre faturada hesaplanacak KDV kaç TL’dir?
  secenekler:
    A: '10.200'
    B: '12.000'
    C: '12.240'
    D: '12.480'
    E: '12.720'
  dogru: C
  aciklama:
    dogru_neden: 'ÖTVK md. 11/3’e göre (IV) sayılı listedeki malların ÖTV matrahı, hesaplanacak ÖTV hariç KDV matrahını oluşturan
      unsurlardan oluşur: taşıma gideri ve vade farkı dahil, ticari teamüllere uygun iskonto hariç (KDVK md. 24-25). ÖTV matrahı
      50.000 + 2.000 + 1.000 − 2.000 = 51.000 TL, ÖTV 10.200 TL’dir. KDVK md. 24/b’ye göre vergi de KDV matrahına girer: KDV
      matrahı 51.000 + 10.200 = 61.200 TL; KDV 12.240 TL’dir.'
    celdiriciler:
      A: 10.200 TL, ÖTV’nin KDV matrahına eklenmemesiyle (51.000 × %20) bulunur; aynı tutar ÖTV ile de karıştırılabilir.
      B: 12.000 TL, yalnız satış bedeli üzerinden (50.000 × 1,20 × %20) hesaplamaktır; taşıma, vade farkı ve iskonto dikkate
        alınmamıştır.
      D: 12.480 TL, iskonto düşülmeyip vade farkı eklenmeden (52.000 × 1,20 × %20) bulunur.
      E: 12.720 TL, ticari teamüle uygun iskontonun matrahtan düşülmemesiyle (53.000 × 1,20 × %20) bulunur.
    hesap_adimlari:
    - 'ÖTV matrahı: 50.000 + 2.000 + 1.000 − 2.000 = 51.000 TL'
    - 'ÖTV: 51.000 × 0,20 = 10.200 TL'
    - 'KDV matrahı: 51.000 + 10.200 = 61.200 TL'
    - 'KDV: 61.200 × 0,20 = 12.240 TL'
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 11/3
    alinti: 3. (II), (III) [(B) cetvelindekiler hariç] ve (IV) sayılı listelerdeki mallar için verginin matrahı; bunların
      teslimi, ilk iktisabı ve ithalinde, hesaplanacak özel tüketim vergisi hariç, katma değer vergisi matrahını oluşturan
      unsurlardan teşekkül eder.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 24/b
    alinti: b) Ambalaj giderleri, sigorta, komisyon ve benzeri gider karşılıkları ile vergi, resim, harç, pay, fon karşılığı
      gibi unsurlar,
  gecerlilik:
    baslangic: '2006-04-08'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'otv_matrah = 50000 + 2000 + 1000 - 2000

      otv = otv_matrah * 20 // 100

      sonuc = (otv_matrah + otv) * 20 // 100'
