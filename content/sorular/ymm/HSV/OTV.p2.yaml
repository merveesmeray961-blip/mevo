- id: YMM-HSV-OTV-0025
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: ihracat istisnası ve iade
  tip: kavrama
  zorluk: 2
  kok: 'ÖTV Kanunu’nun ihracat istisnasına ilişkin md. 5 hükümleri bakımından aşağıdaki ifadeleri değerlendiriniz.

    I. Malın ihraç edilmeden önce yurt dışındaki alıcı adına hareket eden yurt içindeki bir firmaya işlenmek üzere teslimi
    ihracat sayılır.

    II. Yurt içinden serbest bölgelere yapılan teslimler ihracat sayılır.

    III. (III) ve (IV) sayılı listelerdeki malların, gümrüksüz satış mağazalarında satılmak üzere bu mağazalara teslimi vergiden
    müstesnadır.

    IV. İhraç edilen malların alış faturalarında gösterilen ve beyan edilen ÖTV ihracatçıya iade edilir.

    V. Yurt dışındaki müşteri tabirine, yurt içindeki bir işletmenin yurt dışında faaliyet gösteren şubeleri de girer.

    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: III ve IV
    B: II, III ve IV
    C: I, III, IV ve V
    D: IV ve V
    E: III, IV ve V
  dogru: E
  aciklama:
    dogru_neden: ÖTVK md. 5/1-a yurt dışındaki müşteri tanımına yurt içindeki işletmenin yurt dışındaki şubelerini de katar
      (V doğru). Md. 5/2’ye göre (III) ve (IV) sayılı listelerdeki malların gümrüksüz satış mağazalarına teslimi istisnadır
      (III doğru). Md. 5/3’e göre ihraç edilen malların alış belgelerinde gösterilen ve beyan edilen ÖTV ihracatçıya iade
      edilir (IV doğru). Md. 5/1-b’ye göre ihraçtan önce alıcı adına hareket edenlere işlenmek üzere yurt içinde yapılan teslim
      ile yurt içinden serbest bölgelere yapılan teslimler ihracat sayılmaz (I ve II yanlış).
    celdiriciler:
      A: V de doğrudur; md. 5/1-a yurt dışında faaliyet gösteren şubeleri yurt dışındaki müşteri sayar.
      B: II yanlıştır; 7491 sayılı Kanunla yurt içinden serbest bölgelere yapılan teslimlerin ihracat sayılmayacağı açıkça
        hükme bağlanmıştır.
      C: I yanlıştır; işlenmek üzere yurt içinde alıcı adına hareket edenlere yapılan teslim ihracat sayılmaz.
      D: III de doğrudur; (III) ve (IV) sayılı listelerdeki malların gümrüksüz satış mağazalarına teslimi istisnadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/1-b
    alinti: Malın ihraç edilmeden önce yurt dışındaki alıcı adına hareket edenlere veya bizzat alıcıya işlenmek ya da herhangi
      bir şekilde değerlendirilmek üzere yurt içinde teslimi ile yurt içinden serbest bölgelere yapılan teslimler ihracat
      sayılmaz.
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/1-a
    alinti: Yurt dışındaki müşteri tabiri; ikametgâhı, işyeri, kanuni ve iş merkezleri yurt dışında olan alıcılar ile yurt
      içinde bulunan bir işletmenin, yurt dışında faaliyet gösteren şubelerini ifade eder.
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/3
    alinti: '3. (Ek: 29/3/2018-7104/24 md.) İhraç edilen veya 4458 sayılı Gümrük Kanununun 95 inci maddesinin (1) numaralı
