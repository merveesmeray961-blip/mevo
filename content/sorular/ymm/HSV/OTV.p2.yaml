      mükelleftir (IV doğru). Ancak Tüketicinin Korunması Hakkında Kanun hükümleri saklı kalmak üzere, kayıt ve tescile tabi
      malların tescil edildikten sonra iadesi düzeltme kapsamı dışındadır (II yanlış).
    celdiriciler:
      B: IV de doğrudur; belgede yersiz ÖTV gösteren, gösterdiği vergiyi beyan ve ödemekle mükelleftir.
