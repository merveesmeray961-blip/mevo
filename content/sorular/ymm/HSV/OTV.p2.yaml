  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: ÖTV'nin KDV matrahına etkisi
  tip: hesaplama
  zorluk: 3
  kok: '(P) A.Ş., (I) sayılı listede yer alan bir malı ÖTV Kanunu md. 16/4 uyarınca ÖTV için teminat göstererek Eylül 2026’da
    ithal etmiştir. İthalata ilişkin bilgiler şöyledir:

    - Gümrük kıymeti (CIF): 2.000.000 TL

    - İthalat sırasında ödenen gümrük vergisi ile diğer resim, harç ve paylar: 200.000 TL

    - Teminatın hesaplanmasına esas ÖTV tutarı: 500.000 TL (ÖTV ödenmemiş, karşılığında teminat verilmiştir)

    - Gümrük beyannamesinin tescilinden sonra malın depoya taşınması için ödenen bedel (KDV hariç): 100.000 TL

    KDV oranı %20 olduğuna göre, ithalde hesaplanacak KDV kaç TL’dir?'
  secenekler:
    A: '400.000'
    B: '440.000'
    C: '500.000'
    D: '540.000'
    E: '560.000'
  dogru: D
  aciklama:
    dogru_neden: 'KDVK md. 21/b ithalat sırasında ödenen vergi, resim, harç ve payları matraha katar. 7555 sayılı Kanunla
      eklenen md. 21/ç ise ÖTVK md. 16/4 uyarınca teminat karşılığı ithal edilen malın teminatının hesaplanmasına esas ÖTV
      tutarını da ithalde KDV matrahına dahil etmiştir. Bu nedenle ÖTV ödenmemiş olsa da teminata esas tutar matraha girer.
      Tescilden sonraki taşıma md. 21/c’deki süre şartını karşılamaz. Matrah = 2.000.000 + 200.000 + 500.000 = 2.700.000 TL;
      KDV = 540.000 TL. Püf noktaları: 1 Ağustos 2025’ten önce teminata bağlanan ve ödenmeyen ÖTV, “ithalat sırasında ödenen”
      vergiler arasında sayılmadığı için matraha girmiyordu; bugün (ç) bendi gereği girer. Tescil sonrası giderler ise hiçbir
      koşulda girmez.'
    celdiriciler:
      A: 400.000 TL yalnız gümrük kıymeti üzerinden hesaplanır; ithalat sırasında ödenen vergi ve harçlar ile teminata esas
        ÖTV atlanmıştır.
      B: 440.000 TL, ÖTV ödenmediği için matraha katılmamasıdır (2.200.000 × %20); md. 21/ç teminata esas ÖTV tutarını açıkça
        matraha dahil eder.
      C: 500.000 TL, gümrük vergisi, resim ve harçların matraha eklenmemesiyle (2.500.000 × %20) bulunur.
      E: 560.000 TL, tescilden sonraki taşıma bedelinin de matraha eklenmesidir (2.800.000 × %20); md. 21/c yalnız tescil
        tarihine kadar yapılan giderleri kapsar.
    hesap_adimlari:
    - 'Gümrük kıymeti: 2.000.000 TL'
    - 'İthalat sırasında ödenen vergi, resim, harç ve paylar: 200.000 TL'
    - 'Teminata esas ÖTV (md. 21/ç): 500.000 TL'
    - 'Matrah: 2.700.000 TL; KDV: 2.700.000 × 0,20 = 540.000 TL'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 21/ç
    alinti: 'ç) (Ek : 20/7/2025-7555/8 md.) 4760 sayılı Kanunun 16 ncı maddesinin (4) numaralı fıkrası uyarınca teminat karşılığı
