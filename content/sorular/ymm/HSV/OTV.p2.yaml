  kok: Engellilik oranı %90 olan Bay (E), ÖTVK md. 7/2-a’daki şartları taşıyarak 87.04 G.T.İ.P. numaralı ve motor silindir
    hacmi 2.800 cm³’ü aşmayan bir kamyoneti Mart 2023’te istisnadan yararlanarak ilk iktisap etmiştir; ilk iktisaptaki matrah
    1.500.000 TL’dir. Bay (E) aracı Nisan 2026’da, istisnadan yararlanma hakkı bulunmayan Bay (K)’ya 1.800.000 TL’ye satmış
    ve araç Bay (K) adına tescil edilmiştir. Bu tür araçlar için ilk iktisap tarihinde %4 olan ÖTV oranının, Bay (K) adına
    yapılan tescil tarihinde %8 olduğu kabul edilecektir. Buna göre ÖTV bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bay (K)’dan 60.000 TL ÖTV alınır.
    B: Bay (K)’dan 120.000 TL ÖTV alınır.
    C: Bay (K)’dan 144.000 TL ÖTV alınır.
    D: Bay (E)’den 120.000 TL ÖTV alınır.
    E: Araç ilk iktisapta istisnadan yararlandığı için ÖTV alınmaz.
  dogru: B
  aciklama:
    dogru_neden: 'ÖTVK md. 15/2-a’ya göre (II) sayılı listedeki kayıt ve tescile tabi mallardan ilk iktisabında istisna uygulananların
      istisnadan yararlananlar dışındakilerce iktisabında vergi; ilk iktisaptaki matrah esas alınarak, adına kayıt ve tescil
      yapılandan, kayıt ve tescil tarihinde geçerli oran üzerinden alınır. 7/2 kapsamında istisnadan yararlananların aracı
      5 yıldan fazla kullanarak elden çıkarması hâlinde bu hüküm uygulanmaz; Bay (E) aracı yaklaşık 3 yıl kullanmıştır. ÖTV
      = 1.500.000 × %8 = 120.000 TL; Bay (K)’dan alınır. Püf noktaları: Matrah satış bedeli değil ilk iktisaptaki matrahtır.
      Oran ilk iktisap tarihindeki değil, yeni tescil tarihindeki orandır. Vergi satıcı engelliden değil, adına tescil yapılan
      alıcıdan alınır.'
    celdiriciler:
      A: 60.000 TL, ilk iktisap tarihindeki %4 oranının uygulanmasıdır; kanun kayıt ve tescil tarihinde geçerli oranı esas
        alır.
      C: 144.000 TL, satış bedeli (1.800.000) üzerinden hesaplamaktır; matrah ilk iktisaptaki matrahtır.
      D: Vergi, istisnadan yararlanan satıcıdan değil, adına kayıt ve tescil işlemi yapılandan alınır.
      E: İstisna, istisnadan yararlanan kişiye özgüdür; 5 yıl dolmadan istisnadan yararlanamayan birine satışta vergi alınır.
    hesap_adimlari:
    - 'Kullanım süresi Mart 2023–Nisan 2026: 5 yıldan az → md. 15/2-a uygulanır'
    - 'Matrah: ilk iktisaptaki matrah 1.500.000 TL'
    - 'Oran: tescil tarihindeki %8 → ÖTV 120.000 TL, Bay (K)’dan'
