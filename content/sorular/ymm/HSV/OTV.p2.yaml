    hangileri doğrudur?

    I. (IV) sayılı listedeki malları imalatçıdan alan toptancı malları iade ederse, imalatçı ödediği vergi için değişikliğin
    meydana geldiği dönemde düzeltme yapabilir; bunun için iade edilen malların fiilen işletmeye girmesi ve bu işlemin defter,
    belge ve beyannamede gösterilmesi şarttır.

    II. (II) sayılı listedeki kayıt ve tescile tabi bir otomobil kayıt ve tescil edildikten sonra Tüketicinin Korunması Hakkında
    Kanun dışındaki bir nedenle bayiye iade edilirse, bayi ödediği ÖTV için md. 15/1 kapsamında düzeltme yapabilir.

    III. (II) sayılı listedeki kayıt ve tescile tabi mallarda, md. 15/1 kapsamındaki düzeltme için dönem şartı aranmaz.

    IV. Vergiye tabi bir işlem söz konusu olmadığı hâlde düzenlediği faturada ÖTV gösteren kişi, bu vergiyi beyan ve ödemekle
    mükelleftir.'
  secenekler:
    A: I, III ve IV
    B: I ve III
    C: II, III ve IV
    D: I, II, III ve IV
    E: III ve IV
  dogru: A
  aciklama:
    dogru_neden: Md. 15/1’e göre malların iadesi, işlemin gerçekleşmemesi gibi nedenlerle matrahta değişiklik olursa mükellef,
