- id: YMM-HSV-OTV-0027
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: vergiyi doğuran olay ve matrah
  tip: hesaplama
  zorluk: 3
  kok: 'Motorlu araç ticareti yapan yetkili bayi (Y) A.Ş., (II) sayılı listedeki kayıt ve tescile tabi bir aracı stok devir
    kampanyası kapsamında Bay (R)’ye KDV ve ÖTV hariç 960.000 TL’ye satmıştır. Araca ilişkin diğer bilgiler şöyledir:

    - Bayinin aracı distribütörden alış bedeli (KDV hariç): 1.100.000 TL

    - Distribütörün, aracı bayiye teslimden önce alış bedeli üzerinden yaptığı indirim: %12 (132.000 TL)

    - Aracın imalatçısının satış bedeli: 950.000 TL

    Aracın tabi olduğu ÖTV oranı %50 olarak kabul edilecek ve hesaplanan vergi asgari maktu vergi tutarının üzerinde kalacaktır.
    Buna göre (Y) A.Ş.’nin beyan edeceği ÖTV kaç TL’dir?'
  secenekler:
    A: '475.000'
    B: '480.000'
    C: '484.000'
    D: '495.000'
    E: '550.000'
  dogru: D
  aciklama:
    dogru_neden: 'ÖTVK md. 12/1’e göre (II) sayılı listedeki mallardan alınacak vergi, mükellefin alış bedeli ile her hâlükârda
      imalatçının satış bedeli üzerinden hesaplanan vergiden az olamaz. Alış bedeli esas alındığında, malı mükellefe teslim
      edenin teslim tarihine kadar yaptığı yüzde 10’a kadar indirimler alış bedelinden düşülebilir; ancak kalan tutar imalatçının
      satış bedelinden düşük olamaz. %12’lik indirimin yalnız %10’u (110.000 TL) düşülür: 1.100.000 − 110.000 = 990.000 TL.
      Bu tutar satış bedelinden (960.000) ve imalatçı satış bedelinden (950.000) yüksek olduğundan matrah 990.000 TL, ÖTV
      495.000 TL’dir. Püf noktaları: Satış bedeli alış bedelinin altına düşerse vergi alış bedeli üzerinden hesaplanır. Alış
      bedelinden düşülebilecek indirim %10 ile sınırlıdır. Üçüncü olarak imalatçının satış bedeli taban oluşturur.'
    celdiriciler:
      A: 475.000 TL, imalatçının satış bedelinin (950.000) matrah alınmasıdır; bu tutar yalnız alt sınırdır.
      B: 480.000 TL, bayinin satış bedeli (960.000) üzerinden hesaplamaktır; vergi alış bedeli üzerinden hesaplanan tutardan
        az olamaz.
      C: 484.000 TL, %12’lik indirimin tamamının düşülmesiyle (968.000 × %50) bulunur; indirim en çok %10 dikkate alınır.
      E: 550.000 TL, distribütör indiriminin hiç dikkate alınmamasıdır; teslimden önce yapılan %10’a kadar indirim alış bedelinden
        düşülebilir.
    hesap_adimlari:
    - 'Düşülebilecek indirim: 1.100.000 × %10 = 110.000 TL (yapılan 132.000 TL’nin sınırlı kısmı)'
    - 'İndirim sonrası alış bedeli: 1.100.000 − 110.000 = 990.000 TL (≥ imalatçı satış bedeli 950.000)'
    - 'Matrah: en yüksek (960.000; 990.000; 950.000) = 990.000 TL'
    - 'ÖTV: 990.000 × %50 = 495.000 TL'
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 12/1
    alinti: (II) sayılı listedeki mallardan alınacak vergi, mükellefin bu malı alış bedeli ile her hâlükârda bu malların imalatçısının
      satış bedeli veya ithalatta hesaplanan katma değer vergisi matrahı üzerinden malın tabi olduğu orana göre hesaplanan
      vergi tutarından az olamaz.
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 12/1
    alinti: tarafından yüzde 10’a kadar yapılan indirimler alış bedelinden de indirilebilir. Ancak bu indirimler sonrası kalan
      tutar, malın imalatçısının satış bedelinden veya ithalatta hesaplanan katma değer vergisi matrahından düşük olamaz.
  gecerlilik:
