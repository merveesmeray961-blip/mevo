- id: YMM-HSV-OTV-0081
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: ihracat teslimi sayılma şartları
  tip: uygulama
  zorluk: 3
  kok: 4760 sayılı ÖTV Kanunu md. 5/1'e göre, aşağıdaki teslimlerden hangisi ihracat teslimi sayılarak vergiden müstesna tutulabilir?
  secenekler:
    A: Yurt dışındaki alıcı adına hareket eden bir yurt içi firmaya, malın işlenmek üzere yurt içinde teslimi, ardından malın
      ihracı
    B: Yurt içinden bir serbest bölgedeki alıcıya yapılan teslim
    C: İkametgâhı yurt dışında olan alıcıya satılan ve gümrük bölgesinden henüz çıkmamış, yurt içindeki depoda bekleyen malın
      teslimi
    D: Yurt içinde ikametgâhı bulunan bir gerçek kişiye, malı yurt dışına götüreceğini beyan etmesi üzerine yapılan teslim
    E: Yurt içinde bulunan bir işletmenin yurt dışında faaliyet gösteren şubesine yapılan ve gümrük bölgesinden çıkan teslim
  dogru: E
  aciklama:
    dogru_neden: 'ÖTVK md. 5/1-a''ya göre teslim yurt dışındaki bir müşteriye yapılmalıdır; yurt dışındaki müşteri, ikametgâhı,
      işyeri veya merkezi yurt dışında olan alıcılar ile yurt içindeki bir işletmenin yurt dışında faaliyet gösteren şubelerini
      ifade eder. Md. 5/1-b''ye göre mal gümrük bölgesinden çıkmış olmalıdır. Dolayısıyla E seçeneği her iki şartı da taşır.
      Püf noktaları: (1) ÖTV''de ihraç öncesi yurt dışı alıcı adına hareket edenlere işlenmek üzere yapılan yurt içi teslim
      ihracat sayılmaz; bu, KDV''deki durumdan farklıdır. (2) Yurt içinden serbest bölgelere yapılan teslimler ÖTV''de ihracat
      sayılmaz. (3) Gümrük bölgesinden çıkış şarttır.'
    celdiriciler:
      A: Md. 5/1-b'ye göre ihraç edilmeden önce yurt dışındaki alıcı adına hareket edenlere işlenmek veya değerlendirilmek
        üzere yurt içinde yapılan teslim ihracat sayılmaz.
      B: Md. 5/1-b'ye göre yurt içinden serbest bölgelere yapılan teslimler ihracat sayılmaz.
      C: Md. 5/1-b mal için gümrük bölgesinden çıkmış olma şartını arar; yurt içinde bekleyen mal bu şartı karşılamaz.
      D: Md. 5/1-a teslimin yurt dışındaki müşteriye yapılmasını arar; yurt içinde ikametgâhı olan kişi yurt dışındaki müşteri
        tanımına girmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/1-a
    alinti: Teslim yurt dışındaki bir müşteriye yapılmalıdır. Yurt dışındaki müşteri tabiri; ikametgâhı, işyeri, kanuni ve
      iş merkezleri yurt dışında olan alıcılar ile yurt içinde bulunan bir işletmenin, yurt dışında faaliyet gösteren şubelerini
      ifade eder.
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 5/1-b
    alinti: Teslim konusu mal, Türkiye Cumhuriyeti Gümrük Bölgesinden çıkmış olmalıdır. Malın ihraç edilmeden önce yurt dışındaki
