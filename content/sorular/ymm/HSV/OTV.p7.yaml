    dogru_neden: ÖTVK md. 14/3'e göre ithalatta alınan vergi, ithalat vergileri ile aynı zamanda ödenir; ayrı ve sonraki bir
      ödeme günü yoktur. Bu nedenle D seçeneği yanlıştır. Diğer seçenekler md. 14/1 ve 14/2 hükümlerine uygundur.
    celdiriciler:
      A: Doğrudur; md. 14/1 ÖTV'nin mükelleflerin yazılı beyanları üzerine tarh olunacağını belirtir.
      B: Doğrudur; md. 14/1 adi ortaklıklarda ortakların müteselsil sorumluluğunu ve ortaklardan birinin tarhiyata muhatap
        tutulmasını düzenler.
      C: Doğrudur; md. 14/2 (II) sayılı liste kayıt ve tescile tâbi mallarda beyan yerini ve verginin aynı günde ödenmesini
        öngörür.
      E: Doğrudur; md. 14/1 bu mallar için vergilendirme döneminin takvim yılının birer aylık dönemleri olduğunu belirtir.
