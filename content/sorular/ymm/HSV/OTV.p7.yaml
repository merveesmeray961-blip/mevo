  kok: 4760 sayılı ÖTV Kanunu md. 8'de düzenlenen verginin tecili ve terkini hükümlerine göre, (I) sayılı listenin (B) cetvelindeki
    malların (I) sayılı listeye dahil olmayan malların imalinde kullanılması ve ihraç edilmek şartıyla ihracatçılara teslim
    edilen malların ihracı için öngörülen süreler sırasıyla aşağıdakilerden hangisidir?
  secenekler:
    A: 'İmalde kullanım: tecil tarihini takip eden aybaşından itibaren 12 ay; ihracat: teslim tarihini takip eden aybaşından
      itibaren 12 ay'
    B: 'İmalde kullanım: tecil tarihini takip eden aybaşından itibaren 6 ay; ihracat: teslim tarihini takip eden aybaşından
      itibaren 3 ay'
    C: 'İmalde kullanım: tecil tarihini takip eden aybaşından itibaren 12 ay; ihracat: teslim tarihini takip eden aybaşından
      itibaren 6 ay'
    D: 'İmalde kullanım: tecil tarihini takip eden aybaşından itibaren 24 ay; ihracat: teslim tarihini takip eden aybaşından
      itibaren 3 ay'
    E: 'İmalde kullanım: tecil tarihini takip eden aybaşından itibaren 12 ay; ihracat: teslim tarihini takip eden aybaşından
      itibaren 3 ay'
  dogru: E
  aciklama:
    dogru_neden: ÖTVK md. 8/1'e göre (I) sayılı listenin (B) cetvelindeki malların imalde kullanılması halinde tecil olunan
      vergi, tecil tarihini takip eden aybaşından itibaren oniki ay içinde kullanılmak şartıyla terkin edilir. Md. 8/2'ye
      göre ihraç edilmek şartıyla ihracatçılara teslim edilen mallarda ise teslim tarihini takip eden aybaşından itibaren
      üç ay içinde ihracat yapılmalıdır.
    celdiriciler:
      A: İhracat süresi 3 aydır; imalde kullanım süresiyle (12 ay) karıştırılmıştır.
      B: İmalde kullanım süresi 12 aydır; 6 ay değildir.
      C: İhracat süresi teslim tarihini takip eden aybaşından itibaren 3 aydır; 6 ay değildir.
      D: İmalde kullanım süresi md. 8/1'de 12 ay olarak belirlenmiştir; 24 ay değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 8/1
    alinti: Söz konusu malların tecil tarihini takip eden aybaşından itibaren oniki ay içinde (I) sayılı listeye dahil olmayan
