  secenekler:
    A: ÖTV, mükelleflerin yazılı beyanları üzerine tarh olunur.
    B: Adi ortaklıklarda verginin ödenmesinden ortakların tamamı müteselsilen sorumlu olmak üzere, ortaklardan herhangi birisi
      tarhiyata muhatap tutulur.
