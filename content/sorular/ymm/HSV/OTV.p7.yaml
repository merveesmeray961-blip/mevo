  kok: (M) A.Ş., 20 Mart 2026'da (I) sayılı listedeki bir malı, 2026 Mart ayı içinde de (III) sayılı listedeki bir malı teslim
    etmiştir. ÖTV Kanunu md. 14'e göre bu teslimlere ilişkin beyannamelerin verilebileceği son günler aşağıdakilerden hangisidir?
    (Süre sonları tatil gününe rastlamamaktadır; Cumhurbaşkanı tarafından süre kısaltılmamıştır.)
  secenekler:
    A: '(I) sayılı liste: 25 Mart 2026; (III) sayılı liste: 15 Nisan 2026'
    B: '(I) sayılı liste: 10 Nisan 2026; (III) sayılı liste: 15 Nisan 2026'
    C: '(I) sayılı liste: 10 Nisan 2026; (III) sayılı liste: 10 Nisan 2026'
    D: '(I) sayılı liste: 15 Nisan 2026; (III) sayılı liste: 15 Nisan 2026'
    E: '(I) sayılı liste: 25 Mart 2026; (III) sayılı liste: 10 Nisan 2026'
  dogru: B
  aciklama:
    dogru_neden: ÖTVK md. 14/1'e göre (I) sayılı listedeki mallar için vergilendirme dönemi, her ayın ilk onbeş günlük birinci
      ve kalan günlerinden oluşan ikinci dönemdir; beyanname dönemi izleyen onuncu günü akşamına kadar verilir. 20 Mart 2026
      teslimi 16-31 Mart dönemine girdiğinden son gün 10 Nisan 2026'dır. (III) sayılı listedeki mallar için vergilendirme
      dönemi birer aylık olup beyanname dönemi izleyen ayın onbeşinci günü akşamına kadar verilir; Mart 2026 dönemi için son
      gün 15 Nisan 2026'dır.
    celdiriciler:
      A: '(I) sayılı liste için 1-15 Mart dönemi (beyan: 25 Mart) esas alınmıştır; 20 Mart teslimi 16-31 Mart dönemine girer
        ve beyan 10 Nisan''a kadar verilir.'
      C: (III) sayılı liste için de onuncu gün kuralı uygulanmıştır; bu listedeki mallarda beyan, dönemi izleyen ayın onbeşinci
        günü akşamına kadardır.
      D: (I) sayılı listeye de dönemi izleyen ayın onbeşinci günü kuralı uygulanmıştır; (I) sayılı listede dönem yarım aylıktır
        ve beyan dönemi izleyen onuncu gündür.
      E: Hem (I) sayılı listedeki dönem yanlış belirlenmiş (25 Mart) hem de (III) sayılı listeye onuncu gün kuralı uygulanmıştır
        (10 Nisan).
    hesap_adimlari: []
