- id: YMM-HSV-OTV-0083
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: taşıt dönüşümünde vergi
  tip: hesaplama
  zorluk: 3
  kok: (II) sayılı listede yer alan ve 87.04 tarife pozisyonunda ("Diğerleri" grubu hariç) bulunan bir taşıt, ilk iktisabında
    600.000 TL matrah üzerinden %25 oranla vergilendirilerek 150.000 TL ÖTV ödenmiştir. Taşıt, ilk iktisap tarihinden 3 yıl
    sonra 87.03 tarife pozisyonundaki mala dönüştürülmüş ve adına kayıt ve tescil yapılmıştır. Dönüşüm tarihinde taşıtın piyasa
    değeri 1.000.000 TL'dir ve dönüştürülen mal için değişikliğin kayıt ve tescili tarihinde geçerli olan ÖTV oranı %80 kabul
    edilecektir. ÖTV Kanunu md. 15/2-b uyarınca dönüşüm nedeniyle ayrıca ödenecek ÖTV kaç TL'dir?
  secenekler:
    A: '150.000'
    B: '330.000'
    C: '480.000'
    D: '630.000'
    E: '650.000'
  dogru: B
  aciklama:
    dogru_neden: 'ÖTVK md. 15/2-b''ye göre (II) sayılı listedeki kayıt ve tescile tabi malların ilk iktisap tarihinden itibaren
      beş yıl içinde 87.03 veya 87.04 ("Diğerleri" grubu hariç) pozisyonlarındaki mallara dönüştürülmesi halinde, daha önce
      ödenen vergi mahsup edilerek, ilk iktisabındaki matrah esas alınır ve dönüşümün kayıt ve tescili tarihinde dönüştürülen
      mallar için geçerli oran üzerinden vergi alınır. Dönüşüm 3 yıl sonra yapıldığından hüküm uygulanır: 600.000 × %80 =
      480.000 TL; mahsup edilecek 150.000 TL düşülünce 330.000 TL ödenir. Püf noktaları: (1) Matrah, dönüşüm anındaki piyasa
      değeri değil ilk iktisap matrahıdır. (2) Önceden ödenen vergi mahsup edilir. (3) Oran, dönüşüm tarihinde geçerli oran
      olup ilk oran değildir.'
    celdiriciler:
