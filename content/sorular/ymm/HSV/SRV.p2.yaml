- id: YMM-HSV-SRV-0021
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: emlak vergisi matrah ve oranları
  tip: uygulama
  zorluk: 1
  kok: Bay (D), kendisine ait arsa üzerinde inşa ettirdiği binanın inşaatını Eylül 2026’da tamamlamıştır. Emlak Vergisi Kanunu’na
    göre binanın bina vergisi mükellefiyetinin başlaması ile arsanın arazi vergisi mükellefiyetinin sona ermesi hangi seçenekte
    doğru verilmiştir?
  secenekler:
    A: Bina vergisi 2026 yılının ikinci taksitinden başlar; arsanın vergisi de aynı taksitten itibaren sona erer.
    B: Bina vergisi 2027 bütçe yılından itibaren başlar; arsanın vergisi de 2027 bütçe yılından itibaren sona erer.
    C: Bina vergisi 2027 bütçe yılından itibaren başlar; arsanın vergisi 2026 yılının ikinci taksitinden itibaren sona erer.
    D: Bina vergisi inşaatın tamamlandığı Eylül 2026’dan başlar; arsanın vergisi de bu tarihte sona erer.
    E: Bina vergisi 2027 bütçe yılından itibaren başlar; arsanın vergisi binanın inşa edildiği yılı izleyen dört yıl boyunca
      alınmaya devam eder.
  dogru: B
  aciklama:
    dogru_neden: Yeni bina inşa edilmesi md. 33/1’e göre vergi değerini tadil eden bir sebeptir ve md. 9’a göre bina vergisi
      mükellefiyeti bu değişikliğin vuku bulduğu tarihi takip eden bütçe yılından, yani 2027’den başlar. Md. 19’a göre üzerine
      bina yapılan arsanın arazi vergisi mükellefiyeti de inşaatın bittiği yılı takip eden bütçe yılından itibaren sona erer.
      Böylece arsa vergisi 2026 sonuna kadar alınır, bina vergisi 2027’de başlar.
    celdiriciler:
      A: “Takip eden taksit” kuralı yanan, yıkılan veya muafiyet kazanan binalarda mükellefiyetin sona ermesi için öngörülmüştür;
        yeni inşaatta mükellefiyet takip eden bütçe yılında başlar.
      C: Bina vergisinin başlangıcı doğrudur; ancak arsanın vergisi taksit itibarıyla değil, inşaatın bittiği yılı takip eden
        bütçe yılından itibaren sona erer.
      D: Emlak vergisinde mükellefiyet, değişikliğin olduğu tarihte değil takip eden bütçe yılında başlar ve sona erer.
      E: Dört yıllık süre, yeni binanın vergisinin arsa vergisinden az olamayacağı kuralına ilişkindir; arsanın arazi vergisi
        mükellefiyeti 2027’den itibaren sona erer.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 9/1-a
    alinti: a) 33 üncü maddenin (1) ilâ (7) numaralı fıkralarında yazılı vergi değerini tadil eden sebeplerin doğması halinde
      bu değişikliklerin vuku bulduğu, aynı maddenin (8) numaralı fıkrasında yazılı halde ise bu duruma bağlı olarak takdir
      işleminin yapıldığı tarihi,
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 19/son
    alinti: Üzerine bina yapılan arsanın Arazi Vergisi mükellefiyeti, inşaatın bittiği yılı takipeden bütçe yılından itibaren
      sona erer.
  gecerlilik:
    baslangic: '2002-04-09'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi HSV-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
