- id: YMM-HSV-SRV-0024
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: emlak vergisi matrah ve oranları
  tip: hesaplama
  zorluk: 3
  kok: Büyükşehir belediyesi sınırları içinde bulunan arsası üzerinde Bay (B) tarafından inşa ettirilen tek bağımsız bölümlü
    konutun inşaatı 2026 yılında tamamlanmış ve konut, Bay (B) tarafından mesken olarak kullanılmaya başlanmıştır. 2027 yılı
    için binanın bina vergi değeri 1.200.000 TL, arsasının vergi değeri 1.000.000 TL’dir. Kanunda yazılı oranlar dışında Cumhurbaşkanınca
    belirlenmiş bir oran bulunmamaktadır; muafiyet veya indirim şartları yoktur. Emlak Vergisi Kanunu’na göre bu bina için
    2027 yılında ödenecek bina vergisinin birinci taksiti kaç TL’dir?
  secenekler:
    A: '600'
    B: '1.200'
    C: '2.400'
    D: '3.000'
    E: '6.000'
  dogru: D
  aciklama:
    dogru_neden: 'Meskenlerde bina vergisi oranı binde 1’dir ve büyükşehir belediye sınırlarında %100 artırımlı (binde 2)
      uygulanır: 1.200.000 × binde 2 = 2.400 TL. Ancak md. 8 son fıkraya göre yeni inşa edilen binanın vergisi arsasının vergisinden
      az olamaz ve bu hüküm inşaatın bittiği yılı takip eden bütçe yılından itibaren dört yıl uygulanır. Arsalarda oran binde
      3, büyükşehirde binde 6’dır: 1.000.000 × binde 6 = 6.000 TL. Bina vergisi 6.000 TL olarak alınır ve iki eşit taksitte
      ödendiğinden birinci taksit 3.000 TL’dir. Püf noktaları: 2027, inşaatın bittiği yılı izleyen ilk yıldır; dört yıllık
      asgari vergi kuralı devrededir. Karşılaştırmada arsaya arazi oranı değil arsa oranı ve büyükşehir artırımı uygulanır;
      son olarak yıllık vergi taksite bölünür.'
    celdiriciler:
      A: Büyükşehir artırımı uygulanmadan bina vergisi (1.200 TL) hesaplanıp taksite bölünmüştür; ayrıca arsa vergisi karşılaştırması
        yapılmamıştır.
      B: Bina vergisi doğru (2.400 TL) hesaplanıp taksite bölünmüş, ancak yeni binanın vergisinin arsa vergisinden az olamayacağı
        kuralı uygulanmamıştır.
      C: Arsa karşılaştırması yapılmamış ve yıllık vergi taksite bölünmemiştir.
      E: Yıllık bina vergisi doğru bulunmuş, ancak vergi iki eşit taksitte ödendiğinden birinci taksit yıllık tutarın yarısıdır.
    hesap_adimlari:
    - 'Bina vergisi: 1.200.000 × (binde 1 × 2) = 2.400 TL'
    - 'Arsa vergisi: 1.000.000 × (binde 3 × 2) = 6.000 TL'
    - 'Yeni bina 4 yıl kuralı: bina vergisi = max(2.400; 6.000) = 6.000 TL'
    - 'Birinci taksit: 6.000 / 2 = 3.000 TL'
  kaynaklar:
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 8/1
    alinti: Bina vergisinin oranı meskenlerde binde bir, diğer binalarda ise binde ikidir. Bu oranlar, 5216 sayılı Kanunun
      uygulandığı büyük şehir belediye sınırları ve mücavir alanlar içinde % 100 artırımlı uygulanır.
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 8/son
    alinti: Yeni inşa edilen bina veya binaların vergisi, arsasının (veya arsa payının) vergisinden az olamaz.
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 8/son
    alinti: Bu hüküm binaların inşalarının sona erdiği yılı takip eden bütçe yılından itibaren dört yıl uygulanır.
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 18
    alinti: Arazi vergisinin oranı binde bir, arsalarda ise binde üçtür.
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 30/1
    alinti: Emlak Vergisi birinci taksidi Mart, Nisan ve Mayıs aylarında, ikinci taksidi Kasım ayı içinde olmak üzere iki
      eşit taksitte ödenir.
  gecerlilik:
    baslangic: '2003-08-07'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bina = 1200000 * 1 * 2 / 1000

      arsa = 1000000 * 3 * 2 / 1000

      yillik = max(bina, arsa)

      sonuc = yillik / 2'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi HSV-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
