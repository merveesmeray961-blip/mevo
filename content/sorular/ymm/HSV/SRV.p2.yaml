- id: YMM-HSV-SRV-0023
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: veraset ve intikal vergisi
  tip: uygulama
  zorluk: 2
  kok: 'Türk vatandaşı Bay (H), tedavi için bulunduğu Almanya’da 10 Mart 2026’da vefat etmiştir. Mirasçıları, İstanbul’da
    yaşayan eşi Bayan (E), Almanya’da yaşayan oğlu Bay (O) ve Fransa’da yaşayan kızı Bayan (K)’dır. Veraset ve intikal vergisi
    beyannamesiyle ilgili aşağıdaki ifadelerden hangileri doğrudur?

    I. Bayan (E)’nin beyanname verme süresi 10 Eylül 2026’da sona erer.

    II. Bay (O)’nun beyanname verme süresi 10 Temmuz 2026’da sona erer.

    III. Bayan (K)’nın beyanname verme süresi 10 Eylül 2026’da sona erer.

    IV. Beyanname verme süresinin sonundan başlayarak 15 gün içinde verilen beyanname nedeniyle vergi ziyaı olmamış sayılır.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'VİVK md. 9/1-b’ye göre ölüm yabancı bir memlekette olmuşsa beyanname süresi, mükellefler Türkiye’de ise
      ölüm tarihini takip eden altı ay (Bayan E: 10 Eylül 2026), müteveffanın bulunduğu memlekette ise dört ay (Bay O: 10
      Temmuz 2026), başka bir yabancı memlekette ise sekiz aydır (Bayan K: 10 Kasım 2026). VUK md. 342’ye göre beyanname verme
      süresinin sonundan başlayarak 15 gün beklenir; beyanname bu süre içinde verilirse vergi ziyaı olmamış sayılır. Bu nedenle
      I, II ve IV doğru, III yanlıştır.'
    celdiriciler:
      A: IV de doğrudur; VİV’e özgü 15 günlük ek süre VUK md. 342’de düzenlenmiştir.
      B: 'III yanlıştır: Bayan (K), ölünün bulunduğu ülke dışındaki başka bir yabancı ülkede olduğundan süresi sekiz aydır
        (10 Kasım 2026).'
      C: 'I de doğrudur: ölüm yurt dışında olduğundan Türkiye’deki mirasçı için süre altı aydır.'
      E: III yanlıştır; Fransa’daki mirasçı için süre altı değil sekiz aydır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 9/1-b
    alinti: b) Ölüm yabancı bir memlekette vukubulmuş ise mükelleflerin Türkiye'de bulunmaları halinde ölüm tarihini takibeden
      altı ay içinde, mükellefler müteveffanın bulunduğu memlekette oldukları takdirde ölüm tarihini takibeden dört ay içinde,
