        Mart’ta yapılmıştır.
      B: Taksit süresi geçmiş kısım için kanun tescilden itibaren bir aylık ödeme süresi tanır; bu süre içinde ödemede gecikme
        söz konusu olmaz.
      D: Yalnız elektrik motoru olan otomobillerde tarifedeki tutarın %25’i uygulanır; tam tutar alınmaz.
      E: Vergi Ocak ve Temmuz’da iki eşit taksitte ödenir; tescilden önce ödeme kuralı yoktur, yalnız Ocak ve Temmuz’daki
        malik değişikliklerinde vergi değişiklikten önce ödenir.
    hesap_adimlari:
    - 'Satır: 140 kW → 11–12 numaralı satırlar; taşıt değerine göre 12 numaralı satır'
    - 'Vergi: 40.000 × %25 = 10.000 TL (yıllık)'
    - İlk altı ayda tescil → yıllık tahakkuk; Ocak taksiti 5.000 TL tescilden itibaren 1 ay içinde, Temmuz taksiti 5.000 TL
