      eden son altı aylık dönemin başından, son altı ayında yapılmışsa takip eden takvim yılı başından itibaren dikkate alınır.
      Eylül son altı aya düştüğünden değişiklik izleyen yılın başından itibaren dikkate alınır; içinde bulunulan dönemin başına
      (Temmuz) yürütülmez.
    celdiriciler:
      A: 'Doğrudur: md. 8’e göre silinme ilk altı ayda yapılmışsa mükellefiyet ikinci altı aylık dönemin başından sona erer.'
      B: 'Doğrudur: md. 9’a göre Ocak ve Temmuz aylarında devir veya satış nedeniyle malik değişikliğinde vergi değişiklikten
        önce ödenir.'
      C: 'Doğrudur: md. 11/son fıkra bu kabulü öngörür.'
      D: 'Doğrudur: md. 4/c’de %90 ve üzeri engellilerin adlarına kayıtlı taşıtlar doğrudan istisnadır; özel tertibat şartı
        diğer engelliler için aranır.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 11/1
    alinti: bu değişiklik, takvim yılının ilk altı ayında yapılmış ise takip eden son altı aylık dönemin başından, son altı
      ayında yapılmış ise takip eden takvim yılı başından itibaren dikkate alınır ve vergi, yeni duruma göre ödenir.
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 8
    alinti: silinme takvim yılının ilk altı ayı içinde yapılmış ise ikinci altı aylık dönemin başından, ikinci altı aylık
      dönem içinde yapılmışsa takipeden takvim yılı başından itibaren mükellefiyet sona erer.
