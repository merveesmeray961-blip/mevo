    12 numaralı satıra isabet etmektedir; bu satırda 1-3 yaş grubu için 2026 yılı vergi tutarının 40.000 TL olduğu kabul edilecektir.
    Motorlu Taşıtlar Vergisi Kanunu’na göre (E) A.Ş.’nin bu taşıt için 2026 yılında ödeyeceği vergi ve ödeme zamanı hangi
    seçenekte doğru verilmiştir?
  secenekler:
    A: 5.000 TL; yalnız ikinci altı aylık döneme ilişkin vergi tahakkuk eder ve Temmuz ayında ödenir.
    B: 10.000 TL; Ocak taksitine isabet eden 5.000 TL gecikme zammıyla hemen, kalan 5.000 TL Temmuz’da ödenir.
    C: 10.000 TL; Ocak taksitine isabet eden 5.000 TL tescilden itibaren bir ay içinde, kalan 5.000 TL Temmuz’da ödenir.
    D: 40.000 TL; Ocak taksitine isabet eden 20.000 TL tescilden itibaren bir ay içinde, kalan 20.000 TL Temmuz’da ödenir.
    E: 10.000 TL; vergi tescil tarihinde tahakkuk eder ve yıllık tutarın tamamı tescil işleminden önce ödenir.
  dogru: C
  aciklama:
    dogru_neden: 'MTVK md. 5’e göre yalnız elektrik motoru olan otomobiller, motor güçlerine göre belirlenen satırdaki (120–150
      kW için 11 ve 12 numaralı satırlar) vergi tutarının %25’i oranında vergilendirilir: 40.000 × %25 = 10.000 TL. Tescil
      yılın ilk altı ayında yapıldığından mükellefiyet takvim yılı başından itibaren dikkate alınır (md. 7/a) ve vergi yıllık
      olarak tahakkuk eder. Md. 9’a göre yıl içinde ilk defa tescilde taksit süresi geçmiş kısım (Ocak taksiti: 5.000 TL)
      tescilden itibaren bir ay içinde, ikinci taksit (5.000 TL) Temmuz ayında ödenir. Püf noktaları: MTV’de kıst dönem yoktur;
      ilk altı ayda tescil edilen taşıt için yıllık vergi tahakkuk eder. Elektrikli taşıtta indirim satırı değiştirmez, satırdaki
      tutarın %25’i alınır.'
    celdiriciler:
