  secenekler:
    A: Trafik sicilindeki kaydı Mart ayında silinen bir taşıtın vergi mükellefiyeti, ikinci altı aylık dönemin başından itibaren
      sona erer.
    B: Ocak veya Temmuz ayı içinde satış nedeniyle malik değişikliği yapılacaksa vergi, bu değişiklik yapılmadan önce ödenir.
    C: Taşıtlar, tescil belgesinde yazılı model yılında bir yaşında kabul edilir.
    D: Engellilik oranı %90 ve daha fazla olanların adlarına kayıtlı taşıtlarda istisna için özel tertibat şartı aranmaz.
    E: Eylül’de motor silindir hacminde yapılan ve vergiyi artıran değişiklik, Temmuz’da başlayan dönemden itibaren dikkate
      alınır.
  dogru: E
  aciklama:
