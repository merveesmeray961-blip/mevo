- id: YMM-HSV-SRV-0026
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: veraset ve intikal vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Bay (F), 20 Nisan 2026’da kızı Bayan (G)’ye bir dükkânı bağışlamıştır. Dükkânın emlak vergisi değeri 9.000.000 TL,
    piyasa değeri 15.000.000 TL’dir. Dükkân, Bay (F)’nin daha önce kullandığı ve ipotekle teminat altına alınan bir kredinin
    teminatıdır; bağış tarihinde bu krediden 1.933.065 TL borç kalmıştır ve bağış sözleşmesine göre bu borcu Bayan (G) üstlenmiştir.
    2026 yılında ivazsız intikallerde istisna tutarı 66.935 TL’dir. İvazsız intikal tarifesi: ilk 3.000.000 TL için %10, sonra
    gelen 7.000.000 TL için %15, sonra gelen 15.000.000 TL için %20, sonra gelen 30.000.000 TL için %25, 55.000.000 TL’yi
    aşan kısım için %30. Veraset ve İntikal Vergisi Kanunu’na göre Bayan (G)’nin beyannamesi üzerine ilk tarhiyatta hesaplanacak
    vergi kaç TL’dir?'
  secenekler:
    A: '150.000'
    B: '350.000'
    C: '450.000'
    D: '900.000'
    E: '975.000'
  dogru: C
  aciklama:
    dogru_neden: 'İlk tarhiyatta gayrimenkuller emlak vergisine esas değerle değerlenir (md. 10/b): 9.000.000 TL. Sağlararası
      iktisaplarda intikal eden malın aynına taallük eden borçlar, bağışlayan üstlenmemişse indirilir (md. 12/b): 9.000.000
      − 1.933.065 = 7.066.935 TL. İvazsız intikal istisnası (md. 4/d) düşülür: 7.066.935 − 66.935 = 7.000.000 TL. Babadan
      çocuğa ivazsız intikalde tarifedeki oranların yarısı uygulanır (md. 16/2): 3.000.000 × %5 = 150.000; 4.000.000 × %7,5
      = 300.000; toplam 450.000 TL. Püf noktaları: Değerleme ölçüsü piyasa değeri değil emlak vergisi değeridir; borcu bağışlanan
      üstlendiği için indirilir (bağışlayan üstlenseydi indirilemezdi); yarım oran her dilime ayrı ayrı uygulanır.'
    celdiriciler:
      A: Veraset yoluyla intikal tarifesi (%1, %3) uygulanmıştır; bağış ivazsız intikaldir.
      B: Yarım oran kademeli uygulanmamış, matrahın tamamına ilk dilimin yarım oranı (%5) uygulanmıştır.
      D: Babadan kıza intikalde oranların yarıya indirileceği unutulmuş, tam ivazsız intikal oranları uygulanmıştır.
      E: Gayrimenkul piyasa değeriyle (15.000.000 TL) değerlenmiştir; ilk tarhiyatta emlak vergisi değeri esas alınır.
    hesap_adimlari:
    - 'Değer (emlak vergisi değeri): 9.000.000 TL'
    - 'Malın aynına taallük eden borç: − 1.933.065 TL → 7.066.935 TL'
    - 'İstisna: − 66.935 TL → matrah 7.000.000 TL'
    - 'Vergi (yarım oran): 3.000.000 × %5 + 4.000.000 × %7,5 = 150.000 + 300.000 = 450.000 TL'
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 10/b
    alinti: Gayrimenkuller ticari işletmeye dahil olsun veya olmasın Emlak Vergisine esas olan değerle değerlenir.
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 12/b
    alinti: b) Diğer suretle iktisaplarda intikal eden malın aynına taallük eden borçlarla vergi borçları (Şu kadar ki, hibe
      eden hibe ettiği mala taallük eden borçları kendi üzerine almış veya öyle taahhüdetmiş ise bu borçlar nazara alınmaz);
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 16/2
    alinti: Bir şahsa ana, baba, eş ve çocuklarından (evlatlıktan evlat edinenlere yapılan ivazsız intikaller hariç) ivazsız
      mal intikali halinde vergi, ivazsız intikallere ilişkin tarifede yer alan oranların yarısı uygulanarak hesaplanır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: "matrah = 9000000 - 1933065 - 66935\ndilimler = [(3000000, 0.10), (7000000, 0.15), (15000000, 0.20), (30000000,\
      \ 0.25), (10**12, 0.30)]\nvergi = 0\nkalan = matrah\nfor tutar, oran in dilimler:\n    p = min(kalan, tutar)\n    vergi\
      \ += p * oran / 2\n    kalan -= p\n    if kalan <= 0:\n        break\nsonuc = round(vergi, 2)"
