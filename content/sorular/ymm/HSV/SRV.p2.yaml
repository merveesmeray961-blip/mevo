- id: YMM-HSV-SRV-0022
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: veraset ve intikal vergisi
  tip: uygulama
  zorluk: 1
  kok: Bay (M), 3 Mart 2026’da vefat etmiştir. Oğlu Bay (N), babasından kendisine intikal eden ve (D) Bankasında bulunan 800.000
    TL mevduatı, veraset ve intikal vergisinin ödendiğine dair vergi dairesinden alınmış tasdiknameyi ibraz etmeden çekmek
    istemektedir. Veraset ve İntikal Vergisi Kanunu’na göre bankanın yapması gereken işlem aşağıdakilerden hangisidir?
  secenekler:
    A: '%5 oranında 40.000 TL tevkifat yaparak 760.000 TL’yi öder ve tevkif ettiği parayı en geç bir hafta içinde yatırır.'
    B: Tasdikname ibraz edilmedikçe mevduatın hiçbir kısmını ödeyemez; ödeme vergi tahakkuk ettikten sonra yapılır.
    C: '%15 oranında 120.000 TL tevkifat yaparak 680.000 TL’yi öder ve tevkif ettiği parayı en geç bir hafta içinde yatırır.'
    D: '%5 oranında 40.000 TL tevkifat yapar; tevkif ettiği parayı izleyen ayın 26’ncı günü muhtasar beyanname ile öder.'
    E: Mevduatı tamamen öder; vergi yalnız mirasçının vereceği beyanname üzerine tarh edilip kendisinden aranır.
  dogru: A
  aciklama:
    dogru_neden: VİVK md. 17’ye göre bankalar, verginin ödendiğine dair tasdikname ibraz etmeyen hak sahiplerinin istihkaklarından
      veraset yoluyla intikallerde %5, ivazsız intikallerde %15 oranında vergi karşılığı tevkifat yaptıktan sonra bakiyeyi
      verebilir ve tevkif ettikleri parayı en geç bir hafta içinde yatırıp vergi dairesine yazıyla bildirir. İntikal veraset
      yoluyla olduğundan tevkifat 800.000 × %5 = 40.000 TL, ödenecek tutar 760.000 TL’dir.
    celdiriciler:
      B: Kanun tasdikname yokluğunda ödemeyi yasaklamaz; tevkifat yapılarak bakiye ödenebilir.
      C: '%15 oranı ivazsız (sağlararası) intikallerde uygulanır; ölüm nedeniyle intikalde oran %5’tir.'
      D: Oran doğrudur; ancak tevkif edilen para muhtasar beyannameyle değil, en geç bir hafta içinde yatırılır.
      E: Bankanın tasdikname arama ve tevkifat yükümlülüğü vardır; tevkifat yapmadan ödeme yapan, tevkif etmesi gereken parayı
        gecikme zammıyla öder.
    hesap_adimlari:
    - 'Tevkifat: 800.000 × %5 = 40.000 TL'
    - 'Mirasçıya ödenecek: 760.000 TL'
  kaynaklar:
