  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: değerli konut vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Bay (D)''nin Türkiye''deki mesken nitelikli taşınmazlarının 2026 yılı bina vergi değerleri şöyledir (hepsinin tam
    maliki Bay (D)''dir; hiçbiri kiraya verilmemiştir):


    - Ankara''daki daire: 15.000.000 TL

    - İzmir''deki daire: 20.000.000 TL

    - İstanbul''daki villa: 30.000.000 TL


    2026 yılı için değerli konut vergisi sınırı 17.711.000 TL''dir. Tarife: 17.711.000 TL ile 26.567.000 TL arasında olanlarda
    aşan kısmın binde 3''ü; 35.425.000 TL''ye kadar olanlarda 26.567.000 TL''si için 26.568 TL, fazlası binde 6''dır. Emlak
    Vergisi Kanunu''na göre Bay (D)''nin 2026 yılı için ödeyeceği değerli konut vergisi toplamı kaç TL''dir?

    '
  secenekler:
    A: '6.867'
    B: '36.867'
    C: '47.166'
    D: '54.033'
    E: '73.734'
  dogru: C
  aciklama:
    dogru_neden: 'Ankara''daki daire sınırın altında olduğundan vergi konusuna girmez. Birden fazla meskeni olanların değerli
      konut vergisi konusuna giren en düşük değerli tek meskeni muaftır (md. 46/b): konuya giren İzmir (20.000.000) ve İstanbul
      (30.000.000) arasından İzmir dairesi muaftır. İstanbul villası: 26.568 + (30.000.000 − 26.567.000) × binde 6 = 26.568
      + 20.598 = 47.166 TL. Püf noktaları: Muafiyet tüm meskenler içindeki en düşük değerliye değil, vergi konusuna giren
      meskenler içindeki en düşük değerliye uygulanır.'
    celdiriciler:
      A: Muafiyet yanlış meskene uygulanmış, yalnız İzmir dairesi vergilendirilmiştir ((20.000.000 − 17.711.000) × binde 3).
      B: Sınırı aşan kısmın tamamına binde 3 uygulanmıştır ((30.000.000 − 17.711.000) × binde 3).
      D: Muafiyet sınırın altındaki Ankara dairesine uygulanmış, İzmir ve İstanbul birlikte vergilendirilmiştir (6.867 + 47.166).
      E: Sınırı aşan kısmın tamamına binde 6 uygulanmıştır ((30.000.000 − 17.711.000) × binde 6).
    hesap_adimlari:
    - Ankara < 17.711.000 → konu dışı
    - 'Konuya girenler: İzmir 20.000.000, İstanbul 30.000.000 → İzmir muaf'
    - İstanbul = 26.568 + 3.433.000 × 0,006 = 47.166 TL
  kaynaklar:
