    madde: md. 46/b
    alinti: vergisi konusuna giren en düşük değerli mesken nitelikli tek taşınmazı (intifa hakkına sahip
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu (EVK Genel Tebliği Seri No 88)
    madde: md. 44
    alinti: 7.500 (26.568) TL, fazlası için (Binde 6)
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu (EVK Genel Tebliği Seri No 88)
