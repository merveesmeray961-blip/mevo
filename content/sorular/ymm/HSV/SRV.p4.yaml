- id: YMM-HSV-SRV-0060
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: veraset ve intikal vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Bay (B), Mart 2026''da emlak vergi değeri 4.566.935 TL olan dairesini oğlu Bay (C)''ye bağışlamıştır. Daire üzerinde,
    dairenin alımı için kullanılan ve ipotekle teminat altına alınmış 500.000 TL banka borcu bulunmakta olup bu borcu Bay
    (C) üstlenmiştir; Bay (B) borcu kendi üzerine almamıştır. Bay (C)''nin başka ivazsız iktisabı yoktur.


    2026 yılı için ivazsız intikallerde istisna tutarı 66.935 TL; ivazsız intikal tarifesi ilk 3.000.000 TL için %10, sonra
    gelen 7.000.000 TL için %15''tir. Veraset ve İntikal Vergisi Kanunu''na göre Bay (C)''nin ödeyeceği veraset ve intikal
    vergisi kaç TL''dir?

    '
  secenekler:
    A: '60.000'
    B: '225.000'
    C: '262.500'
    D: '300.000'
    E: '450.000'
  dogru: B
  aciklama:
    dogru_neden: 'İvazsız iktisaplarda intikal eden malın aynına ait borçlar indirilir; bağışlayan borcu üstlenmediğinden
      500.000 TL düşülür (md. 12/b). İvazsız intikal istisnası 66.935 TL''dir (md. 4/d). Matrah: 4.566.935 − 500.000 − 66.935
      = 4.000.000 TL. Babadan oğula ivazsız intikalde ivazsız tarifedeki oranların yarısı uygulanır (md. 16): 3.000.000 ×
      %5 + 1.000.000 × %7,5 = 150.000 + 75.000 = 225.000 TL. Püf noktaları: Bağış veraset değildir, veraset tarifesi uygulanmaz;
      ana-baba-çocuk arasındaki bağışta ivazsız oranlar yarıya iner ve füruğa tanınan miras istisnası değil ivazsız intikal
      istisnası düşülür.'
    celdiriciler:
      A: Veraset tarifesi uygulanmıştır (3.000.000 × %1 + 1.000.000 × %3).
      C: Malın aynına ait borç indirilmemiştir (matrah 4.500.000; 150.000 + 1.500.000 × %7,5).
      D: Matrahın tamamına ikinci dilimin yarı oranı (%7,5) uygulanmıştır.
      E: Ana-baba-çocuk arasında oranların yarıya indirilmesi gözden kaçırılmıştır (300.000 + 150.000).
    hesap_adimlari:
    - Matrah = 4.566.935 − 500.000 − 66.935 = 4.000.000
    - İlk 3.000.000 × %5 = 150.000
    - Kalan 1.000.000 × %7,5 = 75.000
    - Vergi = 225.000 TL
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 12/b
    alinti: b) Diğer suretle iktisaplarda intikal eden malın aynına taallük eden borçlarla vergi
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 4/d
    alinti: lirası (66.935 TL);
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 16
    alinti: intikaller hariç) ivazsız mal intikali halinde vergi, ivazsız intikallere ilişkin tarifede yer alan
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'matrah = 4566935 - 500000 - 66935

      sonuc = 3000000 * 5 / 100 + (matrah - 3000000) * 7.5 / 100'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S4
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-19'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-19'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-19'
        not: 'baş hakem: kör hakem E (450.000) işaretledi; VİV md. 16''ya göre ana-babadan çocuğa ivazsız intikalde oranların
          yarısı uygulanır, anahtar B (225.000) doğru'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-19'
    kim: uretici
    ne: harici teslim t_S4.yaml, satır 74
  - tarih: '2026-10-19'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
