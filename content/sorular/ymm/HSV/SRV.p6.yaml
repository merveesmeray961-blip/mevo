- id: YMM-HSV-SRV-0067
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: esham ve yabancı paraların değerlenmesi
  tip: hesaplama
  zorluk: 3
  kok: 'Bay (S), 25 Mayıs 2026''da vefat etmiştir. Terekedeki aşağıdaki varlıkların, Veraset ve İntikal Vergisi Kanunu md.
    10''daki ölçülere göre ilk tarhiyatta beyan edilecek değerleri toplamı kaç TL''dir? (İstisna ve borç tenzilleri dikkate
    alınmayacaktır.)


    | Varlık | Bilgi |

    |---|---|

    | (A) A.Ş. payları, 10.000 adet (borsada kayıtlı) | Ölümden önceki üç yıl içindeki en son borsa işlemi 18 Mayıs 2026''da,
    pay başına 70 TL; itibari değer pay başına 10 TL |

    | (B) A.Ş. payları, 80.000 adet (borsada kayıtlı) | Son borsa işlemi 2 Mart 2022''de, pay başına 130 TL; üç yıl içinde
    işlem görmemiştir; itibari değer pay başına 10 TL |

    | (C) A.Ş. payları, 5.000 adet (borsada kayıtlı değil) | İtibari değer pay başına 4 TL; şirket özkaynaklarına göre pay
    başına gerçek değer 25 TL |

    | 1.000 ABD doları nakit | Borsa rayici yoktur; Maliye Bakanlığınca tespit edilen kur 30 TL |'
  secenekler:
    A: '950.000'
    B: 1.520.000
    C: 1.550.000
    D: 1.655.000
    E: 11.150.000
  dogru: C
  aciklama:
    dogru_neden: 'VİV md. 10/d''ye göre borsada kayıtlı esham, ölüm tarihine takaddüm eden üç yıl içindeki en son muamele
      değeriyle; borsada kayıtlı olmayan veya kayıtlı olup üç yıl içinde muamele görmeyen esham itibari değerle değerlenir.
      Yabancı paralar borsa rayiciyle, rayiç yoksa Maliye Bakanlığınca tespit olunan kura göre değerlenir (md. 10/f). Hesap:
      (A) 10.000 × 70 = 700.000; (B) 80.000 × 10 = 800.000; (C) 5.000 × 4 = 20.000; döviz 1.000 × 30 = 30.000; toplam 1.550.000
      TL. Püf noktaları: ''Borsada kayıtlı olmak'' tek başına piyasa değeriyle değerlemeyi gerektirmez; son işlemin ölümden
      önceki üç yıl içinde olup olmadığına bakın. Gerçek (özkaynak) değer ve 130 TL''lik eski işlem değeri çeldirici veridir.
      Döviz de maldır ve toplama dahildir.'
    celdiriciler:
      A: Tüm paylar itibari değerle değerlenmiştir (100.000 + 800.000 + 20.000 + 30.000); oysa (A) payları üç yıl içindeki
        son muamele değeriyle değerlenir.
      B: Yabancı para unutulmuştur (700.000 + 800.000 + 20.000); döviz de mal olup Bakanlıkça tespit edilen kurla değerlenir.
      D: (B) payları 2022'deki son işlem değeriyle (80.000 × 130 = 10.400.000) değerlenmiştir; işlem üç yıllık süre dışında
        kaldığından itibari değer esas alınır.
      E: (C) payları özkaynaklara göre gerçek değerle (5.000 × 25 = 125.000) değerlenmiştir; borsada kayıtlı olmayan paylar
        itibari değerle değerlenir.
    hesap_adimlari:
    - '(A): 10.000 × 70 = 700.000 TL'
    - '(B): üç yıl içinde işlem yok → 80.000 × 10 = 800.000 TL'
    - '(C): kayıtlı değil → 5.000 × 4 = 20.000 TL'
    - 'Döviz: 1.000 × 30 = 30.000 TL'
    - 'Toplam: 1.550.000 TL'
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 10/d
    alinti: d) Esham; borsada kayıtlı ise ölüm tarihine takaddüm eden üç yıl içindeki en son muamele değeri ile değerlenir.
      Borsada kayıtlı değil ise veya kayıtlı olup da üç yıl içinde muamele görmemiş ise itibari değerle değerlenir.
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 10/f
    alinti: f) Yabancı paralar; borsa rayici ile; borsada rayici yoksa Maliye Bakanlığınca tespit olunacak kura göre değerlenir.
