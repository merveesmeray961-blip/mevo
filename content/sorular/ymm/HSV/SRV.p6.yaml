  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: ivazsız intikalde tarife ve yarı oran
  tip: hesaplama
  zorluk: 2
  kok: Bay (E), 14 Nisan 2026'da evlatlığı Bay (F)'den 4.066.935 TL nakit bağış almıştır. Bu soruda 2026 yılı için ivazsız
    intikallerde istisna tutarının 66.935 TL, ivazsız intikal tarifesinin ise ilk 3.000.000 TL için %10, sonra gelen 7.000.000
    TL için %15 olduğu; veraset yoluyla intikal tarifesinin ilk 3.000.000 TL için %1, sonra gelen 7.000.000 TL için %3 olduğu
    kabul edilecektir. Bay (E)'nin ödeyeceği veraset ve intikal vergisi kaç TL'dir?
  secenekler:
    A: '60.000'
    B: '225.000'
    C: '400.000'
    D: '450.000'
    E: 460.040,25
  dogru: D
  aciklama:
    dogru_neden: 'VİV md. 16''ya göre ana, baba, eş ve çocuklara yapılan ivazsız intikallerde tarife oranlarının yarısı uygulanır;
      ancak evlatlıktan evlat edinenlere yapılan ivazsız intikaller bu indirimin dışındadır. Bay (E) evlat edinen olduğundan
      tam tarife uygulanır. Md. 4/d uyarınca 66.935 TL istisna düşülür: 4.066.935 − 66.935 = 4.000.000 TL; 3.000.000 × %10
      = 300.000; 1.000.000 × %15 = 150.000; toplam 450.000 TL.'
    celdiriciler:
      A: Veraset yoluyla intikal tarifesi (%1 ve %3) uygulanmıştır; bağış ivazsız intikaldir ve ivazsız tarife geçerlidir.
      B: Yarı oran (450.000 / 2) uygulanmıştır; evlatlıktan evlat edinene yapılan intikal yarı oran dışındadır.
      C: Tüm matrah tek oranla (%10) vergilendirilmiştir; tarife dilimlidir ve ikinci dilim %15'tir.
      E: İstisna (66.935 TL) düşülmeden hesap yapılmıştır (300.000 + 1.066.935 × %15); ivazsız suretle vaki intikallerin 66.935
        TL'si istisnadır.
    hesap_adimlari:
    - 'Matrah: 4.066.935 − 66.935 = 4.000.000 TL'
    - 3.000.000 × %10 = 300.000 TL
    - 1.000.000 × %15 = 150.000 TL
    - Evlatlıktan evlat edinene intikalde yarı oran yok → 450.000 TL
  kaynaklar:
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 16
    alinti: Bir şahsa ana, baba, eş ve çocuklarından (evlatlıktan evlat edinenlere yapılan ivazsız intikaller hariç) ivazsız
      mal intikali halinde vergi, ivazsız intikallere ilişkin tarifede yer alan oranların yarısı uygulanarak hesaplanır.
  - mevzuat: 7338 sayılı Veraset ve İntikal Vergisi Kanunu
    madde: md. 4/d
    alinti: İvazsız suretle vaki intikallerin 10 000 000 lirası (66.935 TL);
