    tutarlar şöyledir: Eşik tutar 17.711.000 TL; 17.711.000 TL ile 26.567.000 TL arasında olanlarda eşiği aşan kısım için
    binde 3; 26.567.000 TL ile 35.425.000 TL arasında olanlarda 26.567.000 TL''si için 26.568 TL, fazlası için binde 6; 35.425.000
    TL''den fazla olanlarda 35.425.000 TL''si için 79.716 TL, fazlası için binde 10. (K)''nin 2026 yılı için ödeyeceği toplam
    değerli konut vergisi kaç TL''dir?'
