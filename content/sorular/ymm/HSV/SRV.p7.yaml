      A: Sabit tutar (79.716 TL) unutulmuş, yalnızca 25.000.000 TL'lik konutun vergisi ile 40.000.000 TL'lik konutun binde
        10'luk kısmı toplanmıştır (21.867 + 45.750 = 67.617 TL).
