      D: Muafiyet hiç uygulanmamış ve 20.000.000 TL'lik konutun vergisi de (6.867 TL) toplama dahil edilmiştir (147.333 +
        6.867 = 154.200 TL).
      E: Binde 10, 40.000.000 TL'lik konutta eşiği aşan tüm kısma uygulanmıştır ((40.000.000 − 17.711.000) × 0,010 = 222.890
        TL) ve buna 25.000.000 TL'lik konutun vergisi eklenmiştir (222.890 + 21.867 = 244.757 TL); oysa dilimler kademelidir
        ve sabit tutarlar kullanılır.
