- id: YMM-HSV-SRV-0081
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: tasarrufu kısıtlanan taşınmazın emlak vergisi
  tip: hesaplama
  zorluk: 2
  kok: Bir arsa, bir kanun hükmü gereği tasarrufu kısıtlanmış olup kısıtlama 2026 yılı boyunca devam etmektedir. Arsanın kısıtlama
    olmasaydı ödenecek yıllık emlak vergisi 36.000 TL'dir. Emlak Vergisi Kanunu'na göre bu arsa için Kasım ayında ödenecek
    ikinci taksit kaç TL'dir? (Taksit iki eşit taksit esasına göre hesaplanacak, tecil edilen kısım dikkate alınmayacaktır.)
  secenekler:
    A: '1.800'
    B: '3.600'
    C: '16.200'
    D: '18.000'
    E: '32.400'
  dogru: A
  aciklama:
    dogru_neden: EVK md. 30'a göre tasarrufu kanunlarla veya kamu düzeni koyan diğer mevzuatla kısıtlanan arsa vergisi, kısıtlamanın
      devam ettiği sürece 1/10 oranında tahsil olunur. Yıllık tahsil edilecek vergi 36.000 × 1/10 = 3.600 TL, iki eşit taksitte
      ödendiğinden Kasım taksiti 1.800 TL'dir. Kalan 9/10 tecil edilmiştir.
    celdiriciler:
      B: Yıllık verginin 1/10'unun tamamı (3.600 TL) ikinci taksit sayılmıştır; vergi iki eşit taksitte ödendiğinden yarısı
        alınır.
      C: Kısıtlamasız yıllık verginin yarısının 9/10'u (16.200 TL) bulunmuştur; kısıtlama altında tahsil edilen kısım 1/10'dur,
        9/10'u tecil edilir.
      D: Kısıtlama dikkate alınmadan normal taksit (18.000 TL) hesaplanmıştır; kısıtlı taşınmazda vergi 1/10 oranında tahsil
        olunur.
      E: Yıllık verginin 9/10'u (32.400 TL) esas alınmıştır; tahsil edilen kısım 1/10'dur, 9/10'u ise tahsil edilmeyip tecil
        olunur.
    hesap_adimlari:
    - Yıllık tahsil edilecek vergi = 36.000 × 1/10 = 3.600 TL
    - 'İki eşit taksit: 3.600 / 2 = 1.800 TL'
  kaynaklar:
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
    madde: md. 30
    alinti: Emlak Vergisi birinci taksidi Mart, Nisan ve Mayıs aylarında, ikinci taksidi Kasım ayı içinde olmak üzere iki
      eşit taksitte ödenir.
  - mevzuat: 1319 sayılı Emlak Vergisi Kanunu
