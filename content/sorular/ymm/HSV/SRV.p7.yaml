    hangisi doğrudur?
  secenekler:
    A: Mesken nitelikli taşınmazın bina vergi değerinin eşik tutarı aştığı yılda mükellefiyet, aştığı tarihten itibaren başlar.
    B: Beyanname, eşik tutarın aşıldığı yılı takip eden yılın mart ayının 20 nci günü sonuna kadar verilir.
    C: Vergi, ilgili yılın şubat ve ağustos ayları sonuna kadar iki eşit taksitte ödenir.
    D: Paylı mülkiyette malikler vergiden müteselsilen sorumludur.
    E: Elbirliği mülkiyette her malik yalnızca hissesi oranında mükelleftir.
  dogru: C
  aciklama:
    dogru_neden: 'EVK md. 47''ye göre vergi dairesi tarafından tarh ve tahakkuk ettirilen vergi, ilgili yılın şubat ve ağustos
      aylarının sonuna kadar iki eşit taksitte ödenir. Diğer seçenekler hatalıdır: mükellefiyet eşiğin aşıldığı tarihi takip
      eden yıldan başlar (md. 45/c), beyan şubat ayının 20 nci günü sonuna kadar yapılır (md. 47), paylı mülkiyette malikler
      hisseleri oranında mükellef, elbirliği mülkiyette müteselsilen sorumludur (md. 45).'
    celdiriciler:
      A: Md. 45'e göre mükellefiyet, eşiğin aşıldığı tarihi takip eden yıldan itibaren başlar; aşıldığı tarihten itibaren
        değil.
      B: Md. 47'ye göre beyan süresi, ilgili yılı takip eden yılın şubat ayının 20 nci günü sonudur; mart değil.
      D: Md. 45'e göre paylı mülkiyette malikler hisseleri oranında mükelleftir; müteselsil sorumluluk elbirliği mülkiyetine
        ilişkindir.
      E: Md. 45'e göre elbirliği mülkiyette malikler vergiden müteselsilen sorumlu olurlar; hisse oranı esası paylı mülkiyete
        uygulanır.
