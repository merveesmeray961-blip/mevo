- id: YMM-HSV-SRV-0078
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Servet vergileri
  konu: SRV
  kazanim: MTV taksitleri ve vergiye etki eden değişiklik
  tip: hesaplama
  zorluk: 2
  kok: Bir otomobil için 2026 yılı başında MTV yıllık 8.000 TL olarak tahakkuk etmiştir. Taşıtın motor silindir hacminde Mart
    2026'da yapılan değişiklik nedeniyle yeni duruma göre yıllık vergi tutarı 12.000 TL'ye yükselmiştir. Mükellef Ocak taksitini
    eski duruma göre ödemiş, başka değişiklik olmamıştır. MTV Kanunu'na göre mükellefin 2026 takvim yılı için ödeyeceği toplam
    MTV kaç TL'dir?
  secenekler:
    A: '8.000'
    B: '10.000'
    C: '12.000'
    D: '14.000'
    E: '16.000'
  dogru: B
  aciklama:
    dogru_neden: MTVK md. 9'a göre MTV Ocak ve Temmuz aylarında iki eşit taksitte ödenir; takvim yılının ilk altı ayında taşıtın
      bünyesinde verginin artmasını gerektiren değişiklik olursa ikinci taksit yeni duruma göre ödenir (md. 11'de de değişiklik
      ilk altı ayda yapılmışsa takip eden son altı aylık dönemin başından itibaren dikkate alınır). Ocak taksiti 8.000 / 2
      = 4.000 TL, Temmuz taksiti 12.000 / 2 = 6.000 TL; toplam 10.000 TL'dir.
    celdiriciler:
      A: Eski yıllık tutar (8.000 TL) esas alınmıştır; oysa verginin artmasını gerektiren değişiklik nedeniyle ikinci taksit
        yeni duruma göre (6.000 TL) ödenir.
      C: Yeni yıllık tutarın tamamı (12.000 TL) esas alınmıştır; oysa değişiklik yalnızca ikinci taksite yansır, ilk taksit
        eski tutara göre kalır.
      D: Eski yıllık tutar (8.000 TL) ile yeni ikinci taksit toplanmıştır; ilk taksit yıllık tutarın yarısı olan 4.000 TL'dir.
      E: İlk taksit (4.000 TL) ile yeni yıllık tutar (12.000 TL) toplanmıştır; ikinci taksit yeni yıllık tutarın yarısı olan
        6.000 TL'dir.
    hesap_adimlari:
    - Ocak taksiti = 8.000 / 2 = 4.000 TL (eski duruma göre)
    - Temmuz taksiti = 12.000 / 2 = 6.000 TL (yeni duruma göre)
    - Toplam = 4.000 + 6.000 = 10.000 TL
  kaynaklar:
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 9
    alinti: Motorlu taşıtlar vergisi her yıl Ocak ve Temmuz aylarında iki eşit taksitte ödenir. Takvim yılının ilk altı ayında,
      taşıtın bünyesinde bir değişiklik olması veya verginin artırılması veya azaltılması halinde ikinci taksit, yeni duruma
      göre ödenir.
  - mevzuat: 197 sayılı Motorlu Taşıtlar Vergisi Kanunu
    madde: md. 11
    alinti: bu değişiklik, takvim yılının ilk altı ayında yapılmış ise takip eden son altı aylık dönemin başından, son altı
      ayında yapılmış ise takip eden takvim yılı başından itibaren dikkate alınır ve vergi, yeni duruma göre ödenir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ocak=8000/2

      temmuz=12000/2

      sonuc = ocak+temmuz

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) duzelt: MTV 0078: celdirici A aciklamasi anahtarla uyumsuz (secenek A = 8.000 TL = eski
          yillik tutar; aciklama 6.000 TL diyor). Anahtar dogru.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_HSV/HSV_SRV_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) duzelt: MTV 0078: celdirici A aciklamasi anahtarla uyumsuz (secenek A = 8.000 TL = eski yillik
      tutar; aciklama 6.000 TL diyor). Anahtar dogru.'
