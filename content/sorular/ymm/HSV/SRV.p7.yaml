    dogru_neden: 'EVK md. 46/b''ye göre birden fazla mesken nitelikli taşınmazı bulunanların değerli konut vergisi konusuna
      giren en düşük değerli tek taşınmazı muaftır; 20.000.000 TL''lik konut muaf olur. 25.000.000 TL''lik konutta matrah
