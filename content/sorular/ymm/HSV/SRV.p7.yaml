  konu: SRV
  kazanim: veraset vergisinde tenzil edilecek borç ve masraflar
  tip: hesaplama
  zorluk: 3
  kok: 'Türk vatandaşı bir muris 2026 yılında ölmüştür. Mirasçılar tarafından verilen beyannamede gösterilen mallar şunlardır:
    Türkiye''de bulunan mallar 3.000.000 TL, Almanya''da bulunan mallar 600.000 TL. Beyannamede gösterilen ve belgelenen borç
    ve masraflar ise şöyledir: murisin ihticaca salih vesaika dayanan borçları 400.000 TL, murisin vergi borçları 50.000 TL,
    cenazenin techiz ve tedfini için yapılan masraflar 30.000 TL, Almanya''daki mallara taallük eden borçlar 500.000 TL ve
    bu mallar dolayısıyla Almanya''da alınan veraset ve intikal vergisi 200.000 TL. Veraset ve İntikal Vergisi Kanunu md.
    12 uyarınca tenzil işlemi sonrasında vergilendirilecek net değer kaç TL''dir?'
  secenekler:
    A: 2.420.000
    B: 2.520.000
    C: 2.550.000
    D: 3.120.000
    E: 3.600.000
  dogru: B
  aciklama:
    dogru_neden: 'VİVK md. 12/a, d bentlerine göre murisin ihticaca salih vesaika dayanan borçları, vergi borçları ve cenaze
      masrafları tenzil edilir: 400.000 + 50.000 + 30.000 = 480.000 TL. Md. 12/c ile yabancı memleketlerdeki mallara taallük
      eden borçlar ve bu mallar dolayısıyla alınan veraset ve intikal vergileri de tevsik şartıyla tenzil edilir; ancak bu
      borçlar ve vergiler beyannamede gösterilen bu kabil malların değerini (600.000 TL) geçemez. Almanya kaynaklı borç ve
      vergi toplamı 500.000 + 200.000 = 700.000 TL olduğundan tenzil 600.000 TL ile sınırlıdır. Toplam tenzil 1.080.000 TL;
      net değer 3.600.000 − 1.080.000 = 2.520.000 TL''dir. Püf noktaları: (1) Yabancı mallara ilişkin tenzilde sınır, o malların
      değeridir. (2) Cenaze masrafı ayrı bir tenzil kalemidir. (3) Murisin yurt içi borçları ve vergi borçları sınıra tabi
      değildir.'
    celdiriciler:
      A: 'Yabancı mallara ilişkin sınır uygulanmamış (700.000 TL tenzil edilmiş): 3.600.000 − (480.000 + 700.000) = 2.420.000
        TL bulunmuştur; oysa bu tenzil 600.000 TL ile sınırlıdır.'
      C: Cenaze masrafı (30.000 TL) tenzil edilmemiştir (3.600.000 − 1.050.000 = 2.550.000 TL); md. 12/d cenaze masraflarının
        tenzilini öngörür.
      D: Yabancı mallara ilişkin borç ve vergiler hiç tenzil edilmemiştir (3.600.000 − 480.000 = 3.120.000 TL); md. 12/c bunların
        tevsik şartıyla tenzilini öngörür.
      E: Hiçbir borç ve masraf tenzil edilmeden toplam mal değeri (3.600.000 TL) esas alınmıştır; md. 12 tenzili beyannamede
        gösterilmek şartıyla öngörür.
    hesap_adimlari:
    - 'Yurt içi tenzil: 400.000 + 50.000 + 30.000 = 480.000 TL'
    - 'Yabancı mallar: 500.000 + 200.000 = 700.000 TL > mal değeri 600.000 TL; tenzil 600.000 TL ile sınırlı'
    - Toplam tenzil = 480.000 + 600.000 = 1.080.000 TL
    - Net değer = 3.000.000 + 600.000 − 1.080.000 = 2.520.000 TL
