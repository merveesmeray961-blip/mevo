      vergi 79.716 + (40.000.000 − 35.425.000) × 0,010 = 79.716 + 45.750 = 125.466 TL''dir. Toplam 21.867 + 125.466 = 147.333
      TL''dir. Püf noktaları: (1) Muafiyet en düşük değerli konuta uygulanır, en pahalıya değil. (2) 25 milyonluk konut ilk
      dilimde kalır; üst dilimlerin sabit tutarı yalnız o dilimlere gelen konutlarda eklenir. (3) 40 milyonluk konutta binde
      10 yalnızca 35.425.000 TL''yi aşan kısma uygulanır.'
