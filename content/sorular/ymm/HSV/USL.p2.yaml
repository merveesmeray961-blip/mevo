      yetkili memurlar, motorlu araç ticareti yapanlar, bu malların müzayede yoluyla satışını gerçekleştirenler ile icra memurları,
      ziyaa uğratılan vergi, vergi cezası ve gecikme faizinden mükellefle birlikte müteselsilen sorumludurlar.
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
