- id: YMM-HSV-USL-0020
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sahte belge ve KDV'ye etkisi
  tip: hesaplama
  zorluk: 3
  kok: '(Ç) A.Ş. hakkında 2026 yılında yapılan vergi incelemesinde şu tespitler yapılmıştır:

    - Mart 2026 döneminde, gerçekte hiçbir mal alımı olmadığı hâlde şirket adına düzenlenen faturalardaki KDV indirim konusu
    yapılmış ve bu yolla 150.000 TL KDV ziyaa uğratılmıştır.

    - Nisan 2026 dönemine ait KDV beyannamesi, kanuni süresi geçtikten sonra, vergi incelemesine başlanmadan önce ve pişmanlık
    talebinde bulunulmaksızın verilmiştir; bu beyanname üzerine süresinde tahakkuk etmemiş olan 60.000 TL KDV tahakkuk etmiştir.

    Şirket mükellefiyet tesis ettirmiş olup faaliyetini vergi dairesinin bilgisi dâhilinde yürütmektedir. Vergi Usul Kanunu’na
    göre şirket adına kesilecek vergi ziyaı cezalarının toplamı kaç TL’dir?'
  secenekler:
    A: '210.000'
    B: '480.000'
    C: '510.000'
    D: '540.000'
    E: '630.000'
  dogru: B
  aciklama:
    dogru_neden: 'Sahte belge kullanmak VUK md. 359/b’deki fiillerdendir; bu fiille vergi ziyaına sebebiyet verildiğinde ceza
      üç kat uygulanır (md. 344/2): 150.000 × 3 = 450.000 TL. Nisan dönemi için vergi ziyaı md. 341’deki genel hâldir ve ceza
      bir kattır; ancak vergi incelemesine başlanmadan önce süresi geçtikten sonra verilen beyanname için ceza yüzde elli
      oranında uygulanır (md. 344/3): 60.000 × 1 × %50 = 30.000 TL. Toplam 480.000 TL. Püf noktaları: Her tespitin cezası
      kendi fiiline göre belirlenir; üç kat yalnız 359 uncu maddedeki fiille ziyaa uğratılan vergiye uygulanır. Yüzde elli
      indirimi için beyannamenin incelemeden önce verilmiş olması yeter; şirket bilinen mükellef olduğundan %50 artırım da
      yoktur.'
    celdiriciler:
      A: Her iki tespite bir kat ceza uygulanmıştır; sahte belgeyle ziyaa uğratılan vergide ceza üç kattır ve geç beyanda
        %50 indirim unutulmuştur.
      C: Sahte belgeye üç kat ceza doğru uygulanmış, ancak geç verilen beyanname için öngörülen %50 indirim yapılmamıştır.
      D: Geç verilen beyannameye de üç kat ceza uygulanıp yarıya indirilmiştir (90.000 TL); üç kat yalnız 359 uncu maddedeki
        fiillerle ziyaa uğratılan vergiye uygulanır.
      E: Her iki tespite üç kat ceza uygulanmış, indirim de yapılmamıştır.
    hesap_adimlari:
    - 'Mart (sahte belge): 150.000 × 3 = 450.000 TL'
    - 'Nisan (süresi geçtikten sonra, incelemeden önce verilen beyanname): 60.000 × 1 × %50 = 30.000 TL'
    - 'Toplam: 480.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1-2
    alinti: Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak
      edenlere ise bir kat olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/3
    alinti: Vergi incelemesine başlanılmasından veya takdir komisyonuna sevk edilmesinden sonra verilenler hariç olmak üzere,
