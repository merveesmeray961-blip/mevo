- id: YMM-HSV-USL-0014
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: beyan ve ödeme süreleri
  tip: bilgi
  zorluk: 1
  kok: (R) Rafineri A.Ş., Özel Tüketim Vergisi Kanunu’na ekli (I) sayılı listede yer alan akaryakıt ürünlerini teslim etmektedir.
    ÖTV Kanunu’na göre şirketin 16-31 Mart 2026 dönemine ilişkin ÖTV beyannamesini vermesi gereken son gün ve verginin ödeme
    zamanı aşağıdakilerden hangisidir?
  secenekler:
    A: 10 Nisan 2026; vergi beyanname verme süresi içinde ödenir.
    B: 15 Nisan 2026; vergi beyanname verme süresi içinde ödenir.
    C: 10 Nisan 2026; vergi izleyen ayın 26’ncı günü akşamına kadar ödenir.
    D: 15 Nisan 2026; vergi aynı ayın 26’ncı günü akşamına kadar ödenir.
    E: Teslimden önce verilir; vergi beyannamenin verildiği gün ödenir.
  dogru: A
  aciklama:
    dogru_neden: ÖTVK md. 14/1’e göre (I) sayılı listedeki mallar için vergilendirme dönemi her ayın ilk on beş günü ile kalan
      günlerinden oluşan iki dönemdir ve beyanname vergilendirme dönemini izleyen onuncu gün akşamına kadar verilir. 16-31
      Mart dönemi için son gün 10 Nisan 2026’dır. Vergi, beyanname verme süresi içinde ödenir.
    celdiriciler:
      B: İzleyen ayın 15’i, (III) ve (IV) sayılı listeler ile (II) sayılı listede kayıt ve tescile tabi olmayan mallar için
        öngörülen aylık dönemlerin beyan süresidir.
      C: Beyan günü doğrudur; ancak ÖTV ayrı bir ödeme gününe bağlanmamıştır, beyanname verme süresi içinde ödenir.
      D: Hem beyan süresi (I) sayılı liste için yanlış, hem de ÖTV’de ayrı bir ödeme günü yoktur.
      E: İlk iktisaptan önce beyan ve aynı gün ödeme, (II) sayılı listedeki kayıt ve tescile tabi mallara özgüdür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 14/1
    alinti: Vergilendirme dönemi; bu Kanuna ekli (I) sayılı listedeki mallar için her ayın ilk onbeş günlük birinci ve kalan
      günlerinden oluşan ikinci dönem, (III) ve (IV) sayılı listelerdeki mallar ile (II) sayılı listedeki mallardan kayıt
      ve tescile tâbi olmayanların tesliminde, faaliyette bulunulan takvim yılının birer aylık dönemleridir. Beyanname, (I)
      sayılı listedeki mallar için vergilendirme dönemini izleyen onuncu günü, diğer mallar için vergilendirme dönemini izleyen
      ayın onbeşinci günü akşamına kadar
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: md. 14/1
    alinti: Vergi, beyanname verme süresi içinde ödenir.
