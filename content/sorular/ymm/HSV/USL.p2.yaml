      C: Süre, kâğıdın düzenlendiği günü izleyen günden başlar; düzenleme günü sayılırsa süre bir gün eksik hesaplanır.
      D: Kanunda ay sonu esası yoktur; süre düzenleme tarihini izleyen on beş gündür.
