- id: YMM-HSV-USL-0019
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sahte belge ve KDV'ye etkisi
  tip: hesaplama
  zorluk: 3
  kok: Tam tasdik sözleşmesi 2026 yılı için süresinde düzenlenmiş olan (Y) A.Ş., Ağustos 2026 dönemine ilişkin mal ihracatı
    nedeniyle KDV iadesi talep etmiştir. Vergi dairesi, şirketin Ağustos 2026’da (Z) Ltd. Şti.’den aldığı ve KDV’sini indirim
    konusu yaptığı faturaların (alım tutarı 400.000 TL, KDV 80.000 TL) sahte olduğuna ilişkin bir sahte belge kullanma tespiti
    bulunduğunu şirkete bildirmiştir; bu konuda henüz vergi inceleme raporu yoktur. Şirketin Ağustos 2026 dönemindeki toplam
    alımları (KDV hariç) 6.000.000 TL’dir. Şirket, kendisine tanınan 15 günlük sürede işlemin gerçekliğini ispat edememiş
    ve söz konusu KDV’yi indirim ve iade hesabından çıkarmak da istememektedir. KDV Genel Uygulama Tebliği’ne göre şirketin
    geri kalan iade talebinin ilgili bölümlerdeki usul ve esaslara göre sonuçlandırılabilmesi için göstermesi gereken teminat
    kaç TL’dir?
  secenekler:
    A: '0'
    B: '160.000'
    C: '240.000'
    D: '320.000'
    E: '400.000'
  dogru: C
  aciklama:
    dogru_neden: 'Tam tasdik sözleşmesi bulunan mükelleflerde sahte olduğu tespit edilen belgelerdeki alım tutarı aynı dönemdeki
      toplam alımların %5’ini geçmiyorsa sahte belge kullanma tespiti gerekçesiyle işlem yapılmaz. Burada oran 400.000 / 6.000.000
      = %6,67 olduğundan bu kolaylık uygulanmaz. Tebliğ (IV/A2-7.2)’ye göre belgenin gerçekliğini ispat edemeyen mükellef,
      ilgili KDV’yi indirim ve iade hesabından çıkarırsa veya bu kısma sahte belge kullanma tespitinde üç kat teminat gösterirse
      geri kalan iade talebi ilgili bölümlerdeki usul ve esaslara göre sonuçlandırılır: 80.000 × 3 = 240.000 TL. Püf noktaları:
      Önce %5 eşiği sınanır; eşik aşılınca teminat katsayısı olumsuzluğun türüne göre seçilir. Burada rapor değil tespit,
      düzenleme değil kullanma ve yanıltıcı değil sahte belge söz konusudur; bu üç ayrım katsayıyı üçe indirir.'
    celdiriciler:
      A: '%5 eşiğinin uygulandığı varsayılmıştır; sahte alımların toplam alımlara oranı %6,67 olduğundan eşik aşılmıştır.'
      B: İki kat teminat, muhteviyatı itibarıyla yanıltıcı belge kullanma tespitinde aranır.
      D: Dört kat teminat, sahte belge kullanma raporu bulunan mükellefler için öngörülmüştür; burada henüz rapor değil tespit
        vardır.
      E: Beş kat teminat, sahte belge düzenleme raporu bulunanlar içindir.
    hesap_adimlari:
    - '%5 kontrolü: 400.000 / 6.000.000 = %6,67 > %5 → kolaylık yok'
    - Sahte belge kullanma tespiti → üç kat teminat
    - 'Teminat: 80.000 × 3 = 240.000 TL'
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.5
    alinti: Sahte belge kullanılmasına yönelik olumsuz tespit bulunan dönemi kapsayan takvim yılında süresinde düzenlenmiş
      tam tasdik sözleşmesi bulunan mükelleflerin, sahte olduğu tespit edilen belgelerde yer alan alım tutarının, aynı dönemdeki
      toplam alımlarının %5’ini geçmemesi halinde, bu mükellefler hakkında sahte belge kullanma tespiti gerekçesiyle işlem
      yapılmaz.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-7.2
    alinti: Belgenin gerçekliğini ve doğruluğunu ispat etmemekle birlikte, söz konusu belgelerde yer alan KDV tutarlarını
      indirim ve iade hesabından çıkaran veya bu kısma sahte belge kullanma tespitlerinde üç kat, muhteviyatı itibarıyla yanıltıcı
      belge kullanma tespitlerinde iki kat teminat gösteren mükelleflerin geri kalan iade talepleri ilgili bölümlerdeki usul
      ve esaslara göre sonuçlandırılır.
