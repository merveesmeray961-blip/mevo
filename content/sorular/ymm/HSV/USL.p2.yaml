      yalnız motorin yerine kullanılan 8.000 litre için iki vergi arasındaki farktır: 8.000 × (12 − 2) = 80.000 TL. Fiil VUK
      md. 359 kapsamında olmadığından ceza bir kattır: 80.000 TL. Püf noktaları: Tarhiyatın muhatabı vergiyi ödemiş satıcı
      değil malı yüksek vergili mal olarak kullanan alıcıdır. Matrah kullanılan miktarla sınırlıdır ve daha önce ödenmiş vergi
      düşülür.'
    celdiriciler:
