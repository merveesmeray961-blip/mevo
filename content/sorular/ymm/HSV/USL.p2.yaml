- id: YMM-HSV-USL-0018
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sahte belge ve KDV'ye etkisi
  tip: kavrama
  zorluk: 2
  kok: 'Vergi Usul Kanunu’nun 359 ve 344 üncü maddelerine göre aşağıdaki ifadelerden hangileri doğrudur?

    I. Gerçekte 100 birim mal teslimine dayanan ancak teslimi 300 birim olarak gösteren fatura, muhteviyatı itibarıyla yanıltıcı
    belgedir.

    II. Hiçbir mal teslimi olmadığı hâlde düzenlenen faturayı bilerek kullanan hakkında üç yıldan sekiz yıla kadar hapis cezası
    öngörülmüştür.

    III. Sahte belge kullanan mükellef hakkında hapis cezasına hükmedilmesi, aynı fiil nedeniyle vergi ziyaı cezası kesilmesine
    engel teşkil eder.

    IV. Muhteviyatı itibarıyla yanıltıcı belge kullananlar hakkında on sekiz aydan beş yıla kadar hapis cezası öngörülmüştür.'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, III ve IV
    D: II, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: VUK md. 359/a’ya göre gerçek bir muamele veya duruma dayanmakla birlikte bunu mahiyet veya miktar itibarıyla
      gerçeğe aykırı yansıtan belge muhteviyatı itibarıyla yanıltıcı belgedir (I doğru) ve bu belgeleri kullananlar on sekiz
      aydan beş yıla kadar hapis cezası ile cezalandırılır (IV doğru). Md. 359/b’ye göre gerçek bir muamele olmadığı hâlde
      varmış gibi düzenlenen belge sahte belgedir; bunu kullananlar üç yıldan sekiz yıla kadar hapis cezası ile cezalandırılır
      (II doğru). Kaçakçılık suçları için öngörülen cezaların uygulanması md. 344’teki vergi ziyaı cezasının ayrıca uygulanmasına
      engel değildir (III yanlış).
    celdiriciler:
      A: IV de doğrudur; yanıltıcı belge kullanma 359/a-2’de on sekiz ay–beş yıl hapisle cezalandırılır.
      B: III yanlıştır; hapis cezası vergi ziyaı cezasının ayrıca uygulanmasına engel değildir. Ayrıca I ve IV de doğrudur.
      C: III yanlış, II ise doğrudur.
      D: III yanlıştır; I ise miktar bakımından gerçeğe aykırı belge olduğundan doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/a
    alinti: Gerçek bir muamele veya duruma dayanmakla birlikte bu muamele veya durumu mahiyet veya miktar itibariyle gerçeğe
      aykırı şekilde yansıtan belge ise, muhteviyatı itibariyle yanıltıcı belgedir.
