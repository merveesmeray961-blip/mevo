    B: Beyanname 20 Temmuz 2026’ya kadar verilir, vergi 26 Temmuz 2026’ya kadar ödenir.
    C: Beyanname 16 Haziran 2026’ya kadar verilir ve vergi aynı süre içinde ödenir.
    D: Beyanname ve ödeme, kâğıdın düzenlendiği ayın sonu olan 30 Haziran 2026’ya kadar yapılır.
