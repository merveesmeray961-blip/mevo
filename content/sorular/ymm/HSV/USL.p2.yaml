  kok: Harcama vergilerinde sorumluluk hükümleriyle ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: ÖTV’de adi ortaklıklarda, ortakların tamamı verginin ödenmesinden müteselsilen sorumlu olmak üzere ortaklardan herhangi
      biri tarhiyata muhatap tutulur.
    B: Birden fazla kişi tarafından imza edilen kâğıtlara ait damga vergisi ve cezasının tamamından imza edenler müteselsilen
      sorumludur.
    C: Harçlar Kanunu’na göre gerekli harçları tamamen almadan işlem yapan memurlar, harcın ödenmesinden mükelleflerle müteselsilen
      sorumludur.
    D: Damga vergisi ödenmemiş kâğıdı tasdik eden noterden, mükellef hakkında VUK hükümleri uygulanmakla birlikte kâğıt için
      kanunen alınması gereken ceza ayrıca alınır.
    E: (II) sayılı listedeki aracı ÖTV’nin ödendiğini gösteren belgeyi aramadan tescil eden memur müteselsilen sorumlu olup
      ödediği tutarlar için mükellefe rücu edemez.
  dogru: E
  aciklama:
    dogru_neden: ÖTVK md. 13/3’e göre (II) sayılı listedeki malların ilk iktisabı, teslimi veya ithaline ilişkin işlemleri
      gerçekleştirenler verginin ödendiğini gösteren belgeyi aramak zorundadır; bu yükümlülüğe uymayan kayıt ve tescile yetkili
      memurlar, ziyaa uğratılan vergi, vergi cezası ve gecikme faizinden mükellefle birlikte müteselsilen sorumludur. Ancak
      bunlar ödemek zorunda kaldıkları vergi, ceza ve faizler için mükellefe rücu hakkına sahiptir. Rücu edemeyeceklerini
      söyleyen ifade yanlıştır.
    celdiriciler:
      A: 'Doğrudur: ÖTVK md. 14/1 adi ortaklıklar için bu hükmü içerir.'
      B: 'Doğrudur: DVK md. 24/2 imza edenlerin müteselsil sorumluluğunu düzenler.'
      C: 'Doğrudur: Harçlar Kanunu md. 128 bu sorumluluğu öngörür.'
      D: 'Doğrudur: DVK md. 27/2’ye göre noterden her kâğıt için kanunen alınması gereken ceza ayrıca alınır.'
    hesap_adimlari: []
