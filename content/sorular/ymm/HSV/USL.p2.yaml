- id: YMM-HSV-USL-0016
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sorumluluk uygulamaları
  tip: hesaplama
  zorluk: 2
  kok: (B) Ltd. Şti. nezdinde 5 Mayıs 2026’da yapılan fiilî envanterde, alış belgesi bulunmayan emtia tespit edilmiştir. Şirket
    yetkilisi bu malları 400.000 TL’ye satın aldığını beyan etmiştir; malların tespit tarihindeki emsal bedeli 500.000 TL’dir
    ve mallar %20 oranında KDV’ye tabidir. Şirket, kanunda öngörülen süre içinde alış belgelerini ibraz edememiştir. Malları
    satanlar hakkında herhangi bir tarhiyat yapılmamıştır. KDV Kanunu’na göre (B) Ltd. Şti. adına re’sen tarh edilecek KDV
    ile kesilecek vergi ziyaı cezasının toplamı kaç TL’dir? (Gecikme faizi dikkate alınmayacaktır.)
  secenekler:
    A: '80.000'
    B: '100.000'
    C: '160.000'
    D: '200.000'
    E: '400.000'
  dogru: D
  aciklama:
    dogru_neden: 'KDVK md. 9/2’ye göre belgesiz mal bulundurduğu tespit edilen mükellefe alış belgelerini ibraz etmesi için
      tespit tarihinden itibaren 10 gün süre verilir; belge ibraz edilemezse malların tespit tarihindeki emsal bedeli üzerinden
      hesaplanan KDV mükellef adına re’sen tarh edilir ve vergi ziyaı cezası uygulanır. KDV: 500.000 × %20 = 100.000 TL. Vergi
      ziyaı cezası VUK md. 344/1’e göre bir kat: 100.000 TL. Toplam 200.000 TL.'
    celdiriciler:
      A: Vergi, beyan edilen alış bedeli (400.000 TL) üzerinden hesaplanmış ve ceza unutulmuştur; kanun emsal bedeli esas
        alır.
      B: Yalnız vergi hesaplanmıştır; bu tarhiyata vergi ziyaı cezası da uygulanır.
      C: Vergi ve ceza, emsal bedel yerine beyan edilen alış bedeli (400.000 TL) üzerinden hesaplanmıştır.
      E: Ceza üç kat uygulanmıştır; belgesiz mal bulundurma VUK md. 359’daki fiillerden olmadığından ceza bir kattır.
    hesap_adimlari:
    - 'KDV: 500.000 × %20 = 100.000 TL (emsal bedel üzerinden)'
    - 'Vergi ziyaı cezası (bir kat): 100.000 TL'
    - 'Toplam: 200.000 TL'
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 9/2
    alinti: Belgesiz mal bulundurdukları veya hizmet satın aldıkları tespit edilen mükelleflere, bu mal ve hizmetlere ait
      alış belgelerinin ibrazı için tespit tarihinden itibaren 10 günlük bir süre verilir. Bu süre içinde alış belgelerinin
      ibraz edilememesi halinde, belgesi ibraz edilemeyen mal ve hizmetlerin tespit tarihindeki emsal bedeli üzerinden hesaplanan
      katma değer vergisi, alışlarını belgeleyemeyen mükellef adına re'sen tarhedilir. Bu tarhiyata vergi ziyaı cezası uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında ziyaa
      uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir.
  gecerlilik:
