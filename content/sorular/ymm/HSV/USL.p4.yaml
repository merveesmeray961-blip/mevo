- id: YMM-HSV-USL-0050
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: beyan ve ödeme süreleri
  tip: bilgi
  zorluk: 2
  kok: Aylık KDV mükellefi (A) A.Ş., Mart 2026 döneminde hem kendi teslimleri için KDV hesaplamış hem de satın aldığı işgücü
    temini hizmeti nedeniyle KDV tevkifatı yapmıştır. 3065 sayılı Kanun'un 41 ve 46. maddelerindeki kanuni sürelere göre;
    mükellef sıfatıyla verilecek beyanname dönemi takip eden ayın (I) günü akşamına kadar verilir; sorumlu sıfatıyla verilecek
    beyanname dönemi takip eden ayın (II) günü akşamına kadar verilir ve bu beyannamedeki vergi, beyannamenin verildiği ayın
    (III) günü akşamına kadar ödenir. (Tatil günleri ile Bakanlıkça yapılan süre uzatımları dikkate alınmayacaktır.) Boşluklara
    sırasıyla aşağıdakilerden hangisi gelmelidir?
  secenekler:
    A: 'I: yirmi dördüncü – II: yirmi dördüncü – III: yirmi altıncı'
    B: 'I: yirmi dördüncü – II: yirmi birinci – III: yirmi üçüncü'
    C: 'I: yirmi altıncı – II: yirmi birinci – III: yirmi üçüncü'
    D: 'I: yirmi birinci – II: yirmi dördüncü – III: yirmi altıncı'
    E: 'I: yirmi dördüncü – II: yirmi birinci – III: yirmi altıncı'
  dogru: B
  aciklama:
    dogru_neden: Md. 41/1'e göre mükellefler beyannamelerini dönemi takip eden ayın yirmi dördüncü günü, vergi kesintisi yapmakla
      sorumlu tutulanlar yirmi birinci günü akşamına kadar verir. Md. 46/1'e göre sorumlular vergiyi beyanname verecekleri
      ayın yirmi üçüncü günü akşamına kadar öder (mükellefler yirmi altıncı gün).
    celdiriciler:
      A: Sorumlu sıfatıyla beyan süresi yirmi birinci gün, ödeme süresi yirmi üçüncü gündür.
      C: Yirmi altıncı gün mükellefin ödeme süresidir; beyan süresi yirmi dördüncü gündür.
      D: Mükellef ve sorumlu süreleri yer değiştirilmiştir.
      E: Sorumlu sıfatıyla ödeme süresi yirmi üçüncü gündür.
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 41/1
    alinti: takibeden ayın yirmibirinci günü akşamına kadar ilgili vergi dairesine vermekle
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 46/1
