- id: YMM-HSV-USL-0053
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sahte belge ve KDV'ye etkisi
  tip: hesaplama
  zorluk: 3
  kok: (Z) Ltd. Şti., başkaca faaliyeti olmadığı hâlde münhasıran sahte belge düzenlemek amacıyla mükellefiyet tesis ettirdiği
    vergi inceleme raporuyla tespit edilerek işi bırakmış sayılmış ve mükellefiyet kaydı terkin edilmiştir. Şirketin düzenlediği
    sahte belgelerde yer alan toplam tutar 250.000.000 TL'dir. Şirket sermayesinin %20'sine sahip olan Bay (K), Eylül 2026'da
    şahıs işletmesi için işe başlama bildiriminde bulunmuştur; vergi borcu yoktur. 2026 yılında VUK md. 153/A'daki teminatın
    alt sınırı 1.200.000 TL, üst sınırı 17.000.000 TL'dir. Buna göre Bay (K) adına mükellefiyet tesis edilebilmesi için verilmesi
    gereken teminat kaç TL'dir?
  secenekler:
    A: 1.200.000
    B: 5.000.000
    C: 17.000.000
    D: 25.000.000
    E: 250.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Sermayesinin asgari %10''una sahip olan ortaklar md. 153/A kapsamındadır. Teminat, sahte belgelerde yer
      alan toplam tutarın %10''u olup 2026 için 1.200.000 TL''den az ve 17.000.000 TL''den fazla olamaz: 250.000.000 × %10
      = 25.000.000 TL; üst sınır nedeniyle 17.000.000 TL. Püf noktaları: Teminat ortağın pay oranıyla çarpılmaz; önce %10
      hesaplanır, sonra alt ve üst sınır uygulanır.'
    celdiriciler:
      A: Alt sınır, %10 tutarı alt sınırın altında kaldığında uygulanır.
      B: Teminat ortaklık payına (%20) göre bölüştürülmüştür; Kanun böyle bir oranlama öngörmez.
      D: Üst sınır uygulanmamıştır.
      E: Sahte belgelerdeki toplam tutarın tamamı teminat sayılmıştır; oran %10'dur.
    hesap_adimlari:
    - '%10 = 250.000.000 × 0,10 = 25.000.000'
    - 'Sınırlar: max(1.200.000; min(25.000.000; 17.000.000)) = 17.000.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 153/A
    alinti: fazla olmamak üzere düzenlenmiş olan sahte belgelerde yer alan toplam tutarın % 10’u
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 153/A
    alinti: yönetim kurulu üyelerinin, şirket sermayesinin asgari % 10’una sahip olan gerçek veya tüzel
  - mevzuat: VUK Genel Tebliği (Sıra No 588)
    madde: md. 153/A tutarları
    alinti: Üst sınır 17.000.000
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = max(1200000, min(250000000 * 10 / 100, 17000000))
