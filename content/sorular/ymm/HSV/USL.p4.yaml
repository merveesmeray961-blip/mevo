- id: YMM-HSV-USL-0049
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: sahte belge ve KDV'ye etkisi
  tip: uygulama
  zorluk: 2
  kok: '(S) Ltd. Şti., hiçbir mal teslimi olmadığı hâlde (A) A.Ş. adına 500.000 TL + 100.000 TL KDV tutarlı fatura düzenlemiş;
    (A) A.Ş. bu faturadaki KDV''yi indirim konusu yapmıştır. 3065 sayılı KDV Kanunu''na göre aşağıdaki ifadelerden hangileri
    doğrudur?


    I. (S) Ltd. Şti., faturada gösterdiği 100.000 TL KDV''yi ödemekle mükelleftir.

    II. Gerçek bir teslim olmadığından (A) A.Ş.''nin bu faturaya dayanarak yaptığı KDV indirimi kabul edilmez.

    III. (S) Ltd. Şti. faturadaki KDV''yi Hazineye öderse (A) A.Ş.''nin indirimi geçerlilik kazanır.

    IV. (S) Ltd. Şti., beyanlarını düzeltmeden ve yersiz hesaplanan vergiyi alıcıya geri vermeden, Hazineye ödediği bu KDV''nin
    iadesini alabilir.

    '
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve IV
    E: I, III ve IV
  dogru: A
  aciklama:
    dogru_neden: Vergiye tabi bir işlem olmadığı hâlde düzenlediği belgede KDV gösteren bu vergiyi ödemekle mükelleftir (md.
      8/2; I). İndirim, mükellefe yapılan teslim ve hizmetler dolayısıyla düzenlenen belgelerdeki KDV içindir (md. 29/1-a);
      teslim olmadığından indirim reddedilir (II) ve düzenleyenin vergiyi ödemesi bu sonucu değiştirmez (III yanlış). Yersiz
      hesaplanıp ödenen verginin iadesi, beyanların düzeltilmesi ve verginin satıcı tarafından alıcıya geri verilmesi şartına
      bağlıdır (md. 8/2; IV yanlış).
    celdiriciler:
      B: Düzenleyenin KDV'yi ödemesi sahte faturaya dayalı indirimi meşru kılmaz.
      C: Yersiz hesaplanan verginin iadesi beyanların düzeltilmesine ve verginin alıcıya geri verilmesine bağlıdır; I doğrudur.
      D: IV'teki iade, Kanun'daki düzeltme ve geri verme şartları yerine getirilmeden yapılamaz.
      E: III ve IV yanlıştır; II doğrudur.
  kaynaklar:
