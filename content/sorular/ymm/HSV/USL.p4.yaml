  kok: 'KDV Genel Uygulama Tebliği''ne göre hakkında sahte belge veya muhteviyatı itibarıyla yanıltıcı belge kullanma **tespiti**
    (rapor değil) bulunan mükelleflerin iade talepleriyle ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Yanıltıcı belge kullanma tespitinde, ilgili belgelerdeki KDV''nin iki katı teminat gösteren mükellefin geri kalan iade
    talepleri ilgili bölümlerdeki usul ve esaslara göre sonuçlandırılır.

    II. Sahte belge kullanma tespitinde, belgelerdeki KDV''yi indirim ve iade hesabından çıkaran mükellefin geri kalan iade
    talepleri ilgili bölümlerdeki usul ve esaslara göre sonuçlandırılır.

    III. İadesi vergi inceleme raporu sonucuna göre yerine getirilen mükellef, sahte belge kullanma tespitinde, rapor ile
    iade alınmaya başlanan dönemi takip eden dönemden itibaren başka olumsuzluk olmaksızın iki yıl geçince genel esaslara
    döner.

    IV. Tespitin veya tespite dayanılarak tesis edilen işlemlerin yargı kararıyla iptal edilmesi hâlinde mükellef genel esaslara
    göre iade talep edebilir.

    '
  secenekler:
    A: I ve II
    B: II ve III
    C: I, III ve IV
    D: I, II ve IV
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Tebliğ IV/A2-7.2''ye göre belgedeki KDV''yi indirim ve iade hesabından çıkaran veya sahte belgede üç kat,
      yanıltıcı belgede iki kat teminat gösteren mükellefin geri kalan iade talepleri normal usulle sonuçlandırılır (I, II).
      Tespitin yargı kararıyla iptali genel esaslara dönüş sebeplerindendir (IV). Süre şartında sahte belge kullanma tespitinde
      üç yıl, yanıltıcı belge kullanma tespitinde iki yıl aranır; III''teki iki yıl sahte belge için yanlıştır. Püf noktaları:
      Tespitte katlar sahte 3, yanıltıcı 2; dönüş süreleri de aynı sayılarla yıl olarak işler. Rapor hâllerindeki daha yüksek
      katlarla karıştırma.'
    celdiriciler:
      A: Yargı kararıyla iptal de genel esaslara dönüş sebebidir; IV doğrudur.
      B: Sahte belge kullanma tespitinde dönüş süresi üç yıldır; III yanlıştır.
      C: III yanlıştır; II doğrudur.
      E: III yanlıştır; I doğrudur.
