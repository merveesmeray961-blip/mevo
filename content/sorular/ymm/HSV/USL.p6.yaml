- id: YMM-HSV-USL-0057
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: noter ve banka yükümlülükleri
  tip: kavrama
  zorluk: 3
  kok: (N) Noterliği, damga vergisi noksan ödenmiş bir kâğıdı vergi ve cezası ödenmeden tasdik etmiş; (B) Bankası da damga
    vergisi ödenmemiş başka bir kâğıdı vergi ve cezasını tahsil etmeden işleme koymuştur. 488 sayılı Damga Vergisi Kanunu’nun
    27. maddesine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Noter ve bankaya ayrıca ceza kesilmez; yalnız kâğıdın mükellefine Vergi Usul Kanunu hükümleri uygulanır ve vergi onlardan
      alınır.
    B: Noter ve banka yalnız damga vergisinden müteselsilen sorumludur; cezanın tamamı kâğıdı ibraz edene kesilir ve rücu
      hakkı yoktur.
    C: Banka, işleme koyduğu kâğıt için mükelleflerden alınacak ceza tutarının yarısı kadar, noter ise kâğıt başına maktu
      bir ceza öder.
    D: Noterden tasdik ettiği her kâğıt için kanunen alınması gereken ceza, bankadan ise mükelleflerden alınacak ceza tutarınca
      ayrıca ceza alınır.
    E: Noterin ve bankanın cezası, kâğıdı daha sonra resmî dairelere ibraz eden kişiden rücu yoluyla tahsil edilmek üzere,
      vergi ödenene kadar ertelenir.
  dogru: D
  aciklama:
    dogru_neden: 'Damga Vergisi Kanunu md. 27’ye göre noterler vergi ve cezası ödenmedikçe kâğıtları tasdik edemez; aykırı
      işlemde mükellef hakkında Vergi Usul Kanunu hükümleri uygulanmakla birlikte noterlerden de tasdik ettikleri veya üzerinde
      işlem yaptıkları her kâğıt için kanunen alınması gereken ceza ayrıca alınır. Bankalar da vergi ve cezası ödenmeden işleme
      koydukları kâğıtlar için kâğıdın mükelleflerinden alınacak ceza tutarınca ayrıca ceza öderler. Püf noktaları: Noter
      için ölçü “her kâğıt için kanunen alınması gereken ceza”, banka için ise “mükelleflerden alınacak ceza tutarı”dır; iki
      ifade birbirine karıştırılmamalı, ikisinde de ayrıca ceza öngörüldüğü, yani mükellefin cezasına ek olarak alındığı unutulmamalıdır.'
    celdiriciler:
      A: Kanun, mükellefe uygulanan cezaya ek olarak noterden ve bankadan ayrıca ceza alınacağını öngörür.
      B: Madde müteselsil sorumluluk değil, noter ve bankaya ayrıca ceza uygulanmasını düzenler; ceza ibraz edene bırakılmamıştır.
      C: Bankadan alınacak ceza mükelleflerden alınacak ceza tutarınca, yarısı değildir; noterde de ölçü maktu ceza değil
        kâğıt başına kanunen alınacak cezadır.
      E: Kanunda cezanın ertelenmesi veya rücuya bırakılması yoktur; ceza işlemi yapan noter ve bankadan ayrıca alınır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 27/2
    alinti: Birinci fıkra hükmüne aykırı olarak işlem yapılması halinde, mükellef hakkında Vergi Usul Kanunu hükümleri uygulanmakla
      birlikte, noterlerden de tasdik ettikleri veya üzerinde işlem yaptıkları her kâğıt için kanunen alınması gereken cezası
      ayrıca alınır.
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: md. 27/3
    alinti: Bankalar, kamu iktisadi teşebüsleri ve iştirakleri ile 22 nci maddenin birinci fıkrasının (a) bendi kapsamında
