- id: YMM-HSV-USL-0060
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Harcama vergilerinde usul ve cezalar
  konu: USL
  kazanim: KDV tarhiyatının muhatabı
  tip: kavrama
  zorluk: 3
  kok: '3065 sayılı KDV Kanunu md. 44''te düzenlenen tarhiyatın muhatabına ilişkin aşağıdaki ifadeler verilmiştir:


    I. Adi ortaklıklarda, verginin ödenmesinden müteselsilen sorumlu olmak üzere ortaklardan herhangi biri adına tarhiyat
    yapılır.

    II. Türkiye''de yerleşmiş olmayan gerçek kişilerde, bu kanuna göre vergi kesintisi yapmakla sorumlu kişi tarhiyata muhatap
    tutulur.

    III. Vergi kesintisi yapmakla sorumlu tutulan bir şahsın bulunamaması halinde, mükellefin Türkiye''deki daimi temsilcisi
    tarhiyata muhatap tutulur.

    IV. Daimi temsilci mevcut değilse, tarhiyata muhatap mükellefin beyan ettiği herhangi bir gerçek kişidir.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I, II ve III
    C: II ve III
    D: I ve IV
    E: I, II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'KDVK md. 44''e göre KDV, mükellef adına tarholunur; adi ortaklıklarda ortaklardan herhangi biri müteselsilen
      sorumlu olmak üzere muhatap tutulur (I). Türkiye''de yerleşmemiş gerçek kişilerde vergi kesintisi yapmakla sorumlu kişi,
      bulunamazsa daimi temsilci muhataptır (II ve III). Daimi temsilci mevcut değilse muhatap, işlemleri mükellef adına yapanlardır;
      mükellefin beyan ettiği herhangi bir kişi değildir (IV yanlış). Püf noktaları: (1) Muhataplık sırası vardır: önce vergi
      kesintisi yapmakla sorumlu, sonra daimi temsilci, en son işlemleri mükellef adına yapanlar. (2) IV. ifade sıra kuralını
      bozduğu için yanlıştır. (3) I. ifadedeki müteselsil sorumluluk adi ortaklığa özgüdür.'
    celdiriciler:
      A: Yalnız I seçeneği eksiktir; II ve III de md. 44/b hükmüne uygundur.
      C: I. ifade de doğrudur; adi ortaklıklarda ortaklardan herhangi birinin tarhiyata muhatap tutulması md. 44/a hükmüdür.
      D: IV. ifade yanlıştır; daimi temsilci mevcut değilse muhatap, işlemleri mükellef adına yapanlardır. Ayrıca II ve III
        doğru olduğundan seçenek eksiktir.
      E: IV. ifade yanlış olduğundan tüm ifadelerin doğru kabul edilmesi hatalıdır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 44/a
    alinti: 'Katma Değer Vergisi, bu vergiyle mükellef gerçek veya tüzelkişiler adına tarholunur. Şu kadar ki: a) Adi ortaklıklarda,
      verginin ödenmesinden müteselsilen sorumlu olmak üzere ortaklardan herhangi biri,'
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 44/b
    alinti: Türkiye'de yerleşmiş olmayan gerçek kişiler ile kanuni merkez veya iş merkezlerinden her ikisi de Türkiye içinde
      bulunmayan tüzelkişilerde, bu kanuna göre vergi kesintisi yapmakla sorumlu kişi; vergi kesintisi yapmakla sorumlu tutulan
      bir şahsın bulunamaması halinde, mükellefin Türkiye'deki daimi temsilcisi, Türkiye'de birden fazla temsilcisinin mevcudiyeti
