        olunan vergi dairesince tarholunur; iş yeri başına ayrı ayrı tarh söz konusu değildir.
      B: Md. 43/1'e göre genel tarh yeri mükellefin iş yerinin bulunduğu yer vergi dairesidir; ikametgâh esas değildir.
      C: Md. 43/4'e göre ithalde alınan KDV ilgili gümrük idaresince tarholunur.
      E: Md. 43/5'e göre bu taşımacılığa ait KDV ilgili gümrük idaresince tarholunur; temsilcinin vergi dairesi esas değildir.
