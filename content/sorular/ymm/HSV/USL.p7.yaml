    C: İthalde alınan KDV, ithalatçının bağlı olduğu vergi dairesince tarholunur.
    D: Gayrimenkul teslimlerinde mükellefin istemi halinde KDV, beyan üzerine gayrimenkulün bulunduğu yer vergi dairesince
      tarholunur.
    E: Türkiye'de ikametgâhı ve iş merkezi bulunmayanların motorlu kara taşıtlarıyla yaptığı taşımacılığa ait KDV, mükellefin
      temsilcisinin bağlı olduğu vergi dairesince tarholunur.
  dogru: D
  aciklama:
    dogru_neden: 'KDVK md. 43/3''e göre gayrimenkul teslimlerinde mükellefin istemi halinde KDV, beyan üzerine gayrimenkulün
      bulunduğu yer vergi dairesince tarholunur. Diğer seçenekler hatalıdır: genel kural iş yerinin bulunduğu yer vergi dairesidir
      (md. 43/1); birden fazla vergi dairesinin bölgesinde iş yeri varsa gelir veya kurumlar vergisi yönünden bağlı olunan
      vergi dairesi tarhı yapar (md. 43/2); ithalde ve yerleşik olmayanların motorlu kara taşıtlarıyla taşımacılığında ilgili
      gümrük idaresi tarhı yapar (md. 43/4, 43/5).'
    celdiriciler:
