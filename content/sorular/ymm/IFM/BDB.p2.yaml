  kok: 'Mavi AŞ, KVK md. 19/3-b kapsamında kısmi bölünme yoluyla, üretim işletmelerinden birini işletme bütünlüğünü koruyacak
    şekilde yeni kurulan Lacivert AŞ''ye kayıtlı değerleri üzerinden ayni sermaye olarak koymuştur. Karşılığında edinilen
    Lacivert AŞ paylarının tamamı Mavi AŞ''de kalmıştır. Devredilen kalemlerin kayıtlı değerleri: 253 Tesis, Makine ve Cihazlar
    4.000.000 TL; bunlara ait 257 Birikmiş Amortismanlar 1.500.000 TL; 150 İlk Madde ve Malzeme 800.000 TL; işletmeye ait
    320 Satıcılar 300.000 TL. İşletmenin rayiç değeri 5.000.000 TL''dir.


    Mavi AŞ''nin bölünme kaydı hangisidir?'
