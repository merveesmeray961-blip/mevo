  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: birleşme ve devir kayıtları (devralan ve devrolunan)
  tip: uygulama
  zorluk: 3
  kok: 'Rüzgâr AŞ, ilişkili olmadığı Fırtına AŞ''yi 1.7.2026 tarihinde devralma yoluyla birleşmeyle devralmıştır; işlem TFRS
    3 kapsamında bir işletme birleşmesidir ve edinen işletme Rüzgâr AŞ''dir. Birleşmeye ilişkin bilgiler şöyledir:


    - Fırtına AŞ ortaklarına verilen Rüzgâr AŞ paylarının itibari değeri 1.000.000 TL, birleşme tarihindeki gerçeğe uygun
    değeri 4.200.000 TL''dir.

    - Ortaklara ayrıca 200.000 TL nakit denkleştirme ödenmiştir.

    - Fırtına AŞ''nin 2027 hasılatı belirli bir tutarı aşarsa eski ortaklarına 500.000 TL ek ödeme yapılacaktır; bu koşullu
    bedelin birleşme tarihindeki gerçeğe uygun değeri 300.000 TL''dir.

    - Fırtına AŞ''nin tanımlanabilir varlık ve borçlarının birleşme tarihindeki net gerçeğe uygun değeri 5.000.000 TL, kayıtlı
    değeri 3.600.000 TL''dir.

    - Rüzgâr AŞ, TFRS 3 par. 36 uyarınca yaptığı gözden geçirmede tanımlama ve ölçümlerin doğru olduğunu teyit etmiştir.


    Ertelenmiş vergi etkisi dikkate alınmayacaktır. Buna göre Rüzgâr AŞ''nin TFRS''ye göre hazırlanan finansal tablolarında
    birleşmenin sonucu hangisidir?'
  secenekler:
    A: 100.000 TL pazarlıklı satın alım kazancı; birleşme tarihinde kâr veya zararda
    B: 300.000 TL pazarlıklı satın alım kazancı; doğrudan özkaynakta sermaye yedeği olarak
    C: 600.000 TL pazarlıklı satın alım kazancı; birleşme tarihinde kâr veya zararda
    D: 1.100.000 TL şerefiye; maddi olmayan duran varlık olarak
    E: 300.000 TL pazarlıklı satın alım kazancı; birleşme tarihinde kâr veya zararda
  dogru: E
  aciklama:
    dogru_neden: 'Transfer edilen bedel gerçeğe uygun değerle ölçülür ve koşullu bedelin birleşme tarihindeki gerçeğe uygun
      değerini içerir (par. 37, 39): 4.200.000 + 200.000 + 300.000 = 4.700.000 TL. Tanımlanabilir net varlıklar 5.000.000
      TL olduğundan 300.000 TL fazla vardır. Gözden geçirmeden sonra da kalan bu fazla, pazarlıklı satın alım kazancı olarak
      birleşme tarihinde kâr veya zararda muhasebeleştirilir (par. 34, 36). Püf noktaları: Koşullu bedel nominal tutarla (500.000)
      değil gerçeğe uygun değerle (300.000) bedele katılır; paylar itibari değerle değil gerçeğe uygun değerle ölçülür. Kayıtlı
      değer (3.600.000) TFRS ölçümünde kullanılmaz; kazanç özkaynağa değil kâr veya zarara yazılır.'
    celdiriciler:
      A: Koşullu bedel gerçeğe uygun değeri yerine 500.000 TL'lik nominal tutarla bedele katılmıştır.
      B: Tutar doğrudur; ancak pazarlıklı satın alım kazancı özkaynakta değil kâr veya zararda muhasebeleştirilir.
      C: Koşullu bedel transfer edilen bedele dahil edilmemiştir (par. 39).
      D: Net varlıklar gerçeğe uygun değer yerine kayıtlı değerle (3.600.000) ölçülmüştür.
    hesap_adimlari:
    - 'Transfer edilen bedel: 4.200.000 + 200.000 + 300.000 = 4.700.000'
    - 'Net tanımlanabilir varlıklar (GUD): 5.000.000'
    - 'Pazarlıklı satın alım kazancı: 5.000.000 − 4.700.000 = 300.000 (K/Z)'
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 34
    alinti: Eğer söz konusu fazla tutar, 36'ncı paragraf hükümleri uygulandıktan sonra da kalıyorsa edinen işletme sonuç olarak
