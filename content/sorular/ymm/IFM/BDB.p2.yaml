- id: YMM-IFM-BDB-0012
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: birleşme ve devir kayıtları (devralan ve devrolunan)
  tip: hesaplama
  zorluk: 1
  kok: 'Hesap dönemi takvim yılı olan Kartal AŞ, KVK md. 19 ve 20 şartlarına uygun olarak Şahin AŞ''yi devralmıştır; devre
    ilişkin karar 31.12.2025 tarihinde ticaret siciline tescil edilmiş ve Şahin AŞ''nin 2025 yılı amortismanları devir beyannamesinde
    dikkate alınmıştır. Devralınan bir makinenin maliyet bedeli 1.000.000 TL, birikmiş amortismanı 600.000 TL''dir; makine
    5 yıllık faydalı ömre göre normal amortisman yöntemiyle amortismana tabi tutulmakta olup 3 yıllık amortismanı ayrılmıştır.
    Devir tarihinde makinenin rayiç değeri 700.000 TL''dir.


    Vergi mevzuatı bakımından Kartal AŞ''nin 2026 yılında bu makine için ayıracağı amortisman kaç TL''dir?'
  secenekler:
    A: '80.000'
    B: '140.000'
    C: '200.000'
    D: '350.000'
    E: '500.000'
  dogru: C
  aciklama:
    dogru_neden: 'Devirde varlıklar kayıtlı değerleriyle, düzenleyici hesaplarıyla birlikte devralınır ve devir ilk iktisap
      sayılmaz; devralan kurum bakiye değer üzerinden kalan amortisman süresine göre amortismana devam eder (Tebliğ 19.3.2).
      Bakiye değer 400.000 TL, kalan süre 2 yıl: 400.000 / 2 = 200.000 TL (maliyet bedelinin %20''si ile aynı sonuç).'
    celdiriciler:
      A: Devir yeni iktisap gibi değerlendirilmiş, bakiye değer yeniden 5 yıla bölünmüştür.
      B: Rayiç değer yeni maliyet sayılarak 5 yıla bölünmüştür; devirde rayiç değer kullanılmaz.
      D: Rayiç değer kalan 2 yıla bölünmüştür; esas alınacak tutar kayıtlı bakiye değerdir.
      E: Birikmiş amortisman dikkate alınmadan maliyet bedeli kalan 2 yıla bölünmüştür.
    hesap_adimlari:
    - 'Bakiye değer: 1.000.000 − 600.000 = 400.000'
    - 'Kalan süre: 5 − 3 = 2 yıl'
    - '2026 amortismanı: 400.000 / 2 = 200.000'
  kaynaklar:
