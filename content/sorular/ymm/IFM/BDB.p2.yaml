    madde: 19.3.2
    alinti: devralan kurumda devir ve bölünme işlemi nedeniyle devrolan amortismana tabi iktisadi kıymetlerin bakiye değerleri
      üzerinden kalan amortisman süreleri dikkate alınarak amortisman ayrılmaya devam edilecektir.
  gecerlilik: *id001
  dogrulama:
    python: 'bakiye = 1000000 - 600000

      kalan = 5 - 3

      sonuc = bakiye / kalan'
