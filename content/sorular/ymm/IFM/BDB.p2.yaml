- id: YMM-IFM-BDB-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: tasfiye muhasebesi
  tip: hesaplama
  zorluk: 3
  kok: 'Lale AŞ 2026 yılında tasfiyeye girmiş ve tasfiye aynı yıl sona ermiştir. Tasfiye dönemine ilişkin bilgiler şöyledir:


    - Tasfiye başı bilançosundaki öz sermaye: 2.000.000 TL

    - Tasfiye başı bilançosunun pasifinde, ticari esaslara göre ayrılmış ancak vergi kanunlarına göre ayrılmış olmayan (kanunen
    kabul edilmeyen gider olarak dikkate alınmış) 100.000 TL dava karşılığı vardır. Dava tasfiye sırasında sonuçlanmış, 100.000
    TL ödenerek karşılık kapatılmıştır.

    - Tasfiye sırasında kayıtlı değeri 300.000 TL olan bir arsa hisselerine mahsuben bir ortağa verilmiş ve kayıtlarda kayıtlı
    değeriyle öz sermayeden düşülmüştür. Arsanın dağıtım günündeki, KVK md. 13''e göre belirlenen emsal bedeli 500.000 TL''dir.

    - Tasfiye sonu bilançosundaki öz sermaye (arsa dağıtımı yansıtılmış hâliyle): 2.300.000 TL


    Tasfiye kârının tespitinde dikkate alınacak başka bir unsur yoktur. KVK md. 17''ye göre Lale AŞ''nin tasfiye kârı kaç
    TL''dir?'
  secenekler:
    A: '300.000'
    B: '500.000'
    C: '600.000'
    D: '700.000'
    E: '800.000'
  dogru: D
  aciklama:
    dogru_neden: 'Tasfiye kârı, tasfiye sonu ve başı servet değerleri arasındaki olumlu farktır (md. 17/4). Vergi kanunlarına
      göre ayrılmamış karşılıklar sermayeye dahil olduğundan (md. 17/6) tasfiye başı servet 2.000.000 + 100.000 = 2.100.000
      TL''dir. Ortağa ayni olarak dağıtılan arsa, dağıtım günündeki KVK md. 13''e göre belirlenen değeriyle (500.000 TL) tasfiye
      sonu servetine eklenir (md. 17/4-a-1 ve b): 2.300.000 + 500.000 = 2.800.000 TL. Tasfiye kârı = 2.800.000 − 2.100.000
      = 700.000 TL. Püf noktaları: Kanunen kabul edilmeyen karşılık servetin parçasıdır; başa eklenmezse tasfiye sırasında
      yapılan ödeme kâr hesabında indirilmemiş olur. Ayni dağıtım kayıtlı değerle değil emsal bedelle sona eklenir.'
    celdiriciler:
      A: Ayni dağıtım sona eklenmemiş, vergi kanunlarına göre ayrılmamış karşılık da başa eklenmemiştir.
      B: Ayni dağıtım emsal bedel yerine kayıtlı değerle (300.000) sona eklenmiştir.
      C: Ayni dağıtım kayıtlı değerle eklenmiş, karşılık da başlangıç servetine dahil edilmemiştir.
      E: Vergi kanunlarına göre ayrılmamış karşılık başlangıç servetine eklenmemiştir.
    hesap_adimlari:
    - 'Başlangıç serveti: 2.000.000 + 100.000 = 2.100.000'
    - 'Son servet: 2.300.000 + 500.000 (emsal bedel) = 2.800.000'
    - 'Tasfiye kârı: 2.800.000 − 2.100.000 = 700.000'
  kaynaklar:
