  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: birleşme ve devir kayıtları (devralan ve devrolunan)
  tip: hesaplama
  zorluk: 3
  kok: 'Kuzey AŞ, sermayesi 3.000.000 TL olan (3.000.000 adet, 1 TL itibari değerli pay) Güney AŞ''nin 1.200.000 adet payına
    sahiptir; bu paylar Kuzey AŞ''nin kayıtlarında 1.500.000 TL değerle izlenmektedir. Kuzey AŞ, Güney AŞ''yi KVK md. 19 kapsamında
    devralmıştır. Güney AŞ''nin kayıtlı öz sermayesi 4.500.000 TL''dir. Değişim oranı payların gerçek değerlerine göre belirlenmiştir:
    Kuzey AŞ payının gerçek değeri 5 TL, Güney AŞ payının gerçek değeri 2 TL''dir (Kuzey AŞ payları da 1 TL itibari değerlidir).


    1 Seri No.lu KV Genel Tebliği''ndeki açıklama doğrultusunda, Güney AŞ''nin diğer ortaklarının haklarını koruyacak düzeyde
    Kuzey AŞ''nin yapması gereken sermaye artırımı kaç TL''dir?'
  secenekler:
    A: '480.000'
    B: '720.000'
    C: 1.200.000
    D: 1.800.000
    E: 3.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Değişim oranı = 2 / 5 = 0,4 (1 Güney payı karşılığında 0,4 Kuzey payı; TTK md. 140/1). Devralan şirketin
      devrolunan şirketteki kendi payları karşılığında pay ihracı gerekmez; Tebliğ 19.1''e göre sermaye artışının iştirak
      paylarına isabet eden tutarda daha az gerçekleşmesi devir şartlarını ihlal etmez. Diğer ortakların payı 3.000.000 −
      1.200.000 = 1.800.000 adet; sermaye artırımı = 1.800.000 × 0,4 = 720.000 TL. Püf noktaları: Önce gerçek değerlerden
      değişim oranı bulunur, sonra yalnız Kuzey AŞ dışındaki ortakların payına uygulanır. Kayıtlı öz sermaye ve iştirakin
      defter değeri bu hesapta gereksiz veridir.'
    celdiriciler:
      A: Değişim oranı, diğer ortakların payı yerine Kuzey AŞ'nin sahip olduğu 1.200.000 paya uygulanmıştır.
      C: Kuzey AŞ'nin kendi payları dışlanmadan tüm paylara değişim oranı uygulanmıştır.
      D: Diğer ortakların payları dışlanmış, ancak gerçek değere dayalı değişim oranı yerine 1'e 1 itibari değer esas alınmıştır.
      E: Ne iştirak payları dışlanmış ne de değişim oranı uygulanmış; sermaye aynen devralınmıştır.
    hesap_adimlari:
    - 'Değişim oranı: 2 / 5 = 0,4'
    - 'Diğer ortakların pay adedi: 3.000.000 − 1.200.000 = 1.800.000'
    - 'Sermaye artırımı: 1.800.000 × 0,4 × 1 TL = 720.000'
  kaynaklar:
