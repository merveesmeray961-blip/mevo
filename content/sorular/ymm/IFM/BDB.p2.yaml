  kok: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği'ne göre, KVK md. 19 kapsamında devir yoluyla gerçekleştirilen bir birleşmede
    devrolunan şirketin ortaklarına verilecek paylar ile devre konu varlıkların değeri arasındaki ilişkiye ilişkin aşağıdaki
    ifadelerden hangisi doğrudur?
  secenekler:
    A: Varlıkların kayıtlı değerle devri, kayıtlı değer kadar pay verilmesini gerektirmez; değişim oranı payların gerçek değerine
      göre belirlenebilir
    B: Varlıklar kayıtlı değerle devralındığından, verilecek payların itibari değer toplamı devrolunan şirketin kayıtlı öz
      sermayesine eşit olmalıdır
    C: Değişim oranı yalnız VUK'a göre belirlenen servet değeri üzerinden hesaplanabilir; gerçek değer kullanılması işlemi
      devir olmaktan çıkarır
    D: Devralınan varlıklar devralan şirketin kayıtlarına rayiç bedelleriyle alınır; verilecek payların sayısı da bu rayiç
      bedellere göre belirlenir
    E: Paylar ortaklara devrolunan şirketteki servet değerleriyle orantısız dağıtılsa da işlem devir sayılır; yalnız örtülü
      kazanç incelemesi yapılır
  dogru: A
  aciklama:
    dogru_neden: Tebliğin 19.3.1 bölümüne göre varlıkların kayıtlı değerleri üzerinden intikali, ortaklara kayıtlı değer kadar
      pay verilmesini gerektirmez; şirketler ortakların haklarını koruyacak bir değişim oranı belirler ve bu oran payların
      gerçek değeri üzerinden belirlenebilir. Böylece devirde varlıklar kayıtlı değerle, pay değişimi ise gerçek değerle ilişkilendirilir.
    celdiriciler:
      B: Tebliğ, kayıtlı değer kadar pay verilmesinin gerekmediğini açıkça belirtir.
      C: Değişim oranının gerçek değer üzerinden belirlenmesi mümkündür; bu, devir niteliğini ortadan kaldırmaz.
      D: KVK md. 19/1-b uyarınca bilanço değerleri aynen devralınır; rayiç bedelle kayıt devir şartını bozar.
      E: Devir veya bölünme sayılması için payların ortaklara servet değerleriyle orantılı dağıtılması gerekir.
  kaynaklar:
