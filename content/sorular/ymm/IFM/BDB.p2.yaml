    madde: '19.1'
    alinti: Bir kurumun kendisinde iştiraki bulunan veya iştirak ettiği başka bir kurumu kül halinde devralması nedeniyle
      kurum bünyesinde yapacağı sermaye artışının söz konusu iştirak paylarına isabet eden tutarda daha az gerçekleşmesi Kurumlar
