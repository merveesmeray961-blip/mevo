- id: YMM-IFM-ENF-0014
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Enflasyon düzeltmesi
  konu: ENF
  kazanim: enflasyon düzeltmesi farkları hesabı (698)
  tip: hesaplama
  zorluk: 3
  kok: 'Bulut AŞ''nin bilançosunda geçmiş dönem enflasyon düzeltmelerinden kaynaklanan 3.000.000 TL tutarında 502 Sermaye
    Düzeltmesi Olumlu Farkları bakiyesi bulunmaktadır. Şirket 2026 yılında bu bakiyeden:

    - 1.800.000 TL''yi sermayeye ilave etmiş (tescil 2026''da),

    - 700.000 TL''yi enflasyon düzeltmesi sonucu oluşmuş geçmiş yıl zararlarına mahsup etmiş,

    - 500.000 TL''yi ortaklarına nakden dağıtmıştır.

    VUK mükerrer 298/A-5''e göre bu işlemler nedeniyle 2026 yılında, dönem kazancıyla ilişkilendirilmeksizin vergiye tabi
    tutulacak tutar kaç TL''dir?'
  secenekler:
    A: '0'
    B: '500.000'
    C: 1.200.000
    D: 2.300.000
    E: 3.000.000
  dogru: B
  aciklama:
    dogru_neden: 'A-5''e göre pasif kalemlere ait enflasyon fark hesapları başka bir hesaba nakledildiği veya işletmeden çekildiği
      takdirde, o dönemin kazancıyla ilişkilendirilmeksizin vergiye tabi tutulur. Ancak özsermaye kalemlerine ait enflasyon
      farklarının düzeltme sonucu oluşan geçmiş yıl zararlarına mahsubu veya kurumlar vergisi mükelleflerince sermayeye ilavesi
      kâr dağıtımı sayılmaz. Bu nedenle yalnız ortaklara dağıtılan 500.000 TL vergiye tabidir. Püf noktaları: Genel kural
      (nakil = vergileme) ile iki istisnası (sermayeye ilave, düzeltme kaynaklı geçmiş yıl zararına mahsup) birlikte uygulanmalı;
      mahsup istisnası yalnız düzeltme sonucu oluşan zararlar içindir ve kökte bu şart sağlanmıştır.'
    celdiriciler:
      A: Dağıtım da istisna sanılmıştır; işletmeden çekme genel kurala göre vergilendirilir.
      C: Geçmiş yıl zararlarına mahsubu da vergilendirmek; düzeltme sonucu oluşan zararlara mahsup kâr dağıtımı sayılmaz.
      D: Sermayeye ilaveyi de 'başka hesaba nakil' sayarak vergilendirmek; kurumlar vergisi mükelleflerinde sermayeye ilave
        istisnadır.
      E: Bakiyenin tamamını, kullanım şekline bakmadan vergiye tabi saymak.
    hesap_adimlari:
    - Sermayeye ilave 1.800.000 → vergilendirilmez
    - Düzeltme kaynaklı zarara mahsup 700.000 → vergilendirilmez
    - Ortaklara dağıtım 500.000 → vergiye tabi
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-5
    alinti: Pasif kalemlere ait enflasyon fark hesapları, herhangi bir suretle başka bir hesaba nakledildiği veya işletmeden
      çekildiği takdirde, bu işlemlerin yapıldığı dönemlerin kazancı ile ilişkilendirilmeksizin, bu dönemde vergiye tâbi tutulur.
