  kok: 'Aşağıdaki tam mükellef ve bilanço esasına göre defter tutan kurumlardan hangileri 31.12.2026 tarihli mali tablolarını
    VUK mükerrer 298 kapsamında enflasyon düzeltmesine tabi tutar?

    I. ÜFE artışı içinde bulunulan dönem dahil son üç hesap döneminde %100''ü, 2026''da %10''u aşan tekstil üreticisi Lale
    AŞ

    II. Münhasıran sürekli olarak işlenmiş altın alım-satımı ve imaliyle iştigal eden Sarı AŞ (endeks şartları gerçekleşmemiştir)

    III. VUK geçici md. 33''ün dördüncü fıkrası kapsamındaki bir banka'
  secenekler:
    A: Yalnız II
    B: Yalnız I
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: 'VUK geçici md. 37/1''e göre 2025 hesap dönemi ile 2026 ve 2027 hesap dönemlerinde (geçici vergi dönemleri
      dahil) şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine tabi tutulmaz; bu nedenle I
