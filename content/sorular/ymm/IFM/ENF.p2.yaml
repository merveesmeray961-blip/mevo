- id: YMM-IFM-ENF-0009
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Enflasyon düzeltmesi
  konu: ENF
  kazanim: düzeltme katsayıları
  tip: hesaplama
  zorluk: 2
  kok: 'Münhasıran sürekli olarak işlenmiş altın alım-satımı ve imali ile iştigal eden Parlak AŞ, 31.12.2026 tarihli bilançosunu
    VUK mükerrer 298''e göre enflasyon düzeltmesine tabi tutmaktadır. Varsayımsal ÜFE değerleri: Aralık 2025 = 3.000; Haziran
    2026 = 3.250; Aralık 2026 = 3.900.

    - Arsa: 2023''te 1.000.000 TL''ye alınmış, 31.12.2025 itibarıyla düzeltilmiş değeri 1.500.000 TL''dir.

    - Makine: Haziran 2026''da 800.000 TL''ye alınıp kaydedilmiştir (yıl sonunda henüz kullanılmaya başlanmamış, amortisman
    ayrılmamıştır).

    Bu iki kalemin düzeltilmesi sonucunda 698 Enflasyon Düzeltme Hesabına alacak olarak kaydedilecek toplam tutar kaç TL''dir?'
  secenekler:
    A: '450.000'
    B: '610.000'
    C: '690.000'
    D: 1.110.000
    E: 1.190.000
  dogru: B
  aciklama:
    dogru_neden: 'Arsanın 31.12.2025 düzeltilmiş değeri izleyen dönemin başlangıç değeridir (A-5); bu değer taşıma katsayısıyla
      (3.900 / 3.000 = 1,30) dönem sonuna taşınır: 1.500.000 × 1,30 = 1.950.000; fark 450.000 TL. Makine dönem içinde alındığından
      düzeltme katsayısı kayıt tarihine göre bulunur (A-2-d, A-3-b): 3.900 / 3.250 = 1,20; 800.000 × 1,20 = 960.000; fark
      160.000 TL. Parasal olmayan aktiflerdeki artışlar 698''in alacağına yazılır: 450.000 + 160.000 = 610.000 TL. Altın imali
      ve alım-satımıyla münhasıran iştigal edenler, A-9 ve geçici md. 37''nin son fıkrası uyarınca 2026''da da düzeltme yapar.'
    celdiriciler:
      A: Dönem içinde alınan makineyi düzeltme dışı bırakmak; dönem içi girişler de kayıt tarihinden itibaren düzeltilir.
      C: 'Makineye de dönem başı endeksine dayanan taşıma katsayısını (1,30) uygulamak: 240.000 + 450.000.'
      D: Arsanın farkını ilk maliyetten hesaplamak (1.950.000 − 1.000.000 = 950.000); geçmiş dönem farkları zaten kayıtlıdır.
      E: Hem arsa farkını ilk maliyetten hesaplamak hem de makineye taşıma katsayısı uygulamak.
    hesap_adimlari:
    - 'Taşıma katsayısı: 3.900 / 3.000 = 1,30 → arsa farkı 1.500.000 × 0,30 = 450.000'
    - 'Düzeltme katsayısı: 3.900 / 3.250 = 1,20 → makine farkı 800.000 × 0,20 = 160.000'
    - '698 alacağı: 450.000 + 160.000 = 610.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-2-d, k
    alinti: Taşıma katsayısı; malî tabloların ait olduğu aya ilişkin fiyat endeksinin, bir önceki dönemin sonundaki (yıl içinde
      işe başlayanlarda, işe başlanılan aya ilişkin) fiyat endeksine bölünmesiyle elde edilen katsayıyı
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-5
    alinti: Düzeltme sonucu bulunan tutarlar, izleyen dönemde enflasyon düzeltmesi yapılıp yapılmadığına bakılmaksızın, izleyen
      dönemin başlangıç değerleri olarak dikkate alınır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-9
    alinti: Münhasıran sürekli olarak işlenmiş; altın, gümüş alım- satımı ve imali ile iştigal eden mükellefler bu fıkranın
      (1) numaralı bendinde yer alan şartlara bakılmaksızın enflasyon düzeltmesi yaparlar.
  gecerlilik: *id001
  dogrulama:
    python: 'arsa = 1500000 * (3900/3000) - 1500000

      makine = 800000 * (3900/3250) - 800000

      sonuc = round(arsa + makine)'
  durum: taslak
  surum: 1
