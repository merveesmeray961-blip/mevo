  kok: 'Enflasyon düzeltmesi yapmakla yükümlü Işık AŞ''nin 31.12.2024 tarihli bilançosunun düzeltilmesi sonucunda: parasal
    olmayan aktif kalemlerde toplam 2.400.000 TL artış, ödenmiş sermayede 1.000.000 TL artış ve hisse senedi ihraç primlerinde
    300.000 TL artış ortaya çıkmış; bu farklar ilgili hesaplar karşılığında 698 Enflasyon Düzeltme Hesabına kaydedilmiştir.
    Gelir tablosu kalemleri düzeltilmemiştir. 698 hesabının kapatılmasına ilişkin yevmiye kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 698 Enflasyon Düzeltme Hs. (B) 1.100.000 / 648 Enflasyon Düzeltmesi Kârları (A) 1.100.000
    B: 658 Enflasyon Düzeltmesi Zararları (B) 1.100.000 / 698 Enflasyon Düzeltme Hs. (A) 1.100.000
    C: 698 Enflasyon Düzeltme Hs. (B) 2.400.000 / 648 Enflasyon Düzeltmesi Kârları (A) 2.400.000
    D: 698 Enflasyon Düzeltme Hs. (B) 1.100.000 / 502 Sermaye Düzeltmesi Olumlu Farkları (A) 1.100.000
    E: 698 Enflasyon Düzeltme Hs. (B) 1.400.000 / 648 Enflasyon Düzeltmesi Kârları (A) 1.400.000
  dogru: A
  aciklama:
    dogru_neden: 698 hesabının alacağına parasal olmayan aktiflerdeki artışlar (2.400.000), borcuna parasal olmayan pasiflerdeki
      artışlar (1.000.000 + 300.000 = 1.300.000) yazılır. Hesap 1.100.000 TL alacak kalanı verir. THP açıklamasına göre alacak
      kalanı 698'in borcuna karşılık 648 Enflasyon Düzeltmesi Kârları hesabına devredilerek kapatılır.
    celdiriciler:
      B: Borç kalanı veren 698'in kapanış kaydıdır; burada aktif farkları pasif farklarından büyük olduğundan hesap alacak
        kalanı verir.
      C: Pasif kalemlerin 698'in borcuna yazılan farklarını (1.300.000) netleştirmeden yalnız aktif farklarını aktarmak.
      D: 502 hesabı, sermaye düzeltmesinin 698'in borcuna karşılık alacaklandırıldığı hesaptır; 698'in kapanışı gelir tablosu
        hesaplarına (648/658) yapılır.
      E: İhraç primlerindeki 300.000 TL farkı pasif farkı olarak 698'in borcuna yazmayı unutmak.
    hesap_adimlari:
    - '698 alacak: 2.400.000'
    - '698 borç: 1.000.000 + 300.000 = 1.300.000'
    - 'Alacak kalanı: 1.100.000 → 648''e devir'
  kaynaklar:
