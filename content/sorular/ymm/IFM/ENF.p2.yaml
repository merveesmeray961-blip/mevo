- id: YMM-IFM-ENF-0013
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Enflasyon düzeltmesi
  konu: ENF
  kazanim: TMS 29 yüksek enflasyonlu ekonomi
  tip: hesaplama
  zorluk: 3
  kok: 'Geçerli para birimi yüksek enflasyonlu bir ekonominin para birimi olan Ekin AŞ''nin aşağıdaki bakiyeleri 2026 yılı
    boyunca değişmemiştir (ortalama bakiyeler dönem başı ve sonu bakiyelerine eşittir):

    - Kasa ve bankalar: 800.000 TL

    - Ticari alacaklar: 1.200.000 TL

    - Stoklar: 1.500.000 TL

    - Verilen sipariş avansları (mal teslimiyle kapanacak): 400.000 TL

    - Ticari borçlar: 2.500.000 TL

    - Banka kredisi (sabit faizli, endekse bağlı değil): 1.000.000 TL

    Genel fiyat endeksi dönem başında 200, dönem sonunda 250''dir. TMS 29 par. 27''deki tahmin yöntemine göre Ekin AŞ''nin
    2026 yılı net parasal pozisyon kazancı veya kaybı aşağıdakilerden hangisidir?'
  secenekler:
    A: 100.000 TL kayıp
    B: 125.000 TL kazanç
    C: 275.000 TL kazanç
    D: 300.000 TL kazanç
    E: 375.000 TL kazanç
  dogru: E
  aciklama:
    dogru_neden: 'Parasal kalemler, para olarak alınacak veya ödenecek kalemlerdir (par. 12): parasal varlıklar 800.000 +
      1.200.000 = 2.000.000; parasal borçlar 2.500.000 + 1.000.000 = 3.500.000. Stoklar ve mal teslimiyle kapanacak avanslar
      parasal değildir. Net parasal borç 1.500.000 TL; endeks değişimi (250 − 200) / 200 = %25. Parasal borcu parasal varlığından
      fazla olan işletme satın alma gücü kazanır (par. 27): 1.500.000 × %25 = 375.000 TL kazanç; kâr veya zarara dahil edilir
      (par. 9, 28). Püf noktaları: Avans parasal değildir, sabit faizli kredi parasaldır; endeks değişimi dönem başı endekse
      göre hesaplanır; net borç pozisyonu kazanç doğurur.'
    celdiriciler:
      A: 'Stokları ve avansları parasal varlık saymak: net parasal varlık 400.000 × %25 = 100.000 kayıp.'
      B: 'Sabit faizli banka kredisini parasal saymamak: net parasal borç 500.000 × %25 = 125.000.'
      C: 'Verilen sipariş avanslarını parasal varlık saymak: net parasal borç 1.100.000 × %25 = 275.000.'
      D: 'Endeks değişimini dönem sonu endekse bölerek (%20) hesaplamak: 1.500.000 × %20.'
    hesap_adimlari:
    - 'Parasal varlıklar: 800.000 + 1.200.000 = 2.000.000'
    - 'Parasal borçlar: 2.500.000 + 1.000.000 = 3.500.000'
    - 'Net parasal borç: 1.500.000; endeks değişimi: 50 / 200 = %25'
    - 'Kazanç: 1.500.000 × 0,25 = 375.000'
  kaynaklar:
  - mevzuat: TMS 29 Yüksek Enflasyonlu Ekonomilerde Finansal Raporlama
    madde: par. 27
    alinti: Enflasyon döneminde, aktif ve borçlarının bir fiyat düzeyine bağlı olmadığı oranda, parasal borçlarından daha
      fazla parasal varlık taşıyan bir işletme satın alma gücünü kaybederken, parasal varlıklarından daha fazla parasal borç
      taşıyan bir işletme ise satın alma gücü kazanır. … Kazanç veya kayıp, parasal aktifler ve parasal borçlar arasındaki
      dönem içi ağırlıklı ortalama farkın genel fiyat endeksindeki değişim ile çarpılması yoluyla tahmin edilebilir.
  - mevzuat: TMS 29 Yüksek Enflasyonlu Ekonomilerde Finansal Raporlama
    madde: par. 12
    alinti: Parasal kalemler elde tutulan para ile para olarak alınacak veya ödenecek kalemlerdir.
