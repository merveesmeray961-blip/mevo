- id: YMM-IFM-ENF-0049
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Enflasyon muhasebesi
  konu: ENF
  kazanim: 'TMS 29: ertelenmiş ödemeli stokların düzeltilmesi ve net gerçekleşebilir değer sınırı'
  tip: hesaplama
  zorluk: 3
  kok: 'TMS 29''u uygulayan bir işletme, 15.3.2026''da faturası düzenlenen ve bedeli faiz yükü oluşturmayan bir anlaşma çerçevesinde
    15.6.2026''da ödenen 900.000 TL maliyetli ticari malları 31.12.2026''da stoklarında bulundurmaktadır (faiz tutarının tespiti
    pratik olmamaktadır). Genel fiyat endeksi Mart 2026: 150, Haziran 2026: 180, Aralık 2026: 270''tir; malların 31.12.2026''daki
    net gerçekleşebilir değeri 1.500.000 TL''dir. Bu malların 31.12.2026 finansal durum tablosunda gösterileceği tutar kaç
    TL''dir?'
  secenekler:
    A: '900.000'
    B: 1.080.000
    C: 1.350.000
    D: 1.500.000
    E: 1.620.000
  dogru: C
  aciklama:
    dogru_neden: 'Faiz tutarının tespitinin pratik olmadığı ve açık faiz yükü oluşturmayan ertelenmiş ödemelerde aktif, iktisap
      tarihinden değil ödeme tarihinden itibaren düzeltilir (TMS 29.22). Düzeltilmiş tutar = 900.000 × 270 / 180 = 1.350.000
      TL; bu tutar net gerçekleşebilir değeri (1.500.000) aşmadığından azaltılmaz (TMS 29.19). Püf noktaları: Önce düzeltme
      tarihini (ödeme tarihi) belirleyin, sonra düzeltilmiş tutarı net gerçekleşebilir değerle karşılaştırın; fatura tarihindeki
      endeks (150) bu soruda gereksiz veridir ve sizi 1.620.000''e götürür.'
    celdiriciler:
      A: Parasal olmayan kalem düzeltilmemiştir; stoklar da düzeltmeye tabidir (14, 15).
      B: Yalnızca ödeme tarihine kadarki endeks artışı (180 / 150) uygulanmıştır; bilanço tarihine kadar düzeltme yapılmalıdır.
      D: İktisap tarihinden düzeltilen 1.620.000 TL, net gerçekleşebilir değere indirilmiştir; ancak düzeltme tarihi yanlıştır.
      E: Düzeltme iktisap tarihinden (270 / 150) yapılmıştır; ertelenmiş ödemede ödeme tarihi esas alınmalıdır.
    hesap_adimlari:
    - 'Düzeltme tarihi: ödeme tarihi (Haziran 2026, endeks 180)'
    - 900.000 × 270 / 180 = 1.350.000
    - 1.350.000 < NGD 1.500.000 → azaltma yok
  kaynaklar:
  - mevzuat: TMS 29 Yüksek Enflasyonlu Ekonomilerde Finansal Raporlama
    madde: '22'
    alinti: Faiz tutarının tespitinin pratik olmadığı durumlarda; böyle aktifler iktisap tarihinden değil, ödeme tarihinden
      itibaren düzeltilir.
  - mevzuat: TMS 29 Yüksek Enflasyonlu Ekonomilerde Finansal Raporlama
