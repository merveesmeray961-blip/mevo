- id: YMM-IFM-ENF-0048
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Enflasyon muhasebesi
  konu: ENF
  kazanim: mükerrer 298/A-1 şartları ve geçici 37 uygulaması
  tip: uygulama
  zorluk: 2
  kok: 'Bilanço esasına göre defter tutan, hesap dönemi takvim yılı olan bir anonim şirketin (altın veya gümüş işlemleriyle
    uğraşmamaktadır) 30.6.2026 geçici vergi dönemi mali tablolarına ilişkin olarak, Yİ-ÜFE endeksi Haziran 2023: 1.600, Haziran
    2025: 3.200 ve Haziran 2026: 3.700 olduğuna göre aşağıdakilerden hangisi doğrudur? (Geçici vergi dönemlerinde son üç hesap
    dönemi yerine üçer aylık dönemlerin son ayı dahil önceki otuz altı ay ve son on iki ay dikkate alınır; endeks değerleri
    soru için varsayılmıştır.)'
  secenekler:
    A: Otuz altı aylık artış %131,25, on iki aylık artış %15,63'tür; iki şart da gerçekleşmiş olmakla birlikte geçici 37 nedeniyle
      düzeltme yapılmaz
    B: Otuz altı aylık artış %131,25, on iki aylık artış %15,63'tür; iki şart da gerçekleştiğinden geçici vergi dönemi mali
      tabloları düzeltilir
    C: Otuz altı aylık artış %131,25, on iki aylık artış %15,63'tür; yalnızca bir şart gerçekleştiğinden düzeltme yapılmaz
    D: Otuz altı aylık artış %15,63, on iki aylık artış %131,25'tir; üç yıllık şart gerçekleşmediğinden düzeltme yapılmaz
    E: Otuz altı aylık artış %231,25, on iki aylık artış %115,63'tür; iki şart da gerçekleşmiş olmakla birlikte geçici 37
      nedeniyle düzeltme yapılmaz
  dogru: A
  aciklama:
    dogru_neden: 36 aylık artış = 3.700 / 1.600 − 1 = %131,25 (%100'ün üzerinde); 12 aylık artış = 3.700 / 3.200 − 1 = %15,63
      (%10'un üzerinde). A-1'deki iki şart birlikte gerçekleşmiştir; ancak geçici 37/1 uyarınca geçici vergi dönemleri dahil
      2026'da şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine tabi tutulmaz.
    celdiriciler:
      B: Şartlar gerçekleşse de geçici 37 düzeltmeyi engeller; düzeltme zorunluluğu doğmaz.
      C: On iki aylık artış %15,63 ile %10'u aşar; dolayısıyla iki şart da gerçekleşmiştir.
      D: 36 aylık artış Haziran 2023 ile karşılaştırılarak bulunur; Haziran 2025 tabanı yalnızca 12 aylık değişim içindir,
        oranlar yer değiştirmiştir.
      E: Oranlar artış değil endeks oranı olarak hesaplanmıştır (2,3125 − 1 = 1,3125); doğru artışlar %131,25 ve %15,63'tür.
    hesap_adimlari:
    - '36 aylık: 3.700 / 1.600 − 1 = 1,3125 → %131,25'
    - '12 aylık: 3.700 / 3.200 − 1 = 0,15625 → %15,63'
    - İki şart gerçekleşti; geçici 37/1 nedeniyle düzeltme yapılmaz
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 298/A-1
    alinti: Kapsama giren mükellefler, geçici vergi dönemlerinin sonu itibarıyla malî tabloları düzenlemek ve enflasyon düzeltmesi
      yapmak zorundadırlar. Geçici vergi dönemlerinde yukarıda belirtilen oranların tespitinde, son üç hesap dönemi yerine
      üçer aylık dönemlerin son ayı dahil önceki otuzaltı ay ve içinde bulunulan hesap dönemi yerine son oniki ay dikkate
      alınır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: geçici md. 37/1
    alinti: 2025 hesap dönemi ile geçici vergi dönemleri de dahil olmak üzere 2026 ve 2027 hesap dönemlerinde (kendilerine
      özel hesap dönemi tayin edilenlerde 2026, 2027 ve 2028 yılında biten hesap dönemleri itibarıyla) mükerrer 298 inci madde
      kapsamındaki enflasyon düzeltmesine ilişkin şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine
      tabi tutulmaz.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'u36 = 3700/1600 - 1

      u12 = 3700/3200 - 1

      sonuc = {''u36'': round(u36, 4), ''u12'': round(u12, 5), ''iki_sart'': u36 > 1.0 and u12 > 0.10}

      '
