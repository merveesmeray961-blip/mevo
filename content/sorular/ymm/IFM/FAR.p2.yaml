- id: YMM-IFM-FAR-0024
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: riskten korunma muhasebesi temel ilkeleri
  tip: uygulama
  zorluk: 3
  kok: 'Ege AŞ, 2027''de gerçekleşmesi yüksek olasılıklı bir döviz cinsinden satışın nakit akışlarını, 1.1.2025''te vadeli
    döviz sözleşmesiyle korunma altına almıştır; ilişki TFRS 9 par. 6.4.1 kıstaslarını sağlamaktadır. Korunma işleminin başından
    itibaren birikmiş tutarlar:

    - 31.12.2025: Korunma aracının birikmiş kazancı 50.000 TL; korunan kalemin beklenen nakit akışlarının bugünkü değerindeki
    birikmiş değişim (aracın tersi yönde) 60.000 TL

    - 31.12.2026: Korunma aracının birikmiş kazancı 130.000 TL; korunan kalemdeki birikmiş değişim 120.000 TL

    2026 yılında diğer kapsamlı gelire (nakit akış riskinden korunma fonuna) ve kâr veya zarara yansıyacak tutarlar aşağıdakilerin
    hangisinde doğru verilmiştir?'
  secenekler:
    A: DKG +60.000 TL; K/Z +20.000 TL
    B: DKG +70.000 TL; K/Z +10.000 TL
    C: DKG +80.000 TL; K/Z etkisi yok
    D: DKG +120.000 TL; K/Z +10.000 TL
    E: DKG +130.000 TL; K/Z etkisi yok
  dogru: B
  aciklama:
    dogru_neden: 'Par. 6.5.11(a): Nakit akış riskinden korunma fonu, başından itibaren aracın birikmiş kazancı ile korunan
      kalemdeki birikmiş değişimden mutlak değerce düşük olanına göre düzeltilir. 31.12.2025: min(50.000; 60.000) = 50.000
      → tamamı DKG, K/Z yok. 31.12.2026: min(130.000; 120.000) = 120.000. 2026 DKG artışı 120.000 − 50.000 = 70.000 TL. Aracın
      2026 kazancı 130.000 − 50.000 = 80.000 TL olduğundan kalan 10.000 TL etkin olmayan kısımdır ve kâr veya zarara yazılır
      (6.5.11(c)). Püf noktaları: Karşılaştırma dönemsel değil birikmiş tutarlarla yapılır; 2025''teki eksik korunmada K/Z''a
      bir şey yazılmaz.'
    celdiriciler:
      A: 'Testi dönemsel değişimlerle yapmak: aracın 80.000 ile kalemin 60.000 değişiminin düşüğü.'
      C: Aracın 2026 kazancının tamamını DKG'ye almak; birikmiş fon 130.000'e çıkar ve korunan kalemdeki 120.000'i aşar.
      D: Fondaki birikmiş bakiyeyi (120.000) 2026 hareketi sanmak; önceki yıldan devreden 50.000 düşülmelidir.
      E: Aracın birikmiş kazancının tamamını 2026'da DKG'ye almak; hem birikmiş-dönemsel ayrımı hem de 'düşük olanı' kuralı
        ihlal edilir.
    hesap_adimlari:
    - 'Fon 31.12.2025: min(50.000; 60.000) = 50.000'
    - 'Fon 31.12.2026: min(130.000; 120.000) = 120.000'
    - '2026 DKG: 120.000 − 50.000 = 70.000'
    - '2026 araç kazancı: 80.000; K/Z: 80.000 − 70.000 = 10.000'
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 6.5.11(a)-(c)
    alinti: 'Korunan kalemle ilgili olan özkaynağın ayrı bir bileşeni (nakit akış değişkenliğinden korunma fonu) aşağıdakilerden
      düşük olanına göre düzeltilir (mutlak değer itibarıyla): (i) Korunma işleminin başından itibaren korunma aracından kaynaklanan
      toplam kazanç veya kayıp ve (ii) Korunma işleminin başından itibaren korunan kalemin gerçeğe uygun değerinde (bugünkü
      değerinde) meydana gelen toplam değişim'
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 6.5.11(c)
    alinti: Korunma aracından kaynaklanan ve geriye kalan herhangi bir kazanç veya kayıp (veya (a) bendine göre hesaplanan
      nakit akış değişkenliğinden korunma fonunda meydana gelen değişimi dengelemesi gereken kazanç veya kayıp), kâr veya
      zarar olarak finansal tablolara alınması gereken korunma işlemindeki etkin olmayan kısımdır.
