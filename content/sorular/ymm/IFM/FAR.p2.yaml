- id: YMM-IFM-FAR-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: TFRS 9 sınıflandırma ve ölçüm
  tip: bilgi
  zorluk: 1
  kok: Deniz AŞ, ticari amaçla elde tutmadığı Kaya AŞ hisselerini 2025'te 500.000 TL'ye almış ve ilk muhasebeleştirmede gerçeğe
    uygun değer değişimlerini diğer kapsamlı gelirde sunmayı geri dönülemez biçimde seçmiştir. Hisseler 2026'da 650.000 TL'ye
    satılmış; diğer kapsamlı gelirde birikmiş 150.000 TL kazanç bulunmaktadır. Bu birikmiş kazancın satıştaki muhasebeleştirilmesi
    aşağıdakilerden hangisidir?
  secenekler:
    A: Satış döneminde kâr veya zarara aktarılarak satış kazancı olarak raporlanır
    B: Yeniden sınıflandırma düzeltmesi olarak özkaynaktan kâr veya zarara alınır
    C: Satış tarihinde seçim geri alınır, varlık GUD farkı K/Z'a yansıtılan sınıfa aktarılır
    D: Kâr payı geliri gibi kâr veya zararda finansal gelir olarak sunulur
    E: Kâr veya zarara aktarılamaz; özkaynak içinde başka bir kaleme aktarılabilir
  dogru: E
  aciklama:
    dogru_neden: 'TFRS 9 par. 5.7.5 ve B5.7.1: Ticari amaçla elde tutulmayan özkaynak aracı için yapılan bu seçimde diğer
      kapsamlı gelirde sunulan tutarlar sonraki dönemlerde kâr veya zarara aktarılamaz; toplam kazanç veya kayıp özkaynak
      içinde (örneğin geçmiş yıllar kârlarına) aktarılabilir. Bu araçlardan yalnız temettüler kâr veya zarara alınır (5.7.6).'
    celdiriciler:
      A: Borçlanma araçlarına özgü yaklaşımla karıştırılmıştır; özkaynak aracında birikmiş tutar kâr veya zarara geri dönmez.
      B: Yeniden sınıflandırma düzeltmesi, B5.7.1'deki 'kâr veya zarara aktarılamaz' hükmüyle bağdaşmaz.
      C: Seçim geri dönülemezdir (5.7.5); satış nedeniyle geri alınamaz.
      D: Kâr veya zarara yalnız temettüler alınır; satıştan doğan birikmiş değer artışı temettü değildir.
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: Ek B, par. B5.7.1
    alinti: Diğer kapsamlı gelirde sunulan tutarlar, sonraki dönemlerde kâr veya zarara aktarılamaz. Ancak, toplam kazanç
      veya kayıp özkaynağa aktarılabilir.
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 5.7.5
    alinti: İlk defa finansal tablolara almada işletme, ticari amaçla elde tutulmayan veya TFRS 3’ün uygulandığı bir işletme
      birleşmesinde edinen işletmenin finansal tablolarına aldığı bir şarta bağlı bedel niteliğinde olmayan, bu Standart kapsamındaki
      bir özkaynak aracına yapılan yatırımın gerçeğe uygun değerindeki sonraki değişikliklerin diğer kapsamlı gelirde sunulması
      konusunda, geri dönülemeyecek bir tercihte bulunulabilir
  gecerlilik: &id001
    baslangic: '2018-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
