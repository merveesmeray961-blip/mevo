- id: YMM-IFM-FAR-0019
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: TFRS 9 sınıflandırma ve ölçüm
  tip: uygulama
  zorluk: 2
  kok: 'Ova AŞ''nin 2026''da edindiği finansal varlıklar şunlardır (hiçbiri için GUD farkı K/Z''a yansıtılan olarak tanımlama
    seçeneği kullanılmamıştır):

    I. Vadeye kadar elde tutup kupon ve anaparayı tahsil etmeyi amaçladığı portföydeki, sabit faizli devlet tahvilleri

    II. Likidite ihtiyacına göre hem kupon tahsil ettiği hem de düzenli olarak sattığı portföydeki, sabit faizli özel sektör
    tahvilleri

    III. Vadeye kadar elde tutmayı planladığı, hamiline ihraççının paylarına dönüştürme hakkı veren dönüştürülebilir tahvil

    TFRS 9''a göre bu varlıkların ölçüm sınıfları aşağıdakilerin hangisinde doğru verilmiştir? (İEM: itfa edilmiş maliyet;
    GUD-DKG: GUD farkı diğer kapsamlı gelire yansıtılan; GUD-K/Z: GUD farkı kâr veya zarara yansıtılan)'
  secenekler:
    A: 'I: İEM – II: GUD-DKG – III: GUD-K/Z'
    B: 'I: İEM – II: GUD-K/Z – III: İEM'
    C: 'I: GUD-DKG – II: GUD-DKG – III: GUD-K/Z'
    D: 'I: İEM – II: İEM – III: GUD-DKG'
    E: 'I: İEM – II: GUD-DKG – III: İEM'
  dogru: A
  aciklama:
    dogru_neden: 'I: Tahsil amaçlı iş modeli + yalnız anapara ve faiz ödemeleri → İEM (4.1.2). II: Hem tahsil hem satış amaçlı
      iş modeli + yalnız anapara ve faiz → GUD-DKG (4.1.2A). III: Getirisi ihraççının özkaynak değerine bağlı olduğundan nakit
      akışları yalnız anapara ve faiz ödemelerinden oluşmaz (B4.1.7A); iş modeli ne olursa olsun İEM veya GUD-DKG şartı sağlanmaz,
      varlık GUD-K/Z ölçülür (4.1.4).'
    celdiriciler:
      B: Satış da amaçlanan iş modeli tek başına GUD-K/Z sonucu doğurmaz; ayrıca dönüştürülebilir tahvil nakit akışı koşulunu
        sağlamaz.
      C: Yalnız tahsil amaçlı portföyde ve anapara-faiz koşulu sağlandığında ölçüm İEM'dir, GUD-DKG değildir.
      D: II'de satış da iş modelinin parçası olduğundan İEM şartı sağlanmaz; III ise GUD-DKG'ye uygun değildir.
      E: III'te vadeye kadar elde tutma niyeti yetmez; nakit akışı koşulu sağlanmadığından İEM mümkün değildir.
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 4.1.2A
    alinti: Finansal varlığın, sözleşmeye bağlı nakit akışlarının tahsil edilmesini ve finansal varlığın satılmasını amaçlayan
      bir iş modeli kapsamında elde tutulması
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 4.1.4
    alinti: Bir finansal varlık, 4.1.2 paragrafı uyarınca itfa edilmiş maliyeti üzerinden ya da 4.1.2A paragrafı uyarınca
      gerçeğe uygun değer değişimi diğer kapsamlı gelire yansıtılarak ölçülmüyorsa, gerçeğe uygun değer değişimi kâr veya
      zarara yansıtılarak ölçülür.
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: Ek B, par. B4.1.7A
    alinti: Ancak olağan bir borç verme anlaşmasıyla ilişkili olmayan şekilde sözleşmeye bağlı nakit akışlarındaki risklere
      veya değişkenliğe maruz kalınmasına (özkaynak fiyatlarındaki veya emtia fiyatlarındaki değişikliklere maruz kalınması
      gibi) neden olan sözleşme şartları, sadece anapara ve anapara bakiyesine ilişkin faiz ödemelerini içeren nakit akışları
      ortaya çıkarmaz.
  gecerlilik: *id001
