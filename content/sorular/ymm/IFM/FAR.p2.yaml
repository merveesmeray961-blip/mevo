- id: YMM-IFM-FAR-0020
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: etkin faiz yöntemi
  tip: hesaplama
  zorluk: 2
  kok: Pınar AŞ, 1.1.2026'da 3 yıl vadeli, nominal değeri 1.000.000 TL, yıllık %8 kupon faizli (her yıl 31 Aralık'ta ödenir)
    tahvilleri 940.000 TL'ye satın almış; ayrıca 10.000 TL aracılık komisyonu ödemiştir. Tahviller itfa edilmiş maliyetle
    ölçülecektir; işlem maliyeti dahil ilk tutar üzerinden etkin faiz oranı %10 olarak hesaplanmıştır. Beklenen kredi zararları
    dikkate alınmayacaktır. Tahvillerin 31.12.2026 tarihindeki itfa edilmiş maliyeti kaç TL'dir?
  secenekler:
    A: '950.000'
    B: '954.000'
    C: '965.000'
    D: '966.667'
    E: 1.045.000
  dogru: C
  aciklama:
    dogru_neden: 'GUD-K/Z dışındaki varlıklarda işlem maliyeti ilk ölçüme eklenir (5.1.1): 940.000 + 10.000 = 950.000 TL.
      Faiz geliri brüt defter değerine etkin faiz oranı uygulanarak bulunur (5.4.1): 950.000 × %10 = 95.000 TL. Tahsil edilen
      kupon 80.000 TL olduğundan itfa edilmiş maliyet 950.000 + 95.000 − 80.000 = 965.000 TL''dir.'
    celdiriciler:
      A: İskontonun etkin faiz yöntemiyle itfasını yapmamak; ilk tutarda bırakmak.
      B: 'Komisyonu ilk ölçüme eklememek: 940.000 × 1,10 − 80.000.'
      D: 'İskontoyu doğrusal itfa etmek: 950.000 + 50.000 / 3; TFRS 9 etkin faiz yöntemini ister.'
      E: 'Tahsil edilen kuponu itfa edilmiş maliyetten düşmemek: 950.000 + 95.000.'
    hesap_adimlari:
    - 'İlk ölçüm: 940.000 + 10.000 = 950.000'
    - 'Faiz geliri: 950.000 × 0,10 = 95.000'
    - 'Kupon: 1.000.000 × 0,08 = 80.000'
    - 'İtfa edilmiş maliyet: 950.000 + 95.000 − 80.000 = 965.000'
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 5.1.1
    alinti: Gerçeğe uygun değer değişimleri kâr veya zarara yansıtılanlar dışındaki finansal varlık ve yükümlülüklerin ilk
      ölçümünde, bunların edinimiyle veya ihracıyla doğrudan ilişkilendirilebilen işlem maliyetleri de gerçeğe uygun değere
      ilave edilir veya gerçeğe uygun değerden düşülür.
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 5.4.1
    alinti: Faiz geliri etkin faiz yöntemi kullanılarak hesaplanır
  gecerlilik: *id001
  dogrulama:
    python: 'ilk = 940000 + 10000

      sonuc = round(ilk + ilk * 0.10 - 1000000 * 0.08)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
