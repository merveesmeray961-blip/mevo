  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: beklenen kredi zararı
  tip: uygulama
  zorluk: 3
  kok: Tuna AŞ, 1.1.2026'da nominal değeri 1.000.000 TL olan, yıllık %10 kupon faizli (31 Aralık'ta ödenir) tahvilleri nominal
    değerinden satın almıştır (etkin faiz oranı %10). Tahviller, tahsil ve satış amaçlı iş modeli kapsamında GUD-DKG olarak
    sınıflandırılmıştır. 31.12.2026'da kupon tahsil edilmiş; tahvillerin gerçeğe uygun değeri 960.000 TL'ye düşmüştür. Kredi
    riskinde önemli artış olmamış, 12 aylık beklenen kredi zararı 15.000 TL hesaplanmıştır. Tahvillerin 31.12.2026 finansal
    durum tablosundaki tutarı, 2026 diğer kapsamlı geliri ve (faiz geliri hariç) kâr veya zarar etkisi aşağıdakilerin hangisinde
    doğru verilmiştir?
  secenekler:
    A: 945.000 TL; DKG 40.000 TL azalış; K/Z 15.000 TL zarar
    B: 960.000 TL; DKG 40.000 TL azalış; K/Z etkisi yok
    C: 960.000 TL; DKG 40.000 TL azalış; K/Z 15.000 TL zarar
    D: 960.000 TL; DKG etkisi yok; K/Z 40.000 TL zarar
    E: 960.000 TL; DKG 25.000 TL azalış; K/Z 15.000 TL zarar
  dogru: E
  aciklama:
    dogru_neden: 'Par. 5.5.2''ye göre GUD-DKG varlıklarda değer düşüklüğü hükümleri uygulanır; ancak zarar karşılığı diğer
      kapsamlı gelire yansıtılır ve varlığın defter değerini azaltmaz. Varlık 960.000 TL gerçeğe uygun değeriyle gösterilir.
      15.000 TL beklenen kredi zararı kâr veya zarara (değer düşüklüğü zararı) yazılır, karşılığı DKG''dir. Toplam değer kaybı
      40.000 TL olduğundan DKG''deki net azalış 40.000 − 15.000 = 25.000 TL''dir (5.7.10: değer düşüklüğü kazanç/kayıpları
      dışındaki kazanç ve kayıplar DKG''ye). Püf noktaları: Karşılık defter değerini azaltmaz; aynı 15.000 TL''yi hem K/Z''da
      hem de DKG azalışında göstermek çift sayımdır.'
    celdiriciler:
      A: Zarar karşılığını varlığın defter değerinden düşmek (itfa edilmiş maliyet mantığı); GUD-DKG varlıkta karşılık defter
        değerini azaltmaz.
      B: Beklenen kredi zararını hiç kâr veya zarara yansıtmamak; GUD-DKG varlıklarda da değer düşüklüğü hükümleri uygulanır.
      C: 15.000 TL'yi hem kâr veya zararda hem de DKG azalışının içinde göstermek; toplam etki 55.000 TL olur, gerçek kayıp
        40.000 TL'dir.
      D: Değer kaybının tamamını kâr veya zarara almak; kredi zararı dışındaki gerçeğe uygun değer değişimi DKG'ye yansıtılır.
    hesap_adimlari:
    - 'İtfa edilmiş maliyet: 1.000.000 (kupon = etkin faiz)'
    - 'GUD değişimi: 960.000 − 1.000.000 = −40.000'
    - 'K/Z: −15.000 (BKZ)'
    - 'DKG: −40.000 + 15.000 = −25.000'
    - 'Defter değeri: 960.000'
