    kim: uretici
    ne: harici teslim t_IFM-1.yaml, satır 17
- id: YMM-IFM-FAR-0018
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: beklenen kredi zararı
  tip: bilgi
  zorluk: 1
  kok: Sahil AŞ'nin TFRS 15 kapsamındaki satışlarından doğan ve önemli bir finansman bileşeni içermeyen 60 gün vadeli ticari
    alacakları bulunmaktadır. Alacakların kredi riskinde ilk muhasebeleştirmeden bu yana önemli bir artış olmamıştır. TFRS
    9'a göre bu alacaklar için zarar karşılığı nasıl ölçülür?
  secenekler:
    A: 12 aylık beklenen kredi zararlarına eşit tutarda
    B: Kredi riski önemli ölçüde artana kadar 12 aylık, sonra ömür boyu tutarda
    C: Yalnızca tarafsız bir değer düşüklüğü kanıtı oluştuğunda gerçekleşen zarar kadar
    D: Her zaman ömür boyu beklenen kredi zararlarına eşit tutarda
    E: Muhasebe politikası seçimine göre 12 aylık ya da ömür boyu tutarda
  dogru: D
  aciklama:
    dogru_neden: 'TFRS 9 par. 5.5.15(a)(i): Önemli bir finansman bileşeni içermeyen ticari alacaklarda, 5.5.3 ve 5.5.5''e
      bağlı kalınmaksızın zarar karşılığı her zaman ömür boyu beklenen kredi zararlarına eşit tutarda ölçülür (basitleştirilmiş
      yaklaşım). Kredi riskinde önemli artış olup olmaması sonucu değiştirmez.'
    celdiriciler:
      A: 12 aylık ölçüm genel yaklaşımda kredi riski önemli artmamış araçlar içindir (5.5.5); bu alacaklar basitleştirilmiş
        yaklaşıma tabidir.
      B: Genel yaklaşımın aşamalı işleyişidir; 5.5.15 bu alacakları genel yaklaşımın dışında tutar.
      C: Gerçekleşen zarar modeli TFRS 9'da yoktur; karşılık beklenen zararlara göre ayrılır.
      E: Politika seçimi yalnız önemli bir finansman bileşeni içeren ticari alacaklar için (5.5.15(a)(ii)) söz konusudur.
  kaynaklar:
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 5.5.15(a)(i)
    alinti: '5.5.3 ve 5.5.5 paragraflarına bağlı kalınmaksızın, işletme aşağıdakilere ilişkin zarar karşılıklarını, her zaman
      ömür boyu beklenen kredi zararlarına eşit tutarda ölçer: (a) TFRS 15 kapsamındaki işlemlerden kaynaklanan ticari alacaklardan
      veya sözleşme varlıklarından: (i) TFRS 15’e göre önemli bir finansman bileşeni içermeyenler'
  gecerlilik: *id001
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi IFM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
