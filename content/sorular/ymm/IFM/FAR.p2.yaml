      sınıflandırma düzeltmesi olarak (bakınız: TMS 1) özkaynaktan çıkarılarak kâr veya zarara yansıtılır.'
  - mevzuat: TFRS 9 Finansal Araçlar
    madde: par. 4.4.2
    alinti: İşletme, herhangi bir finansal yükümlülüğü yeniden sınıflandırmaz.
  - mevzuat: TFRS 9 Finansal Araçlar
