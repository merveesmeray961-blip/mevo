        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_IFM-1.yaml, satır 20
