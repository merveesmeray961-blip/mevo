  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: beklenen kredi zararı
  tip: hesaplama
  zorluk: 3
  kok: 'Akdeniz Finansman AŞ''nin itfa edilmiş maliyetle ölçülen ve etkin faiz oranı %10 olan üç kredisinin 1.1.2026 bakiyeleri
    aşağıdadır. Hiçbiri satın alındığında veya oluşturulduğunda kredi-değer düşüklüğüne sahip değildir; kredilerin durumu
    ve bakiyeleri 2026 boyunca değişmemiştir.

    - K1: Brüt defter değeri 1.000.000 TL, zarar karşılığı 10.000 TL; kredi riskinde önemli artış yok.

    - K2: Brüt defter değeri 800.000 TL, zarar karşılığı 60.000 TL; kredi riski önemli ölçüde artmış, kredi-değer düşüklüğü
