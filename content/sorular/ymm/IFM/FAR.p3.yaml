  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Finansal araçlar
  konu: FAR
  kazanim: TFRS 9 sınıflandırma ve ölçüm
  tip: bilgi
  zorluk: 3
  kok: 'TFRS 9 Finansal Araçlar standardına göre aşağıdaki finansal varlıklardan hangisi **itfa edilmiş maliyetle** ölçülür?

    '
  secenekler:
    A: Alım-satım amacıyla elde tutulan hisse senetleri
    B: Gerçeğe uygun değer farkı kâr veya zarara yansıtılan borçlanma araçları
    C: Sözleşme koşulları yalnızca anapara ve faiz ödemelerini içeren ve işletmenin tahsil amacıyla elde tuttuğu borçlanma
      araçları
    D: İşletmenin gerçeğe uygun değer farkını diğer kapsamlı gelire yansıtma seçeneğini kullandığı öz kaynak araçları
    E: Türev finansal araçlar
  dogru: C
  aciklama:
    dogru_neden: 'İtfa edilmiş maliyet ölçümü için iki koşul gereklidir: (1) iş modeli tahsilat amacıyla elde tutma, (2) SPPI
      testi: sözleşme nakit akışları yalnızca anapara ve faiz ödemelerinden oluşmalı.'
    celdiriciler:
      A: Alım-satım amacıyla tutulan araçlar GUFKZ grubundadır.
      B: GUFKZ seçeneği kullanılmış araçlar GUD ile ölçülür.
      D: GUFDOG seçeneğindeki öz kaynak araçları GUD ile ölçülür.
      E: Türevler GUFKZ olarak sınıflandırılır.
