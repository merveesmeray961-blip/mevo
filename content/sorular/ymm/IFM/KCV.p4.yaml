- id: YMM-IFM-KCV-0003
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kavramsal Çerçeve ve finansal tabloların sunuluşu
  konu: KCV
  kazanim: ölçüm esasları
  tip: hesaplama
  zorluk: 2
  kok: (B) AŞ'nin 2023'te 1.200.000 TL'ye aldığı makinenin 31.12.2026 itibarıyla birikmiş amortismanı 480.000 TL'dir. Aynı
    tarihte; aynı yaş ve durumdaki eşdeğer bir makinenin edinim fiyatı 760.000 TL, bu edinimde katlanılacak nakliye ve kurulum
    gibi işlem maliyetleri 40.000 TL'dir. Hiç kullanılmamış yeni bir makinenin fiyatı 1.300.000 TL'dir. Makine piyasada 690.000
    TL'ye satılabilmekte (satış işlem maliyeti 20.000 TL), kullanımından beklenen nakit akışlarının bugünkü değeri ise 735.000
    TL'dir. Kavramsal Çerçeve'ye göre makinenin cari maliyet esasına göre ölçüm tutarı kaç TL'dir?
  secenekler:
    A: 690.000 TL
    B: 735.000 TL
    C: 760.000 TL
    D: 800.000 TL
    E: 1.340.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Kavramsal Çerçeve par. 6.21''e göre cari maliyet, ölçüm tarihinde eşdeğer varlık için ödenecek bedel artı
      o tarihte katlanılabilecek işlem maliyetleridir ve bir giriş değeridir: 760.000 + 40.000 = 800.000 TL.'
    celdiriciler:
      A: 690.000 TL gerçeğe uygun değerdir (çıkış değeri); cari maliyet giriş değeridir.
      B: 735.000 TL kullanım değeridir; işletmeye özgü bir çıkış değeri ölçüsüdür.
      C: Edinim fiyatına katlanılacak işlem maliyetleri eklenmemiştir.
      E: Cari maliyet aynı yaş ve durumdaki eşdeğer varlığa göre belirlenir; yeni makinenin fiyatı esas alınmaz.
    hesap_adimlari:
    - 'Eşdeğer varlığın edinim fiyatı: 760.000 TL'
    - 'İşlem maliyetleri: 40.000 TL'
    - Cari maliyet = 760.000 + 40.000 = 800.000 TL
  kaynaklar:
  - mevzuat: Finansal Raporlamaya İlişkin Kavramsal Çerçeve
    madde: par. 6.21
    alinti: Cari maliyet, ölçüm tarihinde söz konusu varlık için ödenecek bedel artı o tarihte katlanılabilecek işlem maliyetlerinden
      oluşur.
