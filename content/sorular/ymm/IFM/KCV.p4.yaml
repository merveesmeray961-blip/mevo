  kok: (G) AŞ, 2026 yılı finansal tablolarını (2025 karşılaştırmalı) hazırlarken 31.12.2025 stok sayımında bir mal grubunun
    iki kez sayıldığını ve 2025 dönem sonu stokunun 400.000 TL fazla gösterildiğini tespit etmiştir; hata önemlidir. 2025
    için raporlanan dönem kârı 2.000.000 TL'dir. Hata düzeltilmeden hazırlanan 2026 taslak kârı 1.100.000 TL'dir; bu taslakta
    2026 açılış stoku hatalı tutarla alınmış, 31.12.2026 stoku ise doğru sayılmıştır. Vergi etkisi dikkate alınmayacaktır.
    TMS 8'e göre 2026 finansal tablolarında yer alacak 2026 dönem kârı ve karşılaştırmalı 2025 dönem kârı hangisidir?
  secenekler:
    A: '2026: 700.000 TL; 2025: 2.000.000 TL'
    B: '2026: 1.100.000 TL; 2025: 1.600.000 TL'
    C: '2026: 1.500.000 TL; 2025: 1.600.000 TL'
    D: '2026: 1.500.000 TL; 2025: 2.000.000 TL'
    E: '2026: 1.100.000 TL; 2025: 2.000.000 TL'
  dogru: C
  aciklama:
    dogru_neden: 'Önemli geçmiş dönem hatası geriye dönük düzeltilir; karşılaştırmalı 2025 tutarları yeniden düzenlenir (TMS
      8 par. 42). 2025 sonu stokunun 400.000 TL fazla olması 2025 satışların maliyetini 400.000 TL eksik, kârı fazla göstermiştir:
      düzeltilmiş 2025 kârı 1.600.000 TL. Aynı fazla tutar 2026 açılış stokuna geçtiğinden 2026 satışların maliyeti 400.000
      TL fazla, taslak kâr eksik hesaplanmıştır: düzeltilmiş 2026 kârı 1.100.000 + 400.000 = 1.500.000 TL. Püf noktaları:
      Stok hatası iki dönemi ters yönde etkiler (kendiliğinden dengelenen hata); hatayı cari dönem kârına gider yazmak ya
      da karşılaştırmalı dönemi düzeltmemek TMS 8''e aykırıdır.'
    celdiriciler:
      A: Hatanın etkisi cari dönem kâr veya zararına gider olarak alınmış ve karşılaştırmalı dönem düzeltilmemiştir.
      B: 2025 düzeltilmiş, ancak açılış stokunun 2026 satışların maliyetine etkisi giderilmemiştir.
      D: 2026 doğru hesaplanmış, ancak karşılaştırmalı 2025 tutarı yeniden düzenlenmemiştir.
      E: Hiçbir düzeltme yapılmamış hâli; TMS 8 par. 42'ye aykırıdır.
    hesap_adimlari:
    - 2025 düzeltilmiş kâr = 2.000.000 − 400.000 = 1.600.000
    - 2026 açılış stoku 400.000 fazla → 2026 SMM 400.000 fazla
    - 2026 düzeltilmiş kâr = 1.100.000 + 400.000 = 1.500.000
  kaynaklar:
