    B: 920.000 TL
    C: 980.000 TL
    D: 1.220.000 TL
    E: 1.280.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'X davası onay tarihinden önce sonuçlanmış ve dönem sonundaki mükellefiyeti teyit etmiştir; karşılık 720.000
      TL''ye düzeltilir (TMS 10 par. 9(a)). Y davasına konu olay dönem sonrasında meydana gelmiştir; düzeltme gerektirmez,
      önemliyse açıklanır. Z davası onay tarihinden (15 Mart) sonra sonuçlandığından raporlama döneminden sonraki olay tanımına
      girmez (par. 3); karşılık 200.000 TL kalır. Toplam 720.000 + 200.000 = 920.000 TL. Püf noktaları: Önce olayın onay tarihinden
      önce olup olmadığına, sonra dönem sonunda var olan bir durumu teyit edip etmediğine bak. Z davasının sonucu onaydan
      sonra geldiği için 2026 tablolarını etkilemez.'
    celdiriciler:
      A: X davası onay tarihinden önce kesinleştiğinden karşılık 720.000 TL'ye düzeltilmelidir.
      C: Z davası onay tarihinden sonra sonuçlanmıştır; 260.000 TL dikkate alınamaz.
      D: Y davasına konu olay dönem sonrasında doğmuştur; 31.12.2026'da karşılık ayrılmaz.
      E: Y davası karşılığa alınamaz, Z davasının onay sonrası sonucu da kullanılamaz.
    hesap_adimlari:
    - 'X: 720.000 (düzeltme gerektiren olay)'
    - 'Y: 0 (dönem sonrası doğan durum)'
    - 'Z: 200.000 (sonuç onay tarihinden sonra)'
