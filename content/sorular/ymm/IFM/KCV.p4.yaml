    şöyledir: X davası Mayıs 2026''da açılmış, dönem sonu itibarıyla mevcut mükellefiyete dayanmaktadır; 31.12.2026''da 500.000
    TL karşılık ayrılmış ve dava 10 Şubat 2027''de 720.000 TL ödeme yükümlülüğüyle kesinleşmiştir. Y davası, Ocak 2027''de
    meydana gelen bir kaza nedeniyle Şubat 2027''de açılmıştır; avukat 300.000 TL ödeme yapılmasını muhtemel görmektedir.
    Z davası 2025''te açılmış, dönem sonu itibarıyla mevcut mükellefiyete dayanmaktadır; 31.12.2026''da 200.000 TL karşılık
    ayrılmış ve dava 25 Mart 2027''de 260.000 TL ile sonuçlanmıştır. TMS 10''a göre 31.12.2026 tarihli finansal durum tablosunda
    yer alacak dava karşılıklarının toplamı kaç TL''dir?'
  secenekler:
