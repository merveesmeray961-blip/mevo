  kok: (A) AŞ'nin finans müdürü, gelecek yıllarda doğabilecek zararlara karşı tampon oluşturmak amacıyla, hakkında dava veya
    başka bir mükellefiyet bulunmayan bir konu için karşılık ayrılmasını ve stokların net gerçekleşebilir değerlerinin de
    altındaki bir tutarla gösterilmesini "ihtiyatlılık" gerekçesiyle önermektedir. Kavramsal Çerçeve'ye göre bu öneri hakkında
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Öneri uygundur; ihtiyatlılık temel niteliksel özellik olduğundan tarafsızlığa göre öncelikli uygulanır.
    B: Öneri stoklar bakımından uygundur; karşılık bakımından ise yükümlülük tanımı karşılanmadığından uygun değildir.
    C: Öneri karşılık bakımından uygundur; yükümlülüklerin yüksek gösterilmesi tarafsızlığı bozmaz.
    D: Öneri, tutarların önemli olmaması koşuluyla maliyet kısıtı gereği uygulanabilir.
    E: Öneri uygun değildir; ihtiyatlılık varlıkların düşük, yükümlülüklerin yüksek gösterilmesine izin vermez.
  dogru: E
  aciklama:
    dogru_neden: Kavramsal Çerçeve par. 2.16'ya göre ihtiyatlılık belirsizlik altında temkinli yargıdır ve tarafsızlığı destekler;
      varlıkların ve gelirlerin olduğundan düşük, yükümlülüklerin ve giderlerin olduğundan yüksek gösterilmesine izin vermez.
      Gizli yedek oluşturmaya yönelik iki uygulama da tarafsızlığı bozar.
    celdiriciler:
      A: İhtiyatlılık temel niteliksel özellik değildir; tarafsızlığı destekleyen bir davranıştır.
      B: Stokların NGD'nin de altında gösterilmesi varlığı olduğundan düşük gösterir; bu da ihtiyatlılıkla bağdaşmaz.
      C: Yükümlülüğün olduğundan yüksek gösterilmesi tarafsızlığı bozar ve ihtiyatlılıkla da bağdaşmaz.
      D: Maliyet kısıtı bilgi üretme maliyetiyle ilgilidir; bilinçli olarak yanlış sunuma gerekçe olamaz.
  kaynaklar:
