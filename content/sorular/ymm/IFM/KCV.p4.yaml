      D: Yönetim kararı tek başına mevcut mükellefiyet doğurmaz; diğer iki kalem ise yükümlülüktür.
      E: II numaralı kalemde geçmiş olaydan doğan mevcut mükellefiyet şartı karşılanmamaktadır.
