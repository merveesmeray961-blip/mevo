- id: YMM-IFM-KCV-0007
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kavramsal Çerçeve ve finansal tabloların sunuluşu
  konu: KCV
  kazanim: TMS 1 ve TFRS 18 finansal tabloların sunuluşu
  tip: hesaplama
  zorluk: 3
  kok: '(E) AŞ, 2027 yılı kâr veya zarar tablosunu TFRS 18''e göre hazırlamaktadır; belirlenmiş ana faaliyeti yatırım yapmak
    veya müşterilere finansman sağlamak değildir. 2027 verileri (TL): hasılat 8.000.000; satışların maliyeti 5.000.000; pazarlama
    ve genel yönetim giderleri 1.100.000; özkaynak yöntemiyle değerlenen iştirakten kâr payı 300.000; üç ay vadeli (nakit
    benzeri) mevduattan faiz geliri 150.000; yalnız finansman sağlamak amacıyla kullanılan banka kredisinin faiz gideri 600.000;
    vergi gideri 400.000. TFRS 18''e göre "finansman ve vergi öncesi kâr veya zarar" ara toplamı kaç TL''dir?'
  secenekler:
    A: 1.750.000 TL
    B: 1.900.000 TL
    C: 2.050.000 TL
    D: 2.200.000 TL
    E: 2.350.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'Esas faaliyet kârı = 8.000.000 − 5.000.000 − 1.100.000 = 1.900.000 TL. İştirakten kâr payı (par. 53(a))
      ve nakit benzerlerinden faiz geliri (par. 53(b)) yatırım faaliyetleri bölümündedir. Finansman ve vergi öncesi kâr =
      esas faaliyet kârı + yatırım bölümü = 1.900.000 + 300.000 + 150.000 = 2.350.000 TL (par. 71). Kredi faizi finansman
      bölümünde (par. 59-60), vergi vergi bölümünde yer aldığından bu ara toplama girmez. Püf noktaları: Mevduat faizini "finansman
      geliri" sanıp dışarıda bırakmak ya da iştirak payını esas faaliyetlere koymak tipik hatadır; TFRS 18''de nakit ve nakit
      benzerlerinden elde edilen gelir yatırım bölümündedir. Kredi faizi bu ara toplamın altında yer alır.'
    celdiriciler:
      A: Yalnız finansman amaçlı kredinin faiz gideri finansman bölümündedir; finansman ve vergi öncesi kârdan düşülmez.
      B: 1.900.000 TL esas faaliyet kârıdır; yatırım bölümündeki gelirler eklenmemiştir.
      C: İştirakten kâr payı da yatırım faaliyetleri bölümündedir ve bu ara toplama dahildir.
      D: Nakit benzerlerinden elde edilen faiz geliri de yatırım bölümündedir ve ara toplama eklenir.
    hesap_adimlari:
    - Esas faaliyet kârı = 8.000.000 − 5.000.000 − 1.100.000 = 1.900.000
    - Yatırım bölümü = 300.000 + 150.000 = 450.000
    - Finansman ve vergi öncesi kâr = 1.900.000 + 450.000 = 2.350.000
  kaynaklar:
  - mevzuat: TFRS 18 Finansal Tablolarda Sunum ve Açıklama
    madde: par. 71
    alinti: 'Finansman ve vergi öncesi kâr veya zarar aşağıdakilerden oluşur:'
