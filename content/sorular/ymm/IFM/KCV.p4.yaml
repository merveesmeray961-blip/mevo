    Çerçeve''deki yükümlülük tanımına göre hangileri raporlama dönemi sonunda mevcut bir yükümlülük niteliğindedir?

    I. Çalışanların Aralık 2026''da yaptığı ve Ocak 2027''de ödenecek fazla mesai ücretleri

    II. Yönetim kurulunun Kasım 2026''da aldığı, 2027''de yeni bir makine satın alma kararı (henüz sipariş verilmemiş, sözleşme
    yapılmamıştır)

    III. 2026''da satılan ürünler için satış sözleşmeleri gereğince verilen iki yıllık ücretsiz onarım garantisi

