  zorluk: 2
  kok: Bir işlem veya olaya özel olarak uygulanan bir TFRS bulunmadığında işletme yönetiminin muhasebe politikası geliştirirken
    izleyeceği yola ilişkin TMS 8'e göre aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Yönetim önce kabul görmüş sektör uygulamalarına başvurur; bunlar yetersiz kalırsa benzer konuları ele alan TFRS'lere
      geçer
    B: Yönetim sırasıyla benzer ve ilişkili konuları ele alan TFRS'lere ve Kavramsal Çerçeve'deki tanım, kriter ve ölçüm esaslarına
      başvurur
    C: Yönetim yalnızca Kavramsal Çerçeve'ye başvurur; benzer konuları ele alan TFRS'lerin hükümleri bu durumda dikkate alınmaz
    D: Yönetim, diğer standart belirleyici organların en son düzenlemelerini, TFRS kaynaklarıyla çelişse bile, öncelikli olarak
      uygulayabilir
    E: Yönetim vergi mevzuatındaki düzenlemeyi esas alır; vergi mevzuatında hüküm yoksa muhasebe politikası belirlemekten
      kaçınır
  dogru: B
  aciklama:
    dogru_neden: TMS 8 par. 10-11'e göre yönetim, ihtiyaca uygun ve güvenilir bilgi sağlayan bir politika geliştirirken sırasıyla
      (a) benzer ve ilişkili konuları ele alan TFRS'lerdeki hükümlere, (b) Kavramsal Çerçeve'deki varlık, yükümlülük, gelir
      ve gider tanımlarına, finansal tablolara alma kıstaslarına ve ölçüm esaslarına başvurur. Par. 12'ye göre diğer standart
      belirleyici organların düzenlemeleri, diğer muhasebe literatürü ve sektör uygulamaları ancak bu kaynaklarla çelişmediği
      sürece göz önünde bulundurulabilir.
    celdiriciler:
      A: Sektör uygulamaları 11. paragraftaki kaynaklarla çelişmediği sürece yalnızca göz önünde bulundurulabilir; öncelik
        sırası tersine çevrilemez (par. 11-12).
      C: Kavramsal Çerçeve'den önce benzer ve ilişkili konuları ele alan TFRS'lere başvurulur; ikisi birlikte ve sırayla kullanılır
        (par. 11).
      D: Diğer organların düzenlemeleri yalnızca 11. paragraftaki kaynaklarla çelişmediği sürece göz önünde bulundurulabilir
        (par. 12).
      E: TMS 8 hiyerarşisinde vergi mevzuatı yer almaz; yönetim 10. paragraftaki nitelikleri taşıyan bir politika geliştirmek
        zorundadır (par. 10).
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 11
    alinti: 'İşletme yönetimi, 10''uncu paragraf çerçevesinde kendi takdirini kullanırken, uygulanabilirliklerini göz önünde
      bulundurarak, sırasıyla aşağıdaki kaynaklara başvurur: (a) Benzer ve ilişkili konuları ele alan TFRS''lerde yer alan
      hükümler ve (b) Varlık, yükümlülük, gelir ve giderlerle ilgili olarak Finansal Raporlamaya İlişkin Kavramsal Çerçeve''de
      (Kavramsal Çerçeve) yer alan tanımlar, finansal tablolara alma kıstasları ve ölçüm esasları2.'
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: par. 12
    alinti: 11'inci paragrafta belirtilen kaynaklarla çelişmediği sürece; muhasebe standartlarını geliştirmek için benzer
      bir kavramsal çerçeve kullanan diğer standart belirleyici organların en son düzenlemelerini, diğer muhasebe literatürünü
      ve kabul görmüş sektör uygulamalarını da göz önünde bulundurabilir.
