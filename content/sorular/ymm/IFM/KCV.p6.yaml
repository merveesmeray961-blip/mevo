- id: YMM-IFM-KCV-0021
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kavramsal Çerçeve ve finansal tabloların sunuluşu
  konu: KCV
  kazanim: işletmenin sürekliliği ve raporlama sonrası olaylar (TMS 10 par. 14-16)
  tip: uygulama
  zorluk: 2
  kok: Takvim yılı hesap dönemli (Y) AŞ'nin 31.12.2026 tarihli finansal tabloları 10.3.2027'de yayımlanmak üzere onaylanacaktır.
    Yönetim kurulu 18.2.2027'de ticari faaliyetlere son vermeye ve şirketi tasfiye etmeye karar vermiş, bunun dışında gerçekçi
    bir alternatif bulunmadığı sonucuna varmıştır. TMS 10'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Karar raporlama döneminden sonra alındığından finansal tablolar işletmenin sürekliliği esasına göre hazırlanır; olay
      düzeltme gerektirmeyen olay olarak açıklanır
    B: Finansal tablolar sürekliliğe göre hazırlanır; yalnızca ilgili varlık ve yükümlülüklerin tutarlarında düzeltme yapılarak
      tasfiye etkileri yansıtılır
    C: Finansal tablolar işletmenin sürekliliği esasına göre hazırlanmaz; muhasebe esasında temel bir değişiklik gerekir ve
      TMS 1'deki açıklamalar yapılır
    D: Tasfiye kararı düzeltme gerektiren olaydır; yalnızca stok ve alacaklarda değer düşüklüğü karşılığı ayrılarak 31.12.2026
      tutarları düzeltilir
    E: Finansal tablolar sürekliliğe göre hazırlanır; yalnızca sürekliliği şüpheli hale getiren önemli belirsizlik varlığı
      dipnotta açıklanır
  dogru: C
  aciklama:
    dogru_neden: TMS 10 par. 14'e göre yönetim raporlama döneminden sonra işletmeyi tasfiye etmeye veya ticari faaliyetine
      son vermeye karar verirse ya da bunun dışında gerçekçi alternatifi yoksa işletme finansal tablolarını sürekliliği esasına
      göre hazırlamaz. Par. 15 uyarınca etki yaygın olduğundan tutarlarda düzeltme yapmak yerine muhasebe esasında temel bir
      değişiklik gerekir; par. 16 ve TMS 1 par. 25 uyarınca sürekliliğe göre hazırlanmama durumu, hangi esasa göre hazırlandığı
      ve nedeni açıklanır.
    celdiriciler:
      A: Raporlama sonrası tasfiye kararı, sürekliliğe göre hazırlamayı engelleyen bir karardır; düzeltme gerektirmeyen olay
        olarak açıklama yeterli değildir (par. 14).
      B: Etki yaygın olduğundan tek tek tutar düzeltmesi yerine muhasebe esasında temel değişiklik gerekir (par. 15).
      D: Standart, tutar düzeltmesi yerine muhasebe esasında temel değişikliği zorunlu kılar; yalnızca stok ve alacaklarda
        karşılık ayırmak yeterli değildir (par. 15).
      E: Önemli belirsizlik dipnotu, sürekliliğin şüpheli olduğu ancak tasfiye kararı verilmediği durum içindir; tasfiye kararında
        esas değişir (par. 14, 16).
  kaynaklar:
  - mevzuat: TMS 10 Raporlama Döneminden Sonraki Olaylar
    madde: par. 14
    alinti: Yönetimin, raporlama döneminden sonra, işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyetinin
      olduğuna ya da bunları yapmak dışında gerçekçi bir alternatifinin bulunmadığına karar vermesi durumunda işletme, finansal
      tablolarını işletmenin sürekliliği esasına göre hazırlamaz.
  - mevzuat: TMS 10 Raporlama Döneminden Sonraki Olaylar
    madde: par. 15
    alinti: Faaliyet sonuçlarında ve finansal durumda raporlama döneminden sonra meydana gelen bozulmalar, işletmenin sürekliliği
      varsayımının geçerliliğini koruyup korumadığının gözden geçirilmesine ihtiyaç olduğunu gösterebilir. İşletmenin sürekliliği
      varsayımının geçerliliğini yitirmesi durumunda, ortaya çıkan etki oldukça yaygın olduğundan, bu Standart, muhasebenin
      temel varsayımlarına göre finansal tablolara alınan tutarlarda bir düzeltme yapmak yerine muhasebe esasında temel bir
      değişikliğe gitmeyi zorunlu kılar.
