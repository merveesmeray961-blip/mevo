- id: YMM-IFM-KCV-0016
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kavramsal Çerçeve ve finansal tabloların sunuluşu
  konu: KCV
  kazanim: karşılaştırılabilirlik ve tutarlılık (destekleyici niteliksel özellikler)
  tip: bilgi
  zorluk: 1
  kok: Finansal Raporlamaya İlişkin Kavramsal Çerçeve'ye göre karşılaştırılabilirlik ve tutarlılığa ilişkin aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Karşılaştırılabilirlik tek bir kalemle ilgili bir özelliktir; tek bir kalem için bile ayrıca değerlendirilebilir
    B: Tutarlılık ile karşılaştırılabilirlik aynı anlama gelir; biri sağlanınca diğeri de kendiliğinden ve tam olarak sağlanmış
      olur
    C: Aynı ekonomik olay için alternatif muhasebe yöntemlerine izin verilmesi karşılaştırılabilirliği artırır
    D: Karşılaştırılabilirlik yeknesaklık değildir; farklı şeyler benzer gösterilerek karşılaştırılabilirlik artırılamaz
    E: Karşılaştırılabilirliği artırmak için tüm işlemler, niteliği ne olursa olsun, aynı yöntemle sunulmalıdır
  dogru: D
  aciklama:
    dogru_neden: Kavramsal Çerçeve 2.27'ye göre karşılaştırılabilirlik yeknesaklık değildir; benzer şeylerin benzer, farklı
      şeylerin ise farklı görünmesi gerekir. Bu nedenle benzer şeylerin farklı gösterilmesiyle olduğu gibi farklı şeylerin
      benzer gösterilmesiyle de karşılaştırılabilirlik artırılamaz. Tutarlılık ise aynı kalemler için aynı yöntemlerin kullanılması
      olup karşılaştırılabilirlikle ilişkili olsa da aynı anlama gelmez (2.26).
    celdiriciler:
      A: Karşılaştırılabilirlik tek bir kalemle ilgili değildir; karşılaştırma yapılabilmesi için en az iki kalem gerekir
        (2.25).
      B: Tutarlılık, karşılaştırılabilirlikle ilişkili olsa da aynı anlama gelmez; tutarlılık yalnızca amaca ulaşmaya yardımcı
        olur (2.26).
      C: Aynı ekonomik olay için alternatif muhasebe yöntemlerine izin verilmesi karşılaştırılabilirliği azaltır (2.29).
      E: Farklı şeylerin benzer gösterilmesi karşılaştırılabilirliği artırmaz; yeknesaklık amaç değildir (2.27).
  kaynaklar:
  - mevzuat: Finansal Raporlamaya İlişkin Kavramsal Çerçeve
    madde: '2.26'
    alinti: Tutarlılık, karşılaştırılabilirlikle ilişkili olsa da aynı anlama gelmez.
  - mevzuat: Finansal Raporlamaya İlişkin Kavramsal Çerçeve
    madde: '2.27'
    alinti: Karşılaştırılabilirlik yeknesaklık değildir. Bilginin karşılaştırılabilir olması için benzer şeylerin benzer,
      farklı şeylerin ise farklı görünmesi gerekir. Finansal bilginin karşılaştırılabilirliği benzer şeylerin farklı gösterilmesiyle
      arttırılamayacağı gibi farklı şeylerin benzer gösterilmesiyle de arttırılamaz.
