  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  tip: uygulama
  zorluk: 1
  kok: TFRS 16 uygulayan Ilgaz AŞ'nin kiracı olduğu aşağıdaki sözleşmelerin hiçbirinde dayanak varlık düşük değerli değildir
    ve Ilgaz AŞ, ilgili dayanak varlık sınıfları için kısa vadeli kiralama istisnasını seçmiştir. Süreler, kiralamanın fiilen
    başladığı tarih itibarıyla belirtilmiştir. Buna göre hangi kiralamada kullanım hakkı varlığı ve kira yükümlülüğü finansal
    tablolara alınmadan kira ödemeleri kiralama süresi boyunca gider olarak yansıtılabilir?
  secenekler:
    A: İptal edilemez süresi 10 ay olan ve süre sonunda forklifti sabit bedelle satın alma opsiyonu içeren kiralama
    B: İptal edilemez süresi 13 ay olan ve satın alma ya da uzatma opsiyonu içermeyen paketleme makinesi kiralaması
    C: Süresi 24 ay olan ve ilk 12 aydan sonraki kira bedelleri TÜFE'ye göre güncellenen ofis katı kiralaması
    D: İptal edilemez süresi 9 ay olan ve 12 aylık uzatma opsiyonunu kullanacağından makul ölçüde emin olunan araç kiralaması
    E: İptal edilemez süresi 12 ay olan ve satın alma ya da uzatma opsiyonu içermeyen ek depo kiralaması
  dogru: E
  aciklama:
    dogru_neden: Kısa vadeli kiralama, fiilen başlama tarihi itibarıyla kiralama süresi 12 ay veya daha kısa olan ve satın
      alma opsiyonu içermeyen kiralamadır. 12 aylık, opsiyonsuz depo kiralaması bu tanımı karşılar; istisna seçildiğinden
      kira ödemeleri TFRS 16 par. 6 uyarınca doğrusal olarak gider yazılır.
    celdiriciler:
      A: Süre 12 aydan kısa olsa da satın alma opsiyonu içeren kiralama tanım gereği kısa vadeli değildir.
      B: Kiralama süresi 13 ay olup 12 ay sınırını aşmaktadır.
      C: Kiralama süresi 24 aydır; endekslemenin kısa vadeli kiralama değerlendirmesine etkisi yoktur.
      D: Kiracının kullanacağından makul ölçüde emin olduğu uzatma opsiyonunun süresi kiralama süresine dahildir (par. 18(a));
        süre 21 ay olur.
  kaynaklar:
