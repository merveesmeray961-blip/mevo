- id: YMM-IFM-KIR-0019
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  tip: hesaplama
  zorluk: 3
  kok: 'Kiracı Pınar AŞ, 1.1.2026 tarihinde fiilen başlayan 4 yıllık bir makine kiralaması yapmıştır. Yıllık 400.000 TL kira
    her yıl sonunda ödenecektir. Kiralamadaki zımni faiz oranı kolaylıkla belirlenememekte; Pınar AŞ''nin alternatif borçlanma
    faiz oranı %10''dur (4 yıllık %10 anüite bugünkü değer faktörü: 3,1699). Pınar AŞ sözleşme için 32.040 TL başlangıçtaki
    doğrudan maliyete katlanmıştır. Makinenin yararlı ömrü 8 yıldır; sözleşmede mülkiyet devri ya da satın alma opsiyonu yoktur.
    Kullanım hakkı varlığı doğrusal yöntemle amortismana tabi tutulmaktadır.


    Buna göre bu kiralamanın Pınar AŞ''nin 2026 yılı kâr veya zararına toplam gider etkisi kaç TL''dir? (Tam TL''ye yuvarlayınız.)'
  secenekler:
    A: '289.296'
    B: '400.000'
    C: '443.786'
    D: '451.796'
    E: '455.000'
  dogru: D
  aciklama:
    dogru_neden: 'Kira yükümlülüğü = 400.000 × 3,1699 = 1.267.960 TL. Kullanım hakkı varlığı = 1.267.960 + 32.040 = 1.300.000
      TL. Mülkiyet devri ve satın alma opsiyonu olmadığından amortisman, yararlı ömür (8) ile kiralama süresinden (4) kısa
      olanına göre ayrılır: 1.300.000 / 4 = 325.000 TL. Faiz = 1.267.960 × %10 = 126.796 TL. Toplam gider = 451.796 TL. Püf
      noktaları: Faiz, kullanım hakkı varlığı üzerinden değil kira yükümlülüğü bakiyesi üzerinden hesaplanır; başlangıçtaki
      doğrudan maliyet yalnız varlığı artırır. Amortisman süresinde 8 yıllık ömür ancak mülkiyet devri veya kullanılacağı
      beklenen satın alma opsiyonu varsa kullanılır.'
    celdiriciler:
      A: Amortisman 8 yıllık yararlı ömre göre (162.500) hesaplanmıştır.
      B: Kiralama faaliyet kiralaması gibi doğrusal kira gideri olarak muhasebeleştirilmiştir.
      C: Başlangıçtaki doğrudan maliyet amortismana tabi tutara katılmamıştır (1.267.960 / 4 = 316.990).
      E: Faiz, kira yükümlülüğü yerine kullanım hakkı varlığı (1.300.000) üzerinden hesaplanmıştır.
    hesap_adimlari:
    - 'Kira yükümlülüğü: 400.000 × 3,1699 = 1.267.960'
    - 'Kullanım hakkı varlığı: 1.267.960 + 32.040 = 1.300.000'
    - 'Amortisman: 1.300.000 / 4 = 325.000'
    - 'Faiz: 1.267.960 × 0,10 = 126.796'
    - 'Toplam gider: 325.000 + 126.796 = 451.796'
