- id: YMM-IFM-KIR-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 15 beş adımlı model
  tip: hesaplama
  zorluk: 2
  kok: 'Bilişim AŞ, 1.7.2026 tarihinde bir müşterisiyle yazılım lisansı, kurulum hizmeti ve 24 aylık bakım hizmetinden oluşan
    paket için 800.000 TL''lik bir sözleşme imzalamış ve bedelin tamamını aynı gün tahsil etmiştir. Üç taahhüt ayrı edim yükümlülüğüdür.
    Tek başına satış fiyatları: lisans 600.000 TL, kurulum 150.000 TL, bakım 250.000 TL''dir; indirimin belirli bir edim yükümlülüğüne
    ait olduğuna dair gözlemlenebilir kanıt yoktur. Lisans ve kurulum 1.7.2026''da tamamlanmış; bakım hizmeti 1.7.2026''dan
    itibaren eşit olarak sunulmaktadır. Önemli finansman bileşeni bulunmamaktadır. KDV dikkate alınmayacaktır.


    Buna göre Bilişim AŞ''nin bu sözleşmeden 2026 yılında finansal tablolarına alacağı hasılat kaç TL''dir?'
  secenekler:
    A: '612.500'
    B: '650.000'
    C: '700.000'
    D: '800.000'
    E: '812.500'
  dogru: B
  aciklama:
    dogru_neden: 'İşlem bedeli nispi tek başına satış fiyatlarına göre dağıtılır (par. 76, 81): toplam TBSF 1.000.000; lisans
      800.000 × 0,60 = 480.000, kurulum 800.000 × 0,15 = 120.000, bakım 800.000 × 0,25 = 200.000. 2026 hasılatı = 480.000
      + 120.000 + 200.000 × 6/24 = 650.000 TL; kalan 150.000 TL sözleşme yükümlülüğüdür.'
    celdiriciler:
      A: İndirimin tamamı lisansa yüklenmiş (400.000 + 150.000 + 62.500); par. 82 şartları yoktur.
      C: Bakım bedelinin 6 aylık değil 12 aylık kısmı hasılat yazılmıştır.
      D: Tahsil edilen bedelin tamamı hasılat sayılmış, bakım hizmetinin zamana yayılı niteliği göz ardı edilmiştir.
      E: İndirim hiç dağıtılmamış, tek başına satış fiyatları doğrudan kullanılmıştır (600.000 + 150.000 + 62.500).
    hesap_adimlari:
    - 'İndirim oranı: 800.000 / 1.000.000 = 0,80'
    - Lisans 480.000; kurulum 120.000; bakım 200.000
    - 'Bakımın 2026 payı: 200.000 × 6/24 = 50.000'
    - 'Hasılat: 480.000 + 120.000 + 50.000 = 650.000'
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 81
    alinti: işletme, indirimi sözleşmedeki tüm edim yükümlülüklerine orantılı bir şekilde dağıtır
  gecerlilik: *id002
  dogrulama:
    python: 'bedel = 800000

      tbsf = {''lisans'': 600000, ''kurulum'': 150000, ''bakim'': 250000}

      top = sum(tbsf.values())

      pay = {k: bedel * v / top for k, v in tbsf.items()}

      sonuc = pay[''lisans''] + pay[''kurulum''] + pay[''bakim''] * 6 / 24'
  durum: taslak
