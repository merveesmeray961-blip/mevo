    madde: Ek A - Kısa vadeli kiralama tanımı
    alinti: Kiralamanın fiilen başladığı tarih itibarıyla, kiralama süresinin 12 ay veya daha kısa olduğu kiralamadır. Satın
      alma opsiyonu içeren bir kiralama, kısa vadeli kiralama değildir.
