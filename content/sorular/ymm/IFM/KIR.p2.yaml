- id: YMM-IFM-KIR-0015
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 15 beş adımlı model
  tip: kavrama
  zorluk: 1
  kok: 'TFRS 15''e göre aşağıdaki edim yükümlülüklerinden hangilerinde hasılat zamana yayılı olarak finansal tablolara alınır?


    I. Bir alışveriş merkezine bir yıl süreyle verilen günlük temizlik hizmeti

    II. Müşterinin arsası üzerinde inşa edilen ve inşa edildikçe kontrolü müşteriye geçen depo binası

    III. Müşteriye özel tasarlanan ve sözleşme gereği başka bir müşteriye yönlendirilemeyen ekipman; sözleşmede işletmenin
    o güne kadar tamamladığı kısım için hukuken icra edilebilir bir tahsil hakkı bulunmamakta, bedelin tamamı teslimde ödenmektedir.'
  secenekler:
    A: I ve II
    B: Yalnız I
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: TFRS 15 par. 35'teki üç şarttan birinin karşılanması hâlinde hasılat zamana yayılı alınır. I'de müşteri faydayı
      aynı anda alıp tüketir (35(a)); II'de oluşturulan varlığın kontrolü oluşturuldukça müşteriye geçer (35(b)). III'te varlığın
      alternatif kullanımı yoktur ancak 35(c)'nin ikinci unsuru olan icra edilebilir tahsil hakkı bulunmadığından edim belirli
      bir anda (teslimde) yerine getirilir.
    celdiriciler:
      B: II'de kontrol inşa edildikçe müşteriye geçtiğinden 35(b) şartı da karşılanmaktadır.
      C: III'te alternatif kullanım olmaması tek başına yetmez; tamamlanan edim için tahsil hakkı da gerekir.
      D: III zamana yayılı değildir; I ise 35(a) kapsamında zamana yayılıdır.
      E: III, 35(c)'deki iki unsurdan yalnız birini karşıladığından zamana yayılı değildir.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 35
    alinti: İşletme ediminin, işletme için alternatif kullanımı olan bir varlık oluşturmaması (bkz. 36'ncı paragraf) ve işletmenin
      o güne kadar tamamlanan edime karşılık yapılacak ödeme üzerinde hukuken icra edilebilir bir tahsil hakkının bulunması
