  konu: KIR
  kazanim: TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  tip: uygulama
  zorluk: 3
  kok: 'Kiracı Akasya AŞ''nin bir mağaza kiralamasında aşağıdaki ödemeler öngörülmüştür:


    I. Her yıl başında, bir önceki yılın TÜFE değişimine göre güncellenen sabit kira; ilk ölçümde fiilen başlama tarihindeki
    endeks düzeyi kullanılacaktır.

    II. Mağazanın yıllık satış hasılatının %2''si oranında ödenecek ek kira

    III. Kiraya verene verilen kalıntı değer taahhüdünün azami tutarı 300.000 TL olup Akasya AŞ, kiralama sonunda bu taahhüt
    kapsamında 80.000 TL ödeme yapmayı beklemektedir; ölçüme 300.000 TL''nin dahil edilmesi

    IV. Kiralama sonunda dayanak varlığı satın alma opsiyonunun kullanım fiyatı; Akasya AŞ opsiyonu kullanacağından makul
    ölçüde emin değildir.

    V. Kiralama süresi, Akasya AŞ''nin 5. yıl sonunda fesih opsiyonunu kullanacağı varsayımıyla belirlenmiştir; fesih hâlinde
    ödenecek ceza


    TFRS 16''ya göre yukarıdakilerden hangileri, fiilen başlama tarihinde kira yükümlülüğünün ölçümüne yazıldığı şekliyle
    dahil edilir?'
  secenekler:
    A: I ve V
    B: I ve III
    C: II ve IV
    D: I, III ve V
    E: I, II, III ve V
  dogru: A
  aciklama:
    dogru_neden: 'Endekse bağlı değişken ödemeler başlangıçtaki endeksle ölçülerek dahil edilir (27(b), 28). Kiralama süresi
      fesih opsiyonunun kullanılacağını gösteriyorsa fesih cezası dahil edilir (27(e)). Satışa bağlı ek kira endeks veya orana
      bağlı olmadığından dahil edilmez ve oluştuğu dönemde gider yazılır (38(b)). Kalıntı değer taahhüdünde azami tutar değil,
      ödenmesi beklenen 80.000 TL dahil edilir (27(c)); III bu nedenle yazıldığı şekliyle yanlıştır. Kullanılacağından makul
      ölçüde emin olunmayan satın alma opsiyonunun fiyatı dahil edilmez (27(d)). Püf noktaları: III''te tuzak tutardadır;
      taahhüt ölçüme girer ama azami tutarla değil beklenen ödemeyle girer. Değişken kiralarda belirleyici olan endekse/orana
      bağlılıktır.'
    celdiriciler:
      B: III'te azami tutar değil beklenen ödeme dahil edilir; V'deki fesih cezası da dışarıda bırakılmıştır.
      C: Satışa bağlı değişken kira ve makul ölçüde kesin olmayan satın alma opsiyonu ölçüme girmez.
      D: Kalıntı değer taahhüdünün 300.000 TL'lik azami tutarı ölçüme dahil edilmez.
      E: Satış hasılatına bağlı ek kira endeks veya orana bağlı değildir; III de azami tutarla dahil edilemez.
