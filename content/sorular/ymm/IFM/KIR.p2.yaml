- id: YMM-IFM-KIR-0016
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 16 kullanım hakkı varlığı ve kira yükümlülüğü
  tip: hesaplama
  zorluk: 2
  kok: 'Kiracı Sedir AŞ''nin 1.1.2026 tarihinde fiilen başlayan bir mağaza kiralamasına ilişkin bilgiler şöyledir:


    - Ödenmemiş kira ödemelerinin alternatif borçlanma faiz oranıyla bugünkü değeri: 1.900.000 TL

    - Fiilen başlama tarihinde peşin ödenen ilk ay kirası: 100.000 TL

    - Kiraya verenden alınan kiralama teşviki (nakit): 60.000 TL

    - Sözleşme yapılmasaydı katlanılmayacak emlak komisyonu: 40.000 TL

    - Kiralama sonunda mağazanın ilk hâline getirilmesi için tahmin edilen ve TMS 37''ye göre karşılık ayrılan maliyetin bugünkü
    değeri: 120.000 TL

    - Kiralama müzakerelerine harcanan zaman nedeniyle genel yönetim giderlerinden bu sözleşmeye dağıtılan pay: 30.000 TL


    Buna göre kullanım hakkı varlığının ilk ölçüm tutarı kaç TL''dir?'
  secenekler:
    A: 1.980.000
    B: 2.000.000
    C: 2.100.000
    D: 2.130.000
    E: 2.160.000
  dogru: C
  aciklama:
    dogru_neden: TFRS 16 par. 24'e göre maliyet = kira yükümlülüğü 1.900.000 + peşin kira 100.000 − alınan teşvik 60.000 +
      başlangıçtaki doğrudan maliyet 40.000 + restorasyon maliyeti 120.000 = 2.100.000 TL. Genel yönetim gideri payı, sözleşme
      yapılmasa da katlanılacak bir maliyet olduğundan başlangıçtaki doğrudan maliyet değildir.
    celdiriciler:
      A: Restorasyon maliyeti (par. 24(d)) maliyete eklenmemiştir.
      B: Peşin ödenen kira (par. 24(b)) maliyete eklenmemiştir.
      D: Ek maliyet niteliği taşımayan genel yönetim gideri payı da maliyete eklenmiştir.
      E: Alınan kiralama teşviki maliyetten düşülmemiştir.
    hesap_adimlari:
    - 'Kira yükümlülüğü: 1.900.000'
    - + Peşin ödeme 100.000 − teşvik 60.000 = 1.940.000
    - + Başlangıçtaki doğrudan maliyet 40.000 = 1.980.000
    - + Restorasyon maliyeti 120.000 = 2.100.000 (genel yönetim payı eklenmez)
  kaynaklar:
  - mevzuat: TFRS 16 Kiralamalar
    madde: par. 24
    alinti: Kiralamanın fiilen başladığı tarihte veya öncesinde yapılan tüm kira ödemelerinden, alınan tüm kiralama teşviklerinin
      düşülmesiyle elde edilen tutar, (c) Kiracı tarafından katlanılan tüm başlangıçtaki doğrudan maliyetler ve
  - mevzuat: TFRS 16 Kiralamalar
    madde: Ek A - Başlangıçtaki doğrudan maliyetler
    alinti: kiralama sözleşmesinin yapılması için katlanılan ancak sözleşme yapılmamış olsaydı katlanılmayacak olan ek maliyetlerdir
  gecerlilik: *id001
