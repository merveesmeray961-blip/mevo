- id: YMM-IFM-KIR-0020
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kiralamalar ve hasılat
  konu: KIR
  kazanim: TFRS 15 beş adımlı model
  tip: hesaplama
  zorluk: 3
  kok: 'Moda AŞ, Aralık 2026''da 200 adet ürünü birim fiyatı 5.000 TL''den nakit karşılığında satmıştır; ürünlerin birim maliyeti
    3.000 TL''dir. Müşterilere 60 gün içinde koşulsuz iade hakkı tanınmıştır. Moda AŞ, geçmiş deneyimine dayanarak ürünlerin
    %10''unun iade edileceğini tahmin etmekte olup bu tahminin kümülatif hasılatta önemli bir iptale yol açmayacağı kuvvetle
    muhtemeldir. İade edilen her ürünün geri alınması için 100 TL maliyete katlanılması beklenmektedir; iade edilen ürünlerin
    değerinde düşüş beklenmemektedir. KDV dikkate alınmayacaktır.


    TFRS 15''e göre bu satışların Moda AŞ''nin 2026 yılı brüt satış kârına etkisi kaç TL''dir?'
  secenekler:
    A: '300.000'
    B: '356.000'
    C: '358.000'
    D: '360.000'
    E: '400.000'
  dogru: C
  aciklama:
    dogru_neden: 'İade edilmesi beklenen 20 adet için hasılat alınmaz: hasılat = 180 × 5.000 = 900.000 TL; 100.000 TL iade
      yükümlülüğü olur (B21(a)-(b)). Ürünleri geri alma hakkı varlığı, önceki defter değerinden geri alma maliyetleri düşülerek
      ölçülür: 20 × (3.000 − 100) = 58.000 TL ve satışların maliyeti bu tutar kadar düzeltilir (B21(c), B25): 600.000 − 58.000
      = 542.000 TL. Brüt kâr = 900.000 − 542.000 = 358.000 TL. Püf noktaları: İade beklenen ürünler için hem hasılat hem maliyet
      düzeltilir; ancak maliyet düzeltmesi geri alma maliyeti kadar eksik yapılır. Bu maliyeti ayrıca bir kez daha gider yazmak
      çift sayımdır.'
    celdiriciler:
      A: Hasılat iade beklentisine göre azaltılmış, ancak satışların maliyeti düzeltilmemiştir (900.000 − 600.000).
      B: Geri alma maliyeti varlık ölçümünde düşüldükten sonra ayrıca 2.000 TL gider yazılarak çift sayılmıştır.
      D: Geri alma hakkı varlığı geri alma maliyetleri düşülmeden 60.000 TL olarak ölçülmüştür.
      E: İade beklentisi dikkate alınmadan tüm satış hasılat ve maliyet olarak kaydedilmiştir.
    hesap_adimlari:
    - 'Hasılat: 180 × 5.000 = 900.000 (iade yükümlülüğü 100.000)'
    - 'Geri alma hakkı varlığı: 20 × (3.000 − 100) = 58.000'
    - 'SMM: 200 × 3.000 − 58.000 = 542.000'
    - 'Brüt kâr: 900.000 − 542.000 = 358.000'
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. B21
    alinti: İade yükümlülüğünün yerine getirilmesi üzerine işletmenin müşteriden ürünleri geri alma hakkı karşılığında bir
      varlık (ve buna karşılık satışların maliyetinde yapılan düzeltme).
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. B25
    alinti: ürünlerin (örneğin stokların) önceki defter değerinden bu ürünlerin geri alınması için katlanılması beklenen maliyetler
      (iade edilen ürünlerin işletme açısından değerinde meydana gelmesi olası düşüşler dâhil) düşüldükten sonra bulunacak
      tutar referans alınarak ölçülür.
  gecerlilik: *id002
  dogrulama:
    python: 'adet, fiyat, maliyet, iade_orani, geri_alma = 200, 5000, 3000, 0.10, 100

      iade = adet * iade_orani

      hasilat = (adet - iade) * fiyat

      varlik = iade * (maliyet - geri_alma)

      smm = adet * maliyet - varlik

      sonuc = hasilat - smm'
