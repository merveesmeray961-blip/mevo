- id: YMM-IFM-KIR-0050
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Hasılat ve kiralamalar
  konu: KIR
  kazanim: kullanım hakkı varlığının ilk ölçümü
  tip: hesaplama
  zorluk: 2
  kok: 'Kiracı Doğan AŞ, 1.1.2026''da başlayan 2 yıllık bir ofis kiralaması yapmıştır. Yıllık kira 1.210.000 TL olup her yıl
    sonunda ödenecektir; kiralamadaki zımni faiz oranı kolaylıkla belirlenememekte ve Doğan AŞ''nin alternatif borçlanma faiz
    oranı %10 olmaktadır. Kiralamanın fiilen başladığı tarihte ayrıca şu işlemler gerçekleşmiştir: Kiraya verene yıllık kiralara
    ek olarak 100.000 TL peşin kira ödenmiştir; kiraya veren Doğan AŞ''ye ofis tadilatı için 150.000 TL nakit kiralama teşviki
    ödemiştir; Doğan AŞ 40.000 TL başlangıçtaki doğrudan maliyete katlanmıştır; sözleşme gereği kira sonunda ofisin eski hâline
    getirilmesi için katlanılacak tahmini maliyetin 1.1.2026''daki bugünkü değeri 60.000 TL''dir. Doğan AŞ''nin kullanım hakkı
    varlığını ilk ölçümde kaç TL''den kaydetmesi gerekir?'
  secenekler:
    A: 2.090.000 TL
    B: 2.150.000 TL
    C: 2.200.000 TL
    D: 2.300.000 TL
    E: 2.450.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Kullanım hakkı varlığının maliyeti; kira yükümlülüğünün ilk ölçüm tutarı (2.100.000 TL), başlangıç tarihinde
      veya öncesinde yapılan kira ödemelerinden alınan teşviklerin düşülmesiyle bulunan tutar (100.000 - 150.000 = -50.000
      TL), başlangıçtaki doğrudan maliyetler (40.000 TL) ve söküm/restorasyon tahmini maliyetlerinin (60.000 TL) toplamıdır
      (par. 24): 2.150.000 TL.'
    celdiriciler:
      A: Restorasyon maliyeti dikkate alınmamıştır; par. 24(d) bunu maliyete dahil eder.
      C: Yalnızca kira yükümlülüğü ve peşin ödeme toplanmıştır; teşvik, doğrudan maliyet ve restorasyon unutulmuştur.
      D: Alınan teşvik düşülmemiştir; par. 24(b) teşvikin düşülmesini gerektirir.
      E: Alınan teşvik düşülmesi gerekirken maliyete eklenmiştir.
    hesap_adimlari:
    - 'Kira yükümlülüğü: 1.210.000/1,1 + 1.210.000/1,21 = 2.100.000'
    - 'Maliyet: 2.100.000 + 100.000 - 150.000 + 40.000 + 60.000 = 2.150.000'
  kaynaklar:
