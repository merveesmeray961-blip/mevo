  kok: Kiraya veren Mavi Gayrimenkul AŞ, 1.1.2026'da bir ofisi 4 yıllığına faaliyet kiralaması olarak kiraya vermiştir. Sözleşmeye
    göre ilk yıl için kira alınmayacak, 2., 3. ve 4. yıllar için her yıl sonunda 600.000 TL kira ödenecektir. Mavi, kira gelirini
