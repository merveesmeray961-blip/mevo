- id: YMM-IFM-KIR-0049
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Hasılat ve kiralamalar
  konu: KIR
  kazanim: müşteriye ödenebilir bedel
  tip: hesaplama
  zorluk: 2
  kok: Gıda AŞ, bir süpermarket zinciriyle 1.2.2026'da 2026 yılı satışlarını kapsayan bir tedarik sözleşmesi imzalamış ve
    aynı tarihte zincire, zincirin mağazalarında yürüteceği ürün tanıtım kampanyası karşılığında 600.000 TL ödemiştir. Tanıtım
    hizmeti, zincirin Gıda AŞ'ye sunduğu ve tek başına yararlanılabilen farklı bir hizmettir; gerçeğe uygun değeri güvenilir
    biçimde 350.000 TL olarak tahmin edilmektedir. Gıda AŞ'nin sözleşme kapsamında zincire yaptığı satışların sözleşme fiyatlarıyla
    toplamı 4.000.000 TL olup tamamı 1.2.2026'dan sonra teslim edilmiştir. Buna göre Gıda AŞ'nin bu sözleşmeden 2026 yılında
    finansal tablolara alacağı hasılat kaç TL'dir?
  secenekler:
    A: 3.050.000 TL
    B: 3.400.000 TL
    C: 3.650.000 TL
    D: 3.750.000 TL
    E: 4.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: Müşteriye ödenen tutarın farklı bir hizmet karşılığı olan kısmı (350.000 TL, gerçeğe uygun değer) tedarikçilere
      yapılan diğer alımlar gibi muhasebeleştirilir; gerçeğe uygun değeri aşan kısım (600.000 - 350.000 = 250.000 TL) işlem
      bedelinden azaltma olarak hasılattan düşülür (par. 70-71). Hasılat = 4.000.000 - 250.000 = 3.750.000 TL.
    celdiriciler:
      A: Ödemenin tamamına ek olarak hizmetin gerçeğe uygun değeri de hasılattan düşülmüştür (çift düşüm).
      B: Ödemenin tamamı hasılattan düşülmüştür; oysa farklı hizmet karşılığı olan 350.000 TL hasılatı azaltmaz.
      C: Düşülmesi gereken fazlalık yerine hizmetin gerçeğe uygun değeri (350.000 TL) hasılattan düşülmüştür.
      E: Ödemenin tamamı gider/alım sayılmıştır; gerçeğe uygun değeri aşan 250.000 TL'lik kısım hasılattan düşülmelidir.
    hesap_adimlari:
    - 'Ödemenin gerçeğe uygun değeri aşan kısmı: 600.000 - 350.000 = 250.000'
    - 'Hasılat: 4.000.000 - 250.000 = 3.750.000'
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 71
    alinti: İşletme, müşteriye ödenebilir bedelin müşteriden aldığı farklı mal veya hizmetin gerçeğe uygun değerini aşan kısmını
