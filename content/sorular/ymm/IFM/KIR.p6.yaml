- id: YMM-IFM-KIR-0051
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Hasılat ve kiralamalar
  konu: KIR
  kazanim: kira süresinin yeniden değerlendirilmesi
  tip: hesaplama
  zorluk: 3
  kok: Kiracı Bora Tekstil AŞ, 1.1.2024'te başlayan 5 yıllık (31.12.2028'de sona erecek) bir depo kiralaması yapmıştır. Yıllık
    kira 1.000.000 TL olup her yıl sonunda ödenmektedir. Sözleşme, aynı kira bedeliyle kiralamayı 2 yıl daha (2029 ve 2030)
    uzatma hakkı vermektedir; kiralamanın fiilen başladığı tarihte bu opsiyonun kullanılacağından makul ölçüde emin olunmadığı
    için kiralama süresi 5 yıl alınmıştır. Bora Tekstil, 2026'da kendi kontrolünde depoda kiralama sonrasında da fayda sağlayacak
    önemli tadilat yatırımları yapmış ve bu nedenle 31.12.2026'da (2026 kirası ödendikten sonra) opsiyonu kullanacağından
    makul ölçüde emin hâle gelmiştir. Kiralamadaki zımni faiz oranı kolaylıkla belirlenememekte olup Bora Tekstil'in 31.12.2026'daki
    alternatif borçlanma faiz oranı %25'tir. Kira yükümlülüğünün yeniden ölçüm öncesi defter değeri 1.500.000 TL'dir ve kullanım
    hakkı varlığının defter değeri sıfırdan büyüktür. Bora Tekstil'in 31.12.2026'da kullanım hakkı varlığında yapacağı düzeltme
    tutarı kaç TL'dir?
  secenekler:
    A: Kullanım hakkı varlığı 861.600 TL artırılır
    B: Kullanım hakkı varlığı 921.600 TL artırılır
    C: Kullanım hakkı varlığı 1.440.000 TL artırılır
    D: Kullanım hakkı varlığı 2.000.000 TL artırılır
    E: Kullanım hakkı varlığı 2.361.600 TL artırılır
  dogru: A
  aciklama:
    dogru_neden: 'Kiracının kontrolündeki önemli bir olay nedeniyle uzatma opsiyonunu kullanacağından makul ölçüde emin hâle
      gelmesi kiralama süresini değiştirir (par. 20-21). Kiracı, revize edilmiş kira ödemelerini (kalan 2 + uzatma 2 yıl =
      4 ödeme) revize edilmiş iskonto oranıyla (yeniden değerlendirme tarihindeki alternatif borçlanma oranı, par. 41) indirgeyerek
      yükümlülüğü yeniden ölçer ve farkı kullanım hakkı varlığında düzeltme olarak yansıtır (par. 39-40). Yeni yükümlülük
      1.000.000 x (0,8 + 0,64 + 0,512 + 0,4096) = 2.361.600 TL; düzeltme 2.361.600 - 1.500.000 = 861.600 TL. Püf noktaları:
      (1) Yalnızca uzatma dönemi ödemeleri değil, kalan tüm ödemeler yeni oranla indirgenir. (2) Fark kâr veya zarara değil,
      kullanım hakkı varlığına yazılır; varlık sıfıra inmişse kalan kısım kâr veya zarara gider. (3) Eski iskonto oranı değil,
      yeniden değerlendirme tarihindeki oran kullanılır.'
    celdiriciler:
      B: Yalnızca uzatma dönemi ödemelerinin (2029-2030) yeni oranla bugünkü değeri alınmıştır; kalan ödemelerin yeni oranla
        yeniden indirgenmesi ve mevcut defter değerinin düşülmesi unutulmuştur.
      C: Kalan iki ödemenin yeni oranla bugünkü değeridir; bu, düzeltme tutarı değildir.
      D: Uzatma dönemi ödemeleri iskonto edilmeden toplanmıştır.
      E: Yeni kira yükümlülüğünün tamamı alınmış, mevcut defter değeri (1.500.000 TL) düşülmemiştir.
    hesap_adimlari:
    - 'Revize ödemeler: 2027-2030, her yıl 1.000.000, iskonto %25'
    - 'Yeni yükümlülük: 800.000 + 640.000 + 512.000 + 409.600 = 2.361.600'
    - 'Düzeltme: 2.361.600 - 1.500.000 = 861.600'
  kaynaklar:
  - mevzuat: TFRS 16 Kiralamalar
    madde: par. 39
    alinti: Kiracı, kira yükümlülüğünün yeniden ölçülmüş tutarını, kullanım hakkı varlığında düzeltme olarak finansal tablolarına
      yansıtır.
  - mevzuat: TFRS 16 Kiralamalar
    madde: par. 41
    alinti: Kiracı, 40’ıncı paragrafı uygularken, kiralama süresinin kalan kısmı için revize edilmiş iskonto oranını,
  gecerlilik:
    baslangic: '2019-01-01'
    bitis: null
