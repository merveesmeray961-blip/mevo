- id: YMM-IFM-KIR-0048
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Hasılat ve kiralamalar
  konu: KIR
  kazanim: önemli finansman bileşeni
  tip: kavrama
  zorluk: 1
  kok: TFRS 15'e göre, aşağıda bağımsız olarak verilen sözleşmelerden hangisinde işletmenin taahhüt edilen bedeli önemli bir
    finansman bileşeninin etkisi için düzeltmesi gerekir?
  secenekler:
    A: Ürün 1.4.2026'da teslim edilmiş, bedelin 1.12.2026'da ödenmesi kararlaştırılmıştır; işletme, sözleşme başlangıcında
      teslim ile ödeme arasındaki sürenin bir yıldan kısa olacağını öngörmüştür.
    B: Müşteri ürün bedelini iki yıl önceden ödemiştir; ürünün hangi tarihte teslim edileceği tamamen müşterinin takdirindedir.
    C: Bir fikri mülkiyet lisansı karşılığında müşteri, lisanslı ürünün satışlarının %5'i tutarındaki telif ücretini iki yıl
      boyunca her yıl sonunda ödeyecektir.
    D: Bedelin %20'si, işletmenin edimini sözleşmeye uygun tamamlamasını güvence altına almak amacıyla, tesliminden 18 ay
      sonra ödenecektir; nakit fiyat ile bedel arasındaki fark başka bir nedenden doğmamaktadır.
    E: Makine 1.1.2026'da teslim edilmiştir; nakit satış fiyatı 1.000.000 TL olan makinenin bedeli olan 1.440.000 TL, 31.12.2027'de
      ödenecektir; fark yalnızca finansmandan doğmaktadır.
  dogru: E
  aciklama:
    dogru_neden: 'Makine devredildikten iki yıl sonra ödeme yapılmakta ve nakit fiyat (1.000.000 TL) ile taahhüt edilen bedel
      (1.440.000 TL = 1.000.000 x 1,2 x 1,2) arasındaki fark yalnızca finansman sağlanmasından kaynaklanmaktadır. Süre bir
      yıldan uzun olduğundan kolaylaştırıcı uygulama (par. 63) kullanılamaz ve par. 62''deki istisnaların hiçbiri yoktur;
      işlem bedeli paranın zaman değerine göre düzeltilir (par. 60-61): hasılat 1.000.000 TL, aradaki 440.000 TL ise faiz
      geliri olarak sunulur (par. 65).'
    celdiriciler:
      A: Teslim ile ödeme arasındaki sürenin bir yıl veya daha az olacağı öngörüldüğünden işletme düzeltme yapmak zorunda
        değildir (par. 63).
      B: Ödeme devirden önce yapılmış ve devir zamanı tamamen müşterinin takdirindedir; par. 62(a) uyarınca önemli finansman
        bileşeni yoktur.
      C: Bedelin önemli bölümü satış bazlı telif ücreti gibi işletme ve müşterinin kontrolü dışındaki olaya bağlı değişken
        bedeldir; par. 62(b) uyarınca finansman bileşeni yoktur.
      D: Fark finansman dışındaki bir sebepten (ifanın güvencesi) doğmaktadır; par. 62(c) uyarınca finansman bileşeni yoktur.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 62(c)
    alinti: Mal veya hizmetin taahhüt edilen bedeliyle nakit satış fiyatı arasındaki (61’inci paragrafta açıklanan şekilde)
      farkın, müşteri ya da işletmeye finansman temini dışındaki sebeplerden doğması ve aradaki farkın bu sebeplerle orantılı
      olması.
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 63
    alinti: Kolaylaştırıcı bir uygulama olarak işletme, sözleşmenin başlangıcında, müşteriye taahhüt ettiği mal veya hizmetin
      devir tarihi ile müşterinin bu mal veya hizmetin bedelini ödediği tarih arasında geçen sürenin bir yıl veya daha az
      olacağını öngörmesi durumunda, taahhüt edilen bedelde önemli bir finansman bileşeninin etkisi için düzeltme yapmak zorunda
