  dogru: C
  aciklama:
    dogru_neden: 'Kiraya veren faaliyet kiralaması kira ödemelerini doğrusal olarak gelir yazar (par. 81); kira bedelsiz yıl
      da kiralama süresine dahildir (4 yıl): toplam kira 1.800.000 / 4 = 450.000 TL/yıl. Başlangıçtaki doğrudan maliyet dayanak
      varlığın defter değerine eklenir ve kira geliriyle aynı yöntemle (doğrusal) kiralama süresi boyunca gider yazılır (par.
      83): 40.000 / 4 = 10.000 TL. Net etki 450.000 - 10.000 = 440.000 TL.'
    celdiriciler:
      A: Gelir nakit esasına göre (2026'da kira alınmadığından sıfır) alınmış ve doğrudan maliyet bir defada gider yazılmıştır.
      B: Kira geliri doğru bulunmuş fakat doğrudan maliyet bir defada gider yazılmıştır; par. 83 maliyetin kiralama süresine
        yayılmasını gerektirir.
      D: Başlangıçtaki doğrudan maliyetin kiralama süresine yayılan 10.000 TL'lik gideri dikkate alınmamıştır.
      E: Kira bedelsiz yıl kiralama süresinden sayılmamış (1.800.000 / 3) ve doğrudan maliyet dikkate alınmamıştır.
    hesap_adimlari:
    - 'Yıllık doğrusal gelir: 1.800.000 / 4 = 450.000'
    - 'Yıllık doğrudan maliyet gideri: 40.000 / 4 = 10.000'
    - 'Net: 440.000'
