- id: YMM-IFM-KIR-0053
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Hasılat ve kiralamalar
  konu: KIR
  kazanim: sözleşme maliyetleri
  tip: kavrama
  zorluk: 3
  kok: TFRS 15'te yer alan sözleşme maliyetlerine ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Sözleşme yapılmasaydı katlanılmayacak olan satış komisyonları, geri kazanılmaları bekleniyorsa varlık olarak finansal
      tablolara alınır.
    B: Sözleşmenin yapılıp yapılmadığından bağımsız olarak katlanılan teklif hazırlama maliyetleri, müşteriye açıkça fatura
      edilebilir olmadıkça katlanıldıkça gider yazılır.
    C: Aktifleştirilecek ek maliyete ilişkin varlığın itfa süresi bir yıl veya daha az ise, sözleşme yapılması için katlanılan
      ek maliyetler gider olarak finansal tablolara alınabilir.
    D: Aktifleştirilen varlığın itfa süresinde önemli bir değişiklik olması, muhasebe politikası değişikliği sayılır ve önceki
      dönem tabloları yeniden düzenlenir.
    E: Yerine getirilmiş veya kısmen yerine getirilmiş edim yükümlülükleriyle ilişkili maliyetler katlanıldıkça gider olarak
      finansal tablolara alınır.
  dogru: D
  aciklama:
    dogru_neden: 'İtfa süresinde, ilişkili mal veya hizmetlerin devir süresindeki önemli değişiklik nedeniyle yapılan güncelleme
      TMS 8 uyarınca muhasebe tahmininde değişikliktir (par. 100); ileriye dönük uygulanır ve önceki dönemler yeniden düzenlenmez.
      Bu nedenle D yanlıştır. Püf noktaları: (1) Komisyon ile teklif maliyetini ''sözleşme olmasaydı katlanılır mıydı'' ölçütüyle
      ayırın (par. 92-93). (2) Bir yıl kolaylığı, itfa süresiyle ilgilidir (par. 94). (3) Itfa güncellemesi politika değil
      tahmin değişikliğidir.'
    celdiriciler:
      A: Par. 91-92'ye uygun, doğru ifadedir.
      B: Par. 93'e uygun, doğru ifadedir.
      C: Par. 94'teki kolaylaştırıcı uygulamaya uygun, doğru ifadedir.
      E: Par. 98(c)'ye uygun, doğru ifadedir.
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 100
    alinti: İşletme itfa payını, varlığın ilişkili olduğu mal veya hizmetleri müşteriye devretmeyi öngördüğü sürede meydana
      gelen önemli bir değişikliği yansıtmak için günceller. Bu tür bir değişiklik, TMS 8 uyarınca muhasebe tahmininde bir
      değişiklik olarak muhasebeleştirilir.
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: par. 94
    alinti: Kolaylaştırıcı bir uygulama olarak, varlığın itfa süresinin bir yıl veya daha az olması durumunda sözleşme yapılması
      için katlanılan ek maliyetler gider olarak finansal tablolara alınabilir.
