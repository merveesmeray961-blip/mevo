- id: YMM-IFM-KON-0013
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 3 satın alma yöntemi ve şerefiye
  tip: bilgi
  zorluk: 1
  kok: Mavi AŞ, Toprak AŞ'nin hisselerinin %100'ünü nakit karşılığında satın alarak kontrolünü elde etmiştir. İşlem
    TFRS 3 kapsamında bir işletme birleşmesidir. Mavi AŞ, birleşme sürecinde hukuk danışmanlığı ve değerleme raporu
    için toplam 240.000 TL ödemiştir; birleşme için pay veya borçlanma aracı ihraç etmemiştir. Bu 240.000 TL'nin
    Mavi AŞ'nin konsolide finansal tablolarındaki muhasebeleştirilmesi aşağıdakilerden hangisidir?
  secenekler:
    A: Transfer edilen bedele eklenir; böylece şerefiye tutarı artar
    B: Maliyetlerin gerçekleştiği ve hizmetin alındığı dönemde gider olarak
    C: Bağlı ortaklık yatırımının maliyetine eklenir, konsolidasyonda şerefiyeye dâhil olur
    D: Özkaynaklardan, paylara ilişkin primlerden indirilerek
    E: Edinilen tanımlanabilir varlıkların maliyetine oransal olarak dağıtılır
  dogru: B
  aciklama:
    dogru_neden: TFRS 3 par. 53'e göre aracılık, danışmanlık, yasal ücretler, muhasebe ve değerleme ücretleri satın
      alıma ilişkin maliyetlerdir ve edinen işletme bunları, tek istisna dışında, gerçekleştikleri ve hizmetin alındığı
      dönemde gider yazar. Tek istisna borçlanma aracı ve pay ihraç maliyetleridir; olayda böyle bir ihraç yoktur.
    celdiriciler:
      A: Transfer edilen bedel par. 37'ye göre devredilen varlıkların, üstlenilen borçların ve ihraç edilen payların
        gerçeğe uygun değeridir; danışmanlık ücreti bedele eklenmez, şerefiyeyi büyütmez.
      C: Eski uygulamadaki 'maliyete ekleme' yaklaşımıdır; TFRS 3 bu maliyetlerin gider yazılmasını öngörür.
      D: Özkaynaktan indirme yalnız pay ihraç maliyetleri için (TMS 32) söz konusudur; olayda pay ihracı yoktur.
      E: Edinilen varlıklar birleşme tarihindeki gerçeğe uygun değerleriyle ölçülür (par. 18); satın alma maliyetleri
        bunlara dağıtılmaz.
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 53
    alinti: Edinen işletme, satın alıma ilişkin maliyetleri, sadece bir istisna dışında, maliyetlerin gerçekleştiği
      ve hizmetlerin alındığı dönemlerde gider olarak muhasebeleştirir. Borçlanma araçlarının ya da hisse senetlerinin
      ihraç edilmesine ilişkin maliyetler, TMS 32 ve TFRS 9 uyarınca finansal tablolara alınır.
