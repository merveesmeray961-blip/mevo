- id: YMM-IFM-KON-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: grup içi işlemlerin elimine edilmesi
  tip: kavrama
  zorluk: 2
  kok: 'TFRS 10''a göre konsolide finansal tabloların hazırlanmasına ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. Ana ortaklığın %60 oranında sahip olduğu bağlı ortaklığa sattığı ve dönem sonunda bağlı ortaklığın stoklarında
    bulunan malların kârı, %60 oranında değil, tamamen elimine edilir.

    II. Bağlı ortaklığın zararları nedeniyle kontrol gücü olmayan paylar ters (borç) bakiye verecekse, aşan zarar
    payı ana ortaklık hissedarlarına yüklenir.

    III. Grup içi işlemlerden kaynaklanan kâr veya zararların elimine edilmesi sırasında ortaya çıkan geçici farklara
    TMS 12 uygulanır.

    IV. Kontrol gücü olmayan paylar, konsolide finansal durum tablosunda özkaynaklar içinde, ana ortaklık sahiplerine
    ait özkaynaklardan ayrı gösterilir.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur: B86(c) stok ve duran varlıklarda muhasebeleştirilen grup içi kâr veya zararların tamamen
      elimine edilmesini ister. III doğrudur: aynı bent, eliminasyondan doğan geçici farklara TMS 12''nin uygulanacağını
      belirtir. IV doğrudur (par. 22). II yanlıştır: B94''e göre toplam kapsamlı gelir, kontrol gücü olmayan paylarda
      ters bakiye ile sonuçlansa dahi bu paylara dağıtılır.'
    celdiriciler:
      A: II yanlıştır; ayrıca doğru olan III ve IV dışarıda kalmıştır.
      B: IV de doğrudur (TFRS 10 par. 22); eksik seçimdir.
      C: II yanlış, I doğrudur; seçim tersine kurulmuştur.
      E: II'yi doğru saymaktadır; eski 'azınlık payı negatif olamaz' anlayışı TFRS 10'da yoktur (B94).
  kaynaklar:
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B86(c)
    alinti: Grup işletmeleri arasındaki işlemlerle ilgili özkaynak, gelir, gider ve nakit akışları ile grup içi
      varlık ve borçların tümünü elimine eder (stoklar ve duran varlıklar gibi varlıklarda muhasebeleştirilen grup
      içi işlemler sebebiyle oluşan kâr veya zararlar tamamen elimine edilir).
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B94
    alinti: İşletme ayrıca, toplam kapsamlı geliri, ana ortaklık hissedarlarına ve kontrol gücü olmayan paylara
      da dağıtır (bu durum, kontrol gücü olmayan paylarda ters bakiye ile sonuçlansa dahi).
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: par. 22
    alinti: Ana ortaklık, kontrol gücü olmayan payları konsolide finansal durum tablosunda özkaynaklar içerisinde,
      kendi ortaklarının özkaynaklardaki paylarından ayrı olarak gösterir.
