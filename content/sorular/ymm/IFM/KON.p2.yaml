- id: YMM-IFM-KON-0014
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 10 kontrol ve konsolide tablolar
  tip: bilgi
  zorluk: 1
  kok: TFRS 10'a göre ana ortaklığın raporlama dönemi 31 Aralık'ta sona ermektedir. Bağlı ortaklığın raporlama dönemi
    sonu farklıdır ve ana ortaklığın tarihi itibarıyla ilave finansal bilgi hazırlanması mümkün değildir. Bu durumda
    bağlı ortaklığın en güncel finansal tabloları, aradaki önemli işlem ve olayların etkisine göre düzeltilerek
    kullanılabilir; ancak iki raporlama tarihi arasındaki fark ........ fazla olamaz. Boşluğa aşağıdakilerden hangisi
    gelmelidir?
  secenekler:
    A: Üç aydan
    B: Bir aydan
    C: Altı aydan
    D: Dokuz aydan
    E: On iki aydan
  dogru: A
  aciklama:
    dogru_neden: 'TFRS 10 B92-B93: Önce aynı tarih itibarıyla ilave finansal bilgi hazırlanır; bu mümkün değilse
      en güncel tablolar önemli işlemlere göre düzeltilerek kullanılır. Her durumda raporlama tarihleri arasındaki
      fark üç aydan fazla olamaz ve dönem uzunluğu ile tarih farkı dönemler itibarıyla aynı kalmalıdır.'
    celdiriciler:
      B: Standart bir aylık bir sınır koymaz; üç aya kadar farka izin verir.
      C: Altı ay, B93'teki üç aylık üst sınırın iki katıdır.
      D: Dokuz aylık fark, B93'e göre kabul edilmez.
      E: On iki ay, ölçme dönemi (TFRS 3 par. 45) ile karıştırılarak seçilir; raporlama tarihi farkı için sınır
        üç aydır.
  kaynaklar:
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B93
    alinti: Her durumda, ana ortaklık ile bağlı ortaklığın raporlama tarihleri arasındaki fark üç aydan fazla olamaz
      ve raporlama dönemlerinin uzunluğu ve raporlama tarihlerinin farklılığı dönemler itibarıyla aynı olmalıdır.
