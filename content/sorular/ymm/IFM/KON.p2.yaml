- id: YMM-IFM-KON-0018
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 3 satın alma yöntemi ve şerefiye
  tip: hesaplama
  zorluk: 3
  kok: 'Kuzey AŞ, Güney AŞ''nin %20 payına sahiptir ve bu payı özkaynak yöntemiyle 1.000.000 TL defter değerinden
    izlemektedir. Kuzey AŞ, 1.4.2026''da Güney AŞ''nin %50 payını daha 3.500.000 TL nakit karşılığında satın alarak
    kontrolü elde etmiştir. Birleşme tarihinde:

    - Önceden elde tutulan %20 payın gerçeğe uygun değeri 1.300.000 TL''dir.

    - Güney AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 5.600.000 TL''dir.

    - Kontrol gücü olmayan paylar (%30) gerçeğe uygun değerleri olan 1.800.000 TL üzerinden ölçülecektir.

    - Kuzey AŞ, birleşme için 150.000 TL danışmanlık ücreti ödemiştir.

    Kuzey AŞ''nin konsolide finansal tablolarında muhasebeleştirilecek şerefiye kaç TL''dir?'
  secenekler:
    A: '580.000'
    B: '700.000'
    C: '880.000'
    D: 1.000.000
    E: 1.150.000
  dogru: D
  aciklama:
    dogru_neden: 'TFRS 3 par. 32: Şerefiye = (transfer edilen bedel + kontrol gücü olmayan pay + önceden elde tutulan
      payın birleşme tarihindeki gerçeğe uygun değeri) − tanımlanabilir net varlıklar = 3.500.000 + 1.800.000 +
      1.300.000 − 5.600.000 = 1.000.000 TL. Önceki pay par. 42 uyarınca gerçeğe uygun değere yeniden ölçülür (300.000
      TL kazanç kâr veya zarara); danışmanlık ücreti par. 53 uyarınca gider yazılır. Püf noktaları: Aşamalı birleşmede
      önceki pay defter değeriyle değil birleşme tarihindeki gerçeğe uygun değeriyle hesaba girer; kontrol gücü
      olmayan payın hangi esasla ölçüleceği kökte verilmiştir (gerçeğe uygun değer); danışmanlık ücreti şerefiyeyi
      etkilemeyen, bilerek verilmiş bir veridir.'
    celdiriciler:
      A: Hem önceki payı defter değeriyle (1.000.000) almak hem de kontrol gücü olmayan payı oransal yöntemle (%30
        × 5.600.000 = 1.680.000) ölçmek.
      B: Önceki payı yeniden ölçmeyip defter değeriyle (1.000.000) almak.
      C: Kontrol gücü olmayan payı, kökteki ölçüm tercihine aykırı olarak oransal yöntemle (1.680.000) ölçmek.
      E: Danışmanlık ücretini (150.000) transfer edilen bedele ekleyerek şerefiyeye dâhil etmek.
    hesap_adimlari:
    - '32(a): 3.500.000 + 1.800.000 + 1.300.000 = 6.600.000'
    - '32(b): 5.600.000'
    - 'Şerefiye: 6.600.000 − 5.600.000 = 1.000.000'
    - 'Ayrıca: önceki payın yeniden ölçüm kazancı 1.300.000 − 1.000.000 = 300.000 (kâr veya zarar); 150.000 gider'
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 32
    alinti: Edinen işletme, şerefiyeyi birleşme tarihi itibariyle aşağıda yer alan (a)’nın (b)’den fazlası şeklinde
      ölçerek muhasebeleştirir
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 42
    alinti: Aşamalı olarak gerçekleşen bir işletme birleşmesinde edinen işletme, daha önceden elinde bulundurduğu
      edinilen işletmedeki özkaynak payını, birleşme tarihindeki gerçeğe uygun değeri üzerinden yeniden ölçer ve
      sonuçta ortaya çıkan bir kazanç veya kayıp varsa bunu kâr veya zararda ya da -uygun olması durumunda- diğer
      kapsamlı gelirde finansal tablolara alır.
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 19
    alinti: (a) Gerçeğe uygun değer üzerinden ya da (b) Mevcut ortaklık araçlarının, edinilen işletmenin net tanımlanabilir
      varlıklarının muhasebeleştirilen tutarlarındaki orantılı payı üzerinden ölçer.
  gecerlilik: *id002
  dogrulama:
    python: 'bedel = 3500000

      kgop = 1800000

      onceki_gud = 1300000

      net_varlik = 5600000

      sonuc = bedel + kgop + onceki_gud - net_varlik'
