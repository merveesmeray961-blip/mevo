- id: YMM-IFM-KON-0015
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TMS 28 özkaynak yöntemi
  tip: hesaplama
  zorluk: 2
  kok: Ada AŞ, 1.1.2026'da Nil AŞ'nin oy haklarının %30'unu 900.000 TL'ye satın almış ve Nil AŞ üzerinde önemli
    etki elde etmiştir. Edinim tarihinde Nil AŞ'nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 2.500.000
    TL'dir (defter değerine eşittir). Nil AŞ 2026 yılında 400.000 TL net kâr elde etmiş, 100.000 TL kâr payı dağıtmış
    ve maddi duran varlıklarını yeniden değerleyerek diğer kapsamlı gelire 50.000 TL değer artışı yansıtmıştır.
    Ada AŞ'nin özkaynak yöntemine göre 31.12.2026 tarihli finansal durum tablosundaki iştirak yatırımının defter
    değeri kaç TL'dir?
  secenekler:
    A: '855.000'
    B: '990.000'
    C: 1.005.000
    D: 1.020.000
    E: 1.035.000
  dogru: C
  aciklama:
    dogru_neden: 'TMS 28 par. 10 ve 32: Yatırım maliyetle (900.000 TL) kaydedilir; 900.000 − %30 × 2.500.000 = 150.000
      TL şerefiye yatırımın defter değerine dâhildir ve itfa edilmez. Sonra kârdan pay (+120.000) eklenir, alınan
      kâr payı (−30.000) düşülür, diğer kapsamlı gelirden pay (+15.000) eklenir: 900.000 + 120.000 − 30.000 + 15.000
      = 1.005.000 TL.'
    celdiriciler:
      A: Başlangıç tutarını maliyet yerine net varlıklardaki pay (750.000) olarak almak; şerefiye yatırımın defter
        değerine dâhildir.
      B: Diğer kapsamlı gelirdeki yeniden değerleme payını (15.000) unutmak.
      D: Alınan kâr payını defter değerinden düşmemek; dağıtımlar defter değerini azaltır.
      E: Hem kâr payını düşmemek hem de diğer kapsamlı gelir payını eklemek.
    hesap_adimlari:
    - 'Şerefiye: 900.000 − 0,30 × 2.500.000 = 150.000 (defter değerinde kalır)'
    - 'Kârdan pay: 0,30 × 400.000 = 120.000'
    - 'Kâr payı: 0,30 × 100.000 = 30.000 (defter değerini azaltır)'
    - 'DKG payı: 0,30 × 50.000 = 15.000'
    - 900.000 + 120.000 − 30.000 + 15.000 = 1.005.000
  kaynaklar:
  - mevzuat: TMS 28 İştiraklerdeki ve İş Ortaklıklarındaki Yatırımlar
    madde: par. 10
    alinti: Özkaynak yöntemine göre, iştirak veya iş ortaklığı yatırımı başlangıçta elde etme maliyeti ile muhasebeleştirilir.
      Edinme tarihinden sonra ise, yatırımcının yatırım yapılan işletmenin kâr veya zararındaki payı yatırımın defter
      değeri artırılarak ya da azaltılarak finansal tablolara yansıtılır. … Yatırım yapılan bir iştirakten alınan
      dağıtımlar (kâr payı vb.) yatırımın defter değerini azaltır.
  - mevzuat: TMS 28 İştiraklerdeki ve İş Ortaklıklarındaki Yatırımlar
    madde: par. 32(a)
    alinti: Bir iştirak veya iş ortaklığı ile ilgili şerefiye iştirak yatırımının defter değerine dahil edilir.
      Bununla birlikte, söz konusu şerefiyeden amortisman ayrılmasına izin verilmez.
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'maliyet = 900000

      pay = 0.30

      sonuc = round(maliyet + pay*400000 - pay*100000 + pay*50000)'
  durum: kontrolde
