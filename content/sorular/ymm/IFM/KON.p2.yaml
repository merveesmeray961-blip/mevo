- id: YMM-IFM-KON-0016
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: kontrol gücü olmayan paylar
  tip: uygulama
  zorluk: 2
  kok: Gök AŞ, kontrolüne sahip olduğu Yıldız AŞ'deki payını 1.7.2026'da %70'ten %80'e çıkarmış ve ek %10 pay için
    620.000 TL nakit ödemiştir. Bu tarihte konsolide finansal tablolarda Yıldız AŞ'ye ait kontrol gücü olmayan payların
    (%30) defter değeri 1.500.000 TL'dir. Bu işlemin Gök AŞ'nin konsolide finansal tablolarına etkisi aşağıdakilerden
    hangisidir?
  secenekler:
    A: Ana ortaklık özkaynağı 120.000 TL azalır; kâr veya zarar etkilenmez
    B: Kâr veya zararda 120.000 TL kayıp muhasebeleştirilir
    C: Şerefiye 120.000 TL artırılır; özkaynak etkilenmez
    D: Kontrol gücü olmayan paylar 620.000 TL azaltılır; başka fark doğmaz
    E: Önceki %70 pay yeniden ölçülür; fark kâr veya zarara alınır
  dogru: A
  aciklama:
    dogru_neden: 'Kontrol kaybı olmadan sahiplik payındaki değişiklik özkaynak işlemidir (TFRS 10 par. 23). B96''ya
      göre kontrol gücü olmayan paylar, göreceli paydaki değişimi yansıtacak biçimde düzeltilir: 1.500.000 × 10/30
      = 500.000 TL azaltılır. Ödenen 620.000 TL ile bu tutar arasındaki 120.000 TL fark doğrudan özkaynakta ana
      ortaklığa atfedilir; şerefiye ve kâr veya zarar etkilenmez.'
    celdiriciler:
      B: Fark kâr veya zarara alınmaz; ortaklarla ortak sıfatıyla yapılan işlem olduğundan doğrudan özkaynakta muhasebeleştirilir.
      C: Şerefiye yalnız kontrolün elde edildiği tarihte ölçülür; kontrol sonrası ek pay alımı yeni şerefiye doğurmaz.
      D: Kontrol gücü olmayan paylar ödenen bedel kadar değil, devredilen payın defter değeri (500.000 TL) kadar
        azaltılır.
      E: Önceki payın yeniden ölçülmesi aşamalı birleşmeye (kontrolün ilk elde edilmesine) özgüdür (TFRS 3 par.
        42); burada kontrol zaten vardır.
    hesap_adimlari:
    - 'KGOP azalışı: 1.500.000 × (10 / 30) = 500.000'
    - 'Fark: 620.000 − 500.000 = 120.000 (ana ortaklık özkaynağından düşülür)'
  kaynaklar:
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: par. 23
    alinti: Ana ortaklığın bir bağlı ortaklığındaki sahiplik payında, bağlı ortaklık üzerindeki kontrolün kaybına
      neden olmayacak şekilde meydana gelen değişiklikler, özkaynak işlemleridir (başka bir ifadeyle ortaklarla
      ortak olmaları sebebiyle yapılan işlemlerdir).
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B96
    alinti: Kontrol gücü olmayan payların düzeltildiği tutar ile ödenen ya da alınan bedelin gerçeğe uygun değeri
      arasındaki fark, doğrudan özkaynakta muhasebeleştirilir ve ana ortaklık hissedarlarına dağıtılır.
