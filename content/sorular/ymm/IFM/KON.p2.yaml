- id: YMM-IFM-KON-0020
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: grup içi işlemlerin elimine edilmesi
  tip: hesaplama
  zorluk: 3
  kok: Ana AŞ, 1.1.2026'da Yan AŞ'nin %75'ini satın almıştır. Edinim tarihinde Yan AŞ'nin bir makinesinin gerçeğe
    uygun değeri defter değerinden 200.000 TL fazladır; makinenin kalan faydalı ömrü 5 yıldır (doğrusal amortisman).
    Yan AŞ'nin kendi tablolarına göre 2026 net kârı 800.000 TL'dir. Yan AŞ 2026'da Ana AŞ'ye maliyeti 450.000 TL
    olan malları 600.000 TL'ye satmış; bu malların %60'ı 31.12.2026'da Ana AŞ'nin stoklarındadır. Vergi etkileri
    dikkate alınmayacaktır. Konsolide kâr veya zarardan kontrol gücü olmayan paylara düşen tutar kaç TL'dir?
  secenekler:
    A: '152.500'
    B: '167.500'
    C: '177.500'
    D: '190.000'
    E: '200.000'
  dogru: B
  aciklama:
    dogru_neden: 'Yan AŞ''nin kârı konsolidasyon için düzeltilir: (1) B88''e göre amortisman, edinim tarihindeki
      gerçeğe uygun değere dayanır: 200.000 / 5 = 40.000 TL ek amortisman. (2) B86(c)''ye göre stokta kalan grup
      içi kâr tamamen elimine edilir: (600.000 − 450.000) × %60 = 90.000 TL. Satış yukarı yönlü (bağlı ortaklıktan
      ana ortaklığa) olduğundan eliminasyon satıcı Yan AŞ''nin kârından yapılır ve kontrol gücü olmayan paylar da
      payına düşeni üstlenir. Düzeltilmiş kâr: 800.000 − 40.000 − 90.000 = 670.000 TL; KGOP payı %25 × 670.000 =
      167.500 TL. Püf noktaları: Elimine edilecek tutar satış kârının tamamı değil, stokta kalan kısmıdır; yukarı
      yönlü satışta eliminasyon kontrol gücü olmayan payın hesabını da etkiler.'
    celdiriciler:
      A: 'Gerçekleşmemiş kârı stokta kalan kısımla sınırlamayıp kârın tamamını (150.000) elimine etmek: %25 × 610.000.'
      C: 'Gerçeğe uygun değer farkının ek amortismanını (40.000) hesaba katmamak: %25 × 710.000.'
      D: 'Grup içi kârı elimine etmemek: %25 × 760.000.'
      E: 'Hiçbir konsolidasyon düzeltmesi yapmadan Yan AŞ''nin kendi kârı üzerinden hesaplamak: %25 × 800.000.'
    hesap_adimlari:
    - 'Ek amortisman: 200.000 / 5 = 40.000'
    - 'Stokta kalan kâr: 150.000 × 0,60 = 90.000'
    - 'Düzeltilmiş kâr: 800.000 − 40.000 − 90.000 = 670.000'
    - 'KGOP payı: 0,25 × 670.000 = 167.500'
  kaynaklar:
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B88
    alinti: Örneğin, bağlı ortaklığın edinildiği tarihten sonra konsolide kapsamlı gelir tablosuna yansıtılan amortisman
      giderleri, ilgili amortismana tabi varlıkların, bağlı ortaklığın edinildiği tarihte konsolide finansal tablolara
      yansıtılmış gerçeğe uygun değerlerine dayanmalıdır.
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B86(c)
    alinti: stoklar ve duran varlıklar gibi varlıklarda muhasebeleştirilen grup içi işlemler sebebiyle oluşan kâr
      veya zararlar tamamen elimine edilir
  gecerlilik: *id001
  dogrulama:
    python: 'kar = 800000

      ek_amort = 200000 / 5

      gerceklesmemis = (600000 - 450000) * 0.60

      sonuc = round(0.25 * (kar - ek_amort - gerceklesmemis))'
