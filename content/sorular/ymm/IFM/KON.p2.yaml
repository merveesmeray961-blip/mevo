- id: YMM-IFM-KON-0019
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 10 kontrol ve konsolide tablolar
  tip: hesaplama
  zorluk: 3
  kok: 'Ana AŞ, yurt dışında faaliyet gösteren Bağlı AŞ''nin %80''ine sahiptir. Ana AŞ, 31.12.2026''da Bağlı AŞ
    paylarının %50''sini 2.400.000 TL''ye satmış ve kontrolü kaybetmiştir; elinde kalan %30 payın bu tarihteki gerçeğe
    uygun değeri 1.350.000 TL''dir. Satış tarihinde konsolide finansal tablolarda:

    - Bağlı AŞ''nin net varlıklarının defter değeri (şerefiye hariç) 3.000.000 TL,

    - Bağlı AŞ''ye ilişkin şerefiye 500.000 TL,

    - Kontrol gücü olmayan payların defter değeri 600.000 TL,

    - Bağlı AŞ''nin çevriminden doğan ve ana ortaklığa isabet eden, diğer kapsamlı gelirde birikmiş kur farkı 100.000
    TL (kazanç) olarak yer almaktadır.

    Vergi etkileri dikkate alınmayacaktır. Ana AŞ''nin konsolide kâr veya zararına yansıyacak toplam kazanç kaç
    TL''dir?'
  secenekler:
    A: '350.000'
    B: '650.000'
    C: '750.000'
    D: '850.000'
    E: '950.000'
  dogru: E
  aciklama:
    dogru_neden: 'TFRS 10 B98: Bağlı ortaklığın varlık ve borçları (şerefiye dâhil, 3.500.000) ile kontrol gücü
      olmayan paylar (600.000) finansal durum tablosu dışı bırakılır; alınan bedel (2.400.000) ve elde kalan payın
      gerçeğe uygun değeri (1.350.000) muhasebeleştirilir. Fark: 2.400.000 + 1.350.000 + 600.000 − 3.500.000 = 850.000
      TL. B99 ve TMS 21 par. 48''e göre diğer kapsamlı gelirde birikmiş 100.000 TL kur farkı da kâr veya zarara
      yeniden sınıflandırılır: toplam 950.000 TL. Püf noktaları: Kontrol gücü olmayan paylar ''çıkan'' tarafta değil,
      tablo dışı bırakılırken kazancı artıran tarafta yer alır; elde kalan pay gerçeğe uygun değerle hesaba girer;
      DKG''deki kur farkı unutulmamalıdır.'
    celdiriciler:
      A: 'Kontrol gücü olmayan payları tablo dışı bırakmayı unutmak: 2.400.000 + 1.350.000 − 3.500.000 + 100.000.'
      B: Elde kalan payı gerçeğe uygun değer yerine net varlıklardaki oransal defter değeriyle (%30 × 3.500.000
        = 1.050.000) almak.
      C: Birikmiş kur farkı kazancını kâr veya zarara aktarmak yerine kazançtan düşmek (850.000 − 100.000).
      D: Diğer kapsamlı gelirde birikmiş kur farkının yeniden sınıflandırılmasını atlamak.
    hesap_adimlari:
    - 'Çıkan: 3.000.000 + 500.000 = 3.500.000'
    - 'Giren/tablo dışı KGOP: 2.400.000 + 1.350.000 + 600.000 = 4.350.000'
    - 'Fark: 4.350.000 − 3.500.000 = 850.000'
    - 'Yeniden sınıflandırma: +100.000 → 950.000'
  kaynaklar:
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B98
    alinti: Eski bağlı ortaklıkta devam eden her türlü yatırım, kontrolün kaybedildiği tarihteki gerçeğe uygun değerleri
      üzerinden.
  - mevzuat: TFRS 10 Konsolide Finansal Tablolar
    madde: Ek B, par. B99
    alinti: Bu nedenle, daha önce diğer kapsamlı gelirde muhasebeleştirilmiş bir kazanç veya kayıp, ilgili varlık
      ya da borçların elden çıkarılması durumunda kâr veya zarar olarak yeniden sınıflandırılacaksa, ana ortaklık,
      bağlı ortaklık üzerindeki kontrolünü kaybettiğinde de söz konusu kazanç veya kaybı özkaynaktan kâr veya zarara
      aktararak yeniden sınıflandırır
