      Püf noktaları: Danışmanlık ücretleri ne şerefiyeye eklenir ne de bedelden düşülür; dönemin gideridir.'
    celdiriciler:
      B: Danışmanlık ücreti şerefiyeye eklenmez; gider yazılır.
      C: 80.000 TL şerefiyenin parçası değildir.
      D: Transfer edilen bedel danışmanlık ücretiyle azaltılmaz.
      E: 5.000.000 > 4.200.000 olduğundan şerefiye pozitiftir; pazarlıklı satın alım yok.
