    dogru_neden: 'Kâr payı: 800.000 × 0,25 = 200.000 TL artış. Temettü: 240.000 × 0,25 = 60.000 TL azalış. OKG payı:
      200.000 × 0,25 = 50.000 TL artış (iştirakin OKG''si). Net değişim: 200.000 − 60.000 + 50.000 = 190.000 TL.
      Ancak OKG etkisi özkaynakta ayrı gösterilir; defter değeri kavramına dahil olmayabilir. Yalnızca kâr/zarar
      etkisi: 200.000 − 60.000 = 140.000 TL net artış. Soru genel ''değişim'' soruyorsa OKG dahil = 190.000; kâr/zarar
      etkisi = 140.000. A = 140.000 TL = kâr/zarar etkisi.'
