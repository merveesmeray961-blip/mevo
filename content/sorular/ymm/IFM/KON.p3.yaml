  tip: hesaplama
  zorluk: 3
  kok: 'Ana AŞ, %60 pay sahibi olduğu Bağlı AŞ''ye 2026 yılında bir makineyi 1.200.000 TL''ye satmıştır. Makinenin
    Ana AŞ kayıtlarındaki net defter değeri 800.000 TL''dir ve kalan ekonomik ömrü 4 yıldır. Konsolidasyonda grup
    içi kârın elimine edilmesinden sonra 2026 yılında konsolide amortisman giderinin toplam etki bakımından ne kadar
    azaltılacağı (veya artacağı) aşağıdakilerden hangisidir? (Tam yıl üzerinden hesaplayınız; satış yıl başında
    gerçekleşmiştir.)

    '
  secenekler:
    A: 50.000 TL azalır
    B: 100.000 TL azalır
    C: 200.000 TL azalır
    D: 300.000 TL azalır
    E: 400.000 TL azalır
  dogru: B
  aciklama:
    dogru_neden: 'Grup içi kâr = 1.200.000 − 800.000 = 400.000 TL. Varlık, konsolide tablolarda 800.000 TL (orijinal
      defter değeri) üzerinden raporlanır. Bağlı AŞ''nin kaydettiği amortisman: 1.200.000 / 4 = 300.000 TL. Gerçek
      konsolide amortisman: 800.000 / 4 = 200.000 TL. Düzeltme: 300.000 − 200.000 = 100.000 TL azalış. Püf noktaları:
      Grup içi kâr elimine edildikten sonra düşük maliyet üzerinden hesaplanan amortisman daha düşük olur; konsolide
      amortisman gideri azalır.'
    celdiriciler:
      A: Yanlış hesap adımı uygulanmıştır.
      C: Tüm düzeltilmiş varlık değeri üzerinden hesaplanmıştır; kâr kısmı değil.
      D: Grup içi kâr tamamı amortisman etkisine eşitlenmiştir.
      E: Tüm satış bedelinin amortismanı yanlışlıkla kullanılmıştır.
    hesap_adimlari:
    - 'Grup içi kâr: 1.200.000 − 800.000 = 400.000 TL'
    - 'Bağlı AŞ amortismanı: 1.200.000 / 4 = 300.000 TL'
    - 'Konsolide gerçek amortisman: 800.000 / 4 = 200.000 TL'
    - 'Düzeltme (azalış): 300.000 − 200.000 = 100.000 TL'
