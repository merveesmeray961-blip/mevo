    AŞ''ye 400.000 TL maliyet bedelli ticari mal 520.000 TL''ye satmıştır. Dönem sonunda bu malların %50''si Rıhtım
    AŞ''nin stoğunda kalmaktadır. TMS 28''e göre Liman AŞ''nin bireysel finansal tablolarında iştiraki değerinde
