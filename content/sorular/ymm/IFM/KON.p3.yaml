      B: Hatalı hesap tutarından kaynaklanmaktadır.
      C: Transfer edilen bedel ile net varlıklar arasındaki fark alınmış (3.600.000 − 5.000.000 × 0,60 = 600.000);
        kontrol sorusu farklı hesap yapısı seçmiş.
      D: Yanlış oran uygulanmıştır.
      E: KGOP tutarı şerefiye olarak alınmıştır.
