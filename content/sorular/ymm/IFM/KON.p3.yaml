- id: YMM-IFM-KON-0021
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 10 kontrol ve konsolide tablolar
  tip: kavrama
  zorluk: 3
  kok: 'Portföy AŞ''nin Hedef AŞ üzerindeki oy haklarının %45''ini elinde bulundurduğu ve sözleşmeye dayalı bir
    düzenleme olmadığı bilinmektedir. Diğer pay sahipleri geniş bir tabana yayılmış olup Portföy AŞ''nin tarihsel
    oy kullanma verilerine göre fiili toplantı katılım oranı %60''ın altında kalmaktadır. Portföy AŞ ayrıca Hedef
    AŞ''nin yönetim kurulu üyelerinin çoğunluğunu atayabilmektedir.

    TFRS 10''a göre Portföy AŞ''nin Hedef AŞ üzerindeki güç değerlendirmesi bakımından aşağıdakilerden hangisi doğrudur?

    '
  secenekler:
    A: '%45 oy hakkı yasal çoğunluk eşiğinin altında kaldığından Portföy AŞ kontrole sahip olamaz.'
    B: Fiili katılım oranı gözetildiğinde %45 oy hakkı fiilî çoğunluğu sağlayabilir; yönetim kurulu atama hakkıyla
      birlikte güç mevcuttur.
    C: TFRS 10'a göre kontrol yalnızca %50'nin üzerinde oy hakkı ile kurulabileceğinden güç yoktur.
    D: Yönetim kurulu atama hakkı tek başına TFRS 10 kapsamında güç sayılmaz; oy hakkının %50'yi aşması şarttır.
    E: Diğer pay sahiplerinin geniş tabana yayılması kontrolü engeller; güç değerlendirmesinde bu durum belirleyicidir.
  dogru: B
  aciklama:
    dogru_neden: 'TFRS 10 par. 22''ye göre bir yatırımcı, diğer oy haklarının dağılık yapısına bakıldığında fiilî
      çoğunluğu sağlayabilecek yeterli büyüklükte oy hakkına sahipse kontrole sahip olabilir. Tarihsel katılım %60''ın
      altında olduğundan %45''lik pay fiilî çoğunluk sağlar. Yönetim kurulu atama hakkı da bu değerlendirmeyi destekler.
      Püf noktaları: TFRS 10 kontrolü yasal %50 eşiğine bağlamaz; fiilî katılım oranı ve yönetim kurulu atama yetkisi
      birlikte değerlendirilir.'
    celdiriciler:
      A: TFRS 10, yasal çoğunluk yerine fiilî çoğunluk kavramını esas alır; %45 bu koşulda yeterli olabilir.
      C: TFRS 10 kontrolü salt oy hakkının %50'sini aşması koşuluna bağlamaz.
      D: Yönetim kurulu atama yetkisi güç göstergelerinden biridir ve değerlendirmede dikkate alınır.
      E: Diğer pay sahiplerinin dağınık yapısı fiilî çoğunluğu kolaylaştırır; kontrolü engellemez.
  kaynaklar:
