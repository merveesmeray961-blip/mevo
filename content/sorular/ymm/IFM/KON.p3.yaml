  kok: 'Elma AŞ, 1.1.2026 tarihinde Armut AŞ''nin %60''ını 3.600.000 TL nakit karşılığında satın alarak kontrolü
    elde etmiştir. Edinim tarihinde Armut AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 5.000.000
    TL''dir. KGOP orantılı pay yöntemiyle ölçülmüştür. Edinim günü konsolidasyonda yapılacak kaydın şerefiye tutarı
    kaç TL''dir?

    '
