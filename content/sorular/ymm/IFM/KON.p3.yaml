    B: Şerefiye 880.000 TL borç; 80.000 TL danışmanlık ücreti şerefiyeye eklenir.
    C: Şerefiye 800.000 TL borç; 80.000 TL nakit ödeme şerefiyenin bir parçasıdır.
    D: Şerefiye 720.000 TL borç; transfer edilen bedel 80.000 TL azaltılarak hesaplanmıştır.
    E: Şerefiye 800.000 TL alacak; pazarlıklı satın alım kazancı doğmuştur.
