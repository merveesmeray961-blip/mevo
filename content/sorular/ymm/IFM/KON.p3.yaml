    TL kâr açıklamış ve 240.000 TL temettü ödemiştir. Aynı yıl Kaynak AŞ''nin yeniden değerleme fazlası (diğer kapsamlı
    gelir) 200.000 TL artmıştır. Pınar AŞ''nin iştiraki defter değerinde 2026 yılında toplam değişim kaç TL''dir?

    '
