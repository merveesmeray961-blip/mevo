    - 'KGOP: 5.000.000 × 0,40 = 2.000.000 TL'
    - 'Toplam: 3.600.000 + 2.000.000 = 5.600.000 TL'
    - 'Şerefiye: 5.600.000 − 5.000.000 = 600.000 TL'
