    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'II doğru: TFRS 10 par. B94 uyarınca KGOP''a atfedilen kâr veya zarar konsolide gelir tablosunda
      ayrı gösterilir. III doğru: TFRS 10 par. 23 uyarınca kontrol kaybedilmeksizin yapılan ek pay alımları özkaynak
      işlemidir. I yanlıştır: TFRS 3 par. 19, her birleşme için gerçeğe uygun değer ya da tanımlanabilir net varlıklardaki
      orantılı pay seçeneğini sunar. Püf noktaları: Ölçüm seçeneği birleşme bazında uygulanır; her birleşme için
      aynı yöntem zorunlu değildir.'
    celdiriciler:
      A: I yanlış olduğundan A seçilemez.
      B: III de doğru olduğundan yalnız II yeterli değildir.
      C: I yanlış olduğundan C seçilemez.
