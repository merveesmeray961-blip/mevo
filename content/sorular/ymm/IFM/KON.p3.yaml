- id: YMM-IFM-KON-0022
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 3 satın alma yöntemi ve şerefiye
  tip: uygulama
  zorluk: 3
  kok: 'TFRS 3 kapsamında bir işletme birleşmesinde edinim muhasebesi ile ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?

    '
  secenekler:
    A: Edinen işletme, edinilen işletmenin tanımlanabilir varlık ve yükümlülüklerini birleşme tarihindeki gerçeğe
      uygun değerleriyle ölçer.
    B: Koşullu bedel, birleşme tarihindeki gerçeğe uygun değeriyle transfer edilen bedelin bir parçası olarak muhasebeleştirilir.
    C: Tanımlanabilir net varlıkların gerçeğe uygun değerinin transfer edilen bedeli aşması hâlinde şerefiye doğar.
    D: Edinimle ilgili maliyetler (danışmanlık, yasal ücretler) gider olarak muhasebeleştirilir.
    E: Şerefiye ilk muhasebeleştirmeden sonra itfa edilmez; yıllık değer düşüklüğü testine tabi tutulur.
  dogru: C
  aciklama:
    dogru_neden: 'TFRS 3 par. 32''ye göre şerefiye, transfer edilen bedelin tanımlanabilir net varlıkların gerçeğe
      uygun değerini AŞMASI durumunda ortaya çıkar. Tanımlanabilir net varlıklar transfer edilen bedeli aştığında
      ise pazarlıklı satın alım kazancı (negatif şerefiye) doğar ve kâr veya zararda muhasebeleştirilir. C şıkkı
      bu ilişkiyi tersine çevirdiğinden yanlıştır. Püf noktaları: Şerefiye = bedel − net varlıklar; eğer negatifse
      kazanç yazılır.'
    celdiriciler:
      A: TFRS 3 par. 18 uyarınca gerçeğe uygun değerle ölçüm doğrudur.
      B: TFRS 3 par. 39 uyarınca koşullu bedelin gerçeğe uygun değeri transfer edilen bedele dahil edilir; doğrudur.
      D: TFRS 3 par. 53 uyarınca edinimle ilgili maliyetler gider yazılır; doğrudur.
      E: TFRS 3 par. 54 ve TMS 36 uyarınca şerefiye itfa edilmez, değer düşüklüğüne tabi tutulur; doğrudur.
