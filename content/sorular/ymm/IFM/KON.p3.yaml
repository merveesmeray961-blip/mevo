      edilir: 60.000 × %35 = 21.000 TL iştirak değerinden düşülür. Püf noktaları: Tüm gerçekleşmemiş kâr değil yalnız
      yatırımcı payına düşen kısım (pay oranıyla çarpılır) elimine edilir.'
