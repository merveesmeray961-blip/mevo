      B: Yalnızca OKG payı alınmıştır.
      C: Temettü payı kâr payından düşülmemiştir.
      D: Yanlış oran uygulanmıştır.
      E: OKG dahil hesap yapılmış; yanlış oran.
    hesap_adimlari:
    - 'Kâr payı: 800.000 × 0,25 = 200.000 TL'
    - 'Temettü: 240.000 × 0,25 = 60.000 TL'
    - 'Net kâr/zarar etkisi: 200.000 − 60.000 = 140.000 TL artış'
