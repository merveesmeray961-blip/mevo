- id: YMM-IFM-KON-0024
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Konsolidasyon ve işletme birleşmeleri
  konu: KON
  kazanim: TFRS 10 kontrol ve konsolide tablolar
  tip: uygulama
  zorluk: 3
  kok: 'Zirve AŞ, 1.7.2026 tarihinde Vadi AŞ''nin %60''ını 3.000.000 TL nakit karşılığında satın alarak kontrolü
    elde etmiştir. Edinim tarihinde Vadi AŞ''nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 4.000.000
    TL''dir. KGOP gerçeğe uygun değer yöntemiyle ölçülmüş olup KGOP''un gerçeğe uygun değeri 1.800.000 TL''dir.
    Buna göre edinim günü Zirve AŞ''nin konsolide kayıtlarında şerefiye tutarı kaç TL''dir?

    '
  secenekler:
    A: '200.000'
    B: '600.000'
    C: '800.000'
    D: 1.000.000
    E: 1.400.000
  dogru: C
  aciklama:
    dogru_neden: 'Tam şerefiye yöntemi: Transfer edilen bedel 3.000.000 + KGOP gerçeğe uygun değeri 1.800.000 =
      4.800.000 TL. Net tanımlanabilir varlıklar 4.000.000 TL. Şerefiye = 4.800.000 − 4.000.000 = 800.000 TL. Püf
      noktaları: Tam şerefiye yönteminde KGOP gerçeğe uygun değeri bedele eklenir; orantılı pay yönteminde ise şerefiye
      3.000.000 − (4.000.000×0,60) = 600.000 TL olurdu.'
    celdiriciler:
      A: Hatalı ara işlem sonucudur.
      B: Orantılı pay yöntemi kullanılmış; KGOP gerçeğe uygun değeri dikkate alınmamıştır.
      D: Yanlış toplam tutardan hareket edilmiştir.
      E: Tanımlanabilir varlıklar yanlış kullanılmıştır.
    hesap_adimlari:
    - 'Transfer edilen bedel: 3.000.000 TL'
    - 'KGOP gerçeğe uygun değeri: 1.800.000 TL'
    - 'Toplam: 4.800.000 TL'
    - 'Tanımlanabilir net varlıklar: 4.000.000 TL'
    - 'Şerefiye: 4.800.000 − 4.000.000 = 800.000 TL'
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 32, 19
  gecerlilik:
    baslangic: '2007-07-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bedel = 3000000

      kgop_gud = 1800000

      net_varlik = 4000000

      serefiye = (bedel + kgop_gud) - net_varlik

      sonuc = serefiye

      '
