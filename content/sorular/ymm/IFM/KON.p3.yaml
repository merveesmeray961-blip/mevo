      D: Tüm kâr (120.000) pay oranıyla çarpılmıştır; stoktaki kısım dikkate alınmamıştır.
      E: Stoktaki gerçekleşmemiş kâr doğru (60.000) ama pay oranıyla çarpılmamıştır.
