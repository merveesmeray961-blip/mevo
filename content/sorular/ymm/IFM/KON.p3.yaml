    dogru_neden: 'Orantılı pay yönteminde: KGOP = 5.000.000 × %40 = 2.000.000. Şerefiye = (Transfer edilen bedel
      + KGOP) − Net varlıklar = (3.600.000 + 2.000.000) − 5.000.000 = 5.600.000 − 5.000.000 = 600.000 TL.'
