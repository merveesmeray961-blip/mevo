  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: VUK md.280 değerleme
  tip: uygulama
  zorluk: 3
  kok: 'Tam mükellef Ufuk Yatırım AŞ 15.3.2025''te ticaret siciline tescil edilmiş ve 2025''te işe başlamıştır.
    Yurt dışından getirdiği 2.000.000 Avroyu 2025''te sermaye olarak koymuş; 20.5.2025''te yatırım teşvik belgesi
    için başvurmuş ve belgeyi 2026''da almıştır. VUK md. 280/A''ya göre aşağıdaki ifadelerden hangileri doğrudur?

    I. Avroların 2025-2026 döneminde teşvik belgesi kapsamında sarf edilen kısmı nedeniyle oluşan kur farkları pasifte
    özel bir fon hesabına alınabilir.

    II. 31.12.2026''ya kadar hiç sarf edilmeyen kısım, 2025 ve 2026 hesap dönemlerine ait vergilendirme dönemlerinin
    sonuna kadar mukayyet değeriyle izlenir; 2026 hesap dönemi sonu itibarıyla md. 280''e göre değerlenir.

    III. Fon hesabının sermayeye ilave edilmesi halinde fon tutarı, ilave edildiği dönemin kazancıyla ilişkilendirilmeksizin
    vergiye tabi tutulur.

    IV. Şirketin KVK''ya göre yapılan devir ve bölünme dışında tasfiyesi halinde fon hesabındaki tutar vergiye tabi
    tutulur.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: I, II ve IV
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Şartlar sağlanmıştır: şirket 27.3.2018''den sonra tescil edilmiş, başvuru tescili izleyen üçüncü
      ayın sonundan (30.6.2025) önce yapılmış ve belge işe başlanılan dönemi takip eden dönem (2026) sonuna kadar
      alınmıştır. I doğrudur (280/A-1). II doğrudur (280/A-2): sarf edilmeyen kısım bu dönemlerin vergilendirme
      dönemleri sonuna kadar mukayyet değeriyle, takip eden hesap dönemi sonu itibarıyla md. 280''e göre değerlenir.
      III yanlıştır: fon hesabının sermayeye ilavesi vergilemeyi doğuran hallerin dışında tutulmuştur. IV doğrudur:
      KVK''ya göre devir ve bölünme hariç tasfiye halinde de vergileme hükmü uygulanır. Püf noktaları: Fon hesabında
      sermayeye ilave, enflasyon farklarında olduğu gibi vergileme dışıdır; tasfiyede ise yalnız devir ve bölünme
      istisnadır.'
    celdiriciler:
      A: II ve IV de kanun metniyle uyumludur; eksik seçimdir.
      B: Tasfiye halindeki vergileme hükmü (IV) gözden kaçırılmıştır.
      C: 'III yanlıştır: sermayeye ilave, fon hesabının vergilendirildiği haller arasında değildir.'
      E: I doğrudur ve dışarıda bırakılmıştır; III ise yanlıştır.
