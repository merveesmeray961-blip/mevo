- id: YMM-IFM-KUR-0010
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: TMS 21 işlevsel para birimi
  tip: uygulama
  zorluk: 2
  kok: İngiltere'deki bir şirketin Türkiye'de kurulu bağlı ortaklığı Delta AŞ, ürettiği tekstil ürünlerinin tamamını
    Avro Bölgesi'ne satmaktadır; satış fiyatları Avro Bölgesi'ndeki rekabet koşullarına göre Avro olarak belirlenmektedir.
    Hammadde ve işçilik dahil maliyetlerinin büyük bölümü Avro cinsindendir ve Avro ödenmektedir. Delta AŞ'nin banka
    kredileri ABD doları cinsindendir; yasal defterleri TL tutulmaktadır. TMS 21'e göre Delta AŞ'nin geçerli (işlevsel)
    para birimi aşağıdakilerden hangisidir?
  secenekler:
    A: Avro, çünkü satış fiyatları ve maliyetler Avro'dadır
    B: TL, çünkü şirket Türkiye'de kurulu ve faaliyettedir
    C: ABD doları, çünkü kredi finansmanı bu para birimindedir
    D: TL, çünkü yasal defterler TL olarak tutulmaktadır
    E: Sterlin, çünkü ana ortaklığın para birimi Sterlindir
  dogru: A
  aciklama:
    dogru_neden: 'TMS 21 par. 9: Geçerli para birimi, satış fiyatlarını en çok etkileyen para birimi ile rekabet
      ve düzenlemeleriyle satış fiyatlarını en çok etkileyen ülkenin para birimidir; ayrıca işçilik, hammadde ve
      diğer maliyetleri en çok etkileyen para birimidir. Olayda her iki birincil gösterge Avro''yu işaret eder.
      Finansman para birimi (par. 10) yalnız destekleyici kanıttır ve birincil göstergelere üstün gelmez.'
    celdiriciler:
      B: Kuruluş ülkesi geçerli para biriminin belirlenmesinde bir gösterge değildir; temel ekonomik çevre esastır.
      C: Finansman faaliyetlerinin para birimi par. 10'da ikincil kanıttır; satış ve maliyetler Avro'yu gösterirken
        belirleyici olamaz.
      D: Yasal defterlerin tutulduğu para birimi, geçerli para birimini belirlemez; TMS 21 ekonomik çevreye bakar.
      E: Ana ortaklığın para birimi, bağlı ortaklığın kendi ekonomik çevresini yansıtmaz; Delta AŞ'nin satış ve
        maliyetleri Sterline bağlı değildir.
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 9
    alinti: Mal ve hizmetlerin satış fiyatlarını en çok etkileyen para birimidir (mal ve hizmetlerin satış fiyatlarının
      çoğunlukla bağlı olduğu ve gerçekleştiği para birimidir) ve (ii) Rekabet unsurları ve yasal düzenlemeleriyle
      mal ve hizmetlerin satış fiyatlarını en çok etkileyen ülkenin para birimidir. (b) Mal ve hizmetlere ilişkin
      işçilik, ham madde ve diğer maliyetleri en çok etkileyen para birimidir
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 10(a)
    alinti: Finansman faaliyetlerinden (borçlanma aracı ya da özkaynağa dayalı finansal araçlar gibi) yaratılan
      fonların para birimi.
