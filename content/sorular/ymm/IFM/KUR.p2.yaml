- id: YMM-IFM-KUR-0009
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: parasal kalemlerin değerlemesi
  tip: uygulama
  zorluk: 2
  kok: Geçerli para birimi TL olan Kartal AŞ, 1.11.2026'da 20.000 ABD doları tutarında vadeli ihracat yapmıştır
    (kur 41,00). 31.12.2026 kapanış kuru 42,50'dir. Alacak 15.2.2027'de tahsil edilmiştir (kur 42,00). TMS 21'e
    göre bu alacaktan doğan kur farklarının 2026 ve 2027 yıllarına etkisi aşağıdakilerden hangisidir?
  secenekler:
    A: '2026: kur farkı yok; 2027: 20.000 TL kur farkı geliri'
    B: '2026: 30.000 TL gelir (DKG''de); 2027: 10.000 TL gider'
    C: '2026: 30.000 TL kur farkı geliri; 2027: kur farkı yok'
    D: '2026: 30.000 TL kur farkı geliri; 2027: 10.000 TL kur farkı gideri'
    E: '2026: 30.000 TL kur farkı geliri; 2027: 20.000 TL kur farkı geliri'
  dogru: D
  aciklama:
    dogru_neden: 'Alacak parasal kalemdir; dönem sonunda kapanış kurundan çevrilir (par. 23(a)): 20.000 × (42,50
      − 41,00) = 30.000 TL kur farkı geliri 2026 kâr veya zararına yansır (par. 28). İşlem izleyen dönemde kapandığından
      2027''de yalnız o dönemdeki kur değişimi muhasebeleştirilir (par. 29): 20.000 × (42,00 − 42,50) = −10.000
      TL kur farkı gideri. Toplam etki 20.000 TL gelirdir ve iki döneme dağılır.'
    celdiriciler:
      A: Dönem sonu değerlemesini atlayıp toplam farkı tahsil döneminde tanımak; parasal kalemler her raporlama
        dönemi sonunda kapanış kurundan çevrilir.
      B: Parasal kalemlerden doğan kur farkları (net yatırım istisnası dışında) kâr veya zararda muhasebeleştirilir,
        DKG'de değil.
      C: 2026 sonunda değerlenen alacağın 2027'de farklı kurdan tahsil edilmesi yeni bir kur farkı doğurur.
      E: 2027 farkını ilk kayıt kurundan (41,00) hesaplamak; 2026'da tanınan 30.000 TL iki kez sayılır.
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 28
    alinti: Parasal kalemlerin ödenmesinden ya da dönem içinde veya önceki finansal tablolarda ilk muhasebeleştirme
      sırasında çevrildiklerinden farklı kurlardan çevrilmelerinden kaynaklanan kur farkları, 32’nci paragrafta
      belirtilenler hariç olmak üzere, oluştukları dönemde kâr veya zararda muhasebeleştirilir.
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 29
    alinti: Ancak, işlem izleyen bir muhasebe döneminde kapanıyorsa, kapanma tarihine kadar her bir dönemde muhasebeleştirilecek
      kur farkları her dönemde döviz kurlarında meydana gelen değişime göre belirlenir.
