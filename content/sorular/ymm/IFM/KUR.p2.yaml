- id: YMM-IFM-KUR-0012
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: yabancı işletmenin çevrimi
  tip: hesaplama
  zorluk: 3
  kok: 'Ana AŞ''nin (sunum para birimi TL) %100 bağlı ortaklığı Euro GmbH''nin geçerli para birimi Avro''dur ve
    yüksek enflasyonlu bir ekonominin para birimi değildir. Euro GmbH''ye ilişkin 2026 verileri:

    - 1.1.2026 net varlıkları: 1.000.000 Avro (kur 40)

    - 2026 net kârı: 200.000 Avro (yıl içinde kurlar önemli ölçüde dalgalanmamıştır; ortalama kur 44)

    - 1.10.2026''da ödenen kâr payı: 100.000 Avro (kur 45)

    - 31.12.2026 kapanış kuru: 46

    Konsolide finansal tablolarda 2026 yılında diğer kapsamlı gelirde muhasebeleştirilecek yabancı para çevrim farkı
    kaç TL''dir?'
  secenekler:
    A: 5.900.000
    B: 6.000.000
    C: 6.300.000
    D: 6.400.000
    E: 10.600.000
  dogru: C
  aciklama:
    dogru_neden: 'Par. 39-41: Varlık ve yükümlülükler kapanış kurundan, gelir ve giderler işlem tarihi kurundan
      (dalgalanma önemli değilse ortalama kur) çevrilir; farklar DKG''de ayrı bir unsur olarak muhasebeleştirilir.
      Kapanış net varlıkları: (1.000.000 + 200.000 − 100.000) × 46 = 50.600.000 TL. Açıklanan kalemler: açılış 40.000.000
      + kâr 200.000 × 44 = 8.800.000 − kâr payı 100.000 × 45 = 4.500.000. Çevrim farkı = 50.600.000 − 40.000.000
      − 8.800.000 + 4.500.000 = 6.300.000 TL. Sağlama: 1.000.000 × 6 + 200.000 × 2 − 100.000 × 1 = 6.300.000. Püf
      noktaları: Dönem başı net varlıklar, kâr ve kâr payının her biri kendi kurundan kapanış kuruna farklı tutarda
      fark doğurur; kâr payı kapanıştan önce çıktığı için farkı azaltır.'
    celdiriciler:
      A: Kârı ortalama kur yerine kapanış kurundan (9.200.000) çevirmek.
      B: Yalnız dönem başı net varlıkların kur farkını (1.000.000 × 6) almak; kâr ve kâr payının etkilerini atlamak.
      D: Kâr payının etkisini atlamak (veya kâr payını kapanış kurundan çevirmek).
      E: Net varlıklardaki TL artışının tamamını (50.600.000 − 40.000.000) çevrim farkı saymak; kâr ve kâr payını
        ayırmamak.
    hesap_adimlari:
    - 'Kapanış net varlık: 1.100.000 × 46 = 50.600.000'
    - Açılış 40.000.000 + kâr 8.800.000 − kâr payı 4.500.000 = 44.300.000
    - 'Çevrim farkı: 50.600.000 − 44.300.000 = 6.300.000'
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 39
    alinti: Sunulan her finansal durum tablosu aktif ve yabancı kaynakları (karşılaştırmalı olanlar dahil olmak
      üzere) bu finansal durum tablosunun düzenlendiği tarihteki kapanış kurundan çevrilir. (b) Gelir ve giderler,
      kâr veya zarar ve diğer kapsamlı gelirin sunulduğu her bir tabloda (karşılaştırmalı tutarlar dâhil) işlem
      tarihinde geçerli olan döviz kurundan çevrilir. (c) Ortaya çıkan tüm kur farkları, diğer kapsamlı gelirin
