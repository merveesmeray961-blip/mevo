- id: YMM-IFM-KUR-0011
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: parasal kalemlerin değerlemesi
  tip: uygulama
  zorluk: 2
  kok: Geçerli para birimi TL olan Atlas AŞ, geçerli para birimi de TL olan ve ana merkezin uzantısı olarak çalışan
    yurt dışı şubesi aracılığıyla 2025'te 200.000 ABD dolarına bir arsa almıştır (kur 30). Atlas AŞ arsalarında
    TMS 16 yeniden değerleme modelini uygulamaktadır. 31.12.2026'da arsanın gerçeğe uygun değeri 250.000 ABD doları,
    kur 40'tır; arsa ilk kez yeniden değerlenmektedir. Vergi etkileri dikkate alınmayacaktır. Bu yeniden değerlemenin
    2026 yılı diğer kapsamlı gelir (DKG) ve kâr veya zarar (K/Z) etkisi aşağıdakilerin hangisinde doğru verilmiştir?
  secenekler:
    A: DKG etkisi yok; K/Z 4.000.000 TL kazanç
    B: DKG 1.500.000 TL; K/Z etkisi yok
    C: DKG 1.500.000 TL; K/Z 2.500.000 TL kur farkı geliri
    D: DKG 2.000.000 TL; K/Z 2.000.000 TL kur farkı geliri
    E: DKG 4.000.000 TL; K/Z etkisi yok
  dogru: E
  aciklama:
    dogru_neden: 'Arsa parasal olmayan kalemdir; gerçeğe uygun değerle ölçüldüğünden bu değerin belirlendiği tarihteki
      kurdan çevrilir (par. 23(c)): 250.000 × 40 = 10.000.000 TL. Önceki defter değeri 200.000 × 30 = 6.000.000
      TL''dir. Yeniden değerleme artışı TMS 16''ya göre DKG''de muhasebeleştirildiğinden, kurdan kaynaklanan kısım
      da DKG''dedir (par. 30-31): toplam 4.000.000 TL DKG; K/Z etkisi yoktur.'
    celdiriciler:
      A: İlk yeniden değerleme artışı TMS 16'ya göre DKG'ye alınır; kur etkisi de kazancın izlediği yolu izler (par.
        30).
      B: Kur etkisini yok sayıp yalnız dolar bazındaki artışı eski kurla (50.000 × 30) çevirmek; GUD, ölçüldüğü
        tarihteki kurla çevrilir.
      C: Kurdan doğan kısmı parasal kalem gibi K/Z'a ayırmak; parasal olmayan kalemde kur etkisi, kazancın muhasebeleştirildiği
        yere gider.
      D: Artışı kapanış kuruyla (50.000 × 40) ve kur etkisini eski tutar üzerinden (200.000 × 10) ayırıp kur etkisini
        K/Z'a almak.
    hesap_adimlari:
    - 'Yeni defter değeri: 250.000 × 40 = 10.000.000'
    - 'Önceki: 200.000 × 30 = 6.000.000'
    - 'Artış: 4.000.000 → tamamı DKG (değer artış fonu)'
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 30
    alinti: Parasal olmayan bir kalemden kaynaklanan kazanç ya da zarar diğer kapsamlı gelirde muhasebeleştirilirse,
      bu kazanç ya da zararın kurdan kaynaklanan kısmı da diğer kapsamlı gelirde muhasebeleştirilir.
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 31
    alinti: Böyle bir aktifin yabancı para cinsinden olması durumunda, bu Standardın 23(c) paragrafı uyarınca, yeniden
      değerlenmiş tutar değerlemenin yapıldığı tarihteki kurdan çevrilir ve oluşan kur farkı diğer kapsamlı gelirde
      muhasebeleştirilir.
