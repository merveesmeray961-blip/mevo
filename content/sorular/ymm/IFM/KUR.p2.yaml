- id: YMM-IFM-KUR-0007
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Kur değişimi ve yabancı para işlemleri
  konu: KUR
  kazanim: parasal kalemlerin değerlemesi
  tip: bilgi
  zorluk: 1
  kok: Geçerli para birimi TL olan bir işletmenin aşağıdaki ABD doları cinsinden kalemlerinden hangisi TMS 21'e
    göre parasal kalem niteliğindedir ve dönem sonunda kapanış kurundan çevrilir?
  secenekler:
    A: Hammadde alımı için tedarikçiye peşin ödenen avans
    B: Yurt dışındaki depo için muhasebeleştirilen kullanım hakkı varlığı
    C: Garanti kapsamında yedek parça teslimiyle yerine getirilecek karşılık
    D: Yurt dışından satın alınan yazılım lisansı (maddi olmayan duran varlık)
    E: Yurt dışındaki bir dava için ayrılan ve nakit ödenecek karşılık
  dogru: E
  aciklama:
    dogru_neden: 'TMS 21 par. 16: Parasal kalemin temel niteliği sabit ya da belirlenebilir tutarda para birimi
      alma hakkı veya ödeme yükümlülüğüdür; nakit olarak ödenecek karşılıklar örnek olarak sayılmıştır. Parasal
      kalemler kapanış kurundan çevrilir (par. 23(a)).'
    celdiriciler:
      A: Mal ve hizmetler için önceden ödenen tutarlar parasal olmayan kalemdir; para değil mal alınacaktır.
      B: Kullanım hakkı varlıkları par. 16'da parasal olmayan kalem olarak sayılmıştır (kira yükümlülüğü ise parasaldır).
      C: Parasal olmayan bir varlığın teslimatıyla sonuçlanacak karşılıklar parasal değildir; 'karşılık' olması
        tek başına parasal yapmaz.
      D: Maddi olmayan duran varlıklar parasal olmayan kalemlerdir; tarihi maliyetle ölçülüyorsa işlem tarihi kurunda
        kalır.
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 16
    alinti: Parasal kalemlere örnek olarak; nakit olarak ödenecek emeklilik tazminatları ve çalışanlara sağlanan
      diğer faydalar, nakit olarak ödenecek karşılıklar, kira yükümlülükleri ve yükümlülük olarak finansal tablolara
      alınan temettüler verilebilir. … Parasal olmayan kalemlere örnek olarak; mal ve hizmetler için önceden ödenen
      tutarlar, şerefiye, maddi olmayan duran varlıklar, stoklar, maddi duran varlıklar, kullanım hakkı varlıkları
      ve parasal olmayan bir varlığın teslimatıyla sonuçlanacak karşılıklar verilebilir.
  gecerlilik: &id001
