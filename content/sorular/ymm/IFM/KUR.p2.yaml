  tip: bilgi
  zorluk: 1
  kok: VUK md. 280'e göre değerleme gününde bir yabancı paranın borsada rayici yoksa, bu yabancı paranın değerlemesinde
    aşağıdakilerden hangisi esas alınır?
  secenekler:
    A: Yabancı paranın alış bedeli
    B: Hazine ve Maliye Bakanlığınca tespit olunan kur
    C: Takdir komisyonunca tespit edilen değer
    D: Değerleme günündeki serbest piyasa döviz satış kuru
    E: İşlem tarihinde kayıtlara alınmış olan tarihî kur
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 280/1-2: Yabancı paralar borsa rayici ile değerlenir; borsada rayici yoksa değerlemeye
      uygulanacak kur Maliye Bakanlığınca (bugün Hazine ve Maliye Bakanlığı) tespit olunur.'
    celdiriciler:
      A: Alış bedeli, borsa rayicinin oluşumunda muvazaa anlaşılması halinde esas alınır; rayicin bulunmaması durumu
        için değil.
      C: Takdir komisyonu md. 298'e göre emsal bedelleri ile alacak ve borçların değerlerini tespit eder; borsada
        rayici olmayan yabancı paranın kuru Bakanlıkça belirlenir.
      D: Kanunda serbest piyasa kuru esas alınmaz.
      E: Kayıtlı kurda bırakmak değerleme yapmamak anlamına gelir; md. 280 değerlemeyi zorunlu kılar.
  kaynaklar:
