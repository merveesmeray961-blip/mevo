        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
