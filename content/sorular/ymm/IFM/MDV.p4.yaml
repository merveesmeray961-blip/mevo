- id: YMM-IFM-MDV-0003
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: yeniden değerleme modeli
  tip: hesaplama
  zorluk: 2
  kok: Binalarına yeniden değerleme modeli uygulayan (C) AŞ, 31.12.2025'te bir binasında yeniden değerleme sonucu oluşan 200.000
    TL azalışı (öncesinde bu bina için yeniden değerleme artışı yoktur) kâr veya zarara gider olarak yazmıştır. 31.12.2026'da
    binanın defter değeri 3.100.000 TL, gerçeğe uygun değeri 3.600.000 TL'dir. Amortisman farkının etkisi ve vergi dikkate
    alınmayacaktır. TMS 16'ya göre 2026 yılında diğer kapsamlı gelirde muhasebeleştirilecek yeniden değerleme artışı kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 200.000 TL
    C: 300.000 TL
    D: 500.000 TL
    E: 700.000 TL
  dogru: C
  aciklama:
    dogru_neden: Artış 3.600.000 − 3.100.000 = 500.000 TL'dir. TMS 16 par. 39'a göre artış, aynı varlığın daha önce kâr veya
      zararla ilişkilendirilen 200.000 TL'lik azalışını tersine çevirdiği ölçüde gelirdir; kalan 300.000 TL diğer kapsamlı
      gelirde muhasebeleştirilir ve özkaynakta birikir.
    celdiriciler:
      A: Önceki azalışı aşan kısım diğer kapsamlı gelirdedir; artışın tamamı gelir yazılmaz.
      B: 200.000 TL kâr veya zarara yazılacak tersine çevirme tutarıdır.
      D: Önceki dönemde gider yazılan azalışı tersine çeviren kısım diğer kapsamlı gelire alınmaz.
      E: Önceki azalış artışa eklenmiştir; mahsup edilmesi gerekir.
    hesap_adimlari:
    - Toplam artış = 3.600.000 − 3.100.000 = 500.000
    - Önceki gider yazılan azalışın iptali (gelir) = 200.000
    - DKG = 500.000 − 200.000 = 300.000
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 39
    alinti: Ancak, bir yeniden değerleme değer artışı, aynı varlığın daha önce kar ya da zarar ile ilişkilendirilmiş bulunan
      yeniden değerleme değer azalışını tersine çevirdiği ölçüde gelir olarak muhasebeleştirilir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'artis = 3600000 - 3100000

      sonuc = artis - 200000'
