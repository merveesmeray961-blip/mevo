- id: YMM-IFM-MDV-0010
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: TMS 36 varlıklarda değer düşüklüğü
  tip: hesaplama
  zorluk: 3
  kok: '(I) AŞ, yeniden değerleme modeliyle izlediği binası için özkaynakta 120.000 TL yeniden değerleme artışı taşımaktadır.
    31.12.2026''da değer düşüklüğü belirtisi oluşmuştur: binanın defter değeri 2.000.000 TL, satış maliyetleri düşülmüş gerçeğe
    uygun değeri 1.650.000 TL, kullanım değeri 1.700.000 TL''dir. Vergi etkisi dikkate alınmayacaktır. TMS 36''ya göre 2026
    yılı kâr veya zararına yansıyacak değer düşüklüğü zararı kaç TL''dir?'
  secenekler:
    A: 120.000 TL
    B: 180.000 TL
    C: 230.000 TL
    D: 300.000 TL
    E: 350.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Geri kazanılabilir tutar yüksek olan kullanım değeridir: 1.700.000 TL (par. 18). Değer düşüklüğü 2.000.000
      − 1.700.000 = 300.000 TL. Yeniden değerlenmiş varlıkta zarar, aynı varlığın yeniden değerleme fazlasını aşmadığı ölçüde
      fazladan düşülür ve diğer kapsamlı gelirde muhasebeleştirilir (par. 61): 120.000 TL DKG, kalan 180.000 TL kâr veya zarar.
      Püf noktaları: Önce yüksek olan ölçütü seç, sonra zararı özkaynaktaki fazla ile kâr veya zarar arasında böl. Düşük ölçütü
      alan aday 350.000 ve 230.000 TL''ye ulaşır.'
    celdiriciler:
      A: 120.000 TL diğer kapsamlı gelirde yeniden değerleme fazlasından düşülen kısımdır.
      C: Geri kazanılabilir tutar düşük olan ölçüt (1.650.000 TL) ile hesaplanmıştır.
      D: Yeniden değerleme fazlasından düşülecek 120.000 TL dikkate alınmamıştır.
      E: Hem düşük ölçüt kullanılmış hem de yeniden değerleme fazlası mahsup edilmemiştir.
    hesap_adimlari:
    - Geri kazanılabilir tutar = max(1.650.000; 1.700.000) = 1.700.000
    - Toplam zarar = 2.000.000 − 1.700.000 = 300.000
    - DKG'den düşülen = 120.000; kâr veya zarar = 180.000
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 61
    alinti: yeniden değerlenmiş bir varlığa ilişkin değer düşüklüğü zararı, aynı varlığın yeniden değerleme fazlası tutarını
      aşmadığı sürece yeniden değerleme fazlasından düşülerek diğer kapsamlı gelirde muhasebeleştirilir.
