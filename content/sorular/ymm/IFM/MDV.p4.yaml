  kazanim: TMS 40 yatırım amaçlı gayrimenkuller
  tip: hesaplama
  zorluk: 3
  kok: (L) AŞ, maliyet modeliyle izlediği ve idari amaçla kullandığı binasını 30.06.2026'da boşaltarak faaliyet kiralamasıyla
    kiraya vermiş ve bu tarihte gerçeğe uygun değer yöntemiyle ölçülen yatırım amaçlı gayrimenkul olarak sınıflandırmıştır.
    Binanın maliyeti 3.000.000 TL, 30.06.2026 itibarıyla (o tarihe kadarki amortisman dahil) birikmiş amortismanı 900.000
    TL'dir; daha önce değer düşüklüğü kaydedilmemiştir. Binanın gerçeğe uygun değeri 30.06.2026'da 2.800.000 TL, 31.12.2026'da
    3.000.000 TL'dir. Vergi dikkate alınmayacaktır. 2026 yılında bu gerçeğe uygun değer farklarından kâr veya zarara ve diğer
    kapsamlı gelire yansıyan tutarlar hangisidir?
  secenekler:
    A: Kâr veya zarar 900.000 TL; diğer kapsamlı gelir 0 TL
    B: Kâr veya zarar 0 TL; diğer kapsamlı gelir 900.000 TL
    C: Kâr veya zarar 700.000 TL; diğer kapsamlı gelir 200.000 TL
    D: Kâr veya zarar 200.000 TL; diğer kapsamlı gelir 700.000 TL
    E: Kâr veya zarar 200.000 TL; diğer kapsamlı gelir 0 TL
  dogru: D
  aciklama:
    dogru_neden: 'Sınıflama tarihine kadar TMS 16 uygulanır; bu tarihte defter değeri 2.100.000 TL ile GUD 2.800.000 TL arasındaki
      700.000 TL artış TMS 16''ya göre yeniden değerleme gibi işlenir ve önceki değer düşüklüğü olmadığından diğer kapsamlı
      gelire alınır (TMS 40 par. 61-62(b)(ii)). Sınıflama sonrası GUD değişimi (3.000.000 − 2.800.000 = 200.000 TL) TMS 40
      par. 35 gereği kâr veya zarardadır. Püf noktaları: Transfer anındaki fark ile transfer sonrasındaki GUD değişimi farklı
      hükümlere tabidir; ilki yeniden değerleme gibi DKG''ye, ikincisi kâr veya zarara gider. Stoktan transferde ise fark
      kâr veya zarardadır (par. 63); iki durumu karıştırma.'
    celdiriciler:
      A: Transfer anındaki 700.000 TL'lik fark kâr veya zarara değil diğer kapsamlı gelire alınır.
      B: Transfer sonrası 200.000 TL'lik GUD değişimi kâr veya zarardadır.
      C: İki tutar yer değiştirmiştir; transfer farkı DKG'de, sonraki GUD değişimi kâr veya zarardadır.
      E: Transfer tarihindeki 700.000 TL'lik fark yeniden değerleme gibi DKG'de muhasebeleştirilmelidir.
    hesap_adimlari:
    - Transfer tarihi defter değeri = 3.000.000 − 900.000 = 2.100.000
    - Transfer farkı = 2.800.000 − 2.100.000 = 700.000 → DKG
    - Sonraki GUD değişimi = 3.000.000 − 2.800.000 = 200.000 → kâr veya zarar
  kaynaklar:
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 61
    alinti: TMS 16 veya TFRS 16’ya göre hesaplanmış olan defter değeri ile gerçeğe uygun değeri arasında bu tarihte oluşan
      herhangi bir farklılığı ise yine TMS 16’ya göre yapılmış bir yeniden değerleme gibi değerlendirir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dd = 3000000 - 900000

      dkg = 2800000 - dd

      kz = 3000000 - 2800000

      sonuc = kz'
    secenek_sayisi_bekleniyor: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, satır 28
- id: YMM-IFM-MDV-0014
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: TMS 23 borçlanma maliyetleri
  tip: hesaplama
  zorluk: 3
  kok: (M) AŞ, yeni fabrika binası (özellikli varlık) inşaatı için 01.01.2026'da 6.000.000 TL özel kredi kullanmıştır; kredinin
    yıllık faizi 2.400.000 TL olup aylara eşit tahakkuk etmektedir. İnşaat için ilk harcama yapılmış ve inşaat faaliyetleri
    01.04.2026'da başlamış, yıl sonunda devam etmektedir; faaliyetlere ara verilmemiştir. Kullanılmayan kredi tutarı mevduatta
    değerlendirilmiş; Ocak-Mart döneminde 90.000 TL, Nisan-Aralık döneminde 120.000 TL faiz geliri elde edilmiştir. TMS 23'e
    göre 2026 yılında aktifleştirilecek borçlanma maliyeti kaç TL'dir?
  secenekler:
    A: 1.590.000 TL
    B: 1.680.000 TL
    C: 1.800.000 TL
    D: 2.190.000 TL
    E: 2.280.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Aktifleştirme; harcama yapılması, borçlanma maliyetinin oluşması ve hazırlık işlemlerine başlanması koşullarının
      tümü sağlandığında, yani 01.04.2026''da başlar (TMS 23 par. 17). Nisan-Aralık faizi 9 × 200.000 = 1.800.000 TL''dir.
      Özel borçlanmada aynı dönemdeki geçici nemalandırma geliri düşülür (par. 12): 1.800.000 − 120.000 = 1.680.000 TL. Ocak-Mart
      faizi (600.000 TL) gider, aynı dönemin 90.000 TL mevduat faizi gelirdir. Püf noktaları: Aktifleştirme dönemi kredinin
      kullanıldığı tarihten değil, üç koşulun birlikte sağlandığı tarihten başlar; nemalandırma geliri de yalnız aktifleştirme
      dönemine ait olanla sınırlı olarak düşülür.'
    celdiriciler:
      A: Aktifleştirme başlamadan önceki Ocak-Mart nemalandırma geliri de düşülmüştür.
      C: Aktifleştirme dönemindeki 120.000 TL geçici nemalandırma geliri düşülmemiştir.
      D: Aktifleştirme 01.01.2026'dan başlatılmış ve her iki dönemin geliri düşülmüştür.
      E: Aktifleştirme kredi kullanım tarihinden başlatılmıştır; inşaat faaliyetleri Nisan'da başlamıştır.
    hesap_adimlari:
    - Aylık faiz = 2.400.000 / 12 = 200.000
    - Aktifleştirme dönemi faizi = 9 × 200.000 = 1.800.000
    - Aktifleştirilecek = 1.800.000 − 120.000 = 1.680.000
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 12
    alinti: söz konusu fonların geçici olarak nemalandırılması ile sağlanan gelirlerin düşülmesi suretiyle belirler.
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: par. 17
    alinti: 'Aktifleştirmenin başlama tarihi, işletmenin aşağıdaki koşulların tümünü sağladığı tarihtir:'
  gecerlilik:
    baslangic: '2009-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'aylik = 2400000 / 12

      sonuc = 9 * aylik - 120000'
