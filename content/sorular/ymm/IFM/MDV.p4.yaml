      C: Doğrusal yöntemde amortisman fiilî kullanıma değil, kullanılabilir olmaya bağlıdır.
      D: Fatura tarihi mülkiyet ve kayıt zamanını gösterir; kullanılabilirlik şartı karşılanmamıştır.
