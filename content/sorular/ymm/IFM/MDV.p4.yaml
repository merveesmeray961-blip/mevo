  tip: uygulama
  zorluk: 2
  kok: (D) AŞ'nin maliyeti 4.000.000 TL, birikmiş amortismanı 1.000.000 TL olan binasının 31.12.2026'daki gerçeğe uygun değeri
    3.600.000 TL'dir. Şirket yeniden değerleme modelini ilk kez uygulamakta ve TMS 16 par. 35(a)'daki brüt defter değerinin
    orantılı düzeltilmesi yöntemini seçmektedir. Ertelenmiş vergi etkisi ayrıca kaydedilecektir. Yeniden değerleme kaydı Tekdüzen
    Hesap Planı'na göre hangisidir?
  secenekler:
    A: 252 Binalar B 600.000 / 522 M.D.V. Yeniden Değerleme Artışları A 600.000
    B: 257 Birikmiş Amortismanlar B 1.000.000 / 252 Binalar A 1.000.000; 252 Binalar B 600.000 / 522 M.D.V. Yeniden Değerleme
      Artışları A 600.000
    C: 252 Binalar B 800.000 / 257 Birikmiş Amortismanlar A 200.000, 649 Faaliyetle İlgili Diğer Gelir ve Karlar A 600.000
    D: 252 Binalar B 1.200.000 / 257 Birikmiş Amortismanlar A 600.000, 522 M.D.V. Yeniden Değerleme Artışları A 600.000
    E: 252 Binalar B 800.000 / 257 Birikmiş Amortismanlar A 200.000, 522 M.D.V. Yeniden Değerleme Artışları A 600.000
  dogru: E
  aciklama:
    dogru_neden: Defter değeri 3.000.000 TL, GUD 3.600.000 TL; artış 600.000 TL ve oran 1,2'dir. Brüt yöntemde maliyet 4.000.000
      × 1,2 = 4.800.000 (artış 800.000), birikmiş amortisman 1.000.000 × 1,2 = 1.200.000 (artış 200.000) olur. Artış TMS 16
      par. 39 gereği diğer kapsamlı gelirde, 522 M.D.V. Yeniden Değerleme Artışları hesabında izlenir.
    celdiriciler:
      A: Brüt yöntemde birikmiş amortisman da orantılı artırılır; kayıt yalnız net artışı göstermektedir.
      B: Bu kayıt birikmiş amortismanın netleştirildiği yöntemdir (par. 35(b)); kökte brüt yöntem seçilmiştir.
      C: Yeniden değerleme artışı kâr veya zarara değil diğer kapsamlı gelire (522) alınır.
      D: Brüt değer ve birikmiş amortisman oran (1,2) yerine artış tutarı (600.000) ile düzeltilmiştir; brüt 4.800.000 olmalıdır.
  kaynaklar:
