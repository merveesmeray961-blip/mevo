- id: YMM-IFM-MDV-0009
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: TMS 36 varlıklarda değer düşüklüğü
  tip: hesaplama
  zorluk: 1
  kok: (H) AŞ'nin değer düşüklüğü belirtisi bulunan bir makinesinin 31.12.2026 defter değeri 950.000 TL'dir. Makinenin gerçeğe
    uygun değeri 800.000 TL, elden çıkarma maliyetleri 20.000 TL, kullanımından beklenen nakit akışlarının bugünkü değeri
    820.000 TL'dir. TMS 36'ya göre makinenin geri kazanılabilir tutarı kaç TL'dir?
  secenekler:
    A: 130.000 TL
    B: 780.000 TL
    C: 800.000 TL
    D: 820.000 TL
    E: 950.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'TMS 36 par. 18''e göre geri kazanılabilir tutar, satış maliyetleri düşülmüş GUD (800.000 − 20.000 = 780.000)
      ile kullanım değerinden (820.000) yüksek olanıdır: 820.000 TL. Değer düşüklüğü zararı 950.000 − 820.000 = 130.000 TL
      olur.'
    celdiriciler:
      A: 130.000 TL geri kazanılabilir tutar değil, değer düşüklüğü zararıdır.
      B: İki ölçütün düşük olanı alınmıştır; standart yüksek olanı ister.
      C: Gerçeğe uygun değerden elden çıkarma maliyetleri düşülmemiş ve kullanım değeri ile karşılaştırılmamıştır.
      E: Defter değeri geri kazanılabilir tutarla karşılaştırılan tutardır; kendisi geri kazanılabilir tutar değildir.
    hesap_adimlari:
    - Satış maliyetleri düşülmüş GUD = 800.000 − 20.000 = 780.000
    - Kullanım değeri = 820.000
    - Geri kazanılabilir tutar = max(780.000; 820.000) = 820.000
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 18
    alinti: satış maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinden yüksek olanı olarak tanımlar.
  gecerlilik:
