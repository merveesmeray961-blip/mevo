- id: YMM-IFM-MDV-0001
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: TMS 16 maddi duran varlıklar ve amortisman
  tip: hesaplama
  zorluk: 1
  kok: (A) AŞ, 2026 yılında üretimde kullanmak üzere bir makine ithal etmiştir. Makinenin liste fiyatı 2.000.000 TL olup satıcı
    %10 ticari iskonto uygulamıştır. Gümrük vergisi 90.000 TL, indirilecek KDV 378.000 TL, gümrükten fabrikaya nakliye 30.000
    TL, kurulum ve montaj 50.000 TL, makineyi kullanacak personelin eğitimi 40.000 TL ve yeni üretim hattının tanıtım reklamı
    25.000 TL'dir. TMS 16'ya göre makinenin ilk muhasebeleştirmedeki maliyeti kaç TL'dir?
  secenekler:
    A: 1.920.000 TL
    B: 1.970.000 TL
    C: 2.010.000 TL
    D: 2.035.000 TL
    E: 2.170.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'TMS 16 par. 16''ya göre maliyet; iskonto düşülmüş satın alma fiyatı, ithalat vergileri ve varlığı çalışır
      duruma getirme maliyetlerinden oluşur: 1.800.000 + 90.000 + 30.000 + 50.000 = 1.970.000 TL. İndirilecek KDV iade edilen
      vergidir; personel eğitimi ve reklam par. 19''a göre maliyete girmez.'
    celdiriciler:
      A: Kurulum ve montaj, varlığı çalışabilir duruma getirme maliyeti olarak maliyete dahildir.
      C: Personel eğitim gideri TMS 16 par. 19(c) gereği maliyete eklenmez.
      D: Eğitim ve tanıtım reklamı giderleri maliyete eklenmiştir; ikisi de dönem gideridir.
      E: Ticari iskonto satın alma fiyatından düşülmemiştir.
    hesap_adimlari:
    - Net alış fiyatı = 2.000.000 × 0,90 = 1.800.000
    - + Gümrük vergisi 90.000 + nakliye 30.000 + kurulum 50.000
    - Maliyet = 1.970.000
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 16(a)
    alinti: İndirimler ve ticari iskontolar düşüldükten sonra, ithalat vergileri ve iade edilmeyen alış vergileri dahil, satın
      alma fiyatı.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 19(c)
    alinti: Yeni bir yerde veya yeni bir müşteri kitlesiyle iş yapmak amacıyla katlanılan maliyetler (personel eğitim masrafları
      dahil)
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 2000000 * 0.9 + 90000 + 30000 + 50000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, satır 16
