- id: YMM-IFM-MDV-0005
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: yeniden değerleme modeli
  tip: hesaplama
  zorluk: 3
  kok: (E) AŞ, 01.01.2026'da maliyet esasına göre defter değeri 1.500.000 TL olan ve kalan yararlı ömrü 10 yıl olan binasını
    2.500.000 TL'ye yeniden değerlemiş; 1.000.000 TL artışı özkaynakta yeniden değerleme artışı olarak kaydetmiştir. Kalıntı
    değer sıfırdır, doğrusal yöntem uygulanmaktadır. Şirketin muhasebe politikası, yeniden değerleme artışını varlık kullanıldıkça
    geçmiş yıllar kârlarına aktarmaktır. Vergi etkisi dikkate alınmayacaktır. 2026 yılı kâr veya zararına yansıyan amortisman
    gideri ve 31.12.2026'da özkaynakta kalan yeniden değerleme artışı hangisidir?
  secenekler:
    A: Amortisman 150.000 TL; değer artışı 1.000.000 TL
    B: Amortisman 250.000 TL; değer artışı 1.000.000 TL
    C: Amortisman 250.000 TL; değer artışı 900.000 TL
    D: Amortisman 150.000 TL; değer artışı 900.000 TL
    E: Amortisman 350.000 TL; değer artışı 900.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Amortisman yeniden değerlenmiş tutar üzerinden ayrılır: 2.500.000 / 10 = 250.000 TL ve tamamı kâr veya zarardadır.
      TMS 16 par. 41''e göre aktarım, yeniden değerlenmiş tutar üzerinden amortisman (250.000) ile orijinal maliyet üzerinden
      amortisman (150.000) arasındaki fark kadardır: 100.000 TL doğrudan geçmiş yıllar kârlarına aktarılır; özkaynakta 900.000
      TL kalır. Aktarım kâr veya zarar üzerinden yapılamaz. Püf noktaları: Amortisman gideri yeniden değerlenmiş tutara göre
      hesaplanır; aktarılan 100.000 TL gelir tablosundan geçmez, yalnız özkaynak içinde 522''den 570''e taşınır.'
    celdiriciler:
      A: Amortisman yeniden değerlenmiş tutar üzerinden ayrılır; ayrıca politika gereği aktarım yapılmalıdır.
      B: Amortisman doğrudur, ancak seçilen politika gereği 100.000 TL geçmiş yıllar kârlarına aktarılmalıdır.
      D: Amortisman orijinal maliyet üzerinden hesaplanmıştır; yeniden değerlenmiş tutar esas alınır.
      E: Aktarım kâr veya zarar üzerinden yapılamaz (par. 41); 100.000 TL amortismana eklenmemelidir.
    hesap_adimlari:
    - Yeni amortisman = 2.500.000 / 10 = 250.000
    - Maliyet esaslı amortisman = 1.500.000 / 10 = 150.000
    - Aktarım = 100.000; kalan artış = 1.000.000 − 100.000 = 900.000
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 41
    alinti: Bu durumda, aktarılan değer artışı, varlığın yeniden değerlenmiş defter değeri üzerinden hesaplanan amortisman
      ile orijinal maliyeti üzerinden hesaplanan amortisman arasındaki fark kadar olur. Yeniden değerleme değer artışından
      geçmiş yıl kârlarına aktarım kâr veya zarar üzerinden yapılamaz.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'yeni = 2500000 / 10

      eski = 1500000 / 10

      sonuc = 1000000 - (yeni - eski)'
    secenek_sayisi_bekleniyor: false
