      hammadde maliyetinin altına indirgenmez: H1 için indirgeme yoktur. Hammadde fiyatındaki düşüş mamul maliyetinin NGD''yi
      aşacağını gösteriyorsa hammadde NGD''ye indirgenir ve yenileme maliyeti en iyi ölçü olabilir: H2 için 250.000 − 210.000
