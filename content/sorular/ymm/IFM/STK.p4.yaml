    340.000 TL'dir; H1'in kullanıldığı M1 mamulünün tahmini birim maliyeti 1.000 TL, net gerçekleşebilir değeri 1.100 TL'dir.
    H2 hammaddesinin maliyeti 250.000 TL, yenileme maliyeti 210.000 TL'dir; hammadde fiyatlarındaki düşüş nedeniyle H2'nin
    kullanıldığı M2 mamullerinin toplam maliyetinin (900.000 TL) net gerçekleşebilir değerini (820.000 TL) aşacağı anlaşılmaktadır.
    Yenileme maliyeti, net gerçekleşebilir değerin en iyi ölçüsüdür; stoklarda mamul bulunmamaktadır. TMS 2'ye göre hammaddeler
    için ayrılacak değer düşüklüğü toplamı kaç TL'dir?
