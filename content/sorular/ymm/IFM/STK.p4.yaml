- id: YMM-IFM-STK-0001
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  tip: hesaplama
  zorluk: 1
  kok: (A) AŞ, 2026 yılında satmak üzere ticari mal almıştır. Malın faturadaki alış fiyatı 500.000 TL, satıcının uyguladığı
    ticari iskonto 25.000 TL, indirilecek KDV 95.000 TL'dir. Malın işletme deposuna getirilmesi için 15.000 TL nakliye ve
    5.000 TL taşıma sigortası ödenmiştir. Mal daha sonra müşteriye satılmış ve müşteriye teslim için 8.000 TL nakliye ödenmiştir;
    ayrıca muhasebe biriminin bu alıma ilişkin genel yönetim gideri payı 12.000 TL olarak hesaplanmıştır. TMS 2'ye göre ticari
    malın maliyeti kaç TL'dir?
  secenekler:
    A: 475.000 TL
    B: 490.000 TL
    C: 495.000 TL
    D: 507.000 TL
    E: 590.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'TMS 2 par. 10-11''e göre maliyet, iskonto düşülmüş alış fiyatı ile stoku mevcut konumuna ve durumuna getirme
      maliyetlerinden oluşur: 475.000 + 15.000 + 5.000 = 495.000 TL. Müşteriye teslim nakliyesi satış maliyeti, genel yönetim
      gideri payı ise par. 16(c)-(d) gereği dönem gideridir; indirilecek KDV geri alınabilir vergidir.'
    celdiriciler:
      A: Depoya getirme nakliyesi ve sigortası maliyete dahildir.
      B: Taşıma sigortası da stoku mevcut konumuna getirme maliyetidir.
      D: Genel yönetim gideri payı stokun maliyetine eklenmez (par. 16(c)).
      E: İndirilecek KDV geri alınabilir vergi olduğundan maliyete girmez.
    hesap_adimlari:
    - Net alış = 500.000 − 25.000 = 475.000
    - + Nakliye 15.000 + sigorta 5.000
    - Maliyet = 495.000
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 10
    alinti: Stokların maliyeti; tüm satın alma maliyetlerini, dönüştürme maliyetlerini ve stokların mevcut konumuna ve durumuna
      getirilmesi için katlanılan diğer maliyetleri içerir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(c)
    alinti: Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 500000 - 25000 + 15000 + 5000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S1.yaml, satır 31
  - tarih: '2026-10-18'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-IFM-STK-0002
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  tip: hesaplama
  zorluk: 2
  kok: (B) AŞ, 01.11.2026'da peşin fiyatı 800.000 TL olan ticari malı 4 ay vadeyle 880.000 TL'ye satın almıştır; vade farkı
    normal kredi koşullarını yansıtmakta olup dönemlere doğrusal dağıtılacaktır. Mal 31.12.2026'da stokta bulunmaktadır ve
    net gerçekleşebilir değeri maliyetinin üzerindedir. TMS 2'ye göre 31.12.2026 itibarıyla stokun maliyeti ve 2026 yılına
    ait faiz gideri hangisidir?
  secenekler:
    A: Stok 880.000 TL; faiz gideri 0 TL
    B: Stok 840.000 TL; faiz gideri 40.000 TL
    C: Stok 800.000 TL; faiz gideri 80.000 TL
    D: Stok 800.000 TL; faiz gideri 40.000 TL
    E: Stok 800.000 TL; faiz gideri 0 TL
  dogru: D
  aciklama:
    dogru_neden: TMS 2 par. 18'e göre satın alma finansman bileşeni içeriyorsa peşin fiyat ile ödenen tutar arasındaki fark
      finansman dönemi boyunca faiz gideridir. Stok 800.000 TL'dir; 80.000 TL vade farkının 2 aylık (Kasım-Aralık) payı 80.000
      × 2/4 = 40.000 TL 2026 faiz gideridir.
    celdiriciler:
      A: Vade farkı stok maliyetine eklenmez; finansman dönemi boyunca faiz gideridir.
      B: Faiz gideri doğru, ancak tahakkuk eden faiz stok maliyetine eklenmemelidir.
      C: Vade farkının tamamı 2026'ya yüklenmiştir; finansman dönemi Mart 2027'ye kadar sürer.
      E: Kasım-Aralık dönemine isabet eden vade farkı 2026 faiz gideridir.
    hesap_adimlari:
    - Stok maliyeti = peşin fiyat 800.000
    - Vade farkı = 880.000 − 800.000 = 80.000
    - 2026 faiz gideri = 80.000 × 2/4 = 40.000
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 18
    alinti: finansman sağlanan dönem boyunca faiz gideri olarak finansal tablolara yansıtılır.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fark = 880000 - 800000

      sonuc = fark * 2 / 4'
    secenek_sayisi_bekleniyor: false
