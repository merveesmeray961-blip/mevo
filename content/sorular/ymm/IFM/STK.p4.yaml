  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  tip: hesaplama
  zorluk: 2
  kok: (C) AŞ'nin üretim tesisinin normal kapasitesi yıllık 10.000 birimdir. 2026 yılında talep düşüklüğü nedeniyle 8.000
    birim üretilmiştir (normal kapasiteye yakın kabul edilmemektedir). 2026 yılı sabit genel üretim giderleri 600.000 TL,
    değişken genel üretim giderleri 240.000 TL'dir. TMS 2'ye göre stoklara yüklenmeyip 2026 yılında doğrudan gider yazılacak
    sabit genel üretim gideri kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 120.000 TL
    C: 150.000 TL
    D: 240.000 TL
    E: 480.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'TMS 2 par. 13''e göre sabit GÜG normal kapasiteye göre dağıtılır: 600.000 / 10.000 = 60 TL/birim. Üretilen
      8.000 birime 480.000 TL yüklenir; dağıtılmayan 120.000 TL gerçekleştiği dönemde giderdir. Birim başına sabit gider düşük
      üretim nedeniyle artırılmaz.'
    celdiriciler:
      A: Sabit giderin tamamını fiili üretime yüklemek, düşük üretimde birim maliyeti artırır; standart buna izin vermez.
      C: Atıl kısım fiili üretim (8.000) yerine normal kapasite (10.000) esas alınarak hesaplanır.
      D: Değişken GÜG fiili kullanıma göre tamamen stoklara yüklenir; gider yazılmaz.
      E: 480.000 TL stoklara yüklenen sabit GÜG tutarıdır.
    hesap_adimlari:
    - Yükleme oranı = 600.000 / 10.000 = 60 TL
    - Yüklenen = 8.000 × 60 = 480.000
    - Gider = 600.000 − 480.000 = 120.000
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Dağıtılmayan genel giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oran = 600000 / 10000

      sonuc = 600000 - 8000 * oran'
