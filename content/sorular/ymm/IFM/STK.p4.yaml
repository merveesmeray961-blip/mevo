  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: TMS 41 tarımsal faaliyetler
  tip: hesaplama
  zorluk: 3
  kok: (J) AŞ'nin besi danalarının 01.01.2026'daki satış maliyetleri düşülmüş gerçeğe uygun değeri 2.500.000 TL'dir. Şirket
    2026'da piyasadan 1.000.000 TL'ye (alım tarihindeki gerçeğe uygun değer) 20 baş dana daha satın almıştır; satış maliyetleri
    gerçeğe uygun değerin %4'üdür. 31.12.2026'da sürüdeki tüm danaların gerçeğe uygun değeri 4.200.000 TL'dir (satış maliyetleri
    %4). Yıl içinde hayvan satışı veya ölüm olmamıştır. TMS 41'e göre canlı varlıklardan 2026 yılı kâr veya zararına yansıyan
    net kazanç kaç TL'dir?
  secenekler:
    A: 492.000 TL
    B: 532.000 TL
    C: 572.000 TL
    D: 700.000 TL
    E: 1.532.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Alınan danalar ilk kayıtta satış maliyetleri düşülmüş GUD ile ölçülür: 1.000.000 × 0,96 = 960.000 TL; 40.000
      TL ilk muhasebeleştirme zararı doğar (par. 12, 26-27). Yıl sonu ölçüm 4.200.000 × 0,96 = 4.032.000 TL; GUD değişimi
      kazancı 4.032.000 − (2.500.000 + 960.000) = 572.000 TL. Net etki 572.000 − 40.000 = 532.000 TL. Püf noktaları: Piyasadan
      alınan canlı varlıkta satış maliyetleri nedeniyle ilk kayıtta zarar doğar; bu zarar ile yıl sonu değer artışı birlikte
      kâr veya zarara yansır. Brüt GUD değil satış maliyetleri düşülmüş tutar kullanılır.'
    celdiriciler:
      A: İlk kayıt zararı iki kez düşülmüştür.
      C: Alım anındaki 40.000 TL ilk muhasebeleştirme zararı dikkate alınmamıştır.
      D: Satış maliyetleri düşülmeden brüt GUD'ler (4.200.000 − 3.500.000) karşılaştırılmıştır.
      E: Satın alınan danaların bedeli (1.000.000 TL) kazançtan düşülmemiştir.
    hesap_adimlari:
    - İlk kayıt = 1.000.000 × 0,96 = 960.000; zarar 40.000
    - Yıl sonu = 4.200.000 × 0,96 = 4.032.000
    - GUD kazancı = 4.032.000 − 2.500.000 − 960.000 = 572.000
    - Net = 572.000 − 40.000 = 532.000
  kaynaklar:
  - mevzuat: TMS 41 Tarımsal Faaliyetler
    madde: par. 26
    alinti: Canlı bir varlığın gerçeğe uygun değerinden satış maliyetlerinin düşülerek ilk muhasebeleştirilmesi sırasında
      doğan kazanç veya zarar ile, ilgili varlığın gerçeğe uygun değerindeki değişiklikten doğan kazanç veya zarar oluştuğu
