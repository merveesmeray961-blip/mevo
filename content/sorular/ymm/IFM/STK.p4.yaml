  kok: (L) AŞ, 01.07.2026'da 1.500.000 TL'ye aldığı ve aynı gün kullanıma hazır hale gelen makine için 450.000 TL devlet hibesi
    tahsil etmiştir; hibe koşullarına uyulacağına dair makul güvence vardır. Makinenin yararlı ömrü 5 yıl, kalıntı değeri
    sıfırdır (doğrusal yöntem, ay esası). Şirket teşviki varlığın defter değerinden indirme yöntemiyle sunmaktadır. 2026 yılı
    kâr veya zarar tablosunda makineye ilişkin amortisman gideri kaç TL'dir?
  secenekler:
