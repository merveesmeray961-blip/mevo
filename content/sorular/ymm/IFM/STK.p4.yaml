- id: YMM-IFM-STK-0005
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: TMS 2 stokların maliyeti ve net gerçekleşebilir değer
  tip: hesaplama
  zorluk: 3
  kok: (D) AŞ'nin 31.12.2026 itibarıyla stoklarında maliyeti 700.000 TL olan bir yarı mamul partisi bulunmaktadır. Partinin
    mamule dönüşmesi için 180.000 TL tamamlama maliyeti gerekecektir. Mamullerin tahmini satış fiyatı 900.000 TL'dir; satış
    için 45.000 TL komisyon ve 15.000 TL müşteriye teslim nakliyesi ödenecektir. TMS 2'ye göre yarı mamul için ayrılacak stok
    değer düşüklüğü kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 25.000 TL
    C: 40.000 TL
    D: 100.000 TL
    E: 220.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'TMS 2 par. 6''ya göre NGD, tahmini satış fiyatından tahmini tamamlama maliyetleri ve satış için gerekli
      tahmini maliyetler düşülerek bulunur: 900.000 − 180.000 − 45.000 − 15.000 = 660.000 TL. Stok, maliyet (700.000) ile
      NGD''nin düşüğüyle ölçülür (par. 9): değer düşüklüğü 40.000 TL. Püf noktaları: Yarı mamulde tamamlama maliyetini düşmeyi
      unutan aday NGD''yi maliyetin üstünde bulur ve indirgeme yapmaz; satış maliyetlerinin her kalemi (komisyon ve nakliye)
      ayrı ayrı düşülmelidir.'
    celdiriciler:
      A: Tamamlama maliyeti düşülmeden NGD 840.000 TL bulunmuş ve indirgeme yapılmamıştır.
      B: Müşteriye teslim nakliyesi satış için gerekli maliyettir; NGD hesabında düşülmelidir.
      D: Satış maliyetleri (60.000 TL) iki kez düşülmüştür.
      E: Tamamlama maliyeti iki kez düşülmüştür; NGD 660.000 TL'dir.
    hesap_adimlari:
    - NGD = 900.000 − 180.000 − 45.000 − 15.000 = 660.000
    - Değer düşüklüğü = 700.000 − 660.000 = 40.000
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
