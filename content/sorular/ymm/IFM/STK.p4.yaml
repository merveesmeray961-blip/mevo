  kok: (M) AŞ, 01.01.2024'te 1.000.000 TL'ye aldığı makine için 200.000 TL devlet hibesi almış ve teşviki varlığın defter
    değerinden indirme yöntemiyle sunmuştur. Makinenin yararlı ömrü 10 yıl, kalıntı değeri sıfırdır (doğrusal yöntem). 2024
    ve 2025 amortismanları ayrılmıştır. 01.01.2026'da şirketin hibe koşullarını ihlal ettiği ve hibenin tamamının geri ödenmesi
    gerektiği kesinleşmiştir. TMS 20'ye göre geri ödeme nedeniyle 01.01.2026'da derhal kâr veya zarara yansıtılacak tutar
    kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 40.000 TL
    C: 160.000 TL
    D: 200.000 TL
    E: 240.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'TMS 20 par. 32''ye göre varlığa ilişkin teşvikin geri ödenmesinde varlığın defter değeri geri ödenecek tutar
      kadar artırılır ve teşvik alınmamış olsaydı önceki dönemlerde kâr veya zarara yansıyacak birikmiş ek amortisman o anda
      kâr veya zarara alınır. Teşvikli amortisman yılda 80.000, teşviksiz 100.000 TL''dir; iki yıllık fark 2 × 20.000 = 40.000
      TL. Bu tutar bir muhasebe tahmini değişikliği olarak işlenir; geçmiş yıllar düzeltilmez. Püf noktaları: Geri ödenen
      200.000 TL''nin tamamı gider değildir; varlığın defter değerine eklenir. Yalnız geçmiş yılların eksik kalan amortismanı
      (40.000 TL) derhal gider yazılır.'
    celdiriciler:
      A: Teşvik olmasaydı ayrılacak birikmiş ek amortisman derhal kâr veya zarara alınır.
      C: 160.000 TL, teşvikli maliyet üzerinden ayrılmış iki yıllık birikmiş amortismandır.
      D: Geri ödenen tutar varlığın defter değerine eklenir; tamamı gider yazılmaz.
      E: Geri ödeme tutarı ve ek amortisman birlikte gider yazılmıştır.
    hesap_adimlari:
    - Teşvikli yıllık amortisman = 800.000 / 10 = 80.000
    - Teşviksiz yıllık amortisman = 1.000.000 / 10 = 100.000
    - Birikmiş ek amortisman = 2 × 20.000 = 40.000
