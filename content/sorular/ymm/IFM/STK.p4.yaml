  aciklama:
    dogru_neden: 'TMS 20 par. 27''ye göre bu yöntemde teşvik varlığın defter değerinden indirilir ve amortisman giderini azaltarak
      kâr veya zarara yansır: (1.500.000 − 450.000) / 5 × 6/12 = 105.000 TL.'
    celdiriciler:
      A: 45.000 TL ertelenmiş gelir yönteminde 2026'ya düşen teşvik geliridir; amortisman değildir.
      B: Yıllık teşvik payıdır (450.000 / 5); sorulan amortisman gideridir.
