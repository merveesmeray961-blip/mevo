  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: stokların maliyetine dâhil edilen ve edilmeyen maliyetler
  tip: bilgi
  zorluk: 1
  kok: TMS 2 Stoklar'a göre aşağıdaki maliyet kalemlerinden hangisi stokların maliyetine **dâhil edilmez**?
  secenekler:
    A: Stokların satışını gerçekleştirmek için katlanılan satış, pazarlama ve müşteriye teslim ile ilgili maliyetler
    B: Üretim sürecinde bir sonraki üretim aşamasından önce zorunlu olarak katlanılan depolama maliyetleri
    C: Fabrika binası ve teçhizatının bakım onarım giderleri gibi sabit genel üretim giderlerinden dağıtılan tutarlar
    D: Satın alma fiyatına eklenen ve işletmenin daha sonra vergi idaresinden iade alamayacağı ithalat vergileri
    E: Mamullerin üretiminde çalışan işçilere ait direkt işçilik giderleri gibi üretimle doğrudan ilişkili maliyetler
  dogru: A
  aciklama:
    dogru_neden: TMS 2 par. 16(d) satış maliyetlerini, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider
      olarak finansal tablolara yansıtılan maliyetler arasında sayar. Diğer dört kalem stokun satın alma veya dönüştürme maliyetinin
      parçasıdır.
    celdiriciler:
      B: Par. 16(b) yalnızca bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetlerini dışarıda
        bırakır; zorunlu olan depolama maliyeti stok maliyetine dâhildir.
      C: Par. 12 ve 13 uyarınca sabit genel üretim giderleri (bakım onarım dâhil) normal kapasiteye göre dönüştürme maliyetlerine
        dağıtılır.
      D: Par. 11 uyarınca ithalat vergileri ve diğer vergiler, sonradan iade alınabilecekler hariç satın alma maliyetine dâhildir;
        iade alınamayanlar maliyetin parçasıdır.
      E: Par. 12 uyarınca direkt işçilik gibi üretimle doğrudan ilişkili maliyetler dönüştürme maliyetidir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 16
    alinti: 'Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal tablolara
      yansıtılan maliyetlere örnek olarak verilebilir: (a) Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik
