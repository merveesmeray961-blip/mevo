- id: YMM-IFM-STK-0018
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: hasat edilen tarımsal ürünün maliyeti ve hasat sonrası işleme (TMS 41 / TMS 2)
  tip: hesaplama
  zorluk: 2
  kok: 'Ege Gıda AŞ, taşıyıcı bitki niteliğindeki zeytin ağaçlarından 2026 hasadında 200 ton zeytin elde etmiştir. Hasat noktasında
    zeytinin gerçeğe uygun değeri 18.000 TL/ton, ürünün satışı için katlanılacak maliyetler 1.000 TL/ton''dur. Zeytinler şirketin
    tesisinde sıkılmış; sıkım ve şişeleme maliyetleri 600.000 TL olmuş ve 40 ton zeytinyağı elde edilmiştir. Tüm zeytinyağı
    stoktadır; zeytin ağaçlarının amortismanı dikkate alınmayacaktır.


    Buna göre zeytinyağı stokunun ton başına maliyeti kaç TL''dir?'
  secenekler:
    A: '85.000'
    B: '90.000'
    C: '100.000'
    D: '105.000'
    E: '110.000'
  dogru: C
  aciklama:
    dogru_neden: Hasat edilen tarımsal ürün, hasat noktasında gerçeğe uygun değerinden satış maliyetleri düşülerek ölçülür
      (TMS 41 par. 13); bu değer TMS 2 uygulandığında stokun maliyetidir (TMS 2 par. 20). Hasattan sonraki sıkım ve şişeleme
      TMS 41 kapsamında değildir (par. 3); bu dönüştürme maliyeti TMS 2'ye göre stok maliyetine eklenir. Zeytinin hasat anındaki
      maliyeti 200 × (18.000 − 1.000) = 3.400.000 TL, toplam maliyet 3.400.000 + 600.000 = 4.000.000 TL, ton başına 4.000.000
      / 40 = 100.000 TL.
    celdiriciler:
      A: '3.400.000 / 40: yalnızca hasat anındaki değer alınmış, sıkım ve şişeleme maliyeti eklenmemiştir.'
      B: '3.600.000 / 40: zeytin gerçeğe uygun değerle alınmış (satış maliyeti düşülmemiş) ve işleme maliyeti eklenmemiştir.'
      D: '(3.600.000 + 600.000) / 40: işleme maliyeti eklenmiş, ancak hasat noktasındaki satış maliyetleri düşülmemiştir;
        TMS 41 par. 13 satış maliyetlerinin düşülmesini ister.'
      E: '(3.600.000 + 600.000 + 200.000) / 40: satış maliyeti düşülecek yerde ayrıca eklenmiştir.'
    hesap_adimlari:
    - Hasat anındaki değer = 200 × (18.000 − 1.000) = 3.400.000 TL
    - Toplam stok maliyeti = 3.400.000 + 600.000 = 4.000.000 TL
    - Ton başına maliyet = 4.000.000 / 40 = 100.000 TL
  kaynaklar:
  - mevzuat: TMS 41 Tarımsal Faaliyetler
    madde: par. 13
    alinti: Bir işletmenin canlı varlıklarından elde edilen tarımsal ürünler, hasat noktasında, gerçeğe uygun değerlerinden
      satış maliyetleri düşülmek suretiyle ölçülür.
  - mevzuat: TMS 2 Stoklar
    madde: par. 20
    alinti: Bu Standardın uygulanması açısından bu değer, stokun hasat anındaki maliyetidir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'hasat = 200*(18000-1000)

      sonuc = (hasat + 600000)/40'
  durum: kontrolde
  surum: 1
