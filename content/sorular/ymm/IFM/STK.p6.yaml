- id: YMM-IFM-STK-0019
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: 'net gerçekleşebilir değer: kesin satış sözleşmesi ve sözleşme dışı miktar'
  tip: hesaplama
  zorluk: 3
  kok: 'Dayanıklı tüketim malları ticareti yapan Kuzey Ticaret AŞ''nin 31.12.2026 itibarıyla stokunda maliyeti 800 TL/adet
    olan 1.000 adet ürün bulunmaktadır. Şirket, bu ürünlerden 600 adedini 700 TL/adet fiyatla satmak üzere bir müşteriyle
    kesin ve iptal edilemez bir sözleşme yapmış ve stoktan bu miktarı sözleşmeye ayırmıştır. Ürünün yıl sonundaki genel satış
    fiyatı 750 TL/adet''tir. Her iki satışta da adet başına 50 TL satış maliyeti katlanılacaktır. Stok kalemleri tek bir ürün
    türünden oluşmaktadır ve yıl içinde başka değer düşüklüğü ayrılmamıştır.


    TMS 2''ye göre şirketin 31.12.2026''da stoklar için muhasebeleştireceği değer düşüklüğü gideri kaç TL''dir?'
  secenekler:
    A: '40.000'
    B: '90.000'
    C: '100.000'
    D: '130.000'
    E: '150.000'
  dogru: D
  aciklama:
    dogru_neden: 'TMS 2 par. 9''a göre stoklar maliyet ile NRV''nin düşüğü üzerinden ölçülür. Kesin satış sözleşmesinin ifası
      için elde tutulan stoklarda NRV sözleşme fiyatına göre belirlenir; sözleşme miktarı elde tutulan stoktan az olduğundan
      fazla kalan kısmın NRV''si genel satış fiyatına göre belirlenir (par. 31). Sözleşmeli kısım: NRV = 700 − 50 = 650 TL,
      değer düşüklüğü 600 × (800 − 650) = 90.000 TL. Kalan kısım: NRV = 750 − 50 = 700 TL, değer düşüklüğü 400 × (800 − 700)
      = 40.000 TL. Toplam 130.000 TL.


      Püf noktaları: Tüm stoka tek bir fiyat uygulamayın; sözleşme fiyatı yalnız sözleşme miktarı için geçerlidir. NRV''yi
      bulurken satış maliyetini her iki gruptan da düşmeyi unutmayın. Şıklardaki 40.000, 90.000 ve 100.000 tutarları işlemin
      yarım veya hatalı sonuçlarıdır.'
    celdiriciler:
      A: Yalnızca sözleşme dışı 400 adedin değer düşüklüğü alınmıştır; sözleşmeli 600 adedin NRV'si (650 TL) de maliyetin
        altındadır.
      B: Yalnızca sözleşmeli 600 adedin değer düşüklüğü alınmıştır; kalan 400 adedin NRV'si (700 TL) de maliyetin altındadır.
      C: 'Tüm 1.000 adet için genel satış fiyatı (NRV 700 TL) kullanılmıştır: 1.000 × 100. Sözleşmeli kısımda sözleşme fiyatı
        esas alınmalıdır.'
      E: 'Tüm 1.000 adet için sözleşme fiyatı (NRV 650 TL) kullanılmıştır: 1.000 × 150. Sözleşme fiyatı yalnız sözleşme kapsamındaki
        600 adet için geçerlidir.'
    hesap_adimlari:
    - 'Sözleşmeli 600 adet: NRV = 700 − 50 = 650; düşüklük = 600 × (800 − 650) = 90.000'
    - 'Kalan 400 adet: NRV = 750 − 50 = 700; düşüklük = 400 × (800 − 700) = 40.000'
    - Toplam = 90.000 + 40.000 = 130.000 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 31
    alinti: Net gerçekleşebilir değerin tahmini yapılırken ayrıca, stokların elde tutulma amacı da dikkate alınır. Örneğin,
      kesin satış veya hizmet sözleşmelerinin ifası için elde tutulan stokların net gerçekleşebilir değeri belirlenirken,
      sözleşme fiyatı esas alınır. Söz konusu satış sözleşmelerinde belirtilen miktarın elde tutulan stok miktarından daha
      az olması durumunda, fazla olan kısmın net gerçekleşebilir değeri, genel satış fiyatına göre belirlenir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'adet=1000; maliyet=800; soz=600

      nrv_soz=700-50

      nrv_gen=750-50

      sonuc = soz*max(0,maliyet-nrv_soz) + (adet-soz)*max(0,maliyet-nrv_gen)'
