- id: YMM-IFM-STK-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: stok maliyetinin belirlenmesi (tarımsal ürünler, finansman bileşeni, yan ürünler)
  tip: kavrama
  zorluk: 2
  kok: 'TMS 2 Stoklar''a ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Hasat edilen tarımsal ürünlerden oluşan stoklar, finansal tablolara ilk alınırken hasat anındaki satış maliyetleri
    düşülmüş gerçeğe uygun değerle ölçülür ve bu değer stokun hasat anındaki maliyeti sayılır.


    II. Satın alma anlaşmasının etkin bir finansman bileşeni içermesi hâlinde, normal kredi koşullarındaki satın alma fiyatı
    ile ödenen tutar arasındaki fark stokun maliyetine dâhil edilir.


    III. Yan ürünlerin çoğu önemsizdir; bu nedenle yan ürünler genellikle net gerçekleşebilir değerleriyle ölçülür ve bu değer
    ana ürünün maliyetinden düşülür.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'I doğrudur: TMS 2 par. 20 uyarınca hasattan elde edilen tarımsal ürün stokları ilk kez hasat anındaki satış
      maliyetleri düşülmüş gerçeğe uygun değerle ölçülür ve bu değer stokun maliyetidir. III doğrudur: par. 14 uyarınca önemsiz
      yan ürünler genellikle NRV üzerinden ölçülür ve bu tutar ana ürünün maliyetinden düşülür. II yanlıştır: par. 18 uyarınca
      finansman bileşeni stok maliyetine değil, finansman dönemi boyunca faiz gideri olarak yansıtılır.'
    celdiriciler:
      A: III de doğru olduğundan yalnız I demek eksik cevaptır.
      B: II yanlıştır; finansman bileşeni faiz gideri olarak yansıtılır (par. 18).
      C: I doğru, ancak II yanlıştır; ayrıca III de doğrudur.
      D: II yanlıştır (par. 18); I ise doğru olduğu hâlde bu şıkta yer almamaktadır.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 20
    alinti: Bu Standardın uygulanması açısından bu değer, stokun hasat anındaki maliyetidir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 18
    alinti: Satın alma anlaşmasının etkin bir şekilde bir finansman bileşeni içermesi durumunda bu bileşen (örneğin, normal
      kredi koşulları için geçerli olan satın alma fiyatı ile ödenen tutar arasındaki fark), finansman sağlanan dönem boyunca
      faiz gideri olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: yan ürünler genellikle net gerçekleşebilir değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden düşülür.
