- id: YMM-IFM-STK-0020
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: amortismana tabi olmayan varlığa ilişkin devlet teşviki (arsa) ve kâr veya zarara yansıtma
  tip: hesaplama
  zorluk: 3
  kok: 'Yıldırım Gıda AŞ''ye bir organize sanayi bölgesi idaresi tarafından 2.1.2026''da, üzerine fabrika binası inşa edilmesi
    koşuluyla bir arsa tahsis edilmiştir. Arsanın tahsis tarihindeki gerçeğe uygun değeri 6.000.000 TL''dir; şirket arsayı
    ve teşvikini TMS 20''nin genel yaklaşımına göre gerçeğe uygun değerle kaydetmiş, teşviki ertelenmiş gelir olarak sunmuştur.
    Bina inşa edilmiş ve 1.4.2026''da kullanıma hazır hâle gelmiştir; binanın faydalı ömrü 25 yıl olup doğrusal amortismana
    tabidir. Teşvikin koşulları yerine getirilmiş ve iade yükümlülüğü doğmamıştır. Arsa amortismana tabi tutulmaz.


    Buna göre şirketin 2026 yılı kâr veya zararına yansıyacak devlet teşviki geliri kaç TL''dir?'
  secenekler:
    A: '0'
    B: '180.000'
    C: '240.000'
    D: 5.820.000
    E: 6.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Parasal olmayan teşvik (arsa) gerçeğe uygun değerle kaydedilir (TMS 20 par. 23). Amortismana tabi olmayan
      varlığa ilişkin teşvikler, ilgili yükümlülüklerin yerine getirilmesinde katlanılan maliyetlerin gerçekleştiği dönemler
      boyunca kâr veya zarara alınır; üzerine bina inşa edilmesi koşuluyla verilen arsa teşviki binanın ömrü boyunca muhasebeleştirilir
      (par. 18). Bina 1.4.2026''dan itibaren amortismana başladığından 2026''da 9 ay için gelir yazılır: 6.000.000 / 25 ×
      9/12 = 180.000 TL.


      Püf noktaları: Arsanın kendisi amortismana tabi olmasa da teşvik, bina ömrü boyunca dağıtılır. Dağıtım, binanın kullanıma
      hazır olduğu tarihte (1.4.2026) başlar; tahsis tarihi (2.1.2026) değildir. Ertelenmiş gelir bakiyesi (5.820.000 TL)
      ile yıl içinde gelire alınan tutarı karıştırmayın.'
    celdiriciler:
      A: Arsa amortismana tabi olmadığı için hiç gelir yazılmayacağı düşünülmüştür; oysa teşvik binanın ömrü boyunca kâr veya
        zarara alınır (par. 18).
      C: '6.000.000 / 25: tam yıl için gelir alınmıştır; bina 1.4.2026''da kullanıma hazır olduğundan 2026''da yalnız 9 ay
        söz konusudur.'
      D: 31.12.2026 itibarıyla ertelenmiş gelir bakiyesidir (6.000.000 − 180.000); soru yıl içinde kâr veya zarara yansıyan
        tutarı sormaktadır.
      E: Teşvikin tamamı tahsis tarihinde gelir yazılmıştır; bu yaklaşım tahakkuk esasına uygun değildir (par. 16, 18).
    hesap_adimlari:
    - Teşvik tutarı = 6.000.000 TL; bina ömrü 25 yıl
    - Yıllık gelir = 6.000.000 / 25 = 240.000 TL
    - 2026 (1.4-31.12 = 9 ay) = 240.000 × 9/12 = 180.000 TL
