  tip: kavrama
  zorluk: 2
  kok: 'TSRS 1''i ilk kez uygulayan (J) AŞ''ye ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. İlk uygulama yılında karşılaştırmalı bilgilerin açıklanması zorunlu değildir.

    II. İlk uygulama yılında yalnız iklimle ilgili risk ve fırsatlara ilişkin bilgileri açıklamayı seçebilir; bu durumda bunu
    açıklar.

    III. İlk uygulama yılında da sürdürülebilirlik açıklamalarını finansal tablolarla aynı anda yayımlamak zorundadır; sonradan
    raporlama imkânı yoktur.

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: II ve III
    D: I, II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: 'I: TSRS 1 par. E3''e göre ilk yıllık raporlama döneminde karşılaştırmalı bilgi zorunlu değildir. II: Par.
      E5 bu geçiş muafiyetini tanır ve kullanılması halinde açıklanmasını ister. III yanlıştır: genel kural finansal tablolarla
      aynı zamanda raporlamadır (par. 64), ancak par. E4 ilk yılda açıklamaların finansal tablolardan sonra raporlanmasına
      izin verir.'
    celdiriciler:
      A: II numaralı ifade de par. E5'e göre doğrudur.
      B: I numaralı ifade de par. E3'e göre doğrudur.
      C: III yanlıştır; par. E4 ilk yılda sonradan raporlamaya izin verir.
      D: III numaralı ifade par. E4 geçiş muafiyeti nedeniyle yanlıştır.
