  aciklama:
    dogru_neden: 'Sınıflandırmada bina 650.000 TL''ye indirilir ve 150.000 TL değer düşüklüğü kaydedilir (par. 15, 20). Satış
      amaçlı varlık amortismana tabi tutulmaz (par. 25). Yıl sonundaki artış, muhasebeleştirilmiş birikmiş değer düşüklüğü
