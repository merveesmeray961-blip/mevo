- id: YMM-IFM-TAB-0001
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: TMS 7 nakit akış tablosu
  tip: kavrama
  zorluk: 2
  kok: '(A) AŞ''nin 31.12.2026 itibarıyla aşağıdaki kalemlerinden hangileri TMS 7''ye göre nakit ve nakit benzerleri içinde
    değerlendirilir?

    I. 15.11.2026''da açılan, 2 ay vadeli ve vadesinden önce önemli bir değer kaybı olmadan bozdurulabilen TL mevduat

    II. Borsa İstanbul''da işlem gören ve kısa vadede satılması planlanan hisse senetleri

    III. 01.08.2026''da 9 ay vadeyle edinilen ve raporlama tarihinde vadesine 4 aydan az kalan devlet tahvili

    IV. Talep üzerine geri ödenebilen, bakiyesi sık sık pozitiften negatife dönen ve nakit yönetiminin ayrılmaz parçası olan
    kredili cari hesap

    '
  secenekler:
    A: I ve IV
    B: Yalnız I
    C: I ve III
    D: I, II ve IV
    E: I, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'TMS 7 par. 7''ye göre edinim tarihinden itibaren 3 ay veya daha kısa vadeli, değer değişim riski önemsiz
      yatırım genellikle nakit benzeridir: I nakit benzeridir. Vade edinim tarihinden itibaren ölçüldüğünden III nakit benzeri
      değildir. Özkaynak yatırımları kural olarak nakit benzeri sayılmaz (II). Par. 8''e göre nakit yönetiminin ayrılmaz parçası
      olan kredili cari hesaplar nakit ve nakit benzerlerinin bileşenidir (IV).'
    celdiriciler:
      B: Nakit yönetiminin parçası olan kredili cari hesap da nakit ve nakit benzerlerinin bileşenidir (par. 8).
      C: Tahvilin vadesi edinim tarihinden itibaren 9 aydır; kalan vadeye göre değerlendirme yapılmaz.
      D: Hisse senetleri özkaynak yatırımıdır ve nakit benzeri tanımını karşılamaz.
      E: Edinimde 9 ay vadeli tahvil nakit benzeri değildir.
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 7
    alinti: örneğin edinim tarihinden itibaren 3 ay veya daha kısa bir vadeye, sahip olduğunda genellikle nakit benzeri olarak
      nitelendirilir
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 8
    alinti: Bu durumda, bankalardaki kredili cari hesaplar nakit ve nakit benzerlerinin bir bileşeni olarak değerlendirilir.
  gecerlilik:
