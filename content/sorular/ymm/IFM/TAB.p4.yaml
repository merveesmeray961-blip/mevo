    500.000 TL; banka kredisi kullanımı 2.000.000 TL; kredi anapara geri ödemesi 800.000 TL; TFRS 16 kira yükümlülüğü anapara
    ödemesi 300.000 TL; kredi ve kira faiz ödemeleri toplamı 300.000 TL (şirket ödenen faizi esas faaliyetlerde sınıflandırmaktadır);
