- id: YMM-IFM-TAB-0005
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: TMS 7 nakit akış tablosu
  tip: hesaplama
  zorluk: 3
  kok: (E) AŞ'nin 2026 yılı dönem kârı 1.500.000 TL'dir; dönem kârının içinde 400.000 TL amortisman gideri, 120.000 TL maddi
    duran varlık satış kârı, 200.000 TL banka kredisi faiz gideri ve 80.000 TL kıdem tazminatı karşılık gideri (yıl içinde
    ödeme yapılmamıştır) bulunmaktadır. Faizin tamamı yıl içinde ödenmiş olup şirket ödenen faizi finansman faaliyetlerinde
    sınıflandırmaktadır. Vergi giderinin tamamı yıl içinde ödenmiştir. Ticari alacaklar 250.000 TL artmış, stoklar 100.000
    TL azalmış, ticari borçlar 60.000 TL azalmıştır. TMS 7'ye göre dolaylı yöntemle esas faaliyetlerden kaynaklanan net nakit
    akışı kaç TL'dir?
  secenekler:
    A: 1.650.000 TL
    B: 1.770.000 TL
    C: 1.850.000 TL
    D: 1.970.000 TL
    E: 2.090.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Dolaylı yöntemde dönem kârı nakit dışı kalemlere, yatırım ve finansman faaliyetlerine ait kalemlere ve işletme
      sermayesi değişimlerine göre düzeltilir (TMS 7 par. 20): 1.500.000 + 400.000 (amortisman) + 80.000 (karşılık) − 120.000
      (MDV satış kârı, tahsilatı yatırım faaliyetindedir) + 200.000 (finansmanda sınıflanan faiz) − 250.000 (alacak artışı)
      + 100.000 (stok azalışı) − 60.000 (borç azalışı) = 1.850.000 TL. Püf noktaları: Faiz finansman faaliyetinde sınıflandığı
      için kâra geri eklenir; MDV satış kârı ise satış bedelinin tamamı yatırım faaliyetinde gösterileceğinden kârdan düşülür.
      Vergi ödemesi yıl içinde tamamlandığından ayrıca düzeltme gerekmez.'
    celdiriciler:
      A: Finansman faaliyetinde sınıflanan faiz gideri kâra geri eklenmemiştir.
      B: Nakit çıkışı doğurmayan kıdem tazminatı karşılık gideri kâra eklenmemiştir.
      D: MDV satış kârı kârdan düşülmemiştir; satış bedeli yatırım faaliyetlerindedir.
      E: MDV satış kârı kârdan düşüleceği yerde kâra eklenmiştir.
    hesap_adimlari:
    - 1.500.000 + 400.000 + 80.000 − 120.000 + 200.000 = 2.060.000
    - − 250.000 + 100.000 − 60.000 = −210.000
    - Esas faaliyet nakit akışı = 1.850.000
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 20
    alinti: Amortismanlar, karşılıklar, ertelenmiş vergiler, kur farklarından kaynaklanan gerçekleşmemiş kazanç veya kayıplar
      ve iştiraklerin dağıtılmamış kârları gibi nakit akışı yaratmayan kalemler
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1500000 + 400000 + 80000 - 120000 + 200000 - 250000 + 100000 - 60000
