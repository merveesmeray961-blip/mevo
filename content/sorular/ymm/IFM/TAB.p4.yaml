- id: YMM-IFM-TAB-0003
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: TMS 7 nakit akış tablosu
  tip: hesaplama
  zorluk: 2
  kok: (C) AŞ'nin 2026 yılı net satışları 6.000.000 TL'dir (tamamı vadeli). Ticari alacakların dönem başı bakiyesi 900.000
    TL, dönem sonu bakiyesi 1.300.000 TL'dir. Yıl içinde tahsil imkânı kalmayan 50.000 TL'lik bir alacak, daha önce ayrılan
    karşılıkla kapatılarak kayıtlardan çıkarılmıştır (alacak bakiyeleri karşılık düşülmeden önceki brüt tutarlardır). TMS
    7'ye göre doğrudan yöntemle müşterilerden yapılan tahsilat kaç TL'dir?
  secenekler:
    A: 5.500.000 TL
    B: 5.550.000 TL
    C: 5.600.000 TL
    D: 6.000.000 TL
    E: 6.400.000 TL
  dogru: B
  aciklama:
    dogru_neden: Doğrudan yöntemde gayrisafi nakit tahsilatlar gösterilir (TMS 7 par. 18(a)). Tahsilat = dönem başı alacak
      + satışlar − kayıttan çıkarılan alacak − dönem sonu alacak = 900.000 + 6.000.000 − 50.000 − 1.300.000 = 5.550.000 TL.
      Silinen alacak nakit girişi doğurmamıştır.
    celdiriciler:
      A: Silinen alacak iki kez düşülmüştür.
      C: Kayıttan çıkarılan 50.000 TL alacak tahsilat sayılmıştır; nakit girişi yoktur.
      D: Alacaklardaki artış dikkate alınmamıştır.
      E: Alacak artışı satışlara eklenmiştir; artış tahsilatı azaltır.
    hesap_adimlari:
    - Tahsilat = 900.000 + 6.000.000 − 50.000 − 1.300.000
    - = 5.550.000
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 18(a)
    alinti: Bu yöntemde gayrisafi nakit tahsilatlar ve gayrisafi nakit ödemeler ana gruplar itibarıyla açıklanır.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 900000 + 6000000 - 50000 - 1300000
