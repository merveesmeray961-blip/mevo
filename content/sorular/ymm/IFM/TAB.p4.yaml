    varlık olarak sınıflandırmıştır. Bu tarihte binanın defter değeri 800.000 TL, satış maliyeti düşülmüş gerçeğe uygun değeri
    650.000 TL'dir; bina daha önce değer düşüklüğüne uğramamıştır. 31.12.2026'da bina henüz satılmamış, TFRS 5 şartları sürmekte
