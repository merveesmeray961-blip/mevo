- id: YMM-IFM-TAB-0004
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: TMS 7 nakit akış tablosu
  tip: hesaplama
  zorluk: 3
  kok: Ticaret işletmesi (D) AŞ'nin 2026 yılı satışların maliyeti 4.000.000 TL'dir. Ticari mal stoku dönem başında 700.000
    TL, dönem sonunda 900.000 TL; satıcılara olan ticari borçlar dönem başında 600.000 TL, dönem sonunda 750.000 TL'dir. Satıcılara
    mal alımı için verilen sipariş avanslarının bakiyesi dönem başında 50.000 TL, dönem sonunda 120.000 TL'dir. Tüm alımlar
    bu satıcılardan yapılmış, stoklarda değer düşüklüğü bulunmamaktadır. TMS 7'ye göre doğrudan yöntemle satıcılara yapılan
    nakit ödemeler kaç TL'dir?
  secenekler:
    A: 3.980.000 TL
    B: 4.050.000 TL
    C: 4.120.000 TL
    D: 4.200.000 TL
    E: 4.420.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Dönem alışları = SMM + dönem sonu stok − dönem başı stok = 4.000.000 + 900.000 − 700.000 = 4.200.000 TL.
      Ticari borç artışı (150.000 TL) ödenmemiş alışı gösterir ve ödemeyi azaltır; sipariş avanslarındaki artış (70.000 TL)
      henüz mal gelmeden yapılan nakit ödemedir ve ödemeyi artırır: 4.200.000 − 150.000 + 70.000 = 4.120.000 TL. Püf noktaları:
      Stok, borç ve avans değişimlerinin yönünü ayrı ayrı belirle. Avans artışı nakit çıkışıdır; ticari borç artışı ise nakit
      çıkışını erteler.'
    celdiriciler:
      A: Avans artışı ödemeden düşülmüştür; avans artışı ek nakit çıkışıdır.
      B: Sipariş avanslarındaki artış dikkate alınmamıştır.
      D: Borç ve avans değişimleri dikkate alınmadan dönem alışları ödeme sayılmıştır.
      E: Ticari borç artışı ödemeye eklenmiştir; borç artışı ödemeyi azaltır.
    hesap_adimlari:
    - Alışlar = 4.000.000 + 900.000 − 700.000 = 4.200.000
    - − Ticari borç artışı 150.000
    - + Avans artışı 70.000
    - Ödeme = 4.120.000
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: par. 18(a)
    alinti: Bu yöntemde gayrisafi nakit tahsilatlar ve gayrisafi nakit ödemeler ana gruplar itibarıyla açıklanır.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'alis = 4000000 + 900000 - 700000

      sonuc = alis - (750000 - 600000) + (120000 - 50000)'
