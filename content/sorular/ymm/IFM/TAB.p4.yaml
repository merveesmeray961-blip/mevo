    anaparasını azaltmak amacıyla kiraya verene nakden 360.000 TL ödemiştir. TMS 7'ye göre bu ödeme nakit akış tablosunda
    hangi bölümde sınıflandırılır?
  secenekler:
    A: Esas faaliyetler bölümünde, kira gideri niteliğinde nakit çıkışı olarak
    B: Finansman faaliyetleri bölümünde, kira yükümlülüğünü azaltan nakit çıkışı olarak
    C: Yatırım faaliyetleri bölümünde, kullanım hakkı varlığı edinimine ilişkin nakit çıkışı olarak
    D: Nakit akış tablosunda yer almaz; nakit kullanılmayan işlem olarak dipnotta açıklanır
