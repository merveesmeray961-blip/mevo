- id: YMM-IFM-TAB-0018
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: 'hisse başına kazanç: birikimli imtiyazlı temettü ve ağırlıklı ortalama hisse sayısı'
  tip: hesaplama
  zorluk: 2
  kok: 'Borsada işlem gören Dere AŞ''nin 1.1.2026''da dolaşımda 600.000 adet adi hissesi vardır; 1.7.2026''da nakit karşılığı
    400.000 adet adi hisse ihraç edilmiştir ve bedeli aynı gün tahsil edilmiştir. Ana ortaklığın 2026 net dönem kârı 2.600.000
    TL''dir. Şirketin birikimli imtiyazlı hisseleri için 2026 dönemine ilişkin öngörülen vergi sonrası temettü 200.000 TL''dir
    ve bu temettü 2026''da ilan edilmemiştir. Ayrıca 2025 dönemine ait olup 2026''da ödenen birikmiş imtiyazlı temettü 200.000
    TL''dir. Aylık ağırlıklandırma kullanılacaktır.


    Buna göre 2026 yılı adi hisse başına kazanç kaç TL''dir?'
  secenekler:
    A: 2,40
    B: 2,75
    C: 3,00
    D: 3,25
    E: 3,50
  dogru: C
  aciklama:
    dogru_neden: Birikimli imtiyazlı hisselerde, ilan edilmiş olsun veya olmasın ilgili dönem için öngörülen vergi sonrası
      temettü kârdan düşülür; geçmiş dönemlere ilişkin olarak cari dönemde ödenen tutar bu hesaba katılmaz (TMS 33 par. 14(b)).
      Pay = 2.600.000 − 200.000 = 2.400.000 TL. Ağırlıklı ortalama hisse = 600.000 + 400.000 × 6/12 = 800.000 (par. 19-21).
      HBK = 2.400.000 / 800.000 = 3,00 TL.
    celdiriciler:
      A: '2.400.000 / 1.000.000: payda olarak yıl sonu hisse sayısı alınmıştır; ağırlıklı ortalama kullanılmalıdır.'
      B: '(2.600.000 − 400.000) / 800.000: geçmiş döneme ait ve cari yılda ödenen 200.000 TL de düşülmüştür; par. 14(b) bunu
        dışarıda bırakır.'
      D: '2.600.000 / 800.000: temettü ilan edilmediği için düşülmemiştir; birikimli hissede ilan edilmiş olması aranmaz.'
      E: '(2.600.000 + 200.000) / 800.000: imtiyazlı temettü kâra eklenmiştir; oysa düşülür.'
    hesap_adimlari:
    - Pay = 2.600.000 − 200.000 = 2.400.000
    - Payda = 600.000 + 400.000 × 6/12 = 800.000
    - HBK = 2.400.000 / 800.000 = 3,00
  kaynaklar:
  - mevzuat: TMS 33 Hisse Başına Kazanç
    madde: par. 14(b)
    alinti: İlan edilmiş olsun veya olmasın, birikimli imtiyazlı hisse senetleri ile ilgili olarak ilgili dönem için öngörülen
      temettülerin vergi sonrası tutarı
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'wa = 600000 + 400000*6/12

      sonuc = (2600000 - 200000)/wa'
