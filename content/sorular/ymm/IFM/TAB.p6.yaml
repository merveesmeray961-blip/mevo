- id: YMM-IFM-TAB-0019
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: 'faaliyet bölümleri: raporlanabilir bölümlerin sayısal alt sınırları'
  tip: uygulama
  zorluk: 2
  kok: 'Borsada işlem gören bir grup, faaliyetlerine ilişkin karar almaya yetkili mercii tarafından düzenli olarak gözden
    geçirilen beş faaliyet bölümüne sahiptir. Bölümler birleştirilmemiştir; önceki dönemde raporlanabilir bölüm olarak belirlenen
    ve önemi devam eden bir bölüm yoktur; yönetim eşikleri karşılamayan bölümleri isteğe bağlı olarak ayrıca raporlamamaktadır.
    Dış hasılatın toplamı 8.700, raporlanacak bölümlerin dış hasılatı bu toplamın %75''inin çok üzerindedir. Bölüm bilgileri
    (bin TL):


    | Bölüm | Dış hasılat | Bölümler arası hasılat | Bölüm kârı/(zararı) | Bölüm varlıkları |

    |---|---|---|---|---|

    | Gıda | 4.700 | 300 | 700 | 6.000 |

    | Ambalaj | 2.900 | 100 | 250 | 3.500 |

    | Lojistik | 400 | 800 | 20 | 900 |

    | Enerji | 550 | 50 | (300) | 1.800 |

    | Yazılım | 150 | 50 | 10 | 200 |


    TFRS 8''deki sayısal alt sınırlara (hasılat, kâr veya zarar, varlık) göre aşağıdakilerden hangisi ayrı raporlanması zorunlu
    bölümleri doğru olarak göstermektedir?'
  secenekler:
    A: Yalnız Gıda ve Ambalaj
    B: Gıda, Ambalaj ve Lojistik
    C: Gıda, Ambalaj ve Enerji
    D: Gıda, Ambalaj, Lojistik ve Enerji
    E: Gıda, Ambalaj, Lojistik, Enerji ve Yazılım
  dogru: D
  aciklama:
    dogru_neden: 'Hasılat testinde bölümler arası hasılat da dâhil edilir (toplam 10.000; %10 = 1.000): Gıda (5.000), Ambalaj
      (3.000) ve Lojistik (1.200) geçer. Kâr/zarar testinde kâr eden bölümlerin toplamı 980, zarar edenin 300''dür; Enerji''nin
      zararının mutlak değeri (300) eşiklerin üstündedir. Varlık testinde toplam 12.400, %10 = 1.240: Gıda, Ambalaj ve Enerji
      (1.800) geçer. Yazılım hiçbir testi geçemez. Raporlanması zorunlu olanlar Gıda, Ambalaj, Lojistik ve Enerji''dir. Lojistik
      yalnız bölümler arası satışlar dâhil edildiğinde hasılat eşiğini geçer; Enerji ise zararda olmasına rağmen mutlak zararı
      ve varlıkları nedeniyle raporlanır. (TFRS 8 par. 13)'
    celdiriciler:
      A: Yalnız dış hasılata ve kâra bakıldığında ulaşılan sonuçtur; hasılat testine bölümler arası hasılat da girer ve zarar
        eden bölümler mutlak değerle değerlendirilir.
      B: Zarar eden Enerji dışarıda bırakılmıştır; oysa mutlak zararı (300) ve varlıkları (1.800) eşiklerin üstündedir.
      C: Lojistik dışarıda bırakılmıştır; yalnız dış hasılat (400) esas alındığında eşik altında kalır, ancak bölümler arası
        hasılatla toplam 1.200 olup eşiğin (1.000) üstündedir.
      E: Yazılım'ın hasılatı (200), kârı (10) ve varlıkları (200) üç eşiğin de altındadır; yönetim isteğe bağlı raporlamayı
        da tercih etmemiştir.
    hesap_adimlari:
    - 'Toplam hasılat 10.000 → eşik 1.000: Gıda 5.000, Ambalaj 3.000, Lojistik 1.200 geçer'
    - Kâr toplamı 980, zarar toplamı 300; Enerji |−300| eşiği geçer
    - 'Varlık toplamı 12.400 → eşik 1.240: Gıda, Ambalaj, Enerji geçer'
    - Yazılım hiçbirini geçmez
  kaynaklar:
  - mevzuat: TFRS 8 Faaliyet Bölümleri
    madde: par. 13(a)
    alinti: İşletme dışı müşterilere yapılan satışlar ve bölümler arası satışlar veya transferler de dahil olmak üzere, raporlanan
      hasılatının, işletme içi ve dışı tüm faaliyet bölümlerinin toplam hasılatının yüzde 10'unu veya daha fazlasını oluşturması.
  - mevzuat: TFRS 8 Faaliyet Bölümleri
    madde: par. 13(c)
    alinti: Varlıklarının, tüm faaliyet bölümlerinin toplam varlıklarının yüzde 10'u veya daha fazlası olması.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "seg = [('Gıda',4700,300,700,6000),('Ambalaj',2900,100,250,3500),('Lojistik',400,800,20,900),('Enerji',550,50,-300,1800),('Yazılım',150,50,10,200)]\n\
      rev = 0; var = 0; kar = 0; zar = 0\nfor s in seg:\n    rev += s[1] + s[2]; var += s[4]\n    if s[3] > 0:\n        kar\
      \ += s[3]\n    else:\n        zar += -s[3]\nrep = []\nfor s in seg:\n    if (s[1]+s[2]) >= 0.1*rev or abs(s[3]) >= 0.1*max(kar,\
      \ zar) or s[4] >= 0.1*var:\n        rep.append(s[0])\nsonuc = rep"
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
