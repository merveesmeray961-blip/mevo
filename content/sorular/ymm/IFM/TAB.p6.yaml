- id: YMM-IFM-TAB-0017
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Nakit akış tablosu ve özel raporlama konuları
  konu: TAB
  kazanim: 'hisse başına kazanç: bedelsiz ihraç ve ağırlıklı ortalama hisse sayısı'
  tip: hesaplama
  zorluk: 3
  kok: 'Borsada işlem gören Kuzey Enerji AŞ''nin 1.1.2026''da dolaşımda 1.000.000 adet adi hissesi vardır. 1.4.2026''da nakit
    karşılığı 400.000 adet adi hisse ihraç edilmiş ve bedeli aynı gün tahsil edilmiştir. 1.9.2026''da mevcut tüm hissedarlara,
    sahip oldukları her 100 hisseye karşılık 50 hisse bedelsiz verilmiştir (%50 bedelsiz sermaye artırımı). Ana ortaklığın
    adi hisse sahiplerine düşen 2026 net dönem kârı 3.900.000 TL, 2025 net dönem kârı ise 2.400.000 TL''dir; şirkette imtiyazlı
    hisse ve potansiyel adi hisse bulunmamaktadır. Aylık ağırlıklandırma kullanılacaktır.


    Buna göre 2026 yılı adi hisse başına kazanç kaç TL''dir (iki ondalık basamağa yuvarlanmış)?'
  secenekler:
    A: 1,86
    B: 2,00
    C: 2,17
    D: 2,54
    E: 3,00
  dogru: B
  aciklama:
    dogru_neden: 'Bedelsiz ihraç kaynaklarda değişiklik yaratmadığından hisse sayısı, sanki işlem sunulan en erken dönemin
      başında gerçekleşmiş gibi oransal olarak düzeltilir (TMS 33 par. 26-28). Nakit ihraç, bedelin tahsil edildiği tarihten
      (1.4.2026) itibaren 9 ay ağırlıklandırılır (par. 21(a)). Ağırlıklı ortalama = (1.000.000 + 400.000 × 9/12) × 1,5 = 1.300.000
      × 1,5 = 1.950.000. Adi HBK = 3.900.000 / 1.950.000 = 2,00 TL.


      Püf noktaları: Bedelsiz payı zaman ağırlığıyla azaltmayın; tüm önceki hisselere baştan uygulanır. 2025 kârı gereksiz
      veridir. Yıl sonu hisse sayısı (2.100.000) kullanılamaz.'
    celdiriciler:
      A: '3.900.000 / 2.100.000: yıl sonu hisse sayısı kullanılmıştır; payda ağırlıklı ortalama olmalıdır.'
      C: Bedelsiz ihraç yalnız dönem başı hisselere (1.000.000 × 1,5 + 300.000) uygulanmış, nakit ihraç edilen paylar düzeltmeye
        katılmamıştır.
      D: Bedelsiz hisseler 1.9.2026'dan itibaren 4/12 ağırlıkla hesaba katılmıştır; bedelsiz ihraçta geriye dönük düzeltme
        gerekir.
      E: 'Bedelsiz ihraç hiç dikkate alınmamıştır: 3.900.000 / 1.300.000.'
    hesap_adimlari:
    - Ağırlıklı ortalama = (1.000.000 + 400.000 × 9/12) × 1,5 = 1.950.000
    - HBK = 3.900.000 / 1.950.000 = 2,00
  kaynaklar:
  - mevzuat: TMS 33 Hisse Başına Kazanç
    madde: par. 28
    alinti: Anılan işlem öncesinde mevcut olan adi hisse senetlerinin sayısı, anılan işlemin, sunulan en erken dönemin başında
      gerçekleşmiş olması durumunda mevcut adi hisse senetlerinin sayısında meydana gelecek oransal değişime göre düzeltilir.
  - mevzuat: TMS 33 Hisse Başına Kazanç
    madde: par. 21(a)
    alinti: Nakit karşılığı ihraç edilen adi hisse senetleri, ilgili nakit alacağının doğduğu tarihte;
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'wa = (1000000 + 400000*9/12)*1.5

      sonuc = round(3900000/wa, 2)'
  durum: taslak
