  kok: TMS 24 İlişkili Taraf Açıklamaları'na göre, finansal tablolarını hazırlayan Pınar Lojistik AŞ ile aşağıdaki taraflardan
    hangisi arasındaki ilişki, yalnızca bu ilişkiye dayanılarak ilişkili taraf ilişkisi **sayılmaz**?
  secenekler:
    A: Pınar Lojistik AŞ ile aynı ana ortaklığın %100 bağlı ortaklığı olan, aynı grubun diğer bir üyesi (kardeş şirket)
    B: Pınar Lojistik AŞ'nin genel müdürünün eşinin tek başına kontrol ettiği bir anonim şirket
    C: Pınar Lojistik AŞ'nin sermayesinde %30 paya sahip olduğu ve önemli etki uyguladığı bir iştirak
    D: Pınar Lojistik AŞ çalışanları için işten ayrılma sonrası fayda sağlayan bir yardım vakfı
    E: Pınar Lojistik AŞ yönetim kurulu üyesinin, kontrol veya önemli etkisi bulunmaksızın üye olduğu başka bir şirket
