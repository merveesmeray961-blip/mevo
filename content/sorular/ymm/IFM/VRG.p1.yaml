  kok: Bir varlığın finansal tablolardaki defter değeri 900.000 TL, vergiye esas değeri 700.000 TL’dir. Farkın tamamı vergiye
    tabi geçici farktır ve uygulanacak vergi oranı %25’tir. Ertelenmiş vergi yükümlülüğü kaç TL’dir?
  secenekler:
    A: 25.000 TL
    B: 50.000 TL
    C: 175.000 TL
    D: 200.000 TL
    E: 225.000 TL
  dogru: B
  aciklama:
    dogru_neden: Vergiye tabi geçici fark 900.000 − 700.000 = 200.000 TL; ertelenmiş vergi yükümlülüğü 200.000 × %25 = 50.000
      TL.
    celdiriciler:
      A: Bu seçenek, kökte verilen standart hükmünü veya hesap adımını doğru uygulamamaktadır.
      C: Bu seçenek, kökte verilen standart hükmünü veya hesap adımını doğru uygulamamaktadır.
      D: Bu seçenek, kökte verilen standart hükmünü veya hesap adımını doğru uygulamamaktadır.
      E: Bu seçenek, kökte verilen standart hükmünü veya hesap adımını doğru uygulamamaktadır.
    hesap_adimlari:
    - Fark veya oranı belirle.
    - Verilen oranı ilgili tutara uygula.
    - Sonucu seçeneklerle karşılaştır.
  kaynaklar:
  - mevzuat: TMS 12
    madde: ilgili paragraf
    alinti: "cak gelir vergisini) ifade eder.\n\n         Ertelenmiş vergi borçları: Vergiye tabi geçici farklar üzerinden\
      \ gelecek dönemlerde ödenecek gelir\n         vergilerini ifade eder.\n\n         Ertelenmiş vergi varlıkları: Aşağıdaki\
      \ durumlarda gelecek dönemlerde geri kazanılacak olan gelir\n         vergisi tutarlarını ifade eder:\n\n         (a)\
      \       İndirilebilir geçici farklar;\n         (b)       Gelecek dönemlere devreden kullanılmamış mali zararlar ve\n\
      \         (c)       Gelecek dönemlere devreden kullanılmamış vergi avantajları.\n         Geçici farklar: Bir varlığın\
      \ veya borcun f"
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (900000 - 700000) * 0.25
