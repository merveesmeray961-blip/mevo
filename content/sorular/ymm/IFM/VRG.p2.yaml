  kok: 'Kaya AŞ, 2026 yılı sonunda bir müşterisine 2027 yılında 1.000 adet parçayı adedi 900 TL''den teslim etmeyi öngören
    iptal edilemez bir sözleşmeye taraftır. Hammadde fiyatlarındaki artış nedeniyle 31.12.2026 itibarıyla sözleşmeye ilişkin
    tahminler şöyledir:


    - Direkt ilk madde ve malzeme ile direkt işçilik: adet başına 820 TL

    - Yalnız bu sözleşmede kullanılacak makinenin amortismanından sözleşmeye düşen pay: 150.000 TL

    - Sözleşmeyle doğrudan ilgili olmayan genel yönetim giderlerinden dağıtılacak pay: 50.000 TL

    - Sözleşmenin yerine getirilmemesi hâlinde müşteriye ödenecek ceza: 50.000 TL


    Makinede değer düşüklüğü bulunmamaktadır. TMS 37''ye göre Kaya AŞ''nin 31.12.2026 tarihinde ayıracağı karşılık kaç TL''dir?'
  secenekler:
    A: '0'
    B: '50.000'
    C: '70.000'
    D: '120.000'
    E: '970.000'
  dogru: B
  aciklama:
    dogru_neden: 'Sözleşmeyi yerine getirme maliyeti, sözleşmeyle doğrudan ilgili maliyetlerden oluşur: değişken maliyetler
      820.000 TL + doğrudan ilgili amortisman payı 150.000 TL = 970.000 TL (par. 68A); genel yönetim payı dahil edilmez. Elde
      edilecek fayda 900.000 TL olduğundan sözleşme ekonomik açıdan dezavantajlıdır ve yerine getirmenin net maliyeti 70.000
      TL''dir. Karşılık, sözleşmeden çıkmanın en düşük net maliyetidir: yerine getirme (70.000) ile ceza (50.000) arasından
      düşük olan 50.000 TL (par. 68). Püf noktaları: Yalnız değişken maliyetlere bakan (820.000 < 900.000) aday sözleşmeyi
      dezavantajlı saymaz; 68A uyarınca doğrudan ilgili amortisman payı da yerine getirme maliyetidir. Dezavantaj tespit edildikten
      sonra ceza ile karşılaştırma yapılmalıdır.'
    celdiriciler:
      A: Yalnız değişken maliyetler dikkate alınmış, doğrudan ilgili amortisman payı (68A(b)) ihmal edilmiştir.
      C: Yerine getirmenin net maliyeti bulunmuş, ancak daha düşük olan ceza ile karşılaştırma yapılmamıştır.
      D: Doğrudan ilgili olmayan genel yönetim payı da maliyete katılmış ve ceza ile karşılaştırma yapılmamıştır.
      E: Sözleşmeden elde edilecek fayda düşülmeden toplam yerine getirme maliyeti karşılık sayılmıştır.
    hesap_adimlari:
    - 'Yerine getirme maliyeti: 1.000 × 820 + 150.000 = 970.000'
    - 'Net maliyet: 970.000 − 900.000 = 70.000'
    - 'Ceza: 50.000'
    - 'Karşılık: min(70.000; 50.000) = 50.000'
