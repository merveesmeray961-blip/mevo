- id: YMM-IFM-VRG-0012
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Gelir vergileri ve karşılıklar
  konu: VRG
  kazanim: TMS 37 karşılıklar ve koşullu yükümlülükler
  tip: hesaplama
  zorluk: 2
  kok: 'Teknik AŞ, 2026 yılında sattığı ürünlerde satıştan itibaren bir yıl içinde ortaya çıkacak üretim hatalarının onarımını
    üstlenmektedir. 2026 satışlarına ilişkin veriler şöyledir:


    - Satılan ürünlerin tamamında küçük hata çıkması hâlinde onarım maliyeti: 2.000.000 TL

    - Satılan ürünlerin tamamında büyük hata çıkması hâlinde onarım maliyeti: 6.000.000 TL

    - Geçmiş deneyime göre ürünlerin %80''i hatasız olacak, %15''inde küçük, %5''inde büyük hata çıkacaktır.


    31.12.2026''ya kadar garanti kapsamında harcama yapılmamıştır; paranın zaman değerinin etkisi önemsizdir. TMS 37''ye göre
    31.12.2026 tarihinde ayrılacak garanti karşılığı kaç TL''dir?'
  secenekler:
    A: '0'
    B: '300.000'
    C: '600.000'
    D: 4.000.000
    E: 8.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Karşılık çok sayıda kalemden oluştuğundan tutar, olası sonuçların olasılıklarıyla ağırlıklandırılmasıyla
      (beklenen değer) bulunur (par. 39): (%80 × 0) + (%15 × 2.000.000) + (%5 × 6.000.000) = 300.000 + 300.000 = 600.000 TL.'
    celdiriciler:
      A: En olası tek sonuç (hatasızlık) esas alınmıştır; bu yaklaşım tek bir yükümlülük için kullanılır, çok sayıda kalemde
        beklenen değer uygulanır.
      B: Yalnız küçük hatalar dikkate alınmış, büyük hata olasılığı ihmal edilmiştir.
      D: Sürekli bir sonuç aralığında kullanılan orta nokta yöntemi (2.000.000 ile 6.000.000'un ortası) yanlış uygulanmıştır.
      E: Olasılıklar dikkate alınmadan iki senaryonun toplam maliyeti alınmıştır.
    hesap_adimlari:
    - 'Küçük hata: 2.000.000 × 0,15 = 300.000'
    - 'Büyük hata: 6.000.000 × 0,05 = 300.000'
    - 'Beklenen değer: 300.000 + 300.000 = 600.000'
  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 39
    alinti: Değerleme konusu karşılığın çok sayıda kalemden oluştuğu durumda, ilgili yükümlülük her türlü getiriyi bunlara
      ilişkin olasılıklara göre ağırlıklandırmak suretiyle tahmin edilir.
  gecerlilik: *id001
  dogrulama:
    python: sonuc = 0.80 * 0 + 0.15 * 2000000 + 0.05 * 6000000
