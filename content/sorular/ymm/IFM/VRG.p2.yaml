- id: YMM-IFM-VRG-0013
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Gelir vergileri ve karşılıklar
  konu: VRG
  kazanim: TMS 12 ertelenmiş vergi varlığı ve yükümlülüğü
  tip: hesaplama
  zorluk: 2
  kok: 'Yaprak AŞ''nin 1.1.2026 tarihli finansal durum tablosunda 120.000 TL net ertelenmiş vergi borcu bulunmaktadır. 31.12.2026
    itibarıyla vergiye tabi geçici farkların toplamı 900.000 TL, indirilebilir geçici farkların toplamı 300.000 TL''dir. İndirilebilir
    farkların kullanılmasına yetecek vergiye tabi kâr elde edilmesi muhtemeldir; ertelenmiş vergi varlık ve borçlarının mahsup
    koşulları sağlanmaktadır. Geçici farkların tamamı kâr veya zarara yansıyan işlemlerden doğmuştur. Vergi oranı %25 olup
    dönem içinde değişmemiştir. 2026 yılı dönem vergisi 400.000 TL''dir.


    Buna göre Yaprak AŞ''nin 2026 yılı kâr veya zarar tablosunda yer alacak toplam vergi gideri kaç TL''dir?'
  secenekler:
    A: '370.000'
    B: '400.000'
    C: '430.000'
    D: '550.000'
    E: '625.000'
  dogru: C
  aciklama:
    dogru_neden: Dönem sonu net ertelenmiş vergi borcu = (900.000 − 300.000) × %25 = 150.000 TL. Borç 120.000 TL'den 150.000
      TL'ye çıktığından 30.000 TL ertelenmiş vergi gideri doğar ve geçici farklar kâr veya zarardan kaynaklandığı için kâr
      veya zarara yansır (par. 58). Toplam vergi gideri = 400.000 + 30.000 = 430.000 TL.
    celdiriciler:
      A: Ertelenmiş vergi borcundaki artış gelir olarak (ters işaretle) dikkate alınmıştır.
      B: Yalnız dönem vergisi alınmış, ertelenmiş vergi değişimi ihmal edilmiştir.
      D: Dönem sonu ertelenmiş vergi bakiyesinin tamamı, açılış bakiyesi düşülmeden gider yazılmıştır.
      E: İndirilebilir geçici farklar mahsup edilmeden yalnız vergiye tabi farkların vergi etkisi (225.000) eklenmiştir.
    hesap_adimlari:
    - 'Dönem sonu net EVB: (900.000 − 300.000) × 0,25 = 150.000'
    - 'Değişim: 150.000 − 120.000 = 30.000 ertelenmiş vergi gideri'
    - 'Toplam vergi gideri: 400.000 + 30.000 = 430.000'
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 58
    alinti: Dönem vergisi ve ertelenmiş vergi gelir veya gider olarak, verginin aşağıdaki durumlarda ortaya çıkmamış olması
      koşuluyla, dönemin kâr veya zararına dahil edilir
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 74
    alinti: Bir işletme ertelenmiş vergi varlığı ile ertelenmiş vergi borcunu ancak ve ancak aşağıdaki durumlarda mahsup eder
  gecerlilik: *id002
  dogrulama:
    python: 'acilis = 120000

      kapanis = (900000 - 300000) * 0.25

      sonuc = 400000 + (kapanis - acilis)'
  durum: taslak
  surum: 1
