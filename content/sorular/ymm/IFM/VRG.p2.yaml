- id: YMM-IFM-VRG-0015
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Gelir vergileri ve karşılıklar
  konu: VRG
  kazanim: geçici farklar
  tip: hesaplama
  zorluk: 3
  kok: 'Deniz AŞ''nin 31.12.2026 tarihli finansal tablolarına ilişkin bilgiler şöyledir (vergi oranı %25):


    1. Makinenin defter değeri 1.400.000 TL, vergiye esas değeri (hızlandırılmış vergi amortismanı nedeniyle) 1.000.000 TL''dir.

    2. Ürün garantileri için TMS 37''ye göre 240.000 TL karşılık ayrılmıştır; garanti harcamaları vergi açısından ödendiklerinde
    indirilebilecektir.

    3. Tahakkuk etmiş ancak ödenmemiş 60.000 TL vergi cezası borç olarak kaydedilmiştir; ceza hiçbir dönemde vergi matrahından
    indirilemez.

    4. 2026 yılındaki bir işletme birleşmesinde ilk kez muhasebeleştirilen 500.000 TL şerefiye bulunmaktadır; şerefiyenin
    vergiye esas değeri sıfırdır.

    5. Gelecek yıla ait olup peşin tahsil edilen 80.000 TL kira geliri yükümlülük olarak gösterilmiştir; bu tutar vergi mevzuatına
    göre tahsil edildiği 2026 yılında vergiye tabi tutulmuştur.


    İndirilebilir geçici farkların kullanılmasına yetecek vergiye tabi kâr elde edilmesi muhtemeldir ve mahsup koşulları sağlanmaktadır.
    Buna göre 31.12.2026 tarihli finansal durum tablosunda gösterilecek net ertelenmiş vergi borcu kaç TL''dir?'
  secenekler:
    A: '5.000'
    B: '20.000'
    C: '40.000'
    D: '100.000'
    E: '145.000'
  dogru: B
  aciklama:
    dogru_neden: '(1) Vergiye tabi geçici fark 400.000 TL. (2) Karşılığın vergiye esas değeri sıfır → indirilebilir fark 240.000
      TL. (3) Ceza gelecekte hiç indirilemeyeceğinden borcun vergiye esas değeri defter değerine eşittir → geçici fark yok.
      (4) Şerefiyenin ilk muhasebeleştirilmesinden doğan fark için ertelenmiş vergi borcu ayrılmaz (par. 15(a)). (5) Peşin
      tahsil edilen gelirin vergiye esas değeri = 80.000 − 80.000 = 0 → indirilebilir fark 80.000 TL (par. 8). Net = (400.000
      − 240.000 − 80.000) × %25 = 20.000 TL borç. Püf noktaları: Hiçbir dönemde indirilemeyecek gider geçici fark doğurmaz;
      peşin vergilendirilmiş avans gelirde vergiye esas değer, gelecekte vergilendirilmeyecek tutar düşülerek bulunur ve indirilebilir
      fark çıkar. Şerefiyede ise fark olsa bile istisna nedeniyle ertelenmiş vergi borcu yoktur.'
    celdiriciler:
      A: Vergi cezası indirilebilir geçici fark gibi dikkate alınmıştır ((400 − 240 − 80 − 60) × %25).
      C: Peşin tahsil edilip vergilendirilmiş kira gelirinden doğan indirilebilir fark ihmal edilmiştir.
      D: Yalnız makineden doğan ertelenmiş vergi borcu alınmış, indirilebilir farklar mahsup edilmemiştir.
      E: Şerefiye için de ertelenmiş vergi borcu hesaplanmıştır; par. 15(a) buna izin vermez.
    hesap_adimlari:
    - 'Vergiye tabi fark: 1.400.000 − 1.000.000 = 400.000'
    - 'İndirilebilir farklar: 240.000 (garanti) + 80.000 (peşin gelir) = 320.000'
    - 'Ceza ve şerefiye: ertelenmiş vergi yok'
    - 'Net EVB: (400.000 − 320.000) × 0,25 = 20.000'
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 8
    alinti: Avans olarak alınmış olan hasılat örneğinde, ilgili borcun vergiye esas değeri alınan avansın tutarından gelecek
      dönemlerde vergiye tabi olmayacak olan gelir tutarları düşüldükten sonra kalan değerdir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 15(a)
    alinti: Şerefiyenin ilk muhasebeleştirilmesinden kaynaklanan vergilendirilebilir geçici farklar için
