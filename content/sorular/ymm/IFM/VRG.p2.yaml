  ders: IFM
  unite: Gelir vergileri ve karşılıklar
  konu: VRG
  kazanim: TMS 37 karşılıklar ve koşullu yükümlülükler
  tip: uygulama
  zorluk: 1
  kok: Ege AŞ, rakibine karşı açtığı patent ihlali davasını 2026 yılında ilk derece mahkemesinde kazanmış; karar karşı tarafça
    kanun yoluna taşınmıştır. Avukatlar, 2.000.000 TL tazminatın tahsil edilmesini olası (gerçekleşme olasılığı gerçekleşmeme
    olasılığından yüksek) ancak neredeyse kesin olmayan bir durum olarak değerlendirmektedir. TMS 37'ye göre Ege AŞ'nin 31.12.2026
    tarihli finansal tablolarında yapılacak işlem hangisidir?
  secenekler:
    A: 2.000.000 TL alacak ve gelir finansal tablolara alınır
    B: Tahsil olasılığıyla ağırlıklandırılmış tutar kadar alacak ve gelir finansal tablolara alınır
    C: Varlık finansal tablolara alınmaz, dipnotta da açıklanmaz; karar kesinleşince gelir yazılır
    D: 2.000.000 TL alacak kaydedilir; karşılığı gelecek dönemlere ait gelir olarak pasifte izlenir
    E: Varlık finansal tablolara alınmaz; fayda girişi olası olduğundan dipnotlarda açıklanır
  dogru: E
  aciklama:
    dogru_neden: Sonucu belli olmayan dava hakkı koşullu varlıktır ve finansal tablolara alınmaz (par. 31-33). Ekonomik fayda
      girişi olası olduğundan dipnotlarda açıklanır (par. 34). Varlık ancak fayda girişi neredeyse kesin hâle geldiğinde finansal
      tablolara alınır (par. 35).
    celdiriciler:
      A: Fayda girişi neredeyse kesin olmadığından varlık ve gelir kaydı yapılamaz.
      B: Olasılık ağırlıklandırması koşullu varlığı finansal tablolara almanın yolu değildir; varlık hiç alınmaz.
      C: Fayda girişi olası olduğundan dipnot açıklaması zorunludur.
      D: Koşullu varlık, pasifte ertelenmiş gelir karşılığında da olsa aktife alınamaz.
  kaynaklar:
