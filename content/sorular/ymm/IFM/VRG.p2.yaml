- id: YMM-IFM-VRG-0014
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Gelir vergileri ve karşılıklar
  konu: VRG
  kazanim: TMS 19 kıdem tazminatı karşılığı
  tip: hesaplama
  zorluk: 2
  kok: 'Yıldız AŞ''nin kıdem tazminatı yükümlülüğüne (fonlanmamış tanımlanmış fayda planı) ilişkin 2026 yılı verileri şöyledir:


    - 1.1.2026 tanımlanmış fayda yükümlülüğünün bugünkü değeri: 2.000.000 TL

    - Yıllık raporlama döneminin başında belirlenen iskonto oranı: %15

    - 2026 cari dönem hizmet maliyeti: 250.000 TL

    - 31.12.2026''da işten ayrılanlara ödenen kıdem tazminatı: 400.000 TL

    - Aktüeryal değerlemeye göre 31.12.2026 tanımlanmış fayda yükümlülüğünün bugünkü değeri: 2.350.000 TL


    Planda değişiklik, küçülme veya yerine getirme olmamıştır. TMS 19''a göre bu plana ilişkin olarak Yıldız AŞ''nin 2026
    yılı kâr veya zararında muhasebeleştirilecek toplam gider kaç TL''dir?'
  secenekler:
    A: '250.000'
    B: '550.000'
    C: '650.000'
    D: '750.000'
    E: '950.000'
  dogru: B
  aciklama:
    dogru_neden: Hizmet maliyeti ve net faiz kâr veya zararda, yeniden ölçümler diğer kapsamlı gelirde muhasebeleştirilir
      (par. 120). Net faiz = 2.000.000 × %15 = 300.000 TL (ödeme yıl sonunda yapıldığından faiz açılış bakiyesi üzerinden
      hesaplanır). Kâr veya zarar = 250.000 + 300.000 = 550.000 TL. Beklenen kapanış 2.000.000 + 250.000 + 300.000 − 400.000
      = 2.150.000 TL; aktüeryal kapanış 2.350.000 TL olduğundan 200.000 TL aktüeryal kayıp diğer kapsamlı gelirde muhasebeleştirilir
      ve sonradan kâr veya zarara aktarılmaz (par. 122).
    celdiriciler:
      A: Net faiz de kâr veya zararda muhasebeleştirilir; yalnız hizmet maliyeti alınmıştır.
      C: Faiz yerine ödenen tazminat (400.000) gider sayılmıştır; ödeme yükümlülüğü azaltır, gider değildir.
      D: 200.000 TL'lik aktüeryal kayıp da kâr veya zarara alınmıştır; yeniden ölçümler diğer kapsamlı gelirdedir.
      E: Hizmet maliyeti ve faize ödenen tazminat da eklenmiştir.
    hesap_adimlari:
    - 'Net faiz: 2.000.000 × 0,15 = 300.000'
    - 'K/Z: 250.000 + 300.000 = 550.000'
    - 'Beklenen kapanış: 2.000.000 + 250.000 + 300.000 − 400.000 = 2.150.000'
    - 'DKG (aktüeryal kayıp): 2.350.000 − 2.150.000 = 200.000'
  kaynaklar:
  - mevzuat: TMS 19 Çalışanlara Sağlanan Faydalar
    madde: par. 120
    alinti: 'Tanımlanmış net fayda borcuna (varlığına) ilişkin net faizi (bakınız: 123 – 126 paragrafları) kâr veya zararda
      ve (c) Tanımlanmış net fayda borcunun (varlığının) yeniden ölçümlerini (bakınız: 127 – 130 paragrafları) diğer kapsamlı
      gelirde.'
  - mevzuat: TMS 19 Çalışanlara Sağlanan Faydalar
    madde: par. 123
    alinti: İşletme tanımlanmış net fayda borcuna (varlığına) ilişkin net faizi, tanımlanmış net fayda borcu (varlığı) ile
      83'üncü paragrafta belirtilen iskonto oranının çarpımıyla belirler.
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'faiz = 2000000 * 0.15

      sonuc = 250000 + faiz'
