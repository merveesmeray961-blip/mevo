  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: ertelenmiş verginin yasalaşmış vergi oranıyla ölçülmesi (oran değişikliği)
  tip: hesaplama
  zorluk: 3
  kok: (T) AŞ'nin 31.12.2025 tarihli finansal durum tablosunda, 1.200.000 TL vergiye tabi geçici fark (makine amortismanı)
    için %25 oranıyla 300.000 TL ertelenmiş vergi yükümlülüğü bulunmaktadır. 31.12.2026'da vergiye tabi geçici fark 2.000.000
    TL'ye yükselmiştir; farkın 1.000.000 TL'si 2027'de, 1.000.000 TL'si 2028'de tersine dönecektir. Varsayım olarak, kurumlar
    vergisi oranını 2027 ve sonraki dönemler için %30 yapan kanun 20.12.2026'da Resmî Gazete'de yayımlanarak yasalaşmıştır.
    Başka geçici fark yoktur. TMS 12'ye göre 2026 yılı kâr veya zarar tablosunda muhasebeleştirilecek ertelenmiş vergi gideri
    kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '240.000'
    C: '250.000'
    D: '300.000'
    E: '600.000'
  dogru: D
  aciklama:
    dogru_neden: 'TMS 12 par. 46-47''ye göre ertelenmiş vergi, raporlama dönemi sonunda yürürlükte olan veya yürürlüğe girmesi
      kesine yakın olan oranlarla, farkların tersine döneceği dönemlerde uygulanması beklenen oran kullanılarak hesaplanır.
      Farkın tamamı 2027 ve 2028''de tersine döneceğinden oran %30''dur: 31.12.2026 bakiyesi 2.000.000 × %30 = 600.000 TL.
      Açılış 300.000 TL olduğundan gider 600.000 − 300.000 = 300.000 TL''dir (240.000 TL yeni farktan [800.000 × %30], 60.000
      TL oran artışının açılış bakiyesine etkisinden [1.200.000 × %5]). Oran değişikliğinin etkisi par. 60 uyarınca kâr veya
      zararda muhasebeleştirilir.


      Püf noktaları: (1) Ölçümde bugünkü oran değil, tersine dönüş dönemindeki yasalaşmış oran esastır. (2) Oran değişikliği
      açılış bakiyesini de yeniden ölçer. (3) Gider, kapanış bakiyesi değil bakiyedeki değişimdir.

      '
    celdiriciler:
      A: Mevcut %25 oranı kullanılmıştır (500.000 − 300.000); yasalaşmış %30 oranı dikkate alınmamıştır.
      B: Yalnızca yıl içindeki artış (800.000) %30 ile ölçülmüş, açılış bakiyesinin yeniden ölçümü unutulmuştur.
      C: '%30 oranı yalnızca 2027''de tersine dönecek kısma uygulanmış, 2028 için %25 alınmıştır; oysa kanun 2027 ve sonrası
        için geçerlidir.'
      E: Kapanış bakiyesi (600.000) gider olarak alınmış, açılış bakiyesi düşülmemiştir.
    hesap_adimlari:
    - Kapanış = 2.000.000 × %30 = 600.000
    - Gider = 600.000 − 300.000 = 300.000
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 47
    alinti: Ertelenmiş vergi varlıkları veya borçları raporlama dönemi sonu itibariyle yürürlükte olan veya yürürlüğe girmesi
      kesine yakın olan vergi oranlarına (ve vergi kanunlarına) dayanılarak varlıkların gelire dönüştüğü veya borçların ödendiği
      dönemlerde uygulanması beklenen vergi oranları kullanılmak suretiyle hesaplanır.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 60(a)
    alinti: 'Ertelenmiş vergi varlıklarının ve vergi borçlarının defter değerleri, bunlarla ilgili geçici farkların değerlerinde
      bir değişikliğin olmaması halinde dahi değişebilir. Bu değişiklikler aşağıdaki durumlarda ortaya çıkabilir: (a) Vergi
      oranlarında veya vergi kanunlarında değişiklikler olması;'
  gecerlilik:
    baslangic: '2006-01-01'
    bitis: null
    yila_bagli_tutar: false
