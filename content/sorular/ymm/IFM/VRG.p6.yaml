  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: şüpheli alacak karşılığı (VUK md. 323) ile TFRS 9 beklenen kredi zararı farkından ertelenmiş vergi
  tip: hesaplama
  zorluk: 3
  kok: '(V) AŞ''nin 31.12.2026 itibarıyla TFRS 9''a göre tamamı için karşılık ayırdığı (beklenen kredi zararı alacak tutarının
    %100''üdür) alacaklar şöyledir: P: 24.000 TL, yazı ile iki kez istenmiş ve ödenmemiştir; Q: 46.000 TL, yazı ile iki kez
    istenmiş ve ödenmemiştir, dava veya icra yoktur; R: 90.000 TL, icra takibine konulmuştur; S: 20.000 TL, vadesi geçmiştir
    ancak yazılı istek, protesto, dava veya icra yoktur. Alacaklar teminatsızdır. VUK md. 323''teki şüpheli alacak üst sınırı
    2026 yılı için 25.000 TL''dir. İşletme VUK md. 323 kapsamında ayrılabilecek karşılıkların tamamını ayırarak kurumlar vergisi
    matrahından indirmiştir. Kurumlar vergisi oranı %25''tir ve vergiye tabi kâr elde edilmesi muhtemeldir. TMS 12''ye göre
    bu alacaklara ilişkin ertelenmiş vergi varlığı kaç TL''dir?'
  secenekler:
    A: '5.000'
    B: '16.500'
    C: '22.500'
    D: '45.000'
    E: '66.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 323''e göre dava veya icra safhasındaki alacaklar ile yazı ile bir defadan fazla istenmesine rağmen
      ödenmemiş ve üst sınırı (2026: 25.000 TL) aşmayan alacaklar şüpheli alacaktır. P (24.000) ve R (90.000) şüpheli sayılır;
      Q sınırı aşar ve dava/icra yoktur, S ise hiçbir şartı sağlamaz. Vergi açısından ayrılabilecek karşılık 114.000 TL''dir.
      TFRS karşılığı 180.000 TL, vergi açısından indirilen 114.000 TL olduğundan vergiye esas değer (180.000 − 114.000) =
      66.000 TL, defter değeri 0''dır; indirilebilir geçici fark 66.000 TL ve ertelenmiş vergi varlığı 66.000 × %25 = 16.500
      TL''dir.


      Püf noktaları: (1) Üst sınır yıla bağlıdır; 2026 için 25.000 TL''dir. (2) Sınırı aşan alacak yalnızca dava veya icra
      safhasındaysa şüpheli sayılır. (3) Geçici fark, TFRS karşılığı ile vergide indirilen karşılık arasındaki farktır. (4)
      Fark tutarı vergi oranıyla çarpılır.

      '
    celdiriciler:
      A: Q alacağı da şüpheli sayılmış (160.000 indirilmiş), fark 20.000 bulunmuştur; oysa Q sınırı aşar ve dava/icra yoktur.
      C: P alacağı şüpheli sayılmamış, fark 90.000 bulunmuştur; oysa P yazılı iki istekle ve sınır altında olduğundan şüpheli
        alacaktır.
      D: VUK karşılığı hiç dikkate alınmamış, TFRS karşılığının tamamı geçici fark sayılmıştır (180.000 × %25).
      E: Geçici fark doğru bulunmuş (66.000) ancak vergi oranı uygulanmamıştır.
    hesap_adimlari:
    - 'VUK''a göre şüpheli: P 24.000 + R 90.000 = 114.000'
    - Fark = 180.000 − 114.000 = 66.000
    - Ertelenmiş vergi varlığı = 66.000 × %25 = 16.500
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 323/1-2
    alinti: Yapılan protestoya veya yazı ile bir defadan fazla istenilmesine rağmen borçlu tarafından ödenmemiş bulunan ve
      3.000 (25.000) Türk lirasını aşmayan alacaklar;
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 323/1-1
    alinti: Dava veya icra safhasında bulunan alacaklar;
  - mevzuat: 588 Sıra No.lu Vergi Usul Kanunu Genel Tebliği
    madde: md. 323
    alinti: MADDE 323 Şüpheli alacak tutarı 25.000
  gecerlilik:
