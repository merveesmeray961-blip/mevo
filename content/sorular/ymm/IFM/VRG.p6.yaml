      A: Yalnızca kullanılamayacak kısmın silinmesi (240.000 × %25) alınmış, zararın kullanımı unutulmuştur.
      B: Yalnızca kullanılan zarar (400.000 × %25) alınmış, değer azaltımı unutulmuştur.
      D: Kapanış bakiyesi (200.000) gider sanılmıştır; gider bakiyedeki değişimdir.
      E: Açılıştan yalnızca kullanım düşülerek bulunan bakiye (260.000) gider sanılmıştır ve değer azaltımı yapılmamıştır.
    hesap_adimlari:
    - Gerekli ertelenmiş vergi varlığı = 800.000 × %25 = 200.000
    - Gider = 360.000 − 200.000 = 160.000
