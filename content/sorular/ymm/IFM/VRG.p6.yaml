  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: karşılık ayrılması ve ayrılmaması gereken durumlar (gelecekteki faaliyetlerden bağımsız yükümlülük)
  tip: kavrama
  zorluk: 1
  kok: 31.12.2026 tarihli finansal tablolar hazırlanırken, diğer koşulların sağlandığı ve tutarın güvenilir biçimde tahmin
    edilebildiği varsayımıyla, aşağıdaki durumlardan hangisi için TMS 37'ye göre karşılık ayrılır?
  secenekler:
    A: Önümüzdeki yıllarda faaliyetlerden zarar edileceği beklentisi nedeniyle gelecekteki faaliyet zararları
    B: Yasal zorunluluk nedeniyle gelecek yıl fabrikaya taktırılacak duman filtresi harcamaları; işletme faaliyet yöntemini
      değiştirerek bu harcamadan kaçınabilmektedir
    C: Çevreye yasa dışı biçimde verilen zararın giderilmesi için katlanılacak temizleme maliyetleri ve bunun için işletmenin
      üstlendiği sorumluluk
    D: Henüz yasalaşmamış bir kanun tasarısının getireceği uyum maliyetleri; tasarının aynen yasalaşacağı kesin değildir
    E: Yönetim kurulunun aldığı, ancak etkilenenlere duyurulmamış ve beklenti oluşturulmamış bir tesis kapatma kararı kapsamındaki
      maliyetler
  dogru: C
  aciklama:
    dogru_neden: TMS 37 par. 19'a göre karşılık olarak muhasebeleştirilen tutarlar, işletmenin gelecekteki faaliyetlerinden
      bağımsız ve geçmişte oluşmuş olaylardan kaynaklanan yükümlülüklerdir. Çevreye yasa dışı biçimde verilen zararın temizleme
      maliyeti, işletmenin gelecekteki davranışlarına bağlı olmaksızın kaynak çıkışına yol açtığından karşılık konusudur.
    celdiriciler:
      A: Gelecekteki faaliyet zararları için karşılık ayrılmaz (par. 63); beklenen zarar, varlıklarda değer düşüklüğü göstergesi
        olarak TMS 36 kapsamında değerlendirilir.
      B: İşletme faaliyet yöntemini değiştirerek harcamadan kaçınabildiğinden mevcut bir yükümlülük yoktur; karşılık ayrılmaz
        (par. 19).
      D: Yeni kanun tasarısı için yalnızca tasarının aynen yasalaşacağının kesin olması halinde yükümlülük doğar (par. 22).
      E: Karar, etkilenenlere duyurulmadığı sürece zımni olarak kabulden doğan bir yükümlülük doğurmaz (par. 20).
  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 19
    alinti: Karşılık olarak finansal tablolara yansıtılan tutarlar, işletmenin gelecek dönem faaliyetlerinden (işletmenin
