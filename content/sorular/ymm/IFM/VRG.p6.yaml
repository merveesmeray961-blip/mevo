  konu: VRG
  kazanim: ertelenmiş vergi varlığının her bilanço tarihinde gözden geçirilmesi (mali zarar)
  tip: hesaplama
  zorluk: 2
  kok: (S) AŞ'nin 31.12.2025 tarihli finansal durum tablosunda, 1.440.000 TL kullanılmamış mali zarar için %25 oranıyla 360.000
    TL ertelenmiş vergi varlığı bulunmaktadır. 2026 yılında 400.000 TL mali zarar vergi matrahından mahsup edilerek kullanılmıştır.
    Kalan 1.040.000 TL mali zararın 31.12.2026 itibarıyla yalnızca 800.000 TL'sini mahsup etmeye yetecek vergiye tabi kâr
    elde edilmesi muhtemeldir. Başka geçici fark yoktur. TMS 12'ye göre 2026 yılı kâr veya zarar tablosunda muhasebeleştirilecek
    ertelenmiş vergi gideri kaç TL'dir?
  secenekler:
    A: '60.000'
    B: '100.000'
    C: '160.000'
    D: '200.000'
    E: '260.000'
  dogru: C
  aciklama:
    dogru_neden: '31.12.2026''da gerekli ertelenmiş vergi varlığı 800.000 × %25 = 200.000 TL''dir (TMS 12 par. 56: yeterli
      vergiye tabi kâr olasılığı yoksa defter değeri azaltılır). Açılış bakiyesi 360.000 TL olduğundan ertelenmiş vergi gideri
      360.000 − 200.000 = 160.000 TL''dir; bunun 100.000 TL''si zararın kullanımından (400.000 × %25), 60.000 TL''si kullanılamayacak
      kısmın (240.000 × %25) silinmesinden gelir.'
