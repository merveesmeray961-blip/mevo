- id: YMM-IFM-VRG-0052
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: 'ilk muhasebeleştirme istisnasının sınırı: eşit tutarlı vergiye tabi ve indirilebilir geçici farklar (kiralama)'
  tip: kavrama
  zorluk: 2
  kok: Kiracı (N) AŞ, 1.1.2026 tarihinde bir kiralama sözleşmesinin başlangıcında 1.000.000 TL kira yükümlülüğü ve aynı tutarda
    kullanım hakkı varlığı finansal tablolara almıştır. Vergi mevzuatına göre kira ödemeleri ödendiği dönemde gider yazılmakta,
    kullanım hakkı varlığının amortismanı vergi açısından ayrıca indirim konusu yapılmamaktadır; dolayısıyla her ikisinin
    de vergiye esas değeri sıfırdır. Kurumlar vergisi oranı %25'tir ve gelecekte yeterli vergiye tabi kâr elde edilmesi muhtemeldir.
    TMS 12'ye göre kiralama başlangıcında ertelenmiş vergi bakımından aşağıdakilerden hangisi yapılır? (Mahsup şartlarının
    sağlanıp sağlanmadığı dikkate alınmayacaktır.)
  secenekler:
    A: 250.000 TL ertelenmiş vergi varlığı ve 250.000 TL ertelenmiş vergi yükümlülüğü ayrı ayrı finansal tablolara alınır
    B: İşlem ne muhasebe kârını ne de vergiye tabi kârı etkilediğinden ilk muhasebeleştirme istisnası uygulanır; ertelenmiş
      vergi hesaplanmaz
    C: Yalnızca kullanım hakkı varlığından doğan 250.000 TL ertelenmiş vergi yükümlülüğü finansal tablolara alınır
    D: Yalnızca kira yükümlülüğünden doğan 250.000 TL ertelenmiş vergi varlığı finansal tablolara alınır
    E: Farklar birbirini götürdüğünden net tutar sıfırdır; bu nedenle varlık ve yükümlülük için hiçbir kayıt yapılmaz, yalnızca
      dipnotta açıklanır
  dogru: A
  aciklama:
    dogru_neden: Kiralama başlangıcında ne muhasebe kârı ne de vergiye tabi kâr etkilenir; ancak kira yükümlülüğü (indirilebilir
      fark 1.000.000) ve kullanım hakkı varlığı (vergiye tabi fark 1.000.000) eşit tutarlarda vergiye tabi ve indirilebilir
      geçici farklar doğurur. TMS 12 par. 22A uyarınca 15. ve 24. paragraflardaki ilk muhasebeleştirme istisnaları bu durumda
      uygulanmaz; işletme hem ertelenmiş vergi varlığını (1.000.000 × %25 = 250.000) hem de ertelenmiş vergi yükümlülüğünü
      (250.000) finansal tablolara alır.
    celdiriciler:
      B: Eşit tutarlarda vergiye tabi ve indirilebilir geçici farklar doğuran işlemlerde istisna uygulanmaz (par. 15(b)(iii),
        22A).
      C: Kullanım hakkı varlığı kadar ertelenmiş vergi yükümlülüğü muhasebeleştirilir; ancak buna karşılık gelen ertelenmiş
        vergi varlığı da muhasebeleştirilir (par. 22A).
      D: Kira yükümlülüğü için ertelenmiş vergi varlığı muhasebeleştirilir; ancak buna karşılık gelen ertelenmiş vergi yükümlülüğü
        de muhasebeleştirilir (par. 22A).
      E: Net tutarın sıfır olması kayıt yapılmamasını haklı kılmaz; mahsup, ancak par. 74'teki şartlar varsa sunumda yapılabilir,
        muhasebeleştirme brüt yapılır.
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 22A
    alinti: Bu tür bir işlemde oluşan varlığın ve yükümlülüğün ilk muhasebeleştirilmesi, mevzuata bağlı olarak eşit tutarlarda
      vergiye tabi ve indirilebilir geçici farkların ortaya çıkmasına sebep olabilir. 15'inci ve 24'üncü paragraflarda getirilen
      istisnalar ise, bu tür geçici farklara uygulanmaz ve işletme söz konusu işlem sonucunda ortaya çıkan ertelenmiş vergi
      yükümlülüğü ve varlığını finansal tablolara alır.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
    yila_bagli_tutar: false
