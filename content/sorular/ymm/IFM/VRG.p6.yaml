- id: YMM-IFM-VRG-0049
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: dönem vergisi borcu ve dönem vergisi varlığının muhasebeleştirilmesi
  tip: uygulama
  zorluk: 1
  kok: (L) AŞ'nin 2026 yılı kurumlar vergisi beyannamesine göre hesaplanan dönem vergisi borcu 900.000 TL'dir. Şirket yıl
    içinde toplam 1.050.000 TL geçici vergi ödemiştir ve fazla ödenen tutar ileride mahsup edilecek veya iade alınabilecektir.
    TMS 12'ye göre 31.12.2026 tarihli finansal durum tablosunda dönem vergisine ilişkin olarak yer alacak kalem aşağıdakilerden
    hangisidir?
  secenekler:
    A: 150.000 TL tutarında dönem vergisi borcu
    B: 900.000 TL tutarında dönem vergisi borcu
    C: 1.050.000 TL tutarında dönem vergisi varlığı
    D: 150.000 TL tutarında ertelenmiş vergi varlığı
    E: 150.000 TL tutarında dönem vergisi varlığı
  dogru: E
  aciklama:
    dogru_neden: TMS 12 par. 12'ye göre cari dönem ve önceki dönemler için ödenen vergiler bu dönemlere ait vergiden fazla
      ise aşan kısım varlık (vergi varlığı) olarak muhasebeleştirilir. Dönem vergisi borcu 900.000 TL, ödenen vergi 1.050.000
      TL olduğundan 1.050.000 − 900.000 = 150.000 TL dönem vergisi varlığı oluşur.
    celdiriciler:
      A: Ödenen vergi, hesaplanan vergiden fazla olduğundan borç değil, aşan tutar kadar varlık oluşur.
      B: Yıl içinde ödenen geçici vergiler borçtan düşülür; 900.000 TL'nin tamamı ödenmiş olduğundan borç kalmaz.
      C: Varlık, ödenen verginin tamamı değil, hesaplanan vergiyi aşan kısımdır; 1.050.000 TL'nin tamamı varlık değildir.
      D: Ertelenmiş vergi, defter değeri ile vergiye esas değer arasındaki geçici farklardan doğar; fazla ödenen geçici vergi
        dönem vergisi varlığıdır.
    hesap_adimlari:
    - Ödenen vergi − hesaplanan vergi = 1.050.000 − 900.000 = 150.000 (dönem vergisi varlığı)
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 12
    alinti: Cari dönemin ve önceki dönemlerin vergileri, henüz ödenmemiş kısımla sınırlı olmak üzere, borç olarak muhasebeleştirilir.
      Eğer cari dönem ve önceki dönemler için ödenen vergiler bu dönemlere ait vergiden fazla ise aşan kısım varlık (vergi
      varlığı) olarak muhasebeleştirilir.
  gecerlilik:
    baslangic: '2006-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 1050000 - 900000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
