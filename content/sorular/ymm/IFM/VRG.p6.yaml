- id: YMM-IFM-VRG-0053
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: vergiye tabi olmayan devlet teşvikinin varlığın defter değerinden indirilmesi ve ertelenmiş vergi
  tip: hesaplama
  zorluk: 3
  kok: (P) AŞ, 1.1.2026'da 1.000.000 TL'ye bir makine satın almış ve bu makine için vergiye tabi olmayan 200.000 TL devlet
    hibesi almıştır. İşletme hibeyi, makinenin defter değerinden indirerek muhasebeleştirmiştir. Vergi mevzuatında amortismana
    tabi değer hesaplanırken hibe düşülmemektedir. Makine 5 yıl boyunca, kalıntı değersiz ve doğrusal yöntemle hem finansal
    tablolarda hem vergi açısından amortismana tabi tutulmaktadır. Kurumlar vergisi oranı %25'tir ve yeterli vergiye tabi
    kâr elde edilmesi muhtemeldir. TMS 12'ye göre 31.12.2027 tarihli finansal durum tablosunda bu makineye ilişkin olarak
    muhasebeleştirilecek ertelenmiş vergi varlığı kaç TL'dir?
  secenekler:
    A: 0 TL (muhasebeleştirilmez)
    B: 30.000 TL tutarında varlık
    C: 40.000 TL tutarında varlık
    D: 50.000 TL tutarında varlık
    E: 120.000 TL tutarında varlık
  dogru: A
  aciklama:
    dogru_neden: '31.12.2027''de makinenin defter değeri 800.000 × 3/5 = 480.000 TL, vergiye esas değeri 1.000.000 × 3/5 =
      600.000 TL''dir; aradaki 120.000 TL indirilebilir geçici farktır. Ancak bu fark, vergiye tabi olmayan devlet teşvikinin
      defter değerinden indirilmesi nedeniyle varlığın ilk muhasebeleştirilmesinden kaynaklanmaktadır. TMS 12 par. 33 uyarınca
      işletme bu durumda 22. paragrafta açıklanan nedenle ertelenmiş vergi varlığı muhasebeleştiremez; sonraki dönemlerdeki
      değişiklikler de muhasebeleştirilmez. Bu nedenle ertelenmiş vergi varlığı sıfırdır.


      Püf noktaları: (1) İndirilebilir geçici fark hesaplanır, ancak ilk muhasebeleştirme istisnası nedeniyle ertelenmiş vergi
      hesaplanmaz. (2) İstisna yalnızca ilk günü değil, sonraki yıllarda aynı farkın değişmesini de kapsar. (3) Hibe, ertelenmiş
      gelir olarak sunulsa da sonuç aynıdır. (4) Yıl sayısı ve kurumlar vergisi oranı sonucu etkilemez.

      '
    celdiriciler:
      B: 120.000 × %25 = 30.000 TL hesaplanmıştır; ancak bu fark ilk muhasebeleştirme istisnası kapsamında olduğundan ertelenmiş
        vergi varlığı muhasebeleştirilemez.
      C: 2026 sonundaki fark (160.000 TL) üzerinden hesaplanmıştır; hem tutar yanlıştır hem de istisna nedeniyle ertelenmiş
        vergi varlığı muhasebeleştirilemez.
      D: Hibe tutarı (200.000 TL) × %25 alınmıştır; fark amortisman nedeniyle değişse de ertelenmiş vergi varlığı muhasebeleştirilemez.
