  konu: VRG
  kazanim: karşılığın bugünkü değere indirilmesi ve zaman geçişinin etkisi (borçlanma maliyeti)
  tip: hesaplama
  zorluk: 3
  kok: (U) AŞ aleyhine açılan bir davada, hukuk müşavirliği kaybetme olasılığının yüksek olduğunu bildirmiştir. 31.12.2026
    itibarıyla en iyi tahmin, 31.12.2029'da 2.662.000 TL ödenmesidir; paranın zaman değerinin etkisi önemlidir ve vergi öncesi
    iskonto oranı %10'dur. 31.12.2027'de ödemenin yine 31.12.2029'da yapılacağı tahmin edilmiş, ancak tutar tahmini 3.146.000
    TL'ye yükselmiştir; iskonto oranı değişmemiştir. TMS 37'ye göre 2027 yılında finansman gideri (zamanın geçişinden kaynaklanan
    borçlanma maliyeti) olarak muhasebeleştirilecek tutar kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '260.000'
    C: '400.000'
    D: '484.000'
    E: '600.000'
  dogru: A
  aciklama:
    dogru_neden: 'TMS 37 par. 45 ve 60''a göre karşılık bugünkü değeriyle ölçülür ve zamanın geçişini yansıtmak için her dönem
      defter değeri artar; bu artış borçlanma maliyeti olarak muhasebeleştirilir. 31.12.2026 karşılığı 2.662.000 / 1,1³ =
      2.000.000 TL''dir. 2027 finansman gideri 2.000.000 × %10 = 200.000 TL''dir. Tahmin artışının etkisi (31.12.2027 karşılığı
      3.146.000 / 1,1² = 2.600.000; 2.600.000 − 2.200.000 = 400.000 TL) ise zaman geçişinden değil tahmin değişikliğinden
      doğar ve borçlanma maliyeti sayılmaz (toplam 2027 etkisi 600.000 TL).


      Püf noktaları: (1) Faiz etkisi açılış bakiyesi × iskonto oranıdır. (2) Tutar tahmini revizyonu ayrı bir etkidir ve finansman
      gideri değildir. (3) Kapanış karşılığı, her biri bugünkü değerde olmak üzere iki etkinin toplamıdır.

      '
    celdiriciler:
      B: Kapanış karşılığı (2.600.000) × %10 alınmıştır; faiz açılış bakiyesi üzerinden hesaplanır.
      C: Tahmin revizyonunun etkisi (400.000) finansman gideri sanılmıştır.
      D: Nominal tutardaki artış (3.146.000 − 2.662.000) alınmıştır; iskonto dikkate alınmamıştır.
      E: Karşılıktaki toplam artış (2.600.000 − 2.000.000) finansman gideri sanılmıştır; bunun 400.000 TL'si tahmin revizyonudur.
    hesap_adimlari:
    - 31.12.2026 karşılık = 2.662.000 / 1,331 = 2.000.000
    - 2027 finansman gideri = 2.000.000 × %10 = 200.000
    - 31.12.2027 karşılık = 3.146.000 / 1,21 = 2.600.000; revizyon = 2.600.000 − 2.200.000 = 400.000
  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 45
    alinti: Paranın zaman değerinin etkisinin önemli olduğu durumlarda karşılık tutarı, yükümlülüğün yerine getirilmesi için
      gerekeceği tahmin edilen giderlerin bugünkü değeridir.
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 60
    alinti: İskonto etme işleminin kullanıldığı durumlarda, zamanın geçişini yansıtmak amacıyla her bir dönem ilgili karşılığın
      defter değeri artar. Söz konusu artış, borçlanma maliyeti olarak muhasebeleştirilir.
