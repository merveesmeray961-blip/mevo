- id: YMM-IFM-VRG-0056
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: 'vergi gideri ile muhasebe kârı arasındaki ilişki: ortalama etkin vergi oranı'
  tip: hesaplama
  zorluk: 2
  kok: (R) AŞ'nin 2026 yılı TFRS'ye göre vergi öncesi kârı 4.000.000 TL'dir. Bu tutara kanunen kabul edilmeyen giderler (kalıcı
    fark) 400.000 TL gider olarak dâhildir; ayrıca kurumlar vergisinden istisna edilen 600.000 TL tutarında bir iştirak kazancı
    (kalıcı fark) da dâhildir. TFRS'de gider yazılan 400.000 TL garanti karşılığı vergi açısından ödendiğinde indirilecektir
    (geçici fark; ertelenmiş vergi varlığı muhasebeleştirilmiştir). Kurumlar vergisi oranı %25'tir. TMS 12'ye göre ortalama
    etkin vergi oranı yüzde kaçtır?
  secenekler:
    A: '%21,25'
    B: '%23,75'
    C: '%25,00'
    D: '%26,25'
    E: '%27,50'
  dogru: B
  aciklama:
    dogru_neden: Ortalama etkin vergi oranı, vergi giderinin muhasebe kârına bölünmesiyle bulunur (TMS 12 par. 86). Toplam
      vergi gideri = dönem vergisi + ertelenmiş vergi. Dönem vergisi = (4.000.000 + 400.000 − 600.000 + 400.000) × %25 = 1.050.000
      TL; ertelenmiş vergi geliri = 400.000 × %25 = 100.000 TL; vergi gideri = 950.000 TL. Etkin oran = 950.000 / 4.000.000
      = %23,75. Geçici fark toplam vergi giderini değiştirmez, yalnızca dönem ve ertelenmiş vergi arasında dağıtır.
    celdiriciler:
      A: Yalnızca istisna kazanç dikkate alınmış, kanunen kabul edilmeyen giderin vergi etkisi unutulmuştur (850.000 / 4.000.000).
      C: Normal vergi oranı alınmıştır; kalıcı farklar etkin oranı normal orandan ayırır.
      D: Yalnızca dönem vergisi (1.050.000) muhasebe kârına bölünmüş, ertelenmiş vergi geliri dikkate alınmamıştır.
      E: İstisna kazancın etkisi unutulmuş, yalnızca kanunen kabul edilmeyen gider eklenmiştir (1.100.000 / 4.000.000).
    hesap_adimlari:
    - Dönem vergisi = (4.000.000 + 400.000 − 600.000 + 400.000) × %25 = 1.050.000
    - Ertelenmiş vergi geliri = 400.000 × %25 = 100.000
    - Vergi gideri = 950.000; etkin oran = 950.000 / 4.000.000 = %23,75
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 86
    alinti: Ortalama etkin vergi oranı; vergi giderinin (gelirinin) muhasebe kârına bölünmesi sonucunda bulunan orandır.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 56
    alinti: Ertelenmiş vergi varlıklarının defter değerleri her bilanço tarihinde gözden geçirilir. Bir işletme ertelenmiş
      vergi varlığının tamamından veya bir kısmından yararlanmasına yeterli tutarda vergiye tabi kâr elde etme olasılığı yoksa,
      ertelenmiş vergi varlığının defter değerini buna paralel olarak azaltır.
  gecerlilik:
    baslangic: '2006-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'donem = (4000000 + 400000 - 600000 + 400000) * 0.25

      ertelenmis = -400000 * 0.25

      gider = donem + ertelenmis

      sonuc = round(gider / 4000000 * 100, 2)

      '
