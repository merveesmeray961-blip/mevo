  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: 'karşılık tutarının ölçümü: muhtemel sonuçlar aralığının orta noktası'
  tip: hesaplama
  zorluk: 1
  kok: Kimya sektöründe faaliyet gösteren (M) AŞ, kendi faaliyetlerinden kaynaklanan çevre kirliliğini gidermeyi üstlenmiştir;
    31.12.2026 itibarıyla mevcut yükümlülük vardır ve kaynak çıkışı muhtemeldir. Temizleme maliyeti 2.000.000 TL ile 3.000.000
    TL arasında gerçekleşebilecek olup bu aralıktaki her tutarın gerçekleşme olasılığı eşittir. Paranın zaman değerinin etkisi
    önemsizdir ve tazminat beklenmemektedir. TMS 37'ye göre 31.12.2026'da ayrılacak karşılık kaç TL'dir?
  secenekler:
    A: 2.000.000
    B: 2.500.000
    C: 2.750.000
    D: 3.000.000
    E: 5.000.000
  dogru: B
  aciklama:
    dogru_neden: TMS 37 par. 39'a göre sürekli bir muhtemel sonuçlar aralığı bulunduğunda ve aralıktaki her nokta diğerine
      benzediğinde aralığın orta noktası kullanılır. Orta nokta (2.000.000 + 3.000.000) / 2 = 2.500.000 TL'dir.
    celdiriciler:
      A: Alt sınır en iyi tahmin değildir; belirsizlik karşılığın eksik ayrılmasını haklı kılmaz (par. 43).
      C: Orta noktaya keyfi bir risk payı eklenmiştir; belirsizlik aşırı karşılık ayrılmasını haklı kılmaz (par. 43).
      D: Üst sınırın alınması ihtiyatlılık gerekçesiyle bile olsa aşırı karşılık doğurur; par. 39 orta noktayı öngörür.
      E: Alt ve üst sınırlar toplanmıştır; aralığın uç değerleri toplanmaz, orta noktası alınır.
    hesap_adimlari:
    - Orta nokta = (2.000.000 + 3.000.000) / 2 = 2.500.000
  kaynaklar:
  - mevzuat: TMS 37 Karşılıklar, Koşullu Borçlar ve Koşullu Varlıklar
    madde: par. 39
    alinti: Sürekli bir muhtemel sonuçlar aralığının bulunduğu ve bu aralıktaki her bir noktanın diğerine benzediği durumlarda,
      söz konusu aralığın orta noktası kullanılır.
