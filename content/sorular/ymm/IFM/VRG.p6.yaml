  - YMM
  ders: IFM
  unite: VUK'tan TFRS'ye dönüşüm ertelenmiş vergi ve karşılıklar
  konu: VRG
  kazanim: iş ilişkisi sonrası fayda yükümlülüğünün iskonto oranı (TMS 19)
  tip: bilgi
  zorluk: 2
  kok: Türk lirası cinsinden yüksek kaliteli özel sektör tahvilleri için derin bir piyasanın bulunmadığı bir durumda, işletme
    kıdem tazminatı gibi iş ilişkisi sonrası sağlanan fayda yükümlülüğünü iskonto edecektir. TMS 19'a göre iskonto oranı aşağıdakilerden
    hangisine göre belirlenir?
  secenekler:
    A: İşletmenin kendi borçlanma maliyetini ve alacaklılarından kaynaklanan kredi riskini yansıtan banka kredisi faiz oranına
    B: Fon varlıkları varsa bu varlıkların beklenen getiri oranına; fon yoksa işletmenin ağırlıklı ortalama sermaye maliyetine
    C: Dönem sonundaki enflasyon beklentisi ile aktüeryal riski yansıtan bir risk priminin toplamına
    D: Yüksek kaliteli özel sektör tahvillerinin, piyasa derinliği yetersiz olsa da, dönem sonundaki piyasa getirilerine göre
      belirlenir
    E: Aynı para birimi cinsinden devlet tahvillerinin dönem sonu piyasa getirilerine; vadeler tutarlı olmalıdır
  dogru: E
  aciklama:
    dogru_neden: TMS 19 par. 83'e göre iskonto oranı yüksek kaliteli özel sektör tahvillerinin dönem sonu piyasa getirilerine
      bakılarak belirlenir; ilgili para biriminde bu tahviller için derin piyasa yoksa o para birimi cinsinden devlet tahvillerinin
      dönem sonu piyasa getirileri kullanılır. Tahvillerin para birimi ve vadeleri, yükümlülüğün para birimi ve tahmin edilen
      vadeleriyle tutarlı olmalıdır.
    celdiriciler:
      A: İskonto oranı paranın zaman değerini yansıtır; işletmeye özgü kredi riskini yansıtmaz (par. 84).
      B: Oran plan varlıklarının getirisine veya sermaye maliyetine göre değil, tahvil piyasa getirilerine göre belirlenir
        (par. 83).
      C: İskonto oranı aktüeryal riski veya yatırım riskini yansıtmaz (par. 84); belirleme esası piyasa getirileridir.
      D: Derin piyasa bulunmuyorsa özel sektör tahvili getirisi değil, devlet tahvillerinin piyasa getirileri kullanılır (par.
        83).
  kaynaklar:
