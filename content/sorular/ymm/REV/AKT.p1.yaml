    celdiriciler:
      A: Teminat tutarı karşılık tutarı değildir.
      B: Alacağın yalnız yarısı teminat dışı değildir; verilen verilerle bakiye 150.000 TL’dir.
      D: Teminatlı kısım için de karşılık ayrılmış olur.
      E: Alacak toplamı karşılık üst sınırı değildir.
