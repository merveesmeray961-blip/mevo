    - Alacak dava safhasında olduğundan şüpheli alacak koşulu sağlanır.
    - Teminatlı alacakta teminat tutarı düşülür.
    - 200.000 − 50.000 = 150.000 TL.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 323
    alinti: Yukarıda yazılı şüpheli alacaklar için değerleme gününün tasarruf değerine göre pasifte karşılık ayrılabilir.
      Bu karşılığın hangi alacaklara ait olduğu karşılık hesabında gösterilir. Teminatlı alacaklarda bu karşılık teminattan
      geri kalan miktara inhisar eder.
