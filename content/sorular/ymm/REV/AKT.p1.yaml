  kok: Bir işletmenin ticari faaliyetiyle ilgili 200.000 TL alacağı dava safhasındadır; bunun 50.000 TL’lik kısmı teminatla
    güvence altındadır. VUK md. 323’e göre karşılık ayrılabilecek tutarın üst sınırı kaç TL’dir?
