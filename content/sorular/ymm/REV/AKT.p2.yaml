    dogru_neden: 'Binek otomobil: azalan bakiyeler oranı 2 × %20 = %40; binek otomobillerde aktife girilen yıl için ay kesri
      tam ay sayılarak kalan ay süresi kadar amortisman ayrılır (Eylül–Aralık, 4 ay): 1.200.000 × %40 × 4/12 = 160.000. Makine:
      binek olmadığından ve gün esası seçilmediğinden aktife girdiği yıl için tam yıl amortisman ayrılır: 600.000 × %10 =
      60.000. Yazıcı: bedeli 12.000 TL''yi aştığından doğrudan gider yazılamaz; 14.000 × %20 = 2.800. Toplam 222.800 TL. Püf
      noktaları: Kıst amortisman yalnız binek otomobillere özgüdür; Kasım ve Aralık''ta alınan diğer kıymetlere tam yıl amortisman
      ayrılır. Eylül''ün 10''unda alınan araç için Eylül tam ay sayılır.'
