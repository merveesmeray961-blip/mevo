    madde: par. 5
    alinti: Fiziki stok sayımının finansal tablo tarihinden farklı bir tarihte yapılması durumunda denetçi, sayım tarihi ile
      finansal tablo tarihi arasında stoklarda meydana gelen değişikliklerin uygun olarak kaydedilip kaydedilmediğine ilişkin
      denetim kanıtı elde etmek için
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği Sıra No: 1 — Hesap Planı Açıklamaları'
    madde: 197 Sayım ve Tesellüm Noksanları
    alinti: Sayımlar sonucunda tespit edilen kasa, stok ve maddi duran varlıklar noksanlarıyla, tesellüm sırasında ortaya
      çıkan noksanların geçici olarak kayıt ve izleneceği hesaptır.
