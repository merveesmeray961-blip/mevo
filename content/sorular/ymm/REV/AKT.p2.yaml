- id: YMM-REV-AKT-0025
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu
  konu: AKT
  kazanim: stok sayımı ve değerlemesi
  tip: hesaplama
  zorluk: 2
  kok: 'Ticari mal alım satımı yapan X A.Ş.''nin 31.12.2026 stoklarına ilişkin bilgiler aşağıdadır. Şirket, VUK md. 274''ün
    tanıdığı imkândan yararlanılabilen her kalemde yararlanmayı tercih etmektedir; emsal bedelinin değerleme günündeki satış
    bedeline eşit olduğu kabul edilecektir.


    | Mal | Maliyet bedeli (TL) | Değerleme günü satış bedeli (TL) |

    |---|---|---|

    | X | 100.000 | 92.000 |

    | Y | 200.000 | 180.000 |

    | Z | 50.000 | 60.000 |

    | W | 80.000 | 70.000 |


    VUK''a göre stokların toplam değeri kaç TL''dir?

    '
  secenekler:
    A: '392.000'
    B: '400.000'
    C: '402.000'
    D: '420.000'
    E: '430.000'
  dogru: B
  aciklama:
    dogru_neden: Emtia maliyet bedeliyle değerlenir; satış bedelinin maliyete göre %10 ve daha fazla düştüğü hâllerde mükellef
      emsal bedelini uygulayabilir (VUK md. 274). X'te düşüş %8 olduğundan maliyet (100.000); Y'de düşüş tam %10 olduğundan
      emsal bedeli (180.000); Z'de değer artışı olduğundan maliyet (50.000); W'de düşüş %12,5 olduğundan emsal bedeli (70.000)
      uygulanır. Toplam 400.000 TL.
    celdiriciler:
      A: Düşüş oranına bakılmaksızın her kalemde maliyet ile satış bedelinden düşük olanı alınmıştır (X 92.000); %10 eşiği
        uygulanmamıştır.
      C: Tüm kalemler satış bedeliyle değerlenmiştir; VUK'ta değer artışı (Z) dikkate alınmaz, %10'un altındaki düşüş de emsal
        bedelini uygulatmaz.
      D: Y'deki tam %10'luk düşüş eşiği aşmadı sanılarak maliyette bırakılmıştır; hüküm '%10 ve daha fazla' der.
      E: Tüm kalemler maliyetle değerlenmiştir; şirketin md. 274 imkânından yararlanma tercihi göz ardı edilmiştir.
    hesap_adimlari:
    - 'X: (100.000 − 92.000)/100.000 = %8 → 100.000'
    - 'Y: (200.000 − 180.000)/200.000 = %10 → 180.000'
    - 'Z: artış → 50.000'
    - 'W: (80.000 − 70.000)/80.000 = %12,5 → 70.000'
    - 'Toplam: 100.000 + 180.000 + 50.000 + 70.000 = 400.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 274
    alinti: Emtia, maliyet bedeliyle değerlenir. Emtianın maliyet bedeline nazaran değerleme günündeki satış bedelleri % 10
      ve daha fazla bir düşüklük gösterdiği hallerde mükellef, maliyet bedeli yerine 267 nci maddenin ikinci sırasındaki usul
      hariç olmak üzere, emsal bedeli ölçüsünü tatbik edebilir.
  gecerlilik:
    baslangic: '2004-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "mal = [(100000, 92000), (200000, 180000), (50000, 60000), (80000, 70000)]\nsonuc = 0\nfor m, s in mal:\n    if\
      \ (m - s) / m >= 0.10:\n        sonuc = sonuc + s\n    else:\n        sonuc = sonuc + m\n"
  durum: taslak
  surum: 1
