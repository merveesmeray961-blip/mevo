      B: Protesto edilmiştir ancak dava veya icra safhasında değildir ve tutarı 25.000 TL sınırını aşmaktadır.
      C: Vadenin geçmesi tek başına yetmez; protesto veya yazıyla bir defadan fazla isteme şartı yoktur.
      D: İcra safhasında olsa da ortağa verilen borç para ticari kazancın elde edilmesi ve idamesiyle ilgili değildir; md.
