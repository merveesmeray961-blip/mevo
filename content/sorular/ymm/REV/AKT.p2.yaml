    hesabına aktarmış ve alacağın tamamı için karşılık ayırmıştır. 2026 yılında alacağın 30.000 TL''si banka hesabına tahsil
    edilmiş; Kasım 2026''da kesinleşen mahkeme kararıyla kalan kısmın tahsil imkânı kalmamıştır. Şirket 2026''da bu alacakla
