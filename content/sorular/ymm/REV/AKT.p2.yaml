      C: Kasa fazlasının kaydıdır; burada fiilî mevcut defter bakiyesinden azdır.
      D: Sorumlu kişi belirlenmeden personelden alacak kaydı yapılamaz; sorumlu belli olunca 197'den aktarılır.
      E: 199 hesabına karşılık, yıl sonunda kesin hesaplara aktarılamayan net noksan için ayrılır; sayım günü kasanın alacaklandırılması
