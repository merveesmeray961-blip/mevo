      alacak niteliği kazanır (VUK md. 322); tahsilin imkânsız olduğu kesinleştiğinde THP''ye göre 129 borç / 128 alacak kaydıyla
      kapatılır; karşılık daha önce gider yazıldığından ayrıca zarar yazılmaz. Sonuçta 128 ve 129 sıfırlanır, 2026 kârı 30.000
      TL artar. Püf noktaları: Tahsil edilen kısım için yapılacak iki kayıt (128''in kapatılması ve 644 ile karşılık iptali)
      birbirinden bağımsızdır. Değersiz kısımda karşılık hesabı kullanılır; 689 ile yeniden zarar yazmak aynı kaybı iki kez
