      C: Yazıcı doğrudan gider yazılmıştır; bedeli 12.000 TL sınırını aştığından amortismana tabidir.
      E: Binek otomobil için kıst amortisman kuralı uygulanmamış, tam yıl (480.000) amortisman ayrılmıştır.
