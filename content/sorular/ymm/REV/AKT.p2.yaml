        md. 323 gereği kâra intikal ettirilmesi gereken tutar gelir yazılmamıştır.
      D: Değersiz kısım için ayrılmış karşılık kullanılmayıp 689 ile ikinci kez zarar yazılmış; 129'da 60.000 TL karşılık
        asılı kalmıştır.
      E: Tahsilat 128'den düşülmemiş, doğrudan gelir yazılmıştır; 128 ve 129 hesaplarında tahsil edilmiş alacağa ait 30.000
        TL'şer bakiye kalır.
    hesap_adimlari:
