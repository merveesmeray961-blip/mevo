- id: YMM-REV-AKT-0026
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu
  konu: AKT
  kazanim: duran varlık ve amortisman incelemesi
  tip: hesaplama
  zorluk: 2
  kok: X A.Ş., 2024 yılında aktifine aldığı 1.000.000 TL bedelli makineye (faydalı ömrü 5 yıl) azalan bakiyeler usulüyle amortisman
    ayırmaya başlamış; 2024 ve 2025 yıllarında bu usule göre tam yıl amortisman ayırmıştır. Şirket, 2026 hesap döneminden
    itibaren normal amortisman usulüne geçmeye karar vermiş ve bunu 2026 yılı beyannamesinde belirtmiştir. Makine için 2026
    yılında ayrılacak amortisman kaç TL'dir?
  secenekler:
    A: '72.000'
    B: '90.000'
    C: '120.000'
    D: '144.000'
    E: '200.000'
  dogru: C
  aciklama:
    dogru_neden: 'Azalan bakiyeler oranı, %50''yi geçmemek üzere normal oranın iki katıdır: 2 × %20 = %40. 2024: 1.000.000
      × %40 = 400.000; 2025: 600.000 × %40 = 240.000; kalan değer 360.000 TL. Azalan bakiyelerden normal usule geçilebilir
      ve henüz yok edilmemiş değer bakiye amortisman süresine bölünerek eşit miktarlarla yok edilir (VUK mükerrer md. 320/3).
      Bakiye süre 3 yıldır (2026–2028): 360.000 / 3 = 120.000 TL.'
    celdiriciler:
      A: Kalan değere normal amortisman oranı (%20) uygulanmıştır; kanun kalan değerin bakiye süreye bölünmesini ister.
      B: Kalan değer 4 yıla bölünmüştür; 5 yıllık sürenin 2 yılı kullanıldığından bakiye süre 3 yıldır.
      D: Usul değişikliği yok sayılıp azalan bakiyeler oranı (%40) uygulanmaya devam edilmiştir.
      E: Maliyet bedeline normal oran uygulanmıştır; önceki yıllarda ayrılan amortismanlar dikkate alınmamıştır.
    hesap_adimlari:
    - 'Azalan bakiyeler oranı: 1/5 × 2 = %40'
    - '2024: 400.000; 2025: 240.000; kalan: 360.000'
    - '2026 (normal usul): 360.000 / 3 = 120.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 320/3
    alinti: Bir iktisadi değer üzerinden azalan bakiyeler usulüne göre amortisman ayrılmaya başlandıktan sonra normal amortisman
      usulüne geçilebilir. Bu suretle usul değiştirenler keyfiyeti beyannamelerinde veya eki bilançolarda belirtmeye mecburdurlar.
      Kabul edilen yeni usul bu bildirimin yapıldığı beyannamenin taallük ettiği dönemden itibaren nazara alınır. Bu takdirde
      henüz yok edilmemiş olan değer kısmı, bakıye amortisman süresine bölünmek suretiyle eşit miktarlarla yok edilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 315/2
    alinti: Bu usulde uygulanacak amortisman oranı % 50'yi geçmemek üzere normal amortisman oranının iki katıdır.
  gecerlilik:
    baslangic: '2004-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "oran = min(0.50, 2 * (1 / 5))\nkalan = 1000000\nfor yil in range(2):\n    kalan = kalan - kalan * oran\nsonuc\
      \ = kalan / 3\n"
