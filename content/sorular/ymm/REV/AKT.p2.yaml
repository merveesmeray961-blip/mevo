  kok: 'Sürekli denetim kapsamında YMM''nin 18.12.2026''da habersiz yaptığı kasa sayımında fiilî nakit, kasa defteri bakiyesinden
    7.500 TL eksik çıkmıştır. Farkın nedeni ve sorumlusu henüz belirlenememiştir. Tekdüzen Hesap Planı''na göre sayım tarihinde
    yapılması gereken kayıt hangisidir? (B: borç, A: alacak)'
