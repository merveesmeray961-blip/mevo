  unite: Aktif hesapların revizyonu
  konu: AKT
  kazanim: stok sayımı ve değerlemesi
  tip: hesaplama
  zorluk: 3
  kok: YMM, X A.Ş.'nin ticari mal stok sayımını 20.12.2026'da gözlemlemiştir. Sayımda depoda 5.600 birim mal bulunmuş; bunların
    500 birimi başka bir firmadan satılmak üzere konsinye (emanet) olarak alınmıştır. 21–31 Aralık arasında tesellüm fişli
    alışlar 1.500 birim, sevk irsaliyeli satışlar 2.200 birimdir ve bu hareketlerin doğru dönemde kaydedildiği doğrulanmıştır.
    Sürekli envanter kayıtlarına göre 31.12.2026 stok miktarı 4.800 birim, birim maliyet 150 TL'dir. Sayım sonuçları bilanço
    gününe taşındığında 31.12.2026 itibarıyla kayıtlara göre stok farkı aşağıdakilerden hangisidir?
  secenekler:
    A: 15.000 TL fazla
    B: 45.000 TL fazla
    C: 60.000 TL noksan
    D: 120.000 TL fazla
    E: 285.000 TL noksan
  dogru: C
  aciklama:
    dogru_neden: 'Konsinye mallar işletmenin mülkiyetinde olmadığından sayım miktarından çıkarılır: 5.600 − 500 = 5.100. Sayım
      bilanço gününden farklı tarihte yapıldığından aradaki hareketler ileri taşınır (BDS 501 par. 5): 5.100 + 1.500 − 2.200
      = 4.400 birim. Kayıtlı miktar 4.800 birim olduğundan 400 birim noksan vardır: 400 × 150 = 60.000 TL. Noksan nedeni araştırılıncaya
      kadar 197 Sayım ve Tesellüm Noksanları hesabında izlenir. Püf noktaları: Önce mülkiyet (konsinye düşülür), sonra dönemsellik
      (21–31 Aralık hareketleri) düzeltilir; işaret de önemlidir: hesaplanan fiilî miktar kayıtlıdan azsa noksan vardır.'
    celdiriciler:
      A: 'Konsinye mallar düşülmeden hareketler taşınmıştır: 5.600 + 1.500 − 2.200 = 4.900; kayıtlıya göre 100 birim fazla
        görünür.'
      B: 'Konsinye düşülmüş ama 21–31 Aralık hareketleri taşınmamıştır: 5.100 − 4.800 = 300 birim fazla.'
      D: 'Ne konsinye mallar düşülmüş ne de hareketler taşınmıştır: 5.600 − 4.800 = 800 birim fazla.'
      E: 'Sayım sonrası alışlar eklenmemiştir: 5.100 − 2.200 = 2.900; 4.800 − 2.900 = 1.900 birim noksan.'
    hesap_adimlari:
    - 'İşletmeye ait sayım miktarı: 5.600 − 500 = 5.100'
    - '31.12''ye taşıma: 5.100 + 1.500 − 2.200 = 4.400'
    - 'Fark: 4.800 − 4.400 = 400 birim noksan × 150 = 60.000 TL'
  kaynaklar:
