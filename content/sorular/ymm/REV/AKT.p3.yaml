- id: YMM-REV-AKT-0037
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu
  konu: AKT
  kazanim: hazır değerler ve kasa sayımı
  tip: uygulama
  zorluk: 3
  kok: 'YMM, F A.Ş.''nin kasa sayımını yaparken şu durumları tespit etmiştir:

    I. Kasada bozdurulmamış yabancı para: 500 USD (kur: 35 TL/USD = 17.500 TL)

    II. Kasa sayımında muhasebecinin bizzat bulunmamış olması

    III. Kasada müdür imzalı borç senedi: 5.000 TL

    Hangisi/hangileri kasa sayımının güvenilirliğini olumsuz etkiler?

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'II. olumsuz: sayımın bağımsızlığı için muhasebecinin hazır bulunması gerekir; yokluğu prosedür açığıdır.
      III. olumsuz: senedi kasa mevcudu sayılması kasanın şişirilmesine yol açar; imzalı borç senedi kasa dışında izlenmelidir.
      I. nötr: yabancı para kasa mevcudunun parçasıdır, güvenilirliği olumsuz etkilemez. Püf noktaları: kasadaki senet kasanın
      parçası değil; ayrı hesaba alınmalıdır.'
    celdiriciler:
