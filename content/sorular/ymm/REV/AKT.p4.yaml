    madde: md. 328/4-c
    alinti: Pasifte geçici bir hesapta tutulan kâr, satışı yapılan iktisadi kıymetin yerine iktisap edilen yeni kıymetlerin
      amortisman ayrılabilecek tutarından fazla ise bu fazlalık, satışın yapıldığı yılı takip eden üçüncü takvim yılının kâr
