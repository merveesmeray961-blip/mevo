  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: amortismanlı iktisadi kıymet satışı (VUK md.328)
  tip: uygulama
  zorluk: 2
  kok: Bilanço esasına göre defter tutan (N) A.Ş., maliyet bedeli 1.000.000 TL, birikmiş amortismanı 700.000 TL olan bir makineyi
    Mayıs 2026'da 500.000 TL'ye satmıştır. Yönetim kurulu, satılan makinenin yenilenmesine satıştan önce karar vermiş ve yeni
    makine için tedarikçiyle sözleşme imzalamıştır. Satış kârının vergisel durumu hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: 200.000 TL kâr 31/12/2029'a kadar pasifte geçici hesapta tutulabilir ve yeni kıymetin amortismanlarına mahsup edilir.
    B: 200.000 TL kâr 31/12/2028'e kadar pasifte tutulabilir; bu sürede yenileme yapılmazsa 2026 yılı kazancına eklenir.
    C: Kâr pasifte tutulabilir; ancak yenileme yapılmazsa vergi ziyaı doğmuş sayılarak satış yılı için cezalı tarhiyat yapılır.
    D: Amortismanlı kıymetin satış kârı pasifte tutulamaz; 200.000 TL satış yılında 679 hesabına alınarak vergilendirilir.
    E: Kâr 500.000 TL'dir; yenileme kararı bulunduğundan tamamı beş yıl süreyle özel fon hesabında tutulabilir.
  dogru: A
  aciklama:
    dogru_neden: Satış kârı = 500.000 − (1.000.000 − 700.000) = 200.000 TL (VUK md. 328/1-2). md. 328/4-a'ya göre yenileme
      işin niteliğine göre zorunlu ise veya işletmeyi idare edenlerce karar verilip teşebbüse geçilmişse kâr, satış tarihini
      takip eden üçüncü takvim yılının sonuna (31/12/2029) kadar pasifte geçici bir hesapta tutulabilir. (b) bendine göre
      bu tutar yeni kıymetin ayrılacak amortismanlarına mahsup edilir.
    celdiriciler:
      B: Süre satışı takip eden üçüncü takvim yılı sonudur (2029); yenileme olmazsa kâr satış yılına değil üçüncü takvim yılının
        kâr ve zarar hesabına eklenir.
      C: Kanun, yenileme yapılmaması hâlinde kârın üçüncü yılın kazancına eklenmesini öngörür; satış yılı için vergi ziyaı
        hükmü yoktur.
      D: md. 328, şartlar sağlandığında satış kârının pasifte geçici hesapta tutulmasına izin verir.
      E: Satış kârı bedelden net değer düşülerek bulunur; beş yıllık özel fon md. 5/1-e istisnasına aittir.
