  kok: Bilanço esasına göre defter tutan (P) A.Ş., 2026 yılında sattığı bir makineden doğan 300.000 TL kârı VUK md. 328 uyarınca
    pasifte geçici bir hesaba almıştır. Satılan makinenin yerine Mart 2027'de 250.000 TL bedelle benzer nitelikte yeni bir
    makine edinilmiş ve aktifleştirilmiştir. Yeni makine %20 oranında normal amortismana tabidir. Başka bir kıymet edinilmemiş,
    işletme faaliyetine devam etmektedir. Geçici hesapta tutulan kârdan hangi tutar, hangi yılın kâr ve zarar hesabına eklenir?
  secenekler:
    A: 0 TL; fonun tamamı yeni makinenin amortismanlarına mahsup edilir.
    B: 50.000 TL, 2029 yılında
    C: 150.000 TL, 2029 yılında
    D: 250.000 TL, 2027 yılında
    E: 300.000 TL, 2029 yılında
  dogru: B
  aciklama:
    dogru_neden: 'md. 328/4-b''ye göre geçici hesaptaki kâr yeni kıymetin ayrılacak amortismanlarına mahsup edilir; mahsup
      edilebilecek tutar yeni kıymetin amortisman ayrılabilecek tutarıyla (250.000 TL) sınırlıdır. (c) bendine göre geçici
      hesaptaki kâr, yerine edinilen yeni kıymetin amortisman ayrılabilecek tutarından fazla ise fazlalık, satışın yapıldığı
      yılı takip eden üçüncü takvim yılının (2029) kâr ve zarar hesabına eklenir: 300.000 − 250.000 = 50.000 TL. Püf noktaları:
      Fazlalık, yeni kıymetin bedeliyle karşılaştırılarak bulunur; o tarihe kadar ayrılmış amortismanla değil.'
    celdiriciler:
      A: Fon, yeni kıymetin amortisman ayrılabilecek tutarını 50.000 TL aşmaktadır; aşan kısım mahsup edilemez.
      C: Fazlalık, 2027–2029 yıllarında ayrılan amortismanlar (150.000 TL) düşüldükten sonra kalan fon olarak hesaplanmıştır;
        kanun yeni kıymetin amortismana tabi tutarını esas alır.
      D: Yeni kıymet bedeli kadar tutar fondan mahsup edilir, kâra eklenmez.
      E: Yenileme gerçekleştiğinden fonun tamamı kâra eklenmez; yalnız fazlalık eklenir.
    hesap_adimlari:
    - 'Mahsup edilebilir: yeni kıymetin amortismana tabi tutarı 250.000 TL'
    - 'Fazlalık: 300.000 − 250.000 = 50.000 TL'
    - 'Ekleme yılı: satış (2026) + 3 = 2029'
  kaynaklar:
