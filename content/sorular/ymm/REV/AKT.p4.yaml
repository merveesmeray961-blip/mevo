- id: YMM-REV-AKT-0059
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: menkul kıymet ve yabancı paraların değerlemesi (VUK md.279 ve 280)
  tip: hesaplama
  zorluk: 2
  kok: '(L) A.Ş.''nin 31/12/2026 tarihli kayıtlarında yer alan avro cinsinden kalemler şunlardır: 120 Alıcılar hesabında 20.000
    avro (kayıtlı değer 880.000 TL), 320 Satıcılar hesabında 10.000 avro (kayıtlı değer 450.000 TL), 100 Kasa hesabında 5.000
    avro (kayıtlı değer 230.000 TL). Değerleme günü borsa rayici 1 avro = 48 TL''dir ve tüm kalemlerin değerlemesinde bu kur
    esas alınacaktır; senede bağlı kalem yoktur. VUK md. 280''e göre yapılacak değerlemenin 2026 yılı dönem kârına net etkisi
    kaç TL artıştır?'
  secenekler:
    A: 50.000 TL
    B: 60.000 TL
    C: 80.000 TL
    D: 90.000 TL
    E: 120.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 280''e göre yabancı paralar borsa rayiciyle değerlenir ve bu hüküm yabancı para ile olan senetli
      veya senetsiz alacak ve borçlar için de geçerlidir. Alacak: 20.000 × 48 = 960.000 → +80.000 TL kambiyo kârı; kasa: 5.000
      × 48 = 240.000 → +10.000 TL; borç: 10.000 × 48 = 480.000 → borç 30.000 TL artar, kambiyo zararı. Net etki = 80.000 +
      10.000 − 30.000 = 60.000 TL artış.'
    celdiriciler:
      A: Kasadaki yabancı paranın değerlemesi atlanmıştır (80.000 − 30.000).
      C: Yalnız alacak değerlenmiş; kasa ve borç dikkate alınmamıştır.
      D: Borç değerlemesi atlanmıştır; md. 280 yabancı paralı borçlara da uygulanır.
      E: Borçtaki artış kâr olarak yorumlanmıştır; borcun artması kambiyo zararıdır.
    hesap_adimlari:
    - 'Alacak: 960.000 − 880.000 = +80.000'
    - 'Kasa: 240.000 − 230.000 = +10.000'
    - 'Borç: 480.000 − 450.000 = −30.000'
    - 'Net: +60.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 280
    alinti: Bu madde hükmü yabancı para ile olan senetli veya senetsiz alacaklar ve borçlar hakkında da caridir.
  gecerlilik:
    baslangic: '1998-08-06'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kur = 48

      alacak = 20000 * kur - 880000

      kasa = 5000 * kur - 230000

      borc = 10000 * kur - 450000

      sonuc = alacak + kasa - borc'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S2.yaml, satır 59
  - tarih: '2026-10-18'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
