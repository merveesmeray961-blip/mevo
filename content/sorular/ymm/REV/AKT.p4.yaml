    A: 60.000 TL
    B: 80.000 TL
    C: 140.000 TL
    D: 290.000 TL
    E: 350.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'md. 279''a göre hisse senetleri ile portföyünün en az %51''i Türkiye''de kurulu şirket hisselerinden oluşan
      yatırım fonu katılma belgeleri alış bedeliyle değerlenir; bunlar dışındaki her türlü menkul kıymet borsa rayiciyle değerlenir.
      Hisse senetleri ve hisse yoğun fon alış bedelinde kalır; tahviller borsa rayicine getirilir: 60.000 + 80.000 = 140.000
      TL. Püf noktaları: Borsada işlem görmesi hisse senedini borsa rayiciyle değerlemeye yetmez; ölçüt kıymetin türüdür.
      Fonda belirleyici olan portföyün %51''inin Türk hisse senedi olmasıdır.'
    celdiriciler:
      A: Yalnız Devlet tahvili değerlenmiş, özel sektör tahvili atlanmıştır.
      B: Yalnız özel sektör tahvili değerlenmiş, Devlet tahvili atlanmıştır.
      D: Hisse senetleri de borsa rayiciyle değerlenmiştir (150.000 + 60.000 + 80.000).
      E: Tüm kalemler borsa rayici veya fon fiyatıyla değerlenmiştir.
