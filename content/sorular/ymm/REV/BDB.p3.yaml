        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-13'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: kaldi
        tarih: '2026-10-13'
        not: 'II öncülü hatalı kurgulanmış: tasfiye dönemi takvim yılı esasına göre bölünür (''1 yılı aşarsa'' değil, takvim
