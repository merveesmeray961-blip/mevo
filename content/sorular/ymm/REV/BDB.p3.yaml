  kok: 'Tasfiye dönemine ilişkin aşağıdaki ifadelerden hangileri doğrudur?

    I. Her tasfiye dönemi için ayrı beyanname verilir.

    II. Tasfiye süresi 1 yılı aşarsa her yıl için ara beyanname düzenlenir.

    III. Tasfiye kârı üzerinden kurumlar vergisi hesaplanmaz.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: Yalnız III
    D: II ve III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'I doğru: her dönem ayrı beyanname. II doğru: 1 yılı aşan tasfiyelerde ara beyanname. III yanlış: tasfiye
      kârı kurumlar vergisine tabidir.'
    celdiriciler:
      A: I tek başına eksik; II de doğrudur.
      C: III yanlıştır.
      D: III yanlış ifade içerir.
      E: III yanlış olduğundan E olamaz.
