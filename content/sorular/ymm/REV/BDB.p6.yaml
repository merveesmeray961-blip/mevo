  - YMM
  ders: REV
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: hisse değişimi
  tip: uygulama
  zorluk: 2
  kok: Aşağıda, tam mükellef sermaye şirketlerinin 2026 yılında yaptığı işlemlerden hangisi, diğer şartlar sağlanmış kabul
    edildiğinde KVK md. 19/3-c kapsamında **hisse değişimi** hükmündedir?
  secenekler:
    A: (P) A.Ş., (Q) A.Ş.'nin hisselerinin %45'ini devralmış; karşılığında devreden ortaklara yalnızca kendi iştirak hisselerini
      vermiştir
    B: (T) A.Ş., (U) A.Ş.'nin hisselerinin %80'ini devralmış; devreden ortaklara itibari değeri 1.000.000 TL olan iştirak
      hisseleri ile birlikte 150.000 TL nakit vermiştir
    C: (R) A.Ş., (S) A.Ş.'nin hisselerinin %60'ını devralmış; devreden ortaklara 2.000.000 TL itibari değerli iştirak hisseleri
      ve 200.000 TL nakit vermiştir
    D: (V) A.Ş., (W) A.Ş.'nin hisselerinin %70'ini devralmış; devreden ortaklara tamamen nakit ödeme yapmıştır
    E: (Y) Tüketim Kooperatifi, (Z) A.Ş.'nin hisselerinin %75'ini devralmış; devreden ortaklara kendi ortaklık paylarını vermiştir
  dogru: C
  aciklama:
    dogru_neden: KVK md. 19/3-c'ye göre tam mükellef bir sermaye şirketinin, diğer bir sermaye şirketinin yönetimini ve hisse
      çoğunluğunu elde edecek şekilde hisselerini devralması ve karşılığında hisseleri devreden ortaklara kendi sermayesini
      temsil eden iştirak hisseleri vermesi hisse değişimidir. Verilecek iştirak hisselerinin itibari değerinin %10'una kadarlık
      kısmının nakit ödenmesi işlemin hisse değişimi sayılmasına engel değildir. (R) A.Ş. örneğinde çoğunluk (%60) vardır
      ve nakit 200.000 TL, itibari değerin tam %10'udur.
    celdiriciler:
      A: '%45''lik devralma hisse çoğunluğunu sağlamaz; ayrıca şart çoğunluk ve yönetimi elde etmedir.'
      B: Çoğunluk sağlanmıştır ancak 150.000 TL nakit, verilen iştirak hisselerinin itibari değerinin %10'u olan 100.000 TL'yi
        aşar.
      D: Karşılığın tamamının nakit olması hâlinde, devreden ortaklara devralanın iştirak hisseleri verilmediğinden hisse
        değişimi gerçekleşmez; yalnızca %10'a kadar nakit serbesttir.
      E: Devralan kurum sermaye şirketi değil kooperatiftir; hüküm tam mükellef bir sermaye şirketinin devralmasını arar.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 19/3-c
    alinti: 'c) Hisse değişimi: Tam mükellef bir sermaye şirketinin, diğer bir sermaye şirketinin hisselerini, bu şirketin
      yönetimini ve hisse çoğunluğunu elde edecek şekilde devralması ve karşılığında bu şirketin hisselerini devreden ortaklarına
      kendi şirketinin sermayesini temsil eden iştirak hisselerini vermesi, bu Kanunun uygulanmasında hisse değişimi hükmündedir.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 19/3-c
    alinti: Hisseleri devralınan şirketin ortaklarına verilecek iştirak hisselerinin itibari değerinin %10’una kadarlık kısmının
      nakit olarak ödenmesi, işlemin hisse değişimi sayılmasına engel değildir.
