- id: YMM-REV-BDB-0060
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: tasfiyenin zararla kapanması
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan (M) A.Ş. 3.4.2026''da tasfiyeye girmiş, tasfiye 14.2.2028''de sona ermiştir. Tasfiye
    dönemleri için beyan edilen sonuçlar şöyledir: 2026 dönemi 400.000 TL kâr; 2027 dönemi 200.000 TL kâr; son tasfiye dönemi
    (1.1.2028-14.2.2028) 500.000 TL zarar. Önceki dönemlerde %25 oranıyla hesaplanan kurumlar vergisi ödenmiştir. Kurumlar
    vergisi oranının tüm dönemlerde %25 olduğu ve başka etkinin bulunmadığı varsayımıyla, tasfiye sonucu düzeltilirken mükellefe
    iade edilecek kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '25.000'
    B: '50.000'
    C: '100.000'
    D: '125.000'
    E: '150.000'
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 17/1-c''ye göre tasfiyenin zararla kapanması hâlinde tasfiye sonucu önceki tasfiye dönemlerine doğru
      düzeltilir ve fazla ödenen vergi iade edilir. Tebliğ 17.1.1''e göre düzeltme, son tasfiye döneminin zararla sonuçlanması
      hâlinde yapılır; nihai sonuç (kâr toplamı − zarar) üzerinden vergi hesaplanır. Nihai kâr = 400.000 + 200.000 − 500.000
      = 100.000 TL, buna isabet eden vergi 25.000 TL''dir; önceden ödenen (100.000 + 50.000 = 150.000 TL) vergiden bu tutar
      düşülür: 150.000 − 25.000 = 125.000 TL. Püf noktaları: Son dönemin zararı bütün tasfiye dönemlerinin toplamında dikkate
      alınır; zarar toplam kârdan küçükse vergi tamamen iade edilmez, nihai kâr üzerinden kalan vergi bırakılır. Önce ödenmiş
      toplam vergiyi, sonra nihai matrahtan çıkan vergiyi bulun.'
    celdiriciler:
      A: 25.000 TL iade değil, nihai kâr üzerinden hesaplanan ve mükellefte kalacak vergidir.
      B: 50.000 TL yalnızca 2027 dönemi için ödenen vergidir; iade, ödenen toplam vergi ile nihai vergi arasındaki farktır.
      C: 100.000 TL yalnızca 2026 dönemi vergisidir; dönemlerin ayrı ayrı iadesi değil toplu düzeltme yapılır.
      E: 150.000 TL ödenen toplam vergidir; nihai sonuç zarar olsaydı tamamı iade edilirdi, ancak nihai sonuç 100.000 TL kârdır.
    hesap_adimlari:
    - 'Ödenen vergi: (400.000 + 200.000) × %25 = 150.000 TL'
    - 'Nihai tasfiye kârı: 600.000 − 500.000 = 100.000 TL; vergi = 25.000 TL'
    - 'İade: 150.000 − 25.000 = 125.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/1-c
    alinti: Tasfiyenin zararla kapanması halinde tasfiye sonucu, önceki tasfiye dönemlerine doğru düzeltilir ve anılan dönemlerde
      fazla ödenen vergi mükellefe iade edilir.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: Tebliğ 17.1.1
    alinti: Düzeltme işlemleri ancak son tasfiye döneminin zararla sonuçlanması halinde yapılacaktır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'odenen = (400000+200000)*0.25

      nihai = (400000+200000-500000)*0.25

      sonuc = odenen - nihai'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
