  - YMM
  ders: REV
  unite: Geçici ve af düzenlemeleri
  konu: GEC
  kazanim: yeniden değerleme (VUK mükerrer 298/ç)
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (M) A.Ş.''nin 31/12/2025 tarihli yasal kayıtlarında yer alan iktisadi kıymetler şunlardır (TL):


    | Kıymet | Aktife giriş | Maliyet | Birikmiş amortisman |

    |---|---|---|---|

    | Makine X | 2022 | 1.200.000 | 650.000 |

    | Makine Y | 2025 | 500.000 | 100.000 |

    | Fabrika binası | 2020 | 1.500.000 | 500.000 |

    | Arsa | 2018 | 1.000.000 | — |


    Makine X''in maliyetinde 2023 yılında eklenen 200.000 TL kur farkı bulunmaktadır; bu kur farkına isabet eden birikmiş
    amortisman 50.000 TL''dir. Şirket 31/12/2025 itibarıyla VUK mükerrer md. 298/Ç kapsamında yeniden değerleme yapacaktır;
    2025 oranı %25,49''dur. Pasifte özel fon hesabına alınacak toplam değer artışı kaç TL''dir?'
  secenekler:
    A: 356.860 TL
    B: 395.095 TL
    C: 458.820 TL
    D: 497.055 TL
    E: 611.760 TL
  dogru: A
  aciklama:
    dogru_neden: 'Yalnız amortismana tabi kıymetler değerlenir; arsa kapsam dışıdır. Aktife girdiği hesap döneminde değerleme
      yapılmaz; 2025''te aktife giren Makine Y değerlenmez (298/Ç-9). Aktifleştirme dönemi dışında maliyete eklenen kur farkı
      ve buna isabet eden amortisman kapsam dışıdır (298/Ç-1): Makine X net = (1.200.000 − 200.000) − (650.000 − 50.000) =
      400.000 TL → 400.000 × %25,49 = 101.960 TL. Bina net 1.000.000 TL → 254.900 TL. Toplam = 356.860 TL. Püf noktaları:
      Üç ayrı eleme yapın: amortismana tabi olmayan arsa, aktife girdiği yıl değerlenemeyen makine ve sonradan eklenen kur
      farkı ile onun amortismanı.'
    celdiriciler:
      B: Makine X'in maliyetine sonradan eklenen kur farkı ve amortismanı değerlemeye dahil edilmiştir (550.000 × %25,49 +
        254.900).
      C: 2025'te aktife giren Makine Y de değerlenmiştir (101.960 + 101.960 + 254.900).
      D: Hem kur farkı dahil edilmiş hem de Makine Y değerlenmiştir.
      E: Amortismana tabi olmayan arsa da değerlemeye katılmıştır (356.860 + 254.900).
    hesap_adimlari:
    - 'Makine X: (1.000.000 − 600.000) × 0,2549 = 101.960 TL'
    - 'Makine Y: aktife girdiği yıl → değerlenmez'
    - 'Bina: 1.000.000 × 0,2549 = 254.900 TL'
    - 'Arsa: amortismana tabi değil → değerlenmez'
    - 'Toplam: 356.860 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. md. 298/Ç-1
    alinti: kur farkları ve kredi faizleri (bunlara isabet eden amortismanlar dâhil) yeniden değerleme kapsamına girmez
  - mevzuat: 213 sayılı Vergi Usul Kanunu
