  konu: GEC
  kazanim: yeniden değerleme (VUK mükerrer 298/ç)
  tip: uygulama
  zorluk: 3
  kok: '(N) A.Ş., 31/12/2025''te VUK mükerrer md. 298/Ç kapsamında bir makineyi yeniden değerlemiştir: değerleme öncesi maliyet
    2.000.000 TL, birikmiş amortisman 1.200.000 TL; oran %25,49. Değer artışı 522 hesabına alınmıştır. Makine 2/1/2026''da
    1.300.000 TL''ye satılmış, 2026 yılı için amortisman ayrılmamıştır. VUK md. 328 uygulanmayacaktır. Satış işleminin vergisel
    sonucu hakkında aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Fon pasifte kalmaya devam eder; vergiye tabi satış kazancı yeni net değere göre 296.080 TL'dir.
    B: Fon amortisman gibi işlem görür; vergiye tabi satış kazancı 500.000 TL'dir.
    C: Fon sermayeye eklenmedikçe vergilendirilmez; vergiye tabi satış kazancı 296.080 TL'dir ve fon beş yıl tutulur.
    D: Fon satış yılında ayrıca gelir yazılır ve satış kazancına eklenir; vergiye tabi toplam tutar 703.920 TL'dir.
    E: Fonun yarısı amortisman gibi işlem görür; kalan yarısı pasifte kalır ve vergiye tabi satış kazancı 398.040 TL'dir.
  dogru: B
  aciklama:
    dogru_neden: 'Değerleme sonrası maliyet 2.509.800 TL, amortisman 1.505.880 TL, net 1.003.920 TL; değer artışı 1.003.920
      − 800.000 = 203.920 TL. 298/Ç-7''ye göre değerlenen kıymetin elden çıkarılmasında fondaki değer artışı aynen amortismanlar
      gibi işlem görür. Vergiye tabi satış kazancı = 1.300.000 − (1.003.920 − 203.920) = 500.000 TL; bu, değerleme öncesi
      net değere göre bulunan kazançla aynıdır. Püf noktaları: Fon birikmiş amortisman gibi düşüldüğünden yeniden değerleme
      satış kazancını vergi dışında bırakmaz; fonu ayrıca gelire eklemek çift sayım olur.'
    celdiriciler:
      A: Fon dikkate alınmadan yeni net değer (1.003.920 TL) üzerinden kazanç hesaplanmıştır; kanun fonun amortisman gibi
        işlem görmesini öngörür.
      C: Fonun amortisman gibi işlem görmesi satışla birlikte gerçekleşir; beş yıllık fon süresi md. 5/1-e'ye aittir.
      D: 'Fon iki kez dikkate alınmıştır: hem amortisman gibi hem de ayrıca gelir olarak.'
      E: Kanun fonun tamamının amortisman gibi işlem görmesini öngörür; bölme yapılmaz.
    hesap_adimlari:
    - 'Sonraki net: 800.000 × 1,2549 = 1.003.920 TL; fon 203.920 TL'
    - 'Vergisel net: 1.003.920 − 203.920 = 800.000 TL'
    - 'Satış kazancı: 1.300.000 − 800.000 = 500.000 TL'
  kaynaklar:
