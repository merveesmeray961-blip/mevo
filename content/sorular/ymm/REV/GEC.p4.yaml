  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Geçici ve af düzenlemeleri
  konu: GEC
  kazanim: varlık barışı
  tip: hesaplama
  zorluk: 3
  kok: '(F) A.Ş., KVK geçici md. 19 kapsamında Eylül 2026''da yurt dışındaki 2.000.000 TL''lik mevduatını bildirmiş, iki ay
    içinde Türkiye''ye transfer etmiş ve vergisini ödemiştir; taahhütlere de uyulmuştur. Şirket nezdinde Mart 2027''de başlayan
    ve 2025 yılını kapsayan vergi incelemesinde iki matrah farkı bulunmuştur: (i) bildirilen varlıklar nedeniyle ortaya çıktığı
    tespit edilen 3.000.000 TL''lik kayıt dışı hasılat; (ii) bildirilen varlıklarla ilgisi olmayan 500.000 TL''lik kanunen
    kabul edilmeyen gider. Bu inceleme sonucunda kurumlar vergisi tarhiyatına esas alınacak toplam matrah farkı kaç TL''dir?'
  secenekler:
    A: 0 TL
    B: 500.000 TL
    C: 1.000.000 TL
    D: 1.500.000 TL
    E: 3.500.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'md. 19/8''e göre bildirilen varlıklar nedeniyle ortaya çıktığı tespit edilen matrah farkı varlık tutarından
      büyükse yalnız aradaki fark üzerinden tarhiyat yapılır: 3.000.000 − 2.000.000 = 1.000.000 TL. Varlıklar dışındaki nedenlerle
      bulunan farktan bildirilen tutar mahsup edilmez; 500.000 TL''nin tamamı tarhiyata esastır. Bildirim incelemeden önce
      yapıldığından güvence geçerlidir. Toplam = 1.500.000 TL. Püf noktaları: Bildirilen tutar yalnız varlıktan kaynaklanan
      farka karşı kalkan olur; ilgisiz farkı azaltmak için kullanılamaz.'
    celdiriciler:
      A: Güvence bildirilen varlık tutarıyla sınırlıdır; aşan fark ve ilgisiz fark tarhiyata konu olur.
      B: Varlıktan kaynaklanan farkın varlık tutarını aşan 1.000.000 TL'lik kısmı da tarhiyata esastır.
      C: Varlıklarla ilgisi olmayan 500.000 TL fark ayrıca tarhiyata esastır.
      E: Bildirilen 2.000.000 TL, varlıktan kaynaklanan farkı azaltır; farkların tamamı tarhiyata esas alınamaz.
    hesap_adimlari:
    - 'Varlıktan kaynaklanan fark: 3.000.000 − 2.000.000 = 1.000.000 TL'
    - 'İlgisiz fark: 500.000 TL (mahsup yok)'
    - 'Toplam: 1.500.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 19/8
    alinti: Bulunan matrah farkının, bildirilen varlıklar nedeniyle ortaya çıktığının tespitine rağmen söz konusu varlık tutarlarından
      büyük olması durumunda sadece aradaki fark tutar üzerinden vergi tarhiyatı yapılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 19/8
    alinti: bu madde kapsamında bildirilen tutarlar, bulunan matrah farkından mahsup edilmeksizin tarhiyat yapılır
