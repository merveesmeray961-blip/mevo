- id: YMM-REV-GEC-0017
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Geçici ve af düzenlemeleri
  konu: GEC
  kazanim: yeniden değerleme sonrası değer artışı fonu (VUK mük. 298/Ç)
  tip: hesaplama
  zorluk: 2
  kok: Enflasyon düzeltmesi şartları oluşmayan bir kurumun 2025 hesap dönemi sonunda bilançosunda yer alan makinesinin maliyet
    bedeli 2.000.000 TL, pasifteki birikmiş amortismanı 800.000 TL'dir. Makine, 2021 yılında aktife girmiş olup kur farkı
    veya kredi faizi içermemektedir. Yeniden değerleme oranı %25 kabul edildiğine göre mük. md. 298/Ç uyarınca pasifte özel
    fon hesabında gösterilecek değer artışı kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '300.000'
    C: '500.000'
    D: 1.500.000
    E: 2.500.000
  dogru: B
  aciklama:
    dogru_neden: 'Net bilanço aktif değeri 2.000.000 − 800.000 = 1.200.000 TL''dir. Maliyet ve amortisman ayrı ayrı oranla
      çarpılır: maliyet 2.500.000, amortisman 1.000.000; yeni net değer 1.500.000 TL. Değer artışı yeni net ile eski net değer
      arasındaki fark olan 300.000 TL''dir.'
    celdiriciler:
      A: Yalnızca amortismanın artışı (800.000 × %25 = 200.000) alınmıştır.
      C: Yalnızca maliyet bedelindeki artış (2.000.000 × %25 = 500.000) alınmıştır; amortismandaki artış düşülmemiştir.
      D: Yeniden değerleme sonrası net değer (1.500.000 TL) değer artışı sanılmıştır; artış, net değerler arasındaki farktır.
      E: Yeniden değerleme sonrası maliyet bedeli (2.500.000 TL) değer artışı sanılmıştır.
    hesap_adimlari:
    - Eski net değer = 2.000.000 − 800.000 = 1.200.000
    - Yeni net değer = 1.200.000 × 1,25 = 1.500.000
    - Değer artışı = 1.500.000 − 1.200.000 = 300.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/4
    alinti: Değer artışı, iktisadi kıymetlerin yeniden değerleme sonrası ve yeniden değerleme öncesi net bilanço aktif değerleri
      arasındaki farktır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/3
    alinti: 3. İktisadi kıymetlerin (2) numaralı bende göre tespit edilen değerleri ve bunlara ilişkin amortismanların, yeniden
      değerlemenin yapılacağı yıla ait olan yeniden değerleme oranı ile çarpılması suretiyle yeniden değerleme sonrası değerleri
      bulunur.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = (2000000 - 800000) * 0.25
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-06'
        not: 'kabul örneklemesi: REV örneklem kusuru %0 (n=10), yerel model tuttu'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
