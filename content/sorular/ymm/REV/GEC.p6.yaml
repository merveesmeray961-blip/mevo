      C: Kıst uygulaması öngörülmemiştir; aktife giriş dönemi bütünüyle kapsam dışıdır.
      D: Aktife giren kıymet türüne göre bir ayrım yapılmamıştır; tüm kıymetler için bent 9 geçerlidir.
