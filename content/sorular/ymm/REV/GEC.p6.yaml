- id: YMM-REV-GEC-0018
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Geçici ve af düzenlemeleri
  konu: GEC
  kazanim: küresel asgari tamamlayıcı vergi geçiş dönemi kolaylığı (KVK geç. md. 17/1-e)
  tip: kavrama
  zorluk: 3
  kok: 'KVK geçici md. 17(1)(e) kapsamında, bir ülkedeki yerel ve küresel asgari tamamlayıcı kurumlar vergisinin sıfır kabul
    edilmesine ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Ülke bazlı rapordaki toplam hasılatın 10 milyon avro karşılığı Türk lirasından ve vergi öncesi kârın 1 milyon avro
    karşılığı Türk lirasından az olması şartı sağlanırsa kolaylıktan yararlanılır.

    II. Ülke bazlı vergi yükünün 2026 hesap dönemi için %16''ya eşit veya daha fazla olması, kolaylıktan yararlanmak için
    yeterlidir.

    III. Vergi öncesi kârın, çalışanların brüt ücretleri ile maddi duran varlıkların net defter değerine ilgili yıl oranlarının
    uygulanmasıyla bulunan tutarların toplamına eşit veya bu tutardan az olması şartı sağlanırsa kolaylıktan yararlanılır.'
  secenekler:
    A: Yalnız I
    B: I ve III
    C: Yalnız II
    D: I ve II
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'Geçici md. 17(1)(e) şartlardan herhangi birinin sağlanmasını yeterli sayar: hasılat/kâr sınırları (alt bent
      1), vergi yükü testi (alt bent 2) ve ücret ile maddi duran varlık bazlı test (alt bent 3). Vergi yükü eşiği 2024 için
      %15, 2025 için %16, 2026 için %17''dir; bu nedenle II yanlıştır. Püf noktaları: eşik oranı dönemle artar (15-16-17);
      hasılat ve kâr sınırlarında "az olması" aranır, eşitlik yetmez.'
    celdiriciler:
      A: III de doğrudur; ücret ve maddi duran varlık bazlı test de bağımsız bir şarttır.
      C: I ve III doğrudur; vergi yükü eşiği 2026 için %17 olduğundan II yanlıştır.
      D: II yanlıştır (2026 için %17 gerekir), I de doğrudur.
      E: II yanlıştır; 2026 hesap dönemi eşiği %16 değil %17'dir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Geçici md. 17/1-e/1
    alinti: 1) 24/2/2020 tarihli ve 2151 sayılı Cumhurbaşkanı Kararı kapsamında düzenlenen ülke bazlı rapor ile ilgili ülke
      mevzuatı uyarınca hazırlanan benzer nitelikteki ülke bazlı raporlarda toplam hasılatın 10 milyon avro karşılığı Türk
      lirasından ve vergi öncesi kârın 1 milyon avro karşılığı Türk lirasından az olması,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Geçici md. 17/1-e/2
    alinti: 2) Çok uluslu işletme grubunun uluslararası kabul görmüş finansal muhasebe standartlarına göre hesaplanan ülke
      bazlı kurumlar vergisi ve benzer nitelikteki vergilerinin toplamının, (e) bendinin (1) numaralı alt bendi kapsamında
      düzenlenen ülke bazlı raporlardaki vergi öncesi kârlara bölünmesi suretiyle hesaplanan vergi yükünün; 2024 hesap dönemi
      için %15, 2025 hesap dönemi için %16 ve 2026 hesap dönemi için %17 oranlarına eşit veya daha fazla olması,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Geçici md. 17/1-e/3
    alinti: 3) Çok uluslu işletme grubunun, (1) numaralı alt bent kapsamında düzenlenen ülke bazlı raporlarındaki vergi öncesi
      kârının; bunların çalışanlarının brüt ücretleri ile maddi duran varlıklarının net defter değerinin, (a) bendi kapsamında
      ilgili yıl için hesaplanacak oranla çarpılan tutarların toplamına eşit veya bu tutardan daha az olması.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
