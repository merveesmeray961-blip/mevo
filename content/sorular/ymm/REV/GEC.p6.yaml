- id: YMM-REV-GEC-0020
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Geçici ve af düzenlemeleri
  konu: GEC
  kazanim: örtülü sermaye ve geçici md. 20 (KVK md. 12)
  tip: hesaplama
  zorluk: 3
  kok: Nükleer enerji santrali yatırımı için önlisans almış (E) A.Ş.'nin 1/1/2026 tarihli öz sermayesi 10.000.000 TL'dir.
    Şirket, ortağından 22.000.000 TL borç almış; ayrıca ortakla ilişkili ve ana faaliyet konusuna uygun faaliyet gösteren
    bir bankadan nükleer enerji santrali yatırımı kapsamında, KVK md. 12/2'deki şartlarla 40.000.000 TL kredi kullanmıştır.
    Başka borcu yoktur. KVK geçici md. 20 uygulandığına göre 2026 hesap dönemi için örtülü sermaye sayılacak tutar kaç TL'dir?
  secenekler:
    A: 2.000.000
    B: 10.000.000
    C: 12.000.000
    D: 32.000.000
    E: 42.000.000
  dogru: A
  aciklama:
    dogru_neden: 'Geçici md. 20 ile banka borçlarına uygulanan %50 oranı %25 olur: 40.000.000 × %25 = 10.000.000 TL. Karşılaştırmaya
      giren borç 22.000.000 + 10.000.000 = 32.000.000 TL, sınır 3 × 10.000.000 = 30.000.000 TL olduğundan örtülü sermaye 2.000.000
      TL''dir. Püf noktaları: sınır öz sermayenin üç katıdır; öz sermaye hesap dönemi başındaki tutardır; geçici md. 20 yalnızca
      md. 12/2''deki banka borçlanmalarına uygulanan oranı değiştirir.'
    celdiriciler:
      B: Yalnızca banka kredisinin %25'lik payı (10.000.000 TL) alınmıştır; ortak borcu ve sınır hesaba katılmamıştır.
      C: Geçici md. 20 uygulanmadan %50 oranıyla bulunan tutardır (42.000.000 − 30.000.000).
      D: Karşılaştırmaya giren toplam borç (32.000.000 TL) örtülü sermaye sanılmıştır; sınır düşülmemiştir.
      E: Geçici md. 20 uygulanmadan, %50 oranıyla bulunan karşılaştırma tutarı (42.000.000 TL) örtülü sermaye sanılmış, sınır
        düşülmemiştir.
    hesap_adimlari:
    - Karşılaştırmaya giren borç = 22.000.000 + 40.000.000 × 0,25 = 32.000.000
    - Sınır = 3 × 10.000.000 = 30.000.000
    - Örtülü sermaye = 2.000.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1
    alinti: Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden doğrudan veya dolaylı olarak temin ederek işletmede
      kullandıkları borçların, hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı, ilgili
      hesap dönemi için örtülü sermaye sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Geçici md. 20/1
    alinti: (1) Nükleer enerji santrallerinde elektrik enerjisi üretimi faaliyetinde bulunmak için önlisans ve/veya lisans
      alan kurumların nükleer enerji santrali yatırımları kapsamında 12 nci maddenin ikinci fıkrasında yer alan şartlarla
      yaptıkları borçlanmalar için, aynı fıkrada yer alan %50 oranı 31/12/2045 tarihine kadar %25 olarak uygulanır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = (22000000 + 40000000*0.25) - 3*10000000
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-05'
        not: 'hakem kabul: Anahtar bağımsız çözümle ve kaynak metinle doğrulandı; tek doğru şık, açıklama tutarlı.'
