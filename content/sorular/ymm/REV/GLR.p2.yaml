  konu: GLR
  kazanim: kanunen kabul edilmeyen giderler
  tip: hesaplama
  zorluk: 1
  kok: X A.Ş.'nin 2026 yılında gider yazdığı 1.400.000 TL tutarındaki ilan ve reklam giderlerinin 360.000 TL'si, şirketin
    ürettiği alkollü içkilere ait ilan ve reklam giderleridir; kalan kısım alkol ve tütün mamulleriyle ilgisi bulunmayan ürünlere
    aittir. Kanunda yer alan oran Cumhurbaşkanınca değiştirilmemiştir. YMM'nin gelir tablosu revizyonunda, bu giderlerden
    kurum kazancının tespitinde kanunen kabul edilmeyen gider olarak dikkate alınması gerektiğini tespit edeceği tutar kaç
    TL'dir?
  secenekler:
    A: '90.000'
    B: '180.000'
    C: '360.000'
    D: '520.000'
    E: '700.000'
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 11/1-(ı) uyarınca her türlü alkol ve alkollü içkiler ile tütün ve tütün mamullerine ait ilan ve
      reklam giderlerinin %50''si kurum kazancının tespitinde indirilemez. Kısıtlama yalnız alkollü içkilere ait 360.000 TL''lik
      kısma uygulanır: 360.000 × %50 = 180.000 TL kanunen kabul edilmeyen giderdir; diğer ürünlerin reklam giderleri (1.040.000
      TL) indirilebilir.'
    celdiriciler:
      A: Oran %25 alınmıştır; kanuni oran %50'dir.
      C: Alkollü içki reklam giderinin tamamı kabul edilmeyen gider sayılmıştır; hüküm giderin yalnız %50'sini kapsar.
      D: '%50 oranı alkol dışı ürünlere ait 1.040.000 TL''ye uygulanmıştır; kısıtlama yalnız alkol ve tütün mamullerine ait
        reklam giderlerine ilişkindir.'
      E: '%50 oranı reklam giderlerinin tamamına (1.400.000 TL) uygulanmıştır.'
    hesap_adimlari:
    - 'Kısıtlamaya tabi gider: alkollü içki reklamı 360.000 TL'
    - 'KKEG: 360.000 × %50 = 180.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-(ı)
    alinti: ı) Her türlü alkol ve alkollü içkiler ile tütün ve tütün mamullerine ait ilan ve reklam giderlerinin % 50’si.
      Cumhurbaşkanı bu oranı % 100’e kadar artırmaya veya sıfıra kadar indirmeye yetkilidir.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 360000 * 0.50
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi REV-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
