    Şirketin 2026 yılında gider yazdığı tutarlar şunlardır (TL):

    - Banka kredisi faizleri: 2.400.000

    - Kredi faizleri üzerinden hesaplanan banka ve sigorta muameleleri vergisi: 120.000

    - Döviz kredilerinin değerlemesinden doğan kur farkı gideri: 680.000

    - Banka teminat mektubu komisyonları: 90.000

    - Kredi sözleşmeleri için ödenen damga vergisi: 40.000

    - Müşterilere tanınan erken ödeme iskontoları: 50.000

    Ayrıca, yapımı süren bir tesis için kullanılan krediye ait 600.000 TL faiz, yapılmakta olan yatırımlar hesabında maliyete
    eklenmiştir. Cumhurbaşkanınca belirlenen oran %10 olduğuna göre, YMM''nin finansman gider kısıtlaması nedeniyle kanunen
    kabul edilmeyen gider olarak tespit edeceği tutar kaç TL''dir?'
