    dogru_neden: 'GVK md. 42''ye göre yıllara yaygın inşaat işinde kâr veya zarar işin bittiği yıl kesin olarak tespit edildiğinden,
      bu işe ait giderler iş bitene kadar 170 hesabında maliyet olarak birikir. Yıl içinde yıllara yaygın bir işin, bu kapsama
      girmeyen işlerle birlikte yapılması hâlinde ortak genel giderler md. 43/2 uyarınca ''yıllara yaygın işe ait harcamalar''
      ile ''diğer işlere ait satış ve hasılat tutarları'' oranında dağıtılır: 2.000.000 × 6.000.000 / (6.000.000 + 14.000.000)
      = 600.000 TL. Bu pay gider hesaplarından çıkarılıp 170 hesabına aktarılınca (MSUGT: ortak gider payları yansıtma hesaplarının
      alacağı karşılığında 170''e borç kaydedilir) 2026 ticari kârı 600.000 TL artar. Püf noktaları: Dağıtım anahtarı karmadır:
      yıllara yaygın işte ''harcama'', diğer işlerde ''satış ve hasılat'' alınır. Hakediş bedelleri ve diğer işlerin maliyeti
