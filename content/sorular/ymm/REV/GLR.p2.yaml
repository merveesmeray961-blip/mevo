    B: '77.000'
    C: '80.000'
    D: '84.500'
    E: '95.000'
  dogru: C
  aciklama:
    dogru_neden: 'Yabancı kaynaklar öz kaynakları 10.000.000 TL aştığından kısıtlama, finansman giderlerinin aşan kısma isabet
      eden payına uygulanır: 10.000.000 / 40.000.000 = %25. Kısıtlamaya tabi giderler yabancı kaynağın kullanım süresine bağlı
      olarak doğanlardır: kredi faizleri (2.400.000), faizler üzerinden hesaplanan BSMV (120.000) ve kur farkı (680.000) =
      3.200.000 TL. Teminat mektubu komisyonu ve kredi sözleşmesi damga vergisi kullanım süresine bağlı değildir; erken ödeme
      iskontosu finansman geliri azalmasıdır; yatırımın maliyetine eklenen 600.000 TL faiz kanun gereği kapsam dışıdır. KKEG:
      3.200.000 × %25 × %10 = 80.000 TL. Püf noktaları: Aynı ''banka masrafı'' görünümündeki kalemleri, kredinin kullanım
      süresine bağlı olup olmadıklarına göre ayırın: faiz üzerinden hesaplanan BSMV kapsamda, sözleşme damga vergisi kapsam
      dışıdır. Oranın paydası öz kaynak değil toplam yabancı kaynaktır.'
    celdiriciler:
      A: 'Kur farkı kısıtlama dışında bırakılmıştır: 2.520.000 × %25 × %10; oysa kur farkı hükümde sayılan finansman giderlerindendir.'
      B: 'Kredi faizleri üzerinden hesaplanan BSMV dışarıda bırakılmıştır: 3.080.000 × %25 × %10; faize bağlı olarak doğan
        BSMV kısıtlamaya tabidir.'
      D: 'Teminat mektubu komisyonu, damga vergisi ve erken ödeme iskontosu da hesaba katılmıştır: 3.380.000 × %25 × %10.'
      E: 'Yatırımın maliyetine eklenen 600.000 TL faiz de hesaba katılmıştır: 3.800.000 × %25 × %10; maliyete eklenen tutarlar
        kısıtlama dışıdır.'
    hesap_adimlari:
    - 'Aşan kısım: 40.000.000 − 30.000.000 = 10.000.000; oran 10.000.000 / 40.000.000 = %25'
    - 'Kısıtlamaya tabi giderler: 2.400.000 + 120.000 + 680.000 = 3.200.000'
    - 'Aşan kısma isabet eden: 3.200.000 × %25 = 800.000'
    - 'KKEG: 800.000 × %10 = 80.000'
  kaynaklar:
