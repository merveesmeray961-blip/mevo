  kok: Z A.Ş. (7/A seçeneği, fiilî maliyet sistemi) 2026 yılı gelir tablosu revizyonunda, üretimin yapıldığı fabrika binasına
    ait 600.000 TL'lik yıllık kira giderinin tamamının 770 Genel Yönetim Giderleri hesabına kaydedildiği ve dönem sonunda
    632 hesabı aracılığıyla gelir tablosuna aktarıldığı belirlenmiştir. Şirketin dönem başı ve dönem sonu yarı mamul stoku
    ile dönem başı mamul stoku yoktur; 2026'da üretilen mamullerin %75'i yıl içinde satılmış, %25'i dönem sonunda stokta kalmıştır.
    Kira gideri genel üretim gideri olarak üretim maliyetine yüklendiğinde şirketin 2026 yılı ticari kârı nasıl etkilenir?
    (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 150.000 TL azalır
    B: Değişmez
    C: 150.000 TL artar
    D: 450.000 TL artar
    E: 600.000 TL artar
  dogru: C
  aciklama:
    dogru_neden: Fabrika binası kirası, üretimle ilgili olup dağıtım yoluyla maliyete yansıtılan bir genel üretim gideridir
      (730); VUK md. 275 uyarınca genel imal giderlerinden mamule düşen hisse maliyetin zorunlu unsurudur. Düzeltmeyle genel
      yönetim giderleri 600.000 TL azalır; aynı tutar üretim maliyetine girer ve satılan %75'i (450.000 TL) satılan mamuller
      maliyetine, %25'i (150.000 TL) dönem sonu mamul stokuna (152) yüklenir. Gelir tablosundaki gider toplamı 150.000 TL
      azaldığından ticari kâr 150.000 TL artar.
    celdiriciler:
      A: Stokta kalan pay gider artışı gibi değerlendirilmiş, işaret ters alınmıştır.
      B: Düzeltmenin yalnız gelir tablosu içinde sınıflandırma değişikliği olduğu varsayılmıştır; oysa kiranın bir kısmı stokta
        kalan mamulde aktifleşir.
      D: Satılan mamullere düşen pay (450.000 TL) kâr artışı sanılmıştır; bu kısım yine gider (SMM) olarak sonuç hesaplarında
        kalır.
      E: Gider hesaplarından çıkan tutarın tamamı kâr artışı sayılmış, satılan mamullere düşen kısmın SMM'ye girdiği gözden
        kaçırılmıştır.
    hesap_adimlari:
    - '770''ten çıkan gider: 600.000 TL'
    - 'SMM''ye giren pay: 600.000 × %75 = 450.000 TL'
    - '152 Mamuller''de kalan pay: 600.000 × %25 = 150.000 TL'
    - 'Kâra net etki: −450.000 + 600.000 = +150.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 275
    alinti: 3. Genel imal giderlerinden mamule düşen hisse;
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) — Tekdüzen Hesap Planı Açıklamaları'
