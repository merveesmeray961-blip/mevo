  kok: 'Q İnşaat A.Ş., 2026 yılında 2025''te başlayıp 2027''de bitecek yıllara yaygın bir inşaat işini sürdürmüş; ayrıca yıl
    içinde başlayıp biten, yıllara yaygın olmayan taahhüt işleri yapmıştır. 2026 yılına ilişkin veriler şunlardır (TL):

    - Yıllara yaygın inşaat işine ait harcamalar: 6.000.000

    - Bu iş için 2026''da düzenlenip onaylanan hakediş bedelleri: 11.000.000

    - Diğer işlerin satış ve hasılat tutarı: 14.000.000

    - Diğer işlerin maliyeti: 10.000.000

    - İki iş için ortak genel giderler: 2.000.000

    Şirket ortak genel giderlerin tamamını 2026 yılı gideri olarak sonuç hesaplarına aktarmıştır. Enflasyon düzeltmesi yapılmamaktadır.
    Ortak genel giderlerden yıllara yaygın inşaat işine düşen pay GVK md. 43''e göre ilgili 170 hesabına aktarıldığında şirketin
    2026 yılı ticari kârı kaç TL artar?'
