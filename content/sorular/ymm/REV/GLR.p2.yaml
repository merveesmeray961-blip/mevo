    madde: md. 11/1-(i)
    alinti: kullanılan yabancı kaynakları öz kaynaklarını aşan işletmelerde, aşan kısma münhasır olmak üzere, yatırımın maliyetine
      eklenenler hariç, işletmede kullanılan yabancı kaynaklara ilişkin faiz, komisyon, vade farkı, kâr payı, kur farkı ve
      benzeri adlar altında yapılan gider ve maliyet unsurları toplamının %10’unu aşmamak üzere Cumhurbaşkanınca kararlaştırılan
      kısmı.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: 11.13.4
    alinti: Teminat mektubu komisyonları, tahvil ihracı ile ilgili olarak yapılan baskı ve benzeri giderler ile ipotek masrafları
      gibi herhangi bir yabancı kaynak kullanımına bağlı olmaksızın yapılan giderlerin gider kısıtlamasına konu edilmesi söz
      konusu değildir.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
