      D: Ortak giderler iki işe eşit bölünmüştür; kanun oransal dağıtım öngörür.
      E: 2026 gideri olarak kalması gereken pay (1.400.000 TL), 170'e aktarılacak pay sanılmıştır.
    hesap_adimlari:
    - 'Dağıtım anahtarı: 6.000.000 / (6.000.000 + 14.000.000) = %30'
    - 'Yıllara yaygın işe düşen pay: 2.000.000 × %30 = 600.000 TL (170''e aktarılır)'
    - '2026''da gider olarak kalan: 1.400.000 TL; ticari kâr artışı 600.000 TL'
