  - YMM
  ders: REV
  unite: Gelir tablosu hesaplarının revizyonu
  konu: GLR
  kazanim: hasılatın dönemselliği
  tip: uygulama
  zorluk: 2
  kok: Esas faaliyeti kiralama olmayan Y A.Ş., 1.10.2026'da sahibi olduğu bir depoyu 1.10.2026–30.9.2027 dönemi için kiraya
    vermiş; 12 aylık kira bedeli olan 480.000 TL'yi aynı gün peşin tahsil ederek tamamını 649 Diğer Olağan Gelir ve Kârlar
    hesabına alacak kaydetmiştir. Kira geliri aylar itibarıyla eşit olarak doğmaktadır; KDV ve stopaj dikkate alınmayacaktır.
    Gelir tablosu revizyonunda, Tekdüzen Hesap Planı'na göre 31.12.2026 itibarıyla yapılması gereken düzeltme kaydı aşağıdakilerden
    hangisidir?
  secenekler:
    A: 649 hesabı borç 360.000 / 380 Gelecek Aylara Ait Gelirler hesabı alacak 360.000
    B: 649 hesabı borç 120.000 / 380 Gelecek Aylara Ait Gelirler hesabı alacak 120.000
    C: 649 hesabı borç 360.000 / 480 Gelecek Yıllara Ait Gelirler hesabı alacak 360.000
    D: 380 Gelecek Aylara Ait Gelirler hesabı borç 360.000 / 649 hesabı alacak 360.000
    E: 649 hesabı borç 360.000 / 340 Alınan Sipariş Avansları hesabı alacak 360.000
  dogru: A
  aciklama:
    dogru_neden: 'Dönemsellik kavramı gereği gelirler tahakkuk esasına göre ait oldukları döneme kaydedilir. 480.000 TL''nin
      3 aylık kısmı (Ekim–Aralık 2026: 120.000 TL) 2026 gelirdir; 9 aylık kısmı (Ocak–Eylül 2027: 360.000 TL) gelecek döneme
      aittir. Bu kısım bir yıldan kısa süreye ait peşin tahsil edilmiş gelir olduğundan 649 hesabından çıkarılarak 380 Gelecek
      Aylara Ait Gelirler hesabına alacak kaydedilir; 2027''de ait olduğu aylarda ilgili gelir hesabına devredilir.'
    celdiriciler:
      B: 2026'ya ait 3 aylık tutar ertelenmiştir; ertelenmesi gereken, 2027'ye ait 9 aylık kısımdır.
      C: 480 hesabı bir yıldan uzun süreye ait peşin tahsil edilen gelirler içindir; ertelenen kısım bir yıldan kısa süreye
        aittir.
      D: Kayıt ters yönde yapılmıştır; 2026 gelirini azaltmak yerine artırır.
      E: 340 hesabı alınan sipariş avansları içindir; tahsil edilmiş kira geliri dönemsellik gereği 380 hesabında izlenir.
    hesap_adimlari:
    - 'Aylık kira: 480.000 / 12 = 40.000 TL'
    - '2027''ye ait kısım: 9 × 40.000 = 360.000 TL → 380'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) — Tekdüzen Hesap Planı Açıklamaları'
    madde: 380 Gelecek Aylara Ait Gelirler
    alinti: Gelecek bilanço dönemlerine ait peşin tahsil olunan gelirlerin bir yıldan kısa süreye ait kısımlarının izlendiği
      hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) — Muhasebenin Temel Kavramları'
    madde: 4. Dönemsellik Kavramı
    alinti: Gelir ve giderlerin tahakkuk esasına göre muhasebeleştirilmesi, hasılat, gelir ve kârların aynı döneme ait maliyet,
      gider ve zararlarla karşılaştırılması bu kavramın gereğidir.
