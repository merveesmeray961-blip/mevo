  - YMM
  ders: REV
  unite: Gider ve gelir hesaplarının revizyonu
  konu: GLR
  kazanim: finansman gider kısıtlaması
  tip: hesaplama
  zorluk: 3
  kok: Finansal kuruluş niteliği taşımayan (C) A.Ş.'nin 31/12/2026 tarihli VUK bilançosuna göre kullandığı yabancı kaynaklar
    25.000.000 TL, öz kaynakları 15.000.000 TL'dir. Şirketin 2026 yılında yabancı kaynaklara ilişkin faiz, komisyon ve kur
    farkı toplamı 2.000.000 TL'dir. Bu tutarın 500.000 TL'si, yıl içinde envantere alınan yeni üretim tesisine ait olup VUK
    md. 262 uyarınca tesisin maliyetine eklenmiş; kalan 1.500.000 TL 780 Finansman Giderleri hesabına kaydedilmiştir. Finansman
    gider kısıtlaması nedeniyle 2026 yılı beyannamesinde KKEG olarak eklenecek tutar kaç TL'dir?
  secenekler:
    A: 60.000 TL
    B: 80.000 TL
    C: 150.000 TL
    D: 200.000 TL
    E: 600.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Yabancı kaynak öz kaynağı 10.000.000 TL aşmaktadır; aşan kısmın oranı 10.000.000 / 25.000.000 = %40. Yatırımın
      maliyetine eklenen 500.000 TL kapsam dışıdır. Aşan kısma isabet eden gider: 1.500.000 × %40 = 600.000 TL; KKEG = 600.000
      × %10 = 60.000 TL (3490 sayılı CBK). Püf noktaları: Önce maliyete eklenen yatırım finansmanını ayıklayın, sonra aşan
      kısım oranını yabancı kaynak toplamına göre hesaplayın; %10 oranı aşan kısma isabet eden tutara uygulanır.'
    celdiriciler:
      B: Yatırımın maliyetine eklenen 500.000 TL de hesaba katılmıştır (2.000.000 × %40 × %10).
      C: Oran aşan kısım ayrımı yapılmadan gider yazılan tutarın tamamına uygulanmıştır (1.500.000 × %10).
      D: Maliyete eklenen dahil tüm finansman giderine %10 uygulanmıştır.
      E: Aşan kısma isabet eden giderin tamamı KKEG sayılmış; %10 oranı uygulanmamıştır.
    hesap_adimlari:
    - 'Aşan kısım: 25.000.000 − 15.000.000 = 10.000.000 TL; oran %40'
    - 'Kapsamdaki gider: 2.000.000 − 500.000 = 1.500.000 TL'
    - 'İsabet eden: 1.500.000 × 0,40 = 600.000 TL'
    - 'KKEG: 600.000 × 0,10 = 60.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-i
    alinti: kâr payı, kur farkı ve benzeri adlar altında yapılan gider ve maliyet unsurları toplamının %10’unu aşmamak üzere
      Cumhurbaşkanınca kararlaştırılan kısmı
