  - YMM
  ders: REV
  unite: Gider ve gelir hesaplarının revizyonu
  konu: GLR
  kazanim: binek otomobil gider kısıtlaması
  tip: hesaplama
  zorluk: 2
  kok: Faaliyet konusu binek otomobil kiralama veya işletme olmayan (A) A.Ş., Temmuz 2026'da sıfır kilometre bir binek otomobil
    satın almış ve aynı ay aktifine kaydetmiştir. Aracın ÖTV ve KDV hariç bedeli 1.800.000 TL'dir; 900.000 TL ÖTV ile 540.000
    TL KDV gider yazılmayıp maliyet bedeline eklenmiştir. Şirket aracı %20 oranında normal amortismana tabi tutmuş ve VUK
    md. 320'deki binek otomobil kuralına göre 2026 yılı için kıst amortisman ayırmıştır. 2026 yılında ayrılan amortismanın
    kanunen kabul edilmeyen gider olarak beyannameye eklenecek kısmı kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 42.000 TL
    C: 64.000 TL
    D: 128.000 TL
    E: 186.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Vergiler maliyet bedeline eklendiğinden GVK md. 40/7 ve 332 Seri No.lu GV Genel Tebliği uyarınca 2026''da
      amortismana esas sınır 2.600.000 TL''dir. Amortismana tabi tutar 1.800.000 + 900.000 + 540.000 = 3.240.000 TL. Binek
      otomobillerde aktife girilen yılda kalan ay kadar amortisman ayrılır (Temmuz–Aralık, 6 ay). Ayrılan: 3.240.000 × %20
      × 6/12 = 324.000 TL; indirilebilir: 2.600.000 × %20 × 6/12 = 260.000 TL; KKEG = 64.000 TL.'
    celdiriciler:
      A: Amortismana tabi tutar 2.600.000 TL sınırını aştığından fark KKEG'dir.
      B: Vergiler hariç bedel ile 1.380.000 TL sınırı karşılaştırılmıştır; vergiler maliyete eklendiğinde sınır 2.600.000
        TL'dir ve karşılaştırma vergiler dahil tutarla yapılır.
      D: Binek otomobilde kıst amortisman zorunludur; tam yıl üzerinden hesaplanmıştır.
      E: Vergiler maliyete eklendiği hâlde 1.380.000 TL sınırı uygulanmıştır ((3.240.000 − 1.380.000) × %20 × 6/12).
    hesap_adimlari:
    - 'Amortismana tabi tutar: 3.240.000 TL; sınır 2.600.000 TL'
    - 'Ayrılan: 3.240.000 × 0,20 × 6/12 = 324.000 TL'
    - 'İndirilebilir: 2.600.000 × 0,20 × 6/12 = 260.000 TL'
    - 'KKEG: 64.000 TL'
  kaynaklar:
  - mevzuat: 332 Seri No.lu Gelir Vergisi Genel Tebliği
    madde: 2026 tutarları
    alinti: vergilerin maliyet bedeline eklendiği veya binek otomobilin ikinci el olarak iktisap edildiği hallerde 2.600.000
      TL
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 320
    alinti: otomobillerinin aktife girdiği hesap dönemi için ay kesri tam ay sayılmak suretiyle kalan ay süresi kadar amortisman
      ayrılır
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'tutar = 1800000 + 900000 + 540000

      sinir = 2600000

      ayrilan = tutar * 20 / 100 * 6 / 12

      indirilebilir = min(tutar, sinir) * 20 / 100 * 6 / 12

      sonuc = ayrilan - indirilebilir'
  durum: kontrolde
  surum: 1
  uretim:
