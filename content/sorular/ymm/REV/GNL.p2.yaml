  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: hesaplama
  zorluk: 3
  kok: 'Ticari alacakların varlığını test etmek için 31.12.2026 bakiyeleri üzerinden gönderilen olumlu teyit taleplerine gelen
    yanıtlarda aşağıdaki istisnalar belirlenmiş ve denetçi her birinin nedenini araştırmıştır:

    1. M1: Müşteri 30.12.2026''da 40.000 TL havale etmiş; tutar işletmenin hesabına 2.1.2027''de geçmiş ve o tarihte kaydedilmiştir.

    2. M2: İşletmenin 29.12.2026''da teslim edip aynı gün faturalandırdığı 25.000 TL''lik mal, müşteri kayıtlarına faturanın
    ulaştığı 4.1.2027''de alınmıştır.

    3. M3: Müşterinin 18.000 TL''lik ödemesi, işletmece yanlışlıkla başka bir müşterinin hesabına alacak kaydedilmiştir.

    4. M4: Müşterinin Aralık 2026''da iade ettiği 12.000 TL''lik mal için işletme hiçbir kayıt yapmamıştır.

    5. M5: İşletme, 3.1.2027''de sevk ettiği mal için 31.12.2026 tarihli fatura düzenleyerek 30.000 TL satış ve alacak kaydetmiştir.

    6. M6: Faturadaki birim fiyat hatası nedeniyle alacak 5.000 TL fazla kaydedilmiştir.


    BDS 505 ve BDS 530 dikkate alındığında, bu test açısından yanlışlık olarak değerlendirilecek istisnaların toplamı kaç
    TL''dir?

    '
  secenekler:
    A: '17.000'
    B: '47.000'
    C: '65.000'
    D: '90.000'
    E: '130.000'
  dogru: B
  aciklama:
    dogru_neden: 'BDS 505 par. 14 uyarınca istisnalar yanlışlık göstergesi olup olmadıklarına göre araştırılır; A22''ye göre
      zamanlama kaynaklı farklılıklar yanlışlık göstergesi olmayabilir. M1, teyit tarihinden önce gönderilip sonra teslim
      alınan ödemedir (BDS 530 A6: yanlışlık değildir). M2''de satış ve alacak işletmede doğru dönemde kaydedilmiştir; fark
      müşterinin kayıt zamanlamasından doğar. M3, müşteri hesapları arasındaki yanlış kayıttır ve toplam alacak bakiyesini
      etkilemediği için bu testte yanlışlık sayılmaz (A6). Yanlışlıklar: M4 iade 12.000 + M5 kesim hatası 30.000 + M6 fiyat
      hatası 5.000 = 47.000 TL. Püf noktaları: M5 de bir ''zamanlama'' konusudur ama hata işletmenin kendi kesim kaydındadır
      ve bilanço günü itibarıyla var olmayan alacak yaratır; M3 ise bu testte yanlışlık sayılmasa da şüpheli alacak ve hile
      riski değerlendirmesi için ayrıca not edilmelidir.'
    celdiriciler:
      A: 'M5''teki kesim (dönemsellik) hatası da zamanlama farkı sayılarak dışarıda bırakılmıştır: 12.000 + 5.000.'
      C: 'M3''teki müşteri hesapları arasındaki yanlış kayıt da eklenmiştir: 47.000 + 18.000; bu kayıt toplam alacak bakiyesini
        etkilemez.'
      D: 'Müşterinin kayıt zamanlamasından doğan M2 ile M3 de yanlışlık sayılmıştır: 47.000 + 25.000 + 18.000.'
      E: 'Tüm istisnalar araştırılmadan yanlışlık kabul edilmiştir: 40.000 + 25.000 + 18.000 + 12.000 + 30.000 + 5.000.'
    hesap_adimlari:
    - 'Yanlışlık sayılmayanlar: M1 (yoldaki tahsilat), M2 (müşterinin kayıt zamanlaması), M3 (müşteri hesapları arası kayıt)'
    - 'Yanlışlıklar: 12.000 + 30.000 + 5.000 = 47.000 TL'
