- id: YMM-REV-GNL-0025
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: uygulama
  zorluk: 2
  kok: Denetçi, X A.Ş.'nin yıl sonuna yakın tarihte ilişkisiz bir yurt dışı müşteriye yaptığı yüksek tutarlı satışa ilişkin
    alacak bakımından, yönetimin kontrolleri ihlal etmesi riski nedeniyle işletmeden elde edilen kanıtlara güvenemeyeceği
    sonucuna varmış ve yeterli ve uygun denetim kanıtı için bu alacağa ilişkin olumlu teyit yanıtının gerekli olduğuna karar
    vermiştir. Tekide rağmen yanıt alınamamış; yönetim, alacağın bir kısmının bilanço tarihinden sonra tahsil edildiğini gösteren
    banka dekontunu sunmuştur. BDS 505 'Dış Teyitler' uyarınca denetçinin izlemesi gereken yol hangisidir?
  secenekler:
    A: Sonraki tahsilatı alternatif prosedür olarak incelemek, dekont tutarı kadar kanıt elde edilmiş sayıp kalan kısım için
      olumsuz teyit talebi göndermek
    B: Yanıt alınamayan bakiyeyi teyit listesinden çıkarıp yerine benzer tutarlı başka bir müşteri bakiyesini olumlu teyide
      konu etmek
    C: Yanıt alınamamasını istisna olarak sınıflandırmak, tutarı yanlışlık kabul edip anakitleye yansıtarak prosedürü tamamlamak
    D: Alacağın gerçekliğine ilişkin yönetimden yazılı açıklama almak ve bu açıklamayı teyit yanıtının yerine kanıt olarak
      kullanmak
    E: Alternatif prosedürlerin ihtiyaç duyulan kanıtı sağlamayacağını kabul edip durumun etkisine BDS 705 uyarınca karar
      vermek
  dogru: E
  aciklama:
    dogru_neden: 'BDS 505 par. 12''ye göre yanıt verilmeyen her durumda kural olarak alternatif prosedür uygulanır; ancak
      par. 13 bunun istisnasıdır: denetçi yeterli ve uygun kanıt için olumlu teyit yanıtının gerekli olduğuna karar vermişse
      alternatif prosedürler ihtiyaç duyulan kanıtı sağlayamaz ve teyit elde edilemezse durumun denetim ve görüş üzerindeki
      etkisine BDS 705 uyarınca karar verilir. A20''de sayılan ''yönetimin kontrolleri ihlal etmesi'' hile riski faktörü tam
      olarak bu durumu oluşturur.'
    celdiriciler:
      A: Par. 12'deki genel kuralı uygular; olumlu yanıtın zorunlu görüldüğü durumda (par. 13) sonraki tahsilat incelemesi
        yeterli değildir. Olumsuz teyit ise par. 15 şartları olmadan tek başına kullanılamaz.
      B: Seçilen kalemin yerine başka kalem alınması BDS 530 par. 10'da prosedürün kaleme uygulanamadığı ve sapma oluşturmadığı
        hâller içindir; hile riski taşıyan bu alacağın kanıt ihtiyacını gidermez.
      C: Yanıt verilmemesi istisna değildir (BDS 505 par. 6'da ayrı tanımlanır); ayrıca alacağın kanıtlanması gerekliliği
        yansıtma yapılarak ortadan kalkmaz.
      D: Kontrollerin ihlali riskinde işletmeden elde edilen kanıta güvenilemediği belirlenmiştir; yönetimin yazılı açıklaması
        dış teyidin yerini tutamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 13
    alinti: Denetçinin yeterli ve uygun denetim kanıtı elde etmek için olumlu bir teyit talebine yanıt verilmesi gerektiğine
      karar vermesi durumunda, alternatif denetim prosedürleri denetçinin ihtiyaç duyduğu denetim kanıtını sağlayamayacaktır.
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. A20
    alinti: Belirli hile riski faktörlerinin (yönetimin kontrolleri ihlâl etmesi veya çalışanların ve/veya yönetimin dâhil
      olduğu muvazaalı işlem riskleri gibi) denetçinin işletmeden elde edilen kanıtlara güvenmesine engel olması.
  gecerlilik:
