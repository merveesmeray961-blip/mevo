  kok: 'Denetçi, aşağıda sırasıyla verilen 6 müşteri bakiyesinden oluşan 500.000 TL''lik alacak anakitlesine parasal birim
    örneklemesini sistematik seçimle uygulamaktadır:


    | Müşteri | K1 | K2 | K3 | K4 | K5 | K6 |

    |---|---|---|---|---|---|---|

    | Bakiye (TL) | 48.000 | 130.000 | 42.000 | 55.000 | 205.000 | 20.000 |


    Örneklem büyüklüğü 5 parasal birim, rastgele belirlenen başlangıç noktası 60.000''inci TL''dir. Seçilen parasal birimleri
    içeren müşteri bakiyelerinin tamamı incelenecektir. İncelenecek müşteri bakiyelerinin toplam defter değeri kaç TL''dir?

    '
  secenekler:
    A: '335.000'
    B: '390.000'
    C: '397.000'
    D: '452.000'
    E: '725.000'
  dogru: B
  aciklama:
    dogru_neden: 'Örnekleme aralığı = 500.000 / 5 = 100.000 TL. Seçilen parasal birimler: 60.000, 160.000, 260.000, 360.000
      ve 460.000. Kümülatif aralıklar: K1 1–48.000; K2 48.001–178.000; K3 178.001–220.000; K4 220.001–275.000; K5 275.001–480.000;
      K6 480.001–500.000. Birimler K2 (60.000 ve 160.000), K4 (260.000) ve K5 (360.000 ve 460.000) içine düşer. Farklı müşteriler
      K2, K4, K5: 130.000 + 55.000 + 205.000 = 390.000 TL. Püf noktaları: Seçim kümülatif toplam üzerinden yapılır; aralıktan
      büyük bakiyeler birden fazla kez isabet alabilir ama bakiye bir kez incelenir. Başlangıç noktası ilk aralık içinde rastgele
      seçilen birimdir; 100.000''den başlamak yöntemi değiştirir.'
    celdiriciler:
      A: Yalnız aralıktan (100.000 TL) büyük bakiyeler (K2 ve K5) alınmış, K4'e düşen 260.000'inci birim gözden kaçırılmıştır.
      C: 'Başlangıç noktası 100.000 alınmış (100.000, 200.000, …, 500.000): K2, K3, K5, K6 = 397.000; rastgele başlangıç yok
        sayılmıştır.'
      D: Mükerrer isabetler yerine sıradaki müşteriler eklenerek 5 farklı müşteri (K2–K6) incelenmiştir; bu, değer ağırlıklı
        seçimi bozar.
      E: K2 ve K5'e düşen ikinci isabetler de ayrı kalem sayılarak bakiyeler iki kez toplanmıştır.
    hesap_adimlari:
    - 'Aralık: 500.000 / 5 = 100.000'
    - 'Birimler: 60.000; 160.000; 260.000; 360.000; 460.000'
    - 'Kümülatif: 48.000; 178.000; 220.000; 275.000; 480.000; 500.000'
    - 'İsabet alan müşteriler: K2, K4, K5 → 130.000 + 55.000 + 205.000 = 390.000'
  kaynaklar:
  - mevzuat: BDS 530 Bağımsız Denetimde Örnekleme
    madde: Ek 4
    alinti: 'Sistematik seçim yöntemi: Bu yöntemde, anakitledeki örnekleme birimi sayısı bir örnekleme aralığı (örneğin 50)
      oluşturmak için örneklem büyüklüğüne bölünür ve ilk 50 birim içinde bir başlangıç noktası belirlendikten sonra, her
      50 nci örnekleme birimi seçilir.'
  - mevzuat: BDS 530 Bağımsız Denetimde Örnekleme
    madde: Ek 1 par. 5
    alinti: Denetçi, anakitle içindeki (örneğin, alacak hesapları bakiyesindeki) belirli parasal birimleri seçtikten sonra,
      bu parasal birimleri içeren belirli kalemleri (örneğin, münferit bakiyeleri) inceleyebilir.
