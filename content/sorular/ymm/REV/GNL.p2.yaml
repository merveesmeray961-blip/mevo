  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: revizyonun amacı
  tip: uygulama
  zorluk: 1
  kok: Bir yeminli mali müşavir tasdik çalışması sırasında, tasdik konusu beyannamenin gerçeği yansıtmasını önemli ölçüde
    etkileyen bir hata tespit etmiş (hileli bir durum söz konusu değildir) ve hatayı düzeltme önerisiyle birlikte işletme
    yönetimine bildirmiştir. Yönetim hatayı düzeltmeyi kabul etmemiştir. YMM Tasdik Yönetmeliği md. 16'ya göre YMM'nin yapması
    gereken hangisidir?
  secenekler:
    A: Durumu bir raporla ilgili mercilere bildirmek
    B: Hatayı tasdik raporunda şerh olarak belirterek belgeleri tasdik etmek
    C: Düzeltme kaydını kendisi yaparak belgeleri tasdik etmek
    D: Bildirim yalnız hile hâlinde gerektiğinden, tasdikten çekilmekle yetinmek
    E: Hatayı izleyen dönemde düzeltilmek üzere çalışma kâğıtlarına not etmek
  dogru: A
  aciklama:
    dogru_neden: Md. 16/2'ye göre YMM, hata ve hileleri düzeltme önerisiyle işletme yönetimine bildirir; yönetim düzeltirse
      belgeler tasdik edilir. Hataların düzeltilmesi istendiği hâlde düzeltilmezse veya hileli bir durum tespit edilirse durum
      bir raporla ilgili mercilere bildirilir. Bildirim yükümlülüğü yalnız hileye özgü değildir; düzeltilmeyen hata da bildirimi
      gerektirir.
    celdiriciler:
      B: Yönetmelik, düzeltilmeyen önemli hatada şerhli tasdik öngörmez; tasdik ancak yönetimin düzeltmesi hâlinde yapılır.
      C: Kayıtları düzeltmek işletme yönetiminin işidir; YMM düzeltme önerir, kaydı kendisi yaparak tasdik edemez.
      D: Md. 16/2 'düzeltilmez ise veya hileli bir durumun tespiti halinde' der; düzeltilmeyen hata da bildirim sebebidir.
      E: Hata cari dönem tasdik konusunu etkilemektedir; sonraki döneme bırakılması md. 16'daki bildirim yükümlülüğünü ortadan
        kaldırmaz.
