  kok: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik'e
    göre tasdik çalışmasında düzenlenen çalışma kâğıtlarıyla ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Her çalışma kâğıdının başlığında denetlenen müşteri, denetim dönemi, kâğıdın konusu, hazırlayan YMM'nin adı ve parafı
      ile hazırlama tarihi yer alır.
    B: Tamamlanmış çalışma kâğıtlarında kullanılan puantaj işaretleri ve sembollerin anlamları açıkça gösterilir.
    C: Çalışma kâğıtları, düzenlendikleri yıldan itibaren 5 yıl süreyle saklanır ve istendiğinde yetkili mercilere ibraz edilir.
    D: Çalışma kâğıtlarının mülkiyeti, tasdik hizmetini veren yeminli mali müşavire aittir.
    E: Saklama süresi içinde hukuki ihtilafa konu olan dosyalar, ihtilaf sonuçlanıncaya kadar saklanır.
  dogru: C
  aciklama:
    dogru_neden: Yönetmelik md. 17'nin son fıkrasına göre çalışma kâğıtları dosya içinde, düzenlenmelerini izleyen yıldan
      itibaren 10 yıl süreyle saklanır; bu süre içinde hukuki ihtilafa konu olan dosyalar ihtilafın sonuçlanmasına kadar saklanır
      ve istendiğinde yetkili mercilere ibraz edilir. C şıkkındaki süre (5 yıl) ve başlangıç (düzenlendikleri yıl) hükme aykırıdır.
    celdiriciler:
      A: 'Doğru ifade: md. 17/a başlıkta müşteri, dönem, konu, hazırlayan YMM''nin ad ve parafı ile hazırlama tarihinin bulunmasını
        öngörür.'
      B: 'Doğru ifade: md. 17/c tamamlanmış kâğıtlarda puantaj işaretleri ve sembollerin anlamlarının açıkça gösterilmesini
        ister.'
      D: 'Doğru ifade: md. 17 son fıkrasına göre çalışma kâğıtlarının mülkiyeti yeminli mali müşavire aittir; tasdik ettiren
        mükellefe ait değildir.'
      E: 'Doğru ifade: Hukuki ihtilafa konu olan dosyalar, 10 yıllık süre dolsa bile ihtilaf sonuçlanıncaya kadar saklanır.'
    hesap_adimlari: []
