  - mevzuat: BDS 530 Bağımsız Denetimde Örnekleme
    madde: Ek 1 par. 4
    alinti: Bir işlem sınıfı veya hesap bakiyesinin gruplandırılması durumunda, her bir grup için yanlışlık öngörüsü ayrı
