- id: YMM-REV-GNL-0027
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: bilgi
  zorluk: 2
  kok: BDS 505 'Dış Teyitler' uyarınca denetçinin, yönetim beyanı düzeyinde değerlendirilmiş önemli yanlışlık risklerini ele
    almak üzere olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanabilmesi için bir arada bulunması
    gereken durumlardan biri aşağıdakilerden hangisi **değildir**?
  secenekler:
    A: Prosedürün, bakiyelerin olduğundan yüksek gösterilmesi riskine yönelik olarak tasarlanmış olması
    B: Önemli yanlışlık riskinin düşük değerlendirilmesi ve ilgili kontrollerin işleyiş etkinliğine ilişkin yeterli ve uygun
      kanıt elde edilmiş olması
    C: Anakitlenin çok sayıda küçük ve aynı türden hesap bakiyesi, işlem veya kalemden oluşması
    D: Beklenen istisna oranının düşük olması
    E: Talepleri alanların bunları göz ardı etmesine yol açacak bir durumdan denetçinin haberdar olmaması
  dogru: A
  aciklama:
    dogru_neden: 'BDS 505 par. 15 dört durumun tümünü arar: risk düşük ve kontrollerin işleyiş etkinliğine ilişkin kanıt elde
      edilmiş olması, anakitlenin çok sayıda küçük ve aynı türden kalemden oluşması, beklenen istisna oranının düşük olması
      ve talepleri alanların bunları göz ardı etmesine yol açacak durumdan haberdar olunmaması. A şıkkı bu durumlar arasında
      değildir; üstelik A23''e göre olumsuz teyit, bakiyelerin olduğundan yüksek gösterildiğine ilişkin kanıt elde etmede
      etkili olma ihtimali düşük bir prosedürdür.'
    celdiriciler:
      B: Par. 15'teki ilk durumdur; yalnız riskin düşük olması yetmez, kontrollerin işleyiş etkinliğine ilişkin kanıt da elde
        edilmiş olmalıdır.
      C: Par. 15'te sayılan ikinci durumdur.
      D: Par. 15'te sayılan üçüncü durumdur.
      E: Par. 15'te sayılan dördüncü durumdur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 15
    alinti: Olumsuz teyitler, olumlu teyitlere göre daha az ikna edici denetim kanıtı sağlar. Dolayısıyla aşağıdaki durumların
      tümü mevcut olmadıkça, denetçi, yönetim beyanı düzeyinde değerlendirilmiş “önemli yanlışlık” risklerini ele almak üzere,
      olumsuz teyit taleplerini tek başına maddi doğrulama prosedürü olarak kullanamaz
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. A23
    alinti: Ancak denetçinin hesapların fazla gösterildiğine ilişkin kanıt elde etmeye çalışması durumunda, bu prosedürün
      etkili olma ihtimâli düşüktür.
