  kazanim: örnekleme
  tip: hesaplama
  zorluk: 3
  kok: 'Denetçi, toplam defter değeri 9.000.000 TL olan ticari alacakların varlığına yönelik detay testinde anakitleyi iki
    gruba ayırmıştır:

    - 1. grup: Bakiyesi 200.000 TL ve üzerindeki 18 müşteri (toplam 3.600.000 TL). Tamamı test edilmiş, 45.000 TL fazla gösterim
    tespit edilmiştir.

    - 2. grup: Kalan bakiyeler (toplam 5.400.000 TL). Defter değeri 900.000 TL olan bir örneklem test edilmiş ve örneklemde
    toplam 25.000 TL fark bulunmuştur. Bu farkın 4.000 TL''si, müşterinin teyit tarihinden önce gönderdiği ancak işletmenin
    bu tarihten kısa süre sonra teslim aldığı ödemeden; 6.000 TL''si ise ilave prosedürlerle anakitleyi temsil etmediği yüksek
    kesinlikle belirlenen ve düzeltilmemiş tek seferlik bir sistem hatasından (anomali) kaynaklanmaktadır. Kalan fark yanlışlıktır.


    Öngörüde oran yöntemi (örneklemdeki yanlışlık / örneklem defter değeri × grubun defter değeri) kullanılacaktır. BDS 530''a
    göre denetçinin ticari alacaklar için en iyi yanlışlık tahmini kaç TL''dir?

    '
  secenekler:
    A: '141.000'
    B: '156.000'
    C: '165.000'
    D: '171.000'
    E: '201.000'
  dogru: A
  aciklama:
    dogru_neden: 'Gruplandırmada her grup için öngörü ayrı yapılır ve sonra birleştirilir (Ek 1 par. 4). 1. grup tamamen test
      edildiğinden 45.000 TL bulunan yanlışlık olarak alınır. 2. grupta teyit tarihinden önce gönderilip sonra teslim alınan
      ödeme yanlışlık sayılmaz (A6); anomali öngörüye katılmaz (A19). Öngörülen yanlışlık = 15.000 / 900.000 × 5.400.000 =
      90.000 TL. Anomali düzeltilmediği için ayrıca eklenir (A19, A22). En iyi tahmin = 45.000 + 90.000 + 6.000 = 141.000
      TL. Püf noktaları: Tamamı incelenen grubun yanlışlığı oranlanmaz, olduğu gibi eklenir; yansıtma yalnız örneklemin seçildiği
      gruba (5.400.000 TL) yapılır. Anomali yansıtmadan çıkarılır ama düzeltilmemişse toplamdan düşülmez.'
    celdiriciler:
      B: 'Oran tüm anakitleye (9.000.000 TL) uygulanmış (150.000) ve 1. grubun bulunan yanlışlığı ayrıca eklenmemiştir: 150.000
        + 6.000.'
      C: 'Zamanlama kaynaklı 4.000 TL de yanlışlık sayılıp yansıtılmıştır: 19.000/900.000 × 5.400.000 = 114.000; 114.000 +
        45.000 + 6.000.'
      D: 'Anomali de yansıtmaya katılmıştır: 21.000/900.000 × 5.400.000 = 126.000; 126.000 + 45.000.'
      E: Oran 1. grubu da kapsayan tüm anakitleye uygulanmış (150.000) ve üstüne 1. grubun yanlışlığı ile anomali eklenmiştir.
    hesap_adimlari:
    - '2. grup örneklem yanlışlığı: 25.000 − 4.000 (zamanlama) − 6.000 (anomali) = 15.000 TL'
    - 'Öngörülen yanlışlık: 15.000 / 900.000 × 5.400.000 = 90.000 TL'
    - 'En iyi tahmin: 45.000 (1. grup) + 90.000 + 6.000 (düzeltilmemiş anomali) = 141.000 TL'
  kaynaklar:
  - mevzuat: BDS 530 Bağımsız Denetimde Örnekleme
    madde: par. A19
    alinti: Bir yanlışlığın anomali oluşturması durumunda, anakitleye ilişkin yanlışlıklar öngörülürken, bu aykırılık dikkate
      alınmayabilir. Ancak, düzeltilmemesi durumunda bu tür bir yanlışlığın etkisinin, anomali olmayan öngörülen yanlışlıklara
