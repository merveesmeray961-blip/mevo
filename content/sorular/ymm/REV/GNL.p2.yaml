- id: YMM-REV-GNL-0026
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: belge ve kayıt incelemesi
  tip: kavrama
  zorluk: 2
  kok: 'YMM Tasdik Yönetmeliği md. 15''te sayılan denetim teknikleri dikkate alındığında, aşağıdaki çalışmalardan hangileri
    "karşılaştırma ve puantaj" tekniği kapsamındadır?


    I. Yevmiye defterinden büyük deftere yapılan toptan aktarmaların kontrol edilmesi

    II. Satış faturalarındaki çarpım ve toplamaların doğruluğunun araştırılması

    III. İşletmeye düzenlenen alış faturalarının satıcının defterlerinde kayıtlı olup olmadığının satıcı nezdinde araştırılması

    IV. Bir kayıtla ilgili muhasebe müdüründen alınan açıklamanın tutanakla tespit edilmesi

    V. Brüt satış kârı oranının önceki yıl ve sektör ortalamasıyla karşılaştırılarak sapmaların belirlenmesi

    '
  secenekler:
    A: Yalnız I
    B: I ve III
    C: II ve V
    D: I ve II
    E: I, II ve V
  dogru: D
  aciklama:
    dogru_neden: Md. 15/e'ye göre karşılaştırma ve puantaj; aralarında uygunluk bulunması gereken tutarların karşılaştırılması,
      toptan aktarmaların kontrolü ve kayıt ve belge üzerindeki her türlü aritmetik işlemin doğruluğunun araştırılmasıdır.
      I (toptan aktarma) ve II (aritmetik doğruluk) bu tekniğe girer. III doğrulama (md. 15/d), IV bilgi toplama (md. 15/c),
      V ise içinde 'karşılaştırma' sözcüğü geçse de oran ve trend analizine dayanan analitik incelemedir (md. 15/f).
    celdiriciler:
      A: II'deki aritmetik işlemlerin doğruluğunun araştırılması da md. 15/e'de açıkça sayılmıştır.
      B: III, işletme kayıtlarının üçüncü şahıslar nezdindeki defter ve belgelerde araştırılmasıdır; bu doğrulama tekniğidir
        (md. 15/d).
      C: V, sapmaları tespit için oran ve trend analiziyle yapılan analitik incelemedir (md. 15/f); ayrıca I dışarıda bırakılmıştır.
      E: V'yi 'karşılaştırma' ifadesi nedeniyle bu tekniğe katmak hatalıdır; brüt kâr oranı karşılaştırması analitik incelemedir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 15/d-e
    alinti: 'Doğrulama: İşletme kayıtlarında yer alan hususların ilgili üçüncü şahıslar nezdindeki defter ve belgeler üzerinde
      araştırılarak tespit yapılmak suretiyle doğrulanmasıdır. e) Karşılaştırma ve puantaj : Aralarında uygunluk bulunması
      gereken tutarların karşılaştırılması; toptan aktarmaların kontrolü, kayıt ve belge üzerindeki her türlü aritmetik işlemlerin
      doğruluğunun araştırılmasıdır.'
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
