      sürecidir. Püf noktaları: olumsuz soruda ''girmez'' seçeneği genellikle konu dışı bir faaliyettir.'
    celdiriciler:
      A: Belge-kayıt karşılaştırması belge incelemesinin özüdür, kapsamına girer.
      B: Yevmiye maddelerinin belgeye dayanması incelemenin temel adımıdır.
      D: Dönemsellik kontrolü belge incelemesinin kritik bir parçasıdır.
      E: İmza-onay zinciri belge güvenilirliğini belirler, kapsamda yer alır.
