  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: kavrama
  zorluk: 3
  kok: 'Aşağıdaki öncülleri değerlendirin:

    I. Banka mutabakat mektupları, hesap bakiyelerini teyit etmek amacıyla doğrudan bankadan temin edilir.

    II. Karşılaştırma tekniğinde önceki dönem verileri ile cari dönem verileri arasındaki farkların açıklanması istenir.

    III. Teyit mektuplarının müşteriden değil, alacaklı işletmeden alınması durumunda teyit geçerliliği kaybolur.

    Bu öncüllerden hangileri karşılaştırma ve teyit tekniği açısından doğrudur?

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'I. doğru: banka bakiyesi teyidi doğrudan bankadan sağlanır. II. doğru: dönemler arası karşılaştırma fark
      analizini gerektirir. III. yanlış: alacak teyidi için mektup alacaklı işletmeden değil, borçlu üçüncü taraftan ya da
      doğrudan karşı taraftan alınabilir; bu teyidin geçerliliğini ortadan kaldırmaz. Püf noktaları: teyit mektubunun kimden
      alınacağı, teyidin yönüne göre değişir; alıcı-satıcı ilişkisini karıştırmamak gerekir.'
    celdiriciler:
      A: II. öncül de doğrudur, yalnız I seçeneği eksik kalır.
      B: I. öncül de doğrudur, yalnız II seçeneği eksik kalır.
      D: III. yanlış olduğundan II ve III birlikte doğru sayılamaz.
      E: III. öncül yanlış olduğundan üçü birlikte doğru değil.
