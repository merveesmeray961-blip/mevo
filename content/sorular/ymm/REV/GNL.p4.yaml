- id: YMM-REV-GNL-0068
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: örnekleme
  tip: kavrama
  zorluk: 3
  kok: 'YMM, satış faturalarının doğruluğuna yönelik detay testinde seçtiği örneklemde bir yanlışlık tespit etmiştir. Yanlışlık,
    yıl içinde bir kez meydana gelen ve tek bir faturayı etkileyen yazılım arızasından kaynaklandığı izlenimini vermektedir.
    BDS 530 hükümleri dikkate alınarak aşağıdaki ifadeler veriliyor:


    I. Yanlışlığın anomali (aykırılık) sayılabilmesi için, anakitleyi temsil etmediğine dair kesinlik derecesi yüksek bir
    kanaate ulaşılması gerekir.

    II. Bu kanaate, yanlışlığın anakitlenin geri kalanını etkilemediğine ilişkin yeterli ve uygun kanıt sağlayan ilave denetim
    prosedürleri uygulanarak ulaşılır.

    III. Anomali sayılan yanlışlık anakitle öngörüsünde dikkate alınmayabilir; ancak düzeltilmemişse etkisi öngörülen diğer
    yanlışlıklara ek olarak dikkate alınır.

    IV. Anomali sayılan yanlışlık, düzeltilip düzeltilmediğine bakılmaksızın değerlendirme dışında tutulur.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: I, II ve III
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'BDS 530 par. 13''e göre denetçinin bir yanlışlığı anomali olarak değerlendirdiği çok ender durumlarda, yanlışlığın
      anakitleyi temsil etmediğine dair kesinlik derecesi yüksek bir kanaate sahip olması gerekir ve bu kanaate ilave denetim
      prosedürleri uygulanarak ulaşılır (I, II). A19''a göre anomali, anakitleye ilişkin yanlışlıklar öngörülürken dikkate
      alınmayabilir; ancak düzeltilmemesi durumunda etkisi, anomali olmayan öngörülen yanlışlıklara ek olarak dikkate alınır
      (III). IV bu nedenle yanlıştır. Püf noktaları: Anomali kabulü öngörüden çıkarmayı sağlar, toplam değerlendirmeden değil;
      düzeltilmemiş anomali yine sonuca eklenir.'
    celdiriciler:
      A: III de doğrudur; düzeltilmemiş anomalinin etkisi ayrıca dikkate alınır.
      B: IV, A19 paragrafıyla çelişir; II ise doğrudur.
      C: I de doğrudur; anomali kabulü yüksek kesinlikte kanaat gerektirir.
      E: IV yanlıştır; düzeltilmemiş anomali değerlendirme dışında bırakılamaz.
  kaynaklar:
  - mevzuat: BDS 530 Denetim Örneklemesi
    madde: par. 13
    alinti: sapma veya yanlışlığın anakitleyi temsil etmediğine dair kesinlik derecesi yüksek bir kanaate sahip olması gerekir
  - mevzuat: BDS 530 Denetim Örneklemesi
    madde: par. A19
    alinti: Ancak, düzeltilmemesi durumunda bu tür bir yanlışlığın etkisinin, anomali olmayan öngörülen yanlışlıklara ek olarak
      dikkate alınması gerekir.
