    dogru_neden: BDS 230 A21'e göre çalışma kâğıtlarının nihai denetim dosyasında birleştirilmesi işleminin tamamlanması için
      uygun süre genellikle denetçi raporu tarihinden itibaren en fazla altmış gündür; doksan gün ifadesi yanlıştır.
    celdiriciler:
      A: BDS 230 A22'ye göre birleştirme yeni prosedür veya yeni sonuç içermeyen idari süreçtir; ifade doğrudur.
      B: BDS 230 par. 15 ile uyumludur; ifade doğrudur.
      D: Yönetmelik md. 17 son fıkrasıyla uyumludur; ifade doğrudur.
      E: Yönetmelik md. 17/a'daki başlık unsurlarıdır; ifade doğrudur.
