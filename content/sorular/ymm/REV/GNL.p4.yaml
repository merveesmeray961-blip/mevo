- id: YMM-REV-GNL-0066
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: revizyonun amacı
  tip: kavrama
  zorluk: 2
  kok: YMM Tasdik Yönetmeliği md. 4 ve 5 dikkate alındığında, YMM tarafından tasdik edilmiş bir kurumlar vergisi beyannamesinin
    hukuki sonucu ve tasdikin amacı hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Tasdik edilen beyanname, kamu idaresinin vergi incelemesine konu edilemez; idare ancak tasdik raporunu esas alarak
      tarhiyat yapabilir.
    B: Tasdike esas alınan denetleme ve muhasebe ilke ve standartları, yeminli mali müşavir odalarınca çıkarılan kararlarla
      belirlenir.
    C: Tasdikin amacı, işletmenin vergi yükünü azaltacak yasal seçenekleri belirleyerek mükellef lehine görüş oluşturmaktır.
    D: Tasdik, işletmenin mali tablolarının denetimi olmayıp yalnız beyannamedeki matematik işlemlerin doğrulanmasıdır.
    E: Tasdik edilen konu ve belgeler tasdikin kapsamı ölçüsünde idarece incelenmiş kabul edilir; idarenin inceleme yetkisi
      saklıdır.
  dogru: E
  aciklama:
    dogru_neden: Yönetmelik md. 4'e göre tasdik edilmiş konu ve belgeler kamu idaresinin yetkililerince tasdikin kapsamı ölçüsünde
      incelenmiş olarak kabul edilir; ancak kanunlarla kamu idaresine tanınan inceleme ve teftiş yetkilerinin kullanılması
      ve gerektiğinde tekrarı saklıdır. md. 5'e göre tasdikin amacı mali tabloların eksiksiz ve gerçeğe uygun düzenlenmesini
      sağlayarak kamunun istifadesine sunmak, talepleri hızlandırmak ve idare ile mükellef ilişkilerinde güveni hakim kılmaktır.
    celdiriciler:
      A: md. 4 son cümle idarenin inceleme ve teftiş yetkilerini saklı tutar.
      B: md. 4'e göre ilke ve standartlar Bakanlıkça hazırlanan tebliğlerle belirlenir.
      C: Tasdikin amacı md. 5'te sayılmıştır; mükellef lehine görüş oluşturmak bunlardan değildir.
      D: md. 4 tasdiki denetleme ilke ve standartlarına göre uygunluk incelemesi olarak tanımlar.
  kaynaklar:
  - mevzuat: YMM Tasdik Yönetmeliği
    madde: md. 4
    alinti: kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan inceleme
  - mevzuat: YMM Tasdik Yönetmeliği
    madde: md. 5
    alinti: c) Vergi idaresi ve mükellef ilişkilerinde güveni hakim kılmaktır.
