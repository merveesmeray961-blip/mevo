- id: YMM-REV-GNL-0067
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: belge ve kayıt incelemesi
  tip: kavrama
  zorluk: 2
  kok: 'Tam tasdik çalışmasında YMM''nin yaptığı aşağıdaki çalışmalar YMM Tasdik Yönetmeliği md. 15''teki denetim teknikleriyle
    eşleştirilmiştir:


    I. Şirketin en büyük tedarikçisinin defter ve belgeleri üzerinde, şirkete kesilen faturaların karşılığının araştırılması
    → Doğrulama

    II. Kayıtlarda açıklığı bulunmayan bir masraf grubu hakkında muhasebe müdüründen açıklama alınıp bunun tutanakla tespit
    edilmesi → Bilgi toplama

    III. Aylık brüt kâr oranlarının önceki yıl ve sektör ortalamasıyla karşılaştırılarak sapmaların araştırılması → Karşılaştırma
    ve puantaj


    Bu eşleştirmelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: md. 15/d'ye göre doğrulama, işletme kayıtlarındaki hususların ilgili üçüncü şahıslar nezdindeki defter ve
      belgeler üzerinde araştırılmasıdır (I doğru). md. 15/c'ye göre bilgi toplama, açıklık olmayan hallerde ilgililerden
      bilgi alınıp tutanakla tespit edilmesidir (II doğru). Oran ve trend analiziyle sonuçların önceki yıl ve sektör ortalamasıyla
      karşılaştırılması md. 15/f'deki analitik incelemedir; karşılaştırma ve puantaj ise uygunluk bulunması gereken tutarların
      karşılaştırılması ve aritmetik kontroldür (III yanlış).
    celdiriciler:
      A: II de doğrudur; tutanakla tespit bilgi toplama tekniğinin unsurudur.
      C: III'teki çalışma analitik incelemedir.
      D: III yanlış eşleştirilmiştir; I ise doğrudur.
      E: III'teki oran ve trend analizi karşılaştırma ve puantaj değil analitik incelemedir.
  kaynaklar:
  - mevzuat: YMM Tasdik Yönetmeliği
    madde: md. 15/d
    alinti: 'd) Doğrulama: İşletme kayıtlarında yer alan hususların ilgili üçüncü'
  - mevzuat: YMM Tasdik Yönetmeliği
    madde: md. 15/f
    alinti: 'f) Analitik inceleme: İşletme hesap ve işlemlerinde ortaya çıkması'
