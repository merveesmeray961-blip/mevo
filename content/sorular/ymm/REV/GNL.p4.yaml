- id: YMM-REV-GNL-0070
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: uygulama
  zorluk: 3
  kok: YMM, (H) A.Ş.'nin alacak bakiyesi en yüksek müşterisine olumlu teyit mektubu göndermek istemiş; şirket yönetimi müşteriyle
    ticari ilişkinin bozulacağı gerekçesiyle buna izin vermemiştir. YMM, sorgulama sonucunda bu gerekçeyi makul bulmamış ve
    alternatif prosedürlerle de ihtiyaca uygun ve güvenilir kanıt elde edilemeyeceği sonucuna varmıştır. BDS 505'e göre YMM'nin
    bu aşamada yapması gereken aşağıdakilerden hangisidir?
  secenekler:
    A: Yönetimin kararına saygı göstererek ilgili alacak için olumsuz teyit gönderir ve yanıt gelmemesini yeterli kanıt sayar.
    B: Yönetimden alacağın varlığına ilişkin yazılı beyan alır; bu beyanı teyidin yerine geçen yeterli denetim kanıtı olarak
      kabul eder.
    C: Yönetimin iznine bakmaksızın teyit mektubunu doğrudan gönderir ve yanıtı yönetimle paylaşmadan sonuca bağlar.
    D: Alacağı örneklemden çıkarır ve yerine bakiyesi düşük başka bir müşteri seçerek teyit prosedürünü tamamlar.
    E: Üst yönetimden sorumlu olanlarla iletişim kurar ve durumun denetim ile görüş üzerindeki etkilerine BDS 705'e göre karar
      verir.
  dogru: E
  aciklama:
    dogru_neden: 'BDS 505 par. 8''e göre yönetim teyit talebine izin vermezse denetçi gerekçeyi sorgular, risk değerlendirmesine
      etkisini değerlendirir ve alternatif prosedür uygular. Par. 9''a göre izin vermeme kararı makul bulunmazsa veya alternatif
      prosedürlerle ihtiyaca uygun ve güvenilir kanıt elde edilemezse denetçi BDS 260 uyarınca üst yönetimden sorumlu olanlarla
      iletişim kurar ve BDS 705 uyarınca bu durumun denetim ve görüş üzerindeki etkilerine karar verir. Püf noktaları: İki
      koşuldan biri yeter (gerekçe makul değil veya alternatif kanıt yok); bu soruda ikisi birlikte gerçekleşmiştir, çözüm
      üst yönetimle iletişim ve görüşe etkidir.'
    celdiriciler:
      A: Olumsuz teyit yanıtsız kalması kanıt değeri sınırlı bir prosedürdür; yönetimin engellemesini aşmanın yolu değildir.
      B: Yönetim beyanı, teyit yerine geçecek dış kaynaklı kanıt sağlamaz.
      C: Standart, yönetimin izin vermemesi hâlinde izlenecek yolu par. 8 ve 9'da düzenler; izinsiz gönderim öngörülmez.
      D: Riskli kalemin örneklemden çıkarılması sorunu gizler; standardın öngördüğü yanıt değildir.
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 8
    alinti: İzin vermeme kararıyla ilgili olarak yönetimin gerekçelerine ilişkin sorgulama yapar
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 9
    alinti: uyarınca üst yönetimden sorumlu olanlarla iletişim kurar
