  kok: Çalışma kâğıtlarının düzenlenmesi ve saklanmasına ilişkin olarak BDS 230 ve YMM Tasdik Yönetmeliği md. 17 dikkate alındığında
    aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Rapor tarihinden sonra çalışma kâğıtlarının nihai dosyada birleştirilmesi, yeni denetim prosedürü uygulanmasını içermeyen
      idari bir süreçtir.
    B: Nihai dosyada birleştirme tamamlandıktan sonra çalışma kâğıtları saklama süresi sona ermeden silinemez, atılamaz veya
      yok edilemez.
    C: Çalışma kâğıtlarının nihai dosyada birleştirilmesi için uygun süre genellikle rapor tarihinden itibaren en fazla doksan
      gündür.
    D: YMM çalışma kâğıtlarını, düzenlenmelerini izleyen yıldan itibaren 10 yıl süreyle saklamak ve istendiğinde ibraz etmek
      zorundadır.
    E: Her çalışma kâğıdında müşteriyi, dönemi, konuyu, hazırlayanın ad ve parafını ve hazırlama tarihini içeren bir başlık
      bulunur.
  dogru: C
