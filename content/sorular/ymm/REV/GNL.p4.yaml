- id: YMM-REV-GNL-0071
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Revizyonun kapsamı ve teknikleri
  konu: GNL
  kazanim: karşılaştırma ve teyit
  tip: kavrama
  zorluk: 2
  kok: 'Sürekli denetlemeyi kapsayan tam tasdik sözleşmesi bulunan bir YMM''nin yetkileriyle ilgili olarak YMM Tasdik Yönetmeliği
    md. 8''e göre aşağıdaki ifadeler veriliyor:


    I. Belirli aralıklarla haber vermeksizin kasa sayımı ve stok tespiti yapabilir, yıl sonu envanter çalışmalarını denetleyebilir.

    II. Tasdik konularıyla ilgili olarak karşıt incelemeler yapabilir.

    III. Başka oda çevresindeki karşıt incelemeyi, ücreti Ücret Yönetmeliğine göre ödenmek kaydıyla o odaya mensup bir YMM''ye
    yaptırabilir.

    IV. Tasdik raporunda denetimin dönem başından itibaren sürekli denetleme sonucunda mı, dönem kapandıktan sonra mı yapıldığını
    belirtmek zorunda değildir.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, II ve III
    B: I ve II
    C: II ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: md. 8'e göre sürekli denetlemeyi kapsayan tasdik hizmetini veren YMM belirli aralıklarla haber vermeksizin
      kasa sayımı ve stok tespiti yapabilir, yıl sonu envanter çalışmalarını denetleyebilir (I); tasdik konularıyla ilgili
      karşıt incelemeler yapabilir (II); başka oda çevrelerindeki karşıt incelemeler ücreti ödenmek kaydıyla o odaya mensup
      YMM'lere yaptırılabilir (III). Aynı maddeye göre denetimin hangi duruma göre yapıldığı tasdik raporunda açıkça belirtilir;
      IV yanlıştır.
    celdiriciler:
      B: III de doğrudur; başka oda çevresindeki karşıt inceleme o odanın üyesine yaptırılabilir.
