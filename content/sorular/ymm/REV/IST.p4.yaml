  kok: (V) A.Ş., üç yıldır aktifinde bulunan iştirak hisselerini 2026 yılında 5.000.000 TL bedelle satmış, 2.000.000 TL satış
    kazancının %50'sini (1.000.000 TL) istisna ederek özel fona almıştır. Bedelin 3.000.000 TL'si 2027'de tahsil edilmiş;
    alıcının iflası nedeniyle kalan 2.000.000 TL 31/12/2028 tarihine kadar tahsil edilememiştir. Kurumlar vergisi oranı %25'tir.
