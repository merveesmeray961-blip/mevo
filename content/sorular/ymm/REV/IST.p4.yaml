- id: YMM-REV-IST-0003
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: emisyon primi ve diğer KVK md.5 istisnaları
  tip: uygulama
  zorluk: 1
  kok: '2026 yılında nakdi sermaye artırımı yapan iki şirketin kayıtları şöyledir: (D) A.Ş. itibari değeri 1 TL olan payları
    1,60 TL''den ihraç etmiş ve 600.000 TL fazlayı 649 Diğer Olağan Gelir ve Kârlar hesabına kaydetmiştir. (E) Ltd. Şti. ise
    yeni ortağın esas sermaye payının itibari değerini aşan 600.000 TL ödemesini aynı hesaba kaydetmiştir. Revizyonda bu tutarlar
    için yapılması gereken tespit aşağıdakilerden hangisidir?'
  secenekler:
    A: (D) A.Ş.'nin tutarı beyannamede istisna olarak indirilir; (E) Ltd. Şti.'nin tutarı istisna kapsamı dışındadır.
    B: Her iki tutar da emisyon primi istisnası kapsamındadır; her iki şirket de 600.000 TL'yi beyannamede istisna olarak
      indirir.
    C: Her iki tutar da kurum kazancına dahildir; emisyon primi istisnası halka açık anonim şirketlere tanınmıştır.
    D: (D) A.Ş.'nin tutarının %50'si, (E) Ltd. Şti.'nin tutarının ise tamamı istisna olarak beyannamede indirilir.
    E: (E) Ltd. Şti.'nin tutarı istisna kapsamındadır; (D) A.Ş. ise tutarı gelire kaydettiği için istisnayı kaybeder.
  dogru: A
  aciklama:
    dogru_neden: KVK md. 5/1-ç, anonim şirketlerin kuruluşta veya sermaye artırımında çıkardıkları payların bedelinin itibari
      değeri aşan kısmını istisna eder. İstisna anonim şirketlerle sınırlıdır; limited şirket bu bentten yararlanamaz. (D)
      A.Ş. tutarı gelir hesabına almış olsa da tutar istisna kazançtır ve beyannamede düşülür (doğru kayıt 520 Hisse Senedi
      İhraç Primleri hesabıdır).
    celdiriciler:
      B: Bent açıkça 'Anonim şirketlerin' ibaresini kullanır; limited şirkete genişletilemez.
      C: İstisna halka açıklık şartına bağlı değildir; her anonim şirket yararlanır.
      D: Emisyon priminde kısmi oran yoktur; %50 oran md. 5/1-e'ye aittir.
      E: Hatalı gelir kaydı istisnayı ortadan kaldırmaz; limited şirket ise kapsam dışıdır.
  kaynaklar:
