- id: YMM-REV-IST-0001
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: iştirak kazançları istisnası
  tip: uygulama
  zorluk: 1
  kok: Hesap dönemi takvim yılı olan (A) A.Ş., tam mükellef (B) A.Ş.'nin sermayesinin %0,5'ine karşılık gelen payları Şubat
    2026'da satın almış; Nisan 2026'da bu paylar için 200.000 TL nakdi kâr payı tahsil ederek 642 Faiz Gelirleri hesabına
    kaydetmiştir. Bu kâr payının 2026 yılı kurumlar vergisi beyannamesindeki durumu hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Pay oranı %10'un altında kaldığından kâr payının tamamı kurum kazancına dahil edilerek vergilendirilir.
    B: Paylar bir yıl elde tutulmadığından istisna uygulanmaz; kâr payı ancak 2027 beyannamesinde indirilebilir.
    C: Kâr payının %50'si istisna edilir, kalan kısım kurumlar vergisi matrahına dahil edilir.
    D: Kâr payı istisna edilir; ancak yurt içi asgari kurumlar vergisi hesabında kurum kazancından düşülmez.
    E: Kâr payının tamamı istisnadır; istisna için asgari pay oranı ve elde tutma süresi şartı aranmaz.
  dogru: E
  aciklama:
    dogru_neden: KVK md. 5/1-a-1'e göre tam mükellef başka bir kurumun sermayesine katılımdan elde edilen kazançlar istisnadır.
      Bentte pay oranı veya elde tutma süresi şartı yoktur; %0,5 pay ve iki aylık elde tutma istisnaya engel değildir. Kâr
      payı ticari kâra dahil olduğundan beyannamede istisna olarak düşülür.
    celdiriciler:
      A: '%10 pay şartı yurt dışı iştirak kazançlarına (md. 5/1-b-1) aittir; yurt içi iştirak kazancında böyle bir şart yoktur.'
      B: Bir yıllık elde tutma şartı da md. 5/1-b'de aranır; md. 5/1-a'da süre şartı bulunmaz.
      C: '%50 oran iştirak hissesi satış kazancına (md. 5/1-e, 9160 sayılı CBK) ilişkindir; iştirak kazancı tamamen istisnadır.'
      D: md. 32/C-2-a, md. 5/1-a kapsamındaki kazançların asgari kurumlar vergisi hesabında da düşüleceğini öngörür.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a-1
    alinti: Tam mükellefiyete tabi başka bir kurumun sermayesine katılımlarından elde ettikleri kazançlar
  gecerlilik:
