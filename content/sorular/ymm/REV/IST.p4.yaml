    satmış ve 3.000.000 TL satış kazancı elde etmiştir. Satış bedelinin üçte biri 2026'da tahsil edilmiş, kalanı için alıcıyla
    Haziran 2027 vadeli senet düzenlenmiştir. İstisna tutarı 2026'da pasifte özel fon hesabına alınacaktır. Şirketin 2026
