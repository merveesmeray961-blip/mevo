- id: YMM-REV-IST-0002
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: taşınmaz ve iştirak hissesi satış istisnası
  tip: hesaplama
  zorluk: 1
  kok: Gayrimenkul ticareti ve kiralamasıyla uğraşmayan (C) A.Ş., 2018 yılından beri aktifinde bulunan bir arsayı Mart 2026'da
    satmış ve 800.000 TL satış kazancı elde etmiştir. Satış bedeli satış günü peşin tahsil edilmiş, istisna tutarı aynı yıl
    pasifte özel fon hesabına alınmıştır. Şirketin 2026 yılında bu satış kazancı için uygulayabileceği istisna tutarı kaç
    TL'dir?
  secenekler:
    A: 0 TL
    B: 200.000 TL
    C: 400.000 TL
    D: 600.000 TL
    E: 800.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Taşınmaz satış istisnası 7456 sayılı Kanunla md. 5/1-e''den çıkarılmıştır; ancak KVK geçici md. 16''ya göre
      15/7/2023''ten önce aktifte bulunan taşınmazlara eski hüküm uygulanır ve eski %50 oranı bu tarihten sonraki satışlarda
      %25 olarak uygulanır. İki tam yıl şartı (2018''den beri aktifte) ve peşin tahsil sağlanmıştır: 800.000 × %25 = 200.000
      TL.'
    celdiriciler:
      A: Taşınmaz 15/7/2023'ten önce aktifte olduğundan geçici md. 16 kapsamında istisna sürmektedir; istisnanın tamamen kalktığını
        düşünmek hatalıdır.
      C: '%50, değişiklikten önceki taşınmaz oranıdır; geçici md. 16 bu oranı sonraki satışlarda %25''e indirmiştir.'
      D: '%75 oranı iştirak hisselerine ilişkin kanuni orandır ve taşınmazlara uygulanmaz.'
      E: Taşınmaz satış kazancının tamamını istisna saymanın kanuni dayanağı yoktur.
    hesap_adimlari:
    - Taşınmaz 15/7/2023 öncesinden aktifte → geçici md. 16
    - İstisna oranı %25
    - 800.000 × 0,25 = 200.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: geçici md. 16
    alinti: bu maddenin yürürlüğe girdiği tarihten sonra yapılacak taşınmaz satış kazançları için %25 olarak uygulanır
  gecerlilik:
    baslangic: '2023-07-15'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kazanc = 800000

      sonuc = kazanc * 25 / 100'
