  kok: Esas faaliyeti tekstil üretimi olan (G) A.Ş., Mayıs 2026'da Almanya'da bir şube açmıştır. Şubenin 2026 yılı kazancı
    Almanya vergi kanunlarına göre %28 oranında gelir ve kurumlar vergisi benzeri toplam vergi yükü taşımış, vergi sonrası
    kazancın tamamı Mart 2027'de Türkiye'ye transfer edilmiştir. Şirket 2026 yılı kurumlar vergisi beyannamesini Nisan 2027'de
    kanuni süresinde verecektir. Şube kazancı hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Şube bir yıldan az süredir faaliyette olduğundan kazanç istisna edilemez; Almanya'da ödenen vergi mahsup edilir.
    B: Şubede sermaye payı bulunmadığından %10 pay şartı sağlanamaz; kazanç genel hükümlere göre vergilendirilir.
    C: Kazanç istisnadır; ancak istisna tutarı Almanya'da ödenen verginin Türkiye kurumlar vergisi oranını aşan kısmıyla sınırlıdır.
    D: Kazanç istisnadır; şube kazancında bir yıllık süre ve asgari pay şartı aranmadığından iki şartın sağlanması yeterlidir.
    E: Kazancın %80'i istisnadır; tam istisna için kazancın elde edildiği yıl içinde Türkiye'ye getirilmesi gerekir.
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 5/1-g, yurt dışındaki iş yeri veya daimi temsilci aracılığıyla elde edilen kazancı iki şartla istisna
      eder: en az %15 vergi yükü (esas faaliyet finansman, sigorta veya menkul kıymet yatırımı değilse) ve kazancın beyannamenin
      verilmesi gereken tarihe kadar Türkiye''ye transferi. %28 vergi yükü ve Mart 2027 transferi bu şartları karşılar. Şubede
      (b) bendindeki %10 pay ve bir yıl şartları yoktur.'
    celdiriciler:
      A: Bir yıllık elde tutma şartı yurt dışı iştirak kazancına (md. 5/1-b-2) aittir; şube kazancında aranmaz.
