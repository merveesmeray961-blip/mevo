  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: taşınmaz ve iştirak hissesi satış istisnası
  tip: hesaplama
  zorluk: 3
  kok: '2010''dan beri faaliyette olan, finans sektöründe bulunmayan ve menkul kıymet veya taşınmaz ticaretiyle uğraşmayan
    (T) A.Ş.''nin 2026 yılı verileri şöyledir: ticari bilanço kârı 8.000.000 TL; kanunen kabul edilmeyen giderler 400.000
    TL. Ticari kâra dahil kalemler: tam mükellef bir A.Ş.''den kâr payı 600.000 TL; 2019''da alınan arsanın satış kazancı
    1.600.000 TL; 1/9/2024''te alınıp 15/3/2026''da satılan iştirak hisselerinin satış kazancı 1.000.000 TL. Satış bedelleri
    peşin tahsil edilmiş, istisnaya konu tutarlar özel fona alınmıştır. Geçmiş yıl zararı ve KVK md. 10 indirimi yoktur. Şirketin
    2026 yılı için ödeyeceği kurumlar vergisi (asgari kurumlar vergisi kontrolü dahil) kaç TL''dir?'
  secenekler:
    A: 1.625.000 TL
    B: 1.725.000 TL
    C: 1.750.000 TL
    D: 1.850.000 TL
    E: 2.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'İstisnalar: kâr payı 600.000 TL (md. 5/1-a); arsa 15/7/2023 öncesinden aktifte olduğundan geçici md. 16
      ile %25 → 400.000 TL; hisseler 1/9/2024–15/3/2026 arasında iki tam yıl aktifte kalmadığından md. 5/1-e istisnası yoktur.
      Matrah = 8.000.000 + 400.000 − 600.000 − 400.000 = 7.400.000 TL; KV = 7.400.000 × %25 = 1.850.000 TL. Asgari KV = (8.000.000
      + 400.000 − 600.000) × %10 = 780.000 TL; hesaplanan vergi daha yüksek olduğundan ödenecek vergi 1.850.000 TL''dir. Püf
      noktaları: Hisse satışında önce iki tam yıl şartını, arsada önce edinim tarihini kontrol edin; asgari vergi tabanında
      yalnız md. 5/1-a kazancı düşülür.'
    celdiriciler:
      A: 'Hem arsaya %50 hem de süre şartı sağlanmayan hisseye %50 istisna uygulanmış: (8.400.000 − 600.000 − 800.000 − 500.000)
        × %25.'
      B: Süre şartını sağlamayan hisse satışına %50 istisna (500.000 TL) uygulanmıştır.
      C: Arsa kazancına geçici md. 16 yerine eski %50 oranı uygulanmıştır.
      E: Kâr payı istisnası ve arsa istisnası düşülmeden ticari kâr üzerinden hesaplanmıştır.
    hesap_adimlari:
    - 'İstisnalar: 600.000 + 1.600.000 × 0,25 = 1.000.000 TL; hisse satışı istisna dışı'
    - 'Matrah: 8.400.000 − 1.000.000 = 7.400.000 TL'
    - 'KV: 7.400.000 × 0,25 = 1.850.000 TL'
    - 'Asgari KV: (8.400.000 − 600.000) × 0,10 = 780.000 TL < 1.850.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-e
    alinti: Kurumların, en az iki tam yıl süreyle aktiflerinde yer alan iştirak hisseleri
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
