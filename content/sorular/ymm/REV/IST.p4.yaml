  dogrulama:
    python: 'ticari = 8000000

      kkeg = 400000

      kar_payi = 600000

      arsa = 1600000 * 25 / 100

      matrah = ticari + kkeg - kar_payi - arsa

      kv = matrah * 25 / 100

      asgari = (ticari + kkeg - kar_payi) * 10 / 100

      sonuc = max(kv, asgari)'
