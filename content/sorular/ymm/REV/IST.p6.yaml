  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: tam mükellef kurumlardan elde edilen iştirak kazançları (KVK md. 5/1-a)
  tip: bilgi
  zorluk: 1
  kok: Aşağıdaki kazançlardan hangisi, KVK md. 5/1-(a) bendi kapsamında kurumlar vergisinden istisnadır?
  secenekler:
    A: Bir A.Ş.'nin, kanunî ve iş merkezi Türkiye'de bulunan başka bir anonim şirketin tahvilinden elde ettiği faiz geliri
    B: Bir A.Ş.'nin, tam mükellef başka bir şirketin kârına katılma imkânı veren intifa senetlerinden elde ettiği kâr payı
    C: Bir A.Ş.'nin, Türkiye'de iş yeri veya daimî temsilcisi bulunmayan dar mükellef bir kurumun kurucu senetlerinden elde
      ettiği kâr payı
    D: Bir A.Ş.'nin, tam mükellef bir bankaya yatırdığı vadeli mevduattan elde ettiği faiz geliri
    E: Bir A.Ş.'nin, tam mükellef başka bir şirketin paylarını bir yıl elinde tutup satmasından doğan satış kazancının tamamı
  dogru: B
  aciklama:
    dogru_neden: KVK md. 5/1-(a)-(2) uyarınca kurumların, tam mükellefiyete tabi başka bir kurumun kârına katılma imkânı veren
      kurucu senetleri ile diğer intifa senetlerinden elde ettikleri kâr payları kurumlar vergisinden müstesnadır. B şıkkındaki
      intifa senedi tam mükellef bir şirkete ait olduğundan istisna uygulanır.
    celdiriciler:
      A: Tahvil faizi, sermayeye katılımdan veya kâr payından doğan bir kazanç değildir; (a) bendi kapsamında sayılmamıştır.
      C: (a) bendindeki kurucu ve intifa senetlerine ilişkin istisna, kârına katılınan kurumun tam mükellef olmasına bağlıdır;
        dar mükellef kurumdan elde edilen kâr payı bu bendin kapsamı dışındadır.
      D: Mevduat faizi sermayeye katılım kazancı değildir; kurum kazancına dahil edilerek vergilendirilir.
      E: Payların satışından doğan kazanç (a) bendi kapsamında değil, (e) bendi kapsamında değerlendirilir; (e) bendi en az
