- id: YMM-REV-IST-0017
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: girişim sermayesi yatırım fonu ve ortaklıklarından elde edilen kazançlar (KVK md. 5/1-a-3)
  tip: kavrama
  zorluk: 2
  kok: 'Tam mükellef bir A.Ş.''nin elde ettiği aşağıdaki gelirlerden hangileri KVK md. 5/1-(a)-(3) kapsamında kurumlar vergisinden
    istisnadır?


    I. Tam mükellef girişim sermayesi yatırım fonu katılma paylarının fona iadesinden doğan gelir

    II. Bu fonun katılma paylarının VUK md. 279 kapsamında değerlenmesinden kaynaklanan değer artış kazancı

    III. Tam mükellef girişim sermayesi yatırım ortaklığının hisse senetlerinden elde edilen kâr payı

    IV. Tam mükellef bir bankanın ihraç ettiği bono faizi'
  secenekler:
    A: I ve II
    B: II, III ve IV
    C: I, II, III ve IV
    D: Yalnız III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: KVK md. 5/1-(a)-(3) bendi; tam mükellef girişim sermayesi yatırım fonu katılma paylarını ve girişim sermayesi
      yatırım ortaklıklarının hisse senetlerinden elde edilen kâr payları ile katılma paylarının fona iadesinden doğan gelirleri
      ve bu katılma paylarının VUK md. 279 kapsamında değerlenmesinden doğan değer artış kazançlarını istisna kapsamına almıştır.
      I, II ve III bu bendin içindedir; IV numaralı bono faizi sayılan gelirler arasında yer almaz.
    celdiriciler:
      A: II numaralı değer artış kazancı yanında III numaralı kâr payı da aynı bent kapsamındadır; bu nedenle yalnız I ve
        II demek eksik bir sonuçtur.
      B: I numaralı gelir de istisna kapsamındadır; ayrıca IV numaralı bono faizi sayılan istisna kalemleri arasında yer almadığından
        bu seçenek hatalıdır.
      C: IV numaralı bono faizi sermaye katılımından veya fon payından doğan bir gelir değildir; seçenekteki IV yanlıştır.
      D: III numaralı kâr payı istisnadır, ancak I ve II numaralı gelirler de aynı bendin açık hükmü kapsamındadır; yalnız
        III demek eksiktir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-a-3
    alinti: Tam mükellefiyete tabi girişim sermayesi yatırım fonu katılma payları ile girişim sermayesi yatırım ortaklıklarının
      hisse senetlerinden elde ettikleri kâr payları ve katılma paylarının fona iadesinden doğan gelirler ile bu fonların
      katılma paylarının 213 sayılı Vergi Usul Kanununun 279 uncu maddesi kapsamında değerlenmesinden kaynaklanan değer artış
      kazançları,
