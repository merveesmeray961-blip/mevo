    satışından 2.000.000 TL; ayrıca bölgeye dışarıdan satın alıp yurt dışına sattığı ticari mallardan 800.000 TL kazanç. Mevzuattaki
    diğer şartların sağlandığı ve Avrupa Birliğine tam üyeliğin gerçekleşmediği varsayımıyla, 3218 sayılı Kanunun geçici 3.
    maddesinin ikinci fıkrası kapsamında gelir veya kurumlar vergisinden müstesna kazanç kaç TL''dir?'
  secenekler:
