- id: YMM-REV-IST-0018
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: fon ve ortaklık kazançlarında kâr dağıtım şartı (KVK md. 5/1-d)
  tip: uygulama
  zorluk: 3
  kok: Hesap dönemi takvim yılı olan ve esas faaliyet konusu itibarıyla Türkiye'deki gayrimenkullerden oluşan portföyü işletmek
    amacıyla kurulan (K) Gayrimenkul Yatırım Ortaklığı A.Ş., KVK md. 5/1-(d)-(4) bendindeki istisnadan 2026 hesap dönemi kazançları
    için yararlanmak istemektedir. Ortaklığın sahip olduğu taşınmazlardan 2026 yılında elde ettiği kazançların istisna şartı
    olan asgari oranının kâr payı olarak dağıtılması gereken son tarih aşağıdakilerden hangisidir?
  secenekler:
    A: 25 Nisan 2027
    B: 31 Mayıs 2027
    C: 30 Haziran 2027
    D: 31 Temmuz 2027
    E: 31 Aralık 2027 (hesap dönemini izleyen yılın sonu)
  dogru: C
  aciklama:
    dogru_neden: 'Fon ve ortaklıkların (emeklilik yatırım fonları hariç) taşınmazlardan elde ettikleri kazançların en az %50''sinin
      kâr payı olarak dağıtılması, kazancın elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi
      gereken ayı izleyen ikinci ayın sonuna kadar yapılmalıdır. 2026 hesap dönemi beyannamesi, dönemin kapandığı ayı (Aralık)
      izleyen dördüncü ay olan Nisan 2027''de verilir. Nisan ayını izleyen ikinci ay Haziran olduğundan son gün 30 Haziran
      2027''dir. Püf noktaları: (1) "Beyannamenin verildiği gün" değil, "verilmesi gereken ay" esas alınır. (2) Ayı izleyen
      ikinci ayın sonu hesaplanırken Mayıs birinci, Haziran ikinci aydır. (3) Süre sonunda belirtilen oranda dağıtım yapılmazsa
      istisna nedeniyle zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır.'
    celdiriciler:
      A: 25 Nisan 2027, kurumlar vergisi beyannamesinin verilme süresinin son günüdür; dağıtım için tanınan süre bu tarihte
        bitmez.
      B: 31 Mayıs 2027, beyanname ayını izleyen birinci ayın sonudur; hüküm "ikinci ayın sonunu" aramaktadır.
      D: 31 Temmuz 2027, beyanname ayını izleyen üçüncü ayın sonudur ve süreyi bir ay fazla hesaplamaktadır.
      E: 31 Aralık 2027 tarihi kanunda öngörülen sürenin çok ötesindedir; hesap dönemini izleyen yıl sonu, hükümde yer almaz.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-d
    alinti: Bu istisnadan faydalanılabilmesi için fon ve ortaklıkların (emeklilik yatırım fonları hariç) sahip oldukları taşınmazlardan
      elde ettikleri kazançların en az %50’sinin, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi
      gereken ayı izleyen ikinci ayın sonuna kadar kâr payı olarak dağıtılması şarttır. Bu süre içerisinde belirtilen orana
      kadar kârın ortaklara dağıtılmaması durumunda, istisnadan faydalanılması nedeniyle zamanında tahakkuk ettirilmeyen vergiler
      ziyaa uğramış sayılır.
