- id: YMM-REV-IST-0019
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: fon ve ortaklık kazançlarında asgari kâr dağıtım tutarı (KVK md. 5/1-d)
  tip: hesaplama
  zorluk: 2
  kok: 'Esas faaliyet konusu itibarıyla gayrimenkul portföyünü işletmek amacıyla kurulan ve KVK md. 5/1-(d)-(4) istisnasından
    yararlanmak isteyen (L) Gayrimenkul Yatırım Ortaklığı A.Ş.''nin 2026 hesap dönemi gelirleri şöyledir: portföydeki taşınmazlardan
    elde edilen kira kazancı 6.000.000 TL, bir taşınmazın satışından doğan kazanç 2.000.000 TL, banka mevduatından elde edilen
    faiz geliri 1.000.000 TL. İstisnadan yararlanabilmek için kâr payı olarak dağıtılması gereken asgari tutar kaç TL''dir?'
  secenekler:
    A: 1.000.000
    B: 3.000.000
    C: 4.000.000
    D: 4.500.000
    E: 8.000.000
  dogru: C
  aciklama:
    dogru_neden: İstisna için ortaklığın sahip olduğu taşınmazlardan elde ettiği kazançların en az %50'sinin kâr payı olarak
      dağıtılması şarttır. Taşınmazlardan elde edilen kazanç = 6.000.000 (kira) + 2.000.000 (satış) = 8.000.000 TL; mevduat
      faizi taşınmaz kazancı değildir. Dağıtılması gereken asgari tutar = 8.000.000 × %50 = 4.000.000 TL.
    celdiriciler:
      A: 1.000.000 TL, yalnızca satış kazancının %50'sidir; kira kazancı da taşınmazdan elde edilen kazançtır ve hesaba dahil
        edilmelidir.
      B: 3.000.000 TL, yalnızca kira kazancının %50'sidir; taşınmaz satış kazancı da taşınmazlardan elde edilen kazanç kapsamındadır.
      D: 4.500.000 TL, taşınmaz kazancına mevduat faizini de ekleyerek (9.000.000 × %50) bulunmuştur; faiz geliri taşınmazdan
        elde edilmediğinden hesaba girmez.
      E: 8.000.000 TL, kazancın tamamıdır; hüküm tamamının değil en az %50'sinin dağıtılmasını arar.
    hesap_adimlari:
    - Taşınmaz kazançları = 6.000.000 + 2.000.000 = 8.000.000 TL
    - Faiz geliri hesaba katılmaz
    - 8.000.000 × %50 = 4.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-d
    alinti: Bu istisnadan faydalanılabilmesi için fon ve ortaklıkların (emeklilik yatırım fonları hariç) sahip oldukları taşınmazlardan
      elde ettikleri kazançların en az %50’sinin, elde edildiği hesap dönemine ilişkin kurumlar vergisi beyannamesinin verilmesi
      gereken ayı izleyen ikinci ayın sonuna kadar kâr payı olarak dağıtılması şarttır. Bu süre içerisinde belirtilen orana
      kadar kârın ortaklara dağıtılmaması durumunda, istisnadan faydalanılması nedeniyle zamanında tahakkuk ettirilmeyen vergiler
      ziyaa uğramış sayılır.
