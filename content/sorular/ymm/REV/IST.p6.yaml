    madde: md. 5/3
    alinti: Kurumların kurumlar vergisinden istisna edilen kazançlarına ilişkin giderlerinin veya istisna kapsamındaki faaliyetlerinden
      doğan zararlarının, istisna dışı kurum kazancından indirilmesi kabul edilmez. Şu kadar ki iştirak hisseleri alımıyla
