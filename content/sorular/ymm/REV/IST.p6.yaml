- id: YMM-REV-IST-0020
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: sat-kirala-geri al işlemlerinde istisna şartları (KVK md. 5/1-j)
  tip: kavrama
  zorluk: 2
  kok: Tam mükellef (M) A.Ş., KVK md. 5/1-(j) kapsamındaki istisnadan yararlanabilmek amacıyla 2026 yılında üretim tesisindeki
    bir makineyi, 6361 sayılı Kanun kapsamında geri kiralama amacıyla satmayı planlamaktadır. Aşağıdaki işlemlerden hangisinde
    satış kazancı bu bent kapsamında istisnadan yararlanabilir?
  secenekler:
    A: Makine, bir mevduat bankasına satılmış; geri kiralama ve sözleşme sonunda geri alma hükümleri sözleşmede yer almış
      ve fiilen uygulanmıştır
    B: Makine, bir sigorta şirketine satılmış; geri kiralama ve sözleşme sonunda geri alma hükümleri sözleşmede yer almış
      ve fiilen uygulanmıştır
    C: Makine, bir finansal kiralama şirketine satılmış; geri kiralama kararlaştırılmış ancak sözleşme sonunda geri alma şartı
      sözleşmede yoktur
    D: Makine, bir katılım bankasına satılmış; geri kiralama ve sözleşme sonunda geri alma hükümleri sözleşmede yer almış
      ve bu hükümler fiilen uygulanmıştır
    E: Makine, ortağı olan tam mükellef bir ticaret şirketine satılmış; geri kiralama ve sözleşme sonunda geri alma sözleşmede
      kararlaştırılmış ve uygulanmıştır
  dogru: D
  aciklama:
    dogru_neden: KVK md. 5/1-(j), taşınır ve taşınmazların 6361 sayılı Kanun kapsamında geri kiralama amacıyla ve sözleşme
      sonunda geri alınması şartıyla, finansal kiralama şirketleri, katılım bankaları ile kalkınma ve yatırım bankalarına
      satışından doğan kazançları istisna eder. Katılım bankasına yapılan, geri kiralama ve geri alma hükümleri sözleşmede
      yer alan ve fiilen uygulanan satışta şartlar tamamdır.
    celdiriciler:
      A: Mevduat bankası bentte sayılan kiralayan kurumlar arasında değildir; yalnızca finansal kiralama şirketleri, katılım
        bankaları ile kalkınma ve yatırım bankaları sayılmıştır.
      B: Sigorta şirketi bentte sayılan kiralayan kurumlar arasında yer almaz.
