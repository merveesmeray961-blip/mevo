- id: YMM-REV-IST-0021
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: sat-kirala-geri al işleminde amortismanın özel fon hesabı ile ilişkisi
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (N) A.Ş., aktifinde maliyet bedeli 8.000.000 TL, birikmiş amortismanı 2.000.000 TL olan bir taşınırı,
    KVK md. 5/1-(j) şartlarına uygun olarak 10.000.000 TL bedelle bir finansal kiralama şirketine satmış ve geri kiralamıştır.
    Kullanım hakkı satış bedeli olan 10.000.000 TL üzerinden aktifleştirilmiş ve kiracı kurum için yıllık amortisman 1.000.000
    TL hesaplanmıştır. İstisna şartları sağlanmış olup kazanç özel fon hesabına alınmıştır. Bu amortismanın kurum kazancının
    tespitinde dikkate alınabilecek kısmı kaç TL'dir?
  secenekler:
    A: '400.000'
    B: '600.000'
    C: '800.000'
    D: 1.000.000
    E: 2.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Net bilanço aktif değeri 8.000.000 − 2.000.000 = 6.000.000 TL, istisna kazanç 10.000.000 − 6.000.000 = 4.000.000
      TL''dir. Kazanç özel fon hesabında tutulur ve yalnızca bu varlıklar için ayrılacak amortismanın devir öncesi net bilanço
      aktif değerine isabet etmeyen kısmının itfasında kullanılır. Fondan karşılanacak oran 4.000.000 / 10.000.000 = %40,
      kurum kazancında dikkate alınacak oran %60''tır. 1.000.000 × %60 = 600.000 TL. Püf noktaları: (1) Oran, istisna kazancın
      satış bedeline bölünmesiyle bulunur; maliyet bedeli kullanılmaz. (2) Soruda istenen kurum kazancında dikkate alınacak
      kısımdır; fondan karşılanan %40 (400.000 TL) bunun tamamlayıcısıdır. (3) Birikmiş amortisman hem net değeri hem de oranı
      etkiler.'
    celdiriciler:
      A: 400.000 TL, amortismanın özel fon hesabından karşılanacak kısmıdır; kurum kazancında dikkate alınacak kısım değildir.
      C: 800.000 TL, oranın maliyet bedeli olan 8.000.000 TL esas alınarak bulunmasından kaynaklanır; oran istisna kazancın
        satış bedeline bölünmesiyle hesaplanır.
      D: 1.000.000 TL, amortismanın tamamıdır; fon hesabından karşılanan kısım kurum kazancında dikkate alınmaz.
      E: 2.000.000 TL, birikmiş amortisman tutarıdır ve soruyla ilgisizdir; yıllık amortisman 1.000.000 TL'yi aşamaz.
    hesap_adimlari:
    - Net değer = 8.000.000 − 2.000.000 = 6.000.000 TL
    - İstisna kazanç = 10.000.000 − 6.000.000 = 4.000.000 TL
    - Fon payı = 4.000.000 / 10.000.000 = %40; kurum kazancı payı %60
    - 1.000.000 × %60 = 600.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-j
    alinti: İstisnadan yararlanan satış kazancı, kiracı tarafından pasifte özel bir fon hesabında tutulur ve özel fon hesabında
      tutulan bu tutar sadece kiracı tarafından bu varlıklar için ayrılacak amortismanların (bu varlıkların kiralayan kurumlara
      devrinden önce kiracıdaki net bilanço aktif değerine isabet eden amortismanlar hariç) itfasında kullanılır.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 5.15.4
    alinti: (E) A.Ş.’nin bu taşınır için yıllık olarak hesaplayacağı amortismanın (480.000.- TL / 800.000.- TL=) %60’lık kısmı
      özel fon hesabından karşılanacak; sadece (320.000.- TL / 800.000.- TL=) %40’lık kısmı ise kurum kazancının tespitinde
      dikkate alınabilecektir.
