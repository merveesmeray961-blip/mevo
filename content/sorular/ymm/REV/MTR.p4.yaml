- id: YMM-REV-MTR-0059
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: ticari bilanço kârından mali kâra geçiş
  tip: hesaplama
  zorluk: 2
  kok: 2010'dan beri faaliyette olan ve finans sektöründe bulunmayan (D) A.Ş.'nin 2026 yılı gelir tablosunda dönem net kârı
    1.800.000 TL'dir. Bu tutar, 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları hesabına alınan 600.000 TL tahmini
    kurumlar vergisi düşüldükten sonra bulunmuştur. Giderler içinde 80.000 TL vergi ziyaı cezası ve VUK'a göre ödenen 20.000
    TL gecikme faizi; gelirler içinde tam mükellef bir A.Ş.'den alınan 300.000 TL kâr payı vardır. Başka düzeltme gerektiren
    kalem, geçmiş yıl zararı ve indirim yoktur. Şirketin 2026 yılı için hesaplanacak kurumlar vergisi (asgari kurumlar vergisi
    kontrolü dahil) kaç TL'dir?
  secenekler:
    A: 400.000 TL
    B: 525.000 TL
    C: 545.000 TL
    D: 550.000 TL
    E: 625.000 TL
  dogru: D
  aciklama:
    dogru_neden: KVK md. 11/1-d'ye göre bu Kanuna göre hesaplanan kurumlar vergisi, vergi cezaları ve VUK'a göre ödenen gecikme
      faizleri indirilemez. Matrah = 1.800.000 + 600.000 + 80.000 + 20.000 − 300.000 (md. 5/1-a) = 2.200.000 TL; KV = 2.200.000
      × %25 = 550.000 TL. Asgari KV = (2.400.000 + 100.000 − 300.000) × %10 = 220.000 TL olduğundan hesaplanan vergi geçerlidir.
    celdiriciler:
      A: Gider yazılan kurumlar vergisi karşılığı kâra eklenmemiştir (1.600.000 × %25).
      B: Vergi ziyaı cezası ve gecikme faizi KKEG olarak eklenmemiştir (2.100.000 × %25).
      C: VUK'a göre ödenen gecikme faizi KKEG sayılmamıştır (2.180.000 × %25).
      E: İştirak kazancı istisnası düşülmemiştir (2.500.000 × %25).
    hesap_adimlari:
    - 'Ticari bilanço kârı (vergi öncesi): 1.800.000 + 600.000 = 2.400.000 TL'
    - 'KKEG: 80.000 + 20.000 = 100.000 TL'
    - 'Matrah: 2.400.000 + 100.000 − 300.000 = 2.200.000 TL'
    - 'KV: 550.000 TL; asgari KV 220.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-d
    alinti: Bu Kanuna göre hesaplanan kurumlar vergisi ile her türlü para cezaları, vergi cezaları
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'net = 1800000

      kv_karsilik = 600000

      kkeg = 80000 + 20000

      istirak = 300000

      matrah = net + kv_karsilik + kkeg - istirak

      kv = matrah * 25 / 100

      asgari = (net + kv_karsilik + kkeg - istirak) * 10 / 100

      sonuc = max(kv, asgari)'
  durum: kontrolde
