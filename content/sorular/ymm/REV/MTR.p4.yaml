- id: YMM-REV-MTR-0060
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: geçici vergi
  tip: uygulama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan (E) A.Ş. nezdinde Ekim 2026''da yapılan incelemede, 2026 yılının ilk iki geçici vergi
    dönemine ilişkin şu tespitler yapılmıştır:


    | Dönem | Beyan edilen geçici vergi | Olması gereken geçici vergi |

    |---|---|---|

    | Ocak–Mart | 170.000 TL | 200.000 TL |

    | Nisan–Haziran | 140.000 TL | 150.000 TL |


    Bu tespitlerle ilgili olarak aşağıdaki ifadeler veriliyor:


    I. Ocak–Mart dönemi için eksik beyan edilen 30.000 TL üzerinden ikmalen geçici vergi tarh edilir.

    II. Nisan–Haziran dönemi için eksik beyan edilen 10.000 TL üzerinden ikmalen geçici vergi tarh edilir.

    III. Mahsup süresi geçtikten sonra kesinleşen geçici vergiler terkin edilir; ancak gecikme faizi ve ceza tahsil edilir.

    IV. Geçici vergi matrahının hesabında Kanunda düzenlenen indirim ve istisnalar dikkate alınmaz.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve IV
    E: I, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'GVK mük. md. 120''ye göre (KVK md. 32/2 ile kurumlara uygulanır) geçmiş dönemlere ait geçici verginin %10''u
      aşan tutarda eksik beyan edildiği tespit edilirse eksik beyan edilen kısım için re''sen veya ikmalen tarhiyat yapılır.
      Ocak–Mart''ta eksiklik 30.000 TL, olması gereken verginin %15''idir; %10''u aştığından eksik kısmın tamamı tarh edilir
      (I doğru). Nisan–Haziran''da eksiklik 10.000 TL (%6,7) sınırı aşmaz (II yanlış). III madde metniyle aynıdır. IV yanlıştır;
      matrahın hesabında VUK değerleme hükümleri ile indirim ve istisnalar dikkate alınır. Püf noktaları: %10 sınırı her geçici
      vergi dönemi için ayrı karşılaştırılır; sınır aşılınca yalnız aşan kısım değil eksik beyan edilen tutarın tamamı tarh
      edilir.'
    celdiriciler:
      A: III de doğrudur; madde mahsup süresinden sonra terkin ile gecikme faizi ve cezanın tahsilini öngörür.
      B: Nisan–Haziran dönemindeki eksiklik %10 sınırını aşmadığından II yanlıştır.
      D: II'deki eksiklik sınırın altındadır; IV ise maddeye aykırıdır.
      E: IV yanlıştır; geçici vergi matrahında indirim ve istisnalar dikkate alınır.
  kaynaklar:
