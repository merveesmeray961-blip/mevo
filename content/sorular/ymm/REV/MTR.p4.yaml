- id: YMM-REV-MTR-0057
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: istisnalar ve indirimlerin sırası
  tip: hesaplama
  zorluk: 3
  kok: '2012''den beri faaliyette olan, finans sektöründe bulunmayan (A) A.Ş.''nin 2026 yılı verileri şöyledir: ticari bilanço
    kârı 4.000.000 TL; bu kârın içinde tam mükellef bir A.Ş.''den alınan 600.000 TL kâr payı vardır. Kamu yararına çalışan
    bir derneğe makbuz karşılığı yapılan 150.000 TL nakdi bağış gider yazılmıştır; başka kanunen kabul edilmeyen gider yoktur.
    2023 yılından devreden ve beyannamede gösterilmiş 1.400.000 TL geçmiş yıl zararı bulunmaktadır. Bağış sınırı 1 Seri No.lu
    Kurumlar Vergisi Genel Tebliği''ndeki esasa göre hesaplanacaktır. Şirketin 2026 yılı kurumlar vergisi matrahı kaç TL''dir?'
  secenekler:
    A: 1.900.000 TL
    B: 2.000.000 TL
    C: 2.042.500 TL
    D: 2.050.000 TL
    E: 2.150.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Gider yazılan bağış önce KKEG olarak eklenir: mali kâr 4.150.000 TL. İştirak kazancı (600.000 TL) ve geçmiş
      yıl zararı (1.400.000 TL) düşülür. Tebliğ bölüm 10.3.2.1''e göre bağış sınırının esası ticari bilanço kârı − (iştirak
      kazançları istisnası + geçmiş yıl zararları) = 4.000.000 − 2.000.000 = 2.000.000 TL; sınır %5 → 100.000 TL. Matrah =
      4.150.000 − 600.000 − 1.400.000 − 100.000 = 2.050.000 TL. Püf noktaları: Sınırın esası mali kâr değil, iştirak istisnası
      ve zarar düşülmüş ticari bilanço kârıdır; sınırı aşan 50.000 TL sonraki yıla devretmez.'
    celdiriciler:
      A: Gider yazılan bağış KKEG olarak eklenmemiştir (4.000.000 − 2.000.000 − 100.000).
      B: Bağışın tamamı indirilmiş; %5 sınırı uygulanmamıştır.
      C: Sınır KKEG eklenmiş mali kâr üzerinden hesaplanmıştır ((4.150.000 − 2.000.000) × %5 = 107.500 TL).
      E: Bağış KKEG olarak eklenmiş ama beyannamede hiç indirilmemiştir.
    hesap_adimlari:
    - 'Mali kâr: 4.000.000 + 150.000 = 4.150.000 TL'
    - 'Bağış sınırı: (4.000.000 − 600.000 − 1.400.000) × 0,05 = 100.000 TL'
    - 'Matrah: 4.150.000 − 600.000 − 1.400.000 − 100.000 = 2.050.000 TL'
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.3.2.1
    alinti: '[Ticari bilanço kârı – (iştirak kazançları istisnası + geçmiş yıl zararları)] tutardır.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-c
    alinti: makbuz karşılığında yapılan bağış ve yardımların toplamının o yıla ait kurum kazancının % 5’ine kadar olan kısmı
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ticari = 4000000

      istirak = 600000

      zarar = 1400000

      bagis = 150000

      sinir = (ticari - istirak - zarar) * 5 / 100

      indirim = min(bagis, sinir)

      sonuc = ticari + bagis - istirak - zarar - indirim'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi S2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 4, seviye 3)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-18'
    kim: uretici
    ne: harici teslim t_S2.yaml, satır 46
  - tarih: '2026-10-18'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-REV-MTR-0058
  sinav: ymm
