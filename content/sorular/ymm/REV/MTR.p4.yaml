- id: YMM-REV-MTR-0061
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 3
  kok: '2015''ten beri faaliyette olan, finans sektöründe bulunmayan ve indirimli oran veya yatırıma katkı uygulaması olmayan
    (F) A.Ş.''nin 2026 yılı verileri şöyledir: ticari bilanço kârı 6.000.000 TL; kanunen kabul edilmeyen giderler 200.000
    TL (gider yazılan 50.000 TL bağış dahil); 2024 yılından devreden geçmiş yıl zararı 3.000.000 TL; 5746 sayılı Kanun kapsamında
    Ar-Ge indirimi 1.000.000 TL; kamu yararına çalışan derneğe makbuz karşılığı bağış 50.000 TL (bağış sınırı aşılmamaktadır).
    Şirketin 2026 yılı için hesaplanacak kurumlar vergisi (yurt içi asgari kurumlar vergisi kontrolü dahil, geçici vergi mahsubu
    öncesi) kaç TL''dir?'
  secenekler:
    A: 520.000 TL
    B: 537.500 TL
    C: 550.000 TL
    D: 620.000 TL
    E: 1.287.500 TL
  dogru: B
  aciklama:
    dogru_neden: 'Matrah = 6.000.000 + 200.000 − 3.000.000 − 1.000.000 − 50.000 = 2.150.000 TL; KV = 537.500 TL. Asgari KV
      matrahı = ticari bilanço kârı + KKEG = 6.200.000 TL; md. 32/C-2-ç uyarınca Ar-Ge indirimi düşülür, geçmiş yıl zararı
      (asgari KV Tebliği) ve bağış indirimi düşülmez: (6.200.000 − 1.000.000) × %10 = 520.000 TL. Hesaplanan vergi (537.500
      TL) asgari vergiden yüksek olduğundan 537.500 TL ödenir. Püf noktaları: Ar-Ge indirimini asgari matrahta düşmeyi unutan
      aday 620.000 TL asgari vergiyi esas alır; geçmiş yıl zararı ise asgari matrahta hiç düşülmez.'
    celdiriciler:
      A: 520.000 TL asgari vergidir; hesaplanan vergi bundan yüksek olduğundan esas alınmaz.
      C: Bağış indirimi yapılmadan hesaplanmıştır (2.200.000 × %25).
      D: Ar-Ge indirimi asgari KV matrahından düşülmemiş (6.200.000 × %10) ve asgari vergi esas alınmıştır.
      E: Geçmiş yıl zararı indirilmeden matrah hesaplanmıştır (5.150.000 × %25).
    hesap_adimlari:
    - 'Matrah: 6.200.000 − 3.000.000 − 1.000.000 − 50.000 = 2.150.000 TL'
    - 'KV: 2.150.000 × 0,25 = 537.500 TL'
    - 'Asgari: (6.200.000 − 1.000.000) × 0,10 = 520.000 TL'
    - max(537.500; 520.000) = 537.500 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-2-ç
    alinti: 4691 sayılı Kanun kapsamındaki kazanç istisnası ile kurumlar vergisi matrahından indirim konusu yapılabilen Ar-Ge
      ve tasarım indirimleri
