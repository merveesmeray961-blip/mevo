  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: geçmiş yıl zararları
  tip: kavrama
  zorluk: 2
  kok: '(B) A.Ş., 2026 yılında KVK md. 19 ve 20 kapsamında (C) A.Ş.''yi devralmıştır. Devir tarihinde (C) A.Ş.''nin öz sermayesi
    1.800.000 TL, beyannamelerinde yer alan ve beş yıllık süresi dolmamış zararları toplamı 3.000.000 TL''dir. (B) A.Ş.''nin
    ayrıca Türkiye''de istisnadan yararlanan kazançlar elde ettiği bir ülkedeki şubesinden doğan yurt dışı zararı vardır.
    Bu konuda aşağıdaki ifadeler veriliyor:


    I. Devralınan zararın 1.800.000 TL''yi aşan kısmı (B) A.Ş.''nin kazancından indirilemez.

    II. Devralınan zararın indirilebilmesi için (C) A.Ş.''nin son beş yıla ilişkin kurumlar vergisi beyannamelerinin kanuni
    süresinde verilmiş olması gerekir.

    III. Yurt dışı şube zararı, ilgili ülke mevzuatına göre denetim raporuna bağlanıp aslı ve tercümesi vergi dairesine ibraz
    edilirse Türkiye''deki kazançtan indirilebilir.

    IV. (B) A.Ş., devralınan faaliyete devrin yapıldığı hesap döneminden itibaren üç yıl sonra son verirse, zarar mahsubu
    nedeniyle zamanında tahakkuk ettirilmeyen vergiler için vergi ziyaı doğmuş sayılır.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: I, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 9/1-a: devralınan kurumun devir tarihindeki öz sermayesini geçmeyen zararları indirilebilir (I doğru);
      son beş yılın beyannamelerinin kanuni süresinde verilmiş olması (II doğru) ve devralınan faaliyete en az beş yıl devam
      edilmesi gerekir; şartların ihlalinde vergi ziyaı doğmuş sayılır (IV doğru). md. 9/1-b: Türkiye''de kurumlar vergisinden
      istisna edilen kazançlarla ilgili yurt dışı zararlar indirilemez; denetim raporu bu yasağı kaldırmaz (III yanlış).'
    celdiriciler:
      A: IV de doğrudur; beş yıllık devam şartı ihlal edilmiştir.
      B: II de doğrudur; beyannamelerin kanuni süresinde verilmesi ayrı bir şarttır.
      C: III yanlıştır; istisna kazançlarla ilgili yurt dışı zarar, raporla tevsik edilse de indirilemez.
      D: III yanlış, II ise doğrudur.
