- id: YMM-REV-MTR-0063
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: yurt içi asgari kurumlar vergisi matrahı (KVK md. 32/C)
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan, indirimli oran veya teşvik belgesi uygulaması bulunmayan (B) A.Ş.''nin 2026 yılı ticari
    bilanço kârı 6.000.000 TL, KKEG 1.000.000 TL''dir. Kâr içinde şu kalemler yer almaktadır: tam mükellef kurumdan alınan
    kâr payı 2.000.000 TL (md. 5/1-a), anonim şirketin sermaye artırımında çıkarılan payların itibari değeri aşan bedeli 500.000
    TL (md. 5/1-ç), yurt dışı iştirak kazancı istisnası 1.500.000 TL (md. 5/1-b). Ayrıca 3.000.000 TL geçmiş yıl zararı mahsup
    edilecek ve 400.000 TL korumalı işyeri indirimi (md. 10/1-h) uygulanacaktır. Yurt içi asgari kurumlar vergisi (KVK md.
    32/C/1; indirimli oran mahsubu hariç) kaç TL''dir?'
  secenekler:
    A: '110.000'
    B: '260.000'
    C: '310.000'
    D: '410.000'
    E: '500.000'
  dogru: D
  aciklama:
    dogru_neden: 'Md. 32/C/6''ya göre indirim ve istisnalar düşülmeden önceki kurum kazancı, ticari bilanço kârı + KKEG =
      7.000.000 TL''dir. Md. 32/C/2''ye göre bu tutardan md. 5/1-a (2.000.000), md. 5/1-ç (500.000) istisnaları ve md. 10/1-h
      indirimi (400.000) düşülür: 7.000.000 − 2.900.000 = 4.100.000 TL; %10 ile 410.000 TL bulunur. Md. 5/1-b istisnası sayımda
      yer almadığı için düşülmez; geçmiş yıl zararı da asgari matrahtan düşülmez. Püf noktaları: KKEG''yi eklemeyi unutmayın;
      md. 32/C/2''de yalnız sayılan istisna ve indirimler düşülür; yurt dışı iştirak kazancı istisnası ve geçmiş yıl zararı
      bu listede yoktur.'
    celdiriciler:
      A: Geçmiş yıl zararını (3.000.000 TL) da düşerek 1.100.000 TL matrah bulunmuş olur; zarar asgari matrahtan düşülmez.
      B: Md. 5/1-b istisnasını (1.500.000 TL) da düşerek 2.600.000 TL matrah bulunmuş olur; bu istisna md. 32/C/2 sayımında
        değildir.
      C: KKEG eklenmeden (6.000.000 − 2.900.000 = 3.100.000) hesaplama yapılmış olur; kurum kazancı KKEG eklenerek bulunur.
      E: Yalnız md. 5/1-a istisnası düşülerek (7.000.000 − 2.000.000 = 5.000.000) hesap yapılmış olur; md. 5/1-ç istisnası
        ve md. 10/1-h indirimi de düşülür.
    hesap_adimlari:
    - Kurum kazancı = 6.000.000 + 1.000.000 = 7.000.000
    - 'Düşülecekler: 2.000.000 + 500.000 + 400.000 = 2.900.000'
    - Matrah = 4.100.000; %10 = 410.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2
    alinti: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları taşınmazlardan elde
      edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar, b) 10 uncu maddenin birinci fıkrasının; (g), (h), (i)
      ve (j) bentleri kapsamındaki indirimler,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/6
    alinti: Bu maddede yer alan indirim ve istisnalar düşülmeden önceki kurum kazancı ibaresi, hesap dönemi sonundaki ticari
      bilanço kârına kanunen kabul edilmeyen giderlerin eklenmesiyle bulunan tutarı ifade eder.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = (6000000 + 1000000 - 2000000 - 500000 - 400000) * 0.10
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
