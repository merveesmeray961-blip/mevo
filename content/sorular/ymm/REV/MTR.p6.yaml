- id: YMM-REV-MTR-0065
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: yurt dışı iştirak kâr paylarında vergi mahsubu (KVK md. 33)
  tip: kavrama
  zorluk: 2
  kok: 'Tam mükellef bir kurumun yurt dışı iştirakinden elde ettiği kâr payı üzerinden ödenen yurt dışı vergilerin KVK md.
    33 kapsamında mahsubuna ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Mahsup için kurumun, iştirakin sermayesinin veya oy hakkının doğrudan ya da dolaylı olarak en az %25''ine sahip olması
    gerekir.

    II. Kazanca ilave edilen kâr payı, bu kazançlar üzerinden yurt dışında ödenen gelir ve kurumlar vergisi benzeri vergiler
    dahil edilmek suretiyle dikkate alınır.

    III. Mahsup edilecek tutar, yurt dışında elde edilen kazançlara md. 32''de belirtilen kurumlar vergisi oranının uygulanmasıyla
    bulunacak tutardan fazla olamaz.'
  secenekler:
    A: Yalnız I
    B: Yalnız I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: KVK md. 33/3, %25 ortaklık (sermaye veya oy hakkı, doğrudan ya da dolaylı) şartını ve kâr payının yurt dışında
      ödenen vergiler dahil edilerek (brütleştirilerek) dikkate alınmasını düzenler; md. 33/4 ise mahsup tutarını, yurt dışı
      kazançlara md. 32'deki oranın uygulanmasıyla bulunan tutarla sınırlar. Üç ifade de doğrudur.
    celdiriciler:
      A: II ve III de doğrudur; yalnız I diyen, brüt tutar ve sınır kurallarını gözden kaçırır.
      B: III de doğrudur; md. 33/4 mahsup sınırını açıkça koyar.
      C: II de doğrudur; kâr payı, yurt dışında ödenen vergiler dahil edilerek brüt tutarla dikkate alınır.
      D: I de doğrudur; mahsuptan yararlanmak için %25 oranında doğrudan veya dolaylı iştirak şarttır.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: Tam mükellef kurumların doğrudan veya dolaylı olarak sermayesi veya oy hakkının % 25’ine sahip olduğu yurt dışı
      iştiraklerinden
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/3
    alinti: Kazanca ilave edilen kâr payı, bu kazançlar üzerinden yurt dışında ödenen gelir ve kurumlar vergisi benzeri vergiler
      dahil edilmek suretiyle dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/4
    alinti: Yurt dışı kazançlar üzerinden Türkiye’de tarh olunacak vergilere mahsup edilebilecek tutar, hiç bir surette yurt
      dışında elde edilen kazançlara Kanunun 32 nci maddesinde belirtilen kurumlar vergisi oranının uygulanmasıyla bulunacak
      tutardan fazla olamaz.
