  zorluk: 3
  kok: Holding şirketi olmayan ve özel kanuna tabi bulunmayan X A.Ş.'nin ödenmiş sermayesi 4.000.000 TL, 1.1.2026 itibarıyla
    genel kanuni yedek akçesi 760.000 TL'dir. Şirketin 2026 yıllık kârı 2.000.000 TL'dir (geçmiş yıl zararı yoktur). Genel
    kurul, birinci kâr payı olarak ödenmiş sermayenin %5'inin ödenmesine ve pay sahiplerine dağıtılacak toplam kâr payının
    (birinci kâr payı dâhil) 1.200.000 TL olmasına karar vermiştir; pay sahipleri dışında kârdan pay alacak kişi yoktur. TTK
    md. 519'a göre 2026 kârından genel kanuni yedek akçeye ayrılması gereken toplam tutar kaç TL'dir?
  secenekler:
    A: '100.000'
    B: '140.000'
    C: '160.000'
    D: '200.000'
    E: '220.000'
  dogru: B
  aciklama:
    dogru_neden: 'Birinci tertip: yıllık kârın %5''i (100.000 TL), ödenmiş sermayenin %20''sine (800.000 TL) ulaşıncaya kadar
      ayrılır; mevcut 760.000 TL olduğundan yalnız 40.000 TL ayrılabilir (md. 519/1). İkinci tertip: sınıra ulaşıldıktan sonra
      da pay sahiplerine %5 oranında kâr payı ödendikten sonra kârdan pay alacak kişilere dağıtılacak toplam tutarın %10''u
      eklenir (md. 519/2-c): birinci kâr payı 4.000.000 × %5 = 200.000 TL; (1.200.000 − 200.000) × %10 = 100.000 TL. Toplam:
      40.000 + 100.000 = 140.000 TL. Püf noktaları: Birinci tertipte sınır, kârın %5''inden önce gelir; ikinci tertip birinci
      kâr payı düşüldükten sonraki dağıtım üzerinden hesaplanır. Şirket holding olsaydı md. 519/4 gereği ikinci tertip ayrılmayacaktı.'
    celdiriciler:
      A: 'Yalnız bir tertip dikkate alınmıştır: ya sınırsız birinci tertip (100.000) ya da yalnız ikinci tertip (100.000);
        her ikisi birlikte ve sınırla uygulanmalıdır.'
      C: 'İkinci tertip, birinci kâr payı düşülmeden toplam kâr payı üzerinden hesaplanmıştır: 40.000 + 1.200.000 × %10.'
      D: 'Birinci tertipte %20 sınırı dikkate alınmamıştır: 100.000 + 100.000.'
      E: 'Hem %20 sınırı hem birinci kâr payının düşülmesi atlanmıştır: 100.000 + 120.000.'
    hesap_adimlari:
    - 'Birinci tertip: min(2.000.000 × 0,05; 800.000 − 760.000) = 40.000'
    - 'Birinci kâr payı: 4.000.000 × 0,05 = 200.000'
    - 'İkinci tertip: (1.200.000 − 200.000) × 0,10 = 100.000'
    - 'Toplam: 140.000'
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 519/1-2
    alinti: Yıllık kârın yüzde beşi, ödenmiş sermayenin yüzde yirmisine ulaşıncaya kadar genel kanuni yedek akçeye ayrılır.
      … c) Pay sahiplerine yüzde beş oranında kâr payı ödendikten sonra, kârdan pay alacak kişilere dağıtılacak toplam tutarın
