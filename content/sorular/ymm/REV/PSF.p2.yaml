    uygun olarak faaliyette bulunan Z Bankası A.Ş.''nin %25''ine ortaktır (Z Bankası, yalnız ilişkili şirketlere finansman
    temin eden bir kredi şirketi değildir). X A.Ş.''nin VUK''a göre tespit edilmiş öz sermayesi 1.1.2026''da 1.500.000 TL,
    31.12.2026''da 2.400.000 TL''dir. X A.Ş.''nin 2026''da nakden temin edip işletmede kullandığı aşağıdaki borçların tamamı
    30.6.2026''da en yüksek tutarlarına ulaşmıştır:

    - Y Holding''den doğrudan alınan borç: 3.000.000 TL

    - B Ltd. Şti.''den alınan borç: 1.200.000 TL

    - Z Bankası''ndan kullanılan kredi: 2.000.000 TL

    - Y Holding''in verdiği gayrinakdi teminat karşılığında ilişkisiz W Bankası''ndan kullanılan kredi: 4.000.000 TL


    KVK md. 12''ye göre X A.Ş.''nin 2026 hesap dönemi için örtülü sermaye tutarı kaç TL''dir?

    '
  secenekler:
    A: '0'
    B: '700.000'
    C: 1.700.000
    D: 3.700.000
    E: 4.700.000
  dogru: B
  aciklama:
    dogru_neden: 'Sınır, hesap dönemi başındaki öz sermayenin üç katıdır: 1.500.000 × 3 = 4.500.000 TL (KVK md. 12/1, 12/3-b).
      Ortak Y Holding''in en az %10 ortağı olduğu B Ltd. ve Z Bankası ortakla ilişkili kişidir (md. 12/3-a). Ortakla ilişkili
      ve ana faaliyet konusuna uygun faaliyette bulunan bankadan yapılan borçlanma %50 oranında dikkate alınır (md. 12/2):
      1.000.000 TL. Ortağın gayrinakdi teminatı karşılığında üçüncü kişiden yapılan borçlanma örtülü sermaye sayılmaz (md.
      12/6-a). Dikkate alınan borç: 3.000.000 + 1.200.000 + 1.000.000 = 5.200.000 TL; örtülü sermaye: 5.200.000 − 4.500.000
      = 700.000 TL. Püf noktaları: Dönem sonu öz sermayesi (2.400.000 TL) gereksiz veridir; karşılaştırma dönem başı öz sermayeyle
      ve dönem içindeki en yüksek borç tutarıyla yapılır. Banka kredisinin yarısı, teminatlı kredinin hiçbiri hesaba girer.'
    celdiriciler:
      A: 'Dönem sonu öz sermayesi esas alınmıştır: 2.400.000 × 3 = 7.200.000 TL > 5.200.000 TL; kanun dönem başı öz sermayeyi
        esas alır.'
      C: 'Z Bankası kredisi %100 dikkate alınmıştır: 6.200.000 − 4.500.000; ilişkili bankadan borçlanma %50 oranında hesaba
        girer.'
      D: 'Üç kat sınırı yerine öz sermayenin kendisi düşülmüştür: 5.200.000 − 1.500.000.'
      E: 'Gayrinakdi teminat karşılığı W Bankası kredisi de eklenmiştir: 9.200.000 − 4.500.000; bu borçlanma örtülü sermaye
        sayılmaz.'
    hesap_adimlari:
    - 'Sınır: 1.500.000 × 3 = 4.500.000'
    - 'Dikkate alınan borç: 3.000.000 + 1.200.000 + 2.000.000 × 0,50 = 5.200.000 (W Bankası kredisi hariç)'
    - 'Örtülü sermaye: 5.200.000 − 4.500.000 = 700.000'
  kaynaklar:
