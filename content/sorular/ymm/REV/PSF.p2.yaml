  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: sermaye ve sermaye taahhütleri
  tip: hesaplama
  zorluk: 2
  kok: Kuruluş aşamasındaki X A.Ş.'nin esas sözleşmesine göre her biri 100 TL itibari değerli 20.000 pay, pay başına 120 TL
    bedelle (primli) ve tamamı nakden taahhüt edilmiştir. Sermaye Piyasası Kanunu hükümleri uygulanmamaktadır. TTK'ya göre
    şirketin tescilinden önce ödenmesi gereken asgari tutar kaç TL'dir?
  secenekler:
    A: '400.000'
    B: '500.000'
    C: '600.000'
    D: '900.000'
    E: 2.400.000
  dogru: D
  aciklama:
    dogru_neden: 'TTK md. 344/1''e göre nakden taahhüt edilen payların itibari değerlerinin en az %25''i tescilden önce, kalanı
      tescili izleyen 24 ay içinde ödenir; payların çıkarma primlerinin ise tamamı tescilden önce ödenir. İtibari değer: 20.000
      × 100 = 2.000.000 TL → %25''i 500.000 TL. Çıkarma primi: 20.000 × 20 = 400.000 TL. Asgari ödeme: 900.000 TL. Tescil
      sonrası 501 Ödenmemiş Sermaye hesabında en çok 1.500.000 TL kalabilir ve bu tutar 24 ay içinde ödenmelidir.'
    celdiriciler:
      A: Yalnız çıkarma primi alınmış, itibari değerin %25'i eklenmemiştir.
      B: Yalnız itibari değerin %25'i alınmış; primin tamamının tescilden önce ödenmesi gerektiği atlanmıştır.
      C: '%25 oranı prim dâhil toplam bedele (2.400.000) uygulanmıştır; primin tamamı peşin ödenir.'
      E: Payların bedelinin tamamı istenmiştir; kanun itibari değerin %75'ine 24 aylık süre tanır.
    hesap_adimlari:
    - 'İtibari değer: 20.000 × 100 = 2.000.000 → %25 = 500.000'
    - 'Prim: 20.000 × (120 − 100) = 400.000 (tamamı)'
    - 'Toplam: 900.000'
  kaynaklar:
