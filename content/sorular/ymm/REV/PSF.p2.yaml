  kok: 'X A.Ş.''nin ortakları Bay A (%60) ve Bayan B''dir (%40). Şirketin 2026 yılında aşağıdaki kişilerle yaptığı işlemlerden
    hangileri KVK md. 13 bakımından ilişkili kişilerle yapılmış işlem sayılır? (Öncüllerde belirtilenler dışında taraflar
    arasında idare, denetim veya sermaye bağı yoktur.)


    I. Bay A''nın eşinin kız kardeşinden depo kiralanması

    II. Bay A''nın amcasının oğlunun tek ortağı olduğu şirketten mal alınması

    III. X A.Ş.''nin %6 oranında hissesine sahip olduğu Y A.Ş.''ye mal satılması

    IV. Cumhurbaşkanınca ilan edilen ülkelerden birinde yerleşik ve X A.Ş. ile ortaklık bağı olmayan Z Ltd.''den hizmet alınması

    V. Bayan B''nin erkek kardeşinin oğluna borç para verilmesi

    '
  secenekler:
    A: I, IV ve V
    B: I, II ve V
    C: II, III ve IV
    D: I, III, IV ve V
    E: III, IV ve V
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 13/2''ye göre ortakların eşleri, ortakların veya eşlerinin üstsoy ve altsoyu ile üçüncü derece dâhil
      yansoy hısımları ve kayın hısımları ilişkili kişidir: Bay A''nın eşinin kız kardeşi (I) ve Bayan B''nin yeğeni (V, üçüncü
      derece) bu kapsamdadır. Cumhurbaşkanınca ilan edilen ülkelerdeki kişilerle yapılan tüm işlemler de ilişkili kişilerle
      yapılmış sayılır (IV). Amcanın oğlu dördüncü derece hısımdır (II); ortaklık kanalıyla oluşan ilişkide en az %10 oran
      aranır, %6 yetmez (III).'
    celdiriciler:
      B: II'deki amcanın oğlu dördüncü derece yansoy hısımdır; hüküm üçüncü dereceye kadar olanları kapsar. IV ise ilişkili
        sayılmasına rağmen dışarıda bırakılmıştır.
      C: II (dördüncü derece) ve III (%10'un altında ortaklık) ilişkili değildir; I ve V gözden kaçırılmıştır.
      D: III'teki %6'lık ortaklık, ortaklık kanalıyla ilişki için aranan %10 oranının altındadır.
      E: III ilişkili değildir; ortağın eşinin kardeşi olan I ise kapsamdadır.
    hesap_adimlari: []
  kaynaklar:
