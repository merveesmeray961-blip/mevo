- id: YMM-REV-PSF-0013
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: karşılıklar
  tip: hesaplama
  zorluk: 2
  kok: X A.Ş.'nin 2026 hesap dönemine ilişkin kurum kazancı 2.800.000 TL'dir (kurumlar vergisi oranı %25; asgari kurumlar
    vergisi hükümleri sonucu etkilememektedir). Hesaplanan kurumlar vergisi, dönem kârı hesabının borcu karşılığında 370 hesabına
    alacak kaydedilmiştir. 193 Peşin Ödenen Vergiler ve Fonlar hesabında, yıl içinde ödenen geçici vergiler (720.000 TL) ile
    kurumlar vergisinden mahsup edilebilecek mevduat faizi stopajı (45.000 TL) bulunmaktadır. Tekdüzen Hesap Planı'na göre
    dönem sonu aktarma kaydından sonra 193 hesabında kalacak bakiye kaç TL'dir?
  secenekler:
    A: '0'
    B: '20.000'
    C: '45.000'
    D: '65.000'
    E: '765.000'
  dogru: D
  aciklama:
    dogru_neden: 'Kurumlar vergisi: 2.800.000 × %25 = 700.000 TL (370 hesabı). 193 hesabındaki peşin ödenen vergiler toplamı
      720.000 + 45.000 = 765.000 TL''dir. THP''ye göre 193''teki tutarlar 371 hesabının borcuna aktarılır; ancak aktarılacak
      tutar 370 hesabının tutarından fazla olamaz. Aktarılan 700.000 TL''den sonra 765.000 − 700.000 = 65.000 TL 193 hesabında
      bakiye olarak kalır.'
    celdiriciler:
      A: Peşin ödenen vergilerin tamamı 371'e aktarılmıştır; aktarma 370 hesabındaki tutarla sınırlıdır.
      B: Yalnız geçici vergiler dikkate alınmış (720.000 − 700.000), mahsup edilebilecek stopaj 193 hesabındaki tutara katılmamıştır.
      C: Geçici vergilerin tamamı aktarılıp stopaj ayrı bırakılmıştır; aktarma toplam tutar üzerinden ve 370 ile sınırlı yapılır.
      E: Hiç aktarma yapılmamıştır; 193 hesabındaki tutarlar dönem sonunda 371'e aktarılır.
    hesap_adimlari:
    - 'KV: 2.800.000 × 0,25 = 700.000'
    - '193 toplamı: 720.000 + 45.000 = 765.000'
    - 'Aktarılan: en çok 700.000 → kalan 65.000'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği Sıra No: 1 — Hesap Planı Açıklamaları'
    madde: 193 Peşin Ödenen Vergiler ve Fonlar
    alinti: Ancak aktarılacak tutar "370- DÖNEM KARI VERGİ VE DİĞER YÜKÜMLÜLÜK KARŞILIKLARI" hesabının tutarından fazla olamaz.
      Aktarılamayan tutar, dönem sonunda bu hesabın bakiyesi olarak kalır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/1
    alinti: Kurumlar vergisi, kurum kazancı üzerinden %25 oranında alınır.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kv = 2800000 * 0.25

      pesin = 720000 + 45000

      sonuc = pesin - min(pesin, kv)

      '
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi REV-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_REV-1.yaml, satır 19
  - tarih: '2026-10-11'
