- id: YMM-REV-PSF-0017
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: borçların tamlığı ve teyidi
  tip: hesaplama
  zorluk: 3
  kok: 'X A.Ş.''nin pasif hesaplarının revizyonunda 31.12.2026 itibarıyla aşağıdaki tespitler yapılmıştır (faizler ay esasıyla,
    basit faiz olarak hesaplanacak; KDV ve stopaj dikkate alınmayacaktır):

    1. 1.11.2026''da kullanılan 2.400.000 TL''lik banka kredisinin yıllık faiz oranı %45''tir; anapara ve faiz 30.4.2027''de
    ödenecektir. Faiz tahakkuku yapılmamıştır.

    2. 1.12.2026''da kullanılan 100.000 EUR tutarlı kredi, kullanım günündeki 36,00 TL kurla kayıtlıdır. Yıllık faiz oranı
    %6''dır; faiz vadede ödenecek olup tahakkuk ettirilmemiştir. Değerleme gününde VUK md. 280 uyarınca uygulanacak kur 38,00
    TL''dir.

    3. Satıcıya verilen, vadesi Şubat 2027 olan 500.000 TL''lik borç senedi mukayyet değeriyle kayıtlıdır; şirket alacak senetlerini
    reeskonta tabi tutmamıştır.

    4. Ortak Bay K''ya gönderilen mutabakat mektubuna, kayıtlardaki 300.000 TL''lik borca karşılık 330.000 TL bildiren yanıt
    gelmiştir. Fark, Bay K''nın şirket adına ödediği, belgesi şirkette bulunan ancak kaydedilmemiş 30.000 TL''lik kira bedelinden
    kaynaklanmaktadır.


    VUK''a göre gerekli değerleme ve düzeltmeler yapıldığında şirketin yabancı kaynaklar toplamı kaç TL artar?

    '
  secenekler:
    A: '229.000'
    B: '399.000'
    C: '410.000'
    D: '428.000'
    E: '429.000'
  dogru: E
  aciklama:
    dogru_neden: 'Kredi sözleşmesine dayanan borçlar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır
      (VUK md. 285/1). TL kredi faizi: 2.400.000 × %45 × 2/12 = 180.000 TL. Yabancı para borçlar değerleme günü kuruyla değerlenir
      (VUK md. 280): kur farkı 100.000 × (38 − 36) = 200.000 TL; EUR kredi faizi 100.000 × %6 × 1/12 = 500 EUR × 38 = 19.000
      TL. Borç senedi reeskontu, alacak senetleri reeskont edilmediğinden ihtiyaridir ve yapılmaması hata değildir. Mutabakat
      farkı kayda alınmamış gerçek bir borçtur: 30.000 TL. Toplam artış: 180.000 + 200.000 + 19.000 + 30.000 = 429.000 TL.
      Püf noktaları: Döviz cinsinden tahakkuk eden faiz de değerleme günü kuruyla TL''ye çevrilir. Borç senedi verisi çözüme
      etki etmez; reeskont yapılsaydı yabancı kaynaklar azalırdı.'
    celdiriciler:
      A: 'EUR kredinin değerleme günü kuruyla değerlenmesi unutulmuştur: 180.000 + 19.000 + 30.000.'
      B: Teyit yanıtındaki fark araştırılmadan bırakılmış, kaydedilmemiş 30.000 TL'lik borç eklenmemiştir.
      C: EUR kredinin faizi tahakkuk ettirilmemiştir; kredi sözleşmesine dayanan borçlar faizleriyle dikkate alınır.
      D: 'EUR faiz tahakkuku kullanım günü kuru (36,00) ile çevrilmiştir: 500 × 36 = 18.000; yabancı para borçlar değerleme
        günü kuruyla değerlenir.'
    hesap_adimlari:
    - 'TL kredi faizi: 2.400.000 × 0,45 × 2/12 = 180.000'
    - 'EUR kur farkı: 100.000 × 2 = 200.000'
    - 'EUR faiz: 100.000 × 0,06 × 1/12 = 500 EUR × 38 = 19.000'
    - 'Mutabakat farkı: 30.000; borç senedi: düzeltme yok'
    - 'Toplam: 429.000'
