  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: borçların tamlığı ve teyidi
  tip: kavrama
  zorluk: 1
  kok: X A.Ş., 31.12.2026 değerlemesinde vadesi gelmemiş alacak senetlerini reeskonta tabi tutmuş, vadesi gelmemiş borç senetlerini
    ise mukayyet değeriyle bırakmıştır. VUK'a göre bu uygulamaya ilişkin doğru revizyon tespiti hangisidir?
  secenekler:
    A: Borç senetlerinin reeskontu ihtiyari olduğundan uygulama VUK'a uygundur.
    B: Borç senetleri yalnız senette faiz oranı yazılıysa reeskont edilebileceğinden uygulama uygundur.
    C: Alacak senetlerini reeskont eden mükellef borç senetlerini de reeskont etmek zorundadır; uygulama hatalıdır.
    D: Borç senetlerinin reeskontu yalnız bankalar, bankerler ve sigorta şirketleri için zorunlu olduğundan uygulama uygundur.
    E: Borç senetleri reeskont edilecekse Merkez Bankası iskonto haddi yerine şirketin kredi faiz oranı uygulanmalıdır.
  dogru: C
  aciklama:
    dogru_neden: VUK md. 285/2'ye göre vadesi gelmemiş senede bağlı borçların değerleme günü kıymetine irca edilmesi kural
      olarak ihtiyaridir; ancak md. 285'in son fıkrası, alacak senetlerini değerleme gününün kıymetine irca eden mükellefleri
      borç senetlerini de aynı şekilde işleme tabi tutmaya zorunlu kılar. Alacak senetlerini reeskont edip borç senetlerini
      reeskont etmemek bu hükme aykırıdır.
    celdiriciler:
      A: Genel kuralı söyler; alacak senetleri reeskont edildiğinde borç senetleri için ihtiyarilik ortadan kalkar.
      B: Senette faiz oranı yazılı değilse Merkez Bankası resmî iskonto haddi uygulanır; oranın yazılı olmaması reeskontu
        engellemez.
      D: Banka, banker ve sigorta şirketlerine ilişkin fıkra kullanılacak faiz haddini düzenler; diğer mükellefler için zorunluluğu
        kaldırmaz.
      E: Senette faiz nispeti açıklanmışsa bu nispet, açıklanmamışsa Merkez Bankası resmî iskonto haddi uygulanır; şirketin
        kredi faiz oranı esas alınmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 285/2 ve son fıkra
    alinti: Vadesi gelmemiş olan senede bağlı borçlar değerleme günü kıymetine irca olunabilir. Bu takdirde senette faiz nispeti
      açıklanmışsa bu nispet, açıklanmamışsa Cumhuriyet Merkez Bankasının resmi iskonto haddinde bir faiz uygulanır. … Alacak
      senetlerini değerleme gününün kıymetine irca eden mükellefler, borç senetlerini de aynı şekilde işleme tabi tutmak zorundadırlar.
