    alinti: Öz sermaye, kurumun Vergi Usul Kanunu uyarınca tespit edilmiş hesap dönemi başındaki öz sermayesini, … Kurumların
      ortaklarının veya ortaklarla ilişkili kişilerin sağladığı gayrinakdî teminatlar karşılığında üçüncü kişilerden yapılan
      borçlanmalar.
