    madde: md. 13/1
    alinti: kiralama ve kiraya verme işlemleri, ödünç para alınması ve verilmesi, ikramiye, ücret ve benzeri ödemeleri gerektiren
      işlemler her hal ve şartta mal veya hizmet alım ya da satımı olarak değerlendirilir
  gecerlilik:
    baslangic: '2007-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kira = (50000 - 30000) * 12

      faiz = 4000000 * 30 / 100 * 6 / 12

      sonuc = kira + faiz'
