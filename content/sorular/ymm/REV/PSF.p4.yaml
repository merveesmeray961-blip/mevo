- id: YMM-REV-PSF-0025
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: örtülü kazanç dağıtımı belirtileri
  tip: uygulama
  zorluk: 3
  kok: 'Tam mükellef (G) A.Ş.''nin 2026 yılındaki işlemleri aşağıdadır. Öncüllerde belirtilenler dışında taraflar arasında
    idare, denetim veya sermaye bakımından başka bir ilişki yoktur.


    I. %40 ortağı Bay M''ye ait aracın emsalin üzerinde bir bedelle kiralanması

    II. %5 ortağı Bayan N''ye faizsiz borç verilmesi

    III. %30 ortağı Bay P''nin kardeşine emsalin altında bir bedelle mal satılması

    IV. Tamamına sahip olduğu tam mükellef bağlı ortaklığa emsalin altında mal satılması; her iki kurum aynı oranda kurumlar
    vergisine tabidir, hiçbirinin zararı, indirimi veya istisnası yoktur, mal aynı dönemde bağlı ortaklıkça üçüncü kişiye
    satılmıştır ve işlem nedeniyle iki kurum adına tahakkuk ettirilmesi gereken vergilerde eksiklik veya gecikme oluşmamıştır.


    Bu işlemlerden hangileri KVK md. 13 uyarınca transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı sayılır?'
  secenekler:
    A: I ve III
    B: I ve II
    C: II ve IV
    D: I, III ve IV
    E: I, II ve III
  dogru: A
  aciklama:
    dogru_neden: 'md. 13/2''ye göre ortaklık kanalıyla oluşan ilişkide en az %10 ortaklık, oy veya kâr payı hakkı aranır;
      ortakların üçüncü derece dahil yansoy hısımları da ilişkili kişidir. I: %40 ortakla emsale aykırı kira işlemi örtülü
      kazanç dağıtımıdır. II: %5 ortak, başka ilişki bulunmadığından ilişkili kişi sayılmaz. III: Kardeş ikinci derece yansoy
      hısım olup %30 ortağın ilişkili kişisidir. IV: md. 13/7''ye göre tam mükellef kurumlar arasındaki yurt içi işlemlerde
      örtülü kazanç kabulü Hazine zararının doğmasına bağlıdır; Hazine zararı doğmadığından örtülü kazanç dağıtımı kabul edilmez.
      Püf noktaları: %10 eşiği ortaklık kanalıyla oluşan ilişkide aranır; kurumlar arası yurt içi işlemde ise ilişki ve emsale
      aykırılık tek başına yetmez, Hazine zararı da gerekir.'
    celdiriciler:
      B: '%5 ortak, %10 eşiğinin altında kaldığından ilişkili kişi sayılmaz; III ise kapsamdadır.'
      C: II'de ilişki yoktur, IV'te Hazine zararı şartı gerçekleşmemiştir.
      D: IV'te Hazine zararı doğmadığından örtülü kazanç dağıtımı kabul edilmez.
      E: II'deki %5 ortak ilişkili kişi değildir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/2
    alinti: İlişkinin doğrudan veya dolaylı olarak ortaklık kanalıyla oluştuğu durumların örtülü kazanç dağıtımı kapsamında
      sayılması için en az %10 oranında ortaklık, oy veya kâr payı hakkının olması şartı aranır.
