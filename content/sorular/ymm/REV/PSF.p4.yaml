  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: borçların tamlığı ve teyidi
  tip: kavrama
  zorluk: 2
  kok: Tam tasdik çalışmasında YMM, (A) A.Ş.'nin 31/12/2026 tarihli bilançosunda ticari borçların olması gerekenden az gösterilmiş
    olabileceği riskini değerlendirmektedir. BDS 500'e göre bu riske yönelik olarak aşağıdaki prosedürlerden hangisi ihtiyaca
    en uygun denetim kanıtını sağlar?
  secenekler:
    A: Ödenmemiş faturaların, tedarikçi beyanlarının, eşleşmeyen alındı belgelerinin ve sonraki dönem ödemelerinin incelenmesi
    B: 320 Satıcılar hesabında kayıtlı en yüksek bakiyeli satıcılardan örnek seçilerek kayıtlı tutarların faturalarla karşılaştırılması
    C: Kayıtlı ticari borçların vade yapısının analiz edilerek reeskont hesaplamasının yeniden yapılması
    D: Kayıtlı borç bakiyeleri için yönetimden yazılı açıklama alınması ve açıklamaların tutanakla tespit edilmesi
    E: Kayıtlı ticari borçların toplamının yevmiye ve büyük defter kayıtlarıyla aritmetik olarak karşılaştırılması
  dogru: A
  aciklama:
    dogru_neden: BDS 500 A31'e göre denetim kanıtının ihtiyaca uygunluğu testin yönünden etkilenir. Ticari borçların eksik
      gösterilip gösterilmediği test edilirken kayıtlı borçların test edilmesi ihtiyaca uygun değildir; bunun yerine ödenmemiş
      faturalar, tedarikçi beyanları, eşleşmeyen alındı belgeleri ve sonraki dönemde yapılan ödemeler gibi bilgilerin test
      edilmesi ihtiyaca uygun olabilir.
    celdiriciler:
      B: Kayıtlı bakiyelerden başlayan test fazla gösterimi (varlık) sınar; kayda alınmamış borcu bulamaz.
      C: Reeskont hesabı değerleme yönetim beyanına ilişkindir; kaydedilmemiş borcu ortaya çıkarmaz.
      D: Kayıtlı bakiyelere ilişkin yönetim açıklaması eksik borcu tespit etmeye yönelik değildir.
      E: Aritmetik uygunluk testi yalnız kayıtlı tutarları doğrular; tamlık riskine yanıt vermez.
  kaynaklar:
