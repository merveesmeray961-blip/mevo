  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: örtülü kazanç dağıtımı belirtileri
  tip: kavrama
  zorluk: 3
  kok: 'Tam mükellef (D) A.Ş., 1/7/2026''da %60 ortağı olan tam mükellef gerçek kişi Bay K''ya faizsiz olarak 4.000.000 TL
    borç vermiş, tutar yıl sonuna kadar 131 Ortaklardan Alacaklar hesabında kalmıştır. Şirket transfer fiyatlandırmasına ilişkin
    belgelendirme yükümlülüklerini tam ve zamanında yerine getirmiştir. Bu işlemle ilgili aşağıdaki ifadeler veriliyor:


    I. Emsal faiz tutarı transfer fiyatlandırması yoluyla örtülü olarak dağıtılmış kazançtır ve kurum kazancının tespitinde
    dikkate alınır.

    II. Örtülü dağıtılan kazanç, şartların gerçekleştiği hesap döneminin son günü itibarıyla dağıtılmış kâr payı sayılır.

    III. Örtülü kazanç dağıtımı nedeniyle eksik tahakkuk eden vergiler için vergi ziyaı cezası, VUK md. 359''daki fiillerle
    ziyaa sebebiyet verilmesi hâli hariç, %50 indirimli uygulanır.

    IV. Örtülü kazanç dağıtımı kabul edilebilmesi için Hazine zararının doğmuş olması gerekir.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: I, II ve III
    E: II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 13/1''e göre ödünç para verilmesi her hal ve şartta hizmet alım satımı sayılır; ilişkili kişiye
      emsale aykırı (faizsiz) borç verilmesi örtülü kazanç dağıtımıdır (I). md. 13/6''ya göre örtülü dağıtılan kazanç şartların
      gerçekleştiği hesap döneminin son günü itibarıyla dağıtılmış kâr payı sayılır (II). md. 13/8''e göre belgelendirme yükümlülükleri
      tam ve zamanında yerine getirilmişse vergi ziyaı cezası, md. 359 fiilleri hariç, %50 indirimli uygulanır (III). md.
      13/7''deki Hazine zararı şartı yalnız tam mükellef kurumlar ile yabancı kurumların Türkiye''deki iş yerleri arasındaki
      yurt içi işlemler için aranır; gerçek kişi ortakla yapılan işlemde aranmaz (IV yanlış). Püf noktaları: Hazine zararı
      şartını her yurt içi işleme genellemeyin; taraflardan biri gerçek kişiyse bu şart uygulanmaz.'
    celdiriciler:
      A: III de doğrudur; belgelendirmesi tam olan mükellefte ceza %50 indirimlidir.
      B: IV yanlıştır; Hazine zararı şartı kurumlar arası yurt içi işlemlere özgüdür.
      C: I de doğrudur; faizsiz borç ödünç para işlemi olarak örtülü kazanç dağıtımıdır.
      E: IV yanlış, I ise doğrudur.
  kaynaklar:
