      ilave izin verilen kullanımdır. IV: md. 5/1-e fonunun beş yıl içinde işletmeden çekilmesi istisna nedeniyle tahakkuk
      ettirilmeyen vergilerin ziyaa uğramış sayılmasına yol açar.'
