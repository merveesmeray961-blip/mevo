- id: YMM-REV-PSF-0023
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: örtülü kazanç dağıtımı belirtileri
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (E) A.Ş.''nin %70 ortağı tam mükellef gerçek kişi Bay Y''dir. Revizyonda şu tespitler yapılmıştır: (i)
    Şirket, Bay Y''ye ait binayı 2026 yılının tamamında aylık 50.000 TL kira ödeyerek kullanmıştır; emsal kira aylık 30.000
    TL''dir ve kira gideri tamamen gider yazılmıştır. (ii) Şirket 1/7/2026''da Bay Y''ye 4.000.000 TL faizsiz borç vermiştir;
    borç yıl sonunda ödenmemiştir ve emsal faiz oranı yıllık %30''dur (faiz ay esasıyla, basit faiz olarak hesaplanacaktır).
    Bu tespitler nedeniyle 2026 yılı kurumlar vergisi matrahına eklenmesi gereken toplam örtülü kazanç tutarı kaç TL''dir?'
  secenekler:
    A: 240.000 TL
    B: 600.000 TL
    C: 840.000 TL
    D: 1.200.000 TL
    E: 1.440.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 13/1''e göre kiralama ve ödünç para verme işlemleri mal veya hizmet alım satımı sayılır; ortak ilişkili
      kişidir. Kira: emsali aşan (50.000 − 30.000) × 12 = 240.000 TL örtülü kazançtır (md. 11/1-c gereği indirilemez). Faizsiz
      borç: 4.000.000 × %30 × 6/12 = 600.000 TL emsal faiz kadar kazanç örtülü dağıtılmıştır. Toplam 840.000 TL. Ortak gerçek
      kişi olduğundan md. 13/7''deki Hazine zararı şartı aranmaz. Püf noktaları: Faiz yalnız borcun kullandırıldığı altı ay
      için hesaplanır; kirada emsali aşan kısım, borçta ise alınmayan emsal faiz tutarı örtülü kazançtır.'
    celdiriciler:
      A: Yalnız kira farkı dikkate alınmış; faizsiz borç işlemi atlanmıştır.
      B: Yalnız emsal faiz dikkate alınmış; emsali aşan kira atlanmıştır.
      D: Emsal faiz tam yıl üzerinden hesaplanmış, kira farkı ise atlanmıştır.
      E: Faiz tam yıl üzerinden hesaplanmıştır (240.000 + 1.200.000); borç 1/7/2026'da verilmiştir.
    hesap_adimlari:
    - 'Kira farkı: (50.000 − 30.000) × 12 = 240.000 TL'
    - 'Emsal faiz: 4.000.000 × 0,30 × 6/12 = 600.000 TL'
    - 'Toplam: 840.000 TL'
  kaynaklar:
