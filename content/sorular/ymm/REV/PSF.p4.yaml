    dogru_neden: VUK md. 288'e göre karşılık, hasıl olan veya husulü beklenen fakat miktarı kesin olarak kestirilemeyen zararlar
      için hesaben ayrılan tutardır. Vergi kanunlarında indirimi açıkça düzenlenen karşılıklar dışındaki karşılıklar kazancın
      tespitinde indirilemez. Şüpheli alacak karşılığı VUK md. 323'te düzenlendiğinden indirilebilir (I). Kıdem tazminatı,
      dava ve garanti karşılıkları için vergi kanunlarında indirim hükmü yoktur; bu tutarlar KKEG olarak eklenir ve fiilen
      ödendikleri yıl gider yazılır (II, III, IV).
    celdiriciler:
      A: Şüpheli alacak karşılığı VUK md. 323'e göre indirilebilir; III ve IV ise KKEG'dir.
      B: Garanti gider karşılığı (IV) da vergi kanunlarında indirimi öngörülmeyen bir karşılıktır.
      C: VUK md. 323 şartlarını taşıyan şüpheli alacak karşılığı KKEG değildir.
      D: VUK md. 323 şartlarını taşıyan şüpheli alacak karşılığı (I) indirilebilir; karşılıkların tamamını KKEG saymak hatalıdır.
