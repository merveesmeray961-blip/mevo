- id: YMM-REV-PSF-0020
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: borçların tamlığı ve teyidi
  tip: hesaplama
  zorluk: 2
  kok: '(B) A.Ş.''nin kayıtlarında (S) Ltd.''ye borç bakiyesi 31/12/2026 itibarıyla 750.000 TL''dir. YMM''nin doğrudan aldığı
    olumlu teyit yanıtında (S) Ltd. alacağını 880.000 TL bildirmiştir. Farkın incelenmesinde şunlar tespit edilmiştir: (i)
    Aralık 2026''da alınan bakım hizmetine ait 70.000 TL''lik fatura (B) A.Ş. kayıtlarına alınmamıştır; (ii) (B) A.Ş.''nin
    31/12/2026''da yaptığı 40.000 TL''lik ödeme (S) Ltd.''nin kayıtlarına Ocak 2027''de girmiştir; (iii) (S) Ltd. bir faturayı
    kendi kayıtlarına mükerrer olarak 20.000 TL fazla işlemiştir. KDV dikkate alınmayacaktır. (B) A.Ş.''nin 2026 kayıtlarında
    satıcı borcunu artıracak düzeltme tutarı kaç TL''dir?'
  secenekler:
    A: 20.000 TL
    B: 40.000 TL
    C: 70.000 TL
    D: 110.000 TL
    E: 130.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Teyit farkı 880.000 − 750.000 = 130.000 TL''dir ve istisna olarak araştırılır (BDS 505 par. 14). Kaydedilmemiş
      Aralık faturası (70.000 TL) (B) A.Ş.''nin eksik borcudur ve düzeltilir. 40.000 TL''lik ödeme zamanlama farkıdır; (B)
      A.Ş.''nin kaydı doğrudur. 20.000 TL satıcının kendi hatasıdır; (B) A.Ş.''de düzeltme gerektirmez. Mutabakat: 750.000
      + 70.000 + 40.000 + 20.000 = 880.000 TL.'
    celdiriciler:
      A: Satıcının mükerrer kaydı karşı tarafın hatasıdır; (B) A.Ş.'nin borcunu artırmaz.
      B: Yıl sonu ödemesinin satıcıda geç kaydı zamanlama farkıdır; düzeltme gerektirmez.
      D: Zamanlama farkı da düzeltmeye katılmıştır (70.000 + 40.000).
      E: Teyit farkının tamamı düzeltme sayılmış; farkın nedenleri ayrıştırılmamıştır.
    hesap_adimlari:
    - 'Fark: 880.000 − 750.000 = 130.000 TL'
    - 'Kaydedilmemiş fatura: 70.000 → düzeltme'
    - 'Zamanlama: 40.000 → düzeltme yok'
    - 'Satıcı hatası: 20.000 → düzeltme yok'
  kaynaklar:
  - mevzuat: BDS 505 Dış Teyitler
    madde: par. 14
    alinti: Denetçi, yanlışlık göstergesi olup olmadıklarına karar vermek amacıyla istisnaları araştırır
  gecerlilik:
    baslangic: '2013-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kayitli = 750000

      teyit = 880000

      kaydedilmemis = 70000

      zamanlama = 40000

      satici_hatasi = 20000

      sonuc = kaydedilmemis'
