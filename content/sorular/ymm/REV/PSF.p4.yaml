    madde: par. A31
    alinti: Bunun yerine ödenmemiş faturalar, tedarikçilerin beyanları, eşleşmeyen alındı belgeleri ve sonraki dönemde yapılan
      ödemeler gibi bilgilerin test edilmesi ihtiyaca uygun olabilir.
