- id: YMM-REV-PSF-0026
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: peşin tahsil edilen hasılat ve gider tahakkukları
  tip: hesaplama
  zorluk: 1
  kok: Bilanço esasına göre defter tutan ve hesap dönemi takvim yılı olan (A) A.Ş., 1.9.2026'da 12 aylık bir bakım hizmeti
    sözleşmesinin bedeli olan 480.000 TL'yi peşin tahsil etmiş ve tamamını gelir yazmıştır. Hizmet sözleşme süresince eşit
    olarak verilmektedir. VUK md. 287'ye göre 31.12.2026 tarihli bilançoda pasifleştirilmesi gereken tutar kaç TL'dir?
  secenekler:
    A: '160.000'
    B: '240.000'
    C: '320.000'
    D: '400.000'
    E: '480.000'
  dogru: C
  aciklama:
    dogru_neden: VUK md. 287'ye göre gelecek hesap dönemlerine ait olarak peşin tahsil olunan hasılat mukayyet değeri üzerinden
      pasifleştirilir. Sözleşme 1.9.2026–31.8.2027 arasındadır; 2026'ya 4 ay, 2027'ye 8 ay isabet eder. Aylık hasılat 480.000
      / 12 = 40.000 TL olduğundan 2027'ye ait tutar 8 × 40.000 = 320.000 TL'dir.
    celdiriciler:
      A: 160.000 TL, 2026'da geçen 4 aya isabet eden gelirdir; pasifleştirilecek tutar değil, 2026 gelirinde kalacak tutardır.
      B: 240.000 TL, sözleşmenin 6 aylık kısmıdır; kalan süre 8 aydır.
      D: 400.000 TL, 10 aylık tutardır; 2026'da geçen süre 4 aydır, 2 ay değil.
      E: 480.000 TL, bedelin tamamıdır; 2026'ya ait 4 aylık kısım gelir olarak kalır.
    hesap_adimlari:
    - Sözleşme süresi 1.9.2026–31.8.2027; 2026'da 4 ay geçmiştir.
    - Kalan süre 12 − 4 = 8 aydır.
    - 480.000 × 8/12 = 320.000 TL.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 287
    alinti: Gelecek hesap dönemlerine ait olarak peşin tahsil olunan hasılat ile cari hesap dönemine ait olup henüz ödenmemiş
      olan giderler mukayyet değerleri üzerinden pasifleştirilmek suretiyle değerlenir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 480000 * 8 / 12
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim REV_PSF_20261105_1.yaml, satır None
- id: YMM-REV-PSF-0027
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: finansal kiralamada kiracı borcunun değerlemesi
  tip: hesaplama
  zorluk: 2
  kok: Bilanço esasına göre defter tutan (B) A.Ş. (kiracı), 2026 yılında bir finansal kiralama sözleşmesi yapmıştır. Kiralama
    konusu iktisadî kıymetin rayiç bedeli 2.400.000 TL, sözleşmeye göre ödenecek kira ödemelerinin toplamı 2.800.000 TL, bu
    ödemelerin bugünkü değeri ise 2.150.000 TL'dir. VUK mükerrer md. 290'a göre kiracının kullanma hakkı ve sözleşmeden doğan
    borcu hangi tutarla değerlenir?
  secenekler:
    A: '250.000'
    B: 2.150.000
    C: 2.275.000
    D: 2.400.000
    E: 2.800.000
  dogru: B
  aciklama:
    dogru_neden: VUK mükerrer md. 290/1'e göre kiracı, kullanma hakkını ve sözleşmeden doğan borcu, kiralama konusu iktisadî
      kıymetin rayiç bedeli veya kira ödemelerinin bugünkü değerinden düşük olanı ile değerler. Min(2.400.000; 2.150.000)
      = 2.150.000 TL.
    celdiriciler:
      A: 250.000 TL, rayiç bedel ile bugünkü değer arasındaki farktır; değerleme tutarı değildir.
      C: 2.275.000 TL iki tutarın ortalamasıdır; hüküm ortalama değil, düşük olanı esas alır.
      D: 2.400.000 TL rayiç bedeldir; bugünkü değer bundan düşük olduğu için esas alınmaz.
      E: 2.800.000 TL ödenecek kiraların nominal toplamıdır; bugünkü değere indirilmemiş tutar esas alınmaz.
    hesap_adimlari:
    - 'Rayiç bedel: 2.400.000 TL.'
    - 'Kira ödemelerinin bugünkü değeri: 2.150.000 TL.'
    - 'Düşük olan: 2.150.000 TL.'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mükerrer md. 290/1
    alinti: Kiracı tarafından finansal kiralama işlemine konu iktisadî kıymeti kullanma hakkı ve sözleşmeden doğan borç, kiralama
      konusu iktisadî kıymetin rayiç bedeli veya sözleşmeye göre yapılacak kira ödemelerinin bugünkü değerinden düşük olanı
      ile değerlenir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = min(2400000, 2150000)
