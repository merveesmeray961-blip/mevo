- id: YMM-REV-PSF-0028
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Pasif ve özkaynak hesaplarının revizyonu
  konu: PSF
  kazanim: pasif geçici hesaplar ve dönem kârı karşılıkları
  tip: kavrama
  zorluk: 3
  kok: 'VUK md. 287 ve Tekdüzen Hesap Planı açıklamaları dikkate alındığında aşağıdaki ifadelerden hangileri doğrudur?


    I. Gelecek hesap dönemlerine ait olarak peşin tahsil olunan hasılat mukayyet değeri üzerinden pasifleştirilir.

    II. Cari hesap dönemine ait olup henüz ödenmemiş giderler mukayyet değerleri üzerinden pasifleştirilir.

    III. 380 Gelecek Aylara Ait Gelirler hesabında, peşin tahsil olunan gelirlerin bir yıldan uzun süreye ait kısımları izlenir.

    IV. 371 Dönem Kârının Peşin Ödenen Vergi ve Diğer Yükümlülükleri hesabına, dönem kârı üzerinden yıllık beyanname ile ödenen
    vergiler alacak kaydedilir.'
  secenekler:
    A: Yalnız I ve II
    B: Yalnız I
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'I ve II doğrudur; bunlar VUK md. 287''nin hükmüdür: peşin tahsil olunan hasılat ile cari döneme ait ödenmemiş
      giderler mukayyet değerleriyle pasifleştirilir. III yanlıştır: 380 hesabı bir yıldan KISA süreye ait kısımları izler;
      uzun süreye ait kısımlar 480 hesabındadır. IV yanlıştır: 371 hesabı, dönem kârından mahsup edilmek üzere PEŞİN ödenen
      (geçici vergi gibi) vergileri izler, yıllık beyanname ile ödenen vergiyi değil. Püf noktaları: 380 ile 480''i sürenin
      bir yıldan kısa/uzun olmasıyla ayırın; 371''de ''peşin'' sözcüğünü arayın.'
    celdiriciler:
      B: 'Yalnız I: II de VUK md. 287''de yer alır; ödenmemiş giderler de pasifleştirilir.'
      C: 'I, II ve III: III yanlıştır; 380 hesabı bir yıldan kısa süreye ait gelirleri izler, uzun süreye ait kısım 480 hesabındadır.'
      D: 'II, III ve IV: I de doğrudur ve III ile IV yanlıştır.'
      E: 'I, II, III ve IV: III ve IV yanlıştır; 380 kısa süreye ait gelirleri, 371 ise peşin ödenen vergileri izler.'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 287
    alinti: Gelecek hesap dönemlerine ait olarak peşin tahsil olunan hasılat ile cari hesap dönemine ait olup henüz ödenmemiş
      olan giderler mukayyet değerleri üzerinden pasifleştirilmek suretiyle değerlenir.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği Sıra No: 1 — Hesap Planı Açıklamaları'
    madde: 380 Gelecek Aylara Ait Gelirler
    alinti: Gelecek bilanço dönemlerine ait peşin tahsil olunan gelirlerin bir yıldan kısa süreye ait kısımlarının izlendiği
      hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği Sıra No: 1 — Hesap Planı Açıklamaları'
    madde: 371 Dönem Kârının Peşin Ödenen Vergi ve Diğer Yükümlülükleri
    alinti: Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıklarından indirilmek üzere, "193. Peşin Ödenen Vergiler ve Fonlar
