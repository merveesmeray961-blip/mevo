- id: YMM-REV-TAS-0011
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: KDV iade incelemesi
  tip: uygulama
  zorluk: 1
  kok: Aylık KDV mükellefi (T) A.Ş., Ekim 2025, Kasım 2025, Aralık 2025 ve Ocak 2026 dönemlerinde gerçekleştirdiği ihracattan
    doğan KDV iade taleplerini YMM KDV İadesi Tasdik Raporuyla sonuçlandırmak istemektedir. KDV Genel Uygulama Tebliği'ne
    göre bu taleplerin raporlanması hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Dört dönem tek raporda yer alabilir; çünkü raporun kapsadığı süre on iki ayı aşmamaktadır.
    B: Her vergilendirme dönemi için ayrı rapor düzenlenmesi zorunludur.
    C: 2025 dönemleri tek raporda birleştirilebilir; Ocak 2026 dönemi bu rapora dâhil edilemez.
    D: Dönemler tek raporda birleştirilebilir; dönemler itibarıyla ayrı bilgi ve hesaplama gösterilmesi gerekmez.
    E: Tek raporda en fazla üç dönem yer alabilir; dönemlerin seçimi mükellefin tercihine bırakılmıştır.
  dogru: C
  aciklama:
    dogru_neden: Tebliğe göre bir takvim yılını aşmamak ve her bir döneme ilişkin bilgi ve hesaplamaların ayrı ayrı yer alması
      kaydıyla birden fazla dönemi kapsayan tek YMM raporu verilebilir. Ekim–Aralık 2025 dönemleri aynı takvim yılında olduğundan
      tek raporda birleştirilebilir. Ocak 2026 başka bir takvim yılına ait olduğundan 2025 dönemleriyle aynı rapora alınamaz.
    celdiriciler:
      A: Ölçüt on iki aylık süre değil, takvim yılıdır; dönemler iki ayrı takvim yılına yayılmaktadır.
      B: Takvim yılını aşmamak kaydıyla birden fazla dönem tek raporla bağlanabilir; ayrı rapor zorunlu değildir.
      D: Tek raporda her bir döneme ilişkin bilgi ve hesaplamaların ayrı ayrı yer alması şarttır.
      E: Tebliğde 'üç dönem' sınırı yoktur; sınır takvim yılıdır. Mükellefin tercihi bu sınırı aşamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-4.1
    alinti: Aynı döneme ilişkin farklı işlemlerden kaynaklanan iade talepleri için tek YMM raporu düzenlenebilir. Bir takvim
      yılını aşmamak ve her bir döneme ilişkin bilgi ve hesaplamaların ayrı ayrı yer alması kaydıyla birden fazla dönemi kapsayan
      tek YMM raporu verilmesi de mümkündür.
