  konu: TAS
  kazanim: tam tasdik kontrol listeleri
  tip: kavrama
  zorluk: 3
  kok: 'Aracı kurum olan ve Yönetmelik md. 9 uyarınca hesap dönemine ilişkin mali tablolarını ve beyannamelerini tasdik ettirmek
    zorunda bulunan (AB) A.Ş. ile ilgili aşağıdaki ifadeler veriliyor:

    I. Şirket, seçtiği YMM''yi tasdiki zorunlu mali tabloların ilgili olduğu hesap döneminin başına kadar Birliğe bildirmezse
    YMM seçmemiş sayılır ve seçim Birlik tarafından ilgili Odaya yaptırılır.

    II. Tasdik kapsamına alınan bir konuda YMM tasdik raporunun zamanında ibraz edilmemesi, vergi matrahının re''sen takdirini
    gerektiren hâllerdendir.

    III. Tasdik ettiği beyannamenin gerçeği yansıtmaması hâlinde YMM, ziyaa uğratılan vergiden ve kesilecek cezalardan mükellefle
    birlikte müştereken ve müteselsilen sorumludur.

    IV. YMM''nin başka bir ildeki bilgi toplama işini o ildeki bir YMM''ye yaptırması hâlinde, bu kısmi incelemeden doğan
    sorumluluk raporu düzenleyen YMM''ye aittir.

    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: II ve IV
    C: I, III ve IV
    D: I, II ve III
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Yönetmelik md. 9''a göre tasdik zorunluluğu bulunanların YMM seçmemesi hâlinde seçim Birlik tarafından ilgili
      Odaya yaptırılır. Hesap döneminin başına kadar seçtikleri YMM''yi Birliğe bildirmeyenler YMM seçmemiş sayılır (I doğru).
      VUK md. 30/8''e göre tasdik kapsamına alınan konularda YMM tasdik raporunun zamanında ibraz edilmemesi re''sen takdir
      sebebidir (II doğru). Yönetmelik md. 20''ye göre YMM, rapor düzenlediği konu ve belgelerin gerçeği yansıtmaması hâlinde
      ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumludur; Borçlar
      Kanununun tam teselsül hükümleri uygulanır (III doğru). Başka bir ildeki inceleme ve bilgi toplama işi o ildeki bir
      YMM''ye yaptırılmışsa, bu kısmi incelemeden doğan sorumluluk incelemeyi yapan YMM''ye aittir (IV yanlış). Püf noktaları:
      Müteselsil sorumluluk kuralının, başka ilde yaptırılan kısmi inceleme için sorumluluğu incelemeyi yapan YMM''ye bırakan
      bir istisnası vardır. Rapor tasdik kapsamında süresinde verilmezse sonuç re''sen takdirdir; yalnız usulsüzlük cezasıyla
      kalınmaz.'
    celdiriciler:
      A: 'III de doğrudur: YMM tasdik ettiği konularda mükellefle müştereken ve müteselsilen sorumludur.'
      B: 'IV yanlıştır: kısmi incelemeden doğan sorumluluk incelemeyi yapan YMM''ye aittir. Doğru olan I ve III de dışarıda
        bırakılmıştır.'
      C: IV yanlıştır; II ise VUK md. 30/8 uyarınca doğrudur.
      E: IV yanlıştır; Yönetmelik md. 20 kısmi incelemeden doğan sorumluluğu incelemeyi yapan YMM'ye bırakır.
    hesap_adimlari: []
