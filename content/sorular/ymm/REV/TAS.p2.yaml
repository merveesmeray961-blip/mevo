  kok: İTUS sertifikası bulunmayan ve iade talepleri Tebliğin (IV/A2) bölümündeki usul ve esaslara tabi olmayan (Y) A.Ş.,
    ilgili sınırı aşan ve işlem türü itibarıyla YMM KDV İadesi Tasdik Raporu ile talep edilebilen 2.000.000 TL tutarındaki
    nakden iade talebi için artırımlı teminat uygulamasından yararlanmak istemektedir. KDV Genel Uygulama Tebliği'ne göre
    bu uygulamayla ilgili aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Şirket, YMM raporu dışındaki belgeleri tamamladıktan sonra 2.400.000 TL tutarında teminat mektubu ya da kefalet senedi
      vermelidir.
    B: YMM raporu iadenin yapıldığı tarihten itibaren altı ay içinde verilmezse, iade talebi sürenin sonunda ivedilikle incelemeye
      sevk edilir.
    C: Teminatın verilmesi hâlinde iade işlemi on iş günü içinde gerçekleştirilir.
    D: Rapor ibraz edildikten sonra yapılan kontrollerde olumsuzluk çıkmazsa teminat, raporun ibrazından itibaren en geç iki
      ay içinde iade edilir.
    E: Kontrollerde tespit edilen eksiklik verilen süreler içinde giderilmezse haksız iade edilen tutar, gecikme faizi ve
      vergi ziyaı cezasıyla birlikte aranır.
  dogru: C
  aciklama:
    dogru_neden: 'Artırımlı teminat uygulamasında, iade talep dilekçesi ve YMM raporu hariç aranan belgeler tamamlandıktan
      sonra nakden iadesi talep edilen tutarın %120''si (İTUS sertifikası sahiplerinde %60''ı) oranında teminat verilirse
      iade işlemi beş iş günü içinde gerçekleştirilir; ''on iş günü'' ifadesi yanlıştır. Diğer ifadeler doğrudur: teminat
      2.000.000 × %120 = 2.400.000 TL''dir. Rapor altı ay içinde verilmezse talep sürenin sonunda ivedilikle incelemeye sevk
      edilir. Rapor ibraz edilince kontroller iki ay içinde tamamlanır ve olumsuzluk yoksa teminat en geç iki ay içinde iade
      edilir. Eksiklikler 30 + 30 günlük sürelerde giderilmezse haksız iade, gecikme faizi ve vergi ziyaı cezasıyla aranır.
      Püf noktaları: ''On iş günü'', KDV İadesi Ön Kontrol Raporuna dayalı uygulamada, olumsuzluk tespit edilmeyen tutarın
      %50''sinin iadesi için öngörülen süredir. İki uygulamanın sürelerini ve oranlarını karıştırmayın.'
    celdiriciler:
      A: 'Doğru ifadedir: İTUS sertifikası olmayan mükellefte teminat oranı %120''dir (2.000.000 × %120 = 2.400.000 TL).'
      B: 'Doğru ifadedir: altı aylık süre içinde rapor verilmezse talep ivedilikle incelemeye sevk edilir.'
      D: 'Doğru ifadedir: olumsuzluk tespit edilmezse teminat, raporun ibrazından itibaren en geç iki ay içinde iade edilir.'
      E: 'Doğru ifadedir: süreler içinde giderilmeyen eksiklik hâlinde haksız iade gecikme faizi ve vergi ziyaı cezasıyla
        aranır.'
    hesap_adimlari:
    - 'Teminat: 2.000.000 × %120 = 2.400.000 TL'
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-5.6
    alinti: nakden iadesi talep edilen tutarın %120’si oranında (İTUS sertifikası sahibi mükellefler için %60’ı oranında)
      banka teminat mektubu veya sigorta şirketi kefalet senedi verilmesi halinde, iade işlemi beş iş günü içinde gerçekleştirilir.
      İadeye ilişkin YMM raporunun iadenin yapıldığı tarihten itibaren altı ay içinde verilmemesi halinde, iade talebi sürenin
      sonunda ivedilikle incelemeye sevk edilir.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-5.6
    alinti: Süresinde eksiklikleri/olumsuzlukları gidermeyen mükellefe 30 günlük ek süre verilir.
