- id: YMM-REV-TAS-0015
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: KDV iade incelemesi
  tip: uygulama
  zorluk: 2
  kok: (V) A.Ş.'nin YMM KDV İadesi Tasdik Raporuyla sonuçlandırılacak iade talebi için teminat göstermesi üzerine teminat
    karşılığı iade 10.2.2026'da yapılmıştır. KDV Genel Uygulama Tebliği'ne göre bu iadeye ilişkin YMM raporu hakkında aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Rapor iadenin yapıldığı tarihten itibaren üç ay içinde ibraz edilmezse teminat kendiliğinden paraya çevrilir.
    B: Rapor altı ay içinde ibraz edilmez ve ek süre de istenmezse, iade incelemeye sevk edilir.
    C: Altı ay içinde rapor ibraz edemeyen mükellefe, mazeret aranmaksızın vergi dairesince altı ay ek süre verilir.
    D: Ek süre içinde de rapor ibraz edilmezse teminat, mükellefin başvurusu üzerine kendisine iade edilir.
    E: Rapor süresinde ibraz edilse bile teminatın yalnız yarısı iade edilir; kalanı vergi inceleme raporu sonucuna göre çözülür.
  dogru: B
  aciklama:
    dogru_neden: Tebliğe göre YMM raporuyla iade talep eden mükellefe rapor ibraz edilmedikçe iade yapılmaz; teminat gösterilirse
      iade incelemeye sevk edilmeksizin yapılır ve rapor ibraz edildiğinde teminat iade edilir. Teminat karşılığı iadenin
      yapıldığı tarihten itibaren altı ay içinde rapor ibraz edilmez ve ek süre talep edilmezse, teminat karşılığı yapılan
      iade incelemeye sevk edilir ve teminat vergi inceleme raporu sonucuna göre çözülür.
    celdiriciler:
      A: Süre üç değil altı aydır; süre geçince teminat paraya çevrilmez, iade incelemeye sevk edilir.
      C: Ek süre ancak mazeretle başvurulması ve mazeretin haklı nedenlere dayanması hâlinde, değerlendirme sonucunda VUK
        md. 17 uyarınca verilebilir.
      D: Ek süre içinde de rapor ibraz edilmezse iade incelemeye sevk edilir; teminat vergi inceleme raporu sonucuna göre
        çözülür.
      E: Rapor ibraz edildiğinde teminatlar iade edilir; yarı oranında iade öngörülmemiştir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-4.1
    alinti: YMM raporu ile iade talebinde bulunan mükelleflerin, teminat karşılığı iadenin yapıldığı tarihten itibaren altı
      ay içinde bu iade ile ilgili YMM raporunu ibraz etmemesi halinde, söz konusu teminat vergi inceleme raporu sonucuna
      göre çözülür.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A3-4.1
    alinti: Bu süre içinde rapor ibraz edemeyecek olanların mazeretleriyle birlikte başvurmaları halinde, gerekli değerlendirme
