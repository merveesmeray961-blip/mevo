- id: YMM-REV-TAS-0014
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: tespit ve eleştiri yazılması
  tip: kavrama
  zorluk: 2
  kok: 'Sürekli denetleme sonucunda düzenlenen bir tam tasdik raporuyla ilgili aşağıdaki ifadeler veriliyor:

    I. Raporda denetimin dönem başından itibaren sürekli denetleme sonucunda mı, dönemin kapanmasından sonra yapılan denetim
    sonucunda mı yapıldığı açıkça belirtilir.

    II. Raporda yalnız vergi matrahını doğrudan etkileyen mevzuat aykırılıklarına yer verilir; mali tablolar üzerinde dolaylı
    etkisi olması muhtemel aykırılıklar rapora alınmaz.

    III. Raporda mali tabloların genel kabul görmüş muhasebe ilkelerine uygun hazırlanıp hazırlanmadığı belirtilir.

    IV. Raporun her sayfası paraf edilip mühürlenir; son sayfası imzalanır ve mühürlenir.

    Yönetmelik hükümlerine göre bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve III
    B: II ve IV
    C: I, II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: Md. 8'e göre denetimin hangi duruma göre (sürekli denetleme ya da dönem sonrası denetim) yapıldığı tasdik
      raporunda açıkça belirtilir (I doğru). Md. 19'a göre sürekli denetlemeyi gerektiren raporlarda, mali tablo ve raporlar
      üzerinde doğrudan veya dolaylı etkisi olan veya olması muhtemel her türlü mevzuat aykırılığı belirtilir (II yanlış).
      Aynı raporlarda mali tabloların genel kabul görmüş muhasebe ilkelerine uygun hazırlanıp hazırlanmadığı belirtilir (III
      doğru). Raporların her sayfası paraf edilir ve mühürlenir; son sayfası imzalanır ve mühürlenir (IV doğru).
    celdiriciler:
      A: 'IV de doğrudur: md. 19 sayfaların paraf ve mühür, son sayfanın imza ve mühür şeklini düzenler.'
      B: II yanlıştır; doğru olan I ve III dışarıda bırakılmıştır.
      C: 'II yanlıştır: dolaylı etkisi olan veya olması muhtemel aykırılıklar da rapora alınır; IV ise doğrudur.'
      E: II'deki sınırlama md. 19'a aykırıdır; rapora her türlü mevzuat aykırılığı alınır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 8
    alinti: Denetimin hangi duruma göre yapıldığı tasdik raporunda açıkça belirtilir.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 19
    alinti: Sürekli denetlemeyi gerektiren tasdik raporlarında, mali tablo ve raporlar üzerinde doğrudan veya dolaylı etkisi
      olan veya olması muhtemel her türlü mevzuat aykırılıkları ve mali tabloların genel kabul görmüş muhasebe ilkelerine
      uygun hazırlanıp hazırlanmadığı belirtilir.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
