- id: YMM-REV-TAS-0013
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: tam tasdik kontrol listeleri
  tip: uygulama
  zorluk: 2
  kok: Hesap dönemi takvim yılı olan ve yıllık kurumlar vergisi beyannamesini nisan ayında verecek olan (U) A.Ş.'nin YMM ile
    sürekli denetimi kapsayan tam tasdik sözleşmesi bulunmaktadır. Yıllık mali tablolarının tasdiki şirket için zorunludur.
    Yönetmelik md. 10'a göre bu sözleşmenin feshi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Taraflar, yazılı gerekçe göstermek şartıyla sözleşmeyi 15 şubatta feshedebilir.
    B: Sözleşme 20 aralıkta feshedilebilir ve fesih 15 gün içinde Bakanlığa bildirilir.
    C: Fesih hâlinde şirket, fesihten itibaren üç ay içinde başka bir YMM ile sözleşme yapmalıdır.
    D: Sözleşmeyi yalnız YMM yazılı gerekçeyle feshedebilir; şirket gerekçe göstermeksizin feshedebilir.
    E: Fesih hâlinde YMM çalışma notlarını, yerine geçecek YMM'ye değil bağlı olduğu Odaya teslim eder.
  dogru: B
  aciklama:
    dogru_neden: Md. 10'a göre tasdik sözleşmesi, yazılı gerekçe göstermek şartıyla taraflarca her zaman feshedilebilir; ancak
      sürekli denetimlerde yıllık beyannamenin beyan edileceği aydan önceki üç ay içinde feshedilemez. Beyan ayı nisan olduğundan
      yasak dönem ocak–mart aylarıdır; 20 aralık bu dönemin dışındadır. Feshedilen sözleşmeler fesih tarihinden itibaren en
      geç 15 gün içinde Bakanlığa bildirilir.
    celdiriciler:
      A: Sürekli denetimlerde yıllık beyannamenin beyan edileceği aydan önceki üç ay içinde (ocak, şubat, mart) sözleşme feshedilemez;
        15 şubat bu döneme girer.
      C: Mali tablolarının tasdiki zorunlu işletmeler fesih hâlinde bir ay içinde yeni sözleşme yapmak zorundadır; süre üç
        ay değildir.
      D: Sözleşme taraflarca, yazılı gerekçe gösterilmek şartıyla feshedilebilir; gerekçe şartı iki taraf için de geçerlidir.
      E: YMM çalışma notlarını ve gerekli tüm bilgileri yerine geçecek YMM'ye devretmek zorundadır.
    hesap_adimlari:
    - Beyan ayı nisan → fesih yasağı ocak–mart; 20 aralık yasak dönem dışında
  kaynaklar:
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 10
    alinti: Tasdik sözleşmesi, yazılı gerekçe göstermek şartıyla taraflarca her zaman feshedilebilir. Feshedilen sözleşmeler,
      fesih tarihinden itibaren en geç 15 gün içinde Bakanlığa bildirilir.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
    madde: md. 10
    alinti: Sürekli denetimlerde yıllık beyannamelerin ve buna ekli mali tabloların beyan edileceği aydan önceki üç ay içinde
      tasdik sözleşmesi feshedilemez.
  - mevzuat: YMM'lerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında Yönetmelik
