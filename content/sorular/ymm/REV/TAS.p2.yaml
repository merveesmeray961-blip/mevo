    raporlarının düzenlenmesi ve teslimi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Rapor iki örnek düzenlenir; bir örneği ilgili firmaya teslim edilir.
    B: Rapor üç örnek düzenlenir; bir örneği firmaya, iki örneği tasdiki isteyen mercie verilir.
    C: Rapor dört örnek düzenlenir; bir örneği YMM'nin bağlı olduğu Odaya gönderilir.
    D: Rapor üç örnek düzenlenir; mercie verilecek örneği firma yetkililerince teslim edilir.
    E: Rapor üç örnek düzenlenir; iki örneği ilgili firmanın yetkililerine teslim edilir.
  dogru: E
  aciklama:
    dogru_neden: Yönetmelik md. 18'e göre tasdik raporları üç örnek düzenlenir ve iki örneği ilgili firma, kurum ve kuruluşların
      yetkililerine teslim edilir. Raporların birer örneği, tasdik konusu belgelerle birlikte tasdiki isteyen mercie doğrudan
      YMM tarafından verilir. Rapor ile mali tablo ve beyannameler arasındaki mutabakatın sağlanması da YMM'nin sorumluluğundadır.
    celdiriciler:
      A: Rapor iki değil üç örnek düzenlenir; firmaya teslim edilen örnek sayısı da ikidir.
      B: Firmaya iki örnek teslim edilir; mercie verilen örnek birdir.
      C: Yönetmelikte dört örnek ve Odaya gönderme öngörülmemiştir.
      D: Mercie verilecek örnek firma yetkililerince değil, doğrudan YMM tarafından verilir.
