  kok: Meslek sicil numarası 1450 olan YMM (Z), mesleki faaliyete başladığından itibaren kendi imza ve mührüyle düzenlediği
    raporlarla genel sayısı 286'ya ulaştıktan sonra Haziran 2024'te mesleki faaliyetten ayrılmıştır. Bağlı olduğu Odaya bildirerek
    2026 yılı başında yeniden faaliyete başlayan (Z), 2026 yılında kendi imza ve mührüyle dört tasdik raporu düzenlemiştir.
    Yönetmelik md. 19'a göre bu dördüncü rapora verilecek sayı aşağıdakilerden hangisidir? (Sayılar sırasıyla, kısa çizgiyle
    ayrılarak gösterilmiştir.)
  secenekler:
    A: YMM 1450-290-4
    B: YMM 1450-4-290
    C: YMM 1450-4-4
    D: YMM 290-1450-4
    E: 1450-290-4 YMM
  dogru: A
  aciklama:
    dogru_neden: 'Md. 19''a göre raporlara meslek sicil numarasıyla birlikte biri genel, diğeri özel iki sayı verilir. Genel
      sayı, mesleki faaliyete başlamadan itibaren (1)''den başlar ve kesintisiz devam eder. Faaliyetten ayrılıp yeniden başlayanlar
      genel sayıya, ayrıldıkları tarihteki son sayıdan itibaren devam eder: 2026''daki raporlar 287, 288, 289 ve 290 genel
      sayısını alır. Özel sayı her takvim yılı başında yeniden başlar; dördüncü rapor 4 özel sayısını alır. Sıralama önce
      meslek sicil numarası, sonra genel sayı, sonra özel sayıdır. Rapor sayısının başına ''YMM'' rumuzu konulur: YMM 1450-290-4.
      Püf noktaları: Ara verme genel sayıyı sıfırlamaz, son sayıdan devam ettirir. Özel sayı ise ara vermeden bağımsız olarak
      her yıl yeniden başlar. ''YMM'' rumuzunun yeri de kurala bağlıdır: sayının başı.'
    celdiriciler:
      B: Özel sayı genel sayıdan önce yazılmıştır; sıralama sicil no – genel sayı – özel sayıdır.
      C: Genel sayı yeniden başlatılmıştır; yeniden faaliyete başlayan YMM genel sayıya son sayıdan devam eder.
      D: Genel sayı sicil numarasının önüne yazılmıştır; önce meslek sicil numarası kullanılır.
      E: '''YMM'' rumuzu sayının başına konulur, sonuna değil.'
    hesap_adimlari:
    - 'Genel sayı: 286 + 4 = 290'
    - 'Özel sayı: 2026''da 4. rapor = 4'
