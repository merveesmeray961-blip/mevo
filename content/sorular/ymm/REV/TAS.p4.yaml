  aciklama:
    dogru_neden: 'KDV Genel Uygulama Tebliği IV/A-5.6''ya göre artırımlı teminat uygulamasında nakden iadesi talep
      edilen tutarın %120''si oranında (İTUS sertifikası sahiplerinde %60''ı) banka teminat mektubu veya sigorta
      şirketi kefalet senedi verilmesi hâlinde iade beş iş günü içinde yapılır: 2.000.000 × %120 = 2.400.000 TL.'
    celdiriciler:
      A: '%50 oranı KDV İadesi Ön Kontrol Raporuna dayalı iadeye ilişkindir; teminat oranı değildir.'
      B: '%60 oran yalnız İTUS sertifikası sahibi mükellefler için uygulanır.'
      C: Genel teminat karşılığı iadedeki tam teminat mantığıyla hesaplanmıştır; artırımlı teminatta oran %120'dir.
      E: Kanunda %150 oran öngörülmemiştir.
    hesap_adimlari:
    - İTUS yok → oran %120
    - 2.000.000 × 1,20 = 2.400.000 TL
