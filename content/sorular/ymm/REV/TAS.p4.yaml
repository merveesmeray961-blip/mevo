- id: YMM-REV-TAS-0024
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: KDV iade incelemesi
  tip: kavrama
  zorluk: 3
  kok: '(S) A.Ş., artırımlı teminat uygulaması kapsamında nakden iade almış, iadeye ilişkin YMM KDV İadesi Tasdik
    Raporunu sonradan ibraz etmiştir. KDV Genel Uygulama Tebliği''ne göre bu süreçle ilgili aşağıdaki ifadeler veriliyor:


    I. Teminatın verilmesi ve belgelerin tamamlanması hâlinde iade işlemi beş iş günü içinde gerçekleştirilir.

    II. YMM raporu iadenin yapıldığı tarihten itibaren altı ay içinde verilmezse iade talebi sürenin sonunda ivedilikle
    incelemeye sevk edilir.

    III. Rapor üzerine yapılan kontrollerde tespit edilen eksikliğin giderilmesi için verilen 30 günlük süre ile
    30 günlük ek süre, teminatın iadesine ilişkin iki aylık sürenin hesabına dahil edilir.

    IV. Verilen sürelerde eksiklik giderilmezse haksız iade edilen tutar, gecikme faizi ve vergi ziyaı cezası ile
    birlikte mükelleften aranır.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: 'Tebliğ IV/A-5.6''ya göre %120 teminat verilmesi hâlinde iade beş iş günü içinde yapılır (I); YMM
      raporu altı ay içinde verilmezse talep sürenin sonunda ivedilikle incelemeye sevk edilir (II). Rapor ibrazından
      sonra eksiklik tespit edilirse 30 gün ve 30 günlük ek süre verilir; bu süreler teminatın iadesine ilişkin
      iki aylık sürenin hesabında dikkate alınmaz (III yanlış). Eksiklik giderilmezse haksız iade edilen tutar gecikme
      faizi ve vergi ziyaı cezası ile aranır (IV). Püf noktaları: Mükellefe tanınan düzeltme süreleri idarenin iki
      aylık teminat iade süresini tüketmez; süre hesabından düşülür.'
    celdiriciler:
      A: IV de doğrudur; eksiklik giderilmezse haksız iade faiz ve cezayla geri alınır.
      B: III yanlıştır; düzeltme süreleri iki aylık sürenin hesabında dikkate alınmaz.
      C: III yanlış, IV ise doğrudur.
      D: III yanlış, I ise doğrudur.
  kaynaklar:
