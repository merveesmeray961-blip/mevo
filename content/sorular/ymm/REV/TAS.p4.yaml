  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: KDV iade incelemesi
  tip: hesaplama
  zorluk: 2
  kok: (T) A.Ş.; 30 aydır aylık KDV beyannamesi veren, daha önce dört döneme ilişkin iade talebi sonuçlanmış, kendisi,
    ortakları ve kanuni temsilcileri hakkında sahte belge veya riskli iade nedeniyle ya da (IV/A1) bölümü kapsamında
    incelemeye sevk ve (IV/A2) bölümü kapsamında işlem bulunmayan bir mükelleftir. Şirket, Tebliğdeki sınırı aşan
    3.000.000 TL nakden iade talebini standart iade talep dilekçesi, YMM KDV İadesi Tasdik Raporu ve diğer belgelerle
    ibraz etmiştir. KDVİRA sisteminin ürettiği KDV İadesi Ön Kontrol Raporunda 400.000 TL'lik kısım için olumsuzluk
    tespit edilmiştir. Ön Kontrol Raporuna dayanılarak on iş günü içinde iade edilecek tutar kaç TL'dir?
  secenekler:
    A: 650.000 TL
    B: 1.100.000 TL
    C: 1.300.000 TL
    D: 1.500.000 TL
    E: 2.600.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Tebliğ IV/A-4.2''ye göre şartları sağlayan mükelleflerin (en az 24 dönem beyanname, en az üç dönem
      iade talebinin sonuçlanmış olması, sahte belge veya riskli iade nedeniyle incelemeye sevk bulunmaması) talepleri
      KDVİRA sisteminde sorgulanır; Ön Kontrol Raporuna göre talebin olumsuzluk tespit edilmeyen kısmının %50''si
      on iş günü içinde iade edilir: (3.000.000 − 400.000) × %50 = 1.300.000 TL. Kalan tutar genel kontroller sonucuna
      göre yerine getirilir.'
    celdiriciler:
      A: Olumsuzluk tespit edilmeyen kısmın %25'i hesaplanmıştır; Tebliğ oranı %50'dir.
      B: Talebin %50'sinden olumsuz tutar düşülmüştür (1.500.000 − 400.000); oran olumsuzluk düşüldükten sonra uygulanır.
      D: Olumsuzluk tespit edilen kısım düşülmeden talebin %50'si alınmıştır.
      E: Olumsuzluk dışındaki tutarın tamamı iade edilmiştir; ön kontrolde iade edilen kısım %50'dir.
