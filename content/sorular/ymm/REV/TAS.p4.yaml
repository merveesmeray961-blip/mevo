- id: YMM-REV-TAS-0022
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: tespit ve eleştiri yazılması
  tip: kavrama
  zorluk: 3
  kok: 'İstanbul''da faaliyet gösteren YMM (Y), (Z) A.Ş.''nin 2026 yılı tam tasdik raporunu düzenlemiştir. Şirketin
    İzmir''deki şubesine ait stok tespiti ve bilgi toplama işini İzmir''deki bir YMM''ye yaptırmıştır. Rapordaki
    tespitlerin bir kısmının gerçeği yansıtmadığı ve vergi ziyaına yol açtığı sonradan anlaşılmıştır. YMM Tasdik
    Yönetmeliği md. 20''ye göre aşağıdaki ifadeler veriliyor:


    I. YMM (Y), tasdik kapsamı ile sınırlı olarak tasdikin doğruluğundan sorumludur.

    II. YMM (Y), raporun gerçeği yansıtmayan kısmından doğan ziyaa uğratılan vergiler ve kesilecek cezalardan mükellefle
    birlikte müştereken ve müteselsilen sorumludur.

    III. İzmir''deki kısmi incelemeden doğan sorumluluk, raporu imzalayan YMM (Y)''ye aittir.

    IV. YMM''lerin tasdikten doğan sorumlulukları için sorumluluk sigortası yaptırmaları zorunludur.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve III
    C: II ve IV
    D: I ve II
    E: I, II ve IV
  dogru: D
  aciklama:
    dogru_neden: 'md. 20''ye göre tasdik raporu düzenleyen YMM''ler tasdik kapsamı ile sınırlı olarak tasdikin doğruluğundan
      sorumludur (I) ve gerçeği yansıtmayan konularda ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle
      birlikte müştereken ve müteselsilen sorumludur (II). Başka ildeki inceleme ve bilgi toplama işinin o ildeki
      bir YMM''ye yaptırılması hâlinde bu kısmi incelemeden doğan sorumluluk incelemeyi yapan YMM''ye aittir (III
      yanlış). YMM''ler sorumluluk sigortası yaptırabilirler; zorunluluk yoktur (IV yanlış). Püf noktaları: Kısmi
      incelemede sorumluluk işi fiilen yapana geçer; sigorta ise isteğe bağlıdır.'
    celdiriciler:
      A: II de doğrudur; müşterek ve müteselsil sorumluluk md. 20'de açıkça düzenlenmiştir.
      B: III yanlıştır; kısmi incelemenin sorumluluğu incelemeyi yapan YMM'ye aittir.
      C: IV yanlıştır; sorumluluk sigortası isteğe bağlıdır. I ise doğrudur.
      E: Sorumluluk sigortası zorunlu değildir; IV yanlıştır.
