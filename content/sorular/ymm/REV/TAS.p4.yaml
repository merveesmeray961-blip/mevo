  kok: İTUS sertifikası bulunmayan ve KDV Genel Uygulama Tebliği'nin (IV/A2) bölümündeki usul ve esaslara tabi olmayan
    (R) A.Ş., Tebliğde belirlenen sınırı aşan ve işlem türü itibarıyla YMM KDV İadesi Tasdik Raporu ile talep edilebilen
    2.000.000 TL nakden iade talebi için artırımlı teminat uygulamasından yararlanmak istemektedir. İade talep dilekçesi
    ve YMM raporu hariç diğer belgeler tamamlanmıştır. Şirketin vermesi gereken banka teminat mektubu tutarı kaç
    TL'dir?
