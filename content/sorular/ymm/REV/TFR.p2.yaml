- id: YMM-REV-TFR-0010
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.12 örtülü sermaye
  tip: hesaplama
  zorluk: 3
  kok: '(R) A.Ş.''nin VUK''a göre tespit edilen 1.1.2026 tarihli öz sermayesi 2.000.000 TL''dir. Şirketin 2026 yılı boyunca
    aynı tutarda işletmede kullandığı borçlar ve bunlar için gider yazdığı faizler şöyledir:


    - %60 ortağı tam mükellef (K) A.Ş.''den alınan borç 4.000.000 TL; faiz 600.000 TL

    - %25 ortağı olan ve ana faaliyet konusuna uygun olarak mevduat bankacılığı yapan (M) Bankası A.Ş.''den alınan kredi 8.000.000
    TL; faiz 1.000.000 TL

    - (K) A.Ş.''nin taşınmazı üzerine ipotek tesis edilerek ilişkisiz (T) Bankasından alınan kredi 2.000.000 TL; faiz 300.000
    TL


    Kur farkı yoktur. Buna göre (R) A.Ş.''nin 2026 kurum kazancının tespitinde örtülü sermaye nedeniyle kanunen kabul edilmeyen
    gider sayılacak faiz tutarı kaç TL''dir?'
  secenekler:
    A: '150.000'
    B: '275.000'
    C: '400.000'
    D: '560.000'
    E: '800.000'
  dogru: B
  aciklama:
    dogru_neden: 'Ortak sayılan bankadan yapılan borçlanma karşılaştırmada %50 oranında dikkate alınır (md. 12/2): 4.000.000
      TL. Ortağın ipoteği (gayrinakdi teminat) karşılığında üçüncü kişiden alınan kredi örtülü sermaye sayılmaz (md. 12/6-a).
      Dikkate alınacak borç 4.000.000 + 4.000.000 = 8.000.000 TL; sınır 3 × 2.000.000 = 6.000.000 TL; örtülü sermaye 2.000.000
      TL. Banka kredisine ait faiz de borçla aynı ölçüde (%50) dikkate alınır: 600.000 + 500.000 = 1.100.000 TL. KKEG = 1.100.000
      × 2.000.000 / 8.000.000 = 275.000 TL (KVK md. 11/1-b). Püf noktaları: %50 kuralı yalnız borca değil o borca ait faize
      de yansıtılır; ipotekli üçüncü kişi kredisi hesaplamaya hiç girmez; örtülü sermaye ortaklara borç oranında dağıtılır.'
    celdiriciler:
      A: 'Yalnız (K) A.Ş.''ye isabet eden kısım (örtülü sermayenin yarısı: 1.000.000 / 4.000.000 × 600.000) hesaplanmış, bankaya
        isabet eden 125.000 TL atlanmıştır.'
      C: 'Banka kredisi %50 dikkate alındığı hâlde faizinin tamamı (1.000.000) oranlamaya katılmıştır: 2/8 × 1.600.000.'
      D: 'Ortağın gayrinakdi teminatıyla üçüncü kişiden alınan kredi de borca katılmıştır: borç 10.000.000, örtülü sermaye
        4.000.000, faiz 1.400.000 × 0,40.'
      E: 'Banka kredisine %50 kuralı uygulanmamıştır: borç 12.000.000, örtülü sermaye 6.000.000, faiz 1.600.000 × 0,50.'
    hesap_adimlari:
    - Dikkate alınacak borç = 4.000.000 + 8.000.000 × %50 = 8.000.000 (ipotekli kredi hariç)
    - Örtülü sermaye = 8.000.000 − 3 × 2.000.000 = 2.000.000
    - Dikkate alınacak faiz = 600.000 + 1.000.000 × %50 = 1.100.000
    - KKEG = 1.100.000 × 2.000.000 / 8.000.000 = 275.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/2
    alinti: Yukarıda belirtilen karşılaştırma sırasında, sadece ilişkili şirketlere finansman temin eden kredi şirketlerinden
      yapılan borçlanmalar hariç olmak üzere, ana faaliyet konusuna uygun olarak faaliyette bulunan ve ortak veya ortakla
      ilişkili kişi sayılan banka veya benzeri kredi kurumlarından yapılan borçlanmalar % 50 oranında dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-b
    alinti: Örtülü sermaye üzerinden ödenen veya hesaplanan faiz, kur farkları ve benzeri giderler.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 12.1.6
    alinti: Örtülü sermaye uygulamasında temin edilen borcun tamamının değil, sadece öz sermayenin üç katını aşan kısmının
      örtülü sermaye sayılması ve bu kısma ilişkin faiz, kur farkı ve benzeri giderlerin, Kurumlar Vergisi Kanunu uygulamasında
      gider kabul edilmemesi hüküm altına alınmıştır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'borc = 4000000 + 8000000 * 0.5

      os_ = borc - 3 * 2000000

      faiz = 600000 + 1000000 * 0.5

      sonuc = round(faiz * os_ / borc)'
