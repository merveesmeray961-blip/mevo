- id: YMM-REV-TFR-0007
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.13 emsallere uygunluk ve yöntemler
  tip: hesaplama
  zorluk: 2
  kok: (K) A.Ş., %100 bağlı ortaklığı olan tam mükellef (L) A.Ş.'ye 2026 yılında ürettiği yarı mamulleri 500.000 TL'ye satmıştır.
    Bu yarı mamullerin maliyeti 450.000 TL'dir. (K) A.Ş. aynı yarı mamulleri karşılaştırılabilir koşullarda ilişkisiz müşterilerine
    maliyet üzerine %20 brüt kâr ekleyerek satmaktadır. İşlemin mahiyetine en uygun yöntemin maliyet artı yöntemi olduğu ve
    işlem nedeniyle Hazine zararı doğduğu kabul edilmektedir. Kurumlar vergisi oranı %25'tir. Buna göre (K) A.Ş. bakımından
    transfer fiyatlandırması yoluyla örtülü olarak dağıtılmış sayılan kazanç kaç TL'dir?
  secenekler:
    A: '10.000'
    B: '40.000'
    C: '50.000'
    D: '62.500'
    E: '90.000'
  dogru: B
  aciklama:
    dogru_neden: 'Maliyet artı yönteminde emsal fiyat, maliyetin makul bir brüt kâr oranı kadar artırılmasıyla bulunur; iç
      emsal olarak ilişkisiz müşterilere uygulanan oran esas alınır: 450.000 × 1,20 = 540.000 TL. Uygulanan fiyat 500.000
      TL olduğundan 540.000 − 500.000 = 40.000 TL kazanç örtülü olarak dağıtılmış sayılır.'
    celdiriciler:
      A: Örtülü kazanç tutarı yerine bu tutarın doğurduğu kurumlar vergisi farkı (40.000 × %25) hesaplanmıştır.
      C: Bu tutar ilişkili kişiye yapılan satıştan fiilen elde edilen brüt kârdır (500.000 − 450.000); emsal fiyatla karşılaştırma
        yapılmamıştır.
      D: '%20 oranı satış fiyatı üzerinden brüt kâr marjı gibi kullanılmış (450.000 / 0,80 = 562.500); oran maliyet üzerine
        eklenen kâr oranıdır.'
      E: Emsal brüt kârın tamamı (450.000 × %20) örtülü kazanç sayılmış; ilişkili kişiden elde edilen 50.000 TL kâr düşülmemiştir.
    hesap_adimlari:
    - Emsal fiyat = 450.000 × (1 + 0,20) = 540.000
    - Örtülü kazanç = 540.000 − 500.000 = 40.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/4-b
    alinti: 'Maliyet artı yöntemi: Emsallere uygun fiyatın, ilgili mal veya hizmet maliyetlerinin makul bir brüt kâr oranı
      kadar artırılması suretiyle hesaplanmasını ifade eder.'
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: '13.2'
    alinti: Eğer koşullar uygunsa, işlemi yapan mükellefin bu mal veya hizmetlere ilişkin olarak ilişkisiz kişilerle yaptığı
      işlemlerde uyguladığı genel brüt kâr marjı ideal oran olacaktır.
  gecerlilik:
    baslangic: '2007-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'emsal = 450000 * 1.20

      sonuc = round(emsal - 500000)'
