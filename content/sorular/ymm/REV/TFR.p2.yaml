      fiillerle vergi ziyaına sebebiyet verilmesi hali parantez içinde açıkça hariç tutulmuştur. Bu kısım için indirim uygulanmaz.
    celdiriciler:
      B: 359. madde fiilleri indirimin kapsamı dışında bırakılmıştır; belgelendirme bu kısım için sonuç doğurmaz.
      C: Hüküm cezayı kaldırmaz, yalnız şartları varsa %50 indirim sağlar.
      D: Kanunda %25'lik bir indirim öngörülmemiştir; indirim oranı %50'dir ve 359 fiillerinde hiç uygulanmaz.
      E: Hazine zararı, yurt içi ilişkili kişi işlemlerinde örtülü kazancın kabulü için aranan bir şarttır; ceza indiriminin
        şartı değildir.
