- id: YMM-REV-TFR-0005
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.13 emsallere uygunluk ve yöntemler
  tip: kavrama
  zorluk: 1
  kok: (A) A.Ş. ile aşağıda sayılan kişiler arasında, belirtilenler dışında yönetim, denetim, sermaye veya nüfuz bağı bulunmamakta;
    hiçbiri Cumhurbaşkanınca ilan edilen ülke veya bölgelerde yer almamaktadır. KVK md. 13'teki oranlarda Cumhurbaşkanınca
    değişiklik yapılmadığı varsayılmaktadır. Buna göre aşağıdakilerden hangisi transfer fiyatlandırması yoluyla örtülü kazanç
    dağıtımı bakımından (A) A.Ş.'nin ilişkili kişisi sayılır?
  secenekler:
    A: (A) A.Ş.'nin sermayesinde %6 payı bulunan gerçek kişi ortak
    B: (A) A.Ş.'nin sermayesine %8 oranında iştirak ettiği (Z) Ltd. Şti.
    C: (A) A.Ş.'nin %45 ortağının amcasının oğlu
    D: Ortaklık ilişkisi olmaksızın (A) A.Ş.'de %7 kâr payı hakkı bulunan (V) A.Ş.
    E: (A) A.Ş.'nin %45 ortağının kardeşinin kızı
  dogru: E
  aciklama:
    dogru_neden: KVK md. 13/2'ye göre ortakların eşleri, ortakların veya eşlerinin üstsoy ve altsoyu ile üçüncü derece dahil
      yansoy hısımları ve kayın hısımları da ilişkili kişi sayılır. Kardeşin kızı üçüncü derece yansoy hısımdır (ortak → anne/baba
      → kardeş → kardeşin kızı); ortağın payı da %10'un üzerindedir.
    celdiriciler:
      A: İlişkinin ortaklık kanalıyla oluştuğu durumlarda en az %10 ortaklık, oy veya kâr payı hakkı şartı aranır; %6'lık
        ortak bu eşiğin altındadır.
      B: Kurumun iştiraki de ortaklık kanalıyla ilişkilidir; %8'lik pay %10 eşiğinin altında kaldığından ilişkili kişi sayılmaz.
      C: Amcanın oğlu dördüncü derece yansoy hısımdır; hüküm üçüncü dereceye kadar (dahil) olanları kapsar.
      D: Ortaklık ilişkisi olmadan da ilişki doğabilir, ancak bunun için en az %10 oy veya kâr payı hakkı gerekir; %7 yetmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/2
    alinti: Ortakların eşleri, ortakların veya eşlerinin üstsoy ve altsoyu ile üçüncü derece dahil yansoy hısımları ve kayın
      hısımları da ilişkili kişi sayılır. … İlişkinin doğrudan veya dolaylı olarak ortaklık kanalıyla oluştuğu durumların
      örtülü kazanç dağıtımı kapsamında sayılması için en az %10 oranında ortaklık, oy veya kâr payı hakkının olması şartı
      aranır. Ortaklık ilişkisi olmadan doğrudan veya dolaylı olarak en az %10 oranında oy veya kâr payı hakkının olduğu durumlarda
      da taraflar ilişkili kişi sayılır.
