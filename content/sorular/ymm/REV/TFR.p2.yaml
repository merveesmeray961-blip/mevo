  kok: (B) A.Ş. hakkında yapılan incelemede, yurt dışındaki %80 ortağıyla yaptığı işlemler nedeniyle transfer fiyatlandırması
    yoluyla örtülü kazanç dağıtıldığı ve kurumlar vergisinin eksik tahakkuk ettirildiği tespit edilmiştir. Şirket transfer
    fiyatlandırmasına ilişkin belgelendirme yükümlülüklerini tam ve zamanında yerine getirmiştir; ancak işlemlerin bir kısmında
    VUK md. 359'da yazılı fiillerle vergi ziyaına sebebiyet verildiği anlaşılmıştır. KVK md. 13/8 bakımından, 359. maddedeki
    fiillerle ziyaa uğratılan vergiye ilişkin vergi ziyaı cezası için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Bu kısma ilişkin vergi ziyaı cezasında %50 indirim uygulanmaz.
    B: Belgelendirme tam ve zamanında yapıldığından bu kısma da %50 indirimli ceza uygulanır.
    C: Belgelendirme tam ve zamanında yapıldığından ceza kesilmez, yalnız gecikme faizi aranır.
    D: Bu kısma ilişkin vergi ziyaı cezası %25 indirimli uygulanır.
    E: '%50 indirim, belgelendirmeye ek olarak Hazine zararı doğmamış olması şartıyla uygulanır.'
