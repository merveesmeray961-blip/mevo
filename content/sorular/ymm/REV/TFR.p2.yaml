- id: YMM-REV-TFR-0011
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: örtülü kazanç dağıtımı
  tip: hesaplama
  zorluk: 3
  kok: (Z) A.Ş., aktifinde net defter değeri 1.200.000 TL olan bir makineyi 2026 yılında %30 ortağı tam mükellef gerçek kişi
    (O)'ya 1.300.000 TL'ye satmış ve 100.000 TL satış kârını kayıtlarına almıştır. (O) makineyi ticari faaliyeti dışında kullanmaktadır.
    2027 yılında yapılan incelemede makinenin satış tarihindeki emsal bedelinin 2.150.000 TL olduğu tespit edilmiştir. Kâr
    dağıtımına bağlı vergi kesintisi oranı %15'tir; KDV dikkate alınmayacaktır. Buna göre (Z) A.Ş.'nin 2026 kurum kazancına
    kanunen kabul edilmeyen gider olarak eklenecek tutar ile (O)'ya dağıtılmış sayılan kâr payı üzerinden yapılması gereken
    vergi kesintisi tutarı aşağıdakilerin hangisinde birlikte doğru verilmiştir?
  secenekler:
    A: 850.000 TL – 0 TL
    B: 850.000 TL – 127.500 TL
    C: 850.000 TL – 150.000 TL
    D: 950.000 TL – 142.500 TL
    E: 1.000.000 TL – 150.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Örtülü kazanç, emsal bedel ile uygulanan bedel arasındaki farktır: 2.150.000 − 1.300.000 = 850.000 TL; bu
      tutar KVK md. 11/1-c uyarınca kurum kazancına eklenir. Md. 13/6''ya göre bu tutar hesap döneminin son günü itibarıyla
      dağıtılmış kâr payı sayılır. Kâr payı gerçek kişiye aktarıldığından net kâr payı kabul edilip brüte tamamlanır: 850.000
      / 0,85 = 1.000.000 TL; kesinti 1.000.000 × %15 = 150.000 TL. Püf noktaları: örtülü kazanç defter değerinden değil kayıtlı
      satış bedelinden hareketle bulunur (100.000 TL kâr zaten beyan edilmiştir); kesinti matrahı brüte tamamlanmış tutardır.'
    celdiriciler:
      A: Kâr payının gerçek kişiye aktarıldığı kabul edilir; nakit kâr dağıtımı yapılmamış olması kesinti yükümlülüğünü ortadan
        kaldırmaz.
      B: Kesinti net tutar üzerinden hesaplanmış (850.000 × %15); tebliğe göre net kâr payı brüte tamamlanmalıdır.
      D: Örtülü kazanç emsal bedel ile defter değeri arasındaki fark (950.000) alınmış; kayıtlara alınan 100.000 TL satış
        kârı mükerrer vergilendirilmiş olur.
      E: Kazanca eklenecek tutar örtülü dağıtılan 850.000 TL'dir; brüte tamamlanmış tutar yalnız kesinti matrahıdır.
    hesap_adimlari:
    - Örtülü kazanç (KKEG) = 2.150.000 − 1.300.000 = 850.000
    - Brüt kâr payı = 850.000 / (1 − 0,15) = 1.000.000
    - Vergi kesintisi = 1.000.000 × %15 = 150.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-c
    alinti: Transfer fiyatlandırması yoluyla örtülü olarak dağıtılan kazançlar.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: '13.3'
    alinti: kâr payının dar mükellef kuruma, gerçek kişilere, vergiye tabi olmayan veya vergiden muaf herhangi bir kişi veya
      kuruma aktarılmış olması halinde, bu kâr payının net kâr payı kabul edilerek bu tutarın brüte tamamlanması sonucu bulunan
      tutar üzerinden kâr dağıtımına bağlı vergi kesintisi yapılması gerekecektir.
