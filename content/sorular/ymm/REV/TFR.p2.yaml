- id: YMM-REV-TFR-0012
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.13 emsallere uygunluk ve yöntemler
  tip: hesaplama
  zorluk: 3
  kok: Tam mükellef (D) Dağıtım A.Ş., yurt dışında yerleşik (P) Inc.'in %100 bağlı ortaklığıdır. (D), 2026 yılında (P)'den
    10.000 adet cihazı adedi 9.000 TL'den satın almış ve cihazların tamamını yıl içinde herhangi bir işleme tabi tutmadan
    ilişkisiz perakendecilere adedi 12.000 TL'den satmıştır. Benzer işlevleri üstlenen bağımsız distribütörlerin bu tür cihazlarda
    elde ettiği brüt satış kârı satış fiyatının %30'udur ve işleme en uygun yöntem yeniden satış fiyatı yöntemidir. (D), (P)'nin
    bulunduğu ülkede vergi yükünün Türkiye'den yüksek olduğunu, bu nedenle Hazine zararı doğmadığını ileri sürmektedir. Kurumlar
    vergisi oranı %25'tir. Buna göre (D)'nin 2026 kurum kazancına transfer fiyatlandırması nedeniyle eklenmesi gereken tutar
    kaç TL'dir?
  secenekler:
    A: '0'
    B: 1.500.000
    C: 6.000.000
    D: 30.000.000
    E: 36.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Yeniden satış fiyatı yönteminde emsal fiyat, ilişkisiz kişilere yeniden satış fiyatından makul brüt satış
      kârı düşülerek bulunur: 12.000 − (12.000 × %30) = 8.400 TL. (D) adet başına 9.000 − 8.400 = 600 TL fazla ödemiştir;
      tüm cihazlar yıl içinde satıldığından 600 × 10.000 = 6.000.000 TL örtülü kazanç dağıtılmış sayılır ve KVK md. 11/1-c
      uyarınca kazanca eklenir. Hazine zararı şartı md. 13/7''ye göre yalnız tam mükellef kurumlar ile yabancı kurumların
      Türkiye''deki işyeri veya daimi temsilcileri arasındaki yurt içi işlemlerde aranır; yurt dışındaki ilişkili kişiyle
      yapılan bu işlemde aranmaz. Püf noktaları: brüt satış kârı oranı satış fiyatına uygulanır, alış fiyatına kâr eklenmez;
      Hazine zararı savunması sınır ötesi işlemlerde sonuç doğurmaz.'
    celdiriciler:
      A: '%30, alış fiyatı üzerine eklenen kâr gibi kullanılırsa (12.000 / 1,30 ≈ 9.231 > 9.000) fark çıkmaz; ya da Hazine
        zararı savunması kabul edilmiştir. Her iki yol da yanlıştır.'
      B: Kazanca eklenecek tutar yerine bunun kurumlar vergisi etkisi (6.000.000 × %25) hesaplanmıştır.
      D: (D)'nin fiilen elde ettiği brüt kârın tamamı (12.000 − 9.000) × 10.000 örtülü kazanç sayılmıştır.
      E: Emsal brüt satış kârı tutarı (12.000 × %30 × 10.000) doğrudan örtülü kazanç kabul edilmiştir.
    hesap_adimlari:
    - Emsal alış fiyatı = 12.000 × (1 − 0,30) = 8.400
    - Fazla ödeme = 9.000 − 8.400 = 600 TL/adet
    - Örtülü kazanç = 600 × 10.000 = 6.000.000 TL (Hazine zararı şartı aranmaz)
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/4-c
    alinti: 'Yeniden satış fiyatı yöntemi: Emsallere uygun fiyatın, işlem konusu mal veya hizmetlerin aralarında herhangi
      bir şekilde ilişki bulunmayan gerçek veya tüzel kişilere yeniden satılması halinde uygulanacak fiyattan, makul bir brüt
      satış kârı düşülerek hesaplanmasını ifade eder.'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
