- id: YMM-REV-TFR-0009
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: örtülü kazanç dağıtımı
  tip: kavrama
  zorluk: 2
  kok: Transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı ve buna bağlı düzeltme işlemleri hakkında KVK md. 13 hükümlerine
    göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Tam mükellef kurumlar arasında ilişkili kişi kapsamında yapılan yurt içi işlemlerde örtülü kazanç dağıtımının kabulü
      Hazine zararının doğmasına bağlıdır.
    B: Örtülü olarak dağıtılan kazanç, şartların gerçekleştiği hesap döneminin son günü itibarıyla dağıtılmış kâr payı sayılır.
    C: Ödünç para alınması ve verilmesi işlemleri her hal ve şartta mal veya hizmet alım ya da satımı olarak değerlendirilir.
    D: Karşı taraf nezdindeki düzeltme, örtülü kazanç dağıtan kurum adına yapılan tarhiyat dava konusu olsa da tebliğle birlikte
      yapılabilir.
    E: Dar mükellefler için örtülü olarak dağıtılan kazanç, ana merkeze aktarılan tutar sayılır.
  dogru: D
  aciklama:
    dogru_neden: KVK md. 13/6'ya göre daha önce yapılan vergilendirme işlemlerinin taraf olan mükellefler nezdinde düzeltilmesi
      için örtülü kazanç dağıtan kurum adına tarh edilen vergilerin kesinleşmiş ve ödenmiş olması şarttır. Dava konusu edilen
      ve yalnız tebliğ edilmiş bir tarhiyat kesinleşmiş sayılmaz; D yanlıştır.
    celdiriciler:
      A: Md. 13/7 yurt içi ilişkili kişi işlemlerinde Hazine zararı şartını açıkça arar; doğrudur.
      B: Md. 13/6 ile aynıdır; doğrudur.
      C: Md. 13/1'in ikinci cümlesi ödünç para işlemlerini her hal ve şartta mal veya hizmet alım satımı sayar; doğrudur.
      E: Md. 13/6'ya göre dar mükellefler için ana merkeze aktarılan tutar sayılır; doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/6
    alinti: Tamamen veya kısmen transfer fiyatlandırması yoluyla örtülü olarak dağıtılan kazanç, Gelir ve Kurumlar Vergisi
      kanunlarının uygulamasında, bu maddedeki şartların gerçekleştiği hesap döneminin son günü itibarıyla dağıtılmış kâr
      payı veya dar mükellefler için ana merkeze aktarılan tutar sayılır. Daha önce yapılan vergilendirme işlemleri, taraf
      olan mükellefler nezdinde buna göre düzeltilir. Şu kadar ki, bu düzeltmenin yapılması için örtülü kazanç dağıtan kurum
      adına tarh edilen vergilerin kesinleşmiş ve ödenmiş olması şarttır.
