- id: YMM-REV-TFR-0008
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.12 örtülü sermaye
  tip: hesaplama
  zorluk: 2
  kok: (N) A.Ş.'nin VUK'a göre tespit edilen öz sermayesi 1.1.2026 tarihinde 1.000.000 TL, 31.12.2026 tarihinde 1.400.000
    TL'dir. Şirket 2026 yılında işletmede kullanmak üzere %60 ortağı tam mükellef gerçek kişi (O)'dan 3.500.000 TL borç almış;
    ayrıca %40 ortağı (P) A.Ş.'nin taşınmazı üzerine ipotek tesis edilmesi karşılığında şirketle ilişkisi bulunmayan bir bankadan
    800.000 TL kredi kullanmıştır. Her iki borç 1.3.2026'dan yıl sonuna kadar aynı tutarda kullanılmıştır. KVK md. 12'ye göre
    2026 hesap dönemi için örtülü sermaye tutarı kaç TL'dir?
  secenekler:
    A: '0'
    B: '100.000'
    C: '500.000'
    D: 1.300.000
    E: 2.500.000
  dogru: C
  aciklama:
    dogru_neden: 'Karşılaştırma hesap dönemi başındaki öz sermaye ile yapılır: 3 × 1.000.000 = 3.000.000 TL. Ortağın sağladığı
      gayrinakdi teminat (ipotek) karşılığında üçüncü kişiden yapılan borçlanma örtülü sermaye sayılmaz (md. 12/6-a). Dikkate
      alınacak borç 3.500.000 TL olup üç katı aşan 500.000 TL örtülü sermayedir.'
    celdiriciler:
      A: Dönem sonu öz sermayesi (1.400.000 × 3 = 4.200.000) esas alınmış; md. 12/3-b hesap dönemi başındaki öz sermayeyi
        esas alır.
      B: 'Hem dönem sonu öz sermayesi kullanılmış hem de gayrinakdi teminatlı kredi borca katılmıştır: 4.300.000 − 4.200.000.'
      D: 'Gayrinakdi teminat karşılığı üçüncü kişiden alınan kredi borca katılmıştır: 4.300.000 − 3.000.000.'
      E: 'Öz sermayenin üç katı yerine bir katı ile karşılaştırma yapılmıştır: 3.500.000 − 1.000.000.'
    hesap_adimlari:
    - Sınır = 3 × 1.000.000 (dönem başı) = 3.000.000
    - Dikkate alınacak borç = 3.500.000 (ipotekli banka kredisi hariç)
    - Örtülü sermaye = 3.500.000 − 3.000.000 = 500.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1, 3-b
    alinti: Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden doğrudan veya dolaylı olarak temin ederek işletmede
      kullandıkları borçların, hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı, ilgili
      hesap dönemi için örtülü sermaye sayılır. … Öz sermaye, kurumun Vergi Usul Kanunu uyarınca tespit edilmiş hesap dönemi
      başındaki öz sermayesini,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/6-a
    alinti: Kurumların ortaklarının veya ortaklarla ilişkili kişilerin sağladığı gayrinakdî teminatlar karşılığında üçüncü
      kişilerden yapılan borçlanmalar.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'sinir = 3 * 1000000

      borc = 3500000

      sonuc = max(0, borc - sinir)'
