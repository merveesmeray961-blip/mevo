- id: YMM-REV-TSV-0042
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: korumalı işyeri indirimi
  tip: hesaplama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan (M) A.Ş., 5378 sayılı Kanuna göre kurulan bir korumalı işyeridir. 2026 yılında zihinsel
    veya ruhsal engelli olup iş gücü piyasasına kazandırılmaları güç olan şu çalışanlara tam yıl çalıştırarak ücret ödemiştir:
    1 numaralı çalışana yıllık brüt 500.000 TL (indirimden ilk kez 2024''te yararlanılmıştır), 2 numaralı çalışana yıllık
    brüt 800.000 TL (indirimden ilk kez 2025''te yararlanılmıştır), 3 numaralı çalışana yıllık brüt 450.000 TL (indirimden
    2021-2025 yıllarında yararlanılmıştır). Kanuni indirim oranı uygulanacak olup asgari ücretin yıllık brüt tutarı 420.000
    TL kabul edilecektir. KVK md. 10/1-h uyarınca 2026 yılında kurum kazancından indirilecek korumalı işyeri indirimi kaç
    TL''dir?'
  secenekler:
    A: '630.000'
    B: '840.000'
    C: 1.130.000
    D: 1.300.000
    E: 1.750.000
  dogru: C
  aciklama:
    dogru_neden: 'Md. 10/1-h''ye göre ücret ödemelerinin yıllık brüt tutarının %100''ü indirilir; indirim her çalışan için
      azami beş yıl uygulanır ve çalışan başına yıllık indirilecek tutar asgari ücretin yıllık brüt tutarının %150''sini (420.000
      × 1,5 = 630.000 TL) aşamaz. 1 numaralı çalışan: 500.000 TL (limit altında); 2 numaralı çalışan: 800.000 TL > 630.000
      TL olduğundan 630.000 TL; 3 numaralı çalışan için 2026 altıncı yıl olduğundan indirim yoktur. Toplam 500.000 + 630.000
      = 1.130.000 TL''dir. Püf noktaları: (1) Önce her çalışanı ayrı ayrı değerlendirin; limit çalışan başınadır. (2) Beş
      yıllık süre dolmuş çalışanı (3 numara) hesaba katmayın. (3) Limit asgari ücretin %100''ü değil %150''sidir.'
    celdiriciler:
      A: 630.000 TL yalnızca 2 numaralı çalışana ait sınırlandırılmış tutardır; 1 numaralı çalışanın 500.000 TL'lik indirimi
        de eklenmelidir.
      B: 840.000 TL, sınırın asgari ücretin yıllık brüt tutarının %100'ü (420.000 TL) alınmasıyla bulunur; oysa Kanun'daki
        sınır %150'dir.
      D: 1.300.000 TL, 2 numaralı çalışan için %150 sınırı uygulanmadan bulunan toplamdır (500.000 + 800.000).
      E: 1.750.000 TL, hem sınırı hem beş yıllık süre kısıtını yok sayarak tüm ücretlerin toplamıdır (500.000 + 800.000 +
        450.000).
    hesap_adimlari:
    - 'Sınır: 420.000 × 1,5 = 630.000 TL'
    - '1 no: 500.000; 2 no: min(800.000; 630.000) = 630.000; 3 no: 0 (6. yıl)'
    - 'Toplam: 500.000 + 630.000 = 1.130.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-h
    alinti: yıllık brüt tutarının % 100’ü oranında korumalı işyeri indirimi (İndirim, her bir engelli çalışan için azami beş
      yıl süre ile uygulanır ve yıllık olarak indirilecek tutar, her bir engelli çalışan için asgari ücretin yıllık brüt tutarının
      % 150’sini aşamaz.)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'siniri=420000*1.5

      e1=min(500000,siniri)

      e2=min(800000,siniri)

      e3=0

      sonuc=e1+e2+e3'
