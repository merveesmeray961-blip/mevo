- id: YMM-REV-TSV-0041
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: yurt dışında mal alım satımı kazancında transfer şartı
  tip: hesaplama
  zorluk: 3
  kok: Hesap dönemi takvim yılı olan, finans sektörü dışındaki ve endüstri bölgesi ile İstanbul Finans Merkezi dışında faaliyet
    gösteren (K) A.Ş., 2026 yılında yurt dışından satın aldığı malları Türkiye'ye getirmeksizin yurt dışındaki müşterilerine
    satmıştır. Bu faaliyetten hasılat 9.000.000 TL, maliyet 7.500.000 TL, ilgili giderler 300.000 TL'dir. Doğan kazancın 900.000
    TL'si kurumlar vergisi beyannamesinin verilmesi gereken tarihe kadar, kalan kısmı ise bu tarihten sonra Türkiye'ye transfer
    edilmiştir. Şirketin ayrıca kasadaki nakdin değerlendirilmesinden 80.000 TL faiz geliri vardır. Kurum kazancı yeterli
    olduğuna göre, KVK md. 10/1-i uyarınca 2026 yılında kurum kazancından indirilecek tutar kaç TL'dir?
  secenekler:
    A: '285.000'
    B: '855.000'
    C: '900.000'
    D: 1.140.000
    E: 1.200.000
  dogru: B
  aciklama:
    dogru_neden: 'Faaliyet kazancı 9.000.000 − 7.500.000 − 300.000 = 1.200.000 TL''dir. Md. 10/1-i''ye göre indirim oranı
      bu kurum için %95''tir ve kazancın beyanname verme süresine kadar Türkiye''ye transfer edilmeyen kısmı, sonradan transfer
      edilse dahi indirime konu olmaz. İndirim = 900.000 × %95 = 855.000 TL''dir. Faiz geliri indirime konu faaliyet dışı
      gelirdir ve hesaba katılmaz. Püf noktaları: (1) İndirim, kazanç üzerinden hesaplanır; hasılat üzerinden değil. (2) Oran
      uygulanmadan önce yalnızca süresinde transfer edilen kısmı seçin. (3) Faiz ve kur farkı gibi diğer gelirler soruyu şaşırtmak
      içindir.'
    celdiriciler:
      A: 285.000 TL, süresinde transfer edilmeyen 300.000 TL'nin %95'idir; indirime konu olan kısım ise transfer edilen kısımdır.
      C: 900.000 TL, süresinde transfer edilen kazancın kendisidir; oran (%95) uygulanmadan indirim bulunamaz.
      D: 1.140.000 TL, transfer şartı dikkate alınmadan toplam kazancın %95'idir; oysa transfer edilmeyen kısım indirim dışıdır.
      E: 1.200.000 TL, kazancın tamamıdır; hem transfer şartı hem %95 oranı göz ardı edilmiştir.
    hesap_adimlari:
    - 'Kazanç: 9.000.000 − 7.500.000 − 300.000 = 1.200.000 TL'
    - 'Süresinde transfer edilen kısım: 900.000 TL'
    - 'İndirim: 900.000 × 0,95 = 855.000 TL'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-i
    alinti: Bu indirimden yararlanılabilmesi için kazancın elde edildiği hesap dönemine ilişkin yıllık kurumlar vergisi beyannamesinin
      verilmesi gereken tarihe kadar Türkiye’ye transfer edilmiş olması, aracılık faaliyetine ilişkin malların satıcısı ve
      alıcısının Türkiye’de olmaması şarttır.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 10.7.1
    alinti: bu kazançların kurumlar vergisi beyannamesinin verilme süresinin sonuna kadar Türkiye’ye transfer edilmeyen kısmı
      için indirimden yararlanılmayacaktır.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 10.7.2.3
    alinti: Söz konusu indirimden yararlanan şirketlerin indirime konu faaliyetleri dışındaki diğer gelirleri (kasadaki nakitlerin
      değerlendirilmesi sonucu oluşan faiz gelirleri, dövizlerin değerlemesinden kaynaklanan kur farkları ve iktisadi kıymetlerin
      elden çıkarılmasından doğan gelirler gibi) ile olağan dışı gelirlerinin indirim kapsamında değerlendirilmesi mümkün
      değildir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'kazanc=9000000-7500000-300000

      transfer=900000

      sonuc=transfer*0.95'
  durum: taslak
  surum: 1
