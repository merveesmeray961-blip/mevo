- id: YMM-REV-ULU-0006
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: çifte vergilendirmeyi önleme anlaşmalarının uygulanması
  tip: kavrama
  zorluk: 2
  kok: 'Türkiye''de iş yeri bulunmayan dar mükellef kurumlara 2026 yılında yapılan ödemelerle ilgili aşağıdaki durumlarda,
    ilgili çifte vergilendirmeyi önleme anlaşmasından (ÇVÖA) yararlanma şartlarının sağlandığı kabul edilmektedir:


    I. Gayrimaddi hak bedeli: iç mevzuattaki kesinti oranı %20, ÇVÖA''daki kaynak ülke oranı sınırı %10; kesinti %10 oranında
    yapılır.

    II. Ticari alacak faizi: iç mevzuattaki kesinti oranı %10, ÇVÖA''daki kaynak ülke oranı sınırı %15; anlaşma özel hüküm
    olduğundan kesinti %15 oranında yapılır.

    III. İç mevzuata göre Türkiye''de elde edilmiş sayılmayan bir kazanç için ÇVÖA kaynak ülkeye vergileme hakkı tanımaktadır;
    bu kazanç üzerinden Türkiye''de vergi kesintisi yapılmaz.


    Yukarıdaki değerlendirmelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 35/3 uluslararası anlaşma hükümlerini saklı tutar. Anlaşma, iç mevzuatın doğurduğu vergiyi sınırlar
      veya kaldırır; vergi doğurmaz. Bu nedenle iç mevzuat ile anlaşma oranından düşük olanı uygulanır: I''de %10 doğrudur.
      II''de iç mevzuat oranı (%10) anlaşma sınırından düşük olduğundan %15 uygulanamaz. III''te iç mevzuatta vergi doğmadığından
      anlaşmanın vergileme hakkı tanıması vergi yaratmaz.'
    celdiriciler:
      A: III de doğrudur; anlaşma iç mevzuatta olmayan vergiyi doğurmaz.
      B: II yanlıştır; anlaşmadaki oran üst sınırdır, iç mevzuattaki daha düşük oranı yükseltmez.
      C: II yanlış olduğu için bu seçenek hatalıdır.
