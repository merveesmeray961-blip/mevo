  kok: 'KDV mükellefi (U) A.Ş.''nin 2026 yılında Türkiye''de ikametgâhı, iş yeri, kanuni merkezi ve iş merkezi bulunmayan
    yabancı firmalarla yaptığı işlemler şunlardır (hiçbiri KDV''den istisna değildir):


    I. Almanya''daki fuarda (U) A.Ş.''nin standını kuran Alman firmasına ödenen stand kurulum bedeli

    II. ABD''li bir firmanın yurt dışından verdiği ve (U) A.Ş.''nin Türkiye''deki fabrikasının üretim planlamasında kullanılan
    danışmanlık hizmeti bedeli

    III. İngiliz bir firmadan satın alınarak gümrükte serbest dolaşıma sokulan makinenin bedeli

    IV. Fransız bir firmanın teknisyenlerinin Türkiye''ye gelerek (U) A.Ş.''nin fabrikasında yaptığı makine montajının bedeli


    Bu işlemlerden hangilerine ilişkin KDV, (U) A.Ş. tarafından sorumlu sıfatıyla 2 No.lu KDV Beyannamesi ile beyan edilir?'
  secenekler:
    A: I ve II
    B: II ve III
    C: II ve IV
    D: I, II ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I: Hizmet yurt dışında yapılmış ve yurt dışında faydalanılmıştır (fuar standı Almanya''dadır); KDV Genel
      Uygulama Tebliği''ne göre mükellef veya sorumlu sıfatıyla KDV beyan edilmez. II: Hizmetten Türkiye''de faydalanılmıştır
      (KDVK md. 6/b); sorumlu sıfatıyla beyan edilir. III: Mal ithalidir; KDV ithalde gümrük idaresince alınır (KDVK md. 1/2),
      2 No.lu beyannameye konu olmaz. IV: Hizmet Türkiye''de yapılmıştır; hizmeti verenin Türkiye''de iş yeri bulunmadığından
      KDV sorumlu sıfatıyla beyan edilir. Püf noktaları: Ölçüt hizmetin Türkiye''de yapılması veya Türkiye''de faydalanılmasıdır;
      ödeme Türkiye''den yapılsa bile yurt dışında yapılıp yurt dışında tüketilen hizmet KDV''ye girmez, mal ithalatı ise
      sorumlu KDV''ye değil ithal KDV''sine tabidir.'
    celdiriciler:
      A: I'deki stand hizmetinden yurt dışında faydalanılmıştır; IV ise kapsamdadır.
      B: III'teki makine ithalinde KDV gümrükte alınır; IV'teki Türkiye'de yapılan montaj dışarıda bırakılmıştır.
      D: I yurt dışında yapılıp yurt dışında faydalanılan hizmettir; sorumlu sıfatıyla KDV doğmaz.
