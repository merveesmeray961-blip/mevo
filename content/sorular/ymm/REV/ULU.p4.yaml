- id: YMM-REV-ULU-0005
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: KVK md.30 ve GVK md.94 vergi kesintisi
  tip: hesaplama
  zorluk: 2
  kok: (D) A.Ş., Türkiye'de iş yeri ve daimi temsilcisi bulunmayan ve Türkiye ile çifte vergilendirmeyi önleme anlaşması olmayan
    bir ülkede kurulu bir şirketten Haziran 2026'da mühendislik danışmanlığı (serbest meslek) hizmeti almıştır. Sözleşmeye
    göre karşı tarafa net 800.000 TL ödenecek, Türkiye'deki vergiyi (D) A.Ş. üstlenecektir. Kazancın Türkiye'de elde edildiği
    kabul edilmektedir; serbest meslek kazancına uygulanacak kesinti oranı %20'dir. (D) A.Ş.'nin yapması gereken kurumlar
    vergisi kesintisi kaç TL'dir?
  secenekler:
    A: 120.000 TL
    B: 150.000 TL
    C: 160.000 TL
    D: 200.000 TL
    E: 250.000 TL
  dogru: D
  aciklama:
    dogru_neden: KVK md. 30/11'e göre kesilmesi gereken vergi ödemeyi yapan tarafından üstlenilirse kesinti, fiilen ödenen
      tutar ile üstlenilen verginin toplamı üzerinden hesaplanır. Brüt bedel = 800.000 / (1 − 0,20) = 1.000.000 TL; kesinti
      = 1.000.000 × %20 = 200.000 TL.
    celdiriciler:
      A: Kanundaki %15 oranı net tutara uygulanmıştır; hem oran hem matrah hatalıdır.
      B: Brüt tutara Kanundaki %15 oranı uygulanmıştır; serbest meslek kazancı için Kararla belirlenen oran %20'dir.
      C: Brütleştirme yapılmadan net tutara %20 uygulanmıştır.
      E: Kurumlar vergisi oranı (%25) kesinti oranı yerine kullanılmıştır.
    hesap_adimlari:
    - Brüt = 800.000 / 0,80 = 1.000.000 TL
    - Kesinti = 1.000.000 × 0,20 = 200.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/11
    alinti: Kesilmesi gereken verginin ödemeyi yapan tarafından üstlenilmesi halinde vergi kesintisi, fiilen ödenen tutar
      ile ödemeyi yapanın yüklendiği verginin toplamı üzerinden hesaplanır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
