      hâlinde Türkiye'de elde edilmiş sayılır. Maddenin son fıkrasına göre değerlendirme, ödemenin Türkiye'de yapılması veya
      ödeme yurt dışında yapılmışsa Türkiye'de ödeyenin hesaplarına intikal ettirilmesidir. Gider kaydı bu şartı gerçekleştirir
      (KVK md. 3/4 bu hükmü dar mükellef kurumlara uygular).
    celdiriciler:
      A: Ödemenin yurt dışında yapılması tek başına sonucu değiştirmez; hesaplara intikal değerlendirme sayılır.
      B: İfa ve değerlendirme şartları 'veya' ile bağlanmıştır; birinin gerçekleşmesi yeterlidir.
      C: Serbest meslek kazancında ifa yerinin yanında değerlendirme ölçütü de vardır.
