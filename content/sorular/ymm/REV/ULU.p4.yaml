  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: dar mükellef kurumların vergilendirilmesi
  tip: uygulama
  zorluk: 1
  kok: (A) A.Ş., Almanya'da kurulu ve Türkiye'de iş yeri veya daimi temsilcisi bulunmayan (G) GmbH'den 2026 yılında satış
    sözleşmesi Almanya'da imzalanan 5.000.000 TL tutarında hammadde ithal etmiş ve bedelini ödemiştir. Bu ödeme bakımından
    (G) GmbH'nin Türkiye'deki vergilendirilmesine ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: İş yeri veya daimi temsilci bulunmadığından ticari kazanç Türkiye'de elde edilmiş sayılmaz; ödemeden kesinti yapılmaz.
    B: Mal bedeli Türkiye'de ödendiğinden değerlendirme şartı gerçekleşir; ödemeden %20 oranında kurumlar vergisi kesintisi
      yapılır.
    C: Ödeme ticari kazanç niteliğinde olduğundan %15 oranında kesinti yapılır ve muhtasar beyanname ile bildirilir.
    D: (G) GmbH dar mükellef olarak bu satış kazancı için Türkiye'de yıllık kurumlar vergisi beyannamesi vermek zorundadır.
    E: Kesinti yapılmaz; ancak (A) A.Ş., ödediği bedelin %25'i üzerinden sorumlu sıfatıyla kurumlar vergisi beyan eder.
  dogru: A
  aciklama:
    dogru_neden: KVK md. 3/3-a ve GVK md. 7/1'e göre dar mükellefin ticari kazancının Türkiye'de elde edilmiş sayılması için
      Türkiye'de iş yeri veya daimi temsilci bulunması ve kazancın bunlar aracılığıyla sağlanması gerekir. (G) GmbH'nin Türkiye'de
      iş yeri yoktur; mal satış kazancı Türkiye'de vergilenmez. Mal bedeli KVK md. 30/1'de sayılan kesintiye tabi ödemelerden
      de değildir.
    celdiriciler:
      B: Değerlendirme ölçütü (GVK md. 7 son fıkra) ücret, serbest meslek, GMSİ ve diğer kazançlar için geçerlidir; ticari
        kazanca uygulanmaz.
      C: KVK md. 30/1 ticari kazancı kesintiye tabi kazançlar arasında saymaz.
      D: Türkiye'de elde edilmiş kazanç bulunmadığından beyan yükümlülüğü doğmaz.
      E: Kanunda bu nitelikte bir sorumlu sıfatıyla kurumlar vergisi beyanı öngörülmemiştir.
