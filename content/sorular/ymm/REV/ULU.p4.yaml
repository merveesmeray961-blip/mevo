  konu: ULU
  kazanim: dar mükellef kurumların vergilendirilmesi
  tip: uygulama
  zorluk: 1
  kok: İstanbul'daki (B) A.Ş., Türkiye'de iş yeri ve daimi temsilcisi bulunmayan, ABD'de kurulu (H) Inc.'den pazar araştırması
    hizmeti almıştır. Hizmetin tamamı ABD'de ifa edilmiş, bedel ABD'deki bankaya ödenmiş ve (B) A.Ş.'nin kayıtlarına 760 Pazarlama
    Satış ve Dağıtım Giderleri olarak alınmıştır. Bu serbest meslek kazancının Türkiye'de elde edilip edilmediğine ilişkin
    olarak, çifte vergilendirmeyi önleme anlaşması hükümleri dikkate alınmaksızın aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Hizmet yurt dışında ifa edildiğinden ve ödeme yurt dışında yapıldığından kazanç Türkiye'de elde edilmiş sayılmaz.
    B: Kazancın Türkiye'de elde edilmiş sayılması için hizmetin hem Türkiye'de ifa edilmesi hem de Türkiye'de ödenmesi gerekir.
    C: Serbest meslek kazancında yalnız ifa yeri esas alındığından kazanç ABD'de elde edilmiş sayılır.
    D: Kazanç ancak (H) Inc.'in Türkiye'de daimi temsilci bulundurması hâlinde Türkiye'de elde edilmiş sayılır.
    E: Bedel ödeyenin Türkiye'deki hesaplarına intikal ettiğinden kazanç Türkiye'de değerlendirilmiş sayılır.
  dogru: E
  aciklama:
