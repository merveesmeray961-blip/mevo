      ve KDV doğmaz.
    B: Kazanç Türkiye'de değerlendirildiğinden 200.000 TL kurumlar vergisi kesintisi yapılır; anlaşma yalnız yurt dışında
      ödenen verginin mahsubunu sağlar.
    C: Anlaşma nedeniyle kurumlar vergisi kesintisi yapılmaz; KDV de kaynak ülke vergisi sayıldığından anlaşma kapsamında
      beyan edilmez.
    D: Kesinti %10 indirimli oranla 100.000 TL yapılır; 200.000 TL KDV ise ödendiği aydan sonraki dönemin 1 No.lu beyannamesinde
      indirilebilir.
    E: Kesinti yapılmaz; Türkiye'de faydalanılan hizmet için 200.000 TL KDV sorumlu sıfatıyla beyan edilip Mayıs 2026 döneminde
      indirilir.
  dogru: E
  aciklama:
    dogru_neden: 'İç mevzuat: hizmet Kanada''da ifa edilse de bedel Türkiye''de ödenip kayda alındığından kazanç Türkiye''de
      değerlendirilmiş sayılır (GVK md. 7/4). Ancak KVK md. 35/3 uyarınca anlaşma hükmü saklıdır; anlaşma Türkiye''nin vergileme
