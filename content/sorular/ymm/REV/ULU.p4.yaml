  kok: Tam mükellef (T) A.Ş.'nin ortakları, Türkiye'de iş yeri bulunmayan Hollanda mukimi (H) BV (%60) ile tam mükellef gerçek
    kişi Bay Kaya'dır (%40). Genel kurul Mayıs 2026'da 2025 kârından 2.000.000 TL'nin nakden dağıtılmasına, 1.000.000 TL'nin
    sermayeye eklenmesine karar vermiş; dağıtım ortaklık paylarına göre yapılmıştır. (H) BV için ilgili ÇVÖA'da kâr payında
    kaynak ülke vergisi %10 ile sınırlanmış olup anlaşmadan yararlanma şartları sağlanmıştır. İç mevzuattaki kesinti oranı
    her iki ortak için %15'tir. (T) A.Ş.'nin yapması gereken toplam vergi kesintisi kaç TL'dir?
  secenekler:
    A: 200.000 TL
    B: 240.000 TL
    C: 300.000 TL
    D: 360.000 TL
    E: 450.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Sermayeye eklenen 1.000.000 TL kâr dağıtımı sayılmaz (KVK md. 30/3; GVK md. 94/6-b). Nakden dağıtılan 2.000.000
      TL''nin %60''ı (1.200.000 TL) (H) BV''ye: iç oran %15, anlaşma sınırı %10; düşük olan %10 uygulanır → 120.000 TL. %40''ı
      (800.000 TL) tam mükellef gerçek kişiye: GVK md. 94/6-b-i, %15 → 120.000 TL. Toplam 240.000 TL. Püf noktaları: Anlaşma
      oranı yalnız dar mükellef ortağa uygulanır; tam mükellef gerçek kişi ortağın kâr payı GVK md. 94 ile tevkifata tabidir
      ve sermayeye ekleme her iki ortak için de matraha girmez.'
    celdiriciler:
      A: Anlaşmadaki %10 oran tam mükellef gerçek kişi ortağa da uygulanmıştır.
      C: Dar mükellef ortak için de iç mevzuattaki %15 oran uygulanmış; anlaşma sınırı göz ardı edilmiştir.
      D: Sermayeye eklenen kâr da paylara göre dağıtılmış sayılmıştır (1.800.000 × %10 + 1.200.000 × %15).
      E: Sermayeye eklenen kısım dahil 3.000.000 TL'ye %15 uygulanmıştır.
