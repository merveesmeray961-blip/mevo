  kok: KDV mükellefi (V) A.Ş., Türkiye'de iş yeri ve sabit yeri bulunmayan Kanada mukimi (Y) Ltd.'den, Türkiye'de kuracağı
    fabrikanın projesi için mühendislik hizmeti almıştır. Hizmetin tamamı Kanada'da ifa edilmiş, 1.000.000 TL bedel Mayıs
    2026'da ödenerek (V) A.Ş.'nin kayıtlarına alınmıştır. İlgili ÇVÖA'ya göre bu tür serbest meslek kazancı, Türkiye'de sabit
    yer bulunmadıkça yalnız Kanada'da vergilendirilebilir; anlaşmadan yararlanma şartları sağlanmıştır. İç mevzuatta kesinti
    oranı %20, KDV oranı %20'dir. 2 No.lu beyanname süresinde verilip vergi süresinde ödenecektir. Bu işlem hakkında aşağıdakilerden
    hangisi doğrudur?
  secenekler:
