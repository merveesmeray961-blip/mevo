      KDV, aynı dönemin 1 No.lu beyannamesinde indirilir. Püf noktaları: Kurumlar vergisi ve KDV ayrı ayrı değerlendirilir;
      anlaşma yalnız gelir üzerinden alınan vergiyi sınırlar, KDV''ye etkisi yoktur.'
    celdiriciler:
      A: Değerlendirme şartı gerçekleştiğinden iç mevzuata göre kazanç Türkiye'de elde edilmiştir; KDV de hizmetten Türkiye'de
