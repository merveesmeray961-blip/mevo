- id: YMM-REV-ULU-0003
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: ücret ve kâr payı stopajı
  tip: hesaplama
  zorluk: 1
  kok: Tam mükellef (C) A.Ş.'nin tek ortağı, Türkiye'de iş yeri ve daimi temsilcisi bulunmayan, Fransa'da kurulu (F) SA'dır.
    (C) A.Ş. genel kurulu Mayıs 2026'da 2025 yılı kârından 1.000.000 TL'nin nakden dağıtılmasına, 500.000 TL'nin ise sermayeye
    eklenmesine karar vermiştir. Çifte vergilendirmeyi önleme anlaşması hükümleri dikkate alınmayacaktır. (C) A.Ş.'nin bu
    karar nedeniyle yapması gereken kurumlar vergisi kesintisi kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 75.000 TL
    C: 100.000 TL
    D: 150.000 TL
    E: 225.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 30/3''e göre tam mükellef kurumların dar mükellef kurumlara dağıttığı kâr paylarından kesinti yapılır;
      kârın sermayeye eklenmesi kâr dağıtımı sayılmaz. 9286 sayılı CBK ile 2009/14593 sayılı Kararın 12 numaralı bendindeki
      oran %15''e çıkarılmıştır. Kesinti: 1.000.000 × %15 = 150.000 TL.'
    celdiriciler:
      A: Nakden dağıtılan kâr payı kesintiye tabidir; yalnız sermayeye eklenen kısım dağıtım sayılmaz.
      B: Oran yarıya indirilmiştir; md. 30/4'teki yarı oran yalnız (c) bendi kapsamındaki özel kazançlar için geçerlidir.
      C: '%10, 9286 sayılı CBK öncesindeki orandır.'
      E: Sermayeye eklenen 500.000 TL de matraha katılmıştır (1.500.000 × %15); bu kısım kâr dağıtımı sayılmaz.
    hesap_adimlari:
    - 'Kesinti matrahı: nakden dağıtılan 1.000.000 TL (sermayeye eklenen hariç)'
    - 1.000.000 × 0,15 = 150.000 TL
  kaynaklar:
