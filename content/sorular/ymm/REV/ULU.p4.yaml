  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: KDVK md.9 sorumlu sıfatıyla KDV
  tip: hesaplama
  zorluk: 2
  kok: (M) A.Ş., Türkiye'de iş yeri bulunmayan Hollanda mukimi bir şirkete, Türkiye'de kullanacağı bir yazılımın kullanım
    hakkı (gayrimaddi hak bedeli) için Mart 2026'da net 1.700.000 TL ödemiş ve kesilmesi gereken kurumlar vergisini üstlenmiştir.
    İç mevzuattaki kesinti oranı %20'dir; ÇVÖA'ya göre kaynak ülke vergisi %15 ile sınırlıdır ve anlaşmadan yararlanma şartları
    sağlanmıştır. KDV oranı %20'dir. (M) A.Ş.'nin bu işlem için sorumlu sıfatıyla beyan etmesi gereken KDV kaç TL'dir?
  secenekler:
    A: 0 TL
    B: 300.000 TL
    C: 340.000 TL
    D: 400.000 TL
    E: 425.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Önce kesinti: düşük oran olan %15 uygulanır; vergi üstlenildiğinden brüt bedel = 1.700.000 / 0,85 = 2.000.000
      TL (KVK md. 30/11). KDVK md. 24/b''ye göre vergi, resim, harç gibi unsurlar matraha dahildir; bu nedenle KDV matrahı
      kesinti dahil brüt bedel olan 2.000.000 TL''dir. Hakkın Türkiye''de kullanılması nedeniyle hizmetten Türkiye''de faydalanılmaktadır:
      KDV = 2.000.000 × %20 = 400.000 TL.'
    celdiriciler:
      A: Hizmetten Türkiye'de faydalanıldığından KDV doğar (KDVK md. 6/b, 9/1).
      B: 300.000 TL sorumlu sıfatıyla beyan edilecek KDV değil, kurumlar vergisi kesintisidir.
      C: KDV net ödeme üzerinden hesaplanmıştır; kesilen vergi de matraha dahildir.
      E: Brütleştirme iç mevzuat oranı (%20) ile yapılmıştır (1.700.000 / 0,80 = 2.125.000 TL); anlaşmadaki düşük oran esas
        alınmalıdır.
    hesap_adimlari:
    - 'Uygulanacak kesinti oranı: min(%20, %15) = %15'
    - Brüt = 1.700.000 / 0,85 = 2.000.000 TL
    - KDV = 2.000.000 × 0,20 = 400.000 TL
