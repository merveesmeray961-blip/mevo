      D: Hem brütleştirme atlanmış hem de banka kredisi faizine %10 uygulanmıştır (80.000 + 120.000 + 30.000).
      E: Yabancı banka kredisi faizine %10 kesinti uygulanmıştır (100.000 + 120.000 + 30.000).
    hesap_adimlari:
