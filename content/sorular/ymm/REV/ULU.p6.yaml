      bunları yalnızca Türkiye'de elde ettikleri kazançlar üzerinden vergilendirir.
    celdiriciler:
      B: Dar mükellefiyet için iki merkezin birden Türkiye dışında olması gerekir; iş merkezi Türkiye'de ise kurum, kanunî
        merkezi yurt dışında olsa da tam mükelleftir (md. 3/1).
      C: Anlatılan, iş merkezi değil kanunî merkezdir (md. 3/5); iş merkezi, işlemlerin fiilen toplandığı ve yönetildiği merkezdir
        (md. 3/6).
      D: Türkiye dışında elde edilen kazançlar üzerinden vergilendirme tam mükellefiyetin özelliğidir (md. 3/1); dar mükellefiyet
        yalnızca Türkiye'de elde edilen kazançları kapsar.
      E: Dar mükellefiyette kurum kazancı ticari kazançla sınırlı değildir; zirai kazanç, serbest meslek kazancı, kira, menkul
        sermaye iradı ve diğer kazanç ve iratlar da kurum kazancını oluşturur (md. 3/3).
