  kok: 5520 sayılı KVK md. 3 hükümlerine göre dar mükellefiyete ilişkin aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Kanunî ve iş merkezleri Türkiye'de olmayan kurumlar, sadece Türkiye'deki kazançlarıyla vergilendirilir.
    B: Kanunî merkezi Türkiye'de bulunmayan her kurum, iş merkezi nerede olursa olsun dar mükelleftir.
    C: İş merkezi, kurumun ana sözleşmesinde veya kuruluş kanununda gösterilen merkezdir.
    D: Dar mükellef kurumlar, Türkiye dışında elde ettikleri kazançlar üzerinden de vergilendirilir.
    E: Dar mükellefiyette kurum kazancı yalnızca Türkiye'deki iş yeri aracılığıyla elde edilen ticari kazançlardan oluşur.
