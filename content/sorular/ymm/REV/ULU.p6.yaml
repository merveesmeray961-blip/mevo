- id: YMM-REV-ULU-0017
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: daimî temsilci
  tip: kavrama
  zorluk: 1
  kok: Aşağıda belirtilen kişilerden hangisi, GVK md. 8 uyarınca başkaca şart aranmaksızın temsil ettiği yabancı kurumun daimî
    temsilcisi **sayılmaz**?
  secenekler:
    A: Yabancı kurumun Türkiye'deki acentesi olarak çalışan Ticaret Kanunu hükümlerine göre acenta durumundaki kişi
    B: Yabancı kurumun tüccar vekili olarak çalışan kişi
    C: Giderlerinin tamamı devamlı olarak yabancı kurum tarafından ödenen kişi
    D: Yabancı kurumun mağazasında, onun hesabına konsinyasyon suretiyle satmak üzere devamlı olarak mal bulunduran kişi
    E: Yalnızca reklam giderlerini devamlı karşılayan, yabancı kurum adına hareket yetkisi olmayan bir danışman
  dogru: E
  aciklama:
    dogru_neden: GVK md. 8/3'e göre temsil edilene ait reklam giderleri hariç olmak üzere giderleri devamlı olarak kısmen
      veya tamamen temsil edilen tarafından ödenenler daimî temsilci sayılır. Yalnızca reklam giderlerinin karşılanması bu
      sayma kuralını işletmez; bu kişi (hizmet veya vekâlet akdiyle bağlı olup yabancı kurum adına ticari muameleler yapmaya
      yetkili de değilse) daimî temsilci değildir.
    celdiriciler:
      A: Ticaret Kanunu hükümlerine göre acenta durumunda bulunanlar başkaca şart aranmaksızın daimî temsilci sayılır (GVK
        md. 8/3, bent 1).
      B: Ticari mümessiller, tüccar vekilleri ve memurları başkaca şart aranmaksızın daimî temsilci sayılır (GVK md. 8/3,
        bent 1).
      C: Temsil edilene ait reklam giderleri dışındaki giderleri devamlı olarak temsil edilen tarafından ödenenler daimî temsilci
        sayılır (GVK md. 8/3, bent 2).
      D: Mağaza veya depolarında temsil edilen hesabına konsinyasyon suretiyle satmak üzere devamlı olarak mal bulunduranlar
        daimî temsilci sayılır (GVK md. 8/3, bent 3).
  kaynaklar:
