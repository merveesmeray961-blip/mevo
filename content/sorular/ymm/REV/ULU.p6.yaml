- id: YMM-REV-ULU-0027
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: dar mükellefiyette indirilemeyecek giderler
  tip: hesaplama
  zorluk: 3
  kok: 'Yabancı bir kurumun Türkiye''deki şubesi (dar mükellef) 2026 yılı kurum kazancını belirlerken ana merkez ve yurt dışı
    şubelerle ilgili şu tutarları gider yazmıştır: ana merkezin genel yönetim giderlerine katılmak üzere ayrılan pay 900.000
    TL (bunun 400.000 TL''si Türkiye''deki kazancın elde edilmesi ve idamesiyle ilgilidir ve emsallere uygunluk ilkesine göre
    belirlenen dağıtım anahtarıyla hesaplanmıştır); ana merkez hesabına yapılan alım-satımlar için ana merkeze verilen faiz
    100.000 TL; ana merkezin ve diğer şubelerin zararlarına katılmak üzere ayrılan pay 150.000 TL; Türkiye''deki şubenin denetimi
    için ana merkezden gönderilen yetkili kişilerin seyahat giderleri 50.000 TL. KVK md. 22/3 uyarınca bu tutarlardan kurum
    kazancının tespitinde indirilemeyecek toplam tutar kaç TL''dir?'
  secenekler:
    A: '600.000'
    B: '650.000'
    C: '750.000'
    D: '800.000'
    E: 1.150.000
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 22/3-(a) uyarınca ana merkez veya yurt dışı şubelere alım-satımlar için verilen faiz, komisyon ve
      benzerleri indirilemez (100.000 TL). Md. 22/3-(b) uyarınca ana merkez ve yurt dışı şubelerin genel yönetim giderlerine
      veya zararlarına katılmak üzere ayrılan paylar indirilemez; ancak Türkiye''deki kazancın elde edilmesi ve idamesiyle
      ilgili olan ve emsallere uygunluk ilkesine göre belirlenen dağıtım anahtarıyla ayrılan paylar ile denetim için gönderilen
      yetkililerin seyahat giderleri indirilebilir. İndirilemeyecek tutar = (900.000 − 400.000) + 100.000 + 150.000 = 750.000
      TL; seyahat gideri (50.000 TL) indirilebilir. Püf noktaları: 900.000 TL''nin tamamı değil yalnızca emsallere uygun anahtarla
      belirlenen ve kazançla ilgili 400.000 TL''lik kısmı indirilebilir; zarara katılma payının tamamı ise indirilemez.'
    celdiriciler:
      A: Bu tutar, zararlara katılma payının (150.000 TL) unutulmasıyla bulunur; (b) bendi zarara katılma paylarını da kapsar.
      B: Bu tutar, ana merkeze verilen faizin (100.000 TL) unutulmasıyla bulunur; (a) bendi bu faizin indirimini kabul etmez.
      D: Bu tutar, indirilebilir nitelikteki 50.000 TL'lik denetim seyahat giderinin de indirilemeyen tutara eklenmesiyle
        bulunur; bu giderler md. 22/3-(b) kapsamında hariç tutulmuştur.
      E: Bu tutar, 900.000 TL genel yönetim payının tamamının indirilemeyeceği varsayımıyla bulunur; kazançla ilgili ve dağıtım
        anahtarı emsallere uygun olan 400.000 TL indirilebilir.
    hesap_adimlari:
    - 'İndirilemeyen genel yönetim payı: 900.000 − 400.000 = 500.000 TL.'
    - 'Ana merkeze verilen faiz: 100.000 TL; zarara katılma payı: 150.000 TL.'
    - Toplam = 500.000 + 100.000 + 150.000 = 750.000 TL; seyahat gideri (50.000 TL) indirilebilir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 22/3-a
    alinti: a) Bu kurumlar hesabına yaptıkları alım-satımlar için ana merkeze veya Türkiye dışındaki şubelere verilen faizler,
      komisyonlar ve benzerleri.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 22/3-b
    alinti: b) Türkiye’deki kurumun kazancının elde edilmesi ve idamesi ile ilgili olan ve emsallere uygunluk ilkesi uyarınca
      belirlenecek dağıtım anahtarlarına göre ayrılan paylar ile Türkiye’deki kurumun denetimi için yabancı ülkelerden gönderilen
      yetkili kişilerin seyahat giderleri hariç olmak üzere, ana merkezin veya Türkiye dışındaki şubelerin genel yönetim giderlerine
      veya zararlarına katılmak üzere ayrılan paylar.
