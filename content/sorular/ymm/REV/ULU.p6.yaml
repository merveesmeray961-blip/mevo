    madde: md. 8
    alinti: 'Aşağıda yazılı kimseler, başkaca şartlar aranmaksızın temsil edilenin daimi temsilcisi sayılırlar. 1. Ticari
      mümessiller, tüccar vekilleri ve memurları ile Ticaret Kanununun hükümlerine göre acenta durumunda bulunanlar; 2. (Değişik:
