- id: YMM-REV-ULU-0020
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: kesinti yoluyla vergilendirilen kazançların beyanı
  tip: kavrama
  zorluk: 3
  kok: 'Dar mükellef kurumların KVK md. 30 kapsamında kesinti yoluyla vergilendirilen kazanç ve iratlarının beyanı konusunda
    aşağıdaki ifadeler veriliyor:


    I. Serbest meslek kazançları için yıllık beyanname verilmesi ihtiyaridir.

    II. Gelir Vergisi Kanunu md. 75/2''nin (5), (7) ve (14) numaralı bentlerinde yer alan menkul sermaye iratlarının verilecek
    beyannamelere dahil edilmesi zorunludur.

    III. Hakediş ödemeleri üzerinden kesinti yapılan, birden fazla takvim yılına yaygın inşaat ve onarım işlerinden elde edilen
    kazançların beyanı zorunludur.

    IV. Gayrimenkul sermaye iratları için, kesinti yapılmış olsa dahi beyanname verilmesi zorunludur.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, II ve III
    B: Yalnız I
    C: I ve II
    D: II, III ve IV
    E: I, II ve IV
  dogru: A
  aciklama:
    dogru_neden: 'KVK md. 30/9''a göre ticari ve zirai kazançlar hariç, kesinti yoluyla vergilendirilen kazanç ve iratlar
      için beyanname verilmesi ihtiyaridir; serbest meslek kazançları ve gayrimenkul sermaye iratları bu kuraldadır (I doğru,
      IV yanlış). Aynı fıkra, GVK md. 75/2''nin (5), (7) ve (14) numaralı bentlerindeki menkul sermaye iratlarının beyana
      dahil edilmesini zorunlu kılar (II doğru). Hakediş kesintisi yapılan yıllara yaygın inşaat kazançlarının beyanı da Tebliğ
      30.6''ya göre zorunludur (III doğru). Püf noktaları: "Kesinti yoluyla vergilenen her kazanç ihtiyaridir" kuralının iki
      istisnasını (md. 75/2 (5), (7), (14) iratları ile hakediş kesintisine tabi inşaat kazançları) birlikte hatırlayın; ihtiyari/zorunlu
      ayrımında en sık yapılan hata, inşaat kazancını serbest meslek ve kira gibi ihtiyari gruba katmaktır.'
    celdiriciler:
      B: II ve III de doğru olduğundan yalnız I demek eksik bir cevaptır.
      C: 'III de doğrudur: hakediş kesintisi yapılan yıllara yaygın inşaat kazançlarının beyanı zorunludur; bu nedenle "I
        ve II" eksiktir.'
      D: 'IV yanlıştır: kesinti yoluyla vergilendirilen gayrimenkul sermaye iratları için beyanname verilmesi ihtiyaridir;
        I de doğru olduğundan I''i dışlayan seçenek geçersizdir.'
      E: 'IV yanlıştır: kesinti yoluyla vergilendirilen gayrimenkul sermaye iratları için beyanname verilmesi ihtiyaridir;
        III de doğrudur.'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 30/9
    alinti: Ticari ve zirai kazançlar hariç olmak üzere bu maddeye göre vergisi kesinti yoluyla alınan kazanç ve iratlar için
      Kanunun 24 veya 26 ncı maddelerine göre beyanname verilmesi veya bu madde kapsamına girmeyen kazanç ve iratlar için
      verilecek beyannamelere söz konusu kazanç ve iratların dahil edilmesi ihtiyaridir.
