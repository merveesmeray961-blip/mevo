- id: YMM-REV-ULU-0019
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: serbest meslek kazançlarında vergi kesintisi
  tip: kavrama
  zorluk: 2
  kok: 'Dar mükellef kurumların elde ettiği serbest meslek kazançlarından KVK md. 30 uyarınca vergi kesintisi yapılmasına
    ilişkin aşağıdaki ifadeler veriliyor:


    I. Türkiye''de iş yeri veya daimî temsilcisi bulunmayan yabancı kurumun Türkiye''de icra ettiği serbest meslek faaliyeti
    bedelinden kesinti yapılmaz.

    II. Türkiye''de iş yeri bulunduran yabancı kurumun, bu iş yeri vasıtasıyla yürüttüğü ticari faaliyet kapsamında elde ettiği
    serbest meslek kazancı üzerinden md. 30 uyarınca kesinti yapılmaz.

    III. Türkiye''de iş yeri bulunan yabancı kurumun, bu iş yerindeki ticari faaliyetle bağlantısı olmayan serbest meslek
    kazancı üzerinden kesinti yapılır.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: Tebliğ 30.3'e göre Türkiye'deki iş yeri veya daimî temsilci vasıtasıyla yürütülen ticari faaliyet kapsamında
      elde edilen serbest meslek kazançları ticari kazanç olarak değerlendirildiğinden bunlardan md. 30 kesintisi yapılmaz
      (II doğru). Buna karşılık iş yeri veya daimî temsilci hiç bulunmadan ya da bunlarla ilişkili olmaksızın elde edilen
      serbest meslek kazançlarından kesinti yapılır (I yanlış, III doğru).
    celdiriciler:
      A: 'I yanlıştır: İş yeri veya daimî temsilcisi bulunmayan dar mükellefin serbest meslek kazancından kesinti yapılır;
        kesinti dışında kalma yalnızca iş yeri vasıtasıyla elde edilen kazançlar için söz konusudur. II ve III doğru olduğundan
        "yalnız I" geçersizdir.'
      B: I yanlış olduğundan "I ve II" doğru birleşim değildir; III de doğrudur.
      C: I yanlış olduğundan "I ve III" doğru birleşim değildir; II de doğrudur.
      E: I ifadesi yanlış olduğundan üç ifadenin birlikte doğru olduğu söylenemez.
  kaynaklar:
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: Tebliğ 30.3
    alinti: Öte yandan, dar mükellefiyete tabi kurumların, Türkiye’de bir işyeri veya daimi temsilci bulundurmak suretiyle
      yaptıkları ticari ve zirai faaliyet kapsamında, bu işyerleri veya daimi temsilcileri vasıtasıyla elde ettikleri serbest
      meslek kazançları
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: Tebliğ 30.3
    alinti: Ancak, dar mükellefiyete tabi kurumların Türkiye’de bir işyeri veya daimi temsilcisi bulunmadan veya Türkiye’de
      bir işyeri veya daimi temsilci bulunsa da bu işyerlerinde yürüttükleri ticari faaliyetle bağlantılı olmamak suretiyle
      elde ettikleri, serbest meslek kazançlarından
