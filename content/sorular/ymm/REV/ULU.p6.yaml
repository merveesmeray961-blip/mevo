  kok: Tam mükellef (P) A.Ş., 2026 yılında (Z) ülkesindeki iş yerinde elde ettiği 800.000 TL tutarındaki kazancı, kurumlar
    vergisinden istisna edilmeyen bir kazanç olarak Türkiye'de genel sonuç hesaplarına intikal ettirmiştir. (Z) ülkesinde
    bu kazanç üzerinden 280.000 TL vergi ödendiği (o ülkede geçerli oran %35) beyan edilmiş, ancak vergi ödendiğini gösteren
    tasdikli belgeler tarhiyat sırasında ibraz edilememiştir. Türkiye'de bu kazanç üzerinden tarh olunacak kurumlar vergisi
    200.000 TL'dir. Belgelerin tarhiyatın üzerinden bir yıl içinde ibraz edileceği varsayıldığında, tarhiyatın başlangıçta
    ertelenen kısmı kaç TL'dir?
  secenekler:
    A: '0'
    B: '120.000'
    C: '160.000'
    D: '200.000'
    E: '280.000'
  dogru: D
  aciklama:
    dogru_neden: 'KVK md. 33/7''ye göre belgeler tarhiyat sırasında ibraz edilemezse yabancı ülkede ödenen vergi, KVK md.
      32''deki kurumlar vergisi oranını (%25) aşmamak şartıyla o ülkede geçerli oran üzerinden hesaplanır ve tarhiyatın bu
      tutara isabet eden kısmı ertelenir. (Z) ülkesindeki oran %35 olduğundan %25 ile sınırlı kalınır: 800.000 × %25 = 200.000
      TL; Türkiye''de tarh olunan vergi de 200.000 TL olduğundan ertelenen kısım 200.000 TL''dir. Belgeler bir yıl içinde
      ibraz edilirse tarhiyat belgelerdeki kesin tutara göre düzeltilir (md. 33/7). Püf noktaları: Belge yok diye mahsup hakkı
      tamamen kaybolmaz; ertelenen tutar, ülke oranı ile Türkiye''deki kurumlar vergisi oranından küçük olanla sınırlıdır
      ve fiilen ödenen 280.000 TL ile karıştırılmamalıdır.'
    celdiriciler:
      A: Belgelerin ibraz edilememesi mahsup hakkını ortadan kaldırmaz; md. 33/7 uyarınca vergi hesaplanır ve ilgili tarhiyat
        kısmı ertelenir.
      B: Bu tutar kazancın %15'ine karşılık gelir; md. 30 kesinti oranı ile md. 32 kurumlar vergisi oranı karıştırılmıştır.
      C: Bu tutar kazancın %20'sidir; mahsup sınırı md. 33/4 ve 33/7 uyarınca md. 32'deki oran olan %25'tir.
      E: Fiilen ödenen tutar (%35) kurumlar vergisi oranını (%25) aşamayacağından erteleme 280.000 TL olamaz.
    hesap_adimlari:
    - Ülke oranı %35 > md. 32 oranı %25 olduğundan hesaplamada %25 esas alınır.
    - 800.000 × %25 = 200.000 TL.
    - Türkiye'de tarh olunan vergi 200.000 TL olduğundan ertelenen kısım 200.000 TL'dir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 33/7
    alinti: Kurumlar vergisinden indirim konusu yapılan vergilerin yabancı ülkelerde ödendiğini gösterir belgelerin, tarhiyat
