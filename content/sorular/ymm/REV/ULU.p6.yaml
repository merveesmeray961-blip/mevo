- id: YMM-REV-ULU-0018
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: hakediş kesintisi oranları
  tip: hesaplama
  zorluk: 2
  kok: 'Tam mükellef (K) A.Ş., 2026 yılında Türkiye''de iş yeri veya daimî temsilcisi bulunmayan dar mükellef yabancı kurumlara
    aşağıdaki hakediş ödemelerini yapmıştır: şehir içi raylı ulaşım hattı inşaatı (2025–2027 yıllarına yayılan iş) için 3.000.000
    TL; gemi onarım işi (2026–2027 yıllarına yayılan iş) için 2.000.000 TL; fabrika binası inşaatı (2026–2027 yıllarına yayılan
    iş) için 1.000.000 TL; Mart–Kasım 2026''da başlayıp biten, tek takvim yılında tamamlanan bir depo inşaatı için 4.000.000
    TL. (K) A.Ş.''nin bu ödemelerden KVK md. 30 uyarınca yapacağı toplam kurumlar vergisi kesintisi kaç TL''dir?'
  secenekler:
    A: '60.000'
    B: '100.000'
    C: '180.000'
    D: '300.000'
    E: '500.000'
  dogru: B
  aciklama:
    dogru_neden: KVK md. 30/1-(a) yalnızca birden fazla takvim yılına yaygın inşaat ve onarım işlerine ilişkin hakedişlerden
      kesinti öngörür; tek takvim yılında biten depo inşaatı kesinti kapsamında değildir. 9707 sayılı Karar'a göre raylı ulaşım
      sistemleri ile gemi inşaat ve onarım işlerinde oran %1, diğer işlerde %5'tir. Kesinti = 3.000.000 × %1 + 2.000.000 ×
      %1 + 1.000.000 × %5 = 30.000 + 20.000 + 50.000 = 100.000 TL.
    celdiriciler:
      A: Bu tutar, kesintiye konu 6.000.000 TL'nin tamamına %1 uygulanmasıyla bulunur; fabrika binası inşaatı "diğer işler"
        sınıfındadır ve oranı %5'tir.
      C: Bu tutar, 6.000.000 TL'ye değişiklik öncesi oran olan %3'ün uygulanmasıyla bulunur; 9707 sayılı Karar ile oranlar
        %1 ve %5 olarak yeniden belirlenmiştir.
      D: Bu tutar, kesintiye konu 6.000.000 TL'nin tamamına %5 uygulanmasıyla bulunur; raylı ulaşım ve gemi onarım işlerinde
        oran %1'dir.
      E: Bu tutar, tek yılda biten depo inşaatı dahil 10.000.000 TL'ye %5 uygulanmasıyla bulunur; tek takvim yılında biten
        iş hakedişi md. 30/1-(a) kapsamında değildir.
    hesap_adimlari:
    - 'Kesintiye konu işler: raylı ulaşım (3.000.000), gemi onarım (2.000.000), fabrika binası (1.000.000); depo inşaatı kapsam
      dışıdır.'
    - 3.000.000 × %1 = 30.000; 2.000.000 × %1 = 20.000; 1.000.000 × %5 = 50.000.
    - Toplam kesinti = 30.000 + 20.000 + 50.000 = 100.000 TL.
  kaynaklar:
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: Tebliğ 30.4.1
    alinti: Kurumlar Vergisi Kanununun 30 uncu maddesinin birinci fıkrasının (a) bendinde, Gelir Vergisi Kanununda belirtilen
      esaslara göre birden fazla takvim yılına yaygın inşaat ve onarım işleri ile uğraşan dar mükellef kurumlara bu işleriyle
      ilgili olarak yapılan hakediş ödemeleri üzerinden vergi kesintisi yapılması öngörülmüş
  - mevzuat: 9707 sayılı Cumhurbaşkanı Kararı
    madde: md. 3
    alinti: a) Demiryolu hattı, tramvay, finiküler, monoray, metro ve şehir içi raylı ulaşım sistemleri inşaat ve onarım işleri
      dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden %1, b) Gemi inşaat ve onarım işleri dolayısıyla bu işleri
      yapanlara ödenen istihkak bedellerinden %1, c) Diğer işler dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden
      %5,
  gecerlilik:
    baslangic: '2025-04-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 3000000*0.01 + 2000000*0.01 + 1000000*0.05
