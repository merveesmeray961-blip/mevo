- id: YMM-REV-ULU-0026
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Dar mükellefiyet çifte vergilendirme ve vergi kesintisi
  konu: ULU
  kazanim: özel beyan zamanı tayin olunan gelirler
  tip: uygulama
  zorluk: 2
  kok: Türkiye'de iş yeri ve daimî temsilcisi bulunmayan, dar mükellef (R) Ltd., Türkiye'deki bir arsayı 2019 yılında satın
    almış ve 20 Ağustos 2026'da bedelini aynı gün tahsil ederek satmıştır. Arsa, (R) Ltd.'nin ticari bir işletmesine dahil
    bulunmamaktadır. Bu kazançla ilgili aşağıdaki ifadelerden hangisi doğrudur?
  secenekler:
    A: Arsa beş yıldan fazla elde tutulduğundan kazanç vergiye tabi değildir ve beyanname verilmez.
    B: Kazanç vergiye tabidir; beyanname hesap döneminin kapandığı ayı izleyen dördüncü ayın birinci gününden yirmibeşinci
      günü akşamına kadar verilir.
    C: Kazanç vergiye tabidir; beyanname, kazancın elde edildiği ayı izleyen ayın yirmialtıncı günü akşamına kadar muhtasar
      beyanname ile verilir.
    D: Kazanç vergiye tabidir; beyanname, alıcının bağlı olduğu vergi dairesine elde edilme tarihinden itibaren on beş gün
      içinde verilir.
    E: Kazanç vergiye tabidir; beyanname, elde edilmesinden itibaren on beş gün içinde taşınmazın bulunduğu yerin vergi dairesine
      verilir.
  dogru: E
  aciklama:
    dogru_neden: Kurumlar vergisi beyannamesi, taşınmazın elden çıkarılmasından doğan diğer kazanç ve iratlarda KVK md. 27/a
      gereği taşınmazın bulunduğu yerin vergi dairesine verilir. Dar mükellef yabancı kurumun diğer kazançları, elde edilme
      tarihinden itibaren on beş gün içinde beyan edilir (md. 26/1); GVK'daki vergilendirmeme hususundaki istisna, kayıt,
      şart ve sürelere ait sınırlamalar dikkate alınmaz (md. 26/2). Bu nedenle 2019'da alınan arsanın beş yıl geçtikten sonra
      satılması vergilendirmeyi engellemez. Son gün 20 Ağustos + 15 gün = 4 Eylül 2026'dır.
    celdiriciler:
      A: GVK md. 80'deki beş yıllık süre sınırlaması, md. 26/2 gereği dar mükellef kurumlar bakımından dikkate alınmaz; bu
        nedenle kazanç vergiye tabidir.
      B: Bu süre yıllık beyanname içindir; özel beyan zamanı tayin olunan gelirlerde beyanname, elde edilme tarihinden itibaren
        on beş gün içinde verilir (md. 26/1).
      C: Muhtasar beyanname kesinti yapan sorumlularca verilir; diğer kazançlar için dar mükellefin özel beyanı esastır ve
        bu işlemde kesinti öngörülmemiştir.
      D: Taşınmazın elden çıkarılmasından doğan kazançlarda beyanname taşınmazın bulunduğu yerin vergi dairesine verilir (md.
        27/a); alıcının vergi dairesi esas değildir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 26/1
    alinti: Dar mükellefiyete tâbi olan yabancı kurumların vergiye tâbi kazancının Gelir Vergisi Kanununda yazılı diğer kazanç
      ve iratlardan (telif, imtiyaz, ihtira, işletme, ticaret unvanı, marka ve benzeri gayrimaddî hakların satışı, devir ve
      temliki karşılığında alınan bedeller hariç) ibaret bulunması halinde, yabancı kurum veya Türkiye’de adına hareket eden
