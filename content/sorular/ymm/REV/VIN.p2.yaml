- id: YMM-REV-VIN-0018
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: sahte ve muhteviyatı itibarıyla yanıltıcı belge
  tip: kavrama
  zorluk: 3
  kok: 'KDV Genel Uygulama Tebliği''nin (IV/A2) bölümündeki ''sahte belge kullanma'' olumsuz raporu ve tespitine
    ilişkin aşağıdaki ifadeler veriliyor:

    I. Alıcının, sahte olduğu tespit edilen belgedeki tutarı Ba bildirimine dâhil etmiş olması, belgeyi kullandığına
    karinedir; ancak sahte belge kullanma tespiti için tek başına yeterli değildir.

    II. Sahte belge kullanıldığını tespit eden raporda tarhiyat önerilmemiş olması, raporu olumsuz rapor olmaktan
    çıkarır.

    III. Mal ve hizmet alınan mükelleflerin defter ve belgelerini ibraz etmemesi nedeniyle KDV indiriminin reddedildiği
    bir raporda, tarhiyatın bu kısmının sahte belge kullanma fiilinden kaynaklandığı açıkça belirtilmemişse rapor
    olumsuz rapor kapsamında değerlendirilmez.

    IV. Sahte belgeye dayalı KDV indirimini düzeltme beyanıyla indirilecek KDV tutarından düşen mükellefin iade
    taleplerinde, iade hakkı doğuran işlemler için belirlenmiş usul ve esaslar uygulanmaya devam edilir.

    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve III
    B: II ve IV
    C: I, II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 'Tebliğin (IV/A2-3.5) bölümüne göre kullanıcının Ba bildirimine belgedeki tutarı dâhil etmesi kullanıma
      karinedir, ancak tespit için tek başına yeterli değildir (I doğru). (IV/A2-3.4) bölümüne göre tarhiyat önerilmemiş
      olması raporun olumsuz rapor vasfını değiştirmez (II yanlış). Defter ve belge ibraz edilmemesi gibi nedenlerle
      KDV indiriminin reddinden kaynaklanan tarhiyatlarda, bu kısmın sahte belge kullanma fiilinden kaynaklandığı
      açıkça belirtilmemişse rapor olumsuz rapor sayılmaz (III doğru). Sahte belge kullanımına dayalı KDV indirimleri
      vergi inceleme raporuyla veya düzeltme beyanlarıyla indirilecek KDV''den düşülmüşse, iade hakkı doğuran işlemler
      için belirlenmiş usul ve esaslar uygulanmaya devam edilir (IV doğru). Püf noktaları: Olumsuz raporu tarhiyat
      önerisi değil, sahte belgeye dayalı KDV indiriminin reddedilmiş olması belirler. Başka nedenlerle yapılan
      indirim reddi, sahte belge kullanımı açıkça yazılmadıkça mükellefi özel iade rejimine sokmaz.'
    celdiriciler:
      A: 'IV de doğrudur: indirimlerini düzelten mükellef genel iade usulüne devam eder.'
      B: II yanlıştır (tarhiyat önerilmemesi olumsuz rapor vasfını değiştirmez); doğru olan I ve III dışarıda bırakılmıştır.
      C: II yanlış, IV doğrudur.
      E: II yanlıştır; Tebliğ, tarhiyat önerilmemesinin olumsuz rapor vasfını değiştirmediğini açıkça belirtir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.4
    alinti: Tarhiyat önerilmemiş olması bu raporların olumsuz rapor vasfını değiştirmez.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.4
    alinti: gibi nedenlerle KDV indirimlerinin reddinden kaynaklanan tarhiyatlarda, inceleme raporlarında tarhiyatın
      bu tespitlere ilişkin kısmının sahte belge kullanma fiilinden kaynaklandığının açıkça belirtilmemesi halinde,
      düzenlenen rapor olumsuz rapor kapsamında değerlendirilmez.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.4
    alinti: Sahte belge kullanımına dayalı KDV indirimlerinin vergi inceleme raporu ile veya mükellefin düzeltme
      beyanları ile indirilecek KDV tutarlarından düşülmesi durumunda bu mükelleflerin iade taleplerinde iade hakkı
      doğuran işlemler için belirlenmiş usul ve esaslar uygulanmaya devam edilir.
  - mevzuat: KDV Genel Uygulama Tebliği
    madde: IV/A2-3.5
    alinti: Kullanıcının Ba bildirimine söz konusu belgede yazılı tutarı dâhil etmiş olması, sahte belgeyi kullandığına
      karine olup tespit için tek başına yeterli değildir.
