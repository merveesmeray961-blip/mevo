- id: YMM-REV-VIN-0012
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: VUK md.134-141 vergi incelemesi
  tip: bilgi
  zorluk: 1
  kok: VUK md. 140 uyarınca bir katma değer vergisi iade incelemesi için, incelemeye yetkili olanların bağlı olduğu
    birimce verilebilecek azami ek süre de kullanıldığında, incelemenin incelemeye başlanılan tarihten itibaren
    en geç kaç ay içinde bitirilmesi gerekir?
  secenekler:
    A: '3'
    B: '5'
    C: '6'
    D: '9'
    E: '18'
  dogru: B
  aciklama:
    dogru_neden: VUK md. 140/6'ya göre KDV iade incelemelerinin en fazla üç ay içinde bitirilmesi esastır. Bu sürede
      bitirilemezse bağlı olunan birimce iki ayı geçmemek üzere ek süre verilebilir. Azami süre 3 + 2 = 5 aydır.
    celdiriciler:
      A: Üç ay ek süre hariç olağan süredir; soru ek süre dâhil azami süreyi sormaktadır.
      C: Altı ay sınırlı inceleme süresidir; ayrıca tam ve sınırlı incelemelerde verilebilecek ek süre de altı aydır.
      D: KDV iade incelemesine tam ve sınırlı incelemelerdeki altı aylık ek süre uygulanmıştır (3 + 6).
      E: On sekiz ay, tam incelemede bir yıllık süreye altı aylık ek sürenin eklenmesiyle bulunur.
    hesap_adimlari:
    - Olağan süre 3 ay + azami ek süre 2 ay = 5 ay
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 140/6
    alinti: İncelemeye başlanıldığı tarihten itibaren, tam inceleme yapılması halinde en fazla bir yıl, sınırlı
      inceleme yapılması halinde en fazla altı ay, katma değer vergisi iade incelemelerinde ise en fazla üç ay içinde
      incelemeleri bitirmeleri esastır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 140/6
    alinti: tam ve sınırlı incelemelerde altı ayı, katma değer vergisi iade incelemelerinde ise iki ayı geçmemek
      üzere ek süre verilebilir.
