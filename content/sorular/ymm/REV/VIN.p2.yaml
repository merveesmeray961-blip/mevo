- id: YMM-REV-VIN-0011
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: VUK md.134-141 vergi incelemesi
  tip: bilgi
  zorluk: 1
  kok: Vergi incelemesi sırasında, incelemeye yetkili olan tarafından lüzum görülerek işletmeye dâhil iktisadi kıymetlerin
    fiilî envanteri yaptırılmıştır. VUK md. 134'e göre fiilî envanterin yapılmasının gerektirdiği giderler hakkında
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Mükellefçe karşılanır ve kazancın tespitinde gider olarak indirilebilir.
    B: İnceleme sonucunda tarhiyat yapılırsa mükellefe, yapılmazsa Hazineye yüklenir.
    C: Mükellef ile Hazine arasında yarı yarıya paylaştırılır.
    D: Tarh edilecek vergiden, vergi dairesi müdürünün onayıyla mahsup edilir.
    E: İncelemeyi yapanın tasdik ettiği giderler Hazinece mükellefe ödenir.
  dogru: E
  aciklama:
    dogru_neden: VUK md. 134/2'ye göre inceleme, lüzum görüldüğünde işletmeye dâhil iktisadi kıymetlerin fiilî envanterinin
      yapılmasına da teşmil edilebilir. Fiilî envanterin gerektirdiği ve incelemeyi yapan tarafından tasdik edilen
      giderler Hazinece mükellefe ödenir. Ödeme, inceleme sonucuna bağlanmamıştır.
    celdiriciler:
      A: Kanun bu giderleri mükellefe bırakmamış, Hazineye yüklemiştir.
      B: Ödeme, inceleme sonucunda tarhiyat yapılıp yapılmamasına bağlı değildir.
      C: Kanunda paylaştırma öngörülmemiştir; tasdik edilen giderlerin tamamı Hazinece ödenir.
      D: Kanun mahsup değil, Hazinece ödeme öngörür; vergi dairesi müdürü onayı da aranmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 134/2
    alinti: İncelemeye yetkili olanlar tarafından lüzum görüldüğü takdirde inceleme, işletmeye dahil iktisadi kıymetlerin
      fiili envanterinin yapılmasına ve beyannamelerde gösterilmesi gereken unsurların tetkikına da teşmil edilebilir.
      Fiili envanterin yapılmasının gerektirdiği ve incelemeyi yapan tarafından tasdik edilen giderler Hazinece
      mükellefe ödenir.
