  kok: '(M) A.Ş. nezdinde 2026 yılında başlanan vergi incelemesinde 2025 yılına ilişkin şu tespitler yapılmıştır:

    - Gerçek bir alım olmadığı hâlde adına düzenlenen sahte faturalar gider yazılmış ve bu yolla 400.000 TL kurumlar
    vergisi ziyaa uğratılmıştır.

    - Kanunen kabul edilmeyen giderlerin bir kısmı beyannameye eklenmemiş ve bu nedenle 100.000 TL kurumlar vergisi
    ziyaa uğratılmıştır.

    - Şirket, Kasım 2025 dönemi KDV beyannamesini kanuni süresinde vermemiş; beyannameyi incelemeye başlanılmasından
    sonra kendiliğinden vermiştir. Bu beyannamede 200.000 TL ödenecek KDV tahakkuk etmiştir.

    Şirketin mükellefiyet kaydı bulunmaktadır. Pişmanlık, uzlaşma ve ceza indirimi hükümleri uygulanmayacaktır.
    VUK md. 344''e göre şirket adına kesilecek vergi ziyaı cezalarının toplamı kaç TL''dir?'
  secenekler:
    A: '700.000'
    B: 1.400.000
    C: 1.500.000
    D: 1.700.000
    E: 2.100.000
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 344/1''e göre vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır; vergi ziyaına 359''uncu
      maddede yazılı fiillerle sebebiyet verilmişse ceza üç kattır (md. 344/2). Kanuni süresi geçtikten sonra verilen
      beyannameler için ceza %50 oranında uygulanır. Ancak vergi incelemesine başlanılmasından sonra verilen beyannameler
      bu indirimin dışındadır (md. 344/3). Sahte belge kullanımı: 400.000 × 3 = 1.200.000; KKEG eksikliği: 100.000
      × 1 = 100.000; inceleme başladıktan sonra verilen KDV beyannamesi: 200.000 × 1 = 200.000. Toplam 1.500.000
      TL. Püf noktaları: Üç kat ceza yalnız 359''daki fiille ziyaa uğratılan kısma uygulanır; aynı dönemdeki diğer
      matrah farkları bir kattır. Gecikmeli beyanda %50''lik uygulama, beyanname incelemeden önce verilmişse geçerlidir.'
    celdiriciler:
      A: 'Sahte belge kullanımıyla ziyaa uğratılan vergiye de bir kat ceza uygulanmıştır: 400.000 + 100.000 + 200.000.'
      B: İncelemeye başlanıldıktan sonra verilen beyannameye %50 oranı uygulanmıştır (100.000); bu indirim inceleme
        sonrası verilen beyannamelere uygulanmaz.
      D: 'Üç kat ceza, sahte belgeyle ilgisi olmayan KKEG farkına da uygulanmıştır: 1.200.000 + 300.000 + 200.000.'
      E: 'Tüm ziyaa uğratılan vergilere üç kat ceza uygulanmıştır: 700.000 × 3.'
    hesap_adimlari:
    - 'Sahte belge (VUK 359 fiili): 400.000 × 3 = 1.200.000'
    - 'KKEG eksikliği: 100.000 × 1 = 100.000'
    - 'İnceleme sonrası verilen beyanname: 200.000 × 1 = 200.000 (%50 uygulanmaz)'
    - 'Toplam: 1.500.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1-3
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında
      ziyaa uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir. Vergi ziyaına 359 uncu maddede yazılı
      fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak edenlere ise bir kat olarak uygulanır.
      Vergi incelemesine başlanılmasından veya takdir komisyonuna sevk edilmesinden sonra verilenler hariç olmak
      üzere, kanuni süresi geçtikten sonra verilen vergi beyannameleri için bu madde uyarınca kesilecek ceza yüzde
      elli oranında uygulanır.
  gecerlilik:
