- id: YMM-REV-VIN-0014
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: defter ve belge ibrazı
  tip: uygulama
  zorluk: 2
  kok: Nezdinde inceleme yapılan bir mükellef, stok farklarının tespit edildiği inceleme tutanağını imzalamaktan
    çekinmiştir. İnceleme elemanı, tutanakta bahsi geçen olaylara ilişkin defter ve belgeleri mükellefin rızası
    olmaksızın almıştır. İki hafta sonra mükellef, tutanağı imzalayarak defter ve belgelerinin geri verilmesini
    istemiştir. Defter ve belgeler suç delili niteliği taşımamaktadır. VUK md. 141'e göre bu talep hakkında aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Mükellef tutanağı imzaladığından defter ve belgelerini geri alabilir.
    B: Defter ve belgeler, tarh edilen vergiler ve kesilen cezalar kesinleşinceye kadar geri verilmez.
    C: Defter ve belgeler ancak inceleme raporu vergi dairesine tevdi edildikten sonra geri verilebilir.
    D: Tutanak sonradan imzalandığından mükellefin itiraz ve mülahazaları tutanağa geçirilemez.
    E: Defter ve belgelerin geri verilmesi vergi mahkemesinin kararına bağlıdır.
  dogru: A
  aciklama:
    dogru_neden: VUK md. 141/2'ye göre ilgililer tutanakları imzalamaktan çekinirse, tutanakta bahsi geçen olay
      ve hesap durumlarını içeren defter veya vesikalar rızalarına bakılmaksızın alınır ve tarh edilen vergiler
      ile kesilen cezalar kesinleşinceye kadar geri verilmez. Aynı fıkra, ilgililerin bu tutanakları her zaman imzalayarak
      defter ve vesikalarını geri alabileceklerini hükme bağlamıştır. Tek şart defterlerin suç delili olmamasıdır;
      bu şart olayda gerçekleşmiştir.
    celdiriciler:
      B: Kesinleşmeye kadar alıkoyma kuralı tutanak imzalanmadığı sürece geçerlidir; imzalandıktan sonra defterler
        geri alınabilir.
      C: Kanunda inceleme raporunun tevdi edilmesi diye bir şart yoktur.
      D: İtiraz ve mülahazalar md. 141/1 uyarınca tutanağa geçirilir; tutanağın sonradan imzalanması bunu engellemez.
      E: Geri alma, kanunda yargı kararına bağlanmamıştır; tutanağın imzalanması yeterlidir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 141/2
    alinti: İlgililer tutanakları imzalamaktan çekindikleri takdirde tutanakta bahis konusu edilen olaylar ve hesap
      durumlarını ihtiva eden defter veya vesikalar, nezdinde inceleme yapılandan rızasına bakılmaksızın alınır
      ve inceleme neticesinde tarh edilen vergiler ve kesilen cezalar kesinleşinceye kadar geri verilmez. İlgililer
      her zaman bu tutanakları imzalıyarak defter ve vesikaları geri alabilirler. Ancak bu defterlerin suç delili
      olmaması şarttır.
