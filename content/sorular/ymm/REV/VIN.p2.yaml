- id: YMM-REV-VIN-0017
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: defter ve belge ibrazı
  tip: uygulama
  zorluk: 3
  kok: 'Yevmiye ve envanter defterlerinin varlığı noter tasdik kayıtlarıyla sabit olan (N) Ltd. Şti., vergi incelemesinde
    yazıyla istenen bu defterleri haklı bir mazeret göstermeksizin belirtilen sürede ibraz etmemiştir. Bu durumla
    ilgili aşağıdaki ifadeler veriliyor:

    I. Defterlerin ibraz edilmemesi, vergi matrahının re''sen takdirini gerektiren hâllerdendir.

    II. Fiil, VUK md. 359/b''deki defter ve belgeleri yok etme suçunu oluşturur ve üç yıldan sekiz yıla kadar hapis
    cezasını gerektirir.

    III. Bu fiille vergi ziyaına sebebiyet verilirse vergi ziyaı cezası, ziyaa uğratılan verginin üç katı olarak
    uygulanır.

    IV. Şirket haklı bir mazeret göstermiş olsaydı, defterlerini ibraz etmesi için kendisine münasip bir mühlet
    verilecekti.

    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I, III ve IV
    B: I ve III
    C: II ve III
    D: I, II ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'VUK md. 30/3''e göre tutulması zorunlu defterlerin vergi incelemesi yapmaya yetkili olanlara herhangi
      bir sebeple ibraz edilmemesi re''sen takdir sebebidir (I doğru). Md. 359/a''ya göre varlığı noter tasdik kayıtları
      veya sair suretlerle sabit olduğu hâlde defter ve belgelerin incelemede ibraz edilmemesi ''gizleme'' sayılır.
      Bu fiilin cezası 18 aydan 5 yıla kadar hapistir; 359/b''deki yok etme suçu değildir (II yanlış). Ziyaa 359''daki
      fiillerle sebebiyet verilmesi hâlinde vergi ziyaı cezası üç kat uygulanır (md. 344/2; III doğru). Md. 139''a
      göre haklı mazeret gösterenlere ibraz için münasip bir mühlet verilir (IV doğru). Püf noktaları: İbraz etmemenin
      cezai karşılığı ''gizleme''dir ve 359/a''da yer alır. ''Yok etme'' (359/b) daha ağır ceza öngörür; ikisini
      karıştırmayın. Gizleme sayılması için defterin varlığının noter tasdiki gibi bir yolla sabit olması gerekir.'
    celdiriciler:
      B: 'IV de doğrudur: md. 139 haklı mazeret gösterene münasip mühlet verilmesini öngörür.'
      C: II yanlıştır (fiil 359/a'daki gizlemedir); ayrıca doğru olan I dışarıda bırakılmıştır.
      D: II yanlıştır; III ise md. 344/2 uyarınca doğrudur.
      E: 'II yanlıştır: ibraz etmeme gizleme sayılır (359/a, 18 ay–5 yıl); yok etme (359/b) değildir.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 30/3
    alinti: 3. Bu kanuna göre tutulması mecburi olan defterlerin hepsi veya bir kısmı tutulmamış veya tasdik ettirilmemiş
      olursa veya vergi incelenmesi yapmaya yetkili olanlara her hangi bir sebeple ibraz edilmezse,
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/a
    alinti: Hakkında on sekiz aydan beş yıla kadar hapis cezasına hükmolunur. Varlığı noter tasdik kayıtları veya
      sair suretlerle sabit olduğu halde, inceleme sırasında vergi incelemesine yetkili kimselere defter ve belgelerin
      ibraz edilmemesi, bu fıkra hükmünün uygulanmasında gizleme olarak kabul edilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/2
    alinti: Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere
      iştirak edenlere ise bir kat olarak uygulanır.
