- id: YMM-REV-VIN-0013
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: VUK md.134-141 vergi incelemesi
  tip: kavrama
  zorluk: 2
  kok: 'Vergi incelemesinin zamanı ve yeri hakkında aşağıdaki ifadeler veriliyor:

    I. Vergi incelemesine başlanacağının mükellefe önceden haber verilmesi zorunludur.

    II. İnceleme, neticesi alınmamış hesap dönemini de kapsayabilir.

    III. Daha önce incelenmiş ya da matrahı re''sen takdir edilmiş bir dönem, tarh zamanaşımı süresi içinde yeniden
    incelenebilir ve gerekirse ikmal tarhiyatı yapılabilir.

    IV. İnceleme esas itibarıyla mükellefin iş yerinde yapılır; dairede yapılabilmesi için mükellefin talebi aranır.

    VUK md. 138 ve 139''a göre bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I, II ve III
    C: II, III ve IV
    D: II ve III
    E: III ve IV
  dogru: D
  aciklama:
    dogru_neden: VUK md. 138'e göre incelemenin ne zaman yapılacağının önceden haber verilmesi mecburi değildir
      (I yanlış). İnceleme, neticesi alınmamış hesap dönemi de dâhil olmak üzere tarh zamanaşımı süresi sonuna kadar
      her zaman yapılabilir (II doğru). Evvelce inceleme yapılmış veya matrahın re'sen takdir edilmiş olması yeniden
      inceleme yapılmasına ve gerekirse tarhiyatın ikmaline engel değildir (III doğru). 7338 sayılı Kanunla değişik
      md. 139'a göre incelemeler esas itibarıyla dairede yapılır; mükellefin talebi ve iş yerinin müsait olması
      hâlinde iş yerinde de yapılabilir (IV yanlış).
    celdiriciler:
      A: 'I yanlıştır: önceden haber verme zorunlu değildir; doğru olan III de dışarıda bırakılmıştır.'
      B: I yanlıştır; md. 138 önceden haber vermeyi mecburi tutmaz.
      C: 'IV yanlıştır: 2021 değişikliğiyle esas olan dairede incelemedir; mükellef talebi iş yerinde inceleme için
        aranır.'
      E: IV, md. 139'un 7338 sayılı Kanunla değişmeden önceki hâline dayanır; II de doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 138
    alinti: Vergi incelemesinin ne zaman yapılacağının evvelden haber verilmesi mecburi değildir. İnceleme, neticesi
      alınmamış hesap dönemi de dahil olmak üzere, tarh zamanaşımı süresi sonuna kadar her zaman yapılabilir. Evvelce
      inceleme yapılmış veya matrahın re'sen takdir edilmiş olması yeniden inceleme yapılmasına ve gerekirse tarhıyatın
      ikmaline mani değildir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 139
    alinti: Vergi incelemeleri, esas itibariyle dairede yapılır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 139
    alinti: Mükellef ve vergi sorumlusunun talep etmesi ve iş yerinin müsait olması halinde inceleme iş yerinde
      de yapılabilir.
