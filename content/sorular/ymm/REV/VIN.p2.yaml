- id: YMM-REV-VIN-0015
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: sahte ve muhteviyatı itibarıyla yanıltıcı belge
  tip: uygulama
  zorluk: 2
  kok: 'Bir vergi incelemesinde aşağıdaki belgeler tespit edilmiştir:

    I. (K) firmasının, gerçekten yaptığı 200 adet malzeme satışı için 500 adet gösteren fatura düzenlemesi

    II. Hiçbir mal teslimi olmadığı hâlde (L) firması adına düzenlenen ve (L)''nin kayıtlarına alınan fatura

    III. Gerçekte yapılan bir makine onarım hizmeti için, işlemin ''yedek parça satışı'' olarak gösterildiği fatura

    VUK md. 359''daki tanımlara göre bu belgelerin nitelendirmesi aşağıdakilerin hangisinde doğru verilmiştir?'
  secenekler:
    A: 'I: Muhteviyatı itibarıyla yanıltıcı — II: Sahte — III: Muhteviyatı itibarıyla yanıltıcı'
    B: 'I: Sahte — II: Sahte — III: Muhteviyatı itibarıyla yanıltıcı'
    C: 'I: Muhteviyatı itibarıyla yanıltıcı — II: Muhteviyatı itibarıyla yanıltıcı — III: Sahte'
    D: 'I: Muhteviyatı itibarıyla yanıltıcı — II: Sahte — III: Sahte'
    E: 'I: Sahte — II: Muhteviyatı itibarıyla yanıltıcı — III: Muhteviyatı itibarıyla yanıltıcı'
  dogru: A
  aciklama:
    dogru_neden: 'VUK md. 359''a göre gerçek bir muamele veya duruma dayanmakla birlikte bu muamele veya durumu
      mahiyet veya miktar itibarıyla gerçeğe aykırı yansıtan belge muhteviyatı itibarıyla yanıltıcı belgedir. Gerçek
      bir muamele veya durum olmadığı hâlde varmış gibi düzenlenen belge ise sahte belgedir. I''de gerçek bir satış
      vardır, miktar gerçeğe aykırıdır: yanıltıcı. II''de hiçbir işlem yoktur: sahte. III''te gerçek bir hizmet
      vardır, mahiyeti gerçeğe aykırı gösterilmiştir: yanıltıcı.'
    celdiriciler:
      B: I'de gerçek bir satış vardır; yalnız miktarın gerçeğe aykırı gösterilmesi belgeyi sahte değil yanıltıcı
        yapar.
      C: II'de hiçbir işlem olmadığından belge sahtedir; III'te gerçek bir işlem bulunduğundan belge yanıltıcıdır.
      D: III'te gerçek bir onarım hizmeti vardır; yalnız mahiyetin farklı gösterilmesi belgeyi yanıltıcı yapar,
        sahte yapmaz.
      E: 'Nitelendirmeler I ve II için yer değiştirmiştir: miktar farkı yanıltıcılık, işlemin hiç olmaması sahtelik
        ölçütüdür.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/a
    alinti: Gerçek bir muamele veya duruma dayanmakla birlikte bu muamele veya durumu mahiyet veya miktar itibariyle
      gerçeğe aykırı şekilde yansıtan belge ise, muhteviyatı itibariyle yanıltıcı belgedir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 359/b
    alinti: Gerçek bir muamele veya durum olmadığı halde bunlar varmış gibi düzenlenen belge, sahte belgedir.
