- id: YMM-REV-VIN-0024
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: sahte ve muhteviyatı itibarıyla yanıltıcı belge
  tip: kavrama
  zorluk: 3
  kok: '(D) Ltd. Şti., hiçbir mal teslimi olmadığı hâlde (E) A.Ş. adına 2.000.000 TL tutarında fatura düzenlemiş; (E) A.Ş.
    bu faturaları kayıtlarına alarak gider ve indirim konusu yapmıştır. (E) A.Ş.''nin muhasebe sorumlusu Bay F, bilerek faturaların
    kayda alınmasını sağlamış ve fiile iştirak etmiştir. Bu olayla ilgili aşağıdaki ifadeler veriliyor:


    I. (E) A.Ş. hakkında, bu fiil nedeniyle ziyaa uğratılan vergilerin üç katı tutarında vergi ziyaı cezası kesilir.

    II. Sahte belgeyi kullanan, VUK md. 359/b kapsamında hapis cezası ile cezalandırılır.

    III. Fiile iştirak eden Bay F''ye, ziyaa uğratılan verginin bir katı tutarında vergi ziyaı cezası uygulanır.

    IV. Sahte belge düzenleyen (D) Ltd. Şti. yetkilisi için öngörülen hapis cezasının alt sınırı on sekiz aydır.


    Bu ifadelerden hangileri doğrudur?'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: II, III ve IV
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: 'md. 359/b''ye göre gerçek bir muamele olmadığı hâlde varmış gibi düzenlenen belge sahte belgedir; belgeleri
      sahte olarak düzenleyenler veya bu belgeleri kullananlar üç yıldan sekiz yıla kadar hapis cezası ile cezalandırılır
      (II doğru, IV yanlış: on sekiz ay alt sınırı md. 359/a''daki muhteviyatı itibarıyla yanıltıcı belge fiillerine aittir).
      md. 344''e göre vergi ziyaına md. 359''daki fiillerle sebebiyet verilmesi hâlinde ceza üç kat (I), bu fiillere iştirak
      edenlere bir kat uygulanır (III). Püf noktaları: Sahte belgede hapis alt sınırı üç yıl, yanıltıcı belgede on sekiz aydır;
      iştirak edene vergi ziyaı cezası üç kat değil bir kattır.'
