    A: I ve II
    B: II ve III
    C: I, II ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 7338 sayılı Kanunla değişik md. 139'a göre vergi incelemeleri esas itibarıyla dairede yapılır (I); mükellef
      ve vergi sorumlusunun talep etmesi ve iş yerinin müsait olması hâlinde inceleme iş yerinde de yapılabilir (II). İncelemenin
      dairede yapılması, incelemeye tabi olanın iş yerinde tespit yapılmasına ve çalışmalarda bulunulmasına mani değildir;
      III yanlıştır. Haklı mazeret gösterene defter ve vesikalarını ibraz etmesi için münasip bir mühlet verilir (IV).
    celdiriciler:
      A: IV de doğrudur; haklı mazerette münasip mühlet verilir.
      B: III yanlıştır; dairede inceleme iş yerinde tespite engel değildir.
      D: III yanlış, II ise doğrudur.
      E: III maddenin açık hükmüne aykırıdır.
