  kazanim: vergi ziyaı ve usulsüzlük
  tip: kavrama
  zorluk: 2
  kok: '(C) Ltd. Şti.''nin 2026 yılında tespit edilen usulsüzlükleri şunlardır:


    I. Tasdiki mecburi olan defterin tasdikinin, kanuni sürenin sonundan başlayarak 20 gün içinde yaptırılması

    II. Tasdiki mecburi olan defterin tasdikinin, kanuni sürenin sonundan başlayarak 45 gün sonra yaptırılması

    III. Muhtasar beyannamenin süresinde verilmemesi

    IV. Hesap ve muamelelerin doğruluk veya açıklığını bozmayan bazı vesikaların ibraz edilmemesi


    VUK md. 352''ye göre bu fiillerden hangileri ikinci derece usulsüzlüktür?'
  secenekler:
    A: I ve II
    B: I ve IV
    C: II ve III
    D: II ve IV
    E: III ve IV
  dogru: B
  aciklama:
    dogru_neden: md. 352'ye göre tasdiki mecburi defterin tasdikinin süresinin sonundan başlayarak bir ay içinde yaptırılması
      ikinci derece usulsüzlüktür (I). Kanuni sürenin sonundan başlayarak bir ay geçtikten sonra tasdik ettirilen defterler
      tasdik ettirilmemiş sayılır; bu birinci derece usulsüzlüktür (II). Vergi beyannamelerinin süresinde verilmemesi birinci
      derece usulsüzlüktür (III). Hesapların doğruluk veya açıklığını bozmamak şartıyla bazı evrak ve vesikaların bulunmaması
      veya ibraz edilmemesi ikinci derece usulsüzlüktür (IV).
    celdiriciler:
      A: II'de bir aylık süre aşıldığından defter tasdik ettirilmemiş sayılır ve fiil birinci derecedir.
      C: II ve III birinci derece usulsüzlüktür.
      D: II birinci derece usulsüzlüktür; I ise ikinci derecedir.
      E: III birinci derece usulsüzlüktür; I ise ikinci derecedir.
  kaynaklar:
