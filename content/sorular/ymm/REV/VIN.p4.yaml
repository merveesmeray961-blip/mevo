- id: YMM-REV-VIN-0022
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: vergi ziyaı ve usulsüzlük
  tip: hesaplama
  zorluk: 3
  kok: 'Vergi kanunlarına göre mükellefiyeti bulunan (B) A.Ş. ile ilgili şu bilgiler vardır: (i) Şirket, Mart 2025 dönemi
    KDV beyannamesini kanuni süresi geçtikten sonra, hakkında herhangi bir inceleme başlamadan kendiliğinden vermiş ve pişmanlık
    talebinde bulunmamıştır; bu nedenle 80.000 TL KDV zamanında tahakkuk etmemiştir. (ii) 2026''da başlayan incelemede, 2025
    yılında sahte fatura kullanılarak 300.000 TL kurumlar vergisinin ziyaa uğratıldığı tespit edilmiştir. (iii) Aynı incelemede,
    2025 yılında kanunen kabul edilmeyen bir giderin kâra eklenmemesi nedeniyle ayrıca 100.000 TL kurumlar vergisi ziyaı tespit
    edilmiştir. Usulsüzlük cezaları ve gecikme faizi dikkate alınmayacaktır. Şirket adına kesilecek toplam vergi ziyaı cezası
    kaç TL''dir?'
  secenekler:
    A: 440.000 TL
    B: 480.000 TL
    C: 1.040.000 TL
    D: 1.080.000 TL
    E: 1.240.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 344''e göre vergi ziyaında ceza ziyaa uğratılan verginin bir katıdır. (i) İnceleme başlamadan önce
      kanuni süresinden sonra verilen beyanname için ceza %50 uygulanır: 80.000 × %50 = 40.000 TL. (ii) Ziyaa md. 359''daki
      fiillerle (sahte belge kullanma) sebebiyet verildiğinden ceza üç kattır: 300.000 × 3 = 900.000 TL. (iii) Bir kat: 100.000
      TL. Toplam 1.040.000 TL. Püf noktaları: Aynı vergi ve dönemdeki farklı ziyalar farklı katsayılarla cezalandırılır; üç
      kat yalnız md. 359 fiiliyle ziyaa uğratılan kısma uygulanır, %50 indirim ise inceleme öncesi geç verilen beyannameye
      özgüdür.'
    celdiriciler:
      A: Sahte belge kullanımına üç kat yerine bir kat ceza uygulanmış, geç beyanname için %50 indirim yapılmıştır (40.000
        + 300.000 + 100.000).
      B: Tüm ziyalara bir kat uygulanmış; md. 359 fiili için üç kat ve geç beyan için %50 indirim dikkate alınmamıştır.
      D: Geç verilen beyanname için %50 indirim uygulanmamıştır (80.000 + 900.000 + 100.000).
      E: KKEG kaynaklı ziyaya da üç kat uygulanmıştır (40.000 + 900.000 + 300.000); üç kat yalnız md. 359 fiiliyle ziyaa uğratılan
        vergiye aittir.
    hesap_adimlari:
    - (i) 80.000 × 1 × 0,50 = 40.000
    - (ii) 300.000 × 3 = 900.000
    - (iii) 100.000 × 1 = 100.000
    - 'Toplam: 1.040.000 TL'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344
    alinti: Vergi ziyaına 359 uncu maddede yazılı fiillerle sebebiyet verilmesi halinde bu ceza üç kat, bu fiillere iştirak
      edenlere ise bir kat olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344
    alinti: kanuni süresi geçtikten sonra verilen vergi beyannameleri için bu madde uyarınca kesilecek ceza yüzde elli oranında
      uygulanır.
  gecerlilik:
    baslangic: '2008-02-06'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'c1 = 80000 * 50 / 100

      c2 = 300000 * 3

      c3 = 100000

      sonuc = c1 + c2 + c3'
  durum: kontrolde
  surum: 1
