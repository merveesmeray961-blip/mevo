- id: YMM-REV-VIN-0029
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: arama sonucu muhafaza altına alınan defterler
  tip: kavrama
  zorluk: 3
  kok: 'Arama neticesinde defterleri muhafaza altına alınan bir mükellef ile ilgili aşağıdaki ifadeler verilmiştir:


    I. Defterlerin muhafaza altına alınması nedeniyle yapılamayan kayıtlar, defterlerin geri verilmesinden sonra idare ile
    mükellef arasında kararlaştırılan münasip bir süre içinde ikmal edilir ve bu süre bir aydan az olamaz.

    II. Mükellef dilerse, defterlerinin muhafaza altına alındığı dönemdeki işlemlerini yeniden tasdik ettireceği defterlere
    kaydedebilir.

    III. Kayıtlar, defterlerin geri verilmesinden itibaren on beş gün içinde ikmal edilmek zorundadır.

    IV. Alınan defter ve vesikalar üzerindeki incelemenin üç ay içinde bitirilememesi hâlinde süre vergi dairesi müdürünün
    onayıyla uzatılır.


    Bu ifadelerden hangileri VUK hükümlerine göre doğrudur?'
  secenekler:
    A: I, IV
    B: I ve II
    C: II, IV
    D: I, II ve IV
    E: Yalnız I
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 146''ya göre muhafaza altına alınan defterler nedeniyle yapılamayan kayıtlar, defterlerin geri verilmesinden
      sonra kararlaştırılan münasip sürede ikmal edilir ve bu süre bir aydan az olamaz (I doğru). Mükellef dilerse işlemlerini
      yeniden tasdik ettireceği defterlere kaydedebilir (II doğru). III: Süre en az bir aydır, on beş gün değildir. IV: Md.
      145''e göre süre sulh yargıcının kararıyla uzatılır. Püf noktaları: "En az bir ay" ile "en fazla 15 gün" ifadelerini
      karıştırmayın; aramada alınan defterlerdeki süre uzatma yetkisi sulh yargıcına aittir.'
    celdiriciler:
      A: IV yanlıştır (uzatma yetkisi sulh yargıcınındır) ve II de doğrudur.
      C: II doğrudur; IV yanlıştır.
      D: IV yanlıştır; uzatma yetkisi vergi dairesi müdürüne değil sulh yargıcına aittir.
      E: II de doğrudur; ifade eksik kalır.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 146
    alinti: Madde 146 – Arama neticesinde bulunan defter ve vesikaların muhafaza altına alınması sebebiyle 219 uncu madde
      gereğince yapılamıyan kayıtlar defterlerin geri verilmesinden sonra idare ile mükellef arasında kararlaştırılan münasip
      bir süre içinde ikmal edilir. Bu süre bir aydan az olamaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 146
    alinti: Mükellef dilerse defterlerinin muhafaza altına alındığında işlemlerini yeniden tasdik ettireceği defterlere kayıt
      ve iadesi halinde iade edilen defterlere intikal ettirebilir.
