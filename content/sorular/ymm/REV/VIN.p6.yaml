- id: YMM-REV-VIN-0026
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: bilgi toplama
  tip: uygulama
  zorluk: 2
  kok: Bir vergi müfettişi, (A) Ltd. ile ticari ilişkisi bulunan (B) A.Ş. yetkilisinden (A)'nın mal alımlarına ilişkin bilgiyi
    sözle istemiş, ancak bilgi verilmemiştir. VUK md. 148'e göre müfettişin yapabileceği işlem aşağıdakilerden hangisidir?
  secenekler:
    A: Bilgi yalnızca yazıyla istenebileceğinden sözlü istemi geçersiz sayıp işleme son vermek
    B: (B) yetkilisini bilgi vermesi için vergi dairesine zorla getirtmek
    C: Keyfiyeti yazı ile tekit ederek cevap vermesi için (B)'ye uygun bir süre tanımak
    D: Bilgi verme yükümlülüğü yalnız mükellefe ait olduğundan (B)'den bilgi istemekten vazgeçmek
    E: Süre tanımaksızın (B) yetkilisinden bilgiyi hemen yazılı olarak vermesini zorunlu tutmak
  dogru: C
  aciklama:
    dogru_neden: Md. 148'e göre bilgiler yazı veya sözle istenir. Sözle istenen bilgileri vermeyenlere keyfiyet yazı ile tekit
      edilir ve cevap vermeleri için kendilerine münasip bir mühlet tayin olunur. Mükelleflerle muamelede bulunan diğer gerçek
      ve tüzel kişiler de bilgi vermeye mecburdur.
    celdiriciler:
      A: Md. 148/2 bilginin sözle de istenebileceğini açıkça kabul eder.
      B: 'Md. 148/2: bilgi istenmek üzere ilgililer vergi dairesine zorla getirilemez.'
      D: Md. 148/1 mükelleflerle muamelede bulunan diğer gerçek ve tüzel kişileri de bilgi vermekle yükümlü tutar.
      E: Önce yazıyla tekit ve uygun mühlet tayini gerekir; süresiz zorunlu tutma düzenlenmemiştir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 148
    alinti: Kamu idare ve müesseseleri, mükellefler veya mükelleflerle muamelede bulunan diğer gerçek ve tüzel kişiler, Maliye
      Bakanlığının veya vergi incelemesi yapmaya yetkili olanların istiyecekleri bilgileri vermeye mecburdurlar.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 148
    alinti: Bilgiler yazı veya sözle istenilir. Sözle istenen bilgileri vermeyenlere keyfiyet yazı ile tekit ve cevap vermeleri
      için kendilerine münasip bir mühlet tayin olunur. Bilgi istenmek üzere ilgililer vergi dairesine zorla getirilemez.
