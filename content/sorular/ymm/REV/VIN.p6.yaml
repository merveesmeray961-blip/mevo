- id: YMM-REV-VIN-0027
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: aramada alınan defter ve vesikalar
  tip: uygulama
  zorluk: 2
  kok: Sulh yargıcı kararıyla (M) Ltd. Şti. nezdinde yapılan arama sonucu bazı defter ve vesikalar 10 Şubat 2026'da alınmıştır.
    İnceleme haklı sebeplerle üç ay içinde bitirilememektedir. VUK md. 145'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Defter ve vesikalar 10 Mayıs 2026'ya kadar tutanakla geri verilir; süre sulh yargıcının kararıyla uzatılabilir
    B: Defter ve vesikalar 10 Mayıs 2026'ya kadar tutanakla geri verilir; bu süreyi gerekçeli talep üzerine vergi dairesi
      müdürü uzatabilir
    C: Defter ve vesikalar 10 Ağustos 2026'ya kadar geri verilir; süre uzatılamaz
    D: Defter ve vesikalar 10 Mart 2026'ya kadar geri verilir; süre sulh yargıcının kararıyla uzatılabilir
    E: Defter ve vesikalar 10 Mayıs 2026'ya kadar geri verilir; süre hiçbir şekilde uzatılamaz
  dogru: A
  aciklama:
    dogru_neden: Md. 145'e göre arama neticesinde alınan defter ve vesikalar üzerindeki incelemeler en geç üç ay içinde bitirilerek
      sahibine bir tutanakla geri verilir. Haklı sebeplerle üç ayda bitirilemezse sulh yargıcının vereceği karar üzerine süre
      uzatılabilir. 10 Şubat + 3 ay = 10 Mayıs 2026.
    celdiriciler:
      B: Süreyi uzatmaya yetkili merci sulh yargıcıdır; vergi dairesi müdürü değildir (md. 140'taki ek süre incelemeye ilişkindir,
        aramada alınan defterler için değildir).
      C: Süre altı ay değil üç aydır ve haklı sebeplerle uzatılabilir.
      D: Süre bir ay değil üç aydır.
      E: Haklı sebeplerle sulh yargıcı kararıyla uzatma imkânı vardır.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 145
    alinti: Arama neticesinde alınan defter ve vesikalar üzerindeki incelemeler en geç üç ay içinde bitirilerek sahibine bir
      tutanakla geri verilir. İncelemelerin haklı sebeplere binaen üç ay içinde bitirilmesine imkan olmıyan hallerde sulh
      yargıcının vereceği karar üzerine bu süre uzatılabilir.
  gecerlilik:
