- id: YMM-REV-VIN-0028
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Vergi incelemesi ve hile tespiti
  konu: VIN
  kazanim: aramada defter ve vesikaların tespiti
  tip: uygulama
  zorluk: 3
  kok: Sulh yargıcı kararıyla yapılan aramada (N) A.Ş.'nin kayıtlarına ulaşılmış; zaman müsaadesizliği nedeniyle müfredatlı
    tutanak o anda düzenlenememiş, bulunan defter ve vesikalar kablara konularak mühürlenmiş ve daireye nakledilmiştir. Daha
    sonra mühürlerin açılması ve tutanağın tanzimi sırasında mükellef, çağrıldığı hâlde hazır bulunmaktan imtina etmiştir.
    VUK md. 143'e göre bu işlemlerin tamamlanması nasıl olur?
  secenekler:
    A: İşlemler, sulh yargıcının huzurunda ve yalnızca onun görevlendireceği bilirkişiyle birlikte tamamlanır, ayrıca tutanak
      düzenlenmez
    B: Mükellef hazır bulunmadıkça mühürler açılamaz ve tutanak düzenlenemez
    C: İşlemler, mükellefin vekili bulunmadan yapılamaz; vekil de gelmezse defterler iade edilir
    D: İşlemler, aramayı yapan tarafından iki memurla birlikte tamamlanır; mühürleme ve mührün fekki de birer tutanakla tespit
      edilir
    E: İşlemler, aramayı yapan tarafından tek başına tamamlanır
  dogru: D
  aciklama:
    dogru_neden: 'Md. 143''e göre mükellefin mührün fekki veya tutanağın tanzimi sırasında hazır bulunmaktan imtinaı hâllerinde
      işler aramayı yapan tarafından iki memurla birlikte tamamlanır. Mühürleme ve mührün fekki de birer tutanakla tespit
      edilir ve müfredatlı tutanağın bir nüshası defter ve vesikaların sahibine veya adamına verilir. Püf noktaları: Mükellefin
      aramada hazır bulunmaması veya mühür vaz''ından imtinaı hâlinde, işi aramada hazır bulunanlar marifetiyle tamamlanır;
      burada ise mührün fekki aşamasındaki imtina söz konusudur. Tek memur yetmez, iki memur gerekir.'
    celdiriciler:
      A: Md. 143 böyle bir sulh yargıcı huzuru ve bilirkişi şartı öngörmez.
      B: Mükellefin imtinaı işlemi durdurmaz; md. 143/(b) işin iki memurla tamamlanmasını öngörür.
      C: Vekil şartı yoktur.
      E: İki memur şarttır ve müfredatlı tutanağın bir nüshası defter ve vesikaların sahibine veya adamına verilir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 143
    alinti: Arama yapıldığı sırada zaman müsaadesizliği ve sair sebeplerle bu tutanağın tanzimi mümkün olmazsa, bulunan ve
      incelemesine lüzum görülen defter ve vesikalar, mükellef nezdinde emin bir yere konur veya kablar içinde daireye nakledilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 143
    alinti: 'Bu işler: a) Mükellefin, aramada hazır bulunmakta veya mühür vaz''ından imtinaı hallerinde aramada hazır bulunanlar
      marifetiyle; b) Mükellefin, mühürün fekki veya tutanağın tanzimi sırasında hazır bulunmaktan imtinaı hallerinde de aramayı
      yapan tarafından iki memurla birlikte; tamamlanır.'
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 143
    alinti: Mühürleme ve mühürün fekki halleri de birer tutanakla tesbit edilir
