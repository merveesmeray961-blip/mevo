- id: YMM-SPM-DNT-0016
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: SPK finansal raporlama yükümlülükleri
  tip: kavrama
  zorluk: 2
  kok: '6362 sayılı Kanun''un 14 üncü maddesine göre ihraççıların finansal raporlama ve bağımsız denetim yükümlülükleri bakımından
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Finansal tablo ve raporların gerçeğe uygunluğu ve doğruluğundan ihraççı ile kusurlarına ve durumun gereklerine göre
    ihraççının yönetim kurulu üyeleri sorumludur.

    II. Yönetim kurulunun, Kurul düzenlemelerine göre hazırlanan finansal tablo ve raporların kabulüne dair ayrı bir karar
    alması gerekir.

    III. Finansal tablo ve raporların gerçeğe uygunluğu konusundaki beyana, kamuya yapılacak bildirimlerde bağımsız denetçi
    ile genel kurul toplantı başkanı tarafından yer verilir.

    IV. Kurul, borsada işlem görme başvurusunda ve önemli nitelikteki işlemlerde, işlemin tarafı ortaklıklardan da bağımsız
    denetim raporu istemeye yetkilidir.'
  secenekler:
    A: I, II ve IV
    B: I ve II
    C: I ve III
    D: II ve IV
    E: II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: SPKn md. 14/2 sorumluluğu ihraççı ile kusurlarına ve durumun gereklerine göre yönetim kurulu üyelerine yükler
      ve yönetim kurulunun finansal tabloların kabulüne dair ayrı karar almasını şart koşar (I, II doğru). md. 14/4 uyarınca
      Kurul halka arzda, borsada işlem görme başvurusunda ve önemli nitelikteki işlemlerde işlemin tarafı ortaklıklardan da
      bağımsız denetim raporu isteyebilir (IV doğru). Gerçeğe uygunluk beyanı ise finansal tabloları hazırlayan ortaklık yöneticileri
      ile birlikte sorumlu yönetim kurulu üyelerince verilir (III yanlış).
    celdiriciler:
      B: IV de doğrudur; md. 14/4 Kurula işlemin tarafı ortaklıklardan da bağımsız denetim raporu isteme yetkisi verir.
      C: III yanlıştır; beyan, tabloları hazırlayan ortaklık yöneticileri ile sorumlu yönetim kurulu üyelerine aittir.
      D: I de doğrudur; md. 14/2 ihraççı ile birlikte yönetim kurulu üyelerinin kusura göre sorumluluğunu düzenler.
      E: III yanlıştır; bağımsız denetçi ve genel kurul toplantı başkanı md. 14/2'deki beyanı verecek kişiler arasında değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 14/2
    alinti: Yönetim kurulunun, bu maddede belirtilen kapsamda hazırlanacak finansal tablo ve raporların kabulüne dair ayrı
      bir karar alması gerekir. Ayrıca finansal tablo ve raporlarla ilgili olarak bunları hazırlayan ortaklık yöneticileri
      ile birlikte sorumlu yönetim kurulu üyelerinin kamuya yapacakları bildirimlerde finansal tablo ve raporların gerçeğe
      uygunluğu ve doğruluğu konusundaki beyanlarına yer verilmesi zorunludur.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 14/4
    alinti: (4) Kurul, halka arzda, borsada işlem görme başvurusunda, 23 üncü maddede tanımlanan önemli nitelikte işlemlerde
      ve ortaklığın faaliyetlerini ve finansal durumunu önemli derecede etkileyen olay ve gelişmelerde, işlemin tarafı ortaklıklardan
      da bu madde hükümlerine göre hazırlanacak bağımsız denetim raporu istemeye yetkilidir.
