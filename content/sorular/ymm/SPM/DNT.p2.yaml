- id: YMM-SPM-DNT-0015
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: değerleme kuruluşları
  tip: bilgi
  zorluk: 1
  kok: 'III-48.1 sayılı Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği''ne göre ortaklıklar, hesap döneminin bitimini
    takip eden (I) içinde, portföyüne o yıl içinde alınabilecek ve değerleme gerektirecek varlıklar için değerleme hizmeti
    alınacak en fazla (II) değerleme kuruluşunu yönetim kurulu kararıyla belirler. Portföyde değerleme yaptırılması gereken
    her bir varlık için aynı gayrimenkul değerleme kuruluşundan üst üste en fazla (III) yıl hizmet alınabilir.


    Boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?'
  secenekler:
    A: 'I: bir ay – II: üç – III: beş'
    B: 'I: iki ay – II: iki – III: beş'
    C: 'I: iki ay – II: üç – III: üç'
    D: 'I: üç ay – II: bir – III: beş'
    E: 'I: bir ay – II: iki – III: üç'
  dogru: E
  aciklama:
    dogru_neden: Tebliğ md. 35/2 uyarınca değerleme kuruluşları hesap döneminin bitimini takip eden bir ay içinde yönetim
      kurulu kararıyla belirlenir; yıl içinde portföye alınabilecek varlıklar için en fazla iki kuruluş seçilebilir. md. 35/3
      uyarınca aynı kuruluştan aynı varlık için üst üste en fazla üç yıl hizmet alınabilir (ardından en az iki yıl ara verilir).
    celdiriciler:
      A: Süre doğru (bir ay) ancak yeni varlıklar için en fazla iki kuruluş belirlenebilir; ardışık hizmet sınırı beş değil
        üç yıldır.
      B: Belirleme süresi iki ay değil bir aydır; ardışık hizmet sınırı üç yıldır.
      C: Belirleme süresi bir aydır ve yeni varlıklar için en fazla iki kuruluş belirlenebilir.
      D: Üç aylık belirleme süresi ve tek kuruluş sınırı Tebliğde yoktur; beş yıl da ardışık hizmet sınırı değildir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 35/2
    alinti: Ortaklıkların hesap döneminin bitimini takip eden bir ay içerisinde, portföyünde 34 üncü madde uyarınca değerleme
      yaptırılması gereken her bir varlık için değerleme hizmeti alınacak bir değerleme kuruluşunu ve portföyüne o yıl içerisinde
      alınabilecek ve değerleme gerektirecek varlıklar için değerleme hizmeti alınacak en fazla iki adet değerleme kuruluşunu
      yönetim kurulu kararı ile belirlemeleri,
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 35/3
    alinti: Ortaklıklar, portföylerinde değerleme yaptırılması gereken her bir varlık için aynı gayrimenkul değerleme kuruluşundan
      üst üste en fazla üç yıl hizmet alabilirler.
