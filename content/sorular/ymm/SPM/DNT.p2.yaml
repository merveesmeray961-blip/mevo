- id: YMM-SPM-DNT-0020
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: bağımsız denetim kuruluşları
  tip: kavrama
  zorluk: 3
  kok: Sermaye piyasası mevzuatında bazı kuruluşlar için öngörülen özel bağımsız denetim yükümlülüklerine ilişkin aşağıdaki
    ifadelerden hangisi doğrudur?
  secenekler:
    A: Kripto varlık hizmet sağlayıcılar, rezerv kanıt denetimini yılda bir kez, bilgi sistemleri bağımsız denetimini ise
      yılın her çeyreğinin sonu itibarıyla yaptırır.
    B: Paya dayalı kitle fonlamasında Tebliğdeki tutarı aşan fon toplanmışsa, fon kullanımına ilişkin özel amaçlı bağımsız
      denetim raporu yalnız fonların tamamının kullanıldığı tarih itibarıyla düzenlenir.
    C: Aracı kurumların tezgâhüstü türev işlemlerde kullandığı platformlara ilişkin özel amaçlı bağımsız denetim raporlarının
      birer örneği, rapor tarihini izleyen otuz gün içinde Kurula iletilir.
    D: Kitle fonlamasında bağımsız denetim kuruluşu, fonların ilan edilen amaca uygun kullanılmadığını tespit ederse bunu
      fonlanan şirketin yönetim kuruluna bildirir; Kurula bildirim yönetim kuruluna düşer.
    E: Aracı kurumların tezgâhüstü türev platformlarına ilişkin özel amaçlı bağımsız denetim yılda en az iki defa ve habersiz
      yapılır; programın başlangıcı çalışmalardan bir ay önce Kurula bildirilir.
  dogru: E
  aciklama:
    dogru_neden: 'III-37.1 md. 29/B-2 uyarınca tezgâhüstü türev işlemlerde kullanılan platformlara ilişkin özel amaçlı bağımsız
      denetim yılda en az iki defa ve aracı kurumlardan habersiz yapılır; md. 29/B-4 uyarınca denetim programının ne zaman
      başlayacağı çalışmaların fiilen başlamasından bir ay önce Kurula bildirilir. Püf noktaları: Üç farklı rejimdeki sıklık
      ve süreleri karıştırmayın: kripto varlık hizmet sağlayıcılarda bilgi sistemleri denetimi yılda en az bir kez, rezerv
      kanıt denetimi üç ayda bir; aracı kurum türev platformlarında yılda en az iki habersiz denetim ve raporun 5 iş günü
      içinde Kurula iletilmesi; kitle fonlamasında eşik üstü fonlarda yıllık rapor ve aykırılıkta denetçinin Kurula derhal
      bildirimi.'
    celdiriciler:
      A: 'III-35/B.1 md. 48''e göre sıklıklar terstir: bilgi sistemleri bağımsız denetimi yılda en az bir kez, rezerv kanıt
        denetimi ise yılın 3, 6, 9 ve 12. ay sonları itibarıyla yaptırılır.'
      B: III-35/A.2 md. 21/4 uyarınca eşik tutarı aşan fonlarda rapor, fonların aktarıldığı tarihten itibaren yıllık olarak
        ve her hâlükârda fonların tamamının kullanıldığı tarih itibarıyla düzenlenir.
      C: III-37.1 md. 29/B-5 uyarınca bu raporların birer örneği 5 iş günü içinde Kurula iletilir.
      D: III-35/A.2 md. 21/6 uyarınca bağımsız denetim kuruluşu konuya ilişkin olarak derhal Kurula bilgi verir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 29/B-2
    alinti: yılda en az iki defa aracı kurumlardan habersiz olacak ve esasları Kurulca belirlenecek şekilde özel amaçlı bağımsız
      denetim yapılması zorunludur.
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 29/B-4, 29/B-5
    alinti: (4) İkinci fıkrada belirtilen yetkili kuruluşlar tarafından denetim programının ne zaman başlayacağı, denetim
      çalışmalarının fiilen başlamasından bir ay önce Kurula bildirilir. (5) İkinci fıkra çerçevesinde düzenlenecek özel amaçlı
      bağımsız denetleme raporlarının birer örneği 5 iş günü içerisinde Kurula iletilir.
  - mevzuat: Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğ (III-35/B.1)
    madde: md. 48/1
    alinti: yetkilendirilmiş bağımsız denetçiler listesinde bulunan bir kuruluş ile sözleşme imzalayarak yılda en az bir kez
      bilgi sistemleri bağımsız denetimi yaptırmakla ve Kurula iletmekle yükümlüdür.
  - mevzuat: Kripto Varlık Hizmet Sağlayıcıların Kuruluş ve Faaliyet Esasları Hakkında Tebliğ (III-35/B.1)
    madde: md. 48/3
    alinti: yılın üçüncü, altıncı, dokuzuncu ve on ikinci ay sonları itibarıyla kripto varlık hizmet sağlayıcı bünyesinde
      kayden izlenen kripto varlıklara ilişkin rezervlerin korunduğuna ve saklama hizmetinin Kurul düzenlemelerine uygunluğuna
      dair tespitlerin yer aldığı rezerv kanıt denetimi yaptırılır
  - mevzuat: Kitle Fonlaması Tebliği (III-35/A.2)
    madde: md. 21/4
    alinti: fonların fonlanan şirkete aktarıldığı tarihten itibaren yıllık olarak, bu tutarın altında fon toplanan hallerde
      ise bilgi formunda fonların tamamının kullanılacağının belirtildiği tarih ve her halükarda toplanan fon tutarına bakılmaksızın
      fonların tamamının kullanıldığı tarih itibarıyla düzenlenir.
  - mevzuat: Kitle Fonlaması Tebliği (III-35/A.2)
    madde: md. 21/6
    alinti: bağımsız denetim kuruluşu konuya ilişkin olarak derhal Kurula bilgi verir.
