- id: YMM-SPM-DNT-0014
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: bağımsız denetim kuruluşları
  tip: bilgi
  zorluk: 1
  kok: Kurumsal Yönetim Tebliği (II-17.1) ekindeki Kurumsal Yönetim İlkeleri'ne göre, payları borsada işlem gören bir ortaklığın
    denetimden sorumlu komitesi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Komite iki üyeden oluşuyorsa, komite başkanının bağımsız yönetim kurulu üyesi olması yeterlidir.
    B: Yönetim kurulu üyesi olmayan, denetim alanında uzman kişiler komiteye üye olarak seçilebilir.
    C: Komite en az üç ayda bir olmak üzere yılda en az dört kez toplanır; sonuçlar tutanağa bağlanır.
    D: Hizmet alınacak bağımsız denetim kuruluşunu komite belirler ve yönetim kurulu onayı aranmaksızın genel kurula önerir.
    E: İcra başkanı/genel müdür, bağımsızlık kriterlerini taşıması koşuluyla komitede görev alabilir.
  dogru: C
  aciklama:
    dogru_neden: İlke 4.5.9 uyarınca denetimden sorumlu komite en az üç ayda bir olmak üzere yılda en az dört kere toplanır,
      toplantı sonuçları tutanağa bağlanır ve kararlar yönetim kuruluna sunulur.
    celdiriciler:
      A: İlke 4.5.3 uyarınca denetimden sorumlu komitenin tüm üyelerinin bağımsız yönetim kurulu üyesi niteliğinde olması
        gerekir; yalnız başkanın bağımsız olması diğer komiteler için geçerli kuraldır.
      B: Yönetim kurulu üyesi olmayan uzmanlar, ilke 4.5.3 uyarınca denetimden sorumlu komite dışındaki komitelerde üye olabilir.
      D: İlke 4.5.9 uyarınca bağımsız denetim kuruluşu ve alınacak hizmetler komitece belirlenir ve yönetim kurulunun onayına
        sunulur.
      E: İlke 4.5.4 uyarınca icra başkanı/genel müdür komitelerde görev alamaz; bağımsızlık kriteri bu yasağı kaldırmaz.
    hesap_adimlari: []
  kaynaklar:
