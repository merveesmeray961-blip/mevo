  konu: DNT
  kazanim: SPK finansal raporlama yükümlülükleri
  tip: kavrama
  zorluk: 2
  kok: Birleşme ve Bölünme Tebliği (II-23.2)'ne göre birleşme işlemlerinde esas alınacak finansal tablolar ve bunların bağımsız
    denetimi hakkında aşağıdakilerden hangisi **yanlıştır**?
  secenekler:
    A: Birleşmeyi onaylayacak genel kurul, hesap döneminin sonunu takip eden dördüncü ayın başı ile sekizinci ayın sonu arasında
      yapılacaksa son yıllık finansal tablolar esas alınır.
    B: Genel kurul bu dönem dışında yapılacaksa, en az altı aylık dönemi kapsayan ve tablo tarihi ile genel kurul tarihi arasında
      altı aydan fazla süre bulunmayan ara dönem tabloları esas alınır.
    C: Esas alınacak finansal tabloların Kurul düzenlemeleri uyarınca bağımsız denetimi yapılmışsa, ayrıca özel bağımsız denetim
      koşulu aranmaz.
    D: Denetim raporunda değişim oranını etkileyen hususlarda şartlı görüş bildirilmişse bu tablolar işleme esas alınamaz;
      yerine yeni bir döneme ait tablolar hazırlanır.
    E: Tablo tarihi ile birleşme sözleşmesinin imza tarihi arasında değişim oranını etkileyecek önemli bir değişiklik olursa
      bağımsız denetim kuruluşu ek rapor hazırlar.
  dogru: D
  aciklama:
    dogru_neden: Tebliğ md. 6/3 uyarınca işlemin esas alınamaması sonucu olumsuz görüş veya görüş bildirmekten kaçınma hâllerine
      bağlanmıştır. Değişim oranını etkileyen hususlarda şartlı görüş bildirilmişse finansal tablolarda gerekli düzeltmeler
      yapılarak bağımsız denetim raporunun yeniden hazırlanması gerekir; yeni bir döneme ait tablo hazırlanması öngörülmemiştir.
    celdiriciler:
      A: md. 6/1, birinci cümlenin aynen ifadesidir.
      B: 'md. 6/1, ikinci cümle: en az 6 aylık dönemi kapsayan ve tablo tarihi ile genel kurul tarihi arasında altı aydan
        fazla süre geçmeyen ara dönem tabloları esas alınır.'
      C: md. 6/2 uyarınca tabloların Kurul düzenlemeleri uyarınca bağımsız denetimi yapılmışsa özel bağımsız denetim koşulu
        aranmaz.
      E: md. 6/4 uyarınca bu durumda bağımsız denetim kuruluşu değişikliğin etkisini gösteren ek rapor hazırlar.
    hesap_adimlari: []
  kaynaklar:
