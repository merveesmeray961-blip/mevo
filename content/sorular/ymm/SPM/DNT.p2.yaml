    madde: md. 6/3
    alinti: (3) Birleşme veya bölünme işlemine esas alınacak finansal tablolara ilişkin bağımsız denetim raporunda olumsuz
      görüş bildirilmesi veya görüş bildirmekten kaçınılması durumlarında, söz konusu finansal tablolar birleşme veya bölünme
      işlemine esas alınmaz.
  - mevzuat: Birleşme ve Bölünme Tebliği (II-23.2)
    madde: md. 6/3
    alinti: bağımsız denetim raporunda şartlı görüş bildirilen ve değişim oranını etkileyecek hususların bulunması halinde,
      finansal tablolarda gerekli düzeltmelerin yapılarak bağımsız denetim raporunun yeniden hazırlanması gerekir.
  - mevzuat: Birleşme ve Bölünme Tebliği (II-23.2)
