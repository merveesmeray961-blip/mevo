- id: YMM-SPM-DNT-0021
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: bağımsız denetim kuruluşları
  tip: uygulama
  zorluk: 3
  kok: '(K) Bağımsız Denetim A.Ş., Alfa Yatırım Menkul Değerler A.Ş.''nin (aracı kurum) finansal tablo denetimini yürütmektedir.
    K, Alfa ile sermaye ve yönetim açısından ilişkili Beta Holding A.Ş.''nin bağımsız denetimini yaparken Alfa ile ilgili
    aşağıdaki bilgileri edinmiştir:


    I. Alfa''nın, yetki belgesinde yer almayan bir yatırım hizmetini yürüttüğü

    II. Alfa''nın geçmiş dönem finansal tablolarında, sonradan düzeltilmiş ve denetim görüşünü etkilemeyen bir sınıflandırma
    hatası bulunduğu

    III. Kredi limitlerinin tamamının iptal edilmesi nedeniyle Alfa''nın faaliyetlerini sürekli ve düzenli biçimde yürütmesini
    engelleyebilecek bir likidite sıkıntısına girdiği

    IV. Alfa''nın finansal tablolarında, şartlı görüş gerektiren ancak olumsuz görüş veya görüş bildirmekten kaçınmayı gerektirmeyen
    bir karşılık eksikliği bulunduğu


    6362 sayılı Kanun''un 64 üncü maddesine göre K''nin bu hususlardan hangilerini Kurula derhâl bildirmesi zorunludur?'
  secenekler:
    A: I ve III
    B: Yalnız I
    C: II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'SPKn md. 64/1 uyarınca bir yatırım kuruluşunda finansal tablo denetimi yapan bağımsız denetim kuruluşu,
      bu şirkette veya bununla sermaye ve yönetim açısından ilişkili kuruluşlardan biri nezdinde görevini yaparken öğrendiği;
      (a) yetkilendirme ve faaliyet şartlarına ilişkin hükümlerin ihlalini, (b) faaliyetlerin sürekli ve düzenli yürütülmesini
      engelleyebilecek durumları, (c) olumsuz görüş veya görüş bildirmekten kaçınma gerektiren durumları Kurula derhâl bildirir.
      I (a) bendine, III (b) bendine girer. II ve IV sayılan hâllerden değildir. Püf noktaları: Bilginin Alfa''nın değil,
      ilişkili Beta''nın denetimi sırasında edinilmesi yükümlülüğü ortadan kaldırmaz. Şartlı görüş gerektiren durumlar (c)
      bendinde sayılmamıştır; bent yalnız olumsuz görüş ve görüş bildirmekten kaçınmayı kapsar. md. 64/2 uyarınca bu bildirim
      sır saklama ihlali sayılmaz.'
    celdiriciler:
      B: III de bildirilmelidir; faaliyetlerin sürekli ve düzenli yürütülmesini engelleyebilecek durumlar md. 64/1-(b) kapsamındadır.
      C: II ve IV md. 64/1'deki hâllerden değildir; buna karşılık I ve III bildirime tabidir.
      D: IV'teki şartlı görüş gerektiren durum md. 64/1-(c) kapsamına girmez; bent olumsuz görüş ve görüş bildirmekten kaçınmayla
        sınırlıdır.
      E: II ve IV bildirime tabi değildir; yetkilendirme şartlarının ihlali (I) ise bildirilmelidir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 64/1
    alinti: MADDE 64 – (1) Bir yatırım kuruluşunda veya kolektif yatırım kuruluşunda finansal tablo denetimi ya da bu Kanun
      ve ilgili düzenlemeler çerçevesinde belirlenen başka bir görevi ifa eden bağımsız denetim kuruluşları ve bağımsız denetçiler,
      bu şirkette veya bunlarla sermaye ve yönetim açısından ilişkili olan kuruluşlardan biri nezdinde görevlerini yerine
      getirirken bilgi sahibi olduğu şirketle ilgili olarak;
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 64/1-(a)-(c)
    alinti: a) Bu Kanun ve ilgili mevzuattaki yetkilendirme ve faaliyet şartlarına ilişkin hükümleri ihlal eden, b) Şirketin
      faaliyetlerinin sürekli ve düzenli bir şekilde yürütülmesini engelleyebilecek, c) Olumsuz görüş veya görüş bildirmekten
      kaçınma gerektiren, her türlü durumu Kurula derhâl bildirmekle yükümlüdür.
