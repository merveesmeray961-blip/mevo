    madde: İlke 4.5.9
    alinti: Denetimden sorumlu komite; en az üç ayda bir olmak üzere yılda en az dört kere toplanır ve toplantı sonuçları
      tutanağa bağlanarak alınan kararlar yönetim kuruluna sunulur.
  - mevzuat: 'Kurumsal Yönetim Tebliği (II-17.1) — Ek: Kurumsal Yönetim İlkeleri'
    madde: İlke 4.5.3
    alinti: Denetimden sorumlu komitelerin tüm üyelerinin bağımsız yönetim kurulu üyesi niteliğinde olması gerekir. Yönetim
      kurulu üyesi olmayan konusunda uzman kişiler, denetimden sorumlu komite dışındaki diğer komitelerde üye olabilir.
  - mevzuat: 'Kurumsal Yönetim Tebliği (II-17.1) — Ek: Kurumsal Yönetim İlkeleri'
    madde: İlke 4.5.9
    alinti: Şirketin hizmet alacağı bağımsız denetim kuruluşu ile bu kuruluşlardan alınacak hizmetler denetimden sorumlu komite
      tarafından belirlenir ve yönetim kurulunun onayına sunulur.
  - mevzuat: 'Kurumsal Yönetim Tebliği (II-17.1) — Ek: Kurumsal Yönetim İlkeleri'
    madde: İlke 4.5.4
    alinti: 4.5.4. İcra başkanı/genel müdür komitelerde görev alamaz.
