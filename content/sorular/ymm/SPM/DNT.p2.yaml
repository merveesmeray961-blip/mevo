- id: YMM-SPM-DNT-0018
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: değerleme kuruluşları
  tip: uygulama
  zorluk: 2
  kok: 'Hesap dönemi takvim yılı olan Lambda GYO A.Ş.''nin portföyündeki varlıklar için 2026 yılında Kurulca listeye alınmış
    değerleme kuruluşlarına yaptırılan en son rayiç değer tespitlerinin tarihleri şöyledir:


    - Ofis binası: 14 Eylül 2026

    - Alışveriş merkezi: 3 Ekim 2026

    - Lojistik deposu: 20 Mart 2026

    - Arsa (portföye alımı nedeniyle): 28 Aralık 2026

    - Otel: 30 Eylül 2026


    III-48.1 sayılı Tebliğ''in 34 üncü maddesine göre Lambda''nın kaç varlık için yıl sonu değer tespiti yaptırması gerekir
    ve bu değerlemelerin en geç hangi tarih itibarıyla tamamlanmış olması zorunludur?'
  secenekler:
    A: 2 varlık – 31 Aralık 2026
    B: 3 varlık – 31 Aralık 2026
    C: 3 varlık – 31 Ocak 2027
    D: 2 varlık – 31 Ocak 2027
    E: 4 varlık – 31 Mart 2027
  dogru: B
  aciklama:
    dogru_neden: md. 34/1-(g) uyarınca hesap döneminin son üç ayı (1 Ekim–31 Aralık 2026) içinde rayiç değeri tespit edilmemiş
      varlıkların yıl sonu değerleri tespit ettirilir. Ofis (14 Eylül), depo (20 Mart) ve otel (30 Eylül) bu dönemin dışında
      kaldığından 3 varlık için değerleme gerekir; AVM (3 Ekim) ve arsa (28 Aralık) son üç ayda değerlenmiştir. md. 34/5 uyarınca
      bu değerlemeler en geç ilgili yılın son günü (31 Aralık 2026) itibarıyla tamamlanmış olmalıdır.
    celdiriciler:
      A: 30 Eylül tarihli otel değerlemesi son üç ayın (Ekim–Aralık) dışında kalır; değerleme gerektiren varlık sayısı 3'tür.
      C: Varlık sayısı doğru, ancak md. 34/5 değerlemenin en geç yılın son günü itibarıyla tamamlanmasını öngörür; bir aylık
        süre değerleme kuruluşu seçimine ilişkin md. 35/2'deki süredir.
