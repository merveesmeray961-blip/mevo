- id: YMM-SPM-DNT-0019
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: değerleme kuruluşları
  tip: uygulama
  zorluk: 3
  kok: 'Payları borsada işlem gören Sigma GYO A.Ş., 2026 yılında Kurulca listeye alınmış bağımsız bir gayrimenkul değerleme
    kuruluşuna değer tespiti yaptırdığı varlıklarla ilgili aşağıdaki işlemleri gerçekleştirmiştir (tutarlar ekspertiz raporlarındaki
    değerlerdir):


    I. Ekspertiz değeri 80.000.000 TL olan bir ofisi 77.000.000 TL''ye satmıştır.

    II. Ekspertiz değeri 40.000.000 TL olan bir arsayı 41.000.000 TL''ye satın almıştır.

    III. Portföyündeki bir dükkânı, rayiç yıllık kira bedeli 1.200.000 TL olarak tespit edilmişken, sabit kira bedelli bir
    yıllık sözleşmeyle tek kiracıya yıllık 1.128.000 TL''ye kiraya vermiştir.

    IV. Ekspertiz değeri 50.000.000 TL olan bir depoyu 47.500.000 TL''ye satmıştır.


    III-48.1 sayılı Tebliğ''in 37 nci maddesine göre bu işlemlerden hangileri için özel durum açıklaması yapılması ve ilk
    genel kurul toplantısında ortaklara bilgi verilmesi zorunludur?'
  secenekler:
    A: I ve II
    B: I, II ve III
    C: II ve III
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'md. 37/1 uyarınca alım işlemlerinde ekspertiz değerinden daha yüksek, satım ve kiralama işlemlerinde ise
      ekspertiz değerinin %95''inden daha düşük değerlerin esas alınması kamuya açıklama ve genel kurul bilgilendirmesi gerektirir.
      I: 77 / 80 = %96,25 → eşiğin üstünde, gerekmez. II: alım ekspertizin üzerinde (41 > 40) → gerekir. III: 1.128.000 /
      1.200.000 = %94 → %95''in altında, gerekir. IV: 47,5 / 50 = tam %95 → "%95''inden daha düşük" değildir, gerekmez. Püf
      noktaları: Eşik yöne göre değişir: alımda ekspertizin üstü, satım ve kiralamada %95''in altı. Tam %95''e eşit satış
      bedeli "daha düşük" sayılmaz. Alımda %95 toleransı yoktur; ekspertizin 1 TL üstü bile açıklama gerektirir.'
    celdiriciler:
      A: I'de satış bedeli ekspertizin %96,25'idir, %95 eşiğinin üzerindedir; buna karşılık %94'te kalan kiralama (III) açıklama
        gerektirir.
      B: I açıklama gerektirmez; satışta eşik ekspertiz değerinin %95'idir (76.000.000 TL).
      D: Satışlardaki %96,25 (I) ve %95 (IV) oranları eşiğin altında değildir; alımda ekspertizin aşılması (II) ise açıklama
        gerektirir.
      E: IV'te bedel ekspertizin tam %95'idir; Tebliğ "%95'inden daha düşük" değerleri açıklamaya bağlar.
    hesap_adimlari:
    - 'I: 77.000.000 / 80.000.000 = %96,25 (≥ %95)'
    - 'II: 41.000.000 > 40.000.000 (alımda ekspertizin üstü)'
    - 'III: 1.128.000 / 1.200.000 = %94 (< %95)'
    - 'IV: 47.500.000 / 50.000.000 = %95 (eşiğe eşit, altında değil)'
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 37/1
    alinti: Mevcut piyasa veya ödeme koşulları dikkate alınarak yapılacak alım işlemlerinde ekspertiz değerlerinden daha yüksek,
      satım ve kiralama işlemlerinde ise ekspertiz değerinin %95’inden daha düşük değerlerin esas alınması durumunda, bu durumun
      Kurulun özel durumların kamuya açıklanmasına ilişkin düzenlemeleri çerçevesinde kamuya açıklanması ve yapılacak ilk
      genel kurul toplantısının gündemine alınarak ortaklara bilgi verilmesi zorunludur.
