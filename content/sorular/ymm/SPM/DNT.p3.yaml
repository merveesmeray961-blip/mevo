    A: Bağımsız denetim kuruluşları SPK tarafından yetkilendirilmek zorundadır.
    B: Denetim kuruluşu, aynı müşteriye süresiz olarak denetim hizmeti verebilir.
    C: Denetçi bağımsızlığını tehdit eden durumların yazılı olarak raporlanması gerekir.
    D: Denetim kuruluşu, SPK'nın talep ettiği bilgi ve belgeleri vermek zorundadır.
    E: Denetçi, denetim raporunu mesleki standartlara uygun olarak hazırlamak zorundadır.
