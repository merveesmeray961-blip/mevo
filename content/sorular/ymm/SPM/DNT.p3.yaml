  kok: 'Halka açık şirket N A.Ş., bağlı ortaklığını konsolide finansal tablolara dahil etmeden yalnızca ana ortaklığın tablolarını
    açıklamıştır. Bu durumun TFRS ve SPK mevzuatı açısından değerlendirilmesi nasıl olmalıdır?

    '
  secenekler:
    A: Bağlı ortaklık yalnızca dipnotta belirtilirse konsolidasyon şartı yerine getirilmiş sayılır.
