      yapılmaması yanıltıcı finansal tablo anlamına gelir ve SPK yaptırımına yol açar. Püf noktaları: ''yalnızca dipnot''
      yeterli değildir; tam konsolidasyon zorunludur.'
    celdiriciler:
      A: Dipnot yeterli değildir; konsolidasyonun yapılması zorunludur.
      B: Yurt dışı kısıtlaması yoktur; kontrol kriteri belirleyicidir.
      D: Borsaya kote olup olmama konsolidasyon yükümlülüğünü değiştirmez.
      E: Bağlı ortaklıklar öz sermaye yöntemiyle değil, tam konsolidasyon yöntemiyle dahil edilir.
