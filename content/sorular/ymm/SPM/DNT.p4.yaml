- id: YMM-SPM-DNT-0047
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: SPK finansal raporlama yükümlülükleri
  tip: uygulama
  zorluk: 3
  kok: Payları borsada işlem gören ve konsolide finansal tablo hazırlama yükümlülüğü bulunan halka açık (H) A.Ş.'nin hesap
    dönemi takvim yılıdır. Şirket, 2025 yılı finansal raporlarının görüşüleceği olağan genel kurul toplantısını 20 Mart 2026
    Cuma günü yapmaya karar vermiştir. Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği'ne (II-14.1) göre
    (H) A.Ş.'nin 2025 yılı finansal raporlarını ve bağımsız denetim raporunu en geç hangi tarihte bildirmesi gerekir? (Belirtilen
    tarihlerin resmi tatile denk gelmediği kabul edilecektir.)
  secenekler:
    A: 27 Şubat 2026
    B: 1 Mart 2026
    C: 11 Mart 2026
    D: 13 Mart 2026
    E: 31 Mart 2026
  dogru: A
  aciklama:
    dogru_neden: 'Borsada işlem gören ve konsolide tablo hazırlayan işletme yıllık raporlarını hesap döneminin bitimini izleyen
      70 gün içinde (11 Mart 2026) bildirir (md. 10/1-b). Halka açık ortaklık ayrıca bu raporları genel kurul tarihinden en
      az 3 hafta önce bildirmek zorundadır (md. 10/2): 20 Mart 2026 − 21 gün = 27 Şubat 2026. İki yükümlülük birlikte uygulandığından
      erken olan tarih, 27 Şubat 2026, son bildirim günüdür. Püf noktaları: 70 günlük süre ile genel kuruldan üç hafta önce
      kuralını ayrı ayrı hesapla ve erken olanı seç; üçüncü ay sonu yalnız en dış sınırdır.'
    celdiriciler:
      B: Konsolide tablo yükümlülüğü yokmuş gibi 60 günlük süre esas alınmış, üç hafta kuralı da gözden kaçmıştır.
      C: Yalnız 70 günlük süre dikkate alınmış, genel kuruldan en az üç hafta önce bildirim şartı gözden kaçırılmıştır.
      D: Genel kuruldan bir hafta önce bildirim yeterli sanılmıştır; aranan süre en az üç haftadır.
      E: Üçüncü ayın sonu her hâlükârda aşılamayacak dış sınırdır; daha kısa süreler önce uygulanır.
    hesap_adimlari:
    - '70 gün: 31.12.2025 + 70 gün = 11 Mart 2026'
    - 'Genel kuruldan 3 hafta önce: 20 Mart − 21 gün = 27 Şubat 2026'
    - 'Erken olan: 27 Şubat 2026'
  kaynaklar:
  - mevzuat: Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği (II-14.1)
    madde: md. 10/1-b
    alinti: b) Konsolide finansal tablo hazırlama yükümlülüğünün bulunduğu durumlarda, hesap dönemlerinin bitimini izleyen
      70 gün
  - mevzuat: Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği (II-14.1)
    madde: md. 10/2
    alinti: raporlarını, söz konusu finansal raporların görüşüleceği genel kurul tarihinden en az 3 hafta önce
