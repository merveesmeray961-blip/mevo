  kok: 'İzahname ve İhraç Belgesi Tebliği''ne (II-5.1) göre aşağıdaki iki halka arzda izahnamede yer alacak ve bağımsız denetimden/sınırlı
    incelemeden geçirilecek finansal tablolar hangi seçenekte doğru verilmiştir?


    - (P) A.Ş.: Halka açık olmayan bir ortaklıktır; payları Borsa İstanbul''un GİP dışındaki bir pazarında işlem görmek üzere
    ilk defa halka arz edilecek, satışa sunulacağı ilk gün 20 Eylül 2026''dır.

    - (R) A.Ş.: Payları zaten borsada işlem gören bir ortaklıktır; borçlanma aracı ihracı için hazırlanan izahnameyle satışa
    sunulacağı ilk gün yine 20 Eylül 2026''dır.

    '
  secenekler:
    A: '(P): son üç yıllık ve dokuz aylık ara dönem – (R): son üç yıllık ve altı aylık ara dönem'
    B: '(P): son üç yıllık ve üç aylık ara dönem – (R): son iki yıllık ve altı aylık ara dönem'
    C: '(P): son iki yıllık ve altı aylık ara dönem – (R): son üç yıllık finansal tablolar'
    D: '(P): son yıllık ve altı aylık ara dönem karşılaştırmalı – (R): son iki yıllık finansal tablolar'
    E: '(P): son üç yıllık ve altı aylık ara dönem – (R): son iki yıllık ve altı aylık ara dönem'
  dogru: E
  aciklama:
    dogru_neden: 'Halka açık olmayan ortaklıkların paylarının (GİP dışı) ilk halka arzında 16 Ağustos–15 Kasım satış döneminde
      son üç yıllık ve altı aylık ara dönem tablolar yer alır (md. 11/1-a, 4. dönem). Diğer ihraçlarda ortaklık hakkı vermeyen
      araçlar için 16 Ağustos–31 Aralık döneminde son iki yıllık ve altı aylık ara dönem tablolar yer alır (md. 11/1-c, 3.
      dönem). Püf noktaları: İlk halka arz tablosu ile diğer ihraçlar tablosunun dönem aralıkları farklıdır; ortaklık hakkı
      vermeyen araçlarda ''üç yıl'' değil ''iki yıl'' esastır.'
    celdiriciler:
      A: Dokuz aylık ara dönem tablolar 16 Kasım–31 Aralık döneminde gerekir; borçlanma aracında iki yıllık tablolar esastır.
      B: Üç aylık ara dönem 16 Mayıs–15 Ağustos döneminin tablosudur.
      C: İki yıl/üç yıl kuralı yer değiştirilmiştir.
      D: Son yıllık karşılaştırmalı tablolar GİP'te işlem görecek payların ilk halka arzına özgüdür.
