  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: bağımsız denetim kuruluşları
  tip: kavrama
  zorluk: 2
  kok: '6362 sayılı Sermaye Piyasası Kanunu''nun 62–64. maddelerine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Kurul, listesindeki bağımsız denetim kuruluşlarından kalite kontrol ve denetim çalışmaları sonucunda standart ve mevzuata
    aykırılığı tespit edilenleri listeden çıkarabilir ve çalışmaların sonuçlarını KGK''ya bildirir.

    II. Bağımsız denetim kuruluşları, görevlerinin kapsamıyla sınırlı olmak üzere, finansal tabloların mevzuata uygun denetlenmemesi
    nedeniyle doğabilecek zararlardan raporu imzalayanlarla birlikte sorumludur.

    III. Değerleme kuruluşları raporlarındaki yanlış, yanıltıcı ve eksik bilgilerden doğan zararlardan sorumlu tutulamaz;
    bu zararlardan raporu kullanan ortaklık sorumludur.

    IV. Md. 64 kapsamında Kurula bildirim yapan bağımsız denetçi, denetim sözleşmesindeki gizlilik hükmünü ihlal etmiş sayılır
    ve bundan hukuken sorumlu olur.

    '
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I, II ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: Md. 62/1'e göre Kurul aykırılık tespit edilen bağımsız denetim kuruluşlarını listeden çıkarabilir ve sonuçları
      KGK'ya bildirir (I). Md. 63'e göre bağımsız denetim kuruluşları görev kapsamıyla sınırlı olarak raporu imzalayanlarla
      birlikte sorumludur (II); bağımsız denetim, derecelendirme ve değerleme kuruluşları raporlarındaki yanlış, yanıltıcı
      ve eksik bilgilerden doğan zararlardan sorumludur (III yanlış). Md. 64/2'ye göre Kurula yapılan bildirim, bilginin açıklanmasına
      ilişkin kanun veya sözleşme hükmünün ihlali sayılmaz ve hukuki, cezai sorumluluk doğurmaz (IV yanlış).
    celdiriciler:
      A: II de doğrudur.
      C: Değerleme kuruluşları raporlarındaki yanlış bilgilerden sorumludur; III yanlıştır.
      D: Md. 64 bildirimi sözleşme ihlali sayılmaz; IV yanlıştır.
