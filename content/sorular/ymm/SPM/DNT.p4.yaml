  aciklama:
    dogru_neden: Md. 34/6'ya göre değerleme bitiş tarihi ile rapor tarihi arasındaki süre beş iş gününü aşamaz ve rapor, rapor
      tarihini takip eden iki iş günü içinde ortaklığa teslim edilir. Md. 35/3'e göre aynı kuruluştan üst üste en fazla üç
      yıl hizmet alınabilir; tekrar hizmet alınabilmesi için en az iki yıl geçmelidir.
    celdiriciler:
      A: Süreler beş ve iki iş günü, bekleme süresi iki yıldır.
      B: Tekrar hizmet alma için bekleme süresi bir yıl değil iki yıldır.
      C: Beş ve iki iş günlük süreler yer değiştirilmiştir.
      E: Teslim süresi iki iş günü, bekleme süresi iki yıldır; üç yıl azami hizmet süresidir.
