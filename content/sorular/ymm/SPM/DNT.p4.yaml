    ile rapor tarihi arasındaki süre (I) aşamaz ve gayrimenkul değerleme raporunun rapor tarihini takip eden (II) içinde ortaklığa
    teslimi zorunludur. Aynı varlık için aynı gayrimenkul değerleme kuruluşundan üst üste azami süre kadar hizmet alan ortaklığın,
    aynı kuruluştan tekrar hizmet alabilmesi için en az (III) geçmesi zorunludur. Boşluklara sırasıyla aşağıdakilerden hangisi
    gelmelidir?
  secenekler:
    A: 'I: on iş gününü – II: beş iş günü – III: bir yılın'
    B: 'I: beş iş gününü – II: iki iş günü – III: bir yılın'
    C: 'I: iki iş gününü – II: beş iş günü – III: iki yılın'
    D: 'I: beş iş gününü – II: iki iş günü – III: iki yılın'
    E: 'I: beş iş gününü – II: on iş günü – III: üç yılın'
