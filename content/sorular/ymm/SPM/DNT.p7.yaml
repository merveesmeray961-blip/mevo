  kok: Payları borsada işlem gören Kıyı Gıda A.Ş.'nin 2025 yıllık finansal raporlarına ilişkin bağımsız denetim raporu, bağımsız
    denetim kuruluşunu temsil ve ilzama yetkili kişinin imzasını taşıyan yazı ekinde 6 Şubat 2026 Cuma günü şirkete ulaşmış
    ve aynı gün finansal raporların kabulüne ve bildirimine dair yönetim kurulu kararı alınmıştır. Yıllık rapor bildirim sürelerinin
    dolmadığı ve resmî tatil bulunmadığı varsayıldığında, KAP'a bildirimin yapılabileceği son gün hangisidir?
  secenekler:
    A: 6 Şubat 2026
    B: 9 Şubat 2026
    C: 10 Şubat 2026
    D: 11 Şubat 2026
    E: 13 Şubat 2026
  dogru: B
  aciklama:
    dogru_neden: Md. 12/A-1(a)'ya göre bağımsız denetim raporu ile birlikte şirkete ulaşılması ve aynı gün yönetim kurulu
      kararının alınması hâlinde bildirim, bu tarihi izleyen ilk iş günü sonuna kadar yapılır. 6 Şubat 2026 Cuma gününü izleyen
      ilk iş günü 9 Şubat 2026 Pazartesi'dir.
    celdiriciler:
      A: 6 Şubat 2026 karar günüdür; bildirim, kararın alındığı günü değil izleyen ilk iş günü sonunu esas alır.
      C: 10 Şubat 2026, Cuma gününü izleyen ikinci iş gününe işaret eder; Tebliğ ilk iş günü sonunu esas aldığından süre fazla
        uzatılmıştır.
      D: 11 Şubat 2026, üç iş günü sonrasıdır; Tebliğde böyle bir süre yoktur.
      E: 13 Şubat 2026, bir iş haftası sonrasıdır; Tebliğde böyle bir süre öngörülmemiştir.
    hesap_adimlari:
    - 'Karar ve rapor tarihi: 6 Şubat 2026 Cuma.'
    - 'İzleyen ilk iş günü: 7-8 Şubat hafta sonu atlanır, 9 Şubat 2026 Pazartesi.'
    - 'Son bildirim günü: 9 Şubat 2026 (gün sonuna kadar).'
  kaynaklar:
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 12/A-1(a)
    alinti: a) Bağımsız denetimden geçmiş finansal raporlar için, bağımsız denetim raporuyla birlikte, bağımsız denetim kuruluşunu
      temsil ve ilzama yetkili kişinin imzasını taşıyan bir yazı ekinde işletmeye ulaştığı ve aynı gün finansal raporların
      kabulüne ve bildirimine dair yönetim kurulu kararının alındığı, b) Bağımsız denetimden geçmemiş finansal raporlar için
      ise, finansal raporların kabulüne ve bildirimine dair yönetim kurulu kararının alındığı, tarihi izleyen ilk iş günü
      sonuna kadar
  gecerlilik:
