- id: YMM-SPM-DNT-0062
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: finansal raporlarda sorumluluk beyanları
  tip: uygulama
  zorluk: 3
  kok: 'Payları borsada işlem gören bir işletmenin finansal raporlarına ilişkin sorumluluk düzenlemeleri hakkında II-14.1
    sayılı Tebliğe göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Yönetim kurulu, denetim komitesini; denetim komitesi bulunmaması hâlinde üyeleri arasından en az bir üyeyi finansal
    raporlamadan sorumlu olarak belirler.


    II. Finansal raporlamadan sorumlu üyenin belirlenmesi, yönetim kurulunun finansal raporların gerçeğe uygunluğuna ilişkin
    sorumluluğunu ortadan kaldırır.


    III. Kamuya açıklanacak finansal raporlara, finansal raporlamadan sorumlu yönetim kurulu üyeleri ile genel müdürün veya
    finansal raporlamadan sorumlu yöneticinin beyanları eklenir.


    IV. Finansal tablo ve faaliyet raporlarının kabulüne dair ayrı bir yönetim kurulu kararı alınması gerekmez; sorumluluk
    beyanı bu kararın yerine geçer.


    V. İmza yükümlüsü görevliler, iç kontrol sistemiyle ilgili eleştiri ve önerilerini yönetim kuruluna, denetimden sorumlu
    komiteye ve bağımsız denetim kuruluşuna bildirmekle yükümlüdür.'
  secenekler:
    A: I, III ve V
    B: I ve III
    C: II, III ve IV
    D: I, II ve V
    E: III, IV ve V
  dogru: A
  aciklama:
    dogru_neden: 'Md. 9/2''ye göre denetim komitesi veya komite yoksa en az bir yönetim kurulu üyesi finansal raporlamadan
      sorumlu olarak belirlenir (I doğru). Md. 9/3''e göre beyanlar finansal raporlamadan sorumlu üyeler ile genel müdür veya
      finansal raporlamadan sorumlu yönetici tarafından verilir (III doğru). Md. 9/4''e göre imza yükümlüleri iç kontrole
      ilişkin eleştiri ve önerilerini yönetim kuruluna, denetimden sorumlu komiteye ve bağımsız denetim kuruluşuna bildirir
      (V doğru). Bu belirleme yönetim kurulunun sorumluluğunu ortadan kaldırmaz (md. 9/2; II yanlış) ve ayrı bir kabul kararı
      zorunludur (md. 9/1; IV yanlış). Püf noktaları: Sorumlu üye belirlemek sorumluluğu devretmez; kabul kararı ile sorumluluk
      beyanı birbirinin yerine geçmez, ikisi ayrı yükümlülüktür.'
    celdiriciler:
      B: V de doğru bir ifadedir; imza yükümlülerinin eleştiri ve önerileri üç muhataba bildirme yükümlülüğü Tebliğde açıkça
        düzenlenmiştir, dolayısıyla seçenek eksiktir.
      C: II ve IV yanlış ifadelerdir; yönetim kurulunun sorumluluğu ortadan kalkmaz ve ayrı kabul kararı alınması gerekir.
      D: II yanlıştır; sorumlu üye belirlenmesi yönetim kurulunun sorumluluğunu kaldırmaz. III de doğru olduğu hâlde bu seçenekte
        yer almamaktadır.
      E: IV yanlıştır; kabul kararı yerine sorumluluk beyanı geçmez. I de doğru olduğu hâlde bu seçenekte yer almamaktadır.
  kaynaklar:
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 9/1
    alinti: İşletme yönetim kurulunun, bu Tebliğ kapsamında hazırlanacak finansal tablo ve faaliyet raporlarının kabulüne
      dair ayrı bir karar alması gerekir.
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 9/2
    alinti: Ancak bu husus, yönetim kurulunun finansal raporların hazırlanması, sunulması ve gerçeğe uygunluğuna ilişkin sorumluluğunu
      ortadan kaldırmaz.
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 9/2
    alinti: İşletme yönetim kurulu, Kurumsal Yönetim İlkeleri uyarınca seçilecek denetim komitesini, denetim komitesi bulunmaması
      halinde ise üyeleri arasından en az bir üyeyi, finansal raporlamadan sorumlu olarak belirler.
