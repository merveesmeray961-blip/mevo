- id: YMM-SPM-DNT-0058
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Finansal raporlama ve bağımsız denetim
  konu: DNT
  kazanim: finansal raporların bildirimi usulü
  tip: kavrama
  zorluk: 2
  kok: 'II-14.1 sayılı Tebliğin 12/A maddesindeki bildirim usulüne ilişkin olarak aşağıdaki ifadelerden hangileri doğrudur?


    I. Payları borsada işlem gören işletmelerin KAP''a yapacakları finansal rapor bildirimleri seans saatleri dışında yapılmak
    zorundadır.


    II. Bağımsız denetimden geçmemiş finansal raporlar, bunların kabulüne ve bildirimine dair yönetim kurulu kararının alındığı
    tarihi izleyen ilk iş günü sonuna kadar bildirilir.


    III. Finansal tablolar yönetim kurulu faaliyet raporundan önce bildirilirse tek bir yönetim kurulu kararı ve tek bir sorumluluk
    beyanı yeterlidir.


    IV. Bağlı ortaklık niteliğindeki işletmeler, finansal raporlarını ana ortaklıklarından sonra bildirmek zorundadır.'
  secenekler:
    A: Yalnız I
    B: II, III ve IV
    C: I, II ve IV
    D: II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: I numaralı ifade md. 12/A-2'ye, II numaralı ifade md. 12/A-1(b)'ye uygundur. Finansal tablolar faaliyet raporundan
      önce bildirilirse hem finansal tablolar hem faaliyet raporu için ayrı yönetim kurulu kararı ve ayrı sorumluluk beyanı
      gerekir (md. 12/A-3; III yanlış). Bağlı ortaklıkların ana ortaklıkla aynı anda veya daha önce bildirmesi esastır (md.
      12/A-4; IV yanlış).
    celdiriciler:
      A: II de doğru olduğundan yalnız I ile sınırlı kalmak eksiktir; denetimsiz raporlarda bildirim süresi karar tarihini
        izleyen ilk iş günü sonudur.
      B: III ve IV yanlış ifadelerdir; ayrıca doğru olan I bu seçenekte yer almamaktadır.
      C: IV yanlıştır; bağlı ortaklığın finansal raporlarını ana ortaklıkla aynı anda veya daha önce bildirmesi esastır, sonra
        bildirmesi zorunlu değildir.
      D: III yanlıştır; ayrı bildirimde her iki belge için ayrı karar ve ayrı sorumluluk beyanı aranır ve I de doğru olduğundan
        bu seçenek eksiktir.
  kaynaklar:
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 12/A-2
    alinti: Sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmelerin,
      bu Tebliğ kapsamında kamuya açıklanmak üzere KAP’a yapacakları bildirimleri, seans saatleri dışında yapmaları zorunludur.
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 12/A-1(b)
    alinti: b) Bağımsız denetimden geçmemiş finansal raporlar için ise, finansal raporların kabulüne ve bildirimine dair yönetim
      kurulu kararının alındığı, tarihi izleyen ilk iş günü sonuna kadar yapılması gerekir.
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 12/A-3
