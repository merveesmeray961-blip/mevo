    B: I ve IV
    C: II, III ve IV
    D: I, II ve III
    E: I, III ve IV
  dogru: E
  aciklama:
    dogru_neden: 'Md. 22/1''e göre işlem sıraları 30 günden fazla durdurulan işletmeler (I), borsa kotundan sürekli olarak
      çıkarılanlar (III) ve tasfiye halinde bulunanlar (IV) ara dönem rapor düzenleme yükümlülüğünden muaftır. İşlem sırası
      20 gündür durdurulan işletme 30 günlük sınırı aşmadığından muaf değildir; ayrıca md. 2/3''e göre işlem sırası geçici
      durdurulan işletmeler, Tebliğin uygulamasında borsada işlem gören işletme sayılır (II yanlış). Püf noktaları: Muafiyet
      için eşik ''otuz günden fazla'' durdurmadır; 30 gün ve altı muafiyet sağlamaz. Kottan ''sürekli'' çıkarılma ile ''geçici''
      durdurma karıştırılmamalıdır.'
    celdiriciler:
      A: II numaralı işletmenin işlem sırası 30 günden fazla durdurulmadığından muafiyet kapsamında değildir; hepsi muaf diyen
        seçenek yanlıştır.
      B: III de muafiyet kapsamındadır; kotundan sürekli çıkarılan işletme ara dönem rapor düzenlemez, bu nedenle seçenek
        eksiktir.
      C: II numaralı işletmenin işlem sırası yalnızca 20 gündür durdurulmuştur; muafiyet için 30 günden fazla durdurma aranır
        ve I numaralı doğru ifade de bu seçenekte yer almaz.
      D: II numaralı işletme muaf değildir ve IV numaralı tasfiye halindeki işletme muaf olduğu hâlde bu seçenekte yer almamaktadır.
