  kok: 6362 sayılı Kanun'a göre Kurul Başkan ve üyelerinin üyeliğinin sona ermesine ilişkin aşağıdaki ifadelerden
    hangisi doğrudur?
  secenekler:
    A: Geçici iş göremezlik hâli altı aydan fazla süren üyenin üyeliği düşer.
    B: Bir takvim yılında geçerli mazereti olmaksızın toplam beş toplantıya katılmayan üye, Cumhurbaşkanının onayıyla
      görevden alınır.
    C: Göreve başladığında sahip olduğu halka açık ortaklık paylarını otuz gün içinde eşine satan üye, elden çıkarma
      yükümlülüğünü yerine getirmiş olur.
    D: Herhangi bir sebeple boşalan üyeliğe, boşalma tarihinden itibaren en geç üç ay içinde atama yapılır.
    E: Hazinece ihraç edilmiş borçlanma araçlarını göreve başlamasından itibaren otuz gün içinde elden çıkarmayan
      üye, üyelikten çekilmiş sayılır.
  dogru: A
  aciklama:
    dogru_neden: 'Md. 120/2''nin son cümlesine göre geçici iş göremezlik hâlinin altı aydan fazla sürmesi hâlinde
      bu durumdaki üyelerin üyelikleri düşer. Püf noktaları: Kanun üç ayrı sonuç öngörür ve bunlar karıştırılmamalıdır:
      ağır hastalık/engellilik nedeniyle altı aydan uzun iş görememe veya şartları kaybetme gibi hâllerde Cumhurbaşkanının
      onayı ile görevden alma (md. 120/2); geçici iş göremezliğin altı aydan fazla sürmesinde üyeliğin düşmesi (md.
      120/2); mazeretsiz beş toplantıya katılmama ve otuz gün içinde menkul kıymetleri elden çıkarmama hâllerinde
      ise üyelikten çekilmiş sayılma (md. 123/2, 121/2). Elden çıkarma yükümlülüğünde eşe, evlatlığa ve belirli
      derecedeki hısımlara yapılan satış geçerli sayılmaz; Hazinenin borçlanma araçları ve emeklilik fon payları
      ise yükümlülüğün dışındadır.'
    celdiriciler:
      B: Md. 123/2'ye göre bu üye üyelikten çekilmiş sayılır; durum Kurul kararıyla tespit edilip ilgili Bakana
        bildirilir. Cumhurbaşkanı onayıyla görevden alma md. 120/2'deki farklı hâller içindir.
      C: Md. 121/2'ye göre elden çıkarma eş, evlatlık, üçüncü dereceye kadar kan ve ikinci dereceye kadar kayın
        hısımları dışındakilere satış yoluyla yapılmalıdır; eşe satış yükümlülüğü yerine getirmez.
      D: Md. 120/1'e göre boşalan üyeliğe en geç iki ay içinde atama yapılır.
      E: Md. 121/2'de Hazine tarafından çıkarılan borçlanma araçları ile emeklilik fon payları elden çıkarma yükümlülüğünün
        dışında tutulmuştur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 120/2
    alinti: Ayrıca, geçici iş göremezlik hâlinin altı aydan fazla sürmesi hâlinde, bu durumda olan üyelerin üyelikleri
      düşer.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
