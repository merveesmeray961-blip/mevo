- id: YMM-SPM-GEN-0023
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: SPKn genel hükümler ve Kurul
  konu: GEN
  kazanim: Kurulun görev ve yetkileri
  tip: uygulama
  zorluk: 2
  kok: 'Sermaye Piyasası Kurulu ile ilişkili üç kişiye ait bilgiler şöyledir:

    - K, Mart 2025''te Kurul üyeliğinden ayrılmıştır. Eylül 2026''da kendisine bir aracı kurumda yönetim kurulu
    üyeliği teklif edilmiştir.

    - L, Haziran 2024''te Kuruldaki sermaye piyasası uzmanı kadrosundan ayrılmıştır. Ayrılmadan önceki son iki yıl
    içinde denetlediği halka açık Beta A.Ş.''de Eylül 2026''da genel müdür yardımcısı olarak çalışmaya başlamak
    istemektedir.

    - M, görevi devam eden bir Kurul üyesidir. Asli görevini aksatmayacak şekilde bir üniversitede ücret karşılığında
    ders vermek istemektedir.

    6362 sayılı Kanun''a göre bu kişilerin durumu aşağıdakilerden hangisinde doğru olarak verilmiştir?'
  secenekler:
    A: K görev alabilir, L görev alamaz, M ders verebilir.
    B: K görev alabilir, L görev alabilir, M ders veremez.
    C: K görev alamaz, L görev alamaz, M ders verebilir.
    D: K görev alamaz, L görev alabilir, M ders veremez.
    E: K görev alamaz, L görev alabilir, M ders verebilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 121/4'e göre Kurul Başkan ve üyeleri görevden ayrılmalarını izleyen iki yıl içinde yatırım
      kuruluşlarında görev alamaz; aracı kurum yatırım kuruluşudur (md. 3/1-v) ve K'nin ayrılışının üzerinden henüz
      18 ay geçmiştir. Md. 121/6'ya göre meslek personelinin son iki yılda incelediği/denetlediği halka açık ortaklıklarda
      görev alma yasağı ayrılıştan itibaren iki yıl sürer; Haziran 2024'ten Eylül 2026'ya iki yıl dolmuştur, L görev
      alabilir. Md. 121/1 üyelere asli görevlerini aksatmamak şartıyla ders verme ve ücretini alma imkânı tanır.
    celdiriciler:
      A: K bakımından iki yıllık yatırım kuruluşlarında görev alma yasağı henüz sona ermemiştir; L için ise iki
        yıllık süre dolmuştur.
      B: K'nin iki yıllık bekleme süresi dolmamıştır; M'nin ücretli ders vermesi de Kanunca serbest bırakılmıştır.
      C: L'nin yasağı ayrıldıktan sonra iki yıl boyunca sürer; Eylül 2026 itibarıyla bu süre dolmuştur.
      D: Md. 121/1, Kurul üyelerinin asli görevlerini aksatmamak kaydıyla ders vermesine ve ders ücreti almasına
        açıkça izin verir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 121/4
    alinti: Kurul Başkan ve üyeleri, görevden ayrılmalarını izleyen iki yıl içinde yatırım kuruluşlarında görev
