  kok: '6362 sayılı Kanun''un 3 üncü maddesindeki tanımlar dikkate alındığında aşağıdaki ifadelerden hangileri doğrudur?

    I. Kitle fonlama platformu aracılığıyla para toplamış olup payları başka bir yolla halka arz edilmemiş anonim
    ortaklık, bu nedenle halka açık ortaklık sayılmaz.

    II. Bu Kanuna tabi yatırım fonları ihraççı tanımı kapsamındadır.

    III. Başlangıç sermayesi, kayıtlı sermayeli anonim ortaklıkların satışı yapılmış paylarını temsil eden sermayedir.

    IV. Kayıtlı sermaye, esas sözleşmede hüküm bulunmak kaydıyla genel kurul kararıyla pay çıkarılabilecek azami
    miktarı gösteren sermayedir.'
