  aciklama:
    dogru_neden: 'I doğrudur: md. 3/1-(e) halka açık ortaklık tanımında kitle fonlaması platformları aracılığıyla
      para toplayanları açıkça hariç tutar. II doğrudur: md. 3/1-(h) ihraççıyı tüzel kişiler ve bu Kanuna tabi yatırım
      fonları olarak tanımlar. III yanlıştır: satışı yapılmış payları temsil eden sermaye çıkarılmış sermayedir
      (md. 3/1-d); başlangıç sermayesi kayıtlı sermayeli ortaklıkların sahip olması zorunlu asgari çıkarılmış sermayedir
      (md. 3/1-b). IV yanlıştır: kayıtlı sermaye, yönetim kurulu kararıyla ve TTK''nın esas sermaye artırımı hükümlerine
      tabi olmaksızın pay çıkarılabilecek, ticaret sicilinde tescil ve ilan edilmiş azami miktardır (md. 3/1-l).
      Püf noktaları: Başlangıç sermayesi ile çıkarılmış sermaye tanımları birbirine çok yakındır; biri asgari tutarı,
      diğeri satılmış payları ifade eder. Kayıtlı sermayenin özü, artırım kararının genel kurulda değil yönetim
      kurulunda alınmasıdır. Yatırım fonunun tüzel kişiliği olmasa da ihraççı sayıldığını unutmayın.'
    celdiriciler:
      A: III, çıkarılmış sermayenin tanımıdır; başlangıç sermayesi asgari çıkarılmış sermayeyi ifade eder.
      B: IV'teki 'genel kurul kararı' ifadesi yanlıştır; kayıtlı sermayede pay çıkarma yönetim kurulu kararıyla
        yapılır.
      C: I ve II doğrudur ancak III başlangıç sermayesini çıkarılmış sermaye ile karıştırmaktadır.
      E: III ve IV yanlıştır; ayrıca doğru olan I bu seçenekte yer almamaktadır.
