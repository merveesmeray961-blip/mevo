- id: YMM-SPM-GEN-0021
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: SPKn genel hükümler ve Kurul
  konu: GEN
  kazanim: Kurulun görev ve yetkileri
  tip: hesaplama
  zorluk: 2
  kok: Payları borsada işlem gören Delta A.Ş., sermaye artırımı yoluyla birim nominal değeri 1 TL olan 20.000.000
    adet payı birim fiyatı 12,50 TL'den halka arz edecektir. Kurul Karar Organınca ve Cumhurbaşkanınca farklı bir
    oran belirlenmediği, 6362 sayılı Kanun'un 130 uncu maddesinin üçüncü fıkrasında öngörülen oranın uygulanacağı
    varsayıldığında Delta A.Ş.'nin Kurul bütçesine gelir kaydedilmek üzere yatırması gereken ücret kaç TL'dir?
  secenekler:
    A: '60.000'
    B: '250.000'
    C: '500.000'
    D: '750.000'
    E: 1.500.000
  dogru: D
  aciklama:
    dogru_neden: Md. 130/3'e göre ihraççılar, satışı yapılacak sermaye piyasası araçlarının nominal değerinden aşağı
      olmamak üzere ihraç değerinin binde üçü tutarında ücret yatırır. İhraç değeri 20.000.000 × 12,50 = 250.000.000
      TL (nominal değer olan 20.000.000 TL'nin üzerinde) olduğundan ücret 250.000.000 × 3/1.000 = 750.000 TL'dir.
    celdiriciler:
      A: Ücret nominal değer (20.000.000 TL) üzerinden hesaplanmıştır; nominal değer yalnızca taban olarak işler,
        ihraç değeri daha yüksek olduğunda esas ihraç değeridir.
      B: Oran binde bir alınmıştır; Kanundaki oran binde üçtür.
      C: Oran binde iki alınmıştır; Kanundaki oran binde üçtür.
      E: Cumhurbaşkanının ücretleri kanuni oranın iki katına kadar artırma yetkisi kullanılmış gibi hesaplanmıştır;
        kökte oran değişikliği yapılmadığı belirtilmiştir.
    hesap_adimlari:
    - İhraç değeri = 20.000.000 × 12,50 = 250.000.000 TL
    - Nominal değer = 20.000.000 TL; ihraç değeri nominalin altında olmadığından esas 250.000.000 TL
    - Kurul ücreti = 250.000.000 × 0,003 = 750.000 TL
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 130/3
    alinti: İhraççılar veya halka arz edenler, Kurul bütçesine gelir kaydedilmek üzere, satışı yapılacak sermaye
      piyasası araçlarının varsa nominal değerinden aşağı olmamak üzere ihraç
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 130/3
    alinti: değerinin binde üçü tutarında ücret yatırmak zorundadır.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 20000000 * 125 // 10 * 3 // 1000
  durum: kontrolde
  surum: 1
