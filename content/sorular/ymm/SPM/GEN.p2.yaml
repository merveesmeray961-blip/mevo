- id: YMM-SPM-GEN-0026
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: SPKn genel hükümler ve Kurul
  konu: GEN
  kazanim: Kurulun görev ve yetkileri
  tip: uygulama
  zorluk: 3
  kok: 'Yedi üyeden oluşan Kurul Karar Organının dört ayrı toplantısına ilişkin bilgiler aşağıdadır (toplantıların
    tamamı gündemlidir ve oylanan konular gündemde yer almaktadır):

    I. Toplantıya dört üye katılmış, dördü de aynı yönde oy kullanmıştır.

    II. Toplantıya altı üye katılmıştır. Görüşülen konu üyelerden birinin eşinin kardeşiyle ilgili olduğundan bu
    üye müzakere ve oylamaya katılmamış; kalan beş üyeden dördü kabul, biri ret oyu vermiştir.

    III. Toplantıya beş üye katılmış; üç üye kabul oyu vermiş, iki üye çekimser kalmıştır.

    IV. Toplantıya beş üye katılmış; dört üye kabul, bir üye ret oyu vermiştir. Görüşünden yararlanılmak üzere davet
    edilen Kurul dışından bir akademisyen, oylama sırasında da toplantı salonunda bulunmuştur.

    6362 sayılı Kanun''a göre bu toplantıların hangilerinde Kanuna uygun biçimde karar alınmıştır?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve IV
    E: I, II ve IV
  dogru: B
  aciklama:
    dogru_neden: 'Md. 123/3''e göre Kurul Karar Organı en az beş üye ile toplanır, en az dört üyenin aynı yöndeki
      oyuyla karar alır ve üyeler çekimser oy kullanamaz. I''de toplantı yeter sayısı (beş) yoktur. II''de altı
      üye toplanmıştır; eşinin kardeşi ikinci derece kayın hısımı olduğundan ilgili üye md. 123/4 gereği oylamaya
      katılamaz, ancak kalan beş üyeden dördünün aynı yönde oy vermesiyle karar geçerlidir. III''te çekimser oy
      kullanılamaz ve aynı yönde dört oy yoktur. IV''te sayılar yeterli olsa da md. 123/5''e göre Kurul kararları
      toplantıya dışarıdan katılanların yanında alınamaz. Püf noktaları: Toplantı yeter sayısı (beş) ile karar yeter
      sayısını (aynı yönde dört) ayrı ayrı kontrol edin; hısımlık nedeniyle oylamaya katılamayan üye olsa bile kalan
      oylar dört aynı yönlü oyu sağlıyorsa karar alınır. Dışarıdan davet edilen kişi görüş verebilir, ama karar
      onun yanında alınamaz.'
    celdiriciler:
      A: I'de toplantıya yalnız dört üye katılmıştır; Kanun en az beş üyeyle toplanmayı şart koşar.
      C: II doğru olsa da I'de toplantı yeter sayısı sağlanmamıştır.
      D: IV'te karar, Kurul dışından davet edilen kişinin yanında alınmıştır; md. 123/5 buna izin vermez.
      E: I'de toplantı yeter sayısı yok, IV'te ise karar dışarıdan katılan kişinin yanında alınmıştır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 123/3
    alinti: Kurul Karar Organı, en az beş üye ile toplanır ve en az dört üyenin aynı yöndeki oyuyla karar alır.
      Üyeler çekimser oy kullanamaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 123/4
    alinti: Kurul Başkan ve üyeleri kendisi, eşi, evlatlıkları ve üçüncü derece dâhil kan ve ikinci derece dâhil
      kayın hısımlarıyla ilgili konularda müzakere ve oylamaya katılamazlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 123/5
    alinti: Ancak, Kurul kararları toplantıya dışarıdan katılanların yanında alınamaz.
