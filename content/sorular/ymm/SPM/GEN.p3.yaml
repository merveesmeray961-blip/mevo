    I. Yatırım kuruluşları sermaye piyasası kurumu sayılır.

    II. Kolektif yatırım kuruluşları sermaye piyasası kurumu sayılır.

    III. Bağımsız denetim kuruluşları sermaye piyasası kurumu sayılır.

