      belirlenen diğer kuruluşlardır. Bağımsız denetim kuruluşları da md. 35''te sayılmakla birlikte bu sorudaki
      değerlendirmede III. önerme yanlış kurgulanmıştır; bağımsız denetim kuruluşları ayrı bir kategori olarak yer
