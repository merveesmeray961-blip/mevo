      A: Yalnız I seçeneği II. önermeyi dışarda bırakır; kolektif yatırım kuruluşları da md. 35'te açıkça sayılmıştır.
      B: Yalnız II seçeneği I. önermeyi dışlar; yatırım kuruluşları da md. 35 kapsamındadır.
