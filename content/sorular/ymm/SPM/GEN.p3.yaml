    '
  secenekler:
    A: Kurul, Hazine Müsteşarlığına bağlı olarak faaliyet gösterir.
    B: Kurul, sermaye piyasasında denetim görevi yürütür; ancak yaptırım uygulama yetkisi münhasıran mahkemelere
      aittir.
    C: Kurul, kendi görev alanıyla sınırlı olmak üzere idari para cezası uygulama yetkisine sahiptir.
    D: Kurul kararlarına karşı idare mahkemelerinde değil Danıştay'da ilk derece davası açılabilir.
    E: Kurulun düzenleyici işlemleri Resmî Gazete'de yayımlanmadan önce Cumhurbaşkanlığı onayına tabidir.
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 4 uyarınca Kurul, sermaye piyasasının düzenlenmesi ve denetlenmesi amacıyla idari yaptırım
      uygulama yetkisine —idari para cezası dahil— sahip özerk bir kamu kurumudur. Püf noktaları: Kurulun yaptırım
      yetkisi münhasıran yargıya ait değildir; Kurul kendisi idari para cezası uygulayabilir.'
    celdiriciler:
      A: Kurul, idari ve mali özerkliğe sahip olup herhangi bir bakanlığa bağlı değildir.
      B: Kurul, SPKn'nın öngördüğü yaptırımları —idari para cezası, faaliyet durdurma vb.— bizzat uygulayabilir.
      D: Kurul kararları idare mahkemesinde de itiraz konusu yapılabilir; Danıştay münhasır yetki sahibi değildir.
      E: Kurulun tebliğ ve kararları Cumhurbaşkanlığı onayına tabi olmaksızın Resmî Gazete'de yayımlanır.
