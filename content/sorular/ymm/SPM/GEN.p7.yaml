  kok: Kamu görevlisi iken Kurul üyeliğine atanan (Z), görev süresinin dolması nedeniyle 15 Mart 2026 tarihinde üyelikten
    ayrılmıştır. (Z) memuriyete giriş şartlarını kaybetmemiştir ve eski kurumuna başvurabileceği son günde başvurmuştur. 6362
    sayılı Kanun'un 132 nci maddesine göre atamaya yetkili makamın (Z)'yi mükteseplerine uygun bir kadroya atamak zorunda
    olduğu son tarih hangisidir?
  secenekler:
    A: 14 Nisan 2026
    B: 14 Mayıs 2026
    C: 13 Haziran 2026
    D: 15 Eylül 2026
    E: 15 Mart 2027
  dogru: B
  aciklama:
    dogru_neden: 'Md. 132/1''e göre kamu görevlisi iken üyeliğe atananlar, görev sürelerinin sona ermesi veya görevden ayrılma
      isteğinde bulunmaları ve otuz gün içinde eski kurumlarına başvurmaları durumunda atamaya yetkili makam tarafından bir
      ay içinde mükteseplerine uygun bir kadroya atanır. Başvuru için son gün 15 Mart 2026 + 30 gün = 14 Nisan 2026; bir ay
      sonrası 14 Mayıs 2026''dır. Püf noktaları: İki ayrı süre vardır; otuz günlük süre üyeye, bir aylık süre atama makamına
      aittir ve ikincisi başvurudan itibaren işler. İki yıllık süre ise Kurulca yapılacak ödemeler içindir.'
    celdiriciler:
      A: 14 Nisan 2026 üyenin eski kurumuna başvuru için son günüdür; atama süresi başvurudan sonra başlar.
      C: 13 Haziran 2026, iki aylık bir süreye karşılık gelir; Kanun atama için bir ay öngörür.
      D: 15 Eylül 2026, altı aylık bir süredir; Kanunda böyle bir atama süresi yoktur.
      E: 15 Mart 2027, bir yıllık bir süredir; atama için Kanunda böyle bir süre yoktur. İki yıllık sınır ise Kurulca yapılacak
        ödemelere ilişkindir.
    hesap_adimlari:
    - 'Görev süresi sona erdi: 15 Mart 2026'
    - 'Başvuru için son gün: 15 Mart + 30 gün = 14 Nisan 2026'
    - 'Atama süresi: başvurudan itibaren bir ay = 14 Mayıs 2026'
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 132/1
    alinti: Ancak, kamu görevlisi iken üyeliğe atananlar, memuriyete giriş şartlarını kaybetmemeleri kaydıyla, görev sürelerinin
      sona ermesi veya görevden ayrılma isteğinde bulunmaları ve otuz gün içinde eski kurumlarına başvurmaları durumunda atamaya
      yetkili makam tarafından bir ay içinde mükteseplerine uygun bir kadroya atanır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 132/1
    alinti: Bu maddede belirtilen nedenlerle üyeliği sona erenlere Kurul tarafından yapılacak ödemelerin süresi iki yılı geçemez.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "class _D:\n    def __init__(s, o): s.o = o\n    @staticmethod\n    def _civ(y, m, d):\n        y -= m <= 2\n\
      \        era = y // 400\n        yoe = y - era * 400\n        doy = (153 * (m + (-3 if m > 2 else 9)) + 2) // 5 + d\
      \ - 1\n        doe = yoe * 365 + yoe // 4 - yoe // 100 + doy\n        return era * 146097 + doe - 719468\n    @property\n\
      \    def _ymd(s):\n        n = s.o + 719468\n        era = n // 146097\n        doe = n - era * 146097\n        yoe\
      \ = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n        y = yoe + era * 400\n        doy = doe - (365\
      \ * yoe + yoe // 4 - yoe // 100)\n        mp = (5 * doy + 2) // 153\n        d = doy - (153 * mp + 2) // 5 + 1\n   \
      \     m = mp + 3 if mp < 10 else mp - 9\n        return y + (m <= 2), m, d\n    year = property(lambda s: s._ymd[0])\n\
      \    month = property(lambda s: s._ymd[1])\n    day = property(lambda s: s._ymd[2])\n    def weekday(s): return (s.o\
      \ + 3) % 7\n    def isoformat(s): return '%04d-%02d-%02d' % s._ymd\n    def __add__(s, t): return _D(s.o + t.days)\n\
      \    def __sub__(s, t):\n        return _D(s.o - t.days) if isinstance(t, _T) else _T(s.o - t.o)\n    def __eq__(s,\
      \ t): return s.o == t.o\n    def __lt__(s, t): return s.o < t.o\n    def __le__(s, t): return s.o <= t.o\n    def __gt__(s,\
      \ t): return s.o > t.o\n    def __ge__(s, t): return s.o >= t.o\n    def __hash__(s): return hash(s.o)\nclass _T:\n\
      \    def __init__(s, days): s.days = days\ndef _date(y, m, d): return _D(_D._civ(y, m, d))\ndef _td(days=0, weeks=0):\
      \ return _T(days + 7 * weeks)\nclass dt:\n    date = staticmethod(_date)\n    timedelta = staticmethod(_td)\nson_basvuru\
      \ = dt.date(2026,3,15) + dt.timedelta(days=30)\nsonuc = dt.date(son_basvuru.year, son_basvuru.month + 1, son_basvuru.day).isoformat()\
      \  # 2026-05-14"
