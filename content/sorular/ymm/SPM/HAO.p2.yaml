    - '9 Mart satış 3.000 → LIFO: önce 2.000 yeni pay, sonra 1.000 eski pay → hakka konu pay 9.000'
    - 12 Mart gün sonu net değişim 0 → etkisiz
    - 'Fiyat: Yıldız Pazar → son 1 aylık ortalama 24 TL'
    - Bedel = 9.000 × 24 = 216.000 TL
