  tip: uygulama
  zorluk: 1
  kok: Payları borsada işlem gören Kappa A.Ş.'nin sermayesinde doğrudan pay sahibi olan gerçek kişilerin pay oranlarında aşağıdaki
    değişiklikler meydana gelmiştir. Bu değişikliklerden hangisi, Özel Durumlar Tebliği (II-15.1)'nin 12 nci maddesinde sayılan
    oranlardan birine ulaşma veya bu oranlardan birinin altına düşme niteliği **taşımaz**?
  secenekler:
    A: '%4,8''den %5,3''e yükselme'
    B: '%34''ten %32''ye düşme'
    C: '%66''dan %68''e yükselme'
    D: '%26''dan %24''e düşme'
    E: '%16''dan %19''a yükselme'
  dogru: E
  aciklama:
    dogru_neden: 'II-15.1 md. 12/1-(a)''da sayılan oranlar %5, %10, %15, %20, %25, %33, %50, %67 ve %95''tir. %16''dan %19''a
      yükselişte bu oranlardan hiçbirine ulaşılmamış veya altına düşülmemiştir (%15 zaten aşılmış durumdadır, %20''ye henüz
      ulaşılmamıştır). Not: Doğrudan pay sahipliğinde eşik geçişlerine ilişkin açıklama md. 12/4 uyarınca MKK tarafından yapılır.'
    celdiriciler:
      A: '%5 eşiğine ulaşılmıştır.'
      B: '%33 eşiğinin altına düşülmüştür; listede %30 veya %35 değil %33 yer alır.'
      C: '%67 eşiğine ulaşılmıştır; listede %66 değil %67 vardır.'
      D: '%25 eşiğinin altına düşülmüştür.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Özel Durumlar Tebliği (II-15.1)
    madde: md. 12/1-(a)
    alinti: a) Bir gerçek veya tüzel kişinin ya da bu gerçek veya tüzel kişi ile birlikte hareket eden diğer gerçek veya tüzel
