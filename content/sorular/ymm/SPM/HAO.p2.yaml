  kazanim: kayıtlı sermaye
  tip: uygulama
  zorluk: 1
  kok: Kayıtlı sermaye sistemine geçmek isteyen Teta A.Ş.'ye Kurul tarafından 15 Eylül 2026 tarihinde kayıtlı sermaye tavanı
    izni verilmiştir. Kurul, şirket için beş yıldan kısa bir süre belirlememiştir. Kayıtlı Sermaye Sistemi Tebliği (II-18.1)'ne
    göre izin verilen kayıtlı sermaye tavanı hangi tarihe kadar geçerlidir?
  secenekler:
    A: 31 Aralık 2029
    B: 15 Eylül 2030
    C: 31 Aralık 2030
    D: 15 Eylül 2031
    E: 31 Aralık 2031
  dogru: C
  aciklama:
    dogru_neden: II-18.1 md. 6/2'ye göre Kurulca izin verilen kayıtlı sermaye tavanı, iznin verildiği yıl da dâhil olmak üzere
      beş yıllık süre için geçerlidir ve sürenin hesaplanmasında takvim yılı esas alınır. 2026, 2027, 2028, 2029 ve 2030 yılları
      beş yılı oluşturduğundan izin 31 Aralık 2030'a kadar geçerlidir.
    celdiriciler:
      A: İzin yılı da dâhil edilir; ancak beş takvim yılı 2030 sonunda dolar, 2029 sonu yalnızca dördüncü yılın sonudur.
      B: Süre izin tarihinden itibaren gün gün değil takvim yılı esasına göre hesaplanır; ayrıca bu tarih dört yıllık bir
        süreye karşılık gelir.
      D: Süre izin tarihinden itibaren beş tam yıl olarak hesaplanmıştır; Tebliğ takvim yılını esas alır ve izin yılını süreye
        dâhil eder.
      E: İzin yılı süreye dâhil edilmeden 2027'den başlayarak beş takvim yılı sayılmıştır; Tebliğ iznin verildiği yılı da
        süreye katar.
