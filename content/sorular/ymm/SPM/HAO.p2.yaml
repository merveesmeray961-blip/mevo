    2 Mart 2026''da kamuya açıklanmıştır; bu tarihten önce işleme ilişkin herhangi bir açıklama yapılmamıştır. Pay sahibi
    S''nin bu tarihteki pay sayısı 10.000''dir. S''nin genel kurul tarihine kadar borsada yaptığı işlemler şöyledir:

