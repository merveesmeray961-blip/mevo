  kok: Halka açık Pi A.Ş. kayıtlı sermaye sistemine geçmek için Kurula başvuracaktır. Başvuru tarihine en yakın, bağımsız
    denetimden geçmiş 30.06.2026 tarihli finansal tablolarına göre şirketin çıkarılmış sermayesi 40.000.000 TL, özsermayesi
    60.000.000 TL'dir; şirketin konsolide finansal tablosu bulunmamaktadır. Şirket 30.06.2026'dan sonra ve başvurudan önce
    nakden yaptığı sermaye artırımıyla çıkarılmış sermayesini 80.000.000 TL'ye yükseltmiştir. Kayıtlı Sermaye Sistemi Tebliği
    (II-18.1)'ne göre Kurulca izin verilebilecek kayıtlı sermaye tavanının üst sınırı kaç TL'dir?
