- id: YMM-SPM-HAO-0033
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: önemli nitelikteki işlemler ve ayrılma hakkı
  tip: uygulama
  zorluk: 2
  kok: Payları borsada işlem gören Mu A.Ş.'nin çıkarılmış sermayesi 200.000.000 TL olup tüm paylar oy hakkını haizdir (her
    1 TL nominal pay bir oy). Şirket, önemli nitelikteki işlem sayılan bir mal varlığı devrini genel kurul onayına sunmuştur.
    Toplantıya 90.000.000 TL nominal değerli pay katılmış; 56.000.000 TL olumlu, 34.000.000 TL olumsuz oy kullanılmıştır.
    Esas sözleşmede daha ağır nisap öngörülmemiştir ve oy kullanma yasağı bulunan pay sahibi yoktur. Önemli Nitelikteki İşlemler
    ve Ayrılma Hakkı Tebliği (II-23.3)'ne göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Olumlu oylar toplantıya katılanların çoğunluğunu oluşturduğundan işlem onaylanmıştır.
    B: Onay için 60.000.000 TL nominal değerli payın olumlu oyu gerektiğinden işlem reddedilmiştir.
    C: Sermayenin yarısı toplantıda hazır bulunmadığından toplantı nisabı oluşmamış, işlem görüşülemez.
    D: Onay için 100.000.000 TL nominal değerli payın olumlu oyu gerektiğinden işlem reddedilmiştir.
    E: Onay için sermayenin üçte ikisini temsil eden payların olumlu oyu gerektiğinden işlem reddedilmiştir.
  dogru: B
  aciklama:
    dogru_neden: 'II-23.3 md. 10/2''ye göre toplantı nisabı aranmaksızın toplantıya katılan oy hakkını haiz payların üçte
      ikisinin olumlu oyu gerekir; ancak toplantıda sermayenin en az yarısı hazır bulunursa katılanların çoğunluğu yeterlidir.
      Toplantıya katılan 90.000.000 TL, sermayenin yarısı olan 100.000.000 TL''nin altında olduğundan üçte iki kuralı uygulanır:
      90.000.000 × 2/3 = 60.000.000 TL. Olumlu oy 56.000.000 TL olduğundan işlem reddedilmiştir.'
    celdiriciler:
      A: Çoğunluk kuralı yalnızca sermayenin en az yarısı toplantıda hazır bulunduğunda uygulanır; burada hazır bulunan pay
        oranı %45'tir.
      C: Önemli nitelikteki işlemlerde toplantı nisabı aranmaz; sermayenin yarısının hazır bulunması yalnızca daha düşük karar
        nisabını devreye sokar.
      D: Karar nisabı sermayenin yarısı değil, toplantıya katılan payların üçte ikisidir.
      E: Üçte ikilik oran sermaye üzerinden değil, toplantıya katılan oy hakkını haiz paylar üzerinden hesaplanır.
    hesap_adimlari:
    - Sermayenin yarısı = 100.000.000 TL; katılan 90.000.000 TL < 100.000.000 TL → üçte iki kuralı
    - Gerekli olumlu oy = 90.000.000 × 2/3 = 60.000.000 TL
    - 56.000.000 < 60.000.000 → işlem onaylanmamıştır
  kaynaklar:
  - mevzuat: Önemli Nitelikteki İşlemler ve Ayrılma Hakkı Tebliği (II-23.3)
    madde: md. 10/2
    alinti: Önemli nitelikteki işlemlere ilişkin kararların genel kurulca alınabilmesi için, esas sözleşmede açıkça oran belirtilmek
      suretiyle daha ağır nisaplar öngörülmediği takdirde, toplantı nisabı aranmaksızın, ortaklık genel kurul toplantısına
      katılan oy hakkını haiz payların üçte ikisinin olumlu oy vermesi şartı aranır. Ancak, toplantıda sermayeyi temsil eden
      oy hakkını haiz payların en az yarısının hazır bulunması hâlinde, esas sözleşmede açıkça daha ağır nisaplar öngörülmedikçe,
      toplantıya katılan oy hakkını haiz payların çoğunluğu ile karar alınır.
  gecerlilik:
    baslangic: '2020-06-27'
    bitis: null
    yila_bagli_tutar: false
