      C: 12 Mart'taki gün içi satış da düşülmüştür; Tebliğ gün sonu net bakiyeleri esas aldığından aynı gün alınıp satılan
        paylar etkisizdir.
      E: Açıklama tarihinden sonraki satış hiç dikkate alınmamıştır; genel kurula kadar yapılan satışlar hakka konu paylardan
        düşülür.
