    madde: md. 5/4
    alinti: Kurulca beş yıl süreyle geçerli olmak üzere izin verilecek kayıtlı sermaye tavanı, ortaklıkların ödenmiş/çıkarılmış
      sermayesi veya özsermayesinden yüksek olanının beş katını aşamaz.
  - mevzuat: Kayıtlı Sermaye Sistemi Tebliği (II-18.1)
    madde: md. 5/5
    alinti: Kayıtlı sermaye tavanına ilişkin üst limitin belirlenmesinde esas alınacak finansal tablolara ilişkin dönem sonu
