  tip: uygulama
  zorluk: 2
  kok: Payları borsada işlem gören Lambda A.Ş.'nin genel kuruluna bağımsız yönetim kurulu üyesi olarak önerilecek adaylara
    ilişkin bilgiler aşağıdadır. Adayların, belirtilen husus dışındaki tüm bağımsızlık kriterlerini sağladığı varsayıldığında,
    Kurumsal Yönetim Tebliği (II-17.1) ekindeki (4.3.6.) numaralı ilke uyarınca hangi aday bağımsız üye olarak nitelendirilemez?
  secenekler:
    A: Son on yılda Lambda A.Ş. yönetim kurulunda toplam yedi yıl üyelik yapmış aday
    B: Lambda A.Ş.'deki genel müdür yardımcılığı görevi altı yıl önce sona ermiş olan aday
    C: Kendisi %2, eşi %2,5 oranında Lambda A.Ş. payına sahip olan aday
    D: Bir devlet üniversitesinde tam zamanlı öğretim üyesi olarak çalışan aday
    E: Yurt dışında yaşamakla birlikte Gelir Vergisi Kanunu'na göre Türkiye'de yerleşmiş sayılan aday
  dogru: A
  aciklama:
    dogru_neden: (4.3.6.)-(g) bendine göre bağımsız üye, şirketin yönetim kurulunda son on yıl içinde altı yıldan fazla yönetim
      kurulu üyeliği yapmamış olmalıdır. Yedi yıl üyelik bu sınırı aştığından aday bağımsız sayılamaz.
    celdiriciler:
      B: (a) bendi son beş yıl içinde yönetici pozisyonunda istihdam ilişkisinin bulunmamasını arar; görevi altı yıl önce
        sona eren aday bu şartı sağlar.
      C: (a) bendine göre aday, eşi ve ikinci dereceye kadar hısımlarıyla birlikte veya tek başına sermayenin %5'inden fazlasına
        sahip olmamalıdır; birlikte pay %4,5 olduğundan şart sağlanır.
      D: (ç) bendi kamu kurum ve kuruluşlarında tam zamanlı çalışmamayı ararken üniversite öğretim üyeliğini açıkça istisna
        tutar.
      E: (d) bendi Gelir Vergisi Kanunu'na göre Türkiye'de yerleşmiş sayılmayı arar; fiilen yurt dışında yaşamak tek başına
        engel değildir.
    hesap_adimlari: []
  kaynaklar:
