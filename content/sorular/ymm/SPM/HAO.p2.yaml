- id: YMM-SPM-HAO-0034
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: birleşme ve bölünme
  tip: uygulama
  zorluk: 2
  kok: 'Payları borsada işlem gören Nu A.Ş., oy hakkı veren paylarının %96''sına sahip olduğu Ksi A.Ş.''yi devralma yoluyla
    bünyesine katacaktır. Ksi A.Ş.''nin diğer ortaklarına Nu A.Ş. payları verilmesi gerekmekte olup bu payların nakit karşılığı
    Ksi A.Ş. ortaklarına seçimlik hak olarak önerilecektir. Birleşme ve Bölünme Tebliği (II-23.2) ile Önemli Nitelikteki İşlemler
    ve Ayrılma Hakkı Tebliği (II-23.3) çerçevesinde aşağıdaki ifadelerden hangileri doğrudur?

    I. Birleşme kolaylaştırılmış usulde gerçekleştirilebilir.

    II. Kolaylaştırılmış usulün uygulanması hâlinde bağımsız denetim raporu, birleşme raporu ve uzman kuruluş görüşü aranmaz.

    III. Kolaylaştırılmış usulde birleşme sözleşmesinin Nu A.Ş. genel kurulunun onayına sunulması zorunludur.

    IV. Kolaylaştırılmış usulde gerçekleştirilen bu birleşmede ayrılma hakkı doğmaz.'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve III
    D: I, II ve IV
    E: I, III ve IV
  dogru: D
  aciklama:
    dogru_neden: II-23.2 md. 13/1'e göre bir sermaye şirketinin oy hakkı veren paylarının %95 veya daha fazlasına sahip halka
      açık ortaklık tarafından devralınmasında, devrolunan şirket ortaklarına pay verilmesi gerekse bile payların nakit karşılığı
      seçimlik hak olarak önerildiğinde kolaylaştırılmış usul uygulanabilir (I doğru). Md. 13/2'ye göre bu usulde bağımsız
      denetim raporu, birleşme raporu ve uzman kuruluş görüşü aranmaz (II doğru) ve birleşme sözleşmesinin genel kurul onayına
      sunulması zorunlu değildir (III yanlış). II-23.3 md. 15/1-(ç)'ye göre kolaylaştırılmış usulde birleşme işlemlerinde
      ayrılma hakkı doğmaz (IV doğru).
    celdiriciler:
      A: IV de doğrudur; II-23.3 md. 15/1-(ç) kolaylaştırılmış usulde birleşmeyi ayrılma hakkının doğmadığı hâller arasında
        sayar.
      B: III yanlıştır; kolaylaştırılmış usulde birleşme sözleşmesinin genel kurul onayına sunulması zorunlu değildir. I de
        doğru olduğu hâlde seçenekte yoktur.
      C: III, md. 13/2'ye aykırıdır; IV ise doğru olduğu hâlde seçenekte yoktur.
      E: III yanlıştır; II ise doğru olduğu hâlde seçenekte yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: Birleşme ve Bölünme Tebliği (II-23.2)
    madde: md. 13/1
    alinti: Bir veya birden fazla sermaye şirketinin oy hakkı veren paylarının %95 veya daha fazlasına sahip bir halka açık
      ortaklık tarafından devralınması suretiyle birleşmede, halka açık ortaklık paylarından devrolunan şirketlerin ortaklarına
      pay verilmesini gerektirmeyen durumlarda veya halka açık ortaklık paylarından devrolunan şirketlerin ortaklarına pay
      verilmesi gereken ancak halka açık ortaklık paylarının nakit karşılığının devrolunan şirketlerin ortaklarına seçimlik
      hak olarak önerilmesi durumlarında, kolaylaştırılmış usulde birleşme uygulanabilir.
