    madde: İlke 4.3.6-(g)
    alinti: g) Şirketin yönetim kurulunda son on yıl içerisinde altı yıldan fazla yönetim kurulu üyeliği yapmamış olması.
  - mevzuat: Kurumsal Yönetim Tebliği (II-17.1) Ek — Kurumsal Yönetim İlkeleri
