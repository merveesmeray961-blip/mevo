  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kâr payı dağıtımı
  tip: hesaplama
  zorluk: 3
  kok: 'Payları borsada işlem gören Omikron A.Ş.''nin esas sözleşmesinde kâr payı avansı dağıtılabileceğine ilişkin hüküm
    bulunmakta olup genel kurul, 2026 hesap dönemiyle sınırlı olarak yönetim kuruluna kâr payı avansı dağıtma yetkisi vermiştir.
    Şirket 2026 yılının ilk 3 aylık ara dönemine ilişkin olarak 2.000.000 TL kâr payı avansı ödemiştir. 9 aylık ara dönem
    finansal tablolarına ilişkin bilgiler şöyledir:

    - Ara dönem net dönem kârı: 20.000.000 TL

    - TTK ve esas sözleşmeye göre ayrılması gereken yedek akçeler: 2.000.000 TL

    - Geçmiş yıllar zararı: yoktur

    - Ara dönem net dönem kârı hariç kâr dağıtımına konu edilebilecek diğer kaynaklar: 6.000.000 TL

    Şirketin 2025 yılı net dönem kârı 14.000.000 TL''dir. Kâr Payı Tebliği (II-19.1)''ne göre 9 aylık ara dönem finansal tablolarına
    dayanılarak dağıtılabilecek azami kâr payı avansı kaç TL''dir?'
  secenekler:
    A: 4.000.000
    B: 5.000.000
    C: 6.000.000
    D: 7.000.000
    E: 9.000.000
  dogru: A
  aciklama:
    dogru_neden: 'II-19.1 md. 10/1''e göre avans, ara dönem net dönem kârından yedek akçeler ve geçmiş yıllar zararları düşüldükten
      sonra kalanın yarısını geçemez: (20.000.000 − 2.000.000) / 2 = 9.000.000 TL. Md. 10/2''ye göre bir hesap döneminde verilecek
      toplam avans, bir önceki yıl net dönem kârının yarısı (14.000.000 / 2 = 7.000.000 TL) ile ara dönem kârı hariç dağıtılabilir
      diğer kaynaklardan (6.000.000 TL) düşük olanı, yani 6.000.000 TL''yi aşamaz. Md. 10/3''e göre önceki ara dönemde ödenen
      2.000.000 TL bu tutardan indirilir: 6.000.000 − 2.000.000 = 4.000.000 TL. İki sınırdan düşük olan 4.000.000 TL dağıtılabilir.
      Püf noktaları: Üç ayrı kontrol vardır: ara dönem kârına dayalı sınır (md. 10/1), dönem toplamı için ''önceki yıl kârının
      yarısı ile diğer kaynaklardan düşük olanı'' sınırı (md. 10/2) ve aynı dönemde önceden ödenen avansın bu toplam sınırdan
      indirilmesi (md. 10/3). En düşük sonuç bağlayıcıdır.'
    celdiriciler:
      B: Önceki yıl kârının yarısından (7.000.000 TL) önceki avans düşülmüş, ancak md. 10/2-(b)'deki diğer kaynaklar sınırı
        (6.000.000 TL) göz ardı edilmiştir.
      C: Md. 10/2'deki dönem sınırı doğru bulunmuş, ancak aynı dönemde daha önce ödenen 2.000.000 TL'lik avans md. 10/3 uyarınca
        indirilmemiştir.
      D: Yalnızca önceki yıl net dönem kârının yarısı esas alınmış; diğer kaynaklar sınırı ve önceki avans dikkate alınmamıştır.
      E: Yalnızca md. 10/1'deki ara dönem kârına dayalı sınır uygulanmış; dönem toplamına ilişkin sınırlar göz ardı edilmiştir.
    hesap_adimlari:
    - 'md. 10/1 sınırı: (20.000.000 − 2.000.000) / 2 = 9.000.000 TL'
    - 'md. 10/2 dönem sınırı: min(14.000.000 / 2 = 7.000.000; 6.000.000) = 6.000.000 TL'
    - 'md. 10/3: 6.000.000 − 2.000.000 (önceki avans) = 4.000.000 TL'
    - Azami avans = min(9.000.000; 4.000.000) = 4.000.000 TL
  kaynaklar:
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/1
    alinti: Dağıtılacak kâr payı avansı, ara dönem finansal tablolara göre oluşan net dönem kârından TTK’ya ve esas sözleşmeye
      göre ayrılması gereken yedek akçeler ile geçmiş yıllar zararları düşüldükten sonra kalan kısmın yarısını geçemez.
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/2
    alinti: a) Bir önceki yıla ait net dönem kârının yarısından, b) İlgili ara dönem finansal tablolarında yer alan net dönem
      kârı hariç kâr dağıtımına konu edilebilecek diğer kaynaklardan düşük olanı aşamaz.
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 10/3
    alinti: Aynı hesap dönemi içinde birden fazla sayıda kâr payı avansı ödemesi yapıldığı takdirde; sonraki ara dönemlerde
      ödenecek kâr payı avansları hesaplanırken, önceki ara dönemlerde ödenen kâr payı avansları bu maddenin ikinci fıkrasına
      göre hesaplanan tutardan indirilir.
