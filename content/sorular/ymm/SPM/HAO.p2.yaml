      fıkrada belirtilen finansal tablolarda yer alan özsermaye toplamından yüksek olması durumunda, kayıtlı sermaye tavanının
      hesaplanmasında ortaklığın güncel ödenmiş/çıkarılmış sermayesi esas alınır.
