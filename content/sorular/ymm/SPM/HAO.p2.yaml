    dogru_neden: 'II-23.3 md. 11/2''ye göre ayrılma hakkına konu pay tutarı, yönetim kurulu kararının kamuya açıklandığı tarihte
      sahip olunan paylardan genel kurula kadar yapılan satışların son giren ilk çıkar (LIFO) esasına göre ve gün sonu net
      bakiyeler üzerinden düşülmesiyle bulunur. 9 Mart''taki 3.000 paylık satış önce 5 Mart''ta alınan 2.000 paydan, kalan
      1.000 pay açıklama tarihindeki paylardan düşülür: 10.000 − 1.000 = 9.000 pay. 12 Mart''ta gün sonu net bakiye değişmediğinden
      (alış ve satış eşit) hesaba etkisi yoktur. Md. 14/1''e göre Yıldız Pazar''da işlem gören paylarda fiyat, açıklama tarihinden
      önceki son bir aylık ortalamadır (24 TL). Md. 12/4''e göre hak, bu hakka sahip payların tamamı için kullanılır: 9.000
      × 24 = 216.000 TL. Püf noktaları: LIFO esası, açıklamadan sonra alınan payların önce satılmış sayılmasını sağlar; böylece
      açıklama tarihindeki paylar korunur. Gün içi alım-satımlar gün sonu net bakiyeye etki etmiyorsa dikkate alınmaz. Fiyat
