  aciklama:
    dogru_neden: 'II-18.1 md. 5/4''e göre kayıtlı sermaye tavanı, ödenmiş/çıkarılmış sermaye veya özsermayeden yüksek olanının
      beş katını aşamaz ve esas alınan finansal tablolar başvuru tarihine en yakın bağımsız denetimden geçmiş tablolardır.
      Md. 5/5''e göre bu tabloların dönem sonundan sonra sermaye artırılmış ve artırım sonrası sermaye, tablolardaki özsermayeden
      yüksekse güncel ödenmiş/çıkarılmış sermaye esas alınır. Artırım sonrası sermaye 80.000.000 TL, tablolardaki özsermaye
      60.000.000 TL olduğundan esas tutar 80.000.000 TL''dir: 80.000.000 × 5 = 400.000.000 TL. Püf noktaları: Önce iki tutardan
      yükseği seçilir; ancak tablo tarihinden sonra yapılan artırım, sermayeyi özsermayenin üstüne çıkarıyorsa güncel sermaye
      esas alınır. Artırım tutarını özsermayeye ekleyerek yeni bir özsermaye hesaplamak Tebliğin öngördüğü yöntem değildir.'
    celdiriciler:
      A: Tablolardaki eski çıkarılmış sermaye (40.000.000 TL) esas alınmıştır; hem özsermaye daha yüksektir hem de sonraki
        artırım dikkate alınmalıdır.
      B: Tablolardaki özsermaye (60.000.000 TL) esas alınmış, tablo tarihinden sonraki artırımla güncel sermayenin özsermayeyi
        aştığı göz ardı edilmiştir.
      D: Artırım tutarı (40.000.000 TL) özsermayeye eklenerek 100.000.000 TL'lik bir tutar türetilmiştir; Tebliğ bu durumda
        güncel çıkarılmış sermayenin esas alınmasını öngörür.
      E: Güncel sermaye ile özsermaye toplanmıştır; Tebliğ iki tutardan yüksek olanını esas alır, toplamını değil.
    hesap_adimlari:
    - 'Tablolara göre: çıkarılmış sermaye 40.000.000 TL, özsermaye 60.000.000 TL'
    - 'Tablo tarihinden sonra artırım: güncel çıkarılmış sermaye 80.000.000 TL > özsermaye 60.000.000 TL → güncel sermaye
      esas'
    - Üst sınır = 80.000.000 × 5 = 400.000.000 TL
