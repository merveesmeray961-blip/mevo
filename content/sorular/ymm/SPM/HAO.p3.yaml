    hangisi **geçerli değildir**?

    '
  secenekler:
    A: Bağımsız üyeler, görev süreleri boyunca şirketten bağımsızlıklarını korumalıdır.
    B: Bağımsız üye sayısı, yönetim kurulu üye tam sayısının üçte birinden az olamaz.
    C: Bağımsız üye adayları yönetim kurulu tarafından belirlenir ve genel kurulda onaylanır.
    D: Bağımsız üyelerin pay sahipliği, bağımsızlıklarını her koşulda ortadan kaldırır.
