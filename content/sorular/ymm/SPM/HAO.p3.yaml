      yanlıştır. Püf noktaları: Tebliğde pay sahipliği sınırı belirli bir oran olarak düzenlenmiştir; mutlak yasak
      değildir. Bağımsızlık kriterleri listesi kümülatif değerlendirme gerektirir.'
