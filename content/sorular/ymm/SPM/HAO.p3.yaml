      kurulun yetkisini ihlal eder (III yanlış). Püf noktaları: Kâr payı dağıtım kararı münhasıran genel kurula
      aittir; yönetim kurulu tek başına bu kararı veremez.'
    celdiriciler:
      A: II de mümkün olduğundan yalnız I yanlıştır.
      C: III yönetim kurulunun tek başına alamayacağı bir karardır.
      D: III doğru değildir, yönetim kurulu kâr payını tek başına kaldıramaz.
