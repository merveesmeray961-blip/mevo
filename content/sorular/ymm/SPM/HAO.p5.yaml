- id: YMM-SPM-HAO-0095
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: geri alınan paylar
  tip: uygulama
  zorluk: 3
  kok: Payları borsada işlem gören ve nominal değeri 1 TL olan bir ortaklığın payının günlük ağırlıklı ortalama fiyatı, yönetim
    kurulu karar tarihinden bir ay önce 10 TL iken karar tarihinde 8 TL'dir. Genel kurulca onaylanmış bir geri alım programı
    yoktur. Buna göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yüzde yirmilik düşüş yakın ve ciddi kayıp sayılmadığından, geri alım için işlem öncesinde Kurulun onayı gerekir.
    B: Fiyat düşüşü yüzde yirmiye ulaştığından yakın ve ciddi kayıp kabul edilir ve yönetim kurulu kararıyla geri alım yapılabilir.
    C: Pay fiyatı nominal değerin üzerinde olduğundan yönetim kurulu kararıyla geri alım hiçbir şart aranmadan yapılabilir.
    D: Genel kurul onaylı program olmadıkça yönetim kurulu hiçbir hâlde, Kurul onayı alsa dahi geri alım yapamaz.
    E: Yönetim kurulu kararıyla geri alım için ortaklığın yalnızca Kurula ve kamuya bilgi vermesi yeterlidir.
  dogru: A
  aciklama:
    dogru_neden: Günlük ağırlıklı ortalama fiyatın son bir ayda nominal değerin altında seyretmesi veya yüzde yirminin üzerinde
      değer kaybetmesi hâlinde yakın ve ciddi kayıp kabul edilir. Düşüş tam yüzde yirmidir, 'üzerinde' değildir; fiyat da
      nominalin üstündedir. Bu nedenle md. 5/6 gereği işlem öncesi Kurul onayı gerekir.
    celdiriciler:
      B: Yüzde yirmilik düşüş 'yüzde yirminin üzerinde' koşulunu sağlamaz; sınır dahil değildir.
      C: Nominal değerin üzerinde olması yakın ve ciddi kaybı yok eder, ancak bu durum şartsız geri alım yetkisi doğurmaz;
        Kurul onayı aranır.
      D: Yakın ve ciddi kayıp bulunmayan hâllerde de yönetim kurulu kararıyla geri alım, işlem öncesi Kurul onayıyla mümkündür.
      E: Kurul onayı alınmadan yalnızca bilgi verilmesi, yakın ve ciddi kayıp bulunmayan hâlde yeterli değildir.
  kaynaklar:
  - mevzuat: II-22.1 Geri Alınan Paylar Tebliği
    madde: md. 5/5-6
    alinti: (5) Ortaklık paylarının günlük ağırlıklı ortalama fiyatının yönetim kurulu karar tarihinden önceki son bir ayda,
      a) Nominal değerinin altında seyretmesi veya b) Yüzde yirminin üzerinde değer kaybetmesi, durumlarında yakın ve ciddi
      bir kaybın varlığı kabul edilir. (6) Beşinci fıkrada belirtilen haller dışında yönetim kurulu kararı ile geri alım yapılabilmesi
      için, ortaklık tarafından işlem öncesinde Kurulun onayının alınması gereklidir.
