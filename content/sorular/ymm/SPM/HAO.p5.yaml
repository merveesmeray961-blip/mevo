- id: YMM-SPM-HAO-0093
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: kayıtlı sermaye
  tip: hesaplama
  zorluk: 2
  kok: Halka açık bir ortaklığın ödenmiş sermayesi 40.000.000 TL; bağımsız denetimden geçmiş konsolide finansal tablolarında
    ana ortaklığa ait özsermaye toplamı 90.000.000 TL'dir. Finansal tablo tarihinden sonra sermaye artırımı yapılmamıştır.
    Kayıtlı sermaye sistemine geçişte Kurulca izin verilebilecek tavanın üst limiti kaç TL'dir?
  secenekler:
    A: 200.000.000 TL
    B: 270.000.000 TL
    C: 360.000.000 TL
    D: 450.000.000 TL
    E: 650.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: Tavan, ödenmiş sermaye veya özsermayeden yüksek olanının beş katını aşamaz; konsolide tablolarda ana ortaklığa
      ait özsermaye esas alınır. Yüksek olan 90.000.000 TL olduğundan üst limit 5 × 90.000.000 = 450.000.000 TL'dir.
    celdiriciler:
      A: 200.000.000 TL, yüksek olan yerine ödenmiş sermayenin (40.000.000 TL) beş katıdır; hata özsermayeyi dikkate almamaktır.
      B: 270.000.000 TL, özsermayenin üç katıdır; Tebliğdeki çarpan beştir.
      C: 360.000.000 TL, özsermayenin dört katıdır; Tebliğdeki çarpan beştir.
      E: 650.000.000 TL, ödenmiş sermaye ile özsermayenin toplamının beş katıdır; Tebliğ iki değerden yüksek olanı esas alır,
        toplamını değil.
  kaynaklar:
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 5/4
    alinti: (4) Kurulca beş yıl süreyle geçerli olmak üzere izin verilecek kayıtlı sermaye tavanı, ortaklıkların ödenmiş/çıkarılmış
      sermayesi veya özsermayesinden yüksek olanının beş katını aşamaz.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 5/4
    alinti: Ortaklıkların konsolide finansal tablolarının bulunması durumunda, kayıtlı sermaye tavanına ilişkin üst limitin
      belirlenmesinde konsolide finansal tablolardaki ana ortaklığa ait özsermaye toplamı esas alınır.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 5 * max(40000000, 90000000)
  durum: taslak
  surum: 1
