- id: YMM-SPM-HAO-0099
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: Kanun kapsamından çıkma genel kurulu süreleri
  tip: uygulama
  zorluk: 3
  kok: 'Pay sahibi sayısı nedeniyle halka açık sayılan Orman Tekstil A.Ş., paylarının borsada işlem görmesini istemediğinden
    genel kurul kararı ile Kanun kapsamından çıkmak için II-16.1 sayılı Tebliğ''in 5 inci maddesi uyarınca Kurula başvurmuştur.
    Kurulun konuya ilişkin kararı ortaklık tarafından 8 Haziran 2026 Pazartesi günü tebellüğ edilmiştir. Genel kurul toplantısı
    14 Temmuz 2026 Salı günü yapılmış ve karar alınmıştır.


    Haziran ve Temmuz 2026''da yalnızca 15 Temmuz Çarşamba günü resmî tatildir; hafta sonları iş günü değildir. Genel kurul
    gündem ilanının en geç yapılabileceği tarih ile ayrılma hakkı kullanım süresinin en geç başlayabileceği tarih aşağıdakilerden
    hangisinde doğru verilmiştir?'
  secenekler:
    A: 18 Haziran 2026; 22 Temmuz 2026
    B: 22 Haziran 2026; 20 Temmuz 2026
    C: 22 Haziran 2026; 22 Temmuz 2026
    D: 22 Haziran 2026; 23 Temmuz 2026
    E: 8 Temmuz 2026; 23 Temmuz 2026
  dogru: D
  aciklama:
    dogru_neden: 'Md. 5/2''ye göre gündem ilanı Kurul kararının tebellüğünden itibaren on iş günü içinde yapılmalıdır: 9-12
      Haziran (4), 15-19 Haziran (9), 22 Haziran (10) olduğundan son gün 22 Haziran 2026''dır. Md. 5/5''e göre ayrılma hakkı
      kullanım süresi genel kurul tarihinden itibaren en çok altı iş günü içinde başlar: 15 Temmuz resmî tatil olduğundan
      16, 17, 20, 21, 22, 23 Temmuz sayılır ve son gün 23 Temmuz 2026''dır. Püf noktaları: Süreler takvim günü değil iş günüdür;
      resmî tatil olan 15 Temmuz iş günü sayımına katılmaz.'
    celdiriciler:
      A: 18 Haziran 2026 on takvim günü sonrasıdır; Tebliğ on iş günü öngörür. 22 Temmuz da 15 Temmuz'un iş günü sayılmasıyla
        bulunan hatalı tarihtir.
      B: 22 Haziran doğrudur; ancak 20 Temmuz altı takvim günü sonrasıdır, Tebliğ altı iş günü der.
      C: 22 Haziran doğrudur; 22 Temmuz ise resmî tatil olan 15 Temmuz'un iş günü sayılmasıyla bulunur.
      E: 8 Temmuz 2026, gündem ilanı için Tebliğde öngörülen bir tarih değildir; on iş günü 22 Haziran'da dolar. 23 Temmuz
        kısmı ise doğrudur.
    hesap_adimlari:
    - 'Gündem ilanı: 8 Haziran 2026 + 10 iş günü = 22 Haziran 2026'
    - 'Ayrılma hakkı: 14 Temmuz 2026 + 6 iş günü (15 Temmuz tatil): 16, 17, 20, 21, 22, 23 Temmuz'
    - 'Son tarihler: 22 Haziran 2026 ve 23 Temmuz 2026'
  kaynaklar:
  - mevzuat: II-16.1 Kapsamdan Çıkarma Tebliği
    madde: md. 5/2
    alinti: Kanun kapsamından çıkma kararının görüşüleceği genel kurul toplantısına ilişkin gündem ilanının, konuya ilişkin
      Kurul kararının ortaklık tarafından tebellüğ edildiği tarihten itibaren on iş günü içinde; genel kurul toplantısının
      ise iki ay içinde yapılması zorunludur.
  - mevzuat: II-16.1 Kapsamdan Çıkarma Tebliği
    madde: md. 5/5
    alinti: Ayrılma hakkı kullanım süresi, genel kurul tarihinden itibaren en çok altı iş günü içinde başlar ve iki yıldan
      az olmayacak şekilde belirlenir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "class _D:\n    def __init__(s, o): s.o = o\n    @staticmethod\n    def _civ(y, m, d):\n        y -= m <= 2\n\
      \        era = y // 400\n        yoe = y - era * 400\n        doy = (153 * (m + (-3 if m > 2 else 9)) + 2) // 5 + d\
      \ - 1\n        doe = yoe * 365 + yoe // 4 - yoe // 100 + doy\n        return era * 146097 + doe - 719468\n    @property\n\
      \    def _ymd(s):\n        n = s.o + 719468\n        era = n // 146097\n        doe = n - era * 146097\n        yoe\
      \ = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n        y = yoe + era * 400\n        doy = doe - (365\
      \ * yoe + yoe // 4 - yoe // 100)\n        mp = (5 * doy + 2) // 153\n        d = doy - (153 * mp + 2) // 5 + 1\n   \
      \     m = mp + 3 if mp < 10 else mp - 9\n        return y + (m <= 2), m, d\n    year = property(lambda s: s._ymd[0])\n\
      \    month = property(lambda s: s._ymd[1])\n    day = property(lambda s: s._ymd[2])\n    def weekday(s): return (s.o\
      \ + 3) % 7\n    def isoformat(s): return '%04d-%02d-%02d' % s._ymd\n    def __add__(s, t): return _D(s.o + t.days)\n\
      \    def __sub__(s, t):\n        return _D(s.o - t.days) if isinstance(t, _T) else _T(s.o - t.o)\n    def __eq__(s,\
      \ t): return s.o == t.o\n    def __lt__(s, t): return s.o < t.o\n    def __le__(s, t): return s.o <= t.o\n    def __gt__(s,\
      \ t): return s.o > t.o\n    def __ge__(s, t): return s.o >= t.o\n    def __hash__(s): return hash(s.o)\nclass _T:\n\
      \    def __init__(s, days): s.days = days\ndef _date(y, m, d): return _D(_D._civ(y, m, d))\ndef _td(days=0, weeks=0):\
      \ return _T(days + 7 * weeks)\nclass dt:\n    date = staticmethod(_date)\n    timedelta = staticmethod(_td)\ntatil =\
      \ {dt.date(2026, 7, 15)}\ndef is_gunu_ekle(d, n):\n    while n:\n        d += dt.timedelta(days=1)\n        if d.weekday()\
      \ < 5 and d not in tatil:\n            n -= 1\n    return d\nilan = is_gunu_ekle(dt.date(2026, 6, 8), 10)\nayrilma =\
      \ is_gunu_ekle(dt.date(2026, 7, 14), 6)\nsonuc = (ilan.isoformat(), ayrilma.isoformat())  # ('2026-06-22', '2026-07-23')"
