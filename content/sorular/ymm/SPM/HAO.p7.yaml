- id: YMM-SPM-HAO-0101
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Halka açık ortaklıklar
  konu: HAO
  kazanim: ortak sayısı nedeniyle Kanun kapsamından çıkarılma
  tip: bilgi
  zorluk: 3
  kok: 'II-16.1 sayılı Tebliğ''in 7 nci maddesi uyarınca pay sahibi sayısı nedeniyle Kanun kapsamından çıkma başvurusuna ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Pay sahibi sayısının beş yüzün altında olduğu, mahkeme tarafından atanan bilirkişi raporu ile tespit ettirilir.


    II. Bilirkişi raporunda esas alınan hazır bulunanlar listesinin başvuru tarihinden en geç bir yıl önce düzenlenmiş olması
    ve pay defterinin güncel olması şarttır.


    III. Bilirkişi raporunun başvuru tarihinden önceki son üç ay içinde hazırlanmış olması zorunludur.


    IV. Pay sahibi sayısının tam olarak beş yüz olması hâlinde de bu madde kapsamında başvuru yapılabilir.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I, II ve III
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'Md. 7/1, pay sahibi sayısının beş yüzün altında olmasını mahkemece atanan bilirkişi raporuyla tespit şartına
      bağlar (I doğru). Md. 7/2 hazır bulunanlar listesinin en geç bir yıl önce düzenlenmiş olmasını (II doğru), md. 7/3 raporun
      son üç ay içinde hazırlanmasını (III doğru) arar. Beş yüz tam sayısı ''beş yüzün altında'' ölçütünü karşılamaz (IV yanlış).
      Püf noktaları: Liste için süre bir yıl, rapor için üç aydır; eşik ''altında'' sözcüğüyle belirlenir, 500 dâhil değildir.'
    celdiriciler:
      A: 'I ve II doğrudur ancak III de doğrudur: md. 7/3 bilirkişi raporunun başvurudan önceki son üç ay içinde hazırlanmasını
        zorunlu kılar.'
      B: 'I ve III doğrudur ancak II de doğrudur: md. 7/2 hazır bulunanlar listesinin en geç bir yıl önce düzenlenmiş olmasını
        ve pay defterinin güncelliğini ister.'
      D: 'IV yanlıştır: ölçüt pay sahibi sayısının beş yüzün altında olmasıdır; I de doğru olduğu hâlde bu seçenekte yer almamaktadır.'
      E: IV'ün doğru kabul edilmesi hatalıdır; tam beş yüz pay sahibi bulunan ortaklık md. 7 kapsamında başvuramaz.
  kaynaklar:
  - mevzuat: II-16.1 Kapsamdan Çıkarma Tebliği
    madde: md. 7/1
    alinti: Pay sahibi sayısının beş yüzün altında olduğunu; a) Hazır bulunanlar listesi, b) Pay defteri, c) Kar payı dağıtımına
      dair muhasebe kayıt ve belgeleri, ç) Kuruluşa ve sonrasında gerçekleştirilen sermaye artırımlarına başvuran pay sahiplerine
      ilişkin kayıt ve belgeler ile varsa ortaklığın pay sahipleri ile ilişkilerine dair benzer belge ve işlemlere dayanarak
      mahkeme tarafından atanan bilirkişi raporu ile tespit ettiren ortaklıklar, Kanun kapsamından çıkma talebi ile Ek-1’de
      yer alan belgelerle Kurula başvurmaları ve başvurunun Kurulca uygun görülmesi halinde Kanun kapsamından çıkarılır.
  - mevzuat: II-16.1 Kapsamdan Çıkarma Tebliği
    madde: md. 7/2
    alinti: Bilirkişi raporunda esas alınan hazır bulunanlar listesinin başvuru tarihinden en geç bir yıl önce düzenlenmiş
