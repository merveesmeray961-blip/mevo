    madde: md. 25/1
    alinti: İzahnamede yer alan yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan ihraççılar sorumludur. Zararın
      söz konusu kişilerden tazmin edilememesi veya edilemeyeceğinin açıkça belli olması halinde; halka arz edenler, ihraca
      aracılık eden lider yetkili kuruluşlar, varsa garantör ve ihraççının yönetim kurulu üyeleri kusurlarına ve durumun gereklerine
      göre zararlar kendilerine yükletilebildiği ölçüde sorumludur.
