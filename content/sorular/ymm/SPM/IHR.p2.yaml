- id: YMM-SPM-IHR-0028
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: izahname ve ihraç belgesi
  tip: uygulama
  zorluk: 2
  kok: 'Payları ilk kez halka arz edilecek Gama A.Ş., izahname onayı için Kurula başvurmuştur. Kurul, başvuru tarihinden itibaren
    on iş günü içinde bazı belgelerin eksik olduğunu şirkete bildirmiştir. İzahname ve İhraç Belgesi Tebliği (II-5.1)''ne
    göre aşağıdaki ifadelerden hangileri doğrudur?

    I. Eksikliklerin giderilmesi için şirkete yirmi iş günü süre verilir; makul sebeplerin varlığı hâlinde şirketin talebi
    üzerine yirmi iş gününe kadar ek süre verilebilir.

    II. Eksik belgelerin tamamı sunulduğunda Kurulun karar süresi, başvuru tarihinden itibaren geçen günler düşülerek kalan
    süreden devam eder.

    III. Eksiklikler verilen süre içinde Kurula iletilmezse başvuru Kurulca işlemden kaldırılır.

    IV. Kurul, eksikliklerin tamamlanmasından itibaren yirmi iş günü içinde karar almazsa izahname onaylanmış sayılır.'
  secenekler:
    A: I ve II
    B: II ve IV
    C: III ve IV
    D: I, II ve III
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: II-5.1 md. 19/2'ye göre eksiklikler başvuru tarihinden itibaren on iş günü içinde bildirilir ve yirmi iş
      günü içinde giderilmesi istenir; makul sebeplerle ve talep üzerine yirmi iş gününe kadar ek süre verilebilir (I doğru).
      Aynı fıkraya göre karar süreleri eksik belgelerin tamamının sunulduğu tarihten itibaren baştan işlemeye başlar (II yanlış).
      Md. 19/3-(c)'ye göre eksikliklerin verilen sürede iletilmemesi başvurunun işlemden kaldırılması sonucunu doğurur (III
      doğru). Md. 19/4'e göre sürede karar alınmaması onaylandığı veya onaylanmadığı anlamına gelmez (IV yanlış).
    celdiriciler:
      A: II yanlıştır; karar süresi kalan günlerden değil, belgelerin tamamının sunulduğu tarihten itibaren baştan işler.
      B: II ve IV yanlıştır; süre baştan işler ve süresinde karar alınmaması zımni onay anlamına gelmez.
      C: IV yanlıştır; Tebliğ zımni onayı açıkça reddeder. Ayrıca doğru olan I seçenekte yoktur.
      D: I ve III doğru olmakla birlikte II yanlıştır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 19/2
    alinti: Bu takdirde, bu maddenin birinci fıkrasında öngörülen süreler, söz konusu eksik veya ek bilgi ve belgelerin tamamının
      Kurula sunulduğu tarihten itibaren baştan işlemeye başlar. Makul sebeplerin varlığı halinde ve başvuru sahibinin talebi
      üzerine Kurulca başvuru sahibine yirmi iş gününe kadar ek süre verilebilir.
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 19/4
    alinti: Kurulca bu maddede yer alan süreler içerisinde izahnamenin ya da ihraç belgesinin onayı ile ilgili bir karar alınmamış
      olması, izahnamenin veya ihraç belgesinin Kurulca onaylandığı veya onaylanmadığı anlamına gelmez.
