- id: YMM-SPM-IHR-0033
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: izahnameden sorumluluk
  tip: uygulama
  zorluk: 3
  kok: 'Payları ilk kez halka arz edilen Eta A.Ş.''nin izahnamesinde yer alan finansal tablolarda hasılatın gerçeğe aykırı
    biçimde yüksek gösterildiği, izahnamenin geçerlilik süresi içinde ortaya çıkmıştır. 6362 sayılı Kanun ve İzahname ve İhraç
    Belgesi Tebliği (II-5.1) çerçevesinde aşağıdaki ifadelerden hangileri doğrudur?

    I. Zarardan öncelikle Eta A.Ş. sorumludur; zararın ondan tazmin edilememesi veya edilemeyeceğinin açıkça belli olması
    hâlinde ihraca aracılık eden lider yetkili kuruluş ve Eta A.Ş.''nin yönetim kurulu üyeleri, kusurlarına ve durumun gereklerine
    göre zararlar kendilerine yükletilebildiği ölçüde sorumlu olur.

    II. Payları, yanlışlığa ilişkin düzeltmenin ilan edilmesinden sonra yatırım kararı vererek satın alan yatırımcının izahnameye
    dayalı tazminat talebi reddedilir.

    III. Halka arzda pay alıp gerçeğe uygun bilginin ortaya çıkmasından hemen sonra paylarını borsada zararına satan yatırımcı
    bakımından, izahname ile zarar arasında illiyet bağı kurulmuş sayılır.

    IV. İzahnamenin diğer kısımlarıyla birlikte okunduğunda yanıltıcı, hatalı veya tutarsız olmasa bile, yalnızca özet bölümüne
    dayanılarak ilgililere hukuki sorumluluk yüklenebilir.'
  secenekler:
    A: I ve II
    B: II ve III
    C: I, II ve III
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I: Kanun md. 10/1 ve II-5.1 md. 25/1 ihraççının birincil, halka arz eden, lider yetkili kuruluş, garantör
      ve yönetim kurulu üyelerinin ise ikincil (tazmin edilemezlik koşuluna bağlı) ve kusura göre sorumluluğunu düzenler;
      doğrudur. II: Md. 32/5-(c)''ye göre düzeltmenin yatırım kararından önce ilan edilmiş olması hâlinde tazminat talebi
      reddedilir; doğrudur. III: Md. 32/4''e göre izahnamenin geçerlilik süresi boyunca ilk halka arzdan alınan araçların
      gerçeğe uygun bilginin ortaya çıkmasından hemen sonra borsada satılmasıyla oluşan zararda illiyet bağı kurulmuş sayılır;
      doğrudur. IV: II-5.1 md. 25/3''e göre diğer kısımlarla birlikte okunduğunda özetin yanıltıcı, hatalı veya tutarsız olması
      hâli hariç, yalnızca özete dayanılarak sorumluluk yüklenemez; yanlıştır. Püf noktaları: Sorumlulukta sıra önemlidir:
      önce ihraççı, tazmin edilemezse diğerleri kusurlarına göre. Kanun md. 32 illiyet bağını belirli koşullarda karine olarak
      kabul eder; aynı maddedeki ret sebepleri (düzeltmenin önceden ilanı gibi) ise yatırımcının talebini ortadan kaldırır.
      Özet tek başına sorumluluk kaynağı değildir; istisnası özetin bütünle birlikte okunduğunda yanıltıcı olmasıdır.'
    celdiriciler:
      A: III de doğrudur; Kanun md. 32/4 bu durumda illiyet bağını kurulmuş sayar.
      B: I de doğrudur; ihraççının birincil, diğerlerinin ikincil ve kusura dayalı sorumluluğu Kanun md. 10/1'de açıkça düzenlenmiştir.
      D: IV yanlıştır; özet, bütünle birlikte okunduğunda yanıltıcı, hatalı veya tutarsız değilse tek başına sorumluluk doğurmaz.
        II ise doğru olduğu hâlde bu seçenekte yoktur.
      E: IV, II-5.1 md. 25/3'e aykırıdır.
    hesap_adimlari: []
