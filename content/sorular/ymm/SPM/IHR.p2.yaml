  kok: 'Epsilon A.Ş. tarafından tahsisli satış yoluyla ihraç edilen borçlanma araçlarına (tek ISIN kodu) ilişkin olarak, belirli
    bir gün itibarıyla MKK kayıtlarından aşağıdaki bilgiler elde edilmiştir:

    - Gün sonu itibarıyla bakiyesi bulunan, nitelikli yatırımcı olmayan kişilere ait 118 tekil hesap

    - Gün sonu itibarıyla bakiyesi bulunan 12 müşterek hesap (her biri nitelikli yatırımcı olmayan 3 kişiye aittir)

    - Gün sonu itibarıyla bakiyesi bulunan, nitelikli yatırımcılara ait 30 tekil hesap

    - Gün içinde alım yapıp aynı gün tamamını satan, gün sonu bakiyesi bulunmayan 9 yatırımcı

    Hiçbir kişi birden fazla hesapta yer almamaktadır. Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)''ne göre yüz elli
    kişilik sınırın kontrolünde dikkate alınacak yatırımcı sayısı ve bunun sonucu aşağıdakilerden hangisinde doğru olarak
    verilmiştir?'
  secenekler:
    A: 130 kişi; sınır aşılmamıştır, ihraççı için ek bir yükümlülük doğmaz.
    B: 154 kişi; sınır aşılmıştır, ihraççı bildirimden itibaren yirmi iş günü içinde izahname onayı için Kurula ve borsaya
      başvurur.
    C: 154 kişi; sınır aşılmıştır, ihraççı bildirimden itibaren on iş günü içinde ihraç belgesinin yenilenmesi amacıyla Kurula
      başvurur.
    D: 163 kişi; sınır aşılmıştır, ihraççı bildirimden itibaren yirmi iş günü içinde izahname onayı için Kurula ve borsaya
      başvurur.
    E: 184 kişi; sınır aşılmıştır, ihraççı bildirimden itibaren yirmi iş günü içinde izahname onayı için Kurula ve borsaya
      başvurur.
  dogru: B
  aciklama:
    dogru_neden: 'II-5.2 md. 8/1''e göre tahsisli satılan aracı elinde bulunduran yatırımcı sayısı yüz elliyi geçmemelidir;
      günlük kontrolde müşterek hesap sahipleri ayrı ayrı dikkate alınır ve yalnızca gün sonu itibarıyla bakiyesi olan hesaplar
      hesaba katılır. Md. 8/2''ye göre nitelikli yatırımcılar yüz elli kişinin hesabında dikkate alınmaz. Sayı: 118 + (12
      × 3) = 154 > 150. Md. 8/3''e göre sınırın aşıldığı MKK tarafından ihraççıya ve Kurula bildirilir; ihraççı bildirimden
      itibaren yirmi iş günü içinde izahnamenin onaylanması için Kurula ve aracın borsada işlem görmesi için borsaya başvurur.
      Püf noktaları: Üç ayrı süzgeç vardır: müşterek hesapta kişi sayısı esas alınır, nitelikli yatırımcılar sayılmaz, gün
      sonu bakiyesi olmayanlar dışarıda kalır. Sınır aşıldığında istenen şey ihraç belgesinin yenilenmesi değil, izahname
      ve borsa başvurusudur.'
    celdiriciler:
      A: Müşterek hesaplar hesap sayısıyla (12) sayılmıştır; Tebliğ müşterek hesap sahiplerinin ayrı ayrı dikkate alınmasını
        ister (12 × 3 = 36).
      C: 'Sayı doğrudur, ancak öngörülen sonuç yanlıştır: süre yirmi iş günüdür ve başvuru izahname onayı ile borsada işlem
        görme içindir.'
      D: Gün sonu bakiyesi bulunmayan 9 yatırımcı da sayılmıştır; yalnızca gün sonu itibarıyla bakiyesi olan hesaplar dikkate
        alınır.
      E: Nitelikli yatırımcılara ait 30 hesap da sayılmıştır; nitelikli yatırımcılar yüz elli kişinin hesaplanmasında dikkate
        alınmaz.
    hesap_adimlari:
    - 'Nitelikli olmayan tekil hesaplar: 118 kişi'
    - 'Müşterek hesaplar: 12 × 3 = 36 kişi'
    - Nitelikli yatırımcılar (30) ve gün sonu bakiyesi olmayanlar (9) hariç
    - 'Toplam: 118 + 36 = 154 > 150 → sınır aşılmıştır'
