- id: YMM-SPM-IHR-0032
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: satış yöntemleri
  tip: hesaplama
  zorluk: 3
  kok: Zeta A.Ş.'nin toplam nominal değeri 50.000.000 TL olan paylarının sabit fiyatla talep toplama yöntemiyle (borsada satış
    yöntemi kullanılmaksızın) yapılacak halka arzında, izahnamede tahsisat oranları yurt içi bireysel yatırımcılar %60, yurt
    içi kurumsal yatırımcılar %12 ve yurt dışı kurumsal yatırımcılar %28 olarak belirlenmiş; tahsisat oranlarında kaydırma
    yapılabileceği ve esasları izahnamede açıklanmıştır. Ek satış yapılmamakta olup Kurul asgari tahsisat oranlarında bir
    değişiklik yapmamıştır. Talep toplama sonunda her üç gruptan da kendisine tahsis edilen tutarı aşan talep gelmiştir. Sermaye
    Piyasası Araçlarının Satışı Tebliği (II-5.2)'ne göre yurt içi kurumsal yatırımcı grubunun tahsisatından diğer gruplara
    kaydırılabilecek azami nominal tutar kaç TL'dir?
  secenekler:
    A: '600.000'
    B: 1.000.000
    C: 1.200.000
    D: 5.400.000
    E: 6.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Yurt içi kurumsal gruba tahsis edilen tutar 50.000.000 × %12 = 6.000.000 TL''dir. II-5.2 md. 18/5''e göre
      bir grup için izahnamede açıklanan tutarın yüzde yirmisinden fazla azaltma yapılamaz: 6.000.000 × %20 = 1.200.000 TL.
      Aynı fıkraya göre kaydırma, yurt içi bireysel ve kurumsal yatırımcıların asgari tahsisat oranlarını azaltmamalıdır;
      md. 18/4''e göre yurt içi kurumsal asgari tahsisat 50.000.000 × %10 = 5.000.000 TL''dir. Bu sınır nedeniyle en fazla
      6.000.000 − 5.000.000 = 1.000.000 TL kaydırılabilir. İki sınırdan düşük olan 1.000.000 TL bağlayıcıdır. Püf noktaları:
      Kaydırmada iki sınır birlikte çalışır: grubun izahnamedeki tutarının %20''si ve yurt içi bireysel/kurumsal grupların
      asgari %10''luk tahsisatı. Asgari oran toplam halka arz tutarı üzerinden hesaplanır, grubun kendi tahsisatı üzerinden
      değil. Talep yetersiz olsaydı md. 18/6 uygulanır ve bu sınırlar aranmazdı; kökte her grupta talep fazlası olduğu belirtilmiştir.'
    celdiriciler:
      A: Kaydırma sınırı grubun tahsisatının %10'u olarak alınmıştır; Tebliğdeki azaltma sınırı %20'dir ve ayrıca asgari tahsisat
        sınırı kontrol edilmelidir.
      C: Yalnızca %20'lik azaltma sınırı uygulanmıştır; bu durumda kurumsal tahsisat 4.800.000 TL'ye düşer ve toplamın %10'u
        olan 5.000.000 TL'lik asgari tahsisatın altına iner.
      D: Asgari tahsisat grubun kendi tutarının %10'u (600.000 TL) sanılmış ve %20 sınırı göz ardı edilmiştir; asgari oran
        halka arzın toplam nominal değeri üzerinden hesaplanır.
      E: Tahsisatın tamamı kaydırılmış gibi hesaplanmıştır; sınırsız aktarım yalnızca ilgili grupta talep yetersizliği olduğunda
        (md. 18/6) mümkündür.
    hesap_adimlari:
    - Kurumsal tahsisat = 50.000.000 × 0,12 = 6.000.000 TL
    - '%20 azaltma sınırı = 6.000.000 × 0,20 = 1.200.000 TL'
    - Asgari kurumsal tahsisat = 50.000.000 × 0,10 = 5.000.000 TL → en fazla 1.000.000 TL azaltılabilir
    - Azami kaydırma = min(1.200.000; 1.000.000) = 1.000.000 TL
  kaynaklar:
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 18/4
    alinti: Halka arz edilecek sermaye piyasası araçlarının nominal değerinin, en az yüzde onunun yurt içi bireysel yatırımcılara
      ve yüzde onunun yurt içi kurumsal yatırımcılara tahsis edilmesi zorunludur.
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 18/5
    alinti: izahnamede esasları açıklanmış olmak koşuluyla, yurt içi bireysel ve yurt içi kurumsal yatırımcıların asgari tahsisat
      oranlarını azaltmamak üzere, yatırımcı grupları için belirlenen tahsisat oranlarında kaydırma yapılabilir. Ancak herhangi
      bir yatırımcı grubu için izahnamede açıklanan tutarın yüzde yirmisinden daha fazla azaltma yapılamaz.
  gecerlilik:
    baslangic: '2017-12-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: toplam = 50000000; tahsis = toplam * 12 // 100; sonuc = min(tahsis * 20 // 100, tahsis - toplam * 10 // 100)
