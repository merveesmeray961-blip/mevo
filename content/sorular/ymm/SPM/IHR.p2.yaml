      bile süre sonuna kadar talep toplanmaya devam edilir.
    celdiriciler:
      A: Alt sınır iki iş günü, üst sınır yirmi iş günüdür.
      B: Üst sınır on beş değil yirmi iş günüdür.
      D: Alt sınır iki iş günüdür; üç iş günü, borsada satış yönteminde talep toplama süresinin üst sınırıdır (md. 10/8-b).
      E: Üst sınır yirmi iş günüdür.
