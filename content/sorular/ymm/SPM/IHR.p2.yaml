    madde: md. 25/3
    alinti: İzahnamenin diğer kısımları ile birlikte okunduğu takdirde özetin yanıltıcı, hatalı veya tutarsız olması durumu
      hariç olmak üzere, sadece özete bağlı olarak ilgililere herhangi bir hukuki sorumluluk yüklenemez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 32/5-(c)
    alinti: c) Kamuyu aydınlatma belgelerinde yer alan yanlış, yanıltıcı veya eksik bilgilere ilişkin düzeltmenin, yatırım
      kararının verilmesinden veya bu belgeye dayanarak işlem yapılmasından önce ilan edilmiş olması,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
