  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: borçlanma araçları
  tip: kavrama
  zorluk: 2
  kok: 6362 sayılı Sermaye Piyasası Kanunu'nun borçlanma araçlarına ilişkin hükümleri çerçevesinde aşağıdaki ifadelerden hangisi
    doğrudur?
  secenekler:
    A: Borçlanma aracı ihraç yetkisi, esas sözleşme ile yönetim kuruluna ancak süreli olarak devredilebilir.
    B: Kurulca öngörülen nitelikli çoğunlukla alınan borçlanma aracı sahipleri kurulu kararları, bu kararlara olumlu oy vermeyenleri
      bağlamaz.
    C: Temerrütten sonra borçlanma aracının hüküm ve şartları değiştirilirse, başlatılmış takipler değişiklik tarihi itibarıyla
      düşer.
    D: Tertip bazındaki kurulda, daha ağır nisap yoksa o tertibin nominal tutarının en az yarısını temsil edenlerin olumlu
      oyu gerekir.
    E: Diğer kanunlarda belirlenen borçlanma aracı ihraç limitleri, Kurulca belirlenen limitle birlikte ayrıca uygulanır.
  dogru: D
  aciklama:
    dogru_neden: Md. 31/A-3'e göre Kurul tarafından veya izahname/ihraç belgesinde daha ağır nisap öngörülmedikçe, her bir
      tertip için oluşan kurulda o tertip borçlanma araçlarının nominal bedelleri toplamının asgari yarısını temsil eden borçlanma
      aracı sahiplerinin olumlu oyu şarttır.
    celdiriciler:
      A: Md. 31/3'e göre ihraç yetkisi esas sözleşme ile yönetim kuruluna süreli veya süresiz olarak devredilebilir.
      B: Md. 31/A-3'e göre Kurulca öngörülen nitelikli çoğunlukla alınan kararlar, olumlu oy vermeyen borçlanma aracı sahipleri
        için de hüküm ifade eder.
      C: Md. 31/A-5'e göre takipler değişiklik tarihi itibarıyla durur; borçlanma aracından doğan tüm borçlar ifa edildikten
        sonra düşer.
      E: Md. 31/2'ye göre 233 sayılı KHK hükümleri saklı kalmak ve İl Özel İdaresi ile Belediye Kanunlarındaki limitler hariç
        olmak üzere diğer kanunlarda belirlenen ihraç limitleri uygulanmaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 31/A-3
    alinti: Borçlanma aracı sahipleri kurulunda karar alınabilmesi için, Kurul tarafından veya izahname ve/veya ihraç belgesinde
      aksine daha ağır nisap öngörülmüş bulunmadıkça; her bir tertip borçlanma araçlarının nominal bedelleri toplamının asgari
