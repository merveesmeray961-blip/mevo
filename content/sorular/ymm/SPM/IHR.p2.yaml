    B: Zararın öğrenildiği tarihten itibaren altı ay
    C: Zararın meydana geldiği tarihten itibaren bir yıl
    D: Belgenin kamuya açıklandığı tarihten itibaren bir yıl
    E: Zararın öğrenildiği tarihten itibaren iki yıl
