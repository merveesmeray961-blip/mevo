      başlar.
    celdiriciler:
      B: Süre öğrenme tarihinden değil zararın meydana geldiği tarihten başlar.
      C: Süre bir yıl değil altı aydır.
      D: Başlangıç belgenin açıklanma tarihi değil zararın meydana geldiği tarihtir; süre de altı aydır.
      E: Hem başlangıç anı hem süre yanlıştır; Kanun zararın meydana geldiği tarihten itibaren altı ay öngörür.
