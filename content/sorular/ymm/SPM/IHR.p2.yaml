- id: YMM-SPM-IHR-0029
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: izahname ve ihraç belgesi
  tip: uygulama
  zorluk: 2
  kok: Onaylanmış izahnamenin yayımlanmasından sonra ve satış süresi içinde, ihraççının yatırımcıların yatırım kararını etkileyebilecek
    önemli bir davayla karşılaştığı ortaya çıkmıştır. 6362 sayılı Kanun ve İzahname ve İhraç Belgesi Tebliği (II-5.1) çerçevesinde
    bu duruma ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Durum, ihraççı veya halka arz eden tarafından yazılı olarak derhâl Kurula bildirilir.
    B: Satış süreci ihraççı, halka arz eden veya bunların uygun görüşü üzerine yetkili kuruluşlarca durdurulabilir.
    C: İzahnamenin değişen kısımları, Kurula bildirim tarihinden itibaren yedi iş günü içinde Kurulca onaylanır.
    D: Önceden talepte bulunan yatırımcılar, değişikliklerin yayımından itibaren iki iş günü içinde taleplerini geri alabilir.
    E: İzahnamenin değişen kısımlarının metni ticaret siciline tescil edilir ve TTSG'de ilan olunur.
  dogru: E
  aciklama:
    dogru_neden: Kanun md. 7/1'e göre izahname onaylandıktan sonra yayımlanır, ayrıca ticaret siciline tescil ve TTSG'de ilan
      edilmez; yalnızca izahnamenin nerede yayımlandığı hususu tescil ve ilan edilir. II-5.1 md. 28/9 bu kuralın izahname
      değişiklikleri için de geçerli olduğunu belirtir. Dolayısıyla değişen kısımların metninin tescil ve ilanı gerekmez.
    celdiriciler:
      A: II-5.1 md. 24/1 değişikliğin ihraççı veya halka arz eden tarafından yazılı olarak derhal Kurula bildirilmesini öngörür;
        ifade doğrudur.
      B: II-5.1 md. 24/1 satış sürecinin ihraççı, halka arz eden veya bunların uygun görüşü üzerine yetkili kuruluşlarca durdurulabileceğini
        belirtir; ifade doğrudur.
      C: II-5.1 md. 24/2 ve Kanun md. 8/3 yedi iş günlük onay süresini öngörür; ifade doğrudur.
      D: II-5.1 md. 24'e göre talepte bulunmuş yatırımcılar değişikliklerin yayımlanmasından itibaren iki iş günü içinde taleplerini
        geri alabilir (izahnamede bilgi verilerek süre uzatılabilir); ifade doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 7/1
    alinti: İzahname onaylandıktan sonra Kurulca belirlenecek esaslar çerçevesinde yayımlanır, ayrıca ticaret siciline tescil
      ve Türkiye Ticaret Sicili Gazetesi’nde ilan edilmez. Ancak, izahnamenin nerede yayımlandığı hususu ticaret siciline
      tescil ve Türkiye Ticaret Sicili Gazetesi’nde ilan edilir.
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 24/2
    alinti: Değiştirilecek ya da yeni eklenecek hususları içeren izahnamenin ilgili kısımları Kurula bildirim tarihinden itibaren
      yedi iş günü içinde Kurulca onaylanır
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 24
    alinti: Değişiklik ya da yeni hususların yayımlanmasından önce sermaye piyasası araçlarını satın almak için talepte bulunmuş
      yatırımcılar, izahnamede yapılan ek ve değişikliklerin yayımlanmasından itibaren iki iş günü içerisinde taleplerini
      geri almak hakkına sahiptirler.
