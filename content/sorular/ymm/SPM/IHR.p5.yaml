  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: izahnameden sorumluluk
  tip: kavrama
  zorluk: 3
  kok: İzahnamede yer alan yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlara ilişkin sorumluluk bakımından aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: İhraççı, lider aracı kurum ve yönetim kurulu üyeleri baştan itibaren eşit ve birinci derecede, birlikte sorumludur.
    B: Önce ihraççı sorumludur; ondan tazmin edilemezse lider aracı kurum, garantör ve yönetim kurulu üyeleri kusurlarına
      göre sorumludur.
    C: Yalnızca ihraca aracılık eden lider aracı kurum sorumludur; ihraççı ve yönetim kurulu üyeleri sorumlu tutulamaz.
    D: İzahnamede yer alan raporları hazırlayan bağımsız denetim, derecelendirme ve değerleme kuruluşları, raporlarındaki
      bilgiler bakımından hiçbir sorumluluk taşımaz.
    E: Yönetim kurulu üyeleri, kusurları bulunmasa da ihraççıdan önce ve kusursuz biçimde sorumludur.
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 10/1'e göre izahnamedeki yanlış, yanıltıcı ve eksik bilgilerden doğan zararlardan önce ihraççılar
      sorumludur; zararın tazmin edilememesi veya edilemeyeceğinin açıkça belli olması hâlinde halka arz edenler, lider aracı
      kurum, varsa garantör ve yönetim kurulu üyeleri kusurlarına ve durumun gereklerine göre sorumludur. Md. 10/2 uyarınca
      rapor hazırlayanlar da raporlarındaki bilgilerden sorumludur.
    celdiriciler:
      A: Sorumluluk kademelidir; diğer kişiler ihraççıdan tazmin edilememesi hâlinde sorumlu olur.
      C: İhraççı birinci derecede sorumludur; sorumluluk lider aracı kuruma özgü değildir.
      D: Bağımsız denetim, derecelendirme ve değerleme kuruluşları gibi rapor hazırlayanlar da raporlarındaki yanlış, yanıltıcı
        ve eksik bilgilerden sorumludur.
      E: Yönetim kurulu üyeleri kusurlarına göre ve ikincil olarak sorumludur; kusursuz sorumluluk yoktur.
  kaynaklar:
