    değeri 250.000 TL olan PDT'lerini vadede paylara dönüştürmek istemektedir. Dönüştürme fiyatı pay başına 7 TL'dir; dönüştürme
    nominal değer üzerinden yapılmakta ve faiz hesaba katılmamaktadır. Dönüştürme sonucunda PDT sahibine verilecek pay adedi
    ve küsurat için nakden ve peşinen ödenecek tutar aşağıdakilerden hangisidir?
  secenekler:
    A: 35.700 pay ve 1.400 TL
    B: 35.714 pay ve 2 TL nakit
    C: 35.714 pay; nakit ödeme yapılmaz
    D: 35.715 pay; nakit ödeme yapılmaz
    E: 36.000 pay ve 2.000 TL
  dogru: B
  aciklama:
    dogru_neden: Md. 17/3'e göre dönüştürme PDT'nin nominal değeri üzerinden yapılır. Md. 18/3'e göre dönüştürme oranının
      küsuratlı olması hâlinde küsurata isabet eden pay tutarı PDT sahibine nakden ve peşinen ödenir ve hesaplamada dönüştürme
      fiyatı esas alınır. 250.000 / 7 = 35.714,2857 → 35.714 pay; 35.714 × 7 = 249.998; küsurat nakdi = 250.000 - 249.998
      = 2 TL.
    celdiriciler:
      A: 35.700 pay ve 1.400 TL, payların yuvarlak sayıya indirilmesiyle bulunmuştur; Tebliğde tam payların hepsi verilir,
        yalnızca küsurat nakde çevrilir.
      C: Dönüştürme oranı küsuratlıdır; küsurata isabet eden tutar nakden ve peşinen ödenir, bu nedenle nakit ödeme yapılmaması
        yanlıştır.
      D: 35.715 pay verilmesi küsuratın yukarı yuvarlanması demektir; Tebliğ küsuratın nakden ödenmesini öngörür.
      E: 36.000 pay verilemez; toplam değer nominal tutarı (250.000 TL) aşar ve küsurat tutarı da 2.000 TL değildir.
    hesap_adimlari:
    - Pay adedi = 250.000 / 7 = 35.714,29 → 35.714 tam pay
    - Verilen payların değeri = 35.714 × 7 = 249.998 TL
    - Küsurat nakdi = 250.000 - 249.998 = 2 TL
  kaynaklar:
  - mevzuat: VII-128.8 Borçlanma Araçları Tebliği
    madde: md. 17/3
    alinti: (3) PDT’lerin paya dönüştürülmesi PDT’nin nominal değeri üzerinden gerçekleştirilir.
  - mevzuat: VII-128.8 Borçlanma Araçları Tebliği
    madde: md. 18/3
    alinti: (3) Dönüştürme oranının küsuratlı olması durumunda, dönüştürme sırasında toplam üzerinden küsurata isabet eden
      pay tutarı PDT sahibine nakden ve peşinen ödenir. Bu hesaplamada dönüştürme fiyatı esas alınır.
