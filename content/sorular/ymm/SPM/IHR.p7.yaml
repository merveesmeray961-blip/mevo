    madde: md. 27/2
    alinti: Bu durumda halka arz fiyatları arasındaki fark yüzde yirmiyi aşamaz ve aynı yatırımcı grubu içerisinde farklı
      fiyat uygulanamaz.
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 27/3
    alinti: iskontolu olarak satılmak istenen paylar öncelikle halka arz edenlerin sahip oldukları mevcut paylardan karşılanır.
