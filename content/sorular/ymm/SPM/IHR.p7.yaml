  konu: IHR
  kazanim: halka arzda teşvik ve farklı fiyat
  tip: kavrama
  zorluk: 2
  kok: 'II-5.2 sayılı Tebliğin 27 nci maddesine göre payların ilk ve ikincil halka arzında teşvik ve farklı fiyat uygulamalarıyla
    ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Belirli yatırımcı gruplarına Kurulca uygun görülmesi koşuluyla farklı fiyat uygulanarak satış yapılabilir.


    II. Aynı yatırımcı grubu içerisinde farklı fiyat uygulanamaz.


    III. Ortakların mevcut paylarının da halka arz edildiği ve belirli gruplara iskontolu satış yapılmak istenen durumda,
    iskontolu satılacak paylar öncelikle halka arz edenlerin sahip oldukları mevcut paylardan karşılanır.


    IV. Halka arzdan toplanan fonun satış tamamlandıktan sonra azalması sonucunu verecek teşvikler de izahnamede belirtilmek
    kaydıyla sağlanabilir.


    V. İskontolu payların sermaye artırımı suretiyle ihraç edilmesi hâlinde, ortaklığın halka arzdan elde edeceği toplam fonda
    olası azalmanın tutarı izahnamede belirtilir.'
  secenekler:
    A: I ve II
    B: I, II ve III
    C: I, III, IV ve V
    D: II, III ve IV
    E: I, II, III ve V
  dogru: E
  aciklama:
    dogru_neden: Md. 27/2 farklı fiyat uygulamasına Kurulca uygun görülmesi koşuluyla izin verir ve aynı grup içinde farklı
      fiyat uygulanamayacağını belirtir (I, II). Md. 27/3'e göre iskontolu paylar öncelikle halka arz edenlerin mevcut paylarından
      karşılanır (III). Md. 27/4'e göre sermaye artırımıyla ihraç edilen iskontolu paylarda fondaki olası azalma izahnamede
      belirtilir (V). Md. 27/5'e göre halka arzdan toplanan fonun satıştan sonra azalmasına yol açacak hiçbir teşvik sağlanamaz
      (IV yanlış).
    celdiriciler:
      A: III ve V de doğrudur; seçenek eksiktir.
      B: V de doğrudur (md. 27/4); seçenek eksiktir.
      C: IV yanlıştır; ayrıca II doğru olduğu hâlde seçenekte yer almamaktadır.
      D: IV yanlıştır; satış sonrası fonu azaltacak teşvik izahnamede belirtilse bile sağlanamaz. I ve V de doğru olduğu hâlde
        seçenekte yer almamaktadır.
  kaynaklar:
