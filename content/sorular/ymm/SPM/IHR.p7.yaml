- id: YMM-SPM-IHR-0091
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: talep toplama yönteminde dağıtım
  tip: hesaplama
  zorluk: 3
  kok: 'Bir halka arzda sabit fiyatla talep toplama yöntemi kullanılmış ve satışa sunulan 100.000 adet pay için, tek yatırımcı
    grubunda, aşağıdaki talepler gelmiştir. Mükerrer talep, oransal dağıtım, asgari miktar sınırı ve küsurat bulunmamaktadır.


    | Yatırımcı | Talep (adet) |

    |---|---|

    | A | 5.000 |

    | B | 8.000 |

    | C | 10.000 |

    | D | 20.000 |

    | E | 60.000 |

    | F | 30.000 |


    Sermaye Piyasası Araçlarının Satışı Tebliği''nin (II-5.2) 20 nci maddesinin ikinci fıkrasındaki dağıtım esaslarına göre
    E yatırımcısına kaç adet pay dağıtılır?'
  secenekler:
    A: '16.667'
    B: '25.667'
    C: '28.500'
    D: '30.000'
    E: '57.000'
  dogru: C
  aciklama:
    dogru_neden: 'Talepler satışa sunulan tutardan fazla olduğundan md. 20/2''ye göre toplam tutar yatırımcı sayısına bölünür
      ve bu tutar ve altındaki talepler karşılanır; kalan tutar talebi tamamen karşılanamayan yatırımcılara aynı yöntemle
      bölünür ve satışa sunulan tutar bitinceye kadar devam edilir. Adım 1: 100.000 / 6 = 16.666,67 → A, B, C karşılanır (23.000).
      Adım 2: 77.000 / 3 = 25.666,67 → D (20.000) karşılanır. Adım 3: 57.000 / 2 = 28.500 → E ve F''nin talepleri (60.000
      ve 30.000) 28.500''den büyüktür, her biri 28.500 alır. Püf noktaları: Eşit bölüşüm her turda yeniden hesaplanır; küçük
      talepler tam karşılanır, büyükler eşit payı alır.'
    celdiriciler:
      A: 16.667, yalnızca ilk turdaki eşit paydır; ilk turdan sonra kalan tutar yeniden dağıtılır.
      B: 25.667, ikinci turdaki paydır; D karşılandıktan sonra kalan tutar bir kez daha bölünür.
      D: 30.000, F'nin talebidir; E'nin payı olamaz ve 28.500'ü aşan bir pay verilemez.
      E: 57.000, D'den sonra kalan tutarın tamamıdır; bu tutar E ve F arasında eşit bölünür.
    hesap_adimlari:
    - 'Tur 1: 100.000 / 6 = 16.666,67; talebi bu tutar ve altında olanlar A (5.000), B (8.000), C (10.000) tam karşılanır;
      kalan = 100.000 - 23.000 = 77.000'
    - 'Tur 2: 77.000 / 3 = 25.666,67; D (20.000) tam karşılanır; kalan = 57.000'
    - 'Tur 3: 57.000 / 2 = 28.500; E ve F talepleri 28.500''ü aştığından her biri 28.500 alır'
    - E yatırımcısına dağıtılan = 28.500 adet
  kaynaklar:
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 20/2
    alinti: a) Varsa belirli bir yatırımcı grubu için ayrılan kısım hariç olmak üzere, satışa sunulan toplam tutar, talep
      eden yatırımcı sayısına bölünür ve bu suretle bulunan tutar ve altındaki alım talepleri karşılanır.
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 20/2
    alinti: b) Kalan tutar, talebi tamamen karşılanamayan yatırımcı sayısına bölünerek aynı şekilde dağıtılır.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "satis = 100000\ntalep = {'A':5000,'B':8000,'C':10000,'D':20000,'E':60000,'F':30000}\nalinan = {k:0 for k in talep}\n\
      kalan = satis\nacik = {k: v for k, v in talep.items()}\nwhile kalan > 0 and acik:\n    pay = kalan / len(acik)\n   \
      \ tamam = [k for k,v in acik.items() if v <= pay]\n    if tamam:\n        for k in tamam:\n            alinan[k] = talep[k];\
      \ kalan -= acik[k]; del acik[k]\n    else:\n        for k in acik: alinan[k] = pay\n        kalan = 0\nsonuc = alinan['E']"
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kaynakla dogrulandi; tek dogru sik, aciklama ve celdiriciler tutarli.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_SPM/SPM_IHR_20261111_1.yaml#1
  - tarih: '2026-11-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: 'hakem (tam inceleme) kabul: Kaynakla dogrulandi; tek dogru sik, aciklama ve celdiriciler tutarli.'
- id: YMM-SPM-IHR-0092
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: İhraç ve halka arz
  konu: IHR
  kazanim: dağıtım listesinin kesinleşmesi ve bedel iadesi
  tip: uygulama
  zorluk: 3
  kok: Konsorsiyum oluşturulmayan bir halka arzda talep toplama süresi 12 Haziran 2026 Cuma günü sona ermiştir. Yetkili kuruluş,
    ihraççı ve halka arz eden Tebliğ'de öngörülen süreleri son gününe kadar kullanmış; Haziran 2026'da resmî tatil bulunmamaktadır,
    hafta sonu tatildir. II-5.2 sayılı Tebliğ'in 23 üncü maddesine göre karşılanamayan taleplere ilişkin bedel iadelerinin
    en geç yapılacağı tarih hangisidir?
  secenekler:
    A: 16 Haziran 2026
    B: 17 Haziran 2026
    C: 18 Haziran 2026
    D: 19 Haziran 2026
    E: 22 Haziran 2026
  dogru: D
  aciklama:
    dogru_neden: 'Md. 23''e göre yetkili kuruluş talep toplama süresinin bitimini izleyen iki iş günü içinde dağıtım listesini
      ihraççıya verir (16 Haziran Salı); ihraççı listenin teslimini izleyen iki iş günü içinde onaylayıp yetkili kuruluşa
      teslim eder (18 Haziran Perşembe); bedel iadeleri onaylanan listenin yetkili kuruluşça teslim alınmasını izleyen iş
      günü içinde yapılır (19 Haziran Cuma). Püf noktaları: Üç ayrı süre zincirlenir; hafta sonları sayılmaz.'
    celdiriciler:
      A: 16 Haziran 2026, dağıtım listesinin ihraççıya verilebileceği son gündür; bedel iadesi için henüz onay süreci tamamlanmamıştır.
      B: 17 Haziran 2026, ihraççının onay süresinin ortasındadır; zincir son gün kullanıldığında bu tarihe ulaşılmaz.
      C: 18 Haziran 2026, ihraççının listeyi onaylayıp teslim edebileceği son gündür; bedel iadesi izleyen iş günü yapılır.
      E: 22 Haziran 2026, 19 Haziran Cuma gününü izleyen iş gününe karşılık gelir; Tebliğdeki son gün 19 Haziran'dır.
    hesap_adimlari:
    - 'Talep toplama sonu: 12 Haziran 2026 Cuma'
    - 'Liste ihraççıya: 2 iş günü -> 16 Haziran 2026 Salı'
    - 'İhraççı onayı: 2 iş günü -> 18 Haziran 2026 Perşembe'
    - 'Bedel iadesi: izleyen iş günü -> 19 Haziran 2026 Cuma'
  kaynaklar:
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 23/1
    alinti: (1) Talep toplama süresinin bitimini izleyen iki iş günü içerisinde yetkili kuruluş ya da varsa konsorsiyum lideri,
      sermaye piyasası aracı satın almak isteyen yatırımcıların adı/soyadını, varsa T.C. Kimlik numaralarını, ticaret unvanlarını,
      vergi kimlik numaralarını, talep ettikleri sermaye piyasası aracı miktarını, teklif edilen fiyatı, talepte bulunulan
      asgari miktarı, talebin sisteme girildiği tarih ve saat ile sermaye piyasası araçlarının yatırımcılar arasındaki dağıtımını
      gösterir bir liste düzenleyerek ihraççıya ve/veya halka arz edene verir.
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 23/2
    alinti: (2) İhraççı ve/veya halka arz eden, dağıtım listesinin teslimini izleyen iki iş günü içinde listeyi onaylayarak
      yetkili kuruluş veya konsorsiyum liderine teslim eder.
  - mevzuat: II-5.2 Sermaye Piyasası Araçlarının Satışı Tebliği
    madde: md. 23/4
    alinti: Karşılanamayan taleplere ilişkin bedel iadeleri, onaylanan dağıtım listesinin yetkili kuruluş tarafından teslim
      alınmasını izleyen iş günü içerisinde yerine getirilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: "class _D:\n    def __init__(s, o): s.o = o\n    @staticmethod\n    def _civ(y, m, d):\n        y -= m <= 2\n\
      \        era = y // 400\n        yoe = y - era * 400\n        doy = (153 * (m + (-3 if m > 2 else 9)) + 2) // 5 + d\
      \ - 1\n        doe = yoe * 365 + yoe // 4 - yoe // 100 + doy\n        return era * 146097 + doe - 719468\n    @property\n\
      \    def _ymd(s):\n        n = s.o + 719468\n        era = n // 146097\n        doe = n - era * 146097\n        yoe\
      \ = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n        y = yoe + era * 400\n        doy = doe - (365\
      \ * yoe + yoe // 4 - yoe // 100)\n        mp = (5 * doy + 2) // 153\n        d = doy - (153 * mp + 2) // 5 + 1\n   \
      \     m = mp + 3 if mp < 10 else mp - 9\n        return y + (m <= 2), m, d\n    year = property(lambda s: s._ymd[0])\n\
      \    month = property(lambda s: s._ymd[1])\n    day = property(lambda s: s._ymd[2])\n    def weekday(s): return (s.o\
      \ + 3) % 7\n    def isoformat(s): return '%04d-%02d-%02d' % s._ymd\n    def __add__(s, t): return _D(s.o + t.days)\n\
      \    def __sub__(s, t):\n        return _D(s.o - t.days) if isinstance(t, _T) else _T(s.o - t.o)\n    def __eq__(s,\
      \ t): return s.o == t.o\n    def __lt__(s, t): return s.o < t.o\n    def __le__(s, t): return s.o <= t.o\n    def __gt__(s,\
      \ t): return s.o > t.o\n    def __ge__(s, t): return s.o >= t.o\n    def __hash__(s): return hash(s.o)\nclass _T:\n\
      \    def __init__(s, days): s.days = days\ndef _date(y, m, d): return _D(_D._civ(y, m, d))\ndef _td(days=0, weeks=0):\
      \ return _T(days + 7 * weeks)\nclass dt:\n    date = staticmethod(_date)\n    timedelta = staticmethod(_td)\ndef ekle(x,\
      \ n):\n    while n > 0:\n        x += dt.timedelta(days=1)\n        if x.weekday() < 5:\n            n -= 1\n    return\
      \ x\na = ekle(dt.date(2026,6,12), 2)\nb = ekle(a, 2)\nc = ekle(b, 1)\nsonuc = c.isoformat()  # 2026-06-19"
