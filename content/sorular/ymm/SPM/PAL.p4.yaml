    B: I ve III
    C: II ve IV
    D: I, III ve IV
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: Md. 65/7'ye göre Kurul izni olmayan pay devirleri pay defterine kaydolunmaz ve kayıtlar hükümsüzdür (I).
      Md. 65/5'e göre piyasa işleticisiyle anlaşma Kurul onayı olmadan hüküm ifade etmez (II). Md. 65/12'ye göre borsa başkanı,
      yönetim kurulu üyeleri ve üst yönetimi hakkında soruşturma Kurulun yazılı iznine bağlıdır (IV). Borsalar özel hukuk
      hükümlerine tabidir ve aleyhlerine açılan davalar adli yargıda görülür (md. 65/11); III yanlıştır.
    celdiriciler:
      A: IV de doğrudur.
      B: III yanlıştır; davalar adli yargıda görülür.
      C: I de doğrudur.
      D: III yanlıştır; II doğrudur.
