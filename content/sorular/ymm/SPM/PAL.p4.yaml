- id: YMM-SPM-PAL-0014
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Piyasa altyapısı ve yatırımcı koruma
  konu: PAL
  kazanim: tedrici tasfiye
  tip: hesaplama
  zorluk: 3
  kok: 'Tedricî tasfiyesine karar verilen (T) Yatırım Menkul Değerler A.Ş.''ye ilişkin bilgiler şöyledir:


    - Nakde çevrilen aktifler: 4.500.000 TL

    - Mevzuat uyarınca verilmiş ve aktife dahil edilecek teminatlar: 300.000 TL

    - Müşteri alacakları (tazmin edilmeyen bakiyeler): 3.200.000 TL

    - Kamu alacakları: 1.000.000 TL

    - YTM''nin halefiyetten doğan alacağı ve tasfiye giderleri toplamı: 1.500.000 TL

    - Diğer alacaklılar: 700.000 TL


    6362 sayılı Kanun''un 86. maddesine göre YTM''ye ödenecek tutar kaç TL''dir?

    '
  secenekler:
    A: '0'
    B: '300.000'
    C: '600.000'
    D: 1.300.000
    E: 1.500.000
  dogru: C
  aciklama:
    dogru_neden: 'Mevzuat uyarınca verilmiş teminatlar aktifin hesabında dikkate alınır: aktif = 4.500.000 + 300.000 = 4.800.000
      TL (md. 86/4). Sıra (md. 86/5): önce müşteri alacakları 3.200.000 (kalan 1.600.000), sonra garameten kamu alacakları
      1.000.000 (kalan 600.000), sonra YTM''nin md. 85 ödemeleri ve tasfiye giderlerinden doğan alacağı: 600.000 TL. Diğer
      alacaklılara bir şey kalmaz. Püf noktaları: YTM alacağı kamu alacaklarından sonra gelir; teminatlar aktife eklenmeden
      hesap yapılmamalıdır.'
    celdiriciler:
      A: Diğer alacaklılar YTM'den önce sıralanmıştır; bakiye diğer alacaklılara en son tahsis edilir.
      B: Teminatlar aktife eklenmemiştir (4.500.000 − 3.200.000 − 1.000.000).
      D: YTM kamu alacaklarından önce sıralanmış ve teminatlar aktife eklenmemiştir.
      E: YTM alacağı kamu alacaklarından önce ödenmiştir.
    hesap_adimlari:
    - Aktif = 4.500.000 + 300.000 = 4.800.000
    - Müşteri alacakları sonrası kalan = 1.600.000
    - Kamu alacakları sonrası kalan = 600.000
    - YTM'ye ödenecek = min(1.500.000; 600.000) = 600.000 TL
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/4
    alinti: Mevzuat uyarınca verilmiş teminatlar da aktifin hesabında dikkate alınır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/5
    alinti: Aktiflerden öncelikle müşteri alacakları ödenir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/5
    alinti: karşılandıktan sonra artan kısımdan, öncelikle garameten kamu alacakları ve kalandan
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
