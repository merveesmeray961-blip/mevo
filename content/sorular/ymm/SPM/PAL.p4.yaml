- id: YMM-SPM-PAL-0006
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Piyasa altyapısı ve yatırımcı koruma
  konu: PAL
  kazanim: takas ve merkezi karşı taraf
  tip: uygulama
  zorluk: 3
  kok: '(Ü) Yatırım Menkul Değerler A.Ş., merkezî takas kuruluşu nezdinde hem kendine hem de müşterilerine ait kaydi payları
    takas teminatı olarak göstermiştir. Müşteri paylarının bir kısmı üzerinde (Ü)''nün aslında tasarruf yetkisi bulunmamaktadır;
    merkezî takas kuruluşu teminatları iyi niyetle almıştır. Daha sonra (Ü)''ye konkordato mühleti tanınmış, (Ü)''nün vergi
    borcu için vergi dairesi haciz işlemine girişmiş ve bir üçüncü kişi teminattaki paylardan bazılarının kendisine ait olduğunu
    iddia etmiştir.


    Bu olayla ilgili aşağıdaki ifadelerden hangileri 6362 sayılı Kanun''a göre doğrudur?


    I. Vergi dairesi, takas riskine karşı tutulan teminatları kamu alacağı için haczedebilir.

    II. Konkordato mühleti, takas kuruluşunun teminatlar üzerindeki hak ve yetkilerini kullanmasını sınırlandırmaz.

    III. (Ü)''nün müşteri payları üzerinde tasarruf yetkisinin bulunmaması, takas kuruluşunun iyi niyetle ayni hak iktisabına
    engel olmaz.

    IV. Üçüncü kişi istihkak iddiasını merkezî takas kuruluşuna karşı ileri sürebilir.

    V. Takas risklerinin önlenmesi amacıyla oluşturulan garanti fonundaki varlıklar iflas masasına dahil edilemez.

    '
  secenekler:
    A: I, II ve IV
    B: II ve III
    C: III, IV ve V
    D: II, III ve V
    E: I, III ve V
  dogru: D
  aciklama:
    dogru_neden: 'Md. 79/3''e göre konkordato, iflas ve tedricî tasfiye dahil hiçbir süreç takas kuruluşunun teminatlar üzerindeki
      hak ve yetkilerini sınırlandıramaz (II). Md. 79/2''ye göre yatırım kuruluşunun tasarruf yetkisinin bulunmaması takas
      kuruluşunun iyi niyetle ayni hak iktisabına engel olmaz (III); üçüncü kişilerin istihkak iddiaları takas kuruluşuna
      karşı ileri sürülemez (IV yanlış). Md. 73/2''ye göre takas teminatları ve garanti fonu varlıkları kamu alacakları için
      dahi haczedilemez (I yanlış) ve iflas masasına dahil edilemez (V). Püf noktaları: Teminatın korunması üç ayrı hükümden
      gelir: md. 73/2 (haciz ve iflas masası), md. 79/2 (iyi niyetli iktisap ve istihkak) ve md. 79/3 (konkordato ve tasfiye).'
    celdiriciler:
      A: Kamu alacağı için haciz ve istihkak iddiası takas kuruluşuna karşı mümkün değildir.
      B: V de doğrudur; garanti fonu varlıkları iflas masasına giremez.
      C: İstihkak iddiası takas kuruluşuna karşı ileri sürülemez; II doğrudur.
      E: Takas teminatları kamu alacakları için de haczedilemez; II doğrudur.
