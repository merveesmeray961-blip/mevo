    alinti: varlıklar, amaçları dışında kullanılamaz, kamu alacakları için olsa dahi haczedilemez,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/2
    alinti: bulunmaması merkezî takas kuruluşunun iyi niyetle ayni hak iktisabına engel olmaz
