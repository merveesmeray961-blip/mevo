  kok: '6362 sayılı Kanun''a göre merkezî takas kuruluşlarıyla ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Kurul, merkezî takas kuruluşlarının takas hizmeti verebilecekleri borsaları ve teşkilatlanmış diğer pazar yerlerini
    belirler; borsaların uygun görüşleri alınır.


    II. Kurul, borsalar ve teşkilatlanmış diğer pazar yerleri dışında gerçekleştirilen sermaye piyasası araçları işlemlerinin
    takasının merkezî takas kuruluşu nezdinde yerine getirilmesini zorunlu tutabilir.


    III. Merkezî takas kuruluşlarının kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı tarafından izin verilir.


    IV. Merkezî takas kuruluşları, Kurulun uygun görmesi hâlinde TCMB tarafından oluşturulanlar hariç, sermaye piyasaları
    dışında kurulmuş diğer piyasaların da takas, ödeme ve teminat işlemlerini yerine getirebilir.


    V. Merkezî takas kuruluşlarının faaliyete geçmesi için Kurul izni gerekmez; kuruluş izni yeterlidir.'
