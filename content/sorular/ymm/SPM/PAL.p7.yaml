- id: YMM-SPM-PAL-0026
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Piyasa altyapısı ve yatırımcı koruma
  konu: PAL
  kazanim: YTM tasarruf yetkisi ve ödemelerin durması
  tip: uygulama
  zorluk: 3
  kok: Kurulca yatırımcıları tazmin kararı verilen iki kuruluştan biri (Y) Yatırım Menkul Değerler A.Ş., diğeri (B) Bankası'dır.
    YTM, her ikisi bakımından da ödemelerin durdurulmasının ve mal varlığı üzerinde yalnızca YTM tarafından tasarruf edilmesinin
    gerekli olduğu kanaatindedir. 6362 sayılı Kanun'a göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: (Y) bakımından karar verilebilir; (B) bakımından hüküm, bankanın tüm nakit ödeme yükümlülüklerini kapsayacak şekilde
      uygulanır.
    B: Her iki kuruluş bakımından da YTM'nin gerekli görmesine gerek olmaksızın tazmin kararıyla birlikte mal varlığı üzerindeki
      tasarruf yetkisi kendiliğinden YTM'ye geçer.
    C: (Y) bakımından karar verilebilir; (B) bakımından hüküm, yalnız sermaye piyasası faaliyetlerinden doğan nakit ödeme
      ve teslim yükümlülüklerine uygulanır.
    D: Karar yalnızca (Y) gibi yatırım kuruluşları bakımından verilebilir; bankalar bu hükmün kapsamı dışındadır.
    E: Mal varlığı üzerindeki tasarruf yetkisi, ödemeler durdurulduktan sonra Kurul ile YTM tarafından birlikte kullanılır.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 83/3''e göre YTM tarafından gerekli görülmesi hâlinde, hakkında tazmin kararı verilen kuruluşun ödemelerinin
      durmasına ve tüm mal varlığı üzerinde sadece YTM tarafından tasarruf edilebilmesine karar verilebilir. Bu hüküm bankalar
      açısından yalnızca sermaye piyasası faaliyetlerinden kaynaklanan nakit ödeme ve sermaye piyasası aracı teslim yükümlülükleri
      bakımından uygulanır. Püf noktaları: Tasarruf yetkisi kendiliğinden geçmez, karar gerektirir; bankalarda kapsam mevduat
      dahil tüm yükümlülükler değil, yalnızca sermaye piyasası faaliyetlerinden doğanlardır.'
    celdiriciler:
      A: Bankalar bakımından hüküm tüm nakit ödeme yükümlülüklerine değil, yalnızca sermaye piyasası faaliyetlerinden kaynaklananlara
        uygulanır; mevduat bu kapsamın dışındadır.
      B: Hüküm kendiliğinden işlemez; YTM'nin gerekli görmesi üzerine karar verilmesi gerekir.
      D: Bankalar da hükmün kapsamındadır; ancak yalnızca sermaye piyasası faaliyetlerinden doğan yükümlülükler bakımından.
      E: Mal varlığı üzerinde tasarruf yetkisi Kanunda sadece YTM'ye tanınmıştır; Kurul ile ortak kullanım öngörülmemiştir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 83/3
    alinti: (3) YTM tarafından gerekli görülmesi hâlinde, Kurulca hakkında yatırımcıları tazmin kararı verilen kuruluşun ödemelerinin
