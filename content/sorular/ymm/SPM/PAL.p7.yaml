- id: YMM-SPM-PAL-0025
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Piyasa altyapısı ve yatırımcı koruma
  konu: PAL
  kazanim: yatırımcıları tazmin kararı ve bankalar
  tip: kavrama
  zorluk: 2
  kok: 'Kurul, yatırım hizmeti sunan bir banka hakkında 6362 sayılı Kanun''un 82 nci maddesi çerçevesinde yatırımcıları tazmin
    kararı vermeyi değerlendirmektedir. Bu durumla ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Bankalar hakkında tazmin kararı verilebilmesi için Bankacılık Düzenleme ve Denetleme Kurumunun görüşü alınır.


    II. Bankacılık mevzuatı uyarınca mevduat veya katılım fonu olarak kabul edilen nakit ödeme yükümlülüklerine Kanunun yatırımcıların
    tazminine ilişkin hükümleri uygulanmaz.


    III. Bankanın kabul ettiği tüm mevduatlar YTM tarafından tazmin edilir.


    IV. Tazmin kararı, bankalar bakımından durumun tespitinden itibaren altı ay içinde alınır.'
  secenekler:
    A: Yalnız I
    B: III ve IV
    C: I, II ve IV
    D: II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: Md. 82/2'ye göre bankalar hakkında tazmin kararı verilebilmesi için BDDK'nın görüşü alınır (I) ve bankacılık
      mevzuatına göre mevduat veya katılım fonu sayılan nakit ödeme yükümlülüklerine tazmin hükümleri uygulanmaz (II; III
      bu nedenle yanlıştır). Tazmin kararı, bankalar dahil tüm yatırım kuruluşları için durumun tespitinden itibaren üç ay
      içinde alınır (md. 82/1; IV yanlış).
    celdiriciler:
      A: II de doğrudur; mevduat ve katılım fonu niteliğindeki alacaklar tazmin kapsamı dışında kaldığından seçenek eksiktir.
      B: III ve IV yanlış ifadelerdir; mevduat tazmin edilmez ve karar süresi üç aydır.
      C: IV yanlıştır; tazmin kararı için öngörülen süre altı ay değil, durumun tespitinden itibaren üç aydır.
      D: III yanlıştır; mevduat ve katılım fonları tazmin kapsamında değildir. I de doğru olduğu hâlde seçenekte yer almamaktadır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 82/2
    alinti: (2) Kurulca bankalar hakkında birinci fıkra uyarınca tazmin kararı verilebilmesi için Bankacılık Düzenleme ve
      Denetleme Kurumunun görüşü alınır. Bankacılık mevzuatı uyarınca mevduat veya katılım fonu olarak kabul edilen nakit
      ödeme yükümlülüklerine, bu Kanunun yatırımcıların tazminine ilişkin hükümleri uygulanmaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
