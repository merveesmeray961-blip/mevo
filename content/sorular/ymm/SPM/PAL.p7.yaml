    A: I ve II
    B: III, IV ve V
    C: I, III ve V
    D: II, IV ve V
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: 'Md. 77/3''e göre Kurul takas hizmeti verilecek borsaları ve pazar yerlerini belirler (I), borsa dışı işlemlerin
      takasını merkezî takas kuruluşu nezdinde zorunlu tutabilir (II) ve Kurulun uygun görmesi hâlinde TCMB tarafından oluşturulanlar
      hariç diğer piyasaların takas işlemlerini de yerine getirebilir (IV). Md. 77/1''e göre kuruluşa Kurulun teklifi üzerine
      ilgili Bakan izin verir (III yanlış) ve faaliyete geçme Kurulun iznine tabidir (V yanlış). Püf noktaları: Borsa için
      izin merci Cumhurbaşkanı, merkezî takas kuruluşu için ilgili Bakandır; her iki kurumda da faaliyete geçme ayrıca Kurul
      iznine bağlıdır.'
    celdiriciler:
      A: IV de doğrudur; Kurul uygun görürse takas kuruluşu diğer piyasaların takas işlemlerini de yapabilir, bu nedenle seçenek
        eksiktir.
      B: III ve V yanlış ifadelerdir; bu seçenek yalnızca yanlış ifadelerle IV'ü birleştirmektedir.
      C: 'III ve V yanlıştır: izin Cumhurbaşkanı tarafından değil Kurulun teklifi üzerine ilgili Bakan tarafından verilir
        ve faaliyete geçme ayrıca Kurul iznine tabidir.'
      D: V yanlıştır; faaliyete geçme Kurul iznine tabidir. I de doğru olduğu hâlde seçenekte yer almamaktadır.
