      D: IV yanlıştır; md. 116'daki asliye ceza kuralı zimmet suçu için md. 115/A-3 ile değiştirilmiştir. II ise doğrudur.
      E: IV'teki genel görev kuralı zimmet suçuna uygulanmaz; resen soruşturma imkânını içeren I ise doğrudur.
