      TL; asgari ceza = 2 × 260.000 = 520.000 TL. Püf noktaları: Menfaatten maliyet düşmeyin ve nakde çevrilmemiş kazancı
      da dahil edin. Piyasa bozucu eylemde katsayı ikidir; üç kat alt sınır, kabahatin idari yaptırım kararından önce birden
