- id: YMM-SPM-SUC-0023
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: uygulama
  zorluk: 2
  kok: 'Aşağıdaki işlemlerden hangileri, 6362 sayılı Kanun''un 108 inci maddesinde bilgi suistimali veya piyasa dolandırıcılığı
    sayılmayan hâller arasında yer alır?


    I. Payları yeni halka arz edilen bir ortaklığın paylarında, Kurulun fiyat istikrarını sağlayıcı işlemlere ilişkin düzenlemelerine
    uygun olarak, münhasıran piyasa fiyatının önceden belirlenmiş bir süre için desteklenmesi amacıyla alım yapılması

    II. Ortaklığın, Kurul düzenlemelerine göre uygulanan bir geri alım programı çerçevesinde kendi paylarını satın alması

    III. Ortaklığın hâkim pay sahibinin, pay fiyatının belirli bir seviyenin altına düşmesini önlemek amacıyla, bir Kurul
    düzenlemesine dayanmaksızın kendi hesabına sürekli alış emirleri vermesi

    IV. TCMB''nin para politikasının uygulanması amacıyla devlet iç borçlanma senetlerinde işlem yapması'
  secenekler:
    A: I ve II
    B: I, II ve IV
    C: II ve III
    D: I, III ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: SPKn md. 108/1 uyarınca TCMB veya yetkili resmî kurumların para, döviz kuru, kamu borç yönetimi veya finansal
      istikrar amaçlı işlemleri (IV), Kurul düzenlemelerine göre uygulanan geri alım programları (II) ve Kurulun fiyat istikrarını
      sağlayıcı işlemlere ilişkin düzenlemelerine uygun olarak, piyasa fiyatının önceden belirlenmiş bir süre için desteklenmesi
      amacıyla yapılan işlemler (I) bilgi suistimali veya piyasa dolandırıcılığı sayılmaz. III'teki fiyat desteği bir Kurul
      düzenlemesine dayanmadığından istisna kapsamında değildir.
    celdiriciler:
      A: TCMB'nin para politikası amaçlı işlemleri (IV) de md. 108/1-(a) uyarınca istisna kapsamındadır.
      C: III istisna değildir; fiyat desteğinin istisna sayılması Kurulun fiyat istikrarı düzenlemelerine uygunluğa bağlıdır.
        I de istisnadır.
      D: III'te fiyat desteği Kurul düzenlemesine dayanmamaktadır; buna karşılık geri alım programı (II) istisnadır.
      E: III istisna kapsamında değildir; fiyat istikrarını sağlayıcı işlemler (I) ise istisnadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 108/1-(a)
    alinti: a) TCMB ya da yetkilendirilmiş başka bir resmî kurum veya bunlar adına hareket eden kişiler tarafından para, döviz
      kuru, kamu borç yönetim politikalarının uygulanması veya finansal istikrarın sağlanması amacıyla işlem yapılması
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 108/1-(b)
    alinti: b) Kurul düzenlemelerine göre uygulanan geri alım programları, çalışanlara pay edindirme programları ya da ihraççı
      veya bağlı ortaklığının çalışanlarına yönelik diğer pay tahsis edilmesi
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 108/1-(c)
    alinti: c) Kurulun bu Kanun kapsamındaki fiyat istikrarını sağlayıcı işlemlere ve piyasa yapıcılığına ilişkin düzenlemelerine
      uygun olarak icra edilmeleri kaydıyla, münhasıran bu araçların piyasa fiyatının önceden belirlenmiş bir süre için desteklenmesi
      amacıyla sermaye piyasası araçlarının alım veya satımının yapılması yahut emir verilmesi veya emir iptal edilmesi
