      önce aynen iade veya zararın tamamen tazmini hâlinde cezanın üçte ikisi indirilir (doğru). III: md. 115/A-5 (doğru).
      IV: md. 115/A-3 uyarınca zimmet davaları (1) numaralı ağır ceza mahkemelerinde görülür (yanlış). Püf noktaları: md.
