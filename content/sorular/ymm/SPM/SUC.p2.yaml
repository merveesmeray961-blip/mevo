- id: YMM-SPM-SUC-0021
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: hesaplama
  zorluk: 1
  kok: 'Borsada işlem gören bir payda, fiyatlara ilişkin yanıltıcı izlenim uyandırmak amacıyla alım satım yaparak (6362 sayılı
    Kanun md. 107/1) 1.500.000 TL menfaat elde eden (X), hakkında soruşturma başlatıldıktan sonra ve kovuşturma evresine geçilmeden
    önce pişmanlık göstererek Hazineye ödeme yapmak istemektedir.


    X''in etkin pişmanlıktan yararlanabilmesi için ödemesi gereken asgari tutar ve bu ödemenin sonucu aşağıdakilerden hangisinde
    doğru olarak verilmiştir?'
  secenekler:
    A: 1.500.000 TL – verilecek ceza yarısı oranında indirilir
    B: 1.500.000 TL – verilecek ceza üçte biri oranında indirilir
    C: 3.000.000 TL – verilecek ceza yarısı oranında indirilir
    D: 3.000.000 TL – hakkında cezaya hükmolunmaz
    E: 4.500.000 TL – verilecek ceza üçte biri oranında indirilir
  dogru: C
  aciklama:
    dogru_neden: 'SPKn md. 107/3 uyarınca birinci fıkradaki suçu işleyen kişi, 500.000 TL''den az olmamak üzere elde ettiği
      menfaatin iki katını Hazineye öder: 2 × 1.500.000 = 3.000.000 TL (500.000 TL''nin üzerinde). Ödeme soruşturma evresinde
      yapıldığından verilecek ceza yarısı oranında indirilir (md. 107/3-b).'
    celdiriciler:
      A: Evre doğru, ancak ödenecek tutar menfaatin kendisi değil iki katıdır.
      B: Ödenecek tutar menfaatin iki katıdır; üçte bir indirim kovuşturma evresinde hüküm verilinceye kadar yapılan ödemeye
        bağlanmıştır.
      D: Cezaya hükmolunmaması, ödemenin soruşturma başlamadan önce yapılmasına bağlıdır; soruşturma başlamıştır.
      E: Kanun menfaatin üç katını değil iki katını arar; üçte bir indirim de kovuşturma evresine özgüdür.
    hesap_adimlari:
    - 'Ödeme: max(500.000; 2 × 1.500.000) = 3.000.000 TL'
    - Soruşturma evresi → ceza yarısı oranında indirilir
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/3
    alinti: (3) Birinci fıkrada tanımlanan suçu işleyen kişi pişmanlık göstererek, beş yüz bin Türk Lirasından az olmamak
      üzere, elde ettiği veya elde edilmesine sebep olduğu menfaatin iki katı miktarı kadar parayı, Hazineye; a) Henüz soruşturma
      başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz. b) Soruşturma evresinde ödediği takdirde, verilecek ceza
      yarısı oranında indirilir. c) Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, verilecek ceza üçte biri
      oranında indirilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = max(500000, 2 * 1500000)
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi SPM-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
