- id: YMM-SPM-SUC-0024
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: güveni kötüye kullanma
  tip: uygulama
  zorluk: 2
  kok: 'Halka açık Omikron A.Ş.''nin yönetim kurulu başkanı (V), sermaye bakımından ilişkili olduğu bir şirkete, emsallerine
    göre bariz şekilde düşük bedelle mal satışı yaptırarak Omikron''un kârını azaltmıştır (6362 sayılı Kanun md. 110/1-b).
    Kurul kazanç aktarımını tespit etmiş olup Kanun''un 21 inci maddesinin dördüncü fıkrası uyarınca kanuni faiziyle birlikte
    Omikron''a iade edilmesi gereken tutar 2.200.000 TL''dir. Hakkında henüz soruşturma başlamamış olan V, etkin pişmanlık
    göstermek istemektedir.


    6362 sayılı Kanun''a göre aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: V, Omikron'a 2.200.000 TL'yi iade eder ve Hazineye 2.200.000 TL öderse hakkında cezaya hükmolunmaz.
    B: V, Omikron'a iade yapmaksızın Hazineye 4.400.000 TL öderse verilecek ceza yarısı oranında indirilir.
    C: V, Omikron'a 2.200.000 TL'yi iade eder ve Hazineye 4.400.000 TL öderse verilecek ceza yarısı oranında indirilir.
    D: Etkin pişmanlık yalnız md. 110/1-(a) kapsamındaki fiiller için öngörüldüğünden V bu imkândan yararlanamaz.
    E: V, Omikron'a 2.200.000 TL'yi iade eder ve Hazineye 4.400.000 TL öderse hakkında cezaya hükmolunmaz.
  dogru: E
  aciklama:
    dogru_neden: 'SPKn md. 110/3 uyarınca birinci fıkranın (b) ve (c) bentlerindeki güveni kötüye kullanma suçunu işleyen
      kişi, md. 21/4''te yer alan ödemenin (aktarılan tutarın kanuni faiziyle ortaklığa iadesi: 2.200.000 TL) yanı sıra bunun
      iki katı parayı (2 × 2.200.000 = 4.400.000 TL) Hazineye henüz soruşturma başlamadan önce öderse hakkında cezaya hükmolunmaz.'
    celdiriciler:
      A: Hazineye ödenecek tutar md. 21/4'teki ödemenin kendisi değil iki katıdır (4.400.000 TL).
      B: Etkin pişmanlık, ortaklığa yapılacak md. 21/4 ödemesinin yanı sıra Hazineye ödemeyi gerektirir; ayrıca soruşturma
        başlamadan önceki ödeme cezaya hükmolunmaması sonucunu doğurur.
      C: Tutarlar doğrudur; ancak yarı oranında indirim soruşturma evresindeki ödemeye bağlanmıştır. Soruşturma başlamadan
        önce ödemede cezaya hükmolunmaz.
      D: md. 110/3 etkin pişmanlığı (b) ve (c) bentleri için öngörür; (a) bendindeki fiiller bu imkânın dışındadır.
    hesap_adimlari:
    - 'Ortaklığa iade (md. 21/4): 2.200.000 TL'
    - 'Hazineye: 2 × 2.200.000 = 4.400.000 TL'
    - Soruşturma öncesi → cezaya hükmolunmaz
  kaynaklar:
