      yer alan asgari miktardan az olmamak üzere aykırılık tarihinden önceki son bağımsız denetimden geçmiş yıllık finansal
      tablolarında yer alan brüt satış hasılatının %1’i ile vergi öncesi kârının %20’sinden yüksek olanına kadar idari para
      cezası verilir.
