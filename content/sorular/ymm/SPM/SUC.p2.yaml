- id: YMM-SPM-SUC-0022
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: bilgi
  zorluk: 1
  kok: 6362 sayılı Kanun'a göre sermaye piyasası suçlarında soruşturma ve yargılama usulüne ilişkin aşağıdaki ifadelerden
    hangisi **yanlıştır**?
  secenekler:
    A: Bilgi suistimali suçundan soruşturma yapılması Kurulun Cumhuriyet başsavcılığına yazılı başvurusuna bağlıdır ve bu
      başvuru muhakeme şartıdır.
    B: Kurulun başvurusu üzerine kamu davası açılırsa, iddianamenin kabulü ile birlikte Kurul katılan sıfatını kazanır.
    C: Soruşturmada kovuşturmaya yer olmadığı kararı verilmesi hâlinde Kurul bu karara karşı itiraza yetkilidir.
    D: Piyasa dolandırıcılığı suçundan dolayı yargılama, ağır ceza mahkemelerinin görev alanındadır.
    E: Cumhuriyet savcısı soruşturmada Kurul meslek personelinden yararlanabilir; ifade alınırken bu personelin hazır bulunması
      sağlanabilir.
  dogru: D
  aciklama:
    dogru_neden: SPKn md. 116 uyarınca Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı yargılama yapmaya Hâkimler
      ve Savcılar Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri yetkilidir. Piyasa dolandırıcılığı
      bu genel kurala tabidir; ağır ceza mahkemesi görevi yalnız kripto varlık hizmet sağlayıcılarda zimmet suçu için öngörülmüştür
      (md. 115/A-3).
    celdiriciler:
      A: md. 115/1 uyarınca soruşturma Kurulun yazılı başvurusuna bağlıdır ve bu başvuru muhakeme şartı niteliğindedir.
      B: md. 115/2 uyarınca iddianamenin kabulü ile birlikte bir örneği Kurula tebliğ edilir ve Kurul katılan sıfatını kazanır.
      C: md. 115/4 uyarınca Kurul kovuşturmaya yer olmadığı kararına itiraza yetkilidir.
      E: md. 115/3 savcının Kurul meslek personelinden yararlanabileceğini ve ifade alınırken bu personelin hazır bulunmasının
        sağlanabileceğini düzenler.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 116/1
    alinti: MADDE 116 – (1) Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı yargılama yapmaya Hâkimler ve Savcılar
      Yüksek Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri yetkilidir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 115/1-2
    alinti: MADDE 115 – (1) Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan dolayı soruşturma yapılması, Kurul tarafından
      Cumhuriyet başsavcılığına yazılı başvuruda bulunulmasına bağlıdır. Bu başvuru muhakeme şartı niteliğindedir. (2) Başvuru
      üzerine kamu davası açılması hâlinde iddianamenin kabulü ile birlikte, bir örneği Kurula tebliğ edilir ve Kurul aynı
      zamanda katılan sıfatını kazanır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
