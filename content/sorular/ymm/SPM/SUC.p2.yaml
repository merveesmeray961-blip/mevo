- id: YMM-SPM-SUC-0025
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: idari para cezaları ve tedbirler
  tip: uygulama
  zorluk: 2
  kok: 'Payları borsada işlem gören Teta A.Ş.''nin yönetim kurulu üyesi (Z), şirkete ilişkin kamuya açıklanmamış herhangi
    bir bilgiye sahip olmaksızın ve Kurulca izin verilen hâller dışında, Kurulca belirlenen zaman dilimi içinde Teta paylarını
    alıp satarak 300.000 TL net kazanç elde etmiştir.


    6362 sayılı Kanun''a göre Z bakımından aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Z, net kazancı otuz gün içinde Teta'ya vermekle yükümlüdür; vermezse 600.000 TL idari para cezası verilir.
    B: Z, net kazancı otuz gün içinde Hazineye ödemekle yükümlüdür; ödemezse 300.000 TL idari para cezası verilir.
    C: Z, net kazancı altmış gün içinde Teta'ya vermekle yükümlüdür; vermezse 900.000 TL idari para cezası verilir.
    D: Bilgi suistimali unsurları oluşmadığından Z'nin kazancı iade yükümlülüğü yoktur; işlemler yalnız kamuya açıklanır.
    E: Z, net kazancı altmış gün içinde Hazineye ödemekle yükümlüdür; ödemezse 300.000 TL idari para cezası verilir.
