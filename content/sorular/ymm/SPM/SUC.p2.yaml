      B: 'Yalnız nakde çevrilen kazanç esas alınmıştır: 2 × 200.000; md. 103/9 nakde çevrilmemiş kazancı da kapsar.'
      C: 'Komisyon ve vergiler menfaatten düşülmüştür: 2 × (260.000 − 20.000); md. 103/9 bu maliyetlerin dikkate alınmayacağını
