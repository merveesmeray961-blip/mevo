    I. Faaliyet izni kaldırılan bir kripto varlık hizmet sağlayıcının yönetimini fiilen elinde bulunduran gerçek kişi ortaklarının,
    kuruluşun kaynaklarını emin çalışmasını tehlikeye düşürecek şekilde kendi menfaatlerine kullandırarak müşterileri zarara
    uğratması zimmet sayılır; bu suçtan soruşturma, gecikmesinde sakınca görülen hâllerde Cumhuriyet savcılarınca resen yapılabilir.

    II. Kripto varlık hizmet sağlayıcının yönetim kurulu üyesi, zimmete geçirdiği kripto varlıkları soruşturma başlamadan
    önce aynen iade ederse verilecek cezanın üçte ikisi indirilir.

    III. Zimmet suçlarından mahkûm olanlar hakkında, Hazineye olan borçları ve tazminatlar ödenmedikçe veya malvarlıklarından
    tahsil olunamadıkça koşullu salıverilme hükümleri uygulanmaz.

    IV. Zimmet suçuna ait davalar, Hâkimler ve Savcılar Kurulunun ihtisas mahkemesi olarak görevlendirdiği asliye ceza mahkemelerinde
    görülür.'
