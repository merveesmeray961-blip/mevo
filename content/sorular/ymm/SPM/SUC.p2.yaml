    menfaat temin edilmemiştir. Kappa''nın yıllık finansal tablolarına ilişkin bilgiler:


    | Hesap dönemi | Bağımsız denetim raporu tarihi | Brüt satış hasılatı | Vergi öncesi kâr |

    |---|---|---|---|

    | 2025 | 27 Şubat 2026 | 900 milyon TL | 60 milyon TL |

    | 2026 | 26 Şubat 2027 | 1.500 milyon TL | 40 milyon TL |


    6362 sayılı Kanun''un 103 üncü maddesi uyarınca bu aykırılık nedeniyle Kappa''ya verilebilecek idari para cezasının üst
    sınırı kaç milyon TL''dir? (Kanundaki maktu asgari tutarın hesaplamayı etkilemediği varsayılacaktır.)'
