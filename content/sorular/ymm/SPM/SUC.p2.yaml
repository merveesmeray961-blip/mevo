  aciklama:
    dogru_neden: 'SPKn md. 103/2 uyarınca aykırılık tüzel kişinin organı tarafından onun faaliyeti çerçevesinde işlendiğinden
      ve tüzel kişinin zararına sonuç doğurmadığından tüzel kişiye de idari para cezası verilir. md. 103/1 uyarınca tüzel
      kişilere verilecek ceza, aykırılık tarihinden önceki son bağımsız denetimden geçmiş yıllık finansal tablolardaki brüt
      satış hasılatının %1''i ile vergi öncesi kârın %20''sinden yüksek olanına kadardır. Aykırılık tarihinden (15.03.2026)
      önceki son denetimli tablolar 2025 yılına aittir: %1 × 900 = 9; %20 × 60 = 12 → üst sınır 12 milyon TL. Püf noktaları:
      2026 tabloları aykırılıktan sonra denetlendiği için kullanılmaz; iki ölçüt toplanmaz, yüksek olanı alınır. Ayrıca üst
      sınırı yalnız hasılattan hesaplamak sık yapılan bir hatadır.'
    celdiriciler:
      A: 2026 tablolarının vergi öncesi kârı esas alınmıştır (%20 × 40 = 8); aykırılıktan önceki son denetimli tablolar 2025'e
        aittir ve ölçütlerden yüksek olanı alınır.
      B: Yalnız brüt satış hasılatı ölçütü uygulanmıştır (%1 × 900); vergi öncesi kâr ölçütü (12) daha yüksektir.
      D: Aykırılıktan sonraki 2026 tabloları kullanılmıştır (%1 × 1.500 = 15); Kanun aykırılık tarihinden önceki son denetimli
        tabloları esas alır.
      E: İki ölçüt toplanmıştır (9 + 12); Kanun bunlardan yüksek olanını üst sınır olarak belirler.
    hesap_adimlari:
    - 'Esas tablolar: aykırılık tarihinden (15.03.2026) önceki son denetimli yıllık tablolar → 2025'
    - '%1 × 900 = 9 milyon TL; %20 × 60 = 12 milyon TL'
    - Üst sınır = max(9; 12) = 12 milyon TL
