- id: YMM-SPM-SUC-0029
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: uygulama
  zorluk: 3
  kok: 'Yatırım kuruluşu H, bir şirketin hisselerini yapay olarak yükseltmek amacıyla çok sayıda küçük alım emri vermiş, ardından
    büyük miktarda satış yaparak kâr etmiştir. Bu eylem SPKn md. 107 kapsamında nasıl değerlendirilir?

    '
  secenekler:
    A: Bu yatırım stratejisi yasal piyasa işlemlerinin bir türüdür.
    B: Yatırım kuruluşu, piyasa yapıcısı rolünde hareket ettiğinden sorumlu değildir.
    C: Bu eylem, hisse fiyatını yapay olarak yükseltmeye yönelik işlem zinciri oluşturduğundan piyasa dolandırıcılığı teşkil
      eder.
    D: Alım emirleri küçük tutarda olduğundan piyasa dolandırıcılığı sınırının altında kalır.
    E: SPK yalnızca açıklamalar nedeniyle piyasa dolandırıcılığı soruşturması yürütür; işlem örüntüleri değerlendirilemez.
  dogru: C
  aciklama:
    dogru_neden: 'Çok sayıda küçük alım emriyle fiyat yükseltilip ardından büyük satış yapılması klasik ''pump and dump''
      (fiyat şişirme ve boşaltma) yöntemidir; SPKn md. 107 kapsamında piyasa dolandırıcılığı teşkil eder. Püf noktaları: ''piyasa
      yapıcısı'' rolü farklı bir kavramdır — meşru piyasa yapıcılığı fiyat manipülasyonu amacı taşımaz.'
    celdiriciler:
      A: Fiyat şişirme amacıyla yapılan işlem stratejisi yasal sayılmaz.
      B: Piyasa yapıcılığı farklı kuralları kapsar; burada manipülatif amaç mevcuttur.
      D: İşlem tutarı değil amacı ve etkisi belirleyicidir.
      E: SPK işlem örüntülerini de inceleyebilir.
    hesap_adimlari: []
