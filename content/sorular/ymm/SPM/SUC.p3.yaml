- id: YMM-SPM-SUC-0030
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: bilgi suistimali
  tip: kavrama
  zorluk: 3
  kok: 'İçeriden öğrenenlerin ticaretine ilişkin aşağıdakilerden hangisi **yanlıştır**?

    '
  secenekler:
    A: İçeriden öğrenenlerin ticareti hem birincil hem ikincil içeridekiler için geçerlidir.
    B: Kamuya açıklanmamış fiyata etkili bilgiye sahip olmak yeterlidir; işlem yapma zorunluluğu yoktur.
    C: İçeriden bilgiyi başkasına aktararak işlem yaptırmak da suç kapsamındadır.
    D: İçeriden öğrenenlerin ticareti suçu için zarar unsuru aranır.
    E: Şirket çalışanları dışında danışmanlar veya denetçiler de içeriden öğrenenler kapsamına girebilir.
  dogru: D
  aciklama:
    dogru_neden: 'İçeriden öğrenenlerin ticareti suçunun oluşması için zarar unsuru aranmaz; bilgiye dayanarak işlem yapılması
      yeterlidir, fiili zarar gerçekleşmemiş olsa dahi suç tamamlanır. Püf noktaları: ''zarar unsuru'' ceza hukukunun bazı
      suçlarında aranır — ancak sermaye piyasası suçlarında çoğunlukla tehlike suçu niteliğindedir.'
    celdiriciler:
      A: Birincil ve ikincil içeridekiler ayrımı doğrudur.
      B: Kural olarak işlem yapma unsuru aranır; salt bilgi sahibi olmak yeterli değildir ancak bilgi aktarımı da suç sayılabilir
        — B ifadesi tartışmalı olmakla birlikte D kesinlikle yanlıştır.
      C: Bilgiyi aktararak işlem yaptırma da suç kapsamındadır — doğrudur.
      E: Danışman ve denetçiler de içeriden öğrenenler kapsamına girebilir — doğrudur.
