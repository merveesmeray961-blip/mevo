  konu: SUC
  kazanim: güveni kötüye kullanma
  tip: kavrama
  zorluk: 3
  kok: 'Güveni kötüye kullanma suçuna ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Bu suç sermaye piyasasında yetkili kişilerin müşteri çıkarlarını kendi çıkarları için ihlal etmesini kapsar.

    II. Güveni kötüye kullanma suçu yalnızca banka çalışanları tarafından işlenebilir.

    III. Front running (öncü işlem) güveni kötüye kullanmanın bir biçimidir.

    '
  secenekler:
    A: Yalnızca I
    B: I ve III
    C: Yalnızca II
    D: II ve III
    E: I, II ve III
  dogru: B
  aciklama:
    dogru_neden: 'Güveni kötüye kullanma müşteri çıkarlarını kendi çıkarı için ihlal etmeyi kapsar (I doğru). Front running
      bu suçun klasik örneğidir (III doğru). Bu suç yalnızca banka çalışanlarına özgü değildir; tüm yatırım kuruluşu çalışanlarını
      kapsar (II yanlış). Püf noktaları: ''yalnızca banka'' kısıtlaması açıkça yanlıştır — portföy yöneticileri, aracı kurum
      çalışanları da fail olabilir.'
    celdiriciler:
      A: III de doğru olduğundan yalnızca I yetersizdir.
      C: II yanlış olduğundan C hatalıdır.
      D: II yanlış olduğundan D geçersizdir.
      E: II yanlış olduğundan E geçersizdir.
