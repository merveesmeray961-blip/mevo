- id: YMM-SPM-SUC-0054
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: bilgi suistimali
  tip: bilgi
  zorluk: 1
  kok: Doğrudan veya dolaylı olarak, henüz kamuya duyurulmamış ve sermaye piyasası araçlarının fiyatını etkileyebilecek bilgilere
    dayanarak alım veya satım emri veren yönetici, bilgi suistimali suçundan hangi cezayla cezalandırılır?
  secenekler:
    A: Bir yıldan üç yıla kadar hapis veya adli para cezası
    B: İki yıldan beş yıla kadar hapis veya adli para cezası
    C: Üç yıldan beş yıla kadar hapis veya adli para cezası
    D: Beş yıldan on yıla kadar hapis veya adli para cezası
    E: Sekiz yıldan on dört yıla kadar hapis veya adli para cezası
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 106/1, bilgi suistimali suçunu işleyenlerin üç yıldan beş yıla kadar hapis veya adli para cezası
      ile cezalandırılacağını; adli para cezasına hükmedilmesi hâlinde cezanın elde edilen menfaatin iki katından az olamayacağını
      belirtir.
    celdiriciler:
      A: Bir yıldan üç yıla kadar hapis, md. 111/1'deki bilgi ve belge vermeme suçunun cezasıdır.
      B: İki yıldan beş yıla kadar hapis, md. 109'daki izinsiz faaliyet ve usulsüz halka arz suçlarının cezasıdır.
      D: Beş yıldan on yıla kadar hapis, bilgi suistimali için öngörülmemiştir.
      E: Sekiz yıldan on dört yıla kadar hapis, md. 110/A'daki kripto varlık hizmet sağlayıcıda zimmet suçunun cezasıdır.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 106/1
    alinti: üç yıldan beş yıla kadar hapis veya adli para cezası ile cezalandırılırlar. Ancak, bu suçtan dolayı adli para
      cezasına hükmedilmesi hâlinde verilecek ceza elde edilen menfaatin iki katından az olamaz.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici'
    istem_surumu: uretici paketi YMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-05'
        not: 'hakem kabul: Anahtar bağımsız çözümle ve kaynak metinle doğrulandı; tek doğru şık, açıklama tutarlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-05'
    kim: uretici
    ne: harici teslim SPM_SUC_T20261102_1.yaml, satır None
  - tarih: '2026-11-05'
