    neden: 'hakem kabul: Anahtar bağımsız çözümle ve kaynak metinle doğrulandı; tek doğru şık, açıklama tutarlı.'
- id: YMM-SPM-SUC-0055
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: piyasa dolandırıcılığı
  tip: hesaplama
  zorluk: 2
  kok: İşlem bazlı piyasa dolandırıcılığı suçunu işleyen bir kişi, elde ettiği 150.000 TL menfaat nedeniyle soruşturma başlamadan
    önce pişmanlık göstererek parayı Hazineye ödemek istemektedir. Kanuna göre Hazineye ödenmesi gereken tutar kaç TL'dir?
  secenekler:
    A: 150.000 TL
    B: 300.000 TL
    C: 450.000 TL
    D: 500.000 TL
    E: 900.000 TL
  dogru: D
  aciklama:
    dogru_neden: SPKn md. 107/3'e göre pişmanlık gösteren kişi, 500.000 TL'den az olmamak üzere, elde ettiği menfaatin iki
      katı parayı Hazineye öder. 2 × 150.000 = 300.000 TL, 500.000 TL'nin altında olduğundan ödenecek tutar 500.000 TL'dir.
    celdiriciler:
      A: 150.000 TL, yalnızca elde edilen menfaattir; Kanun iki katını öngörür.
      B: 300.000 TL, menfaatin iki katıdır; ancak 500.000 TL alt sınırı dikkate alınmamıştır.
      C: 450.000 TL, menfaatin üç katıdır; Kanunda öngörülen katsayı iki, ayrıca alt sınır 500.000 TL'dir.
      E: 900.000 TL, menfaatin altı katıdır; Kanunda böyle bir hesap yoktur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 107/3
    alinti: (3) Birinci fıkrada tanımlanan suçu işleyen kişi pişmanlık göstererek, beş yüz bin Türk Lirasından az olmamak
      üzere, elde ettiği veya elde edilmesine sebep olduğu menfaatin iki katı miktarı kadar parayı, Hazineye; a) Henüz soruşturma
      başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz. b) Soruşturma evresinde ödediği takdirde, verilecek ceza
      yarısı oranında indirilir. c) Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, verilecek ceza üçte biri
      oranında indirilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = max(2 * 150000, 500000)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici'
    istem_surumu: uretici paketi YMM talimatı 2026-11-02
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-05'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-05'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
