  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: kayıt ve belge suçları ile engelleme
  tip: kavrama
  zorluk: 3
  kok: '6362 sayılı Kanun''un 111, 112 ve 113 üncü maddelerine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Kanunen tutmakla yükümlü oldukları defter ve kayıtları kasıtlı olarak usulüne uygun tutmayanlar, altı aydan iki yıla
    kadar hapis ve beş bin güne kadar adli para cezası ile cezalandırılır.


    II. Kurul tarafından icra edilen inceleme veya denetim faaliyeti kapsamında istenen bilgi veya belgelere ilişkin olarak
    başkalarına açıklamada bulunanlar, bir yıldan üç yıla kadar hapis ve beş bin güne kadar adli para cezası ile cezalandırılır.


    III. Kurul veya Kanuna göre görevlendirilen kişilerin görevlerini yapmalarını engelleyen kişi, bir yıldan üç yıla kadar
    hapis cezası ile cezalandırılır.


    IV. Yatırım kuruluşları, sistemi engelleme, bozma, verileri yok etme veya değiştirme suçu açısından banka veya kredi kurumu
    sayılır.


    V. Finansal tablo ve raporları kasıtlı olarak gerçeği yansıtmayacak şekilde düzenleyenler hakkında 6362 sayılı Kanunun
    kendi hapis cezası hükmü uygulanır.'
  secenekler:
    A: I ve II
    B: III, IV ve V
    C: I, III ve V
    D: II, IV ve V
    E: I, II ve IV
  dogru: E
  aciklama:
    dogru_neden: 'I numaralı ifade md. 112/1''e, II numaralı ifade md. 113/1''e, IV numaralı ifade md. 112/3''e uygundur.
      Md. 111/2''ye göre görevlilerin görevlerini yapmalarını engelleyen kişi altı aydan iki yıla kadar hapis cezası ile cezalandırılır
      (III yanlış; bir yıldan üç yıla kadar hapis, bilgi ve belgeyi hiç vermeme için öngörülmüştür: md. 111/1). Finansal tabloları
      gerçeği yansıtmayacak şekilde düzenleyenler 5237 sayılı Kanunun ilgili hükümlerine göre cezalandırılır (md. 112/2; V
      yanlış). Püf noktaları: 111/1 (bilgi vermeme) ve 111/2 (engelleme) cezaları farklıdır; 112/2 suçlarında ceza için TCK''ya
      atıf vardır.'
    celdiriciler:
      A: IV de doğrudur (md. 112/3); yatırım kuruluşları sistemi engelleme suçu bakımından banka veya kredi kurumu sayıldığından
        seçenek eksiktir.
      B: III ve V yanlış ifadelerdir; ayrıca doğru olan I ve II bu seçenekte yer almamaktadır.
      C: 'III ve V yanlıştır: engelleme cezası altı aydan iki yıla kadar hapistir ve finansal tablo suçlarında ceza 5237 sayılı
        Kanuna göre belirlenir.'
      D: V yanlıştır; finansal tablo suçlarında 5237 sayılı Kanunun ilgili hükümleri uygulanır. I de doğru olduğu hâlde seçenekte
        yer almamaktadır.
