  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 112/1
    alinti: altı aydan iki yıla kadar hapis ve beş bin güne kadar adli para cezası ile cezalandırılırlar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
