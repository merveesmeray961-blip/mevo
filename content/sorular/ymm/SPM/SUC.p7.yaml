- id: YMM-SPM-SUC-0058
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: birden çok kabahat ve menfaatin üç katı
  tip: hesaplama
  zorluk: 3
  kok: 6362 sayılı Kanun'da tanımlanan aynı kabahat, idari yaptırım kararı verilinceye kadar bir halka açık ortaklık tarafından
    üç kez işlenmiştir. İlgili hükme göre verilecek ceza, birden çok işlenme nedeniyle artırıldıktan sonra 200.000 TL bulunmuştur.
    Kabahatin işlenmesi suretiyle ortaklık 90.000 TL menfaat temin etmiş, ortaklığın ihraççısı olduğu sermaye piyasası aracı
    sahiplerine ise zarar doğmamıştır. Kurulca bu ortaklığa verilecek idari para cezası kaç TL'dir?
  secenekler:
    A: 90.000 TL
    B: 180.000 TL
    C: 200.000 TL
    D: 270.000 TL
    E: 600.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Md. 105/2''ye göre kabahatin idari yaptırım kararı verilinceye kadar birden çok işlenmesinde tek bir idari
      para cezası verilir ve ceza artırılır; ancak kabahatin işlenmesiyle menfaat temin edilmesi veya zarara sebebiyet verilmesi
      hâlinde ceza, bu menfaat veya zararın üç katından az olamaz. Artırılmış ceza 200.000 TL, menfaatin üç katı 90.000 ×
      3 = 270.000 TL olduğundan 270.000 TL verilir. Püf noktaları: Alt sınır kuralı (üç kat) artırılmış tutarın altında kalıyorsa
      devreye girer; üç ayrı ceza toplanmaz, tek ceza verilir.'
    celdiriciler:
      A: 90.000 TL menfaatin kendisidir; Kanun menfaatin üç katını alt sınır kabul eder.
      B: 180.000 TL, menfaatin iki katıdır; iki kat çarpanı md. 103/4 ve 103/6 için geçerlidir, birden çok kabahatte alt sınır
        üç kattır.
      C: 200.000 TL, artırılmış cezadır; ancak menfaatin üç katı olan 270.000 TL'nin altında kaldığı için alt sınır kuralı
        nedeniyle yeterli değildir.
      E: 600.000 TL, üç ayrı cezanın toplanmasıyla bulunur; Kanun birden çok işlenmede ayrı ayrı ceza değil tek ceza verilmesini
        öngörür.
    hesap_adimlari:
    - Artırılmış ceza = 200.000 TL
    - Alt sınır = 3 × 90.000 = 270.000 TL
    - Verilecek ceza = max(200.000; 270.000) = 270.000 TL
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 105/2
    alinti: Ancak, bu kabahatin işlenmesi suretiyle bir menfaat temin edilmesi veya zarara sebebiyet verilmesi hâlinde verilecek
      idari para cezasının miktarı bu menfaat veya zararın üç katından az olamaz.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ceza = 200000

      menfaat = 90000

      sonuc = max(ceza, 3 * menfaat)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
