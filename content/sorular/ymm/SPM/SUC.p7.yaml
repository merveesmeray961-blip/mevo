      (I). Md. 114/1'e göre tüzel kişilere özgü güvenlik tedbirleri 106 ve 107. maddelerdeki suçlar bakımından uygulanır (II
      doğru, III yanlış). Md. 115/1'e göre soruşturma Kurulun yazılı başvurusuna bağlıdır ve bu başvuru muhakeme şartıdır
      (IV). Kovuşturmaya yer olmadığı kararına karşı Kurul da itiraza yetkilidir (md. 115/4; V yanlış).
    celdiriciler:
      A: III yanlıştır; güvenlik tedbirleri Kanunda yalnızca 106 ve 107. maddelerdeki suçlar için öngörülmüştür, izinsiz faaliyet
        suçu bunun dışındadır.
      C: III ve V yanlış ifadelerdir; ayrıca doğru olan I ve IV bu seçenekte yer almamaktadır.
