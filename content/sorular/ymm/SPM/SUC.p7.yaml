- id: YMM-SPM-SUC-0060
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: tüzel kişiye idari para cezası verilmesi
  tip: uygulama
  zorluk: 2
  kok: '6362 sayılı Kanun''un 103 üncü maddesinin ikinci fıkrası bakımından aşağıdaki ifadelerden hangileri doğrudur?


    I. Yükümlülüğe aykırı hareket eden kişi bir özel hukuk tüzel kişisinin organı veya temsilcisi ise ayrıca tüzel kişi hakkında
    da idari para cezası verilir.


    II. Aykırı hareket eden kişi organ veya temsilci olmamakla birlikte tüzel kişinin faaliyeti çerçevesinde görev üstlenen
    bir kişi ise de tüzel kişi hakkında ayrıca idari para cezası verilir.


    III. Aykırılığın temsil edilen tüzel kişinin zararına bir sonuç doğurması hâlinde de tüzel kişiye idari para cezası verilir.


    IV. Tüzel kişiye ceza, ancak gerçek kişiye idari para cezası verilememesi durumunda söz konusu olur.'
  secenekler:
    A: Yalnız I
    B: III ve IV
    C: I, II ve III
    D: II ve IV
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: Md. 103/2'ye göre aykırı hareket eden kişinin tüzel kişinin organ veya temsilcisi olması ya da bu tüzel kişinin
      faaliyeti çerçevesinde görev üstlenen bir kişi olması hâlinde ayrıca tüzel kişi hakkında da idari para cezası verilir
      (I ve II). Aykırılığın tüzel kişinin zararına sonuç doğurması hâlinde ise tüzel kişiye ceza verilmez (III yanlış). Tüzel
      kişiye ceza, gerçek kişiye ceza verilmesine bağlı bir ikame değil ayrıca verilen bir cezadır (IV yanlış).
    celdiriciler:
      A: II de doğrudur; organ veya temsilci olmasa bile faaliyet çerçevesinde görev üstlenen kişinin aykırılığı tüzel kişiye
        ceza verilmesini gerektirir.
      B: III ve IV yanlış ifadelerdir; ayrıca doğru olan I ve II bu seçenekte yer almamaktadır.
      C: III yanlıştır; tüzel kişinin zararına sonuç doğuran aykırılıklarda tüzel kişiye idari para cezası verilmez.
      D: IV yanlıştır; tüzel kişiye ceza ayrıca verilir, gerçek kişiye ceza verilememesi şartı aranmaz. I de doğru olduğu
        hâlde seçenekte yer almamaktadır.
  kaynaklar:
