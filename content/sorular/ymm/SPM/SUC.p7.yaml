  konu: SUC
  kazanim: bilgi suistimali faili, tüzel kişi güvenlik tedbirleri ve soruşturma
  tip: kavrama
  zorluk: 2
  kok: '6362 sayılı Kanun''un 106, 114 ve 115 inci maddelerine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Sahip olduğu bilginin kamuya duyurulmamış ve fiyatı etkileyebilecek nitelikte olduğunu bilen kişiler gibi, ispat edilmesi
    hâlinde bilmesi gereken kişiler de bilgi suistimali suçunun faili olabilir.


    II. 106 ve 107 nci maddelerde tanımlanan suçların bir tüzel kişinin yararına işlenmesi hâlinde tüzel kişi hakkında tüzel
    kişilere özgü güvenlik tedbirlerine hükmolunur.


    III. 109 uncu maddedeki izinsiz faaliyet suçunun tüzel kişi yararına işlenmesi hâlinde de tüzel kişilere özgü güvenlik
    tedbirlerine hükmolunur.


    IV. Soruşturma yapılabilmesi, Kurulun Cumhuriyet başsavcılığına yazılı başvuruda bulunmasına bağlıdır ve bu başvuru muhakeme
    şartıdır.


    V. Soruşturmada kovuşturmaya yer olmadığı kararı verilmesi hâlinde bu karara karşı itiraz yetkisi yalnızca şüpheliye aittir.'
