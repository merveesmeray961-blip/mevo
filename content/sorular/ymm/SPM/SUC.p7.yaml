      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Kaynakla dogrulandi; tek dogru sik, aciklama ve celdiriciler tutarli.'
      G6:
        sonuc: bekliyor
      GZ:
