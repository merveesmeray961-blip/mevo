  kok: Sermaye piyasasında izinsiz olarak faaliyette bulunan (X), bu faaliyetinin icrası kapsamında aynı zamanda onaylı izahname
    yayımlamaksızın sermaye piyasası araçlarını halka arz etmiştir. Mahkeme, 6362 sayılı Kanun'un 109 uncu maddesinin ikinci
    fıkrasında tanımlanan suç için alt ve üst sınır arasında takdir ettiği temel hapis cezasını 3 yıl olarak belirlemiştir.
    Kanuna göre (X) hakkında hükmedilecek hapis cezası kaç yıl kaç aydır?
  secenekler:
    A: 3 yıl
    B: 4 yıl
    C: 4 yıl 6 ay
