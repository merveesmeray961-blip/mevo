- id: YMM-SPM-SUC-0057
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Suçlar ve yaptırımlar
  konu: SUC
  kazanim: yönetici kazançlarının ihraççıya iadesi
  tip: hesaplama
  zorluk: 2
  kok: Payları borsada işlem gören Alaz A.Ş.'nin yönetim kurulu üyesi (Y), Kurulca belirlenen zaman dilimi içinde Alaz paylarını
    toplam 3.200.000 TL'ye almış, aynı zaman diliminde toplam 3.700.000 TL'ye satmıştır. İşlem masrafı yoktur, Kurul tarafından
    izin verilen bir hâl bulunmamakta ve içsel bilgiye dayanma iddiası aranmamaktadır. (Y), elde ettiği net kazancı otuz gün
    içinde ihraççıya vermemiştir. 6362 sayılı Kanun'un 103 üncü maddesinin dördüncü fıkrasına göre (Y) hakkında Kurulca verilecek
    idari para cezası kaç TL'dir?
  secenekler:
    A: 250.000 TL
    B: 500.000 TL
    C: 750.000 TL
    D: 1.000.000 TL
    E: 1.500.000 TL
  dogru: D
  aciklama:
    dogru_neden: Md. 103/4'e göre yönetim kurulu üyeleri ve yöneticileri, Kurulca belirlenen zaman dilimi içinde alım satımdan
      elde ettikleri net kazancı ihraççıya vermekle yükümlüdür; otuz gün içinde yerine getirmeyenlere elde ettikleri menfaatin
      iki katı idari para cezası verilir. Net kazanç 3.700.000 - 3.200.000 = 500.000 TL; ceza 500.000 × 2 = 1.000.000 TL.
    celdiriciler:
      A: 250.000 TL, net kazancın yarısıdır; Kanun menfaatin yarısını değil iki katını öngörmüştür.
      B: 500.000 TL, net kazancın kendisidir; bu tutar ihraççıya iade edilecek tutardır, idari para cezası değildir.
      C: 750.000 TL, net kazancın 1,5 katıdır; Kanunda böyle bir çarpan yoktur.
      E: 1.500.000 TL, net kazancın üç katıdır; üç kat çarpanı md. 105/2'deki birden çok kabahat hâli için geçerlidir, md.
        103/4 için değil.
    hesap_adimlari:
    - Net kazanç = 3.700.000 - 3.200.000 = 500.000 TL
    - İdari para cezası = 500.000 × 2 = 1.000.000 TL
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 103/4
    alinti: Bu yükümlülüğü otuz gün içinde yerine getirmeyenler hakkında Kurul tarafından elde ettikleri menfaatin iki katı
      idari para cezası verilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kazanc = 3700000 - 3200000

      sonuc = kazanc * 2'
