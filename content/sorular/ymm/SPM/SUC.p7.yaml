  kok: 6362 sayılı Kanun'a göre Kurulca verilen ve tahsil edilen idari para cezalarının dağıtımı ile bu cezalara karşı başvurulacak
    yol aşağıdakilerden hangisinde doğru verilmiştir?
  secenekler:
    A: Yüzde ellisi genel bütçeye gelir kaydedilir, yüzde ellisi YTM'ye aktarılır; cezalara karşı idari yargı yoluna başvurulabilir.
    B: Tamamı genel bütçeye gelir kaydedilir; cezalara karşı adli yargı yoluna başvurulabilir.
    C: Yüzde ellisi Kurula, yüzde ellisi genel bütçeye gelir kaydedilir; cezalara karşı Kurul nezdinde itiraz edilebilir.
    D: Tamamı YTM'ye aktarılır; cezalara karşı sulh ceza hâkimliğine başvurulabilir.
    E: Yüzde yetmişi genel bütçeye, yüzde otuzu Türkiye Sermaye Piyasaları Birliğine aktarılır; cezalara karşı idari yargı
