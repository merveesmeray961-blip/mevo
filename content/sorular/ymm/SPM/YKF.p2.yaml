      payları birlikte en az %51 olmalıdır: (270 + 210 + 40) / 1.000 = %52 → aykırılık yok. II: md. 24/1-(c) uyarınca beş
      yıldır tasarrufta bulunulmayan arsa ve araziler aktif toplamının %20''sini aşamaz: 210 / 1.000 = %21 → aykırı. III:
      md. 24/1-(b) uyarınca yatırım amaçlı TL vadeli mevduat en fazla %10 olabilir: 120 / 1.000 = %12 → aykırı. IV: md. 22/1-(l)
      uyarınca tek ihraççıya yatırım aktif toplamının %10''unu aşamaz: 90 / 1.000 = %9; sermaye payı %2 (%5''in altında) →
      aykırılık yok. Ayrıca (k) bendi varlıklarının toplamı (120 + 90 = %21) %49 sınırının altındadır. Püf noktaları: Gayrimenkul
      yatırım fonu katılma payları %51''lik asgari orana dahildir; bunları dışarıda bırakırsanız oran %48''e düşer ve I''i
      yanlışlıkla aykırı sayarsınız. Mevduat için %49''luk genel sınırın içinde ayrıca %10''luk bir alt sınır vardır; %21''lik
      toplamın %49''un altında kalması mevduat aşımını ortadan kaldırmaz.'
    celdiriciler:
      A: I'de aykırılık yoktur (GYF katılma payları dahil %52); mevduattaki %12'lik aşım (III) ise gözden kaçırılmıştır.
      B: I'de aykırılık yoktur; beş yıllık arsa sınırı (%21 > %20) aşıldığından II de seçilmelidir.
      C: GYF katılma payları %51'lik orana dahil edildiğinde oran %52 olur; I'de aykırılık yoktur.
      D: Sigma'ya yatırım aktif toplamının %9'u, sermayesinin %2'sidir; md. 22/1-(l)'deki %10 ve %5 sınırları aşılmamıştır.
    hesap_adimlari:
    - '%51 testi: (270 + 210 + 40) / 1.000 = %52 ≥ %51'
    - 'Beş yıllık arsa: 210 / 1.000 = %21 > %20'
    - 'Vadeli mevduat: 120 / 1.000 = %12 > %10'
    - 'Tek ihraççı: 90 / 1.000 = %9 ≤ %10'
