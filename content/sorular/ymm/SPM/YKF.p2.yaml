- id: YMM-SPM-YKF-0030
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: kripto varlık hizmet sağlayıcıları
  tip: uygulama
  zorluk: 2
  kok: 'Faaliyet izni bulunan bir kripto varlık platformunda, müşterilerin kendi cüzdanlarında bulundurmayı tercih etmedikleri
    kripto varlıkların cari değerleri toplamı 4.000.000.000 TL''dir. Platform tek bir saklama kuruluşundan hizmet almaktadır
    ve saklama limitlerinin hesaplanmasında dışarıda bırakılacak bir varlık bulunmamaktadır.


    III-35/B.2 sayılı Tebliğ''e göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Mutabakat saati itibarıyla bu varlıkların en fazla 200.000.000 TL''lik kısmı platform nezdindeki cüzdanlarda bulunabilir.

    II. Gün içinde platform cüzdanlarındaki müşteri varlıkları 360.000.000 TL''ye ulaştığında, %5''i aşan kısım mutabakat
    saati beklenmeksizin derhal saklama kuruluşuna aktarılmalıdır.

    III. Saklama limitlerine ilişkin oranlar her bir kripto varlık için ayrı ayrı değil, kripto varlıkların cari değerleri
    toplamı üzerinden hesaplanır.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: Tebliğ md. 41/1 uyarınca bu varlıkların asgari %95'i saklama kuruluşunda saklanır; platform cüzdanlarında
      azami %5 (4.000.000.000 × %5 = 200.000.000 TL) kalabilir; oranlar mutabakat saati itibarıyla sağlanır (I doğru). md.
      41/2'ye göre oranlar varlık bazında değil cari değerler toplamı üzerinden hesaplanır (III doğru). Gün içinde platform
      cüzdanlarındaki oran %10'u geçemez; derhal aktarım yükümlülüğü %10 (400.000.000 TL) aşıldığında doğar. 360.000.000 TL
      (%9) bu eşiğin altında olduğundan aşım mutabakat saatine kadar giderilebilir (II yanlış).
    celdiriciler:
      A: III de doğrudur; md. 41/2 oranların kripto varlıkların cari değerleri toplamı üzerinden hesaplanacağını açıkça belirtir.
      B: 'II yanlıştır: derhal aktarım, gün içi %10''luk oranın aşılmasına bağlıdır; %9''luk düzeyde aktarım mutabakat saatine
        kadar yapılabilir.'
      C: I doğrudur, II yanlıştır; %5 sınırı mutabakat saati için, %10 sınırı gün içi derhal aktarım için uygulanır.
      E: II'deki %9'luk seviye, derhal aktarımı gerektiren gün içi %10 sınırının altındadır.
    hesap_adimlari:
    - 'Mutabakat saati sınırı: 4.000.000.000 × %5 = 200.000.000 TL'
    - 'Gün içi derhal aktarım eşiği: 4.000.000.000 × %10 = 400.000.000 TL; 360.000.000 TL = %9'
  kaynaklar:
