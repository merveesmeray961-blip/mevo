    milyon TL''dir. Varlıkların dağılımı (milyon TL):


    - Kiraya verilmiş ofis ve alışveriş merkezleri: 270

    - Arsa ve araziler: 210 (tamamı 2019 yılında satın alınmış; üzerlerinde proje geliştirilmesine yönelik herhangi bir tasarrufta
    bulunulmamıştır)

