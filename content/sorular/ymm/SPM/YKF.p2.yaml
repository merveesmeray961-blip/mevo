- id: YMM-SPM-YKF-0027
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: yatırım hizmetleri ve faaliyetleri
  tip: bilgi
  zorluk: 1
  kok: '6362 sayılı Sermaye Piyasası Kanunu''na göre Kurul, yatırım hizmetleri ve faaliyetleri için verdiği faaliyet izinlerini;
    izin verildiği tarihten itibaren (I) süreyle izin kapsamında herhangi bir faaliyette bulunulmaması ya da izin alınırken
    aranan şartların kaybedildiğinin Kurulca tespitinden itibaren (II) içinde bu şartların yeniden sağlanamaması hâllerinde
    iptal edebilir. Faaliyet izinlerinin tamamı iptal edilenler ise sona erme kararı almak ya da en geç (III) içinde esas
    sözleşmelerinin ilgili hükümlerini yatırım hizmetleri ve faaliyetlerini kapsamayacak şekilde değiştirmek zorundadır.


    Boşluklara sırasıyla aşağıdakilerden hangisi getirilmelidir?'
  secenekler:
    A: 'I: bir yıl – II: altı ay – III: altı ay'
    B: 'I: iki yıl – II: altı ay – III: üç ay'
    C: 'I: bir yıl – II: üç ay – III: altı ay'
    D: 'I: üç yıl – II: altı ay – III: bir ay'
    E: 'I: iki yıl – II: üç ay – III: üç ay'
  dogru: E
  aciklama:
    dogru_neden: SPKn md. 41/1-(a) iki yıl süreyle faaliyette bulunulmamasını, md. 41/1-(c) şartların kaybedildiğinin tespitinden
      itibaren üç ay içinde yeniden sağlanamamasını iptal sebebi sayar. md. 41/2 uyarınca izinlerinin tamamı iptal edilenler
      en geç üç ay içinde esas sözleşmelerini değiştirmek (veya sona erme kararı almak) zorundadır.
    celdiriciler:
      A: Faaliyetsizlik süresi bir yıl değil iki yıldır; şartların yeniden sağlanması ve esas sözleşme değişikliği için süreler
        altı ay değil üç aydır.
      B: Faaliyetsizlik süresi doğru (iki yıl) verilmiş; ancak şartların yeniden sağlanması için tanınan süre altı ay değil
        üç aydır.
      C: Faaliyetsizlik süresi iki yıl, esas sözleşme değişikliği süresi ise üç aydır.
      D: Kanunda üç yıllık faaliyetsizlik, altı aylık şart tamamlama veya bir aylık esas sözleşme değişikliği süresi öngörülmemiştir.
    hesap_adimlari: []
  kaynaklar:
