  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: yatırım hizmetleri ve faaliyetleri
  tip: uygulama
  zorluk: 2
  kok: 'Yatırım ve kalkınma bankası niteliğinde olmayan Delta Bank A.Ş., Kurul''dan gerekli izinleri almak kaydıyla aşağıdaki
    hizmetleri sunmayı planlamaktadır:


    I. Borsada işlem gören devlet iç borçlanma senetleri üzerinde işlem aracılığı

    II. Borsada işlem gören paylar üzerinde işlem aracılığı

    III. Bir şirketin borçlanma aracı halka arzında en iyi gayret aracılığı

    IV. Emir iletimine aracılık ettiği müşteriler dışındaki yatırımcılara genel saklama hizmeti


    6362 sayılı Kanun ve III-37.1 sayılı Tebliğ''e göre Delta Bank bu hizmetlerden hangilerini yürütebilir?'
  secenekler:
    A: I ve II
    B: II ve III
    C: I ve IV
    D: I, III ve IV
    E: I, II ve IV
  dogru: C
  aciklama:
    dogru_neden: SPKn md. 39/9 uyarınca bankalar md. 37'nin (a), (b), (c), (ğ) ve (h) bentlerindeki hizmetleri yürütebilir;
      halka arza aracılık ((e) ve (f) bentleri) yalnız yatırım ve kalkınma bankalarına açıktır. Tebliğ md. 17/1-(c), diğer
      bankaların işlem aracılığını paylar ve paylara dayalı türev araçlar hariç tutarak sınırlar; DİBS üzerinde işlem aracılığı
      (I) bu nedenle mümkündür. Tebliğ md. 60/2 genel saklama hizmetini bankalara açar (md. 60/3'teki emir iletimi müşterisi
      kısıtı IV'te dışarıda bırakılmıştır). Doğru cevap I ve IV'tür.
    celdiriciler:
      A: Yatırım ve kalkınma bankası olmayan bankalar paylar üzerinde işlem aracılığı yapamaz (Tebliğ md. 17/1-(c)); II yanlıştır.
      B: Pay işlem aracılığı (II) ve halka arza aracılık (III) mevduat bankası için kapalıdır.
      D: En iyi gayret aracılığı, SPKn md. 37/1-(f) kapsamındaki halka arz aracılığıdır; md. 39/9 ve Tebliğ md. 52 uyarınca
        yalnız aracı kurumlar ile kalkınma ve yatırım bankalarınca yapılabilir.
      E: II, Tebliğ md. 17/1-(c)'deki pay istisnası nedeniyle yürütülemez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 39/9
    alinti: (9) Bu Kanunun 37 nci maddesinin (a), (b), (c), (ğ) ve (h) bentlerinde sayılan yatırım hizmet ve faaliyetleri
      bankalarca da yürütülebilir. Yatırım ve kalkınma bankaları aynı maddenin (ç), (d), (e) ve (f) bentlerinde sayılan hizmetleri
      de sunabilir.
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 17/1-(c)
    alinti: c) (Ek:RG-14/1/2016-29593) Yatırım ve kalkınma bankaları dışında kalan bankalar tarafından paylar, kaldıraçlı
      işlemler ile pay endekslerine ya da paylara dayalı türev araçlar hariç olmak üzere sermaye piyasası araçları üzerinde,
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
