    - Hazine ve Maliye Bakanlığınca ihraç edilen devlet iç borçlanma senetleri: 60

    - Takasbank para piyasası işlemleri: 50


    Fon yöneticisi, devlet iç borçlanma senetlerinin bir kısmını satarak Zeta A.Ş. paylarını portföye almak istemektedir (fon
    toplam değeri değişmeyecektir). Pay ihraççılarının her biri farklı gruptadır, fon yöneticisiyle yönetim hâkimiyeti ilişkisi
    yoktur ve sermaye/oy hakkı sınırları bağlayıcı değildir. III-52.1 sayılı Tebliğ''e göre Zeta A.Ş. paylarına yatırılabilecek
    azami tutar kaç milyon TL''dir?'
  secenekler:
    A: '0'
    B: '5'
    C: '10'
    D: '13'
    E: '20'
  dogru: D
  aciklama:
    dogru_neden: 'Tebliğ md. 17/1-(a) uyarınca tek ihraççıya yatırım fon toplam değerinin %10''unu (20) aşamaz; md. 17/1-(b)
      uyarınca %5''ten (10) fazla yatırım yapılan ihraççıların toplamı %40''ı (80) aşamaz. Hâlihazırda %5''i aşan ihraççılar
      Alfa, Beta, Gama ve Delta''dır: 19 + 18 + 16 + 14 = 67. Zeta''ya 10''dan fazla yatırım yapılırsa Zeta da bu gruba girer:
      67 + Z ≤ 80 → Z ≤ 13; bu tutar %10 sınırının (20) da altındadır. Azami tutar 13 milyon TL''dir. Püf noktaları: Hazine''nin
      ihraç ettiği araçlar md. 17/1-(d) uyarınca bu sınırlamaların dışındadır; borsa yatırım fonu katılma payları md. 18/3
      uyarınca ihraççı sınırı kontrolünde dikkate alınmaz. Epsilon (%4) %5''i aşmadığı için %40''lık gruba girmez. %10 sınırına
      bakıp durmayın; %5–%40 kuralı daha dar olabilir.'
    celdiriciler:
      A: Devlet iç borçlanma senetleri (60) %40'lık gruba katılırsa sınırın zaten aşıldığı sanılır; md. 17/1-(d) uyarınca
        bu araçlara söz konusu sınırlamalar uygulanmaz.
      B: '%5''in altında kalan Epsilon (8) de %40''lık gruba dahil edilmiştir: 80 − (67 + 8) = 5.'
      C: Borsa yatırım fonu payları (15) %40'lık gruba katılınca 82 bulunur ve Zeta'nın %5'te (10) kalması gerektiği sanılır;
        md. 18/3 bu payları ihraççı sınırı kontrolünden çıkarır.
      E: Yalnız tek ihraççı sınırı (%10 = 20) uygulanmış, %5'i aşan ihraççıların toplamına ilişkin %40 sınırı gözden kaçırılmıştır.
    hesap_adimlari:
    - '%10 sınırı: 200 × %10 = 20; %5 eşiği: 200 × %5 = 10; %40 sınırı: 200 × %40 = 80'
    - '%5''i aşan mevcut ihraççılar: 19 + 18 + 16 + 14 = 67 (Epsilon 8 < 10 olduğundan hariç)'
    - Z > 10 ise 67 + Z ≤ 80 → Z ≤ 13
    - Azami Z = min(20; 13) = 13 milyon TL
