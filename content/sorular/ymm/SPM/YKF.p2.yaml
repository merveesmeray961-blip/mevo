- id: YMM-SPM-YKF-0029
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: yatırım fonları
  tip: hesaplama
  zorluk: 2
  kok: 'Serbest fon niteliğinde olmayan (K) Katılım Fonu''nun fon toplam değeri 500 milyon TL''dir. Fonun katılma hesaplarındaki
    varlıkları şöyledir: X Katılım Bankası''nda 35 milyon TL, Y Katılım Bankası''nda 45 milyon TL, Z Katılım Bankası''nda
    40 milyon TL. Hesapların tamamının vadesi 12 aydan kısadır.


    Fon yöneticisi, vadesi 6 ay olan yeni bir katılma hesabını X Katılım Bankası''nda açmak istemektedir. Fon toplam değerinin
    işlemden etkilenmeyeceği varsayıldığında, III-52.1 sayılı Tebliğ''e göre X Katılım Bankası''nda ilave olarak değerlendirilebilecek
    azami tutar kaç milyon TL''dir?'
  secenekler:
    A: '0'
    B: '5'
    C: '15'
    D: '50'
    E: '90'
  dogru: B
  aciklama:
    dogru_neden: 'Tebliğ md. 17/5 uyarınca katılım fonlarında mevduat/katılma hesaplarına toplam sınır fon toplam değerinin
      %25''i, tek bankadaki sınır %10''udur. Toplam sınır 125 milyon TL olup mevcut toplam 120 milyon TL olduğundan kalan
      alan 5 milyon TL''dir. Tek banka sınırı (50 milyon TL) X''te 15 milyon TL''lik alan bırakır. İki sınırdan dar olanı
      bağlayıcıdır: 5 milyon TL.'
    celdiriciler:
      A: Katılım fonuna özgü oranlar yerine genel oranlar (%10 toplam, %3 tek banka) uygulanırsa toplam sınırın (50 milyon
        TL) zaten aşıldığı sonucuna varılır; ancak katılım fonlarında oranlar %25 ve %10'dur.
      C: Yalnız tek banka sınırı (50 − 35 = 15) dikkate alınmış, %25'lik toplam sınır (125 − 120 = 5) gözden kaçırılmıştır.
      D: Tek banka sınırının tamamı (500 × %10) ilave tutar sanılmış; X'teki mevcut 35 milyon TL ve toplam sınır düşülmemiştir.
      E: Toplam sınırdan (125) yalnız X'teki mevcut tutar (35) düşülmüş; diğer bankalardaki hesaplar ve tek banka sınırı dikkate
        alınmamıştır.
    hesap_adimlari:
    - 'Toplam sınır: 500 × %25 = 125 milyon TL; mevcut toplam: 35 + 45 + 40 = 120 → kalan 5'
    - 'Tek banka sınırı: 500 × %10 = 50 milyon TL; X''te mevcut 35 → kalan 15'
    - İlave azami tutar = min(5; 15) = 5 milyon TL
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 17/5
    alinti: (5) Fon toplam değerinin en fazla %10’u, 12 aydan uzun vadeli olmamak şartıyla, bankalar nezdinde açılan mevduat/katılma
      hesaplarında ve mevduat sertifikalarında değerlendirilebilir. Ancak tek bir bankada değerlendirilebilecek tutar fon
      toplam değerinin %3’ünü aşamaz. Katılım fonlarında bu fıkranın birinci cümlesinde belirtilen oran %25, ikinci cümlesinde
      belirtilen oran ise %10 olarak uygulanır.
  gecerlilik:
    baslangic: '2014-07-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'toplam = 500

      mevcut = 35 + 45 + 40

      sonuc = min(toplam * 25 // 100 - mevcut, toplam * 10 // 100 - 35)'
  durum: taslak
  surum: 1
