      D: Portföy yöneticiliği faaliyeti md. 8/1-(b) kapsamında kısmi yetki grubundadır; tek başına geniş yetki gerektirmez.
      E: Sınırlı saklama hizmeti (II) kısmi yetki grubundadır; genel saklama ile karıştırılmamalıdır.
