  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: paya dayalı kitle fonlaması
  tip: hesaplama
  zorluk: 2
  kok: Nitelikli yatırımcı olmayan bir gerçek kişi, platforma yıllık net gelirini 1.200.000 TL olarak beyan etmiştir. Bu kişinin
    bir takvim yılında paya dayalı kitle fonlaması yoluyla yapabileceği en yüksek yatırım tutarı, sınırın gelirin %10'una
    göre uygulanması hâlinde kaç TL'dir?
  secenekler:
    A: 12.000 TL
    B: 50.000 TL
    C: 100.000 TL
    D: 120.000 TL
    E: 200.000 TL
  dogru: D
  aciklama:
    dogru_neden: Genel sınır 50.000 TL'dir; ancak sınır, 200.000 TL'yi aşmamak kaydıyla beyan edilen yıllık net gelirin %10'u
      olarak uygulanabilir. 1.200.000 × %10 = 120.000 TL, 200.000 TL'nin altında olduğundan azami tutar 120.000 TL'dir.
    celdiriciler:
      A: 12.000 TL, gelirin %1'idir; Tebliğdeki oran %10'dur.
      B: 50.000 TL, gelire bağlı uygulama yapılmadığında geçerli genel sınırdır; soruda %10 uygulaması istenmiştir.
      C: 100.000 TL, Tebliğ hükümlerinden çıkmayan bir tutardır.
      E: 200.000 TL, gelire bağlı sınırın üst kapağıdır; hesaplanan tutar bu kapağa ulaşmadığı için uygulanmaz.
  kaynaklar:
  - mevzuat: III-35A.2 Kitle Fonlaması Tebliği
    madde: md. 15/1
    alinti: (1) Nitelikli yatırımcı olmayan gerçek kişiler, bir takvim yılı içinde paya dayalı kitle fonlaması yoluyla azami
      50.000 Türk Lirası yatırım yapabilir. Ancak bu sınır 200.000 Türk Lirasını aşmamak kaydıyla, yatırımcının platforma
      beyan ettiği yıllık net gelirinin %10’u olarak uygulanabilir.
  gecerlilik:
    baslangic: '2012-12-30'
    bitis: null
    yila_bagli_tutar: false
