- id: YMM-SPM-YKF-0080
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: GYO borçlanma sınırı
  tip: hesaplama
  zorluk: 2
  kok: Altyapı yatırım ve hizmetlerinden oluşan portföy işletmeyen Beta GYO A.Ş., hesap dönemi sonunda hazırlayıp kamuya açıkladığı
    konsolide olmayan finansal tablolarında 600 milyon TL öz sermaye göstermektedir. Ortaklığın kullanmakta olduğu banka kredileri
    1.500 milyon TL, finansal kiralama işlemlerinden doğan borçları 400 milyon TL ve gayri nakdi kredileri 300 milyon TL'dir.
    III-48.1 sayılı Tebliğ'in borçlanma sınırına göre ortaklığın ayrıca kullanabileceği azami kredi tutarı kaç milyon TL'dir?
  secenekler:
    A: 200 milyon TL
    B: 800 milyon TL
    C: 1.100 milyon TL
    D: 1.200 milyon TL
    E: 1.500 milyon TL
  dogru: B
  aciklama:
    dogru_neden: Md. 31/1'e göre ortaklıklar özsermayelerinin beş katı kadar kredi kullanabilir ve bu sınırın hesabında finansal
      kiralama borçları ile gayri nakdi krediler de dikkate alınır. Sınır 5 × 600 = 3.000 milyon TL; kullanılan toplam 1.500
      + 400 + 300 = 2.200 milyon TL; kalan 800 milyon TL.
    celdiriciler:
      A: 200 milyon TL, sınırın özsermayenin dört katı (2.400 milyon TL) alınmasıyla bulunur; Tebliğdeki çarpan beştir.
      C: 1.100 milyon TL, gayri nakdi kredilerin hesaba katılmamasıyla bulunur; md. 31/1 gayri nakdi kredilerin de dikkate
        alınmasını ister.
      D: 1.200 milyon TL, finansal kiralama borçlarının hesaba katılmamasıyla bulunur; md. 31/1 bunları da sınıra dâhil eder.
      E: 1.500 milyon TL, hem finansal kiralama borçlarının hem gayri nakdi kredilerin dışarıda bırakılmasıyla bulunur; yalnızca
        banka kredileri sayılmaz.
    hesap_adimlari:
    - Sınır = 5 × 600 = 3.000 milyon TL
    - Kullanılan = 1.500 + 400 + 300 = 2.200 milyon TL
