  tip: uygulama
  zorluk: 2
  kok: III-39.1 sayılı Tebliğ'in 15 inci maddesine göre aşağıdaki aracı kurum yönetim kurulu yapılarından hangisi Tebliğe
    uygundur?
  secenekler:
    A: Üç üyeli yönetim kurulunda üyelerin ikisinin 4 yıllık lisans eğitimi veren okullardan mezun olması
    B: İki üyeli yönetim kurulunda her iki üyenin de 4 yıllık lisans eğitimi veren okullardan mezun olması
    C: Beş üyeli yönetim kurulunda yalnızca iki üyenin 4 yıllık lisans eğitimi veren okullardan mezun olması
    D: Beş üyeli yönetim kurulunda yönetim yetkisinin tek bir murahhas üyeye bırakılması
    E: Dört üyeli yönetim kurulunda üyelerin ikisinin 4 yıllık lisans eğitimi veren okullardan mezun olması
  dogru: A
  aciklama:
    dogru_neden: Md. 15/1'e göre yönetim kurulu asgari üç üyeden oluşur ve üyelerin çoğunluğunun 4 yıllık lisans eğitimi veren
      okullardan mezun olması şarttır. Üç üyeli kurulda ikisi çoğunluk oluşturduğundan yapı uygundur.
    celdiriciler:
      B: Yönetim kurulu asgari üç üyeden oluşmalıdır; iki üyeli yapı, üyelerin tamamı mezun olsa da asgari üye sayısını sağlamaz.
      C: Beş üyeli kurulda çoğunluk en az üç üyedir; iki mezun üye çoğunluk oluşturmaz.
      D: Yönetim yetkisi murahhas üyelere bırakılacaksa en az iki üyenin murahhas tayini zorunludur; tek murahhas üye yeterli
        değildir.
      E: Dört üyeli kurulda çoğunluk en az üç üyedir; ikisinin mezun olması tam yarıdır ve çoğunluk sayılmaz.
  kaynaklar:
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 15/1
    alinti: Aracı kurum yönetim kurulu asgari olarak üç üyeden oluşur. Yönetim kurulu üyelerinin çoğunluğunun 4 yıllık lisans
      eğitimi veren okullardan mezun olmaları şarttır.
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
