  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: aracı kurum ortaklık yapısı değişikliğinde izin ve bildirim
  tip: uygulama
  zorluk: 2
  kok: Payları borsada işlem görmeyen bir aracı kurumda, aşağıdaki pay edinim veya devirlerinden yalnızca biri III-39.1 sayılı
    Tebliğin 34 üncü maddesinin birinci fıkrası uyarınca Kurulun iznine tabidir; diğerleri için ise Tebliğdeki oran koşulları
    gereği yalnızca bildirim yapılması yeterlidir. Yönetim imtiyazı veya intifa hakkı veren pay bulunmadığı varsayıldığında,
    izne tabi olan işlem aşağıdakilerden hangisidir?
  secenekler:
    A: Aracı kurumda %12 paya sahip bir ortağın payını %18'e çıkaran edinim
    B: Aracı kurumda %4 paya sahip bir ortağın payını %9'a kadar çıkaran edinim
    C: Aracı kurumda %25 paya sahip bir ortağın payını %31'e çıkaran edinim
    D: Aracı kurumda %40 paya sahip bir ortağın payını %45'e çıkaran edinim
    E: Aracı kurumda %18 paya sahip bir ortağın payını %22'ye çıkaran edinim
  dogru: E
  aciklama:
    dogru_neden: Md. 34/1'e göre bir ortağa ait payların sermayenin veya oy haklarının %10, %20, %33 veya %50'sini aşması
      sonucunu veren edinimler Kurulun iznine tabidir. %18'den %22'ye çıkış %20 eşiğini aştığı için izin gerekir. Diğer işlemlerde
      pay oranı eşiklerden birini geçmeden aynı aralık içinde kaldığından md. 34/4 uyarınca devri izleyen 10 iş günü içinde
      bildirim yeterlidir.
    celdiriciler:
      A: '%12''den %18''e çıkış %10 ile %20 eşikleri arasında kalır, hiçbir eşik aşılmaz; md. 34/4 gereği yalnızca bildirim
        yapılır.'
      B: '%4''ten %9''a çıkış %10 eşiğine ulaşmaz; md. 34/4 uyarınca yalnızca bildirim yeterlidir.'
      C: '%25''ten %31''e çıkış %20 ile %33 eşikleri arasında kalır, %33 aşılmaz; yalnızca bildirim yapılır.'
      D: '%40''tan %45''e çıkış %33 ile %50 eşikleri arasında kalır, %50 aşılmaz; yalnızca bildirim yapılır.'
  kaynaklar:
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 34/1
    alinti: Bir kişinin aracı kurum sermayesinin veya oy haklarının %10’u veya daha fazlasını temsil eden payları edinmek
      suretiyle aracı kurum ortağı olması veya bir ortağa ait payların aracı kurum sermayesinin veya oy haklarının %10, %20,
      %33 veya %50 sini aşması sonucunu veren pay edinimleri ile bir ortağa ait payların yukarıdaki oranların altına düşmesi
      sonucunu veren pay devirleri Kurulun iznine tabidir.
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 34/4
    alinti: Bir kişinin, doğrudan veya dolaylı olarak, aracı kurum sermayesinin veya oy haklarının yukarıdaki oranlara ulaşmayan
      veya bu oranlar arasında kalan pay devirlerinde ise devri izleyen 10 iş günü içinde Kurula bildirimde bulunulur.
