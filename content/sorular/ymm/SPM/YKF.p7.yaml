- id: YMM-SPM-YKF-0079
  sinav: ymm
  bolum:
  - YMM
  ders: SPM
  unite: Yatırım kuruluşları ve kolektif yatırım
  konu: YKF
  kazanim: şube ve irtibat bürosu açma şartları
  tip: bilgi
  zorluk: 2
  kok: 'Aracı kurumların şube ve irtibat bürosu açmasına ilişkin aşağıdaki ifadelerden hangileri III-39.1 sayılı Tebliğ''e
    göre doğrudur?


    I. İrtibat büroları sadece müşteri emirlerini aracı kuruma iletebilir.


    II. İrtibat bürosu sorumlusunun en az 2 yıllık ön lisans eğitimi veren okullardan mezun olması gerekir.


    III. Şube açma izin başvuruları Kurulca 30 iş günü içinde sonuçlandırılır ve eksik bilgi ile belgelerin tamamlanması için
    geçen süreler de bu sürenin hesabına dâhildir.


    IV. İzin başvurusuna noter onaylı yönetim kurulu kararı ile şubeye ilişkin fizibilite etüdü eklenir.'
  secenekler:
    A: I, II ve IV
    B: I ve II
    C: II, III ve IV
    D: I, III ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: 'I (md. 44/1), II (md. 44/2-b) ve IV (md. 45/1) Tebliğe uygundur. III yanlıştır: md. 45/3''e göre Kurulca
      istenecek eksik bilgi ve belgelerin tamamlanması için geçen süreler 30 iş günlük sürenin hesabında dikkate alınmaz.'
    celdiriciler:
      B: 'I ve II doğrudur, ancak IV de doğrudur: md. 45/1 başvuruya noter onaylı yönetim kurulu kararı ile fizibilite etüdü
        eklenmesini ister.'
      C: 'III yanlıştır: eksik belge tamamlama süreleri 30 iş günlük sürenin hesabında dikkate alınmaz. Ayrıca I de doğrudur
        ve bu seçenekte yer almamaktadır.'
      D: III yanlıştır, çünkü bekleme süreleri 30 iş günlüğe dâhil edilmez; II de doğru olduğu hâlde bu seçenekte yer almamaktadır.
      E: 'III''ün yanlış olduğu gözden kaçırılmıştır: md. 45/3 uyarınca eksik belge tamamlama süreleri sürenin hesabında dikkate
        alınmaz.'
  kaynaklar:
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 44/1
    alinti: İrtibat büroları, aracı kurumu ve aracı kurumun yetkili olduğu yatırım hizmet ve faaliyetlerinin tanıtımını yapmak
      amacıyla aracı kurumu temsil etmekle görevli hizmet birimleridir. İrtibat büroları sadece müşteri emirlerini aracı kuruma
      iletebilir.
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 45/1
    alinti: Aracı kurumlar, şube veya irtibat bürosu açılmasına ilişkin noter onaylı yönetim kurulu kararı, şube veya irtibat
      bürosuna ilişkin fizibilite etüdü ile şube ve irtibat bürosu açılmasına ilişkin 43 veya 44 üncü maddelerde aranan şartları
      yerine getirdiklerini tevsik eden bilgi ve belgelerle izin almak üzere Kurula başvurur.
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 45/3
    alinti: İzin başvuruları Kurul tarafından 30 iş günü içinde sonuçlandırılır. Kurulca istenecek eksik bilgi ve belgelerin
      tamamlanması için geçen süreler bu sürenin hesabında dikkate alınmaz.
