  kok: III-39.1 sayılı Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği'nin 14 üncü maddesine göre aracı kurum
    genel müdür ve yardımcılarına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Genel müdür ve yardımcılarının mali piyasalar veya işletmecilik alanında en az 7 yıllık meslekî deneyime sahip olması
      gerekir.
    B: Genel müdür, icrai nitelikte olmamak ve aracı kurumdaki görevin ifasında zafiyete düşülmemek kaydıyla sermaye ilişkisinde
      bulunulan kuruluşlarda yönetim kurulu üyeliği gibi görevler alabilir.
    C: Genel müdürlük görevine 6 aydan fazla vekalet edilemez.
    D: Görevden ayrılan genel müdür ve yardımcılarının ayrılma nedenleri 3 iş günü içinde Kurula ve Birliğe bildirilir.
    E: Genel müdür veya yardımcısı olarak yapılacak atamalarda Kurul, bildirimden itibaren 10 iş günü içinde olumsuz görüş
      bildirmezse atama yapılabilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 14/4'e göre atanacak kişilerin bildirilmesinden itibaren Kurulca olumsuz görüş bildirilmemesi için aranan
      süre 10 değil 7 iş günüdür; atama sonrasında Birliğe bildirim ise 10 iş günü içinde yapılır. 10 iş günü ifadesi bu iki
      süreyi karıştırmaktadır.
    celdiriciler:
      A: İfade doğrudur; md. 14/1 genel müdür ve yardımcıları için en az 7 yıllık meslekî deneyim arar.
      B: İfade doğrudur; md. 14/2 genel müdürün münhasıran bu görev için istihdamını ister, ancak icrai olmayan yönetim kurulu
        üyeliği türü görevlere izin verir.
      C: İfade doğrudur; md. 14/3 vekalet süresini 6 ayla sınırlar.
      D: İfade doğrudur; md. 14/5 ayrılma nedenlerinin 3 iş günü içinde Kurula ve Birliğe bildirilmesini öngörür.
  kaynaklar:
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
    madde: md. 14/1
    alinti: Aracı kurum genel müdür ve genel müdür yardımcılarının mali piyasalar veya işletmecilik alanında en az 7 yıllık
      meslekî deneyime sahip olması ve işin gerektirdiği dürüstlük ve itibara sahip olması gerekir.
  - mevzuat: III-39.1 Yatırım Kuruluşlarının Kuruluş ve Faaliyet Esasları Tebliği
