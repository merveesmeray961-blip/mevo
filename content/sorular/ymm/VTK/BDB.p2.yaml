  tip: uygulama
  zorluk: 2
  kok: Hesap dönemleri takvim yılı olan tam mükellef (B) Ltd. Şti. ile (C) A.Ş., KVK md. 19/1 şartlarına uygun olarak birleşmiş;
    (B) Ltd. Şti. (C) A.Ş.'ye devrolmuştur. Devre ilişkin kararlar 12.2.2026 tarihinde ticaret siciline tescil edilmiş, birleşme
    18.2.2026 tarihinde Türkiye Ticaret Sicili Gazetesinde ilan edilmiştir. (B) Ltd. Şti.'nin 2025 hesap dönemine ait kurumlar
    vergisi beyannamesi henüz verilmemiştir. Buna göre beyan yükümlülüğü hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnız 1.1.2026 – 12.2.2026 kıst dönem beyannamesi verilir; 2025 beyannamesini (C) A.Ş. Nisan 2026'da kendi adına verir.
    B: Kıst dönem ve 2025 beyannameleri, devir tarihi olan 12.2.2026'dan itibaren otuz gün içinde (B) tarafından tek başına
      imzalanarak verilir.
    C: Kıst dönem kazancı (C) A.Ş.'nin 2026 beyannamesine dahil edilir; (B) Ltd. Şti. adına yalnız 2025 beyannamesi verilir.
    D: 2025 ve kıst dönem beyannameleri, ilandan itibaren otuz gün içinde (B) ve (C)'nin müşterek imzasıyla (B)'nin vergi
      dairesine verilir.
    E: 2025 ve kıst dönem beyannameleri, ilan tarihinden itibaren otuz gün içinde (C) A.Ş.'nin bağlı olduğu vergi dairesine
      verilir.
  dogru: D
  aciklama:
    dogru_neden: KVK md. 20/1-a'ya göre devir tarihi, devre ilişkin kararın ticaret siciline tescil edildiği tarihtir (12.2.2026).
      Münfesih kurum ile birleşilen kurum, devir tarihi itibarıyla hazırlayacakları kıst dönem beyannamesini; devir, hesap
      döneminin kapandığı aydan (Aralık) beyannamenin verildiği ayın sonuna (Nisan) kadar olan sürede gerçekleştiğinden münfesih
      kurumun önceki hesap dönemine (2025) ait beyannameyi de müştereken imzalayarak, birleşmenin Ticaret Sicili Gazetesinde
      ilan edildiği tarihten itibaren otuz gün içinde münfesih kurumun bağlı olduğu vergi dairesine verirler.
    celdiriciler:
      A: 2025 beyannamesi de münfesih kurum adına, birleşilen kurumla müştereken ve aynı otuz günlük sürede verilir; genel
        süreye kalmaz.
      B: Otuz günlük süre tescilden değil Ticaret Sicili Gazetesindeki ilandan itibaren başlar; beyannameler müştereken imzalanır.
      C: Devir tarihine kadar elde edilen kazanç münfesih kurum adına ayrı beyannameyle vergilendirilir; devralanın beyannamesine
        dahil edilmez.
      E: Beyannameler birleşilen kurumun değil münfesih kurumun bağlı olduğu vergi dairesine verilir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 20/1-a
    alinti: Şirket yetkili kurulunun devre ilişkin kararının Ticaret Sicilinde tescil edildiği tarih, devir tarihidir. Münfesih
      kurum ile birleşilen kurum; 1) Devir tarihi itibarıyla hazırlayacakları ve müştereken imzalayacakları münfesih kuruma
      ait kurumlar vergisi beyannamesi ile, 2) Devir işleminin hesap döneminin kapandığı aydan kurumlar vergisi beyannamesinin
      verildiği ayın sonuna kadar geçen süre içerisinde yapılması halinde, münfesih kurumun önceki hesap dönemine ilişkin
