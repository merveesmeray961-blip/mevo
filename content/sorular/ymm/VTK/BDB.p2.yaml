- id: YMM-VTK-BDB-0006
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: devralınan zararların mahsubu
  tip: hesaplama
  zorluk: 2
  kok: 'Hesap dönemi takvim yılı olan (A) A.Ş., 2026 yılında (B) A.Ş.''yi KVK md. 19 ve 20/1 hükümlerine uygun olarak devralmıştır.
    (B) A.Ş.''nin devir tarihi itibarıyla VUK''a göre tespit edilen öz sermayesi 600.000 TL''dir. (B)''nin beyannamelerinde
    yer alan ve henüz mahsup edilmemiş zararları şöyledir: 2020 yılı 250.000 TL, 2023 yılı 400.000 TL, 2024 yılı 350.000 TL.
    (B)''nin son beş yıla ait beyannameleri kanuni süresinde verilmiş, (A) (B)''nin faaliyetine devam etmektedir. (A)''nın
    2026 kazancı yeterlidir. Buna göre (A) A.Ş.''nin 2026 kurumlar vergisi beyannamesinde (B)''den devralınan zararlardan
    indirebileceği azami tutar kaç TL''dir?'
  secenekler:
    A: '0'
    B: '150.000'
    C: '600.000'
    D: '750.000'
    E: 1.000.000
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 9/1-a''ya göre zararlar beş yıldan fazla nakledilemez: 2020 zararı en son 2025 kazancından indirilebilirdi,
      2026''da kullanılamaz. Kullanılabilir zararlar 2023 ve 2024 yıllarına ait 750.000 TL''dir. Devirde devralınan zararlar,
      devralınan kurumun devir tarihindeki öz sermayesini geçemez; indirilebilecek azami tutar 600.000 TL olup öz sermayeyi
      aşan 150.000 TL iptal edilir.'
    celdiriciler:
      A: Zarar devri yasağı kısmi bölünmeye ilişkindir; devirde öz sermaye sınırı içinde zarar mahsubu mümkündür.
      B: Öz sermayeyi aşan ve iptal edilen kısım (750.000 − 600.000) indirilebilir tutar sanılmıştır.
      D: Öz sermaye sınırı uygulanmamıştır; devralınan zararlar devir tarihindeki öz sermayeyi geçemez.
      E: Beş yıllık süresi dolmuş 2020 zararı da hesaba katılmış ve öz sermaye sınırı uygulanmamıştır.
    hesap_adimlari:
    - '2020 zararı: 2021–2025 dönemlerinde mahsup edilebilirdi → 2026''da kullanılamaz'
    - Kullanılabilir zarar = 400.000 + 350.000 = 750.000
    - Sınır = devir tarihindeki öz sermaye 600.000 → indirilecek 600.000 TL; 150.000 TL iptal
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-a
    alinti: Beş yıldan fazla nakledilmemek şartıyla geçmiş yılların beyannamelerinde yer alan zararlar. Kanunun 20 nci maddesinin
      birinci fıkrası çerçevesinde devralınan kurumların devir tarihi itibarıyla öz sermaye tutarını geçmeyen zararları
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 9.2.3
    alinti: Öz sermaye sınırlamasını aşan zarar tutarları ise iptal edilecektir.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kullanilabilir = 400000 + 350000

      sonuc = min(kullanilabilir, 600000)'
