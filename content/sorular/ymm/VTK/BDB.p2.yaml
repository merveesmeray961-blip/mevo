  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: tasfiye
  tip: hesaplama
  zorluk: 3
  kok: '(R) A.Ş. 3.2.2026 tarihinde tasfiyeye girmiş, tasfiye 20.11.2026 tarihinde sona ermiştir. Tasfiye dönemine ilişkin
    bilgiler şöyledir:


    - Tasfiye dönemi başındaki servet değeri (öz sermaye): 3.000.000 TL

    - Tasfiye dönemi sonundaki servet değeri (öz sermaye): 3.400.000 TL (aşağıdaki işlemlerin tamamı yansıtılmış hâliyle)

    - Tasfiye sırasında ortaklara avans olarak ödenen tutar: 500.000 TL

    - Tasfiye sırasında ortaklarca sermayeye ilave olarak yapılan ödeme: 200.000 TL

    - Tasfiye sırasında elde edilen ve kurumlar vergisinden istisna iştirak kazancı: 150.000 TL

    - Tasfiye döneminde gider yazılan ve kanunen kabul edilmeyen gider niteliğindeki vergi cezası: 50.000 TL


    Buna göre (R) A.Ş.''nin tasfiye dönemine ait kurumlar vergisi matrahı kaç TL''dir?'
  secenekler:
    A: '100.000'
    B: '400.000'
    C: '550.000'
    D: '600.000'
    E: '900.000'
  dogru: D
  aciklama:
    dogru_neden: 'Tasfiye aynı takvim yılında başlayıp bittiğinden tek tasfiye dönemi vardır. KVK md. 17/4''e göre tasfiye
      kârı, dönem sonu ve başı servet değerleri arasındaki olumlu farktır; ortaklara avans olarak yapılan ödemeler sona, ortakların
      sermayeye ilave ödemeleri ile istisna kazançlar başa eklenir: (3.400.000 + 500.000) − (3.000.000 + 200.000 + 150.000)
      = 550.000 TL. Md. 17/4-c uyarınca md. 11 hükümleri de dikkate alınacağından gider yazılan 50.000 TL vergi cezası eklenir;
      matrah 600.000 TL''dir. Püf noktaları: servet karşılaştırmasında sermaye ilavesi ve istisna kazanç başa, avanslar sona
      eklenir; tasfiye kârı bulunduktan sonra KKEG''ler ayrıca eklenmelidir.'
    celdiriciler:
      A: 'Ortaklara ödenen avans dönem sonu servetine eklenmemiştir: (3.400.000 − 3.350.000) + 50.000.'
      B: Yalnız servet değerleri farkı alınmış; hiçbir düzeltme yapılmamıştır.
      C: Tasfiye kârı doğru bulunmuş, ancak md. 11 kapsamındaki 50.000 TL vergi cezası matraha eklenmemiştir.
      E: Yalnız avans eklenmiş; sermaye ilavesi ve istisna kazanç başlangıç servetine eklenmemiş, KKEG de dikkate alınmamıştır
        (3.900.000 − 3.000.000).
    hesap_adimlari:
    - Düzeltilmiş dönem sonu servet = 3.400.000 + 500.000 = 3.900.000
    - Düzeltilmiş dönem başı servet = 3.000.000 + 200.000 + 150.000 = 3.350.000
    - Tasfiye kârı = 3.900.000 − 3.350.000 = 550.000
    - Matrah = 550.000 + 50.000 (KKEG) = 600.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/4
    alinti: Tasfiye kârı, tasfiye döneminin sonundaki servet değeri ile tasfiye döneminin başındaki servet değeri arasındaki
      olumlu farktır. a) Tasfiye kârı hesaplanırken; 1) Ortaklara veya kurum sahiplerine tasfiye esnasında avans olarak veya
      diğer şekillerde yapılan her türlü ödemeler tasfiyenin sonundaki servet değerine, 2) Mevcut sermayeye ilave olarak ortaklar
      veya sahipleri tarafından yapılan ödemeler ile tasfiye esnasında elde edilen ve vergiden istisna edilmiş olan kazanç
      ve iratlar tasfiye döneminin başındaki servet değerine, eklenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 17/4-c
    alinti: Bu maddeye göre tasfiye kârının hesaplanması sırasında, Kanunun 8, 9, 10 ve 11 inci madde hükümleri de ayrıca
      dikkate alınır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'son = 3400000 + 500000

      bas = 3000000 + 200000 + 150000

      sonuc = (son - bas) + 50000'
