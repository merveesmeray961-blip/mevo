- id: YMM-VTK-BDB-0009
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: devralınan zararların mahsubu
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef (S) A.Ş., 2026 yılında KVK md. 19/3-a ve 20/2 hükümlerine uygun olarak tam bölünmüştür. Bölünme sonucunda
    (S)''nin varlıklarının (kayıtlı değer itibarıyla) %60''ı (X) A.Ş.''ye, %40''ı (Y) A.Ş.''ye devredilmiş; öz sermayesi de
    aynı oranlarda devralınmıştır. (S)''nin bölünme tarihi itibarıyla VUK''a göre öz sermayesi 500.000 TL''dir. (S)''nin beyannamelerinde
    yer alan ve mahsup edilmemiş zararları şöyledir: 2019 yılı 200.000 TL, 2022 yılı 500.000 TL, 2024 yılı 400.000 TL. Zarar
    mahsubuna ilişkin diğer şartlar sağlanmıştır ve (X)''in 2026 kazancı yeterlidir. Buna göre (X) A.Ş.''nin 2026 yılında
    (S)''den devralınan zararlardan indirebileceği azami tutar kaç TL''dir?'
  secenekler:
    A: '0'
    B: '300.000'
    C: '500.000'
    D: '540.000'
    E: '660.000'
  dogru: B
  aciklama:
    dogru_neden: '2019 zararının beş yıllık süresi 2024''te dolmuştur; kullanılabilir zararlar 2022 ve 2024 yıllarına ait
      900.000 TL''dir. KVK md. 9/1-a''ya göre tam bölünmede devralan kurum, bölünen kurumun öz sermayesinin devralınan tutarını
      geçmeyen ve devralınan kıymetle orantılı zararları indirebilir. Orantılı zarar: 900.000 × %60 = 540.000 TL; öz sermayenin
      devralınan tutarı: 500.000 × %60 = 300.000 TL. Küçük olan 300.000 TL indirilebilir. Püf noktaları: tam bölünmede iki
      sınır birlikte uygulanır (orantı ve devralınan öz sermaye); öz sermaye sınırı bölünen kurumun toplam öz sermayesi değil,
      devralanın payına düşen kısmıdır.'
    celdiriciler:
      A: Zarar devri yasağı kısmi bölünmeye özgüdür; tam bölünmede sınırlar dahilinde zarar devralınabilir.
      C: Öz sermaye sınırı bölünen kurumun toplam öz sermayesi olarak alınmış; sınır, öz sermayenin devralınan tutarıdır (300.000).
      D: Yalnız orantı uygulanmış, devralınan öz sermaye sınırı gözden kaçırılmıştır.
      E: Süresi dolmuş 2019 zararı da orantıya katılmış (1.100.000 × %60) ve öz sermaye sınırı uygulanmamıştır.
    hesap_adimlari:
    - Kullanılabilir zarar = 500.000 + 400.000 = 900.000 (2019 zararının süresi dolmuş)
    - Orantılı zarar = 900.000 × 0,60 = 540.000
    - Devralınan öz sermaye = 500.000 × 0,60 = 300.000
    - İndirilebilecek = min(540.000; 300.000) = 300.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-a
    alinti: '20 nci maddenin ikinci fıkrası kapsamında gerçekleştirilen tam bölünme işlemi sonucu bölünen kurumdaki öz sermayesinin
      devralınan tutarını geçmeyen ve devralınan kıymetle orantılı zararların indirilmesinde aşağıdaki şartlar ayrıca aranır:'
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: '9.2'
    alinti: Tam bölünme işleminde, bölünen kurumun zararlarından, söz konusu kurumun öz sermayesinin devralınan tutarını geçmeyen
      ve devralınan kıymetle orantılı zarar kısmı mahsup edilebilecektir.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'zarar = 500000 + 400000

      sonuc = round(min(zarar * 0.60, 500000 * 0.60))'
