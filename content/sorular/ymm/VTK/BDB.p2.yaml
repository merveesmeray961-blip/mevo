  - YMM
  ders: VTK
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: nev'i değişikliği
  tip: uygulama
  zorluk: 3
  kok: Hesap dönemi takvim yılı olan tam mükellef (K) Ltd. Şti., KVK md. 19/1'deki şartları sağlayarak (K) A.Ş.'ye dönüşmüştür.
    Tür değişikliği kararı 10.3.2026 tarihinde ticaret siciline tescil edilmiş, 16.3.2026 tarihinde Türkiye Ticaret Sicili
    Gazetesinde ilan edilmiştir. (K) Ltd. Şti.'nin 2025 hesap dönemine ait kurumlar vergisi beyannamesi henüz verilmemiştir.
    Beyannameler 8.4.2026 tarihinde verilmiştir. Bu tür değişikliği hakkında aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Tür değişikliği devir hükmündedir; (K) Ltd. Şti.'nin yalnız devir tarihine kadarki kazancı vergilendirilir, devirden
      doğan kâr hesaplanmaz.
    B: (K) Ltd. Şti.'nin 1.1.2026 – 10.3.2026 kıst dönemine ve 2025 hesap dönemine ait beyannameleri birlikte verilir.
    C: Beyannameler, 16.3.2026'dan itibaren otuz gün içinde Ltd. Şti. ve A.Ş. tarafından müştereken imzalanarak verilir.
    D: Kıst dönem beyannamesi verildiğinden 1.1.2026 – 10.3.2026 dönemi için ayrıca geçici vergi beyannamesi verilmez.
    E: A.Ş., devraldığı amortismana tabi kıymetleri yeni iktisap gibi değerlendirip faydalı ömrün başından itibaren amortismana
      tabi tutar.
  dogru: E
  aciklama:
    dogru_neden: 'KVK md. 19/2''ye göre şartlara uygun tür değişikliği devir hükmündedir. Devirde kıymetler kayıtlı değerleriyle,
      düzenleyici hesaplarıyla birlikte devrolunduğundan Tebliğ (19.3.2) bu devri amortisman bakımından ilk iktisap saymaz;
      devralan, bakiye değerler üzerinden kalan amortisman süresini dikkate alarak amortismana devam eder. E ifadesi bu nedenle
      yanlıştır. Püf noktaları: tür değişikliği de devir hükümlerine (md. 20/1) tabidir; Mart ayında gerçekleşen dönüşüm,
      Aralık–Nisan aralığına düştüğünden önceki dönem beyannamesini de aynı süreye çeker.'
    celdiriciler:
      A: Md. 19/2 ve 20/1'e göre doğrudur.
      B: Devir, hesap döneminin kapandığı aydan beyannamenin verildiği ayın sonuna kadar olan sürede gerçekleştiğinden 2025
        beyannamesi de kıst dönem beyannamesiyle birlikte verilir; doğrudur.
      C: Md. 20/1-a'ya göre beyannameler ilandan itibaren otuz gün içinde müştereken imzalanarak münfesih kurumun vergi dairesine
        verilir; doğrudur.
      D: Tebliğe göre geçici vergi beyannamesinin verilme süresinden önce aynı döneme ilişkin devir beyannamesi verilmişse
        ayrıca geçici vergi beyannamesi verilmez; birinci dönem geçici vergi beyan süresi henüz gelmemiştir; doğrudur.
    hesap_adimlari: []
