  konu: BDB
  kazanim: KVK md.18-20 devir ve bölünme şartları
  tip: kavrama
  zorluk: 2
  kok: 'KVK md. 19/3-b kapsamındaki kısmi bölünme hakkında 2026 yılı itibarıyla aşağıdaki ifadelerden hangileri doğrudur?


    I. İştirak hisselerinin kısmi bölünmeye konu edilebilmesi için bilançoda en az iki tam yıl süreyle elde tutulmuş olması
    gerekir.

    II. Üretim veya hizmet işletmesinin devrinde, işletme bütünlüğü korunacak şekilde faaliyetin devamı için gerekli aktif
    ve pasif kalemlerin tümü devredilmelidir.

    III. Bilançoda en az iki tam yıl süreyle bulunan bir taşınmaz, tek başına kısmi bölünme yoluyla kayıtlı değeri üzerinden
    devredilebilir.

    IV. Bölünen kurumun geçmiş yıl zararları, devredilen varlıklarla orantılı olarak devralan kuruma intikal eder.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve IV
    D: I, II ve III
    E: I, II ve IV
  dogru: A
  aciklama:
    dogru_neden: KVK md. 19/3-b'ye göre kısmi bölünmeye konu olabilecek varlıklar, en az iki tam yıl süreyle elde tutulan
      iştirak hisseleri ile üretim veya hizmet işletmeleridir (I doğru); işletme devrinde faaliyetin devamı için gerekli aktif
      ve pasif kalemlerin tümünün devri zorunludur (II doğru). 7456 sayılı Kanunla (15.7.2023) "taşınmazlar" ibaresi bentten
      çıkarıldığından taşınmazlar tek başına kısmi bölünmeye konu edilemez (III yanlış). Kısmi bölünmede zarar intikali öngörülmemiştir;
      geçmiş yıl zararları devredilemez (IV yanlış).
    celdiriciler:
      B: 'III yanlıştır: 7456 sayılı Kanunla taşınmazlar kısmi bölünme kapsamından çıkarılmıştır.'
      C: 'IV yanlıştır: zarar devri yalnız devir ve tam bölünmede mümkündür; ayrıca doğru olan I eksiktir.'
      D: III, değişiklik öncesi metne dayanır; 2026 itibarıyla taşınmaz tek başına kısmi bölünmeye konu edilemez.
      E: 'IV yanlıştır: Tebliğe göre kısmi bölünmede geçmiş yıl zararlarının hiçbir şekilde devri mümkün değildir.'
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 19/3-b
    alinti: 'Kısmî bölünme: Tam mükellef bir sermaye şirketinin veya sermaye şirketi niteliğindeki bir yabancı kurumun Türkiye’deki
      iş yeri veya daimî temsilcisinin bilânçosunda yer alan ve en az iki tam yıl süreyle elde tutulan iştirak hisseleri ya
      da sahip oldukları üretim veya hizmet işletmelerinin bir veya birkaçını kayıtlı değerleri üzerinden aynî sermaye olarak
      mevcut veya yeni kurulacak tam mükellef bir sermaye şirketine devretmesi, bu Kanunun uygulanmasında kısmî bölünme hükmündedir.
