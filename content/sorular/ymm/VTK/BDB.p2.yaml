    alinti: Diğer bir ifadeyle devralan kurumda devir ve bölünme işlemi nedeniyle devrolan amortismana tabi iktisadi kıymetlerin
      bakiye değerleri üzerinden kalan amortisman süreleri dikkate alınarak amortisman ayrılmaya devam edilecektir.
