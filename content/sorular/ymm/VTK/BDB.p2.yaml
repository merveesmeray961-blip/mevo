- id: YMM-VTK-BDB-0003
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Birleşme devir bölünme ve tür değişikliği
  konu: BDB
  kazanim: KVK md.18-20 devir ve bölünme şartları
  tip: hesaplama
  zorluk: 1
  kok: Tam mükellef (T) A.Ş.'nin KVK md. 19/3-a kapsamında tam bölünmesi planlanmaktadır. Devralan şirketlerin, bölünen şirketin
    ortaklarına iştirak hisselerine ek olarak toplam 600.000 TL nakit ödeme yapması öngörülmektedir. İşlemin bölünme sayılmasına
    engel olmaması için ortaklara verilecek iştirak hisselerinin toplam itibari değeri en az kaç TL olmalıdır?
  secenekler:
    A: 1.200.000
    B: 3.000.000
    C: 4.000.000
    D: 5.400.000
    E: 6.000.000
  dogru: E
  aciklama:
    dogru_neden: KVK md. 19/3-a'ya göre devredilen şirketin ortaklarına verilecek iştirak hisselerinin itibari değerinin %10'una
      kadarlık kısmının nakit olarak ödenmesi işlemin bölünme sayılmasına engel değildir. Nakit ≤ itibari değer × %10 olmalıdır;
      600.000 / 0,10 = 6.000.000 TL.
    celdiriciler:
      A: '%50 sınırı varsayılmıştır (600.000 / 0,50); kanuni sınır %10''dur.'
      B: '%20 sınırı varsayılmıştır (600.000 / 0,20).'
      C: '%15 sınırı varsayılmıştır (600.000 / 0,15).'
      D: '%10, hisse ve nakit toplamı üzerinden uygulanmış (6.000.000 − 600.000); oysa oran hisselerin itibari değerine uygulanır
        ve bu durumda nakit 5.400.000''in %10''unu aşar.'
    hesap_adimlari:
    - Nakit ≤ %10 × itibari değer → itibari değer ≥ 600.000 / 0,10 = 6.000.000 TL
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 19/3-a
    alinti: Devredilen şirketin ortaklarına verilecek iştirak hisselerinin itibarî değerinin % 10’una kadarlık kısmının nakit
      olarak ödenmesi, işlemin bölünme sayılmasına engel değildir.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = round(600000 / 0.10)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
