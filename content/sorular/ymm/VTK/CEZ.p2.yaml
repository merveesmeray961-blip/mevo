  kok: (S) Ltd. Şti. nezdinde 2026 yılında yapılan ve bu yıl içindeki ilk tespit olan denetimde, şirketin aynı tespitte üç
    ayrı satışı için fatura düzenlemediği belirlenmiştir. Faturalara yazılması gereken meblağlar (KDV dahil) 400.000 TL, 120.000
    TL ve 90.000 TL'dir. 400.000 TL'lik satışın alıcısı (A) AŞ, faturanın düzenlenmediğini idarenin bilgisine girmeden önce
    ve faturanın düzenlenmesi gereken süreyi takip eden beş iş günü içinde idareye bildirmiştir; diğer alıcılar bildirimde
    bulunmamıştır. VUK md. 353/1'deki en az ceza tutarı 2026 yılı için ilk tespitte belge başına 17.000 TL'dir. Buna göre
    fatura düzenlemeyen (S) Ltd. Şti. adına kesilecek özel usulsüzlük cezası toplamı kaç TL'dir?
  secenekler:
    A: '61.000'
    B: '74.000'
    C: '141.000'
    D: '154.000'
    E: '222.000'
  dogru: D
  aciklama:
    dogru_neden: 'Md. 353/1''e göre her bir belge için meblağın %10''u, ilk tespitte 17.000 TL''den aşağı olmamak üzere ceza
      kesilir; tek tespitte birden fazla belge düzenlenmemişse her belge için ayrı ceza kesilir ve bu tespit tek tespit sayılır.
      400.000 TL''lik fatura: %10 = 40.000 TL; alıcı süresinde bildirimde bulunduğundan alıcıya ceza kesilmez, düzenleyene
      ceza üç kat uygulanır: 120.000 TL. 120.000 TL''lik fatura: %10 = 12.000 TL < 17.000 → 17.000 TL. 90.000 TL''lik fatura:
      9.000 TL < 17.000 → 17.000 TL. Toplam 154.000 TL. Püf noktaları: En az tutar her belge için ayrı uygulanır ve tek tespitteki
      belgelerin tamamı ''ilk tespit'' tutarına tabidir. Üç kat artırım yalnız alıcının süresinde bildirdiği belge için düzenleyene
      uygulanır.'
    celdiriciler:
      A: En az tutar ve üç kat artırım uygulanmadan yalnız %10 hesaplanmıştır (40.000 + 12.000 + 9.000).
      B: En az tutar doğru uygulanmış, ancak alıcının bildirimi nedeniyle düzenleyene uygulanacak üç kat artırım atlanmıştır.
      C: Üç kat artırım uygulanmış, ancak küçük faturalarda en az ceza tutarı (17.000 TL) dikkate alınmamıştır.
      E: Üç kat artırım bütün belgelere uygulanmıştır; oysa yalnız alıcının süresinde bildirdiği belge için geçerlidir.
    hesap_adimlari:
    - 400.000 x %10 = 40.000; x 3 = 120.000
    - 120.000 x %10 = 12.000 → en az 17.000
    - 90.000 x %10 = 9.000 → en az 17.000
    - Toplam = 154.000
