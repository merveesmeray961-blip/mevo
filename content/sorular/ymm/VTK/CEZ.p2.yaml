- id: YMM-VTK-CEZ-0004
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi cezaları ve uzlaşma
  konu: CEZ
  kazanim: pişmanlık ve ıslah
  tip: uygulama
  zorluk: 2
  kok: '(E) AŞ ile ilgili aşağıdaki ifadelerden hangileri, VUK md. 371''deki pişmanlık hükümleri bakımından doğrudur?


    I. Şirket nezdinde yalnız kurumlar vergisi incelemesi başlamışken, Mart 2026 KDV beyanındaki eksikliği bu inceleme başladıktan
    sonra dilekçeyle kendiliğinden haber veren şirket, diğer şartları da taşırsa KDV bakımından pişmanlıktan yararlanabilir.

    II. Şirketin haber verme dilekçesinden önce bir muhbirin aynı hususu dilekçeyle ihbar ettiği ve dilekçenin resmî kayıtlara
    geçtiği durumda da şirket pişmanlıktan yararlanabilir.

    III. Haber verme dilekçesinin verildiği tarihten itibaren yirminci gün düzeltme beyannamesini veren ve vergiyi pişmanlık
    zammıyla aynı gün ödeyen şirket pişmanlıktan yararlanır.

    IV. Pişmanlıkla ödenecek vergiye, ödemenin geciktiği her ay ve kesri için 6183 sayılı Kanun md. 51''deki gecikme zammı
    oranında zam uygulanır.'
  secenekler:
    A: I ve IV
    B: I ve II
    C: II ve III
    D: I, III ve IV
    E: II ve IV
  dogru: A
  aciklama:
    dogru_neden: 'I doğrudur: 7338 sayılı Kanun''la değişik md. 371/2''ye göre engel, haber verilen olayın ilgili olduğu vergi
      türüne ilişkin incelemenin başlamasıdır; kurumlar vergisi incelemesi KDV bakımından pişmanlığa engel değildir. IV doğrudur:
      ödeme süresi geçmiş vergiler, her ay ve kesri için gecikme zammı oranında bir zamla ödenir. II yanlıştır: haber vermeden
      önce muhbir ihbarı resmî kayda geçmişse pişmanlık şartı (md. 371/1) sağlanmaz. III yanlıştır: eksik beyanın tamamlanması
      ve ödeme, haber verme tarihinden başlayarak on beş gün içinde yapılmalıdır.'
    celdiriciler:
      B: II yanlıştır; muhbir ihbarının haber vermeden önce resmî kayda geçmesi pişmanlığa engeldir.
      C: 'Her iki ifade de yanlıştır: muhbir ihbarı engeldir, yirminci günde yapılan beyan ve ödeme on beş günlük süreyi aşar.'
      D: III yanlıştır; düzeltme ve ödeme için süre on beş gündür.
      E: II yanlış, I ise doğrudur; inceleme başka bir vergi türüne ilişkin olduğundan KDV için pişmanlık mümkündür.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 371/1-1
    alinti: 1. Mükellefin keyfiyeti haber verdiği tarihten önce bir muhbir tarafından her hangi resmi bir makama dilekçe ile
      veya şifahi beyanı tutanakla tevsik edilmek suretiyle haber verilen husus hakkında ihbarda bulunulmamış olması (Dilekçe
      veya tutanağın resmi kayıtlara geçirilmiş olması şarttır.).
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 371/1-2
    alinti: 2. Haber verme dilekçesinin yetkili memurlar tarafından mükellef nezdinde haber verilen olayın ilgili olduğu vergi
      türüne ilişkin bir vergi incelemesine başlandığı veya olayın ve ilgili olduğu vergi türünün takdir komisyonuna intikal
      ettirildiği günden evvel (Kaçakçılık suçu teşkil eden fiillerin işlendiğinin tespitinden önce) verilmiş ve resmi kayıtlara
      geçirilmiş olması.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 371/1-4, 5
    alinti: 4. Eksik veya yanlış yapılan vergi beyanının mükellefin keyfiyeti haber verme tarihinden başlayarak onbeş gün
      içinde tamamlanması veya düzeltilmesi. 5. Mükellefçe haber verilen ve ödeme süresi geçmiş bulunan vergilerin, ödemenin
      geciktiği her ay ve kesri için, 6183 sayılı Kanunun 51 inci maddesinde belirtilen nispette uygulanacak gecikme zammı
      oranında bir zamla birlikte haber verme tarihinden başlayarak onbeş gün içinde ödenmesi.
  gecerlilik:
    baslangic: '2021-10-26'
    bitis: null
    yila_bagli_tutar: false
