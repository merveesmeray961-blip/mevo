      E: Kendiliğinden geç verilen beyanname için öngörülen %50 oranı uygulanmamış, ceza bir kat (200.000 TL) alınmıştır.
    hesap_adimlari:
    - 'Md. 344/3: 200.000 x %50 = 100.000'
    - Tekerrür artırımı = min(100.000 x %50; 30.000) = 30.000
    - VZC = 130.000; md. 336 → usulsüzlük kesilmez
    - Toplam = 130.000
