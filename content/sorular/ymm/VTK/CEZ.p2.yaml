- id: YMM-VTK-CEZ-0002
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi cezaları ve uzlaşma
  konu: CEZ
  kazanim: vergi ziyaı ve usulsüzlük cezaları
  tip: hesaplama
  zorluk: 1
  kok: Vergi kanunlarına göre mükellefiyet tesis ettirmesi gerektiği hâlde bu zorunluluğa uymayan Bay (R), 2025 yılında vergi
    dairesinin ıttılaı dışında ticari faaliyette bulunmuştur. Yapılan inceleme sonucunda 2025 yılı için 300.000 TL gelir vergisi
    re'sen tarh edilmiştir. Fiil VUK md. 359 kapsamında değildir; (R) hakkında daha önce kesinleşmiş vergi cezası bulunmamaktadır.
    Buna göre (R) adına bu tarhiyat nedeniyle kesilecek vergi ziyaı cezası kaç TL'dir?
  secenekler:
    A: '300.000'
    B: '450.000'
    C: '600.000'
    D: '900.000'
    E: 1.350.000
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 344/1''e göre vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır (300.000 TL). 7524 sayılı
      Kanun''la eklenen fıkraya göre mükellefiyet tesis ettirmeksizin vergi dairesinin ıttılaı dışında ticari faaliyette bulunularak
      vergi ziyaına sebebiyet verilmesi hâlinde bu ceza %50 artırılarak uygulanır: 300.000 x 1,5 = 450.000 TL.'
    celdiriciler:
      A: Bir kat ceza bulunmuş, ancak kayıt dışı faaliyet nedeniyle öngörülen %50 artırım uygulanmamıştır.
      C: Artırım %50 değil %100 (iki kat) olarak uygulanmıştır.
      D: Üç kat ceza, vergi ziyaına VUK md. 359'daki fiillerle sebebiyet verilmesi hâline özgüdür; olayda bu fiiller yoktur.
      E: Üç kat ceza üzerine %50 artırım uygulanmıştır; fiil md. 359 kapsamında olmadığından esas ceza bir kattır.
    hesap_adimlari:
    - Esas VZC = 300.000 x 1 = 300.000
    - Artırımlı VZC = 300.000 x 1,5 = 450.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344 (son fıkra)
    alinti: (Ek fıkra:28/7/2024-7524/9 md.) Vergi kanunlarına göre mükellefiyet tesis ettirilmesi gerektiği halde bu zorunluluğa
      uyulmaksızın vergi dairesinin ıttılaı dışında ticari, zirai veya mesleki faaliyette bulunmak suretiyle vergi ziyaına
      sebebiyet verilmesi durumunda, birinci, ikinci ve üçüncü fıkralara göre kesilecek vergi ziyaı cezası yüzde elli artırılarak
      uygulanır. Aynı vergi türü ve dönemine ilişkin daha sonra yapılacak tarhiyatlar nedeniyle kesilecek vergi ziyaı cezalarına
      da aynı artırım hükmü tatbik edilir.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 300000 * 1 * 1.5
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 1)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, satır 17
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-VTK-CEZ-0003
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi cezaları ve uzlaşma
  konu: CEZ
  kazanim: ceza indirimi
  tip: hesaplama
  zorluk: 1
  kok: Vergi incelemesi sonucunda (V) AŞ adına 2024 dönemine ilişkin 90.000 TL KDV ikmalen tarh edilmiş ve bir kat (90.000
    TL) vergi ziyaı cezası kesilmiştir; ihbarname 3/8/2026'da tebliğ edilmiştir. Şirket daha önce de başka bir tarhiyat için
    VUK md. 376 indiriminden yararlanmıştır. (V) AŞ, ihbarnamenin tebliğinden itibaren otuz gün içinde vergi dairesine başvurarak
    vergi ile indirimli cezayı vadesinde ödeyeceğini bildirmiş ve süresinde ödemiştir; uzlaşma talebi ve dava yoktur. Buna
    göre şirketin ödediği vergi ve ceza toplamı kaç TL'dir? (Gecikme faizi dikkate alınmayacaktır.)
  secenekler:
    A: '90.000'
    B: '112.500'
    C: '135.000'
    D: '150.000'
    E: '180.000'
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 376/1-(1)''e göre ikmalen tarh edilen vergiyi ve cezanın yarısını otuz gün içinde başvurup vadesinde
      ödeyeceğini bildiren ve ödeyen mükellefin cezasının yarısı indirilir. Daha önce yararlanılmış olması önem taşımaz; sonraki
      tarhiyatlarda daha düşük indirim öngören (2) numaralı bent 7524 sayılı Kanun''la yürürlükten kaldırılmıştır. Ödenen:
      90.000 (vergi) + 45.000 (cezanın yarısı) = 135.000 TL.'
    celdiriciler:
      A: İndirim yalnız cezaya uygulanır; vergi aslının tamamı ödenir.
      B: '%50 artırımlı indirim (%75), Ek md. 1''e göre yalnız 40.000 TL''yi aşmayan usulsüzlük ve özel usulsüzlük cezaları
        içindir.'
      D: Cezanın üçte birinin indirilmesi, mülga 376/1-(2) hükmüne dayanır; 2026'da uygulanmaz.
      E: Şartlar yerine getirildiğinden cezanın yarısı indirilir; vergi ve cezanın tamamı ödenmez.
    hesap_adimlari:
    - Ödenecek = 90.000 + 90.000 / 2 = 135.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 376/1
    alinti: (Değişik birinci fıkra:5/12/2019-7194/26 md.) Mükellef veya vergi sorumlusu; 1. İkmalen, resen veya idarece tarh
      edilen vergiyi veya vergi farkını ve vergi ziyaı, usulsüzlük ve özel usulsüzlük cezalarının yarısını ihbarnamelerin
      tebliğ tarihinden itibaren otuz gün içinde ilgili vergi dairesine başvurarak vadesinde veya 6183 sayılı Kanunda belirtilen
      türden teminat göstererek vadenin bitmesinden itibaren üç ay içinde ödeyeceğini bildirirse kesilen cezanın yarısı, 2.
      (Mülga:28/7/2024-7524/14 md.) indirilir.
  gecerlilik:
    baslangic: '2024-08-02'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 90000 + 90000 / 2
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
