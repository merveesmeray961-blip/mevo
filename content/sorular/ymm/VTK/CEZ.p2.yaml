      ceza %50 artırılır (50.000 TL); ancak artırım kesinleşen cezayı (30.000 TL) aşamaz: 100.000 + 30.000 = 130.000 TL. Tek
      fiille vergi ziyaı ve usulsüzlük birlikte işlendiğinden md. 336 uyarınca yalnız miktarca en ağır olan vergi ziyaı cezası
