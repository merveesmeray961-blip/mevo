  kok: VUK md. 370 kapsamındaki izaha davet uygulamasına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**? (2026 yılı tutarları
    esas alınacaktır.)
  secenekler:
    A: İzaha davet yazısı tebliğ edilen mükellef, davet konusu tespitle sınırlı olarak pişmanlık hükümlerinden yararlanamaz.
    B: Yapılan izah sonucu vergi ziyaı olmadığı idarece anlaşılırsa, mükellef bu tespitle ilgili vergi incelemesine tabi tutulmaz.
    C: İzah yeterli bulunmaz da otuz gün içinde beyan düzeltilip vergi zamla ödenirse vergi ziyaı cezası %20 oranında kesilir.
    D: 2026'da 1.000.000 TL sahte belge kullandığı ön tespit edilen, yıllık alışları 25.000.000 TL olan mükellefe yazı tebliğ
      edilebilir.
    E: '%20 oranında vergi ziyaı cezası uygulanması, aynı konuda vergi incelemesi yapılmasına ve tarhiyatın ikmaline engeldir.'
  dogru: E
  aciklama:
