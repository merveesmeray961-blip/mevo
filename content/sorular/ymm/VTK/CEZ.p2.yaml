      ziyaı cezası %20 oranında kesilir; ancak kanun açıkça "Bu durum vergi incelemesi yapılmasına ve gerekirse tarhiyatın
      ikmaline engel teşkil etmez" demektedir. Bu nedenle E yanlıştır.
    celdiriciler:
      A: Doğrudur; davet yazısı tebliğ edilen mükellef, davet konusu tespitle sınırlı olarak md. 371'den yararlanamaz.
      B: Doğrudur; izah sonucu vergi ziyaı olmadığı anlaşılırsa o tespitle ilgili inceleme yapılmaz, takdire sevk edilmez.
      C: Doğrudur; bu, md. 370/a-2'deki %20 oranlı vergi ziyaı cezası uygulamasıdır.
      D: Doğrudur; belge tutarı 870.000 TL'yi aşsa da yıllık mal ve hizmet alışlarının %5'ini (1.250.000 TL) aşmadığından
        ön tespit yazısı tebliğ edilebilir.
