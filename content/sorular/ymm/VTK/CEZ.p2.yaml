- id: YMM-VTK-CEZ-0006
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi cezaları ve uzlaşma
  konu: CEZ
  kazanim: uzlaşma ve izaha davet
  tip: kavrama
  zorluk: 2
  kok: '2026 yılında yapılan bir vergi incelemesine dayanan tarhiyat ve cezalarla ilgili olarak, VUK''un uzlaşmaya ilişkin
    hükümlerine göre aşağıdaki ifadelerden hangileri doğrudur? (2026 yılı için uzlaşmaya konu edilebilecek usulsüzlük ve özel
    usulsüzlük cezalarında sınır 40.000 TL''dir.)


    I. İkmalen tarh edilen vergi aslı ile buna bağlı vergi ziyaı cezası birlikte uzlaşmaya konu edilebilir.

    II. Cezayı gerektiren fiil bazında toplamı 35.000 TL olan usulsüzlük cezası uzlaşmaya konu edilemez; bu ceza için VUK
    md. 376''daki indirim oranı %50 artırımlı uygulanır.

    III. Üzerinde uzlaşılan cezalar hakkında ayrıca VUK md. 376''daki indirim uygulanmaz.

    IV. Tarhiyat öncesi uzlaşmada uzlaşmaya varılamazsa, mükellef ceza kesildikten sonra tarhiyat sonrası uzlaşma talep edebilir.'
  secenekler:
    A: I ve II
    B: I ve IV
    C: III ve IV
    D: I, II ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 7524 sayılı Kanun'la Ek md. 1'den "tarh edilen vergi" ibaresi çıkarılmış; uzlaşmanın konusu yalnız vergi
      ziyaı cezaları ile 40.000 TL'yi aşan usulsüzlük ve özel usulsüzlük cezalarıdır (I yanlış). Fiil bazında 40.000 TL'yi
      aşmayan usulsüzlük cezası uzlaşmaya konu edilemez ve bunlar için md. 376'daki indirim oranı %50 artırımlı uygulanır
      (II doğru). Ek md. 9'a göre üzerinde uzlaşılan cezalar hakkında başkaca bir indirim uygulanmaz (III doğru). Ek md. 11'e
