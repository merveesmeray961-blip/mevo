    alinti: üzerinden %20 oranında kesilir. Bu durum vergi incelemesi yapılmasına ve gerekirse tarhiyatın ikmaline engel teşkil
      etmez.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
