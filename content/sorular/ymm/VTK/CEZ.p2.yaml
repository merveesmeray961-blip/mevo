    alinti: Kendisine izaha davet yazısı tebliğ edilen mükellefler, davet konusu tespitle sınırlı olarak, bu Kanunun 371 inci
      maddesinde yer alan pişmanlık hükümlerinden yararlanamaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/a-1
    alinti: 1. Mükelleflerce yapılan izah sonucu vergi ziyaına sebebiyet verilmediğinin idarece anlaşılması hâlinde mükellefler
      söz konusu tespitle ilgili olarak vergi incelemesine tabi tutulmaz veya takdir komisyonuna sevk edilmez.
