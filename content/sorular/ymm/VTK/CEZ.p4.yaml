      yılının sonuna kadardır; Ekim 2026 bu süre içindedir. Artırım %50 = 100.000 TL olur, ancak kesinleşen cezayı
      (80.000 TL) aşamaz. Ceza 200.000 + 80.000 = 280.000 TL'dir.
