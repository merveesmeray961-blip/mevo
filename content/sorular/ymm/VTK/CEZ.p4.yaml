    - 'Tekerrür süresi: 31/12/2026''ya kadar'
    - 'Artırım: 200.000 × %50 = 100.000 TL'
    - 'Sınır: 80.000 TL'
    - 'Ceza: 200.000 + 80.000 = 280.000 TL'
