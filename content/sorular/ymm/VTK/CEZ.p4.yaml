    istem_surumu: uretici paketi S3-CEZ
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-18'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-18'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-18'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 3)'
