- id: YMM-VTK-CEZ-0025
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi cezaları ve uzlaşma
  konu: CEZ
  kazanim: kanuni süreden sonra verilen beyannamede ceza
  tip: hesaplama
  zorluk: 2
  kok: (B) A.Ş., 2025 yılı Eylül dönemi KDV beyannamesini kanuni süresi içinde vermemiş, hakkında vergi incelemesine başlanmadan
    ve takdir komisyonuna sevk edilmeden önce beyannameyi kendiliğinden vermiştir. Bu beyannameye göre ziyaa uğratılan KDV
    400.000 TL'dir. Vergi ziyaı 359'daki fiillerden kaynaklanmamaktadır. VUK md. 344'e göre mükellef adına kesilecek vergi
    ziyaı cezası kaç TL'dir?
  secenekler:
    A: '80.000'
    B: '100.000'
    C: '200.000'
    D: '400.000'
    E: 1.200.000
  dogru: C
  aciklama:
    dogru_neden: 'Md. 344/1''e göre ceza ziyaa uğratılan verginin bir katıdır (400.000 TL). Ancak md. 344/3''e göre vergi
      incelemesine başlanmasından veya takdir komisyonuna sevk edilmesinden önce, kanuni süre geçtikten sonra verilen beyannameler
      için kesilecek ceza yüzde elli oranında uygulanır: 400.000 x %50 = 200.000 TL.'
    celdiriciler:
      A: '%20 gibi bir indirim oranı kanunda yoktur; oran yüzde ellidir (200.000 TL).'
      B: '%25 oranı kanunda yoktur; geç beyan indirimi yüzde elli oranındadır.'
      D: Bu tutar indirimsiz ceza olan bir katı gösterir; geç beyan nedeniyle yüzde elli uygulanır.
      E: Bu tutar üç kat ceza olur ve yalnızca 359'daki fiillerde uygulanır; olayda böyle bir fiil yoktur.
    hesap_adimlari:
    - Normal ceza = 400.000 x 1 = 400.000
    - 'Geç beyan: 400.000 x %50 = 200.000'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında ziyaa
      uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/3
    alinti: Vergi incelemesine başlanılmasından veya takdir komisyonuna sevk edilmesinden sonra verilenler hariç olmak üzere,
      kanuni süresi geçtikten sonra verilen vergi beyannameleri için bu madde uyarınca kesilecek ceza yüzde elli oranında
      uygulanır.
  gecerlilik:
    baslangic: '2008-02-20'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ceza = 400000*1*0.5

      sonuc = ceza'
