- id: YMM-VTK-DEG-0003
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: yeniden değerleme (VUK mükerrer 298/ç)
  tip: kavrama
  zorluk: 1
  kok: 'VUK mükerrer 298/ç kapsamında yeniden değerleme uygulamasında, yeniden değerleme yapılabilecek iktisadi
    kıymetlerin kapsamı bakımından aşağıdaki öncüllerden hangileri doğrudur?

    I. Kapsam, maddede belirtilen şartları taşıyan bilanço esasına göre defter tutan mükelleflerin bilançolarındaki
    iktisadi kıymetlere ilişkindir.

    II. Yeniden değerleme, kanunda öngörülen kapsam ve koşullardan bağımsız olarak her varlığa uygulanabilir.

    III. Uygulama, ilgili hükmün öngördüğü şartlar çerçevesinde değerlendirilir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'II numaralı önerme, kanuni kapsam ve koşulları yok saydığı için yanlıştır. I ve III, hükmün kapsam
      ve koşullara bağlı uygulandığını ifade eder. Püf noktaları: Yeniden değerleme genel ve koşulsuz bir hak olarak
      ele alınmamalıdır.'
    celdiriciler:
      A: III de hükmün koşullu uygulanmasını doğru ifade eder.
      B: II, kapsamı koşulsuz biçimde genişlettiği için yanlıştır.
      D: II yanlış olduğundan bu birleşim doğru değildir.
      E: II yanlış olduğundan tüm öncüller doğru olamaz.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 298
    alinti: Kazançlarını bilanço esasına göre tespit eden gelir ve kurumlar vergisi mükellefleri fiyat endeksindeki
