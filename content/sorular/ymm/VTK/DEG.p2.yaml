- id: YMM-VTK-DEG-0007
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: VUK md.258-298 değerleme ölçüleri
  tip: uygulama
  zorluk: 2
  kok: Ticari mal alım satımı yapan (T) A.Ş.'nin 31.12.2026 tarihinde stokunda birim maliyeti 50 TL olan 1.000 adet ticari
    mal (toplam maliyet 50.000 TL) bulunmaktadır. Şirket aynı cins ve nevideki bu maldan Aralık 2026'da ilişkisiz alıcılara
    300 adet satmış, ortalama satış fiyatı 42 TL olmuştur. Değerleme günündeki satış bedeli de 42 TL'dir. VUK hükümlerine
    göre bu stokun değerlemesi hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Düşüklük %10'u aştığından stok, maliyet bedeline %5 eklenerek bulunan 52.500 TL ile değerlenmelidir.
    B: Stok, emsal bedeli olarak Aralık ayı ortalama satış fiyatı esas alınıp 42.000 TL ile değerlenebilir.
    C: Emsal bedeli yalnız takdir komisyonunca belirlenebileceğinden stok takdir edilecek bedelle değerlenmelidir.
    D: Düşüklük %20'ye ulaşmadığından stok, maliyet bedeli olan 50.000 TL ile değerlenmek zorundadır.
    E: Aralık satış miktarı stok miktarının yarısına ulaşmadığından ortalama fiyat esası uygulanamaz.
  dogru: B
  aciklama:
    dogru_neden: 'Satış bedeli maliyete göre (50 − 42) / 50 = %16 düşüktür. VUK md. 274''e göre düşüklük %10 ve daha fazla
      olduğunda mükellef, md. 267''nin ikinci sırasındaki (maliyet bedeli esası) usul hariç olmak üzere emsal bedelini uygulayabilir.
      Md. 267''nin birinci sırası (ortalama fiyat esası) için aylık satış miktarının emsal bedeli tayin olunacak malın miktarının
      %25''inden az olmaması gerekir; 300 / 1.000 = %30 olduğundan şart sağlanır. Stok 1.000 × 42 = 42.000 TL ile değerlenebilir.
      Püf noktası: 274''teki "ikinci sıra hariç" kaydı nedeniyle maliyet + %5 yolu kapalıdır; ayrıca hüküm "tatbik edebilir"
      dediğinden ihtiyaridir.'
    celdiriciler:
      A: Maliyete %5 ekleme md. 267'nin ikinci sırasıdır; md. 274 bu usulü açıkça hariç tutar. Üstelik bu yol değeri maliyetin
        üzerine çıkarır.
      C: Takdir esası üçüncü sıradır; birinci sıra (ortalama fiyat) şartları sağlandığı için takdire gerek yoktur.
      D: Md. 274'teki eşik %20 değil %10'dur; %16'lık düşüklükte emsal bedeli uygulanabilir.
      E: Ortalama fiyat esasında aranan oran %50 değil %25'tir; %30'luk satış oranı şartı karşılar.
    hesap_adimlari:
    - Düşüklük oranı = (50 − 42) / 50 = %16 ≥ %10 → emsal bedeli uygulanabilir
    - Aylık satış oranı = 300 / 1.000 = %30 ≥ %25 → ortalama fiyat esası uygulanabilir
    - Değer = 1.000 × 42 = 42.000 TL
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 274
    alinti: Emtia, maliyet bedeliyle değerlenir. Emtianın maliyet bedeline nazaran değerleme günündeki satış bedelleri % 10
      ve daha fazla bir düşüklük gösterdiği hallerde mükellef, maliyet bedeli yerine 267 nci maddenin ikinci sırasındaki usul
      hariç olmak üzere, emsal bedeli ölçüsünü tatbik edebilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 267/2 (Birinci sıra)
    alinti: Bu esasın uygulanması için, aylık satış miktarının, emsal bedeli tayin olunacak her bir malın miktarına nazaran
      % 25 ten az olmaması şarttır.
