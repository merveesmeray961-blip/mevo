- id: YMM-VTK-DEG-0005
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: amortisman uygulaması
  tip: uygulama
  zorluk: 1
  kok: Bilanço esasına göre defter tutan (M) A.Ş., 2026 yılında ofisinde birbirinden bağımsız olarak kullanılacak tanesi 7.000
    TL olan 3 adet çalışma masası ile 8.000 TL'lik bir sunucu ve yalnız bu sunucuyla birlikte çalışabilen 6.000 TL'lik bir
    depolama ünitesi satın almıştır. Sunucu ile depolama ünitesi iktisadi ve teknik bakımdan bütünlük arz etmektedir. VUK
    md. 313 uyarınca 2026 yılında doğrudan gider yazılabilecek demirbaş haddi 12.000 TL'dir (tutarlar KDV hariçtir). Bu alımlar
    bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Masaların toplamı 21.000 TL olduğundan masalar amortismana tabi tutulur; sunucu ve depolama ünitesi ayrı ayrı haddi
      aşmadığından gider yazılabilir.
    B: Kıymetlerin hiçbiri tek başına 12.000 TL'yi aşmadığından alımların tamamı doğrudan gider yazılabilir.
    C: Masalar doğrudan gider yazılabilir; sunucu ile depolama ünitesi topluca 14.000 TL olduğundan amortismana tabi tutulur.
    D: Alımların toplamı 35.000 TL olduğundan kıymetlerin tamamı amortismana tabi tutulmak zorundadır.
    E: Masalar doğrudan gider yazılmak zorundadır; sunucu sistemi için gider yazma ile amortisman arasında seçim serbesttir.
  dogru: C
  aciklama:
    dogru_neden: VUK md. 313/3'e göre değeri 2026 yılı için 12.000 TL'yi aşmayan demirbaşlar amortismana tabi tutulmayarak
      doğrudan gider yazılabilir; iktisadi ve teknik bakımdan bütünlük arz edenlerde had topluca dikkate alınır. Her biri
      bağımsız kullanılan masalar (7.000 TL) haddin altında kaldığından gider yazılabilir. Sunucu ile depolama ünitesi bütünlük
      arz ettiğinden 8.000 + 6.000 = 14.000 TL topluca dikkate alınır; had aşıldığı için bu sistem amortismana tabi tutulur.
    celdiriciler:
      A: Toplama kuralı yalnız iktisadi ve teknik bütünlük arz eden kıymetlere uygulanır; bağımsız masalar toplanmaz. Bütünlük
        arz eden sunucu sisteminin parçaları ise ayrı ayrı değil topluca değerlendirilir.
      B: Bütünlük arz eden sunucu ve depolama ünitesinde had parça bazında değil topluca (14.000 TL) dikkate alınır.
      D: Bütün alımların toplanması gibi bir kural yoktur; bağımsız kıymetlerde had her kıymet için ayrı uygulanır.
      E: Hükümde doğrudan gider yazma bir imkândır ('yazılabilir'), zorunluluk değildir; sunucu sistemi ise haddi aştığından
        gider yazılamaz, amortismana tabi tutulur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 313/3
    alinti: Değeri 50.000.000 (12.000 TL) lirayı aşmayan peştemallıklar ile işletmede kullanılan ve değeri 50.000.000 (12.000
      TL) lirayı aşmayan alet, edavat, mefruşat ve demirbaşlar amortismana tabi tutulmayarak doğrudan doğruya gider yazılabilir.
      İktisadi ve teknik bakımdan bütünlük arz edenlerde bu had topluca dikkate alınır.
