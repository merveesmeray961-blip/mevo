- id: YMM-VTK-DEG-0006
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: amortisman uygulaması
  tip: bilgi
  zorluk: 1
  kok: Hazine ve Maliye Bakanlığınca faydalı ömrü 30 yıl olarak ilan edilen bir binayı 2026 yılında aktifine kaydeden bir
    mükellef, amortisman süresini VUK md. 320'nin dördüncü fıkrası uyarınca kendisi belirlemek istemektedir. Mükellefin bu
    bina için seçebileceği amortisman süresi hangi aralıktadır?
  secenekler:
    A: 15 – 30 yıl
    B: 20 – 40 yıl
    C: 30 – 60 yıl
    D: Yalnız 30 yıl
    E: 30 – 50 yıl
  dogru: E
  aciklama:
    dogru_neden: VUK md. 320/4'e göre mükellef, Bakanlıkça ilan edilen faydalı ömürden kısa olmamak üzere amortisman süresini
      her yıl aynı nispet olmak kaydıyla belirleyebilir; ancak bu süre Bakanlıkça belirlenen sürenin iki katını ve elli yılı
      aşamaz. Alt sınır 30 yıl; üst sınır iki kat olan 60 yıl ile 50 yıldan küçük olanı, yani 50 yıldır.
    celdiriciler:
      A: Hüküm ilan edilen faydalı ömürden kısa süre seçilmesine izin vermez; alt sınır 30 yıldır.
      B: Alt sınır ilan edilen ömür (30 yıl) olup 20 yıl seçilemez; üst sınır da 40 değil 50 yıldır.
      C: İki kat kuralı tek başına uygulanmış, 50 yıllık mutlak üst sınır gözden kaçırılmıştır.
      D: 320/4 mükellefe ilan edilen ömürden daha uzun süre belirleme serbestisi tanır; süre 30 yılla sınırlı değildir.
    hesap_adimlari: []
  kaynaklar:
