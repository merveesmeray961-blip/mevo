  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef, bilanço esasına göre defter tutan ve kayıtlarını Türk lirasıyla tutan (Y) A.Ş. (hesap dönemi takvim
    yılı), VUK geçici md. 37 nedeniyle 2026 hesap dönemi sonunda enflasyon düzeltmesi yapmayacak ve VUK mükerrer md. 298/Ç
    uyarınca yeniden değerleme yapmak istemektedir. 31.12.2026 itibarıyla yasal kayıtlardaki bilgiler şöyledir:


    - Bina (2019''da aktife girmiş): maliyet 5.000.000 TL, birikmiş amortisman 1.000.000 TL

    - Makine X (2024''te aktife girmiş): maliyet 2.000.000 TL, birikmiş amortisman 600.000 TL. Maliyetin 200.000 TL''si 2025
    yılında maliyete eklenen kredi kur farkıdır; bu tutara isabet eden birikmiş amortisman 40.000 TL''dir.

    - Makine Y (Mart 2026''da aktife girmiş): maliyet 600.000 TL, birikmiş amortisman 60.000 TL

    - Arsa: maliyet 3.000.000 TL


    Kıymetlerin hiçbiri sat-kirala-geri al işlemine konu değildir. 2026 yılı yeniden değerleme oranının %20 olduğu varsayılmaktadır.
    Buna göre pasifte özel fon hesabına alınacak değer artışı toplam kaç TL''dir?'
  secenekler:
    A: 1.048.000
    B: 1.080.000
    C: 1.156.000
    D: 1.360.000
    E: 1.648.000
  dogru: A
  aciklama:
    dogru_neden: 'Geçici md. 37/2''ye göre enflasyon düzeltmesi yapılmayan 2026 dönemi, 298/Ç bakımından düzeltme şartlarının
      gerçekleşmediği dönem sayılır. Değer artışı, yeniden değerleme sonrası ve öncesi net bilanço aktif değerleri arasındaki
      farktır; maliyet ve amortisman aynı oranla çarpıldığından artış = net değer × oran olur. Bina: (5.000.000 − 1.000.000)
      × %20 = 800.000 TL. Makine X: aktifleştirme dönemi dışında (2025) maliyete eklenen kur farkı ve ona isabet eden amortisman
      kapsam dışıdır: (1.800.000 − 560.000) × %20 = 248.000 TL. Makine Y aktife girdiği dönemde değerlenmez; arsa amortismana
      tabi olmadığından kapsam dışıdır. Toplam 1.048.000 TL. Püf noktaları: kur farkı istisnası yalnız aktifleştirme dönemi
      dışında eklenen kur farklarını kapsar ve bunlara isabet eden amortisman da düşülmelidir; artış brüt maliyet üzerinden
      değil net değer üzerinden bulunur.'
    celdiriciler:
      B: '2025''te eklenen kur farkı ve ona isabet eden amortisman da değerlemeye katılmış: 800.000 + 280.000.'
      C: 'Aktife girdiği dönemde değerleme yapılamayan Makine Y de dahil edilmiş: 1.048.000 + 108.000.'
      D: 'Birikmiş amortismanlar düşülmeden brüt maliyetler üzerinden hesaplanmış: (5.000.000 + 1.800.000) × %20.'
      E: 'Amortismana tabi olmayan arsa da değerlenmiş: 1.048.000 + 600.000.'
    hesap_adimlari:
    - 'Bina: (5.000.000 − 1.000.000) × 0,20 = 800.000'
    - 'Makine X (kur farkı hariç): (2.000.000 − 200.000) − (600.000 − 40.000) = 1.240.000; × 0,20 = 248.000'
    - 'Makine Y ve arsa: kapsam dışı'
    - Toplam değer artışı = 800.000 + 248.000 = 1.048.000 TL
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 298/Ç-1, 4, 9
    alinti: İktisadi kıymetlerin maliyet bedellerine eklenmiş bulunan (iktisadi kıymetlerin aktifleştirildiği hesap dönemine
      ilişkin olanlar hariç) kur farkları ve kredi faizleri (bunlara isabet eden amortismanlar dâhil) yeniden değerleme kapsamına
      girmez. … Değer artışı, iktisadi kıymetlerin yeniden değerleme sonrası ve yeniden değerleme öncesi net bilanço aktif
      değerleri arasındaki farktır. … Hesap dönemi içinde aktife giren iktisadi kıymetler için aktife girdiği hesap döneminde,
      yeniden değerleme yapılmaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Geçici md. 37/2
    alinti: Mükerrer 298 inci maddenin (Ç) fıkrası uygulaması açısından, birinci fıkrada enflasyon düzeltmesi yapılmayacağı
      belirtilen dönemler (yetki kapsamında uzatılan dönemler dahil) enflasyon düzeltmesi şartlarının gerçekleşmediği dönem
      olarak değerlendirilir.
