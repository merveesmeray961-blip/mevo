  kok: Bilanço esasına göre defter tutan ve faaliyet konusu araç kiralama olmayan (P) A.Ş. (hesap dönemi takvim yılı), Kasım
    2026'da iki iktisadi kıymet aktifleştirmiştir. 3 Kasım 2026'da aktife alınan 600.000 TL'lik üretim makinesi için azalan
    bakiyeler usulünü seçmiştir. 12 Kasım 2026'da aktife alınan 1.200.000 TL'lik binek otomobil için normal amortisman usulünü
    uygulamaktadır. Her iki kıymetin ilan edilen faydalı ömrü 5 yıldır. Şirket VUK md. 320/3'teki gün esasını seçmemiştir.
    KDV, ÖTV ve binek otomobillere ilişkin gelir/kurumlar vergisi gider kısıtlamaları dikkate alınmayacaktır. Buna göre şirketin
    2026 yılında bu iki kıymet için ayırabileceği toplam azami amortisman kaç TL'dir?
  secenekler:
    A: '80.000'
    B: '160.000'
    C: '260.000'
    D: '280.000'
    E: '480.000'
  dogru: D
  aciklama:
    dogru_neden: 'Makine: azalan bakiyeler oranı, %50''yi geçmemek üzere normal oranın (1/5 = %20) iki katı olan %40''tır.
      VUK md. 320/1''e göre amortisman süresi aktife girilen yıldan başlar ve yıl esasında kıst uygulanmaz: 600.000 × %40
      = 240.000 TL. Binek otomobil: md. 320/2''ye göre aktife girdiği dönem için ay kesri tam ay sayılarak kalan ay süresi
      kadar amortisman ayrılır; Kasım ve Aralık = 2 ay: 1.200.000 × %20 × 2/12 = 40.000 TL. Toplam 280.000 TL. Püf noktaları:
      kıst amortisman yalnız binek otomobile özgüdür, Kasım''da alınan makineye tam yıl amortisman ayrılır; Kasım''ın kesirli
      olması o ayı dışarıda bırakmaz, tam ay sayılır; azalan bakiyelerde oran normal oranın iki katıdır.'
    celdiriciler:
      A: Makineye de binek otomobil gibi 2 aylık kıst amortisman uygulanmış (40.000 + 40.000); kıst kuralı yalnız binek otomobillere
        özgüdür.
      B: 'Makineye azalan bakiyeler oranı (%40) yerine normal oran (%20) uygulanmış: 120.000 + 40.000.'
      C: 'Binek otomobilde Kasım ayı kesirli olduğu için dışarıda bırakılmış (1 ay: 20.000); ay kesri tam ay sayılır.'
      E: Binek otomobile tam yıl amortisman (240.000) ayrılmış; md. 320/2 kıst amortismanı zorunlu kılar.
    hesap_adimlari:
    - 'Makine (azalan bakiyeler): oran = 2 × %20 = %40; 600.000 × 0,40 = 240.000'
    - 'Binek otomobil: 1.200.000 × %20 = 240.000 yıllık; 2026 için 240.000 × 2/12 = 40.000'
    - Toplam = 240.000 + 40.000 = 280.000 TL
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: Mükerrer md. 315/2
    alinti: Bu usulde uygulanacak amortisman oranı % 50'yi geçmemek üzere normal amortisman oranının iki katıdır.
