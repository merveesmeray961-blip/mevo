- id: YMM-VTK-DEG-0008
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: VUK md.258-298 değerleme ölçüleri
  tip: kavrama
  zorluk: 2
  kok: Banka, banker veya sigorta şirketi olmayan ve bilanço esasına göre defter tutan bir işletmenin 31.12.2026 değerleme
    gününde vadesi 2027 yılında gelecek alacak ve borç senetleri bulunmaktadır. VUK'un alacak ve borçların değerlemesine ilişkin
    hükümleri bakımından aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Mevduat veya kredi sözleşmelerine dayanan alacaklar, değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate
      alınır.
    B: Vadesi gelmemiş senede bağlı alacaklar, değerleme gününün kıymetine irca olunabilir.
    C: Senette faiz nispeti açıklanmamışsa reeskontta Merkez Bankasının resmî iskonto haddi uygulanır.
    D: Alacak senetlerini reeskonta tabi tutan işletme, borç senetlerini reeskonta tabi tutup tutmamakta serbesttir.
    E: Senette faiz nispeti açıklanmışsa alacak senedinin reeskontunda bu nispet esas alınır.
  dogru: D
  aciklama:
    dogru_neden: VUK md. 285'in son fıkrasına göre alacak senetlerini değerleme gününün kıymetine irca eden mükellefler, borç
      senetlerini de aynı şekilde işleme tabi tutmak zorundadır. Alacak senedi reeskontu ihtiyari olsa da bu tercih yapıldığında
      borç senedi reeskontu zorunlu hâle gelir; D ifadesi bu nedenle yanlıştır.
    celdiriciler:
      A: Md. 281/1'in ikinci cümlesiyle aynıdır; doğrudur.
      B: Md. 281/2 alacak senetlerinin reeskontunu 'irca olunabilir' diyerek ihtiyari kılar; doğrudur.
      C: Md. 281/2'ye göre faiz nispeti açıklanmamışsa TCMB resmî iskonto haddi uygulanır; doğrudur.
      E: Md. 281/2'ye göre senette faiz nispeti açıklanmışsa bu nispet uygulanır; doğrudur.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 281/2
    alinti: Vadesi gelmemiş olan senede bağlı alacaklar değerleme gününün kıymetine irca olunabilir. Bu takdirde, senette
      faiz nispeti açıklanmış ise bu nispet, açıklanmamışsa Cumhuriyet Merkez Bankasının resmi iskonto haddi uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
