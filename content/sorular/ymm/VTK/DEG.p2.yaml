    700.000 TL olan bir makinesini Mart 2026'da 800.000 TL'ye (KDV hariç) satmıştır. Yönetim kurulu satılan makinenin yenilenmesine
    karar vermiş ve teşebbüse geçmiş, satış kârını VUK md. 328 uyarınca pasifte geçici bir hesaba almıştır. Şirket Ocak 2027'de
    satılan makinenin yerine 400.000 TL'lik yeni bir makine almış ve bu makineye 5 yıllık faydalı ömür üzerinden normal amortisman
    uygulamaktadır. Başka bir yenileme yapılmamıştır. Buna göre yeni makine için 2027 yılında ayrılan amortismanın 2027 kazancını
    azaltan net tutarı ile pasifteki geçici hesapta kalacak fazlalığın kâra eklenmesi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Net amortisman gideri 80.000 TL'dir; geçici hesaptaki 500.000 TL'nin tamamı 2029 yılında kâra eklenir.
    B: Net amortisman gideri sıfırdır; 100.000 TL'lik fazlalık 2027 yılında kâra eklenir.
    C: Net amortisman gideri 80.000 TL'dir; 100.000 TL'lik fazlalık 2029 yılında kâra eklenir.
    D: Net amortisman gideri sıfırdır; 100.000 TL'lik fazlalık 2030 yılında kâra eklenir.
    E: Net amortisman gideri sıfırdır; 100.000 TL'lik fazlalık 2029 yılında kâra eklenir.
  dogru: E
  aciklama:
    dogru_neden: 'Satış kârı = 800.000 − (1.000.000 − 700.000) = 500.000 TL, pasifte geçici hesaba alınmıştır. VUK md. 328/4-b''ye
      göre bu tutar yeni kıymetin amortismanlarına mahsup edilir; 2027 amortismanı 400.000 × %20 = 80.000 TL geçici hesaptan
      karşılandığından kazancı azaltan net etkisi sıfırdır. Yeni kıymetin amortisman ayrılabilecek tutarı 400.000 TL olduğundan
      500.000 − 400.000 = 100.000 TL fazlalık doğar; md. 328/4-c''ye göre bu fazlalık satışın yapıldığı yılı (2026) takip
      eden üçüncü takvim yılının, yani 2029''un kâr ve zarar hesabına eklenir. Püf noktaları: üç yıllık süre yeni kıymetin
      alındığı yıldan değil satış yılından sayılır; fazlalığın 2027''de belli olması kâra ekleme zamanını öne çekmez.'
    celdiriciler:
      A: Amortisman geçici hesaptan mahsup edildiğinden net gider oluşmaz; kâra eklenecek tutar da 500.000 TL değil yalnız
        fazlalık olan 100.000 TL'dir.
      B: Fazlalık, fazlalığın belli olduğu yılda değil satış yılını takip eden üçüncü takvim yılında (2029) kâra eklenir.
      C: Yeni kıymetin amortismanı geçici hesaba mahsup edildiğinden 80.000 TL'lik net gider oluşmaz.
      D: Üç yıl, yeni makinenin alındığı 2027'den değil satışın yapıldığı 2026'dan itibaren sayılır; doğru yıl 2029'dur.
    hesap_adimlari:
    - Satış kârı = 800.000 − 300.000 = 500.000 (geçici hesap)
    - 2027 amortismanı = 400.000 × %20 = 80.000 → geçici hesaptan mahsup, net gider 0
    - Fazlalık = 500.000 − 400.000 = 100.000 → 2026 + 3 = 2029 yılında kâra eklenir
