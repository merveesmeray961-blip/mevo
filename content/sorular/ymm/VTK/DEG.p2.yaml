- id: YMM-VTK-DEG-0009
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: maliyet bedeli ve borsa rayici
  tip: kavrama
  zorluk: 2
  kok: 'Bir kurumun 31.12.2026 tarihli envanterinde yer alan menkul kıymetlerin VUK md. 279''a göre değerlenmesine ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Borsa İstanbul''da işlem gören hisse senetleri, değerleme günündeki borsa rayici ile değerlenir.

    II. Fon portföyünün en az %51''i Türkiye''de kurulmuş şirketlerin hisse senetlerinden oluşan yatırım fonu katılma belgeleri
    alış bedeliyle değerlenir.

    III. Borsa rayici bulunmayan ve faiz getirisi önceden belli olan bir özel sektör tahvili, alış bedeline vadesinde elde
    edilecek gelirin iktisap tarihinden değerleme gününe kadar geçen süreye isabet eden kısmı eklenerek değerlenir.

    IV. Borsa rayici bulunmayan, getirisi ihraç edenin kâr ve zararına bağlı olarak doğan ve değerleme günü itibarıyla hesaplanamayan
    menkul kıymetler, alış bedeline tahmini getiri eklenerek değerlenir.'
  secenekler:
    A: II ve III
    B: I ve II
    C: I, II ve III
    D: II, III ve IV
    E: III ve IV
  dogru: A
  aciklama:
    dogru_neden: VUK md. 279'a göre hisse senetleri (borsada işlem görsün görmesin) ile portföyünün en az %51'i Türkiye'de
      kurulmuş şirketlerin hisse senetlerinden oluşan yatırım fonu katılma belgeleri alış bedeliyle değerlenir (II doğru,
      I yanlış). Diğer menkul kıymetler borsa rayici ile; borsa rayici yoksa alış bedeline vadede elde edilecek gelirin değerleme
      gününe kadar geçen süreye isabet eden kısmı eklenerek değerlenir (III doğru). Getirisi ihraç edenin kâr ve zararına
      bağlı olup hesaplanamayan menkul kıymetler ise yalnız alış bedeliyle değerlenir; tahmini getiri eklenmez (IV yanlış).
    celdiriciler:
      B: 'I yanlıştır: hisse senetleri borsada işlem görse de borsa rayici ile değil alış bedeliyle değerlenir.'
      C: I'in yanlışlığı nedeniyle bu birleşim doğru olamaz.
      D: 'IV yanlıştır: getirisi kâra bağlı ve hesaplanamayan menkul kıymetlerde değer alış bedelidir, getiri eklenmez.'
      E: IV yanlıştır; ayrıca doğru olan II bu birleşimde yer almamaktadır.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 279
    alinti: Hisse senetleri ile fon portföyünün en az % 51'i Türkiye'de kurulmuş bulunan şirketlerin hisse senetlerinden oluşan
      yatırım fonu katılma belgeleri alış bedeliyle, bunlar dışında kalan her türlü menkul kıymet borsa rayici ile değerlenir.
      … Ancak, borsa rayici bulunmayan, getirisi ihraç edenin kar ve zararına bağlı olarak doğan ve değerleme günü itibariyle
      hesaplanması mümkün olmayan menkul kıymetler, alış bedeli ile değerlenir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 279
    alinti: Borsa rayici yoksa veya borsa rayicinin muvazaalı bir şekilde oluştuğu anlaşılırsa değerlemeye esas bedel, menkul
      kıymetin alış bedeline vadesinde elde edilecek gelirin (kur farkları dahil) iktisap tarihinden değerleme gününe kadar
