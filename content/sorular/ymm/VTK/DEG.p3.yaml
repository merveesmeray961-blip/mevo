- id: YMM-VTK-DEG-0013
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme
  konu: DEG
  kazanim: VUK md.258-298 değerleme ölçüleri
  tip: kavrama
  zorluk: 3
  kok: 'Bilanço esasına göre defter tutan tam mükellef (A) A.Ş., 31.12.2026 değerleme gününde aktifinde aşağıdaki kıymetleri
    bulundurmaktadır:

    I. Borsada işlem gören hisse senedi

    II. Vadesi 2027''de gelen senede bağlı alacak (banka, banker veya sigorta şirketi olmayan mükellef)

    III. İktisap bedeliyle kayıtlı gayrimenkul

    IV. Yabancı para cinsinden nakit


    Bu kıymetlerin VUK''a göre uygulanacak değerleme ölçüleri hangi seçenekte doğru eşleştirilmiştir?

    '
  secenekler:
    A: I-borsa rayici, II-itibari değer, III-maliyet bedeli, IV-borsa rayici
    B: I-borsa rayici, II-mukayyet değer, III-maliyet bedeli, IV-borsa rayici
    C: I-alış bedeli, II-mukayyet değer, III-vergi değeri, IV-borsa rayici
    D: I-borsa rayici, II-itibari değer, III-vergi değeri, IV-mukayyet değer
    E: I-alış bedeli, II-itibari değer, III-maliyet bedeli, IV-mukayyet değer
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 279: hisse senetleri borsa rayiciyle değerlenir. VUK md. 281/1: senede bağlı alacaklar mukayyet
      değerle (banka/banker/sigorta değilse reeskont uygulanmaz, ancak isterse 280/2 uyarınca reeskont uygulayabilir; ancak
      temel ölçü mukayyet değerdir). VUK md. 269: gayrimenkuller maliyet bedeli ile değerlenir. VUK md. 280/1: yabancı para
      kasası borsa rayiciyle değerlenir. Püf noktaları: Senede bağlı alacakta banka değilse reeskont zorunlu değil, mukayyet
      değer esas; nakit döviz borsa rayici ile değerlenir.'
    celdiriciler:
      A: Senede bağlı alacak mukayyet değerle değerlenir; itibari değer menkul kıymete uygulanır.
      C: Hisse senedi maliyet değil borsa rayiciyle; gayrimenkul vergi değeri değil maliyet bedeli ile değerlenir.
      D: Yabancı para mukayyet değer değil borsa rayiciyle değerlenir.
      E: Hisse senedi alış bedeli değil borsa rayiciyle; yabancı para borsa rayiciyle değerlenir.
  kaynaklar:
