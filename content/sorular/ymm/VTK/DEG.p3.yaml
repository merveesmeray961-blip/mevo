      mevcut olduğu sürece tercih hakkı yoktur; ancak borsa rayici yoksa alış bedeli devreye girer.'
    celdiriciler:
      A: VUK md. 279 gereği borsa rayici yoksa alış bedeli esas alınır; doğru ifadedir.
      C: Borsa rayici değerleme gününe ait borsa cetveliyle tespit edilir; doğru ifadedir.
      D: Değerleme günü işlem yapılmamışsa son işlem gününün değeri esas alınır; doğrudur.
      E: Yabancı borsada kote menkul kıymetler de varsa borsa rayiciyle değerlenir; doğrudur.
