    madde: md. 269
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 279
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 281/1
    alinti: Alacaklar mukayyet değerleriyle değerlenir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
