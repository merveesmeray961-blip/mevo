  kok: 'VUK geçici md. 37 kapsamındaki yeniden değerleme uygulamasına ilişkin aşağıdaki ifadeleri inceleyin:


    I. Yeniden değerleme, sadece amortismana tabi iktisadi kıymetlere uygulanır.

    II. Yeniden değerleme artış fonu, ortaklara dağıtıldığında kurumlar vergisine tabidir.

    III. Değerleme oranı, Hazine ve Maliye Bakanlığınca ilan edilen yeniden değerleme oranıdır.

    IV. Yeniden değerleme, her hesap döneminde ihtiyari olarak uygulanabilir.


    Bu ifadelerden hangileri VUK mükerrer md. 298/ç hükümleri bakımından doğrudur?

    '
  secenekler:
    A: Yalnız I
    B: I ve III
    C: I, II ve III
    D: II ve IV
    E: I, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'VUK mükerrer md. 298/ç: Yeniden değerleme amortismana tabi iktisadi kıymetlere uygulanır (I-doğru). Değerleme
      oranı Bakanlıkça ilan edilen yeniden değerleme oranıdır (III-doğru). Artış fonu, ortaklara dağıtılması halinde kurumlar
      vergisine tabi tutulur (II-doğru). Ancak madde her yıl zorunlu olarak uygulanmak üzere düzenlenmiş; şartları taşıyanlar
      için uygulamak zorundadır, ihtiyari değildir (IV-yanlış). Püf noktaları: mükerrer 298/ç zorunluluk içerir; fonun dağıtımı
      vergilendirilir.'
    celdiriciler:
      A: Yalnız I doğru değil; II ve III de doğrudur.
      B: II (fon dağıtımında vergilendirme) da doğrudur.
      D: II doğrudur; ancak IV (ihtiyarilik) yanlıştır.
      E: IV (ihtiyarilik) yanlıştır; uygulamak zorunludur.
