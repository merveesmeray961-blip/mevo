    madde: md. 320/2
    alinti: Faaliyetleri kısmen veya tamamen binek otomobillerinin kiralanması veya çeşitli şekillerde işletilmesi olanların
      bu amaçla kullandıkları binek otomobilleri hariç olmak üzere, işletmelere ait binek otomobillerinin aktife girdiği hesap
