  konu: DEG
  kazanim: amortisman süresi ve binek otomobil amortismanı
  tip: hesaplama
  zorluk: 3
  kok: Faaliyet konusu araç kiralama olmayan ve gün esasına göre amortisman uygulamasını seçmemiş (F) A.Ş., maliyeti 900.000
    TL olan bir binek otomobili 10.08.2026 tarihinde aktife almıştır. Otomobilin normal amortisman oranı %20'dir; otomobil
    alımında ödenen ÖTV ve indirilemeyen KDV zaten maliyete dahil edilmiştir. Buna göre (F) A.Ş.'nin otomobil için 2026 yılında
    ayıracağı amortisman tutarı kaç TL'dir?
  secenekler:
    A: '60.000'
    B: '75.000'
    C: '90.000'
    D: '150.000'
    E: '180.000'
  dogru: B
  aciklama:
    dogru_neden: 'VUK md. 320/2''ye göre binek otomobillerde aktife girilen hesap döneminde ay kesri tam ay sayılarak kalan
      ay süresi kadar amortisman ayrılır. Ağustos-Aralık = 5 ay. Yıllık amortisman 900.000 × %20 = 180.000 TL; 180.000 × 5/12
      = 75.000 TL. Ayrılmayan süreye isabet eden bakiye itfa süresinin son yılında yok edilir. Püf noktaları: Ağustos ayı
      10''unda başlasa da tam ay sayılır; ÖTV-KDV verisi ek bir hesap gerektirmez.'
    celdiriciler:
      A: Ağustos ayı sayılmadan 4 ay (Eylül-Aralık) üzerinden hesaplanmıştır; ay kesri tam ay sayılır.
      C: 6 ay üzerinden hesaplanmıştır; Ağustos-Aralık 5 aydır.
      D: Yıllık tutarın 10 aya isabet eden kısmı alınmıştır; hesapta ay sayısı yanlıştır.
      E: Tam yıllık amortisman ayrılmıştır; aktife girilen yılda yalnız kalan ay süresi kadar ayrılır.
    hesap_adimlari:
    - Yıllık amortisman = 900.000 × 0,20 = 180.000
    - Ay sayısı = 5 (Ağustos-Aralık)
    - 180.000 × 5 / 12 = 75.000
  kaynaklar:
