- id: YMM-VTK-DEG-0059
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme ve enflasyon düzeltmesi
  konu: DEG
  kazanim: özel maliyet bedellerinin itfası
  tip: hesaplama
  zorluk: 3
  kok: (M) A.Ş., 01.01.2026-31.12.2030 süreli kira sözleşmesiyle tuttuğu iş yerinde 2026 yılı başında, kıymeti devamlı olarak
    artıran 1.000.000 TL'lik tadilat yapmış ve aynı yıl 90.000 TL normal bakım-onarım gideri ödemiştir. Şirket iş yerini kira
    süresi dolmadan 31.12.2028 tarihinde boşaltmıştır. Buna göre VUK md. 327 uyarınca özel maliyet bedeline ilişkin olarak
    2028 yılında bir defada gider yazılacak tutar kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '400.000'
    C: '600.000'
    D: '800.000'
    E: 1.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Kiracının yaptığı ve iktisadi kıymeti artıran giderler özel maliyet bedeli olarak kira süresine (5 yıl)
      göre eşit yüzdelerle itfa edilir: yıllık %20 = 200.000 TL. Kira süresi dolmadan boşaltılırsa henüz itfa edilmemiş giderler
      boşaltma yılında bir defada gider yazılır. 2026 ve 2027''de 400.000 TL itfa edilmiştir; 2028''de 1.000.000 − 400.000
      = 600.000 TL bir defada gider yazılır. Püf noktaları: Normal bakım-onarım gideri (90.000 TL) itfaya girmez; bu soruda
      gereksiz veridir. Boşaltma yılının normal itfa payı ayrıca eklenmez, 600.000 TL''nin içindedir.'
    celdiriciler:
      A: Yalnız bir yıllık itfa payı bulunmuştur; itfa edilmemiş bakiyenin tamamı boşaltma yılında gider yazılır.
      B: İki yıllık itfa edilen tutar (2026-2027) bulunmuştur; kalan tutar değildir.
      D: Yalnız 2026 itfası düşülmüş, 2027 itfası düşülmemiştir.
      E: Hiç itfa yapılmamış gibi tutarın tamamı gider yazılmıştır.
    hesap_adimlari:
    - Yıllık itfa = 1.000.000 / 5 = 200.000
    - 2026-2027 itfası = 400.000
    - 2028 gideri = 1.000.000 − 400.000 = 600.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 327
    alinti: Kira veya işletme hakkı süresi dolmadan, kiralanan veya işletme hakkı alınan şeyin boşaltılması veya işletme hakkının
      herhangi bir sebepten sona ermesi halinde henüz itfa edilmemiş olan giderler, boşaltma veya hakkın sona erdiği yılda
      bir defada gider yazılır.
  gecerlilik:
    baslangic: '2005-07-03'
    bitis: null
  dogrulama:
    python: sonuc = 1000000 - 2 * (1000000 / 5)
  durum: taslak
