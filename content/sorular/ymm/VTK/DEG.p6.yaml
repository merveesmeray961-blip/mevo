- id: YMM-VTK-DEG-0057
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme ve enflasyon düzeltmesi
  konu: DEG
  kazanim: maliyet bedeline dahil edilecek giderler
  tip: hesaplama
  zorluk: 3
  kok: Bilanço esasına göre defter tutan (K) A.Ş., 2026 yılında üzerinde eski bir bina bulunan arsayı 8.000.000 TL'ye satın
    almış; binanın yıkımı için 240.000 TL, arsanın tesviyesi için 60.000 TL, tapu harcı ve noter giderleri için 160.000 TL
    ödemiştir. Arsayla doğrudan ilgili olarak aynı yıl 350.000 TL hibe alınmış ve arsa 2026 yılında envantere alınmıştır.
    Buna göre VUK md. 262 uyarınca arsanın maliyet bedeli kaç TL'dir?
  secenekler:
    A: 7.650.000
    B: 7.870.000
    C: 8.110.000
    D: 8.460.000
    E: 8.810.000
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 262''ye göre iktisadi kıymetin iktisabıyla doğrudan ilgili tapu ve noter giderleri ile gayrimenkullerde
      mevcut bir binanın satın alınarak yıkılmasından ve arsanın tesviyesinden doğan giderler maliyet bedeline dahildir; gayrimenkulle
      doğrudan ilgili olup envantere alındığı hesap dönemi sonuna kadar alınan hibe ise maliyet bedelinden indirilir. 8.000.000
      + 240.000 + 60.000 + 160.000 − 350.000 = 8.110.000 TL. Püf noktaları: Hibe ''gelir'' değil maliyet düzeltmesidir; hibeyi
      çıkarmayı ve yıkım-tesviye giderlerini eklemeyi birlikte kontrol edin.'
    celdiriciler:
      A: Yalnız arsa bedelinden hibe düşülmüş, yıkım, tesviye, tapu ve noter giderleri maliyete katılmamıştır.
      B: Hibe düşülmüş, tapu-noter ve tesviye eklenmiş; ancak mevcut binanın yıkım gideri maliyete eklenmemiştir.
      D: Hibe maliyetten indirilmemiştir; hibe indirimi md. 262'de açıkça öngörülmüştür.
      E: Hibe maliyetten indirilmek yerine maliyete eklenmiştir.
    hesap_adimlari:
    - 8.000.000 + 240.000 + 60.000 + 160.000 = 8.460.000
    - 8.460.000 − 350.000 = 8.110.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 262 (d bendi)
    alinti: d) Gayrimenkullerde mevcut bir binanın satın alınarak yıkılmasından ve arsasının tesviyesinden mütevellit giderler.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 262 (hibe)
    alinti: Gayrimenkullerle doğrudan ilgili olması şartıyla, bunların envantere alındığı hesap dönemi sonuna kadar alınan
      hibeler maliyet bedelinden indirilir.
  gecerlilik:
    baslangic: '2021-10-14'
    bitis: null
  dogrulama:
    python: sonuc = 8000000 + 240000 + 60000 + 160000 - 350000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: harici üretici (claude, paket 2026-11-05)'
    istem_surumu: uretici paketi YMM paketi 2026-11-05
    kapilar:
