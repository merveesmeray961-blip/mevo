- id: YMM-VTK-DEG-0069
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Değerleme ve enflasyon düzeltmesi
  konu: DEG
  kazanim: düzeltme katsayısı ve enflasyon farkı
  tip: hesaplama
  zorluk: 3
  kok: Enflasyon düzeltmesine tabi tutulduğu varsayılan bir dönemde, (E) A.Ş. maddi duran varlık niteliğindeki bir makineyi
    defterlerine kayıt tarihinde (ÜFE endeksi 2.000) 600.000 TL maliyet bedeliyle kaydetmiştir; mali tabloların ait olduğu
    aya ilişkin ÜFE endeksi 3.000'dir. Reel olmayan finansman maliyeti bulunmamaktadır. VUK mükerrer md. 298/A'ya göre makine
    için enflasyon fark hesabına kaydedilecek (düzeltme sonrası değer ile düzeltme öncesi değer arasındaki) fark kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '240.000'
    C: '300.000'
    D: '600.000'
    E: '900.000'
  dogru: C
  aciklama:
    dogru_neden: 'Düzeltme katsayısı = mali tabloların ait olduğu aya ilişkin endeks / düzeltmeye esas alınan tarihi içeren
      aya ait endeks = 3.000 / 2.000 = 1,5. Maddi duran varlıklarda düzeltmeye esas tarih defterlere kayıt tarihidir. Düzeltilmiş
      değer = 600.000 x 1,5 = 900.000 TL; enflasyon farkı = 900.000 - 600.000 = 300.000 TL. Püf noktaları: katsayı dönem sonu
      endeksinin kayıt tarihi endeksine oranıdır (ters değil) ve soruda istenen fark, düzeltilmiş değerin kendisi değildir.'
    celdiriciler:
      A: 200.000 TL, katsayının yanlış (1,33) hesaplanmasından çıkar; doğru katsayı 3.000/2.000 = 1,5'tir.
      B: 240.000 TL, katsayının 1,4 alınmasından çıkar; doğru katsayı 1,5'tir.
      D: 600.000 TL maliyet bedelinin kendisidir; fark değil.
      E: 900.000 TL düzeltilmiş değerdir; istenen fark değildir.
    hesap_adimlari:
    - Katsayı = 3.000 / 2.000 = 1,5
    - Düzeltilmiş değer = 600.000 x 1,5 = 900.000
    - Fark = 900.000 - 600.000 = 300.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. md. 298/A-2
    alinti: Düzeltme katsayısı; malî tabloların ait olduğu aya ilişkin fiyat endeksinin, düzeltmeye esas alınan tarihi içeren
      aya ait fiyat endeksine bölünmesiyle elde edilen katsayıyı,
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. md. 298/A-3
    alinti: maddî duran varlıklar ve bu varlıkları oluşturan unsurlar,
  gecerlilik:
    baslangic: '2003-12-30'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'katsayi = 3000/2000

      duzeltilmis = 600000*katsayi

      sonuc = duzeltilmis - 600000'
