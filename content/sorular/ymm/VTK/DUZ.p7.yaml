        en büyük mülkiye amiri yapar.
      B: Seçilecek üye sayısı bir asil ve bir yedek değil, iki asil ve iki yedektir; seçimi defterdar yapmaz.
      C: Zamanında seçilmezse komisyon üyesiz toplanmaz; üyeler mahallin en büyük mülkiye amiri tarafından seçilir.
      E: Kanundaki süre iki ay değil bir aydır; seçilecekler iki asil ve iki yedektir ve seçimi belediye başkanı yapmaz.
