- id: YMM-VTK-DUZ-0025
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: İnceleme takdir ve düzeltme
  konu: DUZ
  kazanim: eksik bilgili beyanname ve davet
  tip: hesaplama
  zorluk: 3
  kok: (M) A.Ş. 2025 hesap dönemi kurumlar vergisi beyannamesini kanuni süresi içinde vermiş, ancak beyannamede vergi matrahına
    ilişkin bilgileri göstermemiştir. Takdir komisyonu şirketi 20 gün mühlet vererek bilgileri vermeye ve kanuni defterlerini
    ibraz etmeye davet etmiş, şirket de bu davete uyarak defterlerini ibraz etmiştir. Defter ve vesikalar ihticaca salih bulunmuştur.
    Defter kayıtlarına göre tespit edilen matrah 2.200.000 TL, komisyonun defterlere bakmaksızın re'sen takdir edeceği matrah
    ise 3.000.000 TL'dir. Kurumlar vergisi oranı %25 alınacaktır. Buna göre VUK md. 30 uyarınca (M) A.Ş. adına tarh edilebilecek
    en yüksek kurumlar vergisi kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '440.000'
    C: '550.000'
    D: '750.000'
    E: 1.300.000
  dogru: C
  aciklama:
    dogru_neden: 'Beyannamede matrah bilgilerinin gösterilmemesi md. 30/2 (2. bent) kapsamında re''sen takdir sebebidir. Mükellef
      15 günden az olmamak üzere verilen mühlet içinde bilgileri verip defterlerini ibraz ederse ve defterler ihticaca salihse,
      takdir olunacak matrah defter kayıtlarına göre tespit olunacak miktardan fazla olamaz. Matrah = 2.200.000 TL; vergi
      = 2.200.000 x %25 = 550.000 TL. Püf noktaları: komisyonun 3.000.000 TL''lik takdiri defterlere uyulduğunda bağlayıcı
      olmaz ve fark üzerinden değil, tüm matrah üzerinden vergi hesaplanır.'
    celdiriciler:
      A: Yalnızca matrah farkı (800.000 TL) üzerinden vergi hesaplanmıştır; tarh matrahın tamamı üzerinden yapılır.
      B: '%25 yerine %20 oran uygulanmıştır (2.200.000 x %20); kurumlar vergisi oranı %25''tir.'
      D: Komisyonun takdir ettiği 3.000.000 TL matrah esas alınmıştır; oysa takdir edilen matrah defter kayıtlarına göre bulunan
        miktarı aşamaz.
      E: İki matrah toplanmıştır (5.200.000 x %25); bu şekilde bir toplama yapılmaz.
    hesap_adimlari:
    - Takdir edilebilecek en yüksek matrah = defter matrahı = 2.200.000
    - Kurumlar vergisi = 2.200.000 x %25 = 550.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 30/2-(2)
    alinti: 2. Vergi beyannamesi kanuni veya ek süreler içinde verilmekle beraber beyannamede vergi matrahına ilişkin bilgiler
      gösterilmemiş bulunursa,
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 30
    alinti: Bu davet üzerine mükellef istenilen bilgileri verir ve kanuni defterlerini ibraz ederse, defter ve vesikalar ihticaca
      salih bulunmak şartiyle, mükellefe takdir olunacak matrah defter ve vesikaları kayıtlarına göre tesbit olunacak miktardan
      fazla olamaz.
  gecerlilik:
    baslangic: '1994-06-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'matrah = min(3000000, 2200000)

      sonuc = matrah*0.25'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) kabul: Doğru (2.200.000x%25=550.000). Not: UGN bölümündeki ''(M) A.Ş. re''sen 2.400.000
          / beyan 1.750.000'' özeti kesik; örtüşme doğrulanamadı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-11-11'
    kim: uretici
    ne: harici teslim ymm_test.yaml, satır YMM_VTK/VTK_DUZ_20261111_1.yaml#3
