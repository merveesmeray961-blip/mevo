    dogru_neden: Md. 72/1'e göre takdir komisyonu illerde defterdarın (ilçelerde malmüdürünün veya müstakil vergi dairesi
      olan ilçelerde vergi dairesi müdürünün) ya da bunların tevkil edecekleri memurların başkanlığı altında, ilgili vergi
      dairesinin yetkili iki memuru ile seçilmiş iki üyeden kurulur.
