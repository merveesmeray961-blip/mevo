        seçilmiş iki üyedir.
      C: Valinin başkanlığı arazi asgari birim değer tespitini yapan komisyona (md. 72/3) aittir; matrah takdir komisyonuna
        ait değildir.
      D: Komisyonun üyeleri vergi dairesinin iki yetkili memuru ile seçilmiş iki üyedir; üç memur ve noterler birliği üyesi
        öngörülmemiştir.
      E: İlçelerde başkan malmüdürü olabilir ancak üyeler vergi dairesinin iki memuru ile seçilmiş iki üyedir; müfettiş ve
        bilirkişi komisyon üyesi değildir.
