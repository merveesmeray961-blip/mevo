    C: En geç bir ay içinde iki asil ve iki yedek üye seçmek zorundadırlar; yapılmazsa komisyon üyesiz olarak toplanır ve
      karar verir.
    D: En geç bir ay içinde iki asil ve iki yedek üye seçmek zorundadırlar; yapılmazsa üyeleri mahallin en büyük mülkiye amiri
