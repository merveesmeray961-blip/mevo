      B: İhbarname bir taraftan bilinen adrese posta ile yollanır, diğer taraftan vergi dairesinin ilan yerine asılır.
      C: Süre, bilinen adrese tebligat yapılan hâllerde tebliğ tarihinden, aksi hâlde tutanakla tespit olunan ilan tarihinden
        başlar.
      D: İdarece tarhta vergi, kanunen belli matrahlar üzerinden tarh edilir; mükellefin beyanı esas alınmaz.
