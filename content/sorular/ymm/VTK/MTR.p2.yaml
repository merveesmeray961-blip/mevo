- id: YMM-VTK-MTR-0008
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: geçici vergi
  tip: hesaplama
  zorluk: 2
  kok: 'Hesap dönemi takvim yılı olan (G) AŞ''nin 2026 yılına ilişkin bilgileri şöyledir:


    - Yıllık beyanname üzerinden hesaplanan kurumlar vergisi: 700.000 TL

    - Beyannamedeki kazanca dahil gelirlerden KVK md. 15/1 uyarınca kaynakta kesilen ve geçici vergiden mahsup edilmemiş vergi:
    30.000 TL

    - Tahakkuk eden geçici vergiler: 1. dönem 180.000 TL, 2. dönem 220.000 TL, 3. dönem 200.000 TL, 4. dönem 150.000 TL

    - 1., 2. ve 3. dönem geçici vergileri vadesinde ödenmiş; 4. dönem geçici vergisi yıllık beyannamenin verildiği tarihe
    kadar ödenmemiştir.


    Buna göre (G) AŞ''nin 2026 yılı kurumlar vergisi beyannamesi üzerinden ödenecek kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '0'
    B: '70.000'
    C: '100.000'
    D: '220.000'
    E: '250.000'
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 34/4''e göre ilgili hesap dönemine ilişkin tahakkuk ettirilen geçici verginin yalnız ödenen kısmı
      yıllık beyanname üzerinden hesaplanan kurumlar vergisinden mahsup edilir. Ödenen geçici vergi 180.000 + 220.000 + 200.000
      = 600.000 TL''dir. Kaynakta kesilen 30.000 TL de md. 34/1 uyarınca mahsup edilir. Ödenecek vergi: 700.000 - 30.000 -
      600.000 = 70.000 TL.'
    celdiriciler:
      A: Ödenmemiş 4. dönem geçici vergisi (150.000 TL) de mahsup edilirse mahsuplar (780.000 TL) vergiyi aşar ve ödenecek
        vergi çıkmaz gibi görünür; oysa yalnız ödenen geçici vergi mahsup edilir.
      C: Kaynakta kesilen 30.000 TL'lik vergi md. 34/1 uyarınca mahsup edilmeden bulunan tutardır.
      D: Ödenmemiş 4. dönem geçici vergisi yıllık beyanname üzerinden ödenecek kurumlar vergisine eklenmez.
      E: Hem kesinti mahsubu atlanmış hem de ödenmemiş geçici vergi ödenecek tutara eklenmiştir.
    hesap_adimlari:
    - Ödenen geçici vergi = 180.000 + 220.000 + 200.000 = 600.000
    - Ödenecek KV = 700.000 - 30.000 - 600.000 = 70.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 34/4
    alinti: (4) Geçici vergilendirme dönemi içinde elde edilen gelirler üzerinden kesinti yoluyla ödenmiş vergilerin bulunması
      halinde bu vergiler, o dönem için hesaplanan geçici vergi tutarından da mahsup edilebilir. İlgili hesap dönemine ilişkin
      tahakkuk ettirilen geçici verginin sadece ödenen kısmı yıllık kurumlar vergisi beyannamesi üzerinden hesaplanan kurumlar
      vergisinden mahsup edilir.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
