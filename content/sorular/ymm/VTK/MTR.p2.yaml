  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: asgari kurumlar vergisi
  tip: uygulama
  zorluk: 2
  kok: 'Aşağıda, hesap dönemi takvim yılı olan ve kurumlar vergisinden muaf olmayan bazı kurumlara ilişkin bilgiler verilmiştir:


    I. 2024 yılında ilk kez kurulup faaliyete başlayan (C) Ltd. Şti.

    II. 2025 yılında iki anonim şirketin birleşerek yeni bir şirket kurması yoluyla oluşan (D) AŞ

    III. Kazancı GVK md. 113 uyarınca hasılat esasına göre tespit edilen (E) Ltd. Şti.

    IV. 2022 yılında ilk kez kurulup faaliyete başlayan (F) AŞ


    5520 sayılı Kanun''un 32/C maddesi ve Seri No: 23 Kurumlar Vergisi Genel Tebliği''ne göre, 2026 hesap dönemi için yurt
    içi asgari kurumlar vergisi hükümleri yukarıdaki kurumlardan hangilerine uygulanır?'
  secenekler:
    A: II ve IV
    B: I ve II
    C: I ve III
    D: II, III ve IV
    E: I, II ve IV
  dogru: A
  aciklama:
    dogru_neden: KVK md. 32/C-5'e göre ilk defa faaliyete başlayan kurumlara faaliyete başlanılan dönem dahil üç hesap dönemi
      asgari vergi uygulanmaz. (C) 2024'te kurulduğundan 2024, 2025 ve 2026'da kapsam dışıdır (I uygulanmaz). Birleşme yoluyla
      kurulan şirketler ilk defa faaliyete başlayan şirket sayılmaz; (D) 2026'da asgari vergiye tabidir (II). Hasılat esasına
      göre vergilendirilen kurumlara asgari vergi uygulanmaz (III uygulanmaz). (F)'nin üç dönemlik süresi 2024'te dolduğundan
      2026'da asgari vergiye tabidir (IV).
    celdiriciler:
      B: (C)'nin üç hesap dönemlik süresi 2024, 2025 ve 2026'yı kapsar; ayrıca (F)'nin süresi dolmuştur ve (F) kapsamdadır.
      C: (C) üç dönemlik muafiyet süresinde, (E) ise hasılat esaslı kazanç tespiti nedeniyle kapsam dışındadır.
      D: Hasılat esasına göre vergilendirilen (E)'ye asgari kurumlar vergisi uygulanmaz.
      E: 2024'te kurulan (C) için üç hesap dönemi 2026'yı da kapsadığından 2026'da asgari vergi uygulanmaz.
    hesap_adimlari: []
