  kazanim: asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 3
  kok: '2012''den beri faaliyette olan, hesap dönemi takvim yılı olan ve finans sektöründe bulunmayan (K) AŞ''nin 2026 yılına
    ilişkin bilgileri şöyledir:


    - Ticari bilanço kârı (kurumlar vergisi karşılığı öncesi): 6.000.000 TL

    - Kanunen kabul edilmeyen giderler: 500.000 TL

    - Ticari bilanço kârına dahil, tam mükellef bir kurumdan alınan kâr payı (KVK md. 5/1-a kapsamında): 1.000.000 TL

    - Ticari bilanço kârına dahil, KVK md. 5/1-b şartlarını taşıyan yurt dışı iştirak kazancı: 2.500.000 TL

    - KVK md. 10/1-(ı) uyarınca hesaplanan nakdi sermaye artışı indirimi: 1.000.000 TL


    Şirketin geçmiş yıl zararı ve başka bir indirim veya istisnası yoktur; indirimli oran uygulamasından yararlanmamaktadır.
    Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Buna göre (K) AŞ''nin 2026 yılı için hesaplanan
    kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '300.000'
    B: '450.000'
    C: '500.000'
    D: '550.000'
    E: '650.000'
  dogru: D
  aciklama:
    dogru_neden: 'Normal hesap: Kurum kazancı 6.000.000 + 500.000 = 6.500.000 TL; matrah 6.500.000 - 1.000.000 - 2.500.000
      - 1.000.000 = 2.000.000 TL; vergi %25 ile 500.000 TL. Asgari hesap: KVK md. 32/C-6''ya göre indirim ve istisnalar öncesi
      kurum kazancı, ticari bilanço kârına kanunen kabul edilmeyen giderlerin eklenmesiyle bulunan 6.500.000 TL''dir. Md.
      32/C-2''ye göre bundan yalnız 5/1-a iştirak kazancı (1.000.000 TL) düşülür; yurt dışı iştirak kazancı (5/1-b) ve nakdi
      sermaye artışı indirimi (10/1-ı) asgari vergi matrahından düşülemez. Asgari vergi: 5.500.000 x %10 = 550.000 TL. Bu
      tutar 500.000 TL''den büyük olduğundan hesaplanan kurumlar vergisi 550.000 TL''dir. Püf noktaları: Asgari vergi matrahından
      düşülebilecek istisna ve indirimler kanunda tek tek sayılmıştır. Yurt içi iştirak kazancı listede yer alır, yurt dışı
      iştirak kazancı ve nakdi sermaye indirimi yer almaz; bu ikisini düşerseniz asgari vergiyi olduğundan düşük bulursunuz.'
    celdiriciler:
      A: 'Yurt dışı iştirak kazancı (5/1-b) da asgari vergi matrahından düşülmüştür: (6.500.000 - 3.500.000) x %10; 5/1-b
        md. 32/C-2''de sayılmaz.'
      B: 'Nakdi sermaye artışı indirimi asgari vergi matrahından düşülmüştür: (6.500.000 - 2.000.000) x %10; 10/1-(ı) md.
        32/C-2''de sayılmaz.'
      C: Normal hesaplanan vergidir; asgari kurumlar vergisi (550.000 TL) bundan yüksek olduğundan geçerli değildir.
      E: Asgari vergi matrahından 5/1-a iştirak kazancı da düşülmemiştir; bu istisna md. 32/C-2-a uyarınca düşülür.
    hesap_adimlari:
    - Kurum kazancı = 6.000.000 + 500.000 = 6.500.000
    - Normal matrah = 6.500.000 - 1.000.000 - 2.500.000 - 1.000.000 = 2.000.000; KV = 500.000
    - Asgari matrah = 6.500.000 - 1.000.000 = 5.500.000; asgari KV = 550.000
    - Hesaplanan KV = max(500.000; 550.000) = 550.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-1
    alinti: (1) 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden
      önceki kurum kazancının %10’undan az olamaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-2-a
    alinti: '(2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna
      ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları
      taşınmazlardan elde edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar,'
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-6
    alinti: (6) Bu maddede yer alan indirim ve istisnalar düşülmeden önceki kurum kazancı ibaresi, hesap dönemi sonundaki
      ticari bilanço kârına kanunen kabul edilmeyen giderlerin eklenmesiyle bulunan tutarı ifade eder.
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kk = 6000000 + 500000

      normal = (kk - 1000000 - 2500000 - 1000000) * 0.25

      asgari = (kk - 1000000) * 0.10

      sonuc = max(normal, asgari)'
