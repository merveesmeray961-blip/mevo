- id: YMM-VTK-MTR-0011
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: geçici vergi
  tip: uygulama
  zorluk: 3
  kok: 'Hesap dönemi takvim yılı olan (L) AŞ, 2026 yılının ikinci geçici vergi dönemi için 150.000 TL, üçüncü geçici vergi
    dönemi için 190.000 TL geçici vergi beyan edip ödemiştir. Şirket 2026 yılı kurumlar vergisi beyannamesini Nisan 2027''de
    kanuni süresinde vermiştir. Ekim 2027''de tamamlanan vergi incelemesinde, ikinci dönem için beyan edilmesi gereken geçici
    verginin 200.000 TL, üçüncü dönem için beyan edilmesi gereken geçici verginin de 200.000 TL olduğu tespit edilmiştir.


    GVK md. mükerrer 120 hükümlerine göre geçici vergi bakımından aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Her iki dönem için eksik beyan edilen toplam 60.000 TL geçici vergi tarh edilir ve kesinleşince vergi aslıyla tahsil
      edilir.
    B: Yalnız ikinci dönem için, %10'u aşan kısım olan 30.000 TL geçici vergi tarh edilir; üçüncü dönem için tarhiyat yapılmaz.
    C: Kurumlar vergisi beyannamesi verildiğinden geçici vergi tarhiyatı yapılamaz; eksiklik yalnız kurumlar vergisi tarhiyatıyla
      giderilir.
    D: Yalnız ikinci dönem için 50.000 TL geçici vergi tarh edilir; mahsup süresi geçmiş olsa da vergi aslı faiz ve cezasıyla
      tahsil edilir.
    E: Yalnız ikinci dönem için 50.000 TL geçici vergi tarh edilir; kesinleşen vergi terkin edilir, gecikme faizi ve ceza
      tahsil edilir.
  dogru: E
  aciklama:
    dogru_neden: 'Geçmiş dönemlere ait geçici verginin %10''u aşan tutarda eksik beyan edildiğinin tespiti hâlinde, eksik
      beyan edilen kısmın tamamı için re''sen veya ikmalen geçici vergi tarh edilir. İkinci dönemde eksiklik 50.000 TL''dir
      (200.000 TL''nin %25''i) ve %10''u aştığından 50.000 TL''nin tamamı tarh edilir. Üçüncü dönemde eksiklik 10.000 TL (%5)
      olup %10''u aşmadığından geçici vergi tarh edilmez. Mahsup süresi (2026 yılı kurumlar vergisi beyannamesinin verilmesi)
      geçtiğinden, kesinleşen geçici vergi terkin edilir; ancak gecikme faizi ve ceza tahsil edilir. Püf noktaları: %10 bir
      eşik sınavıdır, muafiyet tutarı değildir; eşik aşılınca eksik kısmın tamamı tarh edilir. Mahsup süresi geçtikten sonra
      geçici verginin aslı terkin edilir, ama faiz ve ceza yükü ortadan kalkmaz.'
    celdiriciler:
      A: Üçüncü dönemdeki %5'lik eksiklik %10 eşiğini aşmadığından tarhiyat yapılmaz; ayrıca mahsup süresi geçtiğinden vergi
        aslı terkin edilir.
      B: Eşik aşıldığında yalnız %10'u aşan kısım değil, eksik beyan edilen kısmın tamamı (50.000 TL) tarh edilir.
      C: Kanun, incelemeyle tespit edilen eksik geçici vergi için tarhiyatı açıkça öngörür; yıllık beyanname verilmiş olması
        buna engel değildir.
      D: Mahsup süresi geçtikten sonra kesinleşen geçici vergiler terkin edilir; tahsil edilen yalnız gecikme faizi ve cezadır.
    hesap_adimlari:
    - 2. dönem eksiklik = 200.000 - 150.000 = 50.000 (%25 > %10) → 50.000 tarh
    - 3. dönem eksiklik = 200.000 - 190.000 = 10.000 (%5 ≤ %10) → tarh yok
  kaynaklar:
