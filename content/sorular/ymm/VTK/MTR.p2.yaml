- id: YMM-VTK-MTR-0009
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: istisnalar ve indirimlerin sırası
  tip: kavrama
  zorluk: 2
  kok: '(H) AŞ''nin 2026 hesap dönemi kurum kazancı, beyannamede indirilmek istenen aşağıdaki kalemlerin tamamını karşılamaya
    yetmemiştir:


    I. Kamu yararına çalışan bir derneğe makbuz karşılığı yapılan ve kurum kazancının %5''i ile sınırlı nakdi bağış

    II. KVK md. 10/1-(ı) kapsamında nakdi sermaye artışı nedeniyle hesaplanan indirim

    III. KVK md. 10/1-(ğ) kapsamında yurt dışı mukimlere verilen yazılım hizmetlerinden elde edilen kazanç indirimi

    IV. Önceki yıllardan devreden ve beş yıllık süresi dolmamış geçmiş yıl zararı


    5520 sayılı Kanun ve 1 Seri No.lu Kurumlar Vergisi Genel Tebliği''ne göre, 2026''da kazanç yetersizliği nedeniyle indirilemeyen
    tutarı sonraki hesap dönemlerine devredilebilecek kalemler hangileridir?'
  secenekler:
    A: I ve II
    B: II ve III
    C: II ve IV
    D: I, III ve IV
    E: II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: KVK md. 10'daki diğer indirimler kural olarak yalnız kazancın bulunması hâlinde indirilir ve kazanç yetersizliği
      nedeniyle sonraki yıllara devredilemez; bağış indirimi (I) bu niteliktedir. Nakdi sermaye artışı indiriminde (II) ise
      kanun, matrah yetersizliği nedeniyle indirilemeyen tutarın sonraki dönemlere devredeceğini açıkça hükme bağlamıştır.
      Yurt dışı mukimlere verilen hizmet indiriminde (III) diğer indirim ve istisnalar ile geçmiş yıl zararları nedeniyle
      indirilemeyen tutar izleyen dönemlere devredilemez. Geçmiş yıl zararı (IV), KVK md. 9 uyarınca beş yıldan fazla nakledilmemek
      şartıyla sonraki yıllarda indirilir.
    celdiriciler:
      A: Kurum kazancının %5'i ile sınırlı bağış indirimi, kazanç yetersizliğinde sonraki yıla devredilemez; IV ise devreder.
      B: Hizmet ihracatı kazanç indirimi (10/1-ğ) diğer indirimler ve zararlar nedeniyle indirilemediğinde devredilemez.
      D: Bağış ve hizmet ihracatı indirimleri devredilemez; ayrıca devreden nakdi sermaye indirimi (II) dışarıda bırakılmıştır.
      E: III numaralı indirimde indirilemeyen tutar izleyen dönemlere devredilemez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.1
    alinti: Bu madde ile düzenlenen diğer indirimler, esasen kazancın bulunması halinde beyanname üzerinden indirim konusu
      yapılan ve kazancın yetersiz olması nedeniyle de sonraki yıllara devredilemeyen indirimlerdir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-(ı)
    alinti: Matrahın yetersiz olması nedeniyle ilgili dönemde indirim konusu yapılamayan tutarlar, sonraki hesap dönemlerine
