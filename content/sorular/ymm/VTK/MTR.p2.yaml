- id: YMM-VTK-MTR-0005
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: geçici vergi
  tip: bilgi
  zorluk: 1
  kok: Hesap dönemi takvim yılı olan (A) AŞ'nin 2026 yılının Ekim-Aralık dönemine ilişkin geçici vergi yükümlülüğü bakımından,
    193 sayılı Gelir Vergisi Kanunu'nun mükerrer 120. maddesinin güncel hâline göre aşağıdakilerden hangisi doğrudur? (Sürelerin
    tatil günlerine rastlamasının etkisi dikkate alınmayacaktır.)
  secenekler:
    A: Son üç aylık dönem için geçici vergi beyannamesi verilmez; bu dönemin kazancı yalnız yıllık beyannameyle beyan edilir.
    B: Geçici vergi, dönemi izleyen ikinci ayın on yedinci günü akşamına kadar hem beyan edilir hem de ödenir.
    C: Geçici vergi, dönemi izleyen ilk ayın on dördüncü günü akşamına kadar beyan edilir ve aynı ayın sonuna kadar ödenir.
    D: Geçici vergi, dönemi izleyen ikinci ayın on dördüncü gününe kadar beyan edilir, on yedinci gününe kadar ödenir.
    E: Son dönem geçici vergisi beyan edilir, ancak ödenmez; tutarı yıllık kurumlar vergisinden mahsup edilecek vergi sayılır.
  dogru: D
  aciklama:
    dogru_neden: 7566 sayılı Kanun'la mükerrer 120. maddenin birinci fıkrasındaki "ilk dokuz ayı için belirlenen" ibaresi
      metinden çıkarılmıştır; 1/1/2025'ten itibaren başlayan dönemlerden başlayarak geçici vergi, hesap döneminin dört üç
      aylık döneminin tamamı için hesaplanır. Kurumlar vergisi mükellefleri de KVK md. 32/2 uyarınca geçici vergiyi GVK'daki
      esaslara göre öder. Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın on dördüncü günü akşamına kadar beyan
      edilir ve on yedinci günü akşamına kadar ödenir; Ekim-Aralık 2026 dönemi için bu, Şubat 2027'nin 14'ü (beyan) ve 17'sidir
      (ödeme).
    celdiriciler:
      A: Dördüncü dönemde geçici vergi verilmemesi, 7566 sayılı Kanun'la kaldırılan "ilk dokuz ay" sınırlamasına dayanan eski
        uygulamadır.
      B: 'Beyan ve ödeme günleri ayrıdır: beyan on dördüncü, ödeme on yedinci günü akşamına kadardır.'
      C: Süre, dönemi izleyen ilk ay değil ikinci aydır; ödeme de ayın sonuna değil on yedinci gününe kadardır.
      E: Tahakkuk eden geçici vergi süresinde ödenir; yıllık beyannamede yalnız ödenen kısım mahsup edilir (KVK md. 34/4).
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 120
    alinti: Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın ondördüncü günü akşamına kadar bağlı olunan vergi
      dairesine beyan edilir ve onyedinci günü akşamına kadar ödenir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mük. md. 120, dipnot 144
    alinti: 4/12/2025 tarihli ve 7566 sayılı Kanunun 2 nci maddesiyle bu fıkranın birinci cümlesinde yer alan “ilk dokuz ayı
      için belirlenen” ibaresi madde metninden çıkarılmıştır.
