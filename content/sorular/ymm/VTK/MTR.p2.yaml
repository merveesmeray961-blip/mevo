- id: YMM-VTK-MTR-0012
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: asgari kurumlar vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Ürünleri yurt içinden satın alarak ihraç eden ve aynı zamanda yurt içinde toptan satış yapan (M) AŞ (2010''dan beri
    faaliyette, sanayi sicil belgesi yok, finans sektöründe değil) 2026 yılına ilişkin şu bilgileri vermiştir:


    - Ticari bilanço kârı: 10.000.000 TL (ihracat kazancı 6.800.000 TL, yurt içi satış kazancı 1.700.000 TL, tam mükellef
    kurumdan alınan ve KVK md. 5/1-a kapsamındaki kâr payı 1.500.000 TL)

    - Kanunen kabul edilmeyen giderler: 500.000 TL

    - 2023 yılı beyannamesinde yer alan ve mahsup edilmemiş zarar: 6.000.000 TL


    Kurumlar vergisi oranı %25''tir. İhracat kazancına KVK md. 32/7 uyarınca 5 puan indirim uygulanacak ve indirimli orana
    tabi matrah, Seri No: 23 KV Genel Tebliği''ndeki oranlama yöntemiyle (matrah x ihracat kazancı / ticari bilanço kârı)
    bulunacaktır. Yurt içi asgari kurumlar vergisi oranı %10''dur. Buna göre (M) AŞ''nin 2026 yılı için hesaplanan kurumlar
    vergisi (asgari vergi farkı dahil) kaç TL''dir?'
  secenekler:
    A: '648.000'
    B: '750.000'
    C: '798.000'
    D: '900.000'
    E: '948.000'
  dogru: C
  aciklama:
    dogru_neden: 'Normal hesap: Kurum kazancı 10.500.000 TL; matrah 10.500.000 - 1.500.000 (iştirak kazancı) - 6.000.000 (zarar)
      = 3.000.000 TL. İndirimli orana tabi matrah 3.000.000 x 6.800.000 / 10.000.000 = 2.040.000 TL; vergi 2.040.000 x %20
      + 960.000 x %25 = 408.000 + 240.000 = 648.000 TL. Asgari hesap: Geçmiş yıl zararları asgari vergi matrahından düşülmez;
      yalnız 5/1-a iştirak kazancı düşülür: (10.500.000 - 1.500.000) x %10 = 900.000 TL. KVK md. 32/C-3 uyarınca bundan, 32/7''deki
      indirimli oran nedeniyle alınmayan vergi (2.040.000 x %5 = 102.000 TL) indirilir: 798.000 TL. Bu tutar 648.000 TL''yi
      aştığından 150.000 TL asgari vergi farkı doğar; hesaplanan kurumlar vergisi 798.000 TL''dir. Püf noktaları: Asgari vergiden
      indirilecek tutar, indirimli oran uygulanan matraha (2.040.000 TL) isabet eden 5 puanlık vergidir; tüm matrah üzerinden
      hesaplamayın. Zararın asgari matrahtan düşülmemesi ise asgari vergiyi bağlayıcı hâle getiren unsurdur.'
    celdiriciler:
      A: Yalnız normal hesaplanan vergidir; asgari vergi kontrolü yapılmamıştır.
      B: İndirimli oran nedeniyle alınmayan vergi tüm matrah üzerinden (3.000.000 x %5 = 150.000 TL) hesaplanmıştır; doğrusu
        indirimli orana tabi 2.040.000 TL üzerinden 102.000 TL'dir.
      D: Asgari vergiden md. 32/C-3 uyarınca indirilmesi gereken 102.000 TL düşülmemiştir.
      E: 'Asgari vergi matrahından 5/1-a iştirak kazancı düşülmemiştir: 10.500.000 x %10 - 102.000.'
    hesap_adimlari:
    - Kurum kazancı = 10.000.000 + 500.000 = 10.500.000
    - Matrah = 10.500.000 - 1.500.000 - 6.000.000 = 3.000.000
    - İndirimli matrah = 3.000.000 x 6,8 / 10 = 2.040.000
    - Normal KV = 2.040.000 x %20 + 960.000 x %25 = 648.000
    - Asgari = 9.000.000 x %10 - 2.040.000 x %5 = 900.000 - 102.000 = 798.000
    - Hesaplanan KV = 798.000 (fark 150.000)
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C-3
    alinti: (3) Birinci fıkra kapsamında hesaplanan yurt içi asgari kurumlar vergisinden, 32 nci maddenin altıncı, yedinci
      ve sekizinci fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan vergi ile bu maddenin yürürlüğe girdiği
      tarihten önce Sanayi ve Teknoloji Bakanlığından alınmış olan teşvik belgelerindeki yatırıma katkı tutarlarının kullanılması
      nedeniyle 32/A maddesi hükmüne istinaden ilgili hesap döneminde alınmayan vergi indirilir ve ödenmesi gereken yurt içi
      asgari kurumlar vergisi belirlenir.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 23)'
    madde: bölüm 32.5.4
    alinti: Beyannamelerde indirim konusu yapılan geçmiş yıl zararları asgari kurumlar vergisi matrahından düşülmeyecek ve
      asgari kurumlar vergisinin hesaplanmasında dikkate alınacaktır.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 23)'
    madde: bölüm 32.1.2.5
    alinti: ihracattan kaynaklanan ve 5 puan indirim uygulanacak matrah, ihracattan elde edilen kazancın ticari bilanço karına
      oranlanması suretiyle tespit edilecektir.
  gecerlilik:
    baslangic: '2025-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kk = 10000000 + 500000

      matrah = kk - 1500000 - 6000000

      ind = matrah * 6800000 / 10000000

      normal = ind * 0.20 + (matrah - ind) * 0.25

      asgari = (kk - 1500000) * 0.10 - ind * 0.05

      sonuc = round(max(normal, asgari))'
