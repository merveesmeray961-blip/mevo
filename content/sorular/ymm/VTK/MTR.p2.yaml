- id: YMM-VTK-MTR-0006
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Matrah ve beyan teknikleri
  konu: MTR
  kazanim: ticari bilanço kârından mali kâra geçiş
  tip: hesaplama
  zorluk: 1
  kok: Sermayesinin yarısı zarar sebebiyle karşılıksız kalan (B) AŞ'nin genel kurulu, 6102 sayılı TTK md. 376 uyarınca sermayenin
    tamamlanmasına karar vermiş; ortaklar zarar sebebiyle karşılıksız kalan kısmı kapatacak miktarda 800.000 TL'yi 2026 yılında
    şirkete aktarmıştır. Şirket bu tutarı gelir hesabına kaydetmiştir. (B) AŞ'nin 2026 yılı ticari bilanço kârı (bu gelir
    dahil) 2.000.000 TL, kanunen kabul edilmeyen giderleri 100.000 TL'dir; başka bir indirim, istisna veya geçmiş yıl zararı
    yoktur. Buna göre (B) AŞ'nin 2026 yılı kurumlar vergisi matrahı kaç TL'dir?
  secenekler:
    A: 1.200.000
    B: 1.300.000
    C: 2.000.000
    D: 2.100.000
    E: 2.900.000
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 6/3''e göre TTK md. 376 uyarınca sermayenin tamamlanmasına karar verilen şirketin ortakları tarafından
      zarar sebebiyle karşılıksız kalan kısmı kapatacak miktarda aktarılan tutarlar kurum kazancının tespitinde dikkate alınmaz.
      Gelir yazılan 800.000 TL ticari kârdan çıkarılır, kanunen kabul edilmeyen giderler eklenir: 2.000.000 - 800.000 + 100.000
      = 1.300.000 TL.'
    celdiriciler:
      A: Aktarılan tutar doğru biçimde düşülmüş, ancak kanunen kabul edilmeyen giderler (100.000 TL) eklenmemiştir.
      C: Ticari bilanço kârı olduğu gibi alınmış; ne aktarılan tutar düşülmüş ne de KKEG eklenmiştir.
      D: KKEG eklenmiş, ancak md. 6/3 kapsamında kazanca dahil edilmemesi gereken 800.000 TL matrahta bırakılmıştır.
      E: Aktarılan tutar düşülmek yerine ticari kâra ikinci kez eklenmiştir.
    hesap_adimlari:
    - Matrah = 2.000.000 - 800.000 + 100.000 = 1.300.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 6/3
    alinti: (3) (Ek:8/4/2022-7394/23 md.) 13/1/2011 tarihli ve 6102 sayılı Türk Ticaret Kanununun 376 ncı maddesi uyarınca
      sermayenin tamamlanmasına karar verilen şirketin ortakları tarafından zarar sebebiyle karşılıksız kalan kısmı kapatacak
      miktarda aktarılan tutarlar kurum kazancının tespitinde dikkate alınmaz.
  gecerlilik:
    baslangic: '2022-04-15'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 2000000 - 800000 + 100000
