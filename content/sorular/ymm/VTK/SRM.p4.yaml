      D: Tahsil edilen tutardır.
      E: Tahsil edilemeyen tutarın tamamıdır; bu kanuni temsilcinin sorumluluğudur.
    hesap_adimlari:
    - 'Tahsil edilemeyen: 1.500.000 − 500.000 = 1.000.000 TL'
    - 'X''in payı: 1.000.000 × %25 = 250.000 TL'
