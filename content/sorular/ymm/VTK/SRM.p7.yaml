- id: YMM-VTK-SRM-0023
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi sorumluluğu ve teminat
  konu: SRM
  kazanim: kabul edilen teminat türleri ve değerlemesi
  tip: hesaplama
  zorluk: 3
  kok: '(V) Ltd. Şti. adına 6183 sayılı Kanunun 9. maddesi uyarınca 1.200.000 TL teminat istenmiştir. Şirket, tahsil dairesine
    şu teminatları sunmuştur: 300.000 TL nakit; Hükümetçe belli edilen millî esham ve tahvilat (teminatın kabul edilmesine
    en yakın borsa cetvelindeki toplam değeri 600.000 TL); bir bankanın verdiği süresiz ve şartsız 200.000 TL tutarında teminat
    mektubu. Şirketin esham ve tahvilat dışında ayrıca ödenmiş sermayesinin 5.000.000 TL olması teminat hesabını etkilememektedir.
    Buna göre sunulan teminatların 6183 sayılı Kanun md. 10 uyarınca değerlenmiş toplam tutarı kaç TL''dir?'
  secenekler:
    A: '935.000'
    B: '980.000'
    C: 1.010.000
    D: 1.100.000
    E: 1.190.000
  dogru: C
  aciklama:
    dogru_neden: 'Para ve banka teminat mektubu nominal değeriyle kabul edilir; millî esham ve tahvilat teminatın kabul edilmesine
      en yakın borsa cetvelleri üzerinden %15 noksaniyle değerlenir: 600.000 x 0,85 = 510.000. Toplam = 300.000 + 510.000
      + 200.000 = 1.010.000 TL. Püf noktaları: %15 noksan yalnızca millî esham ve tahvilata uygulanır; sermaye tutarı gibi
      veriler teminat hesabında yok sayılır.'
    celdiriciler:
      A: Tüm teminatlara (1.100.000 x 0,85) %15 noksan uygulanmıştır; oysa bu yalnızca millî esham ve tahvilata uygulanır.
      B: Banka teminat mektubuna da %15 noksan uygulanmıştır (300.000 + 510.000 + 170.000); mektup nominal değeriyle kabul
        edilir.
      D: Millî esham ve tahvilat borsa değeriyle, noksan uygulanmadan hesaba katılmıştır.
      E: Millî esham ve tahvilat %15 noksan yerine %15 fazlasıyla (690.000) hesaba katılmıştır.
    hesap_adimlari:
    - Millî esham ve tahvilat = 600.000 x (1 - 0,15) = 510.000
    - Toplam = 300.000 + 510.000 + 200.000 = 1.010.000
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 10/4
    alinti: Hükümetçe belli edilecek Milli esham ve tahvilat "Bu esham ve tahvilat, teminatın kabul edilmesine en yakın borsa
      cetvelleri üzerinden % 15 noksaniyle değerlendirilir."
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 10/2
    alinti: Bankalar tarafından verilen süresiz ve şartsız teminat mektupları ile sigorta şirketleri tarafından verilen süresiz
      ve şartsız kefalet senetleri,
  gecerlilik:
    baslangic: '2022-07-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'esham = 600000*(1-0.15)

      sonuc = 300000 + esham + 200000'
