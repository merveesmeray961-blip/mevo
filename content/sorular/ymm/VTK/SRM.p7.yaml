  kok: (Z) Ltd. Şti. 2026 yılında tasfiyeye girmiş, tasfiye memuru (M) tasfiyenin başladığını süresinde tahsil dairesine bildirmiştir.
    Şirketin tahakkuk etmiş 2.400.000 TL amme borcu ödenmemiş ve ödenmek üzere ayrılmamıştır. Tasfiye memuru, bu alacaklar
    ödenmeden tasfiye sonucunda elde edilen tutardan ortaklara 1.500.000 TL dağıtım yapmış ve ayrıca şirkete ait 200.000 TL
    değerindeki bir taşıtı bir ortağa devretmiştir. Şirketin tasfiye giderleri 100.000 TL'dir. Buna göre 6183 sayılı Kanun
