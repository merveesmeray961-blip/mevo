- id: YMM-VTK-TFR-0003
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.12 örtülü sermaye
  tip: kavrama
  zorluk: 3
  kok: 'Bir kurum, ortaklarından ve ortaklarla ilişkili kişilerden doğrudan veya dolaylı borç temin ederek işletmede
    kullanmaktadır. Hesap dönemi içinde borç toplamı öz sermayenin üç katını aşmaktadır. KVK md. 12 açısından aşağıdaki
    öncüllerden hangileri doğrudur?

    I. Eşik, hesap dönemi içinde herhangi bir tarihte aşılmışsa aşan kısım örtülü sermaye sayılabilir.

    II. Örtülü sermaye değerlendirmesinde öz sermaye ölçütü dikkate alınır.

    III. Borcun öz sermayenin üç katını aşan kısmı değil, borcun tamamı otomatik olarak örtülü sermayedir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 12/1, hesap dönemi içinde herhangi bir tarihte öz sermayenin üç katını aşan borç kısmını
      örtülü sermaye sayar. III, yalnız aşan kısmı esas alan hükme aykırıdır. Püf noktaları: Eşik hesabında borcun
      tamamı ile yalnızca eşiği aşan kısmı birbirinden ayırın.'
    celdiriciler:
      A: II de doğrudur; öz sermaye açıkça ölçüttür.
      B: I de doğrudur.
      D: III yanlıştır.
      E: III yanlış olduğu için tüm öncüller doğru değildir.
