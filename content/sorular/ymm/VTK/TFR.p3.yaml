    python: 'oz_sermaye = 1_000_000

      alınan_borc = 4_000_000

      sinir = oz_sermaye * 3

      ortulu_sermaye = alınan_borc - sinir if alınan_borc > sinir else 0

      sonuc = {"ortulu_sermaye": ortulu_sermaye}

