- id: YMM-VTK-TFR-0014
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: KVK md.12 örtülü sermaye
  tip: kavrama
  zorluk: 3
  kok: 'KVK md.12 uyarınca örtülü sermaye tespitinde aşağıdaki ifadelerden hangileri doğrudur?


    I. Kurumun öz sermayesinin üç katını aşan yabancı kaynak örtülü sermaye sayılır.

    II. Örtülü sermaye üzerinden ödenen faiz ve kur farkları kurum kazancından indirilemez.

    III. Ortaklardan veya ortaklarla ilişkili kişilerden temin edilen borçlar kapsam dışıdır.

    '
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I, II ve III
    D: II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: KVK md.12'ye göre ortakların öz sermayesinin üç katını aşan yabancı kaynaklar örtülü sermaye sayılır (I doğru)
      ve bu borçlar üzerindeki faiz/kur farkları gider yazılamaz (II doğru). III yanlıştır zira ortaklardan alınan borçlar
      zaten örtülü sermaye kapsamının odak noktasıdır.
    celdiriciler:
      A: Yalnız I doğru olsaydı II'nin kapsam dışı kalması gerekirdi; her iki ifade de doğrudur.
      B: Yalnız II seçmek I'i dışlamayı gerektirir; oysa I de doğrudur.
      D: III yanlıştır; ortaklardan alınan borçlar kapsam içindedir.
      C: III yanlış olduğundan üçü birden doğru olamaz.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12
    alinti: Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden doğrudan veya dolaylı olarak temin ederek işletmede
      kullandıkları borçların, hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı, ilgili
      hesap dönemi için örtülü sermaye sayılır.
  gecerlilik:
    baslangic: '2006-06-21'
    bitis: null
    yila_bagli_tutar: false
  durum: geri_cekildi
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: claude'
    istem_surumu: uretici paketi YMM-VTK-G03
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-13'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-13'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: kaldi
        tarih: '2026-10-13'
        not: 'I eksik/yanlış: md.12/1 yalnız ortak veya ortakla ilişkili kişilerden temin edilen ve dönem başı öz sermayenin
          3 katını aşan borç; ''yabancı kaynak'' genellemesiyle cevap E/B arasında yoruma bağlı.'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
