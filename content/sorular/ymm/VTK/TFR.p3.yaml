- id: YMM-VTK-TFR-0013
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Transfer fiyatlandırması ve örtülü sermaye
  konu: TFR
  kazanim: örtülü kazanç dağıtımı
  tip: uygulama
  zorluk: 3
  kok: 'KVK md. 13 kapsamındaki örtülü kazanç dağıtımına ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?

    '
  secenekler:
    A: Örtülü kazanç dağıtımı için ilişkili kişi tanımının sağlanması gerekir.
    B: Dağıtımın tespitinde emsallere uygunluk ilkesi esas alınır.
    C: Örtülü kazanç dağıtımı yalnızca mal satışı işlemlerinde söz konusu olabilir.
    D: İlişkili kişilerle yapılan hizmet alımlarında da emsale aykırılık örtülü kazanç dağıtımı sayılabilir.
    E: Örtülü kazanç dağıtımı hem satın alma hem de satış işlemlerinde ortaya çıkabilir.
  dogru: C
  aciklama:
    dogru_neden: 'KVK md. 13/1: mal veya hizmet alım ya da satımında örtülü kazanç dağıtımı gündeme gelebilir; yalnız mal
      satışıyla sınırlı değildir. Hizmet alım-satımları da kapsama girmektedir.'
    celdiriciler:
      A: İlişkili kişi tanımı zorunlu koşuldur; doğru.
      B: Emsallere uygunluk ilkesi esastır; doğru.
      D: Hizmet alımları da kapsama girer; doğru.
      E: Hem alım hem satım işlemleri kapsama dahil; doğru.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/1
    alinti: Kurumlar, ilişkili kişilerle emsallere uygunluk ilkesine aykırı olarak tespit ettikleri bedel veya fiyat üzerinden
      mal veya hizmet alım ya da satımında bulunursa, kazanç tamamen veya kısmen transfer fiyatlandırması yoluyla örtülü olarak
      dağıtılmış sayılır.
  gecerlilik:
    baslangic: '2007-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: kontrolde
  surum: 1
