  zorluk: 3
  kok: A Kurumu'nun öz sermayesi 1.000.000 TL, yurt dışındaki ana ortağından aldığı borç ise 4.000.000 TL'dir. KVK md.12 uyarınca
    örtülü sermaye tutarı kaç TL'dir?
  secenekler:
    A: 1.000.000 TL
    B: 3.000.000 TL
    C: 4.000.000 TL
    D: 5.000.000 TL
    E: Örtülü sermaye oluşmaz.
  dogru: A
  aciklama:
    dogru_neden: Öz sermayenin 3 katı = 1.000.000 × 3 = 3.000.000 TL. Alınan borç 4.000.000 TL olduğundan aşan kısım = 4.000.000
      − 3.000.000 = 1.000.000 TL örtülü sermaye sayılır.
    celdiriciler:
      B: 3.000.000 TL, öz sermayenin 3 katıdır; bu sınır aşıldıkça örtülü sermaye doğar.
      C: Borcun tamamı örtülü sermaye değil, yalnızca sınırı aşan kısım örtülüdür.
      D: 5.000.000 TL hesaben anlamsızdır.
      E: Borç öz sermayenin 3 katını (3.000.000 TL) aştığından örtülü sermaye doğar.
