    kaynak_turu: yapay_zeka
    model: 'harici: claude-sonnet uretim2'
    istem_surumu: uretici paketi uretim2 2026-11-11
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-11-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-11-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: kaldi
        tarih: '2026-11-11'
        not: 'hakem (tam inceleme) ret: TEKRAR (bankada mevcut): MEVCUT_SORULAR''daki ''Vadesi 30.04.2026 60.000 TL, 15.07.2026''da
          ödenmiş, %3,7, ay kesri günlük'' (2 ay 15 gün) sorusuyla aynı hesap yapısı. İçerik doğru (111.000).'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
