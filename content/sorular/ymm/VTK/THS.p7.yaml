  - YMM
  ders: VTK
  unite: Vergi alacağının tahsili
  konu: THS
  kazanim: gecikme zammı hesabı
  tip: hesaplama
  zorluk: 3
  kok: (Q) A.Ş.'nin 1.200.000 TL tutarındaki KDV borcu vadesinde ödenmemiş ve borç vade bitiminden itibaren 2 ay 15 gün gecikmeyle
    ödenmiştir. 6183 sayılı Kanun md. 51 uyarınca her ay için ayrı ayrı %3,7 oranı uygulanacak, ay kesirleri için gecikme
    zammı günlük olarak (aylık oranın 1/30'u kadar) hesaplanacaktır. Basit hesaplama yapılacağına göre ödenmesi gereken gecikme
    zammı kaç TL'dir?
  secenekler:
    A: '44.400'
    B: '88.800'
    C: '103.600'
    D: '111.000'
    E: '133.200'
  dogru: D
  aciklama:
    dogru_neden: 'Gecikme zammı = 1.200.000 x (2 x %3,7 + 15/30 x %3,7) = 1.200.000 x (%7,4 + %1,85) = 1.200.000 x %9,25 =
      111.000 TL. Ay kesirlerine isabet eden gecikme zammı günlük olarak hesaplanır; 15 gün yarım ay sayılarak oranın yarısı
      (%1,85) uygulanır. Püf noktaları: ay kesri günlük hesaplanır (aylık oranın 1/30''u) ve tam aylar ile kesir ayrı ayrı
      toplanır.'
    celdiriciler:
      A: Yalnızca 1 ay için hesaplanmıştır (1.200.000 x %3,7).
      B: Yalnızca 2 tam ay için hesaplanmıştır (%7,4); 15 günlük kesir ihmal edilmiştir.
      C: Ay kesri 10 gün sayılmıştır (%7,4 + 10/30 x %3,7); 15 gün alınmalıdır.
      E: Ay kesri tam ay sayılmıştır (3 ay x %3,7); kesirler günlük hesaplanır.
    hesap_adimlari:
    - 'Tam ay: 2 x %3,7 = %7,4'
    - 'Ay kesri: 15/30 x %3,7 = %1,85'
    - Toplam oran %9,25; 1.200.000 x %9,25 = 111.000
  kaynaklar:
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 51/1
    alinti: Amme alacağının ödeme müddeti içinde ödenmeyen kısmına vadenin bitim tarihinden itibaren her ay için ayrı ayrı
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 51/1
    alinti: Ay kesirlerine isabet eden gecikme zammı günlük olarak hesap edilir.
  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 51 (dipnot 26)
    alinti: 13/11/2025 tarihli ve 33076 sayılı Resmî Gazete’de yayımlanan 10556 sayılı Cumhurbaşkanı Kararı ile birinci fıkrada
      yer alan gecikme zammı oranı her ay için ayrı ayrı uygulanmak üzere %3,7 olarak belirlenmiştir.
  gecerlilik:
    baslangic: '2025-11-13'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'oran = 2*3.7 + 15/30*3.7

      sonuc = round(1200000*oran/100)'
