      indirim, bu indirim uygulandıktan sonraki oran üzerine uygulanır: %23 - 5 = %18. İhracata isabet eden matrah 3.200.000
      x 3.000.000 / 4.000.000 = 2.400.000 TL → 2.400.000 x %18 = 432.000 TL; kalan 800.000 x %23 = 184.000 TL. Toplam 616.000
      TL. Püf noktaları: 2 puanlık halka arz indirimi matrahın tamamına, 5 puanlık ihracat indirimi yalnız ihracata isabet
