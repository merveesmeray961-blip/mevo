- id: YMM-VTK-TSV-0006
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: nakdi sermaye artırımı indirimi
  tip: uygulama
  zorluk: 2
  kok: Finans sektöründe faaliyet göstermeyen ve hesap dönemi takvim yılı olan (N) AŞ'nin 8.000.000 TL'lik sermaye artırımına
    ilişkin genel kurul kararı 12/10/2022'de ticaret siciline tescil edilmiştir. Artırılan sermayenin 5.000.000 TL'si aynı
    ay ortaklarca şirketin banka hesabına nakden yatırılmış (ortaklar kredi kullanmamış veya borç almamıştır), 3.000.000 TL'si
    ise bilançodaki olağanüstü yedeklerin sermayeye eklenmesiyle karşılanmıştır. Şirket daha sonra sermayesini 1.000.000 TL
    azaltmış, azaltım kararı 15/7/2025'te tescil edilmiştir. KVK md. 10/1-(ı) ve 1 Seri No.lu KV Genel Tebliği'ne göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: İndirim 2022 dâhil beş dönem (2026 sonuna kadar) uygulanır; yedeklerden eklenen 3.000.000 TL dikkate alınmaz.
    B: İndirim, artırımı izleyen 2023 döneminden başlayarak beş dönem, yani 2027 hesap dönemi sonuna kadar uygulanır.
    C: Yedeklerden karşılanan kısım da tescil edilmiş sermaye artışı olduğundan indirim 8.000.000 TL üzerinden hesaplanır.
    D: 2025'te sermaye azaltımı yapıldığından nakdi sermaye artışı indirimi hakkı tümüyle ve geriye dönük olarak sona erer.
    E: Azaltılan 1.000.000 TL, azaltımın tescil edildiği 2025 hesap döneminin başından itibaren indirim hesabından çıkarılır.
  dogru: A
  aciklama:
