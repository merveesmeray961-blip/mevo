- id: YMM-VTK-TSV-0005
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: ihracat ve hizmet ihracatı indirimi
  tip: uygulama
  zorluk: 2
  kok: 'KVK md. 10/1-(ğ) kapsamındaki yurt dışı mukimlere verilen hizmetler indirimi ile ilgili olarak, 1 Seri No.lu Kurumlar
    Vergisi Genel Tebliği''ne göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Yazılım şirketi (A) AŞ''nin, yurt dışı mukimi (X) Inc.''in Türkiye''deki şubesinin muhasebe işlemlerinde kullanılmak
    üzere geliştirdiği yazılımdan elde ettiği kazanç indirim kapsamındadır.

    II. Sağlık Bakanlığınca ruhsatlandırılmış (B) Hastanesi AŞ''nin yurt dışı yerleşik bir hastaya verdiği sağlık hizmetinin
    bedeli Türkiye''de kredi kartıyla ödenmişse, bu kazanç için ayrıca Türkiye''ye transfer şartı aranmaz.

    III. Mimarlık alanında faaliyet gösteren (C) AŞ''nin yurt dışı mukimlere sunduğu danışmanlık ve aracılık hizmetlerinden
    elde ettiği kazanç indirim kapsamında değerlendirilmez.

    IV. Yazılım şirketi (D) AŞ''nin yurt dışı müşterilerden tahsil ettiği bedelleri mevduatta değerlendirmesinden elde ettiği
    faiz gelirleri de indirim kapsamındadır.'
  secenekler:
    A: I ve IV
    B: I ve II
    C: III ve IV
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'II doğrudur: hizmet bedelinin beyanname verme süresine kadar Türkiye''de ödenmesi hâlinde ayrıca transfer
      şartı aranmaz. III doğrudur: hizmetin fiilen verilmesi gerekir; bu alanlarda sunulan asistanlık, danışmanlık ve aracılık
      hizmetleri kapsamda değildir. I yanlıştır: hizmetten yurt dışında yararlanılmalı, yani yurt dışı mukiminin Türkiye''deki
      faaliyetleriyle ilgisi olmamalıdır. IV yanlıştır: nakitlerin değerlendirilmesinden doğan faiz gelirleri gibi esas faaliyet
      dışı gelirler indirim kapsamında değildir.'
    celdiriciler:
      A: Türkiye'deki şubenin faaliyetine yönelik hizmetten yurt dışında yararlanılmış sayılmaz; faiz geliri de esas faaliyet
        dışıdır.
      B: I'deki hizmet, müşterinin Türkiye'deki faaliyetiyle ilgili olduğundan indirime konu olamaz.
      C: IV yanlıştır; mevduat faizi gibi esas faaliyet dışı gelirler indirim kapsamına girmez.
      E: I yanlıştır; hizmetin yurt dışı mukiminin Türkiye'deki faaliyetleriyle ilgisinin olmaması gerekir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.2.2
    alinti: Yukarıda belirtilen hizmetlerin fiilen verilmesi gerekmekte olup bu alanlarda sunulan asistanlık, danışmanlık
      ve aracılık gibi hizmetlerin bu kapsamda değerlendirilmesi mümkün değildir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.2.4
    alinti: Verilen hizmetten yurt dışında yararlanılmış olması gerekir. Diğer bir anlatımla, yurt dışı mukimi kişi ve/veya
      kurum için verilen hizmetin, bu kişilerin ve/veya kurumların Türkiye'deki faaliyetleri ile ilgisinin olmaması gerekmektedir.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.2.6
    alinti: Anılan bent kapsamında verilen hizmetler karşılığındaki ödemelerin yıllık kurumlar vergisi beyannamesinin verilmesi
      gereken tarihe kadar Türkiye’de yapılması durumunda, söz konusu faaliyetlerden elde edilen kazançlar için ayrıca Türkiye’ye
      transfer edilme şartı aranmayacaktır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.3.4
    alinti: Dolayısıyla, nakitlerin değerlendirilmesi sonucu oluşan faiz gelirleri, kasadaki dövizlerin değerlemesinden kaynaklanan
      kur farkları ve iktisadi kıymetlerin elden çıkarılmasından doğan gelirler bu kapsamda değerlendirilmeyecektir.
