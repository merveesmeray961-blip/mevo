- id: YMM-VTK-TSV-0002
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: yatırım teşvik belgesi ve indirimli kurumlar vergisi
  tip: bilgi
  zorluk: 1
  kok: Finans ve sigortacılık sektörü dışında, imalat alanında faaliyet gösteren (H) AŞ, Temmuz 2025'te başvurduğu yatırım
    için Sanayi ve Teknoloji Bakanlığından Ekim 2025'te yatırım teşvik belgesi almıştır. Yatırım taahhüt işi, iş ortaklığı
    veya rödovans kapsamında değildir; şirketin tabi olduğu kurumlar vergisi oranı %25'tir. 5520 sayılı Kanun'un 7555 sayılı
    Kanunla değişik 32/A maddesine göre, bu yatırımdan elde edilecek kazançlara uygulanacak kurumlar vergisi oranı ve uygulama
    süresi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: '%15; yatırıma katkı tutarına ulaşıncaya kadar, süre sınırı olmaksızın'
    B: '%10; yatırıma katkı tutarına ulaşıncaya kadar, süre sınırı olmaksızın'
    C: '%15; ilk dönem dâhil en fazla on hesap dönemi'
    D: '%10; katkı tutarına ulaşıncaya kadar, en fazla on hesap dönemi'
    E: '%12,5; ilk dönem dâhil en fazla beş hesap dönemi'
  dogru: D
  aciklama:
    dogru_neden: 7555 sayılı Kanun'la değişik 32/A-1'e göre kurumlar vergisi oranı, yatırım teşvik belgesi kapsamındaki yatırımlardan
      elde edilen kazançlara, yatırımın kısmen veya tamamen işletilmesine başlanılan dönemden itibaren yatırıma katkı tutarına
      ulaşıncaya kadar, indirim hakkının kullanılabileceği ilk hesap dönemi dahil en fazla on hesap dönemi %60 indirimli uygulanır.
      %25'lik oran %60 indirimle %25 x 0,40 = %10 olur.
    celdiriciler:
      A: '%15, oranın %60''ı alınarak bulunur; hüküm oranın %60 indirimli uygulanmasıdır (%10). Ayrıca on hesap dönemi sınırı
        vardır.'
      B: Oran doğrudur, ancak yeni düzenlemede en fazla on hesap dönemi sınırı getirilmiştir.
      C: Oran %60 indirim yerine %60 ile çarpılarak bulunmuştur; ayrıca uygulama yatırıma katkı tutarıyla da sınırlıdır.
      E: '%12,5 oranı KVK md. 32/8''deki üretim kazancı düzenlemesine aittir; beş dönem ise 32/A''daki süre değildir.'
    hesap_adimlari:
    - İndirimli oran = %25 x (1 - 0,60) = %10
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-1
    alinti: 32 nci madde kapsamında kurumlar vergisi oranı, Sanayi ve Teknoloji Bakanlığı tarafından düzenlenen yatırım teşvik
      belgesi kapsamında gerçekleştirilen yatırımlardan elde edilen kazançlara, yatırımın kısmen veya tamamen işletilmesine
      başlanılan hesap döneminden itibaren yatırıma katkı tutarına ulaşıncaya kadar, indirim hakkının kullanılabileceği ilk
      hesap dönemi dahil en fazla on hesap dönemi %60 indirimli olarak uygulanır. (Ek cümle:20/7/2025-7555/18 md.) Ancak,
      kazanç bulunmasına rağmen yararlanılmayan yatırıma katkı tutarları müteakip dönemlerde dikkate alınmaz.
  gecerlilik:
    baslangic: '2025-07-24'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: atlandi
        not: hesaplama sorusu değil
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, satır 9
- id: YMM-VTK-TSV-0003
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: ihracat ve hizmet ihracatı indirimi
  tip: hesaplama
  zorluk: 1
  kok: Yazılım alanında faaliyet gösteren ve hesap dönemi takvim yılı olan (S) AŞ, 2026 yılında yurt dışında yerleşik müşterilerine
    Türkiye'den verdiği ve münhasıran yurt dışında yararlanılan yazılım hizmetlerinden 1.000.000 TL kazanç elde etmiştir.
    Faturalar yurt dışındaki müşteriler adına düzenlenmiş, bedeller yurt dışında tahsil edilmiştir. Kazancın 700.000 TL'si
    10/4/2027'de, 300.000 TL'si 20/6/2027'de Türkiye'ye transfer edilmiştir. KVK md. 10/1-(ğ)'deki indirim oranı %80 olarak
    dikkate alınacaktır. Buna göre (S) AŞ, 2026 yılı kurumlar vergisi beyannamesinde bu kazanç için kaç TL indirim yapabilir?
  secenekler:
    A: '0'
    B: '240.000'
    C: '560.000'
    D: '700.000'
    E: '800.000'
  dogru: A
  aciklama:
    dogru_neden: İndirim, kazancın elde edildiği döneme ilişkin kurumlar vergisi beyannamesinin verilmesi gereken tarihe (2026
      için 25 Nisan 2027) kadar tamamının Türkiye'ye transfer edilmesi şartına bağlıdır. Kazancın tamamı değil bir kısmı bu
      süre içinde transfer edildiğinden, transfer edilen kısım da dahil olmak üzere indirimden yararlanılamaz.
    celdiriciler:
      B: Süre sonrasında transfer edilen 300.000 TL'nin %80'idir; sonradan yapılan transfer indirim hakkı doğurmaz.
      C: Süresinde transfer edilen 700.000 TL'nin %80'idir; kısmi transferde transfer edilen kısım için de indirim yapılamaz.
      D: Süresinde transfer edilen tutarın tamamıdır; hem oran hem kısmi transfer kuralı göz ardı edilmiştir.
      E: Kazancın tamamının süresinde transfer edildiği varsayımıyla bulunur; oysa 300.000 TL süre geçtikten sonra transfer
        edilmiştir.
    hesap_adimlari:
    - 'Beyanname verme süresi sonu: 25/4/2027'
    - 'Süresinde transfer: 700.000 < 1.000.000 → şart sağlanmadı → indirim 0'
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-(ğ)
    alinti: münhasıran bu faaliyetlerinden elde ettikleri kazancın, elde edildiği hesap dönemine ilişkin kurumlar vergisi
      beyannamesinin verilmesi gereken tarihe kadar tamamının Türkiye’ye transfer edilmesi şartıyla, %80’i.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: bölüm 10.5.2.6
    alinti: Söz konusu kazançların tamamının değil bir kısmının Türkiye’ye transfer edilmesi durumunda, transfer edilen kısım
      da dahil olmak üzere indirimden yararlanılamayacaktır.
  gecerlilik:
    baslangic: '2023-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kazanc = 1000000

      suresinde = 700000

      sonuc = kazanc * 0.80 if suresinde >= kazanc else 0'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi VTK-2
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_VTK-2.yaml, satır 10
- id: YMM-VTK-TSV-0004
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: yatırım teşvik belgesi ve indirimli kurumlar vergisi
  tip: kavrama
  zorluk: 2
  kok: 'Başvurusu Temmuz 2025''te yapılıp Ekim 2025''te alınan bir yatırım teşvik belgesi kapsamındaki yatırımlar için, 5520
    sayılı Kanun''un 7555 sayılı Kanunla değişik 32/A maddesine göre aşağıdaki ifadelerden hangileri doğrudur?


    I. Kazanç bulunmasına rağmen ilgili dönemde yararlanılmayan yatırıma katkı tutarı, müteakip dönemlerde dikkate alınmaz.

    II. Tevsi yatırımdan elde edilen kazancın ayrı hesaplarda izlenerek tespiti mümkün değilse, indirimli oran uygulanacak
    kazanç; tevsi yatırım tutarının dönem sonunda aktifte kayıtlı (devam eden yatırımlar dahil) toplam sabit kıymet tutarına
    oranlanmasıyla belirlenir.

    III. Hesap dönemi itibarıyla kanuni şartların sağlanamadığının tespiti hâlinde, indirimli oran nedeniyle zamanında tahakkuk
    ettirilmeyen vergiler gecikme faizi ve vergi ziyaı cezasıyla birlikte tahsil edilir.

    IV. İndirimli oran, yatırımın faaliyete geçtiği hesap dönemine ait yıllık beyannameden itibaren uygulanır; geçici vergi
    dönemlerinde uygulanmaz.'
  secenekler:
    A: I ve III
    B: II ve IV
    C: III ve IV
    D: I, II ve III
    E: I ve II
  dogru: E
  aciklama:
    dogru_neden: 'I: 7555 sayılı Kanun''la 32/A-1''e eklenen cümleye göre kazanç bulunmasına rağmen yararlanılmayan yatırıma
      katkı tutarları müteakip dönemlerde dikkate alınmaz. II: 32/A-4''e göre tevsi yatırımda kazanç ayrı tespit edilemiyorsa
      indirimli oran uygulanacak kazanç, tevsi yatırım tutarının dönem sonu toplam sabit kıymet tutarına (devam eden yatırımlar
      dahil) oranlanmasıyla belirlenir. III yanlıştır: 32/A-5''e göre vergiler vergi ziyaı cezası uygulanmaksızın gecikme
      faiziyle tahsil olunur. IV yanlıştır: indirimli oran uygulamasına yatırımın kısmen veya tamamen faaliyete geçtiği geçici
      vergi döneminde başlanır.'
    celdiriciler:
      A: III'te belirtilen vergi ziyaı cezası uygulanmaz; tahsil gecikme faiziyle sınırlıdır.
      B: IV yanlıştır; indirimli oran, yatırımın faaliyete geçtiği geçici vergi döneminden itibaren uygulanır.
      C: 'Her iki ifade de yanlıştır: ceza uygulanmaz ve indirimli oran geçici vergi döneminde başlar.'
      D: III yanlıştır; şartların sağlanamaması hâlinde vergi ziyaı cezası kesilmez.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-4
    alinti: yapılan tevsi yatırım tutarının, dönem sonunda kurumun aktifine kayıtlı bulunan toplam sabit kıymet tutarına (devam
      eden yatırımlara ait tutarlar da dahil) oranlanması suretiyle belirlenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-4
    alinti: İndirimli oran uygulamasına yatırımın kısmen veya tamamen faaliyete geçtiği geçici vergi döneminde başlanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-5
    alinti: (5) Hesap dönemi itibarıyla ikinci ve üçüncü fıkrada belirtilen şartların sağlanamadığının tespit edilmesi halinde,
      söz konusu vergilendirme döneminde indirimli vergi oranı uygulanması nedeniyle zamanında tahakkuk ettirilmemiş vergiler,
      vergi ziyaı cezası uygulanmaksızın gecikme faiziyle birlikte tahsil olunur.
  gecerlilik:
