  - YMM
  ders: VTK
  unite: Teşvikler ve özel uygulamalar
  konu: TSV
  kazanim: yatırım teşvik belgesi ve indirimli kurumlar vergisi
  tip: hesaplama
  zorluk: 3
  kok: 'Finans ve taahhüt sektörü dışında faaliyet gösteren (Y) AŞ, Temmuz 2025''te başvurduğu yatırım için Eylül 2025''te
    yatırım teşvik belgesi almıştır. Belge kapsamındaki toplam yatırım tutarı 10.000.000 TL, yatırıma katkı oranı %15''tir.
    Yatırım Mart 2026''da tamamlanarak tamamen işletmeye alınmıştır. Şirketin tüm kazancı bu yatırımdan doğmakta olup kurumlar
    vergisi matrahı 2026 yılında 6.000.000 TL, 2027 yılında 8.000.000 TL''dir.


    - Kurumlar vergisi oranı %25, yatırımdan elde edilen kazanca uygulanacak indirimli oran %10''dur.

    - Kalan yatırıma katkı tutarının 2027 yılında artırılmasında uygulanacak yeniden değerleme oranı %25''tir.

    - Yurt içi asgari kurumlar vergisi dikkate alınmayacaktır.


    Buna göre (Y) AŞ''nin 2027 yılı için hesaplanan kurumlar vergisi kaç TL''dir?'
  secenekler:
    A: '800.000'
    B: 1.025.000
    C: 1.250.000
    D: 1.400.000
    E: 2.000.000
  dogru: C
  aciklama:
    dogru_neden: 'Yatırıma katkı tutarı 10.000.000 x %15 = 1.500.000 TL''dir. 2026''da indirimli oran nedeniyle alınmayan
      vergi 6.000.000 x (%25 - %10) = 900.000 TL olup katkı tutarından kullanılır; kalan 600.000 TL''dir. Yatırım 2026''da
      tamamlandığından kalan tutar 2027''de yeniden değerleme oranıyla artırılır: 600.000 x 1,25 = 750.000 TL. 2027''de bu
      tutara ulaşıncaya kadar indirimli oran uygulanacak matrah 750.000 / %15 = 5.000.000 TL''dir: 5.000.000 x %10 = 500.000
      TL; kalan 3.000.000 x %25 = 750.000 TL. Toplam 1.250.000 TL. Püf noktaları: Katkı tutarı her yıl indirimli oran nedeniyle
      vazgeçilen vergi kadar tükenir; matrah değil vergi farkı düşülür. Yeniden değerleme, toplam katkı tutarına değil, yatırımın
      tamamlandığı dönemden sonra kalan tutara uygulanır.'
    celdiriciler:
      A: 2027 matrahının tamamına %10 uygulanmıştır; oysa kalan katkı tutarı yalnız 5.000.000 TL'lik matraha yetmektedir.
      B: Yeniden değerleme kalan tutara değil toplam katkı tutarına uygulanmıştır (1.875.000 - 900.000 = 975.000).
      D: Kalan 600.000 TL'lik katkı tutarı yeniden değerleme oranıyla artırılmamıştır (4.000.000 x %10 + 4.000.000 x %25).
      E: Hiç indirimli oran uygulanmamıştır (8.000.000 x %25).
    hesap_adimlari:
    - YKT = 10.000.000 x %15 = 1.500.000
    - 2026 kullanılan = 6.000.000 x %15 = 900.000; kalan 600.000
    - 2027 kalan (artırılmış) = 600.000 x 1,25 = 750.000
    - İndirimli matrah = 750.000 / 0,15 = 5.000.000 → 500.000
    - Kalan matrah 3.000.000 x %25 = 750.000; toplam 1.250.000
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-2
    alinti: Yatırımın tamamlanması şartıyla, indirimli kurumlar vergisi uygulanmak suretiyle yararlanılan kısmı hariç olmak
      üzere kalan yatırıma katkı tutarı, yatırımın tamamlandığı hesap dönemini izleyen yıllarda Vergi Usul Kanunu hükümlerine
      göre bu yıllar için belirlenen yeniden değerleme oranında artırılarak dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/A-1
    alinti: 32 nci madde kapsamında kurumlar vergisi oranı, Sanayi ve Teknoloji Bakanlığı tarafından düzenlenen yatırım teşvik
      belgesi kapsamında gerçekleştirilen yatırımlardan elde edilen kazançlara, yatırımın kısmen veya tamamen işletilmesine
      başlanılan hesap döneminden itibaren yatırıma katkı tutarına ulaşıncaya kadar, indirim hakkının kullanılabileceği ilk
      hesap dönemi dahil en fazla on hesap dönemi %60 indirimli olarak uygulanır. (Ek cümle:20/7/2025-7555/18 md.) Ancak,
      kazanç bulunmasına rağmen yararlanılmayan yatırıma katkı tutarları müteakip dönemlerde dikkate alınmaz.
  gecerlilik:
    baslangic: '2025-07-24'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ykt = 10000000 * 0.15

      kalan = (ykt - 6000000 * 0.15) * 1.25

      ind = kalan / 0.15

      sonuc = round(ind * 0.10 + (8000000 - ind) * 0.25)'
