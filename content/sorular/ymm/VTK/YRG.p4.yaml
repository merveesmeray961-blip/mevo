- id: YMM-VTK-YRG-0007
  sinav: ymm
  bolum:
  - YMM
  ders: VTK
  unite: Vergi yargısı
  konu: YRG
  kazanim: istinaf temyiz ve kanun yararına bozma
  tip: hesaplama
  zorluk: 3
  kok: 7524 sayılı Kanunla İYUK md. 45'teki istinaf sınırı 31.000 TL olarak belirlenmiştir. Sınırlar her yıl bir
    önceki yılın yeniden değerleme oranında artırılmakta ve bin TL'yi aşmayan kısımlar dikkate alınmamaktadır. Yeniden
    değerleme oranı 2024 için %43,93, 2025 için %25,49 olduğuna göre 2026 yılında açılan davalarda uygulanacak istinaf
    sınırı kaç TL'dir?
  secenekler:
    A: '31.000'
    B: '38.000'
    C: '44.000'
    D: '55.000'
    E: '57.000'
  dogru: D
  aciklama:
    dogru_neden: '2025: 31.000 × 1,4393 = 44.618 → 44.000 TL. 2026: 44.000 × 1,2549 = 55.215 → 55.000 TL. Püf noktaları:
      her yıl bir önceki yılın oranı uygulanır ve yuvarlama her yıl ayrı yapılır.'
    celdiriciler:
      A: Kanundaki ilk tutardır; yeniden değerleme yapılmamıştır.
      B: Yalnız 2025 oranı ilk tutara uygulanmıştır (31.000 × 1,2549).
      C: Bu 2025 sınırıdır; 2026 için 2025 oranıyla bir kez daha artırılır.
      E: Yuvarlama yapılmadan iki oranın çarpımı uygulanmış ve yukarı yuvarlanmıştır.
    hesap_adimlari:
    - 31.000 × 1,4393 = 44.618 → 44.000
    - 44.000 × 1,2549 = 55.215,6 → 55.000
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: Ek md. 1
    alinti: Bu şekilde belirlenen sınırların bin Türk lirasını aşmayan kısımları dikkate alınmaz.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 's=31000*1.4393

      s=round(s-s%1000)

      t=s*1.2549

      sonuc=round(t-t%1000)'
  durum: kontrolde
  surum: 1
  uretim:
