  - YMM
  ders: VTK
  unite: Vergi yargısı
  konu: YRG
  kazanim: davadan feragat ve kanun yolundan vazgeçme (VUK md.379)
  tip: hesaplama
  zorluk: 3
  kok: (R) A.Ş.'ye 200.000 TL vergi ve bir kat vergi ziyaı cezası salınmış, açılan davada vergi mahkemesi verginin
    50.000 TL'sini kaldırmış, 150.000 TL'sini tasdik etmiştir; karar istinafa açıktır. Şirket VUK md. 379'a göre
    kanun yolundan vazgeçer ve tahakkuk eden tutarları bir ay içinde öderse, gecikme faizi hariç kaç TL öder?
  secenekler:
    A: '220.000'
    B: '234.000'
    C: '264.000'
    D: '292.500'
    E: '350.000'
  dogru: C
  aciklama:
    dogru_neden: 'Tahakkuk: kaldırılan verginin %60''ı 30.000 + tasdik edilen vergi 150.000 + tasdik edilen vergiye
      ait cezanın %75''i 112.500 = 292.500 TL. Bir ayda ödemede %20 indirim tasdik edilen vergi dışındaki tutara
      uygulanır: (30.000 + 112.500) × %20 = 28.500. Ödenecek: 264.000 TL. Püf noktaları: tasdik edilen vergi aslı
      indirim dışıdır; kaldırılan vergiye ait ceza tahakkuk etmez.'
    celdiriciler:
      A: İndirim tasdik edilen vergiye de uygulanmıştır.
      B: İndirim tahakkukun tamamına uygulanmıştır (292.500 × %80).
      D: İndirimsiz tahakkuk tutarıdır.
      E: Vazgeçme hükümleri uygulanmadan kalan vergi ve cezanın tamamı alınmıştır.
    hesap_adimlari:
    - 50.000 × %60 = 30.000
    - Tasdik edilen vergi = 150.000
    - 150.000 × %75 = 112.500
    - Tahakkuk = 292.500
    - İndirim = (30.000 + 112.500) × %20 = 28.500
    - Ödenecek = 264.000
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 379
    alinti: Kaldırılan vergi tutarının %60’ı, tasdik edilen vergi tutarının tamamı ile tasdik edilen vergi tutarına
      ilişkin vergi ziyaı cezasının %75’i,
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 379
    alinti: Şu kadar ki, tasdik edilerek tahakkuk eden vergi tutarında indirim yapılmaz.
  gecerlilik:
    baslangic: '2019-12-07'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'k,t=50000,150000

      tah=k*0.6+t+t*0.75

      ind=(k*0.6+t*0.75)*0.2

      sonuc=tah-ind'
