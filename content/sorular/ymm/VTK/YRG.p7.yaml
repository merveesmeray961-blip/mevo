  konu: YRG
  kazanim: dava açma süresinin hesabı ve tatil günü
  tip: hesaplama
  zorluk: 3
  kok: (R) A.Ş. adına düzenlenen ikmalen tarhiyat ihbarnamesi 6 Kasım 2026 Cuma günü şirkete tebliğ edilmiş, ihbarnamede özel
    bir dava süresi gösterilmemiştir. Şirket vergi mahkemesinde iptal davası açacaktır. Resmî tatil ve çalışmaya ara verme
    dönemi söz konusu olmadığına göre dava açılabilecek son gün aşağıdakilerden hangisidir?
  secenekler:
    A: 06 Aralık 2026
    B: 07 Aralık 2026
    C: 08 Aralık 2026
    D: 10 Aralık 2026
    E: 11 Aralık 2026
  dogru: B
  aciklama:
    dogru_neden: 'Vergi mahkemelerinde dava açma süresi otuz gündür (md. 7/1) ve süre, tebliğ tarihini izleyen günden (7 Kasım)
      işlemeye başlar (md. 7/2-b, md. 8/1). Otuzuncu gün 6 Aralık 2026 Pazar''a rastlar. Md. 8/2''ye göre sürenin son günü
      tatil gününe rastlarsa süre, tatil gününü izleyen çalışma gününün bitimine kadar uzar; son gün 7 Aralık 2026 Pazartesi''dir.
      Püf noktaları: tebliğ günü süreye dâhil edilmez; son günün tatile rastlayıp rastlamadığı mutlaka takvimden kontrol edilmelidir.'
    celdiriciler:
      A: 6 Aralık Pazar günüdür; son gün tatile rastladığından süre ilk çalışma gününe uzar.
      C: Süre bir gün fazla hesaplanmıştır; pazartesi çalışma gününün bitimi esas alınır, salı değil.
      D: Kanunda böyle bir ek süre yoktur; süre tatili izleyen ilk çalışma gününün bitiminde dolar.
      E: Kanunda böyle bir ek süre yoktur; sürenin uzaması yalnızca tatil gününe rastlama hâlinde ilk çalışma gününe kadardır.
    hesap_adimlari:
    - 'Tebliğ: 06.11.2026 (Cuma); süre 07.11.2026''da başlar'
    - '30. gün: 06.12.2026 (Pazar) - tatil'
    - 'Son gün: 07.12.2026 (Pazartesi)'
  kaynaklar:
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 7/1
    alinti: Dava açma süresi, özel kanunlarında ayrı süre gösterilmeyen hallerde Danıştayda ve idare mahkemelerinde altmış
      ve vergi mahkemelerinde otuz gündür.
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 7/2-b
    alinti: 'Vergi, resim ve harçlar ile benzeri mali yükümler ve bunların zam ve cezalarından doğan uyuşmazlıklarda: Tahakkuku
      tahsile bağlı olan vergilerde tahsilatın; tebliğ yapılan hallerde veya tebliğ yerine geçen işlemlerde tebliğin;'
  - mevzuat: 2577 sayılı İdari Yargılama Usulü Kanunu
    madde: md. 8/2
    alinti: Tatil günleri sürelere dahildir. Şu kadarki, sürenin son günü tatil gününe rastlarsa, süre tatil gününü izleyen
      çalışma gününün bitimine kadar uzar.
