    sabit giderler 125.000 TL olmuştur. Esnek bütçe sapması, fiilî sonuçlar ile fiilî satış miktarına göre hazırlanan esnek
    bütçe arasındaki farktır. Buna göre faaliyet kârına ilişkin esnek bütçe sapması kaç TL'dir?
