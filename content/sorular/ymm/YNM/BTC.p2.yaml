    A: 18.000 TL olumsuz
    B: 20.000 TL olumlu
    C: 26.000 TL olumsuz
    D: 33.000 TL olumsuz
    E: 38.000 TL olumsuz
  dogru: E
  aciklama:
    dogru_neden: 'Fiilî kâr = 528.000 − 341.000 − 125.000 = 62.000 TL. 11.000 birimlik esnek bütçe: hasılat 550.000, değişken
      gider 330.000, sabit gider 120.000 (faaliyet hacmiyle değişmez), kâr 100.000 TL. Esnek bütçe sapması = 62.000 − 100.000
      = 38.000 TL olumsuz. Bunun 22.000 TL''si fiyat düşüşünden, 11.000 TL''si değişken gider aşımından, 5.000 TL''si sabit
      gider aşımından kaynaklanır. Püf noktaları: Esnek bütçede yalnız değişken kalemler fiilî hacme uyarlanır; sabit giderler
      bütçelenen tutarda kalır. Statik bütçe ile esnek bütçe arasındaki fark (20.000 TL olumlu) satış hacmi sapmasıdır, esnek
      bütçe sapması değildir.'
