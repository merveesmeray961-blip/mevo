- id: YMM-YNM-BTC-0062
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Bütçeleme ve standart maliyet
  konu: BTC
  kazanim: ana bütçe
  tip: hesaplama
  zorluk: 2
  kok: 'Bir işletmenin gelecek döneme ilişkin bütçe verileri şöyledir: satış bütçesi 5.800 birim; mamul stoku dönem başında
    600 birim, dönem sonunda hedeflenen 800 birim. Her birim mamul için 3 kg hammadde kullanılmaktadır. Hammadde stoku dönem
    başında 2.000 kg olup dönem sonunda 2.500 kg olması hedeflenmektedir. Hammaddenin alış fiyatı kg başına 4 TL''dir. Buna
    göre hammadde alım bütçesi kaç TL''dir?'
  secenekler:
    A: 69.200 TL
    B: 70.000 TL
    C: 71.600 TL
    D: 72.000 TL
    E: 74.000 TL
  dogru: E
  aciklama:
    dogru_neden: Üretim bütçesi = satış + dönem sonu mamul stoku − dönem başı mamul stoku = 5.800 + 800 − 600 = 6.000 birim.
      Üretim için hammadde ihtiyacı = 6.000 × 3 = 18.000 kg. Alınacak hammadde = ihtiyaç + dönem sonu hammadde stoku − dönem
      başı hammadde stoku = 18.000 + 2.500 − 2.000 = 18.500 kg; tutar 18.500 × 4 = 74.000 TL.
    celdiriciler:
      A: 'Mamul stoku değişimi ters yönde uygulanmıştır (5.800 − 200 = 5.600 birim): (16.800 + 500) × 4.'
      B: 'Hammadde stoku artışı ihtiyaca eklenmesi gerekirken düşülmüştür: (18.000 − 500) × 4.'
      C: 'Mamul stoku değişimi göz ardı edilmiş, satış miktarı üretim sayılmıştır: (17.400 + 500) × 4.'
      D: 'Hammadde stoku değişimi göz ardı edilmiş, üretim ihtiyacı alım miktarı sayılmıştır: 18.000 × 4.'
    hesap_adimlari:
    - Üretim = 5.800 + 800 − 600 = 6.000 birim
    - Hammadde ihtiyacı = 6.000 × 3 = 18.000 kg
    - Alım = 18.000 + 2.500 − 2.000 = 18.500 kg
    - Alım bütçesi = 18.500 × 4 = 74.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Bütçeleme ve standart maliyet
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'uretim = 5800 + 800 - 600

      ihtiyac = uretim * 3

      alim = ihtiyac + 2500 - 2000

      sonuc = alim * 4'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: bekliyor
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
