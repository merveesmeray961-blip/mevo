      B: Esnek bütçe kârı ile statik bütçe kârı arasındaki fark, yani satış hacmi sapması bulunmuştur.
      C: Sabit giderler de hacimle orantılı artırılarak (132.000 TL) esnek bütçe kârı 88.000 TL bulunmuştur.
      D: Sabit giderlerdeki 5.000 TL'lik aşım dikkate alınmamış, yalnız hasılat ve değişken gider farkları toplanmıştır.
