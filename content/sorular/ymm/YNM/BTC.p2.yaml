- id: YMM-YNM-BTC-0065
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Bütçeleme ve standart maliyet
  konu: BTC
  kazanim: malzeme ve işçilik sapmaları
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmede bir birim mamul için standart olarak 2 direkt işçilik saati, saat başına 40 TL öngörülmüştür. Dönem için
    bütçelenen üretim 1.000 birim, fiilî üretim 900 birimdir. Dönemde fiilî direkt işçilik maliyeti 77.900 TL olup işçilik
    ücret (fiyat) sapması 1.900 TL olumsuz olarak hesaplanmıştır. Buna göre işçilik verimlilik (zaman) sapması kaç TL'dir?
  secenekler:
    A: 2.100 TL olumlu
    B: 4.000 TL olumsuz
    C: 4.100 TL olumsuz
    D: 5.900 TL olumsuz
    E: 7.800 TL olumsuz
  dogru: B
  aciklama:
    dogru_neden: 'Ücret sapması = fiilî maliyet − fiilî saat × standart ücret → 77.900 − 40 × FS = 1.900 → 40 × FS = 76.000
      → fiilî saat 1.900''dür (fiilî ücret 41 TL). Fiilî üretim için standart saat = 900 × 2 = 1.800 saat. Verimlilik sapması
      = (1.900 − 1.800) × 40 = 4.000 TL olumsuz. Kontrol: toplam sapma 77.900 − 72.000 = 5.900 TL olumsuz = 1.900 + 4.000.
      Püf noktaları: Olumsuz ücret sapması fiilî maliyetten çıkarılarak fiilî saat standart ücretle bulunur. Standart saat
      bütçelenen değil fiilî üretim miktarına göre hesaplanır; verimlilik sapmasında standart ücret kullanılır.'
    celdiriciler:
      A: 'Standart maliyet bütçelenen üretime (1.000 × 2 × 40 = 80.000 TL) göre alınmış ve fiilî maliyetle karşılaştırılmıştır:
        77.900 − 80.000.'
      C: 'Verimlilik sapmasında standart ücret yerine fiilî ücret (41 TL) kullanılmıştır: 100 × 41.'
      D: Toplam işçilik sapması (77.900 − 72.000) verimlilik sapması sanılmıştır.
      E: 'Olumsuz ücret sapması fiilî maliyete eklenmiş; fiilî saat (77.900 + 1.900) / 40 = 1.995 bulunmuştur: 195 × 40.'
    hesap_adimlari:
    - Fiilî saat × standart ücret = 77.900 − 1.900 = 76.000 TL
    - Fiilî saat = 76.000 / 40 = 1.900
    - Standart saat = 900 × 2 = 1.800
    - Verimlilik sapması = (1.900 − 1.800) × 40 = 4.000 TL olumsuz
  kaynaklar:
  - mevzuat: Genel bilgi — Bütçeleme ve standart maliyet
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fs = (77900 - 1900) / 40

      ss = 900 * 2

      sonuc = (fs - ss) * 40'
  durum: taslak
