  kok: Bir işletmenin bütçelenen satışları ocak 200.000 TL, şubat 300.000 TL, mart 250.000 TL'dir. Satışların %40'ı peşin,
    %60'ı vadelidir. Vadeli satışların %70'i satışı izleyen ay, %30'u satıştan sonraki ikinci ay tahsil edilmektedir; şüpheli
    alacak beklenmemektedir. Nakit bütçesinde mart ayı tahsilatı kaç TL olarak yer alır?
