- id: YMM-YNM-BTC-0066
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Bütçeleme ve standart maliyet
  konu: BTC
  kazanim: genel üretim gideri sapmaları
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme genel üretim giderlerini (GÜG) makine saatine göre yüklemektedir. Yıllık sabit GÜG bütçesi 180.000 TL,
    normal kapasite 3.000 birim mamuldür; bir birim için standart süre 2 makine saatidir. Değişken GÜG standart oranı makine
    saati başına 10 TL'dir. Dönemde 2.700 birim üretilmiş, 5.600 makine saati çalışılmış; fiilî değişken GÜG 57.000 TL, fiilî
    sabit GÜG 183.000 TL olmuştur. Sabit GÜG sapması, bütçe (harcama) sapması ve hacim sapması olarak ikiye ayrılmaktadır.
    Buna göre sabit GÜG hacim sapması kaç TL'dir?
  secenekler:
    A: 3.000 TL olumsuz
    B: 6.000 TL olumsuz
    C: 12.000 TL olumsuz
    D: 15.000 TL olumsuz
    E: 18.000 TL olumsuz
  dogru: E
  aciklama:
    dogru_neden: 'Normal kapasite 3.000 × 2 = 6.000 makine saatidir; sabit GÜG yükleme oranı 180.000 / 6.000 = 30 TL/saat.
      Fiilî üretim için standart saat 2.700 × 2 = 5.400 saattir; yüklenen sabit GÜG 5.400 × 30 = 162.000 TL. Hacim sapması
      = bütçelenen − yüklenen = 180.000 − 162.000 = 18.000 TL olumsuz (kapasitenin altında üretim). Bütçe sapması 183.000
      − 180.000 = 3.000 TL olumsuzdur; iki sapmanın toplamı toplam sabit GÜG sapmasına eşittir: 183.000 − 162.000 = 21.000
      TL olumsuz. Püf noktaları: Hacim sapmasında fiilî saat değil fiilî üretim için izin verilen standart saat kullanılır.
      Değişken GÜG verileri ve fiilî sabit GÜG hacim sapmasını etkilemez.'
    celdiriciler:
      A: 'Sabit GÜG bütçe (harcama) sapmasıdır: 183.000 − 180.000.'
      B: 'Fiilî saat ile standart saat arasındaki fark sabit GÜG oranıyla çarpılmıştır: (5.600 − 5.400) × 30; bu tutar hacim
        sapmasının yalnız bir kısmıdır.'
      C: 'Standart saat yerine fiilî saat kullanılmıştır: 180.000 − 5.600 × 30.'
      D: 'Bütçelenen yerine fiilî sabit GÜG, standart saat yerine fiilî saate göre yüklenen tutarla karşılaştırılmıştır: 183.000
        − 5.600 × 30 = 15.000 TL. Hacim sapması bütçelenen sabit GÜG ile standart saate göre yüklenen tutar arasındaki farktır.'
    hesap_adimlari:
    - Normal kapasite = 3.000 × 2 = 6.000 saat
    - Sabit GÜG oranı = 180.000 / 6.000 = 30 TL/saat
    - Standart saat = 2.700 × 2 = 5.400
    - Yüklenen sabit GÜG = 5.400 × 30 = 162.000 TL
    - Hacim sapması = 180.000 − 162.000 = 18.000 TL olumsuz
  kaynaklar:
  - mevzuat: Genel bilgi — Bütçeleme ve standart maliyet
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
