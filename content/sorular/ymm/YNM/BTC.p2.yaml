- id: YMM-YNM-BTC-0064
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Bütçeleme ve standart maliyet
  konu: BTC
  kazanim: malzeme ve işçilik sapmaları
  tip: uygulama
  zorluk: 3
  kok: 'Bir işletmede bir birim mamul için standart olarak 4 kg malzeme, kg başına 10 TL öngörülmüştür. Dönemde 5.000 kg malzeme
    toplam 48.000 TL''ye satın alınmış; 1.000 birim mamul üretimi için bunun 4.300 kg''ı kullanılmıştır. Dönem başında malzeme
    stoku yoktur. İşletme malzeme fiyat sapmasını **satın alma anında** ayırmakta, malzeme stokunu standart fiyatla izlemektedir.


    I. Malzeme fiyat sapması 2.000 TL olumludur.

    II. Malzeme miktar sapması 2.880 TL olumsuzdur.

    III. Dönem sonundaki 700 kg malzeme stoku 7.000 TL ile izlenir.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Fiilî fiyat 48.000 / 5.000 = 9,60 TL''dir. Fiyat sapması satın alma anında ayrıldığından satın alınan miktarın
      tamamına uygulanır: (9,60 − 10) × 5.000 = 2.000 TL olumlu (I doğru). Miktar sapması standart fiyatla ölçülür: (4.300
      − 4.000) × 10 = 3.000 TL olumsuz (II yanlış). Stok standart fiyatla izlendiğinden kalan 700 kg, 700 × 10 = 7.000 TL
      ile görünür (III doğru). Püf noktaları: Fiyat sapmasının ayrıldığı an, hangi miktara uygulanacağını belirler: alımda
      ayrılırsa satın alınan, kullanımda ayrılırsa kullanılan miktar esas alınır. Miktar sapmasında fiilî fiyat değil standart
      fiyat kullanılır.'
    celdiriciler:
      A: 'III de doğrudur: fiyat sapması alımda ayrıldığı için stoklar standart fiyatla (10 TL) izlenir.'
      B: 'I de doğrudur: fiyat sapması satın alınan 5.000 kg üzerinden 2.000 TL olumludur.'
      C: 'II yanlıştır: 2.880 TL, fazla kullanılan 300 kg''ın fiilî fiyatla (9,60 TL) çarpılmasıyla bulunur; miktar sapması
        standart fiyatla 3.000 TL''dir. Ayrıca III doğrudur.'
      E: II yanlıştır; miktar sapması 3.000 TL olumsuzdur.
  kaynaklar:
