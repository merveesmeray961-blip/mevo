  kok: Bir işletmede bir birim mamul için standart olarak 3 direkt işçilik saati, saat başına 50 TL öngörülmüştür; değişken
    genel üretim gideri (GÜG) direkt işçilik saatine göre saat başına 20 TL standart oranla yüklenmektedir. Dönemde 500 birim
    üretilmiş, 1.600 direkt işçilik saati çalışılmıştır. Fiilî direkt işçilik maliyeti 78.400 TL, fiilî değişken GÜG 33.600
    TL'dir. Buna göre aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Değişken GÜG harcama sapması 1.600 TL olumludur.
    B: İşçilik ücret sapması 1.600 TL olumludur.
    C: İşçilik verimlilik sapması 5.000 TL olumsuzdur.
    D: Değişken GÜG verimlilik sapması 2.000 TL olumsuzdur.
    E: İşçilik ve değişken GÜG sapmalarının toplamı 7.000 TL olumsuzdur.
  dogru: A
  aciklama:
    dogru_neden: 'Fiilî saat başına değişken GÜG 33.600 / 1.600 = 21 TL olup standart oranın (20 TL) üzerindedir. Harcama
      sapması = 33.600 − 1.600 × 20 = 1.600 TL **olumsuzdur**; A yanlıştır. Püf noktaları: İşçilikte fiilî ücret (49 TL) standardın
      altında olduğu için ücret sapması olumludur; değişken GÜG''de ise saat başına fiilî gider standardın üzerindedir. Tutarların
      aynı (1.600 TL) çıkması yönlerinin de aynı olduğu anlamına gelmez. Değişken GÜG işçilik saatine göre yüklendiğinden
      fazla çalışılan 100 saat hem işçilik hem GÜG verimlilik sapmasını olumsuz etkiler.'
    celdiriciler:
      B: 'Doğrudur: fiilî ücret 78.400 / 1.600 = 49 TL; (49 − 50) × 1.600 = 1.600 TL olumlu.'
      C: 'Doğrudur: standart saat 500 × 3 = 1.500; (1.600 − 1.500) × 50 = 5.000 TL olumsuz.'
      D: 'Doğrudur: (1.600 − 1.500) × 20 = 2.000 TL olumsuz.'
      E: 'Doğrudur: işçilik 78.400 − 75.000 = 3.400 TL, değişken GÜG 33.600 − 30.000 = 3.600 TL; toplam 7.000 TL olumsuz.'
