    dogru_neden: 'Mart tahsilatı üç kaynaktan oluşur: mart peşin satışları 250.000 × %40 = 100.000 TL; şubat vadeli satışlarının
      %70''i 300.000 × %60 × %70 = 126.000 TL; ocak vadeli satışlarının %30''u 200.000 × %60 × %30 = 36.000 TL. Toplam 262.000
      TL.'
    celdiriciler:
      A: 'Mart ayının peşin satışları tahsilata eklenmemiştir: 126.000 + 36.000.'
      B: 'Ocak vadeli satışlarından mart ayında tahsil edilecek %30''luk kısım unutulmuştur: 100.000 + 126.000.'
      C: 'Tahsilat oranları yer değiştirmiş; şubat satışlarına %30, ocak satışlarına %70 uygulanmıştır: 100.000 + 54.000 +
        84.000.'
      D: 'Gecikme ayları kaydırılmış; mart vadeli satışlarına %70, şubat vadeli satışlarına %30 uygulanmıştır: 100.000 + 105.000
        + 54.000.'
