  kok: 'Bir işletmenin dönem verileri şöyledir: birim satış fiyatı 80 TL; birim değişken üretim maliyeti 30 TL; birim değişken
    satış gideri 5 TL; sabit üretim genel gideri 360.000 TL (bütçe ve fiilî tutar aynıdır); sabit pazarlama ve yönetim giderleri
    100.000 TL. Sabit üretim genel gideri 18.000 birimlik normal kapasiteye göre birimlere yüklenmekte, hacim farkı dönem
    sonunda satılan mamul maliyetine aktarılmaktadır. Dönem başı stok yoktur; dönemde 20.000 birim üretilmiş ve 19.000 birim
    satılmıştır. Tam maliyetlemeye göre faaliyet kârı kaç TL''dir?'
  secenekler:
    A: 335.000 TL
    B: 375.000 TL
    C: 395.000 TL
    D: 413.000 TL
    E: 415.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'Oran 360.000 / 18.000 = 20 TL; birim tam maliyet 50 TL. Üretim normal kapasiteyi aştığından (20.000 − 18.000)
      × 20 = 40.000 TL fazla yükleme (olumlu hacim farkı) vardır ve satılan mamul maliyetinden düşülür. Satışlar 19.000 ×
      80 = 1.520.000 TL; SMM = 19.000 × 50 − 40.000 = 910.000 TL; brüt kâr 610.000 TL; değişken satış gideri 19.000 × 5 =
      95.000 TL ve sabit pazarlama-yönetim gideri 100.000 TL düşülünce faaliyet kârı 415.000 TL. Kontrol: değişken maliyetleme
      kârı 19.000 × 45 − 460.000 = 395.000 TL; fark 1.000 birim stok × 20 = 20.000 TL. Püf noktaları: Normal kapasitenin üstünde
      üretim olumlu hacim farkı doğurur; bu tutar SMM''ye eklenmez, SMM''den düşülür. Değişken satış gideri birim maliyete
      girmez; dönem gideri olarak satış miktarıyla düşülür.'
    celdiriciler:
      A: 'Olumlu hacim farkı satılan mamul maliyetine eklenmiştir: 1.520.000 − 990.000 − 195.000.'
      B: 'Hacim farkı dikkate alınmamıştır: 1.520.000 − 950.000 − 195.000.'
      C: Değişken maliyetleme kârıdır; sabit üretim genel giderinin tamamı dönem gideri yazılmıştır.
      D: 'Oran normal kapasite yerine fiilî üretime göre hesaplanmıştır (360.000 / 20.000 = 18 TL): 1.520.000 − 19.000 × 48
        − 195.000.'
    hesap_adimlari:
    - Oran = 360.000 / 18.000 = 20 TL
