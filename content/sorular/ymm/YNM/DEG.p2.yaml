- id: YMM-YNM-DEG-0045
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: değişken ve tam maliyetle kâr farkı
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmenin dönem başında 1.000 birim mamul stoku vardır; bu stokun birim maliyetine önceki dönemde 8 TL sabit üretim
    genel gideri yüklenmiştir. Cari dönemde 10.000 birim üretilmiş, 9.500 birim satılmıştır. Cari dönemin sabit üretim genel
    gideri 120.000 TL'dir ve tam maliyetlemede fiilî üretim miktarına bölünerek birimlere yüklenmektedir. Stok çıkışlarında
    FIFO yöntemi uygulanmaktadır. Tam maliyetlemeye göre hesaplanan faaliyet kârı, değişken maliyetlemeye göre hesaplanan
    faaliyet kârından kaç TL fazladır?
  secenekler:
    A: 4.000 TL
    B: 6.000 TL
    C: 10.000 TL
    D: 12.000 TL
    E: 18.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'İki yöntem arasındaki kâr farkı = dönem sonu stoktaki sabit GÜG − dönem başı stoktaki sabit GÜG. Cari oran
      120.000 / 10.000 = 12 TL. Dönem sonu stok 1.000 + 10.000 − 9.500 = 1.500 birimdir; FIFO''da önce dönem başı stok satıldığından
      bu birimlerin tamamı cari üretimdendir: 1.500 × 12 = 18.000 TL. Dönem başı stoktaki sabit GÜG 1.000 × 8 = 8.000 TL''dir
      ve bu dönemde gidere dönüşür. Fark 18.000 − 8.000 = 10.000 TL; tam maliyetleme kârı daha yüksektir. Püf noktaları: Birim
      sabit GÜG dönemden döneme değiştiğinde ''stok artışı × birim sabit gider'' kısa yolu çalışmaz; dönem sonu ve dönem başı
      stoklardaki sabit gideri ayrı ayrı bulun. FIFO, dönem sonu stokun hangi dönemin oranını taşıdığını belirler.'
    celdiriciler:
      A: Stok artışı (500 birim) önceki dönemin 8 TL'lik oranıyla çarpılmıştır.
      B: Stok artışı (500 birim) cari oranla çarpılmış; dönem başı stokun farklı oran taşıdığı göz ardı edilmiştir.
      D: Dönem sonu stok (1.500 birim) önceki dönemin 8 TL'lik oranıyla değerlenmiş, dönem başı stoktaki sabit gider düşülmemiştir.
      E: Yalnız dönem sonu stoktaki sabit gider alınmış, dönem başı stoktan gidere dönüşen 8.000 TL düşülmemiştir.
    hesap_adimlari:
    - Cari oran = 120.000 / 10.000 = 12 TL
    - Dönem sonu stok = 1.500 birim; sabit GÜG = 18.000 TL
    - Dönem başı stoktaki sabit GÜG = 8.000 TL
    - Fark = 18.000 − 8.000 = 10.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oran = 120000 / 10000

      son = (1000 + 10000 - 9500) * oran

      bas = 1000 * 8

      sonuc = son - bas'
