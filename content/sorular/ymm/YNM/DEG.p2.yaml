- id: YMM-YNM-DEG-0048
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: normal kapasite
  tip: kavrama
  zorluk: 3
  kok: Bir işletme, tam maliyetlemede sabit üretim genel giderlerinin birimlere yüklenmesinde kullanacağı payda (kapasite)
    düzeyini seçmektedir. Hacim farkının tamamı dönem sonunda satılan mamul maliyetine aktarılmaktadır. Payda düzeyi seçimine
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Hacim farkı satılan mamul maliyetine aktarıldığından, seçilen payda düzeyi stokların arttığı bir dönemde de tam maliyetleme
      kârını etkilemez.
    B: Pratik kapasitenin payda olarak seçilmesi, normal kapasiteye göre daha düşük bir birim sabit GÜG oranı ve genellikle
      olumsuz hacim farkı doğurur.
    C: Talebin düştüğü dönemlerde beklenen fiilî kullanımın payda seçilmesi birim maliyeti yükseltir; maliyete dayalı fiyatlamada
      bu, talebi daha da düşürebilir.
    D: Teorik kapasite kaçınılmaz duruşları ve bakım sürelerini dikkate almadığından, bu payda ile çalışan işletmede olumsuz
      hacim farkı neredeyse kaçınılmazdır.
    E: Fiilî sabit gider bütçeye eşitse, payda düzeyi ne olursa olsun üretime yüklenen sabit GÜG ile hacim farkının toplamı
      bütçelenen sabit GÜG'e eşittir.
