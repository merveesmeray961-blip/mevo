  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: stok değişiminin kâra etkisi
  tip: uygulama
  zorluk: 3
  kok: 'Yeni kurulan bir işletmede fiilî maliyetleme uygulanmakta, sabit üretim genel gideri her dönem o dönemin fiilî üretim
    miktarına bölünerek birimlere yüklenmekte ve stok çıkışlarında FIFO yöntemi kullanılmaktadır. Sabit üretim genel gideri
    her iki dönemde de 200.000 TL''dir. 1. dönemde 10.000 birim üretilmiş ve 8.000 birim satılmış; 2. dönemde 8.000 birim
    üretilmiş ve 10.000 birim satılmıştır. Birim satış fiyatı ve birim değişken maliyetler iki dönemde aynıdır.


    I. 1. dönemde tam maliyetlemeye göre kâr, değişken maliyetlemeye göre kârdan 40.000 TL fazladır.

    II. 2. dönemde tam maliyetlemeye göre kâr, değişken maliyetlemeye göre kârdan 50.000 TL azdır.

    III. İki dönemin toplam kârı her iki yöntemde aynıdır.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: '1. dönem oranı 200.000 / 10.000 = 20 TL; dönem sonu stok 2.000 birim × 20 = 40.000 TL sabit gider ertelenir;
      tam maliyetleme kârı 40.000 TL fazladır (I doğru). 2. dönemde oran 200.000 / 8.000 = 25 TL olsa da dönem sonunda stok
      kalmaz; FIFO ile önce satılan 2.000 birim, 20 TL''lik oranı taşıyan dönem başı stoktur. Gidere dönüşen ertelenmiş tutar
      40.000 TL''dir; tam maliyetleme kârı 40.000 TL azdır (II yanlış). Yeni kurulan işletmede ikinci dönem sonunda stok sıfır
      olduğundan iki dönemde gidere giden toplam sabit GÜG her iki yöntemde 400.000 TL''dir; toplam kârlar eşittir (III doğru).
      Püf noktaları: Stok azalışında farkı bulmak için dönem başı stokun taşıdığı oranı kullanın, cari dönemin oranını değil.
      Başta ve sonda stok yoksa çok dönemli toplam kâr yöntemden etkilenmez.'
    celdiriciler:
      A: 'III. ifade de doğrudur: başlangıçta ve 2. dönem sonunda stok olmadığından toplam kârlar eşittir.'
      B: 'I. ifade de doğrudur: 1. dönemde 2.000 × 20 = 40.000 TL sabit gider stokta kalır.'
      C: 'II. ifade yanlıştır: 2.000 birim stok 2. dönemin 25 TL''lik oranıyla değil, 1. dönemin 20 TL''lik oranıyla gidere
        dönüşür; fark 40.000 TL''dir.'
      E: II. ifade 2. dönemin oranını kullandığı için yanlıştır; doğru olan I. ifade dışarıda bırakılmıştır.
    hesap_adimlari:
    - 1. dönem oranı = 20 TL; fark = 2.000 × 20 = +40.000 TL
    - '2. dönem: dönem başı stok 40.000 TL gidere dönüşür; fark = −40.000 TL'
    - Toplam fark = 0
