- id: YMM-YNM-DEG-0044
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: normal kapasite
  tip: hesaplama
  zorluk: 2
  kok: Bir işletmede birim satış fiyatı 60 TL, birim değişken üretim maliyeti 25 TL'dir. Yıllık sabit üretim genel gideri
    300.000 TL olup (bütçe ve fiilî tutar aynıdır) 15.000 birimlik normal kapasiteye göre birimlere yüklenmektedir. Dönemde
    12.000 birim üretilmiş, 11.000 birim satılmıştır; dönem başı stok yoktur. Hacim (kapasite) farkı dönem sonunda satılan
    mamul maliyetine aktarılmaktadır. Tam maliyetlemeye göre brüt satış kârı kaç TL'dir?
  secenekler:
    A: 85.000 TL
    B: 105.000 TL
    C: 110.000 TL
    D: 165.000 TL
    E: 225.000 TL
  dogru: B
  aciklama:
    dogru_neden: Birim sabit GÜG oranı 300.000 / 15.000 = 20 TL; birim tam maliyet 25 + 20 = 45 TL. Üretime yüklenen sabit
      GÜG 12.000 × 20 = 240.000 TL olduğundan 60.000 TL eksik yükleme (olumsuz hacim farkı) vardır ve satılan mamul maliyetine
      eklenir. Satılan mamul maliyeti 11.000 × 45 + 60.000 = 555.000 TL; satışlar 11.000 × 60 = 660.000 TL; brüt satış kârı
      105.000 TL.
    celdiriciler:
      A: 'Sabit üretim genel giderinin tamamı dönem gideri sayılmıştır (değişken maliyetleme mantığı): 11.000 × 35 − 300.000.'
      C: 'Oran fiilî üretime göre hesaplanmıştır (300.000 / 12.000 = 25 TL); normal kapasite esası uygulanmamıştır: 11.000
        × (60 − 50).'
      D: 'Olumsuz hacim farkı satılan mamul maliyetine eklenmemiştir: 11.000 × (60 − 45).'
      E: 'Olumsuz hacim farkı satılan mamul maliyetinden düşülmüştür: 165.000 + 60.000.'
    hesap_adimlari:
    - Oran = 300.000 / 15.000 = 20 TL
    - Hacim farkı = (15.000 − 12.000) × 20 = 60.000 TL olumsuz
    - SMM = 11.000 × 45 + 60.000 = 555.000 TL
    - Brüt kâr = 660.000 − 555.000 = 105.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oran = 300000 / 15000

      hacim = (15000 - 12000) * oran

      smm = 11000 * (25 + oran) + hacim

      sonuc = 11000 * 60 - smm'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-2
