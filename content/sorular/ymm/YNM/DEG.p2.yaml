- id: YMM-YNM-DEG-0046
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: normal kapasite
  tip: hesaplama
  zorluk: 3
  kok: Bir işletmede sabit üretim genel giderleri 375.000 TL'lik bütçe ve 25.000 birimlik normal kapasiteye göre birimlere
    yüklenmekte; hacim (kapasite) farkı dönem sonunda gider olarak kapatılmaktadır. Fiilî sabit üretim genel gideri bütçeye
    eşittir. Dönem başı mamul stoku 2.000 birimdir ve aynı birim sabit GÜG oranıyla değerlenmiştir. Dönemde 20.000 birim satılmış;
    tam maliyetlemeye göre faaliyet kârı 260.000 TL, değişken maliyetlemeye göre faaliyet kârı 200.000 TL olarak hesaplanmıştır.
    Bu döneme ilişkin hacim farkı kaç TL olumsuzdur?
  secenekler:
    A: 15.000 TL
    B: 45.000 TL
    C: 60.000 TL
    D: 75.000 TL
    E: 135.000 TL
  dogru: A
  aciklama:
    dogru_neden: 'Birim sabit GÜG oranı 375.000 / 25.000 = 15 TL. Kâr farkı = 15 × (dönem sonu stok − dönem başı stok) olduğundan
      stok artışı 60.000 / 15 = 4.000 birimdir; tam maliyetleme kârı yüksek olduğu için stok artmıştır. Üretim = satış + stok
      artışı = 20.000 + 4.000 = 24.000 birim. Hacim farkı = (25.000 − 24.000) × 15 = 15.000 TL olumsuz. Püf noktaları: Önce
      kâr farkından geri giderek stok değişimini, sonra üretimi bulun. Dönem başı stok miktarı stok değişimini bulmada gerekmez;
      aynı oranla değerlendiği için yalnız farkın bu oranla açıklanabildiğini gösterir. Hacim farkı satış miktarıyla değil
      üretim miktarıyla hesaplanır.'
    celdiriciler:
      B: 'Üretim, satışa stok artışı eklenip dönem başı stok düşülerek 22.000 birim bulunmuştur: (25.000 − 22.000) × 15.'
      C: İki yöntem arasındaki kâr farkı hacim farkı sanılmıştır.
      D: 'Hacim farkı üretim yerine satış miktarıyla hesaplanmıştır: (25.000 − 20.000) × 15.'
      E: 'Kâr farkının yönü ters yorumlanmış, stokların 4.000 birim azaldığı varsayılarak üretim 16.000 birim bulunmuştur:
        (25.000 − 16.000) × 15.'
    hesap_adimlari:
    - Oran = 375.000 / 25.000 = 15 TL
    - Stok artışı = (260.000 − 200.000) / 15 = 4.000 birim
    - Üretim = 20.000 + 4.000 = 24.000 birim
    - Hacim farkı = (25.000 − 24.000) × 15 = 15.000 TL olumsuz
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'oran = 375000 / 25000

      artis = (260000 - 200000) / oran

      uretim = 20000 + artis

      sonuc = (25000 - uretim) * oran'
