- id: YMM-YNM-DEG-0043
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: stok değişiminin kâra etkisi
  tip: uygulama
  zorluk: 2
  kok: 'Bir işletmede dönem başı mamul stoku yoktur. Dönem satışları 10.000 birim, yıllık sabit üretim genel gideri 240.000
    TL''dir. Fiilî maliyetleme uygulanmakta, sabit üretim genel gideri fiilî üretim miktarına bölünerek birimlere yüklenmektedir.
    Yönetim, satış miktarı değişmeden üretimi 10.000 birimden 12.000 birime çıkarmayı değerlendirmektedir. Birim satış fiyatı
    ve birim değişken maliyetler değişmeyecek, stok tutma maliyeti dikkate alınmayacaktır.


    I. Üretim artışı, tam maliyetlemeye göre faaliyet kârını 40.000 TL artırır.

    II. Üretim artışı, değişken maliyetlemeye göre faaliyet kârını değiştirmez.

    III. 12.000 birim üretilirse dönem sonu stokunun tam maliyetle değeri, değişken maliyetle değerinden 48.000 TL fazla olur.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve II
    E: I ve III
  dogru: D
  aciklama:
    dogru_neden: 10.000 birim üretimde birim sabit GÜG 24 TL'dir ve stok oluşmadığından 240.000 TL'nin tamamı gider olur.
      12.000 birim üretimde birim sabit GÜG 240.000 / 12.000 = 20 TL'ye iner; 2.000 birimlik dönem sonu stokunda 2.000 × 20
      = 40.000 TL sabit gider ertelenir. Satılan mamul maliyetine giren sabit gider 200.000 TL'ye düşer; tam maliyetleme kârı
      40.000 TL artar (I doğru). Değişken maliyetlemede sabit GÜG'ün tamamı dönem gideridir; satışlar değişmediğinden kâr
      değişmez (II doğru). Stoklar arasındaki fark 40.000 TL'dir (III yanlış).
    celdiriciler:
      A: 'II. ifade de doğrudur: değişken maliyetlemede kâr satış miktarına bağlıdır; üretim artışı kârı etkilemez.'
      B: 'I. ifade de doğrudur: stokta kalan 2.000 birimle 40.000 TL sabit gider sonraki döneme ertelenir.'
      C: 'III. ifade yanlıştır: birim sabit GÜG 12.000 birimlik üretimde 20 TL olur; fark 2.000 × 20 = 40.000 TL''dir. 48.000
        TL, eski 24 TL''lik oranla bulunur.'
      E: III. ifade 10.000 birimlik üretimin 24 TL'lik oranını kullanmaktadır ve yanlıştır; doğru olan II. ifade dışarıda
        bırakılmıştır.
    hesap_adimlari:
    - Yeni birim sabit GÜG = 240.000 / 12.000 = 20 TL
    - Ertelenen sabit gider = 2.000 × 20 = 40.000 TL
