      saate yüklenen tutar 360.000 TL'dir. Yüklenmeyen tutar 450.000 - 360.000 = 90.000 TL'dir.
    celdiriciler:
      A: Yüklenen tutar ile toplam sabit gider arasındaki farkın yanlış oranla hesaplanmasına dayanır.
      B: Normal kapasite ile fiilî standart saatin farkının hatalı birim giderle çarpılmasına dayanır.
      D: Fiilî standart saatin 23.000 saat kabul edilmesiyle oluşan sonucu temsil eder.
      E: Fiilî standart saatin 22.000 saat kabul edilmesiyle oluşan sonucu temsil eder.
