  kok: Bir işletmede dönem başı mamul stoku 900 birim, dönem üretimi 3.600 birim ve dönem satışı 3.200 birimdir. Birim sabit
    üretim genel gideri 18 TL'dir. Diğer tüm koşullar aynı olduğuna göre tam maliyetleme kârı ile değişken maliyetleme kârı
    arasındaki farkın tutarı ______ TL'dir.
  secenekler:
    A: 5.400 TL
    B: 6.300 TL
    C: 7.200 TL
    D: 8.100 TL
    E: 9.000 TL
  dogru: C
  aciklama:
    dogru_neden: Dönem sonu stok 900 + 3.600 - 3.200 = 1.300 birimdir. Stok 400 birim arttığından tam maliyetleme kârı, değişken
      maliyetleme kârından 400 × 18 = 7.200 TL daha yüksektir.
    celdiriciler:
      A: Stok değişiminin 300 birim alınmasıyla oluşan hesaplama hatasını yansıtır.
      B: Dönem sonu stok artışının 350 birim kabul edilmesine dayanır.
      D: Dönem sonu stok artışının 450 birim kabul edilmesine dayanır.
      E: Dönem sonu stok artışının 500 birim kabul edilmesine dayanır.
    hesap_adimlari:
    - Dönem sonu stok = 900 + 3.600 - 3.200 = 1.300 birim.
    - Stok artışı = 1.300 - 900 = 400 birim.
    - Kâr farkı = 400 × 18 = 7.200 TL.
