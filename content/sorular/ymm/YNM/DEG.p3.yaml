- id: YMM-YNM-DEG-0056
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Değişken ve tam maliyetleme
  konu: DEG
  kazanim: normal kapasite
  tip: uygulama
  zorluk: 2
  kok: 'Bir işletme tam maliyetlemede sabit üretim genel giderlerini normal kapasiteye göre mamullere yüklemektedir. Normal
    kapasite 20.000 makine saati, dönem fiilî üretiminin gerektirdiği standart makine saati 16.000 ve dönem sabit üretim genel
    gideri 320.000 TL''dir. Normal kapasite yaklaşımına ilişkin aşağıdaki önermeler verilmiştir.


    I. Normal kapasiteye göre birim sabit üretim genel gideri 16 TL''dir.

    II. Fiilî üretimin standart makine saatleri 16.000 olduğundan ürünlere yüklenen sabit üretim genel gideri 256.000 TL''dir.

    III. 64.000 TL''lik fark, kapasite kullanımının normal kapasitenin altında kalmasıyla ilişkilidir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: E
  aciklama:
    dogru_neden: Normal kapasiteye göre birim sabit üretim genel gideri 320.000 / 20.000 = 16 TL'dir. 16.000 standart makine
      saatine 16 TL yüklenerek 256.000 TL bulunur. 320.000 - 256.000 = 64.000 TL'lik fark normal kapasitenin altında kapasite
      kullanımından kaynaklanır.
    celdiriciler:
      A: II. ve III. önermelerdeki doğru hesaplamaları dışarıda bırakır.
      B: Normal kapasite ile fiilî standart saat arasındaki farkın etkisini eksik değerlendirir.
      C: Ürünlere yüklenen tutarın hesaplanmasına ilişkin II. önermeyi dışarıda bırakır.
      D: Normal kapasiteye göre birim sabit gider oranının hesaplanmasını dışarıda bırakır.
    hesap_adimlari:
    - Birim sabit üretim genel gideri = 320.000 / 20.000 = 16 TL/makine saati.
    - Yüklenen sabit üretim genel gideri = 16.000 × 16 = 256.000 TL.
    - Kapasite farkı = 320.000 - 256.000 = 64.000 TL.
  kaynaklar:
  - mevzuat: Genel bilgi — Değişken ve tam maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'sabit = 320000

      normal = 20000

      standart = 16000

      birim = sabit / normal

      yuklenen = standart * birim

      fark = sabit - yuklenen

      sonuc = {''birim_sabit_gider'': birim, ''yuklenen_sabit_gider'': yuklenen, ''kapasite_farki'': fark}'
  durum: taslak
  surum: 1
