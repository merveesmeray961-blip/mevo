  kok: Bir elektronik cihaz üreticisi, tahmini pazar ömrü 4 yıl olan yeni bir ürün için yaşam boyu maliyetleme uygulamaktadır.
    Yapılan analizde, ürünün yaşam boyu maliyetlerinin yaklaşık %80'inin tasarım aşamasında verilen kararlarla belirleneceği
