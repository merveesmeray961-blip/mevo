- id: YMM-YNM-FDM-0051
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: hedef maliyetleme
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme yeni ürününü, benzer rakip ürünün 500 TL olan satış fiyatının %10 altında bir fiyatla pazara sunmayı planlamaktadır.
    Hedef kâr, işletmenin belirleyeceği satış fiyatının %20'sidir. Ürünün birim maliyetine üretim maliyeti dışında, işletmenin
    satış fiyatının %5'i oranında satış komisyonu ve birim başına 37,50 TL dağıtım gideri girecektir. Mühendislik tahminine
    göre mevcut tasarımla birim üretim maliyeti 330 TL'dir. Hedef maliyete ulaşılması için birim üretim maliyetinin kaç TL
    azaltılması gerekir?
  secenekler:
    A: 15,00 TL
    B: 30,00 TL
    C: 32,50 TL
    D: 40,00 TL
    E: 42,50 TL
  dogru: B
  aciklama:
    dogru_neden: 'Hedef fiyat = 500 × 0,90 = 450 TL. Hedef kâr = 450 × 0,20 = 90 TL; hedef toplam birim maliyet = 450 − 90
      = 360 TL. Üretim dışı birim maliyetler: komisyon 450 × 0,05 = 22,50 TL + dağıtım 37,50 TL = 60 TL. İzin verilen birim
      üretim maliyeti = 360 − 60 = 300 TL. Gerekli azaltma = 330 − 300 = 30 TL. Püf noktaları: Hedef maliyetlemede hesap pazar
      fiyatından başlar, ancak kâr ve komisyon oranları işletmenin kendi hedef fiyatına (450 TL) uygulanır, rakibin fiyatına
      değil. Hedef maliyet tam (toplam) maliyettir; komisyon ve dağıtım düşülmeden üretim maliyetiyle kıyaslanmaz.'
    celdiriciler:
      A: 'Hedef kâr satış fiyatı yerine maliyet üzerinden %20 alınmıştır: 450 / 1,20 = 375; 375 − 60 = 315; 330 − 315 = 15
        TL.'
      C: 'Komisyon rakip fiyatı (500 TL) üzerinden hesaplanmıştır: 360 − 25 − 37,50 = 297,50; 330 − 297,50 = 32,50 TL.'
      D: 'Hedef kâr rakip fiyatı üzerinden hesaplanmıştır: 450 − 100 − 22,50 − 37,50 = 290; 330 − 290 = 40 TL.'
      E: 'Kâr ve komisyon oranlarının ikisi de rakip fiyatına uygulanmıştır: 450 − 100 − 25 − 37,50 = 287,50; 330 − 287,50
        = 42,50 TL.'
    hesap_adimlari:
    - Hedef fiyat = 500 × 0,90 = 450 TL
    - Hedef kâr = 450 × 0,20 = 90 TL
    - Hedef toplam maliyet = 360 TL
    - Üretim dışı maliyet = 22,50 + 37,50 = 60 TL
    - İzin verilen üretim maliyeti = 300 TL
    - Gerekli azaltma = 330 − 300 = 30 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Faaliyete dayalı ve stratejik maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fiyat = 500 * 0.9

      hedef_maliyet = fiyat - fiyat * 0.2

      izin = hedef_maliyet - fiyat * 0.05 - 37.5

