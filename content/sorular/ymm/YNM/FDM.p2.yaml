    - Müşteri maliyetleri = 12.000 + 10.000 + 5.000 + 8.000 + 9.000 = 44.000 TL
    - Net satış = 200.000 TL; brüt kâr = 60.000 TL
    - Müşteri düzeyi kâr = 60.000 − 44.000 = 16.000 TL
