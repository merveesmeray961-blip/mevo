  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: faaliyete dayalı maliyetleme
  tip: hesaplama
  zorluk: 3
  kok: 'Bir toptancı işletme müşteri kârlılığını FDM ile ölçmektedir. Faaliyet maliyet havuzları ve dönemdeki toplam etken
    hacimleri şöyledir: sipariş işleme 360.000 TL / 1.200 sipariş; normal teslimat 400.000 TL / 2.000 teslimat; acil teslimat
    (normal teslimata ek olarak yapılan ayrı sevkiyat) 50.000 TL / 100 acil teslimat; satış ziyareti 160.000 TL / 400 ziyaret;
    iade işleme 60.000 TL / 100 iade. K müşterisine ilişkin dönem verileri: liste fiyatıyla satışlar 220.000 TL, müşteriye
    tanınan fiyat indirimi 20.000 TL, satılan malın maliyeti 140.000 TL; 40 sipariş, 50 normal teslimat, 10 acil teslimat,
    20 satış ziyareti ve 15 iade. İşletme ayrıca genel yönetim giderlerini net satışların %5''i oranında müşterilere dağıtmaktadır.
    K müşterisinin, müşteriyle neden-sonuç ilişkisi kurulabilen maliyetler dikkate alınarak hesaplanan müşteri düzeyi faaliyet
    kârı kaç TL''dir?'
  secenekler:
    A: 6.000 TL
    B: 16.000 TL
    C: 21.000 TL
    D: 36.000 TL
    E: 60.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Faaliyet oranları: sipariş 300 TL, normal teslimat 200 TL, acil teslimat 500 TL, ziyaret 400 TL, iade 600
      TL. K''nin müşteri düzeyi maliyetleri: 40 × 300 + 50 × 200 + 10 × 500 + 20 × 400 + 15 × 600 = 12.000 + 10.000 + 5.000
      + 8.000 + 9.000 = 44.000 TL. Net satış 220.000 − 20.000 = 200.000 TL; brüt kâr 200.000 − 140.000 = 60.000 TL; müşteri
      düzeyi faaliyet kârı 60.000 − 44.000 = 16.000 TL. Genel yönetim giderleri işletme düzeyinde (tesisi sürdürme) maliyetlerdir;
      müşteriyle neden-sonuç ilişkisi olmadığından müşteri düzeyi kâra yüklenmez. Püf noktaları: Fiyat indirimi müşteriye
      özgü bir gelir azalışıdır ve net satışa ulaşmak için düşülür. Yüzdeyle dağıtılan genel yönetim payı bir faaliyet etkenine
      dayanmaz; müşteri düzeyi kârı hesaplarken dışarıda bırakılır.'
    celdiriciler:
      A: Neden-sonuç ilişkisi olmayan genel yönetim payı (200.000 × %5 = 10.000 TL) da düşülmüştür.
      C: Acil teslimatlar ayrı bir faaliyet olarak maliyetlendirilmemiş, 5.000 TL'lik acil teslimat maliyeti atlanmıştır.
      D: 'Fiyat indirimi düşülmemiş, liste fiyatıyla satış hasılat sayılmıştır: 220.000 − 140.000 − 44.000.'
      E: Yalnız brüt kâr alınmış, müşteri düzeyi faaliyet maliyetleri düşülmemiştir.
    hesap_adimlari:
