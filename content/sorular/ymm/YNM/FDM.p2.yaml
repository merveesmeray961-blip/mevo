- id: YMM-YNM-FDM-0052
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: faaliyete dayalı maliyetleme
  tip: uygulama
  zorluk: 3
  kok: 'Bir işletme müşteri destek faaliyetinin maliyetini FDM ile ürünlere yüklemekte ve faaliyet maliyet oranını faaliyetin
    pratik kapasitesi üzerinden belirlemektedir. Faaliyetin dönem maliyeti 240.000 TL, pratik kapasitesi 4.000 çağrıdır. Dönemde
    fiilen 3.200 çağrı karşılanmış; bunların 1.200''ü A ürününe, 2.000''i B ürününe ilişkindir.


    I. A ürününe 72.000 TL müşteri destek maliyeti yüklenir.

    II. B ürününe 168.000 TL müşteri destek maliyeti yüklenir.

    III. Oran fiilî çağrı sayısı üzerinden belirlenseydi A ürününe 18.000 TL daha fazla maliyet yüklenirdi.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Pratik kapasiteye dayalı oran = 240.000 / 4.000 = 60 TL/çağrı. A''ya 1.200 × 60 = 72.000 TL (I doğru), B''ye
      2.000 × 60 = 120.000 TL yüklenir; kalan 800 × 60 = 48.000 TL kullanılmayan kapasite maliyetidir ve ürünlere yüklenmeyip
      dönem gideri olarak ayrıca raporlanır (II yanlış). Fiilî kullanıma dayalı oran 240.000 / 3.200 = 75 TL olurdu; A''ya
      1.200 × 75 = 90.000 TL, yani 18.000 TL fazla yüklenirdi (III doğru). Püf noktaları: Pratik kapasite esasında kullanılmayan
      kapasitenin maliyeti ürünlere dağıtılmaz; B''nin payını 240.000 − 72.000 diye kalan tutardan bulmak bu nedenle hatalıdır.
      Fiilî kullanım esası, boş kapasitenin maliyetini ürünlere yükleyerek birim maliyetleri şişirir.'
    celdiriciler:
      A: 'III. ifade de doğrudur: fiilî kullanıma göre oran 75 TL olur ve A''ya (75 − 60) × 1.200 = 18.000 TL fazla maliyet
        yüklenir.'
      B: 'II. ifade yanlıştır: B''ye 120.000 TL yüklenir; 48.000 TL kullanılmayan kapasite maliyeti ürünlere dağıtılmaz. I.
        ifade ise doğrudur.'
      C: II. ifade kalan tutarın tamamını B'ye yüklemektedir; kullanılmayan kapasite maliyeti ürün maliyetine girmez. Doğru
        olan III. ifade dışarıda kalmıştır.
      E: II. ifade yanlış olduğu gibi doğru olan I. ifade de dışarıda bırakılmıştır.
    hesap_adimlari:
    - Oran = 240.000 / 4.000 = 60 TL
    - A = 1.200 × 60 = 72.000 TL; B = 2.000 × 60 = 120.000 TL
    - Kullanılmayan kapasite = 800 × 60 = 48.000 TL
    - Fiilî esasta oran 75 TL; A = 90.000 TL; fark 18.000 TL
