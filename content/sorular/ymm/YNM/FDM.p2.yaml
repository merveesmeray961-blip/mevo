        ürünle ilişkilendirir ve kârlılığı bu toplam üzerinden ölçer.'
      B: 'Doğrudur: finansal raporlama dönemseldir; ilk yıllarda yoğunlaşan araştırma ve tasarım giderleri ürünü ilk yıllarda
        zararlı, sonraki yıllarda olduğundan kârlı gösterebilir.'
      C: 'Doğrudur: taahhüt edilen (kilitlenen) maliyet ile katlanılan maliyet arasındaki fark, maliyet yönetimi fırsatlarının
