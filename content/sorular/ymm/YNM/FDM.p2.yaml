- id: YMM-YNM-FDM-0049
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: yaşam boyu maliyetleme
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletme, 3 yıllık pazar ömrü boyunca toplam 10.000 birim satmayı planladığı yeni bir ürün geliştirmektedir. Rakip
    ürünlerin fiyatları dikkate alınarak birim satış fiyatı 200 TL olarak belirlenmiştir. İşletme, ürünün yaşam boyu satış
    hasılatının %25''i oranında kâr elde etmeyi hedeflemektedir. Ürünün yaşam boyu maliyet tahminleri şöyledir: araştırma-geliştirme
    ve tasarım 200.000 TL; satış sonrası müşteri hizmetleri birim başına 6 TL; ürünün piyasadan çekilmesi 90.000 TL. Bu maliyetler
    dışında yalnız üretim maliyeti doğacaktır. Hedef kâra ulaşılabilmesi için izin verilebilecek en yüksek birim üretim maliyeti
    kaç TL''dir?'
  secenekler:
    A: 115 TL
    B: 124 TL
    C: 125 TL
    D: 130 TL
    E: 150 TL
  dogru: A
  aciklama:
    dogru_neden: 'Yaşam boyu hasılat 10.000 × 200 = 2.000.000 TL; hedef kâr %25 × 2.000.000 = 500.000 TL; izin verilen yaşam
      boyu toplam maliyet 1.500.000 TL. Üretim dışı yaşam boyu maliyetler: 200.000 + 10.000 × 6 + 90.000 = 350.000 TL. Üretime
      kalan tutar 1.150.000 TL; birim başına 1.150.000 / 10.000 = 115 TL. Püf noktaları: Hedef maliyet yalnız üretim maliyeti
      değildir; üretimden önce (Ar-Ge, tasarım) ve sonra (müşteri hizmetleri, piyasadan çekilme) katlanılacak maliyetler de
      yaşam boyu hasılattan karşılanmalıdır. Kâr oranının satış hasılatı üzerinden verildiğine dikkat edin; maliyet üzerine
      kâr eklemeyle karıştırmayın.'
    celdiriciler:
      B: 'Piyasadan çekilme maliyeti (90.000 TL) unutulmuştur: (1.500.000 − 200.000 − 60.000) / 10.000 = 124 TL.'
      C: 'Kâr oranı maliyet üzerinden uygulanmıştır: 2.000.000 / 1,25 = 1.600.000; (1.600.000 − 350.000) / 10.000 = 125 TL.'
      D: 'Yalnız üretim öncesi Ar-Ge ve tasarım maliyeti düşülmüş, üretim sonrası maliyetler göz ardı edilmiştir: (1.500.000
        − 200.000) / 10.000 = 130 TL.'
      E: 'Üretim dışı yaşam boyu maliyetler hiç dikkate alınmamıştır: 200 × (1 − 0,25) = 150 TL.'
    hesap_adimlari:
    - Hasılat = 10.000 × 200 = 2.000.000 TL
    - Hedef kâr = 2.000.000 × 0,25 = 500.000 TL
    - İzin verilen toplam maliyet = 1.500.000 TL
    - Üretim dışı maliyetler = 200.000 + 60.000 + 90.000 = 350.000 TL
    - Birim üretim maliyeti = 1.150.000 / 10.000 = 115 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Faaliyete dayalı ve stratejik maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'hasilat = 10000 * 200

      izin = hasilat - hasilat * 0.25

      uretim_disi = 200000 + 10000 * 6 + 90000

      sonuc = (izin - uretim_disi) / 10000'
  durum: kontrolde
