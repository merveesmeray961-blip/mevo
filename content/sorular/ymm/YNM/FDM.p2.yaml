- id: YMM-YNM-FDM-0050
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: kalite maliyetleri
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme yılda 20.000 birim mamul üretip satmaktadır. Mevcut durumda üretilen birimlerin %4'ü işletme içinde kusurlu
    bulunarak birim başına 30 TL maliyetle yeniden işlenmekte, %1,5'i ise kusurlu olarak müşteriye ulaşmaktadır. Müşteriye
    ulaşan her kusurlu birim için 120 TL garanti onarım maliyetine katlanılmakta; ayrıca bu birimler nedeniyle kaybedilen
    gelecek satışlardan birim başına 80 TL katkı payı kaybı oluşmaktadır. İşletme, yıllık 25.000 TL önleme (tedarikçi geliştirme
    ve eğitim) ve 10.000 TL ek muayene maliyeti gerektiren bir kalite programını değerlendirmektedir. Program uygulanırsa
    işletme içinde bulunan kusur oranının %1'e, müşteriye ulaşan kusur oranının %0,5'e düşeceği tahmin edilmektedir. Satış
    miktarı ve diğer maliyetler değişmeyecektir. Program, işletmenin yıllık faaliyet kârını kaç TL artırır?
  secenekler:
    A: 5.000 TL
    B: 7.000 TL
    C: 23.000 TL
    D: 33.000 TL
    E: 58.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'İçsel başarısızlık: kusurlu birim 20.000 × %4 = 800''den 20.000 × %1 = 200''e iner; 600 × 30 = 18.000 TL
      tasarruf. Dışsal başarısızlık: 20.000 × %1,5 = 300''den 20.000 × %0,5 = 100''e iner; birim başına garanti onarımı ve
      katkı payı kaybı 120 + 80 = 200 TL; 200 × 200 = 40.000 TL tasarruf. Toplam tasarruf 58.000 TL; programın önleme ve değerleme
      maliyeti 25.000 + 10.000 = 35.000 TL. Net kâr artışı 58.000 − 35.000 = 23.000 TL. Püf noktaları: Kaybedilen satışların
      katkı payı, kayıtlara girmese de dışsal başarısızlık maliyetidir ve karar analizine katılır. Ek muayene bir değerleme
      (uygunluk) maliyetidir; programın maliyetine önleme harcamasıyla birlikte girer.'
    celdiriciler:
      A: 'İşletme içinde bulunan kusurlardaki azalmanın yeniden işleme tasarrufu (18.000 TL) unutulmuştur: 40.000 − 35.000.'
      B: 'Kaybedilen satışların katkı payı (fırsat maliyeti) analize katılmamıştır: 18.000 + 200 × 120 − 35.000.'
      D: 'Ek muayene maliyeti programın maliyetine eklenmemiş, yalnız önleme harcaması düşülmüştür: 58.000 − 25.000.'
      E: Programın önleme ve değerleme maliyetleri düşülmeden yalnız başarısızlık maliyeti tasarrufu alınmıştır.
    hesap_adimlari:
    - 'İçsel kusur: 800 → 200; tasarruf 600 × 30 = 18.000 TL'
    - 'Dışsal kusur: 300 → 100; tasarruf 200 × (120 + 80) = 40.000 TL'
    - Program maliyeti = 25.000 + 10.000 = 35.000 TL
    - Net etki = 58.000 − 35.000 = 23.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Faaliyete dayalı ve stratejik maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'icsel = (20000 * 4 // 100 - 20000 * 1 // 100) * 30

      dissal = (20000 * 15 // 1000 - 20000 * 5 // 1000) * (120 + 80)

      sonuc = icsel + dissal - (25000 + 10000)'
