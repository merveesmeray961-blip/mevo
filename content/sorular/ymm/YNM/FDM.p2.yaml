- id: YMM-YNM-FDM-0047
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Faaliyete dayalı ve stratejik maliyetleme
  konu: FDM
  kazanim: faaliyete dayalı maliyetleme
  tip: hesaplama
  zorluk: 2
  kok: Faaliyete dayalı maliyetleme (FDM) uygulayan bir işletmede kurulum faaliyetinin yıllık maliyeti 180.000 TL, yıllık
    kurulum sayısı 120'dir; makine çalıştırma faaliyetinin yıllık maliyeti 270.000 TL, toplam makine saati 9.000'dir. M mamulünden
    yılda 6.000 birim üretilmektedir; her birim 0,5 makine saati kullanmakta ve birim başına direkt ilk madde ve direkt işçilik
    maliyeti 40 TL'dir. M şimdiye kadar her partide 200 birim olacak şekilde üretilmiştir; işletme parti büyüklüğünü 300 birime
    çıkarmaya karar vermiştir. Kurulum başına maliyetin, makine saati başına maliyetin ve diğer verilerin değişmeyeceği varsayıldığında,
    yeni durumda M'nin FDM'ye göre birim maliyeti kaç TL olur?
  secenekler:
    A: 45,00 TL
    B: 55,00 TL
    C: 60,00 TL
    D: 62,50 TL
    E: 65,00 TL
  dogru: C
  aciklama:
    dogru_neden: 'Faaliyet oranları: kurulum 180.000 / 120 = 1.500 TL/kurulum; makine 270.000 / 9.000 = 30 TL/makine saati.
      Kurulum maliyeti parti düzeyinde bir maliyettir; birime düşen tutar parti büyüklüğüne bağlıdır. Yeni durumda kurulum
      sayısı 6.000 / 300 = 20, kurulum maliyeti 20 × 1.500 = 30.000 TL, birim başına 5 TL''dir. Makine maliyeti birim düzeyindedir:
      0,5 × 30 = 15 TL. Birim maliyet = 40 + 15 + 5 = 60 TL.'
    celdiriciler:
      A: 'Birim düzeyindeki makine çalıştırma maliyeti (15 TL) unutulmuş, yalnız direkt maliyet ve kurulum payı alınmıştır:
        40 + 5.'
      B: 'Parti düzeyindeki kurulum maliyeti birime yüklenmemiştir: 40 + 15.'
      D: 'Kurulum sayısı eski parti büyüklüğüne göre (6.000 / 200 = 30 kurulum) hesaplanmıştır: 40 + 15 + 7,50.'
      E: 'FDM yerine makine saatine dayalı tek oran kullanılmıştır: 450.000 / 9.000 = 50 TL; 40 + 0,5 × 50 = 65 TL.'
    hesap_adimlari:
    - Kurulum oranı = 180.000 / 120 = 1.500 TL
    - Makine oranı = 270.000 / 9.000 = 30 TL
    - Yeni kurulum sayısı = 6.000 / 300 = 20; birim payı = 20 × 1.500 / 6.000 = 5 TL
    - Makine payı = 0,5 × 30 = 15 TL
    - Birim maliyet = 40 + 15 + 5 = 60 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Faaliyete dayalı ve stratejik maliyetleme
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kurulum_orani = 180000 / 120

      makine_orani = 270000 / 9000

      kurulum_sayisi = 6000 / 300

      sonuc = 40 + 0.5 * makine_orani + kurulum_sayisi * kurulum_orani / 6000'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-2
    kapilar:
      G2:
        sonuc: gecti
