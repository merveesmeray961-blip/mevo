- id: YMM-YNM-KRV-0061
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Karar verme ve ilgili maliyetler
  konu: KRV
  kazanim: özel sipariş
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin yıllık üretim kapasitesi 10.000 birimdir ve normal müşterilere birimi 90 TL''den 9.000 birim satacaktır.
    10.000 birimlik kapasiteye göre birim maliyetler: direkt ilk madde ve malzeme 25 TL, direkt işçilik 15 TL (değişken),
    değişken genel üretim gideri 10 TL, sabit genel üretim gideri 12 TL, değişken satış komisyonu 6 TL, sabit pazarlama gideri
    4 TL. Bir müşteri tek seferlik 2.000 birimlik sipariş vermiştir; sipariş kısmen kabul edilemez. Siparişte komisyon ödenmeyecek,
    birim başına 3 TL özel ambalaj maliyeti ve toplam 8.000 TL tek seferlik kalıp maliyeti oluşacaktır. Kapasite artırılamaz;
    sipariş kabul edilirse eksik kalan kapasite kadar normal satıştan vazgeçilecek ve bu satış başka döneme kaydırılamayacaktır.
    Sabit giderler değişmeyecektir. İşletmenin kârını azaltmadan siparişi kabul edebileceği en düşük birim fiyat kaç TL''dir?'
  secenekler:
    A: 53 TL
    B: 57 TL
    C: 74 TL
    D: 77 TL
    E: 86 TL
  dogru: C
  aciklama:
    dogru_neden: 'Sipariş için ilgili birim değişken maliyet = 25 + 15 + 10 + 3 = 53 TL (komisyon ödenmez; sabit giderler
      değişmez). Boş kapasite 1.000 birim olduğundan 1.000 birim normal satıştan vazgeçilir; kaybedilen katkı payı 1.000 ×
      (90 − 25 − 15 − 10 − 6) = 34.000 TL''dir. Toplam ilgili maliyet = 2.000 × 53 + 8.000 + 34.000 = 148.000 TL; en düşük
      fiyat 148.000 / 2.000 = 74 TL. Püf noktaları: Kapasite yetersizse vazgeçilen satışın hasılatı değil katkı payı fırsat
      maliyetidir; o katkı payını bulurken normal satışta ödenen komisyonu düşmeyi unutmayın. Birim sabit GÜG, kapasiteye
      göre hesaplanmış bir dağıtım olup karara girmez.'
    celdiriciler:
      A: Yalnız siparişin birim değişken maliyeti alınmış; kalıp maliyeti ve vazgeçilen satışların katkı payı göz ardı edilmiştir.
      B: Kalıp maliyeti eklenmiş ama kapasite yetersizliği gözden kaçırılmış, vazgeçilen 1.000 birimin katkı payı hesaba katılmamıştır.
      D: 'Vazgeçilen satışların katkı payı komisyon düşülmeden (90 − 50 = 40 TL) hesaplanmıştır: (106.000 + 8.000 + 40.000)
        / 2.000.'
      E: 'Değişmeyecek olan birim sabit GÜG (12 TL) siparişin maliyetine eklenmiştir: (2.000 × 65 + 8.000 + 34.000) / 2.000.'
    hesap_adimlari:
    - Siparişin birim değişken maliyeti = 25 + 15 + 10 + 3 = 53 TL
    - Vazgeçilen normal satış = 9.000 + 2.000 − 10.000 = 1.000 birim
    - Normal satış birim katkı payı = 90 − 56 = 34 TL → 34.000 TL
    - En düşük fiyat = (106.000 + 8.000 + 34.000) / 2.000 = 74 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'siparis = 2000

      dm = 25 + 15 + 10 + 3

      vazgecilen = 9000 + siparis - 10000

      kayip_kp = vazgecilen * (90 - 25 - 15 - 10 - 6)

      sonuc = (siparis * dm + 8000 + kayip_kp) / siparis'
