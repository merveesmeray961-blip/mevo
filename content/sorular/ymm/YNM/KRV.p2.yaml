- id: YMM-YNM-KRV-0059
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Karar verme ve ilgili maliyetler
  konu: KRV
  kazanim: fark analizi
  tip: hesaplama
  zorluk: 2
  kok: Bir işletme, kalan ömrü 3 yıl olan eski makinesini yenisiyle değiştirmeyi düşünmektedir. Eski makinenin defter değeri
    120.000 TL'dir; bugün satılırsa peşin 30.000 TL elde edilecek, kullanılmaya devam edilirse 3 yıl sonunda hurda değeri
    olmayacaktır. Eski makinenin yıllık işletme gideri 50.000 TL'dir. Yeni makinenin bedeli 150.000 TL, ekonomik ömrü 3 yıl,
    hurda değeri sıfır ve yıllık işletme gideri 15.000 TL'dir. Satış hasılatı ve diğer giderler iki seçenekte aynıdır; paranın
    zaman değeri ve vergi dikkate alınmayacaktır. Makinenin yenilenmesi, 3 yıllık toplam faaliyet kârını nasıl etkiler?
  secenekler:
    A: 5.000 TL azalır
    B: 15.000 TL azalır
    C: 45.000 TL azalır
    D: 105.000 TL artar
    E: 135.000 TL azalır
  dogru: B
  aciklama:
    dogru_neden: 'Eski makinenin defter değeri geçmişte katlanılmış (batık) bir maliyettir; her iki seçenekte de gidere dönüşeceğinden
      karara etkisi yoktur. İlgili kalemler: yeni makine bedeli 150.000 TL (çıkış), eski makinenin satış bedeli 30.000 TL
      (giriş) ve 3 yıllık işletme gideri tasarrufu (50.000 − 15.000) × 3 = 105.000 TL. Net etki = 105.000 + 30.000 − 150.000
      = −15.000 TL; yenileme kârı 15.000 TL azaltır. Tam maliyetle kontrol: devam seçeneğinde 120.000 amortisman + 150.000
      işletme gideri = 270.000 TL; yenilemede 90.000 satış zararı + 150.000 amortisman + 45.000 işletme gideri = 285.000 TL.'
    celdiriciler:
      A: Üç yıllık toplam yerine tek yıla düşen etki (15.000 / 3) verilmiştir.
      C: 'Eski makinenin satışından elde edilecek 30.000 TL dikkate alınmamıştır: 105.000 − 150.000.'
      D: Yalnız işletme gideri tasarrufu hesaplanmış, yeni makine bedeli ve eski makinenin satış bedeli göz ardı edilmiştir.
      E: 'Batık maliyet olan 120.000 TL defter değeri yenileme seçeneğine ek gider olarak yazılmıştır: −15.000 − 120.000.'
    hesap_adimlari:
    - İşletme gideri tasarrufu = (50.000 − 15.000) × 3 = 105.000 TL
    - Eski makine satış bedeli = +30.000 TL
    - Yeni makine bedeli = −150.000 TL
    - Net etki = −15.000 TL (defter değeri ilgisiz)
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'tasarruf = (50000 - 15000) * 3

      etki = tasarruf + 30000 - 150000

      sonuc = abs(etki)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-1
    kapilar:
      G2:
        sonuc: gecti
        tarih: '2026-10-11'
      G4:
        sonuc: bekliyor
      G7:
        sonuc: gecti
        not: yalnız banka içi; külliyat verilmedi
        tarih: '2026-10-11'
      G3:
        sonuc: bekliyor
      G5:
        sonuc: gecti
        tarih: '2026-10-11'
        not: 'kitap düzeyi hakem: uygun, anahtarla aynı (güven 5, seviye 2)'
      G6:
        sonuc: bekliyor
      GZ:
        sonuc: bekliyor
  gecmis:
  - tarih: '2026-10-11'
    kim: uretici
    ne: harici teslim t_YNM-1.yaml, satır 8
  - tarih: '2026-10-11'
    kim: hakem
    ne: 'durum: taslak → kontrolde'
    neden: kitap düzeyi hakem kabulü
- id: YMM-YNM-KRV-0060
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Karar verme ve ilgili maliyetler
  konu: KRV
  kazanim: fark analizi
  tip: hesaplama
  zorluk: 2
  kok: 'Bir ortak üretim sürecinde dönemde 300.000 TL ortak maliyetle K ve M ürünleri elde edilmektedir. Fiziki miktar esasına
    göre K''ye 150.000 TL ortak maliyet dağıtılmıştır (K: 5.000 kg, kg başına 30 TL). K, ayrılma noktasında kg''ı 40 TL''den
    satılabilmektedir. K ileri işlenirse işleme giren her kg için 15 TL değişken işleme maliyeti ve toplam 20.000 TL kaçınılabilir
    sabit gider oluşacak; işlem sırasında girdinin %10''u fire olarak kaybolacak (firenin satış değeri yoktur); işlenmiş ürünün
    kg''ı 70 TL''den satılacaktır. Her iki durumda da tüm miktar satılabilmektedir. K''nin ileri işlenmesi, ayrılma noktasında
    satılmasına göre işletme kârını nasıl etkiler?'
  secenekler:
    A: 5.000 TL artar
    B: 20.000 TL artar
    C: 40.000 TL artar
    D: 55.000 TL artar
    E: 130.000 TL azalır
  dogru: B
  aciklama:
    dogru_neden: Ortak maliyet, K hangi noktada satılırsa satılsın katlanılmış olduğundan ilgisizdir. İleri işlemede satılabilir
      miktar 5.000 × 0,90 = 4.500 kg'dır. Ek hasılat = 4.500 × 70 − 5.000 × 40 = 315.000 − 200.000 = 115.000 TL; ek maliyet
      = 5.000 × 15 + 20.000 = 95.000 TL. Fark = +20.000 TL; ileri işleme kârı 20.000 TL artırır.
    celdiriciler:
      A: Fire olan 500 kg'a düşen ortak maliyet (500 × 30 = 15.000 TL) ayrıca kayıp sayılmıştır; ortak maliyet bu kararda
        ilgisizdir.
      C: 20.000 TL kaçınılabilir sabit gider ek maliyete katılmamıştır.
      D: Fire dikkate alınmamış, 5.000 kg'ın tamamı 70 TL'den satılacakmış gibi hesaplanmıştır.
      E: 'K''ye dağıtılan 150.000 TL ortak maliyet ileri işlemenin maliyetine eklenmiştir: 20.000 − 150.000.'
    hesap_adimlari:
    - Satılabilir miktar = 5.000 × 0,90 = 4.500 kg
    - Ek hasılat = 315.000 − 200.000 = 115.000 TL
    - Ek maliyet = 75.000 + 20.000 = 95.000 TL
    - Kâra etki = +20.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
