- id: YMM-YNM-KRV-0062
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Karar verme ve ilgili maliyetler
  konu: KRV
  kazanim: kıt kaynak kullanımı
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin yıllık makine saati kapasitesi 6.000 saattir ve bu kapasite kısa dönemde artırılamaz. Ürünlere ilişkin
    veriler şöyledir:


    | Ürün | Birim katkı payı | Birim makine saati | Yıllık en yüksek talep |

    |---|---|---|---|

    | X | 60 TL | 2 saat | 1.500 birim |

    | Y | 80 TL | 4 saat | 1.000 birim |

    | Z | 40 TL | 1 saat | 2.000 birim |


    İşletme, imzaladığı bir sözleşme gereği yıl içinde en az 400 birim Y teslim etmek zorundadır. Yıllık sabit giderler 150.000
    TL''dir ve üretim bileşiminden etkilenmez. Ürünler kesirli üretilmemekte; başka kısıt bulunmamaktadır. İşletmenin elde
    edebileceği en yüksek toplam katkı payı kaç TL''dir?'
  secenekler:
    A: 140.000 TL
    B: 178.000 TL
    C: 184.000 TL
    D: 190.000 TL
    E: 208.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Önce sözleşmeden doğan zorunlu üretim ayrılır: 400 Y × 4 saat = 1.600 saat, katkı payı 32.000 TL. Kalan
      4.400 saat, makine saati başına katkı payına göre dağıtılır: Z 40 TL/saat, X 30 TL/saat, Y 20 TL/saat. Z''nin talebi
      2.000 birim (2.000 saat, 80.000 TL), kalan 2.400 saat X''e verilir: 1.200 birim, 72.000 TL. Toplam = 32.000 + 80.000
      + 72.000 = 184.000 TL. Püf noktaları: Sıralama birim katkı payına göre değil kıt kaynak birimi başına katkı payına göre
      yapılır; ancak sözleşme gibi zorunlu miktarlar sıralamadan önce kapasiteden düşülür. Talep sınırı, en kârlı ürüne ayrılacak
      saati de sınırlar.'
    celdiriciler:
      A: 'Birim katkı payına göre sıralanmıştır (Y 80, X 60, Z 40): 1.000 Y (4.000 saat) ve 1.000 X (2.000 saat) = 140.000
        TL.'
      B: 'Sözleşme karşılandıktan sonra birim katkı payı yüksek olan X, Z''den önce üretilmiştir: 32.000 + 90.000 + 56.000.'
      D: 'Sözleşme yükümlülüğü göz ardı edilmiştir: 2.000 Z, 1.500 X ve kalan 1.000 saatle 250 Y üretilir; bu bileşim 400
        birimlik zorunlu Y teslimini karşılamaz.'
      E: Z'nin talep sınırı dikkate alınmamış, sözleşmeden kalan 4.400 saatin tamamı Z'ye verilmiştir.
    hesap_adimlari:
    - 'Sözleşme: 400 Y → 1.600 saat, 32.000 TL'
    - 'Saat başına katkı payı: Z 40, X 30, Y 20 TL'
    - 'Z: 2.000 birim → 2.000 saat, 80.000 TL'
    - 'X: kalan 2.400 saat → 1.200 birim, 72.000 TL'
    - Toplam katkı payı = 184.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'saat = 6000

      y = 400

      saat = saat - y * 4

      kp = y * 80

      z = min(2000, saat // 1)

      saat = saat - z * 1

      kp = kp + z * 40

      x = min(1500, saat // 2)

      saat = saat - x * 2

      kp = kp + x * 60

      ek_y = min(1000 - y, saat // 4)

      kp = kp + ek_y * 80

      sonuc = kp'
