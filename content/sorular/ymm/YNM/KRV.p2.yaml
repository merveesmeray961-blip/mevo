  - YMM
  ders: YNM
  unite: Karar verme ve ilgili maliyetler
  konu: KRV
  kazanim: ürün hattını kapatma
  tip: hesaplama
  zorluk: 3
  kok: 'Bir işletmenin A ürün hattına ilişkin yıllık veriler şöyledir: satışlar 400.000 TL, değişken giderler 240.000 TL,
    doğrudan sabit giderler 70.000 TL, ortak sabit giderlerden dağıtılan pay 100.000 TL; hattın faaliyet zararı 10.000 TL''dir.
    Doğrudan sabit giderlerin 30.000 TL''si, satış ya da başka kullanım değeri olmayan özel ekipmanın amortismanıdır; kalan
    40.000 TL hat kapatılırsa ortadan kalkar. B hattının yıllık satışları 600.000 TL, değişken giderleri 360.000 TL''dir.
    A hattı kapatılırsa iki ürünü birlikte alan müşteriler nedeniyle B''nin satış miktarı %10 azalacak (B''nin birim fiyatı
    ve birim değişken maliyeti değişmeyecek), A''nın boşalan alanı yıllık 20.000 TL''ye kiraya verilebilecektir. Ortak sabit
    giderler değişmeyecektir. A hattının kapatılması işletmenin yıllık faaliyet kârını nasıl etkiler?'
  secenekler:
    A: 6.000 TL artar
    B: 94.000 TL azalır
    C: 100.000 TL azalır
    D: 124.000 TL azalır
    E: 144.000 TL azalır
  dogru: D
  aciklama:
    dogru_neden: 'Kapatmanın etkileri: A''nın katkı payı kaybı 400.000 − 240.000 = 160.000 TL; kaçınılabilir sabit gider tasarrufu
      40.000 TL; kira geliri 20.000 TL; B''nin katkı payı kaybı (600.000 − 360.000) × %10 = 24.000 TL. Net etki = −160.000
      + 40.000 + 20.000 − 24.000 = −124.000 TL. Dağıtılmış ortak giderler ve ekipman amortismanı kapatmayla ortadan kalkmadığı
      için ilgisizdir. Püf noktaları: Hattın muhasebe zararı karar ölçütü değildir; kaybedilen katkı payı ile kaçınılabilir
      giderler karşılaştırılır. Tamamlayıcı ürüne etkiyi satış tutarıyla değil katkı payıyla ölçün ve boşalan kapasitenin
      alternatif gelirini ekleyin.'
    celdiriciler:
      A: 'Dağıtılmış ortak giderler ve amortisman da kaçınılabilir sayılmıştır: −160.000 + 70.000 + 100.000 + 20.000 − 24.000.'
      B: 'Doğrudan sabit giderlerin tamamı kaçınılabilir sayılmış, kaçınılamayan amortisman da tasarruf yazılmıştır: −160.000
        + 70.000 + 20.000 − 24.000.'
      C: B hattının katkı payındaki 24.000 TL'lik azalma göz ardı edilmiştir.
      E: Boşalan alanın 20.000 TL'lik kira geliri hesaba katılmamıştır.
    hesap_adimlari:
    - A katkı payı kaybı = −160.000 TL
    - Kaçınılabilir sabit gider = +40.000 TL
    - Kira geliri = +20.000 TL
    - B katkı payı kaybı = 240.000 × 0,10 = −24.000 TL
    - Net etki = −124.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Karar verme ve ilgili maliyetler
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'etki = -(400000 - 240000) + 40000 + 20000 - (600000 - 360000) * 0.10

      sonuc = round(abs(etki), 4)'
  durum: kontrolde
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: 'harici: ic-hat'
    istem_surumu: uretici paketi YNM-1
