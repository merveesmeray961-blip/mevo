      iki yapının kârı eşittir: 40Q − 200.000 = 64Q − 392.000 → 24Q = 192.000 → Q = 8.000 birim. Bu miktarın üzerinde birim
      başına 24 TL fazla katkı payı, 192.000 TL''lik ek sabit gideri aşar. Vergi oranı iki yapının kârını aynı oranda etkilediğinden
      kayıtsızlık noktasını değiştirmez; beklenen satış miktarı da eşiğin hesabında kullanılmaz. Püf noktaları: Kayıtsızlık
      noktası, ek sabit giderin birim katkı payı farkına bölünmesiyle bulunur; fiyat değişikliği de katkı payı farkına girer.
      İki yapının ayrı ayrı başabaş noktaları bu soruyu cevaplamaz.'
    celdiriciler:
