    oranı %20, gelecek yıl beklenen satış miktarı 9.000 birimdir. Satış miktarı iki yapıda da aynı olacaktır. Yıllık satış
    miktarı hangi düzeyi aştığında otomasyonlu yapı mevcut yapıdan daha yüksek faaliyet kârı sağlar?
