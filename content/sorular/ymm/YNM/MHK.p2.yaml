- id: YMM-YNM-MHK-0062
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet hacim kâr analizi
  konu: MHK
  kazanim: güvenlik marjı
  tip: hesaplama
  zorluk: 2
  kok: Bir işletmenin dönem satış hasılatı 800.000 TL, katkı payı oranı %40 ve güvenlik marjı oranı %25'tir. Güvenlik marjı
    oranı, fiilî satış hasılatı ile başabaş satış hasılatı arasındaki farkın fiilî satış hasılatına oranıdır. Satış fiyatı,
    birim değişken maliyet ve sabit giderler dönem içinde değişmemiştir. Buna göre işletmenin dönem faaliyet kârı kaç TL'dir?
  secenekler:
    A: 60.000 TL
    B: 80.000 TL
    C: 120.000 TL
    D: 200.000 TL
    E: 240.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Başabaş noktasında katkı payı sabit giderlere eşittir; bu nedenle başabaş üzerindeki her satış lirasının
      katkı payı doğrudan kâra dönüşür. Güvenlik marjı 800.000 × %25 = 200.000 TL''dir; kâr = 200.000 × %40 = 80.000 TL. Kısaca
      kâr marjı = güvenlik marjı oranı × katkı payı oranı = %25 × %40 = %10; 800.000 × %10 = 80.000 TL. Kontrol: başabaş hasılatı
      600.000 TL, sabit gider 600.000 × %40 = 240.000 TL, toplam katkı payı 320.000 TL, kâr 80.000 TL.'
    celdiriciler:
      A: Güvenlik marjı oranı ve katkı payı oranı başabaş hasılatına (600.000 TL) uygulanmıştır; kâr fiilî satışlar üzerinden
        bulunur.
      C: Güvenlik marjı tutarı katkı payı oranı yerine değişken maliyet oranıyla (%60) çarpılmıştır.
      D: Güvenlik marjı tutarının (200.000 TL) tamamı kâr sanılmıştır; bu tutarın yalnız katkı payı kadarı kâra kalır.
      E: Bulunan tutar sabit giderlerdir (başabaş hasılatı × katkı payı oranı); kâr değildir.
    hesap_adimlari:
    - Güvenlik marjı = 800.000 × 0,25 = 200.000 TL
    - Kâr = 200.000 × 0,40 = 80.000 TL
    - 'Kontrol: başabaş 600.000 TL; sabit gider 240.000 TL; katkı payı 320.000 TL; kâr 80.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'satis = 800000

      kpo = 0.40

      gmo = 0.25

      basabas = satis * (1 - gmo)

      sabit = basabas * kpo

      sonuc = satis * kpo - sabit'
