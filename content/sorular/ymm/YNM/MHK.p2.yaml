- id: YMM-YNM-MHK-0065
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet hacim kâr analizi
  konu: MHK
  kazanim: hedef kâr
  tip: hesaplama
  zorluk: 3
  kok: Bir ürünün birim satış fiyatı 150 TL, birim değişken üretim maliyeti 75 TL'dir. Ayrıca her satıştan satış fiyatının
    %10'u kadar satış komisyonu ödenmektedir. Yıllık sabit giderler 180.000 TL, kurumlar vergisi oranı %20'dir. Yönetim, **vergi
    sonrası** kârın satış hasılatının %16'sı olmasını hedeflemektedir. Üretilen her birim aynı dönemde satılmakta; fiyat ve
    maliyet yapısı değişmemektedir. Bu hedefe ulaşmak için kaç birim satılmalıdır?
  secenekler:
    A: 3.000 birim
    B: 4.000 birim
    C: 5.000 birim
    D: 6.000 birim
    E: 7.500 birim
  dogru: D
  aciklama:
    dogru_neden: 'Birim katkı payı = 150 − 75 − (150 × %10) = 60 TL. Vergi sonrası %16''lık kâr, vergi öncesi 0,16 / 0,80
      = %20''ye karşılık gelir; birim başına 150 × %20 = 30 TL vergi öncesi kâr ayrılmalıdır. Sabit giderleri karşılayacak
      net tutar 60 − 30 = 30 TL olduğundan miktar = 180.000 / 30 = 6.000 birimdir. Kontrol: hasılat 900.000; komisyon 90.000;
      değişken maliyet 450.000; sabit gider 180.000; vergi öncesi kâr 180.000; vergi 36.000; vergi sonrası kâr 144.000 TL
      = 900.000 × %16. Püf noktaları: Hedef satışların yüzdesi olarak verildiğinde birim başına düşen hedef kâr, katkı payından
      düşülür. Vergi sonrası oran (1 − vergi oranı) ile bölünerek vergi öncesine çevrilir; komisyon değişken bir giderdir
      ve katkı payını azaltır.'
    celdiriciler:
      A: Hedef kâr hiç dikkate alınmamıştır; 180.000 / 60 başabaş miktarıdır.
      B: Satış komisyonu değişken gider olarak düşülmemiştir; birim katkı payı 75 TL alınarak 180.000 / (75 − 30) hesaplanmıştır.
      C: Vergi sonrası %16'lık hedef vergi öncesine çevrilmemiştir; 180.000 / (60 − 24) hesaplanmıştır.
      E: Katkı payı vergi sonrasına çevrilmiş (60 × 0,80 = 48 TL) ama sabit giderler vergi etkisiyle düzeltilmemiştir; 180.000
        / (48 − 24) hesaplanmıştır.
    hesap_adimlari:
    - Komisyon = 150 × 0,10 = 15 TL; birim katkı payı = 150 − 75 − 15 = 60 TL
    - Vergi öncesi hedef oran = 0,16 / 0,80 = %20 → birim başına 30 TL
    - Miktar = 180.000 / (60 − 30) = 6.000 birim
    - 'Kontrol: vergi sonrası kâr 144.000 TL = 900.000 × %16'
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fiyat = 150

      kp = fiyat - 75 - fiyat * 0.10

      hedef_vo = fiyat * 0.16 / (1 - 0.20)

      sonuc = round(180000 / (kp - hedef_vo), 4)'
