- id: YMM-YNM-MHK-0063
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet hacim kâr analizi
  konu: MHK
  kazanim: hedef kâr
  tip: hesaplama
  zorluk: 2
  kok: Bir ürünün birim satış fiyatı 150 TL'dir. İşletmenin başabaş noktası 4.000 birim olup 5.000 birim satıldığında vergi
    öncesi faaliyet kârı 60.000 TL'dir. Satış fiyatı, birim değişken maliyet ve sabit giderler değişmeyecektir. İşletmenin
    150.000 TL vergi öncesi faaliyet kârı elde edebilmesi için ulaşması gereken satış hasılatı kaç TL'dir?
  secenekler:
    A: 375.000 TL
    B: 600.000 TL
    C: 650.000 TL
    D: 975.000 TL
    E: 1.125.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Başabaş noktasını aşan 1.000 birim 60.000 TL kâr sağladığına göre birim katkı payı 60 TL''dir. Sabit giderler
      4.000 × 60 = 240.000 TL''dir. Hedef kâr için gereken miktar (240.000 + 150.000) / 60 = 6.500 birim, gereken hasılat
      6.500 × 150 = 975.000 TL''dir. Aynı sonuç katkı payı oranıyla da bulunur: 390.000 / 0,40 = 975.000 TL.'
    celdiriciler:
      A: Yalnız hedef kâr birim katkı payına bölünmüştür (2.500 birim); önce sabit giderlerin karşılanması gerektiği unutulmuştur.
      B: Bulunan tutar başabaş satış hasılatıdır (4.000 × 150); hedef kâr eklenmemiştir.
      C: Sabit gider ve hedef kâr toplamı katkı payı oranı yerine değişken maliyet oranına (%60) bölünmüştür.
      E: Hedef kârı sağlayacak 2.500 birim, başabaş noktası yerine 5.000 birimlik mevcut satışa eklenmiştir; mevcut 60.000
        TL kâr iki kez sayılmıştır.
    hesap_adimlari:
    - Birim katkı payı = 60.000 / (5.000 − 4.000) = 60 TL
    - Sabit gider = 4.000 × 60 = 240.000 TL
    - Gerekli miktar = (240.000 + 150.000) / 60 = 6.500 birim
    - Gerekli hasılat = 6.500 × 150 = 975.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'fiyat = 150

      kp = 60000 / (5000 - 4000)

      sabit = 4000 * kp

      miktar = (sabit + 150000) / kp

      sonuc = miktar * fiyat'
  durum: kontrolde
