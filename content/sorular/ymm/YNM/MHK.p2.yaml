  kok: 'Bir işletme A ve B ürünlerini satmaktadır. A''nın katkı payı oranı %25, B''nin katkı payı oranı %50''dir. Ortak yıllık
    sabit giderler 360.000 TL''dir. Mevcut satış karması hasılat esasına göre %50 A, %50 B''dir. Yönetim, karmanın hasılat
