- id: YMM-YNM-MHK-0064
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet hacim kâr analizi
  konu: MHK
  kazanim: çok ürünlü başabaş
  tip: hesaplama
  zorluk: 3
  kok: Bir işletme X ve Y ürünlerini satmaktadır. X'in birim satış fiyatı 50 TL, birim değişken maliyeti 35 TL; Y'nin birim
    satış fiyatı 80 TL, birim değişken maliyeti 40 TL'dir. Satış karması **satış hasılatı esasına göre** sabit olup toplam
    hasılatın %60'ı X'ten, %40'ı Y'den elde edilmektedir. İki ürünün ortak yıllık sabit giderleri 190.000 TL'dir. Fiyatlar,
    birim değişken maliyetler ve sabit giderler değişmeyecektir. Buna göre başabaş noktasında X ürününden kaç birim satılmalıdır?
  secenekler:
    A: 4.560 birim
    B: 5.700 birim
    C: 6.000 birim
    D: 7.600 birim
    E: 10.000 birim
  dogru: C
  aciklama:
    dogru_neden: 'Katkı payı oranları: X için 15 / 50 = %30, Y için 40 / 80 = %50. Karma hasılat esasına göre verildiğinden
      ağırlıklı katkı payı oranı = 0,60 × %30 + 0,40 × %50 = %38''dir. Başabaş hasılatı = 190.000 / 0,38 = 500.000 TL; bunun
      %60''ı olan 300.000 TL X''e düşer; X miktarı = 300.000 / 50 = 6.000 birim (Y: 200.000 / 80 = 2.500 birim). Kontrol:
      6.000 × 15 + 2.500 × 40 = 90.000 + 100.000 = 190.000 TL. Püf noktaları: Karmanın hasılat mı yoksa miktar esasına göre
      mi verildiğine bakın; hasılat karmasında katkı payı oranları ağırlıklandırılır, birim katkı payları değil. Ayrıca soru
      toplam miktarı değil X''in miktarını istiyor.'
    celdiriciler:
      A: '%60–%40 oranı miktar karması sanılmış; ağırlıklı birim katkı payı 0,6 × 15 + 0,4 × 40 = 25 TL ile toplam 7.600 birim
        bulunup %60''ı X''e verilmiştir.'
      B: Katkı payı oranlarının basit ortalaması (%40) kullanılmış; başabaş hasılatı 475.000 TL ve X hasılatı 285.000 TL bulunmuştur.
      D: Karma yanlışlıkla miktar esasına göre yorumlanmış ve bulunan toplam miktar (190.000 / 25) X'in miktarı sanılmıştır.
      E: Toplam başabaş hasılatının (500.000 TL) tamamı X'in birim fiyatına bölünmüş; Y'nin payı düşülmemiştir.
    hesap_adimlari:
    - 'Katkı payı oranları: X %30, Y %50'
    - Ağırlıklı oran = 0,6 × 0,30 + 0,4 × 0,50 = 0,38
    - Başabaş hasılatı = 190.000 / 0,38 = 500.000 TL
    - X hasılatı = 500.000 × 0,60 = 300.000 TL
    - X miktarı = 300.000 / 50 = 6.000 birim
  kaynaklar:
  - mevzuat: Genel bilgi — Maliyet hacim kâr analizi
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'kpo_x = (50 - 35) / 50

      kpo_y = (80 - 40) / 80

      agirlikli = 0.6 * kpo_x + 0.4 * kpo_y

      basabas = 190000 / agirlikli

      sonuc = round(basabas * 0.6 / 50, 4)'
  durum: kontrolde
