      B: Otomasyonlu yapının başabaş noktasıdır (392.000 / 64); kârların eşitlendiği hacim değildir.
      D: Fiyat artışı dikkate alınmamış; ek sabit gider yalnız değişken maliyet tasarrufuna (20 TL) bölünmüştür.
      E: Fiyat artışı katkı payı farkını büyütmesi gerekirken farktan düşülmüş; 192.000 / (20 − 4) hesaplanmıştır.
