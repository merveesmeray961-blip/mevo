  unite: Maliyet hacim kâr analizi
  konu: MHK
  kazanim: başabaş noktası
  tip: uygulama
  zorluk: 3
  kok: 'Bir imalat işletmesinin sabit üretim giderleri 150.000 TL, sabit satış ve yönetim giderleri 30.000 TL''dir. Birim
    değişken maliyet 40 TL, birim satış fiyatı 70 TL''dir. Başabaş noktasındaki satış miktarı kaç adettir?

    '
  secenekler:
    A: 5.000 adet
    B: 4.500 adet
    C: 6.000 adet
    D: 7.000 adet
    E: 6.500 adet
  dogru: C
  aciklama:
    dogru_neden: 'Toplam sabit gider = 150.000 + 30.000 = 180.000 TL. Birim katkı payı = 70 − 40 = 30 TL. Başabaş miktarı
      = 180.000 / 30 = 6.000 adet.

      '
    celdiriciler:
      A: Yalnız sabit üretim gideri 150.000 TL esas alınmıştır.
