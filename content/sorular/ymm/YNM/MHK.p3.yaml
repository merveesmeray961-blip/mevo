  kok: 'İşletme X, Y ve Z ürünü satmaktadır. Satış karması sırasıyla %50, %30 ve %20''dir. Birim katkı payları X için 20 TL,
    Y için 15 TL, Z için 10 TL''dir. Birim satış fiyatları X 50 TL, Y 30 TL, Z 25 TL''dir. Toplam sabit giderler 255.000 TL
    ise çok ürünlü başabaş noktasındaki toplam satış hasılatı yaklaşık kaç TL''dir?

    '
