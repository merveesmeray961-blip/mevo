    dogru_neden: 'Tablo sondan başa çözülür. Üretilen mamul maliyeti = SMM + dönem sonu mamul − dönem başı mamul = 1.500.000
      + 260.000 − 200.000 = 1.560.000 TL. Dönem üretim maliyeti = 600.000 + 400.000 + 400.000 × 1,5 = 1.600.000 TL. Dönem
      sonu yarı mamul = dönem başı YM + DÜM − ÜMM = 120.000 + 1.600.000 − 1.560.000 = 160.000 TL. Püf noktaları: Geri hesapta
      her stok değişiminin yönünü ters çevirme hatasına dikkat et; mamul stoku artışı üretilen mamul maliyetini SMM''nin üstüne
      çıkarır.'
