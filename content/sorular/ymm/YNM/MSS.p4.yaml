  zorluk: 3
  kok: 'FIFO yöntemiyle safha maliyeti hesaplayan (J) AŞ''de dönem başında 2.000 birim yarı mamul (malzeme %100, dönüştürme
    %60 tamamlanmış; maliyeti 50.000 TL) bulunmaktadır. Dönemde 10.000 birim üretime başlanmış, 9.000 birim tamamlanmış, 3.000
    birim dönem sonunda yarı mamul kalmıştır (malzeme %100, dönüştürme %50). Fire yoktur. Dönemin cari maliyetleri: malzeme
    160.000 TL, dönüştürme 232.500 TL''dir. Dönem sonu yarı mamul stokunun maliyeti kaç TL''dir?'
  secenekler:
    A: 37.500 TL
    B: 48.000 TL
    C: 75.000 TL
    D: 85.500 TL
    E: 123.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'FIFO''da eşdeğer birim yalnız cari dönem çalışmasını ölçer. Malzeme EB = 9.000 − 2.000 + 3.000 = 10.000
      → 160.000 / 10.000 = 16 TL. Dönüştürme EB = 9.000 − 2.000 × %60 + 3.000 × %50 = 9.000 − 1.200 + 1.500 = 9.300 → 232.500
      / 9.300 = 25 TL. Dönem sonu YM = 3.000 × 16 + 1.500 × 25 = 85.500 TL. Sağlama: tamamlananlar 50.000 + 800 × 25 + 7.000
      × 41 = 357.000 TL; 357.000 + 85.500 = 442.500 TL toplam maliyete eşittir. Püf noktaları: FIFO''da dönem başı yarı mamulün
      önceki dönemde yapılan kısmı eşdeğer birimden düşülür; dönem sonu yarı mamulde malzeme ve dönüştürme tamamlanma derecelerini
      ayrı uygula.'
    celdiriciler:
      A: Yalnız dönüştürme maliyeti (1.500 × 25) alınmış, malzeme payı eklenmemiştir.
      B: Yalnız malzeme maliyeti (3.000 × 16) alınmıştır.
      C: Dönüştürme birim maliyeti 3.000 tam birime uygulanmış, malzeme payı atlanmıştır.
      E: Dönem sonu yarı mamul dönüştürme bakımından da tamamlanmış sayılmıştır (3.000 × 41).
    hesap_adimlari:
    - Malzeme EB = 10.000; birim 16
    - Dönüştürme EB = 9.300; birim 25
    - YM sonu = 3.000 × 16 + 1.500 × 25 = 85.500
