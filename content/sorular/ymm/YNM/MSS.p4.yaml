    TL'dir. Dönemde kullanılan direkt ilk madde ve malzeme 600.000 TL, direkt işçilik 400.000 TL'dir; genel üretim giderleri
    direkt işçiliğin %150'si oranında yüklenmiş olup yükleme farkı yoktur. Dönem başı yarı mamul stoku 120.000 TL'dir. Dönem
    sonu yarı mamul stoku kaç TL'dir?
