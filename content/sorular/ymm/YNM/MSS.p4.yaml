- id: YMM-YNM-MSS-0006
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet sistemleri ve maliyet akışı
  konu: MSS
  kazanim: safha maliyet sistemi ve fire
  tip: hesaplama
  zorluk: 3
  kok: (E) AŞ'nin tek safhalı üretiminde dönem başı yarı mamul yoktur. Dönemde 10.000 birim üretime başlanmış; 8.500 birim
    tamamlanmış, süreç sonunda yapılan kontrolde 300 birim normal fire ve 200 birim anormal fire tespit edilmiş, 1.000 birim
    dönem sonunda yarı mamul kalmıştır (malzeme %100, dönüştürme %40). Dönemin direkt ilk madde ve malzeme maliyeti 300.000
    TL, dönüştürme maliyeti 235.000 TL'dir. Malzeme sürecin başında eklenmektedir. Tamamlanarak mamul ambarına devredilen
    birimlere yüklenecek toplam maliyet kaç TL'dir?
  secenekler:
    A: 467.500 TL
    B: 478.500 TL
    C: 484.000 TL
    D: 495.000 TL
    E: 524.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Fire süreç sonunda tespit edildiğinden eşdeğer birime tam olarak katılır. Malzeme EB = 8.500 + 300 + 200
      + 1.000 = 10.000 → 30 TL; dönüştürme EB = 8.500 + 300 + 200 + 400 = 9.400 → 25 TL; tam birim maliyeti 55 TL. Normal
      fire maliyeti sağlam (tamamlanan) birimlere yüklenir: 8.500 × 55 + 300 × 55 = 484.000 TL. Anormal fire (200 × 55 = 11.000
      TL) dönem gideridir; dönem sonu yarı mamul fire noktasına ulaşmadığından fireden pay almaz (1.000 × 30 + 400 × 25 =
      40.000 TL). Sağlama: 484.000 + 11.000 + 40.000 = 535.000 TL. Püf noktaları: Normal ve anormal fireyi ayır; yalnız normal
      fire tamamlananlara yüklenir. Fire süreç sonunda tespit edildiğinden yarı mamuller fireden pay almaz.'
    celdiriciler:
      A: Normal fire maliyeti tamamlanan birimlere yüklenmemiştir.
      B: Normal fire yerine anormal fire tamamlananlara yüklenmiştir.
      D: Anormal fire de tamamlananlara yüklenmiştir; dönem gideri olarak yazılmalıdır.
      E: Dönem sonu yarı mamul maliyeti de tamamlananlara eklenmiştir.
    hesap_adimlari:
    - Malzeme birim = 300.000 / 10.000 = 30
    - Dönüştürme birim = 235.000 / 9.400 = 25
    - Tamamlananlar = (8.500 + 300) × 55 = 484.000
    - Anormal fire = 11.000; YM = 40.000
  kaynaklar:
  - mevzuat: Genel bilgi — Safha maliyet sistemi ve fire
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'm = 300000 / (8500 + 300 + 200 + 1000)

      d = 235000 / (8500 + 300 + 200 + 400)

      sonuc = (8500 + 300) * (m + d)'
  durum: taslak
  surum: 1
