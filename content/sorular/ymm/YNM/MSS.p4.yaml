  unite: Maliyet sistemleri ve maliyet akışı
  konu: MSS
  kazanim: sipariş maliyet sistemi
  tip: hesaplama
  zorluk: 2
  kok: 'Sipariş maliyet sistemi uygulayan (A) AŞ''de genel üretim giderleri, tahmini GÜG''ün (900.000 TL) tahmini direkt işçilik
    saatine (30.000 saat) bölünmesiyle bulunan oranla siparişlere yüklenmektedir. Dönemin sipariş bilgileri aşağıdadır (KDV
    dikkate alınmayacaktır):

    | | S-1 | S-2 | S-3 |

    |---|---|---|---|

    | Direkt ilk madde ve malzeme (TL) | 80.000 | 60.000 | 25.000 |

    | Direkt işçilik (TL) | 45.000 | 36.000 | 15.000 |

    | Direkt işçilik saati | 1.500 | 1.200 | 500 |

    | Durum | Tamamlandı, müşteriye teslim edildi | Tamamlandı, depoda | Üretimi sürüyor |

    Dönem sonunda mamul stokunun maliyeti kaç TL''dir?

    '
  secenekler:
    A: 96.000 TL
    B: 132.000 TL
    C: 170.000 TL
    D: 187.000 TL
    E: 302.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'GÜG yükleme oranı = 900.000 / 30.000 = 30 TL/saat. Tamamlanıp depoda bekleyen S-2''nin maliyeti mamul stokunu
      oluşturur: 60.000 + 36.000 + 1.200 × 30 = 132.000 TL. S-1 satılan mamul maliyetine, S-3 yarı mamul stokuna aittir.'
    celdiriciler:
      A: S-2'ye GÜG yüklenmemiştir.
      C: 170.000 TL teslim edilen S-1'in maliyetidir; satılan mamul maliyetine aktarılır.
      D: Üretimi süren S-3 yarı mamuldür; mamul stokuna eklenmez.
      E: Teslim edilen S-1 de mamul stoku sayılmıştır.
    hesap_adimlari:
    - Oran = 900.000 / 30.000 = 30 TL/saat
    - S-2 = 60.000 + 36.000 + 36.000 = 132.000
