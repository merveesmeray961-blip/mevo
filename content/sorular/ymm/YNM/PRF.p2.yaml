  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: yatırımın karlılığı ve artık kâr
  tip: uygulama
  zorluk: 3
  kok: 'Bir yatırım merkezi tek bir varlık grubundan oluşmaktadır. Varlıkların maliyeti 1.200.000 TL, faydalı ömrü 4 yıl,
    hurda değeri sıfırdır ve doğrusal amortisman uygulanmaktadır. Varlıklar her yıl amortisman öncesi 420.000 TL faaliyet
    kârı sağlamaktadır. ROI, yıl başı varlık değerleri üzerinden hesaplanmaktadır.


    I. Net defter değeri esasına göre 3. yılın ROI''si %40''tır.

    II. Brüt defter değeri (tarihî maliyet) esasına göre ROI dört yılın her birinde %10''dur.

    III. Net defter değeri esası, yöneticinin eskiyen varlıkları yenileme kararını geciktirmesine yol açabilir.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: 'Yıllık amortisman 1.200.000 / 4 = 300.000 TL; amortisman sonrası faaliyet kârı 420.000 − 300.000 = 120.000
      TL. 3. yılın başındaki net defter değeri 1.200.000 − 2 × 300.000 = 600.000 TL; ROI = 120.000 / 600.000 = %20''dir; %40,
      3. yılın sonundaki 300.000 TL''lik değerle bulunur (I yanlış). Brüt esasta payda her yıl 1.200.000 TL; ROI = %10 (II
      doğru). Net defter değeri esasında varlıklar eskidikçe payda küçülür ve ROI kendiliğinden yükselir (%10; yaklaşık %13,3;
      %20; %40); yeni varlık alımı paydayı büyütüp ROI''yi düşüreceğinden yönetici yenilemeyi erteleyebilir (III doğru). Püf
      noktaları: 3. yılın başı, iki yıllık amortismanın düşüldüğü andır; yıl sonu değeri (300.000 TL) kullanılırsa hatalı
      olarak %40 bulunur. Brüt esasta pay, amortisman öncesi değil amortisman sonrası kârdır.'
    celdiriciler:
      A: 'I. ifade yanlıştır: ROI yıl başı değerle hesaplanır; 3. yıl başı net değer 600.000 TL, ROI %20''dir. %40 yıl sonu
        değerle bulunur.'
      B: 'III. ifade de doğrudur: eskiyen varlıklarla ROI''nin kendiliğinden yükselmesi, yöneticiyi varlık yenilemekten caydırabilir.'
      C: I. ifade yanlıştır (3. yıl başı değerle ROI %20'dir); doğru olan III. ifade ise dışarıda bırakılmıştır.
      D: 'I. ifade yanlıştır: yıl sonu net değeri (300.000 TL) kullanılarak bulunan %40, yıl başı esasına uymaz; II. ifade
        ise doğrudur.'
    hesap_adimlari:
    - Amortisman = 300.000 TL; kâr = 120.000 TL
    - 3. yıl başı net değer = 600.000 TL; ROI = %20
    - Brüt esasta ROI = 120.000 / 1.200.000 = %10
