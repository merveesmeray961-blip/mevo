- id: YMM-YNM-PRF-0054
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: dengeli başarı kartı
  tip: kavrama
  zorluk: 3
  kok: 'Düşük maliyet stratejisi izleyen bir kargo şirketi dengeli başarı kartı ve strateji haritası oluşturmuştur. Haritada
    şu neden-sonuç zinciri yer almaktadır: kurye ve depo personelinin çapraz eğitimi → paket ayrıştırma süresinin kısalması
    ve hatalı teslimat oranının düşmesi → zamanında teslimat oranının ve müşteri bağlılığının artması → paket başına maliyetin
    düşmesi ve gelirlerin artması. Bu karta ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?'
  secenekler:
    A: Çapraz eğitim saati, öğrenme ve gelişim perspektifinde yer alır ve zincirin başındaki öncü göstergelerden biridir.
    B: Paket ayrıştırma süresi ve hatalı teslimat oranı, içsel iş süreçleri perspektifinin ölçüleridir.
    C: Hatalı teslimat oranı düştüğü hâlde müşteri bağlılığı artmıyorsa, haritadaki neden-sonuç varsayımı yeniden sorgulanmalıdır.
    D: Paket başına maliyet, finansal perspektifte yer alan ve stratejinin sonucunu gösteren gecikmeli bir göstergedir.
    E: Müşteri bağlılığındaki artış, paket ayrıştırma süresindeki iyileşmenin öncü göstergesidir.
  dogru: E
  aciklama:
    dogru_neden: 'Strateji haritasında neden-sonuç ilişkisi öğrenme ve gelişim → içsel iş süreçleri → müşteri → finansal yönündedir.
      Paket ayrıştırma süresindeki iyileşme (süreç) müşteri bağlılığının nedenidir; dolayısıyla süreç ölçüsü müşteri ölçüsünün
      öncü göstergesidir. E ifadesi ilişkiyi ters kurmaktadır. Püf noktaları: Bir ölçünün öncü mü gecikmeli mi olduğu, zincirdeki
      yerine göre belirlenir; aynı ölçü bir sonraki halka için öncü, bir önceki halka için sonuç göstergesidir. Ölçülen ilişki
      gerçekleşmiyorsa (C) kart değil varsayım gözden geçirilir.'
    celdiriciler:
      A: 'Doğrudur: çalışan yetkinlikleri öğrenme ve gelişim perspektifindedir ve zincirdeki diğer iyileşmelerin öncülüdür.'
      B: 'Doğrudur: süre ve hata oranları, müşteriye değer yaratan süreçlerin verimliliğini ve kalitesini ölçen içsel süreç
        ölçüleridir.'
      C: 'Doğrudur: strateji haritası test edilebilir neden-sonuç varsayımlarına dayanır; beklenen ilişki gerçekleşmiyorsa
        varsayım ve strateji gözden geçirilir.'
      D: 'Doğrudur: birim maliyet, düşük maliyet stratejisinin finansal sonucunu ölçer ve diğer perspektiflerdeki iyileşmelerden
        sonra ortaya çıkar.'
