- id: YMM-YNM-PRF-0050
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: yatırımın karlılığı ve artık kâr
  tip: uygulama
  zorluk: 2
  kok: Bir yatırım merkezinin ortalama faaliyet varlıkları 1.500.000 TL, yıllık faaliyet kârı 300.000 TL'dir. Bölüm yöneticisine,
    500.000 TL ek faaliyet varlığı gerektiren ve yıllık 80.000 TL ek faaliyet kârı sağlayacak bir proje önerilmiştir. İşletmenin
    asgari getiri oranı %12'dir. Proje kabul edilirse bölümün yatırım kârlılığı (ROI), bölümün artık kârındaki değişim ve
    performansı yalnız ROI ile değerlendirilen yöneticinin olası kararı aşağıdakilerin hangisinde doğru verilmiştir? (ROI
    / artık kârdaki değişim / olası karar)
  secenekler:
    A: '%19 / 20.000 TL artış / reddetme eğilimi'
    B: '%19 / 80.000 TL artış / reddetme eğilimi'
    C: '%16 / 20.000 TL artış / reddetme eğilimi'
    D: '%19 / 20.000 TL artış / kabul etme eğilimi'
    E: '%19 / 20.000 TL azalış / reddetme eğilimi'
  dogru: A
  aciklama:
    dogru_neden: Mevcut ROI = 300.000 / 1.500.000 = %20. Proje sonrası ROI = (300.000 + 80.000) / (1.500.000 + 500.000) =
      380.000 / 2.000.000 = %19. Projenin artık kâra katkısı = 80.000 − 500.000 × %12 = 20.000 TL artış. Projenin kendi getirisi
      %16 olup asgari getiri oranını (%12) aştığından işletme açısından kabul edilmelidir; ancak bölüm ROI'sini %20'den %19'a
      düşürdüğü için yalnız ROI ile değerlendirilen yönetici projeyi reddetme eğiliminde olur. Bu, ROI'nin amaç uyumsuzluğuna
      yol açabilen yönüdür.
    celdiriciler:
      B: Artık kâr değişimi bulunurken projenin sermaye maliyeti (500.000 × %12 = 60.000 TL) düşülmemiştir.
      C: Bölümün proje sonrası ROI'si yerine yalnız projenin getirisi (80.000 / 500.000 = %16) verilmiştir.
      D: ROI ile değerlendirilen yönetici, bölüm ROI'sini düşüren projeyi kabul etmek istemez; karar yönü yanlıştır.
      E: ROI'nin düşmesi artık kârın da düştüğü anlamına gelmez; proje getirisi asgari orandan yüksek olduğundan artık kâr
        artar.
    hesap_adimlari:
    - Mevcut ROI = 300.000 / 1.500.000 = %20
    - Yeni ROI = 380.000 / 2.000.000 = %19
    - Artık kâr değişimi = 80.000 − 60.000 = +20.000 TL
  kaynaklar:
