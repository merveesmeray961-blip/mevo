- id: YMM-YNM-PRF-0053
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: yatırımın karlılığı ve artık kâr
  tip: uygulama
  zorluk: 3
  kok: 'X ve Y yatırım merkezleri için asgari getiri oranı %14''tür. X bölümünün yatırım kârlılığı (ROI) %18, artık kârı 80.000
    TL''dir. Y bölümünün ortalama faaliyet varlıkları 500.000 TL, artık kârı 30.000 TL''dir.


    I. X bölümünün ortalama faaliyet varlıkları 2.000.000 TL''dir.

    II. Y bölümünün ROI''si X bölümünün ROI''sinden düşüktür.

    III. Asgari getiri oranı %16 olsaydı X bölümünün artık kârı Y bölümününkinin iki katı olurdu.


    Yukarıdaki ifadelerden hangileri doğrudur?'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: D
  aciklama:
    dogru_neden: 'Artık kâr = varlıklar × (ROI − asgari oran) olduğundan X için 80.000 = V × (%18 − %14) → V = 2.000.000 TL;
      X''in faaliyet kârı 360.000 TL (I doğru). Y''nin faaliyet kârı = 30.000 + 500.000 × %14 = 100.000 TL; ROI = %20 > %18
      (II yanlış). Asgari oran %16 olsaydı X''in artık kârı 360.000 − 320.000 = 40.000 TL, Y''ninki 100.000 − 80.000 = 20.000
      TL olurdu; X''inki Y''ninkinin iki katıdır (III doğru). Püf noktaları: Artık kâr ile ROI arasındaki ilişkiden geri hesapla
      varlık ve kâr tutarlarını bulun. Küçük bölüm Y''nin ROI''si daha yüksek, büyük bölüm X''in artık kârı ise mutlak tutar
      olarak daha büyüktür; iki ölçü bölümleri farklı sıralayabilir.'
    celdiriciler:
      A: 'III. ifade de doğrudur: %16 asgari oranla artık kârlar 40.000 TL ve 20.000 TL olur.'
      B: 'II. ifade yanlıştır: Y''nin ROI''si %20''dir ve X''in %18''lik ROI''sinden yüksektir; artık kârının küçük olması
        ROI''sinin de düşük olduğunu göstermez.'
      C: II. ifade yanlıştır; doğru olan III. ifade ise dışarıda bırakılmıştır.
      E: Doğru olan I. ifade dışarıda bırakılmış, yanlış olan II. ifade alınmıştır.
    hesap_adimlari:
    - 'X: 80.000 / (0,18 − 0,14) = 2.000.000 TL; kâr = 360.000 TL'
    - 'Y: kâr = 30.000 + 70.000 = 100.000 TL; ROI = %20'
    - '%16 ile: X = 360.000 − 320.000 = 40.000 TL; Y = 100.000 − 80.000 = 20.000 TL'
  kaynaklar:
  - mevzuat: Genel bilgi — Performans ölçümü ve transfer fiyatı
    madde: '-'
