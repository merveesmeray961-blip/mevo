- id: YMM-YNM-PRF-0051
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: sorumluluk merkezleri
  tip: hesaplama
  zorluk: 2
  kok: 'Bir işletmenin K bölümüne ilişkin dönem verileri şöyledir: satışlar 900.000 TL; değişken maliyetler 500.000 TL; bölüm
    yöneticisinin kontrolündeki sabit giderler 150.000 TL; bölüme doğrudan izlenebilen ancak ilgili yatırım kararları genel
    merkezce verildiğinden bölüm yöneticisinin kontrolünde olmayan sabit giderler (makine amortismanı ve sigorta) 80.000 TL;
    genel merkez giderlerinden bölüme dağıtılan pay 60.000 TL. Bölüm yöneticisinin kişisel performansının değerlendirilmesinde
    esas alınması gereken kâr tutarı kaç TL''dir?'
  secenekler:
    A: 110.000 TL
    B: 170.000 TL
    C: 190.000 TL
    D: 250.000 TL
    E: 400.000 TL
  dogru: D
  aciklama:
    dogru_neden: Yöneticinin performansı, yalnız onun kontrol edebildiği gelir ve giderlerle ölçülmelidir (kontrol edilebilirlik
      ilkesi). Katkı payı 900.000 − 500.000 = 400.000 TL; yöneticinin kontrolündeki sabit giderler düşülünce yöneticinin kontrol
      edilebilir kârı 400.000 − 150.000 = 250.000 TL'dir. Kontrol dışındaki izlenebilir sabit giderler düşülerek bulunan 170.000
      TL bölümün (ekonomik birim olarak) başarısını gösterir; genel merkez payı ise ne yöneticinin ne de bölümün kontrolündedir.
    celdiriciler:
      A: 'Genel merkezden dağıtılan pay dahil tüm giderler düşülmüştür: 400.000 − 150.000 − 80.000 − 60.000. Dağıtılan pay
        yöneticinin kontrolünde değildir.'
      B: Bölüm kârıdır (400.000 − 150.000 − 80.000); bölümün ekonomik başarısının ölçüsüdür, yöneticinin kontrolünde olmayan
        80.000 TL'yi de içerir.
      C: 'Kontrol dışındaki izlenebilir giderler yerine genel merkez payı düşülmüştür: 250.000 − 60.000. Genel merkez payı
        da yöneticinin kontrolünde değildir.'
      E: Katkı payıdır; yöneticinin kontrol ettiği 150.000 TL sabit gider düşülmemiştir.
    hesap_adimlari:
    - Katkı payı = 900.000 − 500.000 = 400.000 TL
    - Yöneticinin kontrol edilebilir kârı = 400.000 − 150.000 = 250.000 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Performans ölçümü ve transfer fiyatı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'katki = 900000 - 500000

      sonuc = katki - 150000'
