- id: YMM-YNM-PRF-0052
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: işletme içi transfer fiyatlaması
  tip: hesaplama
  zorluk: 3
  kok: A bölümü yıllık 10.000 birim kapasiteyle bir ara mamul üretmekte ve dış piyasaya birimi 100 TL'den yılda en çok 8.000
    birim satabilmektedir. Birim değişken üretim maliyeti 60 TL'dir; dış satışlarda ayrıca birim başına 5 TL değişken satış
    gideri doğmakta, iç transferlerde bu gider doğmamaktadır. B bölümü bu ara mamulden yılda 4.000 birim talep etmekte ve
    siparişin bölünmeden tamamının A bölümünden karşılanmasını istemektedir. A bölümünün sabit giderleri bu karardan etkilenmeyecektir.
    A bölümünün kârını azaltmadan kabul edebileceği en düşük birim transfer fiyatı kaç TL'dir?
  secenekler:
    A: 60,00 TL
    B: 77,50 TL
    C: 80,00 TL
    D: 95,00 TL
    E: 100,00 TL
  dogru: B
  aciklama:
    dogru_neden: 'Boş kapasite 10.000 − 8.000 = 2.000 birimdir; 4.000 birimlik siparişin 2.000 birimi boş kapasiteden, 2.000
      birimi dış satışlardan vazgeçilerek karşılanır. En düşük transfer fiyatı = birim değişken maliyet + birim fırsat maliyeti.
      Vazgeçilen her dış satışın katkı payı 100 − 60 − 5 = 35 TL; toplam fırsat maliyeti 2.000 × 35 = 70.000 TL. Toplam en
      düşük tutar 4.000 × 60 + 70.000 = 310.000 TL; birim başına 310.000 / 4.000 = 77,50 TL. Püf noktaları: Fırsat maliyeti
      yalnız dış satıştan vazgeçilen 2.000 birim için doğar ve 4.000 birime yayılır. İç transferde doğmayan 5 TL satış gideri,
      vazgeçilen katkı payını küçültür.'
    celdiriciler:
      A: Yalnız değişken maliyet alınmıştır; bu tutar ancak siparişin tamamı boş kapasiteden karşılanabilseydi geçerli olurdu.
      C: 'İç transferde doğmayan 5 TL satış gideri dikkate alınmamıştır: 60 + 2.000 × 40 / 4.000 = 80 TL.'
      D: 'Tam kapasite varsayılarak tüm birimler için piyasa fiyatından satış gideri düşülmüştür: 100 − 5; boş kapasite göz
        ardı edilmiştir.'
      E: Piyasa fiyatı alınmıştır; hem boş kapasite hem de iç transferde doğmayan satış gideri göz ardı edilmiştir.
    hesap_adimlari:
    - Boş kapasite = 2.000 birim; dış satıştan vazgeçilen = 2.000 birim
    - Vazgeçilen birim katkı payı = 100 − 60 − 5 = 35 TL
    - Toplam = 4.000 × 60 + 2.000 × 35 = 310.000 TL
    - Birim = 310.000 / 4.000 = 77,50 TL
  kaynaklar:
  - mevzuat: Genel bilgi — Performans ölçümü ve transfer fiyatı
    madde: '-'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'bos = 10000 - 8000

      vazgecilen = 4000 - bos

      toplam = 4000 * 60 + vazgecilen * (100 - 60 - 5)

      sonuc = toplam / 4000'
  durum: taslak
  surum: 1
