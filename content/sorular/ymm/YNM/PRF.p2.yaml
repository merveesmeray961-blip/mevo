- id: YMM-YNM-PRF-0055
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: işletme içi transfer fiyatlaması
  tip: hesaplama
  zorluk: 3
  kok: S bölümü tam kapasitede çalışmakta ve ürettiği parçanın tamamını dış piyasaya birimi 120 TL'den satmaktadır. Parçanın
    birim değişken üretim maliyeti 70 TL'dir; dış satışlarda ayrıca birim başına 10 TL değişken satış gideri doğmakta, iç
    transferde bu gider doğmamaktadır. T bölümü ihtiyaç duyduğu 5.000 birim parçayı dış tedarikçiden birimi 105 TL'ye satın
    alabilmektedir. Genel merkez, bu 5.000 birimin S bölümünden birimi 100 TL transfer fiyatıyla alınmasını zorunlu kılmıştır.
    Sabit giderler bu karardan etkilenmemektedir. Bu karar, parçanın dış tedarikçiden alınmasına göre işletme bütününün faaliyet
    kârını nasıl etkiler?
  secenekler:
    A: 75.000 TL azalır
    B: 50.000 TL azalır
    C: 25.000 TL azalır
    D: Değişmez
    E: 25.000 TL artar
  dogru: C
  aciklama:
    dogru_neden: 'Transfer fiyatı işletme içi bir aktarımdır; işletme bütününün kârını etkileyen, iç transferin gerçek maliyetidir.
      S tam kapasitede olduğundan iç transferin işletmeye birim maliyeti = değişken maliyet + vazgeçilen dış satış katkı payı
      = 70 + (120 − 70 − 10) = 110 TL''dir. Dış tedarikçiden alım 105 TL olduğundan iç transfer işletmeye birim başına 5 TL,
      toplam 5.000 × 5 = 25.000 TL kâr kaybettirir. Püf noktaları: 100 TL''lik transfer fiyatı yalnız kârın bölümler arasındaki
      dağılımını değiştirir (T 25.000 TL kazanır, S 50.000 TL kaybeder); işletme bütününe etkisi iki bölümün toplamıdır. İç
      transferde doğmayan satış gideri fırsat maliyetini azaltır.'
    celdiriciler:
      A: 'İç transferde doğmayan 10 TL satış gideri dikkate alınmamıştır: 70 + 50 = 120 TL; (120 − 105) × 5.000.'
      B: 'Yalnız S bölümünün kaybı alınmıştır: (110 − 100) × 5.000. T bölümünün 25.000 TL''lik kazancı göz ardı edilmiştir.'
      D: Transfer fiyatının işletme bütünü için nötr olduğu doğrudur; ancak S'nin dış satıştan vazgeçmesinin fırsat maliyeti
        unutulmuştur.
      E: 'Yalnız T bölümünün bakış açısı alınmıştır: (105 − 100) × 5.000; S bölümünün kaybı göz ardı edilmiştir.'
    hesap_adimlari:
    - İç transferin işletmeye birim maliyeti = 70 + (120 − 70 − 10) = 110 TL
    - Dış alım = 105 TL
    - Fark = (105 − 110) × 5.000 = −25.000 TL
