    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: C
  aciklama:
    dogru_neden: Piyasa fiyatı uygun koşullarda transfer fiyatına temel olabilir. Tam kapasite durumunda iç satış
      nedeniyle dış satıştan vazgeçmenin fırsat maliyeti vardır. Yalnız değişken maliyet ise her durumda tek doğru
      transfer fiyatını belirlemez.
    celdiriciler:
      A: II. önermenin tam kapasitedeki fırsat maliyetini gözden kaçırır.
      B: Piyasa fiyatının transfer fiyatlamasında referans olabileceğini gözden kaçırır.
      D: III. önermeyi doğru kabul eder.
