- id: YMM-YNM-PRF-0079
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Performans ölçümü ve transfer fiyatı
  konu: PRF
  kazanim: yatırımın karlılığı ve artık kâr
  tip: uygulama
  zorluk: 2
  kok: Yatırımın karlılığı (YK) oranına ilişkin aşağıdaki ifadelerden hangisi **YANLIŞTIR**?
  secenekler:
    A: YK, net faaliyet kârının yatırılan sermayeye oranıdır.
    B: YK arttıkça yatırım merkezinin performansı olumlu değerlendirilir.
    C: YK hesaplanırken kullanılan varlık tabanı ortalama değerle ölçülebilir.
    D: YK yüksek olan bir merkez her zaman pozitif artık kâr üretir.
    E: Farklı büyüklükteki merkezlerin karşılaştırılmasında YK oransal bir avantaj sağlar.
  dogru: D
  aciklama:
    dogru_neden: YK'nın yüksek olması, artık kârın pozitif olduğunu garanti etmez. Artık kâr = Net faaliyet kârı
      − (Yatırılan sermaye × Sermaye maliyeti). YK sermaye maliyetinin üzerinde olsa da artık kâr negatif çıkabilir;
      ancak bunun tersi değil, YK > sermaye maliyeti ise artık kâr pozitif olur. Yanlışlık; YK yüksek olan bir merkezin
      her koşulda pozitif artık kâr üreteceğinin ileri sürülmesidir.
    celdiriciler:
      A: Doğru tanım.
