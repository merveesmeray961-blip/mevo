  tip: uygulama
  zorluk: 1
  kok: 'Bir işletmede A bölümü, B bölümüne yarı mamul aktarmaktadır. A bölümünün dış müşterilere aynı yarı mamulü
    satabildiği ve dış piyasa fiyatının 80 TL olduğu, A bölümünün birim değişken maliyetinin 50 TL olduğu ve A bölümünün
    tam kapasiteyle çalıştığı varsayılmaktadır. İşletme içi transfer fiyatının belirlenmesine ilişkin aşağıdaki
    önermeler verilmiştir.


    I. Dış piyasa fiyatı, uygun koşullarda transfer fiyatı için piyasa temelli bir referans olabilir.

    II. A bölümü tam kapasitede olduğundan iç transferin fırsat maliyeti bulunabilir.

    III. Yalnızca değişken maliyetin dikkate alınması her durumda tek doğru transfer fiyatını verir.'
