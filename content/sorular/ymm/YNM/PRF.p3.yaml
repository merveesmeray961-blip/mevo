  tip: uygulama
  zorluk: 1
  kok: 'Bir işletmede A bölümü, B bölümüne yarı mamul aktarmaktadır. A bölümünün dış müşterilere aynı yarı mamulü satabildiği
    ve dış piyasa fiyatının 80 TL olduğu, A bölümünün birim değişken maliyetinin 50 TL olduğu ve A bölümünün tam kapasiteyle
    çalıştığı varsayılmaktadır. İşletme içi transfer fiyatının belirlenmesine ilişkin aşağıdaki önermeler verilmiştir.


    I. Dış piyasa fiyatı, uygun koşullarda transfer fiyatı için piyasa temelli bir referans olabilir.

    II. A bölümü tam kapasitede olduğundan iç transferin fırsat maliyeti bulunabilir.

    III. Yalnızca değişken maliyetin dikkate alınması her durumda tek doğru transfer fiyatını verir.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: C
  aciklama:
    dogru_neden: Piyasa fiyatı uygun koşullarda transfer fiyatına temel olabilir. Tam kapasite durumunda iç satış nedeniyle
      dış satıştan vazgeçmenin fırsat maliyeti vardır. Yalnız değişken maliyet ise her durumda tek doğru transfer fiyatını
      belirlemez.
    celdiriciler:
      A: II. önermenin tam kapasitedeki fırsat maliyetini gözden kaçırır.
      B: Piyasa fiyatının transfer fiyatlamasında referans olabileceğini gözden kaçırır.
      D: III. önermeyi doğru kabul eder.
      E: III. önermeyi doğru kabul eder ve I. önermeyi dışarıda bırakır.
