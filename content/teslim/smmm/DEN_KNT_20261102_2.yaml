- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Denetim kanıtı"
  konu: "KNT"
  kazanim: "BDS 550 yazılı açıklamalar"
  tip: "kavrama"
  zorluk: 2
  soru_bicimi: standart
  kok: "Geçerli finansal raporlama çerçevesinde ilişkili taraflarla ilgili hükümler bulunmaktadır. BDS 550'ye göre denetçi yönetimden hangi konuda yazılı açıklama alır?"
  secenekler:
    A: "Yalnızca ilişkili taraflarla yapılan işlemlerin piyasa fiyatından düşük olduğuna"
    B: "İlişkili taraf işlemlerinin tamamının denetim ekibine önceden bildirildiğine ve vergilendirildiğine ve ilgili beyannamelere yansıtıldığına"
    C: "Tarafların kimliklerini ve tüm ilişki-işlemleri açıkladıklarına, bunları uygun muhasebeleştirdiklerine"
    D: "İlişkili taraflarla ilgili hiçbir işlemin dönem içinde gerçekleşmediğine"
    E: "İlişkili tarafların mali tablolarının ayrıca denetlendiğine"
  dogru: C
  aciklama:
    dogru_neden: "BDS 550 md. 26 uyarınca çerçevede ilişkili taraf hükümleri varsa denetçi, yönetimden ve uygun hâllerde üst yönetimden sorumlu olanlardan, ilişkili tarafların kimliklerini ve haberdar oldukları tüm ilişki ve işlemleri açıkladıklarına ve bunları çerçeve hükümlerine uygun muhasebeleştirdiklerine ve açıkladıklarına ilişkin yazılı açıklama alır."
    celdiriciler:
      A: "Fiyatın piyasa altı olduğu yönünde bir beyan md. 26'da istenmez."
      B: "Vergilendirme md. 26'da istenen beyan değildir."
      D: "Dönem içinde işlem olmadığı beyanı md. 26'da istenmez; işlemler varsa açıklanır."
      E: "İlişkili tarafların ayrı denetimi md. 26'nın konusu değildir."
  kaynaklar:
  - mevzuat: "BDS 550 İlişkili Taraflar"
    madde: "md. 26"
    alinti: "Geçerli finansal raporlama çerçevesinde ilişkili taraflarla ilgili hükümlerin bulunması durumunda denetçi, yönetimden ve -uygun hallerde- üst yönetimden sorumlu olanlardan; İşletmenin ilişkili taraflarının kimliklerini ve haberdar oldukları tüm ilişkili taraf ilişkilerini ve işlemlerini denetçiye açıkladıklarına ve Bu ilişkilerin ve işlemlerin söz konusu çerçeve hükümlerine uygun olarak muhasebeleştirdikleri ve açıkladıklarına ilişkin yazılı açıklamalar alır"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Denetim kanıtı"
  konu: "KNT"
  kazanim: "BDS 560 değiştirilmiş finansal tablolar"
  tip: "uygulama"
  zorluk: 2
  soru_bicimi: standart
  kok: "Denetçi raporunu düzenledikten sonra yönetim, bilanço tarihinden sonraki bir olay nedeniyle finansal tablolarda değişiklik yapmış ve değiştirilmiş tabloları 14 Mart'ta onaylamıştır. BDS 560'a göre denetçinin yeni raporu için aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Yeni rapor, ilk raporun tarihini taşıyabilir."
    B: "Yeni rapor, değiştirilmiş tabloların onay tarihinden daha önceki bir tarihle düzenlenir."
    C: "Yeni rapor düzenlenmez, ilk rapor aynen geçerli sayılır."
    D: "Yeni rapora, 14 Mart'tan önceki bir tarih verilemez."
    E: "Yeni rapor, tabloların ilk yayım tarihine geri tarihlenir."
  dogru: D
  aciklama:
    dogru_neden: "BDS 560 md. 11 uyarınca yönetimin finansal tablolarda değişiklik yapması durumunda denetçi gerekli prosedürleri uygular, prosedürleri yeni rapor tarihine kadar genişletir ve yeni bir rapor sunar; yeni rapora, değiştirilmiş tabloların onaylandığı tarihten önceki bir tarih verilmez."
    celdiriciler:
      A: "İlk rapor tarihi, değiştirilmiş tabloların onay tarihinden öncedir; md. 11 buna izin vermez."
      B: "Onay tarihinden önceki tarih md. 11'de yasaklanmıştır."
      C: "Değişiklik yapıldığında md. 11 yeni rapor sunulmasını ister."
      E: "Geri tarihleme md. 11 ile bağdaşmaz."
  kaynaklar:
  - mevzuat: "BDS 560 Bilanço Tarihinden Sonraki Olaylar"
    madde: "md. 11(b)(ii)"
    alinti: "ii. Değiştirilmiş finansal tablolara ilişkin yeni bir denetçi raporu sunar. Yeni denetçi raporuna, değiştirilmiş finansal tabloların onaylandığı tarihten önceki bir tarih verilmez"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Denetim kanıtı"
  konu: "KNT"
  kazanim: "BDS 560 yayımdan sonra haberdar olma"
  tip: "uygulama"
  zorluk: 2
  soru_bicimi: standart
  kok: "Finansal tablolar ve denetçi raporu yayımlandıktan sonra yönetim, denetçinin işaret ettiği bir durum nedeniyle tablolarda değişiklik yapmıştır. BDS 560 md. 15'e göre denetçi, gerekli denetim prosedürlerine ek olarak aşağıdakilerden hangisini yapar?"
  secenekler:
    A: "Önceki raporu kendiliğinden iptal edilmiş sayar ve kullanıcılara kendisi bildirim yapar."
    B: "Değişikliğin duyurulmasını yönetimin takdirine bırakır ve herhangi bir gözden geçirme yapmaz."
    C: "Yeni rapor düzenlemeden önceki raporu ilgili kişilere yeniden gönderir."
    D: "Değişikliğin yapıldığı tarihi yeni rapor tarihi olarak kabul eder ve inceleme yapmaz."
    E: "Değişiklikten haberdar edilme konusunda yönetimin aldığı tedbirleri gözden geçirir."
  dogru: E
  aciklama:
    dogru_neden: "BDS 560 md. 15 uyarınca yönetimin finansal tablolarda değişiklik yapması durumunda denetçi, gerekli prosedürleri uygular ve daha önce yayımlanmış tabloların ve raporun ulaştığı kişilerin değişiklikten haberdar edildiğinden emin olmak üzere yönetimin aldığı tedbirleri gözden geçirir."
    celdiriciler:
      A: "Kullanıcılara bildirimi yapmak yönetimin sorumluluğundadır; denetçi tedbirleri gözden geçirir."
      B: "Md. 15 gözden geçirme ister; takdire bırakmak bu hükme aykırıdır."
      C: "Md. 15 yeni rapor sunulmasını (veya değiştirmeyi) ve tedbirlerin gözden geçirilmesini ister."
      D: "Rapor tarihi md. 11/15 kuralına göre değiştirilmiş tabloların onay tarihinden önce olamaz; inceleme yapılmaması uygun değildir."
  kaynaklar:
  - mevzuat: "BDS 560 Bilanço Tarihinden Sonraki Olaylar"
    madde: "md. 15"
    alinti: "Daha önceden yayımlanmış finansal tabloların ve bunlara ilişkin denetçi raporunun ulaştığı kişilerin söz konusu değişiklikten haberdar edildiğinden emin olmak üzere yönetim tarafından alınan tedbirleri gözden geçirir"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Denetim kanıtı"
  konu: "KNT"
  kazanim: "BDS 580 talep edilen beyanların sunulmaması"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Yönetim, denetçinin talep ettiği yazılı beyanlardan birini sunmamıştır. Denetçi, yönetimin dürüstlüğüne ilişkin yeterli şüphe bulunduğu sonucuna varmamıştır. BDS 580'e göre denetçi ilk aşamada aşağıdakilerden hangisini yapar?"
  secenekler:
    A: "Beyan sunulmadığı için başka hiçbir değerlendirme yapmadan doğrudan görüş vermekten kaçınır ve raporu düzenler."
    B: "Konuyu yönetimle müzakere eder, dürüstlüğünü yeniden değerlendirir ve görüşe etkisine ilişkin adımları atar."
    C: "Beyanın sunulmamasını hiç dikkate almaz, çünkü beyanlar kanıt sayılmaz."
    D: "Beyanı kendisi yazarak yönetim adına imzalar."
    E: "Beyan yerine yönetimin sözlü beyanını aynen yeterli sayar."
  dogru: B
  aciklama:
    dogru_neden: "BDS 580 md. 19 uyarınca yönetimin talep edilen yazılı beyanlardan bir veya daha fazlasını sunmaması durumunda denetçi konuyu yönetimle müzakere eder, yönetimin dürüstlüğünü yeniden değerlendirir ve BDS 705 uyarınca görüşe etkisini belirlemek dâhil uygun adımları atar. Püf noktaları: Görüş vermekten kaçınma (md. 20) ancak dürüstlük konusunda yeterli şüphe varsa veya md. 10-11 beyanları sunulmuyorsa söz konusudur; her eksik beyan doğrudan kaçınma gerektirmez."
    celdiriciler:
      A: "Doğrudan kaçınma md. 20'nin özel koşullarına bağlıdır; her eksik beyan bunu gerektirmez."
      C: "Yazılı beyanlar denetim kanıtı niteliğindedir (md. 4); dikkate alınmaması yanlıştır."
      D: "Beyanı yazıp imzalamak yönetimin sorumluluğudur."
      E: "Sözlü beyan, talep edilen yazılı beyanın yerine geçmez."
  kaynaklar:
  - mevzuat: "BDS 580 Yazılı Açıklamalar"
    madde: "md. 19"
    alinti: "Yönetimin talep edilen yazılı beyanlardan bir veya daha fazlasını sunmaması durumunda denetçi: Konuyu yönetimle müzakere eder. Yönetimin dürüstlüğünü yeniden değerlendirir ve bu durumun, beyanlar (sözlü veya yazılı) ve genel olarak denetim kanıtlarının güvenilirliği üzerinde oluşturabileceği etkiyi değerlendirir. Bu BDS’nin 20 nci paragrafındaki hükmü dikkate alarak, BDS 705 uyarınca bu durumun denetçi raporundaki görüşe olan muhtemel etkisinin belirlenmesi de dâhil olmak üzere, uygun adımları atar"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Denetim kanıtı"
  konu: "KNT"
  kazanim: "BDS 580 tutarsız yazılı beyanlar"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Yönetimin yazılı beyanı, denetçinin elde ettiği başka denetim kanıtlarıyla tutarsızdır. Denetçi tutarsızlığı çözmek için ilave prosedürler uygulamış, ancak sorun çözülememiştir. İşletmenin cirosu 18 milyon TL'dir. BDS 580'e göre denetçi bu aşamada ne yapar?"
  secenekler:
    A: "Yönetimin yetkinliği, dürüstlüğü ve özenine ilişkin değerlendirmesini yeniden mütalaa eder, güvenilirliğe etkisini belirler."
    B: "Tutarsızlığı önemsemeden yazılı beyanı esas alır."
    C: "Yazılı beyanı geçersiz sayıp yönetimle hiç görüşmeden tüm denetim kanıtlarını sıfırdan yeniden toplar ve ardından yeni bir denetim planı hazırlar."
    D: "Yönetimin değerlendirmesini değiştirmeden yalnızca ciroya bakarak sonuca varır."
    E: "Beyan mektubunu yönetime iade eder ve denetimi sonlandırır."
  dogru: A
  aciklama:
    dogru_neden: "BDS 580 md. 17 uyarınca yazılı beyanların diğer kanıtlarla tutarsız olması ve sorunun çözülememesi durumunda denetçi, yönetimin yetkinliği, dürüstlüğü, etik değerleri veya özenine ilişkin değerlendirmesini yeniden mütalaa eder ve bu durumun beyanların ve genel olarak denetim kanıtlarının güvenilirliği üzerindeki etkisini belirler. Püf noktaları: Ciro tutarı gereksiz veridir; çözüm önce ilave prosedür, sonra yönetim değerlendirmesinin yeniden ele alınmasıdır."
    celdiriciler:
      B: "Tutarsız beyan esas alınamaz; md. 17 etkisini belirlemeyi ister."
      C: "Md. 17 tüm kanıtların yeniden toplanmasını değil, değerlendirmenin yeniden mütalaasını ister."
      D: "Ciro md. 17'de ölçüt değildir."
      E: "Md. 17 denetimin sonlandırılmasını öngörmez."
  kaynaklar:
  - mevzuat: "BDS 580 Yazılı Açıklamalar"
    madde: "md. 17"
    alinti: "Özellikle, yazılı beyanların diğer denetim kanıtlarıyla tutarlı olmaması durumunda, denetçi bu sorunu çözmek amacıyla denetim prosedürleri uygular. Sorununun çözülememesi durumunda denetçi, yönetimin yetkinliği, dürüstlüğü, etik değerleri veya özenine ya da yönetimin bunlara bağlılığına veya bunları uygulamasına ilişkin değerlendirmesini yeniden mütalaa eder ve bu durumun, beyanların (sözlü veya yazılı) ve genel olarak denetim kanıtlarının güvenilirliği üzerinde oluşturabileceği etkiyi belirler"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

