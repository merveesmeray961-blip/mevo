- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 320 özel önemlilik düzeyi"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir denetimde bir bütün olarak finansal tablolar için önemlilik 500.000 TL belirlenmiştir. Ancak ilişkili taraf işlemlerine ilişkin açıklamalardaki 500.000 TL'den çok daha düşük yanlışlıkların kullanıcıların ekonomik kararlarını etkileyeceği makul şekilde beklenmektedir. BDS 320'ye göre denetçi ne yapar?"
  secenekler:
    A: "Tek önemlilik yeterli olduğundan yalnızca 500.000 TL'yi kullanır."
    B: "Bir bütün olarak tablolar için belirlediği önemliliği artırır."
    C: "Bu açıklamalar için ayrıca daha düşük önemlilik düzeyi belirler."
    D: "Açıklamaları, ancak tutar önemliliği aşarsa denetime dâhil eder."
    E: "Performans önemliliğini 500.000 TL'nin üzerine çıkarır."
  dogru: C
  aciklama:
    dogru_neden: "BDS 320 md. 10 uyarınca bir bütün olarak finansal tablolar için belirlenen önemlilikten daha düşük tutarlardaki yanlışlıkların kullanıcı kararlarını etkileyeceği makul şekilde beklenen işlem sınıfı, hesap bakiyesi veya açıklama varsa denetçi, bunlara uygulanmak üzere ayrıca önemlilik düzeyi veya düzeyleri belirler. Püf noktaları: Özel düzey, genel önemlilikten düşük olur; performans önemliliği ise ayrı bir kavramdır ve genel önemlilikten daha düşük belirlenir."
    celdiriciler:
      A: "Tek önemlilik, özel durumlarda md. 10'un ek düzey şartını karşılamaz."
      B: "Önemliliği artırmak daha küçük yanlışlıkların gözden kaçmasına yol açar; md. 10 ek düzey ister."
      D: "Tutar eşiği md. 10'da bu durum için aranmaz; özel düzey, genel önemlilikten düşüktür."
      E: "Performans önemliliği genel önemlilikten düşük belirlenir (md. 9); üzerine çıkarılamaz."
  kaynaklar:
  - mevzuat: "BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik"
    madde: "md. 10"
    alinti: "İşletmenin içinde bulunduğu özel şartlara göre, kullanıcıların finansal tablolara istinaden alacakları ekonomik kararları etkileyeceği makul şekilde beklenen, bir bütün olarak finansal tablolar için belirlenen önemlilikten daha düşük tutarlardaki yanlışlıkları içerebilecek bir veya daha fazla işlem sınıfının, hesap bakiyesinin veya açıklamanın bulunduğu durumda, denetçi bu özel işlem sınıfları, hesap bakiyeleri ve açıklamalara uygulanmak üzere ayrıca önemlilik düzeyi veya düzeyleri belirler"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 320 denetim yürütülürken değişiklik"
  tip: "uygulama"
  zorluk: 2
  soru_bicimi: standart
  kok: "Denetçi, denetimin yürütülmesi sırasında, başlangıçta belirlediğinden farklı bir önemlilik tutarı belirlemesine sebep olacak bir bilgiden haberdar olmuştur. BDS 320'ye göre denetçi ne yapar?"
  secenekler:
    A: "İlk belirlenen önemliliği, denetimin tutarlılığı için aynen korur."
    B: "Önemliliği yalnızca denetim sonunda, rapor tarihinden önce yeniden belirler."
    C: "Yeni bilgiyi çalışma kâğıdına yazar ancak önemliliği değiştirmez."
    D: "Belirlediği önemliliği ve uygun hâllerde özel düzeyleri değiştirir."
    E: "Önemliliğin değiştirilmesi için önce yönetimin onayını alır."
  dogru: D
  aciklama:
    dogru_neden: "BDS 320 md. 12 uyarınca denetçi, başlangıçta önemliliğe ilişkin farklı bir tutar belirlemesine sebep olacak bir bilgiden denetim sırasında haberdar olursa, bir bütün olarak finansal tablolar için belirlediği önemliliği (ve uygun hâllerde özel düzeyleri) değiştirir."
    celdiriciler:
      A: "İlk tutarın korunması md. 12'ye aykırıdır."
      B: "Md. 12 değişikliği, bilgiden haberdar olunduğunda ister; denetim sonuna bırakmak yeterli değildir."
      C: "Bilgiyi yalnızca not etmek md. 12'nin gerektirdiği değişikliği yapmaz."
      E: "Önemlilik denetçinin muhakemesine aittir; yönetim onayı md. 12'de aranmaz."
  kaynaklar:
  - mevzuat: "BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik"
    madde: "md. 12"
    alinti: "Denetçi, başlangıçta önemliliğe ilişkin farklı bir tutar (veya tutarlar) belirlemesine sebep olacak bir bilgiden denetimin yürütülmesi sırasında haberdar olması durumunda, bir bütün olarak finansal tablolar için belirlediği önemliliği (ve -uygun hâllerde- özel işlem sınıfları, hesap bakiyeleri veya açıklamalar için belirlediği önemlilik düzeyi veya düzeylerini) değiştirir"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 320 daha düşük önemlilik"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Denetçi, denetim sırasında bir bütün olarak finansal tablolar için başlangıçta belirlediğinden daha düşük bir önemliliğin uygun olduğu sonucuna varmıştır. İşletmenin cirosu 40 milyon TL'dir. BDS 320'ye göre denetçi bu durumda ayrıca aşağıdakilerden hangisini yapar?"
  secenekler:
    A: "Yalnızca bu durumu raporun Diğer Hususlar paragrafında açıklar."
    B: "Önceki prosedürleri geçersiz sayar ve denetime baştan başlar."
    C: "Performans önemliliğini sabit tutar, çünkü o önemlilikten bağımsızdır."
    D: "Cirosuna oranlayarak önemliliği yeniden hesaplamak yeterlidir; prosedürler değişmez ve performans önemliliği sabit kalır, hiçbir ek değerlendirme yapılmaz."
    E: "Performans önemliliğinin değiştirilmesinin gerekip gerekmediğine ve prosedürlerin hâlâ uygun olup olmadığına karar verir."
  dogru: E
  aciklama:
    dogru_neden: "BDS 320 md. 13 uyarınca daha düşük bir önemliliğin uygun olduğu sonucuna varılırsa denetçi, performans önemliliğinin değiştirilmesinin gerekip gerekmediğine ve uygulanan veya uygulanacak prosedürlerin niteliğinin, zamanlamasının ve kapsamının hâlâ uygun olup olmadığına karar verir. Püf noktaları: Ciro gereksiz veridir. Prosedürler baştan geçersiz sayılmaz; yeniden değerlendirilir."
    celdiriciler:
      A: "Md. 13 rapor açıklaması değil, performans önemliliği ve prosedür değerlendirmesi ister."
      B: "Md. 13 baştan başlamayı değil, uygunluğun değerlendirilmesini ister."
      C: "Performans önemliliği genel önemlilikten türetilir; değişmesi gerekebilir."
      D: "Prosedürlerin uygunluğu da değerlendirilir (md. 13)."
  kaynaklar:
  - mevzuat: "BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik"
    madde: "md. 13"
    alinti: "Denetçi, bir bütün olarak finansal tablolar için başlangıçta belirlediğinden (ve -uygun hâllerde- özel işlem sınıfları, hesap bakiyeleri veya açıklamalar için belirlediği önemlilik düzeyi veya düzeylerinden) daha düşük bir önemliliğin uygun olduğu sonucuna varması durumunda, performans önemliliğinin değiştirilmesinin gerekli olup olmadığına ve uygulanan veya uygulanacak olan denetim prosedürlerinin niteliğinin, zamanlamasının ve kapsamının hâlâ uygun olup olmadığına karar verir"
