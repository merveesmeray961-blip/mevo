- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 320 toplulaştırma riski"
  tip: "bilgi"
  zorluk: 1
  soru_bicimi: standart
  kok: "BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik standardında tanımlanan “toplulaştırma riski” aşağıdakilerden hangisidir?"
  secenekler:
    A: "Düzeltilmemiş ve tespit edilemeyen yanlışlıkların toplamının önemliliği aşma olasılığı"
    B: "Denetçinin örneklemden vardığı sonucun, anakitlenin tamamından çıkacak sonuçtan farklı olma riski"
    C: "Denetçinin, yanlışlığı tespit edemeyeceği prosedürleri seçmesi riski"
    D: "Yönetimin hile yoluyla birden fazla hesabı bir araya getirerek gizlemesi riski"
    E: "Önemli yanlışlık riskinin kontrol riskiyle çarpılarak bulunması"
  dogru: A
  aciklama:
    dogru_neden: "BDS 320 md. 9 uyarınca toplulaştırma riski, düzeltilmemiş ve tespit edilmemiş yanlışlıkların toplamının bir bütün olarak finansal tablolar için belirlenen önemliliği aşma olasılığıdır."
    celdiriciler:
      B: "Bu, BDS 530'daki örnekleme riski tanımıdır."
      C: "Prosedür seçimi hatası toplulaştırma riski tanımı değildir."
      D: "Toplulaştırma riski hile gizlemeyle değil, yanlışlıkların toplamının önemliliği aşmasıyla ilgilidir."
      E: "Çarpım ilişkisi toplulaştırma riskinin tanımı değildir."
  kaynaklar:
  - mevzuat: "BDS 320 Bağımsız Denetimin Planlanması ve Yürütülmesinde Önemlilik"
    madde: "md. 9"
    alinti: "Toplulaştırma riski: Düzeltilmemiş ve tespit edilmemiş yanlışlıkların toplamının, bir bütün olarak finansal tablolar için belirlenen önemliliği aşma olasılığıdır"
