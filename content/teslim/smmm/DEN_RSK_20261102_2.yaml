    celdiriciler:
      B: "Md. 16 bunun kanıt olmadığını söyler."
      C: "Kontrol testleri gerekli olduğunda maddi doğrulama sonucuyla ikame edilemez."
      D: "Kontrol riski sıfırlanmaz."
      E: "Md. 16 otomatik/manuel ayrımı yapmaz."
