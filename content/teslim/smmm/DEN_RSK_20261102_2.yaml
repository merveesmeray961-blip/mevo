    madde: "md. 4"
    alinti: "Maddi doğrulama prosedürü: Yönetim beyanı düzeyindeki önemli yanlışlıkları tespit etmek üzere tasarlanmış denetim prosedürüdür. Maddi doğrulama prosedürleri aşağıdakilerden oluşur: (i) Detay testleri (işlem sınıfları, hesap bakiyeleri ve açıklamalara ilişkin detay testleri) ve (ii) Analitik maddi doğrulama prosedürleri"
