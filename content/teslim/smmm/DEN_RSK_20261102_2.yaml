  soru_bicimi: standart
  kok: "Denetçi, bir riski ciddi risk olarak belirlemiş ve bu riske yönelik bir kontrole güvenmek istemektedir. Kontrol, önceki denetimlerde etkin bulunmuş ve değişmemiştir. BDS 330'a göre denetçi ne yapar?"
  secenekler:
    A: "Önceki denetim kanıtlarına dayanarak üç denetimde bir test eder."
    B: "Kontrole güvenmekten vazgeçer ve hiçbir test yapmaz."
    C: "Yalnızca kontrolün tasarımını yeniden değerlendirir."
    D: "Güvenmek istediği bu kontrolü cari dönemde de test eder."
    E: "Kontrolü yalnızca ara dönemde test eder, dönem sonunu kapsamaz."
  dogru: D
  aciklama:
    dogru_neden: "BDS 330 md. 15 uyarınca denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik kontrollere güvenmek istiyorsa bu kontrolleri cari dönemde test eder. Önceki denetim kanıtlarına dayanma imkânı bu kontroller için tanınmamıştır."
    celdiriciler:
      A: "Üç denetimde bir kuralı ciddi riske yönelik kontroller için geçerli değildir."
      B: "Güvenmek istemek, testi gerektirir; vazgeçme zorunlu değildir."
      C: "Yalnızca tasarımın değerlendirilmesi işleyiş etkinliğini kanıtlamaz."
      E: "Md. 15 cari dönemde test ister; yalnızca ara dönemle yetinilmez."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 15"
    alinti: "Denetçi, ciddi risk olduğuna karar verdiği bir riske yönelik güvenmek istiyorsa, bu kontrolleri cari dönemde test eder"
