  aciklama:
    dogru_neden: "BDS 330 md. 8 uyarınca denetçi; risk değerlendirmesinin kontrollerin etkin işlediği beklentisini içermesi veya maddi doğrulama prosedürlerinin tek başına yeterli ve uygun kanıt sağlayamaması durumlarında kontrol testlerini tasarlar ve uygular."
    celdiriciler:
      A: "İç denetim birimi kontrol testlerinin koşulu değildir."
      C: "Önemlilik/performans önemliliği ilişkisi md. 8'de koşul değildir."
      D: "Kontrol testleriyle yetinmek md. 18 ile bağdaşmaz; maddi doğrulama da gerekir."
      E: "Yönetim talebi md. 8'de koşul değildir."
