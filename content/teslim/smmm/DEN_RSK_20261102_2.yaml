- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 önceki denetimlerden elde edilen kanıtlar"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Denetçi, güvenmek istediği bir kontrolü 2023 denetiminde test etmiş ve sonuçtan memnun kalmıştır. O tarihten bu yana kontrolde önemli bir değişiklik olmadığına dair kanıt elde etmiştir. Önceki denetim kanıtlarını kullanacaktır. BDS 330 md. 14'e göre denetçi bu kontrolü en az hangi sıklıkla test etmelidir?"
  secenekler:
    A: "Her denetimde, istisnasız tüm kontrolleri."
    B: "En az her beş denetimden birinde."
    C: "En az üç denetimde bir; bazı kontroller her denetimde."
    D: "Hiçbir zaman, çünkü önceki kanıt süresiz geçerlidir."
    E: "Yalnızca değişiklik yapıldığında; değişiklik yoksa hiç test etmez."
  dogru: C
  aciklama:
    dogru_neden: "BDS 330 md. 14 uyarınca önceki denetimlerden elde edilen kanıtlar kullanılacaksa ve değişiklik yoksa denetçi, en az her üç denetimden birinde kontrolleri test eder; sonraki iki dönemde güvenilen kontrollerin hiç test edilmemesi ihtimalini ortadan kaldırmak için bazı kontrolleri her denetimde test eder. Püf noktaları: Değişiklik varsa kontrol cari denetimde test edilir; değişiklik yoksa üç denetimde bir kuralı geçerlidir. Kuralın iki yönü vardır: üç denetimde bir ve bazılarının her denetimde testi."
    celdiriciler:
      A: "Md. 14 tüm kontrollerin her denetimde testini değil, en az üç denetimde bir testini ister."
      B: "Beş denetim md. 14'te öngörülen süre değildir."
      D: "Önceki kanıt süresiz geçerli değildir; md. 14 üç denetimde bir testi ister."
      E: "Değişiklik yoksa da en az üç denetimde bir test zorunludur."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 14(b)"
    alinti: "Bu tür değişikliklerin söz konusu olmaması durumunda denetçi, en az her üç denetimden birinde kontrolleri test eder. Ayrıca denetçi sonraki iki denetim döneminde güven duyulan kontrollerin testinin hiç yapılmaması ihtimalini ortadan kaldırmak için bazı kontrolleri her denetimde test eder"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

