  kok: "BDS 330'a göre denetçi hangi durumda kontrol testlerini tasarlar ve uygular?"
  secenekler:
    A: "Yalnızca işletmenin iç denetim birimi bulunuyorsa"
    B: "Risk değerlendirmesi etkin kontrol beklentisi içeriyorsa veya maddi doğrulama tek başına yetmiyorsa"
    C: "Yalnızca önemlilik tutarı performans önemliliğinin altında kalıyorsa ve denetim süresi üç ayı aşmıyorsa"
    D: "Her durumda, risk düzeyi ve maddi doğrulama imkânı ne olursa olsun yalnızca kontrol testleriyle yetinilirse"
    E: "Yalnızca yönetimin talebi olursa"
