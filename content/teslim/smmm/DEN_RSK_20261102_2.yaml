  zorluk: 1
  soru_bicimi: standart
  kok: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler standardına göre maddi doğrulama prosedürleri hangilerinden oluşur?"
  secenekler:
    A: "Kontrol testleri ile gözlem prosedürleri"
    B: "Risk değerlendirme prosedürleri ile sorgulama"
    C: "Yalnızca analitik prosedürler ile dış teyitler"
    D: "Kontrol testleri ile analitik maddi doğrulama prosedürleri"
    E: "Detay testleri ile analitik maddi doğrulama prosedürleri"
