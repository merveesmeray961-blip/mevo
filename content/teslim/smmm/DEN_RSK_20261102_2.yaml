      B: "Risk değerlendirme prosedürleri BDS 315'in konusudur."
      C: "Dış teyitler detay testi niteliğinde kullanılabilir ancak tanımdaki iki bileşen detay testleri ve analitik maddi doğrulamadır."
      D: "Kontrol testleri maddi doğrulama prosedürüne dâhil değildir."
