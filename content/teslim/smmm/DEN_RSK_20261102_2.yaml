  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 8"
    alinti: "Denetçinin yönetim beyanı düzeyinde ortaya çıkan “önemli yanlışlık” risklerine ilişkin yaptığı değerlendirme, kontrollerin etkin bir şekilde işlediğine dair bir beklenti içeriyorsa (denetçi, maddi doğrulama prosedürlerinin niteliğini, zamanlamasını ve kapsamını belirlerken kontrollerin işleyiş etkinliğini test etmeyi planlıyorsa) veya Maddi doğrulama prosedürleri, tek başlarına, yönetim beyanına ilişkin yeterli ve uygun denetim kanıtı sağlayamıyorsa"
