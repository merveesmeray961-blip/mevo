    B: "Çalışan sayısı yüksek olduğundan teklifi kabul eder."
    C: "Konuyu yönetimle müzakere eder ve denetim sözleşmesi teklifini kabul etmez."
    D: "Çerçeveyi kendisi değiştirerek sözleşmeyi imzalar."
    E: "Sorunu yönetimle konuşmadan sözleşmeyi reddeder."
