  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 402 hile ve mevzuata aykırılık"
  tip: "uygulama"
  zorluk: 2
  soru_bicimi: standart
  kok: "Hizmet alan işletme denetçisi, hizmet kuruluşunun hizmet alan işletmeye finansal tabloları etkileyen bir hile, mevzuata aykırılık veya düzeltilmemiş yanlışlık raporlayıp raporlamadığını öğrenmek istemektedir. BDS 402'ye göre denetçi bunu nasıl yapar?"
  secenekler:
    A: "Hizmet kuruluşunun tüm çalışanlarını doğrudan sorgular."
    B: "Hizmet kuruluşunun banka hesaplarını kendisi inceler."
    C: "Hizmet alan işletmenin yönetimini sorgular."
    D: "Hizmet kuruluşu denetçisinin raporundan bu bilgiyi varsayar."
    E: "Bu konuyu denetim kapsamı dışı sayar."
  dogru: C
  aciklama:
    dogru_neden: "BDS 402 md. 19 uyarınca hizmet alan işletme denetçisi, hizmet kuruluşunun hizmet alan işletmeye finansal tabloları etkileyen herhangi bir hile, mevzuata aykırılık veya düzeltilmemiş yanlışlık raporlayıp raporlamadığını veya hizmet alan işletmenin böyle bir durumdan haberdar olup olmadığını öğrenmek için hizmet alan işletmenin yönetimini sorgular."
    celdiriciler:
      A: "Md. 19 yönetimin sorgulanmasını öngörür; hizmet kuruluşu çalışanları doğrudan sorgulanmaz."
      B: "Banka hesaplarının incelenmesi md. 19'da öngörülmemiştir."
      D: "Rapordan varsayım md. 19'da yoktur."
      E: "Konu denetim kapsamı içindedir; md. 19 sorgulama ister."
  kaynaklar:
  - mevzuat: "BDS 402 Hizmet Kuruluşu Kullanan İşletmelerin Denetimi"
    madde: "md. 19"
    alinti: "Hizmet alan işletme denetçisi, hizmet kuruluşunun, hizmet alan işletmeye finansal tabloları etkileyen herhangi bir hile, mevzuata aykırılık veya düzeltilmemiş yanlışlık raporlayıp raporlamadığını veya hizmet alan işletmenin herhangi bir şekilde böyle bir durumdan haberdar olup olmadığını öğrenmek için hizmet alan işletmenin yönetimini sorgular"
