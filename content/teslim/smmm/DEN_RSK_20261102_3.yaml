  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 tüm kanıtların mütalaası"
  tip: "kavrama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Denetçi görüşünü oluştururken elde ettiği kanıtların bir kısmı yönetim beyanlarını doğrulamakta, bir kısmı ise bu beyanlarla çelişmektedir. BDS 330'a göre denetçi bu kanıtları nasıl değerlendirir?"
  secenekler:
    A: "Doğruluyor veya çelişiyor görünmesine bakmaksızın tüm ilgili kanıtları mütalaa eder."
    B: "Yalnızca beyanları doğrulayan kanıtları esas alır."
    C: "Çelişen kanıtları, beyanlarla uyumsuz oldukları için dışlar."
    D: "Kanıtlardan sayıca fazla olan grubu esas alır."
    E: "Çelişen kanıtları yönetimin açıklamasına bırakarak ve gerekçe göstermeden değerlendirmeden çıkarır."
  dogru: A
  aciklama:
    dogru_neden: "BDS 330 md. 26 uyarınca denetçi görüşünü oluştururken, yönetim beyanlarını doğruluyormuş veya bu beyanlarla çelişiyormuş gibi görünüp görünmediğine bakmaksızın ilgili tüm denetim kanıtlarını mütalaa eder. Püf noktaları: Taraflılık (yalnızca doğrulayıcı kanıt) risk değerlendirmesinde olduğu gibi sonuç aşamasında da kaçınılması gereken bir hatadır; kanıtın sayısı değil kalitesi ve ilgisi önemlidir."
    celdiriciler:
      B: "Yalnızca doğrulayıcı kanıt md. 26'ya aykırıdır."
      C: "Çelişkili kanıt dışlanamaz."
      D: "Sayıca çokluk ölçüt değildir; tüm kanıtlar mütalaa edilir."
      E: "Çelişkili kanıt çıkarılamaz; yönetim açıklaması kanıtın yerine geçmez."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 26"
    alinti: "Denetçi görüşünü oluştururken, finansal tablolardaki yönetim beyanlarını doğruluyormuş veya bu beyanlarla çelişiyormuş gibi görünüp görünmediğine bakmaksızın ilgili tüm denetim kanıtlarını mütalaa eder"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

