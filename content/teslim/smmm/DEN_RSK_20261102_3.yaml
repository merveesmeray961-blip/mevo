  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 risk düzeyi ve kanıt"
  tip: "bilgi"
  zorluk: 1
  soru_bicimi: standart
  kok: "BDS 330'a göre denetçinin yaptığı risk değerlendirmesi sonucunda belirlediği risk düzeyi yükseldikçe elde etmesi gereken denetim kanıtı nasıl değişir?"
  secenekler:
    A: "Risk düzeyi yükseldikçe daha az kanıt elde edilir ve prosedürler hafifler."
    B: "Kanıt miktarı risk düzeyinden bağımsızdır."
    C: "Yüksek riskte yalnızca yönetim beyanı alınır."
    D: "Risk düzeyi yalnızca kanıtın zamanlamasını etkiler."
    E: "Risk yükseldikçe daha ikna edici kanıt elde edilir."
  dogru: E
  aciklama:
    dogru_neden: "BDS 330 md. 7 uyarınca denetçi, yaptığı risk değerlendirmesi sonucunda belirlediği risk düzeyi ne kadar yüksekse, o kadar fazla ikna edici denetim kanıtı elde eder."
    celdiriciler:
      A: "Ters yönlü ifade md. 7'ye aykırıdır."
      B: "Kanıt miktarı risk düzeyine bağlıdır."
      C: "Yüksek riskte yönetim beyanı yeterli değildir."
      D: "Risk düzeyi niteliği, zamanlamayı ve kapsamı birlikte etkiler."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 7"
    alinti: "Yaptığı risk değerlendirmesi sonucunda belirlediği risk düzeyi ne kadar yüksekse, o kadar fazla ikna edici denetim kanıtı elde eder"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 kontrollerdeki sapmalar"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Denetçi, güvenmeyi düşündüğü bir kontrolde kontrol testleri sırasında sapmalar tespit etmiştir. İşletmenin cirosu 90 milyon TL'dir. BDS 330'a göre denetçi ne yapar?"
  secenekler:
    A: "Sapmaları önemsemez, kontrole güvenmeye devam eder, ek prosedür planlamayı gereksiz bulur ve yönetime bilgi vermez."
    B: "Özel sorgulamalar yapar; ilâve kontrol testi veya maddi doğrulamanın gerekip gerekmediğine karar verir."
    C: "Sapmaları yalnızca çalışma kâğıdına yazar."
    D: "Cirosuna bakarak sapmaları önemsiz sayar."
    E: "Doğrudan olumsuz görüş verir."
  dogru: B
  aciklama:
    dogru_neden: "BDS 330 md. 17 uyarınca güvenilen kontrollerde sapma tespit edilirse denetçi, bu hususları ve muhtemel sonuçlarını anlamak üzere özel sorgulamalar yapar ve uygulanan testlerin güven için uygun dayanak olup olmadığına, ilâve kontrol testlerinin gerekip gerekmediğine veya maddi doğrulama prosedürleriyle karşılık vermenin gerekip gerekmediğine karar verir. Püf noktaları: Ciro gereksiz veridir. Sapma otomatik olarak olumsuz görüş doğurmaz; önce sonuçları araştırılır."
    celdiriciler:
      A: "Sapmalar md. 17 gereği araştırılmak zorundadır."
      C: "Yalnızca not düşmek md. 17'yi karşılamaz."
      D: "Ciro sapmaların önemini belirleyen ölçüt değildir."
      E: "Olumsuz görüş md. 17'nin doğrudan sonucu değildir."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 17"
    alinti: "Güvenmeyi düşündüğü kontrollerde sapmalar tespit etmesi hâlinde denetçi, bu hususları ve muhtemel sonuçlarını anlamak üzere özel sorgulamalar yapar ve (Bkz.: A42 paragrafı): Uygulanan kontrol testlerinin kontrollere güven duyulması için uygun bir dayanak teşkil edip etmediğine, İlâve kontrol testlerinin gerekip gerekmediğine veya Maddi doğrulama prosedürlerini kullanmak suretiyle"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 ara dönemde maddi doğrulama"
  tip: "uygulama"
  zorluk: 3
  soru_bicimi: standart
  kok: "Denetçi, bir hesap için maddi doğrulama prosedürlerini ara dönemde uygulamıştır. BDS 330'a göre ara dönem sonuçlarını dönem sonuna genişletebilmek için denetçi aşağıdakilerden hangisini yapar?"
  secenekler:
    A: "Ara dönem sonucunu hiçbir ek işlem yapmadan, yönetim beyanına da bakmadan yıl sonuna taşır ve prosedürleri tamamlanmış sayar."
    B: "Yalnızca dönem sonu yönetim beyanını yeterli sayar."
    C: "Ara dönem prosedürlerini iptal edip yıl sonunu yeniden planlar."
    D: "Aradan geçen süre için kontrol testleriyle birlikte maddi doğrulama veya yeterliyse ilâve maddi doğrulama uygular."
    E: "Ara dönem sonrası için yalnızca analitik prosedürleri raporlar."
  dogru: D
  aciklama:
    dogru_neden: "BDS 330 md. 22 uyarınca maddi doğrulama prosedürlerinin ara dönemde uygulanması hâlinde denetçi, aradan geçen süre için kontrol testleriyle birlikte maddi doğrulama prosedürleri uygulayarak veya yeterli bulursa yalnızca ilâve maddi doğrulama prosedürleri uygulayarak kalan dönemi de kontrol etmiş olur. Püf noktaları: Ara dönemde beklenmeyen yanlışlık bulunursa md. 23 gereği risk değerlendirmesi ve kalan dönem prosedürleri yeniden değerlendirilir."
    celdiriciler:
      A: "Ek işlem yapmadan taşıma md. 22'ye aykırıdır."
      B: "Yönetim beyanı md. 22'deki prosedürlerin yerine geçmez."
      C: "Md. 22 iptali değil, kalan dönemin kapsanmasını ister."
      E: "Yalnızca raporlama md. 22'nin istediği prosedür değildir."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 22"
    alinti: "Aradan geçen süre için kontrol testleriyle birlikte maddi doğrulama prosedürleri uygulayarak veya Yeterli olduğuna karar vermesi durumunda sadece ilâve maddi doğrulama prosedürleri uygulayarak, ara dönemden sonra kalan dönemi de kontrol etmiş olur"
  gecerlilik: {"baslangic": "2021-01-01", "bitis": null, "yila_bagli_tutar": false}
  durum: taslak
  surum: 1
  uretim: {"kaynak_turu": "yapay_zeka", "model": "claude-sonnet-5-5"}

- id: TASLAK
  sinav: "smmm"
  bolum: ["SGS", "YET"]
  ders: "DEN"
  unite: "Risk, önemlilik ve planlama"
  konu: "RSK"
  kazanim: "BDS 330 denetimin tamamlanması"
  tip: "kavrama"
  zorluk: 2
  soru_bicimi: standart
  kok: "BDS 330'a göre denetçi, denetimi tamamlamadan önce uygulanan prosedürlere ve elde edilen kanıtlara dayanarak neyi değerlendirir?"
  secenekler:
    A: "Denetim ücretinin makul olup olmadığını"
    B: "Önceki dönem denetçisinin raporunun doğruluğunu, imza yetkisinin geçerliliğini ve arşivlenme biçimini"
    C: "Yönetimin gelecek yıl hedeflerinin gerçekçiliğini"
    D: "Denetim ekibi üyelerinin performansını"
    E: "Önemli yanlışlık risklerine ilişkin değerlendirmelerinin uygunluğunun devam edip etmediğini"
  dogru: E
  aciklama:
    dogru_neden: "BDS 330 md. 25 uyarınca denetçi, denetimi tamamlamadan önce, uygulanan prosedürlere ve elde edilen kanıtlara dayanarak yönetim beyanı düzeyinde önemli yanlışlık risklerine ilişkin değerlendirmelerinin uygunluğunun devam edip etmediğini değerlendirir."
    celdiriciler:
      A: "Ücret md. 25'in konusu değildir."
      B: "Önceki denetçi raporu md. 25'in konusu değildir."
      C: "Yönetim hedefleri md. 25'in konusu değildir."
      D: "Ekip performansı md. 25'in konusu değildir."
  kaynaklar:
  - mevzuat: "BDS 330 Bağımsız Denetçinin Değerlendirilmiş Risklere Karşı Yapacağı İşler"
    madde: "md. 25"
