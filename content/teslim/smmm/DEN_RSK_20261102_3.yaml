  konu: "RSK"
  kazanim: "BDS 315 ciddi risk"
  tip: "kavrama"
  zorluk: 3
  soru_bicimi: standart
  kok: "BDS 315'e göre ciddi risk, yapısal risk aralığının üst sınırına yakın olan riskler yanında, başka bir koşulda da söz konusudur. Denetçi, işletmenin olağan iş akışı dışında gerçekleşen belirlenmiş önemli ilişkili taraf işlemlerinden doğan bir riski hangi esasa göre ciddi risk sayar?"
  secenekler:
    A: "Yapısal risk aralığının alt sınırına yakın olduğu ve kontrollerin etkin işlediği gerekçesiyle ek önleme gerek kalmadığı için"
    B: "Yalnızca kontrol riskinin yüksek olması nedeniyle"
    C: "Diğer BDS'lerin (BDS 550 md. 18) hükümleri gereği ciddi risk sayılması gerektiği için"
    D: "İşlemler yönetimce onaylandığı için ciddi risk sayılmaz"
    E: "Yalnızca işlem tutarı önemliliğin iki katını aştığında"
  dogru: C
  aciklama:
    dogru_neden: "BDS 315 ciddi risk tanımının (ii) bendi, diğer BDS'lerde yer alan hükümler uyarınca ciddi risk olarak ele alınması gereken riskleri kapsar; dipnotta BDS 240 md. 27 ve BDS 550 md. 18 gösterilmiştir. BDS 550 md. 18 olağan iş akışı dışındaki önemli ilişkili taraf işlemlerini önemli risklere yol açan işlemler olarak değerlendirmeyi ister. Püf noktaları: Ciddi risk iki yoldan oluşur: yapısal risk üst sınırı veya diğer BDS hükümleri."
    celdiriciler:
      A: "Alt sınır ciddi risk ölçütü değildir; tanım üst sınırı arar."
      B: "Kontrol riski ciddi risk tanımının ölçütü değildir."
      D: "Yönetim onayı riski ortadan kaldırmaz."
      E: "Tutar eşiği tanımda yoktur."
  kaynaklar:
  - mevzuat: "BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi"
    madde: "md. 12"
    alinti: "Diğer BDS’lerde yer alan hükümler uyarınca ciddi risk olarak ele alınması gereken, belirlenmiş “önemli yanlışlık” riskidir"
  - mevzuat: "BDS 315 Önemli Yanlışlık Risklerinin Belirlenmesi ve Değerlendirilmesi"
