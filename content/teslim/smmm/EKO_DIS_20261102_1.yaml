- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: devalüasyon
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "1 dolar 45 ₺ iken 50 ₺'ye yükselmiştir. TL'nin dolar karşısındaki değer kaybı yüzde kaçtır?"
  secenekler:
    A: "%5"
    B: "%10"
    C: "%11,1"
    D: "%90"
    E: "%111,1"
  dogru: B
  aciklama:
    dogru_neden: "1 ₺'nin dolar değeri 1/45'ten 1/50'ye düşmüştür. TL'nin değer kaybı 1 - 45/50 = %10'dur. Doların TL değeri ise (50 - 45) / 45 = %11,1 artmıştır; iki yüzde birbirinden farklıdır."
    hesap_adimlari:
    - "TL'nin dolar değeri: 1/45 -> 1/50"
    - "Değer kaybı = 1 - 45/50 = 0,10"
    celdiriciler:
      A: "5, kurdaki TL farkıdır (50 - 45); yüzde değildir."
      C: "Doların TL değerindeki artış hesaplanmıştır (5 / 45); soru TL'nin değer kaybını sormaktadır."
      D: "45 / 50 TL'nin kalan değer oranıdır (%90); kayıp bunun 100 eksiğidir."
      E: "50 / 45 oranı yüzde olarak alınmıştır; bu doların değerinin eski değere oranıdır."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§3"
    alinti: "Kur 30 ₺'den 36 ₺'ye çıkarsa doların TL değeri (36 − 30)/30 = **%20** artar; ama 1 ₺'nin dolar değeri 1/30'dan 1/36'ya düşer, yani TL **%16,67** değer kaybeder (1 − 30/36)."
  dogrulama:
    python: "sonuc = (1 - 45 / 50) * 100"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

