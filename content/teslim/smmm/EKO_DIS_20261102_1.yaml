- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: devalüasyon
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir firmanın 100.000 $ döviz borcu ve ayrıca 2.000.000 ₺ tutarında TL cinsinden banka kredisi vardır. Kur 30 ₺'den 36 ₺'ye çıkarsa firmanın döviz borcunun TL karşılığı kaç ₺ artar?"
  secenekler:
    A: "6"
    B: "100.000"
    C: "600.000"
    D: "3.000.000"
    E: "3.600.000"
  dogru: C
  aciklama:
    dogru_neden: "Devalüasyonla döviz borcunun ulusal para karşılığı artar (bilanço etkisi). Eski TL karşılığı 100.000 x 30 = 3.000.000 ₺, yeni karşılığı 100.000 x 36 = 3.600.000 ₺'dir; artış 600.000 ₺'dir. Püf noktaları: TL cinsinden kredi kur değişmesinden etkilenmez, gereksiz veridir. Sorulan yeni borç değil, artıştır."
    hesap_adimlari:
    - "Eski borç = 100.000 x 30 = 3.000.000"
    - "Yeni borç = 100.000 x 36 = 3.600.000"
    - "Artış = 3.600.000 - 3.000.000 = 600.000"
    celdiriciler:
      A: "6 kurdaki artıştır (36 - 30); borç tutarıyla çarpılmamıştır."
      B: "100.000 döviz borcunun dolar tutarıdır; TL karşılığındaki artış değildir."
      D: "3.000.000 borcun eski TL karşılığıdır; artış değildir."
      E: "3.600.000 borcun yeni TL karşılığıdır; soru artışı sormaktadır."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§4.3"
    alinti: "**Bilanço etkisi:** Döviz borcu olan firma ve kamunun borcunun ulusal para karşılığı artar."
  dogrulama:
    python: "sonuc = 100000 * (36 - 30)"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
