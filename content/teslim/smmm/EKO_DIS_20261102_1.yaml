      C: "Cari açık dış dünyayla cari işlemlerle, bütçe açığı kamu gelir-giderleriyle ilgilidir; aynı kavram değildir."
      D: "Cari denge mal ticaretinin yanında hizmet, birincil ve ikincil gelir kalemlerini de içerir."
