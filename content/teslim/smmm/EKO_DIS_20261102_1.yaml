- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: ödemeler dengesi
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir ülkenin bir yıldaki dış işlemleri (milyar $) şöyledir: mal ihracatı 120, mal ithalatı 95, hizmetler dengesi -10, birincil gelir dengesi -8, ikincil gelir dengesi +3. Cari işlemler dengesi kaç milyar $'dır?"
  secenekler:
    A: "-10"
    B: "4"
    C: "10"
    D: "15"
    E: "25"
  dogru: C
  aciklama:
    dogru_neden: "Cari işlemler dengesi mal, hizmet, birincil gelir ve ikincil gelir dengelerinin toplamıdır: (120 - 95) - 10 - 8 + 3 = 10 milyar $ (fazla)."
    hesap_adimlari:
    - "Mal ticaret dengesi = 120 - 95 = +25"
    - "Cari denge = 25 - 10 - 8 + 3 = +10"
    celdiriciler:
      A: "İşaret hatası yapılmıştır; cari denge pozitif (fazla) çıkar."
      B: "İkincil gelir dengesi eklenmesi gerekirken çıkarılmıştır (25 - 10 - 8 - 3 = 4)."
      D: "Yalnız mal ve hizmet dengesi alınmıştır (25 - 10); birincil ve ikincil gelir dengeleri unutulmuştur."
      E: "Yalnız dış ticaret (mal) dengesi alınmıştır; cari denge hizmetleri ve gelir kalemlerini de içerir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§1.2"
    alinti: "| Cari işlemler hesabı | Mal ticareti, hizmetler (turizm, taşımacılık), birincil gelir (ücret, faiz, kâr payı), ikincil gelir (işçi dövizleri, hibe gibi karşılıksız cari transferler) |"
  dogrulama:
    python: "sonuc = (120 - 95) - 10 - 8 + 3"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

