- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: devalüasyon
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "A ülkesinde merkez bankası sabit kur rejimi çerçevesinde kuru 30 ₺'den 36 ₺'ye resmen çıkarmıştır. B ülkesinde ise esnek kur rejiminde piyasa koşullarıyla kur 30 ₺'den 36 ₺'ye yükselmiştir. Bu gelişmeler ve TL'nin dolar karşısındaki değer kaybı için aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "A'da depresiyasyon, B'de devalüasyon olmuştur; TL'nin değer kaybı %20'dir ve kur rejimi fark yaratmaz."
    B: "A'da devalüasyon, B'de depresiyasyon olmuştur; her ikisinde TL yaklaşık %16,67 değer kaybetmiştir."
    C: "Her ikisinde de devalüasyon olmuştur; TL'nin değer kaybı %20'dir."
    D: "A'da revalüasyon, B'de apresiyasyon olmuştur; TL yaklaşık %16,67 değer kazanmıştır."
    E: "A'da devalüasyon, B'de apresiyasyon olmuştur; TL'nin değer kaybı %20'dir."
  dogru: B
  aciklama:
    dogru_neden: "Sabit kurda otoritenin kararıyla resmî değerin düşürülmesi devalüasyon, esnek kurda piyasa koşullarıyla oluşan değer kaybı depresiyasyondur. Kur 30'dan 36'ya çıkınca doların TL değeri %20 artar ama TL'nin değer kaybı 1 - 30/36 = %16,67'dir. Püf noktaları: Terimi belirleyen şey kurun nasıl değiştiğidir (karar mı, piyasa mı). %20 doların artışıdır, TL'nin kaybı değildir."
    celdiriciler:
      A: "Adlandırma ters kurulmuştur; ayrıca TL'nin değer kaybı %20 değil %16,67'dir."
      C: "Esnek kurdaki piyasa kaynaklı değer kaybı devalüasyon değil depresiyasyondur; %20 doların artışıdır."
      D: "Kur yükseldiği için TL değer kaybetmiştir; revalüasyon ve apresiyasyon değer artışını anlatır."
      E: "Esnek kurda TL'nin değer kaybı apresiyasyon değil depresiyasyondur; %20 doların TL değerindeki artıştır."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§4.1"
    alinti: "Kısacası devalüasyon bir politika kararıdır; depresiyasyon piyasa hareketidir."
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§3"
    alinti: "Kur 30 ₺'den 36 ₺'ye çıkarsa doların TL değeri (36 − 30)/30 = **%20** artar; ama 1 ₺'nin dolar değeri 1/30'dan 1/36'ya düşer, yani TL **%16,67** değer kaybeder (1 − 30/36)."
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Aynı sürede A ülkesi 30 kumaş veya 60 şarap, B ülkesi 15 kumaş veya 45 şarap üretebilmektedir. Ticaretten her iki ülke de kazanç sağlayacaksa 1 kumaş kaç şaraba değiştirilmelidir?"
  secenekler:
    A: "0,33 ile 0,5 şarap arasında"
    B: "1 ile 2 şarap arasında"
    C: "3 şaraptan fazla"
    D: "2 ile 3 şarap arasında"
    E: "2 şaraptan az"
  dogru: D
  aciklama:
    dogru_neden: "1 kumaşın fırsat maliyeti A'da 60 / 30 = 2 şarap, B'de 45 / 15 = 3 şaraptır; kumaşta A karşılaştırmalı üstündür. Değişim oranı iki ülkenin fırsat maliyetleri arasında, yani 1 kumaş = 2 ile 3 şarap arasında olursa iki ülke de kazanır. Püf noktaları: Tablo belirli sürede üretim miktarını verdiğinden fırsat maliyeti 'diğer mal / bu mal' diye kurulur; kesri ters kurarsan 0,33 ile 0,5 aralığına düşersin."
    celdiriciler:
      A: "Kesirler ters kurulmuştur (şarabın kumaş cinsinden maliyeti); soru 1 kumaşın şarap karşılığını sormaktadır."
      B: "1 ile 2 aralığı iki ülkenin fırsat maliyetlerini kapsamaz; A'nın maliyeti 2, B'nin 3'tür."
      C: "3'ten fazla oranda B ticaret yapmaz, çünkü kumaşı kendisi 3 şarap maliyetiyle üretebilir."
      E: "2'den az oranda A ticaret yapmaz, çünkü kumaşı kendisi 2 şarap maliyetiyle üretebilir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§2.2"
    alinti: "Değişim oranı 1 şarap = 0,89 ile 1,2 kumaş arasında olursa iki ülke de kazanır."
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
