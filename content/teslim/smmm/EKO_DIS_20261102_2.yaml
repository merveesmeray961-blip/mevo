- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Dış ekonomi
  konu: DIS
  kazanim: karşılaştırmalı üstünlük
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "A ülkesi 1 birim şarabı 100 saatte, 1 birim kumaşı 50 saatte; B ülkesi 1 birim şarabı 180 saatte, 1 birim kumaşı 120 saatte üretebilmektedir. B ülkesinde 1 birim şarabın fırsat maliyeti kaç birim kumaştır?"
  secenekler:
    A: "0,67"
    B: "1,5"
    C: "2"
    D: "60"
    E: "180"
  dogru: B
  aciklama:
    dogru_neden: "Tabloda birim başına emek saati verilmiştir. B'de 1 şarap üretmek 180 saat, 1 kumaş 120 saat gerektirdiğinden 1 şarabın fırsat maliyeti 180 / 120 = 1,5 kumaştır."
    hesap_adimlari:
    - "B'de 1 şarap = 180 saat; 1 kumaş = 120 saat"
    - "1 şarabın fırsat maliyeti = 180 / 120 = 1,5 kumaş"
    celdiriciler:
      A: "Kesir ters kurulmuştur (120 / 180 = 0,67); bu 1 kumaşın fırsat maliyetidir (şarap cinsinden)."
      C: "2, A ülkesinin 1 şarap için fırsat maliyetidir (100 / 50); soru B'yi sormaktadır."
      D: "60, iki ülkedeki saat farkıdır (180 - 120); fırsat maliyeti oranla bulunur."
      E: "180, B'de 1 şarabın saat cinsinden maliyetidir; fırsat maliyeti kumaş cinsinden ifade edilir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/DIS"
    madde: "§2.2"
    alinti: "Portekiz'de 1 şarap = 80/90 = 0,89 kumaş; İngiltere'de 1 şarap = 120/100 = 1,2 kumaş."
  dogrulama:
    python: "sonuc = 180 / 120"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

