- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: esneklik
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir firmanın ürününün fiyatı 8 ₺'den 12 ₺'ye çıkarılınca talep edilen miktar 60 adetten 40 adete düşmektedir. Yay (orta nokta) yöntemiyle hesaplanan talebin fiyat esnekliğinin mutlak değeri kaçtır?"
  secenekler:
    A: "0,67 (esnek değil)"
    B: "0,8 (esnek değil)"
    C: "1 (birim esnek)"
    D: "1,5 (esnek)"
    E: "5 (esnek)"
  dogru: C
  aciklama:
    dogru_neden: "Yay esnekliğinde yüzde değişmeler iki değerin ortalamasına bölünerek bulunur. Miktar değişmesi -20 / 50 = -0,4; fiyat değişmesi 4 / 10 = 0,4 olduğundan esneklik -1'dir; mutlak değeri 1'dir ve talep birim esnektir."
    hesap_adimlari:
    - "Miktar ortalaması (60 + 40) / 2 = 50; değişme -20 / 50 = -0,4"
    - "Fiyat ortalaması (8 + 12) / 2 = 10; değişme 4 / 10 = 0,4"
    - "Esneklik = -0,4 / 0,4 = -1; mutlak değer 1"
    celdiriciler:
      A: "Başlangıç değerleri kullanılmıştır (-%33,3 / %50 = 0,67); soruda yay (orta nokta) yöntemi istenmiştir."
      B: "Miktar değişmesi ortalamaya (-%40), fiyat değişmesi başlangıç değere (%50) bölünerek iki yöntem karıştırılmıştır."
      D: "Yeni değerler baz alınmıştır (%50 / %33,3 = 1,5); yay yönteminde ortalama kullanılır."
      E: "Mutlak değişmeler oranlanmıştır (20 / 4 = 5); esneklik yüzde değişmelerin oranıdır."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§1"
    alinti: "**Yay (orta nokta) esnekliği:** İki nokta arasında yüzde değişmeler, iki değerin ortalamasına bölünerek bulunur."
  dogrulama:
    python: "dq = (40 - 60) / ((40 + 60) / 2)\ndp = (12 - 8) / ((12 + 8) / 2)\nsonuc = abs(dq / dp)"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: tüketici ve üretici fazlası
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir mal piyasasında talep P = 150 - Q, arz P = 30 + Q doğrularıyla gösterilmektedir (P: ₺, Q: adet). Devlet, üreticiden satılan her birim için 20 ₺ vergi almaktadır; vergi sonrası arz P = 50 + Q olmaktadır. Bu verginin yol açtığı ölü ağırlık kaybı kaç ₺'dir?"
  secenekler:
    A: "50"
    B: "100"
    C: "200"
    D: "500"
    E: "1.000"
  dogru: B
  aciklama:
    dogru_neden: "Vergi öncesi denge miktarı 150 - Q = 30 + Q ile Q = 60'tır. Vergi sonrası 150 - Q = 50 + Q ile Q = 50 olur. Ölü ağırlık kaybı bir üçgendir: taban 20 (vergi tutarı), yükseklik 60 - 50 = 10; 20 x 10 / 2 = 100 ₺."
    hesap_adimlari:
    - "Vergi öncesi denge: 150 - Q = 30 + Q, Q = 60"
    - "Vergi sonrası denge: 150 - Q = 50 + Q, Q = 50"
    - "Ölü ağırlık kaybı = 20 x (60 - 50) / 2 = 100"
    celdiriciler:
      A: "Üçgenin tabanı olarak verginin yarısı (10) alınmıştır (10 x 10 / 2 = 50); taban vergi tutarının tamamıdır."
      C: "Üçgen alanındaki 2'ye bölme unutulmuştur (20 x 10 = 200)."
      D: "Vergi sonrası miktar ile miktar azalışı çarpılmıştır (50 x 10); bu ölü ağırlık kaybı değildir."
      E: "Vergi geliri hesaplanmıştır (20 x 50 = 1.000); vergi geliri devlete aktarımdır, ölü ağırlık kaybı değildir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§2"
    alinti: "Vergi, fiyat tavanı, fiyat tabanı, kota veya piyasa gücü bazı faydalı işlemleri engeller; kaybolan fazlaya **ölü ağırlık kaybı (refah kaybı)** denir."
  dogrulama:
    python: "q0 = (150 - 30) / 2\nq1 = (150 - 50) / 2\nsonuc = 20 * (q0 - q1) / 2"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: farksızlık eğrileri
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir tüketicinin faydası U = X · Y biçimindedir ve bu fayda fonksiyonunda MRS = Y / X'tir. Tüketicinin geliri 600 ₺, malların fiyatları Px = 5 ₺ ve Py = 2 ₺'dir. Tüketici dengesinde Y malından kaç birim satın alınır?"
  secenekler:
    A: "60"
    B: "150"
    C: "300"
    D: "600"
    E: "9.000"
  dogru: B
  aciklama:
    dogru_neden: "Denge koşulu MRS = Px / Py olduğundan Y / X = 5 / 2 ve Y = 2,5X'tir. Bütçede 5X + 2(2,5X) = 600 ile 10X = 600, X = 60 bulunur. Buradan Y = 2,5 x 60 = 150 birimdir."
    hesap_adimlari:
    - "Denge koşulu: Y / X = 5 / 2, yani Y = 2,5X"
    - "Bütçe: 5X + 2 x 2,5X = 600, X = 60"
    - "Y = 2,5 x 60 = 150"
    celdiriciler:
      A: "60, X malının miktarıdır; soru Y malını sormaktadır."
      C: "300, Y malına harcanan tutardır (₺); birim sayısı için Py = 2'ye bölünmelidir."
      D: "600, tüketicinin gelirinin tamamıdır; Y miktarı değildir."
      E: "9.000, X x Y çarpımı olan fayda düzeyidir (60 x 150); miktar değildir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§3"
    alinti: "**Tüketici dengesi**, bütçe doğrusunun ulaşılabilen en yüksek farksızlık eğrisine **teğet** olduğu noktadır: MRS = Px / Py."
  dogrulama:
    python: "px = 5\npy = 2\ngelir = 600\nx = gelir / (2 * px)\nsonuc = (gelir - px * x) / py"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

