    celdiriciler:
      B: "Karar yalnız fiyata göre değil, marjinal faydanın fiyata oranına göre verilir; bu oran Y'de daha düşüktür."
      C: "Denge için bütçenin tamamen harcanması tek başına yetmez; MUx / Px = MUy / Py de sağlanmalıdır (6 ≠ 5)."
      D: "X'in son lirası daha yüksek fayda sağladığından X azaltılmaz, artırılır."
      E: "Oranlar eşit değilse faydayı artıran düzenleme, oranı yüksek maldan fazla alıp düşük maldan az almaktır; iki maldan da eşit miktar azaltmak toplam faydayı artırmaz."
