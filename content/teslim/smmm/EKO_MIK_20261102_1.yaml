- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: EKO
  unite: Mikro iktisat
  konu: MIK
  kazanim: piyasa yapıları
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir tekelcinin talep fonksiyonu P = 100 - Q, marjinal maliyeti her düzeyde 40 ₺ ve toplam sabit maliyeti 500 ₺'dir. Bu tekelin, piyasanın tam rekabetle işlemesi durumuna göre yol açtığı ölü ağırlık kaybı kaç ₺'dir?"
  secenekler:
    A: "30"
    B: "70"
    C: "450"
    D: "900"
    E: "1.800"
  dogru: C
  aciklama:
    dogru_neden: "Tekel MR = MC koşulunda üretir: 100 - 2Q = 40, Q = 30 ve P = 70. Tam rekabette P = MC olduğundan 100 - Q = 40 ve Q = 60'tır. Ölü ağırlık kaybı = (70 - 40) x (60 - 30) / 2 = 450 ₺. Püf noktaları: Sabit maliyet (500 ₺) ne tekelin üretim miktarını ne de ölü ağırlık kaybını etkiler, gereksiz veridir. Önce MR = MC ile miktar ve fiyatı bul, sonra üçgen alanı al."
    hesap_adimlari:
    - "MR = 100 - 2Q = 40, Q = 30, P = 70"
    - "Tam rekabet: P = MC, 100 - Q = 40, Q = 60"
    - "Ölü ağırlık kaybı = (70 - 40) x (60 - 30) / 2 = 450"
    celdiriciler:
      A: "30 tekelin üretim miktarıdır; ölü ağırlık kaybı değildir."
      B: "70 tekelin belirlediği fiyattır; ölü ağırlık kaybı değildir."
      D: "Tekel kârı hesaplanmıştır ((70 - 40) x 30 = 900); kâr ölü ağırlık kaybı değildir."
      E: "Fiyat farkı tam rekabet miktarıyla çarpılmıştır ((70 - 40) x 60 = 1.800); alan, miktar farkı (60 - 30) kullanılarak ve 2'ye bölünerek bulunur."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§5"
    alinti: "Tekelin ölü ağırlık kaybı = (60 − 20) × (80 − 40) / 2 = **800**."
  dogrulama:
    python: "mc = 40\nqm = (100 - mc) / 2\npm = 100 - qm\nqc = 100 - mc\nsonuc = (pm - mc) * (qc - qm) / 2"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

