  soru_bicimi: standart
  kok: "Bir malın talebi P = 50 - Q doğrusuyla gösterilmekte ve piyasa fiyatı 30 ₺ olarak oluşmaktadır. Bu piyasada tüketici fazlası kaç ₺'dir?"
  secenekler:
    A: "20"
    B: "200"
    C: "400"
    D: "600"
    E: "1.000"
  dogru: B
  aciklama:
    dogru_neden: "P = 30 iken Q = 50 - 30 = 20 birim satılır. Tüketici fazlası talep eğrisinin altı ile fiyatın üstü arasındaki üçgendir: taban 20, yükseklik 50 - 30 = 20; 20 x 20 / 2 = 200 ₺."
    hesap_adimlari:
    - "Denge miktarı: Q = 50 - 30 = 20"
    - "Üçgenin yüksekliği: 50 - 30 = 20"
    - "TF = 20 x 20 / 2 = 200"
    celdiriciler:
      A: "20 satılan miktardır; tüketici fazlası değildir."
      C: "Üçgen alanındaki 2'ye bölme unutulmuştur (20 x 20 = 400)."
      D: "Toplam harcama hesaplanmıştır (30 x 20 = 600); tüketici fazlası harcama değildir."
      E: "Talep doğrusunun fiyat ekseni kesim noktası (50) ile miktar çarpılmıştır (50 x 20); alan üçgendir."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§2"
    alinti: "Doğrusal eğrilerde alanlar üçgendir: taban × yükseklik / 2."
  dogrulama:
    python: "tavan = 50\nfiyat = 30\nq = tavan - fiyat\nsonuc = q * (tavan - fiyat) / 2"
  gecerlilik: {baslangic: '2026-11-02', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

