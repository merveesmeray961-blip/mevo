  kazanim: esneklik
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir kişinin geliri %10 arttığında; X malına talebi %15 artmakta, Y malına talebi %4 artmakta, Z malına talebi ise %5 azalmaktadır. Fiyatlar sabittir. Gelir esnekliklerine göre bu malların sınıflandırılması aşağıdakilerden hangisidir?"
  secenekler:
    A: "X zorunlu mal, Y lüks mal, Z düşük maldır."
    B: "X lüks mal, Y zorunlu mal, Z düşük maldır."
    C: "X lüks mal, Y düşük mal, Z zorunlu maldır."
    D: "X ve Y lüks mal, Z zorunlu maldır."
    E: "X, Y ve Z normal mal olup yalnızca X lüks maldır."
  dogru: B
  aciklama:
    dogru_neden: "Gelir esnekliği miktardaki yüzde değişmenin gelirdeki yüzde değişmeye oranıdır. X için 15 / 10 = 1,5 (1'den büyük; lüks mal), Y için 4 / 10 = 0,4 (0 ile 1 arasında; zorunlu mal), Z için -5 / 10 = -0,5 (negatif; düşük mal). Püf noktaları: Talebin artması malı lüks yapmaz; ölçüt katsayının 1'den büyük olmasıdır. Pozitif ama 1'den küçük katsayı zorunlu (normal) mal, negatif katsayı düşük maldır."
    celdiriciler:
      A: "X'in katsayısı 1,5 olduğundan lüks, Y'nin katsayısı 0,4 olduğundan zorunlu maldır; sınıflandırma ters yapılmıştır."
      C: "Y'nin talebi gelirle birlikte arttığı için düşük mal değildir; katsayısı 0,4 ile zorunlu maldır. Z'nin talebi azaldığı için zorunlu değil düşük maldır."
      D: "Y'nin katsayısı 0,4'tür; 1'den küçük olduğundan lüks değil zorunlu maldır. Z negatif katsayıyla düşük maldır."
      E: "Z'nin katsayısı negatiftir (-0,5); bu nedenle normal değil düşük maldır."
  kaynaklar:
  - mevzuat: "Hakemli konu anlatımı — EKO/MIK"
    madde: "§1"
    alinti: "**Gelir esnekliği** = miktardaki % değişme / gelirdeki % değişme. Pozitifse **normal mal** (1'den büyükse lüks, 0 ile 1 arasında zorunlu mal), negatifse **düşük mal**."
