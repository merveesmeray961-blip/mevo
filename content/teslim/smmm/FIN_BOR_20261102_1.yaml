  kok: AB İşletmesi 1 Kasım 2026 tarihinde bankadan 3 ay vadeli 300.000 ₺ tutarında, yıllık %48 faizli kredi kullanmıştır. Faiz vade sonunda ana para ile birlikte ödenecektir. Yıl 360 gün, ay 30 gün kabul edilerek 31 Aralık 2026 itibarıyla bu krediye ilişkin cari döneme düşen faiz tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: 12.000 ₺ (30 gün)
    B: 24.000 ₺ (60 günlük)
    C: 36.000 ₺ (90 gün)
    D: 144.000 ₺ (1 yıllık)
    E: 324.000 ₺ (anapara + 1 yıllık faiz)
  dogru: B
  aciklama:
    dogru_neden: Faiz, bir yıla kadar vadeli borçlanma gideri olarak THP 660'ta izlenir. Cari döneme düşen süre 1 Kasım - 31 Aralık = 60 gündür. Faiz = 300.000 × 0,48 × 60 / 360 = 24.000 ₺'dir.
    celdiriciler:
      A: 12.000 ₺ yalnızca bir ayın (30 gün) faizidir; 1 Kasım - 31 Aralık arası iki aydır.
      C: 36.000 ₺ vadenin tamamı olan üç ayın (90 gün) faizidir; cari döneme yalnızca iki ay isabet eder.
      D: 144.000 ₺ bir yıllık faizdir (300.000 × %48).
      E: 324.000 ₺ anapara ile bir yıllık faizin toplamıdır.
    hesap_adimlari:
    - 'Cari döneme düşen süre: 60 gün'
    - 'Faiz: 300.000 × 0,48 × 60 / 360 = 24.000 ₺'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 660 Kısa Vadeli Borçlanma Giderleri
    alinti: Bir yıla kadar vadeli olan borçlanmalarla ilgili olarak yüklenilen ve varlıkların maliyetine eklenmeyen faiz ve benzeri diğer giderlerin izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 300 Banka Kredileri
    alinti: Alınan kısa vadeli krediler bu hesaba alacak, ödenmeleri halinde borç kaydedilir.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
