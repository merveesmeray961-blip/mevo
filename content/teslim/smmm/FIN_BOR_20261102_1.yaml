      C: Kur artışı borcu artırdığından zarar doğurur; kambiyo kârı yazılamaz.
      D: Değerleme farkı için banka hesabından ödeme olmamıştır; borç artışı 300 hesabına yazılır.
      E: Kredi kısa vadeli olduğundan kur farkı 661 değil 660 hesabına yazılır.
    hesap_adimlari:
    - 'Yeni değer: 20.000 × 42 = 840.000 ₺'
    - 'Artış: 840.000 - 800.000 = 40.000 ₺'
