  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 280
    alinti: Yabancı paralar borsa rayici ile değerlenir.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 66 Finansman Giderleri
