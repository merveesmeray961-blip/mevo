  kok: M İşletmesi 1 Nisan 2026'da kur 46 ₺ iken 15.000 Avro tutarında kısa vadeli kredi kullanmıştır. 1 Eylül 2026'da kur 47 ₺ iken 5.000 Avro ödemiştir. 31 Aralık 2026'da Avro kuru 48,20 ₺'dir. Kredi nedeniyle 2026 yılında finansman gideri olarak muhasebeleştirilecek toplam kur farkı tutarı aşağıdakilerden hangisidir?
  secenekler:
    A: 5.000 ₺
    B: 22.000 ₺ (yalnızca değerleme)
    C: 27.000 ₺ (5.000 + 22.000)
    D: 33.000 ₺ (15.000 × 2,20)
    E: 48.200 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Ödenen 5.000 Avro için kur farkı (47 − 46) × 5.000 = 5.000 ₺ gerçekleşmiştir. Kalan 10.000 Avro yıl sonunda borsa rayici ile değerlenir (VUK md. 280): (48,20 − 46) × 10.000 = 22.000 ₺. Toplam 27.000 ₺ olup THP 66 ve 656 uyarınca finansman gideri olarak muhasebeleştirilir. Püf noktaları: Ödenen kısım ödeme günü kuruyla, kalan kısım yıl sonu kuruyla ayrı ayrı hesaplanır; tamamına yıl sonu kuru uygulamak yanlıştır.'
    celdiriciler:
      A: 5.000 ₺ yalnızca ödeme tarihindeki gerçekleşmiş kur farkıdır; yıl sonu değerleme farkı da eklenmelidir.
      B: 22.000 ₺ yalnızca yıl sonunda kalan 10.000 Avro'nun değerleme farkıdır; ödeme tarihindeki fark da eklenmelidir.
      D: 33.000 ₺ 15.000 Avro'nun tamamı için yıl sonu kuruna göre bulunur; ödenen kısım ödeme tarihindeki kurla gerçekleşmiştir.
      E: 48.200 ₺ kur farkı değil kurun 1.000 ile çarpılmış hâlidir; anlamsızdır.
    hesap_adimlari:
    - 'Ödeme günü farkı: (47 - 46) × 5.000 = 5.000 ₺'
    - 'Yıl sonu farkı: (48,20 - 46) × 10.000 = 22.000 ₺'
    - 'Toplam: 27.000 ₺'
