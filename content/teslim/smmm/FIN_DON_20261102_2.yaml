  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: '(S3) A.Ş.''nin 193 Peşin Ödenen Vergiler ve Fonlar hesabında 300.000 ₺ borç bakiyesi, dönem sonunda 370 hesabında ise 250.000 ₺ kurumlar vergisi karşılığı bulunmaktadır. THP''ye göre 193 hesabından 371 hesabına aktarma yapılacaktır.


    193 hesabında dönem sonunda kalacak bakiye kaç ₺''dır?'
  secenekler:
    A: Hesap kapanır, bakiye kalmaz
    B: 50.000 ₺ bakiye kalır
    C: 250.000 ₺
    D: 300.000 ₺ (aktarma yapılmaz)
    E: 550.000 ₺ bakiye
  dogru: B
  aciklama:
    dogru_neden: 'THP 193''e göre aktarılacak tutar 370 hesabının tutarından fazla olamaz ve aktarılamayan tutar dönem sonunda 193''ün bakiyesi olarak kalır. Aktarılan = min(300.000; 250.000) = 250.000 ₺; kalan = 300.000 − 250.000 = 50.000 ₺. Püf noktaları: (1) Aktarma üst sınırı 370 tutarıdır. (2) Sorulan kalan bakiyedir, aktarılan tutar değil.'
    celdiriciler:
      A: 193 bakiyesinin tamamının aktarılabileceği düşünülmüştür; aktarılacak tutar 370 tutarından fazla olamaz.
      C: Bu tutar 371'e aktarılacak tutardır; 193'te kalacak bakiye değildir.
      D: Hiç aktarma yapılmadığı varsayılmıştır; 250.000 ₺ aktarılır.
      E: Bakiye ile karşılık toplanmıştır; mantıksal olarak anlamsızdır.
    hesap_adimlari:
    - Aktarılan = min(300.000; 250.000) = 250.000 ₺
    - Kalan bakiye = 300.000 − 250.000 = 50.000 ₺
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 193 Peşin Ödenen Vergiler ve Fonlar
    alinti: Dönem sonunda tahakkuk edecek gelir veya kurumlar vergisi ile fon karşılıklarından yapılacak olan indirimi teminen "37- BORÇ VE GİDER KARŞILIKLARI" grubunda bulunan "371-DÖNEM KARININ PEŞİN ÖDENEN VERGİ VE GİDER YÜKÜMLÜLÜKLERİ" hesabının borcuna aktarılır. Ancak aktarılacak tutar "370- DÖNEM KARI VERGİ VE DİĞER YÜKÜMLÜLÜK KARŞILIKLARI" hesabının tutarından fazla olamaz. Aktarılamayan tutar, dönem sonunda bu hesabın bakiyesi olarak kalır.
  dogrulama:
    python: 'sonuc = 300000 - min(300000, 250000)

