  kazanim: Peşin ödenen giderin 180 ve 280 olarak ayrılması (36 aylık)
  tip: uygulama
  zorluk: 3
  soru_bicimi: yevmiye
  kok: '(T3) A.Ş., 01.07.2026 tarihinde 36 aylık (30.06.2029''a kadar) bir yazılım kullanım hakkı için 216.000 ₺ ödemiş ve tutarın tamamını 770 hesabına borç kaydetmiştir. Hesap dönemi takvim yılıdır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    31.12.2026 tarihinde yapılması gereken düzeltme kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 180 Gelecek Aylara Ait Giderler 180.000

      Alacak: 770 Genel Yönetim Giderleri 180.000'
    B: 'Borç: 180 Gelecek Aylara Ait Giderler 72.000

      Borç: 280 Gelecek Yıllara Ait Giderler 108.000

      Alacak: 760 Pazarlama Satış ve Dağıtım Giderleri 180.000'
    C: 'Borç: 280 Gelecek Yıllara Ait Giderler 180.000

      Alacak: 770 Genel Yönetim Giderleri 180.000'
    D: 'Borç: 180 Gelecek Aylara Ait Giderler 108.000

      Borç: 280 Gelecek Yıllara Ait Giderler 72.000

      Alacak: 770 Genel Yönetim Giderleri 180.000'
    E: 'Borç: 180 Gelecek Aylara Ait Giderler 72.000

      Borç: 280 Gelecek Yıllara Ait Giderler 108.000

      Alacak: 770 Genel Yönetim Giderleri 180.000'
  dogru: E
  aciklama:
    dogru_neden: 'Aylık tutar 216.000 / 36 = 6.000 ₺. 2026''ya 6 ay (36.000 ₺) isabet eder; kalan 30 ayın 12''si (72.000 ₺) 2027 için 180''e, 18''i (108.000 ₺) sonraki yıllar için 280''e aktarılır (THP 180 ve 280). Gider hesabı 180.000 ₺ azaltılır. Püf noktaları: (1) Ay sayısı üzerinden orantılayın. (2) 12 aylık dilim 180, kalanı 280''dir.'
    celdiriciler:
      A: Kalan 30 ayın tamamı 180'e alınmıştır; bir yıldan uzun süreli kısım 280'de izlenir.
      B: Başlangıçta gider 770'e yazılmıştır; düzeltme aynı hesaba yapılır, 760 pazarlama giderleri içindir.
      C: 2027 yılına ait 12 aylık kısım 180'de izlenmelidir.
      D: 180 ve 280 tutarları ters dağıtılmıştır; 12 aylık kısım 72.000 ₺ (180), 18 aylık kısım 108.000 ₺ (280)'dır.
    hesap_adimlari:
    - Aylık = 216.000 / 36 = 6.000 ₺; 2026 payı = 36.000 ₺
    - 180 = 12 × 6.000 = 72.000 ₺; 280 = 18 × 6.000 = 108.000 ₺
    - 180 B 72.000; 280 B 108.000; 770 A 180.000
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 180 Gelecek Aylara Ait Giderler
    alinti: Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek döneme ait giderleri izlemek için kullanılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 280 Gelecek Yıllara Ait Giderler
    alinti: Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek yıllara ait giderleri izlemek için kullanılır.
