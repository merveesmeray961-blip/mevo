  kazanim: 'VUK md. 285: borç senetlerinin değerlenmesi'
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: Dönem sonunda vadesi gelmemiş alacak senetlerini değerleme günü kıymetine indirerek reeskont ayıran bir işletmenin, vadesi gelmemiş borç senetleri bakımından 213 sayılı Vergi Usul Kanunu'na göre durumu aşağıdakilerden hangisidir?
  secenekler:
    A: Borç senetlerini de aynı şekilde işleme tabi tutmak zorundadır
    B: Borç senetleri için reeskont ayırması yasaktır
    C: Borç senetleri için reeskont ayırıp ayırmamayı serbestçe seçebilir
    D: Yalnızca bankalar ve sigorta şirketleri borç senetlerini değerleme günü kıymetine irca edebilir
    E: Borç senetlerinin reeskontu yalnızca faiz oranı belirtilmişse yapılabilir
  dogru: A
  aciklama:
    dogru_neden: 'VUK md. 285 son fıkraya göre alacak senetlerini değerleme gününün kıymetine irca eden mükellefler, borç senetlerini de aynı şekilde işleme tabi tutmak zorundadırlar. Püf noktaları: (1) ''Alacak senetleri irca edildiyse'' koşulunu görün. (2) Zorunluluk tek yönlüdür: alacağı indiren borcu da indirmelidir.'
    celdiriciler:
      B: Kanun alacak senetlerini irca eden mükellefin borç senetlerini de aynı işleme tabi tutmasını zorunlu kılar.
      C: Alacak senetlerini irca eden mükellef için seçim hakkı yoktur, zorunluluk vardır.
      D: Banka ve sigorta şirketleri için özel faiz hükmü vardır; ancak genel kural tüm mükellefleri bağlar.
      E: Faiz oranı belirtilmemişse Merkez Bankası resmi iskonto haddi uygulanır; bu zorunluluğu ortadan kaldırmaz.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 285
    alinti: Alacak senetlerini değerleme gününün kıymetine irca eden mükellefler, borç senetlerini de aynı şekilde işleme tabi tutmak zorundadırlar.
