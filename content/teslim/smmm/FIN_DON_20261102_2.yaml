  kok: 213 sayılı Vergi Usul Kanunu'na göre karşılık nedir?
  secenekler:
    A: Bilanço gününde alacakların tahsil edilebilir değerine indirilmesi için ayrılan ve vergi matrahından hiçbir koşulda düşülemeyen tutarlardır
    B: Gelecek dönemlere ait olarak peşin tahsil edilen hasılat tutarlarıdır
    C: Miktarı kesin olarak kestirilemeyen ve işletme için borç niteliği taşıyan belli bazı zararlar için hesaben ayrılan meblağlardır
    D: Kesin olarak belirlenmiş borçların ertelenen ve sonraki dönemlere devredilen kısmına ilişkin tutarlardır
    E: Sermaye şirketlerinde net kârdan yasal ve statü gereği ayrılan ve dağıtıma konu olmayan yedek akçelerdir
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 288: Hasıl olan veya husulü beklenen fakat miktarı katiyetle kestirilemeyen ve teşebbüs için bir borç mahiyetini arz eden belli bazı zararları karşılamak maksadıyla hesaben ayrılan meblağlara karşılık denir; karşılıklar mukayyet değerleriyle pasifleştirilmek suretiyle değerlenir.'
    celdiriciler:
      A: Karşılığın tanımı alacak değerlemesi değil, belli zararlar için hesaben ayrılan meblağdır.
      B: Bu pasif geçici hesap kıymetidir.
      D: Karşılık, miktarı kesin olarak kestirilemeyen zararlar içindir.
      E: Yedek akçeler kârdan ayrılır; karşılık zarar niteliğindeki yükümlülükler içindir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 288
    alinti: Hasıl olan veya husulü beklenen fakat miktarı katiyetle kestirilemiyen ve teşebbüs için bir borç mahiyetini arz eden belli bazı zararları karşılamak maksadiyle hesaben ayrılan meblağlara karşılık denir.
