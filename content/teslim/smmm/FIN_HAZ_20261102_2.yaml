  "zorluk": 3
  "soru_bicimi": "yevmiye"
  "kok": "İşletme, mallarını KDV dahil 1.440.000 ₺ bedelle vadeli olarak satmıştır (KDV oranı %20). Tekdüzen Hesap Planı'na göre satış kaydı aşağıdakilerden hangisidir?"
  "secenekler":
    "A": "120 Alıcılar (B) 1.440.000 ₺ / 600 Yurtiçi Satışlar (A) 1.152.000 ₺, 391 Hesaplanan KDV (A) 288.000 ₺"
    "B": "120 Alıcılar (B) 1.440.000 ₺ / 600 Yurtiçi Satışlar (A) 1.440.000 ₺"
    "C": "120 Alıcılar (B) 1.440.000 ₺ / 600 Yurtiçi Satışlar (A) 1.200.000 ₺, 191 İndirilecek KDV (A) 240.000 ₺"
    "D": "120 Alıcılar (B) 1.440.000 ₺ / 600 Yurtiçi Satışlar (A) 1.200.000 ₺, 391 Hesaplanan KDV (A) 240.000 ₺"
    "E": "120 Alıcılar (B) 1.200.000 ₺, 391 Hesaplanan KDV (B) 240.000 ₺ / 600 Yurtiçi Satışlar (A) 1.440.000 ₺"
  "dogru": "D"
  "aciklama":
    "dogru_neden": "KDV dahil tutardan matrah 1.440.000 / 1,20 = 1.200.000 ₺, KDV 240.000 ₺'dir. Alacak 1.440.000 ₺ ile 120'ye borç; satış 600'e, hesaplanan KDV 391'e alacak yazılır. Brüt satışlara KDV dahil edilmez. Püf noktaları: KDV dahil tutardan geri hesap yapılır: matrah = tutar / 1,20. Tutarın doğrudan %20'sini KDV saymak tipik hatadır. Satış hesabı KDV'siz matrahla, 391 ise KDV ile alacaklanır."
    "celdiriciler":
      "A": "1.152.000 ₺ ve 288.000 ₺ KDV dahil tutarın %20'si alınarak bulunur; KDV dahil bedelden matrah 1,20'ye bölünerek bulunur."
      "B": "KDV satış hasılatına dahil edilemez; brüt satışlara KDV dahil edilmez."
      "C": "Satıştan doğan KDV 391'e alacak yazılır; 191 alımlardaki indirilecek KDV'dir."
      "E": "Kayıt ters yönlüdür; 120 borçlandırılır, satış ve hesaplanan KDV alacaklandırılır."
  "kaynaklar":
  - "mevzuat": "1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)"
    "madde": "60. Brüt Satışlar"
    "alinti": "Brüt Satışlara \"Katma Değer Vergisi\" dahil edilmez."
