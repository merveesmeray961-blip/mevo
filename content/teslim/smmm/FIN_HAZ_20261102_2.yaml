  "kok": "İşletme, stokların değerlemesinde yıllardır uyguladığı yöntemi, geçerli bir nedenle bu dönem değiştirmiştir. Muhasebenin tutarlılık kavramına göre aşağıdakilerden hangisi doğrudur?"
  "secenekler":
    "A": "Geçerli nedenle değiştirilebilir; değişiklik ve parasal etkileri dipnotlarda açıklanmalıdır."
    "B": "Muhasebe politikası hiçbir koşulda değiştirilemez."
    "C": "Politika değişikliği yapılabilir ve açıklama gerekmez."
    "D": "Politika değişikliği yalnızca bir sonraki dönemden itibaren geçerli bir nedenle yapılabilir ve dipnot gerekmez."
    "E": "Değişiklik açıklaması yalnızca yönetim kurulu raporunda yapılır."
  "dogru": "A"
  "aciklama":
    "dogru_neden": "Tutarlılık kavramı, seçilen muhasebe politikalarının birbirini izleyen dönemlerde değiştirilmeden uygulanmasını gerektirir. Geçerli nedenlerin bulunduğu durumlarda politikalar değiştirilebilir; ancak değişikliklerin ve parasal etkilerinin mali tabloların dipnotlarında açıklanması zorunludur. Püf noktaları: Tutarlılık değişmezlik demek değildir: geçerli neden + dipnotta açıklama (hem değişiklik hem parasal etkisi) birlikte aranır. Açıklama yeri mali tabloların dipnotlarıdır."
    "celdiriciler":
      "B": "Tutarlılık kavramı değişikliğe tamamen kapalı değildir; geçerli nedenlerde değişiklik mümkündür."
      "C": "Değişiklik yapılabilse de dipnotlarda açıklanması zorunludur."
      "D": "Açıklama yerinin yönetim kurulu raporu değil mali tabloların dipnotları olduğu belirtilmiştir."
      "E": "Kavram bir sonraki dönem şartı aramaz; geçerli nedenle değişiklik yapılır ve dipnotta açıklanır."
  "kaynaklar":
  - "mevzuat": "1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği Ek 1 (Muhasebenin Temel Kavramları)"
    "madde": "Ek 1, 8. Tutarlılık Kavramı"
    "alinti": "Geçerli nedenlerin bulunduğu durumlarda, işletmeler, uyguladıkları muhasebe politikalarını değiştirebilirler. Ancak bu değişikliklerin ve bunların parasal etkilerinin mali tabloların dipnotlarında açıklanması zorunludur."
