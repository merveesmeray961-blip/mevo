  "soru_bicimi": "standart"
  "kok": "Bir anonim şirketin özkaynak hesapları: 500 Sermaye 1.000.000 ₺ (alacak), 501 Ödenmemiş Sermaye 400.000 ₺ (borç), 540 Yasal Yedekler 200.000 ₺ (alacak), 570 Geçmiş Yıllar Kârları 180.000 ₺ (alacak), 580 Geçmiş Yıllar Zararları 50.000 ₺ (borç), 590 Dönem Net Kârı 100.000 ₺ (alacak). Bilançodaki özkaynak toplamı kaç ₺'dir?"
  "secenekler":
    "A": "830.000 ₺"
    "B": "1.030.000 ₺"
    "C": "1.130.000 ₺"
    "D": "1.430.000 ₺"
    "E": "10.300.000 ₺"
  "dogru": "B"
  "aciklama":
    "dogru_neden": "501 ve 580 düzenleyici/zarar hesapları olup özkaynaktan düşülür. Özkaynak = 1.000.000 − 400.000 + 200.000 + 180.000 − 50.000 + 100.000 = 1.030.000 ₺'dir. Püf noktaları: Borç bakiyeli özkaynak hesapları (501, 580) toplamdan düşülür, alacak bakiyeli olanlar eklenir. Hesapların yönünü işlem yapmadan önce işaretleyin."
    "celdiriciler":
      "A": "830.000 ₺, yasal yedeğin (200.000 ₺) hesaba katılmamasıyla bulunur."
      "C": "1.130.000 ₺, geçmiş yıllar zararının toplamdan düşülmek yerine eklenmesiyle bulunur."
      "D": "1.430.000 ₺, ödenmemiş sermayenin düşülmemesiyle bulunur; 501 düzenleyici hesap olup 500'den düşülür."
      "E": "10.300.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir."
    "hesap_adimlari":
    - "1.000.000 − 400.000 = 600.000"
    - "+ 200.000 + 180.000 + 100.000 = 1.080.000"
    - "− 50.000 = 1.030.000 ₺"
  "kaynaklar":
  - "mevzuat": "1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)"
    "madde": "501. Ödenmemiş Sermaye (-)"
    "alinti": "alacağı ile bu hesaba borç, ödenen tutarlar alacak kaydedilir."
  - "mevzuat": "1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)"
    "madde": "580. Geçmiş Yıllar Zararları"
    "alinti": "Geçmiş faaliyet dönemlerinde ortaya çıkan dönem net zararlarının izlendiği hesaptır."
