  kazanim: Özel maliyetlerin kısa kira süresinde itfası (264)
  tip: uygulama
  zorluk: 2
  soru_bicimi: yevmiye
  kok: '(S2) A.Ş., 3 yıllık kira sözleşmesiyle tuttuğu ofiste kira sonunda mal sahibine bırakılacak 300.000 ₺''lık kalıcı düzenleme yaptırmış ve 264 hesabına kaydetmiştir. İlk yıl itfa payı genel yönetim giderine yazılacaktır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    İlk yıl kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 770 Genel Yönetim Giderleri 60.000

      Alacak: 268 Birikmiş Amortismanlar 60.000'
    B: 'Borç: 770 Genel Yönetim Giderleri 75.000

      Alacak: 268 Birikmiş Amortismanlar 75.000'
    C: 'Borç: 770 Genel Yönetim Giderleri 300.000

      Alacak: 268 Birikmiş Amortismanlar 300.000'
    D: 'Borç: 760 Pazarlama Satış ve Dağıtım Giderleri 100.000

      Alacak: 268 Birikmiş Amortismanlar 100.000'
    E: 'Borç: 770 Genel Yönetim Giderleri 100.000

      Alacak: 268 Birikmiş Amortismanlar 100.000'
  dogru: E
  aciklama:
    dogru_neden: THP 264'e göre özel maliyetler kira süresi içinde amorti edilir (kira süresi beş yıldan fazlaysa beş yılda). Süre 3 yıl olduğundan 300.000 / 3 = 100.000 ₺ gider (770) ve 268 alacak yazılır.
    celdiriciler:
      A: 5 yıl esas alınmıştır; kira süresi beş yıldan kısa olduğundan itfa kira süresi (3 yıl) içinde yapılır.
      B: 4 yıl esas alınmıştır; kira süresi 3 yıldır.
      C: Tamamı ilk yılda itfa edilemez; kira süresi boyunca eşit tutarla dağıtılır.
      D: İtfa payı genel yönetim giderine yazılacağından 770 kullanılır; 760 pazarlama, satış ve dağıtım giderleri içindir.
    hesap_adimlari:
    - İtfa payı = 300.000 / 3 = 100.000 ₺
