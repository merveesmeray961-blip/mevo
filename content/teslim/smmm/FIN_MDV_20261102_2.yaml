      A: Tarım tesisleri amortismana tabi tutulur.
      B: İşletmede inşa edilen yollar ve harklar amortismana tabidir.
      D: Bir yıldan fazla kullanılan ve yıpranmaya maruz gayrimenkuller amortismana tabi tutulur.
