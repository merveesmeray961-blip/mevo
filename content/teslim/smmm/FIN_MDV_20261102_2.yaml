    B: İşletmede inşa edilmiş her nevi yollar ve harklar
    C: Üzerinde yapı bulunmayan boş arazi ve boş arsalar
    D: İşletmede bir yıldan fazla kullanılan gayrimenkuller
    E: İşletmede kullanılan alet, edevat ve demirbaşlar
