  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: TMS 16 elden çıkarma kazancı
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: TMS 16'ya göre bir maddi duran varlık kaleminin finansal tablo dışı bırakılmasından kaynaklanan kazanç aşağıdakilerden hangisi şeklinde ifade edilir?
  secenekler:
    A: Kâr veya zarara yansıtılır; hasılat olarak sınıflandırılmaz
    B: Hasılat olarak sınıflandırılır
    C: Özkaynaklarda yeniden değerleme fonuna eklenir
    D: Yeni alınacak varlığın maliyetinden düşülür
    E: Gelecek dönemlere ertelenerek yararlı ömür boyunca gelir yazılır
  dogru: A
  aciklama:
    dogru_neden: 'TMS 16 md. 68: Finansal tablo dışı bırakmadan kaynaklanan kazanç veya kayıp, ilgili kalem finansal tablo dışı bırakıldığında kâr veya zarara yansıtılır; kazançlar hasılat olarak sınıflandırılmaz.'
    celdiriciler:
      B: Standart kazançların hasılat olarak sınıflandırılmayacağını belirtir.
      C: Elden çıkarma kazancı özkaynakta değil kâr veya zararda gösterilir.
      D: Kazanç yeni varlığın maliyetini azaltmaz.
      E: Kazanç finansal tablo dışı bırakıldığında kâr veya zarara yansıtılır.
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: md. 68
    alinti: Bir maddi duran varlık kaleminin finansal tablo dışı bırakılmasından kaynaklanan kazanç veya kayıp ilgili kalem finansal tablo dışı bırakıldığında (TFRS 16 Kiralamalar satış ve geri kiralama işlemi için aksini gerektirmedikçe) kâr veya zarara yansıtılır. Kazançlar, hasılat olarak sınıflandırılmaz.
