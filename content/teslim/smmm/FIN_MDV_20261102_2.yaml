    Yıllık itfa payı kaç ₺''dır?'
  secenekler:
    A: 7.500 ₺
    B: 30.000 ₺
    C: 37.500 ₺
    D: 50.000 ₺
    E: 150.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'THP 263: Aktifleştirilen Ar-Ge giderleri 5 yıl içinde eşit taksitlerle itfa edilerek yok edilir: 150.000 / 5 = 30.000 ₺.'
    celdiriciler:
      A: 20 yıl esas alınmıştır; THP 263 5 yıl öngörür.
      C: 4 yıl esas alınmıştır.
      D: 3 yıl esas alınmıştır.
      E: Tüm tutarın bir yılda itfa edilmesidir.
    hesap_adimlari:
    - İtfa payı = 150.000 / 5 = 30.000 ₺
