  unite: Maddi ve maddi olmayan duran varlıklar
  konu: MDV
  kazanim: TMS 38 itfa ve değer düşüklüğü testi
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 'A işletmesi, yararlı ömrü sınırlı bir lisansı ve ömrü için öngörülebilir bir sınır bulunmayan bir markayı elinde tutmaktadır. Kalıntı değer yoktur.


    TMS 38''e göre bu iki varlıkla ilgili aşağıdakilerden hangisi doğrudur?'
  secenekler:
    A: Her iki varlık da aynı itfa süresiyle itfa edilir ve yıllık değer düşüklüğü testi yapılmaz
    B: Lisans itfa edilmez ancak marka, sistematik olarak yararlı ömrü boyunca itfa edilir
    C: Her iki varlık da itfa edilmez ve her ikisi için de değer düşüklüğü testi yapılmaz
    D: Lisans itfa edilir; marka itfa edilmez ancak her yıl değer düşüklüğü testine tabidir
    E: Marka itfa edilmez ve değer düşüklüğü testi yalnızca satış sırasında yapılır
  dogru: D
  aciklama:
    dogru_neden: 'TMS 38 md. 97: Sınırlı ömürlü varlığın itfaya tabi tutarı yararlı ömrü boyunca sistematik olarak dağıtılır. Md. 107-108: Sınırsız ömürlü varlık itfa edilmez, ancak yıllık olarak ve belirti olduğunda değer düşüklüğü testine tabi tutulur. Püf noktaları: (1) Varlıkları ayrı ayrı sınıflandırın. (2) ''İtfa edilmez'' ifadesi ''test edilmez'' anlamına gelmez.'
    celdiriciler:
      A: Sınırsız ömürlü varlık itfa edilmez; itfa yalnızca sınırlı ömürlü varlık içindir.
      B: Roller ters çevrilmiştir.
      C: Sınırlı ömürlü varlık itfaya tabidir, sınırsız ömürlü varlık için yıllık test gerekir.
      E: Sınırsız ömürlü varlık yıllık olarak ve belirti olduğunda değer düşüklüğü testine tabidir.
  kaynaklar:
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: md. 107
    alinti: Sınırsız yararlı ömre sahip bir maddi olmayan duran varlık itfa edilmez.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: md. 97
    alinti: Sınırlı yararlı ömre sahip bir maddi olmayan duran varlığın itfaya tabi tutarı yararlı ömrü boyunca sistematik olarak dağıtılır.
