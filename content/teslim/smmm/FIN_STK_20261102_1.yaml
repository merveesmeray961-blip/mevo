    madde: 197 Sayım ve Tesellüm Noksanları
    alinti: 'Sayımlar sonucunda tespit edilen kasa, stok ve maddi duran varlıklar noksanlarıyla, tesellüm sırasında ortaya çıkan noksanların geçici olarak kayıt ve izleneceği hesaptır. İşleyişi: Noksanlığın ortaya çıkması ile hesaba borç, sorumlularından tahsili veya zarar kaydedilmesi halinde ise alacak kaydedilir.'
