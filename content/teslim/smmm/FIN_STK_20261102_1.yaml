    Aşağıdaki emtia gruplarından hangisinde bu koşul sağlanmaktadır?'
  secenekler:
    A: Maliyet bedeli 200.000 ₺, değerleme günündeki satış bedeli 184.000 ₺ olan emtia
    B: Maliyet bedeli 300.000 ₺, değerleme günündeki satış bedeli 276.000 ₺ olan emtia
    C: Maliyet bedeli 80.000 ₺, değerleme günündeki satış bedeli 74.400 ₺ olan emtia
    D: Maliyet bedeli 1.500.000 ₺, değerleme günündeki satış bedeli 1.395.000 ₺ olan emtia
    E: Maliyet bedeli 120.000 ₺, değerleme günündeki satış bedeli 108.000 ₺ olan emtia
  dogru: E
  aciklama:
    dogru_neden: 'VUK md. 274''e göre emtianın maliyet bedeline nazaran değerleme günündeki satış bedelleri %10 ve daha fazla bir düşüklük gösterdiği hâllerde emsal bedeli ölçüsü uygulanabilir. 120.000 ₺ maliyete karşılık 108.000 ₺ satış bedeli tam %10 düşüklüktür ve ''ve daha fazla'' ifadesi gereği koşul sağlanır. Püf noktaları: (1) Eşitlik durumu da koşulu sağlar. (2) Her grupta düşüklük oranını ayrı hesaplayın, tutarların büyüklüğüne aldanmayın.'
    celdiriciler:
      A: Düşüklük %8'dir; %10'un altında olduğundan emsal bedeli ölçüsü uygulanamaz.
      B: Düşüklük %8'dir; sınır olan %10'a ulaşmaz.
      C: Düşüklük %7'dir; koşul sağlanmaz.
      D: Düşüklük %7'dir; tutarın büyüklüğü oranı değiştirmez.
