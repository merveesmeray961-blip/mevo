    celdiriciler:
      B: İşçilik, maliyet bedeline katılması zorunlu unsurlardandır.
      C: Genel imal giderlerinden mamule düşen hisse maliyete girmek zorundadır.
      D: İptidai ve ham madde bedeli zorunlu maliyet unsurudur.
      E: Ambalajı zorunlu mamullerde ambalaj bedeli de maliyete girer; ihtiyari değildir.
  kaynaklar:
