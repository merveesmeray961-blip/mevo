  kok: '(M) A.Ş.''nin yıl sonu sayımında, kayıtlara göre mevcut olması gereken ticari mallardan 25 adedinin noksan olduğu görülmüştür. Birim maliyet 400 ₺''dır. Noksanlığın sorumlusu henüz belirlenmediğinden tutar geçici olarak izlenecektir. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    Noksanlığın kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 153 Ticari Mallar 10.000

      Alacak: 197 Sayım ve Tesellüm Noksanları 10.000'
    B: 'Borç: 689 Diğer Olağandışı Gider ve Zararlar 10.000

      Alacak: 153 Ticari Mallar 10.000'
    C: 'Borç: 153 Ticari Mallar 10.000

      Alacak: 397 Sayım ve Tesellüm Fazlaları 10.000'
    D: 'Borç: 197 Sayım ve Tesellüm Noksanları 10.000

      Alacak: 157 Diğer Stoklar 10.000'
    E: 'Borç: 197 Sayım ve Tesellüm Noksanları 10.000

      Alacak: 153 Ticari Mallar 10.000'
  dogru: E
  aciklama:
    dogru_neden: 197 Sayım ve Tesellüm Noksanları hesabı, sayımlar sonucunda tespit edilen stok noksanlıklarının geçici olarak izlendiği hesaptır; noksanlığın ortaya çıkmasıyla hesaba borç kaydedilir. Noksan tutar 25 × 400 = 10.000 ₺ olup stok hesabı (153) alacaklandırılır.
    celdiriciler:
      A: Taraflar ters yazılmıştır; noksanlıkta stok hesabı azalır (alacak), 197 hesabı borçlanır.
      B: Sorumlusu henüz belirlenmeyen noksanlık önce geçici olarak 197 hesabında izlenir; doğrudan zarara aktarma sonraki aşamadır.
      C: 397 Sayım ve Tesellüm Fazlaları hesabı fazlalıklar içindir; noksanlıkta kullanılmaz.
      D: Noksan çıkan mal 153 Ticari Mallar hesabında izlenmektedir; 157 Diğer Stoklar farklı nitelikteki kalemler içindir.
    hesap_adimlari:
    - Noksan tutar = 25 × 400 = 10.000 ₺
    - 197 B 10.000; 153 A 10.000
  kaynaklar:
