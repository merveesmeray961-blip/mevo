      A: Standart düşük olanı esas alır; yüksek olan alınırsa stoklar fazla gösterilir.
      B: Stoklar gerçeğe uygun değerle değil, maliyet ile net gerçekleşebilir değerin düşüğü ile ölçülür.
      C: Maliyet, net gerçekleşebilir değerin altına düşmediği sürece esastır; düşmesi hâlinde net gerçekleşebilir değere inilir.
      E: Standartta böyle bir ortalama ölçüsü yoktur.
