  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 159 Verilen Sipariş Avansları
    alinti: Yapılan ödemeler bu hesaba borç, malın teslimi üzerine alacak kaydedilir.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
