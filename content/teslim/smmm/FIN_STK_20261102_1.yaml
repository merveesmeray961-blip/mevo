  soru_bicimi: standart
  kok: BOBİ FRS'ye göre stokların maliyetinin hesaplanmasında kullanılabilecek yöntemler aşağıdakilerden hangisinde doğru verilmiştir?
  secenekler:
    A: İlk giren ilk çıkar ve son giren ilk çıkar
    B: Ağırlıklı ortalama maliyet ve son giren ilk çıkar
    C: İlk giren ilk çıkar, ağırlıklı ortalama ve son giren ilk çıkar
    D: Yalnızca ağırlıklı ortalama maliyet
    E: Yalnızca ilk giren ilk çıkar ve ağırlıklı ortalama maliyet
  dogru: E
  aciklama:
    dogru_neden: BOBİ FRS 6.20'ye göre stokların maliyeti FIFO veya ağırlıklı ortalama maliyet yöntemlerinden biri kullanılarak hesaplanır; LIFO'nun kullanımına izin verilmez.
    celdiriciler:
      A: Son giren ilk çıkar (LIFO) yönteminin kullanımına izin verilmemektedir.
      B: LIFO kullanılamaz; yöntemlerden biri ağırlıklı ortalamadır ama diğeri FIFO'dur.
      C: Yöntemler arasında LIFO yoktur; kullanımı açıkça yasaklanmıştır.
      D: FIFO yöntemi de standartta izin verilen yöntemlerden biridir.
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS)
    madde: '6.20'
    alinti: Stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemlerinden biri kullanılarak hesaplanır. Benzer niteliklere ve benzer kullanıma sahip tüm stoklar için aynı maliyet hesaplama yöntemi kullanılır. Nitelikleri veya kullanım alanları itibarıyla farklı olan stoklar için farklı maliyet hesaplama yöntemleri kullanılabilir. Son giren ilk çıkar (LIFO) yönteminin kullanımına ise izin verilmemektedir.
