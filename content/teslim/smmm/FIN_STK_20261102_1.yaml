    dogru_neden: 'Normal fire 50 kg''dır; gerçekleşen 80 kg firenin 30 kg''ı normalin üstündedir ve gider yazılır (BOBİ FRS 6.15). Gider = 30 × 100 = 3.000 ₺; stok = 920 × 100 = 92.000 ₺ (95.000 − 3.000). Püf noktaları: (1) Normal fire stokta kalır, fazlası gider olur. (2) Toplam alış tutarından yalnızca anormal fire düşülür.'
    celdiriciler:
      A: Bu tutar normalin üstündeki 30 kg'ın gideridir; sorulan kalan stokun maliyetidir.
      B: 920 kg alış fiyatı olan 95 ₺ ile değerlenmiştir; normal fire birim maliyeti 100 ₺'ye çıkarır.
      D: Fire dikkate alınmadan toplam alış bedeli stok sayılmıştır; normalin üstündeki fire gider yazıldığından stoktan çıkar.
      E: 1.000 kg'ın tamamı 100 ₺ ile değerlenmiştir; fire olan miktar stokta değildir.
    hesap_adimlari:
    - Normal fire = 1.000 × %5 = 50 kg; anormal fire = 80 − 50 = 30 kg
    - Anormal fire gideri = 30 × 100 = 3.000 ₺
    - Stok = 95.000 − 3.000 = 92.000 ₺
  kaynaklar:
  - mevzuat: Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standardı (BOBİ FRS)
    madde: '6.15'
    alinti: Bu tür maliyetler, oluştukları dönemde gider olarak kâr veya zarara yansıtılır. a) Normalin üstünde gerçekleşen; fire ve kayıplar, işçilik ve diğer dönüştürme maliyetleri.
