      Alacak: 320 Satıcılar 48.000'
    B: 'Borç: 153 Ticari Mallar 48.000

      Alacak: 320 Satıcılar 48.000'
    C: 'Borç: 153 Ticari Mallar 40.000

      Borç: 391 Hesaplanan KDV 8.000

      Alacak: 320 Satıcılar 48.000'
    D: 'Borç: 621 Satılan Ticari Mallar Maliyeti 40.000

      Borç: 191 İndirilecek KDV 8.000

      Alacak: 320 Satıcılar 48.000'
    E: 'Borç: 153 Ticari Mallar 40.000

      Borç: 191 İndirilecek KDV 8.000

      Alacak: 120 Alıcılar 48.000'
  dogru: A
  aciklama:
    dogru_neden: 153 Ticari Mallar hesabı, satın alınan ticari malların maliyet bedeliyle borcuna kaydedildiği hesaptır; maliyet 40.000 ₺ olup KDV (40.000 × %20 = 8.000 ₺) 191 İndirilecek KDV hesabına borç yazılır. Vadeli alış olduğundan fatura toplamı olan 48.000 ₺ 320 Satıcılar hesabına alacak kaydedilir.
    celdiriciler:
      B: KDV maliyete eklenmiştir; indirilebilir KDV 153 değil 191 İndirilecek KDV hesabında izlenir.
      C: 391 Hesaplanan KDV satışlarda doğan KDV içindir; alışta ödenen KDV 191 hesabına borç yazılır.
      D: 621 Satılan Ticari Mallar Maliyeti satış anında kullanılır; satın alınan mal 153 hesabına borç yazılır.
      E: 120 Alıcılar satıştan doğan alacakları gösterir; vadeli mal alışında satıcıya borç 320 Satıcılar hesabına alacak yazılır.
    hesap_adimlari:
    - KDV = 40.000 × %20 = 8.000 ₺
    - Fatura toplamı = 40.000 + 8.000 = 48.000 ₺
    - 153 B 40.000; 191 B 8.000; 320 A 48.000
