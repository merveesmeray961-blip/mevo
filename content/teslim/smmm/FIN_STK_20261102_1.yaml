    A: Maliyet değeri ile net gerçekleşebilir değerin yüksek olanı
    B: Yalnızca raporlama tarihindeki gerçeğe uygun değeri
    C: Her durumda satın alma maliyeti
    D: Maliyet değeri ile net gerçekleşebilir değerin düşük olanı
    E: Cari piyasa değeri ile birim satış fiyatının ortalaması
  dogru: D
