    dogru_neden: 'Net gerçekleşebilir değer, tahmini satış fiyatından tahmini tamamlanma ve satış maliyetlerinin düşülmesiyle bulunur: 120.000 − 15.000 − 5.000 = 100.000 ₺. Maliyet (110.000 ₺) NRV''den büyük olduğundan fark olan 10.000 ₺ karşılık ayrılır.'
    celdiriciler:
      A: Yalnızca tamamlanma maliyeti düşülmüştür (120.000 − 15.000 = 105.000); satışı gerçekleştirmek için gerekli tahmini maliyet de düşülmelidir.
      C: Tamamlanma maliyeti tutarı karşılık sanılmıştır; karşılık, maliyet ile net gerçekleşebilir değer farkıdır.
      D: Tamamlanma ve satış maliyetlerinin toplamı alınmıştır; karşılık bu toplam değil, maliyet ile NRV farkıdır.
      E: Bu tutar net gerçekleşebilir değerin kendisidir; karşılık maliyetten NRV'nin düşülmesiyle bulunur.
    hesap_adimlari:
    - NRV = 120.000 − 15.000 − 5.000 = 100.000 ₺
    - Karşılık = 110.000 − 100.000 = 10.000 ₺
