  kok: 213 sayılı Vergi Usul Kanunu'na göre imal edilen emtianın maliyet bedeline katılması ihtiyari olan unsur aşağıdakilerden hangisidir?
  secenekler:
    A: Genel idare giderlerinden mamule düşen hisse
    B: Mamule isabet eden işçilik
    C: Genel imal giderlerinden mamule düşen hisse
    D: Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli
    E: Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli
