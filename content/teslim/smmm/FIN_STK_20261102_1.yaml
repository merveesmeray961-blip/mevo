      A: Atıl kapasite nedeniyle dağıtım yapılmaz demek yanlıştır; fiili üretime isabet eden pay stoklara yüklenir.
      B: Dağıtılan ve dağıtılmayan kısımlar ters hesaplanmıştır.
      D: Düşük üretim nedeniyle birim sabit gider artırılamaz; tamamını stoka yüklemek stokları maliyetin üzerine çıkarır.
      E: Değişken giderler üretime göre ayrıca dağıtılır; sorulan sabit giderlerin dağıtımıdır.
    hesap_adimlari:
    - Birim sabit gider = 100.000 / 80.000 = 1,25 ₺
    - Stoklara = 50.000 × 1,25 = 62.500 ₺
    - Gider = 100.000 − 62.500 = 37.500 ₺
