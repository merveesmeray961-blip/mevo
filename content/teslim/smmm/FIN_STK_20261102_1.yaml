  kok: '(N) A.Ş., yurt içindeki bir satıcıya sipariş ettiği ticari mal için daha önce 20.000 ₺ avans vermiş ve tutarı 159 Verilen Sipariş Avansları hesabına kaydetmiştir. Mallar 50.000 ₺ + %20 KDV tutarlı faturayla teslim alınmış; fatura toplamından avans düşüldükten sonra kalan tutar vadeli bırakılmıştır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    Malların teslim alınmasına ilişkin kayıt aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 153 Ticari Mallar 50.000

      Borç: 191 İndirilecek KDV 10.000

      Alacak: 159 Verilen Sipariş Avansları 20.000

      Alacak: 320 Satıcılar 40.000'
    B: 'Borç: 153 Ticari Mallar 50.000

      Borç: 191 İndirilecek KDV 10.000

      Alacak: 320 Satıcılar 60.000'
    C: 'Borç: 153 Ticari Mallar 50.000

      Borç: 191 İndirilecek KDV 10.000

      Alacak: 159 Verilen Sipariş Avansları 20.000

      Alacak: 321 Borç Senetleri 40.000'
    D: 'Borç: 153 Ticari Mallar 60.000

      Alacak: 159 Verilen Sipariş Avansları 20.000

      Alacak: 320 Satıcılar 40.000'
    E: 'Borç: 153 Ticari Mallar 50.000

      Borç: 191 İndirilecek KDV 10.000

      Alacak: 259 Verilen Avanslar 20.000

      Alacak: 320 Satıcılar 40.000'
  dogru: A
  aciklama:
    dogru_neden: 159 Verilen Sipariş Avansları hesabına yapılan ödemeler borç, malın teslimi üzerine alacak kaydedilir. Mal bedeli 153'e, KDV (50.000 × %20 = 10.000 ₺) 191'e borç yazılır; fatura toplamı 60.000 ₺'dan avans (20.000 ₺) düşülünce kalan 40.000 ₺ 320 Satıcılar'a alacak kaydedilir.
    celdiriciler:
      B: Avans mahsup edilmemiştir; 159 hesabı alacaklandırılmadığı için avans bakiyesi açıkta kalır.
      C: Kalan tutar vadeli (açık hesap) bırakıldığından satıcıya olan borç 320 Satıcılar hesabında izlenir; 321 Borç Senetleri senede bağlanmış borçlar içindir.
      D: KDV maliyete eklenmiştir; indirilebilir KDV 191 hesabında ayrıca izlenir.
      E: 259 Verilen Avanslar maddi duran varlık siparişleri içindir; ticari mal avansı 159'da izlenir.
    hesap_adimlari:
    - KDV = 50.000 × %20 = 10.000 ₺; fatura toplamı = 60.000 ₺
    - Kalan borç = 60.000 − 20.000 = 40.000 ₺
    - 153 B 50.000; 191 B 10.000; 159 A 20.000; 320 A 40.000
