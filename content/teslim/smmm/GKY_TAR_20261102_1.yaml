  unite: "Atatürk İlkeleri ve İnkılap Tarihi"
  konu: TAR
  kazanim: "Osmanlı'nın son dönemi ve I. Dünya Savaşı"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "Osmanlı Devleti'nin II. Balkan Savaşı sırasında Edirne'yi geri almasının ardından Bulgaristan ile imzaladığı ve Edirne'nin Osmanlı sınırları içinde kalmasını sağlayan antlaşma aşağıdakilerden hangisidir?"
