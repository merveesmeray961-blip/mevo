    A: "Londra Antlaşması"
    B: "Bükreş Antlaşması"
    C: "İstanbul Antlaşması"
    D: "Atina Antlaşması"
    E: "Uşi (Ouchy) Antlaşması"
  dogru: C
  aciklama:
    dogru_neden: "Osmanlı Devleti, II. Balkan Savaşı sırasında Edirne'yi geri almış; Bulgaristan ile 29 Eylül 1913'te imzalanan İstanbul Antlaşması ile Edirne Osmanlı sınırları içinde kalmıştır."
    celdiriciler:
      A: "Londra Antlaşması (1913) I. Balkan Savaşı'nı bitirmiş ve Edirne dahil bölgeleri Osmanlı'dan ayırmıştır."
      B: "Bükreş Antlaşması (1913) Bulgaristan ile diğer Balkan devletleri arasında imzalanmıştır; Osmanlı Devleti taraf değildir."
      D: "Atina Antlaşması (1913) Osmanlı Devleti ile Yunanistan arasında imzalanmıştır."
      E: "Uşi Antlaşması (1912) Trablusgarp Savaşı'nı bitiren, İtalya ile yapılan antlaşmadır."
