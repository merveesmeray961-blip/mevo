    celdiriciler:
      A: "Paragrafta okumayı okuldan önce öğrenme zorunluluğundan söz edilmez."
      B: "Paragraf, alışkanlığın okuldan önce ailede kazanıldığını söyler."
      D: "Paragrafta kitap bulundurmanın maliyetinden söz edilmez."
      E: "Paragrafta her gün kitap alma önerisi yoktur."
