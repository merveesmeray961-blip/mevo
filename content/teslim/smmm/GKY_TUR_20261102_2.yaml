- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: GKY
  unite: "Türkçe"
  konu: TUR
  kazanim: "cümlede anlam"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "Aşağıdaki cümlelerin hangisinde 'ancak' sözcüğü 'yalnızca' anlamında kullanılmıştır?"
  secenekler:
    A: "Bu işi ancak sen yapabilirsin."
    B: "Çok çalıştı, ancak başarılı olamadı."
    C: "Eve ancak gece yarısı varabildik."
    D: "Haberi ancak bugün öğrendim."
    E: "Hasta olduğu için ancak yürüyebiliyordu."
  dogru: A
  aciklama:
    dogru_neden: "'Bu işi ancak sen yapabilirsin.' cümlesinde 'ancak', 'yalnızca sen' anlamını vermektedir."
    celdiriciler:
      B: "Burada 'ancak' karşıtlık bildiren bağlaçtır (ama, fakat)."
      C: "Burada 'ancak', 'en erken ya da en geç' anlamı taşır; 'yalnızca' değildir."
      D: "Burada 'ancak', 'daha yeni' anlamındadır."
      E: "Burada 'ancak', 'güçlükle' anlamındadır."
  kaynaklar:
  - mevzuat: "Genel bilgi — Türkçe"
    madde: "-"
    alinti: "(genel bilgi)"
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: GKY
  unite: "Türkçe"
  konu: TUR
  kazanim: "paragrafta anlam"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bilgi çağında bir insanın yalnızca bilgiye ulaşması yetmez; ulaştığı bilginin güvenilir olup olmadığını sorgulayabilmesi gerekir. Doğrulanmamış bir haber, kısa sürede binlerce kişiye ulaşabilir. Bu nedenle okuryazarlık artık yalnızca okuyup yazabilmek değil, okuduğunu eleştirel biçimde değerlendirebilmektir.\n\nYazar, bu parçada aşağıdakilerden hangisini savunmaktadır?"
  secenekler:
    A: "Bilgiye ulaşmak, bilgiyi doğrulamaktan daha önemlidir."
    B: "Okuryazarlık, eleştirel değerlendirmeyi de içermelidir."
    C: "Haberlerin paylaşılması kesinlikle yasaklanmalıdır."
    D: "Eleştirel düşünme yalnızca uzmanlara özgü bir beceridir."
    E: "Güvenilir kaynakların sayısı hızla artırılmalıdır."
  dogru: B
  aciklama:
    dogru_neden: "Yazar, okuryazarlığın yalnızca okuyup yazmaktan ibaret olmadığını, okunanı eleştirel olarak değerlendirmeyi de kapsadığını savunmaktadır. Püf noktaları: Parçanın sonundaki 'bu nedenle' cümlesi ana düşünceyi taşır; seçeneklerdeki yasak, kaynak sayısı ve uzmanlık gibi kavramlar metinde geçmez."
    celdiriciler:
      A: "Parça bunun tersini söyler; doğrulama ve sorgulama gereği vurgulanır."
      C: "Parçada yasak önerilmez."
      D: "Parça eleştirel değerlendirmeyi herkes için gerekli görür."
      E: "Kaynak sayısından söz edilmez; vurgu okuyucunun değerlendirmesinedir."
  kaynaklar:
  - mevzuat: "Genel bilgi — Türkçe"
    madde: "-"
    alinti: "(genel bilgi)"
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

