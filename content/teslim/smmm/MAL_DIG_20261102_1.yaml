  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'M İşletmesinin ilk madde hareketleri: 1 Nisan dönem başı 800 kg × 10 ₺; 6 Nisan alış 1.200 kg × 15 ₺; 12 Nisan çıkış 1.000 kg; 20 Nisan alış 1.000 kg × 18 ₺; 28 Nisan çıkış 1.500 kg. İşletme hareketli ağırlıklı ortalama yöntemini uygulamaktadır. Dönem sonu stokun değeri aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)'
  secenekler:
    A: 7.333 ₺ (dönemsel ortalama)
    B: 7.750 ₺ (500 × 15,5)
    C: 9.000 ₺ (FIFO)
    D: 9.500 ₺
    E: 44.000 ₺ (toplam)
  dogru: B
  aciklama:
    dogru_neden: 'TMS 2 paragraf 27: Ağırlıklı ortalama stok girişi oldukça hesaplanabilir. 6 Nisan: 26.000 / 2.000 = 13 ₺; 12 Nisan çıkışı 13.000 ₺; kalan 1.000 kg, 13.000 ₺. 20 Nisan: (13.000 + 18.000) / 2.000 = 15,5 ₺; 28 Nisan çıkışı 23.250 ₺; kalan 500 kg × 15,5 = 7.750 ₺''dir. Püf noktaları: Her girişte ortalama yeniden hesaplanır, çıkış ortalamayı değiştirmez; FIFO veya dönemsel ortalama sonuçları farklıdır. Püf noktaları: Her girişte ortalamanın yeniden hesaplanması ve çıkışların ortalamayı değiştirmemesi; FIFO ve dönemsel ortalama sonuçlarıyla karıştırma tuzağı.'
    celdiriciler:
      A: Yaklaşık 7.333 ₺ dönemsel ağırlıklı ortalama (14,67 ₺) ile bulunan stoktur; soruda hareketli ortalama uygulanmaktadır.
      C: 9.000 ₺ FIFO yöntemiyle bulunan stoktur (500 × 18).
      D: 9.500 ₺ son çıkış öncesi ortalamanın hatalı (19 ₺) kullanılmasıyla bulunur.
      E: 44.000 ₺ toplam mal bulundurma maliyetidir; çıkışlar düşülmemiştir.
    hesap_adimlari:
    - '6 Nisan ortalama: 26.000 / 2.000 = 13 ₺; çıkış 13.000 ₺; kalan 1.000 kg, 13.000 ₺'
    - '20 Nisan ortalama: (13.000 + 18.000) / 2.000 = 15,5 ₺'
    - 'Kalan: 2.000 - 1.500 = 500 kg × 15,5 = 7.750 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: Ağırlıklı ortalama maliyet yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir. Ağırlıklı ortalama, işletmenin koşullarına bağlı olarak, dönemsel olarak veya işletmeye stok girişi oldukça hesaplanabilir.
