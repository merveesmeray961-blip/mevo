  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: 'AX İşletmesinin ilk madde stoku şöyledir: dönem başında 1.000 kg × 10 ₺; ardından 2.000 kg × 12 ₺ alış yapılmıştır. Üretime 1.500 kg ilk madde çıkarılmıştır. FIFO yöntemine göre çıkışın maliyeti aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)'
  secenekler:
    A: 10.000 ₺ (yalnızca ilk parti)
    B: 15.000 ₺
    C: 16.000 ₺ (10.000 + 6.000)
    D: 17.000 ₺ (ağırlıklı ortalama)
    E: 18.000 ₺ (1.500 × 12)
  dogru: C
  aciklama:
    dogru_neden: TMS 2 paragraf 27'ye göre FIFO, ilk satın alınan kalemlerin ilk olarak kullanıldığını varsayar. Çıkış 1.000 × 10 + 500 × 12 = 16.000 ₺'dir.
    celdiriciler:
      A: 10.000 ₺ yalnızca ilk partinin (1.000 × 10) maliyetidir; 500 kg daha çıkış vardır.
      B: 15.000 ₺ çıkışın tamamının ilk fiyatla (1.500 × 10) değerlenmesidir; FIFO'da ilk parti bitince sonraki parti kullanılır.
      D: 17.000 ₺ dönemsel ağırlıklı ortalama (11,33 ₺) ile bulunan değerdir.
      E: 18.000 ₺ çıkışın tamamının son fiyatla (1.500 × 12) değerlenmesidir; FIFO'da önce ilk giren çıkar.
    hesap_adimlari:
    - 'Önce ilk parti: 1.000 × 10 = 10.000 ₺'
    - 'Kalan 500 kg ikinci partiden: 500 × 12 = 6.000 ₺'
    - 'Toplam: 16.000 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 25
    alinti: ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir. Benzer niteliklere ve işletme açısından benzer kullanıma sahip bütün stoklar için, aynı maliyet hesaplama yöntemi kullanılır.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar.
