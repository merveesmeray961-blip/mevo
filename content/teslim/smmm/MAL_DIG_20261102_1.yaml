- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet muhasebesi
  konu: DIG
  kazanim: değişken maliyet ve tam maliyet
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: AB İşletmesi bir mamulün üretiminde birim başına 14 ₺ direkt ilk madde, 10 ₺ direkt işçilik ve 6 ₺ değişken GÜG kullanmaktadır. Dönemde 10.000 birim mamul üretilmiş, sabit GÜG 120.000 ₺ olmuştur; ayrıca birim başına 4 ₺ değişken satış gideri vardır. Tam maliyet yöntemine (fiili üretim üzerinden) göre mamulün birim maliyeti aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 24 ₺ (14 + 10)
    B: 30 ₺ (14 + 10 + 6)
    C: 42 ₺ (14 + 10 + 6 + 12)
    D: 46 ₺ (14 + 10 + 6 + 12 + 4)
    E: 420.000 ₺ (toplam üretim maliyeti)
  dogru: C
  aciklama:
    dogru_neden: Tam maliyette direkt ilk madde, direkt işçilik, değişken GÜG ve sabit GÜG'nin tamamı mamule yüklenir (TMS 2 paragraf 12); satış maliyetleri stok maliyetine girmez (paragraf 16(d)). Birim sabit GÜG 120.000 / 10.000 = 12 ₺, birim maliyet 14 + 10 + 6 + 12 = 42 ₺'dir.
    celdiriciler:
      A: 24 ₺ yalnızca direkt ilk madde ve direkt işçiliği kapsar; değişken ve sabit GÜG de eklenmelidir.
      B: 30 ₺ sabit GÜG'yi dışlayan değişken maliyettir; tam maliyette sabit GÜG de mamule yüklenir.
      D: Satış maliyetleri TMS 2 paragraf 16(d) uyarınca stok maliyetine dâhil edilmez; 4 ₺ eklenmemelidir.
      E: 420.000 ₺ birim maliyet değil, toplam üretim maliyetidir.
    hesap_adimlari:
    - 'Birim sabit GÜG: 120.000 / 10.000 = 12 ₺'
    - 'Birim tam maliyet: 14 + 10 + 6 + 12 = 42 ₺ (satış gideri hariç)'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Stokların dönüştürme maliyetleri; direkt işçilik giderleri gibi, üretimle doğrudan ilişkili maliyetleri kapsar.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 16
    alinti: (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 14 + 10 + 6 + 120000 / 10000
