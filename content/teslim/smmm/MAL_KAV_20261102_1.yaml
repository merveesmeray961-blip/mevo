- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MAL
  unite: "Temel kavramlar ve GÜG kalemleri"
  konu: KAV
  kazanim: "asal maliyet"
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: "Maliyet unsurlarından direkt ilk madde ve malzeme giderleri ile direkt işçilik giderlerinin toplamına aşağıdakilerden hangisi denir?"
  secenekler:
    A: "Asal maliyet (ana maliyet)"
    B: "Dönüştürme (işleme) maliyeti"
    C: "Dönemin üretim giderleri"
    D: "Genel üretim giderleri"
    E: "Dönem giderleri"
  dogru: A
  aciklama:
    dogru_neden: "MSUGT Ek 4'e göre direkt ilk madde ve malzeme ile direkt işçilik, mamulün maliyetine doğrudan yüklenebilen unsurlardır; bu iki unsurun toplamı asal (ana) maliyet adını alır."
    celdiriciler:
      B: "Dönüştürme maliyeti direkt işçilik ile genel üretim giderlerinin toplamıdır; direkt ilk madde bu toplamda yer almaz."
      C: "Dönemin üretim giderleri direkt ilk madde, direkt işçilik ve genel üretim giderlerinin toplamıdır; üç unsuru birlikte kapsar."
      D: "Genel üretim giderleri direkt ilk madde ve direkt işçilik dışında kalan üretim giderleridir."
      E: "Dönem giderleri pazarlama, genel yönetim ve finansman gibi maliyete girmeyen giderlerdir."
  kaynaklar:
  - mevzuat: "1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)"
    madde: "Satışların Maliyeti Tablosu, A - Direkt İlk Madde ve Malzeme Giderleri"
    alinti: "A _ Direkt İlk Madde ve Malzeme Giderleri : Mamülün bünyesine giren mamülün temel öğesini oluşturan ve mamülün bünyesine doğrudan yüklenebilen maddelerin kullanımı bu grupta yer alır. Üretimde kullanılmayan ve satılan ilk madde ve malzemenin maliyeti, tablonun ticari faaliyete ilişkin bölümünde dikkate alınır."
  - mevzuat: "1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)"
    madde: "Satışların Maliyeti Tablosu, B - Direkt İşçilik Giderleri"
    alinti: "B _ Direkt İşçilik Giderleri : Mamülü meydana getirmek için harcanan ve maliyetlere doğrudan yüklenebilen direkt işçilik giderlerini içerir."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MAL
  unite: "Temel kavramlar ve GÜG kalemleri"
  konu: KAV
  kazanim: "maliyet unsurları"
  tip: uygulama
  zorluk: 1
  soru_bicimi: standart
  kok: "7/A seçeneğini uygulayan AB İşletmesi, ürettiği masaların yapımında kullandığı keresteyi, hangi masada ne kadar tüketildiği ekonomik olarak ayrı izlenebilen direkt ilk madde olarak değerlendirmektedir. Tekdüzen Hesap Planına göre bu kerestenin üretimde kullanım gideri hangi hesap grubunda izlenir?"
  secenekler:
    A: "72 Direkt İşçilik Giderleri"
    B: "73 Genel Üretim Giderleri"
    C: "76 Pazarlama, Satış ve Dağıtım Giderleri"
    D: "77 Genel Yönetim Giderleri"
    E: "71 Direkt İlkmadde ve Malzeme Giderleri"
  dogru: E
  aciklama:
    dogru_neden: "THP'ye göre 71 grubu, üretilen mamulün bünyesine ana madde olarak katılan ve hangi mamulden ne kadar tüketildiği ekonomik bakımdan ayrı izlenebilen ilkmadde ve malzemelerle ilgili gider, yansıtma ve fark hesaplarını kapsar. Kereste bu tanıma uyar."
    celdiriciler:
      A: "72 grubu mamule doğrudan yüklenebilen işçilik giderlerini kapsar; malzeme tüketimi işçilik değildir."
      B: "73 grubu direkt ilk madde ve direkt işçilik dışında kalan giderleri kapsar; kereste bunların dışında kalmaz, kendisi direkt maddedir."
      C: "76 grubu mamulün stoklara verilmesinden alıcılara teslimine kadar yapılan giderleri kapsar; üretimde tüketilen kereste bu grupta değildir."
      D: "77 grubu işletmenin yönetim fonksiyonuna ilişkin giderleri kapsar; üretimde tüketilen malzeme yönetim gideri değildir."
  kaynaklar:
  - mevzuat: "1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 5 (Tek Düzen Hesap Planı)"
    madde: "71 Direkt İlkmadde ve Malzeme Giderleri"
    alinti: "Bu grupta yer alan hesaplar, üretilen mamülün bünyesine ana madde olarak katılan ve hangi mamülden ne kadar tüketildiği, ekonomik bakımdan ayrı olarak izlenebilen ilkmadde ve malzemelerle ilgili gider, yansıtma ve fark hesaplarını kapsar."
  - mevzuat: "1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 5 (Tek Düzen Hesap Planı)"
    madde: "710 Direkt İlkmadde ve Malzeme Giderleri"
    alinti: "Bu giderler, esas üretim gider yerleri ile ilgili olup, mamülün bünyesine giren, mamülün temel öğesini oluşturan ve mamülün bünyesine doğrudan yüklenebilen maddelerin kullanımı fiili tutarlarla bu hesapta izlenir. Üretimde kullanılmayan ve satılan ilkmadde ve malzemenin maliyeti bu hesapta izlenmez."
