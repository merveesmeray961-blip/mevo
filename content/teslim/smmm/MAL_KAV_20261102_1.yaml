  secenekler:
    A: "Normalin üstünde gerçekleşen hammadde fire ve kayıpları"
    B: "Malzemenin edinimiyle doğrudan ilişkilendirilebilen taşıma ve yükleme-boşaltma maliyetleri"
    C: "Fabrika binası ve teçhizatının bakım onarım giderleri ile fabrikanın yönetim ve idare giderleri"
    D: "Direkt işçilik giderleri"
    E: "Endirekt (dolaylı) malzeme ve endirekt (dolaylı) işçilik maliyetleri"
  dogru: A
  aciklama:
    dogru_neden: "TMS 2 paragraf 16'ya göre normalin üstünde gerçekleşen hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri stokların maliyetine dâhil edilmez, gerçekleştikleri dönemde gider olarak yansıtılır."
    celdiriciler:
      B: "Taşıma ve yükleme-boşaltma maliyetleri paragraf 11'e göre satın alma maliyetine dâhildir."
      C: "Fabrika binası ve teçhizatı bakım onarımı ile fabrikanın yönetim ve idaresi paragraf 12'ye göre sabit genel üretim gideri olarak dönüştürme maliyetine dâhildir."
      D: "Direkt işçilik giderleri paragraf 12'ye göre dönüştürme maliyetinin temel unsurudur."
      E: "Endirekt malzeme ve endirekt işçilik paragraf 12'ye göre değişken genel üretim gideri olarak dönüştürme maliyetine dâhildir."
