- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MAL
  unite: "Temel kavramlar ve GÜG kalemleri"
  konu: KAV
  kazanim: "maliyet hesapları"
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: "Tekdüzen Hesap Planında 7 numaralı Maliyet Hesapları sınıfının tanımı aşağıdakilerden hangisidir?"
  secenekler:
    A: "Mal ve hizmet üretimi için yapılan giderlerin toplandığı ve maliyet unsurlarına dönüştürülerek izlendiği hesaplardır."
    B: "Dönem içinde elde edilen satış ve hizmet gelirlerinin toplandığı ve dönem sonunda kâr zarar hesabına aktarıldığı hesaplardır."
    C: "Yalnızca fabrika binası ve makinelerin satın alma bedellerinin izlendiği ve amortismana tabi tutulduğu hesaplardır."
    D: "Mamul ve ticari mal stoklarının dönem sonunda sayım sonuçlarına göre değerlendiği envanter hesaplarıdır."
    E: "İşletmenin ortaklarına dağıtılacak kârın hesaplandığı ve yedeklerin ayrıldığı kâr dağıtım hesaplarıdır."
  dogru: A
  aciklama:
    dogru_neden: "THP'nin 7. Maliyet Hesapları bölümüne göre bu hesaplar, mal ve hizmetlerin planlanan biçim ve niteliğe getirilmesi için yapılan giderlerin toplandığı ve maliyet unsurlarına dönüştürülerek izlendiği hesaplardır."
    celdiriciler:
      B: "Gelirler 6 numaralı sınıfın gelir tablosu hesaplarında izlenir; 7 sınıfı giderleri maliyet unsurlarına dönüştürür."
      C: "Duran varlık alımları maliyet hesaplarında değil 25 ve 26 gruplarında izlenir."
      D: "Stokların envanteri 15 grubu hesaplarında izlenir; maliyet hesapları gider toplama ve dönüştürme hesaplarıdır."
      E: "Kâr dağıtımı özkaynak hesaplarıyla ilgilidir; maliyet hesaplarının işlevi bu değildir."
  kaynaklar:
  - mevzuat: "1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 5 (Tek Düzen Hesap Planı)"
    madde: "7. Maliyet Hesapları"
    alinti: "Maliyet hesapları, mal ve hizmetlerin planlanan biçim ve niteliğe getirilmesi için yapılan giderlerin toplandığı ve maliyet unsurlarına dönüştürülerek izlendiği hesaplardır."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

