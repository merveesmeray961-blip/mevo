- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MAL
  unite: "Temel kavramlar ve GÜG kalemleri"
  konu: KAV
  kazanim: "maliyet unsurları"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "TMS 2 Stoklar standardına göre stokların maliyeti hangi maliyetleri içerir?"
  secenekler:
    A: "Satın alma ve dönüştürme maliyetleri ile stokları mevcut konum ve duruma getirmek için katlanılan diğer maliyetleri"
    B: "Yalnızca satın alma fiyatını ve ithalat vergilerini; işçilik ve üretim giderleri hiçbir şekilde stok maliyetine girmez"
    C: "Yalnızca direkt ilk madde ve direkt işçiliği; genel üretim giderleri her koşulda dönem gideri olur"
    D: "Satın alma ve dönüştürme maliyetleri ile satış ve pazarlama giderlerinin tamamını"
    E: "Dönüştürme maliyetlerini ve işletmenin tüm genel yönetim giderlerini, satın alma maliyetleri hariç"
  dogru: A
  aciklama:
    dogru_neden: "TMS 2 paragraf 10'a göre stokların maliyeti; tüm satın alma maliyetlerini, dönüştürme maliyetlerini ve stokların mevcut konumuna ve durumuna getirilmesi için katlanılan diğer maliyetleri içerir."
    celdiriciler:
      B: "Standart satın alma maliyetini, dönüştürme maliyetlerini ve diğer maliyetleri birlikte sayar."
      C: "Dönüştürme maliyetleri, direkt işçilik ve sistematik dağıtılan genel üretim giderlerini kapsar ve stok maliyetine dâhildir."
      D: "Satış maliyetleri paragraf 16(d)'ye göre stok maliyetine dâhil edilmez."
      E: "Katkısı olmayan genel yönetim giderleri paragraf 16(c)'ye göre stok maliyetine dâhil edilmez; ayrıca satın alma maliyeti de kapsamdadır."
  kaynaklar:
  - mevzuat: "TMS 2 Stoklar"
    madde: "paragraf 10"
    alinti: "Stokların maliyeti; tüm satın alma maliyetlerini, dönüştürme maliyetlerini ve stokların mevcut konumuna ve durumuna getirilmesi için katlanılan diğer maliyetleri içerir."
  - mevzuat: "TMS 2 Stoklar"
    madde: "paragraf 16"
    alinti: "Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal tablolara yansıtılan maliyetlere örnek olarak verilebilir: (a) Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri, (b) Üretim sürecinde bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri."
