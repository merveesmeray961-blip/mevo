- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Ortak ve yan ürün
  konu: ORT
  kazanim: satış değeri yöntemi
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: AZ İşletmesi, tek bir üretim sürecinden X ve Y ortak ürünlerini elde etmektedir. Ortak maliyet 90.000 TL'dir. X ürününden 2.000 kg (kg satış fiyatı 50 TL), Y ürününden 4.000 kg (kg satış fiyatı 25 TL) elde edilmiştir. Ortak maliyet, ayrılma noktasındaki satış değerleri oranında dağıtılırsa X ürününün kg başına maliyeti kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 11,25 TL
    B: 15 TL
    C: 22,5 TL
    D: 45 TL
    E: 50 TL
  dogru: C
  aciklama:
    dogru_neden: TMS 2 paragraf 14'e göre ortak maliyet ürünlerin nispi satış değerine göre dağıtılabilir. X'in satış değeri 100.000 TL, Y'nin 100.000 TL; toplam 200.000 TL'dir. X'in payı 90.000 × 100.000 / 200.000 = 45.000 TL'dir. Kg başına maliyet 45.000 / 2.000 = 22,5 TL'dir.
    celdiriciler:
      A: Y ürününün kg başına maliyetidir; X ürününün maliyeti sorulmaktadır.
      B: Ortak maliyet fiziksel miktara (90.000 / 6.000) bölünmüştür; soru satış değeri oranını istemektedir.
      D: Ortak maliyetin tamamı X'in miktarına (90.000 / 2.000) bölünmüştür; Y ürünü pay almamış gibi işlem yapılmıştır.
      E: X ürününün kg satış fiyatıdır; maliyet değildir.
    hesap_adimlari:
    - X satış değeri = 2.000 × 50 = 100.000 TL; Y satış değeri = 4.000 × 25 = 100.000 TL
    - X payı = 90.000 × 100.000 / 200.000 = 45.000 TL
    - Kg maliyeti = 45.000 / 2.000 = 22,5 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 90000 * (2000 * 50) / (2000 * 50 + 4000 * 25) / 2000
- id: TASLAK
  sinav: smmm
