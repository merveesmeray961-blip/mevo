  kok: AX İşletmesi'nde ortak maliyet 240.000 TL'dir. Ayrılma noktasında P ürününden 5.000 kg (kg fiyatı 36 TL), Q ürününden 2.500 kg (kg fiyatı 48 TL) elde edilmiştir. Ortak maliyet satış değeri oranında dağıtılmış; dönem içinde P ürününün 4.000 kg'ı ve Q ürününün tamamı kg fiyatlarından satılmıştır. Q ürününün kg başına brüt satış kârı kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 9,6 TL
    B: 12 TL
    C: 16 TL
    D: 38,4 TL
    E: 48 TL
  dogru: A
  aciklama:
    dogru_neden: 'Satış değerleri P için 180.000 TL, Q için 120.000 TL; toplam 300.000 TL''dir. Q''nun payı 240.000 × 120.000 / 300.000 = 96.000 TL, kg başına maliyeti 96.000 / 2.500 = 38,4 TL''dir. Brüt kâr kg başına 48 − 38,4 = 9,6 TL''dir. TMS 2 paragraf 14 ortak maliyetin nispi satış değerine göre dağıtımına izin verir. Püf noktaları: P ürününün satış miktarı Q''nun kg kârını etkilemez; gereksiz veridir. Dağıtım ölçüsü miktar değil satış değeridir; fiziksel miktar yöntemiyle bulunan 16 TL tipik hatadır.'
    celdiriciler:
      B: Q'nun kg fiyatından P'nin kg fiyatı (36 TL) düşülmüştür; maliyet düşülmesi gerekirken fiyat farkı alınmıştır.
      C: 'Ortak maliyet fiziksel miktara (240.000 / 7.500 = 32 TL) göre dağıtılmıştır: 48 − 32.'
      D: Q'nun kg başına maliyetidir; kâr için kg fiyatından düşülmesi gerekir.
      E: Q'nun kg satış fiyatıdır; maliyet düşülmemiştir.
    hesap_adimlari:
    - 'Satış değerleri: P 180.000; Q 120.000; toplam 300.000'
    - Q payı = 240.000 × 120.000 / 300.000 = 96.000 TL
    - Q kg maliyeti = 96.000 / 2.500 = 38,4 TL
    - Kg kârı = 48 − 38,4 = 9,6 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir.
