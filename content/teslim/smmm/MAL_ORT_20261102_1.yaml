    - Toplam eşdeğer miktar = 2.000 × 1 + 1.000 × 2 = 4.000
    - Eşdeğer birim maliyet = 150.000 / 4.000 = 37,5 TL
    - M birim maliyeti = 37,5 × 1 = 37,5 TL
  kaynaklar:
