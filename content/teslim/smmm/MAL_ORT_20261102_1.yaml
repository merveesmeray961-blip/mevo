      D: N ürününün birim maliyetidir (eşdeğer birim maliyet × 2); M'nin katsayısı 1'dir.
      E: Ortak maliyet N'nin adedine (1.000) bölünmüştür; M ürünü pay almamış gibi işlem yapılmıştır.
