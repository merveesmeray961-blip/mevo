  zorluk: 1
  soru_bicimi: standart
  kok: AB İşletmesi'nde K ve L ortak ürünleri için ortak maliyet 90.000 TL'dir. K ürününden 8.000 birim elde edilmiştir; K ürünü ek işlemden sonra toplam 150.000 TL'ye satılabilecek ve ayrılma noktasından sonra 30.000 TL ek işlem maliyeti oluşacaktır. L ürünü ek işlemden sonra toplam 130.000 TL'ye satılabilecek ve 50.000 TL ek işlem maliyeti oluşacaktır. Ortak maliyet net satış değeri oranında dağıtılırsa K ürününün birim maliyeti (ortak maliyet payı ve kendi ek işlem maliyeti dahil) kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 10,5 TL
    B: 11,25 TL
    C: 15 TL
    D: 18,75 TL
    E: 84.000 TL
  dogru: A
  aciklama:
    dogru_neden: Ürünler ek işlemden sonra satılacağından net satış değeri esas alınır. K'nın net satış değeri 150.000 − 30.000 = 120.000 TL, L'nin 130.000 − 50.000 = 80.000 TL; toplam 200.000 TL'dir. K'nın ortak maliyet payı 90.000 × 120.000 / 200.000 = 54.000 TL'dir. Ek işlem maliyeti eklenince K'nın toplam maliyeti 84.000 TL, birim maliyeti 84.000 / 8.000 = 10,5 TL olur. TMS 2 paragraf 14 dağıtımın mantıklı ve tutarlı yapılmasını gerektirir.
    celdiriciler:
      B: Ortak maliyetin tamamı (90.000 TL) K'nın birim sayısına bölünmüştür; dağıtım yapılmamıştır.
      C: K'nın net satış değeri (120.000 TL) birim sayısına bölünmüştür; maliyet değil değerdir.
      D: K'nın nihai satış tutarı (150.000 TL) birim sayısına bölünmüştür; bu birim satış fiyatıdır.
      E: K'nın toplam maliyetidir; birim maliyete ulaşmak için birim sayısına bölünmemiştir.
    hesap_adimlari:
    - K NSD = 150.000 − 30.000 = 120.000 TL; L NSD = 130.000 − 50.000 = 80.000 TL
    - K payı = 90.000 × 120.000 / 200.000 = 54.000 TL
    - K toplam maliyet = 54.000 + 30.000 = 84.000 TL
    - Birim maliyet = 84.000 / 8.000 = 10,5 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (90000 * (150000 - 30000) / ((150000 - 30000) + (130000 - 50000)) + 30000) / 8000
