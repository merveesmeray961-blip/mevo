      C: 2.340 ₺ yalnızca ücret sapmasıdır ((25 − 24) × 2.340); zaman sapması da dikkate alınmalıdır.
      E: 58.500 ₺ fiili işçilik maliyetidir (2.340 × 25); sapma tutarı değildir.
