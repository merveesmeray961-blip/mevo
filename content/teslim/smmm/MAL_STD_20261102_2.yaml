      C: 25.000 ₺, fiili GÜG'nin yalnızca sabit bütçeyle karşılaştırılmasıdır; esnek bütçeye değişken GÜG de dahildir.
      D: 104.600 ₺ esnek bütçe tutarıdır; bütçe farkı değildir.
      E: 105.000 ₺ fiili GÜG tutarıdır; bütçe farkı değildir.
    hesap_adimlari:
    - 'Esnek bütçe: 80.000 + 6 × 4.100 = 104.600 ₺'
    - 'Bütçe farkı: 105.000 - 104.600 = 400 ₺ olumsuz'
  kaynaklar:
