  unite: Maliyet muhasebesi
  konu: STD
  kazanim: direkt ilk madde fiyat ve miktar sapması
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: AX İşletmesi'nde bir ilk maddenin standart fiyatı kg başına 8 ₺'dir. Dönemde üretimde 6.000 kg ilk madde kullanılmış (standart miktara eşittir) ve kg fiyatı 8,5 ₺ olarak gerçekleşmiştir. Direkt ilk madde fiyat sapması aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 0,5 ₺ olumsuz
    B: 3.000 ₺ olumsuz
    C: 3.000 ₺ olumlu
    D: 48.000 ₺ olumsuz
    E: 51.000 ₺ olumsuz
  dogru: B
  aciklama:
    dogru_neden: THP 712 uyarınca fiyat farkları fiili ve önceden saptanmış direkt ilkmadde giderleri arasındaki fiyat kaynaklı farklardır. Fiyat sapması = (8,5 − 8) × 6.000 = 3.000 ₺ olumsuzdur; olumsuz fark 712 hesabının borcuna kaydedilir.
    celdiriciler:
      A: 0,5 ₺ yalnızca kg başına fiyat farkıdır; fiyat sapması için fiili miktarla çarpılması gerekir.
      C: Fiili fiyat standart fiyatın üzerinde olduğundan sapma olumsuzdur; olumlu değildir.
      D: 48.000 ₺ standart maliyettir (6.000 × 8); sapma tutarı değildir.
      E: 51.000 ₺ fiili maliyettir (6.000 × 8,5); sapma tutarı değildir.
    hesap_adimlari:
    - 'Fiyat farkı: 8,5 - 8 = 0,5 ₺/kg'
    - 'Fiyat sapması: 0,5 × 6.000 = 3.000 ₺ olumsuz'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 712 Direkt İlkmadde ve Malzeme Fiyat Farkı
    alinti: Önceden saptanmış maliyet hesaplama yöntemlerinin uygulandığı durumlarda fiili direkt ilkmadde ve malzeme giderleri ile önceden saptanmış ve maliyetlere yüklenmiş, direkt ilkmadde ve malzeme giderleri arasındaki olumlu veya olumsuz fiyat farklarının izlendiği hesaptır. Olumsuz fiyat farkları bu hesabın borcuna, olumlu fiyat farkları ise alacağına kaydedilir.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (8.5 - 8) * 6000
