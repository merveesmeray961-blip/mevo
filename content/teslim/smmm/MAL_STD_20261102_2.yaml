  kok: M İşletmesi'nde bir mamul için standart direkt işçilik süresi 3 saat, standart saat ücreti 20 ₺'dir. Dönemde 800 birim mamul üretilmiş; 2.300 saat çalışılmış ve saat ücreti 21 ₺ olarak gerçekleşmiştir. Direkt işçilik zaman (süre) sapması aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 100 ₺ olumlu
    B: 2.000 ₺ olumlu
    C: 2.000 ₺ olumsuz
    D: 2.100 ₺ olumlu
    E: 48.000 ₺ olumsuz
  dogru: B
  aciklama:
    dogru_neden: THP 723'e göre olumlu süre farkları hesabın alacağına kaydedilir. Standart süre 800 × 3 = 2.400 saattir. Zaman sapması = (2.300 − 2.400) × 20 = −2.000 ₺'dir; fiili süre standarttan kısa olduğu için sapma 2.000 ₺ olumludur.
    celdiriciler:
      A: 100 ₺ olumlu, yalnızca saat farkının (100 saat) tutar gibi yazılmasıdır; zaman sapması için standart ücretle çarpmak gerekir.
      C: Fiili süre standart süreden kısa olduğundan zaman sapması olumsuz değil olumludur.
      D: 2.100 ₺, saat farkının fiili ücretle (21) çarpılmasıdır; zaman sapması standart ücretle hesaplanır.
      E: 48.000 ₺ standart işçilik maliyetidir (2.400 × 20); sapma tutarı değildir.
    hesap_adimlari:
    - 'Standart süre: 800 × 3 = 2.400 saat'
    - 'Zaman sapması: (2.300 - 2.400) × 20 = -2.000 ₺ olumlu'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 723 Direkt İşçilik Süre (Zaman) Farkları
    alinti: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda fiili giderler ile önceden saptanmış giderler arasındaki olumlu ya da olumsuz süre (zaman) farklarının kaydedildiği hesaptır. Olumsuz süre farkları bu hesabın borcuna olumlu süre farkları ise alacağına kaydedilir.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (2400 - 2300) * 20
