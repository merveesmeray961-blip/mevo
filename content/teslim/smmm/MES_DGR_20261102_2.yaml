      D: "Md. 24/2 başlangıç yılına ilişkin yükümlülüğün takip eden iki yılda tamamlanmasına izin verir."
      E: "Muafiyet faaliyete başlanıncaya kadar sürer; faaliyete başlayan kişinin yükümlülüğü o yıl başlar."
