    alinti: "Stajyer mentorluğu yapanlar mentorluk yaptıkları her ay için 1 kredi kazanırlar. Bu şekilde elde edilen krediler her yıl için 7 krediyi geçemez."
  - mevzuat: Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-b
