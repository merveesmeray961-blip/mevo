  kazanim: SMGE
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "Meslek mensubu M, bir takvim yılında 12 ay boyunca stajyer mentorluğu yapmış, Birlik tarafından düzenlenen bir seminere konuşmacı olarak katılmış ve SÜRGEM'e akredite bir kuruluşun düzenlediği bir seminere dinleyici olarak katılmıştır. Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği'ne göre M'nin bu yıl diğer faaliyetlerden elde edeceği toplam kredi kaçtır?"
  secenekler:
    A: "9 kredi"
    B: "12 kredi"
    C: "14 kredi"
    D: "19 kredi"
    E: "120 kredi"
  dogru: C
  aciklama:
    dogru_neden: "SMGE Yönetmeliği md. 13/1 uyarınca stajyer mentorluğunda her ay için 1 kredi kazanılır, ancak bu yolla elde edilen krediler yılda 7 krediyi geçemez (12 ay için 12 değil 7 kredi). Birlik tarafından düzenlenen etkinliğe konuşmacı olarak katılım 5 kredi, SÜRGEM'e akredite kuruluşun etkinliğine katılım ise 2 kredidir. Toplam 7 + 5 + 2 = 14 kredi. Püf noktaları: Mentorluk kredisinde yıllık 7 kredi sınırı vardır; konuşmacılık katılımdan ayrı değerlendirilir ve aynı etkinlik için katılım kredisi eklenmez."
    hesap_adimlari:
      - "Mentorluk: 12 ay x 1 = 12 kredi, yıllık üst sınır 7 kredi olduğundan 7 kredi"
      - "Birlik semineri, konuşmacı olarak katılım: 5 kredi"
      - "Akredite kuruluş semineri, katılım: 2 kredi"
      - "Toplam: 7 + 5 + 2 = 14 kredi"
    celdiriciler:
      A: "9 kredi, konuşmacı olarak katılım kredisi (5) hesaba katılmadan bulunur (7 + 2)."
      B: "12 kredi, mentorluk kredisi sınırsız (12 ay) alınıp seminerler eklenmeden ya da 7 + 5 şeklinde akredite kuruluş kredisi unutularak bulunur."
      D: "19 kredi, mentorluk kredisindeki 7 kredilik yıllık sınır uygulanmadan (12 + 5 + 2) bulunur."
      E: "120 kredi, üç yıllık dönem için aranan toplam kredidir; sorulan diğer faaliyetlerden elde edilen yıllık kredi değildir."
  dogrulama:
    python: "sonuc = min(12 * 1, 7) + 5 + 2"
  kaynaklar:
