    C: "İlk yıl için de en az 30 kredi alma şartı aranır; yükümlülük hemen başlar."
    D: "Başlangıç yılına ilişkin yükümlülüğün aynı yıl içinde tamamlanması zorunludur ve kredi sınırı aranmaz."
    E: "Bu kişiler faaliyete başlasalar dahi süresiz olarak eğitimden muaf kalır ve hiçbir kredi aranmaz."
  dogru: A
