    dogru_neden: "SMGE Yönetmeliği md. 24/2 uyarınca zorunlu eğitim yükümlülüğü bulunmayan meslek mensuplarının zorunlu eğitim kapsamındaki faaliyetlere başlamaları hâlinde eğitim yükümlülükleri faaliyete başladıkları yıl başlar; bunlardan ilk yıl için en az 30 kredi alma şartı aranmaz ve işe başladıkları yıla ilişkin eğitim yükümlülüklerini takip eden iki yılda tamamlamaları şarttır."
    celdiriciler:
      B: "İzleyen yılın ilk günü kuralı, ruhsatını yeni edinenler için md. 9'dadır; md. 24/2'ye göre yükümlülük faaliyete başlanılan yıl başlar."
