    C: "Kurul düzenli olarak ayda en az bir kez toplanır."
    D: "Boşalan üyelik için aynı usulle yeni üye atanır ve yeni üye kalan süreyi tamamlar."
    E: "Üyeler, meslek mensupları arasından Birlik Genel Kurulu tarafından seçilir."
