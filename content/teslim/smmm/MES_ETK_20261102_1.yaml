- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: etik kurulu
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik'e göre aşağıdakilerden hangisi Etik Kurulunun görev ve yetkilerinden **değildir**?"
  secenekler:
    A: "Etik ilke ve uygulamalarına ilişkin tebliğ ve sirkülerlerin taslaklarını hazırlamak"
    B: "Etik ilkelerini ihlal eden meslek mensuplarına doğrudan disiplin cezası vermek"
    C: "Meslekte etik kültürünü yerleştirmek üzere çalışmalar yapmak veya yaptırmak"
    D: "Etik ihlali iddiasıyla odalardan gelen başvuruları inceleyip sonucu Birlik Yönetim Kurulu aracılığıyla ilgili odalara bildirmek"
    E: "Mesleki etiğin geliştirilmesi için eğitim programları hazırlamak"
  dogru: B
  aciklama:
    dogru_neden: "Yönetmeliğin 7 nci maddesinde Etik Kurulunun görevleri sayılmıştır. Kurul, ihlal iddialarını inceleyip sonucu Birlik Yönetim Kurulu aracılığıyla ilgili odalara bildirir; disiplin cezası verme yetkisi bu görevler arasında yer almaz."
    celdiriciler:
      A: "Md. 7/1-a'ya göre etik ilke ve uygulamalarına ilişkin tebliğ, sirküler ve benzerlerinin taslaklarını hazırlamak Kurulun görevidir."
      C: "Md. 7/1-c'ye göre meslekte etik kültürünü yerleştirmek üzere çalışmalar yapmak veya yaptırmak Kurulun görevidir."
      D: "Md. 7/1-ç'ye göre odalardan gelen başvurular üzerine inceleme yapıp sonucu Birlik Yönetim Kurulu aracılığıyla odalara bildirmek Kurulun görevidir."
      E: "Md. 7/1-b'ye göre mesleki etiğin geliştirilmesi için eğitim programları hazırlamak Kurulun görevidir."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 7/1-a
    alinti: "Etik ilke ve uygulamalarına ilişkin tebliğ, sirküler ve benzerlerinin tas- laklarını hazırlamak"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 7/1-b
    alinti: "Mesleki etiğin geliştirilmesi ve yaygınlaştırılması için eğitim program- ları hazırlamak"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 7/1-c
    alinti: "c) Meslekte etik kültürünü yerleştirmek üzere çalışmalar yapmak veya yaptırmak ve bu konularda yapılacak çalışmalara destek olmak,"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 7/1-ç
    alinti: "ç) Meslek mensuplarının uymaları gereken etik davranış ilkelerinin ihlal edildiği iddiasıyla odalardan yapılacak başvurular üzerine gerekli incele- me ve araştırmaları yaparak sonuçlarını Birlik Yönetim Kurulu aracılığıy- la ilgili odalara bildirmek."
