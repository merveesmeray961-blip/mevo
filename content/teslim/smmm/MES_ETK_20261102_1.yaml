- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: önlemler
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Meslek mensubu T, bir müşterinin mevcut meslek mensubu M'nin yerine geçmesi için teklif vermeyi düşünmekte ve M ile müşterisi hakkında görüşmek istemektedir. SMMM ve YMM'lerin Etik İlkeleri'ne göre M'nin T ile müşterisi konusunda yapabileceği görüşmenin kapsamı neye bağlıdır?"
  secenekler:
    A: "T'nin meslek odasındaki kıdemine"
    B: "Müşterinin izni ile yasal veya etik gerekliliklere"
    C: "Meslek odasının vereceği yazılı izne ve Birlik Yönetim Kurulu onayına"
    D: "Mevcut sözleşmenin sona ereceği tarihten itibaren geçen süreye"
    E: "M'nin kendi takdirine; çünkü gizlilik ilkesi bu durumda uygulanmaz"
  dogru: B
  aciklama:
    dogru_neden: "Etik İlkelerin İkinci Kısım md. 35/3 hükmüne göre mevcut meslek mensubu gizlilik ilkesine uymakla yükümlüdür. Bu nedenle onun, işi alması önerilen meslek mensubuyla müşterisi konusunda yapabileceği görüşmenin kapsamı müşterisinin izin vermesine ya da bu tür bir iletişime izin veren yasal ya da etik gerekliliklere bağlıdır. Püf noktaları: T'nin M ile doğrudan iletişim kurması gerekir (md. 35/2); ancak M gizlilikle bağlı olduğundan her bilgiyi serbestçe veremez. Gizlilik ilkesi, meslek mensubunun işi devretmesi durumunda da geçerlidir."
    celdiriciler:
      A: "T'nin meslek odasındaki kıdemi, M'nin gizlilik yükümlülüğü kapsamındaki görüşmeyi belirlemez; md. 35/3 müşterinin iznine ve gerekliliklere bağlar."
      C: "Md. 35/3 meslek odasının yazılı iznini ve Birlik Yönetim Kurulu onayını aramaz; belirleyici olan müşterinin izni ile yasal veya etik gerekliliklerdir."
      D: "Mevcut sözleşmenin sona ereceği tarihten itibaren geçen süre, md. 35/3'te görüşme kapsamını belirleyen bir ölçüt değildir."
      E: "Mevcut meslek mensubu gizlilik ilkesine uymakla yükümlüdür (md. 35/3); görüşme kapsamı kendi takdirine bırakılmamıştır."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 35/2
    alinti: "(2) Söz konusu tehditlerin önemi değerlendirilmelidir. Bu amaçla mevcut meslek mensubu ile doğrudan iletişim kurularak, önerilen değişim ile ilgili tüm gerçeklerin ortaya konulması ve böylece meslek mensubunun sözleşmenin kabul edilmesinin uygun olup olmayacağına karar vermesi sağlanır."
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 35/3
    alinti: "Mevcut meslek mensubu gizlilik ilkesine uymakla yükümlüdür. Do- layısıyla mevcut meslek mensubunun işi alması önerilen meslek men- subuyla müşterisi konusunda yapabileceği görüşmenin kapsamı müş- terisinin izin vermesine ya da bu tür bir iletişime izin veren yasal ya da etik gerekliliklere bağlı olacaktır"
