- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: temel etik ilkeleri
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "Meslek mensubu M, kendi bürosunu tanıtan bir broşürde, hiçbir veriye dayanmaksızın başka bir büronun hizmetlerinin kendi bürosununkinden daha kötü olduğunu belirtmiştir. M'nin bu davranışı, SMMM ve YMM'lerin Etik İlkeleri uyarınca tanıtım yaparken uyulması gereken aşağıdaki yükümlülüklerden hangisine aykırıdır?"
  secenekler:
    A: "Yeni bir müşteriyi kabul etmeden önce tehditleri değerlendirme"
    B: "Sunduğu hizmetler ve iş tecrübeleri hakkında abartılı iddialarda bulunmama"
    C: "Gizli bilgiyi kişisel çıkar uğruna ya da üçüncü kişilerin yararına kullanmama"
    D: "Diğer meslek mensupları hakkında doğrulanmamış karşılaştırma yapmama"
    E: "Üst düzey sözleşme ekibini belirli aralıklarla rotasyona tabi tutma"
  dogru: D
  aciklama:
    dogru_neden: "Etik İlkelerin Birinci Kısım md. 17/1-c bendine göre meslek mensubu, tanıtım yaparken diğer meslek mensuplarına yönelik doğrulanmamış karşılaştırmalar ve küçültücü göndermeler (atıflar) yapmamalıdır. M'nin başka bürolar hakkında veriye dayanmayan kötüleyici karşılaştırması bu yükümlülüğe aykırıdır."
    celdiriciler:
      A: "Müşteri kabulüne ilişkin tehdit değerlendirmesi, tanıtım yükümlülüğü değil, İkinci Kısım md. 33'teki müşteri kabulü hükmüdür."
      B: "Abartılı iddialarda bulunmama (md. 17/1-b) kendi hizmetleri hakkındaki iddialarla ilgilidir; olayda M diğer büroyu kötülemektedir."
      C: "Gizli bilginin kişisel çıkar için kullanılmaması md. 12/1-b'nin konusudur; olayla ilgili değildir."
      E: "Sözleşme ekibinin rotasyona tabi tutulması tehditlere karşı alınabilecek bir önlemdir (md. 30/e); tanıtım yükümlülüğü değildir."
