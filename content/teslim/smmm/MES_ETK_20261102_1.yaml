- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: temel etik ilkeleri
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler'e göre meslek mensubunun, üçüncü kişilerin haksız ve uygunsuz biçimde yaptıkları baskıların meslekî kararlarını etkilemesine ya da engellemesine izin vermemesi, hangi temel etik ilkesinin gereğidir?"
  secenekler:
    A: "Dürüstlük"
    B: "Gizlilik"
    C: "Tarafsızlık"
    D: "Meslekî davranış"
    E: "Meslekî yeterlilik ve özen"
  dogru: C
  aciklama:
    dogru_neden: "Etik İlkelerin Birinci Kısım md. 1/1-b bendine göre tarafsızlık, üçüncü kişilerin haksız ve uygunsuz biçimde yaptıkları baskıların meslek mensuplarının meslekî kararlarını etkilememesi veya engellememesidir."
    celdiriciler:
      A: "Dürüstlük, meslekî ve iş ilişkilerinde doğru sözlü ve dürüst davranmaktır (md. 1/1-a); baskılara karşı karar bağımsızlığını anlatmaz."
      B: "Gizlilik, meslekî ilişkiler sonucu elde edilen bilgilerin açıklanmamasıdır (md. 1/1-ç); baskıyla ilgili değildir."
      D: "Meslekî davranış, yasa ve yönetmeliklere uyma ve mesleğin itibarını zedeleyecek davranışlardan kaçınmadır (md. 1/1-d)."
      E: "Meslekî yeterlilik ve özen, teknik ve meslekî standartlara uygun özenli davranmaktır (md. 1/1-c)."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: Birinci Kısım md. 1/1-b
    alinti: "Yanlı veya önyargılı davranarak; üçüncü kişilerin haksız ve uygunsuz biçimde yaptıkları baskıların meslek mensuplarının mes- lekî kararlarını etkilememesi veya engellememesidir."
  gecerlilik: {baslangic: '2007-10-19', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: temel etik ilkeleri
  tip: kavrama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler'e göre meslek mensubunun sahip olduğu gizli bilgileri açıklamasının gerekli veya uygun olabileceği durumlardan hangisi **değildir**?"
  secenekler:
    A: "Bir meslek odasının kalite raporuna veri sağlamak"
    B: "Yasal bir süreçte meslek mensubunun meslekî çıkarlarını korumak amacıyla açıklama yapmak"
    C: "Kanuna aykırı bir durumu ortaya çıkarmak için ilgili kamu otoritesine açıklama yapmak"
    D: "Gizli bilgiyi, meslek mensubunun kendi çıkarını sağlamak için üçüncü kişilere aktarmak"
    E: "Bir meslek örgütünün yürüttüğü soruşturmaya veri sağlamak"
  dogru: D
  aciklama:
    dogru_neden: "Etik İlkelerin Birinci Kısım md. 14 hükmü, gizli bilginin açıklanmasının gerekli veya uygun olabileceği hâlleri sayar. Md. 12/1-b ise meslek mensubunun gizli bilgiyi kişisel çıkar uğruna ya da üçüncü kişilerin yararına kullanmasını yasaklar; bu nedenle D seçeneği bu hâllerden değildir. Püf noktaları: Açıklamayı mümkün kılan hâller kanun, müşteri izni veya meslekî görev ve hak kapsamındadır; kişisel çıkar bunların arasında yer almaz. Meslek odası ve örgütlerine veri sağlamak ile yasal süreçte meslekî çıkarı korumak ise sayılan hâllerdendir."
    celdiriciler:
      A: "Md. 14/c-1'e göre bir meslek odasının veya örgütünün kalite raporuna veri sağlamak açıklamanın uygun olabileceği hâllerdendir."
      B: "Md. 14/c-3'e göre yasal bir süreçte meslek mensubunun meslekî çıkarlarını korumak amacıyla açıklama yapması açıklamanın uygun olabileceği hâllerdendir."
      C: "Md. 14/b-2'ye göre kanuna aykırı bir durumu ortaya çıkarmak için ilgili kamu otoritesine açıklama yapmak kanun gereği açıklama örneğidir."
      E: "Md. 14/c-2'ye göre meslek örgütünün yürüttüğü araştırma veya soruşturmaya veri sağlamak açıklamanın uygun olabileceği hâllerdendir."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: Birinci Kısım md. 14/b-2
    alinti: "2) Kanuna aykırı bir durumu ortaya çıkarmak için ilgili kamu otoritesine açıklama yapmak,"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: Birinci Kısım md. 14/c
    alinti: "1) Bir meslek odasının veya meslek örgütünün kalite raporuna veri sağ- lamak. 2) Bir meslek odasının, meslek örgütünün veya düzenleyici bir organın yürüttüğü araştırma veya soruşturmaya veri sağlamak. 3) Yasal bir süreçte meslek mensubunun meslekî çıkarlarını korumak amacıyla açıklama yapması."
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: Birinci Kısım md. 12/1-b
    alinti: "Meslekî ilişkisi sonucu elde edilen gizli bilgiyi kişisel çıkar uğruna ya da üçüncü kişilerin yararına kullanmaması"
  gecerlilik: {baslangic: '2007-10-19', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: önlemler
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler'e göre bağımsız çalışan meslek mensubunun çıkar çatışmasına neden olan koşullarda alması gereken önlemlerden hangisi **değildir**?"
  secenekler:
    A: "Çatışma içindeki müşterilerden yalnızca birine bilgi verilip onayının alınması"
    B: "Farklı sözleşme ekiplerinin kullanılması"
    C: "Bilgiye ulaşımı engelleyen süreçler oluşturulması"
    D: "Firma ortakları ve çalışanları tarafından gizlilik anlaşmaları imzalanması"
    E: "Çıkar çatışması içindeki birden fazla müşteriye hizmet verilecekse ilgili tüm taraflara bilgi verilip onaylarının alınması"
  dogru: A
  aciklama:
    dogru_neden: "Etik İlkelerin İkinci Kısım md. 37/1-b hükmüne göre meslek mensubunun çıkar çatışması içinde olan iki ya da daha fazla müşteri için hizmet vermesi durumunda durum hakkında ilgili tüm taraflara bilgi verilmesi ve onaylarının alınması gerekir. Yalnızca bir müşteriye bilgi verilip onayının alınması bu önlem değildir."
    celdiriciler:
      B: "Md. 37/1-ç'ye göre farklı sözleşme ekiplerinin kullanılması çıkar çatışmasına karşı alınacak önlemdir."
      C: "Md. 37/1-d'ye göre bilgiye ulaşımı engelleyen süreçler oluşturulması çıkar çatışmasına karşı alınacak önlemdir."
      D: "Md. 37/1-f'ye göre firma ortakları ve çalışanları tarafından imzalanan gizlilik anlaşmaları yapılması önlemlerdendir."
      E: "Md. 37/1-b'ye göre çatışma içindeki iki ya da daha fazla müşteri için hizmet verilmesi durumunda ilgili tüm tarafların bilgilendirilmesi ve onaylarının alınması önlemlerdendir."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 37/1-b
    alinti: "b) Meslek mensubunun çıkar çatışması içinde olan iki ya da daha fazla müşteri için hizmet vermesi durumunda, durum hakkında ilgili tüm taraf- lara bilgi verilmesi ve onaylarının alınması,"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 37/1-ç-f
    alinti: "ç) Farklı sözleşme ekiplerinin kullanılması, d) Bilgiye ulaşımı engelleyen süreçler oluşturulması, e) Güvenlik ve gizlilikle ilgili konularda sözleşme ekipleri için rehberler hazırlanması, f) Firma ortakları ve çalışanları tarafından imzalanan gizlilik anlaşmaları yapılması."
  gecerlilik: {baslangic: '2007-10-19', bitis: null, yila_bagli_tutar: false}
