- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: beş temel tehdit
  tip: uygulama
  zorluk: 1
  soru_bicimi: standart
  kok: "Bağımsız çalışan meslek mensubu B, bir güvence sağlama sözleşmesi müşterisi adına, müşterinin üçüncü taraflarla yaşadığı bir hukuki anlaşmazlıkta taraf olmuştur. SMMM ve YMM'lerin Etik İlkelerine göre bu durum aşağıdaki tehdit türlerinden hangisine örnektir?"
  secenekler:
    A: "Kişisel çıkar tehdidi"
    B: "Yeniden değerlendirme tehdidi"
    C: "Taraf tutma tehdidi"
    D: "Yakınlık tehdidi"
    E: "Yıldırma amaçlı tehdit"
  dogru: C
  aciklama:
    dogru_neden: "Etik İlkelerin İkinci Kısım md. 23/1-b bendine göre üçüncü taraflarla ilgili hukuki itilaf ve anlaşmazlıklarda güvence sağlama sözleşmesi müşterisi adına taraf olmak, bağımsız çalışan meslek mensubu için taraf tutma tehdidi yaratabilecek durumlardandır."
    celdiriciler:
      A: "Kişisel çıkar tehdidi, meslek mensubunun kendisinin veya yakın ailesinin finansal ya da diğer çıkarlarından doğar; olayda böyle bir çıkar yoktur."
      B: "Yeniden değerlendirme tehdidi, daha önce alınmış bir kararın aynı meslek mensubunca yeniden değerlendirilmesinden doğar."
      D: "Yakınlık tehdidi, üçüncü kişilerle kurulan yakın ilişkilerden doğar; olayda ilişki değil taraf olma söz konusudur."
      E: "Yıldırma amaçlı tehdit, gerçek veya hissedilen tehditler nedeniyle tarafsız davranmaktan kaçınmaya zorlanmaktan doğar."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 23/1-b
    alinti: "b) Üçüncü taraflarla ilgili hukuki itilaf ve anlaşmazlıklarda güvence sağ- lama sözleşme müşterisi adına taraf olmak."
