  aciklama:
    dogru_neden: "Yönetmeliğin 5 inci maddesine göre Etik Kurulu üyeleri, meslek mensupları arasından TÜRMOB Yönetim Kurulu tarafından atanır; Birlik Genel Kurulunca seçilmezler. Püf noktaları: Kurulun üyeleri seçimle değil atamayla belirlenir. Atama yetkisi Genel Kurula değil Yönetim Kuruluna aittir. Boşalan üyeliğe de aynı usulle (atamayla) yeni üye getirilir ve yeni üye kalan süreyi tamamlar."
    celdiriciler:
      A: "Md. 5'e göre üyeler, meslek mensupları arasından TÜRMOB Yönetim Kurulu tarafından atanır; ifade doğrudur."
      B: "Md. 5'e göre üyelerin görev süresi TÜRMOB Yönetim Kurulunun görev süresi ile sınırlı olmak üzere üç yıldır; ifade doğrudur."
      C: "Md. 6'ya göre Etik Kurulu düzenli olarak ayda en az bir kez toplanır; ifade doğrudur."
      D: "Md. 5'e göre üyeliğin boşalması hâlinde aynı usulle yeni üye ataması yapılır ve yeni üye kalan süreyi tamamlar; ifade doğrudur."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 5
    alinti: "arasından Türkiye Serbest Muhasebeci Malî Müşavirler ve Yeminli Malî Müşavirler Odaları Birliği Yönetim Kurulu tarafından"
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 5
    alinti: "görev süresi ile sınırlı olmak üzere üç yıldır. Herhangi bir nedenle üyeliğin boşalması halinde aynı usulle yeni üye ataması ya- pılır. Yeni atanan üye kalan süreyi tamamlamak üzere göreve başlar."
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 6
    alinti: "ayda en az bir kez"
