- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: etik kurulu
  tip: bilgi
  zorluk: 2
  soru_bicimi: standart
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik'e göre Etik Kurulu, Başkan, Başkan Yardımcısı ve Sekreter dâhil kaç üyeden oluşur?"
  secenekler:
    A: "En az yedi, en fazla 11 üyeden oluşur."
    B: "En az beş, en fazla on üyeden oluşur."
    C: "En az yedi, en fazla dokuz üyeden oluşur."
    D: "En az dokuz, en fazla 13 üyeden oluşur."
    E: "En az 11, en fazla 15 üyeden oluşur."
  dogru: A
  aciklama:
    dogru_neden: "Yönetmeliğin 5 inci maddesine göre Etik Kurulu, biri Başkan, biri Başkan Yardımcısı ve biri Sekreter olmak üzere en az yedi en fazla 11 üyeden oluşur."
    celdiriciler:
      B: "En az beş ve en fazla on üye, md. 5'te öngörülen sayı aralığı değildir; alt sınır yedi, üst sınır 11'dir."
      C: "Üst sınır dokuz değil 11'dir; md. 5 en az yedi en fazla 11 üye öngörür."
      D: "Alt sınır dokuz değil yedidir ve üst sınır 13 değil 11'dir."
      E: "Alt sınır 11 değil yedidir; 11, üst sınırdır."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik
    madde: md. 5
    alinti: "biri Başkan, biri Başkan Yardımcısı (Ek ibare:RG-08/04/2018-30385) ve biri Sekreter olmak üzere en az yedi en fazla 11 üyeden oluşur."
