- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Etik İlkeler Yönetmeliği
  konu: ETK
  kazanim: önlemler
  tip: kavrama
  zorluk: 2
  soru_bicimi: olumsuz
  kok: "SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler'e göre bağımsız çalışan meslek mensubunun yeni müşteri kabulü ile ilgili aşağıdakilerden hangisi **yanlıştır**?"
  secenekler:
    A: "Müşterinin yasadışı faaliyetler içinde bulunması (para aklama gibi) temel etik ilkeleri tehdit eden konulardandır."
    B: "Müşteri kabulünden önce, bu kabulün temel etik ilkelere yönelik bir tehdit yaratmayacağından emin olunmalıdır."
    C: "Tehditler kabul edilebilir bir düzeye indirilemezse müşteri kabul edilmekten kaçınılmalıdır."
    D: "Yenilenen sözleşmeler, müşteri kabulü kararlarında periyodik olarak gözden geçirilmelidir."
    E: "Müşteri ile ilgili kuşkulu noktalar yalnızca tarafsızlık ilkesine yönelik tehdit oluşturabilir."
  dogru: E
  aciklama:
    dogru_neden: "Etik İlkelerin İkinci Kısım md. 33/1'e göre müşteri ile ilgili (sahipleri, yönetimi ve faaliyetleri) bazı kuşkulu noktalar dürüstlük veya meslekî davranış ilkelerine yönelik tehdit oluşturabilir. Bu tehditlerin yalnızca tarafsızlık ilkesine yönelik olduğu söylenemez."
    celdiriciler:
      A: "Md. 33/2'ye göre müşterinin yasadışı faaliyetler içinde bulunması (para aklama gibi) temel etik ilkeleri tehdit eden müşteri ile ilgili konulardandır; ifade doğrudur."
      B: "Md. 33/1'e göre meslek mensubu, yeni müşteriyi kabul etmeden önce kabulün tehdit yaratmayacağından emin olmalıdır; ifade doğrudur."
      C: "Md. 33/5'e göre tehditler kabul edilebilir bir düzeye indirilemezse meslek mensubu müşteriyi kabul etmekten kaçınmalıdır; ifade doğrudur."
      D: "Md. 33/6'ya göre müşteri kabulü ile ilgili kararlarda yenilenen sözleşmeler periyodik olarak gözden geçirilmelidir; ifade doğrudur."
  kaynaklar:
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 33/1
    alinti: "Bağımsız çalışan meslek mensubu yeni bir müşteriyi kabul etmeden önce, bu tür bir iş kabulünün temel etik ilkelere yönelik bir tehdit yaratmayacağından emin olmalıdır. Müşteri ile ilgili (sahipleri, yönetimi ve faaliyetleri) bazı kuşkulu noktalar dürüstlük veya meslekî davranış ilkelerine yönelik tehdit oluşturabilir."
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 33/2
    alinti: "(2) Müşterinin yasadışı faaliyetler içinde bulunması (para aklama gibi), dürüst olmaması veya tartışmalı finansal raporlama uygulamaları temel etik ilkeleri tehdit eden müşteri ile ilgili konulardır."
  - mevzuat: SMMM ve YMM'lerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmelik (Ek-1)
    madde: İkinci Kısım md. 33/5-6
    alinti: "(5) Tehditlerin kabul edilebilir bir düzeye indirilememesi durumunda meslek mensubu müşteriyi kabul etmekten kaçınmalıdır. (6) Müşteri kabulü ile ilgili kararlarda yenilenen sözleşmeler periyodik olarak gözden geçirilmelidir."
