  kok: "Meslek mensubu M'nin istihdam ettiği personel, başka bir meslek mensubunun hizmetlerini yersiz açıklamalarla kötüleyerek haksız rekabet eylemi gerçekleştirmiştir. Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre M'nin sorumluluğu aşağıdakilerden hangisidir?"
