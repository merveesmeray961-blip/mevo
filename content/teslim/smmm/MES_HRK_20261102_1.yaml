- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: MES
  unite: Haksız Rekabet ve Reklam Yasağı
  konu: HRK
  kazanim: reklam kuralları
  tip: kavrama
  zorluk: 3
  soru_bicimi: olumsuz
  kok: "Haksız Rekabet ve Reklam Yasağı Yönetmeliği'ne göre başlıklı kâğıtlarda, kartvizitlerde ve diğer basılı evrakta kullanılacak unvanlarla ilgili aşağıdakilerden hangisi **yanlıştır**?"
  secenekler:
    A: "Mesleki ve akademik unvan dışında unvan kullanılamaz."
    B: "Kamu ve özel kuruluşlar ile siyasi partilerdeki geçmiş ve mevcut görevler belirtilemez."
    C: "Halen görevli olanlar, bu unvanlarını her türlü basılı evrakta serbestçe kullanabilir."
    D: "Halen görevli olanlar, bu unvanlarını ancak görevleri ile sınırlı olmak kaydıyla kullanabilir."
    E: "Odalar ve Birlik organlarında geçmişte görev alan meslek mensupları bu unvanlarını kullanamaz."
  dogru: C
  aciklama:
    dogru_neden: "Yönetmeliğin 15 inci maddesinin beşinci fıkrasına göre Oda ve Birlik organlarında halen görevli olanlar bu unvanlarını ancak bu görevin ifasında ve bu görevleri ile sınırlı olmak kaydıyla kullanabilirler. Serbestçe kullanabilecekleri yönündeki ifade yanlıştır. Püf noktaları: Geçmişte görev alanlar unvanı hiç kullanamaz; halen görevli olanlar yalnızca görev kapsamında kullanabilir. Mesleki ve akademik unvan dışında unvan yasağının tek istisnası, 2025'te eklenen (7) fıkrasındaki kamu tüzel kişilerinden lisans ve ruhsatla iktisap edilen tek unvandır."
    celdiriciler:
      A: "Md. 15/5'e göre mesleki ve akademik unvan dışında unvan kullanılamaz; ifade doğrudur."
      B: "Md. 15/5'e göre kamu ve özel kuruluşlar ile siyasi partilerdeki geçmiş ve mevcut görevler belirtilemez; ifade doğrudur."
