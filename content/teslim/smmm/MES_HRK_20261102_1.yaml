    C: "M, yalnızca eylemi bilerek yönlendirmişse sorumludur."
    D: "M, yalnızca odaya karşı sorumludur; zarar görenlere karşı sorumlu değildir."
    E: "Sorumluluk, personelin bağlı olduğu Birliğe aittir."
