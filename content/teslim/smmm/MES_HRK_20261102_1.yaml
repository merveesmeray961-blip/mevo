    celdiriciler:
      B: "Md. 11, meslek mensubunu da sorumlu tutar; sorumluluk yalnızca personele ait değildir."
      C: "Md. 11 sorumluluğu meslek mensubunun eylemi bilerek yönlendirmesine bağlamaz."
      D: "Md. 11, sorumluluğu hem odaya hem zarar görenlere karşı öngörür."
      E: "Personel Birliğe bağlı değildir; md. 11 sorumluluğu istihdam eden meslek mensubuna yükler."
  kaynaklar:
  - mevzuat: SMMM ve YMM Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği
    madde: md. 11
