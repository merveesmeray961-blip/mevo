      D: Bütçe kanun teklifi sürecin sonunda TBMM’ye sunulur (md. 18); süreci başlatan belge değildir.
      E: Yatırım programı kamu yatırımlarına ilişkin ayrı bir belgedir (md. 19/2); süreci başlatan belge orta vadeli programdır.
