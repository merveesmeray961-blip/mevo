    B: Haziran ayı sonuna kadar yayımlanan bütçe çağrısı
    C: Eylül ayının ilk haftası sonuna kadar yayımlanan orta vadeli program
    D: Eylül ayı sonuna kadar yayımlanan merkezî yönetim bütçe kanun teklifi
