    madde: md. 16/2
    alinti: Merkezî yönetim bütçesinin hazırlanma süreci, Cumhurbaşkanı tarafından en geç Eylül ayının ilk haftası sonuna kadar kalkınma planları, stratejik planlar ve genel ekonomik koşulların gerekleri doğrultusunda makro politikaları, ilkeleri, hedef ve gösterge niteliğindeki temel ekonomik büyüklükleri, gelecek üç yıla ilişkin toplam gelir ve gider tahminlerini, bütçe dengesi ve borçlanma durumu ile kamu idarelerinin ödenek teklif tavanlarını içeren orta vadeli programın Resmî Gazete’de yayımlanması ile başlar.
