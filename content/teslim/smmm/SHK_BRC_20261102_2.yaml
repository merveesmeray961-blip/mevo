    A: "Fiilden iki yıl sonra, 3 Mart 2017'de"
    B: "Öğrenmeden iki yıl sonra, 3 Mart 2021'de"
    C: "Fiilden on yıl sonra, 3 Mart 2025'te"
    D: "Öğrenmeden itibaren on yıl sonra, 3 Mart 2029'da"
    E: "Zamanaşımına uğramaz"
  dogru: B
  aciklama:
    dogru_neden: "Md. 72/1 uyarınca iki yıllık süre zararın ve tazminat yükümlüsünün öğrenildiği tarihten, on yıllık üst süre ise fiilin işlendiği tarihten başlar; hangisi önce dolarsa istem o tarihte zamanaşımına uğrar. Püf noktaları: Burada öğrenme 2019'da olduğundan iki yıl 2021'de dolar; fiilden başlayan on yıllık süre ise ancak 2025'te dolacaktı. Süreleri farklı başlangıç tarihleriyle karıştırmayın; iki süreden önce dolanı seçin."
    celdiriciler:
      A: "Fiilden başlayan iki yıllık süre kanunda yoktur; iki yıl, zararı ve yükümlüyü öğrenmeden başlar."
      C: "Fiilden başlayan on yıl, her hâlde işleyen üst süredir; ancak öğrenmeden başlayan iki yıllık süre bundan önce dolar."
      D: "On yıl öğrenmeden değil, fiilden başlar; öğrenmeden başlayan süre ise iki yıldır."
      E: "Md. 72/1 süreleri iki farklı başlangıçla sınırlar; dolayısıyla istem zamanaşımına uğrar."
