- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Borçlar hukuku
  konu: BRC
  kazanim: "sebepsiz zenginleşme: geri vermenin kapsamı"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "İyiniyetle bir ödeme almış olan Z, aldığı parayı kısmen harcamıştır ve zenginleşmenin geri istenmesi sırasında elinden çıkmış kısmı ispat edebilmektedir. 6098 sayılı Türk Borçlar Kanunu'na göre Z neyi geri vermekle yükümlüdür?"
  secenekler:
    A: "Hiçbir şeyi"
    B: "Aldığı tutarın yarısını"
    C: "Aldığı tutarın tamamını"
    D: "Yalnızca elinden çıktığını ispat ettiği kısmı geri verir"
    E: "Elinden çıktığını ispat ettiği kısmın dışında kalanı"
  dogru: E
  aciklama:
    dogru_neden: "Md. 79/1 uyarınca sebepsiz zenginleşen, zenginleşmenin geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanı geri vermekle yükümlüdür."
    celdiriciler:
      A: "Md. 79/1 geri vermeyi tümüyle kaldırmaz; elinden çıkan kısım dışında kalan geri verilir."
      B: "Md. 79/1 yarı oranında geri verme öngörmez."
      C: "Md. 79/1 iyiniyetli zenginleşenin, ispat ettiği çıkan kısım dışındaki kalanı geri vermesini öngörür; tamamını değil."
      D: "Elinden çıkan kısım geri verilmez; geri verilecek olan geri kalan kısımdır."
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 79/1
    alinti: "Sebepsiz zenginleşen, zenginleşmenin geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanı geri vermekle yükümlüdür."
