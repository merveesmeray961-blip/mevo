  kok: "Bir sözleşmenin içerdiği hükümlerden biri emredici hükme aykırıdır. Sözleşme, bu hüküm olmaksızın hiçbir şekilde yapılmayacak nitelikte olup bu durum açıkça anlaşılmaktadır. 6098 sayılı Türk Borçlar Kanunu'na göre sözleşmenin durumu hakkında aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Sözleşme yalnızca bir yıl süreyle hükümsüz sayılır."
    B: "Yalnızca aykırı hüküm hükümsüz olur; diğer hükümler geçerlidir."
    C: "Sözleşme iptal edilebilir hâle gelir."
    D: "Sözleşmenin tamamı kesin olarak hükümsüz olur."
    E: "Sözleşme tamamen geçerlidir."
  dogru: D
  aciklama:
    dogru_neden: "Md. 27/2 uyarınca sözleşmenin içerdiği hükümlerden bir kısmının hükümsüz olması, diğerlerinin geçerliliğini etkilemez; ancak bu hükümler olmaksızın sözleşmenin yapılmayacağı açıkça anlaşılırsa sözleşmenin tamamı kesin olarak hükümsüz olur. Püf noktaları: Kural kısmi hükümsüzlüktür; ancak aykırı hüküm olmadan sözleşmenin yapılmayacağı açıksa kural işlemez ve sözleşmenin tamamı hükümsüz olur."
    celdiriciler:
      A: "Md. 27/2'de süreyle sınırlı hükümsüzlük öngörülmemiştir."
      B: "Md. 27/2'nin ikinci cümlesi, bu hükümler olmaksızın sözleşmenin yapılmayacağı açıkça anlaşılıyorsa tüm sözleşmenin hükümsüz olmasını öngörür; kısmi hükümsüzlük kuralı bu hâlde uygulanmaz."
      C: "Md. 27/2 iptal edilebilirlik değil, kesin hükümsüzlük öngörür."
      E: "Hükümsüz hükmün aykırılığı geçerli olmayı sonuçlamaz; sözleşme geçerli kalmaz."
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 27/2
    alinti: "Sözleşmenin içerdiği hükümlerden bir kısmının hükümsüz olması, diğerlerinin geçerliliğini etkilemez. Ancak, bu hükümler olmaksızın sözleşmenin yapılmayacağı açıkça anlaşılırsa, sözleşmenin tamamı kesin olarak hükümsüz olur."
