  kok: "6102 sayılı Türk Ticaret Kanunu'na göre aşağıdakilerden hangisi, kamu hukuku hükümlerine göre yönetilen ve işletilen bir tüzel kişi eliyle bir ticari işletme işletmesi durumunda dahi **tacir sayılmaz**?"
  secenekler:
    A: "Sermayesi paylara bölünmüş komandit şirket"
    B: "Anonim şirket"
    C: "Limited şirket"
    D: "Kooperatif şirket"
    E: "Büyükşehir belediyesi"
  dogru: E
  aciklama:
    dogru_neden: "6102 sayılı Kanun md. 16/2 uyarınca Devlet, il özel idaresi, belediye ve köy ile diğer kamu tüzel kişileri, bir ticari işletmeyi ister doğrudan ister kamu hukuku hükümlerine göre yönetilen ve işletilen bir tüzel kişi eliyle işletsinler, kendileri tacir sayılmazlar."
    celdiriciler:
      A: "Ticaret şirketleri md. 16/1 uyarınca tacir sayılır; sermayesi paylara bölünmüş komandit şirket de ticaret şirketidir."
      B: "Anonim şirket bir ticaret şirketidir ve md. 16/1 uyarınca tacir sayılır."
      C: "Limited şirket bir ticaret şirketidir ve md. 16/1 uyarınca tacir sayılır."
      D: "Kooperatif şirket md. 124/1 uyarınca ticaret şirketleri arasında sayılır; md. 16/1 uyarınca tacirdir."
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 16/2
    alinti: "(2) Devlet, il özel idaresi, belediye ve köy ile diğer kamu tüzel kişileri ile kamu yararına çalışan dernekler ve gelirinin yarısından fazlasını kamu görevi niteliğindeki işlere harcayan vakıflar, bir ticari işletmeyi, ister doğrudan doğruya ister kamu hukuku hükümlerine göre yönetilen ve işletilen bir tüzel kişi eliyle işletsinler, kendileri tacir sayılmazlar."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 124/1
    alinti: "(1) Ticaret şirketleri; kollektif, komandit, anonim, limited ve kooperatif şirketlerden ibarettir."
