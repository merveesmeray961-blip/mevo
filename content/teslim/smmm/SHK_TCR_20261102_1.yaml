    dogru_neden: "6102 sayılı Kanun md. 22/1 uyarınca tacir sıfatını haiz borçlu, Türk Borçlar Kanunu'nun 182 nci maddesinin üçüncü fıkrasında yazılı hâllerde, aşırı ücret veya ceza kararlaştırılmış olduğu iddiasıyla ücret veya sözleşme cezasının indirilmesini mahkemeden isteyemez."
    celdiriciler:
      A: "Md. 22/1 tacir borçlu için bu hâllerde indirim isteme hakkını kaldırmıştır."
      B: "Kanunda indirim için ceza tutarının yarısı gibi bir oran öngörülmemiştir; indirim istenemez."
      C: "Md. 22/1'de sekiz günlük bir süre yoktur; sekiz gün, fatura ve teyit mektubuna itiraz süresidir."
      E: "Md. 22/1 indirim isteme hakkını tamamen kaldırdığından ihtarname gerekliliği söz konusu değildir."
