  konu: TCR
  kazanim: tacir ve ticari işletme
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "Tacir T, tacir S'den satın aldığı mala ilişkin faturayı teslim aldıktan on gün sonra, fatura içeriğinin hatalı olduğunu ileri sürerek faturaya itiraz etmiştir. 6102 sayılı Türk Ticaret Kanunu'nun 21 inci maddesine göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "İçeriği kabul etmiş sayılır; sekiz günlük itiraz süresi geçmiştir."
    B: "İtiraz süresi bir aydır; bu nedenle itirazı süresinde yapılmıştır."
    C: "Faturalara itiraz için kanunda herhangi bir süre öngörülmemiştir."
    D: "Yalnızca noterce düzenlenen faturalarda itiraz süresi işlemeye başlar."
    E: "İtiraz süresi onbeş gündür; bu nedenle itirazı süresinde yapılmıştır."
  dogru: A
  aciklama:
    dogru_neden: "6102 sayılı Kanun md. 21/2 uyarınca fatura alan kişi, aldığı tarihten itibaren sekiz gün içinde faturanın içeriği hakkında itirazda bulunmamışsa bu içeriği kabul etmiş sayılır. T, faturaya on gün sonra itiraz ettiğinden süre geçmiştir."
    celdiriciler:
      B: "Kanundaki itiraz süresi bir ay değil, sekiz gündür."
      C: "Md. 21/2 faturanın içeriğine itiraz için sekiz günlük bir süre öngörmüştür."
      D: "Sekiz günlük süre, faturanın noterce düzenlenmiş olmasına bağlı değildir; faturanın alınmasıyla işler."
      E: "Kanundaki itiraz süresi onbeş gün değil, sekiz gündür."
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 21/2
    alinti: "(2) Bir fatura alan kişi aldığı tarihten itibaren sekiz gün içinde, faturanın içeriği hakkında bir itirazda bulunmamışsa bu içeriği kabul etmiş sayılır."
