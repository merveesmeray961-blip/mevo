- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Ticaret hukuku
  konu: TCR
  kazanim: şirketler
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Üç ortaklı bir limited şirkette ortaklardan ikisi, paylarının tamamını 4 Mayıs tarihinde üçüncü ortağa devretmiştir. Böylece şirketin ortak sayısı bire düşmüştür. 6102 sayılı Türk Ticaret Kanunu'na göre bu durumla ilgili aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Şirket, ortak sayısı bire düştüğü anda kendiliğinden sona erer ve tasfiyeye girer."
    B: "Durum, işlem tarihinden itibaren yedi gün içinde müdürlere yazıyla bildirilmek zorundadır."
    C: "Ortak sayısının bire düşmesi müdürlere bildirilmez; durum doğrudan sicile bildirilir."
    D: "Durum, işlem tarihinden itibaren otuz gün içinde müdürlere ve ortaklara yazıyla bildirilir."
    E: "Müdürler, tek ortaklılığı tescil ve ilan ettirmekle yükümlü değildir; yükümlülük ortağa aittir."
  dogru: B
  aciklama:
    dogru_neden: "6102 sayılı Kanun md. 574/2 uyarınca ortak sayısı bire düşerse durum, bu sonucu doğuran işlem tarihinden itibaren yedi gün içinde müdürlere yazıyla bildirilir. Müdürler de, bildirimin alınmasından başlayarak yedinci günün sonuna kadar şirketin tek ortaklı olduğunu tescil ve ilan ettirir; aksi hâlde doğacak zarardan sorumlu olurlar. Püf noktaları: Ortak sayısının bire düşmesi şirketi sona erdirmez; kanun yalnızca bildirim ve tescil-ilan yükümlülüğü getirir. Süre, işlem tarihinden başlar ve yedi gündür."
    celdiriciler:
      A: "Md. 574/2 ortak sayısının bire düşmesine sona erme sonucu bağlamaz; yalnızca bildirim ve tescil-ilan yükümlülüğü öngörür."
      C: "Bildirim müdürlere yazıyla yapılır; müdürler de tescil ve ilan ettirmekle yükümlüdür."
      D: "Bildirim süresi otuz gün değil, yedi gündür; ayrıca bildirim müdürlere yapılır."
      E: "Md. 574/2 tescil ve ilan yükümlülüğünü müdürlere yüklemiştir; aksi hâlde müdürler zarardan sorumlu olur."
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 574/1-2
    alinti: "(1) Ortakların sayısı elliyi aşamaz. (2) Ortak sayısı bire düşerse durum, bu sonucu doğuran işlem tarihinden itibaren yedi gün içinde müdürlere yazıyla bildirilir. Müdürler, bildirimin alınması tarihinden başlayarak yedinci günün sonuna kadar, şirketin tek ortaklı olduğunu, bu ortağın adını, yerleşim yerini ve vatandaşlığını tescil ve ilan ettirirler, aksi hâlde doğacak zarardan sorumlu olurlar."
