  kok: "Tacir sıfatını haiz borçlu T, sözleşmede aşırı sözleşme cezası kararlaştırıldığını ileri sürerek Türk Borçlar Kanunu'nun 182 nci maddesinin üçüncü fıkrasında yazılı hâlde cezanın indirilmesini mahkemeden istemiştir. 6102 sayılı Türk Ticaret Kanunu'nun 22 nci maddesine göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "T, bütün durumlarda indirim isteyebilir."
    B: "T, ceza tutarının yarısına kadar indirim isteyebilir."
