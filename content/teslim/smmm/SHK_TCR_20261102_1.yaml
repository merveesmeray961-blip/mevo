- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Ticaret hukuku
  konu: TCR
  kazanim: tacir ve tacir sıfatı
  tip: uygulama
  zorluk: 1
  soru_bicimi: standart
  kok: "6102 sayılı Türk Ticaret Kanunu'na göre, bir ticari işletmeyi kurup açtığını ticaret siciline tescil ettirerek ilan eden, ancak henüz fiilen işletmeye başlamamış olan kişi hakkında aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Fiilen işletmeye başlayana kadar tacir sayılmaz."
    B: "Fiilen işletmeye başlamamış olsa bile tacir sayılır."
    C: "Yalnızca vergi mevzuatı bakımından tacir sayılır."
    D: "Tescilden itibaren bir yıl geçmedikçe tacir sayılmaz."
    E: "Tacir sayılması için mahkeme kararı gerekir."
  dogru: B
  aciklama:
    dogru_neden: "6102 sayılı Kanun md. 12/2 uyarınca ticari işletmesini ticaret siciline tescil ettirerek durumu ilan etmiş olan kimse, fiilen işletmeye başlamamış olsa bile tacir sayılır."
    celdiriciler:
      A: "Tacir sıfatı için fiilen işletmeye başlamak şart değildir; md. 12/2 tescil ve ilanı yeterli görür."
      C: "Kanunda tacir sıfatı vergi mevzuatıyla sınırlı değildir; md. 12/2 genel bir kural koyar."
      D: "Kanunda tescilden sonra bir yıl beklenmesini öngören bir hüküm yoktur."
      E: "Tacir sıfatının kazanılması için mahkeme kararı aranmaz; tescil ve ilan yeterlidir."
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 12/2
    alinti: "(2) Bir ticari işletmeyi kurup açtığını, sirküler, gazete, radyo, televizyon ve diğer ilan araçlarıyla halka bildirmiş veya işletmesini ticaret siciline tescil ettirerek durumu ilan etmiş olan kimse, fiilen işletmeye başlamamış olsa bile tacir sayılır."
  gecerlilik: {baslangic: '2012-07-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
