- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Ticaret hukuku
  konu: TCR
  kazanim: şirketler
  tip: kavrama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir anonim şirketin pay sahibi P ile bir limited şirketin ortağı R, taahhüt ettikleri sermaye paylarını tamamen ödemişlerdir. Şirketlerin borçlarını ödeyememesi üzerine alacaklılar, P ve R'nin şahsi malvarlıklarına başvurmak istemektedir. 6102 sayılı Türk Ticaret Kanunu'na göre ortakların sorumluluğu hakkında aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Her iki şirkette de ortaklar, şirket borçlarından şahsi malvarlıklarıyla ve sınırsız olarak sorumludur."
    B: "Anonim şirket ortakları sınırsız sorumludur; limited şirket ortaklarının hiçbir yükümlülüğü bulunmamaktadır."
    C: "Ortaklar yalnızca sermaye payını ödemekle yükümlüdür; limited şirkette ek ödeme ve yan edim yükümlülükleri de saklıdır."
    D: "Limited şirket ortakları sınırsız sorumludur; anonim şirket ortakları ise hiçbir borçtan sorumlu değildir."
    E: "Ortaklar, taahhüt ettikleri sermaye payları tamamen ödenmiş olsa dahi şirket borçlarından müteselsilen ve sınırsız sorumludur."
  dogru: C
  aciklama:
    dogru_neden: "6102 sayılı Kanun md. 329/2 uyarınca anonim şirket pay sahipleri sadece taahhüt etmiş oldukları sermaye payları ile ve şirkete karşı sorumludur. Md. 573/2 uyarınca limited şirket ortakları şirket borçlarından sorumlu olmayıp sadece taahhüt ettikleri esas sermaye paylarını ödemekle ve şirket sözleşmesinde öngörülen ek ödeme ve yan edim yükümlülüklerini yerine getirmekle yükümlüdür. Püf noktaları: Sermaye paylarını ödemiş bir ortağa şahsi malvarlığı üzerinden gidilemez; limited şirkette ek ödeme ve yan edim ancak şirket sözleşmesinde öngörülmüşse söz konusudur."
    celdiriciler:
      A: "Her iki şirkette de ortakların sorumluluğu sermaye payıyla sınırlıdır; sınırsız sorumluluk öngörülmemiştir."
      B: "Anonim şirket ortaklarının sorumluluğu da sermaye payıyla sınırlıdır; limited şirket ortaklarının ise ek ödeme ve yan edim yükümlülükleri olabilir."
      D: "Anonim şirket ortakları sermaye payı ile sorumludur; limited şirket ortakları da şirket borçlarından sorumlu değildir."
      E: "Sermaye payı ödenmiş ortaklar şirket borçlarından müteselsilen ve sınırsız sorumlu tutulamaz; sorumluluk sermaye payıyla sınırlıdır."
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 329/1-2
    alinti: "(1) Anonim şirket, sermayesi belirli ve paylara bölünmüş olan, borçlarından dolayı yalnız malvarlığıyla sorumlu bulunan şirkettir. (2) Pay sahipleri, sadece taahhüt etmiş oldukları sermaye payları ile ve şirkete karşı sorumludur."
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 573/2
    alinti: "(2) Ortaklar, şirket borçlarından sorumlu olmayıp, sadece taahhüt ettikleri esas sermaye paylarını ödemekle ve şirket sözleşmesinde öngörülen ek ödeme ve yan edim yükümlülüklerini yerine getirmekle yükümlüdürler."
  gecerlilik: {baslangic: '2012-07-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
