    dogru_neden: "6098 sayılı Kanun md. 547 uyarınca ticari temsilci, işletme sahibinin ticari işletmeyi yönetmek ve işletmeye ilişkin işlemlerde ticaret unvanı altında kendisini temsil etmek üzere açıkça ya da örtülü olarak yetki verdiği kişidir."
    celdiriciler:
      A: "Md. 547 yetkinin verilmesi için noter belgesi aramaz; yetki örtülü olarak da verilebilir."
      B: "Tescil yetkinin doğması için şart değildir; md. 547 tescili işletme sahibine yükümlülük olarak yükler, sorumluluğu tescile bağlamaz."
      D: "Ticaret odası onayı md. 547'de aranan bir şart değildir."
      E: "Md. 547 yetkinin açıkça ya da örtülü olarak verilebileceğini söyler; yazılı ve imzalı talimat zorunlu değildir."
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 547
    alinti: "Ticari temsilci, işletme sahibinin, ticari işletmeyi yönetmek ve işletmeye ilişkin işlemlerde ticaret unvanı altında, ticari temsil yetkisi ile kendisini temsil etmek üzere, açıkça ya da örtülü olarak yetki verdiği kişidir."
