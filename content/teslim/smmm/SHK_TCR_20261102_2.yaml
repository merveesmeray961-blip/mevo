      D: "Md. 11/3 unsurların ayrı ayrı devri için zorunlu tasarruf işlemlerinin yapılmasına gerek olmadığını belirtir."
      E: "Md. 11/3 sözleşmenin ticaret siciline tescil ve ilanını öngörür; tescil edilmeme sonucu kanunda yoktur."
