  zorluk: 1
  soru_bicimi: standart
  kok: "6098 sayılı Türk Borçlar Kanunu'na göre ticari temsilcilik yetkisinin işletme sahibi tarafından verilmesi bakımından aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Yetki yalnızca noterce düzenlenen yazılı bir belgeyle verilebilir."
    B: "Yetki, ancak ticaret siciline tescille birlikte doğar."
    C: "Yetki, işletme sahibi tarafından açıkça ya da örtülü olarak verilebilir."
    D: "Yetki, ancak bağlı bulunulan ticaret odasının onayıyla verilebilir."
    E: "Yetki yalnızca işletme sahibinin yazılı ve imzalı talimatıyla verilebilir."
  dogru: C
