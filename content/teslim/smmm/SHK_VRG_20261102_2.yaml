- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK kanuni temsilci"
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: "Reşit olmayan bir çocuğun 213 sayılı Vergi Usul Kanunu kapsamında mükellef olması hâlinde, mükellefe düşen vergisel ödevleri 10 uncu madde uyarınca kim yerine getirir?"
  secenekler:
    A: "Mükellefin bağlı olduğu vergi dairesinin müdürü"
    B: "Çocuğun kendisi"
    C: "Çocuğun öğrenim gördüğü okulun yönetimi"
    D: "Çocuğun bulunduğu yerin muhtarı"
    E: "Çocuğun kanuni temsilcisi"
  dogru: E
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 10 uyarınca küçüklerin ve kısıtlıların mükellef veya vergi sorumlusu olmaları hâlinde bunlara düşen ödevler kanuni temsilcileri tarafından yerine getirilir."
    celdiriciler:
      A: "Vergi dairesi müdürü mükellefin ödevlerini yerine getiren değil, vergilendirmeyi yürüten idare görevlisidir."
      B: "Küçüğün ödevlerini kendisi yerine getirmez; md. 10 bu ödevleri kanuni temsilciye yükler."
      C: "Okul yönetiminin mükellefin vergisel ödevlerini yerine getirmesine ilişkin bir hüküm yoktur."
      D: "Muhtarın küçük mükellefin ödevlerini yerine getirmesi md. 10'da öngörülmemiştir."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 10/1"
    alinti: "Tüzel kişilerle küçüklerin ve kısıtlıların, Vakıflar ve cemaatlar gibi tüzel kişiliği olmıyan teşekküllerin mükellef veya vergi sorumlusu olmaları halinde bunlara düşen ödevler kanuni temsilcileri, tüzel kişiliği olmayan teşekkülleri idare edenler ve varsa bunların temsilcileri tarafından yerine getirilir."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK vergi kesenlerin sorumluluğu"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "Ödemelerinden vergi kesmek zorunda olan işveren İ, kesintiyi eksik yapmış ve eksik kesilen vergi nedeniyle vergi dairesine ödeme yapmak zorunda kalmıştır. 213 sayılı Vergi Usul Kanunu'nun 11 inci maddesine göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "İ verginin tam olarak kesilip ödenmesinden sorumludur ve ödediği vergi için asıl mükellefe rücu etme hakkını korur."
    B: "İ yalnızca kestiği kadar vergiden sorumludur; eksik kısım asıl mükellefe ait olduğundan İ rücu hakkına gerek duymaz."
    C: "Sorumluluk yalnızca asıl mükellefe aittir; İ'nin sorumluluğu söz konusu değildir."
    D: "İ sorumlu olmakla birlikte ödediği vergi için asıl mükellefe rücu edemez."
    E: "İ, ancak vergi dairesinin yazılı bildirimi hâlinde sorumlu olur ve rücu hakkı yoktur."
  dogru: A
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 11 uyarınca ödemelerinden vergi kesmeye mecbur olanlar verginin tam olarak kesilip ödenmesinden ve bununla ilgili diğer ödevleri yerine getirmekten sorumludur. Bu sorumluluk, ödedikleri vergilerden dolayı asıl mükelleflere rücu etme hakkını kaldırmaz."
    celdiriciler:
      B: "Md. 11 kesenin yalnızca fiilen kestiği kadar değil, tam olarak kesilmesi gereken verginin tamamından sorumlu olmasını öngörür."
      C: "Md. 11'e göre vergi kesmeye mecbur olanlar sorumludur; sorumluluk yalnızca asıl mükellefe ait değildir."
      D: "Md. 11 rücu hakkını açıkça saklı tutar; sorumlunun rücu edememesi söz konusu değildir."
      E: "Md. 11'deki sorumluluk vergi dairesinin ayrıca yazılı bildirimine bağlı değildir ve rücu hakkı kaldırılmamıştır."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 11/1"
    alinti: "Yaptıkları veya yapacakları ödemelerden vergi kesmeye mecbur olanlar, verginin tam olarak kesilip ödenmesinden ve bununla ilgili diğer ödevleri yerine getirmekten sorumludurlar. Bu sorumluluk, bunların ödedikleri vergilerden dolayı asıl mükelleflere rücu etmek hakkını kaldırmaz."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK mücbir sebep ve süreler"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Mükellef G, ağır bir hastalık nedeniyle vergi ödevlerini yerine getirememiş ve bu mücbir sebep ilgili tarafından ispat edilmiştir. 213 sayılı Vergi Usul Kanunu'nun 15 inci maddesine göre mücbir sebebin süreler ve tarh zamanaşımı üzerindeki etkisi aşağıdakilerden hangisidir?"
  secenekler:
    A: "Süreler işlemez; tarh zamanaşımı kanunen bir yıl uzar."
    B: "Süreler işlemeye devam eder; yalnızca vergi cezası kesilmez."
    C: "Süreler yalnızca beyanname verme ödevi için işlemez; ödeme süreleri işler."
    D: "Süreler işlemez; tarh zamanaşımı işlemeyen süreler kadar uzar."
    E: "Süreler sebep ortadan kalkıncaya kadar işlemez; ancak tarh zamanaşımı süresi değişmez."
  dogru: D
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 15 uyarınca 13 üncü maddedeki mücbir sebeplerden birinin bulunması hâlinde bu sebep ortadan kalkıncaya kadar süreler işlemez ve tarh zamanaşımı işlemeyen süreler kadar uzar. Püf noktaları: Mücbir sebepte süreler yalnızca durur, sona ermez; zamanaşımı da sabit bir süre kadar değil, fiilen işlemeyen süre kadar uzar. Yangın, ağır hastalık gibi sebebin bilinmesi veya ispatı şarttır."
    celdiriciler:
      A: "Md. 15'te zamanaşımının uzaması sabit bir yıl ile değil, işlemeyen süreler kadardır."
      B: "Md. 15'e göre mücbir sebep varken süreler işlemez; sürelerin işlemeye devam etmesi söz konusu değildir."
      C: "Md. 15 mücbir sebep hâlinde yalnız beyanname değil, vergi ödevlerine ilişkin süreleri kapsar; ödeme sürelerini ayrı tutmaz."
      E: "Md. 15 tarh zamanaşımının işlemeyen süreler kadar uzamasını öngörür; zamanaşımı süresi değişmez denemez."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 15/1"
    alinti: "13 üncü maddede yazılı mücbir sebeplerden her hangi birinin bulunması halinde bu sebep ortadan kalkıncaya kadar süreler işlemez. Bu takdirde tarh zamanaşımı işlemiyen süreler kadar uzar."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK mühlet verilmesi"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Zor durumda bulunduğu için kanunda 15 gün olarak belirlenen bir vergi ödevini süresi içinde yerine getiremeyecek olan mükellefe, 213 sayılı Vergi Usul Kanunu'nun 17 nci maddesi uyarınca Maliye Bakanlığınca en çok ne kadar mühlet verilebilir?"
  secenekler:
    A: "On beş gün"
    B: "Bir ay"
    C: "İki ay"
    D: "Üç ay"
    E: "Altı ay"
  dogru: B
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 17 uyarınca zor durumdaki mükellefe kanuni sürenin bir katı, kanuni sürenin bir aydan az olması hâlinde ise bir ayı geçmemek üzere mühlet verilebilir. Kanuni süre 15 gün, yani bir aydan az olduğundan en çok bir ay mühlet verilebilir. Püf noktaları: Süre bir aydan kısaysa mühlet kanuni sürenin bir katı (15 gün) ile sınırlı değildir; bir aya kadar çıkabilir."
    celdiriciler:
      A: "On beş gün, kanuni sürenin bir katıdır; ancak kanuni süre bir aydan az olduğu için md. 17 bir aya kadar mühlet verilmesine imkân tanır."
      C: "İki ay, md. 17'deki üst sınırı aşar; süre bir aydan azsa mühlet bir ayı geçemez."
      D: "Üç ay, md. 17'deki üst sınırı aşar; süre bir aydan azsa mühlet bir ayı geçemez."
      E: "Altı ay, md. 17'deki üst sınırı aşar; süre bir aydan azsa mühlet bir ayı geçemez."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 17/1"
    alinti: "Zor durumda bulunmaları hasebiyle vergi muamelelerine müteallik ödevleri süresi içinde yerine getiremeyecek olanlara, kanunî sürenin bir katını, kanunî sürenin bir aydan az olması halinde bir ayı geçmemek üzere, Maliye Bakanlığınca münasip bir mühlet verilebilir."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK ödemeden önce indirim"
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "İkmalen tarh edilen vergi ve kesilen vergi ziyaı cezası için ihbarname tebliğ edilen mükellef, 213 sayılı Vergi Usul Kanunu'nun 376 ncı maddesindeki indirimden yararlanmak üzere ödeme isteğini ilgili vergi dairesine en geç ihbarnamenin tebliğ tarihinden itibaren kaç gün içinde bildirmelidir?"
  secenekler:
    A: "Üç gün"
    B: "On beş gün"
    C: "Otuz gün"
    D: "Kırk beş gün"
    E: "Altmış gün"
  dogru: C
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 376 uyarınca mükellef, ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi dairesine başvurarak ödeyeceğini bildirirse kesilen cezanın yarısı indirilir. Bildirdiği vergi ve cezayı süresinde ödemez veya dava konusu yaparsa bu hükümden yararlanamaz."
    celdiriciler:
      A: "Üç gün, md. 376'daki başvuru süresi değildir; süre otuz gündür."
      B: "On beş gün, 6183 sayılı Kanun'daki ödeme emrine itiraz süresine benzer; md. 376'daki başvuru süresi otuz gündür."
      D: "Kırk beş gün, md. 376'da öngörülen süre değildir; başvuru süresi otuz gündür."
      E: "Altmış gün, md. 376'da öngörülen süre değildir; başvuru süresi otuz gündür."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 376"
    alinti: "İkmalen, resen veya idarece tarh edilen vergiyi veya vergi farkını ve vergi ziyaı, usulsüzlük ve özel usulsüzlük cezalarının yarısını ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi dairesine başvurarak vadesinde veya 6183 sayılı Kanunda belirtilen türden teminat göstererek vadenin bitmesinden itibaren üç ay içinde ödeyeceğini bildirirse kesilen cezanın yarısı,"
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK posta ile tebliğ"
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "Posta memuru, muhatap olan mükellefe vergi dairesince gönderilen tebliğ evrakını vermek istemiş; mükellef tebellüğden imtina etmiştir. 213 sayılı Vergi Usul Kanunu'nun 102 nci maddesine göre bu durumda aşağıdakilerden hangisi yapılır?"
  secenekler:
    A: "Tebliğ evrakı doğrudan ilan yoluyla tebliğ edilir."
    B: "Tebliğ evrakı mükellefin komşusuna imza karşılığı bırakılır."
    C: "Tebliğ evrakı vergi dairesine iade edilir ve tebliğ yapılamaz."
    D: "Tebliğ evrakı muhtara teslim edilir ve muhtarın imzası tebliğ yerine geçer."
    E: "Evrakın alınabileceği idare şerhini içeren pusula kapıya yapıştırılır."
  dogru: E
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 102 uyarınca muhatap tebellüğden imtina ederse, tebliğ evrakının gönderildiği idareden alınabileceği şerhini içeren bir pusula kapıya yapıştırılır. Posta memuru durumu tebliğ alındısı üzerine şerh ve imza ederek evrakı tebliği yaptıran idareye teslim eder."
    celdiriciler:
      A: "İlan yoluyla tebliğ md. 103'te sayılan farklı hâllere (bilinen adres olmaması gibi) bağlıdır; imtina hâli için öngörülmemiştir."
      B: "Md. 102 evrakın komşuya bırakılmasını öngörmez; imtina hâlinde pusula kapıya yapıştırılır."
      C: "Md. 102 imtina hâlinde tebliğin yapılamayacağını değil, pusulanın kapıya yapıştırılacağını belirtir."
      D: "Muhtara teslim md. 102'de öngörülmemiştir; imtina hâlinde yapılacak işlem pusula yapıştırmaktır."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 102"
    alinti: "Muhatap tebellüğden imtina ederse, tebliğ evrakının gönderildiği idareden alınabileceği şerhini içeren bir pusula kapıya yapıştırılır."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK ilanen tebliğ"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bilinen adresi bulunmadığı için hakkındaki tebliğ ilan yoluyla yapılan mükellef Z, ilan tarihinden başlayarak bir ay içinde ne vergi dairesine başvurmuş ne de adresini bildirmiştir. 213 sayılı Vergi Usul Kanunu'nun 106 ncı maddesine göre Z'ye tebliğ ne zaman yapılmış sayılır?"
  secenekler:
    A: "İlan tarihinden yedi gün sonra"
    B: "İlan tarihinde"
    C: "Z'nin adresinin tespit edildiği tarihte"
    D: "İlan tarihinden başlayarak bir ayın sonunda"
    E: "İlan yazısının askıya çıkarıldığı tarihi izleyen onbeşinci günde"
  dogru: D
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 106 uyarınca ilan tarihinden başlayarak bir ay içinde ne vergi dairesine müracaat yapmış ne de adresini bildirmiş olanlara bir ayın sonunda tebliğ yapılmış sayılır."
    celdiriciler:
      A: "Yedi gün md. 106'da öngörülmemiştir; kanundaki süre bir aydır."
      B: "İlan tarihinde tebliğ yapılmış sayılmaz; md. 106 muhataba bir aylık süre tanır."
      C: "Adresin tespit edilmesi md. 106'daki tebliğ tarihini belirlemez; tebliğ bir ayın sonunda yapılmış sayılır."
      E: "Askıya çıkarıldığı tarihi izleyen onbeşinci gün, md. 104'te küçük tutarlı tebliğlerde ilan tarihi sayılan günü anlatır; md. 106'daki tebliğ tarihi değildir."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 106"
    alinti: "İlan tarihinden başlıyarak bir ay içinde ne vergi dairesine müracaat yapmış ve ne de adresini bildirmiş olanlara bir ayın sonunda tebliğ yapılmış sayılır."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK tebliğde şekil hataları"
  tip: kavrama
  zorluk: 3
  soru_bicimi: standart
  kok: "Vergi ihbarı ile ilgili bir vesika mükellefe tebliğ edilmiştir. 213 sayılı Vergi Usul Kanunu'nun 108 inci maddesine göre aşağıdakilerden hangisinin vesikada hiç yazılmamış olması vesikayı hükümsüz kılar?"
  secenekler:
    A: "Vergi mahkemesinde dava açma süresi"
    B: "İhbarnamenin sıra numarası"
    C: "İhbarnamenin tanzim tarihi"
    D: "Mükellefin vergi dairesi hesap numarası"
    E: "Mükellefin açık adresindeki ilçe bilgisi"
  dogru: A
  aciklama:
    dogru_neden: "213 sayılı Kanun md. 108 uyarınca tebliğ olunan vesikalar esasa müessir olmayan şekil hatalarından dolayı hukuki kıymetlerini kaybetmez; yalnız vergi ihbarı ile ilgili vesikalarda mükellefin adının, verginin nevi veya miktarının, vergi mahkemesinde dava açma süresinin hiç yazılmamış olması veya vesikaların görevli makamca düzenlenmemiş bulunması vesikayı hükümsüz kılar. Püf noktaları: Hükümsüzlük nedenleri sınırlı sayıdadır; hesap numarası, sıra numarası, tarih veya adres eksikliği gibi şekil hataları vesikayı kendiliğinden hükümsüz kılmaz."
    celdiriciler:
      B: "Sıra numarasının yazılmaması md. 108'de sayılan hükümsüzlük nedenleri arasında değildir."
      C: "Tanzim tarihine ilişkin eksiklik md. 108'de sayılan hükümsüzlük nedenleri arasında değildir."
      D: "Hesap numarasının yazılmaması md. 108'de hükümsüzlük nedeni olarak sayılmamıştır."
      E: "Adres bilgisindeki eksiklik md. 108'e göre esasa müessir olmayan şekil hatasıdır; yalnız mükellefin adı, verginin nevi veya miktarı ve dava açma süresi bakımından hükümsüzlük öngörülmüştür."
  kaynaklar:
  - mevzuat: "213 sayılı Vergi Usul Kanunu"
    madde: "md. 108"
    alinti: "Tebliğ olunan vesikalar, esasa müessir olmayan şekil hatalarından dolayı hukuki kıymetlerini kaybetmezler; yalnız vergi ihbarı ile ilgili vesikalarda mükellefin adının, verginin nevi veya miktarının, vergi mahkemesinde dava açma süresinin hiç yazılmamış olması veyahut bu vesikaların görevli bir makam tarafından tanzim edilmemiş bulunması vesikayı hükümsüz kılar."
  gecerlilik: {baslangic: '1961-01-10', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "VUK verginin vadesi"
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: "213 sayılı Vergi Usul Kanunu'nun 111 inci maddesine göre verginin vadesi aşağıdakilerden hangisidir?"
  secenekler:
    A: "Verginin tahakkuk fişinin düzenlendiği gün"
