- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: SHK
  unite: Vergi hukuku
  konu: VRG
  kazanim: "GVK tam mükellefiyet"
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "Merkezi Türkiye'de bulunan bir kamu kurumunun işleri dolayısıyla yabancı memlekette oturan Türk vatandaşı P, 193 sayılı Gelir Vergisi Kanunu'nun 3 üncü maddesine göre hangi kazanç ve iratları üzerinden vergilendirilir?"
  secenekler:
    A: "Türkiye içinde ve dışındaki kazançların tamamı"
    B: "Yalnızca yabancı memlekette elde ettiği kazanç ve iratlar"
    C: "Yalnızca Türkiye'de elde ettiği kazanç ve iratlar"
    D: "Hiçbir kazanç ve iradı vergilendirilmez"
    E: "Yalnızca ücret geliri"
  dogru: A
  aciklama:
    dogru_neden: "193 sayılı Kanun md. 3/2 uyarınca resmî daire ve müesseselere veya merkezi Türkiye'de bulunan teşekkül ve teşebbüslere bağlı olup bunların işleri dolayısıyla yabancı memleketlerde oturan Türk vatandaşları Türkiye içinde ve dışında elde ettikleri kazanç ve iratların tamamı üzerinden vergilendirilir."
    celdiriciler:
      B: "Yalnızca yurt dışı kazançlarla sınırlama md. 3'te yoktur; kazançların tamamı vergilendirilir."
      C: "Yalnızca Türkiye'deki kazançların vergilendirilmesi dar mükellefiyetin kuralıdır; P md. 3/2 gereği tam mükelleftir."
      D: "Md. 3/2 bu kişileri vergilendirme dışı bırakmaz; bulundukları memlekette aynı vergiye tabi tutulmuşlarsa ayrıca vergilendirilmemeleri ayrı bir kuraldır."
      E: "Md. 3 ücret geliriyle sınırlı bir vergilendirme öngörmez."
  kaynaklar:
  - mevzuat: "193 sayılı Gelir Vergisi Kanunu"
    madde: "md. 3"
    alinti: "Aşağıda yazılı gerçek kişiler Türkiye içinde ve dışında elde ettikleri kazanç ve iratların tamamı üzerinden vergilendirilirler:"
  - mevzuat: "193 sayılı Gelir Vergisi Kanunu"
    madde: "md. 3/2"
    alinti: "Resmi daire ve müesseselere veya merkezi Türkiye'de bulunan teşekkül ve teşebbüslere bağlı olup adı geçen daire, müessese,teşekkül ve teşebbüslerin işleri dolayısiyle yabancı memleketlerde oturan Türk vatandaşları"
  gecerlilik: {baslangic: '1961-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
