    A: "Yalnızca fahri konsolos olmaları şartıyla"
    B: "Resmî görevde olmaları ve karşılıklılık"
    C: "Türk vatandaşı olmaları şartıyla"
    D: "Türkiye'de bir yıldan az kalmaları şartıyla"
    E: "Noter onaylı belge ibraz etmeleri şartıyla"
  dogru: B
  aciklama:
    dogru_neden: "193 sayılı Kanun md. 15 uyarınca yabancı devletlerin elçi, maslahatgüzar ve konsolosları (fahri konsoloslar hariç) ile elçilik ve konsolosluklara mensup memurları, Türkiye'de resmî bir göreve memur edilenler bu sıfatlarından dolayı ve karşılıklı olmak şartıyla gelir vergisinden muaftır."
    celdiriciler:
      A: "Fahri konsoloslar md. 15'te muaflık kapsamının dışında bırakılmıştır."
      C: "Muaflık yabancı uyruklular içindir; Türk vatandaşı olma şartı md. 15'te yoktur."
      D: "Md. 15'te kalış süresine bağlı bir muaflık şartı yoktur."
      E: "Md. 15 noter onaylı belge ibrazını şart koşmaz."
  kaynaklar:
  - mevzuat: "193 sayılı Gelir Vergisi Kanunu"
    madde: "md. 15"
    alinti: "Yabancı Devletlerin Türkiye'de bulunan elçi,maslahatgüzar ve konsolosları (Fahri konsoloslar hariç) ile elçilik ve konsolosluklara mensubolan ve o memleketin uyrukluğunda bulunan memurları, Türkiye'de resmi bir göreve memur edilenler bu sıfatlarından dolayı ve karşılıklı olmak şartiyle Gelir Vergisinden muaftırlar."
  gecerlilik: {baslangic: '1961-01-01', bitis: null, yila_bagli_tutar: false}
