  soru_bicimi: standart
  kok: "193 sayılı Gelir Vergisi Kanunu'nun 15 inci maddesine göre yabancı devletlerin Türkiye'de bulunan elçi, maslahatgüzar ve konsolosları aşağıdaki şartlardan hangisiyle gelir vergisinden muaftır?"
