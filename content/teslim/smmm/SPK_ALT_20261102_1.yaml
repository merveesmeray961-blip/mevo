  aciklama:
    dogru_neden: "6362 sayılı Kanun md. 65/10 uyarınca borsalar özel hukuk hükümlerine tabidir; bütçelerini ve personel kadrolarını esas sözleşmelerinde belirtilen organlar aracılığıyla kendileri belirler ve idari ve mali konularda kamu idaresini veya kamu sermayeli kuruluşları ilgilendiren mevzuat hükümlerine, kısıtlamalarına ve uygulamalarına tabi tutulamaz."
    celdiriciler:
      B: "Bakanlık onayı şartı md. 65/10'da yoktur; kadrolar esas sözleşmedeki organlarca belirlenir."
      C: "Borsalar kamu idaresi ya da kamu sermayeli kuruluşlara ilişkin mevzuata tabi tutulamaz."
      D: "Personel kadrolarını Kurul değil borsa organları belirler."
      E: "Hem bütçe hem personel kadroları borsalarca belirlenir; kadroların kamu mevzuatına göre belirlenmesi söz konusu değildir."
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 65/10
    alinti: "Borsalar, bütçelerini ve personel kadrolarını esas sözleşmelerinde belirtilen organları aracılığıyla kendileri belirler."
