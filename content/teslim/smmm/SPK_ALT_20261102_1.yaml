  secenekler:
    A: "Borsalar bütçe ve kadrolarını kendileri belirler; kamu kısıtlamalarına tabi tutulamaz"
    B: "Borsalar kadrolarını belirlerken ilgili Bakanlığın onayını almak zorundadır"
    C: "Borsalar kamu sermayeli kuruluşlar gibi merkezî yönetim bütçe kanununa tabidir"
    D: "Borsaların personel kadroları Kurul tarafından belirlenir"
    E: "Borsalar yalnızca bütçelerini kendileri belirler; kadroları kamu mevzuatına göre belirlenir"
