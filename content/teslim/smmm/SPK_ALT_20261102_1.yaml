  kok: "6362 sayılı Sermaye Piyasası Kanunu'nun 73 üncü maddesinin ikinci fıkrasına göre borsalar ve takas kuruluşları nezdinde takas risklerinin önlenmesi amacıyla tutulan teminatlar ile garanti fonundaki varlıklara ilişkin aşağıdaki ifadelerden hangileri doğrudur?\n\nI. Kamu alacakları için haczedilebilirler.\nII. Amaçları dışında kullanılamazlar.\nIII. İflas masasına dâhil edilemezler."
  secenekler:
    A: "Yalnız II"
    B: "Yalnız III"
    C: "I ve II"
    D: "I ve III"
    E: "II ve III"
  dogru: E
  aciklama:
