    celdiriciler:
      A: "Kuruluş izni Kurul tarafından değil Cumhurbaşkanı tarafından verilir; Kurul uygun görüş bildirir ve faaliyet iznini verir."
      C: "Kurulun teklifi üzerine ilgili Bakanın izin vermesi merkezî takas kuruluşlarına ilişkindir (md. 77/1)."
      D: "Borsa kendi kuruluşuna izin veremez; izin makamı md. 65/1'de belirtilmiştir."
      E: "Md. 65/1 izin makamı olarak bir Bakanı değil Cumhurbaşkanını öngörür."
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 65/1
    alinti: "(1) Borsaların ve piyasa işleticilerinin kuruluşuna Kurulun uygun görüşü üzerine Cumhurbaşkanı tarafından izin verilir."
