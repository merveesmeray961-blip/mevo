  konu: ALT
  kazanim: borsalar
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: "6362 sayılı Sermaye Piyasası Kanunu'na göre borsaların ve piyasa işleticilerinin kuruluşuna kim tarafından izin verilir?"
  secenekler:
    A: "Doğrudan Sermaye Piyasası Kurulu"
    B: "Kurulun uygun görüşü üzerine Cumhurbaşkanı"
    C: "Kurulun teklifi üzerine ilgili Bakan"
    D: "Borsa İstanbul Genel Kurulu"
    E: "Kurulun uygun görüşü üzerine Hazine ve Maliye Bakanı"
