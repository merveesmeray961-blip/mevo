    öngörülmektedir. Kurumsal Yönetim Tebliği (II-17.1) uyarınca X için aşağıdakilerden hangisi zorunludur?
  secenekler:
    A: İşlem öncesinde yalnızca KAP'ta duyuru yapılması yeterlidir; değerleme aranmaz.
    B: İşlem öncesinde Kurulca belirlenen bir kuruluşa değerleme yaptırılmalıdır.
    C: Yönetim kurulu kararında bağımsız üyelerin çoğunluğunun onayı aranır.
    D: İşlem, doğrudan genel kurul onayına sunulmadan yapılamaz.
    E: İşlemden önce Kurulun yazılı izni alınmalıdır.
  dogru: B
  aciklama:
    dogru_neden: II-17.1 md. 9/2 uyarınca işlem tutarının varlık toplamına, yıllık hasılata veya şirket değerine oranının %5'ten fazla olacağının öngörülmesi hâlinde işlem öncesinde Kurulca belirlenen bir
      kuruluşa değerleme yaptırılması zorunludur. %7 oranı bu eşiği aşmaktadır.
    celdiriciler:
      A: '%5''ten fazla oranda değerleme zorunludur; yalnızca KAP duyurusu yeterli değildir (md. 9/2).'
      C: Bağımsız üye çoğunluğunun onayı %10'dan fazla orana ulaşılması hâlinde aranır (md. 9/3); %7 bu eşiğin altındadır.
      D: Genel kurul onayı, ancak bağımsız üyelerin çoğunluğunun işlemi onaylamaması hâlinde gündeme gelir (md. 9/3); %7'de böyle bir zorunluluk yoktur.
      E: Tebliğ md. 9'da Kurul izni değil, değerleme ve (%10 üzerinde) bağımsız üye onayı öngörülmüştür.
  kaynaklar:
  - mevzuat: Kurumsal Yönetim Tebliği (II-17.1)
    madde: md. 9/2
    alinti: '%5’ten fazla olarak gerçekleşeceğinin öngörülmesi durumunda; işlem öncesinde işleme ilişkin Kurulca belirlenen bir kuruluşa değerleme yaptırılması zorunludur.'
