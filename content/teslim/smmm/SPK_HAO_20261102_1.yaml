      B: Yeni kuruluş şeklinde birleşmeye taraf olma, md. 5/1 (a) uyarınca önemli nitelikteki işlemdir.
      C: İmtiyaz öngörülmesi md. 4/1 (ç) bendinde önemli nitelikteki işlem olarak sayılmıştır.
      D: Önemlilik ölçütlerini sağlayan mal varlığının devri md. 4/1 (c) bendi kapsamındadır.
