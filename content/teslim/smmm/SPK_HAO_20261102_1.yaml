  kok: Kâr Payı Tebliği (II-19.1)'ne göre payları borsada işlem görmeyen bir halka açık ortaklığın kâr payı dağıtım oranı, bağışlar eklenmiş net dağıtılabilir dönem kârının en az yüzde kaçı olmalıdır?
  secenekler:
    A: Yüzde on
    B: Yüzde on beş
    C: Yüzde yirmi
    D: Yüzde yirmi beş
    E: Yüzde otuz
  dogru: C
  aciklama:
    dogru_neden: II-19.1 md. 7/1 uyarınca payları borsada işlem görmeyen ortaklıklar için kâr payı dağıtım oranı, bağışlar eklenmiş net dağıtılabilir dönem kârının yüzde yirmisinden az olamaz.
    celdiriciler:
      A: Yüzde on, md. 7/1'de öngörülen alt sınır değildir; alt sınır yüzde yirmidir.
      B: Yüzde on beş, md. 7/1'de öngörülen alt sınır değildir; alt sınır yüzde yirmidir.
      D: Yüzde yirmi beş, nakit kâr payı dağıtımında Kurul ücreti indiriminin eşiğidir (md. 15); alt sınır yüzde yirmidir.
      E: Yüzde otuz, md. 7/1'de öngörülen alt sınır değildir; alt sınır yüzde yirmidir.
  kaynaklar:
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 7/1
    alinti: Payları borsada işlem görmeyen ortaklıklar için kâr payı dağıtım oranı, bu Tebliğ hükümleri uyarınca belirlenen bağışlar eklenmiş net dağıtılabilir dönem kârının yüzde yirmisinden az olamaz.
  - mevzuat: Kâr Payı Tebliği (II-19.1)
    madde: md. 15/1
    alinti: Ortaklıklar tarafından net dağıtılabilir dönem kârının en az yüzde yirmi beşi oranında nakit kâr payı dağıtımına karar verilmesi durumunda; dağıtıma ilişkin genel kurul kararının alınmasından
      itibaren bir yıl içinde gerçekleştirilecek pay ihraçlarından alınacak Kurul ücretlerinde, 22/6/2013 tarihli ve 28685 sayılı Resmî Gazete’de yayımlanan VII-128.1 sayılı Pay Tebliğinin 26 ncı maddesinde
      düzenlenen oranların yüzde yetmiş beşi esas alınır.
