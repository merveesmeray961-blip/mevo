    alinti: 5 inci maddede tanımlanan birleşme veya bölünme işlemlerine taraf olması, b) Tür değiştirmesi, c) 6 ncı maddede belirlenen önemlilik ölçütlerini sağlayan mal varlığının devri veya bu mal varlığının
