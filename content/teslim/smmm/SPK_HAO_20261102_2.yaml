  kok: Halka açık bir ortaklığın taraf olduğu birleşme sözleşmesinde, devrolunan şirketin ortaklarına ayrılma akçesi öngörülmüştür. Birleşme ve Bölünme Tebliği (II-23.2) md. 12/3'e göre ayrılma akçesine
    ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Ayrılma akçesi yalnızca menkul kıymet olarak belirlenebilir; nakit ödeme yapılamaz.
    B: Ayrılma akçesi yalnızca nakit olarak belirlenebilir; menkul kıymet verilemez.
    C: Ayrılma akçesi menkul kıymet olarak belirlenmişse bu menkul kıymetin borsada işlem görmesi şart değildir.
    D: Nakit, menkul kıymet veya karma olabilir; pay sahibi talep ederse nakden ödenmesi zorunludur.
    E: Ayrılma akçesi nakden ödenecekse pay sahibinin talebi aranmaz, ancak menkul kıymet olarak ödenemez.
  dogru: D
  aciklama:
    dogru_neden: 'II-23.2 md. 12/3 uyarınca ayrılma akçesinin Türk Lirası cinsinden nakit, menkul kıymet veya kısmen nakit kısmen menkul kıymet olarak belirlenmesi mümkündür; ancak pay sahibinin talebi
      hâlinde nakden ödenmesi zorunludur. Menkul kıymet cinsinden belirlenmesi hâlinde menkul kıymetin borsada işlem gören bir menkul kıymet olması zorunludur. Püf noktaları: Esneklik (nakit/menkul kıymet/karma)
      ile iki güvence (talep üzerine nakit, menkul kıymette borsa şartı) birlikte okunmalıdır.'
    celdiriciler:
      A: Md. 12/3 nakit seçeneğini de öngörür; ayrıca pay sahibinin talebi hâlinde nakit ödeme zorunludur.
      B: Md. 12/3 menkul kıymet veya kısmen menkul kıymet seçeneğine de izin verir.
      C: Md. 12/3 menkul kıymetin borsada işlem gören bir menkul kıymet olmasını zorunlu kılar.
      E: Pay sahibinin talebi hâlinde nakden ödeme zorunlu olduğu gibi menkul kıymet olarak da belirlenebilir; menkul kıymete izin verilmediği yönündeki ifade yanlıştır.
