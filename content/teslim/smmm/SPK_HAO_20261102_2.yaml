    I. Yönetim kurulunun imtiyazlı pay çıkarabilmesi için esas sözleşme ile yetkili kılınması şarttır.


    II. Yönetim kurulunun yeni pay alma hakkını kısıtlama yetkisi, pay sahipleri arasında eşitsizliğe yol açacak şekilde de kullanılabilir.


    III. Ortaklıkların kayıtlı sermaye tavanı dâhilindeki sermaye artırımlarında ayrıca imtiyazlı pay sahipleri özel kurulu kararı aranmaz.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur; md. 18/5 imtiyazlı veya nominal değerinin üzerinde veya altında pay çıkarılması gibi konularda karar alabilmesi için yönetim kurulunun esas sözleşme ile yetkili kılınmasını
      şart koşar. III doğrudur; md. 18/4 uyarınca kayıtlı sermaye tavanı dâhilindeki sermaye artırımlarında ayrıca imtiyazlı pay sahipleri özel kurulu kararı aranmaz. II yanlıştır; md. 18/5 son cümlesi
      yeni pay alma hakkını kısıtlama yetkisinin pay sahipleri arasında eşitsizliğe yol açacak şekilde kullanılamayacağını belirtir. Püf noktaları: Yetkinin kaynağı (esas sözleşme) ve sınırı (eşitlik) ile
      imtiyazlı pay sahipleri özel kurulu istisnasını ayrı ayrı değerlendirin.'
    celdiriciler:
      A: III de doğrudur; tavan dâhilindeki artırımlarda özel kurul kararı aranmaz.
      B: II yanlıştır; yetki pay sahipleri arasında eşitsizliğe yol açacak şekilde kullanılamaz.
      C: I de doğrudur ve II yanlıştır; bu şık doğru önermeyi dışarıda bırakıp yanlış olanı içerir.
      E: II yanlış olduğundan üç önermenin tümü doğru değildir.
