    aylık ara dönem finansal tablolarında net dönem kârı 36 milyon TL, ayrılması gereken yedek akçe 2 milyon TL, geçmiş yıllar zararı 4 milyon TL; net dönem kârı hariç dağıtıma konu edilebilecek diğer kaynaklar
    ise 30 milyon TL'dir. Kâr Payı Tebliği (II-19.1) md. 10'a göre dokuz aylık dönem için dağıtılabilecek avans en çok kaç TL'dir?
