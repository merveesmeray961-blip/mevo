      ister. III doğrudur; md. 6/2 uyarınca sebepler ortadan kalkar kalkmaz bilgi açıklanır ve açıklamada erteleme kararı ve sebepleri belirtilir. I yanlıştır; md. 6/1 ertelemeyi sorumluluğu ihraççıya ait
