  aciklama:
    dogru_neden: 'Md. 10/1 uyarınca bu avans, (36 - 2 - 4) / 2 = 15 milyon TL''yi geçemez. Md. 10/2 uyarınca dönem toplamı, önceki yıl net dönem kârının yarısı (24 milyon TL) ile diğer kaynaklardan (30
      milyon TL) düşük olanı olan 24 milyon TL''yi aşamaz. Md. 10/3 uyarınca önceki ara dönemlerde ödenen avanslar bu toplamdan indirilir: 24 - 14 = 10 milyon TL. Bu avans için sınır olan 15 milyon TL''den
      düşük olduğundan dağıtılabilecek avans 10 milyon TL''dir. Püf noktaları: İki sınırı ayrı ayrı hesaplayıp düşük olanı seçin; önceden ödenen avansı yalnızca dönem toplamından düşün, ara dönem kârının
      yarısından değil.'
