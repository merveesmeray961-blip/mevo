  aciklama:
    dogru_neden: "II-5.1 md. 6/2-a uyarınca yalnızca nitelikli yatırımcılara satışta, md. 6/2-c uyarınca sermayeyi değiştirmeyen kupür, tertip, pay birleştirilmesi veya bölünmesine konu paylarda izahname hazırlanmaz (I ve III doğru). Md. 6/2-d uyarınca bedelsiz pay çıkarılmasında da izahname hazırlanmaz; bu nedenle II yanlıştır."
    celdiriciler:
      A: "III de doğrudur; sermayeyi değiştirmeyen kupür, tertip, birleştirme ve bölünmelerde izahname hazırlanmaz."
      B: "II yanlıştır; bedelsiz pay çıkarılmasında izahname hazırlanması zorunlu değildir. III ise doğru olduğu hâlde dışarıda bırakılmıştır."
      D: "II yanlıştır; ayrıca doğru olan I dışarıda bırakılmıştır."
      E: "II yanlış olduğundan üç öncülün hepsi doğru değildir."
