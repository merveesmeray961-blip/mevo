  kok: "Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2) md. 10 ve 14'e göre halka arz satış yöntemlerine ilişkin aşağıdaki ifadelerden hangileri doğrudur?\n\nI. Borsada satış yönteminde, satışın talep toplama suretiyle gerçekleşmesi durumunda talep toplama süresi en az bir, en fazla beş iş günüdür.\nII. Fiyat aralığı ile talep toplama yönteminde tavan fiyat, taban fiyatın yüzde yirmi fazlasını aşmayacak şekilde belirlenir.\nIII. Borsada satış yönteminde satışın talep toplanmaksızın gerçekleşmesi durumunda satış süresi iki iş günüdür."
  secenekler:
    A: "Yalnız I"
    B: "I ve II"
    C: "I ve III"
    D: "II ve III"
    E: "I, II ve III"
  dogru: D
  aciklama:
    dogru_neden: "II-5.2 md. 14/8 uyarınca fiyat aralığında tavan fiyat, taban fiyatın yüzde yirmi fazlasını aşamaz (II doğru). Md. 10/8-a uyarınca borsada talep toplanmaksızın satışta satış süresi iki iş günüdür (III doğru). Md. 10/8-b uyarınca borsada talep toplama süresi en az iki, en fazla üç iş günüdür; bir-beş iş günü yanlıştır (I yanlış). Püf noktaları: Borsada satışta talep toplamalı süre iki ila üç iş günüdür; genel halka arz süresi (iki ila yirmi iş günü) ile karıştırılmamalıdır."
    celdiriciler:
      A: "I yanlıştır; talep toplama süresi iki ila üç iş günüdür. Ayrıca doğru olan II ve III dışarıda bırakılmıştır."
      B: "I yanlıştır; III ise doğru olduğu hâlde dışarıda bırakılmıştır."
      C: "I yanlıştır; II ise doğru olduğu hâlde dışarıda bırakılmıştır."
      E: "I yanlış olduğundan üç öncülün hepsi doğru değildir."
  kaynaklar:
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 14/8
    alinti: "(8) Fiyat aralığı ile talep toplama yoluyla satış yönteminin kullanılması durumunda tavan fiyat, taban fiyatın yüzde yirmi fazlasını aşmayacak şekilde belirlenir."
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 10/8-a
    alinti: "Satışın talep toplanmaksızın gerçekleşmesi durumunda satış süresi iki iş günüdür."
  - mevzuat: Sermaye Piyasası Araçlarının Satışı Tebliği (II-5.2)
    madde: md. 10/8-b
    alinti: "Satışın talep toplama suretiyle gerçekleşmesi durumunda talep toplama süresi, en az iki iş günü en fazla üç iş günüdür."
  gecerlilik: {baslangic: '2013-07-07', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [YET]
  ders: SPK
  unite: İzahname ve halka arz
  konu: IZA
  kazanim: izahnamenin yayımı
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Kurulca onaylanan bir izahname ihraççı tarafından teslim alınmıştır. İhraççının KAP üyeliği bulunmaktadır. İzahname ve İhraç Belgesi Tebliği (II-5.1) md. 28'e göre izahnamenin ilanı ve yayım yerinin tescili bakımından aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "İzahname teslim alınmasını takiben on iş günü içinde ilan edilir; yayım yeri ilandan itibaren on beş iş günü içinde tescil edilir"
    B: "İzahname teslim alınmasını takiben otuz iş günü içinde ilan edilir; yayım yeri ilandan itibaren beş iş günü içinde tescil edilir"
    C: "İzahname teslim alınmasını takiben beş iş günü içinde ilan edilir; yayım yerinin tescili ayrıca aranmaz"
    D: "İzahname, tescil edildikten sonra ilan edilir; satışa başlanması için yayım yerinin tescili şarttır"
    E: "On beş iş günü içinde KAP'ta ilan edilir; yayım yeri, ilandan itibaren on iş günü içinde tescil edilir"
  dogru: E
  aciklama:
    dogru_neden: "II-5.1 md. 28/3 uyarınca onaylanmış izahname, teslim alınmasını takiben on beş iş günü içinde ihraççının internet sitesinde ve KAP üyeliği varsa KAP'ta ilan edilir. Md. 28/9 uyarınca izahnamenin nerede yayımlandığı hususu ilandan itibaren on iş günü içerisinde ticaret siciline tescil ve TTSG'de ilan edilir; satışa başlanması için yayım yerinin tescil edilmesine gerek yoktur. Püf noktaları: Onaylı izahnamenin ilan süresi (15 iş günü) ile yayım yerinin tescil süresi (10 iş günü) birbirine karıştırılır; sayılar yer değiştirmiş seçeneklere dikkat edilmelidir."
    celdiriciler:
      A: "İlan ve tescil süreleri yer değiştirmiştir; ilan süresi on beş, tescil süresi on iş günüdür."
      B: "Otuz ve beş iş günü, md. 28'de öngörülen süreler değildir."
      C: "Yayım yerinin tescili md. 28/9 uyarınca ayrıca yapılır; beş iş günü ilan süresi de değildir."
      D: "Satışa başlanması için yayım yerinin tescil edilmesine gerek bulunmaz (md. 28/9)."
  kaynaklar:
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 28/3
    alinti: "Kurulca onaylanmış izahname, teslim alınmasını takiben on beş iş günü içerisinde ihraççının internet sitesinde, ihraççının KAP üyeliğinin bulunması durumunda KAP’ta ve varsa yetkili kuruluşun internet sitesinde ilan edilir."
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 28/9
    alinti: "İzahnamenin nerede yayımlandığı hususu ilandan itibaren on iş günü içerisinde ticaret siciline tescil ve TTSG’de ilan edilir. Sermaye piyasası araçlarının satışına başlanması için izahnamenin nerede yayımlandığı hususunun tescil edilmesine gerek bulunmaz."
  gecerlilik: {baslangic: '2013-07-17', bitis: null, yila_bagli_tutar: false}
