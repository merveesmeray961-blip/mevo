    madde: md. 6/2-a
    alinti: "a) Sermaye piyasası araçlarının sadece nitelikli yatırımcılara satışında,"
  - mevzuat: İzahname ve İhraç Belgesi Tebliği (II-5.1)
    madde: md. 6/2-c
