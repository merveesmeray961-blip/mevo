  kok: '6362 sayılı Kanun md. 96''ya göre sermaye piyasası kurumlarının hukuka aykırı faaliyetlerinde Kurulun alabileceği tedbirlere ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Kurul, kurumun faaliyetlerini geçici olarak durdurmak için önce mahkemeden karar almak zorundadır.


    II. Kurul, kurumun faaliyetlerinin kapsamını sınırlandırabilir veya geçici olarak durdurabilir.


    III. Kurul, hukuka aykırı faaliyette sorumluluğu tespit edilen yöneticilerin ve çalışanların lisanslarını geçici veya sürekli olarak iptal edebilir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: D
  aciklama:
    dogru_neden: II doğrudur; md. 96/1 Kurula aykırılığın giderilmesini isteme veya faaliyetlerin kapsamını sınırlandırma ya da geçici olarak durdurma yetkisi verir. III doğrudur; md. 96/2 sorumluluğu tespit
      edilen yöneticilerin ve çalışanların lisanslarının geçici veya sürekli iptaline izin verir. I yanlıştır; md. 96 Kurula bu yetkiyi doğrudan tanır, mahkeme kararı şartı aramaz.
    celdiriciler:
      A: I yanlıştır; Kurulun yetkisi mahkeme kararına bağlı değildir.
      B: I yanlış olduğundan bu şık doğru değildir.
      C: I yanlıştır ve II doğrudur; bu şık II'yi dışarıda bırakıp yanlış olan I'i içerir.
      E: I yanlış olduğundan üç ifadenin tümü doğru değildir.
  kaynaklar:
