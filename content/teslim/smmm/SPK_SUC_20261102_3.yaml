    madde: md. 96/1
    alinti: ya da doğrudan bu kurumların faaliyetlerinin kapsamını sınırlandırmaya veya geçici olarak durdurmaya, tamamen veya belirli sermaye piyasası faaliyetleri itibarıyla yetkilerini iptal etmeye ya
