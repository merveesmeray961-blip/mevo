  secenekler:
    A: Yatırım kuruluşu, çerçeve sözleşmede hüküm olmasa da emri dilediği gibi reddedebilir.
    B: Yatırım kuruluşu, yalnızca mevcut açık pozisyonların kapatılması taleplerini reddedebilir.
    C: Emir kabul etmeme hakkı ancak çerçeve sözleşmede hüküm bulunmasıyla kullanılabilir.
    D: Yatırım kuruluşu, emri reddetmek için Kuruldan izin almak zorundadır.
    E: Yatırım kuruluşu, yalnızca müşterinin yazılı onayıyla emri reddedebilir.
  dogru: C
  aciklama:
    dogru_neden: III-37.1 sayılı Tebliğ md. 30/5 uyarınca yatırım kuruluşları, türev araçlardaki mevcut açık pozisyonların kapatılmasına ilişkin mevzuata uygun talepler hariç olmak üzere, çerçeve sözleşmede bu konuda hüküm bulunması kaydıyla emir kabul etmeme hakkına sahiptir.
    celdiriciler:
      A: Tebliğ, emir kabul etmeme hakkını çerçeve sözleşmede hüküm bulunması şartına bağlar.
      B: Mevzuata uygun açık pozisyon kapatma talepleri bu hakkın dışındadır; kuruluş bu talepleri reddedemez.
      D: Tebliğde reddetme için Kurul izni aranmaz; şart çerçeve sözleşmede hükmün bulunmasıdır.
      E: Tebliğ müşterinin onayını değil, çerçeve sözleşmedeki hükmü arar.
