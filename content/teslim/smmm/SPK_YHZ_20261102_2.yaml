  kok: Halka arza aracılık sözleşmesi ile konsorsiyum sözleşmesinin tek sözleşmede birleştirilmesi planlanmaktadır; sözleşme taslağı konsorsiyuma katılan diğer yatırım kuruluşlarına 12 Mart günü paylaşılmıştır. III-37.1 sayılı Tebliğ'in 57 nci maddesine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Tek sözleşme, paylaşımdan hemen sonra yalnızca ihraççı ve konsorsiyum lideri tarafından imzalanabilir.
    B: Tek sözleşme, paylaşımdan itibaren en az otuz gün geçmeden imzalanamaz.
    C: Halka arza aracılık sözleşmesi ile konsorsiyum sözleşmesi hiçbir hâlde birleştirilemez.
    D: En az iki iş günü öncesinden diğer kuruluşlarla paylaşılır ve taraflarca birlikte imzalanır.
    E: Tek sözleşme, en az iki takvim günü öncesinden Kurula sunulmak suretiyle imzalanır.
  dogru: D
  aciklama:
    dogru_neden: 'III-37.1 sayılı Tebliğ md. 57/2 uyarınca halka arza aracılık sözleşmesi ile konsorsiyum sözleşmesinin bir arada yapılmak istenmesi hâlinde her iki sözleşmede yer alacak hükümler tek sözleşmede birleştirilebilir ve sözleşme, konsorsiyuma katılan diğer yatırım kuruluşları ile en az 2 iş günü öncesinden paylaşılmak suretiyle ihraççı ve/veya halka arz eden ile konsorsiyum lideri ve konsorsiyuma katılan diğer yatırım kuruluşları tarafından birlikte imzalanır. Püf noktaları: Süre ''iş günü'' ile ve ''en az iki'' olarak ifade edilir; imza taraflarının tamamının birlikte imzalaması gerekir. Paylaşım tarihi 12 Mart olduğundan sözleşme en erken iki iş günü sonra imzalanabilir.'
    celdiriciler:
      A: Tebliğ, sözleşmenin ihraççı ve/veya halka arz eden ile konsorsiyum lideri ve konsorsiyuma katılan diğer yatırım kuruluşları tarafından birlikte imzalanmasını şart koşar.
      B: Tebliğdeki paylaşım süresi otuz gün değil, en az iki iş günüdür.
      C: Tebliğ, her iki sözleşmedeki hükümlerin tek sözleşmede birleştirilmesine imkân tanır.
      E: Tebliğdeki yükümlülük Kurula sunum değil, konsorsiyuma katılan diğer yatırım kuruluşlarıyla en az iki iş günü öncesinden paylaşımdır.
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 57/2
    alinti: (2) Halka arza aracılık sözleşmesi ile konsorsiyum sözleşmesinin bir arada yapılmak istenmesi halinde, her iki sözleşmede yer alacak hükümler, tek sözleşmede birleştirilebilir ve sözleşme, konsorsiyuma katılan diğer yatırım kuruluşları ile en az 2 iş günü öncesinden paylaşılmak suretiyle sermaye piyasası aracını ihraç eden ve/veya halka arz eden ile konsorsiyum lideri ve konsorsiyuma katılan diğer yatırım kuruluşları tarafından birlikte imzalanır.
