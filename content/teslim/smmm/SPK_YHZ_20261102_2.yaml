  kok: Kaldıraçlı alım satım işlemlerinde müşteri M, 1,1000 fiyat ve 100.000 birim miktarlı bir emir vermiş; emrin gerçekleşmesinden önce aracı kurum fiyatı M aleyhine değiştirmek istemiştir. M, emri verirken fiyat aralığı belirlememiştir. III-37.1 sayılı Tebliğ'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Aracı kurum, fiyatı M aleyhine değiştirmek için M'nin onayını almak zorundadır.
    B: Aracı kurum, emri çerçeve sözleşmede hüküm varsa M'nin onayını almadan aleyhe değiştirebilir.
    C: Aracı kurum, M'ye bildirim yaparak onay almadan değişiklik yapabilir.
    D: M'nin onayı yalnızca miktar değişikliği için gerekir; fiyat değişikliği serbesttir.
    E: Fiyat değişikliği, M'nin lehine ise onay gerekir; aleyhine ise gerekmez.
  dogru: A
  aciklama:
    dogru_neden: 'III-37.1 sayılı Tebliğ md. 30/4 uyarınca kaldıraçlı alım satım işlemlerinde müşteri tarafından verilen emre ilişkin fiyat, miktar veya diğer unsurlardan herhangi birisinin emir gerçekleşmeden önce aracı kurum tarafından müşteri aleyhine değiştirilmek istenmesi hâlinde müşterinin onayının alınması zorunludur. Müşteri lehine sonuç verecek değişikliklerde veya emirlerde fiyat aralığının belirlenmiş olması durumunda bu aralıktaki değişimler için onay aranmaz. Püf noktaları: Önce istisnaları kontrol edin (lehe değişiklik, belirlenmiş fiyat aralığı); soruda fiyat aralığı yoktur ve değişiklik aleyhedir, bu nedenle onay şarttır. Çerçeve sözleşme hükmü onay şartını kaldırmaz.'
    celdiriciler:
      B: Çerçeve sözleşme hükmü onay zorunluluğunu kaldırmaz; müşteri aleyhine değişiklik için müşterinin onayı zorunludur.
      C: Bildirim, onay yerine geçmez; Tebliğ onayın alınmasını zorunlu kılar.
      D: Fiyat, miktar veya diğer unsurlardan herhangi biri müşteri aleyhine değiştirilecekse onay aranır.
      E: Kural tersidir; aleyhe değişiklikte onay şarttır, lehe değişikliklerde onay aranmaz.
  kaynaklar:
  - mevzuat: Yatırım Hizmetleri ve Faaliyetleri ile Yan Hizmetlere İlişkin Esaslar Hakkında Tebliğ (III-37.1)
    madde: md. 30/4
    alinti: Kaldıraçlı alım satım işlemlerinde, müşteri tarafından verilen emre ilişkin fiyat, miktar veya diğer unsurlardan herhangi birisinin emir gerçekleşmeden önce aracı kurum tarafından müşteri aleyhine değiştirilmek istenmesi halinde, müşterinin onayının alınması zorunludur. Ancak, müşteri tarafından verilen emirlerin unsurlarında müşteri lehine sonuç verecek nitelikteki değişikliklerde veya müşteriler tarafından verilen emirlerde fiyat aralığının belirlenmiş olması durumunda bu fiyat aralığında oluşan değişimler için müşteri onayı aranmaksızın emir gerçekleştirilebilir.
