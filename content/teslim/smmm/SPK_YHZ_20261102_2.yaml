      C: Kurula bildirim, müşterinin yazılı talimatının yerine geçmez.
      D: Tebliğ bu alımlar için müşterinin yazılı bir talimatını ayrıca arar.
      E: Müşterinin yazılı talimatı olmadan rayiç değerinin üstündeki varlıklar da portföye alınamaz.
