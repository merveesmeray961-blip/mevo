      C: Haftalık toplu kayıt perakende satış defteri için öngörülmemiştir; kayıt günü gününe yapılır.
      D: Ay sonunda toplu kayıt md. 219/c'ye aykırıdır.
      E: Kırk beş gün, md. 219/b'deki mazbut vesikalara dayanan kayıt sisteminin esas defterlere intikal sınırıdır; perakende satış defteri için geçerli değildir.
