  zorluk: 1
  soru_bicimi: standart
  kok: "TMS 16 Maddi Duran Varlıklar Standardına göre arsa ve bina birlikte satın alındığında bunların amortismana tabi tutulması bakımından aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Arsa ve bina tek bir varlık sayılır ve birlikte amortismana tabi tutulur."
    B: "Arsa, bina ile birlikte alınırsa ayrı olarak muhasebeleştirilemez."
