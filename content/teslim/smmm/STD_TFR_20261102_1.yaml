- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 8
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir işletme, bir önceki dönemin finansal tablolarında önemli bir hata yapıldığını cari dönemde tespit etmiştir. Hatanın dönemler itibarıyla etkisi belirlenebilmektedir. TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre bu hata nasıl düzeltilir?"
  secenekler:
    A: "Hata, tespit edildiği dönemin kâr veya zararına gider olarak yansıtılır."
    B: "Hata, yalnızca gelecek dönemlerde ileriye yönelik olarak düzeltilir."
    C: "Hata, muhasebe tahmini değişikliği gibi cari ve gelecek dönemlere yayılır."
    D: "Geriye dönük yeniden düzenlenir; tespit dönemi kârı veya zararı değişmez."
    E: "Hata düzeltilmez; yalnızca dipnotlarda açıklanması yeterlidir."
  dogru: D
  aciklama:
    dogru_neden: "TMS 8 paragraf 43 uyarınca etkisi belirlenebilen geçmiş dönem hatası geriye dönük olarak yeniden düzenleme yapılarak düzeltilir; paragraf 46 uyarınca hatanın tespit edildiği dönemin kâr veya zararında herhangi bir değişiklik yapılmaz."
    celdiriciler:
      A: "Hata cari dönem kâr veya zararına yazılmaz; paragraf 46 tespit dönemi kâr veya zararında değişiklik yapılmamasını öngörür."
      B: "İleriye yönelik düzeltme yalnızca etkinin belirlenmesinin mümkün olmadığı hâllerde söz konusudur."
      C: "Dönemlere yayma, tahmin değişikliğinin yöntemidir; hata geriye dönük düzeltilir."
      E: "Önemli hata yalnızca açıklanarak bırakılmaz; geriye dönük yeniden düzenleme zorunludur."
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 43
    alinti: "Bir geçmiş dönem hatasının dönemler itibarıyla yarattığı etkinin ya da birikimli etkisinin belirlenmesinin mümkün olmadığı durumlar dışında, söz konusu hata, geriye dönük olarak yeniden düzenleme yapılarak düzeltilir."
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 46
    alinti: "Geçmiş dönem hatasının düzeltilmesi nedeniyle, hatanın tespit edildiği dönemin kâr veya zararında herhangi bir değişiklik yapılmaz."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: uygulama
  zorluk: 1
  soru_bicimi: standart
  kok: "Bir işletmenin yeniden değerlenmemiş makinesinin geri kazanılabilir tutarı, defter değerinden yüksek bulunmuştur. TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre bu makine için aşağıdakilerden hangisi uygulanır?"
  secenekler:
    A: "Değer düşüklüğü zararı muhasebeleştirilmez ve defter değeri korunur."
    B: "Fark kadar değer artışı doğrudan kâr veya zararda gelir yazılır."
    C: "Defter değeri geri kazanılabilir tutara kadar artırılır."
    D: "Fark tutarında değer düşüklüğü karşılığı ayrılır."
    E: "Makine satış amaçlı elde tutulan varlık olarak yeniden sınıflandırılır."
  dogru: A
  aciklama:
    dogru_neden: "TMS 36 paragraf 59 uyarınca defter değeri, sadece ve sadece geri kazanılabilir tutarın defter değerinden düşük olması hâlinde geri kazanılabilir tutara indirgenir. Burada geri kazanılabilir tutar daha yüksek olduğundan zarar muhasebeleştirilmez."
    celdiriciler:
      B: "Geri kazanılabilir tutarın yüksek olması defter değerinin artırılmasına ve gelir yazılmasına dayanak olmaz."
      C: "Defter değeri geri kazanılabilir tutara indirgenir, artırılmaz; artış ancak önceki zararın iptali hâlinde söz konusudur."
      D: "Karşılık ayrılması için geri kazanılabilir tutarın defter değerinden düşük olması gerekir."
      E: "Sınıflandırma TFRS 5 koşullarına bağlıdır; geri kazanılabilir tutarın yüksek olması bu sonucu doğurmaz."
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 59
    alinti: "Sadece ve sadece, bir varlığın geri kazanılabilir tutarının defter değerinden düşük olması durumunda, söz konusu varlığın defter değeri geri kazanılabilir tutarına indirgenir."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "TMS 36 Varlıklarda Değer Düşüklüğü Standardı kapsamında bir makinenin defter değeri 1.200.000 TL, satış maliyetleri düşülmüş gerçeğe uygun değeri 1.050.000 TL ve kullanım değeri 1.100.000 TL'dir. Makine yeniden değerlenmiş tutarı üzerinden izlenmemektedir. Muhasebeleştirilecek değer düşüklüğü zararı kaç TL'dir?"
  secenekler:
    A: "50.000 TL"
    B: "100.000 TL"
    C: "125.000 TL"
    D: "150.000 TL"
    E: "1.100.000 TL"
  dogru: B
  aciklama:
    dogru_neden: "TMS 36 paragraf 18 uyarınca geri kazanılabilir tutar, iki değerden yüksek olanıdır: 1.100.000 TL. Paragraf 59 uyarınca defter değeri geri kazanılabilir tutara indirgenir; 1.200.000 - 1.100.000 = 100.000 TL değer düşüklüğü zararı kâr veya zararda muhasebeleştirilir."
    hesap_adimlari:
      - "Geri kazanılabilir tutar = max(1.050.000; 1.100.000) = 1.100.000 TL"
      - "Değer düşüklüğü zararı = 1.200.000 - 1.100.000 = 100.000 TL"
    celdiriciler:
      A: "50.000 TL, iki değerin farkıdır (1.100.000 - 1.050.000); zarar defter değeri ile geri kazanılabilir tutar arasındaki farktır."
      C: "125.000 TL, iki değerin ortalaması (1.075.000) kullanılarak bulunur; standart ortalamayı değil yüksek olanı esas alır."
      D: "150.000 TL, yalnızca satış maliyetleri düşülmüş gerçeğe uygun değer esas alınarak bulunur; kullanım değeri daha yüksektir."
      E: "1.100.000 TL geri kazanılabilir tutardır; zarar tutarı değildir."
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 18
    alinti: "Bu Standart geri kazanılabilir tutarı; bir varlığın veya nakit yaratan birimin satış maliyetleri düşülmüş gerçeğe uygun değer ile kullanım değerinden yüksek olanı olarak tanımlar."
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 59
    alinti: "Sadece ve sadece, bir varlığın geri kazanılabilir tutarının defter değerinden düşük olması durumunda, söz konusu varlığın defter değeri geri kazanılabilir tutarına indirgenir. Anılan indirgeme, bir değer düşüklüğü zararıdır."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama: {python: "sonuc = 1200000 - max(1050000, 1100000)"}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 36
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletme önceki dönemde bir nakit yaratan birim için hem şerefiyeye hem de birimdeki bir makineye ilişkin değer düşüklüğü zararı muhasebeleştirmiştir. Cari dönemde birimin geri kazanılabilir tutarı belirgin biçimde artmıştır. TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Her iki varlık için ayrılan zararlar iptal edilir ve defter değerleri geri kazanılabilir tutara çıkarılır."
    B: "Şerefiye için ayrılan zarar iptal edilebilir; makineye ilişkin zarar hiçbir koşulda iptal edilemez."
    C: "Şerefiye ve makine için ayrılan zararların hiçbiri iptal edilemez; artış yeniden değerleme olarak izlenir."
    D: "Şerefiyenin zararı iptal edilmez; makinenin zararı, zarar hiç ayrılmasaydı ulaşacağı defter değerini aşmamak üzere iptal edilir."
    E: "Şerefiyenin zararı iptal edilmez; makinenin zararı iptal edilir ve defter değeri geri kazanılabilir tutarına kadar sınırsız artırılır."
  dogru: D
  aciklama:
    dogru_neden: "TMS 36 paragraf 124 uyarınca şerefiyeye ilişkin değer düşüklüğü zararı sonraki dönemde iptal edilmez. Şerefiye dışındaki varlıkta ise paragraf 114 ve 117 uyarınca tahminlerde değişiklik olduysa zarar iptal edilir; ancak artan defter değeri, zarar hiç muhasebeleştirilmeseydi ulaşacağı (amortisman dikkate alınmaksızın) defter değerini aşamaz. Püf noktaları: İki varlığın kuralı farklıdır; şerefiye için iptal yoktur, diğer varlıkta iptal vardır ama bir tavanı vardır. Geri kazanılabilir tutara kadar artırmak tek başına yeterli değildir, tavan her zaman kontrol edilir."
    celdiriciler:
      A: "Şerefiye zararı iptal edilemez; ayrıca makine için de defter değeri tavanla sınırlıdır."
      B: "Durum tersine çevrilmiştir; iptal yasağı şerefiye içindir, makinenin zararı iptal edilebilir."
      C: "Şerefiye dışı varlığın zararı iptal edilebilir ve iptal, yeniden değerlenmemiş varlıkta kâr veya zararda gösterilir."
      E: "Artış paragraf 117'deki tavanla sınırlıdır; tavan, zarar hiç ayrılmasaydı ulaşılacak defter değeridir."
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 124
    alinti: "Şerefiyeye ilişkin olarak muhasebeleştirilen değer düşüklüğü zararı daha sonraki bir dönemde iptal edilmez."
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 117
    alinti: "Şerefiye haricindeki bir varlığa ilişkin değer düşüklüğü zararının iptali nedeniyle artan defter değeri, önceki dönemlerde söz konusu varlık için değer düşüklüğü zararı muhasebeleştirilmemiş olsaydı ulaşacağı (amortisman veya itfa payı dikkate alınmaksızın) defter değerini aşmaz."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

