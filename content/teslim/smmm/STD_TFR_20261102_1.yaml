- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 23
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletme, özellikli varlık niteliğindeki bir tesisin inşaatı için kullandığı krediye ilişkin yıl boyunca her ay eşit tutarda toplam 1.080.000 TL faiz tahakkuk ettirmiştir. İnşaat yılın 12 ayı boyunca aktifleştirme koşullarını sağlamış; ancak finansman sağlanamadığından 5 ay boyunca hiçbir teknik ve idari çalışma yapılmamış, 7 ay çalışma sürmüştür. Bu ara, geçici gecikme niteliğinde sayılmamaktadır. TMS 23 Borçlanma Maliyetleri Standardına göre yıl içinde aktifleştirilecek borçlanma maliyeti kaç TL'dir?"
  secenekler:
    A: "90.000 TL"
    B: "450.000 TL"
    C: "630.000 TL"
    D: "720.000 TL"
    E: "1.080.000 TL"
  dogru: C
  aciklama:
    dogru_neden: "TMS 23 paragraf 21 uyarınca varlığın hazır hale getirilmesi için gerekli işlemlere uzun süreli ara verildiği dönemde oluşan borçlanma maliyetleri aktifleştirilemez. Aylık faiz 1.080.000 / 12 = 90.000 TL olup yalnızca çalışmanın sürdüğü 7 ay için 7 x 90.000 = 630.000 TL aktifleştirilir; ara verilen 5 aya ait 450.000 TL gider yazılır. Püf noktaları: Ara dönemde ne teknik ne idari çalışma yapıldığı ve gecikmenin geçici olmadığı verilmiştir, bu yüzden askıya alma uygulanır; ayrıca 5 ay ile 7 ayı birbirine karıştırma."
    hesap_adimlari:
      - "Aylık faiz = 1.080.000 / 12 = 90.000 TL"
      - "Aktifleştirilecek ay sayısı = 12 - 5 = 7"
      - "Aktifleştirilecek tutar = 7 x 90.000 = 630.000 TL"
    celdiriciler:
      A: "90.000 TL, yalnızca bir aylık faizdir; çalışmanın sürdüğü ay sayısı 7'dir."
      B: "450.000 TL, ara verilen 5 aya ait faizdir; bu tutar aktifleştirilmez, gider yazılır."
      D: "720.000 TL, 8 aylık faizdir; çalışmanın sürdüğü ay sayısı 7'dir."
      E: "1.080.000 TL, ara verilen dönem de aktifleştirilerek bulunur; paragraf 21 bunu yasaklar."
  kaynaklar:
  - mevzuat: TMS 23 Borçlanma Maliyetleri
    madde: paragraf 21
    alinti: "Borçlanma maliyetleri, bir varlığın, amaçlanan kullanıma veya satışa hazır duruma getirilmesi için gerekli işlemlerin yapılmasına uzun süreli ara verildiği bir dönemde oluşabilir. Bu tür maliyetler kısmen tamamlanmış varlıkların elde tutulmasından kaynaklanan maliyetler olup, aktifleştirilmeleri mümkün değildir."
  gecerlilik: {baslangic: '2019-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama: {python: "sonuc = 1080000 / 12 * (12 - 5)"}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

