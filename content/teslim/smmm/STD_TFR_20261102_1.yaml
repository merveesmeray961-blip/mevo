- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TMS 16
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletme 480.000 TL maliyetli ve kalıntı değeri bulunmayan makinesini 8 yıl yararlı ömürle doğrusal amortisman yöntemiyle amortismana tabi tutmaktadır. İki yıl amortisman ayrıldıktan sonra yararlı ömür toplam 10 yıl olarak yeniden tahmin edilmiş, yöntem değişmemiştir. TMS 16 Maddi Duran Varlıklar Standardına göre üçüncü yıl için ayrılacak amortisman kaç TL'dir?"
  secenekler:
    A: "3.750 TL"
    B: "36.000 TL"
    C: "45.000 TL"
    D: "60.000 TL"
    E: "360.000 TL"
  dogru: C
  aciklama:
    dogru_neden: "TMS 16 paragraf 51 uyarınca yararlı ömürdeki değişiklik muhasebe tahmini değişikliğidir ve ileriye yönelik uygulanır. İki yıl sonunda birikmiş amortisman 2 x 60.000 = 120.000 TL, defter değeri 360.000 TL'dir. Toplam ömür 10 yıl olduğundan kalan ömür 10 - 2 = 8 yıldır; 360.000 / 8 = 45.000 TL. Püf noktaları: 10 yıl toplam ömürdür, kalan ömür 8 yıldır; yeni tahmin geçmiş yıllara dokunmaz, yalnızca kalan defter değerine uygulanır. Yıllık tutarı aylığa çevirmek de gerekmez."
    hesap_adimlari:
      - "Eski yıllık amortisman = 480.000 / 8 = 60.000 TL"
      - "2 yıl sonunda defter değeri = 480.000 - 2 x 60.000 = 360.000 TL"
      - "Kalan yararlı ömür = 10 - 2 = 8 yıl"
      - "Yeni yıllık amortisman = 360.000 / 8 = 45.000 TL"
    celdiriciler:
      A: "3.750 TL aylık tutardır (45.000 / 12); soruda yıllık amortisman sorulmaktadır."
      B: "36.000 TL, defter değerinin toplam ömür olan 10 yıla bölünmesiyle bulunur; kalan ömür 8 yıldır."
      D: "60.000 TL, eski tahmine göre hesaplanan yıllık tutardır; tahmin değişikliği ileriye yönelik uygulanmıştır."
      E: "360.000 TL, makinenin iki yıl sonundaki defter değeridir; yıllık amortisman tutarı değildir."
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: paragraf 51
    alinti: "Bir varlığın kalıntı değeri ve yararlı ömrü en azından her hesap dönemi sonunda gözden geçirilerek, beklentilerin önceki tahminlerden farklı olması durumunda, değişiklik(ler) TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerindeki Değişikler ve Hatalar uyrınca muhasebe tahmininde değişiklik olarak muhasebeleştirilir."
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: paragraf 50
    alinti: "Bir varlığın amortismana tabi tutarı yararlı ömrü boyunca sistematik olarak dağıtılır."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama: {python: "yillik = 480000 / 8\ndefter = 480000 - 2 * yillik\nsonuc = defter / (10 - 2)"}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

