  kok: Bir işletmenin iki ayrı nakit yaratan birimine dağıtılmış şerefiye bulunmaktadır. TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre bu şerefiyelerin değer düşüklüğü testi bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Testler yalnızca iki birimde de aynı takvim gününde yapılabilir; farklı gün seçilemez.
    B: Testler yalnızca bir değer düşüklüğü belirtisi bulunduğunda ve ilgili dönemde yapılır.
    C: Birimler farklı zamanlarda test edilebilir; her birimin testi her yıl aynı zamanda yapılır.
    D: Testler, şerefiyenin edinildiği tarihten sonra yalnızca her beş yılda bir yapılmak zorundadır.
    E: Testler yalnızca nakit yaratan birimin elden çıkarılması aşamasında yapılır.
  dogru: C
  aciklama:
    dogru_neden: TMS 36 uyarınca şerefiyenin değer düşüklüğü testi her yıl aynı zamanda yapılmak koşuluyla bir yıllık dönemin herhangi bir zamanında yapılabilir; farklı nakit yaratan birimler farklı zamanlarda teste tabi tutulabilir.
    celdiriciler:
      A: Standart farklı birimlerin farklı zamanlarda test edilmesine açıkça izin verir.
      B: Şerefiye için test yıllıktır; belirti bulunması beklenmez.
      D: Testin sıklığı yıllıktır; beş yıllık bir aralık öngörülmemiştir.
      E: Test elden çıkarmaya bağlı değildir; her yıl yapılır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 90
    alinti: her yıl aynı zamanda olmak koşuluyla, bir yıllık dönemin herhangi bir zamanında yapılabilir. Farklı nakit yaratan birimler, farklı zamanlarda değer düşüklüğü testine tabi tutulabilir.
