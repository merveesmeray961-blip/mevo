  kok: Bir nakit yaratan birimin defter değerleri şerefiye 60.000 TL, makine 240.000 TL ve bina 360.000 TL olup birimin geri kazanılabilir tutarı 540.000 TL'dir. Birimin toplam defter değeri 660.000 TL'dir ve işletmenin diğer birimleri de bulunmaktadır. TMS 36 Varlıklarda Değer Düşüklüğü Standardına göre 120.000 TL tutarındaki değer düşüklüğü zararı birimdeki varlıklara nasıl dağıtılır?
  secenekler:
    A: Önce bütün varlıklara defter değerleri oranında pay verilir, artan tutar şerefiyeden düşülür.
    B: Zarar, birimdeki varlıklara eşit tutarlarda dağıtılarak şerefiye de pay alır.
    C: Önce bina ve makine azaltılır, kalan zarar şerefiyeden düşülerek dağıtılır.
    D: Önce şerefiye azaltılır; kalan zarar diğer varlıklara defter değerleri oranında dağıtılır.
    E: Zarar yalnızca şerefiyeye dağıtılır; kalan tutar muhasebeleştirilmez.
  dogru: D
  aciklama:
    dogru_neden: 'TMS 36 paragraf 104 uyarınca birimdeki değer düşüklüğü zararı, öncelikle birime dağıtılmış şerefiyenin defter değerini azaltacak şekilde, sonrasında birimin diğer varlıklarına her bir varlığın defter değeri oranında dağıtılır. Burada şerefiyeye 60.000 TL, kalan 60.000 TL makine ve binaya 240:360 oranında (24.000 TL ve 36.000 TL) dağıtılır. Püf noktaları: Sıra önemlidir; şerefiye her zaman ilk azaltılan kalemdir. Birimin toplam defter değeri ve diğer birimlerin varlığı sonucu değiştirmez.'
    celdiriciler:
      A: Sıra tersine çevrilmiştir; şerefiye önce azaltılır, diğer varlıklar sonra azaltılır.
      B: Eşit tutarlarda dağıtım öngörülmemiştir; dağıtım defter değeri oranındadır.
      C: Önce azaltılan kalem şerefiyedir; bina ve makine sonra gelir.
      E: Zararın tamamı şerefiyeye yazılamaz; şerefiye tükendikten sonra kalan tutar diğer varlıklara dağıtılır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: paragraf 104
    alinti: 'Değer düşüklüğü zararı, ilgili birimin (birim grubunun) varlıklarının defter değerini azaltmak için aşağıdaki sıraya göre dağıtılır: (a) Öncelikle, nakit yaratan birime (birim grubuna) dağıtılmış olan şerefiyenin defter değerini azaltacak şekilde ve (b) Sonrasında, ilgili birimin (birim grubunun) diğer varlıklarına birimdeki (birim grubundaki) her bir varlığın defter değeri oranında.'
