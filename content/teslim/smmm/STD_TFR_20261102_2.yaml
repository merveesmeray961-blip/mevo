  kok: Bir işletme, TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardı uyarınca bir muhasebe politikası değişikliğini geriye dönük olarak uygulamaktadır. Finansal tablolarda sunulan en erken döneme ait özkaynak kalemlerinin açılış bakiyeleri bakımından aşağıdakilerden hangisi uygulanır?
  secenekler:
    A: Açılış bakiyeleri değiştirilmez; fark cari dönem kâr veya zararına yansıtılır.
    B: Yeni politika baştan beri uygulanıyormuş gibi açılış bakiyeleri düzeltilir.
    C: Yalnızca cari dönem açılış bakiyesi düzeltilir, karşılaştırmalı tutarlara dokunulmaz.
    D: Düzeltme yalnızca dipnotlarda açıklanır, bakiyelerde değişiklik yapılmaz.
    E: Düzeltme yalnızca yeni politikanın uygulanmaya başlandığı tarihten itibaren yapılır.
  dogru: B
  aciklama:
    dogru_neden: TMS 8 paragraf 22 uyarınca politika değişikliği geriye dönük uygulandığında, değişiklikten etkilenen her özkaynak kaleminin sunulan en erken döneme ait açılış bakiyesi ve sunulan her geçmiş dönemdeki diğer karşılaştırmalı tutarlar, yeni politika baştan beri uygulanıyormuş gibi düzeltilir.
    celdiriciler:
      A: Geriye dönük uygulamada fark cari dönem kâr veya zararına yazılmaz; açılış bakiyeleri düzeltilir.
      C: Karşılaştırmalı tutarlar da yeni politika baştan beri uygulanıyormuş gibi düzeltilir.
      D: Düzeltme yalnızca açıklamayla yetinilmez; tutarlar düzeltilir.
      E: İleriye yönelik uygulamanın tanımıdır; geriye dönük uygulamada politika baştan beri uygulanmış sayılır.
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 22
    alinti: muhasebe politikasındaki bir değişiklik 19’uncu paragrafın (a) veya (b) bentleri uyarınca geriye dönük olarak uygulandığında, değişiklikten etkilenen her bir özkaynak kaleminin sunulan en erken döneme ait açılış bakiyesi ve sunulan her bir geçmiş dönemde açıklanan diğer karşılaştırmalı tutarlar, yeni muhasebe politikası baştan beri uygulanıyormuş gibi düzeltilir.
