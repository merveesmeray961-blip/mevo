      B: Aktifleştirme yalnızca tamamlanan A binası için biter; B ve C için devam eder.
      C: Tamamlanan parça için aktifleştirme devam etmez; sona erer.
      E: Özellikli varlığın parçalar halinde tamamlanması aktifleştirmeyi engellemez; paragraf 24 parça bazında düzenleme yapar.
