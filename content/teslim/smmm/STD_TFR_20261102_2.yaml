  secenekler:
    A: Kalemin satın alınmış, bedelinin ödenmiş ve gerekli belgelerinin alınmış olması
    B: Kalemin yasal olarak işletme adına tescil edilmiş ve sigorta kapsamına alınmış olması
    C: Kalemin yıllık amortisman tutarının önceden belirlenebilmesi ve vergi mevzuatına uygunluğu
    D: Kalemin gerçeğe uygun değerinin ve kalıntı değerinin güvenilir biçimde belirlenmiş olması
    E: Ekonomik yararların işletmeye akışının muhtemel olması ve maliyetin güvenilir ölçülmesi
  dogru: E
  aciklama:
    dogru_neden: TMS 16 paragraf 7 uyarınca maddi duran varlık kaleminin maliyeti, sadece gelecekteki ekonomik yararların işletmeye aktarılmasının muhtemel olması ve maliyetin güvenilir bir şekilde ölçülebilmesi koşullarının oluşması durumunda varlık olarak finansal tablolara yansıtılır.
    celdiriciler:
      A: Bedelin ödenmiş olması bir muhasebeleştirme koşulu değildir; ölçüt ekonomik yarar ve güvenilir ölçümdür.
      B: Tescil ve sigorta paragraf 7'de koşul olarak sayılmaz.
      C: Amortisman tutarının önceden belirlenmesi veya vergi uygunluğu paragraf 7'nin koşulları arasında yoktur.
      D: Gerçeğe uygun değer ve kalıntı değer muhasebeleştirme koşulu değildir; koşul maliyetin güvenilir ölçülmesidir.
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: paragraf 7
    alinti: 'Bir maddi duran varlık kaleminin maliyeti, sadece aşağıdaki koşulların oluşması durumunda varlık olarak finansal tablolara yansıtılır: (a) Bu kalemle ilgili gelecekteki ekonomik yararların işletmeye aktarılmasının muhtemel olması ve (b) İlgili kalemin maliyetinin güvenilir bir şekilde ölçülebilmesi.'
