  kok: Bir işletme, ticari alacaklarına ilişkin beklenen kredi zararı karşılığını hesaplarken kullandığı ölçüm tekniğini değiştirmiştir. Bu değişiklik önceki dönem hatalarının düzeltilmesinden kaynaklanmamakta, işletmenin muhasebe politikasında da bir değişiklik bulunmamaktadır. TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar Standardına göre bu değişiklik nasıl değerlendirilir?
  secenekler:
    A: Muhasebe tahmini değişikliği sayılır ve etkisi ileriye yönelik yansıtılır.
    B: Muhasebe politikası değişikliği sayılır ve geriye dönük uygulanır.
    C: Önceki dönem hatası sayılır; karşılaştırmalı tutarlar geriye dönük yeniden düzenlenir.
    D: Muhasebe tahmini değişikliği sayılır; ancak etkisi geriye dönük yansıtılır.
    E: Önceki dönem hatası sayılır; fark cari dönem kâr veya zararına yansıtılır.
  dogru: A
  aciklama:
    dogru_neden: 'TMS 8 paragraf 34A uyarınca bir girdi ya da ölçüm tekniğindeki değişikliğin etkileri, önceki dönem hatalarının düzeltilmesinden kaynaklanmadıkça muhasebe tahminlerindeki değişiklik olarak ele alınır. Paragraf 38 uyarınca tahmin değişikliğinin etkisi ileriye yönelik yansıtılır. Püf noktaları: Teknik değişikliği ile politika değişikliğini karıştırma; politika (ilke, esas, kural) değişmediği için burada tahmin söz konusudur. Hata olmadığı soruda açıkça verilmiştir, dolayısıyla geriye dönük düzeltme yapılmaz.'
    celdiriciler:
      B: Politika değişmemiştir; yalnızca ölçüm tekniği değişmiştir ve bu tahmin değişikliği sayılır.
      C: Soruda değişikliğin hata düzeltmesinden kaynaklanmadığı belirtilmiştir.
      D: Tahmin değişikliği geçmiş dönemlerle ilgili değildir; geriye dönük uygulama yapılmaz.
      E: Hata söz konusu olmadığından bu çözüm uygulanmaz; tahmin değişikliği ileriye yönelik yansıtılır.
  kaynaklar:
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 34A
    alinti: Bir girdi ya da ölçüm tekniğindeki değişikliğin muhasebe tahmini üzerindeki etkileri de -önceki dönem hatalarının düzeltilmesinden kaynaklanmadıkça- muhasebe tahminlerindeki değişiklik olarak ele alınır.
  - mevzuat: TMS 8 Muhasebe Politikaları, Muhasebe Tahminlerinde Değişiklikler ve Hatalar
    madde: paragraf 38
    alinti: Muhasebe tahminindeki bir değişiklik yalnızca cari dönemin kâr veya zararını etkileyebileceği gibi, hem cari dönemin hem de gelecek dönemlerin kâr veya zararını etkileyebilir.
