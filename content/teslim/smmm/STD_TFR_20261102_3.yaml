- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 15
  tip: kavrama
  zorluk: 2
  soru_bicimi: standart
  kok: "TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardına göre işletme, sözleşmenin başlangıcında mal devri ile müşterinin ödeme tarihi arasındaki sürenin bir yıl veya daha az olacağını öngörmektedir. Bu durumda taahhüt edilen bedel bakımından aşağıdakilerden hangisi uygulanabilir?"
  secenekler:
    A: "Önemli finansman bileşeni için düzeltme yapmak zorunda değildir."
    B: "Bedeli paranın zaman değerini yansıtacak biçimde mutlaka iskonto etmelidir."
    C: "Hasılatı ödeme tarihine kadar finansal tablolara alamaz."
    D: "Bedeli yalnızca dönem sonunda yeniden ölçmek zorundadır."
    E: "Düzeltme tutarını doğrudan özkaynaklara yansıtmalıdır."
  dogru: A
  aciklama:
    dogru_neden: "TFRS 15 paragraf 63 uyarınca kolaylaştırıcı bir uygulama olarak işletme, devir tarihi ile ödeme tarihi arasındaki sürenin bir yıl veya daha az olacağını öngörüyorsa, taahhüt edilen bedelde önemli bir finansman bileşeninin etkisi için düzeltme yapmak zorunda değildir."
    celdiriciler:
      B: "Bir yıl veya daha kısa sürelerde iskonto zorunlu değildir; paragraf 63 bunu kolaylaştırıcı uygulama olarak sunar."
      C: "Hasılatın alınması edim yükümlülüğünün yerine getirilmesine bağlıdır, ödeme tarihine değil."
      D: "Standart böyle bir dönem sonu yeniden ölçüm yükümlülüğü getirmez."
      E: "Önemli finansman bileşeni düzeltmesi özkaynağa değil, ilgili hasılat ve finansman unsurlarına yansır."
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: paragraf 63
    alinti: "Kolaylaştırıcı bir uygulama olarak işletme, sözleşmenin başlangıcında, müşteriye taahhüt ettiği mal veya hizmetin devir tarihi ile müşterinin bu mal veya hizmetin bedelini ödediği tarih arasında geçen sürenin bir yıl veya daha az olacağını öngörmesi durumunda, taahhüt edilen bedelde önemli bir finansman bileşeninin etkisi için düzeltme yapmak zorunda değildir."
  gecerlilik: {baslangic: '2018-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 15
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "Bir müşteri, işletmeden aldığı hizmetin karşılığında nakit yerine kendi ürettiği malları vermeyi taahhüt etmiştir. TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardına göre işlem bedelini belirlemek için bu gayri nakdî bedel nasıl ölçülür?"
  secenekler:
    A: "Müşterinin kayıtlarındaki defter değeri üzerinden ölçülerek işlem bedeline dâhil edilir."
    B: "Gerçeğe uygun değeri üzerinden ölçülerek işlem bedeline dâhil edilir."
    C: "İşletmenin benzer malları edinme maliyeti üzerinden ölçülerek işlem bedeline dâhil edilir."
    D: "Vergi mevzuatına göre takdir edilen değer üzerinden ölçülerek işlem bedeline dâhil edilir."
    E: "Ölçülemediğinden işlem bedeline hiçbir şekilde dâhil edilmez."
  dogru: B
  aciklama:
    dogru_neden: "TFRS 15 paragraf 66 uyarınca müşterinin gayri nakdi bedel ödeme taahhüdünün bulunduğu sözleşmelerde işlem bedelini belirlemek için işletme, gayri nakdî bedeli gerçeğe uygun değeri üzerinden ölçer."
    celdiriciler:
      A: "Defter değeri ölçüt değildir; gerçeğe uygun değer esas alınır."
      C: "Edinme maliyeti ölçüt değildir; paragraf 66 gerçeğe uygun değeri esas alır."
      D: "Vergi mevzuatındaki takdir edilen değer ölçüt değildir."
      E: "Gayri nakdî bedel işlem bedeline dâhil edilir; ölçüm gerçeğe uygun değerle yapılır."
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: paragraf 66
    alinti: "Müşterinin gayri nakdi bedel ödeme taahhüdünün bulunduğu sözleşmelerle ilgili işlem bedelini belirlemek için, işletme, gayri nakdî bedeli (veya gayri nakdî bedel taahhüdünü) gerçeğe uygun değeri üzerinden ölçer."
  gecerlilik: {baslangic: '2018-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 15
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: "TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardına göre aşağıdakilerden hangisi sözleşme yapılması için katlanılan ek maliyet niteliğindedir?"
  secenekler:
    A: "Sözleşme görüşmeleri için yapılan, sözleşme imzalanmasa da katlanılacak seyahat giderleri"
    B: "Satış yöneticisine sözleşmeden bağımsız olarak ödenen sabit aylık maaş"
    C: "Sözleşmenin imzalanması hâlinde satış temsilcisine ödenen satış komisyonu"
    D: "Teklif hazırlamak için sözleşme yapılsın yapılmasın ödenen mühendislik giderleri"
    E: "Müşteri adayı bulmak için yapılan genel reklam harcamaları"
  dogru: C
  aciklama:
    dogru_neden: "TFRS 15 paragraf 92 uyarınca sözleşme yapılması için katlanılan ek maliyetler, işletmenin bir müşteriyle sözleşme yapması halinde katlanacağı, sözleşme yapmamış olsaydı katlanmayacağı maliyetlerdir; örneğin satış komisyonları."
    celdiriciler:
      A: "Seyahat gideri sözleşme imzalanmasa da katlanılacağından ek maliyet değildir."
      B: "Sabit maaş sözleşme yapılıp yapılmamasından bağımsızdır; ek maliyet sayılmaz."
      D: "Sözleşme yapılsın yapılmasın katlanılan maliyet, ek maliyet tanımına girmez."
      E: "Genel reklam harcaması belirli bir sözleşme yapılması halinde ortaya çıkan bir maliyet değildir."
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: paragraf 92
    alinti: "Sözleşme yapılması için katlanılan ek maliyetler, işletmenin bir müşteriyle sözleşme yapması halinde katlanacağı, sözleşme yapmamış olsaydı katlanmayacağı maliyetlerdir (örneğin satış komisyonları)."
  gecerlilik: {baslangic: '2018-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: TFRS 15
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletme, 12 aylık bir bakım hizmeti sözleşmesinin bedelini başlangıçta peşin olarak tahsil etmiştir. Müşteri, işletme hizmeti yerine getirdikçe faydayı aynı anda alıp tüketmektedir. Hesap döneminin sonunda hizmetin yalnızca bir kısmı sunulmuştur. TFRS 15 Müşteri Sözleşmelerinden Hasılat Standardına göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Bedelin tamamı tahsil edildiği anda hasılat olarak alınır ve ertelenmiş hiçbir tutar kalmaz."
    B: "Bedel, hizmet dönemi sonunda tamamlandığında toplu hasılat olarak alınır; önceki tahsilat avans sayılır."
    C: "Bedel her ay eşit tutarda hasılat yazılır; hizmetin ne ölçüde devredildiği dikkate alınmaz."
    D: "Hizmet sunuldukça zamana yayılı hasılat alınır; karşılığı verilmemiş bedel sözleşme yükümlülüğüdür."
    E: "Hasılat yıl sonundaki envanter sonucuna göre toplu biçimde finansal tablolara alınır."
  dogru: D
  aciklama:
    dogru_neden: "TFRS 15 paragraf 35 uyarınca müşterinin edim yerine getirildikçe faydayı aynı anda alıp tüketmesi hâlinde edim yükümlülüğü zamana yayılı olarak yerine getirilir ve hasılat zamana yayılı alınır. Tahsil edilmiş ancak karşılığında henüz hizmet verilmemiş bedel, sözleşme yükümlülüğü niteliğindedir. Püf noktaları: Peşin tahsilat hasılat için yeterli değildir; ölçüt hizmetin devridir. Tahsilatın tek seferde olması hasılatın tek seferde alınacağı anlamına gelmez."
    celdiriciler:
      A: "Tahsilat tek başına hasılat doğurmaz; hizmet sunuldukça hasılat alınır."
      B: "Fayda aynı anda alınıp tüketildiği için hasılat sözleşme sonunda değil zamana yayılı alınır."
      C: "Hasılat sunulan hizmetin devrini yansıtır; devre bakılmaksızın eşit tutar yazılması standarda aykırıdır."
      E: "Envanter sonucu hasılatın alınma zamanını belirlemez."
  kaynaklar:
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: paragraf 35
    alinti: "Aşağıdaki şartlardan birinin karşılanması durumunda, işletme bir mal veya hizmetin kontrolünü zamana yayılı olarak devreder ve dolayısıyla bir edim yükümlülüğünü zamana yayılı olarak yerine getirir ve hasılatı zamana yayılı olarak finansal tablolarına alır: (a) İşletme edimi yerine getirdikçe, müşterinin edimin sağladığı faydayı aynı anda alıp tüketmesi"
  - mevzuat: TFRS 15 Müşteri Sözleşmelerinden Hasılat
    madde: paragraf 106
    alinti: "Sözleşme yükümlülüğü, işletmenin müşteriden tahsil ettiği (veya tahsil etmeye hak kazandığı) bedel karşılığında mal veya hizmetleri müşterisine devretme yükümlülüğüdür."
  gecerlilik: {baslangic: '2018-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS]
  ders: STD
  unite: TMS/TFRS ve Kavramsal Çerçeve
  konu: TFR
  kazanim: diğer TMS/TFRS kapsam ve ölçüm
  tip: bilgi
  zorluk: 1
  soru_bicimi: standart
  kok: "TMS 7 Nakit Akış Tabloları Standardına göre esas faaliyetlerden kaynaklanan nakit akışları hangi yöntem veya yöntemlerle raporlanır?"
  secenekler:
    A: "Yalnızca doğrudan yöntemle, dolaylı yöntem yasaktır"
    B: "Yalnızca dolaylı yöntemle, doğrudan yöntem kullanılamaz"
    C: "Yalnızca nakit akışı oranı yöntemiyle"
    D: "Yalnızca gelir tablosu yöntemiyle, nakit tahsilatlar hesaplanmadan"
    E: "Doğrudan yöntem veya dolaylı yöntemlerden biri kullanılarak"
  dogru: E
  aciklama:
    dogru_neden: "TMS 7 paragraf 18 uyarınca esas faaliyetlerden kaynaklanan nakit akışları, doğrudan yöntem ve dolaylı yöntemden biri kullanılarak raporlanır."
    celdiriciler:
      A: "Dolaylı yöntem de kullanılabilir; yöntemlerden biri seçilir."
      B: "Doğrudan yöntem de kullanılabilir; yöntemlerden biri seçilir."
      C: "Nakit akışı oranı yöntemi Standartta yöntem olarak sayılmamıştır."
      D: "Gelir tablosu yöntemi Standartta yer almaz; yöntemler doğrudan ve dolaylıdır."
  kaynaklar:
  - mevzuat: TMS 7 Nakit Akış Tabloları
    madde: paragraf 18
    alinti: "Esas faaliyetlerden kaynaklanan nakit akışları aşağıdaki yöntemlerden biri kullanılarak raporlanır: (a) Doğrudan yöntem. Bu yöntemde gayrisafi nakit tahsilatlar ve gayrisafi nakit ödemeler ana gruplar itibarıyla açıklanır. (b) Dolaylı yöntem."
  gecerlilik: {baslangic: '2006-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
