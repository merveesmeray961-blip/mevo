    celdiriciler:
      A: "Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır."
      C: "Yüzde artış cari dönem tutarına uygulanmıştır; yüzde artış önceki dönem tutarı üzerinden hesaplanmıştır."
      D: "Bu tutar önceki dönemin tutarıdır; mutlak değişim değildir."
      E: "Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır."
