  secenekler:
    A: "Kalem grup toplamının %20'sinin altında kaldığından ayrı gösterilmez."
    B: "Kalem %28,6 olduğundan ayrı gösterilir."
    C: "Ayrı gösterim için kalemin duran varlıkların yarısını aşması gerekir."
    D: "Kalem, maddi olmayan duran varlıklarla mahsup edilerek gösterilir."
    E: "Kalem %22,2 olduğundan ayrı başlık altında gösterilir."
