      D: "Çarpanların oranı ters kurulmuştur; pay maliyet çarpanı, payda satış çarpanı olmalıdır."
      E: "Maliyet yüzdesi yalnızca maliyet artış oranıyla büyütülmüştür; satışlardaki artış paydayı da büyütür."
    hesap_adimlari:
