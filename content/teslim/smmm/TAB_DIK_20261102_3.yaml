- id: "TASLAK"
  sinav: "smmm"
  bolum:
  - "SGS"
  - "YET"
  ders: "TAB"
  unite: "Dikey, yatay ve trend analizi"
  konu: "DIK"
  kazanim: "karşılaştırmalı (yatay) analiz"
  tip: "hesaplama"
  zorluk: 3
  soru_bicimi: "standart"
  kok: |-
    Bankaya sunulacak dosya için yapılan incelemede elde edilen sonuçlar aşağıda özetlenmiştir. Aşağıda Çınar Mobilya A.Ş.'nin net satışları ile brüt satış kârı dikey yüzdeleri verilmiştir.

    | Kalem | 2025 | 2026 |
    |---|---:|---:|
    | Net satışlar (₺) | 4.000.000 | 5.200.000 |
    | Brüt satış kârının dikey yüzdesi | %28 | %35 |

    Yatay analiz yapıldığında brüt satış kârındaki yüzde artış aşağıdakilerden hangisidir?
  secenekler:
    A: "%7"
    B: "%30"
    C: "%37"
    D: "%62,5"
    E: "%162,5"
  dogru: "D"
  aciklama:
    dogru_neden: "Brüt satış kârı 2025'te 1.120.000 ₺, 2026'da 1.820.000 ₺'dir. Yatay analizde değişim önceki dönem bazlıdır: (1.820.000 - 1.120.000) / 1.120.000 × 100 = %62,5. Püf noktaları: Dikey yüzdeyi önce TL'ye çevir; sonra iki yılın kâr tutarlarını yatay analizle karşılaştır. Satış artışı ya da marj farkı tek başına kâr artışını vermez."
    celdiriciler:
      A: "Dikey yüzdeler arasındaki puan farkı alınmıştır; brüt kârın TL cinsinden yüzde artışı sorulmaktadır."
      B: "Bu oran net satışlardaki artıştır; brüt satış kârı yüzdesindeki değişim de etkili olduğundan kâr artışı farklıdır."
      C: "Satış artışı ile marj farkı toplanmıştır; kâr tutarları bulunup oranlanmalıdır."
      E: "Cari kâr önceki kâra oranlanmış, 100 çıkarılmamıştır; bu değer artış yüzdesi değil, oranın kendisidir."
    hesap_adimlari:
    - "2025 brüt satış kârı = 4.000.000 × %28 = 1.120.000 ₺"
    - "2026 brüt satış kârı = 5.200.000 × %35 = 1.820.000 ₺"
    - "Yüzde değişim = (1.820.000 - 1.120.000) / 1.120.000 × 100 = %62,5"
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4"
    madde: "Gelir tablosu kalemleri (C)"
    alinti: "NET SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-) 3. SATILAN HİZMET MALİYETİ (-) 4. DİĞER SATIŞLARIN MALİYETİ (-) BRÜT SATIŞ KÂRI VEYA ZARARI"
  gecerlilik:
    baslangic: "1994-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: "taslak"
  surum: 1
  uretim:
    kaynak_turu: "yapay_zeka"
    model: "claude-sonnet-5-5"
  dogrulama:
    python: |-
      n0 = 4000000
      n1 = 5200000
      k0 = n0 * 28 / 100
      k1 = n1 * 35 / 100
      sonuc = (k1 - k0) / k0 * 100
- id: "TASLAK"
