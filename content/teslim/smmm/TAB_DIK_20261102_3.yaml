  kazanim: "karşılaştırmalı (yatay) analiz"
  tip: "hesaplama"
  zorluk: 2
  soru_bicimi: "standart"
  kok: "Karşılaştırmalı analizde Çınar Mobilya A.Ş.'nin banka kredilerinin cari dönem tutarı 240.000 ₺, önceki yıla göre yüzde artışı ise %25 olarak hesaplanmıştır. Bu kalemin TL cinsinden mutlak artışı aşağıdakilerden hangisidir?"
  secenekler:
    A: "4.800 ₺"
    B: "48.000 ₺"
    C: "180.000 ₺"
    D: "480.000 ₺"
    E: "960.000 ₺"
  dogru: "B"
  aciklama:
    dogru_neden: "Yüzde artış önceki dönem tutarı üzerinden hesaplandığından önceki dönem = 240.000 / 1,25 = 192.000 ₺'dir. Mutlak değişim 240.000 - 192.000 = 48.000 ₺ olur."
    celdiriciler:
      A: "Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır."
      C: "Cari tutardan yüzde düşülerek bir tutar bulunmuştur; bu ne önceki dönemi ne de değişimi verir."
      D: "Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır."
      E: "Cari tutar yüzdeye bölünmüştür; mutlak değişim bu şekilde bulunmaz."
    hesap_adimlari:
    - "Önceki dönem = 240.000 / 1,25 = 192.000 ₺"
    - "Mutlak değişim = 240.000 - 192.000 = 48.000 ₺"
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 2"
    madde: "II-6"
    alinti: "Mali tablolar, dönemler itibariyle karşılaştırılabilir nitelikte olmalıdır."
  gecerlilik:
    baslangic: "1994-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: "taslak"
  surum: 1
  uretim:
    kaynak_turu: "yapay_zeka"
    model: "claude-sonnet-5-5"
  dogrulama:
    python: |-
      cari = 240000
      yuzde = 25
      onceki = cari * 100 / (100 + yuzde)
      sonuc = cari - onceki
