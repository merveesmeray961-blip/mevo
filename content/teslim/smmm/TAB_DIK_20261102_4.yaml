  tip: "hesaplama"
  zorluk: 2
  soru_bicimi: "standart"
  kok: |-
    Aşağıda Mercan Turizm A.Ş. için derlenen gelir tablosu özeti verilmiştir.

    | Kalem | 2026 (₺) |
    |---|---:|
    | Brüt satışlar | 4.400.000 |
    | Satış indirimleri (-) | 400.000 |
    | Satışların maliyeti (-) | 2.400.000 |

    Bu özete göre brüt satış kârının dikey (yüzde) oranı aşağıdakilerden hangisidir?
  secenekler:
    A: "%4"
    B: "%36,36"
    C: "%40"
    D: "%50"
    E: "%400"
  dogru: "C"
  aciklama:
    dogru_neden: "Net satışlar 4.000.000 ₺, brüt satış kârı 1.600.000 ₺'dir. Baz net satışlar olduğundan dikey yüzde 1.600.000 / 4.000.000 × 100 = %40 olur."
    celdiriciler:
      A: "Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır."
      B: "Brüt satış kârı brüt satışlara bölünmüştür; gelir tablosunda baz net satışlardır."
      D: "Brüt satışlardan maliyet düşülmüş, satış indirimleri dikkate alınmamıştır; kâr net satışlar üzerinden bulunmalıdır."
      E: "Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır."
    hesap_adimlari:
    - "Net satışlar = 4.400.000 - 400.000 = 4.000.000 ₺"
    - "Brüt satış kârı = 4.000.000 - 2.400.000 = 1.600.000 ₺"
    - "Dikey yüzde = 1.600.000 / 4.000.000 × 100 = %40"
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4"
    madde: "Gelir tablosu kalemleri (C)"
    alinti: "NET SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-) 3. SATILAN HİZMET MALİYETİ (-) 4. DİĞER SATIŞLARIN MALİYETİ (-) BRÜT SATIŞ KÂRI VEYA ZARARI"
  gecerlilik:
    baslangic: "1994-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: "taslak"
  surum: 1
  uretim:
    kaynak_turu: "yapay_zeka"
    model: "claude-sonnet-5-5"
  dogrulama:
    python: |-
      brut = 4400000
      indirim = 400000
      maliyet = 2400000
      net = brut - indirim
      sonuc = (net - maliyet) / net * 100
