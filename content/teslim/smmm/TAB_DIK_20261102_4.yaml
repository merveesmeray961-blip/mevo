- id: "TASLAK"
  sinav: "smmm"
  bolum:
  - "SGS"
  - "YET"
  ders: "TAB"
  unite: "Dikey, yatay ve trend analizi"
  konu: "DIK"
  kazanim: "karşılaştırmalı (yatay) analiz"
  tip: "hesaplama"
  zorluk: 3
  soru_bicimi: "standart"
  kok: |-
    Yıl sonu mali durum incelemesinde işletmeye ilişkin bulgular şöyledir. Vadi Süt Ürünleri A.Ş.'nin karşılaştırmalı bilanço verileri aşağıdadır.

    | Tutarlar (₺) | 2025 | 2026 |
    |---|---:|---:|
    | Maddi duran varlıklar | 800.000 | 920.000 |
    | Toplam aktif | 4.000.000 | 4.500.000 |

    Yatay analizde maddi duran varlıklar kalemindeki artışın, toplam aktifteki artışın yüzde kaçını oluşturduğu hesaplanmak istenmektedir. Sonuç kaçtır?
  secenekler:
    A: "%3"
    B: "%12,5"
    C: "%15"
    D: "%24"
    E: "%416,67"
  dogru: "D"
  aciklama:
    dogru_neden: "Kalem artışı 120.000 ₺, toplam aktif artışı 500.000 ₺'dir. Kalem artışının toplam artıştaki payı 120.000 / 500.000 × 100 = %24. Püf noktaları: İki mutlak değişimi ayrı ayrı bul ve birbirine oranla. Kalemin kendi yüzde artışı ya da toplam aktifin yüzde artışı sorulan oranlar değildir."
    celdiriciler:
      A: "Kalem artışı önceki dönem toplam aktifine oranlanmıştır; bu, kalemin toplam büyümeye katkısını yüzde puan olarak verir, toplam artış içindeki payı vermez."
      B: "Bu oran toplam aktifteki yüzde artıştır; kalemin payını göstermez."
      C: "Kalemin kendi yüzde artışı bulunmuştur; sorulan, kalem artışının toplam aktif artışı içindeki payıdır."
      E: "Oran ters kurulmuştur; toplam artış kalem artışına bölünmüştür."
    hesap_adimlari:
    - "Kalem artışı = 920.000 - 800.000 = 120.000 ₺"
    - "Toplam aktif artışı = 4.500.000 - 4.000.000 = 500.000 ₺"
    - "Pay = 120.000 / 500.000 × 100 = %24"
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4"
    madde: "Bilanço tanımı"
    alinti: "Bilanço, bir işletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağladığı kaynakları gösteren mali tablodur."
  gecerlilik:
    baslangic: "1994-01-01"
    bitis: null
    yila_bagli_tutar: false
  durum: "taslak"
  surum: 1
  uretim:
    kaynak_turu: "yapay_zeka"
    model: "claude-sonnet-5-5"
  dogrulama:
    python: |-
      a0 = 800000
      a1 = 920000
      t0 = 4000000
      t1 = 4500000
      sonuc = (a1 - a0) / (t1 - t0) * 100
- id: "TASLAK"
