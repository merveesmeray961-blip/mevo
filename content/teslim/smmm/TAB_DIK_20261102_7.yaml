    dogru_neden: "2025'te net satışlar 100 ise maliyet 70'dır. 2026'da net satışlar 125, maliyet 73,5 olur. Dikey yüzde = 73,5 / 125 × 100 = %58,8. Püf noktaları: Baz yıl net satışını 100 al; her iki kalemi kendi artış çarpanıyla büyüt, sonra yeni maliyeti yeni net satışa böl. Dikey yüzde tutar artışlarının değil, artış hızları arasındaki farkın sonucudur."
    celdiriciler:
      A: "Yüzdeler toplanıp çıkarılmıştır; artış oranları arasındaki farkın puan olarak eklenmesi doğru değildir."
      C: "Dikey yüzdenin değişmediği varsayılmıştır; maliyet ve satışlar farklı hızlarda arttığından yüzde değişir."
      D: "Maliyet yüzdesi yalnızca maliyet artış oranıyla büyütülmüştür; satışlardaki artış paydayı da büyütür."
      E: "Çarpanların oranı ters kurulmuştur; pay maliyet çarpanı, payda satış çarpanı olmalıdır."
    hesap_adimlari:
    - "Satış çarpanı = 1,25, maliyet çarpanı = 1,05"
    - "Yeni dikey yüzde = 70 × 1,05 / 1,25 = %58,8"
