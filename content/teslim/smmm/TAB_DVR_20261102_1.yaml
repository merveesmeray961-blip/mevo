  kok: Bir işletme alacak tahsil süresini 36 gün olarak hedeflemektedir. Ortalama ticari alacaklar 150.000 ₺ olarak planlandığına göre bu hedefle uyumlu net satışlar yıllık kaç ₺ olmalıdır? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 15.000 ₺
    B: 125.000 ₺
    C: 750.000 ₺
    D: 1.500.000 ₺
    E: 54.000.000 ₺
  dogru: D
  aciklama:
    dogru_neden: Alacak tahsil süresi = 360 × ortalama alacak / net satışlar. Buradan net satışlar = 150.000 × 360 / 36 = 1.500.000 ₺ bulunur. Eşdeğer biçimde hız 360/36 = 10 kez olduğundan satışlar 150.000 × 10 = 1.500.000 ₺'dir.
    celdiriciler:
      A: Formül ters çevrilmiş; net satışlar = ortalama alacak × 360 / süre olmalıdır.
      B: Yıllık yerine aylık ortalama satış bulunmuş; hedef süre yıllık satışlarla ilişkilidir.
      C: Süre gereksiz yere 2 ile çarpılmış.
      E: Ortalama alacak 360 ile çarpılmış ancak hedef süreye bölünmemiş.
    hesap_adimlari:
    - Gerekli hız = 360 / 36 = 10
    - Net satışlar = 150.000 × 10 = 1.500.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
