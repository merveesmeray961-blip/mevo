  konu: DVR
  kazanim: ilk madde devir hızı
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: Bir imalat işletmesinde ilk madde ve malzeme stoku dönem başında 70.000 ₺, dönem sonunda 90.000 ₺'dir. Dönem içinde 380.000 ₺'lik ilk madde ve malzeme satın alınmıştır. İlk madde ve malzeme devir hızı kaç kezdir? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 2,25 kez
    B: 4 kez
    C: 4,5 kez
    D: 4,75 kez
    E: 5,62 kez
  dogru: C
  aciklama:
    dogru_neden: Kullanılan ilk madde = dönem başı stok + alışlar − dönem sonu stok = 70.000+380.000−90.000 = 360.000 ₺. Ortalama stok 80.000 ₺ olduğundan devir hızı 360.000/80.000 = 4,5 kezdir. İlk madde devir hızında pay, üretime verilen ilk madde ve malzeme maliyetidir (150 İlk Madde ve Malzeme).
    celdiriciler:
      A: Dönem başı ve sonu stok toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama stok yerine yalnızca dönem sonu stoku kullanılmış.
      D: Pay olarak üretime verilen (kullanılan) ilk madde yerine yalnızca dönem içi alışlar alınmış.
      E: Dönem sonu stoku düşülmediği için kullanılan ilk madde fazla hesaplanmış.
    hesap_adimlari:
    - Kullanılan ilk madde = 70.000 + 380.000 − 90.000 = 360.000
    - Ortalama stok = (70.000 + 90.000) / 2 = 80.000
    - Devir hızı = 360.000 / 80.000 = 4,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 150 - İlk Madde ve Malzeme
    alinti: Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap grubu 15 - Stoklar
    alinti: Bu grup, işletmenin satmak, üretimde kullanmak veya tüketmek amacıyla edindiği, ilk madde ve malzeme, yarı mamul, mamul, ticari mal, yan ürün, artık ve hurda gibi bir yıldan az bir sürede kullanılacak olan veya bir yıl içerisinde nakde çevrilebileceği düşünülen varlıklardan oluşur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'a=70000; b=90000; alis=380000

      sonuc = round((a+alis-b)/((a+b)/2), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

