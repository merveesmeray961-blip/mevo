  kazanim: devir hızı ve süre ilişkisi
  tip: kavrama
  zorluk: 1
  soru_bicimi: standart
  kok: Bir işletmenin ticari mal devir hızı, satışların maliyetinin değişmediği bir dönemde ortalama stokun azaltılması nedeniyle artmıştır. Bu durumda ticari mal devir süresi için aşağıdakilerden hangisi söylenebilir?
  secenekler:
    A: Kısalır; çünkü devir süresi, dönem gün sayısının devir hızına bölünmesiyle bulunur.
    B: Uzar; çünkü hız arttıkça malların stokta bekleyeceği gün sayısı da artar.
    C: Değişmez; çünkü devir süresi yalnızca dönem gün sayısına bağlıdır.
    D: Yalnızca satışların maliyeti de artarsa kısalır; ortalama stok azalışı süreyi etkilemez.
    E: Önce kısalır, hız belirli bir düzeye çıkınca yeniden uzamaya başlar.
  dogru: A
  aciklama:
    dogru_neden: Devir süresi = gün sayısı / devir hızı olduğundan hız ile süre ters orantılıdır. Ortalama stokun azalması hızı artırır, süreyi kısaltır; bu durum stokların daha çabuk paraya dönüştüğünü gösterir.
    celdiriciler:
      B: Devir hızı ile süre ters orantılıdır; hız artınca süre uzamaz, kısalır.
      C: Süre, gün sayısının hıza bölünmesiyle bulunur; hız değişince süre de değişir.
      D: Ortalama stokun azalması devir hızını artırdığı için süre, satışların maliyeti sabitken de kısalır.
      E: Süre ile hız arasındaki ilişki doğrusal olmayan ama tek yönlü ters orantıdır; hız arttıkça süre sürekli kısalır.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 153 - Ticari Mallar
    alinti: Herhangi bir değişikliğe tabi tutulmadan satmak amacı ile işletmeye alınan ticari mallar (emtia) ve benzeri kalemler bu hesapta yer alır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

