  zorluk: 2
  soru_bicimi: standart
  kok: 'Bir imalat işletmesinin dönem verileri şöyledir: direkt ilk madde ve malzeme 200.000 ₺, direkt işçilik 90.000 ₺, genel üretim giderleri 50.000 ₺; yarı mamul stoku dönem başında 70.000 ₺, dönem sonunda 90.000 ₺. Yarı mamul devir süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.'
  secenekler:
    A: 4 gün
    B: 78,75 gün
    C: 90 gün
    D: 101,25 gün
    E: 180 gün
  dogru: C
  aciklama:
    dogru_neden: Dönemin üretim giderleri 340.000 ₺'dir. Tamamlanan üretim maliyeti = 70.000 + 340.000 − 90.000 = 320.000 ₺. Ortalama yarı mamul 80.000 ₺; devir hızı 4 kez; süre 90 gündür. 151 Yarı Mamuller hesabında tamamlananların maliyeti ilgili stok hesabına aktarılır.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için 360'ın hıza bölünmesi gerekir.
      B: Ortalama yarı mamul yerine yalnızca dönem başı stoku kullanılmış.
      D: Ortalama yarı mamul yerine yalnızca dönem sonu stoku kullanılmış.
      E: Dönem başı ve sonu yarı mamul toplamı ikiye bölünmeden payda yapılmış.
    hesap_adimlari:
    - Dönemin üretim giderleri = 200.000 + 90.000 + 50.000 = 340.000
    - Üretim maliyeti = 70.000 + 340.000 − 90.000 = 320.000
    - Ortalama yarı mamul = 80.000; hız = 4
    - Süre = 360 / 4 = 90 gün
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 151 - Yarı Mamuller-Üretim
    alinti: Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 151 - İşleyişi
    alinti: Üretimi tamamlananların maliyet tutarı bu hesabın alacağı karşılığında ilgili stok hesaplarına aktarılır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dim=200000; di=90000; gug=50000; yb=70000; ys=90000

      sonuc = round(360/((yb+dim+di+gug-ys)/((yb+ys)/2)), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

