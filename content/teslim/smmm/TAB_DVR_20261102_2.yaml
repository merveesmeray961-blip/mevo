  kok: Uzay Elektronik Ltd. Şti.'nin yıllık satışların maliyeti 720.000 ₺, net satışları 900.000 ₺'dir. Yalnızca dönem sonu bilançosu verilmiş olup bu bilançoda ticari borçlar (320 Satıcılar ve 321 Borç Senetleri toplamı) 75.000 ₺'dir. Dönem sonu tutarı esas alınarak borç ödeme süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 9,6 gün
    B: 18,75 gün
    C: 30 gün
    D: 37,5 gün
    E: 75 gün
  dogru: D
  aciklama:
    dogru_neden: Yalnız dönem sonu bakiyesi verildiğinde ortalama alınmaz. Borç devir hızı 720.000/75.000 = 9,6 kez; ödeme süresi 360×75.000/720.000 = 37,5 gündür. Ticari borçlarda pay satışların maliyetidir (320 Satıcılar, 321 Borç Senetleri).
    celdiriciler:
      A: Bulunan değer borç devir hızıdır (kez); süre değildir.
      B: Tek bakiye verildiği hâlde ortalama almak için ikiye bölünmüş.
      C: Pay olarak satışların maliyeti yerine net satışlar alınmış.
      E: Tek bakiye gereksiz yere iki katına çıkarılmış.
    hesap_adimlari:
    - Devir hızı = 720.000 / 75.000 = 9,6
    - Ödeme süresi = 360 × 75.000 / 720.000 = 37,5 gün
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 320 - Satıcılar
    alinti: İşletmenin faaliyet konusu ile ilgili her türlü mal ve hizmet alımlarından kaynaklanan senetsiz borçların izlendiği hesaptır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 321 - Borç Senetleri
    alinti: İşletmenin faaliyet konusu ile ilgili her türlü mal ve hizmet alımlarından kaynaklanan senede bağlanmış ticari borçlarının izlendiği hesaptır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'smm=720000; ns=900000; b=75000

      sonuc = round(360*b/smm, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

