- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: ilk madde devir süresi
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: Kaya Boya Sanayi A.Ş. yıl içinde 360.000 ₺ tutarında ilk madde ve malzemeyi üretime vermiştir. Bu malzemelerin stoku yıl başında 70.000 ₺, yıl sonunda 105.000 ₺ olduğuna göre ilk madde ve malzeme devir süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 4,11 gün
    B: 70 gün
    C: 78,75 gün
    D: 87,5 gün
    E: 105 gün
  dogru: D
  aciklama:
    dogru_neden: 150 İlk Madde ve Malzeme hesabı üretimde kullanılan malzemelerin izlendiği hesaptır; hızın payı üretime verilen ilk madde maliyetidir. Ortalama bakiye = (70.000+105.000)/2 = 87.500; devir hızı = 360.000/87.500 = 4,11 kez; devir süresi = 360/4,11 = 87,5 gündür.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için gün sayısının hıza bölünmesi gerekir.
      B: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
      C: Pay olarak üretime verilen ilk madde yerine dönem içi alışlar alınmış.
      E: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (70.000 + 105.000) / 2 = 87.500
    - Devir hızı = 360.000 / 87.500 = 4,11
    - Devir süresi = 360 / 4,11 = 87,5 gün
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 150 - İlk Madde ve Malzeme
    alinti: Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'f=360000; a=70000; b=105000; alis=400000

      sonuc = round((360/((f)/(((a)+(b))/2))), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

