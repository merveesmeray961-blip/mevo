  kazanim: mamul devir süresi
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Demirci Makine A.Ş.'nde mamul stoku yıl başında 100.000 ₺, yıl sonunda 140.000 ₺'dir. Yıl içinde tamamlanan mamul üretiminin maliyeti 520.000 ₺ olduğuna göre mamul devir süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 4 gün
    B: 75 gün
    C: 83,08 gün
    D: 90 gün
    E: 105 gün
  dogru: D
  aciklama:
    dogru_neden: Satılan mamul maliyeti = 100.000+520.000−140.000 = 480.000 ₺'dir (152 Mamuller). Ortalama bakiye = (100.000+140.000)/2 = 120.000; devir hızı = 480.000/120.000 = 4 kez; devir süresi = 360/4 = 90 gündür.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için gün sayısının hıza bölünmesi gerekir.
      B: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
      C: Pay olarak satılan mamul maliyeti yerine üretilen mamul maliyeti alınmış.
      E: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (100.000 + 140.000) / 2 = 120.000
    - Devir hızı = 480.000 / 120.000 = 4
    - Devir süresi = 360 / 4 = 90 gün
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 152 - Mamuller
    alinti: Üretim çalışmaları sonunda elde edilen ve satışa hazır hale gelmiş bulunan mamullerin izlendiği hesaptır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'm1=100000; m2=140000; um=520000

      sonuc = round((360/((m1+um-m2)/(((m1)+(m2))/2))), 2)'
  durum: taslak
  surum: 1
  uretim:
