  kok: Mavi Kuyumculuk Ltd. Şti.'nin net satışları 1.350.000 ₺, satışların maliyeti 1.000.000 ₺'dir. Ticari alacakları yıl başında 120.000 ₺, yıl sonunda 150.000 ₺ olan şirketin alacak devir hızı kaç kezdir?
  secenekler:
    A: 5 kez
    B: 7,41 kez
    C: 9 kez
    D: 10 kez
    E: 11,25 kez
  dogru: D
  aciklama:
    dogru_neden: Alacak devir hızının payı net satışlardır (120 Alıcılar ve 121 Alacak Senetleri satıştan doğan alacaklardır). Ortalama bakiye = (120.000+150.000)/2 = 135.000; devir hızı = 1.350.000/135.000 = 10 kezdir.
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Pay olarak net satışlar yerine satışların maliyeti alınmış; alacaklar satış fiyatıyla doğar.
      C: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      E: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (120.000 + 150.000) / 2 = 135.000
    - Devir hızı = 1.350.000 / 135.000 = 10
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 120 - Alıcılar
    alinti: Bu hesap, işletmenin faaliyet konusunu oluşturan mal ve hizmet satışlarından kaynaklanan senetsiz alacaklarının izlenmesi için kullanılır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 121 - Alacak Senetleri
    alinti: Bu hesap, işletmenin faaliyet konusunu oluşturan mal ve hizmet satışlarından kaynaklanan senede bağlanmış alacaklarını kapsar.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'ns=1350000; smm=1000000; a=120000; b=150000

      sonuc = round(((ns)/(((a)+(b))/2)), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

