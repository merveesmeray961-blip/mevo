- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: ticari mal devir hızı
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: Güneş Hırdavat Ltd. Şti.'nin satılan ticari mallar maliyeti 540.000 ₺, net satışları 720.000 ₺'dir. Ticari mal stoku dönem başında 100.000 ₺, dönem sonunda 140.000 ₺ olduğuna göre stok devir hızı kaç kezdir?
  secenekler:
    A: 2,25 kez
    B: 3,86 kez
    C: 4,5 kez
    D: 5,4 kez
    E: 6 kez
  dogru: C
  aciklama:
    dogru_neden: Stok devir hızının payı satılan ticari mallar maliyetidir (621). Ortalama bakiye = (100.000+140.000)/2 = 120.000; devir hızı = 540.000/120.000 = 4,5 kezdir.
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      D: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
      E: Pay olarak satılan ticari mallar maliyeti yerine net satışlar alınmış; stoklar maliyetle izlenir.
    hesap_adimlari:
    - Ortalama bakiye = (100.000 + 140.000) / 2 = 120.000
    - Devir hızı = 540.000 / 120.000 = 4,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 621 - Satılan Ticari Mallar Maliyeti
    alinti: Herhangi bir değişikliğe tabi olmadan satılmak amacıyla alınan ticari mallar (emtia) ve benzeri kalemlerin maliyetini kapsar.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 153 - Ticari Mallar
    alinti: Herhangi bir değişikliğe tabi tutulmadan satmak amacı ile işletmeye alınan ticari mallar (emtia) ve benzeri kalemler bu hesapta yer alır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'smm=540000; ns=720000; a=100000; b=140000

      sonuc = round(((smm)/(((a)+(b))/2)), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

