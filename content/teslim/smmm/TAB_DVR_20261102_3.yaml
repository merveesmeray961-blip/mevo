    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'dim=230000; di=100000; gug=50000; yb=50000; ys=70000

      sonuc = round((360/((yb+dim+di+gug-ys)/(((yb)+(ys))/2))), 2)'
