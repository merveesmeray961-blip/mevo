    dogru_neden: Alacak devir hızının payı net satışlardır. Ortalama bakiye = (110.000+160.000)/2 = 135.000; devir hızı = 1.080.000/135.000 = 8 kez; devir süresi = 360/8 = 45 gündür.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için gün sayısının hıza bölünmesi gerekir.
      B: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
      D: Pay olarak net satışlar yerine satışların maliyeti alınmış.
      E: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
    hesap_adimlari:
    - Ortalama bakiye = (110.000 + 160.000) / 2 = 135.000
    - Devir hızı = 1.080.000 / 135.000 = 8
    - Devir süresi = 360 / 8 = 45 gün
