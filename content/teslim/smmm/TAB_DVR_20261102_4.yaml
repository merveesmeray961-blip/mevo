- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Devir hızları ve süreleri
  konu: DVR
  kazanim: ilk madde devir hızı
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: Yıldız Plastik San. Ltd. Şti. dönem içinde 324.000 ₺ tutarında ilk madde ve malzeme tüketmiştir. Bu kalemin bilanço bakiyesi dönem başında 70.000 ₺, dönem sonunda 110.000 ₺'dir. İlk madde ve malzeme devir hızı kaç kezdir?
  secenekler:
    A: 1,8 kez
    B: 2,95 kez
    C: 3,6 kez
    D: 4 kez
    E: 4,63 kez
  dogru: C
  aciklama:
    dogru_neden: Hızın payı dönem içinde tüketilen (üretime verilen) ilk madde maliyetidir (150). Ortalama bakiye = (70.000+110.000)/2 = 90.000; devir hızı = 324.000/90.000 = 3,6 kezdir.
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      D: Pay olarak tüketilen ilk madde yerine dönem içi alımlar alınmış.
      E: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (70.000 + 110.000) / 2 = 90.000
    - Devir hızı = 324.000 / 90.000 = 3,6
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 150 - İlk Madde ve Malzeme
    alinti: Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'f=324000; a=70000; b=110000; alis=360000

      sonuc = round(((f)/(((a)+(b))/2)), 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5

