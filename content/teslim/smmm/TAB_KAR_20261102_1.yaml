  kazanim: varlık kârlılığı (DuPont ile)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: Bir işletmenin vergi öncesi kâr marjı %10, kurumlar vergisi oranı %20, aktif devir hızı 1,25 kezdir. Varlık kârlılığı (net kâr / toplam aktif) yüzde kaçtır?
  secenekler:
    A: '%6,4'
    B: '%8'
    C: '%10'
    D: '%12,5'
    E: '%15'
  dogru: C
  aciklama:
    dogru_neden: 'Net kâr marjı = %10 × (1 − 0,20) = %8. Varlık kârlılığı = %8 × 1,25 = %10''dir. Püf noktaları: Vergi öncesi marjı önce vergiden arındır (1 − vergi oranı), sonra devir hızıyla çarp. Vergiyi atlamak ya da eklemek iki farklı çeldiricidir.'
    celdiriciler:
      A: Aktif devir hızı çarpılmak yerine bölünmüş.
      B: Aktif devir hızı atlanmış; bu net kâr marjıdır.
      D: Vergi etkisi hesaba katılmamış.
      E: Vergi oranı çıkarılmak yerine eklenmiş.
    hesap_adimlari:
    - Net kâr marjı = 10 × 0,8 = 8
    - Varlık kârlılığı = 8 × 1,25 = 10
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 691 - Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları
    alinti: Dönem kârı üzerinden, ilgili mevzuat hükümlerine göre hesaplanan vergi ve yasal yükümlülükler bu hesabın borcuna, "370- Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları Hesabı"nın alacağına kaydedilir.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 692 - Dönem Net Kârı veya Zararı
    alinti: Vergiden sonraki Net Dönem Kârı Hesabın alacağına, Net Dönem zararı ise borcuna kaydedilir.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: 'vm=10; v=20; d=1.25

      sonuc = round(vm*(1-v/100)*d, 2)'
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
