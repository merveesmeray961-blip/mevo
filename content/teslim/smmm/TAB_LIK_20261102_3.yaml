      C: "Ticari alacaklar nakit oranının payına girmez; bu kalem tahsil edilene kadar nakit sayılmaz."
      D: "Bu tutar likidite (asit-test) oranının payıdır."
      E: "Dönen varlıkların toplamı cari oranın payıdır."
