  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilanço kalemleri - Hazır değerler"
    alinti: "A HAZIR DEĞERLER 1. KASA 2. ALINAN ÇEKLER 3. BANKALAR 4. VERİLEN ÇEKLER VE ÖDEME EMİRLERİ (-) 5. DİĞER HAZIR DEĞERLER"
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilanço kalemleri - Menkul kıymetler"
    alinti: "B MENKUL KIYMETLER 1. HİSSE SENETLERİ 2. ÖZEL KESİM TAHVİL, SENET VE BONOLARI 3. KAMU KESİMİ TAHVİL, SENET VE BONOLARI 4. DİĞER MENKUL KIYMETLER"
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
