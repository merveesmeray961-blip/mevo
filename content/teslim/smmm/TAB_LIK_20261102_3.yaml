- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Likidite ve finansal yapı oranları"
  konu: LIK
  kazanim: "net ve brüt işletme sermayesi"
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: "Dönen varlıkları 700.000 ₺, kısa vadeli yabancı kaynakları 520.000 ₺, uzun vadeli yabancı kaynakları 60.000 ₺ olan bir işletmede brüt işletme sermayesi ile net işletme sermayesi arasındaki fark kaç ₺'dir? (Fark, brüt işletme sermayesinden net işletme sermayesinin çıkarılmasıyla bulunur.)"
  secenekler:
    A: "60.000 ₺"
    B: "180.000 ₺"
    C: "520.000 ₺"
    D: "700.000 ₺"
    E: "1.220.000 ₺"
  dogru: C
  aciklama:
    dogru_neden: "Brüt işletme sermayesi dönen varlıkların tamamıdır (700.000 ₺), net işletme sermayesi ise dönen varlıklardan kısa vadeli yabancı kaynakların düşülmesiyle 180.000 ₺ bulunur. İkisi arasındaki fark kısa vadeli yabancı kaynaklara, yani 520.000 ₺'ye eşittir."
    hesap_adimlari:
    - "Brüt işletme sermayesi = 700.000"
    - "Net işletme sermayesi = 700.000 − 520.000 = 180.000"
    - "Fark = 700.000 − 180.000 = 520.000 ₺ (kısa vadeli yabancı kaynaklar)"
    celdiriciler:
      A: "Bu tutar uzun vadeli yabancı kaynaklardır; brüt ile net işletme sermayesi arasındaki fark kısa vadeli yabancı kaynaklardır."
      B: "Bu tutar net işletme sermayesidir (700.000 − 520.000); soru iki sermaye arasındaki farkı sormaktadır."
      D: "Bu tutar brüt işletme sermayesidir."
      E: "Dönen varlıklar ile kısa vadeli yabancı kaynaklar toplanmıştır (700.000 + 520.000)."
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Fon akım tabloları - Net işletme (çalışma) sermayesindeki değişim tablosu"
    alinti: "Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı kaynaklar far-kını belirten net işletme (çalışma) sermayesini kapsar."
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı tahmin edilen varlıklar toplanır."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = 700000 - (700000 - 520000)"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

