    C: "Net işletme sermayesi ve cari oran değişmez; kaldıraç oranı azalır"
    D: "Net işletme sermayesi değişmez; cari oran artar; kaldıraç oranı artar"
    E: "Net işletme sermayesi ve cari oran değişmez; kaldıraç oranı da artar"
