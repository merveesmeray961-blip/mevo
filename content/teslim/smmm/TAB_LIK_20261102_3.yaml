  kok: "Bir işletme 400.000 ₺'lik makineyi, tutarı doğrudan banka tarafından satıcıya ödenecek şekilde kullandığı uzun vadeli kredi ile satın almıştır; başka işlem yoktur. Bu işlemin net işletme sermayesi, cari oran ve kaldıraç oranı üzerindeki etkisi aşağıdakilerden hangisidir?"
