- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Likidite ve finansal yapı oranları"
  konu: LIK
  kazanim: "hedef orandan geri hesap"
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: "Toplam aktifi 2.000.000 ₺, toplam yabancı kaynakları 1.080.000 ₺ olan bir işletme, kasasındaki nakitle yabancı kaynaklarından bir kısmını ödeyerek kaldıraç oranını (toplam yabancı kaynaklar / toplam aktif) 0,5'e düşürmek istemektedir. Ödenecek tutar kaç ₺'dir?"
  secenekler:
    A: "80.000 ₺"
    B: "160.000 ₺"
    C: "540.000 ₺"
    D: "1.080.000 ₺"
    E: "2.000.000 ₺"
  dogru: B
  aciklama:
    dogru_neden: "Nakitle borç ödemesi hem yabancı kaynakları hem toplam aktifi x kadar azaltır: (1.080.000 − x) / (2.000.000 − x) = 0,5. Çözümde x = 160.000 ₺ bulunur; kontrol: 920.000 / 1.840.000 = 0,5."
    hesap_adimlari:
    - "(1.080.000 − x) / (2.000.000 − x) = 0,5"
    - "1.080.000 − x = 1.000.000 − 0,5x"
    - "0,5x = 80.000 → x = 160.000 ₺"
    - "Kontrol: 920.000 / 1.840.000 = 0,5"
    celdiriciler:
      A: "0,5x = 80.000 eşitliğinde 0,5'e bölme yapılmamış, çözümde x yerine 80.000 alınmıştır."
      C: "Yabancı kaynaklar ikiye bölünmüştür (1.080.000 / 2); ödeme hem yabancı kaynakları hem aktifi azaltır."
      D: "Yabancı kaynakların tamamı ödeme sayılmıştır; bu durumda kaldıraç oranı sıfıra iner."
      E: "Toplam aktif tutarı ödeme sanılmıştır."
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra ödenecek olan borçlardan oluşur."
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilanço tanımı"
    alinti: "Bilanço, bir işletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağladığı kaynakları gösteren mali tablodur."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = 2 * 1080000 - 2000000"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

