      B: "Cari oran dönen varlıkların kısa vadeli yabancı kaynaklara oranıdır (900.000 / 600.000 = 1,5); 0,67 oranın tersidir."
      C: "Net işletme sermayesi 300.000 ₺'dir; likidite oranı (900.000 − 450.000) / 600.000 = 0,75'tir."
      D: "Kaldıraç oranı (600.000 + 500.000) / 2.000.000 = 0,55'tir; 0,45 özkaynak oranıdır."
