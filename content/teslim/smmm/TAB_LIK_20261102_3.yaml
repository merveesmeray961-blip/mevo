- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Likidite ve finansal yapı oranları"
  konu: LIK
  kazanim: "likidite (asit-test) oranı"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletmenin cari oranı 2, likidite (asit-test) oranı 1,5'tir ve kısa vadeli yabancı kaynakları 400.000 ₺'dir. Likidite oranı (dönen varlıklar − stoklar) / kısa vadeli yabancı kaynaklar olarak hesaplandığına göre aşağıdakilerden hangisi doğrudur?"
  secenekler:
    A: "Stoklar 200.000 ₺'dir ve dönen varlıkların yüzde 25'ini oluşturur"
    B: "Stoklar 600.000 ₺'dir ve dönen varlıkların yüzde 75'ini oluşturur"
    C: "Stoklar 800.000 ₺'dir ve dönen varlıkların tamamını oluşturur"
    D: "Stoklar 200.000 ₺'dir ve dönen varlıkların yüzde 75'ini oluşturur"
    E: "Stoklar 1.400.000 ₺'dir ve dönen varlıkların yüzde 25'ini oluşturur"
  dogru: A
  aciklama:
    dogru_neden: "Dönen varlıklar 2 × 400.000 = 800.000 ₺, stok dışı dönen varlıklar 1,5 × 400.000 = 600.000 ₺'dir. Stok 200.000 ₺ olup 200.000 / 800.000 = yüzde 25 pay oluşturur. Püf noktaları: Önce stok tutarını bul, sonra hangi tutara göre pay istendiğine bak: pay dönen varlıklar toplamına göre hesaplanır. Seçeneklerdeki yüzde 75 ifadesi stok dışı kısmı gösterir."
    hesap_adimlari:
    - "Dönen varlıklar = 2 × 400.000 = 800.000"
    - "Stok dışı dönen varlıklar = 1,5 × 400.000 = 600.000"
    - "Stok = 200.000 ₺; payı = 200.000 / 800.000 = yüzde 25"
    celdiriciler:
      B: "600.000 ₺ stok dışı dönen varlıklardır (1,5 × 400.000); stok aradaki 200.000 ₺'dir."
      C: "800.000 ₺ dönen varlıkların toplamıdır (2 × 400.000), stok değildir."
      D: "200.000 ₺ stok, 800.000 ₺ dönen varlıkların yüzde 25'idir; yüzde 75 stok dışı kısımdır."
      E: "Oranlar toplanmıştır; stok (2 − 1,5) × 400.000 = 200.000 ₺'dir."
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilanço kalemleri - Stoklar"
    alinti: "E STOKLAR 1. İLK MADDE VE MALZEME 2. YARI MAMULLER - ÜRETİM 3. MAMULLER 4. TİCARİ MALLAR 5. DİĞER STOKLAR 6. STOK DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI (-) 7. VERİLEN SİPARİŞ AVANSLARI"
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı tahmin edilen varlıklar toplanır."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = (2 - 1.5) * 400000"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Likidite ve finansal yapı oranları"
  konu: LIK
  kazanim: "net ve brüt işletme sermayesi"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Normal faaliyet döngüsü 18 ay olan bir işletme, 31.12.2026 tarihli finansal durum tablosunda 16 ay sonra satılması beklenen stoklarını göstermektedir. TMS 1'e göre bu stoklar nasıl sınıflandırılır?"
  secenekler:
    A: "Duran varlık olarak; çünkü raporlama döneminden sonraki on iki ay içinde satılmayacaktır"
    B: "Duran varlık olarak; çünkü 16 ay, normal faaliyet döngüsü olan 18 aydan uzundur"
    C: "Dönen varlık olarak; ancak yalnızca on iki aylık kısmı için"
    D: "Dönen varlık olarak; çünkü normal faaliyet döngüsü içinde satılmaları beklenmektedir"
    E: "Dönen varlık olarak; çünkü on iki ay içinde nakde dönüşecektir"
  dogru: D
  aciklama:
    dogru_neden: "TMS 1 paragraf 66(a) uyarınca varlığın normal faaliyet döngüsü içinde realize edilmesinin beklenmesi dönen varlık sınıflaması için yeterlidir. Paragraf 68'e göre stoklar ve ticari alacaklar, raporlama döneminden sonraki on iki ay içinde nakde dönüşmesi beklenmese dahi dönen varlıklar içinde yer alır. Püf noktaları: On iki ay ölçütü yalnızca normal faaliyet döngüsünün belirlenemediği hâlde varsayılır; döngü 18 ay ise 16 ay sonra satılacak stok da dönen varlıktır. 16 ay ile 18 ay karşılaştırması ise gereksiz bir tuzaktır."
    celdiriciler:
      A: "Stoklar, on iki ay içinde nakde dönüşmesi beklenmese dahi normal faaliyet döngüsü içinde satılıyorsa dönen varlıktır."
      B: "16 ay, 18 aylık normal faaliyet döngüsünden kısadır; stoklar bu döngü içinde satılır."
      C: "Standart varlığı bölmeden, normal faaliyet döngüsü içinde realize edilecekse bütünüyle dönen varlık sayar."
      E: "Stokların 16 ay sonra satılması beklenmektedir; sınıflandırma ölçütü normal faaliyet döngüsüdür, on iki ay değildir."
  kaynaklar:
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 66"
    alinti: "Bir varlık aşağıdaki kıstaslardan herhangi birini karşıladığında, dönen varlık olarak sınıflandırılır:"
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 68"
    alinti: "Dönen varlıklar, raporlama döneminden sonraki on iki ay içinde nakde dönüşmesi beklenmese dahi, normal faaliyet döngüsünün bir parçası olarak satılan, tüketilen veya nakde çevrilen varlıkları (örneğin, stokları ve ticari alacakları) içerir."
  gecerlilik: {baslangic: '2011-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

