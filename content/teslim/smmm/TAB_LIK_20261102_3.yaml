    dogru_neden: "Kredi, makineyi finanse etmek için kullanıldığından dönen varlıklar da kısa vadeli yabancı kaynaklar da değişmez. Net işletme sermayesi ve cari oran aynı kalır; uzun vadeli yabancı kaynaklar ve duran varlıklar arttığından kaldıraç oranı yükselir."
