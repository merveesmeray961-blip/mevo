- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Likidite ve finansal yapı oranları"
  konu: LIK
  kazanim: "devamlı sermaye oranları"
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: "Duran varlıkları 600.000 ₺, uzun vadeli yabancı kaynakları 400.000 ₺, özkaynakları 800.000 ₺ olan bir işletmenin duran varlıklar / devamlı sermaye oranı kaçtır? (Devamlı sermaye = uzun vadeli yabancı kaynaklar + özkaynaklar)"
  secenekler:
    A: "0,33"
    B: "0,5"
    C: "0,75"
    D: "1,5"
    E: "2"
  dogru: B
  aciklama:
    dogru_neden: "Devamlı sermaye 400.000 + 800.000 = 1.200.000 ₺'dir. Duran varlıklar / devamlı sermaye oranı 600.000 / 1.200.000 = 0,5'tir."
    hesap_adimlari:
    - "Devamlı sermaye = 400.000 + 800.000 = 1.200.000"
    - "Oran = 600.000 / 1.200.000 = 0,5"
    celdiriciler:
      A: "Uzun vadeli yabancı kaynaklar devamlı sermayeye bölünmüştür (400.000 / 1.200.000)."
      C: "Duran varlıklar yalnız özkaynaklara bölünmüştür (600.000 / 800.000); payda devamlı sermayenin tamamıdır."
      D: "Devamlı sermaye özkaynaklara bölünmüştür (1.200.000 / 800.000)."
      E: "Devamlı sermaye duran varlıklara bölünmüştür (1.200.000 / 600.000); bu, oranın tersidir."
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Duran varlıklarda ise, normal şartlar altında bir yıl içinde elden çıkarılması düşünülmeyen veya yararları bir yılda tükenmeyecek olan varlıklar yer alır."
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra ödenecek olan borçlardan oluşur."
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Özkaynaklar ise işletme sahip veya ortakları tarafından işletme kişiliğine tahsis edilmiş kaynakları oluşturur."
  gecerlilik: {baslangic: '1994-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = 600000 / (400000 + 800000)"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

