  zorluk: 3
  soru_bicimi: oncullu
  kok: "Dönen varlıkları 700.000 ₺, kısa vadeli yabancı kaynakları 500.000 ₺ olan bir işletmede aşağıdaki işlemler birbirinden bağımsız olarak ayrı ayrı yapılacaktır:\n\nI. Kullanılmayan bir arsanın defter değerine peşin satılması\nII. Satıcıdan 100.000 ₺'lik ticari malın tamamen kısa vadeli borç olarak, peşin ödeme yapmadan alınması\nIII. 100.000 ₺ tutarındaki alacağın nakit tahsil edilmesi\n\nBu işlemlerden hangisi ya da hangileri cari oranı mevcut düzeyinin üzerine çıkarır?"
  secenekler:
    A: "Yalnız II"
    B: "I ve II"
    C: "I ve III"
    D: "I, II ve III"
    E: "Yalnız I"
  dogru: E
  aciklama:
    dogru_neden: "Mevcut cari oran 700.000 / 500.000 = 1,4'tür. I'de arsa satışı dönen varlıkları artırır, oran yükselir. II'de oran 800.000 / 600.000 = 1,33 olur ve düşer. III'te alacak azalırken nakit artar, dönen varlıklar toplamı aynı kalır, oran değişmez. Püf noktaları: Dönen varlıklar içindeki dönüşümler (alacak yerine nakit) toplamı değiştirmez. Oran 1'den büyükken pay ve paydayı aynı tutarda artıran işlem oranı düşürür."
    celdiriciler:
      A: "Vadeli mal alımı hem dönen varlıkları hem kısa vadeli borcu artırır; oran 1,4'ten 1,33'e düşer."
      B: "II numaralı işlemde oran 800.000 / 600.000 = 1,33 olur ve düşer."
      C: "III numaralı işlemde nakit artarken alacak aynı tutarda azaldığından dönen varlıklar toplamı değişmez, oran artmaz."
      D: "II numaralı işlem oranı düşürür, III numaralı işlem ise oranı değiştirmez."
  kaynaklar:
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı tahmin edilen varlıklar toplanır."
  - mevzuat: "Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi"
    madde: "Bilançonun biçimsel yapısı"
    alinti: "Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra ödenecek olan borçlardan oluşur."
