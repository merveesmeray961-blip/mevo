- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Finansal tablolar ve TMS 1 / nakit akışı"
  konu: TMS
  kazanim: "toplam kapsamlı gelir"
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: "Bir işletmenin dönem net kârı 50 milyon ₺'dir. Dönem içinde vergi etkisi düşülmüş 5 milyon ₺ tutarında diğer kapsamlı gelir elde edilmiş, ayrıca ortaklardan 50 milyon ₺ nakdi sermaye artırımı alınmıştır. TMS 1'e göre işletmenin dönemdeki toplam kapsamlı geliri kaç milyon ₺'dir?"
  secenekler:
    A: "5 milyon ₺"
    B: "45 milyon ₺"
    C: "50 milyon ₺"
    D: "55 milyon ₺"
    E: "105 milyon ₺"
  dogru: D
  aciklama:
    dogru_neden: "Toplam kapsamlı gelir kâr veya zarar ile diğer kapsamlı gelirin toplamıdır: 50 + 5 = 55 milyon ₺. Ortaklarla ortaklık sıfatıyla yapılan sermaye artırımı bu tutarın dışında kalır."
    hesap_adimlari:
    - "Toplam kapsamlı gelir = Kâr veya zarar + Diğer kapsamlı gelir"
    - "50 + 5 = 55 milyon ₺"
    - "Nakdi sermaye artırımı ortaklık sıfatıyla yapılan işlemdir, dahil edilmez"
    celdiriciler:
      A: "Yalnız diğer kapsamlı gelir alınmıştır; toplam kapsamlı gelire dönem kârı da dahildir."
      B: "Diğer kapsamlı gelir kârdan düşülmüştür; toplam kapsamlı gelir ikisinin toplamıdır."
      C: "Yalnız dönem kârı alınmıştır; diğer kapsamlı gelir de toplam kapsamlı gelirin bileşenidir."
      E: "Ortaklarla ortaklık sıfatıyla yapılan sermaye artırımı da eklenmiştir; bu işlem toplam kapsamlı gelirin dışındadır."
  kaynaklar:
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 7 - toplam kapsamlı gelir"
    alinti: "Toplam kapsamlı gelir: İşletmenin ortaklarıyla gerçekleştirdiği ve ortakların ortaklık sıfatıyla taraf oldukları işlemlerden kaynaklanan değişimler hariç olmak üzere, bir dönem boyunca işlem ve diğer olaylar sonucunda özkaynakta meydana gelen değişimdir."
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 7 - kâr veya zarar"
    alinti: "Kâr veya zarar: Diğer kapsamlı gelirin bileşenleri dâhil edilmeden, toplam gelirden giderler düşüldükten sonra kalan tutardır."
  gecerlilik: {baslangic: '2011-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = 50 + 5"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

