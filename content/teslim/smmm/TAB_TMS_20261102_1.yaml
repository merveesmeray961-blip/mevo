    A: "Ödemenin tamamı finansman faaliyetidir; tutar faiz ve anaparaya ayrılarak sınıflandırılamaz"
    B: "Ödemenin tamamı esas faaliyet olarak sınıflandırılır"
    C: "Anapara yatırım faaliyeti, faiz finansman faaliyeti olarak sınıflandırılır"
    D: "Anapara esas faaliyet, faiz yatırım faaliyeti olarak sınıflandırılır"
    E: "Anapara finansman faaliyeti, faiz ise esas faaliyet olarak sınıflandırılabilir"
  dogru: E
  aciklama:
    dogru_neden: "TMS 7 paragraf 12'ye göre kredi geri ödemesinin faiz unsuru esas faaliyet olarak sınıflandırılabilirken, anapara unsuru finansman faaliyeti olarak sınıflandırılır. Faiz için seçilen sınıflandırma dönemler itibarıyla tutarlı olmalıdır. Püf noktaları: Tek bir ödeme iki ayrı faaliyete bölünebilir: anapara her zaman finansman faaliyetidir, faiz ise esas ya da finansman faaliyeti olarak sınıflandırılabilir. Tutarlar (18 ve 82) gereksiz veridir."
    celdiriciler:
      A: "Tek bir işlem farklı sınıflandırılan nakit akışları içerebilir; faiz ve anapara ayrı sınıflanabilir."
      B: "Anapara ödemesi finansman faaliyetidir."
      C: "Borç anapara ödemesi finansman faaliyetidir, yatırım faaliyeti değildir."
      D: "Anapara finansman faaliyetidir; faiz de yatırım faaliyeti olarak sınıflandırılmaz."
  kaynaklar:
  - mevzuat: "TMS 7 Nakit Akış Tablosu"
    madde: "paragraf 12"
    alinti: "Örneğin, bir kredi geri ödemesinin hem faiz hem de anapara ödemesi içermesi durumunda, faiz unsuru esas faaliyet olarak sınıflandırılabilirken, anapara unsuru finansman faaliyeti olarak sınıflandırılır."
  - mevzuat: "TMS 7 Nakit Akış Tablosu"
    madde: "paragraf 31"
    alinti: "Bunların her biri, dönemler itibarıyla tutarlı bir şekilde esas, yatırım ya da finansman faaliyeti olarak sınıflandırılır."
  gecerlilik: {baslangic: '2011-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Finansal tablolar ve TMS 1 / nakit akışı"
  konu: TMS
  kazanim: "gelir tablosu yapısı"
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: "TMS 1'e göre giderlerini fonksiyonuna göre sunan bir işletmenin verileri şöyledir (milyon ₺): hasılat 90, satışların maliyeti 54, dağıtım maliyetleri 8, yönetim giderleri 6, diğer gelirler 4, finansman maliyetleri 5. İşletmenin vergi öncesi kârı kaç milyon ₺'dir?"
  secenekler:
    A: "6 milyon ₺"
    B: "17 milyon ₺"
    C: "21 milyon ₺"
    D: "26 milyon ₺"
    E: "167 milyon ₺"
  dogru: C
  aciklama:
    dogru_neden: "Fonksiyon yönteminde hasılattan satışların maliyeti düşülerek brüt kâr (36) bulunur. Dağıtım ve yönetim giderleri düşülür, diğer gelirler eklenir, finansman maliyetleri düşülür: 36 − 8 − 6 + 4 − 5 = 21 milyon ₺. Püf noktaları: Gelirleri artı, giderleri eksi işaretle işle. Finansman maliyeti de bir gider kalemidir ve vergi öncesi kârdan önce düşülür."
    hesap_adimlari:
    - "Brüt kâr = 90 − 54 = 36"
    - "36 − 8 − 6 = 22"
    - "Diğer gelirler eklenir: 22 + 4 = 26"
    - "Finansman maliyeti düşülür: 26 − 5 = 21 milyon ₺"
    celdiriciler:
      A: "Bu tutar yönetim giderleridir; vergi öncesi kâra ulaşmak için tüm kalemler işlenmelidir."
      B: "Diğer gelirler hesaba katılmamıştır (90 − 54 − 8 − 6 − 5)."
      D: "Finansman maliyetleri düşülmemiştir (90 − 54 − 8 − 6 + 4)."
      E: "Tüm kalemler toplanmıştır; gelirler eklenir, giderler düşülür."
  kaynaklar:
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 104"
    alinti: "Giderleri fonksiyonuna göre sınıflayan bir işletme, amortisman ve itfa giderleri ile çalışanlara sağlanan faydalara ilişkin giderler dâhil, giderlerin çeşitleri hakkında ek bilgiler açıklar."
  gecerlilik: {baslangic: '2011-01-01', bitis: null, yila_bagli_tutar: false}
  dogrulama:
    python: "sonuc = 90 - 54 - 8 - 6 + 4 - 5"
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}

- id: TASLAK
  sinav: smmm
  bolum: [SGS, YET]
  ders: TAB
  unite: "Finansal tablolar ve TMS 1 / nakit akışı"
  konu: TMS
  kazanim: "TMS 1 tam set finansal tablolar"
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: "Bir işletme, 2026 yılı finansal tablolarını hazırlarken bir muhasebe politikasını geriye dönük uygulamış ve önceki dönemin tutarlarını buna göre yeniden düzenlemiştir. TMS 1'e göre bu işletmenin 31.12.2026 tarihli tam set finansal tablolarında en az kaç adet finansal durum tablosu sunulur?"
  secenekler:
    A: "Bir: yalnızca 31.12.2026 tarihli"
    B: "İki: 31.12.2026 ve 31.12.2025 tarihli"
    C: "İki: 31.12.2026 ve 01.01.2025 tarihli"
    D: "Dört: her üç aylık ara dönem sonu için birer adet"
    E: "Üç: 31.12.2026, 31.12.2025 ve 01.01.2025 tarihli"
  dogru: E
  aciklama:
    dogru_neden: "TMS 1 paragraf 38A'ya göre asgari iki finansal durum tablosu sunulur. Paragraf 10(f)'ye göre muhasebe politikasının geriye dönük uygulanması hâlinde bir önceki dönemin başına ait finansal durum tablosu da tam setin parçasıdır; bu işletme 31.12.2026, 31.12.2025 ve 01.01.2025 tarihli üç tablo sunar. Püf noktaları: Önceki dönemin başını bulmak için: önceki dönem 2025'tir ve başı 01.01.2025'tir. Asgari iki tabloya, geriye dönük uygulama nedeniyle bu üçüncü tablo eklenir."
    celdiriciler:
      A: "Karşılaştırmalı bilgi için en az iki finansal durum tablosu gerekir; geriye dönük uygulamada üçüncü tablo da sunulur."
      B: "İki tablo normal asgari sunumdur; geriye dönük uygulama nedeniyle önceki dönemin başına ait üçüncü tablo da gerekir."
      C: "Önceki dönem sonu (31.12.2025) tablosu karşılaştırmalı bilgi olarak sunulur; yalnız dönem başı tablosuyla yetinilemez."
      D: "TMS 1 tam set için yılda en az bir kez sunumu ister; ara dönem tabloları bu sayıyı belirlemez."
  kaynaklar:
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 10(f)"
    alinti: "(f) İşletmenin, bir muhasebe politikasını geriye dönük uygulaması veya finansal tablo kalemlerinde geriye dönük bir düzeltme yapması ya da 40A-40D paragrafları uyarınca finansal tablo kalemlerini yeniden sınıflandırması durumunda bir önceki dönemin başına ait finansal durum tablosu."
  - mevzuat: "TMS 1 Finansal Tabloların Sunuluşu"
    madde: "paragraf 38A"
    alinti: "İşletme asgari olarak; iki finansal durum tablosu, iki kâr veya zarar ve diğer kapsamlı gelir tablosu, iki ayrı kâr veya zarar tablosu (sunulması durumunda), iki nakit akış tablosu ve iki özkaynak değişim tablosu ile bunlara ilişkin dipnotları sunar."
  gecerlilik: {baslangic: '2011-01-01', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
