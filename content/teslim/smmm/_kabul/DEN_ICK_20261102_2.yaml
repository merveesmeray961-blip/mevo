    C: Finansal tablolardaki yanlışlıkların denetçi tarafından düzeltilmesini ve kayıtlara yansıtılmasını sağlaması
    D: Düzeltici işlemlerin maliyetini denetçi adına belirleyen bir belge niteliği taşıması ve yönetimi bağlaması
    E: Denetçinin önemli eksikliklere ilişkin sorumluluğunu yönetime devretmesini ve yükümlülüğünü sona erdirmesini sağlaması
  dogru: B
  aciklama:
    dogru_neden: BDS 265 A12’ye göre önemli eksikliklerin yazılı olarak üst yönetimden sorumlu olanlara bildirilmesi bu hususların
      önemini yansıtır ve üst yönetimden sorumlu olanların gözetim sorumluluklarını yerine getirmelerine yardımcı olur.
    celdiriciler:
      A: Denetçi iç kontrolü etkinliğine ilişkin görüş vermek için değil, prosedür tasarlamak amacıyla dikkate alır (par.
        11); yazılı bildirim görüş yerine geçmez.
      C: Eksikliklerin düzeltilmesi yönetimin sorumluluğundadır; yazılı bildirim denetçinin yanlışlık düzeltmesi anlamına
        gelmez.
      D: Düzeltici işlemlerin maliyet ve faydalarının değerlendirilmesi yönetime ve üst yönetimden sorumlu olanlara aittir
        (A16).
      E: Bildirim denetçinin sorumluluğunu devretmez; aksine par. 9 uyarınca önemli eksiklikleri yazılı bildirmek denetçinin
        yükümlülüğüdür.
  kaynaklar:
