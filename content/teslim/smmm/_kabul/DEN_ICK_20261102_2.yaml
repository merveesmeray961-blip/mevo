  kok: BDS 315 Ek 3’te kontrol faaliyetleri bileşenindeki kontrollerle ilişkili olabilecek faaliyetler sayılmıştır. Aşağıdakilerden
    hangisi bu faaliyetlerden biri **değildir**?
  secenekler:
    A: Farklılıkların tespit edilmesi hâlinde verilerin mutabakatı için adım atılmasını içeren mutabakatlar
    B: İşlemin geçerli olduğunu onaylayan yetkilendirme ve onaylar ile üst düzey onay mekanizmaları
    C: Nitelikli personelin performans değerlendirmelerine göre daha yüksek sorumluluk seviyelerine terfi ettirilmesi
    D: İşlemlerin yetkilendirilmesi, kaydedilmesi ve varlıkların korunması sorumluluklarının farklı kişilere verilmesi
    E: İki veya daha fazla kalemin ya da bir kalemin bir politika ile karşılaştırıldığı doğrulamalar
  dogru: C
  aciklama:
    dogru_neden: BDS 315 Ek 3 par. 20’de kontrol faaliyetleri; yetkilendirme ve onaylar, mutabakatlar, doğrulamalar, fiziksel
      veya mantıksal kontroller ve görevler ayrılığı olarak sayılmıştır. Performans değerlendirmelerine göre terfi ettirme
      ise yetkin kişilerin bünyeye çekilmesi, geliştirilmesi ve bünyede tutulmasına ilişkin bir uygulamadır ve kontrol çevresi
      bileşeninde ele alınır.
    celdiriciler:
      A: Mutabakatlar, Ek 3 par. 20’de kontrol faaliyetleriyle ilişkili olarak sayılan türlerden biridir.
      B: Yetkilendirme ve onaylar, Ek 3 par. 20’de kontrol faaliyetleriyle ilişkili olarak sayılan türlerden biridir.
      D: Görevler ayrılığı, Ek 3 par. 20’de kontrol faaliyetleriyle ilişkili olarak sayılan türlerden biridir.
      E: Doğrulamalar, Ek 3 par. 20’de kontrol faaliyetleriyle ilişkili olarak sayılan türlerden biridir.
  kaynaklar:
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi (Ek 3)
    madde: Ek 3 par. 20
    alinti: 'Yetkilendirme ve onaylar: Yetkilendirme, bir işlemin geçerli olduğunu onaylar'
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi (Ek 3)
    madde: Ek 3 par. 20
    alinti: 'Mutabakatlar: Mutabakatlar iki veya daha fazla veri unsurunu karşılaştırır.'
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi (Ek 3)
    madde: Ek 3 par. 20
    alinti: 'Doğrulamalar: Doğrulamalar, iki veya daha fazla kalemi birbiriyle karşılaştırır veya bir kalemi bir politika
      ile karşılaştırır'
  - mevzuat: BDS 315 “Önemli Yanlışlık” Risklerinin Belirlenmesi ve Değerlendirilmesi (Ek 3)
    madde: Ek 3 par. 20
    alinti: 'Görevler ayrılığı: İşlemlerin yetkilendirilmesi, kaydedilmesi ve varlıkların korunmasına ilişkin sorumlulukların
      farklı kişilere verilmesi.'
