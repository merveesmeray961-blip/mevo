  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A24
    alinti: Denetçi önemli eksiklikler dışındaki iç kontrol eksikliklerini yönetime önceki dönemde bildirmiş ve yönetim maliyet
