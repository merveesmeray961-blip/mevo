  kok: Bir bağımsız denetimde denetçi, stok sayımı sırasında tutar bakımından önemsiz bir yanlışlık belirlemiştir. Denetçinin,
    bu yanlışlığın hileden kaynaklandığına ve hileye bir üst düzey yöneticinin de dâhil olduğuna inanmasını gerektirecek gerekçeleri
    bulunmaktadır. BDS 240’a göre denetçi aşağıdakilerden hangisini yapmalıdır?
  secenekler:
    A: Hile kaynaklı risk değerlendirmesini ve prosedürlere etkilerini yeniden değerlendirir; önceki kanıtların güvenilirliğini
      gözden geçirir.
    B: Yanlışlık önemsiz olduğundan yalnızca düzeltilmesini ister ve mevcut risk değerlendirmesini hiçbir değişiklik yapmadan
      aynen korur ve sürdürür.
    C: Yanlışlığı münferit bir olay kabul ederek daha önce elde ettiği kanıtları değiştirmeden kullanmaya devam eder.
    D: Hile yönetimi ilgilendirdiğinden bildirimi üst yönetimden sorumlu olanlara değil, yalnızca yönetimin kendisine yapar.
    E: Tutar önemsiz olduğu için konuyu çalışma kâğıtlarında belgelendirmeden denetim planına aynen devam eder.
  dogru: A
  aciklama:
    dogru_neden: 'BDS 240 par. 37 uyarınca denetçi önemli ya da önemsiz bir yanlışlık belirlemiş ve bunun hileden kaynaklandığına
      veya kaynaklanabileceğine ve hileye yönetimin (özellikle üst düzey yöneticilerin) dâhil olduğuna inanmasını gerektirecek
      bir gerekçesi varsa, hile kaynaklı önemli yanlışlık risklerine ilişkin değerlendirmesini ve bunun prosedürlere etkilerini
      yeniden değerlendirir; daha önce elde edilen kanıtların güvenilirliğini yeniden değerlendirirken muvazaalı işlem ihtimalini
      de mütalaa eder. Püf noktaları: Soruda “önemsiz tutar” bilgisi dikkatinizi dağıtmasın; par. 37 yanlışlığın önemli olup
      olmadığına bakmaz. Hile göstergesi olan yanlışlıkta münferit olay ihtimalinin düşük olduğu varsayılır (par. 36). Yönetimin
      dâhil olduğu hilede muhatap ayrıca üst yönetimden sorumlu olanlardır (par. 42).'
    celdiriciler:
      B: Par. 37 yanlışlığın önemli ya da önemsiz olmasından bağımsız olarak risk değerlendirmesinin yeniden yapılmasını gerektirir.
      C: Par. 36, hile göstergesi bulunan yanlışlıkta gerçekleşmiş hilenin münferit bir vaka olma ihtimalinin düşük olduğunu
        kabul etmeyi öngörür.
      D: Yönetimin dâhil olduğu hileden şüphelenilmesi hâlinde şüphe üst yönetimden sorumlu olanlara bildirilir (par. 42);
        yalnızca yönetime bildirim yeterli değildir.
      E: Hileyle ilgili bildirimler ve değerlendirmeler çalışma kâğıtlarına dâhil edilir (par. 45-47); tutar önemsizliği bu
        yükümlülüğü kaldırmaz.
  kaynaklar:
  - mevzuat: BDS 240 Finansal Tabloların Bağımsız Denetiminde Bağımsız Denetçinin Hileye İlişkin Sorumlulukları
    madde: par. 37
    alinti: Denetçinin, önemli ya da önemsiz bir yanlışlık belirlemesi ve bunun hileden kaynaklandığına veya kaynaklanabileceğine
      ve bu hileye yönetimin de (özellikle üst düzey yöneticilerin) dâhil olduğuna inanmasını gerektirecek bir gerekçesinin
      bulunması durumunda denetçi; hile kaynaklı “önemli yanlışlık” risklerine ilişkin yaptığı değerlendirmeyi
