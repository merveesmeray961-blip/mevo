  kok: BDS 265 standardına göre önemli olmayan ancak yönetimin dikkatini çekebilecek diğer iç kontrol eksikliklerinin bildirilmesine
    ilişkin aşağıdaki ifadelerden hangisi **yanlıştır**?
  secenekler:
    A: Bu tür eksikliklerin belirlenmesi, içinde bulunulan şartlara göre denetçinin mesleki muhakemesine bağlıdır.
    B: Bu eksikliklerin yazılı olarak bildirilmesi zorunlu değildir; sözlü olarak da bildirilebilir.
    C: Eksiklikler yönetimle müzakere edilirken sözlü bildirilmişse ardından resmî bir bildirim yapılmasına gerek yoktur.
    D: Önceki dönemde bildirilmiş ve yönetimin maliyet nedeniyle gidermemeyi tercih ettiği eksiklikler cari dönemde tekrar
      bildirilmek zorunda değildir.
    E: Bu eksiklikler de önemli eksiklikler gibi üst yönetimden sorumlu olanlara zamanında ve yazılı olarak bildirilmelidir.
  dogru: E
  aciklama:
    dogru_neden: BDS 265 A23’e göre yönetimin dikkatini çekecek diğer eksikliklerin yazılı olarak bildirilmesi zorunluluğu
      olmayıp bunlar sözlü olarak da bildirilebilir. Zamanında ve yazılı bildirim zorunluluğu par. 9’a göre önemli eksiklikler
      içindir; bu nedenle E şıkkı yanlıştır.
    celdiriciler:
      A: A22 bu eksiklik türlerinin belirlenmesinin denetçinin mesleki muhakemesine bağlı olduğunu belirtir; ifade doğrudur.
      B: A23 yazılı bildirim zorunluluğu olmadığını ve sözlü bildirim yapılabileceğini belirtir; ifade doğrudur.
      C: A23 sözlü bildirimin ardından resmî bir bildirim yapılmasına gerek olmadığını belirtir; ifade doğrudur.
      D: A24 uyarınca önemli eksiklikler dışındaki eksiklikler önceden bildirilmiş ve yönetim gidermemeyi seçmişse bildirimin
        tekrarına gerek yoktur; ifade doğrudur.
  kaynaklar:
  - mevzuat: BDS 265 İç Kontrol Eksikliklerinin Üst Yönetimden Sorumlu Olanlara ve Yönetime Bildirilmesi
    madde: A23
    alinti: Denetim sırasında iç kontrolde tespit edilen ve yönetimin dikkatini çekecek diğer eksikliklerin yazılı olarak
