  kok: Basit kapalı bir ekonomide tüketim fonksiyonu C = 50 + 0,75Y'dir ve vergi yoktur. Kamu harcamaları 20 milyar ₺ artırılırsa
    denge gelir kaç milyar ₺ artar?
  secenekler:
    A: '4'
    B: '20'
    C: '60'
    D: '80'
    E: '320'
  dogru: D
  aciklama:
    dogru_neden: Harcama çarpanı 1 / (1 - c) = 1 / 0,25 = 4'tür. Kamu harcaması 20 artınca denge gelir 20 x 4 = 80 milyar
      ₺ artar. Otonom tüketim (50) çarpanı etkilemez.
    hesap_adimlari:
    - Çarpan = 1 / (1 - 0,75) = 4
    - ΔY = 20 x 4 = 80
    celdiriciler:
      A: 4 çarpanın kendisidir; gelir artışı için kamu harcaması artışıyla çarpılmalıdır.
      B: 20 yalnız ilk tur artışıdır; çarpan etkisi hesaba katılmamıştır.
      C: Harcama çarpanı yerine c / (1 - c) = 3 kullanılmıştır (20 x 3); bu vergi çarpanı oranıdır.
      E: Çarpan iki kez uygulanmıştır (20 x 4 x 4).
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §3
    alinti: '**Harcama çarpanı = 1 / (1 − c) = 1 / MPS.**'
  dogrulama:
    python: sonuc = 20 * (1 / (1 - 0.75))
