  kok: Bir ekonomide cari yıl nominal GSYH 5.400 milyar ₺, baz yıl fiyatlarıyla hesaplanan reel GSYH ise 4.500 milyar ₺'dir.
    GSYH deflatörü kaçtır?
  secenekler:
    A: 1,2
    B: '20'
    C: 83,3
    D: '120'
    E: '900'
  dogru: D
  aciklama:
    dogru_neden: 'GSYH deflatörü = (nominal GSYH / reel GSYH) x 100''dür: 5.400 / 4.500 x 100 = 120.'
    hesap_adimlari:
    - Nominal / reel = 5.400 / 4.500 = 1,2
    - Deflatör = 1,2 x 100 = 120
    celdiriciler:
      A: 1,2 nominal GSYH'nin reele oranıdır; 100 ile çarpılmamıştır.
      B: 20, fiyatlardaki yüzde artıştır; deflatörün kendisi 100 ile birlikte 120'dir.
      C: Oran ters kurulmuştur (4.500 / 5.400 x 100); pay nominal GSYH olmalıdır.
      E: 900, nominal ile reel GSYH arasındaki farktır; deflatör farkla değil oranla bulunur.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §1
    alinti: '**GSYH deflatörü = (Nominal GSYH / Reel GSYH) × 100**'
  dogrulama:
    python: sonuc = 5400 / 4500 * 100
