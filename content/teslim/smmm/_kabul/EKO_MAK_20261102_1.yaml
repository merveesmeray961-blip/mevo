  kok: Marjinal tüketim eğilimi 0,9 olan, vergi ve dış ticaretin bulunmadığı basit bir ekonomide harcama çarpanı kaçtır?
  secenekler:
    A: 0,1
    B: 0,9
    C: 1,11
    D: '9'
    E: '10'
  dogru: E
  aciklama:
    dogru_neden: Harcama çarpanı 1 / (1 - c) = 1 / MPS'dir. c = 0,9 ise MPS = 0,1 ve çarpan 1 / 0,1 = 10'dur.
    hesap_adimlari:
    - MPS = 1 - 0,9 = 0,1
    - Çarpan = 1 / 0,1 = 10
    celdiriciler:
      A: 0,1 marjinal tasarruf eğilimidir; çarpan bunun tersidir.
      B: 0,9 marjinal tüketim eğilimidir; çarpan değildir.
      C: 1,11 marjinal tüketim eğiliminin tersidir (1 / 0,9); doğru payda 1 - c'dir.
      D: 9, c / (1 - c) oranıdır (vergi çarpanının mutlak değeri); harcama çarpanı değildir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §3
    alinti: '**Harcama çarpanı = 1 / (1 − c) = 1 / MPS.**'
  dogrulama:
    python: 'c = 0.9

      sonuc = 1 / (1 - c)'
