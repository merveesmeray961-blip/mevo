  kok: Bir yıl önce 400 olan tüketici fiyat endeksi bugün 450 olmuştur. Yıllık enflasyon oranı yüzde kaçtır?
  secenekler:
    A: '%11,1'
    B: '%12,5'
    C: '%50'
    D: '%88,9'
    E: '%112,5'
  dogru: B
  aciklama:
    dogru_neden: 'Enflasyon oranı = (bu dönem endeksi - önceki dönem endeksi) / önceki dönem endeksi x 100''dür: (450 - 400)
      / 400 x 100 = %12,5.'
    hesap_adimlari:
    - 'Endeks artışı: 450 - 400 = 50 puan'
    - Enflasyon = 50 / 400 x 100 = %12,5
    celdiriciler:
      A: Puan artışı yeni endekse bölünmüştür (50 / 450); baz önceki dönem endeksidir.
      C: 50 puanlık artış %50 değildir; puan farkı yüzde değişme olarak alınmıştır.
      D: Eski endeks yeni endekse oranlanmıştır (400 / 450); enflasyon değişme oranıdır.
      E: Yeni endeksin eskiye oranı (450 / 400) alınmıştır; enflasyon bu oranın 100 eksiğidir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §2
    alinti: '**Enflasyon oranı = (Bu dönem endeksi − Önceki dönem endeksi) / Önceki dönem endeksi × 100**'
  dogrulama:
    python: sonuc = (450 - 400) / 400 * 100
