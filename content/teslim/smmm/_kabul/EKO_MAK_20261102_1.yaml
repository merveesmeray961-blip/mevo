  kok: Bir ekonomide halkın nakit/mevduat oranı 0,2, zorunlu karşılık oranı 0,1'dir; bankalar serbest rezerv tutmamaktadır.
    Merkez bankası açık piyasadan 100 milyon ₺'lik tahvil satın alırsa para arzı en fazla kaç milyon ₺ artar?
  secenekler:
    A: '4'
    B: '100'
    C: 333,3
    D: '400'
    E: '1.000'
  dogru: D
  aciklama:
    dogru_neden: Para çarpanı m = (1 + c) / (c + r) = 1,2 / 0,3 = 4'tür. Tahvil alımı parasal tabanı 100 artırır; para arzı
      100 x 4 = 400 milyon ₺ genişler.
    hesap_adimlari:
    - m = (1 + 0,2) / (0,2 + 0,1) = 4
    - Para arzı artışı = 100 x 4 = 400
    celdiriciler:
      A: 4 para çarpanının kendisidir; parasal taban artışıyla çarpılmamıştır.
      B: 100 yalnızca parasal taban artışıdır; çarpan etkisi hesaba katılmamıştır.
      C: Parasal taban nakit ve zorunlu karşılık toplamına bölünmüştür (100 / 0,3); doğru çarpan (1 + c) / (c + r)'dir.
      E: Nakit tercihi göz ardı edilerek m = 1 / r = 10 alınmıştır; nakit kaçağı çarpanı küçültür.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §5
    alinti: 'Nakit tercihi c (nakit / mevduat) dikkate alınırsa: **m = (1 + c) / (c + r)**; bankaların serbest rezerv oranı
      e varsa payda c + r + e olur.'
  dogrulama:
    python: 'm = (1 + 0.2) / (0.2 + 0.1)

      sonuc = 100 * m'
