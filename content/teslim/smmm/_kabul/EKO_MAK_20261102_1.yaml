  aciklama:
    dogru_neden: 'Reel GSYH = nominal GSYH / deflatör x 100 = 3.240 / 120 x 100 = 2.700''dür. Reel büyüme = (2.700 - 2.400)
      / 2.400 = %12,5. Püf noktaları: Büyüme nominal değil reel GSYH ile ölçülür; önce deflatörle nominal değeri reele çevir.
      Nominal büyümeden deflatör artışını çıkarmak yalnızca yaklaşık sonuç verir ve çoğu zaman şıklarda tuzak olarak yer alır.'
    hesap_adimlari:
    - Reel GSYH 2026 = 3.240 / 120 x 100 = 2.700
    - Reel büyüme = (2.700 - 2.400) / 2.400 = 0,125
    celdiriciler:
      B: Nominal büyüme (%35) ile deflatör artışı (%20) farkı alınmıştır; bu yaklaşık hesap kesin sonucu vermez.
      C: '%20 deflatördeki artıştır; reel büyüme değildir.'
      D: '%35 nominal büyümedir (3.240 / 2.400 - 1); büyüme reel GSYH ile ölçülür.'
      E: 2.700 / 2.400 oranı yüzde olarak alınmıştır (%112,5); büyüme oranı bu değerin 100 eksiğidir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §1
    alinti: '**GSYH deflatörü = (Nominal GSYH / Reel GSYH) × 100**'
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §1
    alinti: Ekonomik büyüme reel GSYH'deki değişmeyle ölçülür.
