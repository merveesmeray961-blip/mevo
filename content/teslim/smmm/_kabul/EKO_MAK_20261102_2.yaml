  kok: Bir ülkede yurt içinde üretilen yatırım mallarının fiyatları ile hanehalklarının tükettiği ithal malların fiyatları
    artmış, diğer fiyatlar değişmemiştir. Bu durumda TÜFE ve GSYH deflatörü için aşağıdakilerden hangisi söylenebilir?
  secenekler:
    A: Yalnızca TÜFE yükselir; çünkü iki artış da hanehalkının tüketimiyle ilgilidir ve yatırım malı sepete girer.
    B: Yalnızca GSYH deflatörü yükselir; çünkü iki mal da yurt içi üretimle ilgilidir.
    C: İkisi de yükselir; TÜFE ithal tüketim malları, deflatör yatırım malları nedeniyle artar.
    D: İkisi de değişmez; çünkü ağırlıklar sabit tutulmuştur.
    E: TÜFE yükselir, deflatör düşer; çünkü ithal mal fiyatı deflatörü azaltır.
  dogru: C
  aciklama:
    dogru_neden: 'TÜFE ithal tüketim mallarını kapsar ancak yatırım ve kamu mallarını kapsamaz; GSYH deflatörü ise yurt içinde
      üretilen yatırım ve kamu mallarını kapsar, ithal malları kapsamaz. Bu nedenle her iki endeks de bir artıştan etkilenir.
      Püf noktaları: Her endeksin kapsamını ayrı ayrı sorgula; iki artıştan her biri bir endeksi yükseltir. Sabit sepet TÜFE''nin
      fiyat değişmelerini yansıtmasına engel değildir.'
    celdiriciler:
      A: Yatırım malları tüketim değildir ama deflatör yurt içinde üretilen yatırım mallarını kapsar; deflatör de yükselir.
      B: İthal tüketim malı TÜFE sepetinde yer aldığından TÜFE de yükselir.
      D: Sabit ağırlıklar fiyat artışlarının endekse yansımasını engellemez; ağırlıklar sabit kalır, fiyatlar değişir.
      E: İthal mal deflatörün kapsamında olmadığından deflatörü etkilemez; deflatör yatırım malı artışıyla yükselir, düşmez.
  kaynaklar:
