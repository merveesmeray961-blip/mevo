  kok: Bir merkez bankası, geçmiş verilerden tahmin ettiği enflasyon-işsizlik ilişkisine dayanarak yeni bir politika uygulamaya
    karar vermiştir. Lucas eleştirisine göre bu yaklaşımın temel sorunu aşağıdakilerden hangisidir?
  secenekler:
    A: Politika değişince beklentiler de değiştiğinden geçmiş verilerle tahmin edilen katsayılar politika etkisini öngöremez.
    B: Bireyler rasyonel davranmadığından, politikanın etkisi geçmiş verilerle bile tahmin edilemez ve model çöker.
    C: Fiyat ve ücretler esnek olduğundan model katsayıları sürekli sabit kalır.
    D: Phillips eğrisi uzun dönemde de her zaman negatif eğimli olduğundan politika etkisizdir ve sonuç kalıcıdır.
    E: Para arzı artışı yalnızca tüketici fiyat endeksini etkiler; üretime ve istihdama hiçbir etkisi yoktur, bu yüzden tahmin
      gereksizdir.
  dogru: A
  aciklama:
    dogru_neden: 'Lucas eleştirisine göre politika değişince bireylerin beklentileri ve davranışları da değişir; bu nedenle
      geçmiş verilerle tahmin edilen model katsayıları politika etkisini öngörmek için güvenilir değildir. Püf noktaları:
      Eleştiri bireylerin akılsızlığına değil, rasyonel beklentilerin politika değişikliğine uyum sağlamasına dayanır. Bu
      nedenle katsayıların sabit kalacağı varsayımı çöker; Phillips eğrisiyle doğrudan bir ilgisi yoktur.'
    celdiriciler:
      B: Eleştiri bireylerin rasyonel olmadığını değil, rasyonel olduklarını ve beklentilerini politikaya göre değiştirdiklerini
        varsayar.
      C: Lucas eleştirisi katsayıların sabit kalmadığını savunur; sabit kalmalarının nedeni olarak esnek fiyatları göstermez.
      D: Phillips eğrisi uzun dönemde monetaristlere göre doğal işsizlik oranında dikeydir; eleştirinin konusu bu değildir.
      E: Eleştirinin konusu para arzının TÜFE'ye etkisi değil, politika değişince model katsayılarının değişmesidir.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §4
    alinti: '**Lucas eleştirisi:** Politika değişince bireylerin beklentileri ve davranışları da değişir; geçmiş verilerle
      tahmin edilen model katsayılarıyla politika etkisi öngörülemez.'
