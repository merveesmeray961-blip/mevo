  kok: Marjinal tüketim eğilimi 0,8 olan kapalı bir ekonomide kamu harcamaları ve götürü vergi aynı anda 30 milyar ₺ artırılıyor.
    Denge gelir kaç milyar ₺ değişir?
  secenekler:
    A: '-120'
    B: '0'
    C: '5'
    D: '30'
    E: '150'
  dogru: D
  aciklama:
    dogru_neden: Harcama çarpanı 1 / (1 - 0,8) = 5, vergi çarpanı -0,8 / 0,2 = -4'tür. Kamu harcaması artışı 30 x 5 = +150,
      vergi artışı 30 x (-4) = -120 etki yapar; toplam +30 milyar ₺'dir. Denk bütçe çarpanı 1'dir.
    hesap_adimlari:
    - 'Harcama etkisi: 30 x 5 = +150'
    - 'Vergi etkisi: 30 x (-4) = -120'
    - 'Toplam: 150 - 120 = +30'
    celdiriciler:
      A: -120 yalnız vergi artışının etkisidir; kamu harcaması artışı hesaba katılmamıştır.
      B: Denk bütçe artışının etkisiz olduğu düşünülmüştür; denk bütçe çarpanı sıfır değil 1'dir.
      C: 5 harcama çarpanının kendisidir; tutarla çarpılmamış ve vergi etkisi eklenmemiştir.
      E: Yalnız kamu harcaması artışının etkisi alınmıştır (30 x 5); vergi artışının geliri azaltıcı etkisi unutulmuştur.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §3
    alinti: 'G ve T aynı anda 20 artarsa: 100 − 80 = **+20**. **Denk bütçe çarpanı 1''dir** (Haavelmo teoremi).'
  dogrulama:
    python: 'c = 0.8

      sonuc = 30 / (1 - c) - 30 * c / (1 - c)'
