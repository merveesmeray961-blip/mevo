  kok: Bir ülkede yabancılara yapılan net faktör ödemeleri, yurt dışından elde edilen faktör gelirlerinden fazladır. Bu ülkede
    GSMH ile GSYH arasındaki ilişki için aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: GSMH, GSYH'den büyüktür.
    B: GSMH, GSYH'den daha küçüktür.
    C: İkisi eşittir; aradaki fark yalnızca amortismandır.
    D: İkisi de yalnızca vatandaşlık ölçütüne dayanır.
    E: GSMH, GSYH'ye ikinci el mal satışları eklenerek bulunur.
  dogru: B
  aciklama:
    dogru_neden: GSMH = GSYH + yurt dışından elde edilen net faktör gelirleridir. Net faktör geliri negatif (net ödeme) olduğundan
      GSMH, GSYH'den küçük çıkar.
    celdiriciler:
      A: GSMH'nin GSYH'den büyük olması için yurt dışından elde edilen net faktör gelirinin pozitif olması gerekir.
      C: İki kavram arasındaki fark amortisman değil, net faktör gelirleridir.
      D: Vatandaşlık ölçütü yalnızca GSMH'ye aittir; GSYH coğrafi ölçüte dayanır.
      E: İkinci el mal satışları GSYH'ye girmez (yalnız aracılık komisyonu girer) ve GSMH bu yolla hesaplanmaz.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §1
    alinti: '**GSYH ile GSMH:** GSMH (gayrisafi milli hasıla), vatandaşlık ölçütüne dayanır: GSMH = GSYH + yurt dışından elde
      edilen net faktör gelirleri.'
