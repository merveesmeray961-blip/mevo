  kok: Faizlerin çok düşük olduğu bir ekonomide para talebi faize karşı sonsuz esnek hâle gelmiş, merkez bankası para arzını
    artırmasına rağmen faizler daha fazla düşmemiştir. Bu durum ve Keynes'in öngördüğü politika için aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Likidite tuzağıdır; para politikası etkili kalır, maliye politikası dışlama etkisiyle işlevsizleşir.
    B: Klasik ikilemdir; para yansız olduğundan hiçbir politikaya gerek yoktur.
    C: Tasarruf paradoksudur; tasarrufları azaltan para politikası öne çıkar.
    D: Zorunlu karşılığın artmasının sonucudur; çarpan küçüldüğü için maliye politikası gerekmez.
    E: Likidite tuzağıdır; para politikası etkisizleşir, maliye politikası öne çıkar.
  dogru: E
  aciklama:
    dogru_neden: 'Faizler çok düşükken para talebinin sonsuz esnek hâle gelmesi likidite tuzağıdır. Para arzı artışı faizi
      daha fazla düşüremez ve para politikası etkisizleşir; Keynes''e göre bu durumda maliye politikası öne çıkar. Püf noktaları:
      Likidite tuzağında sorun paranın miktarı değil, faizin daha fazla düşememesidir. Keynes''in çözümü bu nedenle maliye
      politikasıdır; klasik görüşteki para yansızlığıyla karıştırma.'
    celdiriciler:
      A: Likidite tuzağında para politikası etkisizleşir; maliye politikasının işlevsizleşmesi söz konusu değildir, tersine
        öne çıkar.
      B: Klasik görüş esnek fiyatlarla para yansızlığını savunur; burada anlatılan durum Keynes'in likidite tuzağıdır.
      C: Tasarruf paradoksu herkesin aynı anda daha çok tasarruf etmesiyle ilgilidir; faiz ve para talebi esnekliği konusu
        değildir.
      D: Zorunlu karşılık değil, faizdeki daha fazla düşememe durumu söz konusudur; çarpan küçülmesi bu olayı açıklamaz.
  kaynaklar:
  - mevzuat: Hakemli konu anlatımı — EKO/MAK
    madde: §5
    alinti: '**Likidite tuzağı:** Faizler çok düşük düzeydeyken para talebi sonsuz esnek hâle gelir; para arzı artışı faizi
      daha fazla düşüremez ve para politikası etkisizleşir. Keynes''e göre bu durumda maliye politikası öne çıkar.'
