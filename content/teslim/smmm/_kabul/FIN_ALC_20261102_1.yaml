  kok: İşletmenin portföyünde nominal değeri 180.000 ₺ olan ve 15 Şubat 2027 tarihinde vadesi dolacak bir alacak senedi bulunmaktadır.
    Bilanço günü 31 Aralık 2026'dır; ay 30 gün sayılacak, yıllık iskonto oranı %20 olacak ve reeskont tutarı nominal değer
    × yıllık oran × kalan gün / 360 formülüyle bulunacaktır. Bilanço gününde 122 Alacak Senetleri Reeskontu hesabına alacak
    kaydedilecek tutar kaç ₺'dir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 450 ₺
    B: 3.000 ₺
    C: 4.500 ₺
    D: 9.000 ₺
    E: 18.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Bilanço günü olan 31 Aralık 2026 ile vade tarihi olan 15 Şubat 2027 arasında, ay 30 gün sayıldığında 30
      (Ocak) + 15 (Şubat) = 45 gün vardır. Reeskont, 180.000 × 0,20 × 45 / 360 = 4.500 ₺ olur ve 122 hesabına alacak kaydedilir.
      Püf noktaları: Kalan günü tarihten tarihe sayarken ay 30 gün alınır; Aralık 31''den sonraki süre Ocak''ın tamamı ve
      Şubat''ın 15 günüdür. Reeskontta payda 360''tır, oran yıllıktır; KDV nominal tutara dahil değildir, soruda ayrıca eklenmez.'
    celdiriciler:
      A: 450 ₺, kalan sürenin 45 yerine 4,5 gün alınmasıyla bulunan ondalık kayması hatasıdır.
      B: 3.000 ₺, kalan sürenin yalnızca 30 gün (Ocak ayı) sayılmasıyla bulunur; Şubat'ın ilk 15 günü de süreye dahildir.
      D: 9.000 ₺, formülde 360 yerine 180 kullanılmasıyla bulunur; payda 360 olmalıdır.
      E: 18.000 ₺, formülde 360 yerine 90 kullanılmasıyla bulunur; payda 360 olmalıdır.
    hesap_adimlari:
    - 'Kalan gün: Ocak 30 + Şubat 15 = 45 gün'
    - Reeskont = 180.000 × 0,20 × 45 / 360
    - 'Sonuç: 4.500 ₺'
