  kok: İşletmenin yurt dışındaki bir müşteriden 20.000 USD tutarında senetsiz alacağı, 1 USD = 30 ₺ kurundan 600.000 ₺ olarak
    kaydedilmiştir. Dönem içinde bu alacağın 5.000 USD'si 1 USD = 31 ₺ kurundan tahsil edilmiştir. Bilanço günündeki borsa
    rayici 1 USD = 32 ₺'dir. VUK md. 280 uyarınca bilanço gününde kalan alacağın değerlenmesi sonucunda ortaya çıkan kur farkı
    artışı kaç ₺'dir?
  secenekler:
    A: 3.000 ₺
    B: 5.000 ₺
    C: 30.000 ₺
    D: 40.000 ₺
    E: 450.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Bilanço gününde alacağın tahsil edilmeyen kısmı 20.000 − 5.000 = 15.000 USD''dir. Bu tutar borsa rayici
      ile değerlenir: kayıt kuru 30 ₺, rayiç 32 ₺ olduğundan her USD için 2 ₺ artış doğar. Kur farkı 15.000 × (32 − 30) =
      30.000 ₺''dir. Püf noktaları: Dönem içinde tahsil edilen 5.000 USD için kur farkı tahsil anında doğmuştur; bilanço günü
      değerlemesine yalnızca kalan 15.000 USD girer. Değerlemede kayıt kuru ile bilanço günü rayici arasındaki fark alınır,
      kayıt değeri değil.'
    celdiriciler:
      A: 3.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 5.000 ₺, tahsil edilen 5.000 USD'nin tahsil kuru ile kayıt kuru arasındaki farktır (5.000 × 1); bilanço gününde bu
        tutar değerlenmez.
      D: 40.000 ₺, tahsil edilen kısım düşülmeden 20.000 USD üzerinden hesaplanır; tahsil edilen kısım değerlemeye girmez.
      E: 450.000 ₺, kalan USD tutarının kayıt kuruyla çarpımıdır (15.000 × 30); bu tutar kur farkı değil kalan alacağın kayıt
        değeridir.
    hesap_adimlari:
    - Kalan alacak = 20.000 − 5.000 = 15.000 USD
    - Kur farkı = 15.000 × (32 − 30)
    - 'Sonuç: 30.000 ₺'
