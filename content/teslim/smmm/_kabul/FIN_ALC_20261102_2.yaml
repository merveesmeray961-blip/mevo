  kok: Bilançoda 128 Şüpheli Ticari Alacaklar hesabı 80.000 ₺ borç, 129 Şüpheli Ticari Alacaklar Karşılığı hesabı 30.000 ₺
    alacak bakiyesi vermektedir. Şüpheli ticari alacakların bilançoda gösterilecek net tutarı kaç ₺'dir?
  secenekler:
    A: 5.000 ₺
    B: 30.000 ₺
    C: 50.000 ₺
    D: 80.000 ₺
    E: 110.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 129 hesabı şüpheli alacaklar için ayrılan karşılığı izleyen alacak bakiyeli düzenleyici bir hesaptır. Net
      tutar 80.000 − 30.000 = 50.000 ₺'dir.
    celdiriciler:
      A: 5.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 30.000 ₺ yalnızca karşılık tutarıdır; net tutar için karşılık alacak tutarından düşülür.
      D: 80.000 ₺ karşılık düşülmeden brüt alacak tutarıdır.
      E: 110.000 ₺, karşılığın alacağa eklenmesiyle bulunur; karşılık alacağı azaltır.
    hesap_adimlari:
    - Net şüpheli alacak = 80.000 − 30.000
    - 'Sonuç: 50.000 ₺'
