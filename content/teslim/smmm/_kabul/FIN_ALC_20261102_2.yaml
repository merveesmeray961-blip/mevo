  kok: Vadesi gelen 120.000 ₺ tutarındaki alacak senedinin 70.000 ₺'si borçlunun bankadaki hesabından tahsil edilerek işletmenin
    banka hesabına geçmiştir. Kalan 50.000 ₺ için borçlunun isteği üzerine aynı tutarda yeni bir senet alınmıştır; alacak
    şüpheli duruma gelmemiştir. Bu işlemin yevmiye kaydı aşağıdakilerden hangisidir?
  secenekler:
    A: 102 Bankalar (B) 70.000 ₺, 121 Alacak Senetleri (B) 50.000 ₺ / 121 Alacak Senetleri (A) 120.000 ₺
    B: 102 Bankalar (B) 70.000 ₺, 127 Diğer Ticari Alacaklar (B) 50.000 ₺ / 121 Alacak Senetleri (A) 120.000 ₺
    C: 102 Bankalar (B) 70.000 ₺, 128 Şüpheli Ticari Alacaklar (B) 50.000 ₺ / 121 Alacak Senetleri (A) 120.000 ₺
    D: 102 Bankalar (B) 120.000 ₺ / 121 Alacak Senetleri (A) 120.000 ₺
    E: 102 Bankalar (B) 70.000 ₺, 120 Alıcılar (B) 50.000 ₺ / 121 Alacak Senetleri (A) 120.000 ₺
  dogru: A
  aciklama:
    dogru_neden: Eski senet 121 hesabının alacağına kapatılır (120.000 ₺); tahsil edilen 70.000 ₺ için 102 Bankalar borçlandırılır,
      yenilenen kısım için alınan yeni senet 121 hesabına borç yazılır (50.000 ₺). Toplam borç ve alacak 120.000 ₺'dir.
    celdiriciler:
      B: Yeni senet alındığı için kalan tutar senetsiz bir alacak değil, senetli alacaktır; 127 kullanılamaz.
      C: Alacak şüpheli duruma gelmediğinden 128 kullanılmaz; yenilenen kısım normal senetli alacaktır.
      D: Tahsil edilen tutar yalnızca 70.000 ₺'dir; 120.000 ₺'nin bankaya girdiği varsayılamaz.
      E: Yeni senet alındığı için kalan tutar senetsiz alacak olarak 120'de izlenmez.
  kaynaklar:
  - mevzuat: 1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)
    madde: 121. Alacak Senetleri
    alinti: Alınan senet tutarları bu hesaba borç, tahsilinde ise alacak kaydedilir.
  - mevzuat: 1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)
    madde: 102. Bankalar
