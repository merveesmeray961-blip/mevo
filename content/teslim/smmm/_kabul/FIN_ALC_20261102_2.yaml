    alinti: Yabancı paralar borsa rayici ile değerlenir. Borsa rayicinin takarrüründe muvazaa olduğu anlaşılırsa bu rayiç
      yerine alış bedeli esas alınır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 280/3
    alinti: Bu madde hükmü yabancı para ile olan senetli veya senetsiz alacaklar ve borçlar hakkında da caridir.
