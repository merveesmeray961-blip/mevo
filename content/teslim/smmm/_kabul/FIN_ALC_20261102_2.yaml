  kok: Tekdüzen Hesap Planı'na göre 326 Alınan Depozito ve Teminatlar hesabının işleyişine ilişkin aşağıdaki ifadelerden hangisi
    **yanlıştır**?
  secenekler:
    A: Alınan depozito ve teminatlar hesabın alacağına kaydedilir.
    B: Geri verilen depozito ve teminatlar hesabın borcuna kaydedilir.
    C: Hesaba sayılan depozito ve teminatlar hesabın borcuna kaydedilir.
    D: Hesap, belli sözleşmeler nedeniyle gerçekleşecek bir alacağın karşılığı olarak alınan değerleri izler.
    E: Alınan depozito ve teminatlar hesabın borcuna, geri verilenler alacağına kaydedilir.
  dogru: E
  aciklama:
    dogru_neden: 326 hesabında alınan depozito ve teminatlar hesabın alacağına, geri verilenler veya hesaba sayılanlar borcuna
      kaydedilir. Alınanların borca, geri verilenlerin alacağa yazıldığını söyleyen ifade işleyişi tersine çevirdiği için
      yanlıştır.
    celdiriciler:
      A: Alınan teminatların hesabın alacağına yazılması işleyişe uygundur.
      B: Geri verilenlerin hesabın borcuna yazılması işleyişe uygundur.
      C: Hesaba sayılan tutarların hesabın borcuna yazılması işleyişe uygundur.
      D: Hesabın kapsamına ilişkin bu açıklama Tekdüzen Hesap Planı'ndaki tanıma uygundur.
  kaynaklar:
  - mevzuat: 1 Sıra No'lu Muhasebe Sistemi Uygulama Genel Tebliği (Tekdüzen Hesap Planı)
    madde: 326. Alınan Depozito ve Teminatlar
    alinti: 'Üçüncü kişilerin belli bir işi yapmalarını, aldıkları bir değeri geri vermelerini sağlamak amacıyla ve belli
      sözleşmeler nedeniyle gerçekleşecek bir alacağın karşılığı olarak alınan depozito ve teminat niteliğindeki değerlerin
      izlendiği hesaptır. İşleyişi : Alınan depozito ve teminatlar bu hesabın alacağına, geri verilenler veya hesaba sayılanlar
      borcuna kaydedilir.'
