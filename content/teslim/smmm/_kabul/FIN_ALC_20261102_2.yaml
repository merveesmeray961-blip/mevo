  secenekler:
    A: Yabancı para ile olan alacaklar her durumda yalnızca kayıt tarihindeki alış bedeliyle değerlenir; borsa rayici dikkate
      alınmaz.
    B: Yabancı paralar borsa rayici ile değerlenir; bu hüküm yabancı para ile olan senetli veya senetsiz alacakları da kapsar.
    C: Borsa rayicinin takarrüründe muvazaa olduğu anlaşılsa bile borsa rayici esas alınır; alış bedeline geçilmez.
    D: Borsa rayici ile değerleme yalnızca senetsiz yabancı para alacaklarına uygulanır, senetli alacaklar kapsam dışındadır.
    E: Yabancı paranın borsada rayici yoksa alacak değerlenemez ve kayıt değerinde bırakılır; kur belirlenmez.
  dogru: B
  aciklama:
    dogru_neden: VUK md. 280 uyarınca yabancı paralar borsa rayici ile değerlenir; madde hükmü yabancı para ile olan senetli
      veya senetsiz alacaklar ve borçlar hakkında da geçerlidir.
    celdiriciler:
      A: Alış bedeli, ancak borsa rayicinin takarrüründe muvazaa anlaşılırsa esas alınır; genel kural borsa rayicidir.
      C: Borsa rayicinin takarrüründe muvazaa anlaşılırsa rayiç yerine alış bedeli esas alınır.
      D: Madde hükmü senetli ve senetsiz tüm yabancı para alacaklarını kapsar; yalnızca senetsiz alacaklara özgü değildir.
      E: Borsada rayici yoksa değerlemeye uygulanacak kuru Maliye Bakanlığı belirler; alacak değerlenemez denmez.
  kaynaklar:
