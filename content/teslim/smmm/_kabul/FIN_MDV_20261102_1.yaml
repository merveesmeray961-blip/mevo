  kok: '(D2) A.Ş., 1 Ocak 2025''te 90.000 ₺ bedelle aldığı demirbaşa normal amortisman yöntemiyle yıllık %20 oranında amortisman
    ayırmaktadır. Kalıntı değer yoktur.


    31.12.2026 tarihinde demirbaşın net defter değeri kaç ₺''dır?'
  secenekler:
    A: 18.000 ₺
    B: 36.000 ₺
    C: 54.000 ₺
    D: 72.000 ₺
    E: 90.000 ₺
  dogru: C
  aciklama:
    dogru_neden: Yıllık amortisman 90.000 × %20 = 18.000 ₺; iki yılda birikmiş amortisman 36.000 ₺'dır. Net defter değeri
      90.000 − 36.000 = 54.000 ₺.
    celdiriciler:
      A: Bu tutar yıllık amortisman giderini gösterir.
      B: Bu tutar birikmiş amortismandır; net defter değeri maliyetten birikmiş amortismanın düşülmesiyle bulunur.
      D: Yalnızca bir yıllık amortisman düşülmüştür.
      E: Maliyet bedelidir.
    hesap_adimlari:
    - Yıllık amortisman = 18.000 ₺
    - Birikmiş amortisman = 36.000 ₺
    - Net defter değeri = 54.000 ₺
