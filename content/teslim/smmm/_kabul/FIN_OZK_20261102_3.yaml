  unite: Özkaynak işlemleri
  konu: OZK
  kazanim: iç kaynaklardan artırım
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: Ödenmiş sermayesi 2.000.000 ₺ olan anonim şirketin bilançosunda 540 Yasal Yedekler 1.350.000 ₺, 542 Olağanüstü Yedekler
    300.000 ₺ ve 570 Geçmiş Yıllar Kârları 200.000 ₺'dir. Olağanüstü yedek ve geçmiş yıl kârları amaca özgülenmemiştir. TTK
    md. 462 ve 519/3'e göre iç kaynaklardan sermayeye dönüştürülebilecek en yüksek tutar kaç ₺'dir?
  secenekler:
    A: 85.000 ₺
    B: 500.000 ₺
    C: 850.000 ₺
    D: 1.350.000 ₺
    E: 1.850.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Genel kanuni yedek akçe sermayenin yarısını (1.000.000 ₺) aşmadığı sürece belirli amaçlar dışında kullanılamaz;
      yarıyı aşan 1.350.000 − 1.000.000 = 350.000 ₺ serbestçe kullanılabilir. Toplam 350.000 + 300.000 + 200.000 = 850.000
      ₺''dir. Püf noktaları: Kanuni yedeğin yalnızca sermayenin yarısını aşan kısmı serbesttir. Yedeğin tamamını toplamak
      tipik hatadır.'
    celdiriciler:
      A: 85.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 500.000 ₺ yalnızca olağanüstü yedek ve geçmiş yıl kârlarıdır; kanuni yedeğin serbest kısmı da eklenebilir.
      D: 1.350.000 ₺ kanuni yedeğin tamamıdır; sermayenin yarısına kadar olan kısım kullanılamaz.
      E: 1.850.000 ₺, kanuni yedeğin tamamı dahil edilerek bulunur; sermayenin yarısına kadar olan kısım sermayeye eklenemez.
    hesap_adimlari:
    - Serbest kanuni yedek = 1.350.000 − 1.000.000 = 350.000
    - Toplam = 350.000 + 300.000 + 200.000 = 850.000 ₺
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 462/1
    alinti: Esas sözleşme veya genel kurul kararıyla ayrılmış ve belirli bir amaca özgülenmemiş yedek akçeler ile kanuni yedek
      akçelerin serbestçe kullanılabilen kısımları ve mevzuatın bilançoya konulmasına ve sermayeye eklenmesine izin verdiği
      fonlar sermayeye dönüştürülerek sermaye iç kaynaklardan artırılabilir.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 519/3
    alinti: Genel kanuni yedek akçe sermayenin veya çıkarılmış sermayenin yarısını aşmadığı takdirde, sadece zararların kapatılmasına,
      işlerin iyi gitmediği zamanlarda işletmeyi devam ettirmeye veya işsizliğin önüne geçmeye ve sonuçlarını hafifletmeye
      elverişli önlemler alınması için kullanılabilir.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (1350000 - 2000000 / 2) + 300000 + 200000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
