- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: FIN
  unite: Özkaynak işlemleri
  konu: OZK
  kazanim: primli sermaye artırımı (520)
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: Anonim şirket nakdî sermaye artırımıyla 100.000 adet yeni pay çıkaracaktır. Payların itibari değeri 10 ₺, çıkarma fiyatı
    13 ₺'dir. TTK md. 459/3 ve 344'e göre artırım için tescilden önce ödenmesi gereken en az tutar kaç ₺'dir?
  secenekler:
    A: 55.000 ₺
    B: 250.000 ₺
    C: 300.000 ₺
    D: 550.000 ₺
    E: 1.300.000 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Artırımda bedellerin ödenmesine 344 üncü madde kıyasen uygulanır. İtibari değer 1.000.000 ₺''nin yüzde yirmibeşi
      250.000 ₺ ve primin tamamı 100.000 × 3 = 300.000 ₺ tescilden önce ödenir; toplam 550.000 ₺''dir. Püf noktaları: Artırımda
      da kuruluştaki ödeme rejimi kıyasen uygulanır: nominalin dörtte biri ve primin tamamı. Çıkarma fiyatının tamamını veya
      yalnız nominali yazmak tipik hatadır.'
    celdiriciler:
      A: 55.000 ₺, doğru sonucun bir basamak kaydırılmış hâlidir.
      B: 250.000 ₺ yalnızca itibari değerin yüzde yirmibeşidir; prim de tescilden önce ödenir.
      C: 300.000 ₺ yalnızca primdir; itibari değerin yüzde yirmibeşi de ödenmelidir.
      E: 1.300.000 ₺ toplam çıkarma bedelidir; itibari değerin kalan kısmı sonradan ödenebilir.
    hesap_adimlari:
    - İtibari değer 1.000.000; %25 = 250.000
    - Prim = 300.000
    - Toplam 550.000 ₺
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 459/3
    alinti: bedellerin ödenmesine 344 ve 345 inci, halka arz edilecek paylara 346 ncı, ihraç edilecek paylara 347 nci madde
      kıyas yoluyla uygulanır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 344/1
    alinti: Nakden taahhüt edilen payların itibarî değerlerinin en az yüzde yirmibeşi tescilden önce, gerisi de şirketin tescilini
      izleyen yirmidört ay içinde ödenir. Payların çıkarma primlerinin tamamı tescilden önce ödenir.
  gecerlilik:
    baslangic: '2012-07-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 100000 * 10 * 0.25 + 100000 * 3
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
