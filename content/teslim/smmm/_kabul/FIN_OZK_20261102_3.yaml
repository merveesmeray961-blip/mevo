      bedel ödenir.
  dogru: B
  aciklama:
    dogru_neden: Md. 462/3 uyarınca artırım tescille kesinleşir ve o anda mevcut pay sahipleri paylarının sermayeye oranına
      göre bedelsiz payları kendiliğinden iktisap eder.
    celdiriciler:
      A: İktisap genel kurul kararıyla değil tescille gerçekleşir ve başvuru gerektirmez.
      C: İktisap pay senetlerinin basılıp dağıtılmasına bağlı değildir; tescille kendiliğinden gerçekleşir ve tüm mevcut pay
        sahiplerini kapsar.
      D: İç kaynaklı artırımda ortaktan bedel alınmaz; iktisap ödemeye bağlı değildir.
      E: Bedelsiz paylar paylarının sermayeye oranına göre tüm mevcut pay sahiplerine düşer; yönetim kurulu seçim yapamaz.
