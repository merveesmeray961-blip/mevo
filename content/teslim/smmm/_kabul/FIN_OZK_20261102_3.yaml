  kok: İç kaynaklardan yapılan sermaye artırımında bedelsiz payların iktisabı 6102 sayılı TTK md. 462/3'e göre ne zaman ve
    nasıl gerçekleşir?
  secenekler:
    A: Genel kurul kararı tarihinde, pay sahiplerinin başvurusu üzerine
    B: Artırımın tescili ile mevcut pay sahipleri, payları oranında bedelsiz payları kendiliğinden iktisap eder.
    C: Pay senetlerinin basılıp dağıtıldığı tarihte, yalnızca başvuran ortaklar iktisap eder.
    D: Artırım bedelinin ortaklarca ödendiği tarihte
