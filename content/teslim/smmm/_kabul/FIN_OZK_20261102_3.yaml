  kok: 6102 sayılı TTK md. 511'e göre yönetim kurulu üyelerine kazanç payı verilebilmesi için aşağıdakilerden hangisi gerekir?
  secenekler:
    A: Genel kurul kararı olmaksızın yönetim kurulunca kendi aralarında dağıtılabilir ve kâr payı dağıtımı beklenmez.
    B: Kanuni yedek akçe ayrılmadan önce brüt kârdan verilebilir.
    C: Zarar edilen yıllarda da sermayeden karşılanarak verilebilir.
    D: Yalnızca pay sahiplerine hiç kâr payı dağıtılmamışsa verilebilir.
    E: Net kârdan, kanuni yedek ayrımı ve yüzde beş kâr payı dağıtımından sonra verilebilir.
  dogru: E
  aciklama:
    dogru_neden: Md. 511/1'e göre kazanç payları sadece net kârdan ve ancak kanuni yedek akçe için belirli ayrım yapıldıktan
      ve pay sahiplerine ödenmiş sermayenin yüzde beşi (veya esas sözleşmedeki daha yüksek oran) kâr payı dağıtıldıktan sonra
      verilebilir.
    celdiriciler:
      A: Kazanç payı için md. 511 genel kurul kararını dışlayan bir hüküm içermez; ölçüt, net kâr ve kâr payı sıralamasıdır.
      B: Kazanç payı net kârdan ve kanuni yedek ayrımından sonra verilebilir; brüt kâr ölçüt değildir.
      C: Kazanç payı sadece net kârdan verilebilir; sermayeden karşılanamaz.
      D: Önce pay sahiplerine yüzde beş kâr payı dağıtılması gerekir; hiç dağıtılmamışsa kazanç payı verilemez.
