  kok: '(K1) A.Ş., önceki dönemde 18.000 ₺ stok değer düşüklüğü karşılığı ayırdığı, maliyeti 100.000 ₺ olan mal grubunun tamamını
    bu dönemde 95.000 ₺''ya (KDV hariç) satmıştır. Karşılık satış nedeniyle tamamen kapatılmıştır.


    Bu işlemin dönem kârına net etkisi aşağıdakilerden hangisidir?'
  secenekler:
    A: 23.000 ₺ zarar
    B: 5.000 ₺ zarar
    C: 5.000 ₺ kâr
    D: 13.000 ₺ kâr
    E: 18.000 ₺ kâr
  dogru: D
  aciklama:
    dogru_neden: 'Satış sonucu 95.000 − 100.000 = 5.000 ₺ zarar doğar; satış nedeniyle kapatılan 18.000 ₺ karşılık 158 borç
      / 644 alacak ile gelir olur. Net etki 18.000 − 5.000 = 13.000 ₺ kârdır. Püf noktaları: (1) Satış zararı ile karşılık
      iptali geliri ayrı hesaplanır. (2) İşaretlere dikkat edin; kâr ve zarar şıkları birlikte verilmiştir.'
    celdiriciler:
      A: Karşılık gider sayılmıştır; oysa satış nedeniyle kapatılan karşılık 644 hesabında gelir olarak izlenir.
      B: Karşılığın kapatılmasından doğan 18.000 ₺ gelir dikkate alınmamıştır.
      C: Satış bedeli ile maliyet arasındaki farkın mutlak değeri kâr sanılmıştır; maliyet satış bedelinden büyüktür.
      E: Yalnızca karşılığın kapatılmasından doğan gelir alınmıştır; satış zararı dikkate alınmamıştır.
    hesap_adimlari:
    - Satış sonucu = 95.000 − 100.000 = −5.000 ₺
    - Karşılık iptali geliri = 18.000 ₺
    - Net etki = 13.000 ₺ kâr
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 158 Stok Değer Düşüklüğü Karşılığı (-)
    alinti: Karşılık ayrılan stok kaleminin işletme içinde kullanılması ya da satılması halinde; ilgili stok hesabının alacağı
