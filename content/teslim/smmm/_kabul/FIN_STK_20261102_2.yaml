  unite: Stoklar ve ticari mallar
  konu: STK
  kazanim: FIFO ile brüt satış kârı
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: '(H1) Ticaret A.Ş.''nin Mayıs ayı stok hareketleri aşağıdadır; şirket FIFO uygulamaktadır.


    | Tarih | İşlem | Adet | Birim (₺) |

    |---|---|---|---|

    | 01.05 | Devir stok | 80 | 50,00 |

    | 06.05 | Alış | 120 | 52,50 |

    | 15.05 | Alış | 100 | 55,00 |

    | 28.05 | Satış | 220 | 120,00 (satış fiyatı) |


    KDV dikkate alınmayacaktır. Mayıs ayı brüt satış kârı kaç ₺''dır?'
  secenekler:
    A: 4.400 ₺
    B: 14.600 ₺
    C: 14.813,33 ₺
    D: 15.000 ₺
    E: 26.400 ₺
  dogru: D
  aciklama:
    dogru_neden: 'Satışlar 220 × 120 = 26.400 ₺. FIFO ile satılan 220 adet: 80 × 50 + 120 × 52,50 + 20 × 55 = 4.000 + 6.300
      + 1.100 = 11.400 ₺. Brüt kâr = 26.400 − 11.400 = 15.000 ₺. Püf noktaları: (1) FIFO''da son partiden yalnızca 20 adet
      çıkar. (2) Kalan stok değeri, ortalama ve LIFO sonuçları şıklarda tuzaktır.'
    celdiriciler:
      A: Bu tutar FIFO'ya göre kalan 80 adedin stok değeridir; kâr satışlar ile satılan malın maliyeti arasındaki farktır.
      B: Satılan malın maliyeti son giren ilk çıkar mantığıyla (11.800 ₺) bulunmuştur.
      C: Satılan malın maliyeti ağırlıklı ortalamayla (11.586,67 ₺) bulunmuştur; soruda FIFO uygulanmaktadır.
      E: Bu tutar satış hasılatıdır; maliyet düşülmemiştir.
    hesap_adimlari:
    - Hasılat = 220 × 120 = 26.400 ₺
    - SMM = 4.000 + 6.300 + 1.100 = 11.400 ₺
    - Brüt kâr = 15.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: md. 25
    alinti: kalan stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir.
  dogrulama:
    python: 'sonuc = 220 * 120 - (80 * 50 + 120 * 52.5 + 20 * 55)

      '
