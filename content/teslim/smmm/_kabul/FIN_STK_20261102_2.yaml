  soru_bicimi: yevmiye
  kok: '(J1) A.Ş.''nin 158 Stok Değer Düşüklüğü Karşılığı hesabında önceki dönemden gelen 25.000 ₺ alacak bakiyesi vardır.
    Dönem sonunda aynı mal grubunun maliyeti 180.000 ₺, net gerçekleşebilir değeri 165.000 ₺''dır. Karşılık, dönem sonundaki
    gerekli tutara ayarlanacaktır. Aksi belirtilmedikçe Tekdüzen Muhasebe Sistemi esas alınır.


    Dönem sonu kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 654 Karşılık Giderleri 15.000

      Alacak: 158 Stok Değer Düşüklüğü Karşılığı 15.000'
    B: 'Borç: 158 Stok Değer Düşüklüğü Karşılığı 25.000

      Alacak: 644 Konusu Kalmayan Karşılıklar 25.000'
    C: 'Borç: 644 Konusu Kalmayan Karşılıklar 10.000

      Alacak: 158 Stok Değer Düşüklüğü Karşılığı 10.000'
    D: 'Borç: 158 Stok Değer Düşüklüğü Karşılığı 10.000

      Alacak: 649 Diğer Olağan Gelir ve Karlar 10.000'
    E: 'Borç: 158 Stok Değer Düşüklüğü Karşılığı 10.000

      Alacak: 644 Konusu Kalmayan Karşılıklar 10.000'
  dogru: E
  aciklama:
    dogru_neden: 'Gerekli karşılık 180.000 − 165.000 = 15.000 ₺''dır; mevcut bakiye 25.000 ₺ olduğundan 10.000 ₺ fazladır.
      Fazla karşılık 158 borç / 644 alacak ile kapatılır (THP 158 ve 644). Püf noktaları: (1) Önce gerekli toplam karşılığı
      bulun, sonra bakiyeyle kıyaslayın. (2) Bakiye gerekenden büyükse fark iptal edilir, gider yazılmaz.'
    celdiriciler:
      A: 15.000 ₺ gereken toplam karşılıktır; mevcut bakiye 25.000 ₺ olduğundan karşılık artırılmaz, azaltılır.
      B: Karşılığın tamamı kapatılmaz; dönem sonunda 15.000 ₺ karşılık gereklidir.
      C: Taraflar ters yazılmıştır; karşılığın azaltılması 158'i borçlandırır.
      D: Aktifle ilgili karşılığın iptali THP'de 644 Konusu Kalmayan Karşılıklar hesabına yazılır; 649 genel bir hesaptır.
    hesap_adimlari:
    - Gerekli karşılık = 180.000 − 165.000 = 15.000 ₺
    - Fazla = 25.000 − 15.000 = 10.000 ₺
    - 158 B 10.000; 644 A 10.000
  kaynaklar:
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 158 Stok Değer Düşüklüğü Karşılığı (-)
    alinti: Karşılık ayrılan stok kaleminin işletme içinde kullanılması ya da satılması halinde; ilgili stok hesabının alacağı
      ile karşılaştırılarak daha önce ayrılan karşılık "644. Konusu Kalmayan Karşılıklar Hesabı"na aktarılarak kapatılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 644 Konusu Kalmayan Karşılıklar
    alinti: Aktifle ilgili olarak ayrılan karşılıklardan iptal edilen tutarlar bu hesapta izlenir.
