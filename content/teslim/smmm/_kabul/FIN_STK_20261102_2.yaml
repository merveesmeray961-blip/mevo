  kok: Üretim sırasında ortaya çıkan ve diğer stok hesaplarının hiçbirinin kapsamına girmeyen hurda ve artıklar Tekdüzen Hesap
    Planı'nda hangi hesapta izlenir?
  secenekler:
    A: 152 Mamuller
    B: 157 Diğer Stoklar
    C: 150 İlk Madde ve Malzeme
    D: 153 Ticari Mallar
    E: 159 Verilen Sipariş Avansları
  dogru: B
  aciklama:
    dogru_neden: 157 Diğer Stoklar hesabı, yukarıdaki stok kalemlerinin hiçbirinin kapsamına alınmayan ürün, artık ve hurda
      gibi kalemlerin izlendiği hesaptır.
    celdiriciler:
      A: 152 üretilen mamullerin izlendiği hesaptır.
      C: 150 üretimde kullanılacak hammadde, yardımcı madde ve malzemeler içindir.
      D: 153 değişikliğe uğratılmadan satılacak ticari mallar içindir.
      E: 159 sipariş edilen stoklar için verilen avansları gösterir.
  kaynaklar:
