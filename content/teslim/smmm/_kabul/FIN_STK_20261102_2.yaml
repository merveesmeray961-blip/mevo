  kok: '(I1) A.Ş., satın aldığı ticari malların depoya taşınması için nakliyeciye 3.000 ₺ + %20 KDV tutarlı fatura karşılığı
    ödeme yapmış ve ödemeyi bankadan gerçekleştirmiştir. Ödenen KDV indirilebilir niteliktedir. Aksi belirtilmedikçe Tekdüzen
    Muhasebe Sistemi esas alınır.


    Nakliye giderinin kaydı aşağıdakilerden hangisidir?'
  secenekler:
    A: 'Borç: 760 Pazarlama Satış ve Dağıtım Giderleri 3.000

      Borç: 191 İndirilecek KDV 600

      Alacak: 102 Bankalar 3.600'
    B: 'Borç: 153 Ticari Mallar 3.600

      Alacak: 102 Bankalar 3.600'
    C: 'Borç: 153 Ticari Mallar 3.000

      Borç: 191 İndirilecek KDV 600

      Alacak: 102 Bankalar 3.600'
    D: 'Borç: 153 Ticari Mallar 3.000

      Borç: 391 Hesaplanan KDV 600

      Alacak: 102 Bankalar 3.600'
    E: 'Borç: 770 Genel Yönetim Giderleri 3.000

      Borç: 191 İndirilecek KDV 600

      Alacak: 102 Bankalar 3.600'
  dogru: C
  aciklama:
    dogru_neden: Stokların maliyeti, mevcut konumuna ve durumuna getirilmesi için katlanılan taşıma maliyetlerini içerir (TMS
      2 md. 10-11). Nakliye 153 hesabına borç yazılır; KDV (3.000 × %20 = 600 ₺) 191'e borç, ödenen 3.600 ₺ 102'ye alacak
      kaydedilir.
    celdiriciler:
      A: Alış nakliyesi malların mevcut konumuna getirilmesi için katlanılan taşıma maliyetidir ve stok maliyetine eklenir;
        760 satış sonrası dağıtım giderleri içindir.
      B: KDV maliyete eklenmiştir; indirilebilir KDV 191 hesabında izlenir.
      D: Ödenen KDV 191 İndirilecek KDV'ye borç yazılır; 391 Hesaplanan KDV satışlarla ilgilidir.
      E: Alış nakliyesi genel yönetim gideri değildir; stok maliyetinin parçasıdır.
    hesap_adimlari:
    - KDV = 3.000 × %20 = 600 ₺
    - 153 B 3.000; 191 B 600; 102 A 3.600
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: md. 11
    alinti: Stokların satın alma maliyetleri; satın alma fiyatı, ithalat vergileri ve diğer vergiler (işletme tarafından daha
      sonra vergi idaresinden iade alınabilecekler hariç) ile mamul, malzeme ve hizmetlerin edinimiyle doğrudan ilişkilendirilebilen
      taşıma, yükleme-boşaltma ve diğer maliyetleri içerir. Ticari iskontolar, indirimler ve diğer benzer kalemler satın alma
      maliyetleri belirlenirken indirim konusu yapılır.
  - mevzuat: Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:1), Ek V Hesap Planı Açıklamaları
    madde: 191 İndirilecek KDV
    alinti: 'Her türlü mal ve hizmetin satın alınması sırasında satıcılara ödenen katma değer vergisinin kaydedildiği ve izlendiği
      hesaptır. İşleyişi : Mal ve hizmet alımlarından doğan indirilecek katma değer vergisi bu hesaba borç,'
