    B: Normalin üstünde gerçekleşen fire ve kayıplar
    C: Stokların bulunduğu yere getirilmesine ilişkin nakliye maliyetleri
    D: Direkt işçilik giderleri
    E: Ticari iskontoların düşülmüş hâli
  dogru: B
  aciklama:
    dogru_neden: BOBİ FRS'ye göre normalin üstünde gerçekleşen fire ve kayıplar ile zorunlu olmayan depolama giderleri, katkısı
      olmayan genel yönetim giderleri ve satış giderleri stok maliyetine dahil edilmez, oluştukları dönemde gider yazılır.
    celdiriciler:
      A: İade alınamayan vergiler satın alma maliyetine dahildir (BOBİ FRS 6.7).
