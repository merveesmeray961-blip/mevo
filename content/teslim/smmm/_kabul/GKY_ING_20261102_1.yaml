  kok: 'Choose the correct option to complete the sentence.


    Students ______ bring their phones into the exam room; it is strictly forbidden.'
  secenekler:
    A: don't have to
    B: might
    C: mustn't
    D: can
    E: would
  dogru: C
  aciklama:
    dogru_neden: Yasak bildirmek için 'mustn't' kullanılır. 'Don't have to' ise zorunlulukların olmadığını anlatır.
    celdiriciler:
      A: '''Don''t have to'' zorunlu olmadığını bildirir; yasak anlamını vermez.'
      B: '''Might'' olasılık bildirir; yasağı anlatmaz.'
      D: '''Can'' izin ya da yeterlilik bildirir; yasakla çelişir.'
      E: '''Would'' bu bağlamda yasağı anlatmaz.'
