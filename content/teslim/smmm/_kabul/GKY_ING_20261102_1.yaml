  kok: 'Read the passage and answer the question.


    Many people think that sleeping less makes them more productive. However, studies show that people who sleep fewer than
    six hours a night find it harder to concentrate and often make more mistakes at work.


    According to the passage, people who sleep fewer than six hours a night ______.'
  secenekler:
    A: work longer hours than other people
    B: become more productive during the day
    C: never feel tired when they are at work
    D: find it easier to concentrate on tasks
    E: often make more mistakes during work
  dogru: E
  aciklama:
    dogru_neden: Parçada, altı saatten az uyuyan kişilerin konsantre olmakta zorlandıkları ve işte daha çok hata yaptıkları
      belirtilmektedir.
    celdiriciler:
      A: Parçada çalışma saatlerinden söz edilmez.
      B: Parça, az uykunun verimliliği artırdığı düşüncesine karşı çıkar.
      C: Parçada yorgunluk hissetmemekten söz edilmez.
      D: 'Parçada tam tersi söylenir: konsantre olmak zorlaşır.'
