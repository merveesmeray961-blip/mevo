  kok: 'Read the passage and answer the question.


    The town''s library, which was built in 1895, was going to be closed last year because of the high cost of repairs. But
    after local residents raised money through a series of charity events, the building was saved. Today it is used for community
    classes as well as for lending books.


    What can be understood from the passage?'
  secenekler:
    A: The library was built with money from charity events.
    B: The library now offers only community classes.
    C: The government paid for the repairs.
    D: The library was closed permanently last year.
    E: Local people's efforts saved the library.
  dogru: E
  aciklama:
    dogru_neden: 'Parçaya göre kütüphane yüksek onarım maliyeti nedeniyle kapanacaktı; ancak yerel halk hayır etkinlikleriyle
      para toplayarak binayı kurtarmıştır. Püf noktaları: ''Was going to be closed'' kapanmanın gerçekleşmediğini, ''as well
      as'' ise kitap ödünç vermenin sürdüğünü gösterir; ''built'' ile ''saved'' sözcüklerini karıştırmayın.'
    celdiriciler:
      A: Hayır etkinlikleri binanın yapımı için değil, kapanmasını önlemek için düzenlenmiştir.
      B: '''As well as'' ifadesi, kitap ödünç vermenin de sürdüğünü gösterir.'
      C: Parçada onarım giderlerini devletin karşıladığı belirtilmez; halk para toplamıştır.
      D: Parçaya göre kütüphane kapanmaktan kurtarılmıştır.
