  kok: 'Choose the word that best completes the sentence.


    The manager was ill, so the meeting was ______ until next week.'
  secenekler:
    A: postponed
    B: cancelled
    C: held
    D: announced
    E: interrupted
  dogru: A
  aciklama:
    dogru_neden: Yönetici hasta olduğu için toplantı 'next week'e kadar ertelenmiştir. 'Postpone' (ertelemek) 'until' ile
      birlikte kullanılır ve ileri bir tarihe bırakmayı anlatır.
    celdiriciler:
      B: '''Cancelled until next week'' anlamsızdır; iptal edilen toplantı ileri bir tarihe ertelenmiş olmaz.'
      C: '''Held'' toplantının yapıldığını bildirir; ''until next week'' ile birlikte ertelemeyi anlatmaz.'
      D: '''Announced'' toplantının duyurulduğunu bildirir; cümledeki erteleme anlamını vermez.'
      E: '''Interrupted'' toplantının yarıda kesildiğini bildirir; ''until next week'' ile uyumsuzdur.'
