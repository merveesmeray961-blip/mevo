  kok: '''He used to go to the gym every morning, but he doesn''t anymore.'' cümlesinin Türkçe karşılığı aşağıdakilerden hangisidir?'
  secenekler:
    A: Her sabah spor salonuna gitmek zorundaydı, ama artık gitmiyor.
    B: Her sabah spor salonuna gidecekti, ama gidemedi.
    C: Sabahları spor salonuna gitmeyi bırakmak istiyor.
    D: Eskiden her sabah spor salonuna giderdi, artık gitmiyor.
    E: Her sabah spor salonuna gitmeyi sevmezdi, ama artık gidiyor.
  dogru: D
  aciklama:
    dogru_neden: '''Used to'' geçmişte sürdürülen ama artık sürdürülmeyen alışkanlıkları anlatır. ''He doesn''t anymore''
      bölümü bırakılmış olduğunu gösterir; doğru çeviri ''Eskiden ... giderdi, artık gitmiyor'' biçimindedir.'
    celdiriciler:
      A: '''Used to'' alışkanlığı anlatır; zorunluluk (had to) anlamı yoktur.'
      B: Cümle geçmişteki bir planı değil, geçmiş alışkanlığı ve sonradan bırakılmasını anlatır.
      C: Cümlede bırakma isteği değil, bırakılmış bir alışkanlık vardır.
      E: Anlam tersine çevrilmiştir; kişi artık gitmemektedir.
