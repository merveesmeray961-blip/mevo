  kok: 'Choose the correct option to complete the sentence.


    If I ______, I would help you with your project.'
  secenekler:
    A: had enough time
    B: have time
    C: will have enough time
    D: would have enough time
    E: am having enough time
  dogru: A
  aciklama:
    dogru_neden: Ana cümlede 'would help' olduğu için ikinci tip koşul cümlesi kurulmuştur. If bölümü simple past ('had enough
      time') olmalıdır.
    celdiriciler:
      B: Gerçek (birinci tip) koşul yapısı kullanılırsa ana cümlede 'will' gerekir; cümledeki 'would help' ikinci tip koşul
        ister.
      C: If cümleciğinde 'will' kullanılmaz.
      D: If cümleciğinde 'would' kullanılmaz; ikinci tip koşulda if-bölümü simple past olur.
      E: Sürekli şimdiki zaman bu koşul yapısında kullanılmaz.
