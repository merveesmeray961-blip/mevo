  kok: 'Choose the correct option to complete the sentence.


    Ayşe ______ in Izmir since 2019, so she knows the city very well.'
  secenekler:
    A: lives
    B: lived
    C: has lived
    D: was living
    E: will have lived
  dogru: C
  aciklama:
    dogru_neden: '''Since 2019'' geçmişte başlayıp hâlâ süren bir durumu belirtir. Bu yapı present perfect (''has lived'')
      ile kurulur.'
    celdiriciler:
      A: Present simple, 'since' ile başlayan geçmişten bugüne süren süreyi anlatmaz.
      B: Simple past, süreç bitmiş bir eylemi bildirir; 'she knows the city' ifadesi hâlâ orada yaşadığını gösterir.
      D: Past continuous, geçmişteki bir anı anlatır; 'since 2019' ile kullanılmaz.
      E: Future perfect, gelecekteki bir ana kadar süren eylem için kullanılır; cümle şimdiye kadar olanı anlatır.
