  kok: 'Choose the best option to complete the dialogue.


    A: I''ve lost my phone and I need to call my mother.

    B: ______'
  secenekler:
    A: She lives in a small village.
    B: Why don't you call her from mine?
    C: Phones are getting more expensive.
    D: I called her yesterday, too.
    E: It was a gift from my uncle.
  dogru: B
  aciklama:
    dogru_neden: A telefonunu kaybettiğini ve annesini aramak istediğini söylüyor. B'nin 'Why don't you call her from mine?'
      (Onu benimkinden arasana) önerisi bu ihtiyaca uygun doğal bir yanıttır.
    celdiriciler:
      A: Konuşmacı A'nın telefonunu bulması ya da annesini araması ile ilgili bir çözüm sunmaz.
      C: Genel bir yorumdur; A'nın ihtiyacına yanıt vermez.
      D: Bağlamla ilgisizdir; A'nın annesini B'nin aradığı söylenmemiştir.
      E: A'nın telefonu kaybetmesiyle ilgili bir çözüm sunmaz.
