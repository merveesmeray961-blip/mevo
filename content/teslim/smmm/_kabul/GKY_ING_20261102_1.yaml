  kok: 'Choose the correct option to complete the sentence.


    I''m really looking forward to ______ you at the party next Saturday.'
  secenekler:
    A: see
    B: seeing
    C: saw
    D: have seen
    E: be seeing
  dogru: B
  aciklama:
    dogru_neden: '''Look forward to'' kalıbındaki ''to'' bir edattır; bu nedenle ardından fiilin -ing biçimi (''seeing'')
      gelir.'
    celdiriciler:
      A: '''Look forward to'' kalıbından sonra fiilin yalın hâli değil -ing biçimi gelir.'
      C: '''To'' edatından sonra geçmiş zaman fiili kullanılmaz.'
      D: '''Look forward to'' kalıbından sonra -ing biçimi gerekir; perfect biçim kullanılmaz.'
      E: '''Look forward to'' kalıbından sonra doğrudan -ing biçimi gelir; ''be'' eklenmez.'
