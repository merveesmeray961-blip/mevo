  kok: 'Which of the following is closest in meaning to the sentence below?


    Hardly had she left the house when it started to rain.'
  secenekler:
    A: She left the house after it had started to rain.
    B: She left the house although it was raining.
    C: It rarely rained when she left the house.
    D: It started raining as soon as she left home.
    E: It had been raining before she left the house.
  dogru: D
  aciklama:
    dogru_neden: '''Hardly ... when'' kalıbı ''as soon as'' (-ır -mez) anlamındadır. Cümle, kadının evden çıkmasının hemen
      ardından yağmurun başladığını anlatır. Püf noktaları: ''Hardly'' başa gelince özne-yardımcı fiil yer değiştirir (inversion)
      ve ''when'' ile birlikte ''hemen'' anlamını verir; ''rarely'' (nadiren) çeldiricisine ve ''before/after'' sıralamasına
      dikkat edin.'
    celdiriciler:
      A: Yağmur, evden çıkıştan önce değil sonra başlamıştır.
      B: Yağmur çıkış sırasında zaten yağmıyordu; 'although' anlamı yoktur.
      C: '''Hardly'' burada ''neredeyse hiç'' değil, ''hemen'' anlamındaki ''hardly ... when'' kalıbındadır.'
      E: Yağmur, kadın evden çıkmadan önce başlamamıştır.
