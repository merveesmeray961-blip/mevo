  kok: '5x + 9 = 2x + 30 denklemini sağlayan x değeri için aşağıdaki yargılardan hangileri doğrudur?

    I. x = 7''dir.

    II. x² = 36''dır.

    III. x, 3''ün katıdır.'
  secenekler:
    A: Yalnız I
    B: Yalnız II
    C: Yalnız III
    D: I ve II
    E: I ve III
  dogru: A
  aciklama:
    dogru_neden: 5x − 2x = 30 − 9 olduğundan 3x = 21 ve x = 7'dir (I doğru). x² = 49'dur (II yanlış) ve 7, 3'ün katı değildir
      (III yanlış).
    hesap_adimlari:
    - 3x = 21
    - x = 7
    - x² = 49
    celdiriciler:
      B: II yanlıştır; x = 7 ise x² = 49'dur.
      C: III yanlıştır; 7, 3'ün katı değildir.
      D: II yanlıştır; x² = 49'dur.
      E: III yanlıştır; 7, 3'e tam bölünmez.
