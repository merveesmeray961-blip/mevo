  kok: Bir depoda her birinde 24 parça bulunan 150 koli vardır. Tüm parçalar, her biri 40 parça alan kutulara eşit biçimde
    yerleştirilecektir. Buna göre kaç kutu gerekir?
  secenekler:
    A: '9'
    B: '80'
    C: '90'
    D: '144'
    E: '900'
  dogru: C
  aciklama:
    dogru_neden: Toplam parça sayısı 150 × 24 = 3.600'dür. Her kutuya 40 parça konulduğundan gereken kutu sayısı 3.600 ÷ 40
      = 90'dır.
    hesap_adimlari:
    - 'Toplam parça: 150 × 24 = 3.600'
    - 'Kutu sayısı: 3.600 ÷ 40 = 90'
    celdiriciler:
      A: 3.600 yerine 360 parça bulunması (ondalık kayması) hâlinde elde edilir.
      B: Toplam parça sayısı 3.200 bulunursa ortaya çıkar; 150 × 24 = 3.600'dür.
      D: Kutu kapasitesini 40 yerine 25 almakla (3.600 ÷ 25) bulunur.
      E: 3.600 ÷ 4 işlemiyle bulunur; kutu kapasitesi 4 değil 40'tır.
  kaynaklar:
  - mevzuat: Genel bilgi — Matematik
    madde: '-'
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 150 * 24 // 40
  durum: taslak
  surum: 1
