  kok: 40.000 ₺'nin bir kısmı yıllık %12, kalan kısmı yıllık %18 basit faizle 1 yıllığına yatırılmıştır. 1 yıl sonunda toplam
    faiz geliri 5.700 ₺ olduğuna göre %18 faizle yatırılan tutar kaç ₺'dir?
  secenekler:
    A: '1.500'
    B: '15.000'
    C: '20.000'
    D: '25.000'
    E: '150.000'
  dogru: B
  aciklama:
    dogru_neden: 'Tüm para %12''den yatırılsaydı faiz 4.800 ₺ olurdu. Gerçek faiz 5.700 ₺ olduğundan fark 900 ₺''dir; her
      1 ₺''nin %12 yerine %18''e yatırılması 0,06 ₺ ek getirir. %18''lik kısım 900 ÷ 0,06 = 15.000 ₺''dir. Püf noktaları:
      Önce %12''ye yatan kısmı (25.000) bulup 40.000''den çıkarmak da aynı sonucu verir; sorulanın %18''lik kısım olduğuna
      dikkat edin.'
    hesap_adimlari:
    - '%12''ye yatırılan x olsun: 0,12x + 0,18(40.000 − x) = 5.700'
    - 7.200 − 0,06x = 5.700, x = 25.000
    - '%18''e yatırılan: 40.000 − 25.000 = 15.000'
    celdiriciler:
      A: 15.000'in ondalık kaymış biçimidir.
      C: Para iki eşit parçaya bölünürse faiz 6.000 ₺ olurdu; verilen faiz 5.700 ₺'dir.
      D: '%12 faizle yatırılan tutardır; soru %18''lik kısmı sormaktadır.'
      E: 15.000'in ondalık olarak büyütülmüş biçimidir.
  kaynaklar:
