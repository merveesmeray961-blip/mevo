      C: 1/3 yerine 1/4 alınarak (3/4 − 1/4) bulunur.
      D: 1/3 kesri 4/12 yerine 2/12 yazıldığında bulunur.
      E: Çıkarma yerine toplama yapılırsa bulunur.
