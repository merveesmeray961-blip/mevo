    - 'Ortalama: 1.200 ÷ 4 = 300'
    - '300''den büyük olanlar: Kadıköy (320), Çankaya (400)'
    celdiriciler:
      B: Kadıköy'ün 320 gönderisi de ortalama olan 300'ün üzerindedir.
      C: Bu iki şube ortalamanın altındadır (280 ve 200).
      D: Beşiktaş'ın 280 gönderisi ortalama olan 300'ün altındadır.
      E: Konak'ın 200 gönderisi ortalamanın altındadır; Kadıköy ortalamanın üzerindedir.
