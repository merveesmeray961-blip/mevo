  kok: Ali'nin parası Veli'nin parasının 3 katıdır. Ali, Veli'ye 120 ₺ verirse ikisinin parası eşit oluyor. Buna göre ikisinin
    toplam parası kaç ₺'dir?
  secenekler:
    A: '48'
    B: '240'
    C: '360'
    D: '480'
    E: '4.800'
  dogru: D
  aciklama:
    dogru_neden: Veli'nin parası v ise Ali'nin parası 3v'dir. Eşitlik için 3v − 120 = v + 120 olmalıdır; buradan v = 120 ve
      Ali'nin parası 360 ₺ bulunur. Toplam 120 + 360 = 480 ₺'dir.
    hesap_adimlari:
    - 3v − 120 = v + 120
    - 2v = 240, v = 120
    - 'Toplam: v + 3v = 4 × 120 = 480'
