    A: '90'
    B: '720'
    C: '900'
    D: '1.200'
    E: '9.000'
  dogru: C
  aciklama:
    dogru_neden: Bir işçinin bir günde ürettiği miktar 960 ÷ (8 × 12) = 10 parçadır. 6 işçi 15 günde 6 × 15 × 10 = 900 parça
      üretir.
    hesap_adimlari:
    - 'İşçi-gün başına üretim: 960 ÷ 96 = 10'
    - 6 × 15 × 10 = 900
    celdiriciler:
      A: 900'ün ondalık kaymış biçimidir.
      B: 6 işçinin 12 günde üreteceği miktardır; süre 15 gündür.
      D: 8 işçinin 15 günde üreteceği miktardır; işçi sayısı 6'dır.
      E: 900'ün ondalık olarak büyütülmüş biçimidir.
