  kok: İki doğal sayının en büyük ortak böleni (EBOB) 12, en küçük ortak katı (EKOK) 180'dir. Bu sayılardan biri 36 olduğuna
    göre diğeri kaçtır?
  secenekler:
    A: '5'
    B: '12'
    C: '48'
    D: '60'
    E: '2.160'
  dogru: D
  aciklama:
    dogru_neden: 'İki sayının çarpımı EBOB × EKOK''a eşittir: 36 × b = 12 × 180 = 2.160, buradan b = 60 bulunur. Kontrol:
      EBOB(36, 60) = 12 ve EKOK(36, 60) = 180''dir.'
    hesap_adimlari:
    - a × b = EBOB × EKOK
    - 36 × b = 12 × 180 = 2.160
    - b = 2.160 ÷ 36 = 60
    celdiriciler:
      A: EKOK'u 36'ya bölmekle bulunur; sayıların çarpımı EBOB × EKOK'a eşittir, EKOK'a değil.
      B: Bu değer sayıların EBOB'udur; diğer sayı değildir.
      C: 36 + 12 toplamıdır; iki sayının EBOB ve EKOK'a ilişkin çarpım kuralı kullanılmamıştır.
      E: Bu değer iki sayının çarpımıdır (12 × 180); diğer sayıyı bulmak için 36'ya bölmek gerekir.
  kaynaklar:
  - mevzuat: Genel bilgi — Matematik
    madde: '-'
    alinti: (genel bilgi)
