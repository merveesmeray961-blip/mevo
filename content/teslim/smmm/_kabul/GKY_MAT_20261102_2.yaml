    - 8 × 125 = 1.000
    - EKOK(8, 5) = 40 ; 1.000 ÷ 40 = 25
    celdiriciler:
      B: II yanlıştır; 1.000 = 8 × 125 olduğundan 8'in katı olan en büyük sayı 1.000'dir.
      C: III yanlıştır; 8 ve 5'in ortak katları 40'ın katlarıdır ve 1.000 ÷ 40 = 25 tanedir.
      D: II yanlıştır; 1.000, 8'in katıdır ve aralığa dahildir.
      E: III yanlıştır; hem 8'in hem 5'in katı olan 25 sayı vardır.
