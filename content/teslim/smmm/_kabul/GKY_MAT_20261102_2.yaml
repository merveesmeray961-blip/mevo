  kok: Bir torbada 60 kırmızı, 80 mavi ve 100 yeşil top bulunmaktadır. Torbadan bakmadan en az kaç top çekilirse çekilen toplar
    arasında kesinlikle her renkten en az bir top bulunur?
  secenekler:
    A: '3'
    B: '101'
    C: '181'
    D: '240'
    E: '1.810'
  dogru: C
  aciklama:
    dogru_neden: 'En kötü durumda önce en kalabalık iki rengin tamamı çekilir: 100 + 80 = 180 top. Bir sonraki top mutlaka
      kırmızı olacağından en az 181 top çekilmelidir. Püf noktaları: Garanti sorularında en kötü durumu düşünün; en fazla
      topu olan iki rengi tüketmeden üçüncü renk çıkmayabilir.'
    hesap_adimlari:
    - 'En kötü durum: 100 yeşil + 80 mavi = 180'
    - 'Sonraki top kırmızı olur: 181'
    celdiriciler:
      A: Renk sayısıdır; en kötü durumda aynı renkten çok sayıda top çıkabilir.
      B: En kalabalık rengi (yeşil) aşıp bir top çekmek, her renkten bir top çıkacağını garanti etmez.
      D: Torbadaki toplam top sayısıdır; daha az top çekilerek de garanti sağlanır.
