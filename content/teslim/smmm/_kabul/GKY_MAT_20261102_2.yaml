  kok: 'Aşağıdaki tabloda bir kütüphanede dört gün boyunca ödünç verilen kitap sayıları gösterilmiştir.


    | Gün | Ödünç verilen kitap |

    |---|---|

    | Pazartesi | 45 |

    | Salı | 60 |

    | Çarşamba | 30 |

    | Perşembe | 65 |


    Buna göre en çok ve en az kitap ödünç verilen günler arasındaki fark, dört günün toplam ödünç sayısının yüzde kaçıdır?'
  secenekler:
    A: '%3,5'
    B: '%17,5'
    C: '%35'
    D: '%58,33'
    E: '%175'
  dogru: B
  aciklama:
    dogru_neden: En çok 65, en az 30 olduğundan fark 35'tir. Dört günün toplamı 45 + 60 + 30 + 65 = 200'dür. Oran 35 ÷ 200
      = %17,5'tir.
    hesap_adimlari:
    - 'Fark: 65 − 30 = 35'
    - 'Toplam: 200'
    - 'Oran: 35 ÷ 200 = %17,5'
    celdiriciler:
      A: '%17,5''in ondalık kaymış biçimidir.'
      C: Farkın kendisini (35) yüzde olarak yazmakla bulunur; toplama oranlanmamıştır.
      D: Fark, toplam yerine Salı değerine (60) oranlanarak bulunur.
      E: '%17,5''in ondalık olarak büyütülmüş biçimidir.'
  kaynaklar:
  - mevzuat: Genel bilgi — Matematik
    madde: '-'
    alinti: (genel bilgi)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (65 - 30) / (45 + 60 + 30 + 65) * 100
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
