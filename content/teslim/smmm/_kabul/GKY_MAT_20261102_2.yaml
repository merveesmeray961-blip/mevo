    dogru_neden: '1.000 ÷ 8 = 125 olduğundan 8''in katı 125 sayı vardır (I doğru) ve en büyüğü 1.000''dir (II yanlış). Hem
      8''in hem 5''in katı olanlar 40''ın katlarıdır: 1.000 ÷ 40 = 25 sayı vardır (III yanlış).'
    hesap_adimlari:
