- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Maliyet muhasebesi
  konu: DIG
  kazanim: FIFO ve hareketli ortalama
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'AB İşletmesinin ilk madde hareketleri: dönem başı 1.000 kg × 40 ₺; alış 1.000 kg × 44 ₺; alış 2.000 kg × 48 ₺. Dönem
    içinde 2.000 kg çıkış yapılmıştır; çıkış maliyeti dönem satış maliyetine yansıtılmaktadır. İşletme dönemsel ağırlıklı
    ortalama yerine FIFO yöntemini uygulasaydı dönem kârı ne kadar değişirdi? (KDV dikkate alınmayacaktır.)'
  secenekler:
    A: 3.000 ₺ artardı
    B: 6.000 ₺ artardı
    C: 6.000 ₺ azalırdı
    D: 12.000 ₺ artardı
    E: 12.000 ₺ azalırdı
  dogru: B
  aciklama:
    dogru_neden: 'Dönemsel ortalama birim maliyet (40.000 + 44.000 + 96.000) / 4.000 = 45 ₺; çıkış 2.000 × 45 = 90.000 ₺.
      FIFO''da çıkış 1.000 × 40 + 1.000 × 44 = 84.000 ₺. Satış maliyeti 6.000 ₺ düşeceğinden dönem kârı 6.000 ₺ artardı (TMS
      2 paragraf 25, 27). Püf noktaları: Kâr farkı, iki yöntemin çıkış maliyetleri arasındaki farktır; fiyatlar yükselirken
      FIFO daha yüksek kâr verir. Püf noktaları: İki yöntemin çıkış maliyetlerinin farkı alınır ve fiyat artışı döneminde
      FIFO''nun kârı yükselttiği bilinmelidir.'
    celdiriciler:
      A: 3.000 ₺ artardı doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 6.000 ₺ artardı olarak bulunur.
      C: Fiyatlar yükselirken FIFO daha düşük maliyet verir; kâr azalmaz, artar.
      D: 12.000 ₺ artardı doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 6.000 ₺ artardı olarak bulunur.
      E: 12.000 ₺ azalırdı doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 6.000 ₺ artardı olarak bulunur.
    hesap_adimlari:
    - 'Ortalama: 180.000 / 4.000 = 45 ₺; çıkış 90.000 ₺'
    - 'FIFO çıkış: 40.000 + 44.000 = 84.000 ₺'
    - 'Fark: 90.000 - 84.000 = 6.000 ₺ (kâr artar)'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 25
    alinti: ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir. Benzer niteliklere
      ve işletme açısından benzer kullanıma sahip bütün stoklar için, aynı maliyet hesaplama yöntemi kullanılır.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar.
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: Ağırlıklı ortalama maliyet yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin
      maliyetleri ile dönem içinde satın alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak
      belirlenir. Ağırlıklı ortalama, işletmenin koşullarına bağlı olarak, dönemsel olarak veya işletmeye stok girişi oldukça
      hesaplanabilir.
