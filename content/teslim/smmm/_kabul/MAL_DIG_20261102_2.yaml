    C: 48.000 ₺
    D: 88.000 ₺
    E: 96.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Mevcut kâr 4.000 × 20 − 40.000 = 40.000 ₺''dir. Faaliyet kaldıracı 80.000 / 40.000 = 2''dir; satışlar %20
      artınca kâr %40 artar: 56.000 ₺. Doğrudan: 4.800 × 20 − 40.000 = 56.000 ₺. Püf noktaları: Sabit giderler sabit kaldığı
      için kâr, satıştan daha hızlı artar; kârı %20 artırmak yaygın hatadır. Püf noktaları: Faaliyet kaldıracı etkisi ve sabit
      giderin değişmemesi birlikte değerlendirilir.'
    celdiriciler:
      A: 40.000 ₺ doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 56.000 ₺ (96.000 − 40.000) olarak bulunur.
