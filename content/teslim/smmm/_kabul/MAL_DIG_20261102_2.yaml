  kok: AB İşletmesinde bir safhada 8.500 kg ilk madde işlenmeye başlanmış, 8.000 kg sağlam ürün elde edilmiştir. Normal kayıp,
    elde edilen sağlam ürün miktarının %5'idir. Safhanın toplam maliyeti 255.000 ₺'dir; kayıplar safha sonunda tespit edilmiştir.
    Dönem gideri olarak yazılacak anormal kayıp maliyeti aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 2.250 ₺
    B: 3.000 ₺
    C: 12.000 ₺
    D: 15.000 ₺
    E: 4.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Toplam kayıp 500 kg, normal kayıp 8.000 × %5 = 400 kg, anormal kayıp 100 kg''dır. Birim maliyet 255.000
      / 8.500 = 30 ₺; anormal kayıp 3.000 ₺ olup TMS 2 paragraf 16(a) gereği dönem gideri yazılır. Püf noktaları: Normal kayıp
      oranının hangi tabana (sağlam ürün) uygulandığına dikkat etmeli, birim maliyeti başlanan miktar üzerinden bulmalısın.
      Püf noktaları: Oranın uygulandığı tabanın değişmesi ve birim maliyetin başlanan miktara bölünmesi.'
    celdiriciler:
      A: 2.250 ₺ doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 ₺ (100 kg × 30 ₺) olarak bulunur.
      C: 12.000 ₺ doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 ₺ olarak bulunur.
      D: 15.000 ₺ doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 ₺ olarak bulunur.
      E: 4.000 ₺ doğru hesaplamanın sonucu değildir; kökteki verilerle doğru sonuç 3.000 ₺ olarak bulunur.
    hesap_adimlari:
    - 'Normal kayıp: 8.000 × 0,05 = 400 kg; toplam kayıp 500 kg; anormal 100 kg'
    - 'Birim maliyet: 255.000 / 8.500 = 30 ₺'
    - 'Anormal kayıp maliyeti: 100 × 30 = 3.000 ₺'
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 16(a)
    alinti: Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri,
