  kok: AB İşletmesi bir mamulü 50 ₺'ye satmakta, birim değişken maliyeti 30 ₺ olmaktadır. Dönemde 4.000 birim satılmış, sabit
    giderler 40.000 ₺ olmuştur. Gelecek dönemde sabit giderler ve birim değişken maliyet sabit kalmak şartıyla satış miktarının
    %20 artması beklenmektedir. Gelecek dönem beklenen faaliyet kârı aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 40.000 ₺
