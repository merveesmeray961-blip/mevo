    Genel yönetim giderleri 60.000 ₺'dir. KDV dikkate alınmayacaktır. Direkt ilk madde ve malzeme gideri kaç ₺'dir?
  secenekler:
    A: 90.000 ₺
    B: 640.000 ₺
    C: 730.000 ₺
    D: 780.000 ₺
    E: 1.100.000 ₺
  dogru: B
  aciklama:
    dogru_neden: Dönemin üretim giderleri = DİMM + DİŞ + GÜG olduğundan DİMM = 870.000 − 90.000 − 140.000 = 640.000 ₺. Genel
      yönetim gideri üretim giderine girmez.
    celdiriciler:
      A: Bu tutar direkt işçiliktir.
      C: Yalnızca genel üretim giderleri çıkarılmıştır; direkt işçilik de düşülmelidir.
      D: Yalnızca direkt işçilik çıkarılmıştır; genel üretim giderleri de düşülmelidir.
      E: Üretim giderlerine direkt işçilik ve GÜG eklenmiştir; geri hesapta bunlar çıkarılır.
    hesap_adimlari:
    - DİMM = 870.000 − 90.000 − 140.000 = 640.000 ₺
  kaynaklar:
  - mevzuat: 1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)
