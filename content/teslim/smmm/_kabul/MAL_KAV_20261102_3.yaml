  kok: Bir işletmede asal maliyet 880.000 ₺, dönüştürme maliyeti 200.000 ₺ ve genel üretim giderleri 110.000 ₺'dir. Genel
    yönetim giderleri 60.000 ₺'dir. KDV dikkate alınmayacaktır. Dönemin üretim giderleri kaç ₺'dir?
  secenekler:
    A: 90.000 ₺
    B: 880.000 ₺
    C: 990.000 ₺
    D: 1.080.000 ₺
    E: 1.190.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Dönüştürme maliyeti = DİŞ + GÜG olduğundan DİŞ = 200.000 − 110.000 = 90.000 ₺''dir. Dönemin üretim giderleri
      = Asal maliyet + GÜG = 880.000 + 110.000 = 990.000 ₺ (ya da asal + dönüştürme − DİŞ). Püf noktaları: Direkt işçilik
      iki toplamın ortak unsurudur; genel yönetim gideri gereksiz veridir ve üretim giderine girmez.'
    celdiriciler:
      A: Bu tutar dönüştürme maliyeti ile GÜG arasındaki farktır, yani direkt işçiliktir.
      B: Bu tutar asal maliyettir; GÜG eklenmemiştir.
      D: Asal ve dönüştürme maliyeti toplanmıştır; direkt işçilik iki kez sayılmıştır.
      E: Asal maliyet, dönüştürme maliyeti ve GÜG birlikte toplanmıştır.
    hesap_adimlari:
    - DİŞ = 200.000 − 110.000 = 90.000 ₺
    - Üretim giderleri = 880.000 + 110.000 = 990.000 ₺
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Stokların dönüştürme maliyetleri; direkt işçilik giderleri gibi, üretimle doğrudan ilişkili maliyetleri kapsar.
      Bu maliyetler ayrıca ilk madde ve malzemenin mamule dönüştürülmesinde katlanılan sabit ve değişken genel üretim giderlerinden
      sistematik bir şekilde dağıtılan tutarları da içerir.
  - mevzuat: 1 Sıra No.lu Muhasebe Sistemi Uygulama Genel Tebliği, Ek 4 (Mali Tabloların Düzenlenmesi)
    madde: Satışların Maliyeti Tablosu, C - Genel Üretim Giderleri
    alinti: 'C _ Genel Üretim Giderleri : Üretim faaliyetleri ve bu faaliyetlerle ilgili olarak yapılan hizmetlere ilişkin
      direkt ilk madde ve malzeme ile direkt işçilik giderleri dışında kalan giderleri içerir.'
