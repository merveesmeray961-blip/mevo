  kok: AX İşletmesi'nin üretim sürecinde ana ürün (4.000 kg) ile yan ürün birlikte çıkmaktadır. Ortak maliyet 120.000 TL,
    yan ürünün net gerçekleşebilir değeri 5.000 TL'dir ve bu değer ana ürünün maliyetinden düşülmektedir. Ana ürünün kg başına
    maliyeti kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 1,25 TL
    B: 28,75 TL
    C: 30 TL
    D: 31,25 TL
    E: 115.000 TL
  dogru: B
  aciklama:
    dogru_neden: TMS 2 paragraf 14'e göre yan ürünün net gerçekleşebilir değeri ana ürünün maliyetinden düşülür. Ana ürün
      maliyeti 120.000 − 5.000 = 115.000 TL, kg başına maliyet 115.000 / 4.000 = 28,75 TL'dir.
    celdiriciler:
      A: Yan ürünün net değeri ana ürün miktarına bölünmüştür; ana ürünün maliyeti sorulmaktadır.
      C: Yan ürün değeri düşülmeden ortak maliyet ana ürün miktarına bölünmüştür.
      D: Yan ürün değeri ortak maliyetten düşülmek yerine ona eklenmiştir.
      E: Ana ürünün toplam maliyetidir; kg başına maliyete ulaşmak için miktara bölünmemiştir.
    hesap_adimlari:
    - Ana ürün maliyeti = 120.000 − 5.000 = 115.000 TL
    - Kg maliyeti = 115.000 / 4.000 = 28,75 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Yan ürünlerin çoğu, yapıları gereği önemsizdir. Böyle bir durumda, yan ürünler genellikle net gerçekleşebilir
      değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden düşülür. Bunun sonucu olarak ana ürünün defter değeri, maliyet
      değerinden önemli ölçüde farklılık göstermez.
