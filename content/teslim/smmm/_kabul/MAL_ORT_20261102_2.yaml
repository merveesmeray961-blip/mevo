    bilinmiyor), C ürünü 2.000 adet (katsayısı 3) elde edilmiştir. Katsayılı bölme yöntemine göre C ürününün birim maliyeti
    54 TL ise B ürününün katsayısı kaçtır? KDV dikkate alınmayacaktır.
  secenekler:
    A: 2,5
    B: '3'
    C: 7,5
    D: '10'
    E: 12,5
  dogru: A
  aciklama:
    dogru_neden: 'Eşdeğer birim maliyet 54 / 3 = 18 TL; toplam eşdeğer miktar 216.000 / 18 = 12.000. A''nın eşdeğeri 4.000,
      C''nin 6.000; B''nin eşdeğeri 2.000. Katsayı 2.000 / 800 = 2,5''tir (TMS 2 par. 14). Püf noktaları: 54 TL, C''nin birim
      maliyetidir; önce katsayısına bölerek eşdeğer birim maliyeti bul. Sonra toplam eşdeğer miktardan A ve C''nin eşdeğerlerini
      çıkar.'
    celdiriciler:
      B: C'nin katsayısı B'ye de verilmiştir.
      C: Toplam eşdeğer miktardan yalnızca A'nın eşdeğeri düşülmüştür.
      D: Toplam eşdeğer miktardan yalnızca C'nin eşdeğeri düşülmüştür.
      E: Toplam eşdeğer miktardan yalnızca C'nin adedi (2.000) düşülmüştür.
    hesap_adimlari:
    - Eşdeğer birim maliyet = 54 / 3 = 18 TL
    - Toplam eşdeğer = 216.000 / 18 = 12.000
    - B eşdeğeri = 12.000 − 4.000 − 6.000 = 2.000
    - Katsayı = 2.000 / 800 = 2,5
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile
      bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak
      belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı
      örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki
      nispi satış değerine göre yapılabilir.
