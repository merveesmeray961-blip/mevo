  kok: KB İşletmesi'nde bir üretim sürecinden A ve B ortak ürünleri elde edilmiştir. Ortak maliyet 45.000 TL'dir. A ürününden
    2.000 kg (kg satış fiyatı 20 TL), B ürününden 400 kg (kg satış fiyatı 25 TL) elde edilmiştir. Maliyet satış değerleri
    oranında dağıtılırsa B ürününün kg başına maliyeti kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 18 TL
    B: 18,75 TL
    C: 22,5 TL
    D: 25 TL
    E: 112,5 TL
  dogru: C
  aciklama:
    dogru_neden: TMS 2 paragraf 14'e göre ortak maliyet nispi satış değerine göre dağıtılabilir. A'nın satış değeri 40.000
      TL, B'nin 10.000 TL; toplam 50.000 TL'dir. B'nin payı 45.000 × 10.000 / 50.000 = 9.000 TL, kg maliyeti 9.000 / 400 =
      22,5 TL'dir.
    celdiriciler:
      A: A ürününün kg başına maliyetidir (36.000 / 2.000); B sorulmaktadır.
      B: Ortak maliyet fiziksel miktara (45.000 / 2.400) bölünmüştür; satış değeri oranı kullanılmamıştır.
      D: B ürününün kg satış fiyatıdır; maliyet değildir.
      E: Ortak maliyetin tamamı B'nin miktarına bölünmüştür; A ürünü pay almamış gibi işlem yapılmıştır.
    hesap_adimlari:
    - 'Satış değerleri: A 40.000; B 10.000; toplam 50.000'
    - B payı = 45.000 × 10.000 / 50.000 = 9.000 TL
    - Kg maliyeti = 9.000 / 400 = 22,5 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile
      bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak
      belirlenemediği durumlarda, bu maliyetler ürünler arasında mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı
      örneğin; her bir ürünün ayrı olarak belirlenebilir hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki
      nispi satış değerine göre yapılabilir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 45000 * (400 * 25) / (2000 * 20 + 400 * 25) / 400
