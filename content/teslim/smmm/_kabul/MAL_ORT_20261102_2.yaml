      TL; A''nın katsayısı 1 olduğundan birim maliyeti 19,5 TL''dir (TMS 2 par. 14: mantıklı ve tutarlı dağıtım).'
    celdiriciler:
      A: Eşdeğer birim maliyet katsayıya (2) bölünerek küçültülmüştür.
      C: Ortak maliyet fiziksel miktara (156.000 / 6.000) bölünmüştür; katsayılar kullanılmamıştır.
