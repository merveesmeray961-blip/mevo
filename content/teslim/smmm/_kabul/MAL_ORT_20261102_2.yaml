    toplam satış tutarı 100.000 TL, ek işlem maliyeti 40.000 TL'dir. Ortak maliyet net satış değerine göre dağıtılırsa A ürününün
    birim maliyeti (kendi ek işlem maliyeti dahil) kaç TL olur? KDV dikkate alınmayacaktır.
  secenekler:
    A: 10,5 TL
    B: 11,25 TL
    C: 14,25 TL
    D: 15 TL
    E: 114.000 TL
  dogru: C
  aciklama:
    dogru_neden: Net satış değerleri A için 120.000 − 30.000 = 90.000 TL, B için 100.000 − 40.000 = 60.000 TL; toplam 150.000
      TL. A'nın payı 140.000 × 90.000 / 150.000 = 84.000 TL; ek işlem maliyeti eklenince 114.000 TL, birim maliyet 114.000
      / 8.000 = 14,25 TL'dir (TMS 2 par. 14).
    celdiriciler:
      A: Yalnızca ortak maliyet payı (84.000 TL) birim sayısına bölünmüştür; ek işlem maliyeti eklenmemiştir.
      B: A'nın net satış değeri (90.000 TL) birim sayısına bölünmüştür; değer maliyet değildir.
      D: A'nın nihai satış tutarı (120.000 TL) birim sayısına bölünmüştür; bu birim satış fiyatıdır.
      E: A'nın toplam maliyetidir; birim maliyete ulaşmak için birim sayısına bölünmemiştir.
    hesap_adimlari:
    - A NSD = 90.000; B NSD = 60.000
    - A payı = 140.000 × 90.000 / 150.000 = 84.000 TL
    - A toplam maliyet = 84.000 + 30.000 = 114.000 TL
    - Birim = 114.000 / 8.000 = 14,25 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 14
    alinti: Üretim sürecinde aynı anda birden fazla ürün ortaya çıkabilir. Ortak ürünlerin üretilmesi veya bir ana ürün ile
      bir yan ürünün bulunması, bu duruma örnek olarak gösterilebilir. Her bir ürünün dönüştürme maliyetlerinin ayrı olarak
