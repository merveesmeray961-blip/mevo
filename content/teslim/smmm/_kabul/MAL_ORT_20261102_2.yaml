      ve sistematik dağıtılan genel üretim giderlerini kapsar. Paragraf 16''daki kalemler ise stok maliyeti dışındadır. Püf
      noktaları: Paragraf 16''daki dört kalem (fire, gereksiz depolama, katkısız genel yönetim, satış maliyeti) dönem giderine
      gider. ''Gerekli olanlar dışında kalan'' ifadesi, gerekli depolamanın maliyete girdiğini gösterir.'
