  kok: TMS 2 Stoklar standardına göre, normal şartlarda birbiriyle ikame edilebilen stokların maliyeti hangi yöntemlerle belirlenir?
  secenekler:
    A: İlk giren ilk çıkar veya ağırlıklı ortalama maliyet yöntemiyle
    B: Son giren ilk çıkar (LIFO) veya ağırlıklı ortalama maliyet yöntemiyle
    C: Yalnızca ilk giren ilk çıkar (FIFO) yöntemiyle
    D: Yalnızca son giren ilk çıkar (LIFO) yöntemiyle
    E: İlk giren ilk çıkar (FIFO) veya son giren ilk çıkar (LIFO) yöntemiyle
  dogru: A
  aciklama:
    dogru_neden: TMS 2 paragraf 25'e göre özel projeler için ayrılanlar dışında kalan stokların maliyeti ilk giren ilk çıkar
      (FIFO) veya ağırlıklı ortalama maliyet yöntemi kullanılarak belirlenir. Safha maliyetinde de bu iki yöntem kullanılır.
    celdiriciler:
      B: Paragraf 25 yalnızca FIFO veya ağırlıklı ortalama maliyet yöntemini sayar; LIFO yer almaz.
      C: Paragraf 25 FIFO'nun yanında ağırlıklı ortalama maliyet yöntemini de kabul eder.
      D: LIFO paragraf 25'te sayılan yöntemler arasında değildir.
      E: Paragraf 25'e göre iki yöntem FIFO ve ağırlıklı ortalamadır; LIFO değildir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 25
    alinti: 23’üncü paragrafta belirtilenler dışında kalan stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama
      maliyet yöntemi kullanılarak belirlenir.
