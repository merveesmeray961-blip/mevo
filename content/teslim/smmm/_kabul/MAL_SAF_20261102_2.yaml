  kok: FK İşletmesi'nin II. safhasında dönem başı yarı mamul yoktur. I. safhadan 5.000 birim 150.000 TL maliyetle devralınmış;
    II. safhada 4.000 birim tamamlanmış, 1.000 birim yarı mamul (dönüşüm bakımından %60) kalmıştır. II. safhanın dönüşüm maliyeti
    66.700 TL'dir. Devralınan birimler yarı mamullerde de %100 tamamdır. Tamamlanan mamulün birim maliyeti kaç TL'dir? KDV
    dikkate alınmayacaktır.
  secenekler:
    A: 30 TL
    B: 43,34 TL
    C: 44,5 TL
    D: 46,68 TL
    E: 52 TL
  dogru: C
  aciklama:
    dogru_neden: 'Devralınan birim maliyet 150.000 / 5.000 = 30 TL''dir (yarı mamuller dahil %100). Dönüşüm eşdeğer birimi
      4.000 + 1.000 × %60 = 4.600; birim dönüşüm maliyeti 66.700 / 4.600 = 14,5 TL. Toplam 44,5 TL''dir. Tamamlananların maliyeti
      151''in alacağı karşılığında aktarılır. Püf noktaları: Devralınan maliyet ayrı bir unsur olup tüm birimler için %100
      tamamdır; tamamlanma derecesi yalnızca II. safhanın dönüşüm maliyetine uygulanır.'
    celdiriciler:
      A: Yalnızca devralınan maliyettir; II. safhanın dönüşüm maliyeti eklenmemiştir.
      B: Dönüşüm maliyeti fiziki toplama (5.000) bölünmüştür; eşdeğer birim 4.600 alınmalıdır.
      D: Dönüşüm maliyeti yalnızca tamamlanan birimlere (4.000) bölünmüştür.
      E: Devralınan maliyet yalnızca tamamlanan birimlere (4.000) bölünmüştür; yarı mamuller de devralınan maliyeti taşır.
    hesap_adimlari:
    - Devralınan birim = 150.000 / 5.000 = 30
    - Dönüşüm eşdeğeri = 4.000 + 600 = 4.600
    - Dönüşüm birim = 66.700 / 4.600 = 14,5
    - Toplam = 44,5 TL
