sorular:
- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: eşdeğer birim
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: ZP İşletmesi'nde FIFO yöntemi uygulanmaktadır. Safhaya devredilen dönem başı yarı mamul 800 birim olup bunlar geçen
    dönemde dönüşüm bakımından %50 tamamlanmıştır. Bu yarı mamullerin tamamlanması için cari dönemde yapılması gereken dönüşüm
    işi kaç eşdeğer birimdir?
  secenekler:
    A: 50 birim
    B: 400 birim
    C: 800 birim
    D: 1.200 birim
    E: 1.600 birim
  dogru: B
  aciklama:
    dogru_neden: 'FIFO''da dönem başı yarı mamul önce tamamlanır; bu dönemde yapılacak iş, tamamlanmamış kısımdır: 800 × (1
      − %50) = 400 eşdeğer birimdir (TMS 2 paragraf 27: ilk üretilenler ilk çıkar).'
    celdiriciler:
      A: Tamamlanma yüzdesi (50) eşdeğer birim sayısı olarak alınmıştır.
      C: Fiziki yarı mamul miktarıdır; geçen dönemde tamamlanan kısım düşülmemiştir.
      D: Fiziki miktara geçen dönemde işlenen kısmın eşdeğeri (400) eklenmiştir (800 + 400).
      E: Fiziki miktar derece ile çarpılmak yerine bölünmüştür (800 / 0,5).
    hesap_adimlari:
    - Cari dönem işi = 800 × (1 − 0,50) = 400 eşdeğer birim
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 800 * (1 - 0.5)
- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: MAL
  unite: Safha maliyeti ve eşdeğer birim
  konu: SAF
  kazanim: FIFO ve ortalama safha maliyeti
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: 'CK İşletmesi''nde safhaya ilişkin veriler şöyledir: dönem başı yarı mamul 2.500 birim (dönüşüm bakımından geçen dönemde
    %40), dönemde başlanan 7.500 birim, tamamlanan 6.000 birim ve dönem sonu yarı mamul 4.000 birim (dönüşüm bakımından %50).
    İlk madde başta verilmektedir. Dönem başı yarı mamulün dönüşüm maliyeti 22.500 TL, dönem içinde katlanılan dönüşüm maliyeti
    77.500 TL''dir. Ağırlıklı ortalama yöntemine göre dönüşüm maliyetinin birim maliyeti kaç TL''dir? KDV dikkate alınmayacaktır.'
  secenekler:
    A: 8 TL
    B: 10 TL
    C: 12,5 TL
    D: 14,29 TL
    E: 16,67 TL
  dogru: C
  aciklama:
    dogru_neden: 'Ağırlıklı ortalamada DBYM maliyeti ile dönem maliyeti toplanır: 22.500 + 77.500 = 100.000 TL. Eşdeğer birim
      6.000 + 4.000 × %50 = 8.000''dir. Birim maliyet 100.000 / 8.000 = 12,5 TL''dir (TMS 2 paragraf 27).'
    celdiriciler:
      A: Yalnızca dönem maliyeti (80.000 TL) toplam fiziki akışa bölünmüştür; DBYM maliyeti havuza alınmamıştır.
      B: Toplam dönüşüm maliyeti fiziki toplama (10.000) bölünmüştür; eşdeğer birim kullanılmamıştır.
      D: FIFO eşdeğer birimi (7.000) kullanılmıştır; ortalama yöntemde DBYM'nin eşdeğeri çıkarılmaz.
      E: Yalnızca tamamlanan birimlere (6.000) bölünmüştür.
    hesap_adimlari:
    - Toplam dönüşüm maliyeti = 100.000 TL
    - Eşdeğer birim = 6.000 + 2.000 = 8.000
    - Birim maliyet = 12,5 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 27
    alinti: FIFO yöntemi; ilk satın alınan veya üretilen stok kalemlerinin ilk olarak satıldığını ve bunun sonucunda dönem
      sonunda stokta kalan kalemlerin en son satın alınan veya üretilen kalemler olduğunu varsayar. Ağırlıklı ortalama maliyet
      yönteminde ise, her bir stok kaleminin maliyeti; dönem başındaki benzer kalemlerin maliyetleri ile dönem içinde satın
      alınan veya üretilen benzer kalemlerin maliyetlerinin ağırlıklı ortalaması alınarak belirlenir.
  gecerlilik:
    baslangic: '2005-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (22500 + 77500) / (6000 + 4000 * 0.5)
