    talep nedeniyle 8.000 makine saati üretim yapılmıştır. TMS 2 Stoklar standardına göre sabit GÜG'nin stok maliyetine dağıtımı
    bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: 160.000 TL ürünlere dağıtılır; kalan 40.000 TL dönem gideri olur.
    B: Tamamı olan 200.000 TL ürünlere dağıtılır; birim maliyet artar.
    C: 120.000 TL ürünlere dağıtılır; kalan 80.000 TL dönem gideri olur.
    D: Hiçbiri dağıtılmaz; tamamı dönem gideri yazılır.
    E: 200.000 TL ürünlere dağıtılır; 40.000 TL ayrıca dönem gideri olur.
  dogru: A
  aciklama:
    dogru_neden: 'TMS 2 paragraf 13''e göre sabit genel üretim giderleri normal kapasiteye göre dağıtılır; her üretim birimine
      dağıtılan sabit gider düşük üretim düzeyi veya atıl kapasite nedeniyle arttırılmaz ve dağıtılmayan giderler gerçekleştiği
      dönemde gider yazılır. Oran 200.000 / 10.000 = 20 TL/saattir; 8.000 saat × 20 = 160.000 TL dağıtılır, 40.000 TL dönem
      gideridir. Püf noktaları: Dağıtım fiili üretim değil normal kapasite esas alınarak oranlanır. Atıl kapasite kadar sabit
      gider ürünlere yüklenmez, doğrudan gider olur.'
    celdiriciler:
      B: Düşük üretim düzeyi nedeniyle birim sabit gider arttırılmaz; dağıtılmayan kısım dönem giderine yazılır.
      C: Normal kapasite oranı 20 TL/saat iken 8.000 saatle 160.000 TL dağıtılır; 120.000 TL yanlış bir hesaptır.
      D: Fiili üretim kadar sabit GÜG ürünlere dağıtılır; tamamı dönem gideri yapılamaz.
      E: Aynı tutar iki kez dikkate alınmıştır; toplam sabit GÜG 200.000 TL'dir.
