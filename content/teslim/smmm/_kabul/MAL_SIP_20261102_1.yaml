    ilk madde ve malzeme, 24.000 TL direkt işçilik harcanmış ve 800 makine saati kullanılmıştır. Yükleme oranı 12,5 TL/makine
    saatidir. Pazarlama giderleri sipariş maliyetine katılmayacaktır. Mamulün birim maliyeti kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 250 TL
