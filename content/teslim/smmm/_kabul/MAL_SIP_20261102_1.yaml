    dogru_neden: Siparişe yüklenen GÜG = yükleme oranı × siparişin fiili faaliyet ölçüsü = 12,5 × 1.600 = 20.000 TL'dir. Direkt
      ilk madde ve direkt işçilik siparişe doğrudan yazılır, GÜG ise dağıtım yoluyla yansıtılır.
    celdiriciler:
      A: Siparişin makine saati miktarıdır; oranla çarpılmamıştır.
      C: Direkt ilk madde ve direkt işçilik toplamıdır; GÜG değildir.
      D: Siparişin toplam maliyetidir (40.000 + 24.000 + 20.000); yalnızca yüklenen GÜG sorulmaktadır.
      E: Dönem başındaki tahmini toplam GÜG gibi bir tutardır; siparişe yüklenecek pay değildir.
    hesap_adimlari:
    - Yüklenen GÜG = 12,5 × 1.600 = 20.000 TL
