  kok: AB İşletmesi sipariş maliyet sistemini uygulamakta ve genel üretim giderlerini (GÜG) makine saatine göre siparişlere
    yüklemektedir. Dönem başında tahmini GÜG 450.000 TL, tahmini makine saati 36.000, tahmini direkt işçilik saati 45.000
    olarak belirlenmiştir. Dönem sonunda fiili GÜG 470.000 TL, fiili makine saati 35.000 gerçekleşmiştir. Siparişlere uygulanacak
    GÜG yükleme oranı kaç TL/makine saatidir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 10 TL
    B: 12,5 TL
    C: 12,86 TL
    D: 13,06 TL
    E: 13,43 TL
  dogru: B
  aciklama:
    dogru_neden: Yükleme oranı = tahmini GÜG / tahmini faaliyet ölçüsüdür. Ölçü makine saati olduğundan 450.000 / 36.000 =
      12,5 TL/makine saatidir. Fiili tutarlar dönem sonunda fark hesaplamasında kullanılır; oranı etkilemez. Tek Düzen Hesap
      Planı'na göre 730 hesabındaki giderler ancak dağıtım yoluyla maliyetlere yansıtılabilir.
    celdiriciler:
      A: Tahmini GÜG direkt işçilik saatine (45.000) bölünmüştür; yükleme ölçüsü makine saatidir.
      C: Tahmini GÜG fiili makine saatine (35.000) bölünmüştür; yükleme oranı dönem başında tahmini ölçüyle belirlenir.
      D: Fiili GÜG tahmini makine saatine bölünmüştür; oran tahmini GÜG üzerinden hesaplanır.
      E: Fiili GÜG fiili makine saatine bölünmüştür; bu fiili oran olup önceden belirlenmiş yükleme oranı değildir.
    hesap_adimlari:
    - Yükleme oranı = 450.000 / 36.000 = 12,5 TL/MS
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tek Düzen Hesap Planı'
    madde: 730 Genel Üretim Giderleri
    alinti: Çeşit ve değer yönü ile doğrudan doğruya değil ancak dağıtım yoluyla üretim ve hizmet maliyetlerine yansıtılabilir
      nitelikte olması
