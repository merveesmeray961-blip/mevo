    dogru_neden: Yüklenen GÜG = 12,5 × 35.000 = 437.500 TL'dir. Fiili GÜG 470.000 TL olduğundan fark 470.000 − 437.500 = 32.500
      TL eksik yüklemedir; olumsuz fark olarak 732 hesabının borcuna yazılır.
