      A: Tahmini ile fiili makine saati arasındaki farktır (36.000 − 35.000); TL tutarı değildir.
      B: Fiili GÜG ile tahmini GÜG arasındaki farktır (470.000 − 450.000); yüklenen GÜG fiili ölçüyle bulunur.
      D: Siparişlere yüklenen GÜG tutarıdır; fark değildir.
      E: Fiili GÜG tutarıdır; yüklenen tutar düşülmemiştir.
    hesap_adimlari:
    - Yüklenen GÜG = 12,5 × 35.000 = 437.500 TL
    - Fark = 470.000 − 437.500 = 32.500 TL (eksik yükleme)
  kaynaklar:
