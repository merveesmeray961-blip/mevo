  kok: AZ İşletmesi'nde aylık kira gideri 120.000 TL olup yer alanı (m²) esasına göre gider yerlerine dağıtılacaktır. Kesim
    gider yeri 1.000 m², Montaj gider yeri 150 m², Bakım gider yeri 50 m² yer kullanmaktadır. I. dağıtımda Montaj gider yerine
    düşen kira kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 5.000 TL
    B: 15.000 TL
    C: 40.000 TL
    D: 100.000 TL
    E: 120.000 TL
  dogru: B
  aciklama:
    dogru_neden: I. dağıtımda gider çeşitleri gider yerlerine uygun anahtarla dağıtılır; kira için anahtar m²'dir. Toplam
      alan 1.200 m²; Montaj payı 120.000 × 150 / 1.200 = 15.000 TL'dir. Gider yeri, üretim ve hizmetlerin yapıldığı ve maliyetlerin
      oluştuğu birimdir.
    celdiriciler:
      A: Bakım gider yerine düşen paydır.
      C: Kira üç gider yerine eşit (120.000 / 3) bölünmüştür; m² anahtarı kullanılmamıştır.
      D: Kesim gider yerine düşen paydır.
      E: Toplam kiranın tamamıdır; dağıtım yapılmamıştır.
    hesap_adimlari:
    - Toplam alan = 1.200 m²
    - Montaj payı = 120.000 × 150 / 1.200 = 15.000 TL
