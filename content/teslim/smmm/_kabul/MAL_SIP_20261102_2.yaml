  kok: DN İşletmesi'nde I. dağıtım sonrası Enerji 4.000 TL, Bakım 3.000 TL (yardımcı hizmet), Kesim 100.000 TL, Montaj 60.000
    TL (esas üretim) gider toplamına sahiptir. Enerji hizmetlerinin %25'ini Bakım'a, %45'ini Kesim'e, %30'unu Montaj'a; Bakım
    hizmetlerinin %20'sini Enerji'ye, %50'sini Kesim'e, %30'unu Montaj'a vermektedir. II. dağıtım kademeli yöntemle, önce
    Enerji dağıtılacak ve dağıtımı yapılmış Enerji'ye geri pay verilmeyecek biçimde yapılacaktır. Montaj gider yerinin II.
    dağıtım sonrası toplam gideri kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 4.000 TL
    B: 60.000 TL
    C: 61.200 TL
    D: 62.700 TL
    E: 104.300 TL
  dogru: D
  aciklama:
    dogru_neden: 'Önce Enerji dağıtılır: Bakım''a 1.000, Kesim''e 1.800, Montaj''a 1.200 TL. Bakım''ın yeni gideri 3.000 +
      1.000 = 4.000 TL olur; Enerji''ye geri pay verilmediğinden %50:%30 oranı 5/8 ve 3/8 olarak ölçeklenir: Kesim''e 2.500,
      Montaj''a 1.500 TL. Montaj = 60.000 + 1.200 + 1.500 = 62.700 TL''dir. Püf noktaları: Sıra Enerji''den başlar. Bakım''ın
      Enerji''ye verdiği %20 yok sayılır; kalan %80 üzerinden ölçekleme yapılır. Önce Enerji''nin Bakım''a verdiği pay Bakım''ın
      giderine eklenmelidir.'
    celdiriciler:
      A: Enerji gider yerinin I. dağıtım sonrası giderleridir.
      B: Montaj'ın I. dağıtım sonrası giderleridir; II. dağıtım payları eklenmemiştir.
      C: Yalnızca Enerji'nin payı eklenmiştir; Bakım'ın Montaj'a payı unutulmuştur.
      E: Kesim gider yerinin kademeli dağıtım sonrası toplamıdır.
    hesap_adimlari:
    - 'Enerji: Bakım 1.000; Kesim 1.800; Montaj 1.200'
    - Bakım = 3.000 + 1.000 = 4.000
    - Montaj payı = 4.000 × 30/80 = 1.500
    - Montaj = 60.000 + 1.200 + 1.500 = 62.700 TL
