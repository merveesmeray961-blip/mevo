  - mevzuat: 'MSUGT Sıra No: 1, Tek Düzen Hesap Planı'
    madde: 10-99 Gider Yerleri
    alinti: Gider yerleri aşağıdaki gibi bölümlenir. - Esas üretim gider yerleri - Yardımcı üretim gider yerleri - Yardımcı
      hizmet gider yerleri - Yatırım gider yerleri
