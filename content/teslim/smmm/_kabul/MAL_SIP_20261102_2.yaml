  kok: BK İşletmesi'nde aylık yemek gideri 144.000 TL olup çalışan sayısı esasına göre gider yerlerine dağıtılacaktır. Kesim
    gider yerinde 40, Montaj gider yerinde 6, Bakım gider yerinde 2 kişi çalışmaktadır. I. dağıtımda Montaj gider yerine düşen
    yemek gideri kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 6.000 TL
    B: 18.000 TL
    C: 48.000 TL
    D: 120.000 TL
    E: 144.000 TL
  dogru: B
  aciklama:
    dogru_neden: I. dağıtımda gider çeşitleri uygun anahtarla gider yerlerine dağıtılır; yemek için anahtar personel sayısıdır.
      Toplam 48 kişi; Montaj payı 144.000 × 6 / 48 = 18.000 TL'dir. Gider yeri, maliyetlerin oluştuğu örgüt birimidir.
    celdiriciler:
      A: Bakım gider yerine düşen paydır.
      C: Gider üç gider yerine eşit (144.000 / 3) bölünmüştür; personel anahtarı kullanılmamıştır.
      D: Kesim gider yerine düşen paydır.
      E: Toplam yemek giderinin tamamıdır; dağıtım yapılmamıştır.
    hesap_adimlari:
    - Toplam personel = 48
    - Montaj payı = 144.000 × 6 / 48 = 18.000 TL
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tek Düzen Hesap Planı'
    madde: 10-99 Gider Yerleri
    alinti: Gider yeri, üretim ve hizmetlerin yapıldığı ve maliyetlerin oluştuğu, örgütün bir birimini ya da birim içindeki
