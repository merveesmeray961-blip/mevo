  kok: ZK İşletmesi, siparişlere GÜG'yi direkt işçilik saatine göre yüklemektedir. Yıl başında tahmini GÜG 270.000 TL, tahmini
    direkt işçilik saati 21.600, tahmini makine saati 27.000 olarak belirlenmiş; yıl sonunda fiili direkt işçilik saati 20.000,
    fiili GÜG 280.000 TL gerçekleşmiştir. Yıl başında belirlenen GÜG yükleme oranı kaç TL/direkt işçilik saatidir? KDV dikkate
    alınmayacaktır.
  secenekler:
    A: 10 TL
    B: 12,5 TL
    C: 12,96 TL
    D: 13,5 TL
    E: 270.000 TL
  dogru: B
  aciklama:
    dogru_neden: Yükleme oranı = tahmini GÜG / tahmini faaliyet ölçüsüdür. Ölçü direkt işçilik saati olduğundan 270.000 /
      21.600 = 12,5 TL/saattir. Tek Düzen Hesap Planı'na göre 730 hesabındaki giderler dağıtım yoluyla üretim maliyetlerine
      yansıtılabilir.
    celdiriciler:
      A: Tahmini GÜG makine saatine (27.000) bölünmüştür; yükleme ölçüsü direkt işçilik saatidir.
      C: Fiili GÜG tahmini direkt işçilik saatine bölünmüştür; oran tahmini GÜG üzerinden hesaplanır.
      D: Tahmini GÜG fiili direkt işçilik saatine (20.000) bölünmüştür; oran dönem başında tahmini ölçüyle belirlenir.
      E: Tahmini toplam GÜG'dür; orana ulaşmak için ölçüye bölünmemiştir.
    hesap_adimlari:
    - Oran = 270.000 / 21.600 = 12,5 TL/saat
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tek Düzen Hesap Planı'
    madde: 730 Genel Üretim Giderleri
    alinti: Çeşit ve değer yönü ile doğrudan doğruya değil ancak dağıtım yoluyla üretim ve hizmet maliyetlerine yansıtılabilir
      nitelikte olması
