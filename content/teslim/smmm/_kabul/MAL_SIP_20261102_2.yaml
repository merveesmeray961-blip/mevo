  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: AY İşletmesi'nde GÜG direkt işçilik saatine göre 16 TL/saat oranıyla yüklenmektedir. Dönem başında tahmini direkt işçilik
    saati 26.000 idi. Dönem sonunda fiili direkt işçilik saati 25.000, fiili GÜG 412.000 TL olarak gerçekleşmiştir. Dönem
    sonunda oluşan eksik veya fazla yükleme tutarı kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 1.000 TL
    B: 4.000 TL
    C: 12.000 TL
    D: 16.000 TL
    E: 400.000 TL
  dogru: C
  aciklama:
    dogru_neden: Yüklenen GÜG = 16 × 25.000 = 400.000 TL'dir. Fiili GÜG 412.000 TL olduğundan 12.000 TL eksik (olumsuz) yükleme
      vardır; fark 732 hesabının borcuna yazılır.
    celdiriciler:
      A: Tahmini ile fiili saat arasındaki farktır; TL tutarı değildir.
      B: Fiili GÜG ile tahmini ölçüye göre bulunan yüklenen GÜG (416.000) arasındaki farktır; yükleme fiili ölçüyle yapılır.
      D: Saat farkının oranla çarpımıdır (1.000 × 16); fiili GÜG ile yüklenen GÜG arasındaki fark değildir.
      E: Siparişlere yüklenen GÜG tutarıdır; fark değildir.
    hesap_adimlari:
    - Yüklenen = 16 × 25.000 = 400.000
    - Fark = 412.000 − 400.000 = 12.000 TL eksik yükleme
  kaynaklar:
  - mevzuat: 'MSUGT Sıra No: 1, Tek Düzen Hesap Planı'
    madde: 732 Genel Üretim Giderleri Bütçe Farkları
    alinti: Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz
      bütçe farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir. Dönem
      sonlarında bu hesap ilgili stok ve satış maliyeti hesaplarına aktarılarak kapatılır.
