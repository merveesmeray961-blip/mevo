    25 adetlik bir partidir; 6 kurulum, 4 kalite kontrol ve 30 taşıma kullanmış, ayrıca 100 makine saati çalışmıştır. Toplam
    GÜG 220.000 TL, toplam makine saati 8.800'dür (geleneksel oran 25 TL/saat). Faaliyet tabanlı maliyetlemeye göre F siparişinde
    bir adet mamule yüklenen GÜG kaç TL'dir? KDV dikkate alınmayacaktır.
  secenekler:
    A: 40 TL
    B: 48 TL
    C: 100 TL
    D: 124 TL
    E: 3.100 TL
