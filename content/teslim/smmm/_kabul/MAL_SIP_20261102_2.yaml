  aciklama:
    dogru_neden: 'FTM''de siparişe yüklenen GÜG, faaliyet oranı × kullanılan sürücü miktarlarının toplamıdır: 6 × 150 + 4
      × 250 + 30 × 40 = 900 + 1.000 + 1.200 = 3.100 TL. Adet başına 3.100 / 25 = 124 TL''dir. Püf noktaları: Makine saati
      ve toplam GÜG geleneksel yöntem verileridir ve burada gereksizdir. Her faaliyetin kendi oranı vardır; son adımda parti
      miktarına bölmeyi unutma.'
    celdiriciler:
      A: Yalnızca kalite kontrol faaliyetinin (1.000 TL) birim payıdır.
      B: Yalnızca taşıma faaliyetinin (1.200 TL) birim payıdır.
      C: Geleneksel oranla bulunan GÜG'nin (100 × 25 = 2.500 TL) birim payıdır.
      E: Siparişe yüklenen toplam GÜG'dür; adet sayısına bölünmemiştir.
    hesap_adimlari:
    - GÜG = 900 + 1.000 + 1.200 = 3.100 TL
    - Adet başına = 3.100 / 25 = 124 TL
