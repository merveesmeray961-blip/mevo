  kok: Bir işletme sipariş maliyetini hesaplarken siparişe ait bazı giderleri stok maliyeti dışında bırakmak istemektedir.
    TMS 2'ye göre stokların maliyetine dahil edilmeyip dönem gideri olarak yansıtılan kalem aşağıdakilerden hangisidir?
  secenekler:
    A: Siparişe doğrudan yüklenen işçilik
    B: Sistematik dağıtılan değişken genel üretim giderleri
    C: Normal kapasiteye göre dağıtılan sabit genel üretim giderleri
    D: Üretimle doğrudan ilişkili diğer maliyetler
    E: Mamul satışına ilişkin katlanılan satış maliyetleri
  dogru: E
  aciklama:
    dogru_neden: TMS 2 paragraf 16(d)'ye göre satış maliyetleri stokların maliyetine dahil edilmeyen ve gerçekleştikleri dönemde
      gider olarak finansal tablolara yansıtılan maliyetlerdendir. Dönüştürme maliyetleri ise paragraf 12'ye göre stok maliyetine
      girer.
    celdiriciler:
      A: Dönüştürme maliyetidir; stok maliyetine dahildir.
      B: Dönüştürme maliyetinin parçasıdır; stok maliyetine dahildir.
      C: Dönüştürme maliyetinin parçasıdır; stok maliyetine dahildir.
      D: Stokların dönüştürme maliyeti kapsamındadır; dahil edilir.
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 16
    alinti: 'Aşağıdakiler, stokların maliyetine dâhil edilmeyen ve gerçekleştikleri dönemde gider olarak finansal tablolara
      yansıtılan maliyetlere örnek olarak verilebilir: (a) Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik
      ve diğer üretim maliyetleri, (b) Üretim sürecinde bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan
      depolama maliyetleri, (c) Stokların mevcut konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri,
      (d) Satış maliyetleri.'
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 12
    alinti: Stokların dönüştürme maliyetleri; direkt işçilik giderleri gibi, üretimle doğrudan ilişkili maliyetleri kapsar.
      Bu maliyetler ayrıca ilk madde ve malzemenin mamule dönüştürülmesinde katlanılan sabit ve değişken genel üretim giderlerinden
