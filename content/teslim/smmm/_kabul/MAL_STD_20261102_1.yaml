  zorluk: 1
  soru_bicimi: standart
  kok: AB İşletmesi, bir mamulün birim başına standart ilk madde miktarını 3 kg, standart fiyatını kg başına 20 ₺ olarak belirlemiştir.
    Dönemde 4.000 birim mamul üretilmiş; üretimde 12.000 kg ilk madde kullanılmış ve kg başına 21 ₺ fiyat üzerinden maliyetlendirilmiştir.
    Bu işletmenin direkt ilk madde ve malzeme fiyat sapması aşağıdakilerden hangisidir? (KDV dikkate alınmayacaktır.)
  secenekler:
    A: 12.000 ₺ olumsuz
    B: 12.000 ₺ olumlu
    C: 36.000 ₺ olumsuz
    D: 240.000 ₺
    E: 252.000 ₺ olumsuz
  dogru: A
  aciklama:
    dogru_neden: THP 712 uyarınca fiili direkt ilkmadde giderleri ile önceden saptanmış giderler arasındaki fiyat farkları
      bu hesapta izlenir. Fiyat sapması = (fiili fiyat − standart fiyat) × fiili miktar = (21 − 20) × 12.000 = 12.000 ₺'dir.
      Fiili fiyat standardın üzerinde olduğundan sapma olumsuzdur ve 712 hesabının borcuna kaydedilir.
    celdiriciler:
      B: Fiili fiyat standart fiyatın üzerinde olduğundan sapma olumlu değil olumsuzdur; olumsuz fiyat farkları 712 hesabının
        borcuna kaydedilir.
      C: Fiyat farkı (1 ₺), birim mamul başına 3 kg ile de çarpılmıştır; fiyat sapması yalnızca fiili miktarla çarpılır.
      D: 240.000 ₺ standart maliyettir (12.000 × 20); sapma tutarı değildir.
      E: 252.000 ₺ fiili maliyettir (12.000 × 21); sapma tutarı değildir.
    hesap_adimlari:
    - 'Fiili miktar: 12.000 kg'
    - 'Fiyat sapması: (21 - 20) × 12.000 = 12.000 ₺ olumsuz (fiili > standart)'
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1), Ek V Hesap Planı Açıklamaları'
    madde: 712 Direkt İlkmadde ve Malzeme Fiyat Farkı
    alinti: Önceden saptanmış maliyet hesaplama yöntemlerinin uygulandığı durumlarda fiili direkt ilkmadde ve malzeme giderleri
      ile önceden saptanmış ve maliyetlere yüklenmiş, direkt ilkmadde ve malzeme giderleri arasındaki olumlu veya olumsuz
      fiyat farklarının izlendiği hesaptır. Olumsuz fiyat farkları bu hesabın borcuna, olumlu fiyat farkları ise alacağına
      kaydedilir.
  gecerlilik:
    baslangic: '1992-12-26'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (21 - 20) * 12000
