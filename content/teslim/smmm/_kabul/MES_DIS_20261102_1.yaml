      tekrarı aranır. Şart, ilk iki cezanın kesinleşmesi ve bildirilmesidir.'
    celdiriciler:
      A: Üçüncü kez uyarma cezası gerektiren eylemin yinelenmesi md. 6/a gereği daha ağır ceza olan kınamayı gerektirir.
      C: Geçici alıkoyma md. 7/a'ya göre üçüncü kez kınama cezası gerektiren hâlin yinelenmesinde uygulanır; olayda tekrarlanan
