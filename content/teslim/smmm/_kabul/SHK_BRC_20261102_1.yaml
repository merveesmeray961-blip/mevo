    A: Malik ile intifa hakkı sahibi müteselsilen
    B: Yalnızca yapı maliki; intifa hakkı sahibi sorumlu tutulamaz
    C: Yalnızca binayı inşa eden müteahhit
    D: Yalnızca intifa hakkı sahibi
    E: Malik ile komşu bina malikleri müteselsilen
  dogru: A
  aciklama:
    dogru_neden: 'Md. 69/1 uyarınca yapı maliki, yapımındaki bozukluklardan veya bakımındaki eksikliklerden doğan zararı gidermekle
      yükümlüdür; md. 69/2 uyarınca intifa ve oturma hakkı sahipleri de binanın bakımındaki eksikliklerden doğan zararlardan
      malikle birlikte müteselsilen sorumludur. Püf noktaları: Kopan parça bakım eksikliğinden doğmuştur; bu nedenle intifa
      hakkı sahibi de sorumluluğa dâhildir. Yapımdaki bozukluktan doğan zararda ise md. 69/2 intifa hakkı sahibini kapsamaz.'
    celdiriciler:
      B: Md. 69/2 bakım eksikliğinden doğan zararda intifa hakkı sahibini de sorumlu kılar; yalnızca maliki sorumlu saymaz.
      C: Müteahhit md. 69'un sorumlu kıldığı kişi değildir; sorumluluk yapı maliki ve hak sahiplerine aittir.
      D: Md. 69/2 intifa hakkı sahibini malikle birlikte sorumlu tutar; tek başına sorumlu olduğu söylenemez.
      E: Komşu bina malikleri md. 69/2'de sorumlu olarak sayılmamıştır.
  kaynaklar:
  - mevzuat: 6098 sayılı Türk Borçlar Kanunu
    madde: md. 69/1-2
    alinti: Bir binanın veya diğer yapı eserlerinin maliki, bunların yapımındaki bozukluklardan veya bakımındaki eksikliklerden
