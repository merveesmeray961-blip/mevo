  kazanim: sürekli iş göremezlik geliri
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: İş kazası sonucu meslekte kazanma gücü yüzde 8 oranında azalan sigortalı T'nin durumu, Kurum Sağlık Kurulunca tespit
    edilmiştir. 5510 sayılı Kanun'a göre T için sürekli iş göremezlik geliri bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Gelir bağlanır; çünkü her oranda kazanma gücü kaybı gelir hakkı doğurur.
    B: Gelir bağlanır; çünkü iş kazası sonucu azalma oranı aranmaz.
    C: Gelir bağlanmaz; çünkü gelir için en az yüzde elli azalma gerekir.
    D: Gelir bağlanır; ancak yüzde onluk kısmi gelir olarak.
    E: Gelir bağlanmaz; çünkü azalma oranı yüzde onun altındadır.
  dogru: E
  aciklama:
    dogru_neden: 5510 sayılı Kanun md. 19/1 uyarınca iş kazası veya meslek hastalığı sonucu Kurum Sağlık Kurulunca meslekte
      kazanma gücü en az %10 oranında azalmış bulunduğu tespit edilen sigortalı sürekli iş göremezlik gelirine hak kazanır.
      T'nin azalma oranı %8 olduğundan gelir bağlanmaz.
    celdiriciler:
      A: Gelir hakkı her azalma oranında doğmaz; md. 19/1 en az %10 azalma arar.
      B: Azalma oranı iş kazasında da aranır; md. 19/1'in alt sınırı %10'dur.
      C: Yüzde elli oranı md. 20/2'de ölen sigortalının geliriyle ilgili bir orandır; gelir hakkı için aranan oran değildir.
      D: Yüzde onluk kısmi gelir ancak azalma oranı en az %10 ise bağlanabilir; %8 bu eşiği karşılamaz.
  kaynaklar:
  - mevzuat: 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu
    madde: md. 19/1
    alinti: Kurum Sağlık Kurulunca meslekte kazanma gücü en az %10 oranında azalmış bulunduğu tespit edilen sigortalı, sürekli
      iş göremezlik gelirine hak kazanır.
