      toplantının yapılabilmesi için nisap aranmaz.
    celdiriciler:
      A: Yarı oranı md. 418/1'deki nisap değildir; esas toplantı nisabı dörtte birdir.
      B: İkinci toplantıda nisap aranmaz; aynı nisabın aranması md. 418/1'e aykırıdır.
      C: Üçte bir oranı esas sözleşme değişikliğinin ikinci toplantı nisabıdır (md. 421); olağan toplantı nisabı dörtte birdir.
      D: Üçte iki oranı md. 418/1'de aranmaz; ayrıca ikinci toplantı yapılabilir.
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 418/1
    alinti: Genel kurullar, bu Kanunda veya esas sözleşmede, aksine daha ağır nisap öngörülmüş bulunan hâller hariç, sermayenin
      en az dörtte birini karşılayan payların sahiplerinin veya temsilcilerinin varlığıyla toplanır. Bu nisabın toplantı süresince
