    A: Sermayenin en az yarısı; ikinci toplantı için nisap aranmaz.
    B: Sermayenin en az dörtte biri; ikinci toplantıda da aynı nisap aranır.
    C: Sermayenin en az üçte biri; ikinci toplantıda sermayenin onda biri aranır.
    D: Sermayenin en az üçte ikisi; ikinci toplantı yapılamaz.
    E: Sermayenin en az dörtte biri; ikinci toplantı için nisap aranmaz.
