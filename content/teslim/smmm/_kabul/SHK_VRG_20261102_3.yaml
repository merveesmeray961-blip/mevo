    A: 20.000 TL
    B: 180.000 TL
    C: 200.000 TL
    D: 230.000 TL
    E: 1.200.000 TL
  dogru: B
  aciklama:
    dogru_neden: '193 sayılı Kanun md. 38 uyarınca bilanço esasına göre ticari kazanç, öz sermayenin dönem sonundaki ve başındaki
      değerleri arasındaki müspet farktır; dönem içinde işletmeye ilave olunan değerler bu farktan indirilir, işletmeden çekilen
      değerler farka ilave olunur. 700.000 - 500.000 = 200.000; 200.000 - 50.000 + 30.000 = 180.000 TL. Püf noktaları: İlave
      edilen sermaye farktan düşülür, çekilen değer farka eklenir; yönleri karıştırırsanız 230.000 TL bulursunuz.'
    celdiriciler:
      A: 20.000 TL, yalnızca ilave ve çekilen değerlerin farkıdır; öz sermaye farkı hesaba katılmamıştır.
      C: 200.000 TL, ilave ve çekilen değerlerle düzeltme yapılmayan ham öz sermaye farkıdır.
      D: 230.000 TL, ilave edilen değerin farka eklenmesi ve çekilen değerin düşülmesi gibi yönleri ters uygulamakla bulunur;
        doğrusu tersidir.
      E: 1.200.000 TL iki dönemin öz sermayelerinin toplamıdır; md. 38 fark esasına dayanır.
    hesap_adimlari:
    - 'Öz sermaye farkı: 700.000 - 500.000 = 200.000 TL'
    - 'İlave edilen 50.000 TL farktan indirilir: 150.000 TL'
    - 'Çekilen 30.000 TL farka eklenir: 180.000 TL'
  dogrulama:
    python: sonuc = (700000 - 500000) - 50000 + 30000
