  kok: Bilanço esasına göre defter tutan tacir S'nin öz sermayesi dönem başında 500.000 TL, dönem sonunda 700.000 TL'dir.
    Dönem içinde S işletmeye 50.000 TL ilave etmiş, işletmeden 30.000 TL çekmiştir. 193 sayılı Gelir Vergisi Kanunu'nun 38
    inci maddesine göre ticari kazanç kaç TL'dir? (Diğer düzeltmeler dikkate alınmayacaktır.)
