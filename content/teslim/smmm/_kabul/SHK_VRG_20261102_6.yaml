  kok: Öz sermayesi 200.000 TL olan bir kurum, hesap dönemi içinde herhangi bir tarihte ortağından 750.000 TL borç temin ederek
    işletmede kullanmıştır. 5520 sayılı Kurumlar Vergisi Kanunu'nun 12 nci maddesine göre örtülü sermaye sayılan tutar kaç
    TL'dir? (Diğer koşullar sağlanmış kabul edilecektir.)
  secenekler:
    A: 0 TL
    B: 150.000 TL
    C: 550.000 TL
    D: 600.000 TL
    E: 1.350.000 TL
  dogru: B
  aciklama:
    dogru_neden: '5520 sayılı Kanun md. 12/1 uyarınca ortaklardan temin edilerek işletmede kullanılan borçların, hesap dönemi
      içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı örtülü sermaye sayılır. Öz sermayenin üç katı
      600.000 TL''dir; 750.000 - 600.000 = 150.000 TL örtülü sermayedir. Püf noktaları: Sınır öz sermayenin kendisi değil
      üç katıdır; yalnızca bu sınırı aşan kısım örtülü sermaye sayılır, borcun tamamı değil.'
    celdiriciler:
      A: 0 TL, borcun sınırı aşmadığı anlamına gelir; oysa borç 600.000 TL'yi aşmaktadır.
      C: 550.000 TL, borçtan öz sermayenin yalnızca bir katı düşülerek bulunur; sınır üç kattır.
      D: 600.000 TL, öz sermayenin üç katıdır; örtülü sermaye bu sınırı aşan kısımdır.
      E: 1.350.000 TL borç ile üç katın toplamıdır; md. 12 aşan kısmı örtülü sermaye sayar.
    hesap_adimlari:
    - 'Sınır: öz sermayenin üç katı = 600.000 TL'
    - 'Aşan kısım: 750.000 - 600.000 = 150.000 TL'
  dogrulama:
    python: sonuc = 750000 - 3 * 200000
