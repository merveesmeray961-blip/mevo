  kok: Teminatlı borçlanma araçlarının toplam nominal değeri 80.000.000 TL'dir. Vadede ödeme yapılmamış ve teminat olarak
    devredilen gayrimenkul 60.000.000 TL'ye satılmıştır. Satış tutarı yatırımcılar arasında nominal tutarları oranında paylaştırılacaktır.
    6362 sayılı Sermaye Piyasası Kanunu'nun 31/B maddesi esas alındığında nominal değeri 400.000 TL olan bir yatırımcıya kaç
    TL ödenir?
  secenekler:
    A: 30.000 TL
    B: 300.000 TL
    C: 320.000 TL
    D: 400.000 TL
    E: 3.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 31/B-2 uyarınca teminat konusu varlıkların satış tutarı yatırımcılar arasında paylaştırılır.
      Satış tutarı yükümlülüğü karşılamadığından karşılama oranı 60.000.000 / 80.000.000 = %75''tir; nominali 400.000 TL olan
      yatırımcıya 400.000 x 0,75 = 300.000 TL ödenir. Püf noktaları: Satış bedeli alacağı karşılamıyorsa iade söz konusu değildir;
      yatırımcılar karşılama oranı kadar alacaklarını tahsil eder, kalan alacak için ihraççıya karşı genel hükümlere göre
      takip hakkı sürer.'
    hesap_adimlari:
    - Karşılama oranı = 60.000.000 / 80.000.000 = 0,75
    - Ödenecek tutar = 400.000 x 0,75 = 300.000 TL
    celdiriciler:
      A: Bir basamak kaydırılmış tutardır.
      C: Karşılama oranı %80 alınarak bulunmuştur; doğru oran %75'tir.
      D: Yatırımcının nominal alacağının tamamıdır; satış tutarı alacağı tümüyle karşılamamaktadır.
      E: Sonuç bir basamak kaydırılarak yazılmıştır.
  dogrulama:
    python: sonuc = 400000 * (60000000 / 80000000)
