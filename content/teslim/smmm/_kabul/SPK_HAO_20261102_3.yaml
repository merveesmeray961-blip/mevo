  kazanim: özel durumlar
  tip: uygulama
  zorluk: 2
  soru_bicimi: standart
  kok: Payları borsada işlem gören T3 Anonim Ortaklığı'nın payının fiyat ve işlem hacminde olağan piyasa koşullarıyla açıklanamayan
    bir değişim olmuş ve ilgili borsa T3'ten açıklama talep etmiştir. Özel Durumlar Tebliği (II-15.1) md. 8'e göre T3'ün yapacağı
    açıklamada aşağıdakilerden hangisi belirtilir?
  secenekler:
    A: Yalnızca fiyat değişiminin sebebinin ortaklık yönetimince bilinmediği ve araştırma yapıldığı
    B: Kamuya açıklanmış özel durumların tamamının yeniden sayıldığı
    C: Açıklamanın Kurula bildirilmesi şartıyla gizlilik kararı alındığı
    D: Hisse alım satımı yapan kişilerin kimlik bilgileri
    E: Açıklanmamış özel durumların bulunup bulunmadığı ve varsa tümü
  dogru: E
  aciklama:
    dogru_neden: II-15.1 md. 8/1 uyarınca ihraççılar, fiyat veya işlem hacminde olağan piyasa koşullarıyla açıklanamayan değişimler
      olduğunda ilgili borsanın talebi üzerine kamuya açıklama yapar; bu açıklamada kamuya henüz açıklanmamış özel durumların
      bulunup bulunmadığı belirtilir ve varsa (md. 6 hükümleri saklı kalmak üzere) açıklanmamış tüm özel durumlara yer verilir.
    celdiriciler:
      A: Md. 8/1 açıklanmamış özel durum olup olmadığının belirtilmesini ister; yalnızca bilinmediğinin söylenmesi yeterli
        değildir.
      B: Açıklanmış durumlar değil, henüz açıklanmamış özel durumlar belirtilir.
      C: Md. 8/1 gizlilik kararı alınmasını öngörmez; md. 6 ertelemesi ayrı bir kuraldır.
      D: İşlem yapan kişilerin kimlik bilgileri md. 8/1 açıklamasının içeriği değildir.
  kaynaklar:
  - mevzuat: Özel Durumlar Tebliği (II-15.1)
    madde: md. 8/1
    alinti: İhraççılar, sermaye piyasası araçlarının fiyatları veya işlem hacimlerinde olağan piyasa koşullarıyla açıklanamayan
