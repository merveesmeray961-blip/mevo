  sinav: smmm
  bolum:
  - YET
  ders: SPK
  unite: Kolektif yatırım kuruluşları
  konu: KYK
  kazanim: yatırım fonları
  tip: kavrama
  zorluk: 3
  soru_bicimi: oncullu
  kok: 'Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1) uyarınca şemsiye fonlara ilişkin aşağıdaki ifadelerden hangileri
    doğrudur?


    I. Yatırım fonlarının şemsiye fon şeklinde kurulması zorunludur.

    II. Kurulca onaylanan şemsiye fon içtüzüğü ticaret siciline tescil ettirilmez; yalnızca KAP''ta ilan edilir.

    III. Şemsiye fonun kuruluş giderleri ile fonların katılma payı ihraç giderleri hariç olmak üzere, bir şemsiye fon için
    yapılması gereken giderler fonların toplam değerleri dikkate alınarak oransal olarak bu fonların portföylerinden karşılanır.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve III
    E: I, II ve III
  dogru: C
  aciklama:
    dogru_neden: 'III-52.1 md. 10/1 uyarınca yatırım fonlarının şemsiye fon şeklinde kurulması zorunludur (I doğru). Md. 4/3-b
      uyarınca kuruluş ve ihraç giderleri hariç şemsiye fon giderleri, fonların toplam değerleri dikkate alınarak oransal
      olarak fonların portföylerinden karşılanır (III doğru). Md. 10/5 uyarınca onaylanan içtüzük ticaret siciline tescil
      ettirilir ve TTSG ile KAP''ta ilan olunur; bu nedenle II yanlıştır. Püf noktaları: İçtüzük için hem tescil hem ilan
      aranır; tescil edilmeyip yalnız KAP''ta ilan edilen belge izahnamedir, içtüzük değil. Giderlerin dağıtımında ölçüt fonların
      toplam değerleridir.'
    celdiriciler:
      A: III de doğrudur; gider paylaşımı md. 4/3-b'de oransal olarak düzenlenmiştir.
      B: II yanlıştır; içtüzük ticaret siciline tescil ettirilir. III ise doğru olduğu hâlde dışarıda bırakılmıştır.
      D: II yanlıştır; ayrıca doğru olan I dışarıda bırakılmıştır.
      E: II yanlış olduğundan üç öncülün hepsi doğru değildir.
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 10/1
    alinti: (1) Yatırım fonlarının şemsiye fon şeklinde kurulması zorunludur.
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 10/5
    alinti: (5) Kurulca onaylanan içtüzük, Kurul kararının şirket tarafından tebellüğ edildiği tarihi izleyen altı iş günü
      içinde kurucunun merkezinin bulunduğu yerin ticaret siciline tescil ettirilir ve TTSG ile KAP’ta ilan olunur.
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 4/3-b
    alinti: b) Şemsiye fonun kuruluş giderleri ile fonların katılma payı ihraç giderleri hariç olmak üzere, bir şemsiye fon
      için yapılması gereken tüm giderler fonların toplam değerleri dikkate alınarak oransal olarak bu fonların portföylerinden
      karşılanır.
