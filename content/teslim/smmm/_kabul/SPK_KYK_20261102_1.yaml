    dogru_neden: 'III-48.1 md. 11/1 uyarınca halka arz başvurusu, kuruluşun ticaret siciline tescilini takip eden üç ay içinde
      yapılmalıdır. Md. 11/3 uyarınca bu süre içinde başvurmayan ortaklığın GYO olarak faaliyette bulunma hakkı ortadan kalkar;
      ortaklık, sürenin bitiminden itibaren en geç üç ay içinde esas sözleşmeyi GYO faaliyetini kapsamayacak şekilde değiştirmek
      ve kayıtlı sermaye sisteminden çıkmak üzere Kurula başvurmakla yükümlüdür. Püf noktaları: Sonuç idari para cezası ya
      da hemen tasfiye değil, faaliyet hakkının düşmesi ve üç aylık dönüşüm başvurusu yükümlülüğüdür; iki üç aylık süre birbirine
      karıştırılmamalıdır.'
    celdiriciler:
      A: Md. 11/3 yaptırım olarak GYO faaliyet hakkının ortadan kalkmasını öngörür; faaliyete devam edilemez.
      B: Ortaklık hemen tasfiye edilmez; üç ay içinde esas sözleşmeyi değiştirmek üzere başvurmak zorundadır, yapmazsa TTK
        uyarınca sona ermiş sayılır.
      C: Md. 11'de bir yıllık zorunlu ek süre öngörülmemiştir.
      E: Nitelikli yatırımcıya satış, halka arz başvuru yükümlülüğünü ortadan kaldırmaz; bu seçenek GYO statüsünü korumaz.
