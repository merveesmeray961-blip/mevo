  kok: Bir şemsiye fonun içtüzüğü, Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1) uyarınca ticaret siciline tescil edilmiştir.
    Kurucu, bu şemsiye fona bağlı ilk fonun katılma payı ihracı için süresinde Kurula başvuramamış; makul gerekçelerini Kurula
    sunmuş ve Kurul, mevzuatın izin verdiği ek süreyi uygun görmüştür. İçtüzüğün tescilinden itibaren ilk fonun katılma payı
    ihracı başvurusu en geç kaç ay içinde yapılmalıdır?
  secenekler:
    A: Üç ay
    B: Altı ay
    C: Dokuz ay
    D: On iki ay
    E: On beş ay
  dogru: B
  aciklama:
    dogru_neden: 'III-52.1 md. 11/2 uyarınca bir şemsiye fona bağlı ilk fonun katılma payı ihracı başvurusu içtüzüğün tescilinden
      itibaren en geç üç ay içinde yapılmalıdır; Kurulca uygun görülecek makul gerekçelerin varlığı hâlinde bu süre bir defaya
      mahsus olmak üzere üç ay daha uzatılabilir. Toplam süre 3 + 3 = 6 aydır. Püf noktaları: Uzatma süresi asıl sürenin üzerine
      eklenir, yenilenmez; uzatma yalnızca bir defa yapılabilir. Süre aşılırsa içtüzük kurucu tarafından ticaret sicilinden
      terkin ettirilir.'
    celdiriciler:
      A: Üç ay yalnızca asıl süredir; Kurulca uygun görülen makul gerekçe hâlinde üç ay daha uzatılabilir.
      C: Dokuz ay, ek sürenin birden fazla kez verilmesiyle bulunur; uzatma yalnızca bir defaya mahsustur.
      D: Oniki ay, md. 11/2'de öngörülen bir süre değildir.
      E: On beş ay, md. 11/2'de öngörülen bir süre değildir.
  kaynaklar:
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 11/2
    alinti: Şu kadar ki, bir şemsiye fona bağlı olarak oluşturulacak ilk fonun katılma payı ihracı başvurusunun içtüzüğün
      tescilinden itibaren en geç üç ay içinde yapılması zorunludur. Bu süre içinde Kurula başvuru yapılmaması durumunda,
      içtüzük kurucu tarafından ticaret sicilinden terkin ettirilir.
  - mevzuat: Yatırım Fonlarına İlişkin Esaslar Tebliği (III-52.1)
    madde: md. 11/2
    alinti: Kurulca uygun görülecek makul gerekçelerin varlığı halinde, bu fıkrada belirtilen üç aylık süre bir defaya mahsus
      olmak üzere üç ay daha uzatılabilir.
