    - Kredi üst sınırı = 60 x 5 = 300 milyon TL
    - Dikkate alınacak yükümlülükler = 110 + 40 + 25 = 175 milyon TL
    - İlave kredi hakkı = 300 - 175 = 125 milyon TL
