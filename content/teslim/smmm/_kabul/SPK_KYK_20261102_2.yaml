    I. Yatırım fonu kuruluş başvuruları, belgelerin eksiksiz sunulmasından itibaren altı ay içinde karara bağlanır.

    II. Portföy yönetim şirketi ile katılma payı sahipleri arasındaki ilişkilere, hüküm bulunmayan hâllerde Türk Borçlar Kanunu''nun
    vekâlet sözleşmesine ilişkin hükümleri kıyasen uygulanır.

