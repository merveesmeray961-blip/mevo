    D: Katılım şemsiye fonu
    E: Serbest şemsiye fon
  dogru: A
  aciklama:
    dogru_neden: III-52.1 md. 6/1-ç uyarınca portföy sınırlamaları itibarıyla md. 6/1'de sayılan diğer türlerden herhangi
