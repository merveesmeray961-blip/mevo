    - Tek banka sınırı = 200.000.000 x 0,10 = 20.000.000 TL; kalan = 20.000.000 - 7.000.000 = 13.000.000 TL
    - İlave azami tutar = min(30.000.000; 13.000.000) = 13.000.000 TL
    celdiriciler:
      A: Bir basamak kayması ile yazılmış bir tutardır; hiçbir sınırdan bu sonuç çıkmaz.
