  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 24/1-c
    alinti: c) Portföyünde bulunan ve alımından itibaren beş yıl geçmesine rağmen üzerlerinde proje geliştirilmesine yönelik
      herhangi bir tasarrufta bulunulmayan arsa ve arazilerin oranı aktif toplamının %20’sini aşamaz.
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 31/1
