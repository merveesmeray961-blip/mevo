    dogru_neden: 'III-52.1 md. 17/5 uyarınca katılım fonlarında katılma hesaplarında değerlendirilebilecek toplam tutar fon
      toplam değerinin %25''i, tek bir bankada değerlendirilebilecek tutar ise %10''udur. Toplam sınır 200.000.000 x %25 =
      50.000.000 TL, tek banka sınırı 200.000.000 x %10 = 20.000.000 TL''dir. Toplam sınırdan kalan 50.000.000 - 20.000.000
      = 30.000.000 TL, Y bankası sınırından kalan ise 20.000.000 - 7.000.000 = 13.000.000 TL''dir; bağlayıcı olan küçük tutar
      13.000.000 TL''dir. Püf noktaları: Standart fonlardaki %10 ve %3 oranları katılım fonlarında %25 ve %10 olarak uygulanır;
      iki sınırdan kalan hak ayrı ayrı bulunup küçüğü alınır.'
