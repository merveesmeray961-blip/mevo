    dogru_neden: '6362 sayılı Kanun md. 52/4 uyarınca PYŞ ile katılma payı sahipleri arasındaki ilişkilere hüküm bulunmayan
      hâllerde TBK md. 502-514 (vekâlet) kıyasen uygulanır (II doğru). Md. 52/5 uyarınca fon, sicil işlemleri ile ortağı olacağı
      limited ve anonim şirketlerin ticaret sicili işlemleriyle sınırlı olarak tüzel kişiliği haiz addolunur (III doğru).
      Md. 52/2 uyarınca kuruluş başvuruları iki ay içinde karara bağlanır; altı ay portföy yönetim şirketi için öngörülmüştür
      (I yanlış). Püf noktaları: Fon tüzel kişi değildir; tüzel kişilik yalnızca sicil işlemleri bakımından tanınmıştır. İki
      ay ile altı ay süreleri sık karıştırılır.'
    celdiriciler:
      A: III de doğrudur; fon sicil işlemleriyle sınırlı olarak tüzel kişi addolunur.
      B: II de doğrudur; PYŞ ile katılma payı sahipleri arasındaki ilişkide vekâlet hükümleri kıyasen uygulanır.
      C: I yanlıştır; kuruluş başvuruları altı ay değil iki ay içinde karara bağlanır. III ise doğru olduğu hâlde dışarıda
