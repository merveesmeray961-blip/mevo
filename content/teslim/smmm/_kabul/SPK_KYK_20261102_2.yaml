  kok: 'Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1) uyarınca (altyapı yatırım ve hizmetlerinden
    oluşan portföyü işletecek ortaklıklar dışındaki ortaklıklar esas alınacaktır) portföy ve borçlanma sınırlarına ilişkin
    aşağıdaki ifadelerden hangileri doğrudur?


    I. Aktif toplamının en az %75''i gayrimenkul, gayrimenkul projesi ve gayrimenkule dayalı haklara yatırılmalıdır.

    II. Portföyde bulunan ve alımından itibaren beş yıl geçmesine rağmen üzerlerinde proje geliştirilmeyen arsa ve arazilerin
    oranı aktif toplamının %20''sini aşamaz.

    III. Ortaklıklar, bireysel finansal tablolarında yer alan öz sermayelerinin beş katı kadar kredi kullanabilirler.'
  secenekler:
    A: Yalnız II
    B: Yalnız III
    C: I ve II
    D: I ve III
    E: II ve III
  dogru: E
  aciklama:
    dogru_neden: III-48.1 md. 24/1-c uyarınca alımından itibaren beş yıl geçmesine rağmen proje geliştirilmeyen arsa ve arazilerin
      oranı aktif toplamının %20'sini aşamaz (II doğru). Md. 31/1 uyarınca ortaklıklar öz sermayelerinin beş katı kadar kredi
      kullanabilir (III doğru). Md. 24/1-a'daki asgari oran %51'dir; %75 oranı yalnızca münhasıran altyapı portföyü işleten
      ortaklıklar için geçerlidir (I yanlış).
    celdiriciler:
      A: III de doğrudur; öz sermayenin beş katı kredi sınırı md. 31/1'de yer alır.
      B: II de doğrudur; beş yıl proje geliştirilmeyen arsa ve arazi oranı md. 24/1-c ile %20'yle sınırlıdır.
      C: I yanlıştır, çünkü altyapı dışındaki ortaklıklar için asgari oran %51'dir; III ise doğru olduğu hâlde dışarıda bırakılmıştır.
      D: I yanlıştır; ayrıca doğru olan II dışarıda bırakılmıştır.
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 24/1-a
    alinti: Gayrimenkullere, gayrimenkul projelerine, gayrimenkule dayalı haklara, gayrimenkul yatırım fonu katılma paylarına
      ve sermayesine %100 oranında iştirak ettikleri 28 inci maddenin birinci fıkrasının (ç) bendi kapsamındaki şirketlere
