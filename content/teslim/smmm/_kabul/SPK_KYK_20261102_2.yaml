    dogru_neden: III-48.1 md. 31/1 uyarınca ortaklıklar öz sermayelerinin beş katı kadar kredi kullanabilir; üst sınırın hesabında
      finansal kiralama borçları ve gayri nakdi krediler de dikkate alınır. Sınır 60 x 5 = 300 milyon TL, mevcut yükümlülükler
      110 + 40 + 25 = 175 milyon TL olduğundan ilave kredi hakkı 125 milyon TL'dir.
