  kok: Bir değişken sermayeli yatırım ortaklığının varlıkları toplamı 80.000.000 TL, borçları toplamı 5.000.000 TL'dir. Dolaşımdaki
    pay sayısı 1.500.000'dür. 6362 sayılı Sermaye Piyasası Kanunu'nun 50 nci maddesine göre ortaklığın sermayesi kaç TL'dir?
  secenekler:
    A: 7.500.000 TL
    B: 75.000.000 TL
    C: 80.000.000 TL
    D: 85.000.000 TL
    E: 750.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 6362 sayılı Kanun md. 50/1 uyarınca DSYO'nun sermayesi her zaman net aktif değerine eşittir; net aktif değer
      varlıkların toplamından borçların toplamı düşülerek bulunur. 80.000.000 - 5.000.000 = 75.000.000 TL'dir. Pay sayısı
      bu hesapta kullanılmaz.
    hesap_adimlari:
    - Net aktif değer = 80.000.000 - 5.000.000 = 75.000.000 TL
    - Sermaye = net aktif değer = 75.000.000 TL
    celdiriciler:
      A: Sonuç bir basamak kaydırılarak yazılmıştır; doğru hesapta sermaye 75.000.000 TL'dir.
      C: Varlıklar toplamıdır; borçlar düşülmediği için net aktif değer değildir.
      D: Borçlar varlıklara eklenerek bulunmuştur; borçlar düşülmelidir.
      E: Sonuç bir basamak kaydırılarak yazılmıştır; doğru sermaye 75.000.000 TL'dir.
  dogrulama:
    python: sonuc = 80000000 - 5000000
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 50/1
    alinti: Net aktif değer ise varlıkların toplamından borçların toplamının düşülmesi suretiyle bulunan tutarı ifade eder.
