  kok: Payları henüz halka arz edilmemiş bir gayrimenkul yatırım ortaklığında ortak M, ortaklık sermayesinin %12'sini temsil
    eden paylarını üçüncü kişi N'ye devretmiş ve devri Kurul iznini almadan pay defterine kaydettirmiştir. Gayrimenkul Yatırım
    Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1) md. 15'e göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Devir, Kurul izni gerektirmediğinden geçerlidir; yalnızca bildirim yapılır
    B: Devir geçerlidir; Kurul izni yalnızca halka arzdan sonraki devirlerde aranır
    C: Devir yalnızca ortaklık yönetim kurulunun onayıyla geçerli hâle getirilebilir
    D: Devir, ancak N'nin Kurula başvurması hâlinde on iş günü içinde geçerli sayılır
    E: Devir Kurul iznine tabidir; pay defterine kaydolunmaz ve kayıt hükümsüz olur
  dogru: E
  aciklama:
    dogru_neden: III-48.1 md. 15/1 uyarınca payların halka arzından veya nitelikli yatırımcıya satışından önce ortaklık sermayesinin
      %10 ve daha fazlasını temsil eden payların devirleri Kurul iznine tabidir. Md. 15/5 uyarınca esaslara aykırı devirler
      pay defterine kaydolunmaz ve yapılan kayıtlar hükümsüzdür.
    celdiriciler:
      A: '%12''lik devir %10 eşiğini aştığından Kurul iznine tabidir; yalnızca bildirimle yetinilemez.'
      B: Halka arzdan önceki dönemde de %10 ve üzeri devirler Kurul iznine tabidir.
      C: Yönetim kurulunun onayı Kurul izninin yerini tutmaz.
      D: On iş günü, %10'dan az pay edinimlerinde belgelerin Kurula iletilme süresidir; %12'lik devir için izin gerekir.
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 15/1
    alinti: Payların halka arzından veya nitelikli yatırımcıya satışından önce ortaklık sermayesinin %10 ve daha fazlasını
      temsil eden payların devirleri ile herhangi bir orana bakılmaksızın imtiyazlı payların devirleri Kurul iznine tabidir.
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 15/5
    alinti: Söz konusu fıkra hükümlerine aykırı olarak pay defterine yapılan kayıtlar hükümsüzdür.
