  kok: Halka açık bir gayrimenkul yatırım ortaklığı, genel kurulunda gayrimenkul yatırım ortaklığı statüsünden çıkma sonucunu
    doğuracak esas sözleşme değişikliğine karar vermiştir. Bu karara karşı oy kullanan bir ortak ayrılma hakkını kullanmak
    istemektedir. Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1) md. 44'e göre aşağıdakilerden hangisi
    doğrudur?
  secenekler:
    A: Ortak, payının rayiç değer üzerinden ortaklıkça satın alınmasını talep edebilir
    B: Ortak, yalnızca Kurul izniyle ayrılma hakkını kullanabilir
    C: Bu madde kapsamında yapılacak işlemler bakımından ayrılma hakkı doğmaz
    D: Ortak, yönetim kontrolünü elinde bulundurmuyorsa ayrılma hakkını kullanabilir
    E: Ayrılma hakkı doğar; ancak yalnızca esas sözleşme değişikliğinin tescilinden sonra kullanılabilir
  dogru: C
  aciklama:
    dogru_neden: III-48.1 md. 44/6 uyarınca gayrimenkul yatırım ortaklığı statüsünden çıkma işlemleri bakımından ayrılma hakkı
      doğmaz. Ortakların korunması bunun yerine pay alım teklifi zorunluluğu (md. 44/1) gibi mekanizmalarla sağlanır.
    celdiriciler:
      A: Ayrılma hakkı doğmadığından payın ortaklıkça satın alınmasını isteme hakkı da yoktur.
      B: Md. 44/6, Kurul izniyle bile ayrılma hakkı tanımaz; hak hiç doğmaz.
      D: Yönetim kontrolü ölçütü md. 44/3'teki satış kısıtına ilişkindir; ayrılma hakkıyla ilgili değildir.
      E: Ayrılma hakkı tescilden sonra da doğmaz; md. 44/6 hakkı tümden dışlar.
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 44/6
    alinti: Bu madde kapsamında yapılacak işlemler bakımından ayrılma hakkı doğmaz.
