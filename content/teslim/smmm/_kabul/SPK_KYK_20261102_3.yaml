  kok: Halka arzdan sonra yönetim kontrolünü sağlayan paylara sahip olan ortak Z, gayrimenkul yatırım ortaklıkları için aranan
    nitelik şartlarını sonradan sağlayamaz hâle gelmiştir. Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    md. 15/2'ye göre Z'nin yükümlülüğü aşağıdakilerden hangisidir?
  secenekler:
    A: Şartları sağlayamadığı tarihten itibaren en geç üç ay içinde yönetim kontrolü sağlayan paylarını elden çıkarmak
    B: Şartları sağlayamadığı tarihten itibaren en geç bir yıl içinde yönetim kontrolü sağlayan paylarını elden çıkarmak
    C: Şartları yeniden sağlayıncaya kadar yalnızca oy haklarını kullanmaktan kaçınmak
    D: Şartları sağlayamadığını tevsik eden belgeleri on iş günü içinde Kurula iletmek ve payları elinde tutmaya devam etmek
    E: Payların tamamını Kurulca belirlenen fiyattan ortaklığa satmak
  dogru: A
  aciklama:
    dogru_neden: 'III-48.1 md. 15/2 uyarınca yönetim kontrolü sağlayan paylara sahip olan ortakların şartları sağlayamamaları
      hâlinde, yönetim kontrolü sağlayan paylarını şartları sağlayamadıkları tarihten itibaren en geç üç ay içerisinde elden
      çıkarmaları zorunludur. Püf noktaları: On iş günü, şartları taşıdığını gösteren belgelerin edinimden sonra Kurula iletilmesi
      süresidir; elden çıkarma süresi ise üç aydır.'
    celdiriciler:
      B: Bir yıl, md. 15/2'de öngörülen elden çıkarma süresi değildir; süre üç aydır.
      C: Oy hakkından kaçınmak kanunda öngörülen yükümlülük değildir; yönetim kontrolü sağlayan payların elden çıkarılması
        gerekir.
      D: On iş günü belgelerin Kurula iletilmesine ilişkindir; payların elde tutulmasına devam edilemez.
      E: Payların Kurulca belirlenen fiyattan ortaklığa satılması gibi bir yükümlülük md. 15/2'de yoktur.
  kaynaklar:
  - mevzuat: Gayrimenkul Yatırım Ortaklıklarına İlişkin Esaslar Tebliği (III-48.1)
    madde: md. 15/2
    alinti: Yönetim kontrolü sağlayan paylara sahip olan ortakların, söz konusu şartları sağlayamamaları halinde; yönetim
      kontrolü sağlayan paylarını, şartları sağlayamadıkları tarihten itibaren en geç üç ay içerisinde elden çıkarmaları zorunludur.
