  kok: 6362 sayılı Sermaye Piyasası Kanunu'na göre fon portföylerinde yer alan varlıkların niteliklerine göre saklama hizmeti
    için farklı esaslar belirleme veya saklama zorunluluğundan muafiyet getirme yetkisi kime aittir?
  secenekler:
    A: Portföy yönetim şirketinin yönetim kuruluna
    B: Portföy saklama hizmetini yürüten kuruluşa
    C: Merkezî Kayıt Kuruluşuna (MKK)
    D: Sermaye Piyasası Kurulu'na (SPK)
    E: Türkiye Sermaye Piyasaları Birliği'ne
  dogru: D
  aciklama:
    dogru_neden: 6362 sayılı Kanun md. 56/8 uyarınca Kurul, fon portföylerinde yer alan varlıkların nitelikleri, ihraççı ve
      ihracın yönelik olduğu yatırımcılar gibi ölçütlere göre saklama hizmeti için farklı esaslar belirleyebilir veya saklama
      zorunluluğundan muafiyet getirebilir.
    celdiriciler:
      A: Yetki portföy yönetim şirketine verilmemiştir; saklama muafiyeti düzenleyici kurum olan Kurulun yetkisindedir.
      B: Saklayıcı muafiyet verilecek tarafın karşısındaki hizmet sağlayıcıdır; muafiyet yetkisi ona ait değildir.
      C: MKK kaydi izleme yapar; saklama zorunluluğundan muafiyet getirme yetkisi md. 56/8'de MKK'ya tanınmamıştır.
      E: Birliğin böyle bir yetkisi md. 56/8'de öngörülmemiştir; yetki Kurula aittir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 56/8
    alinti: (8) Kurul, fon portföylerinde yer alan varlıkların nitelikleri, ihraççı, ihracın yönelik olduğu yatırımcılar,
      portföy yönetim şirketlerinin ve yatırım ortaklıklarının sermaye yapıları ve ihracın niteliklerine göre saklama hizmeti
      için farklı esaslar belirleyebilir veya saklama zorunluluğundan muafiyet getirebilir.
