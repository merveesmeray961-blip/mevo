    D: İhraççının yükümlülüklerini yerine getirememesi hâlinde portföy gelirinin öncelikle sertifika sahiplerine ödenmesi
    E: Kurulun kira sertifikası sahiplerinin haklarını korumak için gerekli her türlü tedbiri alma yetkisi
  dogru: A
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 61/6 uyarınca üçüncü fıkranın ikinci cümlesi ile dördüncü fıkra hükümleri, 5411 sayılı
      Kanun çerçevesinde gerçekleştirilen ve katılım bankalarının fon kullanıcısı olduğu ilave ana sermaye ve katkı sermaye
      niteliğindeki kira sertifikası ihraçlarında uygulanmaz. Üçüncü fıkranın ilk cümlesi (esas sözleşme dışında ticari faaliyette
      bulunamama) bu istisnaya dâhil değildir; dolayısıyla uygulanmaya devam eder. Püf noktaları: İstisna ''üçüncü fıkranın
      ikinci cümlesi'' ve ''dördüncü fıkranın tamamı'' ile sınırlıdır; haciz-iflas yasağı, portföy gelirinin önceliği ve Kurulun
      tedbir yetkisi dışarıda kalır, ilk cümle ise geçerlidir.'
    celdiriciler:
      B: Kanun, üçüncü fıkranın ikinci cümlesini bu tür ihraçlarda uygulamaz; haciz ve iflas masası yasağı bu ihraçlarda işlemez.
      C: Bu hüküm de üçüncü fıkranın ikinci cümlesinde yer alır ve ilave ana sermaye niteliğindeki ihraçlarda uygulanmaz.
      D: Dördüncü fıkra hükümleri bu tür ihraçlarda uygulanmaz.
      E: Bu yetki dördüncü fıkranın ikinci cümlesindedir; dördüncü fıkra hükümleri bu tür ihraçlarda uygulanmaz.
