      değil üç katıdır; gün sayısı üst sınırı, zarara bağlı alt sınırı ortadan kaldırmaz.'
    celdiriciler:
      A: Zararın bir katı kanundaki alt sınır değildir; hileli hâlde adli para cezası zararın üç katından az olamaz.
      B: Zararın iki katı kanundaki alt sınır değildir; alt sınır üç kattır.
      D: Yirmi bin gün üst sınırdır; ancak kanun ayrıca adli para cezasının miktarının zararın üç katından az olamayacağını
        öngörür, zarar tutarı dikkate alınır.
      E: Kanundaki alt sınır zararın yarısı değil, üç katıdır.
