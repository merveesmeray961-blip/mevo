  kok: Bir finansman ihtiyacı için her türlü varlık veya hakkın finansmanını sağlamak amacıyla ihraç edilen ve sahiplerinin
    bu varlık veya haklardan elde edilen gelirlerden payları oranında hak sahibi olmalarını sağlayan sermaye piyasası araçlarını,
    6362 sayılı Kanun'un 61 inci maddesine göre aşağıdakilerden hangisi ihraç eder?
  secenekler:
    A: Portföy yönetim şirketi
    B: Kitle fonlama platformu
    C: Varlık kiralama şirketi
    D: Merkezi takas ve saklama kuruluşu
    E: Yatırım kuruluşu
  dogru: C
  aciklama:
    dogru_neden: 6362 sayılı Kanun md. 61/1 uyarınca kira sertifikaları, her türlü varlık veya hakkın finansmanını sağlamak
      amacıyla varlık kiralama şirketleri tarafından ihraç edilen ve sahiplerinin bu varlık veya haklardan elde edilen gelirlerden
      payları oranında hak sahibi olmalarını sağlayan, nitelikleri Kurulca belirlenen sermaye piyasası araçlarıdır.
    celdiriciler:
      A: Portföy yönetim şirketleri yatırım fonlarını yönetir; kira sertifikalarını ihraç eden kuruluş değildir.
      B: Kitle fonlama platformları kitle fonlamasına aracılık eder; kira sertifikası ihraç etmez.
      D: Merkezi takas kuruluşları takas ve saklama işlevlerini yürütür; kira sertifikası ihraç etmez.
      E: Yatırım kuruluşları aracılık eder; kira sertifikalarını kanun uyarınca ihraç eden kuruluş varlık kiralama şirketidir.
