  kok: '6362 sayılı Sermaye Piyasası Kanunu''nun 61 inci maddesine göre varlık kiralama şirketleri ve kira sertifikaları ile
    ilgili aşağıdaki ifadelerden hangileri doğrudur?


    I. Varlık kiralama şirketi, esas sözleşmesinde belirtilen faaliyetler dışında herhangi bir ticari faaliyetle uğraşamaz.


    II. Varlık kiralama şirketleri münhasıran kira sertifikası ihraç etmek üzere kurulan anonim ortaklıklardır.


    III. Kira sertifikaları itfa edilinceye kadar portföydeki varlıklar, kamu alacaklarının tahsili amacıyla haczedilebilir.


    IV. Kira sertifikaları itfa edilinceye kadar portföydeki varlıklar hakkında ihtiyati tedbir kararı verilemez.'
  secenekler:
    A: I ve II
    B: I ve III
    C: II ve III
    D: I, II ve IV
    E: I, II, III ve IV
  dogru: D
  aciklama:
    dogru_neden: 6362 sayılı Kanun md. 61/2 uyarınca varlık kiralama şirketleri münhasıran kira sertifikası ihraç etmek üzere
      kurulan anonim ortaklıklardır (II doğru). Md. 61/3 uyarınca şirket esas sözleşmesindeki faaliyetler dışında ticari faaliyetle
      uğraşamaz (I doğru); kira sertifikaları itfa edilinceye kadar portföydeki varlıklar ve haklar kamu alacaklarının tahsili
      amacı da dâhil olmak üzere haczedilemez, iflas masasına dâhil edilemez ve bunlar hakkında ihtiyati tedbir kararı verilemez
      (III yanlış, IV doğru).
    celdiriciler:
      A: IV numaralı ifade de doğrudur; portföydeki varlıklar hakkında ihtiyati tedbir kararı verilemez.
      B: III yanlıştır; haciz yasağı kamu alacaklarının tahsili amacı dâhil olmak üzere uygulanır, ayrıca II ve IV de doğrudur.
      C: III yanlıştır; kamu alacağı için de haciz yapılamaz.
      E: III yanlıştır; kamu alacaklarının tahsili amacı dâhil olmak üzere portföydeki varlıklar haczedilemez.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/2
    alinti: (2) Varlık kiralama şirketleri münhasıran kira sertifikası ihraç etmek üzere kurulan anonim ortaklıklardır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/3
    alinti: Varlık kiralama şirketi, Kurul tarafından uygun görüş verilen esas sözleşmesinde belirtilen faaliyetler dışında
      herhangi bir ticari faaliyetle uğraşamayacağı gibi sahip olduğu varlıklar ve haklar üzerinde esas sözleşmesinde izin
      verilenler hariç olmak üzere, üçüncü kişiler lehine hiçbir ayni hak tesis edemez ve bunları kira sertifikası sahiplerinin
      menfaatlerine aykırı bir şekilde kiralayamaz veya devredemez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 61/3
    alinti: Kira sertifikaları itfa edilinceye kadar, varlık kiralama şirketinin portföyünde yer alan varlıklar ve haklar,
      ihraççının yönetiminin veya denetiminin kamu kurumlarına devredilmesi hâlinde dahi teminat amacı dışında tasarruf edilemez,
      rehnedilemez, teminat gösterilemez, kamu alacaklarının tahsili amacı da dâhil olmak üzere haczedilemez, iflas masasına
      dâhil edilemez, ayrıca bunlar hakkında ihtiyati tedbir kararı verilemez.
