    işlendiği anlaşılmıştır. Kripto varlık hizmet sağlayıcısının ve müşterilerinin uğradığı toplam zarar 3.500.000 TL'dir.
    6362 sayılı Kanun'un 110/A maddesine göre hâkimin hükmedeceği adli para cezası hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Adli para cezası 3.500.000 TL'den az olamaz.
    B: Adli para cezası 7.000.000 TL'den az olamaz.
    C: Adli para cezası 10.500.000 TL'den az olamaz.
    D: Adli para cezası yirmi bin günden fazla olamaz; zarar tutarı dikkate alınmaz.
    E: Adli para cezasının alt sınırı zararın yarısıdır.
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 110/A/2 uyarınca zimmetin açığa çıkmamasını sağlamaya yönelik hileli davranışlarla
      işlenmesi hâlinde faile on dört yıldan yirmi yıla kadar hapis ve yirmi bin güne kadar adli para cezası verilir; adli
      para cezasının miktarı kripto varlık hizmet sağlayıcının ve müşterilerinin uğradığı zararın üç katından az olamaz. Zarar
