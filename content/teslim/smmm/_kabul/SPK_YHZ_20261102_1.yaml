    I. Kurul, bankalar hariç olmak üzere tazmin sürecinin kapanmasına ilişkin kararı ile birlikte tedricî tasfiye kararı da
    verebilir.


    II. Tedricî tasfiye işlemleri YTM tarafından yürütülür.


    III. Tedricî tasfiye kararı verilmesi hâlinde bu tasfiyenin kapatılması kararına kadar iflas kararı verilemez.


    IV. Tedricî tasfiye karar ve işlemlerinde 6102 sayılı Kanun ile 2004 sayılı Kanunun tasfiye ile ilgili hükümleri uygulanır.'
  secenekler:
    A: I, II ve III
    B: I ve II
    C: II ve IV
    D: I, II ve IV
    E: I, II, III ve IV
  dogru: A
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 86/1 uyarınca Kurul, bankalar hariç olmak üzere tazmin sürecinin kapanmasına ilişkin
      kararı ile birlikte tedricî tasfiye kararı da verebilir ve tedricî tasfiye işlemleri YTM tarafından yürütülür (I ve
      II doğru). Md. 86/4 uyarınca tedricî tasfiye kararı verilmesi hâlinde bu tasfiyenin kapatılması kararına kadar iflas
      kararı verilemez (III doğru). Md. 86/2 uyarınca tedricî tasfiye karar ve işlemlerinde 6102 sayılı Kanun, 2004 sayılı
      Kanun ve diğer mevzuatın tasfiye ile ilgili hükümleri uygulanmaz (IV yanlış). Püf noktaları: Tedricî tasfiye genel tasfiye
      ve iflas hükümlerinden bağımsız özel bir rejimdir; bankalar bu rejimin dışındadır.'
    celdiriciler:
      B: III numaralı ifade de doğrudur; tedricî tasfiye kapatılana kadar iflas kararı verilemez.
      C: IV yanlıştır; tedricî tasfiye karar ve işlemlerinde 6102 ve 2004 sayılı Kanunların tasfiye ile ilgili hükümleri uygulanmaz.
      D: IV yanlıştır; bu Kanunların tasfiye hükümleri uygulanmaz, ayrıca III doğrudur.
      E: IV yanlıştır; md. 86/2 bu mevzuatın tasfiye hükümlerinin uygulanmayacağını açıkça belirtir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/1
    alinti: (1) 82 nci madde uyarınca yatırımcıları tazmin kararı verilenler hakkında Kurul, bankalar hariç olmak üzere, tazmin
      sürecinin kapanmasına ilişkin kararı ile birlikte tedricî tasfiye kararı da verebilir. Bu durumda tedricî tasfiye işlemleri
      YTM tarafından yürütülür.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/2
    alinti: Tedricî tasfiye karar ve işlemlerinde; 6102 sayılı Kanun, 2004 sayılı Kanun ve diğer mevzuatın tasfiye ile ilgili
      hükümleri uygulanmaz.
