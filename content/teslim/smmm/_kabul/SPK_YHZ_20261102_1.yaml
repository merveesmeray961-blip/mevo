        zorunluluğu yoktur.
      C: Tebliğ açık talimat hâlinde yükümlülüğün yerine getirilmiş sayılacağını belirtir; kuruluşun ayrıca değerlendirme
        yapması gerekmez.
      D: Tebliğde böyle bir onay yükümlülüğü yoktur.
      E: Açık talimat yalnızca en iyi şekilde gerçekleştirme yükümlülüğü bakımından kuruluşu korur; emir gerçekleştirme politikası
        ve diğer yükümlülükler ortadan kalkmaz.
