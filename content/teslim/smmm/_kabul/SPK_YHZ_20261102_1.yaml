  kok: Bir müşteri, hisse senedi alım emrinin yalnızca belirli bir piyasaya iletilmesi yönünde yatırım kuruluşuna açık talimat
    vermiştir. III-37.1 sayılı Tebliğ'e göre yatırım kuruluşu emri bu piyasaya ilettiğinde en iyi şekilde gerçekleştirme yükümlülüğü
    bakımından durum aşağıdakilerden hangisidir?
  secenekler:
    A: Yatırım kuruluşu, talimata rağmen daha uygun fiyatlı başka bir piyasaya yönlendirmek zorundadır.
    B: Açık talimat bulunduğundan kuruluş, en iyi şekilde gerçekleştirme yükümlülüğünü yerine getirmiş sayılır.
    C: Yatırım kuruluşu, yükümlülüğünü yerine getirmiş sayılmaz; çünkü yalnızca fiyat dikkate alınmıştır.
    D: Yatırım kuruluşu, emri yerine getirmeden önce Kurulun onayını almak zorundadır.
    E: Yatırım kuruluşu, emir gerçekleştirme politikasından bağımsız olarak emri gerçekleştirir; hiçbir yükümlülüğü kalmaz.
  dogru: B
  aciklama:
    dogru_neden: III-37.1 sayılı Tebliğ md. 30/2 uyarınca müşteri tarafından emrin belirli bir kuruluş veya piyasaya iletilmesi
      yönünde açık bir talimatının bulunduğu durumda yatırım kuruluşu müşteri emrini en iyi şekilde gerçekleştirme yükümlülüğünü
      yerine getirmiş sayılır.
    celdiriciler:
