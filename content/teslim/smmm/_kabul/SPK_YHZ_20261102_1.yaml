  kok: Hakkında tedricî tasfiye kararı verilen bir yatırım kuruluşunun aktiflerinden elde edilen nakit, 6362 sayılı Kanun'un
    86 ncı maddesine göre aşağıdaki alacakların ödenmesinde hangi sırayla kullanılır?
  secenekler:
    A: Müşteri alacakları, YTM'nin tazmin ödemeleri ve tasfiye giderleri, garameten kamu alacakları
    B: YTM'nin tazmin ödemeleri ve tasfiye giderleri, müşteri alacakları, garameten kamu alacakları
    C: Müşteri alacakları, garameten kamu alacakları, YTM'nin tazmin ödemeleri ve tasfiye giderleri
    D: Garameten kamu alacakları, müşteri alacakları, YTM'nin tazmin ödemeleri ve tasfiye giderleri, ardından diğer alacaklılar
    E: Tüm alacaklar aynı sırada ve eşit oranda garameten ödenir
  dogru: C
  aciklama:
    dogru_neden: '6362 sayılı Kanun md. 86/5 uyarınca tedricî tasfiyeye tabi kuruluşun aktiflerinden öncelikle müşteri alacakları
      ödenir; müşteri alacaklarının tamamının karşılanamaması hâlinde garameten ödeme yapılır. Bu alacaklar tamamen karşılandıktan
      sonra artan kısımdan öncelikle garameten kamu alacakları, kalandan ise YTM''nin md. 85 kapsamında yaptığı ödemeler ve
      tasfiye giderleri nedeniyle doğan alacağı ödenir. Bakiye diğer alacaklılara tahsis edilir. Püf noktaları: Sıra müşteri,
      kamu, YTM biçimindedir; YTM alacağı kamu alacaklarının arkasında yer alır. Ezber için sıra ile nedeni birlikte hatırlayın:
      müşteriyi koruma amacı önce gelir.'
    celdiriciler:
      A: YTM'nin ödemeleri kamu alacaklarından önce gelmez; müşteri alacaklarından sonra önce garameten kamu alacakları, sonra
        YTM'nin ödemeleri ve tasfiye giderleri ödenir.
      B: Aktiflerden öncelikle müşteri alacakları ödenir; YTM alacağı bu sıradan sonra gelir.
      D: Kamu alacakları müşteri alacaklarından önce değil, sonra ödenir.
      E: Kanun açık bir sıra öngörür; müşteri alacakları önceliklidir ve eşit dağıtım söz konusu değildir.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/5
    alinti: Aktiflerden öncelikle müşteri alacakları ödenir. Müşteri alacaklarının tamamının karşılanamaması hâlinde garameten
      ödeme yapılır. Bu alacaklar tamamen karşılandıktan sonra artan kısımdan, öncelikle garameten kamu alacakları ve kalandan
      YTM’nin 85 inci madde kapsamında yaptığı ödemeler ve tasfiye giderleri nedeniyle doğan alacağı ödenir. Bakiye, diğer
      alacaklılara tahsis edilir.
