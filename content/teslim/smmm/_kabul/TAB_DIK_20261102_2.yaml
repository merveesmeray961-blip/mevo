  kok: Mali tablo okuma eğitiminde incelemeye konu rakamlar yazılmıştır. Baz yılı 2024 olan trend analizinde Oba Hazır Beton
    A.Ş.'nin net satışlar kalemi için endeksler 2025 yılında 140, 2026 yılında 154'tür. Kalemin 2026 yılında önceki yıla göre
    yüzde artışı aşağıdakilerden hangisidir?
  secenekler:
    A: '%1'
    B: '%9,09'
    C: '%10'
    D: '%40'
    E: '%110'
  dogru: C
  aciklama:
    dogru_neden: 'İki endeks arasındaki yıllık değişim, önceki yıl endeksine göre hesaplanır: (154 - 140) / 140 × 100 = %10.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır.
      B: Fark cari yıl endeksine bölünmüştür; baz bir önceki yıl endeksidir.
      D: Bu değer 2025'in baz yıla göre artışıdır; 2026'daki yıllık artış değildir.
      E: İki endeksin oranı yüzde olarak verilmiştir; 100 çıkarılmadığından artış değil, oranın kendisidir.
    hesap_adimlari:
    - Fark = 154 - 140 = 14 puan
    - Yıllık artış = 14 / 140 × 100 = %10
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 2'
    madde: II-6
    alinti: Mali tablolar, dönemler itibariyle karşılaştırılabilir nitelikte olmalıdır.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'e25 = 140

      e26 = 154

      sonuc = (e26 - e25) / e25 * 100'
  gecmis:
  - tarih: '2026-11-02'
    kim: denetçi
    ne: 'düzeltme: Yazım: ek uyumu (154''tür).'
