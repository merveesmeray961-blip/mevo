- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Dikey, yatay ve trend analizi
  konu: DIK
  kazanim: karşılaştırmalı (yatay) analiz
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: 'Bağımsız mali müşavirin hazırladığı raporda çalışmanın dayanağı bilgiler aşağıdadır. Aşağıda Fırat Metal Ltd. Şti.''nin
    net satışları ile brüt satış kârı dikey yüzdeleri verilmiştir.


    | Kalem | 2025 | 2026 |

    |---|---:|---:|

    | Net satışlar (₺) | 1.500.000 | 2.100.000 |

    | Brüt satış kârının dikey yüzdesi | %35 | %28 |


    Yatay analiz yapıldığında brüt satış kârındaki yüzde artış aşağıdakilerden hangisidir?'
  secenekler:
    A: '%7'
    B: '%12'
    C: '%33'
    D: '%40'
    E: '%112'
  dogru: B
  aciklama:
    dogru_neden: 'Brüt satış kârı 2025''te 525.000 ₺, 2026''da 588.000 ₺''dir. Yatay analizde değişim önceki dönem bazlıdır:
      (588.000 - 525.000) / 525.000 × 100 = %12. Püf noktaları: Dikey yüzdeyi önce TL''ye çevir; sonra iki yılın kâr tutarlarını
      yatay analizle karşılaştır. Satış artışı ya da marj farkı tek başına kâr artışını vermez.'
    celdiriciler:
      A: Dikey yüzdeler arasındaki puan farkı alınmıştır; brüt kârın TL cinsinden yüzde artışı sorulmaktadır.
      C: Satış artışı ile marj farkı toplanmıştır; kâr tutarları bulunup oranlanmalıdır.
      D: Bu oran net satışlardaki artıştır; brüt satış kârı yüzdesindeki değişim de etkili olduğundan kâr artışı farklıdır.
      E: Cari kâr önceki kâra oranlanmış, 100 çıkarılmamıştır; bu değer artış yüzdesi değil, oranın kendisidir.
    hesap_adimlari:
    - 2025 brüt satış kârı = 1.500.000 × %35 = 525.000 ₺
    - 2026 brüt satış kârı = 2.100.000 × %28 = 588.000 ₺
    - Yüzde değişim = (588.000 - 525.000) / 525.000 × 100 = %12
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Gelir tablosu kalemleri (C)
    alinti: NET SATIŞLAR C _ SATIŞLARIN MALİYETİ (-) 1. SATILAN MAMULLER MALİYETİ (-) 2. SATILAN TİCARİ MALLAR MALİYETİ (-)
      3. SATILAN HİZMET MALİYETİ (-) 4. DİĞER SATIŞLARIN MALİYETİ (-) BRÜT SATIŞ KÂRI VEYA ZARARI
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'n0 = 1500000

      n1 = 2100000

      k0 = n0 * 35 / 100

      k1 = n1 * 28 / 100

      sonuc = (k1 - k0) / k0 * 100'
