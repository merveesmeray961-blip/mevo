    dogru_neden: 'Faaliyet kârı = net satışlar - satışların maliyeti - faaliyet giderleri = 360.000 ₺''dir. Faiz geliri ve
      finansman gideri faaliyet kârından sonraki bölümlerde yer alır. Baz net satışlardır: 360.000 / 1.600.000 × 100 = %22,5.
      Püf noktaları: Önce net satışlara ulaş; tabloda yer alan faiz geliri ve finansman gideri faaliyet kârını etkilemez,
      bunlar gereksiz veridir. Payda brüt satışlar değil net satışlardır.'
