      aktifi artırmaz; kısa vadeli borçlar bu hesapta gereksiz veridir.'
    celdiriciler:
      A: Yalnızca aktarılan tutarın yüzdesi bulunmuştur; dönen varlıkların toplam yüzdesi sorulmaktadır.
      B: Aktarılan tutar dönen varlıklardan düşülmüştür; vadesi kısalan kısım dönen varlıklara eklenir.
      C: Düzeltme yapılmadan mevcut dönen varlıkların yüzdesi alınmıştır; vadesi bir yılın altına inen kısım dönen varlığa
        aktarılmalıdır.
      D: Aktarılan tutar toplam aktife ayrıca eklenmiştir; aktarma toplam aktifi değiştirmez, yalnızca grup değiştirir.
