    Toplam aktifteki mutlak artışın yüzde kaçı stoklar kaleminden kaynaklanmıştır?'
  secenekler:
    A: '%5'
    B: '%50'
    C: '%75'
    D: '%200'
    E: '%500'
  dogru: B
  aciklama:
    dogru_neden: 'Kalem artışı 300.000 ₺, toplam aktif artışı 600.000 ₺''dir. Kalem artışının toplam artıştaki payı 300.000
      / 600.000 × 100 = %50. Püf noktaları: İki mutlak değişimi ayrı ayrı bul ve birbirine oranla. Kalemin kendi yüzde artışı
      ya da toplam aktifin yüzde artışı sorulan oranlar değildir.'
    celdiriciler:
      A: Sonuç bir basamak eksik (10 kat küçük) bulunmuştur; hesapta virgül hatası yapılmıştır.
      C: Kalemin kendi yüzde artışı bulunmuştur; sorulan, kalem artışının toplam aktif artışı içindeki payıdır.
      D: Oran ters kurulmuştur; toplam artış kalem artışına bölünmüştür.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Kalem artışı = 700.000 - 400.000 = 300.000 ₺
    - Toplam aktif artışı = 2.600.000 - 2.000.000 = 600.000 ₺
    - Pay = 300.000 / 600.000 × 100 = %50
