  kok: İşletme, 2026'da bazı alacakları farklı bir finansal tablo kalemine yeniden sınıflandırmış, ancak bu yeniden sınıflandırmanın
    bir önceki dönemin başındaki finansal durum tablosu üzerinde önemli bir etkisi bulunmamaktadır. TMS 1'e göre işletme aşağıdakilerden
    hangisini yapar?
  secenekler:
    A: Asgari iki finansal durum tablosunu sunar; üçüncü tablo sunması gerekmez.
    B: Önceki dönemin başına ait tabloyu isteğe bağlı olarak dipnotsuz sunar.
    C: Önceki dönem tablosunu hiç sunmaz; sınıflandırma değişikliği yapılmıştır.
    D: Üç finansal durum tablosunu sunar; çünkü yeniden sınıflandırma tek başına yeterlidir.
    E: Yalnızca cari dönem finansal durum tablosunu sunar.
  dogru: A
  aciklama:
    dogru_neden: 'TMS 1 par. 40A üçüncü tablonun sunulması için hem yeniden sınıflandırma yapılmasını hem de bunun önceki
      dönemin başındaki bilgiler üzerinde önemli etkisi olmasını arar. İkinci koşul sağlanmadığından asgari iki tablo yeterlidir
      (par. 38A). Püf noktaları: İki koşul birlikte (ve) aranır; yalnızca birinin gerçekleşmesi üçüncü tabloyu gerektirmez.
      Asgari sayı iki''dir.'
    celdiriciler:
      B: Önemli etki yoksa üçüncü tablo yükümlülüğü doğmaz; 'dipnotsuz sunma' bir yükümlülük seçeneği değildir.
      C: Sınıflandırma değişikliği karşılaştırmalı bilgiyi sunma yükümlülüğünü kaldırmaz.
      D: Üçüncü tablo için yeniden sınıflandırmanın önceki dönem başındaki bilgiler üzerinde önemli etkisi de aranır.
      E: Asgari karşılaştırmalı bilgi gereği en az iki finansal durum tablosu sunulur.
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 40A
    alinti: 'İşletme aşağıdaki durumlarda, 38A paragrafındaki asgari karşılaştırmalı finansal tablolara ilave olarak bir önceki
      dönemin başına ait üçüncü bir finansal durum tablosu sunar: (a) İşletmenin; bir muhasebe politikasını geriye dönük uygulaması,
      finansal tablo kalemlerinde geriye dönük bir düzeltme yapması veya finansal tablo kalemlerini yeniden sınıflandırması
      ve (b) Geriye dönük uygulamanın, geriye dönük düzeltmenin veya yeniden sınıflandırmanın, bir önceki dönemin başındaki
      finansal durum tablosundaki bilgiler üzerinde önemli bir etkiye sahip olması.'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 38A
    alinti: İşletme asgari olarak; iki finansal durum tablosu, iki kâr veya zarar ve diğer kapsamlı gelir tablosu, iki ayrı
