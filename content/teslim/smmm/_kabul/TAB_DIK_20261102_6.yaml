- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Dikey, yatay ve trend analizi
  konu: DIK
  kazanim: dikey yüzdeler
  tip: hesaplama
  zorluk: 1
  soru_bicimi: standart
  kok: 'İpek Kimya Ltd. Şti., 2026 yılı bilançosunu dikey analize tabi tutmak istemektedir. Aktif tarafın özeti şöyledir:


    | Kalem | Tutar (₺) |

    |---|---:|

    | Hazır değerler | 375.000 |

    | Ticari alacaklar | 625.000 |

    | Stoklar | 1.375.000 |

    | Dönen varlıklar toplamı | 2.375.000 |

    | Maddi duran varlıklar | 1.750.000 |

    | Maddi olmayan duran varlıklar | 875.000 |

    | Duran varlıklar toplamı | 2.625.000 |

    | **TOPLAM AKTİF** | **5.000.000** |


    Maddi olmayan duran varlıklar kaleminin dikey yüzdesi aşağıdakilerden hangisidir?'
  secenekler:
    A: '%17,5'
    B: '%21,21'
    C: '%33,33'
    D: '%36,84'
    E: '%175'
  dogru: A
  aciklama:
    dogru_neden: 'Bilançoda dikey yüzde, kalemin toplam aktife oranıdır. Maddi olmayan duran varlıklar: 875.000 / 5.000.000
      × 100 = %17,5.'
    celdiriciler:
      B: Kalem, kendisi dışındaki kalemlerin toplamına bölünmüştür; baz toplam aktif olmalıdır.
      C: Kalem toplam aktife değil kendi grubunun toplamına bölünmüştür; bu, grup içi yüzdedir, dikey yüzde değildir.
      D: Kalem karşı grubun toplamına bölünmüştür; yanlış grup baz alınmıştır.
      E: Sonuç bir basamak fazla (10 kat büyük) bulunmuştur; hesapta virgül veya sıfır hatası yapılmıştır.
    hesap_adimlari:
    - Baz = toplam aktif = 5.000.000 ₺
    - Dikey yüzde = 875.000 / 5.000.000 × 100 = %17,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Bilanço tanımı
    alinti: Bilanço, bir işletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağladığı kaynakları gösteren
      mali tablodur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'toplam_aktif = 5000000

      kalem = 875000

      sonuc = kalem / toplam_aktif * 100'
