    |---|---:|---:|

    | Kısa vadeli banka kredileri | 400.000 | 430.000 |


    Polat Boru A.Ş.''nin karşılaştırmalı (yatay) analizinde kısa vadeli banka kredileri kaleminin 2026 yılındaki artışı bir
    önceki yıla göre yüzde kaçtır?'
  secenekler:
    A: '%6,98'
    B: '%7,23'
    C: '%7,5'
    D: '%30'
    E: '%93,02'
  dogru: C
