      yüzde puandır. Püf noktaları: Her yılı kendi toplam aktifine böl; iki oranı doğrudan çıkar. Kalemin tutar artışı yüzdesi
      yatay analizin, dikey yüzdenin kendi yüzde değişimi ise ayrı bir hesabın konusudur.'
    celdiriciler:
      B: Dikey yüzdenin kendi değişim oranı bulunmuştur; soru yüzde puan farkını istemektedir.
      C: Tutar artışı 2025 toplam aktifine oranlanmıştır; her yılın yüzdesi kendi toplam aktifine göre bulunmalıdır.
      D: Bu değer 2026 dikey yüzdesinin kendisidir; artış için 2025 yüzdesi çıkarılmalıdır.
      E: Kalemin kendi tutarındaki yüzde artış (yatay analiz) bulunmuştur; sorulan dikey yüzdelerin puan farkıdır.
    hesap_adimlari:
    - 2025 dikey yüzde = 337.500 / 1.500.000 × 100 = %22,5
    - 2026 dikey yüzde = 562.500 / 2.250.000 × 100 = %25
    - Fark = %25 - %22,5 = 2,5 puan
