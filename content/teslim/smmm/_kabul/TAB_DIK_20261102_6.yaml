    dogru_neden: Yatay analizde yüzde değişim = mutlak değişim / önceki dönem tutarı × 100'dür. 30.000 / 400.000 × 100 = %7,5
      artış.
    celdiriciler:
      A: Mutlak değişim cari dönem tutarına bölünmüştür; yatay analizde baz önceki dönemdir.
      B: Mutlak değişim iki dönemin ortalamasına bölünmüştür; yatay analizde payda yalnızca önceki dönem tutarıdır.
      D: Mutlak değişim binlik birime çevrilmiş ve yüzde gibi okunmuştur; yüzde değişim bir oran olarak hesaplanır.
      E: Oran ters kurulmuştur; önceki dönem cari döneme bölünmüştür.
    hesap_adimlari:
    - Mutlak değişim = 30.000 ₺
    - Yüzde artış = 30.000 / 400.000 × 100 = %7,5
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 2'
