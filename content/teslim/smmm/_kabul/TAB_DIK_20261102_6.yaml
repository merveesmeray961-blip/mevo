    C: '%34,5'
    D: '%51,75'
    E: '%58,7'
  dogru: C
  aciklama:
    dogru_neden: '2025''te net satışlar 100 ise maliyet 45''dır. 2026''da net satışlar 150, maliyet 51,75 olur. Dikey yüzde
      = 51,75 / 150 × 100 = %34,5. Püf noktaları: Baz yıl net satışını 100 al; her iki kalemi kendi artış çarpanıyla büyüt,
      sonra yeni maliyeti yeni net satışa böl. Dikey yüzde tutar artışlarının değil, artış hızları arasındaki farkın sonucudur.'
    celdiriciler:
      A: Yüzdeler toplanıp çıkarılmıştır; artış oranları arasındaki farkın puan olarak eklenmesi doğru değildir.
      B: İki artış oranı birbirine bölünüp yüzdeyle çarpılmıştır; doğru hesap artış çarpanlarının oranını kullanır.
      D: Maliyet yüzdesi yalnızca maliyet artış oranıyla büyütülmüştür; satışlardaki artış paydayı da büyütür.
      E: Çarpanların oranı ters kurulmuştur; pay maliyet çarpanı, payda satış çarpanı olmalıdır.
    hesap_adimlari:
    - Satış çarpanı = 1,5, maliyet çarpanı = 1,15
    - Yeni dikey yüzde = 45 × 1,15 / 1,5 = %34,5
