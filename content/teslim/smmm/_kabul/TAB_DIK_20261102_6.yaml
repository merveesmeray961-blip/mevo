    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'brut = 2750000

      indirim = 250000

      maliyet = 1812500

      net = brut - indirim

      sonuc = (net - maliyet) / net * 100'
