    Dikey analize göre brüt satış kârının dikey yüzdesi kaçtır?'
  secenekler:
    A: '%25'
    B: '%27,5'
    C: '%37,5'
    D: '%65,91'
    E: '%72,5'
  dogru: B
  aciklama:
    dogru_neden: Net satışlar 2.500.000 ₺, brüt satış kârı 687.500 ₺'dir. Baz net satışlar olduğundan dikey yüzde 687.500
      / 2.500.000 × 100 = %27,5 olur.
    celdiriciler:
      A: Brüt satış kârı brüt satışlara bölünmüştür; gelir tablosunda baz net satışlardır.
      C: Brüt satışlardan maliyet düşülmüş, satış indirimleri dikkate alınmamıştır; kâr net satışlar üzerinden bulunmalıdır.
      D: Maliyet brüt satışlara bölünmüştür; hem baz hem de aranan kalem yanlıştır.
      E: Bu değer satışların maliyetinin dikey yüzdesidir; brüt satış kârı yüzdesi onun tümleyenidir.
    hesap_adimlari:
    - Net satışlar = 2.750.000 - 250.000 = 2.500.000 ₺
    - Brüt satış kârı = 2.500.000 - 1.812.500 = 687.500 ₺
    - Dikey yüzde = 687.500 / 2.500.000 × 100 = %27,5
