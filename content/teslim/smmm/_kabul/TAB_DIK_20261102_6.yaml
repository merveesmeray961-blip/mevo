  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) - Ek 4'
    madde: Bilanço tanımı
    alinti: Bilanço, bir işletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağladığı kaynakları gösteren
