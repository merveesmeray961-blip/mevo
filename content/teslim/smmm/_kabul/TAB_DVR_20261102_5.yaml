    dogru_neden: Üç ay 90 gün olduğundan süre 90 gün üzerinden bulunur. Ortalama bakiye = (76.000+92.000)/2 = 84.000; devir
      hızı = 252.000/84.000 = 3 kez; devir süresi = 90/3 = 30 gündür.
    celdiriciler:
      A: Bulunan değer devir hızıdır (kez); süre için gün sayısının hıza bölünmesi gerekir.
      B: Sezon akışı yıllıklaştırılmış (4 ile çarpılmış); bu durumda süre için 360 gün alınmalıydı.
      D: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      E: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
    hesap_adimlari:
    - Ortalama bakiye = (76.000 + 92.000) / 2 = 84.000
    - Devir hızı = 252.000 / 84.000 = 3
    - Devir süresi = 90 / 3 = 30 gün
