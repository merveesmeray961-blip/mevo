  kok: Yıl içinde 480.000 ₺ ilk madde ve malzeme kullanan bir işletme, ilk madde devir süresini 45 güne indirmeyi hedeflemektedir.
    Yıl başı stoku 59.000 ₺ olduğuna göre yıl sonu ilk madde stoku kaç ₺ olmalıdır? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 2.000 ₺
    B: 59.000 ₺
    C: 60.000 ₺
    D: 61.000 ₺
    E: 179.000 ₺
  dogru: D
  aciklama:
    dogru_neden: Ortalama stok = 480.000×45/360 = 60.000 ₺; yıl sonu stoku = 2×60.000−59.000 = 61.000 ₺'dir.
    celdiriciler:
      A: Yıl başı ile yıl sonu arasındaki fark bulunmuş.
      B: Yıl başı stoku yıl sonu hedefi sanılmış.
      C: Bulunan tutar ortalama stoktur; yıl sonu için 2 × ortalama − yıl başı alınmalıdır.
      E: Yıl başı stok çıkarılmak yerine eklenmiş.
    hesap_adimlari:
    - Ortalama stok = 480.000 × 45 / 360 = 60.000
    - Yıl sonu stoku = 2 × 60.000 − 59.000 = 61.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 150 - İlk Madde ve Malzeme
    alinti: Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi,
      ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır.
