  kok: Yaz sezonunu (3 ay) kapsayan dönemde bir tatil sitesi marketinin sattığı malların maliyeti 252.000 ₺ olarak gerçekleşmiştir.
    Sezon açılışında 76.000 ₺, kapanışında 92.000 ₺ değerinde malı bulunan marketin stoklarını ortalama kaç günde devrettiği
    (ticari mal devir süresi) sorulmaktadır. Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
