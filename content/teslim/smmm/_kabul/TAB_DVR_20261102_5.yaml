    B: Stok devir süresi − alacak tahsil süresi + borç ödeme süresi
    C: Alacak tahsil süresi − borç ödeme süresi
    D: Stok devir süresi + borç ödeme süresi − alacak tahsil süresi
    E: Stok devir süresi + alacak tahsil süresi − borç ödeme süresi
  dogru: E
  aciklama:
    dogru_neden: Nakit dönüşüm süresi, faaliyet döneminden (stok devir süresi + alacak tahsil süresi) borç ödeme süresinin
      çıkarılmasıyla bulunur; işletmenin kendi kaynaklarıyla finanse ettiği süreyi gösterir.
    celdiriciler:
      A: Borç ödeme süresi toplanmaz, çıkarılır; ödeme süresi işletmenin tedarikçi kredisiyle finanse edildiği süreyi gösterir.
      B: Alacak tahsil süresi çıkarılmaz; faaliyet döngüsüne eklenir.
      C: Stok devir süresi de nakit döngüsünün parçasıdır; ifade eksiktir.
      D: Alacak tahsil süresi eklenir, borç ödeme süresi çıkarılır; roller ters kurulmuş.
