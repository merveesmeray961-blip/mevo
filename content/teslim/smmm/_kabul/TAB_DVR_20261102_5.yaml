  kok: Satışların maliyeti yıllık 540.000 ₺ olan bir işletmenin borç ödeme süresi 40 gündür. Bu işletmenin ortalama ticari
    borcu kaç ₺'dir? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 6.000 ₺
    B: 13.500 ₺
    C: 60.000 ₺
    D: 120.000 ₺
    E: 21.600.000 ₺
  dogru: C
  aciklama:
    dogru_neden: Borç ödeme süresi = 360 × ortalama borç / satışların maliyeti olduğundan ortalama borç = 540.000×40/360 =
      60.000 ₺'dir.
    celdiriciler:
      A: Gün sayısı yanlışlıkla 3.600 alınmış.
      B: Satışların maliyeti doğrudan süreye bölünmüş; gün sayısı kullanılmamış.
      D: Altı aylık gün sayısı (180) esas alınmış.
      E: Satışların maliyeti süreyle çarpılmış; 360'a bölünmemiş.
    hesap_adimlari:
    - Ortalama borç = 540.000 × 40 / 360 = 60.000
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 5 - Tekdüzen Hesap Planı'
    madde: Hesap 320 - Satıcılar
    alinti: İşletmenin faaliyet konusu ile ilgili her türlü mal ve hizmet alımlarından kaynaklanan senetsiz borçların izlendiği
