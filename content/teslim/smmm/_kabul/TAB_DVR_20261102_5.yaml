  kok: Bir oyuncak fabrikasında mamul stoku yıl başında 70.000 ₺, yıl sonunda 110.000 ₺'dir. Yıl içinde tamamlanan üretimin
    maliyeti 580.000 ₺ olduğuna göre mamul devir süresi kaç gündür? Ortalama değer; yıl 360, ay 30 gün alınacaktır.
  secenekler:
    A: 6 gün
    B: 46,67 gün
