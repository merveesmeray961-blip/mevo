  kok: Akın Otomotiv Ltd. Şti.'nin yıllık net satışları 900.000 ₺, satışların maliyeti 600.000 ₺'dir. Ticari alacaklar yılbaşında
    100.000 ₺, yıl sonunda 140.000 ₺ olduğuna göre alacak devir hızı kaç kezdir?
  secenekler:
    A: 3,75 kez
    B: 5 kez
    C: 6,43 kez
    D: 7,5 kez
    E: 9 kez
  dogru: D
  aciklama:
    dogru_neden: Alacak devir hızının payı net satışlardır. Ortalama bakiye = (100.000+140.000)/2 = 120.000; devir hızı =
      900.000/120.000 = 7,5 kezdir.
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Pay olarak net satışlar yerine satışların maliyeti alınmış.
      C: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      E: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (100.000 + 140.000) / 2 = 120.000
    - Devir hızı = 900.000 / 120.000 = 7,5
  kaynaklar:
