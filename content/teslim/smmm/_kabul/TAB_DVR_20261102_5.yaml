  kok: Bir cam fabrikasında dönem içinde direkt ilk madde 180.000 ₺, direkt işçilik 70.000 ₺, genel üretim gideri 50.000 ₺
    harcanmıştır. Yarı mamul stoku dönem başında 40.000 ₺, dönem sonunda 60.000 ₺'dir. Yarı mamul devir hızı kaç kezdir?
  secenekler:
    A: 2,8 kez
    B: 4,67 kez
    C: 5,6 kez
    D: 6 kez
    E: 7 kez
  dogru: C
  aciklama:
    dogru_neden: Tamamlanan üretim maliyeti = 40.000+300.000−60.000 = 280.000 ₺'dir. Ortalama bakiye = (40.000+60.000)/2 =
      50.000; devir hızı = 280.000/50.000 = 5,6 kezdir.
    celdiriciler:
      A: Dönem başı ve sonu bakiye toplamı ikiye bölünmeden payda yapılmış.
      B: Ortalama bakiye yerine yalnızca dönem sonu bakiyesi kullanılmış.
      D: Pay olarak tamamlanan üretim maliyeti yerine dönemin üretim giderleri alınmış.
      E: Ortalama bakiye yerine yalnızca dönem başı bakiyesi kullanılmış.
    hesap_adimlari:
    - Ortalama bakiye = (40.000 + 60.000) / 2 = 50.000
    - Devir hızı = 280.000 / 50.000 = 5,6
