      kattır. Püf noktaları: Önce vergi öncesi marjı vergiden arındır, sonra devir hızıyla çarp; özkaynak çarpanı özkaynak
      kârlılığının varlık kârlılığına oranıdır.'
    celdiriciler:
      A: Vergi oranı çıkarılmak yerine eklenmiş.
      B: Vergi etkisi hesaba katılmadan varlık kârlılığı bulunmuş.
      D: Çarpan, bölme yerine çarpma ile bulunmuş.
      E: Aktif devir hızı atlanmış; bu net kâr marjına bölünmüş değerdir.
    hesap_adimlari:
    - Net kâr marjı = 10 × 0,8 = 8
    - Varlık kârlılığı = 8 × 1,5 = 12
    - Özkaynak çarpanı = 30 / 12 = 2,5
