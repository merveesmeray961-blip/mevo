  aciklama:
    dogru_neden: 'Faiz ve vergi öncesi kâr = 240.000+70.000 = 310.000 ₺ (66 grubu finansman giderleri geri eklenir). Ortalama
      aktif 2.000.000 ₺; rantabilite %15,5''dir. Püf noktaları: Finansman gideri kârdan düşülmüştür; geri ekle. Ortalama aktifi
      dönem başı ve sonu toplamının yarısı olarak al.'
