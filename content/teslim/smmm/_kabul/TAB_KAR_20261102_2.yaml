  kok: Bir işletmenin vergi öncesi dönem kârı 240.000 ₺, finansman giderleri 70.000 ₺'dir. Toplam aktif dönem başında 1.700.000
    ₺, dönem sonunda 2.300.000 ₺'dir. Faiz ve vergi öncesi kâra (dönem kârı + finansman giderleri) göre ortalama aktif üzerinden
    ekonomik rantabilite yüzde kaçtır?
