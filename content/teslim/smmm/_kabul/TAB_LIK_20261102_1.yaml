  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: kaldıraç
  tip: hesaplama
  zorluk: 3
  soru_bicimi: standart
  kok: Toplam aktifi 2.000.000 ₺, toplam yabancı kaynakları 1.200.000 ₺ olan bir işletme, kasasındaki nakitten 400.000 ₺'yi
    yabancı kaynaklarına ödemiştir (işlemden başka değişiklik yoktur). İşlem sonrasında kaldıraç oranı (toplam yabancı kaynaklar
    / toplam aktif) kaç olur?
  secenekler:
    A: 0,5
    B: 0,6
    C: 0,75
    D: '1'
    E: 1,5
  dogru: A
  aciklama:
    dogru_neden: 'Nakitle borç ödemesi hem aktifi hem yabancı kaynakları 400.000 ₺ azaltır. Yeni kaldıraç oranı 800.000 /
      1.600.000 = 0,5 olur; özkaynak 800.000 ₺ olarak değişmez. Püf noktaları: Nakitle borç ödemesi hem payı hem paydayı azaltır;
      yalnız birini düşmek en sık yapılan hatadır. Özkaynak değişmediğinden sonuçta borç/özkaynak oranının 1 çıkması kaldıraç
      oranının 1 olduğu anlamına gelmez.'
    hesap_adimlari:
    - Yabancı kaynaklar = 1.200.000 − 400.000 = 800.000
    - Toplam aktif = 2.000.000 − 400.000 = 1.600.000
    - Kaldıraç oranı = 800.000 / 1.600.000 = 0,5
    celdiriciler:
      B: Bu, işlem öncesindeki kaldıraç oranıdır (1.200.000 / 2.000.000).
      C: Aktif azaltılmış ama yabancı kaynak azaltılmamıştır (1.200.000 / 1.600.000).
      D: Borç/özkaynak oranı bulunmuştur (800.000 / 800.000); kaldıraç oranının paydası toplam aktiftir.
      E: Bu, işlem öncesindeki borç/özkaynak oranıdır (1.200.000 / 800.000).
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra
      ödenecek olan borçlardan oluşur.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Özkaynaklar ise işletme sahip veya ortakları tarafından işletme kişiliğine tahsis edilmiş kaynakları oluşturur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (1200000 - 400000) / (2000000 - 400000)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
