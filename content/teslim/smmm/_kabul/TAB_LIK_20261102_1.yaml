  soru_bicimi: standart
  kok: Duran varlıklar / devamlı sermaye oranı 1,25 olan bir işletme hakkında aşağıdakilerden hangisi kesinlikle doğrudur?
    (Devamlı sermaye = uzun vadeli yabancı kaynaklar + özkaynaklar)
  secenekler:
    A: Net işletme sermayesi pozitiftir; dönen varlıklar kısa vadeli yabancı kaynakları aşmaktadır.
    B: Cari oran 1,25'tir.
    C: Kaldıraç oranı yüzde 125'tir.
    D: Duran varlıklar tamamen özkaynaklarla finanse edilmiştir.
    E: Net işletme sermayesi negatiftir ve cari oran 1'in altındadır.
  dogru: E
  aciklama:
    dogru_neden: 'Oran 1,25 ise duran varlıklar devamlı sermayeden büyüktür. Net işletme sermayesi devamlı sermaye − duran
      varlıklar olduğundan negatiftir; yani dönen varlıklar kısa vadeli yabancı kaynakların altında kalır, cari oran 1''in
      altındadır ve duran varlıkların bir kısmı kısa vadeli borçla finanse edilmiştir. Püf noktaları: Bilanço eşitliğinden
      net işletme sermayesi = devamlı sermaye − duran varlıklar yazılabilir. Oran 1''i aştığında pay payda''dan büyük olduğundan
      fark negatif çıkar; cari oranın 1''in altında kalması da buna bağlıdır.'
    celdiriciler:
      A: Duran varlıklar devamlı sermayeyi aştığından net işletme sermayesi (devamlı sermaye − duran varlıklar) negatiftir.
      B: Cari oran dönen varlıkların kısa vadeli yabancı kaynaklara oranıdır; bu bilgiyle 1,25 bulunamaz, ayrıca oran 1'in
        altındadır.
      C: Kaldıraç oranı toplam yabancı kaynakların toplam aktife oranıdır ve 1'i aşamaz; verilen oranla bulunamaz.
      D: Duran varlıklar devamlı sermayeden bile fazladır; özkaynak tutarı bu bilgiyle belirlenemez ve duran varlıkların tamamı
        uzun vadeli kaynakla karşılanmamaktadır.
