    bir işletmenin net işletme sermayesi kaç ₺'dir?
  secenekler:
    A: 60.000 ₺
    B: 420.000 ₺
    C: 900.000 ₺
    D: 1.260.000 ₺
    E: 2.100.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Net işletme sermayesi, dönen varlıklar ile kısa vadeli yabancı kaynaklar farkıdır: 1.260.000 − 840.000 =
      420.000 ₺. Uzun vadeli yabancı kaynaklar bu hesaba girmez.'
    hesap_adimlari:
    - Net işletme sermayesi = Dönen varlıklar − Kısa vadeli yabancı kaynaklar
    - 1.260.000 − 840.000 = 420.000 ₺
    celdiriciler:
      A: Hem kısa hem uzun vadeli yabancı kaynaklar dönen varlıklardan düşülmüştür (1.260.000 − 840.000 − 360.000).
      C: Yalnız uzun vadeli yabancı kaynaklar düşülmüştür (1.260.000 − 360.000); net işletme sermayesinde düşülecek olan kısa
        vadeli yabancı kaynaklardır.
      D: Bu tutar brüt işletme sermayesidir; net işletme sermayesi için kısa vadeli yabancı kaynaklar düşülmelidir.
      E: Dönen varlıklar ile kısa vadeli yabancı kaynaklar toplanmıştır; fark alınması gerekir.
