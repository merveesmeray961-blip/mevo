  secenekler:
    A: 0,6
    B: 0,67
    C: '1'
    D: 1,5
    E: 2,5
  dogru: D
  aciklama:
    dogru_neden: Özkaynaklar bilanço eşitliğinden 3.000.000 − 1.800.000 = 1.200.000 ₺ bulunur. Borç/özkaynak oranı 1.800.000
      / 1.200.000 = 1,5'tir.
    hesap_adimlari:
    - Toplam yabancı kaynaklar = 600.000 + 1.200.000 = 1.800.000
    - Özkaynaklar = 3.000.000 − 1.800.000 = 1.200.000
    - Borç/özkaynak = 1.800.000 / 1.200.000 = 1,5
    celdiriciler:
      A: 0,6 kaldıraç oranıdır (1.800.000 / 3.000.000); soruda özkaynaklar paydadır.
      B: Pay ile payda ters alınmıştır; 1.200.000 / 1.800.000 özkaynak/yabancı kaynak oranını verir.
      C: Yalnız uzun vadeli yabancı kaynaklar özkaynaklarla oranlanmıştır (1.200.000 / 1.200.000); kısa vadeli yabancı kaynaklar
        da paya girer.
      E: Toplam aktif özkaynaklara bölünmüştür (3.000.000 / 1.200.000); bu oran özkaynak çarpanıdır.
