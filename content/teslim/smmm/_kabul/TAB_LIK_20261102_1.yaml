  kok: Bir işletmenin cari oranı 2,2, likidite (asit-test) oranı 1,9'dur; kısa vadeli yabancı kaynakları 500.000 ₺'dir. Likidite
    oranı (dönen varlıklar − stoklar) / kısa vadeli yabancı kaynaklar olarak hesaplandığına göre işletmenin stok tutarı kaç
    ₺'dir?
  secenekler:
    A: 75.000 ₺
    B: 150.000 ₺
    C: 950.000 ₺
    D: 1.100.000 ₺
    E: 1.250.000 ₺
  dogru: B
  aciklama:
    dogru_neden: 'Dönen varlıklar 2,2 × 500.000 = 1.100.000 ₺, stok dışı dönen varlıklar 1,9 × 500.000 = 950.000 ₺''dir. Fark
      olan stok 150.000 ₺''dir; aynı sonuç (2,2 − 1,9) × 500.000 ile de bulunur. Püf noktaları: İki oranın farkı doğrudan
      stok / KVYK oranıdır; bu oranı payda olan KVYK ile çarp. Likidite oranı cari orandan büyük olamaz, çünkü stok çıkarıldığında
      pay küçülür.'
    hesap_adimlari:
    - Dönen varlıklar = 2,2 × 500.000 = 1.100.000
    - Stok dışı dönen varlıklar = 1,9 × 500.000 = 950.000
    - Stok = 1.100.000 − 950.000 = 150.000 ₺
    celdiriciler:
      A: Oran farkı (0,3) kısa vadeli yabancı kaynakların yarısıyla çarpılmıştır; stok tutarı oran farkı × tam KVYK ile bulunur.
      C: Bu tutar stok dışı dönen varlıklardır (1,9 × 500.000).
      D: Bu tutar dönen varlıkların toplamıdır (2,2 × 500.000).
      E: Dönen varlıklar ile stoklar toplanmıştır; stok, aradaki fark olarak bulunur.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı
      tahmin edilen varlıklar toplanır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilanço kalemleri - Stoklar
    alinti: E STOKLAR 1. İLK MADDE VE MALZEME 2. YARI MAMULLER - ÜRETİM 3. MAMULLER 4. TİCARİ MALLAR 5. DİĞER STOKLAR 6. STOK
      DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI (-) 7. VERİLEN SİPARİŞ AVANSLARI
