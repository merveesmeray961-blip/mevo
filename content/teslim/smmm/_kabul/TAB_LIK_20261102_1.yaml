  kok: 'Bir işletmenin dönen varlıkları şöyledir:


    | Dönen varlık kalemi | Tutar (₺) |

    |---|---|

    | Hazır değerler | 90.000 |

    | Menkul kıymetler | 60.000 |

    | Ticari alacaklar | 420.000 |

    | Stoklar | 300.000 |

    | Gelecek aylara ait giderler | 30.000 |

    | Diğer dönen varlıklar | 100.000 |

    | **Dönen varlıklar toplamı** | **1.000.000** |


    Kısa vadeli yabancı kaynaklar 500.000 ₺ olduğuna göre nakit oranı kaçtır?'
  secenekler:
    A: 0,3
    B: 1,14
    C: 1,34
    D: 1,4
    E: '2'
  dogru: A
  aciklama:
    dogru_neden: 'Nakit oranının payı hazır değerler ile menkul kıymetlerdir: (90.000 + 60.000) / 500.000 = 0,3. Ticari alacaklar,
      stoklar ve diğer kalemler paya girmez.'
    hesap_adimlari:
    - Nakit oranı = (Hazır değerler + Menkul kıymetler) / KVYK
    - (90.000 + 60.000) / 500.000 = 0,3
    celdiriciler:
      B: Ticari alacaklar da paya eklenmiştir ((90.000 + 60.000 + 420.000) / 500.000); alacaklar nakit oranının payına girmez.
      C: Stoklar ve gelecek aylara ait giderler düşülerek ihtiyatlı likidite oranı bulunmuştur.
      D: Stoklar düşülerek likidite (asit-test) oranı bulunmuştur; ticari alacaklar nakit oranının payına girmez.
      E: Dönen varlıkların tamamı paya alınarak cari oran bulunmuştur.
  kaynaklar:
