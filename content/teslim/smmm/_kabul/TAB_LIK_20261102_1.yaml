  secenekler:
    A: 0,5
    B: 0,67
    C: '1'
    D: 1,5
    E: 2,5
  dogru: D
  aciklama:
    dogru_neden: 'Cari oran, dönen varlıkların kısa vadeli yabancı kaynaklara bölünmesiyle bulunur: 900.000 / 600.000 = 1,5.
      Stok tutarı bu oranın hesabında düşülmez.'
    hesap_adimlari:
    - Cari oran = Dönen varlıklar / Kısa vadeli yabancı kaynaklar
    - 900.000 / 600.000 = 1,5
    celdiriciler:
      A: 0,5, net işletme sermayesinin kısa vadeli yabancı kaynaklara oranıdır ((900.000 − 600.000) / 600.000); cari oranın
        payı dönen varlıkların tamamıdır.
      B: Pay ile payda ters alınmıştır (600.000 / 900.000).
      C: Stoklar düşülerek likidite (asit-test) oranı bulunmuştur ((900.000 − 300.000) / 600.000); cari oran stokları da içerir.
      E: Paya kısa vadeli yabancı kaynaklar da eklenmiştir ((900.000 + 600.000) / 600.000).
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı
      tahmin edilen varlıklar toplanır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
