      bir yılın altında kalanlar kısa vadeli yabancı kaynaklara aktarılır. 2027 yılında ödenecek 250.000 ₺ bu nedenle aktarılır;
      kısa vadeli yabancı kaynaklar artarken dönen varlıklar aynı kaldığından net işletme sermayesi 250.000 ₺ azalır. Püf
      noktaları: Bilanço günü 31.12.2026''dır; 2027 içinde ödenecek tutar bir yıl içinde ödenecek demektir. Yalnız o taksiti
      aktar, kredinin tamamını değil; aktarma dönen varlıkları değiştirmez, kısa vadeli borcu artırır.'
