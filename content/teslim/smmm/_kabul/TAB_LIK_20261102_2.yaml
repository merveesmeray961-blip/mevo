  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra
      ödenecek olan borçlardan oluşur.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
