  kok: Bir işletmenin devamlı sermayesi 1.500.000 ₺, kısa vadeli yabancı kaynakları 500.000 ₺'dir. Duran varlıklar / devamlı
    sermaye oranı 0,8 olduğuna göre işletmenin cari oranı kaçtır?
  secenekler:
    A: 0,6
    B: 0,63
    C: 1,25
    D: 1,6
    E: '4'
  dogru: D
  aciklama:
    dogru_neden: 'Bilanço eşitliğine göre toplam aktif, devamlı sermaye ile kısa vadeli yabancı kaynakların toplamıdır: 2.000.000
      ₺. Duran varlıklar 0,8 × 1.500.000 = 1.200.000 ₺ olduğundan dönen varlıklar 800.000 ₺, cari oran 800.000 / 500.000 =
      1,6''dır. Püf noktaları: Devamlı sermaye + kısa vadeli yabancı kaynaklar = toplam pasif = toplam aktif. Dönen varlıkları,
      toplam aktiften duran varlıkları düşerek bul.'
    hesap_adimlari:
    - Duran varlıklar = 0,8 × 1.500.000 = 1.200.000
    - Toplam aktif = 1.500.000 + 500.000 = 2.000.000
    - Dönen varlıklar = 2.000.000 − 1.200.000 = 800.000
    - Cari oran = 800.000 / 500.000 = 1,6
    celdiriciler:
      A: Net işletme sermayesi kısa vadeli yabancı kaynaklara bölünmüştür (300.000 / 500.000); pay dönen varlıkların tamamı
        olmalıdır.
      B: Pay ile payda ters alınmıştır (500.000 / 800.000).
      C: Devamlı sermaye duran varlıklara bölünmüştür (1.500.000 / 1.200.000); cari oran dönen varlıklara dayanır.
      E: Toplam aktif kısa vadeli yabancı kaynaklara bölünmüştür (2.000.000 / 500.000).
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
