  dogru: B
  aciklama:
    dogru_neden: 'Vadeli mal alımı dönen varlıkları ve kısa vadeli yabancı kaynakları x kadar artırır: (1.100.000 + x) / (500.000
      + x) = 2. Denklem çözülünce x = 100.000 ₺ bulunur; bu tutarın üzerinde oran 2''nin altına düşer.'
