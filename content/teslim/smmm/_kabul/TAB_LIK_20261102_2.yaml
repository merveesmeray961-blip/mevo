    | Dönen varlık kalemi | Tutar (₺) |

    |---|---|

    | Hazır değerler | 240.000 |

    | Menkul kıymetler | 60.000 |

    | Ticari alacaklar | 300.000 |

    | Stoklar | 200.000 |

    | **Dönen varlıklar toplamı** | **800.000** |


    İşletmenin kısa vadeli yabancı kaynakları 600.000 ₺ olduğuna göre nakit oranı kaçtır?'
  secenekler:
    A: 0,4
    B: 0,5
    C: 0,75
    D: '1'
    E: 1,33
  dogru: B
  aciklama:
    dogru_neden: 'Nakit oranının payında yalnız hazır değerler ile menkul kıymetler yer alır: (240.000 + 60.000) / 600.000
      = 0,5.'
    hesap_adimlari:
    - Nakit oranı = (Hazır değerler + Menkul kıymetler) / KVYK
    - (240.000 + 60.000) / 600.000 = 0,5
    celdiriciler:
      A: Yalnız hazır değerler paya alınmıştır (240.000 / 600.000); menkul kıymetler de nakit oranının payındadır.
      C: Pay ile payda ters alınmıştır; 600.000 / 800.000 cari oranın tersidir.
      D: Stoklar düşülerek likidite (asit-test) oranı bulunmuştur ((800.000 − 200.000) / 600.000); ticari alacaklar nakit
        oranının payına girmez.
      E: Dönen varlıkların tamamı paya alınarak cari oran bulunmuştur (800.000 / 600.000).
  kaynaklar:
