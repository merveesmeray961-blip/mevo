      B: Yalnız vadesi bir yılın altına düşen kısım aktarılır; kalan 750.000 ₺ uzun vadeli yabancı kaynaklarda kalır.
      C: Vadesi bir yılın altında kalan hesaplar kısa vadeli yabancı kaynaklar grubuna aktarılır; dipnotta açıklamak yeterli
