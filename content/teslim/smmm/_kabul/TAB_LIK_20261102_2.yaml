  kok: Dönen varlıkları 560.000 ₺, kısa vadeli yabancı kaynakları 390.000 ₺, uzun vadeli yabancı kaynakları 150.000 ₺ olan
    işletmenin net işletme sermayesi kaç ₺'dir?
  secenekler:
    A: -170.000 ₺
    B: 20.000 ₺
    C: 170.000 ₺
    D: 410.000 ₺
    E: 560.000 ₺
  dogru: C
  aciklama:
    dogru_neden: 'Net işletme sermayesi dönen varlıklar ile kısa vadeli yabancı kaynaklar arasındaki farktır: 560.000 − 390.000
      = 170.000 ₺. Uzun vadeli yabancı kaynaklar bu hesaba girmez.'
    hesap_adimlari:
    - Net işletme sermayesi = Dönen varlıklar − KVYK
    - 560.000 − 390.000 = 170.000 ₺
    celdiriciler:
      A: Fark ters yönde alınmıştır (390.000 − 560.000); net işletme sermayesi dönen varlıklardan kısa vadeli yabancı kaynakların
        düşülmesiyle bulunur.
      B: Uzun vadeli yabancı kaynaklar da düşülmüştür (560.000 − 390.000 − 150.000); net işletme sermayesinde yalnız kısa
        vadeli yabancı kaynaklar düşülür.
      D: Yalnız uzun vadeli yabancı kaynaklar düşülmüştür (560.000 − 150.000); düşülecek olan kısa vadeli yabancı kaynaklardır.
      E: Bu tutar brüt işletme sermayesidir; kısa vadeli yabancı kaynaklar düşülmemiştir.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Fon akım tabloları - Net işletme (çalışma) sermayesindeki değişim tablosu
    alinti: Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı kaynaklar far-kını belirten net işletme (çalışma)
      sermayesini kapsar.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra
      ödenecek olan borçlardan oluşur.
