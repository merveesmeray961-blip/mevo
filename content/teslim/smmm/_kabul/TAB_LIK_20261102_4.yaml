  kok: Bir işletme, vadesi gelmemiş 80.000 ₺'lik alacak senedini bankaya ciro ederek (faiz giderini dikkate almayınız) bedelini
    nakit tahsil etmiştir; başka işlem yoktur. Bu işlemin cari oran ve nakit oranı üzerindeki etkisi aşağıdakilerden hangisidir?
  secenekler:
    A: Cari oran artar; nakit oranı artar
    B: Cari oran değişmez; nakit oranı değişmez
    C: Cari oran azalır; nakit oranı artar
    D: Cari oran değişmez; nakit oranı artar
    E: Cari oran değişmez; nakit oranı azalır
  dogru: D
  aciklama:
    dogru_neden: 'Alacak senedinin nakde çevrilmesi dönen varlıklar içinde bir dönüşümdür: toplam ve kısa vadeli borçlar değişmez,
      cari oran aynı kalır. Nakit oranının payındaki hazır değerler arttığından nakit oranı yükselir.'
    celdiriciler:
      A: Alacak senedi azalırken nakit aynı tutarda arttığından dönen varlıklar toplamı değişmez ve cari oran aynı kalır.
      B: Alacak senetleri nakit oranının payında yer almaz; nakde dönüşmesi payı artırır.
      C: Dönen varlıklar toplamı ve kısa vadeli yabancı kaynaklar aynı kaldığından cari oran azalmaz.
      E: Hazır değerler arttığından nakit oranı azalmaz, artar.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilanço kalemleri - Hazır değerler
    alinti: A HAZIR DEĞERLER 1. KASA 2. ALINAN ÇEKLER 3. BANKALAR 4. VERİLEN ÇEKLER VE ÖDEME EMİRLERİ (-) 5. DİĞER HAZIR DEĞERLER
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
