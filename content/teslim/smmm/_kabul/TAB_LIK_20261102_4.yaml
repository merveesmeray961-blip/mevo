  soru_bicimi: standart
  kok: Toplam aktifi 2.000.000 ₺, özkaynakları 500.000 ₺ olan bir işletmenin borç/özkaynak oranı (toplam yabancı kaynaklar
    / özkaynaklar) yüzde kaçtır?
  secenekler:
    A: '%25'
    B: '%33,3'
    C: '%75'
    D: '%300'
    E: '%400'
  dogru: D
  aciklama:
    dogru_neden: Yabancı kaynaklar 2.000.000 − 500.000 = 1.500.000 ₺'dir. Borç/özkaynak oranı 1.500.000 / 500.000 = 3, yani
      yüzde 300'dür.
    hesap_adimlari:
    - Toplam yabancı kaynaklar = 2.000.000 − 500.000 = 1.500.000
    - Borç/özkaynak = 1.500.000 / 500.000 = 3,00 → yüzde 300
    celdiriciler:
      A: Bu oran özkaynak oranıdır (500.000 / 2.000.000).
      B: Özkaynaklar yabancı kaynaklara bölünmüştür (500.000 / 1.500.000); pay yabancı kaynaklardır.
      C: Bu oran kaldıraç oranıdır (1.500.000 / 2.000.000); özkaynaklar payda olmalıdır.
      E: Toplam aktif özkaynaklara bölünmüştür (2.000.000 / 500.000); bu özkaynak çarpanıdır.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Özkaynaklar ise işletme sahip veya ortakları tarafından işletme kişiliğine tahsis edilmiş kaynakları oluşturur.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilanço tanımı
    alinti: Bilanço, bir işletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağladığı kaynakları gösteren
      mali tablodur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (2000000 - 500000) / 500000 * 100
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: net ve brüt işletme sermayesi
  tip: uygulama
  zorluk: 3
  soru_bicimi: standart
  kok: 31.12.2026 tarihli finansal durum tablosunda yer alan, 18 ay boyunca bir kredinin teminatı olarak bloke edilmiş ve
    bu süre içinde çekilmesi ya da yükümlülüğün ödenmesinde kullanılması sınırlandırılmış 600.000 ₺'lik banka mevduatı TMS
    1'e göre nasıl sınıflandırılır?
  secenekler:
    A: Duran varlık olarak; çünkü en az on iki ay boyunca kullanımı sınırlandırılmıştır
    B: Dönen varlık olarak; çünkü mevduat nakit niteliğindedir
    C: Dönen varlık olarak; çünkü blokenin on iki ayı aşan kısmı yalnızca dipnotta açıklanır
    D: Kısa vadeli yükümlülük olarak; çünkü bloke tutarı krediyle ilişkilidir
    E: Özkaynak olarak; çünkü teminat niteliğindedir
  dogru: A
  aciklama:
    dogru_neden: 'TMS 1 paragraf 66(d) uyarınca nakit veya nakit benzerinin dönen varlık sayılması için, raporlama döneminden
      sonraki en az on iki ay boyunca bir yükümlülüğü yerine getirmek amacıyla kullanımının sınırlandırılmamış olması gerekir.
      Bloke süresi 18 ay olduğundan mevduat bu koşulu karşılamaz; diğer tüm varlıklar duran varlık olarak sınıflandırılır.
      Püf noktaları: Nakit olmak tek başına dönen varlık olmak için yetmez; kullanım serbestliği de aranır. Bloke süresini
      (18 ay) on iki aylık eşikle karşılaştır.'
    celdiriciler:
      B: Nakit, ancak raporlama döneminden sonraki en az on iki ay boyunca kullanımı sınırlandırılmamışsa dönen varlık sayılır.
      C: Standart, kısıtlı nakdi dönen varlık saymaz; varlık diğer kıstasları da karşılamıyorsa duran varlıktır.
      D: Mevduat bir varlıktır; yükümlülük olarak sınıflandırılmaz.
      E: Bloke mevduat bir varlık kalemidir; özkaynak sayılmaz.
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 66(d)
    alinti: (d) Raporlama döneminden sonraki en az on iki ay içinde bir yükümlülüğü yerine getirmek amacıyla kullanılmasının
      ya da takas edilmesinin sınırlandırılmamış olması koşuluyla, varlığın nakit veya nakit benzeri olması
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 66
    alinti: İşletme diğer tüm varlıklarını duran varlık olarak sınıflandırır.
