  soru_bicimi: standart
  kok: Net işletme sermayesi pozitif olan bir işletmenin cari oranı hakkında aşağıdakilerden hangisi söylenebilir?
  secenekler:
    A: 1'e eşittir
    B: 1'den büyüktür
    C: 1'den küçüktür
    D: Sıfırdır
    E: Bu bilgiyle belirlenemez
  dogru: B
  aciklama:
    dogru_neden: Net işletme sermayesi dönen varlıklar ile kısa vadeli yabancı kaynaklar arasındaki farktır. Fark pozitifse
      dönen varlıklar kısa vadeli yabancı kaynakları aştığından cari oran 1'den büyüktür.
    celdiriciler:
      A: Cari oranın 1'e eşit olması net işletme sermayesinin sıfır olması demektir.
      C: Cari oranın 1'den küçük olması net işletme sermayesinin negatif olması demektir.
      D: Dönen varlıklar pozitif olduğundan cari oran sıfır olamaz.
      E: Net işletme sermayesinin pozitif olması dönen varlıkların kısa vadeli yabancı kaynakları aştığını gösterir; cari
        oran 1'in üzerindedir.
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Fon akım tabloları - Net işletme (çalışma) sermayesindeki değişim tablosu
    alinti: Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı kaynaklar far-kını belirten net işletme (çalışma)
      sermayesini kapsar.
