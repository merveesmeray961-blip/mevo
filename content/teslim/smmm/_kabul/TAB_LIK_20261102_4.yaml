- id: TASLAK
  sinav: smmm
  bolum:
  - SGS
  - YET
  ders: TAB
  unite: Likidite ve finansal yapı oranları
  konu: LIK
  kazanim: cari oran
  tip: hesaplama
  zorluk: 2
  soru_bicimi: standart
  kok: Net işletme sermayesi 200.000 ₺, kısa vadeli yabancı kaynakları 400.000 ₺ olan bir işletmenin cari oranı kaçtır?
  secenekler:
    A: 0,5
    B: 0,67
    C: 1,5
    D: 2,5
    E: '3'
  dogru: C
  aciklama:
    dogru_neden: Net işletme sermayesi dönen varlıklar eksi kısa vadeli yabancı kaynaklardır; dönen varlıklar 200.000 + 400.000
      = 600.000 ₺'dir. Cari oran 600.000 / 400.000 = 1,5'tir.
    hesap_adimlari:
    - Dönen varlıklar = 200.000 + 400.000 = 600.000
    - Cari oran = 600.000 / 400.000 = 1,5
    celdiriciler:
      A: Net işletme sermayesi kısa vadeli yabancı kaynaklara bölünmüştür (200.000 / 400.000); payda dönen varlıkların tamamı
        olmalıdır.
      B: Pay ile payda ters alınmıştır (400.000 / 600.000).
      D: Dönen varlıklar yerine dönen varlıklar ile kısa vadeli yabancı kaynakların toplamı alınmıştır (1.000.000 / 400.000).
      E: Dönen varlıklar net işletme sermayesine bölünmüştür (600.000 / 200.000).
  kaynaklar:
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Fon akım tabloları - Net işletme (çalışma) sermayesindeki değişim tablosu
    alinti: Bu tabloda, fon kavramı dönen varlıklar ile kısa vadeli yabancı kaynaklar far-kını belirten net işletme (çalışma)
      sermayesini kapsar.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Dönen varlıklar grubunda, bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrileceği veya kullanılacağı
      tahmin edilen varlıklar toplanır.
  - mevzuat: 'Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No: 1) Ek 4 - Mali Tabloların Düzenlenmesi'
    madde: Bilançonun biçimsel yapısı
    alinti: Kısa vadeli yabancı kaynaklar bir yıl içinde ödenmesi gereken; uzun vadeli yabancı kaynaklar ise bir yıldan sonra
      ödenecek olan borçlardan oluşur.
  gecerlilik:
    baslangic: '1994-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = (200000 + 400000) / 400000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
