    **(a) Geri ödeme sisteminin uygulanamayacağı haller (md. 117/1)**

    Serbest dolaşıma giriş beyannamesinin tescili sırasında: (a) ithalat miktar kısıtlamasına tabi olan, (b) kota kapsamında tarife önlemleri uygulanan, (c) tarım politikası çerçevesinde ithalat veya ihracat lisansı veya sertifikası ibrazını gerektiren, (d) işlem görmüş ürün için ihracat iadesi veya vergisi mevcut eşya için geri ödeme sistemi uygulanmaz. Buna göre **1, 2 ve 4** numaralı durumlarda uygulanamaz; **3** numaralı durumda uygulanabilir.

    **(b) Belgelendirilecek hususlar (md. 121/1)**

    İzin hak sahibi, geri ödeme sistemi çerçevesinde serbest dolaşıma giren ithal eşyasından elde edilmiş işlem görmüş ürünlerin veya değişmemiş eşyanın: (1) ihraç edildiklerini, (2) daha sonra yeniden ihraç edilmek üzere transit rejimi, gümrük antrepo rejimi, geçici ithalat rejimi veya şartlı muafiyet sistemine tabi dahilde işleme rejimine tabi tutulduğunu, (3) serbest bölgeye konulduğunu belgelendirmek ve rejimin uygulanmasına ilişkin diğer tüm şartlara uymuş olmak kaydıyla ithalat vergilerinin geri verilmesini veya kaldırılmasını isteyebilir.

    **(c) Statü (md. 121/2)**

    İşlem görmüş ürünler veya değişmemiş eşya, md. 121/1-b'de belirtilen gümrükçe onaylanmış işlem veya kullanıma tabi tutulma bakımından **serbest dolaşımda olmayan eşya** sayılır; antrepoya konulan ürünler bu statüdedir.

    **(d) Statü kaybı (md. 78/b)**

    Geri ödeme sisteminin uygulandığı dahilde işleme rejimi çerçevesinde işledikten sonra ihraç edilen eşyaya ilişkin gümrük vergilerinin geri verilmesi veya kaldırılması hâlinde serbest dolaşımda bulunan eşya bu statüsünü kaybeder.

    Püf noktaları: (1) Geri ödemede dört dışlama hali (miktar kısıtlaması, kota, lisans/sertifika, ihracat iadesi/vergisi) ezberlenmelidir. (2) Geri verme, eşyanın serbest dolaşım statüsünü sonlandırır.
