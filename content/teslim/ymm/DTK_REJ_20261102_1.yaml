    Şirket, sistem kapsamında serbest dolaşıma giren eşyadan elde edilen işlem görmüş ürünlerin bir kısmını ihraç etmiş, bir kısmını ise daha sonra yeniden ihraç edilmek üzere gümrük antrepo rejimine, kalan kısmı serbest bölgeye koymuştur. Şirket ithalat vergilerinin geri verilmesini talep etmektedir.

