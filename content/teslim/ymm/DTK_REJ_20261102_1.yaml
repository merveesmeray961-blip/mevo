    **(a) İhracat rejimi (md. 150, md. 151)**

    İhracat rejimi, serbest dolaşımda bulunan eşyanın ihraç amacıyla Türkiye Gümrük Bölgesi dışına çıkışına ilişkin hükümlerin uygulandığı rejimdir; ihraç edilecek eşya ihracata ilişkin gümrük beyannamesi ile yetkili gümrük idaresine beyan edilir (md. 150/1-2). İhraç eşyası, beyannamenin tescili sırasında bulunduğu durum ve niteliği gümrük kontrolünden çıktığı sırada da aynen muhafaza etmesi ve bu hâliyle Türkiye Gümrük Bölgesini terk etmesi koşuluyla fiilen ihraç edilmiş sayılır; bu durumda ihraç eşyası üzerindeki **gümrük kontrolü sona erer** (md. 151).

    **(b) Usulsüzlük cezaları (md. 241)**

    Temel ceza 1.494 TL'dir (md. 241/1). Md. 241/3 ve 241/4'e göre:

    | No | Dayanak | Kat | Ceza |
    |---|---|---|---|
    | 1 | md. 241/3-j (beyana göre miktar veya cinste %10'dan fazla fark) | 2 | 2 x 1.494 = **2.988 TL** |
    | 2 | Fark %8; %10'u aşmadığından ceza yok | -- | **0 TL** |
    | 3 | md. 241/3-ı (geçici çıkarılan eşyanın süre aşıldıktan sonra geri getirilmesi) | 2 | **2.988 TL** |
    | 4 | md. 241/4-f (antrepo eşyasının izinsiz elleçlenmesi) | 4 | 4 x 1.494 = **5.976 TL** |
    | 5 | md. 241/4-a (geçerli temsil yetkisi olmadan iş takibi) | 4 | **5.976 TL** |

    **(c) Toplam**

    2.988 + 0 + 2.988 + 5.976 + 5.976 = **17.928 TL**.

    **(d) Güncelleme**

    Md. 241/1'deki miktar, her yıl bir önceki yıla ilişkin olarak 213 sayılı VUK uyarınca belirlenen yeniden değerleme oranında artırılır; bu hesaplamada 1.000.000 TL'ye kadar olan tutarlar dikkate alınmaz (md. 241/2).

