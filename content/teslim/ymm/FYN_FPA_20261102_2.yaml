  kaynaklar:
  - mevzuat: SPK II-19.1 Kâr Payı Tebliği
    madde: md. 5/1
    alinti: Ortaklıklarda kâr payı, dağıtım tarihi itibarıyla mevcut payların tümüne, bunların ihraç ve iktisap tarihleri dikkate alınmaksızın payları oranında eşit olarak dağıtılır.
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 507/1
    alinti: Her pay sahibi, kanun ve esas sözleşme hükümlerine göre pay sahiplerine dağıtılması kararlaştırılmış net dönem kârına, payı oranında katılma hakkını haizdir.
  dogrulama:
    python: |
      adet=10_000_000; fiyat=12; kar=5_000_000; dps=0.30; oran_b=0.20; yatirimci=5_000
