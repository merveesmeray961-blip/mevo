    alinti: Yönetimin işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyeti bulunmadığı ya da bunları yapmak dışında gerçekçi bir alternatifi olduğu sürece işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar.
  dogrulama:
    python: |
      p=200; q=40_000
      v1, f1 = 120, 2_000_000
      v2, f2 = 100, 2_600_000
      k1, k2 = p-v1, p-v2
      be1, be2 = f1/k1, f2/k2
      ebit1 = q*k1-f1
      ebit2 = q*k2-f2
      dol1, dol2 = q*k1/ebit1, q*k2/ebit2
      gm1, gm2 = (q-be1)/q, (q-be2)/q
      q_ind = (f2-f1)/(k2-k1)
      qa = q*1.20
      qb = q*0.65
      ea1, ea2 = qa*k1-f1, qa*k2-f2
      eb1, eb2 = qb*k1-f1, qb*k2-f2
      sonuc = {'a': (be1, be2), 'b': (dol1, dol2, gm1, gm2), 'c': q_ind, 'd': (ea1, ea2, eb1, eb2)}
