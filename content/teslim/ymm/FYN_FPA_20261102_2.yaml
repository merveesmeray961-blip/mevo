  dogrulama:
    python: |
      p=250; v=150; f=1_500_000; faiz=300_000; vergi=0.25; fk_hedef=5; net_hedef=600_000; beklenen=28_000
      k = p-v
      b1 = f/k
      b2 = (f+faiz)/k
      ebit_h = fk_hedef*faiz
      q_fk = (f+ebit_h)/k
      has_fk = q_fk*p
      ebt_h = net_hedef/(1-vergi)
      q_net = (f+faiz+ebt_h)/k
      gm = (beklenen-b2)/beklenen
      sonuc = {'a': (b1, b2), 'b': (q_fk, has_fk), 'c': (ebt_h, q_net), 'd': gm}
