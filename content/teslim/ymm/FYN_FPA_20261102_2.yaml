  soru: |
    **Olay:** Tuğra Boru A.Ş. tek ürün üretmektedir: birim fiyat 250 TL, birim değişken maliyet 150 TL, yıllık sabit giderler 1.500.000 TL, yıllık faiz gideri 300.000 TL, kurumlar vergisi oranı %25'tir. 2026 yılı için beklenen satış 28.000 adettir.

    **İstenenler:**

    (a) Faaliyet başabaşı (FVÖK = 0) ve faiz giderini de karşılayan başabaşı (FVK = 0) adet olarak bulunuz. (5 puan)

    (b) Kredi sözleşmesi gereği faiz karşılama oranının (FVÖK / faiz) en az 5 olması gerekiyorsa gereken satış adedini ve hasılatını bulunuz. (6 puan)

    (c) 600.000 TL vergi sonrası net kâr için gereken vergi öncesi kârı ve satış adedini bulunuz. (6 puan)

    (d) Beklenen satış 28.000 adet iken faiz dahil başabaşa göre güvenlik marjını (%) hesaplayınız. (4 puan)
  cozum: |
    Birim katkı = 250 − 150 = 100 TL.

    **(a)** FVÖK başabaşı = 1.500.000 / 100 = **15.000 adet**; FVK başabaşı = (1.500.000 + 300.000) / 100 = **18.000 adet**.

    **(b)** FVÖK = 5 × 300.000 = 1.500.000 TL. Q = (1.500.000 + 1.500.000) / 100 = **30.000 adet**; hasılat = 30.000 × 250 = **7.500.000 TL**.

    **(c)** FVK = 600.000 / (1 − 0,25) = **800.000 TL**. Q = (1.500.000 + 300.000 + 800.000) / 100 = **26.000 adet**.

    **(d)** Güvenlik marjı = (28.000 − 18.000) / 28.000 = **%35,7143**.

    **Mevzuat dayanağı:** TMS 23 paragraf 5 uyarınca borçlanma maliyetleri, borçlanmalarla ilgili katlanılan faiz ve diğer giderlerdir.
