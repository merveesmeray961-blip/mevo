- id: TASLAK
  sinav: ymm
  ders: GUV
  konu: ASG
  kazanimlar:
  - yurt içi asgari kurumlar vergisi
  - asgari verginin hesabında düşülecek istisna ve indirimler
  - ilk faaliyet dönemi muafiyeti
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: |
    **Olay:** Ata Kimya A.Ş. 2022 yılında faaliyete başlamıştır. 2026 hesap dönemi verileri aşağıdadır:

    | Kalem | Tutar (TL) |
    |---|---|
    | Ticari bilanço kârı | 40.000.000 |
    | Kanunen kabul edilmeyen giderler | 2.000.000 |
    | Kâr hesabına dahil, KVK md. 5/1-a kapsamındaki iştirak kâr payı | 15.000.000 |
    | Kâr hesabına dahil, iştirak hissesi satış kazancı (md. 5/1-e istisnası %50 uygulanacak) | 6.000.000 |
    | 5746 sayılı Kanun kapsamında Ar-Ge indirimi (md. 10 dışı, kurum kazancından indirilecek) | 4.000.000 |
    | KVK md. 10/1-c kapsamında kamu idaresine makbuzlu bağış (sınırın altındadır) | 800.000 |
    | Geçmiş yıl zararı (md. 9 kapsamında indirilebilir) | 12.000.000 |

    İndirimli kurumlar vergisi veya başka teşvik uygulaması yoktur. KV oranı %25'tir.

    **İstenenler:**

    (a) Yurt içi asgari kurumlar vergisinin hesabında esas alınacak kurum kazancını bulunuz. (6 puan)

    (b) Normal kurumlar vergisi hesabına göre matrahı ve hesaplanan kurumlar vergisini bulunuz. (5 puan)

    (c) 2026 yılında ödenmesi gereken kurumlar vergisini ve asgari verginin etkisini (fark tutarını) belirtiniz. (5 puan)

    (d) Şirket 2025 yılında ilk defa faaliyete başlamış olsaydı 2026 için sonucun ne olacağını açıklayınız. (4 puan)
  cozum: |
    **(a) Asgari vergi matrahı (KVK md. 32/C)**

    "İndirim ve istisnalar düşülmeden önceki kurum kazancı" = ticari bilanço kârı + KKEG = 40.000.000 + 2.000.000 = 42.000.000 TL (md. 32/C/6).

    Md. 32/C/2'ye göre bu tutardan yalnızca sayılan istisna ve indirimler düşülür:

    | Kalem | Düşülür mü? | Tutar |
    |---|---|---|
    | İştirak kâr payı (md. 5/1-a) | Evet | 15.000.000 |
    | İştirak hissesi satış istisnası (md. 5/1-e) | Hayır (sayılan bentler arasında yok) | 0 |
    | Ar-Ge ve tasarım indirimi (5746) | Evet | 4.000.000 |
    | Bağış indirimi (md. 10/1-c) | Hayır | 0 |
    | Geçmiş yıl zararı | Hayır | 0 |

    Asgari vergi matrahı = 42.000.000 − 15.000.000 − 4.000.000 = **23.000.000 TL**; yurt içi asgari KV = 23.000.000 × %10 = **2.300.000 TL**.

    **(b) Normal hesap**

    | Kalem | Tutar |
    |---|---|
    | Kurum kazancı | 42.000.000 |
    | − İştirak kâr payı | (15.000.000) |
    | − Satış istisnası (6.000.000 × %50) | (3.000.000) |
    | − Ar-Ge indirimi | (4.000.000) |
    | − Bağış | (800.000) |
    | − Geçmiş yıl zararı | (12.000.000) |
    | **Matrah** | **7.200.000** |

    KV = 7.200.000 × %25 = **1.800.000 TL**.

    **(c)** Hesaplanan KV (1.800.000 TL), asgari KV'den (2.300.000 TL) az olduğundan ödenecek KV **2.300.000 TL**'dir; asgari verginin etkisi 2.300.000 − 1.800.000 = **500.000 TL**. Asgari vergi geçici vergi dönemlerinde de uygulanır.

    **(d)** Md. 32/C/5: ilk defa faaliyete başlayan kurumlar hakkında faaliyete başlanılan hesap döneminden itibaren üç hesap dönemi (2025, 2026, 2027) boyunca bu madde uygulanmaz. Bu durumda 2026 için ödenecek vergi **1.800.000 TL** olur.

    Püf noktaları: (1) Satış istisnası (5/1-e), bağış ve geçmiş yıl zararı asgari vergi matrahından düşülmez. (2) "İndirim ve istisnalar düşülmeden önceki kurum kazancı" ticari kâr + KKEG'dir. (3) İlk üç hesap dönemi (faaliyete başlanılan dönem dahil) muaftır.
  puanlama:
  - olcut: (a) 42.000.000 TL, düşülecek/düşülmeyecek kalemler ve 2.300.000 TL asgari vergi
    puan: 6
  - olcut: (b) Normal matrah 7.200.000 TL ve KV 1.800.000 TL
    puan: 5
  - olcut: (c) Ödenecek 2.300.000 TL ve 500.000 TL fark
    puan: 5
  - olcut: (d) Üç hesap dönemi muafiyeti ve 1.800.000 TL
    puan: 4
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/1
    alinti: 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-a
    alinti: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri ile sahip oldukları taşınmazlardan elde edilen kazançlar dışında (d) bendinde sayılan istisna kazançlar,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-ç
    alinti: ç) 4691 sayılı Kanun kapsamındaki kazanç istisnası ile kurumlar vergisi matrahından indirim konusu yapılabilen Ar-Ge ve tasarım indirimleri.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/4
    alinti: Bu madde hükmü geçici vergi dönemleri için de uygulanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/5
    alinti: İlk defa faaliyete başlayan kurumlar hakkında faaliyete başlanılan hesap döneminden itibaren üç hesap dönemi boyunca bu madde hükümleri uygulanmaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/6
    alinti: Bu maddede yer alan indirim ve istisnalar düşülmeden önceki kurum kazancı ibaresi, hesap dönemi sonundaki ticari bilanço kârına kanunen kabul edilmeyen giderlerin eklenmesiyle bulunan tutarı ifade eder.
  dogrulama:
    python: |
      kazanc = 40000000 + 2000000
      asgari_matrah = kazanc - 15000000 - 4000000
      asgari = asgari_matrah * 0.10
      matrah = kazanc - 15000000 - 6000000 * 0.5 - 4000000 - 800000 - 12000000
      kv = matrah * 0.25
      odenecek = max(kv, asgari)
      sonuc = {"a": [kazanc, asgari_matrah, asgari], "b": [matrah, kv], "c": [odenecek, odenecek - kv], "d": kv}
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
- id: TASLAK
  sinav: ymm
  ders: GUV
  konu: ASG
  kazanimlar:
  - yurt içi asgari kurumlar vergisi
  - indirimli oran uygulaması nedeniyle alınmayan verginin düşülmesi
  - asgari verginin mahsup mekanizması
  zorluk: 3
  puan: 20
  sure_dk: 30
  soru: |
    **Olay:** Mercan Dış Ticaret A.Ş. 2022 yılında faaliyete başlamıştır (ihracat yapan, indirimli oranı uygulamayı seçmiş bir kurumdur). 2026 verileri:

    | Kalem | Tutar (TL) |
    |---|---|
    | İndirim ve istisnalar düşülmeden önceki kurum kazancı (ticari kâr + KKEG) | 60.000.000 |
    | Geçmiş yıl zararı (md. 9 uyarınca indirilebilir) | 45.000.000 |
    | Kurum kazancından geçmiş yıl zararı indirildikten sonra kalan matrah (başka indirim/istisna yoktur) | 15.000.000 |
    | Bu matrahın içinde yer alan, münhasıran ihracattan elde edilen kazanç | 12.000.000 |
    | Bu matrahın içinde yer alan diğer kazanç | 3.000.000 |

    KV oranı %25'tir; ihracat kazancına kurumlar vergisi oranı 5 puan indirimli uygulanır (KVK md. 32/7). Bu matrahta başka bir indirimli oran yoktur.

    **İstenenler:**

    (a) Normal hesaplamaya göre kurumlar vergisini bulunuz. (5 puan)

    (b) Yurt içi asgari kurumlar vergisini hesaplayınız (indirimli oran nedeniyle alınmayan verginin etkisi dahil). (8 puan)

    (c) Ödenecek kurumlar vergisini ve asgari verginin vergi yüküne ek etkisini hesaplayınız. (4 puan)

    (d) Asgari kurumlar vergisi bu sorudaki gibi geçici vergi dönemlerinde de uygulanır mı? (3 puan)
  cozum: |
    **(a) Normal hesap**

    - İhracat kazancı: 12.000.000 × (%25 − 5 puan = %20) = 2.400.000 TL
    - Diğer kazanç: 3.000.000 × %25 = 750.000 TL
    - Toplam KV = **3.150.000 TL**

    **(b) Yurt içi asgari KV**

    Md. 32/C/1: hesaplanan KV, indirim ve istisnalar düşülmeden önceki kurum kazancının %10'undan az olamaz = 60.000.000 × %10 = 6.000.000 TL. Md. 32/C/3: 32. maddenin 6, 7 ve 8. fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan vergi bu tutardan indirilir:
    - İhracat indirimi nedeniyle alınmayan vergi = 12.000.000 × %5 = 600.000 TL
    - Ödenmesi gereken asgari KV = 6.000.000 − 600.000 = **5.400.000 TL**

    **(c)** Hesaplanan KV (3.150.000 TL) asgari KV'den (5.400.000 TL) az olduğundan ödenecek KV **5.400.000 TL**'dir; ek yük = 5.400.000 − 3.150.000 = **2.250.000 TL**.

    **(d)** Evet. Md. 32/C/4: bu madde hükmü geçici vergi dönemleri için de uygulanır.

    Püf noktaları: (1) Geçmiş yıl zararı asgari vergi matrahını azaltmaz. (2) İndirimli oran nedeniyle alınmayan vergi, asgari vergiden düşülür (ihracat indirimi dahil). (3) Asgari vergi, hesaplanan KV'den büyükse ödenecek tutar asgari vergidir.
  puanlama:
  - olcut: (a) İhracat kazancına %20, diğerine %25 ve 3.150.000 TL
    puan: 5
  - olcut: (b) %10 hesabı 6.000.000 TL, alınmayan vergi 600.000 TL ve 5.400.000 TL
    puan: 8
  - olcut: (c) Ödenecek 5.400.000 TL ve ek yük 2.250.000 TL
    puan: 4
  - olcut: (d) Geçici vergi dönemlerinde de uygulanması
    puan: 3
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/7
    alinti: İhracat yapan kurumların münhasıran ihracattan elde ettikleri kazançlarına kurumlar vergisi oranı 5 puan indirimli uygulanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/1
    alinti: 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/3
    alinti: Birinci fıkra kapsamında hesaplanan yurt içi asgari kurumlar vergisinden, 32 nci maddenin altıncı, yedinci ve sekizinci fıkraları uyarınca indirimli oran uygulaması nedeniyle alınmayan vergi ile bu maddenin yürürlüğe girdiği tarihten önce Sanayi ve Teknoloji Bakanlığından alınmış olan teşvik belgelerindeki yatırıma katkı tutarlarının kullanılması nedeniyle 32/A maddesi hükmüne istinaden ilgili hesap döneminde alınmayan vergi indirilir ve ödenmesi gereken yurt içi asgari kurumlar vergisi belirlenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/4
    alinti: Bu madde hükmü geçici vergi dönemleri için de uygulanır.
  dogrulama:
    python: |
      kv = 12000000 * 0.20 + 3000000 * 0.25
      asgari = 60000000 * 0.10 - 12000000 * 0.05
      odenecek = max(kv, asgari)
      sonuc = {"a": kv, "b": asgari, "c": [odenecek, odenecek - kv]}
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
