  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
- id: TASLAK
  sinav: ymm
  ders: GUV
  konu: DAR
  kazanimlar:
  - yabancı ulaştırma kurumlarının vergilendirilmesi
  - ortalama emsal oranları
  - Türkiye'de elde edilmiş sayılan hasılat
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: |
    **Olay:** Yabancı ulaştırma kurumu Aegean Shipping & Logistics S.A.'nın (dar mükellef) 2026 yılında Türkiye ile ilgili hasılatı aşağıdadır:

    | Hasılat unsuru | Tutar (TL) |
    |---|---|
    | Türkiye sınırları içinde gerçekleşen kara taşımacılığından tahsil edilen yük taşıma ücreti | 2.000.000 |
    | Türkiye'deki yükleme limanlarından yabancı limanlara yapılan deniz taşımacılığı navlunu | 10.000.000 |
    | Türkiye'de yaptığı navlun sözleşmeleri dolayısıyla Türkiye dışındaki deniz taşımacılığı için kendisine verilen komisyon | 300.000 |
    | Türkiye'deki hava taşımacılığına ilişkin, bilet bedeli ile birlikte alınan gider karşılıkları dahil hasılat (Türkiye'deki yükleme noktalarından yabancı varış noktalarına) | 4.000.000 |
    | Yabancı limanlar arasında yapılan deniz taşımacılığı hasılatı (Türkiye'ye uğramadan) | 8.000.000 |

    Komisyon geliri deniz taşımacılığına ilişkindir. Ortalama emsal oranları KVK md. 23/2'dedir. KV oranı %25'tir.

    **İstenenler:**

    (a) Türkiye'de elde edilmiş sayılan hasılat unsurlarını belirleyiniz. (6 puan)

    (b) Türkiye'de vergiye matrah olacak kurum kazancını ortalama emsal oranlarına göre hesaplayınız. (8 puan)

    (c) Kurumlar vergisini hesaplayınız. (3 puan)

    (d) Yabancı limanlar arasındaki taşıma hasılatının neden hesaba katılmadığını açıklayınız. (3 puan)
  cozum: |
    **(a) Hasılat unsurları (md. 23/3)**

    | Unsur | Dahil mi? | Dayanak |
    |---|---|---|
    | Kara taşımacılığı (Türkiye sınırları içinde) | Evet | 23/3-a |
    | Türkiye'deki limandan yabancı limana deniz taşımacılığı | Evet | 23/3-b |
    | Türkiye'de yapılan navlun sözleşmelerinden verilen komisyon (Türkiye dışı taşımacılık) | Evet | 23/3-c |
    | Hava taşımacılığı (Türkiye'den yabancı varışa) | Evet | 23/3-b |
    | Yabancı limanlar arası taşıma | Hayır | Türkiye'de elde edilmiş sayılan unsurlar arasında değil |

    **(b) Kurum kazancı (md. 23/1 ve 23/2)**

    | Taşıma türü | Hasılat | Oran | Kazanç |
    |---|---|---|---|
    | Kara | 2.000.000 | %12 | 240.000 |
    | Deniz (10.000.000 + 300.000) | 10.300.000 | %15 | 1.545.000 |
    | Hava | 4.000.000 | %5 | 200.000 |
    | **Toplam** | | | **1.985.000** |

    **(c)** KV = 1.985.000 × %25 = **496.250 TL**.

    **(d)** Yabancı limanlar arasında yapılan ve Türkiye'ye uğramayan taşımalar md. 23/3'te sayılan Türkiye'de elde edilmiş sayılan hasılat unsurları kapsamında değildir; dar mükellef yalnız Türkiye'de elde ettiği kazançlardan vergilendirilir.

    Püf noktaları: (1) Kazanç gerçek karla değil, hasılata ortalama emsal oranı uygulanarak bulunur: kara %12, deniz %15, hava %5. (2) Navlun sözleşmeleri için alınan komisyon da Türkiye'de elde edilmiş sayılır. (3) Türkiye dışı taşımalar kapsam dışıdır.
  puanlama:
  - olcut: (a) Unsurların doğru ayrımı
    puan: 6
  - olcut: (b) Üç taşıma türü için oranlar ve 1.985.000 TL
    puan: 8
  - olcut: (c) KV 496.250 TL
    puan: 3
  - olcut: (d) Kapsam dışı hasılat gerekçesi
    puan: 3
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/1
    alinti: Yabancı ulaştırma kurumlarının vergiye matrah olacak kurum kazancı, hasılata ortalama emsal oranlarının uygulanması suretiyle hesaplanır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/2
    alinti: Ortalama emsal oranları, Türkiye’de daimî veya arızî olarak çalışan bütün kurumlar için; a) Kara taşımacılığında % 12, b) Deniz taşımacılığında % 15, c) Hava taşımacılığında % 5,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/3-b
    alinti: Türkiye’deki yükleme limanlarından yabancı ülkelerdeki varış limanlarına veya diğer bir kurumun gemisine aktarma yapılacak yabancı limana kadar gerçekleşen deniz ve hava taşımacılığında, bilet bedeli ile birlikte alınan gider karşılıkları dahil olmak üzere yolcu, yük ve bagaj taşıma ücreti olarak her ne adla olursa olsun aldıkları tutarlar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 23/3-c
    alinti: Türkiye dışındaki taşımacılık faaliyeti için diğer kurumlar hesabına Türkiye’de sattıkları yolcu ve bagaj biletleri ile Türkiye’de yaptıkları navlun sözleşmeleri dolayısıyla kendilerine verilen komisyonlar ve ücretler.
  dogrulama:
    python: |
      kazanc = 2000000 * 0.12 + (10000000 + 300000) * 0.15 + 4000000 * 0.05
      sonuc = {"b": kazanc, "c": kazanc * 0.25}
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
