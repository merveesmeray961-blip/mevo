    madde: md. 5/1-b-2
    alinti: 2) Kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz olarak en az bir yıl süreyle elde tutulması
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 5/1-b-3
    alinti: 3) Yurt dışı iştirak kazancının kâr payı dağıtımına kaynak olan kazançlar üzerinden ödenen vergiler dahil iştirak edilen kurumun faaliyette bulunduğu ülke vergi kanunları uyarınca en az % 15 oranında gelir ve kurumlar vergisi benzeri toplam vergi yükü taşıması;
