- id: TASLAK
  sinav: ymm
  ders: GUV
  konu: KVM
  kazanimlar:
  - transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı
  - ilişkili kişi tanımı
  - vergi ziyaı cezası indirimi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: |
    **Olay:** Mavi Metal A.Ş.'nin (tam mükellef) ortakları: Doğu Holding A.Ş. (%60), Deniz Yapı Ltd. Şti. (%8) ve diğerleri. Şirket 2026 yılında aşağıdaki işlemleri yapmıştır:

    | İşlem | Karşı taraf | Uygulanan bedel | Emsallere uygun bedel |
    |---|---|---|---|
    | 1.000 ton saç satışı | Doğu Holding A.Ş. | Ton başı 31.000 TL | Ton başı 38.000 TL |
    | 500 ton saç satışı | Deniz Yapı Ltd. Şti. | Ton başı 30.000 TL | Ton başı 38.000 TL |
    | Depo kiralama | Doğu Holding A.Ş. | Yıllık 600.000 TL | Yıllık 600.000 TL |

    Deniz Yapı Ltd. Şti. ile Mavi Metal arasında ortaklık dışında başka bir ilişki yoktur. Şirketin 2026 ticari bilanço kârı 12.000.000 TL'dir; başka düzeltme kalemi yoktur. Transfer fiyatlandırmasına ilişkin belgelendirme yükümlülükleri tam ve zamanında yerine getirilmiştir. KV oranı %25'tir; vergi ziyaına VUK md. 359'daki fiillerle sebebiyet verilmemiştir.

    **İstenenler:**

    (a) Üç işlemin hangisinde veya hangilerinde örtülü kazanç dağıtımı bulunduğunu, ilişkili kişi tanımına dayanarak belirtiniz. (7 puan)

    (b) Örtülü olarak dağıtılan kazanç tutarını ve 2026 kurum kazancını hesaplayınız. (6 puan)

    (c) Kurumlar vergisini hesaplayınız. (3 puan)

    (d) Bu tarhiyat nedeniyle kesilecek vergi ziyaı cezasını, md. 13/8 indirimini dikkate alarak hesaplayınız. (6 puan)
  cozum: |
    **(a) İlişkili kişi tespiti**

    Md. 13/2: ortaklık kanalıyla oluşan ilişkinin örtülü kazanç dağıtımı kapsamında sayılması için en az %10 oranında ortaklık, oy veya kâr payı hakkı aranır.

    | İşlem | Değerlendirme |
    |---|---|
    | Doğu Holding'e satış | Holding %60 ortaktır; fiyat emsale aykırı (31.000 < 38.000) → örtülü kazanç dağıtımı var |
    | Deniz Yapı'ya satış | %8 < %10 olduğundan ilişkili kişi sayılmaz; fiyat düşük olsa da md. 13 uygulanmaz |
    | Depo kiralama | Bedel emsale uygun → örtülü dağıtım yok |

    **(b) Örtülü dağıtım**

    (38.000 − 31.000) × 1.000 ton = **7.000.000 TL**.

    Kurum kazancı = 12.000.000 + 7.000.000 = **19.000.000 TL** (md. 13/1 ve md. 11/1-c: örtülü dağıtılan kazanç indirilemez).

    **(c)** KV = 19.000.000 × %25 = **4.750.000 TL**.

    **(d) Vergi ziyaı cezası**

    - Ziyaa uğratılan KV = 7.000.000 × %25 = 1.750.000 TL
    - VUK md. 344/1: ziyaa uğratılan verginin bir katı = 1.750.000 TL
    - Md. 13/8: belgelendirme tam ve zamanında yapıldığından %50 indirimli → **875.000 TL**

    Püf noktaları: (1) İlişkili kişilik için ortaklıkta %10 eşiği vardır. (2) Örtülü dağıtılan kazanç hesap döneminin son günü itibarıyla kâr payı sayılır, ayrıca stopaj ve ortak tarafı düzeltmesi gündeme gelir. (3) Ceza indirimi için belgelendirme yükümlülüklerinin tam ve zamanında yerine getirilmesi şarttır.
  puanlama:
  - olcut: (a) Üç işlemin değerlendirilmesi ve %10 ortaklık şartı
    puan: 7
  - olcut: (b) 7.000.000 TL örtülü kazanç ve 19.000.000 TL kurum kazancı
    puan: 6
  - olcut: (c) KV 4.750.000 TL
    puan: 3
  - olcut: (d) 1.750.000 TL ceza tabanı, %50 indirim, 875.000 TL
    puan: 6
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/1
    alinti: Kurumlar, ilişkili kişilerle emsallere uygunluk ilkesine aykırı olarak tespit ettikleri bedel veya fiyat üzerinden mal veya hizmet alım ya da satımında bulunursa, kazanç tamamen veya kısmen transfer fiyatlandırması yoluyla örtülü olarak dağıtılmış sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/2
    alinti: İlişkinin doğrudan veya dolaylı olarak ortaklık kanalıyla oluştuğu durumların örtülü kazanç dağıtımı kapsamında sayılması için en az %10 oranında ortaklık, oy veya kâr payı hakkının olması şartı aranır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 13/8
    alinti: Transfer fiyatlandırmasına ilişkin belgelendirme yükümlülüklerinin tam ve zamanında yerine getirilmiş olması kaydıyla, örtülü olarak dağıtılan kazanç nedeniyle zamanında tahakkuk ettirilmemiş veya eksik tahakkuk ettirilmiş vergiler için vergi ziyaı cezası (Vergi Usul Kanununun 359 uncu maddesinde yazılı fiillerle vergi ziyaına sebebiyet verilmesi hali hariç) %50 indirimli olarak uygulanır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 344/1
    alinti: 341 inci maddede yazılı hallerde vergi ziyaına sebebiyet verildiği takdirde, mükellef veya sorumlu hakkında ziyaa uğratılan verginin bir katı tutarında vergi ziyaı cezası kesilir.
  dogrulama:
    python: |
      oku = (38000 - 31000) * 1000
      kazanc = 12000000 + oku
      kv = kazanc * 0.25
      ziya = oku * 0.25
      ceza = ziya * 0.5
      sonuc = {"b": [oku, kazanc], "c": kv, "d": ceza}
  gecerlilik:
