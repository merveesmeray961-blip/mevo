  soru: |
    **Olay:** Güneş Enerji A.Ş. (tam mükellef) 2026 hesap dönemine ilişkin kurum kazancını, zarar mahsubu öncesinde 12.000.000 TL olarak tespit etmiştir. Şirketin beyannamelerinde yıl yıl gösterilen zarar kalemleri şöyledir:

    | Zarar | Tutar (TL) | Açıklama |
    |---|---|---|
    | 2020 yılı zararı | 3.000.000 | Mahsup edilmemiştir |
    | 2021 yılı zararı | 2.000.000 | Mahsup edilmemiştir |
    | 2023 yılı zararı | 4.000.000 | Mahsup edilmemiştir |
    | 2024 yılı Fransa şubesi zararı | 1.500.000 | Şube kazançları kurumlar vergisinden istisna değildir; zarar, o ülke mevzuatına göre yetkili kuruluşça rapora bağlanmış, rapor ve tercümesi vergi dairesine ibraz edilmiştir |
    | 2025 yılı Gürcistan şubesi zararı | 800.000 | Şubenin kazançları KVK md. 5/1-g istisnası kapsamındadır; zarar raporlanmıştır |
    | Devralınan Yeşil Ltd. Şti. zararı | 5.000.000 | 2025'te md. 20/1 kapsamında devralınmış; devir tarihindeki öz sermaye 3.000.000 TL; son beş yıla ilişkin beyannameler süresinde verilmiştir; devralınan faaliyete en az beş yıl devam edilecektir |

    Kurumlar vergisi oranı %25'tir; 2026 öncesindeki beyannamelerde bu zararlar yıl yıl ayrı gösterilmiştir.

    **İstenenler:**

    (a) Her bir zararın 2026 kurum kazancından indirilip indirilemeyeceğini gerekçesiyle belirtiniz. (9 puan)

    (b) İndirilecek toplam zarar ile 2026 matrahını bulunuz. (5 puan)

    (c) Kurumlar vergisini hesaplayınız. (3 puan)

    (d) Yeşil Ltd. faaliyetine beş yıl devam edilmemesi hâlinde sonucu açıklayınız. (3 puan)
  cozum: |
    **(a) Değerlendirme (KVK md. 9)**

    | Zarar | İndirilebilir mi? | Tutar |
    |---|---|---|
    | 2020 | Hayır: beş yıldan fazla nakledilemez (2021–2025 yıllarında kullanılabilirdi; 2026 altıncı yıldır) | 0 |
    | 2021 | Evet: 2022–2026 arası beş yıl içinde; 2026 beşinci yıldır | 2.000.000 |
    | 2023 | Evet | 4.000.000 |
    | Fransa şubesi zararı (2024) | Evet: istisna edilen kazançla ilgili değil; rapor ve tercüme ibraz edildi | 1.500.000 |
    | Gürcistan şubesi zararı (2025) | Hayır: Türkiye'de kurumlar vergisinden istisna edilen kazançlarla ilgili yurt dışı zararlar indirilemez | 0 |
    | Yeşil Ltd. zararı | Kısmen: devralınan kurumun zararı devir tarihindeki öz sermaye tutarını geçemez; şartlar sağlandığından | 3.000.000 |

    **(b) Toplam ve matrah**

    İndirilecek zarar = 2.000.000 + 4.000.000 + 1.500.000 + 3.000.000 = **10.500.000 TL**.
    Matrah = 12.000.000 − 10.500.000 = **1.500.000 TL**.

    **(c)** KV = 1.500.000 × %25 = **375.000 TL**.

    **(d)** Beş yıl faaliyete devam edilmemesi veya diğer şartların ihlâli hâlinde zarar mahsupları nedeniyle zamanında tahakkuk ettirilmeyen vergiler için vergi ziyaı doğmuş sayılır.

    Püf noktaları: (1) "Beş yıldan fazla nakledilmemek" kuralı: zararın doğduğu yıl dahil sayılmaz, izleyen beş yılda kullanılır. (2) İstisna kazançla ilgili yurt dışı zarar indirilemez. (3) Devralınan zarar için öz sermaye sınırı ve beş yıl devam şartı aranır.
  puanlama:
  - olcut: (a) Altı kalemin doğru değerlendirilmesi (her biri 1,5)
    puan: 9
  - olcut: (b) 10.500.000 TL zarar ve 1.500.000 TL matrah
    puan: 5
  - olcut: (c) KV 375.000 TL
    puan: 3
  - olcut: (d) Vergi ziyaı doğmuş sayılması
    puan: 3
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-a
    alinti: a) Beş yıldan fazla nakledilmemek şartıyla geçmiş yılların beyannamelerinde yer alan zararlar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-a (devralınan)
    alinti: Kanunun 20 nci maddesinin birinci fıkrası çerçevesinde devralınan kurumların devir tarihi itibarıyla öz sermaye tutarını geçmeyen zararları
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-a (şartlar)
    alinti: 1) Son beş yıla ilişkin kurumlar vergisi beyannamelerinin kanunî süresinde verilmiş olması. 2) Devralınan kurumun faaliyetine devir veya bölünmenin meydana geldiği hesap döneminden itibaren en az beş yıl süreyle devam edilmesi. Bu şartların ihlâli halinde, zarar mahsupları nedeniyle zamanında tahakkuk ettirilmeyen vergiler için vergi ziyaı doğmuş sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-b
    alinti: b) Türkiye’de kurumlar vergisinden istisna edilen kazançlarla ilgili olanlar hariç olmak üzere, beş yıldan fazla nakledilmemek şartıyla yurt dışı faaliyetlerden doğan zararlar;
  dogrulama:
    python: |
      zarar = 2000000 + 4000000 + 1500000 + min(5000000, 3000000)
      matrah = 12000000 - zarar
      sonuc = {"b": [zarar, matrah], "c": matrah * 0.25}
