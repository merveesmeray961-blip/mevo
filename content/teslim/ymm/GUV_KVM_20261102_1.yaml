    (c) 2026 hesap dönemi kurumlar vergisi beyannamesinin verilme süresini ve verginin son ödeme gününü belirtiniz (beyannamenin süresinin son günü verildiği varsayılacaktır; 2027 yılı için tatil/hafta sonu etkisi dikkate alınmayacaktır). (6 puan)
  cozum: |
    **(a) Kabul edilmeyen giderler (KVK md. 11/1)**

    | Gider | Bent | Kabul edilmeyen |
    |---|---|---|
    | Kurumlar vergisi | d | 500.000 |
    | Vergi ziyaı cezası | d | 120.000 |
    | VUK gecikme faizi | d | 30.000 |
    | 6183 gecikme zammı | d | 20.000 |
    | Alkollü içki reklamı | ı (%50) | 200.000 |
    | Esas faaliyetle ilgisiz yat | f | 350.000 |
    | Çalışanın kusuru/suçundan doğan tazminat | g | 80.000 |
    | Ceza şartı tazminatı | g (ceza şartı olarak konulan tazminatlar hariç) | 0 (kabul) |
    | İtibarî değer altı ihraç zararı | e | 100.000 |
    | Öz sermaye faizi | a | 250.000 |
    | Reklam yasağı olanlara reklam | j | 60.000 |
    | Şans/bahis reklamı | k | 40.000 |
    | **Toplam** | | **1.750.000** |

    **(b)** Kurum kazancı = 14.000.000 + 1.750.000 = **15.750.000 TL**. KV = 15.750.000 × %25 = **3.937.500 TL**.

    **(c)** Beyanname, hesap döneminin kapandığı ayı (Aralık 2026) izleyen dördüncü ayın (Nisan 2027) birinci gününden yirmibeşinci günü akşamına kadar, yani **1–25 Nisan 2027** arasında verilir (md. 14/3). Vergi, beyannamenin verildiği ayın sonuna kadar, yani **30 Nisan 2027**'ye kadar ödenir (md. 21/1).

    Püf noktaları: (1) Alkollü içki ve tütün reklamında yalnız yarısı kabul edilmez. (2) Ceza şartı olarak sözleşmede yer alan tazminatlar kabul edilir; çalışanın suçundan doğan tazminat kabul edilmez. (3) Gecikme faizi/zammı ve her tür ceza kabul edilmez.
