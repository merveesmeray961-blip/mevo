  - mevzuat: 4691 sayılı Teknoloji Geliştirme Bölgeleri Kanunu
    madde: ek md. 3 (2)
    alinti: Söz konusu tutarın ilgili yılın sonuna kadar aktarılmaması durumunda, bu Kanun kapsamında yıllık beyanname üzerinden istisna edilen kazançlar tutarının yüzde yirmisi, ilgili yılda yararlanılan gelir ve kurumlar vergisi istisnasına konu edilemez. Bu tutar nedeniyle zamanında alınmayan vergiler vergi ziyaı cezası uygulanmaksızın tarh edilir.
