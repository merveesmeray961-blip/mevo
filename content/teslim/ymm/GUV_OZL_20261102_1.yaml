    | Bildirim | Varlık | Bildirim tarihi | Bulundurma taahhüdü |
    |---|---|---|---|
    | 1 | Türkiye'de bulunan, kanunî defter kayıtlarında yer almayan döviz: 10.000.000 | 10/11/2026 | Vadeli hesapta en az 3 yıl |
    | 2 | Yurt dışındaki bankada bulunan para: 6.000.000 | 20/11/2026 | Taahhüt yok |
    | 3 | Türkiye'de bulunan, kayıt dışı devlet iç borçlanma senetleri: 4.000.000 | 10/3/2027 | En az 5 yıl |
    | 4 | Yurt dışındaki altın: 8.000.000 | 5/4/2027 | Taahhüt yok |

    Bildirim süresinin 31/7/2027'de sona ereceği ve uzatılmadığı varsayılacaktır.

    **İstenenler:**

    (a) Her bir bildirime uygulanacak vergi oranını ve bankaya/aracı kuruma ödenecek vergi tutarını hesaplayınız. (8 puan)

    (b) Yurt dışından bildirilen varlıkların Türkiye'ye getirilme süresini ve bu sürede yerine getirilmemesinin sonucunu açıklayınız. (5 puan)

    (c) Bildirilen varlıkların bilanço esasına göre defter tutan mükellef tarafından muhasebeleştirilme şeklini ve fon hesabına ilişkin kısıtı belirtiniz. (4 puan)

    (d) Ödenen verginin gider yazılıp yazılamayacağını ve başka bir vergiden mahsup edilip edilemeyeceğini belirtiniz. (3 puan)
  cozum: |
    **(a) Oran ve vergi (md. 19/6)**

    Genel oran %5; vadeli hesaplarda, DİBS/kira sertifikalarında veya girişim sermayesi fonlarında beş yıl bulundurma taahhüdüyle %0, dört yıl %1, üç yıl %2, iki yıl %3, bir yıl %4. 1/1/2027–31/7/2027 arası bildirimlerde bu oranlara yarım puan artırım yapılır.

    | Bildirim | Oran | Vergi |
    |---|---|---|
    | 1: 10.000.000 (2026, 3 yıl taahhüt) | %2 | 200.000 |
    | 2: 6.000.000 (2026, taahhütsüz) | %5 | 300.000 |
    | 3: 4.000.000 (2027, 5 yıl) | %0 + 0,5 = %0,5 | 20.000 |
    | 4: 8.000.000 (2027, taahhütsüz) | %5 + 0,5 = %5,5 | 440.000 |

    **(b)** Yurt dışında bulunan varlıklar bildirimin yapıldığı tarihten itibaren **iki ay** içinde Türkiye'deki banka ya da aracı kurumlarda açılan hesaplara transfer edilmeli (veya fiziken getirilenler bu hesaplara yatırılmalı). Bu süre içinde getirilmez/transfer edilmezse md. 19/8'deki tarhiyat yapılmaması güvencesinden yararlanılamaz; ayrıca zamanında tahakkuk ettirilmeyen vergiler vergi ziyaı cezası uygulanmaksızın gecikme faiziyle tahsil olunur.

    **(c)** Bildirilen varlıklar bildirim tarihi itibarıyla kanunî defterlere kaydedilir; bilanço esasına göre defter tutan mükellefler bu kıymetler için pasifte özel fon hesabı açar. Fon hesabı bildirim tarihinden itibaren iki yıl geçmedikçe işletmeden çekilemez, sermayeye ilave dışında başka bir amaçla kullanılamaz.

    **(d)** Ödenen vergi hiçbir suretle gider yazılamaz ve başka bir vergiden mahsup edilemez (md. 19/7).

    Püf noktaları: (1) 1/1/2027'den itibaren oranlara yarım puan eklenir. (2) Taahhüt süreleri vadeli hesap, DİBS/kira sertifikası veya girişim sermayesi fonu için geçerlidir. (3) Yurt dışı varlıkta iki ay içinde Türkiye'ye getirme şartı vardır.
