    | İşlem grubu | İş hacmi (TL) |
    |---|---|
    | Ortaklara, ortaklık statüsü içinde yapılan satışlar (kişisel ve ailevi gıda ve giyecek) | 30.000.000 |
    | Ortak olmayan kişilere yapılan satışlar | 10.000.000 |

    Kooperatif, ortaklarla yapılan işlemlerden doğan kazancın tamamını ortakların satın aldıkları malların değerine göre risturn olarak hesaplamış; bunun 1.200.000 TL'sini nakden, kalanını aynı değerde mal ile ödemiştir. Genel kazancın ayrımında iş hacmi oranı esas alınacaktır. Kurumlar vergisi oranı %25'tir.

