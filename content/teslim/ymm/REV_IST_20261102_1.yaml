  - {olcut: "(b) (e) bendi, %50 oranı ve istisna tutarları", puan: 4}
  - {olcut: "(b) Matrah ve KV", puan: 3}
  - {olcut: "(c) Asgari KV hesabı", puan: 5}
  - {olcut: "(d) %76 durumunda tam istisna ve KV", puan: 5}
  kaynaklar:
