- id: TASLAK
  sinav: ymm
  ders: REV
  konu: IST
  kazanimlar:
  - yurt dışı iştirak kazançları istisnası
  - asgari kurumlar vergisi kontrolü
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Kuzey Plastik A.Ş. (tam mükellef, finans veya sigorta sektöründe değildir, hesap dönemi takvim yılıdır) 2026 hesap dönemi ticari bilanço kârını 6.000.000 TL bulmuştur. Kanunen kabul edilmeyen giderleri 400.000 TL'dir; geçmiş yıl zararı ve istisna kazançlara ilişkin gider yoktur. Ticari kâra aşağıdaki yurt dışı iştirak kâr payları dahil edilmiştir (üç şirket de anonim veya limited şirket niteliğindedir ve kanunî ile iş merkezleri Türkiye dışındadır):

    | İştirak | Pay oranı | Edinme tarihi | Kâr payı (TL) | Vergi yükü bilgisi | Türkiye'ye transfer |
    |---|---|---|---|---|---|
    | R1 s.r.o. | %25 | 12/5/2023 | 800.000 | Kaynak dönemde ödenen gelir ve kurumlar vergisi benzeri vergi 270.000 TL; vergi sonrası dağıtılabilir kazanç 1.530.000 TL | 10/4/2027 |
    | R2 EOOD | %15 | 15/9/2025 | 500.000 | Toplam vergi yükü %10 | 20/6/2026 |
    | R3 LLC | %60 | 2022 | 1.000.000 | Toplam vergi yükü %5 | 15/4/2027 |

    Kâr payları 2026 yılında elde edilmiştir (R2'nin kâr payı 20/6/2026'da elde edilmiştir). Kurumlar vergisi oranı %25'tir; indirimli oran veya başka indirim uygulanmayacaktır.

    **İstenenler:**

    (a) R1 için toplam vergi yükünü hesaplayarak üç iştirak kazancının istisna durumunu gerekçesiyle belirleyiniz. (8 puan)

    (b) 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (6 puan)

    (c) Yurt içi asgari kurumlar vergisi kontrolünü yaparak ödenecek kurumlar vergisini belirleyiniz. (5 puan)

    (d) R1'in kâr payı Türkiye'ye 5/5/2027'de transfer edilseydi (diğer veriler aynı) hesaplanan kurumlar vergisi ne olurdu? (5 puan)
  cozum: |
    **(a) İstisna durumu**

    R1 vergi yükü = 270.000 / (1.530.000 + 270.000) = %15. Yasa "en az %15" aradığından sınır değer şartı sağlar.

    | İştirak | Pay (≥%10) | Elde tutma (≥1 yıl) | Vergi yükü (≥%15) | Transfer (beyanname süresi: 25/4/2027) | Sonuç |
    |---|---|---|---|---|---|
    | R1 | %25 evet | 3 yıldan fazla evet | %15 evet | 10/4/2027 evet | 800.000 TL tam istisna |
    | R2 | %15 evet | 15/9/2025 – 20/6/2026 yaklaşık 9 ay, hayır | %10 hayır | 2026'da evet | İstisna yok (pay %20'nin altında olduğundan 11257 sayılı Karar da uygulanmaz) |
    | R3 | %60 | -- | %5 (genel şartlar sağlanmıyor) | 15/4/2027 evet | Üçüncü paragraf: pay en az %20 ve süresinde transfer şartıyla diğer şartlar aranmaksızın %80 istisna = 800.000 TL |

    İstisna toplamı = 800.000 + 800.000 = 1.600.000 TL.

    **(b) Matrah ve vergi**

    Matrah = 6.000.000 + 400.000 - 1.600.000 = **4.800.000 TL**; KV = 4.800.000 x %25 = **1.200.000 TL**.

    **(c) Asgari kurumlar vergisi**

    Md. 32/C'ye göre indirim ve istisnalar düşülmeden önceki kurum kazancı = 6.000.000 + 400.000 = 6.400.000 TL. Asgari vergiden düşülecek istisnalar arasında 5/1-(b) bendi yoktur; dolayısıyla yurt dışı iştirak kazançları düşülmez. Asgari vergi = 6.400.000 x %10 = 640.000 TL. Hesaplanan vergi (1.200.000) bundan az olmadığından **ödenecek KV 1.200.000 TL**'dir.

    **(d) R1 geç transfer**

    R1'in transferi 25/4/2027'den sonra yapıldığından 4. şart sağlanmaz; istisna uygulanmaz. İstisna = 800.000 TL (yalnız R3). Matrah = 6.400.000 - 800.000 = 5.600.000; KV = 5.600.000 x %25 = **1.400.000 TL**.

    Püf noktaları: (1) Vergi yükünde payda, vergi sonrası dağıtılabilir kazanç ile verginin toplamıdır; yalnız dağıtılabilir kazanca bölmeyin. (2) Pay oranı ve bir yıllık süre ayrı ayrı aranır. (3) Asgari vergi matrahında yurt dışı iştirak istisnası düşülmez.
  puanlama:
  - {olcut: "(a) R1 vergi yükünün doğru hesabı ve istisna şartlarının değerlendirilmesi", puan: 4}
  - {olcut: "(a) R2 ve R3 için doğru sonuç ve %80 oranı", puan: 4}
  - {olcut: "(b) Matrah ve hesaplanan KV", puan: 6}
  - {olcut: "(c) Asgari KV matrahı ve karşılaştırma", puan: 5}
  - {olcut: "(d) Geç transferin sonucu ve KV", puan: 5}
  kaynaklar:
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-b (1 ve 2 numaralı şartlar), alinti: '1) İştirak payını elinde tutan şirketin, yurt dışı iştirakin ödenmiş sermayesinin en az % 10’una sahip olması, 2) Kazancın elde edildiği tarih itibarıyla iştirak payının kesintisiz olarak en az bir yıl süreyle elde tutulması'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-b (3 numaralı şart), alinti: '3) Yurt dışı iştirak kazancının kâr payı dağıtımına kaynak olan kazançlar üzerinden ödenen vergiler dahil iştirak edilen kurumun faaliyette bulunduğu ülke vergi kanunları uyarınca en az % 15 oranında gelir ve kurumlar vergisi benzeri toplam vergi yükü taşıması;'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-b (vergi yükü), alinti: 'dönemde tahakkuk eden ve kâr payı dağıtımına kaynak olan kazançlar üzerinden ödenen vergiler dahil olmak üzere toplam gelir ve kurumlar vergisi benzeri verginin, bu dönemde elde edilen toplam dağıtılabilir kurum kazancı ile tahakkuk eden gelir ve kurumlar vergisi toplamına oranlanması suretiyle tespit edilir.'}
  - {mevzuat: 11257 sayılı Cumhurbaşkanı Kararı, madde: md. 2/1, alinti: '(1) 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanununun 5 inci maddesinin birinci fıkrasının (b) bendinin üçüncü paragrafı uyarınca uygulanacak istisna oranı, yurt dışı iştirakin ödenmiş sermayesinin en az %20''sine sahip olunması durumunda %80 olarak belirlenmiştir.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 32/C/1-2, alinti: '(1) 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz. (2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri'}
  dogrulama:
    python: |
      yuk = 270000 / (1530000 + 270000)
      istisna = 800000 + 800000
      matrah = 6000000 + 400000 - istisna
      kv = matrah * 0.25
      asgari = (6000000 + 400000) * 0.10
      odenecek = max(kv, asgari)
      kv_d = (6000000 + 400000 - 800000) * 0.25
      sonuc = {"a": istisna, "b": kv, "c": odenecek, "d": kv_d}
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: true, yil: 2026}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
- id: TASLAK
  sinav: ymm
  ders: REV
  konu: IST
  kazanimlar:
  - taşınmaz ve iştirak hissesi satış istisnası
  - asgari kurumlar vergisi kontrolü
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Deniz Gıda A.Ş. (menkul kıymet ticaretiyle uğraşmamaktadır; hesap dönemi takvim yılıdır) 2026 yılında tam mükellef iki anonim şirketin paylarını satmıştır. 2026 ticari bilanço kârı 8.000.000 TL olup bu tutara aşağıdaki satış kazançları dahildir; kanunen kabul edilmeyen giderler 300.000 TL'dir. Başka indirim, istisna veya geçmiş yıl zararı yoktur.

    | Pay | Edinme tarihi | Satış tarihi | Satış kazancı (TL) | Satış bedelinin tahsili |
    |---|---|---|---|---|
    | Z A.Ş. | 10/3/2023 | 15/5/2026 | 4.000.000 | Toplam bedel 9.000.000 TL; 4.500.000 TL satış günü, 4.500.000 TL 20/11/2028'de |
    | Y A.Ş. | 20/8/2024 | 3/7/2026 | 1.000.000 | Peşin |

    Pay satış kazançları için Cumhurbaşkanı Kararı ile belirlenen güncel istisna oranı uygulanacaktır. Kurumlar vergisi oranı %25'tir.

    **İstenenler:**

    (a) Her satış için istisna durumunu gerekçesiyle belirleyerek istisna tutarını hesaplayınız. (6 puan)

    (b) 2026 yılı kurumlar vergisi matrahını, hesaplanan kurumlar vergisini ve yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız. (5 puan)

    (c) İstisna kazancın izlenmesi gereken hesabı, tutarını ve süresini belirtiniz; bu tutardan 2029 yılında 800.000 TL'nin kâr dağıtımında kullanılması hâlinde ziyaa uğramış sayılan vergiyi bulunuz. (7 puan)

    (d) Z A.Ş. payları satış bedelinin ikinci taksiti 12/2/2029'da tahsil edilseydi hangi tutar için ne kadar verginin ziyaa uğramış sayılacağını hesaplayınız. (6 puan)
  cozum: |
    **(a) İstisna durumu**

    Md. 5/1-(e) iştirak hisselerinin en az iki tam yıl aktifte kalmasını arar; istisna oranı 9160 sayılı Karar ile %50'dir.

    | Pay | Elde tutma süresi | Sonuç | İstisna |
    |---|---|---|---|
    | Z A.Ş. | 10/3/2023 - 15/5/2026 (2 tam yıl dolmuştur) | İstisna uygulanır | 4.000.000 x %50 = 2.000.000 TL |
    | Y A.Ş. | 20/8/2024 - 3/7/2026 (2 tam yıl dolmamıştır) | İstisna yok | 0 |

    **(b) Matrah ve asgari vergi**

    Matrah = 8.000.000 + 300.000 - 2.000.000 = **6.300.000 TL**; KV = 6.300.000 x %25 = **1.575.000 TL**.
    Asgari vergi: md. 32/C(2)'de düşülecek istisnalar arasında 5/1-(e) bulunmadığından kurum kazancı 8.300.000 TL kalır; %10'u 830.000 TL'dir. Hesaplanan vergi daha yüksek olduğundan **1.575.000 TL** ödenir.

    **(c) Özel fon hesabı**

    İstisna edilen 2.000.000 TL pasifte özel fon hesabında, satışın yapıldığı yılı (2026) izleyen beşinci yılın sonuna, yani **31/12/2031**'e kadar tutulur. 2029'da (beş yıl içinde) 800.000 TL'nin sermayeye ilave dışında başka hesaba nakledilmesi (kâr dağıtımı) hâlinde bu kısım için zamanında tahakkuk ettirilmeyen vergi ziyaa uğramış sayılır: 800.000 x %25 = **200.000 TL**.

    **(d) Geç tahsilat**

    Bedelin satış yılını izleyen ikinci takvim yılının (2028) sonuna kadar tahsili şarttır. İkinci taksit 2029'da tahsil edildiğinden, tahsil edilmeyen bedele (4.500.000 / 9.000.000 = %50) isabet eden istisna ziyaa uğrar: 2.000.000 x 4.500.000 / 9.000.000 = 1.000.000 TL; vergi = 1.000.000 x %25 = **250.000 TL**.

    Püf noktaları: (1) İstisna oranı kanun metnindeki %75 değil, yürürlükteki Karar'daki %50'dir. (2) "İki tam yıl" günü gününe sayılır; 20/8/2024 tarihli payda süre 20/8/2026'da dolacaktı. (3) Asgari vergide (e) bendi istisnası düşülmez.
  puanlama:
  - {olcut: "(a) İki tam yıl şartının ve Karar'daki %50 oranının uygulanması", puan: 6}
  - {olcut: "(b) Matrah ve hesaplanan KV", puan: 3}
  - {olcut: "(b) Asgari KV karşılaştırması", puan: 2}
  - {olcut: "(c) Özel fon hesabı, süre (31/12/2031) ve 200.000 TL ziyaa uğrayan vergi", puan: 7}
  - {olcut: "(d) İkinci takvim yılı şartı ve 250.000 TL hesabı", puan: 6}
  kaynaklar:
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-e (birinci paragraf), alinti: '(Değişik birinci cümle: 28/11/2017-7061/89 md.) Kurumların, en az iki tam yıl süreyle aktiflerinde yer alan iştirak hisseleri ile aynı süreyle sahip oldukları kurucu senetleri, intifa senetleri, rüçhan hakları ve bu fıkranın (a) bendi kapsamında istisna kazançlarına kaynak oluşturan yatırım fonlarının katılma paylarının satışından doğan kazançların %75’lik kısmı.'}
  - {mevzuat: 9160 sayılı Cumhurbaşkanı Kararı, madde: md. 1, alinti: '(1) 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanununun 5 inci maddesinin birinci fıkrasının (e) bendi uyarınca uygulanacak istisna oranı %50 olarak belirlenmiştir.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-e (fon ve tahsil şartı), alinti: 'Bu istisna, satışın yapıldığı dönemde uygulanır ve satış kazancının istisnadan yararlanan kısmı satışın yapıldığı yılı izleyen beşinci yılın sonuna kadar pasifte özel bir fon hesabında tutulur. Ancak satış bedelinin, satışın yapıldığı yılı izleyen ikinci takvim yılının sonuna kadar tahsil edilmesi şarttır. Bu süre içinde tahsil edilmeyen satış bedeline isabet eden istisna nedeniyle zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-e (beş yıl kuralı), alinti: 'İstisna edilen kazançtan beş yıl içinde sermayeye ilave dışında herhangi bir şekilde başka bir hesaba nakledilen veya işletmeden çekilen ya da dar mükellef kurumlarca ana merkeze aktarılan kısım için uygulanan istisna dolayısıyla zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır. Aynı süre içinde işletmenin tasfiyesi (bu Kanuna göre yapılan devir ve bölünmeler hariç) halinde de bu hüküm uygulanır.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 32/C/2-a, alinti: '(2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri'}
  dogrulama:
    python: |
      istisna = 4000000 * 0.5
      matrah = 8000000 + 300000 - istisna
      kv = matrah * 0.25
      asgari = (8000000 + 300000) * 0.10
      ziyaa_c = 800000 * 0.25
      ziyaa_d = istisna * 4500000 / 9000000 * 0.25
      sonuc = {"a": istisna, "b": kv, "c": ziyaa_c, "d": ziyaa_d}
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: true, yil: 2026}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
- id: TASLAK
  sinav: ymm
  ders: REV
  konu: IST
  kazanimlar:
  - emisyon primi ve diğer KVK md.5 istisnaları
  - geçmiş yıl zararları
  - asgari kurumlar vergisi
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Atlas Mühendislik A.Ş. 2026 yılında sermayesini artırmış; itibari değeri 1 TL olan 1.000.000 adet payı 3 TL bedelle çıkarmıştır. Ödenen bedelin itibari değeri aşan kısmı gelir tablosunda gelir olarak izlenmiş ve ticari bilanço kârına dahil edilmiştir. Şirketin 2026 ticari bilanço kârı 9.000.000 TL, kanunen kabul edilmeyen giderleri 600.000 TL'dir. Şirketin geçmiş yıl kurumlar vergisi beyannamelerinde (her yıl ayrı gösterilmiş olarak) yer alan zararları şunlardır:

    | Zarar yılı | Tutar (TL) |
    |---|---|
    | 2020 | 1.500.000 |
    | 2021 | 2.500.000 |
    | 2023 | 3.000.000 |

    Başka istisna veya indirim yoktur. Şirket yıllardır faaliyettedir; kurumlar vergisi oranı %25'tir.

    **İstenenler:**

    (a) Sermaye artırımından doğan kazancın vergisel durumunu ve istisna tutarını belirtiniz. (4 puan)

    (b) Hangi yıl zararlarının 2026'da indirilebileceğini gerekçesiyle belirleyerek matrahı ve hesaplanan kurumlar vergisini bulunuz. (8 puan)

    (c) Yurt içi asgari kurumlar vergisini hesaplayarak ödenecek kurumlar vergisini belirleyiniz. (6 puan)

    (d) Şirket ilk defa 2025 yılında faaliyete başlamış bir kurum olsaydı (zarar mahsubu bulunmadığı varsayımıyla, diğer veriler aynı) 2026 için ödenecek kurumlar vergisi ne olurdu? (6 puan)
  cozum: |
    **(a)** Anonim şirketlerin sermayelerini artırdıkları sırada çıkardıkları payların bedelinin itibari değeri aşan kısmı (emisyon primi) md. 5/1-(ç) uyarınca istisnadır: 1.000.000 x (3 - 1) = **2.000.000 TL**.

    **(b)** Md. 9/1-(a) zararların beş yıldan fazla nakledilmemesini arar. 2020 zararı 2021-2025 dönemlerinde indirilebilirdi; 2026'da beş yıl aşıldığından indirilemez. 2021 zararı 2022-2026 arasında indirilebilir (son yıl 2026), 2023 zararı da indirilebilir.

    | Kalem | TL |
    |---|---|
    | Ticari bilanço kârı | 9.000.000 |
    | + KKEG | 600.000 |
    | - Emisyon primi istisnası | (2.000.000) |
    | - 2021 zararı | (2.500.000) |
    | - 2023 zararı | (3.000.000) |
    | **Matrah** | **2.100.000** |

    Hesaplanan KV = 2.100.000 x %25 = **525.000 TL**. (2020 zararı 1.500.000 TL indirilemez.)

    **(c)** Md. 32/C'ye göre asgari vergi, indirim ve istisnalar düşülmeden önceki kurum kazancının (ticari kâr + KKEG = 9.600.000 TL) %10'undan az olamaz. Asgari vergi hesabında 5/1-(ç) istisnası düşülür; geçmiş yıl zararı düşülmez: (9.600.000 - 2.000.000) x %10 = 760.000 TL. Hesaplanan vergi (525.000) asgari vergiden az olduğundan **760.000 TL** ödenir.

    **(d)** İlk defa faaliyete başlayan kurumlara, faaliyete başlanılan hesap döneminden itibaren üç hesap dönemi boyunca md. 32/C uygulanmaz. 2025 başlangıçlı kurum için 2026 bu süre içindedir. Matrah = 9.600.000 - 2.000.000 = 7.600.000; KV = **1.900.000 TL**.

    Püf noktaları: (1) Beş yıl "zarar yılını izleyen" beş dönemdir; 2020 zararı için son yıl 2025'tir. (2) Asgari vergide zarar mahsubu düşülmez, yalnız sayılan istisnalar düşülür. (3) İlk üç yılda asgari vergi hiç uygulanmaz.
  puanlama:
  - {olcut: "(a) Emisyon primi istisnası ve 2.000.000 TL", puan: 4}
  - {olcut: "(b) Beş yıl kuralının uygulanarak 2020 zararının dışlanması", puan: 4}
  - {olcut: "(b) Matrah ve hesaplanan KV", puan: 4}
  - {olcut: "(c) Asgari KV matrahı, oranı ve ödenecek tutar", puan: 6}
  - {olcut: "(d) İlk faaliyet dönemi istisnası ve KV", puan: 6}
  kaynaklar:
