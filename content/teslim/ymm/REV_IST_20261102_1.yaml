  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-i (ikinci ve üçüncü paragraf), alinti: 'Bu risturnların ortaklara dağıtımı, kâr dağıtımı sayılmaz. Risturnun nakden veya aynı değerde mal ile ödenmesi istisnanın uygulanmasına engel değildir. Ortaklardan başka kimselerle yapılan işlemlerden doğan kazançlar ile ortaklarla ortaklık statüsü dışında yapılan işlemlerden doğan kazançlar hakkında risturnlara ilişkin istisna hükmü uygulanmaz. Bunların genel kazançtan ayrılmasında, ortaklarla yapılan iş hacminin genel iş hacmine olan oranı esas alınır.'}
