  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 9/1-a, alinti: 'a) Beş yıldan fazla nakledilmemek şartıyla geçmiş yılların beyannamelerinde yer alan zararlar.'}
