  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-b (finans ve sigorta iştirakleri), alinti: 'iştirak edilen şirketin esas faaliyet konusunun, finansal kiralama dahil finansman temini veya sigorta hizmetlerinin sunulması ya da menkul kıymet yatırımı olması durumunda, iştirak edilen kurumun faaliyette bulunduğu ülke vergi kanunları uyarınca en az Türkiye’de uygulanan kurumlar vergisi oranında gelir ve kurumlar vergisi benzeri toplam vergi yükü taşıması,'}
