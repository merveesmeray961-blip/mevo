    | İştirak | Esas faaliyet | Pay oranı | Toplam vergi yükü | Kâr payı (TL) |
    |---|---|---|---|---|
    | Lüksemburg S.A. | Menkul kıymet yatırımı | %15 | %20 | 700.000 |
    | Malta Ltd. | Sigorta hizmetlerinin sunulması | %12 | %35 | 600.000 |
    | Polonya Sp. z o.o. | Üretim | %10 | Kaynak dönemde ödenen vergi 285.000 TL; vergi sonrası dağıtılabilir kazanç 1.215.000 TL | 900.000 |
    | Romanya SRL | Üretim | %9 | %22 | 400.000 |

    2026 ticari bilanço kârı 7.000.000 TL (kâr payları dahil), kanunen kabul edilmeyen giderler 300.000 TL'dir. Başka istisna veya indirim yoktur. Kurumlar vergisi oranı %25'tir.

    **İstenenler:**

    (a) Polonya iştirakinin toplam vergi yükünü hesaplayınız. (3 puan)

    (b) Her iştirak kazancının istisna durumunu gerekçesiyle belirleyiniz. (8 puan)

    (c) Kurumlar vergisi matrahını, hesaplanan kurumlar vergisini ve yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız. (7 puan)

    (d) Lüksemburg iştirakinin toplam vergi yükü %25 olsaydı (diğer veriler aynı) hesaplanan kurumlar vergisi ne olurdu? (6 puan)
  cozum: |
    **(a)** Polonya vergi yükü = 285.000 / (1.215.000 + 285.000) = 285.000 / 1.500.000 = **%19**.

    **(b)** Md. 5/1-(b): pay oranı en az %10, elde tutma en az bir yıl, toplam vergi yükü en az %15; ancak esas faaliyet konusu finansman temini, sigorta hizmeti veya menkul kıymet yatırımı olan iştiraklerde vergi yükü en az Türkiye'de uygulanan kurumlar vergisi oranı (%25) olmalıdır; kazanç beyanname süresine kadar transfer edilmelidir. Hiçbir iştirakte pay oranı %20'ye ulaşmadığından Cumhurbaşkanı Kararı'ndaki %80'lik hüküm uygulanmaz.

    | İştirak | Pay | Vergi yükü ölçütü | Sonuç | İstisna (TL) |
    |---|---|---|---|---|
    | Lüksemburg | %15 (>=%10) | Menkul kıymet yatırımı: en az %25 gerekir; %20 yetersiz | İstisna yok | 0 |
    | Malta | %12 | Sigorta: en az %25; %35 yeterli | İstisna | 600.000 |
    | Polonya | %10 | Genel: en az %15; %19 yeterli | İstisna | 900.000 |
    | Romanya | %9 (<%10) | Pay oranı yetersiz | İstisna yok | 0 |

    **(c)** Matrah = 7.000.000 + 300.000 - 1.500.000 = **5.800.000 TL**; KV = **1.450.000 TL**. Asgari vergide (b) bendi istisnası düşülmediğinden kurum kazancı 7.300.000, %10 = 730.000 TL; hesaplanan vergi fazla olduğundan ödenecek KV 1.450.000 TL'dir.

    **(d)** Lüksemburg iştirakinin vergi yükü %25 olursa finans/yatırım ölçütü sağlanır; 700.000 TL daha istisna olur. İstisna = 2.200.000; matrah = 7.300.000 - 2.200.000 = 5.100.000; KV = **1.275.000 TL**.

    Püf noktaları: (1) Finans, sigorta ve menkul kıymet yatırımı yapan iştiraklerde eşik %15 değil, Türkiye'deki kurumlar vergisi oranıdır. (2) Pay oranı %10'un altında kalırsa diğer şartlar sağlansa da istisna yoktur. (3) Vergi yükünün paydasına ödenen vergi de eklenir.
