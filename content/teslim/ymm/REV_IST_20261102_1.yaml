  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 5/1-e, alinti: '(Değişik birinci cümle: 28/11/2017-7061/89 md.) Kurumların, en az iki tam yıl süreyle aktiflerinde yer alan iştirak hisseleri ile aynı süreyle sahip oldukları kurucu senetleri, intifa senetleri, rüçhan hakları ve bu fıkranın (a) bendi kapsamında istisna kazançlarına kaynak oluşturan yatırım fonlarının katılma paylarının satışından doğan kazançların %75’lik kısmı.'}
  - {mevzuat: 9160 sayılı Cumhurbaşkanı Kararı, madde: md. 1, alinti: '(1) 13/6/2006 tarihli ve 5520 sayılı Kurumlar Vergisi Kanununun 5 inci maddesinin birinci fıkrasının (e) bendi uyarınca uygulanacak istisna oranı %50 olarak belirlenmiştir.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 32/C/1-2-a, alinti: '(1) 32 nci ve 32/A maddeleri hükümleri dikkate alınarak hesaplanan kurumlar vergisi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10’undan az olamaz. (2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri'}
  dogrulama:
    python: |
      oran = 72000000 / (120000000 - 20000000)
      ist = 5000000 * 0.5 + 2000000 * 0.5
      matrah = 12000000 + 400000 - ist
      kv = matrah * 0.25
      asgari = (12000000 + 400000) * 0.10
      oran_d = 76000000 / 100000000
      kv_d = (12000000 + 400000 - 5000000 - 2000000 * 0.5) * 0.25
      sonuc = {"a": oran, "b": kv, "c": max(kv, asgari), "d": kv_d}
