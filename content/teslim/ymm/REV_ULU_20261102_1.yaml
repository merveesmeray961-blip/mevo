- id: TASLAK
  sinav: ymm
  ders: REV
  konu: ULU
  kazanimlar:
  - KVK md.30 vergi kesintisi
  - gayrimaddî hak satışında vergi kesintisi ve üstlenilen vergi
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Türk Gıda A.Ş., Türkiye'de iş yeri veya daimî temsilcisi bulunmayan İtalyan Spa (dar mükellef kurum) ile 2026 yılında şu işlemleri yapmıştır:

    | İşlem | Tutar |
    |---|---|
    | Marka satın alma | Spa'ya net 2.000.000 TL ödenecektir; Türk Gıda, kesilecek vergiyi üstlenmiştir. |
    | Türkiye'de verilen hukuki danışmanlık (serbest meslek) hizmeti | 300.000 TL (brüt) |
    | Türk Gıda'nın İtalya'da yerleşik bir bankadan kullandığı krediye ilişkin ödediği faiz | 150.000 TL |

    Vergi kesinti oranlarında 2009/14593 sayılı Karar'daki oranlar esas alınacaktır.

    **İstenenler:**

    (a) Marka bedeli için kesinti matrahını ve kurumlar vergisi kesintisini hesaplayınız. (8 puan)

    (b) Danışmanlık hizmeti ve banka kredi faizi için kesintileri belirleyiniz. (6 puan)

    (c) Toplam kesinti tutarını bulunuz. (4 puan)

    (d) Türk Gıda kesinti vergisini üstlenmeseydi Spa'ya fiilen ödenecek tutar ne olurdu? (6 puan)
  cozum: |
    **(a)** Md. 30/2: gayrimaddî hakların satışı, devri ve temliki karşılığında ödenen bedeller üzerinden kurumlar vergisi kesintisi yapılır; oran 2009/14593 sayılı Karar'a göre %20'dir. Md. 30/11'e göre kesilecek verginin ödemeyi yapan tarafından üstlenilmesi hâlinde kesinti, ödenen tutar ile yüklenilen verginin toplamı üzerinden hesaplanır (gross-up):

    Brüt tutar = 2.000.000 / (1 - 0,20) = **2.500.000 TL**; kesinti = 2.500.000 x %20 = **500.000 TL** (net 2.000.000 + vergi 500.000).

    **(b)** Serbest meslek kazançlarında (petrol arama dışında) oran %20: 300.000 x %20 = **60.000 TL**. Yabancı bankalardan alınan krediler için ödenen faizlerde oran %0 olduğundan 150.000 TL faiz için **kesinti yoktur**. 

    **(c)** Toplam kesinti = 500.000 + 60.000 + 0 = **560.000 TL**.

    **(d)** Vergi üstlenilmeseydi brüt 2.000.000 olurdu: kesinti = 2.000.000 x %20 = 400.000; Spa'ya ödenecek tutar = 2.000.000 - 400.000 = **1.600.000 TL**.

    Püf noktaları: (1) Kanundaki %15 yerine Karar'daki oran (%20) uygulanır. (2) Vergiyi üstlenen ödeyici brütleştirme yapar. (3) Yabancı banka kredi faizinde kesinti oranı sıfırdır.
  puanlama:
  - {olcut: "(a) Doğru oran (%20) ve brütleştirme", puan: 5}
  - {olcut: "(a) Brüt tutar ve kesinti tutarı", puan: 3}
  - {olcut: "(b) Serbest meslek kesintisi (60.000) ve faizde %0", puan: 6}
  - {olcut: "(c) Toplam kesinti", puan: 4}
  - {olcut: "(d) Üstlenilmeme hâlinde net ödeme", puan: 6}
  kaynaklar:
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 30/2, alinti: '(2) Ticarî veya ziraî kazanca dahil olup olmadığına bakılmaksızın telif, imtiyaz, ihtira, işletme, ticaret unvanı, marka ve benzeri gayrimaddî hakların satışı, devir ve temliki karşılığında nakden veya hesaben ödenen veya tahakkuk ettirilen bedeller üzerinden bu maddenin birinci fıkrasında belirtilen kişilerce % 15 oranında kurumlar vergisi kesintisi'}
  - {mevzuat: 2009/14593 sayılı Bakanlar Kurulu Kararı, madde: md. 1/11, alinti: 'Ticari veya zirai kazanca dahil olup olmadığına bakılmaksızın telif, imtiyaz, ihtira, işletme, ticaret unvanı, marka ve benzeri gayrimaddi hakların satışı, devir ve temliki karşılığında nakden veya hesaben ödenen veya tahakkuk ettirilen bedeller üzerinden % 20,'}
  - {mevzuat: 2009/14593 sayılı Bakanlar Kurulu Kararı, madde: md. 1/2, alinti: 'Serbest meslek kazançlarından; a) Petrol arama faaliyetleri dolayısıyla sağlanacak kazançlardan % 5, b) Diğerlerinden % 20,'}
  - {mevzuat: 2009/14593 sayılı Bakanlar Kurulu Kararı, madde: md. 1/5-a, alinti: 'Yabancı devletler, uluslararası kurumlar veya yabancı bankalardan ya da bulunduğu ülkede mutad olarak kredi vermeye yetkilendirilmiş olup sadece ilişkili bulunduğu kurumlara değil tüm gerçek ve tüzel kişilere kredi veren kurumlardan alınan her türlü krediler için ödenecek faizlerden (katılım bankalarının kendi usullerine göre yurt dışından sağladıkları fonlar ve benzeri kaynaklar için ödedikleri kâr payları dahil) % 0,'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 30/11, alinti: '(11) Yapılacak vergi kesintisinde kazanç ve iratlar gayrisafi tutarları üzerinden dikkate alınır. Kesilmesi gereken verginin ödemeyi yapan tarafından üstlenilmesi halinde vergi kesintisi, fiilen ödenen tutar ile ödemeyi yapanın yüklendiği verginin toplamı üzerinden hesaplanır.'}
  dogrulama:
    python: |
      brut = 2000000 / (1 - 0.20)
      k1 = brut * 0.20
      k2 = 300000 * 0.20
      sonuc = {"a": k1, "b": k2, "c": k1 + k2, "d": 2000000 - 2000000 * 0.20}
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: true, yil: 2026}
