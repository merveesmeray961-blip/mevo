  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 33/4, alinti: '(4) Yurt dışı kazançlar üzerinden Türkiye’de tarh olunacak vergilere mahsup edilebilecek tutar, hiç bir surette yurt dışında elde edilen kazançlara Kanunun 32 nci maddesinde belirtilen kurumlar vergisi oranının uygulanmasıyla bulunacak tutardan fazla olamaz.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 33/4 (devir), alinti: 'Bu sınır dahilinde, ilgili bulunduğu kazancın Türkiye’de genel sonuç hesaplarına intikal ettirildiği hesap döneminde tamamen veya kısmen indirilemeyen vergiler, bu dönemi izleyen üçüncü hesap dönemi sonuna kadar indirim konusu yapılabilir.'}
