- id: TASLAK
  sinav: ymm
  ders: REV
  konu: ULU
  kazanimlar:
  - dar mükellef kurumların vergilendirilmesi
  - KVK md.30 vergi kesintisi (ana merkeze aktarılan kâr)
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Hansa GmbH'nin (kanunî ve iş merkezi Almanya'dadır) Türkiye'deki şubesi 2026 hesap döneminde (takvim yılı) faaliyet göstermiştir. Şube 2026 ticari bilanço kârını 7.000.000 TL bulmuştur. Bu kâr hesaplanırken şu giderler indirilmiştir: (i) ana merkeze, şubenin işletmede kullandığı ana merkez kaynaklı borç için ödenen faiz 600.000 TL; (ii) ana merkezin zararlarına katılmak üzere ayrılan pay 400.000 TL. Bunlar dışındaki kanunen kabul edilmeyen giderler 200.000 TL'dir. Başka istisna veya indirim yoktur; kurumlar vergisi oranı %25'tir.

    Şube, hesaplanan kurumlar vergisi düşüldükten sonra kalan kazançtan 5.000.000 TL'yi ana merkeze aktarmıştır. Bu aktarım için vergi kesintisi oranı olarak ilgili Karar'daki oran uygulanacaktır.

    **İstenenler:**

    (a) Şubenin 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; (i) ve (ii) numaralı giderlerin işlemini gerekçesiyle açıklayınız. (8 puan)

    (b) Ana merkeze aktarılan tutar üzerinden yapılacak vergi kesintisini hesaplayınız. (5 puan)

    (c) Yıllık kurumlar vergisi beyannamesinin verileceği süreyi ve verginin ödeneceği son günü belirtiniz. (5 puan)

    (d) Aktarılan tutar 7.000.000 TL olsaydı vergi kesintisi kaç TL olurdu? (6 puan)
  cozum: |
    **(a)** Md. 22/3: dar mükellefiyette (a) ana merkeze veya Türkiye dışındaki şubelere verilen faiz, komisyon ve benzerleri ile (b) ana merkezin veya yurt dışı şubelerin genel yönetim giderlerine veya zararlarına katılmak üzere ayrılan paylar kurum kazancının tespitinde indirilemez. Bu nedenle 600.000 + 400.000 TL kâra eklenir.

    | Kalem | TL |
    |---|---|
    | Ticari bilanço kârı | 7.000.000 |
    | + Ana merkeze faiz | 600.000 |
    | + Zarara katılma payı | 400.000 |
    | + Diğer KKEG | 200.000 |
    | **Matrah** | **8.200.000** |

    KV = 8.200.000 x %25 = **2.050.000 TL**.

    **(b)** KV düşüldükten sonra kalan = 8.200.000 - 2.050.000 = 6.150.000 TL. Ana merkeze aktarılan 5.000.000 TL bu tutarı aşmadığından kesinti: 5.000.000 x %15 = **750.000 TL**.

    **(c)** Beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın (Nisan 2027) 1'inden 25'inci günü akşamına kadar verilir; vergi beyannamenin verildiği ayın sonuna kadar, yani en geç **30/4/2027**'de ödenir.

    **(d)** Kesinti, hesaplanan kurumlar vergisi düşüldükten sonra kalan kısımdan aktarılan tutar üzerinden yapıldığından matrah en çok 6.150.000 TL'dir: 6.150.000 x %15 = **922.500 TL**.

    Püf noktaları: (1) Ana merkeze faiz ve zarara katılma payı dar mükellefiyette gider yazılamaz. (2) Stopaj matrahı vergi sonrası kalan kazançla sınırlıdır. (3) Ödeme son günü ay sonudur, 25'i değil.
  puanlama:
  - {olcut: "(a) Md. 22/3 gereği iki giderin kâra eklenmesi", puan: 4}
  - {olcut: "(a) Matrah ve KV", puan: 4}
  - {olcut: "(b) %15 kesinti ve 750.000 TL", puan: 5}
  - {olcut: "(c) Beyan süresi (1-25 Nisan) ve ödeme son günü (30/4/2027)", puan: 5}
  - {olcut: "(d) Kalan kazançla sınırlı stopaj matrahı ve 922.500 TL", puan: 6}
  kaynaklar:
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 22/3-a, alinti: 'a) Bu kurumlar hesabına yaptıkları alım-satımlar için ana merkeze veya Türkiye dışındaki şubelere verilen faizler, komisyonlar ve benzerleri.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 22/3-b, alinti: 'b) Türkiye’deki kurumun kazancının elde edilmesi ve idamesi ile ilgili olan ve emsallere uygunluk ilkesi uyarınca belirlenecek dağıtım anahtarlarına göre ayrılan paylar ile Türkiye’deki kurumun denetimi için yabancı ülkelerden gönderilen yetkili kişilerin seyahat giderleri hariç olmak üzere, ana merkezin veya Türkiye dışındaki şubelerin genel yönetim giderlerine veya zararlarına katılmak üzere ayrılan paylar.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 30/6, alinti: '(6) Yıllık veya özel beyanname veren dar mükellef kurumların, indirim ve istisnalar düşülmeden önceki kurum kazancından, hesaplanan kurumlar vergisi düşüldükten sonra kalan kısımdan ana merkeze aktardıkları tutar üzerinden, kurum bünyesinde % 15 oranında kurumlar vergisi kesintisi yapılır.'}
  - {mevzuat: 2009/14593 sayılı Bakanlar Kurulu Kararı, madde: md. 1/14, alinti: 'Yıllık veya özel beyanname veren dar mükellef kurumların, indirim ve istisnalar düşülmeden önceki kurum kazancından, hesaplanan kurumlar vergisi düşüldükten sonra kalan kısımdan ana merkeze aktardıkları tutar üzerinden % 15.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 25/5, alinti: '(5) Beyanname, hesap döneminin kapandığı ayı izleyen dördüncü ayın birinci gününden yirmibeşinci günü akşamına kadar,'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 29/1-a, alinti: 'a) Yıllık beyanname ile bildirilenlerde beyannamenin verildiği ayın sonuna kadar,'}
  dogrulama:
    python: |
      matrah = 7000000 + 600000 + 400000 + 200000
      kv = matrah * 0.25
      kalan = matrah - kv
      stopaj = min(5000000, kalan) * 0.15
      stopaj_d = min(7000000, kalan) * 0.15
      sonuc = {"a": kv, "b": stopaj, "d": stopaj_d}
  gecerlilik: {baslangic: '2026-01-01', bitis: null, yila_bagli_tutar: true, yil: 2026}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
- id: TASLAK
  sinav: ymm
  ders: REV
  konu: ULU
  kazanimlar:
  - KDVK md.9 sorumlu sıfatıyla KDV
  - yurt dışı hizmet alımı
  zorluk: 2
  puan: 22
  sure_dk: 28
  soru: |
    **Olay:** Mavi Enerji A.Ş. (KDV mükellefi, Türkiye'de enerji santrali işletmektedir) 2026 yılında Almanya'da yerleşik, Türkiye'de ikametgâhı, işyeri, kanunî merkezi ve iş merkezi bulunmayan Klar GmbH'den şu hizmetleri almıştır. İlgili hizmetlere uygulanacak KDV oranı %20'dir; kur 1 EUR = 40 TL alınacaktır.

    | Hizmet | Bedel (EUR) | Açıklama |
    |---|---|---|
    | H1 | 50.000 | Türkiye'deki santralin işletilmesine ilişkin olarak yurt dışından verilen danışmanlık hizmeti |
    | H2 | 30.000 | Yalnız Mavi Enerji'nin Gürcistan'daki iştirakinin yatırım kararı için yurt dışında verilen ve yurt dışında faydalanılan danışmanlık hizmeti |

    **İstenenler:**

    (a) H1 için KDV'nin kim tarafından, hangi sıfatla ve hangi beyannameyle beyan edileceğini açıklayarak KDV tutarını hesaplayınız. (7 puan)

    (b) H2 için KDV durumunu gerekçesiyle belirtiniz. (5 puan)

    (c) H1 nedeniyle beyan edilen KDV'nin mükellefin KDV hesabındaki sonucunu açıklayınız. (5 puan)

    (d) H1'in, KDV mükellefi olmayan bir sivil toplum kuruluşuna verilmiş olması hâlinde KDV'nin sorumlu sıfatıyla beyan edilip edilmeyeceğini belirtiniz. (5 puan)
  cozum: |
    **(a)** İkametgâhı, işyeri, kanunî ve iş merkezi Türkiye'de bulunmayanların Türkiye'de yaptığı hizmetler ile yurt dışında yapılıp Türkiye'de faydalanılan hizmetler KDV'ye tabidir (md. 1 ve 6/b; KDV GUT). Hizmeti ifa eden yurt dışı firmanın Türkiye'de işyeri bulunmadığından KDV'nin tamamı hizmetten faydalanan yurt içindeki muhatap (Mavi Enerji) tarafından **sorumlu sıfatıyla**, **2 No.lu KDV beyannamesi** ile beyan edilip ödenir.
    Matrah = 50.000 x 40 = 2.000.000 TL; KDV = 2.000.000 x %20 = **400.000 TL**.

    **(b)** H2 yurt dışında yapılmış ve yurt dışında faydalanılmıştır; bu durumda mükellef veya sorumlu sıfatıyla KDV beyan edilmez (KDV = 0).

    **(c)** Md. 29/1-(ç) uyarınca sorumlu sıfatıyla beyan edilerek ödenen KDV mükellef tarafından indirilebilir. Mavi Enerji 400.000 TL'yi sorumlu sıfatıyla ödedikten sonra indirebilir; vergiye tabi işlemleri varsa KDV beyannamesinde indirilecek KDV olarak gösterilir. (Net yük oluşmaz.)

    **(d)** Sorumlu sıfatıyla beyan için hizmetten Türkiye'de faydalanan muhatabın KDV mükellefi olması şart değildir; KDV mükellefi olmayan STK da 2 No.lu beyannameyle 400.000 TL KDV'yi beyan edip öder.

    Püf noktaları: (1) Kriter, hizmeti verenin değil, hizmetten faydalanılan yerdir. (2) Yurt dışında verilip yurt dışında faydalanılan hizmet KDV dışıdır. (3) Sorumlu sıfatıyla ödenen KDV mükellefçe indirilir.
  puanlama:
  - {olcut: "(a) Sorumlu sıfatıyla beyan ve 2 No.lu beyanname", puan: 4}
  - {olcut: "(a) Matrah ve KDV tutarı (400.000)", puan: 3}
  - {olcut: "(b) H2'de KDV doğmaması", puan: 5}
  - {olcut: "(c) İndirim hakkı", puan: 5}
  - {olcut: "(d) Muhatabın mükellef olmasının aranmaması", puan: 5}
  kaynaklar:
  - {mevzuat: 3065 sayılı KDV Genel Uygulama Tebliği, madde: II/A-2.1.2.1.1, alinti: 'Bu gibi hizmet ifalarında mükellef, esas olarak hizmeti ifa eden olmakla birlikte, Türkiye''de ikametgâhı, işyeri, kanuni merkezi ve iş merkezi bulunmadığından, KDV’nin tamamı, hizmetten faydalanan yurt içindeki muhatap tarafından sorumlu sıfatıyla beyan edilip ödenecektir.'}
  - {mevzuat: 3065 sayılı KDV Genel Uygulama Tebliği, madde: II/A-2.1.2.1.1 (yurt dışında faydalanma), alinti: 'Hizmetin vergiden müstesna olması ve hizmetin yurt dışında yapılıp hizmetten yurt dışında faydalanılması halinde, mükellef veya sorumlu sıfatıyla KDV beyan edilmeyecektir.'}
  - {mevzuat: 3065 sayılı KDV Genel Uygulama Tebliği, madde: II/A-2.1.2.1.1 (mükellef olmayan muhatap), alinti: 'KDV’nin sorumlu sıfatıyla beyan edilmesi için hizmetten Türkiye’de faydalanan muhatabın KDV mükellefi olması şart değildir. KDV mükellefiyeti bulunmayanlar da söz konusu hizmetler nedeniyle KDV tevkifatı yaparak 2 No.lu KDV Beyannamesi ile beyan etmek ve ödemek zorundadır.'}
  - {mevzuat: 3065 sayılı KDV Kanunu, madde: md. 29/1-ç, alinti: 'ç) (Ek:27/12/2023-7491/30 md.) Vergi kesintisi yapmakla sorumlu tutulanlar tarafından sorumlu sıfatıyla beyan edilerek ödenen katma değer vergisi,'}
  dogrulama:
    python: |
      matrah = 50000 * 40
      kdv = matrah * 0.20
      sonuc = {"a": kdv, "b": 0}
