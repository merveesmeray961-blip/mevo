- id: TASLAK
  sinav: ymm
  ders: REV
  konu: ULU
  kazanimlar:
  - yurt içinde kesilen vergilerin mahsubu ve iadesi
  - geçici vergi mahsubu
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Olay:** Doruk İnşaat A.Ş. (tam mükellef, hesap dönemi takvim yılı) 2026 yıllık kurumlar vergisi beyannamesinde 6.000.000 TL matrah beyan etmiştir (kurumlar vergisi oranı %25). Beyannamede gösterilen kazançlara ilişkin kaynağında kesilen vergiler şunlardır: mevduat faizi 2.000.000 TL (kesinti oranı %15), birden fazla takvim yılına yaygın bir konut inşaatından kamu dışı bir işverenden alınan 10.000.000 TL hak ediş (md. 15 kapsamında %5 kesinti yapılmıştır) ve devlet tahvili faizi 500.000 TL (kesinti oranı %0). Şirket 2026 yılı için 900.000 TL geçici vergi tahakkuk ettirmiş, ancak bunun yalnız 600.000 TL'sini ödemiştir.

    **İstenenler:**

    (a) Hesaplanan kurumlar vergisini ve kaynağında kesilmiş vergi tutarını bulunuz. (5 puan)

    (b) Mahsup edilebilecek geçici vergi tutarını belirterek yıllık beyanname üzerinden ödenecek kurumlar vergisini hesaplayınız. (8 puan)

    (c) Mahsup edilecek toplam vergi hesaplanan kurumlar vergisinden fazla çıksaydı (kesintiler 1.100.000 TL, ödenen geçici vergi 600.000 TL, KV 1.500.000 TL) farkın akıbetini ve süresini açıklayınız. (7 puan)

    (d) Geçici vergi için ödenmeyen 300.000 TL'nin yıllık beyannamedeki sonucunu belirtiniz. (4 puan)
  cozum: |
    **(a)** KV = 6.000.000 x %25 = **1.500.000 TL**. Kaynağında kesilen vergiler: mevduat faizi 2.000.000 x %15 = 300.000; hak ediş 10.000.000 x %5 = 500.000; devlet tahvili 500.000 x %0 = 0; toplam **800.000 TL**.

    **(b)** Md. 34/1 uyarınca md. 15/1 ve 30/1-2'ye göre kaynağında kesilmiş vergiler beyanname üzerinden hesaplanan KV'den mahsup edilir. Md. 34/4: ilgili hesap dönemine ilişkin tahakkuk ettirilen geçici verginin **sadece ödenen kısmı** yıllık KV'den mahsup edilir: 600.000 TL.

    Ödenecek KV = 1.500.000 - 800.000 - 600.000 = **100.000 TL**.

    **(c)** Mahsup edilecek vergiler (1.100.000 + 600.000 = 1.700.000) KV'den (1.500.000) fazla olduğundan, fark 200.000 TL durum vergi dairesince mükellefe yazı ile bildirilir (md. 34/5); mükellef, yazıyı tebellüğ tarihinden itibaren **bir yıl içinde** başvurursa fark iade edilir; başvurmazsa alacak düşer.

    **(d)** Geçici verginin ödenmeyen 300.000 TL'si yıllık beyannamede mahsup edilmez; yıllık KV ödenecek tutar içinde kalır. (Geçici vergi ödenmemesinin ayrıca vergi cezası ve gecikme zammı sonuçları bu sorunun kapsamı dışındadır.)

    Püf noktaları: (1) Geçici vergiden yalnızca fiilen ödenen kısım mahsup edilir. (2) Kesintisi %0 olan gelirler mahsup tutarını artırmaz. (3) Fazla mahsup tutarı için iade başvuru süresi yazının tebliğinden itibaren bir yıldır.
  puanlama:
  - {olcut: "(a) KV ve kesinti toplamı (800.000)", puan: 5}
  - {olcut: "(b) Yalnız ödenen geçici verginin mahsubu (600.000)", puan: 4}
  - {olcut: "(b) Ödenecek KV (100.000)", puan: 4}
  - {olcut: "(c) Yazı ile bildirim ve bir yıllık iade başvuru süresi", puan: 7}
  - {olcut: "(d) Ödenmeyen geçici verginin mahsup edilmemesi", puan: 4}
  kaynaklar:
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 34/1, alinti: 'MADDE 34- (1) Beyannamede gösterilen kazançlardan, Kanunun 15 inci maddesinin birinci fıkrasına ve 30 uncu maddesinin birinci ve ikinci fıkralarına göre kaynağında kesilmiş olan vergiler (hayat sigorta şirketlerinde matematik karşılıkların yatırıma yönlendirilmesinden elde edilen kazanç ve iratlar üzerinden yapılan kesintiler dahil), beyanname üzerinden hesaplanan kurumlar vergisinden mahsup edilir.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 34/4, alinti: '(4) Geçici vergilendirme dönemi içinde elde edilen gelirler üzerinden kesinti yoluyla ödenmiş vergilerin bulunması halinde bu vergiler, o dönem için hesaplanan geçici vergi tutarından da mahsup edilebilir. İlgili hesap dönemine ilişkin tahakkuk ettirilen geçici verginin sadece ödenen kısmı yıllık kurumlar vergisi beyannamesi üzerinden hesaplanan kurumlar vergisinden mahsup edilir.'}
  - {mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu, madde: md. 34/5, alinti: '(5) Bu maddede belirtilen sınırlar dahilinde mahsup edilecek vergiler, beyanname üzerinden hesaplanan kurumlar vergisinden fazla olduğu takdirde, bu durum vergi dairesince mükellefe yazı ile bildirilir. Aradaki fark, mükellefin söz konusu yazıyı tebellüğ tarihinden itibaren bir yıl içinde başvurusu halinde kendisine iade olunur. Bir yıl içinde başvurmayan mükelleflerin bu farktan doğan alacakları düşer.'}
  - {mevzuat: 9707 sayılı Cumhurbaşkanı Kararı, madde: md. 2, alinti: '1- 193 sayılı Gelir Vergisi Kanununun 42 nci maddesi kapsamına giren; a) Demiryolu hattı, tramvay, finiküler, monoray, metro ve şehir içi raylı ulaşım sistemleri inşaat ve onarım işleri dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden %1, b) Gemi inşaat ve onarım işleri dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden %1, c) Diğer işler dolayısıyla bu işleri yapanlara ödenen istihkak bedellerinden %5,'}
  - {mevzuat: 2009/14593 sayılı Bakanlar Kurulu Kararı, madde: md. 1/6 (mevduat faizi oranı), alinti: 'Mevduat faizlerinden % 15,'}
  dogrulama:
    python: |
      kv = 6000000 * 0.25
      kesinti = 2000000 * 0.15 + 10000000 * 0.05 + 500000 * 0
      odenecek = kv - kesinti - 600000
      fark = (1100000 + 600000) - 1500000
      sonuc = {"a": [kv, kesinti], "b": odenecek, "c": fark}
