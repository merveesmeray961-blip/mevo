- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar: [finansal tabloların hazırlanmasında esas alınan standartlar, faaliyet raporu, finansal raporlardaki sorumluluk]
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: |
    Payları borsada işlem gören **Yelken Gıda A.Ş.**'nin genel müdürü, yönetim kurulu toplantısında aşağıdaki ifadeleri kullanmıştır:

    **İfade 1:** "Finansal tablolarımızı hazırlarken yalnızca Vergi Usul Kanunu hükümlerini esas alırız."
    **İfade 2:** "Kurulun finansal raporlamada uygulama birliği sağlamak için aldığı kararlara uymak zorunda değiliz."
    **İfade 3:** "Yıllık faaliyet raporunu Şirketlerin Yıllık Faaliyet Raporunun Asgari İçeriğinin Belirlenmesi Hakkında Yönetmelik hükümlerine göre hazırlarız; ancak hazırlama ve kamuya açıklama süreleri bakımından Tebliğ hükümleri uygulanır."
    **İfade 4:** "Yönetim kurulunun finansal tablo ve faaliyet raporlarının kabulüne dair ayrı bir karar alması gerekmez; zaten genel kurulda onaylanır."
    **İfade 5:** "Finansal raporlamadan sorumlu üye belirledikten sonra yönetim kurulu sorumluluktan kurtulur."

    **İstenenler:**
    (a) İfade 1, 2 ve 3'ün doğru veya yanlış olduğunu gerekçesiyle belirtiniz. (12 puan)
    (b) İfade 4 ve 5'in doğru veya yanlış olduğunu gerekçesiyle belirtiniz. (8 puan)
  cozum: |
    **(a)**
    | İfade | Değerlendirme | Gerekçe |
    |---|---|---|
    | 1 | Yanlış | İşletmeler finansal tablolarının hazırlanmasında KGK tarafından yayımlanan **TMS/TFRS**'yi esas alır (II-14.1 md. 5/1) |
    | 2 | Yanlış | Kurulun uygulamayı belirlemek üzere aldığı kararlara uymak **zorunludur** (md. 5/2) |
    | 3 | Doğru | Yıllık faaliyet raporu ilgili Yönetmelik hükümlerine göre hazırlanır; süreler bakımından Tebliğ hükümleri uygulanır (md. 8/1) |

    **(b)**
    | İfade | Değerlendirme | Gerekçe |
    |---|---|---|
    | 4 | Yanlış | İşletme yönetim kurulunun finansal tablo ve faaliyet raporlarının kabulüne dair **ayrı bir karar** alması gerekir (md. 9/1) |
    | 5 | Yanlış | Finansal raporlamadan sorumlu belirleme, yönetim kurulunun hazırlama, sunma ve gerçeğe uygunluk sorumluluğunu **ortadan kaldırmaz** (md. 9/2) |
  puanlama:
    - {olcut: "(a) İfade 1: TMS/TFRS esası", puan: 4}
    - {olcut: "(a) İfade 2: Kurul kararlarına uyma zorunluluğu", puan: 4}
    - {olcut: "(a) İfade 3: doğru, yönetmelik ve süre ayrımı", puan: 4}
    - {olcut: "(b) İfade 4: ayrı kabul kararı", puan: 4}
    - {olcut: "(b) İfade 5: sorumluluğun ortadan kalkmaması", puan: 4}
  kaynaklar:
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 5, alinti: "(1) İşletmeler, finansal tablolarının hazırlanmasında KGK tarafından yayımlanan TMS/TFRS’yi esas alırlar. (2) Finansal raporlama ilke, usul ve esaslarının, açık ve anlaşılabilir hale gelmesini veya uygulama birliğinin sağlanmasını teminen, gerekli görülmesi halinde uygulamayı belirlemek üzere Kanunun 14 üncü maddesi kapsamında Kurulca kararlar alınır. İşletmeler bu kararlara uymakla yükümlüdürler."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 8/1, alinti: "Ancak, anılan raporların hazırlanması ve kamuya açıklanmasında süreler bakımından, bu Tebliğ hükümleri uygulanır."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 9/1, alinti: "İşletme yönetim kurulunun, bu Tebliğ kapsamında hazırlanacak finansal tablo ve faaliyet raporlarının kabulüne dair ayrı bir karar alması gerekir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 9/2, alinti: "(2) İşletme yönetim kurulu, Kurumsal Yönetim İlkeleri uyarınca seçilecek denetim komitesini, denetim komitesi bulunmaması halinde ise üyeleri arasından en az bir üyeyi, finansal raporlamadan sorumlu olarak belirler. Ancak bu husus, yönetim kurulunun finansal raporların hazırlanması, sunulması ve gerçeğe uygunluğuna ilişkin sorumluluğunu ortadan kaldırmaz."}
