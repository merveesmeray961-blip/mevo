- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar: [yıllık finansal raporların bildirim süreleri, finansal raporlardaki sorumluluk]
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: |
    Payları borsada işlem gören aşağıdaki işletmelerin yıllık finansal raporları ile bunlara ilişkin bağımsız denetim raporlarının Kurul düzenlemelerine göre bildirileceği son tarihler araştırılmaktadır (tüm işletmeler konsolide finansal tablo hazırlama yükümlülüğü altındadır ve bildirim son günleri resmî tatile rastlamamaktadır):

    | İşletme | Hesap dönemi | Özellik |
    |---|---|---|
    | **Pera A.Ş.** | 1.1.2025 - 31.12.2025 | Halka açık ortaklık; finansal raporların görüşüleceği genel kurul 10 Nisan 2026'da yapılacak |
    | **Kor A.Ş.** | 1.1.2025 - 31.12.2025 | Halka açık ortaklık; finansal raporların görüşüleceği genel kurul 10 Mart 2026'da yapılacak |
    | **Lima A.Ş.** | 1.4.2025 - 31.3.2026 (özel hesap dönemi) | Halka açık ortaklık; genel kurul tarihi henüz belirlenmemiştir |

    Ayrıca Pera A.Ş. yönetim kurulu, finansal raporlamadan sorumlu olarak denetim komitesini belirlemiştir.

    **İstenenler:**
    (a) Pera A.Ş. için son bildirim tarihini hesaplayınız. (5 puan)
    (b) Kor A.Ş. için son bildirim tarihini, hangi hükme göre belirlendiğini göstererek hesaplayınız. (6 puan)
    (c) Lima A.Ş. için son bildirim tarihini hesaplayınız; üç aylık sınırın ne ifade ettiğini belirtiniz. (5 puan)
    (d) Pera A.Ş. yönetim kurulunun finansal raporlardan sorumluluğunu ve denetim komitesinin görevlendirilmesinin sorumluluğa etkisini açıklayınız. (6 puan)
  cozum: |
    İlgili Tebliğ md. 10: konsolide finansal tablo hazırlama yükümlülüğü varsa raporlar hesap döneminin bitimini izleyen **70 gün** içinde; halka açık ortaklıklar ayrıca raporları görüşülecek genel kurul tarihinden **en az 3 hafta önce** bildirmelidir. Her hâlde yıllık raporlar hesap döneminin bitimini takip eden **üçüncü ayın sonuna kadar** bildirilir.

    **(a)** Pera: 70. gün = 31.12.2025 + 70 gün = **11 Mart 2026**. Genel kurul 10 Nisan'dadır; 3 hafta öncesi 20 Mart 2026 olup 11 Mart'tan sonradır. Her iki sınırı da sağlamak için son gün **11 Mart 2026**'dır (üçüncü ay sonu 31 Mart'tan da önce).

    **(b)** Kor: 70. gün 11 Mart 2026; genel kurul 10 Mart olduğundan 3 hafta öncesi = 10 Mart − 21 gün = **17 Şubat 2026**. Daha erken olan sınır bağlayıcıdır: **17 Şubat 2026**.

    **(c)** Lima: 31.3.2026 + 70 gün = 9 Haziran 2026 (Nisan 30 + Mayıs 31 = 61; 61 + 9 = 70). Genel kurul tarihi belirsiz olduğundan 70 gün esas alınır: **9 Haziran 2026**. Üçüncü ay sonu = 30 Haziran 2026 olup 70 günlük süre içinde kaldığından sınırı aşmaz. "Her halukarda üçüncü ay sonu" kuralı, genel kurul tarihi nedeniyle uzun süre verilse bile bildirimin ilgili hesap döneminin bitiminden sonraki üçüncü ayı geçemeyeceğini ifade eder.

    **(d)** Finansal raporların Tebliğe uygun hazırlanmasından, sunulmasından ve gerçeğe uygunluğundan **işletme ile kusurlarına ve durumun gereklerine göre yönetim kurulu üyeleri** sorumludur; yönetim kurulunun finansal tablo ve faaliyet raporlarının kabulüne dair ayrı bir karar alması gerekir. Denetim komitesinin (veya en az bir üyenin) finansal raporlamadan sorumlu olarak belirlenmesi, yönetim kurulunun sorumluluğunu **ortadan kaldırmaz** (md. 9/1-2).
  puanlama:
    - {olcut: "(a) 11 Mart 2026 ve gerekçe", puan: 5}
    - {olcut: "(b) 17 Şubat 2026 ve daha erken sınırın esas alınması", puan: 6}
    - {olcut: "(c) 9 Haziran 2026 hesabı", puan: 3}
    - {olcut: "(c) Üçüncü ay sonu sınırının açıklanması", puan: 2}
    - {olcut: "(d) Yönetim kurulu sorumluluğu, kabul kararı ve komite görevlendirmesinin etkisi", puan: 6}
  kaynaklar:
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 10/1, alinti: "b) Konsolide finansal tablo hazırlama yükümlülüğünün bulunduğu durumlarda, hesap dönemlerinin bitimini izleyen 70 gün içinde 12 ve 12/A maddelerinde belirlenen usullere uygun olarak bildirir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 10/2, alinti: "(2) Halka açık ortaklıklar, yıllık finansal raporlarıyla bunlara ilişkin Kurulun bağımsız denetim düzenlemelerinde öngörülen bağımsız denetim raporlarını, söz konusu finansal raporların görüşüleceği genel kurul tarihinden en az 3 hafta önce, bunların dışında kalan diğer işletmeler ise TTK’nın 437 nci maddesinde belirlenen süreye uymak suretiyle 12 ve 12/A maddelerinde belirlenen usullere uygun olarak bildirir. Ancak her halükarda, yıllık finansal raporlar ilgili hesap döneminin bitimini takip eden üçüncü ayın sonuna kadar bildirilir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 9/1, alinti: "(1) Yıllık ve ara dönem finansal raporların, bu Tebliğ hükümlerine uygun olarak hazırlanmasından, sunulmasından ve gerçeğe uygunluğu ile doğruluğundan işletme ile kusurlarına ve durumun gereklerine göre işletmenin yönetim kurulu üyeleri sorumludur. İşletme yönetim kurulunun, bu Tebliğ kapsamında hazırlanacak finansal tablo ve faaliyet raporlarının kabulüne dair ayrı bir karar alması gerekir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 9/2, alinti: "(2) İşletme yönetim kurulu, Kurumsal Yönetim İlkeleri uyarınca seçilecek denetim komitesini, denetim komitesi bulunmaması halinde ise üyeleri arasından en az bir üyeyi, finansal raporlamadan sorumlu olarak belirler. Ancak bu husus, yönetim kurulunun finansal raporların hazırlanması, sunulması ve gerçeğe uygunluğuna ilişkin sorumluluğunu ortadan kaldırmaz."}
  gecerlilik: {baslangic: '2012-12-30', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar: [ara dönem finansal rapor yükümlülüğü, ara dönem bildirim süreleri, KAP ve Kurula bildirim]
  zorluk: 3
  puan: 21
  sure_dk: 30
  soru: |
    30 Eylül 2026 tarihli 9 aylık ara dönem finansal raporlara ilişkin olarak aşağıdaki işletmeler incelenecektir (takvim yılı hesap dönemi; bildirim son günleri resmî tatile rastlamamaktadır):

    | İşletme | Özellik |
    |---|---|
    | **Sera A.Ş.** | Payları borsada işlem görmektedir; konsolide finansal tablo hazırlamaz; ara dönem tablolar sınırlı bağımsız denetime tabi değildir |
    | **Umut A.Ş.** | Payları borsada işlem görmektedir; konsolide finansal tablo hazırlar; ara dönem tablolar Kurulun bağımsız denetim düzenlemelerine göre sınırlı bağımsız denetime tabidir |
    | **Vera A.Ş.** | Payları borsada işlem görmektedir; konsolide finansal tablo hazırlamaz; ara dönem tabloları sınırlı bağımsız denetime tabidir |
    | **Wal A.Ş.** | Halka açık ortaklıktır, payları borsada işlem görmemektedir; başka bir sermaye piyasası kurumu niteliği yoktur |

    **İstenenler:**
    (a) Hangi işletmelerin 3, 6 ve 9 aylık dönemler itibariyla ara dönem finansal rapor düzenlemekle yükümlü olduğunu gerekçeyle belirtiniz. (6 puan)
    (b) Sera, Umut ve Vera için 9 aylık ara dönem finansal raporların son bildirim tarihlerini hesaplayınız. (9 puan)
    (c) Sera A.Ş. ile Wal A.Ş.'nin yıllık finansal raporlarını nereye bildirmesi gerektiğini belirtiniz. (6 puan)
  cozum: |
    **(a)** Md. 7/1: ihraç ettiği sermaye piyasası araçları borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmeler (Sera, Umut, Vera) ile yatırım kuruluşları, yatırım ortaklıkları, portföy yönetim şirketleri ve ipotek finansmanı kuruluşları 3, 6 ve 9 aylık ara dönem rapor düzenler. Wal, paylarını borsada işlem gördürmediği ve sayılan kurum niteliklerinden birini taşımadığı için **yükümlü değildir**.

    **(b)** Md. 11: konsolide yoksa 30, varsa 40 gün; sınırlı bağımsız denetim (inceleme) varsa borsada işlem gören işletmeler için **10 gün ilave**.

    | İşletme | Süre | Hesap | Son gün |
    |---|---|---|---|
    | Sera | 30 gün | 30.9.2026 + 30 | **30 Ekim 2026** |
    | Umut | 40 + 10 = 50 gün | 30.9.2026 + 50 | **19 Kasım 2026** |
    | Vera | 30 + 10 = 40 gün | 30.9.2026 + 40 | **9 Kasım 2026** |

    **(c)** Md. 12: paylarının borsada işlem görmesi hâlinde (Sera) finansal raporlar kamuya açıklanmak üzere **KAP'a** bildirilir; payları borsada işlem görmeyen halka açık ortaklıklar (Wal) ise finansal raporlarını **Kurula** bildirir.
  puanlama:
    - {olcut: "(a) Sera, Umut, Vera'nın yükümlü olduğu ve Wal'ın yükümlü olmadığı", puan: 6}
    - {olcut: "(b) Sera 30 Ekim 2026", puan: 2}
    - {olcut: "(b) Umut 19 Kasım 2026 (40 + 10 gün)", puan: 4}
    - {olcut: "(b) Vera 9 Kasım 2026 (30 + 10 gün)", puan: 3}
    - {olcut: "(c) Sera KAP, Wal Kurul", puan: 6}
  kaynaklar:
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 7/1, alinti: "3, 6 ve 9 aylık dönemler itibarıyla ara dönem finansal rapor düzenlemekle yükümlüdürler. a) İhraç ettiği sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmeler,"}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 11/1, alinti: "a) Konsolide finansal tablo hazırlama yükümlülüğünün bulunmadığı durumlarda, ilgili ara dönemin bitimini izleyen 30 gün, b) Konsolide finansal tablo hazırlama yükümlülüğünün bulunduğu durumlarda, ilgili ara dönemin bitimini izleyen 40 gün içinde 12 ve 12/A maddelerinde belirlenen usullere uygun olarak bildirir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 11/2, alinti: "(2) Ara dönem finansal tabloların, Kurulun bağımsız denetim düzenlemelerine göre sınırlı bağımsız denetime (incelemeye) tabi olduğu hallerde, birinci fıkrada düzenlenen sürelere; sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmeler için 10 gün, diğer işletmeler için ise 15 gün eklenir."}
    - {mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği, madde: md. 12/1-2, alinti: "(1) Aşağıdaki işletmeler, finansal raporlarını kamuya açıklanmak üzere KAP’a bildirir. a) Sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmeler, b) Portföy yönetim şirketleri, c) Yatırım kuruluşları. (2) Aşağıdaki işletmeler, finansal raporlarını Kurula bildirmekle yükümlüdür. a) Sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem görmeyen halka açık ortaklıklar,"}
