  tip: kavrama
  zorluk: 3
  kok: Bağımsız denetim kuruluşlarının, denetledikleri finansal tablo ve raporların mevzuata uygun denetlenmemesinden doğabilecek zararlara ilişkin sorumluluğu hakkında SPKn'ye göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Görevlerinin kapsamıyla sınırlı olmak üzere, raporu imzalayanlarla birlikte sorumludur.
    B: Yalnızca raporu imzalayan bağımsız denetçi sorumludur; kuruluşun sorumluluğu bulunmaz.
    C: Yalnızca denetlenen ihraççı sorumludur; denetim kuruluşu sorumlu tutulamaz.
    D: Sorumluluk yalnızca denetim kuruluşunun kasıtlı yanlış rapor düzenlemesi hâlinde doğar.
    E: Sorumluluk, görev kapsamından bağımsız ve sınırsızdır; imzalayanlar sorumlu değildir.
  dogru: A
  aciklama:
    dogru_neden: SPKn md. 63/1'e göre bağımsız denetim kuruluşları, görevlerinin kapsamıyla sınırlı olmak üzere, denetledikleri finansal tablo ve raporların mevzuata uygun olarak denetlenmemesi nedeniyle doğabilecek zararlardan raporu imzalayanlarla birlikte sorumludur.
    celdiriciler:
      B: Kuruluş da sorumludur; sorumluluk raporu imzalayanlarla birlikte doğar.
      C: Denetim kuruluşunun sorumluluğu ihraççının sorumluluğunu ortadan kaldırmaz; kuruluş da görev kapsamı ile sınırlı olarak sorumludur.
      D: Kanun, sorumluluğu yalnızca kasıt hâline bağlamaz; mevzuata uygun denetlenmemesi yeterlidir.
      E: Sorumluluk görevlerinin kapsamıyla sınırlıdır; sınırsız değildir ve raporu imzalayanlar da sorumludur.
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 63/1
    alinti: Bağımsız denetim kuruluşları, görevlerinin kapsamıyla sınırlı olmak üzere, denetledikleri finansal tablo ve raporların mevzuata uygun olarak denetlenmemesi nedeniyle doğabilecek zararlardan raporu imzalayanlarla birlikte sorumludur.
