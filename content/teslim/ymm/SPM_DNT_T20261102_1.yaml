    madde: md. 76/3
    alinti: Bu yükümlülüğe uyulmaması hâlinde, Kurul, bu kuruluşlar hakkında faaliyetlerinin durdurulması ve yetkilerinin iptali dâhil her türlü tedbiri almaya yetkilidir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 76/2
    alinti: (2) Lisans sahibi, lisans almaya hak kazandığı tarihten itibaren üç ay içinde üyelik için Türkiye Değerleme Uzmanları Birliğine gerekli başvuruyu yapmakla yükümlüdür. Anılan yükümlülüğe uymayanların lisansı Kurulca iptal edilir.
