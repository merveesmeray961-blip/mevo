  kok: Değerleme kuruluşu niteliğini kazanan bir kuruluş, Türkiye Değerleme Uzmanları Birliğine üyelik için üç ay içinde başvuruda bulunmamıştır. Bu durumda Kurulun yetkisine ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Kuruluşa yalnızca uyarıda bulunabilir; başka tedbir alamaz.
    B: Başvuru süresi kendiliğinden süresiz olarak uzar.
    C: Kuruluşun lisansı Kurulca iptal edilir.
    D: Kuruluş Birlik üyesi sayılır ve başvuru yapılmış kabul edilir.
    E: Kurul, faaliyetlerinin durdurulması ve yetkilerinin iptali dahil her türlü tedbiri almaya yetkilidir.
  dogru: E
  aciklama:
    dogru_neden: SPKn md. 76/3, değerleme kuruluşlarının niteliği kazandıkları andan itibaren üç ay içinde Birliğe başvurma yükümlülüğüne uyulmamasını, Kurul tarafından faaliyetlerin durdurulması ve yetkilerin iptali dahil her türlü tedbirin alınabilmesine bağlar.
    celdiriciler:
      A: Kurulun tedbir yetkisi uyarıyla sınırlı değildir; faaliyetin durdurulması ve yetkinin iptali dahil her türlü tedbir alınabilir.
      B: Kanunda başvuru süresinin kendiliğinden uzayacağına dair bir hüküm yoktur.
      C: Lisansın iptali, gayrimenkul değerleme uzmanlığı lisansı sahipleri için öngörülen yaptırımdır (md. 76/2); kuruluşlar hakkında md. 76/3 uygulanır.
      D: Üyelik başvuru yapılmadıkça gerçekleşmez; başvuru yapılmış sayılma diye bir kural yoktur.
  kaynaklar:
