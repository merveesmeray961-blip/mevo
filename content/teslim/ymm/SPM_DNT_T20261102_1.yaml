  kok: Payları borsada işlem gören, konsolide finansal tablo hazırlamayan bir işletmenin 30.9.2026 tarihli 9 aylık ara dönem finansal tabloları, Kurulun bağımsız denetim düzenlemelerine göre sınırlı bağımsız denetime (incelemeye) tabidir. Son bildirim günü resmî tatile rastlamamaktadır. Ara dönem finansal raporların bildirilmesi gereken son tarih hangisidir?
  secenekler:
    A: 30 Ekim 2026
    B: 9 Kasım 2026
    C: 19 Kasım 2026
    D: 29 Kasım 2026
    E: 14 Aralık 2026
  dogru: B
  aciklama:
    dogru_neden: 'Konsolide yükümlülüğü olmayan işletmeler için ara dönem raporları dönemin bitimini izleyen 30 gün içinde bildirilir; sınırlı bağımsız denetime tabi olan ve payları borsada işlem gören işletmeler için bu süreye 10 gün eklenir (md. 11/1-2). 30 + 10 = 40 gün: 30.9.2026 + 40 gün = 9 Kasım 2026.'
    celdiriciler:
      A: 30 Ekim 2026, sınırlı denetim süresi eklenmeden bulunan 30 günlük süredir.
      C: 19 Kasım 2026, konsolide yükümlülüğü olan işletme için 40 + 10 = 50 günlük süreyle bulunan tarihtir.
      D: 29 Kasım 2026, 60 günlük bir sürenin sonucudur; Tebliğde bu süre öngörülmemiştir.
      E: 14 Aralık 2026, yıllık rapor mantığıyla hesaplanmış bir sürenin sonucudur; ara dönem için uygulanmaz.
  kaynaklar:
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 11/1
    alinti: a) Konsolide finansal tablo hazırlama yükümlülüğünün bulunmadığı durumlarda, ilgili ara dönemin bitimini izleyen 30 gün, b) Konsolide finansal tablo hazırlama yükümlülüğünün bulunduğu durumlarda, ilgili ara dönemin bitimini izleyen 40 gün içinde 12 ve 12/A maddelerinde belirlenen usullere uygun olarak bildirir.
  - mevzuat: II-14.1 Sermaye Piyasasında Finansal Raporlamaya İlişkin Esaslar Tebliği
    madde: md. 11/2
    alinti: (2) Ara dönem finansal tabloların, Kurulun bağımsız denetim düzenlemelerine göre sınırlı bağımsız denetime (incelemeye) tabi olduğu hallerde, birinci fıkrada düzenlenen sürelere; sermaye piyasası araçları bir borsada ve/veya teşkilatlanmış diğer pazar yerlerinde işlem gören işletmeler için 10 gün, diğer işletmeler için ise 15 gün eklenir.
