- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: GEN
  kazanimlar: [Kurulun görev ve yetkileri, halka açık ortaklıklarda resen yönetim kurulu üyesi ataması]
  zorluk: 3
  puan: 25
  sure_dk: 32
  soru: |
    Payları borsada işlem gören **Ay Lojistik A.Ş.**'nin yönetim kurulu 9 üyeden oluşmaktadır ve yönetim kurulu toplantı yeter sayısı **5**'tir. 2026 yılı başında 6 üyenin üyeliği boşalmış, geriye 3 üye kalmıştır. Boşalan üyeliklerin üyelikleri takip eden **30 gün** içinde genel kurul toplanamamış ve yeni üyeler seçilememiştir. Şirket olağan genel kurul toplantısını kanuni süresi içinde üst üste iki hesap döneminde yapmamıştır. Kurul, 6362 sayılı Kanunun 128. maddesi çerçevesinde yetkisini kullanmayı değerlendirmektedir.

    **İstenenler:**
    (a) Kurulun yönetim kurulu üyesi atayabilmesinin şartlarını ve atanacak üyelerde aranan niteliği belirtiniz. (7 puan)
    (b) Kurulun resen atayacağı asgari üye sayısını bulunuz; geriye kalan boş üyelikler için ortaklardan kaç aday gösterilmesini talep edeceğini hesaplayınız. (7 puan)
    (c) Ay Lojistik'te genel kurulun yetkilerini kimin kullanabileceğini gerekçesiyle belirtiniz. (6 puan)
    (d) Kurulun yönetmelik ve tebliğlerinin yürürlüğe giriş şeklini, özel nitelikli kararlarının yayımına ilişkin yetkisini belirtiniz. (5 puan)
  cozum: |
    **(a)** Kurul, yönetim kurulu toplantı yeter sayısının sağlanamaması ve görev süresi dolan/boşalan üyelerin yerine **30 gün içinde** yeni üye seçmek üzere genel kurulun toplanamaması veya genel kurulda yeter sayıda üye seçilememesi hâlinde, genel kurulca yeni üyeler seçilinceye veya Kurulca başka üyeler atanıncaya kadar görev yapmak üzere toplantı yeter sayısını sağlayacak **asgari sayıda** üyeyi resen atar. Atanacak üyeler Kurulun kurumsal yönetim ilkelerinde sayılan **bağımsızlık kriterlerini** sağlamalıdır (md. 128/1-k).

    **(b)** Toplantı yeter sayısı 5, görevdeki üye 3 olduğundan asgari atama 5 − 3 = **2** üyedir. Geriye kalan boş üyelik sayısı 6 − 2 = 4'tür. Kurul bağımsızlık kriterlerini sağlayan, **boş üye sayısının 3 katı** kadar kişiyi ortaklardan aday göstermelerini talep eder: 4 × 3 = **12 aday**. Kurul bu talebini ortakların sahip oldukları pay oranlarını dikkate alarak belirler.

    **(c)** Olağan genel kurulunu kanuni süresi içinde üst üste iki hesap döneminde yapmayan ve yönetim kurulu üyeleri kısmen veya tamamen Kurulca atanmış halka açık ortaklıklarda genel kurulun yetkileri **YTM** (Yatırımcı Tazmin Merkezi) tarafından kullanılabilir. Ay Lojistik her iki şartı da taşıdığı için bu yetki YTM'dedir.

    **(d)** Kurul yetkilerini düzenleyici işlemler tesis ederek ve özel nitelikli kararlar alarak kullanır. Düzenleyici işlem niteliğindeki yönetmelik ve tebliğler **Resmî Gazete'de yayımlanarak** yürürlüğe konur; Kurul, kararlarının Resmî Gazete'de veya internet ortamı dahil uygun vasıtalarla yayımlanmasına karar verebilir (md. 128/2).
  puanlama:
    - {olcut: "(a) 30 günlük süre/yeter sayı şartı ve bağımsızlık kriteri", puan: 7}
    - {olcut: "(b) Asgari atama sayısı 2", puan: 3}
    - {olcut: "(b) 4 × 3 = 12 aday", puan: 4}
    - {olcut: "(c) YTM'nin genel kurul yetkisi ve iki şartın tespiti", puan: 6}
    - {olcut: "(d) Resmî Gazete'de yayım ve kararların yayımı yetkisi", puan: 5}
  kaynaklar:
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 128/1-k, alinti: "Kurul, yerlerine halka açık ortaklık genel kurulunca yeni üyeler seçilinceye veya Kurulca başka üyeler atanıncaya kadar görev yapmak üzere yönetim kurulu toplantı yeter sayısını sağlayacak asgari sayıda, Kurulun kurumsal yönetim ilkelerinde sayılan bağımsızlık kriterlerini sağlayan yönetim kurulu üyelerini resen atar."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 128/1-k, alinti: "Kurulca yapılan resen atama sonucunda geriye kalan boş üyelikler için, kurumsal yönetim ilkelerinde sayılan bağımsızlık kriterlerini sağlayan, boş üye sayısının 3 katı kadar kişiyi halka açık ortaklığın ortaklarından aday göstermelerini talep eder. Kurul bu talebini ortakların halka açık ortaklıkta sahip olduğu pay oranlarını dikkate alarak belirler ve bu bentteki esaslara uygun olarak atama yapar."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 128/1-k, alinti: "Olağan genel kurul toplantısını kanuni süresi içinde üst üste iki hesap dönemi içinde yapmayan ve yönetim kurulu üyeleri kısmen veya tamamen Kurulca yukarıdaki fıkralar uyarınca atanmış halka açık ortaklıklarda genel kurulun yetkileri YTM tarafından kullanılabilir."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 128/2, alinti: "(2) Kurul, yetkilerini, düzenleyici işlemler tesis ederek ve özel nitelikli kararlar alarak kullanır. Kurul, kararlarının Resmî Gazete’de veya internet ortamı dâhil uygun vasıtalarla yayımlanmasına karar verebilir. Düzenleyici işlem niteliğindeki yönetmelik ve tebliğler Resmî Gazete’de yayımlanarak yürürlüğe konur."}
  dogrulama: {python: "uye = 3\nyeter = 5\natanan = yeter - uye\nbos = 6 - atanan\nsonuc = {'atanan': atanan, 'aday': bos * 3}"}
  gecerlilik: {baslangic: '2012-12-30', bitis: null, yila_bagli_tutar: false}
  durum: taslak
  surum: 1
  uretim: {kaynak_turu: yapay_zeka, model: claude-sonnet-5-5}
- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: GEN
  kazanimlar: [halka açık ortaklık sayılma, kanun kapsamına girme ve çıkma, borsaya başvuru yükümlülüğü]
  zorluk: 3
  puan: 20
  sure_dk: 28
  soru: |
    Aşağıdaki anonim ortaklıkların payları borsada işlem görmemektedir. Ortaklara ilişkin bilgiler şöyledir:

    | Şirket | Durum |
    |---|---|
    | Alfa A.Ş. | Pay sahibi sayısı tam olarak 500'dür |
    | Beta A.Ş. | Pay sahibi sayısı 501'dir; kitle fonlaması yoluyla para toplamamıştır |
    | Gama A.Ş. | Pay sahibi sayısı 800'dür; ancak şirket kitle fonlaması suretiyle halktan para toplamıştır |
    | Delta A.Ş. | Pay sahibi sayıları toplamı 600 olan kooperatiflerin yönetim kontrolüne sahip olduğu bir anonim ortaklıktır; son yıl satış hasılatı 70.000.000 TL'dir |

    **İstenenler:**
    (a) Her şirket için payların halka arz olunmuş sayılıp sayılmadığını ve halka açık ortaklık hükümlerine tabi olup olmadığını gerekçeyle belirtiniz. (12 puan)
    (b) Beta A.Ş. ile Delta A.Ş.'nin paylarının borsada işlem görmesi için borsaya başvurma yükümlülüğünün bulunup bulunmadığını belirtiniz. (8 puan)
  cozum: |
    **(a)**
    | Şirket | Sonuç | Gerekçe |
    |---|---|---|
    | Alfa | Halka arz olunmuş sayılmaz | Pay sahibi sayısının 500'ü **aşması** gerekir; 500 eşiği aşmaz (md. 16/1) |
    | Beta | Halka arz olunmuş sayılır; halka açık ortaklık hükümlerine tabidir | 500'ü aşan pay sahibi sayısı, hariç tutulan kategoriye girmez (md. 16/1) |
    | Gama | Bu kural bakımından halka arz olunmuş sayılmaz | Kitle fonlaması suretiyle halktan para toplayan ortaklıklar md. 16/1 kapsamı dışındadır |
    | Delta | Halka arz olunmuş sayılır; halka açık ortaklık hükümlerine tabidir | Kooperatiflerin yönetim kontrolü, pay sahibi sayısı ≥ 500 ve satış hasılatı ≥ 50 milyon TL (md. 16/3) |

    **(b)** Beta, halka açık ortaklık statüsünü kazandığından en geç **iki yıl** içinde paylarının işlem görmesi için borsaya başvurmak zorundadır (md. 16/2). Delta ise md. 16/3 kapsamına girdiğinden, bu fıkra kapsamındaki ortaklıklara **ikinci fıkra hükümleri uygulanmaz**; borsaya başvuru yükümlülüğü yoktur.
  puanlama:
    - {olcut: "(a) Alfa: 500'ün aşılmaması nedeniyle halka arz sayılmama", puan: 3}
    - {olcut: "(a) Beta: 500'ü aşma nedeniyle halka arz sayılma", puan: 3}
    - {olcut: "(a) Gama: kitle fonlaması istisnası", puan: 3}
    - {olcut: "(a) Delta: md. 16/3 şartları", puan: 3}
    - {olcut: "(b) Beta için iki yıllık borsaya başvuru yükümlülüğü", puan: 4}
    - {olcut: "(b) Delta için ikinci fıkranın uygulanmaması", puan: 4}
  kaynaklar:
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 16/1, alinti: "Payları borsada işlem gören ortaklıklar ile kitle fonlaması suretiyle halktan para toplayan ortaklıklar hariç olmak üzere pay sahibi sayısı beş yüzü aşan anonim ortaklıkların payları halka arz olunmuş sayılır. Bu ortaklıklar halka açık ortaklık hükümlerine de tabi olurlar."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 16/2, alinti: "(2) Payları borsada işlem görmeyen anonim ortaklıklar, halka açık ortaklık statüsünü kazandıktan sonra en geç iki yıl içinde paylarının işlem görmesi için borsaya başvurmak zorundadırlar."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 16/3, alinti: "Pay sahibi sayısı en az beş yüz olan kooperatiflerin veya kendisine ortak olan kooperatiflerin pay sahibi sayısı tek başına ya da toplam olarak en az beş yüz olan kooperatif birliklerinin veya kooperatif merkez birliklerinin yönetim kontrolüne sahip olduğu ve yıllık en az elli milyon Türk lirası satış hasılatı yapmış olan anonim ortaklıkların payları halka arz olunmuş sayılır."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 16/3, alinti: "Bu fıkra kapsamına giren ortaklıklara ikinci fıkra hükümleri uygulanmaz."}
