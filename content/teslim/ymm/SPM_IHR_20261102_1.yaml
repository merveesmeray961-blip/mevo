    - {olcut: "(d) 26 Haziran 2026 sonucu", puan: 3}
    - {olcut: "(e) İhraççının birincil sorumluluğu ve diğerlerinin ikincil sorumluluğu", puan: 4}
    - {olcut: "(e) Rapor hazırlayanların sorumluluğu", puan: 2}
