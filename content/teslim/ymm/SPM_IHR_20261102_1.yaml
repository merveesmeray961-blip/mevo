    - {mevzuat: VII-128.8 Borçlanma Araçları Tebliği, madde: md. 5/5, alinti: "Yetkili organ kararında sadece borçlanma aracı ifadesine yer verilmesi durumunda, Kurulca yapılan başvurunun yalnızca tahvil ve finansman bonosu ihracı için olduğu kabul edilir."}
    - {mevzuat: VII-128.8 Borçlanma Araçları Tebliği, madde: md. 6/2, alinti: "(2) Yetkili organ kararının alındığı tarihten itibaren en geç bir yıl içinde Kurula başvuruda bulunulması zorunludur."}
    - {mevzuat: VII-128.8 Borçlanma Araçları Tebliği, madde: md. 6/3, alinti: "(3) İzahnamenin geçerlilik süresi boyunca yapılacak halka arzlarda, her bir tertibin satışı için planlanan satış tarihinden en az beş iş günü önce Ek/3’te yer alan belgelerle birlikte onay almak amacıyla Kurula başvurulur."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 6/2, alinti: "on iş günü içinde Kurul tarafından karara bağlanır ve keyfiyet ilgililere bildirilir. İlk halka arzlarda bu süre yirmi iş günüdür."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 6/3, alinti: "Bu takdirde, ikinci fıkrada öngörülen süreler, söz konusu eksik veya ek bilgi ve belgelerin Kurula sunulduğu tarihten itibaren işlemeye başlar."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 10/1, alinti: "(1) İzahnamede yer alan yanlış, yanıltıcı ve eksik bilgilerden kaynaklanan zararlardan ihraççılar sorumludur. Zararın söz konusu kişilerden tazmin edilememesi veya edilemeyeceğinin açıkça belli olması hâlinde; halka arz edenler, ihraca aracılık eden lider aracı kurum, varsa garantör ve ihraççının yönetim kurulu üyeleri kusurlarına ve durumun gereklerine göre zararlar kendilerine yükletilebildiği ölçüde sorumludur."}
