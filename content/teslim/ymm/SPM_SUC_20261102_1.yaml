    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 104/1, alinti: "Kurulca belirlenen piyasa bozucu eylemleri gerçekleştiren kişilere Kurul tarafından yirmi bin Türk Lirasından beş yüz bin Türk Lirasına kadar idari para cezası verilir. Ancak, bu suretle menfaat temin edilmiş olması hâlinde verilecek idari para cezasının miktarı bu menfaatin iki katından az olamaz."}
