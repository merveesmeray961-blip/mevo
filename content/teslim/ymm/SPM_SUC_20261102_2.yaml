- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: SUC
  kazanimlar: [kripto varlık hizmet sağlayıcılarda zimmet, izinsiz kripto varlık hizmet sağlayıcılığı, iade nedeniyle ceza indirimi]
  zorluk: 3
  puan: 25
  sure_dk: 32
  soru: |
    Kurul izniyle faaliyet gösteren **Kıta Kripto Varlık A.Ş.**'nin yönetim kurulu üyesi **R**, müşterilerin saklama hesabındaki kripto varlıkları kendi şirketinin hesabına aktararak zimmetine geçirmiştir. R'nin fiilleri, zimmetin ortaya çıkmasını önlemeye yönelik hileli davranışlarla işlenmemiştir. Mahkeme, R için temel hapis cezasını yasal alt sınırdan hareketle **9 yıl** olarak belirlemiştir. Ayrıca **S** isimli kişi, hiçbir izin almadan bir mobil uygulama üzerinden kripto varlık alım-satım hizmeti sunmaktadır.

    Olayda üç ayrı senaryo incelenecektir:

    | Senaryo | R'nin zimmetteki varlıkları iade zamanı |
    |---|---|
    | 1 | Soruşturma başlamadan önce, tamamen |
    | 2 | Soruşturma başladıktan sonra, kovuşturma başlamadan önce, gönüllü ve tamamen |
    | 3 | Kovuşturma başladıktan sonra, hüküm verilmeden önce, tamamen |

    **İstenenler:**
    (a) R'nin suçunun cezasını ve hilenin bulunması hâlinde ceza aralığının nasıl değişeceğini belirtiniz. (6 puan)
    (b) Her bir senaryoda 9 yıllık temel cezanın indirim sonrası tutarını bulunuz. (9 puan)
    (c) S'nin eyleminin hangi suçu oluşturduğunu, kimlerin sorumlu olduğunu ve cezasını belirtiniz. (6 puan)
    (d) Zimmet suçunun konusunu oluşturan varlıkların suç tarihindeki değerinin azlığının cezaya etkisini açıklayınız. (4 puan)
  cozum: |
    **(a)** Kripto varlık hizmet sağlayıcısının yönetim kurulu üyesinin zimmeti (SPKn md. 110/A-1) **sekiz yıldan on dört yıla kadar** hapis ve beş bin güne kadar adli para cezasıyla cezalandırılır; ayrıca kripto varlık hizmet sağlayıcının zararı tazmin ettirilir. Suç, zimmetin açığa çıkmamasını sağlamaya yönelik hileli davranışlarla işlenirse ceza **on dört yıldan yirmi yıla kadar** hapistir (md. 110/A-2).

    **(b)** Md. 110/A-4 ve 5 uyarınca indirimler:

    | Senaryo | Dayanak | İndirim | Sonuç ceza |
    |---|---|---|---|
    | 1 | md. 110/A-4 (soruşturma öncesi iade) | 2/3 | 9 × 1/3 = **3 yıl** |
    | 2 | md. 110/A-5, birinci cümle (kovuşturma öncesi gönüllü iade) | 1/2 | 9 × 1/2 = **4,5 yıl** |
    | 3 | md. 110/A-5, ikinci cümle (hükümden önce) | 1/3 | 9 × 2/3 = **6 yıl** |

    **(c)** İzin almaksızın kripto varlık hizmet sağlayıcı olarak faaliyet yürütmek md. 109/A-1 kapsamındaki **izinsiz kripto varlık hizmet sağlayıcılığı** suçudur. Gerçek kişiler ve tüzel kişilerin yetkilileri sorumludur; ceza üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezasıdır. S gerçek kişi olarak doğrudan sorumludur.

    **(d)** Zimmete konu varlıkların suç tarihindeki değerinin azlığı hâlinde verilecek ceza **üçte birden yarıya kadar** indirilir (md. 110/A-6).
  puanlama:
    - {olcut: "(a) 8-14 yıl hapis ve hileli hâlde 14-20 yıl aralığı", puan: 6}
    - {olcut: "(b) Senaryo 1 sonucu (3 yıl) ve dayanak", puan: 3}
    - {olcut: "(b) Senaryo 2 sonucu (4,5 yıl) ve dayanak", puan: 3}
    - {olcut: "(b) Senaryo 3 sonucu (6 yıl) ve dayanak", puan: 3}
    - {olcut: "(c) md. 109/A suçu, sorumlular ve ceza", puan: 6}
    - {olcut: "(d) md. 110/A-6 değer azlığı indirimi", puan: 4}
  kaynaklar:
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/A-1, alinti: "sekiz yıldan on dört yıla kadar hapis ve beş bin güne kadar adli para cezası ile cezalandırılacakları gibi kripto varlık hizmet sağlayıcının zararını tazmine mahkûm edilirler."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/A-2, alinti: "(2) Suçun, zimmetin açığa çıkmamasını sağlamaya yönelik hileli davranışlarla işlenmesi hâlinde faile on dört yıldan yirmi yıla kadar hapis"}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/A-4, alinti: "(4) Soruşturma başlamadan önce, zimmete geçirilen para veya para yerine geçen evrak veya senetlerin, diğer malların veya kripto varlıkların aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi hâlinde, verilecek cezanın üçte ikisi indirilir."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/A-5, alinti: "(5) Kovuşturma başlamadan önce, zimmete geçirilen para veya para yerine geçen evrak veya senetlerin, diğer malların veya kripto varlıkların gönüllü olarak aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi hâlinde, verilecek cezanın yarısı indirilir. Bu durumun hükümden önce gerçekleşmesi hâlinde, verilecek cezanın üçte biri indirilir."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/A-6, alinti: "(6) Zimmet suçunun konusunu oluşturan para veya para yerine geçen evrak veya senetlerin veya diğer malların veya kripto varlıkların suçun işlendiği tarihteki değerinin azlığı nedeniyle verilecek ceza üçte birden yarıya kadar indirilir."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 109/A-1, alinti: "İzin almaksızın kripto varlık hizmet sağlayıcı olarak faaliyet yürüttüğü tespit edilen gerçek kişiler ve tüzel kişilerin yetkilileri üç yıldan beş yıla kadar hapis ve beş bin günden on bin güne kadar adli para cezası ile cezalandırılırlar."}
