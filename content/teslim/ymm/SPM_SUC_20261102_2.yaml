- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: SUC
  kazanimlar: [piyasa bozucu eylemler, menfaat hesaplaması, idari para cezası usulü]
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: |
    **W**, borsada işlem gören bir payda Kurulca piyasa bozucu eylem olarak belirlenen emir davranışlarında bulunmuş, eylem suç oluşturmamıştır. W'nin bu eylemden elde ettiği menfaate ilişkin bilgiler şöyledir:

    | Kalem | Tutar |
    |---|---|
    | Satış karşılığı elde edilen brüt kazanç | 400.000 TL |
    | Menfaatle bağlantılı işlemlerde ödenen komisyon ve vergiler | 60.000 TL |
    | Brüt kazancın nakde çevrilmemiş (portföyde tutulan) kısmı | 100.000 TL |

    Kurul, W'den savunma istemiş ve savunma yazısı 6 Nisan 2026'da tebliğ edilmiştir. W 15 Mayıs 2026'ya kadar savunma vermemiştir. Cezanın kesinleşmesi ve tahsili sonrasında tutarın dağıtımı ve karara karşı dava yolu da sorulmaktadır.

    **İstenenler:**
    (a) W'ye verilecek idari para cezasının alt sınırını menfaat hesaplama kurallarını da dikkate alarak bulunuz. (9 puan)
    (b) W'nin savunma hakkını kullanmama durumunu süre hesabıyla değerlendiriniz. (6 puan)
    (c) Tahsil edilen idari para cezasının nasıl dağıtılacağını ve karara karşı başvuru yolunu belirtiniz. (8 puan)
  cozum: |
    **(a)** Md. 104/1: ceza 20.000 TL - 500.000 TL arasındadır; menfaat varsa ceza menfaatin iki katından az olamaz. Md. 103/9 gereği menfaat hesabında komisyonlar, vergiler vb. maliyetler **dikkate alınmaz** ve menfaatin nakde çevrilip çevrilmediğine **bakılmaz**. Menfaat = 400.000 TL (brüt); alt sınır = 2 × 400.000 = **800.000 TL**. (Bu tutar genel 500.000 TL üst sınırını aşsa da menfaat nedeniyle belirlenen alt sınır esas alınır.)

    **(b)** Md. 105/1: savunma isteyen yazının tebliğinden itibaren **otuz gün** içinde savunma verilmezse savunma hakkından feragat edilmiş sayılır. Süre 6 Nisan 2026 + 30 gün = 6 Mayıs 2026'da dolar; 15 Mayıs'ta verilmeyen savunma hakkından feragat edilmiş kabul edilir.

    **(c)** Md. 105/3: tahsil edilen idari para cezalarının **%50'si genel bütçeye** gelir kaydedilir, **%50'si** gelir kaydedilmek üzere YTM'ye (Yatırımcı Tazmin Merkezi) aktarılır. Md. 105/4: karara karşı **idari yargı yoluna** başvurulabilir.
  puanlama:
    - {olcut: "(a) md. 103/9: komisyon/vergi dikkate alınmaz ve nakde çevrilmeye bakılmaz", puan: 4}
    - {olcut: "(a) 2 × 400.000 = 800.000 TL alt sınır", puan: 5}
    - {olcut: "(b) 30 günlük süre ve feragat sonucu", puan: 6}
    - {olcut: "(c) %50 - %50 dağıtım ve idari yargı yolu", puan: 8}
  kaynaklar:
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 104/1, alinti: "Kurulca belirlenen piyasa bozucu eylemleri gerçekleştiren kişilere Kurul tarafından yirmi bin Türk Lirasından beş yüz bin Türk Lirasına kadar idari para cezası verilir. Ancak, bu suretle menfaat temin edilmiş olması hâlinde verilecek idari para cezasının miktarı bu menfaatin iki katından az olamaz."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 103/9, alinti: "Bu maddede ve Kanunun 104 üncü maddesinde belirtilen menfaat hesaplamalarında; kişinin menfaatin elde edilmesiyle bağlantılı işlemler ve faaliyetlerde ödediği komisyonlar, vergiler, kredi faizleri, danışmanlık ücretleri ve Kurulca benzer kapsamda olduğu değerlendirilen diğer maliyetler dikkate alınmaksızın ve elde edilen menfaatin nakde çevrilip çevrilmediğine bakılmaksızın hesaplama yapılır."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 105/1, alinti: "(1) İdari para cezalarının uygulanmasından önce ilgilinin savunması alınır. Savunma istendiğine ilişkin yazının tebliğ tarihinden itibaren otuz gün içinde savunma verilmemesi hâlinde, ilgilinin savunma hakkından feragat ettiği kabul edilir."}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 105/3-4, alinti: "(3) Tahsil edilen idari para cezalarının yüzde ellisi genel bütçeye gelir kaydedilir, yüzde ellisi gelir kaydedilmek üzere YTM’ye aktarılır. (4) Bu Kanun uyarınca verilen idari para cezası kararlarına karşı idari yargı yoluna başvurulabilir."}
