- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: SUC
  kazanimlar: [güveni kötüye kullanma, etkin pişmanlık]
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: |
    **Tera Yatırım Menkul Değerler A.Ş.**'nin (yatırım kuruluşu) yönetim kurulu üyesi **L** hakkında şu iddialar vardır:

    1. Müşteri **P**'nin saklama amacıyla Tera'ya teslim ettiği pay senetlerini L, kendi kredi borcuna teminat olarak rehnetmiştir.
    2. L, yönetim ve sermaye bakımından dolaylı ilişkili olduğu **Lale Danışmanlık Ltd. Şti.**'ne, emsallerine göre bariz biçimde farklı, çok yüksek bir komisyon uygulamıştır.

    L, 2. iddiaya ilişkin olarak pişmanlık göstererek ilgili ödemeyi ve bunun iki katı parayı Hazineye yatırmak istemektedir; ayrıca 1. iddia bakımından da aynı yoldan yararlanmayı talep etmektedir.

    **İstenenler:**
    (a) 1. ve 2. iddiadaki fiillerin SPKn bakımından hangi suçu oluşturduğunu belirtiniz; 1. iddia için hükmolunacak hapis cezasının alt sınırını belirtiniz. (7 puan)
    (b) L'nin pişmanlıktan yararlanma talebini, her iki iddia bakımından ayrı ayrı değerlendiriniz. (9 puan)
    (c) 2. iddia bakımından pişmanlığın soruşturma evresinde gösterilmesi hâlindeki ve kovuşturma evresinde hüküm verilinceye kadar gösterilmesi hâlindeki sonuçları belirtiniz. (8 puan)
  cozum: |
    **(a)** İki fiil de SPKn md. 110/1'de sayılan **güveni kötüye kullanma suçunun nitelikli hâlleridir**: 1. iddia (a) bendi (yatırım kuruluşuna emanet edilen sermaye piyasası araçlarını rehnetmek), 2. iddia (b) bendi (ilişkili olduğu kişiye emsallerine göre bariz biçimde farklı fiyat/ücret uygulamak). Bu durumda 5237 sayılı Kanunun 155. maddesinin ikinci fıkrasına göre hükmolunacak ceza **üç yıldan az olamaz**.

    **(b)** Etkin pişmanlık (md. 110/3) yalnızca md. 110/1'in **(b) ve (c)** bentleri kapsamındaki suçlar için öngörülmüştür.

    | İddia | Bent | Pişmanlıktan yararlanma |
    |---|---|---|
    | 1 | (a) | Yararlanamaz; hüküm kapsam dışıdır |
    | 2 | (b) | Yararlanabilir (md. 21/4 ödemesi + bunun iki katı Hazineye) |

    **(c)** 2. iddiada: soruşturma evresinde ödeme yapılırsa verilecek ceza **yarı oranında**, kovuşturma evresinde hüküm verilinceye kadar ödenirse **üçte biri oranında** indirilir; soruşturma başlamadan önce ödenseydi hakkında cezaya hükmolunmazdı.
  puanlama:
    - {olcut: "(a) 1. ve 2. iddiaların md. 110/1 (a) ve (b) bentlerinde nitelendirilmesi", puan: 4}
    - {olcut: "(a) Hapis cezasının üç yıldan az olamayacağı", puan: 3}
    - {olcut: "(b) Pişmanlığın yalnız (b) ve (c) bentlerine uygulanması", puan: 5}
    - {olcut: "(b) 1. iddia için talebin reddi, 2. iddia için kabulü", puan: 4}
    - {olcut: "(c) Soruşturma evresinde yarı, kovuşturma evresinde üçte bir indirim", puan: 8}
  kaynaklar:
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/1-a, alinti: "sermaye piyasası faaliyetleri sebebiyle veya emanetçi sıfatıyla veya idare etmek için veya teminat olarak veya her ne nam altında olursa olsun, kayden veya fiziken tevdi veya teslim edilen sermaye piyasası araçları, nakit ve diğer her türlü kıymeti kendisinin veya başkasının menfaatine satmak, kullanmak, rehnetmek, gizlemek veya inkâr etmek"}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/1, alinti: "Aşağıdaki fiiller güveni kötüye kullanma suçunun nitelikli hâlini oluşturur; ancak bu durumda 5237 sayılı Kanunun 155 inci maddesinin ikinci fıkrasına göre hükmolunacak ceza üç yıldan az olamaz:"}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/1-b, alinti: "b) Yönetim, denetim veya sermaye bakımından dolaylı veya dolaysız olarak ilişkili bulunduğu diğer bir teşebbüs veya şahısla emsallerine göre bariz şekilde farklı fiyat, ücret ve bedel uygulamak"}
    - {mevzuat: 6362 sayılı Sermaye Piyasası Kanunu, madde: md. 110/3, alinti: "(3) Birinci fıkranın (b) ve (c) bentleri kapsamına giren güveni kötüye kullanma suçunu işleyen kişi, etkin pişmanlık göstererek 21 inci maddenin dördüncü fıkrasında yer alan ödemenin yanı sıra bunun iki katı parayı Hazineye; a) Henüz soruşturma başlamadan önce ödediği takdirde, hakkında cezaya hükmolunmaz, b) Soruşturma evresinde ödediği takdirde, verilecek ceza yarısı oranında indirilir, c) Kovuşturma evresinde hüküm verilinceye kadar ödediği takdirde, verilecek ceza üçte biri oranında indirilir."}
