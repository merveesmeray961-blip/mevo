    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 5/1, alinti: "f) Yönetim kurulunun asgari olarak 3 kişiden oluşması, zorunludur."}
    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 15/1, alinti: "(1) Nitelikli yatırımcı olmayan gerçek kişiler, bir takvim yılı içinde paya dayalı kitle fonlaması yoluyla azami 50.000 Türk Lirası yatırım yapabilir. Ancak bu sınır 200.000 Türk Lirasını aşmamak kaydıyla, yatırımcının platforma beyan ettiği yıllık net gelirinin %10’u olarak uygulanabilir."}
    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 16/4, alinti: "Bilgi formunda açıklanmak ve ihraç sınırını geçmemek kaydıyla paya dayalı kitle fonlaması kapsamında talep edilen fon miktarının azami %20’sine kadar ek fon toplanabilir."}
    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 16/5, alinti: "(5) 1.000.000 Türk Lirasını aşan fon taleplerinde, hedeflenen fon tutarının toplanmış sayılması için hedeflenen fonun en az %5’ine tekabül eden tutarın kampanya süresi içinde nitelikli yatırımcılar tarafından karşılanmış olması zorunludur. Bu zorunluluk toplanan ek fon bakımından uygulanmaz."}
    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 16/4, alinti: "Bir girişim şirketi veya girişimci tarafından herhangi bir on iki aylık dönemde platformlar aracılığıyla paya dayalı olarak en fazla iki kampanya ile fon toplanabilir"}
    - {mevzuat: III-35A.2 Kitle Fonlaması Tebliği, madde: md. 16/7, alinti: "(7) Girişimciler veya girişim şirketlerinin kampanya sürecinin başladığı tarihteki ortaklarından fonlanan şirkette önemli etkiye sahip olacaklar, kampanya sürecinin başladığı tarihi takip eden 3 yıl içinde miras, mirasın paylaşımı, eşler arasındaki mal rejimi hükümleri veya cebri icra nedenleriyle yapılacak devirler ile nitelikli yatırımcılara ya da kendi aralarında yapacakları devirler hariç olmak üzere, fonlanan şirketteki paylarını devredemezler."}
