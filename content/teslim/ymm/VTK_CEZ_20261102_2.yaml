    **(b)** Md. 368: cezaya karşı dava açılmamışsa ceza, dava açma süresinin bittiği tarihten başlayarak bir ay içinde ödenir: 4/11/2026 + 1 ay = **4/12/2026** (Cuma).

    **(c)** Md. 376 vergi aslına tabi olmaksızın kesilen usulsüzlük cezaları hakkında da uygulanır. Ceza 40.000 TL'nin altında olduğundan indirim oranı %50 artırımlı, yani %75'tir. Ödenecek = 20.000 x (1 - 0,75) = **5.000 TL**. Ödeme vadesinde yapılır; vade, dava açma süresinin bittiği tarihten başlayan bir aylık süredir (4/12/2026).

