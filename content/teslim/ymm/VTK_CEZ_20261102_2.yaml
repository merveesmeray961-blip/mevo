- id: TASLAK
  sinav: ymm
  ders: VTK
  konu: CEZ
  kazanimlar:
  - izaha davet
  - pişmanlık ve ıslah
  - ceza indirimi
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: |
    **Olay:** Kuzey Gıda A.Ş. (sermaye şirketi), Haziran 2025 dönemi KDV beyannamesinde ödenecek KDV'yi 90.000 TL eksik beyan etmiştir (ödeme vadesi 28/7/2025). Şirket nezdinde vergi incelemesine başlanmamıştır ve konuda ihbar yoktur. Olay akışı:

    | Tarih | Gelişme |
    |---|---|
    | 2/3/2026 | Şirkete, eksik beyana ilişkin ön tespit nedeniyle izaha davet yazısı tebliğ edilmiştir. |
    | 20/3/2026 | Şirket izahta bulunmuştur. |
    | 6/4/2026 | İzah yeterli bulunmamış; değerlendirme sonucunu içeren yazı şirkete tebliğ edilmiştir. |
    | 28/4/2026 | Şirket düzeltme beyannamesini vermiş, eksik KDV'yi ve zammı ödemiştir. |

    Bu vakada gecikme zammı oranı aylık %3,5 alınacaktır (basit faiz). Fiil VUK md. 359 kapsamında değildir; gecikme faizi dikkate alınmayacaktır. 2026 yılında, VUK md. 370/b'deki sahte veya muhteviyatı itibarıyla yanıltıcı belge tutarı sınırı 870.000 TL'dir.

    **İstenenler:**

    (a) Şirketin izah için son gününü bulunuz ve şirketin, davet konusu tespit yönünden VUK md. 371'deki pişmanlık hükümlerinden yararlanıp yararlanamayacağını gerekçesiyle belirtiniz. (5 puan)

    (b) Şirketin 28/4/2026'da yaptığı işlemler sonucunda ödeyeceği toplam tutarı (vergi, zam ve ceza) hesaplayınız; 30 günlük sürenin şartı sağladığını gösteriniz. (7 puan)

    (c) Şirket, yazı üzerine hiçbir işlem yapmayıp inceleme sonucu ikmalen tarhiyata uğrasaydı ve bir kat vergi ziyaı cezası kesilip ihbarnamelerin tebliğinden itibaren otuz gün içinde VUK md. 376'dan yararlanılsaydı ödenecek ceza ile (b) şıkkındaki cezayı karşılaştırınız. (6 puan)

    (d) Şirketin 2025 yılı toplam mal ve hizmet alışları 30.000.000 TL'dir. Şirket hakkında, kullandığı sahte belge tutarının 1.200.000 TL olduğuna dair ön tespit yapılmıştır. Alışlar 20.000.000 TL olsaydı sonuç ne olurdu? İki durumu yorumlayınız. (5 puan)
  cozum: |
    **(a)** Yazının tebliği 2/3/2026; izahın yapılacağı otuz günlük süre tebliğ tarihinden başlar ve 1/4/2026'da dolar (2/3/2026 + 30 gün = 1/4/2026). Şirket 20/3/2026'da izahta bulunduğundan süre içindedir. Md. 370/a gereği izaha davet yazısı tebliğ edilen mükellef, davet konusu tespitle sınırlı olarak md. 371'deki pişmanlık hükümlerinden **yararlanamaz.**

    **(b)** Değerlendirme yazısı 6/4/2026'da tebliğ edilmiş; otuz gün 6/5/2026'da dolar. Beyanname ve ödeme 28/4/2026'da yapıldığından süre içindedir.

    | Kalem | Hesap | Tutar |
    |---|---|---|
    | Eksik KDV | 90.000 | 90.000 |
    | Gecikme zammı | 28/7/2025 vadeden 28/4/2026'ya 9 ay: 90.000 x %3,5 x 9 | 28.350 |
    | Vergi ziyaı cezası (%20) | 90.000 x %20 | 18.000 |
    | **Toplam** | | **136.350** |

    **(c)** Bir kat ceza = 90.000 TL; md. 376 ile yarısı indirilir: 45.000 TL ödenir. Md. 370 yolunda ceza 18.000 TL olduğundan fark 45.000 - 18.000 = **27.000 TL** lehine olur. Md. 370 yoluna uygun hareket eden mükellef daha az ceza öder.

    **(d)** Md. 370/b uyarınca sahte belge tutarı 870.000 TL'yi aşıyorsa bile yıllık toplam mal ve hizmet alışlarının %5'ini aşmıyorsa ön tespit yazısı tebliğ edilebilir. Alışlar 30.000.000 TL ise %5 = 1.500.000 TL; 1.200.000 TL bunu aşmaz, yazı tebliğ edilebilir ve mükellef 30 gün içinde ödeme yaparsa ceza %20 olur. Alışlar 20.000.000 TL ise %5 = 1.000.000 TL; 1.200.000 TL hem 870.000 TL sınırını hem %5 sınırını aşar, mükellef izaha davet edilmez ve ön tespit yazısı da tebliğ edilmez.

    Püf noktaları: (1) İzaha davet edilen mükellef davet konusunda pişmanlıktan yararlanamaz. (2) Gecikme zammında "ay ve kesri" tam ay sayılır. (3) Sahte belgede iki sınırdan birini aşmamak yeterlidir: 870.000 TL'yi geçmemek veya alışların %5'ini aşmamak.
  puanlama:
  - olcut: (a) Otuz günlük sürenin hesabı (1/4/2026)
    puan: 2
  - olcut: (a) İzaha davet edilenin md. 371'den yararlanamayacağı
    puan: 3
  - olcut: (b) Otuz günlük sürenin 6/5/2026'da dolması, şartın sağlandığı
    puan: 2
  - olcut: (b) Zam süresi 9 ay ve zam tutarı 28.350
    puan: 3
  - olcut: (b) %20 ceza 18.000 ve toplam 136.350
    puan: 2
  - olcut: (c) Bir kat ceza ve md. 376 ile 45.000
    puan: 4
  - olcut: (c) 27.000 TL fark
    puan: 2
  - olcut: (d) 870.000 TL ve %5 ölçütünün uygulanması, iki durumda sonuç
    puan: 5
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/a
    alinti: Kendisine izaha davet yazısı tebliğ edilen mükellefler, davet konusu tespitle sınırlı olarak, bu Kanunun 371 inci maddesinde yer alan pişmanlık hükümlerinden yararlanamaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/a
    alinti: İzaha davet yazısının tebliğ tarihinden itibaren otuz günlük süre içerisinde izahta bulunulması durumunda, yapılan izah değerlendirilerek değerlendirme sonucunu içeren yazı mükellefe tebliğ edilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/a-2
    alinti: bir zamla aynı sürede ödenmesi şartıyla vergi ziyaı cezası, ziyaa uğratılan vergi üzerinden %20 oranında kesilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 370/b
    alinti: sahte veya muhteviyatı itibarıyla yanıltıcı belge tutarı, bir takvim yılında 100 bin (870.000 TL) Türk lirasını geçmeyen veya bu tutarı geçse bile ilgili yıldaki toplam mal ve hizmet alışlarının %5’ini aşmayan mükelleflere ön tespite ilişkin yazı tebliğ edilebilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 376/1
    alinti: ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi dairesine başvurarak vadesinde veya 6183 sayılı Kanunda belirtilen türden teminat göstererek vadenin bitmesinden itibaren üç ay içinde ödeyeceğini bildirirse kesilen cezanın yarısı,
  dogrulama:
    python: |
      kdv = 90000
      zam = kdv * 0.035 * 9
      ceza = kdv * 0.20
      b = kdv + zam + ceza
      c_fark = kdv / 2 - ceza
      sonuc = {'b_zam': zam, 'b_ceza': ceza, 'b': b, 'c_fark': c_fark, 'd1': 0.05 * 30000000, 'd2': 0.05 * 20000000}
