- id: TASLAK
  sinav: ymm
  ders: VTK
  konu: CEZ
  kazanimlar:
  - uzlaşma ve izaha davet
  - ceza indirimi
  - vergi ziyaı ve usulsüzlük cezaları
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: |
    **Olay:** Doğa Mobilya San. A.Ş. nezdinde 2026 yılında yapılan vergi incelemesi sonucunda 2025 hesap dönemine ilişkin ikmalen tarhiyat yapılmış, ihbarnameler şirkete 8/6/2026'da tebliğ edilmiştir. Şirket 359 uncu maddede yazılı bir fiil işlememiştir.

    | Tespit | Tutar |
    |---|---|
    | Kurumlar vergisi matrah farkı | 600.000 TL (oran %25) |
    | Vergi ziyaı cezası | Ziyaa uğratılan verginin bir katı |
    | Usulsüzlük cezası (fiil bazında toplam) | 35.000 TL |
    | Özel usulsüzlük cezası (fiil bazında toplam) | 60.000 TL |

    2026 yılında, VUK Ek md. 1 uyarınca uzlaşmaya konu edilebilecek usulsüzlük ve özel usulsüzlük cezaları için sınır 40.000 TL'dir (40.000 TL ve altındaki cezalarda VUK md. 376'daki indirim oranı %50 artırımlı uygulanır). Gecikme faizi ve zammı dikkate alınmayacaktır.

    **İstenenler:**

    (a) Uzlaşmaya konu edilebilecek kalemleri gerekçesiyle belirtiniz; talep süresinin son gününü bulunuz. (6 puan)

    (b) Şirketin VUK md. 376 hükmünden yararlanarak ihbarname tebliğinden itibaren otuz gün içinde başvurması ve ödemeyi vadesinde yapması hâlinde ödeyeceği toplam tutarı hesaplayınız. (7 puan)

    (c) Şirket uzlaşma talebinde bulunmuş, uzlaşma sağlanamamış ve uzlaşmanın vaki olmadığına dair tutanak 3/9/2026'da tebliğ edilmiştir. Cezalar için dava açma süresinin son gününü belirleyiniz. (6 puan)

    (d) Şirketin aynı ceza için hem uzlaşma hem de VUK md. 376 hükmünden yararlanmak istemesinin mümkün olup olmadığını açıklayınız. (4 puan)
  cozum: |
    **(a)** Ek md. 1'e göre uzlaşma, ikmalen/re'sen/idarece tarh edilen vergilere ilişkin **cezalar** hakkındadır; vergi aslı uzlaşma konusu değildir.

    | Ceza | Tutar | Uzlaşma konusu mu? |
    |---|---|---|
    | Vergi ziyaı cezası | 150.000 | Evet |
    | Usulsüzlük cezası | 35.000 | Hayır (40.000 TL'yi aşmıyor) |
    | Özel usulsüzlük cezası | 60.000 | Evet (40.000 TL'yi aşıyor) |

    Uzlaşma talebi ihbarnamenin tebliğ tarihinden itibaren otuz gün içinde yapılır: 8/6/2026 + 30 gün = **8/7/2026** (Çarşamba).

    **(b)** Vergi = 600.000 x %25 = 150.000 TL (indirim yok). Vergi ziyaı cezası 150.000 TL: yarısı indirilir, 75.000 TL ödenir. 40.000 TL ve altındaki usulsüzlük cezası 35.000 TL'de indirim oranı %50'nin %50 artırımlısı, yani %75'tir: 35.000 x %25 = 8.750 TL. Özel usulsüzlük cezası 60.000 TL: %50 indirimle 30.000 TL.

    | Kalem | Ödenecek |
    |---|---|
    | Vergi | 150.000 |
    | Vergi ziyaı cezası | 75.000 |
    | Usulsüzlük cezası | 8.750 |
    | Özel usulsüzlük cezası | 30.000 |
    | **Toplam** | **263.750** |

    **(c)** Cezalara karşı vergi mahkemesinde dava açma süresi tebliğden itibaren 30 gündür; ihbarnamenin tebliği (8/6/2026) üzerinden bu süre 8/7/2026'da bitmiştir. Dava açma müddeti bitmiş olduğundan, tutanağın tebliği tarihinden itibaren 15 gün olarak uzar: 3/9/2026 + 15 gün = **18/9/2026** (Cuma).

    **(d)** Hakkında md. 376/1 uygulanan cezalar için uzlaşma hükümleri uygulanmaz; uzlaşılan cezalar hakkında da başkaca indirim yapılmaz. Dolayısıyla aynı ceza için ikisi birlikte kullanılamaz. Ancak mükellef, uzlaşma tutanağını imzalayıncaya kadar uzlaşma talebinden vazgeçerek md. 376'nın uygulanmasını isteme hakkını korur.

    Püf noktaları: (1) 7524 sayılı Kanun sonrasında uzlaşma yalnız cezalar için yapılır. (2) 376'daki %50 indirim, 40.000 TL ve altı usulsüzlük cezalarında %75 olur. (3) Uzlaşma vaki olmazsa dava süresi, bitmiş veya 15 günden az kalmışsa, tutanak tebliğinden itibaren 15 gün olur.
  puanlama:
  - olcut: (a) Uzlaşmanın yalnız cezalar için yapılabildiğinin belirtilmesi
    puan: 2
  - olcut: (a) Vergi ziyaı ve özel usulsüzlük cezasının uzlaşma konusu olması; 35.000 TL cezanın olmaması
    puan: 2
  - olcut: (a) Talep süresinin son günü (8/7/2026)
    puan: 2
  - olcut: (b) Vergi aslı 150.000 ve vergi ziyaı cezasında 75.000
    puan: 2
  - olcut: (b) 35.000 TL cezada %75 indirimle 8.750
    puan: 3
