    **İstenenler:**

    (a) Cezaya karşı vergi mahkemesinde dava açma süresinin son gününü bulunuz. (4 puan)

    (b) Şirket dava açmayıp cezayı olduğu gibi ödeyecekse ödeme süresinin son gününü bulunuz. (5 puan)

    (c) Şirket 4/11/2026 tarihine kadar VUK md. 376 uyarınca ilgili vergi dairesine başvurup ödeyeceğini bildirirse ödeyeceği tutarı ve ödeme süresinin son gününü belirleyiniz. (8 puan)

    (d) Şirket dava açarsa 376 hükmünden yararlanıp yararlanamayacağını, dava reddedilir ve mahkeme kararı üzerine düzenlenen ihbarname 15/3/2027'de tebliğ edilirse ödeme süresinin son gününü belirtiniz. (5 puan)
  cozum: |
