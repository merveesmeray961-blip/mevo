    | Kalem | Bilgi |
    |---|---|
    | Satış miktarı / birim satış fiyatı | 100.000 adet / 80 TL |
    | Dönem başı mamul stoku | 10.000 adet; birim maliyet 50 TL |
    | Dönem sonu hedef mamul stoku | 15.000 adet |
    | Birim değişken üretim maliyeti | Direkt ilk madde 20 TL, direkt işçilik 12 TL, değişken genel üretim gideri 6 TL |
    | Yıllık sabit genel üretim gideri | 1.260.000 TL (üretim miktarına bölünerek birim maliyete katılır) |
    | Satış ve dağıtım gideri | Adet başına 5 TL değişken, ayrıca yıllık 900.000 TL sabit |
    | Faiz gideri | 120.000 TL |
    | Kurumlar vergisi oranı | %25 |

    Stoklar ilk giren ilk çıkar yöntemiyle izlenmektedir; bütçe dönemi birim maliyeti 50 TL olarak gerçekleşecektir.

    **İstenenler:**
    (a) Üretim bütçesini hazırlayınız (adet). (4 puan)
    (b) Dönem üretim maliyet bütçesini ve birim tam maliyeti bulunuz. (6 puan)
    (c) Bütçelenmiş gelir tablosunu (satılan mamul maliyeti, brüt kâr, faaliyet kârı ve net kâr) hazırlayınız. (10 puan)
  cozum: |
    **(a)** Üretim = 100.000 + 15.000 − 10.000 = **105.000 adet**.

    **(b)**

    | Kalem | Tutar (TL) |
    |---|---|
    | Direkt ilk madde (105.000 × 20) | 2.100.000 |
    | Direkt işçilik (105.000 × 12) | 1.260.000 |
    | Değişken genel üretim gideri (105.000 × 6) | 630.000 |
    | Sabit genel üretim gideri | 1.260.000 |
    | **Üretim maliyeti** | **5.250.000** |

    Birim tam maliyet = 5.250.000 / 105.000 = **50 TL**.

    **(c)** FIFO'ya göre önce dönem başı stok satılır: Satılan mamul maliyeti = 10.000 × 50 + 5.250.000 − 15.000 × 50 = **5.000.000 TL**.

    | Kalem | Tutar (TL) |
    |---|---|
    | Satışlar (100.000 × 80) | 8.000.000 |
    | Satılan mamul maliyeti | -5.000.000 |
    | **Brüt kâr** | **3.000.000** |
    | Satış ve dağıtım gideri (500.000 + 900.000) | -1.400.000 |
    | **Faaliyet kârı** | **1.600.000** |
    | Faiz gideri | -120.000 |
    | Vergi öncesi kâr | 1.480.000 |
    | Kurumlar vergisi (%25) | -370.000 |
    | **Net kâr** | **1.110.000** |
  puanlama:
  - olcut: (a) üretim bütçesi
    puan: 4
  - olcut: (b) üretim maliyeti ve birim maliyet
    puan: 6
  - olcut: (c) bütçelenmiş gelir tablosu
    puan: 10
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 21
    alinti: Standart maliyetler; hammadde ve malzemenin, işçiliğin, etkinliğin ve kapasite kullanımının normal düzeylerini dikkate alır. Standart maliyetler düzenli olarak gözden geçirilir ve gerek görülürse mevcut koşullar dikkate alınarak yeniden belirlenir.
  - mevzuat: MSUGT 1 sıra no.lu Tebliğ eki Tekdüzen Hesap Planı
    madde: 152 Mamuller
    alinti: 'Üretim çalışmaları sonunda elde edilen ve satışa hazır hale gelmiş bulunan mamullerin izlendiği hesaptır. İşleyişi : Bu hesap, üretimi tamamlanan mamullerin ambarlara alınmasıyla borçlandırılır. Satılması veya herhangi bir nedenle ambardan çekilmesi ile alacaklandırılır.'
  dogrulama:
    python: |
      satis = 100000
      fiyat = 80
      bas_stok = 10000
      son_stok = 15000
      uretim = satis + son_stok - bas_stok
      dm = uretim * 20
      dis = uretim * 12
      vguc = uretim * 6
      sguc = 1260000
      uret_mal = dm + dis + vguc + sguc
      birim = uret_mal / uretim
      smm = bas_stok * 50 + uret_mal - son_stok * birim
      ciro = satis * fiyat
      brut = ciro - smm
      faal_gider = satis * 5 + 900000
      faal_kar = brut - faal_gider
      vergi_once = faal_kar - 120000
      vergi = vergi_once * 0.25
      net = vergi_once - vergi
      sonuc = {'a': uretim, 'b': uret_mal, 'c': net, 'smm': smm}
