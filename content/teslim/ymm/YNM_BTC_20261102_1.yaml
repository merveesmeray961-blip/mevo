  - mevzuat: MSUGT 1 sıra no.lu Tebliğ eki Tekdüzen Hesap Planı
    madde: 710 Direkt İlkmadde ve Malzeme Giderleri
    alinti: Bu giderler, esas üretim gider yerleri ile ilgili olup, mamülün bünyesine giren, mamülün temel öğesini oluşturan ve mamülün bünyesine doğrudan yüklenebilen maddelerin kullanımı fiili tutarlarla bu hesapta izlenir. Üretimde kullanılmayan ve satılan ilkmadde ve malzemenin maliyeti bu hesapta izlenmez.
  dogrulama:
    python: |
      s_tem = 20000
      s_agu = 25000
      s_eyl = 30000
      s_eki = 24000
      s_kas = 20000
      u_tem = s_tem + 0.2 * s_agu - 0.2 * s_tem
      u_agu = s_agu + 0.2 * s_eyl - 0.2 * s_agu
      u_eyl = s_eyl + 0.2 * s_eki - 0.2 * s_eyl
      u_eki = s_eki + 0.2 * s_kas - 0.2 * s_eki
      i_tem = 2 * u_tem
      i_agu = 2 * u_agu
      i_eyl = 2 * u_eyl
      i_eki = 2 * u_eki
      a_tem = i_tem + 0.25 * i_agu - 0.25 * i_tem
      a_agu = i_agu + 0.25 * i_eyl - 0.25 * i_agu
      a_eyl = i_eyl + 0.25 * i_eki - 0.25 * i_eyl
