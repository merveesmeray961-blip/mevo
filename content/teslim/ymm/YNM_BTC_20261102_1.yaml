    Verim Tekstil Ticaret A.Ş. perakende satışla uğraşmaktadır. Satılan ticari mal maliyeti, net satışların %60'ıdır. Beklenen aylık satışlar (TL): Mart 500.000; Nisan 600.000; Mayıs 800.000; Haziran 700.000; Temmuz 500.000.

    Mal alımları ile ilgili varsayımlar:
    - Her ayın sonunda ticari mal stoku, izleyen ayın satılan mal maliyetinin %50'si düzeyindedir; Mart başı stoku da bu ilkeye uygundur.
    - Alımların %40'ı alım ayında peşin, %60'ı izleyen ayda ödenir.

    **İstenenler:**
    (a) Nisan, Mayıs ve Haziran ayları için mal alım bütçesini hazırlayınız. (8 puan)
    (b) Mayıs ve Haziran aylarında satıcılara yapılacak ödemeleri bulunuz. (6 puan)
    (c) 30 Haziran itibarıyla satıcılara borç bakiyesini ve ticari mal stokunu bulunuz. (6 puan)
  cozum: |
    Satılan mal maliyetleri: Mart 300.000, Nisan 360.000, Mayıs 480.000, Haziran 420.000, Temmuz 300.000 TL.

    **(a)** Alım = satılan mal maliyeti + hedef son stok − başlangıç stoku. Başlangıç stoku önceki ayın hedef son stokudur; bu yüzden alım = %50 × (cari ay maliyeti + izleyen ay maliyeti).

    | | Nisan | Mayıs | Haziran |
    |---|---|---|---|
    | Satılan mal maliyeti | 360.000 | 480.000 | 420.000 |
    | + Hedef son stok | 240.000 | 210.000 | 150.000 |
    | − Başlangıç stoku | 180.000 | 240.000 | 210.000 |
    | **Alım** | **420.000** | **450.000** | **360.000** |

    Kontrol: Nisan alımı = 360.000 + 240.000 − 180.000 = 420.000 TL.

    **(b)** Mayıs ödemesi = 0,40 × 450.000 + 0,60 × 420.000 = 180.000 + 252.000 = 432.000 TL. Haziran ödemesi = 0,40 × 360.000 + 0,60 × 450.000 = **414.000 TL**.

    **(c)** Haziran sonu satıcı borcu = 0,60 × 360.000 = **216.000 TL**; stok = 0,5 × 300.000 = **150.000 TL**.
