  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  dogrulama:
    python: |
      kA = 45
      kB = 30
      c1 = 400 * kA
      c2 = 350 * kB
      A = (2 * 800 - 700) / 3
      B = 800 - 2 * A
      opt = A * kA + B * kB
      A2 = (2 * 890 - 700) / 3
      B2 = 890 - 2 * A2
      opt2 = A2 * kA + B2 * kB
      gain = opt2 - opt
