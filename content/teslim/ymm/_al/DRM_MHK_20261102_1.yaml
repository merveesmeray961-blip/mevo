  soru: '**Olay:** Meriç Yeminli Mali Müşavirler Odası''na kayıtlı üye sayısı 120''dir. Oda yönetim kurulu, üç yılda bir yapılan
    olağan genel kurulu 22 Mayıs 2026 Cuma günü saat 14.00''te toplamaya karar vermiştir. Odanın yönetim, disiplin ve denetleme
    kurullarında, üye sayısına göre yönetmelik ve kanunda öngörülen asıl üye sayısı kadar üye bulunmaktadır. Genel kurulun
    ilk toplantısında salt çoğunluk sağlanamazsa ikinci toplantı yapılacaktır.


    **İstenenler:**


    (a) Genel kurul toplantısının yeri, günü, saati, gündemi ile ikinci toplantıya ilişkin bilgilerin en geç hangi tarihte
    ve hangi yöntemle ilan edilmesi gerektiğini, ilk toplantının yapılabilmesi için gereken en az üye sayısını belirtiniz.
    (5 puan)


    (b) İlk toplantıda çoğunluk sağlanamamış ve ikinci toplantıya 24 üye katılmıştır. Üç kuruldaki asıl üye sayılarını göstererek
    ikinci toplantının yapılıp yapılamayacağını hesaplayınız; katılımın 27 olması hâlinde bir kararın alınabilmesi için gereken
    en az olumlu oy sayısını bulunuz. (7 puan)


    (c) Genel kurulda başkanlık divanının kimlerden oluştuğunu belirtiniz; oda disiplin kurulu üyesi Ayhan Bey ile yönetim
    kurulu başkanı Gül Hanım''ın divana seçilip seçilemeyeceğini gerekçesiyle açıklayınız. (5 puan)


    (d) Üyelerden 23''ü yönetim kurulu başkanına, belirttikleri konuların görüşülmesi için genel kurulun toplanmasını yazılı
    olarak talep etmiştir. Zorunlu çağrı için gereken en az üye sayısını ve çağrının yapılma süresini açıklayınız. (6 puan)

    '
  cozum: '**(a)** Toplantı yeri, günü, saati, gündemi ve ikinci toplantı bilgileri, ilk toplantı tarihinden en az 10 gün öncesinden
    başlayarak toplantı tarihine kadar yayımda kalacak şekilde odanın resmî internet sitesinde ilan edilir. İlk toplantı 22/5/2026
    olduğundan ilan en geç **12 Mayıs 2026**''da yapılmalıdır. Genel kurul üye sayısının salt çoğunluğu ile toplanır: 120
    / 2 = 60, salt çoğunluk **61 üyedir**.


    **(b)** Üye sayısı binin altında olduğundan yönetim kurulu 5 asıl, 50''den fazla üye bulunduğundan disiplin kurulu 5 asıl,
    denetleme kurulu 3 asıl üyedir.


    | Kurul | Asıl üye |

    |---|---|

    | Yönetim | 5 |

    | Disiplin | 5 |

    | Denetleme | 3 |

    | Toplam | 13 |


    İkinci toplantıda çoğunluk aranmaz; ancak katılan üye sayısı asıl üyeler toplamının iki katından (13 x 2 = **26**) az
    olamaz. 24 üye katıldığından toplantı **yapılamaz**. 27 üye katılırsa toplantı yapılır; kararlar hazır bulunanların salt
    çoğunluğu ile alındığından 27 / 2 = 13,5, yani en az **14 olumlu oy** gerekir.


    **(c)** Divan; bir başkan, bir başkanvekili ve iki katip üyeden oluşur. Yönetim kurulu başkanı, yönetim ve denetleme kurulu
    üyeleri divana seçilemez. Bu nedenle Gül Hanım (yönetim kurulu başkanı) **seçilemez**; yasak sayımında disiplin kurulu
    üyeleri bulunmadığından Ayhan Bey **seçilebilir**.


    **(d)** Yönetim kurulu başkanı, kayıtlı üyelerin beşte birinin yazılı talebi üzerine en geç 15 gün içinde genel kurulu
    toplantıya çağırmak zorundadır. 120 / 5 = 24 olduğundan 23 üyenin talebi **yeterli değildir**; zorunlu çağrı için en az
    **24 üye** gerekir ve çağrı en geç **15 gün** içinde yapılır.


    Püf noktaları: (1) Kurul üye sayıları üye sayısına göre değişir; önce sayıyı belirleyin. (2) Divana seçilemeyecekler listesinde
    disiplin kurulu yoktur. (3) Beşte bir hesabında yetmeyen tek üye bile talebi geçersiz kılar.

    '
