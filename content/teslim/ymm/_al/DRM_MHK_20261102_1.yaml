  soru: '**Olay:** Doğukent Yeminli Mali Müşavirler Odası''nın kayıtlı üye sayısı 1.250''dir. Oda genel kurulunda yönetim
    kurulu seçimi yapılacaktır. Adaylar hakkındaki bilgiler aşağıdadır:


    | Aday | Durum |

    |---|---|

    | Ece | Odaya kayıtlı olduğu süre 2 yıl 8 aydır; mesleki faaliyetini fiilen yürütmektedir. |

    | Fikret | Odaya 9 yıldır kayıtlıdır; önceki iki seçim döneminde art arda iki kez yönetim kurulu başkanlığına seçilmiş,
    son dönem sona ermiş ve yeni dönem seçimi hemen yapılmaktadır. |

    | Hale | Odaya 6 yıldır kayıtlıdır; yeminli mali müşavir ruhsatı bulunmakla birlikte hiçbir şekilde mesleki faaliyette
    bulunmamaktadır. |


    Seçim sonrasında yönetim kurulu üyesi Berk, ardı ardına üç olağan toplantıya özürsüz katılmamış ve yönetim kurulu bu nedenle
    8/9/2026''da karar alarak kararı Berk''e aynı gün tebliğ etmiştir.


    **İstenenler:**


    (a) Yönetim kurulunun asıl ve yedek üye sayısını ve kurulun karar nisabını belirtiniz. (5 puan)


    (b) Ece, Fikret ve Hale''nin yönetim kurulu üyeliğine seçilip seçilemeyeceğini ayrı ayrı gerekçelendiriniz. (9 puan)


    (c) Berk''in durumunu ve Berk''in başvurabileceği yolu, süresiyle birlikte açıklayınız; hesaplanan süre sonu tarihini
    yazınız. (5 puan)


    (d) Berk''in yerine kurula kimin getirileceğini belirtiniz. (4 puan)

    '
  cozum: '**(a)** Üye sayısı bin ile beşbin arasında olduğundan yönetim kurulu **7 asıl ve 7 yedek** üyeden oluşur. Kurul,
    üye tam sayısının salt çoğunluğu ile karar verir: 7 / 2 = 3,5, yani **4 oy**.


    **(b)**


    | Aday | Sonuç | Gerekçe |

    |---|---|---|

    | Ece | Seçilemez | Üye sayısı yüzden az olmadığından en az 3 yıl kıdem aranır; 2 yıl 8 ay yetersizdir. |

    | Fikret | Seçilemez | Üst üste iki seçim döneminde iki kez başkanlığa seçilenler, aradan iki seçim dönemi geçmedikçe
    yönetim kuruluna seçilemez. |

    | Hale | Seçilemez | Kurul üyeleri fiilen mesleki faaliyette bulunanlar arasından seçilir. |


    **(c)** Ardı ardına üç olağan toplantıya özürsüz katılmayan üye, yönetim kurulu kararı ile **istifa etmiş sayılır**. Bu
    karara karşı tebliğ tarihinden itibaren **15 gün** içinde Birliğe itiraz edilebilir. Karar 8/9/2026''da tebliğ edildiğinden
    süre **23/9/2026**''da sona erer.


    **(d)** Asıl üyelikte boşalma olursa yedeklerden sırasıyla **en fazla oy alanlar** kurula getirilir; yeni üye ilk toplantıya
    çağrılır.


    Püf noktaları: (1) "Üye sayısı yüzden az" istisnasını mutlaka kontrol edin; burada oda büyüktür. (2) Başkanlık yasağı
    kurul üyeliğinin tamamını kapsar. (3) Süre tebliğden sonraki gün başlar; 8/9 tarihinden 15 gün sonrası 23/9 tarihidir.

    '
