    | Organ | Listedeki asıl üye durumu |

    |---|---|

    | Birlik Yönetim Kurulu (Liste A) | 9 asıl üyeden 4''ü yeminli mali müşavirdir; başkan adayı Cemil Bey 4 yıl 11 aydır
    yeminli mali müşavirlik yapmaktadır. |

    | Birlik Disiplin Kurulu (Liste B) | 5 asıl üyeden 3''ü yeminli mali müşavirdir. |

    | Birlik Denetleme Kurulu (Liste C) | 3 asıl üyenin hiçbiri yeminli mali müşavir değildir. |


    Ayrıca Selin Hanım hem Liste A''da yönetim kurulu üyeliği hem de Liste C''de denetleme kurulu üyeliği için aday gösterilmiştir.


    **İstenenler:**


    (a) Birlik yönetim, disiplin ve denetleme kurullarının asıl ve yedek üye sayılarını ve her kurulda aranan yeminli mali
    müşavir şartını belirtiniz. (8 puan)


    (b) Liste A, B ve C''nin yeminli mali müşavir sayısı yönünden uygun olup olmadığını değerlendiriniz. (6 puan)


    (c) Cemil Bey''in Birlik Yönetim Kurulu başkanı seçilip seçilemeyeceğini açıklayınız. (4 puan)


    (d) Selin Hanım''ın iki kurul için birden aday gösterilmesinin hukuki durumunu açıklayınız. (4 puan)

    '
  cozum: '**(a)**


    | Kurul | Asıl / yedek | Yeminli mali müşavir şartı |

    |---|---|---|

    | Yönetim | 9 asıl, 9 yedek | Üyelerden beşinin yeminli mali müşavir olması zorunludur |

    | Disiplin | 5 asıl, 5 yedek | Asıl üyelerin üçünün yeminli mali müşavir olması mecburidir; Genel Kurulda bu sayıda yeminli
    mali müşavir yoksa bulunanlarla yetinilir |

    | Denetleme | 3 asıl, 3 yedek | En az birinin yeminli mali müşavir olması zorunludur |


    **(b)** Liste A''da 4 yeminli mali müşavir vardır; en az 5 gerektiğinden **uygun değildir**. Liste B''de 3 yeminli mali
    müşavir vardır; şart sağlandığından **uygundur**. Liste C''de hiç yeminli mali müşavir yoktur; en az bir kişi zorunlu
    olduğundan **uygun değildir**.


    **(c)** Birlik Yönetim Kurulu başkanı, en az beş yıl süreyle yeminli mali müşavirlik yapmış olanlar arasından seçilir.
