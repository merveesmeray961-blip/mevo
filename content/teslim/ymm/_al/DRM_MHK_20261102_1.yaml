    kalacak şekilde **Birlik resmî internet sitesinde** duyurulur. 12 Eylül 2026 - 20 gün = en geç **23 Ağustos 2026**.


    **(b)** Genel Kurul temsilcilerin tam sayısının salt çoğunluğu ile toplanır: 180 / 2 = 90, salt çoğunluk **91 temsilcidir**.
    150 temsilci bu sayıyı aştığından toplantı yapılabilir.


