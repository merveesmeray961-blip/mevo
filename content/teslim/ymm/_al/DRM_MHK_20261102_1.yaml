    | Berna | 7 yıl bağımsız, ayrıca 3 yıl 1 ay bir işyerine bağlı olarak serbest muhasebeci mali müşavirlik yapmıştır. |

    | Cem | Vergi inceleme yetkisi almış ve mesleki yeterlilik sınavını vermiştir; yetkiyi aldıktan sonra kamu kurumlarında
    6 yıl, ardından bağımsız serbest muhasebeci mali müşavir olarak 2 yıl çalışmıştır. |


    Meslek mensubu olmak isteyen üç kişinin ceza geçmişi de incelenecektir: Pınar 2015''te kasten yaralamadan 8 ay hapis;
    Rıza 2016''da kasten işlediği bir suçtan 1 yıl 3 ay hapis; Selma 2014''te sahtecilikten 5 ay hapis cezasına mahkûm olmuştur
    (TCK md. 53''teki süreler geçmiştir).


    **İstenenler:**


    (a) Yeminli mali müşavir olabilmenin özel şartlarını yazınız. (4 puan)


    (b) Ali, Berna ve Cem''in ruhsat alıp alamayacağını süre hesabıyla gerekçelendiriniz. (8 puan)


    (c) Pınar, Rıza ve Selma''nın meslek mensubu olma yönünden genel şart durumunu açıklayınız. (6 puan)


    (d) Ruhsat alan kişilerin görevlerine başlamadan önce yapmaları gereken işlemi belirtiniz. (4 puan)

    '
