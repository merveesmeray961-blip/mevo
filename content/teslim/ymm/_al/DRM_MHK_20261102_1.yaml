  soru: '**Olay:** TÜRMOB Genel Kurulu 2026 yılında toplanacaktır. Birlik genel kuruluna temsilci gönderecek dört yeminli
    mali müşavirler odasının 2026 yılı başı itibarıyla kayıtlı üye sayıları aşağıdadır:


    | Oda | Kayıtlı üye sayısı |

    |---|---|

    | Karadere | 30 |

    | Ovakent | 112 |

    | Yaylacık | 187 |

    | Çamlıdağ | 188 |


    Her odanın temsilcilerinin seçilmesinde kanundaki oran esas alınacaktır.


    **İstenenler:**


    (a) Her odanın seçeceği asıl temsilci sayısını gerekçesiyle hesaplayınız ve toplam asıl temsilci sayısını bulunuz. (9
    puan)


    (b) Odaların seçebileceği toplam yedek temsilci sayısını açıklayınız. (3 puan)


    (c) Birlik Genel Kurulunun olağan toplantı zamanını ve toplam asıl temsilci sayısına göre toplantı nisabını belirtiniz.
    (5 puan)


    (d) Olağanüstü toplantı için temsilcilerden en az kaç kişinin yazılı talebi gerektiğini hesaplayınız. (5 puan)

    '
  cozum: '**(a)** Her oda üye sayısına bağlı olmaksızın 3 temsilci seçer; buna üyelerin 75''te biri oranında temsilci eklenir.
    Bu oranın yarısından (75 / 2 = 37,5 üye) az olan artık dikkate alınmaz, yarısından fazla olan tüme tamamlanır.


    | Oda | Üye | 75''lik tam kısım | Artık | Artık >= 37,5? | Ek temsilci | Toplam |

    |---|---|---|---|---|---|---|

    | Karadere | 30 | 0 | 30 | Hayır | 0 | 3 |

    | Ovakent | 112 | 1 | 37 | Hayır | 1 | 4 |

    | Yaylacık | 187 | 2 | 37 | Hayır | 2 | 5 |

    | Çamlıdağ | 188 | 2 | 38 | Evet | 3 | 6 |


    Toplam asıl temsilci = 3 + 4 + 5 + 6 = **18**.


    **(b)** Her oda, asıl temsilci sayısına kadar yedek temsilci seçer: **18** yedek temsilci.


    **(c)** Genel kurul üç yılda bir Eylül ayında toplanır ve temsilcilerin tam sayısının salt çoğunluğu ile toplanır: 18
    / 2 = 9, salt çoğunluk **10 temsilcidir**.


    **(d)** Mevcut temsilcilerin beşte birinin yazılı talebi ile genel kurul olağanüstü toplantıya çağrılır: 18 / 5 = 3,6
    olduğundan en az **4 temsilcinin** talebi gerekir.


    Püf noktaları: (1) 187 ile 188 arasındaki tek üye fark yaratır; yarım oran 37,5 üyedir. (2) Beşte bir kesirli çıkarsa
    yukarı yuvarlayın.

    '
