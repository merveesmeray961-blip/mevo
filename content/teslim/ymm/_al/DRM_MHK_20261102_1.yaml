    | A | Maliye lisans | 16 yıl |

    | B | Hukuk lisansüstü | 14 yıl |

    | C | Makine mühendisliği lisans | 20 yıl |


    Sınav sonuçlarına yapılan itiraz üzerine dava açılmış ve mahkeme bilirkişi incelemesine gerek görmüştür.


    **İstenenler:**


    (a) Sınavın kim tarafından, hangi biçimde yapıldığını; sınav komisyonunun üye sayısını, dağılımını ve komisyon üyelerini
    kimin seçtiğini belirtiniz. (6 puan)


    (b) A, B ve C''nin komisyon üyeliğine aday gösterilip gösterilemeyeceğini gerekçelendiriniz. (6 puan)


    (c) Bilirkişi heyetinin kaç kişiden ve hangi niteliklerdeki kişilerden oluşacağını, hangi şartın aranacağını belirtiniz.
    (5 puan)


    (d) Komisyonun çalışma usulleri ve sınav konularının hangi merci tarafından belirleneceğini yazınız. (3 puan)

    '
  cozum: '**(a)** Yeminli malî müşavirlik sınavı **Birlik tarafından yazılı olarak** yapılır. Sınav komisyonu biri başkan
    olmak üzere **yedi üyeden** oluşur: **dördü** Maliye Bakanlığı vergi denetim elemanları arasından, **biri** Yükseköğretim
    Kurulunca önerilecek iki aday arasından, **ikisi** Birlikçe önerilecek dört aday arasından seçilir. Üyeleri **Maliye Bakanı**
    seçer.


    **(b)** Adaylar; hukuk, iktisat, maliye, işletme, muhasebe, bankacılık veya idarî bilimler dallarının birinden lisans/lisansüstü
    mezunu olmalı ve bu konularda en az on beş yıl çalışmış (veya öğretim üyeliği/görevliliği yapmış) olmalıdır.


    | Aday | Sonuç | Gerekçe |

    |---|---|---|

    | A | Gösterilebilir | Maliye mezunu, 16 yıl >= 15 yıl |

    | B | Gösterilemez | Hukuk mezunu fakat 14 yıl < 15 yıl |

    | C | Gösterilemez | Mühendislik, sayılan dallar dışında; süre yeterli olsa da mezuniyet şartı yok |


