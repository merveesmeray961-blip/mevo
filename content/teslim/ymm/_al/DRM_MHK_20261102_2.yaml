  soru: '**Olay:** Serbest muhasebeci mali müşavir Tuba Er, (R) Ltd. Şti.''nin beyannamelerini imzalamaktadır. Tuba Hanım,
    Ocak-Mart 2026 dönemlerine ilişkin KDV iadesine dayanak rapor düzenlemiş, ancak Hazine ve Maliye Bakanlığı raporun doğru
    olmadığını tespit etmiştir. Tespitler aşağıdadır:


    | Dönem | Rapor kapsamı | Ziyaa uğratılan KDV (TL) | Kesilen vergi ziyaı cezası (TL) |

    |---|---|---|---|

    | Ocak-Mart 2026 | Raporun kapsamında | 250.000 | 250.000 |

    | Nisan 2026 | Raporun kapsamı dışında (rapor düzenlenmemiştir) | 40.000 | 40.000 |


    Gecikme faizi dikkate alınmayacaktır.


    **İstenenler:**


    (a) SMMM''lerin KDV iadesine dayanak rapor düzenleyebilmesinin hangi dönem ve mükelleflerle sınırlı olduğunu; Bakanlığın
    bu konuda hangi hususları belirlemeye yetkili olduğunu belirtiniz. (7 puan)


    (b) Tuba Hanım''ın mükellefle birlikte sorumlu olacağı tutarı hesaplayınız ve sorumluluğun niteliği ile sınırını açıklayınız.
    (8 puan)


    (c) Nisan 2026 dönemindeki 80.000 TL''lik (40.000 + 40.000) tutardan Tuba Hanım''ın sorumlu olup olmadığını gerekçelendiriniz.
    (4 puan)


    (d) Tuba Hanım''ın yeminli mali müşavir olsaydı tasdik sorumluluğunun disiplin sorumluluğundan nasıl ayrı tespit edileceğini
    ve YMM''den savunma istenmesi hâlinde süreyi belirtiniz. (3 puan)

    '
  cozum: '**(a)** Bakanlık, yetki almış SMMM''lere, **beyannamelerini imzaladıkları dönem ve mükelleflerle sınırlı olmak kaydıyla**,
    KDV Kanunu kapsamında yapılacak iadeye dayanak rapor düzenlettirmeye yetkilidir. Ayrıca rapor düzenleyecek SMMM''lerde
    aranacak **nitelik ve şartları**, rapor düzenlenebilecek **iade türlerini** ve **azami iade tutarlarını** tespit etmeye
    yetkilidir (md. 8/A).


    **(b)** SMMM''ler iadeye ilişkin raporların doğru olmasından sorumludur. Rapor doğru değilse, **rapor kapsamı ile sınırlı
    olmak üzere**, ziyaa uğratılan vergilerden ve kesilecek cezalardan **mükellefle birlikte müştereken ve müteselsilen**
    sorumlu olurlar. Rapor kapsamındaki tutar: 250.000 (KDV) + 250.000 (ceza) = **500.000 TL**.


    **(c)** Nisan 2026 dönemi raporun kapsamı dışında olduğundan, sorumluluk rapor kapsamı ile sınırlı olduğu için Tuba Hanım
    bu 80.000 TL''den **sorumlu tutulamaz** (mükellef tek başına sorumludur).


    **(d)** Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları **ayrı ayrı müstakil
    bir rapor** ile tespit edilir. Sorumluluk raporu yazılabilmesi için YMM''nin yazılı savunması istenir; savunma isteme
    yazısının tebliğ tarihinden itibaren **otuz gün** içinde savunma yapılmazsa YMM savunma hakkından vazgeçmiş sayılır (md.
    12).


    Püf noktaları: (1) "Rapor kapsamı" sınırı hem dönemi hem konuyu belirler. (2) Sorumluluk müşterek ve müteselsil olduğundan
    idare alacağını mükelleften de SMMM''den de isteyebilir.

    '
