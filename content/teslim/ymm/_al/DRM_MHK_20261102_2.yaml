  soru: '**Olay:** Üye sayısı 85 olan Dağkent Yeminli Mali Müşavirler Odası yeni kurulmuştur (odanın kuruluşundan 2 yıl geçmiştir).
    Genel kurul, yönetim, disiplin ve denetleme kurullarına seçim yapacaktır. Adaylardan Çağla, kayıtlı olduğu odada 1 yıl
    kıdemlidir ve mesleği fiilen yürütmektedir. Aynı odada Dilara 5 yıl kıdemlidir ve fiilen mesleki faaliyette bulunmaktadır.
    Odada bir de, üye sayısı 150 olan komşu bir oda vardır; bu odada da Emre 2 yıl kıdemli ve fiilen faaliyettedir.


    **İstenenler:**


    (a) Dağkent Odası''nda Çağla ile Dilara''nın yönetim kurulu üyeliğine seçilip seçilemeyeceğini (kıdem şartı, "üye sayısı
    yüzden az" ve yeni oda kuralıyla birlikte) açıklayınız. (8 puan)


    (b) Komşu odada (150 üye) Emre''nin seçilebilirliğini açıklayınız. (4 puan)


    (c) Dağkent Odası''nın disiplin kurulunun üye ve yedek üye sayısını, görev süresini ve denetleme kurulunun üye sayısını
    ve görevini belirtiniz. (6 puan)


    (d) Seçilen bir yönetim kurulu üyesi seçilme yeterliğini kaybederse sonucu belirtiniz. (4 puan)

    '
  cozum: '**(a)** Yönetim kurulu üyeleri, kayıtlı olduğu meslek odasında **en az üç yıl kıdemli** olup fiilen mesleki faaliyette
    bulunanlar arasından seçilir; **üye sayısı yüzden az olan odalarda üç yıllık süre şartı aranmaz**. Dağkent''te üye sayısı
    85 (<100) olduğundan kıdem şartı aranmaz: Çağla (1 yıl) ve Dilara (5 yıl) fiilen faaliyette bulunduklarından **seçilebilir**.
    Ayrıca oda kurulduktan itibaren 6 yıl boyunca 3 yıllık kıdem şartı aranmaz (Ek Madde 2); bu kural da Çağla''nın seçilebilirliğini
    destekler.


    **(b)** Komşu odada üye sayısı 150 (>= 100) olduğundan 3 yıllık kıdem şartı aranır; Emre 2 yıl kıdemli olduğundan **seçilemez**
    (oda yeni kurulmuş değil).


    **(c)** Üye sayısı 50''den fazla olduğundan disiplin kurulu **5 üyeden** oluşur ve **3 yedek üye** seçilir; üyeler **üç
    yıl** için seçilir. Denetleme kurulu **üç üyeden** oluşur, ayrıca **bir yedek üye** seçilir; odanın işlem ve hesaplarını
    denetler ve Genel Kurula rapor verir.


    **(d)** Seçilme yeterliğini kaybeden yönetim kurulu üyelerinin görevi **kendiliğinden sona erer**.


    Püf noktaları: (1) "Yüzden az" istisnası odanın üye sayısına bakar, adayın değil. (2) Yeni kurulan odalarda ilk 6 yıl
    3 yıllık kıdem şartı aranmaz.

    '
  puanlama:
  - olcut: (a) Üye sayısı < 100 istisnası, yeni oda kuralı ve iki adayın değerlendirilmesi
    puan: 8
  - olcut: (b) 150 üyeli odada 3 yıl kıdem şartı
