    (d) Karardan önce idarenin şirkete yazıyla yanlış izahat vermiş olması, sonradan çıkan bir idari para cezasına nasıl etki
    ederdi? (4 puan)

    '
  cozum: '**(a) Karar süresi**


    Gümrük idareleri başvurunun kendilerine ulaştığı tarihten itibaren otuz gün içinde karar verir (md. 6/2). Bu süreye uyulamıyorsa
    süre aşılabilir; ancak idare, sürenin dolmasından önce başvuru sahibine süre aşımını haklı kılan gerekçeleri ve karar
    için gerekli gördüğü ek süreyi bildirmek zorundadır. İdare 19/2/2026''da yani 30 günlük sürenin dolmasından önce yazıyla
    bildirim yaptığından süre aşımı hukuka uygundur.


    **(b) Lehe kararın iptali (md. 7/1)**


    Lehe karar ancak şu üç hâlin bir arada bulunması durumunda iptal edilir: (1) kararın yanlış veya eksik bilgiye dayanılarak
    verilmesi, (2) başvuru sahibinin bu yanlışlığı veya eksikliği bilmesi ya da bilmesi gerekmesi, (3) kararın doğru veya
    tam bilgiyle verilmesinin mümkün olmayacağının tespiti. Vakada üç şart da sağlandığından idare kararı **iptal edebilir
    (iptal edilir)**. İptal kararı muhatabına tebliğ edilir (md. 7/3).


    **(c) Şartların bir arada bulunmaması**


    Şirketin yanlışlığı bilmemesi ve bilmesinin gerekmemesi nedeniyle md. 7/1 şartları bir arada gerçekleşmez; fakat karara
    esas teşkil eden koşulun gerçekleşmemiş veya gerçekleşemez olması hâlinde karar md. 7/2-a uyarınca **değiştirilebilir
    veya iptal edilebilir**. Md. 7/2''ye göre verilen değiştirme/iptal kararı **tebliğ tarihinden itibaren** yürürlüğe girer;
    md. 7/1''e göre iptal ise iptal kararının verildiği tarihten itibaren yürürlüğe girer (md. 7/4).


