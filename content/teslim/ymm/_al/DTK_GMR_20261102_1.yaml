  soru: '**Kuzey Tekstil Makineleri A.Ş.** (Türkiye''de yerleşik), Almanya''daki ilişkisiz bir satıcıdan bir dokuma makinesi
    ithal etmiş ve serbest dolaşıma giriş beyannamesi 9/6/2026''da tescil edilmiştir. Gümrük yükümlülüğünün başladığı tarihte
    TCMB döviz satış kuru 1 USD = 42 TL''dir. Satıcının faturasına ve sözleşmeye ilişkin veriler aşağıdadır:


    | Kalem | Tutar (USD) | Not |

    |---|---|---|

    | Fiilen ödenen veya ödenecek fiyat | 200.000 | Aşağıdaki kalemler bu tutara dahil değildir |

    | Satıcı adına çalışan acentaya alıcının üstlendiği satış komisyonu | 6.000 | |

    | Alıcının kendi temsilcisine yurt dışında ödediği satın alma komisyonu | 4.000 | |

    | Makinenin işçilik ve malzeme giderleri dahil ambalaj bedeli | 3.000 | Alıcı üstlenmiştir |

    | Türkiye''deki giriş gümrük kapısına kadar nakliye, sigorta ve yükleme-elleçleme | 9.000 | |

    | Giriş gümrük kapısına varıştan sonra fabrikaya nakliye ve sigorta | 2.500 | |

    | İthalattan sonra yapılan montaj ve devreye alma | 8.000 | Faturada ayrıca gösterilmiştir |

    | Satış koşulu gereği satıcıya ödenecek royalti | 12.000 | |

    | Türkiye''de çoğaltma hakkı için yapılan ödeme | 7.000 | |


    Bu makineye uygulanacak gümrük vergisi oranı %10''dur; yalnızca gümrük vergisi dikkate alınacaktır.


    **İstenenler:**


    (a) Her kalemin gümrük kıymetine dahil edilip edilmeyeceğini madde atfıyla belirtiniz. (9 puan)


    (b) Beyan edilmesi gereken gümrük kıymetini Türk Lirası olarak hesaplayınız. (4 puan)


    (c) Beyannamede royalti ödemesi hiç gösterilmemiş ve bu durum gümrük idaresince teslimden sonra kontrolde tespit edilmiş
    olsaydı, vergi farkını ve uygulanacak idari para cezasını hesaplayınız. (5 puan)


    (d) Aynı noksanlığı şirket, idare tespit etmeden önce kendiliğinden bildirseydi ve noksanlık maddi hesap hatasından kaynaklansaydı,
    ayrı ayrı kesilecek cezaları hesaplayınız. (6 puan)

    '
  cozum: '**(a) Kıymete dahil edilecek ve edilmeyecek kalemler**


    Gümrük kıymeti, fiilen ödenen veya ödenecek fiyattır (md. 24/1); bu fiyata yalnızca md. 27''de sayılan ilaveler yapılır,
    md. 27/3 uyarınca bunun dışında hiçbir ilave yapılamaz. Md. 28''deki giderler ise ayırt edilebiliyorsa kıymete dahil edilmez.


    | Kalem | Sonuç | Dayanak |

    |---|---|---|

    | Satış komisyonu 6.000 | Dahil edilir | md. 27/1-a-i (satın alma komisyonları dışındaki komisyonlar ve tellaliye) |

    | Satın alma komisyonu 4.000 | Dahil edilmez | md. 28/e ve md. 27/4 |

    | Ambalaj 3.000 | Dahil edilir | md. 27/1-a-iii |

    | Giriş yerine kadar nakliye, sigorta, yükleme-elleçleme 9.000 | Dahil edilir | md. 27/1-e |

    | Girişten sonra nakliye ve sigorta 2.500 | Dahil edilmez | md. 28/a |

    | Montaj 8.000 | Dahil edilmez | md. 28/b |

    | Royalti 12.000 | Dahil edilir | md. 27/1-c |

    | Türkiye''de çoğaltma hakkı 7.000 | Dahil edilmez | md. 28/d ve md. 27/5-a |


    **(b) Gümrük kıymeti**


    200.000 + 6.000 + 3.000 + 9.000 + 12.000 = 230.000 USD. Kıymet Türk Lirası olarak beyan edilir; yabancı para, yükümlülüğün
    başladığı tarihteki TCMB döviz satış kuruyla çevrilir (md. 30): 230.000 x 42 = **9.660.000 TL**.


    **(c) İdare tespiti hâlinde**


    Eksik beyan edilen royalti = 12.000 x 42 = 504.000 TL; vergi farkı = 504.000 x %10 = **50.400 TL**. Beyan edilen kıymet
    md. 23-31 uyarınca belirlenen kıymete göre noksan olduğundan, vergi farkının üç katı idari para cezası verilir (md. 234/1-b):
    50.400 x 3 = **151.200 TL**. Vergi farkı ayrıca tahsil edilir.


    **(d) Kendiliğinden bildirim ve maddi hesap hatası**


    - İdare tespit etmeden önce beyan sahibince bildirilirse ceza %10 oranında uygulanır (md. 234/3): 151.200 x %10 = **15.120
    TL**.

    - Noksanlık maddi hesap hatasından doğmuşsa ceza vergi farkının yarısıdır (md. 234/1-c): 50.400 / 2 = **25.200 TL**.


    Püf noktaları: (1) Satın alma komisyonu kıymete girmez, satış komisyonu girer; ikisini karıştırmayın. (2) Giriş kapısına
    kadar yapılan nakliye girer, girişten sonrası girmez. (3) Cezanın "üç kat" olduğunu, kendiliğinden bildirimde ise bunun
    %10''a indiğini unutmayın.

    '
