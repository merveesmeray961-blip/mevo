  soru: '**Mavi Ege Elektronik A.Ş.**, ithal edeceği bir kontrol modülü için Müsteşarlıktan 23/4/2024 tarihinde (Salı) bağlayıcı
    tarife bilgisi, aynı gün bağlayıcı menşe bilgisi almıştır. Sonraki gelişmeler şöyledir:


    | Tarih | Gelişme |

    |---|---|

    | 3/3/2026 | Şirket, bağlayıcı tarife bilgisine dayanarak eşyanın alımı için ABD''li satıcıyla bağlayıcı bir sözleşme
    yapmıştır. |

    | 15/7/2026 | Türk Gümrük Tarife Cetvelinde yapılan değişiklik Resmî Gazetede yayımlanmıştır. Değişiklik, bilgide tanımlanan
    modülün tarife pozisyonunu değiştirmekte ve verilen bağlayıcı tarife bilgisi yeni hükümlere uymamaktadır. |


    Menşe kurallarında herhangi bir değişiklik olmamıştır. Gümrük işlemleri sırasında eşya için bir ithalat izin belgesi ibraz
    edilmemiştir. Cumartesi ve Pazar günleri ile 23 Nisan resmî tatil kabul edilecek, başka resmî tatil dikkate alınmayacaktır.


    **İstenenler:**


    (a) Bağlayıcı tarife bilgisi ile bağlayıcı menşe bilgisinin normal geçerlilik sürelerinin sona ereceği tarihleri, resmî
    tatil kuralını da uygulayarak belirleyiniz. (8 puan)


    (b) Bağlayıcı tarife bilgisinin geçerliliğini kaybettiği tarihi ve şirketin bu bilgiyi hangi tarihe kadar kullanabileceğini
    gerekçesiyle açıklayınız. (8 puan)


    (c) Şirketin başvuru sırasında modülün teknik özelliğini eksik bildirdiğinin sonradan anlaşılması hâlinde bağlayıcı bilginin
    akıbetini ve bilgi sahibinin beyan sırasındaki ispat yükünü açıklayınız. (6 puan)

    '
  cozum: '**(a) Normal geçerlilik süreleri (md. 9/4, md. 14)**


    | Bilgi | Süre | Hesap | Sonuç |

    |---|---|---|---|

    | Bağlayıcı tarife bilgisi | 6 yıl | 23/4/2024 + 6 yıl = 23/4/2030 (Salı) | 23 Nisan resmî tatil olduğundan süre ilk işgününün
    (24/4/2030, Çarşamba) çalışma saati sonunda biter |

    | Bağlayıcı menşe bilgisi | 3 yıl | 23/4/2024 + 3 yıl = 23/4/2027 (Cuma) | Resmî tatil olduğundan süre ilk işgünü olan
    26/4/2027 Pazartesi günü çalışma saati sonunda biter |


    Süre ay (yıl) olarak belirlendiğinden başladığı güne son ayda tekabül eden günde sona erer (md. 14/2); bitim günü resmî
    tatile rastlarsa ilk işgününün resmî çalışma saati sonunda biter (md. 14/1).


    **(b) Tarife değişikliği nedeniyle geçersizlik**


    Tarife Cetvelindeki değişiklik bilgiye uymadığından bağlayıcı tarife bilgisi geçerliliğini kaybeder (md. 9/5-a); kayıp
    tarihi değişikliğin Resmî Gazetede yayımı tarihidir: **15/7/2026**. Şirket, geçerlilik kaybından önce (3/3/2026) bilgiye
    dayanarak eşyanın alımı için bağlayıcı sözleşme yaptığından, bilgiyi yayım tarihinden itibaren altı ay boyunca kullanabilir
    (md. 9/7): 15/7/2026 + 6 ay = **15/1/2027** (Cuma, işgünüdür; çalışma saati sonunda biter). Bu istisna, gümrük işlemleri
    sırasında bir ithalat, ihracat veya ön izin belgesi ibraz edilmesi hâlinde belgenin geçerlilik süresine bağlanır; vakada
    böyle bir belge yoktur.


    **(c) Eksik bilgi ve ispat yükü**


    Talep edenin verdiği yanlış veya eksik bilgiye dayanan bağlayıcı bilgi iptal edilir (md. 9/4). Bilgi alan kişi, beyan
    edilecek eşya ile bilgide tanımlanan eşya arasında her bakımdan uygunluk bulunduğunu kanıtlamak zorundadır (md. 9/3-a).
    Bağlayıcı menşe bilgisinde de beyan edilecek eşya ve menşe kazanımı gerektiren durumun bilgideki ile her bakımdan uygun
    olduğu kanıtlanır (md. 9/3-b).


    Püf noktaları: (1) Tarife bilgisi 6 yıl, menşe bilgisi 3 yıl geçerlidir; karıştırmayın. (2) Geçerlilik kaybının tarihi
    Resmî Gazete yayım tarihidir; 6 aylık ek süre ise ancak kayıptan önce bağlayıcı sözleşme yapılmışsa ve belge ibraz edilmemişse
    işler. (3) Süre tatile denk gelirse bir sonraki işgününün mesai bitimi esas alınır.

    '
