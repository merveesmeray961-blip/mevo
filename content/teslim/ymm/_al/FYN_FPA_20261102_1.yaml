      ve elden çıkarılması faaliyetleridir.'
  - mevzuat: TMS 7 Nakit Akış Tablosu
    madde: paragraf 6
    alinti: 'Finansman faaliyetleri: İşletmenin ödenmiş sermayesinin ve borçlanmalarının büyüklüğünde ve birleşiminde değişikliğe
      neden olan faaliyetlerdir.'
  dogrulama:
    python: 'ni=300_000; amort=90_000; d_alac=120_000; d_stok=-40_000; d_borc=60_000; kar_satis=20_000

      makine=400_000; defter=50_000; kredi_k=200_000; kredi_o=80_000; temettu=100_000; bas=150_000

      satis_ty = defter+kar_satis

      sa = -d_stok

      faal = ni+amort-d_alac-d_stok+d_borc-kar_satis

      yat = -makine+satis_ty

      fin = kredi_k-kredi_o-temettu

      net = faal+yat+fin

      son = bas+net

      oran = faal/makine

      sonuc = {''a'': faal, ''b'': yat, ''c'': fin, ''d'': (net, son), ''e'': oran}

      '
