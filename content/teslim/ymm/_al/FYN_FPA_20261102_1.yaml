  soru: '**Olay:** Orman Mobilya A.Ş.''nin 2025 yılına ilişkin bilgileri aşağıdadır (tutarlar TL; vergi ödemeleri net kâra
    dahil edilmiştir, faiz giderleri net kârda yer almakta ve faaliyetlerden sınıflanmaktadır):


    | Kalem | Tutar |

    |---|---|

    | Net kâr | 300.000 |

    | Amortisman gideri | 90.000 |

    | Ticari alacaklardaki artış | 120.000 |

    | Stoklardaki azalış | 40.000 |

    | Ticari borçlardaki artış | 60.000 |

    | Makine satış kârı (net kâra dahil) | 20.000 |

    | Nakit ödenen yeni makine alımı | 400.000 |

    | Satılan eski makinenin net defter değeri | 50.000 |

    | Alınan uzun vadeli kredi | 200.000 |

    | Uzun vadeli kredi anapara ödemesi | 80.000 |

    | Ödenen nakit kâr payı | 100.000 |

    | 1/1/2025 nakit ve nakit benzerleri | 150.000 |


    **İstenenler:**


    (a) Dolaylı yöntemle işletme faaliyetlerinden nakit akışını bulunuz. (8 puan)


    (b) Yatırım ve finansman faaliyetlerinden nakit akışlarını hesaplayınız; makine satışı ve kâr payı ödemesinin hangi faaliyette
    gösterileceğini TMS 7 tanımlarıyla gerekçelendiriniz. (7 puan)


    (c) Dönem sonu nakit ve nakit benzerlerini bulunuz. (3 puan)


    (d) Faaliyet nakit akışının makine yatırımını karşılama oranını hesaplayıp yorumlayınız. (4 puan)

    '
  cozum: '**(a)** Net kâr 300.000 + amortisman 90.000 − alacak artışı 120.000 + stok azalışı 40.000 + ticari borç artışı 60.000
    − makine satış kârı 20.000 (yatırımla ilgili kâr, ters çevrilir) = **350.000 TL**.


    **(b)** Yatırım: makine alımı −400.000 + makine satışı (50.000 + 20.000 = 70.000) = **-330.000 TL**.

    Finansman: kredi 200.000 − anapara 80.000 − kâr payı 100.000 = **20.000 TL**.

    Makine alım-satımı uzun vadeli varlığın edinilmesi ve elden çıkarılması olduğundan yatırım faaliyetidir; kredi ve kâr
    payı ödemesi ise borçlanmaların ve özkaynak üzerindeki hakların büyüklüğünü değiştirdiğinden finansman faaliyetidir.


    **(c)** Net değişim = 350.000 + (-330.000) + 20.000 = 40.000 TL; dönem sonu nakit = 150.000 + 40.000 = **190.000 TL**.


    **(d)** Oran = 350.000 / 400.000 = **0,875**. Faaliyet nakit akışı makine yatırımını tam karşılamamaktadır (oran 1''in
    altındadır); fark kredi ile kapatılmıştır.


    **Mevzuat dayanağı:** TMS 7 paragraf 6 uyarınca yatırım faaliyetleri, uzun vadeli varlıkların ve nakit benzeri olmayan
    diğer yatırımların edinilmesi ve elden çıkarılması faaliyetleridir. TMS 7 paragraf 6 uyarınca finansman faaliyetleri,
    ödenmiş sermayenin ve borçlanmaların büyüklüğünde ve birleşiminde değişikliğe neden olan faaliyetlerdir.

    '
