  cozum: '**(a)** ROE = %6 × 2,0 × 1,5 = **%18**; tutma oranı b = %50. Sürdürülebilir büyüme = ROE × b / (1 − ROE × b) = 0,09
    / 0,91 = **%9,8901**.


    **(b)** b = 1 iken g = ROE / (1 − ROE) = 0,18 / 0,82 = **%21,9512**; %25 hedefin altındadır.


    **(c)** g = 0,25 için ROE × b = g / (1 + g) = 0,20. b = 0,50 iken gereken ROE = 0,20 / 0,50 = **%40**. ROE sabit (%18)
    iken gereken b = 0,20 / 0,18 = **1,11** (> 1); yani kâr dağıtımı sıfır olsa bile hedef ulaşılamaz. Hedef için ROE''nin
    artırılması (marj, devir veya kaldıraç) ya da dış finansman gerekir.


    **(d)** Net kâr marjı = ROE / (devir × çarpan) = 0,40 / (2,0 × 2,0) = **%10**.


    **Mevzuat dayanağı:** TTK md. 507/1 uyarınca her pay sahibi, dağıtılması kararlaştırılmış net dönem kârına payı oranında
    katılır.

    '
  puanlama:
  - olcut: (a) ROE ve sürdürülebilir büyüme oranı
    puan: 5
  - olcut: (b) azami sürdürülebilir büyüme
    puan: 5
  - olcut: (c) gerekli ROE ve gerekli dağıtım oranı, yorum
    puan: 7
  - olcut: (d) gerekli net kâr marjı
    puan: 5
  kaynaklar:
  - mevzuat: 6102 sayılı Türk Ticaret Kanunu
    madde: md. 507/1
    alinti: Her pay sahibi, kanun ve esas sözleşme hükümlerine göre pay sahiplerine dağıtılması kararlaştırılmış net dönem
      kârına, payı oranında katılma hakkını haizdir.
  dogrulama:
    python: 'nm=0.06; tat=2.0; em=1.5; payout=0.5; hedef_g=0.25; hedef_tat=2.0; hedef_em=2.0

      roe = nm*tat*em

      b = 1-payout

      g = roe*b/(1-roe*b)

      g_max = roe/(1-roe)

      rb = roe*b

      rb1 = 1-roe*b

      roe1 = 1-roe

      gg = hedef_g/(1+hedef_g)

      roe_gerek = (hedef_g/(1+hedef_g))/b

      nm_gerek = roe_gerek/(hedef_tat*hedef_em)

      b_gerek = (hedef_g/(1+hedef_g))/roe

      sonuc = {''a'': (roe, g), ''b'': g_max, ''c'': (roe_gerek, b_gerek), ''d'': nm_gerek}

      '
