  soru: '**Olay:** Yıldız Tekstil A.Ş.''nin 31/12/2025 tarihli bilançosu kayıp olup yalnızca aşağıdaki oranlar ve veriler
    elde bulunmaktadır (1 yıl = 360 gün, satışların tamamı vadelidir, bilanço kalemleri yıl sonu bakiyesidir):


    | Veri | Değer |

    |---|---|

    | Net satışlar | 4.000.000 TL |

    | Brüt satış kârı marjı | %25 |

    | Cari oran | 2 |

    | Asit-test oranı (stoklar hariç dönen varlıklar / KVB) | 1,20 |

    | Kısa vadeli yabancı kaynaklar (KVB) | 500.000 TL |

    | Alacak tahsil süresi | 45 gün |

    | Aktif devir hızı (net satışlar / toplam varlıklar) | 2 |

    | Toplam borç / toplam varlıklar | %60 |

    | Net kâr marjı | %5 |


    **İstenenler:**


    (a) Dönen varlıklar, stoklar, ticari alacaklar ve hazır değerler (kısa vadeli diğer kalemler yoktur) tutarlarını bulunuz.
    (7 puan)


    (b) Duran varlıkları, uzun vadeli yabancı kaynakları ve özkaynakları bularak bilançoyu özet hâlde düzenleyiniz. (6 puan)


    (c) Stok devir hızını ve stokta kalma süresini hesaplayınız. (5 puan)


    (d) Özkaynak kârlılığını (ROE) ve aktif kârlılığını (ROA) hesaplayıp ROE''nin ROA''dan yüksek olmasını gerekçelendiriniz.
    (5 puan)

    '
  cozum: '**(a)** Toplam varlıklar = 4.000.000 / 2 = **2.000.000 TL**. Dönen varlıklar = cari oran × KVB = 2 × 500.000 = **1.000.000
    TL**.

    Asit-test: (DV − stok) / KVB = 1,20 → DV − stok = 1,20 × 500.000; stok = 1.000.000 − 1,20 × 500.000 = **400.000 TL**.

    Alacaklar = 4.000.000 × 45 / 360 = **500.000 TL**. Hazır değerler = 1.000.000 − 400.000 − 500.000 = **100.000 TL**.


    **(b)**


    | Aktif | TL | Pasif | TL |

    |---|---|---|---|

    | Hazır değerler | 100.000 | KVB | 500.000 |

    | Ticari alacaklar | 500.000 | UVB | 700.000 |

    | Stoklar | 400.000 | Özkaynaklar | 800.000 |

    | Duran varlıklar | 1.000.000 | | |

    | **Toplam** | **2.000.000** | **Toplam** | **2.000.000** |


    Toplam borç = %60 × 2.000.000 = 1.200.000 TL; UVB = 1.200.000 − 500.000 = 700.000 TL; özkaynak = 2.000.000 − 1.200.000
    = 800.000 TL; duran varlık = 2.000.000 − 1.000.000 = 1.000.000 TL.


    **(c)** Satışların maliyeti = 4.000.000 × (1 − %25) = 3.000.000 TL. Stok devir hızı = 3.000.000 / 400.000 = **7,50 kez**;
    stokta kalma süresi = 360 / 7,50 = **48 gün**.


    **(d)** Net kâr = 4.000.000 × %5 = 200.000 TL. ROE = 200.000 / 800.000 = **%25**; ROA = 200.000 / 2.000.000 = **%10**.

    ROE > ROA çünkü varlıkların bir bölümü yabancı kaynakla finanse edilmiştir (ROE = ROA × özkaynak çarpanı = %10 × 2.000.000
    / 800.000).


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
    çözümde analiz edilen tablolar bu esasa göre hazırlanmış kabul edilmiştir.

    '
  puanlama:
  - olcut: (a) dönen varlık, stok, alacak ve hazır değer tutarları
    puan: 7
  - olcut: (b) duran varlık, UVB ve özkaynak tutarları ile bilanço denkliği
    puan: 6
  - olcut: (c) stok devir hızı ve süresi
    puan: 5
  - olcut: (d) ROE, ROA ve kaldıraç gerekçesi
    puan: 5
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 25
    alinti: Yönetimin işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyeti bulunmadığı ya da bunları
      yapmak dışında gerçekçi bir alternatifi olduğu sürece işletme, finansal tablolarını işletmenin sürekliliği esasına göre
      hazırlar.
  dogrulama:
    python: 'satis=4_000_000; cari=2.0; asit=1.2; kvb=500_000; atg=45; tva=2.0; bo=0.6; gm=0.25; nm=0.05

      tv = satis/tva

      dv = cari*kvb

      stok = dv - asit*kvb

      alac = satis*atg/360

      hazir = dv - stok - alac

      dur = tv - dv

      borc = bo*tv

      uvb = borc - kvb

      oz = tv - borc

      sm = satis*(1-gm)

      sdh = sm/stok

      sds = 360/sdh

      ni = satis*nm

      roe = ni/oz

      roa = ni/tv

      sonuc = {''a'': (dv, stok, alac, hazir), ''b'': (dur, uvb, oz), ''c'': (sdh, sds), ''d'': (roe, roa)}

      '
