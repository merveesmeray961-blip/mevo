  soru: '**Olay:** Kuzey Plastik San. A.Ş. X ve Y ürünlerini her 3 birim X satışına karşılık 1 birim Y satılacak biçimde (sabit
    satış karması) üretip satmaktadır. 2026 yılı için veriler aşağıdadır (kurumlar vergisi oranı %25 alınacaktır):


    | Veri | X | Y |

    |---|---|---|

    | Birim satış fiyatı | 100 TL | 200 TL |

    | Birim değişken maliyet | 60 TL | 120 TL |


    Sabit giderler 480.000 TL''dir; bunun 80.000 TL''si amortismandır (nakit çıkışı yoktur). Yıllık faiz gideri 120.000 TL''dir.


    **İstenenler:**


    (a) Faaliyet başabaş noktasını (FVÖK = 0) ürün adetleri olarak bulunuz. (5 puan)


    (b) Faiz giderini de karşılayan başabaş noktasını (FVK = 0) ürün adetleri olarak bulunuz. (5 puan)


    (c) Nakit başabaş noktasını (amortisman nakit dışı gider; faiz dahil) paket sayısı olarak bulunuz. (5 puan)


    (d) 150.000 TL vergi sonrası net kâr hedefi için gerekli X ve Y adetlerini ve toplam satış hasılatını bulunuz. (6 puan)

    '
  cozum: 'Bir paket = 3 X + 1 Y. Birim katkı payları: X = 100 − 60 = 40 TL; Y = 200 − 120 = 80 TL. Paket katkı payı = 3 ×
    40 + 80 = **200 TL**; paket hasılatı = 3 × 100 + 200 = 500 TL.


    **(a)** Başabaş paket = 480.000 / 200 = **2.400 paket** → X = 2.400 × 3 = **7.200 adet**, Y = **2.400 adet**.


    **(b)** Başabaş paket = (480.000 + 120.000) / 200 = **3.000 paket** → X = **9.000 adet**, Y = **3.000 adet**.


    **(c)** Nakit sabit gider = 480.000 − 80.000 + 120.000 = 520.000 TL; paket = 520.000 / 200 = **2.600 paket** (X = 7.800,
    Y = 2.600).


    **(d)** Vergi öncesi hedef kâr = 150.000 / (1 − 0,25) = 200.000 TL. Paket = (480.000 + 120.000 + 200.000) / 200 = **4.000
    paket** → X = **12.000 adet**, Y = **4.000 adet**. Hasılat = 4.000 × 500 = **2.000.000 TL**.


    **Mevzuat dayanağı:** TMS 1 paragraf 25 uyarınca işletme, finansal tablolarını işletmenin sürekliliği esasına göre hazırlar;
    çözümde analiz edilen tablolar bu esasa göre hazırlanmış kabul edilmiştir.

    '
  puanlama:
  - olcut: (a) paket katkı payı ve faaliyet başabaşı
    puan: 5
  - olcut: (b) faiz dahil başabaş
    puan: 5
  - olcut: (c) nakit başabaş paket sayısı
    puan: 5
  - olcut: (d) hedef net kâr için adet ve hasıla
    puan: 6
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: paragraf 25
    alinti: Yönetimin işletmeyi tasfiye etme veya işletmenin ticari faaliyetine son verme niyeti bulunmadığı ya da bunları
      yapmak dışında gerçekçi bir alternatifi olduğu sürece işletme, finansal tablolarını işletmenin sürekliliği esasına göre
      hazırlar.
  dogrulama:
    python: 'px, vx = 100, 60

      py_, vy = 200, 120

      mixx, mixy = 3, 1

      sabit = 480_000; amort = 80_000; faiz = 120_000; vergi = 0.25; hedef = 150_000

      kx, ky = px-vx, py_-vy

      paket_k = mixx*kx + mixy*ky

      paket_s = mixx*px + mixy*py_

      q_faal = sabit/paket_k

      q_faiz = (sabit+faiz)/paket_k

      q_nakit = (sabit-amort+faiz)/paket_k

      ebt_h = hedef/(1-vergi)

      q_hedef = (sabit+faiz+ebt_h)/paket_k

      satis_h = q_hedef*paket_s

      nsg = sabit - amort + faiz

      xa, xb, xc, xd = 3*q_faal, 3*q_faiz, 3*q_nakit, 3*q_hedef

      sonuc = {''a'': (xa, q_faal), ''b'': (xb, q_faiz), ''c'': q_nakit, ''d'': (xd, q_hedef, satis_h)}

      '
