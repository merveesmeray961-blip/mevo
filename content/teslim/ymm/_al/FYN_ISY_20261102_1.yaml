  zorluk: 2
  puan: 21
  sure_dk: 30
  soru: '**Olay:** Çağrı Elektronik A.Ş. bir hammaddeyi yıllık 40.000 adet kullanmaktadır (talep yıl boyunca düzenlidir; 1
    yıl = 360 gün). Sipariş başına maliyet 200 TL, birim başına yıllık stok taşıma maliyeti 4 TL''dir. Tedarik süresi 9 gün,
    emniyet stoku 300 adettir.


    **İstenenler:**


    (a) Ekonomik sipariş miktarını (EOQ), yıllık sipariş sayısını ve EOQ''daki yıllık toplam stok maliyetini (sipariş + taşıma)
    bulunuz. (7 puan)


    (b) Günlük kullanımı ve yeniden sipariş noktasını (emniyet stoku dahil) bulunuz. (5 puan)


    (c) Satıcı yalnızca 2.500 adetlik siparişleri kabul ederse yıllık toplam stok maliyeti ve EOQ''ya göre farkı ne olur?
    (5 puan)


    (d) EOQ politikasında ortalama stok düzeyini (emniyet stoku dahil) bulunuz. (4 puan)

    '
  cozum: '**(a)** EOQ = √(2 × 40.000 × 200 / 4) = √4.000.000 = **2.000 adet**; sipariş sayısı = 40.000 / 2.000 = **20**; toplam
    maliyet = 20 × 200 + 2.000 / 2 × 4 = **8.000 TL**.


    **(b)** Günlük kullanım = 40.000 / 360 = **111,11**; sipariş noktası = 111,11 × 9 + 300 = **1.300 adet**.


    **(c)** 2.500 adet: sipariş maliyeti = 40.000 / 2.500 × 200 = 3.200 TL; taşıma = 2.500 / 2 × 4 = 5.000 TL; toplam = **8.200
    TL**; fark = **200 TL** (EOQ''dan yüksek).


    **(d)** Ortalama stok = 2.000 / 2 + 300 = **1.300 adet**.


    **Mevzuat dayanağı:** TMS 2 paragraf 10 uyarınca stokların maliyeti, tüm satın alma maliyetlerini, dönüştürme maliyetlerini
    ve stokları mevcut konumuna ve durumuna getirmek için katlanılan diğer maliyetleri içerir.

    '
  puanlama:
  - olcut: (a) EOQ, sipariş sayısı ve toplam maliyet
    puan: 7
  - olcut: (b) günlük kullanım ve sipariş noktası
    puan: 5
  - olcut: (c) 2.500 adet siparişin maliyeti ve fark
    puan: 5
  - olcut: (d) ortalama stok
    puan: 4
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 10
    alinti: Stokların maliyeti; tüm satın alma maliyetlerini, dönüştürme maliyetlerini ve stokların mevcut konumuna ve durumuna
      getirilmesi için katlanılan diğer maliyetleri içerir.
  dogrulama:
    python: 'D=40_000; S=200; H=4.0; gun=360; teslim=9; emniyet=300

      kare = 2*D*S/H

      eoq = kare**0.5

      s2 = S*D/2_500

      t2 = H*2_500/2

      n = D/eoq

      topl = S*n + H*eoq/2

      gunluk = D/gun

      rop = gunluk*teslim + emniyet

      q2 = 2_500

      topl2 = S*D/q2 + H*q2/2

      fark = topl2-topl

      ort_stok = eoq/2 + emniyet

      sonuc = {''a'': (eoq, n, topl), ''b'': (gunluk, rop), ''c'': (topl2, fark), ''d'': ort_stok}

      '
