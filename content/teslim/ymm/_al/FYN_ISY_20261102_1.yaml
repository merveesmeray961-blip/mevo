klasik:
- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: ISY
  kazanimlar:
  - nakit dönüşüm süresi
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Marmaris Gıda A.Ş.''nin 2025 yılına ilişkin verileri aşağıdadır (1 yıl = 360 gün; stok ve alacak tutarları
    ortalama bakiyedir; satışların tamamı vadelidir): Net satışlar 7.200.000 TL, satışların maliyeti 5.400.000 TL, ortalama
    stok 900.000 TL, ortalama ticari alacak 1.000.000 TL, ortalama ticari borç 450.000 TL (alımlar satışların maliyetiyle
    orantılı olarak ele alınacaktır). Şirketin kısa vadeli finansman maliyeti yıllık %30''dur.


    **İstenenler:**


    (a) Stokta kalma süresini, alacak tahsil süresini ve borç ödeme süresini hesaplayınız. (6 puan)


    (b) Nakit dönüşüm süresini ve net işletme sermayesine bağlanan finansman tutarını (stok + alacak − borç) bulunuz. (6 puan)


    (c) Alacak tahsil süresi 35 güne indirilirse yeni alacak bakiyesini, serbest kalan fonu ve yıllık finansman tasarrufunu
    bulunuz. (5 puan)


    (d) Bunun yerine tedarikçilerle borç ödeme süresi 45 güne uzatılırsa (alacak süresi 50 gün kalmak üzere) yeni borç bakiyesini,
    ek finansman kaynağını ve yeni nakit dönüşüm süresini bulunuz. (5 puan)

    '
  cozum: '**(a)** Stokta kalma = 900.000 / 5.400.000 × 360 = **60 gün**; alacak tahsil = 1.000.000 / 7.200.000 × 360 = **50
    gün**; borç ödeme = 450.000 / 5.400.000 × 360 = **30 gün**.


    **(b)** Nakit dönüşüm süresi = 60 + 50 − 30 = **80 gün**. Bağlı fon = 900.000 + 1.000.000 − 450.000 = **1.450.000 TL**.


    **(c)** Yeni alacak = 7.200.000 × 35 / 360 = **700.000 TL**; serbest kalan fon = 1.000.000 − 700.000 = **300.000 TL**;
    yıllık tasarruf = 300.000 × %30 = **90.000 TL**.


    **(d)** Yeni borç = 5.400.000 × 45 / 360 = **675.000 TL**; ek kaynak = 675.000 − 450.000 = **225.000 TL**; yeni nakit
    dönüşüm süresi = 60 + 50 − 45 = **50 gün**.


    **Mevzuat dayanağı:** TMS 2 paragraf 9 uyarınca stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden
    ölçülür.

    '
  puanlama:
  - olcut: (a) üç süre bileşeni
    puan: 6
  - olcut: (b) nakit dönüşüm süresi ve bağlı fon
    puan: 6
  - olcut: (c) alacak süresi kısaltmasının etkisi
    puan: 5
  - olcut: (d) borç süresi uzatmasının etkisi
    puan: 5
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: paragraf 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
  dogrulama:
    python: 'satis=7_200_000; smm=5_400_000; stok=900_000; alac=1_000_000; borc=450_000; k=0.30

      sds = stok/smm*360

      ads = alac/satis*360

      bds = borc/smm*360

      nds = sds+ads-bds

      yatirim = stok+alac-borc

      ads2 = 35

      alac2 = satis*ads2/360

      serbest = alac-alac2

      maliyet_tasarruf = serbest*k

      bds2 = 45

      borc2 = smm*bds2/360

      serbest2 = borc2-borc

      nds2 = sds+ads2-bds2

      sonuc = {''a'': (sds, ads, bds), ''b'': (nds, yatirim), ''c'': (alac2, serbest, maliyet_tasarruf), ''d'': (borc2, serbest2,
      nds2)}

      '
