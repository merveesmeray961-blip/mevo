  soru: '**Olay:** Bir yatırımcı aşağıdaki dört alternatifi karşılaştırmaktadır (nominal değerler 100 TL; 1 yıl = 360 gün):


    | Alternatif | Özellik |

    |---|---|

    | A | 180 gün vadeli iskontolu hazine bonosu, fiyatı 80 TL |

    | B | 360 gün vadeli iskontolu hazine bonosu, fiyatı 64 TL |

    | C | 6 aylık dönemlerle faizi anaparaya eklenen mevduat, nominal yıllık %50 |

    | D | 2 yıl vadeli kuponsuz tahvil, fiyatı 40 TL (vadede 100 TL ödenir) |


    **İstenenler:**


    (a) A bonosunun dönemlik getirisini, basit yıllık getirisini ve bileşik yıllık getirisini bulunuz. (6 puan)


    (b) B bonosunun yıllık getirisini bulunuz ve A ile bileşik getirilerini karşılaştırınız. (5 puan)


    (c) C mevduatının efektif yıllık getirisini ve D tahvilinin yıllık bileşik getirisini bulunuz; dört alternatifi sıralayınız.
    (7 puan)


    (d) Basit yıllık getirinin farklı vadeli araçları karşılaştırmada neden yanıltıcı olduğunu A bonosu örneğiyle açıklayınız.
    (3 puan)

    '
  cozum: '**(a)** Dönemlik getiri = 100 / 80 − 1 = **%25**; basit yıllık = 2 × %25 = **%50**; bileşik yıllık = (1 + 0,25)²
    − 1 = **%56,25**.


    **(b)** B: 100 / 64 − 1 = **%56,25**. A''nın bileşik getirisi ile aynıdır; yani 180 günlük %25''lik getiri, 360 günlük
    %56,25''lik getiriyle eşdeğerdir.


    **(c)** C: dönemlik %25, efektif yıllık = (1,25)² − 1 = **%56,25**. D: (100 / 40)^(1/2) − 1 = **%58,11**. Sıralama (yüksekten
    düşüğe): D (%58,11) > A = B = C (%56,25).


    **(d)** A bonosunun basit yıllık getirisi (%50), bileşik getirisinden (%56,25) düşüktür; vadesi kısa olan araçta getiri
    yıl içinde yeniden yatırılabileceğinden basit yöntem getiriyi olduğundan düşük gösterir ve vadeleri farklı araçların doğru
    karşılaştırılmasını engeller. Karşılaştırma bileşik (efektif) yıllık getiri üzerinden yapılmalıdır. Kısa vadeli nakit
    taahhütleri için elde tutulan, kolayca nakde çevrilebilen yatırımlar nakit benzeri niteliğindedir.


    **Mevzuat dayanağı:** TMS 7 paragraf 7 uyarınca nakit benzerleri, kısa vadeli nakit taahhütlerinin yerine getirilmesi
    amacıyla elde tutulur.

    '
