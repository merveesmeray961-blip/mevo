      veya orandaki değişikliğe; bir kıymetli maden veya kıymetli taş fiyatına veya fiyat değişikliğine; bir mal fiyatına
      veya fiyat değişikliğine; Kurulca uygun görülen kurumlarca yayınlanan istatistiklere veya bunlardaki değişikliğe; kredi
      riski transferi sağlayan, enerji fiyatları ve iklim değişkenleri gibi ölçüm değerleri olan ve bu sayılanlardan oluşturulan
