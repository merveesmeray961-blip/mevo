      satın alma veya satma veya birbirleri ile değiştirme hakkı veren türev araçları,'
  dogrulama:
    python: 'S=100.0; K_=100.0; r=0.25; call=28.0

      pv_k = K_/(1+r)

      put = call - S + pv_k

      c70 = max(70-K_,0)-call

      c100 = max(100-K_,0)-call

      c130 = max(130-K_,0)-call

      p70 = max(K_-70,0)-put

      p100 = max(K_-100,0)-put

      p130 = max(K_-130,0)-put

      be_call = K_+call

      be_put = K_-put

      korumali70 = 70 + max(K_-70,0) - put

      korumali130 = 130 + max(K_-130,0) - put

      sonuc = {''a'': (c70,c100,c130), ''b'': put, ''c'': (p70,p100,p130), ''d'': (be_call, be_put, korumali70, korumali130)}

      '
