  soru: '**Olay:** Tuna Plastik A.Ş. aynı 200.000 TL tutarındaki yatırımı gerektiren iki projeden yalnızca birini seçebilecektir.
    A projesi 3 yıl boyunca her yıl sonunda 120.000 TL nakit girişi sağlar. B projesi ise yalnızca 3. yıl sonunda 400.000
    TL nakit girişi sağlar. Şirketin sermaye maliyeti %25''tir (faktörler: 0,8; 0,64; 0,512). Yönetici ücreti toplam nakit
    kazanca göre belirlenmektedir.


    **İstenenler:**


    (a) Her proje için üç yıllık toplam nakit kazancı (parasal kâr) bulunuz; kâr maksimizasyonu ölçütüne göre hangi projenin
    seçileceğini belirtiniz. (5 puan)


    (b) Her projenin nakit girişlerinin bugünkü değerini bulunuz. (5 puan)


    (c) Net bugünkü değerleri hesaplayınız; pay sahibi servetini maksimize eden karara göre hangi projenin seçileceğini belirtiniz.
    (6 puan)


    (d) İki ölçütün farklı sonuç vermesinin nedenini zaman değeri açısından açıklayınız; yöneticinin teşvikinin acenta sorunu
    yaratıp yaratmadığını yorumlayınız. (5 puan)

    '
  cozum: '**(a)** A: 3 × 120.000 − 200.000 = **160.000 TL**; B: 400.000 − 200.000 = **200.000 TL**. Toplam kâr ölçütüne göre
    **B** seçilir.


    **(b)** A: 120.000 × (0,8 + 0,64 + 0,512) = **234.240 TL**; B: 400.000 × 0,512 = **204.800 TL**.


    **(c)** NBD(A) = 234.240 − 200.000 = **34.240 TL**; NBD(B) = 204.800 − 200.000 = **4.800 TL**. Servet maksimizasyonu için
    **A** seçilmelidir (NBD farkı 29.440 TL).


    **(d)** Toplam kâr ölçütü paranın zaman değerini ve nakit akışlarının zamanlamasını dikkate almaz; B''nin nakitleri geç
    geldiğinden bugünkü değeri düşüktür. Yöneticinin ücreti toplam nakit kazanca bağlıysa B''yi seçme eğilimi doğar; bu pay
    sahibi servetini azaltacağından acenta sorunu yaratır. Yönetim kurulu üyeleri ve yönetimle görevli kişiler şirketin menfaatlerini
    dürüstlük kurallarına uyarak gözetmekle yükümlüdür; teşvik NBD/EVA''ya bağlanmalıdır.


