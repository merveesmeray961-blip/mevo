      x = a_sabit - a_deg + pay

      a_net = a_sabit - x

      b_net = b_deg + x

      b_swap = b_sabit - pay

      a_tas_tl = ns*pay

      prim = 0.015

      yillik_prim = ns*prim

      kurtarma = 0.40

      temerrut_odeme = ns*(1-kurtarma)

      sonuc = {''a'': (sabit_fark, deg_fark, kazanc), ''b'': (x, pay), ''c'': (b_swap, a_tas_tl), ''d'': (yillik_prim, temerrut_odeme)}

      '
