  soru: '**Olay:** Ekin Ltd. Şti., bir depoyu 4 yıllığına kiralamıştır. 1. yıl sonunda ödenecek kira 200.000 TL olup kira
    her yıl %10 artacaktır (son kira 4. yıl sonundadır). Şirketin iskonto oranı yıllık %25''tir.


    **İstenenler:**


    (a) Kira ödemelerini tek tek iskonto ederek bugünkü değerini bulunuz. (6 puan)


    (b) Aynı değeri büyüyen anüite formülü ile hesaplayarak doğrulayınız. (5 puan)


    (c) Kira artışı olmasaydı (sabit 200.000 TL) bugünkü değer ne olurdu? Artışın maliyetini bulunuz. (5 puan)


    (d) Kira sürekli olarak %10 artarak sonsuza dek ödenseydi bugünkü değeri ve (a) şıkkındaki akışın 4. yıl sonundaki gelecek
    değerini bulunuz. (5 puan)

    '
  cozum: '**(a)** Kiralar: 200.000; 220.000; 242.000; 266.200 TL. Bugünkü değerler: 160.000; 140.800; 123.904; 109.035,52.
    Toplam = **533.739,52 TL**.


    **(b)** PV = C / (r − g) × [1 − ((1 + g) / (1 + r))ⁿ] = 200.000 / 0,15 × [1 − (1,10 / 1,25)⁴] = 200.000 / 0,15 × (1 −
    0,59969536) = **533.739,52 TL**.


    **(c)** Sabit kira: 200.000 × (0,8 + 0,64 + 0,512 + 0,4096) = **472.320 TL**. Artışın bugünkü değer maliyeti = 533.739,52
    − 472.320 = **61.419,52 TL**.


    **(d)** Büyüyen perpetüite = C / (r − g) = 200.000 / 0,15 = **1.333.333,33 TL**. (a) akışının 4. yıl sonu gelecek değeri
    = 533.739,52 × 1,25⁴ = **1.303.075 TL**.


    **Mevzuat dayanağı:** TMS 36 paragraf 6 uyarınca kullanım değeri, beklenen gelecekteki nakit akışlarının bugünkü değeridir.

    '
