  soru: '**Olay:** Bir portföy yöneticisi, nominal değeri 1.000 TL, yıllık %10 kuponlu (kuponlar yıl sonunda ödenir) ve vadesine
    3 yıl kalan bir tahvili incelemektedir. Piyasa getirisi (YTM) %25''tir. Aynı vadede kuponsuz (sıfır kuponlu) bir tahvil
    de bulunmaktadır.


    **İstenenler:**


    (a) Kuponlu tahvilin fiyatını bulunuz. (5 puan)


    (b) Macaulay durasyonunu ve değiştirilmiş (modified) durasyonu hesaplayınız. (7 puan)


    (c) Getiri 1 puan artarak %26''ya çıkarsa değiştirilmiş durasyon ile tahminî yeni fiyatı bulunuz. (5 puan)


    (d) Aynı vadeli sıfır kuponlu tahvilin Macaulay durasyonunu belirterek iki tahvilin getiri duyarlılığını karşılaştırınız.
    (5 puan)

    '
  cozum: '**(a)** Nakit akışları: 100; 100; 1.100. PV''ler: 80; 64; 563,20. Fiyat = **707,20 TL**.


    **(b)** Macaulay durasyonu = (1 × 80 + 2 × 64 + 3 × 563,20) / 707,20 = **2,68 yıl**. Değiştirilmiş durasyon = 2,68 / 1,25
    = **2,15**.


    **(c)** Fiyat değişimi ≈ −2,15 × 0,01 = −%2,1466. Yeni fiyat ≈ 707,20 × (1 − 2,15 × 0,01) = **692,02 TL**.


    **(d)** Sıfır kuponlu tahvilin durasyonu vadesine eşittir: **3 yıl**; değiştirilmiş durasyonu 3 / 1,25 = 2,40. 1 puanlık
    getiri artışında yaklaşık fiyat kaybı: kuponlu tahvilde %2,1466, sıfır kuponlu tahvilde %2,40. Kupon ödemeleri nakit akışlarının
    ağırlık merkezini öne çektiğinden kuponlu tahvil faiz değişimine daha az duyarlıdır.


    **Mevzuat dayanağı:** TMS 36 paragraf 6 uyarınca kullanım değeri, beklenen gelecekteki nakit akışlarının bugünkü değeridir.

    '
