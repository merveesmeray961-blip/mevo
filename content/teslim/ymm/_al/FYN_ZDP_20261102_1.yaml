      bugünkü değeridir.'
  dogrulama:
    python: 'nom=1000; kupon=100; fiyat=784

      cari = kupon/fiyat

      p25 = kupon/1.25 + (kupon+nom)/1.25**2

      ytm_yak = (kupon + (nom-fiyat)/2)/((nom+fiyat)/2)

      p20 = kupon/1.20 + (kupon+nom)/1.20**2

      degisim = p20/fiyat-1

      nom_k = nom+kupon

      pay = kupon + (nom-fiyat)/2

      payda = (nom+fiyat)/2

      sonuc = {''a'': cari, ''b'': p25, ''c'': ytm_yak, ''d'': (p20, degisim)}

      '
