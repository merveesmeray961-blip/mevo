      elli fazlasını aşamaz.
  dogrulama:
    python: 'n1, t1 = 300_000, 30

      n2, t2 = 500_000, 60

      n3, t3 = 200_000, 90

      i = 0.48

      d1 = n1*i*t1/360

      d2 = n2*i*t2/360

      d3 = n3*i*t3/360

      toplam_d = d1+d2+d3

      net = n1+n2+n3-toplam_d

      ort_vade = (n1*t1+n2*t2+n3*t3)/(n1+n2+n3)

      d_ort = (n1+n2+n3)*i*ort_vade/360

      net1 = n1-d1

      efektif1 = d1/net1*360/t1

      sonuc = {''a'': (d1,d2,d3), ''b'': (toplam_d, net), ''c'': (ort_vade, d_ort), ''d'': efektif1}

      '
