  soru: '**Olay:** Nominal değeri 1.000 TL, yıllık kupon oranı %10 (kupon yıl sonlarında ödenir) ve vadesine 2 yıl kalan bir
    tahvil borsada 784 TL''den işlem görmektedir.


    **İstenenler:**


    (a) Cari getiriyi hesaplayınız. (3 puan)


    (b) Vadeye kadar getirinin (YTM) %25 olup olmadığını deneme yöntemiyle gösteriniz. (7 puan)


    (c) Yaklaşık YTM formülü ((kupon + (nominal − fiyat) / n) / ((nominal + fiyat) / 2)) ile yaklaşık getiriyi bulunuz ve
    gerçek YTM ile farkını yorumlayınız. (5 puan)


    (d) Piyasa getirisi %20''ye düşerse tahvil fiyatı ve yüzde değişim ne olur? Fiyat–getiri ilişkisini açıklayınız. (5 puan)

    '
  cozum: '**(a)** Cari getiri = kupon / fiyat = 100 / 784 = **%12,7551** (sadece kupon geliri; fiyat artışını içermez).


    **(b)** %25 ile fiyat: 100 / 1,25 + 1.100 / 1,25² = 80 + 704 = **784 TL** = piyasa fiyatı. Fiyat eşit olduğundan YTM =
    **%25**''tir.


    **(c)** Yaklaşık YTM = (100 + (1.000 − 784) / 2) / ((1.000 + 784) / 2) = 208 / 892 = **%23,3184**. Formül bileşik etkiyi
    ve nakit akışlarının zamanlamasını yok saydığından gerçek YTM''den (%25) düşük sonuç verir.


    **(d)** %20 ile fiyat = 100 / 1,20 + 1.100 / 1,20² = **847,22 TL**; değişim = 847,22 / 784 − 1 = **%8,0641**. Piyasa getirisi
    düştüğünde sabit nakit akışlarının bugünkü değeri artar; fiyat ile getiri ters yönlüdür.


    **Mevzuat dayanağı:** TMS 36 paragraf 6 uyarınca kullanım değeri, beklenen gelecekteki nakit akışlarının bugünkü değeridir.

    '
  puanlama:
