  soru: '**Olay:** Rüzgâr Ticaret A.Ş., bugün (1 yıl = 360 gün) bankaya aşağıdaki üç alacak senedini iskonto ettirmek istemektedir.
    Banka yıllık %48 oranında basit dış (ticari) iskonto uygulamaktadır (iskonto = nominal × oran × gün / 360); komisyon yoktur.


    | Senet | Nominal (TL) | Vadeye kalan gün |

    |---|---|---|

    | 1 | 300.000 | 30 |

    | 2 | 500.000 | 60 |

    | 3 | 200.000 | 90 |


    **İstenenler:**


    (a) Her senet için iskonto tutarını hesaplayınız. (5 puan)


    (b) Toplam iskontoyu ve işletmenin eline geçecek net tutarı bulunuz. (4 puan)


    (c) Üç senedin yerine tek bir senet verilecek olsa eş değer (ortalama) vadeyi hesaplayınız ve toplam iskontonun aynı olduğunu
    gösteriniz. (8 puan)


    (d) 1. senet için işletmenin fiilen ödediği yıllık basit maliyeti (net bedel esaslı) hesaplayınız. (4 puan)

    '
  cozum: '**(a)** Senet 1 = 300.000 × 0,48 × 30 / 360 = **12.000 TL**; Senet 2 = 500.000 × 0,48 × 60 / 360 = **40.000 TL**;
    Senet 3 = 200.000 × 0,48 × 90 / 360 = **24.000 TL**.


    **(b)** Toplam iskonto = **76.000 TL**; net tutar = 1.000.000 − 76.000 = **924.000 TL**.


    **(c)** Ortalama vade = (300.000 × 30 + 500.000 × 60 + 200.000 × 90) / 1.000.000 = **57 gün**. Tek senet iskontosu = 1.000.000
    × 0,48 × 57 / 360 = **76.000 TL** = toplam iskonto.


    **(d)** Senet 1 net bedeli = 300.000 − 12.000 = 288.000 TL. Maliyet = 12.000 / 288.000 × 360 / 30 = **%50**. Dış iskonto
    oranı %48 olmasına rağmen, iskonto nominal üzerinden alındığından fiili maliyet daha yüksektir.


    **Mevzuat dayanağı:** TBK md. 88/2 uyarınca sözleşmeyle kararlaştırılacak yıllık faiz oranı, yasal belirlenen yıllık faiz
    oranının yüzde elli fazlasını aşamaz.

    '
