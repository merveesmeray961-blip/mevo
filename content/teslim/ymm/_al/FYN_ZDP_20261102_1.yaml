    madde: paragraf 6
    alinti: 'Kullanım değeri: Bir varlık veya nakit yaratan birimden elde edilmesi beklenen gelecekteki nakit akışlarının
      bugünkü değeridir.'
  dogrulama:
    python: 'kupon=100; nom=1000; y=0.25

      cf1 = kupon; cf2 = kupon; cf3 = kupon+nom

      pv1 = cf1/1.25; pv2 = cf2/1.25**2; pv3 = cf3/1.25**3

      p = pv1+pv2+pv3

      d = (1*pv1+2*pv2+3*pv3)/p

      md = d/(1+y)

      yaklasik_p = p*(1-md*0.01)

      d_sifir = 3

      md_sifir = d_sifir/(1+y)

      fark_sifir = md_sifir*0.01

      fark_kuponlu = md*0.01

      dd = md*0.01

      sonuc = {''a'': p, ''b'': (d, md), ''c'': yaklasik_p, ''d'': (fark_kuponlu, fark_sifir)}

      '
