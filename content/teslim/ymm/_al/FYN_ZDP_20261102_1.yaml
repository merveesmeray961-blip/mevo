    alinti: Her pay sahibi, kanun ve esas sözleşme hükümlerine göre pay sahiplerine dağıtılması kararlaştırılmış net dönem
      kârına, payı oranında katılma hakkını haizdir.
  dogrulama:
    python: 'eps1=5.0; g=15; fk1, g1 = 12, 12

      fk2, g2 = 20, 20

      fk3, g3 = 16, 16

      peg1, peg2, peg3 = fk1/g1, fk2/g2, fk3/g3

      peg = (peg1+peg2+peg3)/3

      fk_hedef = peg*g

      deger = fk_hedef*eps1

      piyasa = 90.0

      fk_piyasa = piyasa/eps1

      peg_piyasa = fk_piyasa/g

      d1 = 1.0

      k_ima = d1/deger + g/100

      kazanc_verimi = 1/fk_hedef

      sonuc = {''a'': (peg1, peg2, peg3, peg), ''b'': (fk_hedef, deger), ''c'': (fk_piyasa, peg_piyasa), ''d'': (k_ima, kazanc_verimi)}

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
