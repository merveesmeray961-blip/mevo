    alacaktır (4., 5. ve 6. yıl sonları). Tüm hesaplarda yıllık %25 bileşik faiz kullanılacaktır. Gerekli faktörler:


    | n | (1,25)^−n | (1,25)^n |

    |---|---|---|

    | 1 | 0,8 | 1,25 |

    | 2 | 0,64 | 1,5625 |

    | 3 | 0,512 | 1,953125 |

    | 4 | 0,4096 | 2,44140625 |

    | 5 | 0,32768 | 3,0517578125 |


    **İstenenler:**


    (a) İkramiye akışının bugünkü değerini (ertelenmiş anüite) hesaplayınız. (6 puan)


    (b) Son ikramiyenin alındığı 6. yıl sonu itibarıyla ikramiyelerin toplam gelecek değerini bulunuz. (5 puan)


    (c) Hasan Bey bu ikramiyeleri finanse etmek için 1., 2. ve 3. yıl sonlarında eşit tutarlarda birikim yapacaksa yıllık
    tutarı bulunuz. (7 puan)


    (d) İkramiyeler 3., 4. ve 5. yıl sonlarında (bir yıl erken) ödenseydi bugünkü değer ne olurdu? (4 puan)

    '
  cozum: '**(a)** 3. yıl sonunda (ilk ödemeden bir dönem önce) 3 yıllık anüite değeri = 250.000 × (0,8 + 0,64 + 0,512) = 250.000
    × 1,952 = 488.000 TL. Bugüne iskonto: 488.000 × 0,512 = **249.856 TL**.


    **(b)** Gelecek değer faktörü = (1,25³ − 1) / 0,25 = 3,8125; FV = 250.000 × 3,8125 = **953.125 TL**.


    **(c)** 3. yıl sonunda gereken tutar 488.000 TL''dir. Üç yıllık eşit birikim: 488.000 / 3,8125 = **128.000 TL**.


    **(d)** PV = 250.000 × (0,512 + 0,4096 + 0,32768) = **312.320 TL**.


    **Mevzuat dayanağı:** TMS 36 paragraf 30 uyarınca kullanım değeri hesabında gelecekteki nakit akışlarının tahmini ve paranın
    zaman değeri dikkate alınır.

    '
