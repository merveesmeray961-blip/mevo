    | Türkiye Kızılay Derneğine makbuz karşılığı nakdî bağış | 50.000 |

    | 3289 sayılı Kanun kapsamında amatör spor dalı için sponsorluk harcaması | 100.000 |

    | 3289 sayılı Kanun kapsamında profesyonel spor dalı için sponsorluk harcaması | 80.000 |


    Başka indirim yoktur. Yüzde sınırlarının hesabında beyan edilen gelir olarak 4.000.000 TL esas alınacaktır. 2026 tarifesi:
    1.000.000 TL''ye kadar 232.500 TL; 1.000.000–5.300.000 TL arası fazlası %35.


    **İstenenler:**


    (a) Her bir harcama için indirim konusu yapılabilecek tutarı gerekçesiyle belirtiniz. (10 puan)


    (b) Gelir vergisi matrahını hesaplayınız. (4 puan)


    (c) Hesaplanan gelir vergisini bulunuz. (3 puan)


    (d) Bağışın nakden değil, bir taşınır mal olarak yapılması hâlinde indirime esas değerin nasıl belirleneceğini belirtiniz.
    (3 puan)

    '
  cozum: '**(a) İndirim hesabı (GVK md. 89)**


    | Harcama | Sınır | İndirilecek |

    |---|---|---|

    | Eğitim ve sağlık | Beyan edilen gelirin %10''u = 400.000 (md. 89/2) | 400.000 |

    | Kamu idaresine bağış | Beyan edilen gelirin %5''i = 200.000 (md. 89/4) | 200.000 |

    | Kızılay bağışı | Tamamı (md. 89/11) | 50.000 |

    | Amatör spor sponsorluğu | Tamamı (md. 89/8) | 100.000 |

    | Profesyonel spor sponsorluğu | %50 (md. 89/8) | 40.000 |

    | **Toplam** | | **790.000** |


    **(b) Matrah**


    4.000.000 − 790.000 = **3.210.000 TL**.


    **(c) Vergi**


    1.000.000 için 232.500 TL; (3.210.000 − 1.000.000) × %35 = 773.500 TL. Toplam **1.006.000 TL**.


