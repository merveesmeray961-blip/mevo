    (b) İndirim tutarını hesaplayınız (ticari kazancın toplam matrah içindeki oranını dikkate alınız). (6 puan)


    (c) 2026 yılında ödenmesi gereken gelir vergisini ve indirimden mahsup edilemeyen tutarı bulunuz. (5 puan)


    (d) Mahsup edilemeyen tutarın akıbetini açıklayınız. (3 puan)

    '
  cozum: '**(a) Şartlar (mükerrer md. 121)**


    | Şart | Değerlendirme |

    |---|---|

    | İndirimin hesaplanacağı yıl ile önceki iki yıl (2026, 2025, 2024) beyannamelerinin kanunî süresinde verilmesi | 2023
    ilgili değil. 2024 beyannamesi süresinde verilmiş, sonraki düzeltme ihlal sayılmaz. Sağlandı |

    | Kesinleşmiş ikmalen/re''sen tarhiyat bulunmaması | 100.000 TL, indirim tutar sınırının %1''ini (12.000.000 × %1 = 120.000
    TL) aşmadığından ihlal sayılmaz. Sağlandı |

    | Beyannameler üzerine tahakkuk eden vergilerin ödenmiş ve 1.000 TL''yi aşan vadesi geçmiş borç bulunmaması | Sağlandı
    |

    | İndirimin hesaplanacağı yıl ile önceki dört takvim yılında VUK md. 359 fiillerinin işlenmemiş olması | Dönem 2022–2026;
    2021 dışarıdadır. Sağlandı |


    Tüm şartlar sağlandığından indirimden yararlanılır.


    **(b) İndirim**


    İndirim, hesaplanan verginin %5''idir; ancak gelir vergisi mükelleflerinde ticari, zirai veya mesleki kazancın toplam
    matrah içindeki oranı dikkate alınarak hesaplanan vergi esas alınır.

    - Ticari kazanç oranı = 4.000.000 / 6.000.000 = 2/3

    - Esas vergi = 2.017.500 × 2/3 = 1.345.000 TL

    - İndirim = 1.345.000 × %5 = **67.250 TL** (12.000.000 TL sınırını aşmaz)


    **(c) Ödenecek vergi**


    Ödenmesi gereken vergi = 2.017.500 − 1.990.000 = 27.500 TL. İndirim bu tutardan düşülür: 27.500 − 27.500 = **0 TL** ödenecek
    vergi. Mahsup edilemeyen indirim = 67.250 − 27.500 = **39.750 TL**.


    **(d)** Kalan 39.750 TL, yıllık beyannamenin verilmesi gereken tarihi izleyen bir tam yıl içinde mükellefin beyanı üzerine
    tahakkuk eden diğer vergilerinden mahsup edilebilir; bu süre içinde mahsup edilemeyen tutar red ve iade edilmez.


    Püf noktaları: (1) Önceki iki yıl beyannamesine bakılır; 2023 önemsizdir. (2) VUK md. 359 fiilleri için beş yıllık dönem
    (cari yıl + önceki dört yıl) kontrol edilir. (3) Gelir vergisinde indirim ticari/zirai/mesleki kazanç oranıyla orantılanır.

    '
