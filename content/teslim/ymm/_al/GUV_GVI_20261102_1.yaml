    sermaye iradı toplamı) 4.000.000 TL''dir. Burak Bey''in 2026 yılında yaptığı ve belgelendirdiği harcamalar aşağıdadır:


    | Harcama | Tutar (TL) |

    |---|---|

    | Kendisi, eşi ve küçük çocuklarının Türkiye''de yapılan, belgelenen eğitim ve sağlık harcamaları | 600.000 |

