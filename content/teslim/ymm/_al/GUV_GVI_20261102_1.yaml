  soru: '**Olay:** Tam mükellef Esra Çelik''in 2026 yılında yıllık beyannameyle bildireceği gelirleri şunlardır:


    | Gelir | Tutar (TL) | Ek bilgi |

    |---|---|---|

    | Ticari kazanç (gerçek usul) | 1.500.000 | - |

    | Yerli Sanayi A.Ş.''den (tam mükellef) kâr payı | 400.000 | Dağıtım sırasında tevkif edilen vergi: 60.000 TL |

    | Weber GmbH''den (Almanya) kâr payı | 600.000 | Esra Hanım ödenmiş sermayenin %25''ine sahiptir; kâr payı beyanname verilmesi
    gereken tarihe kadar Türkiye''ye transfer edilmiştir |

    | Delta B.V.''den (Hollanda) kâr payı | 200.000 | Esra Hanım ödenmiş sermayenin %15''ine sahiptir; kâr payı süresinde
    Türkiye''ye transfer edilmiştir |


    Her iki yabancı kurum da kanunî ve iş merkezi Türkiye''de bulunmayan anonim/limited şirket niteliğindedir. Başka indirim
    ve gelir yoktur. 2026 yılı için GVK md. 22/4''teki ödenmiş sermaye oranı 29/4/2026 tarihli ve 11257 sayılı Cumhurbaşkanı
    Kararı ile belirlenmiştir. Tarife (2026): 1.000.000 TL''ye kadar 232.500 TL; fazlası %35 (5.300.000 TL''ye kadar).


    **İstenenler:**


    (a) Üç kâr payının istisna durumunu gerekçesiyle belirtiniz. (9 puan)


    (b) Gelir vergisi matrahını hesaplayınız. (4 puan)


    (c) Hesaplanan gelir vergisini ve tevkif edilen vergi mahsubundan sonra ödenecek vergiyi bulunuz. (4 puan)


    (d) Weber GmbH kâr payının beyanname verilmesi gereken tarihe kadar Türkiye''ye transfer edilmemiş olması hâlinde vergi
    farkını hesaplayınız. (4 puan)

    '
  cozum: '**(a) İstisna (GVK md. 22)**


    | Kâr payı | Dayanak | İstisna |

    |---|---|---|

    | Yerli Sanayi A.Ş. | Md. 22/3: tam mükellef kurumdan alınan kâr paylarının yarısı müstesna | 200.000 |

    | Weber GmbH | Md. 22/4 ve 11257 sayılı Karar: ödenmiş sermayenin en az %20''sine sahip olunması ve süresinde transfer;
    %25 ≥ %20 | Yarısı = 300.000 |

    | Delta B.V. | Pay %15 < %20 olduğundan md. 22/4 şartı sağlanmıyor | 0 |


    **(b) Matrah**


    1.500.000 + 200.000 + 300.000 + 200.000 = **2.200.000 TL**.


    **(c) Vergi**


    1.000.000 için 232.500 TL; 1.200.000 × %35 = 420.000 TL. Toplam **652.500 TL**.

    İstisna edilen tutar dahil kâr payı üzerinden tevkif edilen verginin tamamı (60.000 TL) mahsup edilir: ödenecek = 652.500
    − 60.000 = **592.500 TL**.


    **(d)** Transfer şartı sağlanmazsa Weber GmbH kâr payının tamamı (600.000) vergiye tabi olur: matrah 2.500.000 TL; vergi
    = 232.500 + 1.500.000 × %35 = 757.500 TL. Fark = 757.500 − 652.500 = **105.000 TL** (300.000 × %35).


    Püf noktaları: (1) Yurt dışı kurumlarda istisna oranı yarıdır ve pay oranı eşiği 11257 sayılı Karar ile %20''dir (kanun
    metnindeki %50 değildir). (2) Transfer yıllık beyannamenin verilmesi gereken tarihe kadar yapılmalıdır. (3) Tevkifat istisna
    edilen kısım dahil tüm kâr payından yapılır ve tamamı mahsup edilir.

    '
