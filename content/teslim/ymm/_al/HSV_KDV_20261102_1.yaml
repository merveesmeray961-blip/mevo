    160.000 − 100.000 = 60.000 TL. Toplam = **460.000 TL**.


    **(b)** Fazla veya yersiz hesaplanan ve Hazineye ödenen vergi, Maliye Bakanlığının belirleyeceği usul ve esaslara göre
    işlemi yapan mükellefe iade edilir. Şu kadar ki iadenin yapılabilmesi için işlemle ilgili **beyanların düzeltilmesi**
    ve fazla veya yersiz hesaplanan verginin **satıcı tarafından alıcıya geri verilmesi** şarttır.


