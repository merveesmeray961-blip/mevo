    Ekim.


    **(b)** Mart: 800.000 × %20 = 160.000; Mayıs: 500.000 × %20 = 100.000 (fatura) + 200.000 × %20 = 40.000 (teslim) = 140.000;
    Temmuz: komisyon yoluyla satış (3): 300.000 × %20 = 60.000 ve (4) 400.000 × %20 = 80.000 → Temmuz toplam 140.000; Ağustos:
