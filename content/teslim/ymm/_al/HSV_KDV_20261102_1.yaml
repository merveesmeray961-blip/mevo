    hallerde matrah emsal bedeldir → (1) **1.000.000 TL**. (2) Karşılıksız verilen mal teslim sayılır (md. 3/a); bedeli bilinmeyen/yok
    olduğundan matrah emsal bedeli (md. 27/1): **50.000 TL**. (3) Bedelin mal olması halinde matrah işlemin mahiyetine göre
    emsal bedeli: **600.000 TL**. (Karşı taraftaki mal alımı ayrı bir işlemdir.) (4) Serbest meslek faaliyetlerinde ilgili
    meslek teşekküllerince tespit edilmiş bir tarife varsa, hizmetin bedeli bu tarifede gösterilen ücretten düşük olamaz (md.
