    (a) Faturada KDV göstermeye hakkı olmadığı hâlde gösterilen vergiden kimin sorumlu olduğunu md. 8/2''ye göre belirtiniz;
    sorumlu olunan toplam yersiz/fazla vergiyi hesaplayınız. (9 puan)


    (b) Hazine''ye ödenen fazla/yersiz verginin iade edilebilmesi için aranan şartları belirtiniz. (10 puan)


    (c) Birinci işlem hatasız düzenlenseydi 2.000.000 TL''lik ihracat teslimi hangi hükümle KDV''den istisna olurdu ve faturada
    KDV hesaplanır mıydı? (6 puan)

    '
