    **(b)** Toplam matrah = 1.000.000 + 50.000 + 600.000 + 100.000 = 1.750.000 TL; KDV = **350.000 TL**.


    **(c)** Md. 27/4: KDV uygulaması bakımından emsal bedelin tayininde genel idare giderleri ve genel giderlerden mamule
