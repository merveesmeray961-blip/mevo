    ilgilidir ve işletmeden çekilmiştir.

    3. Takas (trampa): şirket 600.000 TL emsal bedelli mal verip karşılığında 580.000 TL emsal bedelli mal almıştır (bedel
    mal olarak ödenmiştir).

    4. Mali müşavirin müşterisine verdiği hizmet için ilgili meslek teşekkülünce tespit edilmiş tarifedeki ücret 100.000 TL,
    uygulanan ücret 70.000 TL''dir.


    **İstenenler:**


    (a) Her işlemde KDV matrahını md. 27''ye göre belirleyiniz. (12 puan)


    (b) Hesaplanan KDV toplamını bulunuz. (5 puan)


    (c) Emsal bedelin tayininde genel idare giderleri hakkındaki kuralı md. 27/4''e göre belirtiniz. (4 puan)


    (d) Emsal bedelin hangi mevzuata göre tespit edildiğini belirtiniz. (4 puan)

    '
