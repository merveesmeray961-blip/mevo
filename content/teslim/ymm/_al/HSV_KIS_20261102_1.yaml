  soru: '**Aras Gıda A.Ş.** Haziran 2026 KDV dönemine ilişkin verileri aşağıdadır (genel oran %20; Mayıs''tan devreden KDV
    150.000 TL''dir):


    | İşlem | Tutar (KDV hariç) | KDV |

    |---|---|---|

    | Yurt içi satışlar (%20) | 4.000.000 TL | 800.000 TL |

    | Hammadde alımları (belgeli, defterlere kaydedilmiş) | 2.000.000 TL | 400.000 TL |

    | Yönetim kurulu başkanı için alınan binek otomobil (şirketin faaliyeti araç kiralama/işletme değildir) | 1.500.000 TL
    | 300.000 TL |

    | Depo yangınında zayi olan mallar (mücbir sebep ilanı yoktur) | 200.000 TL | 40.000 TL |

    | Ofis kırtasiye alımları | 100.000 TL | 20.000 TL |


    Ek bilgi: Hammadde alımlarına ait KDV''nin 50.000 TL''si, Mart 2024''te düzenlenen bir faturaya ilişkindir ve bu fatura
    ilk kez Haziran 2026''da kanuni defterlere kaydedilmiştir. 50.000 TL, yukarıdaki 400.000 TL''ye dahildir.


    **İstenenler:**


    (a) İndirilemeyecek KDV''leri gerekçeleriyle belirtiniz. (8 puan)


    (b) Mart 2024 tarihli faturadaki KDV''nin indirim konusu yapılıp yapılamayacağını md. 29/3''e göre değerlendiriniz. (6
    puan)


    (c) Haziran dönemi indirilecek KDV toplamını ve ödenecek KDV''yi bulunuz. (7 puan)


    (d) Devreden KDV''nin hukuki durumunu ve iade edilip edilemeyeceğini md. 29/2''ye göre belirtiniz. (4 puan)

    '
  cozum: '**(a)** Binek otomobil KDV''si 300.000 TL md. 30/b gereği indirilemez (faaliyet araç kiralama/işletme değil). Zayi
    olan mallara ait 40.000 TL md. 30/c gereği indirilemez (deprem, sel ve mücbir sebep ilan edilen yangın hariç; bu vakada
    ilan yok).


    **(b)** Md. 29/3: indirim hakkı, vergiyi doğuran olayın vuku bulduğu takvim yılını takip eden takvim yılı aşılmamak şartıyla
    kullanılır. Mart 2024 işlemi için son yıl 2025''tir; Haziran 2026''da kayıt süre dışıdır, **50.000 TL indirilemez**.


    **(c)**

    | Kalem | KDV |

    |---|---|

    | Hammadde (400.000 − 50.000) | 350.000 |

    | Kırtasiye | 20.000 |

    | Önceki dönemden devreden | 150.000 |

    | **İndirilecek toplam** | **520.000** |


    Hesaplanan 800.000 − 520.000 = **280.000 TL ödenecek KDV**.


    **(d)** Md. 29/2: indirilecek KDV hesaplanandan fazlaysa fark sonraki dönemlere devreder ve iade edilmez. Bu dönemde devreden
    150.000 TL indirim konusu yapılmış, ödenecek vergi çıktığından devir kalmamıştır.


    Püf noktaları: Devreden tutar da indirilecek toplama girer; süre aşımı ile 30/b-c ayrı ayrı ele alınır.

    '
