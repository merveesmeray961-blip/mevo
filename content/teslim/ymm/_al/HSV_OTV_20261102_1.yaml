  soru: '**Eylül Alkollü İçki San. A.Ş.**, (III) sayılı listenin (A) cetvelindeki bir alkollü içkinin imalatçısıdır. Ağustos
    2026 döneminde 20.000 litre ürün satmıştır. Veriler:


    - Litre başına ÖTV ve KDV hariç satış bedeli: 400 TL

    - Bu vakada (A) cetveli için nispi vergi oranı %60''tır.

    - Bu vakada asgari maktu vergi tutarı litre başına 280 TL kabul edilecektir (ürünün litresi itibarıyla).

    - KDV oranı %20''dir.


    **İstenenler:**


    (a) Nispi vergiyi ve asgari maktu vergiye göre hesaplanan tutarı bulunuz. (8 puan)


    (b) Ödenecek ÖTV''yi md. 11/5''e göre belirleyiniz. (6 puan)


    (c) Bu ÖTV''nin KDV matrahına etkisi bakımından toplam KDV''yi hesaplayınız. (6 puan)


    (d) Bu mallara ilişkin ÖTV beyannamesinin verilme süresini md. 14''e göre belirtiniz. (5 puan)

    '
  cozum: '**(a)** Nispi vergi = 20.000 × 400 × %60 = 4.800.000 TL. Asgari maktu vergi = 20.000 × 280 = 5.600.000 TL.


    **(b)** Md. 11/5: (A) cetvelindeki mallar için asgari maktu vergi tutarlarına göre hesaplanacak vergi tutarından az olmamak
    üzere yalnızca nispi vergi uygulanır. Nispi vergi (4.800.000) asgari maktu vergiden (5.600.000) az olduğundan ödenecek
    ÖTV = **5.600.000 TL**.


    **(c)** KDV matrahı = 8.000.000 (satış) + 5.600.000 (ÖTV) = 13.600.000 TL; KDV = **2.720.000 TL**.


    **(d)** Md. 14/1: (III) sayılı listedeki mallar için vergilendirme dönemi aylık; beyanname dönemi izleyen ayın onbeşinci
    günü akşamına kadar verilir (Ağustos dönemi için 15 Eylül 2026).


    Püf noktaları: Nispi vergi, asgari maktu tutarın altında kalırsa asgari maktu vergi ödenir.

    '
