    | Bilgi | Tutar (ÖTV ve KDV hariç) |

    |---|---|

    | Galerinin alış bedeli | 1.500.000 TL |

    | Galerinin müşteriye satış bedeli | 1.350.000 TL |

    | Aracın imalatçısının satış bedeli | 1.400.000 TL |


    Bu vakada aracın tabi olduğu ÖTV oranı %50 kabul edilecek olup, ilk iktisaba ilişkin işlemin satış sırasında galeri adına
    yapıldığı varsayılacaktır.


    **İstenenler:**


    (a) Md. 12''ye göre ÖTV''nin hesaplanacağı alt sınırı belirleyiniz ve ödenecek ÖTV''yi hesaplayınız. (10 puan)


    (b) Galerinin satış bedeli üzerinden hesaplanan ÖTV ile md. 12''ye göre ödenecek ÖTV arasındaki farkı bulunuz. (5 puan)


    (c) Md. 13/3 uyarınca (II) sayılı listedeki mallara ilişkin işlemleri yapanların yükümlülüğünü belirtiniz. (5 puan)

    '
  cozum: '**(a)** Md. 12/1 ek paragraf: (II) sayılı listedeki mallardan alınacak vergi, mükellefin bu malı **alış bedeli**
    ile her hâlükârda bu malların imalatçısının satış bedeli veya ithalatta hesaplanan KDV matrahı üzerinden malın tabi olduğu
    orana göre hesaplanan vergi tutarından az olamaz. Alt sınır matrah = en yüksek olan: 1.500.000 TL (alış) > 1.400.000 TL
    (imalatçı satışı). ÖTV = 1.500.000 × %50 = **750.000 TL**.


    **(b)** Satış bedeli üzerinden: 1.350.000 × %50 = 675.000 TL. Fark = 750.000 − 675.000 = **75.000 TL**; ödenecek vergi
    alt sınır nedeniyle 750.000 TL''dir.


    **(c)** Md. 13/3: (II) sayılı listedeki malların ilk iktisabı, teslimi veya ithaline ilişkin işlemleri gerçekleştirenler,
    bu işlemlerden önce ÖTV''nin ödendiğini gösteren belgeleri aramak zorundadır.


    Püf noktaları: Zararına satışta bile ÖTV alış bedeli ve imalatçı bedeli esas alınarak alt sınırın altına inemez.

    '
