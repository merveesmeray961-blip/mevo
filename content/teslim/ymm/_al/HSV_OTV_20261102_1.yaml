      unsurlardan teşekkül eder.
  - mevzuat: 3065 sayılı KDV Kanunu
    madde: md. 24
    alinti: b) Ambalaj giderleri, sigorta, komisyon ve benzeri gider karşılıkları ile vergi, resim, harç, pay, fon karşılığı
