  soru: '**Doruk Otomotiv A.Ş.** 2026 yılında Almanya''dan bir binek otomobili ithal etmiştir ve (II) sayılı listede yer alan
    bu araç için gümrük beyannamesi 12 Mart 2026''da tescil edilmiştir. Veriler:


    | Unsur | Tutar |

    |---|---|

    | Gümrük vergisine esas kıymet (CIF) | 800.000 TL |

    | Gümrük vergisi (CIF''in %10''u) | 80.000 TL |

    | Başka vergi, resim, harç veya masraf | Yoktur |


    Ek bilgiler: Bu vakada aracın tabi olduğu ÖTV oranı %60, KDV oranı %20 kabul edilecektir. Aracın yurt içi imalatçı satış
    bedeli ve diğer alt sınırlar dikkate alınmayacaktır.


    **İstenenler:**


    (a) ÖTV matrahını ve ÖTV tutarını hesaplayınız. (8 puan)


    (b) KDV matrahını ve ödenecek KDV''yi bulunuz; ÖTV''nin KDV matrahı yönünden durumunu belirtiniz. (8 puan)


    (c) Gümrük idaresince hesaplanan ÖTV''nin ne zaman ödeneceğini md. 14''e göre belirtiniz. (5 puan)


    (d) Aracı ithal eden mükellefin ÖTV''yi satış belgelerinde nasıl göstermek zorunda olduğunu belirtiniz (md. 15). (4 puan)

    '
  cozum: '**(a)** Md. 11/3: (II) sayılı listedeki mallar için matrah, bunların ilk iktisabı ve ithalinde, hesaplanacak ÖTV
    hariç, KDV matrahını oluşturan unsurlardan teşekkül eder. KDVK md. 21 ithalat matrahı: gümrük vergisine esas kıymet +
    ithalat sırasında ödenen vergi, resim, harç ve paylar = 800.000 + 80.000 = **880.000 TL**. ÖTV = 880.000 × %60 = **528.000
    TL**.


    **(b)** KDV matrahı = 880.000 + 528.000 = **1.408.000 TL** (KDVK md. 24/b: vergi karşılığı unsurlar matraha dahildir,
    ÖTV KDV matrahına girer). KDV = 1.408.000 × %20 = **281.600 TL**.


    **(c)** Md. 14/3: ithalatta alınan vergi gümrük idaresince hesaplanır, ithalat vergileri ile **aynı zamanda ödenir**.


    **(d)** Md. 15/1: mükellefler ÖTV''yi satış belgelerinde **ayrıca göstermeye** mecburdur.


    Püf noktaları: ÖTV matrahına ÖTV girmez; KDV matrahına ÖTV girer. Sıra: ÖTV → KDV.

    '
