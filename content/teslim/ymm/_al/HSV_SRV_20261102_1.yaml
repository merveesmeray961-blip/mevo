  soru: '**Güvenli Bankası A.Ş.**, 2026 yılı Mart ayında iki ayrı ödeme yapmıştır:


    1. Ölen müşterisinin mirasçısına, veraset ve intikal vergisinin ödendiğine dair vergi dairesinden tasdikname istemeden
    **800.000 TL** vadesiz mevduat bakiyesini ödemiştir.

    2. Bir müşterisine ivazsız intikale konu olan **600.000 TL** tutarındaki parayı, tasdikname ibraz ettirmeden vermiştir.


    Banka, hiçbir tevkifat yapmamıştır. Eksiklik 5 Mayıs 2026''da tespit edilmiştir. Bu vakada gecikme zammı aylık %3,5, basit
    olarak ve 2 ay üzerinden hesaplanacaktır; 6183 sayılı Kanun hükümleri uyarınca zam bankadan istenecektir.


    **İstenenler:**


    (a) Banka tasdikname ibraz edilmeyen ödemelerde hangi oranlarda tevkifat yapmak zorundaydı? Tevkif edilmesi gereken tutarları
    hesaplayınız. (8 puan)


    (b) Tevkifatı yapmayan bankadan istenecek tutarı gecikme zammıyla birlikte hesaplayınız. (8 puan)


    (c) Bu görevleri süresinde yerine getirmeyen sorumlulardan ayrıca tahsil edilecek cezayı hesaplayınız. (5 puan)


    (d) Tevkif edilen paranın yatırılma süresi ve nereye yatırılacağını belirtiniz. (4 puan)

    '
