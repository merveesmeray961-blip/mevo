    **İstenenler:**


    (a) Kerem ve Selim''in ödeyeceği vergiyi ayrı ayrı hesaplayınız. (12 puan)


    (b) İki mükellefin beyanname verme süresini ve son tarihi belirtiniz. (5 puan)


    (c) Hibe edilen mala ilişkin borçların tenzili için md. 12/b şartını belirtiniz (hibe eden borcu üstlenmişse). (4 puan)


    (d) Vergi hangi dairece tarh edilir? (md. 6) (4 puan)

    '
  cozum: '**(a)** Matrah (her ikisi için) = 4.000.000 − 66.935 = **3.933.065 TL**.

    - Selim: 3.000.000 × %10 = 300.000 + 933.065 × %15 = 139.959,75 → **439.959,75 TL**.

    - Kerem: ana, baba, eş ve çocuklarından ivazsız mal intikalinde vergi, ivazsız intikal tarifesindeki oranların **yarısı**
    uygulanarak hesaplanır (%5 ve %7,5): 3.000.000 × %5 = 150.000 + 933.065 × %7,5 = 69.979,88 → **219.979,88 TL**.


    **(b)** Md. 9/2: diğer suretle vakı intikallerde malların hukuken iktisap edildiği tarihi takip eden **bir ay** içinde:
    3 Mart 2026 + 1 ay → **3 Nisan 2026**.


    **(c)** Md. 12/b: diğer suretle iktisaplarda intikal eden malın aynına taallük eden borçlarla vergi borçları tenzil edilir;
    ancak hibe eden hibe ettiği mala taallük eden borçları kendi üzerine almış veya öyle taahhüt etmişse bu borçlar nazara
    alınmaz.


    **(d)** Md. 6: diğer suretle vukua gelen intikallerde tasarrufu yapan şahsın ikametgâhının bulunduğu yer vergi dairesi
    tarafından.


    Püf noktaları: Ana-baba-çocuk-eş arasındaki ivazsız intikallerde tarife yarıya iner; istisna her iki durumda aynıdır.

    '
