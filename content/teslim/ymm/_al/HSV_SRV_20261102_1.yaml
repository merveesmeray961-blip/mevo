    = 90.000 TL. Toplam = **130.000 TL**.


    **(b)** Tevkifat yapmayanlardan tevkif etmeye ve yatırmaya mecbur oldukları paralar, 6183 sayılı Kanun''a göre gecikme
    zammı uygulanarak tahsil edilir: zam = 130.000 × %3,5 × 2 = 9.100 TL; toplam = **139.100 TL**.


    **(c)** Görevlerini süresinde yerine getirmeyen sorumlulardan, tevkif etmeye ve yatırmaya mecbur oldukları paraların **%10''u**
