  cozum: '**(a) Niteliği ve yöntem**


    Finansal tablolarda yükümlülüğün hiç kaydedilmemesi, finansal tablo unsurlarının finansal tablolara alınması ile ilgili
    bir **geçmiş dönem hatasıdır** (TMS 8 par. 41); muhasebe tahmini değişikliği değildir (par. 48). Kural geriye dönük yeniden
    düzenlemedir (par. 42-43). Ancak hatanın sunulan geçmiş döneme (2025) ait **dönemler itibarıyla etkisi belirlenemediği**
    için 2025 karşılaştırmalı tutarları yeniden düzenlenemez; bu durumda varlık, yükümlülük ve özkaynakların geriye dönük
    yeniden düzenlemenin mümkün olduğu en erken döneme ait açılış bakiyeleri (burada 1.1.2026) yeniden düzenlenir (par. 44).
    Böylece 31.12.2025 bakiyesi 1.1.2026 açılışında düzeltilir; 2026 kâr veya zararı değişmez (par. 46).


    **(b) Düzeltme kaydı (1.1.2026 açılış)**


    - Birikimli ücretli izinlerin beklenen maliyeti, birikmiş kullanılmayan haklar dolayısıyla ödenmesi beklenen tutardır
    (TMS 19 par. 16). Yükümlülük = 150 gün × 1.200 TL = **180.000 TL**

    - Geçmiş Yıllar Kârları (Dağıtılmamış Kârlar) (B) 180.000 / Kullanılmayan İzin Yükümlülüğü (Karşılığı) (A) 180.000

