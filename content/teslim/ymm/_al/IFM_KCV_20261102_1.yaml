  soru: 'Yücel Elektrik AŞ''nin (kısaca "Şirket") 31.12.2026 tarihli finansal tablolarına ilişkin aşağıdaki bilgiler verilmiştir.


    **Taraflar**


    1. Yücel Holding AŞ: Şirketin %60 paya sahip ana ortaklığı.

    2. Ege Kablo AŞ: Yücel Holding AŞ''nin %100 bağlı ortaklığı (Şirketle doğrudan işlemi vardır).

    3. Orman Enerji AŞ: Şirketin %30 oranında pay sahibi olduğu ve üzerinde önemli etkisi bulunan işletme.

    4. Bay Kaya: Şirketin yönetim kurulu başkanı (kilit yönetici personel). Bay Kaya, aynı zamanda Atlas Ltd.''nin de yönetim
    kurulu üyesidir; Atlas Ltd. ile Şirket arasında başka bir ilişki yoktur.

    5. Deniz Ltd.: Bay Kaya''nın eşinin tek başına kontrol ettiği işletme.

    6. Mavi Banka AŞ: Şirketin kredi kullandığı banka; Şirket üzerinde kontrol ya da önemli etkisi yoktur.

    7. Tuna Dağıtım Ltd.: Şirketin satışlarının %45''ini yapan ve ekonomik olarak şirkete bağımlı olduğu için büyük hacimde
    işlem yapılan acente; kontrol veya önemli etki ilişkisi yoktur.


    **Kilit yönetici personele 2026''da sağlanan faydalar**


    | Fayda | Tutar (TL) |

    |---|---|

    | Ücret, prim ve ikramiye (12 ay içinde ödenecek) | 4.200.000 |

    | İşten ayrılma sonrası emeklilik faydası | 600.000 |

    | Hizmet yılı bağlı jübile ödemeleri (12 aydan sonra ödenecek) | 300.000 |

    | İşten çıkarma tazminatı | 500.000 |

    | Hisse bazlı ödemeler | 400.000 |


    **Orman Enerji AŞ ile işlemler**


    2026''da Şirket, Orman Enerji AŞ''den 1.800.000 TL tutarında enerji hizmeti satın almıştır. Yıl sonunda Şirket''in Orman
    Enerji AŞ''ye 350.000 TL borcu, Orman Enerji AŞ''den ise 900.000 TL (brüt) ticari alacağı vardır; bu alacak için 120.000
    TL şüpheli alacak karşılığı ayrılmıştır.


    **İstenenler**


    (a) Her bir tarafın Şirket bakımından TMS 24''e göre ilişkili taraf olup olmadığını gerekçesiyle belirtiniz. (9 puan)


    (b) Kilit yönetici personele sağlanan tazminatın toplamını ve dipnotta hangi kategorilerde ayrı ayrı açıklanacağını belirtiniz.
    (5 puan)


    (c) Orman Enerji AŞ ile ilgili olarak ilişkili taraf açıklamalarında yer alacak asgari bilgileri sayınız; açıklanacak
    net alacak bakiyesi ve karşılık tutarını belirtiniz. (6 puan)

    '
  cozum: '**(a) İlişkili taraf değerlendirmesi (TMS 24 par. 9-11)**


    | Taraf | İlişkili mi? | Gerekçe |

    |---|---|---|

    | Yücel Holding AŞ | Evet | Ana ortaklık; aynı grubun üyesi (par. 9(b)(i)) |

    | Ege Kablo AŞ | Evet | Aynı grubun üyesi, yani diğer bağlı ortaklık (par. 9(b)(i)) |

    | Orman Enerji AŞ | Evet | Şirketin iştiraki (par. 9(b)(ii)) |

    | Bay Kaya | Evet | Şirketin kilit yönetici personeli (par. 9(a)(iii)) |

    | Atlas Ltd. | Hayır | İki işletmenin ortak bir yöneticiye sahip olması, ilişkili taraf sayılmasına yetmez (par. 11(a))
    |

    | Deniz Ltd. | Evet | Kilit yöneticinin yakın aile üyesi (eş) tarafından kontrol edilmektedir (par. 9(b)(vi), yakın aile
