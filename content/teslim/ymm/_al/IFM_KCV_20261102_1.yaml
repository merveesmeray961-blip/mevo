  - mevzuat: TMS 8
    madde: par. 36
    alinti: '36 37’nci paragrafın uygulandığı değişiklikler dışında kalan muhasebe tahminindeki bir değişikliğin etkisi, aşağıda
      belirtilen dönemlerin kâr veya zararına dâhil edilmek suretiyle, ileriye yönelik olarak finansal tablolara yansıtılır:'
  - mevzuat: TMS 40
    madde: par. 30
    alinti: Finansal tablolara alma sonrası ölçüm Muhasebe politikası 30 32A paragrafında belirtilen istisnai durumlar dışında
      işletme, muhasebe politikası olarak 33-55’inci paragraflarda ele alınan gerçeğe uygun değer yöntemini veya 56’ncı paragrafta
      ele alınan maliyet yöntemini seçer ve bu yöntemi tüm yatırım amaçlı gayrimenkullerine uygular.
  - mevzuat: TMS 40
    madde: par. 35
    alinti: 34 [Silinmiştir] 35 Yatırım amaçlı gayrimenkulün gerçeğe uygun değer değişiminden kaynaklanan kazanç veya kayıp,
      oluştuğu dönemde kâr veya zarar olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 8
    madde: par. 22
    alinti: TMS 8 Geriye dönük uygulama 22 23’üncü paragraf hükümleri saklı kalmak kaydıyla, muhasebe politikasındaki bir
      değişiklik 19’uncu paragrafın (a) veya (b) bentleri uyarınca geriye dönük olarak uygulandığında, değişiklikten etkilenen
      her bir özkaynak kaleminin sunulan en erken döneme ait açılış bakiyesi ve sunulan her bir geçmiş dönemde açıklanan diğer
      karşılaştırmalı tutarlar, yeni muhasebe politikası baştan beri uygulanıyormuş gibi düzeltilir.
