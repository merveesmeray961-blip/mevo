  soru: 'Başak Holding AŞ, 1.7.2026''da Çınar Ltd.''nin tüm paylarını nakden 4.000.000 TL''ye satın alarak işletme birleşmesi
    gerçekleştirmiştir (vergi oranı %25). Edinilen işletmede:


    - Makinenin gerçeğe uygun değeri 1.000.000 TL, vergiye esas değeri 700.000 TL''dir.

    - Diğer tanımlanabilir net varlıkların gerçeğe uygun değeri 2.400.000 TL olup bunların vergiye esas değerleri gerçeğe
    uygun değerlerine eşittir.

    - Satın alma işlemi için vergi mevzuatında şerefiye amortismanı gibi bir indirim öngörülmemiştir (şerefiyenin vergiye
    esas değeri sıfırdır).


    Ayrıca Başak Holding AŞ, işletme birleşmesi niteliğinde olmayan bir işlemle 1.10.2026''da 500.000 TL''ye bir tesis satın
    almıştır. Tesis için vergi mevzuatı hiçbir amortisman indirimi ya da satışta maliyet düşümü tanımamakta (vergiye esas
    değer sıfır), işlem muhasebe kârını da vergiye tabi kârı da etkilememektedir; tesisin faydalı ömrü 5 yıl olup doğrusal
    amortisman uygulanmaktadır.


    **İstenenler**


    (a) Edinilen makine için ertelenmiş vergi yükümlülüğünü hesaplayınız; bu yükümlülüğü dikkate alarak şerefiyeyi bulunuz
    ve ertelenmiş vergi yükümlülüğünün şerefiye üzerindeki etkisini belirtiniz. (8 puan)


    (b) Şerefiyenin kendisi için ertelenmiş vergi yükümlülüğü muhasebeleştirilip muhasebeleştirilmeyeceğini gerekçesiyle belirtiniz.
