  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 15
    alinti: Ertelenmiş vergi borçlarının ve ertelenmiş vergi varlıklarının muhasebeleştirilmesi Vergiye tabi geçici farklar
      15 Bütün vergiye tabi geçici farklar için ertelenmiş vergi yükümlülüğü muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 53
    alinti: 53 Ertelenmiş vergi varlığı ve ertelenmiş vergi borcu iskontoya tabi tutulmaz.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 51B
    alinti: 51B Ertelenmiş vergi borcu veya ertelenmiş vergi varlığı TMS 16’da yer alan yeniden değerleme yöntemi kullanılarak
      ölçülen amortismana tabi olmayan bir varlıktan kaynaklanabilir.
  dogrulama:
    python: '

      oran=0.25

      arsa_eski=3000000; arsa_yeni=4400000

      bina_eski=2000000; bina_yeni=2600000

      art_arsa=arsa_yeni-arsa_eski

