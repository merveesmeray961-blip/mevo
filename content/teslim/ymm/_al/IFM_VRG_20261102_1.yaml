  soru: 'Akdeniz Gıda AŞ''nin 31.12.2026 tarihli TFRS finansal tabloları hazırlanırken geçici farklara ilişkin veriler aşağıdadır.
    Vergi oranı %25''tir ve bu oran, ilgili farkların tersine döneceği dönemlerde de geçerlidir. İşletme gelecekte yeterli
    vergiye tabi kâr elde edeceğini öngörmektedir.


    | Kalem | TFRS defter değeri | Vergiye esas değer / açıklama |

    |---|---|---|

    | Makine (net) | 2.400.000 | VUK''a göre net değer 1.900.000 TL |

    | Stoklar (net) | 840.000 | Maliyet bedeli 1.000.000 TL; TFRS''de 160.000 TL değer düşüklüğü ayrılmış, vergi mevzuatında
    indirilemez |

    | Kıdem tazminatı karşılığı | 400.000 (borç) | Ödenene kadar vergiden indirilemez; vergiye esas değer sıfır |

    | Dava karşılığı | 200.000 (borç) | Ödenene kadar vergiden indirilemez; vergiye esas değer sıfır |


    - 31.12.2025 itibarıyla kayıtlı net ertelenmiş vergi varlığı 30.000 TL''dir.

    - 2026 TFRS vergi öncesi kârı 3.000.000 TL, vergi mevzuatına göre hesaplanan kurumlar vergisi matrahı 3.100.000 TL''dir
    (indirim ve istisna yoktur; ödenecek vergi dönem sonunda tahakkuk ettirilecektir).


    **İstenenler**


    (a) Her bir kalem için geçici farkın türünü (vergiye tabi / indirilebilir) belirleyiniz; 31.12.2026 ertelenmiş vergi varlıklarının
    ve yükümlülüğünün tutarlarını hesaplayınız. (8 puan)


    (b) Net ertelenmiş vergi varlığını bulunuz; 2026 ertelenmiş vergi gelirini (giderini), cari vergi giderini ve toplam vergi
    giderini hesaplayınız. (6 puan)


    (c) Dönem vergisini ve ertelenmiş vergiyi kâr veya zararda gösteren yevmiye kayıtlarını (hesap adlarıyla) yapınız; 2026
    net dönem kârını bulunuz. (6 puan)

    '
  cozum: '**(a) Geçici farklar (TMS 12 par. 5, 15, 24)**


    | Kalem | Fark | Tür | Ertelenmiş vergi (%25) |

    |---|---|---|---|

    | Makine | 2.400.000 − 1.900.000 = 500.000 | Vergiye tabi (defter > vergi esası) | Yükümlülük **125.000** |

    | Stoklar | 1.000.000 − 840.000 = 160.000 (vergi esası defterden yüksek) | İndirilebilir | Varlık **40.000** |

    | Kıdem tazminatı karşılığı | 400.000 − 0 | İndirilebilir | Varlık **100.000** |

    | Dava karşılığı | 200.000 − 0 | İndirilebilir | Varlık **50.000** |


    Toplam ertelenmiş vergi varlığı = 40.000 + 100.000 + 50.000 = **190.000 TL** (gelecekte yeterli vergiye tabi kâr beklendiğinden
    tamamı finansal tablolara alınır).


    **(b) Net tutar ve vergi gideri**


    - Net ertelenmiş vergi varlığı = 190.000 − 125.000 = **65.000 TL**

    - 2026 ertelenmiş vergi geliri = 65.000 − 30.000 = **35.000 TL**

    - Cari vergi gideri = 3.100.000 × %25 = **775.000 TL**

    - Toplam vergi gideri = 775.000 − 35.000 = **740.000 TL**


    **(c) Kayıtlar**


    1. Dönem Vergi Gideri (B) 775.000 / Ödenecek Kurumlar Vergisi (A) 775.000

    2. Ertelenmiş Vergi Varlığı (B) 35.000 / Ertelenmiş Vergi Geliri (A) 35.000


    Ertelenmiş vergi varlığı ve yükümlülüğü ayrı ayrı izlenir; aynı vergi idaresine ilişkin olduklarından bilançoda mahsup
    koşulları sağlandığında net gösterilebilir (par. 74). Net dönem kârı = 3.000.000 − 740.000 = **2.260.000 TL**.

    '
  puanlama:
  - olcut: (a) Geçici farkların türü ve ertelenmiş vergi tutarları
    puan: 8
  - olcut: (b) Net varlık, ertelenmiş vergi geliri, cari vergi ve toplam vergi gideri
    puan: 6
  - olcut: (c) Kayıtlar ve net dönem kârı
    puan: 6
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 5
    alinti: 'Geçici farklar: Bir varlığın veya borcun finansal durum tablosundaki defter değeri ile bunların vergi açısından
      taşıdıkları değerler arasındaki farkları ifade eder.'
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 15
    alinti: Ertelenmiş vergi borçlarının ve ertelenmiş vergi varlıklarının muhasebeleştirilmesi Vergiye tabi geçici farklar
      15 Bütün vergiye tabi geçici farklar için ertelenmiş vergi yükümlülüğü muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 24
    alinti: İndirilebilir geçici farklar 24 İndirilebilir bütün geçici farklar için, ileriki dönemlerde bu farkların indirilmesine
      yetecek kadar vergiye tabi gelir oluşacağının muhtemel olması koşuluyla ertelenmiş vergi varlığı muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 74
    alinti: '74 Bir işletme ertelenmiş vergi varlığı ile ertelenmiş vergi borcunu ancak ve ancak aşağıdaki durumlarda mahsup
      eder:'
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 58
    alinti: 'Kâr veya zararda muhasebeleştirilen kalemler 58 Dönem vergisi ve ertelenmiş vergi gelir veya gider olarak, verginin
      aşağıdaki durumlarda ortaya çıkmamış olması koşuluyla, dönemin kâr veya zararına dahil edilir:'
  dogrulama:
    python: '

      oran=0.25

      mk_def=2400000; mk_vuk=1900000

      stok_def=840000; stok_vuk=1000000

      kidem=400000; dava=200000

      dtl=(mk_def-mk_vuk)*oran

      dta_stok=(stok_vuk-stok_def)*oran

      dta_kidem=kidem*oran

      dta_dava=dava*oran

      net26=dta_stok+dta_kidem+dta_dava-dtl

      net25=30000

      dt_gelir=net26-net25

      matrah=3100000

      cari=matrah*oran

      vergi_gideri=cari-dt_gelir

      vo=3000000

      net_kar=vo-vergi_gideri

      sonuc={''dtl'':dtl,''dta'':dta_stok+dta_kidem+dta_dava,''net26'':net26,''dt_gelir'':dt_gelir,''cari'':cari,''vergi_gideri'':vergi_gideri,''net_kar'':net_kar}

      '
