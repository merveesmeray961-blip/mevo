  soru: 'Orhan İnşaat AŞ''nin 31.12.2026 tarihli finansal tablolarında kullanılmamış mali zarar ve geçici farklara ilişkin
    veriler şöyledir (vergi oranı %25; ertelenmiş vergi varlığı yok olarak başlangıçta kayıtlı bir tutar yoktur):


    - 2026 sonunda gelecek dönemlere devreden kullanılabilir mali zarar 1.200.000 TL''dir. Zarar, işletmenin iş yerinde yaşanan
    ve sigorta kapsamı dışında kalan bir sel felaketinden kaynaklanan, yinelenmesi beklenmeyen olağandışı bir nedene dayanmaktadır.

    - Yönetim kurulunca onaylı 3 yıllık iş planında vergiye tabi kâr tahminleri: 2027 yılı 250.000 TL, 2028 yılı 400.000 TL;
    2029 ve sonrası için güvenilir bir tahmin yapılamamaktadır.

    - İşletmenin 31.12.2026''da, aynı vergi idaresi ve aynı mükellefe ilişkin, 2027 yılında tersine dönecek 300.000 TL tutarında
    vergiye tabi geçici farkı (makine amortisman farkı) bulunmaktadır. Bu fark için ertelenmiş vergi yükümlülüğü henüz kaydedilmemiştir.


    **İstenenler**


    (a) Mali zarardan kaynaklanan ertelenmiş vergi varlığının hangi koşullarda finansal tablolara alınabileceğini ve bu olayda
    dikkate alınacak ölçütleri belirtiniz. (7 puan)


    (b) Finansal tablolara alınacak ertelenmiş vergi varlığını, vergiye tabi geçici fark için ertelenmiş vergi yükümlülüğünü
    ve net tutarı hesaplayınız; finansal tablolara alınmayacak kısmın vergi etkisini bulunuz. (8 puan)


    (c) 31.12.2026 kayıtlarını yapınız ve açıklanması gereken hususu belirtiniz. (5 puan)

    '
  cozum: '**(a) İlke**


    Kullanılmamış mali zararlar için ertelenmiş vergi varlığı, ilerideki dönemlerde bunların mahsup edilmesine yeterli tutarda
    vergilendirilebilir gelir elde edilmesinin muhtemel olması hâlinde muhasebeleştirilir (TMS 12 par. 34). Ölçütler (par.
    36): aynı vergi idaresi ve mükellefe ilişkin yeterli vergiye tabi geçici farkın bulunması (bu farklar zararın süresi dolmadan
    tersine dönecekse), yeterli vergiye tabi kâr beklentisi ve zararın yinelenmesi beklenmeyen tanımlanabilir nedenlerden
    kaynaklanması. Burada üç ölçüt de zararın bir bölümü için sağlanmaktadır; 2029 sonrası kâr için güvenilir dayanak yoktur.


    **(b) Hesaplar**


    - Mahsup edilebilecek zarar = min(1.200.000; 300.000 geçici fark + 250.000 + 400.000) = **950.000 TL**

    - Ertelenmiş vergi varlığı = 950.000 × %25 = **237.500 TL**

    - Ertelenmiş vergi yükümlülüğü = 300.000 × %25 = **75.000 TL**

    - Net ertelenmiş vergi varlığı = **162.500 TL**

    - Tanınmayan zarar = 250.000 TL; vergi etkisi **62.500 TL**


    **(c) Kayıtlar ve açıklama**


    - Ertelenmiş Vergi Varlığı (B) 237.500 / Ertelenmiş Vergi Yükümlülüğü (A) 75.000 / Ertelenmiş Vergi Geliri (A) 162.500

    - Aynı vergi idaresi ve mükellefe ilişkin olduğundan (par. 74) bilançoda net 162.500 TL ertelenmiş vergi varlığı gösterilir.

    - Finansal tablolara alınmayan 62.500 TL tutarındaki ertelenmiş vergi varlığı potansiyeli ile ertelenmiş vergi varlığının
    tutarını destekleyen karineler dipnotta açıklanır (par. 81(e), 82).

    '
  puanlama:
  - olcut: (a) Mali zarar için ertelenmiş vergi varlığı koşulları ve ölçütleri
    puan: 7
  - olcut: (b) Üç tutar ve tanınmayan kısım
    puan: 8
  - olcut: (c) Kayıt, mahsup ve açıklama
    puan: 5
  kaynaklar:
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 34
    alinti: Kullanılmamış mali zararlar ve vergi avantajları 34 Henüz kullanılmamış geçmiş yıl mali zararları ve vergi avantajları
      için ilerideki dönemde bunların mahsup edilmesine yeterli olacak tutarda vergilendirilebilir gelir elde edileceğinin
      muhtemel olması halinde ertelenmiş vergi varlığı muhasebeleştirilir.
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 36
    alinti: '36 Bir işletme birikmiş mali zararlarını ve vergi avantajlarını kullanabilmesinin olanaklı olup olmadığını belirlerken
      aşağıdaki kriterleri göz önünde bulundurur:'
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 74
    alinti: '74 Bir işletme ertelenmiş vergi varlığı ile ertelenmiş vergi borcunu ancak ve ancak aşağıdaki durumlarda mahsup
      eder:'
  - mevzuat: TMS 12 Gelir Vergileri
    madde: par. 24
    alinti: İndirilebilir geçici farklar 24 İndirilebilir bütün geçici farklar için, ileriki dönemlerde bu farkların indirilmesine
      yetecek kadar vergiye tabi gelir oluşacağının muhtemel olması koşuluyla ertelenmiş vergi varlığı muhasebeleştirilir.
  dogrulama:
    python: '

      oran=0.25

      zarar=1200000

      dtl_fark=300000

      kar27=250000; kar28=400000

      kullan=min(zarar,dtl_fark+kar27+kar28)

      dta=kullan*oran

      dtl=dtl_fark*oran

      net=dta-dtl

      tanimayan=(zarar-kullan)*oran

      sonuc={''kullan'':kullan,''dta'':dta,''dtl'':dtl,''net'':net,''tanimayan'':tanimayan}

      '
