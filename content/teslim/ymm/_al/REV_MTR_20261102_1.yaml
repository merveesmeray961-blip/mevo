- id: TASLAK
  sinav: ymm
  ders: REV
  konu: MTR
  kazanimlar:
  - geçici vergi
  - geçici vergi mahsubu
  zorluk: 2
  puan: 22
  sure_dk: 28
  soru: '**Olay:** Sera Tarım A.Ş. (tam mükellef, takvim yılı) 2026 yılı üçer aylık dönemlerine ilişkin geçici vergi matrahlarını
    (kümülatif, indirim ve istisnalar dikkate alınmış) aşağıdaki gibi hesaplamıştır:


    | Dönem | Kümülatif geçici vergi matrahı (TL) |

    |---|---|

    | 1. dönem (Ocak-Mart) | 2.000.000 |

    | 2. dönem (Ocak-Haziran) | 5.000.000 |

    | 3. dönem (Ocak-Eylül) | 8.000.000 |


    İkinci dönemde kurum bünyesinde, dönem içinde tevkif edilmiş vergi bulunmamaktadır. Üçüncü dönemde mevduat faizinden kesilmiş
    60.000 TL vergi mevcuttur ve aynı dönem içinde kesilmiştir. Kurumlar vergisi oranı %25''tir; indirimli geçici vergi oranı
    uygulanmayacaktır. Şirket önceki dönemlerin geçici vergilerini tam ve zamanında ödemiştir. 2026 yıllık kurumlar vergisi
    hesaplanan tutarı 3.100.000 TL''dir.


    **İstenenler:**


    (a) Geçici verginin hangi oranla ve hangi matrah üzerinden hesaplandığını belirterek her dönemde ödenecek geçici vergiyi
    bulunuz. (9 puan)


    (b) Geçici vergi beyannamesinin verileceği ve verginin ödeneceği günü (üç aylık dönemi izleyen ikinci ayın hangi günleri)
    belirtiniz. (4 puan)


    (c) 2. dönem geçici vergisinin hesabında bir önceki dönem geçici vergisinin nasıl dikkate alındığını açıklayınız. (4 puan)


    (d) Yıllık beyannamede ödenecek kurumlar vergisini (3. dönem geçici vergisine kadar ödenen geçici vergilerin mahsubu suretiyle)
    hesaplayınız. (5 puan)

    '
  cozum: '**(a)** Kurumlar vergisi mükellefleri cari dönemin kurumlar vergisi oranında (%25) geçici vergi öder (KVK 32/2);
    hesap GVK mükerrer md. 120''ye göre üçer aylık dönem kazançları üzerinden yapılır.


    | Dönem | Kümülatif vergi (%25) | Önceki ödenen | Mahsup | Ödenecek |

    |---|---|---|---|---|

    | 1 | 500.000 | 0 | 0 | 500.000 |

    | 2 | 1.250.000 | 500.000 | 0 | 750.000 |

    | 3 | 2.000.000 | 1.250.000 | 60.000 | 690.000 |


    **(b)** Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın **ondördüncü günü** akşamına kadar beyan edilir ve
    **onyedinci günü** akşamına kadar ödenir (ör. 1. dönem için Mayıs ayı).


    **(c)** Kümülatif hesaplanan vergiden önceki dönemlerde ödenen geçici vergi düşülür: 1.250.000 - 500.000 = 750.000 TL.


    **(d)** Yıllık beyannamede ödenen geçici vergiler mahsup edilir: 500.000 + 750.000 + 690.000 = 1.940.000 TL; stopaj 60.000
    TL de md. 34 uyarınca mahsup edilebilir. Mahsup: KV 3.100.000 - 1.940.000 - 60.000 = **1.100.000 TL** ödenecektir (4.
    dönem geçici vergisi ayrıca dikkate alınmamıştır).


    Püf noktaları: (1) Geçici vergi kümülatif matrah üzerinden hesaplanır. (2) Beyan 14, ödeme 17''sidir. (3) Dönem içi tevkifat
    o dönem geçici vergisinden mahsup edilir.

    '
  puanlama:
  - olcut: (a) Oran (%25) ve kümülatif hesap ilkesi
    puan: 3
  - olcut: (a) Her dönem ödenecek tutar (500.000 / 750.000 / 690.000)
    puan: 6
  - olcut: (b) 14 ve 17. günler
    puan: 4
  - olcut: (c) Önceki dönem geçici verginin düşülmesi
    puan: 4
  - olcut: (d) Yıllık beyanname ödemesi (1.100.000)
    puan: 5
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/2
    alinti: (2) Kurumlar vergisi mükelleflerince, (dar mükellefiyete tâbi kurumlarda ticarî ve ziraî kazançlarla sınırlı olarak)
      câri vergilendirme döneminin kurumlar vergisine mahsup edilmek üzere Gelir Vergisi Kanununda belirtilen esaslara göre
      ve câri dönemin kurumlar vergisi
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/2 (devam)
    alinti: oranında geçici vergi ödenir. Tam mükellef kurumlar için geçerli olan esaslar, dar mükellef kurumlara da aynen
      uygulanır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 120/1
    alinti: Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın ondördüncü günü akşamına kadar bağlı olunan vergi
      dairesine beyan edilir ve onyedinci günü akşamına kadar ödenir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 34/4
    alinti: (4) Geçici vergilendirme dönemi içinde elde edilen gelirler üzerinden kesinti yoluyla ödenmiş vergilerin bulunması
      halinde bu vergiler, o dönem için hesaplanan geçici vergi tutarından da mahsup edilebilir. İlgili hesap dönemine ilişkin
      tahakkuk ettirilen geçici verginin sadece ödenen kısmı yıllık kurumlar vergisi beyannamesi üzerinden hesaplanan kurumlar
      vergisinden mahsup edilir.
  dogrulama:
    python: 'g1 = 2000000 * 0.25

      g2 = 5000000 * 0.25 - g1

      g3 = 8000000 * 0.25 - 5000000 * 0.25 - 60000

      yillik = 3100000 - (g1 + g2 + g3) - 60000

      sonuc = {"a": [g1, g2, g3], "d": yillik}

      '
