yazar: harici üretici
gorev: YMM talimatı 2026-11-02
klasik:
- id: TASLAK
  sinav: ymm
  ders: REV
  konu: MTR
  kazanimlar:
  - ticari bilanço kârından mali kâra geçiş
  - istisnalar ve indirimlerin sırası
  - bağış ve sponsorluk indirimleri
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Olay:** Pınar Elektronik A.Ş.''nin (tam mükellef, hesap dönemi takvim yılı) 2026 yılına ilişkin verileri şöyledir:


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 10.000.000 |

    | Kanunen kabul edilmeyen giderler | 1.200.000 |

    | Tam mükellef iştirakten elde edilen kâr payı (ticari kârda) | 1.500.000 |

    | 2023 yılı zararı (beyannamede gösterilmiş) | 2.000.000 |

    | Amatör spor dalları için makbuzla yapılan sponsorluk harcaması | 400.000 |

    | Belediyeye makbuzla yapılan bağış | 900.000 |


    Bağış indiriminde esas alınacak kurum kazancı, KV Genel Tebliği''ndeki formüle göre bulunacaktır. Kurumlar vergisi oranı
    %25''tir.


    **İstenenler:**


    (a) Kurum kazancının hangi sırayla istisna, zarar ve indirimlerle azaltılacağını belirtiniz. (5 puan)


    (b) Bağış ve yardımlarda indirim konusu yapılabilecek tutarı hesaplayınız ve indirilemeyen kısmın akıbetini belirtiniz.
    (7 puan)


    (c) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (7 puan)


    (d) Yurt içi asgari kurumlar vergisi karşılaştırmasını yapınız. (5 puan)

    '
  cozum: '**(a)** Kurum kazancı = ticari bilanço kârı + KKEG; bundan istisna kazançlar (iştirak kâr payı) ve geçmiş yıl zararı
    (md. 9) düşülür; sonra md. 10 kapsamındaki indirimler "sırasıyla" yapılır (önce sponsorluk (b), sonra bağış (c) ...).


    **(b)** Tebliğ''e göre indirim sınırı için esas kurum kazancı = ticari bilanço kârı - (iştirak kazançları istisnası +
    geçmiş yıl zararları) = 10.000.000 - (1.500.000 + 2.000.000) = 6.500.000 TL; %5''i = **325.000 TL**. Bağışın 900.000 TL''sinden
    yalnız 325.000 TL indirilir; **575.000 TL** indirilemez ve diğer yıla nakledilemez.


    **(c)**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 10.000.000 |

    | + KKEG | 1.200.000 |

    | - İştirak kazancı istisnası | (1.500.000) |

    | - 2023 zararı | (2.000.000) |

    | = İndirim öncesi | 7.700.000 |

    | - Sponsorluk (amatör spor, %100) | (400.000) |

    | - Bağış (%5 sınırı) | (325.000) |

    | **Matrah** | **6.975.000** |


    KV = 6.975.000 x %25 = **1.743.750 TL**.


    **(d)** Asgari vergi: kurum kazancı 11.200.000; md. 32/C(2)(a) gereği iştirak kazancı istisnası (5/1-a) düşülür: 9.700.000;
    %10 = 970.000 TL. Hesaplanan vergi fazla olduğundan ödenecek KV **1.743.750 TL**''dir.


    Püf noktaları: (1) Bağış sınırının tabanı Tebliğ formülüyle bulunur; KKEG ve diğer indirimler tabana girmez. (2) Amatör
    spor sponsorluğunun tamamı indirilir. (3) İndirilemeyen bağış devretmez.

    '
  puanlama:
  - olcut: (a) İstisna, zarar ve indirim sırası
    puan: 5
  - olcut: (b) Tebliğ formülüyle sınırın bulunması (325.000) ve devretmeme
    puan: 7
  - olcut: (c) Matrah tablosu ve KV
    puan: 7
  - olcut: (d) Asgari KV ve karşılaştırma
    puan: 5
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-b
    alinti: b) 21/5/1986 tarihli ve 3289 sayılı Gençlik ve Spor Genel Müdürlüğünün Teşkilat ve Görevleri Hakkında Kanun ile
      17/6/1992 tarihli ve 3813 sayılı Türkiye Futbol Federasyonu Kuruluş ve Görevleri Hakkında Kanun kapsamında yapılan sponsorluk
      harcamalarının sözü edilen kanunlar uyarınca tespit edilen amatör spor dalları için tamamı, profesyonel spor dalları
      için % 50’si.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-c
    alinti: c) Genel ve özel bütçeli kamu idarelerine, il özel idarelerine, belediyelere ve köylere, Cumhurbaşkanınca vergi
      muafiyeti tanınan vakıflara ve kamu yararına çalışan dernekler ile bilimsel araştırma ve geliştirme faaliyetinde bulunan
      kurum ve kuruluşlara makbuz karşılığında yapılan bağış ve yardımların toplamının o yıla ait kurum kazancının % 5’ine
      kadar olan kısmı.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 10.3.2.1
    alinti: İndirilebilecek bağış ve yardım tutarının tespitinde esas alınan kurum kazancı, zarar mahsubu dahil giderler ile
      iştirak kazançları istisnası düşüldükten sonra, indirim ve istisnalar düşülmeden önceki [Ticari bilanço kârı – (iştirak
      kazançları istisnası + geçmiş yıl zararları)] tutardır.
  - mevzuat: 1 Seri No.lu Kurumlar Vergisi Genel Tebliği
    madde: 10.3.2.1 (devretmeme)
    alinti: İndirilemeyen kısım diğer yıla nakledilemez.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 32/C/2-a
    alinti: '(2) Yurt içi asgari kurumlar vergisi hesaplanırken birinci fıkrada belirtilen kurum kazancından aşağıdaki istisna
      ve indirimler düşülür: a) 5 inci maddenin birinci fıkrasının (a), (ç), (i), (j) ve (k) bentleri'
  dogrulama:
    python: 'taban = 10000000 - (1500000 + 2000000)

      bagis = min(900000, taban * 0.05)

      matrah = 10000000 + 1200000 - 1500000 - 2000000 - 400000 - bagis

      kv = matrah * 0.25

      asgari = (10000000 + 1200000 - 1500000) * 0.10

      sonuc = {"b": bagis, "c": kv, "d": max(kv, asgari), "devretmez": 900000 - bagis}

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
