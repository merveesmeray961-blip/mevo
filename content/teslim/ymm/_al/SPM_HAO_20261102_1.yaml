  sure_dk: 32
  soru: 'Aşağıdaki ortaklıklar kendi paylarını geri almayı planlamaktadır. Genel kurul tarafından onaylanmış bir geri alım
    programı bulunmamaktadır:


    | Ortaklık | Durum |

    |---|---|

    | **Mavi Metal A.Ş.** | Payları borsada işlem görür; pay nominal değeri 1 TL; günlük ağırlıklı ortalama fiyat, yönetim
    kurulu karar tarihinden bir ay önce 10 TL, karar tarihinde 8 TL (düşüş tam %20) |

    | **Yeşil Holding A.Ş.** | Payları borsada işlem görür; nominal değer 1 TL; günlük ağırlıklı ortalama fiyat son bir ayda
    0,90 TL''ye gerilemiştir |

    | **Zirve Tarım A.Ş.** | Halka açık ortaklık; payları borsada işlem görmez; değerleme raporunda birim pay değeri 50 TL
    |


    **İstenenler:**

    (a) Mavi Metal ve Yeşil Holding''in genel kurul kararı olmaksızın yönetim kurulu kararıyla geri alım yapıp yapamayacağını
    belirtiniz. (9 puan)

    (b) Genel kurul onaylı programların azami sürelerini; borsada işlem gören ortaklık, borsada işlem görmeyen ortaklık ve
    çalışanlara pay edindirme amaçlı program bakımından belirtiniz. (6 puan)

    (c) Zirve Tarım''ın yönetim kurulu kararıyla geri alım yapıp yapamayacağını belirtiniz ve geri alım fiyatının alt-üst
    limitlerini hesaplayınız. (10 puan)

    '
  cozum: '**(a)** Payları borsada işlem gören ortaklıklar, yakın ve ciddi bir kayıptan kaçınmak amacıyla yönetim kurulu kararıyla
    geri alım yapabilir. Yakın ve ciddi kayıp, günlük ağırlıklı ortalama fiyatın yönetim kurulu karar tarihinden önceki son
    bir ayda **nominal değerin altında seyretmesi** veya **yüzde yirminin üzerinde değer kaybetmesi** hâlinde kabul edilir
    (II-22.1 md. 5/4-5).


    | Ortaklık | Ölçüt | Sonuç |

    |---|---|---|

    | Mavi Metal | Kayıp (10−8)/10 = %20; "yüzde yirminin üzerinde" değil; fiyat nominalin üzerinde | Yakın ve ciddi kayıp
    yok; genel kurul kararı veya işlem öncesi **Kurul onayı** gerekir (md. 5/6) |

    | Yeşil Holding | 0,90 TL < 1 TL nominal | Yakın ve ciddi kayıp var; yönetim kurulu kararıyla geri alım yapabilir (md.
    12 kamuyu aydınlatma şartıyla) |


    **(b)** Md. 7: borsada işlem gören ortaklıklar için azami **üç yıl**; borsada işlem görmeyenler için azami **bir yıl**;
    amacı çalışanlara yönelik pay edindirme planı olan programlarda üç yıllık süre **beş yıla** uzatılabilir.


    **(c)** Payları borsada işlem görmeyen ortaklıklar yakın ve ciddi kayıp gerekçesiyle genel kurul kararı olmaksızın yönetim
    kurulu kararıyla geri alım **yapamaz** (md. 6/1); program genel kurulca onaylanmalıdır. Programda değerleme raporundaki
    birim pay değerine yukarı ve aşağı yönde **yüzde on marj** uygulanarak alt ve üst fiyat limitleri belirlenir: alt = 50
    × 0,90 = **45 TL**, üst = 50 × 1,10 = **55 TL**.

    '
  puanlama:
  - olcut: '(a) Mavi Metal: %20''nin ''üzerinde'' olmaması ve nominal üstü olması nedeniyle yakın ve ciddi kaybın bulunmaması'
    puan: 5
  - olcut: '(a) Yeşil Holding: nominal değerin altında seyretme'
    puan: 4
  - olcut: (b) 3 yıl, 1 yıl ve 5 yıl
    puan: 6
  - olcut: (c) Borsada işlem görmeyen ortaklığın yönetim kurulu kararıyla geri alım yapamaması
    puan: 4
  - olcut: (c) %10 marjla 45 TL ve 55 TL
    puan: 6
  kaynaklar:
  - mevzuat: II-22.1 Geri Alınan Paylar Tebliği
    madde: md. 5/4
    alinti: Payları borsada işlem gören ortaklıklar, yakın ve ciddi bir kayıptan kaçınmak amacıyla genel kurulun yetkilendirmeye
      ilişkin kararı olmadan yönetim kurulu kararıyla da, bu Tebliğin 12 nci maddesindeki kamuyu aydınlatmaya ilişkin yükümlülüklere
      uymak şartıyla geri alım yapabilir.
  - mevzuat: II-22.1 Geri Alınan Paylar Tebliği
    madde: md. 5/5-6
    alinti: (5) Ortaklık paylarının günlük ağırlıklı ortalama fiyatının yönetim kurulu karar tarihinden önceki son bir ayda,
      a) Nominal değerinin altında seyretmesi veya b) Yüzde yirminin üzerinde değer kaybetmesi, durumlarında yakın ve ciddi
      bir kaybın varlığı kabul edilir. (6) Beşinci fıkrada belirtilen haller dışında yönetim kurulu kararı ile geri alım yapılabilmesi
      için, ortaklık tarafından işlem öncesinde Kurulun onayının alınması gereklidir.
  - mevzuat: II-22.1 Geri Alınan Paylar Tebliği
    madde: md. 7/1
    alinti: (1) Genel kurul tarafından onaylanmış geri alım programının süresi payları borsada işlem gören ortaklıklar için
      azami üç yıl, payları borsada işlem görmeyen ortaklıklar için ise azami bir yıldır.
  - mevzuat: II-22.1 Geri Alınan Paylar Tebliği
