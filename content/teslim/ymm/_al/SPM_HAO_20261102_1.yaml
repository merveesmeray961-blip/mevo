- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - kâr payı dağıtımı
  - payları borsada işlem görmeyen ortaklıklarda kâr payı
  - kâr payı dağıtımı kamuyu aydınlatma
  zorluk: 3
  puan: 24
  sure_dk: 32
  soru: 'Halka açık ortaklık olan, ancak payları borsada işlem görmeyen **Deniz Gıda A.Ş.**''nin 2025 hesap dönemine ilişkin
    bilgileri şöyledir:


    | Kalem | Tutar |

    |---|---|

    | Net dağıtılabilir dönem kârı (bağışlar eklenmeden) | 9.000.000 TL |

    | Dönem içinde yapılan bağışlar (Tebliğe uygun) | 1.000.000 TL |

    | Ödenmiş sermaye (Senaryo 1) | 30.000.000 TL |

    | Ödenmiş sermaye (Senaryo 2) | 50.000.000 TL |


    Esas sözleşmede yönetim kurulu üyelerine ve çalışanlara kâr payı dağıtılabileceği öngörülmüş, ancak herhangi bir oran
    belirlenmemiştir. Genel kurul, kâr payının üç eşit taksitte ödenmesini ve çalışanlara da ayrıca kâr payı verilmesini görüşmektedir.


    **İstenenler:**

    (a) Dağıtılması gereken asgari kâr payı tutarını hesaplayınız. (5 puan)

    (b) Senaryo 1 ve Senaryo 2''de şirketin kâr payı dağıtmama imkânının bulunup bulunmadığını hesaplayarak belirtiniz. (8
    puan)

    (c) Senaryo 1''de pay sahiplerine asgari tutar dağıtılmış olsa, çalışanlara ve yönetim kurulu üyelerine dağıtılabilecek
    en yüksek toplam tutarı bulunuz. (5 puan)

    (d) Kâr payının taksitle ödenmesinin mümkün olup olmadığını belirtiniz. (3 puan)

    (e) Kâr dağıtımına ilişkin yönetim kurulu önerisinin ne zaman ve nasıl kamuya duyurulacağını belirtiniz. (3 puan)

    '
  cozum: '**(a)** Payları borsada işlem görmeyen ortaklıklarda kâr payı dağıtım oranı, bağışlar eklenmiş net dağıtılabilir
    dönem kârının **yüzde yirmisinden az olamaz** (II-19.1 md. 7/1): (9.000.000 + 1.000.000) × %20 = **2.000.000 TL**.


    **(b)** Hesaplanan kâr payı, sermayenin %5''inden düşükse ya da net dağıtılabilir dönem kârı 100.000 TL''nin altındaysa
    ortaklık kâr payı dağıtmayabilir (md. 7/3).


    | Senaryo | Sermayenin %5''i | 2.000.000 TL ile karşılaştırma | Sonuç |

    |---|---|---|---|

    | 1 | 30.000.000 × 0,05 = 1.500.000 TL | 2.000.000 ≥ 1.500.000 | Dağıtmama imkânı **yok**; dağıtım zorunlu |

    | 2 | 50.000.000 × 0,05 = 2.500.000 TL | 2.000.000 < 2.500.000 | Dağıtmayabilir; nedeniyle birlikte kamuya duyurulur |


    **(c)** Esas sözleşmede oran belirlenmemişse bu kişilere dağıtılacak kâr payı, imtiyazdan kaynaklananlar hariç, pay sahiplerine
    dağıtılan kâr payının **dörtte birini** aşamaz (md. 5/4): 2.000.000 × 1/4 = **500.000 TL**.


    **(d)** Payları borsada işlem görmeyen ortaklıklar kâr payını tam ve nakden dağıtmak zorundadır ve taksitle kâr dağıtımından
    **yararlanamaz** (md. 7/2).


    **(e)** Yönetim kurulu önerisi, Kurulca belirlenen kâr dağıtım tablosuyla birlikte **en geç olağan genel kurul gündeminin
    ilan edildiği tarihte** özel durum düzenlemeleri çerçevesinde kamuya duyurulur; ayrıca merkezin bulunduğu yerde yayınlanan
    en az bir gazetede ve varsa internet sitesinde ilan edilir; tablo merkezde incelemeye açık tutulur (md. 8/2).

    '
  puanlama:
  - olcut: (a) Bağışların eklenmesi ve %20 oranı ile 2.000.000 TL
    puan: 5
  - olcut: '(b) Senaryo 1: 1.500.000 TL ve zorunlu dağıtım'
    puan: 4
  - olcut: '(b) Senaryo 2: 2.500.000 TL ve dağıtmama imkânı'
    puan: 4
  - olcut: (c) Pay sahiplerine dağıtılanın dörtte biri = 500.000 TL
    puan: 5
  - olcut: (d) Taksitten yararlanamama ve nakden dağıtım
    puan: 3
  - olcut: (e) Genel kurul gündem ilanı tarihi, gazete/internet ilanı
    puan: 3
  kaynaklar:
  - mevzuat: II-19.1 Kâr Payı Tebliği
    madde: md. 7/1
    alinti: (1) Payları borsada işlem görmeyen ortaklıklar için kâr payı dağıtım oranı, bu Tebliğ hükümleri uyarınca belirlenen
      bağışlar eklenmiş net dağıtılabilir dönem kârının yüzde yirmisinden az olamaz.
  - mevzuat: II-19.1 Kâr Payı Tebliği
    madde: md. 7/2
    alinti: (2) Payları borsada işlem görmeyen ortaklıkların kâr payını tam ve nakden dağıtmaları zorunludur. Kâr payı ödemeleri
      kâr payı kuponunun ortaklığa ibrazı karşılığında yapılır. Bu ortaklıklar, Tebliğin 5 inci maddesinin ikinci fıkrasında
      düzenlenen taksitle kâr dağıtımı uygulamasından yararlanamazlar.
  - mevzuat: II-19.1 Kâr Payı Tebliği
    madde: md. 7/3
    alinti: (3) Payları borsada işlem görmeyen ortaklıklar, bu maddenin birinci fıkrasına göre hesaplanan kâr payı tutarının
      genel kurula sunulacak son yıllık finansal tablolara göre sermayenin yüzde beşinden daha düşük olması veya söz konusu
      finansal tablolara göre net dağıtılabilir dönem kârının 100.000 TL’nin altında olması durumunda, ilgili hesap dönemi
      için kâr payı dağıtmayabilir.
  - mevzuat: II-19.1 Kâr Payı Tebliği
    madde: md. 5/4
    alinti: Esas sözleşmede söz konusu kişilere kâr payı dağıtılması hususunda hüküm bulunmasına rağmen, kâr payına ilişkin
      olarak herhangi bir oran belirlenmemişse; bu kişilere dağıtılacak kâr payı tutarı, imtiyazdan kaynaklananlar hariç her
      durumda pay sahiplerine dağıtılan kâr payının dörtte birini aşamaz.
  - mevzuat: II-19.1 Kâr Payı Tebliği
    madde: md. 8/2
    alinti: (2) Payları borsada işlem görmeyen ortaklıkların kâr dağıtımına ilişkin yönetim kurulu önerisi, şekli ve içeriği
      Kurulca belirlenen kâr dağıtım tablosu ile birlikte en geç olağan genel kurul gündeminin ilan edildiği tarihte, Kurulun
      özel durumların kamuya açıklanmasına ilişkin düzenlemeleri çerçevesinde kamuya duyurulur ve ortaklığın merkezinin bulunduğu
      yerde mahalli veya ülke çapında yayınlanan en az bir gazetede ve varsa ortaklığın internet sitesinde ilan edilir.
  dogrulama:
    python: 'matrah = 9000000 + 1000000

      asgari = matrah * 0.20

      s1 = 30000000 * 0.05

      s2 = 50000000 * 0.05

      sonuc = {''a'': asgari, ''s1_dagitmama'': asgari < s1, ''s2_dagitmama'': asgari < s2, ''c'': asgari / 4}'
