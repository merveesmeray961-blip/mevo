klasik:
- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: HAO
  kazanimlar:
  - kayıtlı sermaye
  - kayıtlı sermaye tavanının belirlenmesi ve süresi
  zorluk: 3
  puan: 25
  sure_dk: 32
  soru: 'Halka açık ortaklık olan **Kuzey Çelik A.Ş.**, 2026 yılında Kurulun iznini alarak kayıtlı sermaye sistemine geçmeyi
    planlamaktadır. Başvuru tarihine en yakın, Kurul düzenlemelerine uygun hazırlanmış ve bağımsız denetimden geçmiş **konsolide**
    finansal tablolara (31.12.2025) ilişkin veriler şöyledir:


    | Kalem | Tutar |

    |---|---|

    | Ödenmiş/çıkarılmış sermaye | 100.000.000 TL |

    | Konsolide toplam özkaynak | 210.000.000 TL |

    | Bunun azınlık paylarına ait kısmı | 50.000.000 TL |


    Şirket, 31.12.2025 tarihinden sonra ve başvurudan önce ödenmiş sermayesini **180.000.000 TL**''ye çıkarmıştır.


    **İstenenler:**

    (a) Kayıtlı sermaye tavanının üst limitini, ödenmiş sermaye artırımı yapılmamış olsaydı ulaşılacak tutarla birlikte hesaplayınız.
    (7 puan)

    (b) Gerçek durumda (ödenmiş sermayenin 180.000.000 TL olması) tavanın üst limitini bulunuz. (5 puan)

    (c) İzin 2026 yılında verilirse tavanın geçerli olacağı süreyi ve bitiş tarihini belirtiniz. (4 puan)

    (d) Süre sonunda tavana ulaşılamamış olsa da yönetim kurulunun sermaye artırımı kararı alabilmesi için gereken işlemi
    belirtiniz. (4 puan)

    (e) Sistemde nakden yapılacak ve iç kaynaktan yapılacak artırımların tavanı aşıp aşamayacağını belirtiniz. (5 puan)

    '
  cozum: '**(a)** Tavan, ödenmiş/çıkarılmış sermaye veya özsermayeden **yüksek olanının beş katını** aşamaz. Konsolide tablolar
    varsa özsermaye olarak **ana ortaklığa ait özsermaye toplamı** esas alınır: 210.000.000 − 50.000.000 = 160.000.000 TL.
    Yüksek olan 160.000.000 TL; üst limit = 5 × 160.000.000 = **800.000.000 TL**.


    **(b)** Finansal tablo tarihinden sonra ödenmiş sermaye artırılmış ve artırım sonrası sermaye (180.000.000 TL), tablolardaki
    özsermayeden (160.000.000 TL) yüksek olduğundan tavan hesabında **güncel ödenmiş sermaye** esas alınır: 5 × 180.000.000
    = **900.000.000 TL**.


    **(c)** Tavan, iznin verildiği yıl dahil **beş yıllık** süre için geçerlidir; süre takvim yılı esasına göre hesaplanır:
    2026, 2027, 2028, 2029, 2030. Bitiş: **31.12.2030**.


    **(d)** Süre sonunda tavana ulaşılamamış olsa dahi, yönetim kurulunun sermaye artırım kararı alabilmesi için daha önce
    izin verilen tavan ya da yeni bir tavan tutarı için Kurul izni alınarak yapılacak ilk genel kurul toplantısında **yeni
    bir süre için yetki alınması** zorunludur; yetki alınmazsa yönetim kurulu kararıyla sermaye artırımı yapılamaz.


    **(e)** **Nakden** yapılacak sermaye artırımlarıyla tavan **aşılamaz**. İç kaynaklar ile kâr payının sermayeye ilavesi
    suretiyle ve birleşme, bölünme gibi genel kurul kararı gerektiren işlemler sonucunda, her bir tavan kapsamında **bir defaya
    mahsus** olmak üzere tavan aşılabilir.

    '
  puanlama:
  - olcut: (a) Konsolide tablolarda ana ortaklığa ait özsermaye (160.000.000 TL) esası
    puan: 3
  - olcut: (a) Yüksek olanın 5 katı = 800.000.000 TL
    puan: 4
  - olcut: (b) Güncel ödenmiş sermayenin esas alınması ve 900.000.000 TL
    puan: 5
  - olcut: (c) İznin verildiği yıl dahil beş takvim yılı; bitiş 31.12.2030
    puan: 4
  - olcut: (d) Ilk genel kurulda yeni süre için yetki alınması
    puan: 4
  - olcut: (e) Nakden artırımla aşılamaması; iç kaynak/birleşme ile bir defaya mahsus aşılabilmesi
    puan: 5
  kaynaklar:
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 5/4
    alinti: (4) Kurulca beş yıl süreyle geçerli olmak üzere izin verilecek kayıtlı sermaye tavanı, ortaklıkların ödenmiş/çıkarılmış
      sermayesi veya özsermayesinden yüksek olanının beş katını aşamaz.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 5/4
    alinti: Ortaklıkların konsolide finansal tablolarının bulunması durumunda, kayıtlı sermaye tavanına ilişkin üst limitin
      belirlenmesinde konsolide finansal tablolardaki ana ortaklığa ait özsermaye toplamı esas alınır.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 5/5
    alinti: (5) Kayıtlı sermaye tavanına ilişkin üst limitin belirlenmesinde esas alınacak finansal tablolara ilişkin dönem
      sonu tarihinden sonra ödenmiş/çıkarılmış sermayenin artırılması ve artırım sonrası ödenmiş/çıkarılmış sermayenin dördüncü
      fıkrada belirtilen finansal tablolarda yer alan özsermaye toplamından yüksek olması durumunda, kayıtlı sermaye tavanının
      hesaplanmasında ortaklığın güncel ödenmiş/çıkarılmış sermayesi esas alınır.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 6/2
    alinti: (2) Kurulca izin verilen kayıtlı sermaye tavanı, iznin verildiği yıl da dâhil olmak üzere beş yıllık süre için
      geçerlidir. Ortaklık esas sözleşmesinde belirtilmesi gereken bu sürenin hesaplanmasında takvim yılı esas alınır.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 6/2
    alinti: Belirlenen sürenin sonunda izin verilen kayıtlı sermaye tavanına ulaşılamamış olsa dahi, yönetim kurulunun sermaye
      artırım kararı alabilmesi için daha önce izin verilen tavan ya da yeni bir tavan tutarı için Kuruldan izin almak suretiyle
      yapılacak ilk genel kurul toplantısında yeni bir süre için yetki alması zorunludur. Bu yetkinin süresi beş yıllık dönemler
      itibarıyla genel kurul kararıyla uzatılabilir. Söz konusu yetkinin alınmaması durumunda bu ortaklıklar yönetim kurulu
      kararıyla sermaye artırımı yapamaz.
  - mevzuat: II-18.1 Kayıtlı Sermaye Sistemi Tebliği
    madde: md. 6/6
    alinti: (6) Her tür iç kaynak ile kar payının sermayeye ilave edilmesi suretiyle ve birleşme, bölünme ve benzeri genel
      kurul kararı gerektiren işlemler neticesinde, her bir tavan kapsamında bir defaya mahsus olmak üzere kayıtlı sermaye
      tavanı aşılabilir. Ancak nakden yapılacak sermaye artırımları ile kayıtlı sermaye tavanı aşılamaz.
  dogrulama:
    python: 'oz = 210000000 - 50000000

      sermaye_ilk = 100000000

      guncel = 180000000

      a = 5 * max(sermaye_ilk, oz)

      b = 5 * guncel if guncel > oz else a

      sonuc = {''a'': a, ''b'': b, ''c'': 2026 + 4}'
