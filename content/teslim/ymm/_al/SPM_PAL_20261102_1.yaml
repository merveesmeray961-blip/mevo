  sure_dk: 32
  soru: 'Kurul, **Sabah Menkul Değerler A.Ş.**''nin nakit ödeme ve sermaye piyasası araçları teslim yükümlülüklerini kısa
    sürede yerine getiremeyeceğini **10 Mart 2026**''da tespit etmiştir. Tazmin kararı alınmıştır. Yatırımcıların talepleri
    aşağıdadır (bu soruda Kanundaki yüz bin Türk Lirası tutarı esas alınacak, yeniden değerleme artışı dikkate alınmayacaktır):


    | Yatırımcı | Talep |

    |---|---|

    | **A** | Sabah Menkul''de iki ayrı hesabı vardır: nakit hesabında 60.000 TL, pay hesabında 90.000 TL alacak |

    | **B** | Aldığı payların piyasa fiyatı düşmüş, 40.000 TL zarar yazmış; bunun tazminini istemektedir |

    | **C** | Sabah Menkul''ün %6 pay sahibi ortağıdır; 70.000 TL nakit alacağı bulunmaktadır |


    Tazmin kararı **1 Nisan 2026**''da ilan edilmiştir. YTM, hak sahiplerini ve tutarlarını **1 Mayıs 2026**''da belirlemiştir.
    Kurul, tazmin süreci kapanırken Sabah Menkul hakkında tedrici tasfiye kararı da vermeyi düşünmektedir.


    **İstenenler:**

    (a) Tazmin kararının en geç ne zamana kadar alınması gerektiğini belirtiniz. (4 puan)

    (b) A, B ve C''nin tazmin edilip edilmeyeceğini; edilecekse A''ya ödenecek azami tutarı belirtiniz. (10 puan)

    (c) Tazmin talep hakkının zamanaşımına uğrayacağı tarihi ve YTM''nin ödemeleri yapması gereken süreyi, zorunlu hâllerde
    uzatılabilecek en son tarihle birlikte belirtiniz. (6 puan)

    (d) Tedrici tasfiye kararının kimler hakkında verilebileceğini, işlemlerin kim tarafından yürütüleceğini ve iflas kararına
    etkisini belirtiniz. (5 puan)

    '
  cozum: '**(a)** Kurul, yatırım kuruluşunun yükümlülüklerini yerine getiremediğini veya kısa sürede getiremeyeceğini tespit
    ederse yatırımcıları tazmin kararı alır; karar durumun tespitinden itibaren **üç ay** içinde alınır (SPKn md. 82/1): 10
    Mart 2026 + 3 ay = **10 Haziran 2026**.


    **(b)**

    | Yatırımcı | Değerlendirme | Sonuç |

    |---|---|---|

    | A | Azami tazmin tutarı hak sahibi her bir yatırımcıya 100.000 TL''dir ve sınır, hesap sayısı ve türüne bakılmaksızın
    aynı kuruluştan olan tüm talepleri kapsar (md. 84/5). Toplam alacak 60.000 + 90.000 = 150.000 TL | **100.000 TL** ödenir
    |

    | B | Fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir (md. 84/2) | Tazmin **edilmez** |

    | C | Yönetim kurulu üyeleri, yöneticiler, %5 veya daha fazla paya sahip ortaklar tazmin edilmez (md. 84/4-a) | Tazmin
    **edilmez** |


    **(c)** Tazmin talebinde bulunma hakkı, tazmin kararının ilanından itibaren **bir yıl** sonra zamanaşımına uğrar (md.
    85/1): 1 Nisan 2027. YTM, hak sahiplerini ve tutarları belirledikten sonra **üç ay** içinde ödemeleri yapmakla yükümlüdür;
    zorunlu hâllerde bu süre Kurulun onayıyla en fazla **üç ay** daha uzatılabilir (md. 85/2): 1 Mayıs + 3 ay = 1 Ağustos
    2026; uzatmayla en geç **1 Kasım 2026**.


    **(d)** Yatırımcıları tazmin kararı verilenler hakkında Kurul, **bankalar hariç** olmak üzere, tazmin sürecinin kapanmasına
    ilişkin kararıyla birlikte tedrici tasfiye kararı da verebilir; işlemler **YTM** tarafından yürütülür (md. 86/1). Tedrici
    tasfiye kararı verilmesi hâlinde bu tasfiyenin kapatılması kararına kadar **iflas kararı verilemez** (md. 86/4).

    '
  puanlama:
  - olcut: (a) Üç ay ve 10 Haziran 2026
    puan: 4
  - olcut: '(b) A: 100.000 TL azami tutar ve hesaplar toplamı mantığı'
    puan: 4
  - olcut: '(b) B: fiyat hareketi zararının kapsam dışı olması'
    puan: 3
  - olcut: '(b) C: %5 ve üzeri ortak olduğu için tazmin edilmemesi'
    puan: 3
  - olcut: (c) Bir yıllık zamanaşımı (1 Nisan 2027)
    puan: 2
  - olcut: (c) Üç ay ödeme süresi ve üç ay uzatma (1 Kasım 2026)
    puan: 4
  - olcut: (d) Bankalar hariç, YTM tarafından yürütülme
    puan: 3
  - olcut: (d) İflas kararı verilememesi
    puan: 2
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 82/1
    alinti: (1) Kurul, yatırım kuruluşlarının sermaye piyasası faaliyetinden kaynaklanan nakit ödeme veya sermaye piyasası
      araçları teslim yükümlülüklerini yerine getiremediğinin veya kısa sürede yerine getiremeyeceğinin tespit edilmesi hâlinde
      yatırımcıları tazmin kararı alır. Bu karar, durumun tespitinden itibaren üç ay içinde alınır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/2
    alinti: Yatırımcıların yatırım danışmanlığı veya piyasadaki fiyat hareketlerinden kaynaklanan zararları tazmin kapsamında
      değildir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/4-a
    alinti: a) Yatırımcıları tazmin kararı verilen yatırım kuruluşlarının yönetim kurulu üyeleri, yöneticileri ve şahsen sorumlu
      ortakları, yüzde beş veya daha fazla paya sahip ortakları,
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/5
    alinti: (5) Hak sahibi her bir yatırımcıya ödenecek azami tazmin tutarı yüz bin Türk Lirasıdır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 84/5
    alinti: Bu sınır, hesap sayısı, türü ve para birimine bakılmaksızın, bir yatırımcının aynı kuruluştan olan taleplerinin
      tümünü kapsar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 85/1
    alinti: Tazmin talebinde bulunma hakkı, tazmin kararının ilanından itibaren bir yıl sonra zamanaşımına uğrar.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 85/2
    alinti: hak sahiplerini ve tazmin tutarlarını belirledikten sonra üç ay içinde ödemeleri gerçekleştirmekle yükümlüdür.
      Zorunlu hâllerde bu süre, Kurulun onayıyla en fazla üç ay daha uzatılabilir.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/1
    alinti: bankalar hariç olmak üzere, tazmin sürecinin kapanmasına ilişkin kararı ile birlikte tedricî tasfiye kararı da
      verebilir. Bu durumda tedricî tasfiye işlemleri YTM tarafından yürütülür.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 86/4
    alinti: Tedricî tasfiye kararı verilmesi hâlinde, bu tasfiyenin kapatılması kararına kadar iflas kararı verilemez.
