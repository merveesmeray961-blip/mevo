- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - takas kesinliği ve teminat
  - borsada işlemlerin durdurulması
  - merkezi kayıt kuruluşu
  zorluk: 3
  puan: 24
  sure_dk: 28
  soru: '**Arka Menkul Değerler A.Ş.**, merkezi takas kuruluşunun üyesidir ve borsada işlem yapmaktadır. Arka''nın faaliyetleri
    geçici olarak durdurulmuş, bir yargı merciinde de tasfiye işlemlerine başlanmıştır. Arka, takas kuruluşuna müşterilerinden
    birine ait kayıtlı payları teminat olarak göstermiştir; üçüncü bir kişi bu payların kendisine ait olduğunu ileri sürmektedir.
    Teminatı tesis eden Arka için ayrıca konkordato mühleti talebi gündeme gelmiştir. Aynı dönemde Borsa, **Orman Kâğıt A.Ş.**
    payının işlem görmesini kendi düzenlemelerindeki bir şart oluştuğu gerekçesiyle durdurmak istemekte; MKK ise kaydileştirilen
    payların merkezi saklamasını yürütmektedir.


    Aşağıdaki ifadeler öne sürülmüştür:


    **İfade 1:** "Arka''nın faaliyetlerinin durdurulması ve tasfiye işlemlerine başlanması hâlinde, takas talimatları ve ödeme
    işlemleri geri alınabilir ve iptal edilebilir."

    **İfade 2:** "Teminat konusu varlıklar üzerinde üçüncü kişinin istihkak iddiası merkezi takas kuruluşuna karşı ileri sürülebilir."

    **İfade 3:** "Teminatı tesis eden üyeye konkordato mühleti tanınması, merkezi takas kuruluşunun teminat üzerindeki hak
    ve yetkilerini kullanmasını engeller."

    **İfade 4:** "Borsa, kendi düzenlemelerinde öngörülen şartlar oluşursa payın işlem görmesini durdurabilir; durumu derhal
    Kurula bildirir ve kamuya açıklar."

    **İfade 5:** "Borsanın durdurma yetkisi bulunduğundan Kurulun payın borsada işlem görmesini durdurma yetkisi yoktur."

    **İfade 6:** "MKK, özel hukuk tüzel kişiliğini haiz anonim şirkettir."


    **İstenenler:**

    (a) İfade 1, 2 ve 3''ün doğru veya yanlış olduğunu gerekçesiyle belirtiniz. (12 puan)

    (b) İfade 4, 5 ve 6''nın doğru veya yanlış olduğunu gerekçesiyle belirtiniz. (12 puan)

    '
  cozum: '**(a)**

    | İfade | Değerlendirme | Gerekçe |

    |---|---|---|

    | 1 | Yanlış | Takas talimat ve işlemleri ile ödeme işlemleri, üyelerin faaliyetlerinin geçici/sürekli durdurulması ve
    tasfiye işlemlerine başlanması dahil **geri alınamaz ve iptal edilemez** (md. 79/1) |

    | 2 | Yanlış | Teminat konusu varlıklar üzerinde üçüncü kişilerin istihkak veya sınırlı ayni hak iddiaları merkezi takas
    kuruluşuna karşı **ileri sürülemez** (md. 79/2) |

    | 3 | Yanlış | Konkordato mühleti tanınması, iflas gibi hâller merkezi takas kuruluşunun teminatlar üzerindeki hak ve
    yetkilerini kullanmasını **hiçbir şekilde sınırlandıramaz** (md. 79/3) |


    **(b)**

    | İfade | Değerlendirme | Gerekçe |

    |---|---|---|

    | 4 | Doğru | Borsa, şartlar oluşursa işlem görmeyi durdurabilir veya kottan çıkarabilir; bu durum derhal Kurula bildirilir
    ve kamuya açıklanır (md. 69/1) |

    | 5 | Yanlış | Kurulun sermaye piyasası araçlarının borsada işlem görmesini durdurma ve kottan çıkarma yetkisi **saklıdır**
    (md. 69/2) |

    | 6 | Doğru | MKK, özel hukuk tüzel kişiliğini haiz anonim şirkettir (md. 81/1) |

    '
  puanlama:
  - olcut: '(a) İfade 1: takasın geri alınamazlığı'
    puan: 4
  - olcut: '(a) İfade 2: istihkak iddiasının ileri sürülememesi'
    puan: 4
  - olcut: '(a) İfade 3: konkordato mühletinin hak ve yetkileri engellememesi'
    puan: 4
  - olcut: '(b) İfade 4: doğru, bildirim ve açıklama'
    puan: 4
  - olcut: '(b) İfade 5: Kurul yetkisinin saklı olması'
    puan: 4
  - olcut: '(b) İfade 6: doğru, MKK''nın hukuki niteliği'
    puan: 4
  kaynaklar:
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/1
    alinti: (1) Sermaye piyasası araçlarının takas talimat ve işlemleri ile ödeme işlemleri, merkezî takas kuruluşlarının
      üyelerinin faaliyetlerinin geçici ya da sürekli olarak durdurulması, idari ve adli merciler nezdinde tasfiye işlemlerine
      başlanması durumu da dâhil olmak üzere, geri alınamaz ve iptal edilemez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/2
    alinti: Teminat konusu mal varlığı değerleri üzerinde üçüncü kişilerin istihkak ya da sınırlı ayni hak iddiaları merkezî
      takas kuruluşuna karşı ileri sürülemez.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 79/3
    alinti: Üye kuruluşa veya teminatı tesis eden kişiye konkordato mühleti tanınması, konkordatosunun tasdiki, iflastan sonra
      konkordato veya mal varlığının terki suretiyle konkordato süreci içine girmesi, uzlaşma yoluyla yeniden yapılandırılması,
      iflası, iflasının ertelenmesi veya 2004 sayılı Kanun çerçevesindeki diğer takip prosedürleri ya da bu Kanunun tedricî
      tasfiye ile ilgili hükümleri merkezî takas kuruluşunun söz konusu teminatlar üzerindeki hak ve yetkileri kullanmasını
      hiçbir şekilde sınırlandıramaz.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 69
    alinti: (1) Borsa veya piyasa işleticisi, kendi düzenlemelerinde öngörülen şartların oluşması hâlinde, ilgili sermaye
      piyasası aracının işlem görmesini durdurabileceği gibi kottan da çıkarabilir. Bu durum derhâl Kurula bildirilir ve kamuya
      açıklanır. (2) Kurulun, sermaye piyasası araçlarının borsada işlem görmesini durdurma ve borsa kotundan çıkarma yetkisi
      saklıdır.
  - mevzuat: 6362 sayılı Sermaye Piyasası Kanunu
    madde: md. 81/1
    alinti: özel hukuk tüzel kişiliğini haiz anonim şirkettir.
