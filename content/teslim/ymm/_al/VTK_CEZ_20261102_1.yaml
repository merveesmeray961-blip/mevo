  soru: '**Olay:** Gül Mobilya Ltd. Şti., 2024 hesap dönemi kurumlar vergisi beyannamesini süresinde vermiş ve ödemesini yapmıştır.
    Şirket yönetimi, 2024 yılında kanunen kabul edilmeyen giderlerin 300.000 TL''sini matrahtan yanlışlıkla indirdiğini fark
    etmiştir. Olaya ilişkin tarihler ve veriler aşağıdadır:


    | Tarih | Gelişme |

    |---|---|

    | 3/2/2026 | Şirket nezdinde yalnızca 2025 yılı KDV''ye ilişkin vergi incelemesine başlanmıştır. |

    | 9/3/2026 | Şirket, 2024 kurumlar vergisindeki eksik beyanı kendiliğinden dilekçe ile vergi dairesine bildirmiştir; bu
    dilekçe resmî kayıtlara geçirilmiştir. Konuyla ilgili daha önce herhangi bir ihbar yapılmamıştır. |

    | 20/3/2026 | Şirket düzeltme beyannamesini vermiştir. |

    | 23/3/2026 | Şirket eksik kalan vergiyi ve zammı ödemiştir. |


    Ek bilgiler:


    - Kurumlar vergisi oranı %25''tir; ilgili verginin ödeme vadesi 30/4/2025''tir.

    - Bu vakada 6183 sayılı Kanun''un 51 inci maddesine göre gecikme zammı oranı aylık %3,5 alınacaktır; zam basit faizle
    hesaplanacaktır.

    - Şirket adına kesinleşmiş başka bir vergi ziyaı cezası yoktur; fiil, VUK md. 359 kapsamında değildir.

    - Gecikme faizi ve diğer fer''i alacaklar dikkate alınmayacaktır.


    **İstenenler:**


    (a) Şirketin VUK md. 371''den yararlanıp yararlanamayacağını, şartları tek tek değerlendirerek gerekçesiyle belirtiniz.
    (6 puan)


    (b) Şirketin ödediği toplam tutarı (vergi farkı ve zam) ve kesilecek vergi ziyaı cezasını hesaplayınız. (6 puan)


    (c) Aynı olayda, 2024 yılı kurumlar vergisine ilişkin vergi incelemesine 2/3/2026''da başlanmış olsaydı (diğer tarihler
    aynı kalmak üzere) sonuç ne olurdu? İhbarnamelerin 15/6/2026''da tebliğ edildiğini ve şirketin VUK md. 376 hükmünden en
    uygun biçimde yararlandığını varsayarak şirketin ödeyeceği toplam tutarı bulunuz. (5 puan)


    (d) Asıl olayda şirket düzeltme beyannamesini ve ödemeyi 28/3/2026''da yapmış olsaydı VUK md. 371 yönünden sonuç ne olurdu?
    (5 puan)

    '
  cozum: '**(a) VUK md. 371 değerlendirmesi**


    Madde 371, beyana dayanan vergilerde vergi ziyaı cezasını gerektiren fiilleri kendiliğinden dilekçe ile haber veren mükellef
    için vergi ziyaı cezası kesilmemesini düzenler. Kurumlar vergisi beyana dayanan bir vergidir. Şartlar:


    | Şart | Değerlendirme | Sonuç |

    |---|---|---|

    | Daha önce muhbir tarafından ihbar yapılmamış olması (md. 371/1) | Konuyla ilgili ihbar yoktur. | Sağlandı |

    | Dilekçenin, haber verilen olayın ilgili olduğu **vergi türüne** ilişkin vergi incelemesi başlamadan önce verilmesi (md.
    371/2) | 3/2/2026''da başlayan inceleme yalnızca KDV''ye ilişkindir; haber verilen olay kurumlar vergisiyle ilgilidir.
    İnceleme, ilgili vergi türüne ilişkin olmadığından engel oluşturmaz. | Sağlandı |

    | Eksik beyanın haber verme tarihinden itibaren 15 gün içinde düzeltilmesi (md. 371/4) | Süre 9/3/2026''dan başlar ve
    24/3/2026''da dolar; düzeltme beyannamesi 20/3/2026''da verilmiştir. | Sağlandı |

    | Ödeme süresi geçmiş verginin, gecikme zammıyla birlikte 15 gün içinde ödenmesi (md. 371/5) | Ödeme 23/3/2026''da yapılmıştır.
    | Sağlandı |


    Tüm şartlar sağlandığından şirket md. 371''den yararlanır.


    **(b) Ödenecek tutar ve ceza**


    - Kurumlar vergisi farkı = 300.000 x %25 = **75.000 TL**

    - Gecikme zammı süresi: vade 30/4/2025 (ödemenin geciktiği dönem 1/5/2025''ten başlar); ödeme 23/3/2026. 1/5/2025 – 28/2/2026
    arası 10 tam ay, 1–23 Mart 2026 ise ay kesridir. Kesir tam ay sayılır: **11 ay**.

    - Zam = 75.000 x %3,5 x 11 = **28.875 TL**

    - Toplam ödeme = 75.000 + 28.875 = **103.875 TL**

    - Md. 371 şartları sağlandığından **vergi ziyaı cezası kesilmez** (kesilecek ceza 0 TL).


    **(c) İncelemenin 2/3/2026''da başlaması hâli**


    Dilekçe 9/3/2026''da, yani ilgili vergi türüne (kurumlar vergisi) ilişkin inceleme başladıktan sonra verildiğinden md.
    371/2''deki şart sağlanmaz; md. 371''den yararlanılamaz. Bu durumda md. 344/1 uyarınca ziyaa uğratılan verginin bir katı
    tutarında vergi ziyaı cezası kesilir: 75.000 TL.


    Şirket ihbarnamelerin tebliğinden (15/6/2026) itibaren otuz gün içinde başvurup vergi ile cezayı vadesinde öderse cezanın
    yarısı indirilir (md. 376):


    | Kalem | Tutar | Ödenecek |

    |---|---|---|

    | Vergi aslı (indirim yok) | 75.000 | 75.000 |

    | Vergi ziyaı cezası (%50 indirim) | 75.000 | 37.500 |

    | **Toplam** | | **112.500** |


    Gecikme faizi dikkate alınmadığından ödenecek toplam **112.500 TL**''dir.


    **(d) 28/3/2026''da düzeltme ve ödeme**


    Haber verme tarihi 9/3/2026 olduğundan 15 günlük süre 24/3/2026''da sona erer. Düzeltme ve ödeme 28/3/2026''da yapıldığında
    md. 371/4 ve 371/5''teki süre şartları sağlanmamış olur; bu nedenle md. 371''den yararlanılamaz ve vergi ziyaı cezası
    kesilir (75.000 TL). Bu cezaya ilişkin olarak md. 376 koşulları sağlanırsa cezanın yarısı indirilir.


    Püf noktaları: (1) "İnceleme başladı" denince hemen pişmanlık hakkı gitti sanmayın; inceleme **aynı vergi türüne** ilişkin
    olmalıdır. (2) 15 günlük süre hem düzeltme hem ödeme için geçerlidir; ikisi de süre içinde tamamlanmalıdır. (3) Gecikme
    zammında ay kesri tam ay sayılır.

    '
