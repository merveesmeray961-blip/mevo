    alinti: ihbarnamelerin tebliğ tarihinden itibaren otuz gün içinde ilgili vergi dairesine başvurarak vadesinde veya 6183
      sayılı Kanunda belirtilen türden teminat göstererek vadenin bitmesinden itibaren üç ay içinde ödeyeceğini bildirirse
      kesilen cezanın yarısı,
  dogrulama:
    python: 'kv = 300000 * 0.25

      ay = 11

      zam = kv * 0.035 * ay

      b_toplam = kv + zam

      vzc_c = kv

      c_toplam = kv + vzc_c / 2

      sonuc = {''a'': kv, ''b_zam'': zam, ''b_toplam'': b_toplam, ''c_vzc'': vzc_c, ''c_toplam'': c_toplam}

      '
