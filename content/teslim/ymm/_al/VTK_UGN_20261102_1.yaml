    (b) 90 günlük süre mücbir sebep olarak kabul edilirse 2021 yılına ait tarh zamanaşımının son gününü bulunuz. (7 puan)


    (c) 2 numaralı olayda mücbir sebebin kural olarak hangi tarihte sona ermiş sayılacağını ve Bakanlığın bu süreyi en çok
    hangi tarihe kadar uzatabileceğini belirtiniz. (10 puan)

    '
  cozum: '**(a)** Md. 13: vergi ödevlerinden herhangi birinin yerine getirilmesine engel olacak derecede ağır kaza, ağır hastalık
    ve tutukluluk mücbir sebeptir. Md. 15/2: mücbir sebebin hükümlerinin uygulanması için mücbir sebebin malum olması veya
    ilgililer tarafından ispat veya tevsik edilmesi gerekir. Kayıtlarla belgelenen ağır hastalık mücbir sebeptir.


    **(b)** Md. 15/1: mücbir sebebin bulunduğu sürede süreler işlemez; tarh zamanaşımı da işlemeyen süreler kadar uzar. Normal
    bitiş 31/12/2026 + 90 gün = **31/3/2027** (Ocak 31 + Şubat 28 + Mart 31 = 90 gün).


    **(c)** Md. 15/3: mücbir sebep hali ilan edilen yerlerde mücbir sebep, olayın vukua geldiği tarihin rastladığı ayı izleyen
    üçüncü ayın son günü itibarıyla bitmiş sayılır. Olay Şubat 2026''da olduğundan izleyen üçüncü ay Mayıs 2026''dır; mücbir
    sebep **31/5/2026**''da bitmiş sayılır. Bakanlık bu süreyi, olayın vukua geldiği tarihin rastladığı ayı izleyen on sekizinci
    ayın sonunu geçmemek kaydıyla uzatabilir: Şubat 2026''dan sonraki 18. ay Ağustos 2027''dir; en çok **31/8/2027**.


    Püf noktaları: (1) Mücbir sebebin malum olması veya ispatı şarttır. (2) Zamanaşımı işlemeyen süre kadar uzar. (3) Üçüncü
    ay ve on sekizinci ay olayın ayından sonra sayılır.

