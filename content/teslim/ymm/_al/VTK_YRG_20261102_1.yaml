    indirim sonrası toplam ödemeyi hesaplayınız. (6 puan)


    (d) Şirketin yalnızca usulsüzlük cezası için vazgeçme dilekçesi vermesi, vergi ziyaı cezası için vazgeçmemesi hâlinde
