  - olcut: (a) hedef maliyet ve açık
    puan: 6
  - olcut: (b) iyileştirme sonrası maliyet ve hedefe ulaşma
    puan: 7
  - olcut: (c) kâra etki ve geri dönüş süresi
    puan: 7
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 16
    alinti: (a) Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri, (b) Üretim
      sürecinde bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut
      konumuna ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  - mevzuat: TMS 2 Stoklar
    madde: par. 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
  dogrulama:
    python: 'fiyat = 800

      hedef = fiyat * (1 - 0.25)

      mevcut = 300 + 120 + 160 + 100

      acik = mevcut - hedef

      acik_oran = acik / mevcut * 100

      mal_yeni = 300 - 35

      guc_yeni = 160 - 25

      dag_yeni = 100 - 20

      yeni = mal_yeni + 120 + guc_yeni + dag_yeni

      kar_once = (fiyat - mevcut) * 10000

      kar_sonra = (fiyat - yeni) * 10000

      kalip_tasarruf = 35 * 10000

      sonuc = {''a'': hedef, ''b'': acik, ''c'': kar_sonra, ''d'': kalip_tasarruf}

      '
