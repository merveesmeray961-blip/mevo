  soru: 'Orbit Yazılım Destek Ltd. Şti. iki müşteri segmentine abonelik temelli destek hizmeti vermektedir: Kurumsal (K) ve
    Bireysel (B). Dolaylı giderler ve faaliyet sürücüleri:


    | Faaliyet | Gider (TL) | Sürücü | K | B |

    |---|---|---|---|---|

    | Sözleşme yönetimi | 300.000 | Sözleşme sayısı | 50 | 250 |

    | Teknik destek | 840.000 | Destek saati | 1.200 | 1.800 |

    | Faturalama | 180.000 | Fatura sayısı | 1.200 | 6.000 |


    Segment gelirleri ve doğrudan giderler (TL): K için gelir 700.000, doğrudan gider 150.000; B için gelir 1.000.000, doğrudan
    gider 240.000.


    **İstenenler:**

    (a) Her faaliyet için sürücü oranını bulunuz. (5 puan)

    (b) Her segmente yüklenecek dolaylı gideri ve segment kârını hesaplayınız. (8 puan)

    (c) B segmentinin başabaşa gelmesi için gelirinin yüzde kaç artırılması gerektiğini bulunuz (diğer koşullar sabit). (8
    puan)

    '
  cozum: '**(a)** Sözleşme: 300.000 / 300 = **1.000 TL/sözleşme**; destek: 840.000 / 3.000 = **280 TL/saat**; faturalama:
    180.000 / 7.200 = **25 TL/fatura**.


    **(b)** K: 50 × 1.000 + 1.200 × 280 + 1.200 × 25 = **416.000 TL**; B: 250 × 1.000 + 1.800 × 280 + 6.000 × 25 = **904.000
    TL**.


    | TL | K | B |

    |---|---|---|

    | Gelir | 700.000 | 1.000.000 |

    | Doğrudan gider | -150.000 | -240.000 |

    | Dolaylı gider (ABC) | -416.000 | -904.000 |

    | **Segment kârı** | **134.000** | **-144.000** |


    **(c)** B''nin başabaş geliri = 240.000 + 904.000 = 1.144.000 TL; mevcut gelir 1.000.000 TL olduğundan gerekli artış =
    **%14,40**.

    '
