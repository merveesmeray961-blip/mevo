    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  dogrulama:
    python: 'r_parti = 400000 / (10 + 30 + 60)

      r_saat = 500000 / (2000 + 1000 + 2000)

      p1 = (10 * r_parti + 2000 * r_saat) / 20000

      p2 = (30 * r_parti + 1000 * r_saat) / 5000

      p3 = (60 * r_parti + 2000 * r_saat) / 4000

      r_dis = 900000 / 5000

      g1 = 2000 * r_dis / 20000

      g2 = 1000 * r_dis / 5000

      g3 = 2000 * r_dis / 4000

      k1 = 60 - 40 - p1

      k2 = 120 - 70 - p2

      k3 = 200 - 90 - p3

      kg1 = 60 - 40 - g1

      kg2 = 120 - 70 - g2

      kg3 = 200 - 90 - g3

      sonuc = {''a'': p3, ''b'': g3, ''c'': k3, ''d'': kg3}

      '
