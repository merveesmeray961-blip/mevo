  soru: 'Selçuk Bisiklet A.Ş. şehir bisikleti için pazar fiyatını 625 TL ve hedef kâr marjını satış fiyatının %20''si olarak
    belirlemiştir. Mevcut tasarımın tahmini birim maliyeti ile mühendislik ekibinin ürün işlevlerine verdiği önem payları:


    | Bileşen | Mevcut maliyet (TL) | İşlev önem payı |

    |---|---|---|

    | Çerçeve ve motor grubu | 250 | %40 |

