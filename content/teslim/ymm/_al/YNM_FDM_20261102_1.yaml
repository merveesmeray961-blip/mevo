  soru: 'Vera Kapı A.Ş. iki ürün üretmektedir: seri üretilen Standart (S) kapı ve müşterisine özel tasarlanan Özel (Ö) kapı.
    Yıllık genel üretim giderleri ve maliyet sürücüleri:


    | Faaliyet havuzu | Gider (TL) | Maliyet sürücüsü | S | Ö |

    |---|---|---|---|---|

    | Makine ayarı | 240.000 | Ayar sayısı | 40 | 120 |

    | Kalite kontrol | 180.000 | Muayene saati | 300 | 600 |

    | Malzeme taşıma | 120.000 | Taşıma sayısı | 200 | 400 |

    | Makine kullanımı | 600.000 | Makine saati | 6.000 | 4.000 |


    Diğer bilgiler:


    | | S | Ö |

    |---|---|---|

    | Yıllık üretim ve satış (adet) | 8.000 | 2.000 |

    | Birim satış fiyatı (TL) | 520 | 1.150 |

    | Birim direkt maliyet (ilk madde + işçilik, TL) | 400 | 900 |

    | Direkt işçilik saati (toplam) | 18.000 | 12.000 |


    **İstenenler:**

    (a) Her faaliyet havuzu için maliyet sürücüsü oranını hesaplayınız. (5 puan)

    (b) Faaliyete dayalı maliyetleme ile her ürüne yüklenecek genel üretim giderini ve birim genel üretim giderini bulunuz.
    (6 puan)

    (c) Genel üretim giderlerinin tamamının direkt işçilik saatine göre dağıtılması hâlinde birim genel üretim giderlerini
    hesaplayınız. (4 puan)

    (d) Her iki yönteme göre ürünlerin birim kârını bulunuz ve sonuçları yorumlayınız. (5 puan)

    '
  cozum: '**(a)** Ayar: 240.000 / 160 = **1.500 TL/ayar**; kalite kontrol: 180.000 / 900 = **200 TL/saat**; taşıma: 120.000
    / 600 = **200 TL/taşıma**; makine: 600.000 / 10.000 = **60 TL/saat**.


    **(b)** S: 40 × 1.500 + 300 × 200 + 200 × 200 + 6.000 × 60 = 520.000 TL → birim **65 TL**. Ö: 120 × 1.500 + 600 × 200
    + 400 × 200 + 4.000 × 60 = 620.000 TL → birim **310 TL**.


    **(c)** Genel oran = 1.140.000 / 30.000 = 38 TL/işçilik saati. S: 18.000 × 38 / 8.000 = **85,50 TL**; Ö: 12.000 × 38 /
    2.000 = **228 TL**.


    **(d)**


    | | S | Ö |

    |---|---|---|

    | Birim kâr — faaliyete dayalı | 55 | -60 |

    | Birim kâr — işçilik saati esaslı | 34,50 | 22 |


    Geleneksel yöntem, ayar, kontrol ve taşıma faaliyetlerini çok kullanan Özel kapıyı düşük maliyetli, Standart kapıyı ise
    yüksek maliyetli gösterir (çapraz sübvansiyon). Faaliyete dayalı maliyetleme Özel kapının zararlı olduğunu ortaya koyar;
    fiyat veya ürün karması gözden geçirilmelidir.

    '
  puanlama:
  - olcut: (a) sürücü oranları
    puan: 5
  - olcut: (b) ABC ile yükleme ve birim GÜG
    puan: 6
  - olcut: (c) geleneksel dağıtım
    puan: 4
  - olcut: (d) birim kâr karşılaştırması ve yorum
    puan: 5
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Her bir ürünün dönüştürme maliyetlerinin ayrı olarak belirlenemediği durumlarda, bu maliyetler ürünler arasında
      mantıklı ve tutarlı bir biçimde dağıtılır. Maliyetlerin dağıtımı örneğin; her bir ürünün ayrı olarak belirlenebilir
      hale geldiği üretim aşamasındaki veya üretimin tamamlandığı andaki nispi satış değerine göre yapılabilir.
  dogrulama:
    python: 'r_ayar = 240000 / (40 + 120)

      r_kal = 180000 / (300 + 600)

      r_tas = 120000 / (200 + 400)

      r_mak = 600000 / (6000 + 4000)

      S_abc = 40 * r_ayar + 300 * r_kal + 200 * r_tas + 6000 * r_mak

      O_abc = 120 * r_ayar + 600 * r_kal + 400 * r_tas + 4000 * r_mak

      S_br = S_abc / 8000

      O_br = O_abc / 2000

      r_dis = 1140000 / 30000

      S_g = 18000 * r_dis / 8000

      O_g = 12000 * r_dis / 2000

      S_kar_abc = 520 - 400 - S_br

      O_kar_abc = 1150 - 900 - O_br

      S_kar_g = 520 - 400 - S_g

      O_kar_g = 1150 - 900 - O_g

      sonuc = {''a'': r_ayar, ''b'': O_br, ''c'': O_kar_abc, ''d'': O_kar_g}

      '
