    hesaplayınız. (8 puan)

    '
  cozum: 'Model 1 birim katkı = 200 − 120 − 16 = **64 TL**; Model 2 birim katkı = **80 TL**.


    **(a)** Model 1: 2.000.000 / 64 = **31.250 adet**; Model 2: 2.600.000 / 80 = **32.500 adet**.


    **(b)** 64 x − 2.000.000 = 80 x − 2.600.000 → x = 600.000 / 80 − 64 = **37.500 adet**.


    **(c)** 45.000 adette: Model 1 kârı = 880.000 TL; Model 2 kârı = 1.000.000 TL. **Model 2** 1.000.000 − 880.000 = 120.000
    TL daha kârlıdır (satış kayıtsızlık noktasının üzerindedir). 1.200.000 TL hedef kâr için Model 1''de 50.000 adet, Model
    2''de 47.500 adet gerekir.

    '
