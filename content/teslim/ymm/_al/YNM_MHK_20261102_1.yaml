    toplam giderler: 20.000 adet satışta 1.300.000 TL; 30.000 adet satışta 1.600.000 TL. Birim satış fiyatı 70 TL''dir. Gelecek
    dönem için satış tahmini 25.000 adettir.


    **İstenenler:**

    (a) En yüksek-en düşük yöntemiyle birim değişken gideri ve sabit gideri bulunuz. (7 puan)

    (b) Başabaş noktasını bulunuz ve 400.000 TL faaliyet kârı için gereken satış miktarını hesaplayınız. (6 puan)

    (c) Tahmini 25.000 adet için güvenlik marjı oranını hesaplayınız. (7 puan)

    '
  cozum: '**(a)** Birim değişken gider = (1.600.000 − 1.300.000) / (30.000 − 20.000) = **30 TL**; sabit gider = 1.300.000
    − 30 × 20.000 = **700.000 TL**.


    **(b)** Birim katkı = 70 − 30 = 40 TL; başabaş = 700.000 / 40 = **17.500 adet**. 400.000 TL kâr için (700.000 + 400.000)
    / 40 = **27.500 adet**.


    **(c)** Güvenlik marjı = (25.000 − 17.500) / 25.000 = **%30**.

    '
