  dogrulama:
    python: 'bep_m = 1000000 / (100 - 60)

      bep_o = 1400000 / (100 - 50)

      x = (1400000 - 1000000) / (50 - 40)

      k1_m = 40 * 50000 - 1000000

      k1_o = 50 * 50000 - 1400000

      k2_m = 40 * 32000 - 1000000

      k2_o = 50 * 32000 - 1400000

      sonuc = {''a'': bep_o, ''b'': x, ''c'': k1_o - k1_m, ''d'': k2_o - k2_m}

      '
