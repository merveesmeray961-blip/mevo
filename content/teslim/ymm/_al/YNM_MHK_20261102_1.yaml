  soru: 'Nehir Hırdavat A.Ş.''nin gelecek yıl bütçelenen sonuçları: satışlar 2.000.000 TL, değişken giderler 1.200.000 TL,
    sabit giderler 400.000 TL.


    **İstenenler:**

    (a) Katkı payı oranını ve faaliyet kaldıracı derecesini hesaplayınız. (5 puan)

    (b) Satışlar %15 artarsa faaliyet kârı ne kadar olur? (5 puan)

    (c) Satışlar %20 azalırsa faaliyet kârı ne kadar olur? Sonucu doğrudan gelir tablosuyla doğrulayınız. (5 puan)

    (d) Başabaş satışını ve güvenlik marjı oranını bulunuz; güvenlik marjı ile kaldıraç derecesi arasındaki ilişkiyi belirtiniz.
    (5 puan)

    '
  cozum: '**(a)** Katkı payı = 2.000.000 − 1.200.000 = 800.000 TL (oran %40); faaliyet kârı = 800.000 − 400.000 = 400.000
    TL. Faaliyet kaldıracı derecesi = 800.000 / 400.000 = **2**.


    **(b)** Kâr artışı = %15 × 2 = %30; yeni kâr = 400.000 × 1,30 = **520.000 TL**. (Doğrulama: satış 2.300.000 → katkı 920.000
    − 400.000 = 520.000 TL.)


    **(c)** Kâr değişimi = −%20 × 2 = −%40; yeni kâr = **240.000 TL**. (Satış 1.600.000 → katkı 640.000 − 400.000 = 240.000
    TL.)


    **(d)** Başabaş satışı = 400.000 / 0,40 = **1.000.000 TL**; güvenlik marjı = (2.000.000 − 1.000.000) / 2.000.000 = **%50**.
    Kaldıraç derecesi güvenlik marjı oranının tersidir (1 / 0,50 = 2).

    '
