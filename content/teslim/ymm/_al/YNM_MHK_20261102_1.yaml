      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  dogrulama:
    python: 'satis = 2000000

      dgs = 1200000

      kat = satis - dgs

      sabit = 400000

      kar = kat - sabit

      dol = kat / kar

      kar_up = kar * (1 + dol * 0.15)

      kar_dn = kar * (1 - dol * 0.2)

      bep_tl = sabit / (kat / satis)

      gm = (satis - bep_tl) / satis * 100

      sonuc = {''a'': dol, ''b'': kar_up, ''c'': kar_dn, ''d'': gm}

      '
