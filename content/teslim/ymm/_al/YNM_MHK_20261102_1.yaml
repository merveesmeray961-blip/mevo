  - olcut: (c) vergi öncesi kâr ve gerekli adet
    puan: 9
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Değişken genel üretim giderleri, endirekt (dolaylı) malzeme ve endirekt (dolaylı) işçilik gibi, üretim miktarı
      ile birlikte doğru orantılı olarak değişen dolaylı üretim maliyetleridir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 12
    alinti: Sabit genel üretim giderleri; amortisman, fabrika binası ve teçhizatının bakım onarım giderleri ile üretim sürecinde
      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  dogrulama:
    python: 'fiyat = 250

      vc = 90 + 40 + 12 + 8

      katki = fiyat - vc

      sabit = 1200000

      bep = sabit / katki

      bep_tl = bep * fiyat

      satis = 15000

      gm_adet = satis - bep

      gm_tl = gm_adet * fiyat

      gm_oran = gm_adet / satis * 100

      once = 450000 / (1 - 0.25)

      adet = (sabit + once) / katki

      sonuc = {''a'': bep, ''b'': gm_oran, ''c'': adet}

      '
