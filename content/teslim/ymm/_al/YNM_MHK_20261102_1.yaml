  soru: 'Kaya Seramik A.Ş. fayans üretmektedir. Birim satış fiyatı 250 TL''dir. Birim değişken maliyetler: direkt ilk madde
    90 TL, direkt işçilik 40 TL, değişken genel üretim gideri 12 TL, satış komisyonu 8 TL. Yıllık sabit giderler 1.200.000
    TL''dir (700.000 TL üretim, 500.000 TL satış ve yönetim). Gelecek yıl için satış tahmini 15.000 adettir. Kurumlar vergisi
    oranı %25''tir.


    **İstenenler:**

    (a) Başabaş noktasını adet ve TL olarak bulunuz. (6 puan)

    (b) Güvenlik marjını adet, TL ve oran olarak hesaplayınız. (6 puan)

    (c) Vergi sonrası 450.000 TL net kâr elde etmek için satılması gereken adedi bulunuz. (9 puan)

    '
  cozum: 'Birim değişken maliyet = 90 + 40 + 12 + 8 = 150 TL; birim katkı payı = 250 − 150 = **100 TL**.


    **(a)** Başabaş (adet) = 1.200.000 / 100 = **12.000 adet**; TL olarak = 12.000 × 250 = **3.000.000 TL**.


    **(b)** Güvenlik marjı = 15.000 − 12.000 = **3.000 adet** = 750.000 TL; oran = 3.000 / 15.000 = **%20**.


    **(c)** Vergi öncesi kâr = 450.000 / (1 − 0,25) = 600.000 TL. Gerekli adet = (1.200.000 + 600.000) / 100 = **18.000 adet**.

    '
