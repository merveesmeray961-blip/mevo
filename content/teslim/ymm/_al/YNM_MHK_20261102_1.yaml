      yer alan kullanım hakkı varlıkları gibi, üretim miktarından bağımsız olarak nispeten sabit kalan dolaylı üretim maliyetleri
      ile fabrikanın yönetim ve idaresi ile ilgili maliyetlerdir.
  dogrulama:
    python: 'paket = (5000 * 30 + 3000 * 50 + 2000 * 80) / 10000

      sabit = 368000

      bep = sabit / paket

      bx = bep * 0.5

      by = bep * 0.3

      bz = bep * 0.2

      sat_b = 5000 * 80 + 3000 * 120 + 2000 * 200

      kat_b = 10000 * paket

      bep_tl = sabit * sat_b / kat_b

      gm = (10000 - bep) / 10000 * 100

      paket2 = 0.2 * 30 + 0.2 * 50 + 0.6 * 80

      bep2 = sabit / paket2

      sonuc = {''a'': bep, ''b'': bep_tl, ''c'': bep2}

      '
