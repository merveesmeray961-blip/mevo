  soru: 'Tuna Makine A.Ş. özel siparişlerle çalışmakta ve sipariş maliyet sistemi uygulamaktadır. Genel üretim giderleri,
    direkt işçilik saatine göre önceden belirlenmiş oranla yüklenmektedir: yıllık bütçelenen genel üretim gideri 720.000 TL,
    bütçelenen direkt işçilik saati 18.000''dir. Direkt işçilik saat ücreti 30 TL''dir.


    Dönem sonunda sipariş kartlarındaki bilgiler:


    | Sipariş | Direkt ilk madde (TL) | Direkt işçilik saati | Durum |

    |---|---|---|---|

    | A-101 | 160.000 | 2.000 | Tamamlandı ve müşteriye teslim edildi |

    | B-102 | 90.000 | 1.200 | Üretimi sürüyor |

    | C-103 | 70.000 | 800 | Tamamlandı, henüz teslim edilmedi |


    Dönem içinde gerçekleşen genel üretim gideri 168.000 TL''dir.


    **İstenenler:**

    (a) Genel üretim gideri yükleme oranını ve her siparişin maliyetini hesaplayınız. (8 puan)

    (b) Dönem sonunda yarı mamul (151), mamul (152) ve satılan mamul maliyeti (620) hesaplarının fark düzeltmesinden önceki
    bakiyelerini belirleyerek genel üretim giderlerinin eksik veya fazla yüklenme tutarını bulunuz. (6 puan)

    (c) Eksik/fazla yüklenmiş tutarı, yüklenen genel üretim gideri oranında siparişlere dağıtarak düzeltilmiş 151, 152 ve
    620 bakiyelerini bulunuz. (6 puan)

    '
  cozum: '**(a)** Yükleme oranı = 720.000 / 18.000 = **40 TL/saat**.


    | Sipariş | İlk madde | İşçilik | GÜG | Toplam (TL) |

    |---|---|---|---|---|

    | A-101 | 160.000 | 60.000 | 80.000 | **300.000** |

    | B-102 | 90.000 | 36.000 | 48.000 | **174.000** |

    | C-103 | 70.000 | 24.000 | 32.000 | **126.000** |


    **(b)** A-101 teslim edildiğinden 620''ye (300.000 TL), B-102 devam ettiğinden 151''e (174.000 TL), C-103 satışa hazır
    olduğundan 152''ye (126.000 TL) aktarılır. Yüklenen GÜG = 4.000 × 40 = 160.000 TL; fiilî 168.000 TL olduğundan **8.000
    TL eksik yükleme** vardır.


    **(c)** Dağıtım yüklenen GÜG oranında yapılır: A-101 %50 (4.000 TL), B-102 %30 (2.400 TL), C-103 %20 (1.600 TL).


    | Hesap | Düzeltmeden önce | Düzeltme | Düzeltilmiş bakiye (TL) |

    |---|---|---|---|

    | 620 Satılan Mamuller Maliyeti | 300.000 | 4.000 | **304.000** |

    | 151 Yarı Mamuller-Üretim | 174.000 | 2.400 | **176.400** |

    | 152 Mamuller | 126.000 | 1.600 | **127.600** |

    '
  puanlama:
  - olcut: (a) yükleme oranı ve sipariş maliyetleri
