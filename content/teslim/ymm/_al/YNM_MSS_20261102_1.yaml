      belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi : Maliyet dönemi sonunda direkt
      ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır. Üretimi tamamlananların
      maliyet tutarı bu hesabın alacağı karşılığında ilgili stok hesaplarına aktarılır.'
  - mevzuat: MSUGT 1 sıra no.lu Tebliğ eki Tekdüzen Hesap Planı
    madde: 152 Mamuller
    alinti: 'Üretim çalışmaları sonunda elde edilen ve satışa hazır hale gelmiş bulunan mamullerin izlendiği hesaptır. İşleyişi
      : Bu hesap, üretimi tamamlanan mamullerin ambarlara alınmasıyla borçlandırılır. Satılması veya herhangi bir nedenle
      ambardan çekilmesi ile alacaklandırılır.'
  - mevzuat: MSUGT 1 sıra no.lu Tebliğ eki Tekdüzen Hesap Planı
    madde: 620 Satılan Mamuller Maliyeti
    alinti: Satılan mamullerin maliyet tutarı 152 nolu hesaba (Mamuller Hs.) alacak, bu hesaba ise borç kaydedilir.
  dogrulama:
    python: 'oran = 720000 / 18000

      mA = 160000 + 2000 * 30 + 2000 * oran

      mB = 90000 + 1200 * 30 + 1200 * oran

      mC = 70000 + 800 * 30 + 800 * oran

      yuk = 4000 * oran

      fiili = 168000

      eksik = fiili - yuk

      payA = eksik * (2000 * oran) / yuk

      payB = eksik * (1200 * oran) / yuk

      payC = eksik * (800 * oran) / yuk

      c620 = mA + payA

      c151 = mB + payB

      c152 = mC + payC

      sonuc = {''a'': mA + mB + mC, ''b'': eksik, ''c'': c620, ''c151'': c151, ''c152'': c152}

      '
