- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: BDS
  kazanimlar:
  - BDS 530 denetim örneklemesi ve yanlışlıkların öngörülmesi
  - BDS 450 düzeltilmemiş yanlışlıkların değerlendirilmesi
  - BDS 320 önemliliğin yeniden değerlendirilmesi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Bağımsız denetçi Kerem Aydın, Aksu Gıda Pazarlama A.Ş.''nin 31.12.2025 tarihli finansal tablolarının denetimini
    yürütmektedir. Denetçi, hasılatın gerçekleşmesi (varlığı) yönetim beyanına ilişkin detay testinde, 2025 yılında düzenlenen
    satış faturalarını şu şekilde gruplandırmıştır:


    | Grup | Fatura adedi | Defter değeri (TL) | Denetçinin yaklaşımı |

    |---|---|---|---|

    | 1 (her biri 500.000 TL ve üzeri) | 20 | 12.000.000 | Tamamı incelenmiştir |

    | 2 (diğer faturalar) | 1.200 | 24.000.000 | 100 faturalık örneklem seçilmiştir (örneklemin defter değeri 2.000.000 TL)
    |


    Denetçi, bu detay testi için kabul edilebilir yanlışlığı 1.000.000 TL olarak belirlemiştir. Tüm yanlışlıklar vergi öncesi
    kârı fazla gösterecek yöndedir. Testin sonuçları şöyledir:


    - Grup 1''de tamamı incelenen faturalarda toplam 250.000 TL yanlışlık bulunmuştur.

    - Grup 2 örnekleminde seçilen bir faturanın iptal edilmiş ve iptalin usulüne uygun yapılmış olduğu görülmüş, bu faturanın
    yerine örneklemde yer almayan başka bir fatura seçilmiş ve incelenmiştir (örneklem 100 faturada tamamlanmıştır).

    - Örneklemdeki iki faturaya (defter değerleri 10.000 TL ve 12.000 TL) ilişkin sevk belgeleri bulunamamış; denetçinin planladığı
    alternatif prosedür olan sonraki tahsilatların incelenmesi de bu iki fatura için uygulanamamıştır. Vakada bu iki kalem
    için yanlışlık tutarı, kalemlerin defter değerinin tamamı olarak alınacaktır.

    - Örneklemdeki üç faturada sırasıyla 25.000 TL, 20.000 TL ve 13.000 TL tutarında fiili yanlışlık bulunmuştur. Yönetim
    25.000 TL''lik yanlışlığın sistemdeki "tek seferlik" bir iade kaydı hatasından kaynaklandığını ileri sürmüş, denetçi bu
    konuda ilave bir prosedür uygulamamıştır. Diğer iki yanlışlık, 29 ve 30 Aralık 2025 tarihli faturalarda ortaya çıkmıştır.


    Denetçi, test sonucunda tespit ettiği yanlışlıkları yönetime bildirmiş; yönetim Grup 1''deki 250.000 TL ile örneklemde
    bulunan fiili yanlışlıkların tamamını düzeltmiştir. Yönetim, Grup 2 için öngörülen yanlışlığın kalan kısmını, "bunun gerçek
    bir yanlışlık değil, istatistiki bir tahmin olduğu" gerekçesiyle düzeltmeyi reddetmiştir. Yönetim ayrıca denetçinin bildirdiği
    stok değerleme farkı (350.000 TL) ile eksik ayrılan karşılık (250.000 TL) yanlışlıklarını da düzeltmemiştir. Denetçi önemliliği
    başlangıçta tahmini vergi öncesi kârın (32.000.000 TL) %5''i olarak belirlemiştir; gerçekleşen vergi öncesi kâr 28.000.000
    TL''dir.


    **İstenenler:**


    (a) Örneklemde karşılaşılan üç durumun (iptal edilmiş fatura, belgesi bulunamayan iki fatura, 25.000 TL''lik "tek seferlik"
    yanlışlık) BDS 530''a göre nasıl ele alınması gerektiğini; 20.000 TL ve 13.000 TL''lik yanlışlıklara ilişkin olarak denetçinin
    yapması gerekenleri açıklayınız. (7 puan)


    (b) Grup 2 için öngörülen yanlışlığı ve bu testten çıkan toplam en iyi yanlışlık tahminini hesaplayınız; sonucu kabul
    edilebilir yanlışlıkla karşılaştırarak örneklemin makul bir dayanak sağlayıp sağlamadığını belirtiniz; Grup 1''in sonuçlarının
    neden Grup 2''ye yansıtılmadığını açıklayınız ve denetçinin bu sonuç karşısında başvurabileceği seçenekleri yazınız. (7
    puan)


    (c) BDS 450 uyarınca denetçinin yönetimin düzeltmeyi reddetmesi karşısındaki yükümlülüklerini sıralayınız; önemliliği
    yeniden belirleyiniz; düzeltilmemiş yanlışlıkların toplamını hesaplayarak hem başlangıçtaki hem de yeniden belirlenen
    önemlilikle karşılaştırınız ve düzeltilmemiş yanlışlıkların önemli olup olmadığına karar verirken dikkate alınacak hususları,
    üst yönetimden sorumlu olanlara bildirimi ve yazılı beyanı açıklayınız. (8 puan)

    '
  cozum: '**(a) Örneklemde karşılaşılan durumlar (7 puan)**


    - **İptal edilmiş fatura:** Denetim prosedürü seçilen kaleme uygulanamıyorsa denetçi prosedürü, bu kalemin yerini alan
    başka bir kalem üzerinde uygular (BDS 530 par. 10). Fatura usulüne uygun iptal edildiğinden sapma/yanlışlık oluşmaz; yerine
    başka fatura seçilmesi doğrudur.

    - **Belgesi bulunamayan iki fatura:** Denetçi tasarlanmış prosedürü veya uygun alternatif prosedürleri seçilen kalem üzerinde
    uygulayamıyorsa, söz konusu kalem detay testleri açısından bir **yanlışlık** olarak kabul edilir (par. 11). Bu iki kalem
    için yanlışlık = 10.000 + 12.000 = 22.000 TL.

    - **25.000 TL''lik "tek seferlik" yanlışlık:** Bir yanlışlığın anomali (aykırılık) sayılabilmesi için denetçinin, yanlışlığın
    anakitleyi temsil etmediğine dair kesinlik derecesi yüksek bir kanaate sahip olması gerekir; bu kanaat, anakitlenin geri
    kalanını etkilemediği konusunda ilave denetim prosedürleri uygulanarak oluşturulur (par. 13). Denetçi ilave prosedür uygulamadığından
    ve yalnızca yönetimin beyanına dayandığından yanlışlık anomali sayılamaz; öngörüye dâhil edilir.

    - **20.000 TL ve 13.000 TL''lik yanlışlıklar:** Denetçi belirlediği her yanlışlığın nitelik ve sebebini araştırır; bunların
    denetim prosedürünün amacı ve denetimin diğer alanları üzerindeki muhtemel etkilerini değerlendirir (par. 12). Her iki
    yanlışlık da yıl sonuna yakın tarihli faturalardaki ortak bir özelliğe sahip olduğundan denetçi, anakitlede bu özelliği
    taşıyan tüm kalemleri belirleyip prosedürleri bu kalemleri kapsayacak şekilde genişletmeye karar verebilir; bu tür yanlışlıklar
    kasıtlı olabilir ve hile ihtimaline işaret edebilir (A17).


    **(b) Yanlışlığın öngörülmesi ve değerlendirilmesi (7 puan)**


    Denetçi detay testlerinde örneklemde bulduğu yanlışlıkları kullanarak anakitle için öngörüde bulunur (par. 14).


    | Kalem | TL |

    |---|---|

    | Örneklemdeki yanlışlık: 25.000 + 20.000 + 13.000 + 22.000 | 80.000 |

    | Yanlışlık oranı: 80.000 / 2.000.000 | %4 |

    | **Grup 2 için öngörülen yanlışlık:** 24.000.000 × %4 | **960.000** |

    | Grup 1''de bulunan fiili yanlışlık (tamamı incelendi) | 250.000 |

    | **Toplam en iyi yanlışlık tahmini:** 960.000 + 250.000 | **1.210.000** |

    | Kabul edilebilir yanlışlık | 1.000.000 |

    | Aşım | 210.000 |


    Öngörülen ve (varsa) anomal yanlışlığın toplamı, denetçinin anakitle için yaptığı en iyi yanlışlık tahminidir; bu toplamın
    kabul edilebilir yanlışlığı aşması hâlinde örneklem, test edilen anakitle hakkındaki sonuçlar için makul bir dayanak sağlamaz
    (A22). Burada 1.210.000 TL > 1.000.000 TL olduğundan **örneklem makul dayanak sağlamamaktadır**.


    Grup 1''in sonuçları Grup 2''ye yansıtılmaz, çünkü gruplandırma yönteminde bir grupta bulunan kalemlere uygulanan prosedürlerin
    sonuçları yalnızca o grubu oluşturan kalemlere yönelik olarak öngörülebilir (Ek 1 par. 3); ayrıca Grup 1''in tamamı incelendiğinden
    orada bulunan 250.000 TL fiili yanlışlıktır, tahmin değildir.


    Seçenekler (A23): yönetimden belirlenmiş yanlışlıkları ve daha fazla yanlışlık olması ihtimalini araştırmasını ve gerekli
    düzeltmeleri yapmasını talep etmek; sonraki denetim prosedürlerinin niteliğini, zamanlamasını ve kapsamını gerekli güvenceyi
    sağlayacak şekilde uyarlamak.


    **(c) BDS 450 (8 puan)**


    - **Bildirme ve düzeltme talebi:** Mevzuatla yasaklanmadıkça denetçi biriktirilen tüm yanlışlıkları yönetimin uygun bir
    kademesine zamanında bildirir ve düzeltilmesini ister (par. 8). Yönetim bir kısmını düzeltmeyi reddettiğinde denetçi,
    yönetimin düzeltme yapmama gerekçeleri hakkında bir kanaate ulaşır ve bir bütün olarak finansal tabloların önemli yanlışlık
    içerip içermediğini değerlendirirken bu kanaatini dikkate alır (par. 9). Öngörülen yanlışlık, örneklemde belirlenen yanlışlıkların
    anakitleye yansıtılmasıyla elde edilen en yaklaşık tahmindir ve fiili/muhakeme yanlışlıklarından ayrı izlenir (A6); "istatistiki
    tahmin" gerekçesi yanlışlığı ortadan kaldırmaz.

    - **Önemliliğin yeniden değerlendirilmesi:** Düzeltilmemiş yanlışlıkların etkisini değerlendirmeden önce önemlilik, fiili
    finansal sonuçlar kapsamında hâlâ geçerli mi diye yeniden değerlendirilir (par. 10; A14). Başlangıç: 32.000.000 × %5 =
    1.600.000 TL; yeniden: 28.000.000 × %5 = **1.400.000 TL**.

    - **Düzeltilmemiş yanlışlıklar:**


    | Kalem | TL |

    |---|---|

    | Grup 2 öngörülen yanlışlık (960.000) − örneklemde bulunup düzeltilen (80.000) | 880.000 |

    | Stok değerleme farkı | 350.000 |

    | Eksik karşılık | 250.000 |

    | **Toplam** | **1.480.000** |


    1.480.000 TL, yeniden belirlenen önemlilik olan 1.400.000 TL''yi 80.000 TL aşmaktadır; başlangıçtaki 1.600.000 TL''nin
    ise altındadır. Yanlışlıkların tamamı kârı aynı yönde etkilediğinden toplanabilir. Bu nedenle önemliliğin yeniden değerlendirilmesi
    sonucu değiştirmektedir: yanlışlıklar toplu olarak önemli kabul edilir.

    - **Önemli olup olmadığına karar:** Denetçi düzeltilmemiş yanlışlıkların tek başına veya toplu olarak önemli olup olmadığına
    karar verirken, yanlışlıkların belirli işlem sınıfları/hesap bakiyeleri ile bir bütün olarak finansal tablolar açısından
    büyüklüğünü ve niteliğini, meydana geldikleri özel şartları ve önceki dönemlere ilişkin düzeltilmemiş yanlışlıkların etkisini
    dikkate alır (par. 11).

    - **Üst yönetimden sorumlulara bildirim:** Mevzuatla yasaklanmadıkça düzeltilmemiş yanlışlıkları ve bunların görüş üzerindeki
    muhtemel etkisini bildirir; düzeltilmemiş önemli yanlışlıkları münferit olarak tanımlar ve düzeltilmesini ister (par.
    12).

    - **Yazılı beyan:** Yönetimden ve uygun hâllerde üst yönetimden sorumlulardan, düzeltilmemiş yanlışlıkların tek başına
    ve toplu hâlde finansal tablolar üzerindeki etkisinin önemsiz olduğu kanaatine varıp varmadıklarına ilişkin yazılı beyan
    talep eder; beyanda veya ekinde bu kalemlerin özeti yer alır (par. 14).

    '
