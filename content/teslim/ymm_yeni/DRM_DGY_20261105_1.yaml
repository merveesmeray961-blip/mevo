- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - 'Bağımsız denetçiler etik kuralları: ücret bağımlılığı - KAYİK olmayan müşteri (A410.15-16)'
  - Ücret bağımlılığı - KAYİK müşteri ve beş yıl sonrası (A410.18-21)
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Kalkan Bağımsız Denetim A.Ş. (denetim şirketi), Bağımsız Denetçiler İçin Etik Kurallar''a tabidir. Şirketin
    ortaklarının denetim şirketi dışında mesleki faaliyetlerden geliri yoktur. Şirketin yıllık toplam denetim ücretleri ile
    iki müşterisinden (Verim Enerji A.Ş. kamu yararını ilgilendiren kuruluş (KAYİK) değildir; Tuna Bankacılık A.Ş. KAYİK''tir)
    aldığı ücretler aşağıdadır (bin TL; ücretler 2021-2025 hesap dönemlerine ilişkindir, 2025 dönemi denetim raporları 2026
    yılı Mart ayında yayımlanacaktır):


    | Hesap dönemi | Şirketin toplam ücreti | Verim Enerji A.Ş. | Tuna Bankacılık A.Ş. |

    |---|---|---|---|

    | 2021 | 20.000 | 6.500 | 3.400 |

    | 2022 | 24.000 | 7.500 | 4.080 |

    | 2023 | 30.000 | 9.300 | 5.100 |

    | 2024 | 38.000 | 11.700 | 6.460 |

    | 2025 | 50.000 | 15.500 | 8.500 |


    **İstenenler:**


    (a) Verim Enerji A.Ş. için her yıl ücret oranını hesaplayınız; kuralın aranan eşiğini ve süresini belirterek 2025 dönemi
    için denetim şirketinin ne yapması gerektiğini açıklayınız. (8 puan)


    (b) Tuna Bankacılık A.Ş. için her yıl ücret oranını hesaplayınız; kuralın eşiğini aşan ardışık yılların ilkini bularak
    ikinci yıla ait denetim görüşü yayımlanmadan önce yapılması gerekeni açıklayınız. (6 puan)


    (c) Tuna Bankacılık A.Ş. için söz konusu durumun beş yıl boyunca devam etmesi hâlinde denetim şirketinin 2025 dönemi sonrası
    yapması gerekeni ve bunun istisnasını belirtiniz. (4 puan)


    (d) Verim Enerji A.Ş.''nin oranının eşiği aşmaya devam etmesi durumunda denetim şirketinin sonraki yıllarda ne yapması
    gerektiğini açıklayınız. (4 puan)

    '
  cozum: '**(a) Verim Enerji A.Ş. - KAYİK olmayan müşteri (8 puan)**


    Oranlar (müşteri ücreti / şirketin toplam ücreti): 2021: 6.500/20.000 = %32,5; 2022: 7.500/24.000 = %31,25; 2023: 9.300/30.000
    = %31; 2024: 11.700/38.000 = %30,79; 2025: 15.500/50.000 = %31. Beş yılın tamamında oran %30''un üzerindedir (5 yıl).


    A410.15 uyarınca birbirini takip eden **beş yılın her biri** için KAYİK olmayan müşteriden alınan toplam ücretler, denetim
    şirketi tarafından alınan toplam ücretlerin **%30''unu aşıyorsa** denetim şirketi, oluşan tehditlerin kabul edilebilir
    düzeye indirilmesinde şu adımlardan birinin önlem olup olmayacağına karar verir ve öyleyse uygular: (a) **beşinci yıla**
    (2025) ait denetim görüşü **yayımlanmadan önce**, şirketin üyesi olmayan bir denetçinin beşinci yılın denetim çalışmalarını
    gözden geçirmesi veya (b) görüş yayımlandıktan sonra ve **altıncı yıla** ait görüş yayımlanmadan önce, şirketin üyesi
    olmayan bir denetçi veya yetkili bir mercin beşinci yılın denetim çalışmalarını gözden geçirmesi. Bu durumda 2025 dönemi
    için adımlardan biri (yayımlanma öncesi veya sonrası gözden geçirme) uygulanır.


    **(b) Tuna Bankacılık A.Ş. - KAYİK müşteri (6 puan)**


    Oranlar: 2021: 3.400/20.000 = %17; 2022: 4.080/24.000 = %17; 2023: 5.100/30.000 = %17; 2024: 6.460/38.000 = %17; 2025:
    8.500/50.000 = %17. Beş yılın tamamında oran %15''in üzerindedir (5 yıl).


    A410.18: **Birbirini takip eden iki yılın her biri** için KAYİK olan müşteriden alınan toplam ücretler, şirket ücretlerinin
    **%15''ini** aşıyorsa veya aşması muhtemelse, denetim şirketi **ikinci yıla** ait denetim görüşü yayımlanmadan önce, şirketin
    üyesi olmayan bir denetçinin gerçekleştireceği **yayımlanma öncesi incelemenin** tehditleri kabul edilebilir düzeye indirmede
    önlem olup olmayacağına karar verir ve öyleyse uygular. İlk iki ardışık yıl 2021 ve 2022 olduğundan, inceleme **2022 dönemine
    ait görüş yayımlanmadan önce** yapılır Hesaplamada denetim şirketinin, ortaklarının ve ortakların diğer şirketlerdeki
    mesleki gelirlerinin toplamı dikkate alınır; olayda ortakların başka geliri bulunmadığından payda şirketin toplam ücretidir..


