  kazanimlar:
  - Şüpheli işlem bildiriminin gizliliği ve yükümlülerin korunması (5549 md. 4, 10)
  - Bilgi ve belge verme, sır saklama ve sırrın ifşası (5549 md. 7, 22; 3568 md. 43)
  zorluk: 3
  puan: 24
  sure_dk: 30
  soru: '**Olay:** Altınyıldız Kuyumculuk A.Ş. değerli maden ve mücevher ticaretiyle iştigal eden bir şirkettir; 5549 sayılı
    Kanun bakımından "yükümlü" kabul edilecektir. Şirketin müdürü Selma Kural, 2026 yılı Mart ayında, müşterisi Bülent Tan''ın
    yaptığı yüksek tutarlı nakit işlemlerine ilişkin şüpheli işlem bildirimini Mali Suçları Araştırma Kurulu Başkanlığına
    (Başkanlık) yapmıştır. Sonraki gelişmeler şunlardır:


    | No | Gelişme |

    |---|---|

    | 1 | Selma Kural, Bülent Tan''ı arayarak "hakkınızda MASAK''a şüpheli işlem bildirdik" demiştir. |

    | 2 | Selma Kural, Başkanlığın yükümlülük denetimi için görevlendirdiği vergi müfettişine bildirimi yaptığını açıklamıştır.
    |

    | 3 | Selma Kural, Bülent Tan hakkında açılan ceza davasında mahkemede dinlenirken bildirimi yaptığını anlatmıştır. |

    | 4 | Şirketin muhasebe müdürü, Bülent Tan''ın avukatının yazılı talebi üzerine, mahkeme dışında, bildirimi kimin yaptığını
    avukata söylemiştir. |

    | 5 | Bülent Tan, bildirimden dolayı Selma Kural ve şirket aleyhine tazminat davası açmıştır. |

    | 6 | Şirketin tam tasdik görevini yürüten yeminli mali müşavir Dilek Sönmez, Başkanlığın görevlendirdiği denetim elemanı
    şirket defter ve belgelerini istediğinde "3568 sayılı Kanun md. 43 gereği meslek sırrıdır" diyerek belgeleri vermemiştir.
    |


    Başkanlık ayrıca, işlem tekniklerine ilişkin bilgisine ve ihtisasına başvurduğu Dilek Sönmez''e yüksek tutarlı nakit işlemlerin
    kayıtlarına ilişkin bilgileri iletmiştir. Dilek Sönmez, bu bilgileri 80.000 TL karşılığında şirketin rakibi olan Parlak
    Mücevher Ltd. Şti.''ne vermiştir.


    **İstenenler:**


    (a) 1, 2 ve 3 numaralı gelişmeleri 5549 sayılı Kanun''un 4 üncü maddesinin ikinci fıkrası bakımından değerlendiriniz;
    ihlal varsa doğan yaptırımı belirtiniz. (6 puan)


    (b) 4 ve 5 numaralı gelişmeleri aynı Kanun''un 10 uncu maddesi bakımından değerlendiriniz. (6 puan)


    (c) 6 numaralı gelişmedeki Dilek Sönmez''in tutumunu 5549 sayılı Kanun''un 7 nci maddesi ve 3568 sayılı Kanun''un 43 üncü
    maddesi bakımından değerlendiriniz; yaptırımı belirtiniz. (6 puan)


    (d) Dilek Sönmez''in 80.000 TL karşılığında bilgi vermesi nedeniyle 5549 sayılı Kanun''un 22 nci maddesi uyarınca karşılaşacağı
    yaptırımı, alt sınırı ve görevinden ayrılmasının etkisini belirterek açıklayınız. (6 puan)

    '
  cozum: '**(a) 4 üncü madde ikinci fıkra (6 puan)**


    Yükümlüler, Başkanlığa şüpheli işlem bildiriminde bulunulduğunu; **yükümlülük denetimi ile görevlendirilen denetim elemanları
    ve yargılama sırasında mahkemeler dışında, işleme taraf olanlar dahil hiç kimseye** açıklayamazlar (md. 4/2).


    | No | Değerlendirme |

    |---|---|

    | 1 | **İhlal vardır.** Bildirim, işleme taraf olan Bülent Tan''a açıklanmıştır. Yaptırım: md. 14/1 – bir yıldan üç yıla
    kadar hapis ve beşbin güne kadar adli para cezası. |

    | 2 | **İhlal yoktur.** Açıklama, yükümlülük denetimi ile görevlendirilen denetim elemanına yapılmıştır; istisna kapsamındadır.
    |

    | 3 | **İhlal yoktur.** Açıklama yargılama sırasında mahkemede yapılmıştır; istisna kapsamındadır. |


    **(b) 10 uncu madde (6 puan)**


    - **4 numaralı gelişme:** Md. 10/2''ye göre özel kanunlarda hüküm bulunsa dahi şüpheli işlem bildiriminde bulunanlara
    dair, **mahkeme dışında**, üçüncü kişi, kurum ve kuruluşlara bilgi verilemez. Bilginin avukata mahkeme dışında verilmesi
    hükme aykırıdır; bildirimin yapıldığının açıklanması ayrıca md. 4/2''ye de aykırıdır (md. 14/1 yaptırımı).

    - **5 numaralı gelişme:** Md. 10/1''e göre bu Kanun gereğince yükümlülüklerini yerine getiren gerçek ve tüzel kişiler
    **hiçbir şekilde hukuki ve cezai bakımdan sorumlu tutulamaz**. Bildirimi yasal yükümlülük gereği yapan Selma Kural ve
    şirket tazminattan sorumlu tutulamaz.

    - Ayrıca mahkemece, bildirimde bulunanların kimliklerinin saklı tutulması ve güvenliklerinin sağlanması için gerekli önlemler
    alınır (md. 10/2).


    **(c) 7 nci madde ve 3568 sayılı Kanun md. 43 (6 puan)**


    - 5549 sayılı Kanun md. 7/1: Gerçek ve tüzel kişiler, Başkanlık ve denetim elemanlarınca istenen her türlü bilgi, belge
    ve kaydı tam ve doğru olarak vermekle yükümlüdür.

    - Md. 7/2: Talepte bulunulanlar, savunma hakkına ilişkin hükümler saklı kalmak kaydıyla, **özel kanunlarda yazılı hükümleri
    ileri sürerek** bilgi ve belge vermekten kaçınamaz. Dilek Sönmez''in 3568 sayılı Kanun''a dayanması hükmü ortadan kaldırmaz.

    - 3568 sayılı Kanun md. 43/3''e göre **adli veya idari her türlü inceleme veya soruşturma sır ifşa yasağının dışındadır**;
    denetim elemanına bilgi ve belge verilmesi meslek sırrının ifşası sayılmaz.

    - Yaptırım: Md. 14/1 – 7 nci maddedeki yükümlülüğü ihlal eden kimse bir yıldan üç yıla kadar hapis ve beşbin güne kadar
    adli para cezası ile cezalandırılır.


    **(d) 22 nci madde (6 puan)**


    - Md. 22/1(b): **Bilgilerine ve ihtisaslarına başvurulan kişiler**, görevleri dolayısıyla öğrendikleri sırları ifşa edemez
    ve kendilerinin veya üçüncü şahısların yararına kullanamaz; bu yasak **görevlerinden ayrılsalar dahi** devam eder.

