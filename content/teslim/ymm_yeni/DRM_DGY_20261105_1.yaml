- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - Çıkar çatışmaları ve ikincil görüşler (Etik İlkeler md. 36-39)
  - Güvence sözleşmelerinde bağımsızlık, sözleşme dönemi ve güvence dışı hizmetler (md. 53-61)
  zorluk: 3
  puan: 23
  sure_dk: 35
  soru: '**Olay:** Bağımsız çalışan yeminli mali müşavirlerden oluşan Doruk-Er YMM Ortaklık Bürosu, 2025 ve 2026 yıllarında
    aşağıdaki durumlarla karşılaşmıştır:


    **I. Çıkar çatışması:** Büro, aynı sektörde birbiriyle rekabet eden Ada Gıda A.Ş. ve Bora Gıda A.Ş.''ye aynı dönemde hizmet
    vermek istemektedir.


    **II. İkincil görüş:** Büronun müşterisi olmayan Cem Plastik A.Ş., bir muhasebe standardının uygulanması konusunda büronun
    ikincil görüş vermesini istemiştir. Cem Plastik A.Ş.''nin mevcut meslek mensubu farklı bir görüş savunmaktadır.


    **III. Bağımsızlık:** Büro, Ada Gıda A.Ş.''nin 01.01.2025-31.12.2025 dönemine ait finansal tablolarının bağımsız denetim
    sözleşmesini 15.10.2025''te kabul etmiş, sözleşme ekibi güvence hizmetlerini yerine getirmeye 20.10.2025''te başlamış
    ve denetim raporu 18.03.2026''da yayımlanmıştır. Büro, aynı şirkete daha önce şu güvence amaçlı olmayan hizmetleri vermiştir:


    | Hizmet | Süre |

    |---|---|

    | Defter tutma | 01.03.2025 - 30.06.2025 (sona ermiştir) |

    | Bordro hazırlama | 01.09.2025 - hâlen sürmektedir |


    **İstenenler:**


    (a) I numaralı durumda doğabilecek tehdidi, alınabilecek önlemleri (en az dört) ve önlemlerle tehditler giderilemiyorsa
    yapılması gerekeni belirtiniz. (6 puan)


    (b) II numaralı durumda büronun alabileceği önlemleri ve Cem Plastik A.Ş.''nin mevcut meslek mensubuyla iletişim kurulmasına
    izin vermemesi hâlinde büronun yapması gerekeni açıklayınız. (6 puan)


    (c) III numaralı durumda, finansal tablo denetimi sözleşmesinin sözleşme dönemini tarihleriyle belirleyiniz; defter tutma
    ve bordro hazırlama hizmetlerini bağımsızlık bakımından ayrı ayrı değerlendiriniz; önemli tehditler için alınabilecek
    önlemleri belirtiniz. (8 puan)


    (d) Fikren bağımsızlık ve görünümde bağımsızlık kavramlarını açıklayınız. (3 puan)

    '
  cozum: '**(a) Çıkar çatışması (6 puan)**


    - Bağımsız çalışan meslek mensubunun çıkar çatışması içinde olan müşterilere hizmet sunması **tarafsızlık veya gizlilik
    ilkesine** yönelik tehdit yaratabilir (md. 36/1). Rakip iki müşteriye aynı anda hizmet verilmesi tipik örnektir.

    - Md. 37/1''e göre alınabilecek önlemler: (a) çıkar çatışması yaratabilecek faaliyetler hakkında müşteriye bilgi verilmesi
    ve onayının alınması; (b) çıkar çatışması içindeki iki veya daha fazla müşteri için hizmet verilmesi hâlinde ilgili tüm
    taraflara bilgi verilmesi ve onaylarının alınması; (ç) **farklı sözleşme ekiplerinin kullanılması**; (d) **bilgiye ulaşımı
    engelleyen süreçler** oluşturulması; (e) güvenlik ve gizlilikle ilgili konularda sözleşme ekipleri için rehberler hazırlanması;
    (f) firma ortakları ve çalışanları tarafından imzalanan **gizlilik anlaşmaları** yapılması.

    - Tehditler bu önlemlerle yok edilemiyor veya kabul edilebilir düzeye indirilemiyorsa meslek mensubu **belirli bir sözleşmenin
    kabul edilmesinin uygun olmayacağı veya çatışma yaratan sözleşmelerden vazgeçilmesi gerektiği** sonucunu çıkarmalıdır
    (md. 38/1).


    **(b) İkincil görüş (6 puan)**


    - Müşterisi olmayan bir işletme adına ikincil görüş sağlanması temel etik ilkelere uyumla ilgili tehditlere neden olabilir;
    örneğin görüş, mevcut meslek mensubuna sunulan aynı veri setine dayanmazsa veya yetersiz kanıta dayanırsa **meslekî yeterlilik
    ve özen** ilkesine yönelik tehdit oluşur (md. 39/1).

    - Görüş istenen meslek mensubu tehdidin önemini değerlendirmeli ve önlemler almalıdır; önlemler: müşteriden izin alınarak
    **mevcut meslek mensubu ile görüşülmesi**, görüşle ilgili sınırlamaların müşteri ile görüşülmesi ve mevcut meslek mensubuna
    görüşün bir kopyasının sunulması (md. 39/2).

    - Cem Plastik A.Ş. mevcut meslek mensubuyla iletişim kurulmasına izin vermiyorsa büro, **tüm koşulları dikkate alarak
    görüş bildirmenin uygun olup olmayacağına karar vermelidir** (md. 39/3).


    **(c) Bağımsızlık ve sözleşme dönemi (8 puan)**


    - Md. 59/1: Sözleşme dönemi, sözleşme ekibinin güvence hizmetlerini yerine getirmeye başlamasıyla (20.10.2025) başlar
    ve güvence raporunun yayımlanmasıyla (18.03.2026) son bulur. Md. 60/1: Finansal tablo denetimi sözleşmelerinde sözleşme
    dönemine **finansal tabloların kapsadığı dönem de dâhildir**; dolayısıyla finansal tablo denetimi bakımından bağımsızlığın
    gözetileceği dönem **01.01.2025 - 18.03.2026**''dır (ekip fiilen 20.10.2025''te çalışmaya başlamıştır, ancak finansal
    tabloların kapsadığı 01.01.2025-31.12.2025 dönemi de dâhildir).

    - **Defter tutma (01.03.2025 - 30.06.2025):** Finansal tabloların kapsadığı dönem içinde, denetim sözleşmesinin kabulünden
    önce ve denetim hizmetinin başlamasından önce sunulmuş, 30.06.2025''te sona ermiş bir hizmettir. Md. 60(b) uyarınca firma,
    denetim müşterisine **daha önceden sunulan hizmetlerin** bağımsızlığa tehdit yaratıp yaratmayacağını dikkate almalıdır;
    hizmet sona erdiğinden denetim sözleşmesi süresince ifası söz konusu değildir, tehdit değerlendirilir ve önemliyse önlem
    alınır.

    - **Bordro hazırlama (01.09.2025''ten beri sürüyor):** Hizmet finansal tabloların kapsadığı süre içinde başlamış, denetim
    hizmetinin başlamasından (20.10.2025) önce sunulmaya başlanmıştır. Md. 61''e göre bu tür bir hizmetin ifası **denetim
    sözleşmesi süresince yasaklanmalıdır**; bordro hizmetinin denetim sözleşmesi boyunca sürdürülmesi bağımsızlığa aykırıdır
    ve sona erdirilmelidir.

    - Önemli tehditler için alınabilecek önlemler (md. 61): güvence amaçlı olmayan hizmetlerle ilgili bağımsızlık konularının
    müşterinin yönetişimden sorumlu gruplarla (denetim komitesi gibi) tartışılması; hizmetlerin sonuçları için müşterinin
    **sorumluluk onayının** alınması; güvence amaçlı olmayan hizmette görev alan personelin finansal tablo denetiminde görev
    almaması.


    **(d) Bağımsızlık türleri (3 puan)**


    Md. 53: Bağımsızlık ilkesi **fikren bağımsızlık** ve **görünümde bağımsızlık** olarak ikiye ayrılır. Fikren bağımsızlık,
    meslekî kararın dış etkilerden bağımsız olarak verilmesi, meslek mensubunun dürüstlük, tarafsızlık ve meslekî şüphecilik
    içinde davranmasıdır. Görünümde bağımsızlık ise gerekli tüm bilgilere sahip, uygulanan önlemleri bilen üçüncü bir grup
    tarafından da firmanın ve sözleşme ekibinin dürüstlük, tarafsızlık ve meslekî şüpheciliğinin onaylanmasını ifade eder.

    '
