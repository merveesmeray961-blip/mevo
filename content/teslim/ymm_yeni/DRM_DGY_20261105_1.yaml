    denetimini yürütmektedir. Bağımsızlık Standartları''nın rotasyon hükümleri bakımından 2025 hesap dönemi denetimi tamamlandığında
    (rapor 2026 yılı Mart ayında yayımlanmıştır) üç kişinin görev geçmişi şöyledir:


    | Kişi | Görev geçmişi (Doğan Enerji A.Ş. denetimi) |

    |---|---|

    | Ayşe Tan | 2019-2025 hesap dönemleri boyunca (7 yıl) sorumlu denetçi |

    | Deniz Er | 2019-2023 dönemlerinde (5 yıl) işin kalitesini gözden geçirmeden sorumlu kişi, 2024-2025 dönemlerinde (2
    yıl) sorumlu denetçi |

    | Emre Kaya | 2022-2023 dönemlerinde (2 yıl) başka bir denetim şirketinde bu işin sorumlu denetçisi; 2024''te Esen Bağımsız
    Denetim A.Ş.''ye geçmiş ve 2024-2025 dönemlerinde (2 yıl) sorumlu denetçi |


    **İstenenler:**


    (a) Ayşe Tan''ın görev sınırını ve 2025 dönemi sonrasındaki durumunu (ara verme süresi, Doğan Enerji''de yeniden görev
    alabileceği ilk hesap dönemi) açıklayınız. (7 puan)


    (b) Deniz Er için kümülatif görev süresini, ara verme süresini ve Doğan Enerji''de yeniden görev alabileceği ilk hesap
    dönemini belirleyiniz. (6 puan)


    (c) Emre Kaya''nın önceki denetim şirketindeki süresinin nasıl hesaba katılacağını açıklayınız ve en fazla hangi hesap
    dönemine kadar sorumlu denetçi olarak görev yapabileceğini belirleyiniz. (5 puan)


    (d) Ayşe Tan''ın ara verme süresi boyunca yapamayacağı faaliyetlerden iki tanesini belirtiniz. (4 puan)

    '
  cozum: '**(a) Ayşe Tan (7 puan)**


    Md. A540.5: KAYİK denetiminde bir kişi kümülatif olarak **yedi yıldan fazla** sorumlu denetçi, işin kalitesini gözden
    geçirmeden sorumlu kişi veya diğer kilit denetçi rollerinden herhangi birini ya da bileşimini üstlenemez. Ayşe Tan 2019-2025
    arasında 7 yıl sorumlu denetçi olarak görev yaptığından azami denetlenebilir dönemini doldurmuştur ve 2026 dönemi için
    aynı rolde görev alamaz. A540.11: Kişinin kümülatif olarak yedi yıl boyunca sorumlu denetçi olması durumunda ara verme
    süresi **birbirini takip eden beş yıl** olmalıdır. Ara verme süresi 2026-2030 dönemlerini kapsar; Doğan Enerji''de yeniden
    görev alabileceği ilk dönem **2031**''dir.


    **(b) Deniz Er (6 puan)**


    5 yıl (kalite gözden geçirme) + 2 yıl (sorumlu denetçi) = **7 yıl** kümülatif görev. Kişi birden fazla kilit denetçi rolünde
    görev almış ve dört veya daha fazla yıl hizmet vermiştir; sorumlu denetçi olarak yalnızca 2 yıl (üç yıldan az) görev yaptığı
    için A540.16(b) uyarınca ("diğer herhangi bir bileşimde") ara verme süresi **birbirini takip eden üç yıl** olmalıdır (üç
    veya daha fazla yıl sorumlu denetçi olsaydı A540.16(a) uyarınca beş yıl olurdu). Ara verme 2026-2028 dönemlerini kapsar;
    yeniden görev alabileceği ilk dönem **2029**''dur.


    **(c) Emre Kaya (5 puan)**


    A540.18: Kilit denetçi olduğu yıl sayısının belirlenmesinde, ilişkinin süresi -ilgili hâllerde- kişinin bu işte kilit
    denetçi olarak daha önceki denetim şirketinde geçirdiği süreyi de içerir. Dolayısıyla Emre Kaya''nın süresi 2 (önceki
    firma) + 2 (Esen) = **4 yıl**dır. A540.5 uyarınca azami süre 7 yıl olduğundan kalan süre 7 - 4 = **3 yıl**dır; 2026, 2027
    ve 2028 dönemlerinde de görev alabilir ve **2028 hesap dönemine kadar** sorumlu denetçi olarak görev yapabilir. 2029 dönemi
    için görev alamaz.


    **(d) Ara verme süresi boyunca faaliyet kısıtlamaları (4 puan)**


    A540.20: Ara verme süresi boyunca kişi (a) iş ekibi üyesi olamaz veya denetim işi açısından kaliteyi gözden geçirme ya
    da denetimin kalitesini gözden geçirmenin amacıyla tutarlı bir gözden geçirme gerçekleştiremez; (b) denetim işini etkileyen
    teknik veya sektöre özgü konular, işlemler veya olaylarla ilgili olarak iş ekibiyle veya müşteriyle görüş alışverişinde
    bulunamaz (azami dönemin son yılında üstlendiği işler veya vardığı sonuçlarla sınırlı, denetimle ilgili müzakereler hariç);
    ayrıca (c) denetim müşterisine sunulan hizmetlerin yönetim ve koordinasyonundan veya müşteri ilişkisinin gözetiminden
    sorumlu olamaz. Bunlardan herhangi ikisi yeterlidir.

    '
