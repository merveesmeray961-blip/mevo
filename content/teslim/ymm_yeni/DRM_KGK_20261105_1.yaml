  kazanim: Kurumca yapılan incelemelerde yetkiler ve arama (KHK md. 25)
  tip: kavrama
  zorluk: 3
  kok: 'Kurumun bir bağımsız denetim kuruluşu nezdinde yürüttüğü inceleme sırasında istenen çalışma kâğıtları ibraz edilmemiş,
    kuruluş yöneticisi ise özel kanunlardaki sır saklama hükümlerine dayanmıştır. Arama sonucunda alınan defter ve belgeler
    12.01.2026''da incelemeye alınmıştır. 660 sayılı KHK md. 25 hükümleri bakımından aşağıdaki öncüllerden hangileri doğrudur?


    I. Kendilerinden bilgi istenilen gerçek ve tüzel kişiler, özel kanunlarda yazılı gizlilik ve sır saklama hükümlerini ileri
    sürerek bilgi vermekten imtina edemez.


    II. İstenen belgelerin ibraz veya teslim edilmemesi hâlinde arama yapılabilmesi için Kurumun gerekçeli bir yazıyla yetkili
    sulh ceza hakiminden talepte bulunması ve hakimin arama kararı vermesi gerekir.


    III. Arama sonucunda alınan defter ve belgeler üzerindeki incelemeler üç ay içinde bitirilemezse bu süre Kurul kararıyla
    uzatılabilir.


    IV. Kurumun planlanmış incelemeler yanında ihbar, şikâyet ve bildirim gibi durumlarda da inceleme yapma ve yaptırma yetkisi
    saklıdır.'
  secenekler:
    A: I ve II
    B: I ve III
    C: I, II ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I doğrudur: md. 25/6 sır saklama hükümlerinin bilgi vermekten imtina gerekçesi yapılamayacağını söyler.
      II doğrudur: md. 25/7''ye göre arama için Kurumun gerekçeli yazısı üzerine yetkili sulh ceza hakiminin karar vermesi
      gerekir. III yanlıştır: üç aylık sürenin uzatılması Kurul kararıyla değil, haklı sebeplere dayanılarak **sulh ceza hakiminin
      kararıyla** olur. IV doğrudur: md. 25/1 son cümle. Püf noktaları: "Sulh ceza hakimi" ile "Kurul" ayrımına dikkat edin;
      sır saklama hükümleri inceleme yetkisinin önünde engel değildir; 12.01.2026 gibi tarihler çözümü değiştirmeyen gereksiz
      veridir.'
    celdiriciler:
      A: IV de doğru olduğundan seçenek eksiktir; md. 25/1 son cümle planlı incelemeler dışında ihbar ve şikâyet üzerine de
        inceleme yetkisini saklı tutar.
      B: III yanlış olduğu gibi II de doğru olduğu halde bu şıkta yer almamaktadır; süre uzatma yetkisi sulh ceza hakimindedir.
      D: III numaralı öncül yanlıştır, çünkü süre uzatımı Kurul kararıyla değil sulh ceza hakiminin kararıyla yapılır; ayrıca
        I doğru olduğu halde şıkta yer almamıştır.
      E: III numaralı öncül yanlış olduğundan dört öncülün tümü doğru kabul edilemez.
  kaynaklar:
  - mevzuat: 660 sayılı Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun Teşkilat ve Görevleri Hakkında KHK
    madde: md. 25/1
    alinti: Kurumun; planlanmış bu incelemeler yanında ihbar, şikayet, bildirim gibi durumlarda ve gerekli görülen diğer hallerde
      inceleme yapma ve yaptırma yetkisi saklıdır.
  - mevzuat: 660 sayılı Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun Teşkilat ve Görevleri Hakkında KHK
    madde: md. 25/6
    alinti: Kendilerinden bilgi istenilen gerçek ve tüzel kişiler özel kanunlarda yazılı gizlilik ve sır saklama hükümlerini
      ileri sürerek bilgi vermekten imtina edemezler.
  - mevzuat: 660 sayılı Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun Teşkilat ve Görevleri Hakkında KHK
    madde: md. 25/7
    alinti: İnceleme için görevlendirilenler tarafından istenecek rapor, defter, belge ve çalışma kâğıtları ile elektronik,
      manyetik ve benzeri ortamlarda tutulanlar dahil tüm kayıtların ve sair bilgi ihtiva eden vasıtaların ibraz veya teslim
      edilmemesi veya gerekli görülen diğer hallerde, Kurumun gerekçeli bir yazı ile yetkili sulh ceza hakiminden talepte
      bulunması
  - mevzuat: 660 sayılı Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun Teşkilat ve Görevleri Hakkında KHK
    madde: md. 25/7
    alinti: Arama sonucunda alınan defter ve belgeler üzerindeki incelemeler en geç üç ay içinde sonuçlandırılarak bir tutanakla
