  konu: KGK
  kazanimlar:
  - Denetim sözleşmesinin asgari içeriği ve yapılma süresi (BDY md. 29)
  - Kuruma bildirim yükümlülükleri ve süreleri (BDY md. 34)
  - İdari yaptırımlarda uyarı ve savunma/yargı yolu (BDY md. 40, 43; KHK md. 30)
  zorluk: 2
  puan: 20
  sure_dk: 30
  soru: '**Olay:** Pusula Bağımsız Denetim A.Ş. (Pusula), kamu yararını ilgilendiren kuruluş niteliğinde olmayan ve Türk Ticaret
    Kanunu uyarınca bağımsız denetime tabi iki işletmeyle çalışmaktadır.


    **1. Ege Plastik A.Ş.:** Genel kurul, 23.03.2026 Pazartesi günü Pusula''yı 2026 hesap dönemi denetçisi seçmiştir. Pusula,
    11.05.2026''da işletmeye yazılı ihtarda bulunmuş; işletme 22.05.2026 tarihine kadar sözleşme yapmaktan kaçınmaya devam
    etmiştir. Pusula''nın hazırladığı denetim sözleşmesi taslağı hakkında bilgiler şöyledir:


    | No | Taslak hükmü |

    |---|---|

    | 1 | Denetimin amacı, kapsamı, dönemi, konusu ve kıstası belirtilmiştir. Denetim ekibindeki asıl denetçilerin adları,
    unvanları, çalışma süreleri, her biri için ücret dökümü ve toplam ücret yazılmıştır; yedek denetçilere yer verilmemiştir.
    |

    | 2 | Denetim ücretinin ödenmesi, işletmenin defter tutma hizmetini de Pusula''dan almasına bağlanmıştır. |

    | 3 | Denetçilerin yalnızca işletmenin "ilgili gördüğü" kayıt ve dokümanlara erişebileceği belirtilmiştir. |

    | 4 | Sözleşmenin taraflarca diledikleri zaman feshedilebileceği öngörülmüştür. |

    | 5 | Denetimin Türkiye Denetim Standartları''na ve ilgili mevzuata uygun yürütüleceği, sorumlu denetçi ve yedeğinin raporu
    imzalamaya yetkili olduğu, denetimin başlangıç ve bitiş tarihleri ile raporun teslim tarihi ve mesleki sorumluluk sigortası
    yaptırılacağı hükümleri bulunmaktadır. |


    **2. Mavi Lojistik A.Ş.:** Denetim sözleşmesi 12.05.2026 tarihinde imzalanmış ve Kuruma 18.06.2026''da gönderilmiştir.
    Pusula, merkez adresini 14.07.2026''da değiştirmiş ve değişikliği Kuruma 28.07.2026''da bildirmiştir. Pusula''nın 2025
    takvim yılına ait gelirlerine ilişkin bildirimi ise 20.05.2026''da yapılmıştır.


    Süre sonu hafta sonuna veya resmî tatile rastlamamaktadır; sürelerin hesabında bu husus dikkate alınmayacaktır.


    **İstenenler:**


    (a) Ege Plastik A.Ş. ile sözleşmenin en geç hangi tarihte (gün adıyla) yapılması gerektiğini; işletmenin yazılı ihtara
    rağmen sözleşme yapmaktan kaçınması hâlinde Pusula''nın ne yapması ve hangi süre içinde yapması gerektiğini açıklayınız.
    (6 puan)


    (b) Taslak sözleşmenin 1–5 numaralı hükümlerinden hangilerinin Bağımsız Denetim Yönetmeliği''ne aykırı veya eksik olduğunu
    gerekçesiyle belirtiniz. (6 puan)


    (c) Mavi Lojistik sözleşmesinin Kuruma bildirimi, adres değişikliğinin bildirimi ve gelir bildirimi için son günleri bulunuz;
    her birinin zamanında yapılıp yapılmadığını, yapılmamışsa gecikmeyi gün olarak gösteriniz. (5 puan)


    (d) Bu aykırılıklar bakımından hangi yaptırım türünün uygulanabileceğini, yaptırım kararı öncesinde ilgiliye tanınacak
    asgari savunma süresini ve karara karşı başvurulabilecek yolu belirtiniz. (3 puan)

    '
  cozum: '**(a) Sözleşme süresi ve kaçınma (6 puan)** — BDY md. 29/3


    - Sözleşme, denetçinin seçiminden itibaren **en geç 60 gün** içinde yapılır. 23.03.2026 + 60 gün = **22.05.2026 Cuma**.
    Ege Plastik, 22.05.2026''ya kadar sözleşme yapmaktan kaçınmıştır.

    - Denetimi üstlenen, bu süre içinde **yazılı ihtarına rağmen** işletme sözleşme yapmaktan kaçınırsa durumu **izleyen 10
    gün içinde Kuruma bildirir**. Pusula''nın ihtarı (11.05.2026) süre içinde yapılmıştır; bu nedenle Pusula''nın Kuruma bildirim
    yükümlülüğü doğmuştur.


    **(b) Taslak sözleşmenin değerlendirilmesi (6 puan)** — BDY md. 29/1 ve 29/2


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 1 | **Eksik** | Denetim ekibinde yer alan denetçilerin ad ve unvanları, çalışma süreleri, ücret dökümü ve toplam ücret
    **yedekler de dâhil olmak üzere** sözleşmede yer almalıdır (md. 29/1-f). |

    | 2 | **Aykırı** | Sözleşmede denetim hizmeti dışında başka bir hizmet öngörülemez; denetim ücretinin ödenmesi denetim
    hizmeti dışında başka bir şarta bağlanamaz (md. 29/2). |

    | 3 | **Eksik / aykırı** | Denetimle ilgili istenen her türlü kayıt, doküman ve bilgiye **sınırsız erişim** sağlanacağına
    dair hüküm bulunmalıdır (md. 29/1-e). |

    | 4 | **Aykırı** | Sözleşmenin **ancak mevzuat uyarınca feshedilebileceğine** ilişkin hüküm bulunmalıdır (md. 29/1-i);
    ayrıca denetimi üstlenen sözleşmeyi yalnızca haklı sebep varsa veya kendisine karşı görevden alınma davası açılmışsa feshedebilir
    (md. 29/4). |

    | 5 | Uygun | Standartlara uygunluk, sorumlu denetçi ve yedeğinin imza yetkisi, tarihler ve mesleki sorumluluk sigortası
    hükümleri md. 29/1-d, g, ğ, h''ye uygundur. |


    **(c) Bildirim süreleri (5 puan)** — BDY md. 34/1-a, b, d


    | Bildirim | Dayanak | Son gün | Yapıldığı tarih | Sonuç |

    |---|---|---|---|---|

    | Denetim sözleşmesi (imza 12.05.2026) | İmza tarihinden itibaren en geç 30 gün (b) | 11.06.2026 Perşembe | 18.06.2026
    | **7 gün gecikme** |

    | Merkez adresi değişikliği (14.07.2026) | Değişikliği takip eden günden itibaren en geç 10 gün (a) | 24.07.2026 Cuma
    | 28.07.2026 | **4 gün gecikme** |

    | 2025 yılı gelirleri | Mayıs ayının on beşinci gününün sonuna kadar (d) | 15.05.2026 Cuma | 20.05.2026 | **5 gün gecikme**
    |


    **(d) Yaptırım ve başvuru yolu (3 puan)**


    - Taslak sözleşmenin md. 29''a aykırı olması (md. 40/1-d) ve Kuruma yapılacak bildirimlerin zamanında yapılmaması (md.
    40/1-h) hâlinde **uyarı** yaptırımı uygulanır. Kurul, fiilin ağırlığını dikkate alarak gerekçesini belirtmek suretiyle
    daha hafif bir yaptırım uygulamaya da yetkilidir (md. 43/3).

    - İlgililere savunma yapılması için **on günden az olmamak üzere** süre verilir (md. 43/2).

    - Kurul kararları kesindir, itiraz edilemez; ancak yargı yolu açıktır (md. 43/4). İdari yaptırım kararlarına karşı yetkili
    **idare mahkemesinde** dava açılabilir (660 sayılı KHK md. 30).

    '
