  soru: '**Olay:** Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu''na (Kurum) ilişkin aşağıdaki hususlar değerlendirilecektir.
    Bu vakada memur aylık katsayısı **2,5 TL** olarak alınacaktır.


    **I. Faaliyet raporu:** Kurum, 2025 yılına ait faaliyet raporunu 14.04.2026 Salı günü hazırlamıştır.


    **II. Çalışma ve danışma komisyonu:** Kurum, bir standart oluşturma süreci için dışarıdan uzmanlardan oluşan geçici bir
    komisyon kurmak istemektedir. Taslakta komisyon 11 kişilik olarak planlanmıştır. Komisyonda görevlendirilecek iki kişi
    hakkında bilgiler şöyledir:


    | Kişi | Durum | Kurulun belirlediği toplantı günü huzur hakkı | Bir ayda katıldığı toplantı günü |

    |---|---|---|---|

    | Ayşe | Bağımsız denetimde deneyimli kamu görevlisi | 4.800 TL | 5 |

    | Prof. Dr. Cem | 2547 sayılı Kanunun 38 inci maddesi uyarınca görevlendirilen öğretim elemanı | 5.600 TL (Kurum personelinin
    önerisi) | 3 |


    **III. Görev ve yetki dağılımı:** Aşağıdaki işlemlerin hangi organın görev ve yetkisinde olduğu tartışılmaktadır:


    | No | İşlem |

    |---|---|

    | 1 | Kurumun yıllık bütçesi ile mali tablolarının hazırlanması |

    | 2 | Hazırlanan bütçenin görüşülerek karara bağlanması |

    | 3 | Taşınmaz kiralanmasına ilişkin önerinin karara bağlanması |

    | 4 | Bakan tarafından atananlar dışındaki Kurum personelinin atanması |

    | 5 | Bağımsız denetim kapsamındaki işletmelerden bilgi sistemleri denetimine tabi olacakların belirlenmesi |


    **IV. Görevden ayrılan Kurul üyesi:** Kurul üyesi Mehmet Bey, 30.06.2026''da görevinden ayrılmıştır. Kendisine aşağıdaki
    iş teklifleri yapılmıştır:


    | No | Teklif |

    |---|---|

    | 1 | 15.03.2028''de özel bir bağımsız denetim kuruluşunda danışmanlık |

    | 2 | 15.03.2028''de Kurumun düzenleme alanı dışında kalan özel bir imalat şirketinde yöneticilik |

    | 3 | 03.07.2028''de özel bir bağımsız denetim kuruluşunda danışmanlık |


    **İstenenler:**


    (a) Faaliyet raporunun hazırlanması için kanuni son günü ve süre aşımını (gün olarak) bulunuz; raporun kimlere sunulacağını
    ve kamuoyuna ne zaman duyurulacağını belirtiniz. (5 puan)


    (b) Komisyonun kuruluşuna ve üye sayısına ilişkin kuralı açıklayınız; Ayşe ve Prof. Dr. Cem''e bu ay ödenebilecek en fazla
    huzur hakkını hesaplayınız ve hesabı gerekçelendiriniz. (7 puan)


    (c) III numaralı tablodaki her işlemin Kurulun mu, Başkanın mı görev ve yetkisinde olduğunu madde atfıyla belirtiniz.
    (6 puan)


    (d) IV numaralı tablodaki tekliflerden hangilerinin Mehmet Bey tarafından kabul edilebileceğini gerekçesiyle belirtiniz.
    (4 puan)

    '
  cozum: '**(a) Faaliyet raporu (5 puan)** — KHK md. 20


    - Kurum, faaliyetlerine ilişkin olarak **her yılın Mart ayı sonuna kadar**, bir önceki yıla ait kararların ve ikincil
    düzenlemelerin ekonomik ve sosyal etkilerini analiz eden ve performans hedefleri ile uygulama sonuçlarının karşılaştırılmasını
    içeren faaliyet raporu hazırlar (md. 20/2). 2025 yılı raporu için son gün **31.03.2026**''dır; rapor 14.04.2026''da hazırlandığından
    süre **14 gün** aşılmıştır.

    - Yıllık faaliyet raporu, mali tablolar ve bütçe kesin hesabı **Türkiye Büyük Millet Meclisine sunulur** (md. 20/3).

    - Yıllık faaliyet raporu, Sayıştayın mali denetim raporu ile Kurul kararları ve ikincil düzenlemeler, işlemler, araştırma
    ve soruşturmalar **her yılın Mayıs ayı sonunda** Kurumun internet sayfasında ve resmî bültenleriyle kamuoyunun bilgisine
    sunulur (md. 20/4).


    **(b) Komisyon ve huzur hakkı (7 puan)** — KHK md. 21/2, 21/3


    - Geçici çalışma ve danışma komisyonları **azami dokuzar kişiden** oluşur; 11 kişilik taslak md. 21/2''ye aykırıdır, en
    çok 9 kişi olmalıdır.

    - Toplantı günü başına huzur hakkı tavanı = 2.000 (gösterge) × 2,5 (memur aylık katsayısı) = **5.000 TL**. Ödeme **ayda
    dört günden fazla olmamak** üzere yapılır.

    - Ayşe: Kurulun belirlediği tutar (4.800 TL) tavanın altındadır. 5 toplantı günü katılmıştır, ancak en çok 4 gün ödenir:
    4 × 4.800 = **19.200 TL**.

    - Prof. Dr. Cem: Önerilen 5.600 TL tavanı aştığından en çok 5.000 TL ödenebilir. 3 gün katıldığından: 3 × 5.000 = **15.000
    TL**. Md. 2547/38 uyarınca görevlendirilenler, o maddede öngörülen ücretten ayrıca yararlandırılmaz.

    - Toplam en fazla ödenebilecek tutar: 19.200 + 15.000 = **34.200 TL**. Huzur hakkı damga vergisi hariç herhangi bir vergi
    ve kesintiye tabi tutulmaz.


    **(c) Görev ve yetki dağılımı (6 puan)**


    | No | Yetkili | Dayanak |

    |---|---|---|

    | 1 | **Başkan** | md. 12/1-ç (Kurulun belirlediği stratejilere uygun olarak yıllık bütçe ve mali tabloları hazırlamak)
    |

    | 2 | **Kurul** | md. 9/1-k (bütçeyi görüşmek ve karara bağlamak) |

    | 3 | **Kurul** | md. 9/1-m (taşınmaz alımı, satımı ve kiralanması önerilerini karara bağlamak) |

    | 4 | **Başkan** | md. 12/1-g (Bakan tarafından atananlar dışındaki Kurum personelini atamak) |

    | 5 | **Kurul** | md. 9/1-p (bilgi sistemleri denetimine tabi olacakları belirlemek) |


    **(d) Görevden ayrılma sonrası yasak (4 puan)** — KHK md. 6/3


    Kurul Başkan ve üyeleri, görevlerinden ayrılmalarını izleyen **iki yıl** içinde Kurumun denetlemekle ve düzenlemekle görevli
    olduğu sektör ve alandaki özel kuruluşlarda görev alamaz. Bu süre 30.06.2028''de dolar.


    - Teklif 1: 15.03.2028 süre içindedir ve bağımsız denetim sektörüdür → **kabul edemez**.

    - Teklif 2: Kurumun düzenleme ve denetleme alanı dışındadır → yasak kapsamında değildir, **kabul edebilir**.

    - Teklif 3: 03.07.2028 iki yıllık süre dolduktan sonradır → **kabul edebilir**.

    '
