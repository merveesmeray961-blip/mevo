- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: KGK
  kazanimlar:
  - Kurumca yapılan inceleme ve denetimlerin periyodu (KHK md. 25; BDY md. 38)
  - İkaz, uyarı, faaliyetin kısıtlanması, askıya alma ve iptal yaptırımları (BDY md. 39–43)
  - İdari para cezası ve savunma hakkı (KHK md. 26/3; BDY md. 39/2, 43/2)
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu (Kurum), iki bağımsız denetim kuruluşunu incelemektedir.


    - **Orion Bağımsız Denetim A.Ş. (Orion):** Kamu yararını ilgilendiren kuruluşları denetlemektedir. İlk denetim sözleşmesinin
    imza tarihi 10.09.2020''dir. Kurum, Orion hakkındaki ilk inceleme sonucunda Kurul kararını 14.11.2023''te almıştır.

    - **Vega Bağımsız Denetim A.Ş. (Vega):** Yalnızca kamu yararını ilgilendiren kuruluş niteliğinde olmayan işletmeleri denetlemektedir.
    İlk denetim sözleşmesinin imza tarihi 03.02.2022''dir; Vega hakkında bugüne kadar inceleme yapılmamıştır.


    2026 yılındaki inceleme sonucunda Orion hakkında aşağıdaki tespitler yapılmıştır. Bu tespitlerin her biri ayrı bir yaptırımın
    konusudur ve fiilin ağırlığı bakımından daha ağır veya daha hafif bir yaptırımı gerektiren başka bir unsur yoktur:


    | No | Tespit |

    |---|---|

    | 1 | Orion, bürosunun tanıtımı amacıyla gazetede ilan yayımlatmıştır. |

    | 2 | Sürekli eğitim yükümlülüğünü tamamlamamış bir denetçi, denetim ekibinde görevlendirilmiştir. |

    | 3 | Denetim ekibindeki denetçilerden ve denetime katılanlardan, bağımsızlık, tarafsızlık ve sır saklamaya ilişkin yazılı
    taahhüt alınmamıştır. |

    | 4 | Bir KAYİK denetiminde, Kurumun uygun görmediği bir kişi sorumlu denetçi olarak görevlendirilmiştir. |


    Kurul, 4 numaralı tespit nedeniyle Orion hakkında alınacak kararın yanında, Orion''un Kurulca alınan genel nitelikteki
    bir karara aykırı hareket etmesi nedeniyle ayrıca idari para cezası verilmesini de değerlendirmektedir. Orion''a savunma
    isteminin tebliğ tarihi 05.10.2026 Pazartesi''dir.


    Kurul, 4 numaralı tespit nedeniyle verdiği faaliyet izninin askıya alınması kararının kesinleştiği tarihi 10.12.2026 olarak
    belirlemiştir.


    **İstenenler:**


    (a) Orion ve Vega bakımından inceleme periyotlarını (yıl olarak) ve bu sürelerin hangi tarihten itibaren işleyeceğini
    belirtiniz. (5 puan)


    (b) 1–4 numaralı tespitlerin her biri için uygulanacak yaptırım türünü, ilgili Yönetmelik maddesiyle birlikte gösteriniz.
    (8 puan)


    (c) İdari para cezasının, tutar aralığının ve diğer yaptırımlarla ilişkisinin ne olduğunu açıklayınız; savunma için verilebilecek
    en kısa sürenin son gününü (gün adıyla) bulunuz. (6 puan)


    (d) 4 numaralı tespit nedeniyle verilen askıya alma kararının kesinleşmesinden sonra, Orion''un askıya alma gerektiren
    aynı fiili (i) 25.11.2028''de, (ii) 15.12.2028''de tekrar işlemesi hâllerinde karar ne olur? Askıya alma süresi içinde
    Orion''un yeni sözleşme yapıp yapamayacağını ve askı süresinin üst sınırını belirtiniz. (6 puan)

    '
  cozum: "**(a) İnceleme periyotları (5 puan)** — BDY md. 38/3; 660 sayılı KHK md. 25/1\n\n- **Orion** (KAYİK denetleyen):\
    \ asgari **üç yılda bir**. İzleyen incelemelerde süre, önceki incelemeye ilişkin Kurul kararını **takip eden takvim yılından\
    \ itibaren** yeniden başlar. Kurul kararı 14.11.2023 olduğundan yeni süre **01.01.2024**'ten itibaren işler.\n- **Vega**\
    \ (KAYİK dışı): asgari **altı yılda bir**. Henüz inceleme yapılmadığından süre **ilk denetim sözleşmesinin imza tarihinden\
    \ (03.02.2022)** itibaren işler.\n\n**(b) Yaptırım türleri (8 puan)**\n\n| No | Tespit | Yaptırım | Dayanak |\n|---|---|---|---|\n\
    | 1 | Reklam yasağına aykırılık | **Faaliyetin kısıtlanması** (iki yılı geçmemek üzere) | md. 23; md. 40/A-1-b |\n| 2\
    \ | Sürekli eğitimini tamamlamayanın denetim ekibinde görevlendirilmesi | **Uyarı** | md. 25/7; md. 40/1-ç |\n| 3 | Yazılı\
    \ taahhüdün alınmaması | **İkaz** | md. 21/2; md. 39/A-1-b |\n| 4 | Kurumca uygun görülmeyen sorumlu denetçi görevlendirilmesi\
    \ | **Faaliyet izninin askıya alınması** (iki yılı geçmemek üzere) | md. 28; md. 41/1-g |\n\n**(c) İdari para cezası ve\
    \ savunma (6 puan)**\n\n- Kurulun düzenlemelerine, standart ve formlara ve Kurulca alınan genel ve özel nitelikteki kararlara\
    \ aykırı hareket eden bağımsız denetim kuruluşlarına **10.000 TL'den 50.000 TL'ye kadar** idari para cezası verilir (KHK\
    \ md. 26/3; BDY md. 39/2). İdari para cezaları bütçeye gelir kaydedilir.\n- Birinci fıkradaki idari yaptırımlara (ikaz,\
    \ uyarı, kısıtlama, askıya alma, iptal) karar verilmiş olması, **ayrıca idari para cezasına karar verilmesine engel değildir**\
    \ (BDY md. 39/2; KHK md. 25/5). Dolayısıyla askıya alma ile para cezası birlikte uygulanabilir.\n- Savunma süresi **on\
    \ günden az olamaz** (md. 43/2). Tebliğ 05.10.2026 + 10 gün = **15.10.2026 Perşembe** (verilebilecek en kısa sürenin son\
    \ günü).\n\n**(d) Tekerrür, askı süresi ve yeni sözleşme (6 puan)** — BDY md. 41, 42/1-a, 43/8\n\n- Faaliyet izninin askıya\
    \ alınmasını gerektiren fiilin, yaptırımın **kesinleşmesinden itibaren iki yıl içinde tekerrürü** hâlinde izin **süresiz\
    \ olarak iptal edilir** (md. 42/1-a). Kesinleşme tarihi 10.12.2026 olduğundan iki yıllık süre 10.12.2028'de dolar.\n \
