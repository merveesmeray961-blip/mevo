      A: 66, B Grubunun beşinci payıdır (330/5); eşik bu pay olsaydı 15 üyelik gerekirdi, oysa 14 üyelik vardır.
      B: 74 oy, eşik olan 74,29'un altında kalır; kesirli payı yuvarlayarak 74 almak A Grubunun yedinci payını yerinde bırakır
