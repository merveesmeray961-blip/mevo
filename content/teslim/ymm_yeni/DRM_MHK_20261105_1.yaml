      21). Grupların oyları 1, 2, 3… sayılarına bölünür; bağımsız adayların oyları bölünmez ve tüm paylar büyükten küçüğe
      sıralanır (md. 40). A, B, C, D gruplarının payları sıralandığında 14. pay A''nın yedinci payı olan 520/7 = 74,29''dur
      (sıra: 520; 330; 260; 190; 173,3; 165; 130; 110; 104; 95; 90; 86,7; 82,5; 74,29). Y''nin 14. sıraya girebilmesi için
      payı 74,29''dan büyük olmalıdır; 74 oy yetmez, 75 oy yeterlidir (A''nın yedinci payı dışarıda kalır). Püf noktaları:
      (1) Önce üyelik sayısını (14) üye sayısı kademesinden bulun. (2) Bağımsız adayın oyu bölünmez, doğrudan tek pay olarak
      yarışır. (3) Z''nin 45 oyu sonucu etkilemez.'
