  - olcut: (a) 1. toplantıda toplanamama, 2. toplantıda kararın alınması, 3. toplantıda alınamaması
    puan: 3
  - olcut: (a) Hısımlık derecelerinin (2. derece kayın, 3. derece kan) değerlendirilerek katılamama dayanağının açıklanması
    puan: 2
