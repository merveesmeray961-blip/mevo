- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: MHK
  kazanimlar:
  - Oda organ seçimlerinin yargı gözetiminde yapılması, liste ve zaman kuralları
  - Gruplara ve bağımsız adaylara üyelik dağıtımı (bölme yöntemi)
  - Seçime itiraz, seçimin iptali ve yenilenmesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Yeşilvadi Yeminli Mali Müşavirler Odası''nın kayıtlı üye sayısı 920''dir. Oda, üç yılda bir yapılan olağan
    genel kurulunu 9 Mayıs 2026 Cumartesi günü toplamaya karar vermiştir; organ seçimleri yargı gözetiminde yapılacaktır.
    Yönetim Kurulu seçimine üç grup ile bir bağımsız aday katılmış ve geçerli oylar aşağıdaki gibi çıkmıştır:


    | Liste | Geçerli oy |

    |---|---|

    | Yeşil Liste | 410 |

    | Mavi Liste | 255 |

    | Turuncu Liste | 150 |

    | Bağımsız aday Selin Öz | 95 |


    Seçim sonuçlarına ilişkin tutanaklar 10 Mayıs 2026 Pazar günü saat 19.00''da düzenlenmiştir. Bağımsız aday Selin Öz, seçimde
    usulsüzlük yapıldığını ileri sürerek 11 Mayıs 2026 Pazartesi günü sonuçlara itiraz etmiştir; hâkim itirazı aynı gün incelemiş,
    usulsüzlüğün seçim sonuçlarını etkileyecek ölçüde olduğuna kanaat getirerek seçimin iptaline karar vermiştir. Ayrıca Yeşil
    Liste''nin Yönetim Kurulu adayı Cem Aras''ın aynı seçimde Disiplin Kurulu için de aday olduğu, kurul üyelikleri ile Birlik
    Genel Kurulu temsilcilikleri için kullanılan oy pusulalarından birinin ise mühürsüz çıktığı görülmüştür.


    **İstenenler:**


    (a) Seçime katılacak üyeleri gösteren listenin ilçe seçim kurulu başkanına en geç hangi tarihte (haftanın günüyle) tevdi
    edilmesi gerektiğini bulunuz; genel kurul görüşmelerinin ve seçimin hangi gün ve saatlerde yapılmasının zorunlu olduğunu
    belirtiniz. (6 puan)


    (b) Yönetim Kurulu asıl ve yedek üyeliklerinin sayısını belirleyerek bu üyeliklerin listelere ve bağımsız adaya dağılımını
    hesabınızı göstererek bulunuz. (8 puan)


    (c) Cem Aras''ın aynı dönemde hem Yönetim Kurulunda hem Disiplin Kurulunda görev alıp alamayacağını; mühürsüz oy pusulasının
    akıbetini; kurul üyelikleri ile Birlik Genel Kurulu temsilcilikleri için oy pusulalarının nasıl düzenleneceğini açıklayınız.
    (5 puan)


    (d) Selin Öz''ün itirazının süresinde olup olmadığını (son günü göstererek) ve hâkimin itiraz üzerindeki yetkisini açıklayınız;
    iptal kararı hâlinde seçimin yenilenebileceği Pazar günlerini bulunuz, yenilenen seçimde nelerin yapılacağını ve kullanılan
    oyların ne kadar süreyle nerede saklanacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Liste, zaman ve gün kuralı (6 puan)**


    - Liste, toplantı gündemi, yeri, günü, saati ile çoğunluk olmadığı takdirde yapılacak ikinci toplantıya ilişkin hususları
    belirten yazıyla birlikte, seçim yapılacak Genel Kurul toplantısından **en az 15 gün önce**, üç nüsha olarak o yerin ilçe
    seçim kurulu başkanına tevdi edilir (3568 s. K. md. 40/2).

    - Genel Kurul 9 Mayıs 2026 Cumartesi günü olduğuna göre son gün: 9 Mayıs − 15 gün = **24 Nisan 2026 Cuma**.

    - Toplantı tarihleri, görüşmelerin **bir cumartesi günü akşamına kadar sonuçlanmasını** ve seçimlerin **ertesi günü olan
    pazar gününün 09.00–17.00 saatleri arasında** yapılmasını sağlayacak biçimde düzenlenir (9 Mayıs Cumartesi görüşmeler;
    10 Mayıs Pazar seçim).


    **(b) Üyelik sayısı ve dağılım (8 puan)**


    - Üye sayısı 920 olduğundan (binin altı) Yönetim Kurulu **5 asıl + 5 yedek = 10 üyelikten** oluşur (md. 21/1).

    - Grupların oyları önce 1''e, sonra 2''ye, 3''e… bölünür; bağımsız adayın oyu bölünmeden tek pay olarak yer alır; paylar
    ayrım yapılmaksızın büyükten küçüğe sıralanır ve yedekler dahil 10 üyelik tahsis edilir (md. 40).


    | Bölen | Yeşil | Mavi | Turuncu | Selin Öz |

    |---|---|---|---|---|

    | 1 | 410 | 255 | 150 | 95 |

    | 2 | 205 | 127,5 | 75 | – |

    | 3 | 136,67 | 85 | 50 | – |

    | 4 | 102,5 | 63,75 | – | – |

    | 5 | 82 | – | – | – |


    Büyükten küçüğe ilk 10 pay: 410, 255, 205, 150, 136,67, 127,5, 102,5, 95, 85, 82.


    | Liste | Alınan üyelik |

    |---|---|

    | Yeşil Liste | 5 (410; 205; 136,67; 102,5; 82) |

    | Mavi Liste | 3 (255; 127,5; 85) |

    | Turuncu Liste | 1 (150) |

    | Selin Öz (bağımsız) | 1 (95) |

    | **Toplam** | **10** |


    Bir sonraki pay 75 (Turuncu/2) olup 10. paydan (82) küçüktür; bu nedenle dağılım kesindir.


    **(c) Tek görev, mühürsüz pusula, pusulalar (5 puan)**


    - Üyeler, oda veya birlik yönetim, denetleme ve disiplin kurullarından **yalnızca birinde** görev alabilirler; Cem Aras
    aynı dönemde hem Yönetim hem Disiplin Kurulunda görev alamaz.

    - Mühürsüz oy pusulası ve zarfla kullanılan oylar **geçersiz sayılır**.

    - Kurul üyelikleri ile Birlik Genel Kurulu temsilcilikleri için **ayrı oy pusulaları** oluşturulur.


    **(d) İtiraz, iptal ve yenileme (6 puan)**


    - Seçim sonuçlarına itiraz, tutanakların düzenlenmesinden itibaren **iki gün** içinde yapılır: 10 Mayıs + 2 gün = **12
    Mayıs 2026 Salı** son gün; 11 Mayıs''taki itiraz süresindedir.

    - Hâkim itirazı **aynı gün inceler ve kesin olarak karara bağlar** (karar aynı gün: 11 Mayıs 2026).

    - Hâkim, usulsüzlüğün sonuçları etkilediği kanaatiyle seçimi iptal ederse, **süresi bir aydan az ve iki aydan fazla olmamak
    üzere** seçimin yenileneceği pazar gününü belirler. İptal tarihi 11 Mayıs 2026 olduğundan aralık 11 Haziran – 11 Temmuz
    2026''dır; bu aralıktaki Pazar günleri: **14, 21, 28 Haziran ve 5 Temmuz 2026** (12 Temmuz iki aydan fazladır).

    - Belirlenen günde **yalnız seçim yapılır**; seçim işlemleri 3568 sayılı Kanun md. 40 ve diğer hükümlere uygun yürütülür.

    - Kullanılan oylar ve diğer belgeler, tutanağın bir örneğiyle birlikte **üç ay** süreyle saklanmak üzere ilçe seçim kurulu
    başkanlığına tevdi edilir. Seçim giderleri ilgili oda bütçesinden karşılanır.

    '
  puanlama:
  - olcut: (a) Listenin tevdi tarihinin (24 Nisan 2026 Cuma) bulunması ve görüşme/seçim gün-saat kuralının belirtilmesi
