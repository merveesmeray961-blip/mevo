  soru: '**Olay:** Bağımsız denetçi Selma Orhan, payları borsada işlem görmeyen ve 6102 sayılı TTK uyarınca bağımsız denetime
    tabi Hazar Kimya Sanayi A.Ş.''nin 31.12.2025 tarihli finansal tablolarını denetlemiştir. Finansal tablolar, geçerli finansal
    raporlama çerçevesi olan TMS''ye göre hazırlanmıştır. Denetçinin belirlediği önemlilik tutarı 1.000.000 TL''dir. Vergi
    etkileri dikkate alınmayacaktır. Dönemin sonrasına ilişkin gelişmeler şöyledir:


    | Tarih | Gelişme |

    |---|---|

    | 18.02.2026 | Şirketin bir müşterisi hakkında iflas kararı verilmiştir. Bilanço tarihindeki 4.800.000 TL tutarlı ticari
    alacak için yönetim 3.600.000 TL değer düşüklüğü karşılığı ayırmıştır. Taraflar, olayın düzeltme gerektiren bir olay olduğu
    ve doğru yansıtıldığı konusunda mutabıktır. |

    | 28.02.2026 | Şirketin depolarından birinde yangın çıkmıştır. Olay bilanço tarihinde mevcut bir durumu göstermemektedir;
    finansal tablolara düzeltme yapılmamış, olay 31 numaralı dipnotta açıklanmıştır. Denetçi, açıklamanın yeterli olduğu sonucuna
    varmış ve olayın kullanıcıların finansal tabloları anlaması açısından temel teşkil edecek derecede önemli olduğuna karar
    vermiştir; olay kilit denetim konusu olarak belirlenmemiştir. |

    | 10.03.2026 | Yönetim finansal tabloları onaylamıştır. Onaylanan tablolarda dönem net kârı 6.000.000 TL''dir. |

    | 12.03.2026 | Denetçi raporu (olumlu görüş) imzalanmış ve aynı gün şirkete sunulmuştur. |

    | 26.03.2026 | Denetçi, hukuk müşavirinin yazısından, 4.03.2026 tarihinde Şirket aleyhine 1.500.000 TL tazminata hükmeden
    bir ilk derece mahkemesi kararı verildiğini öğrenmiştir. Dava 2024 yılında açılmış olup finansal tablolarda bu dava için
    herhangi bir karşılık ayrılmamıştır. Taraflar, kararın düzeltme gerektiren bir olay olduğu ve 1.500.000 TL karşılığın
    ayrılması gerektiği konusunda mutabıktır. Yönetim konuyu denetçiye bildirmemiştir. |

    | 03.04.2026 | Finansal tabloların ve denetçi raporunun yayımlanması planlanan tarihtir (henüz yayımlanmamıştır). |


    **İstenenler:**


    (a) Denetçinin 12.03.2026 tarihli raporu vermeden önce BDS 560 uyarınca hangi dönemi kapsayacak prosedürleri uygulaması,
    bu prosedürlere hangilerinin dâhil olduğunu, daha önce ikna edici sonuç aldığı konularda ilave prosedür gerekip gerekmediğini
    ve yönetimden hangi belgeyi talep etmesi gerektiğini açıklayınız. (6 puan)


    (b) 26.03.2026 tarihinde öğrenilen durum karşısında, finansal tabloların henüz yayımlanmadığı da dikkate alınarak denetçinin
    yapması gereken işlemleri sıralayınız; denetçinin 12.03.2026''dan sonra herhangi bir prosedür uygulama yükümlülüğünün
    bulunup bulunmadığını belirtiniz. Yönetimin 1.500.000 TL karşılık ayırarak finansal tabloları değiştirdiğini ve 30.03.2026''da
    yeniden onayladığını varsayarak düzeltilmiş dönem net kârını, düzeltmenin önemlilik tutarını ne kadar aştığını ve net
    kârı yüzde kaç azalttığını hesaplayınız; denetçinin değişikliğe ilişkin yapacaklarını ve yeni denetçi raporuna verilebilecek
    en erken tarihi belirtiniz. (6 puan)


    (c) (b) bendindeki durumda mevzuatın değiştirilmiş finansal tabloların yayımlanmasını zorunlu tutmadığını ve yönetimin
    finansal tablolarda değişiklik yapmayı reddettiğini varsayarak, rapor 12.03.2026''da şirkete sunulmuş olduğuna göre denetçinin
    yapacaklarını; raporun henüz şirkete sunulmamış olması durumunda ne yapacağını açıklayınız. Ayrıca aynı durumun finansal
    tablolar 03.04.2026''da yayımlandıktan sonra öğrenilmesi ve yönetimin tabloları değiştirmesi hâlinde denetçinin yapacaklarını
    ve yeni raporunda yer vereceği paragrafı belirtiniz. (7 puan)


    (d) 28.02.2026 tarihli yangın olayına ilişkin olarak BDS 706 uyarınca denetçi raporuna Dikkat Çekilen Hususlar paragrafı
    eklenebilmesi için aranan koşulları ve bu paragrafın şekil ve içeriğine ilişkin hükümleri açıklayınız. (6 puan)

    '
  cozum: '**(a) Olay sonrası prosedürler (6 puan)**


    - Denetçi, finansal tabloların tarihi (31.12.2025) ile denetçi raporu tarihi (12.03.2026) arasında gerçekleşen ve düzeltme
    veya açıklama gerektiren tüm olayların belirlendiğine dair yeterli ve uygun kanıt elde etmek üzere prosedür uygular (BDS
    560 par. 6). Prosedürler bu iki tarih arasındaki dönemi veya raporun tarihine olabildiğince yakın tarihe kadar olan dönemi
    kapsar; niteliği ve kapsamı denetçinin risk değerlendirmesine göre belirlenir (par. 7).

    - Prosedürler şunları içerir (par. 7): (i) yönetimin olay sonrası olayları belirlemek için oluşturduğu prosedürlerin anlaşılması,
    (ii) yönetimin ve uygun hâllerde üst yönetimden sorumlu olanların bilanço tarihinden sonra finansal tabloları etkileyebilecek
    olay olup olmadığı hakkında sorgulanması, (iii) varsa ortakların/yönetimin/üst yönetimden sorumlu olanların bilanço tarihinden
    sonraki toplantı tutanaklarının okunması ve tutanağı henüz hazırlanmamış konuların sorgulanması, (iv) varsa en son ara
    dönem finansal tabloların okunması.

    - Daha önce uyguladığı prosedürlerin ikna edici sonuç sağladığı konularda ilave prosedür uygulaması beklenmez (par. 6).

    - Belirlenen her olayın (18.02.2026 iflas, 28.02.2026 yangın) finansal raporlama çerçevesine uygun yansıtılıp yansıtılmadığına
    karar verir (par. 8); ayrıca düzeltme veya açıklama gerektiren tüm olayların düzeltildiğine/açıklandığına ilişkin yönetimden
    ve uygun hâllerde üst yönetimden sorumlu olanlardan **yazılı beyan** talep eder (par. 9).


    **(b) Rapor tarihinden sonra haberdar olunan durum (6 puan)**


    - Denetçinin rapor tarihinden (12.03.2026) sonra finansal tablolarla ilgili herhangi bir prosedür uygulama yükümlülüğü
    yoktur (par. 10). Ancak rapor tarihinde bilseydi raporunu değiştirmesine sebep olabilecek bir durumdan yayımdan önce haberdar
    olduğundan (26.03.2026): (1) konuyu yönetimle ve uygun hâllerde üst yönetimden sorumlu olanlarla müzakere eder, (2) finansal
    tablolarda değişiklik yapılmasının gerekli olup olmadığına karar verir, (3) değişiklik gerekliyse yönetimin konuyu nasıl
    ele almayı planladığını sorgular (par. 10).

    - Hesap:


    | Kalem | Tutar (TL) |

    |---|---|

    | Onaylanan dönem net kârı | 6.000.000 |

    | Dava karşılığı | (1.500.000) |

    | **Düzeltilmiş dönem net kârı** | **4.500.000** |

    | Düzeltme tutarı − önemlilik (1.500.000 − 1.000.000) | 500.000 |

    | Net kârdaki azalış (1.500.000 / 6.000.000) | %25 |


    Düzeltme önemlilik tutarını 500.000 TL aşmaktadır; bu nedenle yanlışlık önemlidir ve tabloların değiştirilmesi gerekir.

    - Yönetim tabloları değiştirdiğinde denetçi, değişikliğe ilişkin gerekli denetim prosedürlerini uygular; 6 ve 7 nci paragraflardaki
    prosedürleri yeni denetçi raporunun tarihine kadar olan süreyi kapsayacak şekilde genişletir ve değiştirilmiş tablolara
    ilişkin yeni bir denetçi raporu sunar (par. 11). Yeni rapora, değiştirilmiş finansal tabloların onaylandığı tarihten (30.03.2026)
    önceki bir tarih verilemez; en erken tarih **30.03.2026**''dır (par. 11).


    **(c) Yönetimin değişiklik yapmaması ve yayım sonrası (7 puan)**


    - Mevzuat değiştirilmiş tabloların yayımlanmasını zorunlu tutmadığından denetçinin yeni/değiştirilmiş rapor sunması gerekmez
    (par. 13); ancak değişiklik gerekli olduğu hâlde yönetim yapmıyorsa: rapor şirkete sunulmuş olduğundan denetçi, gerekli
    değişiklikler yapılmadan tabloları yayımlamamaları hususunda yönetime ve (üst yönetimden sorumlu olanların tamamı icrai
    görevde değilse) üst yönetimden sorumlu olanlara bildirimde bulunur. Buna rağmen tablolar değiştirilmeden yayımlanırsa
    denetçi, denetçi raporuna güvenilmesini engellemeye yönelik uygun adımları atar (par. 13(b)).

    - Rapor henüz sunulmamış olsaydı, BDS 705 uyarınca olumlu görüş dışında bir görüş verir ve raporunu ondan sonra sunardı
    (par. 13(a)).

    - Tablolar yayımlandıktan sonra haberdar olunursa denetçinin finansal tablolarla ilgili prosedür uygulama yükümlülüğü
    yoktur; ancak yine konuyu müzakere eder, değişiklik gerekliliğine karar verir ve gerekliyse yönetimin planını sorgular
    (par. 14). Yönetim tabloları değiştirirse denetçi, değişikliğe ilişkin gerekli prosedürleri uygular ve daha önce yayımlanan
    tablolar ile raporun ulaştığı kişilerin değişiklikten haberdar edilmesi için yönetimce alınan tedbirleri gözden geçirir
    (par. 15).

    - Yeni veya değiştirilmiş raporda Dikkat Çekilen Hususlar veya Diğer Hususlar paragrafına yer verir; bu paragrafta, tabloların
    değiştirilme nedenini kapsamlı açıklayan finansal tablo dipnotuna ve denetçinin önceki raporuna atıfta bulunur (par. 16).


    **(d) BDS 706 – Dikkat Çekilen Hususlar paragrafı (6 puan)**


    - Koşullar (par. 8): hususun finansal tablolarda sunulmuş/açıklanmış ve kullanıcıların tabloları anlaması açısından temel
    teşkil edecek derecede önemli olduğu kanaatinde olması; (a) hususun olumlu görüş dışında görüş verilmesini gerektirmemesi
    ve (b) BDS 701''in uygulandığı durumda hususun kilit denetim konusu olarak bildirilmemiş olması. Yangın dipnotta yeterli
    açıklanmış (görüş değişikliği gerekmez) ve kilit denetim konusu değildir; koşullar sağlanmaktadır.

    - Şekil ve içerik (par. 9): paragraf, "Dikkat Çekilen Hususlar" ifadesini içeren başlık altında ayrı bir bölüm olarak
    yer alır; dikkat çekilen hususa ve bunu tam açıklayan dipnota (31 numaralı dipnot) açıkça atıfta bulunur; yalnızca finansal
    tablolarda sunulan veya açıklanan bilgilere atıfta bulunur (denetçi tabloda olmayan bilgi, örneğin sigorta tazminatı tahmini,
    ekleyemez); dikkat çekilen hususun denetçi görüşünü değiştirmediğini belirtir.

    '
