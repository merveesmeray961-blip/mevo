      imkân veren ticari kayıtları düzenli bir şekilde tutma yeterliliğine sahip bulunmak, c) Müsteşarlıkça gerek görülen
      hallerde, mali yeterliliğe sahip olduğunu kanıtlamak, d) Uygun emniyet ve güvenlik standartlarına sahip bulunmak.
