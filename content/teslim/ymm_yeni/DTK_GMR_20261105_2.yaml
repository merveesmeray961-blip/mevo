      düzenli ticari kayıt tutma yeterliliği, gerekli hâllerde mali yeterlilik ve uygun emniyet-güvenlik standartları. Belirli
      bir ihracat işlemi yapılmış olması şartı Kanun''da yer almaz.'
    celdiriciler:
      A: Md. 5/A-2(b) bu şartı açıkça sayar.
      B: Md. 5/A-2(d) bu şartı açıkça sayar.
      C: Md. 5/A-2(c) bu şartı açıkça sayar.
      E: Md. 5/A-2(a) bu şartı açıkça sayar.
