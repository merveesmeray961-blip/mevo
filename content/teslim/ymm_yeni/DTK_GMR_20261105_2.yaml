    C: Müsteşarlıkça gerek görülen hâllerde mali yeterliliğe sahip olduğunu kanıtlamak
    D: Son üç takvim yılında Türkiye'den en az bir ihracat işlemi gerçekleştirmiş olmak
    E: 4. maddede belirtilen sorumlulukların yerine getirilmesinde ciddi ihlallerde bulunmamak
  dogru: D
