- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: antrepodaki eşya için işlem tayini (md. 70)
  tip: kavrama
  zorluk: 3
  kok: Genel antrepoda bulunan serbest dolaşımda olmayan eşya için, (S) A.Ş. 20/10/2026 tarihinde serbest dolaşıma giriş yönünde
    gümrükçe onaylanmış bir işlem tayin edilmesine ilişkin beyanname vermiş ve beyanname aynı tarihte tescil edilmiştir. Şirket,
    gerekli belgeleri tamamlamamıştır. 4458 sayılı Kanun'un 70. maddesine göre, gümrük işlemlerinin tamamlanma süresi ve süre
    içinde tamamlanamamasının sonucu bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Süre, özet beyan tarihinden itibaren denizyolunda 45 gündür; tamamlanamayan eşya doğrudan serbest dolaşıma girmiş sayılır
      ve vergileri ek tahakkukla alınır.
    B: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa idare antrepo rejimini ek süre vermeden otomatik olarak
      uzatır ve eşya antrepoda kalır.
    C: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa eşya muayene edilir, durum tutanağa bağlanır ve eşya tasfiye
      hükümlerine göre tasfiye edilir.
    D: Süre, tescil tarihinden itibaren yirmi gündür; tamamlanamazsa yalnız idari para cezası uygulanır ve eşya yeniden antrepoya
      alınır.
    E: Süre, tescil tarihinden itibaren otuz gündür; tamamlanamazsa eşya muayene edilmeksizin imha edilir ve masraflar tahsil
      edilmez.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 70/2''ye göre gümrük antrepolarında bulunan eşya için gümrükçe onaylanmış işlem veya kullanım tayin
      edilmesine ilişkin beyanname verilirse işlemlerin beyannamenin tescil tarihinden itibaren otuz gün içinde bitirilmesi
      gerekir; bitirilemeyen eşya hakkında md. 70/1 uygulanır: eşya muayene edilir, tespitler tutanağa bağlanır ve eşya 177-180.
      maddelere göre tasfiye edilir. Püf noktaları: md. 46''daki 45/20 günlük özet beyan süreleri antrepodaki eşya için geçerli
      değildir; antrepo için süre tescil tarihinden başlayan otuz gündür. Süre dolması eşyayı kendiliğinden serbest dolaşıma
      sokmaz.'
    celdiriciler:
      A: Antrepodaki eşya için süre, beyannamenin tescil tarihinden itibaren otuz gündür; süre sonunda eşya kendiliğinden
        serbest dolaşıma girmiş sayılmaz.
      B: Süre içinde bitirilemeyen eşyaya md. 70/1 uygulanır; muayene, tutanak ve tasfiye söz konusudur.
      D: Süre yirmi gün değil otuz gündür; sonuç yalnız para cezası olmayıp muayene, tutanak ve tasfiyedir.
      E: Md. 70/1 muayene edilmesini ve eşyanın tasfiye hükümlerine göre tasfiyesini öngörür; imha ve masraf konusu bu değildir.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 70/2
    alinti: Gümrük antrepolarında bulunan eşya için, gümrükçe onaylanmış bir işlem veya kullanım tayin edilmesine ilişkin
      beyanneme verilmesi halinde, gümrük işlemlerinin beyannamenin tescil tarihinden itibaren otuz gün içinde bitirilmesi
      gerekir. Bu süre içinde işlemleri bitirilemeyen eşya ile ilgili olarak 1 inci fıkra hükümleri uygulanır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 70/1
    alinti: Hallerinde, eşya muayene edilir. Muayene sonucunda gümrük idarelerince alınacak para cezasını veya diğer takipleri
      gerektiren veya gerektirmeyen durumlar bir tutanağa bağlanır ve daha sonra eşya 177 ile 180 inci madde hükümlerine göre
      tasfiye edilir.
  gecerlilik:
    baslangic: '2009-07-07'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim: &id001
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: gümrük vergisi oranının tescilden sonra indirilmesi (md. 75)
  tip: hesaplama
  zorluk: 3
  kok: '(N) A.Ş.''nin serbest dolaşıma giriş beyannamesi 7/8/2026''da tescil edilmiş; beyannameye üç kalem eşya girmiştir.
    Gümrük vergileri 18/8/2026''da ödenmiştir. Gümrük işlemleri, idarece yaptırılan laboratuvar tahlilinin gecikmesi nedeniyle
    uzamıştır; beyan sahibinden kaynaklanan bir gecikme yoktur. Veriler şöyledir:


    | Kalem | Gümrük kıymeti | Tescil tarihindeki yük | 14/8/2026''da Cumhurbaşkanı Kararıyla yapılan değişiklik |

    |---|---|---|---|

    | 1 (sanayi malı) | 1.000.000 TL | %10 gümrük vergisi | %5''e indirilmiştir |

    | 2 (tarım ürünü) | 1.000.000 TL | 100.000 TL tarımsal mali yük | 60.000 TL''ye indirilmiştir |

    | 3 (sanayi malı) | 1.000.000 TL | %8 gümrük vergisi | Değişiklik yoktur |


    (N) A.Ş. 4458 sayılı Kanun''un 75. maddesi uyarınca lehine olan oranın uygulanmasını istemiştir. Başka vergi dikkate alınmayacağına
    göre ödenecek toplam gümrük vergisi ve tarımsal mali yük tutarı kaç TL''dir?'
  secenekler:
    A: 130.000 TL
    B: 180.000 TL
    C: 190.000 TL
    D: 230.000 TL
    E: 280.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Md. 75/1''e göre beyan sahibi, tarımsal mali yükler dışında kalan ithalat vergilerinin oranlarının beyannamenin
      tescilinden sonra, fakat vergilerin ödenmesinden veya teminata bağlanmasından önce indirilmesi hâlinde lehine olan oranın
      uygulanmasını isteyebilir. Tescil 7/8, indirim 14/8, ödeme 18/8 olduğundan 1. kalem için %5 uygulanır. 2. kalemdeki
      indirim tarımsal mali yüke ilişkin olduğundan kapsam dışıdır; 100.000 TL alınır. Md. 75/2''nin (beyan sahibinden kaynaklanan
      gecikme) engeli yoktur. Püf noktaları: indirimin tescilden SONRA, ödemeden ÖNCE gelmesi gerekir; tarımsal mali yükler
      bu haktan yararlanamaz; kalemleri tek tek hesaplayın.'
    celdiriciler:
      A: A kalemine indirimli oran uygulanmış; B kalemindeki tarımsal mali yük hiç alınmamış sayılmıştır. Oysa indirim hakkı
        tarımsal mali yükler için tanınmamıştır, B kalemi tam yükle vergilendirilir.
      B: Oran indiriminden yararlanılmamış ve B kalemindeki tarımsal mali yük hiç hesaba katılmamıştır; iki hata birlikte
        yapılmıştır.
      C: İndirimli oran A kalemine uygulanmış, ancak B kalemindeki tarımsal mali yükün indirimi de uygulanmıştır; md. 75/1
        tarımsal mali yükleri kapsam dışı tutar.
      E: Beyan sahibi talep etmesine ve koşullar gerçekleşmesine rağmen oran indirimi uygulanmamıştır.
    hesap_adimlari:
    - '1. kalem: 1.000.000 × %5 = 50.000 TL (indirimli oran uygulanır)'
    - '2. kalem: tarımsal mali yük = 100.000 TL (indirim kapsam dışı)'
    - '3. kalem: 1.000.000 × %8 = 80.000 TL'
    - Toplam = 50.000 + 100.000 + 80.000 = 230.000 TL
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 75/1
    alinti: Beyan sahibi, tarımsal mali yükler dışında kalan ithalat vergilerinin oranlarının serbest dolaşıma giriş beyannamesinin
      tescil tarihinden sonra, fakat eşyaya ilişkin gümrük vergilerinin ödenmesinden veya teminata bağlanmasından önce indirilmesi
      halinde, lehine olan oranın uygulanmasını isteyebilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 75/2
    alinti: Beyan sahibinden kaynaklanan nedenlerle gümrük işlemlerinin tamamlanamaması halinde, 1 inci fıkra hükmü uygulanmaz.
  gecerlilik:
    baslangic: '2009-07-07'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim: *id001
  dogrulama:
    python: 'k1 = 1000000 * 5 // 100

      k2 = 100000

      k3 = 1000000 * 8 // 100

      sonuc = k1 + k2 + k3

      '
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük mevzuatı temelleri
  konu: GMR
  kazanim: farklı tarife pozisyonlu eşyada en yüksek vergi oranının uygulanması (md. 76)
  tip: hesaplama
  zorluk: 3
  kok: '(L) A.Ş.''nin tek bir taşıma belgesi kapsamında gelen ve serbest dolaşıma giriş beyannamesi ile beyan edilen eşyası
    üç farklı tarife pozisyonuna girmektedir:


    | Kalem | Gümrük kıymeti | Gümrük vergisi oranı |

    |---|---|---|

    | 1 | 1.000.000 TL | %5 |

    | 2 | 1.400.000 TL | %10 |

    | 3 | 600.000 TL | %20 |


    Her eşyaya kendi pozisyonuna göre işlem yapılması ek iş yükü ve masrafa yol açacağından (L) A.Ş. 4458 sayılı Kanun''un
    76. maddesine göre talepte bulunmuş, gümrük idaresi de talebi kabul etmiştir. Başka vergi dikkate alınmayacağına göre
    ödenecek gümrük vergisi kaç TL''dir?'
  secenekler:
    A: 150.000 TL
    B: 300.000 TL
    C: 310.000 TL
    D: 350.000 TL
    E: 600.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'Md. 76''ya göre bir taşıma belgesi içeriği eşya değişik tarife pozisyonlarına girdiğinde ve her eşya için
      ayrı işlem yapılması ek iş yükü ve masrafa yol açtığında, beyan sahibinin talebi üzerine idare eşyanın tamamına en yüksek
      ithalat vergi oranına tabi eşyanın tarife pozisyonuna göre vergi uygulayabilir. Toplam kıymet 3.000.000 TL, en yüksek
      oran %20 olduğundan vergi 600.000 TL''dir. Püf noktaları: ortalama oran ya da en yüksek kıymetli kalemin oranı değil,
      EN YÜKSEK ORAN esas alınır; kalem bazlı 310.000 TL normal hesaptır.'
    celdiriciler:
      A: Taşıma belgesindeki en düşük oran (%5) tüm eşyaya uygulanmıştır; md. 76 en yüksek oranı esas alır.
      B: En yüksek kıymetli kalemin oranı (%10) tüm eşyaya uygulanmıştır; esas alınacak olan en yüksek vergi oranlı eşyanın
        pozisyonudur.
      C: Kalemler kendi pozisyonlarına göre ayrı ayrı vergilendirilmiştir; bu, talep yapılmadığında geçerli normal hesaptır.
      D: Üç oranın basit ortalaması (%11,67) alınmıştır; Kanun ortalama değil en yüksek oranı esas alır.
    hesap_adimlari:
    - Toplam kıymet = 1.000.000 + 1.400.000 + 600.000 = 3.000.000 TL
    - En yüksek oran = %20
    - Vergi = 3.000.000 × %20 = 600.000 TL
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 76
    alinti: Bir taşıma belgesi içeriği eşyanın değişik tarife pozisyonlarına girdiği hallerde; her bir eşya için kendi tarife
      pozisyonuna göre işlem yapılmasının ek bir iş yükü ve masrafa sebep olması halinde, beyan sahibinin talebi üzerine,
      gümrük idareleri, eşyanın tamamına en yüksek ithalat vergi oranına tabi eşyanın tarife pozisyonuna göre vergi uygulayabilirler.
  gecerlilik:
    baslangic: '2009-07-07'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim: *id001
  dogrulama:
    python: 'toplam = 1000000 + 1400000 + 600000

      sonuc = toplam * 20 // 100

      '
