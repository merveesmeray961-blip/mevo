  soru: '(Ç) Halı Sanayi A.Ş. (Türkiye''de yerleşik ihracatçı), 2026 yılında gerçekleştirdiği ihracatlarda bedelleri banka
    aracılığıyla tahsil etmektedir. Aşağıdaki gümrük beyannamelerine (GB) ilişkin ihracat hesapları, bedel getirme süreleri
    dolduğu hâlde noksan bedelle açık kalmıştır:


    | GB | Beyanname bedeli (USD) | Yurda getirilen bedel (USD) | Ek bilgi |

    |---|---|---|---|

    | GB-1 | 80.000 | 56.000 | Başka bilgi yoktur. |

    | GB-2 | 600.000 | 548.000 | Bankaca ihracat bedelinden mahsubu uygun bulunan faktoring masrafı 4.000 USD ve ardiye masrafı
    3.000 USD vardır. |

    | GB-3 | 1.500.000 | 1.380.000 | Fiili ihraç tarihi 04.02.2026''dır (Çarşamba). Bedel hâlâ getirilmemiş, hesap kapatılmamıştır.
    |

    | GB-4 | 900.000 | 640.000 | Alıcı firma 20.05.2026''da konkordato ilan etmiştir; bu durum yetkili mercilerden alınan
    belgeyle tevsik edilmiştir. |


    Varsayımlar: Hesaplamada Cumartesi ve Pazar dışında resmî tatil yoktur; sürelerde başlangıç günü hesaba katılmaz; "gün"
    takvim günüdür, "iş günü" Pazartesi–Cuma günleridir. GB-3 için banka ihbarını yasal sürenin son gününde yapmıştır; ilgili
    vergi dairesi de ihtarnameyi 21.08.2026''da göndermiş ve aynı gün ilgiliye ulaşmıştır.


    **İstenenler:**


    (a) Her GB için noksan bedeli (ihracat bedelinden mahsup edilecek masraflar dahil) hesaplayarak açık hesabın hangi makamca
    ve Tebliğin hangi hükmüne göre terkin edilmek suretiyle kapatılabileceğini belirtiniz. (10 puan)


    (b) GB-3 için bedelin yurda getirilmesi gereken son günü, bankanın vergi dairesine ihbar için son günü, vergi dairesinin
    ihtarname göndermek için son günü ve 21.08.2026''da gönderilen ihtarnamedeki sürenin bittiği tarihi bulunuz; bu süre içinde
    ilgiliden ne beklendiğini açıklayınız. (8 puan)


    (c) GB-4 için konkordato hâlinin hukuki niteliğini, nasıl tevsik edileceğini, yurt dışından alınacak belgeler için aranan
    şartı, verilecek ek sürenin niteliğini ve ek süreler bitince izlenecek yolu açıklayınız. Konkordato yerine mücbir sebep
    sayılmayan ancak resmî kayıtlarla tevsik edilen bir engel bulunsaydı ek süre talepleri hangi makam tarafından hangi aralıklarla
    karara bağlanırdı? (7 puan)

    '
  cozum: '**(a) Noksan bedel ve terkin makamı**


    | GB | Noksan bedel hesabı | Uygulanacak eşik | Terkin makamı | Dayanak |

    |---|---|---|---|---|

    | GB-1 | 80.000 − 56.000 = **24.000 USD** (beyanname bedelinin %30''u) | 30.000 USD''ye kadar; ödeme şekline ve oranına
    bakılmaz | Doğrudan banka | Tebliğ md. 10/1-(a) |

    | GB-2 | 600.000 − 548.000 = 52.000; faktoring (4.000) ve ardiye (3.000) masrafları md. 7/1 uyarınca bankaca mahsup edilince
    52.000 − 7.000 = **45.000 USD** | 30.000 USD''den yüksek, 100.000 USD''yi aşmayan; sınır beyanname bedelinin %10''u =
    60.000 USD (45.000 ≤ 60.000) | Doğrudan banka (ödeme şekline bakılmaksızın) | md. 7/1, md. 10/1-(b) |

    | GB-3 | 1.500.000 − 1.380.000 = **120.000 USD** | 100.000 USD''yi aştığı için (b) uygulanmaz; sınır %10 = 150.000 USD
    ve 200.000 USD''yi aşmaz | İlgili Vergi Dairesi Başkanlığı/Müdürlüğü (mücbir sebep ve haklı durumlar göz önünde bulundurularak)
    | md. 10/1-(c) |

    | GB-4 | 900.000 − 640.000 = **260.000 USD** | 200.000 USD''yi aşar | Hazine ve Maliye Bakanlığı (mücbir sebep ve haklı
    durumlar göz önünde bulundurularak) | md. 10/2 |


    **(b) GB-3 süre takvimi**


    - Bedel getirme süresi fiili ihraç tarihinden itibaren 180 günü geçemez (md. 3/1): 04.02.2026 + 180 gün = **03.08.2026**
    (Pazartesi).

    - Süresi içinde kapatılmayan hesaplar bankalarca 5 iş günü içinde vergi dairesine ihbar edilir (md. 8/3): 04, 05, 06,
    07, 10 Ağustos → son gün **10.08.2026**.

    - Vergi dairesi, ihbarı müteakip 10 iş günü içinde 90 gün süreli ihtarname gönderir (md. 8/4): 11, 12, 13, 14, 17, 18,
    19, 20, 21, 24 Ağustos → son gün **24.08.2026**.

    - 21.08.2026''da ulaşan ihtarnamedeki 90 günlük süre: 21.08.2026 + 90 gün = **19.11.2026**.

    - Bu süre içinde hesapların kapatılması (bedelin getirilmesi veya terkin) ya da md. 9''daki mücbir sebep hâllerinin veya
    haklı durumun belgelenmesi gerekir (md. 8/4). Banka terkini de bu ihtarname süresi içinde yapılır (md. 10/3).


    **(c) GB-4: konkordato**


    - Alıcı veya ihracatçı firmanın konkordato ilan etmesi **mücbir sebep** hâlidir (md. 9/1-(a)). Bu hâl yetkili mercilerden
    alınan belgeyle tevsik edilir (md. 9, tevsik hükmü); yurt dışından temin edilecek belgelerin dış temsilciliklerimizce
    veya Lahey Apostil Sözleşmesi hükümlerine göre onaylanmış olması gerekir (md. 9/2).

    - Mücbir sebep varsa mücbir sebebin devamı müddetince **altışar aylık dönemler** itibarıyla ilgili Vergi Dairesi Başkanlığı/Müdürlüğü
    ek süre verir (md. 8/5). Verilen 24 aylık ek sürenin sonunda mücbir sebebin devamı belgelenirse açık ihracat hesabının
    kapatılmasına ilişkin talepler Hazine ve Maliye Bakanlığı tarafından incelenip sonuçlandırılır (md. 8/7). Noksanlık 200.000
    USD''yi aştığından terkin talebi de Bakanlıkça sonuçlandırılır (md. 10/2).

    - Mücbir sebep dışındaki haklı durumlarda (bedel getirme süresi içinde engel olan ve resmî kayıtlarla tevsik edilebilen
    durumlar, md. 9/3) altı aya kadar ek süre talepleri firmanın yazılı beyanına dayanılarak **üçer aylık devreler** hâlinde
    vergi dairesi başkanlığı/müdürlüğünce; altı aylık süreden sonraki ek süre talepleri ise Hazine ve Maliye Bakanlığınca
    karara bağlanır (md. 8/6).

    '
