- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: 'Kambiyo mevzuatı: kıymetli madenler ve yetkili müesseseler'
  konu: KMB
  kazanim: altın, gümüş, platin ve paladyum depo hesapları arasında elektronik transfer (Tebliğ 2008-32/35 md. 3/2)
  tip: bilgi
  zorluk: 2
  kok: Tebliğ 2008-32/35'e göre altın, gümüş, platin ve paladyum depo hesaplarının yurt içindeki ve yurt dışındaki bankalar
    nezdinde bulunan hesapları arasında elektronik olarak transferinde esas alınacak saflık hangisidir?
  secenekler:
    A: Altın için 995/1000, gümüş için 99,9/100, platin için 99,95/100, paladyum için 99,9/100.
    B: Yalnızca altın için 1000/1000; diğer madenler elektronik olarak transfer edilemez.
    C: Tüm madenler için 995/1000.
    D: Altın için 1000/1000; gümüş, platin ve paladyum için 100/100.
    E: Elektronik transfer yalnızca yurt içindeki bankalar arasında, 995/1000 saflıkla yapılabilir.
  dogru: D
  aciklama:
    dogru_neden: 'Md. 3/2: depo hesapları arasında altın için 1000/1000, gümüş, platin ve paladyum için 100/100 saflığa göre
      elektronik transfer mümkündür. Püf noktaları: hesap açılışında aranan asgari saflıklar (md. 4/1: 995/1000, 99,9/100,
      99,95/100) transfer saflığından farklıdır.'
    celdiriciler:
      A: Bu değerler hesap açılışındaki asgari saflıklara yakındır; transferde esas alınan saflık altın 1000/1000, diğerleri
        100/100'dür.
      B: Md. 3/2 diğer madenler için de 100/100 saflıkla elektronik transferi mümkün kılar.
      C: Transfer saflığı madene göre değişir; tüm madenler için 995/1000 değildir.
      E: Md. 3/2 hem yurt içi hem yurt dışı bankalar arasındaki hesapları kapsar.
  kaynaklar:
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karara İlişkin Tebliğ (2008-32/35)
    madde: md. 3/2
    alinti: depo hesapları arasında altın için 1000/1000, (Değişik ibare:RG-28/3/2025-32855)gümüş, platin ve paladyum için
      100/100 saflığa göre elektronik olarak
  gecerlilik:
    baslangic: '2025-03-28'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: 'Kambiyo mevzuatı: kıymetli madenler ve yetkili müesseseler'
  konu: KMB
  kazanim: 1567 sayılı Kanun md. 4 kapsamında izne tabi faaliyetler
  tip: bilgi
  zorluk: 2
  kok: 1567 sayılı Türk Parasının Kıymetini Koruma Hakkında Kanun md. 4/1 uyarınca Hazine ve Maliye Bakanlığından izin alınması
    zorunlu olan faaliyetlerden biri aşağıdakilerden hangisidir?
  secenekler:
    A: Türkiye'de yerleşik bir gerçek kişinin bankada döviz hesabı açması.
    B: Türkiye'de yerleşik bir kişinin bankadan döviz satın alması.
    C: Kıymetli maden rafinaj faaliyetlerinde bulunmak.
    D: Yurt dışına döviz transferi için banka aracılığına başvurmak.
    E: İhracat bedelini bankalar aracılığıyla yurda getirmek.
  dogru: C
  aciklama:
    dogru_neden: 'Md. 4/1 izne tabi faaliyetleri sayar: (a) ticari amaçla döviz alım satımı, (b) Borsa İstanbul Kıymetli Madenler
      Piyasasında üye olarak faaliyet, (c) kıymetli maden rafinaj faaliyetleri, (ç) Kimberley Süreci Sertifika Sistemi kapsamında
      faaliyet. Püf noktaları: bireysel döviz işlemleri (hesap açma, döviz alımı, transfer) 32 sayılı Karar uyarınca serbesttir
      ve izin gerektirmez.'
    celdiriciler:
      A: Yerleşik kişilerin döviz hesaplarında döviz tutmaları serbesttir (32 sayılı Karar md. 4/b); izin gerekmez.
      B: Yerleşik kişilerin bankalardan döviz satın almaları serbesttir; izin gerekmez.
      D: Bankalar vasıtasıyla yurt dışına döviz transferi serbesttir (32 sayılı Karar md. 4/e); izin gerekmez.
      E: İhracat bedelinin yurda getirilmesi izne tabi bir faaliyet değil, bir yükümlülüktür.
  kaynaklar:
  - mevzuat: 1567 sayılı Türk Parasının Kıymetini Koruma Hakkında Kanun
    madde: md. 4/1
    alinti: 'Aşağıda yazılı olan faaliyetlerde bulunmak için Hazine ve Maliye Bakanlığından izin alınması zorunludur: a) Ticari
      amaçla döviz alım satımında bulunmak. b) Borsa İstanbul Anonim Şirketi Kıymetli Madenler Piyasasında üye olarak faaliyette
      bulunmak. c) Kıymetli maden rafinaj faaliyetlerinde bulunmak. ç) 21/2/2005 tarihli ve 2005/8518 sayılı Bakanlar Kurulu
      Kararı ile katılınması kararlaştırılan Kimberley Süreci Sertifika Sistemi kapsamında faaliyette bulunmak.'
  - mevzuat: Türk Parası Kıymetini Koruma Hakkında 32 Sayılı Karar
    madde: md. 4/b
    alinti: Türkiye'de yerleşik kişilerin beraberlerinde döviz bulundurmaları, bankalar, yetkili müesseseler, PTT, kıymetli
      maden aracı kuruluşları ile yurt dışında döviz alım satımına yetkili kuruluşlardan döviz satın almaları ve bunlara döviz
      satmaları, dövizleri bankalarda açacakları döviz hesaplarında tutmaları, efektif olarak kullanmaları, bankalar vasıtasıyla
      yurt içinde ve yurt dışında tasarruf etmeleri serbesttir.
  gecerlilik:
    baslangic: '2025-07-20'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
