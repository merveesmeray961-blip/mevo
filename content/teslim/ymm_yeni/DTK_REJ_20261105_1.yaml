- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Gümrük rejimleri
  konu: REJ
  kazanim: transit rejimi – teminat
  tip: kavrama
  zorluk: 2
  kok: '4458 sayılı Gümrük Kanunu''nun transit rejimi teminatına ilişkin hükümleri bakımından aşağıdaki öncüllerden hangileri
    doğrudur?


    I. Güvenilirlik standartlarına sahip kişilere verilen teminattan vazgeçme izni, Müsteşarlıkça yüksek risk içerdiği belirlenen
    eşyanın transit işlemlerinde uygulanmaz.


    II. Birden fazla transit işlemi için kapsamlı teminat izni, Türkiye Gümrük Bölgesinde yerleşik olmayan kişilere de verilebilir.


    III. Müsteşarlık, büyük ölçekli kaçakçılığa konu olabilecek eşya için kapsamlı teminat uygulamasını geçici olarak kaldırmaya
    yetkilidir.


    IV. Kapsamlı teminat, tek bir transit işlemi için verilen teminat türüdür.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I ve III
    D: II ve IV
    E: I, III ve IV
  dogru: C
  soru_bicimi: oncullu
  aciklama:
    dogru_neden: 'I doğrudur (md. 85/5). III doğrudur (md. 85/6-b). II yanlıştır: kapsamlı teminat izni yalnızca Türkiye Gümrük
      Bölgesinde yerleşik kişilere verilir (md. 85/3-a). IV yanlıştır: tek bir transit işlemi için verilen teminat bireysel
      teminattır; kapsamlı teminat birden fazla işlem içindir (md. 85/2).'
    celdiriciler:
      A: III de doğrudur; md. 85/6-(b) bu yetkiyi açıkça verir.
      B: II yanlıştır; md. 85/3-(a) yerleşik olma şartı arar.
      D: II ve IV yanlıştır; kapsamlı teminat birden fazla işlem için, bireysel teminat tek işlem içindir.
      E: IV yanlıştır; tek işlem için teminat bireysel teminattır (md. 85/2-a).
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 85/2-3
    alinti: '2. Teminat: a) Tek bir transit işlemi için bireysel teminat, b) Müsteşarlık tarafından izin verilmesi halinde,
      birden fazla transit işlemi için kapsamlı teminat, şekillerinde olabilir. 3. İkinci fıkranın (b) bendinde belirtilen
      izin sadece; a) Türkiye Gümrük Bölgesinde yerleşik olan, b) Transit rejimini düzenli olarak kullanan veya gümrük idaresince
      bu rejime ilişkin yükümlülüklerini yerine getirebileceği belirlenen, c) Gümrük veya vergi mevzuatını yönetmelikte belirlenen
      surette ihlal etmemiş olan, kişilere verilir.'
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 85/5-6
    alinti: 5. Dördüncü fıkraya göre verilen teminattan vazgeçme izni, Müsteşarlıkça yüksek risk içerdiği belirlenen eşyanın
      transit işlemlerinde uygulanmaz. 6. Müsteşarlık; a) Özel durumlarda istisnai önlem olarak dördüncü fıkra hükümleri doğrultusundaki
      indirilmiş tutarda kapsamlı teminat uygulamasını, b) Büyük ölçekli kaçakçılığa konu olabilecek eşya için kapsamlı teminat
      uygulamasını, geçici olarak kaldırmaya yetkilidir.
