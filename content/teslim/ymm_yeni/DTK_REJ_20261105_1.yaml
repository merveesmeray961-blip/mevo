  konu: REJ
  kazanim: hariçte işleme – tamir amacıyla geçici ihracat
  tip: uygulama
  zorluk: 3
  kok: Serbest dolaşımdaki makinelerini tamir amacıyla geçici olarak ihraç eden Türkiye'de yerleşik şirketlerin aşağıdaki
    durumlarından hangisinde yeniden ithal edilen makine, serbest dolaşıma ithalat vergilerinden **tam muaf** olarak girer?
    (Hariçte işleme izni koşullarına uyulduğu kabul edilecektir.)
  secenekler:
    A: Tamir bedel karşılığı yapılmış ve yabancı firmaya yalnızca tamir masrafı kadar ödeme yapılmıştır.
    B: Tamir garanti kapsamında bedelsiz yapılmıştır; ancak makine ilk ithalinde kusurlu olduğu dikkate alınarak vergi indiriminden
      yararlandırılmıştır.
    C: Tamir bedelsiz yapılmıştır; ortada garanti sözleşmesi, kamuni yükümlülük veya imalat hatası yoktur, yabancı firma ticari
      ilişkiyi korumak için bedel almamıştır.
    D: Tamirin sözleşmeye bağlı garanti nedeniyle bedelsiz yapıldığı belgelerle kanıtlanmış, makinenin ilk girişte kusurlu
      olduğu dikkate alınarak işlem yapılmamıştır.
    E: Tamirin imalat hatası nedeniyle bedelsiz yapıldığı ileri sürülmüş, ancak bunu gösteren belge sunulmamış, yalnızca yabancı
      firmanın sözlü beyanı bulunmaktadır.
  dogru: D
  soru_bicimi: standart
  aciklama:
    dogru_neden: 'Md. 142''ye göre tamir garanti nedeniyle sözleşmeye bağlı olarak veya kamuni bir yükümlülüğe dayanarak ya
      da imalat hatası nedeniyle bedelsiz yapılmışsa ve bu durum kanıtlanırsa makine ithalat vergilerinden tam muaf girer.
      Makinenin ilk girişte kusurlu olduğu dikkate alınarak işlem yapılmışsa muafiyet uygulanmaz. Yalnızca D şıkkında hem
      bedelsizlik gerekçesi hem kanıt hem de ilk giriş şartı birlikte sağlanmaktadır. Püf noktaları: tam muafiyet için üç
      unsur birlikte aranır: garanti/kamuni yükümlülük/imalat hatası gibi bir neden, bedelsizliğin kanıtı ve ilk girişte kusur
      indiriminin yapılmamış olması; bedelli tamirde ise md. 143 uyarınca tamir masrafı üzerinden vergi alınır.'
    celdiriciler:
      A: Bedelli tamirde md. 143 gereği tamir masrafı kıymet alınarak vergi hesaplanır; tam muafiyet yoktur.
      B: İlk girişte kusur dikkate alınarak işlem yapıldığından md. 142 muafiyeti uygulanmaz.
      C: Garanti, kamuni yükümlülük veya imalat hatası bulunmadığından md. 142'nin nedenlerinden hiçbiri yoktur.
      E: Bedelsizliğin kanıtlanması gerekir; yalnızca sözlü beyan md. 142 anlamında kanıt sayılmaz.
