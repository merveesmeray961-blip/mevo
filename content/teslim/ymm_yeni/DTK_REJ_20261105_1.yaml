  tip: kavrama
  zorluk: 3
  kok: 'Hariçte işleme rejimine ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Rejimin işleyişine ilişkin şartlardan birine uyulmamışsa, rejimin doğru işleyişine önemli bir etkisi olmadığı tespit
    edilse bile ithalat vergilerinden muafiyet hiçbir şekilde uygulanmaz.


    II. İşlem görmüş ürünlerin yeniden ithal edilmesi için gereken süre izinde belirtilir ve izin hak sahibinin talebinin
    uygun bulunması halinde uzatılabilir.


    III. Muafiyet, işlem görmüş ürünlerin serbest dolaşıma giriş beyanının izin hak sahibi adına ya da onayı alınmış ve izin
    koşullarına uyulmuş olmak kaydıyla Türkiye''de yerleşik başka bir kişi adına veya hesabına yapılması halinde tanınabilir.


    IV. Serbest dolaşımdaki eşya geçici olarak ihraç edilirken eşyaya, Türkiye Gümrük Bölgesi dışına çıkışı için öngörülen
    ihracat vergileri, ticaret politikası önlemleri ve diğer işlemler uygulanmaz.'
  secenekler:
    A: Yalnız II
    B: II ve III
    C: I ve III
    D: II ve IV
    E: I, III ve IV
  dogru: B
  soru_bicimi: oncullu
  aciklama:
    dogru_neden: 'I yanlıştır: md. 140/2 şart ihlalinde muafiyeti uygulamaz, ancak rejimin doğru işleyişine önemli etkisi
      olmadığı tespit edilirse muafiyet uygulanır. II doğrudur: md. 139/1. III doğrudur: md. 140/1. IV yanlıştır: md. 135/2
      geçici ihracatta çıkış için öngörülen ihracat vergileri, ticaret politikası önlemleri ve diğer işlemlerin uygulanacağını
      belirtir. Püf noktaları: “şart ihlali = muafiyet yok” kuralının istisnasını (önemli etkisi olmayan ihlal) unutmayın;
      geçici ihracatın da bir ihracat gibi önlemlere tabi olduğunu, rejimin yalnızca dönüşteki vergi muafiyetini sağladığını
      ayırt edin.'
    celdiriciler:
      A: III de doğrudur; md. 140/1 muafiyeti onaylı yerleşik üçüncü kişiye de tanır.
      C: I yanlıştır, çünkü md. 140/2 önemli etkisi olmayan ihlalde muafiyeti korur.
      D: IV yanlıştır; md. 135/2 geçici ihracatta ihracat vergileri ve önlemlerin uygulanacağını öngörür.
      E: I ve IV yanlış, II ise doğrudur; üç öncülün birlikte doğru olması mümkün değildir.
  kaynaklar:
