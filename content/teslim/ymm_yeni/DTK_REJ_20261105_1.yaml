  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 140/2
    alinti: 2. Hariçte işleme rejimine ilişkin şartlar veya yükümlülüklerden birine uyulmadığı takdirde, 135 inci maddenin
      1 inci fıkrasında belirtilen ithalat vergilerinden tam veya kısmi muafiyet uygulaması yapılmaz. Ancak, bu durumun, söz
      konusu rejimin doğru işleyişine önemli bir etkisinin olmadığının tesbit edilmesi halinde, ithalat vergilerinden tam
      veya kısmi muafiyet uygulaması yapılır.
