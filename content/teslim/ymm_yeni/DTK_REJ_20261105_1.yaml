      giriş beyannamesinin iptal edilmesi, b) Geri ödeme sisteminin uygulandığı dahilde işleme rejimi çerçevesinde işledikten
      sonra ihraç edilen eşyaya ilişkin gümrük vergilerinin geri verilmesi veya kaldırılması, c) 213 üncü madde hükmü uyarınca,
