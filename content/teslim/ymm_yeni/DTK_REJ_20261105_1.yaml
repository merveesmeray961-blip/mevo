  kok: Türkiye'de yerleşik (M) A.Ş.'ye ilişkin aşağıdaki olaylardan hangisinde eşya, 4458 sayılı Gümrük Kanunu'nun 78. maddesi
    bakımından serbest dolaşımda bulunan eşya statüsünü **kaybetmez**?
  secenekler:
    A: İndirimli oranla girmiş eşyanın izinde öngörülen üretimde kullanılarak gümrük gözetiminin sona ermesi
    B: Hatalı düzenlendiği anlaşılan serbest dolaşıma giriş beyannamesinin iptal edilmesi
    C: Geri ödeme sisteminin uygulandığı dahilde işleme rejiminde işlendikten sonra ihraç edilen eşyanın gümrük vergilerinin
      geri verilmesi
    D: Eşyanın kusurlu olması nedeniyle 213. madde uyarınca gümrük vergilerinin geri verilmesi
    E: Eşyanın ihracı nedeniyle 214. madde uyarınca gümrük vergilerinin geri verilmesi
  dogru: A
  soru_bicimi: olumsuz
  aciklama:
    dogru_neden: 'Md. 78 serbest dolaşımdaki eşyanın statüsünü kaybettiği hâlleri sayar: beyannamenin iptali, geri ödeme sisteminde
      ihraç sonrası vergilerin geri verilmesi veya kaldırılması, 213. madde ve 214. madde uyarınca vergilerin geri verilmesi
      veya kaldırılması. Nihai kullanımla gümrük gözetiminin sona ermesi (md. 77) bu listede yoktur; eşyanın statüsünü etkilemez.
      Püf noktaları: “gümrük gözetiminin sona ermesi” ile “serbest dolaşım statüsünün kaybı” farklı kavramlardır; statü kaybı
      için md. 78''deki dört hâl aranır, vergi iadesi veya beyanname iptali bu hâllerin ortak noktasıdır.'
    celdiriciler:
      B: Beyannamenin iptali md. 78/(a) bendindeki statü kaybı hâlidir.
      C: Geri ödeme sisteminde vergilerin geri verilmesi md. 78/(b) bendindeki statü kaybı hâlidir.
      D: 213. madde uyarınca vergilerin geri verilmesi md. 78/(c) bendindeki statü kaybı hâlidir.
      E: 214. madde uyarınca vergilerin geri verilmesi md. 78/(d) bendindeki statü kaybı hâlidir.
