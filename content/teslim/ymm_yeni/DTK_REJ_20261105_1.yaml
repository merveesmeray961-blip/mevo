      öngörülen ihracat vergileri, ticaret politikası önlemleri ve diğer işlemler uygulanır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 139/1
    alinti: 1.İşlem görmüş ürünlerin Türkiye Gümrük Bölgesine yeniden ithal edilmeleri için gereken süre verilen izinde belirtilir.
