    |

    | 7 | Gümrük vergileri ödenerek serbest dolaşıma giren eşya, şirketin deposunda 18 ay kullanılmadan bekletilmiştir. |

    | 8 | Geri ödeme sisteminin uygulandığı dahilde işleme rejiminde işlendikten sonra ihraç edilen eşyanın gümrük vergileri
    geri verilmiştir. |


    **İstenenler:**


    (a) İşlem 1''deki her beyanname için uygulanacak gümrük vergisi oranını gerekçesiyle belirtiniz; ödenecek toplam gümrük
    vergisini hesaplayınız. (7 puan)


    (b) İşlem 2''de en yüksek oran esasına göre ödenecek gümrük vergisini, kalemlerin ayrı ayrı vergilendirilmesi hâlindeki
    toplamla karşılaştırarak farkı bulunuz; uygulamanın dayanağını ve idarenin konumunu açıklayınız. (6 puan)


