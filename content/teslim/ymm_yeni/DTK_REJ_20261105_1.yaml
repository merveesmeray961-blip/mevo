    (d) İşlem 4''te numaralandırılan durumlardan hangilerinde eşyanın serbest dolaşımda bulunan eşya statüsünü kaybettiğini,
    hangisinde kaybetmediğini gerekçesiyle açıklayınız. (6 puan)

