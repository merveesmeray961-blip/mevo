  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**Marmara Triko ve Konfeksiyon A.Ş.** (Türkiye''de yerleşik) hariçte işleme izinlerini almış ve 2026 yılında aşağıdaki
    işlemleri yürütmüştür. Yalnızca gümrük vergisi dikkate alınacaktır (KDV ve diğer vergiler hesaba katılmayacaktır). Aksi
    belirtilmedikçe izin koşullarına ve sürelere uyulmuştur; indirilecek tutarın hesabında dikkate alınmayacak gider bulunmamaktadır.


    **İşlem 1.** Serbest dolaşımdaki kumaşlar, dikim için Bulgaristan''a geçici olarak ihraç edilmiştir. Elde edilen gömlekler
    12.05.2026''da serbest dolaşıma giriş beyannamesiyle yeniden ithal edilmiştir. Geçici ihracat eşyasının kıymeti 27. maddenin
    1. fıkrasının (b) bendinin (i) alt bendine göre belirlenememiştir.


    | Veri | Tutar / oran |

    |---|---|

    | Gömleklerin gümrük kıymeti | 1.000.000 TL |

    | Makul yöntemle belirlenen işleme masrafı | 280.000 TL |

    | Gömlek için gümrük vergisi oranı | %12 |

    | Kumaşın aynı tarihte son işleme ülkesinden ithali hâlinde uygulanacak oran | %8 |


    **İşlem 2.** Şirket iki makineyi tamir için geçici olarak yurt dışına göndermiştir:


    | Makine | Durum |

    |---|---|

    | M1 | Tamir bedel karşılığı yapılmıştır. Yabancı firmaya yalnızca 150.000 TL tamir masrafı ödenmiş olup başka ödeme yoktur
    ve bu ödeme taraflar arasındaki ilişkiden etkilenmemiştir. Serbest dolaşıma giriş beyannamesi 03.07.2026''da tescil edilmiştir;
    bu tarihte tamir edilmiş makineye uygulanacak gümrük vergisi oranı %6''dır. |

    | M2 | Tamir, sözleşmeye dayalı garanti nedeniyle bedelsiz yapılmış ve bu durum belgelerle kanıtlanmıştır. Makine ilk
    serbest dolaşıma girişinde kusurlu olduğu dikkate alınarak işlem yapılmamıştır. |


    **İşlem 3.** Gömleklerin serbest dolaşıma giriş beyannamesi, şirketin onayı alınarak şu şekilde verilmek istenmektedir:
    (i) Türkiye''de yerleşik Delta Dağıtım Ltd. Şti. adına ve hesabına; (ii) Bulgaristan''da yerleşik alıcı firma adına ve
    hesabına.


    **İşlem 4.** Şirket iki ayrı gönderide izin koşullarından birine uymamıştır. Birinde idare, aykırılığın rejimin doğru
    işleyişine önemli bir etkisi olmadığını tespit etmiş; diğerinde ise aykırılığın rejimin doğru işleyişini önemli ölçüde
    etkilediğini tespit etmiştir.


    **İşlem 5.** Şirket üç ayrı parti serbest dolaşımdaki eşya için hariçte işleme izni talep etmiştir: (P1) ihracı ihracat
    vergi iadesini gerektiren eşya, (P2) ihracından önce nihai kullanımları nedeniyle tam muafiyet suretiyle serbest dolaşıma
    girmiş ve muafiyet koşullarını sürdüren eşya, (P3) ihracı hâlinde daha önce ödenmiş ithalat vergilerinin geri verilmesine
    yol açacak eşya.


    **İstenenler:**


    (a) İşlem 1''deki gömleklerin yeniden ithalinde ödenecek gümrük vergisini hesaplayınız; geçici ihracat eşyasının kıymetinin
    nasıl belirlendiğini açıklayınız. (8 puan)


    (b) İşlem 2''de M1 için ödenecek gümrük vergisini hesaplayınız; M2''nin vergilendirilmesini ve dayanağını açıklayınız.
    (5 puan)


    (c) İşlem 3''teki (i) ve (ii) beyan biçimleri ile İşlem 4''teki iki durumda, ithalat vergilerinden muafiyetin tanınıp
    tanınmayacağını gerekçesiyle belirtiniz. (7 puan)


    (d) İşlem 5''teki partilere hariçte işleme rejiminin uygulanıp uygulanamayacağını açıklayınız. (5 puan)

    '
  cozum: '**(a) İşlem 1 – Hariçte işleme vergisi (md. 141/1-2)**


    Vergi, işlem görmüş ürünlere ait ithalat vergisi tutarından, geçici ihracat eşyasının (kumaşın) en son işleme faaliyetinin
    yapıldığı ülkeden aynı tarihte ithal edilmesi hâlinde uygulanacak vergi tutarının indirilmesiyle bulunur. Geçici ihracat
    eşyasının kıymeti md. 27/1-(b)-(i)''e göre belirlenemediğinden, işlem görmüş ürünlerin gümrük kıymeti ile işleme masrafı
    arasındaki fark geçici ihracat eşyasının kıymeti sayılır (md. 141/2).


    | Adım | Hesap | Tutar |

    |---|---|---|

    | Gömleklere ait vergi | 1.000.000 × %12 | 120.000 TL |

    | Geçici ihracat eşyasının (kumaş) kıymeti | 1.000.000 − 280.000 | 720.000 TL |

    | İndirilecek vergi | 720.000 × %8 | 57.600 TL |

    | **Ödenecek gümrük vergisi** | 120.000 − 57.600 | **62.400 TL** |


    **(b) İşlem 2 – Tamir (md. 142, 143)**


    - **M1:** Tamir bedel karşılığı yapıldığından gümrük kıymeti olarak tamir masrafına eşit tutar alınır; oran, serbest dolaşıma
    giriş beyannamesinin tescil tarihindeki orandır (md. 143). İzin sahibi tamir masrafı dışında başka bir ödeme yapmamıştır
    ve ödeme taraflar arasındaki ilişkiden etkilenmemiştir. Vergi = 150.000 × %6 = **9.000 TL**.

    - **M2:** Tamir garanti nedeniyle sözleşmeye bağlı olarak bedelsiz yapıldığı kanıtlandığından ve ilk girişte kusurlu olduğu
    dikkate alınarak işlem yapılmadığından makine ithalat vergilerinden **tam muaf** olarak serbest dolaşıma girer (md. 142).
    Ödenecek vergi 0 TL''dir.


    **(c) İşlem 3 ve 4 – Muafiyetin tanınması (md. 140)**


    | Durum | Sonuç | Gerekçe |

    |---|---|---|

    | İşlem 3 (i) | Tanınır | Beyan, izin hak sahibinin onayı alınmış ve izin koşullarına uyulmuş olmak kaydıyla Türkiye''de
    yerleşik başka bir kişi adına/hesabına yapılabilir (md. 140/1). |

    | İşlem 3 (ii) | Tanınmaz | Bulgaristan''da yerleşik kişi Türkiye Gümrük Bölgesinde yerleşik değildir (md. 140/1). Muafiyet,
    izin hak sahibi veya onayı alınmış yerleşik kişi adına yapılan beyana tanınır. |

    | İşlem 4 – önemli etki yok | Tanınır | Şart ihlali varsa muafiyet uygulanmaz; ancak rejimin doğru işleyişine önemli bir
    etkisi olmadığı tespit edilirse muafiyet uygulanır (md. 140/2). |

    | İşlem 4 – önemli etki var | Tanınmaz | Genel kural: şart ihlalinde tam veya kısmi muafiyet uygulanmaz (md. 140/2). |


    **(d) İşlem 5 – Rejimin uygulanamayacağı eşya (md. 136)**


    Hariçte işleme rejimi; (a) ihracı ödenmiş ithalat vergilerinin geri verilmesine veya teminata bağlanmış vergilerin kaldırılmasına
    yol açan, (b) ihracından önce nihai kullanımları nedeniyle tam muafiyet suretiyle serbest dolaşıma giren ve muafiyet koşullarını
    taşımaya devam eden, (c) ihracı ihracat vergi iadesini gerektiren serbest dolaşımdaki eşyaya uygulanmaz. Dolayısıyla P1
    (c bendi), P2 (b bendi) ve P3 (a bendi) için rejim **uygulanamaz**. (b bendinin istisnaları yönetmelikle belirlenir.)

    '
