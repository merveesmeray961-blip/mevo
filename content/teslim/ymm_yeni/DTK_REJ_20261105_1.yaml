  soru: '**Kızılırmak Plastik A.Ş.** (Türkiye''de yerleşik) 2026 yılında aşağıdaki gümrük işlemlerini yapmıştır. Tarımsal
    mali yük söz konusu değildir; KDV dikkate alınmayacaktır. Aksi belirtilmedikçe şirket hiçbir aşamada kusurlu davranmamıştır.


    **İşlem 1.** Aynı granül hammaddesi için iki serbest dolaşıma giriş beyannamesi tescil edilmiştir. Eşyaya tescil tarihinde
    uygulanan gümrük vergisi oranı %12''dir. 15.06.2026''da bu eşya için gümrük vergisi oranı %8''e indirilmiştir. Şirket
    her iki beyanname için de lehine olan oranın uygulanmasını yazılı olarak istemiştir.


    | Beyanname | Tescil tarihi | Gümrük kıymeti | Vergilerin ödendiği tarih |

    |---|---|---|---|

    | B1 | 02.06.2026 | 2.000.000 TL | 18.06.2026 |

    | B2 | 03.06.2026 | 1.000.000 TL | 12.06.2026 |


    **İşlem 2.** Tek bir taşıma belgesi kapsamında gelen ve üç ayrı tarife pozisyonuna giren eşyanın her biri için ayrı işlem
    yapılmasının ek iş yükü ve masrafa yol açacağı gerekçesiyle şirket, eşyanın tamamına en yüksek vergi oranına tabi pozisyona
    göre işlem yapılmasını talep etmiştir. Gümrük idaresi talebi uygun bulmuştur.


    | Kalem | Gümrük kıymeti | Gümrük vergisi oranı |

    |---|---|---|

    | K1 | 400.000 TL | %4 |

    | K2 | 400.000 TL | %10 |

    | K3 | 200.000 TL | %20 |


    **İşlem 3.** Nihai kullanım nedeniyle indirimli oranla serbest dolaşıma girmiş eşyaya ilişkin durumlar:


    | No | Durum |

    |---|---|

    | 1 | Eşya, izinde öngörülen üretim faaliyetinde kullanılmıştır. |

    | 2 | Eşya hiç kullanılmadan Gürcistan''a ihraç edilmiştir. |

    | 3 | İndirimli oran uygulamasına ilişkin koşulların sona erdiği tespit edilmiştir. |

    | 4 | Eşya belirlenen amaç dışında kullanılmış, ancak bu nedenle tahsili gereken vergiler henüz ödenmemiştir. |


    **İşlem 4.** Serbest dolaşımda bulunan eşyaya ilişkin durumlar:


    | No | Durum |

    |---|---|

    | 5 | Hatalı düzenlendiği anlaşılan serbest dolaşıma giriş beyannamesi iptal edilmiştir. |

