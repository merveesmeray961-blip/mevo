  cozum: '**(a) İşlem 1 – Lehine oran (md. 75/1)**


    Beyan sahibi, tarımsal mali yükler dışındaki ithalat vergisi oranlarının tescil tarihinden **sonra**, fakat vergilerin
    ödenmesinden veya teminata bağlanmasından **önce** indirilmesi hâlinde lehine olan oranı isteyebilir. Beyan sahibinden
    kaynaklanan bir işlem eksikliği de yoktur (md. 75/2).


    | Beyanname | Oran indirimi (15.06.2026) – ödeme sırası | Uygulanacak oran | Gümrük kıymeti | Gümrük vergisi |

    |---|---|---|---|---|

    | B1 | Ödeme 18.06.2026, indirimden sonra; ödemeden önce oran düşmüştür | %8 | 2.000.000 | **160.000 TL** |

    | B2 | Ödeme 12.06.2026, indirimden önce; vergi oran düşmeden ödenmiştir | %12 | 1.000.000 | **120.000 TL** |


    Toplam gümrük vergisi = 160.000 + 120.000 = **280.000 TL**. B2''de vergi, indirimden önce ödendiği için lehine oran istenemez.


    **(b) İşlem 2 – En yüksek oran (md. 76)**


    Taşıma belgesi içeriği eşya değişik tarife pozisyonlarına giriyor ve her birine ayrı işlem ek iş yükü ve masrafa yol açıyorsa,
    beyan sahibinin talebi üzerine gümrük idareleri eşyanın tamamına en yüksek oranlı pozisyona göre vergi **uygulayabilir**.
    İdare için bir zorunluluk değil, takdir yetkisi söz konusudur; şirket için de bir hak değil, talep imkânıdır.


    | Yöntem | Hesap | Vergi |

    |---|---|---|

    | Kalem kalem | 400.000×%4 + 400.000×%10 + 200.000×%20 = 16.000 + 40.000 + 40.000 | 96.000 TL |

    | En yüksek oran (%20) | 1.000.000 × %20 | **200.000 TL** |

    | Fark | 200.000 − 96.000 | **104.000 TL** (şirket aleyhine) |


    **(c) İşlem 3 – Nihai kullanımda gözetimin sona ermesi (md. 77/1)**


    | No | Sonuç | Dayanak |

    |---|---|---|

    | 1 | Sona erer | Gözetim, nihai kullanım olarak kabul edilen üretim veya kullanım faaliyetiyle sona erer. |

    | 2 | Sona erer | Eşyanın ihraç edilmesi hâlinde de gözetim sona erer. |

    | 3 | Sona erer | İndirimli veya sıfır vergi uygulamasına ilişkin koşulların sona ermesi hâlinde gözetim sona erer. |

    | 4 | **Sona ermez** | Amaç dışı kullanım nedeniyle tahsili gereken vergilerin **ödenmiş olması** gerekir; ödenmediği
    için gözetim sürer. |


    **(d) İşlem 4 – Serbest dolaşımdaki eşya statüsü (md. 78)**


    Statü yalnızca md. 78''de sayılan hâllerde kaybedilir: beyannamenin iptali (a), geri ödeme sisteminde işlendikten sonra
    ihraç edilen eşyanın vergilerinin geri verilmesi veya kaldırılması (b), 213. madde uyarınca kusurlu/sözleşmeye aykırı
    eşyada vergilerin geri verilmesi veya kaldırılması (c) ve 214. madde uyarınca ihraç, geri gönderme veya başka bir işlem
    nedeniyle vergilerin geri verilmesi veya kaldırılması (d).


    | No | Sonuç | Gerekçe |

    |---|---|---|

    | 5 | Kaybeder | Beyannamenin iptali – md. 78/a |

    | 6 | Kaybeder | 213. madde gereği vergilerin geri verilmesi – md. 78/c |

    | 7 | **Kaybetmez** | Bu durum md. 78''deki hâllerden biri değildir; vergileri ödenmiş eşyanın depoda beklemesi statüyü
    etkilemez. |

    | 8 | Kaybeder | Geri ödeme sisteminde vergilerin geri verilmesi – md. 78/b |

    '
