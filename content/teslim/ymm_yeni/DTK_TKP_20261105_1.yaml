    zamanında** yapılmıştır.

    - Md. 35: Kesin önlemler yürürlüğe girme tarihinden (veya damping/sübvansiyon ile zarar incelemesini birlikte kapsayan
    en son gözden geçirmenin sonuçlandığı tarihten) 5 yıl sonra yürürlükten kalkar; yerli üreticiler, sürenin bitiminden **en
    geç 3 ay önce** nihai gözden geçirme başvurusu yapabilir.


    | Varsayım | Yürürlükten kalkma | Nihai gözden geçirme için son başvuru |

    |---|---|---|

    | (i) Gözden geçirme yok | 14/4/2022 + 5 yıl = **14/4/2027** | **14/1/2027** |

    | (ii) 20/10/2024''te sonuçlanan kapsamlı gözden geçirme | 20/10/2024 + 5 yıl = **20/10/2029** | **20/7/2029** |


    **(b) Teminat ve kesin vergi (3577 md. 13, 14)**


    Kesin vergi, zararı gidermeye yeterli daha düşük oranla (%15) konulabilir (md. 7, 13): 20.000.000 × %15 = **3.000.000
