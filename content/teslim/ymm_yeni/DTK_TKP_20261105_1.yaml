      A: Önceki kullanım md. 10/2 kapsamında alıkoymada önem taşıyabilir; md. 13/1’in müsadere koşulları arasında sayılmamıştır.
      C: Sürücünün ücret alması müsadere koşulu değildir; md. 13/1 yalnız saklama biçimi, yükteki ağırlık veya madde niteliğine
        bakar.
      D: Eşyanın değerinin araçtan yüksek olması ya da kasadaki yeri md. 13/1’de aranan koşullardan değildir.
