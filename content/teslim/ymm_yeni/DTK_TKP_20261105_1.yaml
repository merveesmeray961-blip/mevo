  soru: '**Nehir Gıda İthalat A.Ş.** (Türkiye''de yerleşik) 2026 yılında, 4458 sayılı Gümrük Kanunu md. 177/1-(b) kapsamında
    (md. 50''deki süre içinde gümrükçe onaylanmış işlem veya kullanım tayini için işleme başlanmadığından) tasfiyelik hale
    gelen aşağıdaki partiler için, ilgili işlemler tamamlanmadan önce gümrük idaresine başvurmuştur. Eşyanın CIF değerleri
    döviz cinsinden, ceza ve giderler Türk lirası olarak verilmiştir:


    | Parti | Durum | CIF değeri (USD) | Eşyaya ait cezalar (TL) | Ambarlama, elleçleme ve diğer giderler (TL) |

    |---|---|---|---|---|

    | P1 | Şirket gümrük rejimine tabi tutulmak istemektedir; bu uygulamadan ilk kez yararlanmaktadır; ihale ilanı henüz yayımlanmamıştır
    | 60.000 | 8.000 | 12.000 |

    | P2 | Şirket gümrük bölgesi dışına yeniden ihraç istemektedir; bu uygulamadan ikinci kez yararlanmak istemektedir; ihale
    ilanı henüz yayımlanmamıştır | 80.000 | 5.000 | 9.000 |

    | P3 | İhale ilanı 3/3/2026''da yayımlanmış, satış 17/3/2026''ya belirlenmiştir; şirket 10/3/2026''da rejime tabi tutulma
    talebinde bulunmuştur | 50.000 | 3.000 | 4.000 |

    | P4 | Şirket tarafından md. 164 uyarınca gümrüğe terk edilen eşyadır; ihale ilanı yayımlanmadan önce rejim talebinde
    bulunmuştur | 40.000 | 2.000 | 3.000 |

    | P5 | P3 ile aynı ihale ilanına konu eşyadır; satış 17/3/2026''da gerçekleşmiş, şirket 20/3/2026''da rejim talebinde
    bulunmuştur | 30.000 | 1.000 | 2.000 |


    Ödemeler döviz ve Türk lirası tutarları ayrı ayrı gösterilecek, kur dönüşümü yapılmayacaktır.


    **İstenenler:**


    (a) Her parti için talebin kabul edilip edilmeyeceğini gerekçesiyle belirtiniz; kabul edilenler için talebin kabulü karşılığında
    ödenecek tutarı (USD ve TL olarak ayrı ayrı) hesaplayınız. (10 puan)


    (b) Md. 179/2 uyarınca, birinci fıkra hükmünün uygulanmadığı tasfiyelik eşya türlerini md. 177''nin bentleriyle sayınız;
    ithali yasak veya kısıtlamaya tabi olması nedeniyle yeniden ihraç amaçlı satış (md. 178/b) yoluyla tasfiye edilecek eşya
    için ne istenebileceğini belirtiniz. (5 puan)


    (c) P5 eşyası 17/3/2026''da ihale ile 420.000 TL''ye satılmış ve bedel 25/3/2026''da tahsil edilmiştir. Satış bedelinden
    ayrılacak kalemler: hizmet karşılığı alacaklar ve yapılmış masraflar 30.000 TL, gümrük vergileri 250.000 TL, satış için
    yapılmış masraflar 20.000 TL, para cezaları 150.000 TL''dir. Md. 180/1 uyarınca dağıtımı yapınız; para cezalarından karşılanamayan
    tutarı bulunuz. Aynı eşyanın 700.000 TL''ye satıldığını varsayarak artan tutarı ve bu tutarın sahibince en geç hangi tarihe
    kadar alınması gerektiğini (aksi hâlde nereye irat kaydedileceğini) belirtiniz. (10 puan)

    '
  cozum: '**(a) Talepler (md. 179/1)**


    Rejim veya yeniden ihraç talebi, ihale ilanının yayımlandığı veya perakende satış kararının alındığı tarihe kadar yapılabilir;
    kabul, eşyaya ait varsa cezalar ile ambarlama, elleçleme ve diğer giderlerin ve CIF değerinin belirli oranındaki tutarın
    ödenmesine bağlıdır: ilk kez %1, ikinci kez %3; ilan/karardan sonra ve satıştan önce yapılırsa %10. Bunun dışındaki başvurular
    kabul edilmez.


    | Parti | Sonuç | Hesap | Ödenecek |

    |---|---|---|---|

    | P1 | Kabul (ilan öncesi, ilk kez) | 60.000 × %1 = 600 USD; TL: 8.000 + 12.000 | **600 USD + 20.000 TL** |

    | P2 | Kabul (ilan öncesi, ikinci kez) | 80.000 × %3 = 2.400 USD; TL: 5.000 + 9.000 | **2.400 USD + 14.000 TL** |

    | P3 | Kabul (ilan sonrası, satıştan önce) | 50.000 × %10 = 5.000 USD; TL: 3.000 + 4.000 | **5.000 USD + 7.000 TL** |

    | P4 | Kabul edilmez | md. 177/1-(ı) eşyası; md. 179/2 gereği birinci fıkra uygulanmaz | – |

    | P5 | Kabul edilmez | Başvuru satış gerçekleştikten sonra yapılmıştır (md. 179/1 son cümle) | – |


    Kabul edilen taleplerde toplam: 8.000 USD ve 41.000 TL.


    **(b) Md. 179/2 ve yasak eşya**


    Birinci fıkra hükmü uygulanmayan eşya: md. 177/1''in (c), (d), (ı), (l) ve (m) bentlerindeki eşya ile md. 177/2-(a) bendindeki
    (Kaçakçılıkla Mücadele Kanunu uyarınca tasfiye edilebilecek duruma gelen) eşya. İthali yasak veya kısıtlamaya tabi eşyada
    ise ihale ilanı yayımlanıncaya veya perakende satış kararı alınıncaya kadar yalnızca gümrük bölgesi dışına yeniden ihracı
    istenebilir (gümrük rejimine tabi tutulması istenemez).


    **(c) Md. 180/1 dağıtımı**


    Satış bedelinden sırasıyla (a) hizmet karşılığı alacaklar ve masraflar, (b) gümrük vergileri, (c) satış masrafları, (d)
    para cezaları ayrılır.


    | Kalem | Tutar (TL) | Kalan satış bedeli |

    |---|---|---|

    | Satış bedeli | 420.000 | 420.000 |

    | 1. Hizmet alacakları ve masraflar | 30.000 | 390.000 |

    | 2. Gümrük vergileri | 250.000 | 140.000 |

    | 3. Satış masrafları | 20.000 | 120.000 |

    | 4. Para cezaları (150.000) | **120.000 ödenir** | 0 |


    Para cezalarından karşılanamayan tutar = 150.000 − 120.000 = **30.000 TL**.


    Satış bedeli 700.000 TL olsaydı: 700.000 − 30.000 − 250.000 − 20.000 − 150.000 = **250.000 TL** artar. Artan para eşya
    sahipleri adına emanet hesabına alınır; emanete alındığı tarihten (25/3/2026) itibaren bir yıl içinde, yani **25/3/2027''ye
    kadar** alınmazsa Bakanlık döner sermaye işletmesine irat kaydedilir (md. 180/1).

    '
