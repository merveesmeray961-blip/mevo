    Şikayetin üretim dalı adına yapılmış sayılması için: (i) şikayeti destekleyenlerin üretimi, destekleyenler ile karşı çıkanların
    toplam üretiminin **%50''sinden fazla** olmalı ve (ii) toplam Türkiye benzer mal üretiminin **%25''inden az olmamalıdır**.
    Görüş bildirmeyenler birinci ölçütte hesaba katılmaz.


    - Destekleyenler: 300 + 150 = 450; karşı çıkan: 250.

    - (i) 450 / (450 + 250) = 450 / 700 = **%64,29 > %50** ✔.

    - (ii) 450 / 1.000 = **%45 ≥ %25** ✔.

    - Sonuç: şikayet üretim dalı adına yapılmış sayılır.


    Delta (300) karşı çıkarsa: (i) 450 / (450 + 550) = **%45 < %50** ✘ – şikayet üretim dalı adına yapılmış sayılmaz; soruşturma
    açılamaz.


    **(b) İhmal edilebilir düzey (Yönetmelik md. 28/A, md. 29)**


    - **A:** Damping marjı %1,8 < %2 → ihmal edilebilir; A bakımından soruşturma kapatılır (md. 29/1).

    - İthalat payı %3''ün altında olan ülkeler: B (%2,6), C (%2,9), E (%2,5). Toplam = 2,6 + 2,9 + 2,5 = **%8,0 > %7** → ithalat
    miktarı ihmal edilebilir düzeyde değildir; B, C ve E bakımından bu ölçütle kapatma yapılamaz. D (%5,5 ≥ %3) zaten kapsam
    dışıdır.

    - E olmasaydı: B + C = 2,6 + 2,9 = **%5,5 ≤ %7** → B ve C bakımından ithalat miktarı ihmal edilebilir düzeydedir; soruşturma
    bu ülkeler için kapatılır. D bakımından soruşturma sürer.


