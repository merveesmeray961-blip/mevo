- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye, kaçakçılık, muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: 5607 md. 16/1 tasfiye kararı süresi
  tip: bilgi
  zorluk: 2
  kok: 5607 sayılı Kaçakçılıkla Mücadele Kanunu'nun 16. maddesinin birinci fıkrasına göre, kaçak şüphesiyle el konulan (akaryakıt
    dışındaki) eşya hakkında tasfiye kararının verilmesi için öngörülen süre ve bu sürenin kısalması koşulu aşağıdakilerden
    hangisidir?
  secenekler:
    A: Altı ay; eşyanın zarara uğraması, değer kaybı tehlikesi veya muhafaza külfeti hâlinde bir ay
    B: El koyma tarihinden itibaren bir yıl; eşyanın zarara uğraması hâlinde altı ay
    C: El koyma tarihinden itibaren üç ay; eşyanın zarara uğraması hâlinde on beş gün
    D: Soruşturmanın tamamlanmasından itibaren altı ay; muhafazanın külfetli olması hâlinde bir ay
    E: El koyma tarihinden itibaren altı ay; süre hiçbir koşulda kısaltılamaz
  dogru: A
  aciklama:
    dogru_neden: 'Md. 16/1: Kaçak akaryakıt hariç her türlü eşya hakkında el koyma tarihinden itibaren altı ay, eşyanın zarara
      uğraması, değerinde esaslı kayıp tehlikesi veya muhafazasının ciddi külfet oluşturması hâlinde ise bir ay içinde tasfiye
      kararı verilir.'
    celdiriciler:
      B: Kanundaki süreler bir yıl ve altı ay değil, altı ay ve bir aydır.
      C: Süreler üç ay ve on beş gün değildir; altı ay ve bir ay öngörülmüştür.
      D: Süre soruşturmanın tamamlanmasından değil, el koyma tarihinden başlar.
      E: Kanun, belirtilen üç hâlde süreyi bir aya indirir.
  kaynaklar:
  - mevzuat: 5607 sayılı Kaçakçılıkla Mücadele Kanunu
    madde: md. 16/1
    alinti: Kaçak şüphesiyle el konulan kaçak akaryakıt hariç her türlü eşya hakkında, el koyma tarihinden itibaren altı ay,
      ancak eşyanın zarara uğraması veya değerinde esaslı ölçüde kayıp meydana gelme tehlikesinin varlığı veya muhafazasının
      ciddi külfet oluşturması halinde bir ay içinde, gerekli tespitler yaptırılarak soruşturma aşamasında hâkim, kovuşturma
      aşamasında mahkeme tarafından tasfiye kararı verilir.
  gecerlilik:
    baslangic: '2013-04-11'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim: &id001
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: DTK
  unite: Tasfiye, kaçakçılık, muafiyetler ve ticaret politikası önlemleri
  konu: TKP
  kazanim: Tasfiye Yönetmeliği md. 35 ihale teminatı
  tip: uygulama
  zorluk: 2
  kok: Tasfiye Yönetmeliği'ne göre ihale yoluyla yapılacak satışlarda, ihaleye esas bedeli 4.000.000 TL olan eşyaya yönelik
    arttırmaya katılacaklardan alınacak teminat bedeli kaç TL'dir?
  secenekler:
    A: 40.000 TL
    B: 100.000 TL
    C: 200.000 TL
    D: 400.000 TL
    E: 1.000.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 35/1: Teminat, eşyanın ihaleye esas bedelinin en az yüzde onu oranındadır; ihaleye esas bedeli 1.000.000
      TL’yi geçen eşyada 100.000 TL teminat bedeli alınır. Bedel 4.000.000 TL > 1.000.000 TL olduğundan teminat 100.000 TL’dir
      (yüzde on hesabıyla 400.000 TL çıkmaz).'
    celdiriciler:
      A: 40.000 TL, yüzde birlik oran varsayımıdır; yönetmelik yüzde onu esas alır.
      C: 200.000 TL, yüzde beş oran varsayımıdır; yönetmelikte böyle bir oran yoktur.
      D: 400.000 TL, yüzde onun uygulanmasıdır; ancak ihaleye esas bedeli 1.000.000 TL’yi geçen eşyada 100.000 TL alınır.
      E: 1.000.000 TL eşik değerdir, teminat tutarı değildir.
  kaynaklar:
  - mevzuat: Tasfiye Yönetmeliği
    madde: md. 35/1
    alinti: İhale yoluyla yapılacak satışlara katılacaklardan, satış ilanı ve şartnamede belirtilen yer ve süre şartı dâhilinde
      yatırılmak kaydıyla, eşyanın ihaleye esas bedelinin en az yüzde onu oranında teminat alınır. İhaleye esas bedeli 1.000.000
      TL’yi geçen eşyada 100.000 TL teminat bedeli alınır
  gecerlilik:
    baslangic: '2018-06-03'
    bitis: null
    yila_bagli_tutar: true
  durum: taslak
  surum: 1
  uretim: *id001
