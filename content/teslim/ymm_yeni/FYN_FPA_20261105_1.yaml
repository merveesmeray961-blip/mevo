- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - birleşme ve satın alma değerlemesi
  - pay değişim oranı ve PBK etkisi
  - sinerji ve satın almanın net bugünkü değeri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Akdeniz Gıda A.Ş. (Alıcı), aynı sektörde faaliyet gösteren Toroslar Un A.Ş.''yi (Hedef) satın almayı değerlendirmektedir.
    Her iki şirketin payları borsada işlem görmektedir. Veriler:


    | Veri | Alıcı | Hedef |

    |---|---|---|

    | Net dönem kârı (TL) | 12.000.000 | 3.000.000 |

    | Dolaşımdaki pay sayısı | 4.000.000 | 1.000.000 |

    | Pay fiyatı (TL) | 45 | 30 |


    Hedef paylarının tamamı için pay başına 36 TL teklif edilmiştir. Birleşmeden doğacak yıllık vergi sonrası sinerji 600.000
    TL olup süresiz devam edecek ve %15 oranıyla iskonto edilecektir. Birleşmede kârların toplamdan başka bir etki yaratmadığı
    (sinerji hariç) kabul edilecektir.


    **İstenenler:**


    (a) Teklifin Alıcı payı cinsinden **pay değişim oranını**, ihraç edilecek yeni pay sayısını ve sinerji dikkate alınmadan
    birleşme sonrası PBK''yı hesaplayarak PBK''daki artış ya da azalışı bulunuz. (6 puan)


    (b) Sinerji dahil birleşme sonrası PBK''yı hesaplayınız. Birleşme sonrası PBK''nın değişmemesi için ödenebilecek en yüksek
    pay değişim oranını ve buna karşılık gelen pay başına teklif tutarını bulunuz. (6 puan)


    (c) Satın alma pay değişimi yerine, tamamı yıllık %25 faizli borçla finanse edilen nakit ödemeyle yapılırsa (vergi oranı
    %20) birleşme sonrası PBK''yı hesaplayınız. (5 puan)


    (d) Satın almanın Alıcı ortakları açısından net bugünkü değerini (NBD) hesaplayınız; PBK artışına bakarak karar vermenin
    neden yanıltıcı olabileceğini açıklayınız ve ödenebilecek en yüksek pay başına bedeli bulunuz. (8 puan)

    '
  cozum: '**(a) Değişim oranı ve PBK**


    Alıcı payı başına PBK = 12.000.000 / 4.000.000 = 3 TL; Hedef payı başına PBK = 3.000.000 / 1.000.000 = 3 TL.


    Pay değişim oranı = Teklif / Alıcı pay fiyatı = 36 / 45 = **0,8** (her Hedef payına 0,8 adet Alıcı payı).


    İhraç edilecek yeni pay = 0,8 × 1.000.000 = **800.000** adet; birleşme sonrası pay sayısı = 4.000.000 + 800.000 = 4.800.000.


    Birleşik net kâr = 12.000.000 + 3.000.000 = 15.000.000 TL → PBK = 15.000.000 / 4.800.000 = **3,125 TL**.


    PBK değişimi = 3,125 − 3 = **+0,125 TL** (yaklaşık %4,17 artış). Nedeni: Alıcı, Hedef''e ödediği fiyat/kazanç oranından
    (36 / 3 = 12) daha yüksek bir F/K ile (45 / 3 = 15) değerlenmektedir; yüksek F/K''lı şirketin düşük F/K''lı şirketi pay
    değişimiyle alması PBK''yı artırır.


    **(b) Sinerji dahil PBK ve azami değişim oranı**


    PBK (sinerji dahil) = (15.000.000 + 600.000) / 4.800.000 = **3,25 TL**.


    PBK''nın değişmemesi için toplam pay sayısı en çok 15.000.000 / 3 = 5.000.000 olabilir → ihraç edilebilecek yeni pay en
    çok 1.000.000 adet.


    Azami değişim oranı = 1.000.000 / 1.000.000 = **1**; karşılık gelen pay başına teklif = 1 × 45 = **45 TL** (= Alıcı F/K''sı
    15 × Hedef PBK''sı 3).


    **(c) Borçla nakit satın alma**


    Toplam bedel = 36 × 1.000.000 = 36.000.000 TL. Vergi sonrası faiz = 36.000.000 × %25 × (1 − 0,20) = 7.200.000 TL.


    Birleşik net kâr = 15.000.000 − 7.200.000 = 7.800.000 TL; pay sayısı değişmediğinden PBK = 7.800.000 / 4.000.000 = **1,95
    TL** (PBK düşer; vergi sonrası borç maliyeti %20, Hedef''in kazanç verimi olan 3 / 36 = %8,33''ün çok üzerindedir).


    **(d) NBD ve karar**


    Sinerjinin bugünkü değeri = 600.000 / %15 = 4.000.000 TL.


    NBD = Hedef''in bağımsız değeri + sinerji − ödenen bedel = 1.000.000 × 30 + 4.000.000 − 36.000.000 = **-2.000.000 TL**.


    Ödenen prim (6.000.000 TL) sinerjinin bugünkü değerini (4.000.000 TL) aştığı için satın alma Alıcı ortakları açısından
    değer yok eder. Pay değişimiyle PBK''nın artması bu sonucu değiştirmez; PBK artışı muhasebesel bir göstergedir, ödenen
    primin sinerjiyle karşılanıp karşılanmadığını, nakit akımlarının zaman değerini ve riski dikkate almaz.


    Ödenebilecek en yüksek pay başına bedel = 30 + 4.000.000 / 1.000.000 = **34 TL** (NBD = 0).

    '
  puanlama:
  - olcut: (a) Değişim oranı ve yeni pay sayısı
    puan: 3
  - olcut: (a) Birleşik PBK ve PBK değişimi, F/K ile açıklama
    puan: 3
  - olcut: (b) Sinerjili PBK
    puan: 2
  - olcut: (b) Azami değişim oranı ve karşılık gelen teklif
    puan: 4
  - olcut: (c) Vergi sonrası faiz ve borçlu PBK
    puan: 5
  - olcut: (d) Sinerjinin bugünkü değeri ve NBD
    puan: 4
  - olcut: (d) PBK artışının yanıltıcılığı ve azami bedel (34 TL)
    puan: 4
  kaynaklar:
  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  dogrulama:
    python: "a_nk = 12000000\na_pay = 4000000\na_fiyat = 45\nh_nk = 3000000\nh_pay = 1000000\nh_fiyat = 30\nteklif = 36\n\
      sin = 600000\nk = 0.15\nfz = 0.25\nvo = 0.20\na_pbk = a_nk / a_pay\nh_pbk = h_nk / h_pay\noran = teklif / a_fiyat\n\
      yeni_pay = oran * h_pay\ntoplam_pay = a_pay + yeni_pay\nb_nk = a_nk + h_nk\npbk_sinerjisiz = b_nk / toplam_pay\nartis\
      \ = pbk_sinerjisiz - a_pbk\nartis_yuzde = artis / a_pbk\npbk_sinerjili = (b_nk + sin) / toplam_pay\n# PBK'nin degismemesi\
      \ icin ihrac edilebilecek en fazla pay\nmaks_toplam_pay = b_nk / a_pbk\nmaks_yeni = maks_toplam_pay - a_pay\nmaks_oran\
      \ = maks_yeni / h_pay\nmaks_teklif_pbk = maks_oran * a_fiyat\nbedel = teklif * h_pay\nfaiz_vs = bedel * fz * (1 - vo)\n\
      borc_nk = b_nk - faiz_vs\nborc_pbk = borc_nk / a_pay\nsin_pv = sin / k\nnbd = h_pay * h_fiyat + sin_pv - bedel\nmaks_bedel\
      \ = h_fiyat + sin_pv / h_pay\nprim = bedel - h_pay * h_fiyat\nsonuc = {\"oran\": oran, \"yeni_pay\": yeni_pay, \"pbk_sinerjisiz\"\
      : pbk_sinerjisiz, \"artis\": artis,\n         \"pbk_sinerjili\": pbk_sinerjili, \"maks_oran\": maks_oran, \"maks_teklif_pbk\"\
      : maks_teklif_pbk,\n         \"borc_pbk\": borc_pbk, \"sin_pv\": sin_pv, \"nbd\": nbd, \"maks_bedel\": maks_bedel, \"\
      prim\": prim}\n"
