- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: FPA
  kazanimlar:
  - genişletilmiş (beş faktörlü) DuPont analizi
  - özkaynak kârlılığı değişiminin ayrıştırılması
  - faiz karşılama oranı ve finansal yapı yorumu
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Güney Ambalaj A.Ş.''nin iki yıla ait özet finansal verileri aşağıdadır (bin TL). Her iki yılda kurumlar vergisi oranı
    %25''dir; bilanço kalemleri yıl sonu değerleridir.


    | Kalem | 2024 | 2025 |

    |---|---|---|

    | Net satışlar | 40.000 | 60.000 |

    | Faiz ve vergi öncesi kâr (FVÖK) | 4.000 | 4.800 |

    | Faiz gideri | 800 | 1.200 |

    | Toplam aktif | 20.000 | 30.000 |

    | Özkaynak | 10.000 | 12.000 |


    **İstenenler:**


    (a) Her iki yıl için vergi yükü (net kâr / vergi öncesi kâr), faiz yükü (vergi öncesi kâr / FVÖK), FVÖK marjı, aktif devir
    hızı ve özkaynak çarpanını hesaplayarak özkaynak kârlılığını (ÖKK) beş faktörlü DuPont çarpımıyla bulunuz; sonucu net
    kâr / özkaynak oranıyla doğrulayınız. (8 puan)


    (b) ÖKK''daki değişimi, faktörleri yukarıdaki sırayla art arda 2024 değerinden 2025 değerine değiştirerek (zincirleme
    ikame) her faktörün katkısına ayrıştırınız. (8 puan)


    (c) 2026''da diğer dört faktör 2025 düzeyinde kalmak koşuluyla ÖKK''nın %27 olması isteniyorsa FVÖK marjı en az ne olmalıdır?
    Bu marjla satışlar 60.000 bin TL kalırsa gerekli FVÖK''ü bulunuz. (5 puan)


    (d) Faiz karşılama oranını (FVÖK / faiz gideri) ve borç oranını (yabancı kaynak / aktif) iki yıl için hesaplayarak ÖKK''nın
    düşmesine rağmen yükselen özkaynak çarpanının riski nasıl etkilediğini yorumlayınız. (4 puan)

    '
  cozum: '**(a) Beş faktörlü DuPont**


    Önce vergi öncesi kâr (VÖK) ve net kâr: 2024''te VÖK = 4.000 − 800 = 3.200, net kâr = 3.200 × 0,75 = 2.400; 2025''te VÖK
    = 4.800 − 1.200 = 3.600, net kâr = 3.600 × 0,75 = 2.700 (bin TL).


    | Faktör | 2024 | 2025 |

    |---|---|---|

    | Vergi yükü (NK / VÖK) | 0,75 | 0,75 |

    | Faiz yükü (VÖK / FVÖK) | 0,8 | 0,75 |

    | FVÖK marjı (FVÖK / satış) | %10 | %8 |

    | Aktif devir hızı (satış / aktif) | 2 | 2 |

    | Özkaynak çarpanı (aktif / özkaynak) | 2 | 2,5 |

    | **ÖKK (çarpım)** | **%24,0** | **%22,5** |


    Doğrulama: 2024''te 2.400 / 10.000 = %24,0; 2025''te 2.700 / 12.000 = %22,5. ✔


    **(b) Zincirleme ikame (sıra: vergi yükü → faiz yükü → FVÖK marjı → devir hızı → özkaynak çarpanı)**


    | Adım | Değişen faktör | ÖKK | Katkı (puan) |

    |---|---|---|---|

    | Başlangıç | — | %24,0 | — |

    | 1 | Vergi yükü | %24,0 | 0,0 puan |

    | 2 | Faiz yükü | %22,5 | -1,5 puan |

    | 3 | FVÖK marjı | %18,0 | -4,5 puan |

    | 4 | Devir hızı | %18,0 | 0,0 puan |

    | 5 | Özkaynak çarpanı | %22,5 | +4,5 puan |


    Toplam değişim = -1,5 puan (ÖKK %24,0 düzeyinden %22,5 düzeyine inmiştir). Faiz yükünün artması ve FVÖK marjının düşmesi
    ÖKK''yı aşağı çekmiş, özkaynak çarpanındaki artış (daha çok borçlanma) bu düşüşü büyük ölçüde dengelemiştir. Vergi oranı
    ve devir hızı değişmediğinden katkıları sıfırdır.


    **(c) Hedef ÖKK**


    Gerekli FVÖK marjı = %27 / (vergi yükü × faiz yükü × devir hızı × çarpan) = %27 / (0,75 × 0,75 × 2 × 2,5) = **%9,6**.


    Satışlar 60.000 bin TL ise gerekli FVÖK = 60.000 × 0,096 = **5.760 bin TL** (2025''te 4.800 bin TL).


    **(d) Yorum**


    | Oran | 2024 | 2025 |

    |---|---|---|

    | Faiz karşılama oranı (FVÖK / faiz) | 5 | 4 |

    | Borç oranı (yabancı kaynak / aktif) | %50 | %60 |


    Özkaynak çarpanı 2''den 2,5''e çıkmış, borç oranı %50''den %60''a yükselmiş, faiz karşılama oranı 5''ten 4''e gerilemiştir.
    ÖKK''daki düşüş sınırlı kalmış gibi görünse de bu sonuç daha yüksek finansal risk pahasına elde edilmiştir; işletme faaliyet
    kârlılığındaki (FVÖK marjı) bozulmayı borçla telafi etmektedir.

    '
  puanlama:
  - olcut: (a) İki yıl için beş faktörün doğru hesabı
    puan: 5
  - olcut: (a) ÖKK çarpımı ve net kâr/özkaynak ile doğrulama
    puan: 3
  - olcut: (b) Zincirleme ikame tablosu (adımların doğru kurulması)
    puan: 5
  - olcut: (b) Faktör katkıları ve toplamın değişime eşitliği
    puan: 3
  - olcut: (c) Gerekli FVÖK marjı (%9,6)
    puan: 3
  - olcut: (c) Gerekli FVÖK tutarı
    puan: 2
  - olcut: (d) Faiz karşılama ve borç oranları
    puan: 2
  - olcut: (d) Finansal risk yorumu
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  dogrulama:
    python: "t = 0.25\ns0 = 40000\ns1 = 60000\nf0 = 4000\nf1 = 4800\ni0 = 800\ni1 = 1200\na0 = 20000\na1 = 30000\ne0 = 10000\n\
      e1 = 12000\nhedef = 0.27\ndef fak(s, f, i, a, e):\n    vok = f - i\n    nk = vok * (1 - t)\n    return {\"vok\": vok,\
      \ \"nk\": nk, \"vy\": nk / vok, \"fy\": vok / f, \"marj\": f / s, \"devir\": s / a, \"carpan\": a / e, \"okk\": nk /\
      \ e}\ny0 = fak(s0, f0, i0, a0, e0)\ny1 = fak(s1, f1, i1, a1, e1)\nvok0, nk0, vy0, fy0, m0, d0, c0, roe0 = y0[\"vok\"\
      ], y0[\"nk\"], y0[\"vy\"], y0[\"fy\"], y0[\"marj\"], y0[\"devir\"], y0[\"carpan\"], y0[\"okk\"]\nvok1, nk1, vy1, fy1,\
      \ m1, d1, c1, roe1 = y1[\"vok\"], y1[\"nk\"], y1[\"vy\"], y1[\"fy\"], y1[\"marj\"], y1[\"devir\"], y1[\"carpan\"], y1[\"\
      okk\"]\ncarp0 = vy0 * fy0 * m0 * d0 * c0\ncarp1 = vy1 * fy1 * m1 * d1 * c1\n# zincirleme ikame\nr_a = vy1 * fy0 * m0\
      \ * d0 * c0\nr_b = vy1 * fy1 * m0 * d0 * c0\nr_c = vy1 * fy1 * m1 * d0 * c0\nr_d = vy1 * fy1 * m1 * d1 * c0\nr_e = vy1\
      \ * fy1 * m1 * d1 * c1\nk_vy = r_a - roe0\nk_fy = r_b - r_a\nk_marj = r_c - r_b\nk_devir = r_d - r_c\nk_carpan = r_e\
      \ - r_d\ntoplam_deg = roe1 - roe0\nhedef_marj = hedef / (vy1 * fy1 * d1 * c1)\nhedef_fvok = hedef_marj * s1\nfko0 =\
      \ f0 / i0\nfko1 = f1 / i1\nbo0 = 1 - e0 / a0\nbo1 = 1 - e1 / a1\nsonuc = {\"roe0\": roe0, \"roe1\": roe1, \"k_vy\":\
      \ k_vy, \"k_fy\": k_fy, \"k_marj\": k_marj, \"k_devir\": k_devir, \"k_carpan\": k_carpan,\n         \"toplam\": toplam_deg,\
      \ \"hedef_marj\": hedef_marj, \"hedef_fvok\": hedef_fvok, \"fko0\": fko0, \"fko1\": fko1, \"bo0\": bo0, \"bo1\": bo1}\n"
