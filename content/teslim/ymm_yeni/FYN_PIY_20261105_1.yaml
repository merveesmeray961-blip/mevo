  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
  dogrulama:
    python: 'b, adet, ilk, idame = 100, 5, 4000, 3000

      f0, f1, f2 = 200, 192, 188

      hesap0 = ilk * adet

      hesap1 = hesap0 + (f1 - f0) * b * adet

      cagri1 = (ilk * adet - hesap1) if hesap1 < idame * adet else 0

      hesap1b = hesap1 + cagri1

      hesap2 = hesap1b + (f2 - f1) * b * adet

      sonuc = (ilk * adet - hesap2) if hesap2 < idame * adet else 0

      yanlis = {"a": idame * adet - hesap2, "b": (f1 - f2) * b * adet, "c": (f0 - f1) * b * adet, "d": 2 * ilk * 1}

      '
