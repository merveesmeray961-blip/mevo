  kok: Bir yatırımcı, her biri 100 birimlik 5 adet vadeli işlem sözleşmesi almıştır (uzun pozisyon) ve sözleşme başına 4.000
    TL başlangıç teminatı yatırmıştır. Sözleşme başına koruma (idame) teminatı 3.000 TL'dir. Alış fiyatı birim başına 200
    TL iken ardışık iki gün sonunda uzlaşma fiyatları 192 TL ve 188 TL olmuştur. Teminat hesabı koruma düzeyinin altına düşerse
    başlangıç düzeyine tamamlanması istenmektedir. İkinci günün sonunda yatırılması istenen ilave teminat kaç TL'dir? (Sözleşmeler
    hesabın tamamı üzerinden değerlenir, faiz gelirleri yoksayılır.)
  secenekler:
    A: '1.000'
    B: '2.000'
    C: '4.000'
    D: '6.000'
    E: '8.000'
  dogru: D
  aciklama:
    dogru_neden: 'Başlangıç hesabı = 4.000 × 5 = 20.000 TL; koruma düzeyi 15.000 TL. 1. gün kaybı = (200 − 192) × 100 × 5
      = 4.000 TL → hesap 16.000 TL (koruma düzeyinin üstünde, çağrı yok). 2. gün kaybı = (192 − 188) × 100 × 5 = 2.000 TL
      → hesap 14.000 TL < 15.000 TL → başlangıç düzeyine tamamlama: 20.000 − 14.000 = 6.000 TL. Püf noktaları: (1) çağrı eşiği
      koruma düzeyidir, ama tamamlama başlangıç düzeyine yapılır; (2) tüm sözleşmelerin toplamı alınır; (3) ilk gün çağrı
      olmadığı için kayıp birikir.'
    celdiriciler:
      A: Koruma düzeyine tamamlanmış; teminat çağrısında hesap başlangıç düzeyine getirilir.
      B: Yalnızca ikinci günün kaybıdır; hesabın birikmiş bakiyesi dikkate alınmamıştır.
      C: Yalnızca ilk günün kaybıdır; ilk gün çağrı yoktur ve ikinci günün kaybı hesaba katılmamıştır.
      E: Sözleşme başına başlangıç teminatı gün sayısıyla çarpılmış; tamamlama tutarı hesap bakiyesindeki eksiklikle belirlenir.
    hesap_adimlari:
    - Eşik koruma, tamamlama başlangıç
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — vadeli işlemlerde teminat tamamlama çağrısı
    madde: '-'
    alinti: ''
