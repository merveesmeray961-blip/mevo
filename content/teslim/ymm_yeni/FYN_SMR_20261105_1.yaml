    WACC en düşük, firma değeri en yüksek olan %40 borç oranı optimal yapıdır (WACC %27,00).


    **(d)** %40''ta borç maliyeti %30 olursa vergi sonrası kd = %22,5 ve WACC = 0,6 × %32,0 + 0,4 × %22,5 = **%28,20**. Bu
