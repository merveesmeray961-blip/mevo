    (b) Her borç oranı için vergi sonrası borç maliyetini ve WACC''yi hesaplayınız. (6 puan)


    (c) Her borç oranında firma değerini (V = FVÖK (1 − t) / WACC) hesaplayarak optimal sermaye yapısını belirleyiniz. (6
    puan)


    (d) %40 borç oranında borç maliyeti %30 olursa optimal yapı değişir mi? Gösteriniz. (7 puan)

    '
  cozum: 'NOPAT = 6.000.000 × (1 − %25) = 4.500.000 TL.


    **(a) Özkaynak maliyeti**


    | D/V | D/E | β_L = 1 + 0,75 × D/E | r_E = %20 + β_L × %8 |

    |---|---|---|---|

    | %0 | 0 | 1 | %28,0 |

    | %20 | 0,250 | 1,1875 | %29,5 |

    | %40 | 0,6667 | 1,5 | %32,0 |

    | %60 | 1,5 | 2,125 | %37,0 |


    **(b) WACC**


    | D/V | Vergi sonrası kd | WACC |

    |---|---|---|

    | %0 | — | %28,00 |

    | %20 | %18,0 | 0,8 × %29,5 + 0,2 × %18,0 = **%27,20** |

    | %40 | %19,5 | 0,6 × %32,0 + 0,4 × %19,5 = **%27,00** |

    | %60 | %24,0 | 0,4 × %37,0 + 0,6 × %24,0 = **%29,20** |


    **(c) Firma değeri**


    | D/V | Firma değeri (TL) |

