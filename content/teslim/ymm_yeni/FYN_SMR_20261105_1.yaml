    python: 'wacc_f = 0.28

      b1 = 1.40

      de1 = 0.50

      b2 = 1.44

      de2 = 0.25

      t = 0.20

      hde = 0.25

      kd = 0.28

      rf = 0.20

      rm = 0.30

      irr = 0.30

      bu1 = b1 / (1 + (1 - t) * de1)

      bu2 = b2 / (1 + (1 - t) * de2)

      bu = (bu1 + bu2) / 2

      bl = bu * (1 + (1 - t) * hde)

      re = rf + bl * (rm - rf)

      w_e = 1 / (1 + hde)

      w_d = hde / (1 + hde)

      kd_s = kd * (1 - t)

      wacc_p = w_e * re + w_d * kd_s

      sonuc = {"bu1": bu1, "bu2": bu2, "bu": bu, "bl": bl, "re": re, "kd_s": kd_s, "wacc_p": wacc_p}

      '
