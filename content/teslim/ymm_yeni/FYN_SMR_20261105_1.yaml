  - olcut: (b) Kayıtsızlık denklemi ve FVÖK
    puan: 4
  - olcut: (b) Kayıtsızlık PBK'sı
    puan: 2
  - olcut: (c) Beklenen PBK değerleri
    puan: 4
  - olcut: (c) Karar
    puan: 2
  - olcut: (d) Vergi sonrası maliyetler ve fark
    puan: 3
  - olcut: (d) Nedenin açıklanması
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  dogrulama:
    python: 'pay = 400000

      faiz = 1000000

      t = 0.20

      ihtiyac = 10000000

      yeni_pay = 100000

      fiyat = 100

      kd = 0.30

      ip = 0.22

      e1, e2, e3 = 8000000, 16000000, 24000000

      pr = [0.2, 0.3, 0.5]

      yeni_faiz = ihtiyac * kd

      ipk = ihtiyac * ip

      def pbk_pay(e): return (e - faiz) * (1 - t) / (pay + yeni_pay)

      def pbk_borc(e): return (e - faiz - yeni_faiz) * (1 - t) / pay

      def pbk_ip(e): return ((e - faiz) * (1 - t) - ipk) / pay

      es = [e1, e2, e3]

      P = [pbk_pay(e) for e in es]

      B = [pbk_borc(e) for e in es]

      I = [pbk_ip(e) for e in es]

      # kayitsizlik

      kay = (pay * faiz + (pay + yeni_pay) * (faiz + yeni_faiz) - 0)

      kay = ((pay + yeni_pay) * (faiz + yeni_faiz) - pay * faiz) / yeni_pay

      kay_pbk = pbk_pay(kay)

      bek_p = sum(pr[i] * P[i] for i in range(3))

      bek_b = sum(pr[i] * B[i] for i in range(3))

      bek_i = sum(pr[i] * I[i] for i in range(3))

      kd_s = kd * (1 - t)

      ip_f = I[0] - B[0]

      sonuc = {"P1": P[0], "P2": P[1], "P3": P[2], "B1": B[0], "B2": B[1], "B3": B[2], "I1": I[0], "I2": I[1], "I3": I[2],
      "kay": kay, "kay_pbk": kay_pbk, "bek_p": bek_p, "bek_b": bek_b, "bek_i": bek_i}

      '
