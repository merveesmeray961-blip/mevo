- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - FVÖK-PBK (EBIT-EPS) analizi
  - pay, borç ve imtiyazlı pay finansmanının karşılaştırılması
  - başabaş (kayıtsızlık) FVÖK düzeyi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Çelik Kalıp A.Ş.''nin 400.000 adet payı vardır ve mevcut yıllık faiz gideri 1.000.000 TL''dir. Vergi oranı %20''dir.
    Şirket, 10.000.000 TL''lik yeni yatırımı üç yoldan biriyle finanse edecektir:


    1. **Pay ihracı:** 100.000 adet yeni pay (100 TL''den).

    2. **Borç:** Yıllık %%30 faizli 10.000.000 TL borç.

    3. **İmtiyazlı pay:** Yıllık %22 kâr payı veren imtiyazlı pay (10.000.000 TL; kâr payı vergi sonrası ödenir ve vergiden
    düşülemez).


    **İstenenler:**


    (a) FVÖK''ün 8.000.000, 16.000.000 ve 24.000.000 TL olması hâllerinde üç alternatif için pay başına kazancı (PBK) hesaplayınız.
    (8 puan)


    (b) Pay ihracı ile borç alternatifleri arasında kayıtsız kalınacak FVÖK düzeyini hesaplayınız ve PBK''yı bulunuz. (6 puan)


    (c) FVÖK''ün 8.000.000 TL (%20), 16.000.000 TL (%30) ve 24.000.000 TL (%50) olasılıkla gerçekleşeceği tahmin edilmektedir.
    Her alternatifin beklenen PBK''sını hesaplayınız ve karar veriniz. (6 puan)


    (d) İmtiyazlı pay ile borç alternatifini karşılaştırınız; vergi sonrası maliyetleri hesaplayarak farkın nedenini açıklayınız.
    (5 puan)

    '
  cozum: 'Yeni faiz (borç alternatifi) = 10.000.000 × %%30 = 3.000.000 TL; imtiyazlı kâr payı = 10.000.000 × %22 = 2.200.000
    TL.


    **(a) PBK tablosu**


    | FVÖK | Pay ihracı: (FVÖK − 1.000.000) × 0,8 / 500.000 | Borç: (FVÖK − 4.000.000) × 0,8 / 400.000 | İmtiyazlı pay: ((FVÖK
    − 1.000.000) × 0,8 − 2.200.000) / 400.000 |

    |---|---|---|---|

    | 8.000.000 | **11,20** | **8,00** | **8,50** |

    | 16.000.000 | **24,00** | **24,00** | **24,50** |

    | 24.000.000 | **36,80** | **40,00** | **40,50** |


    **(b) Kayıtsızlık noktası (pay = borç)**


    (FVÖK − 1.000.000) / 500.000 = (FVÖK − 4.000.000) / 400.000 → 400.000 FVÖK − 400.000 × 1.000.000 = 500.000 FVÖK − 500.000
    × 4.000.000 → **FVÖK = 16.000.000 TL**; PBK = **24,00 TL**. FVÖK bu düzeyin üzerinde ise borç, altındaysa pay ihracı daha
    yüksek PBK sağlar.


    **(c) Beklenen PBK**


    - Pay ihracı: 0,2 × 11,20 + 0,3 × 24,00 + 0,5 × 36,80 = **27,84**

    - Borç: 0,2 × 8,00 + 0,3 × 24,00 + 0,5 × 40,00 = **28,80**

    - İmtiyazlı pay: **29,30**


    Beklenen PBK en yüksek olan imtiyazlı pay finansmanıdır; borç ikinci sıradadır. Borç, kötü senaryoda (FVÖK 8.000.000)
    PBK''yı en çok düşüren (riskli) seçenektir (8,00); pay ihracı PBK dalgalanmasının en az olduğu alternatiftir.


    **(d) İmtiyazlı pay – borç**


    Borcun vergi sonrası maliyeti = %30 × (1 − 0,20) = **%24**; imtiyazlı payın maliyeti (vergi kalkanı yok) = **%22**. İmtiyazlı
    pay vergi sonrası daha ucuz olduğundan her FVÖK düzeyinde PBK, borçtan pay başına 0,50 TL (= (%24 − %22) × 10.000.000
    / 400.000) yüksektir. İmtiyazlı pay, ödenmediğinde temerrüt yaratmadığı için finansal risk bakımından da borçtan daha
    esnektir; ancak bu gerekçe sayısal sonucun nedeni değildir.

    '
