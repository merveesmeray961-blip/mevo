- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: SMR
  kazanimlar:
  - beta ayrıştırma (unlever) ve yeniden yükleme (relever)
  - farklı faaliyet alanındaki proje için sermaye maliyeti
  - CAPM ve WACC ile proje karar ölçütü
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Kuzey Petrokimya A.Ş. (mevcut WACC %28) biyoplastik üretimine girmeyi düşünmektedir. Bu işkolunda faaliyet gösteren
    iki halka açık benzer şirketin verileri:


    | Şirket | Kaldıraçlı beta | Borç/Özkaynak (piyasa) | Vergi oranı |

    |---|---|---|---|

    | P1 | 1,4 | 0,5 | %20 |

    | P2 | 1,44 | 0,25 | %20 |


    Proje, 0,25 borç/özkaynak oranıyla finanse edilecek (borcun vergi öncesi maliyeti %28); risksiz faiz %20, piyasa beklenen
    getirisi %30, vergi oranı %20''dir. Proje, %30 iç verim oranı sağlamaktadır. Beta için Hamada denklemi (β_L = β_U [1 +
    (1 − t) D/E]) kullanılacaktır.


    **İstenenler:**


    (a) İki benzer şirketin kaldıraçsız betasını (varlık betası) hesaplayınız. (6 puan)


    (b) Ortalama kaldıraçsız betayı bulup projenin hedef sermaye yapısına göre kaldıraçlı betasını hesaplayınız. (5 puan)


    (c) Proje için CAPM''e göre özkaynak maliyetini ve projenin WACC''sini hesaplayınız. (8 puan)


    (d) İç verim oranını mevcut WACC ile ve proje WACC''si ile karşılaştırarak kararı veriniz; şirketin kendi WACC''sini kullanmasının
    neden hatalı olduğunu açıklayınız. (6 puan)

    '
  cozum: '**(a)** β_U = β_L / [1 + (1 − t) D/E]

    - P1: 1,4 / (1 + 0,8 × 0,5) = 1,4 / 1,4 = **1**

    - P2: 1,44 / (1 + 0,8 × 0,25) = 1,44 / 1,2 = **1,2**


    **(b)** Ortalama β_U = (1 + 1,2) / 2 = **1,1**. Hedef D/E = 0,25 → β_L = 1,1 × (1 + 0,8 × 0,25) = 1,1 × 1,2 = **1,32**.


    **(c)** r_E = %20 + 1,32 × (%30 − %20) = **%33,2**. Vergi sonrası borç maliyeti = %28 × 0,8 = %22,40. Ağırlıklar: E/V
    = 1/1,25 = %80, D/V = %20.


    WACC (proje) = 0,80 × %33,2 + 0,20 × %22,40 = **%31,04**.


    **(d)** İç verim oranı %30, şirketin mevcut WACC''sinden (%28) yüksek olduğu için o oranla proje kabul edilirdi; ancak
    projenin riskine uygun WACC %31,04 olup iç verim oranı bunun altında kaldığından proje **reddedilmelidir**. Şirketin kendi
    WACC''si mevcut faaliyetlerin riskini yansıtır; yeni işkolunun sistematik riski (beta) farklıysa gerekli getiri de farklıdır.
    Doğru yöntem, projeyle aynı riskteki şirketlerin betasından hareket edip projenin finansman yapısına göre yeniden yüklemektir.

    '
  puanlama:
  - olcut: (a) Her şirket için β_U
    puan: 6
  - olcut: (b) Ortalama β_U ve β_L
    puan: 5
  - olcut: (c) r_E
