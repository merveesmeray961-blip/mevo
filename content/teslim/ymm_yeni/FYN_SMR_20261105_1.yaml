  konu: SMR
  kazanimlar:
  - 'statik denge (trade-off) teorisi: vergi kalkanı ve finansal sıkıntı maliyeti'
  - optimal borç düzeyi ve marjinal analiz
  - ima edilen WACC
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Borçsuz Karadeniz Madencilik A.Ş.''nin değeri 40.000.000 TL''dir (kalıcı vergi sonrası işletme kârı 6.000.000 TL,
    borçsuz özkaynak maliyeti %15). Vergi oranı %20''dir. Kalıcı borç düzeyi arttıkça finansal sıkıntı yaşama olasılığı yükselmekte,
    sıkıntı hâlinde firma değerinin %20''si (8.000.000 TL) kaybedilmektedir. Beklenen finansal sıkıntı maliyeti = olasılık
    × kayıp''tır.


    | Kalıcı borç (D) | 0 | 10.000.000 | 20.000.000 | 30.000.000 |

    |---|---|---|---|---|

    | Finansal sıkıntı olasılığı | %0 | %2 | %8 | %45 |


    **İstenenler:**


    (a) Her borç düzeyi için faiz vergi kalkanının bugünkü değerini (t × D) bulunuz. (4 puan)


    (b) Her borç düzeyi için beklenen finansal sıkıntı maliyetini bulunuz. (4 puan)


    (c) Kaldıraçlı firma değerini V_L = V_U + t × D − beklenen sıkıntı maliyeti formülüyle hesaplayarak optimal borç düzeyini
    belirleyiniz. (8 puan)


    (d) Borcun 20 milyon TL''den 30 milyon TL''ye çıkarılmasının marjinal faydasını (ek vergi kalkanı) ve marjinal maliyetini
    (beklenen sıkıntı maliyetindeki artış) karşılaştırınız. (4 puan)


    (e) Her borç düzeyinde ima edilen WACC''yi (WACC = NOPAT / V_L) hesaplayarak en düşük WACC''nin optimal borç düzeyiyle
    aynı noktada olduğunu gösteriniz. (5 puan)

    '
  cozum: '**(a)** Vergi kalkanı t × D: 0, 2.000.000, 4.000.000, 6.000.000 TL.


    **(b)** Kayıp = 40.000.000 × %20 = 8.000.000 TL. Beklenen maliyet: 0, 160.000, 640.000, 3.600.000 TL.


    **(c)**


    | D | V_U | + Vergi kalkanı | − Beklenen sıkıntı maliyeti | V_L |

    |---|---|---|---|---|

    | 0 | 40.000.000 | 0 | 0 | **40.000.000** |

    | 10.000.000 | 40.000.000 | 2.000.000 | 160.000 | **41.840.000** |

    | 20.000.000 | 40.000.000 | 4.000.000 | 640.000 | **43.360.000** |

    | 30.000.000 | 40.000.000 | 6.000.000 | 3.600.000 | **42.400.000** |


    Firma değeri en yüksek olan düzey **20.000.000 TL** borçtur (43.360.000 TL).


    **(d)** 20 → 30 milyon TL: ek vergi kalkanı = **2.000.000 TL**; beklenen sıkıntı maliyetindeki artış = **2.960.000 TL**.
    Marjinal maliyet marjinal faydayı aştığından net etki -960.000 TL''dir (değer kaybı); borç bu noktadan sonra artırılmamalıdır.


    **(e)** NOPAT = 40.000.000 × %15 = 6.000.000 TL. WACC = NOPAT / V_L: D = 0 için **%15,00**, 10 milyon için **%14,34**,
    20 milyon için **%13,84**, 30 milyon için **%14,15**. En düşük WACC 20 milyon TL borçta oluşur; WACC''yi en küçükleyen
    yapı firma değerini en büyükleyen yapıdır.

    '
