  soru: 'Anadolu Gıda A.Ş.''nin finansman kaynaklarına ilişkin veriler (vergi oranı %20):


    - **Tahvil:** Nominal 1.000 TL, yıllık kupon %20 (yıl sonunda), vadesine 2 yıl var; piyasa fiyatı 928 TL.

    - **İmtiyazlı pay:** Nominal 100 TL, yıllık kâr payı %24 (24 TL); ihraç fiyatı 100 TL, ihraç maliyeti %4.

    - **Dönüştürülebilir tahvil:** Nominal, kupon ve vade yukarıdaki tahvil ile aynıdır; 20 adet paya dönüştürülebilir; payın
    piyasa fiyatı 40 TL; dönüştürülebilir tahvilin piyasa fiyatı 1.000 TL.

    - Özkaynak maliyeti %30; hedef yapı: tahvil %30, imtiyazlı pay %10, adi özkaynak %60.


    **İstenenler:**


    (a) Tahvilin vade sonuna kadar getirisini (iç verim) ve vergi sonrası maliyetini (kd × (1 − t) yaklaşımıyla) bulunuz.
    (5 puan)


    (b) İmtiyazlı payın maliyetini hesaplayınız. (4 puan)


    (c) Dönüştürülebilir tahvilin taban değerini, dönüşüm değerini, dönüşüm fiyatını, dönüşüm primini (hem dönüşüm değerine
    göre hem pay fiyatına göre) ve opsiyon değerini hesaplayınız. (8 puan)


    (d) Ağırlıklı ortalama sermaye maliyetini hesaplayınız. (8 puan)

    '
  cozum: '**(a)** Kupon = 200 TL. Getiri y: 928 = 200/(1+y) + 1.200/(1+y)². y = %25 için: 200/1,25 + 1.200/1,5625 = 160 +
    768 = 928 ✔. Tahvil getirisi (vergi öncesi) **%25**; vergi sonrası maliyet = %25 × (1 − %20) = **%20**.


    **(b)** Net ihraç geliri = 100 × (1 − %4) = 96 TL. Kâr payı vergiden düşülemez → maliyet = 24 / 96 = **%25**.


    **(c)**

    - Taban (düz tahvil) değeri = benzer tahvilin piyasa getirisiyle (%25) bugünkü değer = **928 TL**.

    - Dönüşüm değeri = 20 × 40 = **800 TL**.

    - Dönüşüm fiyatı = 1.000 / 20 = **50 TL**/pay.

    - Piyasa fiyatı (1.000) taban ve dönüşüm değerinin büyüğünün (928) üzerindedir. Dönüşüm primi: 1.000 − 800 = **200 TL**
    (dönüşüm değerine göre **%25**); dönüşüm fiyatının pay fiyatına göre primi = 50 / 40 − 1 = **%25**.

    - Gömülü opsiyon değeri = 1.000 − 928 = **72 TL**.


    **(d)** WACC = 0,30 × %20 + 0,10 × %25 + 0,60 × %30 = %6,0 + %2,5 + %18,0 = **%26,5**.

    '
