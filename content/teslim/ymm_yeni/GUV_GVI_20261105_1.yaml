    | 3 | Almanya''daki bir müşteriye verilen arayüz tasarım hizmeti | Hizmetten münhasıran yurt dışında yararlanılmaktadır;
    ancak fatura Türkiye''de yerleşik bir aracı anonim şirket adına düzenlenmiştir; kazancın tamamı Türkiye''ye transfer edilmiştir
