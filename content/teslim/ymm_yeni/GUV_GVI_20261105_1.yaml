  cozum: '**(a) Geçici vergi (GVK mükerrer md. 120)**


    Geçici vergi, üç aylık dönem kazancı üzerinden tarifenin ilk gelir dilimindeki oranla (%15) hesaplanır; aynı dönem içinde
    tevkif edilen gelir vergisi (md. 42 kazançlarından yapılan tevkifat hariç) hesaplanan geçici vergiden mahsup edilir. Md.
    42 kapsamındaki kazançlar geçici vergi matrahına dahil edilmediğinden bu işe ilişkin tevkifat da geçici vergiden mahsup
    edilmez (yıllık beyannamede mahsup edilir).


    | Dönem | Matrah | Geçici vergi (%15) | Mahsup edilecek tevkifat | Ödenecek |

    |---|---|---|---|---|

    | Ocak–Mart | 600.000 | 90.000 | 10.000 | **80.000** |

    | Nisan–Haziran | 800.000 | 120.000 | 40.000 − 15.000 = 25.000 | **95.000** |

    | Temmuz–Eylül | 400.000 | 60.000 | – | **60.000** |


    **(b) Süreler**


    Hesaplanan geçici vergi, üç aylık dönemi izleyen ikinci ayın ondördüncü günü akşamına kadar beyan edilir ve onyedinci
    günü akşamına kadar ödenir. Nisan–Haziran dönemi için beyan **14 Ağustos 2026**, ödeme **17 Ağustos 2026** tarihine kadar
    yapılır.


    **(c) Yıllık beyanname**


    Md. 42 kapsamındaki işin kârı işin bittiği yılın geliri sayılarak o yıl beyannamesinde gösterilir; geçici vergi matrahına
    ise dahil edilmez. Yıllık matrah = 2.500.000 + 700.000 = 3.200.000 TL.


    Hesaplanan vergi: 1.000.000 TL için 232.500 TL + (3.200.000 − 1.000.000) × %35 = 232.500 + 770.000 = **1.002.500 TL**.


    Mahsuplar: tevkif edilen vergiler (md. 121) 120.000 TL ve ödenen geçici vergiler (md. mük. 120) 400.000 TL. Ödenecek vergi
    = 1.002.500 − 120.000 − 400.000 = **482.500 TL**. Yıllık beyanname ile bildirilen gelir üzerinden tahakkuk eden vergi
    Mart ve Temmuz aylarında olmak üzere iki eşit taksitte ödenir: her taksit **241.250 TL**.


    **(d) Eksik beyan**


    Geçmiş dönemlere ait geçici verginin %10''u aşan tutarda eksik beyan edildiğinin tespiti hâlinde eksik beyan edilen kısım
    için geçici vergi tarh edilir.


    - Nisan–Haziran: gerçek geçici vergi 1.100.000 × %15 = 165.000; beyan edilen 120.000; eksik **45.000 TL**. Bu tutar beyan
    edilen geçici verginin %10''unu (12.000 TL) aşar → **geçici vergi tarh edilir**.

    - Ocak–Mart: gerçek geçici vergi 620.000 × %15 = 93.000; beyan edilen 90.000; eksik 3.000 TL, beyan edilen geçici verginin
    %10''unu (9.000 TL) aşmadığından → **tarh edilmez**.


    Mahsup süresi geçtikten sonra kesinleşen geçici vergiler terkin edilir; ancak gecikme faizi ve ceza tahsil edilir.

