  - olcut: İstisnanın tevkifata şümulü olmadığının ve tevkifatın 300.000 TL olduğunun belirtilmesi
    puan: 3
  - olcut: Mahsup sonucu 175.500 TL fazlanın tespiti ve iadenin bir yıl içinde başvuruya bağlı olduğunun belirtilmesi
    puan: 4
  - olcut: İstisnanın 2026, 2027 ve 2028 dönemleri için uygulanacağının belirtilmesi
    puan: 2
  - olcut: Beyanname süresinin 1–25 Mart 2027 olduğunun ve kazanç elde edilmese de beyan verileceğinin belirtilmesi
    puan: 3
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 20/1
    alinti: Ticari, zirai veya mesleki faaliyeti nedeniyle adlarına ilk defa gelir vergisi mükellefiyeti tesis olunan ve mükellefiyet
      başlangıç tarihi itibarıyla yirmi dokuz yaşını doldurmamış tam mükellef gerçek kişilerin, faaliyete başladıkları takvim
      yılından itibaren üç vergilendirme dönemi boyunca elde ettikleri bu kazançlarının 103 üncü maddede yazılı tarifenin
      ikinci diliminde yer alan tutara kadar olan kısmı, aşağıdaki şartlarla gelir vergisinden müstesnadır
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 20, son fıkralar
    alinti: İstisna kapsamındaki faaliyetlerden kazanç elde edilmemesi veya istisna haddinin altında kazanç elde edilmesi
      hâllerinde dahi yıllık beyanname verilir.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 20, tevkifat
    alinti: Bu istisnanın, bu Kanunun 94 üncü maddesi uyarınca tevkif suretiyle ödenecek vergiye şümulü yoktur.
  dogrulama:
    python: 'hasilat = 1500000 + 300000

      safi = hasilat - 800000

      istisna = min(safi, 400000)

      matrah = safi - istisna

      vergi = 190000*0.15 + (400000-190000)*0.20 + (matrah-400000)*0.27

      tevkifat = 1500000*0.20

      iade = tevkifat - vergi

      sonuc = {''safi'': safi, ''istisna'': istisna, ''matrah'': matrah, ''vergi'': round(vergi), ''tevkifat'': round(tevkifat),
      ''iade'': round(iade)}

      '
