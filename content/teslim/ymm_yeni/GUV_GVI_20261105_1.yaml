  soru: 'Tam mükellef gerçek kişiler Bora, Defne ve Ege''nin 2026 yılına ilişkin bilgileri aşağıdadır. Üç kişinin de faaliyetleri
    GVK mükerrer md. 20/B kapsamındaki türdendir (Bora: internet ortamında video içerik üreticiliği; Defne: mobil cihazlar
    için uygulama geliştiriciliği; Ege: internet üzerinden bireysel kurs ve eğitim hizmeti). Aksi belirtilmedikçe bu faaliyetlerin
    kazancı hasılata eşit kabul edilecek, KDV dikkate alınmayacaktır.


    | Kişi | Faaliyet ve diğer bilgiler |

    |---|---|

    | Bora | 2026 yılı toplam hasılatı 3.000.000 TL''dir ve tamamı Türkiye''de kurulu bir bankada bu faaliyet için açtırdığı
    hesap aracılığıyla tahsil edilmiştir. Eylül 2026''da bu hesaba aktarılan hasılat 400.000 TL''dir. Bora''nın ayrıca bilanço
    esasına göre tespit edilen 800.000 TL ticari kazancı vardır. |

    | Defne | Uygulama satışlarından 2026 yılında 1.200.000 TL hasılat elde etmiş ve tamamını yurt dışındaki kendi hesabına
    tahsil etmiştir; Türkiye''de bu faaliyet için banka hesabı açtırmamıştır. Faaliyetle ilgili belgelenmiş gider 300.000
    TL''dir ve başka geliri yoktur. |

    | Ege | Bireysel kurs hasılatının tamamı (6.200.000 TL) Türkiye''de açtırdığı banka hesabı aracılığıyla tahsil edilmiştir.
    Gider ve başka gelir yoktur. |


    GVK md. 103 tarifesinin 2026 yılı için dördüncü gelir diliminde yer alan tutar 5.300.000 TL''dir. 2026 yılı gelir vergisi
    tarifesi (ücret dışı gelirler; GVK md. 103, Gelir Vergisi Genel Tebliği Seri No: 332):


    | Gelir dilimi | Vergi |

    |---|---|

    | 190.000 TL''ye kadar | %15 |

    | 400.000 TL''ye kadar | 190.000 TL için 28.500 TL, fazlası %20 |

    | 1.000.000 TL''ye kadar | 400.000 TL için 70.500 TL, fazlası %27 |

    | 5.300.000 TL''ye kadar | 1.000.000 TL için 232.500 TL, fazlası %35 |

    | 5.300.000 TL''den fazlası | 5.300.000 TL için 1.737.500 TL, fazlası %40 |


    **İstenenler:**


    (a) Her bir kişinin mükerrer md. 20/B istisnasından yararlanıp yararlanamayacağını gerekçesiyle açıklayınız. (7 puan)


    (b) Bora''nın Eylül 2026''da hesaba aktarılan 400.000 TL için bankanın yapacağı tevkifatı, 2026 yılı hasılatının tamamı
    için bankalarca yapılacak toplam tevkifatı hesaplayınız; Eylül ayına ilişkin tevkifatın beyan ve ödeme tarihlerini belirtiniz.
    (6 puan)


    (c) Bora''nın başka bir ticari kazancının bulunmasının istisna bakımından etkisini açıklayınız ve yıllık beyannamesi üzerinden
    hesaplanacak gelir vergisini bulunuz. (5 puan)


    (d) Defne Hanım, istisnadan yararlandığı düşüncesiyle yıllık beyanname vermemiştir. Şartları taşımadığı sonradan tespit
    edilirse ödenmesi gereken gelir vergisini hesaplayınız ve yaptırımı açıklayınız. (7 puan)

    '
  cozum: '**(a) İstisnadan yararlanma durumu (GVK mükerrer md. 20/B)**


    İstisnadan yararlanabilmek için Türkiye''de kurulu bankalarda hesap açılması ve faaliyete ilişkin **tüm** hasılatın münhasıran
    bu hesap aracılığıyla tahsil edilmesi şarttır. Ayrıca bu kapsamdaki kazançlar toplamı, 103. maddedeki tarifenin dördüncü
    gelir diliminde yer alan tutarı (2026 için 5.300.000 TL) aşanlar istisnadan yararlanamaz.


    - **Bora:** Tüm hasılat banka hesabıyla tahsil edilmiştir ve kazancı 3.000.000 TL ile 5.300.000 TL''yi aşmamaktadır →
    **yararlanır**.

    - **Defne:** Banka hesabı açtırmamış, hasılatı yurt dışındaki hesabına tahsil etmiştir → **yararlanamaz**.

    - **Ege:** Hasılatın tamamı banka hesabıyla tahsil edilmiştir; ancak kazanç toplamı 6.200.000 TL olup 5.300.000 TL''yi
    aştığından → **yararlanamaz**.


    **(b) Bankanın tevkifatı**


    Bankalar, hesaplara aktarılan hasılat tutarı üzerinden aktarım tarihi itibarıyla %15 gelir vergisi tevkifatı yapar.


    - Eylül 2026 aktarımı: 400.000 × %15 = **60.000 TL**.

    - Yıl boyunca: 3.000.000 × %15 = **450.000 TL**.


    Bankalar bu vergiyi md. 98 ve md. 119 esaslarına göre beyan edip öder: Eylül ayına ilişkin tevkifat, ertesi ayın (Ekim
    2026) yirmiüçüncü günü akşamına kadar (**23 Ekim 2026**) muhtasar beyannameyle bildirilir ve beyanname verilecek ayın
    yirmialtıncı günü akşamına kadar (**26 Ekim 2026**) ödenir. Bu tutar üzerinden ayrıca md. 94 kapsamında tevkifat yapılmaz.


    **(c) Ticari kazancın etkisi ve vergi**


    Mükelleflerin kapsam dışı başka faaliyetlerinden kazanç veya irat elde etmesi istisnadan yararlanmalarına engel değildir.
    Bora''nın 3.000.000 TL''lik içerik üreticiliği kazancı gelir vergisinden müstesna olduğundan vergiye tabi kazancı yalnızca
    ticari kazancıdır: 800.000 TL. Vergi: 70.500 + (800.000 − 400.000) × %27 = 70.500 + 108.000 = **178.500 TL**.


    **(d) Defne Hanım**


    İstisna uygulanamadığından 1.200.000 − 300.000 = 900.000 TL ticari kazanç tamamen vergiye tabidir. Vergi: 70.500 + (900.000
    − 400.000) × %27 = 70.500 + 135.000 = **205.500 TL**. İstisnaya ilişkin şartların taşınmadığının tespit edilmesi hâlinde
    eksik tahakkuk etmiş olan vergi, vergi ziyaı cezası kesilmek suretiyle gecikme faiziyle birlikte tahsil olunur.

    '
