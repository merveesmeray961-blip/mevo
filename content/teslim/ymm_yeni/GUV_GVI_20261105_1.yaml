      C: Gündeliğin tamamı (7.200 TL) vergiye tabi sayılmıştır; oysa yalnızca memur gündeliğini aşan kısım vergilenir.
      D: Yol giderleri vergiye tabi sayılmıştır; belgeye dayanan gerçek yol giderlerinin tamamı istisnadır.
      E: Yol giderleri ve gündeliğin tamamı vergiye tabi sayılmıştır; istisna hiç dikkate alınmamıştır.
