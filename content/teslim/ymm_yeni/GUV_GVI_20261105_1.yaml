  konu: GVI
  kazanim: gider karşılıkları istisnası (md. 24/2)
  tip: hesaplama
  zorluk: 2
  kok: 'Harcırah Kanunu kapsamı dışında kalan (D) A.Ş., hizmet erbabı Bay (E)''yi 4 günlüğüne yurt içinde görevlendirmiştir.
    Şirket, belgeye dayanan gerçek yol giderlerinin tamamını (9.000 TL) ve günlük 1.800 TL tutarında gündelik (4 gün için
    toplam 7.200 TL) ödemiştir. Bay (E)''nin aynı aylık seviyesindeki Devlet memurlarına verilen günlük gündelik 1.500 TL,
    Devletçe verilen gündeliklerin en yüksek haddi ise günlük 2.000 TL''dir.


    Bu ödemeler nedeniyle Bay (E) adına GVK md. 24/2 uyarınca ücret olarak vergiye tabi tutulacak tutar kaç TL''dir?

    '
  secenekler:
    A: 0 TL
    B: 1.200 TL
    C: 7.200 TL
    D: 9.000 TL
    E: 16.200 TL
  dogru: B
  aciklama:
    dogru_neden: 'Md. 24/2 uyarınca Harcırah Kanunu kapsamı dışındaki müesseselerce hizmet erbabına verilen gerçek yol giderlerinin
      tamamı ile yemek ve yatmak giderlerine karşılık verilen gündelikler gelir vergisinden istisnadır. Ancak gündelikler
      aynı aylık seviyesindeki Devlet memurlarına verilen gündeliklerden fazla ise veya Devletçe verilen gündeliklerin en
      yüksek haddini aşarsa aradaki fark ücret olarak vergiye tabi tutulur.


      Yol giderleri (9.000 TL) tamamen istisnadır. Gündelik: 1.800 > 1.500 olduğundan günlük 300 TL, 4 günde 1.200 TL fark
      ücret sayılır. En yüksek hadde (2.000 TL) göre ayrıca fark doğmaz.


      Püf noktaları: İki ölçüt vardır (aynı seviyedeki memur gündeliği ve en yüksek had); ölçütlerden biri aşıldığında aşan
      kısım vergilenir. Memur gündeliğini aştığınız halde en yüksek hadde ulaşılmaması vergilenmeyi önlemez.

      '
    celdiriciler:
      A: Gündelik en yüksek haddi (2.000 TL) aşmadığı için fark doğmadığı düşünülmüştür; oysa aynı seviyedeki memur gündeliği
