    (a) Cumhurbaşkanı Kararı (Karar Sayısı: 9707) ve 2009/14592 sayılı Karar uyarınca A ve B işlerinde istihkak bedellerinden
    kesilecek toplam gelir vergisi tevkifatını ayrı ayrı hesaplayınız. (5 puan)


    (b) GVK md. 43''e göre müşterek genel giderlerin A ve B işlerine dağıtımını yaparak A işinin kârını bulunuz. (7 puan)


    (c) A işine ilişkin gelir vergisini, tevkifat mahsubundan sonra ödenecek vergiyi ve ödeme zamanlarını belirtiniz; yıllık
    beyannamenin verilme süresini belirtiniz. Bu işin kazancının geçici vergi matrahı bakımından durumunu açıklayınız. (7
    puan)


    (d) B işinin kârının hangi yılın geliri sayılacağını ve beyanname süresini gerekçesiyle belirtiniz; Mart 2027''de A işinden
    elde edilen 200.000 TL hasılat ve 30.000 TL giderin hangi yılın kazancına etki edeceğini açıklayınız. (6 puan)

    '
  cozum: '**(a) Tevkifat (GVK md. 94/3; CBK 9707)**


    Md. 42 kapsamındaki işlerde istihkak bedellerinden kesilecek vergi oranları, 9707 sayılı Karar ile değiştirilmiştir (Karar
    yayımını izleyen ay başından itibaren, yani Nisan 2025''ten sonra yapılan ödemelere uygulanır): şehir içi raylı ulaşım
    sistemleri inşaat ve onarım işlerinde **%1**, gemi inşaat ve onarım işlerinde %1, diğer işlerde **%5**.


    - İş A (diğer iş): (6.000.000 + 4.000.000) × %5 = **500.000 TL**

    - İş B (raylı sistem onarımı): (2.000.000 + 1.000.000) × %1 = **30.000 TL**


    **(b) Müşterek genel giderlerin dağıtımı (md. 43/1)**


    Yıl içinde birden fazla inşaat ve onarma işinin birlikte yapılması hâlinde her yıla ait müşterek genel giderler, bu işlere
    ait harcamaların birbirine olan nispeti dahilinde dağıtılır.


    | Yıl | Genel gider | A harcama : B harcama | A payı | B payı |

    |---|---|---|---|---|

    | 2025 | 600.000 | 3.000.000 : 1.000.000 (%75 : %25) | 450.000 | 150.000 |

    | 2026 | 300.000 | 2.000.000 : 500.000 (%80 : %20) | 240.000 | 60.000 |

    | Toplam | | | **690.000** | 210.000 |


    İş A kârı = hasılat 10.000.000 − harcamalar 5.000.000 − genel gider payı 690.000 = **4.310.000 TL**.


    **(c) A işinin vergisi**


    Birden fazla takvim yılına yayılan inşaat işinde kâr, işin bittiği yıl kesin olarak tespit edilir ve tamamı o yılın geliri
    sayılır. A işi 28/12/2026''da fiilen tamamlandığından kâr 2026 gelirindedir. Vergi: 232.500 + (4.310.000 − 1.000.000)
    × %35 = 232.500 + 1.158.500 = **1.391.000 TL**. Tevkifat mahsubu (A işine ilişkin 500.000 TL, md. 121): 1.391.000 − 500.000
    = **891.000 TL** ödenecek vergi; Mart ve Temmuz 2027''de iki eşit taksit (her biri **445.500 TL**). Beyanname, işin ikmal
    edildiği takvim yılını takip eden yılın Mart ayının başından yirmibeşinci günü akşamına kadar (**1–25 Mart 2027**) verilir.
    Md. 42 kapsamındaki kazançlar geçici vergi matrahına dahil edilmez.


    **(d) B işi ve bitim sonrası işlemler**


    Geçici ve kesin kabul usulüne tabi işlerde bitim tarihi, geçici kabul tutanağının idarece onaylandığı tarihtir; B işinde
    bu tarih 12/1/2027 olduğundan (fiilen tamamlanma tarihi önemli değildir) B işinin kârı **2027 yılının geliri** sayılır
    ve beyanname 2028 yılı Mart ayının başından yirmibeşinci günü akşamına kadar verilir; B işine ilişkin 30.000 TL tevkifat
    2027 yılı beyannamesinde mahsup edilir. Bitim tarihinden sonra elde edilen hasılat ve yapılan giderler, elde edildiği
    veya yapıldığı yılın kâr veya zararının tespitinde dikkate alınır: A işine ilişkin Mart 2027''deki 200.000 TL hasılat
    ve 30.000 TL gider **2027 yılı** kazancını etkiler (net **170.000 TL**), 2026 yılı beyannamesi değişmez.

    '
