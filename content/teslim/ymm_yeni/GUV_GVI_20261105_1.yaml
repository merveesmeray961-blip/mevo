  tip: kavrama
  zorluk: 2
  kok: 'Ticari faaliyeti nedeniyle gelir vergisi mükellefi olan ve finans sektöründe faaliyet göstermeyen mükelleflere ilişkin
    GVK mükerrer md. 121''deki vergiye uyumlu mükellef vergi indirimi hakkında aşağıdaki ifadelerden hangileri doğrudur? (2026
    yılı beyannamesi için indirim tutarı sınırı 12.000.000 TL''dir.)


    I. 2025 yılı Mart dönemi KDV beyannamesini kanuni süresinde veren (A), bu beyannameyi kanuni süreden sonra düzeltme amacıyla
    yeniden vermiştir; bu durum beyannamelerin kanuni süresinde verilmiş olması şartının ihlali sayılmaz.


    II. 2025 yılı gelir vergisi beyannamesine ilişkin olarak ikmalen yapılan ve süresi içinde kesinleşen 90.000 TL''lik tarhiyat
    nedeniyle (B)''nin tarhiyat bulunmaması şartı ihlal edilmiş sayılmaz.


    III. 2026 yılı beyannamesinin verildiği tarih itibarıyla vergi aslı dahil vadesi geçmiş 1.800 TL borcu bulunan (C)''nin
    bu borcu indirimden yararlanmasına engel değildir.


    IV. 2021 yılında VUK md. 359''da sayılan fiilleri işlediği tespit edilen (D) bakımından bu durum, 2026 yılı beyannamesi
    için indirimden yararlanmaya engel teşkil etmez.

    '
  secenekler:
    A: Yalnız I
    B: I ve II
    C: I, II ve IV
    D: II, III ve IV
    E: I, II, III ve IV
  dogru: C
  aciklama:
    dogru_neden: 'I doğrudur: Kanuni süresinde verilen bir beyannameye ilişkin olarak kanuni süreden sonra düzeltme amacıyla
      veya pişmanlıkla verilen beyannameler şartın ihlali sayılmaz.


      II doğrudur: Kesinleşen tarhiyatların, indirimin hesaplanacağı beyannamenin ait olduğu yıl için geçerli indirim tutar
      sınırının %1''ini aşmaması durumunda şart ihlal edilmiş sayılmaz. Sınırın %1''i 12.000.000 × %1 = 120.000 TL olup 90.000
      TL bu tutarı aşmaz.


      III yanlıştır: Vergi aslı (cezalar ve fer''i alacaklar dahil) 1.000 TL''nin üzerinde vadesi geçmiş borcun bulunmaması
      şarttır; 1.800 TL borç bu sınırı aşar.


      IV doğrudur: VUK md. 359 fiilleri, beyannamenin ait olduğu yıl ile önceki dört takvim yılı (2022–2025 ve 2026) için
      engel oluşturur; 2021 bu süre dışındadır.


      Püf noktaları: Düzeltme ve pişmanlık beyanları kanuni süreyi bozmaz; küçük kesinleşmiş tarhiyatlar tutar sınırının %1''ine
      kadar hoş görülür; vadesi geçmiş borç sınırı 1.000 TL''dir; 359 fiilleri için geriye dönük süre beş yıldır (cari yıl
      + önceki dört yıl).

      '
    celdiriciler:
      A: II ve IV de doğru olduğundan yalnız I eksik bir değerlendirmedir.
      B: IV doğru olduğu hâlde bu şıkta yer almamıştır; 2021 yılı beş yıllık incelenecek dönemin dışındadır.
      D: I doğru olduğu hâlde yer almamış, III ise yanlış olduğu hâlde yer almıştır; 1.000 TL'yi aşan vadesi geçmiş borç indirimi
        engeller.
      E: III yanlıştır; 1.000 TL'nin üzerinde vadesi geçmiş borç bulunması indirimden yararlanmaya engeldir.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 121/2-(1), (2)
    alinti: (Kesinleşen tarhiyatların, indirimin hesaplanacağı beyannamenin ait olduğu yıl için geçerli olan, birinci fıkradaki
      indirim tutar sınırının %1’ini aşmaması durumunda bu şart ihlal edilmiş sayılmaz.)
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 121/2-(3)
    alinti: vergi aslı (vergi cezaları ile fer’i alacaklar dâhil) 1.000 Türk lirasının üzerinde vadesi geçmiş borcunun bulunmaması,
      şarttır. İndirimin hesaplanacağı beyannamenin ait olduğu yıl ile önceki dört takvim yılında 213 sayılı Vergi Usul Kanununun
      359 uncu maddesinde sayılan fiilleri işlediği tespit edilenler, bu madde hükümlerinden yararlanamazlar.
  - mevzuat: 'Gelir Vergisi Genel Tebliği (Seri No: 332)'
    madde: md. 3/4
