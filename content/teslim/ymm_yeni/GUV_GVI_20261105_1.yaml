    - Yol gideri 9.000 → istisna, vergiye tabi 0
    - 'Gündelik farkı: (1.800 − 1.500) × 4 gün = 1.200'
    - En yüksek had (2.000) aşılmadığından ek fark yok
    - Toplam ücret sayılan = 1.200
