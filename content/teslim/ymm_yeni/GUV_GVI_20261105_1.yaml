  sure_dk: 30
  soru: 'Mimar Ayşe Kaya (doğum tarihi: 3/8/1998) tam mükellef gerçek kişidir. Ayşe Hanım, 2 Şubat 2026 tarihinde serbest
    mimarlık faaliyetine başlamış, işe başlamayı kanuni süresi içinde bildirmiş ve daha önce adına hiçbir ticari, zirai veya
    mesleki faaliyet nedeniyle gelir vergisi mükellefiyeti tesis edilmemiştir. Faaliyeti tek başına yürütmekte, bir yardımcı
    eleman çalıştırmaktadır; Haziran 2026''da geçirdiği bir ameliyat nedeniyle üç hafta işinden geçici olarak ayrılmıştır.
    Faaliyeti herhangi bir yakınından devralmamış, mevcut bir mimarlık ofisine de sonradan ortak olmamıştır. Serbest meslek
    kazanç defteri tutmakta olup başka geliri yoktur.


    2026 yılına ilişkin bilgiler şöyledir (KDV dikkate alınmayacaktır):


    | Kalem | Tutar (TL) |

    |---|---|

    | Kurumlardan tahsil edilen brüt serbest meslek hasılatı (ödeme sırasında %20 oranında gelir vergisi tevkifatı yapılmıştır)
    | 1.500.000 |

    | Gerçek kişi müşterilerden tahsil edilen hasılat (tevkifat yapılmamıştır) | 300.000 |

    | Belgelenmiş, indirilecek giderler toplamı | 800.000 |


    GVK md. 103 tarifesinin 2026 yılı için ikinci gelir diliminde yer alan tutar 400.000 TL''dir. 2026 yılı gelir vergisi
    tarifesi (ücret dışı gelirler; GVK md. 103, Gelir Vergisi Genel Tebliği Seri No: 332):


    | Gelir dilimi | Vergi |

    |---|---|

    | 190.000 TL''ye kadar | %15 |

    | 400.000 TL''ye kadar | 190.000 TL için 28.500 TL, fazlası %20 |

    | 1.000.000 TL''ye kadar | 400.000 TL için 70.500 TL, fazlası %27 |

    | 5.300.000 TL''ye kadar | 1.000.000 TL için 232.500 TL, fazlası %35 |

    | 5.300.000 TL''den fazlası | 5.300.000 TL için 1.737.500 TL, fazlası %40 |


    **İstenenler:**


    (a) GVK mükerrer md. 20''deki genç girişimci istisnasının şartlarını belirterek Ayşe Hanım''ın bu istisnadan yararlanıp
    yararlanamayacağını gerekçesiyle açıklayınız; yardımcı eleman çalıştırmasının ve ameliyat nedeniyle işinden ayrılmasının
    sonuca etkisini belirtiniz. (6 puan)


    (b) 2026 yılı safi serbest meslek kazancını, istisna tutarını, gelir vergisi matrahını ve hesaplanan gelir vergisini bulunuz.
    (7 puan)


    (c) Tevkif edilen verginin istisna karşısındaki durumunu açıklayınız; mahsuptan sonra Ayşe Hanım''ın ödeyeceği veya iade
    alacağı tutarı ve iade için gereken işlemi belirtiniz. (7 puan)


    (d) Ayşe Hanım''ın istisnadan hangi vergilendirme dönemleri için yararlanabileceğini, 2026 yılı yıllık beyannamesini verme
    süresini ve istisna kapsamındaki faaliyetten ileride hiç kazanç elde etmemesi hâlinde yıllık beyanname verip vermeyeceğini
    açıklayınız. (5 puan)

    '
  cozum: '**(a) İstisnanın şartları (GVK mükerrer md. 20)**


    İstisna; ticari, zirai veya mesleki faaliyeti nedeniyle adına ilk defa gelir vergisi mükellefiyeti tesis olunan ve mükellefiyet
    başlangıç tarihi itibarıyla yirmi dokuz yaşını doldurmamış tam mükellef gerçek kişilere tanınır. Ayrıca: (1) işe başlamanın
    kanuni süresi içinde bildirilmesi, (2) kendi işinde bilfiil çalışılması veya işin kendisi tarafından sevk ve idare edilmesi,
    (3) adi ortaklık/şahıs şirketinde tüm ortakların şartları taşıması, (4) ölüm nedeniyle eş ve çocuklar tarafından devralma
    hariç, faaliyetin eş veya üçüncü dereceye kadar kan veya kayın hısımlarından devralınmamış olması, (5) mevcut bir işletmeye
    veya mesleki faaliyete sonradan ortak olunmaması aranır.


    Ayşe Hanım 2/2/2026 tarihinde 27 yaşındadır (29 yaşını doldurmamıştır); ilk defa mükellefiyet tesis ettirmiş, işe başlamayı
    süresinde bildirmiş, faaliyeti devralmamış ve sonradan ortak olmamıştır. Çırak, kalfa veya yardımcı işçi çalıştırmak ya
    da hastalık gibi zaruri ayrılmalar nedeniyle geçici olarak işinde bilfiil çalışmamak bilfiil çalışma şartını bozmaz. Bu
    nedenle **istisnadan yararlanır**.


    **(b) Vergi hesabı**


    | Kalem | TL |

    |---|---|

    | Brüt hasılat (1.500.000 + 300.000) | 1.800.000 |

    | − Giderler | 800.000 |

    | = Safi serbest meslek kazancı | **1.000.000** |

    | − Genç girişimci istisnası (ikinci gelir dilimi tutarı) | **400.000** |

    | = Gelir vergisi matrahı | **600.000** |


    Vergi: ilk 400.000 TL için 70.500 TL; kalan 200.000 TL × %27 = 54.000 TL. Hesaplanan gelir vergisi = 70.500 + 54.000 =
    **124.500 TL**.


    **(c) Tevkifat ve mahsup**


    İstisnanın GVK md. 94 uyarınca tevkif suretiyle ödenecek vergiye şümulü yoktur; bu nedenle kurumlar, ödemeleri üzerinden
    %20 tevkifat yapmak zorundadır: 1.500.000 × %20 = **300.000 TL**. Gerçek kişi müşterilerden tevkifat yapılmamıştır. Md.
    121 uyarınca yıllık beyannamede gösterilen gelire dahil kazançtan kesilen vergiler hesaplanan gelir vergisine mahsup edilir:
    124.500 − 300.000 = −175.500. Mahsup edilen tutar hesaplanan vergiden fazla olduğundan fark (**175.500 TL**) vergi dairesince
    mükellefe bildirilir ve mükellef tebliğ tarihinden itibaren bir yıl içinde başvurursa ret ve iade olunur. Ayşe Hanım''ın
    ödeyeceği vergi yoktur; iade alacağı vardır.


    **(d) Süre ve beyan**


    İstisna, faaliyete başlanılan takvim yılından itibaren üç vergilendirme dönemi için uygulanır: **2026, 2027 ve 2028**.
    2026 yılına ait yıllık beyanname, izleyen yılın Mart ayının başından yirmibeşinci günü akşamına kadar (**1–25 Mart 2027**)
    verilir (md. 92). İstisna kapsamındaki faaliyetten kazanç elde edilmemesi veya istisna haddinin altında kazanç elde edilmesi
    hâllerinde dahi yıllık beyanname verilir; ayrıca serbest meslek erbabı kazanç temin etmemiş olsa bile yıllık beyanname
    verir (md. 85).

    '
  puanlama:
  - olcut: Genç girişimci istisnasının yaş, ilk mükellefiyet, bildirim, bilfiil çalışma, devralma ve ortaklık şartlarının
