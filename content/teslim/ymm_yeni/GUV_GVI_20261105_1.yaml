    ticaret faaliyetlerinde bulunmaktadır. Kendisi 2026 yılında 5510 sayılı Kanun kapsamında sigortalıdır ve yıl boyunca ortalama
    **1 tam zamanlı işçi** çalıştırmıştır. 2026 yılı faaliyet kazançları (gider ve maliyetler düşülmüş tutarlardır) şöyledir:


    | No | Kazanç kaynağı | Açıklama | Kazanç (TL) |

    |---|---|---|---|

    | 1 | Yurt içi müşterilere verilen yazılım hizmetleri | Türkiye''deki müşterilere | 700.000 |

    | 2 | Almanya''da yerleşik (T) GmbH''ye verilen yazılım geliştirme hizmeti | Hizmetten münhasıran yurt dışında yararlanılmaktadır;
