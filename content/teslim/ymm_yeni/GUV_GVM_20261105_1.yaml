    puan: 3
  - olcut: 'Ayşe Bulut: şahsi işletme ile ortaklık payının toplanması (950 dönüm) ve gerçek usul sonucu'
    puan: 3
  - olcut: 'Berna Işık: payları toplamının ölçüyü aşmaması (350 dönüm) ve tevkifat usulü'
    puan: 2
  - olcut: 'Hakan Sezer: traktör yaşı ve sayısının (on yaşına kadar iki traktör) doğru değerlendirilmesi ve tevkifat usulü'
    puan: 2
  - olcut: Kollektif şirketin çiftçi sayılmadığının belirtilmesi
    puan: 2
  - olcut: Berna Işık için tevkifat tutarı (32.000 TL) ve oran seçimi
    puan: 3
  - olcut: Hakan Sezer için tevkifat tutarı (18.000 TL) ve oran seçimi
    puan: 2
  - olcut: Beyanname verilmeyeceğinin gerekçesi
    puan: 2
  - olcut: Kollektif şirket ortaklarının paylarının şahsi ticari kazanç sayılması
    puan: 3
  - olcut: Gerçek usule geçişin 1 Ocak 2027'den itibaren geçerli olması
    puan: 3
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 53/1
    alinti: Çiftçilerin elde ettikleri zirai kazançlar, bu Kanunun 94 üncü maddesine göre hasılatları üzerinden tevkifat yapılmak
      suretiyle vergilendirilir. 54 üncü maddede yazılı işletme büyüklüğü ölçülerini aşan çiftçiler ile bir biçerdövere veya
      bu mahiyetteki bir motorlu araca veya on yaşına kadar ikiden fazla traktöre sahip olan çiftçilerin kazançları gerçek
      usulde (zirai işletme hesabı veya diledikleri takdirde bilanço esasına göre) tesbit olunarak vergilendirilir.Kazançları
      gerçek usulde vergilendirilmeyen çiftçiler bu kazançları için beyanname vermezler.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 53 (aile ve ortaklık hâlinde işletme büyüklüğü)
    alinti: Bu hükmün tatbikinde, aile reisi ile birlikte yaşayan eş ve velayet altındaki çocuklara ait işletmeler ile ortaklık
      halindeki işletmelerde işletme büyüklüğü toplu olarak nazara alınır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 53 (şahsi işletme ve ortaklık payları)
    alinti: Gerek şahsi işletmesi gerekse dahil bulunduğu ortaklıklar müstakilen işletme büyüklüğü ölçüsünün altında kaldığı
      halde, kendisine ait işletmenin ve ortaklıklardaki payların toplamı bu ölçüyü aşan çiftçiler gerçek usulde vergilendirilir.
      Payları toplamı ölçüleri aşmayan diğer ortaklar tevkifat yoluyla vergilendirilirler. Yarıcılık ortaklık sayılır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 52 (kollektif şirketler çiftçi sayılmaz); md. 53 (gerçek usule geçiş); md. 54 (ölçüler)
  - mevzuat: 2009/14592 sayılı Bakanlar Kurulu Kararı
    madde: md. 1/11 (çiftçilerden satın alınan zirai mahsullerde tevkifat oranları)
  dogrulama:
    python: 'osman_aile = 650 + 300

      ayse = 600 + 700 * 0.5

      berna = 700 * 0.5

      traktor = 2

      berna_tev = 1600000 * 0.5 * 0.04

