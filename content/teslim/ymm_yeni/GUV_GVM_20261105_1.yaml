    olup sayıları **2**''dir; ikiden fazla olmadığından gerçek usul şartı doğmaz (12 yaşındaki traktör sayılmaz). Büyükbaş
    hayvan sayısı da (60) ölçünün (150) altındadır. | **Tevkifat yoluyla** |

