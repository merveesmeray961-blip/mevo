  soru: 'Aşağıdaki kişilerin tamamı Türkiye''de yerleşik gerçek kişilerdir; esnaf muaflığından yararlanmamakta, ticari faaliyetlerini
    kendi işlerinde bilfiil çalışarak yürütmekte ve başka bir ticari, zirai ya da mesleki faaliyette bulunmamaktadır. Tutarlar
    KDV hariçtir; alış, satış ve hasılat tutarları belgelere dayanmaktadır.


    **2026 yılı verileri**


