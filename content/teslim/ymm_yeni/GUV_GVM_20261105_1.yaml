    | Çiftçi | Hesap | Sonuç |

    |---|---|---|

    | Osman – Elif Çelik | Aile reisi ile birlikte yaşayan eşe ait işletmelerde işletme büyüklüğü toplu olarak nazara alınır:
    650 + 300 = **950 dönüm** > 900 dönüm. Tek tek bakıldığında her ikisi de ölçünün altındadır. | İkisi de **gerçek usulde**
