    aldıkları ürünlerde 2009/14592 sayılı Karar''daki oranları uygulamıştır: hayvanlar ve mahsulleri için ticaret borsasında
    tescil edilenlerde %1, diğerlerinde %2; diğer zirai mahsuller için ticaret borsasında tescil edilenlerde %2, diğerlerinde
