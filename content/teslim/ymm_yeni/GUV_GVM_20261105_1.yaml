  cozum: '**(a) Rıza Tuna ve Selçuk Bal**


    Basit usule tabi olmak için GVK md. 47 ve 48''deki şartların topluca bulunması gerekir (md. 46/1). Adi ortaklıkta çalışanlardan
    aynı zamanda şahsi bir işle de uğraşanlar bakımından md. 47/2 ve md. 48 ölçülerine, şahsi işe ait tutarlara ortaklıktan
    hisseye düşen miktarlar eklenir (md. 46).


    *Rıza Tuna (şahsi iş + %50 ortaklık hissesi):*


    | Ölçü | Şahsi iş | Ortaklıktaki %50 pay | Toplam | Had | Sonuç |

    |---|---|---|---|---|---|

    | Yıllık kira (md. 47/2, büyükşehir) | 72.000 | 18.000 | 90.000 | 99.000 | Aşılmadı |

    | Yıllık alım (md. 48/1) | 800.000 | 450.000 | **1.250.000** | 1.200.000 | **Aşıldı** |

    | Yıllık satış (md. 48/1) | 1.250.000 | 600.000 | 1.850.000 | 1.900.000 | Aşılmadı |


    Alım ve satış hadlerinden yalnız birinin aşılması basit usul şartını bozmaya yeter (md. 48/1: "veya"). Şart 2026 takvim
    yılı içinde kaybedildiği için 2026 kazancı basit usulde tespit edilir; ertesi takvim yılı başından, yani 1/1/2027''den
    itibaren gerçek usulde vergilendirilir (md. 46, takvim yılı içinde şartı kaybedenlere ilişkin fıkra).


    *Selçuk Bal (mal satışı ve işçilik birlikte, md. 48/3):*


    | Ölçü | Tutar | Had | Sonuç |

    |---|---|---|---|

    | Alım (md. 48/1) | 450.000 | 1.200.000 | Aşılmadı |

    | Satış (md. 48/1) | 700.000 | 1.900.000 | Aşılmadı |

    | İş hasılatı (md. 48/2) | 550.000 | 600.000 | Aşılmadı |

    | Satış + iş hasılatı (md. 48/3) | 700.000 + 550.000 = **1.250.000** | 1.200.000 | **Aşıldı** |


    Her bir ölçü tek başına aşılmadığı hâlde işlerin birlikte yapılması nedeniyle md. 48/3''teki toplam had aşılmıştır. Şart
    yıl içinde kaybedildiğinden 2026 kazancı basit usulde, 2027''den itibaren gerçek usulde tespit edilir.


    **(b) Veli Öz**


    2026''da ortaklığın ölçüleri toplu olarak (alım 900.000, satış 1.200.000, kira 36.000) hadlerin altında kalmakta, Veli
    Öz''ün şahsi işi de bulunmadığından yalnız ortaklıktaki hissesine bakılır (alım 450.000, satış 600.000): şartlar sağlandığı
    için 2026 kazancı basit usulde tespit edilir. Rıza Tuna 1/1/2027''den itibaren gerçek usule geçtiğinden, ortaklarından
    birisi gerçek usulde vergilendirilen ortaklıklarda diğer ortakların ticari kazancı da gerçek usulde tespit edilir (md.
    46); Veli Öz''ün ortaklık kazancı 2027''de gerçek usulde tespit edilir.


    **(c) Fethi Arslan ve Gülşen Uçar**


    - *Fethi Arslan:* Gayrimenkul alım satımı ile uğraşanlar basit usulden faydalanamaz (md. 51/7). Hadler aşılmasa da kazancı
    baştan gerçek usulde tespit edilir.

    - *Gülşen Uçar:* İşyeri mülkiyeti iş sahibine ait ise emsal kira bedeli esas alınır; büyükşehir dışında sınır 60.000 TL''dir
    (md. 47/2). Emsal kira 75.000 TL olduğundan şart yoktur. Yeniden işe başlayanlarda 2 ve 3 numaralı bentler işe başlama
    tarihindeki duruma göre uygulandığı için (md. 47) Gülşen Uçar işe başlama tarihinden itibaren gerçek usulde vergilendirilir.
    (Aynı işyeri büyükşehir sınırları içinde olsaydı 99.000 TL''lik sınır geçerli olacaktı.)


    **(d) Ferit Doğan**


    Ferit Doğan şartları sağlamaktadır: kira 90.000 ≤ 99.000, alım 1.050.000 ≤ 1.200.000, satış 1.800.000 ≤ 1.900.000.


    Basit usulde ticari kazanç; hasılat ile giderler ve satılan malların alış bedelleri arasındaki müspet farktır ve bu fark,
    alış, gider ve hasılata ilişkin belgelerde yazılı tutarlara göre hesaplanır (md. 46/2).


    | Kalem | TL |

    |---|---|

    | Hasılat (satışlar) | 1.800.000 |

    | − Satılan malların alış bedeli | 1.050.000 |

    | − Belgeli giderler | 150.000 |

    | = Basit usul ticari kazanç | **600.000** |


    Belgesiz 40.000 TL''lik ödeme belgelerde yazılı tutarlara dahil olmadığından kazançtan indirilemez.


    Gelir vergisi: 70.500 + (600.000 − 400.000) × %27 = 70.500 + 54.000 = **124.500 TL**.

    '
