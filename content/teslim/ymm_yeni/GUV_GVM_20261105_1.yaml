  soru: 'Taner Aksu, Türkiye''de yerleşik olup yalnızca inşaat taahhüt işleriyle uğraşan, kazancını bilanço esasına göre gerçek
    usulde tespit eden bir müteahhittir. Başka geliri ve indirimi yoktur. Bir belediyeye karşı taahhüt ettiği ve 2024''te
    başlayan (A) okul binası inşaatının geçici kabul tutanağı, idare tarafından 18 Aralık 2026 tarihinde onaylanmıştır. 2026
    yılında ayrıca (B) site onarımı işine başlamış olup bu iş 2027''de bitecektir. İki işin hasılat ve giderleri ayrı defterde
    izlenmektedir.


    **(A) okul inşaatına ilişkin veriler (KDV hariç)**


    | Yıl | Hakediş (hasılat) | Hakedişlerden %3 tevkif edilen vergi | Doğrudan inşaat giderleri | Yıla ait müşterek genel
    giderler |

    |---|---|---|---|---|

    | 2024 | 6.000.000 | 180.000 | 5.000.000 | 300.000 (tamamı (A)''ya aittir) |

    | 2025 | 9.000.000 | 270.000 | 7.000.000 | 500.000 (tamamı (A)''ya aittir) |

    | 2026 | 5.000.000 | 150.000 | 3.600.000 | 800.000 ((A) ve (B) arasında dağıtılacaktır) |


    **(B) site onarımına ilişkin 2026 verileri:** Hakediş 1.500.000 TL (tevkif edilen vergi 45.000 TL), doğrudan harcamalar
    1.200.000 TL.


    **2027 yılına ilişkin bilgi:** (A) işiyle ilgili olarak 12 Ocak 2027''de 400.000 TL teminat/kesin hakediş artığı tahsil
    edilmiş ve aynı işle ilgili 50.000 TL garanti onarım gideri yapılmıştır.


    **Veri:** Birden fazla takvim yılına sirayet eden inşaat işleri nedeniyle ödenen hakedişlerden %3 gelir vergisi tevkifatı
    yapılır (2009/14592 sayılı Karar). 2026 yılı gelir vergisi tarifesi (ücret dışı gelirler): 190.000 TL''ye kadar %15; 400.000
    TL''nin 190.000 TL''si için 28.500 TL, fazlası %20; 1.000.000 TL''nin 400.000 TL''si için 70.500 TL, fazlası %27; 5.300.000
    TL''nin 1.000.000 TL''si için 232.500 TL, fazlası %35; 5.300.000 TL''den fazlasının 5.300.000 TL''si için 1.737.500 TL,
    fazlası %40.


    **İstenenler:**


    (a) (A) ve (B) işlerinin kazancının hangi yılın kazancı sayılacağını ve (A) işinin bitim tarihini gerekçesiyle belirtiniz.
    (5 puan)


    (b) 2026 yılına ait 800.000 TL müşterek genel giderin (A) ve (B) işlerine dağıtımını yapınız. (5 puan)


    (c) Taner Aksu''nun 2026 yılı gelir vergisi beyannamesinde yer alacak (A) işine ait kazancı, hesaplanan gelir vergisini
    ve mahsup edilecek tevkifat ile ödenecek vergiyi bulunuz. (10 puan)


    (d) 2027 yılında (A) işiyle ilgili elde edilen 400.000 TL hasılat ve yapılan 50.000 TL giderin vergisel işlemini ve 2026
    yılı beyannamesinin verilme süresini belirtiniz. (5 puan)

    '
  cozum: '**(a) Kazancın doğduğu yıl ve bitim tarihi**


    Birden fazla takvim yılına sirayet eden inşaat ve onarma işlerinde kâr veya zarar işin bittiği yıl kati olarak tespit
    edilir ve tamamı o yılın geliri sayılarak o yıl beyannamesinde gösterilir (GVK md. 42/1). Geçici ve kesin kabul usulüne
    tabi işlerde geçici kabul tutanağının idarece onaylandığı tarih bitim tarihidir (md. 44/1). (A) işinin bitim tarihi **18
    Aralık 2026** olup 2024, 2025 ve 2026''ya ait tüm hasılat ve giderler **2026 yılının** geliri olarak beyan edilir. (B)
    işi 2027''de biteceğinden kazancı 2027 yılında kati olarak tespit edilir; 2026''da hakediş, harcama ve tevkifat (B) işinin
    ayrı defterinde izlenir, 2026 beyannamesine kazanç olarak girmez.


    **(b) Müşterek genel giderlerin dağıtımı (md. 43/1)**


    Yıl içinde birden fazla inşaat işinin birlikte yapılması hâlinde her yıla ait müşterek genel giderler, bu işlere ait harcamaların
    birbirine olan oranında dağıtılır.


    | İş | 2026 harcaması | Oran | Pay (800.000 TL) |

    |---|---|---|---|

    | (A) | 3.600.000 | %75 | **600.000** |

    | (B) | 1.200.000 | %25 | 200.000 |

    | Toplam | 4.800.000 | %100 | 800.000 |


    **(c) 2026 beyannamesi**


    | Kalem | TL |

    |---|---|

    | Hasılat (6.000.000 + 9.000.000 + 5.000.000) | 20.000.000 |

    | − Doğrudan giderler (5.000.000 + 7.000.000 + 3.600.000) | 15.600.000 |

    | − Müşterek genel giderler (300.000 + 500.000 + 600.000) | 1.400.000 |

    | = (A) işinin kazancı | **3.000.000** |


    Gelir vergisi: 232.500 + (3.000.000 − 1.000.000) × %35 = 232.500 + 700.000 = **932.500 TL**.


    (A) işine ait hakedişlerden tevkif edilen vergi 180.000 + 270.000 + 150.000 = **600.000 TL** olup beyanname üzerinden
    hesaplanan vergiden mahsup edilir (md. 121). (B) işine ait 45.000 TL tevkifat, işin bittiği yılın (2027) beyannamesinde
    mahsup edilir; 2026''da mahsup edilmez.


    Ödenecek gelir vergisi: 932.500 − 600.000 = **332.500 TL**.


    **(d) Bitim sonrası gelir/gider ve beyan süresi**


    Bitim tarihinden sonra işle ilgili yapılan giderler ve her ne ad altında olursa olsun elde edilen hasılat, giderin yapıldığı
    veya hasılatın elde edildiği yılın kâr veya zararının tespitinde dikkate alınır (md. 44/2). Dolayısıyla 400.000 TL hasılat
    ile 50.000 TL gider **2027 yılı** kazancına dahil edilir (net 350.000 TL); 2026 beyannamesi düzeltilmez.


    Bu madde kapsamındaki beyannameler, işlerin tamamlandığı takvim yılını izleyen yılın Mart ayının başından yirmibeşinci
    günü akşamına kadar verilir (md. 42/2). 2026 yılında biten (A) işi için süre **25 Mart 2027** akşamıdır.

    '
