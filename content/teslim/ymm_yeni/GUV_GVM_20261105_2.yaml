    200.000 TL tutarında brüt telif ücreti ödemiştir. Bay (E)''nin GVK md. 18 kapsamındaki kazançları toplamı 103. maddedeki
    tarifenin dördüncü gelir diliminde yer alan tutarı aşmamaktadır.


    (Y) A.Ş. tarafından GVK md. 94 uyarınca tevkif edilmesi gereken gelir vergisi kaç TL''dir? (12/1/2009 tarihli ve 2009/14592
    sayılı Bakanlar Kurulu Kararı oranları esas alınacaktır.)'
  secenekler:
    A: 0 TL
    B: 20.000 TL
    C: 30.000 TL
    D: 34.000 TL
    E: 40.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'GVK md. 18''e göre eser sahiplerinin hasılatı gelir vergisinden müstesnadır; ancak md. 18''in dördüncü fıkrası,
      serbest meslek kazançları istisnasının md. 94 uyarınca tevkif suretiyle ödenecek vergiye şümulü olmadığını belirtir.
      Bay (E)''nin md. 18 kapsamındaki kazançları dördüncü gelir diliminde yer alan tutarı aşmadığından istisna şartı bozulmamış,
      dolayısıyla tevkifat yükümlülüğü sürmektedir. 2009/14592 sayılı Karar''a göre md. 18 kapsamına giren serbest meslek
      işleri dolayısıyla yapılan ödemelerden %17 tevkifat yapılır: 200.000 × %17 = 34.000 TL. Diğer serbest meslek ödemelerindeki
      %20 oranı bu ödeme için uygulanmaz.'
    celdiriciler:
      A: Md. 18 istisnasının tevkif suretiyle ödenecek vergiye şümulü yoktur; ödeme istisna kapsamında olsa bile tevkifat
        yapılır.
      B: '%10 oranı md. 18 kapsamındaki ödemeler için öngörülmemiştir; bu oran serbest meslek ödemelerinde değil, başka gelir
        türlerindeki tevkifatta karşımıza çıkar.'
      C: '%15 oranı md. 18 kapsamındaki ödemelere uygulanmaz; Kararda bu ödemeler için %17 oranı belirlenmiştir.'
      E: '%20 oranı md. 18 kapsamına girmeyen serbest meslek ödemeleri içindir; md. 18 kapsamındaki ödemelerde oran %17''dir.'
    hesap_adimlari:
    - 'Md. 18 kapsamındaki serbest meslek ödemesinde tevkifat oranı: %17'
    - 'Tevkifat: 200.000 × %17 = 34.000 TL'
