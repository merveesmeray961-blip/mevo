  tip: hesaplama
  zorluk: 3
  kok: 'Bay (G), 2026 yılında ticari faaliyete başlamış ve adına ilk defa gelir vergisi mükellefiyeti tesis edilmiştir. Mükellefiyet
    başlangıç tarihi itibarıyla 27 yaşındadır; tam mükelleftir, işe başlamayı kanuni süresinde bildirmiş, işinde bilfiil çalışmaktadır
    ve işi bir yakınından devralmamıştır. Mevcut bir işletmeye de sonradan ortak olmamıştır. Gerçek usulde vergilendirilen
    Bay (G)''nin 2026 yılı ticari kazancı 700.000 TL''dir; başka bir geliri yoktur ve indirim ile istisna olarak yalnızca
    GVK mükerrer md. 20 hükmünden yararlanmaktadır. İşyeri aylık kirası ve işçi sayısına ilişkin diğer veriler sonucu etkilememektedir.


    2026 gelir vergisi tarifesinin ilk iki dilimi şöyledir:


    | Gelir dilimi | Vergi |

    |---|---|

    | 190.000 TL''ye kadar | %15 |

    | 400.000 TL''nin 190.000 TL''si için 28.500 TL, fazlası | %20 |


    Buna göre Bay (G)''nin 2026 yılı için ödeyeceği gelir vergisi kaç TL''dir?'
  secenekler:
    A: 50.500 TL
    B: 81.000 TL
    C: 94.800 TL
    D: 100.200 TL
    E: 151.500 TL
  dogru: A
  aciklama:
    dogru_neden: 'Mükerrer md. 20 uyarınca ilk defa mükellefiyet tesis edilen ve mükellefiyet başlangıcında yirmi dokuz yaşını
      doldurmamış tam mükellef gerçek kişilerin, faaliyete başladıkları takvim yılından itibaren üç vergilendirme dönemi boyunca
      elde ettikleri kazançlarının 103. maddedeki tarifenin ikinci diliminde yer alan tutara kadar olan kısmı gelir vergisinden
      müstesnadır. 2026 tarifesinde ikinci dilimde yer alan tutar 400.000 TL''dir. Bay (G)''nin tüm şartları taşıdığı varsayıldığından
      700.000 − 400.000 = 300.000 TL vergiye tabi gelirdir. Vergi: 190.000 × %15 = 28.500 TL; (300.000 − 190.000) × %20 =
      22.000 TL; toplam 50.500 TL. Püf noktaları: (1) İstisna tutarı, tarifenin ikinci diliminin üst sınırı olan 400.000 TL''dir;
      dilim genişliği (210.000 TL) ya da ilk dilim (190.000 TL) alınmaz. (2) İstisna kazançtan düşülür, hesaplanan vergiden
      düşülmez. (3) Kalan 300.000 TL için tarife yeniden ilk dilimden başlar; 700.000 TL''nin tarifedeki yerine bakılmaz.'
    celdiriciler:
      B: Tarife 700.000 TL üzerinden uygulanıp 400.000 TL'lik kısma isabet eden vergi (70.500 TL) düşülmüştür; oysa istisna
        matrahtan düşülür, vergiden değil.
      C: İstisna tutarı yanlışlıkla ikinci dilimin genişliği olan 210.000 TL alınmıştır; doğru tutar tarifedeki 400.000 TL'dir.
      D: İstisna tutarı yanlışlıkla yalnızca ilk dilim olan 190.000 TL alınmıştır; doğru tutar ikinci dilimde yer alan 400.000
        TL'dir.
      E: İstisna hiç uygulanmamıştır; oysa tüm şartlar sağlandığından istisna uygulanır ve vergi 700.000 TL değil 300.000
        TL üzerinden hesaplanır.
    hesap_adimlari:
    - 'İstisna tutarı (tarifenin ikinci dilimi): 400.000 TL'
    - 'Vergiye tabi gelir: 700.000 − 400.000 = 300.000 TL'
    - 'Vergi: 190.000 × %15 = 28.500 TL'
    - (300.000 − 190.000) × %20 = 22.000 TL
    - 'Toplam: 28.500 + 22.000 = 50.500 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 20
    alinti: Ticari, zirai veya mesleki faaliyeti nedeniyle adlarına ilk defa gelir vergisi mükellefiyeti tesis olunan ve mükellefiyet
      başlangıç tarihi itibarıyla yirmi dokuz yaşını doldurmamış tam mükellef gerçek kişilerin, faaliyete başladıkları takvim
      yılından itibaren üç vergilendirme dönemi boyunca elde ettikleri bu kazançlarının 103 üncü maddede yazılı tarifenin
      ikinci diliminde yer alan tutara kadar olan kısmı, aşağıdaki şartlarla gelir vergisinden müstesnadır.14
