    \n(c) (D) A.Ş.'nin elde ettiği kâr paylarından iştirak kazançları istisnasına konu edilebilecek tutarı gerekçesiyle hesaplayınız.\
    \ (6 puan)\n\n(d) (D) A.Ş.'nin 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; verilen\
