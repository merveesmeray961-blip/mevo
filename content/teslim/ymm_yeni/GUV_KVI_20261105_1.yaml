    | Aynı patentin üretim sürecinde kullanılmasıyla üretilen ürünlerin satışı | 3.000.000 kazanç |

    | Diğer faaliyetler | 2.500.000 kazanç |


    Patent, Türkiye''de gerçekleştirilen Ar-Ge faaliyetleri sonucunda ortaya çıkan buluşa ilişkin olup Türk Patent ve Marka
    Kurumu tarafından incelemeli sistemle (P) A.Ş. adına verilmiştir; lisans kirası bu patent nedeniyle elde edilmiştir. Ürün
    satışına ilişkin olarak toplam üretim maliyeti 20.000.000 TL''dir; bu maliyetin 2.000.000 TL''lik kısmı patentli buluşun
    üretim sürecinde kullanılması nedeniyle katlanılan maliyetlerden oluşmaktadır ve (P) A.Ş., buluşa atfedilen kazancı maliyet
    unsurlarını dikkate alarak ayrıştırmayı tercih etmiştir. İstisna şartlarının sağlandığı kabul edilecektir.


