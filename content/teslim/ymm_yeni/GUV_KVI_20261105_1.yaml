  soru: "Hesap dönemi takvim yılı olan (G) Gayrimenkul Yatırım Ortaklığı A.Ş., Türkiye'de kurulu olup esas faaliyet konusu\
    \ itibarıyla gayrimenkul, gayrimenkul projeleri ve gayrimenkule dayalı haklardan oluşan portföyü işletmek amacıyla kurulmuştur.\
    \ Ortaklığın 2026 hesap dönemine ilişkin faaliyet sonuçları aşağıdadır. Müşterek genel giderlerin dağıtımında yalnızca\
    \ ilgili faaliyetlerle ilgili olarak cari yılda oluşan doğrudan maliyetler esas alınacaktır; kanuni yedek akçeler ve avans\
    \ kâr payları dikkate alınmayacaktır.\n\n| Faaliyet | Hasılat (TL) | Doğrudan maliyet ve gider (TL) |\n|---|---|---|\n\
    | Taşınmaz kira ve satış faaliyeti | 18.000.000 | 10.000.000 |\n| Menkul kıymet ve diğer faaliyetler | 3.000.000 | 5.000.000\
    \ |\n\nHer iki faaliyete ortak olan müşterek genel giderler 1.500.000 TL'dir. Ortaklık, KVK md. 5/1-(d) kapsamındaki istisnadan\
    \ yararlanmayı planlamaktadır. 2026 yılı kurumlar vergisi beyannamesinin verilmesi gereken ay Nisan 2027'dir.\n\nAyrıca\
    \ (D) A.Ş. (tam mükellef, kurumlar vergisi oranı %25, banka veya finans kuruluşu değildir) 2026 yılında aşağıdaki kâr\
    \ paylarını elde etmiştir:\n\n- Tam mükellef (P) A.Ş.'den 1.500.000 TL kâr payı.\n- (C) Gayrimenkul Yatırım Ortaklığı\
    \ A.Ş.'nin 2025 hesap dönemi kazancından 2.000.000 TL kâr payı. (C) Ortaklığı, 2025 döneminde 5/1-(d) istisnasından yararlanmış,\
    \ dağıtım şartını süresinde sağlamış ve taşınmaz kazancı üzerinden %10 oranında yurt içi asgari kurumlar vergisi ödemiştir.\n\
    \n(D) A.Ş.'nin 2026 ticari bilanço kârı 9.000.000 TL'dir ve bu kâr, yukarıdaki kâr paylarını brüt tutarlarıyla içermektedir.\
    \ Kâr yazılırken gider kaydedilen kalemlerden 300.000 TL'si (D) A.Ş.'nin (C) Ortaklığı hisselerini satın almak için kullandığı\
    \ krediye ilişkin faiz giderine, 100.000 TL'si ise yalnızca (P) A.Ş.'den elde edilen kâr payı gelirine ilişkin olduğu\
    \ kayıtlardan anlaşılan saklama ve işlem giderine aittir. Başka düzeltme kalemi yoktur.\n\n**İstenenler:**\n\n(a) (G)\
    \ Ortaklığının taşınmaz faaliyeti ile diğer faaliyetlerinin 2026 sonuçlarını müşterek genel giderleri dağıtarak bulunuz;\
    \ istisnadan yararlanabilmesi için en az ne kadar tutarı, en geç hangi tarihe kadar kâr payı olarak dağıtması gerektiğini\
    \ belirtiniz. (8 puan)\n\n(b) Aşağıdaki durumların her birinde dağıtım şartının sağlanıp sağlanmadığını gerekçesiyle belirtiniz\
    \ ve şartın sağlanamaması hâlinde Ortaklığın durumunun ne olacağını açıklayınız. (5 puan)\n 1. Ortaklık 25 Haziran 2027'de\
    \ nakden 1.500.000 TL kâr payı dağıtmış, 1.000.000 TL tutarındaki kârı da sermayesine eklemiştir.\n 2. Ortaklık 28 Haziran\
