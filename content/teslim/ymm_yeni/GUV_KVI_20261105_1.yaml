  soru: 'Tam mükellef, hesap dönemi takvim yılı olan ve imalat faaliyetinde bulunan (S) A.Ş.''nin (banka veya finans kuruluşu
    değildir; kurumlar vergisi oranı %25) 2026 hesap dönemine ilişkin ticari bilanço kârı **30.000.000 TL**''dir. Bu kâr,
    aşağıdaki yurt dışı iştiraklerden 2026 yılında elde edilen kâr paylarını brüt tutarlarıyla içermektedir. Dört iştirak
    de kanuni ve iş merkezi Türkiye''de bulunmayan anonim veya limited şirket niteliğindedir; ilgili pay, kâr payının elde
    edildiği tarihte kesintisiz olarak tabloda gösterilen süredir elde tutulmaktadır.


    | İştirak | Pay oranı | Elde tutma süresi | Esas faaliyet | Kâr payı (TL) | Kâr payının, 2026 beyannamesinin verilmesi
    gereken tarihe kadar Türkiye''ye transferi |

    |---|---|---|---|---|---|

    | Kuzey Ltd. | %25 | 4 yıl | İmalat | 5.000.000 | Yapıldı |

    | Doğu A.Ş. | %60 | 3 yıl | İmalat | 2.000.000 | Yapılmadı (daha sonra transfer edilmiştir) |

    | Batı A.Ş. | %12 | 2 yıl | İmalat | 3.000.000 | Yapıldı |

    | Güney Finans A.Ş. | %12 | 3 yıl | Finansman temini | 1.000.000 | Yapıldı |


    **Yurt dışı vergi yüküne ilişkin bilgiler:**


    - Kuzey Ltd.: Kâr payı dağıtımına kaynak olan dönemde kuruluşun ticari bilanço kârı 9.000.000 TL''dir. Bulunduğu ülkenin
    vergi mevzuatına göre gider kabul edilmeyen 1.000.000 TL vardır; vergiye tabi kazancın 5.000.000 TL''si o ülkede vergiden
    istisnadır. O ülkedeki kurumlar vergisi oranı %15''tir ve vergiden istisna edilen 5.000.000 TL tutarındaki kazanç üzerinden
    kâr payı dağıtımında %5 oranında kesinti yapılmıştır.

    - Doğu A.Ş. ve Batı A.Ş. ile Güney Finans A.Ş. için, kâr payı dağıtımına kaynak olan kazançlar üzerinden hesaplanan toplam
    vergi yükleri sırasıyla %20, %18 ve %18''dir.


    (S) A.Ş.''nin gider yazdığı kalemlerden 900.000 TL''si, yurt dışı iştirak hisselerinin alımı için kullandığı krediye ilişkin
    faiz giderine; 200.000 TL''si ise yalnızca Batı A.Ş.''nin yönetimine katılan temsilcilerin seyahat ve konaklama giderlerine
    ilişkin olup bu giderler yalnızca Batı A.Ş.''den elde edilen kâr payına özgü olarak ayrı izlenmektedir. Başka düzeltme
    kalemi yoktur.


    **İstenenler:**


    (a) Kuzey Ltd. için yurt dışı vergi yükünü hesaplayınız; bu iştirakten elde edilen kâr payına uygulanacak istisna oranını
    ve istisna tutarını gerekçesiyle belirtiniz. (8 puan)


    (b) Doğu A.Ş., Batı A.Ş. ve Güney Finans A.Ş. iştirakleri bakımından istisnadan yararlanılıp yararlanılamayacağını ve
    yararlanılıyorsa tutarı gerekçesiyle belirtiniz. (7 puan)


    (c) (S) A.Ş.''nin 2026 yılı kurum kazancını, kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; verilen
    iki gider kaleminin durumunu açıklayınız. (7 puan)


    (d) Bu iştiraklerin kâr payları nedeniyle yurt dışında ödenen vergilerin Türkiye''de hesaplanan kurumlar vergisinden mahsup
    edilip edilemeyeceğini, istisna uygulanan iştirakler yönünden açıklayınız. (3 puan)

    '
  cozum: '**(a) Kuzey Ltd. — vergi yükü ve istisna oranı**


    Vergi yükü; kâr payı dağıtımına kaynak olan kazançlar üzerinden ödenen vergiler dahil toplam gelir ve kurumlar vergisi
    benzeri verginin, dağıtılabilir kurum kazancı ile tahakkuk eden vergi toplamına oranlanmasıyla bulunur.


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı + gider kabul edilmeyen kısım = vergiye tabi kazanç | 10.000.000 |

    | − Yurt dışında vergiden istisna edilen kazanç | 5.000.000 |

    | = Vergi matrahı | 5.000.000 |

    | Hesaplanan kurumlar vergisi (%15) | 750.000 |

    | + İstisna kazanç üzerinden kesinti (5.000.000 × %5) | 250.000 |

    | = Toplam vergi | 1.000.000 |

    | Dağıtılabilir kazanç (9.000.000 − 1.000.000) | 8.000.000 |


    Vergi yükü = 1.000.000 / (8.000.000 + 1.000.000) = **%11,11**. Bu oran %15''in altında olduğundan 5/1-(b)''nin genel şartları
    (%15 vergi yükü) sağlanmamıştır.


    Ancak 11257 sayılı Cumhurbaşkanı Kararı (1/1/2026''dan itibaren başlayan dönemlerde) uyarınca, yurt dışı iştirakin ödenmiş
    sermayesinin en az %20''sine sahip olunması ve kazancın beyanname verilmesi gereken tarihe kadar Türkiye''ye transfer
    edilmesi hâlinde diğer şartlar aranmaksızın istisna oranı %80''dir. Kuzey Ltd.''de pay oranı %25 ve transfer süresinde
    yapıldığından istisna tutarı: 5.000.000 × %80 = **4.000.000 TL**.


    **(b) Diğer iştirakler**


    - **Doğu A.Ş.:** Pay oranı (%60), süre ve vergi yükü (%20) şartları sağlansa da kâr payı beyanname verilmesi gereken tarihe
    kadar Türkiye''ye transfer edilmediğinden hem genel şartlara dayalı %100''lük istisnadan hem de %80''lik istisnadan yararlanılamaz.
    Daha sonra transfer edilmesi sonucu değiştirmez: istisna **0 TL**.

    - **Batı A.Ş.:** Pay oranı %12 (≥ %10), süre 2 yıl (≥ 1 yıl), vergi yükü %18 (≥ %15), transfer süresinde yapılmıştır;
    kâr payının tamamı istisnadır: **3.000.000 TL**.

    - **Güney Finans A.Ş.:** Esas faaliyeti finansman temini olduğundan vergi yükünün en az Türkiye''de uygulanan kurumlar
    vergisi oranı kadar (%25) olması gerekir; %18 yetersizdir. Pay oranı %12 olduğundan %20 sınırına dayalı %80''lik istisna
    da uygulanamaz: istisna **0 TL**.


    **(c) Matrah ve vergi**


    İştirak hisseleri alımıyla ilgili finansman gideri (900.000 TL) kurum kazancından indirilebilir; kanunen kabul edilmeyen
    gider olarak eklenmez (md. 5/3). Batı A.Ş. kâr payı istisna kazancına özgü 200.000 TL gider ise kanunen kabul edilmeyen
    gider olarak kurum kazancına eklenir.


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 30.000.000 |

    | + Kanunen kabul edilmeyen gider | 200.000 |

    | = Kurum kazancı | 30.200.000 |

    | − Kuzey Ltd. (%80) | 4.000.000 |

    | − Batı A.Ş. (%100) | 3.000.000 |

    | = **Kurumlar vergisi matrahı** | **23.200.000** |

    | Hesaplanan kurumlar vergisi (%25) | **5.800.000** |


    **(d) Yurt dışında ödenen vergiler**


    İstisna kazanca tekabül eden yurt dışı vergiler Türkiye''de hesaplanan kurumlar vergisinden mahsup edilemez. Kuzey Ltd.''nin
    istisna kapsamında kalan %80''lik kısmı ile Batı A.Ş.''nin tamamı için ödenen vergiler mahsup edilmez; Kuzey Ltd. kâr
    payının istisna dışında kalan %20''lik kısmına isabet eden vergi ise ilgili dönemin beyannamesinde hesaplanan vergiden
    mahsup edilebilir.

