      değil, %20 pay ve %80 oran uygulanır. (2) Transfer şartı her iki yolda da zorunludur; (Y)''nin pay oranı ne kadar yüksek
      olursa olsun transfer yapılmadıkça istisna yoktur. (3) %80''lik yolda vergi yükü aranmaz; (X)''in %10 yükü bu yolda
      engel değildir.'
    celdiriciler:
      A: Yalnız (Z)'nin istisnasıdır; (X)'in %20 pay ve transferle %80 istisnadan yararlanabildiği gözden kaçırılmıştır.
      B: (X) için eski %50 oranı uygulanmıştır (2.500.000) ve (Z) eklenmiştir; 2026'dan itibaren oran %80'dir.
      D: (Y) de %80 oranla (1.600.000) eklenmiştir; oysa transfer şartı sağlanmadığından (Y) için istisna yoktur.
      E: Kâr paylarının tamamı istisna sayılmıştır; vergi yükü, pay oranı ve özellikle transfer şartları dikkate alınmamıştır.
    hesap_adimlari:
    - (X) = 5.000.000 × %80 = 4.000.000 TL (pay ≥ %20 ve süresinde transfer)
    - (Y) = 0 TL (transfer yapılmadı)
    - (Z) = 3.000.000 TL (genel şartların tamamı sağlandı)
    - Toplam = 4.000.000 + 0 + 3.000.000 = 7.000.000 TL
