  kok: 'Tam mükellef kurumların KVK md. 5/1-(h) bendi kapsamındaki yurt dışı inşaat, onarım, montaj işleri ile teknik hizmet
    kazançlarına ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Yurt dışında devam eden bir inşaat işi bulunan kurumun, bu işe bağlı olarak Türkiye''deki merkezinde yürüttüğü proje
    hazırlama ve mühendislik hizmetlerinden sağladığı kazanç istisnadan yararlanabilir.

    II. Yurt dışında inşaat işi, işyeri ya da daimi temsilcisi bulunmayan kurumun Türkiye''den verdiği mimarlık ve mühendislik
    hizmetinden sağladığı kazanç istisnadan yararlanabilir.

    III. Yurt dışında inşaat işi bulunmayan kurumun, yurt dışındaki işyeri aracılığıyla verdiği mimarlık ve mühendislik hizmetinden
    sağladığı kazanç istisnadan yararlanabilir.

    IV. İnşaat işinden sağlanan kazancın istisnadan yararlanabilmesi için Türkiye''ye getirilmesi zorunludur.'
  secenekler:
    A: Yalnız I
    B: Yalnız III
    C: I ve IV
    D: I, III ve IV
    E: I ve III
  dogru: E
  aciklama:
    dogru_neden: 'Kurumun yurt dışında bir inşaat ve onarım işi varsa buna bağlı teknik hizmetlerden sağlanan kazanç, hizmet
      ister Türkiye''de ister yurt dışında yapılsın istisnadan yararlanır (I doğru). Yurt dışında inşaat işi yoksa yalnızca
      yurt dışında bir işyeri veya daimi temsilci aracılığıyla yapılan teknik hizmetlerden elde edilen kazanç istisnadan yararlanır
      (III doğru); işyeri veya daimi temsilci olmadan Türkiye''den verilen hizmet ise hizmet ihracatıdır (II yanlış). Kazancın
      Türkiye''ye getirilmesi zorunlu değildir; genel sonuç hesaplarına intikal ettirilmesi yeterlidir (IV yanlış). Püf noktaları:
      (1) Teknik hizmetin Türkiye''de ya da yurt dışında yapılması, inşaat işi varsa fark yaratmaz. (2) İnşaat işi yoksa kural
      değişir ve yurt dışı işyeri veya daimi temsilci aranır. (3) Bu istisnada, 5/1-(g)''den farklı olarak, Türkiye''ye transfer
      ve vergi yükü şartı yoktur.'
    celdiriciler:
      A: 'III. öncül de doğrudur: inşaat işi olmasa bile yurt dışı işyeri aracılığıyla yapılan teknik hizmet kazancı istisnadan
        yararlanır.'
      B: 'I. öncül de doğrudur: yurt dışında inşaat işi varsa buna bağlı teknik hizmetler Türkiye''de yapılsa da istisna uygulanır.'
      C: 'IV. öncül yanlıştır: kazancın Türkiye''ye getirilmesi şart değildir, genel sonuç hesaplarına intikal ettirilmesi
        yeterlidir; ayrıca III. öncül de doğrudur.'
      D: 'IV. öncül yanlıştır: Türkiye''ye getirme zorunluluğu bulunmamaktadır.'
