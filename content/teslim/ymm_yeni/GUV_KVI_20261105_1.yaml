  cozum: '**(a) Dağıtılması gereken tutar**


    Müşterek genel giderler, ilgili faaliyetlere cari yılda oluşan maliyetlerin birbirine oranı esas alınarak dağıtılır. Taşınmaz
    faaliyeti maliyeti 10.000.000 TL, diğer faaliyetlerin maliyeti 5.000.000 TL olduğundan oran 10/15''tir.


    | Kalem | Taşınmaz faaliyeti (TL) | Diğer faaliyetler (TL) |

    |---|---|---|

    | Hasılat | 18.000.000 | 3.000.000 |

    | Doğrudan maliyet ve gider | (10.000.000) | (5.000.000) |

    | Müşterek genel gider payı | (1.000.000) | (500.000) |

    | **Sonuç** | **7.000.000 kazanç** | **2.500.000 zarar** |


    Toplam kazanç: 7.000.000 − 2.500.000 = **4.500.000 TL**. Taşınmaz faaliyeti kârla, diğer faaliyetler zararla sonuçlandığından
    ve toplam kazanç taşınmazlardan elde edilen kazançtan düşük olduğundan, kazancın yarısının dağıtılması yeterlidir (Tebliğ
    bölüm 5.5). Dağıtılması gereken tutar: 4.500.000 × %50 = **2.250.000 TL**.


    Süre: Beyannamenin verilmesi gereken ay Nisan 2027 olduğundan, bu ayı izleyen ikinci ayın sonu olan **30 Haziran 2027**''ye
    kadar dağıtım yapılmalıdır.


    **(b) Durumlar**


    1. Karın sermayeye eklenmesi kâr dağıtımı sayılmaz. Süresinde yapılan nakdi dağıtım yalnızca 1.500.000 TL olup 2.250.000
    TL''den azdır; **şart sağlanmamıştır**.

    2. Süresi içinde 2.300.000 TL ≥ 2.250.000 TL dağıtılmıştır; **şart sağlanmıştır**.

    3. Tutar yeterli olsa da 30 Haziran 2027''den sonra dağıtıldığından **şart sağlanmamıştır**; süreden sonra yapılan dağıtımla
    istisnadan yararlanılamaz.


    Şartın sağlanamadığı hâllerde taşınmaz gelirleri dahil tüm gelirler için istisnadan yararlanılamaz. İstisnadan yararlanılmışsa
    zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır; vergi ziyaı cezası ve gecikme faiziyle tahsil edilir.


    **(c) (D) A.Ş.''nin kâr payı istisnası**


    - (P) A.Ş. tam mükellef olduğundan kâr payının tamamı (1.500.000 TL) 5/1-(a) kapsamında istisnadır; iştirak oranı ve süresi
    aranmaz.

    - (C) Ortaklığı kazancını (d) bendi gereği genel oranda vergilendirmemiş, yalnızca asgari kurumlar vergisi ödemiştir.
    Kâr payının tamamı istisnaya konu edilemez; istisna edilebilecek kısım (asgari vergi oranı / (D) A.Ş.''nin tabi olduğu
    kurumlar vergisi oranı) × kâr payı = (10/25) × 2.000.000 = **800.000 TL**''dir.

    - İstisna edilecek toplam kâr payı: 1.500.000 + 800.000 = 2.300.000 TL. (C)''den alınan kâr payının kalan 1.200.000 TL''si
    vergilendirilir.


    **(d) Matrah ve vergi**


    İştirak hisseleri alımıyla ilgili finansman giderleri (300.000 TL) KVK md. 5/3 uyarınca kurum kazancından indirilebilir;
    kanunen kabul edilmeyen gider olarak eklenmez. Buna karşılık yalnızca istisna kapsamındaki (P) kâr payına ilişkin 100.000
    TL gider kanunen kabul edilmeyen gider sayılır.


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 9.000.000 |

    | + Kanunen kabul edilmeyen gider (istisna kazanca ilişkin gider) | 100.000 |

    | = Kurum kazancı | 9.100.000 |

    | − (P) A.Ş. kâr payı istisnası | 1.500.000 |

    | − (C) Ortaklığı kâr payı istisnası | 800.000 |

    | = **Kurumlar vergisi matrahı** | **6.800.000** |

    | Hesaplanan kurumlar vergisi (%25) | **1.700.000** |

    '
