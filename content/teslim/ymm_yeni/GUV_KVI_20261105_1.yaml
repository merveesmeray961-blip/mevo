  cozum: '**(a) İşlem bazında istisna**


    KVK md. 5/1-(f) uyarınca bankaların, finansal kiralama ya da finansman şirketlerinin bu şekilde (kanuni takip nedeniyle)
    elde ettikleri kıymetlerden taşınmazların satışından doğan kazançların %50''si, diğerlerinin (iştirak hisseleri, kurucu
