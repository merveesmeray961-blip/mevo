  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: tapu harçları
  tip: hesaplama
  zorluk: 3
  kok: (R) A.Ş., (S) Ltd. Şti.'den bir işyeri satın almak üzere 2 Mart 2026'da resmî şekilde gayrimenkul satış vaadi sözleşmesi
    yapmış, sözleşmede yazılı bedel 9.000.000 TL olarak belirlenmiştir. Taşınmazın 1319 sayılı Emlak Vergisi Kanunu'na göre
    belirlenen vergi değeri 2.000.000 TL'dir. (R), sözleşmeyi tapu siciline şerh ettirmiştir. Taşınmaz halen aylık 50.000
    TL kira ile (T) A.Ş.'ye kiralıdır. Bu soruda Harçlar Kanunu'na ekli (4) sayılı tarifenin I-12 numaralı fıkrasındaki satış
    vaadi şerhi oranı olarak 2026 yılında uygulanan binde 6,83 kabul edilecektir. Şerh işlemi için hesaplanacak tapu harcı
    kaç TL'dir?
  secenekler:
    A: 13.660,00
    B: 18.200,00
    C: 27.320,00
    D: 61.470,00
    E: 75.130,00
  dogru: C
  aciklama:
    dogru_neden: 'Satış vaadi sözleşmelerinin tapu siciline şerhinde harç, sözleşmede yazılı bedel üzerinden alınır; ancak
      bu bedel emlak vergisi değerinden az, emlak vergisi değerinin iki katından çok olamaz. Sözleşme bedeli (9.000.000 TL)
      üst sınırı (2 × 2.000.000 = 4.000.000 TL) aştığı için matrah 4.000.000 TL''ye indirilir. Harç = 4.000.000 × 6,83 / 1.000
      = 27.320 TL. Püf noktaları: (1) Sözleşme bedeli ile matrah aynı şey değildir; alt ve üst sınırı birlikte kontrol edin.
      (2) Soruda geçen kira bedeli şerh harcıyla ilgili değildir (gereksiz veri). (3) Binde 4,55 ipotek oranıdır; satış vaadi
      şerhinde binde 6,83 uygulanır.'
    celdiriciler:
      A: Matrah olarak emlak vergisi değeri (2.000.000 TL) alınmıştır; bu değer yalnızca alt sınırdır, sözleşme bedeli alt
        sınırın üstünde olduğundan bedel esas alınır ve ancak üst sınıra kadar dikkate alınır.
      B: Matrah doğru (4.000.000 TL) bulunmuş ancak ipotek tesisine ait binde 4,55 oranı uygulanmıştır.
      D: Üst sınır uygulanmamış, sözleşme bedelinin tamamı (9.000.000 TL) matrah alınmıştır.
      E: Sözleşme bedeli ile emlak vergisi değeri toplanmıştır (11.000.000 TL); kanunda böyle bir hesap yoktur.
    hesap_adimlari:
    - 'Alt sınır: 2.000.000 TL; üst sınır: 2 × 2.000.000 = 4.000.000 TL'
    - Sözleşme bedeli 9.000.000 TL üst sınırı aştığından matrah 4.000.000 TL
    - 'Harç: 4.000.000 × 0,00683 = 27.320 TL'
  kaynaklar:
  - mevzuat: 492 sayılı Harçlar Kanunu
    madde: (4) sayılı tarife I-12
    alinti: Satış vaadi sözleşmeleri ile irtifak hakkı tesisi vaadi sözleşmelerinin tapu siciline şerhinde, sözleşmede yazılı
      bedel üzerinden (Bu bedel, sözleşmeye konu gayrimenkulün emlak vergisi değerinden az, emlak vergisi (Binde 6,83) Binde
      5,4 değerinin iki katından çok olamaz)
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'matrah = min(max(9000000, 2000000), 2 * 2000000)

      sonuc = round(matrah * 6.83 / 1000, 2)

      '
