  - YMM
  ders: HSV
  unite: Damga vergisi ve harçlar
  konu: DMG
  kazanim: nispi ve maktu vergi
  tip: hesaplama
  zorluk: 2
  kok: '(Y) Belediyesi, 4734 sayılı Kamu İhale Kanunu kapsamındaki hizmet alımı ihalesini 9 Nisan 2026''da (Z) Ltd. Şti.''ne
    vermiştir. İhale kararında yazılı bedel 6.000.000 TL''dir. Bu soruda 488 sayılı Kanuna ekli (1) sayılı tabloda 2026 yılında
    uygulanan oranlar şöyle kabul edilecektir: ihale kararları binde 5,69; idare ile düzenlenen sözleşmeler binde 9,48; maaş
    ve ücret makbuzları binde 7,59. Azami tutar aşılmamaktadır. Bu ihale kararı için hesaplanacak damga vergisi kaç TL''dir?'
  secenekler:
    A: 27.000,00
    B: 34.140,00
    C: 45.540,00
    D: 56.880,00
    E: 91.020,00
  dogru: B
  aciklama:
    dogru_neden: 'İhale kararları (1) sayılı tablonun II-2 numaralı fıkrasına göre nispi vergiye tabidir. Soruda verilen 2026
      oranı binde 5,69''dur: 6.000.000 × 5,69 / 1.000 = 34.140 TL. Sözleşme için ayrıca binde 9,48 oranı uygulanır ancak soru
      yalnızca ihale kararını sormaktadır.'
    celdiriciler:
      A: Kanunla getirilen eski oran olan binde 4,5 kullanılmıştır; 2026 yılında uygulanan oran binde 5,69'dur.
      C: Maaş ve ücret makbuzlarına ait binde 7,59 oranı uygulanmıştır; ihale kararı için bu oran geçerli değildir.
      D: İdare ile düzenlenen sözleşmeye ait binde 9,48 oranı uygulanmıştır; ihale kararı ayrı bir kâğıttır.
      E: İhale kararı ile sözleşmenin vergileri toplanmıştır (34.140 + 56.880); soru yalnızca ihale kararını sormaktadır.
    hesap_adimlari:
    - 'Matrah: 6.000.000 TL'
    - 'Vergi: 6.000.000 × 0,00569 = 34.140 TL'
  kaynaklar:
  - mevzuat: 488 sayılı Damga Vergisi Kanunu
    madde: (1) sayılı tablo II-2
    alinti: '2. (Değişik: 4/6/2008-5766/10 md.) İhale (Binde 4,5) (Binde 5,69) Kanunlarına tabi olan veya olmayan resmi daire
      ve kamu tüzel kişiliğini haiz kurumların her türlü ihale kararları'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'sonuc = round(6000000 * 5.69 / 1000, 2)

      '
- id: TASLAK
  sinav: ymm
