  kok: (K) Bankası, Damga Vergisi Kanunu'nun 22 nci maddesinin birinci fıkrasının (a) bendi kapsamında Maliye Bakanlığınca
    belirlenen kuruluşlardandır. (L) Ltd. Şti. ise bu kapsamda belirlenmemiş bir mükelleftir. (K) Bankası Temmuz 2026'da 8'inde
