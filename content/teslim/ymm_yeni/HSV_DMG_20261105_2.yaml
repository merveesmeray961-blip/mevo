      için ise hem beyan hem ödeme 23 Temmuz 2026'ya kadar yapılır.
    B: (K) Bankası'nın 8 Temmuz tarihli kâğıdı için 23 Temmuz 2026, 29 Temmuz tarihli kâğıdı için 13 Ağustos 2026 son gündür;
