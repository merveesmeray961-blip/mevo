    III. Vergi mahkemesi kararları üzerinden alınan harçlar, bölge idare mahkemesince mükellef lehine karar verildiğinde başvurma
    harcı dahil geri verilir.

    IV. Geri verme, kesin kararın tebliği tarihinden itibaren bir yıl içinde yapılır veya istek üzerine vergi borcuna mahsup
    edilir.'
  secenekler:
    A: Yalnız I
    B: I ve II
    C: II ve III
    D: I, II ve IV
    E: I, II, III ve IV
