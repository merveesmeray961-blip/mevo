    dogru_neden: 492 sayılı Kanunun 55 inci maddesine göre başvurma harcı dava dilekçesi verilirken makbuz karşılığında ödenir;
      nispi ve maktu harçlar ihbarnamenin tebliğinden itibaren 1 ay içinde vergi dairesine ödenir (I ve II doğru). Madde 56'ya
      göre vergi mahkemelerinin nihai kararları üzerinden alınan nispi ve maktu harçlar, bölge idare mahkemesince veya Danıştayca
      mükellef lehine karar verilirse kazanılan miktar üzerinden kesin kararın tebliğinden itibaren bir yıl içinde geri verilir
      veya istek üzerine vergi borcuna mahsup edilir (IV doğru). Başvurma harcı bu iadenin dışındadır, bu nedenle III yanlıştır.
    celdiriciler:
      A: Yalnız I doğru değildir; II ve IV de kanun metnine uygundur.
      B: II doğrudur ancak IV de doğrudur; bu seçenek IV'ü dışarıda bırakmaktadır.
      C: III yanlıştır; iade başvurma harcını kapsamaz.
      E: III yanlıştır; başvurma harcı hariç tutulmuştur, bu nedenle dört öncülün tümü doğru değildir.
