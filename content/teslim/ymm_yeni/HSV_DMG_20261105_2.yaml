    I. Başvurma harcı, dava dilekçesi verilirken makbuz karşılığında ödenir.

    II. Nispi ve maktu harçlar, ihbarnameye göre, ihbarnamenin tebliği tarihinden itibaren 1 ay içinde ilgili vergi dairesine
