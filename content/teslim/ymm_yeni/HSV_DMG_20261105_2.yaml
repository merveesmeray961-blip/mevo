    E: '(K) Bankası ile (L) Ltd. Şti. aynı kuralın kapsamındadır: her ikisi de Temmuz''da düzenlediği kâğıtları 20 Ağustos
      2026''ya kadar beyan eder, 26 Ağustos 2026''ya kadar öder.'
