    **(b) Kısmi vergi indirimi (md. 33 ve GUT)**


    Toplam satışlar = 6.000.000 + 2.000.000 + 1.000.000 + 1.000.000 = 10.000.000 TL.

    İndirim hakkı tanınmayan işlem (4 numaralı) = 1.000.000 TL.


    | Hesap | Tutar |

    |---|---|

    | Oran: 1.000.000 / 10.000.000 | %10 |

    | İlave edilecek KDV: 1.400.000 × %10 | **140.000 TL** |


    Önce yüklenilen KDV''nin tamamı indirim hesabına alınır, sonra oran uygulanarak bulunan tutar beyannamede "İlave Edilecek
    KDV" satırına yazılır.


