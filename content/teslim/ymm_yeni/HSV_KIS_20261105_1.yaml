    - **iii – Binek otomobil:** Faaliyeti binek otomobil kiralama veya işletme olanların bu amaçla kullandıkları hariç, işletmelere
    ait binek otomobillerinin alış vesikalarındaki KDV indirilemez (md. 30/b). **200.000 TL indirilemez**. İkisi birlikte
    300.000 TL KDV oransal dağıtıma konu edilmeden tamamen dışarıda bırakılır.


