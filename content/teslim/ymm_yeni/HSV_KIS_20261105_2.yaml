      C: Yalnız binek otomobil KDV'si dışarıda bırakılmış, zayi mal KDV'si indirilmiştir.
      E: İhracatla ilgili 120.000 TL de indirilmemiştir; md. 32 ihracat istisnasıyla ilgili KDV'nin indirimini öngörür.
    hesap_adimlari:
