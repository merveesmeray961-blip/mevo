- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: HSV
  unite: Özel tüketim vergisi
  konu: OTV
  kazanim: mükellef
  tip: uygulama
  zorluk: 2
  kok: Elektronik eşya imalatçısı (E) A.Ş.’nin üretip stok kalan, Özel Tüketim Vergisi Kanunu’na ekli (IV) sayılı listede
    yer alan bir malı, müzayede yoluyla satışı gerçekleştiren (M) A.Ş. satmıştır. Bu satışta özel tüketim vergisi mükellefi
    aşağıdakilerden hangisidir?
  secenekler:
    A: Malı imal eden (E) A.Ş. mükelleftir; müzayede şirketi yalnızca aracıdır.
    B: Mükellef, malı müzayedede satın alan alıcıdır.
    C: Hem (E) hem (M) birlikte müteselsilen mükelleftir; vergi iki kez ödenir.
    D: Satışı gerçekleştiren (M) A.Ş. mükelleftir; imalatçı mükellef sayılmaz.
    E: Mal (IV) sayılı listede olduğundan müzayede yoluyla satış vergiden müstesnadır.
  dogru: D
  aciklama:
    dogru_neden: Madde 4/1-a’ya göre (IV) sayılı listedeki malları imal, inşa veya ithal edenlerle bu malların müzayede yoluyla
      satışını gerçekleştirenler vergi mükellefidir. Bu nedenle müzayede yoluyla satışı gerçekleştiren (M) A.Ş. mükelleftir.
    celdiriciler:
      A: Kanunda mal müzayede yoluyla satılıyorsa satışı gerçekleştirenler de mükellef sayılır.
      B: Mükellef, satışı gerçekleştiren müzayede şirketidir; alıcı mükellef değildir.
      C: Kanun iki ayrı mükellefiyet öngörmez; müzayede yoluyla satışı gerçekleştiren mükelleftir.
      E: Müzayede satışı istisna değil, mükellefiyet doğuran bir işlemdir.
    hesap_adimlari: []
  kaynaklar:
  - mevzuat: 4760 sayılı Özel Tüketim Vergisi Kanunu
    madde: Madde 4/1-a
    alinti: 1. Özel tüketim vergisinin mükellefi, bu Kanuna ekli; a) (I), (III) ve (IV) sayılı listelerdeki mallar ile (II)
      sayılı listedeki mallardan kayıt ve tescile tâbi olmayanları imal, inşa veya ithal edenler ile bu malların müzayede
      yoluyla satışını gerçekleştirenler, b) (II) sayılı listedeki mallardan kayıt ve tescile tâbi olanlar için; motorlu araç
      ticareti yapanlar, kullanmak üzere ithal edenler veya müzayede yoluyla satışını gerçekleştirenlerdir.
