- id: TASLAK
  sinav: ymm
  ders: IFM
  konu: FAR
  kazanimlar:
  - beklenen kredi zararı modeli (12 aylık / ömür boyu, kredi riskinde önemli artış)
  - kredi-değer düşüklüğüne uğramış varlıkta faiz geliri
  - ticari alacaklarda basitleştirilmiş yaklaşım ve karşılık matrisi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Anadolu Gıda Dağıtım AŞ (finansal kuruluş olmayan, TFRS uygulayan bir işletme), bayilerine verdiği kredileri sözleşmeye
    bağlı nakit akışlarını tahsil etmek amacıyla elde tutmakta ve itfa edilmiş maliyetinden ölçmektedir. Kredilerin tamamı
    SPPI testini geçmektedir; hiçbiri satın alındığında veya oluşturulduğunda kredi-değer düşüklüğü bulunan finansal varlık
    değildir. Üç kredinin etkin faiz oranı %12''dir; işletmenin raporlama dönemi takvim yılıdır. Aşağıda belirtilen tüm nakit
    açığı ve kayıp oranı verileri, etkin faiz oranıyla iskonto edilmiş tutarları yansıtmaktadır.


    31.12.2025 tarihli durum:


    | Kredi | Brüt defter değeri (TL) | Raporlama tarihindeki durum |

    |---|---|---|

    | K1 | 2.000.000 | Ödemeler zamanında yapılmaktadır; ilk kayıttan bu yana temerrüt riskinde önemli artışa işaret eden
    bir bilgi yoktur. 12 aylık temerrüt olasılığı %3, temerrüt halinde kayıp oranı %40''tır. |

    | K2 | 1.500.000 | Sözleşmeye bağlı ödemeler vadeyi 45 gün aşmıştır; bu duruma ilişkin ön kabulü çürütecek makul ve desteklenebilir
    bir bilgi yoktur. Ömür boyu nakit açığı senaryoları: %70 olasılıkla 0 TL; %20 olasılıkla 300.000 TL; %10 olasılıkla 900.000
    TL. |

    | K3 | 1.000.000 | Borçlu iflas başvurusunda bulunmuştur. Tahsil edilmesi beklenen nakit akışlarının bugünkü değeri 400.000
    TL''dir (kredi, 2025 içinde kredi-değer düşüklüğüne uğramış varlık haline gelmiştir; 2025 faizi brüt defter değeri üzerinden
    hesaplanmıştır). |


    Şirketin TFRS 15 kapsamındaki satışlarından doğan ve önemli finansman bileşeni içermeyen ticari alacaklarının 31.12.2025
    tarihli yaşlandırması ile geçmiş kayıp deneyiminden (ileriye yönelik bilgilerle düzeltilmiş) türetilen karşılık oranları
    şöyledir; bu alacaklar için daha önce ayrılmış zarar karşılığı 140.000 TL''dir:


    | Yaşlandırma | Brüt tutar (TL) | Karşılık oranı |

    |---|---|---|

    | Vadesi geçmemiş | 4.000.000 | %1 |

    | 1-30 gün geçmiş | 1.500.000 | %2 |

    | 31-89 gün geçmiş | 800.000 | %3 |

    | 90-180 gün geçmiş | 300.000 | %20 |

    | 180 günden fazla geçmiş | 100.000 | %50 |


    2026 yılı gelişmeleri: K1''in ödemeleri düzenli sürmüş, 12 aylık temerrüt olasılığı %5''e yükselmiş, kayıp oranı değişmemiştir.
    K2''nin vadesi geçen tutarları 2026 içinde tahsil edilmiş ve ilk kayıttan bu yana kredi riskinin önemli ölçüde arttığına
    ilişkin bilgi kalmamıştır; 31.12.2026''da brüt defter değeri 1.500.000 TL, 12 aylık temerrüt olasılığı %4, kayıp oranı
    %50''dir. K3 için 2026''da tahsilat yapılmamış, tahsilat beklentilerinde bir değişiklik olmamıştır (31.12.2026''da beklenen
    nakit akışlarının bugünkü değeri, bir yıllık faiz etkisi kadar artmıştır). K1 ve K2''nin 2026 faizleri tahsil edilmiştir;
    K3 için tahsilat yoktur.


    **İstenenler**


    (a) 31.12.2025 itibarıyla K1, K2 ve K3 için zarar karşılığının hangi esasa göre (12 aylık / ömür boyu) ölçüleceğini gerekçesiyle
    belirtiniz ve zarar karşılığı tutarlarını ile toplamını hesaplayınız. (8 puan)


    (b) 2026 yılında her kredi için finansal tablolara alınacak faiz gelirini hesaplayınız (K3 için esası açıklayınız) ve
    31.12.2026 itibarıyla kredilerin zarar karşılığı tutarlarını ve net defter değerlerini bulunuz. (7 puan)


    (c) Ticari alacaklar için 31.12.2025''te ayrılması gereken zarar karşılığını karşılık matrisiyle hesaplayarak ilave ayrılacak
    tutarı bulunuz ve uygulanan yaklaşımın niteliğini belirtiniz. (6 puan)


    (d) K2''nin 2025''te ömür boyu beklenen kredi zararı esasına, 2026''da ise yeniden 12 aylık esasa tabi olmasının dayanağını
    ve K3''ün faiz gelirinin K1/K2''den farklı hesaplanmasının nedenini TFRS 9 paragraflarına atıfla açıklayınız. (4 puan)

    '
  cozum: '**(a) Ölçüm esası ve zarar karşılığı (31.12.2025)**


    - **K1:** Kredi riskinde önemli artış yoktur; zarar karşılığı **12 aylık** beklenen kredi zararına eşit tutardan ölçülür
    (5.5.5). BKZ = 2.000.000 × %3 × %40 = **24.000 TL**.

    - **K2:** Sözleşmeye bağlı ödemeler vadeyi 30 günden fazla aşmıştır ve aksi ispat edilebilir ön kabul çürütülememiştir;
    kredi riskinde önemli artış kabul edilir, zarar karşılığı **ömür boyu** BKZ''ye eşit tutardan ölçülür (5.5.3, 5.5.11).
    Olasılık ağırlıklı BKZ (5.5.17(a)): 0,70 × 0 + 0,20 × 300.000 + 0,10 × 900.000 = **150.000 TL**.

    - **K3:** Borçlunun iflas başvurusu, Ek A''daki kredi-değer düşüklüğü göstergelerindendir; ömür boyu BKZ esası uygulanır.
    BKZ = brüt defter değeri − beklenen nakit akışlarının bugünkü değeri = 1.000.000 − 400.000 = **600.000 TL**.


    | Kredi | Brüt değer | Ölçüm esası | Zarar karşılığı | Net defter değeri |

    |---|---|---|---|---|

    | K1 | 2.000.000 | 12 aylık | 24.000 | 1.976.000 |

    | K2 | 1.500.000 | Ömür boyu | 150.000 | 1.350.000 |

    | K3 | 1.000.000 | Ömür boyu (kredi-değer düşüklüğü) | 600.000 | 400.000 |

    | **Toplam** | **4.500.000** | | **774.000** | **3.726.000** |


    **(b) 2026 faiz geliri ve 31.12.2026 durumu**


    - K1: 2.000.000 × %12 = 240.000 TL (brüt defter değeri üzerinden, 5.4.1).

    - K2: Kredi-değer düşüklüğüne uğramış değildir; faiz brüt defter değeri üzerinden: 1.500.000 × %12 = 180.000 TL.

    - K3: Satın alındığında/oluşturulduğunda kredi-değer düşüklüğü bulunmayan ancak sonradan kredi-değer düşüklüğüne uğrayan
    varlıkta sonraki dönemlerde etkin faiz oranı **itfa edilmiş maliyete** (brüt değer − zarar karşılığı) uygulanır (5.4.1(b)):
    (1.000.000 − 600.000) × %12 = **48.000 TL**. Brüt değer üzerinden hesap (120.000 TL) yanlıştır.

    - Toplam faiz geliri = 240.000 + 180.000 + 48.000 = **468.000 TL**.


    31.12.2026 zarar karşılıkları:


    | Kredi | Hesap | Zarar karşılığı | Net defter değeri |

    |---|---|---|---|

    | K1 | 2.000.000 × %5 × %40 (12 aylık) | 40.000 | 1.960.000 |

    | K2 | 1.500.000 × %4 × %50 (12 aylık; 5.5.7) | 30.000 | 1.470.000 |

    | K3 | BKZ = 1.000.000 − (400.000 × 1,12 = 448.000) | 552.000 | 448.000 |

    | **Toplam** | | **622.000** | **3.878.000** |


    K1''de 16.000 TL değer düşüklüğü zararı, K2''de 120.000 TL değer düşüklüğü kazancı (150.000 → 30.000) finansal tablolara
    alınır (5.5.8). K3''te zarar karşılığındaki 48.000 TL''lik azalış, net defter değeri üzerinden hesaplanan faizin (400.000
    → 448.000) yansımasıdır; tahmin değişmediğinden ayrıca değer düşüklüğü kazancı/kaybı doğmaz.


    **(c) Ticari alacaklar (basitleştirilmiş yaklaşım)**


    | Yaşlandırma | Brüt tutar | Oran | Karşılık |

    |---|---|---|---|

    | Vadesi geçmemiş | 4.000.000 | %1 | 40.000 |

    | 1-30 gün | 1.500.000 | %2 | 30.000 |

    | 31-89 gün | 800.000 | %3 | 24.000 |

    | 90-180 gün | 300.000 | %20 | 60.000 |

    | 180 günden fazla | 100.000 | %50 | 50.000 |

    | **Toplam** | **6.700.000** | | **204.000** |


    Gerekli karşılık 204.000 TL; mevcut 140.000 TL; **ilave karşılık = 64.000 TL**. TFRS 15 kapsamında önemli finansman bileşeni
    içermeyen ticari alacaklarda karşılık her zaman ömür boyu BKZ''ye eşit tutarda ölçülür (5.5.15(a)(i)); kredi riskinde
    önemli artış değerlendirmesi (aşama geçişi) yapılmaz. Karşılık matrisi, 5.5.17 ilkeleriyle tutarlı kolaylaştırılmış bir
    uygulamadır (B5.5.35).


    **(d) Açıklamalar**


    - K2 için 31.12.2025''te vade 30 günden fazla aşılmıştır; 5.5.11 uyarınca bu durum kredi riskinde önemli artış olduğuna
    dair aksi ispat edilebilir ön kabuldür, ön kabulü çürüten bilgi bulunmadığından ömür boyu BKZ uygulanır. 2026''da kredi
    riskinde önemli artışın artık bulunmadığı belirlendiğinden 5.5.7 uyarınca zarar karşılığı yeniden 12 aylık BKZ''ye eşit
    tutardan ölçülür.

    - K3 kredi-değer düşüklüğüne uğramış varlıktır ve bu durum satın alma/oluşturma sırasında değil sonradan ortaya çıkmıştır;
    bu nedenle sonraki raporlama dönemlerinde faiz geliri itfa edilmiş maliyet (brüt değer − zarar karşılığı) üzerinden hesaplanır
    (5.4.1(b)). K1 ve K2''de ise faiz brüt defter değeri üzerinden hesaplanır (5.4.1).

    '
