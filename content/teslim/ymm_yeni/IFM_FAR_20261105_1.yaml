    | Y | 2.000.000 | İtfa edilmiş maliyet | Tahsil + satış (GUD farkı DKG) | 10.000 | 2.060.000 |

    | Z | 3.000.000 | GUD farkı DKG | Yalnızca sözleşmesel nakit akışlarını tahsil (itfa edilmiş maliyet) | 6.000 (DKG''de)
    | 2.880.000 |

    | W | 1.500.000 | GUD farkı DKG | Gerçeğe uygun değer bazında yönetim (GUD farkı K/Z) | 3.000 (DKG''de) | 1.560.000 |


    Z ve W tahvilleri 31.12.2025''e kadar gerçeğe uygun değerleriyle izlenmiş, değer değişimleri ile zarar karşılıkları diğer
    kapsamlı gelirde (DKG) birikmiştir. 31.12.2026''da Y tahvilinin gerçeğe uygun değeri 2.030.000 TL''dir (12 aylık BKZ değişmemiştir).


    Ayrıca şirketin 2025''te şu olayları yaşadığı bilinmektedir: (1) Ani nakit ihtiyacı nedeniyle itfa edilmiş maliyetten
    ölçülen başka bir tahvilin satılması kararı; (2) Bir tahvile ilişkin piyasanın geçici olarak ortadan kalkması; (3) Bazı
    tahvillerin şirketin farklı iş modellerine sahip iki bölümü arasında devredilmesi.


    **İstenenler**


    (a) Yeniden sınıflandırma tarihini gerekçesiyle belirleyiniz; (1)-(3) numaralı olayların iş modeli değişikliği sayılıp
    sayılmadığını açıklayınız ve yeniden sınıflandırmanın geçmiş dönemlere etkisini belirtiniz. (6 puan)


    (b) X ve Y tahvillerinin yeniden sınıflandırma tarihindeki kayıtlarını yaparak kâr veya zarar ile DKG''ye yansıyan tutarları
    bulunuz. (6 puan)


    (c) Z ve W tahvillerinin yeniden sınıflandırma tarihindeki kayıtlarını yapınız; Z''nin yeni brüt defter değeri ve zarar
    karşılığı ile W için kâr veya zarara aktarılacak tutarı bulunuz. (8 puan)


    (d) Y ve Z tahvillerinin 2026 faiz gelirini hesaplayınız ve Y''nin 2026''daki gerçeğe uygun değer değişiminin nereye yansıtılacağını
    belirtiniz. (5 puan)

    '
  cozum: '**(a) Yeniden sınıflandırma tarihi ve iş modeli değişikliği**


    Karar 15.10.2025''te verilmiştir; iş modelinin amacındaki değişiklik yeniden sınıflandırma tarihinden önce gerçekleşmiş
    olmalıdır ve yeniden sınıflandırma, değişiklikten sonraki ilk raporlama döneminin ilk günü olan **1.1.2026**''da yapılır
    (4.4.1, B4.4.2). Şirket 15.10.2025''ten sonra eski iş modeline ilişkin faaliyette bulunmadığından koşul sağlanmıştır.


    Olay (1) belirli finansal varlıkların elde tutulma amacındaki değişikliktir, (2) piyasanın geçici olarak ortadan kalkmasıdır,
    (3) farklı iş modelli bölümler arası devirdir; B4.4.3''e göre **üçü de iş modeli değişikliği değildir**, yeniden sınıflandırma
    gerektirmez.


    Yeniden sınıflandırma yeniden sınıflandırma tarihinden itibaren **ileriye yönelik** uygulanır; daha önce finansal tablolara
    alınmış kazanç, kayıp (değer düşüklüğü dahil) veya faizler için düzeltme yapılmaz (5.6.1).


    **(b) X ve Y (itfa edilmiş maliyetten)**


    *X → GUD farkı K/Z (5.6.2):* Önceki itfa edilmiş maliyet (zarar karşılığı düşülmüş) = 1.000.000 − 4.000 = 996.000. Gerçeğe
    uygun değer 940.000. Fark = **56.000 TL zarar → kâr veya zarar**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | GUD farkı K/Z''ye yansıtılan tahvil (X) | 940.000 | |

    | Beklenen kredi zararı karşılığı (X) | 4.000 | |

    | Yeniden sınıflandırma zararı (kâr/zarar) | 56.000 | |

    | İtfa edilmiş maliyetli tahvil (X) – brüt | | 1.000.000 |


    *Y → GUD farkı DKG (5.6.4):* Önceki itfa edilmiş maliyet 2.000.000 − 10.000 = 1.990.000; gerçeğe uygun değer 2.060.000;
    fark = **70.000 TL kazanç → DKG**. Etkin faiz oranı ve BKZ ölçümü düzeltilmez (B5.6.1(a), (b)); zarar karşılığı bundan
    sonra defter değerini azaltmaz, DKG''de birikmiş değer düşüklüğü olarak izlenir ve açıklanır (B5.6.1(b)).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | GUD farkı DKG''ye yansıtılan tahvil (Y) | 2.060.000 | |

    | Beklenen kredi zararı karşılığı (Y) | 10.000 | |

    | İtfa edilmiş maliyetli tahvil (Y) – brüt | | 2.000.000 |

    | Değer artış fonu (DKG) | | 70.000 |


    **(c) Z ve W (GUD farkı DKG''den)**


    *Z → itfa edilmiş maliyet (5.6.5):* DKG''de birikmiş tutar = 2.880.000 − (3.000.000 − 6.000) = **(114.000) TL** (GUD kaybı
    120.000, zarar karşılığına ilişkin 6.000 alacak). Bu tutar özkaynaktan çıkarılarak gerçeğe uygun değere eklenir; varlık
    başlangıçtan beri itfa edilmiş maliyetten ölçülüyormuş gibi gösterilir. Bu düzeltme kâr veya zararı etkilemez ve yeniden
    sınıflandırma düzeltmesi değildir. Zarar karşılığı yeniden sınıflandırma tarihinden itibaren brüt defter değerinde düzeltme
    olarak izlenir (B5.6.1(b)).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | İtfa edilmiş maliyetli tahvil (Z) – brüt | 3.000.000 | |

    | GUD farkı DKG''ye yansıtılan tahvil (Z) | | 2.880.000 |

    | Beklenen kredi zararı karşılığı (Z) | | 6.000 |

    | Değer artış fonu (DKG) | | 114.000 |


    Yeni brüt defter değeri **3.000.000 TL**, zarar karşılığı **6.000 TL**, net **2.994.000 TL**.


    *W → GUD farkı K/Z (5.6.7):* Tahvil gerçeğe uygun değeriyle (1.560.000) ölçülmeye devam eder. DKG''de birikmiş tutar =
    1.560.000 − (1.500.000 − 3.000) = **63.000 TL (kazanç)**; yeniden sınıflandırma düzeltmesi olarak özkaynaktan çıkarılıp
    kâr veya zarara aktarılır.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Değer artış fonu (DKG) | 63.000 | |

    | Yeniden sınıflandırma kazancı (kâr/zarar) | | 63.000 |


    **(d) 2026 faiz gelirleri ve Y''nin değer değişimi**


    Etkin faiz oranı yeniden sınıflandırmayla değişmediği için (B5.6.1(a)) faiz geliri brüt defter değeri üzerinden hesaplanır:
    Y = 2.000.000 × %8 = **160.000 TL**; Z = 3.000.000 × %8 = **240.000 TL**. Y''nin 2026''daki gerçeğe uygun değer değişimi
    (2.030.000 − 2.060.000 = **(30.000) TL**) DKG''ye yansıtılır.

    '
