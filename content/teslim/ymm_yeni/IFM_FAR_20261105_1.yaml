- id: TASLAK
  sinav: ymm
  ders: IFM
  konu: FAR
  kazanimlar:
  - finansal yükümlülüğün şartlarında önemli değişiklik (%10 testi) ve finansal tablo dışı bırakma
  - finansal varlığın sözleşme şartlarının değiştirilmesi (yapılandırma kazanç/kaybı)
  - kredi riskinde önemli artışın yapılandırılmış varlıkta değerlendirilmesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Karakaya Enerji AŞ (TL işlevsel para birimli, raporlama dönemi takvim yılı) aşağıdaki finansal araç işlemlerini yapmıştır.
    Tüm kredilerde faiz her yıl 31 Aralık''ta ödenmekte, anapara vade sonunda tek seferde ödenmektedir; işlem maliyeti yoktur
    ve etkin faiz oranı kupon oranına eşittir.


    **1. Borçlanmalar:** Karakaya Enerji AŞ''nin 1.1.2025''te kullandığı iki banka kredisi vardır:


    | Kredi | Anapara (TL) | Kupon / etkin faiz | Vade |

    |---|---|---|---|

    | Kredi A | 1.000.000 | %10 | 31.12.2027 |

    | Kredi B | 2.000.000 | %10 | 31.12.2027 |


    Her iki kredi için 31.12.2026 tarihinde 2026 faizi ödendikten sonra bankalarla şartlar yeniden yapılandırılmıştır:


    - **Kredi A:** Vade 31.12.2029''a uzatılmış, kupon oranı %4''e düşürülmüş, Karakaya bankaya 31.12.2026''da 20.000 TL yapılandırma
    ücreti ödemiştir. Yeniden yapılandırılmış borcun 31.12.2026''daki gerçeğe uygun değeri 860.000 TL''dir.

    - **Kredi B:** Vade 31.12.2028''e uzatılmış, kupon oranı %8''e düşürülmüş, bankaya 30.000 TL yapılandırma ücreti ödenmiştir.


    İskonto faktörleri (%10): 1. yıl 0,9091; 2. yıl 0,8264; 3. yıl 0,7513. Her iki kredinin yeniden yapılandırma öncesi kalan
    nakit akışlarının %10 ile iskonto edilmiş bugünkü değeri defter değerine eşittir (A: 1.000.000 TL; B: 2.000.000 TL).


    **2. Alacak:** Karakaya Enerji AŞ''nin Dağ Ltd.''den, itfa edilmiş maliyetinden ölçülen, 1.1.2025''te 1.000.000 TL anapara
    ile verdiği 5 yıl vadeli (31.12.2029) ve yıllık %8 kuponlu bir kredi alacağı vardır (etkin faiz oranı %8; faiz her yıl
    31 Aralık''ta tahsil edilmektedir). Dağ Ltd.''nin yaşadığı finansal güçlük nedeniyle 31.12.2026''da (2026 faizi tahsil
    edildikten sonra) vade 31.12.2030''a uzatılmış ve kupon oranı %4''e düşürülmüştür; anapara tutarı değişmemiştir. Yapılandırma,
    alacağın finansal tablo dışı bırakılmasına yol açmamaktadır. Karakaya yapılandırma için 10.000 TL hukuk müşavirliği gideri
    ödemiştir. İskonto faktörleri (%8): 1. yıl 0,9259; 2. yıl 0,8573; 3. yıl 0,7938; 4. yıl 0,7350.


    Karakaya''nın kredi riski politikası, ilk kayıt tarihinde (başlangıçtaki değiştirilmemiş şartlar bazında) tahmin edilen
    kalan ömür boyu temerrüt olasılığının raporlama tarihinde (değiştirilmiş şartlar bazında) iki katını aşmasını kredi riskinde
    önemli artış saymaktadır. Dağ Ltd. alacağı için kalan ömür boyu temerrüt olasılığı, ilk kayıtta tahmin edilen şartlarla
    %6; 31.12.2026''da değiştirilmiş şartlarla %18''dir.


    **İstenenler**


    (a) Kredi A''da şartların önemli ölçüde farklılaşıp farklılaşmadığını %10 testi ile belirleyiniz. (7 puan)


    (b) Kredi A için 31.12.2026 tarihli muhasebe kaydını yapınız ve sonucu açıklayınız. (5 puan)


    (c) Kredi B için aynı testi yaparak sonucu belirtiniz ve ödenen ücretin muhasebeleştirilmesini açıklayarak 31.12.2026
    tarihli defter değerini bulunuz. (4 puan)


    (d) Dağ Ltd. alacağı için yapılandırma kazanç/kaybını ve yapılandırma sonrası brüt defter değerini hesaplayınız, kredi
    riskinde önemli artış olup olmadığını belirleyerek zarar karşılığının ölçüm esasını belirtiniz. (9 puan)

    '
  cozum: '**(a) Kredi A – %10 testi (B3.3.6)**


    Yeni şartlar altındaki nakit akışları (ödenen ücret dahil, 31.12.2026 itibarıyla):


    | Kalem | Hesap | Bugünkü değer (TL) |

    |---|---|---|

    | Ödenen ücret (t = 0) | 20.000 | 20.000 |

    | 2027-2029 kuponları | 40.000 × (0,9091 + 0,8264 + 0,7513 = 2,4868) | 99.472 |

    | 2029 anapara | 1.000.000 × 0,7513 | 751.300 |

    | **Toplam** | | **870.772** |


    Eski borcun kalan nakit akışlarının bugünkü değeri = 1.000.000 TL. Fark = (1.000.000 − 870.772) / 1.000.000 = **%12,92**,
    yani en az %10''dur. Bu nedenle şartlar **önemli ölçüde farklılaşmıştır** (B3.3.6); 3.3.2 uyarınca eski borç ortadan kalkmış,
    yeni borç finansal tablolara alınır. Borçlunun finansal güçlük yaşayıp yaşamaması sonucu değiştirmez (3.3.2).


    **(b) Kredi A – kayıt (3.3.3, B3.3.6A)**


    Eski borcun defter değeri 1.000.000 TL; yeni borç gerçeğe uygun değeriyle 860.000 TL''den kaydedilir; ödenen ücret borcun
    sona ermesinden doğan kazanç/kaybın bir parçasıdır. Kazanç = 1.000.000 − 860.000 − 20.000 = **120.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Banka kredisi (eski) | 1.000.000 | |

    | Banka kredisi (yeni; GUD) | | 860.000 |

    | Bankalar (ücret) | | 20.000 |

    | Borç sonlandırma kazancı (kâr/zarar) | | 120.000 |


    **(c) Kredi B**


    Yeni nakit akışlarının bugünkü değeri = 160.000 × 0,9091 + 2.160.000 × 0,8264 + 30.000 (ücret) = 145.456 + 1.785.024 +
