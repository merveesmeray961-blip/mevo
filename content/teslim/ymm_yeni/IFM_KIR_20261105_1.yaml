  soru: '**Veriler**


    Ege Makine Sanayi AŞ (Ege), 1.3.2026 tarihinde Tarım Gıda AŞ (Tarım) ile müşterinin spesifikasyonlarına göre tasarlanacak
    özel bir paketleme hattının üretimi ve montajı için **12.000.000 TL** sabit bedelli sözleşme imzalamıştır (KDV dikkate
    alınmayacaktır). Hat Ege''nin atölyesinde üretilecek ve 31.12.2027''de teslim edilecektir.


    - Hat yalnızca Tarım''ın ihtiyacına göre tasarlanmaktadır; sözleşme Ege''nin hattı başka bir müşteriye yönlendirmesini
    fiilen kısıtlamaktadır. Sözleşme hukuken icra edilebilir olup Tarım, Ege''nin edimini yerine getirememesi dışındaki bir
    nedenle sözleşmeyi feshederse Ege, o güne kadar katlandığı maliyetleri ve makul bir kâr payını tahsil etmeye hak kazanır.

    - Ege, ilerlemeyi katlanılan maliyetlerin tahmini toplam maliyete oranıyla ölçmektedir. Sözleşmenin tahmini toplam maliyeti
    (aşağıdaki olağandışı fire hariç) **8.400.000 TL**''dir.

    - 2026 yılında hat için toplam **4.500.000 TL** maliyete katlanılmıştır. Bu tutarın 300.000 TL''si, sözleşme fiyatına
    yansıtılmamış olağandışı malzeme firesinden (telef olan malzeme) oluşmaktadır.

    - 2026''da Tarım''a 5.000.000 TL fatura kesilmiş ve tahsil edilmiştir. Bedelin kalan kısmı, hattın teslim ve kabulünde
    faturalanacaktır; bu hakkın doğması teslim ve kabule bağlıdır.

    - Ege, sözleşmenin imzalanması nedeniyle satış temsilcisine 1.3.2026''da **240.000 TL** komisyon ödemiştir (sözleşme yapılmasaydı
    komisyon ödenmeyecekti; komisyonun geri kazanılması beklenmektedir). Ayrıca sözleşme imzalanmadan önce teklif hazırlamak
    için **150.000 TL** maliyete katlanmıştır; bu maliyet sözleşme yapılsın yapılmasın katlanılacak nitelikte olup Tarım''a
    ayrıca fatura edilmemiştir.

    - 1.4.2027''de Tarım, hattın teknik şartnamesinde köklü bir değişiklik istemiştir. Yeni özellikler hat ile bütünleşmekte
    olup hattan ayrı olarak anlamlı bir fayda sağlamamaktadır. Taraflar sözleşme bedelini 1.800.000 TL artırarak **13.800.000
    TL**''ye çıkarmış; Ege tahmini toplam maliyeti 1.200.000 TL artışla **9.600.000 TL**''ye revize etmiştir. 1.4.2027 itibarıyla
    (değişiklik öncesinde) katlanılan kümülatif maliyet, olağandışı fire hariç **5.040.000 TL**''dir.


    **İstenenler**


    (a) Ege''nin edim yükümlülüğünün zamana yayılı olarak yerine getirilip getirilmediğini TFRS 15''e göre gerekçelendiriniz
    ve ilerleme ölçüm yöntemini açıklayınız. (5 puan)


    (b) 2026 yılında finansal tablolara alınacak hasılatı, satışların maliyetini ve olağandışı fire giderini hesaplayınız;
    31.12.2026''daki sözleşme varlığı veya yükümlülüğünü bulunuz. (8 puan)


    (c) Komisyon ve teklif hazırlama maliyetlerinin muhasebeleştirilmesini açıklayınız; 31.12.2026''da giderleştirilecek tutarı
    ve varlık bakiyesini bulunuz. (5 puan)


    (d) 1.4.2027''deki değişikliğin nasıl muhasebeleştirileceğini gerekçelendiriniz; değişiklik tarihindeki hasılat düzeltmesini
    hesaplayınız. (7 puan)

