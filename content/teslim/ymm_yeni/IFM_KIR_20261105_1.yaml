  soru: '**Veriler**


    Zirve Yazılım AŞ (Zirve), 1.10.2026 tarihinde Anadolu Perakende AŞ (Anadolu) ile aşağıdaki unsurları içeren tek bir sözleşme
    imzalamıştır (KDV dikkate alınmayacaktır):


    1. **Lisans:** Mağaza yönetimi yazılımının süresiz kullanım lisansı 1.10.2026''da Anadolu''nun kullanımına sunulmuştur.
    Yazılım mevcut haliyle işlevseldir; Zirve''nin lisans sonrasında yazılımın işlevselliğini önemli ölçüde değiştirecek bir
    faaliyeti bulunmamaktadır.

    2. **Eğitim:** 15 günlük kullanıcı eğitimi 15.12.2026''da tamamlanmıştır.

    3. **Destek:** 1.10.2026 - 30.9.2027 dönemini kapsayan, yıl boyunca eşit yoğunlukta sunulan teknik destek hizmeti.


    Sözleşmenin sabit bedeli **1.200.000 TL** olup tamamı 1.10.2026''da nakden tahsil edilmiştir. Anadolu lisanstan, eğitimden
    ve destekten tek başına yararlanabilmekte; üç taahhüt sözleşmede birbirinden ayrı tanımlanabilmektedir.


    Zirve''nin fiyatlama bilgileri şöyledir:


    - Eğitim ve destek düzenli olarak ayrı ayrı satılmaktadır (tek başına satış fiyatları: eğitim 120.000 TL, destek 280.000
    TL). Zirve bu iki hizmeti düzenli olarak paket halinde de 360.000 TL''ye satmaktadır.

    - Lisans, farklı müşterilere 600.000 TL ile 1.100.000 TL arasında değişen fiyatlarla satılmaktadır; lisansın tek başına
    satış fiyatı yüksek derecede değişkendir.

    - Zirve''nin analizi, sözleşmedeki indirimin yalnızca eğitim ve destekten oluşan pakete ilişkin olduğunu gözlemlenebilir
    kanıtlarla göstermektedir.


    Destek hizmetine ilişkin ayrıca şu hüküm vardır: 12 aylık destek döneminde sistemin kullanılabilirliği %99,5''in altına
    düşmezse Anadolu, Zirve''ye ek olarak **60.000 TL** hizmet düzeyi primi ödeyecektir. Sistem, Zirve''nin kontrolünde olmayan
    bir bulut altyapı sağlayıcısı üzerinde çalışmaktadır ve Zirve''nin bu tür bir prim içeren daha önce yaptığı bir sözleşme
    bulunmamaktadır.


    **İstenenler**


    (a) Sözleşmedeki edim yükümlülüklerini belirleyiniz; her birinin belirli bir anda mı yoksa zamana yayılı olarak mı yerine
    getirildiğini gerekçesiyle açıklayınız. (5 puan)


    (b) Sözleşme bedelini edim yükümlülüklerine dağıtınız; indirimin ve lisansın tek başına satış fiyatının nasıl ele alındığını
    açıklayınız. (7 puan)


    (c) 2026 yılında finansal tablolara alınacak hasılatı hesaplayınız; 1.10.2026, 15.12.2026 ve 31.12.2026 tarihli kayıtları
    yapınız ve 31.12.2026''daki sözleşme yükümlülüğü bakiyesini bulunuz. (8 puan)


    (d) Hizmet düzeyi primini 31.12.2026 itibarıyla işlem bedeline dahil edip etmeyeceğinizi gerekçelendiriniz. Kullanılabilirlik
    koşulunun 30.9.2027''de sağlandığının kesinleştiğini varsayarak primin dağıtımını yapınız ve 2027 yılında destek hizmetinden
    finansal tablolara alınacak hasılatı bulunuz. (5 puan)

    '
  cozum: '**(a) Edim yükümlülükleri (TFRS 15 par. 22, 27, 35, 38, B61)**


    Anadolu her bir taahhütten tek başına yararlanabildiği ve taahhütler sözleşmede ayrı tanımlanabildiği için (par. 27) üç
    ayrı edim yükümlülüğü vardır:


    | Edim yükümlülüğü | Yerine getirilme | Gerekçe |

    |---|---|---|

    | Lisans | Belirli bir anda (1.10.2026) | Yazılım işlevseldir ve Zirve''nin fikri mülkiyeti önemli ölçüde etkileyen faaliyeti
    yoktur; B58 şartları karşılanmadığından taahhüt kullanım hakkı sağlamaktır. Müşteri, devir tarihinde lisansın kullanımını
    yönetebilir ve kalan faydaların tamamını elde edebilir (B61, par. 38). |

    | Eğitim | Zamana yayılı (15.12.2026''da tamamlandı) | Müşteri, Zirve edimi yerine getirdikçe faydayı aynı anda alıp tüketir
    (par. 35(a)). |

    | Destek | Zamana yayılı (12 ay) | Aynı gerekçe; eşit yoğunlukta sunulduğundan ilerleme geçen zamanla ölçülür (B15, B18).
    |


    **(b) Bedelin dağıtımı (par. 74, 76-83)**


    - Eğitim ve destek düzenli olarak ayrı satılmakta (120.000 + 280.000 = 400.000 TL), ayrıca düzenli olarak paket halinde
    360.000 TL''ye (%10 indirimle) satılmaktadır. Zirve''nin analizi sözleşmedeki indirimin yalnızca bu pakete ait olduğunu
    gözlemlenebilir olarak gösterdiğinden par. 82''deki şartlar sağlanmıştır: indirim üç edim yükümlülüğüne orantılı değil,
    **yalnızca eğitim ve desteğe** dağıtılır.

    - Par. 83 uyarınca indirim, bakiye yaklaşımı kullanılmadan önce dağıtılır. Lisansın tek başına satış fiyatı yüksek derecede
    değişken olduğundan bakiye yaklaşımı kullanılabilir (par. 79(c)(i)): 1.200.000 - 360.000 = 840.000 TL (lisansın gözlemlenen
    600.000 - 1.100.000 TL aralığındadır, makuldür).


    | Edim yükümlülüğü | Tek başına satış fiyatı | Dağıtılan tutar |

    |---|---|---|

    | Eğitim | 120.000 | 360.000 x 120/400 = 108.000 |

    | Destek | 280.000 | 360.000 x 280/400 = 252.000 |

    | Lisans | Değişken (bakiye yaklaşımı) | 1.200.000 - 360.000 = 840.000 |

    | **Toplam** | | **1.200.000** |


    Tipik hata: indirimin lisansı da kapsayacak biçimde orantılı dağıtılması. Burada gözlemlenebilir kanıt bulunduğundan bu
    yol doğru değildir.


    **(c) 2026 hasılatı ve kayıtlar (par. 31, 38, 39-41, 106)**


    - Lisans: 1.10.2026''da belirli bir anda 840.000 TL.

    - Eğitim: 15.12.2026''da tamamlandığından 108.000 TL.

    - Destek: 3/12 geçmiştir: 252.000 x 3/12 = 63.000 TL.

    - **2026 hasılatı = 840.000 + 108.000 + 63.000 = 1.011.000 TL**

    - Sözleşme yükümlülüğü = 1.200.000 - 1.011.000 = **189.000 TL** (= desteğin henüz sunulmamış 9/12''si: 252.000 x 9/12).

    - Önemli finansman bileşeni: Tahsilat tek seferdir ve destek hizmeti bir yıl içinde tamamlandığından par. 63''teki kolaylaştırıcı
    uygulama nedeniyle bedelde finansman düzeltmesi yapılmaz.


    | Tarih | Hesap | Borç | Alacak |

    |---|---|---|---|

    | 1.10.2026 | Bankalar | 1.200.000 | |

    | | Hasılat (lisans) | | 840.000 |

    | | Sözleşme Yükümlülüğü | | 360.000 |

    | 15.12.2026 | Sözleşme Yükümlülüğü | 108.000 | |

    | | Hasılat (eğitim) | | 108.000 |

    | 31.12.2026 | Sözleşme Yükümlülüğü | 63.000 | |

    | | Hasılat (destek) | | 63.000 |


    Sözleşme yükümlülüğü bakiyesi: 360.000 - 108.000 - 63.000 = 189.000 TL.


    **(d) Değişken bedel (par. 50-57, 59, 85, 88)**


    - Prim değişken bedeldir. Bedelin Zirve''nin kontrolü dışındaki bir altyapı sağlayıcısının performansına duyarlı olması
    (par. 57(a)) ve Zirve''nin benzer sözleşme deneyiminin bulunmaması (par. 57(c)) nedeniyle, belirsizlik ortadan kalktığında
    kümülatif hasılatta önemli bir iptal olmayacağı kuvvetle muhtemel değildir (par. 56). Bu nedenle **31.12.2026''da işlem
    bedeline dahil edilmez**; her raporlama dönemi sonunda yeniden değerlendirilir (par. 59).

    - Primin şartları özel olarak destek hizmetinin yerine getirilmesine bağlıdır ve tamamının destek edimine dağıtılması
    dağıtım amacıyla tutarlıdır; bu nedenle 60.000 TL''nin **tamamı destek hizmetine** dağıtılır, lisans ve eğitime pay verilmez
    (par. 85). Sonradan oluşan değişim, yerine getirilmiş edime ilişkin olduğu dönemde hasılat olarak finansal tablolara alınır
    (par. 88).

    - 2027 destek hasılatı = 252.000 x 9/12 + 60.000 = 189.000 + 60.000 = **249.000 TL**. (Destek, 30.9.2027''de tamamen ifa
    edildiğinden primin tamamı 2027''de hasılat olur.)

    '
