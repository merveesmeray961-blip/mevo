    dogru_neden: 'Kiracının kontrolündeki önemli bir olay nedeniyle uzatma opsiyonunu kullanacağından makul ölçüde emin hâle
      gelmesi kiralama süresini değiştirir (par. 20-21). Kiracı, revize edilmiş kira ödemelerini (kalan 2 + uzatma 2 yıl =
      4 ödeme) revize edilmiş iskonto oranıyla (yeniden değerlendirme tarihindeki alternatif borçlanma oranı, par. 41) indirgeyerek
      yükümlülüğü yeniden ölçer ve farkı kullanım hakkı varlığında düzeltme olarak yansıtır (par. 39-40). Yeni yükümlülük
      1.000.000 x (0,8 + 0,64 + 0,512 + 0,4096) = 2.361.600 TL; düzeltme 2.361.600 - 1.500.000 = 861.600 TL. Püf noktaları:
      (1) Yalnızca uzatma dönemi ödemeleri değil, kalan tüm ödemeler yeni oranla indirgenir. (2) Fark kâr veya zarara değil,
      kullanım hakkı varlığına yazılır; varlık sıfıra inmişse kalan kısım kâr veya zarara gider. (3) Eski iskonto oranı değil,
      yeniden değerlendirme tarihindeki oran kullanılır.'
    celdiriciler:
      B: Yalnızca uzatma dönemi ödemelerinin (2029-2030) yeni oranla bugünkü değeri alınmıştır; kalan ödemelerin yeni oranla
        yeniden indirgenmesi ve mevcut defter değerinin düşülmesi unutulmuştur.
      C: Kalan iki ödemenin yeni oranla bugünkü değeridir; bu, düzeltme tutarı değildir.
      D: Uzatma dönemi ödemeleri iskonto edilmeden toplanmıştır.
      E: Yeni kira yükümlülüğünün tamamı alınmış, mevcut defter değeri (1.500.000 TL) düşülmemiştir.
    hesap_adimlari:
    - 'Revize ödemeler: 2027-2030, her yıl 1.000.000, iskonto %25'
    - 'Yeni yükümlülük: 800.000 + 640.000 + 512.000 + 409.600 = 2.361.600'
    - 'Düzeltme: 2.361.600 - 1.500.000 = 861.600'
