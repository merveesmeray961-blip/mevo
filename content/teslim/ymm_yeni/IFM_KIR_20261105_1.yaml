  cozum: '**(a) Zamana yayılı edim (TFRS 15 par. 35(c), 36-37, 39-41, B14, B18)**


    Hat müşteriye özgü olduğundan Ege için alternatif kullanımı yoktur (par. 36) ve Ege, o güne kadar tamamlanan edime karşılık
    maliyet artı makul kâr payını kapsayan, hukuken icra edilebilir bir tahsil hakkına sahiptir (par. 37). Dolayısıyla par.
    35(c) şartları sağlanır ve edim yükümlülüğü **zamana yayılı** olarak yerine getirilir. (Hat Ege''nin atölyesinde oluştuğundan
    par. 35(a) ve 35(b) uygulanmaz.) İlerleme, girdi yöntemiyle (maliyetten maliyete) ölçülür (B18). Girdi yönteminde, edimin
    ilerlemesine katkısı olmayan, sözleşme fiyatına yansıtılmamış olağandışı verimsizlik maliyetleri ilerleme ölçümüne dahil
    edilmez (B19(a)).


    **(b) 2026 sonuçları**


    | Kalem | Hesap | Tutar (TL) |

    |---|---|---|

    | Katlanılan toplam maliyet | | 4.500.000 |

    | Olağandışı fire (ilerlemeye dahil edilmez) | | (300.000) |

    | İlerleme için maliyet | | 4.200.000 |

    | İlerleme oranı | 4.200.000 / 8.400.000 | %50 |

    | **Hasılat** | 12.000.000 x %50 | **6.000.000** |

    | **Satışların maliyeti** | | **4.200.000** |

    | **Olağandışı fire gideri** (par. 98(b), katlanıldıkça gider) | | **300.000** |


    - Sözleşme varlığı = hasılat 6.000.000 - faturalanıp tahsil edilen 5.000.000 = **1.000.000 TL** (bedeli alma hakkı teslim
    ve kabule bağlı olduğundan alacak değil sözleşme varlığıdır; par. 105-108).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Bankalar | 5.000.000 | |

    | Sözleşme Varlığı | 1.000.000 | |

    | Hasılat | | 6.000.000 |

    | Satışların Maliyeti | 4.200.000 | |

    | Olağandışı Fire Gideri | 300.000 | |

    | Yarı Mamul / İmalat Maliyet Hesapları | | 4.500.000 |


    **(c) Sözleşme maliyetleri (par. 91-94, 99)**


    - Komisyon, sözleşme yapılmasaydı katlanılmayacak ek maliyettir ve geri kazanılması beklendiğinden **varlık** olarak finansal
    tablolara alınır (par. 91-92). İtfa süresi (1.3.2026 - 31.12.2027) bir yıldan uzun olduğundan giderleştirme kolaylığı
    (par. 94) uygulanamaz. Varlık, ilişkili hizmetlerin devri ile tutarlı biçimde itfa edilir (par. 99); ilerleme %50 olduğundan
    2026 itfa gideri = 240.000 x %50 = **120.000 TL**, varlık bakiyesi **120.000 TL**.

    - Teklif hazırlama maliyeti (150.000 TL) sözleşme yapılsın yapılmasın katlanılan ve müşteriye açıkça fatura edilmeyen
    bir maliyet olduğundan **katlanıldığında gider** yazılır (par. 93).

    - 2026''da bu iki kalemden giderleştirilen toplam tutar = 120.000 + 150.000 = **270.000 TL**; yıl sonunda yalnızca komisyondan
    doğan 120.000 TL''lik varlık bakiyesi kalır.


    | Hesap | Borç | Alacak |

    |---|---|---|

