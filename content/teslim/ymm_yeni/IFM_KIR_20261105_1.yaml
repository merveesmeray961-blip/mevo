    ve Sahil''in nasıl muhasebeleştirme yapacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Satış ve piyasa dışı bedel düzeltmesi (TFRS 16 par. 99-102)**


    Devrin satış olup olmadığı TFRS 15''e göre belirlenir (par. 99); kontrol Sahil''e geçtiğinden par. 100 uygulanır. Satış
    bedeli (8.820.000) gerçeğe uygun değerin (8.400.000) üzerindedir; piyasa koşullarının üzerinde ödenen 420.000 TL, alıcı-kiraya
    verenin satıcı-kiracıya sağladığı **ek finansman** olarak muhasebeleştirilir (par. 101(b)).


    Par. 102 gereği düzeltme, kolay tespit edilebilen yöntemle ölçülür; iki yöntem aynı sonucu verir:


    - Bedel farkı: 8.820.000 - 8.400.000 = 420.000.

    - Ödemelerin bugünkü değer farkı: sözleşmeye bağlı 1.452.000 / 1,10 + 1.452.000 / 1,21 = 2.520.000; piyasa kirasının bugünkü
    değeri 1.210.000 / 1,10 + 1.210.000 / 1,21 = 2.100.000; fark 420.000.


    Her ödemenin 1.210.000 TL''si kira, 242.000 TL''si ek finansmanın geri ödemesidir.


    **(b) Satıcı-kiracı kaydı (par. 100(a), 22-26)**


    - Kira yükümlülüğü = 2.100.000 TL. Ek finansman yükümlülüğü = 420.000 TL.

    - Elde tutulan hak oranı = kira yükümlülüğü / gerçeğe uygun değer = 2.100.000 / 8.400.000 = %25.

    - Kullanım hakkı varlığı = 6.000.000 x %25 = **1.500.000 TL**.

    - Toplam kazanç = 8.400.000 - 6.000.000 = 2.400.000; devredilen haklara ilişkin kazanç = 2.400.000 x %75 = **1.800.000
    TL** (yalnızca devredilen haklarla ilişkili kazanç finansal tablolara yansıtılır). Elde tutulan hakka isabet eden 600.000
    TL kazanç yansıtılmaz.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Bankalar | 8.820.000 | |

    | Kullanım Hakkı Varlığı | 1.500.000 | |

    | Birikmiş Amortisman (Bina) | 4.000.000 | |

    | Binalar | | 10.000.000 |

    | Kira Yükümlülüğü | | 2.100.000 |

    | Finansal Yükümlülük (ek finansman) | | 420.000 |

    | Bina Satış Kazancı | | 1.800.000 |

    | **Toplam** | **14.320.000** | **14.320.000** |


    **(c) 31.12.2026 kayıtları**


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Finansman Gideri (kira yükümlülüğü, 2.100.000 x %10) | 210.000 | |

    | Kira Yükümlülüğü | | 210.000 |

    | Kira Yükümlülüğü | 1.210.000 | |

    | Bankalar | | 1.210.000 |

    | Finansman Gideri (ek finansman, 420.000 x %10) | 42.000 | |

    | Finansal Yükümlülük | | 42.000 |

    | Finansal Yükümlülük | 242.000 | |

    | Bankalar | | 242.000 |

    | Amortisman Gideri (1.500.000 / 2, kira süresi yararlı ömürden kısa; par. 32) | 750.000 | |

    | Birikmiş Amortisman (Kullanım Hakkı) | | 750.000 |


    Bakiyeler: kira yükümlülüğü 1.100.000 TL; finansal yükümlülük 220.000 TL; kullanım hakkı varlığı net 750.000 TL.


    **(d) Sahil ve satış sayılmama hali (par. 100(b), 103, 61-63, 81)**


    - Sahil, binayı 8.400.000 TL maliyetle, 420.000 TL''yi ise Kıyı''ya verilen finansman olarak finansal varlık (TFRS 9)
    kaydeder: Binalar 8.400.000 + Finansal Varlık 420.000 / Bankalar 8.820.000.

    - Kiralama 2 yıllık olup bina ekonomik ömrünün çok küçük bir kısmını kapsadığından ve kira ödemelerinin bugünkü değeri
    gerçeğe uygun değerin %25''i olduğundan risk ve getirilerin önemli kısmı devredilmemiştir: **faaliyet kiralamasıdır**.
    Kira geliri doğrusal: 2026 için 1.210.000 TL; finansal varlıktan faiz geliri 420.000 x %10 = 42.000 TL (bina amortismanı
    ayrıca ayrılır).

    - Devir satış sayılmasaydı (par. 103): Kıyı binayı finansal tablolarında göstermeye devam eder ve devir bedeli olan 8.820.000
    TL tutarında finansal yükümlülük yansıtır (TFRS 9); Sahil binayı yansıtmaz, 8.820.000 TL tutarında finansal varlık yansıtır.

    '
