  kok: 'Esas faaliyet konusu turistik tekne kiralama olan bir A.Ş., 2026 yılında şunları gider yazmıştır: kendi işlettiği
    turistik teknelerin giderleri ve amortismanları 1.200.000 TL; faaliyetle ilgisi olmayan, yönetim kurulu başkanının kullandığı
    kiralanmış uçağın giderleri 500.000 TL; 5651 sayılı Kanunun ek 4 üncü maddesi kapsamında hakkında reklam yasağı uygulanan
    bir siteye verilen reklam 150.000 TL; inceleme sonucu ödenen vergi ziyaı cezası 60.000 TL; sözleşmede ceza şartı olarak
    öngörülen tazminat 120.000 TL; normal reklam gideri 900.000 TL. Bu giderlerden kurum kazancının tespitinde indirimi kabul
    edilmeyenlerin toplamı kaç TL''dir?'
  secenekler:
    A: 150.000 TL
    B: 210.000 TL
    C: 560.000 TL
    D: 710.000 TL
    E: 830.000 TL
  dogru: D
  aciklama:
    dogru_neden: 'Md. 11/1-f, yat, uçak gibi taşıtlardan işletmenin esas faaliyet konusu ile ilgili olmayanların giderlerini
      ve amortismanlarını kabul etmez: esas faaliyet olan tekneler indirilir (istisnanın istisnası), uçak (500.000 TL) indirilmez.
      Md. 11/1-j reklam yasağı uygulananlara verilen reklamların (150.000 TL) ve md. 11/1-d vergi cezalarının (60.000 TL)
      indirimini kabul etmez. Ceza şartı olarak öngörülen tazminat md. 11/1-g''nin dışındadır; normal reklam giderleri de
      indirilebilir. Toplam = 500.000 + 150.000 + 60.000 = 710.000 TL.

      Püf noktaları: Esas faaliyetle ilgili taşıt giderleri KKEG değildir; ceza şartı tazminatı ile sıradan reklam giderleri
      gereksiz veridir. Her kalemi hükümle tek tek eşleştirin.'
    celdiriciler:
      A: Yalnız reklam yasağı kapsamındaki reklam alınmıştır; uçak giderleri ve vergi cezası da indirilemez.
      B: Uçak giderleri unutulmuştur; esas faaliyetle ilgisi olmayan hava taşıtı giderleri md. 11/1-f gereği kabul edilmez.
      C: Reklam yasağı kapsamındaki reklam unutulmuştur; md. 11/1-j bu giderlerin indirimini kabul etmez.
      E: Ceza şartı olarak öngörülen tazminat da eklenmiştir; md. 11/1-g bu tazminatları kapsam dışında bırakır.
    hesap_adimlari:
    - 'Uçak: 500.000 TL (md. 11/1-f)'
    - 'Reklam yasağı: 150.000 TL (md. 11/1-j)'
    - 'Vergi ziyaı cezası: 60.000 TL (md. 11/1-d)'
    - 500.000 + 150.000 + 60.000 = 710.000 TL
