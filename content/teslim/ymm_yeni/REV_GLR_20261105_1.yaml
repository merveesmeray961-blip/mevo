    (c) 3 numaralı tespitte 31.12.2026''ya kadar tahakkuk eden faiz gelirini hesaplayınız ve kaydı yapınız. (4 puan)


    (d) 4 numaralı tespitte 31.12.2026''ya kadar tahakkuk eden faiz giderini hesaplayınız ve kaydı yapınız. (4 puan)


    (e) Düzeltmelerin 2026 matrahına toplam etkisini ve kurumlar vergisine etkisini bulunuz. (4 puan)

    '
