- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Gider ve gelir hesaplarının revizyonu
  konu: GLR
  kazanim: işveren bireysel emeklilik katkı payı sınırı
  tip: hesaplama
  zorluk: 3
  kok: Bir işveren, bir çalışanı adına ve ücretle ilişkilendirmeksizin gider yazılacak şekilde 2026 yılında her ay 70.000
    TL bireysel emeklilik sistemi katkı payı ödemiştir (yıllık toplam 840.000 TL). Çalışanın ödemenin yapıldığı aylarda elde
    ettiği aylık ücret her ay 300.000 TL'dir. Yıllık asgari ücret tutarı 480.000 TL olarak alınacak, Cumhurbaşkanınca oran
    veya haddin değiştirilmediği varsayılacaktır. GVK md. 40/9'a göre bu ödemelerden gider olarak kabul edilmeyecek tutar
    kaç TL'dir?
  secenekler:
    A: 300.000 TL
    B: 360.000 TL
    C: 480.000 TL
    D: 540.000 TL
    E: 840.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'GVK md. 40/9''a göre ücretle ilişkilendirilmeksizin gider yazılacak katkı paylarının toplamı, ödemenin yapıldığı
      ayda elde edilen ücretin %15''ini ve yıllık olarak asgari ücretin yıllık tutarını aşamaz. Aylık sınır 300.000 × %15
      = 45.000 TL, yıllık 540.000 TL''dir; yıllık asgari ücret sınırı 480.000 TL olduğundan gider yazılabilecek tutar 480.000
      TL''dir. Kabul edilmeyecek tutar 840.000 − 480.000 = 360.000 TL.

      Püf noktaları: İki sınır birlikte uygulanır, en düşük olan geçerlidir. Soru gider yazılabilecek tutarı değil, kabul
      edilmeyecek tutarı sormaktadır.'
    celdiriciler:
      A: Yalnız aylık %15 sınırı uygulanmıştır (840.000 − 540.000); yıllık asgari ücret sınırı da vardır.
      C: Bu, gider yazılabilecek tutardır; soru kabul edilmeyecek tutarı sormaktadır.
      D: Bu, yalnız %15 sınırına göre gider yazılabilecek tutardır; yıllık asgari ücret sınırı aşıldığından geçerli değildir.
      E: Ödemenin tamamı alınmıştır; sınırlar aşıldığından yalnızca fazlası kabul edilmez.
    hesap_adimlari:
    - 'Aylık %15 sınırı: 300.000 × %15 = 45.000 TL; yıllık 540.000 TL'
    - 'Yıllık asgari ücret sınırı: 480.000 TL'
    - 'Gider yazılabilir: min(840.000; 540.000; 480.000) = 480.000 TL'
    - 'KKEG: 840.000 − 480.000 = 360.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: GVK md. 40/9
    alinti: İşverenler tarafından bireysel emeklilik sistemine ödenen ve ücretle ilişkilendirilmeksizin ticari kazancın tespitinde
      gider olarak indirim konusu yapılacak katkı paylarının toplamı, ödemenin yapıldığı ayda elde edilen ücretin %15’ini
      ve yıllık olarak asgari ücretin yıllık tutarını aşamaz.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: sonuc = 840000 - min(840000, 12 * 300000 * 0.15, 480000)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
