  cozum: 'Safî kurum kazancının tespitinde Gelir Vergisi Kanununun ticarî kazanç hükümleri uygulandığından (KVK md. 6/2) GVK
    md. 40''taki gider hükümleri geçerlidir.


    **(a) Sendika aidatı (GVK md. 40/8)**


    Ödenen aidatın bir aylık tutarı, işyerinde işçilere ödenen çıplak ücretin bir günlük toplamını aşamaz. Aylık sınır 200.000
    TL''dir.


    - Gider yazılabilecek: 12 × 200.000 = **2.400.000 TL**

    - Kabul edilmeyecek: 3.120.000 − 2.400.000 = **720.000 TL**


    **(b) Gıda bankacılığı bağışı (GVK md. 40/10)**


    Gıda bankacılığı faaliyetinde bulunan vakıflara belirlenen usul ve esaslar çerçevesinde bağışlanan gıda maddelerinin maliyet
    bedeli gider yazılabilir. Gider yazılabilecek tutar **400.000 TL**; kabul edilmeyecek 560.000 − 400.000 = **160.000 TL**.


    **(c) İşbaşı eğitim (GVK md. 40/11)**


    Katılımcı başına aylık indirim konusu yapılacak tutar asgari ücretin brüt tutarının yarısını aşamaz: 40.000 / 2 = 20.000
    TL. Aylık fazla ödeme = 30.000 − 20.000 = 10.000 TL. Kabul edilmeyecek tutar = 10.000 × 5 katılımcı × 6 ay = **300.000
    TL**.


    **(d) Seyahat (GVK md. 40/4)**


