  soru: '**Olay:** Doğu Elektrik Sanayi A.Ş.''nin (tam mükellef, hesap dönemi takvim yılı) 2026 gider hesaplarının revizyonunda
    YMM aşağıdaki tespitleri yapmıştır. Şirket tüm tutarları tam olarak gider yazmıştır. Kurumlar vergisi oranı %25''tir;
    KDV etkileri dikkate alınmayacaktır.


    1. **Sendika aidatı:** Şirket, işçilerin üyesi olduğu sendikalara Sendikalar Kanunu hükümlerine göre 2026''da her ay 260.000
    TL olmak üzere toplam 3.120.000 TL aidat ödemiştir. İşyerinde işçilere ödenen çıplak ücretin bir günlük toplamı her ay
    200.000 TL''dir.

    2. **Gıda bağışı:** Şirket (gıda ürünleri de imal etmektedir), fakirlere yardım amacıyla gıda bankacılığı faaliyetinde
    bulunan bir vakfa, Hazine ve Maliye Bakanlığınca belirlenen usul ve esaslar çerçevesinde gıda maddeleri bağışlamıştır.
    Bağışlanan maddelerin maliyet bedeli 400.000 TL, satış bedeli 560.000 TL''dir. Şirket bağış gideri olarak 560.000 TL yazmıştır.

    3. **İşbaşı eğitim:** Şirket, Türkiye İş Kurumu tarafından düzenlenen işbaşı eğitim programından 5 katılımcıyı 6 ay süreyle
    yararlandırmış ve her katılımcıya aylık 30.000 TL ödemiş; ödemenin tamamını gider yazmıştır. İşbaşı eğitim ödemeleri ücretle
    ilişkilendirilmemiştir. Hesap kolaylığı için 2026 yılında aylık asgari ücretin brüt tutarının 40.000 TL olduğu varsayılacaktır.

    4. **Seyahat:** İki yönetici yurt dışındaki bir fuar ve müşteri görüşmeleri için gitmiştir. Görevin gerektirdiği süre
    6 gündür; yöneticiler turistik amaçla 8 gün daha kalmıştır. Kişi başı günlük konaklama ve ikamet gideri 25.000 TL''dir
    ve 14 günün tamamı gider yazılmıştır.


    **İstenenler:**


    (a) 1 numaralı tespitte gider yazılabilecek ve kabul edilmeyecek aidat tutarlarını hesaplayınız. (5 puan)


    (b) 2 numaralı tespitte bağışın gider olarak indirilebilecek tutarını belirleyiniz. (4 puan)


    (c) 3 numaralı tespitte kabul edilmeyecek tutarı hesaplayınız. (5 puan)


    (d) 4 numaralı tespitte kabul edilmeyecek seyahat ve ikamet giderini bulunuz. (4 puan)


    (e) Kanunen kabul edilmeyen giderlerin toplamını ve hesaplanacak ek kurumlar vergisini bulunuz. (4 puan)

