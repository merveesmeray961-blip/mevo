      Suçlarla Mücadele Edilmesi Hakkında Kanunun ek 4 üncü maddesi kapsamında hakkında reklam yasağı uygulananlara verilen
      reklamların giderleri.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
