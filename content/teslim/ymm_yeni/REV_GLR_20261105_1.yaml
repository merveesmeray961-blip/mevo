    1. **Peşin tahsilat:** 1.9.2026–31.8.2027 dönemini kapsayan yıllık bakım ve lisans hizmeti için müşteriden 2.400.000 TL
    1.9.2026''da peşin tahsil edilmiş ve tamamı 2026 geliri yazılmıştır. Hizmet bedeli ay esasıyla eşit dağılmaktadır.

    2. **Tahakkuk etmeyen hasılat:** Aralık 2026''da tamamlanan danışmanlık hizmetinin 450.000 TL''lik bedeli 5.1.2027''de
    faturalanmış ve şirket bu tutarı 2027 geliri olarak kaydetmeyi planlamaktadır.

    3. **Mevduat:** Şirket 1.11.2026''da bir bankaya 3 ay vadeli, yıllık %36 faizli 3.000.000 TL vadeli mevduat yatırmıştır;
    anapara ve faiz 1.2.2027''de tahsil edilecektir. Şirket 2026''da faiz geliri kaydetmemiştir.

    4. **Kredi:** Şirket 1.10.2026''da bankadan 4.000.000 TL kredi kullanmıştır. Kredi yıllık %48 faizlidir; anapara ve faiz
    1.4.2027''de ödenecektir. Kredi yatırım amaçlı değildir; şirket 2026''da faiz gideri kaydetmemiştir.


    **İstenenler:**


    (a) 1 numaralı tespitte 2026 geliri olarak kalması gereken tutarı bulunuz, düzeltme kaydını yapınız. (6 puan)


