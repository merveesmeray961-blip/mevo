  soru: '**Olay:** Bilanço esasına göre defter tutan Güneş Turizm A.Ş.''nin (tam mükellef, hesap dönemi takvim yılı) 2026
    yılı gider hesaplarının revizyonunda YMM aşağıdaki tespitleri yapmıştır. Şirket aşağıda belirtilenler dışında kayıtlarını
    doğru tutmuştur. Kurumlar vergisi oranı %25''tir; KDV etkileri dikkate alınmayacaktır.


    1. **Kira:** Şirket, 1.4.2026–31.3.2027 dönemine ait ofis kirasının tamamını (1.200.000 TL) 1.4.2026''da peşin ödemiş
    ve tamamını 2026 gideri yazmıştır. Kira bedeli ay esasıyla eşit dağılmaktadır.

    2. **Sigorta:** 2027 yılı Ocak–Aralık dönemini kapsayan iş yeri sigorta primi 600.000 TL''dir; prim 20.12.2026''da ödenmiş
    ve 2026 gideri yazılmıştır.

    3. **Enerji ve iletişim:** Aralık 2026 tüketimine ilişkin elektrik, doğalgaz ve internet giderleri (toplam 120.000 TL)
    12.1.2027''de faturalanıp ödenmiş; şirket bunları 2027 gideri olarak kaydetmeyi planlamaktadır, 2026''da kayıt yoktur.

    4. **Yeni şube:** Şirket, yeni şubenin açılışı için açılış organizasyonu, personel eğitimi ve tanıtım adı altında maddi
    bir kıymet iktisap edilmeyen 1.000.000 TL harcama yapmış ve bunu 262 Kuruluş ve Örgütlenme Giderleri hesabında aktifleştirmiştir.
    Şirket aktifleştirmeyi tercih etmiştir; 2026 hesap döneminden başlayarak ilk yıl dâhil yıllık eşit itfa yapılacaktır.
    Şirket 2026''da yalnızca 100.000 TL itfa payı gider yazmıştır.


    **İstenenler:**


    (a) 1 ve 2 numaralı tespitlerde 2026 gideri olarak kalması gereken tutarları ve düzeltme kayıtlarını gösteriniz. (7 puan)


    (b) 3 numaralı tespitte yapılması gereken işlemi ve kaydı açıklayınız. (4 puan)


    (c) 4 numaralı tespitte yıllık itfa payını bulunuz, düzeltme kaydını yapınız; kuruluş ve örgütlenme giderlerinin vergisel
    durumunu (aktifleştirme veya doğrudan gider yazma) açıklayınız. (6 puan)


    (d) Düzeltmelerin 2026 matrahına toplam etkisini ve ek kurumlar vergisini hesaplayınız. (5 puan)

    '
  cozum: '**(a) Peşin ödenen giderler (VUK md. 283)**


    Gelecek bir hesap dönemine ait olarak peşin ödenen giderler mukayyet değerleri üzerinden aktifleştirilir.


    - Kira: Nisan–Aralık 2026 = 9 ay; 2026 gideri = 1.200.000 × 9/12 = **900.000 TL**; 2027''ye ait 300.000 TL aktifleştirilir.

    - Sigorta primi: tamamı 2027 dönemine ait olduğundan 2026 gideri **0 TL**; 600.000 TL aktifleştirilir.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 180 Gelecek Aylara Ait Giderler | 900.000 | |

    | 770 Genel Yönetim Giderleri | | 900.000 |


    (300.000 kira + 600.000 sigorta = 900.000 TL.) Matrah etkisi **+900.000 TL**.


    **(b) Gider tahakkuku (VUK md. 287)**


    Cari hesap dönemine ait olup henüz ödenmemiş giderler mukayyet değerleri üzerinden pasifleştirilir. Aralık tüketimi 2026''ya
    aittir:


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 120.000 | |

    | 381 Gider Tahakkukları | | 120.000 |


    Matrah etkisi **−120.000 TL**. 2027''de fatura ödemesi 381 hesabı kapatılarak yapılır.


    **(c) İlk tesis ve taazzuv giderleri (VUK md. 282, 326)**


    Yeni bir şubenin açılması için yapılan ve karşılığında maddi kıymet iktisap edilmeyen giderler ilk tesis ve taazzuv giderlerindendir;
    aktifleştirilmesi ihtiyaridir. Aktifleştirilenler mukayyet değerleri üzerinden eşit miktarlarda ve beş yıl içinde itfa
    olunur.


    Yıllık itfa = 1.000.000 / 5 = **200.000 TL**; eksik itfa = 200.000 − 100.000 = 100.000 TL.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 770 Genel Yönetim Giderleri | 100.000 | |

    | 268 Birikmiş Amortismanlar | | 100.000 |


    Matrah etkisi **−100.000 TL**. KVK md. 8/b''ye göre kuruluş ve örgütlenme giderleri ayrıca hasılattan indirilebileceğinden
    şirket bunları doğrudan gider yazma yolunu da seçebilirdi; aktifleştirmeyi tercih ettiği için itfa kuralına uyması gerekir.


    **(d) Toplam etki**


    | Kalem | Matrah etkisi (TL) |

    |---|---|

    | Kira ve sigorta | +900.000 |

    | Gider tahakkuku | −120.000 |

    | İlk tesis giderlerinin itfası | −100.000 |

    | **Toplam** | **+680.000** |


    Ek kurumlar vergisi = 680.000 × %25 = **170.000 TL**.

    '
