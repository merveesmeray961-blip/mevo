  kok: YMM (Z), (P) A.Ş.'nin 2026 hesap dönemi tasdik çalışmasına ilişkin bir çalışma kâğıdını 15 Haziran 2026'da düzenlemiştir.
    Dosya, 2035 yılında başlayan hukuki bir ihtilafa konu olmuş ve ihtilaf 14 Mart 2038'de kesin olarak sonuçlanmıştır. Yönetmelik
    md. 17'ye göre bu çalışma kâğıdının saklanması zorunlu olan son tarih aşağıdakilerden hangisidir?
  secenekler:
    A: 31 Aralık 2035 (düzenlemeden 9 yıl sonra)
    B: 31 Aralık 2036 (süre sonu)
    C: 14 Mart 2038 (ihtilafın bittiği gün)
    D: 15 Haziran 2036 (düzenlemeden 10 yıl sonra)
    E: 31 Aralık 2037 (süre sonu + 1 yıl)
  dogru: C
  aciklama:
    dogru_neden: 'Md. 17''ye göre çalışma kâğıtları, düzenlenmelerini izleyen yıldan (2027) itibaren 10 yıl süreyle, yani
      2036 yılı sonuna kadar saklanır; bu süre içinde hukuki ihtilafa konu olan dosyalar ihtilafın sonuçlanmasına kadar saklanır.
      İhtilaf 2035''te başladığından saklama süresi içindedir ve dosya 14 Mart 2038''e kadar saklanmalıdır. Püf noktaları:
      Süre düzenleme tarihinden değil, izleyen yıldan başlar; ihtilaf süre içinde başlamışsa saklama sonuçlanmaya kadar uzar.'
    celdiriciler:
      A: Süre 10 yıldır; 2035 sonu 9. yılın sonudur ve ihtilaf da dikkate alınmamıştır.
      B: 2036 sonu normal 10 yıllık süredir; ancak süre içinde başlayan ihtilaf nedeniyle ihtilafın sonuçlanmasına kadar saklama
        gerekir.
      D: Süre düzenleme tarihinden (15.6.2026) değil, düzenlemeyi izleyen yıldan itibaren başlar.
      E: İhtilaf sona erdiği tarihten sonra saklama yükümlülüğü kalkar; 2037 sonu hiçbir hesaba uymaz.
    hesap_adimlari:
    - Düzenleme yılı 2026; saklama süresi izleyen yıldan (2027) itibaren 10 yıl → 31.12.2036.
    - İhtilaf 2035'te başladığından süre içindedir; saklama ihtilafın sonuçlandığı tarihe kadar uzar → 14.3.2038.
