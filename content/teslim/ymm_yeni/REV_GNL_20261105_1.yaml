  kok: Yeminli mali müşavir (Y), bir anonim şirketin tam tasdik teklifini değerlendirmektedir. Şirket daha önce başka bir
    YMM ile çalışmıştır. Yönetmelik md. 6'ya göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Y'nin, daha önce tasdik talebini karşılayan meslek mensubuyla görüşerek bilgi toplaması zorunludur ve bu görüşme yapılmadan
      teklif verilemez
    B: Şirket, YMM'yi seçerken uzmanlık ve deneyimden çok ücret faktörünü esas alır; Yönetmelik bunu öngörmektedir
    C: Y, daha önce tasdik talebini karşılayan meslek mensubundan bilgi toplayamaz
    D: Risk tespitine yönelik araştırma yükümlülüğü yalnızca sürekli denetimi kapsayan sözleşmelerde bulunmaktadır
    E: Y, işi üstlenmeden önce işin getireceği riski tespit etmek ve tasdik kapsam ve programını belirlemek için araştırma
      yapmak zorundadır
  dogru: E
  aciklama:
    dogru_neden: Md. 6/2'ye göre YMM'ler üstlenecekleri tasdik işleminin kendilerine getirebileceği riski tespit etmek, tasdik
      kapsam ve programını belirlemek amacıyla gerekli araştırmaları yapmak zorundadır. Önceki meslek mensubundan görüşme
      yoluyla bilgi toplama ise bir zorunluluk değil, yetkidir.
    celdiriciler:
      A: Md. 6'da önceki meslek mensubuyla görüşme "yapabilir" şeklinde bir imkândır; zorunluluk değildir.
      B: Md. 6/1'e göre seçim, ücret faktöründen ziyade tasdik amacını gerçekleştirecek uzmanlık ve deneyim esas alınarak
        yapılır.
      C: Md. 6/2 bu bilgi toplamaya izin verir ("bilgi toplayabilir"); yasak yoktur.
      D: Md. 6/2 risk araştırmasını tasdik türüne göre ayırmamıştır; her tasdik işi için geçerlidir.
  kaynaklar:
