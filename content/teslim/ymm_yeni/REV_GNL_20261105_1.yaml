  kok: Bir şirketle 5 Şubat 2026'da sürekli denetimi kapsayan tam tasdik sözleşmesi imzalayan YMM (K), tasdik raporunu 20
    Nisan 2027'de düzenleyecektir. Şirketin 2026 hesap dönemi mali tabloları denetlenecek olup şirketin yıllık ciro tutarı
    ve çalışan sayısı çalışma planında yer almaktadır. YMM Tasdik Yönetmeliği md. 15'in son fıkrası dikkate alındığında denetim
    tekniklerinin uygulanmasına ilişkin aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Teknikler, yalnızca hesap dönemi sonunda yapılan envanter çalışmasıyla birlikte, YMM'nin seçeceği tek bir tarihte ve
      tek seferde uygulanır
    B: Teknikler, K'nın hesapların niteliğine göre belirleyeceği aralıklarla, sözleşme tarihinden rapor tarihine kadar uygulanır
    C: Uygulama aralıkları, Bakanlıkça her tasdik sözleşmesi için ayrıca belirlenir ve YMM'ye bildirilir
    D: Teknikler, 1 Ocak 2026'dan başlayarak mali tabloların kapsadığı dönem boyunca uygulanır; sözleşme tarihi başlangıç
      için önem taşımaz
    E: Aralıklar, hesapların niteliğinden ve hacminden bağımsız olarak, her ay en az bir kez olacak biçimde sabittir
  dogru: B
  aciklama:
    dogru_neden: 'Md. 15 son fıkra: sürekli denetimlerde teknikler, hesapların niteliği, hacmi ve tekniklerin özellikleri
      gözönünde bulundurularak YMM''nin belirleyeceği aralıklarla, tasdik sözleşmesi tarihinden tasdik raporu tarihine kadar
      uygulanır. Diğer denetimlerde ise denetimin her safhasında uygulanabilir. Püf noktaları: Aralığı belirleyen merci Bakanlık
      değil YMM''dir; başlangıç dönem başı değil sözleşme tarihidir; ciro ve çalışan sayısı gibi veriler aralığı sabitlemez.'
    celdiriciler:
      A: Teknikler sürekli denetimde tek seferlik değil, aralıklarla uygulanır; "her safhada" uygulama ise diğer denetimler
        için öngörülmüştür.
      C: Aralığı Bakanlık değil YMM belirler.
      D: Başlangıç noktası sözleşme tarihidir (5 Şubat 2026); bitiş noktası rapor tarihidir.
      E: Yönetmelik sabit bir aylık aralık öngörmez; aralık hesapların niteliği ve hacmine göre YMM'ce belirlenir.
  kaynaklar:
