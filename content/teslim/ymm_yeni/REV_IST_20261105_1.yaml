    B: 3.000.000
    C: 4.000.000
    D: 4.500.000
    E: 8.000.000
  dogru: C
  aciklama:
    dogru_neden: İstisna için ortaklığın sahip olduğu taşınmazlardan elde ettiği kazançların en az %50'sinin kâr payı olarak
      dağıtılması şarttır. Taşınmazlardan elde edilen kazanç = 6.000.000 (kira) + 2.000.000 (satış) = 8.000.000 TL; mevduat
      faizi taşınmaz kazancı değildir. Dağıtılması gereken asgari tutar = 8.000.000 × %50 = 4.000.000 TL.
    celdiriciler:
      A: 1.000.000 TL, yalnızca satış kazancının %50'sidir; kira kazancı da taşınmazdan elde edilen kazançtır ve hesaba dahil
        edilmelidir.
      B: 3.000.000 TL, yalnızca kira kazancının %50'sidir; taşınmaz satış kazancı da taşınmazlardan elde edilen kazanç kapsamındadır.
      D: 4.500.000 TL, taşınmaz kazancına mevduat faizini de ekleyerek (9.000.000 × %50) bulunmuştur; faiz geliri taşınmazdan
        elde edilmediğinden hesaba girmez.
      E: 8.000.000 TL, kazancın tamamıdır; hüküm tamamının değil en az %50'sinin dağıtılmasını arar.
