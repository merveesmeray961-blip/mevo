  soru: '**Olay:** Tam mükellef ve hesap dönemi takvim yılı olan **Doğa Enerji A.Ş.** (finans sektöründe değildir) 2026 yılı
    ticari bilanço kârını **9.000.000 TL** bulmuştur; kanunen kabul edilmeyen gideri ve başka istisna ya da indirimi yoktur.
    Asgari kurumlar vergisi dikkate alınmayacak, istisnaya ilişkin usul şartlarının yerine getirildiği varsayılacaktır.


    Şirket, aktifinde maliyet bedeli 6.000.000 TL, birikmiş amortismanı 1.500.000 TL olan bir taşınmazı 2.3.2026''da, kira
    sertifikası ihracı amacıyla ve sözleşme sonunda geri alınması şartıyla **Güneş Varlık Kiralama A.Ş.**''ye (VKŞ) **7.500.000
