    madde: Geçici md. 3/2-a
    alinti: Serbest bölgelerde üretim faaliyetinde bulunan mükelleflerin bu bölgelerde imal ettikleri ürünlerin yurt dışına,
      serbest bölge içine veya diğer serbest bölgelere satışından elde ettikleri kazançları
  - mevzuat: 3218 sayılı Serbest Bölgeler Kanunu
    madde: Geçici md. 3/2
    alinti: Avrupa Birliğine tam üyeliğin gerçekleştiği tarihi içeren yılın vergilendirme döneminin sonuna kadar;
