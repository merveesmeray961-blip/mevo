  cozum: '**(a) KVK md. 5/3 değerlendirmesi**


    KVK md. 5/3 uyarınca istisna edilen kazançlara ilişkin giderler ve istisna kapsamındaki faaliyetlerden doğan zararlar
    istisna dışı kurum kazancından indirilemez; ancak iştirak hisseleri alımıyla ilgili finansman giderleri indirilebilir.


    | Kalem | Değerlendirme | Matraha etkisi |

    |---|---|---|

    | 1. Kâr payı (md. 5/1-a-1) | Tam mükellef kurumun sermayesine katılımdan elde edilen kazanç istisnadır | −3.000.000 |

    | 2. Hisse alımı faiz gideri | İştirak hisseleri alımıyla ilgili finansman gideri olduğundan indirilebilir | 0 |

    | 3. İştirakle ilgili yönetim gideri | İstisna kazançla ilgili gider; indirilemez | +200.000 |

    | 4. Ürdün inşaat zararı | İstisna kapsamındaki faaliyetten doğan zarar; indirilemez | +700.000 |


    **(b) Sat-kirala-geri al (md. 5/1-j)**


    - İstisna kazanç = satış bedeli − net bilanço aktif değeri = 12.000.000 − (12.000.000 − 4.000.000) = **4.000.000 TL**;
    istisna satış kazancının %100''üne uygulanır, tamamı özel fon hesabına alınır.

    - Kullanım hakkı 12.000.000 TL üzerinden amortismana tabidir. Amortismanın fon hesabından karşılanacak oranı = 4.000.000
    / 12.000.000 = %33,33; kurum kazancında dikkate alınacak oran %66,67.


    | 2026 amortismanı | Tutar (TL) |

    |---|---|

    | Toplam | 1.200.000 |

    | Özel fon hesabından karşılanacak kısım (kurum kazancında dikkate alınmaz) | **400.000** |

    | Kurum kazancının tespitinde dikkate alınacak kısım | **800.000** |


    Gider yazılan 1.200.000 TL''nin 400.000 TL''lik kısmı beyannamede kanunen kabul edilmeyen gider olarak eklenir.


    **(c) Matrah ve kurumlar vergisi**


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | (+) Diğer kanunen kabul edilmeyen giderler | 300.000 |

    | (+) İştirakle ilgili yönetim gideri | 200.000 |

    | (+) Ürdün inşaat zararı | 700.000 |

    | (+) Amortismanın fondan karşılanan kısmı | 400.000 |

    | (−) İştirak kazancı istisnası | (3.000.000) |

    | (−) Sat-kirala-geri al kazancı istisnası | (4.000.000) |

    | **Kurumlar vergisi matrahı** | **6.600.000** |

    | Kurumlar vergisi (%25) | **1.650.000** |


    **(d) 2027 işlemleri**


    KVK md. 5/1-j''de, md. 5/1-e''den farklı olarak "sermayeye ilave" istisnası yoktur; istisna edilen kazançtan herhangi
    bir şekilde başka bir hesaba nakledilen kısım için zamanında tahakkuk ettirilmeyen vergiler ziyaa uğramış sayılır (fon
    yalnızca amortismanların itfasında kullanılabilir). Sermayeye eklenen 1.000.000 TL ile 570 hesabına nakledilen 500.000
    TL birlikte 1.500.000 TL''dir.


    Zamanında tahakkuk ettirilmeyen vergi = 1.500.000 × %25 = **375.000 TL**; bu vergi vergi ziyaı cezası ve gecikme faiziyle
    birlikte tahsil edilir.

    '
