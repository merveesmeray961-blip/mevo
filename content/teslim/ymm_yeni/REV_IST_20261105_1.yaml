  soru: '**Olay:** Tam mükellef ve hesap dönemi takvim yılı olan **Çınar Makine A.Ş.** (finans sektöründe değildir; menkul
    kıymet ticaretiyle uğraşmamaktadır) 2026 yılı ticari bilanço kârını **12.000.000 TL** bulmuştur. Tam tasdik çalışmasında
    YMM, kurum kazancını etkileyen aşağıdaki işlemleri tespit etmiştir. Asgari kurumlar vergisi ile başka indirim ve istisnalar
    dikkate alınmayacak, istisna uygulamasına ilişkin usul şartlarının yerine getirildiği varsayılacaktır.


    | No | İşlem | Tutar (TL) | Ticari kârdaki yeri |

    |---|---|---|---|

    | 1 | Tam mükellef Orman Ambalaj A.Ş.''nin sermayesine katılımdan elde edilen kâr payı | 3.000.000 | Gelir olarak yazılmış
    |

    | 2 | Orman Ambalaj A.Ş. paylarının satın alınması için kullanılan banka kredisinin 2026 faiz gideri | 500.000 | Gider
    olarak yazılmış |

    | 3 | Yalnızca Orman Ambalaj A.Ş. iştirakine ilişkin yönetim ve danışmanlık gideri | 200.000 | Gider olarak yazılmış |

    | 4 | Ürdün''de üstlenilen inşaat işinden doğan 2026 zararı (kazancı KVK md. 5/1-h kapsamında istisna olacak bir iştir)
    | 700.000 | Zarar olarak yansıtılmış |

    | 5 | Diğer kanunen kabul edilmeyen giderler | 300.000 | Gider olarak yazılmış |


    **Sat-kirala-geri al işlemi:** Şirket, aktifinde maliyet bedeli 12.000.000 TL, birikmiş amortismanı 4.000.000 TL olan
    bir üretim hattını (taşınır) 30.6.2026''da **12.000.000 TL** bedelle Barış Katılım Bankası A.Ş.''ye, 6361 sayılı Kanun
    kapsamında geri kiralama amacıyla ve sözleşme sonunda geri alınması şartıyla satmıştır; sözleşme hükümlerine fiilen uyulmaktadır.
