  aciklama:
    dogru_neden: 'Kâr payı istisna olduğundan ticari kârdan düşülür (−1.500.000). KVK md. 5/3 uyarınca istisna kazançlara
      ilişkin giderler (100.000 TL yönetim gideri) ve istisna kapsamındaki faaliyetlerden doğan zararlar (400.000 TL) istisna
      dışı kazançtan indirilemez; kârın hesabında düşülmüş olduklarından matraha geri eklenir. İştirak hisseleri alımıyla
      ilgili finansman giderleri ise indirilebilir; 250.000 TL faiz eklenmez. Matrah = 6.000.000 − 1.500.000 + 100.000 + 400.000
      = 5.000.000 TL. Püf noktaları: (1) İştirak hissesi alımına ilişkin finansman gideri 5/3''ün istisnasıdır. (2) İstisna
      faaliyetin zararı da geri eklenir. (3) Gereksiz görünen faiz verisi çözümü değiştirmez.'
    celdiriciler:
      A: 4.500.000 TL, yönetim gideri, zarar ve faiz giderinin hiçbirinin eklenmemesiyle bulunur; kâr payı çıkarılıp başka
        düzeltme yapılmamıştır. Yönetim gideri ve zarar eklenmelidir.
      B: 4.600.000 TL, zarar eklenmeden yalnızca yönetim gideri eklenerek bulunmuştur (6.000.000 − 1.500.000 + 100.000); istisna
        kapsamındaki faaliyetin zararı da indirilemez.
      C: 4.900.000 TL, yönetim gideri eklenmeden yalnızca zarar eklenerek bulunmuştur (6.000.000 − 1.500.000 + 400.000); istisna
        kazanca ilişkin gider de indirilemez.
      E: 5.250.000 TL, iştirak hissesi alımına ilişkin faiz giderinin de eklenmesiyle bulunmuştur; bu finansman gideri md.
        5/3 uyarınca indirilebilir olduğundan eklenmez.
    hesap_adimlari:
    - 6.000.000 − 1.500.000 (kâr payı istisnası) = 4.500.000
    - + 100.000 (istisna kazançla ilgili yönetim gideri)
    - + 400.000 (istisna kapsamındaki faaliyet zararı)
    - Faiz gideri indirilebilir, eklenmez → 5.000.000 TL
