  dogrulama:
    python: 'kar=12000000

      kp=3000000

      yon=200000

      zarar=700000

      diger=300000

      satis=12000000

      net_deger=12000000-4000000

      istisna=satis-net_deger

      amort=1200000

      fon_amort=amort*istisna/satis

      kurum_amort=amort-fon_amort

      matrah=kar+diger+yon+zarar+fon_amort-kp-istisna

      kv=matrah*0.25

      ziya=(1000000+500000)*0.25

      sonuc={''istisna'':istisna,''fon_amort'':fon_amort,''kurum_amort'':kurum_amort,''matrah'':matrah,''kv'':kv,''ziya'':ziya}

      '
