    nakledilmiştir (istisnadan yararlanılan 2026 dönemindeki kurumlar vergisi oranı esas alınacaktır).


    **İstenenler:**


    (a) 1 ila 4 numaralı kalemlerin kurum kazancının tespitinde nasıl dikkate alınacağını KVK md. 5/3''e göre açıklayınız.
    (6 puan)


    (b) Sat-kirala-geri al işleminden doğan istisna kazancı ve 2026 amortismanının kurum kazancında dikkate alınacak ve özel
    fon hesabından karşılanacak kısımlarını hesaplayınız. (7 puan)


    (c) 2026 yılı kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (6 puan)


    (d) 2027''deki işlemlerin vergisel sonucunu açıklayarak zamanında tahakkuk ettirilmeyen vergiyi hesaplayınız. (5 puan)

