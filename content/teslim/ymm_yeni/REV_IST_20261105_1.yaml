    Enerji A.Ş.''ye kullanım hakkı verilmemiştir. Satış kazancı 2026 ticari kârında yer almaktadır ve tamamı süresinde özel
    fon hesabına alınmıştır. VKŞ, sözleşme süresince taşınmaz için toplam **750.000 TL** amortisman ayırmış ve bunu kazancının
    tespitinde dikkate almıştır. Sözleşme sonunda taşınmaz 7.500.000 TL bedelle Doğa Enerji A.Ş.''ye geri satılmıştır. Doğa
    Enerji A.Ş. geri aldığı taşınmaz için 7.500.000 TL üzerinden yıllık **%2** normal amortisman ayıracaktır.


    **İstenenler:**


    (a) Doğa Enerji A.Ş.''nin satıştan doğan istisna kazancını ve özel fon hesabına ilişkin esasları açıklayarak 2026 kurumlar
    vergisi matrahını ve vergisini (oran %25) hesaplayınız. (6 puan)


    (b) Kira süresince Doğa Enerji A.Ş.''nin amortisman ayırıp ayıramayacağını belirtiniz; VKŞ''nin geri satıştan doğan kazancını
    hesaplayıp vergisel durumunu ve VKŞ''nin kira gelirlerinin durumunu açıklayınız. (6 puan)


    (c) Taşınmazın geri alınmasından sonraki ilk yıl için hesaplanacak yıllık amortismanın kurum kazancında dikkate alınacak
    ve özel fon hesabından karşılanacak kısımlarını bulunuz. (5 puan)


    (d) Doğa Enerji A.Ş.''nin yükümlülüklerini yerine getirememesi nedeniyle VKŞ''nin taşınmazı (o güne kadar amortisman ayrılmamıştır)
    sözleşme süresi dolmadan 9.000.000 TL''ye üçüncü bir kişiye sattığını varsayarak VKŞ''nin kazancını ve Doğa Enerji A.Ş.
    bakımından doğacak sonucu hesaplayınız. (6 puan)

    '
  cozum: '**(a) İstisna kazanç, fon ve matrah**


    - Net bilanço aktif değeri = 6.000.000 − 1.500.000 = 4.500.000 TL; istisna kazanç = 7.500.000 − 4.500.000 = **3.000.000
    TL**.

    - KVK md. 5/1-k: kaynak kuruluşların varlıkları kira sertifikası ihracı amacıyla ve sözleşme sonunda geri alınması şartıyla
    VKŞ''ye satışından doğan kazanç istisnadır; kazanç pasifte özel fon hesabında tutulur ve yalnızca bu varlıklar için ayrılacak
    amortismanların (devir öncesindeki net bilanço aktif değerine isabet eden kısım hariç) itfasında kullanılır. Fondan başka
    hesaba nakil veya işletmeden çekilme hâlinde vergiler ziyaa uğramış sayılır.


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 9.000.000 |

    | (−) Kira sertifikası satış kazancı istisnası | (3.000.000) |

    | **Kurumlar vergisi matrahı** | **6.000.000** |

    | Kurumlar vergisi (%25) | **1.500.000** |


    **(b) Kira süresi ve VKŞ**


    - VKŞ, taşınmazı üçüncü bir kişiye kiraladığından kullanım hakkı kaynak kuruluşa geçmez; kira süresi boyunca Doğa Enerji
    A.Ş. **amortisman hesaplamaz**.

    - VKŞ taşınmazı 7.500.000 TL ile aktifine almış, 750.000 TL amortisman ayırmıştır; net değeri 6.750.000 TL''dir. Geri
    satış kazancı = 7.500.000 − 6.750.000 = **750.000 TL**; varlıkların devralındığı kuruma satışından doğan bu kazanç kurumlar
    vergisinden istisnadır.

    - VKŞ''nin kira sertifikası ihracı dolayısıyla elde ettiği kira gelirleri istisna kapsamında değildir; genel hükümlere
    göre vergilendirilir.


    **(c) Geri alma sonrası amortisman**


    Fon payı = 3.000.000 / 7.500.000 = %40; kurum kazancında dikkate alınacak pay %60.


    | 2030 amortismanı (7.500.000 × %2) | Tutar (TL) |

    |---|---|

    | Toplam | 150.000 |

    | Özel fon hesabından mahsup edilecek (%40) | **60.000** |

    | Kurum kazancında dikkate alınacak (%60) | **90.000** |


    **(d) VKŞ''nin süre dolmadan üçüncü kişiye satışı**


    - VKŞ''nin kazancı = 9.000.000 − 7.500.000 = **1.500.000 TL**; bu kazanç istisnadan yararlanamaz, VKŞ nezdinde kurumlar
    vergisine tabi tutulur.

    - Doğa Enerji A.Ş. için istisna uygulaması dolayısıyla zamanında tahakkuk ettirilmeyen vergi = 3.000.000 × %25 = **750.000
    TL**; bu vergi vergi ziyaı cezası uygulanmaksızın gecikme faiziyle birlikte kaynak kuruluştan tahsil edilir.

    '
