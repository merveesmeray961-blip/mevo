    şöyledir: bölgede imal ettiği ürünlerin yurt dışına satışından 3.000.000 TL, başka bir serbest bölgedeki kullanıcıya satışından
    1.000.000 TL, aynı serbest bölgedeki başka bir kullanıcıya satışından 500.000 TL, Türkiye gümrük bölgesindeki bir müşteriye
    satışından 2.000.000 TL; ayrıca bölgeye dışarıdan satın alıp yurt dışına sattığı ticari mallardan 800.000 TL kazanç. Mevzuattaki
    diğer şartların sağlandığı ve Avrupa Birliğine tam üyeliğin gerçekleşmediği varsayımıyla, 3218 sayılı Kanunun geçici 3.
    maddesinin ikinci fıkrası kapsamında gelir veya kurumlar vergisinden müstesna kazanç kaç TL''dir?'
  secenekler:
    A: 3.000.000
    B: 4.000.000
    C: 4.500.000
    D: 5.300.000
    E: 7.300.000
  dogru: C
  aciklama:
    dogru_neden: 'Geçici 3. maddenin ikinci fıkrasının (a) bendi, serbest bölgelerde üretim faaliyetinde bulunan mükelleflerin
      bu bölgelerde imal ettikleri ürünlerin yurt dışına, serbest bölge içine veya diğer serbest bölgelere satışından elde
      ettikleri kazançları, Avrupa Birliğine tam üyeliğin gerçekleştiği tarihi içeren yılın vergilendirme döneminin sonuna
      kadar istisna eder. İstisna tutarı = 3.000.000 + 1.000.000 + 500.000 = 4.500.000 TL. Türkiye''deki müşteriye yapılan
      satış ve imal edilmeyen ticari malın satışı kapsam dışındadır. Püf noktaları: (1) Ürünün bölgede imal edilmiş olması
      aranır. (2) Satışın yapıldığı yer önemlidir: yurt dışı, aynı bölge ve diğer serbest bölgeler istisnadır, Türkiye gümrük
      bölgesi değildir. (3) 2010 ruhsatı nedeniyle birinci fıkra değil, ikinci fıkra uygulanır.'
    celdiriciler:
      A: 3.000.000 TL yalnızca yurt dışı satışlardır; bölge içine ve diğer serbest bölgelere yapılan satışlar da hükümde sayılmıştır.
      B: 4.000.000 TL, aynı serbest bölgedeki kullanıcıya yapılan satışın (500.000 TL) dışarıda bırakılmasıyla bulunur; hüküm
        "serbest bölge içine" satışı da kapsar.
      D: 5.300.000 TL, imal edilmemiş ticari malların satışından doğan 800.000 TL'nin de istisnaya eklenmesiyle bulunur; istisna
        imal edilen ürünler içindir.
      E: 7.300.000 TL, tüm kazançların toplamıdır; Türkiye gümrük bölgesine yapılan satış ve ticari mal satışı istisna dışındadır.
    hesap_adimlari:
    - 'İstisnaya konu satışlar: yurt dışı 3.000.000 + diğer serbest bölge 1.000.000 + bölge içi 500.000'
    - Türkiye'ye satış (2.000.000) ve ticari mal (800.000) kapsam dışı
    - Toplam istisna = 4.500.000 TL
  kaynaklar:
