- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Kurumlar vergisi istisnaları
  konu: IST
  kazanim: yeni serbest bölge işleticilerinin kazançlarında istisna (3218 sayılı Kanun ek md. 4)
  tip: hesaplama
  zorluk: 1
  kok: '3218 sayılı Kanunun ek 4. maddesi kapsamında, geçici 2. madde uyarınca ilk kez faaliyete geçen bir serbest bölgenin
    işleticisi (T) A.Ş.''nin 2026 yılında serbest bölgenin işletilmesiyle ilgili faaliyetlerden elde ettiği kazançlar şöyledir:
    üretim faaliyet ruhsatlı kullanıcılardan 2.000.000 TL, münhasıran depo işletmeciliği faaliyet ruhsatlı kullanıcılardan
    600.000 TL, münhasıran alım satım faaliyet ruhsatlı kullanıcılardan 400.000 TL. İstisna süresinin devam ettiği varsayımıyla
    bu kazançlardan kurumlar vergisinden müstesna olan tutar kaç TL''dir?'
  secenekler:
    A: '400.000'
    B: '600.000'
    C: 1.000.000
    D: 2.000.000
    E: 3.000.000
  dogru: D
  aciklama:
    dogru_neden: Ek madde 4 uyarınca işleticilerin serbest bölgenin işletilmesiyle ilgili faaliyetlerden elde ettikleri kazançlar,
      ilk faaliyet ruhsatında belirtilen süreyle ve 30 yılı geçmemek üzere istisnadır. Ancak istisna, münhasıran alım satım
      veya depo işletmeciliği faaliyet ruhsatı sahibi kullanıcılardan elde edilen kazançları kapsamaz. Bu nedenle 600.000
      TL ve 400.000 TL istisna dışındadır; müstesna tutar 2.000.000 TL'dir.
    celdiriciler:
      A: 400.000 TL yalnızca alım satım ruhsatlı kullanıcılardan elde edilen kazançtır ve tam tersine istisna kapsamında değildir.
      B: 600.000 TL yalnızca depo işletmeciliği ruhsatlı kullanıcılardan elde edilen kazançtır ve istisna kapsamı dışındadır.
      C: 1.000.000 TL, istisna dışı bırakılan iki kalemin toplamıdır; istisna kapsamına giren kalem bu değildir.
      E: 3.000.000 TL, tüm kazançların toplamıdır; alım satım ve depo işletmeciliği ruhsatlı kullanıcılardan elde edilen kazançlar
        istisna dışındadır.
    hesap_adimlari:
    - Toplam kazanç = 2.000.000 + 600.000 + 400.000 = 3.000.000 TL
    - 'Depo ve alım satım ruhsatlı kullanıcılardan kazançlar istisna dışı: 1.000.000 TL'
    - İstisna = 2.000.000 TL
  kaynaklar:
  - mevzuat: 3218 sayılı Serbest Bölgeler Kanunu
    madde: Ek md. 4
    alinti: Bu maddenin yürürlüğe girdiği tarihten sonra geçici 2 nci madde uyarınca ilk kez faaliyete geçecek serbest bölgelerde,
      işleticilerin serbest bölgelerin işletilmesi ile ilgili faaliyetlerden elde ettikleri kazançları, 30 yılı geçmemek ve
      Ticaret Bakanlığınca kendilerine verilecek ilk faaliyet ruhsatında belirtilen süre ile sınırlı olmak üzere gelir veya
      kurumlar vergisinden müstesnadır.
  - mevzuat: 3218 sayılı Serbest Bölgeler Kanunu
