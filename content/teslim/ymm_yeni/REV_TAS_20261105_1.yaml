    alinti: Kamu idare ve müesseseleri, yeminli mali müşavirlerin tasdik konusu ile sınırlı olmak üzere isteyeceği bilgileri
      vermekle yükümlüdürler. Bilgiler yazı ile istenir; yazıda tasdik konusu ile ilgili husus ve sözleşme içeriği belirtilir.
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 12
    alinti: Yeminli mali müşavirler, vergi incelemelerinde tarhiyat öncesi ve sonrası uzlaşmalarda vergi yargısında;
