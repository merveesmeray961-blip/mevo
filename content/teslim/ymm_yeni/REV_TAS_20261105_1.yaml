- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: YMM'nin yetkileri ve kamu idarelerinden bilgi isteme
  tip: kavrama
  zorluk: 3
  kok: 'Tasdik sözleşmesi bulunan bir YMM''nin bilgi isteme ve vergi incelemelerinde bulunma yetkileriyle ilgili olarak aşağıdaki
    ifadeler verilmiştir:


    I. Kamu idare ve müesseseleri, YMM''nin tasdik konusu ile sınırlı olmak üzere isteyeceği bilgileri vermekle yükümlüdür.

    II. Bilgiler yazı ile istenir; yazıda tasdik konusu ile ilgili husus ve sözleşme içeriği belirtilir.

    III. YMM, vergi incelemelerinde tarhiyat öncesi ve sonrası uzlaşmalarda ve vergi yargısında mükellefle birlikte hazır
    bulunabilir ve açıklamalar yapabilir.

    IV. Kamu idarelerinden bilgi sözle de istenebilir; sözleşme içeriğinin belirtilmesi gerekmez.


    Bu ifadelerden hangileri Yönetmelik md. 12''ye göre doğrudur?'
  secenekler:
    A: I, II ve III
    B: I, II ve IV
    C: II, III ve IV
    D: Yalnız III
    E: I ve IV
  dogru: A
  aciklama:
    dogru_neden: 'Md. 12''ye göre kamu idare ve müesseseleri, YMM''lerin tasdik konusu ile sınırlı olmak üzere isteyeceği
      bilgileri vermekle yükümlüdür (I doğru); bilgiler yazı ile istenir ve yazıda tasdik konusu ile ilgili husus ve sözleşme
      içeriği belirtilir (II doğru, IV yanlış). YMM''ler vergi incelemelerinde tarhiyat öncesi ve sonrası uzlaşmalarda ve
      vergi yargısında mükellefle veya vergi sorumlusu ile beraber hazır bulunabilir ve açıklamalar yapabilir (III doğru).
      Püf noktaları: Bilgi istemi yazılıdır ve sözleşme içeriği yazıda belirtilir; YMM mükellefin yerine değil, mükellefle
      birlikte hazır bulunur.'
    celdiriciler:
      B: IV yanlıştır; III de doğrudur.
      C: IV yanlıştır; I de doğrudur.
      D: I ve II de doğrudur.
      E: II ve III de doğrudur, IV ise yanlıştır.
  kaynaklar:
