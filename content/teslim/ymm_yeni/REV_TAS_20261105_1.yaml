      sözleşmeler fesih tarihinden itibaren en geç 15 gün içinde (12 Mart + 15 gün = 27 Mart 2026) Bakanlığa bildirilir. Zorunlu
      tasdike tabi işletme bir ay içinde başka bir YMM ile sözleşme yapmak zorundadır ve fesihte YMM çalışma notlarını ve
      gerekli tüm bilgileri yerine geçecek YMM'ye devretmek zorundadır.
    celdiriciler:
      A: Bildirim süresi 30 gün değil 15 gündür.
      B: Yeni sözleşme süresi üç ay değil bir aydır.
      D: Çalışma notlarının devri zorunludur.
      E: Fesih için Bakanlık izni gerekmez; taraflar yazılı gerekçeyle her zaman feshedebilir.
