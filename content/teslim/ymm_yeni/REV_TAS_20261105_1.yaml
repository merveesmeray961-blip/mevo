    C: (K) YMM seçmemiş sayılır; seçimi doğrudan Bakanlık yapar, ilgililere bildirir ve seçilen YMM ile sözleşme zorunlu olarak
      imzalanır
    D: (K), bildirimi hesap dönemini izleyen ilk ay içinde yapabileceğinden seçmemiş sayılmaz
    E: (K), hesap dönemi başına kadar bildirmediğinden YMM seçmemiş sayılır; seçim Birlik tarafından ilgili Odaya yaptırılır
