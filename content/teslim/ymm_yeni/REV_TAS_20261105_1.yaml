- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Tasdik çalışmalarında revizyon
  konu: TAS
  kazanim: YMM'nin sorumluluğu
  tip: hesaplama
  zorluk: 2
  kok: (R) A.Ş.'nin YMM (S) tarafından tasdik edilen kurumlar vergisi beyannamesinin tasdik kapsamındaki bir konuda gerçeği
    yansıtmadığı ve doğru olmadığı anlaşılmıştır. Bu nedenle ziyaa uğratılan kurumlar vergisi 600.000 TL, kesilecek vergi
    ziyaı cezası 300.000 TL olarak belirlenmiştir. (S), sorumluluk sigortası da yaptırmıştır; (R) A.Ş.'nin cirosu 40.000.000
    TL'dir. Yönetmelik md. 20'ye göre (S), mükellefle birlikte müştereken ve müteselsilen toplam kaç TL'den sorumludur?
  secenekler:
    A: '300.000'
    B: '450.000'
    C: '600.000'
    D: '900.000'
    E: 1.200.000
  dogru: D
  aciklama:
    dogru_neden: Md. 20'ye göre tasdik raporu düzenleyen YMM, konu ve belgelerin gerçeği yansıtmaması hâlinde ziyaa uğratılan
      vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumludur (tam teselsül). Sorumluluk
      tutarı vergi + ceza = 600.000 + 300.000 = 900.000 TL'dir. Sigorta yaptırmak sorumluluğu ortadan kaldırmaz; ciro sorumluluk
      tutarını etkilemez.
    celdiriciler:
      A: Yalnızca cezayı kapsar; md. 20 vergiyi de kapsar.
      B: Hiçbir hükümde yarı yarıya sorumluluk öngörülmemiştir; müteselsil sorumlulukta tam tutar esastır.
      C: Yalnızca vergiyi kapsar; kesilecek cezalar da sorumluluğa dâhildir.
      E: Vergi ve ceza ikinci kez toplanmıştır; müteselsil sorumlulukta mükellef ve YMM aynı borcun borçlusudur, borç ikiye
        katlanmaz.
    hesap_adimlari:
    - 'Vergi: 600.000 TL'
    - 'Ceza: 300.000 TL'
    - 'Toplam müteselsil sorumluluk: 600.000 + 300.000 = 900.000 TL'
  kaynaklar:
  - mevzuat: Yeminli Mali Müşavirlerin Tasdik Edecekleri Belgeler, Tasdik Konuları, Tasdike İlişkin Usul ve Esaslar Hakkında
      Yönetmelik
    madde: md. 20
    alinti: konu ve belgelerin gerçeği yansıtmaması ve doğru olmaması halinde, ziyaa uğratılan vergilerden ve kesilecek cezalardan
      Vergi Usul Kanunu ve 3568 sayılı Kanun hükümleri uyarınca mükellefle birlikte müştereken ve müteselsilen sorumludurlar.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 600000 + 300000
