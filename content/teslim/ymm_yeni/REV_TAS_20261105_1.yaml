  secenekler:
    A: Fesih en geç 11 Nisan 2026'ya kadar Bakanlığa bildirilir; (T) bir ay içinde başka bir YMM ile sözleşme yapar; (V) çalışma
      notlarını yeni YMM'ye devreder
    B: Fesih en geç 27 Mart 2026'ya kadar Bakanlığa bildirilir; (T) üç ay içinde başka bir YMM ile sözleşme yapar; (V) çalışma
      notlarını yeni YMM'ye devreder
    C: Fesih en geç 27 Mart 2026'ya kadar Bakanlığa bildirilir; (T) bir ay içinde başka bir YMM ile sözleşme yapar; (V) çalışma
      notlarını yeni YMM'ye devreder
    D: Fesih en geç 27 Mart 2026'ya kadar Bakanlığa bildirilir; (T) bir ay içinde sözleşme yapar; (V) çalışma notlarını kendisinde
      tutar, devretmez
    E: Fesih Bakanlığın önceden iznine bağlıdır; (T) bir ay içinde başka bir YMM ile sözleşme yapar; (V) çalışma notlarını
      yeni YMM'ye devreder
