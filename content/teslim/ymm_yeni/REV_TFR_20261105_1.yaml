- id: TASLAK
  sinav: ymm
  ders: REV
  konu: TFR
  kazanimlar:
  - transfer fiyatlandırması yöntemleri (maliyet artı, yeniden satış fiyatı)
  - ilişkili kişi kavramı ve ödünç işlemleri
  - örtülü kazancın KKEG, kâr payı sayılması ve düzeltme
  zorluk: 2
  puan: 23
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Marmara Boru Sanayi A.Ş.**''nin ortakları; Bay Demir (%30)
    ile Almanya''da yerleşik **Tubo GmbH**''dir (%70). 2026 yılında YMM, ilişkili kişi işlemlerinde şu tespitleri yapmıştır:


    1. A.Ş., maliyeti 8.000.000 TL olan boruları Tubo GmbH''ye 9.000.000 TL''ye satmıştır. Aynı tür mal için ilişkisiz kişilere
    satışlarda uygulanan makul brüt kâr oranı maliyet üzerinden %25''tir.

    2. A.Ş., Bay Demir''in tamamına sahip olduğu Berg GmbH''den (Avusturya) 9.200.000 TL''ye yarı mamul satın almış ve bunları
    ilişkisiz müşterilere 10.000.000 TL''ye yeniden satmıştır. Bu tür yeniden satışlarda objektif piyasa koşullarına göre
    makul brüt satış kârı %20''dir.

    3. A.Ş., Bay Demir''in kayın biraderi Bay Çelik''e 1.1.2026''da 1.000.000 TL''yi faizsiz ve bir yıl vadeli olarak ödünç
    vermiştir. Emsallere uygun yıllık faiz oranı %30 olarak tespit edilmiştir.


    Her üç işlemde de ilişkili taraflar 5520 sayılı Kanun md. 13 bakımından ilişkili kişi kabul edilecek, aksi belirtilmedikçe
    vergi sonuçları ilgili işlemin yapıldığı hesap dönemine ilişkindir. Kurumlar vergisi oranı %25''tir. Kayıtlarda yer alan
    bu işlemlerin dışında örtülü kazanç dağıtımı yoktur.


    **İstenenler:**


    (a) 1 numaralı işlemde uygulanacak yöntemi belirtip emsallere uygun satış bedelini ve örtülü olarak dağıtılan kazancı
    hesaplayınız. (5 puan)


    (b) 2 numaralı işlemde uygulanacak yöntemi belirtip emsallere uygun alış bedelini ve örtülü olarak dağıtılan kazancı hesaplayınız.
    (5 puan)


    (c) 3 numaralı işlemin md. 13 kapsamında değerlendirilip değerlendirilemeyeceğini, kayın hısmı ilişkisi ve işlemin niteliği
    bakımından açıklayarak örtülü kazanç tutarını bulunuz. (4 puan)


    (d) Toplam örtülü kazanç dağıtımının kurumlar vergisi matrahına ve kurumlar vergisine etkisini bulunuz; bu tutarın dağıtılmış
    kâr payı sayılacağı tarihi ve karşı taraflarda düzeltme yapılabilmesinin şartını belirtiniz. (6 puan)


    (e) Emsallere uygun fiyatın tespitinde yöntem seçiminin ve iç/dış emsal kullanımının ilkelerini ve belge saklama yükümlülüğünü
    açıklayınız. (3 puan)

    '
  cozum: '**(a) Maliyet artı yöntemi** (md. 13/4-b): emsallere uygun fiyat, maliyetin makul brüt kâr oranı kadar artırılmasıyla
    bulunur.


    Emsal satış bedeli = 8.000.000 × 1,25 = **10.000.000 TL**; uygulanan 9.000.000 TL → örtülü dağıtılan kazanç = 10.000.000
    − 9.000.000 = **1.000.000 TL**.


    **(b) Yeniden satış fiyatı yöntemi** (md. 13/4-c): ilişkisiz kişilere yeniden satış fiyatından makul brüt satış kârı düşülür.


    Emsal alış bedeli = 10.000.000 − (10.000.000 × %20) = **8.000.000 TL**; ödenen 9.200.000 TL → fazla ödenen ve örtülü dağıtılan
    kazanç = **1.200.000 TL**.


    **(c)** Ortakların eşleri, üstsoy-altsoyu ile üçüncü derece dahil yansoy hısımları ve **kayın hısımları** ilişkili kişi
    sayılır (md. 13/2). Bay Demir''in kayın biraderi ilişkili kişidir. Ödünç para verilmesi her halde mal veya hizmet alım-satımı
    sayılır (md. 13/1). Emsal faiz = 1.000.000 × %30 = 300.000 TL; hiç faiz alınmadığından örtülü dağıtılan kazanç = **300.000
    TL**. İşlem kurum ile gerçek kişi arasındadır; md. 13/7''deki Hazine zararı şartı yalnızca tam mükellef kurumlar ile yabancı
    kurumların Türkiye''deki işyeri veya daimi temsilcileri arasındaki yurt içi işlemler için aranır; burada aranmaz.


    **(d) Vergisel sonuç**


    | İşlem | Örtülü kazanç (TL) |

    |---|---|

    | 1 Tubo GmbH''ye düşük fiyatlı satış | 1.000.000 |

    | 2 Berg GmbH''den yüksek fiyatlı alış | 1.200.000 |

    | 3 Faizsiz borç | 300.000 |

    | **Toplam** | **2.500.000** |


    Transfer fiyatlandırması yoluyla örtülü dağıtılan kazançlar kurum kazancının tespitinde indirilemez (md. 11/1-c); matraha
    **2.500.000 TL** eklenir ve kurumlar vergisi **625.000 TL** artar (2.500.000 × %25). Tutar, md. 13''teki şartların gerçekleştiği
    hesap döneminin son günü (**31.12.2026**) itibarıyla dağıtılmış kâr payı (dar mükellef için ana merkeze aktarılan tutar)
    sayılır; karşı taraflarda düzeltme yapılabilmesi için örtülü kazanç dağıtan kurum adına tarh edilen vergilerin **kesinleşmiş
    ve ödenmiş** olması şarttır (md. 13/6).


    **(e)** Kurum, işlemin mahiyetine en uygun yöntemi seçer (md. 13/4). Seçimde öncelikle mükellefin ilişkisiz kişilerle
    yaptığı işlemlerdeki fiyat **iç emsal** olarak esas alınır; iç emsal bulunmaması veya güvenilir olmaması halinde benzer
    mükellef ve kurumların işlemleri **dış emsal** olarak kullanılır; ikisinin birlikte kullanımı da mümkündür. Emsallere
    uygun fiyata ilişkin hesaplamalara ait kayıt, cetvel ve belgelerin ispat edici kâğıt olarak saklanması zorunludur (md.
    13/3).

    '
  puanlama:
  - olcut: (a) Maliyet artı yöntemi, 10.000.000 TL emsal bedel ve 1.000.000 TL örtülü kazanç
    puan: 5
  - olcut: (b) Yeniden satış fiyatı yöntemi, 8.000.000 TL emsal bedel ve 1.200.000 TL örtülü kazanç
    puan: 5
  - olcut: (c) Kayın hısmının ilişkili kişi sayılması, ödünç işleminin md. 13 kapsamında olması ve 300.000 TL
