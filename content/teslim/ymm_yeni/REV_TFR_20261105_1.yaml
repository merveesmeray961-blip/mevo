  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-c
    alinti: c) Transfer fiyatlandırması yoluyla örtülü olarak dağıtılan kazançlar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
