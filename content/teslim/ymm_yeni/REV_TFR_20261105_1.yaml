  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Karacabey Gıda A.Ş.**''nin 2026 yılı kurumlar vergisi revizyonunda
    YMM, ilişkili kişilerle yapılan şu işlemleri tespit etmiştir (tüm kurumlar vergisi mükellefleri %25 oranına tabidir, kimsenin
    geçmiş yıl zararı yoktur):


    1. Şirket, %60 ortağı olan tam mükellef **Bora Dağıtım A.Ş.**''ye emsal bedeli 1.000.000 TL olan malı 800.000 TL''ye satmıştır.
    Bora Dağıtım bu malın tamamını 2026 yılı içinde ilişkisiz müşterilere satmıştır.

    2. Şirket, %60 ortağı tam mükellef gerçek kişi **Bay Kaya**''ya emsal bedeli 650.000 TL olan malı 500.000 TL''ye satmıştır.

    3. Şirket, Türkiye''de işyeri veya daimi temsilcisi bulunmayan, %40 ortağı **Fresh Inc.** (ABD)''den emsal bedeli 400.000
    TL olan hizmeti 520.000 TL''ye satın almıştır.

    4. Şirket, %70 ortağı olan tam mükellef **Doruk Pazarlama A.Ş.**''ye emsal bedeli 750.000 TL olan malı 600.000 TL''ye
    satmıştır. Doruk Pazarlama bu malın tamamını 31.12.2026 itibarıyla stoklarında tutmaktadır.


    Şirketin transfer fiyatlandırması belgelendirme yükümlülükleri tam ve zamanında yerine getirilmiştir ve vergi ziyaına
    VUK md. 359''daki fiillerle sebebiyet verilmemiştir. Şirket 2026 kazancını emsal dışı bedellerle gerçekleştirmiş ve işlemleri
    bu bedellerle kaydetmiştir.


    **İstenenler:**


    (a) 1 ve 4 numaralı işlemlerde KVK md. 13/7''deki Hazine zararı şartı bakımından değerlendirme yaparak, örtülü kazanç
    dağıtımının kabul edilip edilmeyeceğini gerekçesiyle belirtiniz. (7 puan)


    (b) 2 ve 3 numaralı işlemlerde Hazine zararı şartının aranıp aranmayacağını açıklayarak örtülü kazanç tutarlarını bulunuz.
    (4 puan)


    (c) Kurum kazancına eklenecek toplam örtülü kazanç tutarını ve buna isabet eden kurumlar vergisini hesaplayınız. (4 puan)


    (d) Tarh edilecek vergiye bağlı vergi ziyaı cezasının tutarını, belgelendirme yükümlülüğünün yerine getirilmiş olmasının
    etkisini göstererek hesaplayınız. (4 puan)


    (e) Örtülü kazancın karşı taraflar nezdindeki sonuçlarını (kâr payı sayılma anı, başka kuruma aktarılması ve gerçek kişi/dar
    mükellefe aktarılması halleri, düzeltme şartı) açıklayınız. (4 puan)

    '
  cozum: '**(a) Hazine zararı şartı** (md. 13/7): Tam mükellef kurumlar arasındaki yurt içi işlemlerde örtülü kazanç ancak
    emsallere aykırı fiyat nedeniyle kurum ve ilişkili kişiler adına tahakkuk ettirilmesi gereken **toplam verginin eksik
    veya geç tahakkuk ettirilmesi** halinde kabul edilir.


    - **1 numaralı işlem:** Satıcı Karacabey''in kazancı 200.000 TL az, vergisi 50.000 TL eksik tahakkuk etmiştir; ancak alıcı
    Bora Dağıtım malı aynı yıl sattığından maliyeti 200.000 TL düşük, kazancı 200.000 TL fazla çıkmış ve 50.000 TL fazla vergi
    ödemiştir. Toplam vergi etkisi sıfırdır (−50.000 + 50.000); Hazine zararı **doğmadığından örtülü kazanç kabul edilmez**,
    matrah düzeltmesi yapılmaz.

    - **4 numaralı işlem:** Satıcı 150.000 TL (750.000 − 600.000) eksik kazanç beyan ettiğinden 37.500 TL vergi eksik tahakkuk
    etmiş; alıcı malı stokta tuttuğundan buna karşılık gelen ek vergi ancak ileride (satış döneminde) doğacaktır. Vergi **eksik
    veya geç tahakkuk** ettiğinden Hazine zararı vardır; **150.000 TL örtülü kazanç** kabul edilir.


    **(b)** Hazine zararı şartı yalnızca tam mükellef kurumlar ile yabancı kurumların Türkiye''deki işyeri/daimi temsilcileri
    arasındaki **yurt içi** işlemlerde aranır.


    - 2 numaralı işlem karşı tarafı gerçek kişidir → şart aranmaz; örtülü kazanç 650.000 − 500.000 = **150.000 TL**.

    - 3 numaralı işlem karşı tarafı yurt dışında yerleşik, Türkiye''de işyeri bulunmayan kurumdur → şart aranmaz; fazla ödenen
    520.000 − 400.000 = **120.000 TL** örtülü kazançtır (md. 11/1-c ile gider yazılamaz).


    **(c)**


    | İşlem | Örtülü kazanç (TL) |

    |---|---|

    | 1 | 0 |

    | 2 | 150.000 |

    | 3 | 120.000 |

    | 4 | 150.000 |

    | **Toplam** | **420.000** |


    Kurum kazancına **420.000 TL** eklenir; kurumlar vergisi = 420.000 × %25 = **105.000 TL**.


    **(d)** Vergi ziyaı cezası ziyaa uğratılan verginin bir katıdır (VUK md. 344) = 105.000 TL. Belgelendirme yükümlülükleri
    tam ve zamanında yerine getirildiğinden (ve VUK md. 359 fiili bulunmadığından) ceza **%50 indirimli** uygulanır (KVK md.
    13/8): 105.000 × %50 = **52.500 TL**. (Belgelendirme yapılmasaydı ceza 105.000 TL olacaktı.)


    **(e)**


    - Örtülü kazanç, md. 13''teki şartların gerçekleştiği hesap döneminin son günü (**31.12.2026**) itibarıyla dağıtılmış
    kâr payı (dar mükellef için ana merkeze aktarılan tutar) sayılır (md. 13/6).

    - Bu kâr payı başka bir kuruma aktarılmışsa **iştirak kazancı** olarak değerlendirilir; dar mükellef kuruma, gerçek kişilere
    veya vergiye tabi olmayan ya da vergiden muaf kişi/kuruma aktarılmışsa **net kâr payı** kabul edilip brüte tamamlanır
    ve bulunan tutar üzerinden kâr dağıtımına bağlı vergi kesintisi yapılır (Bay Kaya ve Fresh Inc. örneklerinde olduğu gibi).

    - Karşı taraf nezdinde düzeltme yapılabilmesi için örtülü kazanç dağıtan kurum (Karacabey) adına tarh edilen vergilerin
    **kesinleşmiş ve ödenmiş** olması şarttır.

    '
