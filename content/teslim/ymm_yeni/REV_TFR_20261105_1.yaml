    alinti: Kanunda borcun hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı örtülü sermaye
      olarak kabul edildiğinden, bu limiti aşan kısma isabet eden faiz, kur farkı ve benzeri giderlerin geçici vergi dönemleri
      de dahil olmak üzere vergi matrahından indirilmesi mümkün olmayacaktır.
  dogrulama:
    python: 'os_=500000; limit=3*os_

      kerem=700000; orbit=20000*40; banka=800000*0.5; avans=100000

      toplam=kerem+orbit+banka+avans

      ortulu=toplam-limit

      oran=ortulu/toplam

      gider_kerem=63000; faiz_orbit=24000; kur_orbit=40000; faiz_banka=40000/2

      faiz_toplam=gider_kerem+faiz_orbit+faiz_banka

      kkeg=oran*(faiz_toplam+kur_orbit)

      kar_payi=oran*faiz_toplam

      pay_kerem=kerem/toplam*ortulu; pay_orbit=orbit/toplam*ortulu; pay_banka=banka/toplam*ortulu; pay_avans=avans/toplam*ortulu

      sonuc={"limit":limit,"toplam":toplam,"ortulu":ortulu,"oran":oran,"faiz_toplam":faiz_toplam,"kkeg":kkeg,"kar_payi":kar_payi,"pay_kerem":pay_kerem,"pay_orbit":pay_orbit,"pay_banka":pay_banka,"pay_avans":pay_avans}

      '
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
