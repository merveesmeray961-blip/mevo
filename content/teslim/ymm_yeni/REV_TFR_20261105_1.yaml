- id: TASLAK
  sinav: ymm
  ders: REV
  konu: TFR
  kazanimlar:
  - örtülü sermaye tespiti ve borç/öz sermaye oranı
  - örtülü sermaye sayılmayan borçlanmalar
  - örtülü sermaye üzerinden faiz ve kur farkının KKEG ve kâr payı sayılması
  zorluk: 3
  puan: 21
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Kuzey Çelik A.Ş.**''nin VUK''a göre tespit edilen 1.1.2026
    tarihli öz sermayesi **600.000 TL**''dir. Şirketin 2026 yılı boyunca (yıl içinde hiç ödeme yapılmamış ve tamamı yıl sonunda
    da açık olmak üzere) işletmede kullandığı borçlar şunlardır:


    | No | Borç veren | Niteliği | Tutar (TL) | 2026 faiz gideri (TL) | Kur farkı gideri (TL) |

    |---|---|---|---|---|---|

    | 1 | Bay Ali | %55 ortak, tam mükellef gerçek kişi | 1.200.000 | 120.000 | – |

    | 2 | Nova Holding GmbH | %25 ortak, Almanya''da yerleşik dar mükellef kurum | 600.000 | 54.000 | 18.000 |

    | 3 | Karadeniz Bankası A.Ş. | Bay Ali''nin %40 ortağı olduğu, ana faaliyeti kapsamında kredi veren banka | 1.200.000
    | 192.000 | – |

    | 4 | Ege Bankası A.Ş. | Ortakla ilişkisi yok; kredi, Bay Ali''nin verdiği gayrinakdî teminat karşılığında kullanılmıştır
    | 800.000 | 100.000 | – |

    | 5 | Doğuş Ltd. Şti. | Şirketin iştiraki; bir bankadan temin ettiği krediyi aynı şartlarla şirkete kullandırmıştır |
    500.000 | 60.000 | – |


    Tüm faiz ve kur farkı giderleri 2026 yılında gider yazılmıştır. Örtülü sermayeye isabet eden kanunen kabul edilmeyen gider
    tutarının hesabında, Tebliğ''deki örnek hesapta olduğu gibi, örtülü sermaye tutarının hesaba esas alınan toplam borca
    oranı üzerinden, ilgili borçlara ait faiz ve kur farkı giderlerinin toplamı esas alınacaktır. Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) Örtülü sermaye hesabında dikkate alınmayacak borçlanmaları gerekçeleriyle belirleyiniz; hesaba esas alınacak toplam
    borç tutarını bulunuz. (6 puan)


    (b) Örtülü sermaye tutarını hesaplayınız ve borç verenlere isabet eden payları gösteriniz. (5 puan)


    (c) 2026 kurumlar vergisi matrahına eklenecek kanunen kabul edilmeyen gider tutarını ve kurumlar vergisine etkisini bulunuz.
    (5 puan)


    (d) Örtülü sermaye üzerinden hesaplanan faiz ve kur farklarının borç verenler nezdindeki sonucunu (özellikle Nova Holding
    GmbH bakımından) açıklayınız. (5 puan)

    '
  cozum: '**(a) Hesaba esas borç**


    - 4 numaralı borç: ortakların sağladığı gayrinakdî teminat karşılığında **üçüncü kişiden** yapılan borçlanmadır; KVK md.
    12/6-a gereği örtülü sermaye sayılmaz, hesaba alınmaz.

    - 5 numaralı borç: iştirakin banka kredisini **aynı şartlarla** kullandırması KVK md. 12/6-b kapsamındadır; hesaba alınmaz.

    - 3 numaralı borç: ortakla ilişkili kişi sayılan ve ana faaliyetine uygun çalışan bankadan yapılan borçlanma **%50 oranında**
    dikkate alınır (KVK md. 12/2): 1.200.000 × %50 = 600.000 TL.


    | Borç | Tutar | Dikkate alınan |

    |---|---|---|

    | 1 Bay Ali | 1.200.000 | 1.200.000 |

    | 2 Nova Holding | 600.000 | 600.000 |

    | 3 Karadeniz Bankası | 1.200.000 | 600.000 |

    | 4 Ege Bankası | 800.000 | 0 |

    | 5 Doğuş Ltd. | 500.000 | 0 |

    | **Toplam** | | **2.400.000** |


    **(b) Örtülü sermaye**


    Öz sermaye = 600.000 TL; üç katı = 1.800.000 TL. Örtülü sermaye = 2.400.000 − 1.800.000 = **600.000 TL** (KVK md. 12/1;
    öz sermaye hesap dönemi başındaki VUK öz sermayesidir, md. 12/3-b).


    | Borç veren | Dikkate alınan borç | Pay (borç / 2.400.000 × 600.000) |

    |---|---|---|

    | Bay Ali | 1.200.000 | 300.000 |

    | Nova Holding | 600.000 | 150.000 |

    | Karadeniz Bankası | 600.000 | 150.000 |

    | **Toplam** | 2.400.000 | **600.000** |


    **(c) KKEG**


    Oran = 600.000 / 2.400.000 = %25. Örtülü sermaye hesabına giren borçların faiz ve kur farkı giderleri: 120.000 + 54.000
    + 18.000 + 192.000 = 384.000 TL. KKEG = 384.000 × %25 = **96.000 TL** (KVK md. 11/1-b). Kurumlar vergisi etkisi = 96.000
    × %25 = **24.000 TL**.


    **(d) Borç verenler nezdindeki sonuç**


    - Örtülü sermaye üzerinden ödenen faiz ve benzeri tutarlar, hem borç alan hem borç veren nezdinde, örtülü sermaye şartlarının
    gerçekleştiği hesap döneminin son günü (31.12.2026) itibarıyla **dağıtılmış kâr payı** (dar mükellefler için ana merkeze
    aktarılan tutar) sayılır (KVK md. 12/7).

    - Faiz kısmı: (120.000 + 54.000 + 192.000) × %25 = 91.500 TL kâr payı sayılır. **Kur farkı kısmı (18.000 × %25 = 4.500
    TL) kâr payı sayılmaz.**

    - Nova Holding GmbH dar mükellef kurum olduğundan kendisine isabeden faiz (54.000 × %25 = 13.500 TL), net kâr payı kabul
    edilip brüte tamamlanarak kâr dağıtımına bağlı vergi kesintisine tabidir; daha önce faizden yapılan kesinti bu kesintiye
    mahsup edilir.

    - Bay Ali (tam mükellef gerçek kişi) bakımından da aynı kâr payı nitelendirmesi geçerlidir; Karadeniz Bankası (tam mükellef)
    bakımından düzeltme yapılabilmesi için borç alan adına tarh edilen vergilerin kesinleşmiş ve ödenmiş olması şarttır.

    '
  puanlama:
  - olcut: (a) 4 ve 5 numaralı borçların gerekçeli dışlanması; bankaya %50 uygulanması; 2.400.000 TL
    puan: 6
  - olcut: (b) Öz sermayenin üç katı (1.800.000 TL), örtülü sermaye 600.000 TL ve payların dağılımı
    puan: 5
  - olcut: (c) %25 oranı, 384.000 TL gider toplamı, 96.000 TL KKEG ve 24.000 TL vergi etkisi
    puan: 5
  - olcut: (d) Kâr payı sayılma (md. 12/7), kur farkının hariç kalması, dar mükellef için kesinti, düzeltme şartı
    puan: 5
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/1
    alinti: Kurumların, ortaklarından veya ortaklarla ilişkili olan kişilerden doğrudan veya dolaylı olarak temin ederek işletmede
      kullandıkları borçların, hesap dönemi içinde herhangi bir tarihte kurumun öz sermayesinin üç katını aşan kısmı, ilgili
      hesap dönemi için örtülü sermaye sayılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/2
    alinti: Yukarıda belirtilen karşılaştırma sırasında, sadece ilişkili şirketlere finansman temin eden kredi şirketlerinden
      yapılan borçlanmalar hariç olmak üzere, ana faaliyet konusuna uygun olarak faaliyette bulunan ve ortak veya ortakla
      ilişkili kişi sayılan banka veya benzeri kredi kurumlarından yapılan borçlanmalar % 50 oranında dikkate alınır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/6-a,b
    alinti: a) Kurumların ortaklarının veya ortaklarla ilişkili kişilerin sağladığı gayrinakdî teminatlar karşılığında üçüncü
      kişilerden yapılan borçlanmalar. b) Kurumların iştiraklerinin, ortaklarının veya ortaklarla ilişkili kişilerin, banka
      ve finans kurumlarından ya da sermaye piyasalarından temin ederek aynı şartlarla kısmen veya tamamen kullandırdığı borçlanmalar.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 12/7
    alinti: (7) Örtülü sermaye üzerinden kur farkı hariç, faiz ve benzeri ödemeler veya hesaplanan tutarlar, Gelir ve Kurumlar
      Vergisi kanunlarının uygulanmasında, gerek borç alan gerekse borç veren nezdinde, örtülü sermaye şartlarının gerçekleştiği
      hesap döneminin son günü itibarıyla dağıtılmış kâr payı veya dar mükellefler için ana merkeze aktarılan tutar
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 11/1-b
    alinti: b) Örtülü sermaye üzerinden ödenen veya hesaplanan faiz, kur farkları ve benzeri giderler.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 12.4
    alinti: Kur farkları bu kapsamda değerlendirilmeyecektir.
  dogrulama:
    python: 'os_=600000

      ali=1200000; nova=600000; bank=1200000

      dikkate=ali+nova+bank*0.5

      ortulu=max(0,dikkate-3*os_)

      pay_ali=ali/dikkate*ortulu; pay_nova=nova/dikkate*ortulu; pay_bank=bank*0.5/dikkate*ortulu

      oran=ortulu/dikkate

      faiz=120000+54000+192000; kur=18000

      kkeg=oran*(faiz+kur)

      kv=kkeg*0.25

      kar_payi_faiz=oran*faiz; kar_payi_kur=oran*kur

      sonuc={"dikkate":dikkate,"ortulu":ortulu,"pay_ali":pay_ali,"pay_nova":pay_nova,"pay_bank":pay_bank,"kkeg":kkeg,"kv":kv,"kar_payi_faiz":kar_payi_faiz,"kur":kar_payi_kur}

      '
