  - olcut: (d) 2.500.000 TL matrah ilavesi, 625.000 TL vergi, 31.12.2026 kâr payı tarihi, kesinleşme ve ödenme şartı
    puan: 6
  - olcut: (e) Yöntem seçimi, iç/dış emsal ilkesi ve belge saklama zorunluluğu
    puan: 3
