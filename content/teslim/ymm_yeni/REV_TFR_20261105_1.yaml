  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 13.2
    alinti: Emsallere uygun fiyat veya bedele ulaşmak için yukarıda yer verilen yöntemlerden en uygun olanının seçilmesinde
      öncelikle mükellefin ilişkisiz kişilerle yaptığı işlemlerde kullandığı fiyat veya bedel iç emsal olarak karşılaştırmaya
      esas ölçü alınacak olup bu şekilde kullanılan fiyat veya bedelin bulunmaması veya güvenilir olmaması halinde doğrudan
      benzeri nitelikteki mükellef veya kurumların işlemleri dış emsal olarak esas alınabilecektir.
  dogrulama:
    python: 'maliyet=8000000; mk_oran=0.25; uygulanan=9000000

      emsal_a=maliyet*(1+mk_oran); fark_a=emsal_a-uygulanan

      yeniden=10000000; brut=0.20; odenen=9200000

      emsal_b=yeniden*(1-brut); fark_b=odenen-emsal_b

      ihtiyari=1000000; faiz_oran=0.30; fark_c=ihtiyari*faiz_oran

      toplam=fark_a+fark_b+fark_c

      kv=toplam*0.25

      sonuc={"emsal_a":emsal_a,"fark_a":fark_a,"emsal_b":emsal_b,"fark_b":fark_b,"fark_c":fark_c,"toplam":toplam,"kv":kv}

