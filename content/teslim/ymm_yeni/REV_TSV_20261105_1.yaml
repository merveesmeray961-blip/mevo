    **Yeşilvadi Plastik A.Ş.**''nin genel kurulu 15.2.2026''da sermayenin nakden artırılmasına karar vermiş, karar **20.3.2026**''da
    ticaret siciline tescil edilmiştir. Nakdi sermaye artışına ilişkin ödemeler şöyledir:


    | Tarih | Ödeyen ortak | Açıklama | Tutar |

    |---|---|---|---|

    | 10.3.2026 | Bay Aksoy | Şirketin banka hesabına nakit olarak yatırılmıştır | 2.400.000 TL |

    | 5.5.2026 | Bay Aksoy | Şirketin banka hesabına nakit olarak yatırılmıştır | 3.000.000 TL |

    | 12.8.2026 | Alpha GmbH | Yurt dışından getirilen nakitle karşılanmıştır (TL karşılığı) | 1.000.000 TL |

    | 1.10.2026 | Bay Cem | Ortağın kullandığı banka kredisiyle yatırılmıştır | 2.000.000 TL |


    Ayrıca 2026 yılında, bilançoda yer alan olağanüstü yedeklerden **1.000.000 TL** sermayeye eklenmiştir. Şirketin sermayesini
    azaltma işlemi yoktur. Kurum kazancının tespitinde indirimden yararlanılan yıl için TCMB tarafından en son açıklanan ticari
    kredi faiz oranı **%40** kabul edilecektir.


    Şirketin 2026 yılı ticari bilanço kârı **3.000.000 TL**, kanunen kabul edilmeyen giderleri **200.000 TL**, mahsup edilecek
    geçmiş yıl zararı **800.000 TL**''dir; başka indirim veya istisnası yoktur. Kurumlar vergisi oranı %25''tir. Yurt içi
