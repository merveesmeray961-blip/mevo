    %12,5 olması) **2027 hesap dönemi ve sonrasında** elde edilen kazançlara uygulanacaktır.


    **(b) Uygulama sırası**


    Md. 32/9 gereği 7. ve 8. fıkradaki indirimli oranlar, maddedeki diğer indirimler (halka arz indirimi) uygulandıktan sonraki
    oran üzerine uygulanır:


    - Halka arz sonrası genel oran: 25 − 2 = **%23**

    - Üretim kazançları: 23 − 1 = **%22**

    - İhracat kazançları: 23 − 5 = **%18**

    - Diğer kazançlar: **%23**


    **(c) İndirimli oranlı matrah**


    Matrah = 6.000.000 + 900.000 − 400.000 − 200.000 = **6.300.000 TL**.


    Oranlama (Matrah × faaliyet kazancı / ticari bilanço kârı):


    - Üretim: 6.300.000 × 3.000.000/6.000.000 = 3.150.000 TL; ancak bu tutar üretimden elde edilen kazancı (3.000.000 TL)
    aşamayacağından **3.000.000 TL**.

    - İhracat: 6.300.000 × 2.000.000/6.000.000 = 2.100.000 TL; ancak ihracattan elde edilen kazancı (2.000.000 TL) aşamayacağından
    **2.000.000 TL**.

    - Kalan matrah: 6.300.000 − 3.000.000 − 2.000.000 = **1.300.000 TL** (genel indirimli oranla).


    **(d) Kurumlar vergisi**


    | Matrah grubu | Tutar (TL) | Oran | Vergi (TL) |

    |---|---|---|---|

    | Üretim | 3.000.000 | %22 | 660.000 |

    | İhracat | 2.000.000 | %18 | 360.000 |

    | Kalan | 1.300.000 | %23 | 299.000 |

    | **Toplam** | **6.300.000** | | **1.319.000** |


