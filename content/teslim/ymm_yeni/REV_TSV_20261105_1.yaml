    tutarın üzerinde olduğu kabul edilecektir.


    **İstenenler:**


    (a) Nakdi sermaye artışı indirimi hesabında dikkate alınacak ve alınmayacak tutarları gerekçeleriyle belirtiniz. (6 puan)


    (b) Dikkate alınan her ödeme için indirim oranını ve hesaba esas ay sayısını belirtiniz. (4 puan)


    (c) 2026 yılı indirim tutarını hesaplayınız. (5 puan)


    (d) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (3 puan)


    (e) Bu indirimden hangi hesap dönemlerinde yararlanılabileceğini ve matrahın yetersiz kalması halinde sonucu açıklayınız.
    (3 puan)

    '
  cozum: '**(a) Dikkate alınacak / alınmayacak tutarlar**


    - Bay Aksoy''un 2.400.000 TL ve 3.000.000 TL''lik ödemeleri ile Alpha GmbH''nin 1.000.000 TL''lik ödemesi, tescil edilmiş
    nakdi sermaye artışına nakit olarak yatırıldığından **dikkate alınır**.

    - Bay Cem''in **ortağın kredi kullanması suretiyle** gerçekleştirilen 2.000.000 TL''lik artırımı md. 10/1-ı gereği indirim
    hesabında **dikkate alınmaz**.

    - Bilançodaki öz sermaye kaleminin (olağanüstü yedek) sermayeye eklenmesinden kaynaklanan 1.000.000 TL **dikkate alınmaz**
    (nakdi artış değildir).


    **(b) Oran ve süre**


    Sermaye artışı kararı 20.3.2026''da tescil edilmiştir.


    - 10.3.2026 ödemesi tescilden önce yatırıldığından **tescil tarihinin içinde bulunduğu ay (Mart)** esas alınır; ay kesri
    tam ay sayılır → Mart-Aralık = **10 ay**; oran **%50**.

    - 5.5.2026 ödemesi tescilden sonradır; Mayıs-Aralık = **8 ay**; oran **%50**.

    - 12.8.2026 ödemesi yurt dışından getirilen nakit olduğundan oran **%75**; Ağustos-Aralık = **5 ay**.


    **(c) İndirim tutarı** (nakdi artış × ticari kredi faiz oranı × indirim oranı × süre)


    | Ödeme | Hesap | Tutar (TL) |

    |---|---|---|

    | 2.400.000 | 2.400.000 × 0,40 × 0,50 × 10/12 | 400.000 |

    | 3.000.000 | 3.000.000 × 0,40 × 0,50 × 8/12 | 400.000 |

    | 1.000.000 (yurt dışı) | 1.000.000 × 0,40 × 0,75 × 5/12 | 125.000 |

    | **Toplam** | | **925.000** |


    **(d) Matrah ve vergi**


    Kurum kazancı = 3.000.000 + 200.000 − 800.000 = 2.400.000 TL; indirim sonrası matrah = 2.400.000 − 925.000 = **1.475.000
    TL**. Kurumlar vergisi = 1.475.000 × %25 = **368.750 TL**.


    **(e) Süre ve devir**


    İndirimden, sermaye artırımına ilişkin kararın tescil edildiği hesap dönemi (2026) ile izleyen dört hesap dönemi (2027-2030)
    için ayrı ayrı yararlanılır; bu dönemlerde sermaye azaltımı yapılırsa azaltılan tutar hesaplamada dikkate alınmaz. Matrahın
    yetersiz olması nedeniyle ilgili dönemde indirim konusu yapılamayan tutarlar sonraki hesap dönemlerine **devreder**.

    '
