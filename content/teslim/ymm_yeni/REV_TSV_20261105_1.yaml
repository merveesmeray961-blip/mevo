      iştirak kazançları istisnası düşüldükten sonra, indirim ve istisnalar düşülmeden önceki [Ticari bilanço kârı – (iştirak
      kazançları istisnası + geçmiş yıl zararları)] tutardır.
  - mevzuat: 'Kurumlar Vergisi Genel Tebliği (Seri No: 1)'
    madde: bölüm 10.3.2.1
    alinti: İndirilemeyen kısım diğer yıla nakledilemez.
  dogrulama:
    python: 'tbk=6000000; kkeg=1900000; istisna=500000; zarar=300000

      kurum_kazanci=tbk+kkeg-istisna-zarar

      spor=0.5*300000+100000

      taban=tbk-(istisna+zarar)

      sinir=0.05*taban

      bagis=min(180000+220000,sinir)

      okul=700000; kizilay=150000

      indirim=spor+bagis+okul+kizilay

      matrah=kurum_kazanci-indirim

      kv=matrah*0.25

      sonuc={"kurum_kazanci":kurum_kazanci,"spor":spor,"taban":taban,"sinir":sinir,"bagis":bagis,"indirim":indirim,"matrah":matrah,"kv":kv,"devredilemeyen":400000-bagis}

      '
