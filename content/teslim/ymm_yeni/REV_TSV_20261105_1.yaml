  - olcut: (d) 700.000 TL ve 150.000 TL'nin sınırsız indirilmesi (md. 10/1-ç ve 10/1-f)
    puan: 4
  - olcut: (e) 1.360.000 TL toplam indirim, 5.740.000 TL matrah ve 1.435.000 TL vergi
    puan: 4
