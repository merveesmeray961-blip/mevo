  kazanimlar:
  - sponsorluk harcamaları indirimi
  - bağış ve yardımlarda %5 sınırı ve sınırsız indirilebilen bağışlar
  - kurumlar vergisi beyannamesinde indirim sırası ve matrahın tespiti
  zorluk: 3
  puan: 21
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Doğan Mensucat A.Ş.** (finans sektörü dışında faaliyet gösteren,
    imalatçı bir kurumdur) 2026 yılına ilişkin kurumlar vergisi beyannamesini hazırlamaktadır. Şirketin kayıtlarından şu veriler
    alınmıştır:


    - Ticari bilanço kârı: **6.000.000 TL**

    - Kanunen kabul edilmeyen giderler toplamı: **1.900.000 TL** (aşağıdaki sponsorluk, bağış ve yardım harcamalarının tamamı
    ticari kârın hesabında gider yazıldığından bu tutarın içindedir; kalan 250.000 TL başka KKEG kalemleridir)

    - Tam mükellef bir kurumdan elde edilen ve kâr payı olarak ticari kâra dahil edilen iştirak kazancı (KVK md. 5/1-a): **500.000
    TL**

    - Geçmiş yıl zararı: **300.000 TL** (süresi içinde, mahsubu yapılabilir)


    2026 yılında yapılan ve bu sorunun konusu olan harcamalar şunlardır:


    | No | Harcama |

    |---|---|

    | 1 | Gençlik ve Spor Genel Müdürlüğü mevzuatına göre tespit edilen **profesyonel** spor dalında sponsorluk harcaması:
    300.000 TL |

    | 2 | Aynı mevzuata göre tespit edilen **amatör** spor dalında sponsorluk harcaması: 100.000 TL |

    | 3 | Belediyeye makbuz karşılığı bağış: 180.000 TL |

    | 4 | Kamu yararına çalışan bir derneğe makbuz karşılığı bağış: 220.000 TL |

    | 5 | Genel bütçeli bir kamu idaresine bağışlanmak üzere yaptırılan okulun inşası için yapılan harcama: 700.000 TL |

    | 6 | Türkiye Kızılay Derneğine makbuz karşılığı yapılan nakdi bağış: 150.000 TL |


    Bağış ve yardımlarda sınırın dayanağı olan kurum kazancı, Tebliğ''de gösterilen biçimde (indirim ve istisnalar düşülmeden
    önceki kazanç esas alınarak) hesaplanacaktır. Şirketin başka indirim ve istisnası yoktur. Kurumlar vergisi oranı %25''tir.
    Yurt içi asgari kurumlar vergisi (KVK md. 32/C) uygulaması bu sorunun kapsamı dışındadır; hesaplanan kurumlar vergisinin
    asgari tutarın üzerinde olduğu kabul edilecektir.


    **İstenenler:**


    (a) İndirimler yapılmadan önceki kurum kazancını hesaplayınız. (3 puan)


    (b) 1 ve 2 numaralı sponsorluk harcamalarından indirilecek tutarı gerekçesiyle belirleyiniz. (3 puan)


    (c) 3 ve 4 numaralı bağışlar için bağış sınırının dayandığı kurum kazancını Tebliğ''e göre hesaplayınız; indirilebilecek
    tutarı bulunuz ve indirilemeyen kısmın akıbetini belirtiniz. (7 puan)


    (d) 5 ve 6 numaralı harcamaların indirim sınırlamasına tabi olup olmadığını belirterek indirilecek tutarları bulunuz.
    (4 puan)


    (e) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (4 puan)

    '
  cozum: '**(a) Kurum kazancı**


    Ticari bilanço kârı 6.000.000 + KKEG 1.900.000 − iştirak kazancı istisnası 500.000 − geçmiş yıl zararı 300.000 = **7.100.000
    TL**.


    **(b) Sponsorluk (md. 10/1-b)**


    Sponsorluk harcamalarının amatör spor dalları için **tamamı**, profesyonel spor dalları için **%50''si** indirilir: 300.000
    × %50 + 100.000 = 150.000 + 100.000 = **250.000 TL**. Bu indirimde kurum kazancına bağlı bir üst sınır yoktur.


    **(c) Md. 10/1-c bağışları**


    Bağış sınırının dayanağı kurum kazancı Tebliğ 10.3.2.1''e göre [ticari bilanço kârı − (iştirak kazançları istisnası +
    geçmiş yıl zararları)] formülüyle bulunur: 6.000.000 − (500.000 + 300.000) = **5.200.000 TL**. Sınır = 5.200.000 × %5
    = **260.000 TL**.


    Yapılan bağışlar 180.000 + 220.000 = 400.000 TL olduğundan indirilecek tutar **260.000 TL**''dir. Aradaki **140.000 TL**
    sonraki yıla nakledilemez ve indirim konusu yapılamaz (KKEG olarak kalır).


    **(d) Sınırsız indirimler**


    - 5 numaralı harcama, md. 10/1-ç kapsamında genel bütçeli kamu idaresine bağışlanan okulun inşası için yapıldığından **tamamı**
    indirilir: **700.000 TL**; %5 sınırına tabi değildir ve sınırı kullanmaz.

    - 6 numaralı bağış, md. 10/1-f kapsamında Kızılay''a makbuz karşılığı yapılan nakdi bağış olduğundan **tamamı** indirilir:
    **150.000 TL**.


    **(e) Matrah ve vergi**


    | Kalem | Tutar (TL) |

    |---|---|

    | Kurum kazancı | 7.100.000 |

    | Sponsorluk indirimi | (250.000) |

    | Bağış indirimi (md. 10/1-c) | (260.000) |

    | Okul inşası (md. 10/1-ç) | (700.000) |

    | Kızılay bağışı (md. 10/1-f) | (150.000) |

    | **Toplam indirim** | **(1.360.000)** |

    | **Matrah** | **5.740.000** |


    Kurumlar vergisi = 5.740.000 × %25 = **1.435.000 TL**.

    '
  puanlama:
  - olcut: (a) Kurum kazancının 7.100.000 TL bulunması
