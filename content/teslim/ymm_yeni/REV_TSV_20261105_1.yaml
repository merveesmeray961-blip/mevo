  kazanimlar:
  - yurt dışında mal alım satımı ve aracılık kazançlarında %95 indirim
  - transfer şartı ve antrepo uygulaması
  - nitelikli hizmet merkezi indirimi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Boğaziçi Global Ticaret A.Ş.** (finans sektörü dışında; endüstri
    bölgesi veya İstanbul Finans Merkezi dışında faaliyet göstermektedir) 2026 yılında şu işlemleri gerçekleştirmiştir:


    1. Yurt dışından satın aldığı malları Türkiye''ye getirmeksizin yurt dışında yerleşik müşterilere satmıştır. Hasılat 12.000.000
    TL, bu mallar için maliyet 10.000.000 TL, bu faaliyete ilişkin giderler 400.000 TL''dir. Bu faaliyetten doğan kazancın
    **1.200.000 TL**''si kurumlar vergisi beyannamesinin verilmesi gereken tarihe kadar Türkiye''ye transfer edilmiş, kalan
    kısmı bu tarihten sonra transfer edilmiştir.

    2. Satıcısı Çin''de, alıcısı Almanya''da yerleşik firmalar arasındaki bir mal alım satımına aracılık etmiş ve **600.000
    TL** komisyon kazancı elde etmiştir; kazancın tamamı süresinde Türkiye''ye transfer edilmiştir.

    3. Satıcısı Türkiye''de yerleşik bir firma, alıcısı Mısır''da yerleşik bir firma olan mal alım satımına aracılık etmiş
    ve **300.000 TL** kazanç elde etmiştir (kazanç süresinde transfer edilmiştir).

    4. Almanya''dan satın aldığı malları Türkiye''ye getirerek gümrüklü antrepoda depolamış, serbest dolaşıma sokmaksızın
    ve herhangi bir işleme tabi tutmaksızın Bulgaristan''daki bir müşteriye satmıştır. Kazanç **500.000 TL**''dir ve süresinde
    transfer edilmiştir.

    5. Yurt dışından alınıp antrepoda tutulan başka bir malı serbest dolaşıma sokarak Türkiye''deki bir alıcıya satmış ve
    **200.000 TL** kazanç elde etmiştir.

    6. Nakit değerlendirmesinden doğan **80.000 TL** faiz geliri ile döviz değerlemesinden doğan **50.000 TL** kur farkı geliri
    elde etmiştir.


    Şirketin ticari bilanço kârı **3.000.000 TL**, kanunen kabul edilmeyen giderleri **100.000 TL**''dir (yukarıdaki kalemlerin
    hepsi ticari kâra dahildir). Şirketin başka indirim, istisna veya geçmiş yıl zararı yoktur. Kurumlar vergisi oranı %25''tir.
    Yurt içi asgari kurumlar vergisi (KVK md. 32/C) uygulaması bu sorunun kapsamı dışındadır; hesaplanan kurumlar vergisinin
    asgari tutarın üzerinde olduğu kabul edilecektir.


    Ayrıca grubun diğer şirketi **Seren Hizmet A.Ş.**, 7412 sayılı Kanun kapsamında katılımcı belgesi alarak İstanbul Finans
    Merkezi Bölgesinde, 4875 sayılı Kanun kapsamında nitelikli hizmet merkezi olarak **15.10.2026**''da faaliyete başlamıştır.
    Şirket, münhasıran bu faaliyeti kapsamında yurt dışından 2026 yılında **2.500.000 TL** kazanç elde etmiş; bunun **2.000.000
    TL**''sini beyanname verme süresi içinde Türkiye''ye transfer etmiş, **500.000 TL**''sini sonradan transfer etmiştir.


    **İstenenler:**


    (a) 1 numaralı işlemden doğan kazancı ve bu işlem nedeniyle md. 10/1-i kapsamında yapılacak indirimi gerekçesiyle hesaplayınız.
    (5 puan)


    (b) 2 ve 3 numaralı işlemlerde indirimden yararlanılıp yararlanılamayacağını, yararlanılabiliyorsa tutarını belirtiniz.
    (4 puan)


    (c) 4 ve 5 numaralı işlemler bakımından indirim sonucunu açıklayınız. (4 puan)


    (d) 6 numaralı gelirlerin durumunu belirtiniz; Boğaziçi Global Ticaret A.Ş.''nin toplam indirimini, matrahını ve kurumlar
    vergisini hesaplayınız. (4 puan)


    (e) İndirim konusu yapılamayan tutarın akıbetini belirtiniz. (1 puan)


    (f) Seren Hizmet A.Ş.''nin 2026 yılı için md. 10/1-j kapsamında yararlanabileceği indirim tutarını, indirim oranını ve
    indirimden hangi hesap dönemleri arasında yararlanabileceğini belirtiniz. (4 puan)

    '
  cozum: '**(a) 1 numaralı işlem**


    Kazanç = hasılat − maliyet − giderler = 12.000.000 − 10.000.000 − 400.000 = **1.600.000 TL**. Mallar Türkiye''ye getirilmeden
    yurt dışında satıldığından md. 10/1-i kapsamındadır; ancak kazancın beyanname verilme süresi sonuna kadar Türkiye''ye
    transfer edilmeyen kısmı için indirimden yararlanılamaz (daha sonra transfer edilse dahi). Bu bölge dışındaki kurumlar
    için oran %95''tir.


    İndirim = 1.200.000 × %95 = **1.140.000 TL** (kalan 400.000 TL için indirim yok).


    **(b) 2 ve 3 numaralı işlemler**


    - **2:** Aracılık edilen mal alım satımının satıcısı da alıcısı da Türkiye''de değildir ve kazanç süresinde transfer edilmiştir
    → indirim = 600.000 × %95 = **570.000 TL**.

    - **3:** Satıcı Türkiye''de yerleşik olduğundan, aracılık faaliyetine ilişkin malların satıcısı ve alıcısının Türkiye''de
    olmaması şartı sağlanmaz → **indirim yok (0 TL)**.


    **(c) 4 ve 5 numaralı işlemler**


    - **4:** Mal Türkiye''ye getirilmiş olsa da gümrüklü antrepoda kalmış, serbest dolaşıma sokulmamış ve işleme tabi tutulmadan
    yurt dışında satılmıştır; Tebliğ''deki örneğe göre indirimden yararlanılır: 500.000 × %95 = **475.000 TL**.

    - **5:** Antrepodaki malın Türkiye''de bir alıcıya satılması veya serbest dolaşıma sokulması halinde indirimden **yararlanılamaz**
    (0 TL).


    **(d) Diğer gelirler ve vergi**


    Faiz geliri ve kur farkı geliri, indirime konu faaliyet dışındaki gelirler olduğundan **indirim kapsamında değildir**.


    Toplam indirim = 1.140.000 + 570.000 + 0 + 475.000 + 0 = **2.185.000 TL**.


    Kurum kazancı = 3.000.000 + 100.000 = 3.100.000 TL. Matrah = 3.100.000 − 2.185.000 = **915.000 TL**. Kurumlar vergisi
    = 915.000 × %25 = **228.750 TL**.


    **(e)** Diğer indirim ve istisnalar ile geçmiş yıl zararları nedeniyle indirim konusu yapılamayan tutar izleyen dönemlere
    **devredilemez**; faaliyet sonucunun zararlı olması halinde de indirim söz konusu olmaz. (Bu soruda kazanç yeterli olduğundan
    devreden tutar yoktur.)


    **(f) Nitelikli hizmet merkezi (md. 10/1-j)**


    Seren Hizmet A.Ş. İstanbul Finans Merkezi Bölgesinde katılımcı belgesiyle faaliyet gösterdiğinden oran **%100**''dür.
    Kazancın ancak süresinde transfer edilen kısmı indirime konu olur: 2.000.000 × %100 = **2.000.000 TL** (sonradan transfer
    edilen 500.000 TL için indirim yoktur). İndirim, faaliyete geçilen dönem dahil yirmi hesap dönemi uygulanır; faaliyete
    2026''da geçildiğinden **2026-2045** hesap dönemleri arasında yararlanılabilir (kıst dönem de bir hesap dönemi sayılır).

    '
