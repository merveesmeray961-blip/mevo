  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 10/1-ç
    alinti: dolayısıyla yapılan harcamalar veya bu tesislerin inşası için bu kuruluşlara yapılan her türlü bağış ve yardımlar
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
