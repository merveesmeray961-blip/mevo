  soru: 'Payları borsada işlem gören **Yaylacık Tarım A.Ş.** (Yaylacık) ve ilgili piyasa katılımcıları hakkında Kurul tarafından
    2026 yılında yürütülen inceleme ve gözetim çalışmalarında aşağıdaki tespitler yapılmıştır:


    | No | Tespit |

    |---|---|

    | 1 | Finans direktörü **(F)**, Yaylacık''ın 2025 yıllık finansal tablolarında 18.000.000 TL olarak gösterilen satış hasılatının
    6.000.000 TL''lik kısmını, hiçbir mal çıkışı bulunmayan düzmece faturalarla kayıtlara almıştır. Faturalar üçüncü kişilere
    karşı kullanılmamış, ancak tablolar bu hâliyle kamuya açıklanmıştır. (F) kasıtlı hareket etmiştir. |

    | 2 | Muhasebe müdürü **(M)**, Yaylacık''ın kanunen tutmakla yükümlü olduğu kayıtları kasıtlı olarak usulüne uygun tutmamış,
    ayrıca saklamakla yükümlü olduğu belgeleri kanuni süre dolmadan imha etmiştir. |

    | 3 | Hukuk müşaviri **(H)**, Kurulun yürüttüğü inceleme kapsamında Yaylacık''tan istenen belgelerin içeriğini, inceleme
    sürerken bir pay sahibine anlatmıştır. |

    | 4 | **Pınar Menkul Değerler A.Ş.** (Pınar, aracı kurum) dealer''ı **(D)**, müşterisi **(P)**''nin Yaylacık paylarında
    fiyatı yapay biçimde yükseltmeyi amaçlayan, gerçekleşme niyeti taşımayan emirler verip iptal ettiğini görmüş, Pınar bu
    durumu Kurula bildirmiştir. (D) ertesi gün (P)''ye "Kurula bildirim yaptık" demiştir. |

    | 5 | Sosyal medyada geniş takipçisi olan **(S)** hesabı, hiçbir dayanağı bulunmayan "Yaylacık devletten dev bir ihale
    aldı" yönündeki paylaşımlarıyla pay fiyatını etkilemeye çalışmaktadır. Kurul bu paylaşımlar bakımından suç işlendiğine
    dair makul şüphe bulunduğu kanaatindedir. |

    | 6 | **Zirve Yatırım Menkul Değerler Ltd. Şti.**, Kurulun izni bulunmadığı hâlde, ticaret unvanında ve internet sitesindeki
    ilan ve reklamlarında sermaye piyasasında faaliyette bulunduğu intibaını uyandıran "Menkul Değerler" ibaresini kullanarak
    müşteri hesabı açmakta ve emir iletmektedir. |


    **İstenenler:**


    (a) 1, 2 ve 3 numaralı tespitlerdeki fiillerin 6362 sayılı Kanunun hangi madde, fıkra ve bentlerine girdiğini, öngörülen
    yaptırımları (hapis ve adli para cezası sınırları ya da başka bir Kanuna yapılan atıf) belirtiniz. 1 numaralı tespit bakımından
    gerçeğe uygun hasılat tutarını ve gösterilen hasılatın yüzde kaçının gerçek dışı olduğunu hesaplayınız. (9 puan)


    (b) 4 numaralı tespitte Pınar''ın bildirim yükümlülüğünü ve (D)''nin davranışını Kanunun 102 nci maddesi çerçevesinde
    değerlendiriniz. (5 puan)


    (c) Kanunun 101 inci maddesindeki tedbirlerin ve internet içeriklerine ilişkin kararın hangi tespitler bakımından uygulanabileceğini
    belirtiniz; uygulanamayan tespitlerde hangi hükümlerin gündeme geleceğini açıklayınız. (6 puan)


    (d) 1, 2 ve 3 numaralı tespitler bakımından soruşturmanın nasıl başlayacağını, Kurulun sürecteki konumunu ve yargılamaya
    yetkili mahkemeyi açıklayınız. (5 puan)

    '
  cozum: '**(a) Fiillerin nitelendirilmesi ve yaptırımlar**


    | Tespit | Hüküm | Yaptırım |

    |---|---|---|

    | 1 – Düzmece faturalarla hasılatın şişirilmesi | SPKn md. 112/2 (a) "finansal tablo ve raporları gerçeği yansıtmayan
    şekilde düzenleyenler" ve (c) "kayıtlarda her türlü muhasebe hilesi yapanlar" | Kasıtlı olarak işleyenler **5237 sayılı
    Kanunun ilgili hükümlerine göre** cezalandırılır; SPKn bu bentler için kendi hapis/adli para sınırını göstermez, Türk
    Ceza Kanununa gönderme yapar. Fiil ayrıca özel belgede sahtecilik suçunu da oluşturuyorsa (düzmece fatura), bu suçtan
    cezaya hükmedebilmek için **sahte belgenin kullanılmış olması şartı aranmaz** (md. 112/2 son cümle); dolayısıyla faturaların
    üçüncü kişilere karşı kullanılmamış olması 112/2 kapsamındaki fiili cezasız bırakmaz. |

    | 2 – Kayıtların usulüne uygun tutulmaması ve belgelerin süresinden önce imhası | SPKn md. 112/1 (a) (kanunen tutmakla
    yükümlü olunan defter ve kayıtları usulüne uygun tutmamak) ve (b) (saklamakla yükümlü olunan defter ve belgeleri kanuni
    süresince saklamamak) | Kasıtlı olarak işleyenlere **altı aydan iki yıla kadar hapis ve beş bin güne kadar adli para cezası**
    |

    | 3 – İnceleme kapsamında istenen belgelere ilişkin bilgilerin açıklanması | SPKn md. 113 (sır saklama yükümlülüğü): Kurul
    tarafından icra edilen inceleme veya denetim faaliyeti kapsamında istenen bilgi veya belgelere ilişkin olarak başkalarına
    açıklamada bulunmak | **Bir yıldan üç yıla kadar hapis ve beş bin güne kadar adli para cezası** |


    Hasılat hesabı (1 numaralı tespit): gerçeğe uygun hasılat = 18.000.000 − 6.000.000 = **12.000.000 TL**. Gerçek dışı kısım,
    gösterilen hasılatın 6.000.000 / 18.000.000 = **%33,33**''üdür (gerçek hasılata göre ise %50''dir).


    **(b) Bildirim yükümlülüğü (md. 102)**


    - Pınar bir aracı kurumdur; aracı kurumlar yatırım kuruluşu olup (md. 3/1-v) md. 102/1 uyarınca bir işlemin 106 ncı ve
    107 nci maddelerdeki suçları (bilgi suistimali, piyasa dolandırıcılığı) teşkil ettiğine dair **herhangi bir bilgi veya
    şüpheyi gerektirecek bir husus** bulunması hâlinde Kurula bildirimde bulunmakla yükümlüdür. Suçun kesin olarak tespit
    edilmiş olması aranmaz; (P)''nin gerçekleşme niyeti taşımayan emirleri piyasa dolandırıcılığı şüphesi doğurduğundan Pınar''ın
    bildirimi yerindedir.

    - Md. 102/2 uyarınca bildirimde bulunanlar, bu madde çerçevesinde yapılan bildirimler ve bildirimde bulunulanlar hakkında,
    **mahkeme, savcılık ve Mali Suçları Araştırma Kurulu Başkanlığı dışında**, işleme taraf olanlar dâhil üçüncü kişilere
    ve kurum ve kuruluşlara bilgi veremez. (P) işleme taraf olan kişidir; dolayısıyla (D)''nin (P)''ye bildirim yapıldığını
    söylemesi bu yasağa **aykırıdır**.


    **(c) Tedbirler (md. 101) ve internet içeriği**


    - Md. 101/1, Kurula, **104 üncü, 106 ncı ve 107 nci maddelerde sayılan fiilleri** işlediğine dair makul şüphe bulunan
    kişiler ve ilgili sermaye piyasası araçlarına ilişkin olarak tedbir alma yetkisi verir (ör. borsada geçici veya sürekli
    işlem yasağı (a), kredili alım/açığa satış/ödünç işlemlerinde sınırlama (c), işlem veya pozisyon limiti (f)).

    - **4 numaralı tespit** (md. 107/1 şüphesi) ve **5 numaralı tespit** (md. 107/2 şüphesi) bakımından md. 101/1 tedbirleri
    uygulanabilir. Ayrıca md. 101/3 uyarınca bu maddelere göre yürütülen inceleme ve denetimler kapsamında, Kurulca internet
    aracılığıyla yapılan yayınlarla ilgili olarak **içeriğin çıkarılmasına ve/veya erişimin engellenmesine** karar verilebilir;
    karar uygulanmak üzere **Erişim Sağlayıcıları Birliğine gönderilir** (5 numaralı tespitteki paylaşımlar için).

    - **1, 2 ve 3 numaralı tespitler** md. 112 ve 113 kapsamındadır; bu maddeler md. 101/1''de sayılan maddeler arasında yer
    almadığından md. 101 tedbirlerine konu olamaz.

    - **6 numaralı tespit** izinsiz faaliyettir (md. 109/2); md. 109 da md. 101''in sayma listesinde yoktur. Bu hâlde md.
    100 gündeme gelir (izinsiz faaliyette bulunan şirketin ticaret unvanında ve ilan ve reklamlarında faaliyette bulundukları
    intibaını uyandıran kelime veya ibare kullanması): sorumlular hakkında cezai kovuşturma yapılmakla birlikte, gecikmesinde
    sakınca bulunan hâllerde ilan ve reklamlar durdurulabilir, kanuna aykırı belgeler ve ilanlar toplatılabilir, Kurulun talebi
    üzerine ilgili yer en büyük mülki amirce geçici olarak kapatılabilir. Ayrıca md. 115/5 gereği 5651 sayılı Kanunun 8 inci
    maddesi md. 109''daki suçlar bakımından da uygulanır.


    **(d) Soruşturma ve yargılama usulü (md. 115, 116)**


    - Bu Kanunda tanımlanan veya atıfta bulunulan suçlardan (112 ve 113 dâhil) dolayı soruşturma yapılması, **Kurulun Cumhuriyet
    başsavcılığına yazılı başvurusuna bağlıdır; bu başvuru muhakeme şartı niteliğindedir** (md. 115/1).

    - Soruşturmada Cumhuriyet savcısı **Kurul meslek personelinden yararlanabilir**; şüpheli veya tanık ifadesi alınırken
    Kurul meslek personelinin hazır bulunması sağlanabilir (md. 115/3).

    - Başvuru üzerine kamu davası açılırsa iddianamenin kabulüyle birlikte bir örneği Kurula tebliğ edilir ve **Kurul aynı
    zamanda katılan sıfatını kazanır** (md. 115/2). Kovuşturmaya yer olmadığı kararı verilirse Kurul bu karara karşı **itiraza
    yetkilidir** (md. 115/4).

    - Yargılamaya, **Hâkimler ve Savcılar Yüksek Kurulunun ihtisas mahkemesi olarak görevlendireceği asliye ceza mahkemeleri**
    yetkilidir (md. 116).

    '
