- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: SUC
  kazanimlar:
  - idari para cezası gerektiren fiiller ve ceza miktarının belirlenmesi
  - pay alım teklifi zorunluluğuna aykırılık
  - idari para cezalarının uygulanması (savunma, birden çok kabahat, dağılım, yargı yolu)
  - örtülü kazanç aktarımı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Payları borsada işlem gören **Mercan Madencilik A.Ş.** (Mercan) hakkında Kurulca yürütülen inceleme 2026 yılında
    tamamlanmış ve aşağıdaki tespitler yapılmıştır:


    1. **Bay (T)**, 3 Mart 2026''da Mercan''ın oy haklarının %56''sını doğrudan edinmiş, bu iktisap 4 Mart 2026''da kamuya
    açıklanmıştır. Açıklama tarihinde (T) dışındaki ortaklara ait pay sayısı 8.000.000 adet olup payların nominal değeri 1
    TL''dir. Kurulca belirlenen pay alım teklifi fiyatı pay başına 14 TL''dir. (T) pay alım teklifinde bulunmamış, Kurulun
    verdiği ek süre de sonuçsuz geçmiştir.

    2. Mercan, (T)''nin tamamına sahip olduğu **Kalender Lojistik Ltd. Şti.**''den olan 2.400.000 TL tutarındaki alacağını,
    vadesinin dolduğu 1 Ocak 2026''dan itibaren 2026 yılı boyunca takip etmemiş ve hiç faiz işletmemiştir. Benzer alacaklarda
    piyasa teamülü yıllık %30 faizdir. Kurul, Kalender''in sağladığı menfaati "alacak tutarı × yıllık piyasa faizi" olarak
    belirlemiştir.

    3. Mercan''ın yönetim kurulu başkanı **(Ç)**, Kurulun özel nitelikteki bir kararında öngörülen bildirimi yapmamıştır;
    bu durum Mercan''a zarar vermemiş, kimseye menfaat de sağlamamıştır. Genel müdür **(G)** ise Kurulun genel nitelikteki
    bir kararına aykırı bir işlem gerçekleştirmiştir; işlem Mercan''ın zararına sonuç doğurmuş, (G) ve başkası menfaat sağlamamıştır.

    4. Kurul, (T)''den savunma istemiş; savunma isteyen yazı 12 Ağustos 2026''da tebliğ edilmiştir. (T) savunma vermemiştir.
    (T), 1 numaralı tespitle ilgisiz olarak, Kurulun aynı genel kararında öngörülen bildirimi 2026 yılında üç ayrı tarihte
    yapmayarak aynı kabahati yaptırım kararı verilinceye kadar birden çok işlemiş ve bu yolla 500.000 TL menfaat sağlamıştır.
    Bu dosyalarda 2026 yılında tahsil edilen idari para cezaları toplamı 4.800.000 TL''dir.


    **İstenenler:**


    (a) 1 numaralı tespit bakımından (T)''nin pay alım teklifi yükümlülüğünün doğup doğmadığını açıklayınız; yükümlülüğe aykırılık
    hâlinde verilebilecek idari para cezasının üst sınırını hesaplayınız ve (T)''nin oy haklarının akıbetini belirtiniz. (7
    puan)


    (b) 2 numaralı tespit bakımından Kalender''in sağladığı menfaati hesaplayınız; Mercan hakkında verilebilecek en az idari
    para cezasını belirleyiniz ve Kanunun örtülü kazanç aktarımına ilişkin iade düzenlemesini açıklayınız. (6 puan)


    (c) 3 numaralı tespit bakımından (Ç), (G) ve Mercan hakkında idari para cezası verilip verilemeyeceğini; verilebiliyorsa
    parasal sınırlarını ya da sınırın belirlenme ölçütünü gerekçesiyle açıklayınız. (6 puan)


    (d) 4 numaralı tespit bakımından (T)''nin savunma hakkından feragat etmiş sayılacağı tarihi bulunuz; birden çok işlenen
    kabahat nedeniyle verilecek cezanın nasıl belirleneceğini ve alt sınırını hesaplayınız; tahsil edilen cezaların dağılımını
    ve ceza kararlarına karşı yargı yolunu açıklayınız. (6 puan)

    '
  cozum: '**(a) Pay alım teklifi (md. 26, 103/3)**


    - Halka açık ortaklıkta yönetim kontrolünü sağlayan payların veya oy haklarının iktisabı hâlinde, iktisabın kamuya açıklandığı
    tarihte pay sahibi olan diğer ortakların paylarını satın almak üzere teklif yapılması zorunludur (md. 26/1). Ortaklığın
    oy haklarının **yüzde ellisinden fazlasına** doğrudan veya dolaylı olarak sahip olunması yönetim kontrolünün elde edilmesi
    sayılır (md. 26/2). (T) %56 oy hakkı edindiğinden pay alım teklifi zorunluluğu doğmuştur.

    - Ek süre içinde de teklifte bulunmayan gerçek ve tüzel kişiler hakkında, pay alım teklifine konu payların **toplam bedeline
    kadar** idari para cezası verilir (md. 103/3). Üst sınır = 8.000.000 pay × 14 TL = **112.000.000 TL**.

    - Zorunluluğu yerine getirmeyen kişilerin sahip olduğu oy hakları Kurulca belirlenecek süre içinde yükümlülük yerine getirilmezse
    **kendiliğinden donar**; bu paylar genel kurul toplantı nisabında **dikkate alınmaz** (md. 26/6).


    **(b) Kâr aktarımına ilişkin idari para cezası (md. 103/6, 21)**


    - Halka açık ortaklığın, basiretli bir tacir olarak veya piyasa teamülleri uyarınca kârını korumak veya artırmak için
    yapması beklenen faaliyetleri (alacağını takip etmek, faiz işletmek) yapmaması yoluyla ilişkili olduğu kişinin kârının/malvarlığının
    artması sağlanmıştır; bu durum md. 21/2''ye göre örtülü kazanç aktarımı sayılır; md. 103/6, bu durumda **ilgili tüzel
    kişiye (Mercan''a)** idari para cezası verilmesini kendi başına öngören özel bir düzenlemedir.

    - Kalender''in menfaati = 2.400.000 × %30 = **720.000 TL**.

    - Md. 103/6''ya göre ceza yirmi bin TL ile iki yüz elli bin TL arasında belirlenir; ancak verilecek ceza **elde edilen
    menfaatin iki katından az olamaz**. Asgari ceza = max(20.000; 2 × 720.000) = **1.440.000 TL**.

    - Md. 21/4: Kazanç aktarımının Kurulca tespiti hâlinde Mercan, Kurulca belirlenecek süre içinde Kalender''den aktarılan
    tutarın **kanuni faizi ile birlikte iadesini talep eder**; Kalender de aktarılan tutarı kanuni faiziyle birlikte iade
    etmek zorundadır.


    **(c) Bildirimin yapılmaması ve tüzel kişi cezası (md. 103/1-2)**


    | Kişi | Sonuç | Gerekçe |

    |---|---|---|

    | (Ç) | İdari para cezası verilir: **20.000 TL – 250.000 TL** | Kurulca alınan özel nitelikteki karara aykırılık (md.
    103/1, ilk cümle). Menfaat temin edilmediğinden "menfaatin iki katı" alt sınırı işlemez. |

    | Mercan ((Ç) nedeniyle) | **Verilir.** Alt sınır md. 103/1''deki 20.000 TL; üst sınır aykırılığın ağırlığı ve etkilediği
    mağdur sayısı dikkate alınarak aykırılık tarihinden önceki son bağımsız denetimden geçmiş yıllık finansal tablolardaki
    brüt satış hasılatının %1''i ile vergi öncesi kârının %20''sinin yüksek olanıdır | (Ç) tüzel kişinin organıdır; aykırılık
    Mercan''ın zararına sonuç doğurmadığından md. 103/2 uyarınca tüzel kişi hakkında da ayrıca ceza verilir. |

    | (G) | İdari para cezası verilir: **20.000 TL – 250.000 TL** | Genel nitelikteki Kurul kararına aykırılık (md. 103/1).
    Menfaat yoktur. |

    | Mercan ((G) nedeniyle) | **Verilmez.** | Aykırılık temsilcisi olunan tüzel kişinin zararına sonuç doğurduğundan tüzel
    kişiye idari para cezası verilmez (md. 103/2, ikinci cümle). |


    **(d) Uygulama usulü (md. 105, 134)**


    - Savunma istendiğine ilişkin yazının tebliğ tarihinden itibaren **otuz gün** içinde savunma verilmezse ilgili savunma
    hakkından feragat etmiş sayılır (md. 105/1). 12 Ağustos 2026 + 30 gün = **11 Eylül 2026**.

    - Aynı kabahatin idari yaptırım kararı verilinceye kadar birden çok işlenmesi hâlinde ilgiliye **tek bir idari para cezası
    verilir ve bu ceza iki kat artırılır**; kabahatin işlenmesi suretiyle menfaat temin edilmesi hâlinde ceza bu menfaatin
    **üç katından az olamaz** (md. 105/2). Alt sınır = 3 × 500.000 = **1.500.000 TL**.

    - Tahsil edilen idari para cezalarının yüzde ellisi genel bütçeye gelir kaydedilir, yüzde ellisi YTM''ye aktarılır (md.
    105/3): 4.800.000 × %50 = **2.400.000 TL genel bütçe**, **2.400.000 TL YTM**.

    - Bu Kanun uyarınca verilen idari para cezası kararlarına karşı idari yargı yoluna başvurulabilir (md. 105/4); Kurul kararlarına
    karşı açılacak idari davalar **idare mahkemelerinde** görülür ve bu başvurular acele işlerden sayılır (md. 134).

    '
