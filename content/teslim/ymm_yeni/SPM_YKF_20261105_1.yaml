  soru: '**Kervan Yatırım Menkul Değerler A.Ş.** (Kervan), işlem aracılığı ve portföy aracılığı faaliyetleri için yetki belgesi
    bulunan bir aracı kurumdur; payları borsada işlem görmemektedir. Özsermayesi **120.000.000 TL**''dir. Kervan''ın 31 Aralık
    2025 itibarıyla ortaklık yapısı şöyledir:


    | Ortak | Sermaye payı (%) | Not |

    |---|---|---|

    | Orhun Holding A.Ş. | 30 | |

    | Hakan Demir | 22 | |

    | Ece Yıldız | 15 | |

    | Tolga Özkan | 6 | Zirve Gıda A.Ş.''nin yönetim kurulu başkanıdır |

    | Selma Özkan | 2 | Tolga Özkan''ın eşidir |

    | Zirve Gıda A.Ş. | 1 | |

    | Diğer ortaklar (her biri %10''un altında) | 24 | Cemre Kaya''nın sahip olduğu %0,5''lik pay, yönetim kuruluna üye belirleme
    imtiyazı verir |


    2026 yılında aşağıdaki pay devirleri sözleşmeye bağlanmış ve payların devri tamamlanmıştır; Kurul izni veya Kurula bildirim
    için henüz herhangi bir işlem yapılmamıştır. Hiçbir ortak, tabloda gösterilenler dışında pay edinmemiştir; "diğer ortaklar"ın
    taraf olduğu devirlerde bu ortakların payları %10 eşiğine ulaşmamış ve eşiği geçmemiştir.


    | No | Tarih | İşlem |

    |---|---|---|

