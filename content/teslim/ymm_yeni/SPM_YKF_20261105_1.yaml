  soru: '**Tuna Menkul Değerler A.Ş.** (Tuna), alım satıma aracılık ve yatırım danışmanlığı faaliyetleri için yetki belgesi
    bulunan bir aracı kurumdur. Kurul incelemesinde 2026 yılına ilişkin aşağıdaki hususlar belirlenmiştir (anılan günler arasında
    resmî tatil bulunmamaktadır).


    **I. Dışarıdan hizmet alımı.** Tuna, aşağıdaki hizmetleri sözleşme yoluyla dışarıdan almaktadır:


    | No | Hizmet | Hizmet sağlayıcı |

    |---|---|---|

    | 1 | Yatırım hizmetlerinin müşterilere pazarlanması ve satışı (müşteri ziyareti, ürün sunumu) | Yön Pazarlama Ltd. Şti.
    |

    | 2 | Tuna''nın muhasebe kayıtlarının tutulması ve finansal raporlarının düzenlenmesi | Defter Danışmanlık A.Ş. |

    | 3 | Hatırlatma aramaları, teknik destek ve yardım masası, müşteriye hesap bilgilerinin verilmesi | Hat Çağrı Merkezi
    |

    | 4 | Telefonla gelen müşteri emirlerinin alınarak Tuna''nın işlem sistemine iletilmesi | Hat Çağrı Merkezi |

    | 5 | İç kontrol sistemi kapsamındaki test ve izleme faaliyetlerinin yürütülmesi | İz Denetim A.Ş. |

    | 6 | Genel merkez binasının güvenlik, temizlik ve yemek hizmetleri ile hukuk danışmanlığı | Çeşitli firmalar |


    Hat Çağrı Merkezi bir kollektif şirkettir. Tuna ile Hat arasındaki sözleşmede Kurulun hizmetle ilgili bilgi, belge ve
    kayıtlara erişim hakkına ilişkin bir hüküm yoktur. Hizmet alımına **5 Ocak 2026 Pazartesi** günü başlanmış, Kurula bildirim
    ise **23 Ocak 2026 Cuma** günü yapılmıştır. Hat''ın çalışanı bir müşteriye hesap bakiyesini yanlış bildirmiş, müşteri
    bu nedenle zarara uğramıştır; Tuna, "hizmeti Hat verdiği için sorumluluğun Hat''a ait olduğunu" ileri sürmektedir.


    **II. Genel müdür.** Tuna''nın genel müdürü **1 Nisan 2026 Çarşamba** günü görevinden ayrılmış; ayrılma nedenleri Tuna
    ve ayrılan genel müdür tarafından Kurula ve Birliğe **8 Nisan 2026**''da bildirilmiştir. Genel müdürlüğe 1 Nisan 2026''dan
    itibaren genel müdür yardımcısı vekalet etmekte olup bu durumun **15 Aralık 2026**''ya kadar sürdürülmesi planlanmaktadır.
    Yeni genel müdür olarak 4 yıllık lisans mezunu, mali piyasalar alanında 9 yıl meslekî deneyimi bulunan Selin Doğan''ın
    atanması için gerekli belgelerle birlikte Kurula **13 Nisan 2026 Pazartesi** günü bildirim yapılmış, Kurul olumsuz görüş
    bildirmemiş, atama **17 Nisan 2026 Cuma** günü gerçekleştirilmiştir. Selin Doğan, Tuna''nın %60 ortağı olan Rüzgar Holding
    A.Ş.''de icra kurulu üyeliğini sürdürmektedir.


    **III. Faaliyet izni.** Tuna''ya **5 Mart 2024**''te verilen yatırım danışmanlığı faaliyet izni kapsamında bugüne kadar
    hiçbir faaliyette bulunulmamıştır. Tuna bu izinden kısmen feragat etmiş ve Kurul **20 Ağustos 2026**''da izni iptal etmiştir.


    **İstenenler:**


    (a) I. bölümdeki 1 ile 6 numaralı hizmetlerin her birinin dışarıdan hizmet alımına konu olup olamayacağını gerekçesiyle
    belirtiniz. (6 puan)


    (b) Hat Çağrı Merkezi ile ilgili uygulamayı hizmet sağlayıcıya, sözleşmeye, bildirim süresine (son günü bulunuz) ve sorumluluğa
    ilişkin hükümler bakımından değerlendiriniz. (6 puan)


    (c) II. bölümdeki hususları (ayrılma bildirimi, vekalet süresi, yeni genel müdürün nitelikleri ve atama süreci, başka
    görev) Tebliğ hükümleri bakımından değerlendiriniz. (8 puan)


    (d) III. bölüm bakımından, Kurulun 5 Mart 2026 tarihinden sonra feragat olmasa dahi izni iptal edip edemeyeceğini ve Tuna''nın
    bu izin için 15 Mart 2028 veya 1 Eylül 2028 tarihinde yeniden başvurup başvuramayacağını açıklayınız. (5 puan)

    '
  cozum: '**(a) Dışarıdan hizmet alımına konu olabilecek hizmetler** (III-39.1 md. 49)


    Aracı kurumlar, sermaye piyasası mevzuatından kaynaklanan yükümlülüklerinin sağlanmasına yardımcı nitelikteki hizmetleri
    sözleşmeyle dışarıdan alabilir (md. 49/1). Şu faaliyetler dışarıdan hizmet alımına konu olamaz: münhasıran yönetim kurulunca
    icra edilmesi gerekenler; Kuruldan izin alınmasını gerektiren yatırım hizmet ve faaliyetleri ile yan hizmetlerin sunulması
    ve bunların pazarlanmasına yönelik faaliyetler; işlemlerin muhasebeleştirilmesi ile finansal raporların düzenlenmesi;
    iç denetim sistemi kapsamındaki faaliyetler (md. 49/2).


    | No | Değerlendirme | Sonuç |

    |---|---|---|

    | 1 | Yatırım hizmetlerinin pazarlanmasına yönelik faaliyetler (md. 49/2-b) | **Alınamaz** |

    | 2 | Muhasebeleştirme ve finansal rapor düzenleme (md. 49/2-c) | **Alınamaz** |

    | 3 | Hatırlatma aramaları, teknik destek ve yardım masası, hesap bilgisi verilmesi çağrı merkezi hizmeti kapsamındadır
    (md. 49/5) | **Alınabilir** |

    | 4 | Çağrı merkezi hizmeti "emir iletimi dışında" müşteri taleplerinin aktarılmasıyla sınırlıdır; emir iletimi alınamaz
    (md. 49/5); ayrıca emirlerin alınıp iletilmesi izin gerektiren bir yatırım hizmetidir (md. 49/2-b) | **Alınamaz** |

    | 5 | İç denetim sistemi (iç kontrol, teftiş, risk yönetimi) kapsamındaki faaliyetler (md. 49/2-ç; md. 10/1-ç) | **Alınamaz**
    |

    | 6 | Güvenlik, yemek, temizlik, avukatlık ve hukuk danışmanlığı hizmetleri Tebliğin dışarıdan hizmet alımı kapsamında
    yer almaz (md. 49/3) | Alınabilir; dışarıdan hizmet alımı rejimine (sözleşme asgari unsurları, Kurula bildirim vb.) **tabi
    değildir** |


    **(b) Hat Çağrı Merkezi**


    - **Hizmet sağlayıcı:** Hizmet sağlayıcı kuruluşun sermaye şirketi şeklinde kurulmuş olması gerekir (md. 53/1-a); kollektif
    şirket sermaye şirketi değildir → **aykırı**.

    - **Sözleşme:** Sözleşmede Kurulun, sözleşme kapsamında sunulan hizmetle ilgili hizmet sağlayıcı bünyesindeki her türlü
    bilgi, belge ve kayda erişim hakkı bulunmalıdır (md. 52/1-b); bu hüküm yoktur → **eksik/aykırı**.

    - **Bildirim:** Hizmet alınmaya başlama tarihini takip eden 10 iş günü içinde Kurula bildirim yapılır (md. 54/1). 5 Ocak
    2026 Pazartesi''den sonra 10 iş günü: 6-9 Ocak (4), 12-16 Ocak (9), 19 Ocak (10) → son gün **19 Ocak 2026 Pazartesi**;
    23 Ocak 2026''daki bildirim **geç**tir.

    - **Sorumluluk:** Dışarıdan hizmet alımı aracı kurumun mevzuattan kaynaklanan sorumluluklarını ortadan kaldırmaz; hizmet
    sağlayıcının sunduğu hizmetle ilgili olarak müşteriyle kurulan ilişkilerden doğan hukuki sorumluluk aracı kuruma aittir
    (md. 50/6). Tuna''nın savunması **geçersizdir**.


    **(c) Genel müdür** (md. 14)


    - **Ayrılma bildirimi:** Görevden ayrılan genel müdürün ayrılma nedenleri, ilgili aracı kurum ve ayrılan personel tarafından
    **3 iş günü** içinde Kurula ve Birliğe bildirilir (md. 14/5). 1 Nisan 2026 Çarşamba + 3 iş günü (2 Nisan Perşembe, 3 Nisan
    Cuma, 6 Nisan Pazartesi) = **6 Nisan 2026**; 8 Nisan tarihli bildirim **geçtir**.

    - **Vekalet:** Genel müdürlük görevine **6 aydan fazla** vekalet edilemez (md. 14/3). 1 Nisan - 15 Aralık 2026 yaklaşık
    8,5 aydır → planlanan uygulama **aykırıdır**; vekalet en fazla 6 ay (Ekim 2026 başı) sürebilir.

    - **Nitelik:** Genel müdürün mali piyasalar veya işletmecilik alanında en az 7 yıllık meslekî deneyimi bulunmalıdır (md.
    14/1); Selin Doğan''ın 9 yıllık deneyimi **yeterlidir**. Yöneticiler için 4 yıllık lisans şartı da (md. 13/3) sağlanmaktadır.

    - **Atama süreci:** Atanacak kişi belgelerle Kurula bildirilir; **bildirimden itibaren 7 iş günü içinde Kurulca olumsuz
    görüş bildirilmemesi durumunda** atama yapılabilir (md. 14/4). 13 Nisan 2026 Pazartesi + 7 iş günü (14-17 Nisan: 4; 20-22
    Nisan: 7) = **22 Nisan 2026** (süre, bildirim gününü izleyen günden başlayarak hesaplanmıştır); 17 Nisan''daki atama,
    olumsuz görüş bildirilmeksizin 7 iş günlük sürenin dolmasından önce yapıldığından **aykırıdır**. Atamaya ilişkin ayrıca
    10 iş günü içinde Birliğe bildirim yapılması gerekir (md. 14/4).

    - **Başka görev:** Genel müdürün münhasıran bu görev için istihdam edilmiş olması zorunludur; aracı kurumun yönetim veya
    sermaye ilişkisinde bulunduğu kuruluşlarda yalnızca **icrai nitelikte olmamak** ve görevin ifasında zafiyete düşülmemesi
    kaydıyla yönetim kurulu üyeliği gibi görevler alabilir (md. 14/2). Rüzgar Holding''deki icra kurulu üyeliği icrai nitelikte
    olduğundan **aykırıdır**.


    **(d) Faaliyet izninin iptali ve yeniden başvuru**


    - Kurul, faaliyet izninin verildiği tarihten itibaren **iki yıl süreyle** ilgili izin kapsamında herhangi bir faaliyette
    bulunulmaması hâlinde izni **iptal edebilir** (SPKn md. 41/1-a). İzin 5 Mart 2024''te verildiğinden iki yıllık süre 5
    Mart 2026''da dolmuştur; Kurulun iptal yetkisi doğmuştur (iptal zorunlu değil, Kurulun takdirindedir).

    - Faaliyet izninden kısmen feragat edilmesi hâlinde Kurul ilgili izni iptal eder (md. 58/1); kısmen feragat eden aracı
    kurum, **iptale ilişkin Kurul kararını izleyen 2 yıl içinde** ilgili faaliyet izni için yeniden başvuramaz (md. 58/2).
    Karar tarihi 20 Ağustos 2026 olduğundan iki yıllık süre 2028 Ağustos''unda dolar: **15 Mart 2028''de başvuru yapılamaz**,
    **1 Eylül 2028''de başvuru yapılabilir**.

    '
