  sinav: ymm
  ders: SPM
  konu: YKF
  kazanimlar:
  - müşteri varlıklarının korunması (ayrı izleme, müşteri nakitleri, mutabakat)
  - yatırımcı tazmin merkezi ve tazminin kapsamı
  zorluk: 3
  puan: 25
  sure_dk: 32
  soru: '**Çınar Yatırım Menkul Değerler A.Ş.** (Çınar), portföy aracılığı ve genel saklama hizmeti yapmaya yetkili bir aracı
    kurumdur. Kurum nezdinde 2026 yılında yapılan incelemede aşağıdaki hususlar belirlenmiştir (anılan günler arasında resmî
    tatil bulunmamaktadır):


    1. Çınar, müşteri nakitleri için Kıyı Bankası A.Ş.''de "Çınar Menkul Müşteri Hesabı" adıyla ayrı bir hesap açtırmış; hesaptaki
    paranın müşterilere ait olduğuna ilişkin yazılı bilgiyi **12 Ocak 2026 Pazartesi** günü bankaya vermiştir. Banka bu bilgiye
    ilişkin bugüne kadar onay vermemiş, Çınar da müşteri paralarını bu hesapta tutmayı sürdürmüştür. Çınar ayrıca kendi işletme
    kredisine teminat olmak üzere bu hesap üzerinde banka lehine blokaj tesis ettirmiştir.

    2. Gün sonu itibarıyla alacak bakiyesi veren bir müşteri, nakit alacağının ödenmesini **17 Şubat 2026 Salı** günü talep
    etmiş; Çınar ödemeyi **20 Şubat 2026 Cuma** günü yapmıştır.

    3. Çınar''ın **6 Nisan 2026 Pazartesi** günü yaptığı günlük mutabakatta, Z Holding A.Ş. payları bakımından kendi kayıtları
    ile MKK kayıtları arasında 40.000 lotluk bir fark saptanmıştır. Fark, karşı kurumun takas hatasından kaynaklanmakta olup
    Çınar''ın mali durumu üzerinde önemli bir etki yaratmamaktadır. Alınan önlemlere rağmen fark **9 Nisan 2026** günü sonuna
    kadar giderilememiştir.

    4. Çınar, 2026 yılında müşterileriyle yıllık mutabakat yapmamıştır. Müşterilerden P profesyonel müşteridir ve yazılı olarak
    mutabakat yapılmamasını onaylamıştır; G genel müşteridir ve böyle bir onayı yoktur. Çınar, aylık saklama bildirimlerine
    itiraz etmeyen genel müşteri H bakımından mutabakatın sağlanmış sayılması gerektiğini ileri sürmektedir.


    Öte yandan, Kurul tarafından hakkında yatırımcıları tazmin kararı verilen **Ova Menkul Değerler A.Ş.** (Ova) bakımından
    karar **20 Mayıs 2026** günü ilan edilmiştir. Ova''dan alacaklı yatırımcılara ilişkin YTM kayıtları aşağıdadır. Bu olay
    için uygulanacak azami tazmin tutarının **350.000 TL** olduğu kabul edilecektir.


    | Yatırımcı | Durum | Ova''dan alacağı (TL) |

    |---|---|---|

    | Y1 | Bağımsız gerçek kişi; üç ayrı hesabı var: TL hesapta iade edilmeyen nakit 120.000, döviz hesabında iade edilmeyen
    nakdin TL karşılığı 150.000, menkul kıymet hesabında teslim edilmeyen sermaye piyasası araçlarının değeri 130.000 | 400.000
    |

    | Y2 | Ova''nın %6 paya sahip ortağı | 200.000 |

    | Y3 | Ova yönetim kurulu üyesinin eşi | 80.000 |

    | Y4 | Sermayesinin %30''u Ova yönetim kurulu üyesine ait olan Çelik Mobilya A.Ş. | 90.000 |

    | Y5 | Bağımsız gerçek kişi; alacağın 40.000 TL''si iade edilmeyen nakit, 60.000 TL''si Ova''dan aldığı yatırım danışmanlığına
    dayanarak yaptığı işlemlerde piyasa fiyat hareketlerinden doğan zarardır | 100.000 |

    | Y6 | Ova ile aynı grupta yer alan Ova Gayrimenkul A.Ş. | 150.000 |


    YTM, hak sahiplerini ve tazmin tutarlarını **15 Temmuz 2026** günü belirlemiştir. Y1 tazmin talebini **28 Nisan 2027**''de,
    Y5 ise **15 Haziran 2027**''de YTM''ye yazılı olarak yapmıştır.


    **İstenenler:**


    (a) 1. ve 2. maddelerdeki uygulamaları müşteri nakitlerinin korunması bakımından değerlendiriniz; banka onayı için Çınar''a
    tanınan sürenin son gününü bulunuz. (7 puan)


    (b) 3. maddedeki farkın giderilememesi karşısında Çınar''ın yükümlülüğünü (kim, kime, ne zaman bildirecek; açığı telafi
    etmek zorunda olup olmadığı) açıklayınız; fark Çınar''ın mali durumunu önemli ölçüde etkileseydi sonucun ne olacağını
    belirtiniz. 4. maddedeki P, G ve H müşterilerine ilişkin durumu değerlendiriniz. (8 puan)


    (c) Ova''nın yatırımcılarından her birinin tazmin kapsamında alabileceği tutarı gerekçesiyle belirleyiniz ve toplamı hesaplayınız.
    (6 puan)


    (d) YTM''nin ödemeleri yapması gereken en geç tarihi, zorunlu hâllerde bu sürenin ne kadar uzatılabileceğini ve Y1 ile
    Y5''in taleplerinin süresinde olup olmadığını belirtiniz. (4 puan)

    '
  cozum: '**(a) Müşteri nakitlerinin korunması**


    - Müşteri nakitleri bankalarda aracı kurumun kendi nakit varlığından ayrı, müşteriler için açılmış münferit hesapta izlenir;
    hesap açıkça aracı kurum müşterilerine ait olduğunu belirtecek şekilde tanımlanır ve amacı dışında kullanılamaz (III-37.1
    md. 66/5; SPKn md. 46/7).

    - **Blokaj:** Müşteri nakit varlıklarının saklandığı hesaplar kredi teminatı olarak gösterilemez, hesap üzerinde aracı
    kurum lehine blokaj, rehin ve benzeri takyidat tesis edilemez (md. 66/5; SPKn md. 46/7). Çınar''ın kendi işletme kredisi
    için banka lehine blokaj koydurması **aykırıdır**.

    - **Bankanın onayı:** Hesap açılırken bankaya paranın müşterilere ait olduğu yazılı bildirilir ve bankadan onay alınır;
    banka 15 iş günü içinde onay vermezse yatırım kuruluşu ilgili tutarı başka bir bankaya aktarmak zorundadır (md. 66/6).
    Süre bildirim gününü izleyen günden başlar: 12 Ocak 2026 Pazartesi + 15 iş günü = **2 Şubat 2026 Pazartesi** (13-16 Ocak:
    4; 19-23 Ocak: 9; 26-30 Ocak: 14; 2 Şubat: 15). Onay gelmediği hâlde paraların aynı bankada tutulmaya devam etmesi **aykırıdır**;
    tutar başka bankaya aktarılmalıydı.

    - **Nakit alacak talebi:** Gün sonu alacak bakiyeleri çerçeve sözleşmedeki yetkiye bağlı olarak değerlendirilebilir; ancak
    müşteri talep ettiğinde en geç 1 iş günü içinde ödenebilmesi şarttır (md. 66/4). 17 Şubat Salı talebi için son gün **18
    Şubat Çarşamba**''dır; ödemenin 20 Cuma günü yapılması 2 iş günü gecikme olup **aykırıdır**.


    **(b) Mutabakat**


    | Konu | Hüküm | Sonuç |

    |---|---|---|

    | 3. madde: fark 6 Nisan''da saptandı, 3 iş günü (7, 8, 9 Nisan) içinde giderilemedi | md. 65/4: bütün önlemlere rağmen
    3 iş günü içinde giderilemeyen uyumsuzluk, **müfettiş veya iç denetimden sorumlu olarak istihdam edilen en üst düzey personel**
    tarafından **derhal** aracı kurumun **yönetim kuruluna ve Kurula yazılı** bildirilir (bankada iç denetim komitesine bildirilir;
    Çınar aracı kurum olduğundan yönetim kurulu). | Süre 9 Nisan 2026''da dolmuştur; bu tarihten sonra derhal yazılı bildirim
    yapılmalıdır. |

    | Farkın sorumlusu karşı kurum | md. 65/3: üçüncü tarafın sorumlu olduğuna ilişkin makul gerekçe varsa açığı telafi etmek
    zorunda değildir, ancak üçüncü tarafla uyuşmazlığı çözmek için gerekli adımları atmakla yükümlüdür; ayrıca md. 65/2 uyarınca
    uyumsuzluğu gidermek için derhal gerekli önlemler alınır. | Çınar açığı telafiyle yükümlü değil, ancak uyuşmazlığı çözme
    adımlarını atmalıdır. |

    | Fark mali durumu önemli etkileseydi | md. 65/5: 3 iş günü beklenmeden, tespit edilir edilmez derhal yönetim kuruluna
    ve Kurula bilgi verilir. | 3 iş günlük süre beklenmezdi. |

    | P (profesyonel, yazılı onay var) | md. 68/2: profesyonel müşteriden yazılı onay alınmışsa yıllık mutabakat zorunlu değildir.
    | Uygundur. |

    | G (genel, onay yok) | md. 68/1: her takvim yılında en az bir kez, iç kontrolden sorumlu birim/personel tarafından müşteriyle
    mutabakat sağlanır. | Yapılmadığı için aykırıdır. |

    | H (genel, aylık bildirime itiraz yok) | md. 69/3: aylık bildirimlere itiraz edilmemesi mutabakat alındığı anlamına gelmez.
    | Mutabakat sayılmaz; aykırıdır. |


    **(c) Tazmin tutarları** (SPKn md. 84)


    - Azami tazmin tutarı, hesap sayısı, türü ve para birimine bakılmaksızın bir yatırımcının aynı kuruluştan olan taleplerinin
    tümünü kapsar (md. 84/5).

    - Yönetim kurulu üyelerinin eş ve ikinci dereceye kadar kan/kayın hısımları, %5 veya daha fazla paya sahip ortaklar, aynı
    grup şirketleri ve bu kişilerin %25 veya daha fazla paya sahip olduğu şirketler tazmin edilmez (md. 84/4-a, b, c).

    - Yatırım danışmanlığından veya piyasadaki fiyat hareketlerinden kaynaklanan zararlar tazmin kapsamında değildir (md.
    84/2).


    | Yatırımcı | Değerlendirme | Tazmin edilecek (TL) |

    |---|---|---|

    | Y1 | 120.000 + 150.000 + 130.000 = 400.000; tek yatırımcı limiti 350.000 | 350.000 |

    | Y2 | %6 paylı ortak (%5 veya daha fazla) | 0 |

    | Y3 | Yönetim kurulu üyesinin eşi | 0 |

    | Y4 | %25 veya daha fazlası yönetim kurulu üyesine ait şirket (%30) | 0 |

    | Y5 | 60.000 TL fiyat hareketi zararı kapsam dışı; iade edilmeyen nakit 40.000 | 40.000 |

    | Y6 | Aynı gruptaki şirket | 0 |

    | **Toplam** | | **390.000** |


    **(d) Süreler** (SPKn md. 85)


    - YTM, hak sahiplerini ve tutarları belirledikten sonra üç ay içinde ödemeleri yapar: 15 Temmuz 2026 + 3 ay = **15 Ekim
    2026**. Zorunlu hâllerde bu süre Kurulun onayıyla **en fazla üç ay** daha uzatılabilir: **15 Ocak 2027**.

    - Tazmin talebi hakkı, tazmin kararının ilanından itibaren bir yıl sonra zamanaşımına uğrar (md. 85/1): ilan 20 Mayıs
    2026 olduğundan son gün 20 Mayıs 2027''dir. Y1''in 28 Nisan 2027 tarihli talebi **süresindedir**; Y5''in 15 Haziran 2027
    tarihli talebi **zamanaşımına uğramıştır**, bu nedenle Y5''in 40.000 TL''lik alacağı için tazmin ödenmez.

    '
