    | M3 | (a) 3. dönem hacmi 480.000 TL < 500.000 TL, sağlanmadı; (b) 1.350.000 > 1.000.000 sağlandı; (c) 6 yıl ihtisas personeli
    (≥5 yıl) sağlandı. 2/3 | **Talebe dayalı profesyonel** (md. 32/1) |

    | M4 | (a) 2. dönemde işlem adedi 7 < 10, sağlanmadı; (b) 2.400.000 > 1.000.000 sağlandı; (c) sağlanmadı. 1/3; yüksek
    varlık tek başına yetmez | **Genel müşteri** |

    | M5 | Emeklilik yatırım fonları statüleri gereği profesyoneldir (md. 31/1-a); ancak müşteri profesyonel olarak dikkate
    alınmak istemediğini yazılı bildirmişse yatırım kuruluşu bu talebi **dikkate almak zorundadır** (md. 31/3). | Sedir bu
    talebi dikkate almak, yani M5''i profesyonel müşteri olarak dikkate almamak zorundadır |


    **(b) Risk bildirimi ve uygunluk testi**


    - **1:** Genel müşteriye çerçeve sözleşme imzalamadan önce genel riskler açıklanır, Genel Risk Bildirim Formu verilir
    ve formun okunup anlaşıldığına dair yazılı beyan alınır (md. 25/1); alım satıma aracılıkta ayrıca işleme konu aracın riskleri
    açıklanır (md. 25/2). Ayrıca alım satıma aracılık faaliyetinde **genel müşteriye uygunluk testi yapılması zorunludur**
    (md. 33/1). M2 genel müşteri olduğundan hem form verilmemesi hem uygunluk testi yapılmaması **aykırıdır**.

    - **2:** Yatırım kuruluşları alım satıma aracılıkta **yalnızca genel müşterilere** uygunluk testi yapmakla yükümlüdür
    (md. 33/1); M1 profesyonel olduğundan test yapılmaması **uygundur**.

    - **3:** Yatırım fonu katılma payları için, ürünün müşterinin kendi talebi doğrultusunda sunulması **ve** yatırım kuruluşunun
    uygunluk testi yapmakla yükümlü olmadığı hususunda müşterinin bilgilendirilmesi şartlarıyla test zorunlu değildir; bildirime
    ilişkin ispat yükü yatırım kuruluşuna aittir (md. 33/2). Bilgilendirme yapılmadığından istisna işlemez; test yapılmaması
    **aykırıdır**.


    **(c) Yerindelik testi** (III-37.1 md. 40)


    - Yerindelik testi, bireysel portföy yöneticiliği veya yatırım danışmanlığı çerçeve sözleşmesi imzalanmadan önce zorunludur
    (md. 40/1); yatırım amaçları, mali durum, bilgi ve tecrübe hakkında yazılı bilgi alınır (md. 40/2).

    - **4:** Müşteri istenen bilgileri vermezse ona hizmet sunulamaz ve yetkili kuruluş müşteriye hizmetin verilemeyeceğini
    yazılı bildirir (md. 40/6). M2 bilgi vermeyi reddettiği hâlde hizmet sunulması **aykırıdır**.

    - **5:** Profesyonel müşterilerde (b) ve (c) bentlerindeki bilgilerin alınması zorunlu değildir; ancak **talebe dayalı
    olarak profesyonel kabul edilenler hariç** (md. 40/4). M3 talebe dayalı profesyonel olduğundan mali durum ve bilgi-tecrübe
    bilgileri de alınmalıydı; **aykırıdır**.

    - **6:** M1 talebe dayalı değil, kuruluş ölçütüyle profesyoneldir; yalnızca yatırım amaçlarına ilişkin bilginin alınması
    yeterlidir, **uygundur**.


    **(d) Reklam ve ilanlar** (III-39.1 md. 41)


    - **R1:** Mevzuatın imkân verdiği haller hariç mutlak getiri ve/veya zarara karşı garanti taahhüdünde bulunulamaz (md.
    41/2); ayrıca yanıltıcı bilgilere dayalı ilan yasaktır (md. 41/1). **Aykırıdır.**

    - **R2:** "Müşteri sayısı" gibi resmî verilerle kanıtlanabilir ifadeler ancak bu yargılara ulaşmayı sağlayacak kaynaklar
    referans gösterilerek kullanılabilir (md. 41/3); kaynak yoktur. **Aykırıdır.**

    - **R3:** Yönetilen portföy büyüklüğü bilgisi kamu kurumunun (Kurul) yayınına referansla verilmiştir; kaynak olarak yalnızca
    kamu kurum ve kuruluşlarının yayınları ile mali alanda meslek örgütü niteliğindeki kuruluşların kaynakları gösterilebilir.
    **Uygundur.**

    '
