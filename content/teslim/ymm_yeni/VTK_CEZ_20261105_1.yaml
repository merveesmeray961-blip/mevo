- konu: CEZ
  kazanimlar:
  - tek fiille birden fazla verginin ziyaı
  - vergi ziyaı ve usulsüzlüğün birlikte işlenmesi
  - aynı nevi usulsüzlükler
  - en az ceza haddi
  - cezaların içtima ve tekerrürde birleştirilememesi
  zorluk: 3
  puan: 23
  sure_dk: 30
  soru: '**Olay:** **Rüzgâr Tekstil A.Ş.** nezdinde 2026 yılında yapılan incelemede aşağıdaki tespitler yapılmış ve fiiller
    2025 hesap dönemine ilişkindir. Cezalar bir kat vergi ziyaı cezası esasına göre hesaplanacaktır; tüm tespitlerde ceza
    indirim hükümleri dikkate alınmayacaktır.


    1. Şirketin gizlediği bir satış nedeniyle tek bir fiil ile KDV''de 80.000 TL ve kurumlar vergisinde 200.000 TL vergi ziyaı
    ortaya çıkmıştır.

    2. Başka bir tek fiil nedeniyle hem 40.000 TL vergi ziyaı cezası hem de 25.000 TL usulsüzlük cezası doğmuştur.

    3. Daha sonra, geçen yıl kesilen ve kesinleşen 25.000 TL''lik usulsüzlük cezasına konu olan bir fiilin aynı zamanda 40.000
    TL''lik vergi ziyaına da yol açtığı anlaşılmıştır.

    4. Şirket 2025 takvim yılında aynı nevi usulsüzlüğü üç kez yapmıştır; birincisine ait usulsüzlük cezası 12.000 TL''dir.

    5. Ayrıca, bir KDV beyannamesinde hesaplanan vergi ziyaı cezası tutarı sadece 200 TL olmuştur (damga vergisi değildir;
    en az ceza haddi 300 TL''dir).

    6. Tespit edilen sahte belge kullanma fiili hem vergi ziyaı cezasını hem de VUK md. 359''a göre suç oluşturmaktadır.


    **İstenenler:**


    (a) 1 numaralı olayda kesilecek cezaları belirtiniz. (4 puan)


    (b) 2 numaralı olayda kesilecek cezayı belirtiniz ve gerekçesini açıklayınız. (4 puan)


    (c) 3 numaralı olayda yeniden kesilecek ceza tutarını ve gerekçesini açıklayınız. (4 puan)


    (d) 4 numaralı olayda kesilecek toplam usulsüzlük cezası tutarını hesaplayınız. (5 puan)


    (e) 5 numaralı olayda ceza kesilip kesilmeyeceğini açıklayınız. (3 puan)


    (f) 6 numaralı olayda cezaların birleştirilmesi ve suç duyurusunda bulunulması bakımından durumu açıklayınız. (3 puan)

    '
  cozum: '**(a)** Cezayı istilzam eden tek bir fiil ile başka neviden birkaç vergi ziyaa uğramışsa **her vergi bakımından
    ayrı ayrı ceza** kesilir (md. 335): KDV için 80.000 TL ve kurumlar vergisi için 200.000 TL; toplam **280.000 TL** (iki
    ayrı ceza).


    **(b)** Cezayı istilzam eden tek bir fiil ile vergi ziyaı ve usulsüzlük birlikte işlenmişse bunlara ait cezalardan **sadece
    miktar itibariyle en ağırı** kesilir (md. 336/1). Vergi ziyaı cezası (40.000 TL) usulsüzlük cezasından (25.000 TL) ağır
    olduğundan **40.000 TL vergi ziyaı cezası** kesilir; usulsüzlük cezası kesilmez.


    **(c)** Usulsüzlük cezası kesilen bir fiil ile vergi ziyaına da sebebiyet verildiği sonradan anlaşılırsa, evvelce usulsüzlük
    cezası kesilmiş olması bu cezanın vergi ziyaı cezası ile **mukayesesine ve noksan kesilen cezanın ikmaline mani değildir**
    (md. 336/2). Kesilmesi gereken ceza 40.000 TL, önceden kesilen 25.000 TL olduğundan **15.000 TL** (40.000 − 25.000) ikmalen
    kesilir.


    **(d)** Md. 352''de yazılı usulsüzlüklerden aynı takvim yılı içinde aynı neviden birden fazla yapılanların her biri için
    **birincisine ait cezanın dörtte biri** kesilir (md. 337/1). Birinci: 12.000 TL; ikinci ve üçüncü: 12.000 × 1/4 = 3.000
    TL × 2 = 6.000 TL; toplam **18.000 TL**.


    **(e)** Diğer vergilerde her vergi için 300 TL''ye baliğ olmayan cezalar **kesilmez** (md. 343). Hesaplanan 200 TL''lik
    ceza en az ceza haddinin altında olduğundan ceza kesilmez.


    **(f)** Vergi ziyaı cezası, usulsüzlük cezaları ile 359. maddede ve diğer kanunlarda yazılı cezalar, içtima ve tekerrür
    hükümleri bakımından **birleştirilemez**. Bu Kanunla vergi cezasıyla cezalandırılan fiiller aynı zamanda 359. maddeye
    göre suç teşkil ettiği takdirde **vergi cezası kesilmesi söz konusu madde hükmüne göre takibat yapılmasına engel olmaz**
    (md. 340).

    '
  puanlama:
  - olcut: '1 numara: her vergi için ayrı ceza (md. 335)'
    puan: 2
  - olcut: '1 numara: 80.000 TL ve 200.000 TL cezalar; toplam 280.000 TL'
    puan: 2
  - olcut: '2 numara: yalnız miktar itibariyle en ağır cezanın kesilmesi (md. 336)'
    puan: 2
  - olcut: '2 numara: 40.000 TL vergi ziyaı cezası'
    puan: 2
  - olcut: '3 numara: önceden kesilen usulsüzlük cezasının mukayesesi ve noksan cezanın ikmali'
    puan: 2
  - olcut: '3 numara: 15.000 TL'
    puan: 2
  - olcut: '4 numara: birincisinin tam, diğerlerinin dörtte biri (md. 337)'
    puan: 3
  - olcut: '4 numara: 18.000 TL'
    puan: 2
  - olcut: '5 numara: 300 TL altı cezaların kesilmemesi'
    puan: 3
  - olcut: '6 numara: cezaların birleştirilememesi ve md. 359 takibatına engel olmaması'
    puan: 3
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 335
    alinti: Vergi ziyaı cezasında cezayı istilzam eden tek bir fiil ile başka neviden birkaç vergi ziyaa uğramış olursa her
      vergi bakımından ayrı ayrı ceza kesilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 336/1
    alinti: Cezayı istilzam eden tek bir fiil ile vergi ziyaı ve usulsüzlük birlikte işlenmiş olursa bunlara ait cezalardan
      sadece miktar itibariyle en ağırı kesilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 337/1
    alinti: aynı takvim yılı içinde aynı neviden birden fazla yapıldığı takdirde birden fazlasının herbiri için, birincisine
      ait cezanın dörtte biri kesilir
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 343
    alinti: Diğer vergilerde her vergi için 1.000.000 (300 TL) liraya baliğ olmayan cezalar kesilmez.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 340
    alinti: Bu kanunda yazılı vergi ziyaı cezası ve usulsüzlük cezaları ile 359 uncu maddede ve diğer kanunlarda yazılı cezalar;
      içtima ve tekerrür hükümleri bakımından birleştirilemez.
