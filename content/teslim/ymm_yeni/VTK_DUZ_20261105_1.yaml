  soru: '**Olay:** Vergi dairesi, 2026 yılında **Güneş Kafe** ve çevresindeki işyerlerinde yoklama yapmaktadır.


    1. Yoklamayı bir vergi dairesi müdürü, bir yoklama memuru ve yetkili makamlarca görevlendirilen bir kişi birlikte yürütmektedir;
    bir de işletmenin muhasebecisi olan bir mali müşavir yoklamaya katılmak istemektedir.

    2. Yoklama ekibi sabah saat 09.00''da işyerlerine girmiştir. Memurlar yoklamayı önceden haber vermemişlerdir ve hüviyet
    ibraz etmeden işlem yapmaya başlamışlardır.

    3. Güneş Kafe''nin sahibi yoklama fişini imzalamaktan çekinmiştir.

    4. Vergi dairesi, belirli bir bölgede çok sayıda işyerinin yoklaması için münferit fiş yerine yoklama cetveli kullanmak
    istemektedir; bir işyerinde ihtilaflı bir olay çıkmıştır.


    **İstenenler:**


    (a) Yoklamanın kimler tarafından yapılabileceğini belirtiniz; mali müşavirin yoklama yapıp yapamayacağını açıklayınız.
    (4 puan)


    (b) 2 numaralı olayda yoklamanın önceden bildirilmesi zorunluluğunu ve hüviyet ibraz kuralını değerlendiriniz. (6 puan)


    (c) 3 numaralı olayda yoklama fişinin nasıl düzenleneceğini ve imzadan çekinilmesi halinde izlenecek yolu açıklayınız.
    (6 puan)


    (d) 4 numaralı olayda yoklama cetveli kullanılması halinde ihtilaflı olayın nasıl tespit edileceğini belirtiniz. (4 puan)

    '
  cozum: '**(a)** Yoklama; vergi dairesi müdürleri, yoklama memurları, yetkili makamlarca yoklama işi ile görevlendirilenler,
    vergi incelemesine yetkili olanlar ve gelir uzmanları tarafından yapılır (md. 128). Muhasebeci mali müşavir bu sayılanlar
    arasında yer almadığından yoklama yapamaz.


    **(b)** Yoklama her zaman yapılabilir ve yoklamanın ne zaman yapılacağı ilgiliye haber verilmez (md. 130); önceden bildirme
    zorunluluğu yoktur. Ancak yoklama yapanların elinde yoklama yetkilerini gösteren fotoğraflı resmî bir vesika bulunur ve
    bunu kendilerinden sorulmasa bile nezdinde yoklama yapılan kimseye gösterirler (md. 129); olayda hüviyet ibraz edilmemesi
    **kanuna aykırıdır**.


    **(c)** Yoklama neticeleri tutanak mahiyetinde olan **yoklama fişine** geçirilir; fiş yoklama yerinde **iki nüsha** tanzim
    olunarak tarihlenir ve bulunursa nezdinde yoklama yapılan veya yetkili adamına imza ettirilir. İmzadan çekinirse keyfiyet
    fişe yazılır ve fiş **polis, jandarma, muhtar veya ihtiyar meclisi üyelerinden birine** imzalatılır (md. 131).


    **(d)** Vergi uygulamalarının gerektirdiği hallerde münferit fiş yerine yoklama cetvellerinin kullanılması ve neticelerin
    toplu olarak bu cetvellerde gösterilmesi caizdir; cetvelin kullanılacağı halleri Maliye Bakanlığı belirler. Yoklama cetveli
    kullanılan hallerde **ihtilaflı olaylar yoklama fişi mahiyetinde ayrı bir tutanakla** tespit olunur (md. 133).

    '
