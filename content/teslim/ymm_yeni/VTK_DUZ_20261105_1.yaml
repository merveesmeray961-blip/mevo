    ile tespit ve tevsik olunabilir; **ilgililerin itiraz ve mülahazaları varsa bunlar da tutanağa geçirilir** ve tutanağın
    **bir nüshasının** mükellefe veya nezdinde inceleme yapılan kimseye bırakılması **mecburidir** (md. 141). İlgililer tutanakları
    imzalamaktan çekindikleri takdirde tutanakta bahis konusu edilen olaylar ve hesap durumlarını ihtiva eden defter veya
    vesikalar, nezdinde inceleme yapılandan **rızasına bakılmaksızın alınır** ve inceleme neticesinde tarh edilen vergiler
    ve kesilen cezalar **kesinleşinceye kadar geri verilmez**. İlgililer her zaman bu tutanakları imzalayarak defter ve vesikaları
    **geri alabilirler**; ancak bu defterlerin **suç delili olmaması** şarttır.


    **(b)** Defter ve vesikaların muhafaza altına alınmış olması, süresi gelen vergi beyannamelerinin verilmesi ödevini **kaldırmaz**;
    mükellef beyannamesini tanzim için gerekli bilgileri defter ve vesikalardan çıkarabilir (md. 144).


    **(c)** Mükellef, ilgili memurun huzuriyle, bu defterler ve vesikalar üzerinde incelemeler yapmaya ve bunlardan **suret
    ve kayıtlar çıkarmaya yetkilidir** (md. 144/3). İstek hukuka uygundur.


    **(d)** Arama neticesinde bulunan defter ve vesikaların muhafaza altına alınması sebebiyle 219. madde gereğince yapılamayan
    kayıtlar, defterlerin **geri verilmesinden sonra** idare ile mükellef arasında kararlaştırılan münasip bir süre içinde
