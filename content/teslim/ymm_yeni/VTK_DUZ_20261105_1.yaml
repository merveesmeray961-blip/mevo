    olacağı tespit edilmiştir (tahakkuktan vazgeçme sınırı 350 TL''dir).

    4. Bir çiftçi, 2026 yılı dolu afeti nedeniyle mahsullerinin yarısını kaybetmiştir.


    **İstenenler:**


    (a) 1 numaralı olayda zamanaşımı üzerindeki etkiyi açıklayınız ve zamanaşımının yeni bitiş tarihini bulunuz. (8 puan)


