  soru: '**Olay:** **Tuna Boya A.Ş.**nin 2022 – 2025 hesap dönemlerine ilişkin vergi incelemesi 2026 yılında yapılmaktadır.


    1. İnceleme elemanı, önceden haber vermeksizin şirketin iş yerine gelmiştir.

    2. Şirketin 2022 hesap dönemi daha önce incelenmiş ve sonuç alınmıştır. İnceleme elemanı 2022 dönemini yeniden incelemek
    istemektedir.

    3. İnceleme elemanı, şirketten kanuni defter ve belgelerini yazılı olarak istemiş ve belirlenen günde getirilmesini istemiştir.
    Şirket belgeleri mazeretsiz getirmemiştir.

    4. Şirket yetkilisi, belgelerini getirememesi konusunda, bir sağlık sorunu nedeniyle haklı bir mazeret bildirmiştir.

    5. Şirket, incelemenin yalnızca iş yerinde yapılması gerektiğini ileri sürmektedir.


    **İstenenler:**


    (a) 1 numaralı olayda incelemenin önceden bildirilmesi gerekip gerekmediğini ve incelemenin hangi döneme kadar yapılabileceğini
    belirtiniz. (6 puan)


    (b) 2 numaralı olayda yeniden inceleme yapılıp yapılamayacağını gerekçesiyle açıklayınız. (4 puan)


    (c) 3 ve 4 numaralı olaylarda belgelerin ibrazı bakımından hukuki sonucu ayrı ayrı belirtiniz. (7 puan)


    (d) 5 numaralı iddiayı inceleme yerine ilişkin hükümlere göre değerlendiriniz. (5 puan)

    '
  cozum: '**(a)** Vergi incelemesinin ne zaman yapılacağının evvelden haber verilmesi **mecburi değildir**. İnceleme, neticesi
    alınmamış hesap dönemi de dahil olmak üzere **tarh zamanaşımı süresi sonuna kadar** her zaman yapılabilir (md. 138).


    **(b)** Evvelce inceleme yapılmış veya matrahın re''sen takdir edilmiş olması **yeniden inceleme yapılmasına ve gerekirse
    tarhiyatın ikmaline mani değildir** (md. 138/3). 2022 dönemi yeniden incelenebilir.


    **(c)** İstenilen defter veya vesikaları belli edilen zamanda **mazeretsiz** olarak getirmeyenler bunları **ibraz etmemiş
    sayılırlar** (3 numara). **Haklı bir mazeret** gösterenlere defter ve vesikalarını ibraz etmesi için **münasip bir mühlet**
    verilir (4 numara) (md. 139).


    **(d)** Vergi incelemeleri esas itibariyle **dairede** yapılır; incelemeye tabi olanın lüzumlu defter ve vesikalarını
    daireye getirmesi kendisinden yazılı olarak istenir. İncelemenin dairede yapılması, incelemeye tabi olanın **iş yerinde
    tespit yapılmasına ve çalışmalarda bulunulmasına mani değildir** (md. 139). Şirketin iddiası kanuna uygun değildir; inceleme
    esas itibariyle dairede yapılır.

    '
