  - sulh yargıcı kararı
  - aramada bulunan defter ve vesikaların incelenmesi
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Vergi müfettişi, **Kuzey Elektronik Ltd. Şti.**nin sahte fatura düzenlediğine dair bir ihbar almıştır ve
    yapılan incelemede şirketin vergi kaçırdığına delalet eden emareler bulunmuştur.


    1. Müfettiş, şirketin merkezinde arama yapmak istemektedir; kendisi kararı verme yetkisini kullanabileceğini düşünmektedir.

    2. Şirketin yanı sıra, kaçakçılıkla ilgisi görülen ortağın evinde de arama yapılması gündeme gelmiştir.

    3. Aramada bulunan ve incelemeye lüzum görülen defter ve belgeler elde edilmiştir; fakat zaman darlığı nedeniyle müfredatlı
    tutanak düzenlenememiştir.

    4. Alınan defter ve vesikalar üzerindeki incelemelerin haklı sebeplerle üç ayda bitirilmesi mümkün olmamıştır.


    **İstenenler:**


    (a) 1 numaralı olayda aramanın hangi koşullarla yapılabileceğini belirtiniz; kararı kimin vereceğini açıklayınız. (7 puan)


    (b) 2 numaralı olayda ortağın evinde arama yapılıp yapılamayacağını belirtiniz. (4 puan)


    (c) 3 numaralı olayda defter ve vesikaların nasıl muhafaza edileceğini açıklayınız ve müfredatlı tespitin ne anlama geldiğini
    belirtiniz. (6 puan)


    (d) 4 numaralı olayda defter ve vesikaların iadesi ve sürenin uzatılması hakkında hükmü açıklayınız. (5 puan)

    '
  cozum: '**(a)** İhbar veya yapılan incelemeler dolayısıyla bir mükellefin vergi kaçırdığına delalet eden emareler bulunursa
    arama yapılabilir. Aramanın yapılabilmesi için (1) vergi incelemesi yapmaya yetkili olanların buna lüzum göstermesi ve
    gerekçeli bir yazı ile arama kararı vermeye yetkili **sulh yargıcından** bunu istemesi, (2) sulh yargıcının istenilen
    yerlerde arama yapılmasına karar vermesi **şarttır** (md. 142). Karar müfettişçe verilemez; **sulh yargıcı** verir.


    **(b)** Bu mükellef veya **kaçakçılıkla ilgisi görülen diğer şahıslar nezdinde ve bunların üzerinde** arama yapılabilir
    (md. 142/1); dolayısıyla sulh yargıcı kararıyla ortağın evinde de arama yapılabilir.


    **(c)** Aramada bulunan ve incelemesine lüzum görülen defter ve vesikalar **müfredatlı olarak bir tutanakla** tespit olunur;
    vesikaların dosya ve dosya içinde sayı itibariyle tespit edilmesi müfredatlı tespit demektir. Zaman müsaadesizliği ve
    sair sebeplerle tutanak tanzimi mümkün olmazsa, defter ve vesikalar mükellef nezdinde **emin bir yere** konur veya **kablar
    içinde daireye nakledilir** (md. 143).


    **(d)** Arama neticesinde alınan defter ve vesikalar üzerindeki incelemeler **en geç üç ay** içinde bitirilerek sahibine
    bir tutanakla geri verilir; incelemelerin haklı sebeplere binaen üç ay içinde bitirilmesine imkân olmayan hallerde **sulh
    yargıcının vereceği karar** üzerine bu süre uzatılabilir (md. 145).

    '
