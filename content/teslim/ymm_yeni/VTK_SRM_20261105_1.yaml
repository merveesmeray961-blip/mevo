- konu: SRM
  kazanimlar:
  - vergi ehliyeti
  - vergiyi doğuran olayın yasak olması
  - vergi kesintisi yapanın sorumluluğu ve rücu hakkı
  - mal ve hizmet alımında müteselsil sorumluluk
  - vergi numarası
  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Olay:** 2026 yılında vergi dairesi aşağıdaki olaylarla karşılaşmıştır:


    1. **Emir Aksu** 16 yaşındayken babasından kalan işletmeyi devralmış ve işletme adına vergi borcu doğmuştur; Emir kanuni
    ehliyete sahip değildir.

    2. **Kerem Taş**, kanunen yasak olan bir faaliyetten kazanç elde etmiş ve vergiyi doğuran olay gerçekleşmiştir; Kerem
    "faaliyetim yasak olduğu için vergi ödemem" demektedir.

    3. **Delta İnşaat A.Ş.**, bir hizmet alımında 60.000 TL vergi kesintisi yapması gerekirken yapmamış ve vergi dairesine
    yatırmamıştır. Şirketin hizmeti aldığı **Işık Hizmet Ltd. Şti.** ile, Delta''nın hâkim ortağı olan **Bay Rıfat**''ın sermaye
    ve yönetim yoluyla ilişkisi bulunmaktadır.

    4. **Nihai tüketici Bayan Aylin**, bir mağazadan ürün alırken vergi tevkifatı yapılmamıştır.

    5. **Mavi Matbaa A.Ş.** çalışanlarına yaptığı ödemelerden 25.000 TL gelir vergisi stopajını yapıp ödemiş, ancak daha sonra
    bu vergiyi çalışanlardan tahsil etmek istemektedir.


    **İstenenler:**


    (a) 1 numaralı olayda Emir''in mükellefiyetinin doğup doğmadığını ve ödevlerin kim tarafından yerine getirileceğini belirtiniz.
    (4 puan)


    (b) 2 numaralı olayda Kerem''in iddiasını değerlendiriniz. (4 puan)


    (c) 3 numaralı olayda verginin ödenmesinden kimlerin müteselsilen sorumlu olabileceğini belirtiniz. (5 puan)


    (d) 4 numaralı olayda müteselsil sorumluluk kuralının uygulanıp uygulanmayacağını belirtiniz. (3 puan)


    (e) 5 numaralı olayda şirketin çalışanlara rücu hakkı bulunup bulunmadığını belirtiniz; vergi numarasının verilmesi ve
    kullanılması konusundaki yetkili merciyi belirtiniz. (4 puan)

    '
  cozum: '**(a)** Mükellefiyet ve vergi sorumluluğu için **kanuni ehliyet şart değildir** (md. 9); Emir''in mükellefiyeti
    doğmuştur. Küçüklerin ve kısıtlıların mükellef olmaları halinde bunlara düşen ödevler **kanuni temsilcileri** tarafından
    yerine getirilir (md. 10).


    **(b)** Vergiyi doğuran olayın kanunlarla **yasak edilmiş bulunması mükellefiyeti ve vergi sorumluluğunu kaldırmaz** (md.
    9/2). Kerem''in iddiası yerinde değildir; vergi ödemek zorundadır.


    **(c)** Hizmet ifası dolayısıyla vergi kesintisi yapmak ve vergi dairesine yatırmak zorunda olanların bu yükümlülüklerini
    yerine getirmemeleri halinde verginin ödenmesinden, **alım satıma taraf olanlar, hizmetten yararlananlar** ve aralarında
    **doğrudan veya hısımlık nedeniyle ya da sermaye, organizasyon veya yönetimine katılmak veya menfaat sağlamak suretiyle
    dolaylı olarak ilişkide bulunduğu tespit olunanlar müteselsilen** sorumludurlar (md. 11/3). Dolayısıyla Delta İnşaat (hizmetten
    yararlanan), Işık Hizmet ve hâkim ortak Bay Rıfat (dolaylı ilişki) müteselsil sorumludur.


    **(d)** Bu müteselsil sorumluluk **mal üreten çiftçiler ile nihai tüketiciler için söz konusu değildir** (md. 11/4). Aylin
    sorumlu tutulamaz.


    **(e)** Vergi kesmeye mecbur olanların sorumluluğu, bunların ödedikleri vergilerden dolayı **asıl mükelleflere rücu etmek
    hakkını kaldırmaz** (md. 11/2); Mavi Matbaa çalışanlara rücu edebilir. Vergi numarasının kamu kurum ve kuruluşları ile
    gerçek ve tüzel kişilerce yapılacak işlemlerle ilgili kayıtlarda ve düzenlenecek belgelerde kullanılması mecburiyetini
    getirmeye **Maliye Bakanlığı** yetkilidir (md. 8).

    '
  puanlama:
  - olcut: Kanuni ehliyetin şart olmaması ve mükellefiyetin doğması
    puan: 2
  - olcut: Ödevlerin kanuni temsilci tarafından yerine getirilmesi
    puan: 2
  - olcut: Yasak olay halinde mükellefiyetin kalkmaması
    puan: 4
  - olcut: Hizmetten yararlananın ve alım satıma taraf olanların müteselsil sorumluluğu
    puan: 2
  - olcut: Dolaylı ilişkideki kişilerin (hâkim ortak) müteselsil sorumluluğu
    puan: 3
  - olcut: Nihai tüketicinin müteselsil sorumluluk dışında olması
    puan: 3
  - olcut: Rücu hakkının saklı olması
    puan: 2
  - olcut: Vergi numarası bakımından Maliye Bakanlığının yetkisi
    puan: 2
