    puan: 3
  - olcut: Rehinli alacaklıların haklarının mahfuz olması ve aynından doğan alacakların rehinden sonra gelmesi
    puan: 3
  - olcut: İpotek için 700.000 TL ve emlak vergisi için 300.000 TL
    puan: 3
  - olcut: İflasta imtiyazlı alacak; İİK md. 206/3. sıra
    puan: 4
