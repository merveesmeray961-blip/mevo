    sayıldığını belirtiniz; I ve II numaralı tasarrufların hükümsüzlüğünü gerekçelendiriniz. (8 puan)


    (b) V numaralı tasarrufun hükümsüzlüğünü maddeye göre değerlendiriniz. (3 puan)


    (c) III numaralı tasarrufun hükümsüzlüğünün hangi koşullara bağlı olduğunu ve zamanaşımı durumunu belirtiniz. (5 puan)


    (d) IV numaralı tasarruf için iptal davası açılıp açılamayacağını belirtiniz. (3 puan)


    (e) İptal davasının hangi mahkemede ve kimlere karşı açılacağını belirtiniz. (4 puan)


    (f) Davayı kazanan idare açısından üçüncü kişinin elde ettiklerini elden çıkarmış olması halinin sonucunu belirtiniz.
    (2 puan)

    '
