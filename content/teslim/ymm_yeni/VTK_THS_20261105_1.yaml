  soru: '**Olay:** Vergi dairesi aşağıdaki borçlulara ilişkin haciz işlemleri yapmaktadır. Varsayım olarak asgari ücret net
    28.000 TL alınacaktır.


    1. **Bay Ali Yurt**''un net aylık ücreti 90.000 TL''dir ve ücretinin haczi istenmektedir.

    2. **Bayan Banu Er**''in net aylık ücreti 24.000 TL''dir (asgari ücreti aşmamaktadır).

    3. **Bay Cemil Tarlalı** çiftçidir; kendisinin ve ailesinin geçimleri için zorunlu arazisi ve çift hayvanları ile ev eşyasından
    pek lüzumlu mutfak takımı haczedilmek istenmektedir.

    4. **Bay Deniz Tekin**, haczedilmiş bir makineyi tahsil dairesinin onayı olmadan sattığını ve alıcı **Bay Ege**''nin makineyi
    iyi niyetle ve zilyetlik hükümlerine dayanarak satın aldığını ileri sürmektedir.


    **İstenenler:**


    (a) 1 numaralı olayda haczedilebilecek aylık tutarın en az ve en çok kaç TL olabileceğini hesaplayınız. (6 puan)


    (b) 2 numaralı olayda haczedilebilecek en çok aylık tutarı hesaplayınız ve gerekçesini belirtiniz. (5 puan)


    (c) 3 numaralı olayda haczedilebilecek mal bulunup bulunmadığını açıklayınız. (5 puan)


    (d) 4 numaralı olayda borçlunun tasarrufunun ve Bay Ege''nin durumunun hukuki sonucunu açıklayınız. (5 puan)

    '
  cozum: '**(a)** Aylıklar, ücretler vb. gelirler kısmen haczolunabilir; haczolunacak miktar bunların üçte birinden çok, dörtte
    birinden az olamaz (md. 71). 90.000 TL ücret asgari ücreti aştığından alt sınır 90.000 × 1/4 = **22.500 TL**, üst sınır
    90.000 × 1/3 = **30.000 TL**''dir.


    **(b)** Asgari ücreti aşmayan aylık gelirlerin **onda birinden fazlası** haczolunamaz (md. 71): 24.000 × 1/10 = **2.400
    TL**. Genel üçte bir/dörtte bir aralığı bu halde uygulanmaz.


    **(c)** Çiftçi borçlunun kendisinin ve ailesinin geçimleri için zaruri olan arazisi, çift hayvanları, taşıtları ve tarım
    aletleri ile vazgeçilmesi kabil olmayan mutfak takımı ve pek lüzumlu ev eşyası **haczedilemez** (md. 70/3-4).


    **(d)** Borçlu, alacaklı amme idaresinin muvafakatini almaksızın hacizli mallarda tasarrufta bulunamaz; haczi koyan tahsil
    dairesi bu aykırılığın cezayı gerektirdiğini borçluya ihtar eder (md. 73). Haczedilmiş mal üzerinde üçüncü şahsın **zilyetlik
    hükümlerine istinaden iyi niyetle** elde ettiği haklar mahfuzdur; iyi niyet kurallarına aykırı olarak elde edilen haklar
    ise mahkemece butlanına hükmolunur.

    '
