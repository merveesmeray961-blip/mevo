    şirket süresinde ne ödeme yapmış ne de mal bildiriminde bulunmuştur. Şirketin malı borcuna yetmemektedir. Şirketin ödeme
    emri öncesindeki tasarrufları şöyledir:


    | No | Tarih | Tasarruf |

    |---|---|---|

    | I | 15.09.2024 | Şirket ortağının eşine, bedelsiz olarak bir araç devretmiştir. |

    | II | 20.02.2025 | Gerçek değeri 4.000.000 TL olan taşınmaz, kardeşine 400.000 TL''ye satılmıştır. |

    | III | 12.03.2023 | Şirket, malı borca yetmeyeceğini bilerek, amme alacağını kaçırmak amacıyla alıcının da bu durumu
    bildiği bir taşınmazı satmıştır. |

    | IV | 05.11.2020 | Bir yakınına bağışlama yapılmıştır. |

    | V | 01.08.2025 | Teminat göstermeyi önceden taahhüt etmemiş olan şirket, mevcut bir borcunu temin için ipotek vermiştir.
    |


