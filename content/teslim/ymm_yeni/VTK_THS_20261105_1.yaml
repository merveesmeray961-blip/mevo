  - mevzuat: 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    madde: md. 21 (iflas)
    alinti: Borçlunun iflası, mirasın reddi ve terekenin resmi tasfiyeye tabi tutulması hallerinde amme alacakları imtiyazlı
      alacak olarak 2004 sayılı İcra ve İflas Kanununun 206 ncı maddesinin üçüncü sırasında, bu sıranın önceliğini alan alacaklar
      da dahil olmak üzere tüm imtiyazlı alacaklar ile birlikte işleme tabi tutulur.
