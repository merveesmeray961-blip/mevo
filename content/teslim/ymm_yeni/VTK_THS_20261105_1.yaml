  soru: '**Olay:** **Alaz Mobilya Ltd. Şti.**nin amme borcu nedeniyle haczedilen menkul mallar paraya çevrilecektir.


    1. Haczedilen bir fabrika makinesi için satış, tahsil dairesi tarafından düzenlenecektir.

    2. Haczedilen bir sevkiyat yaş meyve-sebze partisi ise bekletilirse önemli bir değer düşüklüğüne uğrayacaktır.

    3. Borçlu **Bay Enes**, tahsil dairesinin onayı olmadan haczedilen otomobilini kardeşi **Bay Mert**''e satmış; alıcı kardeş
    borçlunun hacizli olduğunu bildiği hâlde malı almıştır.

    4. Satış sonunda elde edilen bedel, borçlunun borcunu karşılamamıştır; kalan borç için borçlunun başka haczi caiz malı
    bulunmamaktadır.


    **İstenenler:**


    (a) 1 numaralı olayda menkul malın satış şeklini ve satış bedelinin nasıl ödeneceğini belirtiniz; açık artırmada ihalenin
    nasıl yapılacağını açıklayınız. (6 puan)


    (b) 2 numaralı mal için hangi satış yolunun izlenebileceğini belirtiniz. (4 puan)


    (c) 3 numaralı olayda satışın hukuki sonucunu ve haciz uygulayan tahsil dairesinin yapması gerekeni açıklayınız. (6 puan)


    (d) 4 numaralı olayda borçlunun hukuki durumunu ve kalan borç bakımından tahsil dairesinin yapacağı işlemi belirtiniz.
    (6 puan)

    '
  cozum: '**(a)** Menkul mallar, elektronik ortamda veya tahsil dairelerinin satış mahallinde **açık artırma ve peşin para
    ile** satılır; tahsil dairesince uygun görülmesi halinde artırma malın mahallinde de yapılabilir. Açık artırma ile satışa
    çıkarılan mal, artırma sonunda **üç defa yüksek sesle duyurulduktan** sonra en çok artırana ihale edilir (md. 85/1). İlk
    artırmada satılamayan malların ikinci artırması bir başka il veya ilçede yapılabilir.


    **(b)** Bozulma, çürüme ve benzeri sebeplerle korunması mümkün olmayan ya da beklediği zaman önemli bir değer düşüklüğüne
    uğrayacağı anlaşılan mallar ile muhafazası tehlikeli veya masraflı olan mallar **en uygun yerde pazarlıkla**, borsası
    bulunan mallar ilgili borsada satılabilir (md. 85).


    **(c)** Borçlu, alacaklı amme idaresinin muvafakatini almaksızın hacizli mallarda tasarrufta bulunamaz (md. 73/1); tahsil
    dairesi bu aykırılığın cezayı gerektirdiğini borçluya ihtar eder. Hacizli mal üzerinde üçüncü şahsın **iyi niyetle** elde
    ettiği zilyetlik hakları mahfuzdur; ancak Bay Mert hacizli olduğunu bildiğinden **iyi niyet kurallarına aykırı** hareket
    etmiştir ve elde ettiği hakların, alacaklının haczi ile o mala taallük eden haklarını ihlal ettiği nispette **butlanına
    mahkemece hükmolunur** (md. 73/3).


    **(d)** Yapılan takip sonunda borçlunun haczi caiz malı olmadığı veya bulunan malların satış bedeli borcunu karşılamadığı
    takdirde borçlu **aciz halinde sayılır**. Takip safhaları ile bakiye borç miktarı bir **aciz fişinde** gösterilerek aciz
    hali tespit olunur (md. 75). Aciz halindeki borçlu hakkında teminat ve faiz aranmadan tecil hükmü uygulanabilir ve tahsil
    dairesi borçlunun mali durumunu zamanaşımı süresi içinde devamlı olarak takip eder (md. 76).

