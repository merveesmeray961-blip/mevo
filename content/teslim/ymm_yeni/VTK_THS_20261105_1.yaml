    aktin yapıldığı sıradaki değerine göre ivaz olarak pek aşağı bir fiyat kabul etmiştir; bu tasarruf md. 28/2 uyarınca **bağışlama
    hükmündedir** ve 20.02.2025 tarihi iki yıllık dönemde kaldığından md. 27 gereği hükümsüzdür.


    **(b)** Md. 29/1 uyarınca, teminat göstermeyi evvelce taahhüt etmiş olduğu haller hariç, mevcut bir borcu temin için yapılan
    rehinler iki yıllık dönemde hükümsüzdür. 01.08.2025 tarihli ipotek bu dönemde ve taahhütsüz yapıldığından **hükümsüzdür**.


    **(c)** Md. 30''a göre borçlunun malı bulunmadığı veya borca yetmediği takdirde, amme alacağının tahsiline imkân bırakmamak
    maksadıyla borçlu tarafından yapılan tek taraflı muameleler ile borçlunun maksadını bilen veya bilmesi lazım gelenlerle
    yapılan bütün muameleler **tarihleri ne olursa olsun hükümsüzdür**. Bu muamele 12.03.2023''te yapıldığından iki yıllık
    dönemin dışında kalsa da md. 30 gereği hükümsüz sayılabilir. Ancak md. 26''ya göre tasarrufun vukuu tarihinden beş yıl
    geçtikten sonra dava açılamaz; 12.03.2028''e kadar dava açılabilir.


    **(d)** IV numaralı tasarrufun vukuu tarihi 05.11.2020''dir; beş yıllık süre 05.11.2025''te dolmuştur. Dava tarihi 10.11.2026''da
