    (6 puan)


    (d) 4 numaralı olayda davanın hangi tarihte açılmış sayılacağını belirtiniz ve gerekçesini yazınız. (5 puan)

    '
  cozum: '**(a)** Vergi mahkemesinin görevine giren konuda adli yargı yerinde açılan davanın görev yönünden reddi halinde,
    kararın kesinleşmesini izleyen günden itibaren **otuz gün** içinde görevli mahkemede dava açılabilir (İYUK md. 9/1). Süre
    16.07.2026''da başlar; 30. gün **14.08.2026 Cuma** günüdür. Görevsiz yargı merciine başvurma tarihi (**10.03.2026**) vergi
    mahkemesine başvurma tarihi sayılır; dolayısıyla dava açma süresine uyulmuş kabul edilir.


