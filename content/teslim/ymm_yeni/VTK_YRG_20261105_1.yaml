    3. **Çınar A.Ş.**ye aynı denetim sonucu (i) 400.000 TL katma değer vergisi ihbarnamesi, (ii) bu verginin ziyaına bağlı
    vergi ziyaı cezası ihbarnamesi ve (iii) ilgisiz bir olaydan dolayı usulsüzlük cezası ihbarnamesi tebliğ edilmiştir.

    4. **Deniz Ltd. Şti.** dava dilekçesini vergi mahkemesi başkanlığına 15.04.2026''da vermiş; harç ve posta ücretleri alındıktan
    sonra dilekçenin deftere kaydı 16.04.2026''da yapılmıştır.


