    etmiş, karar şirkete 05.05.2026''da tebliğ edilmiştir. Şirket, ihbarnameye dayalı tahsil nedeniyle uğradığı zararın giderilmesini
    de istemektedir.

    4. İlan edilen ve bazı mükellefler için uygulama işlemi de yapılan bir düzenleyici işleme karşı dava açılmak istenmektedir.


    **İstenenler:**


    (a) 1 numaralı olayda Bay Selim''in dava açmadan önce idareye başvurması gereken en geç tarihi bulunuz ve gerekçesini
    yazınız. (6 puan)


    (b) 2 numaralı olayda başvurunun reddedilmiş sayıldığı tarihi belirtiniz ve bundan sonra Bay Selim''in izleyebileceği
    yolu açıklayınız. (5 puan)


    (c) 3 numaralı olayda Mavi Lojistik Ltd. Şti.''nin tam yargı davasını ne zamana kadar açabileceğini ve iptal davası ile
    birlikte açabilme imkânını belirtiniz. (5 puan)


    (d) 4 numaralı olayda dava süresinin başlangıcını ve ilgililerin açabileceği dava seçeneklerini açıklayınız. (5 puan)

    '
  cozum: '**(a)** İdari eylemlerden hakları ihlal edilenler, eylemleri öğrendikleri tarihten itibaren **bir yıl** ve her halde
    eylem tarihinden itibaren **beş yıl** içinde ilgili idareye başvurarak haklarının yerine getirilmesini istemek zorundadır
    (İYUK md. 13/1). Bir yıllık süre 14.01.2027''de, beş yıllık süre 20.02.2027''de dolar. İki sürenin ilk dolacak olanı esas
    olduğundan en geç başvuru tarihi **14.01.2027**''dir.


    **(b)** İstek hakkında otuz gün içinde cevap verilmediğinde istek reddedilmiş sayılır: 03.03.2026 + 30 gün = **02.04.2026**.
    Bay Selim bu sürenin bittiği tarihten itibaren dava açma süresi (vergi mahkemesinde **30 gün**) içinde dava açabilir (md.
    13/1).


    **(c)** Haklarını ihlal eden bir idari işlem dolayısıyla ilgililer doğrudan tam yargı davası veya iptal ve tam yargı davalarını
    birlikte açabilecekleri gibi, ilk önce iptal davası açarak bu davanın karara bağlanması üzerine, kararın tebliğinden itibaren
    dava süresi içinde tam yargı davası açabilir (md. 12). Şirket iptal kararının tebliği olan 05.05.2026''yı izleyen günden
    başlayan **30 günlük süre** içinde (son gün 04.06.2026 Perşembe) tam yargı davası açabilir.


    **(d)** İlanı gereken düzenleyici işlemlerde dava süresi **ilan tarihini izleyen günden** itibaren başlar. İlgililer uygulama
    üzerine düzenleyici işlem, uygulanan işlem veya her ikisi aleyhine birden dava açabilir; düzenleyici işlemin iptal edilmemiş
    olması ona dayalı işlemin iptaline engel olmaz (md. 7/4).

    '
