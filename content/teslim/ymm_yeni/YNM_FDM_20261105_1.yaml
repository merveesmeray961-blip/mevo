  soru: 'Çorum Döküm San. A.Ş. 7/A seçeneğini uygulamakta ve GÜG''sini gider yerlerinde toplayarak ürünlere yüklemektedir.
    Gider yerleri: iki esas üretim gider yeri (Dökümhane ve İşleme) ve iki yardımcı hizmet gider yeri (Enerji ve Bakım-onarım).
    Dağıtım öncesi aylık giderler (730 hesapta, gider yeri koduyla): Dökümhane 500.000 TL, İşleme 400.000 TL, Bakım-onarım
    150.000 TL, Enerji 100.000 TL.


    Yardımcı hizmet giderleri **kademeli (basamaklı) dağıtım** yöntemiyle dağıtılacaktır: önce Enerji, sonra Bakım-onarım
    dağıtılır; Bakım-onarım, Enerji''den pay almaz. Dağıtım anahtarları:


    | Hizmet veren | Bakım-onarım | Dökümhane | İşleme |

    |---|---:|---:|---:|

    | Enerji (kWh payı) | %20 | %40 | %40 |

    | Bakım-onarım (saat payı) | — | %60 | %40 |


    Yükleme oranları: Dökümhane için normal kapasite 10.700 makine saati (MS); İşleme için 12.700 direkt işçilik saati (DİS).
    Ürün başına standart süreler: X ürünü 4 MS ve 3 DİS, Y ürünü 2 MS ve 5 DİS. Aylık üretim: X 1.500 adet, Y 2.000 adet.
    Yükleme farkı "734 Genel Üretim Giderleri Kapasite Farkları" hesabında izlenecektir.


    **İstenenler:**


    (a) Kademeli dağıtım tablosunu hazırlayarak Dökümhane ve İşleme''nin dağıtım sonrası toplam GÜG''sini bulunuz. (8 puan)


    (b) Aynı veriler için doğrudan dağıtım (Enerji payları Dökümhane ve İşleme arasında %50-%50, Bakım-onarım payları %60-%40)
    uygulansaydı gider yerlerinin toplamlarının ne olacağını bulunuz ve iki yöntem arasındaki farkı yorumlayınız. (4 puan)


    (c) Kademeli dağıtım sonuçlarına göre GÜG yükleme oranlarını, X ve Y ürünlerinin birim GÜG''sini bulunuz. (5 puan)


    (d) Fiili üretime yüklenen GÜG''yi, yükleme farkını ve 730, 731, 151, 734 hesaplarına ilişkin kayıtları gösteriniz. (5
    puan)


    (e) Bakım-onarım gider yerinde 40.000 TL''lik yedek parça (150 hesaptan) kullanılmıştır. Bu giderin kaydında muhasebe
    fişinde yer alması gereken hesap ve kodları belirtiniz. (3 puan)

    '
  cozum: '**(a) Kademeli dağıtım**


    | Gider yeri | Dağıtım öncesi | Enerji dağıtımı | Bakım-onarım dağıtımı | Dağıtım sonrası |

    |---|---:|---:|---:|---:|

    | Enerji | 100.000 | (100.000) |  | 0 |

    | Bakım-onarım | 150.000 | 20.000 | (170.000) | 0 |

    | Dökümhane | 500.000 | 40.000 | 102.000 | **642.000** |

    | İşleme | 400.000 | 40.000 | 68.000 | **508.000** |

    | **Toplam** | 1.150.000 |  |  | **1.150.000** |


    **(b)** Doğrudan dağıtımda Dökümhane = 500.000 + 50.000 + 90.000 = **640.000 TL**, İşleme = 400.000 + 50.000 + 60.000
    = **510.000 TL**. Kademeli yöntemde Bakım-onarım''ın Enerji''den aldığı 20.000 TL pay üretim yerlerine de yansıdığından
    Dökümhane 2.000 TL fazla, İşleme 2.000 TL eksik çıkar; toplam değişmez (1.150.000).


    **(c)** Dökümhane oranı = 642.000 / 10.700 = **60 TL/MS**; İşleme oranı = 508.000 / 12.700 = **40 TL/DİS**. X = 4 × 60
    + 3 × 40 = **360 TL**; Y = 2 × 60 + 5 × 40 = **320 TL**.


    **(d)** Kullanılan standart saatler: MS = 1.500 × 4 + 2.000 × 2 = 10.000; DİS = 1.500 × 3 + 2.000 × 5 = 14.500. Yüklenen:
    Dökümhane 10.000 × 60 = 600.000; İşleme 14.500 × 40 = 580.000; toplam **1.180.000 TL**. Fiili GÜG 1.150.000 TL olduğundan
    **30.000 TL fazla yükleme (olumlu fark)** vardır (Dökümhane 42.000 eksik, İşleme 72.000 fazla).


    *1) Fiili GÜG*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 1.150.000 |  |

    | İlgili aktif ve pasif hesaplar |  | 1.150.000 |

    | **Toplam** | **1.150.000** | **1.150.000** |


    *2) Yüklenen GÜG*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 1.180.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 1.180.000 |

    | **Toplam** | **1.180.000** | **1.180.000** |


    *3) Kapanış (olumlu fark alacak)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 1.180.000 |  |

    | 730 Genel Üretim Giderleri |  | 1.150.000 |

    | 734 Genel Üretim Giderleri Kapasite Farkları |  | 30.000 |

    | **Toplam** | **1.180.000** | **1.180.000** |


    **(e)** Kayıt: 730 Genel Üretim Giderleri (borç) / 150 İlkmadde ve Malzeme (alacak) 40.000 TL. Fişte gider çeşidi kodu
    **0** (İlk madde ve malzeme) ve gider yeri olarak **Bakım-onarım** (yardımcı hizmet gider yeri, 10–99 aralığındaki kodu)
    birlikte yazılır.


    Püf noktaları: Kademeli dağıtımda önce dağıtılan hizmet yeri sonraki yerden pay almaz ama sonrakine pay verir; Bakım-onarım,
    Enerji''den aldığı 20.000 TL ile birlikte 170.000 TL olarak dağıtılır. Yükleme farkını bulurken yüklenenden fiiliyi çıkarmak
    fazla yüklemeyi (olumlu) verir.

    '
  puanlama:
  - olcut: (a) Enerji dağıtımı (20.000 / 40.000 / 40.000)
