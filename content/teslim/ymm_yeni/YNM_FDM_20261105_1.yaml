  soru: 'Kızılay Mekanik San. A.Ş. iki ürün (A ve B) üretmekte ve genel üretim giderlerini (GÜG) 730 hesapta toplamaktadır.
    Yönetim, GÜG''nin ürünlere yüklenme biçiminin ürün kârlılığını nasıl etkilediğini incelemek istemektedir. 2026 yılı GÜG
    havuzları ve faaliyet ölçüleri:


    | GÜG havuzu (730) | Tutar (TL) | Faaliyet ölçüsü | A | B |

    |---|---:|---|---:|---:|

    | Makine kurulum | 240.000 | kurulum sayısı | 10 | 110 |

    | Kalite kontrol | 180.000 | muayene saati | 200 | 700 |

    | Malzeme elleçleme | 90.000 | sipariş sayısı | 60 | 240 |

    | Makine işletme | 290.000 | makine saati (MS) | 7.000 | 3.000 |

    | **Toplam** | **800.000** | | | |


    Yıllık üretim ve satış: A 12.500 adet, B 2.000 adet. Birim satış fiyatları: A 100 TL, B 300 TL. Birim direkt maliyetler
    (direkt ilkmadde + direkt işçilik): A 60 TL, B 100 TL. Geleneksel sistemde tüm GÜG, makine saati üzerinden tek bir oranla
    yüklenmektedir. Faaliyet tabanlı sistemde ise her havuz kendi faaliyet ölçüsüyle ürünlere yüklenir. Yıl içinde üretilen
    her şey satılmıştır (stok yoktur).


    **İstenenler:**


    (a) Geleneksel yönteme göre GÜG yükleme oranını, ürünlerin birim GÜG''sini ve ürün bazında kârı hesaplayınız. (7 puan)


    (b) Faaliyet tabanlı yönteme göre her havuz için faaliyet oranını, ürünlere yüklenen GÜG''yi ve birim GÜG''yi hesaplayınız.
    (8 puan)


    (c) Faaliyet tabanlı yönteme göre ürün bazında kârı hesaplayınız; iki yöntemin toplam kârını ve ürün kârlılıkları arasındaki
    farkın nedenini yorumlayınız; B ürününün zarar etmemesi için asgari birim fiyatı bulunuz. (6 puan)


    (d) 730 hesabın fiili GÜG''yle kapatılmasına ve GÜG''nin 151 hesaba yansıtılmasına ilişkin kayıtları yapınız. (4 puan)

    '
  cozum: '**(a) Geleneksel yöntem:** oran = 800.000 / 10.000 MS = **80 TL/MS**. A''ya 7.000 × 80 = 560.000 TL, B''ye 3.000
    × 80 = 240.000 TL yüklenir.


    |  | A | B |

    |---|---:|---:|

    | Birim GÜG | 44,8 | 120 |

    | Birim direkt maliyet | 60 | 100 |

    | Birim tam maliyet | 104,8 | 220 |

    | Birim satış fiyatı | 100 | 300 |

    | Birim kâr | -4,8 | 80 |

    | Toplam kâr | -60.000 | 160.000 |


    Toplam kâr = 100.000 TL. Geleneksel yöntem A''yı zararlı, B''yi kârlı gösterir.


    **(b) Faaliyet tabanlı yöntem**


    | Havuz | Faaliyet oranı | A''ya yüklenen | B''ye yüklenen |

    |---|---:|---:|---:|

    | Kurulum: 240.000 / 120 | 2.000 TL/kurulum | 20.000 | 220.000 |

    | Kalite: 180.000 / 900 | 200 TL/saat | 40.000 | 140.000 |

    | Elleçleme: 90.000 / 300 | 300 TL/sipariş | 18.000 | 72.000 |

    | Makine: 290.000 / 10.000 | 29 TL/MS | 203.000 | 87.000 |

    | **Toplam** |  | **281.000** | **519.000** |


    Birim GÜG: A = 281.000 / 12.500 = **22,48 TL**; B = 519.000 / 2.000 = **259,5 TL**.


    **(c)** A: (100 − 60 − 22,48) × 12.500 = **219.000 TL kâr**; B: (300 − 100 − 259,50) × 2.000 = **-119.000 TL zarar**.
    Toplam kâr her iki yöntemde de **100.000 TL**''dir; yalnız ürünlere dağılımı değişir. Geleneksel yöntem kurulum, muayene
    ve sipariş gibi faaliyetleri makine saatine bağlayarak az faaliyet tüketen yüksek hacimli A''yı fazla, çok faaliyet tüketen
    düşük hacimli B''yi az maliyetlendirir. B''nin zarar etmemesi için birim fiyat en az 100 + 259,50 = **359,5 TL** olmalıdır.


    **(d)**


    *1) Fiili GÜG (gider yeri ve çeşit kodlarıyla)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 800.000 |  |

    | İlgili aktif ve pasif hesaplar |  | 800.000 |

    | **Toplam** | **800.000** | **800.000** |


    *2) GÜG''nin ürünlere yansıtılması (A 281.000; B 519.000)*


