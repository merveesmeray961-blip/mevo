  dogrulama:
    python: 'd_g=500000; i_g=400000; b_g=150000; e_g=100000

      e_b=e_g*0.2; e_d=e_g*0.4; e_i=e_g*0.4

      b_top=b_g+e_b

      b_d=b_top*0.6; b_i=b_top*0.4

      D=d_g+e_d+b_d; I=i_g+e_i+b_i

      dd_D=d_g+e_g*0.5+b_g*0.6; dd_I=i_g+e_g*0.5+b_g*0.4

      ms=10700; dis=12700

      oran_d=D/ms; oran_i=I/dis

      x_adet=1500; y_adet=2000

      x_guq=4*oran_d+3*oran_i; y_guq=2*oran_d+5*oran_i

      yuk_d=(x_adet*4+y_adet*2)*oran_d; yuk_i=(x_adet*3+y_adet*5)*oran_i

      fiili=d_g+i_g+b_g+e_g

      yuklenen=yuk_d+yuk_i

      fark=yuklenen-fiili

      sonuc={''D'':D,''I'':I,''b_top'':b_top,''dd_D'':dd_D,''dd_I'':dd_I,''oran_d'':oran_d,''oran_i'':oran_i,''x_guq'':x_guq,''y_guq'':y_guq,''yuk_d'':yuk_d,''yuk_i'':yuk_i,''fiili'':fiili,''yuklenen'':yuklenen,''fark'':fark,''fark_d'':yuk_d-D,''fark_i'':yuk_i-I}

      '
