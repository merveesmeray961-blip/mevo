  soru: 'Aksaray Otomotiv Yan Sanayi A.Ş. 7/A seçeneğini uygulamakta ve genel üretim giderlerini (GÜG) gider yerlerine göre
    izlemektedir. Aylık gider yerlerinin dağıtım öncesi giderleri (730 hesapta, gider yeri koduyla izlenen fiili tutarlar):


    | Gider yeri | Gruplandırma | Tutar (TL) |

    |---|---|---:|

    | Kesim | esas üretim | 400.000 |

    | Montaj | esas üretim | 300.000 |

    | Bakım-onarım | yardımcı hizmet | 120.000 |

    | Üretim müdürlüğü | üretim yerleri yönetimi | 80.000 |


    Dağıtım **doğrudan dağıtım** yöntemiyle yapılacaktır (yardımcı hizmet gider yerleri birbirine hizmet vermez): bakım-onarım
    giderleri Kesim ve Montaj arasında bakım saatine göre (Kesim 600, Montaj 400 saat); üretim müdürlüğü giderleri çalışan
    sayısına göre (Kesim 30, Montaj 20 kişi) paylaştırılır.


    Yükleme oranları normal kapasiteye göre belirlenmiştir: Kesim yeri için normal kapasite 10.400 makine saati (MS); Montaj
    yeri için 9.500 direkt işçilik saati (DİS). İki ürünün birim başına standart süreleri:


    | Ürün | Kesim (MS) | Montaj (DİS) | Aylık üretim (adet) |

    |---|---:|---:|---:|

    | A | 3 | 2 | 2.000 |

    | B | 5 | 4 | 1.000 |


    Ay içinde fiilen gerçekleşen GÜG, dağıtım sonrası bulunacak toplam gider yeri maliyetine eşittir. Yükleme farkı, "734
    Genel Üretim Giderleri Kapasite Farkları" hesabında izlenecektir.


    **İstenenler:**


    (a) Dağıtım tablosunu hazırlayarak Kesim ve Montaj gider yerlerinin dağıtım sonrası toplam GÜG''sini bulunuz. (7 puan)


    (b) Her iki gider yeri için GÜG yükleme oranını ve A ile B ürünlerinin birim GÜG''sini hesaplayınız. (5 puan)


    (c) Fiili üretim için yüklenen GÜG''yi gider yeri bazında ve toplamda bulunuz; her gider yerinin yükleme farkını (fazla/eksik)
    belirtiniz. (5 puan)


    (d) 730, 731, 151 ve 734 hesaplarına ilişkin yevmiye kayıtlarını (fiili giderin kapatılması dahil) yapınız. (5 puan)


    (e) Tablodaki dört gider yerinin Tekdüzen Hesap Planı''ndaki gider yeri gruplandırmasına göre hangi gruba girdiğini ve
    bu gruplandırmanın amacını açıklayınız. (3 puan)

    '
  cozum: '**(a) Doğrudan dağıtım**


    | Gider yeri | Dağıtım öncesi | Bakım-onarım payı | Üretim müdürlüğü payı | Dağıtım sonrası |

    |---|---:|---:|---:|---:|

    | Kesim | 400.000 | 72.000 (%60) | 48.000 (%60) | **520.000** |

    | Montaj | 300.000 | 48.000 (%40) | 32.000 (%40) | **380.000** |

    | Bakım-onarım | 120.000 | (120.000) |  | 0 |

    | Üretim müdürlüğü | 80.000 |  | (80.000) | 0 |

    | **Toplam** | 900.000 |  |  | **900.000** |


    **(b)** Kesim oranı = 520.000 / 10.400 = **50 TL/MS**; Montaj oranı = 380.000 / 9.500 = **40 TL/DİS**.

    A''nın birim GÜG''si = 3 × 50 + 2 × 40 = **230 TL**; B''nin birim GÜG''si = 5 × 50 + 4 × 40 = **410 TL**.


    **(c)** Kullanılan standart saatler: MS = 2.000 × 3 + 1.000 × 5 = 11.000; DİS = 2.000 × 2 + 1.000 × 4 = 8.000.


    | Gider yeri | Yüklenen | Dağıtım sonrası fiili | Fark |

    |---|---:|---:|---:|

    | Kesim (11.000 × 50) | 550.000 | 520.000 | 30.000 fazla yükleme |

    | Montaj (8.000 × 40) | 320.000 | 380.000 | 60.000 eksik yükleme |

    | **Toplam** | **870.000** | **900.000** | **30.000 eksik yükleme (net)** |


    **(d)**


    *1) Fiili GÜG (gider çeşidi ve gider yeri kodlarıyla)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 900.000 |  |

    | İlgili aktif ve pasif hesaplar |  | 900.000 |

    | **Toplam** | **900.000** | **900.000** |


    *2) Yüklenen GÜG''nin yansıtılması (A: 460.000; B: 410.000)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 870.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 870.000 |

    | **Toplam** | **870.000** | **870.000** |


    *3) 730 ile 731''in karşılaştırılarak kapatılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 870.000 |  |

    | 734 Genel Üretim Giderleri Kapasite Farkları | 30.000 |  |

    | 730 Genel Üretim Giderleri |  | 900.000 |

    | **Toplam** | **900.000** | **900.000** |


    **(e)** Kesim ve Montaj: esas üretim gider yerleri; Bakım-onarım: yardımcı hizmet gider yeri; Üretim müdürlüğü: üretim
    yerleri yönetimi gider yeri. Gider yerleri, giderlerin planlanması, kontrol edilmesi ve dengeli biçimde toplanıp dağıtılmasını
    sağlar; her gider yerine ait numara muhasebe fişine gider çeşidi numarasıyla birlikte yazılır.


    Püf noktaları: Yükleme oranını normal kapasiteyle, yüklenen tutarı ise fiili üretimin standart saatiyle bulun. Gider yeri
    bazında fazla ve eksik yüklemeler birbirini götürür; net fark 734''e gider.

    '
