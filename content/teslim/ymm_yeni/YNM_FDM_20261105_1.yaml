    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 800.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 800.000 |

    | **Toplam** | **800.000** | **800.000** |


    *3) Kapanış*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 800.000 |  |

    | 730 Genel Üretim Giderleri |  | 800.000 |

    | **Toplam** | **800.000** | **800.000** |


    Tekdüzen Hesap Planı GÜG''nin ürünlere doğrudan değil, dağıtım yoluyla yansıtılabileceğini öngörür; dağıtım anahtarının
    seçimi (makine saati veya faaliyet ölçüleri) işletmeye bırakılmıştır ve muhasebe kaydını değiştirmez, yalnız ürün maliyetini
    değiştirir.


    Püf noktaları: Faaliyet oranını havuz tutarını A ve B''nin toplam faaliyet miktarına bölerek bulun. Toplam yüklenen her
    zaman 800.000''dir; iki yöntemin toplam kârı eşit çıkmalıdır, çıkmıyorsa dağıtımı yanlış yapmışsınızdır.

