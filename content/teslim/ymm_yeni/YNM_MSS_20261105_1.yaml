  kazanimlar:
  - hizmet işletmelerinde maliyet akışı (74 grubu)
  - önceden saptanmış maliyet ve fark hesabı (742)
  - gider çeşitleri ve eş zamanlı kayıt
  zorluk: 2
  puan: 25
  sure_dk: 30
  soru: 'Çağ Teknik Servis A.Ş. endüstriyel soğutma sistemlerine bakım-onarım hizmeti vermekte, 7/A seçeneğini ve önceden
    saptanmış maliyet yöntemini uygulamaktadır. Hizmet işletmesi olduğundan mamul stoku bulunmamaktadır. Şirketin 2026 yılı
    Eylül ayına ilişkin verileri:


    - Verilen hizmet: 5.200 hizmet saati. Önceden saptanmış hizmet üretim maliyeti: saat başına 180 TL. Hizmet bedeli: saat
    başına 270 TL (peşin tahsil edilmiştir, KDV dikkate alınmayacaktır).

    - Eylül ayında hizmet üretimi için katlanılan fiili giderler (toplam 962.000 TL):


    | Gider | Tutar (TL) |

    |---|---:|

    | Teknisyen ücretleri | 520.000 |

    | Yönetici ve büro personeli (hizmet bölümü) ücretleri | 90.000 |

    | Yedek parça ve sarf malzemesi | 140.000 |

    | Elektrik, akaryakıt ve nakliye | 80.000 |

    | Kira ve sigorta | 72.000 |

    | Taşıt vergileri ve harçlar | 10.000 |

    | Amortisman | 50.000 |


    **İstenenler:**


    (a) Fiili hizmet üretim giderlerinin kaydını; önceden saptanmış maliyetin yansıtılmasını, farkın hesaplanmasını ve dönem
    sonu kapanış kayıtlarını (740, 741, 742, 622) yapınız. (10 puan)


    (b) Fiili giderleri, Tekdüzen Hesap Planı''ndaki gider çeşidi kodlarına (0–7) göre sınıflandırınız ve her çeşit için kodu
    belirtiniz. (5 puan)


    (c) Hizmet işletmesinde 71, 72 ve 73 grubu hesapların kullanılıp kullanılmayacağını gerekçesiyle belirtiniz. (3 puan)


    (d) Hizmet gelirini, farkın aktarılmasından önce ve sonra brüt satış kârını bulunuz; eş zamanlı kayıt yönteminde bir gider
    fişinde hangi kodların birlikte yazılacağını açıklayınız. (7 puan)

    '
  cozum: '**(a)** Önceden saptanmış hizmet maliyeti = 5.200 × 180 = **936.000 TL**; fiili gider 962.000 TL; fark = **26.000
    TL olumsuz**.


    *1) Fiili giderler*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 740 Hizmet Üretim Maliyeti | 962.000 |  |

    | İlgili aktif ve pasif hesaplar (150, 257, 335, 102 vb.) |  | 962.000 |

    | **Toplam** | **962.000** | **962.000** |


    *2) Önceden saptanmış maliyetin yansıtılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 622 Satılan Hizmet Maliyeti | 936.000 |  |

    | 741 Hizmet Üretim Maliyeti Yansıtma |  | 936.000 |

    | **Toplam** | **936.000** | **936.000** |


    *3) 740 ile 741''in karşılaştırılarak kapatılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 741 Hizmet Üretim Maliyeti Yansıtma | 936.000 |  |

    | 742 Hizmet Üretim Maliyeti Fark Hesapları | 26.000 |  |

    | 740 Hizmet Üretim Maliyeti |  | 962.000 |

    | **Toplam** | **962.000** | **962.000** |


    *4) Farkın 622''ye aktarılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 622 Satılan Hizmet Maliyeti | 26.000 |  |

    | 742 Hizmet Üretim Maliyeti Fark Hesapları |  | 26.000 |

    | **Toplam** | **26.000** | **26.000** |


    Dönem sonunda 622''de 936.000 + 26.000 = 962.000 TL, yani fiili hizmet maliyeti kalır.


    **(b)**


    | Gider | Çeşit kodu | Tutar |

    |---|:---:|---:|

    | Yedek parça ve sarf malzemesi | 0 İlk madde ve malzeme | 140.000 |

    | Teknisyen ücretleri | 1 İşçi ücret ve giderleri | 520.000 |

    | Yönetici ve büro personeli ücretleri | 2 Memur ücret ve giderleri | 90.000 |

    | Elektrik, akaryakıt, nakliye | 3 Dışardan sağlanan fayda ve hizmetler | 80.000 |

    | Kira ve sigorta | 4 Çeşitli giderler | 72.000 |

    | Taşıt vergileri ve harçlar | 5 Vergi, resim ve harçlar | 10.000 |

    | Amortisman | 6 Amortismanlar ve tükenme payları | 50.000 |

    | **Toplam** | | **962.000** |


    **(c)** Kullanılmaz. Tekdüzen Hesap Planı, hizmet işletmelerinde 71, 72 ve 73 gruplarındaki hesapların yerine 74 Hizmet
    Üretim Maliyeti grubunun kullanılmasını öngörür; hizmetin maliyeti doğrudan 740–742 hesaplarında izlenir ve 622''ye aktarılır.


    **(d)** Hizmet geliri = 5.200 × 270 = 1.404.000 TL. Farktan önce brüt kâr = 1.404.000 − 936.000 = 468.000 TL; farkın 622''ye
    aktarılmasından sonra brüt kâr = 1.404.000 − 962.000 = **442.000 TL**. Eş zamanlı kayıt yönteminde gider fişine, 740 gibi
    fonksiyonel hesapla birlikte gider çeşidi kodu (örneğin teknisyen ücreti için 1) ve gider yeri kodu (10–99 aralığındaki
    ilgili gider yeri) yazılır; böylece gider aynı anda fonksiyona, çeşide ve gider yerine göre izlenir.


    Püf noktaları: Hizmet işletmesinde 622''ye giden tutar yansıtma hesabından gelir; fark hesabı da ayrıca 622''ye aktarılır,
    bu yüzden brüt kârı hesaplarken ikisini birlikte düşün. Çeşit kodları 0–7''dir; gider yeri kodları 10–99''dur.

    '
