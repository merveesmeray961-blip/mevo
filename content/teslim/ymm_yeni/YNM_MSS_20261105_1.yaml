    **(d)** Mamul maliyeti = 890.000 − 90.000 = 800.000 TL; birim maliyet = 800.000 / 4.000 = **200 TL**; satılan 3.000 adedin
    maliyeti = **600.000 TL**; dönem sonu 152 bakiyesi = 1.000 × 200 = 200.000 TL (151 bakiyesi 90.000 TL).


    *Genel muhasebe: 6) Satılan mamullerin maliyeti*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 620 Satılan Mamuller Maliyeti | 600.000 |  |

    | 152 Mamuller |  | 600.000 |

    | **Toplam** | **600.000** | **600.000** |


    Püf noktaları: Genel muhasebe giderleri doğrudan 710/720/730''a değil 700''e borç yazar; maliyet muhasebesi de 701''in
    alacağı karşılığında fonksiyonel gider hesaplarını borçlandırır. Bağlantı hesaplarının dönem sonu bakiyesi sıfırdır.

    '
