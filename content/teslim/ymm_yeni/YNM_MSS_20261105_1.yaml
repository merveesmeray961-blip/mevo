- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: YNM
  unite: Maliyet sistemleri ve maliyet akışı
  konu: MSS
  kazanim: fiili maliyet yöntemi, 151-152-620 akışı
  tip: hesaplama
  zorluk: 2
  kok: Fiili maliyet yöntemini ve 7/A seçeneğini uygulayan Pınar Mutfak San. A.Ş.'nin Eylül ayında 710 hesabında 180.000 TL,
    720 hesabında 90.000 TL ve 730 hesabında 70.000 TL gider toplanmıştır. Dönem sonunda maliyeti 40.000 TL olan yarı mamul
    kalmış, 400 adet ürün tamamlanarak 152 hesaba alınmıştır; tamamlanan ürünlerden 300 adedi satılmıştır (dönem başı stok
    yoktur). 620 Satılan Mamuller Maliyeti hesabına kaç TL borç kaydedilir?
  secenekler:
    A: 172.500 TL
    B: 202.500 TL
    C: 225.000 TL
    D: 255.000 TL
    E: 300.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Fiili yöntemde 710, 720 ve 730''da toplanan giderler (340.000 TL) yansıtma hesaplarının alacağı karşılığında
      151''e borç yazılır. Üretimi tamamlananların maliyeti ilgili stok hesabına aktarılır: 340.000 − 40.000 yarı mamul =
      300.000 TL (152). Birim maliyet 300.000/400 = 750 TL; satılan 300 adet için 620 = 300 × 750 = 225.000 TL. Püf noktaları:
      Yarı mamulün maliyetini önce düşün; sonra yalnız satılan adet kadar 620''ye yaz, 152''nin kalanı stoktur.'
    celdiriciler:
      A: 'Genel üretim giderlerinin (730) maliyete katılmamasıyla bulunan sonuçtur: (180.000 + 90.000 − 40.000) × 300/400
        = 172.500 TL. 730 hesabındaki giderler de 731 aracılığıyla 151''e yansıtılır.'
      B: 'Genel üretim giderleri unutulmuş ve yarı mamul düşülmemiştir: (180.000 + 90.000) × 300/400 = 202.500 TL. Her iki
        kalem de maliyet hesabına dahildir.'
      D: 'Yarı mamulün maliyeti düşülmeden bulunan sonuçtur: 340.000 × 300/400 = 255.000 TL. Yarı mamul henüz tamamlanmadığından
        152''ye ve dolayısıyla 620''ye aktarılmaz.'
      E: 300.000 TL tamamlanan 400 adedin tümünün maliyetidir; yalnız 300 adet satıldığından kalan 100 adet 152 hesapta stok
        olarak kalır.
    hesap_adimlari:
    - Tamamlanan mamul maliyeti = 180.000 + 90.000 + 70.000 − 40.000 = 300.000
    - Birim maliyet = 300.000 / 400 = 750
    - 620 = 300 × 750 = 225.000
