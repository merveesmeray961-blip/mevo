    (c) Mamulün birim maliyetini, 620 hesabına yazılacak maliyeti ve brüt satış kârını hesaplayınız. (5 puan)


    (d) 721 hesabının alacağı karşılığında 680 hesabının borçlandırılmasının nedenini ve yansıtma hesaplarının fiili maliyet
