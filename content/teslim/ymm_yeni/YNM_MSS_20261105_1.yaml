  kok: Önceden saptanmış maliyet yöntemini uygulayan bir işletmede ilkmaddenin standart fiyatı kg başına 10 TL'dir. Ay içinde
    30.000 kg ilkmadde kg başına 9,50 TL'den satın alınmış, 24.000 kg'ı üretimde kullanılmış, kalanı depoda kalmıştır. Fiyat
    farkı üretimde kullanılan miktar üzerinden hesaplanmaktadır. 712 Direkt İlkmadde ve Malzeme Fiyat Farkı hesabına bu işlemden
    dolayı kaç TL alacak kaydedilir?
  secenekler:
    A: 3.000 TL
    B: 12.000 TL
    C: 15.000 TL
    D: 24.000 TL
    E: 30.000 TL
  dogru: B
  aciklama:
    dogru_neden: 'Fiili birim fiyat (9,50) standart fiyatın (10) altında olduğundan fark olumludur. Olumlu fiyat farkları
      712''nin alacağına kaydedilir. Fark, üretimde kullanılan miktar üzerinden hesaplandığından (10 − 9,50) × 24.000 = 12.000
      TL''dir. Püf noktaları: Satın alınan miktarı değil kullanılan miktarı alın; depoda kalan 6.000 kg için fiyat farkı henüz
      maliyete yansımaz. Olumlu fark = alacak.'
    celdiriciler:
      A: Depoda kalan 6.000 kg'ın kg başına 0,50 TL farkı olan 3.000 TL'dir; stokta kalan malzemenin fiyat farkı henüz maliyete
        yansımaz.
      C: 15.000 TL satın alınan 30.000 kg üzerinden hesaplanan farktır; soruda fiyat farkı kullanılan miktar üzerinden hesaplanmaktadır.
      D: 24.000 TL kg başına 1 TL fark kabul edilerek bulunur; gerçek fark kg başına 0,50 TL'dir.
      E: 30.000 TL, hem miktarın hem de farkın yanlış alınmasından doğan sonuçtur.
    hesap_adimlari:
    - Birim fiyat farkı = 10 − 9,50 = 0,50 TL olumlu
    - Fark = 0,50 × 24.000 = 12.000 TL (712 alacak)
