  - olcut: (b) Bir ay içinde alınmayan belgelerin vergi dairesine yazıyla teslim edilmesi
    puan: 3
  - olcut: (c) Yazılı şekil, belli meblağ, ortaklık payı yasağı ve sözlü sözleşmede disiplin cezasının belirtilmesi
    puan: 4
  - olcut: (c) Peşin ücret ödenmediğinden işe başlama zorunluluğunun bulunmadığının belirtilmesi
    puan: 2
  - olcut: (d) Sözleşmenin zorunlu olduğu dört çalışma konusunun ve devir teslim gerçekleşmezse odaya bildirimin belirtilmesi
    puan: 3
