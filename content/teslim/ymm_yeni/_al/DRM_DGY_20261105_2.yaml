gorev: YMM paketi 2026-11-05
klasik:
- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - 'SMGE kredi hesabı: günlük sınır, doğrulanabilir ve diğer faaliyetler'
  - SMGE yükümlülüğün tamamlanması ve yaptırım
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Çalışanlar listesine kayıtlı yeminli mali müşavir Berna Koçak, 2021 yılında ruhsat almıştır. 5 Kasım 2026
    tarihinde 2024-2026 yıllarını kapsayan üç yıllık sürekli mesleki geliştirme eğitimi dönemine ilişkin durumunu değerlendirmektedir.
    Doğrulanabilir eğitimlerin tamamı SÜRGEM tarafından planlanmış uzaktan eğitimler ile Odalarda yapılan yüz yüze eğitimlerdir;
    her satırdaki süre ayrı bir eğitim gününe aittir ve süreler dakika olarak verilmiştir.


    | Yıl | Eğitim günleri (dakika) |

    |---|---|

    | 2024 | 400; 350; 250 |

    | 2025 | 300; 300; 200; 150 |

    | 2026 (5 Kasım''a kadar) | 450; 250; 100 |


    Diğer faaliyetlere ilişkin bilgiler şöyledir (tüm faaliyetler Yönetmelikte sayılan programlar kapsamındadır; Oda seminerleri
    Odalarca düzenlenmiş, kurum seminerleri SÜRGEM''e akredite kurumlarca düzenlenmiştir; tümüne yalnızca dinleyici olarak
    katılınmıştır):


    | Yıl | Mentorluk yapılan ay | Yıl boyunca hizmet verilen müşteri sayısı (işbaşı eğitimi) | Oda semineri (katılım sayısı)
    | Akredite kurum semineri (katılım sayısı) |

    |---|---|---|---|---|

    | 2024 | 9 | 11 | 2 | 1 |

    | 2025 | 6 | 11 | 2 | 2 |

    | 2026 (5 Kasım''a kadar) | 4 | 11 | 1 | 1 |


    Berna Koçak''ın üç yılda aldığı doğrulanabilir eğitimlerin 4 kredisi "Mesleki Çalışma Standartları ve Etik İlkeler", 1
    kredisi "Denetim; Denetim ve Güvence Standartları" konusundadır. Kendisine 1 Mart-30 Nisan 2025 tarihleri arasında geçici
    olarak mesleki faaliyetten alıkoyma cezası uygulanmış, Berna Koçak bu dönemde eğitim yükümlülüğünün işlemediğini düşünmüştür.
    Başka bir kredi kaynağı bulunmamaktadır ve 2026 yılının kalan kısmında yeni bir diğer faaliyet gerçekleştirilmeyecektir.


    **İstenenler:**


    (a) Her yıl için doğrulanabilir eğitim kredisini hesaplayınız; üç yıllık doğrulanabilir toplamı ve yıllık en az doğrulanabilir
    kredi koşulu bakımından durumu belirtiniz. (7 puan)


    (b) Diğer faaliyetlerden elde edilen kredileri, Yönetmelikteki kalem ve toplam sınırlarını uygulayarak hesaplayınız. (6
    puan)


    (c) Üç yıllık yükümlülüğün tamamlanıp tamamlanmadığını gerekçesiyle belirtiniz; eksik varsa 31 Aralık 2026''ya kadar tamamlanması
    gereken kredi miktarını ve niteliğini, günlük kredi sınırı nedeniyle gerekli en az eğitim günü sayısını bulunuz. (7 puan)


    (d) Yükümlülüğün yerine getirilmemesi hâlinde uygulanacak yaptırımları belirtiniz ve geçici alıkoyma döneminin eğitim
    yükümlülüğüne etkisini açıklayınız. (5 puan)

    '
  cozum: '**(a) Doğrulanabilir eğitim kredisi (7 puan)**


    Yüz yüze ve uzaktan eğitimde her 50 dakikalık ders 1 kredidir (md. 12/2); her gün için en fazla 7 kredi elde edilebilir
    (md. 12/3).


    | Yıl | Gün dersleri (dakika / 50) | Günlük sınır sonrası kredi | Yıllık toplam |

    |---|---|---|---|

    | 2024 | 8; 7; 5 | 7; 7; 5 | **19** |

    | 2025 | 6; 6; 4; 3 | 6; 6; 4; 3 | **19** |

    | 2026 | 9; 5; 2 | 7; 5; 2 | **14** |


    Üç yıllık doğrulanabilir toplam 19 + 19 + 14 = **52** kredidir. Md. 11/2 uyarınca yıllık en az 15 ve üç yılda en az 60
    doğrulanabilir kredi gerekir: 2024 ve 2025 yıllık koşulu sağlar; 2026''da 1 kredi, üç yıllık toplamda ise 8 kredi eksiktir.


    **(b) Diğer faaliyetler (6 puan)**


    - Mentorluk (md. 13/1-d): ayda 1 kredi, yıllık en çok 7 → 2024: min(9; 7) = 7; 2025: 6; 2026: 4 → **17**.

    - İşbaşı eğitimi (md. 13/1-f): müşteri başına yıllık 1 kredi, üç yılda en çok 30 → 11 × 3 = 33 → **30**.

    - Oda semineri (md. 13/1-b): katılım 3 kredi → (2 + 2 + 1) × 3 = **15**.

    - Akredite kurum semineri (md. 13/1-c): katılım 2 kredi → (1 + 2 + 1) × 2 = **8**.


    Kalem sınırları sonrası toplam 17 + 30 + 15 + 8 = 70''tir; diğer faaliyetler üç yılda en çok 60 kredi ile ikmal edilebildiğinden
    (md. 11/4 ve md. 13/1) geçerli diğer faaliyet kredisi **60**''tır.


    **(c) Yükümlülüğün durumu (7 puan)**


    Toplam geçerli kredi 52 + 60 = **112** < 120''dir; yükümlülük tamamlanmamıştır. Diğer faaliyetler tavana (60) ulaştığı
    için eksik başka bir diğer faaliyetle kapatılamaz; eksik 8 kredi **doğrulanabilir** eğitimle tamamlanmalıdır (doğrulanabilir
    52 + 8 = 60; 60 + 60 = 120). Etik konusunda 4 kredi (en az 3) yeterlidir; Denetim konusunda 1 kredi bulunduğundan (en
    az 2) eksik 8 kredinin **en az 1''i Denetim; Denetim ve Güvence Standartları** konusunda olmalıdır. Ayrıca 2026''daki
    14 kredi yıllık 15 koşulunun altında olduğundan eksik kredilerin 2026 yılında alınması gerekir (md. 11/5: değerlendirme
    her yıl, önceki iki yıl dahil yapılır). Günlük sınır 7 olduğundan 8 kredi en az ⌈8 / 7⌉ = **2 eğitim günü** gerektirir.


    **(d) Yaptırım ve geçici alıkoyma (5 puan)**


    Katılım zorunluluğu yerine getirilinceye kadar (md. 10/2): büro tescil belgesi vize edilmez, çalışanlar listesi kayıt
    ve faaliyet belgesi alma talepleri yerine getirilmez ve meslek mensubu stajyer mentorluğu yapamaz. Geçici olarak mesleki
    faaliyetten alıkoyma cezasının uygulandığı dönemde de sürekli eğitim yükümlülüğü devam eder (md. 11/6); bu nedenle 1 Mart-30
    Nisan 2025 dönemi yükümlülüğü azaltmaz.

    '
  puanlama:
  - olcut: (a) Günlük 7 kredi sınırının uygulanması ve yıllık doğrulanabilir kredilerin (19, 19, 14) doğru hesabı
    puan: 4
  - olcut: (a) Üç yıllık doğrulanabilir toplamın (52) ve yıllık 15 / üç yıllık 60 koşuluna göre eksikliklerin belirlenmesi
    puan: 3
  - olcut: (b) Mentorluk (yıllık 7) ve işbaşı eğitimi (üç yılda 30) sınırlarının uygulanarak 17, 30, 15 ve 8 kredinin bulunması
    puan: 4
  - olcut: (b) Diğer faaliyetler için üç yıllık 60 kredilik toplam sınırının uygulanması
    puan: 2
  - olcut: (c) Toplam 112 kredi ile yükümlülüğün tamamlanmadığının ve eksik 8 kredinin doğrulanabilir eğitimle kapatılacağının
      belirtilmesi
    puan: 3
  - olcut: (c) Denetim konusunda en az 1 kredi ve 2026 yıllık koşulu ile en az 2 eğitim günü sonucunun bulunması
    puan: 4
  - olcut: (d) Büro tescil belgesi vizesi, çalışanlar listesi belgeleri ve stajyer mentorluğu yaptırımlarının sayılması
    puan: 3
  - olcut: (d) Geçici alıkoyma döneminde de yükümlülüğün devam ettiğinin md. 11/6'ya dayanılarak belirtilmesi
    puan: 2
  kaynaklar:
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/1
    alinti: Eğitim kapsamındaki meslek mensubunun yılda en az 30 kredilik ve her üç yılda en az 120 kredilik sürekli mesleki
      geliştirme eğitimi alması gereklidir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/2
    alinti: Bu eğitimlerin yıllık en az 15 kredi ve her üç yılda en az 60 kredilik kısmının doğrulanabilir olması gerekir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/3
    alinti: konusundan ise en az 2 kredi karşılığı eğitimin tamamlanması gerekir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/4
    alinti: doğrulanabilir eğitim kredileri dışında kalan üç yıllık periyotta en çok 60 kredilik kısım, 13 üncü maddede belirtilen
      diğer faaliyetler ile ikmal edilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/5
    alinti: 120 kredinin sağlanıp sağlanmadığına ilişkin değerlendirme her yıl, eğitime tabi olunan önceki iki yıl da dahil
      edilerek yapılır.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 11/6
    alinti: nemde de sürekli eğitim yükümlülüğü devam eder.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 12/2
    alinti: Yüz yüze ve uzaktan eğitimde her 50 dakikalık ders bir kredi olarak kabul edilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 12/3
    alinti: Yüz yüze ve uzaktan eğitimlerde her bir gün için en fazla 7 kredi elde edilebilir.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-d
    alinti: d) Stajyer mentorluğu yapanlar mentorluk yaptıkları her ay için 1 kredi kazanırlar. Bu şekilde elde edilen krediler
      her yıl için 7 krediyi geçemez.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 13/1-f
    alinti: f) İşbaşı eğitimleri kapsamında meslek mensupları, bir yıl süre ile hizmet verdikleri her bir müşteri için yıllık
      1 kredi elde ederler. Bu şekilde elde edilen kredi üç yıllık dönemde 30 krediyi geçemez.
  - mevzuat: TÜRMOB Sürekli Mesleki Geliştirme Eğitimi Yönetmeliği
    madde: md. 10/2
    alinti: meslek mensuplarının büro tescil belgeleri vize edilmez, çalışanlar listesi kayıt ve faaliyet belgesi alma talepleri
      yerine getirilmez. Sürekli mesleki geliştirme eğitim programını tamamlamayan meslek mensupları stajyer mentorluğu yapamazlar.
  gecerlilik:
    baslangic: '2023-03-29'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: "gunler = {2024: [400, 350, 250], 2025: [300, 300, 200, 150], 2026: [450, 250, 100]}\ndog = {}\nfor y in gunler:\n\
      \    dog[y] = sum(min(d // 50, 7) for d in gunler[y])\ndtop = sum(dog.values())\nmentor = sum(min(a, 7) for a in [9,\
      \ 6, 4])\nisbasi = min(11 * 3, 30)\noda = (2 + 2 + 1) * 3\nakr = (1 + 2 + 1) * 2\ndiger = min(mentor + isbasi + oda\
      \ + akr, 60)\ntoplam = dtop + diger\neksik = 120 - toplam\ngun = -(-eksik // 7)\nsonuc = {'d2024': dog[2024], 'd2025':\
      \ dog[2025], 'd2026': dog[2026], 'dtop': dtop, 'mentor': mentor, 'isbasi': isbasi, 'oda': oda, 'akr': akr, 'diger':\
      \ diger, 'toplam': toplam, 'eksik': eksik, 'gun': gun}"
- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: DGY
  kazanimlar:
  - Ücret sözleşmesinin şekli, içeriği ve feshi
  - Sözleşme sona erdiğinde defter ve belgelerin iadesi
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Serbest muhasebeci mali müşavir Gülsüm Aydemir''in 2026 yılında üç iş sahibiyle ilişkisine dair bilgiler
    aşağıdadır:


    1. **Vera Tekstil Ltd. Şti.:** 1/1/2026-31/12/2026 dönemini kapsayan, yazılı ve belli meblağlı defter tutma sözleşmesinin
    yıllık ücreti 180.000 TL''dir ve aylık 15.000 TL olarak ödenecektir. Ocak-Ağustos 2026 dönemi için 8 aylık ücret (120.000
    TL) ödenmiştir. Vera Tekstil, Gülsüm Aydemir''in herhangi bir kusur ve ihmali bulunmaksızın sözleşmeyi 1 Eylül 2026 Salı
    günü feshetmiştir. Gülsüm Aydemir''in elinde şirkete ait defter ve belgeler bulunmaktadır.

    2. **Mavi Gıda A.Ş.:** 1/3/2026 tarihli yazılı defter tutma sözleşmesi uyarınca Gülsüm Aydemir''e yalnızca 40.000 TL avans
    ödenmiştir (başka bir ödeme yoktur). Gülsüm Aydemir, haklı bir sebep olmaksızın işi 1 Temmuz 2026 Çarşamba günü bırakmıştır.
    Mavi Gıda, defter ve belgelerini 20 Eylül 2026 tarihine kadar almamıştır.

    3. **Delta Ltd. Şti.:** Taraflar, 90.000 TL yıllık ücret konusunda yalnızca sözlü olarak anlaşmış; ücretin 30.000 TL''sinin
    15/2/2026 tarihinde peşin ödenmesi kararlaştırılmıştır. Delta, bu peşin ücreti ödememiştir. Delta yönetimi ayrıca ücretin
    bir kısmı karşılığında Gülsüm Aydemir''e şirkette ortaklık payı verilmesini önermiştir.


    **İstenenler:**


    (a) Vera Tekstil''in feshi hâlinde Gülsüm Aydemir''in hak edeceği toplam ücreti ve kalan alacağını hesaplayınız; Gülsüm
    Aydemir''in kusur ve ihmalinin bulunması hâlinde sonucun nasıl değişeceğini belirtiniz; Vera Tekstil''e ait defter ve
    belgelerin hangi süre içinde, hangi belgeyle iade edileceğini ve son günü gösteriniz. (7 puan)


    (b) Mavi Gıda bakımından Gülsüm Aydemir''in ücret talep edip edemeyeceğini ve geri vermesi gereken tutarı belirtiniz;
    Mavi Gıda''nın belgelerini almaması hâlinde Gülsüm Aydemir''in yapması gereken işlemi tarihleriyle açıklayınız. (6 puan)


    (c) Delta Ltd. Şti. ile yapılan düzenlemeyi ücret sözleşmesinin şekli ve içeriği bakımından değerlendiriniz; peşin ücretin
    ödenmemesinin Gülsüm Aydemir''in yükümlülüğüne etkisini belirtiniz. (6 puan)


    (d) Sözleşmenin zorunlu olduğu çalışma konularını ve fesih hâlinde defter ve belgelerin iadesine ilişkin devir teslim
    gerçekleşmediği takdirde meslek mensubunun yükümlülüğünü açıklayınız. (3 puan)

    '
  cozum: '**(a) Vera Tekstil (7 puan)**


    Sözleşmenin iş sahibince feshi hâlinde meslek mensubunun ücretinin tamamı ödenir (Ücret Yön. md. 17/2). Gülsüm Aydemir''in
    kusuru bulunmadığından hak ettiği ücret 12 × 15.000 = **180.000 TL**, ödenen 120.000 TL olduğundan kalan alacak 180.000
    − 120.000 = **60.000 TL**''dir. Meslek mensubu fesih sonucunu kendi kusur ve ihmaliyle doğurmuş olsaydı ücret ödenmezdi
    (aynı fıkra).


    Fesih hâlinde alınmış defter ve belgeler, **bir ay içinde devir teslim tutanağı düzenlenerek** sahibine geri verilir (Çalışma
    Usul Yön. md. 26). Fesih 1/9/2026 olduğundan son gün **1/10/2026**''dır (Perşembe).


    **(b) Mavi Gıda (6 puan)**


    Haklı sebep olmaksızın işi bırakan meslek mensubu hiçbir ücret talep edemez ve peşin aldığı ücreti geri vermek zorundadır;
    avanslar da buna dahildir (Ücret Yön. md. 17/1). Gülsüm Aydemir ücret talep edemez ve **40.000 TL** avansı iade eder.
    İşin bitiminden (1/7/2026) itibaren bir ay içinde (1/8/2026 Cumartesi) sahipleri tarafından alınmayan defter ve belgeler
    bir yazı ile ilgililerin bağlı olduğu **vergi dairesine** teslim edilir (Çalışma Usul Yön. md. 27); Mavi Gıda 20/9/2026''ya
    kadar belgeleri almadığından bu işlem yapılmalıdır.


    **(c) Delta Ltd. Şti. (6 puan)**


    Ücret sözleşmesinin yazılı yapılması ve belli bir meblağı kapsaması şarttır; yapılan hizmet karşılığı meslek mensubuna
    ortaklık payı verileceğine dair hüküm konulamaz; sözleşmenin sözlü yapıldığının belirlenmesi hâlinde meslek mensubu hakkında
    disiplin cezası uygulanır (Ücret Yön. md. 13). Dolayısıyla sözlü anlaşma da ortaklık payı önerisi de Yönetmeliğe aykırıdır.
    Anlaşmaya göre peşin verilmesi gereken ücret ödenmediğinden Gülsüm Aydemir işe başlamak ya da işi sürdürmek zorunda değildir
    (md. 17/3).


    **(d) Zorunlu sözleşme ve devir teslim (3 puan)**


    Defter tutmak, süreklilik arz eden müşavirlik hizmeti, inceleme-tahlil-denetim ve bunlarla ilgili rapor düzenleme ile
    yeminli mali müşavirlerin tasdik işlemlerinde sözleşme yapılması zorunludur (Çalışma Usul Yön. md. 24). Devir teslim gerçekleşmediği
    takdirde durum **meslek mensubu tarafından odaya bildirilir** (md. 26).

    '
  puanlama:
  - olcut: (a) Kusursuz fesihte ücretin tamamının hak edildiğinin ve 180.000 TL hak ediş / 60.000 TL kalan alacağın bulunması
