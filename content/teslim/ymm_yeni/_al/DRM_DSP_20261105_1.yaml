      üzerine şikayet dilekçesi genel kurula sunulur. Oda genel kurulunun disiplin soruşturmasına karar vermesi halinde; bu
      odanın disiplin kurulu, Kanun ve bu Yönetmelik hükümlerine göre gerekli inceleme ve araştırmaları yaparak kararını verir.
