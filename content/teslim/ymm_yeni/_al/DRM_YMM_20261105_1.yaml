  soru: '**Olay:** Yeminli mali müşavir (YMM) Tuğba Eren''e 2026 yılında aşağıdaki talepler gelmiştir. Her talep birbirinden
    bağımsızdır.


    **I. Seçim:** Berk Yapı A.Ş. yönetimi, tasdik hizmeti için iki YMM''den teklif almıştır: Tuğba Hanım 180.000 TL, Cenk
    Bey ise 140.000 TL istemiştir. Yönetim yalnız en düşük teklifi esas alarak karar vermek istemektedir. Tuğba Hanım, görevi
    üstlenmeden önce bu işin kendisine getirebileceği riski değerlendirmeyi, önceki tasdik hizmetini veren meslek mensubuyla
    görüşmeyi ve çalışma programını belirlemeyi planlamaktadır.


    **II. Tasdik talepleri:** Aşağıdaki işlemler için tasdik talep edilmiştir (Bakanlıkça kapsamın genişletilmediği/sınırlandırılmadığı
    kabul edilecektir):


    | No | Talep |

    |---|---|

    | 1 | Gelir Vergisi Kanunu''nun 94. maddesi uyarınca verilen muhtasar beyannameler |

    | 2 | KDV iade hakkı doğuran işlem ve belgeler |

    | 3 | 7338 sayılı Veraset ve İntikal Vergisi Kanunu''nun 10. maddesinin (a) bendi uyarınca yapılan servet incelemelerine
    konu bilançolar |

    | 4 | Emlak Vergisi Kanunu uyarınca verilen beyannameler |

    | 5 | Stok değerlemesi (bu vakada, bu işlemin tasdikine ilişkin Bakanlıkça tebliğ çıkarılmamış kabul edilecektir) |

    | 6 | 6183 sayılı Kanun''un 105. maddesi gereğince verilen terkin beyanlarının incelenmesi ve tasdiki |


    **III. Yetkiler:** Tuğba Hanım, sözleşme yaptığı Orhun Gıda A.Ş. bakımından aşağıdaki işlemleri yapmak istemektedir: (1)
    Gizli niteliği bulunsa dahi tasdik konusuyla ilgili defter ve belgeleri incelemek, (2) iç denetçiden bilgi istemek, (3)
    şirketin yönetim kurulu toplantısına katılıp tasdik faaliyetiyle ilgili açıklama yapmak, (4) tasdik konusuyla ilgili bir
    kamu kurumundan sözlü (telefonla) bilgi istemek, (5) şirketin vergi incelemesi sonrası uzlaşma toplantısında şirketle
    birlikte hazır bulunmak.


    **İstenenler:**


    (a) I numaralı durumda işletmenin YMM''yi seçerken esas alması gereken ölçütü, Tuğba Hanım''ın görevi üstlenmeden önce
    yapması gerekenleri ve işi kabul etmedeki serbestliğini Tasdik Yönetmeliği ve Çalışma Usul ve Esasları Yönetmeliği çerçevesinde
    açıklayınız. (6 puan)


    (b) II numaralı tabloda yer alan taleplerden hangilerinin tasdik edilebileceğini, hangilerinin edilemeyeceğini gerekçesiyle
    gösteriniz. (8 puan)


    (c) Tasdik Yönetmeliği md. 13''e göre tasdik çalışması planlamasında yer alması gereken hususları sayınız. (4 puan)


    (d) III numaralı durumda Tuğba Hanım''ın yapmak istediği işlemlerden hangilerinin Tasdik Yönetmeliği md. 12 kapsamında
    olduğunu, kamu idaresinden bilgi isteminin nasıl yapılacağını belirtiniz. (4 puan)

    '
  cozum: '**(a) Seçim ölçütü ve görevin üstlenilmesi (6 puan)**


    İşletmeler YMM''yi seçerken **ücret faktöründen ziyade** tasdik amacını gerçekleştirecek **uzmanlık ve deneyimini** esas
    alırlar (Tasdik Yön. md. 6/1); yönetimin yalnız en düşük teklife bakması bu ölçüte uygun değildir. YMM de görevi üstlenmeden
    önce işin kendisine getirebileceği **riski tespit etmek** ve **tasdik kapsam ve programını belirlemek** amacıyla gerekli
    araştırmaları yapmak zorundadır; ayrıca daha önce tasdik talebini karşılayan veya karşılamakta olan meslek mensubundan
    görüşme yapmak suretiyle **bilgi toplayabilir** (md. 6/2). Meslek mensupları uzmanlık, deneyim ve yeteneklerini gözeterek
    teklif edilen işi **kabul edip etmemekte serbesttirler** (Usul Yön. md. 52).


    **(b) Tasdik kapsamı (8 puan)** (Tasdik Yön. md. 7)


    | No | Talep | Sonuç | Gerekçe |

    |---|---|---|---|

    | 1 | GVK md. 94 muhtasar beyannameleri | **Tasdik edilebilir** | md. 7/A-b |

    | 2 | KDV iade hakkı doğuran işlem ve belgeler | **Tasdik edilebilir** | md. 7/C-b |

    | 3 | VİVK md. 10(a) servet incelemelerine konu bilançolar | **Tasdik edilebilir** | md. 7/D-a |

    | 4 | Emlak Vergisi beyannameleri | **Edilemez** | md. 7''de sayılan konu ve belgeler arasında yer almaz; Bakanlık kapsamı
    genişletmemiştir. |

    | 5 | Stok değerlemesi | **Edilemez** | md. 7/G-d kapsamındadır, ancak bu konuda Bakanlıkça **tebliğ çıkarılmadıkça**
    YMM''ler tasdik işlemi yapamaz. |

    | 6 | 6183 md. 105 terkin beyanları | **Tasdik edilebilir** | md. 7/E-b |


    Dolayısıyla 1, 2, 3 ve 6 numaralı talepler tasdik edilebilir; 4 ve 5 numaralı talepler tasdik edilemez.


    **(c) Planlama (4 puan)** (Tasdik Yön. md. 13)


    Planlamada şunlar gerekir: (i) işletmenin organizasyonu, iç kontrol sistemi, çalışma tarzı, üretim süreci, iş akışı ve
    sektörü hakkında araştırma; (ii) mali tablolar, önceki döneme ait çalışma kâğıtları ve tasdik raporları, vergi inceleme
    raporları ve diğer raporların gözden geçirilmesi; (iii) muhasebe politikasının incelenmesi ve yayımlanmış muhasebe standart
    ve ilkelerine uygunluğunun araştırılması; (iv) bilgi alınabilecek ve veri hazırlayacak işletme personelinin belirlenmesi
    ve koordinasyonun sağlanması; (v) **yazılı tasdik çalışma planının** hazırlanması.


    **(d) Yetkiler (4 puan)**


    (1) Gizli olsalar dahi tasdik konusuyla ilgili tüm defter, kayıt ve belgeleri incelemek, (2) iç denetçilerden bilgi istemek
    ve (3) yönetim kurulu ve genel kurul toplantılarına katılıp tasdik faaliyetini ve sonuçlarını ilgilendiren açıklamalar
    yapmak md. 12/1 kapsamındaki yetkilerdir. (5) Vergi incelemelerinde tarhiyat öncesi ve sonrası uzlaşmalarda mükellefle
    birlikte hazır bulunmak ve açıklama yapmak da md. 12/3 kapsamındadır. (4) numaralı işlem için ise kamu idare ve müesseselerinden
    bilgiler **yazı ile istenir**; yazıda **tasdik konusu ile ilgili husus ve sözleşme içeriği belirtilir** (md. 12/2); sözlü
    (telefonla) istem yönetmeliğe uygun değildir.

    '
