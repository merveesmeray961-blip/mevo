  soru: '**Olay:** Hesap dönemi takvim yılı olan Kayra Gıda A.Ş.''nin 2025 hesap dönemine ilişkin yıllık kurumlar vergisi
    beyannamesi ve ekli mali tablolarını tam tasdik eden yeminli mali müşavir (YMM) Selin Önal, tasdik raporunu 10 Nisan 2026''da
    düzenlemiştir. Raporda tasdikin kapsamı açıkça belirtilmiş; transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı konusu
    sözleşme ve rapor uyarınca **tasdik kapsamı dışında** bırakılmıştır. Eylül 2026''da şirket nezdinde yapılan vergi incelemesinde,
    şirketin matrah farkı (vergi ziyaı) şu kalemlerde tespit edilmiştir:


    | No | Konu | Matrah farkı (TL) | Tasdik kapsamında mı? |

    |---|---|---|---|

    | 1 | Stok değerlemesindeki hata | 640.000 | Evet |

    | 2 | Kayıt dışı kalan satışlar | 360.000 | Evet |

    | 3 | Transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı | 480.000 | Hayır (rapor ve sözleşmede açıkça kapsam dışı)
    |


    Bu vakada kurumlar vergisi oranı %25 olarak alınacaktır; tespitlerin tümü için vergi ziyaı cezası, 213 sayılı Vergi Usul
    Kanunu md. 344/1''in genel hükmü uyarınca kesilecektir (ziyaa uğratılan verginin bir katı); gecikme faizi/zammı hesaba
    katılmayacaktır. Tespitler dışında başka ceza veya vergi bulunmamaktadır.


    **İstenenler:**


    (a) Kayra Gıda A.Ş. adına tarh edilecek kurumlar vergisi farkını ve vergi ziyaı cezasını hesaplayınız; Selin Hanım''ın
    hangi kalemlerden, hangi tutarlar bakımından ve nasıl bir sorumlulukla (sorumluluğun niteliği ve uygulanacak hükümler
    dahil) sorumlu olduğunu açıklayınız. (9 puan)


    (b) Vergi idaresinin, tasdik raporu düzenlenmiş olmasına rağmen şirket nezdinde vergi incelemesi yapıp yapamayacağını;
    tasdik edilmiş konuların idarece nasıl kabul edileceğini açıklayınız. (4 puan)


    (c) Selin Hanım''ın sorumluluğunun kapsamına ilişkin olarak, Tasdik Yönetmeliği md. 20''ye göre tasdik konusuyla ilgili
    olarak Bakanlıkça tebliğlerle belirlenen hususların durumunu ve YMM''nin raporda yapması gereken açıklamayı belirtiniz.
    (6 puan)


    (d) Selin Hanım''ın sorumluluğunu yerine getirebilmesi amacıyla sorumluluk sigortası yaptırmasının zorunlu olup olmadığını;
    tasdik amacıyla yapılan inceleme ve denetimlerde doğacak zararların hukuki sorumluluğunun kime ait olduğunu belirtiniz.
    (6 puan)

    '
  cozum: '**(a) Hesaplama ve sorumluluk (9 puan)**


    | Kalem | Matrah farkı | KV (%25) | Vergi ziyaı cezası (1 kat) | Toplam |

    |---|---|---|---|---|

    | 1 Stok değerlemesi | 640.000 | 160.000 | 160.000 | 320.000 |

    | 2 Kayıt dışı satışlar | 360.000 | 90.000 | 90.000 | 180.000 |

    | 3 Örtülü kazanç dağıtımı | 480.000 | 120.000 | 120.000 | 240.000 |

    | **Şirket toplamı** | **1.480.000** | **370.000** | **370.000** | **740.000** |


    Vergi ziyaı cezası, ziyaa uğratılan verginin **bir katıdır** (VUK md. 344/1). Şirket adına toplam **370.000 TL** kurumlar
    vergisi farkı ve **370.000 TL** vergi ziyaı cezası söz konusudur.


    Selin Hanım, imza ve mühür kullanarak tasdik yaptığından **tasdik kapsamı ile sınırlı olmak üzere** tasdikin doğruluğundan
    sorumludur (Tasdik Yön. md. 20/1; Usul Yön. md. 41). Tasdik edilen konu ve belgelerin gerçeği yansıtmaması hâlinde ziyaa
    uğratılan vergilerden ve kesilecek cezalardan, VUK ve 3568 sayılı Kanun hükümleri uyarınca mükellefle birlikte **müştereken
    ve müteselsilen** sorumludur; bu sorumluluğun yerine getirilmesinde Borçlar Kanunu''nun **"Tam Teselsül"** hükümleri uygulanır
    (md. 20/2).


    Kapsam içi kalemler 1 ve 2''dir: (640.000 + 360.000) × %25 = **250.000 TL** vergi ve **250.000 TL** ceza; Selin Hanım''ın
    sorumluluğu **toplam 500.000 TL** ile sınırlıdır. Kalem 3 (240.000 TL, vergi ve ceza birlikte) tasdik kapsamı dışında
    olduğundan Selin Hanım bu kalemden sorumlu **değildir**; yalnızca şirket sorumludur.


    **(b) Vergi idaresinin yetkisi (4 puan)**


    Yönetmelik ve Bakanlığın diğer düzenlemeleri çerçevesinde tasdik edilmiş konu ve belgeler, kamu idaresinin yetkililerince
    **tasdikin kapsamı ölçüsünde incelenmiş olarak kabul edilir**. Ancak çeşitli kanunlarla kamu idaresine tanınan **inceleme
    ve teftiş yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır** (md. 4/3). Bu nedenle vergi idaresi,
    tasdik raporu bulunmasına rağmen vergi incelemesi yapabilir; özellikle tasdik kapsamı dışında kalan kalem 3 bakımından
    inceleme tamamen idarenin takdirindedir.


    **(c) Kapsam ve rapor (6 puan)**


    Tasdik konusuyla ilgili olarak Bakanlıkça tebliğlerle belirlenen hususların **tasdik kapsamı içinde mutlaka araştırılması
    ve incelenmesi zorunludur** (md. 20/1). YMM, yaptığı **tasdikin kapsamını raporda açıkça belirtir** (Usul Yön. md. 41/2).
    Bu vakada kapsam dışı bırakılan konunun rapor ve sözleşmede açıkça belirtilmiş olması, kalem 3 bakımından sorumluluğu
