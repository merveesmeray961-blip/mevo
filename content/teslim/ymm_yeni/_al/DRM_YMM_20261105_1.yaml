  kazanimlar:
  - çalışma kâğıtlarının içeriği, mülkiyeti ve saklama süresi
  - sürekli denetimde aylık çalışma kâğıdı zorunluluğu ve resmî defterlerin mühürlenmesi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Olay:** Yeminli mali müşavir (YMM) Mehmet Kılıç, geçmiş yıllarda yaptığı tasdik çalışmalarının dosyalarını bürosunda
    arşivlemektedir. Arşivdeki bazı çalışma dosyalarına ilişkin bilgiler şöyledir (tarih: 5 Kasım 2026):


    | Dosya | Müşteri ve tasdik dönemi | Dosyanın düzenlendiği yıl | Durum |

    |---|---|---|---|

    | A | Durak Otomotiv A.Ş., 2023 hesap dönemi | 2024 | Hukuki ihtilaf yoktur. |

    | B | Eser Tekstil A.Ş., 2021 hesap dönemi | 2022 | Tasdik konusuyla ilgili olarak 2025 yılında açılan dava 2026 sonunda
    hâlâ sürmektedir. |

    | C | Güler Gıda A.Ş., 2015 hesap dönemi | 2016 | Hukuki ihtilaf yoktur. Mehmet Bey dosyayı 5 Kasım 2026''da imha etmek
    istemektedir. |

    | D | Bora Kimya Ltd. Şti., 2012 hesap dönemi | 2013 | Hukuki ihtilaf yoktur. |


    Mehmet Bey, Durak Otomotiv A.Ş.''nin 2026 hesap dönemi için sürekli denetimi kapsayan tam tasdik sözleşmesi uyarınca Ocak–Ekim
    2026 döneminde hazırladığı çalışma kâğıtlarını da incelemiştir. Bu dönemde Mart ve Temmuz aylarına ilişkin hiçbir çalışma
    kâğıdının bulunmadığı, diğer aylar için çalışma kâğıtlarının hazırlandığı görülmüştür. Ayrıca üç çalışma kâğıdının başlığı
    şöyledir:


    | Kâğıt | Başlıktaki bilgiler |

    |---|---|

    | 1 | Müşteri adı, dönem (2026), konu (kasa sayımı), hazırlayan YMM''nin adı ve paraflı imzası yer almakta; hazırlama
    tarihi yoktur. |

    | 2 | Dönem (2026), konu (banka teyitleri), hazırlama tarihi, hazırlayan YMM''nin adı ve parafı yer almakta; denetlenen
    müşterinin adı yoktur. |

    | 3 | Müşteri adı, dönem, konu, hazırlama tarihi ve hazırlayan YMM''nin adı yer almakta; hazırlayan YMM''nin parafı yoktur.
    |


    Durak Otomotiv A.Ş. yönetimi, "bedeli ödenen çalışmaların kâğıtlarının mülkiyetinin işletmeye ait olduğunu" ileri sürerek
    bütün kâğıtların kendisine teslimini istemiştir.


    **İstenenler:**


    (a) A, B, C ve D dosyalarının Tasdik Yönetmeliği''ne göre hangi yılın sonuna kadar saklanması gerektiğini gösteriniz;
    B dosyasındaki dava 31.12.2032 itibarıyla hâlâ sürüyorsa dosyanın durumunu, C dosyasının 5 Kasım 2026''da imha edilip
    edilemeyeceğini ve D dosyasının imha edilip edilemeyeceğini belirtiniz. (9 puan)


    (b) 1, 2 ve 3 numaralı çalışma kâğıtlarının başlıklarındaki eksiklikleri Tasdik Yönetmeliği md. 17 uyarınca tespit ediniz.
    (5 puan)


    (c) Çalışma Usul ve Esasları Yönetmeliği md. 56''ya göre bir yılı kapsayan denetimlerde çalışma kâğıtlarına ilişkin aylık
    zorunluluğu açıklayınız, Ocak–Ekim 2026 döneminde kaç ayın çalışma kâğıdının eksik olduğunu bulunuz; ayrıca YMM''nin yaptığı
    tasdik işlemiyle ilgili denetimlerde resmî defterler ve gerekli görülen belge ve kayıtlara ilişkin yapılması gereken işlemi
    belirtiniz. (6 puan)


    (d) Yönetimin, çalışma kâğıtlarının mülkiyetinin işletmeye ait olduğu yönündeki iddiasını değerlendiriniz; çalışma kâğıtlarının
    yetkili mercilerce istenmesi hâlinde ne yapılması gerektiğini belirtiniz. (5 puan)

    '
  cozum: '**(a) Saklama süreleri (9 puan)**


    Çalışma kâğıtları dosya içinde, **düzenlenmelerini izleyen yıldan itibaren 10 yıl** süreyle saklanır (Tasdik Yön. md.
    17/son; Usul Yön. md. 56 da on yıl saklamayı öngörür). Süre, düzenleme yılını izleyen yılın başından başlar; dolayısıyla
    düzenleme yılına 10 eklenerek bulunan yılın sonunda dolar.


    | Dosya | Düzenleme yılı | İlk saklama yılı | Saklama süresi sonu | Sonuç |

    |---|---|---|---|---|

    | A | 2024 | 2025 | 31.12.2034 | 2034 yıl sonuna kadar saklanır. |

    | B | 2022 | 2023 | 31.12.2032 | Dava sürdüğünden, 31.12.2032''de de imha edilemez; **ihtilafın sonuçlanmasına kadar**
    saklanır. |

    | C | 2016 | 2017 | 31.12.2026 | 5.11.2026''da süre henüz dolmamıştır; **imha edilemez**, en az 31.12.2026''ya kadar saklanır.
    |

    | D | 2013 | 2014 | 31.12.2023 | Süre dolmuş, ihtilaf yok; **imha edilebilir**. |


    **(b) Başlık eksiklikleri (5 puan)**


    Çalışma kâğıdı başlığı; denetlenen müşteriyi, denetlemenin yapıldığı dönemi, kâğıdın konusunu, hazırlayan YMM''nin **ad
    ve paraflarını** ve hazırlama tarihini içermelidir (Tasdik Yön. md. 17/a).


    - Kâğıt 1: **hazırlama tarihi** eksik.

    - Kâğıt 2: **denetlenen müşteri** eksik.

    - Kâğıt 3: hazırlayan YMM''nin **parafı** eksik (ad ve parafın ikisi birlikte aranır).


    **(c) Aylık denetim ve mühürleme (6 puan)**


    Bir yılı kapsayan denetimlerde denetimin **en az her ay yapılması** ve çalışma kâğıtlarının **aylık denetim faaliyetlerini
    göstermesi** zorunludur (Usul Yön. md. 56). Ocak–Ekim 2026 arası 10 aydır; 8 ay için kâğıt vardır, **Mart ve Temmuz**
    için yoktur: **2 ay eksiktir**. YMM''nin yaptığı tasdik işlemiyle ilgili denetimlerde resmî defterler ile gerekli görülen
    belge ve kayıtlar **tarih ve imza atılarak mühürlenir** (Usul Yön. md. 56/2).


    **(d) Mülkiyet ve ibraz (5 puan)**


    Çalışma kâğıtlarının **mülkiyeti YMM''ye aittir** (Tasdik Yön. md. 17); yönetimin iddiası yerinde değildir ve kâğıtların
    teslimi zorunlu değildir. Kâğıtların, dosya içinde saklanması ve yetkili mercilere **istenildiğinde ibraz edilmesi zorunludur**.

    '
