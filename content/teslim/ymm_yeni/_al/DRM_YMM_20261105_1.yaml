klasik:
- id: TASLAK
  sinav: ymm
  ders: DRM
  konu: YMM
  kazanimlar:
  - hata ve hilelerin düzeltilmesi, bildirimi ve olumsuz rapor
  - denetim raporu çeşitleri ve "ilgili mevzuata uygundur" ibaresi
  - sürekli denetimli tasdik raporunun içeriği
  zorluk: 2
  puan: 22
  sure_dk: 30
  soru: '**Olay:** Hesap dönemi takvim yılı olan Akpınar Plastik A.Ş., 2026 hesap dönemi mali tablolarının sürekli denetimi
    kapsayan tam tasdiki için yeminli mali müşavir (YMM) Gülden Aras ile yazılı sözleşme yapmıştır. Gülden Hanım''ın Ekim–Aralık
    2026 döneminde yürüttüğü çalışmada aşağıdaki hususlar belirlenmiştir:


    | No | Tespit |

    |---|---|

    | 1 | Toplam 180.000 TL tutarındaki üç gider faturasının dönemsellik ilkesine aykırı biçimde 2027 yılı kayıtlarına alındığı
    görülmüştür. Gülden Hanım hatayı düzeltme önerisiyle birlikte yönetime bildirmiş, yönetim kayıtları düzeltmiştir. |

    | 2 | Stok hesabında 410.000 TL tutarında sayım farkının kayıtlara yansıtılmadığı görülmüştür. Düzeltme önerisi yönetime
    bildirilmiş; yönetim kaydı düzeltmeyi reddetmiştir. |

    | 3 | Muhasebe müdürünün, gerçekte alınmamış bir danışmanlık hizmeti için 275.000 TL tutarında fatura düzenlettirip gider
    yazdığı anlaşılmıştır. Bu eylem suç teşkil etmektedir; yönetim düzeltme önerisini kabul etmemiştir. |


    Aşağıdaki (b) ve (c) isteklerindeki durumlar birbirinden bağımsızdır.


    **İstenenler:**


    (a) 1, 2 ve 3 numaralı tespitlerin her biri bakımından Gülden Hanım''ın izlemesi gereken yolu Tasdik Yönetmeliği md. 16
    ile Çalışma Usul ve Esasları Yönetmeliği md. 57 çerçevesinde açıklayınız; hata ve hilelerin önlenmesi veya ortaya çıkarılmasındaki
    temel sorumluluğun kime ait olduğunu belirtiniz. (8 puan)


    (b) Çalışma Usul ve Esasları Yönetmeliği md. 59''a göre denetim raporu çeşitlerini sayınız; aşağıdaki durumlarda Gülden
    Hanım''ın hangi çeşit rapor düzenleyeceğini gerekçesiyle belirtiniz: (i) Yalnız 1 numaralı hata bulunmakta, düzeltme yapılmış
    ve YMM tabloların gerçek durumu yansıttığı kanaatindedir. (ii) Yönetim, bir şubedeki stokların sayımına izin vermemiş
    ve bu nedenle YMM''nin denetim kapsamı sınırlanmıştır. (iii) 2 numaralı hata düzeltilmemiş ve YMM tabloların gerçek durumu
    yansıtmadığı kanaatine varmıştır. (8 puan)


    (c) Akpınar Plastik A.Ş.''nin serbest muhasebeci mali müşavirinin kendi hazırladığı denetim raporuna "ilgili mevzuata
    uygundur" ibaresini yazdığı görülmüştür. Bu ibarenin kullanımına ilişkin kuralı açıklayarak serbest muhasebeci mali müşavirin
    raporunu ve Gülden Hanım''ın tasdik içeren raporunu değerlendiriniz. (3 puan)


    (d) Gülden Hanım''ın raporunda denetimin sürekli denetime mi yoksa dönem kapandıktan sonra yapılan denetime mi dayandığının
    belirtilmesi gerekip gerekmediğini ve sürekli denetimi gerektiren tasdik raporunda hangi hususların belirtileceğini açıklayınız.
    (3 puan)

    '
  cozum: '**(a) Hata ve hilelerin ele alınışı (8 puan)**


    | No | Yapılacak işlem | Dayanak |

    |---|---|---|

    | 1 | Hata düzeltme önerisiyle yönetime bildirilmiş ve **yönetim düzeltmiştir**; bu durumda tasdik konusu belgeler tasdik
    edilir. | Tasdik Yön. md. 16/2 |

    | 2 | Düzeltilmesi istenmiş ancak **düzeltilmemiştir**; durum bir raporla ilgili mercilere bildirilir. Çalışma Usul Yön.
    md. 57''ye göre düzeltme yapılmaması hâlinde durum md. 59 (c) bendindeki **olumsuz raporla** mali mercilere aksettirilir.
    | Tasdik Yön. md. 16/2; Usul Yön. md. 57 |

    | 3 | Hileli bir durumun tespiti hâlinde de durum bir raporla ilgili mercilere bildirilir. Eylem **suç teşkil ettiğinden**
    adli yargıya intikali gerekli hâllerin yetkili mercilere duyurulması **mecburidir**. | Tasdik Yön. md. 16/2; Usul Yön.
    md. 57 |


    Hata ve hilelerin önlenmesi veya ortaya çıkarılmasındaki temel sorumluluk **işletme yönetimi ve yeminli mali müşavire**
    aittir (Tasdik Yön. md. 16/1). YMM, önemli etkileri olabilecek hata ve hileleri düzeltecek veya ortaya çıkaracak şekilde
    çalışmayı planlamak ve yürütmekle yükümlüdür.


    **(b) Rapor çeşitleri (8 puan)**


    Çalışma Usul Yön. md. 59''a göre denetim raporları **olumlu rapor, şartlı denetim raporu ve olumsuz rapor** olmak üzere
    üç çeşittir.


    | Durum | Rapor çeşidi | Gerekçe |

    |---|---|---|

    | (i) | Olumlu rapor | Hata düzeltilmiş, YMM olumlu görüşe sahiptir; md. 59 (a). |

    | (ii) | Şartlı denetim raporu | Denetim kapsamındaki sınırlama (sayıma izin verilmemesi) söz konusudur; md. 59 (b). |

    | (iii) | Olumsuz rapor | YMM tabloların gerçek durumu yansıtmadığı kanaatine varmıştır; md. 59 (c). |


    **(c) "İlgili mevzuata uygundur" ibaresi (3 puan)**


    SMMM''lerce düzenlenen raporlarda ve YMM''lerce düzenlenen **tasdiki ihtiva etmeyen** raporlarda bu ibare **kullanılmaz**;
    bunun yerine ilgili mevzuat hükümlerinin açıkça yazılması zorunludur. İbare **yalnızca tasdiki ihtiva eden YMM raporlarında**
    kullanılabilir (Usul Yön. md. 60). Dolayısıyla serbest muhasebeci mali müşavirin raporu kurala aykırıdır; Gülden Hanım''ın
    tasdik içeren raporunda ibare kullanılabilir.


    **(d) Denetimin dayanağı ve rapor içeriği (3 puan)**


    Denetimin sürekli denetime mi yoksa dönemin kapanmasından sonra yapılan denetime mi dayandığı tasdik raporunda **açıkça
    belirtilir** (Tasdik Yön. md. 8/1). Sürekli denetlemeyi gerektiren tasdik raporlarında, mali tablo ve raporlar üzerinde
    doğrudan veya dolaylı etkisi olan veya olması muhtemel her türlü **mevzuat aykırılıkları** ile mali tabloların **genel
    kabul görmüş muhasebe ilkelerine uygun hazırlanıp hazırlanmadığı** belirtilir (Tasdik Yön. md. 19).

    '
