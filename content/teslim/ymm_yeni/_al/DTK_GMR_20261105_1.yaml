  kok: 4458 sayılı Kanun'a göre geçici depolanan eşya hakkında aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Eşyaya her türlü elleçleme yasaktır; numune alınması ve incelenmesi için dahi hiçbir izin verilemez.
    B: Eşya, işlem görmüş ürün elde edilecek biçimde işlenebilir; yeter ki gümrük idaresine önceden bilgi verilsin.
    C: Eşya, gümrük idaresinin belirlemediği bir yerde de depolanabilir; yalnızca teminat alınması gerekir.
    D: Görünüş ve teknik özellikleri değişmemek koşuluyla, yönetmelikle belirlenen elleçlemeye tabi tutulabilir.
    E: Eşya sahibi, gözetim altındaki eşyayı ilk bulunduğu yerden idareden izin almaksızın kaldırabilir.
  dogru: D
  aciklama:
    dogru_neden: Md. 49'a göre, md. 41 hükümleri saklı kalmak üzere, geçici depolanan eşya görünüş ve teknik özelliklerinin
      değiştirilmemesi koşuluyla aynı durumda muhafazalarını sağlamak üzere yönetmelikle belirlenen elleçlemeye tabi tutulabilir.
    celdiriciler:
      A: Md. 49 elleçlemeye izin verir; md. 41 de inceleme ve numune alınmasına izin verilebileceğini düzenler.
      B: Elleçleme, görünüş ve teknik özelliklerin değiştirilmemesi koşuluyla yapılabilir; işleme faaliyeti yapılamaz.
      C: Md. 48/1 geçici depolamayı yalnız idarelerin uygun gördüğü yerlerde ve belirledikleri koşullarda mümkün kılar.
      E: Md. 45/3 eşyanın konulduğu ilk yerden idarenin izni olmaksızın kaldırılamayacağını düzenler.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 49 (başı)
    alinti: geçici depolanan eşya, görünüş ve teknik özelliklerinin değiştirilmemesi koşuluyla, aynı durumda muhafazalarını
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 49 (devamı)
    alinti: sağlamak üzere yönetmelikle belirlenen elleçlemeye tabi tutulabilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 48/1
    alinti: Geçici depolanan eşya, sadece gümrük idarelerinin uygun gördüğü yerlerde ve bu idarelerin belirlediği koşullarda
      depolanabilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 45/3
    alinti: Eşya konulduğu ilk yerden gümrük idarelerinin izni olmaksızın kaldırılamaz.
