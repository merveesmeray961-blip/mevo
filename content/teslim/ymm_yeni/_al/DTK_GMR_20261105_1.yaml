  konu: GMR
  kazanim: ticaret politikası önlemleri ve menşe izlenimi (md. 55-56)
  tip: uygulama
  zorluk: 2
  kok: Çin menşeli ayakkabıların ambalajında "Made in Italy" ibaresi ve İtalyan bayrağı simgesi bulunmaktadır. İthalatçı eşyayı
    serbest dolaşıma sokmak istemektedir. 4458 sayılı Kanun'un 56. maddesine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Eşyanın ithaline izin verilmez; ancak transit geçişine, antrepo ve benzeri yerlere konulmasına ya da yeniden ihracına
      Müsteşarlıkça izin verilebilir.
    B: Eşya, gümrük vergisi ve ek mali yükümlülük ödenmesi koşuluyla serbest dolaşıma sokulabilir; ibare ayrıca incelenmez.
    C: Eşyanın bu fıkra kapsamında olup olmadığında tereddüt hâlinde Gümrük Müsteşarlığının görüşü kesin olarak esas alınır.
    D: İbarelerin kaldırılması veya gerçek menşein gösterilmesi amacıyla hiçbir elleçleme faaliyetine izin verilemez.
    E: Eşyanın transit geçişine ve yeniden ihracına da izin verilemez; yalnızca imha edilebilir.
  dogru: A
  aciklama:
    dogru_neden: Md. 56/1'e göre üzerinde veya ambalajında üretildiği ülkeden başka bir ülke ürünü olduğunu gösteren veya
      böyle izlenim uyandıran isim ya da simgeler taşıyan eşyanın Türkiye'ye ithaline izin verilmez. Transit geçiş, antrepo
      ve benzeri yerlere konulma veya yeniden ihraç ise Müsteşarlıkça izin verilebilir. Tereddüt hâlinde Sanayi ve Ticaret
      Bakanlığının görüşü esas alınır; isim/simgelerin kaldırılması için elleçleme faaliyetlerine izin verilebilir.
    celdiriciler:
      B: Md. 56/1, başka ülke ürünü izlenimi uyandıran eşyanın ithaline izin vermez.
      C: Tereddüt hâlinde Sanayi ve Ticaret Bakanlığının görüşü esas alınır.
      D: Md. 56/1 son cümlesi, bu amaçla yönetmelikle belirlenen elleçleme faaliyetlerine izin verilebileceğini belirtir.
      E: Transit geçiş, antrepoya konulma ve yeniden ihraç için Müsteşarlıkça izin verilebilir.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 56/1 (ilk iki cümle)
    alinti: Gerek üzerlerinde, gerek iç ve dış ambalajlarında üretildiği ülkeden başka bir ülke ürünü olduğunu gösteren veya
      böyle bir izlenim uyandıran isim ya da simgeler taşıyan eşyanın Türkiye'ye ithaline izin verilmez. Bu gibi eşyanın Türkiye'den
      transit geçişine veya antrepo ve benzeri yerlere konulmasına ya da yeniden ihracına Müsteşarlıkça izin verilebilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 56/1 (ek cümleler)
    alinti: Eşyanın bu fıkra kapsamında olup olmadığının belirlenmesinde tereddüt edilen durumlarda, Sanayi ve Ticaret Bakanlığının
      görüşü esas alınarak işlem yapılır. Söz konusu isim ve simgelerin kaldırılması veya eşyanın gerçek menşeinin gösterilmesi
      amacıyla, usul ve esasları yönetmelikle belirlenecek elleçleme faaliyetlerine izin verilebilir.
