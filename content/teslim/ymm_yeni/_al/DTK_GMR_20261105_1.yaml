  soru: '**Toros Gıda İthalat A.Ş.** (Türkiye''de yerleşik), 14/9/2026 tarihinde üç kalemli bir serbest dolaşıma giriş beyannamesini
    tescil ettirmiştir. Beyannamenin tescili gümrük yükümlülüğü doğurmuştur; eşya yasaklayıcı veya kısıtlayıcı bir önleme
    tabi değildir; başka ithalat vergisi yoktur (KDV dikkate alınmayacaktır). Veriler:


    | Kalem | Beyan | Vergi oranı | Durum |

    |---|---|---|---|

    | 1 | Gümrük kıymeti 800.000 TL | %10 | Muayene edilmemiştir; vergisi ödenmiştir |

    | 2 | 5 ton kuru incir; gümrük kıymeti ton başına 100.000 TL | %15 | Muayene edilmiş, eşyanın 6 ton olduğu görülmüştür;
    vergi ödenmemiş, teminat verilmemiştir |

    | 3 | Gümrük kıymeti 300.000 TL | %5 | Muayene edilmemiştir; vergisi için teminat verilmiştir |


    Not: Kalem 2''de ton başına gümrük kıymeti muayeneyle değişmemiştir.


    **İstenenler:**


    (a) Her kalem için gümrük vergisini hesaplayınız; 2. kalemde hangi bilgilerin esas alınacağını gerekçesiyle belirtiniz;
    toplam vergiyi ve beyan edilen miktara göre hesaplanacak vergiden farkını bulunuz. (7 puan)


    (b) 4458 sayılı Kanun''un 69. maddesine göre hangi kalemlerin eşyasının teslim edilebileceğini, teslim edilebilecek kalemlerin
    toplam gümrük kıymetini ve teslim edilemeyecek kalemin teslimi için yapılması gereken işlemi (tutarıyla) açıklayınız.
    (7 puan)


    (c) Şirket, başka bir ithalatında basitleştirilmiş usulden yararlanmak istemektedir. Eşyanın rejime geçişinin kayıt yoluyla
    yapılması hâlinde: kayıt tarihinin önemini, eşyanın gümrüğe sunulması yükümlülüğünü ve tamamlayıcı beyanın niteliği ile
    hukuki sonucunu açıklayınız. (6 puan)


    (d) Toros Gıda''nın eşyasını Yunanistan''da yerleşik (H) S.A. adına, geçici ithalat rejimi ve serbest dolaşıma giriş rejimi
    için ayrı ayrı beyan edecek olması hâlinde, beyan sahibinin yerleşik olma koşulunun bu iki beyan bakımından durumunu açıklayınız.
    (5 puan)'
  cozum: '**(a) Kalem bazlı vergi**


    Md. 65/2''ye göre beyanname kapsamı eşya muayene edilmişse muayene sonuçları, edilmemişse beyannamedeki bilgiler gümrük
    rejimi hükümlerinin uygulanmasında esas alınır. Bu nedenle 1. ve 3. kalemde beyan bilgileri, 2. kalemde muayene sonucu
    (6 ton) esas alınır.


    | Kalem | Kıymet (TL) | Oran | Vergi (TL) |

    |---|---|---|---|

    | 1 | 800.000 | %10 | 80.000 |

    | 2 | 6 × 100.000 = 600.000 | %15 | 90.000 |

    | 3 | 300.000 | %5 | 15.000 |

    | **Toplam** | | | **185.000** |


    Beyan edilen miktara göre 2. kalem vergisi: 5 × 100.000 × %15 = 75.000 TL; toplam 170.000 TL. Fark = 185.000 − 170.000
    = **15.000 TL**.


    **(b) Teslim (md. 69)**


    Aynı beyanname kapsamı eşyanın tümünün aynı anda teslimi esastır; ancak birden çok kalemli beyannamede her kaleme ilişkin
    bilgiler ayrı bir beyanname konusu eşya gibi değerlendirilir (md. 69/2). Gümrük yükümlülüğü doğmuşsa vergiler ödenmedikçe
    veya teminata bağlanmadıkça eşya teslim edilemez (md. 69/3).


    - 1. kalem: vergi ödenmiş → teslim edilir.

    - 3. kalem: vergi için teminat verilmiş → teslim edilir (teminat ödemeye eşdeğer yoldur).

    - 2. kalem: ne ödeme ne teminat → teslim edilemez.


    Teslim edilebilecek kalemlerin gümrük kıymeti = 800.000 + 300.000 = **1.100.000 TL**. 2. kalemin teslimi için muayene
    sonucuna göre hesaplanan **90.000 TL** vergi ödenmeli veya teminata bağlanmalıdır.


    **(c) Basitleştirilmiş usul (md. 71)**


    - Gümrük idareleri, yönetmelikle belirlenen şartlarla eşyanın rejime geçişinin kayıt yoluyla yapılmasına izin verebilir;
    bu durumda beyan sahibi eşyayı gümrüğe sunma yükümlülüğünden muaf tutulabilir.

    - Kayıt yoluyla işlem yapılan hâllerde kayıt tarihinin yazılması şarttır; kayıt, eşyanın teşhisi için gerekli bilgileri
    kapsamak zorundadır.

    - Beyan sahibi genel, dönemsel veya özet niteliğinde bir tamamlayıcı beyanda bulunur.

    - Tamamlayıcı beyanlar ile basitleştirilmiş usule ilişkin beyanlar ayrılmaz bir bütündür ve basitleştirilmiş işleme ilişkin
    beyannamelerin tescil tarihinden itibaren hüküm ifade eder; kayıt işlemi, normal beyannamenin tescili ile aynı hukuki
    sonucu doğurur.


    **(d) Yerleşik olma koşulu (md. 62/2)**


    Bir beyannamenin tescilinin belirli bir kişi için özel yükümlülükler getirmesi hâlinde beyanın o kişi tarafından veya
    hesabına yapılması ve beyan sahibinin Türkiye Gümrük Bölgesinde yerleşik olması gerekir. Bu koşul, transit veya geçici
    ithalat beyanında bulunanlara ve idarelerin uygun bulması koşuluyla arızi beyanda bulunanlara uygulanmaz. Dolayısıyla
    geçici ithalat beyanında yerleşik olma koşulu aranmaz; serbest dolaşıma giriş beyanında ise (arızi beyan istisnası saklı
    kalmak üzere) beyan sahibinin yerleşik olması gerekir. Toros Gıda yerleşik olduğundan kendisi beyan sahibi olarak bu koşulu
    sağlar.'
