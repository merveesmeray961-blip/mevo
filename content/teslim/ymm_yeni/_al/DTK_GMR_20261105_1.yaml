  soru: '(Z) Dış Ticaret A.Ş., tek bir taşıma belgesi kapsamında gelen üç farklı tarife pozisyonundaki eşya için serbest dolaşıma
    giriş beyannamesini 7/8/2026 (Cuma) tarihinde tescil ettirmiştir. Beyannamenin kalemleri (tescil tarihinde geçerli gümrük
    vergisi oranlarıyla) aşağıdadır; başka ithalat vergisi, resim veya harç yoktur ve KDV dikkate alınmayacaktır:


    | Kalem | Eşya | Gümrük kıymeti | Gümrük vergisi oranı |

    |---|---|---|---|

    | 1 | Plastik mutfak kapları | 1.000.000 TL | %5 |

    | 2 | Cam sofra takımları | 1.400.000 TL | %10 |

    | 3 | Elektrikli ısıtıcılar | 600.000 TL | %20 |


    **İstenenler:**


    (a) Her kalemin kendi tarife pozisyonuna göre gümrük vergisini ve toplam gümrük vergisini hesaplayınız; hesapta esas alınacak
    tarifenin hangi tarihe göre belirlendiğini belirtiniz. (4 puan)


    (b) Her kalem için ayrı işlem yapılmasının ek iş yükü ve masrafa yol açacağını ileri süren şirket, 4458 sayılı Kanun''un
    76. maddesine göre talepte bulunmuş ve idare talebi kabul etmiştir. Ödenecek toplam gümrük vergisini ve (a) şıkkına göre
    farkı hesaplayınız; md. 76''nın uygulanma koşullarını açıklayınız. (8 puan)


    (c) (b) şıkkındaki talebin yapılmadığını varsayınız. 14/8/2026 tarihinde Cumhurbaşkanı Kararıyla 3. kalemdeki eşyanın
    gümrük vergisi oranı %20''den %12''ye indirilmiş, diğer oranlar değişmemiştir. Vergiler 18/8/2026 tarihinde ödenmiştir.
    (i) Gümrük işlemlerinin idarece yaptırılan tahlilin gecikmesi nedeniyle uzadığı durumda; (ii) işlemlerin şirketin gerekli
    belgeleri vermemesi nedeniyle tamamlanamadığı durumda ödenecek toplam gümrük vergisini ayrı ayrı hesaplayınız ve dayanağınızı
    açıklayınız. (8 puan)


    (d) Şirket, 2. kalemin gümrük kıymetini hatalı beyan ettiğini fark ederek 12/8/2026''da beyannamenin düzeltilmesini istemiştir.
    İdare, eşyanın muayene edileceğini şirkete 11/8/2026''da bildirmiştir. Düzeltme talebi kabul edilir mi? Eşya 20/8/2026''da
    teslim edilmiş olsaydı, düzeltmenin yolu ne olurdu? (5 puan)'
  cozum: '**(a) Kalem bazında vergi**


    Gümrük vergileri, gümrük yükümlülüğünün başladığı tarihte (burada beyannamenin tescil tarihi 7/8/2026) yürürlükte olan
    tarifeye göre hesaplanır (md. 15/1). Eşya ticaretine ilişkin tedbirler gerektiğinde eşyanın kendi tarife pozisyonuna göre
    uygulanır.


    | Kalem | Kıymet (TL) | Oran | Vergi (TL) |

    |---|---|---|---|

    | 1 | 1.000.000 | %5 | 50.000 |

    | 2 | 1.400.000 | %10 | 140.000 |

    | 3 | 600.000 | %20 | 120.000 |

    | **Toplam** | 3.000.000 | | **310.000** |


    **(b) Md. 76 uygulaması**


    Md. 76''ya göre bir taşıma belgesinin içeriği eşya değişik tarife pozisyonlarına giriyorsa ve her eşya için kendi pozisyonuna
    göre işlem yapılması ek iş yükü ve masrafa yol açıyorsa, beyan sahibinin talebi üzerine gümrük idareleri eşyanın tamamına
    en yüksek ithalat vergi oranına tabi eşyanın tarife pozisyonuna göre vergi uygulayabilir. Koşullar: (1) tek taşıma belgesi
    içeriği eşyanın değişik pozisyonlarda olması; (2) ayrı işlemin ek iş yükü ve masraf doğurması; (3) beyan sahibinin talebi;
    (4) idarenin uygulama takdiri (''uygulayabilirler'').


    Vergi = 3.000.000 × %20 = **600.000 TL**; fark = 600.000 − 310.000 = **290.000 TL** (şirketin aleyhine; bu nedenle talep
    yalnız işlem kolaylığı sağlar, vergi avantajı sağlamaz).


    **(c) Oran indirimi (md. 75)**


    Md. 75/1: Beyan sahibi, tarımsal mali yükler dışındaki ithalat vergi oranlarının beyannamenin tescilinden sonra, vergilerin
    ödenmesinden veya teminata bağlanmasından önce indirilmesi hâlinde lehine olan oranı isteyebilir. Tescil 7/8, indirim
    14/8, ödeme 18/8 olduğundan zaman koşulu sağlanmıştır.


    | Durum | 1. kalem | 2. kalem | 3. kalem | Toplam |

    |---|---|---|---|---|

    | (i) İdare kaynaklı gecikme (md. 75/1 uygulanır) | 50.000 | 140.000 | 600.000 × %12 = 72.000 | **262.000 TL** |

    | (ii) Beyan sahibi kaynaklı gecikme (md. 75/2: md. 75/1 uygulanmaz) | 50.000 | 140.000 | 120.000 | **310.000 TL** |


    (i) bakımından lehe oranın uygulanması beyan sahibinin istemine bağlıdır; (ii) bakımından tescil tarihindeki oran (md.
    15/1) geçerlidir.


    **(d) Beyannamenin düzeltilmesi**


    Md. 63: Başka bir eşyanın beyanı sonucunu doğurmaması kaydıyla beyan sahibinin talebi üzerine beyannamedeki bilgiler düzeltilebilir;
    ancak (a) muayene edileceğinin bildirilmesinden, (b) bilgilerin yanlış olduğunun tespit edilmesinden, (c) md. 73 saklı
    kalmak üzere eşyanın teslim edilmesinden sonra düzeltme yapılmasına izin verilmez. Muayene bildirimi 11/8''de yapıldığından
    12/8 tarihli talep **kabul edilmez**. Eşya 20/8''de teslim edilmiş olsaydı, md. 63/c gereği düzeltme izni verilmezdi;
    ancak md. 73/2''ye göre gümrük idareleri kendi yetkileri doğrultusunda veya beyan sahibinin talebi üzerine, yönetmelikte
    belirlenen usul ve esaslar çerçevesinde beyannamenin düzeltilmesini eşyanın tesliminden sonra da yapabilir (teslimden
    sonra düzeltme yolu).'
