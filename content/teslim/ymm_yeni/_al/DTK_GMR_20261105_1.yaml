  tip: uygulama
  zorluk: 1
  kok: (P) A.Ş. yetkilisi, yazılı gümrük beyannamesinde eşya miktarını yanlış yazdığını fark etmiş, hatalı rakamı silip üzerine
    doğrusunu yazarak beyannameyi imzalayıp gümrük idaresine vermiştir. 4458 sayılı Kanun'un 60. maddesine göre beyannameye
    ilişkin işlem nasıl yapılmalıdır?
  secenekler:
    A: Silinti beyan sahibince imzalandığından, beyanname olduğu gibi kabul edilir ve doğrudan tescil edilir.
    B: Beyannamenin tamamı geçersiz sayılır; düzeltme imkânı bulunmadığından yeniden beyanname verilmesi şarttır.
    C: Beyanname kabul edilmez; hata çizilip doğrusu yazılarak beyan sahibince imzalanmalı ve tescilde resmî mühürle mühürlenmelidir.
    D: Silinti, gümrük müşavirinin onayı ile geçerli olur; ayrıca beyan sahibinin imzası aranmaz.
    E: Silinti yalnızca ilgili gümrük müdürünün yazılı izni hâlinde düzeltilmiş sayılabilir.
  dogru: C
  aciklama:
    dogru_neden: Md. 60/3'e göre kazıntılı ve silintili beyannameler gümrük idarelerince kabul edilmez. Hatalı yazının üzeri
      okunacak şekilde çizilerek yanına doğrusu yazılır, beyan sahibi imzalar ve tescil sırasında resmî mühürle mühürlenirse
      beyanname düzeltilmiş olur.
    celdiriciler:
      A: Kazıntılı ve silintili beyannameler imza ile geçerli hâle gelmez; kabul edilmez.
      B: Md. 60/3 hatanın çizilerek düzeltilmesine imkân tanır.
      D: Düzeltmede beyan sahibinin imzası ve tescilde resmî mühür aranır.
      E: Kanun düzeltmeyi müdür iznine değil, çizme-imza-mühür usulüne bağlar.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 60/3
    alinti: Kazıntılı ve silintili beyannameler gümrük idarelerince kabul edilmez. Ancak, beyannameler hatalı yazının üzeri
      okunacak şekilde çizilerek yanına doğrusu yazılıp beyan sahibi tarafından imzalanarak ve tescil sırasında resmi mühürle
      mühürlenerek düzeltilir.
