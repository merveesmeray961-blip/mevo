    işlemleri tamamlanmıştır. Sonradan, Türkiye'nin yaptığı tercihli bir tarife anlaşmasının koşullarının eşya bakımından
    eksiksiz sağlandığı görülmüş ve şirket tercihli tarifenin uygulanmasını istemiştir. Sabit oranlı vergilendirme söz konusu
    değildir. 4458 sayılı Kanun'un 15. maddesine göre değerlendirme nasıl yapılır?
  secenekler:
    A: Gerekli koşulların yerine getirilmesi hâlinde talep, gümrük işlemlerinin tamamlanmasından veya eşyanın tesliminden
      sonra da yapılabilir.
    B: Tercihli tarife talebi yalnızca beyannamenin tescilinden önce yapılabilir; teslimden sonra yapılan talep reddedilir.
    C: Talep, koşullar sağlansa bile yalnız eşyanın tesliminden sonraki ilk muayene tamamlanmadan yapılabilir.
    D: Talep yalnızca sabit oranlı vergilendirme uygulanan eşyada teslimden sonra yapılabilir; diğer eşyada mümkün değildir.
    E: Beyan sahibi tercihli tarife yerine genel tarife oranını uygulatmak zorundadır; tercihli tarife talep edilemez.
  dogru: A
  aciklama:
    dogru_neden: Md. 15/4'e göre sabit oranlı vergilendirme hükümleri saklı kalmak üzere, 3. fıkranın (d), (e) ve (f) bentlerindeki
      koşulları taşıyan eşyada beyan sahibi, (c) bendindeki genel tarife yerine bu bentlerdeki tercihli uygulamayı isteyebilir.
      Gerekli koşullar yerine getirilmişse bu talep işlemler tamamlandıktan veya eşya teslim edildikten sonra da yapılabilir.
    celdiriciler:
      B: Md. 15/4 talebin işlemlerin tamamlanmasından veya teslimden sonra da yapılabileceğini açıkça belirtir.
      C: Böyle bir sınırlama Kanun'da yoktur; koşulların yerine getirilmesi yeterlidir.
      D: Md. 15/4 sabit oranlı vergilendirme hükümlerini saklı tutar; teslim sonrası talep hakkını sabit oranlı eşyaya özgü
        kılmaz.
      E: Md. 15/4 koşulları taşıyan eşyada beyan sahibine tercihli uygulamayı isteme hakkı tanır.
