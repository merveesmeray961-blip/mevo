  tip: uygulama
  zorluk: 3
  kok: (Ü) A.Ş.'nin tek bir serbest dolaşıma giriş beyannamesi üç kalemden oluşmaktadır. Beyannamenin tescili gümrük yükümlülüğü
    doğurmuştur. 1. kalem eşyasının vergileri (80.000 TL) ödenmiş; 2. kalem eşyasının vergileri (75.000 TL) ne ödenmiş ne
    de teminata bağlanmış; 3. kalem eşyasının vergileri (15.000 TL) için teminat verilmiştir. Eşya yasaklayıcı veya kısıtlayıcı
    bir önleme tabi değildir; geçici ithalat rejimi söz konusu değildir. 4458 sayılı Kanun'un 69. maddesine göre aşağıdakilerden
    hangisi doğrudur?
  secenekler:
    A: Aynı beyanname kapsamı eşyanın tümünün aynı anda teslimi esas olduğundan, 2. kalemin vergisi ödenmedikçe hiçbir kalem
      eşyası teslim edilemez.
    B: Teslim için vergi ödenmesi şart değildir; üç kalem de teslim edilir ve 2. kalemin vergisi daha sonra ayrıca tahsil
      edilir.
    C: Yalnız 1. kalem eşyası teslim edilebilir; teminat vergi ödemesi yerine geçmediğinden 3. kalem eşyası teslim edilemez.
    D: 1., 2. ve 3. kalemin vergileri toplamı karşılanmış sayıldığından üç kalem de birlikte topluca teslim edilir.
    E: Kalemler ayrı değerlendirildiğinden 1. ve 3. kalem teslim edilir; 2. kalem, vergisi ödenmedikçe veya teminata bağlanmadıkça
      teslim edilemez.
  dogru: E
  aciklama:
    dogru_neden: 'Md. 69/2''ye göre aynı beyannamenin tüm eşyasının aynı anda teslimi esastır; ancak çok kalemli beyannamede
      her kalemin bilgileri ayrı bir beyanname konusu eşya gibi değerlendirilir. Md. 69/3''e göre gümrük yükümlülüğü doğmuşsa
      vergiler ödenmedikçe veya teminata bağlanmadıkça eşya teslim edilemez. Dolayısıyla 1. kalem (ödenmiş) ve 3. kalem (teminatlı)
      teslim edilir; 2. kalem teslim edilemez. Püf noktaları: ''tümünün aynı anda teslimi esas'' kuralına takılmayın, kalemlerin
      ayrı değerlendirildiğini unutmayın; teminat da ödeme kadar geçerli bir yoldur; tutarlar (toplam 170.000 TL) çözümü etkilemeyen
      gereksiz veridir.'
    celdiriciler:
      A: Md. 69/2 ikinci paragrafı, çok kalemli beyannamede her kalemi ayrı beyanname gibi değerlendirir.
      B: Md. 69/3 vergi ödenmedikçe veya teminata bağlanmadıkça teslimi yasaklar.
      C: Md. 69/3'te vergilerin ödenmesi 'veya teminata bağlanması' alternatif olarak sayılmıştır; teminatlı 3. kalem teslim
        edilir.
      D: Ödenmeyen ve teminata bağlanmayan 2. kalem için vergi veya teminat aranır; kalemler birbirinin vergisini karşılamaz.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 69/2
    alinti: Aynı beyanname kapsamı eşyanın tümünün aynı anda teslimi esastır. Bu fıkranın uygulamasında, bir beyannamenin
      iki veya daha fazla kalemi kapsaması halinde, her kaleme ilişkin bilgiler ayrı bir beyanname konusu eşya gibi değerlendirilir.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 69/3
    alinti: Beyannamenin tescilinin bir gümrük yükümlülüğü doğurması halinde, gümrük vergileri ödenmedikçe veya teminata bağlanmadıkça
      beyanname kapsamı eşya teslim edilemez.
