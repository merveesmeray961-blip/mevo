  konu: GMR
  kazanim: beyanın doğruluğunun araştırılması ve muayene (md. 65)
  tip: kavrama
  zorluk: 2
  kok: Bir gümrük beyannamesi kapsamı eşya muayene edilmiş ve miktarın beyandan fazla olduğu görülmüştür; işlemleri tamamlanıp
    teslim edilen başka bir beyannamenin eşyası ise sonradan ikinci kez muayene edilmek istenmektedir. 4458 sayılı Kanun'un
    65. maddesine göre aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Muayene edilen eşyada da beyannamedeki bilgiler esas alınır; muayene sonuçları yalnızca ceza uygulamasında dikkate
      alınır.
    B: İşlemleri tamamlanmış eşyanın ikinci muayenesi, eşya teslim edildikten sonra hiçbir koşulda ve hiçbir yetkilice yapılamaz.
    C: İkinci muayeneyi yalnızca beyan sahibinin talebi üzerine gümrük müşaviri yapabilir.
    D: Muayene edilen eşyada muayene sonuçları esas alınır; yetkili personel, tamamlanmış işlemin ikinci muayenesini her zaman
      yapabilir.
    E: Beyannameyi kontrol edenler ve muayeneyi yapanlar, yaptıkları işlemlerden hiçbir şekilde sorumlu tutulamaz.
  dogru: D
  aciklama:
    dogru_neden: Md. 65/2'ye göre beyanname kapsamı eşya muayene edilmişse muayene sonuçları, edilmemişse beyannamedeki bilgiler
      gümrük rejimi hükümlerinin uygulanmasında esas alınır. Md. 65/3'e göre belirli gümrük görevlileri, muayenesi yapılmış
      ve işlemleri tamamlanmış eşyanın ikinci muayenesini her zaman yapabilir ve gümrük işlemlerini her aşamada denetleyebilir.
    celdiriciler:
      A: Muayene yapılmışsa rejim hükümlerinin uygulanmasında muayene sonuçları esas alınır; beyan bilgileri muayene edilmeyen
        eşyada esastır.
      B: Md. 65/3 yetkililere işlemleri tamamlanmış eşyanın ikinci muayenesini her zaman yapabilme yetkisi verir.
      C: İkinci muayene yetkisi md. 65/3'te sayılan gümrük personeline aittir; beyan sahibinin talebine bağlı değildir.
      E: Md. 65/4 bu kişileri vergi hesabı ve muafiyet uygulamasından tek başına veya müteselsilen sorumlu tutar.
  kaynaklar:
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 65/2
    alinti: Beyanname kapsamı eşyanın muayene edilmesi halinde, muayene sonuçları, muayene edilmemesi halinde ise beyannamede
      yer alan bilgiler, eşyanın tabi olduğu gümrük rejimi hükümlerinin uygulanmasında esas alınır.
  - mevzuat: 4458 sayılı Gümrük Kanunu
    madde: md. 65/3
    alinti: Kontrol amacıyla gümrük müfettişleri, gümrük müfettiş yardımcıları, kontrolörler, stajyer kontrolörler ve gümrük
      idare amirleri muayenesi yapılmış ve işlemleri tamamlanmış eşyanın ikinci muayenesini her zaman yapabilirler. Keza,
      sözü edilenler gümrük işlemlerini her aşamada denetlemeye yetkilidirler.
