  dogru: B
  aciklama:
    dogru_neden: Md. 38/1'e göre beklenmeyen hâller veya mücbir sebep nedeniyle md. 33 ve md. 34/1 ile 3'teki yükümlülüklere
      uyulamazsa, yükümlülüğe tabi kişi veya onun yerine hareket edenler en yakın gümrük idaresini gecikmeksizin durumdan
