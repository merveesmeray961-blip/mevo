    alinti: Sabit oranlı vergilendirmeye ilişkin hükümler saklı kalmak üzere, 3 üncü fıkranın (d), (e) ve (f) bentlerinde
      belirtilen koşulları taşıyan eşyanın ithalinde, beyan sahibi (c) bendinde belirtilen tarife yerine (d), (e) ve (f) bentleri
