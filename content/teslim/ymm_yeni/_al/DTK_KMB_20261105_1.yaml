      ay = (2026 - 2026) * 12 + (8 - 3) - (1 if 25 < 10 else 0)

      zam = ust_getirilmis * 4 * ay // 100

      toplam_a = ust_getirilmis + zam

      r2 = 60000 * 43

      muvazaa = r2

      tekerrur = 2 * r2

      ilk_tesebbus = r2 // 2

      rb = 800000

      alt = rb // 2

      ust = rb * 2

      kisi_alt = alt

      toplam_alt = kisi_alt * 2

      tesebbus_kisi = alt // 2

      tesebbus_toplam = tesebbus_kisi * 2

      yetkisiz = 250000

      sonuc = {"a1": ceza_getirilmemis, "a2": ust_getirilmis, "a_zam": zam, "a_toplam": toplam_a, "b1": muvazaa, "b2": tekerrur,
      "b3": ilk_tesebbus, "c_alt": alt, "c_ust": ust, "c_toplam": toplam_alt, "c_tesebbus": tesebbus_toplam, "d": yetkisiz}

