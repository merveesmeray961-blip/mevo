    - Son gün resmî tatile rastlarsa süre, tatili izleyen ilk iş gününün çalışma saati sonunda biter (md. 22/2; Tebliğ md.
    15/1).


    **(a) Son günler (Tebliğ 2018-32/48 md. 3 ve 5)**


