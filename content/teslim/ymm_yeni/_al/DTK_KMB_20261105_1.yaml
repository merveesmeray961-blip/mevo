      \ 30, 31, 30, 31][mm - 1]\n    return (yy, mm, min(d, gun))\ndef tatil_sonrasi(t):\n    z = dfc(t[0], t[1], t[2])\n\
      \    while hg(z) >= 5:\n        z = z + 1\n    return cfd(z)\n\ndef fmt(t):\n    return \"%02d.%02d.%04d\" % (t[2],\
      \ t[1], t[0])\nadres = tatil_sonrasi(is_gun(2026, 3, 16, 30))\nyk = tatil_sonrasi(is_gun(2026, 5, 25, 10))\nara_ham\
