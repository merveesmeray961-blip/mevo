  sure_dk: 30
  soru: '(Y) Yetkili Müessese A.Ş. A grubu bir yetkili müessesedir ve bağımsız denetime tabidir. Cumartesi ve Pazar günleri
    resmî tatildir; başka resmî tatil dikkate alınmayacaktır. 1 ABD doları = 40 TL kabul edilecektir. Şirketin 2026 yılındaki
    olayları şunlardır:


    | No | Olay | Tarih |

    |---|---|---|

    | 1 | Merkez adresi, aynı faaliyet bölgesi içinde başka bir adrese taşınmış ve yeni adreste işe başlanmıştır | 16.03.2026
    (Pazartesi) |

    | 2 | Yönetim kurulu üyelerinden birinin iletişim bilgileri değişmiştir | 25.05.2026 (Pazartesi) |

    | 3 | Bir şube faaliyete ara vermiştir | 02.07.2026 (Perşembe) |

    | 4 | Ödenmiş sermaye artırılmış ve artırım Ticaret Sicili Gazetesinde tescil ve ilan edilmiştir | 14.09.2026 (Pazartesi)
    |

    | 5 | Yabancı para alım satım hesabı bankada açılmıştır | 03.08.2026 (Pazartesi) |


    Şirketin 2026 yılında yaptığı bazı müşteri işlemlerinin tutarı: 4.000 TL, 4.040 TL, 4.800 TL, 3.960 TL ve 400.000 TL''dir.


    **İstenenler:**


    (a) 1–5 numaralı olaylara ilişkin bildirimlerin Bakanlığa yapılacağı son günleri gösteriniz; yalnız 1 numaralı olayda
    ayrıca yapılması gereken ikinci bildirimi belirtiniz. (12 puan)


    (b) 2025 yılına ilişkin yıllık bilanço ve kâr/zarar tablolarının Bakanlığa gönderilmesi ve bağımsız denetim raporunun
    internet sitesinde yayımlanması için son günleri belirleyiniz. (4 puan)


    (c) Müşteri işlemlerinden hangileri için müşterinin T.C. Kimlik/Pasaport/Vergi Kimlik Numarası temin edilerek kayıt altına
    alınmalıdır? Kimlik numaralarının nasıl kontrol edileceğini ve belge ile kayıtların en az ne kadar süre saklanacağını
    belirtiniz. (6 puan)


    (d) Yetkili müesseselerin gerçekleştirdikleri her işlem için hangi numarayı vermesi gerektiğini ve ön ödemeli kartlara
    ilişkin işlemlerde kimlik tespitinin tutar sınırı bakımından nasıl yapılacağını yazınız. (3 puan)

    '
  cozum: "Kaynak: Tebliğ 2018-32/45 md. 17/4, 19/2-5, 19/9-10, 20/1-2, 20/6, 21/2; 32 sayılı Karar md. 22.\n\n**(a) Bildirim\
    \ süreleri**\n\n| No | Dayanak | Hesap | Son gün |\n|---|---|---|---|\n| 1 | md. 17/4 – yeni adreste işe başlanılan tarihten\
    \ 30 gün | 16.03.2026 + 30 gün | **15.04.2026 (Çarşamba)** |\n| 2 | md. 19/3 – değişiklik tarihinden 10 gün | 25.05.2026\
    \ + 10 gün | **04.06.2026 (Perşembe)** |\n| 3 | md. 19/5 – ara verme tarihinden 10 gün | 02.07.2026 + 10 gün = 12.07.2026\
    \ (Pazar) | **13.07.2026 (Pazartesi)** |\n| 4 | md. 19/9 – değişiklik tarihinden 30 gün | 14.09.2026 + 30 gün | **14.10.2026\
    \ (Çarşamba)** |\n| 5 | md. 19/10 – açılış tarihinden 30 gün | 03.08.2026 + 30 gün | **02.09.2026 (Çarşamba)** |\n\nMerkez\
    \ adres değişikliğinde (md. 17/4) vergi dairesinden alınan belgelerle birlikte bildirim yapılması yanında, yeni adresin\
    \ tescil ve ilan edildiği **Ticaret Sicili Gazetesi nüshası** da işe başlanılan tarihten itibaren 30 gün içinde Bakanlığa\
    \ gönderilir. Başka bir tespit yoksa işe başlama tarihi olarak adresin Ticaret Siciline tescil tarihi esas alınır.\n\n\
    **(b) Yıllık belgeler**\n\n- Yıllık bilanço ve kâr/zarar tablolarının onaylı örnekleri, ilgili oldukları yılı takip eden\
    \ yılın en geç **Nisan ayı sonuna** kadar gönderilir (md. 19/2): 2025 yılı için **30.04.2026**.\n- Bağımsız denetime tabi\
    \ yetkili müessesenin bağımsız denetim raporu, internet sitesinde ilgili yılı takip eden yılın en geç **Haziran ayı sonuna**\
    \ kadar yayımlanır (md. 19/4): **30.06.2026**.\n\n**(c) Kimlik tespiti**\n\n- 100 ABD Doları ve/veya karşılığı Türk Lirası\
    \ tutarını **aşan** işlemler için kimlik numarası alınıp her işlem itibarıyla kayıt altına alınır (md. 20/6). 100 ABD\
    \ Doları = 4.000 TL olduğundan sınır **eşit ise gerekmez**, aşılırsa gerekir:\n  - 4.000 TL → gerekmez; 3.960 TL → gerekmez;\n\
    \  - 4.040 TL → gerekir; 4.800 TL → gerekir; 400.000 TL → gerekir.\n- T.C. Kimlik/Pasaport numarası, vezne görevlilerince\
    \ kişinin fotoğrafının yer aldığı T.C. Kimlik Kartı veya Pasaport üzerinden kontrol edilir; Vergi Kimlik Numarası ise\
    \ buna ek olarak kişinin şirket adına işlem yapmaya yetkili olduğunu gösteren belgelerden kontrol edilir (md. 20/6).\n\
    - Düzenlenen belgeler ve tutulan kayıtlar **en az 5 yıl** süreyle saklanır (md. 20/1-c).\n\n**(d) Benzersiz işlem numarası\
    \ ve ön ödemeli kartlar**\n\n- Yetkili müesseseler gerçekleştirdikleri **her işleme benzersiz işlem numarası** vermek\
    \ zorundadır (md. 20/2); numaranın usul ve esaslarını Bakanlık belirler.\n- Ön ödemeli kartlara ilişkin yapılan **tüm\
    \ işlemlerde tutar sınırlaması olmaksızın** kimlik bilgilerinin tespiti zorunludur (md. 21/2).\n"
