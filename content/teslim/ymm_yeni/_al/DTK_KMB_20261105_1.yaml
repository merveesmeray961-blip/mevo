    - Gün olarak ifade edilen sürelerde işlemin yapıldığı gün hesaba katılmaz; günler ertesi günden başlar ve süre son günün
    çalışma saati sonunda biter (32 sayılı Karar md. 22; Tebliğ 2008-32/34 md. 15/1-2).

