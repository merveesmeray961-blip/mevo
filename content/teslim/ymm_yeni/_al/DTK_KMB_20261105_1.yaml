  kazanimlar:
  - yetkili müesseselerde adres, ortak/yönetici bilgisi ve faaliyete ara verme bildirimleri
  - yıllık bilanço ve bağımsız denetim raporu yükümlülükleri
  - kimlik tespiti ve belge düzeni yükümlülükleri
  zorluk: 3
