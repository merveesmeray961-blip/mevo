  soru: '(T) A.Ş. hem 1567 sayılı Kanun md. 4/1-(a) kapsamında ticari amaçla döviz alım satımı faaliyet iznine hem de md.
    4/1-(b) kapsamında Borsa İstanbul Kıymetli Madenler Piyasasında üye olarak faaliyette bulunma iznine sahiptir. Hesap kolaylığı
    için başvuru tarihinde geçerli ücret tarifeleri şöyle kabul edilecektir: 1 sayılı tarife 6.000.000 TL, 2 sayılı tarife
    4.000.000 TL. (Bu tutarlar, her yıl yeniden değerleme oranında artırılan ve Cumhurbaşkanınca değiştirilebilen tarife tutarları
    yerine kullanılan varsayımsal tutarlardır.)


    Şirketin ortağı Bay (P), sahip olduğu payların tamamını (%100) aşağıdaki kişilere devredecektir ve devirler için Bakanlığa
    izin başvurusu yapılmıştır:


    | Devralan | Pay oranı | Devrin niteliği |

    |---|---|---|

    | Yabancı bir ticaret şirketi | %30 | Satış |

    | Bay (P)''nin oğlu | %20 | Satış |

    | Bir mahkeme kararından kaynaklanan devir | %10 | Mahkeme kararı gereği devir |

    | Vefat eden eski ortağın paylarının mirasçıya intikali | %15 | Veraset yoluyla intikal |

    | Bay (P)''nin iş ortağı olan bir gerçek kişi | %25 | Satış |


    **İstenenler:**


    (a) Pay devri izni için her bir faaliyet izni bakımından alınacak ücreti ve toplam ücreti hesaplayınız; ücret alınmayan
    devirleri gerekçesiyle belirtiniz. (12 puan)


    (b) Ücretlerin kime yatırılacağını, ücretlerin yıl içinde ve yıllar itibarıyla nasıl belirlendiğini (yeniden değerleme,
    ilk başvuru tarihi, Cumhurbaşkanının yetkisi) açıklayınız. (5 puan)


    (c) Bu şirket hakkında kambiyo mevzuatına aykırı fiilleri ihbar eden bir kişiye, hükmolunan para cezalarından tahsil edilen
    2.000.000 TL üzerinden verilebilecek en yüksek ikramiye tutarını hesaplayınız. (4 puan)


    (d) Kanuna göre hükmolunan para cezalarının hangi usulle tahsil edileceğini ve bu şirket gibi faaliyet izni verilen anonim
    şirketlerin hukuki statüsünü ve izninin iptal edilebileceği hâli belirtiniz. (4 puan)

    '
  cozum: 'Kaynak: 1567 sayılı Kanun md. 4, md. 5, Ek md. 3, Ek md. 4.


    **(a) Pay devri ücreti**


    - Pay devri izinlerinde ilgili tarifede belirtilen ücret, **devralınacak pay oranı nispetinde ve her faaliyet izni için
    ayrı ayrı** alınır (md. 4). Şirket iki faaliyet iznine sahip olduğundan her iki tarife için ayrıca hesaplanır.

    - Devre konu payların **veraset yoluyla intikal etmesi** (%15), **pay devrinin mahkeme kararından kaynaklanması** (%10)
    veya payları devralacak kişinin mevcut pay sahibinin **altsoyu** olması (oğul, %20) hâlinde ücret alınmaz. Bu devirlerin
    toplamı %45''tir.

    - Ücrete tabi devirler yabancı şirket (%30) ve iş ortağı gerçek kişi (%25) olmak üzere **%55**''tir; iş ortağı üçüncü
    kişi olduğundan muafiyet kapsamında değildir.


    | Faaliyet izni | Tarife | Hesap | Ücret |

    |---|---|---|---|

    | Ticari döviz alım satımı | 6.000.000 TL | 6.000.000 × %55 | **3.300.000 TL** |

    | Borsa İstanbul Kıymetli Madenler Piyasası üyeliği | 4.000.000 TL | 4.000.000 × %55 | **2.200.000 TL** |

    | **Toplam** | | | **5.500.000 TL** |


    **(b) Ücretin ödenmesi ve belirlenmesi**


    - Tahsil edilecek ücretler **vergi dairelerine** yatırılır.

    - Tarife tutarları her yıl, bir önceki yıla ilişkin olarak 213 sayılı VUK uyarınca belirlenen **yeniden değerleme oranında
    takvim yılı başından geçerli olmak üzere artırılarak** alınır.

    - Tarifelerdeki ücretlerin tahsilinde Bakanlığa yapılan **ilk başvuru tarihi itibarıyla geçerli ücret** dikkate alınır.

    - Cumhurbaşkanı tarifelerdeki tutarları **iki katına kadar artırmaya ve yarısına kadar indirmeye** yetkilidir.


    **(c) İhbar ikramiyesi**


    Ek md. 3: Kanuna aykırı fiilleri ihbar edenlere verilecek ikramiyenin miktarı, hükmolunacak para cezalarından tahsil edilecek
    miktarın **%45''ini geçemez**. 2.000.000 × %45 = **900.000 TL**.


    **(d) Para cezalarının tahsili ve şirketlerin statüsü**


    - Gerçek ve tüzel kişiler hakkında hükmolunacak para cezaları, 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun
    hükümlerine göre tahsil edilir (Ek md. 4).

    - Kanun ve ona dayanılarak çıkarılan mevzuat kapsamında faaliyet izni verilen anonim şirketler **6102 sayılı TTK md. 330
    kapsamında özel kanuna tabi anonim şirket** sayılır ve yalnızca belirlenen ekonomik amaç ve konularda kurulup faaliyet
    gösterebilir (md. 5). Bu amaç ve konulara **aykırı faaliyette bulunduğunun tespiti** hâlinde Bakanlık şirketin **izinlerini
    iptal etmeye** yetkilidir (md. 4/2).

    '
