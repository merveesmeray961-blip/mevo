    Cumhurbaşkanınca 3218 sayılı Kanun md. 7''deki oranlarda bir değişiklik yapılmamıştır. 2026 yılı işlemleri (tutarlar TL):


    | No | İşlem | Değer |

    |---|---|---|

    | 1 | Yurt dışından doğrudan bölgeye getirilen hammadde | CIF 4.000.000 |

    | 2 | Bölgedeki yatırım ve tesis safhasında kullanılacak, yurt dışından getirilen makine | CIF 2.500.000 |

    | 3 | Kapasite artırmak amacıyla yurt dışından getirilen makine | CIF 1.000.000 |

    | 4 | Bölgede üretilen mamulün Türkiye''ye çıkarılması | FOB 3.000.000 |

    | 5 | Türkiye''de yerleşik, gerçek usulde KDV mükellefi (T) Kimya A.Ş.''nin, (U)''ya ait bölgedeki depoya teslim ettiği
    kimyasal; fatura (U) adınadır, mal serbest bölgeye ulaşmış ve ihracat rejimi işlemleri tamamlanmıştır | KDV hariç 1.500.000
    |


    KDV oranı %20''dir.


    **İstenenler:**


    (a) 1–4 numaralı işlemler için serbest bölge kullanıcısınca ödenecek ücretleri hesaplayınız; ücrete tabi olmayanları gerekçesiyle
    belirtiniz. (9 puan)


    (b) 5 numaralı teslimin (T) A.Ş. bakımından KDV''si ne olur? Gerekçesini md. 12/1''e dayandırınız. Mal bölgeye vasıl olmasaydı
    hesaplanacak KDV''yi bulunuz. (7 puan)


    (c) 1 numaralı ve 5 numaralı işlemlerde eşyanın gümrük idarelerine sunulması ve gümrük işlemine tabi tutulması gerekip
    gerekmediğini 4458 sayılı Kanun md. 155''e göre açıklayınız; serbest bölgeye giren eşya için genel kural nedir? (5 puan)


    (d) Eşyanın serbest bölgelerde kalabileceği süre bakımından kural nedir? (4 puan)

    '
  cozum: '**(a) Ücret hesabı (3218 md. 7)**


    Yurt dışından bölgeye getirilen malların CIF değeri üzerinden **binde 1**, bölgeden Türkiye''ye çıkarılan malların FOB
    değeri üzerinden **binde 9** oranında peşin ücret ödenir (md. 7/1-b). Yatırım ve tesis safhasında kullanılan mallar ile
    tevsi ve kapasite artırmak amacıyla getirilen mallar bu ücrete tabi tutulmaz (md. 7/2).


    | No | Değer | Oran | Ücret |

    |---|---|---|---|

    | 1 | CIF 4.000.000 | binde 1 | **4.000** |

    | 2 | CIF 2.500.000 | Ücrete tabi değil (yatırım ve tesis safhası) | 0 |

    | 3 | CIF 1.000.000 | Ücrete tabi değil (kapasite artırımı) | 0 |

    | 4 | FOB 3.000.000 | binde 9 | **27.000** |


    Toplam ücret = 4.000 + 27.000 = **31.000 TL**.


    **(b) KDV**


    İhracat teslimi sayılması için teslim serbest bölgedeki alıcıya yapılmalı ve mal gümrük bölgesinden çıkarak serbest bölgeye
    vasıl olmalıdır (md. 12/1-a, b). Her iki şart gerçekleştiğinden (T) A.Ş.''nin teslimi ihracat teslimidir ve md. 11/1-a
    uyarınca KDV''den müstesnadır: **hesaplanacak KDV 0 TL**. Mal bölgeye vasıl olmasaydı ihracat teslimi şartları gerçekleşmeyecek
    ve teslim vergiye tabi olacaktı: 1.500.000 × %20 = **300.000 TL**.


    **(c) Gümrüğe sunma (GK md. 155)**


    Genel kural: Serbest bölgeye giren eşyanın gümrük idarelerine sunulmasına ve beyanname verilmesine gerek yoktur (md. 155/1).
    Ancak istisnalar vardır (md. 155/2): serbest bölgeye ihracat kaydıyla konulan eşya ile doğrudan Türkiye Gümrük Bölgesi
    dışından gelen eşyanın gümrük idarelerine sunulması ve gerekli gümrük işlemine tabi tutulması **şarttır**. Bu nedenle
    1 numaralı işlemdeki hammadde (doğrudan yurt dışından gelen) ve 5 numaralı işlemdeki kimyasal (ihracat rejimi ile bölgeye
    konulan) gümrük idarelerine sunulmalı ve gerekli gümrük işlemine tabi tutulmalıdır.


    **(d) Kalış süresi (GK md. 156)**


    Eşyanın serbest bölgelerde kalabileceği süre **sınırsızdır**.

    '
