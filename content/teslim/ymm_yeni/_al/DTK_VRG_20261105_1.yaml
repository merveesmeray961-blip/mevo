    Dönem içinde alış faturalarında gösterilen KDV: 1., 3. ve 4. işlemlerle ilgili **340.000 TL**; 2. ve 5. işlemlerle ilgili
    **120.000 TL**''dir (hepsinde indirim hakkı vardır, kısmi indirim gerektiren ortak gider yoktur). Önceki dönemden devreden
    KDV yoktur.


    **İstenenler:**


    (a) Her işlemin KDV Kanunu md. 11/1-(a) ve md. 12 bakımından ihracat istisnası kapsamında olup olmadığını gerekçesiyle
    belirleyiniz. (10 puan)


    (b) Dönemin hesaplanan KDV''sini, indirilecek KDV''sini ve indirimle giderilemeyen KDV tutarını bulunuz. (6 puan)


    (c) İstisna kapsamındaki işlemlere ait yüklenilen KDV''nin, md. 30/(a)''ya rağmen hangi hükme dayanarak indirilebileceğini
    ve indirilemeyen KDV''nin nasıl bir sonuç doğuracağını, genel kural (md. 29/2) ile karşılaştırarak açıklayınız. (5 puan)


    (d) Bu işlemlerden doğan iade talebi için en geç hangi tarihe kadar başvurulabileceğini belirtiniz. (4 puan)

    '
  cozum: '**(a) İstisna analizi**


    Yurt dışındaki müşteri; ikametgâhı, işyeri, kanuni ve iş merkezi yurt dışında olan alıcılar ile yurt içindeki bir firmanın
    yurt dışında kendi adına müstakilen faaliyet gösteren şubeleridir. Hizmetin istisna kapsamında olması için hizmet yurt
    dışındaki bir müşteri için yapılmalı **ve** hizmetten yurt dışında faydalanılmalıdır (md. 12/2). Serbest bölgelerdeki
    müşteriler için fason hizmette hizmet serbest bölgede faaliyet gösteren müşteri için yapılmalı ve hizmetten serbest bölgede
    faydalanılmalıdır (md. 12/3).


    | No | Değerlendirme | İstisna? | Bedel |

    |---|---|---|---|

    | 1 | Yurt dışı müşteri + yurt dışında faydalanma (md. 12/2) | Evet | 1.200.000 |

    | 2 | Müşteri yurt dışında yerleşik, ancak hizmetten Türkiye''de faydalanılıyor; 2. şart yok | **Hayır** – %20 KDV | 400.000
    |

    | 3 | Fason hizmet, serbest bölgede faaliyet gösteren müşteri, bölgede faydalanma (md. 12/3) | Evet | 800.000 |

    | 4 | Yurt içindeki firmanın yurt dışındaki müstakil şubesi "yurt dışındaki müşteri" sayılır (md. 12/2) ve Bakü''de faydalanılıyor
    | Evet | 300.000 |

    | 5 | Yurt içi hizmet | Hayır – %20 KDV | 1.000.000 |


    İstisna kapsamındaki bedel = 1.200.000 + 800.000 + 300.000 = **2.300.000 TL**.


    **(b) Dönem hesabı**


    - Hesaplanan KDV = (400.000 + 1.000.000) × %20 = **280.000 TL**

    - İndirilecek KDV = 340.000 + 120.000 = **460.000 TL**

    - İndirimle giderilemeyen KDV = 460.000 − 280.000 = **180.000 TL**


    **(c) Md. 30/(a) – md. 32 – md. 29/2**


    Md. 30/(a) gereği vergiden istisna edilmiş işlemlerle ilgili alış vesikalarındaki KDV kural olarak indirilemez. Ancak
    md. 11 kapsamındaki istisna işlemlerle ilgili KDV, **md. 32** uyarınca mükellefin vergiye tabi işlemleri üzerinden hesaplanacak
    KDV''den indirilir. Vergiye tabi işlemlerin mevcut olmaması veya hesaplanan verginin indirilecek vergiden az olması hâlinde
    indirilemeyen KDV, md. 32 uyarınca **iade edilir**. Genel kuralda ise (md. 29/2) indirilecek KDV hesaplanan KDV''den fazlaysa
    fark sonraki dönemlere **devrolunur ve iade edilmez**. Dolayısıyla burada 180.000 TL fark, istisna işlemlerin yarattığı
    iade hakkı nedeniyle (istisna işlemlere ait yüklenilen KDV olan 340.000 TL''yi aşmadığı için) iade talebine konu olabilir.


    **(d) Süre**


    İndirilemeyen KDV, işlemin gerçekleştiği dönemi izleyen **ikinci takvim yılının sonuna kadar** talep edilmelidir (md.
    32). İşlem Ocak 2026 dönemindedir; izleyen birinci yıl 2027, ikinci yıl 2028''dir. Son gün **31.12.2028**''dir.

    '
