    Bakanlığı tarafından belirlenen ayrıntılı usul, asgari tutar ve sınır kapısı şartlarının tamamen sağlandığı kabul edilecektir.


    **Olay 1.** Türkiye''de ikamet etmeyen Alman uyruklu Bay (X), Antalya''da üç ayrı satıcıdan aşağıdaki malları satın almış,
    satıcılar KDV''yi fiyata dahil ederek tahsil etmiştir:


    | Mal | KDV dahil bedel (TL) | KDV oranı |

    |---|---|---|

    | Deri mont | 24.000 | %20 |

    | Kuru meyve | 5.500 | %10 |

    | Cep telefonu | 7.200 | %20 |


    Bay (X) Türkiye''den çıkarken deri mont ve cep telefonuna ilişkin fatura/belgeleri gümrükten malların çıkışı sırasında
    ibraz etmiş; kuru meyveyi Türkiye''de tüketmiş ve belgesini ibraz etmemiştir.


    **Olay 2.** Türkiye''de ikametgâhı, işyeri, kanuni ve iş merkezi bulunmayan, Kazakistan''da yerleşik (K) Lojistik, 2026''da
