    satış bedelidir ve imalatçı bu teslimler için KDV tahsil etmemiştir:


    | Teslim | Teslim tarihi | Bedel (TL) | Sonuç |

    |---|---|---|---|

    | T1 | 12.01.2026 | 2.000.000 | İhracatçı malı 28.04.2026''da ihraç etmiştir. |

    | T2 | 10.02.2026 | 1.500.000 | Mal hiç ihraç edilmemiştir; mücbir sebep de yoktur. Tecil edilen vergi 26.03.2026''da
    tahakkuk ettirilmiş, 26.07.2026''da ödenmiştir. |

    | T3 | 18.03.2026 | 1.000.000 | Mal, Vergi Usul Kanunu''nda belirtilen mücbir sebep nedeniyle ihraç edilememiştir. Tecil
    edilen vergi 26.04.2026''da tahakkuk ettirilmiş, 26.07.2026''da ödenmiştir. |


    Hesap kolaylığı için; 6183 sayılı Kanun md. 51''e göre belirlenen gecikme zammı oranının **aylık %3,5**, md. 48''e göre
    tecil faizi oranının **aylık %2,5** olduğu ve faiz/zammın yalnız tam aylar için, basit faiz yöntemiyle hesaplanacağı varsayılacaktır.


    (Ç) A.Ş., T1 teslimi nedeniyle ihracat tamamlandıktan sonra **450.000 TL** yüklenilen KDV için iade talep etmiştir. T1
