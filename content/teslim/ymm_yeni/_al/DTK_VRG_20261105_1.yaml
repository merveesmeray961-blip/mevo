    (b) İmalatçıya iade edilebilecek KDV''nin üst sınırını hesaplayarak talep edilen 450.000 TL''nin ne kadarının iade edilebileceğini
    belirtiniz. (6 puan)


    (c) Mücbir sebep veya beklenmedik durum nedeniyle üç aylık sürede ihracat yapılamayan bir ihracatçının ek süre için başvuru
    koşullarını, ek sürenin azami uzunluğunu ve süreyi verebilecek makamları açıklayınız. (4 puan)


    (d) Tecil veya terkin edilen KDV bakımından ihracatçının (Z) A.Ş. açısından KDV Kanunu md. 32 uygulanır mı? Açıklayınız.
    (4 puan)

    '
  cozum: '**(a) Tecil, terkin ve zam/faiz**


    İhraç kayıtlı teslimde imalatçı KDV tahsil etmez; vergi beyan edilir, vergi dairesince tarh ve tahakkuk ettirilerek tecil
    olunur (md. 11/1-c). Malın, ihracatçıya teslim tarihini takip eden ay başından itibaren **3 ay içinde** ihraç edilmesi
    hâlinde tecil edilen vergi terkin olunur.


    | Teslim | Tecil edilen KDV | Süre / durum | Sonuç |

    |---|---|---|---|

    | T1 | 2.000.000 × %20 = 400.000 | Süre 01.02.2026''dan başlar, 3 ay içinde (en geç 30.04.2026) ihracat yapılmıştır (28.04.2026)
    | **400.000 TL terkin** |

    | T2 | 1.500.000 × %20 = 300.000 | İhracat yok, mücbir sebep yok | Tahakkuk tarihinden (26.03.2026) itibaren gecikme zammıyla
    tahsil: 300.000 × %3,5 × 4 ay = **42.000 TL**; toplam **342.000 TL** |

    | T3 | 1.000.000 × %20 = 200.000 | Mücbir sebep nedeniyle ihraç edilmemiş | Tecil tarihinden (26.04.2026) itibaren tecil
    faiziyle tahsil: 200.000 × %2,5 × 3 ay = **15.000 TL**; toplam **215.000 TL** |


    **(b) İade sınırı**


    İhracatçılara mal teslim eden imalatçılara iade edilecek KDV, ihraç edilen mala ilişkin imalatçı satış bedeline göre hesaplanan
    vergiden imalatçı aleyhine matrahta meydana gelen değişikliğe ilişkin verginin düşülmesinden sonra kalan tutardan fazla
    olamaz (md. 11/1-c).


    - Satış bedeline göre hesaplanan vergi = 2.000.000 × %20 = 400.000 TL

    - Matrah değişikliğine ilişkin vergi = 100.000 × %20 = 20.000 TL

    - İade üst sınırı = 400.000 − 20.000 = **380.000 TL**


    Talep edilen 450.000 TL > 380.000 TL olduğundan en çok **380.000 TL** iade edilebilir; kalan 70.000 TL iade edilemez.
    İade, ihracat işlemlerinin tamamlanmasından sonra yapılır.


    **(c) Ek süre**


    İhracatın mücbir sebepler veya beklenmedik durumlar nedeniyle üç ay içinde gerçekleştirilememesi hâlinde, **en geç üç
    aylık sürenin dolduğu tarihten itibaren onbeş gün içinde** başvuran ihracatçılara, Maliye Bakanlığınca veya Bakanlığın
    uygun görmesi hâlinde vergi dairelerince **üç aya kadar** ek süre verilebilir (md. 11/1-c).


    **(d) Md. 32**


    Tecil veya terkin edilen bu vergiler hakkında ihracatçılar bakımından KDV Kanunu md. 32 hükmü **uygulanmaz** (md. 11/1-c);
    yani ihracatçı bu vergiyi hiç ödemediği için md. 32 kapsamında indirim/iade konusu yapamaz.

    '
