    İzmir''de faydalanılmaktadır. | 400.000 |

    | 3 | Mersin Serbest Bölgesi''nde faaliyet ruhsatıyla çalışan (D) Ltd. için yapılan fason hizmet; hizmetten serbest bölgede
    faydalanılmaktadır. | 800.000 |

    | 4 | Türkiye''de yerleşik (E) A.Ş.''nin Bakü''de kendi adına müstakilen faaliyet gösteren şubesi için danışmanlık; hizmetten
    Bakü''de faydalanılmaktadır. | 300.000 |

