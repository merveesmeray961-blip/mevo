    Cumhurbaşkanınca belirlenen sınır kapısında yurt dışına çıkışta 650 litre motorin doldurtmuştur. Aracın standart yakıt
    deposu miktarı 400 litredir; motorinin KDV hariç birim fiyatı 40 TL''dir.


    **İstenenler:**


    (a) Olay 1''de Bay (X)''e iade edilecek KDV''yi hesaplayınız; kuru meyve için iade yapılmamasının gerekçesini belirtiniz.
