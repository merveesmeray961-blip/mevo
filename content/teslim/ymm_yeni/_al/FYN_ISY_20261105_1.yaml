    python: "yt = 720000000\na1 = 0.60\nb1 = 0.40\ng_a = 6\ng_b = 4\ng_yeni = 2\nmaliyet = 1800000\nfm = 0.40\ntalep = 45000\n\
      sm = 250\ntm = 0.20\nesik = 3000\nf1 = 50\nf2 = 48\ntedarik = 12\ngs = 300\ngunluk = yt / 360\nort_sure = a1 * g_a +\
      \ b1 * g_b\nazalma = ort_sure - g_yeni\nserbest = gunluk * azalma\ngetiri = serbest * fm\nnet = getiri - maliyet\nmaks_maliyet\
