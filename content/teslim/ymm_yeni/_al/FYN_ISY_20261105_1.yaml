  soru: 'Mevsimsel satış dalgalanması bulunan Kıyı Konserve A.Ş.''nin duran varlıkları yıl boyunca 6.000.000 TL''dir. Dönen
    varlıklardan 2.000.000 TL''si yıl boyunca sürekli (kalıcı) olarak gereklidir. Geçici dönen varlık ihtiyacı çeyreklere
    göre aşağıdadır (TL):


    | Çeyrek | 1. | 2. | 3. | 4. |

    |---|---|---|---|---|

    | Geçici dönen varlık | 0 | 1.000.000 | 3.000.000 | 0 |


    Uzun vadeli finansmanın yıllık maliyeti %42, kısa vadeli finansmanın yıllık maliyeti %36''dir. Fazla fonlar yıllık %30
    getirili menkul kıymetlere yatırılabilmektedir. Faiz öncesi yıllık faaliyet kârı 5.000.000 TL''dir. Çeyrekler eşit uzunlukta
    alınacak, her çeyrekteki finansman o çeyreğin ihtiyacına göre hesaplanacak, vergi dikkate alınmayacaktır.


    Yönetim üç stratejiyi değerlendirmektedir:


    - **Uyumlu:** Duran varlıklar ve kalıcı dönen varlıklar uzun vadeli, geçici ihtiyaç kısa vadeli kaynakla finanse edilir.

    - **Agresif:** Yalnızca duran varlıklar uzun vadeli kaynakla, tüm dönen varlıklar kısa vadeli kaynakla finanse edilir.

    - **İhtiyatlı:** Zirve dönemdeki toplam ihtiyaç uzun vadeli kaynakla finanse edilir; ihtiyaç duyulmayan fonlar menkul
    kıymete yatırılır.


    **İstenenler:**


    (a) Üç strateji için yıllık finansman maliyetini (ihtiyatlı stratejide menkul kıymet gelirini düşerek) hesaplayınız. (9
    puan)


    (b) Her strateji için faiz sonrası kâr (vergi öncesi) tutarını bulunuz. (4 puan)


    (c) Zirve dönemde (3. çeyrek) her stratejinin net işletme sermayesini ve cari oranını hesaplayınız (kısa vadeli borcu
    olmayan stratejide cari oran tanımsız kabul edilecektir). Agresif ve ihtiyatlı stratejilerin likidite ve kârlılık bakımından
    farkını kısaca yorumlayınız. (6 puan)


    (d) Kısa vadeli faiz oranı 10 puan artarsa her stratejinin yıllık maliyeti ne kadar artar? Sonuçları risk–getiri bakımından
    yorumlayınız. (6 puan)

    '
  cozum: 'Çeyrek bazında toplam finansman ihtiyacı (duran + kalıcı + geçici): 8.000.000, 9.000.000, 11.000.000, 8.000.000
    TL (zirve 11.000.000 TL, ortalama 9.000.000 TL).


    **(a) Yıllık finansman maliyeti**


    | Strateji | Uzun vadeli | Ortalama kısa vadeli | Maliyet hesabı | Net maliyet |

    |---|---|---|---|---|

    | Uyumlu | 8.000.000 | 1.000.000 | 8.000.000 × %42 + 1.000.000 × %36 | **3.720.000** |

    | Agresif | 6.000.000 | 3.000.000 | 6.000.000 × %42 + 3.000.000 × %36 | **3.600.000** |

    | İhtiyatlı | 11.000.000 | 0 | 11.000.000 × %42 − menkul kıymet geliri (600.000) | **4.020.000** |


    İhtiyatlı stratejide fazla fonlar çeyreklere göre 3.000.000, 2.000.000, 0, 3.000.000 TL olup ortalama 2.000.000 TL × %30
    = 600.000 TL gelir getirir.


    **(b) Faiz sonrası kâr (vergi öncesi)**


    Uyumlu: 5.000.000 − 3.720.000 = **1.280.000**; Agresif: 5.000.000 − 3.600.000 = **1.400.000**; İhtiyatlı: 5.000.000 −
    4.020.000 = **980.000** TL.


    **(c) Zirve dönemde likidite (3. çeyrek)** — dönen varlık = 2.000.000 + 3.000.000 = 5.000.000 TL


    | Strateji | Kısa vadeli borç | Net işletme sermayesi | Cari oran |

    |---|---|---|---|

    | Uyumlu | 3.000.000 | 2.000.000 | 1,67 |

    | Agresif | 5.000.000 | 0 | 1,00 |

    | İhtiyatlı | 0 | 5.000.000 | tanımsız (kısa vadeli borç yok) |


    Agresif stratejide net işletme sermayesi sıfırdır: dönen varlıklar kısa vadeli borçla tam olarak eşitlenmiştir; en küçük
    bir tahsilat aksaması ödeme güçlüğü yaratır. İhtiyatlı stratejide 1. çeyrekte 3.000.000 TL menkul kıymet vardır; fon fazlası
    nedeniyle likidite çok güçlüdür ama atıl fon maliyeti (uzun vadeli %42 ödenirken %30 getiri) kârı azaltmaktadır.


    **(d) Faiz artışı (kısa vadeli faiz +10 puan)**


    Ek maliyet = ortalama kısa vadeli borç × %10: Uyumlu 1.000.000 × %10 = **100.000 TL**; Agresif 3.000.000 × %10 = **300.000
    TL**; İhtiyatlı **0 TL**.


    Agresif strateji en düşük maliyetli ancak faiz ve yeniden finansman riski en yüksek stratejidir; ihtiyatlı strateji faiz
    riskinden korunmuş ancak en pahalı ve en düşük kârlı olandır; uyumlu strateji ikisi arasında dengeli konumdadır (vade
    uyumu ilkesi).

    '
