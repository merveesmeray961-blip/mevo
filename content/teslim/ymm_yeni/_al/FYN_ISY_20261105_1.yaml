      fvok = 5000000\nsok = 0.10\nihtiyac = [dv + kd + x for x in g]\n# uyumlu\nu_uzun = dv + kd\nu_kisa = [x for x in g]\n\
      u_maliyet = u_uzun * uv + sum(u_kisa) / 4 * kv\n# agresif\na_uzun = dv\na_kisa = [kd + x for x in g]\na_maliyet = a_uzun\
      \ * uv + sum(a_kisa) / 4 * kv\n# ihtiyatli\ni_uzun = max(ihtiyac)\ni_fazla = [i_uzun - x for x in ihtiyac]\ni_gelir\
      \ = sum(i_fazla) / 4 * mk\ni_maliyet = i_uzun * uv - i_gelir\nfk_u = fvok - u_maliyet\nfk_a = fvok - a_maliyet\nfk_i\
      \ = fvok - i_maliyet\n# 3. ceyrek (zirve)\ndonen3 = kd + g3\nkvyk_u3 = g3\nkvyk_a3 = kd + g3\nkvyk_i3 = 0\nnis_u = donen3\
      \ - kvyk_u3\nnis_a = donen3 - kvyk_a3\nnis_i = donen3 - kvyk_i3\ncari_u = donen3 / kvyk_u3\ncari_a = donen3 / kvyk_a3\n\
      donen1 = kd + g1 + i_fazla[0]\nek_u = sum(u_kisa) / 4 * sok\nek_a = sum(a_kisa) / 4 * sok\nek_i = 0\nsonuc = {\"u_maliyet\"\
      : u_maliyet, \"a_maliyet\": a_maliyet, \"i_maliyet\": i_maliyet, \"i_gelir\": i_gelir, \"fk_u\": fk_u, \"fk_a\": fk_a,\
      \ \"fk_i\": fk_i,\n         \"nis_u\": nis_u, \"nis_a\": nis_a, \"nis_i\": nis_i, \"cari_u\": cari_u, \"cari_a\": cari_a,\
      \ \"ek_u\": ek_u, \"ek_a\": ek_a, \"ek_i\": ek_i}\n"
