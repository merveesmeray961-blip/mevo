- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: RGT
  kazanimlar:
  - 'portföy performans ölçüleri: Sharpe, Treynor, Jensen, M²'
  - toplam risk ve sistematik risk ayrımı
  - belirlilik katsayısı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Risksiz faiz %20, piyasa getirisi %30, piyasa standart sapması %20''dir. Üç yatırım fonunun yıllık verileri:


    | Fon | Ortalama getiri | Standart sapma | Beta |

    |---|---|---|---|

    | F1 | %34 | %16 | 0,8 |

    | F2 | %40 | %40 | 1,6 |

    | F3 | %38 | %30 | 0,9 |


    **İstenenler:**


    (a) Her fon için Sharpe ve Treynor oranlarını hesaplayınız. (8 puan)


    (b) Her fonun Jensen alfasını bulunuz. (5 puan)


    (c) Her fonun betası ve standart sapmasından yararlanarak belirlilik katsayısını (R²) hesaplayınız (R² = (β σ_m / σ)²)
    ve fonların sıralamalarının neden farklı olduğunu açıklayınız. (7 puan)


    (d) Piyasanın Sharpe oranını hesaplayıp F1 ve F3 için M² (Modigliani) ölçüsünü bulunuz. (5 puan)

    '
  cozum: '**(a)** Sharpe = (R − R_f)/σ; Treynor = (R − R_f)/β.


    | Fon | Sharpe | Treynor |

    |---|---|---|

    | F1 | (%34 − %20)/%16 = **0,875** | %14/0,8 = **%17,5** |

    | F2 | %20/%40 = **0,500** | %20/1,6 = **%12,5** |

    | F3 | %18/%30 = **0,600** | %18/0,9 = **%20,0** |


    **(b)** Jensen α = R − [R_f + β (R_m − R_f)]: F1 = %34 − %28 = **+6 puan**; F2 = %40 − %36 = **+4 puan**; F3 = %38 − %29
    = **+9 puan**.


    **(c)** R² = (β σ_m/σ)²: F1 = **%100**, F2 = **%64**, F3 = **%36**.


    Sharpe sıralaması F1 > F3 > F2; Treynor ve Jensen sıralaması F3 > F1 > F2''dir. Sharpe toplam riski, Treynor ve Jensen
    yalnızca sistematik riski (beta) dikkate alır. F1''in R²''si %100 olduğundan toplam riski tamamen sistematiktir; F3''te
    toplam riskin yalnızca %36''ü sistematiktir, geri kalanı çeşitlendirilebilir (firmaya özgü) risktir. İyi çeşitlendirilmiş
    portföy (portföyün tamamı yatırımcının varlığı) için Treynor/Jensen; tek varlık olarak değerlendirilen portföy için Sharpe
    uygundur. Her üç ölçüde F2 sonuncudur.


    **(d)** Piyasa Sharpe oranı = (%30 − %20)/%20 = **0,500**. M² = (Sharpe_p − Sharpe_m) × σ_m: F1 = (0,875 − 0,500) × %20
    = **%7,5**; F3 = (0,600 − 0,500) × %20 = **%2,0**. (F2: %0,0; piyasa ile aynı risk-getiri ilişkisi.)

    '
  puanlama:
  - olcut: (a) Sharpe oranları
    puan: 4
  - olcut: (a) Treynor oranları
    puan: 4
  - olcut: (b) Jensen alfaları
    puan: 5
  - olcut: (c) R² değerleri
    puan: 3
  - olcut: (c) Sıralama farkının açıklaması
    puan: 4
  - olcut: (d) Piyasa Sharpe oranı
    puan: 2
  - olcut: (d) M² değerleri
    puan: 3
  kaynaklar:
  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  dogrulama:
    python: 'rf, rm, sm = 0.20, 0.30, 0.20

      r = [0.34, 0.40, 0.38]

      s = [0.16, 0.40, 0.30]

      b = [0.8, 1.6, 0.9]

      r1, r2, r3 = r

      s1, s2, s3 = s

      b1, b2, b3 = b

      sharpe = [(r[i] - rf) / s[i] for i in range(3)]

      treynor = [(r[i] - rf) / b[i] for i in range(3)]

      jensen = [r[i] - (rf + b[i] * (rm - rf)) for i in range(3)]

      r2k = [(b[i] * sm / s[i]) ** 2 for i in range(3)]

      sh_m = (rm - rf) / sm

      m2 = [(sharpe[i] - sh_m) * sm for i in range(3)]

      sonuc = {"sh1": sharpe[0], "sh2": sharpe[1], "sh3": sharpe[2], "tr1": treynor[0], "tr2": treynor[1], "tr3": treynor[2],
      "j1": jensen[0], "j2": jensen[1], "j3": jensen[2], "r21": r2k[0], "r22": r2k[1], "r23": r2k[2], "sh_m": sh_m, "m21":
      m2[0], "m22": m2[1], "m23": m2[2]}

      '
