  kazanimlar:
  - 'arbitraj fiyatlama kuramı (APT): çok faktörlü gerekli getiri'
  - arbitraj fırsatının saptanması
  - faktör duyarlılığı eşleştirme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Getiriler iki sistematik faktör tarafından belirlenmektedir. Risksiz faiz %20; birinci faktörün risk primi λ₁ = %5,
    ikincisinin λ₂ = %3''dir. Üç hissenin faktör duyarlılıkları ve piyasada gözlenen beklenen getirileri:


    | Hisse | b₁ | b₂ | Gözlenen beklenen getiri |

    |---|---|---|---|

    | A | 1,2 | 0,5 | %30,0 |

    | B | 0,8 | 1,5 | %27,5 |

    | C | 1 | 1 | %26,0 |


    **İstenenler:**


    (a) APT''ye göre her hissenin dengedeki beklenen getirisini bulunuz ve hisseleri değerlemesine göre (ucuz/pahalı/dengede)
    sınıflayınız. (8 puan)


    (b) A ve B hisselerinin %50-%50 portföyünün faktör duyarlılıklarını bulunuz; bu portföyün C ile hangi bakımdan aynı olduğunu
    belirtiniz. (5 puan)


    (c) Bu portföy ile C arasında arbitraj fırsatı var mıdır? Varsa, 1.000.000 TL''lik bir pozisyon için işlemi (hangisi alınır,
    hangisi açığa satılır) ve getiriyi belirtiniz. (8 puan)


    (d) Arbitraj işlemi piyasada yaygınlaştıkça fiyatlar ve beklenen getiriler nasıl değişir? (4 puan)

    '
  cozum: '**(a)** E(R) = R_f + b₁λ₁ + b₂λ₂:

    - A: %20 + 1,2 × %5 + 0,5 × %3 = **%27,5**; gözlenen %30,0 → fark +2,5 puan → **ucuz**.

    - B: **%28,5**; gözlenen %27,5 → fark -1,0 puan → **pahalı**.

    - C: **%28,0**; gözlenen %26,0 → fark -2,0 puan → **pahalı**.


    **(b)** Portföy: b₁ = 0,5 × 1,2 + 0,5 × 0,8 = **1**; b₂ = 0,5 × 0,5 + 0,5 × 1,5 = **1**. Portföyün faktör duyarlılıkları
    C ile aynıdır (1 ve 1); dolayısıyla aynı sistematik riske sahiptir ve aynı beklenen getiriyi (%28,0) sunması gerekir.


    **(c)** Portföyün gözlenen beklenen getirisi = 0,5 × %30,0 + 0,5 × %27,5 = **%28,75**; C''nin getirisi %26,0. Aynı risk,
    farklı getiri → arbitraj fırsatı vardır. Yapılacak işlem: **C açığa satılır** (getirisi düşük), gelirle **A ve B %50-%50
    alınır**. Net faktör duyarlılığı sıfırdır (sıfır sistematik risk), net yatırım sıfırdır. Getiri = %28,75 − %26,0 = **%2,75**;
    1.000.000 TL için **27.500 TL**.


    **(d)** A ve B''ye talep artar (fiyatları yükselir, beklenen getirileri düşer), C''nin açığa satışı fiyatını düşürür (beklenen
    getirisi yükselir). Arbitraj fırsatı ortadan kalkıncaya kadar beklenen getiriler APT doğrusuna (A: %27,5, B: %28,5, C:
    %28,0) yaklaşır.

    '
