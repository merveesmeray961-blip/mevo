  kazanimlar:
  - 'tek endeks modeli: sistematik ve firmaya özgü risk'
  - çeşitlendirme ve portföy riski
  - CAPM'de toplam risk ve gerekli getiri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Piyasa getirisinin standart sapması σ_m = %20''dir. X hissesinin betası 1,2 ve firmaya özgü (artık) standart sapması
    σ_e = %14''dir. Hisseler arasında firmaya özgü risk bağımsızdır. Piyasa risk primi için risksiz faiz %20, piyasa getirisi
    %30''dir. Y hissesinin betası 0,5, toplam standart sapması %45''dir.


    **İstenenler:**


    (a) X hissesinin sistematik varyansını, firmaya özgü varyansını, toplam varyansını ve standart sapmasını hesaplayınız.
    (6 puan)


    (b) X ile aynı beta ve aynı firmaya özgü riske sahip n hisseden oluşan eşit ağırlıklı portföyün varyansı σ²_p = β²σ_m²
    + σ_e²/n''dir. n = 4 ve n = 49 için portföyün standart sapmasını bulunuz. (6 puan)


    (c) Firmaya özgü riskin portföy toplam varyansındaki payının %5''in altına düşmesi için gereken en az hisse sayısını bulunuz.
    (6 puan)


    (d) CAPM''e göre X ve Y''nin gerekli getirilerini hesaplayınız. Y''nin toplam riski daha yüksek olduğu halde gerekli getirisinin
    neden daha düşük olduğunu açıklayınız. (7 puan)

    '
  cozum: '**(a)** Sistematik varyans = β² σ_m² = 1,44 × 0,04 = **0,0576**; firmaya özgü varyans = %14² = **0,0196**; toplam
    varyans = **0,0772**; σ = **%27,78**. Sistematik risk payı = %74,6.


    **(b)** σ²_p = 0,0576 + 0,0196/n.

    - n = 4: 0,0576 + 0,0049 = 0,0625 → σ = **%25,0**.

    - n = 49: 0,0576 + 0,0004 = 0,0580 → σ = **%24,1**.

    Hisse sayısı arttıkça standart sapma, yalnızca sistematik riskin oluşturduğu alt sınıra (%24,0) yaklaşır; bu sınır çeşitlendirmeyle
    yok edilemez.


    **(c)** Pay = (σ_e²/n) / (β²σ_m² + σ_e²/n) < 0,05 → σ_e²/n × 0,95 < 0,05 × β²σ_m² → n > 0,95 × 0,0196 / (0,05 × 0,0576)
    = 6,47. Dolayısıyla **n = 7** hisse gerekir (n = 7 için pay %4,64; n = 6 için %5,37).


    **(d)** CAPM: X için %20 + 1,2 × %10 = **%32**; Y için %20 + 0,5 × %10 = **%25**. CAPM''de yalnızca sistematik risk (beta)
    ödüllendirilir; toplam standart sapma değil. Y''nin riskinin büyük bölümü firmaya özgüdür ve çeşitlendirilebilir olduğundan
    piyasa bunun için risk primi ödemez.

    '
  puanlama:
  - olcut: (a) Varyans bileşenleri
