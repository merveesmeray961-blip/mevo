- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: RGT
  kazanimlar:
  - CAPM, menkul kıymet piyasa doğrusu (SML) ve portföy betası
  - alfa ve değer biçme
  - risksiz varlıkla beta ayarlama
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Risksiz faiz %18, piyasa portföyünün beklenen getirisi %28''dir. Bir yatırımcının portföyü aşağıdaki üç hisseden
    oluşmaktadır:


    | Hisse | Portföydeki ağırlık | Beta | Analist beklenen getirisi |

    |---|---|---|---|

    | A | %25 | 0,8 | %27 |

    | B | %25 | 1,2 | %29 |

    | C | %50 | 1,4 | %32 |


    **İstenenler:**


    (a) Her hissenin CAPM''e göre gerekli getirisini ve alfasını (beklenen − gerekli) hesaplayınız; her hisseyi ucuz/pahalı/dengede
    olarak sınıflayınız. (8 puan)


    (b) Portföyün betasını, gerekli getirisini ve beklenen getirisini hesaplayarak portföyün alfasını bulunuz. (6 puan)


    (c) Yatırımcı portföy betasını 0,9 yapmak istemektedir. Portföyün ne kadarını risksiz varlığa yatırmalıdır? Beklenen getiri
    ne olur? Beta 1,5 olmak istenirse işlem nasıl yapılmalıdır (borçlanma risksiz faizle yapılabilir)? (6 puan)


    (d) Piyasa getirisinin %18 ve %8 olduğu iki senaryoda mevcut portföyün getirisini bulunuz. (5 puan)

    '
  cozum: '**(a)** Gerekli getiri = R_f + β (R_m − R_f), piyasa risk primi = %10.

    - A: %18 + 0,8 × %10 = **%26**; alfa = %27 − %26 = **+1 puan** → beklenen getiri gerekli getirinin üstünde: **ucuz** (SML''nin
    üstünde, alınmalı).

    - B: **%30**; alfa = **-1 puan** → **pahalı** (SML''nin altında).

    - C: **%32**; alfa = **0 puan** → **dengede**.


    **(b)** β_p = 0,25 × 0,8 + 0,25 × 1,2 + 0,50 × 1,4 = **1,2**; gerekli getiri = %18 + 1,2 × %10 = **%30**; beklenen getiri
    = 0,25 × %27 + 0,25 × %29 + 0,5 × %32 = **%30**; portföy alfası = **0 puan** (A''nın +1 puanı ile B''nin −1 puanı birbirini
    götürür).


    **(c)** β = 0,9: riskli portföye yatırılacak oran = 0,9 / 1,2 = %75; risksiz varlığa **%25**. Beklenen getiri = %18 +
    0,9 × %10 = **%27**.

    β = 1,5: riskli portföye 1,5 / 1,2 = %125; yani risksiz faizle **%25** borçlanılıp riskli portföye ekleme yapılır. Beklenen
    getiri = **%33**.


    **(d)** Piyasa %18 iken: %18 + 1,2 × (%18 − %18) = **%18**. Piyasa %8 iken: %18 + 1,2 × (%8 − %18) = **%6**. Beta 1''den
    büyük olduğundan portföy piyasa düşüşünde piyasadan daha çok kaybeder.

    '
  puanlama:
  - olcut: (a) Gerekli getiriler
    puan: 3
  - olcut: (a) Alfalar
    puan: 3
  - olcut: (a) Sınıflama
