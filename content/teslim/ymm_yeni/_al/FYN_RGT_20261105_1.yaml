  dogrulama:
    python: 'rf, rm = 0.18, 0.28

      wa, wb, wc = 0.25, 0.25, 0.50

      ba, bb, bc = 0.8, 1.2, 1.4

      fa, fb, fc = 0.27, 0.29, 0.32

      rm1, rm2 = 0.18, 0.08

      gerekli = [rf + b * (rm - rf) for b in (ba, bb, bc)]

      alfa = [f - g for f, g in zip((fa, fb, fc), gerekli)]

      ga, gb, gc = gerekli

      alfa_a, alfa_b, alfa_c = alfa

      bp = wa * ba + wb * bb + wc * bc

      gp = rf + bp * (rm - rf)

      fp = wa * fa + wb * fb + wc * fc

      alfa_p = fp - gp

      x09 = 0.9 / bp

      rf_w09 = 1 - x09

      r09 = rf + 0.9 * (rm - rf)

      x15 = 1.5 / bp

      rf_w15 = 1 - x15

      r15 = rf + 1.5 * (rm - rf)

      r_s1 = rf + bp * (rm1 - rf)

      r_s2 = rf + bp * (rm2 - rf)

      sonuc = {"ga": gerekli[0], "gb": gerekli[1], "gc": gerekli[2], "alfa_a": alfa[0], "alfa_b": alfa[1], "alfa_c": alfa[2],
      "bp": bp, "gp": gp, "fp": fp, "alfa_p": alfa_p, "x09": x09, "rf_w09": rf_w09, "r09": r09, "x15": x15, "rf_w15": rf_w15,
      "r15": r15, "r_s1": r_s1, "r_s2": r_s2}

      '
