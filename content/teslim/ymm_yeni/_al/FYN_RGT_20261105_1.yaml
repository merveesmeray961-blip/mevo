- id: TASLAK
  sinav: ymm
  ders: FYN
  konu: RGT
  kazanimlar:
  - iki varlıklı portföyün beklenen getiri ve riski
  - korelasyonun portföy riskine etkisi ve minimum varyanslı portföy
  - Sharpe oranı
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Bir yatırımcı A ve B hisse senetlerinden portföy oluşturacaktır. Beklenen getiriler E(R_A) = %18, E(R_B) = %10; standart
    sapmalar σ_A = %20, σ_B = %10; kovaryans Cov(A,B) = 0,005''dir. Risksiz faiz %6''dır.


    **İstenenler:**


    (a) Korelasyon katsayısını bulunuz. A ve B''ye %50-%50 yatırım yapan portföyün beklenen getirisini, varyansını ve standart
    sapmasını hesaplayınız. (7 puan)


    (b) Minimum varyanslı portföydeki A ağırlığını, bu portföyün beklenen getirisini ve standart sapmasını bulunuz. (6 puan)


    (c) %50-%50 portföyde korelasyon +1 ve −0,25 olsaydı standart sapma ne olurdu? Sonuçları yorumlayınız. (6 puan)


    (d) A, B, minimum varyanslı portföy ve %50-%50 portföyün Sharpe oranlarını hesaplayarak sıralayınız. (6 puan)

    '
  cozum: '**(a)** ρ = Cov / (σ_A σ_B) = 0,005 / (0,2 × 0,1) = **0,25**.


    E(R_p) = 0,5 × %18 + 0,5 × %10 = **%14**.


    σ_p² = 0,25 × 0,04 + 0,25 × 0,01 + 2 × 0,25 × 0,005 = **0,0150**; σ_p = **%12,25**.


    **(b)** w_A = (σ_B² − Cov) / (σ_A² + σ_B² − 2 Cov) = (0,01 − 0,005) / (0,04 + 0,01 − 0,01) = **%12,5**.


    E(R) = 0,125 × %18 + 0,875 × %10 = **%11,0**; σ² = **0,009375**; σ = **%9,68**.


    **(c)** ρ = +1: σ = 0,5 × %20 + 0,5 × %10 = **%15,0**. ρ = −0,25: σ = **%10,0**. Korelasyon azaldıkça portföy riski düşer;
    ρ = +1''de çeşitlendirme faydası yoktur, ρ < 1 olduğunda portföy standart sapması ağırlıklı ortalama standart sapmanın
    (%15,0) altına iner. Beklenen getiri korelasyondan etkilenmez (%14).


    **(d)** Sharpe = (E(R) − R_f) / σ:

    - A: (%18 − %6) / %20 = **0,600**

    - B: **0,400**

    - Minimum varyanslı portföy: (%11,0 − %6) / %9,68 = **0,516**

    - %50-%50 portföy: **0,653**


    Sıralama: %50-%50 (0,653) > A (0,600) > minimum varyans (0,516) > B (0,400). Minimum varyanslı portföy en düşük riski
    sağlar ancak risk başına en yüksek getiriyi sağlayan portföy değildir.

    '
  puanlama:
  - olcut: (a) Korelasyon
    puan: 1
  - olcut: (a) Beklenen getiri
    puan: 2
  - olcut: (a) Varyans ve standart sapma
    puan: 4
  - olcut: (b) Minimum varyans ağırlığı
    puan: 3
  - olcut: (b) Getiri ve standart sapma
    puan: 3
  - olcut: (c) İki standart sapma
    puan: 4
  - olcut: (c) Yorum
    puan: 2
  - olcut: (d) Dört Sharpe oranı
    puan: 4
  - olcut: (d) Sıralama
    puan: 2
  kaynaklar:
  - mevzuat: Genel bilgi — finansal yönetim
    madde: '-'
  dogrulama:
    python: "ea, eb = 0.18, 0.10\nsa, sb = 0.20, 0.10\ncov = 0.005\nrf = 0.06\nrho = cov / (sa * sb)\ndef port(w, c):\n  \
      \  e = w * ea + (1 - w) * eb\n    v = w**2 * sa**2 + (1 - w)**2 * sb**2 + 2 * w * (1 - w) * c\n    return e, v, v **\
      \ 0.5\ne50, v50, s50 = port(0.5, cov)\nwmin = (sb**2 - cov) / (sa**2 + sb**2 - 2 * cov)\nemin, vmin, smin = port(wmin,\
      \ cov)\ns_rho1 = port(0.5, sa * sb)[2]\ns_rho_neg = port(0.5, -0.25 * sa * sb)[2]\nsh_a = (ea - rf) / sa\nsh_b = (eb\
      \ - rf) / sb\nsh_min = (emin - rf) / smin\nsh_50 = (e50 - rf) / s50\nsonuc = {\"rho\": rho, \"e50\": e50, \"v50\": v50,\
      \ \"s50\": s50, \"wmin\": wmin, \"emin\": emin, \"vmin\": vmin, \"smin\": smin, \"s_rho1\": s_rho1, \"s_rho_neg\": s_rho_neg,\
      \ \"sh_a\": sh_a, \"sh_b\": sh_b, \"sh_min\": sh_min, \"sh_50\": sh_50}\n"
