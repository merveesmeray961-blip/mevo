  dogrulama:
    python: "sm = 0.20\nbx = 1.2\nse = 0.14\nrf, rm = 0.20, 0.30\nby, sy = 0.5, 0.45\nsis = bx**2 * sm**2\noz = se**2\ntop\
      \ = sis + oz\nsd = top ** 0.5\ndef pv(n): return sis + oz / n\nsd4 = pv(4) ** 0.5\nsd49 = pv(49) ** 0.5\nn_min = 1\n\
      while (oz / n_min) / pv(n_min) >= 0.05:\n    n_min += 1\npay_n = (oz / n_min) / pv(n_min)\npay_n1 = (oz / (n_min - 1))\
      \ / pv(n_min - 1)\ngx = rf + bx * (rm - rf)\ngy = rf + by * (rm - rf)\nsonuc = {\"sis\": sis, \"oz\": oz, \"top\": top,\
      \ \"sd\": sd, \"sd4\": sd4, \"sd49\": sd49, \"n_min\": n_min, \"pay_n\": pay_n, \"pay_n1\": pay_n1, \"gx\": gx, \"gy\"\
      : gy}\n"
