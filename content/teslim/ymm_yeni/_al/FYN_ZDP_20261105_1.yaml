  dogrulama:
    python: 'kredi, faiz, n = 600000, 0.20, 3

      ap = kredi / n

      sonuc = sum((kredi - ap * i) * faiz for i in range(n))

      pmt = kredi * faiz / (1 - (1 + faiz) ** -n)

      yanlis = {"a": kredi * faiz, "b": pmt * n - kredi, "c": kredi * faiz * n, "d": kredi * ((1 + faiz) ** n - 1)}

      '
- id: TASLAK
