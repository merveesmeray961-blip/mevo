      sonuc = (1 + nom / 2) ** 2 - 1

      yanlis = {"a": nom / 2, "b": nom, "c": nom / 4, "d": 1 - 1 / (1 + nom / 2) ** 2}

      '
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: FYN
  unite: Paranın zaman değeri ve borçlanma araçları
  konu: ZDP
  kazanim: sıfır kuponlu tahvilde vadeye kadar getiri
  tip: hesaplama
  zorluk: 2
  kok: Nominal değeri 1.000 TL olan, vadesine 2 yıl kalmış sıfır kuponlu bir tahvil bugün 640 TL'den satılmaktadır. Tahvilin
    vadeye kadar yıllık bileşik getirisi yüzde kaçtır?
  secenekler:
    A: '%12,50'
    B: '%25,00'
    C: '%28,12'
    D: '%36,00'
    E: '%56,25'
  dogru: B
  aciklama:
    dogru_neden: Fiyat = Nominal / (1 + y)^n → (1 + y)² = 1.000 / 640 = 1,5625 → 1 + y = 1,25 → y = %25.
    celdiriciler:
      A: Doğru yıllık getiri yarıya bölünmüş; bileşik getiri dönem sayısına bölünerek bulunmaz.
      C: Toplam getiri dönem sayısına bölünerek basit yıllık getiri bulunmuş; soruda bileşik getiri istenmektedir.
      D: Bu oran iskonto oranıdır (nominalden indirim), getiri oranı değildir.
      E: Bu, iki yıllık toplam getiridir; yıllığa çevrilmemiştir.
    hesap_adimlari:
    - (Nominal/Fiyat)^(1/n) − 1
  kaynaklar:
  - mevzuat: Genel kabul görmüş finans yönetimi bilgisi — sıfır kuponlu tahvilde vadeye kadar getiri
    madde: '-'
    alinti: ''
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
