      = 240.000 TL.'
    celdiriciler:
      A: Yalnızca ilk yılın faizidir; bakiye azaldıkça faiz de azalır ancak üç yıl boyunca ödenir.
      C: Eşit taksitli (anüite) kredinin toplam faizidir; soruda eşit anapara ödemesi vardır.
      D: Faiz her yıl ilk anaparaya uygulanmış; anapara ödendikçe bakiye azalır.
      E: Bileşik faiz birikimi hesaplanmış; kredi yıllık ödemelerle azalan bakiye üzerinden faizlendirilir.
