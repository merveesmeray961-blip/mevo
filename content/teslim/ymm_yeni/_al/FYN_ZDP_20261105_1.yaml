    model: Claude Sonnet 5.5
  dogrulama:
    python: 'nom, n, fiyat = 1000, 2, 640

      sonuc = (nom / fiyat) ** (1 / n) - 1

      yanlis = {"a": (nom - fiyat) / fiyat / n, "b": nom / fiyat - 1, "c": (nom - fiyat) / nom, "d": (sonuc) / n}

      '
