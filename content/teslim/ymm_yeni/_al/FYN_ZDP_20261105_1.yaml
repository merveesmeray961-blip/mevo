  aciklama:
    dogru_neden: Altı aylık faiz = %20 / 2 = %10. Etkin oran = (1 + 0,1)² − 1 = %21.
    celdiriciler:
      A: Bu değer üç aylık orandır (nominal/4); soruda dönem altı aylıktır ve sonuç yıllığa bileşiklenmelidir.
      B: Bu değer altı aylık orandır, yıllık etkin oran değildir.
      C: Bu, iki dönemlik bileşik büyümenin iskonto oranı karşılığıdır (1 − 1/1,21); etkin faiz oranı büyüme oranıdır.
      D: Nominal oran bileşikleme etkisi eklenmeden verilmiş; yılda iki kez bileşik faizde etkin oran nominalden yüksektir.
    hesap_adimlari:
    - Dönemsel oran = nominal / m
    - Etkin oran = (1 + nominal/m)^m − 1
