  dogrulama:
    python: 'kk = 23000000 + 2000000

      kv_matrah = kk - 2000000 - 3000000 - 5000000 - 6000000 - 1000000 - 1500000

      indirimli = 4500000

      hes_kv = indirimli*5/100 + (kv_matrah - indirimli)*25/100

      alinmayan = indirimli*20/100

      asg_matrah = kk - 2000000 - 3000000 - 1000000

      asg_oncesi = asg_matrah*10/100

      katki_once = 20000000*30/100

      katki_sonra = (30000000-20000000)*30/100

      y1 = asg_oncesi - alinmayan

      y1_hes = max(hes_kv, y1)

      y1_kalan = katki_once - (1000000 + alinmayan)

      oncesi_pay = alinmayan*katki_once/(katki_once+katki_sonra)

      y2 = asg_oncesi - oncesi_pay

      y2_hes = max(hes_kv, y2)

      y2_kalan = katki_once - (1000000 + oncesi_pay)

      odenecek = y1_hes - 800000 - 50000

      sonuc = {''kk'': kk, ''kv_matrah'': kv_matrah, ''hesaplanan_kv'': hes_kv, ''alinmayan'': alinmayan, ''asgari_matrah'':
      asg_matrah, ''asgari_oncesi'': asg_oncesi, ''katki_once'': katki_once, ''katki_sonra'': katki_sonra, ''y1_asgari'':
      y1_hes, ''y1_kalan'': y1_kalan, ''y2_asgari'': y2_hes, ''y2_kalan'': y2_kalan, ''odenecek'': odenecek}'
