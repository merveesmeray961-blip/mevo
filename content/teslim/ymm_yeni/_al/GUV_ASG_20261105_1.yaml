  soru: "(Z) Holding A.Ş. (Türkiye'de yerleşik nihai ana işletme), Türkiye, (K), (M) ve (N) ülkelerinde bağlı işletmeleri\
    \ bulunan (Z) çok uluslu işletme grubunun nihai ana işletmesidir. Grubun hesap dönemi takvim yılıdır. Nihai ana işletmenin\
    \ konsolide finansal tablolarına göre yıllık konsolide hasılat tutarları aşağıdadır.\n\n| Hesap dönemi | Konsolide hasılat\
    \ (milyon avro karşılığı TL) |\n|---|---|\n| 2022 | 700 |\n| 2023 | 760 |\n| 2024 | 740 |\n| 2025 | 810 |\n\nGrubun 2026\
    \ hesap dönemine ilişkin ülke bilgileri aşağıdadır. Bütün bağlı işletmeler (Z) Holding A.Ş.'nin tamamına sahip olduğu\
    \ işletmelerdir; hiçbir ülke güvenli liman olarak belirlenmemiştir; ek cari dönem asgari tamamlayıcı kurumlar vergisi\
    \ ve nitelikli yerel asgari tamamlayıcı kurumlar vergisi bulunmamaktadır.\n\n| Ülke | Net ülkesel bazlı kazanç (milyon\
    \ TL) | Düzeltilmiş kapsanan vergiler (milyon TL) | Çalışanların yıllık toplam brüt ücretleri (milyon TL) | Maddi duran\
    \ varlıkların net defter değeri (milyon TL) |\n|---|---|---|---|---|\n| (K) | 400 | 40 | 300 | 500 |\n| (N) | 250 | 50\
    \ | 100 | 200 |\n| Türkiye | 300 | 36 | 200 | 400 |\n\n(M) ülkesindeki bağlı işletmelere ilişkin hasılat ve kazanç bilgileri\
    \ (milyon avro karşılığı TL) şöyledir: \n\n| Hesap dönemi | Ülkesel bazlı hasılat | Ülkesel bazlı kazanç |\n|---|---|---|\n\
    | 2024 | 14 | 1,5 |\n| 2025 | 8 | 0,8 |\n| 2026 | 5 | 0,4 |\n\nTürkiye'deki bağlı işletmeler (Z) Holding A.Ş. ile (Z)\
    \ Üretim A.Ş.'dir. Asgari kurumlar vergisi oranı %15'tir. Küresel asgari tamamlayıcı kurumlar vergisi (ATV) hesabında\
    \ çalışanların brüt ücretleri ile maddi duran varlıkların net defter değeri üzerinden kanunda öngörülen indirim yapılacaktır;\
    \ hesaplamada tutarlar milyon TL olarak gösterilebilir.\n\n**İstenenler:**\n\n(a) (Z) grubunun 2026 hesap dönemi için\
    \ yerel ve küresel ATV kapsamında olup olmadığını gerekçesiyle belirtiniz. (4 puan)\n\n(b) (K), (N) ve (M) ülkeleri için\
    \ ülkesel bazlı vergi yükünü ve 2026 hesap dönemi küresel ATV tutarını ayrı ayrı belirleyiniz. (10 puan)\n\n(c) Türkiye\
    \ için hesaplanacak yerel ATV tutarını bulunuz; (Z) Üretim A.Ş.'nin verginin tamamını kendi adına beyan edip ödemesi hâlinde\
    \ (Z) Holding A.Ş.'nin sorumluluğunun durumunu açıklayınız. (6 puan)\n\n(d) (K) ülkesine ilişkin küresel ATV'nin mükellefini\
    \ belirtiniz; küresel ATV ve yerel ATV için beyan ve ödeme sürelerini tarih olarak yazınız. (5 puan)\n"
  cozum: '**(a) Kapsam (Ek 1/1)**


    Grubun gelirin raporlandığı 2026 hesap döneminden önceki dört hesap dönemi 2022-2025''tir. Hasılatı 750 milyon avro karşılığı
    TL''yi geçen dönemler 2023 (760) ve 2025 (810)''tir. 2022 (700) ve 2024 (740) sınırın altındadır. Sınır, dört dönemin
    en az ikisinde geçildiğinden grup yerel ve küresel ATV kapsamındadır.


    **(b) Ülkesel bazlı vergi yükü ve küresel ATV (Ek 5/11, Ek 6)**


    | Ülke | Vergi yükü | Hesap | Küresel ATV |

    |---|---|---|---|

    | (K) | 40 / 400 = %10 | Fark: %15 − %10 = %5. Matrah: 400 − (300 × %5 + 500 × %5) = 400 − (15 + 25) = 360. Vergi: 360
    × %5 | **18 milyon TL** |

    | (N) | 50 / 250 = %20 | Vergi yükü asgari orana (%15) göre yüksek; küresel ATV hesaplanmaz (Ek 6/2) | **0** |

    | (M) | - | Üç dönem ortalaması: hasılat (14 + 8 + 5) / 3 = 9 milyon avro (< 10); kazanç (1,5 + 0,8 + 0,4) / 3 = 0,9 milyon
    avro (< 1). Ek 6/8 uyarınca küresel ATV sıfır kabul edilebilir | **0** |


    (M) ülkesinde 2024 yılı hasılatı 10 milyon avro karşılığı TL''yi aşsa da ölçüt tek yıl değil, ilgili hesap dönemi ve önceki
    iki hesap döneminin ortalamasıdır.


    **(c) Türkiye için yerel ATV (Ek 9, Ek 10)**


    - Vergi yükü: 36 / 300 = %12; fark %15 − %12 = %3.

    - Matrah: 300 − (200 × %5 + 400 × %5) = 300 − (10 + 20) = 270 milyon TL.

    - Yerel ATV = 270 × %3 = **8,1 milyon TL**.

    - Ek 10/5 uyarınca Türkiye''de yerleşik ve aynı gruba bağlı mükelleflerden biri verginin tamamını kendi adına beyan edip
    öderse diğer mükelleflerin beyan ve ödeme sorumlulukları ortadan kalkar. Dolayısıyla (Z) Üretim A.Ş. tüm vergiyi beyan
    edip öderse (Z) Holding A.Ş.''nin sorumluluğu kalkar. Şu kadar ki verginin tamamının ödenmemesi hâlinde mükelleflerin
    müştereken ve müteselsilen sorumluluğu devam eder.


    **(d) Mükellef ve süreler (Ek 7, Ek 8, Ek 10)**


    - (K) ülkesindeki bağlı işletmeler için gelirin dahil edilmesi esasına göre küresel ATV''nin mükellefi, Türkiye''de yerleşik
    nihai ana işletme olan (Z) Holding A.Ş.''dir (Ek 7/2 ve 7/3-a).

    - Küresel ATV: Hesap dönemi 31/12/2026''da kapandığından, kapandığı ayı izleyen on beşinci ayın son günü olan **31 Mart
    2028**''e kadar beyan edilir ve ödenir (Ek 8/4).

    - Yerel ATV: Kapanış ayını izleyen on ikinci ayın birinci gününden son gününe, yani **1-31 Aralık 2027** tarihleri arasında
    beyan edilir ve ödenir (Ek 10/3).

    '
