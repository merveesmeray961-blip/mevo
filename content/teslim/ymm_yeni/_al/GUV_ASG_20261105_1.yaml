  kazanimlar:
  - yurt içi asgari kurumlar vergisi matrahı
  - yatırıma katkı tutarının asgari vergiden indirilmesi (32/C-3)
  - ilk defa faaliyete başlayan kurumlar (32/C-5)
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '(Y) Üretim A.Ş. 2021 yılında kurulmuş ve aynı yıl faaliyete başlamıştır. Hesap dönemi takvim yılı olan şirket banka
    veya finans kuruluşu değildir, kurumlar vergisinden muaf değildir ve hasılat esasına göre vergilendirilmemektedir. Şirketin
    2026 hesap dönemine ilişkin bilgileri aşağıdadır. Ticari bilanço kârı, tabloda yer alan kazançların tamamını içermektedir.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 23.000.000 |

    | Kanunen kabul edilmeyen giderler | 2.000.000 |

    | Tam mükellef kurumlardan alınan kâr payları (KVK md. 5/1-a) | 2.000.000 |

    | Serbest bölgedeki şubeden elde edilen ve 3218 sayılı Kanun kapsamında vergiden istisna edilen kazanç | 3.000.000 |

    | KVK md. 5/1-(e) kapsamında beyannamede istisna olarak indirilecek tutar | 5.000.000 |

    | Beyannamede indirilecek geçmiş yıl zararı | 6.000.000 |

    | 5746 sayılı Kanun kapsamındaki Ar-Ge indirimi | 1.000.000 |

    | KVK md. 10/1-(ı) kapsamındaki nakdi sermaye artışı faiz indirimi | 1.500.000 |

    | 2026 dönemi için ödenen geçici vergiler | 800.000 |

    | 2026 dönemine ilişkin yurt içinde tevkif yoluyla ödenen kurumlar vergisi | 50.000 |


    Şirket, 2/8/2024 tarihinden önce Sanayi ve Teknoloji Bakanlığından aldığı yatırım teşvik belgesi kapsamında, 2026 yılında
    elde ettiği 4.500.000 TL tutarındaki kazanca belgeye göre indirimli oranı (%5) uygulamaktadır. Genel kurumlar vergisi
    oranı %25, yurt içi asgari kurumlar vergisi oranı %10''dur. Belgede kayıtlı yatırım tutarı 20.000.000 TL, yatırıma katkı
    oranı %30''dur. Şirket belgeyi 2/8/2024 tarihinden sonra revize ettirerek yatırım tutarını 30.000.000 TL''ye yükseltmiştir.
    Önceki hesap dönemlerinde kullanılan yatırıma katkı tutarı 1.000.000 TL olup bu tutar, 2/8/2024 öncesi yatırım tutarına
    göre hesaplanan katkıdan düşülmüştür. Şirketin başka bir teşvik belgesi, indirimli oran uygulaması veya mükerrer 121 inci
    madde kapsamındaki indirim hakkı yoktur.


    **İstenenler:**


    (a) Genel hükümlere ve KVK 32/A maddesine göre kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (5
    puan)


    (b) Yurt içi asgari kurumlar vergisi matrahını; kurum kazancından düşülebilen ve düşülemeyen kalemleri gerekçeleriyle
    belirterek hesaplayınız. (7 puan)


    (c) Belgeye göre 2/8/2024 öncesi, sonrası ve toplam yatırıma katkı tutarlarını bulunuz; Tebliğde yer alan iki yönteme
    göre ayrı ayrı asgari vergiyi (indirimler sonrası), hesaplanan kurumlar vergisini ve 2/8/2024 öncesi belgeye göre kalan
    yatırıma katkı tutarını belirleyiniz. (9 puan)


    (d) Şirket bakımından KVK 32/C-5 hükmünün 2026 hesap dönemine etkisini açıklayınız ve birinci yönteme göre ödenecek kurumlar
    vergisini bulunuz. (4 puan)

    '
  cozum: '**(a) Genel hesap**


    | Kalem | TL |

    |---|---|

    | Ticari bilanço kârı | 23.000.000 |

    | + KKEG | 2.000.000 |

    | = Kurum kazancı (indirim ve istisnalar düşülmeden önce) | 25.000.000 |

    | − 5/1-(a) kâr payı istisnası | 2.000.000 |

    | − 3218 sayılı Kanun kapsamındaki serbest bölge kazanç istisnası | 3.000.000 |

    | − 5/1-(e) istisnası | 5.000.000 |

    | − Geçmiş yıl zararı | 6.000.000 |

    | − Ar-Ge indirimi | 1.000.000 |

    | − Nakdi sermaye artışı faiz indirimi | 1.500.000 |

    | = Kurumlar vergisi matrahı | **6.500.000** |


    - İndirimli orana tabi kazanç: 4.500.000 × %5 = 225.000

    - Genel orana tabi kazanç: 6.500.000 − 4.500.000 = 2.000.000 × %25 = 500.000

    - Hesaplanan kurumlar vergisi = 225.000 + 500.000 = **725.000 TL**

    - Belge nedeniyle alınmayan vergi = 4.500.000 × (%25 − %5) = **900.000 TL**


    **(b) Asgari vergi matrahı (KVK 32/C-1, 32/C-2, 32/C-6)**


    İndirim ve istisnalar düşülmeden önceki kurum kazancı (32/C-6): 23.000.000 + 2.000.000 = 25.000.000 TL.


    Düşülebilenler:

    - 5/1-(a) kâr payı istisnası (32/C-2-a): 2.000.000

    - 3218 sayılı Kanun kapsamındaki serbest bölge kazancı (32/C-2-c): 3.000.000

    - Ar-Ge indirimi (32/C-2-ç): 1.000.000


    Düşülemeyenler:

    - 5/1-(e) istisnası: 32/C-2''de sayılan istisnalar arasında yoktur (Tebliğ 32.5.6).

    - Geçmiş yıl zararı: Tebliğe göre asgari vergi matrahından düşülmez.

    - 10/1-(ı) nakdi sermaye artışı faiz indirimi: 32/C-2-b yalnızca 10/1-(g), (h), (i) ve (j) indirimlerini saymıştır.


    Asgari vergi matrahı = 25.000.000 − 2.000.000 − 3.000.000 − 1.000.000 = **19.000.000 TL**. Asgari vergi (indirim öncesi)
    = 19.000.000 × %10 = **1.900.000 TL**.


    **(c) Yatırıma katkı ve iki yöntem (KVK 32/C-3; Tebliğ 32.5.4 ve 32.5.7)**


    - 2/8/2024 öncesi katkı: 20.000.000 × %30 = **6.000.000 TL**

    - 2/8/2024 sonrası eklenen katkı: (30.000.000 − 20.000.000) × %30 = **3.000.000 TL**

    - Toplam katkı: **9.000.000 TL**


    | | 1. yöntem | 2. yöntem |

    |---|---|---|

    | Asgari vergiden indirilen 2/8/2024 öncesi belgeye isabet eden alınmayan vergi | 900.000 (tamamı) | 900.000 × 6.000.000
    / 9.000.000 = 600.000 |

    | 2/8/2024 sonrası belgeye isabet eden kısım (indirilemez) | 0 | 300.000 |

    | Asgari vergi (1.900.000 − indirilen) | **1.000.000** | **1.300.000** |

    | Hesaplanan KV (725.000 ile karşılaştırma) | **1.000.000** (fark 275.000) | **1.300.000** (fark 575.000) |

    | 2/8/2024 öncesi belgeye göre kalan katkı | 6.000.000 − (1.000.000 + 900.000) = **4.100.000** | 6.000.000 − (1.000.000
    + 600.000) = **4.400.000** |


    Her iki yöntemde de asgari vergi, beyana göre hesaplanan 725.000 TL''yi aştığından aşan fark kadar asgari vergi hesaplanır.


    **(d) 32/C-5 ve ödenecek vergi**


    - Şirket 2021''de faaliyete başlamıştır; üç hesap dönemi (2021, 2022, 2023) geçmiştir. 32/C-5 kapsamındaki muafiyet 2026
    için söz konusu değildir; asgari vergi uygulanır.

    - Birinci yönteme göre ödenecek kurumlar vergisi = 1.000.000 − 800.000 (geçici vergi) − 50.000 (tevkifat) = **150.000
    TL**.

    '
