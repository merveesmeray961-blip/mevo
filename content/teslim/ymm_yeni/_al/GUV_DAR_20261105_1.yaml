    **2. Kâr payı dağıtımı.** (A) A.Ş. 2026 yılında kârından aşağıdaki dar mükellef ortaklarına kâr payı dağıtmıştır (kâr
    payları Gelir Vergisi Kanunu''nun 75 inci maddesinin ikinci fıkrasının (1) numaralı bendi kapsamındadır):


