- id: TASLAK
  sinav: ymm
  ders: GUV
  konu: DAR
  kazanimlar:
  - yurt dışı vergilerin mahsubu (KVK md. 33)
  - yurt dışı iştirak kâr payları ve istisna ilişkisi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Tam mükellef (A) Makina A.Ş.''nin hesap dönemi takvim yılıdır; kurumlar vergisi oranı %25''tir. (A) A.Ş.''nin 2026
    yılına ilişkin bilgileri aşağıdadır. Yurt içi kurum kazancı, indirim ve istisnalar düşüldükten sonra 7.000.000 TL''dir.
    Yurt içi asgari kurumlar vergisinin sonuca etkisi olmadığı, geçici vergi ve tevkifat mahsubunun bulunmadığı, mahsup edilecek
    vergilerin tamamının belgelerle tevsik edildiği kabul edilecektir.


    **1. Yurt dışı iş yeri.** (A) A.Ş.''nin Gürcistan''daki iş yerinin 2026 yılı kurum kazancı 2.000.000 TL''dir; bu kazanç
    Türkiye''de genel sonuç hesaplarına intikal ettirilmiştir. Gürcistan''da bu kazanç üzerinden %30 oranında, 600.000 TL
    kurumlar vergisi ödenmiştir.


    **2. Yurt dışı iştirak (V) Ltd.** (A) A.Ş. (V) Ltd.''nin sermayesinin %40''ına sahiptir. (V) Ltd.''nin vergi öncesi kazancı
    3.000.000 TL, bu kazanç üzerinden ödediği gelir ve kurumlar vergisi benzeri vergi %10 oranında 300.000 TL''dir ve kalan
    2.700.000 TL dağıtılmıştır. (A) A.Ş.''nin payına düşen 1.080.000 TL net kâr payı (V) Ltd.''nin ülkesinde dağıtım aşamasında
    ayrıca vergi kesintisine tabi tutulmamıştır. (V) Ltd.''nin toplam vergi yükü %10 olup kâr payı, kurumlar vergisi beyannamesinin
    verilmesi gereken tarihe kadar Türkiye''ye transfer edilmemiştir; bu nedenle KVK md. 5/1-(b) istisnası uygulanmamaktadır.
    Kontrol edilen yabancı kurum (md. 7) hükümleri uygulanmaz.


    **3. Yurt dışı iştirak (Z) Ltd.** (A) A.Ş. (Z) Ltd.''nin sermayesinin %60''ına yedi yıldır sahiptir. (Z) Ltd.''nin toplam
    vergi yükü %20 olup (A) A.Ş.''nin 900.000 TL tutarındaki kâr payı süresinde Türkiye''ye transfer edilmiştir. KVK md. 5/1-(b)
    istisnası bu kâr payına uygulanmıştır; kâr payına isabet eden ve yurt dışında ödenen vergi 150.000 TL''dir.


    **İstenenler:**


    (a) Gürcistan''daki iş yerinin kazancı bakımından yurt dışında ödenen verginin Türkiye''de mahsup edilebilecek tutarını
    belirleyiniz; mahsup edilemeyen kısım varsa sonraki yıllarda kullanılıp kullanılamayacağını açıklayınız. (7 puan)


    (b) (V) Ltd.''den elde edilen kâr payının Türkiye''de kurum kazancına hangi tutarla ekleneceğini ve bu kâr payı nedeniyle
    mahsup edilebilecek yurt dışı vergiyi hesaplayınız. (7 puan)


    (c) (A) A.Ş.''nin 2026 yılı kurumlar vergisi matrahını, hesaplanan kurumlar vergisini ve mahsuplardan sonra ödenecek kurumlar
    vergisini bulunuz; (Z) Ltd. kâr payı için yurt dışında ödenen verginin akıbetini gerekçesiyle açıklayınız. (6 puan)


    (d) Gürcistan''daki iş yerine ilişkin vergi ödendiğini gösteren belgeler tarhiyat sırasında ibraz edilememiş olsaydı,
    KVK md. 33''e göre ertelenebilecek vergi tutarını hesaplayınız; belge ibraz süresini ve süresinde ibraz edilmemesinin
    sonucunu açıklayınız. (5 puan)

    '
  cozum: '**(a) Gürcistan iş yeri (KVK md. 33/1, 33/4)**


    Yurt dışı kazançlar üzerinden mahsup edilebilecek vergi, bu kazançlara md. 32''deki kurumlar vergisi oranı (%25) uygulanarak
    bulunacak tutardan fazla olamaz.


    - Mahsup sınırı: 2.000.000 × %25 = **500.000 TL**.

    - Yurt dışında ödenen vergi 600.000 TL olduğundan mahsup edilecek tutar **500.000 TL**''dir.

    - Aşan **100.000 TL** mahsup edilemez. Md. 33/4''teki üç dönemlik taşıma hakkı yalnızca sınır dahilindeki, ilgili yılda
    indirilemeyen vergiler içindir; sınırı aşan tutar cari yılda olduğu gibi sonraki yıllarda da mahsup edilemez.


    **(b) (V) Ltd. kâr payı (KVK md. 33/3)**


    (A) A.Ş. sermayenin %40''ına sahiptir; %25 şartı sağlandığından yurt dışı iştirakin ödediği vergiden kâr payına isabet
    eden kısım mahsup edilebilir. Kurum kazancına eklenecek kâr payı, yurt dışında ödenen vergiler dahil edilerek (brüt) dikkate
    alınır.


    - (V) Ltd.''nin dağıttığı net kâr 2.700.000 TL; (A) A.Ş.''nin net payı 1.080.000 TL (2.700.000 × %40).

    - Brüt kâr payı: 1.080.000 / 0,90 = **1.200.000 TL** (3.000.000 × %40).

    - Kâr payına isabet eden yurt dışı vergi: 1.200.000 × %10 = **120.000 TL**.

    - Sınır: 1.200.000 × %25 = 300.000 TL; 120.000 TL sınırın altında olduğundan tamamı mahsup edilir: **120.000 TL**.


    **(c) Matrah, vergi ve ödenecek vergi**


    | Kalem | TL |

    |---|---|

    | Yurt içi kurum kazancı | 7.000.000 |

    | + Gürcistan iş yeri kazancı | 2.000.000 |

    | + (V) Ltd. brüt kâr payı | 1.200.000 |

    | = Kurumlar vergisi matrahı | **10.200.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.550.000** |

    | − Gürcistan vergisi mahsubu | 500.000 |

    | − (V) Ltd. vergisi mahsubu | 120.000 |

    | = Ödenecek kurumlar vergisi | **1.930.000** |


    (Z) Ltd.''den elde edilen 900.000 TL kâr payı md. 5/1-(b) uyarınca kurumlar vergisinden istisna edildiği için matraha
    dahil değildir. Yurt dışında istisna edilmiş kazançlar üzerinden ödenen vergiler Türkiye''de hesaplanan kurumlar vergisinden
    mahsup edilemez; bu nedenle 150.000 TL mahsup konusu yapılamaz.


    **(d) Belgelerin ibraz edilememesi (KVK md. 33/6, 33/7, 33/8)**


    Yurt dışında vergi ödendiği, yetkili makamlardan alınıp mahallindeki Türk elçilik veya konsoloslukları tarafından tasdik
    edilen belgelerle tevsik edilmelidir. Belgeler tarhiyat sırasında ibraz edilemezse yabancı ülkede ödenen veya ödenecek
    vergi, md. 32''deki kurumlar vergisi oranını (%25) aşmamak şartıyla o ülkedeki geçerli oran üzerinden hesaplanır ve tarhiyatın
    bu tutara isabet eden kısmı ertelenir.


    - Gürcistan oranı %30 olduğundan %25 ile sınırlı kalır: 2.000.000 × %25 = **500.000 TL** ertelenir.

    - Belgeler tarh tarihinden itibaren en geç **bir yıl** içinde ilgili vergi dairesine ibraz edilirse tarhiyat belgelerdeki
    kesin tutara göre düzeltilir.

    - Mücbir sebep olmaksızın belgeler bu sürede ibraz edilmezse veya ibrazdan sonra ertelenen tutardan daha düşük bir mahsup
    hakkı çıkarsa, ertelenen vergiler için 6183 sayılı Kanun hükümlerine göre gecikme zammı hesaplanır.


    Dayanak: KVK md. 5/1-(b), 32, 33/1, 33/3, 33/4, 33/6, 33/7, 33/8; 1 Seri No.lu KV Genel Tebliği bölüm 33.3, 33.5, 33.7.'
