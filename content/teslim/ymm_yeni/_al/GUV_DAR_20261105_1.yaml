  cozum: '**(a) Hakediş ödemeleri (KVK md. 30/1-(a); 9707 sayılı Cumhurbaşkanı Kararı md. 3)**


    Birden fazla takvim yılına yaygın inşaat ve onarım işleri ile uğraşan dar mükellef kurumlara bu işlerle ilgili yapılan
    hakediş ödemelerinden, ödemeyi yapan veya tahakkuk ettiren (A) A.Ş. tarafından kesinti yapılır. Kesinti oranı iş türüne
