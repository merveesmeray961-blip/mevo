    | İş | Tutar (TL) | Oran | Kesinti (TL) |

    |---|---|---|---|

    | Metro inşaatı | 12.000.000 | %1 | 120.000 |

    | Gemi onarım işi | 5.000.000 | %1 | 50.000 |

    | Otel inşaatı (diğer iş) | 8.000.000 | %5 | 400.000 |

    | **Toplam** | 25.000.000 | | **570.000** |


    **(b) Kâr payı kesintileri (KVK md. 30/3)**


    - Tam mükellef kurumlarca dar mükellef kurumlara dağıtılan ve GVK md. 75/2-(1), (2), (3) kapsamındaki kâr paylarından
    %15 kesinti yapılır; kârın sermayeye eklenmesi kâr dağıtımı sayılmadığından 1.000.000 TL kesinti matrahına girmez.

    - (X) Ltd. için matrah 4.000.000 TL, kesinti 4.000.000 × %15 = **600.000 TL**.

    - (Y) GmbH kâr payını Türkiye''deki iş yeri (şube) aracılığıyla elde ettiğinden md. 30/3''ün parantez dışı istisnası kapsamındadır;
    2.000.000 TL kâr payı üzerinden **kesinti yapılmaz**.


    **(c) KVK md. 30/7 kapsamındaki ödemeler**


    - Cumhurbaşkanınca ilan edilen ülkelerde yerleşik kurumlara yapılan her türlü ödeme, verginin konusuna girip girmediğine
    ve alıcının mükellef olup olmadığına bakılmaksızın %30 kesintiye tabidir: 1.500.000 × %30 = **450.000 TL**. Md. 30/7-(c)
    uyarınca bu ödemeler ayrıca başka bir vergi kesintisine (örneğin serbest meslek kazancı kesintisine) tabi tutulmaz.

    - Yurt dışındaki finans kuruluşundan temin edilen borçlanmaya ilişkin ana para ve faiz ödemeleri (5.000.000 TL ve 800.000
    TL) md. 30/7-(b) uyarınca bu fıkra kapsamında kesintiye tabi değildir; bu ödemeler için md. 30/7 kesintisi **yapılmaz**.


    **(d) Toplam kesinti, beyan ve mahsup**


    - Toplam kesinti: 570.000 + 600.000 + 450.000 = **1.620.000 TL**.

    - Kesintiler, kesinti yapmak zorunda olan (A) A.Ş. tarafından ödeme veya tahakkukun yapıldığı yer itibarıyla bağlı olunan
    vergi dairesine muhtasar beyanname ile bildirilir (md. 31).

    - Md. 30/9 uyarınca, ticari ve zirai kazançlar hariç, kesinti yoluyla vergilenen kazanç ve iratlar için beyanname verilmesi
    ihtiyaridir; bu nedenle (X) Ltd.''nin kâr payı için Türkiye''de beyanname vermesi zorunlu değildir.

    - (D) GmbH''nin inşaat hakedişleri ticari kazançtır; md. 30/9''daki ihtiyarilik kuralı ticari kazançlar için geçerli değildir.
    (D) GmbH, Türkiye''deki iş yeri nedeniyle yıllık kurumlar vergisi beyannamesi verir ve md. 34/1 uyarınca md. 30/1 kapsamında
    kendisinden kesilen 570.000 TL vergiyi beyanname üzerinden hesaplanan kurumlar vergisinden mahsup eder.


    Dayanak: KVK md. 30/1-(a), 30/3, 30/7, 30/9, 31, 34/1; 9707 sayılı Cumhurbaşkanı Kararı md. 3.'
