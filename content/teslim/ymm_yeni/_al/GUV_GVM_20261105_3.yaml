  - YMM
  ders: GUV
  unite: Gelir vergisi mükellefiyeti ve kazanç unsurları
  konu: GVM
  kazanim: 'arızi kazançlar: istisna kapsamı ve safi kazancın tespiti'
  tip: hesaplama
  zorluk: 3
  kok: 'Tam mükellef Bay (Z), 2022 yılında gerçek usulde vergilendirilen ticari faaliyetini terk etmiştir; başka geliri yoktur.
    2026 yılında elde ettiği ve tamamı tahsil edilmiş gelirleri şunlardır:


    | Gelir | Hasılat (TL) | Tevsik edilmiş gider (TL) |

    |---|---|---|

    | Arızi olarak yaptığı serbest meslek faaliyeti nedeniyle tahsil edilen hasılat | 260.000 | 60.000 |

    | Kiraladığı işyerindeki kiracılık hakkını devretmesi karşılığında alınan tazminat | 120.000 | 20.000 |

    | 2023 yılında zarar yazılan değersiz bir ticari alacağın 2026''da tahsili | 290.000 | 40.000 |


    GVK md. 82 uyarınca 2026 yılı için arızi kazançlara ilişkin istisna tutarı 350.000 TL''dir.


    Buna göre Bay (Z)''nin yıllık beyannameye dahil edeceği arızi kazanç tutarı kaç TL''dir?'
  secenekler:
    A: 30.000 TL
    B: 200.000 TL
    C: 250.000 TL
    D: 320.000 TL
    E: 550.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Arızi serbest meslek faaliyeti (md. 82/1-4) ve kiracılık hakkının devri karşılığı alınan tazminat (md. 82/1-3)
      istisna kapsamındaki bentlerdendir; bu kalemlerin tevsik edilmiş giderleri düşüldükten sonraki safi toplamı (260.000
      − 60.000) + (120.000 − 20.000) = 300.000 TL olup 350.000 TL''lik istisnanın altında kaldığından tamamı istisnadır. Terk
      edilen işle ilgili olarak sonradan elde edilen kazançlar (md. 82/1-5; zarar yazılan değersiz alacakların tahsili dahil)
      ise istisnanın uygulandığı (1)-(4) numaralı bentler arasında sayılmamıştır; bu kalemin safi tutarı 290.000 − 40.000
      = 250.000 TL vergiye tabidir. Püf noktaları: (1) İstisna yalnız (1)-(4) numaralı bentlerdeki kazançlara uygulanır; (5)
      numaralı bent istisna dışındadır. (2) İstisna safi (gider düşülmüş) kazanç toplamı üzerinden uygulanır. (3) Kullanılamayan
      istisna kalan kısmı (50.000 TL) (5) numaralı bendin kazancını azaltmaz.'
    celdiriciler:
      A: Giderler düşülmemiş (380.000 TL'den 350.000 TL istisna düşülmüş) ve (5) numaralı bentteki kazanç beyana dahil edilmemiştir;
        oysa bu kazanç istisna dışındadır.
      B: Üç kalemin safi toplamı (550.000 TL) üzerinden 350.000 TL istisna düşülmüştür; oysa istisna yalnız (1)-(4) numaralı
        bentlerdeki kazançlara uygulanır.
      D: Giderler düşülmeden hesap yapılmıştır (380.000 − 350.000 = 30.000 TL ile (5) numaralı bentteki brüt 290.000 TL toplanmıştır);
        oysa tevsik edilmiş giderler hasılattan indirilir.
      E: İstisna hiç uygulanmamıştır; oysa (1)-(4) numaralı bentlerdeki 300.000 TL'lik safi kazanç 350.000 TL'lik istisna
        içinde kalır.
    hesap_adimlari:
    - '(1)-(4) numaralı bentlerin safi toplamı: (260.000 − 60.000) + (120.000 − 20.000) = 300.000 TL'
    - 'İstisna sonrası bu kısım: max(0; 300.000 − 350.000) = 0'
    - '(5) numaralı bent (istisna dışı): 290.000 − 40.000 = 250.000 TL'
    - 'Beyana dahil arızi kazanç: 0 + 250.000 = 250.000 TL'
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 82/2
    alinti: Bir takvim yılında (1), (2), (3) ve (4) numaralı bentlerde yazılı olan kazançlar (henüz başlamamış olan ticarî,
      ziraî veya meslekî bir faaliyete hiç girişilmemesi ile ihale, artırma ve eksiltmelere iştirak edilmemesi karşılığında
      elde edilen kazançlar hariç) toplamının on milyar (350.000 TL) liralık kısmı gelir vergisinden müstesnadır.
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 82/1-5
    alinti: 5. Gerçek usulde vergiye tâbi mükelleflerin terk ettikleri işleri ile ilgili olarak sonradan elde ettikleri kazançlar
      (zarar yazılan değersiz alacaklarla, karşılık ayrılan şüpheli alacakların tahsili dahil).
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: md. 82/4 (safi miktar)
    alinti: 2. Bu maddenin birinci fıkrasının (2), (3), (4) ve (5) numaralı bentlerinde yazılı işlerde elde edilen hâsılattan
      tevsik edilmek kaydıyla yapılan giderler indirilir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'bent14 = (260000 - 60000) + (120000 - 20000)

      bent5 = 290000 - 40000

      sonuc = max(0, bent14 - 350000) + bent5'
