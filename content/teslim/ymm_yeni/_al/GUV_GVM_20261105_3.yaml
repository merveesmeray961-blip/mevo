  kok: 'Türkiye''de yerleşik Bay (R)''nin 2026 yılında yaptığı ve hiçbiri ticari işletmeye dahil olmayan elden çıkarma işlemleri
    aşağıdadır:


    I. 14/3/2021 tarihinde satın aldığı konutu 20/3/2026 tarihinde satmıştır.

    II. 2024 yılında babasından miras yoluyla intikal eden arsayı 2026 yılında satmıştır.

    III. Gerçek usulde vergilendirilen çiftçi olan Bay (R), 2023 yılında satın aldığı ve ziraî istihsalde kullandığı tarlayı
    2026 yılında satmıştır.

    IV. Kasım 2023''te satın aldığı arsayı 2026 yılında kurduğu bir limited şirkete sermaye olarak koymuştur.


    GVK''ya göre bu işlemlerden hangileri 2026 yılında değer artışı kazancı doğurur?'
  secenekler:
    A: Yalnız II
    B: I ve II
    C: I ve III
    D: II ve IV
    E: III ve IV
  dogru: E
  aciklama:
    dogru_neden: 'GVK mükerrer md. 80/6''ya göre iktisap şekli ne olursa olsun (ivazsız iktisaplar hariç) arazi, bina gibi
      mal ve hakların iktisap tarihinden başlayarak beş yıl içinde elden çıkarılmasından doğan kazançlar değer artışı kazancıdır;
      gerçek usulde vergiye tabi çiftçilerin ziraî istihsalde kullandıkları gayrimenkuller de buna dahildir (III). Elden çıkarma
      deyimi ticaret şirketlerine sermaye olarak konulmasını da kapsar (IV). I numaralı işlemde 14/3/2021 iktisabından başlayan
      beş yıllık süre 14/3/2026''da dolmuş, satış bu süre geçtikten sonra yapılmıştır. II numaralı işlemde arsa miras yoluyla,
      yani ivazsız iktisap edilmiştir. Püf noktaları: (1) Süre, iktisap tarihinden itibaren tam beş yıldır; satışın birkaç
      gün sonra yapılması süreyi geçirir. (2) Mirasla iktisap edilen mal satılsa da değer artışı kazancı doğmaz. (3) Çiftçinin
      ziraî istihsalde kullandığı gayrimenkul, gerçek usulde olması hâlinde süre içinde satılırsa vergiye tabidir. (4) Şirkete
      sermaye olarak koyma da elden çıkarmadır.'
    celdiriciler:
      A: II numaralı işlem ivazsız (miras yoluyla) iktisaba dayandığından kazanç doğurmaz; kazanç doğuran işlemler III ve
        IV numaralı işlemlerdir.
      B: I numaralı işlemde beş yıllık süre dolmuştur; II numaralı işlemde ise mal ivazsız (miras yoluyla) iktisap edilmiştir.
        İkisi de değer artışı kazancı doğurmaz.
      C: I numaralı işlemde beş yıllık süre 14/3/2026'da dolmuş olup satış süreden sonradır; ayrıca IV numaralı işlem de kazanç
        doğurur.
      D: II numaralı işlem ivazsız iktisaba dayandığından kazanç doğurmaz; III numaralı işlem ise gerçek usulde vergilendirilen
        çiftçinin ziraî istihsalde kullandığı gayrimenkul olup süre içinde satıldığından kazanç doğurur.
  kaynaklar:
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 80/1 (6. bent)
    alinti: 6. İktisap şekli ne olursa olsun (ivazsız olarak iktisap edilenler hariç) 70 inci maddenin birinci fıkrasının
      (1), (2), (4) ve (7) numaralı bentlerinde yazılı mal (gerçek usulde vergiye tâbi çiftçilerin ziraî istihsalde kullandıkları
      gayrimenkuller dahil) ve hakların, iktisap tarihinden başlayarak beş yıl içinde elden çıkarılmasından doğan kazançlar
  - mevzuat: 193 sayılı Gelir Vergisi Kanunu
    madde: mükerrer md. 80/2
    alinti: Bu maddede geçen “elden çıkarma” deyimi, yukarıda yazılı mal ve hakların satılması, bir ivaz karşılığında devir
      ve temliki, trampa edilmesi, takası, kamulaştırılması, devletleştirilmesi, ticaret şirketlerine sermaye olarak konulmasını
      ifade eder.
