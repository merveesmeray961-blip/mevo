  cozum: '**(a) Kontrol edilen yabancı kurum şartları (KVK md. 7)**


    | Şart | Tespit | Sonuç |

    |---|---|---|

    | Kontrol oranı (md. 7/1, 7/3) | Birlikte değerlendirme: (H) %45 + Bay (M) %10 = %55; ilgili hesap döneminde herhangi
    bir tarihte sahip olunan en yüksek oran esastır (yıl sonundaki %30 + %10 = %40 oranı belirleyici değildir) | %50''nin
    üzerinde, sağlanmıştır |

    | Pasif nitelikli gelir (md. 7/1-a) | Faiz 1.800.000 + lisans 1.000.000 + kâr payı 800.000 = 3.600.000; 3.600.000 / 12.000.000
    = %30. Faaliyetle orantılı ticari gelir pasif sayılmaz | %25''in üzerinde, sağlanmıştır |

    | Vergi yükü (md. 7/1-b, 7/2) | Vergi yükü = vergi / (dağıtılabilir kazanç + vergi) = 320.000 / (3.680.000 + 320.000)
    = %8. Malta''da kesilen 80.000 TL, kurumun başka ülkede ödediği vergi olduğundan hesaba katılmaz | %10''dan az, sağlanmıştır
    |

    | Asgari hasılat (md. 7/1-c) | Soruda aşıldığı belirtilmiştir | Sağlanmıştır |


    Dört şart birlikte gerçekleştiğinden (G) Ltd. 2026 yılı için kontrol edilen yabancı kurumdur; kazancı dağıtılsın veya
    dağıtılmasın Türkiye''de kurumlar vergisine tâbidir.


    **(b) Matrah, vergi ve mahsup**


    - Kazanç, zarar mahsubu dahil giderler düşüldükten sonra istisnalar düşülmeden önceki vergi öncesi kurum kazancıdır: 4.000.000
    TL. (H) Holding''in matrahına, (G) Ltd.''nin hesap döneminin kapandığı tarihte sahip olunan iştirak oranı ile dahil edilir:
    4.000.000 × %30 = **1.200.000 TL**.

    - Hesaplanan kurumlar vergisi: 1.200.000 × %25 = **300.000 TL**.

    - Md. 33/2 uyarınca (G) Ltd.''nin Gürcistan''da ödediği vergi mahsup edilebilir: 320.000 × %30 = **96.000 TL** (md. 33/4
    sınırı olan 300.000 TL''yi aşmaz).

    - Malta''da kesilen vergi, kontrol edilen yabancı kurumun bulunduğu ülke dışında ödendiğinden mahsup edilemez: 80.000
    × %30 = **24.000 TL** mahsup dışı kalır.

    - Ayrıca ödenecek kurumlar vergisi: 300.000 − 96.000 = **204.000 TL**.


    **(c) 2027 kâr payı dağıtımı (md. 7/5)**


    (H) Holding''e isabet eden kâr payı: 6.000.000 × %30 = 1.800.000 TL. Bunun 2026''da vergilendirilmiş kısmı 1.200.000 TL
    ayrıca vergilendirilmez; aşan **600.000 TL** (vergilenmemiş kısım) 2027 yılı kurumlar vergisi matrahına dahil edilir.


    **(d) Zarar ve gerçek kişi payı**


    - Kontrol edilen yabancı kurumun zararlarının, kuruma iştirak eden tam mükellef kurumun kazancının tespitinde dikkate
    alınması mümkün değildir; (V) Ltd.''nin 700.000 TL zararı indirilemez.

    - Gerçek kişilerin payları kontrol oranının tespitinde dikkate alınır; ancak gerçek kişilerin kontrol edilen yabancı kurumdan
    elde edecekleri kazançlar md. 7 kapsamında vergilendirilmez, yalnız tam mükellef kurumun payına isabet eden kazanç vergilendirilir.


    Dayanak: KVK md. 7/1, 7/2, 7/3, 7/4, 7/5, 33/2, 33/4; 1 Seri No.lu KV Genel Tebliği bölüm 7.1–7.5.'
