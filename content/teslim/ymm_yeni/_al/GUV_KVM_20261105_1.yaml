    2020 zararının süresi dolmuştur.


    | Yıl | Zarar (TL) | Durum |

    |---|---|---|

    | 2020 | 900.000 | Beş yıllık süre dolmuş, mahsup edilemez |

    | 2021 | 800.000 | Mahsuba konu |

    | 2022 | 1.200.000 | Mahsuba konu |

    | 2023 | 2.000.000 | Mahsuba konu |

    | 2024 | 1.500.000 | Mahsuba konu |

    | Toplam | **5.500.000** | |


    Öz sermaye sınırı 3.500.000 TL olduğundan indirilebilecek tutar **3.500.000 TL**''dir; sınırı aşan 2.000.000 TL zarar
    iptal edilir. Hangi yıl zararlarından mahsup yapılacağı beyanname ekinde bildirilmek şartıyla serbestçe belirlenebilir.


