    ortaklar mevcut sermayeye ilave olarak 200.000 TL ödeme yapmış, 100.000 TL tutarında vergiden istisna edilmiş iştirak
    kazancı elde edilmiş ve ortaklara avans olarak 350.000 TL ödenmiştir. Tasfiye dönemi sonundaki bilançoda öz sermaye 4.300.000
    TL olarak görülmektedir. Başka düzeltme kalemi yoktur. 5520 sayılı Kanun'un 17. maddesine göre bu tasfiye döneminin tasfiye
