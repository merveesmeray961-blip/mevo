    - 2025 beyannamesindeki 1.800.000 TL yurt dışı zararı, md. 9/1-(b)''deki rapor ve belge şartları sağlandığından 2025 sonucuna
    dahil edilmiş ve 1.300.000 TL''lik zarar olarak devredilmiştir.

    - Türkiye''de indirim konusu yapılan yurt dışı zarar ilgili ülkede de mahsup edildiğinden, Türkiye''deki beyannameye dahil
