  cozum: '**(a) Hesaplanan vergi ve yurt dışı vergi mahsubu (KVK md. 32/1, 33/1, 33/4)**


    Hesaplanan kurumlar vergisi: (6.000.000 + 2.000.000) × %25 = 8.000.000 × %25 = **2.000.000 TL**.


    Yurt dışında ödenen vergiler, Türkiye''de bu kazançlar üzerinden tarh olunan kurumlar vergisinden indirilebilir; ancak
    mahsup edilecek tutar, yurt dışında elde edilen kazanca md. 32''deki kurumlar vergisi oranının uygulanmasıyla bulunacak
    tutardan fazla olamaz.


    - Sınır: 2.000.000 × %25 = **500.000 TL**

    - Ödenen vergi: 600.000 TL (>500.000 TL)

    - Mahsup edilecek tutar: **500.000 TL**

    - Mahsup edilemeyen: 600.000 − 500.000 = **100.000 TL**; bu tutar, ilgili kazancın Türkiye''de genel sonuç hesaplarına
    intikal ettirildiği hesap dönemini (2026) izleyen üçüncü hesap dönemi sonuna kadar, yani **2029 hesap dönemi sonuna kadar**,
    aynı sınır dahilinde indirim konusu yapılabilir.


    **(b) Ödenecek vergi (KVK md. 34/1, 34/4)**


    | Kalem | TL |

    |---|---|

    | Hesaplanan kurumlar vergisi | 2.000.000 |

    | − Yurt dışında ödenen vergiden mahsup (md. 33) | 500.000 |

    | − Md. 15 uyarınca kesilen vergiler (md. 34/1) | 120.000 |

    | − Ödenen geçici vergiler | 1.100.000 |

    | = Ödenecek kurumlar vergisi | **280.000** |


    İlgili hesap dönemine ilişkin tahakkuk ettirilen geçici verginin yalnızca ödenen kısmı yıllık beyanname üzerinden hesaplanan
    kurumlar vergisinden mahsup edilir; tahakkuk ettiği hâlde ödenmeyen 400.000 TL mahsup edilemez.


    **(c) Belgelerin ibraz edilememesi (md. 33/6, 33/7, 33/8)**


    Yurt dışında vergi ödendiği, tasdikli belgelerle tevsik edilmedikçe mahsup yapılamaz. Belgeler tarhiyat sırasında ibraz
    edilemezse yabancı ülkede ödenen veya ödenecek vergi, md. 32''deki kurumlar vergisi oranını aşmamak şartıyla o ülkede
    geçerli oran üzerinden hesaplanır ve tarhiyatın bu tutara isabet eden kısmı ertelenir. Gürcistan''daki oran %30 olup %25''i
    aştığından %25 esas alınır: 2.000.000 × %25 = **500.000 TL** ertelenir. Belgeler tarh tarihinden itibaren en geç **bir
    yıl** içinde ibraz edilirse tarhiyat belgelerdeki kesin tutara göre düzeltilir; mücbir sebep olmaksızın ibraz edilmezse
    veya daha düşük bir mahsup hakkı olduğu anlaşılırsa ertelenen vergiler için 6183 sayılı Kanun hükümlerine göre gecikme
    zammı hesaplanır.


    **(d) Mahsupların hesaplanan vergiyi aşması (md. 34/5)**


    Mahsup edilecek vergiler toplamı: 500.000 + 120.000 + 1.900.000 = 2.520.000 TL; hesaplanan kurumlar vergisi 2.000.000
    TL olduğundan fazla tutar **520.000 TL**''dir. Durum vergi dairesince mükellefe yazı ile bildirilir; fark, mükellefin
    yazıyı tebellüğ tarihinden itibaren **bir yıl içinde** başvurması hâlinde iade olunur. Bir yıl içinde başvurulmazsa bu
    farktan doğan alacak düşer.


    Dayanak: KVK md. 32/1, 33/1, 33/4, 33/6–33/8, 34/1, 34/4, 34/5.'
