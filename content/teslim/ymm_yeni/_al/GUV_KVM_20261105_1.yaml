  kok: Tam mükellef (A) A.Ş. ile Türkiye'de tam mükellef gerçek kişi Bay (D), yurt dışında kurulu (C) Ltd.'nin ortaklarıdır;
    (C) Ltd.'nin hesap dönemi takvim yılıdır. (A) A.Ş., 2026 yılında 10/1/2026 – 9/12/2026 tarihleri arasında %28, 10/12/2026'dan
    itibaren (pay satışı sonrası) %20 oranında paya sahip olmuştur. Bay (D) yıl boyunca %25 paya sahiptir; kalan paylar ilgisiz
    yabancı kişilerdedir. (C) Ltd.'nin 2026 yılı gayrisafi hasılatı 9.000.000 TL olup bunun 3.600.000 TL'si faiz ve lisans
    ücreti gibi pasif nitelikli gelirlerdendir; asgari gayrisafi hasılat şartı sağlanmıştır. (C) Ltd.'nin vergi öncesi kurum
    kazancı 1.500.000 TL'dir ve bu kazanç üzerinden bulunduğu ülkede 90.000 TL gelir ve kurumlar vergisi benzeri vergi ödemiştir.
    Kurumlar vergisi oranı %25'tir. Buna göre (A) A.Ş.'nin bu kazanç nedeniyle 2026 yılında ayrıca ödeyeceği kurumlar vergisi
    kaç TL'dir?
  secenekler:
    A: 49.800 TL
    B: 52.500 TL
    C: 57.000 TL
    D: 75.000 TL
    E: 79.800 TL
  dogru: C
  aciklama:
    dogru_neden: 'Kontrol oranı, dönem içinde herhangi bir tarihte sahip olunan en yüksek orana göre ve ortaklar birlikte
      dikkate alınarak belirlenir: %28 + %25 = %53 (md. 7/1, 7/3). Pasif gelir oranı 3.600.000 / 9.000.000 = %40 (≥ %25) ve
      vergi yükü 90.000 / 1.500.000 = %6 (< %10) olduğundan (C) Ltd. kontrol edilen yabancı kurumdur. Matrah, hesap dönemi
      sonundaki oranla bulunur: 1.500.000 × %20 = 300.000 TL; kurumlar vergisi 75.000 TL; yurt dışında ödenen verginin payı
      90.000 × %20 = 18.000 TL md. 33/2 uyarınca mahsup edilir: 75.000 − 18.000 = 57.000 TL. Püf noktaları: (1) Kontrol testinde
      dönem içindeki en yüksek oran ve gerçek kişi ortağın payı birlikte sayılır; (2) matraha dahil edilecek kazançta ise
      dönem sonundaki oran esastır; (3) kazanç vergi öncesi tutardır, ödenen yabancı vergi düşülmez, mahsupta ise aynı (dönem
      sonu) oran kullanılır.'
    celdiriciler:
      A: Mahsup edilecek yurt dışı vergiyi dönem içindeki en yüksek oran olan %28 ile hesaplamak (90.000 × %28 = 25.200 TL;
        75.000 − 25.200 = 49.800 TL) hatalıdır; hem matrah hem mahsup dönem sonundaki %20 oranıyla bulunur.
      B: Yurt dışında ödenen vergi düşüldükten sonraki kâr (1.410.000 TL) üzerinden matrah bulmak (282.000 TL; vergi 70.500
        TL; mahsup 18.000 TL) hatalıdır; Tebliğ 7.3'e göre vergi öncesi kurum kazancı esastır.
      D: Yurt dışında ödenen verginin mahsubunu unutmak (md. 33/2) 75.000 TL sonucunu verir.
      E: Hem matrahı hem mahsubu %28 oranıyla hesaplamak (420.000 × %25 = 105.000; 105.000 − 25.200 = 79.800 TL) hatalıdır;
        kazanç, hesap dönemi sonunda sahip olunan oranla dahil edilir.
    hesap_adimlari:
    - 'Kontrol: %28 + %25 = %53 ≥ %50 (dönem içindeki en yüksek oran)'
    - 'Pasif gelir oranı: 3.600.000 / 9.000.000 = %40; vergi yükü: 90.000 / 1.500.000 = %6'
    - 'Matrah: 1.500.000 × %20 = 300.000 TL'
    - 'Kurumlar vergisi: 300.000 × %25 = 75.000 TL'
    - 'Mahsup: 90.000 × %20 = 18.000 TL'
    - 'Ödenecek: 75.000 − 18.000 = 57.000 TL'
