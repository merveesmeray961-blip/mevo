  soru: '(Y) Eğitim ve Tekstil A.Ş. tam mükellef bir sermaye şirketidir (finans veya sigorta kuruluşu değildir; hesap dönemi
    takvim yılıdır; ihracat, üretim veya yatırım teşvik belgesine dayalı indirimli oran uygulanmamaktadır; 2026 yılı için
    kurumlar vergisi oranı %25''tir). Şirketin 2026 hesap dönemine ilişkin bilgileri aşağıdadır. Tabloda sayılan sponsorluk
    harcamaları ile bağış ve yardımların tamamı dönem içinde gider yazılmış ve ticari bilanço kârının hesabında dikkate alınmıştır.


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 20.000.000 |

    | Ticari bilanço kârına dâhil, tam mükellef bir kurumdan alınan kâr payı | 2.000.000 |

    | Mahsup edilebilir geçmiş yıl zararı | 1.000.000 |

    | Amatör spor dalındaki bir kulübe, 3289 sayılı Kanun kapsamında yapılan sponsorluk harcaması | 1.000.000 |

    | Profesyonel bir futbol takımına, 3813 sayılı Kanun kapsamında yapılan sponsorluk harcaması | 2.000.000 |

    | Bir belediyeye, okul binası inşası için makbuz karşılığı yapılan bağış | 1.500.000 |

    | Cumhurbaşkanınca vergi muafiyeti tanınan bir vakfa, Kültür ve Turizm Bakanlığınca desteklenmesi uygun görülen bir kütüphane
    ve müze yapımı projesi için makbuz karşılığı yapılan bağış (Bakanlığın yazısı beyanname ekinde verilecektir) | 800.000
    |

    | Türkiye Kızılay Derneğine makbuz karşılığı yapılan nakdî bağış | 500.000 |

    | Türkiye Kızılay Derneğinin iktisadi işletmesine makbuz karşılığı yapılan nakdî bağış | 200.000 |

    | Makbuz alınmaksızın bir derneğe yapılan nakdî yardım | 100.000 |

    | Yukarıdakiler dışındaki kanunen kabul edilmeyen giderler | 900.000 |


    Şirket, 2026 kârından 213 sayılı VUK md. 325/A uyarınca **2.500.000 TL** girişim sermayesi fonu ayırmış ve özel fon hesabına
    almıştır. Şirketin 2026 yıl sonu öz sermayesi 30.000.000 TL''dir (daha önce ayrılmış fon yoktur). Ayrılan fon tutarı,
    20/12/2026 tarihinde Sermaye Piyasası Kurulunun düzenleme ve denetimine tabi bir girişim sermayesi yatırım fonunun paylarının
    satın alınmasında kullanılmış ve beyannamede ayrıca gösterilecektir.


    Yurt içi asgari kurumlar vergisi (KVK md. 32/C) karşılaştırmasının hesaplanan vergiyi değiştirmediği kabul edilecektir.


    **İstenenler:**


    (a) Kurum kazancını bulunuz; iştirak kazancı istisnası ve geçmiş yıl zararı sonrasında, KVK md. 10/1 kapsamında sırasıyla
    (b), (ç), (d) ve (f) bentlerine göre indirilecek tutarları hesaplayınız; indirilemeyen kalemleri gerekçeleriyle belirtiniz.
    (10 puan)


    (b) KVK md. 10/1-(g) kapsamında girişim sermayesi fonu indirimine esas "beyan edilen geliri" ve indirim tutarını (öz sermaye
    sınırını da kontrol ederek) bulunuz. (6 puan)


    (c) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz. (4 puan)


    (d) Şirket, ayırdığı fonu 2026 yılı sonuna kadar girişim sermayesi yatırım ortaklığına veya fonuna yatırmamış olsaydı,
    indirim nedeniyle ne kadar vergi ve hangi mali yükümlülükle tahsil edilirdi? (5 puan)

    '
  cozum: '**(a) Kurum kazancı ve KVK md. 10/1 indirimleri**


    Gider yazılan bağış ve sponsorluk tutarları kanunen kabul edilmeyen gider olarak ticari kâra eklenir (Tebliğ 10.3).


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 20.000.000 |

    | + Kanunen kabul edilmeyen giderler (3.000.000 + 1.500.000 + 800.000 + 500.000 + 200.000 + 100.000 + 900.000) | 7.000.000
    |

    | = Kurum kazancı | **27.000.000** |

    | − Tam mükellef kurum kâr payı istisnası (KVK md. 5/1-a) | 2.000.000 |

    | − Geçmiş yıl zararı | 1.000.000 |

    | = İndirimler öncesi tutar | **24.000.000** |


    İndirimler beyannamede ayrıca gösterilmek şartıyla Kanundaki sırasıyla yapılır (Tebliğ 10.1):


    | Bent | Açıklama | İndirilen (TL) |

    |---|---|---|

    | (b) | Amatör spor sponsorluğu tamamı 1.000.000; profesyonel spor sponsorluğu %50''si (2.000.000 × %50 = 1.000.000) |
    2.000.000 |

    | (ç) | Belediyeye okul inşası için bağışın tamamı | 1.500.000 |

    | (d) | Kültür ve Turizm Bakanlığınca desteklenen kütüphane/müze projesine makbuz karşılığı bağışın %100''ü (Bakanlık
    yazısı beyanname ekinde) | 800.000 |

    | (f) | Kızılay''a makbuz karşılığı nakdî bağışın tamamı | 500.000 |

    | | **Toplam (b)+(ç)+(d)+(f)** | **4.800.000** |


    İndirilemeyen kalemler: profesyonel spor sponsorluğunun yarısı olan 1.000.000 TL (kanun yalnızca %50''sine izin verir);
    Kızılay''ın iktisadi işletmesine yapılan 200.000 TL (md. 10/1-f "iktisadi işletmeleri hariç"; Tebliğ 10.3.2.5); makbuz
    alınmayan 100.000 TL (makbuz karşılığı yapılmayan bağış indirim konusu olamaz, Tebliğ 10.3.2.2.4). Bu tutarlar ile 900.000
    TL diğer gider, kanunen kabul edilmeyen gider olarak kalır.


    **(b) Girişim sermayesi fonu (md. 10/1-g)**


    Tebliğ 10.4.2''ye göre beyan edilen gelir = ticari bilanço kârı + KKEG − geçmiş yıl zararları − tüm indirim ve istisnalar:


    20.000.000 + 7.000.000 − 1.000.000 − (2.000.000 istisna + 4.800.000 indirim) = **19.200.000 TL**


    - Yıllık sınır: 19.200.000 × %10 = **1.920.000 TL**

    - Toplam fon sınırı: 30.000.000 × %20 = 6.000.000 TL (ayrılan 2.500.000 TL bu sınırın altındadır)

    - İndirim = min(2.500.000; 1.920.000) = **1.920.000 TL**. Aşan 580.000 TL için sonraki yıllarda tekrar indirim uygulanmaz
    (Tebliğ 10.4.2).


    **(c) Matrah ve vergi**


    | Kalem | Tutar (TL) |

    |---|---|

    | İndirimler öncesi tutar | 24.000.000 |

    | − (b), (ç), (d), (f) bent indirimleri | 4.800.000 |

    | − (g) bent indirimi | 1.920.000 |

    | = Kurumlar vergisi matrahı | **17.280.000** |

    | Hesaplanan kurumlar vergisi (%25) | **4.320.000** |


    **(d) Fonun yatırıma dönüştürülmemesi**


    Fonun, ayrıldığı yılın sonuna kadar girişim sermayesi yatırım ortaklıklarına veya fonlarına yatırılmaması halinde indirim
    konusu yapılan 1.920.000 TL nedeniyle tahakkuk ettirilmeyen vergi, yani 1.920.000 × %25 = **480.000 TL**, gecikme faizi
    ile birlikte tahsil edilir (Tebliğ 10.4.2). Ceza uygulaması söz konusu değildir; tahsil edilecek yük vergi aslı ile gecikme
    faizinden ibarettir.

    '
