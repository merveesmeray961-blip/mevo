  soru: '(Ö) Yazılım ve Makine A.Ş. tam mükellef bir sermaye şirketidir (hesap dönemi takvim yılı; teknoloji merkezi işletmesi,
    Ar-Ge merkezi veya tasarım merkezi değildir; 2026 yılı için kurumlar vergisi oranı %25''tir). Şirket işletmesi bünyesinde
    iki proje yürütmektedir. P1 projesi, 5746 sayılı Kanun md. 3/A kapsamında Sanayi ve Teknoloji Bakanlığınca Ar-Ge ve yenilik
    projesi olarak değerlendirilmiştir; P2 projesi için böyle bir değerlendirme yapılmamıştır. Tüm harcamalar ve sponsorluk
    tutarları 2026 yılında gider yazılmıştır. Şirketin 2026 yılına ilişkin bilgileri:


    | Bilgi | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | P1 için yapılan, Ar-Ge faaliyetiyle doğrudan ilişkili ve kapsama uygun harcamalar (amortismanlar hariç) | 2.400.000
    |

    | Yalnızca P1''de kullanılan laboratuvar cihazlarının 2026 amortismanı | 600.000 |

    | Hem üretimde hem P1''de kullanılan CNC tezgâhının 2026 amortismanı (tezgâh 2026''da 365 günün 73 günü P1''de kullanılmıştır)
    | 1.460.000 |

    | P1''e dağıtılan genel yönetim gideri payı (Ar-Ge faaliyetiyle doğrudan ilişkisi yoktur) | 500.000 |

    | P2 projesine ilişkin harcamalar | 1.000.000 |

    | Amatör spor dalında, 3289 sayılı Kanun kapsamında yapılan sponsorluk harcaması | 400.000 |

    | Profesyonel spor dalında, 3813 sayılı Kanun kapsamında yapılan sponsorluk harcaması | 600.000 |

    | Diğer kanunen kabul edilmeyen giderler | 1.000.000 |

    | Mahsup edilebilir geçmiş yıl zararı | 1.500.000 |


    Yurt içi asgari kurumlar vergisi (KVK md. 32/C) karşılaştırması bu vakanın kapsamı dışındadır; yalnızca genel hesap istenmektedir.


    **İstenenler:**


    (a) 2026 yılında 5746 sayılı Kanun md. 3/A uyarınca indirim konusu yapılabilecek Ar-Ge indirimi tutarını, her kalem için
    gerekçesini göstererek hesaplayınız. (8 puan)


    (b) Kurum kazancını, kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; Ar-Ge indirimi ile sponsorluk
    indiriminin uygulanma sırasını belirtiniz. (6 puan)


    (c) Geçmiş yıl zararı mahsubundan sonraki kurum kazancı yalnızca **3.000.000 TL** olsaydı (diğer bilgiler aynı kalmak
    üzere) Ar-Ge indiriminin ne kadarı kullanılabilir, ne kadarı devreder ve sponsorluk harcamaları bakımından sonuç ne olur?
    (6 puan)


    (d) Şirketin ayrıca, yurt dışında yerleşik müşterisine verdiği ve KVK md. 10/1-(ğ) şartlarını (yurt dışında yararlanma,
    yurt dışı müşteri adına fatura, kazancın süresinde Türkiye''ye transferi) sağlayan yazılım hizmetinden elde ettiği ve
    ticari bilanço kârına dâhil olan 1.000.000 TL kazancı bulunmaktadır (md. 10/1-(ğ) indirim oranı 2026 yılı için %100''dür).
    Bu kazanç için (ğ) bendi indiriminden yararlanılıp yararlanılamayacağını gerekçesiyle belirtiniz ve (b) şıkkındaki matraha
    etkisini gösteriniz. (4 puan)

