  dogrulama:
    python: 'tbk = 20000000

      kkeg = 3000000 + 1500000 + 800000 + 500000 + 200000 + 100000 + 900000

      kurum_kazanci = tbk + kkeg

      sonra_zarar = kurum_kazanci - 2000000 - 1000000

      spor = 1000000 + 2000000 * 50 // 100

      ind_bcdf = spor + 1500000 + 800000 + 500000

      beyan_edilen = tbk + kkeg - 1000000 - (2000000 + ind_bcdf)

      fon_ind = min(2500000, beyan_edilen * 10 // 100, 30000000 * 20 // 100)

      matrah = sonra_zarar - ind_bcdf - fon_ind

      kv = matrah * 25 // 100

      sonuc = {''a'': kurum_kazanci, ''a2'': sonra_zarar, ''a3'': ind_bcdf, ''b'': beyan_edilen, ''b2'': fon_ind, ''c'': matrah,
      ''c2'': kv, ''d'': fon_ind * 25 // 100}

      '
