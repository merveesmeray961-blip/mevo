  cozum: '**(a) Ar-Ge indirimi (5746 sayılı Kanun md. 3/A)**


    İndirim, münhasıran yeni teknoloji ve bilgi arayışına yönelik Ar-Ge harcamalarının %100''ü üzerinden, projenin Bakanlıkça
    Ar-Ge ve yenilik projesi olarak değerlendirilmesi şartıyla yapılır (md. 3/A-1). Ar-Ge faaliyetleriyle doğrudan ilişkili
    olmayan giderlerden indirim hesaplanmaz; yalnızca Ar-Ge''de kullanılan amortismana tabi kıymetlerin amortismanı tam, başka
    faaliyetlerde de kullanılan makine ve teçhizatın amortismanı ise Ar-Ge''de kullanıldığı gün sayısına isabet eden kısım
    kadar dikkate alınır (md. 3/A-3).


    | Kalem | Dikkate alınan (TL) | Gerekçe |

    |---|---|---|

    | P1 doğrudan Ar-Ge harcamaları | 2.400.000 | Onaylı proje, doğrudan ilişkili |

    | Yalnız P1''de kullanılan cihaz amortismanı | 600.000 | Tamamen Ar-Ge''de kullanılıyor |

    | CNC tezgâhı amortismanı | 292.000 | 1.460.000 × 73 / 365 |

    | Genel yönetim gideri payı | 0 | Doğrudan ilişkili değil |

    | P2 harcamaları | 0 | Bakanlıkça Ar-Ge projesi olarak değerlendirilmemiş |

    | **Ar-Ge indirimi** | **3.292.000** | |


    **(b) Matrah ve vergi**


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 12.000.000 |

    | + KKEG (sponsorluk 400.000 + 600.000, diğer 1.000.000) | 2.000.000 |

    | = Kurum kazancı | **14.000.000** |

    | − Geçmiş yıl zararı | 1.500.000 |

    | = Zarar mahsubu sonrası tutar | 12.500.000 |

    | − Ar-Ge indirimi | 3.292.000 |

    | − Sponsorluk (md. 10/1-b): amatör 400.000 + profesyonel 600.000 × %50 = 300.000 | 700.000 |

    | = Kurumlar vergisi matrahı | **8.508.000** |

    | Hesaplanan kurumlar vergisi (%25) | **2.127.000** |


    Tebliğ 10.1''e göre md. 10 indirimleri Kanundaki sırasıyla yapılır; Ar-Ge indirimi, sponsorluk harcamaları ve bağışlardan
    önce uygulanır.


    **(c) Kazancın yetersiz olması**


    Kazanç 3.000.000 TL olduğundan önce Ar-Ge indirimi uygulanır: kullanılan **3.000.000 TL**; kalan 3.292.000 − 3.000.000
    = **292.000 TL** Ar-Ge indirimi sonraki vergilendirme dönemlerine devreder ve devreden tutar her yıl VUK''a göre belirlenen
    yeniden değerleme oranında artırılarak dikkate alınır (5746 sayılı Kanun md. 3/A-2). Kazanç kalmadığından sponsorluk indirimi
    (700.000 TL) hiç yapılamaz; md. 10''daki diğer indirimler kazancın yetersizliği halinde sonraki yıllara devredilemediğinden
    bu tutar kaybolur. Matrah 0 olur.


    **(d) 10/1-(ğ) indirimi**


    5746 sayılı Kanun kapsamındaki indirim, istisna, destek ve teşviklerden yararlananlar KVK md. 10/1-(ğ) hükümlerinden ayrıca
    yararlanamaz (5746 sayılı Kanun md. 4/5). Şirket Ar-Ge indiriminden yararlandığından 1.000.000 TL''lik yazılım kazancı
    için (ğ) indirimi uygulanamaz. Matrah (b) şıkkındaki **8.508.000 TL** olarak kalır; indirim yapılsaydı matrah 7.508.000
    TL''ye düşecek ve vergi 250.000 TL eksik hesaplanmış olacaktı.

    '
