    alinti: Bu vergi, katma değer vergisi matrahına dahil edilmez, gelir ve kurumlar vergisi uygulamasında gider kaydedilmez
      ve hiçbir vergiden mahsup edilmez.
  - mevzuat: 7194 sayılı Dijital Hizmet Vergisi Kanunu
    madde: md. 4/6-b
    alinti: b) 13/7/1956 tarihli ve 6802 sayılı Gider Vergileri Kanununun 39 uncu maddesi kapsamında üzerinden özel iletişim
