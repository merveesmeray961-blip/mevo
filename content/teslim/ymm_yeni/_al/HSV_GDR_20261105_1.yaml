  - olcut: Finansman matrahı 3.400.000 TL ve vergi 170.000 TL
    puan: 2
  - olcut: 120.000 ve 1.000.000 TL kalemlerinin istisna olması
    puan: 2
  - olcut: Tüketici iadesi indirimi 5.000 TL ve ödenecek 165.000 TL
    puan: 2
  - olcut: Mükellef ve BSMV'nin matraha dahil edilmemesi
    puan: 2
  - olcut: Beyan yeri, 15 Mayıs 2026 süresi ve ödeme süresi
    puan: 3
  kaynaklar:
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 31/3
    alinti: Sigorta işlemlerinde verginin matrahı, bu işlem dolayısıyla poliçede yer alan prim tutarıdır. Prim tutarının hesabında,
      sigorta işlemi dolayısıyla komisyon ve benzeri adlarla sigorta aracılarına yapılan ödemeler indirim konusu yapılamaz.
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 31/5
    alinti: Sigorta şirketleri, iptal ettikleri sigorta muamelelerine ilişkin vergileri (yalnızca iptal tarihinden sonraki
      döneme ait olan kısmı), iptalin gerçekleştiği dönemde; bankalar ve finansman şirketleri, 7/11/2013 tarihli ve 6502 sayılı
      Tüketicinin Korunması Hakkında Kanun gereğince tüketicilere iade ettikleri ücret, komisyon ve benzeri adlarla tahsil
      ettikleri tutarlara ilişkin vergileri, iadenin gerçekleştiği dönemde hesaplanan banka ve sigorta muameleleri vergisinden
      indirebilirler.
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 29/d
    alinti: d) Bankaların müşterileri nam ve hesabına başka şahıs ve müesseselere yaptırdıkları hizmetler mukabili olarak
      aldıkları ve aynen mezkür şahıs veya müesseselere ödedikleri paralar,
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 29/i
    alinti: Emeklilik sözleşmeleri, hayat sigortaları (hayat sigortalarında ferdi kaza, hastalık sonucu maluliyet ve tehlikeli
      hastalıklar teminatlarının da ek teminat olarak verildiği sözleşmeler dahil) ve sağlık sigortaları ile ihracata ait
      nakliyat sigortalarında
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 47/a
    alinti: her mükellef, bir ay içindeki vergiye tabi muamelelerini bir beyanname ile ertesi ayın 15 inci günü akşamına kadar
  - mevzuat: 6802 sayılı Gider Vergileri Kanunu
    madde: md. 48
    alinti: Mükellefler, beyanname üzerinden tarh ve tahakkuk ettirilen vergileri, beyanname verme süresi içinde ödemeye mecburdurlar.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
  dogrulama:
    python: 'oran = 0.05

      prim = 6000000

      bsmv_sig = prim * oran

      istisna = 2000000 + 500000 + 300000 + 400000

      iptal_ind = 200000 * oran

      sig_odenecek = bsmv_sig - iptal_ind

      fin_matrah = 3000000 + 400000

      fin_bsmv = fin_matrah * oran

      iade_ind = 100000 * oran

      fin_odenecek = fin_bsmv - iade_ind

      sonuc = {"sigorta_matrah": prim, "sigorta_bsmv": bsmv_sig, "istisna_toplam": istisna, "iptal_indirim": iptal_ind, "sigorta_odenecek":
      sig_odenecek, "fin_matrah": fin_matrah, "fin_bsmv": fin_bsmv, "iade_indirim": iade_ind, "fin_odenecek": fin_odenecek}

      '
