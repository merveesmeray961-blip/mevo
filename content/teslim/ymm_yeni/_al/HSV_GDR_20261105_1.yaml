  zorluk: 1
  kok: Sigorta aracısı (A) Acentesi, Nisan 2026'da (S) Sigorta A.Ş. adına toplam 5.000.000 TL prim içeren trafik sigortası
    poliçeleri düzenlemiş ve bu poliçeler nedeniyle kendisine 600.000 TL komisyon ödenmiştir. Bu soruda BSMV oranı %5 kabul
