klasik:
- id: TASLAK
  sinav: ymm
  ders: HSV
  konu: GDR
  kazanimlar:
  - banka ve sigorta muameleleri vergisinin matrahı
  - BSMV istisnaları
  - iptal ve iade nedeniyle indirim
  - beyan ve ödeme
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(S) Sigorta A.Ş.** ile ikraz işleriyle uğraşan **(F) Finansman A.Ş.**''nin Nisan 2026 dönemine ilişkin bilgileri
    aşağıdadır. Bu soruda banka ve sigorta muameleleri vergisi (BSMV) oranı, kambiyo muameleleri dışındaki muameleler için
    **%5** kabul edilecektir. Tutarların hiçbirine BSMV dahil değildir.


    **(S) Sigorta A.Ş. – Nisan 2026''da düzenlenen poliçelerdeki prim tutarları**


    | Poliçe grubu | Prim (TL) |

    |---|---|

    | Kasko, trafik ve yangın sigortaları | 6.000.000 |

    | Hayat sigortası sözleşmeleri | 2.000.000 |

    | İhracata ait nakliyat sigortaları | 500.000 |

    | Mükerrer sigorta muameleleri dolayısıyla alınan primler | 300.000 |

    | Biçilmemiş tarım mahsulleri için akdedilen zirai sigortalar | 400.000 |


    - Kasko, trafik ve yangın poliçeleri için sigorta aracılarına (acentelere) 900.000 TL komisyon ödenmiştir.

    - Mart 2026 döneminde BSMV beyan edilen ve 1.000.000 TL prim içeren yıllık bir poliçe, 1 Nisan 2026''da iptal edilmiştir.
    Poliçenin iptal tarihinden sonraki döneme ait prim kısmı 200.000 TL''dir.


    **(F) Finansman A.Ş. – Nisan 2026''da lehine alınan paralar**


    | Kalem | Tutar (TL) |

    |---|---|

    | Müşterilerden tahsil edilen kredi faizleri | 3.000.000 |

    | Komisyon ve ücret gelirleri | 400.000 |

    | Müşterileri nam ve hesabına üçüncü kişilere yaptırdığı hizmet karşılığında aldığı ve aynen o kişilere ödediği paralar
    | 120.000 |

    | Sermayesinin tamamı kendisine ait sınai iştirakinden sağladığı kâr | 1.000.000 |


    - Nisan 2026''da 6502 sayılı Tüketicinin Korunması Hakkında Kanun gereğince tüketicilere iade ettiği komisyon tutarı 100.000
    TL''dir (bu komisyonlara ilişkin BSMV önceki dönemlerde ödenmiştir).


    **İstenenler**


    (a) (S) Sigorta A.Ş.''nin Nisan 2026 BSMV matrahını ve vergisini hesaplayınız; acente komisyonunun ve istisna kapsamındaki
    primlerin durumunu gerekçesiyle açıklayınız. **(8 puan)**


    (b) İptal edilen poliçenin vergi bakımından sonucunu açıklayınız ve (S)''nin Nisan 2026''da ödeyeceği BSMV''yi bulunuz.
    **(5 puan)**


    (c) (F)''nin banker sayılıp sayılmadığını belirtiniz; matrahını, vergisini ve tüketicilere yapılan iade nedeniyle indirimi
    dikkate alarak ödeyeceği BSMV''yi hesaplayınız; istisna kapsamındaki kalemleri gerekçesiyle gösteriniz. **(7 puan)**


    (d) Verginin mükellefini, BSMV''nin matraha dahil olup olmadığını, beyanname verme yerini ve süresini ile ödeme süresini
    belirtiniz. **(5 puan)**

    '
  cozum: '**(a) Sigorta A.Ş. – matrah ve vergi (6802 md. 28, 29, 31, 33)**


    Sigorta işlemlerinde matrah, poliçede yer alan prim tutarıdır; sigorta aracılarına yapılan komisyon ve benzeri ödemeler
    matrahtan **indirilemez** (md. 31/3). Bu nedenle 900.000 TL acente komisyonu düşülmez.


    | Poliçe grubu | Prim (TL) | Durum | Dayanak |

    |---|---|---|---|

    | Kasko, trafik, yangın | 6.000.000 | Vergiye tabi | md. 28 |

    | Hayat sigortası | 2.000.000 | İstisna | md. 29/i |

    | İhracata ait nakliyat sigortası | 500.000 | İstisna | md. 29/i |

    | Mükerrer sigorta muameleleri | 300.000 | İstisna | md. 29/j |

    | Zirai sigorta (biçilmemiş tarım mahsulü) | 400.000 | İstisna | md. 29/k |

    | **İstisna toplamı** | **3.200.000** | | |


    Matrah = 6.000.000 TL; BSMV = 6.000.000 × %5 = **300.000 TL**.


    **(b) İptal**


    Sigorta şirketleri, iptal ettikleri sigorta muamelelerine ilişkin vergileri (yalnız iptal tarihinden sonraki döneme ait
    kısmı) iptalin gerçekleştiği dönemde hesaplanan BSMV''den indirebilirler (md. 31/5). İndirilecek vergi = 200.000 × %5
    = **10.000 TL**. Ödenecek BSMV = 300.000 − 10.000 = **290.000 TL**.


    **(c) Finansman A.Ş.**


    90 sayılı KHK''ya göre ikraz işleriyle uğraşanlar bu Kanunun uygulanmasında banker sayılır (md. 28/3); (F) banker olarak
    BSMV mükellefidir.


    | Kalem | Tutar (TL) | Durum |

    |---|---|---|

    | Kredi faizleri | 3.000.000 | Vergiye tabi |

    | Komisyon ve ücretler | 400.000 | Vergiye tabi |

    | Müşteri adına yaptırılıp aynen ödenen hizmet bedelleri | 120.000 | İstisna (md. 29/d) |

    | Tamamı kendisine ait sınai iştirakten kâr | 1.000.000 | İstisna (md. 29/e) |


    Matrah = 3.400.000 TL; BSMV = 3.400.000 × %5 = **170.000 TL**. Finansman şirketleri 6502 sayılı Kanun gereğince tüketicilere
    iade ettikleri komisyonlara ilişkin vergiyi iadenin gerçekleştiği dönemde indirebilir (md. 31/5): 100.000 × %5 = **5.000
    TL**. Ödenecek BSMV = 170.000 − 5.000 = **165.000 TL**.


    **(d) Mükellef, matrah, beyan ve ödeme**


    - Mükellef: banka ve bankerler ile sigorta şirketleridir; sigorta aracılarının yaptığı sigorta işlemlerinde de mükellef
    sigorta şirketidir (md. 30).

    - BSMV''nin kendisi matraha dahil edilmez (md. 31/4).

    - Beyan: bir aylık muameleler ertesi ayın 15''inci günü akşamına kadar (Nisan 2026 için **15 Mayıs 2026**) bir beyanname
    ile bildirilir. Banker olan (F) için muamelelerin yapıldığı yer, sigorta muameleleri için (S)''nin kanuni veya iş merkezinin
    bulunduğu yer vergi dairesine verilir (md. 47/a).

    - Ödeme: beyanname verme süresi içinde yapılır (md. 48).

    '
  puanlama:
  - olcut: Sigorta matrahı 6.000.000 TL, komisyonun indirilmemesi ve 300.000 TL vergi
