  kazanimlar:
  - özel iletişim vergisi
  - dijital hizmet vergisi
  - vergilerin gider yazılması ve belgelerde gösterilmesi
  - beyan ve ödeme süreleri
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: '**(B) Telekom A.Ş.**, elektronik haberleşme işletmecisidir ve aynı zamanda mobil uygulama mağazası, dijital reklam
    ve kullanıcı platformu hizmetleri sunmaktadır. (B), dijital hizmet vergisi (DHV) bakımından muafiyet hadlerini aşmış ve
    2026 yılında DHV mükellefi olmuştur. Aşağıdaki bilgiler Ekim 2026 dönemine aittir (tutarlar KDV hariçtir; vergilendirme
    dönemi birer aylıktır).


    Bu soruda aşağıdaki oran ve tutarlar kabul edilecektir: özel iletişim vergisi (ÖİV) oranı **%10**; mobil telefon aboneliğinin
    ilk tesisinde alınan maktu ÖİV **700 TL/abonelik**; 2026 yılında DHV oranı **%5**.


    | Hizmet | Tutar |

    |---|---|

    | Mobil elektronik haberleşme hizmetleri (ön ödemeli yüklemeler dahil) – KDV matrahı | 20.000.000 TL |

    | Mobil internet servis sağlayıcılığı hizmeti – KDV matrahı | 5.000.000 TL |

    | Radyo ve televizyon yayınlarının uydu platformu ve kablo ortamından iletilmesi – KDV matrahı (dijital ortamda sunulmaktadır)
    | 3.000.000 TL |

    | Mobil oyun ve uygulama satışı (dijital içerik) | 100.000 USD |

    | Dijital ortamda sunulan reklam hizmetleri | 2.500.000 TL |

    | Kullanıcıların birbirleriyle etkileşime geçtiği platformun işletilmesi | 1.500.000 TL |

    | 6493 sayılı Kanun md. 12 kapsamındaki ödeme hizmetlerinden elde edilen hasılat | 900.000 TL |

    | Ar-Ge merkezinde geliştirilen yazılım ürünlerinin satışı | 600.000 TL |


    - Oyun ve uygulama satışlarının yapıldığı tarihte geçerli TCMB döviz alış kuru 1 USD = 40 TL''dir.

    - Ekim 2026''da sesli iletişim için **1.000** yeni mobil telefon aboneliği ilk kez tesis edilmiş; ayrıca yalnız makineler
    arası veri aktarımına mahsus ve başka amaçla kullanılmayan **400** abonelik tesis edilmiştir.

    - DHV konusuna giren hizmetlere ilişkin (B)''nin ilgili giderleri 3.000.000 TL''dir.


    **İstenenler**


    (a) Ekim 2026 ÖİV''nin matrahını ve toplam vergisini (ilk tesis tutarı dahil) hesaplayınız. **(8 puan)**


    (b) DHV matrahını hesaplayınız; istisna kapsamındaki kalemleri gerekçesiyle belirtiniz; DHV''yi bulunuz ve giderlerin
    matrahtan indirilip indirilmeyeceğini açıklayınız. **(8 puan)**


    (c) ÖİV ve DHV beyannamelerinin Ekim 2026 dönemi için verilme ve ödeme sürelerinin son günlerini belirtiniz. **(5 puan)**


    (d) ÖİV''nin KDV matrahına etkisini; ÖİV ve DHV''nin gelir/kurumlar vergisi bakımından gider yazılıp yazılamayacağını
    ve belgelerde gösterilip gösterilmeyeceğini açıklayınız. **(4 puan)**

    '
  cozum: '**(a) ÖİV (6802 md. 39)**


    Mobil elektronik haberleşme, radyo-TV yayınlarının uydu/kablo ortamından iletilmesi ve mobil internet hizmetleri ÖİV''ye
    tabidir; matrah KDV matrahını oluşturan unsurlardan teşekkül eder.


    | Kalem | Hesap | Tutar (TL) |

    |---|---|---|

    | Matrah | 20.000.000 + 5.000.000 + 3.000.000 | 28.000.000 |

    | ÖİV | 28.000.000 × %10 | 2.800.000 |

    | İlk tesis maktu ÖİV | 1.000 × 700 | 700.000 |

    | **Toplam ÖİV** | | **3.500.000** |


    Yalnız makineler arası veri aktarımına mahsus ve başka amaçla kullanılmayan 400 abonelik ilk tesis vergisinden hariçtir
    (md. 39/3).


    **(b) DHV (7194 md. 1, 4, 5)**


    | Kalem | Hesap | Tutar (TL) | Durum |

    |---|---|---|---|

    | Oyun/uygulama satışı | 100.000 × 40 (elde edildiği tarihteki TCMB döviz alış kuru) | 4.000.000 | Konu (md. 1/1-b) |

    | Dijital reklam | | 2.500.000 | Konu (md. 1/1-a) |

    | Etkileşim platformu | | 1.500.000 | Konu (md. 1/1-c) |

    | ÖİV alınan yayın iletim hizmeti | | 3.000.000 | İstisna (md. 4/6-b) |

    | Ödeme hizmetleri | | 900.000 | İstisna (md. 4/6-d) |

    | Ar-Ge merkezi ürün satışı | | 600.000 | İstisna (md. 4/6-ç) |


    DHV matrahı = 4.000.000 + 2.500.000 + 1.500.000 = **8.000.000 TL**; DHV = 8.000.000 × %5 = **400.000 TL**. Verginin matrahından
    gider, maliyet ve vergi adı altında indirim yapılmaz (md. 5/2); 3.000.000 TL gider düşülmez. İstisna kapsamındaki hasılat
    muafiyet hadlerinin tespitinde de dikkate alınmaz (md. 4/6).


    **(c) Süreler**


    - ÖİV: bir aya ait vergi izleyen ayın 15''inci günü akşamına kadar beyan edilir ve aynı süre içinde ödenir (md. 39/6):
    Ekim 2026 için **15 Kasım 2026**. Bu verginin beyan ve ödenmesinde 47 ve 48 inci madde hükümleri uygulanmaz.

    - DHV: beyanname vergilendirme dönemini takip eden ayın sonuna kadar verilir ve aynı süre içinde ödenir (md. 6/3, 6/6):
    **30 Kasım 2026**.


    **(d) Diğer sonuçlar**


    | | ÖİV | DHV |

    |---|---|---|

    | Gelir/kurumlar vergisi | Gider kaydedilmez ve hiçbir vergiden mahsup edilmez | Safi kazancın tespitinde gider olarak
    indirilebilir (md. 6/7) |

    | Belgelerde gösterim | Faturada ayrıca gösterilir | Fatura ve fatura yerine geçen belgelerde ayrıca gösterilmez (md.
    5/2) |


    ÖİV, KDV matrahına dahil edilmez (md. 39/7).

    '
