    python: 'oiv_matrah = 20000000 + 5000000 + 3000000

      oiv_hizmet = oiv_matrah * 0.10

      oiv_ilk = 1000 * 700

      oiv_toplam = oiv_hizmet + oiv_ilk

      dhv_matrah = 100000 * 40 + 2500000 + 1500000

      dhv = dhv_matrah * 0.05

      istisna = 3000000 + 900000 + 600000

      sonuc = {"oiv_matrah": oiv_matrah, "oiv_hizmet": oiv_hizmet, "oiv_ilk_tesis": oiv_ilk, "oiv_toplam": oiv_toplam, "dhv_matrah":
      dhv_matrah, "dhv": dhv, "dhv_istisna_toplam": istisna}

