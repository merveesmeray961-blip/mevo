    | 5 | Malın alıcıya gönderilmesinde nakliyeciye tevdi: 29 Aralık 2026 (md. 10/e); fatura ve varış tarihleri sonradandır
    | Aralık 2026 |


    **(d) Toplam ve süreler**


    (Z)''nin Aralık 2026 hesaplanan KDV''si: 200.000 + 100.000 + 160.000 + 60.000 + 100.000 = **620.000 TL** ((Y)''nin 260.000
