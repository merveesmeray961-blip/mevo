klasik:
- id: TASLAK
  sinav: ymm
  ders: HSV
  konu: KDV
  kazanimlar:
  - diğer faaliyetlerden doğan teslim ve hizmetler
  - mükellef ve vergi sorumlusu
  - vergiyi doğuran olay
  - beyan ve ödeme süresi
  zorluk: 3
  puan: 25
  sure_dk: 30
  soru: 'Aşağıdaki işlemler Kasım 2026 ve Aralık 2026 aylarında yapılmıştır. Tüm işlemlerde vergilendirme dönemi birer aylıktır.
    Bu soruda genel KDV oranı **%20**, aşağıdaki işlem 3''e konu ürünün oranı **%10** kabul edilecek; işlemlerin hiçbirinin
    KDV''den istisna olmadığı varsayılacaktır. KDV tutarları işlem bedeline (KDV hariç) eklenerek hesaplanacaktır.


    | No | İşlem |

    |---|---|

    | 1 | (V) Kültür Vakfı''nın işlettiği kafeterya ve kitap satış mağazasının Kasım 2026''daki satışları: 2.000.000 TL |

    | 2 | (B) Belediyesi''nin işlettiği içme suyu dağıtımının Kasım 2026 dönemine ilişkin tüketim bedeli: 3.000.000 TL (bedeller
    30 Kasım 2026''da tahakkuk ettirilmiş, tahsilat Aralık 2026''da yapılmıştır) |

    | 3 | (L) Lisanslı Depoculuk A.Ş.''de saklanan ürün için 5300 sayılı Kanuna göre düzenlenen ürün senedi, 25 Kasım 2026''da
    4.000.000 TL bedelle (T) Ltd. Şti.''ne satılmış; (T) senedin temsil ettiği ürünü depodan 4 Aralık 2026''da çekmiştir |

    | 4 | Ticari faaliyeti bulunmayan Bay (K)''nın, gelir vergisi bakımından gayrimenkul sermaye iradı doğuran iş yerini kiraya
    vermesi: Kasım 2026 kirası 100.000 TL |


    **İstenenler**


    (a) 1, 2, 3 ve 4 numaralı işlemlerin KDV Kanunu md. 1/3 kapsamında hangi gerekçelerle KDV''ye tabi olduğunu açıklayınız.
    **(6 puan)**


    (b) Her işlem için KDV tutarını hesaplayınız. **(5 puan)**


    (c) Her işlemde KDV mükellefini veya vergi sorumlusunu belirtiniz. **(6 puan)**


    (d) Vergiyi doğuran olayı ve hangi dönemin beyannamesinde beyan edileceğini belirleyiniz; Kasım ve Aralık 2026 dönemleri
    için hesaplanan KDV toplamını ve beyanname verme ile ödeme gün sayılarını bulunuz (süre sonlarının hafta sonu veya resmî
    tatile rastlamadığı kabul edilecektir). **(8 puan)**

    '
  cozum: '**(a) KDV''ye tabi olma gerekçeleri (KDVK md. 1/3)**


    | No | Gerekçe |

    |---|---|

    | 1 | Vakıflara ait veya bunlar tarafından kurulan veya işletilen müesseselerin ticari, sınai, zirai ve mesleki nitelikteki
    teslim ve hizmetleri KDV''ye tabidir (md. 1/3-g). Kafeterya ve mağaza satışları ticari niteliktedir. |

    | 2 | Belediyelere ait veya bunlarca işletilen müesseselerin ticari nitelikteki teslim ve hizmetleri KDV''ye tabidir (md.
    1/3-g); su dağıtımı da mal teslimidir (md. 2/3). |

    | 3 | 5300 sayılı Kanuna göre düzenlenen ürün senetlerinin, senedin temsil ettiği ürünü depodan çekecek olanlara teslimi
    KDV''ye tabidir (md. 1/3-d). |

    | 4 | Gelir Vergisi Kanunu md. 70''te belirtilen mal ve hakların kiralanması işlemleri, ticari faaliyet olmasa da KDV''ye
    tabidir (md. 1/3-f). |


    **(b) KDV tutarları**


    | No | Matrah (TL) | Oran | KDV (TL) |

    |---|---|---|---|

    | 1 | 2.000.000 | %20 | 400.000 |

    | 2 | 3.000.000 | %20 | 600.000 |

    | 3 | 4.000.000 | %10 | 400.000 |

    | 4 | 100.000 | %20 | 20.000 |


    **(c) Mükellef / sorumlu**


    - 1 ve 2: Mal teslimini yapanlar mükelleftir (md. 8/1-a): vakfın işletmesi ve belediye.

    - 3: Ürün senedinin temsil ettiği ürünün teslimine ait KDV''nin ödenmesinden **lisanslı depo işleticisi sorumludur** (md.
    9/3).

    - 4: Gelir Vergisi Kanununun 70 inci maddesinde belirtilen mal ve hakları kiraya verenler, yani Bay (K), mükelleftir (md.
    8/1-h).


    **(d) Vergiyi doğuran olay ve dönem**


    | No | Vergiyi doğuran olay | Dönem |

    |---|---|---|

    | 1 | Malın teslimi (md. 10/a) | Kasım 2026 |

    | 2 | Su dağıtımında bedellerin tahakkuk ettirilmesi: 30 Kasım 2026 (md. 10/g); tahsilat tarihi önemsizdir | Kasım 2026
    |

    | 3 | Ürün senedinin temsil ettiği ürünün depodan çekilmesi: 4 Aralık 2026 (md. 10/k); senedin satış tarihi (25 Kasım)
    vergiyi doğurmaz | Aralık 2026 |

    | 4 | Hizmetin yapılması (md. 10/a) | Kasım 2026 |


    - Kasım 2026 hesaplanan KDV: 400.000 + 600.000 + 20.000 = **1.020.000 TL**; Aralık 2026: **400.000 TL**.

    - Mükellefler beyannameyi vergilendirme dönemini takip eden ayın 24''üncü günü akşamına kadar verir (md. 41/1), vergiyi
    beyanname verecekleri ayın 26''ncı günü akşamına kadar öder (md. 46/1). Kasım dönemi için 24 Aralık 2026 ve 26 Aralık
    2026; Aralık dönemi için 24 Ocak 2027 ve 26 Ocak 2027.

    '
  puanlama:
  - olcut: Dört işlemin md. 1/3-g, 2/3, 1/3-d ve 1/3-f gerekçeleri (her biri)
    puan: 6
  - olcut: Dört işlemin KDV tutarları (her biri)
    puan: 5
  - olcut: 'Vergi mükellefi/sorumlusu: md. 8/1-a, md. 9/3 ve md. 8/1-h'
    puan: 6
  - olcut: Vergiyi doğuran olay ve dönem tespiti (md. 10/a, 10/g, 10/k; her biri)
    puan: 4
  - olcut: Kasım 1.020.000 TL ve Aralık 400.000 TL toplamları
    puan: 2
  - olcut: 24. ve 26. gün kuralları ve tarihler
    puan: 2
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 1/3-g
    alinti: g) Genel ve katma bütçeli idarelere, il özel idarelerine, belediyeler ve köyler ile bunların teşkil ettikleri
      birliklere, üniversitelere, dernek ve vakıflara, her türlü mesleki kuruluşlara ait veya tabi olan veyahut bunlar tarafından
      kurulan veya işletilen müesseseler ile döner sermayeli kuruluşların veya bunlara ait veya tabi diğer müesseselerin ticari,
      sınai, zirai ve mesleki nitelikteki teslim ve hizmetleri,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 9/3
    alinti: çekecek olanlara teslimine ait katma değer vergisinin ödenmesinden lisanslı depo işleticileri sorumludur.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10/g
    alinti: g) Su, elektrik, gaz, ısıtma, soğutma ve benzeri enerji dağıtım veya kullanımlarında bunların bedellerinin tahakkuk
      ettirilmesi,
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 10/k
    alinti: temsil ettiği ürünlerin depodan çekilmesi.
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 41/1
    alinti: vergilendirme dönemini takibeden ayın yirmidördüncü günü akşamına kadar
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 46/1
    alinti: bir vergilendirme dönemine ait katma değer vergilerini beyanname verecekleri ayın yirmialtıncı günü akşamına kadar
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: true
    yil: 2026
