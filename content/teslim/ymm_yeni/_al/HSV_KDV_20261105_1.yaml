    | 2 | (Z), 500.000 TL değerindeki malı geri verilmesi mutat olan çelik varillerde teslim etmiştir. Varillerin depozito
    bedeli 60.000 TL''dir; boş variller geri alınacaktır. |

    | 3 | (Z), 10 Aralık 2026''da 800.000 TL bedelli bir makineyi alıcıya mülkiyeti muhafaza kaydıyla satarak zilyetliğini
    devretmiş; bedel, 2027 yılında üç eşit taksitte tahsil edilecek ve mülkiyet son taksit ödenince geçecektir. |

    | 4 | (Z), (H) Mühendislik Ltd. Şti.''nden emsal bedeli 300.000 TL olan bir danışmanlık hizmeti almış, hizmet bedeline
    karşılık (H)''ye emsal bedeli 300.000 TL olan bir mal vermiştir. Tarafların başkaca bir ödemesi yoktur. |

    | 5 | (Z), 500.000 TL bedelli bir malı alıcıya göndermek üzere 29 Aralık 2026''da nakliyeciye tevdi etmiştir. Fatura 4
    Ocak 2027''de düzenlenmiş, mal alıcıya 6 Ocak 2027''de ulaşmıştır. |


    **İstenenler**


    (a) 1, 2, 3 ve 4 numaralı işlemleri teslim, teslim sayılan hal veya hizmet bakımından Kanunun ilgili maddeleriyle değerlendiriniz.
    **(6 puan)**


    (b) (Z)''nin her bir işlem için hesaplayacağı KDV''yi ve 1 numaralı işlemde (Y)''nin hesaplayacağı KDV''yi bulunuz. **(7
    puan)**


    (c) Her işlemde vergiyi doğuran olayı ve beyan edileceği dönemi belirleyiniz. **(7 puan)**


    (d) (Z)''nin Aralık 2026 dönemi için bu işlemlerden hesapladığı toplam KDV''yi bulunuz; beyanname verme ve ödeme sürelerinin
    son günlerini belirtiniz (hafta sonu ve resmî tatiller dikkate alınmayacaktır). **(5 puan)**

    '
  cozum: '**(a) Teslim / hizmet değerlendirmesi**


    | No | Değerlendirme | Dayanak |

    |---|---|---|

    | 1 | Bir mal üzerindeki tasarruf hakkının iki veya daha fazla kimse tarafından zincirleme akit yapılarak, mal arada el
    değiştirmeden doğrudan sonuncu kişiye devredilmesinde aradaki safhaların her biri **ayrı bir teslimdir**. (Z→Y) ve (Y→W)
    olmak üzere iki teslim vardır. | md. 2/2 |

    | 2 | Kap ve ambalajların geri verilmesinin mutat olduğu hâllerde teslim, bunlar dışında kalan maddeler itibarıyla yapılmış
    sayılır; varil depozitosu matraha girmez. | md. 2/4 |

    | 3 | Mülkiyeti muhafaza kaydıyla yapılan satışlarda zilyetliğin devri **teslim sayılır**; bedelin sonradan taksitle tahsil
    edilmesi vergiyi doğuran olayı ertelemez. | md. 3/c |

    | 4 | Hizmetin karşılığının mal teslimi olması hâlinde bunların her biri ayrı işlem olup ayrı vergilendirilir: (Z) bakımından
    danışmanlık alımı (H)''nin hizmeti, malın verilmesi (Z)''nin teslimidir. | md. 4/2 |


    **(b) KDV**


    | İşlem | Matrah (TL) | KDV (TL) |

    |---|---|---|

    | 1 (Z→Y) | 1.000.000 | 200.000 |

    | 1 (Y→W) – (Y) hesaplar | 1.300.000 | 260.000 |

    | 2 | 500.000 (varil depozitosu hariç) | 100.000 |

    | 3 | 800.000 (tamamı için) | 160.000 |

    | 4 (Z''nin mal teslimi) | 300.000 | 60.000 |

    | 5 | 500.000 | 100.000 |


    **(c) Vergiyi doğuran olay (md. 10)**


    | İşlem | Olay | Dönem |

    |---|---|---|

