    fotokopisinin, **bir dilekçe ekinde ÖTV yönünden bağlı olunan vergi dairesine ibraz edilmesiyle** tevsik edilir. İstisna
    kapsamındaki teslim ayrıca beyannamenin "İhracat İstisnası" tablosuna işlenir.

