    ÖTV matrahı, hesaplanacak ÖTV hariç KDV matrahını oluşturan unsurlardan oluşur (md. 11/3). KDV matrahına satıcı tarafından
    yapılan nakliye ve vade farkı dahildir (KDVK md. 24); faturada gösterilen ticari teamüllere uygun iskonto matrahtan indirilir
    (KDVK md. 25/a).


    | Kalem | Tutar (TL) |

    |---|---|

    | Liste bedeli | 10.000.000 |

    | (−) Faturada gösterilen iskonto | (500.000) |

    | (+) Nakliye | 100.000 |

    | (+) Vade farkı | 150.000 |

    | **Yurt içi televizyon ÖTV matrahı** | **9.750.000** |

    | **Hesaplanan ÖTV (%10)** | **975.000** |


    İhracat teslimi istisnadır (hesaplanan ÖTV yok). Ses sistemi modülü: 300.000 × %10 = **30.000 TL**. Toplam hesaplanan
    ÖTV = 975.000 + 30.000 = **1.005.000 TL**.


    **(b) İndirim (md. 9)**


    Aynı listedeki malın imalinde kullanılan malın ödenmiş ÖTV''si, imal edilen malın ÖTV''sinden indirilir; indirim, ödenen
    ÖTV''yi ve imal edilen malın hesaplanan ÖTV''sini aşamaz.


    | Girdi | Ödenen ÖTV | İndirilebilir | Gerekçe |

    |---|---|---|---|

    | Hoparlör – yurt içi TV | 70.000 | **70.000** | Aynı liste; hesaplanan ÖTV (975.000) üst sınırı aşmıyor |

    | Hoparlör – ihraç TV | 20.000 | 0 | İmal edilen mal istisna kapsamında teslim edildiğinden indirim yok |

