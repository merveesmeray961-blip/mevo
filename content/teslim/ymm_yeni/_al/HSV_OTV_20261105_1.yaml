  kok: İhracatçı (İ) A.Ş., Özel Tüketim Vergisi Kanunu’na ekli (IV) sayılı listedeki bir malı yurt içinde bir toptancıdan
    satın alıp hiçbir işleme tabi tutmadan aynen ihraç etmiştir. Toptancının faturasında ÖTV ayrıca gösterilmiş ve beyan edilmiş
    olan tutar 60.000 TL’dir. Ancak zincirde ÖTV uygulanan safhadan sonraki satıcıdan yapılan alımda alış belgesinde görünmeyen
    ve mal fiyatına dahil edilmiş 40.000 TL ÖTV bulunmaktadır. Diğer iade şartları sağlandığına göre (İ) A.Ş.’ye iade edilecek
    ÖTV bakımından aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Yalnızca faturada gösterilen 60.000 TL iade edilir; fiyata dahil edilen 40.000 TL iade edilmez.
    B: Toplam 100.000 TL’nin tamamı iade edilir; ÖTV’nin belgede görünüp görünmemesi önemli değildir.
    C: Hiçbir ÖTV iade edilmez; çünkü mal imalatçıdan değil toptancıdan alınmıştır.
    D: Yalnızca 40.000 TL iade edilir; fiyata dahil edilmiş vergi iade edilir, belgede gösterilen iade edilmez.
    E: 60.000 TL’nin yarısı iade edilir; kalanı hesaplanan KDV’den mahsup edilir.
  dogru: A
  aciklama:
    dogru_neden: 'Madde 5/3’e göre alış faturaları ve benzeri belgeler üzerinde gösterilen ve beyan edilen ÖTV ihracatçıya
      iade edilir. Tebliğe göre ÖTV uygulanan safhadan sonraki satıcılardan alınan malların ihracında alış belgelerinde görünmeyen
      ve fiyata dahil edilmiş ÖTV iade edilmez. Bu nedenle yalnızca 60.000 TL iade edilir.


      Püf noktaları: İade, belgede görünen ve beyan edilen vergiyle sınırlıdır; “fiyata gömülü” vergi görünüyor diye hesaba
      katılmaz. Ayrıca iade için malın aynen ihraç edilmesi şartı aranır.'
    celdiriciler:
      B: Alış belgelerinde görünmeyen ve fiyata dahil edilmiş ÖTV iade edilmez.
      C: Belgede gösterilen ve beyan edilen ÖTV, aynen ihracat şartıyla ihracatçıya iade edilir.
      D: Kural tam tersidir.
      E: Kanun ve Tebliğde böyle bir yarı yarıya iade yoktur.
