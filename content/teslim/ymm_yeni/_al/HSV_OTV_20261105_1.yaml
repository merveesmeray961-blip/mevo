    KDV oranı **%20** kabul edilecek; gümrük idaresince beyannamenin tescil tarihinde uygulanan kur **1 avro = 50 TL** olacaktır.


    **İthalat 1 – Televizyon:** Mallar 14 Ekim 2026''da serbest dolaşıma girmiş ve gümrük beyannamesi aynı gün tescil edilmiştir.
