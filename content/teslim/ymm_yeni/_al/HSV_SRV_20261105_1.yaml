      yurtdisi = 1500000

      tasit = 1000000

      brut = mesken + yurtdisi + tasit

      borc = 400000 + 50000 + 90000

      net = brut - borc

      matrah = net - 2907136

      vergi = min(matrah, 3000000) * 0.01 + max(min(matrah - 3000000, 7000000), 0) * 0.03

      sonuc = {"brut": brut, "borc": borc, "net": net, "matrah": matrah, "vergi": round(vergi, 2), "taksit": round(vergi /
      6, 2)}

