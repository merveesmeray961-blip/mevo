  soru: '**Bay (K)**, 5216 sayılı Kanun''un uygulandığı bir büyükşehir belediyesinin sınırları içinde aşağıdaki taşınmazlara
    sahiptir. Tutarlar 2026 yılı vergi değerleridir. Bu soruda Cumhurbaşkanı kararıyla emlak vergisi oranlarında değişiklik
    yapılmadığı, arazi vergisi istisna tutarının 10.000 TL olduğu (artırım yapılmadığı) ve değerli konut vergisinin söz konusu
    olmadığı kabul edilecektir.


    | No | Taşınmaz | Bilgi | Vergi değeri (TL) |

    |---|---|---|---|

    | 1 | A dairesi | Mesken; inşaatı 2024 yılında sona ermiş, geçici muafiyet için bildirim süresinde yapılmıştır; kullanış
    tarzı değişmemiştir | 4.800.000 |

    | 2 | B işyeri | Mesken değildir; inşaatı 2025 yılında sona ermiştir; muafiyeti yoktur. Vergi değerinin 2.400.000 TL''si
    arsa payına aittir | 3.000.000 |

    | 3 | C arsası | Üzerinde bina yoktur | 2.000.000 |

    | 4 | D tarım arazisi | Bay (K)''ya aittir | 700.000 |

    | 5 | E tarım arazisi | Bay (K)''nın eşine aittir; aynı belediye ve mücavir alan sınırları içindedir | 300.000 |


    Bay (K) ayrıca **F** mesken dairesinin inşaatını 12 Ekim 2026''da tamamlayıp kullanmaya başlamıştır.


    **İstenenler**


    (a) 1 ve 2 numaralı taşınmazların 2026 yılı bina vergisini hesaplayınız; geçici muafiyet ve yeni inşa edilen binaya ilişkin
    özel hükmü açıklayınız. **(10 puan)**


    (b) 3, 4 ve 5 numaralı taşınmazların 2026 yılı arazi (arsa) vergisini hesaplayınız; istisnanın nasıl uygulanacağını açıklayınız.
    **(6 puan)**


    (c) Toplam emlak vergisini ve ödeme dönemlerini belirtiniz. **(3 puan)**


    (d) F dairesi için bildirim süresinin son gününü, vergi mükellefiyetinin başlangıcını ve geçici muafiyetin süre ve oranını
    belirtiniz. Bildirim 20 Nisan 2027''de yapılırsa sonuç ne olur? **(6 puan)**

    '
  cozum: '**(a) Bina vergisi**


    Bina vergisi oranı meskenlerde binde 1, diğer binalarda binde 2''dir; büyükşehir belediye sınırlarında %100 artırımlı
    uygulandığından oranlar meskende **binde 2**, diğer binalarda **binde 4**''tür (md. 8).


    *A dairesi:* Mesken olarak kullanılan dairenin vergi değerinin 1/4''ü (2.500 TL''den az olmamak üzere), inşanın sona erdiği
    yılı takip eden bütçe yılından (2025) itibaren 5 yıl geçici muafiyetten yararlanır (md. 5/a); 2026 bu sürededir.


    | Unsur | Tutar (TL) |

    |---|---|

    | Vergi değeri | 4.800.000 |

    | Muaf kısım (1/4) | (1.200.000) |

    | Vergiye tabi değer | 3.600.000 |

    | Vergi (× binde 2) | **7.200** |


    *B işyeri:* Yeni inşa edilen binanın vergisi arsa payının vergisinden az olamaz; bu hüküm inşanın sona erdiği yılı takip
    eden bütçe yılından itibaren dört yıl (2026–2029) uygulanır (md. 8).


    | Unsur | Hesap | Tutar (TL) |

    |---|---|---|

    | Bina vergisi | 3.000.000 × binde 4 | 12.000 |

    | Arsa payının vergisi | 2.400.000 × binde 6 | 14.400 |

    | **Ödenecek (yüksek olan)** | | **14.400** |


    Arsada oran binde 3''tür; büyükşehirde %100 artırımla binde 6 olur (md. 18).


    **(b) Arsa ve arazi vergisi**


    - C arsası: 2.000.000 × binde 6 = **12.000 TL**. Arazi vergisi istisnası arsalara uygulanmaz.

    - D ve E tarım arazileri: arazi vergisi oranı binde 1, büyükşehirde binde 2''dir. İstisna (10.000 TL), mükellef ile eşin
    ve velayet altındaki çocukların arazi değerlerinin toplu olarak dikkate alınmasıyla uygulanır (md. 16). Toplam değer 700.000
    + 300.000 = 1.000.000 TL; 1.000.000 − 10.000 = 990.000 × binde 2 = **1.980 TL**.


    **(c) Toplam ve ödeme**


    7.200 + 14.400 + 12.000 + 1.980 = **35.580 TL**. Vergi Mart, Nisan ve Mayıs aylarında birinci taksit, Kasım ayında ikinci
    taksit olmak üzere iki eşit taksitte (17.790 TL + 17.790 TL) ödenir (md. 30).


    **(d) F dairesi**


    - Yeni bina inşası vergi değerini tadil eden bir sebeptir (md. 33/1) ve bildirim zorunludur. Olay bütçe yılının son üç
    ayında (Ekim) olduğundan bildirim, olayın tarihinden itibaren üç ay içinde verilir: son gün **12 Ocak 2027** (md. 23;
    md. 5 son fıkra).

    - Mükellefiyet, tadil sebebinin doğduğu bütçe yılını takip eden bütçe yılından, yani **1 Ocak 2027**''den başlar (md.
    9).

    - Geçici muafiyet: vergi değerinin **1/4''ü**, inşanın sona erdiği yılı (2026) takip eden bütçe yılından itibaren **5
    yıl** (2027–2031).

    - Bildirim 20 Nisan 2027''de (süre geçtikten sonra) yapılırsa muafiyet, bildirimin yapıldığı yılı takip eden bütçe yılından
    (**2028**) itibaren muteberdir; bildirim yılının sonuna kadar geçen yıllara (2027) ait muafiyet hakkı düşer (md. 5).

    '
