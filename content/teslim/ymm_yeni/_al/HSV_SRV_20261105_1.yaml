    | 2 | (II) | 12.000 | Evet |

    | 3 | (II) | 8.000 | Evet |

    | 4 | (I) | 14.000 | Hayır |

    | 5 | (I) | 9.000 | Hayır |


    Gider yazılabilen: 12.000 + 8.000 = **20.000 TL**. Kanunen kabul edilmeyen gider (KKEG): 6.000 + 14.000 + 9.000 = **29.000
    TL**; kurumlar vergisi matrahına ilave edilir. Vergi etkisi: 29.000 × %25 = **7.250 TL**.


    **(d) Noter ve sorumluluk**


    Noterler, motorlu taşıtların satış veya devir işlemlerini yapmadan önce o güne kadar ödenmemiş MTV''ler ile gecikme zamları,
