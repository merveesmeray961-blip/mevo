  soru: '(B) Gıda Ltd. Şti. 4760 sayılı ÖTV Kanunu''na ekli listelerdeki mallarla ilgilenen bir mükelleftir. Soruda hafta
    sonu ve resmî tatiller dikkate alınmayacaktır.


    - **7 Eylül 2026''da** yapılan fiilî envanterde iki mal grubunun belgesiz bulundurulduğu tespit edilmiştir.

    - Birinci grup mallar için alış belgesi ibraz edilememiştir. Bu grup için tespit tarihindeki emsal bedeli üzerinden hesaplanan
    ÖTV **480.000 TL**, asgari maktu vergi tutarına göre hesaplanacak ÖTV **520.000 TL**''dir.

    - İkinci grup mallara ait alış belgeleri 15 Eylül 2026''da ibraz edilmiştir.

    - Birinci grup malları (B)''ye satan (S) Ltd. Şti. hakkında düzenlenen vergi inceleme raporuna dayanılarak, bu satışlarla
    ilgili ÖTV tarhiyatı yapılmıştır.

    - (B), Ekim 2026''da sattığı bazı malları 2026 Kasım''ında iade almış; iade edilen mallar fiilen işletmeye girmiştir.
    Bu mallara ait Ekim 2026''da beyan edilip ödenen ÖTV **200.000 TL**''dir ve iade işlemi defter kayıtları ile belgelerde
    gösterilmiştir. Mallar (II) sayılı listede yer alan kayıt ve tescile tabi mallardan değildir.

    - (B), Aralık 2026''da ÖTV''ye tabi olmayan bir mal teslimi nedeniyle düzenlediği faturada **50.000 TL** ÖTV göstermiştir.


    **İstenenler**


    (a) Belge ibrazı için tanınan süreyi, son günü ve (B) adına re''sen tarh edilecek ÖTV tutarını gerekçesiyle belirleyiniz;
    tarhiyata uygulanacak ceza konusunda ne söylenebilir? **(8 puan)**


    (b) (S) hakkında yapılan tarhiyatın (B) bakımından sonucunu açıklayınız. **(3 puan)**


    (c) 200.000 TL''lik ÖTV için (B)''nin hangi dönemde ve hangi şartlarla ne yapabileceğini açıklayınız. **(6 puan)**


    (d) 50.000 TL''lik ÖTV''nin akıbetini belirleyiniz. **(5 puan)**

    '
  cozum: '**(a) Belgesiz mal bulunduran mükellef**


    Fiilî veya kaydî envanter sırasında belgesiz mal bulundurulduğunun tespiti halinde alış belgelerinin ibrazı için tespit
    tarihinden itibaren **10 günlük** süre verilir. Tespit tarihi 7 Eylül 2026 olduğundan son gün **17 Eylül 2026**''dır (md.
    4/3). Süre içinde ibraz edilemeyen birinci grup mallar için emsal bedeli üzerinden hesaplanan ÖTV (480.000 TL) (B) adına
    re''sen tarh edilir; tarh edilecek vergi asgari maktu vergi tutarına göre hesaplanacak vergiden az olamayacağından **520.000
    TL** tarh edilir. Bu tarhiyata **vergi ziyaı cezası uygulanır**. İkinci grup mallar için belgeler 17 Eylül''den önce (15
    Eylül''de) ibraz edildiğinden tarhiyat yapılmaz.


    **(b) Satıcıya yapılan tarhiyat**


    Belgesiz mal bulunduran mükelleflere bu malları satanlara, bu satışlarla ilgili vergi inceleme raporuna dayanılarak ÖTV
    tarhiyatı yapıldığı takdirde alıcıdan ÖTV ve buna ilişkin ceza ayrıca aranmaz (md. 4/3, son paragraf). Dolayısıyla (S)
    hakkında tarhiyat yapılması hâlinde (B)''den 520.000 TL ile cezası aranmaz.


    **(c) İade nedeniyle düzeltme**


    Malların iadesi hallerinde mükellefler, ilgili vergiler için değişikliğin mahiyetine uygun şekilde ve **meydana geldiği
    dönem içinde** düzeltme yapabilir, bu vergiden mahsup edebilir veya iade talebinde bulunabilir (md. 15/1). İade Kasım
    2026''da gerçekleştiğinden (B) 200.000 TL''yi **Kasım 2026 dönemi** içinde düzeltebilir, mahsup edebilir veya iade isteyebilir.
    Şartlar: iade edilen malların fiilen işletmeye girmiş olması ve bu işlemlerin defter kayıtları, belgeler ile beyannamede
    gösterilmesidir; (II) sayılı listedeki kayıt ve tescile tabi mallarda dönem şartı aranmaz, fakat burada mallar bu gruba
    girmediğinden dönem şartı vardır.


    **(d) Yersiz gösterilen vergi**


    Vergiye tabi bir işlem söz konusu olmadığı veya vergiyi fatura veya benzeri belgelerde göstermeye hakkı bulunmadığı hâlde
    belgede bu vergiyi gösterenler söz konusu vergiyi beyan ve ödemekle mükelleftir (md. 15/1). Dolayısıyla (B) 50.000 TL
    ÖTV''yi **beyan edip ödemek zorundadır**.

    '
