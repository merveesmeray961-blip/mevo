  soru: 'Soruda hafta sonu ve resmî tatiller dikkate alınmayacak; yıllık vergiler iki eşit taksit esasına göre bölünecektir.
    Aşağıdaki taşıtlar 197 sayılı Motorlu Taşıtlar Vergisi Kanunu''na ekli (I) sayılı tarifeye girmektedir ve tarife uyarınca
    MTV tutarları verilmiştir.


    | No | Olay |

    |---|---|

    | 1 | Taşıt 1 yıllık MTV''si 48.000 TL olan otomobil, 10 Mart 2026''da yurt içinde ilk defa kayıt ve tescil ettirilmiştir.
    |

    | 2 | Taşıt 2 yıllık MTV''si 60.000 TL olan otomobil, 14 Eylül 2026''da yurt içinde ilk defa kayıt ve tescil ettirilmiştir.
    |

    | 3 | (D) A.Ş., kayıt ve tescilli taşıtını 20 Ağustos 2026''da (E) Ltd. Şti.''ne satmış, devir ve temlik nedeniyle yeni
    kayıt ve tescil bu tarihte yapılmıştır. |

    | 4 | (D) A.Ş., kayıtlı başka bir taşıtını 12 Mart 2026''da (F) A.Ş.''ye satmış ve tescil bu tarihte yapılmıştır. |

    | 5 | Bay (G), 3 numaralı taşıtla ilgili devir işlemini noterde yaptırmak istemiş, noter ödenmemiş MTV''yi araştırmadan
    işlemi yapmıştır. Taşıtın ödenmemiş MTV''si 36.000 TL, gecikme zammı 4.000 TL''dir. |


    **İstenenler**


    (a) 1 ve 2 numaralı taşıtlar için tahakkuk eden vergi tutarını, taksit durumunu ve ödeme tarihlerini belirleyiniz. **(7
    puan)**


    (b) 3 ve 4 numaralı taşıtların yeni malikleri bakımından mükellefiyetin başlangıç tarihlerini bulunuz. **(5 puan)**


    (c) 5 numaralı olayda notere ve mükellefe yönelik sorumluluğu, rücu hakkını ve sorumlu olunan tutarı belirleyiniz. **(5
    puan)**


    (d) (D) A.Ş. şirket kayıtlarında bu tarifeye giren taşıtlar için ödenen MTV''yi kurumlar vergisi matrahının tespitinde
    gider yazabilir mi? **(3 puan)**


    (e) 3 numaralı taşıtın devrinin Temmuz ayı içinde yapılmış olması durumunda ödeme açısından ne değişirdi? **(2 puan)**

    '
  cozum: '**(a) İlk tescil**


    | Taşıt | Tahakkuk | Ödeme |

    |---|---|---|

    | 1 (10 Mart 2026) | Yıllık olarak 48.000 TL tahakkuk eder (md. 9). İlk taksit (Ocak, 24.000 TL) süresi geçmiştir. | Süresi
    geçen 24.000 TL kayıt ve tescil tarihinden itibaren bir ay içinde, yani **10 Nisan 2026**''ya kadar; ikinci taksit 24.000
    TL **Temmuz 2026**''da ödenir. |

    | 2 (14 Eylül 2026) | İlk altı aylık dönem geçtikten sonra yapılan tescilde sadece ikinci altı aylık dönemin vergisi,
    yani 60.000/2 = **30.000 TL** tahakkuk eder ve ödenir. | Süresi geçen kısım olduğundan tescil tarihinden itibaren bir
    ay içinde, **14 Ekim 2026**''ya kadar. |


    **(b) Mükellefiyetin başlangıcı (md. 7/b)**


    - Taşıt 3: Devir takvim yılının ilk altı ayında değil, **son altı ayında** (Ağustos) yapıldığından yeni malik (E) için
    mükellefiyet takip eden takvim yılı başından, yani **1 Ocak 2027**''den itibaren nazara alınır.

    - Taşıt 4: Devir **ilk altı ay içinde** (Mart) yapıldığından yeni malik (F) için mükellefiyet takip eden son altı aylık
    dönemin başından, yani **1 Temmuz 2026**''dan itibaren nazara alınır.


    **(c) Noter sorumluluğu (md. 13/c, 13/e)**


    Noterler, taşıtların satış veya devir işlemlerini yapmadan önce taşıta ait o güne kadar ödenmemiş MTV ile gecikme zamları,
    gecikme faizleri ve vergi cezalarının ödendiğini gösterir belgeyi istemek zorundadır. Bu zorunluluğa uymadan işlem yapan
    noter, ödenmeyen vergiler ile gecikme zamları, gecikme faizleri ve vergi cezalarından mükelleflerle birlikte **müteselsilen
    sorumludur**; sorumlu sıfatıyla ödemek zorunda kaldığı vergiler için mükellefe rücu hakkına sahiptir. Sorumlu olunan tutar
    36.000 + 4.000 = **40.000 TL**''dir.


    **(d) Gider kaydı (md. 14)**


    (I), (I/A) ve (IV) sayılı tarifelerdeki taşıtlardan alınan vergi ve cezalar ile gecikme zamları gelir ve kurumlar vergisi
    matrahlarının tespitinde **gider olarak kabul edilmez**. Ticari maksatla kullanılan uçak ve helikopterler ile taşıt kiralama
    faaliyetiyle uğraşan işletmelerin bu amaçla kiraya verdikleri taşıtlar istisnadır. (D) A.Ş.''nin böyle bir faaliyeti belirtilmediğinden
    gider yazamaz.


    **(e) Temmuz ayında devir**


    Devir ve temlik sebebiyle Ocak ve Temmuz ayları içinde yapılacak kayıt ve tescil veya satış nedeniyle malik değişikliğinde
    vergi, **bu değişikliğin yapılmasından önce ödenir** (md. 9).

    '
