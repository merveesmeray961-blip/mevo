    | 5 | (I) sayılı liste mallarının teslimi ayrıca (R) ve (S) A.Ş.''nin kurduğu adi ortaklık tarafından da yapılmış; vergi
    tarhiyatına ortaklardan (R) muhatap tutulmuştur |


    **İstenenler**


    (a) 1 numaralı işlem için vergilendirme dönemlerini, beyanname verme ve ödeme tarihlerini ve toplam vergiyi bulunuz. **(6
