sorular:
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: satın alıma ilişkin maliyetlerin muhasebeleştirilmesi
  tip: hesaplama
  zorluk: 1
  kok: 'Alfa AŞ, ilişkili olmadığı Beta AŞ''nin kontrolünü 2026 yılında satın alarak TFRS 3 kapsamında bir işletme birleşmesi
    gerçekleştirmiştir. Alfa AŞ bu işlem nedeniyle şu maliyetlere katlanmıştır: avukatlık ve hukuki inceleme ücretleri 120.000
    TL, bağımsız değerleme ücreti 40.000 TL, işletme içi satın alma biriminin idamesi için gerekli genel yönetim maliyetleri
    30.000 TL ve birleşmeyi finanse etmek için çıkardığı borçlanma aracının ihraç ve tescil maliyeti 50.000 TL. Buna göre
    Alfa AŞ''nin TFRS 3 uyarınca bu birleşme nedeniyle 2026 yılında gider olarak finansal tablolara alacağı tutar kaç TL''dir?'
  secenekler:
    A: 0 TL
    B: 120.000 TL
    C: 160.000 TL
    D: 190.000 TL
    E: 240.000 TL
  dogru: D
  aciklama:
    dogru_neden: Satın alıma ilişkin maliyetler (aracılık, danışmanlık, yasal, değerleme ve diğer mesleki ücretler ile işletme
      içi satın alma biriminin idamesi için gerekli genel yönetim giderleri) kural olarak maliyetlerin gerçekleştiği ve hizmetlerin
      alındığı dönemlerde gider yazılır; tek istisna borçlanma araçları ile hisse senetlerinin tescil ve ihraç maliyetleridir,
      bunlar TMS 32 ve TFRS 9 uyarınca finansal tablolara alınır (par. 53). Gider = 120.000 + 40.000 + 30.000 = 190.000 TL.
    celdiriciler:
      A: Maliyetlerin şerefiyeye eklendiği eski yaklaşımdır; TFRS 3 bu maliyetlerin gider yazılmasını gerektirir.
      B: Yalnızca hukuki ücretler alınmıştır; değerleme ücreti ve genel yönetim maliyetleri de gider yazılır.
      C: İşletme içi satın alma biriminin genel yönetim maliyetleri unutulmuştur; par. 53 bunları kapsama dahil eder.
      E: Borçlanma aracı ihraç maliyeti de gider yazılmıştır; bu maliyet par. 53'teki istisna gereği TMS 32 ve TFRS 9 kapsamındadır.
    hesap_adimlari:
    - 'Gider yazılanlar: 120.000 + 40.000 + 30.000 = 190.000'
    - Borçlanma aracı ihraç maliyeti (50.000) TMS 32/TFRS 9 kapsamındadır
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 53
    alinti: Edinen işletme, satın alıma ilişkin maliyetleri, sadece bir istisna dışında, maliyetlerin gerçekleştiği ve hizmetlerin
      alındığı dönemlerde gider olarak muhasebeleştirir. Borçlanma araçlarının ya da hisse senetlerinin ihraç edilmesine ilişkin
      maliyetler, TMS 32 ve TFRS 9 uyarınca finansal tablolara alınır.
  gecerlilik:
    baslangic: '2010-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 120000 + 40000 + 30000
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: koşullu bedel ve ölçme dönemi düzeltmeleri
  tip: uygulama
  zorluk: 2
  kok: Zeta AŞ, 1.10.2026'da Eta AŞ'nin paylarının %100'ünü satın alarak kontrolünü ele geçirmiştir. Transfer edilen bedel
    5.000.000 TL nakit ile Eta'nın 2027 performansına bağlı, nakitle ödenecek bir koşullu bedeli kapsamaktadır; koşullu bedel
    finansal borç niteliğinde olup birleşme tarihindeki gerçeğe uygun değeri 400.000 TL'dir. Eta'nın tanımlanabilir net varlıkları
    geçici olarak 4.600.000 TL ölçülmüştür. 1.12.2026'da elde edilen bir değerleme raporu, Eta'nın arsasının birleşme tarihindeki
    gerçeğe uygun değerinin 300.000 TL daha yüksek olduğunu göstermiştir. Ayrıca 31.12.2026'da, Eta'nın birleşmeden sonraki
    dördüncü çeyrek performansının beklenenden iyi gerçekleşmesi nedeniyle koşullu borcun gerçeğe uygun değeri 700.000 TL'ye
    yükselmiştir. Vergi etkileri dikkate alınmayacağına göre Zeta AŞ'nin 31.12.2026 finansal tablolarındaki şerefiye tutarı
    ve koşullu bedel nedeniyle dönem kâr veya zararına yansıyan etki aşağıdakilerden hangisidir?
  secenekler:
    A: Şerefiye 200.000 TL; 300.000 TL zarar
    B: Şerefiye 500.000 TL; 300.000 TL zarar
    C: Şerefiye 800.000 TL; 300.000 TL zarar
    D: Şerefiye 800.000 TL; kâr veya zarara etki yok
    E: Şerefiye 1.100.000 TL; kâr veya zarara etki yok
  dogru: B
  aciklama:
    dogru_neden: 'Ölçme dönemi (birleşme tarihinden itibaren en çok bir yıl) içinde birleşme tarihinde var olan durumlara
      ilişkin yeni bilgi, geçici tutarların geriye dönük düzeltilmesine ve şerefiyenin buna göre değişmesine yol açar (par.
      45, 48): net varlıklar 4.900.000, şerefiye = 5.400.000 - 4.900.000 = 500.000 TL. Birleşmeden sonraki olaylardan (performansın
      beklenenden iyi olması) kaynaklanan koşullu bedel değişimi ölçme dönemi düzeltmesi değildir; finansal borç olan koşullu
      bedel gerçeğe uygun değeriyle ölçülür ve 700.000 - 400.000 = 300.000 TL değişim kâr veya zararda gider olur (par. 58).
      Şerefiye bu değişimden etkilenmez.'
    celdiriciler:
      A: Arsa düzeltmesi iki kez uygulanmış (şerefiye 200.000'e düşürülmüştür).
      C: Ölçme dönemi düzeltmesi (arsa) yapılmamıştır; şerefiye ilk geçici tutarda kalmıştır.
      D: Koşullu bedel artışı yanlışlıkla şerefiyeye eklenmiş (500.000 + 300.000) ve kâr veya zarara yansıtılmamıştır.
      E: Koşullu bedel artışı şerefiyeye eklenmiş ve arsa düzeltmesi yapılmamıştır.
    hesap_adimlari:
    - 'Düzeltilmiş net varlıklar: 4.600.000 + 300.000 = 4.900.000'
    - 'Şerefiye: 5.000.000 + 400.000 - 4.900.000 = 500.000'
    - 'Koşullu bedel değişimi: 700.000 - 400.000 = 300.000 zarar'
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 48
    alinti: Edinen işletme, tanımlanabilir bir varlığın (borcun) muhasebeleştirilmiş geçici tutarında bir artışı (azalışı)
      şerefiyede bir artış (azalış) yolu ile muhasebeleştirir.
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 58
    alinti: Ancak, bir kazanç hedefinin tutturulması, belirli bir hisse fiyatına ulaşılması veya bir araştırma ve geliştirme
      projesinde bir dönüm noktasına gelinmesi gibi birleşme tarihinden sonraki olaylardan kaynaklanan değişiklikler, ölçme
      dönemi düzeltmeleri değildir.
  gecerlilik:
    baslangic: '2010-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'net = 4600000 + 300000

      serefiye = 5000000 + 400000 - net

      sonuc = serefiye'
    secenek_sayisi_bekleniyor: false
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Birleşme devir ve bölünme muhasebesi
  konu: BDB
  kazanim: pazarlıklı satın alım
  tip: hesaplama
  zorluk: 3
  kok: 'Yıldız AŞ, 1.7.2026''da Ay AŞ''nin paylarının %80''ini satın alarak kontrolü ele geçirmiştir (TFRS 3 kapsamında işletme
    birleşmesi). Transfer edilen bedel şunlardan oluşmaktadır: 2.000.000 TL nakit; Yıldız AŞ''nin eski ortaklara devrettiği
    ve birleşme sonrasında grupta kalmayan bir bina (defter değeri 900.000 TL, gerçeğe uygun değeri 1.200.000 TL); gerçeğe
    uygun değeri 100.000 TL olan koşullu bedel yükümlülüğü. Kontrol gücü olmayan pay, edinilen işletmenin net tanımlanabilir
    varlıklarının muhasebeleştirilen tutarındaki orantılı payı üzerinden ölçülmektedir. Ay AŞ''nin tanımlanabilir net varlıklarının
    birleşme tarihindeki gerçeğe uygun değeri 4.500.000 TL''dir ve varlık-borç tespitleri ile ölçümler gözden geçirilmiştir.
    Yıldız AŞ ayrıca 80.000 TL danışmanlık ücretine katlanmıştır. Yıldız AŞ''nin birleşme tarihinde kâr veya zararda muhasebeleştireceği
    pazarlıklı satın alım kazancı kaç TL''dir?'
  secenekler:
    A: 0 TL
    B: 220.000 TL
    C: 300.000 TL
    D: 600.000 TL
    E: 1.200.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'Şerefiye hesabında transfer edilen bedel (nakit 2.000.000 + bina gerçeğe uygun değeriyle 1.200.000 + koşullu
      bedel 100.000 = 3.300.000; grupta kalmayan varlık gerçeğe uygun değerle ölçülür, par. 37-38) ile kontrol gücü olmayan
      pay (4.500.000 x %20 = 900.000; par. 19(b)) toplamı 4.200.000 TL''dir. Net varlıklar (4.500.000) bu toplamı aştığından,
      gözden geçirme sonrası kalan 300.000 TL fark pazarlıklı satın alım kazancı olarak birleşme tarihinde kâr veya zararda
      muhasebeleştirilir (par. 32, 34, 36). Danışmanlık ücreti gider yazılır, kazancı etkilemez (par. 53). Püf noktaları:
      (1) Kontrol gücü olmayan payı net varlıkların orantılı payı üzerinden ölçtüğünüzü unutmayın. (2) Devredilen bina defter
      değeriyle değil gerçeğe uygun değerle alınır. (3) Satın alım maliyeti kazancı azaltmaz.'
    celdiriciler:
      A: Negatif şerefiyenin ertelendiği ya da muhasebeleştirilmediği varsayılmıştır; par. 34 kazancın birleşme tarihinde
        kâr veya zararda yansıtılmasını gerektirir.
      B: Danışmanlık ücreti (80.000) kazançtan düşülmüştür; bu ücret ayrıca gider yazılır.
      D: Bina defter değeriyle (900.000) hesaba katılmıştır; transfer edilen bedel eksik, kazanç fazla bulunmuştur.
      E: Kontrol gücü olmayan pay ve diğer unsurlar hesaba katılmadan yalnızca bedel ile net varlık karşılaştırılmıştır (4.500.000
        - 3.300.000).
    hesap_adimlari:
    - 'Transfer edilen bedel: 2.000.000 + 1.200.000 + 100.000 = 3.300.000'
    - 'Kontrol gücü olmayan pay: 4.500.000 x %20 = 900.000'
    - 'Kazanç: 4.500.000 - (3.300.000 + 900.000) = 300.000'
  kaynaklar:
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 34
    alinti: Bazen, edinen işletme, pazarlıklı bir satın alım yapar, bu durum, 32(b) paragrafındaki tutarın 32(a) paragrafında
      belirtilen tutarların toplamını geçtiği bir işletme birleşmesidir. Eğer söz konusu fazla tutar, 36’ncı paragraf hükümleri
      uygulandıktan sonra da kalıyorsa edinen işletme sonuç olarak ortaya çıkan kazancı birleşme tarihinde kar veya zararda
      muhasebeleştirir.
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 19(b)
    alinti: Mevcut ortaklık araçlarının, edinilen işletmenin net tanımlanabilir varlıklarının muhasebeleştirilen tutarlarındaki
      orantılı payı üzerinden ölçer.
  - mevzuat: TFRS 3 İşletme Birleşmeleri
    madde: par. 38
    alinti: Böyle bir durum söz konusuysa, edinen işletme, transfer edilen varlık veya borçların birleşme tarihi itibariyle
      gerçeğe uygun değerlerini yeniden ölçer ve sonuç olarak ortaya çıkan kazanç veya zararları, kar veya zararda muhasebeleştirir.
  gecerlilik:
    baslangic: '2010-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'tb = 2000000 + 1200000 + 100000

      kgop = 4500000 * 0.20

      sonuc = max(0, 4500000 - (tb + kgop))'
