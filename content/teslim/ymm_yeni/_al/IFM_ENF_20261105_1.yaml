  soru: '**Veriler**


    Yamaç Elektronik AŞ; tam mükellef, sermaye şirketi, hesap dönemi takvim yılı olan, kazancını bilanço esasına göre tespit
    eden bir kurumlar vergisi mükellefidir (münhasıran altın veya gümüş işlemleriyle uğraşmamaktadır; kayıtlarını Türk para
    birimi dışında bir para birimiyle tutmamaktadır). Kurumlar vergisi oranı %25 alınacaktır.


    Yİ-ÜFE endeksi (soru için varsayılan değerler): Aralık 2023: 2.000; Aralık 2025: 3.600; Aralık 2026: 4.300.


    Şirketin 31.12.2024 tarihli bilançosu mükerrer 298 kapsamında enflasyon düzeltmesine tabi tutulmuştur. Bu düzeltme sonucu
    bilançonun pasifinde 6.000.000 TL tutarında "Sermaye Düzeltmesi Olumlu Farkları" ve geçmiş yıl zararlarında 2.500.000
    TL bakiye bulunmaktadır. Şirket 2026 yılında bu fark hesabı ile şu işlemleri yapmıştır: (1) 2.500.000 TL''yi geçmiş yıl
    zararlarına mahsup etmiş, (2) 1.500.000 TL''yi sermayeye eklemiş, (3) 800.000 TL''yi "olağanüstü yedekler" hesabına nakletmiştir.


    Şirketin 31.12.2026 tarihli bilançosunda amortismana tabi iktisadi kıymetleri şunlardır (yasal kayıtlardaki maliyet bedelleri,
    TL):


    | Kıymet | Maliyet | Not |

    |---|---|---|

    | Makine M1 | 1.200.000 | 2022''de aktife girmiş |

    | Makine M2 | 800.000 | 3.3.2026''da aktife girmiş |

    | Arsa | 2.000.000 | 2021''de alınmış |

    | Taşıt | 900.000 | 2023''te aktife girmiş; maliyetine 2024''te eklenen 100.000 TL kur farkı dahildir |

    | Bina | 3.000.000 | 2019''da aktife girmiş |


    **İstenenler**


    (a) 31.12.2026 için mükerrer 298/A-1''deki iki şartın (son üç hesap dönemi ve içinde bulunulan hesap dönemi) gerçekleşip
    gerçekleşmediğini hesaplayarak belirleyiniz. (8 puan)


    (b) Geçici 37. madde karşısında şirketin 2026 yılında (geçici vergi dönemleri dahil) enflasyon düzeltmesi yapıp yapmayacağını,
    bu uygulamanın süresine ilişkin yetkiyi ve mükerrer 298/Ç bakımından sonucunu açıklayınız. (5 puan)


    (c) Pasif enflasyon fark hesabına ilişkin 2026 işlemlerinin vergisel sonucunu belirtiniz; vergiye tabi tutulacak tutarı
    ve kurumlar vergisini hesaplayınız ve fark hesabında kalan bakiyeyi bulunuz. (7 puan)


    (d) Mükerrer 298/Ç kapsamında yeniden değerlemeye konu edilebilecek kıymetleri, her kıymetin kapsama girip girmediğini
    gerekçelendirerek belirleyiniz ve kapsama girecek kıymetlerin yasal kayıtlardaki maliyet bedelleri toplamını bulunuz (yeniden
    değerleme oranı ve tutarı hesabı istenmemektedir). (5 puan)

    '
  cozum: '**(a) A-1 şartları (VUK mük. 298/A-1; Tebliğ 555 md. 32)**


    Fiyat endeksindeki artış, içinde bulunulan dönem dahil son üç hesap döneminde %100''den ve içinde bulunulan hesap döneminde
    %10''dan fazla ise bilanço esasına göre defter tutan mükellefler mali tablolarını enflasyon düzeltmesine tabi tutar; iki
    şart birlikte aranır.


    - Son üç hesap dönemi (2024, 2025, 2026): 4.300 / 2.000 − 1 = **%115** > %100 → şart gerçekleşmiştir.

    - İçinde bulunulan hesap dönemi (2026): 4.300 / 3.600 − 1 = **%19,44** > %10 → şart gerçekleşmiştir.


    Her iki şart birlikte gerçekleştiğinden, başka bir hüküm olmasaydı 31.12.2026 bilançosu enflasyon düzeltmesine tabi tutulacaktı.


    **(b) Geçici 37. madde**


    Geçici 37 uyarınca 2025 hesap dönemi ile geçici vergi dönemleri de dahil olmak üzere 2026 ve 2027 hesap dönemlerinde,
    mükerrer 298 kapsamındaki şartların oluşup oluşmadığına bakılmaksızın mali tablolar enflasyon düzeltmesine tabi tutulmaz.
    Dolayısıyla şirket, (a)''daki şartlar gerçekleşse de 2026''da **geçici vergi dönemleri dahil enflasyon düzeltmesi yapmaz**.
    Cumhurbaşkanı bu dönemleri geçici vergi dönemleri de dahil olmak üzere **üç hesap dönemine kadar** uzatmaya yetkilidir.
    Şirket mükerrer 298/A-9 kapsamında olmadığından hüküm ona uygulanır (A-9 kapsamındaki mükellefler için geçici 37''nin
    1. ve 2. fıkraları geçerli değildir). Enflasyon düzeltmesi yapılmayacağı belirtilen dönemler, (Ç) fıkrası bakımından **düzeltme
    şartlarının gerçekleşmediği dönem** sayıldığından şirket, amortismana tabi iktisadi kıymetlerini (Ç) fıkrası çerçevesinde
    yeniden değerleyebilir.


    **(c) Pasif fark hesabı (A-5)**


    Pasif kalemlere ait enflasyon fark hesapları başka bir hesaba nakledildiğinde veya işletmeden çekildiğinde, işlemin yapıldığı
    dönemde (dönem kazancıyla ilişkilendirilmeksizin) vergiye tabidir. Öz sermaye kalemlerine ait farklar ise geçmiş yıl zararlarına
    mahsup edilebilir veya kurumlar vergisi mükelleflerince sermayeye ilave edilebilir; bu işlemler kâr dağıtımı sayılmaz.


    | İşlem | Tutar | Sonuç |

    |---|---|---|

    | Geçmiş yıl zararlarına mahsup | 2.500.000 | Vergi yok |

    | Sermayeye ilave | 1.500.000 | Vergi yok, kâr dağıtımı değil |

    | Olağanüstü yedeklere nakil | 800.000 | **Vergiye tabi** (nakil dönemi 2026) |


    Vergiye tabi tutar 800.000 TL; kurumlar vergisi = 800.000 × %25 = **200.000 TL**. Kalan bakiye = 6.000.000 − 2.500.000
    − 1.500.000 − 800.000 = **1.200.000 TL**.


    **(d) (Ç) kapsamı**


    - **M1 (2022):** kapsama girer; amortismana tabi, 2026 öncesi aktife girmiştir.

    - **M2 (3.3.2026):** Hesap dönemi içinde aktife giren kıymet için aktife girdiği hesap döneminde yeniden değerleme yapılmaz
    (Ç-9); kapsam dışı.

    - **Arsa:** (Ç) fıkrası amortismana tabi iktisadi kıymetlere ilişkindir; arsa amortismana tabi değildir, kapsam dışı.

    - **Taşıt (2023):** Kapsama girer; ancak maliyetine aktifleştirildiği hesap dönemi (2023) dışında eklenen kur farkı (100.000)
    ve kredi faizleri yeniden değerleme kapsamına girmez (Ç-1). Kapsama giren maliyet 900.000 − 100.000 = 800.000.

    - **Bina:** Kapsama girer (2019''da aktife girmiş, amortismana tabi).


    Kapsama girecek maliyet toplamı = 1.200.000 + 800.000 + 3.000.000 = **5.000.000 TL**.

    '
