    dogru_neden: 'Faiz tutarının tespitinin pratik olmadığı ve açık faiz yükü oluşturmayan ertelenmiş ödemelerde aktif, iktisap
      tarihinden değil ödeme tarihinden itibaren düzeltilir (TMS 29.22). Düzeltilmiş tutar = 900.000 × 270 / 180 = 1.350.000
      TL; bu tutar net gerçekleşebilir değeri (1.500.000) aşmadığından azaltılmaz (TMS 29.19). Püf noktaları: Önce düzeltme
      tarihini (ödeme tarihi) belirleyin, sonra düzeltilmiş tutarı net gerçekleşebilir değerle karşılaştırın; fatura tarihindeki
      endeks (150) bu soruda gereksiz veridir ve sizi 1.620.000''e götürür.'
