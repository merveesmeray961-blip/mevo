  kok: 'TMS 29''u uygulayan bir işletme, 15.3.2026''da faturası düzenlenen ve bedeli faiz yükü oluşturmayan bir anlaşma çerçevesinde
    15.6.2026''da ödenen 900.000 TL maliyetli ticari malları 31.12.2026''da stoklarında bulundurmaktadır (faiz tutarının tespiti
    pratik olmamaktadır). Genel fiyat endeksi Mart 2026: 150, Haziran 2026: 180, Aralık 2026: 270''tir; malların 31.12.2026''daki
    net gerçekleşebilir değeri 1.500.000 TL''dir. Bu malların 31.12.2026 finansal durum tablosunda gösterileceği tutar kaç
    TL''dir?'
  secenekler:
    A: '900.000'
    B: 1.080.000
    C: 1.350.000
    D: 1.500.000
    E: 1.620.000
