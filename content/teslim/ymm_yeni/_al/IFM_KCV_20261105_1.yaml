  kok: TMS 1 Finansal Tabloların Sunuluşu'na göre aşağıdaki sunumlardan hangisi **yanlıştır**?
  secenekler:
    A: Bir TFRS zorunlu kılmadığı veya izin vermediği hâlde, banka kredisi borcu ile mevduat net tutarla sunulmuştur
    B: Stoklar, stok değer düşüklüğü karşılığı indirilerek net tutarıyla finansal durum tablosunda sunulmuştur
    C: Bir makinenin elden çıkarılmasından doğan kazanç, satış bedelinden defter değeri ve satış giderleri düşülerek net kazanç
      olarak sunulmuştur
    D: Garanti karşılığı gideri, tedarikçi sözleşmesi gereği tazmin edilen tutar düşülerek gelir tablosunda net gösterilmiştir
    E: Önemli olmayan kur farkı kazanç ve kayıpları, kâr veya zarar tablosunda netleştirilerek tek kalem olarak sunulmuştur
  dogru: A
  aciklama:
    dogru_neden: TMS 1 par. 32'ye göre işletme, bir TFRS'de zorunlu kılınmadıkça veya izin verilmedikçe varlıklar ile yükümlülükleri
      ya da gelirler ile giderleri netleştiremez. A şıkkındaki netleştirmeyi ne bir TFRS zorunlu kılmakta ne de izin vermektedir;
      bu nedenle sunum yanlıştır.
    celdiriciler:
      B: Varlıkların değer düşüklüğü karşılıkları indirilerek net tutarla ölçülmesi netleştirme değildir (par. 33); sunum
        doğrudur.
      C: Duran varlık satışında kazanç veya kayıp, elde edilen tutardan defter değeri ve ilişkili satış giderleri düşülerek
        net sunulur (par. 34(a)); sunum doğrudur.
      D: TMS 37 uyarınca muhasebeleştirilen karşılıkla ilgili tazmin edilen harcamalar ile tazminat gelirleri netleştirilebilir
        (par. 34(b)); sunum doğrudur.
      E: Kur farkı gibi benzer işlem gruplarının kazanç ve kayıpları netleştirilerek sunulur; yalnızca önemli ise ayrı gösterilir
        (par. 35); sunum doğrudur.
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 32
    alinti: İşletme, bir TFRS'de zorunlu kılınmadıkça veya izin verilmedikçe, varlıklar ile yükümlülükleri veya gelirler ile
      giderleri netleştiremez.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 35
    alinti: İşletme ayrıca, benzer işlem gruplarından kaynaklanan kazanç ve kayıpları (örneğin kur farkı kazanç ve kayıplarını
      veya ticari amaçla elde tutulan finansal araçlardan kaynaklanan kazanç ve kayıpları) netleştirerek sunar. Ancak işletme,
      söz konusu kazanç ve kayıplar önemli ise bunları ayrı olarak gösterir.
