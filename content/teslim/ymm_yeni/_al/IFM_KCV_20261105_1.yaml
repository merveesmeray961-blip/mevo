  tip: uygulama
  zorluk: 3
  kok: 31.12.2026 tarihli finansal tablolarını 2025 yılı karşılaştırmalı olacak şekilde hazırlayan bir işletmenin, TMS 1'e
    göre 1.1.2025 tarihli ilave (üçüncü) bir finansal durum tablosu sunması **aşağıdaki durumlardan hangisinde** gerekir?
  secenekler:
    A: 2026 yılında bir makinenin faydalı ömrü tahmini değiştirilmiş ve değişiklik, geçmiş dönemler düzeltilmeden ileriye
      yönelik uygulanmıştır
    B: Muhasebe politikası değişikliği geriye dönük uygulanmış, ancak değişikliğin 1.1.2025 tarihli finansal durum tablosu
      üzerindeki etkisi önemsizdir
    C: 2024 yılındaki stok sayım hatası 2026'da geriye dönük düzeltilmiş; düzeltmenin 1.1.2025 tarihli finansal durum tablosundaki
      etkisi önemlidir
    D: 2025 yılının Haziran ayında yapılan bir satışın kayıt dışı kaldığı 2026'da fark edilerek düzeltilmiş, 1.1.2025 bakiyeleri
      bu hatadan etkilenmemiştir
    E: Yeni bir TFRS hükmü erken uygulanmış ve geçiş hükümlerine göre geçmiş dönem tutarları yeniden düzenlenmeden ileriye
      yönelik uygulanmıştır
  dogru: C
  aciklama:
    dogru_neden: 'TMS 1 par. 40A''ya göre üçüncü finansal durum tablosu, işletme muhasebe politikasını geriye dönük uyguladığında,
      finansal tablo kalemlerinde geriye dönük düzeltme yaptığında veya kalemleri yeniden sınıflandırdığında ve bunun bir
      önceki dönemin başındaki (burada 1.1.2025) finansal durum tablosundaki bilgiler üzerinde önemli etkisi olduğunda sunulur.
      C şıkkında 2024 hatası geriye dönük düzeltilmiş ve 1.1.2025 tablosu önemli ölçüde etkilenmiştir; her iki şart birlikte
      vardır.


      Püf noktaları: (1) Cari dönem 2026 ise "bir önceki dönemin başı" 1.1.2025''tir. (2) Yalnızca geriye dönük işlem olması
      yetmez; açılış tablosuna etkinin önemli olması da gerekir. (3) 2025 içinde doğan bir hata 1.1.2025 bakiyelerini etkilemez.
      (4) Muhasebe tahmini değişiklikleri ve ileriye yönelik uygulamalar geriye dönük düzeltme değildir.

      '
    celdiriciler:
      A: Muhasebe tahmini değişikliği ileriye yönelik uygulanır; geriye dönük uygulama, düzeltme veya yeniden sınıflandırma
        yoktur (par. 40A(a)).
      B: Geriye dönük uygulama vardır ancak 1.1.2025 tablosundaki bilgiler üzerinde önemli etki bulunmadığından par. 40A(b)
        şartı sağlanmaz.
      D: Hata 2025 içinde doğduğundan 1.1.2025 finansal durum tablosundaki bilgiler etkilenmez; par. 40A(b) şartı sağlanmaz.
      E: Geçmiş dönemler yeniden düzenlenmeden ileriye yönelik uygulamada geriye dönük uygulama, düzeltme veya yeniden sınıflandırma
        bulunmaz (par. 40A(a)).
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 40A
    alinti: 'İşletme aşağıdaki durumlarda, 38A paragrafındaki asgari karşılaştırmalı finansal tablolara ilave olarak bir önceki
      dönemin başına ait üçüncü bir finansal durum tablosu sunar: (a) İşletmenin; bir muhasebe politikasını geriye dönük uygulaması,
      finansal tablo kalemlerinde geriye dönük bir düzeltme yapması veya finansal tablo kalemlerini yeniden sınıflandırması
      ve (b) Geriye dönük uygulamanın, geriye dönük düzeltmenin veya yeniden sınıflandırmanın, bir önceki dönemin başındaki
      finansal durum tablosundaki bilgiler üzerinde önemli bir etkiye sahip olması.'
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 40B
    alinti: '40A paragrafında belirtilen durumlarda işletme, aşağıdaki tarihlere ait üç finansal durum tablosu sunar: (a)
      Cari dönemin sonu, (b) Bir önceki dönemin sonu ve (c) Bir önceki dönemin başı.'
