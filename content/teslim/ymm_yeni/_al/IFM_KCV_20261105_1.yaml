  kazanim: yükümlülüklerin kısa vadeli/uzun vadeli sınıflandırılması (TMS 1 par. 69-76)
  tip: uygulama
  zorluk: 3
  kok: Takvim yılı hesap dönemli bir işletmenin 31.12.2026 tarihli finansal tabloları 12.3.2027'de yayımlanmak üzere onaylanmıştır.
    Aşağıdaki banka kredilerinden hangisi 31.12.2026 tarihli finansal durum tablosunda tamamen uzun vadeli yükümlülük olarak
    sınıflandırılır? (Hiçbiri işletme sermayesinin bir parçasını oluşturmaz ve ticari amaçla elde tutulmamaktadır.)
  secenekler:
    A: Vadesi 31.5.2027 olan kredi; ödemeleri 2030'a yayan yeni finansman sözleşmesi 20.2.2027'de imzalanmıştır, raporlama
      tarihinde vade uzatma hakkı yoktur
    B: Vadesi 30.6.2028 olan kredi; sözleşmedeki finansal oran şartı 31.12.2026'da ihlal edilmiş, kredi veren 25.1.2027'de
      ödeme talep etmeyeceğini bildirmiştir
    C: Vadesi 31.10.2027 olan kredi; işletme vadesi gelince krediyi yenilemeyi planlamaktadır ve bankayla görüşmeler sürmektedir
    D: Dört eşit yıllık taksitle ödenecek kredi; ilk taksit 30.6.2027, son taksit 30.6.2030 tarihindedir ve sözleşme şartlarına
      uyulmuştur
    E: Vadesi 15.3.2029 olan kredi; sözleşme şartlarına uyulmuş, yönetim krediyi erken ödemeyi planlamış ve 15.2.2027'de ödemiştir
  dogru: E
  aciklama:
    dogru_neden: 'TMS 1 par. 75A''ya göre sınıflandırma, işletmenin ödemeyi raporlama döneminden en az 12 ay sonraya erteleme
      hakkını kullanma olasılığından etkilenmez; yönetimin erken ödeme niyeti veya raporlama sonrasında ödemenin yapılmış
      olması yükümlülüğü kısa vadeli yapmaz. E şıkkında sözleşme şartlarına uyulduğundan hak raporlama tarihinde mevcuttur
      ve kredi uzun vadelidir; ödemenin zamanlaması hakkında açıklama gerekebilir.


      Püf noktaları: (1) Hak raporlama tarihinde aranır; sonraki gelişmeler (ödeme, yeniden finansman, feragat) sınıflandırmayı
      değiştirmez, düzeltme gerektirmeyen olay olarak açıklanır. (2) Yönetimin niyeti sınıflandırmada belirleyici değildir.
      (3) Taksitli kredinin 12 ay içindeki taksidi ayrıca kısa vadelidir.

      '
    celdiriciler:
      A: Raporlama tarihinde vade uzatma hakkı yoktur; sonradan yapılan yeniden finansman sınıflandırmayı değiştirmez, kredi
        kısa vadelidir (par. 72, 73).
      B: Şart ihlali nedeniyle kredi talep hâlinde ödenmesi gereken hâle gelmiştir; kredi verenin sonradan talepte bulunmamayı
        kabul etmesi sınıflandırmayı değiştirmez, kredi kısa vadelidir (par. 74).
      C: Vadesi raporlama döneminden sonraki 12 ay içinde dolduğundan kısa vadelidir; yenileme planı hak oluşturmaz (par.
        69(c), 73).
      D: Kredinin 2027 yılında ödenecek taksiti kısa vadeli, kalan taksitler uzun vadelidir; kredi tamamen uzun vadeli değildir
        (par. 71).
  kaynaklar:
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
    madde: par. 74
    alinti: İşletmenin, uzun vadeli bir kredi sözleşmesinin koşullarını raporlama dönemi sonunda veya daha önce ihlal etmesi
      ve bunun sonucunda yükümlülüğün talep halinde ödenmesi gereken bir yükümlülük haline gelmesi durumunda; borç veren,
      raporlama döneminden sonra ve finansal tabloların yayımlanması için onaylanmasından önce bu ihlalin bir sonucu olarak
      ödeme yapılmasını talep etmeyeceğini kabul etse dahi, işletme yükümlülüğü kısa vadeli olarak sınıflandırır.
  - mevzuat: TMS 1 Finansal Tabloların Sunuluşu
