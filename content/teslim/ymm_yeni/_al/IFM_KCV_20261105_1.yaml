      düzeltme gerektirmeyen olay olarak açıklanır
    B: Finansal tablolar sürekliliğe göre hazırlanır; yalnızca ilgili varlık ve yükümlülüklerin tutarlarında düzeltme yapılarak
      tasfiye etkileri yansıtılır
    C: Finansal tablolar işletmenin sürekliliği esasına göre hazırlanmaz; muhasebe esasında temel bir değişiklik gerekir ve
      TMS 1'deki açıklamalar yapılır
    D: Tasfiye kararı düzeltme gerektiren olaydır; yalnızca stok ve alacaklarda değer düşüklüğü karşılığı ayrılarak 31.12.2026
