    1.7.2026''da Meridyen, Ortaköy''ün %40 payını daha satın alarak %70''e ulaşmış ve kontrolü elde etmiştir (TFRS 3 kapsamında
    bir işletme birleşmesidir). Bu tarihe ilişkin bilgiler:


    - Ödenen nakit: 2.800.000 TL.

    - Koşullu bedel: Ortaköy''ün 2027 FAVÖK''ü 3.000.000 TL''yi aşarsa 500.000 TL nakit daha ödenecektir. Koşullu bedelin
    1.7.2026''daki gerçeğe uygun değeri 200.000 TL''dir ve bu yükümlülük finansal borç olarak sınıflandırılır.

    - Meridyen''in satın alıma ilişkin katlandığı danışmanlık ve hukuk giderleri: 90.000 TL (nakit ödenmiştir).

    - Daha önce elde tutulan %30''luk payın 1.7.2026''daki gerçeğe uygun değeri: 2.100.000 TL.

    - Kontrol gücü olmayan payların (%30) gerçeğe uygun değeri: 1.500.000 TL.

    - Ortaköy''ün tanımlanabilir net varlıklarının 1.7.2026''daki gerçeğe uygun değeri (ertelenmiş vergi dahil): 6.000.000
    TL.


