  soru: '**Veriler**


    Ana AŞ, 1.1.2025''ten beri Alt AŞ''nin paylarının %80''ine sahiptir ve Alt AŞ''yi konsolide etmektedir. Kontrol gücü olmayan
    paylar (KGOP) edinimde orantılı pay yöntemiyle ölçülmüştür. Vergi etkileri ile Alt AŞ''ye ilişkin edinim kaynaklı gerçeğe
    uygun değer farkları dikkate alınmayacaktır. Gruplar arası işlemlerden doğan kâr eliminasyonları satıcı işletmenin dönem
    kârı üzerinden yapılacak ve KGOP payı eliminasyon sonrası kâr üzerinden hesaplanacaktır.


    2026 yılına ilişkin bilgiler (TL):


    - Ana AŞ''nin bireysel net dönem kârı 3.000.000''dir; bu tutar, Alt AŞ''den alınan temettü geliri 400.000''i içermektedir.
    Alt AŞ''nin bireysel net dönem kârı 1.000.000 olup 2026''da toplam 500.000 temettü dağıtılmıştır.

    - Yukarı yönlü stok satışı: Alt AŞ, Ana AŞ''ye 900.000 TL''ye mal satmıştır (Alt AŞ''deki maliyeti 600.000). Bu malların
    üçte biri 31.12.2026''da Ana AŞ''nin stoklarında bulunmaktadır. Ayrıca 31.12.2025 itibarıyla Ana AŞ''nin stoklarında,
    Alt AŞ''den alınmış mallara ilişkin 50.000 TL gerçekleşmemiş kâr bulunuyordu; bu mallar 2026''da üçüncü kişilere satılmıştır.

    - Aşağı yönlü stok satışı: Ana AŞ''nin Alt AŞ''ye sattığı mallardan Alt AŞ''nin 31.12.2026 stoklarında kalanlara ilişkin
    gerçekleşmemiş kâr 40.000''dir (31.12.2025''te yoktu).

    - Yukarı yönlü makine satışı: Alt AŞ, 1.7.2026''da defter değeri 400.000 olan bir makineyi Ana AŞ''ye 600.000''e satmıştır.
    Makinenin kalan faydalı ömrü 5 yıl olup doğrusal amortismana tabidir (kalıntı değer yok).

    - KGOP''un 1.1.2026 tarihli defter değeri 1.600.000''dir.

    - 31.12.2026''da (dönem sonu işlemlerinden sonra) Ana AŞ, Alt AŞ paylarının %10''unu 900.000 TL nakde satmış ve payı %70''e
    inmiştir; Alt AŞ üzerindeki kontrol devam etmektedir. Satılan %10''luk payın konsolide finansal tablolardaki defter değeri
    (Alt AŞ''nin şerefiye dahil konsolide net varlıklarının %10''u) 800.000''dir.


    **İstenenler**


    (a) 2026 yılı gruplar arası işlemlerine ilişkin konsolidasyon eliminasyonlarını (temettü, stok, makine) tutarlarıyla gösteriniz;
    gruplar arası işlemlerden doğan geçici farklar için hangi standardın uygulanacağını belirtiniz. (9 puan)


    (b) Eliminasyonlar sonrası konsolide net dönem kârını bulunuz ve ana ortaklık hissedarlarına ve KGOP''a dağıtınız. (6
    puan)


    (c) KGOP''un 31.12.2026 tarihli defter değerini (pay satışından önce) hesaplayınız. (4 puan)


    (d) %10''luk pay satışının konsolide finansal tablolara etkisini kayıtla gösteriniz ve kâr veya zarara yansıyıp yansımayacağını
    gerekçelendiriniz. (6 puan)

    '
  cozum: '**(a) Eliminasyonlar (TFRS 10 B86(c))**


    Gruplar arası temettü, özkaynak, gelir, gider ve nakit akışları ile stok ve duran varlıklara ilişkin kâr/zararlar tamamen
    elimine edilir. Geçici farklar için TMS 12 uygulanır (B86(c)).


    | İşlem | Yön | Hesap | Etki (satıcı kârı) |

    |---|---|---|---|

    | Temettü geliri (Ana AŞ) | – | Ana AŞ''nin bireysel kârından çıkarılır | −400.000 (Ana) |

    | Yıl sonu stoktaki gerçekleşmemiş kâr | Yukarı | (900.000 − 600.000) × 1/3 | −100.000 (Alt) |

    | 2025 sonu stoktaki kâr (2026''da gerçekleşti) | Yukarı | Açılış eliminasyonunun geri dönüşü | +50.000 (Alt) |

    | Aşağı yönlü stok kârı | Aşağı | Alt AŞ stoğundaki gerçekleşmemiş kâr | −40.000 (Ana) |

    | Makine satış kazancı | Yukarı | 600.000 − 400.000 | −200.000 (Alt) |

    | Fazla amortisman gideri geri dönüşü | Yukarı | 200.000 / 5 × 6/12 | +20.000 (Alt) |


    Makinede 31.12.2026''da elimine kalan gerçekleşmemiş kazanç 180.000 TL''dir (konsolide tablolarda makine, Alt AŞ''deki
    400.000 TL defter değeri esas alınarak ve 2026 amortismanı 40.000 TL olacak şekilde gösterilir).


    **(b) Konsolide kâr ve dağıtım (B94)**


    - Alt AŞ düzeltilmiş kâr = 1.000.000 + 50.000 − 100.000 − 200.000 + 20.000 = **770.000**

    - Ana AŞ düzeltilmiş kâr = 3.000.000 − 400.000 − 40.000 = **2.560.000**

    - Konsolide net dönem kârı = 770.000 + 2.560.000 = **3.330.000 TL**

    - KGOP payı = %20 × 770.000 = **154.000 TL**

    - Ana ortaklık hissedarlarına = 2.560.000 + %80 × 770.000 (616.000) = **3.176.000 TL**


    Kâr veya zarar KGOP ve ana ortaklık hissedarlarına dağıtılır (B94).


    **(c) KGOP defter değeri**


    | Kalem | TL |

    |---|---|

    | 1.1.2026 | 1.600.000 |

    | + 2026 kâr payı | 154.000 |

    | − KGOP''a düşen temettü (%20 × 500.000) | (100.000) |

    | **31.12.2026 (pay satışı öncesi)** | **1.654.000** |


    **(d) Kontrol kaybı olmaksızın pay satışı (23, B96)**


    Ana ortaklığın bağlı ortaklığındaki sahiplik payında kontrol kaybına yol açmayan değişiklikler özkaynak işlemidir (23).
    KGOP''un defter değeri, değişen göreceli paylara göre düzeltilir (+800.000); düzeltilen tutar ile alınan bedelin gerçeğe
    uygun değeri (900.000) arasındaki fark (100.000) doğrudan özkaynakta muhasebeleştirilir ve ana ortaklık hissedarlarına
    dağıtılır (B96). Kâr veya zarara kayıt yapılmaz, şerefiye değişmez.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Bankalar | 900.000 | |

    | Kontrol gücü olmayan paylar | | 800.000 |

    | Ana ortaklık hissedarlarına ait özkaynak (pay değişim farkı) | | 100.000 |


    KGOP''un pay satışı sonrası defter değeri = 1.654.000 + 800.000 = **2.454.000 TL**.

    '
