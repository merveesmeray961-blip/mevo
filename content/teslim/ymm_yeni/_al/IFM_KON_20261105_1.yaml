  cozum: '**(a) Şerefiye (TFRS 3.32)**


    Transfer edilen bedel = nakit 2.800.000 + koşullu bedelin gerçeğe uygun değeri 200.000 = 3.000.000 TL (koşullu bedel transfer
    edilen bedelin parçasıdır, 39). Daha önce elde tutulan pay birleşme tarihindeki gerçeğe uygun değeriyle dikkate alınır
    (32(a)(iii), 42).


    | Kalem | (i) KGOP GUD | (ii) KGOP orantılı pay |

    |---|---|---|

    | Transfer edilen bedel | 3.000.000 | 3.000.000 |

    | Kontrol gücü olmayan paylar | 1.500.000 | 1.800.000 (%30 × 6.000.000) |

    | Daha önce elde tutulan pay (GUD) | 2.100.000 | 2.100.000 |

    | **Toplam (a)** | **6.600.000** | **6.900.000** |

    | Tanımlanabilir net varlıklar (b) | 6.000.000 | 6.000.000 |

    | **Şerefiye** | **600.000** | **900.000** |


    **(b) 1.7.2026 kayıtları (seçenek i)**


    - Daha önce elde tutulan pay GUD ile yeniden ölçülür: 2.100.000 − 1.800.000 = **300.000 TL kazanç** (kâr veya zarar; 42).

    - Özkaynak yöntemi sona erdiğinden DKG''de birikmiş 60.000 TL çevrim kazancı, yatırımın doğrudan elden çıkarılması hâlindeki
    esasa göre kâr veya zarara yeniden sınıflandırılır (42; TMS 28.22(c), 23).

    - Satın alıma ilişkin 90.000 TL maliyet gider yazılır (53).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Tanımlanabilir net varlıklar (GUD, ertelenmiş vergi dahil) | 6.000.000 | |

    | Şerefiye | 600.000 | |

    | Bankalar | | 2.800.000 |

    | Koşullu bedel yükümlülüğü | | 200.000 |

    | İştirak yatırımı (özkaynak yöntemi) | | 1.800.000 |

    | Daha önce elde tutulan payın yeniden ölçüm kazancı (K/Z) | | 300.000 |

    | Kontrol gücü olmayan paylar | | 1.500.000 |

    | Yabancı para çevrim farkları fonu (DKG) | 60.000 | |

    | Yeniden sınıflandırma kazancı (K/Z) | | 60.000 |

    | Satın alım giderleri (K/Z) | 90.000 | |

    | Bankalar | | 90.000 |


    Kâr veya zarara etkisi = 300.000 + 60.000 − 90.000 = **270.000 TL kazanç**.


    **(c) 31.12.2026**


    - Koşullu bedel: Değişim edinim tarihinden sonraki gelişmelerden (beklentilerin iyileşmesi) kaynaklandığından ölçme dönemi
    düzeltmesi değildir; TFRS 9 kapsamındaki finansal borç gerçeğe uygun değeriyle ölçülür ve değişim kâr veya zararda yer
    alır (58). Zarar = 350.000 − 200.000 = **150.000 TL** (şerefiye değişmez).

    - Değerleme raporu: Bilgi birleşme tarihinde var olan gerçeklere ilişkindir; ölçme dönemi içinde geriye dönük düzeltme
    yapılır (45, 48). Net varlıklar 100.000 TL artar, şerefiye 100.000 TL azalır: 600.000 − 100.000 = **500.000 TL** (KGOP
    gerçeğe uygun değerle ölçüldüğünden değişmez).


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Koşullu bedel değişim zararı (K/Z) | 150.000 | |

    | Koşullu bedel yükümlülüğü | | 150.000 |

    | Binalar | 100.000 | |

    | Şerefiye | | 100.000 |


    **(d) Açıklama**


    Satın alıma ilişkin maliyetler (danışmanlık, hukuk vb.), transfer edilen bedelin parçası olmayıp maliyetlerin gerçekleştiği
    ve hizmetlerin alındığı dönemde gider yazılır (53). Koşullu bedel birleşme tarihindeki gerçeğe uygun değeriyle transfer
    edilen bedele dahil edilir (39); sonraki değişimler ölçme dönemi düzeltmesi değilse kâr veya zarara yansır (58). Ölçme
    dönemi, birleşme tarihinden başlayarak **bir yılı aşamaz** (45).

    '
