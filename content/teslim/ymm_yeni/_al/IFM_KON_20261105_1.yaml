    gerçeğe uygun değeri 350.000 TL''ye yükselmiştir. Ayrıca Aralık 2026''da tamamlanan nihai değerleme raporu, bir binanın
    1.7.2026''daki gerçeğe uygun değerinin geçici tutardan 100.000 TL yüksek olduğunu göstermiştir (bu bilgi edinim tarihinde
