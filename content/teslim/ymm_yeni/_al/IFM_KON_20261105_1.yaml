  soru: '**Veriler**


    Kaya Holding AŞ, 1.1.2025''te Dere AŞ''nin paylarının %30''unu 3.600.000 TL''ye satın alarak önemli etki elde etmiş ve
    yatırımı özkaynak yöntemiyle muhasebeleştirmiştir. Kaya''nın Dere''ye ayrıca, ödenmesi planlanmamış ve öngörülebilir gelecekte
    gerçekleşmeyecek, teminatsız 500.000 TL tutarında uzun vadeli kredi alacağı vardır; bu alacak özünde Kaya''nın Dere''deki
    net yatırımının bir parçasıdır (alacağın TFRS 9 kapsamındaki değer düşüklüğü dikkate alınmayacaktır). Kaya''nın Dere''nin
    zararlarını karşılama yönünde yasal veya zımni bir yükümlülüğü yoktur ve Dere adına ödeme yapmamıştır. Vergi etkileri
    dikkate alınmayacaktır.


    Edinim tarihinde Dere''nin defter değerleriyle net varlıkları 8.000.000 TL''dir; yalnızca bir binanın gerçeğe uygun değeri
    defter değerinden 1.000.000 TL yüksektir (binanın kalan faydalı ömrü 20 yıl, doğrusal amortisman). Dere''nin tanımlanabilir
    net varlıklarının edinim tarihindeki gerçeğe uygun değeri bu nedenle 9.000.000 TL''dir.


    - 2025: Dere''nin bildirdiği net dönem zararı 14.000.000 TL''dir. Yıl içinde Dere, Kaya''ya mal satmıştır; 31.12.2025''te
    Kaya''nın stoklarında kalan mallara ilişkin Dere''nin gerçekleşmemiş kârı 100.000 TL''dir. Kaya da Dere''ye mal satmıştır;
    31.12.2025''te Dere''nin stoklarında kalan mallara ilişkin Kaya''nın gerçekleşmemiş kârı 60.000 TL''dir. Bu malların tamamı
    2026''da üçüncü kişilere satılmıştır.

    - 2026: Dere 2.000.000 TL net dönem kârı bildirmiş, temettü dağıtmamıştır (2026''da yeni gruplar arası işlem yoktur).


    **İstenenler**


    (a) Edinim tarihinde şerefiyeyi hesaplayarak muhasebeleştirilmesini açıklayınız. (5 puan)


    (b) 2025 yılında Kaya''nın finansal tablolara alacağı zarar payını (bina farkı ve gruplar arası eliminasyonlar dahil)
    hesaplayınız; bu payın yatırımın defter değerine ve uzun vadeli krediye nasıl yansıtılacağını, finansal tablolara alınmayan
    zararı ve zararın bu şekilde sınırlanma dayanağını belirtiniz. (8 puan)


    (c) 2026 yılında Kaya''nın finansal tablolara alacağı kâr payını hesaplayınız ve 31.12.2026''da net yatırımın (özkaynak
    payı ile uzun vadeli kredi toplamı) defter değerini bulunuz. (7 puan)


    (d) Kaya''nın Dere''ye ayrıca 300.000 TL tutarında, uygun teminatla karşılanmış bir ticari alacağı olsaydı bu alacağın
    zararların uygulanmasında dikkate alınıp alınmayacağını; Kaya''nın finansal tablolara alınmayan zararlar için yükümlülük
    (karşılık) ayırıp ayıramayacağını açıklayınız. (5 puan)

    '
  cozum: '**(a) Şerefiye (TMS 28.32)**


    Kaya''nın tanımlanabilir net varlıkların gerçeğe uygun değerindeki payı = %30 × 9.000.000 = 2.700.000 TL. Şerefiye = 3.600.000
    − 2.700.000 = **900.000 TL**. İştirakle ilgili şerefiye yatırımın defter değerine dahil edilir, ayrıca gösterilmez ve
    amortismana tabi tutulmaz (32(a)).


    **(b) 2025**


    | Kalem | Hesap | TL |

    |---|---|---|

    | Dere''nin bildirdiği zarar | | (14.000.000) |

    | Bina farkı amortismanı (edinim tarihi GUD''ye göre düzeltme) | 1.000.000 / 20 | (50.000) |

    | Düzeltilmiş zarar | | (14.050.000) |

    | Kaya''nın payı | %30 × 14.050.000 | (4.215.000) |

    | Yukarı yönlü kâr eliminasyonu | %30 × 100.000 | (30.000) |

    | Aşağı yönlü kâr eliminasyonu | %30 × 60.000 | (18.000) |

    | **Toplam zarar payı** | | **(4.263.000)** |


    Yukarı ve aşağı yönlü işlemlerde kazançlar yalnızca ilişkili olmayan yatırımcıların paylarına isabet eden kısım kadar
    yansıtılır; Kaya''nın payı elimine edilir (28). Edinim sonrası amortisman da GUD''ye göre düzeltilir (32).


    Zarar payı yatırımın defter değerini azaltır: 3.600.000 (şerefiye dahil) → 0. Kalan zarar 4.263.000 − 3.600.000 = 663.000
    TL, net yatırımın parçası olan uzun vadeli krediye uygulanır: 500.000 → 0. Hâlâ karşılanamayan **163.000 TL** zarar finansal
    tablolara yansıtılmaz (38). Kaya''nın yasal veya zımni yükümlülüğü ve Dere adına yaptığı ödeme bulunmadığından ilave karşılık/borç
    ayrılmaz (39). 2025 K/Z''de finansal tablolara alınan zarar: 3.600.000 + 500.000 = 4.100.000 TL.


    **(c) 2026**


    | Kalem | Hesap | TL |

    |---|---|---|

    | Dere''nin kârı | | 2.000.000 |

    | Bina farkı amortismanı | | (50.000) |

    | Düzeltilmiş kâr | | 1.950.000 |

    | Kaya''nın payı | %30 × 1.950.000 | 585.000 |

    | 2025 yukarı yönlü kârın gerçekleşmesi | %30 × 100.000 | 30.000 |

    | 2025 aşağı yönlü kârın gerçekleşmesi | %30 × 60.000 | 18.000 |

    | **Kâr payı (brüt)** | | **633.000** |

    | Finansal tablolara alınmamış zararlara mahsup | | (163.000) |

    | **Finansal tablolara alınacak kâr payı** | | **470.000** |


    İştirakin sonraki dönemlerde kâr etmesi durumunda yatırımcı, kârdaki payı finansal tablolara ancak bu payın finansal tablolara
    yansıtılmamış zararlardaki paya eşitlenmesinden sonra yansıtır (39). 31.12.2026''da net yatırımın (özkaynak payı + uzun
    vadeli kredi) toplam defter değeri = 0 + 470.000 = **470.000 TL**.


    **(d) Teminatlı ticari alacak ve karşılık**


    Uzun vadeli hak niteliğindeki kalemler net yatırıma dahildir; ancak ticari borç ve alacaklar ile teminatlı krediler gibi
    uygun karşılıkları olan uzun vadeli alacaklar bu kalemlere dahil değildir (38). Dolayısıyla 300.000 TL''lik teminatlı
    ticari alacak zararların uygulanmasında dikkate alınmazdı. Kaya''nın payı sıfıra indikten sonra ilave zarar karşılığı
    ayırması ancak yasal veya zımni yükümlülüğe maruz kalması ya da Dere adına ödeme yapması hâlinde söz konusudur (39); olayda
    bu durum yoktur, bu nedenle 163.000 TL için yükümlülük ayrılamaz.

    '
