gorev: YMM paketi 2026-11-05
klasik:
- id: TASLAK
  sinav: ymm
  ders: IFM
  konu: KUR
  kazanimlar:
  - yurtdışındaki işletmenin finansal tablolarının sunum para birimine çevrimi
  - yurtdışındaki işletmedeki net yatırım ve grup içi parasal kalemlerin kur farkları
  - şerefiyenin çevrimi
  - yurtdışındaki işletmenin elden çıkarılması ve birikmiş kur farkları
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Geçerli ve sunum para birimi TL olan Meridyen Holding AŞ (Meridyen), 1.1.2026 tarihinde Almanya''daki Elbe Tekstil GmbH''nin
    (Elbe) paylarının %100''ünü 1.200.000 avro (48.000.000 TL) bedelle satın almıştır. Elbe; satış fiyatlarını avro olarak
    belirlemekte, maliyetlerinin ve borçlanmasının tamamını avro ile karşılamakta, nakit akışlarını yerel olarak yönetmekte
    ve Meridyen''den bağımsız faaliyet göstermektedir. Avronun yüksek enflasyonlu bir ekonominin para birimi olmadığı kabul
    edilecektir.


    - Satın alma tarihinde Elbe''nin tanımlanabilir net varlıklarının gerçeğe uygun değeri 1.000.000 avro, şerefiye 200.000
    avrodur (şerefiyede değer düşüklüğü yoktur).

    - Elbe''nin 2026 net dönem kârı 300.000 avro olup gelir ve giderler yıl boyunca dengeli oluşmuştur; temettü dağıtılmamış,
    sermaye hareketi olmamıştır. 31.12.2026''da tanımlanabilir net varlıkları (şerefiye hariç) 1.300.000 avrodur.

    - Meridyen 1.7.2026''da Elbe''ye 500.000 avro tutarında avro cinsinden kredi vermiştir; geri ödemesi planlanmamış olup
    öngörülebilir gelecekte beklenmemektedir.

    - Meridyen 1.11.2026''da Elbe''ye 100.000 avro bedelli ticari mal satmış; alacak 1.3.2027''de tahsil edilecektir.


    | Tarih / dönem | 1 avro = TL |

    |---|---|

    | 1.1.2026 | 40 |

    | 1.7.2026 | 44 |

    | 1.11.2026 | 45 |

    | 2026 ortalaması (kurlar önemli dalgalanmamıştır) | 44 |

    | 31.12.2026 | 46 |


    Vergi etkileri dikkate alınmayacaktır.


    **İstenenler**


    (a) Elbe''nin geçerli para birimini belirleyiniz ve Meridyen''in konsolide finansal tablolarında Elbe''nin finansal tablolarının
    hangi kurlarla çevrileceğini açıklayınız. (4 puan)


    (b) 31.12.2026 itibarıyla Elbe''nin net varlıkları ile şerefiyenin çevriminden doğan kur farkını hesaplayınız ve nerede
    muhasebeleştirileceğini belirtiniz. (8 puan)


    (c) Meridyen''in kredisi ile ticari alacağına ilişkin 2026 kur farklarını hesaplayınız; bunların Meridyen''in bireysel
    ve konsolide finansal tablolarındaki muhasebeleştirilmesini ve konsolide diğer kapsamlı gelirdeki toplam çevrim farkını
    bulunuz. (7 puan)


    (d) Meridyen''in Elbe''yi 30.6.2027''de tamamen satması halinde birikmiş kur farklarının akıbetini açıklayınız (2027''de
    ilave kur farkı oluşmadığı varsayılacaktır). Elbe''nin kontrol kaybedilerek %30''unun elde tutulmasıyla satışında ve bir
    değer düşüklüğü durumunda sonucun ne olacağını belirtiniz. (6 puan)

    '
  cozum: '**(a) Geçerli para birimi ve çevrim yöntemi (TMS 21 par. 9-11, 39-40)**


    Elbe satış fiyatlarını, maliyetlerini ve finansmanını avro ile belirlediği ve faaliyetleri Meridyen''in uzantısı olmayıp
    özerk yürütüldüğü için geçerli para birimi **avrodur**. Sunum para birimi TL olduğundan (par. 38-39): aktif ve yabancı
    kaynaklar **kapanış kuru** (46) ile; gelir ve giderler **işlem tarihi kurları** ile (kurlar önemli dalgalanmadığından
    yaklaşık olarak dönem ortalaması, 44; par. 40); ortaya çıkan tüm kur farkları **diğer kapsamlı gelirde** muhasebeleştirilir.


    **(b) Çevrim farkı (par. 39(c), 41, 47)**


    | Net varlıklar | Avro | Kur | TL |

    |---|---|---|---|

    | 1.1.2026 açılış net varlıklar | 1.000.000 | 40 | 40.000.000 |

    | 2026 net kâr | 300.000 | 44 | 13.200.000 |

    | Beklenen kapanış (açılış + kâr) | | | 53.200.000 |

    | 31.12.2026 net varlıklar | 1.300.000 | 46 | 59.800.000 |

    | **Net varlıklardan çevrim farkı** | | | **6.600.000** |


    (Kontrol: 1.000.000 x (46-40) + 300.000 x (46-44) = 6.000.000 + 600.000.)


    Şerefiye, yurtdışındaki işletmenin varlığı sayılır ve avro cinsinden ifade edilerek kapanış kuruyla çevrilir (par. 47):
    200.000 x 46 = 9.200.000; satın alma tarihi değeri 200.000 x 40 = 8.000.000; fark **1.200.000 TL**.


    Toplam çevrim farkı = 6.600.000 + 1.200.000 = **7.800.000 TL**; diğer kapsamlı gelirde, özkaynakta ayrı bir bileşende
    (çevrim farkları) birikir. Kontrol gücü olmayan pay bulunmadığından tamamı ana ortaklığa aittir.


    **(c) Grup içi parasal kalemler (par. 15, 28, 32-33, 45)**


    | Kalem | Hesap | Kur farkı |

    |---|---|---|

    | Kredi (net yatırımın parçası) | 500.000 x (46 - 44) | 1.000.000 kazanç |

    | Ticari alacak | 100.000 x (46 - 45) | 100.000 kazanç |


    - **Kredi:** Geri ödemesi planlanmayan ve beklenmeyen kredi, yurtdışı işletmedeki net yatırımın parçasıdır (par. 15).
    Kredi Elbe''nin geçerli para biriminde (avro) olduğundan kur farkı Meridyen''in **bireysel** tablolarında **kâr veya zararda**
    (1.000.000 TL gelir) oluşur (par. 28, 33); Elbe''nin tablolarında kur farkı yoktur. **Konsolide** tablolarda bu fark başlangıçta
    **diğer kapsamlı gelirde** muhasebeleştirilir (par. 32, 33, 45).

    - **Ticari alacak:** Ticari alacaklar net yatırımın parçası olamaz (par. 15). 100.000 TL kur kazancı hem bireysel hem
    de **konsolide** tablolarda **kâr veya zararda** kalır; grup içi parasal kalem kur etkisi gösterilmeden elimine edilemez
    (par. 45).

    - **Konsolide diğer kapsamlı gelirdeki toplam çevrim farkı** = 6.600.000 + 1.200.000 + 1.000.000 = **8.800.000 TL**.


    **(d) Elden çıkarma (par. 48, 48A, 49)**


    - Elbe''nin tamamının satışında, diğer kapsamlı gelirde biriken **8.800.000 TL** birikmiş kur farkı, elden çıkarmadan
    kaynaklanan kazanç veya kayıp muhasebeleştirildiğinde özkaynaktan **kâr veya zarara yeniden sınıflandırılır** (par. 48;
    kazanç niteliğinde).

    - Kontrol kaybı doğuran kısmi elden çıkarma (%70 satılıp %30 elde tutulsa dahi) elden çıkarma olarak muhasebeleştirilir
    (par. 48A(a)); birikmiş kur farkının tamamı yine kâr veya zarara aktarılır.

    - Yurtdışındaki işletmenin defter değerinin değer düşüklüğü nedeniyle düşürülmesi kısmi elden çıkarma sayılmaz; birikmiş
    kur farkından kâr veya zarara yeniden sınıflandırma yapılmaz (par. 49).

    '
  puanlama:
  - olcut: (a) Geçerli para biriminin avro olarak gerekçelendirilmesi
    puan: 2
  - olcut: (a) Çevrim yönteminin (kapanış kuru, işlem tarihi kuru, diğer kapsamlı gelir) açıklanması
    puan: 2
  - olcut: (b) Net varlıklardan doğan 6.600.000 TL çevrim farkının hesaplanması
    puan: 4
  - olcut: (b) Şerefiyenin kapanış kuruyla çevrilip 1.200.000 TL farkın bulunması (par. 47)
    puan: 3
  - olcut: (b) Farkın diğer kapsamlı gelirde sunulması
    puan: 1
  - olcut: (c) Kredinin net yatırım olduğunun belirlenmesi, 1.000.000 TL farkın bireysel tabloda kâr/zarar, konsolide tabloda
      diğer kapsamlı gelirde gösterilmesi
    puan: 4
  - olcut: (c) Ticari alacağın 100.000 TL farkının her iki tabloda kâr/zararda kalması
    puan: 2
  - olcut: (c) Toplam çevrim farkının 8.800.000 TL bulunması
    puan: 1
  - olcut: (d) Tam satışta 8.800.000 TL birikmiş farkın kâr veya zarara yeniden sınıflandırılması
    puan: 3
  - olcut: (d) Kontrol kaybı doğuran kısmi satış ve değer düşüklüğü durumlarının doğru değerlendirilmesi
    puan: 3
  kaynaklar:
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 47
    alinti: Yurtdışındaki işletmenin iktisabında ortaya çıkan şerefiye ve yine bu iktisap sırasında aktif ve pasiflerin defter
      değerlerine yapılan gerçeğe uygun değer düzeltmeleri, yurtdışındaki işletmenin aktif ve pasifleri olarak dikkate alınır.
      Bundan dolayı, yurtdışındaki işletmenin geçerli para birimi cinsinden ifade edilirler ve 39’uncu ve 42’nci paragraflara
      göre kapanış kurundan çevrilirler.
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 32
    alinti: 'Raporlayan işletmenin yurtdışındaki işletmesindeki net yatırımının bir parçasını oluşturan (bakınız: 15’inci
      paragraf) parasal bir kalemden kaynaklanan kur farkları, raporlayan işletmenin bireysel finansal tablolarında ve yurtdışındaki
      işletmenin kendi finansal tablolarında kâr ya da zarar olarak muhasebeleştirilir.'
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 45
    alinti: Dolayısıyla, raporlayan işletmenin konsolide finansal tablolarında bu tür kur farkları kâr veya zararda muhasebeleştirilir
      veya 32’nci paragrafta belirtilen durumlardan kaynaklanması durumunda yurtdışındaki işletmenin elden çıkarılmasına kadar
      diğer kapsamlı gelirde muhasebeleştirilir
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 48
    alinti: Yurtdışındaki işletmenin elden çıkarılmasında, diğer kapsamlı gelirde muhasebeleştirilmiş ve özkaynağın ayrı bir
      bileşeninde biriktirilmiş söz konusu işletmeye ait birikmiş kur farkları, elden 8 çıkarmadan kaynaklanan kazanç veya
      kayıp muhasebeleştirildiğinde, özkaynaktan kâr veya zarara aktarılarak (yeniden sınıflandırmaya ilişkin bir düzeltme
      olarak) yeniden sınıflandırılır
  - mevzuat: TMS 21 Kur Değişiminin Etkileri
    madde: par. 49
    alinti: Dolayısıyla diğer kapsamlı gelirde muhasebeleştirilen kur farkı kazanç ya da kaybının herhangi bir kısmı, değer
      düşüklüğünün yansıtılması sırasında kâr veya zararda yeniden sınıflandırılmaz.
  dogrulama:
    python: "f0, fo, fk, ok = 40, 44, 46, 46\nna0, kar, na1, gw = 1000000, 300000, 1300000, 200000\nfark_na = na1 * fk - (na0\
      \ * f0 + kar * fo)\nfark_gw = gw * (fk - f0)\nkredi = 500000 * (fk - 44)\nticari = 100000 * (fk - 45)\noci = fark_na\
      \ + fark_gw + kredi\nsonuc = {'fark_net_varlik': fark_na, 'fark_serefiye': fark_gw, 'toplam_cevrim': fark_na + fark_gw,\
      \ 'kredi_kur': kredi,\n         'ticari_kur': ticari, 'oci_toplam': oci, 'serefiye_kapanis': gw * fk, 'net_varlik_kapanis':\
      \ na1 * fk, 'kar_cevrilen': kar * fo}"
