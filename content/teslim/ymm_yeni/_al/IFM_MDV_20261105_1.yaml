  soru: '**Veriler**


    Karadeniz Tekstil AŞ''nin hesap dönemi takvim yılıdır. Şirket, "binalar" varlık sınıfı için TMS 16''daki yeniden değerleme
    modelini uygulamaktadır. Sınıftaki idari bina için bilgiler aşağıdadır (arsa ayrı izlenmektedir ve bu vakada dikkate alınmayacaktır;
    ertelenmiş vergi hesaplanmayacaktır):


    - Bina 1.1.2024''te 10.000.000 TL maliyetle iktisap edilmiş ve aynı gün kullanıma alınmıştır. Yararlı ömrü 20 yıl, kalıntı
    değeri sıfırdır; doğrusal amortisman uygulanmaktadır.

    - Yeniden değerleme her yıl sonunda yapılmaktadır. Binanın gerçeğe uygun değeri 31.12.2024''te 11.400.000 TL, 31.12.2025''te
    9.900.000 TL''dir. Her yeniden değerlemeden sonra amortisman, yeniden değerlenmiş tutarın kalan yararlı ömre bölünmesiyle
    hesaplanmaktadır.

    - Yeniden değerleme tarihinde brüt defter değeri, defter değerindeki değişimle orantılı olarak düzeltilmekte; birikmiş
    amortisman, düzeltilmiş brüt defter değeri ile yeniden değerlenmiş tutar arasındaki fark kadar olacak şekilde belirlenmektedir.

    - Yeniden değerleme fazlası, varlık kullanıldıkça her yıl sonunda (2026 yılında ise satış tarihinde) dağıtılmamış kârlara
    aktarılmaktadır.

    - Bina, 1.7.2026''da 10.000.000 TL''ye peşin satılmış ve teslim edilmiştir. 1.1.2026-30.6.2026 dönemi amortismanı ayrılmıştır.

    - "Binalar" sınıfında, 2025 sonunda edinilen ve idari binayla benzer nitelik ve kullanıma sahip bir depo binası da bulunmaktadır.
    Yönetim, bu bina için yeniden değerleme yapmayıp maliyet modelini sürdürmeyi düşünmektedir.


    **İstenenler**


    (a) 31.12.2024 tarihli yeniden değerlemede brüt defter değerini, birikmiş amortismanı ve yeniden değerleme fazlasını bulunuz;
    yevmiye kaydını yapınız. (6 puan)


    (b) 2025 yılı amortismanını, yıl sonunda dağıtılmamış kârlara aktarılacak tutarı ve 31.12.2025 tarihli yeniden değerlemenin
    muhasebeleştirilmesini gösteriniz; 31.12.2025 sonrası yeniden değerleme fazlası bakiyesini bulunuz. (7 puan)


    (c) 2026 yılı için amortismanı, yapılacak aktarımı, satış kazancını ve yevmiye kayıtlarını gösteriniz; satış tarihinde
    yeniden değerleme fazlasının akıbetini belirtiniz. (7 puan)


    (d) Yönetimin depo binası konusundaki düşüncesini TMS 16''ya göre değerlendiriniz; ayrıca yeniden değerleme fazlasından
    yapılan aktarımın kâr veya zarar yoluyla yapılıp yapılamayacağını ve satış kazancının hasılat sayılıp sayılmayacağını
    açıklayınız. (5 puan)

    '
  cozum: '**(a) 31.12.2024 yeniden değerlemesi (TMS 16 par. 31, 35(a), 39)**


    | Kalem | Tutar (TL) |

    |---|---|

    | Yıllık amortisman (10.000.000 / 20) | 500.000 |

    | 31.12.2024 defter değeri (10.000.000 - 500.000) | 9.500.000 |

    | Gerçeğe uygun değer | 11.400.000 |

    | Değişim oranı (11.400.000 / 9.500.000) | 1,2 |

    | Yeni brüt defter değeri (10.000.000 x 1,2) | 12.000.000 |

    | Yeni birikmiş amortisman (12.000.000 - 11.400.000) | 600.000 |

    | Yeniden değerleme fazlası (11.400.000 - 9.500.000) | **1.900.000** |


    | Hesap (31.12.2024) | Borç | Alacak |

    |---|---|---|

    | 252 Binalar | 2.000.000 | |

    | 257 Birikmiş Amortismanlar | | 100.000 |

    | 522 Maddi Duran Varlık Yeniden Değerleme Artışları (diğer kapsamlı gelir) | | 1.900.000 |


    Artış diğer kapsamlı gelirde muhasebeleştirilir ve özkaynakta yeniden değerleme fazlası olarak birikir; daha önce kâr
    veya zarara yansıtılmış bir azalış bulunmadığından kâr veya zarara yansıyan tutar yoktur (par. 39).


    **(b) 2025 yılı**


    - Amortisman = 11.400.000 / 19 (kalan yıl) = **600.000 TL**.

    - Aktarım = yeniden değerlenmiş tutar üzerinden hesaplanan amortisman (600.000) - orijinal maliyet üzerinden hesaplanan
    amortisman (10.000.000 / 20 = 500.000) = **100.000 TL** (par. 41). Kayıt: Borç 522 / Alacak 570 Geçmiş Yıllar Kârları
    100.000 TL; kâr veya zarardan geçmez.

    - Yeniden değerleme fazlası: 1.900.000 - 100.000 = 1.800.000 TL.

    - 31.12.2025 defter değeri = 11.400.000 - 600.000 = 10.800.000 TL (brüt 12.000.000; birikmiş amortisman 1.200.000). Gerçeğe
    uygun değer 9.900.000 TL olduğundan azalış = 900.000 TL.

    - Orantılı düzeltme: brüt değer = 12.000.000 x 9.900.000 / 10.800.000 = 11.000.000 TL; birikmiş amortisman = 11.000.000
    - 9.900.000 = 1.100.000 TL.

    - Azalış, aynı varlığa ilişkin yeniden değerleme fazlasının alacak bakiyesi (1.800.000) kapsamında kaldığından tamamı
    diğer kapsamlı gelirde muhasebeleştirilir ve fazlayı azaltır; gider yazılmaz (par. 40).


    | Hesap (31.12.2025) | Borç | Alacak |

    |---|---|---|

    | 522 Maddi Duran Varlık Yeniden Değerleme Artışları | 900.000 | |

    | 257 Birikmiş Amortismanlar | 100.000 | |

    | 252 Binalar | | 1.000.000 |


    Fazla bakiyesi = 1.800.000 - 900.000 = **900.000 TL**.


    **(c) 2026 yılı**


    - Kalan ömür 18 yıl; 2026 yılının ilk altı ayı amortismanı = 9.900.000 / 18 x 6/12 = **275.000 TL**. Orijinal maliyet
    üzerinden altı aylık amortisman 250.000 TL olduğundan aktarım = **25.000 TL** (Borç 522 / Alacak 570).

    - Satış tarihindeki defter değeri = 9.900.000 - 275.000 = 9.625.000 TL (brüt 11.000.000; birikmiş amortisman 1.100.000
    + 275.000 = 1.375.000).

    - Satış kazancı = 10.000.000 - 9.625.000 = **375.000 TL**; kâr veya zarara yansıtılır (par. 68, 71).


    | Hesap (1.7.2026) | Borç | Alacak |

    |---|---|---|

    | 102 Bankalar | 10.000.000 | |

    | 257 Birikmiş Amortismanlar | 1.375.000 | |

    | 252 Binalar | | 11.000.000 |

    | 649 Diğer Olağan Gelir ve Kârlar (finansal tablo dışı bırakma kazancı) | | 375.000 |


    - Satış anında fazla bakiyesi = 900.000 - 25.000 = **875.000 TL**; varlık finansal tablo dışı bırakıldığında doğrudan
    geçmiş yıl kârlarına aktarılabilir (Borç 522 / Alacak 570 875.000 TL). Satış nedeniyle toplam aktarım 900.000 TL''dir.


    **(d) Değerlendirme**


    - Depo binası: Bir maddi duran varlık kalemi yeniden değerlendiğinde, ait olduğu tüm maddi duran varlık sınıfı da yeniden
    değerlenir (par. 36); muhasebe politikası sınıfın tamamına uygulanır (par. 29) ve sınıftaki kalemler eş zamanlı değerlenir
    (par. 38). Depo, idari binayla aynı sınıfta olduğundan maliyet modelinde bırakılamaz; yeniden değerlenmelidir.

    - Fazlanın dağıtılmamış kârlara aktarımı kâr veya zarar aracılığıyla yapılamaz (par. 41); aktarım doğrudan özkaynak içinde
    yapılır.

    - Kalemin finansal tablo dışı bırakılmasından doğan kazanç kâr veya zarara yansıtılır ve hasılat olarak sınıflandırılmaz
    (par. 68).

    '
