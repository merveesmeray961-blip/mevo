    Doğu İnşaat Ticaret AŞ''nin hesap dönemi takvim yılıdır. Şirket, yatırım amaçlı gayrimenkullerinin (YAG) tamamı için TMS
    40''taki gerçeğe uygun değer yöntemini; sahibi tarafından kullanılan gayrimenkuller için TMS 16''daki maliyet modelini
