  cozum: '**(a) Sınıflandırma (TFRS 5 par. 6-9, 13)**


    - **Makine A - sınıflandırılır (1.10.2026).** Yönetim planı onaylamış, alıcı bulmaya yönelik aktif program başlatmış,
    cari gerçeğe uygun değerle uyumlu fiyatla aktif olarak pazarlıyor; varlık mevcut durumunda hemen satılabilir, satışın
    bir yıl içinde tamamlanması bekleniyor ve planın iptal ihtimali düşük. Tüm koşullar 1.10.2026''da sağlanmıştır (par. 7,
    8).

    - **Boya hattı B - sınıflandırılmaz.** Kullanımdan çekilecek varlığın defter değeri esas olarak kullanımının devamıyla
    değil, satışla geri kazanılacaksa satış amaçlı sayılır; hurdaya ayrılacak varlık için bu söz konusu değildir (par. 13).
    Amortisman ayrılmaya devam eder.

    - **Arsa C - sınıflandırılmaz.** Satışın sınıflandırma tarihinden itibaren bir yıl içinde tamamlanmış satış olarak muhasebeleştirilmesi
    beklenmelidir; gecikme işletmenin kontrolü dışındaki bir olaydan kaynaklanmadığı için par. 9''daki istisna uygulanamaz
    (par. 8, 9).


    **(b) Makine A ölçümü**


    - Yıllık amortisman = 5.000.000 / 10 = 500.000 TL. 30.9.2026''ya kadar amortisman: 4 yıl x 500.000 + 9 ay (375.000) =
    2.375.000 TL; defter değeri = 5.000.000 - 2.375.000 = **2.625.000 TL** (sınıflandırma öncesi ölçüm, par. 18).

    - 1.10.2026: satış maliyetleri düşülmüş gerçeğe uygun değer = 2.400.000 - 100.000 = 2.300.000 TL. Düşük olan 2.300.000
    TL''dir (par. 15); değer düşüklüğü zararı = 2.625.000 - 2.300.000 = **325.000 TL** (par. 20) kâr veya zarara yansıtılır.
    Bundan sonra amortisman ayrılmaz (par. 25).

    - 31.12.2026: satış maliyetleri düşülmüş gerçeğe uygun değer = 2.650.000 - 100.000 = 2.550.000 TL; artış 250.000 TL, birikmiş
    değer düşüklüğü zararını (325.000 TL) aşmadığından tamamı **kazanç** olarak muhasebeleştirilir (par. 21). Defter değeri
    2.550.000 TL.

    - 31.3.2027: satış maliyetleri düşülmüş gerçeğe uygun değer = 3.000.000 - 100.000 = 2.900.000 TL; artış 350.000 TL''dir
    ancak kazanç, birikmiş değer düşüklüğü zararından henüz geri kazanılmamış kısımla sınırlıdır: 325.000 - 250.000 = **75.000
    TL** (par. 21). Defter değeri 2.550.000 + 75.000 = 2.625.000 TL (varlığın satış amaçlı sınıflandırılmasından önceki defter
    değerini aşamaz).


    **(c) Makine D - sınıflandırmanın sona ermesi (par. 26-28)**


    - Sınıflandırılmasından önceki defter değeri: 3.000.000 - 3,5 yıl x 300.000 = 1.950.000 TL. Satış amaçlı sınıflandırılmamış
    olsaydı 1.7.2026-31.3.2027 (9 ay) için ayrılacak amortisman 300.000 x 9/12 = 225.000 TL; düzeltilmiş tutar = 1.950.000
    - 225.000 = **1.725.000 TL** (par. 27(a)).

    - Geri kazanılabilir tutar (par. 27(b)) = 1.800.000 TL.

    - Ölçüm, ikisinden düşük olanla yapılır: **1.725.000 TL**.

    - Düzeltme = 1.725.000 - 1.700.000 (satış amaçlı defter değeri) = **25.000 TL**; sınıflandırma sona erdiği dönemde sürdürülen
    faaliyetlerden elde edilen kâr veya zarara kazanç olarak yansıtılır (par. 28). Makinenin amortismanına bu tarihten itibaren
    devam edilir.


    **(d) Net etki ve sunum**


    - 2026 K/Z etkisi: 1.1.-30.9.2026 amortismanı 375.000 + değer düşüklüğü zararı 325.000 - kazanç 250.000 = **450.000 TL
    net gider**.

    - Satış amaçlı sınıflandırılan duran varlık amortismana tabi tutulmaz (par. 25); 1.10.-31.12.2026 arası amortisman ayrılmaz.

    - Varlık, finansal durum tablosunda diğer varlıklardan ayrı gösterilir (par. 38). Yeniden ölçümden doğan kazanç ve kayıp,
    durdurulan faaliyet tanımına uymadığından sürdürülen faaliyetler kâr veya zararına dahil edilir (par. 37).

    '
