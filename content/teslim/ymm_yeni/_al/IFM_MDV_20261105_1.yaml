    doğrudur?


    I. Şerefiye dışındaki bir varlık için önceki dönemlerde muhasebeleştirilen değer düşüklüğü zararı, geri kazanılabilir
    tutarın belirlenmesinde kullanılan tahminlerde son zararın muhasebeleştirilmesinden bu yana değişiklik olması hâlinde
    iptal edilir.

    II. Şerefiyeye ilişkin olarak muhasebeleştirilen değer düşüklüğü zararı, daha sonraki bir dönemde iptal edilmez.

    III. Gelecekteki nakit girişlerinin bugünkü değeri zamanın ilerlemesiyle arttığından, kullanım değeri defter değerini
    aşar hâle gelen bir varlığın değer düşüklüğü zararı yalnızca bu nedenle iptal edilir.

    IV. Yeniden değerlenmiş bir varlığa ilişkin değer düşüklüğü zararının iptali diğer kapsamlı gelirde muhasebeleştirilir
    ve yeniden değerleme fazlasını artırır; ancak aynı varlık için daha önce kâr veya zararda muhasebeleştirilen zarara isabet
    eden kısım kâr veya zarara yansıtılır.

    V. Nakit yaratan bir birime ilişkin iptal edilen değer düşüklüğü zararı, birime dağıtılmış şerefiye dahil olmak üzere
    birimin tüm varlıklarına defter değerleri oranında dağıtılır.

    '
  secenekler:
    A: I ve III
    B: II, III ve V
    C: I, IV ve V
    D: I, II ve IV
    E: I, II, IV ve V
  dogru: D
  aciklama:
    dogru_neden: 'I doğrudur: iptal, geri kazanılabilir tutarı belirleyen tahminlerde değişiklik olması hâlinde yapılır (TMS
      36 par. 114). II doğrudur: şerefiye zararı iptal edilmez (par. 124). IV doğrudur: yeniden değerlenmiş varlıkta iptal
      diğer kapsamlı gelirde muhasebeleştirilir, daha önce kâr veya zarara yansıtılan zarara isabet eden kısım ise kâr veya
      zarara yansıtılır (par. 120). III yanlıştır: zamanın ilerlemesi (iskontonun çözülmesi) nedeniyle iptal yapılmaz (par.
      116). V yanlıştır: nakit yaratan birimde iptal, şerefiye hariç varlıklara dağıtılır (par. 122). Doğru ifadeler I, II
      ve IV''tür. Püf noktaları: (1) Şerefiye, hem iptal hem de dağıtım bakımından istisnadır. (2) Zamanın geçmesi hizmet
      potansiyelini artırmaz; iptal için tahminlerde gerçek bir değişiklik aranır. (3) Yeniden değerlenmiş varlıkta iptalin
      bir kısmı kâr veya zarara gidebilir.'
    celdiriciler:
      A: III numaralı ifade yanlıştır (par. 116); ayrıca II ve IV de doğru olduğundan seçenek eksiktir.
      B: III ve V yanlış ifadelerdir; II tek başına doğru olmakla birlikte seçenek yanlış ifadeleri içermektedir.
      C: V numaralı ifade yanlıştır; iptal şerefiyeye dağıtılmaz (par. 122, 124). II de doğru olduğundan seçenek eksiktir.
      E: I, II ve IV doğru olmakla birlikte V yanlıştır; şerefiye hariç tutularak dağıtım yapılır.
  kaynaklar:
  - mevzuat: TMS 36 Varlıklarda Değer Düşüklüğü
    madde: par. 114
    alinti: Şerefiye haricinde, bir varlık için önceki dönemlerde muhasebeleştirilen bir değer düşüklüğü zararı, sadece ve
      sadece, anılan varlığın geri kazanılabilir tutarının belirlenmesinde kullanılan tahminlerde, son değer düşüklüğü zararının
