    gerekçeleriyle belirtiniz. (7 puan)


    (b) Makine A''nın 30.9.2026, 31.12.2026 ve 31.3.2027 tarihlerindeki ölçümünü ve kâr veya zarara etkilerini gösteriniz.
    (8 puan)


    (c) Makine D''nin 31.3.2027''de sınıflandırılmasına son verilmesi nedeniyle ölçümünü ve yapılacak düzeltmeyi hesaplayınız.
