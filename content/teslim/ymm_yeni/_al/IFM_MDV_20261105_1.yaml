    alinti: Alınan varlığın nakit akışlarının niteliğinin (riski, zamanlaması ve tutarı) verilen varlığın nakit akışlarının
      niteliğinden farklı olması veya
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 29
    alinti: İşletmenin alınan veya verilen varlıkların gerçeğe uygun değerlerini güvenilir bir şekilde ölçebilmesi durumunda,
      edinilen varlığın gerçeğe uygun değeri daha açık olarak belli olmadıkça, maliyet bedelinin ölçümünde, verilen varlığın
      gerçeğe uygun değeri kullanılır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 68
    alinti: Bir maddi duran varlık kaleminin finansal tablo dışı bırakılmasından kaynaklanan kazanç veya kayıp ilgili kalem
      finansal tablo dışı bırakıldığında (TFRS 16 Kiralamalar satış ve geri kiralama işlemi için aksini gerektirmedikçe) kâr
      veya zarara yansıtılır.
