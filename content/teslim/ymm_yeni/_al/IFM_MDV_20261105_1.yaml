    kira geliri elde etmek amacıyla elde tutacağı bir arsa ile takas etmiştir. Alınan arsanın nakit akışlarının riski, zamanlaması
    ve tutarı verilen makinenin nakit akışlarından farklıdır ve bu fark, takas edilen varlıkların gerçeğe uygun değerine göre
    önemlidir. Makinenin gerçeğe uygun değeri güvenilir biçimde 2.000.000 TL olarak ölçülmüştür; arsanın gerçeğe uygun değerinin
    bundan daha açık olarak belli olduğuna dair bir kanıt yoktur ve taraflar arasında nakit ödemesi yapılmamıştır. Buna göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Arsa 1.500.000 TL maliyetle kaydedilir; takas nedeniyle kâr veya zarar oluşmaz.
    B: Arsa 2.000.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç kâr veya zarara yansıtılır.
    C: Arsa 2.000.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç diğer kapsamlı gelirde muhasebeleştirilir.
    D: Arsa 2.500.000 TL maliyetle kaydedilir; 1.000.000 TL tutarındaki kazanç kâr veya zarara yansıtılır.
    E: Arsa 1.500.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç ertelenir ve arsa elden çıkarıldığında gelir
      yazılır.
  dogru: B
  aciklama:
    dogru_neden: 'Takas işleminin ticari özü vardır (alınan varlığın nakit akışlarının niteliğinin verilenden farklı olması
      ve farkın önemli olması) ve verilen varlığın gerçeğe uygun değeri güvenilir biçimde ölçülebilmektedir. Bu durumda edinilen
      yatırım amaçlı gayrimenkulün maliyeti, edinilen varlığın gerçeğe uygun değeri daha açık olarak belli olmadıkça verilen
      varlığın gerçeğe uygun değeri ile ölçülür (TMS 40 par. 27-29): 2.000.000 TL. Verilen makinenin finansal tablo dışı bırakılmasından
      doğan kazanç (2.000.000 - 1.500.000 = 500.000 TL) kâr veya zarara yansıtılır (TMS 16 par. 68, 71).'
    celdiriciler:
      A: Maliyetin verilen varlığın defter değeriyle ölçülmesi yalnızca takasın ticari özünün bulunmaması veya gerçeğe uygun
        değerlerin güvenilir ölçülememesi hâlinde söz konusudur.
      C: Finansal tablo dışı bırakma kazancı kâr veya zarara yansıtılır; diğer kapsamlı gelirde muhasebeleştirilemez.
      D: Makinenin tarihî maliyeti (2.500.000 TL) esas alınamaz; ne maliyet ne de kazanç bu tutardan hesaplanır.
      E: Finansal tablo dışı bırakma kazancı elden çıkarma döneminde kâr veya zarara yansıtılır; ertelenmesine ilişkin bir
        hüküm yoktur.
    hesap_adimlari:
    - Maliyet = verilen makinenin gerçeğe uygun değeri = 2.000.000
    - Kazanç = 2.000.000 - 1.500.000 = 500.000 (kâr veya zarar)
