  kazanim: varlıklara ilişkin devlet teşvikinin geri ödenmesi
  tip: hesaplama
  zorluk: 3
  kok: (Ü) AŞ, 1.1.2026'da 10.000.000 TL'ye satın aldığı bir makine için, makinenin satın alınmasını koşul kılan 2.000.000
    TL tutarında devlet teşviki almıştır. Şirket teşviki, TMS 20'de izin verilen yöntemlerden biri olan varlığın defter değerinden
    indirilmesi yöntemiyle muhasebeleştirmiştir. Makinenin yararlı ömrü 10 yıl, kalıntı değeri sıfırdır ve doğrusal amortisman
    uygulanmaktadır. Şirket, teşvik koşullarını yerine getirememesi nedeniyle 31.12.2027'de teşvikin tamamını geri ödemek
    zorunda kalmıştır; 2027 yılı amortismanı ayrılmıştır ve makinede başka bir değer düşüklüğü belirtisi bulunmamaktadır.
    Geri ödemenin TMS 20 uyarınca 2027 yılı kâr veya zararına yansıyacak tutarı kaç TL'dir?
  secenekler:
    A: '0'
    B: '400.000'
    C: '800.000'
    D: 1.600.000
    E: 2.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Varlıklara ilişkin devlet teşvikinin geri ödenmesinde, teşvik varlığın defter değerinden indirilmişse varlığın
      defter değeri geri ödenecek tutar kadar artırılır; teşvik alınmamış olsaydı önceki dönemlerde kâr veya zararda muhasebeleştirilmiş
      olacak birikmiş amortisman tutarı ise geri ödemeyle birlikte o anda kâr veya zararda muhasebeleştirilir (TMS 20 par.
      32). Teşviksiz yıllık amortisman 10.000.000 / 10 = 1.000.000; teşvikli yıllık amortisman 8.000.000 / 10 = 800.000; yıllık
      fark 200.000, iki yılda (2026-2027) 400.000 TL''dir. Böylece defter değeri 6.400.000 + 2.000.000 - 400.000 = 8.000.000
      TL olur ve teşvik hiç alınmamış olsaydı ulaşılacak değere (10.000.000 - 2 x 1.000.000) eşitlenir. Püf noktaları: (1)
      Geri ödenen 2.000.000 TL''nin tamamı gider değildir; büyük kısmı defter değerini artırır. (2) Yalnızca 2026 değil, iki
      yılın amortisman farkı birlikte alınır. (3) Fark, ödenen teşvik tutarına değil, teşvik nedeniyle düşük kalan amortismana
      bağlıdır.'
    celdiriciler:
      A: Defter değeri artırılıp kalan ömür boyunca amortismana devam edildiği düşünülmüştür; oysa birikmiş amortisman farkı
        o anda kâr veya zarara yansıtılır.
      C: Teşvikli yıllık amortisman tutarı (800.000 TL) esas alınmıştır; kâr veya zarara yansıyan, teşvik nedeniyle düşük
        kalan amortisman farkıdır (iki yılda 400.000 TL).
      D: Geri ödemenin amortisman farkı dışındaki kısmı (2.000.000 - 400.000) gider yazılmıştır; bu kısım defter değerine
        eklenir.
      E: Geri ödemenin tamamı gider yazılmıştır; varlığa ilişkin teşvik geri ödenince defter değeri artırılır.
    hesap_adimlari:
    - 'Teşviksiz yıllık amortisman: 10.000.000 / 10 = 1.000.000'
    - 'Teşvikli yıllık amortisman: (10.000.000 - 2.000.000) / 10 = 800.000'
    - 'İki yıllık fark: 2 x (1.000.000 - 800.000) = 400.000'
  kaynaklar:
