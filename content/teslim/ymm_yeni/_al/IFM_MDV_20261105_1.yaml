  konu: MDV
  kazanimlar:
  - özellikli varlık ve borçlanma maliyetlerinin aktifleştirilmesi
  - aktifleştirmenin başlaması, ara verilmesi ve sona ermesi
  - genel amaçlı borçlar için aktifleştirme oranı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Marmara Enerji AŞ''nin hesap dönemi takvim yılıdır. Şirket, kullanıma hazır hale getirilmesi uzun bir süre gerektiren
    bir güneş enerjisi santrali (GES) inşa etmektedir; santral TMS 23 anlamında özellikli varlıktır.


    - Şirket, yalnızca bu yatırımı finanse etmek üzere 1.1.2026''da 12.000.000 TL tutarında banka kredisi kullanmıştır. Kredinin
    faizi yıllık %12''dir (aylık 120.000 TL; her ay sonunda gider olarak kaydedilmiştir). Krediden henüz harcanmamış tutarlar,
    banka mevduatında yıllık %6 faizle (aylık %0,5) değerlendirilmiş ve mevduat faizi her ay sonunda gelir yazılmıştır.

    - Şirketin ayrıca santralle doğrudan ilişkisi bulunmayan, yıl boyunca ödenmemiş iki genel amaçlı kredisi vardır: Kredi
    X 8.000.000 TL (yıllık %9) ve Kredi Y 12.000.000 TL (yıllık %12).


    Santrale ilişkin gelişmeler:


    | Tarih | Olay |

    |---|---|

    | 1.1.-28.2.2026 | Ruhsat ve izin başvuruları yürütülmüş; bu dönemde santral için herhangi bir harcama yapılmamıştır.
    |

    | 1.3.2026 | Arazi hazırlığı ve temel işleri başlamış; ilk harcama (4.000.000 TL) yapılmıştır. |

    | 1.5.2026 | 3.000.000 TL harcama yapılmıştır. |

    | 1.7.-30.9.2026 | Arazinin mülkiyetine ilişkin dava nedeniyle şantiyede hiçbir inşaat, teknik veya idari çalışma yapılmamıştır.
    |

    | 1.10.2026 | Çalışmalar yeniden başlamış; 5.000.000 TL harcama yapılmıştır (özel kredinin kalan tutarı kullanılmıştır).
    |

    | 1.11.2026 | 3.000.000 TL harcama yapılmış; bu harcama özel krediden değil, genel amaçlı borçlardan karşılanmıştır. |

    | 30.11.2026 | Santralin fiziken inşası tamamlanmış ve kullanıma hazır hale gelmiştir. Aralık ayında yalnızca müşterinin
    talebi doğrultusunda küçük çevre düzenleme işleri yapılmıştır. |


    Basitleştirici varsayım: Genel amaçlı borçlar için bulunacak aktifleştirme oranı yalnızca 1.11.2026 tarihli harcamaya
    bir ay süreyle uygulanacaktır; özel kredinin aktifleştirilen faizi için ayrıca genel borç kullanılmamıştır. Ertelenmiş
    vergi dikkate alınmayacaktır.


    **İstenenler**


    (a) Borçlanma maliyeti aktifleştirmesinin başlama ve bitiş tarihlerini, aktifleştirmeye ara verilen dönemi ve Ocak-Şubat
    ile Aralık aylarının faizinin neden aktifleştirilmediğini gerekçeleriyle belirtiniz. (6 puan)


    (b) Özel krediye ilişkin 2026 yılında aktifleştirilecek borçlanma maliyetini, aylık bir tablo kurarak hesaplayınız. (8
    puan)


    (c) Genel amaçlı borçlar için aktifleştirme oranını ve 1.11.2026 harcamasına ilişkin aktifleştirilecek tutarı hesaplayınız;
    santralin 30.11.2026''daki toplam maliyetini bulunuz. (6 puan)


    (d) Özel kredi ve mevduat ile ilgili olarak 2026 yılı kâr veya zararına yansıyacak faiz gideri, faiz geliri ve net tutarı
    hesaplayınız; aktifleştirme yevmiye kaydını yapınız ve TMS 23''e göre yapılacak açıklamaları belirtiniz. (5 puan)

    '
  cozum: '**(a) Başlama, ara verme ve bitiş**


    - Aktifleştirmenin başlaması için (i) varlık için harcama yapılması, (ii) borçlanma maliyetinin oluşması ve (iii) varlığı
    kullanıma hazırlamak için gerekli işlemlere başlanması koşullarının tümü sağlanmalıdır (par. 17). Kredi 1.1.2026''da kullanılmış
    olsa da Ocak-Şubat''ta varlık için harcama yapılmamıştır; üç koşul birlikte **1.3.2026**''da sağlanmıştır. Ocak-Şubat
    faizi (240.000 TL) gider yazılır.

    - **1.7.-30.9.2026** döneminde hiçbir inşaat, teknik veya idari çalışma yapılmadığından uzun süreli bir ara vardır; bu
    dönemin faizi (360.000 TL) aktifleştirilemez, gider yazılır (par. 20, 21).

    - Fiziki inşa tamamlandığında varlık kullanıma hazır sayılır; olağan idari işlemler veya müşteri talebine göre küçük işlerin
    sürmesi tamamlanmamış anlamına gelmez (par. 22, 23). Aktifleştirme **30.11.2026**''da sona erer; Aralık faizi (120.000
    TL) gider yazılır.

    - Aktifleştirilen dönemler: Mart-Haziran (4 ay) ve Ekim-Kasım (2 ay).


    **(b) Özel kredi - aylık tablo (par. 12, 13)**


    Harcanmayan fon: Mart-Nisan 8.000.000 TL; Mayıs-Eylül 5.000.000 TL; Ekim sonrası 0.


    | Ay | Kredi faizi | Mevduat geliri | Aktifleştirme | Aktifleştirilen (net) |

    |---|---|---|---|---|

    | Ocak | 120.000 | 60.000 | Hayır | - |

    | Şubat | 120.000 | 60.000 | Hayır | - |

    | Mart | 120.000 | 40.000 | Evet | 80.000 |

    | Nisan | 120.000 | 40.000 | Evet | 80.000 |

    | Mayıs | 120.000 | 25.000 | Evet | 95.000 |

    | Haziran | 120.000 | 25.000 | Evet | 95.000 |

    | Temmuz-Eylül | 360.000 | 75.000 | Hayır (ara) | - |

    | Ekim | 120.000 | 0 | Evet | 120.000 |

    | Kasım | 120.000 | 0 | Evet | 120.000 |

    | Aralık | 120.000 | 0 | Hayır | - |


    Aktifleştirme dönemindeki faiz 720.000 TL''den mevduat geliri 130.000 TL düşülür: **590.000 TL**.


    **(c) Genel borçlar ve toplam maliyet (par. 14)**


    - Özel kredi, santral tamamlanıncaya kadar ortalamanın dışında bırakılır. Aktifleştirme oranı = (8.000.000 x %9 + 12.000.000
    x %12) / (8.000.000 + 12.000.000) = 2.160.000 / 20.000.000 = **%10,8**.

    - Kasım harcaması için aktifleştirilecek tutar = 3.000.000 x %10,8 x 1/12 = **27.000 TL**; dönemde katlanılan genel borç
    faizini (2.160.000 TL) aşmaz.

    - Toplam maliyet = 4.000.000 + 3.000.000 + 5.000.000 + 3.000.000 (harcamalar 15.000.000) + 590.000 + 27.000 = **15.617.000
    TL**.


    **(d) Kâr veya zarar etkisi ve kayıt**


    - Özel kredi faiz gideri (K/Z) = Ocak-Şubat 240.000 + Temmuz-Eylül 360.000 + Aralık 120.000 = **720.000 TL** (toplam faiz
    1.440.000 - aktifleştirilen 720.000).

    - Mevduat faiz geliri (K/Z) = Ocak-Şubat 120.000 + Temmuz-Eylül 75.000 = **195.000 TL** (toplam 325.000 - aktifleştirme
    döneminde düşülen 130.000).

    - Net finansman gideri = 720.000 - 195.000 = **525.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | 258 Yapılmakta Olan Yatırımlar | 617.000 | |

    | 642 Faiz Gelirleri | 130.000 | |

    | 780 Finansman Giderleri | | 747.000 |


    (747.000 = 720.000 özel kredi faizi + 27.000 genel borç faizi; 617.000 = 590.000 + 27.000.)


    - Açıklama (par. 26): dönem boyunca aktifleştirilen borçlanma maliyeti tutarı (617.000 TL) ve aktifleştirme oranı (%10,8)
    açıklanır.

    '
