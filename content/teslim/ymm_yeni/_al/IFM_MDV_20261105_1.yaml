    dikkate alınmayacaktır; ertelenmiş vergi hesaplanmayacaktır.


    **1. Merkez ofis binası.** Bina, 1.1.2020''de 9.000.000 TL maliyetle iktisap edilmiş ve kullanıma alınmıştır (yararlı
    ömür 30 yıl, kalıntı değer sıfır, doğrusal amortisman). 31.12.2024''te yapılan değer düşüklüğü testinde geri kazanılabilir
    tutar 6.000.000 TL bulunmuş ve fark zarara yazılmıştır; bina bu tarihten sonra 25 yıllık kalan yararlı ömür üzerinden
    amortismana tabi tutulmuştur. Yönetim kurulu, merkezin taşınması ve binanın kiraya verilmesi kararını 15.2.2026''da almıştır.
    Bina 31.3.2026''da tamamen boşaltılmış ve kiralanmak üzere piyasaya sunulmuştur; kira sözleşmesi 20.5.2026''da imzalanmıştır.
    Binanın gerçeğe uygun değeri 31.3.2026''da 7.600.000 TL, 31.12.2026''da 7.900.000 TL''dir.


    **2. Konutlar.** Satılmak üzere elde tutulan ve stok olarak izlenen dört dairenin maliyeti 4.000.000 TL''dir. Şirket,
    daireleri satmaktan vazgeçerek 1.7.2026''da bir kiracıyla faaliyet kiralaması sözleşmesi başlatmıştır. Dairelerin toplam
    gerçeğe uygun değeri 1.7.2026''da 4.600.000 TL, 31.12.2026''da 4.700.000 TL''dir.


    **3. Ticari bina.** Daha önce kiraya verilen ve YAG olarak izlenen binanın gerçeğe uygun değeri 31.12.2025''te 5.800.000
    TL''dir. Şirket, binayı 1.10.2026''da kendi idari faaliyetlerinde kullanmaya başlamıştır; gerçeğe uygun değeri bu tarihte
    6.000.000 TL''dir. Binanın kalan yararlı ömrü 20 yıl, kalıntı değeri sıfırdır; doğrusal amortisman uygulanacaktır.


    **İstenenler**


    (a) 1 numaralı bina bakımından kullanım değişikliğinin tarihini gerekçesiyle belirleyiniz; 31.3.2026 tarihindeki defter
    değerini ve değer düşüklüğü hiç ayrılmamış olsaydı ulaşacağı defter değerini hesaplayınız; gerçeğe uygun değer farkının
