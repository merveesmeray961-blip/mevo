  - olcut: (c) Kalem bazında NRV karşılaştırması; yalnız X için 30.000 TL indirgeme ve toplam 620.000 TL
    puan: 4
  - olcut: (c) Değer düşüklüğü yevmiye kaydı
    puan: 3
  - olcut: (d) İptal tutarının daha önce indirgenen tutarla sınırlı olarak 30.000 TL bulunması
