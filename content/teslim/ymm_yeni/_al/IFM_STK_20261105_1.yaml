  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 25
    alinti: 23'üncü paragrafta belirtilenler dışında kalan stokların maliyeti, ilk giren ilk çıkar (FIFO) veya ağırlıklı ortalama
      maliyet yöntemi kullanılarak belirlenir. Benzer niteliklere ve işletme açısından benzer kullanıma sahip bütün stoklar
      için, aynı maliyet hesaplama yöntemi kullanılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 22
    alinti: Bu yöntemde stokların maliyeti, stokların satış değerinden, uygun bir brüt kâr marjı yüzdesi çıkarılarak belirlenir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 31
    alinti: Söz konusu satış sözleşmelerinde belirtilen miktarın elde tutulan stok miktarından daha az olması durumunda, fazla
      olan kısmın net gerçekleşebilir değeri, genel satış fiyatına göre belirlenir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 33
    alinti: indirgenen tutar iptal edilir (diğer bir ifadeyle iptal edilen tutar, daha önce indirgenen tutarla sınırlıdır).
      Böylece stokun yeni defter değeri, maliyet değeri ile revize edilmiş net gerçekleşebilir değerinden düşük olanı olur.
  dogrulama:
    python: 'adet = 1000; tutar = 8000000

      adet += 3000; tutar += 27000000

      o1 = tutar / adet

      m1 = 2500 * o1; adet -= 2500; tutar -= m1

      adet += 1500; tutar += 15375000

      o2 = tutar / adet

      m2 = 2000 * o2; adet -= 2000; tutar -= m2

      smm_ort = m1 + m2

      fifo1 = 1000*8000 + (2500-1000)*9000

      kal = 3000 - (2500-1000)

      fifo2 = kal*9000 + (2000-kal)*10250

      smm_fifo = fifo1 + fifo2

      son_fifo = (1500 - (2000-kal))*10250

      n_s = 9800 - 300

      n_g = 9000 - 300

      dus = max(0, o2 - n_s)*600 + max(0, o2 - n_g)*(adet - 600)

      dus_g = max(0, o2 - n_g)*(adet - 600)

      perakende = 3200000*(1-0.3)

      yeni = (adet - 600)*min(o2, 10000-300)

      ters = yeni - ((adet - 600)*o2 - dus_g)

      sonuc = {''smm_ort'': smm_ort, ''son_ort'': tutar, ''smm_fifo'': smm_fifo, ''son_fifo'': son_fifo, ''dus'': dus, ''defter'':
