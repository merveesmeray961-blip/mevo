    | Ertelenmiş Gelir | 360.000 | |

    | Hibe iadesi gideri (kâr veya zarar) | 120.000 | |

    | Bankalar | | 480.000 |


    *Defter değerinden indirme yöntemi:* traktörün defter değeri iade tutarı kadar artırılır: Dr Traktör 480.000 / Cr Bankalar
    480.000; teşvik alınmasaydı önceki dönemlerde yazılacak ek amortisman 480.000 / 8 × 2 = 120.000 TL hemen gider yazılır:
    Dr Amortisman gideri 120.000 / Cr Birikmiş amortisman 120.000.


    2028 kâr veya zararına etki: iki yöntemde de **120.000 TL** gider (cari yıl amortisman/ gelir etkileri ayrıca). Traktörün
    defter değeri iade sonrası iki yöntemde de aynıdır (1.440.000 + 480.000 − 120.000 = 1.800.000 TL).

