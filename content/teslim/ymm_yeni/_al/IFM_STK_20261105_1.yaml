  kok: 'Dayanıklı tüketim malları ticareti yapan Kuzey Ticaret AŞ''nin 31.12.2026 itibarıyla stokunda maliyeti 800 TL/adet
    olan 1.000 adet ürün bulunmaktadır. Şirket, bu ürünlerden 600 adedini 700 TL/adet fiyatla satmak üzere bir müşteriyle
    kesin ve iptal edilemez bir sözleşme yapmış ve stoktan bu miktarı sözleşmeye ayırmıştır. Ürünün yıl sonundaki genel satış
    fiyatı 750 TL/adet''tir. Her iki satışta da adet başına 50 TL satış maliyeti katlanılacaktır. Stok kalemleri tek bir ürün
    türünden oluşmaktadır ve yıl içinde başka değer düşüklüğü ayrılmamıştır.


    TMS 2''ye göre şirketin 31.12.2026''da stoklar için muhasebeleştireceği değer düşüklüğü gideri kaç TL''dir?'
  secenekler:
    A: '40.000'
    B: '90.000'
    C: '100.000'
    D: '130.000'
    E: '150.000'
  dogru: D
  aciklama:
    dogru_neden: 'TMS 2 par. 9''a göre stoklar maliyet ile NRV''nin düşüğü üzerinden ölçülür. Kesin satış sözleşmesinin ifası
      için elde tutulan stoklarda NRV sözleşme fiyatına göre belirlenir; sözleşme miktarı elde tutulan stoktan az olduğundan
      fazla kalan kısmın NRV''si genel satış fiyatına göre belirlenir (par. 31). Sözleşmeli kısım: NRV = 700 − 50 = 650 TL,
      değer düşüklüğü 600 × (800 − 650) = 90.000 TL. Kalan kısım: NRV = 750 − 50 = 700 TL, değer düşüklüğü 400 × (800 − 700)
      = 40.000 TL. Toplam 130.000 TL.


      Püf noktaları: Tüm stoka tek bir fiyat uygulamayın; sözleşme fiyatı yalnız sözleşme miktarı için geçerlidir. NRV''yi
      bulurken satış maliyetini her iki gruptan da düşmeyi unutmayın. Şıklardaki 40.000, 90.000 ve 100.000 tutarları işlemin
      yarım veya hatalı sonuçlarıdır.'
    celdiriciler:
      A: Yalnızca sözleşme dışı 400 adedin değer düşüklüğü alınmıştır; sözleşmeli 600 adedin NRV'si (650 TL) de maliyetin
        altındadır.
      B: Yalnızca sözleşmeli 600 adedin değer düşüklüğü alınmıştır; kalan 400 adedin NRV'si (700 TL) de maliyetin altındadır.
      C: 'Tüm 1.000 adet için genel satış fiyatı (NRV 700 TL) kullanılmıştır: 1.000 × 100. Sözleşmeli kısımda sözleşme fiyatı
        esas alınmalıdır.'
      E: 'Tüm 1.000 adet için sözleşme fiyatı (NRV 650 TL) kullanılmıştır: 1.000 × 150. Sözleşme fiyatı yalnız sözleşme kapsamındaki
        600 adet için geçerlidir.'
    hesap_adimlari:
    - 'Sözleşmeli 600 adet: NRV = 700 − 50 = 650; düşüklük = 600 × (800 − 650) = 90.000'
    - 'Kalan 400 adet: NRV = 750 − 50 = 700; düşüklük = 400 × (800 − 700) = 40.000'
    - Toplam = 90.000 + 40.000 = 130.000 TL
  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 31
    alinti: Net gerçekleşebilir değerin tahmini yapılırken ayrıca, stokların elde tutulma amacı da dikkate alınır. Örneğin,
      kesin satış veya hizmet sözleşmelerinin ifası için elde tutulan stokların net gerçekleşebilir değeri belirlenirken,
      sözleşme fiyatı esas alınır. Söz konusu satış sözleşmelerinde belirtilen miktarın elde tutulan stok miktarından daha
      az olması durumunda, fazla olan kısmın net gerçekleşebilir değeri, genel satış fiyatına göre belirlenir.
  - mevzuat: TMS 2 Stoklar
    madde: par. 9
    alinti: Stoklar, maliyet değeri ile net gerçekleşebilir değerin düşük olanı üzerinden ölçülür.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'adet=1000; maliyet=800; soz=600

      nrv_soz=700-50

      nrv_gen=750-50

      sonuc = soz*max(0,maliyet-nrv_soz) + (adet-soz)*max(0,maliyet-nrv_gen)'
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Stoklar, canlı varlıklar ve devlet teşvikleri
  konu: STK
  kazanim: amortismana tabi olmayan varlığa ilişkin devlet teşviki (arsa) ve kâr veya zarara yansıtma
  tip: hesaplama
  zorluk: 3
  kok: 'Yıldırım Gıda AŞ''ye bir organize sanayi bölgesi idaresi tarafından 2.1.2026''da, üzerine fabrika binası inşa edilmesi
    koşuluyla bir arsa tahsis edilmiştir. Arsanın tahsis tarihindeki gerçeğe uygun değeri 6.000.000 TL''dir; şirket arsayı
    ve teşvikini TMS 20''nin genel yaklaşımına göre gerçeğe uygun değerle kaydetmiş, teşviki ertelenmiş gelir olarak sunmuştur.
    Bina inşa edilmiş ve 1.4.2026''da kullanıma hazır hâle gelmiştir; binanın faydalı ömrü 25 yıl olup doğrusal amortismana
    tabidir. Teşvikin koşulları yerine getirilmiş ve iade yükümlülüğü doğmamıştır. Arsa amortismana tabi tutulmaz.


    Buna göre şirketin 2026 yılı kâr veya zararına yansıyacak devlet teşviki geliri kaç TL''dir?'
  secenekler:
    A: '0'
    B: '180.000'
    C: '240.000'
    D: 5.820.000
    E: 6.000.000
  dogru: B
  aciklama:
    dogru_neden: 'Parasal olmayan teşvik (arsa) gerçeğe uygun değerle kaydedilir (TMS 20 par. 23). Amortismana tabi olmayan
      varlığa ilişkin teşvikler, ilgili yükümlülüklerin yerine getirilmesinde katlanılan maliyetlerin gerçekleştiği dönemler
      boyunca kâr veya zarara alınır; üzerine bina inşa edilmesi koşuluyla verilen arsa teşviki binanın ömrü boyunca muhasebeleştirilir
      (par. 18). Bina 1.4.2026''dan itibaren amortismana başladığından 2026''da 9 ay için gelir yazılır: 6.000.000 / 25 ×
      9/12 = 180.000 TL.


      Püf noktaları: Arsanın kendisi amortismana tabi olmasa da teşvik, bina ömrü boyunca dağıtılır. Dağıtım, binanın kullanıma
      hazır olduğu tarihte (1.4.2026) başlar; tahsis tarihi (2.1.2026) değildir. Ertelenmiş gelir bakiyesi (5.820.000 TL)
      ile yıl içinde gelire alınan tutarı karıştırmayın.'
    celdiriciler:
      A: Arsa amortismana tabi olmadığı için hiç gelir yazılmayacağı düşünülmüştür; oysa teşvik binanın ömrü boyunca kâr veya
        zarara alınır (par. 18).
      C: '6.000.000 / 25: tam yıl için gelir alınmıştır; bina 1.4.2026''da kullanıma hazır olduğundan 2026''da yalnız 9 ay
        söz konusudur.'
      D: 31.12.2026 itibarıyla ertelenmiş gelir bakiyesidir (6.000.000 − 180.000); soru yıl içinde kâr veya zarara yansıyan
        tutarı sormaktadır.
      E: Teşvikin tamamı tahsis tarihinde gelir yazılmıştır; bu yaklaşım tahakkuk esasına uygun değildir (par. 16, 18).
    hesap_adimlari:
    - Teşvik tutarı = 6.000.000 TL; bina ömrü 25 yıl
    - Yıllık gelir = 6.000.000 / 25 = 240.000 TL
    - 2026 (1.4-31.12 = 9 ay) = 240.000 × 9/12 = 180.000 TL
  kaynaklar:
  - mevzuat: TMS 20 Devlet Teşviklerinin Muhasebeleştirilmesi ve Devlet Yardımlarının Açıklanması
    madde: par. 18
    alinti: Örneğin, üzerine bina inşa edilmesi koşuluyla alınan bir arsa teşvikinin, binanın ömrü boyunca kâr ya da zararda
      muhasebeleştirilmesi uygun olacaktır.
  - mevzuat: TMS 20 Devlet Teşviklerinin Muhasebeleştirilmesi ve Devlet Yardımlarının Açıklanması
    madde: par. 23
    alinti: teşvik konusu parasal olmayan varlığın gerçeğe uygun değerinin belirlenmesi ve teşvikin ve varlığın belirlenen
      gerçeğe uygun değer ile finansal tablolara kaydedilmesi genel uygulamadır.
