  kaynaklar:
  - mevzuat: TMS 2 Stoklar
    madde: par. 13
    alinti: Her bir üretim birimine dağıtılan sabit genel gider miktarı, düşük üretim düzeyi veya atıl kapasite nedeniyle
      arttırılmaz. Dağıtılmayan genel giderler, gerçekleştiği dönemde gider olarak finansal tablolara yansıtılır.
  - mevzuat: TMS 2 Stoklar
    madde: par. 14
    alinti: Yan ürünlerin çoğu, yapıları gereği önemsizdir. Böyle bir durumda, yan ürünler genellikle net gerçekleşebilir
      değer üzerinden ölçülür ve bu değer ana ürünün maliyetinden düşülür.
  - mevzuat: TMS 2 Stoklar
    madde: par. 16(a), (b), (c)
    alinti: Normalin üstünde gerçekleşen; hammadde fire ve kayıpları, işçilik ve diğer üretim maliyetleri, (b) Üretim sürecinde
      bir sonraki üretim aşamasından önce gerekli olanlar dışında kalan depolama maliyetleri, (c) Stokların mevcut konumuna
      ve durumuna getirilmesinde katkısı olmayan genel yönetim giderleri, (d) Satış maliyetleri.
  - mevzuat: TMS 2 Stoklar
    madde: par. 33
    alinti: indirgenen tutar iptal edilir (diğer bir ifadeyle iptal edilen tutar, daha önce indirgenen tutarla sınırlıdır).
      Böylece stokun yeni defter değeri, maliyet değeri ile revize edilmiş net gerçekleşebilir değerinden düşük olanı olur.
  dogrulama:
    python: 'nk, fiili = 10000, 9000

      sguc_d = 1000000 * fiili / nk

      havuz = (1800000 - 60000) + (900000 - 40000) + 600000 + sguc_d - 100000

      swx, swy = 5000 * 360, 4000 * 450

      cx = havuz * swx / (swx + swy)

      cy = havuz * swy / (swx + swy)

      ux, uy = cx / 5000, cy / 4000

      gider = 60000 + 40000 + (1000000 - sguc_d) + 50000 + 300000

      dx = max(0, (1000 * (ux - (380 - 10))))

      dy = max(0, (500 * (uy - (560 - 20))))

      stok = 1000 * ux + 500 * uy - dx - dy

      yeni = 1000 * min(ux, 425 - 10)

      ters = yeni - (1000 * ux - dx)

      sonuc = {''havuz'': havuz, ''gider'': gider, ''cx'': cx, ''cy'': cy, ''ux'': ux, ''uy'': uy, ''dx'': dx, ''dy'': dy,
      ''stok'': stok, ''ters'': ters}'
