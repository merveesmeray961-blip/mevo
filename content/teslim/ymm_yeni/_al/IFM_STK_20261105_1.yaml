  kazanimlar:
  - stok maliyet hesaplama yöntemleri (FIFO, ağırlıklı ortalama) ve maliyet ölçüm teknikleri (perakende yöntemi)
  - net gerçekleşebilir değer (kesin satış sözleşmesi) ve indirgemenin iptali
  zorluk: 3
