  soru: '**Veriler**


    Alfa Makine AŞ, yalnızca bir üretim makinesinin alımında kullanılmak üzere bir kamu kalkınma fonundan 1.440.000 TL tutarında
    faizsiz kredi almıştır. Kredi 1.1.2026''da nakden tahsil edilmiş, anapara 31.12.2027''de tek seferde ve nakden geri ödenecektir.
    Aynı gün makine 3.000.000 TL bedelle peşin satın alınmış ve kullanıma hazır hâle gelmiştir. Makinenin faydalı ömrü 10
    yıl olup doğrusal amortismana tabidir, kalıntı değeri yoktur.


    Benzer vadeli, devlet desteği içermeyen kredilerin yıllık piyasa faiz oranı %20''dir (yıllık bileşik; faiz ödemesi vade
    sonundadır). Kredinin faydası, makinenin amortismanıyla karşılanması planlanan maliyetlerle ilişkilidir. Şirket, varlıklara
    ilişkin teşvikler için TMS 20''deki yöntemlerden her ikisini de uygulayabilecek durumdadır. Vergi etkileri dikkate alınmayacaktır.


    **İstenenler**


    (a) Kredinin 1.1.2026''daki ilk defter değerini ve devlet teşvikinin tutarını bulunuz; 1.1.2026 tarihli kayıtları, teşviki
    ertelenmiş gelir olarak sunarak yapınız. (6 puan)


    (b) Kredinin 2026 ve 2027 yıllarındaki faiz giderlerini ve yıl sonu defter değerlerini hesaplayınız. (5 puan)


    (c) Teşviki (i) ertelenmiş gelir olarak ve (ii) makinenin defter değerinden indirerek sunma yöntemlerine göre 2026 yılı
    amortisman, teşvik geliri ve toplam kâr veya zarar etkisini karşılaştırınız. (7 puan)


    (d) 2026 yılı nakit akış tablosunda makine alımı ve kredinin nasıl sınıflandırılacağını; finansman faaliyetlerinden kaynaklanan
    yükümlülükteki değişimin nakit ve nakit olmayan unsurlarını 2026 ve 2027 için gösteriniz. (7 puan)

    '
  cozum: '**(a) Kredinin ilk ölçümü ve teşvik (TMS 20 par. 10A)**


    Piyasa faizinin altındaki oranla alınan kredi TFRS 9''a göre ölçülür; faydası devlet teşvikidir. Kredinin ilk defter değeri
    = gelecekteki ödemenin piyasa faiziyle iskonto edilmiş bugünkü değeri = 1.440.000 / (1,20)² = **1.000.000 TL**. Teşvik
    = elde edilen tutar − ilk defter değeri = 1.440.000 − 1.000.000 = **440.000 TL**.


    | Hesap | Borç | Alacak |

    |---|---|---|

    | Bankalar | 1.440.000 | |

    | Banka Kredileri (finansal borç) | | 1.000.000 |

    | Ertelenmiş Gelir (devlet teşviki) | | 440.000 |

    | Tesis, Makine ve Cihazlar | 3.000.000 | |

    | Bankalar | | 3.000.000 |


    **(b) Etkin faiz yöntemi**


    | Yıl | Açılış | Faiz gideri (%20) | Kapanış |

    |---|---|---|---|

    | 2026 | 1.000.000 | 200.000 | 1.200.000 |

    | 2027 | 1.200.000 | 240.000 | 1.440.000 (= nominal anapara) |


    31.12.2027''de 1.440.000 TL nakden ödenerek kredi kapanır.


    **(c) Sunum yöntemleri (TMS 20 par. 24-27)**


    | 2026 (TL) | Ertelenmiş gelir yöntemi | Defter değerinden indirme |

    |---|---|---|

    | Amortisman gideri | 3.000.000 / 10 = 300.000 | (3.000.000 − 440.000) / 10 = 256.000 |

    | Teşvik geliri | 440.000 / 10 = 44.000 | – |

    | Faiz gideri | 200.000 | 200.000 |

    | **Toplam kâr/zarar etkisi (gider)** | 300.000 + 200.000 − 44.000 = **456.000** | 256.000 + 200.000 = **456.000** |

    | 31.12.2026 makine defter değeri | 2.700.000 | 2.304.000 |

    | 31.12.2026 ertelenmiş gelir | 396.000 | – |


    Teşvik, makine amortismana tabi olduğundan genellikle amortismanları oranında, ilgili dönemlerde kâr veya zarara yansıtılır
    (par. 17); iki yöntem aynı kâr veya zarar sonucunu verir, farklılık finansal durum tablosunun sunumundadır.


    **(d) Nakit akış tablosu (TMS 7 par. 16(a), 17(c)-(d), 43, 44A-44B)**


    2026: makine alımı için yapılan 3.000.000 TL nakit ödeme **yatırım faaliyetleri**ndendir; kredi tahsilatı 1.440.000 TL
    **finansman faaliyetleri**nden nakit girişidir (nakden tahsil edilen tutar gösterilir, ilk ölçümdeki 1.000.000 TL değil).
    440.000 TL''lik teşvik ve faiz tahakkuku nakit akışı yaratmaz; nakit akış tablosunda yer almaz ve finansman yükümlülüklerindeki
    değişim açıklamasında gösterilir.


    | Finansman yükümlülüğü (kredi) | 2026 | 2027 |

    |---|---|---|

    | Açılış | 0 | 1.200.000 |

    | Nakit akışı: kredi tahsilatı / (geri ödeme) | 1.440.000 | (1.440.000) |

    | Nakit dışı: teşvik ayrıştırması | (440.000) | 0 |

    | Nakit dışı: faiz tahakkuku | 200.000 | 240.000 |

    | Kapanış | 1.200.000 | 0 |


    2027''de 1.440.000 TL anapara geri ödemesi finansman faaliyetlerinden nakit çıkışıdır; faiz nakden ödenmediği için ayrı
    bir faiz ödemesi yoktur.

    '
