- id: TASLAK
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - 'hisse başına kazanç: ağırlıklı ortalama hisse sayısı ve temel HBK'
  - sulandırılmış hisse başına kazanç (opsiyon, dönüştürülebilir araçlar, ters sulandırma)
  - ara dönem finansal raporda HBK sunumu
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Zirve Holding AŞ''nin adi hisseleri Borsa İstanbul''da işlem görmektedir. Şirket hem konsolide hem bireysel finansal tablo
    hazırlamaktadır. Aşağıdaki bilgiler 2026 yılına (takvim yılı) ve konsolide tablolara ilişkindir; adi hisseler 1 TL nominal
    değerlidir.


    - 1.1.2026''da dolaşımdaki adi hisse: 5.500.000 adet. 1.4.2026''da nakit karşılığı 800.000 adet adi hisse ihraç edilmiş
    ve bedeli aynı gün tahsil edilmiştir. 1.10.2026''da şirket kendi adi hisselerinden 400.000 adedini geri almıştır.

    - Ana ortaklık paylarına düşen sürdürülen faaliyetler dönem kârı 8.940.000 TL, durdurulan faaliyetler zararı 900.000 TL''dir
    (her ikisi de vergi sonrası).

    - Birikimli, dönüştürülebilir imtiyazlı hisselere ilişkin 2026 dönemi için öngörülen vergi sonrası temettü 300.000 TL''dir
    (ilan edilmemiştir). İmtiyazlı hisseler 100.000 adet adi hisse ile değiştirilebilmektedir.

    - Dönem başından beri geçerli 500.000 adet hisse alım opsiyonu vardır; kullanım fiyatı 8 TL, 2026 ortalama piyasa fiyatı
    10 TL''dir.

    - 1.7.2026''da 4.000.000 TL nominal %12 faizli dönüştürülebilir tahvil ihraç edilmiştir; tahvil 400.000 adet adi hisse
    ile değiştirilebilmektedir. Faiz tahakkuku 6 aylıktır; kurumlar vergisi oranı %25''tir.


    Hesaplamalarda aylık ağırlıklandırma kullanınız; sonuçları iki ondalık basamağa yuvarlayınız.


    **İstenenler**


    (a) Ağırlıklı ortalama adi hisse sayısını ve adi hisse başına kazancı (sürdürülen faaliyetler, durdurulan faaliyetler,
    toplam) hesaplayınız. (6 puan)


    (b) Opsiyonların, dönüştürülebilir tahvilin ve dönüştürülebilir imtiyazlı hisselerin sulandırma etkisini analiz ediniz
    (hisse başına ek kazanç hesaplayarak). (8 puan)


    (c) Sulandırılmış hisse başına kazancı (sürdürülen faaliyetler, durdurulan faaliyetler, toplam) hesaplayınız. (6 puan)


    (d) Hisse başına kazanç bilgisinin hangi finansal tablolarda ve nasıl sunulacağını açıklayınız; şirketin 30.9.2026 tarihli
    ara dönem raporunda sulandırma etkili potansiyel hisselerin nasıl belirleneceğini belirtiniz. (5 puan)

    '
  cozum: '**(a) Adi hisse başına kazanç (TMS 33 par. 10, 12, 14, 19-21)**


    Ağırlıklı ortalama = 5.500.000 + 800.000 × 9/12 − 400.000 × 3/12 = 5.500.000 + 600.000 − 100.000 = **6.000.000**.


    Kontrol sayısı (sürdürülen faaliyetler, imtiyazlı temettü düşülmüş) = 8.940.000 − 300.000 = 8.640.000 TL; birikimli imtiyazlı
    temettü ilan edilmemiş olsa da düşülür (par. 14(b)).


    | | Pay (TL) | Payda | HBK |

    |---|---|---|---|

    | Sürdürülen faaliyetler | 8.640.000 | 6.000.000 | **1,44** |

    | Durdurulan faaliyetler | (900.000) | 6.000.000 | **(0,15)** |

    | Toplam | 7.740.000 | 6.000.000 | **1,29** |


    **(b) Sulandırma analizi (par. 41-50)**


    | Araç | Pay etkisi | Ek hisse (ağırlıklı) | Hisse başına ek kazanç |

    |---|---|---|---|

    | Opsiyon | 0 | 500.000 − 500.000×8/10 = 100.000 | 0 (ilk sırada dâhil edilir, par. 44-47) |

    | Tahvil | faiz 240.000 × (1 − 0,25) = 180.000 | 400.000 × 6/12 = 200.000 | 180.000 / 200.000 = 0,90 |

    | İmtiyazlı hisse | temettü 300.000 | 100.000 | 300.000 / 100.000 = 3,00 |


    Opsiyon ortalama piyasa fiyatının (10 TL) kullanım fiyatının (8 TL) üstünde olduğundan sulandırıcıdır. Sıra: opsiyon (0)
    → tahvil (0,90) → imtiyazlı hisse (3,00). Tahvil, 1,44 ve opsiyon sonrası EPS''nin altında kaldığından sulandırıcıdır.
    İmtiyazlı hisse: ek kazanç 3,00 TL, sürdürülen faaliyetlerden EPS''nin (1,40) üstünde olduğundan ters sulandırıcıdır;
    dâhil edilmez (par. 43, 50).


    **(c) Sulandırılmış HBK**


    Payda = 6.000.000 + 100.000 + 200.000 = **6.300.000**.


    | | Pay (TL) | Payda | Sulandırılmış HBK |

    |---|---|---|---|

    | Sürdürülen | 8.640.000 + 180.000 = 8.820.000 | 6.300.000 | **1,40** |

    | Durdurulan | (900.000) | 6.300.000 | **(0,14)** |

    | Toplam | 7.740.000 + 180.000 = 7.920.000 | 6.300.000 | **1,26** |


    Durdurulan faaliyetler için de aynı payda kullanılır; toplam = 1,40 − 0,14 = 1,26.


    **(d) Sunum**


    - Hem konsolide hem bireysel tablo hazırlandığında standart gereği açıklamalar yalnız konsolide bilgiler çerçevesinde
    sunulur (par. 4); bireysel tablolar için HBK verilmek istenirse yalnızca bireysel kapsamlı gelir tablosunda gösterilir,
    konsolide tablolarda sunulmaz. Kâr veya zarar ayrı bir tabloda sunuluyorsa HBK yalnız bu tabloda yer alır (par. 4A).

    - Ara dönem raporunda kâr veya zarar bileşenlerini sunan tabloda dönemin adi ve sulandırılmış HBK''sı gösterilir (TMS
    34 par. 11).

    - 30.9.2026 yılbaşından bugüne dönem için sulandırma etkili potansiyel hisseler o döneme göre bağımsız belirlenir; çeyreklik
    hesaplamaların ağırlıklı ortalaması değildir (TMS 33 par. 37).

    '
