  cozum: '**(a) Stok ve ara dönem (TMS 34 par. 28-30(a); TMS 2 par. 9, 33)**


    Ara dönemde stokların NRV''ye indirgenmesi yıllık finansal tablolardaki ilkelerle aynıdır; indirgeme ilgili ara dönemde
    muhasebeleştirilir, yıl sonuna bırakılamaz. Sonraki ara dönemde tahmin değişirse ilk tutar ek zarar yansıtılarak veya
