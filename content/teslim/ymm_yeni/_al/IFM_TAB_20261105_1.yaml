  kok: Üçer aylık ara dönem finansal raporlama yapan Nehir AŞ, 2026 yılının ilk çeyreğinde 800.000 TL vergi öncesi kâr elde
    etmiş ve yıl için beklediği ağırlıklı ortalama yıllık efektif vergi oranını %20 tahmin ederek ilk çeyrekte gelir vergisi
    gideri muhasebeleştirmiştir. İkinci çeyrekte vergi öncesi kâr 1.200.000 TL gerçekleşmiş (ilk altı ay toplamı 2.000.000
    TL) ve yıl için beklenen ağırlıklı ortalama yıllık efektif vergi oranı tahmini %18'e düşürülmüştür. Şirketin ikinci çeyreğin
    ara dönem finansal tablolarında (3 aylık dönem için) muhasebeleştireceği gelir vergisi gideri kaç TL'dir?
  secenekler:
    A: '200.000'
    B: '216.000'
    C: '240.000'
    D: '360.000'
    E: '400.000'
  dogru: A
  aciklama:
    dogru_neden: 'TMS 34 par. 30(c) uyarınca gelir vergisi gideri, yıl için beklenen yıllık vergi oranına ilişkin en iyi tahmine
      göre muhasebeleştirilir; oran tahminindeki değişiklik izleyen ara dönemde düzeltilir. Ölçüm yıl başından ara dönem sonuna
      kadar kümülatiftir (par. 28). 30.6.2026 itibarıyla kümülatif vergi = 2.000.000 × %18 = 360.000 TL; ilk çeyrekte yansıtılan
      800.000 × %20 = 160.000 TL olduğundan ikinci çeyrek gideri 360.000 − 160.000 = 200.000 TL''dir.


      Püf noktaları: Yeni oranı yalnız ikinci çeyrek kârına uygulamayın; kümülatif kâra uygulayıp önceki çeyrekte yansıtılan
      vergiyi düşün. Oran farkının etkisi bu şekilde izleyen ara dönemde düzeltilmiş olur.'
    celdiriciler:
      B: '1.200.000 × %18: yeni oran yalnız ikinci çeyrek kârına uygulanmış, ilk çeyrekteki oran değişikliği düzeltilmemiştir.'
      C: '1.200.000 × %20: eski oran ikinci çeyrek kârına uygulanmıştır; oran tahmini değişmiştir.'
      D: '2.000.000 × %18: altı aylık kümülatif vergidir; ilk çeyrekte yansıtılan 160.000 TL düşülmemiştir.'
      E: '2.000.000 × %20: eski oran kümülatif kâra uygulanmıştır ve önceki çeyrek vergisi düşülmemiştir.'
    hesap_adimlari:
    - 30.6.2026 kümülatif vergi = 2.000.000 × 0,18 = 360.000
    - 1. çeyrekte yansıtılan = 800.000 × 0,20 = 160.000
    - 2. çeyrek gideri = 360.000 − 160.000 = 200.000
  kaynaklar:
  - mevzuat: TMS 34 Ara Dönem Finansal Raporlama
    madde: par. 30(c)
    alinti: Her bir ara dönem için, hesap yılının tamamı için beklenen yıllık vergi oranlarının ağırlıklı ortalamasına ilişkin
      en iyi tahmin esas alınarak gelir vergisi gideri muhasebeleştirilir. Bir ara dönemde muhasebeleştirilen vergi karşılığı;
