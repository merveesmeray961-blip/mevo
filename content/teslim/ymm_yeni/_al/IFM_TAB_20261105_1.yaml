    alinti: Dönem içinde ihraç edilen adi hisse senedi sayısı ile ortalama piyasa fiyatından ihraç edilecek adi hisse senedi
      sayısı arasındaki fark, bedelsiz olarak ihraç edilmiş adi hisse senetleri olarak kabul edilir.
  - mevzuat: TMS 33 Hisse Başına Kazanç
    madde: par. 4
    alinti: Bir işletmenin, hem konsolide hem de bireysel finansal tablolarını "TFRS 10 Konsolide Finansal Tablolar" ve "TMS
      27 Bireysel Finansal Tablolar" Standartlarına göre hazırlayıp sunması durumunda, bu Standart uyarınca yapılması gereken
      açıklamaların, sadece, konsolide bilgiler çerçevesinde sunulması gerekir.
  - mevzuat: TMS 33 Hisse Başına Kazanç
