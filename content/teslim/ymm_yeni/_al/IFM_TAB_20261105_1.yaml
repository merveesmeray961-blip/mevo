- id: TASLAK
  sinav: ymm
  ders: IFM
  konu: TAB
  kazanimlar:
  - 'faaliyet bölümleri: raporlanabilir bölüm sayısal alt sınırları ve %75 testi'
  - bölüm bilgilerinin mutabakatı
  - ara dönem finansal raporda bölüm bilgisi
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: '**Veriler**


    Marmara Grup AŞ''nin payları Borsa İstanbul''da işlem görmektedir. Faaliyetlere ilişkin karar almaya yetkili merci, 31.12.2026
    itibarıyla aşağıdaki altı faaliyet bölümünün sonuçlarını düzenli olarak gözden geçirmektedir (bin TL):


    | Bölüm | Dış hasılat | Bölümler arası hasılat | Toplam hasılat | Bölüm kâr/(zararı) | Bölüm varlıkları |

    |---|---|---|---|---|---|

    | Gıda | 7.000 | 500 | 7.500 | 900 | 8.000 |

    | Ambalaj | 1.500 | 1.700 | 3.200 | 300 | 3.500 |

    | Lojistik | 1.600 | 400 | 2.000 | 250 | 2.500 |

    | Perakende-Online | 900 | 0 | 900 | (400) | 2.000 |

    | Enerji | 700 | 100 | 800 | 30 | 700 |

    | Danışmanlık | 300 | 0 | 300 | 20 | 300 |


    - Hiçbir bölüm birleştirilmemiştir. Enerji bölümünün önceki yıl raporlanabilir bölüm olduğu ve yönetimin önemini sürdürdüğü
    bilinmektedir. Perakende-Online bölümü 2026''da faaliyete geçmiştir ve 2025''te bölüm olarak izlenmemiştir; 2025 için
    bilgi hazırlanması mümkündür ve maliyetli değildir.

    - Bölümlere dağıtılmayan unsurlar: merkez yönetim gideri 350; finansman gideri 180; bölümler arası satışlardan stoklarda
    kalan gerçekleşmemiş kâr eliminasyonu 40. Bölümlere dağıtılmayan varlıklar: merkez binası 1.200, ertelenmiş vergi varlığı
    300; bölümler arası alacak eliminasyonu (600).

    - Durdurulan faaliyet yoktur; konsolide hasılat dış hasılatların toplamıdır.


    **İstenenler**


    (a) TFRS 8''deki sayısal alt sınırlara göre hangi bölümlerin ayrı raporlanması zorunludur? Üç testin eşik tutarlarını
    hesaplayarak gösteriniz. (8 puan)


    (b) Dış hasılat testini (%75) yapınız; Enerji ve Danışmanlık bölümlerinin sunumunu açıklayınız. (6 puan)


    (c) Hasılat, kâr veya zarar ve varlık mutabakatlarını yapınız. (6 puan)


    (d) Perakende-Online için 2025 karşılaştırma verilerinin durumunu ve 30.9.2026 tarihli ara dönem raporunda yapılması gereken
    bölüm açıklamalarını belirtiniz. (5 puan)

    '
  cozum: '**(a) Sayısal alt sınırlar (TFRS 8 par. 13)**


    - Hasılat testi: toplam hasılat (bölümler arası dahil) = 14.700; %10 = **1.470**.

    - Kâr/zarar testi: kâr eden bölümlerin toplamı 1.500, zarar eden bölümlerin toplamı 400 (mutlak); %10 eşikler 40 (zarar
    toplamı) ve **150** (kâr toplamı)dır; hiçbir bölümün sonucu, hangi eşiğin esas alındığına bağlı olarak değişmemektedir
    (en yüksek eşik 150 esas alınmıştır).

    - Varlık testi: toplam varlık = 17.000; %10 = **1.700**.


    | Bölüm | Toplam hasılat | ≥ eşik | Kâr/(zarar) | ≥ eşik | Varlık | ≥ eşik | Raporlanabilir |

    |---|---|---|---|---|---|---|---|

    | Gıda | 7.500 | Evet | 900 | Evet | 8.000 | Evet | **Evet** |

    | Ambalaj | 3.200 | Evet | 300 | Evet | 3.500 | Evet | **Evet** |

    | Lojistik | 2.000 | Evet | 250 | Evet | 2.500 | Evet | **Evet** |

    | Perakende-Online | 900 | Hayır | (400) | Evet | 2.000 | Evet | **Evet** |

    | Enerji | 800 | Hayır | 30 | Hayır | 700 | Hayır | **Hayır** |

    | Danışmanlık | 300 | Hayır | 20 | Hayır | 300 | Hayır | **Hayır** |


    Gıda, Ambalaj ve Lojistik hasılat (bölümler arası dâhil), Perakende-Online ise zararının mutlak değeri (400) ve varlıkları
    nedeniyle raporlanabilir bölümdür. Zararda olması raporlamayı engellemez. Enerji ve Danışmanlık hiçbir eşiği geçemez.


    **(b) %75 testi ve diğer bölümler (par. 14-17)**


    Raporlanabilir bölümlerin dış hasılatı = 7.000 + 1.500 + 1.600 + 900 = 11.000; konsolide hasılat 12.000; oran = **%91,7**
    ≥ %75 olduğundan ek bölüm tanımlamak gerekmez (par. 15). Danışmanlık raporlanabilir değildir; bilgileri raporlanamayan
    diğer faaliyetlerle birlikte "diğer tüm bölümler" altında, gelir kaynakları açıklanarak sunulur (par. 16). Enerji bölümü
    bir önceki dönemde raporlanabilir bölüm olduğundan ve yönetim önemini sürdürdüğünü düşündüğünden, eşikleri artık karşılamasa
    da ayrı raporlanır (par. 17). Sayısal alt sınırları karşılamayan bölümler benzer ekonomik özellikler taşıyorsa par. 14
    gereği birleştirilebilir; ancak burada gerekli değildir.


    **(c) Mutabakatlar (par. 28)**


    | Hasılat | Bin TL |

    |---|---|

    | Bölümlerin toplam hasılatı | 14.700 |

    | Bölümler arası eliminasyon | (2.700) |

    | **Konsolide hasılat** | **12.000** |


    | Kâr veya zarar (vergi öncesi) | Bin TL |

    |---|---|

    | Bölüm kârlarının toplamı (1.500 − 400) | 1.100 |

    | Merkez yönetim gideri | (350) |

    | Finansman gideri | (180) |

    | Gerçekleşmemiş stok kârı eliminasyonu | (40) |

    | **Vergi öncesi kâr** | **530** |


    | Varlıklar | Bin TL |

    |---|---|

    | Bölüm varlıkları toplamı | 17.000 |

    | Merkez binası | 1.200 |

    | Ertelenmiş vergi varlığı | 300 |

    | Bölümler arası alacak eliminasyonu | (600) |

    | **Konsolide varlıklar** | **17.900** |


    **(d) Karşılaştırma bilgisi ve ara dönem**


    Perakende-Online cari dönemde sayısal alt sınıra göre raporlanabilir hâle geldiğinden, önceki dönemde bu kriteri karşılamamış
    olsa da karşılaştırma için sunulan 2025 bölüm verileri, bilgi mevcut ve hazırlanması aşırı maliyetli olmadığı için bu
    bölüm ayrı olacak biçimde yeniden ifade edilir (par. 18). Ara dönem raporunda (TMS 34 par. 16A(g)) şunlar açıklanır: dış
    müşterilerden hasılat ve bölümler arası hasılat (karar merciine sunuluyorsa), bölüm kâr veya zarar ölçümü, önemli değişiklik
    olması ve düzenli sunulması hâlinde bölüm varlık/borç ölçümü, bölümlendirme veya ölçüm esasındaki farklar, bölüm kâr/zararları
    toplamının vergi öncesi kâr ile mutabakatı.

    '
