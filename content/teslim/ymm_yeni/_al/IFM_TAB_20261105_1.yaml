    alinti: Yılbaşından bugüne kadar olan döneme dahil edilen sulandırma etkisi olan potansiyel adi hisse senetlerinin sayısı,
      her ara döneme ait hesaplamaya dahil edilen sulandırma etkisi olan potansiyel adi hisse senetlerinin bir ağırlıklı ortalaması
      değildir.
  - mevzuat: TMS 34 Ara Dönem Finansal Raporlama
    madde: par. 11
    alinti: İşletme, bir ara döneme ilişkin kâr veya zarar bileşenlerini sunan tabloda, "TMS 33 Hisse Başına Kazanç" Standardının
      uygulandığı durumlarda söz konusu döneme ilişkin adi hisse başına kâr ile hisse başına sulandırılmış kâr tutarlarını
      sunar.
