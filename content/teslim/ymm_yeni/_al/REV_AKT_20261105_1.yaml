  soru: '**Olay:** Bilanço esasına göre defter tutan Anadolu Lojistik A.Ş.''nin (hesap dönemi takvim yılı) 2026 yılı tam tasdik
    çalışmasında YMM, duran varlık hesaplarında aşağıdaki tespitleri yapmıştır. Şirket aşağıda belirtilenler dışında kayıtlarını
    doğru tutmuştur. Kurumlar vergisi oranı %25''tir; KDV etkileri ve kanunen kabul edilmeyen giderler dikkate alınmayacaktır.
    Amortismanlar normal usulle ve yıl esasıyla (gün esası seçilmemiştir) hesaplanacaktır.


    1. **Arsa:** Şirket, üzerinde eski bir bina bulunan arsayı 2026''da satın almıştır (arsa bedeli 8.000.000 TL). Aynı yıl
    aşağıdaki giderler yapılmış ve tamamı kâr veya zarar hesaplarında gider yazılmıştır: tapu harcı 320.000 TL, noter ve değer
    tespit giderleri 80.000 TL, satın alınan eski binanın yıkım gideri 600.000 TL, arsanın tesviye gideri 200.000 TL. Arsa
    ile doğrudan ilgili olarak aynı yıl alınan 500.000 TL hibe ise gelir yazılmıştır. Arsa 2026 sonunda envantere alınmıştır.

    2. **Yol:** Şirketin kendi sahasında 1.7.2026''da tamamlanıp aktife alınan, imal giderleri 1.000.000 TL olan iç yol 250
    Arazi ve Arsalar hesabına kaydedilmiş, amortisman ayrılmamıştır. Yolun amortisman oranı %5''tir.

    3. **Depo binası:** Mevcut depo binasına 1.10.2026''da yapılan kat ilavesi için 3.000.000 TL ve çatının yenilenmesi, boya
    ve badana için 400.000 TL harcanmış; her ikisi de gider yazılmıştır. Binanın amortisman oranı %2''dir. Ayrıca binanın
    dış cephesine yapılan 500.000 TL''lik ısı yalıtımı ve enerji tasarrufu harcaması aktifleştirilmiş olup amortisman ayrılmamıştır.

    4. **Kiralanan şube deposu:** Şirket, 1.1.2026–31.12.2030 süreli kira sözleşmesiyle kiraladığı depoda kiracı olarak 1.500.000
    TL tutarında, gayrimenkulün değerini artıran tadilat yaptırmış ve tamamını gider yazmıştır. Sözleşme 30.6.2028''de feshedilecek
    ve depo boşaltılacaktır.


    **İstenenler:**


    (a) 1 numaralı tespitte arsanın maliyet bedelini hesaplayınız ve gerekli düzeltmeleri yapınız. (7 puan)


    (b) 2 ve 3 numaralı tespitleri değerlendiriniz; yol ve kat ilavesi için amortisman ve düzeltme tutarlarını hesaplayınız;
    ısı yalıtımı harcamasının durumunu açıklayınız. (7 puan)


    (c) 4 numaralı tespitte 2026 itfa payını bulunuz ve boşaltma hâlinde 2028 yılı giderini hesaplayınız. (5 puan)


    (d) Düzeltmelerin 2026 kurumlar vergisi matrahına ve kurumlar vergisine etkisini tablo hâlinde gösteriniz. (5 puan)

    '
  cozum: '**(a) Arsa (VUK md. 262, 269)**


    Gümrük, tapu, noter, değer tespit giderleri gibi iktisapla doğrudan ilgili giderlerle satın alınan binanın yıkılması ve
    arsanın tesviyesinden doğan giderler maliyet bedeline dâhil edilir; gayrimenkulle doğrudan ilgili ve envantere alındığı
    hesap dönemi sonuna kadar alınan hibeler maliyet bedelinden indirilir.


    | Kalem | Tutar (TL) |

    |---|---|

    | Arsa bedeli | 8.000.000 |

    | Tapu harcı | 320.000 |

    | Noter ve değer tespit | 80.000 |

    | Eski bina yıkım | 600.000 |

    | Tesviye | 200.000 |

    | Hibe (−) | (500.000) |

    | **Maliyet bedeli** | **8.700.000** |


    Düzeltme: 250 Arazi ve Arsalar (B) 1.200.000 / 770 Genel Yönetim Giderleri (A) 1.200.000; 649 Faaliyetle İlgili Diğer
    Gelir ve Karlar (B) 500.000 / 250 Arazi ve Arsalar (A) 500.000. Arsa amortismana tabi olmadığından (md. 314) amortisman
    ayrılmaz. Matrah etkisi: +1.200.000 − 500.000 = **+700.000 TL**.


    **(b) Yol ve bina**


    - Boş arazi ve arsalar amortismana tabi değildir; ancak işletmede inşa edilmiş yollar amortismana tabi tutulur (md. 314).
    Yol 251 Yer Altı ve Yer Üstü Düzenleri hesabına alınmalı ve normal amortisman yıl esasıyla ayrılmalıdır: 1.000.000 × %5
    = **50.000 TL** amortisman gideri; matrah etkisi −50.000 TL.

    - Normal bakım ve temizleme giderleri dışında, gayrimenkulün iktisadi kıymetini devamlı olarak artırmak maksadıyla yapılan
    giderler maliyet bedeline eklenir (md. 272). Kat ilavesi 3.000.000 TL aktifleştirilir: amortisman 3.000.000 × %2 = **60.000
    TL**; matrah etkisi +3.000.000 − 60.000 = **+2.940.000 TL**. Çatı yenileme, boya ve badana (400.000 TL) normal bakım niteliğindeki
    gider olarak kalır, düzeltme yapılmaz.

    - Isı yalıtımı ve enerji tasarrufuna yönelik harcamalar (GVK md. 40/7) yapıldığı yılda doğrudan gider yazılabilir; bu
    bir imkândır, zorunluluk değildir. Aktifleştirme ve amortisman ayrılmaması tercihi geçerli olduğundan düzeltme gerekmez;
    matrah etkisi yoktur.


    **(c) Özel maliyet (md. 272/3, 327)**


    Kiracının gayrimenkulün değerini artıran giderleri özel maliyet bedeli olarak 264 Özel Maliyetler hesabında izlenir ve
    kira süresine göre eşit yüzdelerle itfa edilir. Kira süresi 5 yıldır: yıllık itfa = 1.500.000 / 5 = **300.000 TL**.


    - 264 Özel Maliyetler (B) 1.500.000 / 770 Genel Yönetim Giderleri (A) 1.500.000

    - 770 (B) 300.000 / 268 Birikmiş Amortismanlar (A) 300.000 (2026 itfa payı)


    Kira süresi dolmadan depo boşaltılırsa itfa edilmemiş giderler boşaltma yılında bir defada gider yazılır. 2026 ve 2027''de
    600.000 TL itfa edilmiştir; 2028''de gider = 1.500.000 − 600.000 = **900.000 TL**.


    Matrah etkisi (2026): +1.500.000 − 300.000 = **+1.200.000 TL**.


    **(d) Toplam etki**


    | Kalem | Matrah etkisi (TL) |

    |---|---|

    | Arsa (gider ve hibe düzeltmesi) | +700.000 |

    | Yol amortismanı | −50.000 |

    | Kat ilavesi (aktifleştirme − amortisman) | +2.940.000 |

    | Özel maliyet (aktifleştirme − itfa) | +1.200.000 |

    | **Toplam** | **+4.790.000** |


    Ek kurumlar vergisi = 4.790.000 × %25 = **1.197.500 TL**.

    '
