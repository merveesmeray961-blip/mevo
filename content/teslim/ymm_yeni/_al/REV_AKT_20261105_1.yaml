  soru: '**Olay:** Bilanço esasına göre defter tutan Orman Ambalaj A.Ş.''nin (hesap dönemi takvim yılı) fabrikası 2026 yılı
    Mart ayında sel felaketinden zarar görmüştür. 2026 tam tasdik çalışmasında YMM aşağıdaki tespitleri yapmıştır. Şirket,
    sigorta tazminatlarını ve zararları kâr veya zarar hesaplarında izlemiş; aşağıda belirtilenler dışında başka bir kayıt
    yapmamıştır. Kurumlar vergisi oranı %25''tir; asgari kurumlar vergisi hesabı yapılmayacaktır.


    1. **Makine:** Maliyeti 2.000.000 TL, ayrılmış birikmiş amortismanı 800.000 TL olan üretim makinesi selde tamamen kullanılamaz
    hâle gelmiştir. Sigortadan 15.5.2026''da 1.700.000 TL tazminat alınmış; tazminat gelir, makinenin net defter değeri ise
    zarar olarak kaydedilmiştir. Yönetim kurulu, makinenin yenilenmesine karar vermiş ve teşebbüse geçmiş; aynı nitelikte
    yeni makine 1.9.2026''da 2.400.000 TL''ye (faydalı ömür 10 yıl, normal amortisman, gün esası seçilmemiş) satın alınıp
    aktife girmiştir. Şirket yeni makine için 2026''da 240.000 TL amortisman gideri ayırmıştır. Yeni makineye 2027 ve sonrasında
    da yıllık 240.000 TL amortisman ayrılacaktır.

    2. **Zayi olan mal:** Sel nedeniyle maliyeti 300.000 TL olan ticari mallar tamamen zayi olmuş ve sigortadan 350.000 TL
    tazminat alınarak gelir yazılmıştır. Bu mallara ait yüklenilen KDV 60.000 TL''dir ve indirim konusu yapılmıştır.

    3. **Hasarlı mal:** Aynı depodaki, maliyeti 100.000 TL olan ticari mallar selde bozulmuş ve değerinde önemli azalış meydana
    gelmiştir. Mallar stokta maliyet bedeliyle izlenmektedir; emsal bedeli 40.000 TL olarak tespit edilmiştir.

    4. **Hırsızlık:** Yıl içinde depodan çalınan ve maliyeti 100.000 TL olan başka mallara ait yüklenilen 20.000 TL KDV de
    indirim konusu yapılmıştır. Çalınan malların maliyeti gider yazılmış, sigorta tazminatı alınmamıştır.


    **İstenenler:**


    (a) 1 numaralı tespitte tazminat fazlasının vergisel işlemini açıklayarak tutarını bulunuz; fazlanın yeni makinenin amortismanlarına
    mahsubunu 2026, 2027 ve 2028 yılları itibarıyla tablo hâlinde gösteriniz; yenileme gerçekleşmezse sonucu belirtiniz. (7
    puan)


    (b) 2 ve 3 numaralı tespitleri VUK md. 330 ve md. 278 bakımından değerlendiriniz; gerekli düzeltme tutarını hesaplayınız.
    (6 puan)


    (c) 2 ve 4 numaralı tespitlerdeki KDV''nin indirilip indirilemeyeceğini KDV Kanunu md. 30 bakımından açıklayınız. (4 puan)


    (d) Yapılacak düzeltmelerin 2026 kurumlar vergisi matrahına ve hesaplanan kurumlar vergisine etkisini gösteriniz. (5 puan)

    '
  cozum: '**(a) Sigorta tazminatı (VUK md. 329)**


    Tazminat fazlası = alınan tazminat − (maliyet − birikmiş amortisman) = 1.700.000 − (2.000.000 − 800.000) = **500.000 TL**.


    Bilanço esasına göre defter tutan mükellef, tazminatla zarar gören amortismana tabi kıymeti yenilemeyi işin niteliğine
    göre zorunlu görmüş veya yönetim karar verip teşebbüse geçmişse tazminat fazlasını, tazminatın alındığı tarihi takip eden
    üçüncü takvim yılının sonuna (31.12.2029) kadar pasifte geçici bir hesapta tutabilir. Şartlar sağlandığından 500.000 TL,
    2026 matrahında gelir olarak kalmaz. Geçici hesap yeni kıymetin amortismanlarına mahsup edilir; mahsup bittikten sonra
    kalan değerin amortismanına devam edilir.


    | Yıl | Ayrılacak amortisman | Fondan mahsup | Fonun kalanı | Matrahı etkileyen amortisman gideri |

    |---|---|---|---|---|

    | 2026 | 240.000 | 240.000 | 260.000 | 0 |

    | 2027 | 240.000 | 240.000 | 20.000 | 0 |

    | 2028 | 240.000 | 20.000 | 0 | 220.000 |


    Yenileme süre içinde gerçekleşmezse geçici hesaptaki tutar tazminatın alındığı yılı takip eden üçüncü takvim yılının (2029)
    kâr ve zarar hesabına eklenir.


    Düzeltme kaydı (2026): 649 Faaliyetle İlgili Diğer Gelir ve Karlar (B) 500.000 / 549 Özel Fonlar (A) 500.000. Mahsup için
    2026''da 549 Özel Fonlar (B) 240.000 / 679 Diğer Olağandışı Gelir ve Kârlar (A) 240.000 yapılır; böylece fon, ayrılan
    amortismanı karşılar.


    **(b) Emtia**


    - Zayi olan mallar: Emtia zayiatı dolayısıyla alınan tazminat malın değerinden fazlaysa fazlalık kâra alınır (md. 330).
    Emtia için yenileme/ertelenme hükmü yoktur: 350.000 − 300.000 = **50.000 TL** fazlalık zaten kâra alınmıştır; düzeltme
    gerekmez.

    - Hasarlı mallar: Afet veya bozulma, çürüme gibi hâller sonucu değerinde önemli azalış olan emtia emsal bedeliyle değerlenir
    (md. 278). Değerleme tutarı 40.000 TL; stok değer düşüklüğü 100.000 − 40.000 = **60.000 TL** gider yazılmalıdır: 654 Karşılık
    Giderleri (B) 60.000 / 158 Stok Değer Düşüklüğü Karşılığı (A) 60.000.


    **(c) KDV (KDVK md. 30/c)**


    - 2 numaralı tespit: Sel felaketi sonucu zayi olan mallara ait KDV, md. 30/c''deki hariç tutma nedeniyle indirilebilir;
    60.000 TL için düzeltme yapılmaz.

    - 4 numaralı tespit: Hırsızlıkla zayi olan mallara ait KDV (deprem, sel veya mücbir sebep ilan edilen yerdeki yangın değildir)
    indirilemez. Hatalı yapılan **20.000 TL**''lik indirim geri alınır: ilgili dönemin KDV beyannamesi düzeltilir ve 191 İndirilecek
    KDV hesabından 20.000 TL ters kayıtla çıkarılır.


    **(d) Matrah ve vergi etkisi**


    | Düzeltme | Etki (TL) |

    |---|---|

    | Tazminat fazlasının pasifteki geçici hesaba alınması | −500.000 |

    | Fondan amortismana mahsup (2026) | +240.000 |

    | Hasarlı mallar için değer düşüklüğü | −60.000 |

    | **Matrah etkisi** | **−320.000** |


    Hesaplanan kurumlar vergisi etkisi = −320.000 × %25 = **−80.000 TL** (vergi azalır). 2 numaralı tespitte ve 4 numaralı
    tespitte matrah etkisi yoktur.

    '
