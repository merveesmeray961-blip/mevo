  aciklama:
    dogru_neden: 'VUK md. 272/3 ve md. 327''ye göre kiracının gayrimenkulün değerini artıran giderleri özel maliyet bedeli
      sayılır ve kira süresine göre eşit yüzdelerle itfa edilir. Süre 5 yıl olduğundan yıllık itfa 400.000 TL''dir; 2024 ve
