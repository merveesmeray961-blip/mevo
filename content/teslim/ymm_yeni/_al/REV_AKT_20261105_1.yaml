      B: Önceki iki yılda itfa edilen toplamdır; 2026 gideri itfa edilmemiş bakiyedir.
      D: Boşaltma yılı itfa payı (400.000 TL) bakiyeye ayrıca eklenmiştir; bakiye zaten bu payı içerir.
