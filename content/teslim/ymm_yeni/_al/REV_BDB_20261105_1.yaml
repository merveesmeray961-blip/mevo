    ortaklara ayrıca **260.000 TL** nakit ödemeyi planlamaktadır.


    **İstenenler:**


    (a) Planlanan nakit ödemenin işlemin bölünme sayılmasına engel olup olmadığını belirtiniz; en çok ödenebilecek nakit tutarını
    bulunuz. (5 puan)


