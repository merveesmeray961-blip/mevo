  cozum: '**(a) Nakit ödeme sınırı**


    Devredilen şirketin ortaklarına verilecek iştirak hisselerinin itibari değerinin %10''una kadarlık kısmının nakit ödenmesi
    bölünme sayılmasına engel değildir: 2.000.000 × %10 = **200.000 TL**. Planlanan 260.000 TL bu sınırı aşmaktadır; **plan
    bu hâliyle KVK md. 19/3-a şartını sağlamaz**. Nakit ödeme en çok 200.000 TL olabilir.


    **(b) Beyanname, belge ve ödeme**


    - Bölünme tarihi: 20.11.2026 (kararın tescil tarihi). Beyanname, bölünmenin Ticaret Sicili Gazetesinde ilan edildiği 24.11.2026''dan
    itibaren **30 gün içinde**, yani en geç **24.12.2026** (Perşembe) tarihinde bölünen kurumun bağlı olduğu vergi dairesine
    verilir.

    - Beyannameyi bölünen kurum ile varlıklarını devralan kurumlar bölünme tarihi itibarıyla birlikte hazırlar ve **müştereken
    imzalar**.

    - Devralan kurumlar, bölünen kurumun bölünme tarihine kadar tahakkuk etmiş ve edecek vergi borçlarından **müteselsilen
    sorumlu olacaklarını** gösteren **taahhütnameyi** beyannameye eklerler; mal memuru ayrıca teminat isteyebilir.

    - Bölünme Kasım''da olduğundan hesap dönemi sonrasındaki "önceki dönem" beyannamesi söz konusu değildir. Kıst döneme (1.1–20.11.2026)
    ilişkin tahakkuk eden vergi, devralan kurumlarca bölünmenin gerçekleştiği 2026 hesap dönemine ilişkin kurumlar vergisi
    beyannamesinin verildiği ayın sonuna kadar, yani **30.4.2027** tarihine kadar ödenir.


    **(c) Zarar mahsubu**


    Tam bölünmede mahsup, bölünen kurumun öz sermayesinin devralınan tutarını geçmeyen ve devralınan kıymetle orantılı zarar
    kısmıyla sınırlıdır. Toplam zarar (2.600.000 TL) bölünen kurumun öz sermayesini (2.000.000 TL) aştığından aşan kısım iptal
    olur.


    | Devralan | Orantılı zarar (2.600.000 × oran) | Devralınan öz sermaye | Mahsup edilebilir |

    |---|---|---|---|

    | Aksoy Gıda A.Ş. (%75) | 1.950.000 | 1.500.000 | **1.500.000** |

    | Aksoy Lojistik A.Ş. (%25) | 650.000 | 500.000 | **500.000** |

    | **Toplam** | | | **2.000.000** |


    İptal olacak zarar = 2.600.000 − 2.000.000 = **600.000 TL**. Hangi yıla ait zararın mahsup edileceğini mükellef serbestçe
    seçer ve beyanname ekinde bildirir; her zarar doğduğu dönemden itibaren beş yıl içinde mahsup edilebilir. Şartlar: son
    beş yıla ilişkin beyannamelerin kanuni süresinde verilmiş olması ve devralanın aynı faaliyete bölünmenin meydana geldiği
    hesap döneminden itibaren en az beş yıl devam etmesidir.


    **(d) Şartın ihlali**


    Aksoy Gıda A.Ş. 1.500.000 TL zarar mahsup etmişse zamanında tahakkuk ettirilmeyen vergi = 1.500.000 × %25 = **375.000
    TL**; faaliyete beş yıl devam şartı (2026–2030) ihlal edildiğinden bu vergi için vergi ziyaı doğmuş sayılır ve gerekli
    düzeltme yapılır.


    **(e) Düzenleyici hesaplar**


    Bölünmelerde aktifi ve pasifi düzenleyici hesaplar (ör. birikmiş amortismanlar, karşılıklar), ilgili olduğu aktif veya
    pasif hesapla birlikte devrolunur (KVK md. 19/4).

