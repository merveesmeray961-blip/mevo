  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Aksoy Endüstri A.Ş.** (ortakları tam mükellef gerçek kişilerdir),
    KVK md. 19/3-a kapsamında tam bölünerek bütün varlık, alacak ve borçlarını kayıtlı değerleri üzerinden yeni kurulan tam
    mükellef **Aksoy Gıda A.Ş.** ve **Aksoy Lojistik A.Ş.**''ye devretmiştir. Bölünmeye ilişkin yetkili kurul kararı 20.11.2026''da
    Ticaret Sicilinde tescil edilmiş, bölünme 24.11.2026''da Ticaret Sicili Gazetesinde ilan edilmiştir.


    Bölünme tarihindeki bilanço ve devir oranları (TL):


    | Kalem | Bölünen şirket | Aksoy Gıda A.Ş. (%75) | Aksoy Lojistik A.Ş. (%25) |

