  soru: '**Olay:** Hesap dönemi takvim yılı olan tam mükellef **Doruk Gıda A.Ş.**, aynı şekilde tam mükellef **Esen Ltd. Şti.**''yi
    14.9.2026 tarihinde birleşme yoluyla devralmıştır (iki şirketin de kanuni merkezi Türkiye''dedir). Doruk Gıda A.Ş., Esen''in
    varlıklarını bilanço değerleriyle değil, rayiç değerleriyle kendi bilançosuna almıştır. Esen Ltd. Şti.''nin ortaklarına,
    birleşme karşılığında Doruk Gıda A.Ş. payları verilmiştir; bu payların Vergi Usul Kanunu esaslarına göre belirlenen toplam
    değeri **3.700.000 TL**''dir.


    Esen Ltd. Şti.''ye ilişkin bilgiler (vergi karşılığı dikkate alınmayacaktır):


    | Bilgi | Tutar (TL) |

    |---|---|

    | 1.1.2026 itibarıyla öz sermaye (birleşme dönemi başındaki servet değeri) | 2.000.000 |

    | 2026''da ortakların yaptığı nakdi sermaye ilavesi | 300.000 |

    | 2026''da elde edilen, vergiden istisna edilmiş iştirak kazancı | 200.000 |

    | Birleşme tarihine kadarki dönemde ticari faaliyetten doğan kâr | 800.000 |

    | Esen Ltd. Şti.''nin birleşme tarihindeki henüz ödenmemiş geçici vergi borcu (vadesi 17.11.2026) | 150.000 |


    Kurumlar vergisi oranı %25''tir.


    **İstenenler:**


    (a) Birleşmenin KVK md. 19 anlamında devir hükmünde olup olmadığını gerekçesiyle belirtiniz. (4 puan)


    (b) Esen Ltd. Şti.''nin birleşme kârını ve kurumlar vergisini hesaplayınız. (9 puan)


    (c) Birleşme kârının içinde yer alan değer artışı tutarını bulunuz ve birleşme devir hükmünde olsaydı vergilendirilecek
    kazancı ve vergi farkını hesaplayınız. (5 puan)


    (d) Tasfiye memurlarına düşen sorumluluk ve ödevlerin kime ait olacağını, birleşme kârı üzerinden tarh olunan vergi ile
    vadesi gelmemiş geçici vergi borcunun ödeme zamanını belirtiniz. (4 puan)


    (e) Ortaklara verilen payların değerinin belirlenmesinde uyulacak esasları yazınız. (3 puan)

    '
  cozum: '**(a) Devir hükmünde birleşme mi?**


    KVK md. 19/1''e göre birleşmenin devir hükmünde sayılması için hem tarafların kanuni veya iş merkezlerinin Türkiye''de
    bulunması hem de münfesih kurumun devir tarihindeki **bilanço değerlerinin bir bütün hâlinde devralınıp aynen bilançoya
    geçirilmesi** gerekir. Merkez şartı sağlanmıştır; ancak varlıklar rayiç değerle alındığından (b) bendi şartı sağlanmamıştır.
    Birleşme devir hükmünde değildir; **vergili birleşme** söz konusudur ve md. 18 gereği tasfiye kârı yerine **birleşme kârı**
    vergiye matrahtır.


    **(b) Birleşme kârı**


    Tasfiye kârının tespiti hükümleri birleşme kârı için de geçerlidir; ortaklara birleşilen kurumca verilen değerler, tasfiyede
    ortaklara dağıtılan değerlerin yerine geçer.


    | Kalem | TL |

    |---|---|

    | Son servet değeri (ortaklara verilen değerler) | 3.700.000 |

    | Başındaki servet değeri | 2.000.000 |

    | + Ortakların yaptığı sermaye ilavesi | 300.000 |

    | + Vergiden istisna edilmiş kazanç | 200.000 |

    | **Düzeltilmiş başındaki servet değeri** | **2.500.000** |

    | **Birleşme kârı** (3.700.000 − 2.500.000) | **1.200.000** |

    | **Kurumlar vergisi** (%25) | **300.000** |


    **(c) Değer artışı ve karşılaştırma**


    Birleşme kârı, tebliğe göre faaliyet kârı ile değer artışlarını birlikte kapsar: değer artışı = 1.200.000 − 800.000 =
    **400.000 TL**.


    Birleşme KVK md. 19/1 şartlarıyla (devir olarak) yapılsaydı yalnızca devir tarihine kadar elde edilen kazanç (800.000
    TL) vergilendirilir, birleşmeden doğan kârlar hesaplanmaz ve vergilendirilmezdi: 800.000 × %25 = 200.000 TL. Vergi farkı
    = 300.000 − 200.000 = **100.000 TL**.


    **(d) Sorumluluk ve ödeme**


    KVK md. 17''ye göre tasfiye memurlarına düşen sorumluluk ve ödevler, birleşme hâlinde **birleşilen kuruma (Doruk Gıda
    A.Ş.)** aittir. Birleşme kârı üzerinden tarh olunan vergi, infisah eden kuruma ait kurumlar vergisi beyannamesinin verilme
    süresi içinde ödenir; birleşen kurumun tahakkuk etmiş olup henüz vadesi gelmemiş vergileri (150.000 TL''lik geçici vergi)
    de **aynı süre içinde** ödenir, 17.11.2026 vadesi beklenmez (KVK md. 21/2).


    **(e) Verilen değerlerin belirlenmesi**


    Birleşilen kurumdan alınan değerler Vergi Usul Kanunu''nda yazılı esaslara göre değerlenir; ayrıca ortaklara verilen değerlerin
    transfer fiyatlandırması yoluyla örtülü kazanç dağıtımı hükümlerine (emsallere uygunluk) göre belirlenmesi gerekir (KVK
    md. 18/2; Tebliğ 18).

    '
