    alinti: 2) Çok uluslu işletme grubunun uluslararası kabul görmüş finansal muhasebe standartlarına göre hesaplanan ülke
      bazlı kurumlar vergisi ve benzer nitelikteki vergilerinin toplamının, (e) bendinin (1) numaralı alt bendi kapsamında
      düzenlenen ülke bazlı raporlardaki vergi öncesi kârlara bölünmesi suretiyle hesaplanan vergi yükünün; 2024 hesap dönemi
      için %15, 2025 hesap dönemi için %16 ve 2026 hesap dönemi için %17 oranlarına eşit veya daha fazla olması,
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: Geçici md. 17/1-e/3
    alinti: 3) Çok uluslu işletme grubunun, (1) numaralı alt bent kapsamında düzenlenen ülke bazlı raporlarındaki vergi öncesi
      kârının; bunların çalışanlarının brüt ücretleri ile maddi duran varlıklarının net defter değerinin, (a) bendi kapsamında
      ilgili yıl için hesaplanacak oranla çarpılan tutarların toplamına eşit veya bu tutardan daha az olması.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
