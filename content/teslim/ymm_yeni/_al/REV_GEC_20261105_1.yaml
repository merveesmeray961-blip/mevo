  soru: '**Olay:** Türkiye''de nihai ana işletmesi bulunan Aksoy Holding çok uluslu işletme grubunun hesap dönemi takvim yılıdır.
    Grup, 2026 hesap dönemi için ülke bazlı raporlardaki (CbCR) verilere göre aşağıdaki ülkelerde faaliyet göstermektedir.
    Tüm tutarlar avro (€) olup ülke bazlı rapor verileri ve hesaplanan vergi yükü buna göredir. KVK geçici md. 17(1) kapsamındaki
    geçiş kolaylıkları (e bendi) değerlendirilecektir. Vergi yükü, ülke bazlı kurumlar vergisi toplamının ülke bazlı vergi
    öncesi kâra bölünmesiyle bulunur.


    | Ülke | Hasılat | Vergi öncesi kâr | Kurumlar vergisi toplamı | Çalışan brüt ücretleri | Maddi duran varlık net defter
    değeri |

    |---|---|---|---|---|---|

    | A | 8.000.000 | 900.000 | 90.000 | 3.000.000 | 2.000.000 |

    | B | 40.000.000 | 3.000.000 | 540.000 | 18.000.000 | 12.000.000 |

    | C | 40.000.000 | 3.000.000 | 450.000 | 20.000.000 | 15.000.000 |

    | D | 30.000.000 | 1.800.000 | 270.000 | 12.000.000 | 10.000.000 |

    | E | 9.500.000 | 1.000.000 | 100.000 | 5.000.000 | 4.000.000 |


    (Hasılat ve kâr için avro karşılığı Türk lirası sınırları, avro tutarlarla aynı sonucu verecek şekilde dikkate alınacaktır.)


    **İstenenler:**


    (a) 2024 hesap dönemi için ücret ve maddi duran varlık oranlarından hareketle 2026 hesap dönemi için uygulanacak oranları
    bulunuz. (4 puan)


    (b) Her ülke için geçici md. 17(1)(e)''deki üç testten (hasılat/kâr, vergi yükü, ücret ve maddi duran varlık bazlı test)
    hangilerinin sağlandığını hesaplayarak gösteriniz. (10 puan)


    (c) Hangi ülkelerde yerel ve küresel asgari tamamlayıcı kurumlar vergisinin sıfır kabul edileceğini belirtiniz. (3 puan)


    (d) Nihai ana işletmenin bulunduğu ülkede %20 kurumlar vergisi uygulanmaktadır. Grubun hesap dönemi 1/1/2026–31/12/2026
    olsaydı ve alternatif olarak 1/7/2025–30/6/2026 olsaydı, (f) bendindeki kolaylıktan yararlanılıp yararlanılamayacağını
    geçiş dönemi tanımına göre değerlendiriniz. (5 puan)

    '
  cozum: '**(a) Oranlar**


    2024 hesap dönemi için ücret oranı %9,8, maddi duran varlık oranı %7,8''dir. Takip eden dört hesap dönemi (2025–2028)
    boyunca her dönem %0,2 azaltılır. 2026 için iki dönem azaltma uygulanır: ücretler %9,8 − 0,4 = **%9,4**; maddi duran varlıklar
    %7,8 − 0,4 = **%7,4**.


    **(b) Testler (geçici md. 17(1)(e))**


    1. Hasılat < 10 milyon € **ve** vergi öncesi kâr < 1 milyon € (her iki şartın birlikte sağlanması gerekir).

    2. Vergi yükü (vergi / kâr) 2026 için en az %17.

    3. Vergi öncesi kâr ≤ ücretler × %9,4 + maddi duran varlık × %7,4.


    | Ülke | Test 1 | Test 2 | Test 3 (SBIE tutarı) |

    |---|---|---|---|

    | A | Sağlanır (8.000.000 < 10.000.000; 900.000 < 1.000.000) | 90.000/900.000 = %10, sağlanmaz | 282.000 + 148.000 = 430.000
    < 900.000, sağlanmaz |

    | B | Sağlanmaz (hasılat 40.000.000) | 540.000/3.000.000 = **%18**, sağlanır | 1.692.000 + 888.000 = 2.580.000 < 3.000.000,
    sağlanmaz |

    | C | Sağlanmaz | 450.000/3.000.000 = %15, sağlanmaz | 1.880.000 + 1.110.000 = **2.990.000** < 3.000.000, sağlanmaz |

    | D | Sağlanmaz | 270.000/1.800.000 = %15, sağlanmaz | 1.128.000 + 740.000 = **1.868.000** ≥ 1.800.000, **sağlanır** |

    | E | Sağlanmaz (kâr tam 1.000.000, "az olması" aranır) | 100.000/1.000.000 = %10, sağlanmaz | 470.000 + 296.000 = 766.000
    < 1.000.000, sağlanmaz |


    **(c) Sonuç**


    Şartlardan herhangi birinin sağlanması yeterlidir: **A, B ve D** ülkelerinde tamamlayıcı vergi sıfır kabul edilir. C (2.990.000
    € < 3.000.000 €) ve E (kâr tam 1.000.000 €) için kolaylık uygulanmaz.


    **(d) Nihai ana işletme ülkesinde %20 vergi**


    Geçiş dönemi, 31/12/2025 tarihinden önce başlayan (bu tarih dahil) ve 31/12/2026 tarihi itibarıyla sona eren hesap dönemleridir.
    1/1/2026–31/12/2026 dönemi 31/12/2025''ten sonra başladığından **kapsam dışıdır**; 1/7/2025–30/6/2026 dönemi 31/12/2025''ten
    önce başlayıp 31/12/2026''dan önce bittiğinden **kapsamdadır** ve o dönem için ülkeye ilişkin tamamlayıcı vergi sıfır
    kabul edilir. (e) ve (f) bentlerini birlikte sağlayan grup, bunlardan birini tercih edebilir.

    '
