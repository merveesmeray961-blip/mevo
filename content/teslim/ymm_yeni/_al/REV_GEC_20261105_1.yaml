  soru: '**Olay:** Hesap dönemi takvim yılı olan, bilanço esasına göre defter tutan tam mükellef Marmara Metal A.Ş., VUK mük.
    md. 298/(A) fıkrasındaki enflasyon düzeltmesi yapma şartlarının gerçekleşmediği 2025 hesap döneminde, amortismana tabi
    iktisadi kıymetlerini mük. md. 298/Ç uyarınca yeniden değerlemek istemektedir. Şirket kayıtlarını Türk lirası ile tutmaktadır.
    2025 yılı yeniden değerleme oranı **%25,49**''dur (kurumlar vergisi oranı %25). 31/12/2025 itibarıyla yasal defter kayıtları
    (tutarlar TL):


    | Kıymet | Aktife giriş | Maliyet bedeli | Birikmiş amortisman | Not |

    |---|---|---|---|---|

    | Makine (A) | 2022 | 1.200.000 | 480.000 | Amortismanları her yıl tam ayrılmıştır. |

    | Fabrika binası (B) | 2020 | 3.000.000 | 240.000 | Maliyete 2023''te eklenen kredi faizi 200.000 TL''dir; bu faize isabet
    eden birikmiş amortisman 20.000 TL''dir (tamamı 240.000 TL''nin içindedir). |

    | Taşıt (C) | Mart 2025 | 900.000 | 90.000 | Satın alma bedelidir; kur farkı ve kredi faizi yoktur. |


    **İstenenler:**


    (a) Hangi kıymetlerin yeniden değerlemeye tabi tutulabileceğini, tutulamayanları nedenleriyle belirtiniz. (4 puan)


    (b) Yeniden değerlemeye tabi kıymetler için yeniden değerleme sonrası maliyet bedellerini, birikmiş amortismanları ve
    pasifte özel fon hesabında gösterilecek toplam değer artışını hesaplayınız. (9 puan)


    (c) Fon hesabındaki değer artışının 400.000 TL''si sermayeye ilave edilirse ve 100.000 TL''si geçmiş yıl zararlarına mahsup
    amacıyla başka bir hesaba nakledilirse vergisel sonuçlarını, hesaplanacak vergiyi de göstererek açıklayınız. (6 puan)


    (d) Şirket 2025''te yeniden değerleme yapmayıp 2026''da yapmak isterse 2025 oranıyla ek bir değerleme yapabilir mi? (3
    puan)

    '
  cozum: '**(a) Kapsam**


    Yeniden değerleme, bilançoda yer alan amortismana tabi iktisadi kıymetler ile bunlar üzerinden ayrılıp pasifte gösterilen
    amortismanlar için yapılır. Hesap dönemi içinde aktife giren kıymetler aktife girdiği dönemde yeniden değerlenmez (bent
    9).


    - Makine (A): değerlenir.

    - Bina (B): değerlenir; ancak maliyete eklenmiş kredi faizi (ve ona isabet eden amortisman) kapsam dışıdır (bent 1; faiz
    2023''te eklendiği için aktifleştirildiği dönem istisnası uygulanmaz).

    - Taşıt (C): 2025 içinde aktife girdiğinden **değerlenemez**.


    **(b) Değerleme**


    Yeniden değerleme için kıymet ve amortisman değerleri yeniden değerleme oranı (%25,49 = 1,2549) ile çarpılır (bent 3).


    | Kıymet | Eski maliyet | Yeni maliyet | Eski amortisman | Yeni amortisman | Eski net | Yeni net | Değer artışı |

    |---|---|---|---|---|---|---|---|

    | A | 1.200.000 | 1.505.880 | 480.000 | 602.352 | 720.000 | 903.528 | **183.528** |

    | B (faiz hariç) | 2.800.000 | 3.513.720 | 220.000 | 276.078 | 2.580.000 | 3.237.642 | **657.642** |


    Fon hesabında gösterilecek toplam değer artışı: 183.528 + 657.642 = **841.170 TL**. Kredi faizi (200.000 TL) ve ona isabet
    eden amortisman (20.000 TL) yeniden değerlenmediğinden bina bakımından yalnızca 3.000.000 − 200.000 = 2.800.000 TL maliyet
    ve 240.000 − 20.000 = 220.000 TL amortisman esas alınır.


    **(c) Fonun kullanımı**


    - Sermayeye ilave edilen 400.000 TL: vergilendirilmez; ortaklar tarafından işletmeye ilave edilmiş kıymet sayılır ve kâr
    dağıtımı sayılmaz.

    - Başka hesaba nakledilen 100.000 TL: nakil yapılan dönem kazancı ile ilişkilendirilmeksizin o dönemde kurumlar vergisine
    tabi tutulur. Vergi: 100.000 × %25 = **25.000 TL**.


    **(d) Geçmiş dönemler**


    Hayır. Her yılın oranı yalnızca o yılın değerlemesinde kullanılabilir; değerlemenin yapılmamasından veya oranın düşük
    uygulanmasından dolayı sonraki yıllarda geçmiş dönemlere ilişkin yeniden değerleme yapılamaz (bent 8). 2026''da yalnızca
    2026 oranı kullanılabilir.

    '
