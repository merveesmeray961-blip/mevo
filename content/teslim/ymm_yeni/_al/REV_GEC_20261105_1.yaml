    alinti: 3. İktisadi kıymetlerin (2) numaralı bende göre tespit edilen değerleri ve bunlara ilişkin amortismanların, yeniden
      değerlemenin yapılacağı yıla ait olan yeniden değerleme oranı ile çarpılması suretiyle yeniden değerleme sonrası değerleri
      bulunur.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/4
    alinti: Değer artışı, iktisadi kıymetlerin yeniden değerleme sonrası ve yeniden değerleme öncesi net bilanço aktif değerleri
      arasındaki farktır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/6
    alinti: Pasifte özel bir fon hesabında gösterilen değer artışı tutarının, sermayeye ilave edilme dışında herhangi bir
      şekilde başka bir hesaba nakledilen veya işletmeden çekilen kısmı, bu işlemin yapıldığı dönem kazancı ile ilişkilendirilmeksizin
      bu dönemde gelir veya kurumlar vergisine tabi tutulur.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/6
    alinti: Sermayeye eklenen değer artışları, ortaklar tarafından işletmeye ilave edilmiş kıymetler olarak kabul edilir.
      Bu işlemler kâr dağıtımı sayılmaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: mük. 298/Ç/9
    alinti: 9. Hesap dönemi içinde aktife giren iktisadi kıymetler için aktife girdiği hesap döneminde, yeniden değerleme
      yapılmaz.
  dogrulama:
    python: 'a_m = 1200000*1.2549; a_a = 480000*1.2549

      b_m = (3000000-200000)*1.2549; b_a = (240000-20000)*1.2549

      art_a = (a_m-a_a) - (1200000-480000)

      art_b = (b_m-b_a) - (2800000-220000)

      fon = art_a + art_b

      vergi = 100000*0.25

      sonuc = {"yeni_maliyet_A": round(a_m), "yeni_amort_A": round(a_a), "art_A": round(art_a), "yeni_maliyet_B": round(b_m),
      "yeni_amort_B": round(b_a), "art_B": round(art_b), "fon": round(fon), "vergi": vergi}

      '
