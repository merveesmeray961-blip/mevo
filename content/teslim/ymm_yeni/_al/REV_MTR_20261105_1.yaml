    Şirketin geçmiş yıl zararları (hepsi ilgili yıl beyannamelerinde yıllar itibarıyla ayrı ayrı gösterilmiştir):


    | Zarar | Tutar (TL) | Açıklama |

    |---|---|---|

    | 2020 yılı zararı | 3.000.000 | Önceki yıllarda hiç mahsup edilmemiştir. |

    | 2021 yılı zararı | 2.000.000 | Mahsup edilmemiştir. |

    | 2023 yılı zararı | 1.500.000 | Mahsup edilmemiştir. |

    | 2024 yılı yurt dışı şube (A) zararı | 800.000 | A şubesinin kazançları Türkiye''de vergilenmektedir (md. 5/1-g istisnası
    yok). Faaliyet ülkesindeki yetkili denetim kuruluşu zararlı beyanı raporlamış, rapor ekleri ülke makamlarınca onaylanmış;
    rapor aslı ve tercümesi vergi dairesine ibraz edilmiştir. |

    | 2025 yılı yurt dışı şube (B) zararı | 600.000 | B şubesinin kazançları md. 5/1-g istisnasından yararlanmaktadır. Rapor
    ve tercümesi ibraz edilmiştir. |


    Delta, 2025 yılında, md. 19 ve 20/1 şartlarına uygun olarak Mor Ltd. Şti.''yi devralmıştır. Mor''un devir tarihindeki
    öz sermayesi **1.800.000 TL**, beyannamelerde gösterilen ve mahsup edilmemiş zararları **2.500.000 TL**''dir (tümü son
    beş yıl içindedir). Mor''un son beş yıla ilişkin kurumlar vergisi beyannameleri kanuni süresinde verilmiştir. Delta devralınan
    faaliyete devam etmektedir.


    **İstenenler:**


    (a) 2026 yılında kurum kazancından indirilebilecek geçmiş yıl zararlarını, indirilemeyecek olanları nedenleriyle belirtiniz.
    (7 puan)


    (b) 2026 yılı kurumlar vergisi matrahını ve hesaplanan vergiyi bulunuz. (6 puan)


    (c) Devralınan Mor zararlarından mahsup edilebilecek tutarı ve bunun için aranan şartları açıklayınız. (5 puan)


    (d) Delta, devralınan faaliyete 2028 yılında son verirse ortaya çıkacak sonucu ve 2026''da mahsup nedeniyle tahakkuk ettirilmeyen
    vergi tutarını belirtiniz. (4 puan)

    '
  cozum: '**(a) İndirilebilecek zararlar**


    Zarar, beş yıldan fazla nakledilmemek şartıyla, yıllar itibarıyla ayrı gösterilerek indirilir (md. 9/1-a). 2026 için 2021
    zararı beşinci (son) yıldır.


    | Zarar | Tutar | Sonuç | Gerekçe |

    |---|---|---|---|

    | 2020 | 3.000.000 | İndirilemez | 2021–2025 sürelerinde mahsup edilememiş; beş yıl dolmuştur |

    | 2021 | 2.000.000 | **İndirilir** | 2022–2026 süresinin son yılı |

    | 2023 | 1.500.000 | **İndirilir** | Süre içinde |

    | 2024 yurt dışı A | 800.000 | **İndirilir** | Kazançlar istisna dışı; rapor ve tercüme ibraz edilmiş (md. 9/1-b) |

    | 2025 yurt dışı B | 600.000 | İndirilemez | İstisna edilen kazançlarla ilgilidir (md. 9/1-b; md. 5/3) |

    | Mor devralınan | 2.500.000 | **1.800.000** indirilir | Devir tarihi öz sermayesini geçemez (md. 9/1-a) |


    İndirilecek toplam zarar: 2.000.000 + 1.500.000 + 800.000 + 1.800.000 = **6.100.000 TL**.


    **(b) Matrah ve vergi**


    | Adım | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı + KKEG | 10.000.000 |

    | − Kâr payı istisnası | (2.000.000) |

    | − Geçmiş yıl zararları | (6.100.000) |

    | **Matrah** | **1.900.000** |

    | Kurumlar vergisi (%25) | **475.000** |


    **(c) Devralınan zararlar**


    Mahsup edilebilecek tutar = min(2.500.000; 1.800.000) = **1.800.000 TL**. Aranan ek şartlar: (1) devralınan kurumun son
    beş yıla ilişkin kurumlar vergisi beyannamelerinin kanuni süresinde verilmiş olması, (2) devralınan kurumun faaliyetine
    devrin yapıldığı hesap döneminden itibaren en az beş yıl devam edilmesi.


    **(d) Şartların ihlali**


    Faaliyete devir yılı olan 2025''ten itibaren beş yıl (2025–2029) devam edilmesi gerektiğinden 2028''de son verilmesi şartı
    ihlal eder; mahsup nedeniyle zamanında tahakkuk ettirilmeyen vergiler için vergi ziyaı doğmuş sayılır. 2026''da mahsup
    nedeniyle tahakkuk ettirilmeyen vergi: 1.800.000 × %25 = **450.000 TL**.

    '
