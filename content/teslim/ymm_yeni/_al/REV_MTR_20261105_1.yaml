  kok: 'Tam mükellef (D) A.Ş.''nin yurt dışı faaliyetlerinden doğan zararların KVK md. 9/1-b uyarınca kurum kazancından indirilmesine
    ilişkin aşağıdaki ifadelerden hangileri doğrudur?


    I. Türkiye''de kurumlar vergisinden istisna edilen yurt dışı kazançlarla ilgili zararlar da şartlar sağlanırsa indirilir.

    II. Faaliyet ülkesinde denetim kuruluşu bulunmaması hâlinde, vergi beyannamesinin ülke makamlarından alınan örneğinin
    Türk elçilik veya konsolosluğunca onaylanıp aslı ve tercümesiyle vergi dairesine ibrazı yeterlidir.

    III. Zararın beş yıldan fazla nakledilmemesi şartı yurt dışı zararlar için aranmaz.

    IV. Türkiye''de indirilen yurt dışı zarar ilgili ülkede de mahsup edilmişse, Türkiye''deki beyannameye dahil edilecek
    yurt dışı kazanç mahsup veya gider yazılmadan önceki tutardır.'
  secenekler:
    A: Yalnız II
    B: II ve IV
    C: I ve IV
    D: I, II ve IV
    E: II, III ve IV
  dogru: B
  aciklama:
    dogru_neden: 'KVK md. 9/1-b''ye göre istisna edilen kazançlarla ilgili zararlar hariçtir (I yanlış) ve yurt dışı zararlar
      da beş yıldan fazla nakledilemez (III yanlış). Denetim kuruluşu bulunmayan ülkede onaylı beyanname örneğinin ibrazı
      yeterlidir (II doğru); ayrıca ilgili ülkede de mahsup edilen zararda Türkiye''deki beyannameye dahil edilecek yurt dışı
      kazanç, mahsup veya gider yazılmadan önceki tutardır (IV doğru). Püf noktaları: "istisna kazançla ilgili zarar" ve "beş
      yıl" sınırları sık sorulan tuzaklardır; çifte indirim önlemi için kazanç mahsuptan önceki tutarla beyana dahil edilir.'
    celdiriciler:
      A: IV de doğrudur; ilgili ülkede de mahsup edilen zarar, Türkiye'de çifte yarar sağlanmaması için kazancın mahsup öncesi
        tutarıyla beyana dahil edilir.
      C: I yanlıştır; istisna edilen kazançlarla ilgili zararlar md. 9/1-b gereği indirim konusu yapılamaz.
      D: II de doğrudur; I ise yanlıştır, istisna kazançlara ilişkin zarar indirilemez.
      E: III yanlıştır; md. 9/1-b "beş yıldan fazla nakledilmemek şartıyla" der, yurt dışı zararlar da bu süreye tabidir.
  kaynaklar:
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-b
    alinti: Türkiye’de kurumlar vergisinden istisna edilen kazançlarla ilgili olanlar hariç olmak üzere, beş yıldan fazla
      nakledilmemek şartıyla yurt dışı faaliyetlerden doğan zararlar; 1) Faaliyette bulunulan ülkenin vergi kanunlarına göre
      beyan edilen vergi matrahlarının zarar dahil, her yıl o ülke mevzuatına göre denetim yetkisi verilen kuruluşlarca rapora
      bağlanması, 2) Bu raporun aslı ile tercüme edilmiş bir örneğinin Türkiye’deki ilgili vergi dairesine ibrazı, halinde
      indirim konusu yapılır.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-b
    alinti: Faaliyette bulunulan ülkede denetim kuruluşu olmaması halinde, her yıla ait vergi beyannamesinin, o ülke yetkili
      makamlarından alınan birer örneğinin mahallindeki Türk elçilik ve konsoloslukları, yoksa orada Türk menfaatlerini koruyan
      ülkenin aynı mahiyetteki temsilcilerine onaylatılarak, aslının ve tercüme edilmiş bir örneğinin ilgili vergi dairesine
      ibrazı yeterlidir.
  - mevzuat: 5520 sayılı Kurumlar Vergisi Kanunu
    madde: md. 9/1-b
    alinti: Türkiye’de indirim konusu yapılan yurt dışı zararın, ilgili ülkede de mahsup edilmesi veya gider yazılması halinde,
      Türkiye’deki beyannameye dahil edilecek yurt dışı kazanç, mahsup veya gider yazılmadan önceki tutardır.
