  soru: '**Olay:** Hesap dönemi takvim yılı olan, ana faaliyeti imalat olan ve finans veya sigorta sektöründe bulunmayan tam
    mükellef Gökova Tekstil A.Ş.''nin 2026 yılında üç ayrı ülkede yurt dışı şubesi (iş yeri) vardır. Şubelerin kazançları
    genel sonuç hesaplarına intikal ettirilmiştir. Şirketin 2026 ticari bilanço kârı **20.000.000 TL**, KKEG tutarı **1.000.000
    TL**''dir. Kâra dahil kazançlara ilişkin bilgiler (tutarlar TL; kurumlar vergisi oranı %25, asgari kurumlar vergisi oranı
    %10):


    | Şube | Kazanç | Kazanç üzerinden yurt dışında ödenen vergi | Notlar |

    |---|---|---|---|

    | X | 4.000.000 | 400.000 | Vergi ödendiği, mahallindeki Türk konsolosluğunca tasdik edilmiş belgeyle tevsik edilmiştir.
    Kazanç Türkiye''ye transfer edilmiştir. |

    | Y | 6.000.000 | 1.200.000 | Kazanç, yıllık beyannamenin verilmesi gereken tarihe kadar Türkiye''ye transfer edilmiştir.
    |

    | Z | 2.000.000 | 400.000 | Vergi, tasdikli belgeyle tevsik edilmiştir. Kazanç beyanname verme tarihine kadar Türkiye''ye
    transfer edilmemiştir. |


    Diğer yurt içi kazançlar için istisna veya indirim yoktur; geçmiş yıl zararı bulunmamaktadır. Şirketin geçici vergi tahakkukları
    toplamı 2.400.000 TL olup bunun **2.000.000 TL**''si ödenmiştir. Kâra dahil faiz gelirleri üzerinden KVK md. 15 uyarınca
    **200.000 TL** vergi kesilmiştir.


    **İstenenler:**


    (a) Hangi şube kazançlarının md. 5/1-g istisnasından yararlanacağını nedenleriyle belirleyiniz. (7 puan)


    (b) Kurumlar vergisi matrahını ve hesaplanan kurumlar vergisini bulunuz; asgari kurumlar vergisinin sonucu etkileyip etkilemediğini
    gösteriniz. (5 puan)


    (c) Yurt dışında ödenen vergilerden mahsup edilebilecek tutarı bulunuz ve X şubesine ilişkin belgenin ibraz edilmemesi
    hâlinde sonucu açıklayınız. (5 puan)


    (d) Beyanname üzerinden ödenecek kurumlar vergisini hesaplayınız. (4 puan)


    (e) Geçici vergi ödemesi 3.500.000 TL ve md. 15 kesintisi 500.000 TL olsaydı, md. 34 kapsamında iade edilebilecek tutarı
    ve başvuru süresini belirtiniz. (3 puan)

    '
  cozum: '**(a) Md. 5/1-g şartları**


    İstisna için (1) kazancın doğduğu ülkede en az %15 gelir ve kurumlar vergisi benzeri toplam vergi yükü taşıması, (2) kazancın
    beyanname verme tarihine kadar Türkiye''ye transfer edilmesi, (3) ana faaliyeti finansman, sigorta veya menkul kıymet
    yatırımı olan kurumlarda ayrıca Türkiye''deki oran düzeyinde vergi yükü aranması gerekir (üçüncü şart imalat faaliyeti
    nedeniyle uygulanmaz).


    | Şube | Vergi yükü | Transfer | Sonuç |

    |---|---|---|---|

    | X | 400.000 / 4.000.000 = %10 (<%15) | Var | İstisna yok; Türkiye''de vergilenir |

    | Y | 1.200.000 / 6.000.000 = %20 (≥%15) | Var | **İstisna uygulanır** |

    | Z | 400.000 / 2.000.000 = %20 (≥%15) | Yok | İstisna yok; Türkiye''de vergilenir |


    **(b) Matrah ve vergi**


    | Adım | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı + KKEG | 21.000.000 |

    | − Y şubesi istisnası (md. 5/1-g) | (6.000.000) |

    | **Matrah** | **15.000.000** |

    | Hesaplanan kurumlar vergisi (%25) | **3.750.000** |


    Asgari kurumlar vergisi: md. 5/1-g istisnası md. 32/C/2''de sayılmadığından matrahtan düşülmez; 21.000.000 × %10 = 2.100.000
    TL < 3.750.000 TL olduğundan asgari vergi sonucu etkilemez.


    **(c) Yurt dışı vergi mahsubu (md. 33)**


    Yurt dışında ödenen vergiler, Türkiye''de vergilenen (istisna dışı) kazançlar için mahsup edilir. İstisnadan yararlanan
    Y şubesi vergisi (1.200.000 TL) mahsup edilemez.


    | Şube | Ödenen vergi | Sınır (kazanç × %25) | Mahsup |

    |---|---|---|---|

    | X | 400.000 | 1.000.000 | 400.000 |

    | Z | 400.000 | 500.000 | 400.000 |

    | **Toplam** | | | **800.000** |


    Vergi ödendiği md. 33/6''daki tasdikli belgelerle tevsik edilmedikçe mahsup yapılamaz. Belge tarh sırasında ibraz edilemezse
    md. 33/7-8''e göre tarhiyatın ilgili kısmı ertelenir; belge en geç bir yıl içinde ibraz edilmezse ertelenen vergi için
    gecikme zammı uygulanarak tahsil edilir.


    **(d) Ödenecek vergi**


    | Kalem | Tutar (TL) |

    |---|---|

    | Hesaplanan kurumlar vergisi | 3.750.000 |

    | − Yurt dışı vergi mahsubu | (800.000) |

    | − Geçici vergi (yalnız ödenen kısım, md. 34/4) | (2.000.000) |

    | − md. 15 kesintisi (md. 34/1) | (200.000) |

    | **Ödenecek kurumlar vergisi** | **750.000** |


    Geçici verginin ödenmeyen 400.000 TL''lik kısmı yıllık vergiden mahsup edilmez; ayrıca tahsil edilir.


    **(e) Fazla mahsup**


    Mahsup edilecek vergi: 3.500.000 + 500.000 = 4.000.000 TL; yurt dışı mahsuptan sonra kalan vergi 3.750.000 − 800.000 =
    2.950.000 TL. Fark 4.000.000 − 2.950.000 = **1.050.000 TL** vergi dairesince yazıyla bildirilir; mükellef yazıyı tebellüğ
    tarihinden itibaren **bir yıl içinde** başvurursa iade edilir, başvurmazsa alacak düşer (md. 34/5).

    '
