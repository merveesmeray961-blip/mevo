  soru: '**Olay:** Tam mükellef ve hesap dönemi takvim yılı olan **Tuna Elektronik A.Ş.**''nin 2026 yılı tam tasdik çalışmasında
    YMM, dönem sonu kapanış işlemlerini incelemektedir. Şirket finans sektöründe değildir; yıllık hesaplanan kurumlar vergisinin
    asgari kurumlar vergisinden yüksek olduğu ve başka istisna ya da indirim bulunmadığı kabul edilecektir. Veriler:


    | Kalem | Tutar (TL) |

    |---|---|

    | 2026 vergi öncesi ticari bilanço kârı | 8.000.000 |

    | Bu kâra dâhil kanunen kabul edilmeyen giderler | 1.000.000 |

    | Bu kâra dâhil, tam mükellef Y A.Ş.''nin sermayesine katılımdan elde edilen kâr payı geliri | 500.000 |

    | 193 Peşin Ödenen Vergiler ve Fonlar hesabında izlenen 2026 geçici vergi ödemeleri | 1.200.000 |


    Önceki yıllara ilişkin kurumlar vergisi beyannamelerinde, her yıl ayrı gösterilmiş olarak yer alan ve bugüne kadar hiç
    mahsup edilmemiş zararlar: 2020 yılı 700.000 TL, 2021 yılı 900.000 TL, 2023 yılı 1.100.000 TL.


    Bilançoda 500 Sermaye hesabında 10.000.000 TL, 501 Ödenmemiş Sermaye (−) hesabında 4.000.000 TL bulunmaktadır. Ortaklar
    20.12.2026''da ödenmemiş sermayenin 1.000.000 TL''sini bankaya yatırmışlar, ancak bu ödeme henüz kaydedilmemiştir.


    **İstenenler:**


    (a) 2026 yılı kurumlar vergisi matrahını, mahsup edilebilecek geçmiş yıl zararlarını gerekçesiyle belirleyerek hesaplayınız
    ve hesaplanan kurumlar vergisini bulunuz. (9 puan)


    (b) Dönem kârı vergi karşılığına ilişkin yevmiye kayıtlarını (370, 371 ve ödenecek vergi hesabıyla birlikte) yapınız ve
    ödenecek kurumlar vergisini bulunuz. (6 puan)


    (c) Sermaye ödemesinin kaydını yapınız ve bilançoda gösterilecek ödenmiş sermaye tutarını belirtiniz. (4 puan)


    (d) Dönem net kârını hesaplayınız ve kâr hesabının net kâr hesabına devrine ilişkin kaydı gösteriniz. (5 puan)

    '
  cozum: '**(a) Matrah ve vergi**


    Geçmiş yıl zararları, her yıla ilişkin tutarlar ayrı gösterilmek ve beş yıldan fazla nakledilmemek şartıyla indirilir
    (KVK md. 9/1-a). Bir hesap döneminde oluşan zarar, müteakip 5 hesap döneminde oluşacak kârlarla mahsup edilemezse mahsup
    imkânı ortadan kalkar (Tebliğ 9.1).


    | Zarar yılı | Tutar (TL) | Mahsup edilebileceği dönemler | 2026''da mahsup |

    |---|---|---|---|

    | 2020 | 700.000 | 2021–2025 | Edilemez (süre dolmuş) |

    | 2021 | 900.000 | 2022–2026 | **900.000** (son yıl) |

    | 2023 | 1.100.000 | 2024–2028 | **1.100.000** |


    Zararlar eskiden yeniye doğru mahsup edilir; mahsup edilecek toplam = 900.000 + 1.100.000 = **2.000.000 TL**.


    | Kalem | Tutar (TL) |

    |---|---|

    | Ticari bilanço kârı | 8.000.000 |

    | (+) Kanunen kabul edilmeyen giderler | 1.000.000 |

    | (−) İştirak kazancı istisnası (KVK md. 5/1-a) | (500.000) |

    | Zarar mahsubu öncesi kurum kazancı | 8.500.000 |

    | (−) Geçmiş yıl zararları | (2.000.000) |

    | **Kurumlar vergisi matrahı** | **6.500.000** |

    | Hesaplanan kurumlar vergisi (%25) | **1.625.000** |


    **(b) Vergi karşılığı kayıtları**


    - 691 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları (B) 1.625.000 / 370 Dönem Kârı Vergi ve Diğer Yasal Yükümlülük
    Karşılıkları (A) 1.625.000

    - 371 Dönem Kârının Peşin Ödenen Vergi ve Diğer Yükümlülükleri (B) 1.200.000 / 193 Peşin Ödenen Vergiler ve Fonlar (A)
    1.200.000

    - 370 (B) 1.625.000 / 371 (A) 1.200.000 / 360 Ödenecek Vergi ve Fonlar (A) 425.000


    Ödenecek kurumlar vergisi = 1.625.000 − 1.200.000 = **425.000 TL**.


    **(c) Sermaye ödemesi**


    - 102 Bankalar (B) 1.000.000 / 501 Ödenmemiş Sermaye (A) 1.000.000


    Ödenmemiş sermaye 4.000.000 − 1.000.000 = 3.000.000 TL kalır. Ödenmiş sermaye = 10.000.000 − 3.000.000 = **7.000.000 TL**.


    **(d) Net kâr**


    Dönem net kârı = 8.000.000 − 1.625.000 = **6.375.000 TL**.


    - 690 Dönem Kârı veya Zararı (B) / 692 Dönem Net Kârı veya Zararı (A) ile 691''in kapatılması sonucu 692 hesabı 6.375.000
    TL alacak bakiyesi verir.

    - 692 Dönem Net Kârı veya Zararı (B) 6.375.000 / 590 Dönem Net Kârı (A) 6.375.000

    '
