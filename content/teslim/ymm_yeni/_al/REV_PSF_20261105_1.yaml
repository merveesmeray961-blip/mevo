  soru: '**Olay:** Bilanço esasına göre defter tutan, hesap dönemi takvim yılı olan **Sedef Lojistik A.Ş.**''nin 2026 yılı
    tam tasdik çalışmasında YMM, pasif hesaplarda aşağıdaki tespitleri yapmıştır. Kayıtlarda KDV ve kanunen kabul edilmeyen
    gider etkileri dikkate alınmayacaktır; faizler ay esasıyla basit faiz olarak hesaplanacaktır; dönem kapanış kayıtları
    henüz yapılmamıştır.


    1. **Finansal kiralama:** Şirket (kiracı), forklift filosu için 1.7.2026''da 3 yıllık finansal kiralama sözleşmesi imzalamıştır.
    Kiralama konusu kıymetlerin rayiç bedeli 3.000.000 TL, sözleşmeye göre yapılacak kira ödemelerinin bugünkü değeri 2.700.000
    TL''dir. Şirket hem kullanma hakkını (253 Tesis, Makine ve Cihazlar) hem de sözleşmeden doğan borcu (301 Finansal Kiralama
    İşlemlerinden Borçlar) rayiç bedel üzerinden 3.000.000 TL olarak kaydetmiştir. Kıymetler için henüz amortisman ayrılmamıştır
    ve amortisman düzeltmesi istenmemektedir.

    2. **Banka kredisi:** 1.9.2026''da yıllık %36 faizle 4.000.000 TL kredi kullanılmıştır. Anapara ve faiz 1.9.2027''de birlikte
    ödenecek olup şirket 31.12.2026''da faiz için hiçbir kayıt yapmamıştır (eylül ayı tam ay sayılacaktır).

    3. **Peşin tahsilat:** Şirket, 1.10.2026''da bir müşteriyle 24 aylık depolama hizmeti sözleşmesi yapmış ve bedeli olan
    1.200.000 TL''yi peşin tahsil ederek tamamını 600 Yurt İçi Satışlar hesabına kaydetmiştir. Hizmet sözleşme süresince eşit
    olarak verilmektedir.

    4. **Ödenmemiş gider:** Aralık 2026''ya ait 90.000 TL tutarındaki elektrik tüketimine ilişkin fatura 12.1.2027''de gelmiş,
    şirket bu gideri 2026''da kaydetmemiştir.


    **İstenenler:**


    (a) 1 numaralı tespitte kullanma hakkı ve borcun VUK''a göre değerleme tutarını belirleyip düzeltme kaydını yapınız. (6
    puan)


    (b) 2 numaralı tespitte 31.12.2026 itibarıyla dikkate alınacak faiz tutarını hesaplayıp kaydını yapınız. (5 puan)


    (c) 3 numaralı tespitte 2026 gelirine kalacak tutarı, 380 ve 480 numaralı hesaplara aktarılacak tutarları belirleyip düzeltme
    kaydını yapınız. (8 puan)


    (d) 4 numaralı tespit için kaydı yapınız ve düzeltmelerin 2026 dönem kârına net etkisini ve kurumlar vergisi (%25) üzerindeki
    etkisini tablo hâlinde gösteriniz. (6 puan)

    '
  cozum: '**(a) Finansal kiralama (VUK mükerrer md. 290/1)**


    Kiracının kullanma hakkı ve sözleşmeden doğan borcu, kıymetin rayiç bedeli ile kira ödemelerinin bugünkü değerinden **düşük
    olanı** ile değerlenir.


    | Ölçü | Tutar (TL) |

    |---|---|

    | Rayiç bedel | 3.000.000 |

    | Kira ödemelerinin bugünkü değeri | 2.700.000 |

    | Değerleme tutarı (düşük olan) | **2.700.000** |


    Fazla kaydedilen tutar = 3.000.000 − 2.700.000 = **300.000 TL**.


    - 301 Finansal Kiralama İşlemlerinden Borçlar (B) 300.000 / 253 Tesis, Makine ve Cihazlar (A) 300.000


    Hem kıymet hem borç aynı tutarda azaldığından 2026 dönem kârına etkisi **yoktur**.


    **(b) Kredi faizi (VUK md. 285/1)**


    Kredi sözleşmesine dayanan borçlar, değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır. Faiz 4 ay
    (eylül–aralık) için tahakkuk ettirilir:


    4.000.000 × %36 × 4/12 = **480.000 TL**


    - 780 Finansman Giderleri (B) 480.000 / 381 Gider Tahakkukları (A) 480.000


    **(c) Peşin tahsil edilen hasılat (VUK md. 287; THP 380 ve 480)**


    Gelecek hesap dönemlerine ait peşin tahsil edilen hasılat pasifleştirilir. Aylık hasılat = 1.200.000 / 24 = 50.000 TL.


    | Dönem | Ay | Tutar (TL) | Yeri |

    |---|---|---|---|

    | 2026 (ekim–aralık) | 3 | 150.000 | Gelir (600) |

    | 2027 | 12 | 600.000 | 380 Gelecek Aylara Ait Gelirler (bir yıldan kısa süreye ait) |

    | 2028 (ocak–eylül) | 9 | 450.000 | 480 Gelecek Yıllara Ait Gelirler (bir yıldan uzun süreye ait) |


    Düzeltme: 600 Yurt İçi Satışlar (B) 1.050.000 / 380 Gelecek Aylara Ait Gelirler (A) 600.000 / 480 Gelecek Yıllara Ait
    Gelirler (A) 450.000


    **(d) Gider tahakkuku ve net etki**


    Cari hesap dönemine ait olup henüz ödenmemiş gider mukayyet değeriyle pasifleştirilir (VUK md. 287):


    - 770 Genel Yönetim Giderleri (B) 90.000 / 381 Gider Tahakkukları (A) 90.000


    | Düzeltme | Kâra etkisi (TL) |

    |---|---|

    | Finansal kiralama | 0 |

    | Kredi faizi | −480.000 |

    | Peşin tahsil edilen hasılat | −1.050.000 |

    | Elektrik gideri | −90.000 |

    | **Net etki** | **−1.620.000** |


    2026 ticari kârı 1.620.000 TL azalır; kurumlar vergisi (%25) 1.620.000 × %25 = **405.000 TL** azalır.

    '
