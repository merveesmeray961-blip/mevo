  dogrulama:
    python: "import datetime as dt\ngelir = 3400000\nasgari = max(200000, 2 * gelir)\neksik = asgari - 5500000\nilk = 2022\n\
      son = ilk + 4\nyeniden = son + 1 + 2\nimza = dt.date(2026, 2, 27)\nteslim = imza + dt.timedelta(days=1)\nwhile teslim.weekday()\
      \ >= 5:\n    teslim = teslim + dt.timedelta(days=1)\nilan = teslim + dt.timedelta(days=1)\nwhile ilan.weekday() >= 5:\n\
      \    ilan = ilan + dt.timedelta(days=1)\nd = dt.date(2026, 4, 9)\nsay = 0\nwhile say < 6:\n    d = d + dt.timedelta(days=1)\n\
      \    if d.weekday() < 5:\n        say = say + 1\nhafta10 = dt.date(2025, 12, 31) + dt.timedelta(weeks=10)\nsonuc = {'a_asgari':\
      \ asgari, 'a_eksik': eksik, 'b_son_donem': son, 'b_yeniden': yeniden, 'd_teslim': teslim.isoformat(), 'd_ilan': ilan.isoformat(),\
      \ 'd_bildirim': d.isoformat(), 'd_10hafta': hafta10.isoformat(), 'imza_gunu_hafta_ici': imza.weekday()}\n"
