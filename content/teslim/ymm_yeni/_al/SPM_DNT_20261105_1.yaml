klasik:
- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: DNT
  kazanimlar:
  - bağımsız denetim kuruluşlarının kuruluş şartları ve bildirim yükümlülükleri
  - sorumlu ortak baş denetçi rotasyonu
  - ara dönem finansal tabloların sınırlı bağımsız denetimi (inceleme)
  - bağımsız denetim raporunun teslim ve ilanı
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunca yetkilendirilmiş **Pusula Bağımsız Denetim A.Ş.** (Pusula),
    Kurulun listesinde yer alan bir bağımsız denetim kuruluşudur. Kurul, Pusula''nın kuruluş şartlarını taşımaya devam edip
    etmediğini ve yükümlülüklerini yerine getirip getirmediğini incelemektedir. İncelemede Sermaye Piyasasında Bağımsız Denetim
    Standartları Hakkında Tebliğ (Seri: X, No: 22) hükümleri uygulanacaktır. Tüm işletmelerin hesap dönemi takvim yılıdır;
    hafta sonları dışında resmî tatil günü yoktur.


    **I. Pusula''ya ilişkin bilgiler (bilanço tarihi 31.12.2025)**


    | Bilgi | Durum |

    |---|---|

    | Şirket türü ve pay senetleri | Anonim şirket; pay senetlerinin tamamı nama yazılıdır |

    | Sorumlu ortak baş denetçilerin toplam sermaye payı | %48 |

    | Sorumlu ortak baş denetçilerin toplam oy hakkı oranı | %60 |

    | 2025 faaliyet döneminde bağımsız denetim faaliyetinden elde edilen gelir | 3.400.000 TL |

    | Mesleki sorumluluk sigortasının tutarı (2026 poliçesi) | 5.500.000 TL |


    **II. Rotasyon.** Pusula''nın sorumlu ortak baş denetçisi **Bay (K)**, payları borsada işlem gören **Gürbüz Gıda A.Ş.**
    ile yapılan bağımsız denetim sözleşmesi kapsamında 2022, 2023, 2024 ve 2025 hesap dönemlerinin bağımsız denetim raporlarını
    imzalamıştır. Gürbüz Gıda, 2026 hesap dönemi için de (K) ile çalışmak istemektedir.


    **III. Ara dönem.** Pusula''nın müşterileri ve her birinin 30.06.2026 tarihli altı aylık ara dönem finansal tabloları
    şöyledir:


    | Müşteri | Özellik |

    |---|---|

    | Kuzeyyıldız Enerji A.Ş. | Payları Borsa İstanbul''da işlem görmektedir |

    | Ova Menkul Değerler A.Ş. | Aracı kurumdur; payları borsada işlem görmemektedir |

    | Tepe Girişim Yazılım A.Ş. | Payları, Borsa İstanbul düzenlemeleri kapsamında Gelişen İşletmeler Piyasası Listesinde
    yer almaktadır |

    | Vadi Teknoloji A.Ş. | Payları, Serbest İşlem Platformunda işlem görmektedir |

    | Dağlar Gayrimenkul Yatırım Ortaklığı A.Ş. | Payları borsada işlem görmektedir |


    **IV. Tarihler.**


    - Pusula''nın sorumlu ortak baş denetçisi, Kuzeyyıldız Enerji A.Ş.''nin 2025 yıllık finansal tablolarına ilişkin bağımsız
    denetim raporunu **27 Şubat 2026 Cuma** günü imzalamıştır. Raporun müşterinin yönetim kurulu başkanlığına teslimi ve ilan
    için gönderilmesi işlemlerinin ilgili sürelerin son gününde yapıldığı varsayılacaktır.

    - Pusula''nın ortakları ve bağımsız denetçileri hakkındaki bir değişiklik **9 Nisan 2026 Perşembe** günü gerçekleşmiştir.


    **İstenenler:**


    (a) Pusula''nın I numaralı tablodaki bilgilerini Tebliğdeki kuruluş şartları bakımından değerlendiriniz; hangi şart(lar)ın
    sağlanmadığını, sağlanması gereken asgari mesleki sorumluluk sigortası tutarını ve eksik tutarı hesaplayınız; şartların
    kaybının sonucunu belirtiniz. (8 puan)


    (b) (K)''nın Gürbüz Gıda A.Ş.''nin 2026 hesap dönemi denetim raporunu imzalayıp imzalayamayacağını, 2027 hesap dönemi
    bakımından durumunu ve (K)''nın aynı müşteride yeniden görev alabileceği ilk hesap dönemini gerekçesiyle belirtiniz. (5
    puan)


    (c) III numaralı tablodaki her müşteri için altı aylık ara dönem tablolarının inceleme (sınırlı bağımsız denetim) kapsamında
    olup olmadığını dayanağıyla belirtiniz. (6 puan)


    (d) IV numaralı bilgilere göre; raporun kesinleştiği tarihi, yönetim kurulu başkanlığına teslim için son günü, borsaya
    ve Kurula ilan için gönderme son gününü, Pusula''nın değişikliği Kurula bildirmesi gereken son günü ve Pusula''nın kendi
    2025 yıllık finansal tablolarını Kurula göndermesi gereken son günü bulunuz. (6 puan)

    '
  cozum: '**(a) Kuruluş şartları (İkinci Kısım, Birinci Bölüm, md. 3/1)**


    | Şart | Pusula | Sonuç |

    |---|---|---|

    | KGK tarafından yetkilendirilmiş olma (a) | Yetkilendirilmiştir | Sağlanıyor |

    | Anonim şirket ve hisse senetlerinin nama yazılı olması (b) | Anonim şirket, tüm paylar nama yazılı | Sağlanıyor |

    | Sermayenin **ve** oy haklarının en az %51''inin sorumlu ortak baş denetçilere ait olması (c) | Sermaye %48, oy hakkı
    %60 | **Sağlanmıyor**: oy hakkı oranı yeterli olsa da sermaye payı %51''in altındadır; iki ölçüt birlikte aranır |

    | Mesleki sorumluluk sigortası tutarının 200.000 TL''den az olmamak üzere önceki faaliyet döneminde elde edilen gelirin
    iki katından az olmaması (e) | Sigorta 5.500.000 TL | **Sağlanmıyor** |


    Sigorta hesabı: önceki faaliyet dönemi geliri 3.400.000 TL; 2 × 3.400.000 = 6.800.000 TL, 200.000 TL''den yüksek olduğundan
    asgari tutar **6.800.000 TL**. Eksik tutar = 6.800.000 − 5.500.000 = **1.300.000 TL**.


    Sonuç: Kuruluş şartlarının kaybedilmesi, Tebliğin 30 uncu maddesi (1)(a) bendi uyarınca bağımsız denetim kuruluşunun sermaye
    piyasasında bağımsız denetim faaliyetinde bulunma yetkisinin **Kurulca iptal edilebilmesi** sebebidir; ayrıca SPKn md.
    62/1 gereği Kurul, standart ve mevzuata aykırılıkları tespit edilen kuruluşları listeden çıkarmaya yetkilidir.


    **(b) Sorumlu ortak baş denetçi rotasyonu (Başlangıç Hükümleri, md. 6/4)**


    - Bir sorumlu ortak başdenetçi, bir müşteri şirketle yapılan sözleşmede her hâlükârda **en çok 5 hesap dönemi** görev
    alabilir. (K) 2022, 2023, 2024 ve 2025 dönemlerinde (4 dönem) görev yaptığından **2026 hesap dönemi 5. dönemdir**; (K)
    2026 raporunu imzalayabilir.

    - 2026 sonunda 5 dönemlik sınır dolduğundan **2027 hesap dönemi** için (K) görev alamaz.

    - (K)''nın aynı müşterinin denetim çalışmalarında yeniden görev alabilmesi için **en az 2 hesap döneminin geçmesi** zorunludur:
    2027 ve 2028 geçtikten sonra ilk uygun dönem **2029 hesap dönemidir**.


    **(c) Altı aylık ara dönem tabloları (Başlangıç Hükümleri, md. 5/2, 5/4)**


    | Müşteri | Kapsam | Dayanak |

    |---|---|---|

    | Kuzeyyıldız Enerji A.Ş. | **Kapsamdadır** | md. 5/2 (ç): sermaye piyasası araçları borsada işlem gören anonim ortaklıklar
    |

    | Ova Menkul Değerler A.Ş. | **Kapsamdadır** | md. 5/2 (a): yatırım kuruluşları (aracı kurum); payların borsada işlem
    görmesi aranmaz |

    | Tepe Girişim Yazılım A.Ş. | **Kapsam dışıdır** | md. 5/4: Gelişen İşletmeler Piyasası Listesinde yer alan işletmelerin
    altı aylık ara dönem tabloları inceleme kapsamında değildir |

    | Vadi Teknoloji A.Ş. | **Kapsam dışıdır** | md. 5/4: Serbest İşlem Platformunda işlem gören işletmeler |

    | Dağlar GYO A.Ş. | **Kapsamdadır** | md. 5/2 (b) (yatırım fonları hariç kolektif yatırım kuruluşu olan yatırım ortaklığı)
    ve (ç) (payları borsada işlem gören anonim ortaklık) |


    Bu kapsam, Kurulun finansal raporlama standartlarına ilişkin düzenlemelerindeki özel hükümler saklı kalmak kaydıyla geçerlidir
    (md. 5/2).


    **(d) Rapor ve bildirim tarihleri (İkinci Kısım, md. 23, 24, 27)**


    | Konu | Hesap | Tarih |

    |---|---|---|

    | Rapor kesinleşme (md. 23/1) | Sorumlu ortak baş denetçi imzaladığında kesinleşir | **27 Şubat 2026 (Cuma)** |

    | Yönetim kurulu başkanlığına teslim (md. 23/2) | En geç izleyen ilk iş günü mesai saati bitimi; Cumartesi-Pazar iş günü
    değildir | **2 Mart 2026 (Pazartesi)** |

    | Borsaya ve Kurula ilan için gönderme (md. 24/1) | Teslim tarihini izleyen en geç ilk iş günü mesai bitimi (teslim 2
    Mart''ta yapıldı) | **3 Mart 2026 (Salı)** |

    | Ortak/bağımsız denetçi değişikliğinin Kurula bildirimi (md. 27/1) | Değişiklik tarihinden (9 Nisan 2026) itibaren en
    geç 6 iş günü: 10, 13, 14, 15, 16, 17 Nisan | **17 Nisan 2026 (Cuma)** |

    | Pusula''nın kendi yıllık finansal tabloları (md. 27/3) | Bilanço tarihini (31.12.2025) izleyen en geç 10 hafta (70 gün)
    | **11 Mart 2026** |

    '
