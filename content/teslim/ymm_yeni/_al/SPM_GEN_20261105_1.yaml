    **1.** Kurulun hizmet birimleri 2026 başında Kanunda öngörülen sayıda daire başkanlığı şeklinde teşkilatlanmıştır (on
    iki daire). Kurul Karar Organı iki aşamalı bir yeniden yapılanma düşünmektedir: önce yeni daire başkanlıkları kurmak (7
    yeni daire önerilmektedir), ardından 5 yeni daire kurulmuş olduğu varsayımıyla mevcut daireleri kapatma veya birleştirme
    yoluyla azaltmak.


    **2.** Kurulca düzenlenen ve denetlenen üç kuruluşun 2026 yılı gelirleri aşağıdadır:


    | Kuruluş | Faaliyeti | 2026 toplam geliri | Bunun faiz geliri |

    |---|---|---|---|

    | Denizkartalı Kripto Platformu A.Ş. | Kripto varlık alım satımı | 260.000.000 TL | 20.000.000 TL |

    | Tuna Takas ve Transfer A.Ş. | Kripto varlıkların takası ve transferi | 110.000.000 TL | 10.000.000 TL |

    | Sahil Saklama A.Ş. | Yalnızca müşterilere ait kripto varlıkların veya özel anahtarlarının saklanması | 60.000.000 TL
    | 5.000.000 TL |


    **3.** Kurul üyesi **(M)** ve Kurul meslek personeli **(E)** hakkında, görevleriyle bağlantılı olarak suç işledikleri
    iddiası vardır:


    | Dosya | İddia edilen kişi(ler) |

    |---|---|

    | 1 | Yalnız (M) |

    | 2 | Yalnız (E) |

    | 3 | (M) ve (E) birlikte (iştirak hâlinde) |


    1 numaralı dosyada soruşturma izni **10 Eylül 2026**''da verilmiş ve aynı gün (M)''ye tebliğ edilmiştir; itiraz yoluna
    başvurulmamıştır. (E), hakkındaki soruşturma ve kovuşturmanın kendi seçeceği bir avukat tarafından takip edilmesini talep
    etmektedir. Türkiye Barolar Birliğince açıklanan asgari ücret tarifesinde ilgili iş için belirlenen avukatlık ücreti **30.000
    TL**''dir.


    **4.** Kurulun 2026 faaliyet yılına ilişkin faaliyet raporu hazırlanmıştır. Ayrıca (i) bir alacaklı şirket, mahkeme kararına
    dayanarak Kurulun banka hesabına haciz koydurmuştur; (ii) bir ihraççı, Kurulun verdiği idari para cezasının yerindeliğinin
    denetlenmesini talep ederek dava açmıştır.


    **İstenenler:**


    (a) 1 numaralı bilgiler bakımından, 7 yeni daire başkanlığı kurulmasının mümkün olup olmadığını, en fazla kaç yeni daire
    kurulabileceğini, 5 yeni daire kurulduktan sonra en fazla kaç dairenin kapatılabileceğini/birleştirilebileceğini ve işlemlerin
    hangi merci(ler)in katılımıyla yapılacağını açıklayınız. (6 puan)


    (b) 2 numaralı bilgiler bakımından hangi kuruluşların Kanunun platformlara yüklediği ödeme yükümlülüğüne tabi olduğunu
    tanımlara dayanarak belirtiniz; Kurul ve TÜBİTAK adına ödenecek tutarları ve ödemenin yapılacağı en son tarihi hesaplayınız.
    (7 puan)


    (c) 3 numaralı bilgiler bakımından her dosyada soruşturma izin merciini, iznin verilebilmesi için aranan şartı, 1 numaralı
    dosyada soruşturmanın en erken başlayabileceği tarihi ve (E) için Kurul bütçesinden karşılanabilecek azami avukatlık ücretini
    belirtiniz. (7 puan)


    (d) 4 numaralı bilgiler bakımından faaliyet raporunun yayım ve gönderim zamanını, haciz talebinin sonucunu ve dava konusu
    talebin yargısal niteliğini açıklayınız. (5 puan)

