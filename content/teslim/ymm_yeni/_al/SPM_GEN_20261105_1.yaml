  kazanimlar:
  - Kurul Başkan ve üyelerine ilişkin esaslar, yasaklar ve görevden ayrılma sonrası kısıtlar
  - Kurul Karar Organının çalışma esasları
  - Kurul üyeliğinin boşalması ve atama
  zorluk: 3
