  cozum: '**(a) Hizmet birimleri (md. 126/1)**


    - Kurulun hizmet birimleri **on iki** daire başkanlığından oluşur. Yeni daire başkanlıkları, Kurul Karar Organının teklifi
    ve ilgili Bakanın onayı ile **bu sayının yarısını geçmemek** kaydıyla kurulabilir: en fazla 12 / 2 = **6 yeni daire**;
    toplam en fazla 18. **7 yeni daire** kurulması mümkün değildir.

    - Daire sayısı **on ikinin altına düşmemek** kaydıyla mevcut daire başkanlıkları kapatılabilir, birleştirilebilir veya
    görev ve yetkilerinin bir kısmı yeni kurulacak dairelere verilebilir. 5 yeni daire kurulursa toplam 17 olur; en fazla
    17 − 12 = **5** daire kapatılabilir veya birleştirme yoluyla azaltılabilir.

    - Daire kurma/kapatma/birleştirme **Kurul Karar Organının teklifi ve ilgili Bakanın onayı ile** yapılır; hizmet birimleri
    Karar Organının teklifi ve Cumhurbaşkanınca yürürlüğe konulan yönetmelikle belirlenir.


    **(b) Platformlardan alınan pay (md. 130/5, md. 3/1-dd, cc)**


    - Md. 130/5 yalnızca **platformlar** için geçerlidir. Platform; kripto varlık alım satım, ilk satış ya da dağıtım, **takas,
    transfer**, bunların gerektirdiği saklama ve belirlenebilecek diğer işlemlerin bir veya daha fazlasının gerçekleştirildiği
    kuruluşlardır (md. 3/1-dd). Kripto varlık hizmet sağlayıcı tanımında ise platformlar ile kripto varlık saklama hizmeti
    sağlayan kuruluşlar ayrı ayrı sayılmıştır (md. 3/1-cc). Bu nedenle **Denizkartalı** (alım satım) ve **Tuna** (takas ve
    transfer) platformdur; yalnızca saklama hizmeti veren **Sahil Saklama** platform değildir ve md. 130/5 kapsamında ödeme
    yapmaz.

    - Matrah, bir önceki yılın **faiz gelirleri hariç** tüm gelirleridir:


    | Platform | Toplam gelir | Faiz geliri | Matrah | %1 Kurul | %1 TÜBİTAK |

    |---|---|---|---|---|---|

    | Denizkartalı | 260.000.000 | 20.000.000 | 240.000.000 | 2.400.000 | 2.400.000 |

    | Tuna | 110.000.000 | 10.000.000 | 100.000.000 | 1.000.000 | 1.000.000 |

    | **Toplam** | | | 340.000.000 | **3.400.000 TL** | **3.400.000 TL** |


    - Ödeme, ilgili yılın (2027) mayıs ayı sonuna kadar yapılır: **31 Mayıs 2027**.


    **(c) Soruşturma izni ve avukatlık ücreti (md. 133)**


    | Dosya | Soruşturma izin mercii |

    |---|---|

    | 1 – Yalnız (M) (Kurul üyesi) | **İlgili Bakan** |

    | 2 – Yalnız (E) (Kurul personeli) | **Kurul Başkanı** |

    | 3 – (M) ve (E) iştirak hâlinde | Kurul personeli hakkında da **ilgili Bakan** (iştirak hâlinde personel hakkında izin
    yetkisi Bakana aittir) |


    - İznin verilebilmesi için bu kişilerin **kendilerine çıkar sağlamak veya Kurula zarar vermek kastıyla hareket ederek
    bu işlemler sonucunda kendilerine çıkar sağlamış oldukları** hususunda **açık ve yeterli emareler** bulunması gerekir
    (md. 133/2).

    - İzin kararı ilgililere tebliğ edilir; izne ya da izin verilmemesine ilişkin karara karşı tebliğ tarihinden itibaren
    **on beş gün** içinde **Danıştay nezdinde itiraz** yoluna başvurulabilir. İtiraz süresi geçene kadar (veya itiraz hâlinde
    Danıştay hüküm kurana kadar) soruşturma başlatılamaz. 10 Eylül 2026 + 15 gün = 25 Eylül 2026 itiraz süresinin son günüdür;
    itiraz yapılmadığından soruşturma en erken **26 Eylül 2026**''da başlatılabilir.

    - Görevden ayrılmış olsalar dahi bu kişilerin talebi hâlinde vekâlet akdi yapılan bir avukat soruşturma ve kovuşturmayı
    takip eder (md. 133/3); dava giderleri ve avukatlık ücreti Kurul bütçesinden karşılanır, avukatlık ücreti tarifede belirlenen
    avukatlık ücretinin **on beş katını** aşamaz: 15 × 30.000 = **450.000 TL**.


    **(d) Şeffaflık ve yargısal denetim (md. 129, 117, 134)**


    - Yıllık faaliyet raporu, raporun ait olduğu dönemi izleyen yılın **haziran ayı sonuna kadar** Kurulun internet sitesinde
    yayınlanır ve ilgili Bakana gönderilir: 2026 faaliyet raporu için **30 Haziran 2027**. Kurul ayrıca yılda en az bir defa
    TBMM Plan ve Bütçe Komisyonuna bilgi verir (md. 129/1).

    - Kurulun para, evrak ve her türlü malları **devlet malı hükmündedir, haczedilemez ve rehnedilemez** (md. 117/5); haciz
    talebi sonuçsuz kalır.

    - Kurulun kararları **yerindelik denetimine tabi tutulamaz** (md. 117/2); idari para cezası kararına karşı açılan dava
    **idare mahkemelerinde** görülür ve bu başvurular acele işlerden sayılır (md. 134). Dava, yerindelik denetimi talebine
    yönelik olduğundan bu yönüyle incelenemez.

    '
