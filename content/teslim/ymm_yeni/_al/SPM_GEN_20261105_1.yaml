  dogrulama:
    python: 'import datetime as dt

      yemin = dt.date(2026, 3, 16)

      son = yemin + dt.timedelta(days=30)

      x_ayrilma = dt.date(2026, 5, 20)

      x_bitis = x_ayrilma.replace(year=x_ayrilma.year + 2)

      p_ayrilma = dt.date(2026, 10, 1)

      p_geri = p_ayrilma.replace(year=p_ayrilma.year - 2)

      p_bitis = p_ayrilma.replace(year=p_ayrilma.year + 2)

      inc = {''Ufuk'': dt.date(2025, 6, 15), ''Gokova'': dt.date(2025, 9, 15), ''Meltem'': dt.date(2023, 11, 15)}

      kapsam = [k for k in inc if inc[k] >= p_geri]

      vefat = dt.date(2026, 9, 3)

      atama = dt.date(vefat.year, vefat.month + 2, vefat.day)

      u2 = 4 >= 5

      u3 = 5 >= 5

      u4 = max(3, 2) >= 5

      sonuc = {''a_son_gun'': son.isoformat(), ''b_x'': x_bitis.isoformat(), ''b_p_yasak_bitis'': p_bitis.isoformat(), ''b_p_kapsam'':
      kapsam, ''c_atama'': atama.isoformat(), ''c_cekilmis'': [u2, u3, u4]}

      '
