  kazanimlar:
  - gönüllü pay alım teklifi (kısmi teklif, oransal dağıtım)
  - teklif fiyatının artırılması ve rekabetçi teklif
  - hedef ortaklık yönetim kurulu raporu ve süre uzatımı
  - teklife ilişkin kamuya açıklamalar
