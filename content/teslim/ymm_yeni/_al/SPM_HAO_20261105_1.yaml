  soru: 'Payları Borsa İstanbul''da işlem gören **Doruk Elektronik A.Ş.**''nin (Doruk) sermayesi 80.000.000 paydan (tek grup,
    nominal 1 TL, her pay bir oy) oluşmaktadır. **Zirve Yatırım Holding A.Ş.** (Zirve), Doruk''ta pay sahibi olmayıp paylarının
    %30''unu (24.000.000 pay) nakit karşılığı satın almak üzere gönüllü kısmi pay alım teklifinde bulunmuştur. Aşağıdaki tarihlerde
    resmî tatil yoktur.


    1. Zirve, 10.08.2026 (Pazartesi) günü Borsa pay piyasası işlem saatleri içinde KAP''ta "Doruk paylarının %30''u için gönüllü
    kısmi pay alım teklifinde bulunulmasına karar verilmiştir" şeklinde bir açıklama yapmıştır. Açıklamada teklif fiyatına,
    fiyatın nasıl belirleneceğine, ayrılan fona ve kaynağına yer verilmemiştir.

    2. Kurul bilgi formunu onaylamış; fiili pay alım teklifi **07.09.2026 (Pazartesi)** günü başlamıştır. Teklif süresi 15
    iş günüdür ve **25.09.2026 (Cuma)** günü sona erecek şekilde ilan edilmiştir. Fiyat 40 TL/paydır. Bilgi formuna göre satışlar
    teklif süresi sonunda toplu olarak gerçekleştirilecektir.

    3. Teklif süresi içinde toplam 36.000.000 pay için talep gelmiştir. Pay sahibi Sena Yıldırım, 15.09.2026''da 900.000 pay
    için başvurmuştur.

    4. Zirve, **24.09.2026 (Perşembe)** günü fiyatı 44 TL''ye çıkardığını Kurula bildirip kamuya açıklamıştır; kapsam değişmemiştir.
    Zirve 05.10.2026''da fiyatı 46 TL''ye çıkarmak istemektedir.

    5. Gök Holding A.Ş., Zirve''nin teklif süresi içinde 17.09.2026''da Doruk için rekabetçi teklifte bulunmuş; bilgi formu
    **18.09.2026** (Cuma) günü KAP''ta yayımlanmıştır. Gök''ün satın alma süresi **16.10.2026**''da sona erecektir. Pay sahipleri
    Aras Tekin 14.09.2026''da, Banu Sezer 21.09.2026''da Zirve''nin teklifini kabul etmiştir.

    6. Doruk yönetim kurulu, teklifi değerlendirmek üzere genel kurulu toplantıya çağırabilmek için ek süre istemektedir.


    **İstenenler**


    (a) 1 numaralı açıklamanın Tebliğ''e uygunluğunu değerlendiriniz. (5 puan)


    (b) Kısmi teklifin oransal dağıtımını, Sena Yıldırım''a satın alınacak pay adedini; fiyat artırımı için son günü, teklif
    süresinin yeni bitiş tarihini, Sena Yıldırım''a ödenecek fark tutarını ve farkın ödenmesi için son günü; Zirve''nin toplam
    ödeyeceği bedeli hesaplayınız. Zirve''nin 05.10.2026 tarihli talebini değerlendiriniz. (9 puan)


    (c) Rekabetçi teklifin Aras Tekin ve Banu Sezer''in kabulleri ile Zirve''nin teklif süresi bakımından sonuçlarını açıklayınız.
    (5 puan)


    (d) Doruk yönetim kurulunun hazırlaması gereken raporun içeriğini ve açıklanması için son günü, ek süre talebinin koşullarını
    ve sınırını belirtiniz. (6 puan)

    '
  cozum: '## (a) 10.08.2026 tarihli açıklama


    - Payları borsada işlem gören ortaklıklara ilişkin bu özel durum açıklamaları Borsa pay piyasası işlem saatleri **dışında**
    yapılır (md. 10/4); işlem saatleri içinde yapılması **aykırıdır**.

    - Teklif fiyatı veya fiyatın nasıl tespit edileceği bilgisi, teklif kararının açıklanmasıyla **eşanlı** açıklanır (md.
    10/2); eksik olduğundan **aykırıdır**.

    - Gönüllü teklife ilişkin ilk açıklamada teklif için ayrılan fon ve fonun kaynağı belirtilir (md. 20/5); eksiktir, **aykırıdır**.


    ## (b) Hesaplar


    - **Oransal dağıtım (md. 20/1):** Talep (36.000.000) teklif konusu paydan (24.000.000) fazla olduğundan oransal dağıtım
    yapılır: 24 / 36 = **2/3**. Sena Yıldırım: 900.000 × 2/3 = **600.000 pay**.

    - **Fiyat artırımı (md. 22/1):** Fiili teklif süresinin sona ermesinden bir iş günü öncesine kadar yapılabilir → 25.09.2026''dan
    bir iş günü önce **24.09.2026**; Zirve''nin 24.09 tarihli artırımı süresindedir ve geçerlidir.

    - **Süre uzaması (md. 22/4):** Satın alma süresi iki hafta uzar: 25.09.2026 + 14 gün = **09.10.2026 (Cuma)**. İki haftalık
    ek süre içinde teklifte yeni değişiklik yapılamaz → Zirve''nin 05.10.2026 tarihli (46 TL) talebi **kabul edilemez**.

    - **Fark (md. 22/3):** Önceden satanlara ödenen fiyat ile yeni fiyat arasındaki fark teklif süresinin sona ermesini takip
    eden iki iş günü içinde ödenir: 09.10 + 2 iş günü = **13.10.2026 (Salı)**. Sena için: (44 − 40) × 600.000 = **2.400.000
    TL** (toplam alacağı 44 × 600.000 = 26.400.000 TL).

    - **Toplam bedel:** 24.000.000 × 44 = **1.056.000.000 TL**.


    ## (c) Rekabetçi teklif (md. 23)


    - İlk teklif kabulünü, rekabetçi teklife ilişkin bilgi formunun yayımlanmasından önce yapmış ve ilk teklife ilişkin pay
    devri henüz gerçekleşmemiş olan pay sahibi kabulü geri alabilir (md. 23/3). **Aras Tekin** (14.09, form 18.09''dan önce;
    devir teklif süresi sonunda yapılacağından gerçekleşmemiş) kabulünü **geri alabilir**. **Banu Sezer** (21.09) form yayımından
    sonra kabul verdiğinden **geri alamaz**.

    - İlk teklifin kabul süresi rekabetçi teklifin kabul süresinden önce sona eriyorsa (09.10 < 16.10), talep üzerine ilk
    teklifin kabul süresi rekabetçi teklifin satın alma süresinin sona erdiği tarihe, yani **16.10.2026**''ya kadar uzatılabilir
    (md. 23/2).


    ## (d) Hedef ortaklık raporu ve ek süre (md. 21, 20/3)


    - Doruk yönetim kurulu; teklifte bulunanın stratejik planları, bunların ortaklığın faaliyet alanları, yerleri ve istihdam
    seviyesi üzerindeki muhtemel etkilerine ilişkin görüşleri dahil, teklife ilişkin görüşünü ve gerekçelerini içeren rapor
    düzenler (md. 21/1).

    - Rapor, en geç fiili teklife başlanmasından bir iş günü önce, yani 07.09.2026''dan bir iş günü önce **04.09.2026 (Cuma)**
    özel durum olarak kamuya açıklanır.

    - Kurul, **hedef ortaklığın başvurusu üzerine**, hedef ortaklığın teklifi değerlendirmek için genel kurulu toplantıya
    çağırmasına olanak tanımak amacıyla teklif süresini **en fazla otuz iş günü** daha uzatabilir (md. 20/3).

    '
