  cozum: '## (a) İdari sorumluluğu bulunan kişilerin işlemleri (II-15.1 md. 4/1-f, 11)


    İdari sorumluluğu bulunan kişiler yönetim kurulu üyeleri ile üye olmadığı hâlde içsel bilgilere düzenli erişen **ve**
    idari karar verme yetkisi olan kişilerdir (md. 4/1-f). Bir takvim yılında her bir kişi hesabına yapılan işlemlerin toplam
    tutarı 250.000 TL''ye ulaşmadıkça açıklama yapılmaz; toplam tutar, kişinin **tüm işlemleri toplanarak** (alım ve satım
    ayrı ayrı toplanır, netleştirilmez) hesaplanır (md. 11/2). Tutarı aşan işlemden itibaren sonraki **tüm** işlemler açıklanır
    (md. 11/4).


    - **Selim Arıkan:** Kümülatif brüt tutar: 120.000 → 210.000 (14.04) → 290.000 (09.06) → 330.000 (05.10). 250.000 TL **09.06.2026**
    işlemiyle aşılır. Açıklanacak işlemler: **09.06.2026 (80.000)** ve **05.10.2026 (40.000)**. Önceki iki işlem açıklanmaz.
    (Net hesapla 120 − 90 + 80 = 110.000 bulunması yanlıştır.)

    - **Ayşe Koral:** Yönetim kurulu üyesi olmasa da içsel bilgilere düzenli erişen ve idari karar yetkisi olan kişi olduğundan
    idari sorumluluğu bulunan kişidir (md. 4/1-f-2). Tek işlemi 260.000 TL > 250.000 TL → işlem **açıklanır**.

    - **Hasan Tekin:** İdari karar verme yetkisi bulunmadığından idari sorumluluğu bulunan kişi değildir; 300.000 TL''lik
    işlemi md. 11 kapsamında açıklama yükümlülüğü doğurmaz.


    ## (b) Erteleme (md. 6, 9)


    - İhraççı, sorumluluğu kendisine ait olmak üzere meşru çıkarlarının zarar görmemesi, yatırımcıların yanıltılmasına yol
    açılmaması ve bilginin gizli tutulabilmesi kaydıyla açıklamayı erteleyebilir (md. 6/1).

    - Ertelemenin meşru çıkarlara etkisi, yatırımcıları yanıltma riski doğurmadığı ve gizlilik için alınan tedbirler **yönetim
    kurulu kararına bağlanır**; yetki verilmişse yetki verilen kişinin **yazılı onayı** alınır (md. 6/4). Genel müdürün sözlü
    talimatı bu koşulu karşılamaz → erteleme **usule aykırıdır**.

    - İhraççı gizliliği sağlamak, bilgiye erişimi sınırlamak ve gizliliğin sağlanamaması hâlinde açıklamayı yapmakla yükümlüdür
    (md. 6/3).

    - Ertelenen bilgiye ilişkin haber çıkması hâlinde erteleme sebepleri ortadan kalkmış sayılır ve ihraççı kamuya açıklama
    yapar (md. 9/2); bu yükümlülük Kurul veya borsa uyarısı beklenmeden yerine getirilir (md. 9/1). Açıklamada erteleme kararı
    ve temelindeki sebepler belirtilir (md. 6/2). Yeşilova 17.03.2026 haberi üzerine derhal açıklama yapmalıdır.


    ## (c) Geleceğe yönelik değerlendirmeler (md. 10)


    - Açıklama zorunlu değildir; yapılacaksa yönetim kurulu kararı veya yetkili kişinin yazılı onayı gerekir; yılda **en fazla
    dört** kez yapılabilir; faaliyet raporu, özel durum açıklaması ve KAP''ta açıklanan yatırımcı sunumları bu sayıya dâhildir
    (md. 10/1-a, b).

    - 2026''da dört hak kullanılmıştır → 19.11.2026''daki rutin beşinci açıklama **yapılamaz**.

    - Önceki açıklamalarda **önemli bir değişiklik** ortaya çıktığında sayı sınırına tabi olmaksızın açıklama yapılması **zorunludur**
    (md. 10/1-b); 27.10.2026''daki fesih nedeniyle revize açıklama yapılmalı, yönetim kurulu kararı/yazılı onaya bağlanmalı
    ve farklılığın nedenleri belirtilmelidir (md. 10/1-a, c).


    ## (d) Liste ve internet sitesi


    - İçsel bilgilere düzenli erişimi olan kişiler MKK''ya bildirilir; değişiklikte **en geç iki iş günü** içinde güncelleme
    yapılır (md. 7/1). 12.10.2026 (Pazartesi) + 2 iş günü = **14.10.2026 (Çarşamba)**.

    - Özel durum açıklaması, açıklamadan sonraki iş günü içinde KAP''ta belirtilen internet sitesinde ilan edilir ve **beş
    yıl** süreyle bulundurulur (md. 24/5): 13.08.2026 (Perşembe) → en geç **14.08.2026 (Cuma)**.

    '
