  soru: '**Sedir Yatırım Menkul Değerler A.Ş.** (Sedir) hakkında 2026 yılında şu olaylar yaşanmıştır (Kanunda yer alan azami
    tazmin tutarının yeniden değerleme katsayısıyla artırımı dikkate alınmayacak, Kanunda yazılı temel tutar esas alınacaktır):


    **I. Uyuşmazlıklar.** Borsa yönetim kurulu aşağıdaki uyuşmazlıklar hakkında karar vermiştir:


    | No | Taraflar ve konu | Karara konu tutar |

    |---|---|---|

    | U1 | Müşteri Bay (K) ile Sedir: Sedir''in (K)''nın emirlerini borsaya geç iletmesi | 140.000 TL |

    | U2 | Sedir ile **Çınar Menkul Değerler A.Ş.**: Sedir''in borsada gerçekleşen işlemlere ilişkin takas yükümlülüğünü zamanında
    yerine getirmemesi | 100.000 TL |

    | U3 | Müşteri Bayan (L) ile Sedir: Sedir''in verdiği yatırım danışmanlığı tavsiyesi nedeniyle uğranıldığı ileri sürülen
    zarar | 250.000 TL |


    **II. Şikâyet yönetimi.** Sedir''in iç kontrol birimi müşteri şikâyetlerini kayıt altına almamakta, takip etmemekte ve
    sonuçlandırmamaktadır.


    **III. Birliğe üyelik.** Kurul, **Kıyı Yatırım Menkul Değerler A.Ş.**''ye yetki belgesini 12 Şubat 2026''da vermiş, Kıyı
    Türkiye Sermaye Piyasaları Birliğine (Birlik) üyelik için 20 Mayıs 2026''da başvurmuştur. **Pusula Kitle Fonlama Platformu
    A.Ş.** ise yetki belgesini 6 Ocak 2026''da almış ve Birliğe 2 Nisan 2026''da başvurmuştur.


    **IV. Birlik kararları.** Birlik yönetim kurulu Kıyı''ya ilişkin disiplin kararını Kıyı''ya 2 Mart 2026 (Pazartesi) günü,
    Pusula''ya ilişkin disiplin kararını Pusula''ya 3 Mart 2026 (Salı) günü tebliğ etmiştir. İki şirket de Kurul nezdinde
    itiraz dilekçesini 17 Mart 2026 (Salı) günü vermiştir. 2 – 17 Mart 2026 arasında resmî tatil yoktur; iş günü hesabında
    cumartesi ve pazar günleri dikkate alınmayacaktır.


    **İstenenler:**


    (a) U1, U2 ve U3 uyuşmazlıklarının çözümüne ilişkin Kanun hükmünü açıklayınız; Kurula itiraz imkânı olan karar var mı,
    belirtiniz. (8 puan)


    (b) II numaralı olayı Kanun açısından değerlendiriniz. (4 puan)


    (c) III numaralı olayda, her iki kuruluşun Birliğe başvuru süresini hesaplayarak yükümlülüğe uyup uymadıklarını ve uymayanın
    karşılaşacağı sonucu belirtiniz. (6 puan)


    (d) IV numaralı olayda, iş günü hesabını göstererek her iki itirazın süresinde olup olmadığını ve Kurulun itiraz üzerine
    vereceği kararın niteliğini belirtiniz. (5 puan)

    '
  cozum: '**(a) Borsa işlemlerinden doğan uyuşmazlıklar (md. 70/1, md. 67/1)**


    Yatırım kuruluşlarının kendi aralarında veya müşterileriyle md. 67/1''in **(b) bendindeki (emirlerin iletilmesi ve eşleştirilmesi)
    ve (c) bendindeki (gerçekleştirilen işlemlere ilişkin yükümlülüklerin zamanında yerine getirilmesi)** borsa işlemlerinden
    doğan uyuşmazlıkların çözümüne ilişkin usul ve esaslar **borsa yönetim kurullarınca** belirlenir. Anılan yönetim kurulu
    kararlarının ilişkin olduğu tutarın md. 84/5''teki tutardan (100.000 TL) **fazla** olması hâlinde karara karşı **Kurula
    itirazda bulunulabilir** (md. 70/1).


    | No | Kapsam (md. 67/1) | Tutar / 100.000 TL | Kurula itiraz |

    |---|---|---|---|

    | U1 | Emir iletimi (b) → kapsamda | 140.000 > 100.000 | **Var** |

    | U2 | İşlem yükümlülüğünün zamanında ifası (c) → kapsamda | 100.000, tutardan fazla değil (eşit) | **Yok** |

    | U3 | Yatırım danışmanlığı; (b) ve (c) bentlerindeki borsa işlemi uyuşmazlığı değil → md. 70/1 kapsamı dışında | 250.000
    > 100.000 olsa da kapsam dışı | **Yok** (md. 70/1''deki itiraz imkânı bu uyuşmazlık için geçerli değildir) |


    **(b)** Yatırım kuruluşları, yatırımcı hak ve yararlarını gözeten ve bu hizmet ve faaliyetlerden doğan **yatırımcı şikâyetlerinin
    takibi ve sonuçlanmasını sağlamak üzere gerekli iç kontrol birim ve sistemlerini oluşturmakla yükümlüdür** (md. 45/5).
    Sedir''in iç kontrol biriminin şikâyetleri kayıt altına almaması, takip etmemesi ve sonuçlandırmaması bu yükümlülüğe **aykırıdır**.


    **(c) Birliğe üyelik (md. 74/1)**


    Yatırım hizmet ve faaliyetlerinde bulunmaya yetkili kılınmış kuruluşlar ile kitle fonlama platformları Birliğe üye olmak
    için başvurmak zorundadır; yetki belgelerini almalarından itibaren **üç ay içinde** başvuruyu yapmakla yükümlüdürler.
    Yükümlülüğe uymayan kuruluşların faaliyetleri **Kurulca durdurulur** (md. 74/1).


    | Kuruluş | Yetki belgesi | Son gün (+3 ay) | Başvuru | Sonuç |

    |---|---|---|---|---|

    | Kıyı | 12.02.2026 | 12.05.2026 | 20.05.2026 (8 gün geç) | Uymamış; faaliyetleri Kurulca durdurulur |

    | Pusula | 06.01.2026 | 06.04.2026 | 02.04.2026 | Süresinde |


    **(d) Birlik kararlarına itiraz (md. 75/7)**


    Birliğin yetkili organlarınca alınan kararlara karşı, kararın ilgiliye **tebliğini izleyen on iş günü içinde Kurul nezdinde**
    itiraz edilebilir.


    | Kuruluş | Tebliğ | 10. iş günü (son gün) | İtiraz (17.03.2026) |

    |---|---|---|---|

    | Kıyı | 02.03.2026 (Pzt) | 16.03.2026 (Pzt) | **Süresi geçmiş** (1 gün) |

    | Pusula | 03.03.2026 (Sal) | 17.03.2026 (Sal) | **Süresinde** |


    (Kıyı: 3, 4, 5, 6, 9, 10, 11, 12, 13, 16 Mart; Pusula: 4, 5, 6, 9, 10, 11, 12, 13, 16, 17 Mart.) İtiraza ilişkin olarak
    Kurulca verilecek kararlar **kesindir** (md. 75/7).

    '
