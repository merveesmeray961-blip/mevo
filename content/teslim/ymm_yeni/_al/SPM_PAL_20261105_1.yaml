    **(b) Donan ve donmayan haklar**


    YTM''ye devredilen sermaye piyasası araçlarından doğan **bedelsiz pay iktisabı ve kâr payı alma hakkı dışındaki pay sahipliği
    hakları**, bunların YTM tarafından hak sahiplerine iadesine kadar **donar** (md. 83/4). Dolayısıyla genel kurulda oy kullanma
    gibi diğer haklar kullanılamaz; ancak:


    - Bedelsiz pay: 500 × %20 = **100 adet**

    - Kâr payı: 500 × 1,50 = **750 TL**


    bu haklar donmadığı için doğar.


    **(c)** YTM''nin mal varlığı amacı dışında kullanılamaz, teminat gösterilemez, **kamu alacakları için olsa dahi haczedilemez**,
    rehnedilemez, iflas masasına dâhil edilemez ve üzerine ihtiyati tedbir konulamaz (md. 83/5). YTM''nin Kanun kapsamında
    yapacağı işlemler **harçtan**, düzenleyeceği kâğıtlar **damga vergisinden müstesnadır**; YTM''nin bu kapsamdaki faaliyetleri
    dolayısıyla Kurumlar Vergisi Kanunu açısından **iktisadi işletme oluşmuş sayılmaz** (md. 83/6). Yöneticinin görüşü bütünüyle
    yanlıştır.


    **(d)** Yatırım kuruluşlarının YTM''ye katılması **zorunludur**; giriş aidatı, yıllık aidat ve ek aidat ödeme zorunlulukları
    Kurulca çıkarılacak yönetmelikle belirlenir ve aidat tutarının belirlenmesinde kuruluşların tür ve risk durumlarına göre
    **farklı esaslar da öngörülebilir** (md. 83/2); yöneticinin görüşü yanlıştır. YTM kamu tüzel kişiliğini haizdir ve Kurul
    tarafından yönetmelik çerçevesinde **idare ve temsil olunur** (md. 83/1).

    '
