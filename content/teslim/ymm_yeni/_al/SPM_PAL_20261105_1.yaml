klasik:
- id: TASLAK
  sinav: ymm
  ders: SPM
  konu: PAL
  kazanimlar:
  - borsaların kuruluşu, yöneticileri ve piyasa işleticisi ilişkisi
  - işlem durdurma, kottan çıkarma ve borsa gözetimi
  - borsa teminat ve garanti fonu varlıklarının korunması
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Ege Menkul Kıymetler Borsası A.Ş.** (Borsa) ile ilgili 2026 yılında aşağıdaki olaylar yaşanmıştır:


    1. Borsa, tahvil ve bono piyasasının işletilmesi için **Kuzeyhan Piyasa İşletim A.Ş.** (Kuzeyhan) ile 12 Ocak 2026''da
    sözleşme imzalamıştır. Sözleşme için Kurul onayı alınmamıştır; buna rağmen Kuzeyhan, Borsa adına piyasayı 1 Şubat 2026''dan
    itibaren işletmeye başlamıştır.

    2. Borsa genel müdür yardımcısı (S)''nin Kanunda yöneticiler için aranan şartları taşımadığı Kurulca tespit edilmiş ve
    görevden ayrılması 20 Nisan 2026''da Kurulca talep edilmiştir. Borsa yönetim kurulu, Borsanın özel hukuk tüzel kişisi
    olduğunu ileri sürerek talebi yerine getirmemiştir. Ayrıca bir başka yönetici (V) 3 Mart 2026''da istifa etmiş, yönetici
    değişikliği Kurula 24 Mart 2026''da bildirilmiştir.

    3. Borsa, kendi düzenlemelerindeki şartların oluşması üzerine **Zirve Tekstil A.Ş.** paylarının işlem görmesini 9 Mart
    2026''da durdurmuş, durdurmayı Kurula 12 Mart 2026''da bildirmiş, ancak kamuya herhangi bir açıklama yapmamıştır.

    4. Borsa, piyasa gözetim faaliyetlerinin bir bölümünü, faaliyet konuları arasında piyasa gözetimi bulunan **Gözlem Analitik
    A.Ş.**''den hizmet alarak yürütmektedir. Gözlem''in yazılım hatası nedeniyle bir manipülatif emir dizisi tespit edilememiş;
    Borsa "sorumluluk hizmet sağlayıcıya aittir" savunmasında bulunmuştur. Ayrıca Borsa, bir üyesinin borsa kurallarını kasıtla
    ihlal ettiğini saptamış, ancak durumu Kurula bildirmemiştir.

    5. Borsanın 2025 yılı mali denetimi, Kurulca ilan edilen listede yer almayan bir bağımsız denetim kuruluşuna yaptırılmıştır.

    6. Borsa başkanı hakkında, Kanun kapsamındaki faaliyetleri nedeniyle bir şikâyet üzerine Cumhuriyet savcılığı doğrudan
    soruşturma başlatmak istemektedir.

    7. Hazine ve Maliye idaresi, Borsanın 70 milyon TL tutarındaki kamu borcu için haciz uygulamak istemektedir. Borsa nezdinde
    (milyon TL olarak) şu varlıklar bulunmaktadır:


    | Varlık | Tutar (milyon TL) |

    |---|---|

    | Takas riskinin önlenmesi amacıyla tutulan teminatlar | 160 |

    | Oluşturulan garanti fonundaki varlıklar | 90 |

    | Borsanın serbest nakit varlıkları | 45 |

    | Borsanın mülkiyetindeki idari bina | 30 |


    **İstenenler:**


    (a) 1 ve 2 numaralı olayları 6362 sayılı Kanun''a göre değerlendiriniz; yönetici değişikliğinin bildiriminde gecikilen
    gün sayısını bulunuz. (7 puan)


    (b) 3 numaralı olaydaki işlemin hangi kısımlarının uygun, hangi kısımlarının aykırı olduğunu açıklayınız; Kurulun bu konudaki
    yetkisini belirtiniz. (5 puan)


    (c) 4, 5 ve 6 numaralı olayları Kanun açısından değerlendiriniz. (5 puan)


    (d) 7 numaralı olayda haczedilebilecek ve haczedilemeyecek varlıkları ayırarak kamu borcunun karşılanıp karşılanamayacağını,
    karşılanıyorsa artan tutarı hesaplayınız. (5 puan)

    '
  cozum: '**(a) Piyasa işleticisi anlaşması ve yöneticiler**


    - *Olay 1:* Borsa, piyasaların işletilmesi için piyasa işleticisi ile anlaşma yapabilir; ancak bu anlaşma **Kurul onayı
    olmaksızın hüküm ifade etmez** (md. 65/5). Kurul onayı alınmadığından 12 Ocak 2026 tarihli sözleşme hüküm doğurmaz; piyasa
    işleticileri Borsanın sahip olduğu hakları ancak Kurul onayı üzerine, Borsa ile yapılan anlaşma çerçevesinde kullandığından
    Kuzeyhan''ın 1 Şubat 2026''dan itibaren Borsa adına piyasayı işletmesi dayanaktan yoksundur. Uygulama aykırıdır.

    - *Olay 2 (S):* Borsa yöneticisinin Kanunda ve ilgili mevzuatta belirtilen şartları taşımadığı tespit edildiğinde Kurulca
    görevden ayrılması talep edilir ve **atamaya yetkili borsa organları bu talebi yerine getirir** (md. 65/6). Yönetim kurulunun,
    Borsanın özel hukuk tüzel kişisi olması gerekçesiyle talebi reddetmesi hukuka aykırıdır.

    - *Olay 2 (V):* Yöneticilerde değişiklik meydana gelmesi hâlinde durum **derhâl Kurula bildirilir** (md. 65/6). 3 Mart
    2026 – 24 Mart 2026 arası **21 gün** gecikilmiştir; bildirim aykırıdır.


    **(b) İşlem durdurma (md. 69)**


    | Unsur | Değerlendirme |

    |---|---|

    | Borsanın kendi düzenlemelerindeki şartlar oluştuğunda payın işlem görmesini durdurması | Uygun (md. 69/1) |

    | Durdurmanın Kurula bildirimi (9 Mart durdurma, 12 Mart bildirim = 3 gün sonra) | Aykırı: bildirim **derhâl** yapılmalıdır
    |

    | Kamuya açıklama yapılmaması | Aykırı: durdurma **kamuya da açıklanır** |


    Kurulun, sermaye piyasası araçlarının borsada işlem görmesini durdurma ve borsa kotundan çıkarma yetkisi **saklıdır**
    (md. 69/2); yani Kurul, Borsanın kararından bağımsız olarak kendisi de durdurma veya kottan çıkarma kararı verebilir.


    **(c) Gözetim, mali denetim ve soruşturma**


    - *Olay 4:* Borsalar gözetim görevlerini **dışarıdan hizmet alarak** yerine getirebilir; hizmet alınan kurumun faaliyet
    konuları arasında gözetim hususları bulunmalıdır (md. 70/3) — Gözlem bu şartı taşıdığından hizmet alınması uygundur. Ancak
    **hizmet almak, Borsanın görevleri ile ilgili sorumluluğunu ortadan kaldırmaz** (md. 70/3); Borsanın savunması yerinde
    değildir. Üyenin borsa kurallarını **kasıtla ihlal etmesi** hâlinde Borsa, durumu Kurula bildirmekle yükümlüdür (md. 65/8);
    bildirilmemesi aykırıdır.

    - *Olay 5:* Borsaların mali denetimi **Kurulca ilan edilen listede yer alan** bağımsız denetim kuruluşlarınca yapılır
    (md. 72/2); listede olmayan kuruluşa denetim yaptırılması aykırıdır.

    - *Olay 6:* Borsa başkanı, yönetim kurulu üyeleri ve üst yönetimi hakkında Kanundaki faaliyetleri nedeniyle soruşturma
    yapılabilmesi **Kurulun yazılı iznine bağlıdır** (md. 65/12); savcılık izin almadan doğrudan soruşturma başlatamaz.


    **(d) Haciz (md. 73/2)**


    Takas risklerinin önlenmesi amacıyla tutulan teminatlar ve garanti fonundaki varlıklar amaçları dışında kullanılamaz,
    **kamu alacakları için olsa dahi haczedilemez** (md. 73/2).


    | Varlık | Milyon TL | Haczedilebilir mi? |

    |---|---|---|

    | Takas teminatları | 160 | Hayır |

    | Garanti fonu | 90 | Hayır |

    | Serbest nakit | 45 | Evet |

    | İdari bina | 30 | Evet |


    Haczedilemeyecek toplam: 160 + 90 = 250 milyon TL. Haczedilebilecek toplam: 45 + 30 = 75 milyon TL. 75 ≥ 70 olduğundan
    kamu borcu haczedilebilir varlıklarla tamamen karşılanabilir; 75 − 70 = **5 milyon TL** haczedilebilir varlık artar.

    '
