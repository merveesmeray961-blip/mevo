  dogrulama:
    python: 'import datetime as dt

      gecikme_yonetici = (dt.date(2026, 3, 24) - dt.date(2026, 3, 3)).days

      gecikme_durdurma = (dt.date(2026, 3, 12) - dt.date(2026, 3, 9)).days

      teminat, garanti, serbest, bina, kamu = 160, 90, 45, 30, 70

      haczedilemez = teminat + garanti

      haczedilebilir = serbest + bina

      sonuc = {''yonetici_gecikme_gun'': gecikme_yonetici, ''durdurma_bildirim_gecikme_gun'': gecikme_durdurma, ''haczedilemez'':
      haczedilemez, ''haczedilebilir'': haczedilebilir, ''karsilanir_mi'': haczedilebilir >= kamu, ''artan'': haczedilebilir
      - kamu}

      '
