  kazanimlar:
  - kaydi sermaye piyasası araçlarının MKK nezdinde kayden izlenmesi
  - sermaye piyasası araçlarını konu alan teminat sözleşmeleri
  - temerrüt hâlinde teminatın paraya çevrilmesi ve değerleme
  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: 'Payları borsada işlem gören **Tuna Gıda A.Ş.** (Tuna) paylarının MKK nezdindeki kayıtları **Pınar Menkul Değerler
    A.Ş.** (Pınar) üyesi nezdinde izlenmektedir. Bay (E)''nin Pınar''daki hesabında Tuna''nın hamiline yazılı payları bulunmaktadır.
    Bay (E) 2026 yılında iki teminat sözleşmesi yapmıştır:


    **Sözleşme 1:** 3 Şubat 2026 tarihli, yazılı kredi teminat sözleşmesi. Teminat alan **Kızılırmak Bankası A.Ş.**, teminat
    konusu 100.000 adet Tuna payıdır. Sözleşmede payların mülkiyetinin bankaya geçip geçmeyeceği ve bankanın temerrütte payları
    mülkiyetine geçirme hakkının bulunup bulunmadığı konusunda hiçbir hüküm yoktur. Kredi alacağı 1.500.000 TL olup vadesi
    15 Haziran 2026''dır; Bay (E) ödeme yapmamıştır. Bankanın, vade tarihinde borçluya ihtar ve süre vermeden payları satarak
    alacağını karşılama ve ayrıca payları 1.500.000 TL''ye mahsuben kendi mülkiyetine alma niyeti vardır. Tuna payları 15
    Haziran 2026''da borsada günün en yüksek 18 TL, kapanış 16,50 TL fiyatından işlem görmüştür.


    **Sözleşme 2:** 20 Şubat 2026 tarihli, yazılı sözleşme. Teminat alan **Göksu Finansman A.Ş.**, konusu 40.000 adet Tuna
    payı olup sözleşmede payların mülkiyetinin sözleşme kurulduğunda Göksu''ya devredileceği açıkça yazılıdır. Bay (E)''nin
    450.000 TL''lik borcu 30 Haziran 2026''da ödenerek sözleşme sona ermiştir. Ancak Göksu hakkında mahkemece 12 Mayıs 2026''da
    tasfiye kararı verilmiş ve tasfiye makamı payların Göksu''nun tasfiye masasına dâhil olduğunu ileri sürmüştür.


    Ayrıca Tuna, Bay (E)''nin 10 Mart 2026''da sattığı 20.000 payın alıcısının, pay defterine kayıt için ayrıca başvuruda
    bulunmasını beklemektedir; bir icra dairesi ise Bay (E)''nin kalan paylarına ilişkin haciz talebini doğrudan Tuna''ya
    göndermiştir.


    **İstenenler:**


    (a) Sözleşme 1''in hukuki niteliğini (mülkiyetin kimde olduğu) belirtiniz; bankanın ihtarsız satış ve payları mülkiyetine
    geçirme niyetini değerlendiriniz. (6 puan)


    (b) Bankanın temerrüt hakkını vade tarihinde kullandığını varsayarak payların değerini ve Bay (E)''ye iade edilecek tutarı
    hesaplayınız. (6 puan)


    (c) Sözleşme 2 bakımından payların mülkiyetinin kimde olduğunu, sona ermenin sonucunu ve tasfiye makamının iddiasını değerlendiriniz.
    (5 puan)


    (d) Hamiline yazılı payların izlenmesi, pay defterine kayıt ve haciz talebinin yerine getirilmesine ilişkin işlemleri
    md. 13''e göre değerlendiriniz. (5 puan)

    '
  cozum: '**(a) Sözleşme 1**


    - MKK nezdinde kayden izlenen sermaye piyasası araçlarını konu alan teminat sözleşmeleri **yazılı şekilde** yapılır; sözleşme
    yazılıdır → şekil bakımından geçerlidir (md. 47/1).

    - Sözleşmede mülkiyet konusunda hüküm bulunmadığından teminat konusu payların **mülkiyeti teminat alana geçmemiş sayılır**
    (md. 47/1); mülkiyet **teminat veren (E)''de** kalmıştır. Dolayısıyla md. 47/3 ve 47/4(b) uygulanır.

    - Temerrüt hâlinde teminat alan, **ihbar veya ihtar, süre verme, adli/idari izin ya da açık artırma gibi hiçbir ön şartı
    yerine getirmeksizin** teminattan alacağını karşılayabilir (md. 47/4). Bankanın ihtarsız satışı **uygundur**.

    - Mülkiyet teminat verende kaldığından banka payları satarak veya **mülkiyetine geçirerek** alacağını karşılayabilir;
    ancak mülkiyetine geçirebilmesi için sözleşmede bu hakkın kullanılabileceğinin **açıkça öngörülmüş olması** gerekir (md.
    47/4(b)). Sözleşmede böyle bir hüküm bulunmadığından bankanın payları 1.500.000 TL''ye mahsuben **mülkiyetine alma niyeti
    hukuka uygun değildir**; yalnız satış yoluyla alacağını karşılayabilir.


    **(b) Değerleme ve iade**


    Kote paylarda temerrüt hâlinde doğan hakların kullanılmasında **vade tarihindeki en yüksek değer** esas alınır; alacak
    karşılandıktan sonra **arta kalan değer teminat verene iade edilir** (md. 47/4(c)).


    | Kalem | Hesap | Tutar (TL) |

    |---|---|---|

    | Payların değeri (vade tarihinde en yüksek fiyat) | 100.000 × 18 | 1.800.000 |

    | Kredi alacağı | | 1.500.000 |

    | Bay (E)''ye iade edilecek arta kalan | 1.800.000 − 1.500.000 | **300.000** |


    Kapanış fiyatının (16,50 TL × 100.000 = 1.650.000 TL; iade 150.000 TL) esas alınması yanlıştır.


    **(c) Sözleşme 2**


    - Mülkiyetin teminat alana devredildiği sözleşmelerde teminat alan, sözleşmenin kurulduğu anda payların mülkiyet hakkına
    sahip olur (md. 47/2). Dolayısıyla payların mülkiyeti sözleşme süresince Göksu''dadır.

    - Sözleşmenin sona ermesiyle Göksu, payların **veya eş değerinin mülkiyetini** teminat verene iade etmek zorundadır (md.
    47/2); Bay (E)''nin iade hakkı doğmuştur.

    - Teminat alan hakkında tasfiye kararı verilmesi hâlinde teminat olarak verilen payların ve teminat alan ile verenin hakları
    **bu karardan etkilenmez ve tasfiye makamına karşı da geçerlidir** (md. 47/5). Tasfiye makamının payları tasfiye masasına
    dâhil etme iddiası yerinde değildir; Bay (E)''nin iade hakkı tasfiye makamına karşı ileri sürülebilir.


    **(d) Kayden izleme (md. 13)**


    - Kaydi sermaye piyasası araçları, nama veya hamiline yazılı olmalarına bakılmaksızın **isme açılmış hesaplarda** izlenir
    (md. 13/2); payların hamiline yazılı olması hesabın isme açılmasına engel değildir.

    - Payların devrinin ortaklıklarca pay defterine kaydında, **ilgililerin başvurusuna gerek kalmaksızın** MKK nezdinde izlenen
    kayıtlar esas alınır (md. 13/6); Tuna''nın alıcıdan ayrıca başvuru beklemesi yersizdir.

    - Kayden izlenen payların haciz ve benzeri her türlü idari ve adli talepleri **münhasıran MKK üyeleri** tarafından yerine
    getirilir (md. 13/7); icra dairesinin talebinin Tuna''ya değil, payların kaydının tutulduğu MKK üyesine (Pınar) yöneltilmesi
    gerekir.

    '
