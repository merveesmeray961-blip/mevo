  soru: '**Ortakbahçe Kitle Fonlama Platformu A.Ş.** (Platform) nezdinde borçlanmaya dayalı kitle fonlaması kampanyası yürütmek
    isteyen **Kırlangıç Tarım Makineleri A.Ş.** (Kırlangıç; tarım makineleri üretimi yapmakta olan, anonim ortaklık türündeki
    girişim şirketi), yeni bir üretim hattı projesi için aşağıdaki talebi iletmiştir:


    | Bilgi | Değer |

    |---|---|

    | Talep edilen fon | 5.000.000 TL (borçlanma aracı karşılığı) |

    | Vade / faiz teklifi | 42 ay / yıllık %60 |

    | Vadesine en yakın biri kısa, biri uzun vadeli iki DİBS''in, kampanya süresinin başladığı tarihten bir gün önceki faiz
    oranlarının ağırlıklı ortalaması | %38 |

    | Projenin kredibilite raporunda yer alan geleceğe yönelik nakit akımlarının, raporun imzalandığı tarihteki indirgenmiş
    değeri | 9.000.000 TL |


    Bilgi formundaki toplam geri ödeme yükümlülüğü **8.000.000 TL**''dir ve geri ödeme planı şöyledir (ay, kampanya sonunda
    borçlanma aracının ihracından itibaren sayılmaktadır): 12. ay 2.000.000 TL; 24. ay 2.000.000 TL; 36. ay 1.600.000 TL;
    42. ay (vade) 2.400.000 TL.


    Kırlangıç''ın bilgi formuna esas en son tarihli finansal tablolarında (TL): aktif toplamı 15.000.000; tüm alacaklar toplamı
    6.000.000 (bunun 1.800.000''i Kurulun düzenlemelerinde tanımlanan ilişkili taraflardan olan ticari olmayan alacaklardır);
    tüm borçlar toplamı 9.000.000 (bunun 1.350.000''i ilişkili taraflara olan ticari olmayan borçlar, 1.200.000''i teknoloji
    veya üretim faaliyetinden kaynaklanmayan finansal borçlardır). Kırlangıç halka açık ortaklık değildir ve platforma başvuru
    tarihi itibarıyla itfa edilmemiş borçlanma aracı bulunmamaktadır.


    Kampanyaya katılmak isteyen yatırımcılar:

    - **K:** Nitelikli yatırımcı olmayan gerçek kişi. Platforma yıllık net gelirini 1.800.000 TL olarak beyan etmiş ve yıllık
    sınırın gelire göre belirlenmesini talep etmiştir. K, 2026 takvim yılında borçlanmaya dayalı kitle fonlaması yoluyla şimdiye
    kadar başka projelere toplam 170.000 TL yatırım yapmıştır.

    - **Dolgun Gıda A.Ş.:** Nitelikli yatırımcı olmayan bir tüzel kişidir; kampanyaya 800.000 TL ile katılmak istemektedir.


    Kampanya takvimi (projeye 5 Ocak 2026''da başvurulmuş ve kampanya süreci başlamıştır): Yatırım komitesince onaylanan bilgi
    formu **12 Ocak 2026**''da kampanya sayfasında yayımlanmıştır. Hedeflenen fon tutarına **20 Şubat 2026** günü ulaşılmış,
    son fon sağlama ödeme emri o gün saat 14.00''te verilmiştir. Toplanan fonlar emanet yetkilisi nezdindeki hesaptan **25
    Şubat 2026**''da Kırlangıç''a aktarılmıştır.


    **İstenenler:**


    (a) Faiz oranı, vade ve geri ödeme planı bakımından talebi değerlendiriniz; uygun olmayan hususlarda izin verilebilecek
    azami değerleri belirtiniz. (8 puan)


    (b) Kırlangıç''ın bu kampanyada toplayabileceği azami fon tutarını belirleyiniz; K ve Dolgun Gıda A.Ş.''nin yatırım yapabilecekleri
    azami tutarları gerekçesiyle hesaplayınız. (6 puan)


    (c) Kırlangıç''ın girişim şirketi olarak borçlanmaya dayalı kitle fonlaması yoluyla fon toplayabilmesi için aranan finansal
    tablo koşullarını değerlendiriniz. (5 puan)


    (d) Kampanya süresinin en geç hangi tarihte sona ereceğini, kampanyanın erken sonlandırılabileceği en erken anı ve fonların
    kullanımının denetimine ilişkin ilk raporun düzenleneceği tarihi, hazırlama süresinin son gününü ve raporu hazırlayacak
    organı belirtiniz. (6 puan)

    '
  cozum: '**(a) Faiz, vade ve geri ödeme planı (md. 19/5)**


    - **Faiz:** Faiz ve benzeri getiri oranı, vadesine en yakın biri kısa, biri uzun vadeli iki DİBS için kampanya süresinin
    başladığı tarihten bir gün öncesinde belirlenen faiz oranlarının ağırlıklı ortalamasının **%50 fazlasını** aşamaz: 38
    × 1,5 = **%57**. Teklif edilen %60 bu sınırı aşar; azami **%57** olabilir.

    - **Vade:** 5 yıldan fazla olamaz; 42 ay (3,5 yıl) uygundur.

    - **Geri ödeme planı:** Geri ödeme yükümlülükleri vade tarihinde tek seferde yerine getirilemez; plan dört ödemeli olduğundan
    bu kural karşılanmıştır. Ancak vadesi **üç yıldan dört yıla kadar** olan borçlanma araçlarında vade tarihinden önceki
    **son bir yıl** içinde geri ödeme yükümlülüklerinin en fazla **%30''u** yapılabilir. Son bir yıl 30.-42. aylar arasıdır;
    bu aralıkta 36. ay (1.600.000) ve 42. ay (2.400.000) ödemeleri vardır: 4.000.000 / 8.000.000 = **%50 > %30** → aykırı.
    Son bir yılda ödenebilecek azami tutar 8.000.000 × %30 = **2.400.000 TL** olup 1.600.000 TL''lik kısmın daha önceki bir
    tarihe (30. aydan önceye) alınması gerekir.


    **(b) Fon tutarı ve yatırımcı sınırları (md. 19/6, md. 18)**


    - Girişim şirketinin borçlanmaya dayalı kitle fonlaması yoluyla toplayabileceği fon tutarı, kredibilite raporundaki geleceğe
    yönelik nakit akımlarının raporun imzalandığı tarihteki indirgenmiş değerinin **%50''sinden fazla olamaz**: 9.000.000
    × %50 = **4.500.000 TL**. Talep edilen 5.000.000 TL bu sınırı 500.000 TL aşar; azami 4.500.000 TL toplanabilir. (Kurulca
    izahname muafiyeti için belirlenen ve Kurul Bülteni''nde ilan edilen ihraç sınırı da ayrıca aşılamaz; MKK kontrol eder.)

    - **K (nitelikli yatırımcı olmayan gerçek kişi):** Bir takvim yılında azami 50.000 TL; ancak bu sınır 200.000 TL''yi aşmamak
    kaydıyla yıllık net gelirin %10''u olarak uygulanabilir: 1.800.000 × %10 = 180.000 TL (< 200.000). Yıllık kalan limit:
    180.000 - 170.000 = **10.000 TL**. Bir projeye azami 20.000 TL yatırılabilir (md. 18/2). İkisinin küçüğü: **10.000 TL**.

    - **Dolgun Gıda A.Ş.:** Md. 18''deki yıllık (50.000 TL / gelirin %10''u, en çok 200.000 TL) ve proje başına (20.000 TL)
    sınırlar yalnızca **nitelikli yatırımcı olmayan gerçek kişiler** için öngörülmüştür; tüzel kişi olan Dolgun''a bu sınırlar
    uygulanmaz, 800.000 TL ile katılabilir (toplam kampanya sınırı saklı).


    **(c) Girişim şirketinin nitelikleri (md. 23/4)**


    Borçlanmaya dayalı kitle fonlamasında (4)''ün (ç) ve (d) bentlerindeki şartların sağlanması yeterlidir.

    - **(ç) bendi:** İlişkili taraflardan ticari olmayan alacaklar, tüm alacakların %20''sini ve aktif toplamının %10''unu
    geçmemelidir. Kırlangıç''ta: 1.800.000 / 6.000.000 = **%30** (sınır %20) ve 1.800.000 / 15.000.000 = **%12** (sınır %10)
    → her iki sınır da aşılmıştır, şart **sağlanmamaktadır**.

    - **(d) bendi:** İlişkili taraflara ticari olmayan borçlar tüm borçların %20''sini geçmemeli ve teknoloji/üretim faaliyetinden
    kaynaklanmayan finansal borçlar aktif toplamının %10''unu geçmemelidir. 1.350.000 / 9.000.000 = %15 (≤ %20) ve 1.200.000
    / 15.000.000 = %8 (≤ %10) → sağlanmıştır.

    - Halka açık ortaklık olmama ve itfa edilmemiş borçlanma aracının bulunmaması (md. 23/3) koşulları sağlanmıştır.

    - Sonuç: (ç) bendi şartı sağlanmadığından Kırlangıç bu hâliyle kampanya yürütemez; ilişkili taraf alacaklarını sınırların
    altına indirmesi gerekir.


    **(d) Süreler ve fon kullanım denetimi**


    - **Kampanya süresi** bilgi formunun kampanya sayfasında yayımlandığı tarihte başlar ve **60 günü geçemez** (md. 20/2):
    12 Ocak 2026 + 60 gün = **13 Mart 2026**.

    - **Erken sonlandırma:** Hedeflenen fon tutarı süre bitiminden önce toplanırsa, cayma hakkı sürelerinin tüm yatırımcılar
    bakımından sona ermesi şartıyla kampanya erken sonlandırılabilir (md. 20/5). Cayma hakkı, ödeme emrinin verilmesinden
    itibaren **48 saat** kullanılabilir (md. 20/4). Son emir 20 Şubat 2026 saat 14.00''te verildiğinden en erken **22 Şubat
    2026 saat 14.00**''te sonlandırılabilir.

    - **Fon kullanım denetimi (md. 22/4):** Borçlanmaya dayalı kitle fonlamasında toplanan fonların bilgi formundaki amaca
    uygun kullanımı **yatırım komitesi** tarafından hazırlanacak denetim raporuyla kontrol edilir (bağımsız denetim kuruluşunun
