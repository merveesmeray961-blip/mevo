  soru: '**Pusula Portföy Yönetimi A.Ş.** (Pusula), kurucusu ve yöneticisi olduğu **Pusula Fon Sepeti Fonu**''nu (Fon) yönetmektedir.
    Fon, bir fon sepeti şemsiye fonuna bağlıdır; serbest fon değildir ve katılma payları halka arz edilmektedir. 31 Mart 2026
    itibarıyla Fon''un toplam değeri **240.000.000 TL**''dir ve portföy aşağıdaki gibidir:


    | Varlık | Tutar (TL) | Açıklama |

    |---|---|---|

    | Kervan Değişken Fon | 54.000.000 | Pusula 1 Mart 2026''dan beri bu fonda alım yapmamıştır; yalnızca fon fiyatının artması
    nedeniyle oran 17 Mart 2026''da %20''yi geçmiştir |

    | Yeşilırmak Hisse Senedi Fonu | 36.000.000 | Pusula''nın elindeki pay sayısı 6.000.000; fonun pay sayısı 30.000.000 |

    | Tuna Serbest Fon | 28.800.000 | Son alım 25 Mart 2026''da Pusula tarafından yapılmıştır |

    | Çınar Borçlanma Araçları Fonu | 48.000.000 | Pusula 9 Mart 2026''da 11.000.000 pay portföye almıştır; o tarihte Çınar
    fonunun toplam pay sayısı 40.000.000''dir |

    | BIST 30 Endeks Borsa Yatırım Fonu (Türkiye''de kurulu) | 40.800.000 | |

    | Ege Fon Sepeti Fonu (başka bir portföy yönetim şirketine ait fon sepeti fonu) | 12.000.000 | |

    | Ters repo | 20.400.000 | |


    Fon''un 1 Ocak - 31 Mart 2026 dönemine (90 gün) ilişkin gider bilgileri şöyledir: Dönem için hesaplanan günlük ortalama
    fon toplam değeri **200.000.000 TL**''dir. Bu dönemde fondan karşılanan giderler: Pusula''ya ödenen yönetim ücreti 1.500.000
    TL; saklama, denetim, KAP ve diğer harcamalar 260.000 TL; portföye alınan fonlara ödenen yönetim, giriş ve çıkış ücretleri
    740.000 TL. Fon''un bilgilendirme dokümanlarında belirlenen azami fon toplam gider oranı, Tebliğ''de fon türü için öngörülen
    azami orandır. Üç aylık dönemlerin son iş günü 31 Mart 2026 Salı günüdür; Nisan 2026''nın ilk iki haftasında resmî tatil
    yoktur.


    **İstenenler:**


    (a) Fon''un portföyünü, fon sepeti fonlarına ilişkin sınırlamalar bakımından kalem kalem değerlendirerek aykırı olanları
    gerekçesiyle belirtiniz. (8 puan)


    (b) (a) şıkkında saptadığınız aykırılıklardan hangilerinin yönetici kontrolü dışındaki nedenlerle oluştuğunu belirleyiniz;
    her biri için uyum süresini ve süre içinde uyum sağlanamazsa sonucu açıklayınız. Kervan fonu bakımından uyum için tanınan
    sürenin son gününü bulunuz. (5 puan)


    (c) 1 Ocak - 31 Mart 2026 dönemi için fon toplam gider oranı kontrolünü yapınız; aşım varsa tutarını, iade süresini, sorumluları
    ve iade edilen tutarın sonraki dönemlerdeki etkisini açıklayınız. KAP''ta ilan için son günü de belirtiniz. (8 puan)


    (d) 31 Mart 2026 itibarıyla Fon için hesaplanacak Kurul ücretinin tutarını, kimin hesaplayıp kimin onaylayacağını ve yatırılma
    süresinin son gününü belirtiniz. (4 puan)

    '
  cozum: '**(a) Fon sepeti fonu sınırlamaları (md. 26)**


    Fon toplam değeri 240.000.000 TL esas alınarak:


    | Varlık | Tutar (TL) | Oran | Sınır | Sonuç |

    |---|---|---|---|---|

    | Kervan Değişken Fon | 54.000.000 | %22,5 | Tek bir fona ait katılma payı değeri fon sepeti fonunun toplam değerinin
    %20''sini aşamaz (md. 26/1-a) | **Aykırı** |

    | Yeşilırmak Hisse Senedi Fonu | 36.000.000 | %15 | %20; pay sayısı: 6.000.000 / 30.000.000 = %20 (sınır %25, md. 26/1-c)
    | Uygun |

    | Tuna Serbest Fon | 28.800.000 | %12 | Fon sepeti fonunda yer alan serbest fonların toplam değeri fon toplam değerinin
    %10''unu geçemez (md. 26/2) | **Aykırı** |

    | Çınar Borçlanma Araçları Fonu | 48.000.000 | %20 | %20''yi *aşamaz* (md. 26/1-a): tam %20 uygundur. Pay sayısı: 11.000.000
    / 40.000.000 = %27,5; sınır %25 (md. 26/1-c; portföye dahil edildiği tarihteki pay sayısı esas) | **Aykırı (pay sayısı)**
    |

    | BIST 30 Endeks BYF | 40.800.000 | %17 | %20 (borsa yatırım fonları da md. 26/1-a kapsamındadır) | Uygun |

    | Ege Fon Sepeti Fonu | 12.000.000 | %5 | Diğer fon sepeti fonlarına yatırım yapılamaz (md. 26/1-b); oran ne olursa olsun
    yasak | **Aykırı** |

    | Ters repo | 20.400.000 | %8,5 | Md. 26 bakımından ayrı bir sınır yok | - |


    Aykırılıklar: Kervan (%22,5 > %20), Tuna serbest fon (%12 > %10), Çınar''ın pay sayısı (%27,5 > %25) ve Ege fon sepeti
    fonuna yatırım yapılması.


    **(b) Yönetici kontrolü dışındaki aşımlar ve uyum süresi (md. 24/5)**


    - Yalnızca **Kervan** aşımı fiyat hareketinden kaynaklanmaktadır (Pusula ilave alım yapmamıştır). Portföydeki varlıkların
    değerinin fiyat hareketleri gibi yönetici kontrolü dışındaki nedenlerle sınırların ihlal edilmesi halinde **en geç 30
    gün içinde** uyum sağlanması zorunludur. Aşım 17 Mart 2026''da oluştuğundan son gün 17 Mart + 30 gün = **16 Nisan 2026**''dır.

    - Süre içinde uyumun sağlanması imkânsızsa veya büyük zarar doğuracaksa süre Kurulca uzatılabilir. Süre sonunda Kurula
    başvurmayan veya süre verilmesi Kurulca uygun görülmeyen fonların dönüşümü veya tasfiyesi Kurul tarafından istenebilir.

    - Tuna (Pusula''nın 25 Mart 2026 tarihli alımı), Çınar pay sayısı (Pusula''nın 9 Mart 2026 tarihli alımı) ve Ege (Pusula''nın
    tercihi) aşımları yönetici kontrolü dışında oluşmadığından 30 günlük uyum süresinden **yararlanamaz**; bu pozisyonlar
    sınırı ihlal ederek alınmıştır ve gecikmeksizin düzeltilmelidir.


    **(c) Fon toplam gider oranı kontrolü (md. 33, Ek-4)**


    - Fon sepeti fonları için Ek-4 azami oranı: günlük yüzbinde 12 (%0,012), yıllık %4,38.

    - Md. 26/3 uyarınca portföye alınan fonlara ödenen yönetim, giriş ve çıkış ücretleri fon sepeti fonunun **gider kalemi**
    olarak toplam gider oranına dahildir. Bu nedenle toplam gider: 1.500.000 + 260.000 + 740.000 = **2.500.000 TL** (alt fon
    ücretleri hariç tutulursa 1.760.000 TL olurdu; bu hatalı olur).

    - Dönem limiti: 200.000.000 × %0,012 × 90 gün = **2.160.000 TL** (aynı sonuç: 200.000.000 × %4,38 × 90/365).

    - Aşım: 2.500.000 - 2.160.000 = **340.000 TL**.

    - Md. 33/1: Aşılma tespit edilirse aşan tutar ilgili dönemi takip eden **beş iş günü içinde** fona iade edilir; iadeden
    **kurucu (Pusula) ve portföy saklayıcısı** sorumludur. Son gün 7 Nisan 2026 (1, 2, 3, 6, 7 Nisan).

    - İade edilen tutar, ilgili yıl içinde takip eden dönemlerin toplam gider oranı hesaplamasında toplam giderlerden düşülür.

    - KAP ilanı (md. 33/4): dönemin bitimini takip eden altı iş günü içinde (son gün 8 Nisan 2026) hesaplanan fon toplam gider
    oranı ve iade tutarı KAP''ta ilan edilir.


    **(d) Kurul ücreti (md. 34/1)**


    - Üçer aylık dönemlerin son iş gününde (31 Mart 2026) fon toplam değerinin yüzbinde beşi oranında ücret hesaplanır: 240.000.000
    × 5 / 100.000 = **12.000 TL**.

    - Ücreti **kurucu (Pusula) hesaplar**, **portföy saklayıcısı onaylar**; izleyen 10 iş günü içinde kurucu tarafından Kurul
    Hesabına yatırılır, dekontlar ve hesaplama tablosunun bir örneği Kurula iletilir. Son gün **14 Nisan 2026**.

    '
