  soru: 'Kurul izniyle faaliyet gösteren **Aksu Kripto Varlık Platformu A.Ş.** (Platform) hakkında 30 Haziran 2026 tarihli
    verilere dayanarak yapılan incelemede aşağıdaki bilgiler tespit edilmiştir (tutarlar TL; aksi belirtilmedikçe Tebliğ''in
    düzenlemeleri uygulanacaktır):


    **1. Özsermaye.** Platformun özsermayesi 200.000.000''dir; bunun 45.000.000''i ödenmiş sermayedir.


    **2. Özsermayeden indirilecek kalemler (hepsi bilanço verisidir):**


    | Kalem | Tutar |

    |---|---|

    | Maddi duran varlıklar (net) | 16.000.000 |

    | Maddi olmayan duran varlıklar (net) | 9.000.000 |

    | Borsada ve teşkilatlanmış piyasalarda işlem görmeyen finansal duran varlıklar | 4.000.000 |

    | Diğer duran varlıklar | 1.000.000 |

    | Ortaklardan alacaklar | 7.000.000 |

    | Sermaye açısından ilişkili bir şirketin ihraç ettiği, borsada işlem görmeyen sermaye piyasası araçları | 3.000.000 |

    | Likidite sağlayıcı kuruluş nezdinde yatırılan teminat | 10.000.000 |


    **3. Pozisyon riski hesabına konu kalemler (cari değer).** Bu tablo dışında pozisyon riskine konu kalem yoktur; net pozisyon
    hesabı yapılmamıştır:


    | Kalem | Tutar |

    |---|---|

    | Kısa vadeli kamu borçlanma araçları | 40.000.000 |

    | TEFAS''ta işlem gören, risk derecesi 3 olan yatırım fonu katılma payları | 20.000.000 |

    | BIST 100 endeksi içinde işlem gören paylar | 10.000.000 |

    | Platformun kendi portföyündeki kripto varlıklar | 25.000.000 |

    | Kısa vadeli borçlar | 100.000.000 |

    | Uzun vadeli borçlar | 30.000.000 |


    **4. Döviz.** Döviz cinsinden varlıkların TL karşılığı 90.000.000, döviz cinsinden yükümlülüklerin TL karşılığı 70.000.000''dir.


    **5. Faaliyet giderleri (2026, aylık).** Ocak-Mart toplamı 21.000.000; Nisan 8.000.000; Mayıs 9.000.000; Haziran 10.000.000.


    **6. Müşteri varlıkları.** Müşterilerin kendi cüzdanlarında bulundurmayı tercih etmediği kripto varlıkların, saklama limitlerinin
    hesabında dikkate alınacak toplam cari değeri 800.000.000''dir. Bunun 736.000.000''ü saklama kuruluşunda, 64.000.000''ü
    Platform nezdindeki cüzdanlarda saklanmaktadır. Gün içinde Platform cüzdanlarındaki oran hiçbir anda %10''u geçmemiştir.


    **İstenenler:**


    (a) Platformun asgari özsermaye ve ödenmiş sermaye şartlarına uyup uymadığını değerlendiriniz. (6 puan)


    (b) Platformun sermaye yeterliliği tabanını hesaplayınız. (5 puan)


    (c) Platformun risk karşılığı toplamını (pozisyon riski ve döviz kuru riski) hesaplayınız; sermaye yeterliliği tabanının
    sağlaması gereken asgari tutarı ve borçlanma sınırını belirleyerek Platformun bu yükümlülüklere uyup uymadığını gösteriniz.
    (9 puan)


    (d) Müşteri varlıklarının saklanmasına ilişkin sınırlara uyulup uyulmadığını değerlendiriniz; aykırılık varsa giderilmesi
    için gereken tutarı, aykırılığın giderilmesi için tanınan süreyi ve teminat mektubu usulünü açıklayınız. (5 puan)

    '
  cozum: '**(a) Özsermaye ve ödenmiş sermaye (md. 34-35)**


    - Platformların kuruluş sermayesi asgari 150.000.000 TL''dir (md. 34/1) ve özsermaye bu tutardan az olamaz (md. 35/1):
    200.000.000 ≥ 150.000.000 → **uygun**.

    - Özsermayenin her yılın altıncı ayı itibarıyla en az **%25''i** ödenmiş veya çıkarılmış sermaye olarak sağlanmalıdır
    (md. 35/2): 200.000.000 × %25 = **50.000.000 TL** gerekir. Ödenmiş sermaye 45.000.000 (%22,5) olduğundan 30 Haziran 2026
    itibarıyla **5.000.000 TL eksik, şart sağlanmamaktadır.**


    **(b) Sermaye yeterliliği tabanı (md. 36/1)**


    Platformun sermaye yeterliliği tabanı, özsermayeden duran varlıklar (md. 36/1-a), ortak/ilişkili alacaklar ve ilişkili
    kişilerce ihraç edilmiş borsada işlem görmeyen araçlar (md. 36/1-b) ve likidite sağlayıcı nezdindeki teminat (md. 36/1-c)
    indirilerek bulunur:


    | Kalem | Tutar (TL) |

    |---|---|

    | Özsermaye | 200.000.000 |

    | (-) Maddi duran varlıklar | 16.000.000 |

    | (-) Maddi olmayan duran varlıklar | 9.000.000 |

    | (-) Borsada işlem görmeyen finansal duran varlıklar | 4.000.000 |

    | (-) Diğer duran varlıklar | 1.000.000 |

    | (-) Ortaklardan alacaklar | 7.000.000 |

    | (-) İlişkili kişi ihraçlı, borsada işlem görmeyen araçlar | 3.000.000 |

    | (-) Likidite sağlayıcı teminatı | 10.000.000 |

    | **Sermaye yeterliliği tabanı** | **150.000.000** |


    **(c) Risk karşılığı, asgari yükümlülük ve borçlanma sınırı**


    *Pozisyon riski (md. 44/3):* Özsermayeden indirilen kalemler için pozisyon riski hesaplanmaz (md. 44/5); kalan kalemler:


    | Kalem | Tutar (TL) | Oran | Risk (TL) |

    |---|---|---|---|

    | Kısa vadeli kamu borçlanma araçları | 40.000.000 | %2 | 800.000 |

    | TEFAS fonu (risk derecesi 3) | 20.000.000 | %2 | 400.000 |

    | BIST 100 payları | 10.000.000 | %10 | 1.000.000 |

    | Kendi portföyündeki kripto varlıklar | 25.000.000 | %30 | 7.500.000 |

    | Kısa vadeli borçlar | 100.000.000 | %3 | 3.000.000 |

    | Uzun vadeli borçlar | 30.000.000 | %5 | 1.500.000 |

    | **Pozisyon riski toplamı** | | | **14.200.000** |


    *Döviz kuru riski (md. 46):* Net döviz pozisyonu = 90.000.000 - 70.000.000 = 20.000.000. Sermaye yeterliliği tabanının
    %2''si = 150.000.000 × %2 = 3.000.000. Aşan kısım 17.000.000''in %8''i = **1.360.000 TL**.


    *Risk karşılığı toplamı (md. 43):* 14.200.000 + 1.360.000 = **15.560.000 TL**.


    *Asgari yükümlülük (md. 38):* Sermaye yeterliliği tabanı hem risk karşılığı toplamından hem de raporlama tarihinden önceki
    **son üç ayda oluşan faaliyet giderlerinden** az olamaz. Son üç ay (Nisan-Haziran) giderleri yalnızca bu aylar içinde
    oluşan giderlerdir (kümülatif Ocak-Haziran toplamı değil): 8.000.000 + 9.000.000 + 10.000.000 = **27.000.000 TL**. Asgari
    taban = en az 27.000.000 TL (15.560.000''den büyük olan). Taban 150.000.000 ≥ 27.000.000 → **sağlanıyor**.


    *Borçlanma sınırı (md. 39):* Bilançodaki tüm kısa ve uzun vadeli borçlar toplamı sermaye yeterliliği tabanının üç katını
    aşamaz: üst sınır 3 × 150.000.000 = 450.000.000; borçlar 100.000.000 + 30.000.000 = 130.000.000 ≤ 450.000.000 → **sınır
    aşılmamıştır.**


    **(d) Saklama limitleri (md. 41, md. 48)**


    - Müşterilerin kendi cüzdanlarında bulundurmayı tercih etmedikleri kripto varlıkların asgari **%95''i** saklama kuruluşunda
    saklanır; saklama kuruluşunda saklanmayan azami %5''lik kısım platform cüzdanlarında bulunabilir (md. 41/1). Gün içinde
    platform cüzdanlarındaki oran %10''u geçemez (md. 41/2).

    - Saklama kuruluşunda: 736.000.000 / 800.000.000 = **%92** (< %95); platform cüzdanlarında 64.000.000 = **%8** (> %5).
    Gün içi %10 sınırı aşılmadığından derhal aktarım zorunluluğu doğmamıştır; ancak mutabakat saati itibarıyla %95/%5 oranının
    sağlanması gerekir.

    - Gereken saklama kuruluşunda tutar: 800.000.000 × %95 = 760.000.000; **24.000.000 TL** tutarındaki kripto varlığın saklama
    kuruluşuna aktarılması gerekir (platform cüzdanlarında kalabilecek azami tutar 40.000.000).

    - Md. 48/1: 41. maddeye aykırılık halinde aykırılığın giderilmesi için aykırılığın ortaya çıktığı tarihten başlamak üzere
    **otuz iş günü** süre verilir. Aykırılığın tespitinden itibaren **dört iş günü içinde** şekli ve içeriği Kurulca belirlenen
    **teminat mektubu** kullanılabilir; teminat mektubu yükümlülük yerine getirilene kadar ilgili bankada bloke edilir, blokaj
    süresi **üç ayı geçemez**; giderme işlemlerine başlanmış olmak kaydıyla üç aylık süre tamamlanmadan ek süre talep edilirse
    Kurulca **üç ay daha** uzatılabilir.

    '
