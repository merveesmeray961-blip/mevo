  soru: '**Olay:** Tam mükellef, bilanço esasına göre defter tutan ve hesap dönemi takvim yılı olan **Alfa Gıda A.Ş.**, kayıtlarını
    Türk lirasıyla tutmaktadır; altın-gümüş alım satımı yapmamakta ve aşağıdaki kıymetlerden hiçbirini sat-kirala-geri al
    işlemine ya da kira sertifikası ihracına konu etmemiştir. Şirket, 31.12.2025 tarihli bilançosunda yer alan amortismana
    tabi iktisadi kıymetlerini VUK mükerrer md. 298/Ç uyarınca yeniden değerlemek istemektedir. 2025 yılı yeniden değerleme
    oranı %25,49''dur.


    | Kıymet | Aktife giriş | Maliyet (TL) | Birikmiş amortisman (TL) | Açıklama |

    |---|---|---|---|---|

    | Makine | 2022 | 2.000.000 | 1.200.000 | Normal amortisman oranı %10 |

    | Fabrika binası | 2023 | 5.000.000 | 800.000 | Maliyete 2024''te eklenen 300.000 TL kredi faizi ve kur farkı dahildir;
    bunlara isabet eden birikmiş amortisman 30.000 TL''dir |

    | Demirbaş | 15.03.2024 | 100.000 | 20.000 | Normal oran %20; 2025 yılında hiç amortisman ayrılmamıştır |

    | Binek otomobil | 10.10.2025 | 600.000 | 30.000 | İşletme faaliyeti araç kiralama değildir |

    | Boş arsa | 2021 | 3.000.000 | - | - |


    Şirket 2026 yılında, yeniden değerleme sonucu pasifte oluşan özel fon hesabından şu işlemleri yapmıştır: 400.000 TL sermayeye
    ilave edilmiş, 150.000 TL geçmiş yıl zararlarına mahsup edilmiş, 100.000 TL ortaklara dağıtılmıştır.


    **İstenenler:**


    (a) Yeniden değerlemeye konu edilebilecek ve edilemeyecek kıymetleri gerekçeleriyle belirtiniz. (5 puan)


    (b) Yeniden değerleme sonrası kıymetlerin maliyet ve birikmiş amortisman tutarlarını, kıymet bazında değer artışını ve
    pasifte özel fon hesabında gösterilecek toplam tutarı hesaplayınız. (10 puan)


    (c) Makinenin 2026 yılı amortisman tutarını yeniden değerleme sonrası değer üzerinden hesaplayınız. (3 puan)


    (d) Fon hesabında yapılan 2026 yılı işlemlerinin vergisel sonucunu açıklayarak vergiye tabi tutulacak tutarı belirleyiniz.
    (7 puan)

    '
  cozum: '**(a) Kapsam**


    Yeniden değerleme, enflasyon düzeltmesi şartlarının gerçekleşmediği hesap dönemi sonunda yapılabilir. VUK geçici md. 37
    uyarınca 2025 hesap dönemi için şartlar oluşsa bile mali tablolar enflasyon düzeltmesine tabi tutulmaz ve bu dönem, mükerrer
    md. 298/Ç bakımından "şartların gerçekleşmediği dönem" sayılır; dolayısıyla 31.12.2025 itibarıyla yeniden değerleme yapılabilir.


    | Kıymet | Durum | Gerekçe |

    |---|---|---|

    | Makine | Yapılır | Amortismana tabi iktisadi kıymettir. |

    | Fabrika binası | Yapılır; ancak 300.000 TL faiz/kur farkı ve bunlara isabet eden 30.000 TL amortisman kapsam dışı |
    Aktifleştirildiği hesap dönemi (2023) dışında maliyete eklenen faiz ve kur farkları (isabet eden amortismanlar dahil)
    kapsama girmez (Ç/1). |

    | Demirbaş | Yapılır; 2025 amortismanı ayrılmış varsayılır | Amortismanın bir yıl yapılmamış olması hâlinde esas tutar,
    amortismanlar tam ayrılmış varsayılarak belirlenir (Ç/2). |

    | Binek otomobil | Yapılamaz | Hesap dönemi içinde (10.10.2025) aktife giren kıymet için o dönemde yeniden değerleme yapılmaz
    (Ç/9). |

    | Boş arsa | Yapılamaz | Boş arsa amortismana tabi değildir (md. 314); Ç fıkrası yalnız amortismana tabi kıymetleri kapsar.
    |


    **(b) Hesaplama** (oran 1,2549)


    | Kıymet | Esas maliyet | Esas amortisman | Yeni maliyet | Yeni amortisman | Değer artışı |

    |---|---|---|---|---|---|

    | Makine | 2.000.000 | 1.200.000 | 2.509.800 | 1.505.880 | 203.920 |

    | Fabrika binası | 4.700.000 | 770.000 | 5.898.030 | 966.273 | 1.001.757 |

    | Demirbaş | 100.000 | 40.000 (tam ayrılmış varsayım) | 125.490 | 50.196 | 15.294 |

    | **Toplam** | | | | | **1.220.971** |


    Değer artışı = yeniden değerleme sonrası net bilanço aktif değeri − öncesi net bilanço aktif değeri. Binanın kapsam dışı
    kalan 300.000 TL''si ve 30.000 TL amortismanı aynen kalır (bina yeni toplamı: maliyet 6.198.030; amortisman 996.273).
    Pasifte özel fon hesabında gösterilecek tutar **1.220.971 TL**''dir; her kıymete isabet eden artış ayrıntılı izlenir.


    **(c) 2026 amortismanı**


    Yeniden değerlemeye tabi tutulan kıymetler, yeniden değerleme sonrası değerleri üzerinden amortismana devam eder (Ç/5):
    2.509.800 × %10 = **250.980 TL**.


    **(d) Fonun kullanımı**


    - Sermayeye ilave edilen 400.000 TL vergilendirilmez; bu tutar ortaklarca işletmeye ilave edilmiş kıymet sayılır ve kâr
    dağıtımı sayılmaz.

    - Sermayeye ilave dışında başka bir hesaba nakledilen (geçmiş yıl zararına mahsup 150.000 TL) veya işletmeden çekilen
    (ortaklara dağıtım 100.000 TL) kısım, işlemin yapıldığı dönem kazancıyla ilişkilendirilmeksizin o dönemde kurumlar vergisine
    tabi tutulur (Ç/6). Enflasyon fark hesaplarından farklı olarak yeniden değerleme fonunun zarara mahsubu vergiden istisna
    değildir.

    - Vergiye tabi tutulacak tutar = 150.000 + 100.000 = **250.000 TL**.

    '
