    (b) A makinesine ilişkin geçici hesaptaki kârın yeni makinenin amortismanlarına mahsubu sonucunda 2027 ve 2028 yıllarında
    gider olarak dikkate alınacak amortisman tutarlarını hesaplayınız. (7 puan)


    (c) B makinesine ilişkin geçici hesaptaki kârdan mahsup edilemeyen fazlalığı ve hangi yılın kâr ve zarar hesabına ekleneceğini
    belirleyiniz. (6 puan)


    (d) Bina ve emtia için alınan sigorta tazminatlarının vergisel sonuçlarını açıklayınız. (7 puan)

    '
  cozum: '**(a) A makinesi**


    - Envanter değeri = 3.000.000 − 1.200.000 = 1.800.000 TL; satış kârı = 2.500.000 − 1.800.000 = **700.000 TL**.

    - Bilanço esasına göre defter tutan mükellef; satılan kıymetin yenilenmesi veya benzer bir kıymetin iktisabı işin niteliğine
    göre zorunlu bulunur veya işletmeyi idare edenlerce karar verilip teşebbüse geçilirse kârı, satış tarihini izleyen **üçüncü
    takvim yılının sonuna (31.12.2029)** kadar pasifte geçici hesapta tutabilir (md. 328/4-a). Bu sürede yenileme gerçekleşmezse
    kâr, satışın yapıldığı yılı izleyen üçüncü takvim yılının (2029) kâr ve zarar hesabına eklenir.


    **(b) Mahsup**


    Geçici hesaptaki kâr, yeni kıymetin ayrılacak amortismanlarına mahsup edilir. Yeni makinenin yıllık amortismanı 4.000.000
    × %10 = 400.000 TL''dir.


    | Yıl | Amortisman | Kârdan mahsup | Kalan kâr | Gider olarak dikkate alınacak amortisman |

    |---|---|---|---|---|

    | 2027 | 400.000 | 400.000 | 300.000 | **0** |

    | 2028 | 400.000 | 300.000 | 0 | **100.000** |


    Mahsup tamamlandıktan sonra amortismana normal şekilde devam edilir (2029 ve izleyen yıllarda 400.000 TL).


    **(c) B makinesi**


    Satış kârı = 1.900.000 − 1.000.000 = 900.000 TL. Geçici hesaptaki kâr, yerine iktisap edilen yeni kıymetin amortisman
    ayrılabilecek tutarından (600.000 TL) fazla olduğundan fazlalık 900.000 − 600.000 = **300.000 TL**''dir. Bu fazlalık,
    satışın yapıldığı yılı izleyen üçüncü takvim yılının, yani **2029** yılının kâr ve zarar hesabına eklenir (md. 328/4-c);
    kalan 600.000 TL yeni makinenin amortismanlarına mahsup edilir.


    **(d) Sigorta tazminatları**


    - **Bina (md. 329):** Net değer = 5.000.000 − 1.000.000 = 4.000.000 TL; tazminat fazlası = 4.600.000 − 4.000.000 = **600.000
    TL**. Yenilenme zorunlu veya karar verilip teşebbüse geçildiğinden bu fazlalık, tazminatın alındığı tarihi izleyen üçüncü
    takvim yılının (2029) sonuna kadar pasifte geçici hesapta tutulabilir; bu sürede yenileme gerçekleşmezse (veya 2029 sonundan
    önce işin terki, devri ya da tasfiye olursa o yıl) geçici hesaptaki tutar kâr ve zarar hesabına eklenir.

    - **Emtia (md. 330):** Emtia için alınan sigorta tazminatı değerinden fazla olduğundan fazlalık (950.000 − 800.000 = **150.000
    TL**) doğrudan **kâra alınır**; amortismana tabi kıymetler için öngörülen geçici hesapta tutma imkânı emtia için yoktur.

