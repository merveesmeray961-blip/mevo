    (b) X mamulü için emsal bedeli ölçüsünün uygulanıp uygulanamayacağını denetleyiniz; uygulanabiliyorsa emsal bedelini,
    X mamulünün envanter değerini ve değer düşüklüğünü hesaplayınız. (9 puan)


