    Şirket mamule isabet eden genel idare giderlerini maliyete katmamaktadır. X mamulünün değerleme gününde satış fiyatı 400
    TL/adettir. X mamulünün aylık satışları: Aralık 2026''da 200 adet (adet başına 400 TL); Kasım 2026''da iki parti hâlinde
    100 adet 360 TL''den ve 200 adet 390 TL''den.


    **Mamul Y:** Maliyet bedeli 200.000 TL; değerleme gününde toplam satış bedeli 184.000 TL''dir.


    **Mamul Z:** Maliyet bedeli 150.000 TL''dir; mal piyasada talep görmediğinden değerleme ayı ile önceki iki ayda hiç satış
    yapılmamış, değerleme gününde satış bedelinin maliyetten %20 düşük olduğu anlaşılmıştır. Şirketin muhasebe müdürü, emsal
