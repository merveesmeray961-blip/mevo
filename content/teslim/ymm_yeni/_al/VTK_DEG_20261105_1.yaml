    Maliyet bedeli, iktisap ve ödemelerle bunlara müteferri giderlerin toplamıdır. Mevcut bir binanın satın alınarak yıkılmasından
    ve arsasının tesviyesinden doğan giderler ile tapu ve noter giderleri maliyet bedeline dahil edilir; gayrimenkullerle
    doğrudan ilgili olup envantere alındığı hesap dönemi sonuna kadar alınan hibeler ise maliyet bedelinden indirilir (md.
    262).


    10.000.000 + 400.000 + 100.000 + 200.000 − 500.000 = **10.200.000 TL**


    **(b) Makine**


    | Unsur | Tutar (TL) | Maliyete |

    |---|---|---|

    | Alış bedeli | 3.000.000 | Dahil |

    | Gümrük vergisi | 250.000 | Dahil (md. 262/a) |

    | Gümrük komisyonu | 20.000 | Dahil |

    | Nakliye | 80.000 | Dahil |

    | Montaj | 70.000 | Dahil |

    | Değer tespit ve danışmanlık | 30.000 | Dahil (md. 262/b) |

    | Envantere kadar depolama ve sigorta | 40.000 | Dahil (md. 262/ç) |

    | Envantere alındıktan sonraki sigorta | 25.000 | Dahil değil; dönem gideri |

    | İndirilemeyecek KDV | 60.000 | İhtiyari; genel gider yazıldığından dahil değil |

    | **Maliyet bedeli** | **3.490.000** | |


    İndirilemeyecek KDV maliyete eklenseydi (md. 262 son fıkralar: mükellefler serbesttir) maliyet bedeli 3.490.000 + 60.000
    = **3.550.000 TL** olurdu.


    **(c) Kiracının giderleri**


    - Normal bakım ve onarım (80.000 TL) dönem gideridir.

    - Kıymeti devamlı olarak artıran 600.000 TL kiracı tarafından yapıldığından özel maliyet bedeli olarak ayrıca değerlenir
    (md. 272/3) ve kira süresine göre eşit yüzdelerle itfa edilir (md. 327). Süre 5 yıl olduğundan yıllık itfa oranı %20,
    yıllık itfa payı 600.000 × %20 = **120.000 TL** (2026: 120.000 TL; 2027: 120.000 TL).


    **(d) Boşaltma**


    Kira süresi dolmadan boşaltılması hâlinde henüz itfa edilmemiş giderler boşaltma yılında bir defada gider yazılır (md.
    327). 2026 ve 2027''de 240.000 TL itfa edilmiştir; itfa edilmemiş kalan 600.000 − 240.000 = **360.000 TL** 2028 yılında
    gider yazılır (bu tutar 2028''in normal itfa payı olan 120.000 TL''yi de kapsar).

    '
