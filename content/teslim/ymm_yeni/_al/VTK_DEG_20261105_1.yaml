  soru: '**Olay:** Bilanço esasına göre defter tutan, hesap dönemi takvim yılı olan **Beta Mobilya A.Ş.** (faaliyeti binek
    otomobil kiralama değildir) amortismana tabi kıymetleri için aşağıdaki işlemleri yapmıştır. Şirket gün esasına göre amortisman
    uygulamasını seçmemiştir.


    1. **Makine:** 2023 yılı başında aktife alınan 1.400.000 TL maliyetli makinenin Maliye Bakanlığınca ilan edilen normal
    amortisman oranı %10''dur. Şirket 2023 ve 2024 yıllarında azalan bakiyeler usulünü uygulamış, 2025 hesap dönemine ilişkin
    kurumlar vergisi beyannamesinde normal amortisman usulüne geçtiğini belirtmiştir (beyanname 30.04.2026''da verilmiştir).

    2. **Bilgisayar sistemi:** 02.01.2026''da aktife alınan 800.000 TL maliyetli sistemin normal amortisman oranı %33,33''tür
    (süre 3 yıl). Şirket bu kıymet için azalan bakiyeler usulünü seçmiştir.

    3. **Binek otomobil:** 20.09.2026''da aktife alınan 1.800.000 TL maliyetli otomobil için normal oran %20''dir (süre 5
    yıl).

    4. **Taşıma bandı:** Hazine ve Maliye Bakanlığınca faydalı ömrü 8 yıl olarak ilan edilmiş bir bandı şirket 2026''da aktife
    almıştır.


    **İstenenler:**


    (a) Makinenin 2023, 2024 ve 2025 yılı amortisman tutarlarını hesaplayınız. (7 puan)


    (b) Bilgisayar sisteminin 2026, 2027 ve 2028 yılı amortisman tutarlarını gerekçesiyle hesaplayınız. (6 puan)


    (c) Binek otomobilin 2026 yılı ile itfa süresinin son yılı amortisman tutarlarını hesaplayınız. (7 puan)


    (d) Taşıma bandı için seçilebilecek en uzun amortisman süresini ve bu tercihin kullanım zamanını açıklayınız; ayrıca makinede
    normal usule geçildikten sonra yeniden azalan bakiyeler usulüne dönülüp dönülemeyeceğini belirtiniz. (5 puan)

    '
  cozum: '**(a) Makine**


    - Azalan bakiyeler oranı = normal oranın iki katı = %20 (%50''yi geçmez).

    - 2023: 1.400.000 × %20 = 280.000 TL; 2024: (1.400.000 − 280.000) × %20 = 224.000 TL; birikmiş amortisman 504.000 TL,
    yok edilmemiş değer 896.000 TL.

    - Normal usule geçiş (mük. md. 320/3): yeni usul, bildirimin yapıldığı beyannamenin ilgili olduğu dönemden (2025) itibaren
    geçerlidir. Henüz yok edilmemiş değer, bakiye amortisman süresine bölünerek eşit miktarlarda yok edilir. Normal süre 1/0,10
    = 10 yıl, geçen 2 yıl; bakiye süre 8 yıldır.

    - 2025: 896.000 / 8 = **112.000 TL** (sonraki yıllarda da 112.000 TL).


    **(b) Bilgisayar sistemi**


    - 2 × %33,33 = %66,67 olur; ancak azalan bakiyeler oranı %50''yi geçemez → oran **%50**. Amortisman süresi normal orana
    göre 3 yıl olarak hesaplanır; sürenin son yılında devreden bakiye tamamen yok edilir.


    | Yıl | Hesap | Amortisman |

    |---|---|---|

    | 2026 | 800.000 × %50 | 400.000 |

    | 2027 | 400.000 × %50 | 200.000 |

    | 2028 (son yıl) | Kalan bakiye | 200.000 |


    **(c) Binek otomobil**


    - Binek otomobillerde aktife girdiği hesap döneminde ay kesri tam ay sayılarak kalan ay süresi kadar amortisman ayrılır
    (md. 320/2): Eylül-Aralık = 4 ay.

    - Yıllık amortisman = 1.800.000 × %20 = 360.000 TL. 2026: 360.000 × 4/12 = **120.000 TL**.

    - Amortisman ayrılmayan süreye isabet eden bakiye, itfa süresinin son yılında tamamen yok edilir. Süre 2026''dan başlayarak
    5 yıldır; son yıl 2030''dur. 2027-2029: 360.000 TL; ayrılmayan kısım = 360.000 − 120.000 = 240.000 TL.

    - 2030: 360.000 + 240.000 = **600.000 TL** (toplam: 120.000 + 3 × 360.000 + 600.000 = 1.800.000 TL).


    **(d) Süre tercihi ve usul değişikliği**


    - Faydalı ömürden kısa olmamak üzere süre serbestçe belirlenebilir; ancak bu süre ilan edilen sürenin iki katını ve elli
    yılı aşamaz: en çok min(2 × 8; 50) = **16 yıl** (yıllık oran %6,25). Tercih, kıymetin envantere alındığı geçici vergi
    dönemi sonu itibarıyla kullanılır ve izleyen dönemlerde değiştirilemez (md. 320/4).

    - Normal amortisman usulüne göre amortisman ayrılmasına başlandıktan sonra bu usulden dönülemez (mük. md. 320/2); dolayısıyla
    makine için yeniden azalan bakiyeler usulüne **dönülemez**. Tersi (azalan bakiyelerden normale geçiş) mümkündür.

    '
