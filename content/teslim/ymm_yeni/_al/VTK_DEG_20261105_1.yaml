    Şirket indirilemeyecek KDV''yi genel gider yazmayı tercih etmiştir.

    3. **Kiralık fabrika:** Şirket, 01.01.2026-31.12.2030 süreli kira sözleşmesiyle kiraladığı fabrika binasında 2026 yılı
    başında kıymetini devamlı olarak artıran 600.000 TL''lik tadilat yapmış ve ayrıca 80.000 TL normal bakım ve onarım gideri
