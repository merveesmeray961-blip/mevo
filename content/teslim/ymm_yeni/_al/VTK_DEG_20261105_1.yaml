    karşı dava hakkını açıklayınız. (4 puan)

    '
  cozum: '**(a) Maliyet bedeli (md. 275)**


    Maliyet bedeli; ilk madde ve malzeme, işçilik, genel imalat giderlerinden mamule düşen hisse ve zorunlu ambalaj malzemesini
    içerir. Genel idare giderlerinden mamule düşen hissenin maliyete katılması **ihtiyaridir**.


    - Genel idare payı katılmadan: 300.000 + 100.000 + 60.000 + 20.000 = **480.000 TL**

    - Katılsaydı: 480.000 + 30.000 = 510.000 TL


    **(b) Emsal bedeli ölçüsü (md. 274, 267)**


    - Düşüklük testi: değerleme günü satış bedeli 400 TL × 1.000 = 400.000 TL; (480.000 − 400.000) / 480.000 = %16,67 ≥ %10
    → emsal bedeli ölçüsü uygulanabilir.

    - Birinci sıra (ortalama fiyat esası): aylık satış miktarı, değerlenecek mal miktarının (1.000 adet) %25''inden, yani
    250 adetten az olmamalıdır. Aralık: 200 adet < 250 → şart sağlanmaz; önceki aya geçilir. Kasım: 100 + 200 = 300 adet ≥
    250 → uygulanır.

    - Kasım ortalama satış fiyatı = (100 × 360 + 200 × 390) / 300 = 114.000 / 300 = **380 TL**.

    - Emsal bedeli = 380 × 1.000 = **380.000 TL** (envanter değeri).

    - Değer düşüklüğü = 480.000 − 380.000 = **100.000 TL**.


    **(c) Mamul Y**


    Satış bedelinin maliyete göre düşüklüğü (200.000 − 184.000) / 200.000 = %8''dir; %10''dan az olduğundan emsal bedeli ölçüsü
    uygulanamaz. Y mamulü **maliyet bedeli olan 200.000 TL** ile değerlenir.


    **(d) Mamul Z**


    Emtia için emsal bedeline başvurulurken md. 267''nin ikinci sırasındaki (maliyet bedeline toptan %5, perakende %10 ilave)
    usul **uygulanamaz**; müdürün önerisi yanlıştır. Satış olmadığından birinci sıra da işletilemediği için üçüncü sıraya
    geçilir: emsal bedeli, ilgililerin müracaatı üzerine takdir komisyonunca maliyet bedeli ve piyasa kıymetleri araştırılarak
    takdir edilir. Takdir edilen bedellere karşı mükellefin vergi mahkemesinde dava açma hakkı saklıdır; ancak dava açılması
    verginin tahakkuk ve tahsilini durdurmaz.

    '
