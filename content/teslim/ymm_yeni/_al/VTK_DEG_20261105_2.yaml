sorular:
- konu: DEG
  unite: Değerleme ve enflasyon düzeltmesi
  kazanim: emtia sigorta tazminatı
  tip: hesaplama
  zorluk: 2
  kok: Bilanço esasına göre defter tutan (N) A.Ş.'nin deposunda 2026 yılında çıkan yangında maliyet bedeli 2.000.000 TL olan
    emtia yok olmuş ve sigorta şirketinden 2.600.000 TL tazminat alınmıştır. Şirket emtiayı yeniden almayı planlamaktadır.
    VUK'un ilgili hükmüne göre bu olayda doğrudan kâra alınması gereken tutar kaç TL'dir?
  secenekler:
    A: '0'
    B: '300.000'
    C: '600.000'
    D: 2.000.000
    E: 2.600.000
  dogru: C
  aciklama:
    dogru_neden: VUK md. 330'a göre emtia, zirai mahsul ve hayvan kıymetlerinde meydana gelen zayiat nedeniyle alınan sigorta
      tazminatı bunların değerinden fazla ise bu fazlalık kâra alınır. Amortismana tabi kıymetlerdeki gibi geçici hesapta
      tutma imkânı emtia için yoktur. 2.600.000 − 2.000.000 = 600.000 TL.
    celdiriciler:
      A: Emtia tazminatında amortismana tabi kıymetler için tanınan geçici hesapta tutma imkânı yoktur; fazlalık kâra alınır.
      B: Fazlalığın yarısı alınmıştır; kanunda böyle bir oran yoktur.
      D: Zayi olan emtianın maliyet bedeli kâra alınmaz; yalnız tazminatın değerinden fazla kısmı kâra alınır.
      E: Tazminatın tamamı kâra alınmıştır; emtianın değerine karşılık gelen kısım fazlalık değildir.
    hesap_adimlari:
    - Fazlalık = 2.600.000 − 2.000.000 = 600.000
