  kazanimlar:
  - genel üretim gideri farkları
  - bütçe, verimlilik ve kapasite farkları
  - fark hesaplarının stok ve satış maliyetine aktarılması
  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Ergene Vana A.Ş. 7/A seçeneğini ve önceden saptanmış maliyet yöntemini uygulamaktadır. Genel üretim giderleri (GÜG)
    direkt işçilik saati (DİS) üzerinden yüklenmektedir. Standartlar:


    | Kalem | Değer |

    |---|---|

    | Normal kapasite | 12.000 DİS/ay |

    | Aylık sabit GÜG bütçesi | 360.000 TL (30 TL/DİS) |

    | Değişken GÜG standardı | 20 TL/DİS |

    | Bir birim mamul için standart süre | 1,5 DİS |


    Kasım 2026 fiili verileri: üretim 7.600 birim; kullanılan fiili DİS 11.700; fiili GÜG 612.000 TL (246.000 TL değişken,
    366.000 TL sabit). Üretilen 7.600 birimden 6.080 birim satılmıştır.


    Farkların hesaplanmasında şu tanımlar kullanılacaktır:

    - Bütçe farkı = fiili GÜG − esnek bütçe (fiili DİS düzeyinde: sabit bütçe + 20 × fiili DİS);

    - Verimlilik farkı = (fiili DİS − standart DİS) × değişken GÜG standardı;

    - Kapasite farkı = (normal kapasite DİS − standart DİS) × sabit GÜG oranı.


    **İstenenler:**


    (a) Fiili üretime yüklenmesi gereken GÜG''yi ve toplam yükleme farkını bulunuz. (4 puan)


    (b) Bütçe, verimlilik ve kapasite farklarını hesaplayınız; olumlu/olumsuz olduklarını belirtiniz ve toplamının (a) şıkkındaki
    farka eşit olduğunu gösteriniz. (9 puan)


    (c) GÜG''nin 730 hesapta toplanmasına, 151''e yansıtılmasına ve 730–734 hesaplarının dönem sonu kapanışına ilişkin yevmiye
    kayıtlarını yapınız. (7 puan)


    (d) Toplam farkı, mamul stoku ile satılan mamul maliyeti arasında üretim miktarına göre paylaştırınız ve kapasite farkının
    neden bir harcama aşımı olmadığını açıklayınız. (5 puan)

    '
  cozum: 'Standart DİS = 7.600 × 1,5 = 11.400. Toplam GÜG oranı = 30 + 20 = 50 TL/DİS.


    **(a)** Yüklenen GÜG = 11.400 × 50 = **570.000 TL**. Fark = 612.000 − 570.000 = **42.000 TL (eksik yükleme, olumsuz)**.


    **(b)**


    | Fark | Hesap | Hesaplama | Sonuç |

    |---|---|---|---:|

    | Bütçe | 732 | 612.000 − (360.000 + 20 × 11.700 = 594.000) | 18.000 olumsuz |

    | Verimlilik | 733 | (11.700 − 11.400) × 20 | 6.000 olumsuz |

    | Kapasite | 734 | (12.000 − 11.400) × 30 | 18.000 olumsuz |

    | **Toplam** | | | **42.000 olumsuz** |


    **(c)**


    *1) Fiili GÜG''nin tahakkuku*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 730 Genel Üretim Giderleri | 612.000 |  |

    | İlgili aktif ve pasif hesaplar (150, 257, 335, 102 vb.) |  | 612.000 |

    | **Toplam** | **612.000** | **612.000** |


    *2) Önceden saptanmış GÜG''nin yansıtılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 570.000 |  |

    | 731 Genel Üretim Giderleri Yansıtma |  | 570.000 |

    | **Toplam** | **570.000** | **570.000** |


    *3) Dönem sonu kapanış (730 ile 731 karşılaştırılır)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 731 Genel Üretim Giderleri Yansıtma | 570.000 |  |

    | 732 Genel Üretim Giderleri Bütçe Farkları | 18.000 |  |

    | 733 Genel Üretim Giderleri Verimlilik Farkları | 6.000 |  |

    | 734 Genel Üretim Giderleri Kapasite Farkları | 18.000 |  |

    | 730 Genel Üretim Giderleri |  | 612.000 |

    | **Toplam** | **612.000** | **612.000** |


    **(d)** Stoka düşen: 42.000 × 1.520/7.600 = **8.400 TL** (152 Mamuller); satış maliyetine düşen: 42.000 × 6.080/7.600
    = **33.600 TL** (620).


    *4) Fark hesaplarının kapatılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 152 Mamuller | 8.400 |  |

    | 620 Satılan Mamuller Maliyeti | 33.600 |  |

    | 732 Genel Üretim Giderleri Bütçe Farkları |  | 18.000 |

    | 733 Genel Üretim Giderleri Verimlilik Farkları |  | 6.000 |

    | 734 Genel Üretim Giderleri Kapasite Farkları |  | 18.000 |

    | **Toplam** | **42.000** | **42.000** |


    Kapasite farkı, fiili üretimin standart saatinin (11.400) normal kapasitenin (12.000) altında kalması nedeniyle sabit
    GÜG''nin tamamının mamullere yüklenememesinden doğar; sabit giderin kendisi bütçenin üzerinde harcanmış değildir (harcama
    aşımı bütçe farkında görülür). Bu nedenle sorumluluğu üretim hacmini belirleyen planlama ve satış kararlarındadır.


    Püf noktaları: Bütçe farkında esnek bütçeyi fiili saatle, verimlilik ve kapasite farklarında yüklemeyi standart saatle
    çalıştırın. Üç farkın toplamı mutlaka yükleme farkına eşit olmalıdır; eşit değilse saatleri karıştırmışsınızdır.

    '
