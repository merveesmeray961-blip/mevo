  zorluk: 3
  puan: 25
  sure_dk: 35
  soru: 'Kızılırmak Dişli San. A.Ş. dişli kutusu üretmekte, Tekdüzen Hesap Planı''nın 7/A seçeneğini ve önceden saptanmış
    (standart) maliyet yöntemini uygulamaktadır. Bir dişli kutusunun standart direkt maliyet kartı aşağıdadır:


    | Unsur | Standart miktar | Standart fiyat | Birim standart maliyet |

    |---|---|---|---|

    | Direkt ilkmadde ve malzeme | 4 kg | 25 TL/kg | 100 TL |

    | Direkt işçilik | 3 saat | 80 TL/saat | 240 TL |

    | **Toplam** | | | **340 TL** |


    Ekim 2026 verileri:


    - Üretim: 2.500 adet (tamamı bitmiş mamul; dönem başı ve sonu yarı mamul yoktur). Dönem başı mamul stoku yoktur.

    - Kullanılan ilkmadde: 10.400 kg; fiili kg fiyatı 24,50 TL (toplam 254.800 TL). Fiyat farkı kullanılan miktar üzerinden
    hesaplanmaktadır.

    - Direkt işçilik: 7.400 saat; fiili saat ücreti 82 TL (toplam 606.800 TL).

    - Ekim ayında 2.000 adet birim satış fiyatı 520 TL''den peşin satılmıştır.

    - Dönem sonunda fark hesaplarının net bakiyesi, mamul stoku ile satılan mamul maliyeti arasında (üretim miktarına göre
    500 / 2.000 adet oranında) paylaştırılacaktır.


    **İstenenler:**


    (a) Malzeme fiyat ve miktar farklarını; işçilik ücret ve süre farklarını hesaplayınız, olumlu/olumsuz olduklarını belirtiniz.
    (7 puan)


    (b) Fiili kullanımların kaydını, standart tutarların 151 hesaba yansıtılmasını ve 710–713 ile 720–723 hesaplarının dönem
    sonu kapanış kayıtlarını yapınız. (8 puan)


    (c) Fark hesaplarının net bakiyesini 152 Mamuller ve 620 Satılan Mamuller Maliyeti hesaplarına aktaran kaydı yapınız;
    151''den 152''ye ve 152''den 620''ye standart maliyetle yapılan devirleri de gösteriniz. (6 puan)


    (d) Brüt satış kârını ve dönem sonu mamul stok değerini bulunuz. (4 puan)

    '
  cozum: 'Fiili üretim için standart miktarlar: malzeme 2.500 × 4 = 10.000 kg; işçilik 2.500 × 3 = 7.500 saat.


    **(a) Farklar**


    | Fark | Hesap | Sonuç |

    |---|---|---:|

    | Malzeme fiyat farkı = (24,50 − 25) × 10.400 | 712 | 5.200 TL olumlu |

    | Malzeme miktar farkı = (10.400 − 10.000) × 25 | 713 | 10.000 TL olumsuz |

    | İşçilik ücret farkı = (82 − 80) × 7.400 | 722 | 14.800 TL olumsuz |

    | İşçilik süre farkı = (7.400 − 7.500) × 80 | 723 | 8.000 TL olumlu |


    Kontrol: malzeme toplam farkı 254.800 − 250.000 = 4.800 olumsuz (10.000 − 5.200); işçilik toplam farkı 606.800 − 600.000
    = 6.800 olumsuz (14.800 − 8.000). Net fark 11.600 TL olumsuzdur.


    **(b) Kayıtlar**


    *1) Fiili kullanımlar*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 710 Direkt İlkmadde ve Malzeme Giderleri | 254.800 |  |

    | 150 İlkmadde ve Malzeme |  | 254.800 |

    | 720 Direkt İşçilik Giderleri | 606.800 |  |

    | 335 Personele Borçlar |  | 606.800 |

    | **Toplam** | **861.600** | **861.600** |


    *2) Standart tutarların yansıtılması (2.500 × 340)*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 151 Yarı Mamuller-Üretim | 850.000 |  |

    | 711 Direkt İlkmadde ve Malzeme Yansıtma |  | 250.000 |

    | 721 Direkt İşçilik Giderleri Yansıtma |  | 600.000 |

    | **Toplam** | **850.000** | **850.000** |


    *3) Malzeme hesaplarının kapanışı*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 711 Direkt İlkmadde ve Malzeme Yansıtma | 250.000 |  |

    | 713 Direkt İlkmadde ve Malzeme Miktar Farkı | 10.000 |  |

    | 710 Direkt İlkmadde ve Malzeme Giderleri |  | 254.800 |

    | 712 Direkt İlkmadde ve Malzeme Fiyat Farkı |  | 5.200 |

    | **Toplam** | **260.000** | **260.000** |


    *4) İşçilik hesaplarının kapanışı*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 721 Direkt İşçilik Giderleri Yansıtma | 600.000 |  |

    | 722 Direkt İşçilik Ücret Farkları | 14.800 |  |

    | 723 Direkt İşçilik Süre Farkları |  | 8.000 |

    | 720 Direkt İşçilik Giderleri |  | 606.800 |

    | **Toplam** | **614.800** | **614.800** |


    Olumsuz farklar fark hesabının borcuna, olumlu farklar alacağına yazılır.


    **(c) Stok ve satış maliyeti**


    *1) Üretimi tamamlanan mamuller*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 152 Mamuller | 850.000 |  |

    | 151 Yarı Mamuller-Üretim |  | 850.000 |

    | **Toplam** | **850.000** | **850.000** |


    *2) Satılan 2.000 adet × 340*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 620 Satılan Mamuller Maliyeti | 680.000 |  |

    | 152 Mamuller |  | 680.000 |

    | **Toplam** | **680.000** | **680.000** |


    Net fark 11.600 TL olumsuz; stoka 11.600 × 500/2.500 = 2.320 TL, satış maliyetine 11.600 × 2.000/2.500 = 9.280 TL düşer.


    *3) Fark hesaplarının kapatılması*


    | Hesap | Borç | Alacak |

    |---|---:|---:|

    | 152 Mamuller | 2.320 |  |

    | 620 Satılan Mamuller Maliyeti | 9.280 |  |

    | 712 Direkt İlkmadde ve Malzeme Fiyat Farkı | 5.200 |  |

    | 723 Direkt İşçilik Süre Farkları | 8.000 |  |

    | 713 Direkt İlkmadde ve Malzeme Miktar Farkı |  | 10.000 |

    | 722 Direkt İşçilik Ücret Farkları |  | 14.800 |

    | **Toplam** | **24.800** | **24.800** |


    **(d)** Satışlar 2.000 × 520 = 1.040.000 TL; satılan mamul maliyeti 680.000 + 9.280 = 689.280 TL; **brüt satış kârı =
    350.720 TL**. Dönem sonu stok değeri = 500 × 340 + 2.320 = **172.320 TL**.


    Püf noktaları: Fiyat farkını kullanılan (fiili) miktarla, miktar farkını standart fiyatla hesaplayın; olumlu fark alacak,
    olumsuz fark borç kalıntısıdır. Net fark stok ve satış maliyetine paylaştırılırken oran standart fiilî üretim miktarına
    göre (500/2.500; 2.000/2.500) alınır.

    '
