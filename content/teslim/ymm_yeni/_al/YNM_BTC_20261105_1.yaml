  dogrulama:
    python: 'uret=2500

      std_kg=4; std_fyat=25; std_saat=3; std_ucret=80

      fkg=10400; ffyat=24.5; fsaat=7400; fucret=82

      sm=uret*std_kg; ss=uret*std_saat

      m_fiyat=round((ffyat-std_fyat)*fkg,2)

      m_miktar=(fkg-sm)*std_fyat

      i_ucret=(fucret-std_ucret)*fsaat

      i_sure=(fsaat-ss)*std_ucret

      fiili_dm=round(ffyat*fkg,2); std_dm=sm*std_fyat

      fiili_dl=fucret*fsaat; std_dl=ss*std_ucret

      net_fark=(fiili_dm-std_dm)+(fiili_dl-std_dl)

      birim_std=std_kg*std_fyat+std_saat*std_ucret

      satilan=2000; stokta=uret-satilan

      stok_pay=round(net_fark*stokta/uret,2); satis_pay=round(net_fark*satilan/uret,2)

      satis=satilan*520

      sm620=satilan*birim_std

      brut=satis-(sm620+satis_pay)

      stok_deger=stokta*birim_std+stok_pay

      sonuc={''m_fiyat'':m_fiyat,''m_miktar'':m_miktar,''i_ucret'':i_ucret,''i_sure'':i_sure,''fiili_dm'':fiili_dm,''std_dm'':std_dm,''fiili_dl'':fiili_dl,''std_dl'':std_dl,''net_fark'':net_fark,''stok_pay'':stok_pay,''satis_pay'':satis_pay,''brut'':brut,''stok_deger'':stok_deger,''sm620'':sm620}

      '
