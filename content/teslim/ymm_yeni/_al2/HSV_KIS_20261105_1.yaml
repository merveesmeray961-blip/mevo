    C: Kapasitesi 3.000 öğrenci olan üniversitede bedelsiz öğrenci sayısı 1.600
    D: Kapasitesi 3.000 öğrenci olan vakıf üniversitesinde bedelsiz öğrenci sayısı 1.500
