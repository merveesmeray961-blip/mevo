  konu: KIS
  kazanim: geri gelen eşyada değer farkı
  tip: hesaplama
  zorluk: 3
  kok: (R) Makine A.Ş., Türkiye'den geçici ihracat suretiyle yurt dışına gönderdiği 6.000.000 TL gümrük kıymetli bir makineyi,
    yurt dışında yapılan iyileştirme nedeniyle 1.500.000 TL değer artışıyla geri getirmiştir. Makine, Gümrük Kanunu'nun geri
    gelen eşya hükümleri kapsamında gümrük vergisinden muaftır; ihracat istisnasından yararlanılmamıştır. Makinenin geri gelişinde
    değer farkı dahil gümrük kıymeti 7.500.000 TL'dir. Bu soruda KDV oranı %20 kabul edilecek olup (R)'nin ithalatta ödeyeceği
    KDV kaç TL'dir?
  secenekler:
    A: '0'
    B: '300.000'
    C: 1.200.000
    D: 1.500.000
    E: 1.800.000
  dogru: B
  aciklama:
    dogru_neden: 'Md. 16/1-b, geri gelen eşya hükümleri kapsamında gümrük vergisinden muaf eşyanın ithalini istisna eder.
      Ancak geri gelen eşyanın dışarıda bir işleme tabi tutulması veya asli kısmına ilave yapılması hâlinde eşyanın kazandığı
      değer farkı istisnaya dahil değildir. Makinenin ilk kıymeti (6.000.000 TL) istisna kapsamında kalır; yalnız değer farkı
      vergilenir: 1.500.000 × %20 = 300.000 TL. Püf noktaları: (1) Soruda verilen 7.500.000 TL toplam kıymet gereksiz veridir.
      (2) İstisna ya hep ya hiç değil, kıymet artışı bakımından kısmen uygulanır.'
    celdiriciler:
      A: Değer farkı istisnaya dahil olmadığından vergi sıfır olamaz.
      C: İlk kıymet istisna kapsamındadır; vergilenen kısım yalnız değer farkıdır.
      D: Toplam kıymet esas alınmıştır; oysa ilk kıymet istisnadadır.
      E: Kıymet ile değer farkı toplamı üzerinden vergi hesaplamak, ilk kıymeti de vergilendirmek anlamına gelir; ayrıca matrah
        ikilenmiştir.
    hesap_adimlari:
    - Vergilenen matrah = değer farkı = 1.500.000
    - KDV = 1.500.000 × 0,20 = 300.000
  kaynaklar:
  - mevzuat: 3065 sayılı Katma Değer Vergisi Kanunu
    madde: md. 16/1
    alinti: Gümrük Kanununa göre geri gelen eşyanın dışarıda bir işleme tabi tutulması veya asli kısmına bir ilave yapılması
      halinde eşyanın kazandığı değer farkı istisnaya dahil değildir.
