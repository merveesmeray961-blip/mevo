  kok: 'Sağlık Bakanlığınca izin verilen (S) Hastanesi A.Ş., Türkiye''de yerleşmiş olmayan yabancı uyruklu hastalara Temmuz
    2026''da şu teslim ve hizmetleri yapmıştır (KDV hariç): sağlık kurumu bünyesinde verilen teşhis ve tedavi hizmeti 20.000.000
    TL; tedaviyle birlikte sağlanan kozmetik ürün satışı 800.000 TL; tedaviyle birlikte sağlanan refakatçi konaklaması 600.000
    TL. Bu soruda kozmetik ürünlerde KDV oranı %20, konaklamada %10 kabul edilecektir. (S)''nin bu işlemlerden hesaplayacağı
    KDV kaç TL''dir?'
  secenekler:
    A: '60.000'
    B: '160.000'
    C: '220.000'
    D: '280.000'
    E: 4.220.000
  dogru: C
  aciklama:
    dogru_neden: 'Md. 13/l, Türkiye''de yerleşmiş olmayan yabancı uyruklu gerçek kişilere sağlık kurumları bünyesinde verilen
      koruyucu hekimlik, teşhis, tedavi ve rehabilitasyon hizmetlerini istisna eder; ancak bu hizmetlerle birlikte sağlanan
      diğer teslim ve hizmetler istisnaya dahil değildir. Tedavi bedeli (20.000.000 TL) KDV''den müstesnadır. Kozmetik ürün:
      800.000 × %20 = 160.000 TL; konaklama: 600.000 × %10 = 60.000 TL; toplam 220.000 TL. Püf noktaları: En büyük tutar olan
      tedavi bedeli istisna olduğu için KDV hesabına girmez; birlikte sağlanan diğer hizmetler ise kendi oranlarıyla vergilenir.'
    celdiriciler:
      A: Yalnızca konaklama KDV'si hesaplanmıştır; kozmetik ürün satışı da istisna dışındadır.
      B: Yalnızca kozmetik ürün KDV'si hesaplanmıştır; refakatçi konaklaması da vergiye tabidir.
      D: Konaklama %20 ile hesaplanmıştır; soruda konaklama için %10 kabul edilmiştir.
      E: Tedavi bedeli de %20 ile vergilendirilmiştir; oysa teşhis ve tedavi hizmeti md. 13/l istisnasındadır.
    hesap_adimlari:
    - 'Tedavi: 20.000.000 TL – istisna'
    - 'Kozmetik: 800.000 × 0,20 = 160.000'
    - 'Konaklama: 600.000 × 0,10 = 60.000'
    - 'Toplam: 220.000'
