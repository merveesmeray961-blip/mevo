- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: arsa ve binanın ayrı muhasebeleştirilmesi ve amortisman
  tip: hesaplama
  zorluk: 1
  kok: (Ü) AŞ, 1.1.2026'da kullanıma aldığı bir fabrika için arsa bedelini 4.000.000 TL, bina bedelini 8.800.000 TL olarak
    (faturada ayrı gösterilmiş biçimde) ödemiştir. Binanın yararlı ömrü 25 yıl, kalıntı değeri 800.000 TL'dir ve doğrusal
    amortisman uygulanmaktadır. Şirket maddi duran varlıklarını maliyet modeliyle izlemektedir. Bağımsız değerleme sonucunda
    arsanın gerçeğe uygun değeri 31.12.2026'da 6.000.000 TL bulunmuştur. Şirketin bu gayrimenkul için 2026 yılında ayıracağı
    amortisman gideri kaç TL'dir?
  secenekler:
    A: '320.000'
    B: '352.000'
    C: '400.000'
    D: '480.000'
    E: '512.000'
  dogru: A
  aciklama:
    dogru_neden: Arsa ve binalar birlikte alınsa dahi ayrı muhasebeleştirilir; arsanın sınırsız yararlı ömrü vardır ve amortismana
      tabi tutulmaz. Arsanın değerindeki artış binanın amortismana tabi tutarını etkilemez (TMS 16 par. 58). Amortismana tabi
      tutar kalıntı değer düşülerek belirlenir (par. 53). Yıllık amortisman = (8.800.000 - 800.000) / 25 = 320.000 TL.
    celdiriciler:
      B: Binanın kalıntı değeri düşülmeden (8.800.000 / 25) hesaplanmıştır; amortismana tabi tutar kalıntı değer düşülerek
        bulunur.
      C: Arsadaki 2.000.000 TL değer artışı bina tutarına eklenmiştir; arsa değer artışı binanın amortismana tabi tutarını
        etkilemez.
      D: Arsa bedeli de amortismana tabi tutara katılmıştır ((12.800.000 - 800.000) / 25); arsa amortismana tabi tutulmaz.
      E: Hem arsa bedeli dahil edilmiş hem de kalıntı değer düşülmemiştir (12.800.000 / 25).
    hesap_adimlari:
    - 'Bina için amortismana tabi tutar: 8.800.000 - 800.000 = 8.000.000'
    - 'Yıllık amortisman: 8.000.000 / 25 = 320.000'
    - Arsa amortismana tabi değildir ve gerçeğe uygun değerindeki artış (maliyet modeli) dikkate alınmaz
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 58
    alinti: Arsa ve binalar birlikte alındıklarında dahi ayrılabilir maddi duran varlıklardır ve ayrı olarak muhasebeleştirilirler.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 58
    alinti: Bir binanın üzerinde bulunduğu arsanın değerindeki artış binanın amortismana tabi tutarını etkilemez.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 53
    alinti: Bir varlığın amortismana tabi tutarı, kalıntı değeri düşülerek belirlenir.
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = (8800000 - 800000) / 25
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: parça yenileme ve eski parçanın finansal tablo dışı bırakılması
  tip: hesaplama
  zorluk: 3
  kok: (Ü) AŞ'nin 1.1.2020'de 12.000.000 TL maliyetle iktisap ettiği dökümhane fırını, tek kalem olarak 20 yıllık yararlı
    ömür, sıfır kalıntı değer ve doğrusal yöntemle amortismana tabi tutulmaktadır (fırının sigorta bedeli 15.000.000 TL'dir).
    Fırının astarı 31.12.2026'da yenilenmiş ve 2.400.000 TL tutarındaki yenileme maliyeti aktifleştirme koşullarını sağladığından
    fırının defter değerine eklenmiştir. Eski astarın defter değeri ayrıca izlenmemekte olup belirlenemez durumdadır; şirket,
    yenileme maliyetini eski astarın iktisap maliyetinin göstergesi olarak kullanmakta ve bu tutarın fırınla aynı oran ve
    sürede amortismana tabi tutulduğunu kabul etmektedir. Eski astar hurdaya ayrılmış olup herhangi bir tahsilat sağlanmamıştır.
    2026 yılı amortismanı ayrılmış olduğuna göre, yenileme kaydı sonrasında fırının 31.12.2026 tarihli defter değeri kaç TL'dir?
  secenekler:
    A: 7.800.000
    B: 8.520.000
    C: 8.640.000
    D: 9.360.000
    E: 10.200.000
  dogru: C
  aciklama:
    dogru_neden: 'Yenileme maliyeti, aktifleştirme koşulları sağlandığında kalemin defter değerine eklenir; yenilenen parçanın
      defter değeri ise finansal tablo dışı bırakılır (TMS 16 par. 13, 70). Defter değeri belirlenemiyorsa yenileme maliyeti,
      parçanın iktisap maliyetinin göstergesi olarak kullanılabilir (par. 70). Fırının 31.12.2026 öncesi defter değeri: 12.000.000
      x (1 - 7/20) = 7.800.000 TL. Eski astarın tahmini maliyeti 2.400.000 TL, birikmiş amortismanı %35 = 840.000 TL, defter
      değeri 1.560.000 TL''dir ve bu tutar zarar olarak finansal tablo dışı bırakılır. Yeni defter değeri = 7.800.000 - 1.560.000
      + 2.400.000 = 8.640.000 TL. Püf noktaları: (1) Sigorta bedeli gereksiz veridir. (2) 2020-2026 arası amortisman yıl sonu
      dahil 7 yıldır (%35). (3) Çıkarılacak tutar parçanın birikmiş amortismanı değil, defter değeridir; yenileme maliyeti
      ise tam tutarıyla eklenir.'
    celdiriciler:
      A: Yenileme maliyeti gider yazılmış (ya da eski astar amortisman düşülmeden tam maliyetiyle çıkarılmıştır); oysa aktifleştirme
        koşulları sağlanan yenileme maliyeti defter değerine eklenir ve eski parçanın defter değeri çıkarılır.
      B: Eski astarın birikmiş amortismanı 6 yıl (%30) üzerinden hesaplanmıştır; 2020-2026 arası amortisman 7 yıldır.
      D: Finansal tablo dışı bırakmada eski astarın defter değeri yerine yalnızca birikmiş amortismanı (840.000 TL) düşülmüştür.
      E: Eski astarın defter değeri finansal tablo dışı bırakılmamış, yenileme maliyeti doğrudan eklenmiştir; yenilenen parçanın
        defter değeri çıkarılmalıdır.
    hesap_adimlari:
    - 'Fırının yıllık amortismanı: 12.000.000 / 20 = 600.000; 7 yıl sonunda birikmiş amortisman 4.200.000; defter değeri 7.800.000'
    - Eski astarın tahmini maliyeti 2.400.000; birikmiş amortismanı %35 = 840.000; defter değeri 1.560.000 (zarar)
    - 'Yeni defter değeri: 7.800.000 - 1.560.000 + 2.400.000 = 8.640.000'
  kaynaklar:
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 13
    alinti: Yenilenen parçaların defter değeri, bu Standardın finansal tablo dışı bırakmaya ilişkin hükümleri kapsamında finansal
      tablo dışı bırakılır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 70
    alinti: İşletme için yenilenen parçanın defter değerinin belirlenmesi mümkün/uygulanabilir değilse, yenileme maliyeti,
      yenilenen parçanın alındığında ya da inşaa edildiğindeki maliyetinin bir göstergesi olarak kullanılabilir.
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: 'once = 12000000 - 12000000 / 20 * 7

      eski = 2400000 - 2400000 / 20 * 7

      sonuc = once - eski + 2400000

      '
- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: IFM
  unite: Maddi ve maddi olmayan duran varlıklar ve yatırım amaçlı gayrimenkuller
  konu: MDV
  kazanim: yatırım amaçlı gayrimenkulün takas yoluyla edinilmesi
  tip: uygulama
  zorluk: 2
  kok: (Ü) AŞ, defter değeri 1.500.000 TL (maliyeti 2.500.000 TL, birikmiş amortismanı 1.000.000 TL) olan bir makinesini,
    kira geliri elde etmek amacıyla elde tutacağı bir arsa ile takas etmiştir. Alınan arsanın nakit akışlarının riski, zamanlaması
    ve tutarı verilen makinenin nakit akışlarından farklıdır ve bu fark, takas edilen varlıkların gerçeğe uygun değerine göre
    önemlidir. Makinenin gerçeğe uygun değeri güvenilir biçimde 2.000.000 TL olarak ölçülmüştür; arsanın gerçeğe uygun değerinin
    bundan daha açık olarak belli olduğuna dair bir kanıt yoktur ve taraflar arasında nakit ödemesi yapılmamıştır. Buna göre
    aşağıdakilerden hangisi doğrudur?
  secenekler:
    A: Arsa 1.500.000 TL maliyetle kaydedilir; takas nedeniyle kâr veya zarar oluşmaz.
    B: Arsa 2.000.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç kâr veya zarara yansıtılır.
    C: Arsa 2.000.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç diğer kapsamlı gelirde muhasebeleştirilir.
    D: Arsa 2.500.000 TL maliyetle kaydedilir; 1.000.000 TL tutarındaki kazanç kâr veya zarara yansıtılır.
    E: Arsa 1.500.000 TL maliyetle kaydedilir; 500.000 TL tutarındaki kazanç ertelenir ve arsa elden çıkarıldığında gelir
      yazılır.
  dogru: B
  aciklama:
    dogru_neden: 'Takas işleminin ticari özü vardır (alınan varlığın nakit akışlarının niteliğinin verilenden farklı olması
      ve farkın önemli olması) ve verilen varlığın gerçeğe uygun değeri güvenilir biçimde ölçülebilmektedir. Bu durumda edinilen
      yatırım amaçlı gayrimenkulün maliyeti, edinilen varlığın gerçeğe uygun değeri daha açık olarak belli olmadıkça verilen
      varlığın gerçeğe uygun değeri ile ölçülür (TMS 40 par. 27-29): 2.000.000 TL. Verilen makinenin finansal tablo dışı bırakılmasından
      doğan kazanç (2.000.000 - 1.500.000 = 500.000 TL) kâr veya zarara yansıtılır (TMS 16 par. 68, 71).'
    celdiriciler:
      A: Maliyetin verilen varlığın defter değeriyle ölçülmesi yalnızca takasın ticari özünün bulunmaması veya gerçeğe uygun
        değerlerin güvenilir ölçülememesi hâlinde söz konusudur.
      C: Finansal tablo dışı bırakma kazancı kâr veya zarara yansıtılır; diğer kapsamlı gelirde muhasebeleştirilemez.
      D: Makinenin tarihî maliyeti (2.500.000 TL) esas alınamaz; ne maliyet ne de kazanç bu tutardan hesaplanır.
      E: Finansal tablo dışı bırakma kazancı elden çıkarma döneminde kâr veya zarara yansıtılır; ertelenmesine ilişkin bir
        hüküm yoktur.
    hesap_adimlari:
    - Maliyet = verilen makinenin gerçeğe uygun değeri = 2.000.000
    - Kazanç = 2.000.000 - 1.500.000 = 500.000 (kâr veya zarar)
  kaynaklar:
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 28
    alinti: Alınan varlığın nakit akışlarının niteliğinin (riski, zamanlaması ve tutarı) verilen varlığın nakit akışlarının
      niteliğinden farklı olması veya
  - mevzuat: TMS 40 Yatırım Amaçlı Gayrimenkuller
    madde: par. 29
    alinti: İşletmenin alınan veya verilen varlıkların gerçeğe uygun değerlerini güvenilir bir şekilde ölçebilmesi durumunda,
      edinilen varlığın gerçeğe uygun değeri daha açık olarak belli olmadıkça, maliyet bedelinin ölçümünde, verilen varlığın
      gerçeğe uygun değeri kullanılır.
  - mevzuat: TMS 16 Maddi Duran Varlıklar
    madde: par. 68
    alinti: Bir maddi duran varlık kaleminin finansal tablo dışı bırakılmasından kaynaklanan kazanç veya kayıp ilgili kalem
      finansal tablo dışı bırakıldığında (TFRS 16 Kiralamalar satış ve geri kiralama işlemi için aksini gerektirmedikçe) kâr
      veya zarara yansıtılır.
  gecerlilik:
    baslangic: '2019-01-15'
    bitis: null
    yila_bagli_tutar: false
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: claude-sonnet-5-5
  dogrulama:
    python: sonuc = 2000000 - (2500000 - 1000000)
