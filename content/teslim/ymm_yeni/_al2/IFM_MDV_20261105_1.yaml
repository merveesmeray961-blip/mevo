  kok: (Ü) AŞ, 1.7.2026'da kullanıma hazır hale gelen bir lisansı 2.400.000 TL'ye satın almıştır. Lisansın yararlı ömrü 6
    yıl olup doğrusal itfa yöntemi uygulanacaktır. Lisansı satan taraftan bağımsız bir üçüncü kişi, lisansı yararlı ömrünün
    sonunda 300.000 TL'ye satın alacağını taahhüt etmiştir. Şirketin lisans için 2026 yılında ayıracağı itfa payı kaç TL'dir?
  secenekler:
    A: '175.000'
    B: '200.000'
    C: '225.000'
    D: '350.000'
    E: '400.000'
  dogru: A
  aciklama:
    dogru_neden: 'Sınırlı yararlı ömre sahip maddi olmayan duran varlığın kalıntı değeri, üçüncü bir şahsın yararlı ömrün
      sonunda varlığı satın alacağını taahhüt etmiş olması gibi istisnalar dışında sıfır kabul edilir (TMS 38 par. 100). Burada
      taahhüt bulunduğundan itfaya tabi tutar kalıntı değer düşülerek belirlenir (par. 101): (2.400.000 - 300.000) / 6 = 350.000
      TL/yıl. İtfa, varlık kullanıma hazır olduğunda başlar (par. 97); 1.7.-31.12.2026 için 6/12 alınır: 175.000 TL.'
    celdiriciler:
      B: Kalıntı değer sıfır kabul edilmiş (2.400.000 / 6 x 6/12); oysa üçüncü kişinin satın alma taahhüdü bulunduğundan kalıntı
        değer 300.000 TL alınır.
      C: Kalıntı değer itfaya tabi tutara eklenmiştir ((2.400.000 + 300.000) / 6 x 6/12); kalıntı değer düşülmelidir.
      D: Tam yıl itfa payı hesaplanmıştır; lisans yalnızca 6 ay kullanılmıştır.
      E: Hem kalıntı değer yok sayılmış hem de tam yıl itfa payı ayrılmıştır (2.400.000 / 6).
    hesap_adimlari:
    - 'İtfaya tabi tutar: 2.400.000 - 300.000 = 2.100.000'
    - 'Yıllık itfa: 2.100.000 / 6 = 350.000'
    - '2026 (6 ay): 350.000 x 6/12 = 175.000'
  kaynaklar:
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 100
    alinti: 'Sınırlı yararlı ömre sahip bir maddi olmayan duran varlığın kalıntı değeri, aşağıdaki durumlar söz konusu olmadıkça
      sıfır kabul edilir: (a) Üçüncü bir şahıs, ilgili varlığı yararlı ömrünün sonunda satın alacağını taahhüt etmiştir veya'
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 101
    alinti: Sınırlı yararlı ömre sahip varlığın itfaya tabi tutarı, kalıntı değeri düşüldükten sonra belirlenir.
