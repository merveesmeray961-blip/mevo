  aciklama:
    dogru_neden: 'I doğrudur: iptal, geri kazanılabilir tutarı belirleyen tahminlerde değişiklik olması hâlinde yapılır (TMS
      36 par. 114). II doğrudur: şerefiye zararı iptal edilmez (par. 124). IV doğrudur: yeniden değerlenmiş varlıkta iptal
      diğer kapsamlı gelirde muhasebeleştirilir, daha önce kâr veya zarara yansıtılan zarara isabet eden kısım ise kâr veya
      zarara yansıtılır (par. 120). III yanlıştır: zamanın ilerlemesi (iskontonun çözülmesi) nedeniyle iptal yapılmaz (par.
      116). V yanlıştır: nakit yaratan birimde iptal, şerefiye hariç varlıklara dağıtılır (par. 122). Doğru ifadeler I, II
      ve IV''tür. Püf noktaları: (1) Şerefiye, hem iptal hem de dağıtım bakımından istisnadır. (2) Zamanın geçmesi hizmet
      potansiyelini artırmaz; iptal için tahminlerde gerçek bir değişiklik aranır. (3) Yeniden değerlenmiş varlıkta iptalin
      bir kısmı kâr veya zarara gidebilir.'
    celdiriciler:
      A: III numaralı ifade yanlıştır (par. 116); ayrıca II ve IV de doğru olduğundan seçenek eksiktir.
      B: III ve V yanlış ifadelerdir; II tek başına doğru olmakla birlikte seçenek yanlış ifadeleri içermektedir.
      C: V numaralı ifade yanlıştır; iptal şerefiyeye dağıtılmaz (par. 122, 124). II de doğru olduğundan seçenek eksiktir.
