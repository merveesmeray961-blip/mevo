    madde: par. 43(a)
    alinti: Araştırma harcaması olması durumunda, gerçekleştiği zaman gider olarak muhasebeleştirilir;
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
    madde: par. 43(c)
    alinti: 57'nci paragrafta yer alan maddi olmayan duran varlık olarak muhasebeleştirilmek için gerekli kriterleri sağlayan
      bir geliştirme harcaması olması durumunda, elde edilen devam eden araştırma veya geliştirme projesinin defter değerine
      eklenir.
  - mevzuat: TMS 38 Maddi Olmayan Duran Varlıklar
