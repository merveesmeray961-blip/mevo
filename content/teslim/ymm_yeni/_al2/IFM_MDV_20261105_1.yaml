  secenekler:
    A: İşletme içi yaratılan şerefiye, güvenilir biçimde ölçülebilen tanımlanabilir bir kaynak olmadığından varlık olarak
      muhasebeleştirilmez.
    B: İşletme içi yaratılan markalar, yayın hakları ve müşteri listeleri ile benzer nitelikteki kalemler, maddi olmayan duran
      varlık olarak muhasebeleştirilmez.
    C: Araştırmadan (veya işletme içi bir projenin araştırma safhasından) kaynaklanan harcamalar, gerçekleştiklerinde gider
      olarak muhasebeleştirilir.
    D: Başlangıçta gider olarak muhasebeleştirilen bir maddi olmayan duran varlık harcaması, daha sonraki bir tarihte varlığın
      maliyetinin parçası olarak muhasebeleştirilmez.
    E: Ayrı edinilen ve varlık olarak izlenen devam eden bir araştırma projesine sonradan yapılan araştırma harcamaları, projenin
      defter değerine eklenir.
  dogru: E
  aciklama:
    dogru_neden: Ayrı olarak ya da işletme birleşmesinde elde edilip varlık olarak muhasebeleştirilen devam eden bir araştırma
      projesiyle ilgili sonraki harcamalardan araştırma niteliğinde olanlar gerçekleştiği zaman gider yazılır; yalnızca 57.
      paragraftaki kriterleri sağlayan geliştirme harcamaları projenin defter değerine eklenir (TMS 38 par. 43). E seçeneği
      bu nedenle yanlıştır.
    celdiriciler:
      A: TMS 38 par. 48 hükmüyle uyumludur; ifade doğrudur.
      B: TMS 38 par. 63 hükmüyle uyumludur; ifade doğrudur.
      C: TMS 38 par. 54 hükmüyle uyumludur; ifade doğrudur.
      D: TMS 38 par. 71 hükmüyle uyumludur; ifade doğrudur.
  kaynaklar:
