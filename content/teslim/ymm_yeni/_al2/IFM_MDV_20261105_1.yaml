    I. Şerefiye dışındaki bir varlık için önceki dönemlerde muhasebeleştirilen değer düşüklüğü zararı, geri kazanılabilir
    tutarın belirlenmesinde kullanılan tahminlerde son zararın muhasebeleştirilmesinden bu yana değişiklik olması hâlinde
    iptal edilir.

    II. Şerefiyeye ilişkin olarak muhasebeleştirilen değer düşüklüğü zararı, daha sonraki bir dönemde iptal edilmez.

    III. Gelecekteki nakit girişlerinin bugünkü değeri zamanın ilerlemesiyle arttığından, kullanım değeri defter değerini
    aşar hâle gelen bir varlığın değer düşüklüğü zararı yalnızca bu nedenle iptal edilir.

    IV. Yeniden değerlenmiş bir varlığa ilişkin değer düşüklüğü zararının iptali diğer kapsamlı gelirde muhasebeleştirilir
    ve yeniden değerleme fazlasını artırır; ancak aynı varlık için daha önce kâr veya zararda muhasebeleştirilen zarara isabet
    eden kısım kâr veya zarara yansıtılır.

    V. Nakit yaratan bir birime ilişkin iptal edilen değer düşüklüğü zararı, birime dağıtılmış şerefiye dahil olmak üzere
    birimin tüm varlıklarına defter değerleri oranında dağıtılır.

    '
