  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: ilk tesis ve taazzuv giderleri ve peştemallıkların itfası
  tip: hesaplama
  zorluk: 1
  kok: Yeni bir şubenin açılması için yapılan ve karşılığında maddi bir kıymet iktisap edilmeyen 750.000 TL'lik giderleri
    aktifleştiren bir kurum, bu tutarı VUK md. 326'ya göre itfa edecektir. Kurumun yıllık itfa payı kaç TL'dir?
  secenekler:
    A: 75.000 TL
    B: 150.000 TL
    C: 187.500 TL
    D: 250.000 TL
    E: 750.000 TL
  dogru: B
  aciklama:
    dogru_neden: VUK md. 282 uyarınca yeni şube açılması gibi maddi kıymet karşılığı olmayan giderler ilk tesis ve taazzuv
      gideri sayılır ve aktifleştirilmesi ihtiyaridir. Aktifleştirilen ilk tesis ve taazzuv giderleri md. 326'ya göre mukayyet
      değerleri üzerinden eşit miktarlarda ve beş yıl içinde itfa edilir. Yıllık pay = 750.000 / 5 = 150.000 TL.
    celdiriciler:
      A: 10 yıllık süreye bölünmüştür; md. 326 beş yıl içinde itfa öngörür.
      C: 4 yıllık süreye bölünmüştür; md. 326 süreyi dört yıl olarak belirlemez.
      D: 3 yıllık süreye bölünmüştür; hükümde böyle bir süre yoktur.
      E: Tutarın tamamı tek yılda gider yazılmıştır; md. 326 eşit miktarlarda ve beş yıl içinde itfa öngörür.
    hesap_adimlari:
    - 'Süre: beş yıl'
    - 750.000 / 5 = 150.000 TL
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 326
    alinti: Kurumların aktifleştirdikleri ilk tesis ve taazzuv giderleri ile peştemallıklar mukayyet değerleri üzerinden eşit
      miktarlarda ve beş yıl içinde itfa olunur.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 282
    alinti: Kurumun tesis olunması veya yeni bir şubenin açılması veyahut da işlerin devamlı bir surette genişletilmesi için
      yapılan ve karşılığında maddi bir kıymet iktisap olunmıyan giderler bu cümledendir.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
