- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: özel maliyet bedellerinin itfası
  tip: hesaplama
  zorluk: 3
  kok: Takvim yılı hesap dönemli (K) A.Ş., 1.1.2024–31.12.2028 süreli kira sözleşmesiyle tuttuğu depoda 1.1.2024'te gayrimenkulün
    değerini artıran 2.000.000 TL'lik tadilat yaptırmış, bu tutarı özel maliyet olarak aktifleştirmiş ve her yıl tam yıl itfa
    etmiştir. Şirketin 2026 yılı cirosu 90.000.000 TL'dir. Kiracı, kira sözleşmesini feshederek depoyu 30.9.2026'da boşaltmıştır.
    Bu özel maliyet bedeli için 2026 hesap döneminde toplam kaç TL gider yazılır?
  secenekler:
    A: 400.000 TL
    B: 800.000 TL
    C: 1.200.000 TL
    D: 1.600.000 TL
    E: 2.000.000 TL
  dogru: C
  aciklama:
    dogru_neden: 'VUK md. 272/3 ve md. 327''ye göre kiracının gayrimenkulün değerini artıran giderleri özel maliyet bedeli
      sayılır ve kira süresine göre eşit yüzdelerle itfa edilir. Süre 5 yıl olduğundan yıllık itfa 400.000 TL''dir; 2024 ve
      2025''te 800.000 TL itfa edilmiştir. Kira süresi dolmadan depo boşaltılırsa henüz itfa edilmemiş giderler boşaltma yılında
      bir defada gider yazılır: 2.000.000 − 800.000 = 1.200.000 TL. 2026 için ayrıca yıllık itfa payı ayrılmaz.

      Püf noktaları: Boşaltma yılında ''bakiyenin tamamı'' gider olur; yıllık payı ayrıca eklemek (1.600.000 TL) tipik hatadır.
      Ciro bu soruda gereksiz bilgidir.'
    celdiriciler:
      A: Yalnız 2026 yılının yıllık itfa payıdır; boşaltma hâlinde bakiye de bir defada gider yazılır.
      B: Önceki iki yılda itfa edilen toplamdır; 2026 gideri itfa edilmemiş bakiyedir.
      D: Boşaltma yılı itfa payı (400.000 TL) bakiyeye ayrıca eklenmiştir; bakiye zaten bu payı içerir.
      E: Özel maliyetin tamamı gider yazılmıştır; önceki yıllarda itfa edilen kısım tekrar gider olamaz.
    hesap_adimlari:
    - 'Yıllık itfa: 2.000.000 / 5 = 400.000 TL'
    - '2024–2025 itfa edilen: 800.000 TL'
    - 'Bakiye: 2.000.000 − 800.000 = 1.200.000 TL (boşaltma yılında bir defada gider)'
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 327
    alinti: Gayrimenkullerin, elektrik üretim ve dağıtım varlıklarının ve gemilerin iktisadî kıymetlerini artıran ve 272 nci
      maddede yazılı özel maliyet bedelleri, kira veya işletme hakkı süresine göre eşit yüzdelerle itfa edilir. Kira veya
      işletme hakkı süresi dolmadan, kiralanan veya işletme hakkı alınan şeyin boşaltılması veya işletme hakkının herhangi
      bir sebepten sona ermesi halinde henüz itfa edilmemiş olan giderler, boşaltma veya hakkın sona erdiği yılda bir defada
      gider yazılır.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 2000000 - 2 * (2000000 / 5)
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
