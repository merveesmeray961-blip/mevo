- id: TASLAK
  sinav: ymm
  bolum:
  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: maliyet bedelinin unsurları
  tip: hesaplama
  zorluk: 2
  kok: 'Bir şirket 2026 yılında makine satın almış ve aşağıdaki ödemeleri yapmıştır: makine bedeli 5.000.000 TL, gümrük vergisi
    400.000 TL, makinenin işletmeye nakliyesi ve montajı 200.000 TL, iktisapla doğrudan ilgili danışmanlık gideri 100.000
    TL, indirilemeyecek KDV 300.000 TL. Makine kredi ile alınmamıştır. Şirket, VUK md. 262''de maliyet bedeline ithali mükellefin
    takdirine bırakılan unsurları maliyet bedeline eklememeyi tercih etmiştir. Makinenin maliyet bedeli kaç TL''dir?'
  secenekler:
    A: 5.000.000 TL
    B: 5.400.000 TL
    C: 5.600.000 TL
    D: 5.700.000 TL
    E: 6.000.000 TL
  dogru: D
  aciklama:
    dogru_neden: VUK md. 262/2'ye göre iktisadi kıymetin iktisabıyla doğrudan ilgili gümrük vergileri, nakliye ve montaj giderleri
      ile danışmanlık giderleri maliyet bedeline dâhil edilir. İndirilemeyecek KDV'yi maliyete eklemek veya genel gider yazmak
      ise mükellefin serbestisindedir. Maliyet = 5.000.000 + 400.000 + 200.000 + 100.000 = 5.700.000 TL.
    celdiriciler:
      A: Yalnız makine bedeli alınmıştır; zorunlu giderler maliyete dâhil edilmemiştir.
      B: Nakliye, montaj ve danışmanlık giderleri unutulmuştur; bu giderler maliyete dâhildir.
      C: Danışmanlık gideri unutulmuştur; md. 262/2-b bu gideri maliyete dâhil eder.
      E: İndirilemeyecek KDV maliyete eklenmiştir; şirket bu imkânı kullanmamayı tercih ettiğinden ekleme yapılmaz.
    hesap_adimlari:
    - 5.000.000 + 400.000 + 200.000 + 100.000 = 5.700.000 TL
    - İndirilemeyecek KDV (300.000 TL) tercih gereği dışarıda bırakılır.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 262
    alinti: 'Aşağıda sayılan giderler de maliyet bedeline dâhil edilir: a) İktisadi kıymetin iktisap edilmesi veya değerinin
      artırılması ile doğrudan ilgili; gümrük vergileri, gümrük komisyonları, yükleme, boşaltma, nakliye ve montaj giderleri,'
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 262
    alinti: İktisadi kıymetin iktisap edilmesi veya değerinin artırılması ile doğrudan ilgili; resim ve harçlar, noter, tapu,
      mahkeme, değer tespiti, danışmanlık, komisyon ve ilan giderleri,
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 262
    alinti: indirilemeyecek katma değer vergisi, banka ve sigorta muameleleri vergisi ile kaynak kullanımını destekleme fonunu
      maliyet bedeline ithal etmekte veya genel giderler arasında göstermekte mükellefler serbesttirler.
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
  dogrulama:
    python: sonuc = 5000000 + 400000 + 200000 + 100000
  durum: taslak
  surum: 1
  uretim:
    kaynak_turu: yapay_zeka
    model: Claude Sonnet 5.5
