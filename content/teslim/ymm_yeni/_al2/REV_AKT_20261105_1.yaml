  - YMM
  ders: REV
  unite: Aktif hesapların revizyonu ve değerleme
  konu: AKT
  kazanim: imal edilen emtianın maliyet bedeli
  tip: hesaplama
  zorluk: 3
  kok: 'Bir imalatçı, 2026''da ürettiği tam mamullerin maliyetini hesaplarken şu bilgileri kullanmıştır: ham ve iptidai madde
    bedeli 600.000 TL, mamule isabet eden işçilik 300.000 TL, genel imal giderlerinden mamule düşen pay 150.000 TL, genel
    idare giderlerinden mamule düşen pay 50.000 TL, ambalajlı olarak piyasaya arz edilmesi zorunlu mamullerin ambalaj malzemesi
    bedeli 20.000 TL, ürünlerin dağıtımı için yapılan reklam gideri 80.000 TL. Şirket genel idare giderlerinden mamule düşen
    payı da maliyete katmayı tercih etmiştir. VUK md. 275''e göre mamulün maliyet bedeli kaç TL''dir?'
  secenekler:
    A: 900.000 TL
    B: 1.050.000 TL
    C: 1.070.000 TL
    D: 1.100.000 TL
    E: 1.120.000 TL
  dogru: E
  aciklama:
    dogru_neden: 'VUK md. 275''e göre imal edilen emtianın maliyet bedeli ham ve iptidai madde bedeli, işçilik, genel imal
      giderlerinden mamule düşen pay, genel idare giderlerinden mamule düşen pay (katılması ihtiyari) ve zorunlu ambalaj malzemesi
      bedelini kapsar. Şirket ihtiyari payı da kattığından maliyet 600.000 + 300.000 + 150.000 + 50.000 + 20.000 = 1.120.000
      TL''dir. Reklam gideri sayılan unsurlar arasında değildir.

      Püf noktaları: Genel idare payı ihtiyaridir; katıldığı için dâhil edilir. Reklam gideri gereksiz veridir. Zorunlu ambalaj
      unutulmamalıdır.'
    celdiriciler:
      A: Yalnız ham madde ve işçilik alınmıştır; genel imal payı ve ambalaj da maliyettedir.
      B: Genel idare payı ve ambalaj bedeli eklenmemiştir; şirket payı katmayı tercih etmiş, ambalaj ise zorunludur.
      C: Genel idare payı alınmamıştır; şirketin tercihi katmak yönünde olduğundan pay maliyete girer.
      D: Ambalaj malzemesi bedeli (20.000 TL) unutulmuştur; ambalajlı arzı zorunlu mamullerde maliyet unsurudur.
    hesap_adimlari:
    - 600.000 + 300.000 + 150.000 + 50.000 + 20.000 = 1.120.000 TL
    - Reklam gideri (80.000 TL) md. 275 unsurlarında yoktur.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 275
    alinti: 'İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün
      vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden
      mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.)
      5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli.'
  gecerlilik:
    baslangic: '2026-01-01'
    bitis: null
    yila_bagli_tutar: false
