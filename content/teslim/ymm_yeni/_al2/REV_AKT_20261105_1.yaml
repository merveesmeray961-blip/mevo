  tip: kavrama
  zorluk: 2
  kok: Bilanço esasına göre defter tutan bir ticari işletmenin 31.12.2026 itibarıyla aşağıdaki alacaklarından hangisi VUK
    md. 322'ye göre değersiz alacaktır? (VUK md. 323 kapsamındaki 2026 yılı tutarı 25.000 TL'dir.)
  secenekler:
    A: Borçlusu hakkında kesin aciz belgesi düzenlenmiş 80.000 TL’lik ticari alacak
    B: Hakkında dava açılmış, henüz karara bağlanmamış 120.000 TL’lik ticari alacak
    C: Yazıyla iki defa istendiği hâlde ödenmeyen 20.000 TL’lik ticari alacak
    D: Hakkında icra takibi başlatılmış, mal varlığı araştırılan 200.000 TL’lik alacak
    E: Vadesi bir yıl önce dolmuş, yazıyla hiç istenmemiş 15.000 TL’lik ticari alacak
  dogru: A
  aciklama:
    dogru_neden: VUK md. 322'ye göre kazai bir hükme veya kanaat verici bir vesikaya göre tahsiline artık imkân kalmayan alacaklar
      değersiz alacaktır. Kesin aciz belgesi tahsil imkânının kalmadığını gösteren kanaat verici vesikadır; alacak bu mahiyete
      girdiği tarihte zarara geçirilir. Diğer şıklardaki alacaklar md. 323 anlamında şüpheli olabilir veya hiç şüpheli sayılmayabilir,
      ancak tahsil imkânı henüz ortadan kalkmış değildir.
    celdiriciler:
      B: Dava safhasındaki alacak md. 323/1 gereği şüpheli alacaktır; karşılık ayrılabilir ancak zarara yazılamaz.
      C: Yazıyla birden fazla istenen ve 25.000 TL’yi aşmayan alacak md. 323/2 gereği şüpheli alacaktır, değersiz alacak değildir.
      D: İcra safhasındaki alacak şüpheli alacaktır; tahsil imkânı kesin olarak ortadan kalkmamıştır.
      E: Vade geçmesi tek başına alacağı şüpheli veya değersiz yapmaz; protesto veya yazıyla birden fazla isteme şartı da
        gerçekleşmemiştir.
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 322
    alinti: Kazai bir hükme veya kanaat verici bir vesikaya göre tahsiline artık imkan kalmıyan alacaklar, değersiz alacaktır.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 323
    alinti: Dava veya icra safhasında bulunan alacaklar;
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: VUK md. 323
    alinti: Yapılan protestoya veya yazı ile bir defadan fazla istenilmesine rağmen borçlu tarafından ödenmemiş bulunan ve
      3.000 (25.000) Türk lirasını aşmayan alacaklar;108109 Şüpheli alacak sayılır.
