  - olcut: Yıllık amortismanın 400.000 TL bulunması
    puan: 1
  - olcut: 2027 için mahsup ve sıfır gider; kalan 300.000 TL
    puan: 3
  - olcut: 2028 için 100.000 TL gider
    puan: 3
  - olcut: B makinesi kârı 900.000 TL ve fazlalık 300.000 TL
    puan: 3
  - olcut: Fazlalığın 2029 yılı kâr ve zarar hesabına eklenmesi
    puan: 3
  - olcut: Bina tazminat fazlası 600.000 TL ve geçici hesapta tutulabilmesi
    puan: 4
  - olcut: Emtia tazminat fazlasının (150.000 TL) doğrudan kâra alınması
    puan: 3
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 328/4-a
    alinti: a) Satılan iktisadi kıymetlerin yenilenmesi veya benzer mahiyetteki bir iktisadi kıymetin iktisabı, işin niteliğine
      göre zorunlu bulunur veya bu hususta işletmeyi idare edenlerce karar verilmiş ve teşebbüse geçilmiş olursa bu takdirde,
      satıştan doğan kâr, satışın yapıldığı tarihi takip eden üçüncü takvim yılının sonuna kadar pasifte geçici bir hesapta
      tutulabilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 328/4-b
    alinti: b) Pasifte geçici bir hesapta tutulan kâr, finansal kiralama yoluyla edinilenler de dâhil olmak üzere (a) bendindeki
      esaslar dâhilinde iktisap edilen bir veya birden fazla kıymetin bu Kanun hükümlerine göre ayrılacak amortismanlarına
      mahsup edilir. Bu mahsup tamamlandıktan sonra itfa edilmemiş olarak kalan değerlerin amortismanına devam olunur.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 328/4-c
    alinti: c) Pasifte geçici bir hesapta tutulan kâr, satışı yapılan iktisadi kıymetin yerine iktisap edilen yeni kıymetlerin
      amortisman ayrılabilecek tutarından fazla ise bu fazlalık, satışın yapıldığı yılı takip eden üçüncü takvim yılının kâr
      ve zarar hesabına eklenir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 329/1
    alinti: fazla veya eksik olduğu takdirde farkı kar veya zarar hesabına geçirilir.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 330
    alinti: Emtia ve zirai mahsul ve hayvan kıymetlerinde vukua gelen zayiat dolayısiyle alınan sigorta tazminatları bunların
      değerlerinden fazla olursa bu fazlalık kara alınır.
