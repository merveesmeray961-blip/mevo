    bitis: null
  dogrulama:
    python: 'kar_a = 2500000 - (3000000 - 1200000)

      yillik = 4000000 * 0.10

      m27 = min(yillik, kar_a)

      kalan27 = kar_a - m27

      g27 = yillik - m27

      m28 = min(yillik, kalan27)

      g28 = yillik - m28

      kar_b = 1900000 - 1000000

      fazla_b = kar_b - 600000

      bina_fazla = 4600000 - (5000000 - 1000000)

      emtia = 950000 - 800000

      sonuc = {''kar_a'': kar_a, ''g27'': g27, ''kalan27'': kalan27, ''g28'': g28, ''kar_b'': kar_b, ''fazla_b'': fazla_b,
      ''bina_fazla'': bina_fazla, ''emtia'': emtia}

      '
