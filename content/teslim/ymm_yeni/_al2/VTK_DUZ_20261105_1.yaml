  zorluk: 2
  puan: 20
  sure_dk: 25
  soru: '**Olay:** Vergi incelemesi yapan müfettiş, **Aksoy Tekstil A.Ş.**nin ticari ilişkilerini araştırmaktadır.


    1. Şirketle ticari ilişkisi bulunan **Bay Kenan Demir**''den (özel kişi) bilgi sözle istenmiştir; Kenan Demir bilgi vermemiştir.

    2. Bir belediyeden mükellefle ilgili bilgiler istenmiştir; belediye "kamu idaresi olduğumuz için bilgi vermek zorunda
    değiliz" demiştir.

    3. Vergi dairesi, bir bankadan düzenli aralıklarla ve devamlı olarak bilgi istemek istemektedir.

    4. Türkiye''de görev yapan, memleket dışı imtiyazlardan yararlanan yabancı Devlet memuru bilgi vermeyi reddetmiştir.


    **İstenenler:**


    (a) 1 numaralı olayda sözle istenen bilgiyi vermeyen için izlenecek yolu açıklayınız; ilgilinin vergi dairesine zorla
    getirilip getirilemeyeceğini belirtiniz. (7 puan)


    (b) 2 numaralı olayda belediyenin iddiasını değerlendiriniz. (4 puan)


    (c) 3 numaralı olayda devamlı bilgi vermenin koşullarını belirtiniz. (5 puan)


    (d) 4 numaralı olayda yabancı Devlet memurunun durumunu belirtiniz. (4 puan)

    '
  cozum: '**(a)** Bilgiler yazı veya sözle istenilir. **Sözle** istenen bilgileri vermeyenlere keyfiyet **yazı ile tekit**
    edilir ve cevap vermeleri için kendilerine **münasip bir mühlet** tayin olunur (md. 148/2). Bilgi istenmek üzere ilgililer
    vergi dairesine **zorla getirilemez**.


    **(b)** Kamu idare ve müesseseleri, mükellefler veya mükelleflerle muamelede bulunan diğer gerçek ve tüzel kişiler Maliye
    Bakanlığının veya vergi incelemesi yapmaya yetkili olanların isteyecekleri bilgileri vermeye **mecburdurlar** (md. 148/1).
    Belediye kamu idaresi olduğundan bilgi vermek zorundadır; iddia yerinde değildir.


    **(c)** Kamu idare ve müesseseleri (kamu hizmeti ifa eden kurum ve kuruluşlar dahil) ile gerçek ve tüzel kişiler vergilendirmeye
    ilişkin olaylarla ilgili olarak Maliye ve Gümrük Bakanlığı ve vergi dairesince kendilerinden **yazı ile** istenecek bilgileri
    **belli fasılalarla ve devamlı olarak yazı ile** vermeye mecburdurlar (md. 149). Bilgi isteme yazılı olmalıdır.


    **(d)** Memleket dışı imtiyazlarından faydalanan yabancı Devlet memurları bilgi verme mecburiyetine **tabi olamazlar**
    (md. 148/3).

    '
