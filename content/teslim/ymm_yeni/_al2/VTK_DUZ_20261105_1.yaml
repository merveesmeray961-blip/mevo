  zorluk: 3
  puan: 22
  sure_dk: 30
  soru: '**Olay:** **Mavi Deniz Ticaret Ltd. Şti.** nezdinde vergi incelemesi yapılmaktadır.


    1. İnceleme elemanı, bazı olay ve hesap durumlarını ayrıca tutanakla tespit etmiş; şirket yetkilisinin itirazları olduğunu
    söylemiştir. Yetkili tutanağı imzalamaktan çekinmiştir.

    2. Daha sonra aynı şirkette arama yapılmış ve defterler muhafaza altına alınmıştır. Beyanname verme süresi aramanın hemen
    sonrasında dolmaktadır.

    3. Şirket yetkilisi, muhafaza altındaki defterler üzerinde ilgili memurun huzurunda inceleme yapmak ve bunlardan suret
    çıkarmak istemektedir.

    4. Muhafaza altına alınan defterlere 219. madde gereğince zamanında kayıt yapılamamıştır; defterler iade edilmiştir.


    **İstenenler:**


    (a) 1 numaralı olayda tutanakla ilgili kuralları ve imzalamaktan çekinmenin sonucunu açıklayınız; yetkilinin sonradan
    tutanağı imzalaması halinde ne olacağını belirtiniz. (8 puan)


    (b) 2 numaralı olayda beyanname verme ödevinin durumunu açıklayınız. (4 puan)


    (c) 3 numaralı olayda yetkilinin isteminin hukuka uygunluğunu belirtiniz. (4 puan)


    (d) 4 numaralı olayda kayıtların ne zaman ve ne kadar sürede ikmal edileceğini açıklayınız. (6 puan)

    '
  cozum: '**(a)** İnceleme esnasında lüzum görülen hallerde vergilendirme ile ilgili olaylar ve hesap durumları ayrıca tutanaklar
    ile tespit ve tevsik olunabilir; **ilgililerin itiraz ve mülahazaları varsa bunlar da tutanağa geçirilir** ve tutanağın
    **bir nüshasının** mükellefe veya nezdinde inceleme yapılan kimseye bırakılması **mecburidir** (md. 141). İlgililer tutanakları
    imzalamaktan çekindikleri takdirde tutanakta bahis konusu edilen olaylar ve hesap durumlarını ihtiva eden defter veya
    vesikalar, nezdinde inceleme yapılandan **rızasına bakılmaksızın alınır** ve inceleme neticesinde tarh edilen vergiler
    ve kesilen cezalar **kesinleşinceye kadar geri verilmez**. İlgililer her zaman bu tutanakları imzalayarak defter ve vesikaları
    **geri alabilirler**; ancak bu defterlerin **suç delili olmaması** şarttır.


    **(b)** Defter ve vesikaların muhafaza altına alınmış olması, süresi gelen vergi beyannamelerinin verilmesi ödevini **kaldırmaz**;
    mükellef beyannamesini tanzim için gerekli bilgileri defter ve vesikalardan çıkarabilir (md. 144).


    **(c)** Mükellef, ilgili memurun huzuriyle, bu defterler ve vesikalar üzerinde incelemeler yapmaya ve bunlardan **suret
    ve kayıtlar çıkarmaya yetkilidir** (md. 144/3). İstek hukuka uygundur.


    **(d)** Arama neticesinde bulunan defter ve vesikaların muhafaza altına alınması sebebiyle 219. madde gereğince yapılamayan
    kayıtlar, defterlerin **geri verilmesinden sonra** idare ile mükellef arasında kararlaştırılan münasip bir süre içinde
    ikmal edilir; bu süre **bir aydan az olamaz** (md. 146). Mükellef dilerse muhafaza altına alınan defterlerin işlemlerini
    yeniden tasdik ettireceği defterlere kayıt ve iadesi halinde iade edilen defterlere intikal ettirebilir.

    '
  puanlama:
  - olcut: İtiraz ve mülahazaların tutanağa geçirilmesi ve bir nüshanın mükellefe bırakılması
