  soru: '**Olay:** (Z) Ltd. Şti.''nin vadesi 15.02.2021 olan bir kurumlar vergisi borcu ödenmemiştir. Olaylar aşağıdaki gibi
    gelişmiştir.


    - 03.06.2024: Tahsil dairesi şirketin bir taşıtına haciz uygulamıştır.

    - 01.02.2025 – 31.07.2025 (altı ay): Şirket yetkilisi yabancı memlekette bulunduğundan şirket hakkında takibat yapılamamıştır.

    - 20.09.2027: Şirket borca karşılık rızaen ödeme yapmıştır.


    Zamanaşımının kesilmesi veya durması dışında başka bir olay yoktur. Zamanaşımı sürelerinin sonu takvim yılı sonunda biter.


    **İstenenler:**


    (a) Hiçbir kesilme olmasaydı tahsil zamanaşımının hangi tarihte tamamlanacağını belirtiniz. (4 puan)


    (b) Haciz tatbikinin zamanaşımına etkisini açıklayınız ve yeni zamanaşımının tamamlanacağı tarihi bulunuz. (6 puan)


    (c) Yabancı memlekette bulunma halinin zamanaşımına etkisini açıklayınız; hesaplamalara göre zamanaşımının bitiş tarihini
    bulunuz. (7 puan)


    (d) 20.09.2027''deki ödemenin zamanaşımına etkisini açıklayınız; zamanaşımı dolduktan sonra yapılacak rızaen ödemenin
    kabul edilip edilmeyeceğini belirtiniz. (5 puan)

    '
  cozum: '**(a)** Amme alacağı, vadesinin rastladığı takvim yılını takip eden takvim yılı başından itibaren **5 yıl** içinde
    tahsil edilmezse zamanaşımına uğrar (md. 102). Vade 2021 olduğundan süre 01.01.2022''de başlar ve **31.12.2026**''da tamamlanır.


    **(b)** Haciz tatbiki zamanaşımını **keser** (md. 103/2). Kesilmeden sonra yeni süre, kesildiği yılı izleyen takvim yılı
    başından işlemeye başlar: 01.01.2025''ten itibaren 5 yıl → **31.12.2029**.


    **(c)** Borçlunun yabancı memlekette bulunması gibi nedenlerle hakkında takibat yapılmasına imkân yoksa bu hallerin devamı
    müddetince zamanaşımı **işlemez**; sebep kalktıktan sonra zamanaşımı kaldığı yerden işlemeye devam eder (md. 104). Altı
    aylık dönem süreye eklenir: 31.12.2029 + 6 ay = **30.06.2030**.


    **(d)** Ödeme zamanaşımını **keser** (md. 103/1). Zamanaşımından sonra mükellefin **rızaen yapacağı ödemeler kabul olunur**
    (md. 102/1); yani zamanaşımı borcu ortadan kaldırmaz, cebri tahsili engeller; ödeme geri istenemez.

    '
