  kok: Net aylık ücreti 60.000 TL olan bir borçlunun (asgari ücreti aştığı varsayılacaktır) ücretinden 6183 sayılı Kanun md.
    71'e göre en çok kaç TL haczedilebilir?
  secenekler:
    A: '6.000'
    B: '15.000'
    C: '20.000'
    D: '30.000'
    E: '60.000'
  dogru: C
  aciklama:
    dogru_neden: Md. 71'e göre ücretler kısmen haczedilebilir; haczolunacak miktar üçte birinden çok, dörtte birinden az olamaz.
      Asgari ücreti aşan gelirde en çok haczedilebilecek tutar 60.000 × 1/3 = 20.000 TL'dir.
    celdiriciler:
      A: Onda bir oranı yalnız asgari ücreti aşmayan aylık gelirler için geçerlidir.
      B: Dörtte bir alt sınırdır; azami tutar değildir.
      D: Yarısı alınmıştır; kanunda yarı sınırı yoktur.
      E: Ücretin tamamı haczedilemez.
    hesap_adimlari:
    - 60.000 × 1/3 = 20.000
