  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 6/1
    alinti: 'Beşinci maddede yazılı olanlar: 1. Kendilerine, nişanlılarına ve boşanmış olsalar bile eşlerine; 2. Kan veya
      sıhri usul ve füruuna, evlatlığına veya kendisini evlat edinene yahut kan hısımlığında üçüncü (Bu derece dahil), sıhri
      hısımlıkta, bu hısımlığı meydana getiren evlenme ortadan kalkmış olsa bile, üçüncü (Bu derece dahil) dereceye kadar
      olan civar hısımlarına; 3. Kanuni temsilcisi veya vekili bulundukları kimselere; Ait vergi inceleme ve takdir işleriyle
      uğraşamazlar.'
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 6/son
    alinti: Vergi muameleleri ve incelemeleri ile vergi mahkemeleri, bölge idare mahkemeleri ve Danıştayda görevli olanlar,
      mükelleflerin vergi kanunlarının uygulanması ile ilgili hesap, yazı ve sair özel işlerini ücretsiz de olsa yapamazlar.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 5 (görevden ayrılma)
    alinti: Bu yasak, yukarıda yazılı kimseler, bu görevlerinden ayrılsalar dahi devam eder.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 5 (sahte belge bildirimi)
    alinti: Sahte veya muhteviyatı itibariyle yanıltıcı belge düzenledikleri veya kullandıkları vergi inceleme raporuyla tespit
      olunanların, kanunla kurulmuş mesleki kuruluşlarına ve 3568 sayılı Kanunla kurulan birlik ve meslek odalarına bildirilmesi
      vergi mahremiyetini ihlal sayılmaz.
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 5 (levha)
    alinti: her yıl Mayıs ayının son gününe kadar vergi tarhına esas olan kazanç tutarları ile bunlara isabet eden vergi
