  dogrulama:
    python: "def derece(yukari, asagi):\n    return yukari + asagi\nkayinbirader = derece(1, 1)\namca_oglu = derece(2, 2)\n\
      teyze = derece(2, 1)\nyegen = derece(1, 2)\nsonuc = {'kayinbirader': kayinbirader, 'amca_oglu': amca_oglu, 'teyze':\
      \ teyze, 'yegen': yegen,\n         'yasakli': [d <= 3 for d in (kayinbirader, amca_oglu, teyze, yegen)]}\n"
