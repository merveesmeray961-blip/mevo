  - olcut: 2 numaralının 4. derece olduğundan yasaklı olmaması
    puan: 2
  - olcut: 'I numaralı olay: görevden ayrılma sonrası da süren mahremiyet yasağı'
    puan: 2
  - olcut: II ve III numaralı olaylarda ihlal bulunmaması
    puan: 4
  - olcut: IV numaralı olayda ücretsiz de olsa özel işlerin yapılamaması
    puan: 2
  - olcut: Yasak kapsamındaki kimseler ve sırların ifşa/kendi çıkarına kullanma yasağı
    puan: 4
  - olcut: Levhanın alınması ve Mayıs ayının son günü süresi
    puan: 5
