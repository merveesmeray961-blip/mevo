  kazanim: re'sen takdirde matrahın bildirilen matrahla karşılaştırılması
  tip: hesaplama
  zorluk: 3
  kok: Kurumlar vergisi oranı %25 alınacaktır. (M) A.Ş. için re'sen takdir edilen matrah 2.400.000 TL, kurumun beyan ettiği
    matrah 1.750.000 TL'dir. VUK md. 33'e göre re'sen tarh edilecek kurumlar vergisi kaç TL'dir?
  secenekler:
    A: '130.000'
    B: '162.500'
    C: '437.500'
    D: '600.000'
    E: '650.000'
  dogru: B
  aciklama:
    dogru_neden: 'Re''sen takdir olunan matrah bildirilen matrahtan fazla olduğundan yalnızca aradaki fark üzerinden vergi
      tarh edilir: (2.400.000 − 1.750.000) × %25 = 162.500 TL. Püf noktaları: tarh edilecek tutar matrah farkıdır, takdir
      edilen matrahın tamamı değildir; sonuç vergi olduğundan oran uygulanmalıdır.'
    celdiriciler:
      A: Fark %20 ile çarpılmış; oran %25 verilmiştir.
      C: Beyan edilen matrahın vergisidir (1.750.000 × %25); tarh edilecek tutar fark üzerindendir.
      D: Takdir edilen matrahın tamamı vergilendirilmiş; md. 33 yalnız farkı tarh eder.
      E: Matrah farkı verilmiş; vergi için oran uygulanmamıştır.
    hesap_adimlari:
    - 2.400.000 − 1.750.000 = 650.000
    - 650.000 × 0,25 = 162.500
  kaynaklar:
  - mevzuat: 213 sayılı Vergi Usul Kanunu
    madde: md. 33
    alinti: Madde 33 – Re'sen takdir olunan matrah, mükellef tarafından bildirilen matrahtan fazla değilse, re'sen vergi tarh
      edilmez; fazla ise sadece aradaki fark üzerinden vergi tarh olunur.
